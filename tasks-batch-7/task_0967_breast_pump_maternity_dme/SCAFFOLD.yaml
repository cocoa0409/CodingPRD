# =============================================================================
# SCAFFOLD.yaml — Breast-Pump & Maternity DME Supplier (task 0967)
# §1.0–§1.7 seed tables. Difficulty target: beyond Expert band (density-first).
# =============================================================================

scenario: |
  967. Breast-Pump & Maternity DME Supplier: insurance qualification & order, pump model & upgrade, resupply schedule (parts) & eligibility, compression/maternity add-on, shipping & tracking, prior-auth & billing, warranty, reorder

domain_name: breast-pump-maternity-dme
api_prefix: /dme

complexity_profile:
  primary_archetype: temporal_windowing        # resupply eligibility windows, benefit periods, warranty windows
  secondary_archetype: ledger_reconciliation   # provisional vs adjudicated claim amounts
  complexity_layers:
    - optimistic_concurrency                   # OCC on PumpOrder.version and ResupplySchedule.version
    - cascading_side_effects                   # delivery -> order -> schedules -> member; warranty resolve -> replacement shipment -> order posture
    - dual_variant_calculation                 # provisional vs adjudicated responsibility; ROLLING vs CALENDAR_ANCHORED resupply cadence
    - rate_threshold_triggers                  # prior-auth dollar threshold, garment allowance cap, warranty replacement cap
  entity_topology: flat                        # peer entities linked by FK references; no nested creation paths
  state_machine_shape: parallel                # PumpOrder carries fulfillment_status x billing_status; several cyclic machines
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic                              # Shipment / Claim reference either PumpOrder or ResupplyOrder (exactly one FK set)
  role_model: segregation_of_duties            # claim submitter may not post that claim's remittance
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patient full name" }
      - { name: email, type: string, source: input, description: "Patient email; unique across members" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: shipping_address, type: string, source: input, description: "Default ship-to address" }
      - { name: out_of_pocket_balance_cents, type: integer, source: computed, default: 0, description: "Sum of patient_responsibility_cents over this member's Claims with status ADJUDICATED; debited at remit, credited at void" }
      - { name: oop_accumulated_cents, type: integer, source: computed, default: 0, description: "Cumulative patient responsibility applied toward policy OOP max; increased at remit, decreased at void" }
      - { name: next_resupply_date, type: string, source: computed, description: "Min next_eligible_date over this member's ResupplySchedules with status ACTIVE; null when none", default: null }
      - { name: active_schedule_count, type: integer, source: computed, default: 0, description: "Count of this member's ResupplySchedules with status ACTIVE" }

  - name: InsurancePolicy
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; policyholder" }
      - { name: payer_name, type: string, source: input, description: "Payer name" }
      - { name: plan_type, type: enum, source: input, description: "COMMERCIAL_PPO | MEDICAID | MEDICARE_ADVANTAGE" }
      - { name: benefit_period_start, type: string, source: input, description: "ISO date; half-open interval start (inclusive)" }
      - { name: benefit_period_end, type: string, source: input, description: "ISO date; half-open interval end (exclusive)" }
      - { name: requires_prior_auth, type: boolean, source: input, default: false, description: "When true every pump order needs an APPROVED PriorAuthorization before shipment" }
      - { name: prior_auth_threshold_cents, type: integer, source: input, default: 50000, description: "Pump orders with provisional_allowed_cents >= this threshold require prior auth even when requires_prior_auth is false" }
      - { name: pump_allowance_per_period, type: integer, source: input, default: 1, description: "Max pumps consumed per benefit period" }
      - { name: pumps_consumed_count, type: integer, source: computed, default: 0, description: "Pumps consumed: incremented at qualify, decremented at cancel of a QUALIFIED order" }
      - { name: garment_allowance_per_period, type: integer, source: input, default: 0, description: "Max compression-garment units per benefit period" }
      - { name: garments_consumed_count, type: integer, source: computed, default: 0, description: "Garment units consumed: incremented at qualify by order garment quantity, decremented at cancel" }
      - { name: resupply_frequency_days, type: integer, source: input, default: 90, description: "Default days between resupply fulfillments for parts" }
      - { name: schedule_mode, type: enum, source: input, default: "ROLLING", description: "ROLLING | CALENDAR_ANCHORED — resupply cadence variant" }
      - { name: deductible_cents, type: integer, source: input, default: 0, description: "Annual deductible" }
      - { name: deductible_met_cents, type: integer, source: computed, default: 0, description: "Deductible applied so far; updated by claim remit/void" }
      - { name: coinsurance_pct, type: number, source: input, default: 0, description: "Patient coinsurance fraction in [0,1]" }
      - { name: oop_max_cents, type: integer, source: input, default: 0, description: "Out-of-pocket max; 0 means no cap" }
      - { name: upgrade_coverage, type: boolean, source: input, default: false, description: "Whether UPGRADE-tier pumps are covered (patient still pays upgrade_fee_cents)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | TERMINATED" }

  - name: Prescription
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; prescribed patient" }
      - { name: diagnosis_code, type: string, source: input, description: "ICD-10 style diagnosis code" }
      - { name: pump_type, type: enum, source: input, description: "SINGLE_ELECTRIC | DOUBLE_ELECTRIC | HOSPITAL_GRADE" }
      - { name: issued_date, type: string, source: input, description: "ISO date issued" }
      - { name: expiration_date, type: string, source: input, description: "ISO date; prescription unusable after this date" }
      - { name: status, type: enum, source: system, description: "PENDING_VERIFICATION | VERIFIED | REJECTED | CONSUMED | EXPIRED" }
      - { name: rejection_reason, type: string, source: system, default: null, description: "Set by reject transition" }
      - { name: verified_by_user_id, type: string, source: system, default: null, description: "X-User-ID of verifying InsuranceSpecialist" }
      - { name: consumed_by_order_id, type: string, source: system, default: null, description: "FK -> PumpOrder.id; order that consumed this prescription; cleared if that order is cancelled" }

  - name: CatalogItem
    parent: null
    common_fields: true
    fields:
      - { name: item_type, type: enum, source: input, description: "PUMP | PART | COMPRESSION_GARMENT" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: sku, type: string, source: input, description: "Unique SKU" }
      - { name: unit_price_cents, type: integer, source: input, description: "List/allowed price per unit" }
      - { name: insurance_tier, type: enum, source: input, default: "STANDARD", description: "STANDARD | UPGRADE; only meaningful for PUMP" }
      - { name: upgrade_fee_cents, type: integer, source: input, default: 0, description: "Flat patient-paid upgrade surcharge for UPGRADE pumps; excluded from deductible/coinsurance base" }
      - { name: covered_under_resupply, type: boolean, source: input, default: false, description: "PART items: whether a ResupplySchedule is auto-created on pump-order delivery" }
      - { name: max_qty_per_frequency, type: integer, source: input, default: 0, description: "PART items: max units per resupply fulfillment" }
      - { name: warranty_months, type: integer, source: input, default: 0, description: "PUMP items: warranty length from delivery_date" }
      - { name: pump_type, type: enum, source: input, default: null, description: "PUMP items: SINGLE_ELECTRIC | DOUBLE_ELECTRIC | HOSPITAL_GRADE; must match prescription pump_type" }

  - name: PumpOrder
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; ordering patient" }
      - { name: policy_id, type: string, source: input, description: "FK -> InsurancePolicy.id; policy billed" }
      - { name: prescription_id, type: string, source: input, description: "FK -> Prescription.id; supporting prescription" }
      - { name: pump_item_id, type: string, source: input, description: "FK -> CatalogItem.id; selected pump model" }
      - { name: shipping_address, type: string, source: input, description: "Ship-to address snapshot" }
      - { name: fulfillment_status, type: enum, source: system, description: "PENDING_QUALIFICATION | QUALIFIED | SHIPPED | DELIVERED | CANCELLED — parallel dimension 1" }
      - { name: billing_status, type: enum, source: system, description: "UNBILLED | AUTH_PENDING | AUTH_APPROVED | CLAIM_FILED | ADJUDICATED | DENIED — parallel dimension 2, evolves independently" }
      - { name: prior_auth_required, type: boolean, source: computed, default: false, description: "Set at qualify: policy.requires_prior_auth OR provisional_allowed_cents >= policy.prior_auth_threshold_cents" }
      - { name: provisional_allowed_cents, type: integer, source: computed, default: 0, description: "Forward-looking estimate of payer-allowed amount, computed at qualify from pump unit price minus upgrade fee" }
      - { name: provisional_patient_cents, type: integer, source: computed, default: 0, description: "Forward-looking estimate of patient responsibility at qualify; uses deductible state at qualify time" }
      - { name: upgrade_fee_cents, type: integer, source: computed, default: 0, description: "Snapshot of catalog upgrade_fee_cents for the selected pump (0 for STANDARD)" }
      - { name: merchandise_subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of OrderLine.line_total_cents before discounts" }
      - { name: discount_total_cents, type: integer, source: computed, default: 0, description: "Sum of OrderLine.discount_cents (bundle discount on garment lines)" }
      - { name: order_total_cents, type: integer, source: computed, default: 0, description: "merchandise_subtotal_cents - discount_total_cents" }
      - { name: delivery_date, type: string, source: system, default: null, description: "ISO date of first delivery; anchors resupply schedules and warranty window" }
      - { name: replacement_count, type: integer, source: system, default: 0, description: "Warranty replacement shipments created for this order" }
      - { name: warranty_blocked, type: boolean, source: computed, default: false, description: "True once replacement_count >= MAX_WARRANTY_REPLACEMENTS (2); blocks new warranty claims" }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> PumpOrder.id; owning order (from path)" }
      - { name: catalog_item_id, type: string, source: input, description: "FK -> CatalogItem.id; item purchased" }
      - { name: line_type, type: enum, source: system, description: "PUMP_PRIMARY | ADDON_GARMENT" }
      - { name: quantity, type: integer, source: input, description: "Units; PUMP_PRIMARY always 1" }
      - { name: unit_price_cents, type: integer, source: system, description: "Price snapshot from CatalogItem at line creation" }
      - { name: line_total_cents, type: integer, source: computed, description: "round_half_up(quantity * unit_price_cents) — per-line rounding is pinned" }
      - { name: discount_cents, type: integer, source: computed, default: 0, description: "Bundle discount allocated to this line (garment lines only)" }

  - name: PriorAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: pump_order_id, type: string, source: input, description: "FK -> PumpOrder.id; order seeking authorization" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; derived from the order" }
      - { name: policy_id, type: string, source: system, description: "FK -> InsurancePolicy.id; derived from the order" }
      - { name: requested_item_tier, type: enum, source: system, description: "STANDARD | UPGRADE; snapshot of the ordered pump's tier" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | PENDED | APPROVED | DENIED | APPEALED | DENIED_FINAL | EXPIRED | WITHDRAWN" }
      - { name: auth_number, type: string, source: system, default: null, description: "Payer-issued authorization number on approval" }
      - { name: approved_until, type: string, source: system, default: null, description: "ISO date; shipment must occur on or before this date" }
      - { name: submission_count, type: integer, source: system, default: 1, description: "Number of times submitted to payer; incremented on resubmit" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the InsuranceSpecialist who created the PA" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID recorded at latest payer decision" }
      - { name: payer_notes, type: string, source: system, default: null, description: "Payer notes from latest decision" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: pump_order_id, type: string, source: input, default: null, description: "FK -> PumpOrder.id; exactly one of pump_order_id / resupply_order_id must be set" }
      - { name: resupply_order_id, type: string, source: input, default: null, description: "FK -> ResupplyOrder.id; exactly one of pump_order_id / resupply_order_id must be set" }
      - { name: carrier, type: string, source: input, description: "Carrier name" }
      - { name: tracking_number, type: string, source: input, description: "Carrier tracking number" }
      - { name: status, type: enum, source: system, description: "LABEL_CREATED | IN_TRANSIT | OUT_FOR_DELIVERY | DELIVERED | RETURNED | LOST" }
      - { name: is_warranty_replacement, type: boolean, source: system, default: false, description: "True when auto-created by a warranty APPROVED_REPLACE resolution" }
      - { name: shipped_at, type: string, source: system, description: "ISO datetime at creation" }
      - { name: delivered_at, type: string, source: system, default: null, description: "ISO datetime at DELIVERED" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: pump_order_id, type: string, source: input, default: null, description: "FK -> PumpOrder.id; exactly one of pump_order_id / resupply_order_id must be set" }
      - { name: resupply_order_id, type: string, source: input, default: null, description: "FK -> ResupplyOrder.id; exactly one of pump_order_id / resupply_order_id must be set" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; derived from the source order" }
      - { name: policy_id, type: string, source: system, description: "FK -> InsurancePolicy.id; derived from the source order" }
      - { name: claim_number, type: string, source: system, description: "Server-minted claim reference" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ADJUDICATED | DENIED | APPEALED | VOID" }
      - { name: provisional_allowed_cents, type: integer, source: computed, description: "Forward-looking allowed estimate frozen at claim creation (order provisional for pump orders; line total for resupply orders)" }
      - { name: adjudicated_allowed_cents, type: integer, source: system, default: null, description: "Payer-allowed amount from remittance" }
      - { name: deductible_applied_cents, type: integer, source: system, default: 0, description: "Portion of allowed applied to deductible at remit; reversed at void" }
      - { name: patient_responsibility_cents, type: integer, source: computed, default: null, description: "Computed at remit by adjudication_waterfall" }
      - { name: insurance_paid_cents, type: integer, source: system, default: null, description: "Payer payment from remittance" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of claim creator; segregation-of-duties anchor" }
      - { name: remitted_by_user_id, type: string, source: system, default: null, description: "X-User-ID of remittance poster; must differ from submitted_by_user_id" }
      - { name: remittance_reference, type: string, source: system, default: null, description: "Payer remittance reference" }
      - { name: remitted_at, type: string, source: system, default: null, description: "ISO datetime of latest remittance" }

  - name: ResupplySchedule
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; derived from originating pump order" }
      - { name: pump_order_id, type: string, source: system, description: "FK -> PumpOrder.id; originating delivered order" }
      - { name: catalog_item_id, type: string, source: system, description: "FK -> CatalogItem.id; the PART this schedule covers" }
      - { name: frequency_days, type: integer, source: system, description: "Copied from policy.resupply_frequency_days at creation; adjustable via PATCH" }
      - { name: schedule_mode, type: enum, source: system, description: "ROLLING | CALENDAR_ANCHORED; snapshot of policy.schedule_mode at creation" }
      - { name: anchor_date, type: string, source: system, description: "Pump order delivery_date; cadence anchor" }
      - { name: last_fulfilled_date, type: string, source: system, default: null, description: "Date of latest non-cancelled ResupplyOrder creation; rolled back on cancel of the latest order" }
      - { name: next_eligible_date, type: string, source: computed, description: "Next date a resupply order may be created; per resupply_next_eligible_date calculation" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | ENDED" }

  - name: ResupplyOrder
    parent: null
    common_fields: true
    fields:
      - { name: schedule_id, type: string, source: input, description: "FK -> ResupplySchedule.id; schedule being drawn against" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; must equal schedule.member_id" }
      - { name: quantity, type: integer, source: input, description: "Units requested" }
      - { name: unit_price_cents, type: integer, source: system, description: "Snapshot of part unit price" }
      - { name: total_cents, type: integer, source: computed, description: "round_half_up(quantity * unit_price_cents)" }
      - { name: status, type: enum, source: system, description: "APPROVED | SHIPPED | DELIVERED | CANCELLED" }
      - { name: fulfilled_date, type: string, source: system, description: "ISO date the order was created (counts as fulfillment for pacing)" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: pump_order_id, type: string, source: input, description: "FK -> PumpOrder.id; the delivered pump order under warranty" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; derived from the order" }
      - { name: serial_number, type: string, source: input, description: "Device serial number" }
      - { name: issue_type, type: enum, source: input, description: "MOTOR_FAILURE | BATTERY_FAILURE | SUCTION_LOSS | PHYSICAL_DAMAGE | OTHER" }
      - { name: description, type: string, source: input, default: null, description: "Free-text issue description" }
      - { name: status, type: enum, source: system, description: "OPENED | APPROVED_REPAIR | APPROVED_REPLACE | DENIED | RESOLVED" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Number of DENIED -> OPENED reopens; max MAX_REOPENS (2)" }
      - { name: resolution_notes, type: string, source: system, default: null, description: "Notes from decide/resolve" }
      - { name: replacement_shipment_id, type: string, source: system, default: null, description: "FK -> Shipment.id; replacement shipment created on APPROVED_REPLACE resolve" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: InsurancePolicy
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: POST /dme/policies/{id}/terminate
        actor: PlatformAdmin
        preconditions: ["policy.status == ACTIVE"]
        side_effects:
          - "Every ResupplySchedule whose pump_order_id belongs to a PumpOrder with policy_id == this policy and whose status is ACTIVE or SUSPENDED transitions to ENDED"
          - "Affected members' next_resupply_date and active_schedule_count recomputed"

  - entity: Prescription
    initial_state: PENDING_VERIFICATION
    terminal_states: [EXPIRED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: POST /dme/prescriptions/{id}/verify
        actor: InsuranceSpecialist
        preconditions: ["current date <= expiration_date (else ERR_PRESCRIPTION_EXPIRED)"]
        side_effects: ["verified_by_user_id := X-User-ID", "prescription.version += 1"]
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: POST /dme/prescriptions/{id}/reject
        actor: InsuranceSpecialist
        preconditions: []
        side_effects: ["rejection_reason := payload.rejection_reason", "prescription.version += 1"]
      - from: REJECTED
        to: PENDING_VERIFICATION
        trigger: POST /dme/prescriptions/{id}/resubmit
        actor: CareCoordinator
        preconditions: ["current date <= expiration_date (else ERR_PRESCRIPTION_EXPIRED)"]
        side_effects: ["rejection_reason := null", "prescription.version += 1"]
        note: "Cyclic loop: REJECTED -> PENDING_VERIFICATION -> ... allowed indefinitely"
      - from: VERIFIED
        to: CONSUMED
        trigger: "system: cascade of POST /dme/pump-orders/{id}/qualify"
        actor: system
        preconditions: ["the qualifying order's prescription_id == this prescription"]
        side_effects: ["consumed_by_order_id := order id", "prescription.version += 1"]
      - from: CONSUMED
        to: VERIFIED
        trigger: "system: compensating cascade of POST /dme/pump-orders/{id}/cancel when the order was QUALIFIED"
        actor: system
        preconditions: ["consumed_by_order_id == the cancelled order"]
        side_effects: ["consumed_by_order_id := null", "prescription.version += 1"]
      - from: PENDING_VERIFICATION
        to: EXPIRED
        trigger: "system: lazy expiry evaluation — when verify or resubmit is attempted and current date > expiration_date, the prescription transitions to EXPIRED and the call is rejected with ERR_PRESCRIPTION_EXPIRED"
        actor: system
        preconditions: ["current date > expiration_date at evaluation time"]
        side_effects: ["prescription.version += 1"]
      - from: VERIFIED
        to: EXPIRED
        trigger: "system: lazy expiry evaluation — when pump-order qualify is attempted against this prescription and current date > expiration_date, the prescription transitions to EXPIRED and the call is rejected with ERR_PRESCRIPTION_EXPIRED"
        actor: system
        preconditions: ["current date > expiration_date at evaluation time"]
        side_effects: ["prescription.version += 1"]

  - entity: PumpOrder
    initial_state: PENDING_QUALIFICATION
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: PENDING_QUALIFICATION
        to: QUALIFIED
        trigger: POST /dme/pump-orders/{id}/qualify
        actor: InsuranceSpecialist
        preconditions:
          - "fulfillment_status == PENDING_QUALIFICATION"
          - "policy.status == ACTIVE (ERR_POLICY_NOT_ACTIVE)"
          - "current date within [policy.benefit_period_start, policy.benefit_period_end) (ERR_BENEFIT_PERIOD_ENDED)"
          - "prescription.status == VERIFIED (ERR_PRESCRIPTION_NOT_VERIFIED)"
          - "current date <= prescription.expiration_date (ERR_PRESCRIPTION_EXPIRED)"
          - "prescription.pump_type == pump item pump_type (ERR_PUMP_TYPE_MISMATCH)"
          - "policy.pumps_consumed_count < policy.pump_allowance_per_period (ERR_PUMP_ALLOWANCE_EXHAUSTED)"
          - "if pump item insurance_tier == UPGRADE then policy.upgrade_coverage == true (ERR_UPGRADE_TIER_NOT_COVERED)"
        side_effects:
          - "runs provisional_patient_responsibility: sets provisional_allowed_cents, provisional_patient_cents, upgrade_fee_cents"
          - "runs prior_auth_requirement: sets prior_auth_required"
          - "policy.pumps_consumed_count += 1; policy.garments_consumed_count += sum of ADDON_GARMENT line quantities; policy.version += 1"
          - "prescription -> CONSUMED with consumed_by_order_id := this order"
          - "order.version += 1"
      - from: QUALIFIED
        to: SHIPPED
        trigger: "system: cascade of POST /dme/shipments with pump_order_id == this order (non-replacement)"
        actor: system
        preconditions: ["shipment gate passed: prior_auth_required == false OR an APPROVED PriorAuthorization exists with current date <= approved_until"]
        side_effects: ["order.version += 1"]
      - from: SHIPPED
        to: DELIVERED
        trigger: "system: cascade of POST /dme/shipments/{id}/advance to DELIVERED on the order's non-replacement shipment"
        actor: system
        preconditions: []
        side_effects:
          - "delivery_date := current date; order.version += 1"
          - "cascade depth-2: for every CatalogItem with item_type == PART and covered_under_resupply == true, create a ResupplySchedule (member_id/pump_order_id from this order, frequency_days and schedule_mode snapshotted from the policy, anchor_date := delivery_date, next_eligible_date per resupply_next_eligible_date, status ACTIVE)"
          - "cascade depth-3: member.active_schedule_count and member.next_resupply_date recomputed over the member's ACTIVE schedules; member.version += 1"
      - from: PENDING_QUALIFICATION
        to: CANCELLED
        trigger: POST /dme/pump-orders/{id}/cancel
        actor: Member
        preconditions: ["fulfillment_status IN {PENDING_QUALIFICATION}"]
        side_effects: ["order.version += 1"]
      - from: QUALIFIED
        to: CANCELLED
        trigger: POST /dme/pump-orders/{id}/cancel
        actor: Member
        preconditions: ["fulfillment_status == QUALIFIED"]
        side_effects:
          - "compensation: policy.pumps_consumed_count -= 1; policy.garments_consumed_count -= order garment quantity; policy.version += 1"
          - "compensation: prescription CONSUMED -> VERIFIED, consumed_by_order_id := null"
          - "cascade: any PriorAuthorization with pump_order_id == this order and status IN {SUBMITTED, PENDED} -> WITHDRAWN"
          - "order.version += 1"

  - entity: PumpOrderBilling
    note: "Parallel state dimension billing_status on the PumpOrder entity; evolves independently of fulfillment_status"
    initial_state: UNBILLED
    terminal_states: []
    transitions:
      - from: UNBILLED
        to: AUTH_PENDING
        trigger: "system: cascade of POST /dme/prior-authorizations"
        actor: system
        preconditions: ["order.fulfillment_status == QUALIFIED", "order.prior_auth_required == true"]
        side_effects: ["order.version += 1"]
      - from: AUTH_PENDING
        to: AUTH_APPROVED
        trigger: "system: cascade of payer-decision APPROVED on the order's latest PA"
        actor: system
        preconditions: []
        side_effects: ["order.version += 1"]
      - from: AUTH_PENDING
        to: DENIED
        trigger: "system: cascade of payer-decision DENIED or DENIED_FINAL on the order's latest PA"
        actor: system
        preconditions: []
        side_effects: ["order.version += 1"]
      - from: DENIED
        to: AUTH_PENDING
        trigger: "system: cascade of POST /dme/prior-authorizations/{id}/appeal"
        actor: system
        preconditions: []
        side_effects: ["order.version += 1"]
      - from: UNBILLED
        to: CLAIM_FILED
        trigger: "system: cascade of POST /dme/claims (prior_auth_required == false path)"
        actor: system
        preconditions: ["order.fulfillment_status == DELIVERED"]
        side_effects: ["order.version += 1"]
      - from: AUTH_APPROVED
        to: CLAIM_FILED
        trigger: "system: cascade of POST /dme/claims"
        actor: system
        preconditions: ["order.fulfillment_status == DELIVERED"]
        side_effects: ["order.version += 1"]
      - from: CLAIM_FILED
        to: ADJUDICATED
        trigger: "system: cascade of POST /dme/claims/{id}/remit with outcome APPROVED"
        actor: system
        preconditions: []
        side_effects: ["order.version += 1"]
      - from: CLAIM_FILED
        to: DENIED
        trigger: "system: cascade of POST /dme/claims/{id}/remit with outcome DENIED"
        actor: system
        preconditions: []
        side_effects: ["order.version += 1"]
      - from: DENIED
        to: CLAIM_FILED
        trigger: "system: cascade of POST /dme/claims/{id}/appeal"
        actor: system
        preconditions: []
        side_effects: ["order.version += 1"]
      - from: ADJUDICATED
        to: CLAIM_FILED
        trigger: "system: cascade of POST /dme/claims/{id}/void"
        actor: system
        preconditions: []
        side_effects: ["order.version += 1"]

  - entity: PriorAuthorization
    initial_state: SUBMITTED
    terminal_states: [DENIED_FINAL, EXPIRED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: POST /dme/prior-authorizations/{id}/payer-decision
        actor: PlatformAdmin
        preconditions: ["decision == APPROVED", "approved_until provided"]
        side_effects: ["auth_number := payload.auth_number", "approved_until := payload.approved_until", "decided_by_user_id := X-User-ID", "order.billing_status -> AUTH_APPROVED", "pa.version += 1"]
      - from: SUBMITTED
        to: DENIED
        trigger: POST /dme/prior-authorizations/{id}/payer-decision
        actor: PlatformAdmin
        preconditions: ["decision == DENIED"]
        side_effects: ["order.billing_status -> DENIED", "decided_by_user_id := X-User-ID", "pa.version += 1"]
      - from: SUBMITTED
        to: PENDED
        trigger: POST /dme/prior-authorizations/{id}/payer-decision
        actor: PlatformAdmin
        preconditions: ["decision == PENDED"]
        side_effects: ["payer_notes := payload.payer_notes", "pa.version += 1"]
      - from: PENDED
        to: SUBMITTED
        trigger: POST /dme/prior-authorizations/{id}/resubmit
        actor: InsuranceSpecialist
        preconditions: ["status == PENDED"]
        side_effects: ["submission_count += 1", "pa.version += 1"]
        note: "Cyclic loop SUBMITTED -> PENDED -> SUBMITTED, unbounded"
      - from: DENIED
        to: APPEALED
        trigger: POST /dme/prior-authorizations/{id}/appeal
        actor: InsuranceSpecialist
        preconditions: ["status == DENIED"]
        side_effects: ["order.billing_status -> AUTH_PENDING", "pa.version += 1"]
      - from: APPEALED
        to: APPROVED
        trigger: POST /dme/prior-authorizations/{id}/payer-decision
        actor: PlatformAdmin
        preconditions: ["decision == APPROVED", "approved_until provided"]
        side_effects: ["auth_number := payload.auth_number", "approved_until := payload.approved_until", "order.billing_status -> AUTH_APPROVED", "pa.version += 1"]
      - from: APPEALED
        to: DENIED_FINAL
        trigger: POST /dme/prior-authorizations/{id}/payer-decision
        actor: PlatformAdmin
        preconditions: ["decision == DENIED"]
        side_effects: ["order.billing_status -> DENIED", "pa.version += 1"]
      - from: APPROVED
        to: EXPIRED
        trigger: "system: lazy expiry evaluation — when POST /dme/shipments is attempted for the order and current date > approved_until, this PA transitions to EXPIRED and the shipment is rejected with ERR_PRIOR_AUTH_EXPIRED"
        actor: system
        preconditions: ["current date > approved_until", "order.fulfillment_status not in {SHIPPED, DELIVERED}"]
        side_effects: ["order.billing_status -> AUTH_PENDING", "pa.version += 1"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "system: cascade of pump-order cancel"
        actor: system
        preconditions: []
        side_effects: ["pa.version += 1"]
      - from: PENDED
        to: WITHDRAWN
        trigger: "system: cascade of pump-order cancel"
        actor: system
        preconditions: []
        side_effects: ["pa.version += 1"]

  - entity: Shipment
    initial_state: LABEL_CREATED
    terminal_states: [DELIVERED, RETURNED, LOST]
    transitions:
      - from: LABEL_CREATED
        to: IN_TRANSIT
        trigger: POST /dme/shipments/{id}/advance
        actor: WarehouseOperator
        preconditions: ["to_status == IN_TRANSIT"]
        side_effects: ["shipment.version += 1"]
      - from: IN_TRANSIT
        to: OUT_FOR_DELIVERY
        trigger: POST /dme/shipments/{id}/advance
        actor: WarehouseOperator
        preconditions: ["to_status == OUT_FOR_DELIVERY"]
        side_effects: ["shipment.version += 1"]
      - from: OUT_FOR_DELIVERY
        to: DELIVERED
        trigger: POST /dme/shipments/{id}/advance
        actor: WarehouseOperator
        preconditions: ["to_status == DELIVERED"]
        side_effects:
          - "delivered_at := current timestamp; shipment.version += 1"
          - "if pump_order_id set and is_warranty_replacement == false and order.fulfillment_status == SHIPPED: order SHIPPED -> DELIVERED with its full delivery cascade (schedules created, member recomputed)"
          - "if pump_order_id set and is_warranty_replacement == true: no order transition, no schedule creation"
          - "if resupply_order_id set and resupply order status == SHIPPED: resupply order SHIPPED -> DELIVERED"
      - from: LABEL_CREATED
        to: LOST
        trigger: POST /dme/shipments/{id}/advance
        actor: WarehouseOperator
        preconditions: ["to_status == LOST"]
        side_effects: ["shipment.version += 1"]
      - from: IN_TRANSIT
        to: LOST
        trigger: POST /dme/shipments/{id}/advance
        actor: WarehouseOperator
        preconditions: ["to_status == LOST"]
        side_effects: ["shipment.version += 1"]
      - from: OUT_FOR_DELIVERY
        to: RETURNED
        trigger: POST /dme/shipments/{id}/advance
        actor: WarehouseOperator
        preconditions: ["to_status == RETURNED"]
        side_effects: ["shipment.version += 1"]

  - entity: Claim
    initial_state: SUBMITTED
    terminal_states: [VOID]
    transitions:
      - from: SUBMITTED
        to: ADJUDICATED
        trigger: POST /dme/claims/{id}/remit
        actor: BillingSpecialist
        preconditions:
          - "outcome == APPROVED"
          - "X-User-ID != claim.submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "adjudicated_allowed_cents == insurance_paid_cents + patient_responsibility_cents as computed by adjudication_waterfall (ERR_REMITTANCE_IMBALANCE)"
        side_effects:
          - "runs adjudication_waterfall: sets deductible_applied_cents, patient_responsibility_cents"
          - "policy.deductible_met_cents += deductible_applied_cents; policy.version += 1"
          - "member.oop_accumulated_cents += patient_responsibility_cents; member.out_of_pocket_balance_cents += patient_responsibility_cents; member.version += 1"
          - "source order billing_status -> ADJUDICATED"
          - "remitted_by_user_id / remitted_at / remittance_reference set; claim.version += 1"
      - from: SUBMITTED
        to: DENIED
        trigger: POST /dme/claims/{id}/remit
        actor: BillingSpecialist
        preconditions: ["outcome == DENIED", "X-User-ID != claim.submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["source order billing_status -> DENIED", "remitted_by_user_id / remitted_at set; claim.version += 1"]
      - from: DENIED
        to: APPEALED
        trigger: POST /dme/claims/{id}/appeal
        actor: InsuranceSpecialist
        preconditions: ["status == DENIED"]
        side_effects: ["source order billing_status -> CLAIM_FILED", "claim.version += 1"]
      - from: APPEALED
        to: ADJUDICATED
        trigger: POST /dme/claims/{id}/remit
        actor: BillingSpecialist
        preconditions: ["same as SUBMITTED -> ADJUDICATED"]
        side_effects: ["same side effects as SUBMITTED -> ADJUDICATED"]
      - from: APPEALED
        to: DENIED
        trigger: POST /dme/claims/{id}/remit
        actor: BillingSpecialist
        preconditions: ["outcome == DENIED", "X-User-ID != claim.submitted_by_user_id"]
        side_effects: ["source order billing_status -> DENIED", "claim.version += 1"]
        note: "Cyclic loop DENIED -> APPEALED -> DENIED allowed"
      - from: ADJUDICATED
        to: VOID
        trigger: POST /dme/claims/{id}/void
        actor: BillingSpecialist
        preconditions: ["status == ADJUDICATED"]
        side_effects:
          - "compensation: policy.deductible_met_cents -= deductible_applied_cents; member.oop_accumulated_cents -= patient_responsibility_cents; member.out_of_pocket_balance_cents -= patient_responsibility_cents"
          - "source order billing_status -> CLAIM_FILED"
          - "claim.version += 1"

  - entity: ResupplySchedule
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: PATCH /dme/resupply-schedules/{id}
        actor: CareCoordinator
        preconditions: ["payload.status == SUSPENDED", "expected_schedule_version matches (OCC)"]
        side_effects: ["schedule.version += 1", "member.active_schedule_count and member.next_resupply_date recomputed"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: PATCH /dme/resupply-schedules/{id}
        actor: CareCoordinator
        preconditions: ["payload.status == ACTIVE", "expected_schedule_version matches (OCC)"]
        side_effects: ["schedule.version += 1", "member.active_schedule_count and member.next_resupply_date recomputed"]
      - from: ACTIVE
        to: ENDED
        trigger: "system: lazy evaluation — when POST /dme/resupply-orders is attempted and current date >= the policy's benefit_period_end, the schedule transitions to ENDED and the call is rejected with ERR_BENEFIT_PERIOD_ENDED; also fires as cascade of POST /dme/policies/{id}/terminate"
        actor: system
        preconditions: []
        side_effects: ["schedule.version += 1", "member.active_schedule_count and member.next_resupply_date recomputed"]
      - from: SUSPENDED
        to: ENDED
        trigger: "system: cascade of POST /dme/policies/{id}/terminate"
        actor: system
        preconditions: []
        side_effects: ["schedule.version += 1", "member.active_schedule_count and member.next_resupply_date recomputed"]

  - entity: ResupplyOrder
    initial_state: APPROVED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: APPROVED
        to: SHIPPED
        trigger: "system: cascade of POST /dme/shipments with resupply_order_id == this order"
        actor: system
        preconditions: []
        side_effects: ["resupply_order.version += 1"]
      - from: SHIPPED
        to: DELIVERED
        trigger: "system: cascade of shipment advance to DELIVERED"
        actor: system
        preconditions: []
        side_effects: ["resupply_order.version += 1"]
      - from: APPROVED
        to: CANCELLED
        trigger: POST /dme/resupply-orders/{id}/cancel
        actor: Member
        preconditions: ["status == APPROVED"]
        side_effects:
          - "if schedule.last_fulfilled_date == this order's fulfilled_date, roll last_fulfilled_date back to the fulfilled_date of the latest other non-CANCELLED ResupplyOrder on this schedule (null if none) and recompute next_eligible_date"
          - "resupply_order.version += 1; schedule.version += 1"

  - entity: WarrantyClaim
    initial_state: OPENED
    terminal_states: [RESOLVED]
    transitions:
      - from: OPENED
        to: APPROVED_REPAIR
        trigger: POST /dme/warranty-claims/{id}/decide
        actor: PlatformAdmin
        preconditions: ["decision == APPROVED_REPAIR"]
        side_effects: ["resolution_notes := payload.resolution_notes", "claim.version += 1"]
      - from: OPENED
        to: APPROVED_REPLACE
        trigger: POST /dme/warranty-claims/{id}/decide
        actor: PlatformAdmin
        preconditions: ["decision == APPROVED_REPLACE"]
        side_effects: ["resolution_notes := payload.resolution_notes", "claim.version += 1"]
      - from: OPENED
        to: DENIED
        trigger: POST /dme/warranty-claims/{id}/decide
        actor: PlatformAdmin
        preconditions: ["decision == DENIED"]
        side_effects: ["resolution_notes := payload.resolution_notes", "claim.version += 1"]
      - from: DENIED
        to: OPENED
        trigger: POST /dme/warranty-claims/{id}/reopen
        actor: Member
        preconditions: ["status == DENIED", "reopen_count < MAX_REOPENS (2) else ERR_MAX_REOPENS_EXCEEDED"]
        side_effects: ["reopen_count += 1", "claim.version += 1"]
        note: "Cyclic loop OPENED -> DENIED -> OPENED, bounded by MAX_REOPENS"
      - from: APPROVED_REPAIR
        to: RESOLVED
        trigger: POST /dme/warranty-claims/{id}/resolve
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["claim.version += 1"]
      - from: APPROVED_REPLACE
        to: RESOLVED
        trigger: POST /dme/warranty-claims/{id}/resolve
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "cascade depth-2: create replacement Shipment (pump_order_id := claim.pump_order_id, is_warranty_replacement := true, status LABEL_CREATED, carrier 'WARRANTY_REPLACEMENT', tracking_number server-minted); replacement_shipment_id := new shipment id"
          - "cascade depth-3: order.replacement_count += 1; if replacement_count >= MAX_WARRANTY_REPLACEMENTS (2) then order.warranty_blocked := true; order.version += 1"
          - "claim.version += 1"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: pump-order-patch-stale-version
    parent_entity: PumpOrder
    write_endpoint: "PATCH /dme/pump-orders/{id}"
    occ_field: "expected_pump_order_version"
    description: |
      Updating the selected pump model or shipping address on a PumpOrder whose
      version has advanced since the client last observed it is rejected. The
      client's view is stale — e.g. a qualify or a cascade has mutated the order
      since the version was read — so the write is refused rather than silently
      overwriting state the client never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: resupply-schedule-patch-stale-version
    parent_entity: ResupplySchedule
    write_endpoint: "PATCH /dme/resupply-schedules/{id}"
    occ_field: "expected_schedule_version"
    description: |
      Adjusting frequency_days or suspending/resuming a ResupplySchedule whose
      version has advanced since the client last observed it is rejected. A
      resupply order created or cancelled in between mutates the schedule and
      bumps its version, so a writer holding the old version is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_line_pricing
    trigger: "POST /dme/pump-orders (primary line), POST /dme/pump-orders/{id}/lines, PATCH /dme/pump-orders/{id} (pump_item_id change)"
    algorithm: aggregation
    formula: |
      ROUNDING ORDER IS PINNED (mode: round-per-line-then-sum):
      for each OrderLine: line_total_cents = round_half_up(quantity * unit_price_cents)   # per line, to integer cents
      merchandise_subtotal_cents = sum(line_total_cents) over ALL lines of the order
      # Never sum raw products and round once — the per-line-rounded sum is the only correct result.
    input_set: "All OrderLine rows of the order regardless of line_type"
    constants: { ROUNDING: round_half_up }
    precision: "integer cents, round_half_up per line"

  - name: bundle_discount
    trigger: "immediately after order_line_pricing on any line mutation"
    algorithm: threshold
    formula: |
      EVALUATION ORDER IS PINNED (circular-looking dependency resolved):
      (1) merchandise_subtotal_cents is computed FIRST by order_line_pricing, BEFORE any discount.
      (2) Bundle tier test uses the PRE-DISCOUNT subtotal INCLUDING garment lines:
          qualifies = merchandise_subtotal_cents >= BUNDLE_THRESHOLD_CENTS
      (3) If qualifies, each ADDON_GARMENT line gets discount_cents = round_half_up(line_total_cents * BUNDLE_DISCOUNT_PCT);
          PUMP_PRIMARY lines always have discount_cents = 0.
      (4) discount_total_cents = sum(discount_cents); order_total_cents = merchandise_subtotal_cents - discount_total_cents.
      # Because the tier is keyed on a subtotal that itself contains the discounted lines,
      # evaluating discount before the tier test would be circular; steps (1)-(4) pin the order.
    input_set: "All OrderLine rows of the order"
    constants: { BUNDLE_THRESHOLD_CENTS: 20000, BUNDLE_DISCOUNT_PCT: 0.10 }
    precision: "integer cents, round_half_up per discounted line"

  - name: provisional_patient_responsibility
    trigger: "POST /dme/pump-orders/{id}/qualify"
    algorithm: forward_looking
    formula: |
      base_allowed = pump_item.unit_price_cents - pump_item.upgrade_fee_cents   # upgrade fee excluded from insurance base
      ded_remaining = max(0, policy.deductible_cents - policy.deductible_met_cents)   # projected: uses CURRENT deductible state
      ded_applied = min(base_allowed, ded_remaining)
      coins = round_half_up((base_allowed - ded_applied) * policy.coinsurance_pct)
      provisional_allowed_cents = pump_item.unit_price_cents
      provisional_patient_cents = ded_applied + coins + pump_item.upgrade_fee_cents
      upgrade_fee_cents (order field) = pump_item.upgrade_fee_cents
    input_set: "The order's pump CatalogItem and the order's InsurancePolicy as of qualify time"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional_estimate
        when: "at qualify; deductible state is the state AT QUALIFY TIME and payer-allowed is estimated as list price"
        difference: "Estimates with list-price allowed and qualify-time deductible; stored on the order"
      - name: final_adjudicated
        when: "at claim remit; see adjudication_waterfall"
        difference: "Uses payer-adjudicated allowed amount and deductible state AT REMIT TIME; identical order data can yield a different patient responsibility"

  - name: adjudication_waterfall
    trigger: "POST /dme/claims/{id}/remit with outcome APPROVED"
    algorithm: waterfall_allocation
    formula: |
      A = adjudicated_allowed_cents (payer input)
      ded_remaining = max(0, policy.deductible_cents - policy.deductible_met_cents)   # state AT REMIT TIME
      deductible_applied_cents = min(A, ded_remaining)
      remainder = A - deductible_applied_cents
      coins = round_half_up(remainder * policy.coinsurance_pct)
      patient_pre_cap = deductible_applied_cents + coins
      if policy.oop_max_cents > 0:
          patient_responsibility_cents = min(patient_pre_cap, max(0, policy.oop_max_cents - member.oop_accumulated_cents))
      else:
          patient_responsibility_cents = patient_pre_cap
      INVARIANT CHECK: insurance_paid_cents (payer input) MUST equal A - patient_responsibility_cents, else ERR_REMITTANCE_IMBALANCE
    input_set: "The claim, its policy, and its member as of remit time"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: final_adjudicated
        when: "at remit"
        difference: "Dual of provisional_patient_responsibility: payer-allowed may differ from list price and deductible may have moved since qualify"

  - name: prior_auth_requirement
    trigger: "POST /dme/pump-orders/{id}/qualify"
    algorithm: threshold
    formula: |
      prior_auth_required = policy.requires_prior_auth OR (provisional_allowed_cents >= policy.prior_auth_threshold_cents)
      # Boundary is INCLUSIVE: allowed exactly equal to the threshold requires prior auth.
    input_set: "The order and its policy at qualify time"
    constants: {}
    precision: "integer cents comparison"

  - name: resupply_next_eligible_date
    trigger: "ResupplySchedule creation, POST /dme/resupply-orders, POST /dme/resupply-orders/{id}/cancel, PATCH /dme/resupply-schedules/{id}"
    algorithm: threshold
    formula: |
      Base cadence: first eligibility = anchor_date + frequency_days.
      If last_fulfilled_date is null: next_eligible_date = anchor_date + frequency_days.
      Variant ROLLING: next_eligible_date = last_fulfilled_date + frequency_days.
      Variant CALENDAR_ANCHORED: eligibility instants are anchor_date + k * frequency_days for integer k >= 1;
        next_eligible_date = the smallest such instant STRICTLY GREATER THAN last_fulfilled_date.
      Eligibility test at order creation: current_date >= next_eligible_date (INCLUSIVE at equality).
    input_set: "The schedule row only"
    constants: {}
    precision: "ISO date granularity (day)"
    variants:
      - name: rolling
        when: "schedule_mode == ROLLING"
        difference: "Cadence re-anchors at each fulfillment; late fulfillment pushes the whole cadence out"
      - name: calendar_anchored
        when: "schedule_mode == CALENDAR_ANCHORED"
        difference: "Cadence fixed to the delivery anchor; off-cadence fulfillment snaps forward to the next anchor instant — same fulfillment date yields a different next_eligible_date than ROLLING"

  - name: garment_allowance_tracking
    trigger: "POST /dme/pump-orders/{id}/lines (validation), POST /dme/pump-orders/{id}/qualify (consumption), POST /dme/pump-orders/{id}/cancel (release)"
    algorithm: aggregation
    formula: |
      projected_garment_units(order) = policy.garments_consumed_count + sum(quantity of ADDON_GARMENT lines on this order including the new line)
      add-line check: projected_garment_units <= policy.garment_allowance_per_period   # INCLUSIVE: exactly reaching the allowance is allowed
      at qualify: garments_consumed_count += order garment quantity
      at cancel of QUALIFIED order: garments_consumed_count -= order garment quantity
      INVARIANT: policy.garments_consumed_count == sum of ADDON_GARMENT line quantities over this policy's orders with fulfillment_status IN {QUALIFIED, SHIPPED, DELIVERED}
    input_set: "Policy counter plus the order's garment lines"
    constants: {}
    precision: "integer units"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is in the endpoint's roles list", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Member role may only act on resources whose member_id (or path member id) equals X-User-ID", error_id: ERR_OWNERSHIP_VIOLATION, http_status: 403, applies_to: "member-facing endpoints (pump-orders, resupply-orders, warranty-claims, member/policies/prescriptions/claims/schedules reads)" }
  - { priority: 4, category: existence, check: "Path identifiers resolve left-to-right; body FK references must exist", error_id: "ERR_MEMBER_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_PRESCRIPTION_NOT_FOUND | ERR_CATALOG_ITEM_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_PRIOR_AUTH_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_SCHEDULE_NOT_FOUND | ERR_RESUPPLY_ORDER_NOT_FOUND | ERR_WARRANTY_CLAIM_NOT_FOUND", http_status: 404, applies_to: "all" }
  - { priority: 5, category: existence, check: "Request shape: required fields present, types valid, enum values valid, exactly one of pump_order_id/resupply_order_id set, quantity >= 1, benefit_period_end > benefit_period_start", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 6, category: state, check: "State-machine precondition: transition valid from current state; terminal states reject all actions", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: state, check: "Prescription must be VERIFIED at qualify", error_id: ERR_PRESCRIPTION_NOT_VERIFIED, http_status: 409, applies_to: ["POST /dme/pump-orders/{id}/qualify"] }
  - { priority: 6, category: state, check: "Policy must be ACTIVE at order creation and qualify", error_id: ERR_POLICY_NOT_ACTIVE, http_status: 409, applies_to: ["POST /dme/pump-orders", "POST /dme/pump-orders/{id}/qualify"] }
  - { priority: 6, category: state, check: "ResupplySchedule must be ACTIVE at resupply order creation", error_id: ERR_SCHEDULE_NOT_ACTIVE, http_status: 409, applies_to: ["POST /dme/resupply-orders"] }
  - { priority: 6, category: state, check: "Shipment gate: order.prior_auth_required implies an APPROVED PriorAuthorization exists", error_id: ERR_PRIOR_AUTH_REQUIRED, http_status: 409, applies_to: ["POST /dme/shipments"] }
  - { priority: 6, category: state, check: "PA creation only when order QUALIFIED and prior_auth_required == true", error_id: ERR_PRIOR_AUTH_NOT_REQUIRED, http_status: 409, applies_to: ["POST /dme/prior-authorizations"] }
  - { priority: 6, category: state, check: "At most one Claim per source order", error_id: ERR_DUPLICATE_CLAIM, http_status: 409, applies_to: ["POST /dme/claims"] }
  - { priority: 7, category: business_safety, check: "Segregation of duties: remit X-User-ID must differ from claim.submitted_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 422, applies_to: ["POST /dme/claims/{id}/remit"] }
  - { priority: 8, category: business_temporal, check: "Current date <= prescription.expiration_date", error_id: ERR_PRESCRIPTION_EXPIRED, http_status: 422, applies_to: ["POST /dme/prescriptions/{id}/verify", "POST /dme/prescriptions/{id}/resubmit", "POST /dme/pump-orders/{id}/qualify"] }
  - { priority: 8, category: business_temporal, check: "Current date within [benefit_period_start, benefit_period_end)", error_id: ERR_BENEFIT_PERIOD_ENDED, http_status: 422, applies_to: ["POST /dme/pump-orders", "POST /dme/pump-orders/{id}/qualify", "POST /dme/resupply-orders"] }
  - { priority: 8, category: business_temporal, check: "Current date >= schedule.next_eligible_date (inclusive)", error_id: ERR_RESUPPLY_WINDOW_NOT_OPEN, http_status: 422, applies_to: ["POST /dme/resupply-orders"] }
  - { priority: 8, category: business_temporal, check: "Current date <= order.delivery_date + pump warranty_months", error_id: ERR_WARRANTY_EXPIRED, http_status: 422, applies_to: ["POST /dme/warranty-claims"] }
  - { priority: 8, category: business_temporal, check: "Current date <= PA.approved_until", error_id: ERR_PRIOR_AUTH_EXPIRED, http_status: 422, applies_to: ["POST /dme/shipments"] }
  - { priority: 9, category: business_constraint, check: "No overlap of benefit periods among a member's ACTIVE policies; half-open intervals, adjacency (new.start == existing.end) permitted", error_id: ERR_POLICY_PERIOD_OVERLAP, http_status: 409, applies_to: ["POST /dme/policies"] }
  - { priority: 9, category: business_constraint, check: "Prescription pump_type must equal pump item pump_type", error_id: ERR_PUMP_TYPE_MISMATCH, http_status: 422, applies_to: ["POST /dme/pump-orders", "POST /dme/pump-orders/{id}/qualify", "PATCH /dme/pump-orders/{id}"] }
  - { priority: 9, category: business_constraint, check: "Add-on lines must reference COMPRESSION_GARMENT items only", error_id: ERR_INVALID_ITEM_TYPE, http_status: 422, applies_to: ["POST /dme/pump-orders/{id}/lines"] }
  - { priority: 9, category: business_constraint, check: "WarrantyClaim reopen_count must be < 2", error_id: ERR_MAX_REOPENS_EXCEEDED, http_status: 422, applies_to: ["POST /dme/warranty-claims/{id}/reopen"] }
  - { priority: 9, category: business_constraint, check: "Order.warranty_blocked must be false for new warranty claims", error_id: ERR_WARRANTY_REPLACEMENT_EXHAUSTED, http_status: 422, applies_to: ["POST /dme/warranty-claims"] }
  - { priority: 10, category: business_fiscal, check: "policy.pumps_consumed_count < pump_allowance_per_period", error_id: ERR_PUMP_ALLOWANCE_EXHAUSTED, http_status: 422, applies_to: ["POST /dme/pump-orders/{id}/qualify"] }
  - { priority: 10, category: business_fiscal, check: "projected garment units <= garment_allowance_per_period (inclusive at equality)", error_id: ERR_GARMENT_ALLOWANCE_EXCEEDED, http_status: 422, applies_to: ["POST /dme/pump-orders/{id}/lines"] }
  - { priority: 10, category: business_fiscal, check: "UPGRADE pump requires policy.upgrade_coverage", error_id: ERR_UPGRADE_TIER_NOT_COVERED, http_status: 422, applies_to: ["POST /dme/pump-orders/{id}/qualify", "PATCH /dme/pump-orders/{id}"] }
  - { priority: 10, category: business_fiscal, check: "quantity <= catalog_item.max_qty_per_frequency", error_id: ERR_RESUPPLY_QUANTITY_CAP_EXCEEDED, http_status: 422, applies_to: ["POST /dme/resupply-orders"] }
  - { priority: 10, category: business_fiscal, check: "insurance_paid_cents + computed patient_responsibility_cents == adjudicated_allowed_cents", error_id: ERR_REMITTANCE_IMBALANCE, http_status: 422, applies_to: ["POST /dme/claims/{id}/remit"] }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Members ----
  - { method: POST, path: "/dme/members", description: "Register a member", roles: [CareCoordinator, PlatformAdmin], code: 201, input: [full_name, email, date_of_birth, shipping_address], output: Member, side_effects: [] }
  - { method: GET, path: "/dme/members/{id}", description: "Get one member; Member role only for self", roles: [Member, CareCoordinator, InsuranceSpecialist, BillingSpecialist, WarehouseOperator, PlatformAdmin], code: 200, input: [], output: Member, side_effects: [] }
  - { method: GET, path: "/dme/members", description: "List members with pagination", roles: [CareCoordinator, InsuranceSpecialist, BillingSpecialist, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "Member[]", side_effects: [] }

  # ---- Policies ----
  - { method: POST, path: "/dme/policies", description: "Create an insurance policy for a member; rejects overlapping ACTIVE benefit periods (half-open, adjacency allowed)", roles: [PlatformAdmin, InsuranceSpecialist], code: 201, input: [member_id, payer_name, plan_type, benefit_period_start, benefit_period_end, "requires_prior_auth?", "prior_auth_threshold_cents?", "pump_allowance_per_period?", "garment_allowance_per_period?", "resupply_frequency_days?", "schedule_mode?", "deductible_cents?", "coinsurance_pct?", "oop_max_cents?", "upgrade_coverage?"], output: InsurancePolicy, side_effects: ["pumps_consumed_count/garments_consumed_count/deductible_met_cents initialized to 0"] }
  - { method: GET, path: "/dme/policies/{id}", description: "Get one policy", roles: [Member, CareCoordinator, InsuranceSpecialist, BillingSpecialist, PlatformAdmin], code: 200, input: [], output: InsurancePolicy, side_effects: [] }
  - { method: GET, path: "/dme/policies", description: "List policies", roles: [Member, CareCoordinator, InsuranceSpecialist, BillingSpecialist, PlatformAdmin], code: 200, input: ["member_id?", "plan_type?", "limit?", "offset?"], output: "InsurancePolicy[]", side_effects: [] }
  - { method: POST, path: "/dme/policies/{id}/terminate", description: "Terminate a policy; cascades member's ACTIVE/SUSPENDED resupply schedules (via this policy's orders) to ENDED", roles: [PlatformAdmin, InsuranceSpecialist], code: 200, input: [], output: InsurancePolicy, side_effects: ["policy ACTIVE -> TERMINATED", "affected ResupplySchedules -> ENDED", "member resupply aggregates recomputed"] }

  # ---- Prescriptions ----
  - { method: POST, path: "/dme/prescriptions", description: "Create a prescription (PENDING_VERIFICATION)", roles: [CareCoordinator, PlatformAdmin], code: 201, input: [member_id, diagnosis_code, pump_type, issued_date, expiration_date], output: Prescription, side_effects: [] }
  - { method: GET, path: "/dme/prescriptions/{id}", description: "Get one prescription", roles: [Member, CareCoordinator, InsuranceSpecialist, PlatformAdmin], code: 200, input: [], output: Prescription, side_effects: [] }
  - { method: GET, path: "/dme/prescriptions", description: "List prescriptions", roles: [Member, CareCoordinator, InsuranceSpecialist, PlatformAdmin], code: 200, input: ["member_id?", "status?", "consumed_by_order_id?", "limit?", "offset?"], output: "Prescription[]", side_effects: [] }
  - { method: POST, path: "/dme/prescriptions/{id}/verify", description: "Verify a prescription", roles: [InsuranceSpecialist], code: 200, input: [], output: Prescription, side_effects: ["PENDING_VERIFICATION -> VERIFIED"] }
  - { method: POST, path: "/dme/prescriptions/{id}/reject", description: "Reject a prescription", roles: [InsuranceSpecialist], code: 200, input: [rejection_reason], output: Prescription, side_effects: ["PENDING_VERIFICATION -> REJECTED"] }
  - { method: POST, path: "/dme/prescriptions/{id}/resubmit", description: "Resubmit a rejected prescription (cyclic loop)", roles: [CareCoordinator, InsuranceSpecialist], code: 200, input: [], output: Prescription, side_effects: ["REJECTED -> PENDING_VERIFICATION"] }

  # ---- Catalog ----
  - { method: POST, path: "/dme/catalog-items", description: "Create a catalog item (pump model, part, or garment)", roles: [PlatformAdmin], code: 201, input: [item_type, name, sku, unit_price_cents, "insurance_tier?", "upgrade_fee_cents?", "covered_under_resupply?", "max_qty_per_frequency?", "warranty_months?", "pump_type?"], output: CatalogItem, side_effects: [] }
  - { method: GET, path: "/dme/catalog-items/{id}", description: "Get one catalog item", roles: [Member, CareCoordinator, InsuranceSpecialist, BillingSpecialist, WarehouseOperator, PlatformAdmin], code: 200, input: [], output: CatalogItem, side_effects: [] }
  - { method: GET, path: "/dme/catalog-items", description: "List catalog items", roles: [Member, CareCoordinator, InsuranceSpecialist, BillingSpecialist, WarehouseOperator, PlatformAdmin], code: 200, input: ["item_type?", "covered_under_resupply?", "limit?", "offset?"], output: "CatalogItem[]", side_effects: [] }
  - { method: GET, path: "/dme/catalog-items/{id}/order-lines", description: "List order lines referencing this catalog item", roles: [CareCoordinator, InsuranceSpecialist, BillingSpecialist, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "OrderLine[]", side_effects: [] }

  # ---- Pump orders ----
  - { method: POST, path: "/dme/pump-orders", description: "Create a pump order; auto-creates the PUMP_PRIMARY OrderLine and runs pricing", roles: [Member, CareCoordinator], code: 201, input: [member_id, policy_id, prescription_id, pump_item_id, shipping_address], output: PumpOrder, side_effects: ["PUMP_PRIMARY OrderLine created (quantity 1, price snapshot)", "order_line_pricing + bundle_discount run", "fulfillment PENDING_QUALIFICATION, billing UNBILLED"] }
  - { method: GET, path: "/dme/pump-orders/{id}", description: "Get one pump order", roles: [Member, CareCoordinator, InsuranceSpecialist, BillingSpecialist, WarehouseOperator, PlatformAdmin], code: 200, input: [], output: PumpOrder, side_effects: [] }
  - { method: GET, path: "/dme/pump-orders", description: "List pump orders", roles: [Member, CareCoordinator, InsuranceSpecialist, BillingSpecialist, WarehouseOperator, PlatformAdmin], code: 200, input: ["member_id?", "policy_id?", "prescription_id?", "pump_item_id?", "fulfillment_status?", "billing_status?", "limit?", "offset?"], output: "PumpOrder[]", side_effects: [] }
  - { method: PATCH, path: "/dme/pump-orders/{id}", description: "Change pump model and/or shipping address while PENDING_QUALIFICATION; OCC on order version", roles: [Member, CareCoordinator], code: 200, input: ["pump_item_id?", "shipping_address?", expected_pump_order_version], output: PumpOrder, side_effects: ["increments PumpOrder.version by 1", "if pump_item_id changed: primary line re-priced, order_line_pricing + bundle_discount re-run"] }
  - { method: POST, path: "/dme/pump-orders/{id}/qualify", description: "Run insurance qualification: provisional estimate, prior-auth requirement, allowance consumption, prescription consumption", roles: [InsuranceSpecialist], code: 200, input: [], output: PumpOrder, side_effects: ["PENDING_QUALIFICATION -> QUALIFIED", "provisional_patient_responsibility + prior_auth_requirement run", "policy.pumps_consumed_count += 1, garments_consumed_count += order garment qty", "prescription VERIFIED -> CONSUMED"] }
  - { method: POST, path: "/dme/pump-orders/{id}/cancel", description: "Cancel a PENDING_QUALIFICATION or QUALIFIED order with full compensation", roles: [Member, CareCoordinator], code: 200, input: [], output: PumpOrder, side_effects: ["-> CANCELLED", "if was QUALIFIED: policy counts decremented, prescription restored to VERIFIED, open PAs -> WITHDRAWN"] }
  - { method: POST, path: "/dme/pump-orders/{id}/lines", description: "Add a compression-garment add-on line (quantity caps enforced)", roles: [Member, CareCoordinator], code: 201, input: [catalog_item_id, quantity], output: OrderLine, side_effects: ["ADDON_GARMENT OrderLine created", "order_line_pricing + bundle_discount re-run"] }
  - { method: GET, path: "/dme/pump-orders/{id}/lines", description: "List an order's lines", roles: [Member, CareCoordinator, InsuranceSpecialist, BillingSpecialist, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "OrderLine[]", side_effects: [] }

  # ---- Prior authorization ----
  - { method: POST, path: "/dme/prior-authorizations", description: "Submit a prior authorization for a QUALIFIED order that requires one", roles: [InsuranceSpecialist], code: 201, input: [pump_order_id], output: PriorAuthorization, side_effects: ["PA created in SUBMITTED (submission_count 1)", "order.billing_status -> AUTH_PENDING"] }
  - { method: GET, path: "/dme/prior-authorizations/{id}", description: "Get one PA", roles: [Member, CareCoordinator, InsuranceSpecialist, BillingSpecialist, PlatformAdmin], code: 200, input: [], output: PriorAuthorization, side_effects: [] }
  - { method: GET, path: "/dme/prior-authorizations", description: "List PAs", roles: [Member, CareCoordinator, InsuranceSpecialist, BillingSpecialist, PlatformAdmin], code: 200, input: ["pump_order_id?", "member_id?", "policy_id?", "status?", "limit?", "offset?"], output: "PriorAuthorization[]", side_effects: [] }
  - { method: POST, path: "/dme/prior-authorizations/{id}/payer-decision", description: "Payer integration endpoint: record APPROVED / DENIED / PENDED decision (from SUBMITTED or APPEALED)", roles: [PlatformAdmin], code: 200, input: [decision, "auth_number?", "approved_until?", "payer_notes?"], output: PriorAuthorization, side_effects: ["status per decision", "order.billing_status updated (AUTH_APPROVED / DENIED)"] }
  - { method: POST, path: "/dme/prior-authorizations/{id}/resubmit", description: "Resubmit a PENDED PA (submission_count += 1)", roles: [InsuranceSpecialist], code: 200, input: [], output: PriorAuthorization, side_effects: ["PENDED -> SUBMITTED", "submission_count += 1"] }
  - { method: POST, path: "/dme/prior-authorizations/{id}/appeal", description: "Appeal a DENIED PA", roles: [InsuranceSpecialist], code: 200, input: [], output: PriorAuthorization, side_effects: ["DENIED -> APPEALED", "order.billing_status -> AUTH_PENDING"] }

  # ---- Shipments ----
  - { method: POST, path: "/dme/shipments", description: "Create a shipment for a QUALIFIED pump order (PA gate enforced) or an APPROVED resupply order", roles: [WarehouseOperator], code: 201, input: ["pump_order_id?", "resupply_order_id?", carrier, tracking_number], output: Shipment, side_effects: ["LABEL_CREATED", "pump order QUALIFIED -> SHIPPED (or resupply order APPROVED -> SHIPPED)"] }
  - { method: GET, path: "/dme/shipments/{id}", description: "Get one shipment (tracking)", roles: [Member, CareCoordinator, WarehouseOperator, InsuranceSpecialist, PlatformAdmin], code: 200, input: [], output: Shipment, side_effects: [] }
  - { method: GET, path: "/dme/shipments", description: "List shipments", roles: [Member, CareCoordinator, WarehouseOperator, InsuranceSpecialist, PlatformAdmin], code: 200, input: ["pump_order_id?", "resupply_order_id?", "status?", "limit?", "offset?"], output: "Shipment[]", side_effects: [] }
  - { method: POST, path: "/dme/shipments/{id}/advance", description: "Advance carrier status; DELIVERED fires the order delivery cascade (schedules, member aggregates)", roles: [WarehouseOperator], code: 200, input: [to_status], output: Shipment, side_effects: ["status transition per machine", "on DELIVERED: order delivery cascade (first, non-replacement deliveries only)"] }

  # ---- Claims / billing ----
  - { method: POST, path: "/dme/claims", description: "Submit a claim for a DELIVERED pump or resupply order (at most one per order)", roles: [InsuranceSpecialist], code: 201, input: ["pump_order_id?", "resupply_order_id?"], output: Claim, side_effects: ["SUBMITTED with submitted_by_user_id", "provisional_allowed_cents frozen", "source order billing_status -> CLAIM_FILED"] }
  - { method: GET, path: "/dme/claims/{id}", description: "Get one claim", roles: [Member, InsuranceSpecialist, BillingSpecialist, PlatformAdmin], code: 200, input: [], output: Claim, side_effects: [] }
  - { method: GET, path: "/dme/claims", description: "List claims", roles: [Member, InsuranceSpecialist, BillingSpecialist, PlatformAdmin], code: 200, input: ["member_id?", "policy_id?", "pump_order_id?", "resupply_order_id?", "status?", "limit?", "offset?"], output: "Claim[]", side_effects: [] }
  - { method: POST, path: "/dme/claims/{id}/remit", description: "Post payer remittance; runs adjudication_waterfall; segregation of duties enforced", roles: [BillingSpecialist, PlatformAdmin], code: 200, input: [outcome, adjudicated_allowed_cents, insurance_paid_cents, "remittance_reference?"], output: Claim, side_effects: ["SUBMITTED/APPEALED -> ADJUDICATED or DENIED", "on APPROVED: deductible_met, member oop_accumulated and out_of_pocket_balance updated", "order billing_status updated"] }
  - { method: POST, path: "/dme/claims/{id}/appeal", description: "Appeal a DENIED claim", roles: [InsuranceSpecialist], code: 200, input: [], output: Claim, side_effects: ["DENIED -> APPEALED", "order billing_status -> CLAIM_FILED"] }
  - { method: POST, path: "/dme/claims/{id}/void", description: "Void an ADJUDICATED claim; reverses deductible and member balance effects", roles: [BillingSpecialist], code: 200, input: [], output: Claim, side_effects: ["ADJUDICATED -> VOID", "compensation: deductible_met_cents -= deductible_applied_cents; member balances reduced by patient_responsibility_cents", "order billing_status -> CLAIM_FILED"] }

  # ---- Resupply schedules ----
  - { method: GET, path: "/dme/resupply-schedules/{id}", description: "Get one resupply schedule", roles: [Member, CareCoordinator, PlatformAdmin], code: 200, input: [], output: ResupplySchedule, side_effects: [] }
  - { method: GET, path: "/dme/resupply-schedules", description: "List resupply schedules", roles: [Member, CareCoordinator, PlatformAdmin], code: 200, input: ["member_id?", "pump_order_id?", "catalog_item_id?", "status?", "limit?", "offset?"], output: "ResupplySchedule[]", side_effects: [] }
  - { method: PATCH, path: "/dme/resupply-schedules/{id}", description: "Adjust frequency_days or suspend/resume; OCC on schedule version", roles: [CareCoordinator], code: 200, input: ["frequency_days?", "status?", expected_schedule_version], output: ResupplySchedule, side_effects: ["increments ResupplySchedule.version by 1", "next_eligible_date recomputed", "member aggregates recomputed"] }

  # ---- Resupply orders ----
  - { method: POST, path: "/dme/resupply-orders", description: "Request a parts resupply against a schedule; eligibility window, quantity cap, and benefit period enforced; created in APPROVED", roles: [Member, CareCoordinator], code: 201, input: [schedule_id, member_id, quantity], output: ResupplyOrder, side_effects: ["schedule.last_fulfilled_date := current date", "schedule.next_eligible_date recomputed", "schedule.version += 1"] }
  - { method: GET, path: "/dme/resupply-orders/{id}", description: "Get one resupply order", roles: [Member, CareCoordinator, WarehouseOperator, PlatformAdmin], code: 200, input: [], output: ResupplyOrder, side_effects: [] }
  - { method: GET, path: "/dme/resupply-orders", description: "List resupply orders", roles: [Member, CareCoordinator, WarehouseOperator, PlatformAdmin], code: 200, input: ["schedule_id?", "member_id?", "status?", "limit?", "offset?"], output: "ResupplyOrder[]", side_effects: [] }
  - { method: POST, path: "/dme/resupply-orders/{id}/cancel", description: "Cancel an APPROVED resupply order; rolls back schedule.last_fulfilled_date if this was the latest fulfillment", roles: [Member, CareCoordinator], code: 200, input: [], output: ResupplyOrder, side_effects: ["APPROVED -> CANCELLED", "schedule last_fulfilled_date rollback + next_eligible_date recompute"] }

  # ---- Warranty ----
  - { method: POST, "path": "/dme/warranty-claims", description: "Open a warranty claim on a delivered pump order inside the warranty window", roles: [Member, CareCoordinator], code: 201, input: [pump_order_id, serial_number, issue_type, "description?"], output: WarrantyClaim, side_effects: ["OPENED"] }
  - { method: GET, path: "/dme/warranty-claims/{id}", description: "Get one warranty claim", roles: [Member, CareCoordinator, PlatformAdmin], code: 200, input: [], output: WarrantyClaim, side_effects: [] }
  - { method: GET, path: "/dme/warranty-claims", description: "List warranty claims", roles: [Member, CareCoordinator, PlatformAdmin], code: 200, input: ["pump_order_id?", "member_id?", "status?", "replacement_shipment_id?", "limit?", "offset?"], output: "WarrantyClaim[]", side_effects: [] }
  - { method: POST, path: "/dme/warranty-claims/{id}/decide", description: "Adjudicate an OPENED warranty claim", roles: [PlatformAdmin], code: 200, input: [decision, "resolution_notes?"], output: WarrantyClaim, side_effects: ["OPENED -> APPROVED_REPAIR | APPROVED_REPLACE | DENIED"] }
  - { method: POST, path: "/dme/warranty-claims/{id}/reopen", description: "Reopen a DENIED warranty claim (max 2 reopens)", roles: [Member, CareCoordinator], code: 200, input: [], output: WarrantyClaim, side_effects: ["DENIED -> OPENED", "reopen_count += 1"] }
  - { method: POST, path: "/dme/warranty-claims/{id}/resolve", description: "Resolve an approved claim; APPROVED_REPLACE creates a replacement shipment and may exhaust the replacement budget", roles: [PlatformAdmin], code: 200, input: [], output: WarrantyClaim, side_effects: ["-> RESOLVED", "on APPROVED_REPLACE: replacement Shipment created; order.replacement_count += 1; warranty_blocked set at count >= 2"] }

  # ---- Test-driving logical clock ----
  - method: POST
    path: "/dme/_clock/set_current_utc"
    description: "Set the logical clock (ISO8601 UTC). Server startup default is exactly 2026-05-01T00:00:00Z; the logical clock never falls back to wall-clock time. Advancing the clock has NO eager side effects: prescription/PA expiry and schedule ENDED are evaluated lazily at the guarded operations (see §1.2)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not in endpoint roles list" }
  - { id: ERR_OWNERSHIP_VIOLATION, http: 403, condition: "Member role acting on a resource whose member_id != X-User-ID" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field, bad type, bad enum, both/neither polymorphic FK set, quantity < 1, end <= start" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "Member id does not exist" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "InsurancePolicy id does not exist" }
  - { id: ERR_PRESCRIPTION_NOT_FOUND, http: 404, condition: "Prescription id does not exist" }
  - { id: ERR_CATALOG_ITEM_NOT_FOUND, http: 404, condition: "CatalogItem id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "PumpOrder id does not exist" }
  - { id: ERR_PRIOR_AUTH_NOT_FOUND, http: 404, condition: "PriorAuthorization id does not exist" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "Shipment id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "Claim id does not exist" }
  - { id: ERR_SCHEDULE_NOT_FOUND, http: 404, condition: "ResupplySchedule id does not exist" }
  - { id: ERR_RESUPPLY_ORDER_NOT_FOUND, http: 404, condition: "ResupplyOrder id does not exist" }
  - { id: ERR_WARRANTY_CLAIM_NOT_FOUND, http: 404, condition: "WarrantyClaim id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "State-machine precondition violated (invalid from-state, terminal-state lockdown, repeated transition)" }
  - { id: ERR_PRESCRIPTION_NOT_VERIFIED, http: 409, condition: "Qualify attempted while prescription not VERIFIED" }
  - { id: ERR_POLICY_NOT_ACTIVE, http: 409, condition: "Policy not ACTIVE at order creation or qualify" }
  - { id: ERR_SCHEDULE_NOT_ACTIVE, http: 409, condition: "Resupply order attempted against SUSPENDED or ENDED schedule" }
  - { id: ERR_PRIOR_AUTH_REQUIRED, http: 409, condition: "Shipment attempted while order.prior_auth_required and no APPROVED PA exists" }
  - { id: ERR_PRIOR_AUTH_NOT_REQUIRED, http: 409, condition: "PA created for an order that is not QUALIFIED or does not require prior auth" }
  - { id: ERR_DUPLICATE_CLAIM, http: 409, condition: "A Claim already exists for the source order" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Remit X-User-ID equals claim.submitted_by_user_id" }
  - { id: ERR_PRESCRIPTION_EXPIRED, http: 422, condition: "Current date past prescription.expiration_date" }
  - { id: ERR_BENEFIT_PERIOD_ENDED, http: 422, condition: "Current date outside [benefit_period_start, benefit_period_end)" }
  - { id: ERR_RESUPPLY_WINDOW_NOT_OPEN, http: 422, condition: "Current date < schedule.next_eligible_date (fulfillment gap not yet elapsed)" }
  - { id: ERR_WARRANTY_EXPIRED, http: 422, condition: "Current date past delivery_date + warranty_months" }
  - { id: ERR_PRIOR_AUTH_EXPIRED, http: 422, condition: "Shipment attempted after PA.approved_until" }
  - { id: ERR_POLICY_PERIOD_OVERLAP, http: 409, condition: "New policy benefit period overlaps another ACTIVE policy of the same member (half-open intervals; adjacency allowed)" }
  - { id: ERR_PUMP_TYPE_MISMATCH, http: 422, condition: "Prescription pump_type differs from pump item pump_type" }
  - { id: ERR_INVALID_ITEM_TYPE, http: 422, condition: "Add-on line references a non-COMPRESSION_GARMENT item" }
  - { id: ERR_MAX_REOPENS_EXCEEDED, http: 422, condition: "WarrantyClaim reopen_count already at 2" }
  - { id: ERR_WARRANTY_REPLACEMENT_EXHAUSTED, http: 422, condition: "Order.warranty_blocked is true (replacement_count >= 2)" }
  - { id: ERR_PUMP_ALLOWANCE_EXHAUSTED, http: 422, condition: "policy.pumps_consumed_count >= pump_allowance_per_period at qualify" }
  - { id: ERR_GARMENT_ALLOWANCE_EXCEEDED, http: 422, condition: "Projected garment units exceed garment_allowance_per_period" }
  - { id: ERR_UPGRADE_TIER_NOT_COVERED, http: 422, condition: "UPGRADE pump on a policy with upgrade_coverage false" }
  - { id: ERR_RESUPPLY_QUANTITY_CAP_EXCEEDED, http: 422, condition: "quantity > catalog_item.max_qty_per_frequency" }
  - { id: ERR_REMITTANCE_IMBALANCE, http: 422, condition: "insurance_paid_cents + computed patient_responsibility_cents != adjudicated_allowed_cents" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Member
    description: "The patient; acts on own orders, resupply, and warranty claims"
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations: ["create own pump order", "PATCH own pump order", "cancel own pump order", "add garment lines to own order", "create/cancel own resupply orders", "open/reopen own warranty claims", "read own members/policies/prescriptions/orders/shipments/claims/schedules/warranty data"]
  - name: CareCoordinator
    description: "Supplier care coordinator; onboarding and order management on behalf of members"
    identity: "opaque"
    exclusive_operations: ["PATCH resupply schedules (frequency adjust, suspend/resume)"]
    shared_operations: ["create members", "create/resubmit prescriptions", "create/PATCH/cancel pump orders on behalf", "add garment lines", "create/cancel resupply orders", "open/reopen warranty claims on behalf", "read operational data"]
  - name: InsuranceSpecialist
    description: "Qualifies orders, verifies prescriptions, submits prior auths and claims"
    identity: "opaque"
    exclusive_operations: ["verify/reject prescriptions", "qualify pump orders", "create prior authorizations", "resubmit/appeal prior authorizations", "create claims", "appeal claims"]
    shared_operations: ["create policies", "terminate policies", "read operational data"]
  - name: BillingSpecialist
    description: "Posts payer remittances and voids adjudicated claims; segregation of duties vs claim submitter"
    identity: "opaque"
    exclusive_operations: ["void claims"]
    shared_operations: ["remit claims", "read claims/policies/orders"]
  - name: WarehouseOperator
    description: "Fulfills and tracks shipments"
    identity: "opaque"
    exclusive_operations: ["create shipments", "advance shipment status"]
    shared_operations: ["read shipments/orders"]
  - name: PlatformAdmin
    description: "Operator/admin; catalog, policies, payer simulation, warranty adjudication, logical clock"
    identity: "opaque"
    exclusive_operations: ["create catalog items", "payer-decision on prior authorizations", "decide/resolve warranty claims", "set logical clock"]
    shared_operations: ["create members", "create prescriptions", "create/terminate policies", "remit claims", "read everything"]
