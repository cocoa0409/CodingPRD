  # ===========================================================================
  - section: validations
    instances:

      - name: missing_auth_header_rejected_before_everything
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "A request without X-User-Role fails priority-1 auth with 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER even when the payload is otherwise valid."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /api/restaurants"
              payload: { name: "NoRole", code: "NOROLE", weekly_bakery_budget_cents: 1000 }
              as: UnauthenticatedMissingRoleHeader
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: schema_error_beats_role_check_priority
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "A LineCook (not allowed on POST /api/stations) who also omits the required rack_slot_capacity receives 400 ERR_INVALID_REQUEST (priority 2 schema) rather than 403 ERR_FORBIDDEN (priority 3)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Restaurant; line cook."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/restaurants"
              payload: { name: "Ridgeview", code: "RIDGE", weekly_bakery_budget_cents: 100000 }
              as: SystemAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Kara Manager", certified_station_types: ["GRILL"] }
              as: KitchenManager
              as_user_id: "bootstrap-kitchen-manager"
              captures: { mgr_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Leo Line", certified_station_types: ["GRILL"] }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { lc_id: $.data.id }
          trigger:
            - call: "POST /api/stations"
              payload: { restaurant_id: "${rest_id}", name: "Grill 1", station_type: "GRILL" }
              as: LineCook
              as_user_id: "${lc_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST (schema checked before role authorization)"

      - name: forecast_submit_with_past_service_date_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors.ERR_FORECAST_DATE_PAST
        distinguishing_aspect: "Submitting a forecast whose service_date (2026-08-31) precedes the logical clock (2026-09-01) is 422 ERR_FORECAST_DATE_PAST; a forecast dated one day later submits cleanly."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Restaurant; two DRAFT forecasts, one dated 2026-08-31 and one dated 2026-09-02."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/restaurants"
              payload: { name: "Ridgeview", code: "RIDGE", weekly_bakery_budget_cents: 100000 }
              as: SystemAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /api/cooks"
              payload: { restaurant_id: "${rest_id}", name: "Kara Manager", certified_station_types: ["SAUTE"] }
              as: KitchenManager
              as_user_id: "bootstrap-kitchen-manager"
              captures: { mgr_id: $.data.id }
            - call: "POST /api/demand-forecasts"
              payload: { restaurant_id: "${rest_id}", service_date: "2026-08-31T00:00:00Z", expected_covers: 50, item_mix: [] }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { fc_past: $.data.id }
            - call: "POST /api/demand-forecasts"
              payload: { restaurant_id: "${rest_id}", service_date: "2026-09-02T00:00:00Z", expected_covers: 50, item_mix: [] }
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { fc_future: $.data.id }
          trigger:
            - call: "POST /api/demand-forecasts/${fc_past}/submit"
              payload: {}
              as: KitchenManager
              as_user_id: "${mgr_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /api/demand-forecasts/${fc_future}/submit"
              payload: {}
              as: KitchenManager
              as_user_id: "${mgr_id}"
          assert:
            - "past forecast submit: status 422 with error_id == ERR_FORECAST_DATE_PAST; forecast stays DRAFT"
            - "future forecast submit: status 200 and DemandForecast.${fc_future}.status == SUBMITTED"

      - name: recipe_with_retired_prep_item_component_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors.ERR_PREP_ITEM_NOT_ACTIVE
        distinguishing_aspect: "A recipe whose components reference a RETIRED prep item is rejected 422 ERR_PREP_ITEM_NOT_ACTIVE at creation — referential integrity against item status, not just existence."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Restaurant; prep item P that has been retired; DRAFT menu revision."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/restaurants"
              payload: { name: "Ridgeview", code: "RIDGE", weekly_bakery_budget_cents: 100000 }
              as: SystemAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /api/prep-items"
              payload: { name: "P", station_type: "SAUTE", shelf_life_hours: 48, min_batch_size: 10, batch_unit: "OZ" }
              as: MenuAdmin
              captures: { pi_id: $.data.id }
            - call: "POST /api/prep-items/${pi_id}/retire"
              payload: {}
              as: MenuAdmin
            - call: "POST /api/menu-revisions"
              payload: { restaurant_id: "${rest_id}", label: "V1", effective_from: "2026-09-15T00:00:00Z" }
              as: MenuAdmin
              captures: { rev_id: $.data.id }
          trigger:
            - call: "POST /api/recipes"
              payload: { menu_revision_id: "${rev_id}", name: "R", station_type: "SAUTE", components: [{ prep_item_id: "${pi_id}", quantity_per_portion: 3, unit: "OZ" }] }
              as: MenuAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_PREP_ITEM_NOT_ACTIVE"
            - "GET /api/recipes?menu_revision_id=${rev_id} returns 0 rows"

      - name: ticket_modification_forbidden_policy_rejected
        claim_type: conditional_validation
        grounds:
          - validations[priority=6]
          - entities.Recipe.fields.modification_policy
          - errors.ERR_TICKET_MODIFICATION_FORBIDDEN
