        distinguishing_aspect: |
          PIP issue with expected_pip_version one behind the current
          version returns 412 ERR_STALE_VERSION.
        test_recipe:
          setup:
            - "PIP P1 in DRAFT; client holds version snapshot from creation"
            - "Between snapshot and issue, another writer mutates PIP (e.g., a CheckIn is added — bumps version)"
          setup_api_calls:
            - call: "POST /hr-org-units"
              payload: { name: "OU1" }
              as: HRSystemAdmin
              captures: { ou_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
