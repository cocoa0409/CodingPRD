scenario: "933. Data-Broker Removal & Personal Cyber Service: scan & exposure inventory, opt-out/removal request per broker, recurring re-scan & re-removal, breach-monitoring & alert, password/identity hygiene, family plan, VPN/device add-on, reporting"
domain_name: data-broker-removal-personal-cyber
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer collection at the URL root; relationships are expressed
  # purely through foreign keys, never through nesting depth. Sub-resource GETs
  # exist only as reverse-reachability lookups (children of a named parent id).

  state_machine_shape: parallel
  # Eleven of the twelve machines are non-linear. The signature shape is the
  # ExposureRecord axis (FOUND -> SUPPRESSED -> REAPPEARED -> RE_SUPPRESSED ->
  # REAPPEARED, an unbounded loop) evolving independently of the RemovalRequest
  # axis (DRAFTED -> SUBMITTED -> ACKNOWLEDGED -> {COMPLETED|REJECTED|EXPIRED}
  # -> ESCALATED -> SUBMITTED, a capped loop) that targets it. Account carries a
  # second independent axis (legal_hold) alongside status; Member carries an
  # independent authorization axis alongside status.

  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic

  role_model: segregation_of_duties
  # The PrivacyAgent who submits a RemovalRequest to a broker may not be the
  # PrivacyAgent who records its completion (X-User-ID is compared).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------

entities:

  - name: Plan
    parent: null
    common_fields: true
    fields:
      - name: tier
        type: enum
        source: input
        description: "Commercial tier of the plan."
        constraints: "One of SOLO, FAMILY, FAMILY_PLUS. Several Plan rows may share a tier; they are distinguished by their quota columns."
      - name: name
        type: string
        source: input
        description: "Human-readable plan name."
        constraints: "1..80 characters."
      - name: monthly_fee_cents
        type: integer
        source: input
        description: "Recurring base fee charged per 30-day billing cycle, in cents."
        constraints: ">= 0."
      - name: max_members
        type: integer
        source: input
        description: "Maximum number of Member rows on an Account whose status is in {INVITED, ACTIVE}."
        constraints: ">= 1 and <= 12."
      - name: profile_quota_per_cycle
        type: integer
        source: input
        description: "PROFILE entitlement units granted to the Account at the start of every billing cycle."
        constraints: ">= 1."
      - name: scan_quota_per_cycle
        type: integer
        source: input
        description: "SCAN entitlement units granted to the Account at the start of every billing cycle."
        constraints: ">= 1."
      - name: removal_quota_per_cycle
        type: integer
        source: input
        description: "REMOVAL entitlement units granted to the Account at the start of every billing cycle (shared family pool)."
        constraints: ">= 1."
      - name: per_member_removal_subcap
        type: integer
        source: input
        description: "Maximum REMOVAL units a single Member may consume from the shared pool within one billing cycle."
        constraints: ">= 1 and <= removal_quota_per_cycle."

  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> Plan.id; the plan whose quotas and fee govern this account."
      - name: primary_member_id
        type: string
        source: system
        description: "FK -> Member.id; the Member row minted alongside the Account with is_primary true."
      - name: status
        type: enum
        source: system
        description: "Subscription lifecycle state."
        default: ACTIVE
        constraints: "One of ACTIVE, SUSPENDED, CANCELLED."
      - name: legal_hold
        type: boolean
        source: system
        description: "Independent write-gate axis. When true, the account is frozen for evidence preservation."
        default: false
      - name: legal_hold_set_at
        type: datetime
        source: system
        description: "Logical-clock instant at which legal_hold last flipped to true; null when it has never been set."
      - name: suspended_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent ACTIVE -> SUSPENDED transition; null otherwise."
      - name: cancelled_at
        type: datetime
        source: system
        description: "Logical-clock instant of the ACTIVE|SUSPENDED -> CANCELLED transition; null otherwise."
      - name: profile_units_granted
        type: integer
        source: computed
        description: "Sum of EntitlementLedgerEntry.amount where entry_type is GRANT, resource_type is PROFILE, and cycle_id is the account's OPEN BillingCycle."
      - name: profile_units_consumed
        type: integer
        source: computed
        description: "Sum of EntitlementLedgerEntry.amount where entry_type is CONSUME, resource_type is PROFILE, and cycle_id is the account's OPEN BillingCycle."
      - name: profile_units_released
        type: integer
        source: computed
        description: "Sum of EntitlementLedgerEntry.amount where entry_type is RELEASE, resource_type is PROFILE, and cycle_id is the account's OPEN BillingCycle."
      - name: profile_units_remaining
        type: integer
        source: computed
        description: "profile_units_granted - profile_units_consumed + profile_units_released."
      - name: scan_units_granted
        type: integer
        source: computed
        description: "Sum of EntitlementLedgerEntry.amount where entry_type is GRANT, resource_type is SCAN, and cycle_id is the account's OPEN BillingCycle."
      - name: scan_units_consumed
        type: integer
        source: computed
        description: "Sum of EntitlementLedgerEntry.amount where entry_type is CONSUME, resource_type is SCAN, and cycle_id is the account's OPEN BillingCycle."
      - name: scan_units_released
        type: integer
        source: computed
        description: "Sum of EntitlementLedgerEntry.amount where entry_type is RELEASE, resource_type is SCAN, and cycle_id is the account's OPEN BillingCycle."
      - name: scan_units_remaining
        type: integer
        source: computed
        description: "scan_units_granted - scan_units_consumed + scan_units_released."
      - name: removal_units_granted
        type: integer
        source: computed
        description: "Sum of EntitlementLedgerEntry.amount where entry_type is GRANT, resource_type is REMOVAL, and cycle_id is the account's OPEN BillingCycle."
      - name: removal_units_consumed
        type: integer
        source: computed
        description: "Sum of EntitlementLedgerEntry.amount where entry_type is CONSUME, resource_type is REMOVAL, and cycle_id is the account's OPEN BillingCycle."
      - name: removal_units_released
        type: integer
        source: computed
        description: "Sum of EntitlementLedgerEntry.amount where entry_type is RELEASE, resource_type is REMOVAL, and cycle_id is the account's OPEN BillingCycle."
      - name: removal_units_remaining
        type: integer
        source: computed
        description: "removal_units_granted - removal_units_consumed + removal_units_released."

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: system
        description: "FK -> Account.id; the household this member belongs to."
      - name: email
        type: string
        source: input
        description: "Contact email; unique within the owning Account."
        constraints: "Must contain '@'. Unique per account_id."
      - name: full_name
        type: string
        source: input
        description: "Member's legal name."
      - name: role_in_family
        type: enum
        source: input
        description: "Household role."
        constraints: "One of PRIMARY, ADULT, MINOR. Exactly one PRIMARY per Account."
      - name: is_primary
        type: boolean
        source: system
        description: "True only for the Member minted by POST /accounts."
        default: false
      - name: status
        type: enum
        source: system
        description: "Membership lifecycle state."
        default: INVITED
        constraints: "One of INVITED, ACTIVE, REMOVED. The primary member is created directly in ACTIVE."
      - name: authorization_status
        type: enum
        source: system
        description: "Independent axis: whether the member authorizes the service to act as their agent toward brokers."
        default: GRANTED
        constraints: "One of GRANTED, REVOKED."
      - name: invitation_token
        type: string
        source: system
        description: "Opaque server-issued token required to activate an INVITED member; null once status is ACTIVE."
      - name: activated_at
        type: datetime
        source: system
        description: "Logical-clock instant of INVITED -> ACTIVE."
      - name: authorization_revoked_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent GRANTED -> REVOKED flip; null when never revoked."
      - name: removal_units_consumed_this_cycle
        type: integer
        source: computed
        description: "Sum of EntitlementLedgerEntry.amount where member_id is this member, entry_type is CONSUME, resource_type is REMOVAL, and cycle_id is the account's OPEN BillingCycle, minus the matching RELEASE sum."

  - name: MonitoredProfile
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the person whose identity this profile monitors."
      - name: full_name
        type: string
        source: input
        description: "Name as it should be matched at data brokers."
      - name: date_of_birth
        type: string
        source: input
        description: "ISO 8601 calendar date used for broker matching."
      - name: primary_address
        type: string
        source: input
        description: "Street address used for broker matching."
      - name: rescan_cadence_days
        type: integer
        source: input
        description: "Requested interval between RECURRING scans."
        default: 30
        constraints: ">= 7 and <= 180."
      - name: two_factor_attested
        type: boolean
        source: input
        description: "Whether the member has attested that all credentials behind this identity are protected by a second factor. Selects the hygiene-score variant."
        default: false
      - name: status
        type: enum
        source: system
        description: "Monitoring lifecycle state."
        default: DRAFT
        constraints: "One of DRAFT, ACTIVE, PAUSED, RETIRED."
      - name: activated_at
        type: datetime
        source: system
        description: "Logical-clock instant of the first DRAFT -> ACTIVE transition."
      - name: retired_at
        type: datetime
        source: system
        description: "Logical-clock instant of the transition into RETIRED."
      - name: last_completed_scan_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the most recent ScanRun on this profile reached COMPLETED; null when none has."
      - name: open_exposure_count
        type: integer
        source: computed
        description: "Count of ExposureRecord rows with profile_id equal to this profile and status IN {FOUND, REAPPEARED}."
      - name: suppressed_exposure_count
        type: integer
        source: computed
        description: "Count of ExposureRecord rows with profile_id equal to this profile and status IN {SUPPRESSED, RE_SUPPRESSED}."
      - name: hygiene_score
        type: number
        source: computed
        description: "Output of calculations.hygiene_score for this profile under the variant selected by two_factor_attested."
      - name: hygiene_band
        type: enum
        source: computed
        description: "Band of hygiene_score."
        constraints: "One of STRONG, MODERATE, WEAK, CRITICAL."

  - name: Identifier
    parent: null
    common_fields: false
    fields:
      - name: profile_id
        type: string
        source: system
        description: "FK -> MonitoredProfile.id; the profile this identifier belongs to."
      - name: identifier_type
        type: enum
        source: input
        description: "Kind of monitored identifier."
        constraints: "One of EMAIL, PHONE, USERNAME, SSN_LAST4, ADDRESS."
      - name: identifier_value
        type: string
        source: input
        description: "The monitored value; matched verbatim against BreachEvent ingest payloads."
        constraints: "1..120 characters. Unique per (profile_id, identifier_type, identifier_value)."

  - name: Broker
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Data-broker trade name."
      - name: opt_out_method
        type: enum
        source: input
        description: "Channel through which opt-out requests must be delivered; selects the method SLA buffer."
        constraints: "One of WEB_FORM, EMAIL, POSTAL, PHONE."
      - name: jurisdiction
        type: enum
        source: input
        description: "Statutory regime that sets the response-window floor."
        constraints: "One of US_CA, US_VA, EU, OTHER."
      - name: response_window_days
        type: integer
        source: input
        description: "Self-declared broker response window in days, before method buffer and jurisdiction floor are applied."
        constraints: ">= BROKER_WINDOW_MIN_DAYS (5) and <= BROKER_WINDOW_MAX_DAYS (90)."
      - name: requires_identity_verification
        type: boolean
        source: input
        description: "When true, a RemovalRequest may only be submitted while the member holds an IdentityDocument whose effective_status is VALID."
        default: false
      - name: status
        type: enum
        source: system
        description: "Broker catalogue state."
        default: ACTIVE
        constraints: "One of ACTIVE, RETIRED."
      - name: retired_at
        type: datetime
        source: system
        description: "Logical-clock instant of ACTIVE -> RETIRED."
      - name: reappearance_count
        type: integer
        source: computed
        description: "LIFETIME scope: the sum of ExposureRecord.reappearance_count over every ExposureRecord row with broker_id equal to this broker."
      - name: expired_request_count
        type: integer
        source: computed
        description: "LIFETIME scope: count of RemovalRequest rows with broker_id equal to this broker whose CURRENT status is EXPIRED."
      - name: rejected_request_count
        type: integer
        source: computed
        description: "LIFETIME scope: count of RemovalRequest rows with broker_id equal to this broker whose CURRENT status is REJECTED."
      - name: on_time_completion_count
        type: integer
        source: computed
        description: "Count of RemovalRequest rows with broker_id equal to this broker whose status is COMPLETED and whose on_time is true (lifetime scope)."
      - name: compliance_score
        type: integer
        source: computed
        description: "Output of calculations.broker_compliance_score under the LIFETIME variant."

  - name: IdentityDocument
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: system
        description: "FK -> Member.id; the member whose identity the document evidences."
      - name: document_type
        type: enum
        source: input
        description: "Kind of evidence supplied."
        constraints: "One of PASSPORT, DRIVERS_LICENSE, STATE_ID, UTILITY_BILL."
      - name: document_reference
        type: string
        source: input
        description: "Opaque reference to the stored document image."
      - name: expires_at
        type: datetime
        source: input
        description: "Instant at which the document ceases to be acceptable evidence."
      - name: status
        type: enum
        source: system
        description: "Verification lifecycle state."
        default: PENDING
        constraints: "One of PENDING, VERIFIED, REJECTED, EXPIRED."
      - name: verified_at
        type: datetime
        source: system
        description: "Logical-clock instant of PENDING -> VERIFIED."
      - name: rejection_reason_code
        type: string
        source: input
        description: "Reason recorded on PENDING -> REJECTED; null otherwise."
      - name: effective_status
        type: enum
        source: computed
        description: "VALID when status is VERIFIED and current_utc is strictly before expires_at; INVALID in every other case."
        constraints: "One of VALID, INVALID."

  - name: ScanRun
    parent: null
    common_fields: true
    fields:
      - name: profile_id
        type: string
        source: input
        description: "FK -> MonitoredProfile.id; the profile being scanned."
      - name: kind
        type: enum
        source: input
        description: "INITIAL for the first scan of a profile, RECURRING for every later scan."
        constraints: "One of INITIAL, RECURRING."
      - name: status
        type: enum
        source: system
        description: "Scan lifecycle state."
        default: QUEUED
        constraints: "One of QUEUED, RUNNING, COMPLETED, FAILED, CANCELLED."
      - name: retry_count
        type: integer
        source: system
        description: "Number of FAILED -> QUEUED retries already performed."
        default: 0
        constraints: "<= MAX_SCAN_RETRIES (2)."
      - name: started_at
        type: datetime
        source: system
        description: "Logical-clock instant of QUEUED -> RUNNING."
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock instant of RUNNING -> COMPLETED."
      - name: failure_reason
        type: string
        source: input
        description: "Free-text reason recorded on RUNNING -> FAILED; null otherwise."
      - name: entitlement_units_held
        type: integer
        source: system
        description: "1 while this scan still holds its SCAN entitlement unit, 0 once the unit has been released."
        default: 1
      - name: findings_count
        type: integer
        source: computed
        description: "Count of POST /scan-runs/{id}/findings calls accepted against this scan."
      - name: new_exposure_count
        type: integer
        source: computed
        description: "Count of ExposureRecord rows whose discovered_by_scan_id equals this scan (rows the scan created)."
      - name: reappearance_hit_count
        type: integer
        source: computed
        description: "Count of accepted findings on this scan that were classified REAPPEARANCE and therefore mutated an existing ExposureRecord instead of creating one."

  - name: ExposureRecord
    parent: null
    common_fields: true
    fields:
      - name: profile_id
        type: string
        source: system
        description: "FK -> MonitoredProfile.id; whose identity is exposed."
      - name: broker_id
        type: string
        source: system
        description: "FK -> Broker.id; where the identity is exposed."
      - name: discovered_by_scan_id
        type: string
        source: system
        description: "FK -> ScanRun.id; the scan whose finding created this row. Never rewritten by later sightings."
      - name: exposure_kind
        type: enum
        source: input
        description: "Nature of the listing at the broker."
        constraints: "One of PEOPLE_SEARCH, MARKETING_LIST, CREDIT_HEADER, PUBLIC_RECORD."
      - name: source_url
        type: string
        source: input
        description: "Where the listing was observed."
      - name: status
        type: enum
        source: system
        description: "Exposure lifecycle state, independent of the RemovalRequest axis."
        default: FOUND
        constraints: "One of FOUND, SUPPRESSED, REAPPEARED, RE_SUPPRESSED."
      - name: first_found_at
        type: datetime
        source: system
        description: "Logical-clock instant of the finding that created this row; never rewritten."
      - name: last_seen_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent finding that matched this row."
      - name: last_suppressed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent transition into SUPPRESSED or RE_SUPPRESSED; null before the first suppression."
      - name: suppression_count
        type: integer
        source: system
        description: "Number of times this row has entered SUPPRESSED or RE_SUPPRESSED. Preserves suppression history across reappearances."
        default: 0
      - name: reappearance_count
        type: integer
        source: system
        description: "Number of times this row has entered REAPPEARED."
        default: 0
      - name: fee_exempt
        type: boolean
        source: computed
        description: "True when status is REAPPEARED. A RemovalRequest created against a fee_exempt exposure consumes 0 REMOVAL entitlement units."

  - name: RemovalRequest
    parent: null
    common_fields: true
    fields:
      - name: exposure_id
        type: string
        source: input
        description: "FK -> ExposureRecord.id; the exposure this request seeks to suppress."
      - name: broker_id
        type: string
        source: system
        description: "FK -> Broker.id; copied from the exposure at creation and never rewritten."
      - name: member_id
        type: string
        source: system
        description: "FK -> Member.id; resolved through the exposure's profile at creation."
      - name: status
        type: enum
        source: system
        description: "Removal-request lifecycle state, independent of the ExposureRecord axis."
        default: DRAFTED
        constraints: "One of DRAFTED, SUBMITTED, ACKNOWLEDGED, COMPLETED, REJECTED, EXPIRED, ESCALATED, VOIDED."
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent transition into SUBMITTED."
      - name: acknowledged_at
        type: datetime
        source: system
        description: "Logical-clock instant of SUBMITTED -> ACKNOWLEDGED."
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the transition into COMPLETED, REJECTED, EXPIRED or VOIDED."
      - name: sla_deadline_at
        type: datetime
        source: system
        description: "Output of calculations.removal_sla_deadline, stamped on every transition into SUBMITTED; null while DRAFTED."
      - name: effective_window_days
        type: integer
        source: system
        description: "The window in days that produced sla_deadline_at."
      - name: deadline_variant
        type: enum
        source: system
        description: "Which variant of calculations.removal_sla_deadline produced sla_deadline_at."
        constraints: "One of BASE, ESCALATED_RESUBMISSION."
      - name: submitted_by_agent_id
        type: string
        source: system
        description: "Opaque X-User-ID of the PrivacyAgent who performed the most recent DRAFTED|ESCALATED -> SUBMITTED transition."
      - name: completed_by_agent_id
        type: string
        source: system
        description: "Opaque X-User-ID of the PrivacyAgent who performed ACKNOWLEDGED -> COMPLETED."
      - name: broker_reference
        type: string
        source: input
        description: "Ticket reference supplied by the broker on acknowledgement."
      - name: rejection_reason_code
        type: string
        source: input
        description: "Reason recorded on ACKNOWLEDGED -> REJECTED; null otherwise."
      - name: escalation_count
        type: integer
        source: system
        description: "Number of times this request has entered ESCALATED."
        default: 0
        constraints: "<= MAX_ESCALATIONS (2)."
      - name: entitlement_units_consumed
        type: integer
        source: system
        description: "1 when the request drew a REMOVAL unit at creation, 0 when the source exposure was fee_exempt."
      - name: entitlement_units_released
        type: integer
        source: system
        description: "1 once the request has released its REMOVAL unit through VOIDED, 0 otherwise."
        default: 0
      - name: on_time
        type: boolean
        source: computed
        description: "True when status is COMPLETED and closed_at is less than or equal to sla_deadline_at; false when status is COMPLETED and closed_at is strictly after sla_deadline_at; null in every other status."

  - name: BreachEvent
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Public name of the breach."
      - name: breach_date
        type: datetime
        source: input
        description: "Instant the breach is believed to have occurred."
      - name: disclosed_at
        type: datetime
        source: input
        description: "Instant the breach became public."
        constraints: "Must be greater than or equal to breach_date."
      - name: record_types
        type: array
        source: input
        description: "Categories of record compromised; each element is one of EMAIL_ADDRESS, PHONE_NUMBER, PHYSICAL_ADDRESS, PASSWORD_HASH, FINANCIAL_ACCOUNT, SSN."
        constraints: "Non-empty array."
      - name: base_severity_points
        type: integer
        source: input
        description: "Analyst-assigned baseline severity contribution."
        constraints: ">= 0 and <= 40."
      - name: ingest_count
        type: integer
        source: system
        description: "Number of accepted POST /breach-events/{id}/ingest calls against this event."
        default: 0
      - name: alert_count
        type: integer
        source: computed
        description: "Count of BreachAlert rows whose breach_event_id equals this event."

  - name: BreachAlert
    parent: null
    common_fields: true
    fields:
      - name: breach_event_id
        type: string
        source: system
        description: "FK -> BreachEvent.id; the breach that produced this alert."
      - name: identifier_id
        type: string
        source: system
        description: "FK -> Identifier.id; the monitored identifier that matched. The pair (breach_event_id, identifier_id) is unique."
      - name: member_id
        type: string
        source: system
        description: "FK -> Member.id; resolved through the identifier's profile at creation."
      - name: severity
        type: enum
        source: system
        description: "Current severity band. Monotone: may rise across re-ingests, never fall."
        constraints: "One of LOW, MEDIUM, HIGH, CRITICAL."
      - name: severity_points
        type: integer
        source: system
        description: "Highest severity_points value ever computed for this alert."
      - name: status
        type: enum
        source: system
        description: "Triage lifecycle state."
        default: NEW
        constraints: "One of NEW, ACKNOWLEDGED, RESOLVED."
      - name: acknowledged_at
        type: datetime
        source: system
        description: "Logical-clock instant of NEW -> ACKNOWLEDGED."
      - name: resolved_at
        type: datetime
        source: system
        description: "Logical-clock instant of ACKNOWLEDGED -> RESOLVED."
      - name: escalation_count
        type: integer
        source: system
        description: "Number of re-ingests that raised this alert's severity band."
        default: 0

  - name: CredentialFinding
    parent: null
    common_fields: true
    fields:
      - name: profile_id
        type: string
        source: input
        description: "FK -> MonitoredProfile.id; the profile whose credential hygiene this finding scores."
      - name: finding_type
        type: enum
        source: input
        description: "Kind of credential weakness."
        constraints: "One of BREACHED_PASSWORD, WEAK_PASSWORD, REUSED_PASSWORD, STALE_PASSWORD."
      - name: detail
        type: string
        source: input
        description: "Which credential store the weakness was observed in."
      - name: status
        type: enum
        source: system
        description: "Remediation state."
        default: OPEN
        constraints: "One of OPEN, REMEDIATED."
      - name: weight
        type: integer
        source: computed
        description: "Penalty weight for finding_type taken from calculations.hygiene_score constants; contributes only while status is OPEN."
      - name: remediated_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent OPEN -> REMEDIATED transition."

  - name: AddOnSubscription
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: system
        description: "FK -> Account.id; the account carrying this add-on."
      - name: addon_type
        type: enum
        source: input
        description: "Which add-on product."
        constraints: "One of VPN, DEVICE_PROTECTION. Unique per (account_id, addon_type) among rows whose status is in {ACTIVE, SUSPENDED}."
      - name: seats_total
        type: integer
        source: input
        description: "Number of device seats the add-on grants."
        constraints: ">= 1 and <= 20."
      - name: per_seat_fee_cents
        type: integer
        source: input
        description: "Monthly fee per seat, in cents; prorated on a different basis from the base plan."
        constraints: ">= 0."
      - name: status
        type: enum
        source: system
        description: "Add-on lifecycle state."
        default: ACTIVE
        constraints: "One of ACTIVE, SUSPENDED, CANCELLED."
      - name: suspended_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent ACTIVE -> SUSPENDED transition."
      - name: prorated_charge_cents
        type: integer
        source: system
        description: "Output of calculations.addon_proration_amount under the SEAT_ADDED variant, stamped at creation."
      - name: seats_bound
        type: integer
        source: computed
        description: "Count of DeviceSeat rows with addon_id equal to this add-on and status BOUND."
      - name: seats_available
        type: integer
        source: computed
        description: "seats_total - seats_bound."

  - name: DeviceSeat
    parent: null
    common_fields: true
    fields:
      - name: addon_id
        type: string
        source: input
        description: "FK -> AddOnSubscription.id; the add-on whose seat pool this seat draws from."
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; who the seat is bound to."
      - name: device_label
        type: string
        source: input
        description: "Human label for the bound device."
      - name: status
        type: enum
        source: system
        description: "Seat lifecycle state."
        default: BOUND
        constraints: "One of BOUND, RELEASED, VOIDED."
      - name: bound_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent transition into BOUND."
      - name: released_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent BOUND -> RELEASED transition; null when never released."
      - name: voided_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent BOUND -> VOIDED transition; null when never voided."
      - name: bind_count
        type: integer
        source: system
        description: "Number of times this seat has entered BOUND, counting its creation. Binding history survives voiding."
        default: 1
      - name: rebind_eligible_at
        type: datetime
        source: computed
        description: "released_at plus SEAT_REBIND_COOLOFF_HOURS (72); null when released_at is null."

  - name: BillingCycle
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: system
        description: "FK -> Account.id; the account this cycle bills."
      - name: cycle_seq
        type: integer
        source: system
        description: "1 for the cycle minted with the account, incrementing by 1 on every close."
      - name: starts_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the cycle opened."
      - name: ends_at
        type: datetime
        source: system
        description: "starts_at plus CYCLE_LENGTH_DAYS (30)."
      - name: status
        type: enum
        source: system
        description: "Cycle state."
        default: OPEN
        constraints: "One of OPEN, CLOSED."
      - name: base_charge_cents
        type: integer
        source: system
        description: "Plan.monthly_fee_cents of the account's plan at the instant the cycle opened."
      - name: proration_charge_cents
        type: integer
        source: system
        description: "Accumulated UPGRADE proration charges booked into this cycle."
        default: 0
      - name: proration_credit_cents
        type: integer
        source: system
        description: "Accumulated DOWNGRADE proration credits booked into this cycle."
        default: 0
      - name: addon_charge_cents
        type: integer
        source: system
        description: "Accumulated add-on proration charges booked into this cycle."
        default: 0
      - name: addon_credit_cents
        type: integer
        source: system
        description: "Accumulated add-on proration credits booked into this cycle."
        default: 0
      - name: pre_discount_total_cents
        type: integer
        source: computed
        description: "base_charge_cents + proration_charge_cents + addon_charge_cents - proration_credit_cents - addon_credit_cents, floored at 0."
      - name: loyalty_discount_cents
        type: integer
        source: computed
        description: "Output of calculations.cycle_total_charge step 3; keyed on pre_discount_total_cents, never on the post-discount total."
      - name: total_charged_cents
        type: integer
        source: computed
        description: "pre_discount_total_cents - loyalty_discount_cents."
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant of OPEN -> CLOSED."

  - name: EntitlementLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: system
        description: "FK -> Account.id; the account whose pool this entry moves."
      - name: member_id
        type: string
        source: system
        description: "FK -> Member.id; the member the movement is attributed to; null for account-level GRANT entries."
      - name: cycle_id
        type: string
        source: system
        description: "FK -> BillingCycle.id; the cycle the movement is booked into."
      - name: resource_type
        type: enum
        source: system
        description: "Which pool moved."
        constraints: "One of PROFILE, SCAN, REMOVAL."
      - name: entry_type
        type: enum
        source: system
        description: "Direction of the movement."
        constraints: "One of GRANT, CONSUME, RELEASE."
      - name: amount
        type: integer
        source: system
        description: "Magnitude of the movement, always strictly positive."
        constraints: ">= 1."
      - name: signed_amount
        type: integer
        source: computed
        description: "amount for GRANT and RELEASE entries; negative amount for CONSUME entries."
      - name: reason_code
        type: enum
        source: system
        description: "Why the movement happened."
        constraints: "One of CYCLE_GRANT, PROFILE_ACTIVATED, PROFILE_RETIRED, SCAN_QUEUED, SCAN_CANCELLED, SCAN_ABANDONED, REMOVAL_DRAFTED, REMOVAL_VOIDED, AUTHORIZATION_REVOKED."
      - name: source_reference
        type: string
        source: system
        description: "Id of the row that caused the movement (a MonitoredProfile, ScanRun or RemovalRequest). Informational only; never used in any selector, ranking or ordering decision."

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# 15 machines across 13 entities; two entities (Account, Member, BreachAlert)
# each carry two independent axes that advance without reference to each other.
# ---------------------------------------------------------------------------

state_machines:

  - entity: Account
    axis: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /accounts/{id}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "Account.legal_hold is false"
          - "Account.status == ACTIVE"
        side_effects:
          - "sets Account.suspended_at to current_utc"
          - "CASCADE HOP 2 (caused by hop 1): every MonitoredProfile whose member_id belongs to this account and whose status is ACTIVE transitions ACTIVE -> PAUSED"
          - "CASCADE HOP 3 (caused by hop 2): every ScanRun whose profile_id is one of those newly PAUSED profiles and whose status is QUEUED transitions QUEUED -> CANCELLED"
          - "CASCADE HOP 4 (caused by hop 3): each ScanRun entering CANCELLED with entitlement_units_held == 1 sets entitlement_units_held to 0 and appends EntitlementLedgerEntry(resource_type SCAN, entry_type RELEASE, amount 1, reason_code SCAN_CANCELLED, cycle_id = the account's OPEN BillingCycle)"
          - "CASCADE HOP 5 (caused by hop 4): each appended ledger entry raises Account.scan_units_released and therefore Account.scan_units_remaining"
          - "BRANCH: every AddOnSubscription with this account_id and status ACTIVE transitions ACTIVE -> SUSPENDED, which in turn voids its BOUND DeviceSeat rows"
          - "increments Account.version by 1"
        note: "The hop-2..hop-5 chain is the depth-5 cascade. Ordering is fixed: profiles first, then their queued scans, then the ledger, then the derived pool figures."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /accounts/{id}/resume"
        actor: PlatformAdmin
        preconditions:
          - "Account.legal_hold is false"
          - "Account.status == SUSPENDED"
        side_effects:
          - "clears Account.suspended_at to null"
          - "every AddOnSubscription with this account_id and status SUSPENDED transitions SUSPENDED -> ACTIVE"
          - "caused by that add-on transition: every DeviceSeat of the resumed add-on whose status is VOIDED and whose member_id has Member.status == ACTIVE transitions VOIDED -> BOUND, increments DeviceSeat.bind_count by 1 and sets bound_at to current_utc"
          - "MonitoredProfile rows paused by the suspension are NOT auto-resumed; they stay PAUSED until POST /monitored-profiles/{id}/activate is called"
          - "increments Account.version by 1"
        note: "Resume is deliberately asymmetric: seats come back (binding history preserved), monitoring does not restart by itself."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /accounts/{id}/cancel"
        actor: PlatformAdmin | AccountOwner
        preconditions:
          - "Account.legal_hold is false"
          - "Account.status == ACTIVE"
        side_effects:
          - "sets Account.cancelled_at to current_utc"
          - "every AddOnSubscription with this account_id and status in {ACTIVE, SUSPENDED} transitions to CANCELLED"
          - "caused by that add-on transition: every DeviceSeat of those add-ons whose status is BOUND transitions BOUND -> VOIDED"
          - "every MonitoredProfile of the account with status in {DRAFT, ACTIVE, PAUSED} transitions to RETIRED"
          - "the account's OPEN BillingCycle transitions OPEN -> CLOSED"
          - "increments Account.version by 1"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /accounts/{id}/cancel"
        actor: PlatformAdmin | AccountOwner
        preconditions:
          - "Account.legal_hold is false"
          - "Account.status == SUSPENDED"
        side_effects:
          - "identical to the ACTIVE -> CANCELLED side-effect set"
          - "increments Account.version by 1"

  - entity: Account
    axis: legal_hold
    initial_state: HOLD_OFF
    terminal_states: []
    transitions:
      - from: HOLD_OFF
        to: HOLD_ON
        trigger: "POST /accounts/{id}/legal-hold with hold_state HOLD_ON"
        actor: PlatformAdmin
        preconditions:
          - "Account.legal_hold is false"
        side_effects:
          - "sets Account.legal_hold to true and Account.legal_hold_set_at to current_utc"
          - "increments Account.version by 1"
        note: "Global write gate. While HOLD_ON, validation priority 12 rejects every account-scoped mutating endpoint except POST /accounts/{id}/legal-hold itself."
      - from: HOLD_ON
        to: HOLD_OFF
        trigger: "POST /accounts/{id}/legal-hold with hold_state HOLD_OFF"
        actor: PlatformAdmin
        preconditions:
          - "Account.legal_hold is true"
        side_effects:
          - "sets Account.legal_hold to false and clears legal_hold_set_at to null"
          - "increments Account.version by 1"

  - entity: Member
    axis: status
    initial_state: INVITED
    terminal_states: [REMOVED]
    transitions:
      - from: INVITED
        to: ACTIVE
        trigger: "POST /members/{id}/activate"
        actor: Member | AccountOwner
        preconditions:
          - "Member.status == INVITED"
          - "the supplied invitation_token equals Member.invitation_token"
          - "Account.status == ACTIVE"
        side_effects:
          - "sets Member.activated_at to current_utc and clears invitation_token to null"
          - "increments Member.version by 1"
      - from: INVITED
        to: REMOVED
        trigger: "POST /members/{id}/remove"
        actor: AccountOwner | PlatformAdmin
        preconditions:
          - "Member.status == INVITED"
          - "Member.is_primary is false"
        side_effects:
          - "increments Member.version by 1"
      - from: ACTIVE
        to: REMOVED
        trigger: "POST /members/{id}/remove"
        actor: AccountOwner | PlatformAdmin
        preconditions:
          - "Member.status == ACTIVE"
          - "Member.is_primary is false"
        side_effects:
          - "every MonitoredProfile with this member_id and status in {DRAFT, ACTIVE, PAUSED} transitions to RETIRED"
          - "caused by that profile transition: each profile leaving ACTIVE or PAUSED appends EntitlementLedgerEntry(resource_type PROFILE, entry_type RELEASE, amount 1, reason_code PROFILE_RETIRED)"
          - "every DeviceSeat with this member_id and status BOUND transitions BOUND -> RELEASED"
          - "increments Member.version by 1"

  - entity: Member
    axis: authorization
    initial_state: GRANTED
    terminal_states: []
    transitions:
      - from: GRANTED
        to: REVOKED
        trigger: "POST /members/{id}/authorization with action REVOKE"
        actor: Member | AccountOwner
        preconditions:
          - "Member.authorization_status == GRANTED"
          - "Member.status == ACTIVE"
        side_effects:
          - "sets Member.authorization_revoked_at to current_utc"
          - "CASCADE HOP 2 (caused by hop 1): every RemovalRequest with this member_id and status DRAFTED transitions DRAFTED -> VOIDED and sets closed_at to current_utc"
          - "CASCADE HOP 3 (caused by hop 2): each request entering VOIDED whose entitlement_units_consumed == 1 and entitlement_units_released == 0 sets entitlement_units_released to 1 and appends EntitlementLedgerEntry(resource_type REMOVAL, entry_type RELEASE, amount 1, reason_code AUTHORIZATION_REVOKED)"
          - "CASCADE HOP 4 (caused by hop 3): each appended ledger entry raises Account.removal_units_released / removal_units_remaining and lowers Member.removal_units_consumed_this_cycle"
          - "RemovalRequest rows already in SUBMITTED, ACKNOWLEDGED, ESCALATED, COMPLETED, REJECTED or EXPIRED are left untouched"
          - "increments Member.version by 1"
        note: "The precise split demanded by the domain: work already handed to a broker continues, work not yet handed over is voided and refunded."
      - from: REVOKED
        to: GRANTED
        trigger: "POST /members/{id}/authorization with action GRANT"
        actor: Member
        preconditions:
          - "Member.authorization_status == REVOKED"
          - "Member.status == ACTIVE"
        side_effects:
          - "clears Member.authorization_revoked_at to null"
          - "voided RemovalRequest rows are NOT resurrected; new requests must be drafted"
          - "increments Member.version by 1"

  - entity: MonitoredProfile
    axis: status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /monitored-profiles/{id}/activate"
        actor: Member | AccountOwner
        preconditions:
          - "MonitoredProfile.status == DRAFT"
          - "at least one Identifier row exists with profile_id equal to this profile"
          - "Member.status == ACTIVE"
          - "Account.status == ACTIVE"
          - "Account.profile_units_remaining >= 1"
        side_effects:
          - "sets activated_at to current_utc"
          - "appends EntitlementLedgerEntry(resource_type PROFILE, entry_type CONSUME, amount 1, reason_code PROFILE_ACTIVATED, member_id = this profile's member)"
          - "caused by that ledger entry: Account.profile_units_consumed rises and profile_units_remaining falls by 1"
          - "increments MonitoredProfile.version by 1"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /monitored-profiles/{id}/pause, or cascade hop 2 of Account ACTIVE -> SUSPENDED"
        actor: Member | AccountOwner | system
        preconditions:
          - "MonitoredProfile.status == ACTIVE"
        side_effects:
          - "every ScanRun with this profile_id and status QUEUED transitions QUEUED -> CANCELLED"
          - "increments MonitoredProfile.version by 1"
        note: "The PROFILE entitlement unit stays held while PAUSED; only RETIRED releases it."
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /monitored-profiles/{id}/activate"
        actor: Member | AccountOwner
        preconditions:
          - "MonitoredProfile.status == PAUSED"
          - "Member.status == ACTIVE"
          - "Account.status == ACTIVE"
        side_effects:
          - "no new PROFILE entitlement unit is consumed, because the unit consumed at DRAFT -> ACTIVE was never released"
          - "increments MonitoredProfile.version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /monitored-profiles/{id}/retire, or cascade of Member ACTIVE -> REMOVED, or cascade of Account -> CANCELLED"
        actor: Member | AccountOwner | system
        preconditions:
          - "MonitoredProfile.status == ACTIVE"
        side_effects:
          - "sets retired_at to current_utc"
          - "every ScanRun with this profile_id and status QUEUED transitions QUEUED -> CANCELLED"
          - "appends EntitlementLedgerEntry(resource_type PROFILE, entry_type RELEASE, amount 1, reason_code PROFILE_RETIRED)"
          - "increments MonitoredProfile.version by 1"
      - from: PAUSED
        to: RETIRED
        trigger: "POST /monitored-profiles/{id}/retire, or cascade of Member ACTIVE -> REMOVED, or cascade of Account -> CANCELLED"
        actor: Member | AccountOwner | system
        preconditions:
          - "MonitoredProfile.status == PAUSED"
        side_effects:
          - "sets retired_at to current_utc"
          - "appends EntitlementLedgerEntry(resource_type PROFILE, entry_type RELEASE, amount 1, reason_code PROFILE_RETIRED)"
          - "increments MonitoredProfile.version by 1"
      - from: DRAFT
        to: RETIRED
        trigger: "POST /monitored-profiles/{id}/retire, or cascade of Member ACTIVE -> REMOVED, or cascade of Account -> CANCELLED"
        actor: Member | AccountOwner | system
        preconditions:
          - "MonitoredProfile.status == DRAFT"
        side_effects:
          - "sets retired_at to current_utc"
          - "no PROFILE entitlement unit is released, because none was ever consumed"
          - "increments MonitoredProfile.version by 1"

  - entity: ScanRun
    axis: status
    initial_state: QUEUED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: QUEUED
        to: RUNNING
        trigger: "POST /scan-runs/{id}/start"
        actor: PrivacyAgent
        preconditions:
          - "ScanRun.status == QUEUED"
          - "MonitoredProfile.status == ACTIVE"
          - "Account.status == ACTIVE and Account.legal_hold is false"
        side_effects:
          - "sets started_at to current_utc"
          - "increments ScanRun.version by 1"
        note: "The profile-ACTIVE precondition is an invariant, not a reachable rejection path: the pause and retire cascades cancel every QUEUED scan, so a QUEUED scan under a non-ACTIVE profile cannot be observed. The reachable ERR_PROFILE_NOT_ACTIVE paths are POST /scan-runs and POST /scan-runs/{id}/retry."
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /scan-runs/{id}/complete"
        actor: PrivacyAgent
        preconditions:
          - "ScanRun.status == RUNNING"
        side_effects:
          - "sets completed_at to current_utc"
          - "sets MonitoredProfile.last_completed_scan_at to current_utc"
          - "the SCAN entitlement unit stays consumed (entitlement_units_held remains 1)"
          - "increments ScanRun.version by 1"
      - from: RUNNING
        to: FAILED
        trigger: "POST /scan-runs/{id}/fail"
        actor: PrivacyAgent
        preconditions:
          - "ScanRun.status == RUNNING"
        side_effects:
          - "records failure_reason"
          - "increments ScanRun.version by 1"
      - from: FAILED
        to: QUEUED
        trigger: "POST /scan-runs/{id}/retry"
        actor: PrivacyAgent
        preconditions:
          - "ScanRun.status == FAILED"
          - "ScanRun.retry_count < MAX_SCAN_RETRIES (2)"
          - "MonitoredProfile.status == ACTIVE"
        side_effects:
          - "increments retry_count by 1, clears started_at to null"
          - "no additional SCAN entitlement unit is consumed"
          - "increments ScanRun.version by 1"
        note: "Capped loop: the third retry attempt on the same scan is rejected with ERR_SCAN_RETRY_CAP_REACHED."
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /scan-runs/{id}/cancel, or cascade hop 3 of Account ACTIVE -> SUSPENDED, or cascade of MonitoredProfile ACTIVE -> PAUSED / -> RETIRED"
        actor: PrivacyAgent | AccountOwner | Member | system
        preconditions:
          - "ScanRun.status == QUEUED"
        side_effects:
          - "sets entitlement_units_held to 0"
          - "appends EntitlementLedgerEntry(resource_type SCAN, entry_type RELEASE, amount 1, reason_code SCAN_CANCELLED)"
          - "caused by that ledger entry: Account.scan_units_released rises and scan_units_remaining rises by 1"
          - "increments ScanRun.version by 1"
      - from: FAILED
        to: CANCELLED
        trigger: "POST /scan-runs/{id}/cancel"
        actor: PrivacyAgent | AccountOwner | Member
        preconditions:
          - "ScanRun.status == FAILED"
        side_effects:
          - "sets entitlement_units_held to 0"
          - "appends EntitlementLedgerEntry(resource_type SCAN, entry_type RELEASE, amount 1, reason_code SCAN_ABANDONED)"
          - "caused by that ledger entry: Account.scan_units_released rises and scan_units_remaining rises by 1"
          - "increments ScanRun.version by 1"

  - entity: ExposureRecord
    axis: status
    initial_state: FOUND
    terminal_states: []
    transitions:
      - from: FOUND
        to: SUPPRESSED
        trigger: "POST /removal-requests/{id}/complete (cascade hop 2)"
        actor: system
        preconditions:
          - "ExposureRecord.status == FOUND"
          - "the completing RemovalRequest.exposure_id equals this exposure"
        side_effects:
          - "increments suppression_count by 1 and sets last_suppressed_at to current_utc"
          - "caused by this transition: the exposure's MonitoredProfile re-derives open_exposure_count (down by 1) and suppressed_exposure_count (up by 1)"
          - "increments ExposureRecord.version by 1"
      - from: REAPPEARED
        to: RE_SUPPRESSED
        trigger: "POST /removal-requests/{id}/complete (cascade hop 2)"
        actor: system
        preconditions:
          - "ExposureRecord.status == REAPPEARED"
        side_effects:
          - "increments suppression_count by 1 and sets last_suppressed_at to current_utc"
          - "caused by this transition: the exposure's MonitoredProfile re-derives open_exposure_count and suppressed_exposure_count"
          - "increments ExposureRecord.version by 1"
      - from: SUPPRESSED
        to: REAPPEARED
        trigger: "POST /scan-runs/{id}/findings whose classification is REAPPEARANCE"
        actor: system
        preconditions:
          - "ExposureRecord.status == SUPPRESSED"
          - "floor((current_utc - last_suppressed_at) / 86400 seconds) < REAPPEARANCE_COOLOFF_DAYS (45)"
        side_effects:
          - "increments reappearance_count by 1, sets last_seen_at to current_utc, leaves suppression_count and first_found_at untouched"
          - "sets fee_exempt to true (derived from status REAPPEARED)"
          - "caused by this transition: the exposure's Broker re-derives reappearance_count and therefore compliance_score"
          - "no new ExposureRecord row is created — the conserved quantity is the number of ExposureRecord rows for the (profile_id, broker_id) pair"
          - "increments ExposureRecord.version by 1"
      - from: RE_SUPPRESSED
        to: REAPPEARED
        trigger: "POST /scan-runs/{id}/findings whose classification is REAPPEARANCE"
        actor: system
        preconditions:
          - "ExposureRecord.status == RE_SUPPRESSED"
          - "floor((current_utc - last_suppressed_at) / 86400 seconds) < REAPPEARANCE_COOLOFF_DAYS (45)"
        side_effects:
          - "identical to the SUPPRESSED -> REAPPEARED side-effect set; the loop is unbounded"
          - "increments ExposureRecord.version by 1"

  - entity: RemovalRequest
    axis: status
    initial_state: DRAFTED
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: DRAFTED
        to: SUBMITTED
        trigger: "POST /removal-requests/{id}/submit"
        actor: PrivacyAgent
        preconditions:
          - "RemovalRequest.status == DRAFTED"
          - "Member.authorization_status == GRANTED"
          - "Broker.status == ACTIVE"
          - "ExposureRecord.status IN {FOUND, REAPPEARED}"
          - "when Broker.requires_identity_verification is true: the member holds at least one IdentityDocument whose effective_status is VALID"
        side_effects:
          - "sets submitted_at to current_utc and submitted_by_agent_id to the calling X-User-ID"
          - "sets deadline_variant to BASE and stamps effective_window_days / sla_deadline_at from calculations.removal_sla_deadline"
          - "increments RemovalRequest.version by 1"
        note: "On THIS edge the authorization precondition is an invariant rather than a reachable rejection: revoking authorization voids every DRAFTED request, and rung 16 blocks drafting new ones while REVOKED. ERR_AUTHORIZATION_REVOKED is reachable on submit only from the ESCALATED edge below, because escalated requests survive a revocation."
      - from: ESCALATED
        to: SUBMITTED
        trigger: "POST /removal-requests/{id}/submit"
        actor: PrivacyAgent
        preconditions:
          - "RemovalRequest.status == ESCALATED"
          - "Member.authorization_status == GRANTED"
          - "Broker.status == ACTIVE"
        side_effects:
          - "sets submitted_at to current_utc and submitted_by_agent_id to the calling X-User-ID"
          - "sets deadline_variant to ESCALATED_RESUBMISSION and stamps effective_window_days / sla_deadline_at from the ESCALATED_RESUBMISSION variant"
          - "increments RemovalRequest.version by 1"
        note: "Re-entry into SUBMITTED from ESCALATED is what makes this machine a capped loop."
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /removal-requests/{id}/acknowledge"
        actor: PrivacyAgent
        preconditions:
          - "RemovalRequest.status == SUBMITTED"
        side_effects:
          - "records broker_reference and sets acknowledged_at to current_utc"
          - "increments RemovalRequest.version by 1"
      - from: ACKNOWLEDGED
        to: COMPLETED
        trigger: "POST /removal-requests/{id}/complete"
        actor: PrivacyAgent
        preconditions:
          - "RemovalRequest.status == ACKNOWLEDGED"
          - "the calling X-User-ID differs from RemovalRequest.submitted_by_agent_id"
        side_effects:
          - "sets closed_at to current_utc and completed_by_agent_id to the calling X-User-ID"
          - "CASCADE HOP 2 (caused by hop 1): the linked ExposureRecord transitions FOUND -> SUPPRESSED or REAPPEARED -> RE_SUPPRESSED"
          - "CASCADE HOP 3 (caused by hop 2): the exposure's MonitoredProfile re-derives open_exposure_count and suppressed_exposure_count"
          - "the Broker re-derives on_time_completion_count from this request's computed on_time value, and therefore compliance_score"
          - "increments RemovalRequest.version by 1"
      - from: ACKNOWLEDGED
        to: REJECTED
        trigger: "POST /removal-requests/{id}/reject"
        actor: PrivacyAgent
        preconditions:
          - "RemovalRequest.status == ACKNOWLEDGED"
        side_effects:
          - "records rejection_reason_code and sets closed_at to current_utc"
          - "the consumed REMOVAL entitlement unit is NOT released — a rejected request has still cost the household a unit"
          - "the Broker re-derives rejected_request_count and therefore compliance_score"
          - "the linked ExposureRecord does NOT change status"
          - "increments RemovalRequest.version by 1"
      - from: SUBMITTED
        to: EXPIRED
        trigger: "POST /removal-requests/{id}/expire"
        actor: PrivacyAgent | PlatformAdmin
        preconditions:
          - "RemovalRequest.status == SUBMITTED"
          - "current_utc >= RemovalRequest.sla_deadline_at (inclusive boundary)"
        side_effects:
          - "sets closed_at to current_utc"
          - "the Broker re-derives expired_request_count and therefore compliance_score"
          - "increments RemovalRequest.version by 1"
      - from: ACKNOWLEDGED
        to: EXPIRED
        trigger: "POST /removal-requests/{id}/expire"
        actor: PrivacyAgent | PlatformAdmin
        preconditions:
          - "RemovalRequest.status == ACKNOWLEDGED"
          - "current_utc >= RemovalRequest.sla_deadline_at (inclusive boundary)"
        side_effects:
          - "identical to the SUBMITTED -> EXPIRED side-effect set"
          - "increments RemovalRequest.version by 1"
      - from: REJECTED
        to: ESCALATED
        trigger: "POST /removal-requests/{id}/escalate"
        actor: PrivacyAgent
        preconditions:
          - "RemovalRequest.status == REJECTED"
          - "RemovalRequest.escalation_count < MAX_ESCALATIONS (2)"
          - "Broker.status == ACTIVE"
        side_effects:
          - "increments escalation_count by 1 and clears closed_at to null"
          - "increments RemovalRequest.version by 1"
      - from: EXPIRED
        to: ESCALATED
        trigger: "POST /removal-requests/{id}/escalate"
        actor: PrivacyAgent
        preconditions:
          - "RemovalRequest.status == EXPIRED"
          - "RemovalRequest.escalation_count < MAX_ESCALATIONS (2)"
          - "Broker.status == ACTIVE"
        side_effects:
          - "increments escalation_count by 1 and clears closed_at to null"
          - "increments RemovalRequest.version by 1"
      - from: DRAFTED
        to: VOIDED
        trigger: "POST /removal-requests/{id}/void, or cascade hop 2 of Member GRANTED -> REVOKED"
        actor: Member | AccountOwner | PrivacyAgent | system
        preconditions:
          - "RemovalRequest.status == DRAFTED"
        side_effects:
          - "sets closed_at to current_utc"
          - "when entitlement_units_consumed == 1 and entitlement_units_released == 0: sets entitlement_units_released to 1 and appends EntitlementLedgerEntry(resource_type REMOVAL, entry_type RELEASE, amount 1, reason_code REMOVAL_VOIDED)"
          - "caused by that ledger entry: Account.removal_units_released rises, removal_units_remaining rises by 1, and Member.removal_units_consumed_this_cycle falls by 1"
          - "increments RemovalRequest.version by 1"

  - entity: IdentityDocument
    axis: status
    initial_state: PENDING
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /identity-documents/{id}/verify"
        actor: PrivacyAgent | PlatformAdmin
        preconditions:
          - "IdentityDocument.status == PENDING"
          - "current_utc is strictly before IdentityDocument.expires_at"
        side_effects:
          - "sets verified_at to current_utc; effective_status becomes VALID"
          - "increments IdentityDocument.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /identity-documents/{id}/reject"
        actor: PrivacyAgent
        preconditions:
          - "IdentityDocument.status == PENDING"
        side_effects:
          - "records rejection_reason_code; effective_status stays INVALID"
          - "increments IdentityDocument.version by 1"
        note: "Fork with divergent side-effect sets: the VERIFIED branch unlocks submission to identity-verifying brokers, the REJECTED branch does not."
      - from: VERIFIED
        to: EXPIRED
        trigger: "system event evaluated whenever any endpoint consults the document (notably POST /removal-requests/{id}/submit) and current_utc >= expires_at"
        actor: system
        preconditions:
          - "IdentityDocument.status == VERIFIED"
          - "current_utc >= IdentityDocument.expires_at"
        side_effects:
          - "effective_status becomes INVALID"
          - "increments IdentityDocument.version by 1"

  - entity: BreachAlert
    axis: status
    initial_state: NEW
    terminal_states: [RESOLVED]
    transitions:
      - from: NEW
        to: ACKNOWLEDGED
        trigger: "POST /breach-alerts/{id}/acknowledge"
        actor: Member | AccountOwner | PrivacyAgent
        preconditions:
          - "BreachAlert.status == NEW"
        side_effects:
          - "sets acknowledged_at to current_utc"
          - "increments BreachAlert.version by 1"
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /breach-alerts/{id}/resolve"
        actor: Member | AccountOwner
        preconditions:
          - "BreachAlert.status == ACKNOWLEDGED"
        side_effects:
          - "sets resolved_at to current_utc"
          - "increments BreachAlert.version by 1"
        note: "Triage advances independently of the severity axis; a RESOLVED alert can still have its severity raised by a later re-ingest."

  - entity: BreachAlert
    axis: severity
    initial_state: LOW
    terminal_states: []
    transitions:
      - from: LOW
        to: MEDIUM
        trigger: "POST /breach-events/{id}/ingest whose recomputed severity band exceeds the stored band"
        actor: system
        preconditions:
          - "the recomputed severity ordinal is strictly greater than the stored severity ordinal"
        side_effects:
          - "raises severity and severity_points, increments escalation_count by 1"
          - "increments BreachAlert.version by 1"
      - from: MEDIUM
        to: HIGH
        trigger: "POST /breach-events/{id}/ingest whose recomputed severity band exceeds the stored band"
        actor: system
        preconditions:
          - "the recomputed severity ordinal is strictly greater than the stored severity ordinal"
        side_effects:
          - "raises severity and severity_points, increments escalation_count by 1"
          - "increments BreachAlert.version by 1"
      - from: HIGH
        to: CRITICAL
        trigger: "POST /breach-events/{id}/ingest whose recomputed severity band exceeds the stored band"
        actor: system
        preconditions:
          - "the recomputed severity ordinal is strictly greater than the stored severity ordinal"
        side_effects:
          - "raises severity and severity_points, increments escalation_count by 1"
          - "increments BreachAlert.version by 1"
      - from: LOW
        to: HIGH
        trigger: "POST /breach-events/{id}/ingest whose recomputed severity band exceeds the stored band by more than one rung"
        actor: system
        preconditions:
          - "the recomputed severity ordinal is strictly greater than the stored severity ordinal"
        side_effects:
          - "raises severity and severity_points, increments escalation_count by 1"
          - "increments BreachAlert.version by 1"
        note: "Monotonicity rule: no transition exists in the downward direction. A re-ingest whose recomputed ordinal is lower or equal leaves severity, severity_points and escalation_count untouched and does NOT bump version."

  - entity: AddOnSubscription
    axis: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /addons/{id}/suspend, or cascade branch of Account ACTIVE -> SUSPENDED"
        actor: AccountOwner | PlatformAdmin | system
        preconditions:
          - "AddOnSubscription.status == ACTIVE"
        side_effects:
          - "sets suspended_at to current_utc"
          - "caused by this transition: every DeviceSeat with this addon_id and status BOUND transitions BOUND -> VOIDED"
          - "caused by those seat transitions: seats_bound falls to 0 and seats_available rises to seats_total"
          - "increments AddOnSubscription.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /addons/{id}/resume, or cascade of Account SUSPENDED -> ACTIVE"
        actor: AccountOwner | PlatformAdmin | system
        preconditions:
          - "AddOnSubscription.status == SUSPENDED"
          - "Account.status == ACTIVE"
        side_effects:
          - "clears suspended_at to null"
          - "caused by this transition: every DeviceSeat with this addon_id, status VOIDED and a member whose Member.status is ACTIVE transitions VOIDED -> BOUND with bind_count incremented by 1"
          - "increments AddOnSubscription.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "cascade of Account ACTIVE|SUSPENDED -> CANCELLED"
        actor: system
        preconditions:
          - "AddOnSubscription.status == ACTIVE"
        side_effects:
          - "every DeviceSeat with this addon_id and status BOUND transitions BOUND -> VOIDED"
          - "increments AddOnSubscription.version by 1"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "cascade of Account ACTIVE|SUSPENDED -> CANCELLED"
        actor: system
        preconditions:
          - "AddOnSubscription.status == SUSPENDED"
        side_effects:
          - "increments AddOnSubscription.version by 1"

  - entity: DeviceSeat
    axis: status
    initial_state: BOUND
    terminal_states: []
    transitions:
      - from: BOUND
        to: RELEASED
        trigger: "POST /device-seats/{id}/release, or cascade of Member ACTIVE -> REMOVED"
        actor: Member | AccountOwner | system
        preconditions:
          - "DeviceSeat.status == BOUND"
        side_effects:
          - "sets released_at to current_utc; rebind_eligible_at becomes released_at + SEAT_REBIND_COOLOFF_HOURS (72)"
          - "caused by this transition: the add-on's seats_bound falls by 1 and seats_available rises by 1"
          - "increments DeviceSeat.version by 1"
      - from: RELEASED
        to: BOUND
        trigger: "POST /device-seats/{id}/rebind"
        actor: Member | AccountOwner
        preconditions:
          - "DeviceSeat.status == RELEASED"
          - "current_utc >= DeviceSeat.rebind_eligible_at (inclusive boundary)"
          - "AddOnSubscription.status == ACTIVE"
          - "AddOnSubscription.seats_available >= 1"
        side_effects:
          - "sets bound_at to current_utc, clears released_at to null, increments bind_count by 1"
          - "increments DeviceSeat.version by 1"
      - from: BOUND
        to: VOIDED
        trigger: "cascade of AddOnSubscription ACTIVE -> SUSPENDED or ACTIVE -> CANCELLED"
        actor: system
        preconditions:
          - "DeviceSeat.status == BOUND"
        side_effects:
          - "sets voided_at to current_utc; bind_count is preserved so binding history survives the suspension"
          - "increments DeviceSeat.version by 1"
      - from: VOIDED
        to: BOUND
        trigger: "cascade of AddOnSubscription SUSPENDED -> ACTIVE"
        actor: system
        preconditions:
          - "DeviceSeat.status == VOIDED"
          - "the seat's Member.status == ACTIVE"
          - "the add-on's owning Account.status == ACTIVE"
        side_effects:
          - "sets bound_at to current_utc, clears voided_at to null, increments bind_count by 1"
          - "the 72-hour rebind cool-off does NOT apply on this path — the seat was never voluntarily released"
          - "increments DeviceSeat.version by 1"

  - entity: BillingCycle
    axis: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /billing-cycles/{id}/close, or cascade of Account -> CANCELLED"
        actor: PlatformAdmin | system
        preconditions:
          - "BillingCycle.status == OPEN"
          - "Account.legal_hold is false"
        side_effects:
          - "sets closed_at to current_utc and freezes pre_discount_total_cents / loyalty_discount_cents / total_charged_cents"
          - "when the owning Account.status is ACTIVE: mints a successor BillingCycle with cycle_seq + 1, starts_at = current_utc, ends_at = current_utc + CYCLE_LENGTH_DAYS (30), status OPEN, base_charge_cents = the account's current Plan.monthly_fee_cents"
          - "caused by minting the successor: three EntitlementLedgerEntry GRANT rows (PROFILE, SCAN, REMOVAL) are appended against the new cycle with amounts taken from the account's current Plan quotas and reason_code CYCLE_GRANT"
          - "increments BillingCycle.version by 1"

  - entity: CredentialFinding
    axis: status
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: REMEDIATED
        trigger: "POST /credential-findings/{id}/remediate"
        actor: Member | AccountOwner
        preconditions:
          - "CredentialFinding.status == OPEN"
        side_effects:
          - "sets remediated_at to current_utc"
          - "caused by this transition: the profile's hygiene_score and hygiene_band are re-derived because the finding's weight leaves the OPEN input set"
          - "increments CredentialFinding.version by 1"
      - from: REMEDIATED
        to: OPEN
        trigger: "POST /credential-findings/{id}/reopen"
        actor: PrivacyAgent
        preconditions:
          - "CredentialFinding.status == REMEDIATED"
        side_effects:
          - "clears remediated_at to null"
          - "caused by this transition: the profile's hygiene_score and hygiene_band are re-derived because the finding's weight re-enters the OPEN input set"
          - "increments CredentialFinding.version by 1"
        note: "Regression loop: a remediated credential can be observed weak again on a later hygiene sweep."

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# ---------------------------------------------------------------------------

concurrency_rules:

  - rule_id: identifier-add-stale-profile
    parent_entity: MonitoredProfile
    write_endpoint: "POST /monitored-profiles/{id}/identifiers"
    occ_field: "expected_profile_version"
    description: |
      Adding an Identifier to a MonitoredProfile whose version has advanced since
      the client last read it is rejected. Identifier additions legitimately
      succeed one after another while the profile stays under
      MAX_IDENTIFIERS_PER_PROFILE, so no state precondition catches a writer whose
      view of the profile (and therefore of how many slots are left, and of which
      values are already monitored) is stale.
    error_id: ERR_STALE_PROFILE_VERSION
    http_status: 412

  - rule_id: device-seat-bind-stale-addon
    parent_entity: AddOnSubscription
    write_endpoint: "POST /device-seats"
    occ_field: "expected_addon_version"
    description: |
      Binding a DeviceSeat against an AddOnSubscription whose version has
      advanced since the client last read it is rejected. Seat binds legitimately
      succeed one after another while seats_available stays positive, so nothing
      in the state machine catches a writer whose view of the seat pool is stale.
    error_id: ERR_STALE_ADDON_VERSION
    http_status: 412

  - rule_id: plan-change-stale-account
    parent_entity: Account
    write_endpoint: "POST /accounts/{id}/plan-changes"
    occ_field: "expected_account_version"
    description: |
      Applying a plan change to an Account whose version has advanced since the
      client last read it is rejected. A later plan change legitimately supersedes
      an earlier one within the same cycle, and the proration arithmetic depends
      on which plan the account actually holds, so a stale view must not book a
      charge derived from a plan the account has already left.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

  - rule_id: member-invite-stale-account
    parent_entity: Account
    write_endpoint: "POST /accounts/{id}/members"
    occ_field: "expected_account_version"
    description: |
      Inviting a Member onto an Account whose version has advanced since the
      client last read it is rejected. Invitations legitimately succeed one after
      another while the seat count stays below Plan.max_members, so the member cap
      alone cannot protect a writer working from a stale roster.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# 22 rules; 6 carry `variants:` that produce different numbers from identical
# stored data. All monetary values are integer cents. All day arithmetic is on
# the logical clock, whose startup default is 2026-05-01T00:00:00Z.
# ---------------------------------------------------------------------------

calculations:

  - name: removal_sla_deadline
    trigger: "Every transition into RemovalRequest.SUBMITTED (from DRAFTED and from ESCALATED)"
    algorithm: threshold
    formula: |
      method_buffer_days      = METHOD_SLA_BUFFER_DAYS_<broker.opt_out_method>
      jurisdiction_floor_days = JURISDICTION_SLA_FLOOR_DAYS_<broker.jurisdiction>

      # BASE variant (DRAFTED -> SUBMITTED)
      effective_window_days = max(broker.response_window_days + method_buffer_days,
                                  jurisdiction_floor_days)

      # ESCALATED_RESUBMISSION variant (ESCALATED -> SUBMITTED)
      effective_window_days = ESCALATION_RESUBMIT_WINDOW_DAYS

      sla_deadline_at = submitted_at + effective_window_days * 86400 seconds
    input_set: "The Broker row referenced by RemovalRequest.broker_id, read at the instant of the SUBMITTED transition. Broker edits after submission do not restamp an existing sla_deadline_at."
    constants:
      METHOD_SLA_BUFFER_DAYS_WEB_FORM: 0
      METHOD_SLA_BUFFER_DAYS_EMAIL: 2
      METHOD_SLA_BUFFER_DAYS_POSTAL: 7
      METHOD_SLA_BUFFER_DAYS_PHONE: 3
      JURISDICTION_SLA_FLOOR_DAYS_US_CA: 45
      JURISDICTION_SLA_FLOOR_DAYS_US_VA: 45
      JURISDICTION_SLA_FLOOR_DAYS_EU: 30
      JURISDICTION_SLA_FLOOR_DAYS_OTHER: 21
      ESCALATION_RESUBMIT_WINDOW_DAYS: 15
      MAX_ESCALATIONS: 2
      BROKER_WINDOW_MIN_DAYS: 5
      BROKER_WINDOW_MAX_DAYS: 90
    precision: "Whole days; the resulting instant keeps the millisecond precision of submitted_at."
    variants:
      - name: BASE
        when: "The transition is DRAFTED -> SUBMITTED (deadline_variant BASE)."
        difference: "Applies the method buffer and then takes the maximum against the jurisdiction floor."
      - name: ESCALATED_RESUBMISSION
        when: "The transition is ESCALATED -> SUBMITTED (deadline_variant ESCALATED_RESUBMISSION)."
        difference: "Uses the flat 15-day escalation window; the method buffer and the jurisdiction floor are both ignored, so the same broker yields a shorter deadline on the second pass."

  - name: hygiene_score
    trigger: "Read of MonitoredProfile.hygiene_score / hygiene_band, GET /monitored-profiles/{id}/hygiene-score, and re-derivation after any CredentialFinding OPEN <-> REMEDIATED transition"
    algorithm: weighted_scoring
    formula: |
      # Evaluation order is pinned; cap BEFORE the multiplier, round AFTER it.
      step 1: raw_penalty     = sum of HYGIENE_WEIGHT_<finding.finding_type>
                                over CredentialFinding rows whose profile_id is
                                this profile and whose status is OPEN
      step 2: capped_penalty  = min(raw_penalty, HYGIENE_PENALTY_CAP)
      step 3: multiplier      = HYGIENE_TWO_FACTOR_MULTIPLIER    when profile.two_factor_attested is true
                                HYGIENE_NO_TWO_FACTOR_MULTIPLIER when it is false
      step 4: adjusted_penalty = round_half_up(capped_penalty * multiplier, 2)
      step 5: hygiene_score    = round_half_up(HYGIENE_BASE_SCORE - adjusted_penalty, 2)
      step 6: hygiene_band     = STRONG   when hygiene_score >= HYGIENE_BAND_STRONG_MIN
                                 MODERATE when hygiene_score >= HYGIENE_BAND_MODERATE_MIN
                                 WEAK     when hygiene_score >= HYGIENE_BAND_WEAK_MIN
                                 CRITICAL otherwise
    input_set: "CredentialFinding rows with status OPEN only. REMEDIATED findings leave the input set entirely and are not partially credited."
    constants:
      HYGIENE_BASE_SCORE: 100
      HYGIENE_WEIGHT_BREACHED_PASSWORD: 25
      HYGIENE_WEIGHT_WEAK_PASSWORD: 18
      HYGIENE_WEIGHT_REUSED_PASSWORD: 12
      HYGIENE_WEIGHT_STALE_PASSWORD: 7
      HYGIENE_PENALTY_CAP: 70
      HYGIENE_TWO_FACTOR_MULTIPLIER: 0.60
      HYGIENE_NO_TWO_FACTOR_MULTIPLIER: 1.00
      HYGIENE_BAND_STRONG_MIN: 80
      HYGIENE_BAND_MODERATE_MIN: 60
      HYGIENE_BAND_WEAK_MIN: 40
    precision: "2 decimal places, round_half_up, applied at steps 4 and 5 only."
    variants:
      - name: TWO_FACTOR_ATTESTED
        when: "MonitoredProfile.two_factor_attested is true."
        difference: "The capped penalty is multiplied by 0.60 before subtraction, which can move an identical finding set across two band boundaries at once."
      - name: NO_TWO_FACTOR
        when: "MonitoredProfile.two_factor_attested is false."
        difference: "The capped penalty is subtracted at full weight."

  - name: breach_alert_severity
    trigger: "POST /breach-events/{id}/ingest, once per matched Identifier"
    algorithm: weighted_scoring
    formula: |
      record_points    = max over breach_event.record_types of BREACH_POINTS_<record_type>
      identifier_bonus = SENSITIVE_IDENTIFIER_BONUS_POINTS when identifier.identifier_type == SSN_LAST4
                         IDENTIFIER_MATCH_BONUS_POINTS     otherwise
      hygiene_escalation = OPEN_BREACHED_PASSWORD_ESCALATION_POINTS
                             when at least one CredentialFinding exists whose profile_id equals
                             identifier.profile_id, whose finding_type is BREACHED_PASSWORD and
                             whose status is OPEN at the instant of this ingest
                           0 otherwise
      recomputed_points = breach_event.base_severity_points + record_points
                          + identifier_bonus + hygiene_escalation
      band(points) = CRITICAL when points >= SEVERITY_BAND_CRITICAL_MIN
                     HIGH     when points >= SEVERITY_BAND_HIGH_MIN
                     MEDIUM   when points >= SEVERITY_BAND_MEDIUM_MIN
                     LOW      otherwise
      ordinal(LOW)=1, ordinal(MEDIUM)=2, ordinal(HIGH)=3, ordinal(CRITICAL)=4
    input_set: "The BreachEvent row, the matched Identifier row, and the OPEN CredentialFinding rows of the identifier's MonitoredProfile at the instant of the ingest."
    constants:
      BREACH_POINTS_EMAIL_ADDRESS: 10
      BREACH_POINTS_PHONE_NUMBER: 15
      BREACH_POINTS_PHYSICAL_ADDRESS: 8
      BREACH_POINTS_PASSWORD_HASH: 30
      BREACH_POINTS_FINANCIAL_ACCOUNT: 40
      BREACH_POINTS_SSN: 45
      IDENTIFIER_MATCH_BONUS_POINTS: 5
      SENSITIVE_IDENTIFIER_BONUS_POINTS: 15
      OPEN_BREACHED_PASSWORD_ESCALATION_POINTS: 10
      SEVERITY_BAND_CRITICAL_MIN: 60
      SEVERITY_BAND_HIGH_MIN: 45
      SEVERITY_BAND_MEDIUM_MIN: 25
      SEVERITY_ORDINAL_LOW: 1
      SEVERITY_ORDINAL_MEDIUM: 2
      SEVERITY_ORDINAL_HIGH: 3
      SEVERITY_ORDINAL_CRITICAL: 4
    precision: "Integer points; no rounding."
    variants:
      - name: INITIAL_INGEST
        when: "No BreachAlert row exists yet for the pair (breach_event_id, identifier_id)."
        difference: "A row is created with severity = band(recomputed_points), severity_points = recomputed_points and escalation_count 0."
      - name: RE_INGEST_MONOTONE
        when: "A BreachAlert row already exists for the pair (breach_event_id, identifier_id)."
        difference: "No row is created. The stored severity is replaced only when ordinal(band(recomputed_points)) is strictly greater than ordinal(stored severity); in that case severity_points is also replaced and escalation_count increments by 1. When the recomputed ordinal is lower or equal, severity, severity_points, escalation_count, updated_at and version are all left untouched — an alert can escalate but never de-escalate."

  - name: broker_compliance_score
    trigger: "Read of Broker.compliance_score and GET /brokers/{id}/compliance-report"
    algorithm: weighted_scoring
    formula: |
      score = clamp(BROKER_COMPLIANCE_BASE_SCORE
                    - COMPLIANCE_PENALTY_PER_REAPPEARANCE      * reappearance_count
                    - COMPLIANCE_PENALTY_PER_EXPIRED_REQUEST   * expired_request_count
                    - COMPLIANCE_PENALTY_PER_REJECTED_REQUEST  * rejected_request_count
                    + COMPLIANCE_BONUS_PER_ONTIME_COMPLETION   * on_time_completion_count,
                    COMPLIANCE_SCORE_FLOOR, COMPLIANCE_SCORE_CEILING)
    input_set: |
      LIFETIME variant:
        reappearance_count     = sum of ExposureRecord.reappearance_count over rows with this broker_id
        expired_request_count  = count of RemovalRequest rows with this broker_id whose CURRENT status is EXPIRED
        rejected_request_count = count of RemovalRequest rows with this broker_id whose CURRENT status is REJECTED
        on_time_completion_count = count of RemovalRequest rows with this broker_id whose status is COMPLETED and whose on_time is true
      CURRENT_WINDOW variant (cutoff = current_utc - COMPLIANCE_WINDOW_DAYS * 86400 seconds, inclusive):
        reappearance_count     = count of ExposureRecord rows with this broker_id whose status is REAPPEARED and whose last_seen_at >= cutoff
        expired_request_count  = count of RemovalRequest rows with this broker_id whose status is EXPIRED and whose closed_at >= cutoff
        rejected_request_count = count of RemovalRequest rows with this broker_id whose status is REJECTED and whose closed_at >= cutoff
        on_time_completion_count = count of RemovalRequest rows with this broker_id whose status is COMPLETED, on_time is true and closed_at >= cutoff
    constants:
      BROKER_COMPLIANCE_BASE_SCORE: 100
      COMPLIANCE_PENALTY_PER_REAPPEARANCE: 8
      COMPLIANCE_PENALTY_PER_EXPIRED_REQUEST: 12
      COMPLIANCE_PENALTY_PER_REJECTED_REQUEST: 5
      COMPLIANCE_BONUS_PER_ONTIME_COMPLETION: 3
      COMPLIANCE_SCORE_FLOOR: 0
      COMPLIANCE_SCORE_CEILING: 100
      COMPLIANCE_WINDOW_DAYS: 30
    precision: "Integer score, clamped to the inclusive range 0..100."
    variants:
      - name: LIFETIME
        when: "GET /brokers/{id}/compliance-report is called with scope omitted or scope LIFETIME; also the value exposed as Broker.compliance_score."
        difference: "Reappearances are counted as the SUM of ExposureRecord.reappearance_count, so a single exposure that has reappeared three times contributes three penalties."
      - name: CURRENT_WINDOW
        when: "GET /brokers/{id}/compliance-report is called with scope CURRENT_WINDOW."
        difference: "Reappearances are counted as the NUMBER OF EXPOSURE ROWS currently sitting in REAPPEARED whose last_seen_at is inside the 30-day window, so the same exposure contributes at most one penalty regardless of how many times it has looped."

  - name: plan_proration_amount
    trigger: "POST /accounts/{id}/plan-changes"
    algorithm: tiered_pricing
    formula: |
      remaining_days    = max(0, floor((open_cycle.ends_at - current_utc) / 86400 seconds))
      fee_delta_cents   = abs(new_plan.monthly_fee_cents - old_plan.monthly_fee_cents)

      # UPGRADE variant — round the daily rate FIRST, then multiply
      daily_rate_cents        = round_half_up(fee_delta_cents / PRORATION_DAY_BASIS, 0)
      proration_charge_cents  = daily_rate_cents * remaining_days

      # DOWNGRADE variant — multiply FIRST, round LAST
      proration_credit_cents  = round_half_up(fee_delta_cents * remaining_days / PRORATION_DAY_BASIS, 0)

      # When new_plan.monthly_fee_cents == old_plan.monthly_fee_cents both are 0.
    input_set: "The account's single BillingCycle whose status is OPEN. A closed cycle is never re-prorated."
    constants:
      CYCLE_LENGTH_DAYS: 30
      PRORATION_DAY_BASIS: 30
    precision: "Integer cents, round_half_up. The rounding ORDER is the whole point: UPGRADE rounds per-day then multiplies, DOWNGRADE multiplies then rounds once."
    variants:
      - name: UPGRADE
        when: "change_kind is UPGRADE and new_plan.monthly_fee_cents > old_plan.monthly_fee_cents."
        difference: "Books proration_charge_cents on the open cycle. Round-then-multiply loses the sub-cent remainder on every one of the remaining days."
      - name: DOWNGRADE
        when: "change_kind is DOWNGRADE and new_plan.monthly_fee_cents < old_plan.monthly_fee_cents."
        difference: "Books proration_credit_cents on the open cycle. Multiply-then-round keeps the remainder until the single final rounding, so an identical fee_delta over identical remaining_days yields a strictly larger magnitude than the UPGRADE path whenever fee_delta is not a multiple of 30."

  - name: addon_proration_amount
    trigger: "POST /accounts/{id}/addons (SEAT_ADDED) and AddOnSubscription ACTIVE -> SUSPENDED (SEAT_RELEASED)"
    algorithm: tiered_pricing
    formula: |
      remaining_days_inclusive = max(0, floor((open_cycle.ends_at - current_utc) / 86400 seconds)) + 1

      # SEAT_ADDED variant
      addon_charge_cents = ceil((per_seat_fee_cents * seats_total * remaining_days_inclusive)
                                / ADDON_PRORATION_DAY_BASIS)

      # SEAT_RELEASED variant
      addon_credit_cents = floor((per_seat_fee_cents * seats_total * remaining_days_inclusive)
                                 / ADDON_PRORATION_DAY_BASIS)
    input_set: "The account's OPEN BillingCycle and the add-on's own seats_total and per_seat_fee_cents. Add-ons prorate on the INCLUSIVE remaining-day count (the current partial day is billed), unlike the base plan which prorates on the EXCLUSIVE count."
    constants:
      ADDON_PRORATION_DAY_BASIS: 30
    precision: "Integer cents. Charges round UP (ceil), credits round DOWN (floor) — the house keeps the fraction in both directions."
    variants:
      - name: SEAT_ADDED
        when: "The add-on is created."
        difference: "Uses ceil and books to BillingCycle.addon_charge_cents; also stamped on AddOnSubscription.prorated_charge_cents."
      - name: SEAT_RELEASED
        when: "The add-on transitions ACTIVE -> SUSPENDED."
        difference: "Uses floor and books to BillingCycle.addon_credit_cents, so a suspend-then-resume round trip inside one cycle is NOT value-neutral when the product is not a multiple of 30."

  - name: cycle_total_charge
    trigger: "Read of BillingCycle.pre_discount_total_cents / loyalty_discount_cents / total_charged_cents, and freeze at OPEN -> CLOSED"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is pinned. The discount tier is selected from the
      # PRE-discount total and is never re-selected from the post-discount total,
      # even when the discount pushes the total back below the tier threshold.
      step 1: pre_discount_total_cents = max(0,
                  base_charge_cents
                + proration_charge_cents
                + addon_charge_cents
                - proration_credit_cents
                - addon_credit_cents)
      step 2: rate = LOYALTY_TIER_3_RATE when pre_discount_total_cents >= LOYALTY_TIER_3_THRESHOLD_CENTS
                     LOYALTY_TIER_2_RATE when pre_discount_total_cents >= LOYALTY_TIER_2_THRESHOLD_CENTS
                     LOYALTY_TIER_1_RATE when pre_discount_total_cents >= LOYALTY_TIER_1_THRESHOLD_CENTS
                     0.00 otherwise
      step 3: loyalty_discount_cents = round_half_up(pre_discount_total_cents * rate, 0)
      step 4: total_charged_cents    = pre_discount_total_cents - loyalty_discount_cents
    input_set: "The BillingCycle row's own five stored money fields. No other cycle contributes."
    constants:
      LOYALTY_TIER_1_THRESHOLD_CENTS: 1500
      LOYALTY_TIER_1_RATE: 0.02
      LOYALTY_TIER_2_THRESHOLD_CENTS: 3000
      LOYALTY_TIER_2_RATE: 0.05
      LOYALTY_TIER_3_THRESHOLD_CENTS: 5000
      LOYALTY_TIER_3_RATE: 0.08
    precision: "Integer cents, round_half_up at step 3 only."

  - name: entitlement_remaining
    trigger: "Read of Account.<resource>_units_* fields and GET /accounts/{id}/entitlement-statement"
    algorithm: aggregation
    formula: |
      for each resource_type in {PROFILE, SCAN, REMOVAL}:
        granted   = sum of EntitlementLedgerEntry.amount where account_id matches,
                    cycle_id == the account's OPEN BillingCycle.id, resource_type matches
                    and entry_type == GRANT
        consumed  = same filter with entry_type == CONSUME
        released  = same filter with entry_type == RELEASE
        remaining = granted - consumed + released
    input_set: "Only EntitlementLedgerEntry rows booked against the account's single OPEN BillingCycle. Entries booked to CLOSED cycles never contribute; there is no carry-over."
    constants: {}
    precision: "Integer units."

  - name: member_subcap_remaining
    trigger: "POST /removal-requests, step 3 of removal_entitlement_draw; also the member_breakdown block of the entitlement statement"
    algorithm: aggregation
    formula: |
      member_consumed = sum of amount over REMOVAL CONSUME entries with this member_id
                        booked to the account's OPEN BillingCycle
      member_released = sum of amount over REMOVAL RELEASE entries with this member_id
                        booked to the account's OPEN BillingCycle
      member_net      = member_consumed - member_released
      subcap_remaining = plan.per_member_removal_subcap - member_net
    input_set: "REMOVAL-typed ledger entries of the OPEN cycle carrying a non-null member_id equal to this member."
    constants: {}
    precision: "Integer units."

  - name: exposure_candidate_selection
    trigger: "POST /scan-runs/{id}/findings, before classification"
    algorithm: projection
    formula: |
      eligibility: ExposureRecord rows whose profile_id == the scan's profile_id
                   AND broker_id == the reported broker_id
                   AND status IN {FOUND, SUPPRESSED, REAPPEARED, RE_SUPPRESSED}
      ranking:     last_seen_at DESC
      tie_break:   created_at DESC
      fallback:    when the candidate set is empty the classification is FRESH and a new
                   ExposureRecord row is created; this is never an error
    input_set: "All ExposureRecord rows for the (profile_id, broker_id) pair, including rows discovered by earlier scans."
    constants: {}
    precision: "Exactly one candidate row or none."

  - name: reappearance_classification
    trigger: "POST /scan-runs/{id}/findings"
    algorithm: threshold
    formula: |
      candidate = exposure_candidate_selection(scan.profile_id, reported broker_id)
      if candidate is null:
          classification = FRESH
      elif candidate.status IN {FOUND, REAPPEARED}:
          classification = RESIGHTING
      else:   # candidate.status IN {SUPPRESSED, RE_SUPPRESSED}
          elapsed_days = floor((current_utc - candidate.last_suppressed_at) / 86400 seconds)
          classification = REAPPEARANCE if elapsed_days <  REAPPEARANCE_COOLOFF_DAYS
                           else FRESH
    input_set: "The single candidate row selected by exposure_candidate_selection."
    constants:
      REAPPEARANCE_COOLOFF_DAYS: 45
    precision: |
      STRICT boundary. elapsed_days is a whole number obtained by integer floor
      division of elapsed seconds by 86400. At exactly 45 whole elapsed days the
      classification is FRESH, not REAPPEARANCE: 44 -> REAPPEARANCE, 45 -> FRESH.
      FRESH creates a brand-new ExposureRecord in FOUND (and the RemovalRequest
      drafted against it consumes a REMOVAL unit); REAPPEARANCE mutates the
      existing row to REAPPEARED (and the RemovalRequest drafted against it is
      fee_exempt and consumes nothing). RESIGHTING only refreshes last_seen_at.

  - name: removal_entitlement_draw
    trigger: "POST /removal-requests"
    algorithm: waterfall_allocation
    formula: |
      # Ordering is pinned: fee exemption first, then the SHARED POOL, then the
      # PER-MEMBER SUB-CAP. A request that would breach both reports the pool error.
      step 1: if exposure.fee_exempt is true (exposure.status == REAPPEARED):
                  units = 0; no ledger entry is written;
                  RemovalRequest.entitlement_units_consumed = 0; stop.
      step 2: if account.removal_units_remaining < 1 -> ERR_REMOVAL_QUOTA_EXCEEDED
      step 3: if member_subcap_remaining < 1        -> ERR_MEMBER_SUBCAP_EXCEEDED
      step 4: units = 1; append EntitlementLedgerEntry(resource_type REMOVAL,
                  entry_type CONSUME, amount 1, reason_code REMOVAL_DRAFTED,
                  member_id = the exposure's profile's member);
                  RemovalRequest.entitlement_units_consumed = 1
    input_set: "The OPEN BillingCycle's REMOVAL ledger entries for the account, and the subset of them carrying this member_id."
    constants: {}
    precision: "Integer units; a request draws either 0 or 1."

  - name: sla_expiry_eligibility
    trigger: "POST /removal-requests/{id}/expire"
    algorithm: threshold
    formula: |
      eligible = (current_utc >= request.sla_deadline_at)
      not eligible -> ERR_SLA_NOT_ELAPSED
    input_set: "The request's own stamped sla_deadline_at and the logical clock."
    constants: {}
    precision: "INCLUSIVE boundary. At the exact deadline instant expiry is permitted; one millisecond earlier it is rejected."

  - name: removal_on_time
    trigger: "Read of RemovalRequest.on_time; consumed by broker_compliance_score"
    algorithm: threshold
    formula: |
      on_time = null                             when status != COMPLETED
      on_time = (closed_at <= sla_deadline_at)   when status == COMPLETED
    input_set: "The request's own closed_at and sla_deadline_at."
    constants: {}
    precision: "INCLUSIVE boundary — completing at exactly the deadline instant is on time."

  - name: rescan_interval_eligibility
    trigger: "POST /scan-runs"
    algorithm: threshold
    formula: |
      if kind == INITIAL:
          eligible = (profile.last_completed_scan_at is null)
          not eligible -> ERR_INITIAL_SCAN_ALREADY_DONE
      if kind == RECURRING:
          eligible = (profile.last_completed_scan_at is null)
                     or floor((current_utc - profile.last_completed_scan_at) / 86400 seconds)
                        >= RESCAN_MIN_INTERVAL_DAYS
          not eligible -> ERR_RESCAN_TOO_SOON
    input_set: "MonitoredProfile.last_completed_scan_at, which is stamped only by RUNNING -> COMPLETED."
    constants:
      RESCAN_MIN_INTERVAL_DAYS: 7
      MAX_SCAN_RETRIES: 2
    precision: "INCLUSIVE boundary — a recurring scan is allowed at exactly 7 whole elapsed days and rejected at 6. MAX_SCAN_RETRIES is the cap enforced by validation rung 34 on POST /scan-runs/{id}/retry: retry_count may reach 2, so at most three RUNNING attempts exist per ScanRun."

  - name: seat_rebind_eligibility
    trigger: "POST /device-seats/{id}/rebind"
    algorithm: threshold
    formula: |
      rebind_eligible_at = seat.released_at + SEAT_REBIND_COOLOFF_HOURS * 3600 seconds
      eligible = (current_utc >= rebind_eligible_at)
      not eligible -> ERR_SEAT_REBIND_COOLOFF
    input_set: "The seat's own released_at. Seats that reached VOIDED through an add-on suspension have released_at null and are restored by the add-on resume cascade without any cool-off."
    constants:
      SEAT_REBIND_COOLOFF_HOURS: 72
    precision: "INCLUSIVE boundary — rebinding is allowed at exactly released_at + 72h."

  - name: identity_document_effective_status
    trigger: "Read of IdentityDocument.effective_status and the identity gate on POST /removal-requests/{id}/submit"
    algorithm: threshold
    formula: |
      effective_status = VALID   when status == VERIFIED and current_utc <  expires_at
                         INVALID in every other case
    input_set: "The document's own status and expires_at against the logical clock."
    constants:
      IDENTITY_DOC_MIN_LEAD_SECONDS: 1
    precision: "STRICT boundary — at exactly expires_at the document is already INVALID. IDENTITY_DOC_MIN_LEAD_SECONDS is the minimum gap POST /members/{id}/identity-documents requires between current_utc and expires_at at creation time."

  - name: breach_alert_dedup
    trigger: "POST /breach-events/{id}/ingest"
    algorithm: aggregation
    formula: |
      matched_identifiers = Identifier rows whose identifier_value is byte-for-byte equal to
                            one of the payload's matched_identifier_values AND whose
                            MonitoredProfile.status IN {ACTIVE, PAUSED}
      for each matched identifier, keyed on the pair (breach_event_id, identifier_id):
          if no BreachAlert row carries that pair -> create one (INITIAL_INGEST variant)
          else                                    -> do not create; apply RE_INGEST_MONOTONE
      created_alert_count   = number of rows created by this call
      escalated_alert_count = number of existing rows whose severity ordinal rose
      unchanged_alert_count = number of existing rows left untouched
    input_set: "Identifier rows whose owning MonitoredProfile is ACTIVE or PAUSED. Identifiers on DRAFT or RETIRED profiles never match and never produce alerts."
    constants: {}
    precision: |
      CONSERVED QUANTITY: for a given breach_event_id, the number of BreachAlert
      rows equals the number of DISTINCT Identifier rows ever matched by any
      ingest of that event, no matter how many times the same payload is
      re-ingested. Duplicate values inside one matched_identifier_values array
      collapse to a single match per Identifier row.

  - name: scan_coverage_ratio
    trigger: "GET /members/{id}/exposure-summary"
    algorithm: aggregation
    formula: |
      total_exposures      = count of ExposureRecord rows across all of the member's MonitoredProfile rows
      suppressed_exposures = count of those rows whose status IN {SUPPRESSED, RE_SUPPRESSED}
      coverage_ratio = 0.0000 when total_exposures == 0
                       round_half_up(suppressed_exposures / total_exposures, 4) otherwise
    input_set: "All ExposureRecord rows of every MonitoredProfile of the member, including profiles in RETIRED."
    constants: {}
    precision: "4 decimal places, round_half_up. The empty-set case is pinned to 0.0000 — never null, never an error, never 1.0000."

  - name: cycle_entitlement_statement
    trigger: "GET /accounts/{id}/entitlement-statement"
    algorithm: aggregation
    formula: |
      For each resource_type in {PROFILE, SCAN, REMOVAL} emit granted / consumed /
      released / remaining from entitlement_remaining against the OPEN cycle.
      member_breakdown:
        eligibility: Member rows of this account whose status IN {INVITED, ACTIVE}
        ranking:     removal_units_consumed_this_cycle DESC
        tie_break:   Member.created_at ASC
        fallback:    an empty array when no member qualifies (never an error)
      Every figure is derived at read time; none of them is stored on the cycle.
    input_set: "The account's single OPEN BillingCycle and its ledger entries."
    constants: {}
    precision: "Integer units."

  - name: member_exposure_summary
    trigger: "GET /members/{id}/exposure-summary"
    algorithm: aggregation
    formula: |
      profiles = MonitoredProfile rows with this member_id, any status including RETIRED
      exposures = ExposureRecord rows whose profile_id is one of those profiles
      found_count         = count of exposures with status FOUND
      reappeared_count    = count of exposures with status REAPPEARED
      suppressed_count    = count of exposures with status SUPPRESSED
      re_suppressed_count = count of exposures with status RE_SUPPRESSED
      open_removal_count  = count of RemovalRequest rows with this member_id whose status
                            IN {DRAFTED, SUBMITTED, ACKNOWLEDGED, ESCALATED}
      completed_removal_count = count of RemovalRequest rows with this member_id whose status is COMPLETED
      brokers:
        eligibility: Broker rows referenced by at least one of those exposures
        ranking:     number of those exposures at the broker DESC
        tie_break:   Broker.name ASC
        fallback:    an empty array
      coverage_ratio = scan_coverage_ratio(member)
    input_set: "Every MonitoredProfile of the member regardless of status, and every ExposureRecord under them."
    constants: {}
    precision: "Integer counts plus one 4-decimal ratio."

  - name: broker_compliance_report_ranking
    trigger: "GET /brokers/{id}/compliance-report"
    algorithm: aggregation
    formula: |
      top_offending_profiles:
        eligibility: MonitoredProfile rows having at least one ExposureRecord at this broker
                     whose reappearance_count >= 1
        ranking:     that exposure's reappearance_count DESC
        tie_break:   MonitoredProfile.created_at ASC
        limit:       COMPLIANCE_REPORT_TOP_N
        fallback:    an empty array when no profile qualifies (never an error)
    input_set: "ExposureRecord rows with this broker_id whose reappearance_count is at least 1."
    constants:
      COMPLIANCE_REPORT_TOP_N: 5
    precision: "Integer counts; at most 5 entries."

  - name: account_member_capacity
    trigger: "POST /accounts/{id}/members and POST /accounts/{id}/plan-changes"
    algorithm: aggregation
    formula: |
      occupied_seats = count of Member rows with this account_id whose status IN {INVITED, ACTIVE}
      invite allowed        when occupied_seats <  plan.max_members       else ERR_MEMBER_CAP_EXCEEDED
      plan change allowed   when occupied_seats <= new_plan.max_members   else ERR_PLAN_DOWNGRADE_BELOW_USAGE
      plan change also requires new_plan.profile_quota_per_cycle >= account.profile_units_consumed
                               else ERR_PLAN_DOWNGRADE_BELOW_USAGE
    input_set: "Member rows in {INVITED, ACTIVE}; REMOVED members free their seat."
    constants: {}
    precision: "The invite boundary is STRICT (< max_members) while the downgrade boundary is INCLUSIVE (<= new max_members) — the two comparisons deliberately differ."

  - name: profile_identifier_capacity
    trigger: "POST /monitored-profiles/{id}/identifiers"
    algorithm: aggregation
    formula: |
      held = count of Identifier rows with this profile_id
      admitted = (held < MAX_IDENTIFIERS_PER_PROFILE)
      not admitted -> ERR_IDENTIFIER_CAP_EXCEEDED
    input_set: "Every Identifier row of the profile. Identifier rows are immutable and are never deleted, so the count only ever rises."
    constants:
      MAX_IDENTIFIERS_PER_PROFILE: 8
    precision: "STRICT boundary — the 8th identifier is admitted (held goes 7 -> 8) and the 9th is rejected."

  - name: seat_pool_occupancy
    trigger: "POST /device-seats and POST /device-seats/{id}/rebind"
    algorithm: interval_merge
    formula: |
      # Aggregate-capacity occupancy on a HALF-OPEN interval.
      # A seat occupies the pool over [bound_at, released_at) — the instant of
      # release frees the unit, so a bind at exactly that instant is admitted.
      occupancy = count of DeviceSeat rows with this addon_id whose status is BOUND
      admitted  = (occupancy < addon.seats_total)
      not admitted -> ERR_SEAT_CAPACITY_EXCEEDED
    input_set: "DeviceSeat rows with status BOUND only. RELEASED and VOIDED seats hold no capacity."
    constants:
      SEAT_ADJACENCY_BUFFER_SECONDS: 0
    precision: |
      Capacity is N (= seats_total) and the interval is HALF-OPEN with a zero
      adjacency buffer: releasing seat A and binding seat B at the very same
      logical instant is legal. Contrast exposure_channel_occupancy, which is a
      capacity-1 CLOSED interval with a non-zero buffer.

  - name: exposure_channel_occupancy
    trigger: "POST /removal-requests"
    algorithm: interval_merge
    formula: |
      # Single-occupancy on a CLOSED interval, followed by a mandatory buffer.
      open_request = the RemovalRequest with this exposure_id whose status
                     IN {DRAFTED, SUBMITTED, ACKNOWLEDGED, ESCALATED}
                     (at most one may exist)
      if open_request exists -> ERR_DUPLICATE_REMOVAL_REQUEST

      last_closed = the RemovalRequest with this exposure_id whose status
                    IN {COMPLETED, REJECTED, EXPIRED, VOIDED}, ranked by closed_at DESC,
                    tie-broken by created_at DESC; null when none exists
      if last_closed is not null and
         current_utc < last_closed.closed_at + REQUEST_REOPEN_BUFFER_HOURS * 3600 seconds
         -> ERR_EXPOSURE_CHANNEL_BUFFER
    input_set: "All RemovalRequest rows carrying this exposure_id, partitioned by status into the open set and the closed set."
    constants:
      REQUEST_REOPEN_BUFFER_HOURS: 24
    precision: |
      Capacity is 1 and the occupied interval is CLOSED — it ends at closed_at
      INCLUSIVE and is then extended by a 24-hour buffer during which no successor
      may be drafted. The buffer boundary is INCLUSIVE on the allow side: a new
      request at exactly closed_at + 24h is admitted, one millisecond earlier is
      rejected. This is a different interval geometry from seat_pool_occupancy in
      every respect: capacity, closedness, and buffer length.

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# 46 rungs. Rungs 13-15 are the GLOBAL WRITE GATES: they sit above every
# per-endpoint state gate, so an account under legal hold or a cancelled /
# suspended subscription pre-empts the whole family of transitions below.
# ---------------------------------------------------------------------------

validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID request headers are both present and non-empty."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of PlatformAdmin, PrivacyAgent, AccountOwner, Member, Auditor."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "The endpoint's §1.5 roles list contains the supplied X-User-Role."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: "When X-User-Role is Member or AccountOwner, X-User-ID equals the id of an existing Member row; when it is AccountOwner that Member additionally has is_primary true."
    error_id: ERR_IDENTITY_UNRESOLVED
    http_status: 403
    applies_to: "all endpoints whose roles list includes Member or AccountOwner"

  - priority: 5
    category: existence
    check: "Every {id} path segment resolves to an existing row, validated left to right."
    error_id: "ERR_ACCOUNT_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_PROFILE_NOT_FOUND | ERR_BROKER_NOT_FOUND | ERR_SCAN_NOT_FOUND | ERR_EXPOSURE_NOT_FOUND | ERR_REMOVAL_REQUEST_NOT_FOUND | ERR_DOCUMENT_NOT_FOUND | ERR_BREACH_EVENT_NOT_FOUND | ERR_ALERT_NOT_FOUND | ERR_FINDING_NOT_FOUND | ERR_ADDON_NOT_FOUND | ERR_SEAT_NOT_FOUND | ERR_CYCLE_NOT_FOUND | ERR_LEDGER_ENTRY_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 6
    category: business_constraint
    check: "Every field the endpoint declares as required in its §1.5 input list is present in the request body."
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST, PUT and PATCH endpoints"

  - priority: 7
    category: business_constraint
    check: "Every supplied field has the declared JSON type (integer, number, string, boolean, array)."
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST, PUT and PATCH endpoints"

  - priority: 8
    category: business_constraint
    check: "Every supplied enum-typed field carries a declared member of that enum."
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: |
      Every request field whose §1.1 constraints declare a closed member list, exhaustively:
      Plan.tier; Member.role_in_family; Broker.opt_out_method; Broker.jurisdiction;
      IdentityDocument.document_type; ScanRun.kind; ExposureRecord.exposure_kind;
      CredentialFinding.finding_type; Identifier.identifier_type;
      AddOnSubscription.addon_type; BreachEvent.record_types elements;
      the plan-change change_kind field; the legal-hold hold_state field;
      the member-authorization action field; the compliance-report scope field;
      and every status/severity/resource_type/entry_type value supplied as a list filter.
      No other field routes to ERR_INVALID_ENUM — a malformed value on any other
      field is ERR_VALIDATION (priority 7) or ERR_VALUE_OUT_OF_RANGE (priority 9).

  - priority: 9
    category: business_constraint
    check: "Numeric fields satisfy their §1.1 range constraints: Plan.monthly_fee_cents >= 0; Plan.max_members in 1..12; Plan quotas >= 1; Plan.per_member_removal_subcap in 1..removal_quota_per_cycle; Broker.response_window_days in 5..90; MonitoredProfile.rescan_cadence_days in 7..180; BreachEvent.base_severity_points in 0..40; AddOnSubscription.seats_total in 1..20; AddOnSubscription.per_seat_fee_cents >= 0; pagination limit in 1..100 and offset >= 0."
    error_id: ERR_VALUE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /plans, POST /brokers, POST /monitored-profiles, PATCH /monitored-profiles/{id}, POST /breach-events, POST /accounts/{id}/addons, all list endpoints"

  - priority: 10
    category: business_temporal
    check: "Date-range coherence: BreachEvent.disclosed_at >= BreachEvent.breach_date; IdentityDocument.expires_at >= current_utc + IDENTITY_DOC_MIN_LEAD_SECONDS (1)."
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /breach-events, POST /members/{id}/identity-documents"

  - priority: 11
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row: plan_id, new_plan_id, member_id, profile_id, broker_id, exposure_id, addon_id."
    error_id: "ERR_PLAN_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_PROFILE_NOT_FOUND | ERR_BROKER_NOT_FOUND | ERR_EXPOSURE_NOT_FOUND | ERR_ADDON_NOT_FOUND"
    http_status: 404
    applies_to: "POST /accounts, POST /accounts/{id}/plan-changes, POST /monitored-profiles, POST /scan-runs, POST /scan-runs/{id}/findings, POST /removal-requests, POST /credential-findings, POST /device-seats"

  - priority: 12
    category: auth
    check: "A caller acting as Member or AccountOwner may only touch rows belonging to their own Account; a Member (non-primary) may additionally only touch rows whose member_id equals their own X-User-ID, except for account-level reads."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all endpoints whose roles list includes Member or AccountOwner"

  - priority: 13
    category: state
    check: "GLOBAL WRITE GATE 1 — the Account in scope has legal_hold false."
    error_id: ERR_ACCOUNT_LEGAL_HOLD
    http_status: 409
    applies_to: "every account-scoped mutating endpoint (POST/PATCH/PUT/DELETE) EXCEPT POST /accounts/{id}/legal-hold"

  - priority: 14
    category: state
    check: "GLOBAL WRITE GATE 2 — the Account in scope has status other than CANCELLED."
    error_id: ERR_ACCOUNT_CANCELLED
    http_status: 409
    applies_to: "every account-scoped mutating endpoint EXCEPT POST /accounts/{id}/legal-hold"

  - priority: 15
    category: state
    check: "GLOBAL WRITE GATE 3 — the Account in scope has status other than SUSPENDED."
    error_id: ERR_ACCOUNT_SUSPENDED
    http_status: 409
    applies_to: "every account-scoped mutating endpoint EXCEPT POST /accounts/{id}/resume, POST /accounts/{id}/cancel, POST /accounts/{id}/legal-hold and POST /billing-cycles/{id}/close"

  - priority: 16
    category: state
    check: "The Member whose behalf the operation is performed on has authorization_status GRANTED."
    error_id: ERR_AUTHORIZATION_REVOKED
    http_status: 409
    applies_to: "POST /monitored-profiles, POST /scan-runs, POST /removal-requests, POST /removal-requests/{id}/submit"

  - priority: 17
    category: state
    check: "The supplied expected_<parent>_version equals the parent row's current version."
    error_id: "ERR_STALE_PROFILE_VERSION | ERR_STALE_ADDON_VERSION | ERR_STALE_ACCOUNT_VERSION"
    http_status: 412
    applies_to: "POST /monitored-profiles/{id}/identifiers, POST /device-seats, POST /accounts/{id}/plan-changes, POST /accounts/{id}/members"

  - priority: 18
    category: state
    check: "The target row is in a from-state that has a declared §1.2 transition for this trigger."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 19
    category: state
    check: "The target row is not already in one of its machine's terminal_states."
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "every state-transition endpoint whose machine declares terminal_states"

  - priority: 20
    category: business_referential
    check: "The MonitoredProfile the operation depends on has status ACTIVE."
    error_id: ERR_PROFILE_NOT_ACTIVE
    http_status: 409
    applies_to: |
      POST /scan-runs and POST /scan-runs/{id}/retry only. POST /scan-runs/{id}/start
      is deliberately EXCLUDED: pausing or retiring a profile cancels every QUEUED
      ScanRun on it, so a scan can never be observed in QUEUED under a non-ACTIVE
      profile — rung 18 (ERR_INVALID_STATE, CANCELLED has no start transition) would
      always pre-empt this rung there. FAILED scans survive a pause, which is what
      makes the retry path reachable.

  - priority: 21
    category: business_referential
    check: "The Member the operation depends on has status ACTIVE."
    error_id: ERR_MEMBER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /monitored-profiles, POST /monitored-profiles/{id}/activate, POST /device-seats, POST /members/{id}/authorization"

  - priority: 22
    category: business_referential
    check: "The Broker the operation depends on has status ACTIVE."
    error_id: ERR_BROKER_RETIRED
    http_status: 409
    applies_to: "POST /scan-runs/{id}/findings, POST /removal-requests, POST /removal-requests/{id}/submit, POST /removal-requests/{id}/escalate"

  - priority: 23
    category: business_referential
    check: "The AddOnSubscription the operation depends on has status ACTIVE."
    error_id: ERR_ADDON_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /device-seats, POST /device-seats/{id}/rebind"

  - priority: 24
    category: business_referential
    check: |
      The account has a BillingCycle whose status is OPEN to book the money into.
      This rung is reachable because POST /billing-cycles/{id}/close mints a successor
      cycle only when the owning Account.status is ACTIVE: closing the cycle of a
      SUSPENDED account and then resuming that account leaves it ACTIVE with no OPEN
      cycle, and the next plan change or add-on purchase then fails here.
    error_id: ERR_CYCLE_CLOSED
    http_status: 409
    applies_to: "POST /accounts/{id}/plan-changes, POST /accounts/{id}/addons"

  - priority: 25
    category: business_safety
    check: "When Broker.requires_identity_verification is true, the request's Member holds at least one IdentityDocument whose status is VERIFIED."
    error_id: ERR_IDENTITY_VERIFICATION_REQUIRED
    http_status: 403
    applies_to: "POST /removal-requests/{id}/submit"

  - priority: 26
    category: business_safety
    check: "When Broker.requires_identity_verification is true and the Member's only VERIFIED IdentityDocument rows all have current_utc >= expires_at, the submission is blocked. An already-ACKNOWLEDGED request is unaffected: expiry mid-flight never rolls a request backwards."
    error_id: ERR_IDENTITY_DOCUMENT_EXPIRED
    http_status: 409
    applies_to: "POST /removal-requests/{id}/submit"

  - priority: 27
    category: business_safety
    check: "SEGREGATION OF DUTIES — the calling X-User-ID differs from RemovalRequest.submitted_by_agent_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /removal-requests/{id}/complete"

  - priority: 28
    category: business_temporal
    check: "current_utc >= RemovalRequest.sla_deadline_at (inclusive)."
    error_id: ERR_SLA_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /removal-requests/{id}/expire"

  - priority: 29
    category: business_temporal
    check: "For kind RECURRING, at least RESCAN_MIN_INTERVAL_DAYS (7) whole days have elapsed since MonitoredProfile.last_completed_scan_at."
    error_id: ERR_RESCAN_TOO_SOON
    http_status: 409
    applies_to: "POST /scan-runs"

  - priority: 30
    category: business_temporal
    check: "For kind INITIAL, MonitoredProfile.last_completed_scan_at is null."
    error_id: ERR_INITIAL_SCAN_ALREADY_DONE
    http_status: 409
    applies_to: "POST /scan-runs"

  - priority: 31
    category: business_temporal
    check: "current_utc >= DeviceSeat.rebind_eligible_at (inclusive), i.e. at least SEAT_REBIND_COOLOFF_HOURS (72) have elapsed since released_at."
    error_id: ERR_SEAT_REBIND_COOLOFF
    http_status: 409
    applies_to: "POST /device-seats/{id}/rebind"

  - priority: 32
    category: business_temporal
    check: "current_utc >= last_closed_request.closed_at + REQUEST_REOPEN_BUFFER_HOURS (24), where last_closed_request is the most recently closed RemovalRequest on the same exposure_id."
    error_id: ERR_EXPOSURE_CHANNEL_BUFFER
    http_status: 409
    applies_to: "POST /removal-requests"

  - priority: 33
    category: business_constraint
    check: "RemovalRequest.escalation_count < MAX_ESCALATIONS (2)."
    error_id: ERR_ESCALATION_CAP_REACHED
    http_status: 409
    applies_to: "POST /removal-requests/{id}/escalate"

  - priority: 34
    category: business_constraint
    check: "ScanRun.retry_count < MAX_SCAN_RETRIES (2)."
    error_id: ERR_SCAN_RETRY_CAP_REACHED
    http_status: 409
    applies_to: "POST /scan-runs/{id}/retry"

  - priority: 35
    category: business_constraint
    check: "No RemovalRequest with this exposure_id is in DRAFTED, SUBMITTED, ACKNOWLEDGED or ESCALATED."
    error_id: ERR_DUPLICATE_REMOVAL_REQUEST
    http_status: 409
    applies_to: "POST /removal-requests"

  - priority: 36
    category: business_constraint
    check: "No Identifier row already exists on the profile with the same (identifier_type, identifier_value) pair."
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "POST /monitored-profiles/{id}/identifiers"

  - priority: 37
    category: business_constraint
    check: "The profile holds fewer than MAX_IDENTIFIERS_PER_PROFILE (8) Identifier rows."
    error_id: ERR_IDENTIFIER_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /monitored-profiles/{id}/identifiers"

  - priority: 38
    category: business_constraint
    check: "No Member row with status in {INVITED, ACTIVE} on this account already carries the supplied email."
    error_id: ERR_DUPLICATE_MEMBER_EMAIL
    http_status: 409
    applies_to: "POST /accounts/{id}/members"

  - priority: 39
    category: business_constraint
    check: "No AddOnSubscription with the same addon_type and status in {ACTIVE, SUSPENDED} already exists on this account."
    error_id: ERR_DUPLICATE_ADDON
    http_status: 409
    applies_to: "POST /accounts/{id}/addons"

  - priority: 40
    category: business_constraint
    check: "At least one Identifier row exists with profile_id equal to the profile being activated."
    error_id: ERR_PROFILE_HAS_NO_IDENTIFIER
    http_status: 409
    applies_to: "POST /monitored-profiles/{id}/activate"

  - priority: 41
    category: business_constraint
    check: "The count of Member rows with status in {INVITED, ACTIVE} is strictly less than Plan.max_members."
    error_id: ERR_MEMBER_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /accounts/{id}/members"

  - priority: 42
    category: business_constraint
    check: "The add-on's BOUND seat count is strictly less than seats_total (seat_pool_occupancy)."
    error_id: ERR_SEAT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /device-seats, POST /device-seats/{id}/rebind"

  - priority: 43
    category: business_fiscal
    check: "Account.profile_units_remaining >= 1."
    error_id: ERR_PROFILE_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /monitored-profiles/{id}/activate"

  - priority: 44
    category: business_fiscal
    check: "Account.scan_units_remaining >= 1."
    error_id: ERR_SCAN_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /scan-runs"

  - priority: 45
    category: business_fiscal
    check: "Account.removal_units_remaining >= 1 (skipped entirely when the target exposure is fee_exempt)."
    error_id: ERR_REMOVAL_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /removal-requests"

  - priority: 46
    category: business_fiscal
    check: "member_subcap_remaining >= 1 (skipped entirely when the target exposure is fee_exempt). Checked strictly AFTER the shared-pool check at priority 45."
    error_id: ERR_MEMBER_SUBCAP_EXCEEDED
    http_status: 409
    applies_to: "POST /removal-requests"

  - priority: 47
    category: business_fiscal
    check: "new_plan.max_members >= the account's occupied seat count AND new_plan.profile_quota_per_cycle >= Account.profile_units_consumed."
    error_id: ERR_PLAN_DOWNGRADE_BELOW_USAGE
    http_status: 409
    applies_to: "POST /accounts/{id}/plan-changes"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# Flat topology: every collection sits at the URL root. Sub-resource GETs exist
# only as FK reverse-reachability lookups. Every list endpoint accepts limit /
# offset and returns rows ordered by created_at ASC unless stated otherwise.
# ---------------------------------------------------------------------------

endpoints:

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: moves the server's logical clock. The clock's startup default is exactly 2026-05-01T00:00:00Z; before any call to this endpoint every timestamp the server stamps reads from that default, never from real wall-clock time. The clock may be moved forward or backward."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime, previous_utc: datetime }
    side_effects:
      - "sets the logical clock; no persisted row is mutated"

  - method: POST
    path: "/plans"
    description: "Registers a commercial plan."
    roles: [PlatformAdmin]
    code: 201
    input: [tier, name, monthly_fee_cents, max_members, profile_quota_per_cycle, scan_quota_per_cycle, removal_quota_per_cycle, per_member_removal_subcap]
    output: Plan
    side_effects:
      - "creates a Plan row with version 1"

  - method: POST
    path: "/accounts"
    description: "Opens a household subscription. Mints the primary Member (status ACTIVE, is_primary true, authorization GRANTED), the first BillingCycle (cycle_seq 1, starts_at current_utc, ends_at current_utc + 30 days, base_charge_cents = plan.monthly_fee_cents) and the three CYCLE_GRANT ledger entries."
    roles: [PlatformAdmin]
    code: 201
    input: [plan_id, primary_member_email, primary_member_full_name]
    output: Account
    side_effects:
      - "creates Account (status ACTIVE, legal_hold false, version 1)"
      - "creates the primary Member and stamps Account.primary_member_id"
      - "creates BillingCycle cycle_seq 1 in OPEN"
      - "appends three EntitlementLedgerEntry GRANT rows (PROFILE, SCAN, REMOVAL) with reason_code CYCLE_GRANT and amounts from the plan quotas"

  - method: GET
    path: "/accounts"
    description: "Lists accounts. Ordered by created_at ASC."
    roles: [PlatformAdmin, Auditor]
    code: 200
    input: ["plan_id?", "primary_member_id?", "status?", "limit?", "offset?"]
    output: Account[]
    side_effects: []

  - method: GET
    path: "/accounts/{id}"
    description: "Reads one account including all twelve derived entitlement figures."
    roles: [PlatformAdmin, PrivacyAgent, AccountOwner, Member, Auditor]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: POST
    path: "/accounts/{id}/suspend"
    description: "Suspends the subscription and runs the depth-5 cascade."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Account
    side_effects:
      - "Account ACTIVE -> SUSPENDED"
      - "cascade hop 2: ACTIVE MonitoredProfile rows -> PAUSED"
      - "cascade hop 3: QUEUED ScanRun rows on those profiles -> CANCELLED"
      - "cascade hop 4: each cancelled scan appends a SCAN RELEASE ledger entry"
      - "cascade hop 5: Account.scan_units_released / scan_units_remaining rise"
      - "branch: ACTIVE AddOnSubscription rows -> SUSPENDED, voiding their BOUND DeviceSeat rows"
      - "increments Account.version by 1"

  - method: POST
    path: "/accounts/{id}/resume"
    description: "Returns a suspended subscription to ACTIVE and restores voided seats."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Account
    side_effects:
      - "Account SUSPENDED -> ACTIVE"
      - "SUSPENDED AddOnSubscription rows -> ACTIVE"
      - "VOIDED DeviceSeat rows whose member is ACTIVE -> BOUND with bind_count incremented"
      - "PAUSED MonitoredProfile rows are deliberately NOT resumed"
      - "increments Account.version by 1"

  - method: POST
    path: "/accounts/{id}/cancel"
    description: "Terminates the subscription."
    roles: [PlatformAdmin, AccountOwner]
    code: 200
    input: []
    output: Account
    side_effects:
      - "Account -> CANCELLED"
      - "AddOnSubscription rows -> CANCELLED, voiding their BOUND seats"
      - "MonitoredProfile rows -> RETIRED"
      - "the OPEN BillingCycle -> CLOSED with no successor minted"
      - "increments Account.version by 1"

  - method: POST
    path: "/accounts/{id}/legal-hold"
    description: "Flips the independent legal-hold axis. This is the only account-scoped mutating endpoint that is exempt from validation rungs 13-15."
    roles: [PlatformAdmin]
    code: 200
    input: [hold_state]
    output: Account
    side_effects:
      - "sets Account.legal_hold and legal_hold_set_at"
      - "increments Account.version by 1"

  - method: POST
    path: "/accounts/{id}/plan-changes"
    description: "Moves the account to another plan mid-cycle and books the proration onto the OPEN cycle."
    roles: [PlatformAdmin, AccountOwner]
    code: 200
    input: [new_plan_id, change_kind, expected_account_version]
    output: Account
    side_effects:
      - "repoints Account.plan_id"
      - "books proration_charge_cents (UPGRADE) or proration_credit_cents (DOWNGRADE) onto the OPEN BillingCycle per calculations.plan_proration_amount"
      - "re-grants nothing: the cycle's existing GRANT ledger entries are left untouched, so quota changes take effect at the next cycle"
      - "increments Account.version by 1"

  - method: GET
    path: "/accounts/{id}/members"
    description: "FK reverse lookup for Member.account_id. Ordered by created_at ASC, so the primary member is always index 0."
    roles: [PlatformAdmin, PrivacyAgent, AccountOwner, Member, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Member[]
    side_effects: []

  - method: POST
    path: "/accounts/{id}/members"
    description: "Invites a household member. The response carries the invitation_token."
    roles: [PlatformAdmin, AccountOwner]
    code: 201
    input: [email, full_name, role_in_family, expected_account_version]
    output: Member
    side_effects:
      - "creates a Member row in INVITED with authorization_status GRANTED and a server-issued invitation_token"
      - "increments Account.version by 1"

  - method: GET
    path: "/accounts/{id}/addons"
    description: "FK reverse lookup for AddOnSubscription.account_id. Ordered by created_at ASC."
    roles: [PlatformAdmin, AccountOwner, Member, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AddOnSubscription[]
    side_effects: []

  - method: POST
    path: "/accounts/{id}/addons"
    description: "Buys a VPN or device-protection add-on and books its prorated charge."
    roles: [PlatformAdmin, AccountOwner]
    code: 201
    input: [addon_type, seats_total, per_seat_fee_cents]
    output: AddOnSubscription
    side_effects:
      - "creates an AddOnSubscription row in ACTIVE with version 1"
      - "computes calculations.addon_proration_amount under the SEAT_ADDED variant, stamps prorated_charge_cents and adds it to the OPEN BillingCycle.addon_charge_cents"

  - method: GET
    path: "/accounts/{id}/billing-cycles"
    description: "FK reverse lookup for BillingCycle.account_id. Ordered by cycle_seq ASC, so the account's first cycle is index 0."
    roles: [PlatformAdmin, AccountOwner, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BillingCycle[]
    side_effects: []

  - method: GET
    path: "/accounts/{id}/entitlement-statement"
    description: "Derived cycle entitlement statement per calculations.cycle_entitlement_statement. Nothing here is stored."
    roles: [PlatformAdmin, AccountOwner, Auditor]
    code: 200
    input: []
    output:
      account_id: string
      cycle_id: string
      cycle_seq: integer
      profile_granted: integer
      profile_consumed: integer
      profile_released: integer
      profile_remaining: integer
      scan_granted: integer
      scan_consumed: integer
      scan_released: integer
      scan_remaining: integer
      removal_granted: integer
      removal_consumed: integer
      removal_released: integer
      removal_remaining: integer
      member_breakdown: array
    side_effects: []

  - method: GET
    path: "/members/{id}"
    description: "Reads one member including removal_units_consumed_this_cycle."
    roles: [PlatformAdmin, PrivacyAgent, AccountOwner, Member, Auditor]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: POST
    path: "/members/{id}/activate"
    description: "Redeems an invitation token."
    roles: [Member, AccountOwner]
    code: 200
    input: [invitation_token]
    output: Member
    side_effects:
      - "Member INVITED -> ACTIVE, clears invitation_token"
      - "increments Member.version by 1"

  - method: POST
    path: "/members/{id}/authorization"
    description: "Grants or revokes the agent authorization on the independent authorization axis. REVOKE runs the depth-4 void-and-refund cascade."
    roles: [Member, AccountOwner]
    code: 200
    input: [action]
    output: Member
    side_effects:
      - "flips Member.authorization_status"
      - "on REVOKE cascade hop 2: DRAFTED RemovalRequest rows of this member -> VOIDED"
      - "on REVOKE cascade hop 3: each voided request that had consumed a unit appends a REMOVAL RELEASE ledger entry with reason_code AUTHORIZATION_REVOKED"
      - "on REVOKE cascade hop 4: Account.removal_units_released / removal_units_remaining rise and Member.removal_units_consumed_this_cycle falls"
      - "increments Member.version by 1"

  - method: POST
    path: "/members/{id}/remove"
    description: "Removes a non-primary household member."
    roles: [PlatformAdmin, AccountOwner]
    code: 200
    input: []
    output: Member
    side_effects:
      - "Member -> REMOVED"
      - "the member's MonitoredProfile rows -> RETIRED, each releasing a PROFILE unit when it held one"
      - "the member's BOUND DeviceSeat rows -> RELEASED"
      - "increments Member.version by 1"

  - method: GET
    path: "/members/{id}/monitored-profiles"
    description: "FK reverse lookup for MonitoredProfile.member_id. Ordered by created_at ASC."
