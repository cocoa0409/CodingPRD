        captures:
          fee10: $.data.fee_estimate_cents
      assert:
      - 'File closing 2026-08-10 (9 days out): fee_estimate_cents == 29500 + 7500
        == 37000 (LISTING_ONLY base + rush)'
      - 'File closing 2026-08-11 (exactly 10 days out): fee_estimate_cents == 29500
