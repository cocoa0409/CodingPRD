              as: StateRegulator
            - call: "POST /state-licenses"
              payload: { state_code: "WA", license_type: "WHOLESALER_ONLY", annual_barrel_cap: 0.00, franchise_state: true, effective_from_utc: "2026-01-01T00:00:00Z", expires_at_utc: "2027-01-01T00:00:00Z", termination_notice_days: 90 }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id, lic_v: $.data.version }
          trigger:
            - call: "POST /state-licenses/${lic_id}/ytd-adjustments"
