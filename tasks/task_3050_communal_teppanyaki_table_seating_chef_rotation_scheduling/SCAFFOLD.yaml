# =============================================================================
# PRD Benchmark Scaffold — task_3050
# Communal Teppanyaki Table Seating & Chef Rotation Scheduling (Benihana)
# =============================================================================

scenario: |
  Communal Teppanyaki Table Seating & Chef Rotation Scheduling (Benihana): reservation
  seating that combines separate parties at a shared grill table to reach table minimums,
  party-size to table-capacity matching with hold windows before seating strangers
  together, chef rotation scheduling so each chef covers a sequence of tables with
  staggered show start times, course timing coordination between the sushi and grill
  kitchens, per-table performance duration standards affecting turn times, birthday and
  celebration handling with special service moments, food cost control on protein
  portions cooked tableside, ventilation and grill maintenance downtime scheduling

domain_name: "communal-teppanyaki-service-floor"
api_prefix: "/service-floor"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - selector_policy
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------------------
  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: venue_name, type: string, source: input, description: "Trading name of the teppanyaki restaurant" }
      - { name: city_code, type: string, source: input, description: "Three-letter city code, e.g. NYC" }
      - { name: ventilation_zone, type: enum, source: input, description: "Hood bank serving this venue's grill bank", constraints: "ZONE_A | ZONE_B | ZONE_C | ZONE_D" }
      - { name: status, type: enum, source: system, description: "Lifecycle status of the venue", default: "ACTIVE", constraints: "ACTIVE | VENTILATION_HOLD" }
      - { name: occupancy_freeze, type: boolean, source: system, description: "True while status is VENTILATION_HOLD; blocks every SEAT transition at this venue", default: false }
      - { name: hood_filter_life_index, type: integer, source: system, description: "Cumulative cooking-minute index across all grill tables; +1 per completed ShowPerformance GRILL course", default: 0 }
      - { name: filter_service_threshold_index, type: integer, source: input, description: "Index at which the ventilation bank must be serviced", default: 40 }
      - { name: ops_epoch, type: integer, source: system, description: "Batch tick counter, starts at 0, incremented by POST /venues/{id}/run_ops", default: 0 }
      - { name: shortfall_turn_debt_minutes, type: integer, source: computed, description: "Sum of max(0, TableTier.turn_time_standard_minutes - TableSeating.occupied_minutes) over every CLOSED reservation at this venue", default: 0 }
      - { name: protein_cost_cents, type: integer, source: computed, description: "Sum of ProteinTicket.cost_cents for every non-VOIDED protein ticket at this venue", default: 0 }
      - { name: restaurant_charge_cents, type: integer, source: computed, description: "Per-epoch floor charge recomputed from scratch on every run_ops, never accumulated", default: 0 }

  # ---------------------------------------------------------------------------
  - name: Party
    parent: Venue
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; the venue whose floor this party books against" }
      - { name: lead_guest_name, type: string, source: input, description: "Name of the guest who owns the booking" }
      - { name: contact_phone, type: string, source: input, description: "Contact number used for the reminder call" }
      - { name: loyalty_tier, type: enum, source: input, description: "NONE | SILVER | GOLD | PLATINUM", default: "NONE", constraints: "NONE | SILVER | GOLD | PLATINUM" }
      - { name: no_show_count, type: integer, source: computed, description: "Count of Reservation rows for this party that reached NO_SHOW", default: 0 }
      - { name: loyalty_credit_cents, type: integer, source: computed, description: "Reusable credit balance granted at CLOSE; strictly non-negative", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | RESTRICTED", default: "ACTIVE", constraints: "initial ACTIVE" }

  # ---------------------------------------------------------------------------
  - name: TableTier
    parent: Venue
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; the venue this tier is configured for" }
      - { name: tier_code, type: enum, source: input, description: "Capacity class of the grill table", constraints: "T2 | T4 | T6 | T8 | T10" }
      - { name: seat_capacity, type: integer, source: input, description: "Maximum number of guests that may share one table of this tier" }
      - { name: over_capacity_ratio, type: number, source: input, description: "Fraction by which a party may exceed the tier's seat capacity before the tier is refused", default: 1.25 }
      - { name: base_rate_per_guest_cents, type: integer, source: input, description: "Ground rate charged per guest for this tier" }
      - { name: minimum_bill_cents, type: integer, source: input, description: "Table minimum that a seating episode must reach before CLOSE" }
      - { name: protein_gram_standard, type: integer, source: input, description: "Standard protein grams issued per guest for this tier" }
      - { name: chef_show_minutes, type: integer, source: input, description: "Per-table performance duration standard for the chef's grill show" }
      - { name: turn_time_standard_minutes, type: integer, source: input, description: "Standard occupancy minutes from seating to vacate for this tier" }
      - { name: turn_time_celebration_minutes, type: integer, source: input, description: "Occupancy minutes allowed when the reservation carries a non-NONE celebration" }
      - { name: status, type: enum, source: system, description: "Lifecycle status of the tier row", default: "ACTIVE", constraints: "ACTIVE | RETIRED" }

  # ---------------------------------------------------------------------------
  - name: GrillTable
    parent: Venue
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; the venue whose floor this table stands on" }
      - { name: tier_code, type: enum, source: input, description: "Tier this table was built to", constraints: "T2 | T4 | T6 | T8 | T10" }
      - { name: seat_capacity, type: integer, source: input, description: "Guest seats at this physical grill table" }
      - { name: status, type: enum, source: system, description: "Floor status of the grill table", default: "AVAILABLE", constraints: "AVAILABLE | SEATED | TURNING | MAINTENANCE" }
      - { name: maintenance_resume_at, type: datetime, source: system, description: "Earliest instant the table may leave MAINTENANCE; null unless status is MAINTENANCE" }
      - { name: pending_turn, type: boolean, source: system, description: "True once every seat of this table is filled and the table must begin TURNING at the close of the current show", default: false }
      - { name: guests_seated, type: integer, source: computed, description: "Sum of Reservation.party_size over TableSeating rows at this table whose status is ACTIVE", default: 0 }
      - { name: last_seated_at, type: datetime, source: system, description: "Clock instant of the most recent SEAT transition at this table" }

  # ---------------------------------------------------------------------------
  - name: Reservation
    parent: Venue
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; the venue this booking is placed at" }
      - { name: party_id, type: string, source: input, description: "FK -> Party.id; the guest party that owns this booking" }
      - { name: tier_id, type: string, source: input, description: "FK -> TableTier.id; the tier row this booking is priced against" }
      - { name: party_size, type: integer, source: input, description: "Number of guests arriving" }
      - { name: scheduled_time, type: datetime, source: input, description: "Requested grill show start instant" }
      - { name: payment_mode, type: enum, source: input, description: "CARD_ONLY | CARD_THEN_CREDIT | CREDIT_ONLY", constraints: "CARD_ONLY | CARD_THEN_CREDIT | CREDIT_ONLY" }
      - { name: credit_to_apply_cents, type: integer, source: input, description: "Credit the party wishes to apply to the check", default: 0 }
      - { name: celebration, type: enum, source: input, description: "NONE | BIRTHDAY | ANNIVERSARY | GRADUATION | CORPORATE", default: "NONE", constraints: "NONE | BIRTHDAY | ANNIVERSARY | GRADUATION | CORPORATE" }
      - { name: invite_code, type: string, source: input, description: "Optional shared code; bookings carrying the same non-null code may be combined at one table before their hold windows expire" }
      - { name: status, type: enum, source: system, description: "Lifecycle status of the booking", default: "DRAFT", constraints: "DRAFT | REQUESTED | HELD | SEATED | CLOSED | NO_SHOW | ABANDONED" }
      - { name: hold_count, type: integer, source: system, description: "Number of hold windows already granted in this booking's current episode", default: 0 }
      - { name: hold_until, type: datetime, source: system, description: "Instant at which this booking's current hold window closes; null unless status is HELD" }
      - { name: table_id, type: string, source: system, description: "FK -> GrillTable.id; table this booking is committed to once HELD or SEATED" }
      - { name: chef_assignment_id, type: string, source: system, description: "FK -> ChefAssignment.id; chef currently responsible for this booking's table" }
      - { name: quote_final_cents, type: integer, source: computed, description: "Provisional quote stamped while the booking is DRAFT/REQUESTED", default: 0 }
      - { name: final_bill_cents, type: integer, source: computed, description: "Gross billed amount recomputed on CLOSE", default: 0 }
      - { name: check_cents, type: integer, source: computed, description: "Settled check = final_bill_cents + seat_surcharge_cents - credit_applied_cents, computed in that pinned order", default: 0 }
      - { name: seat_surcharge_cents, type: integer, source: computed, description: "Surcharge posted at SEAT, reversed when the booking is ABANDONED or reopened", default: 0 }
      - { name: credit_applied_cents, type: integer, source: computed, description: "Credit actually consumed by this booking, default 0" }
      - { name: celebration_fee_cents, type: integer, source: computed, description: "Fee for the celebration service moment, default 0" }
      - { name: last_ops_epoch, type: integer, source: system, description: "Venue.ops_epoch value observed at this booking's last mutation", default: 0 }
      - { name: current_seating_id, type: string, source: system, description: "FK -> TableSeating.id; the occupancy row opened by this booking's most recent SEAT" }
      - { name: current_sushi_show_id, type: string, source: system, description: "FK -> ShowPerformance.id; the sushi phase planned by this booking's most recent SEAT" }
      - { name: current_grill_show_id, type: string, source: system, description: "FK -> ShowPerformance.id; the grill phase planned by this booking's most recent SEAT" }

  # ---------------------------------------------------------------------------
  - name: TableSeating
    parent: Venue
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; the venue whose floor this occupancy belongs to" }
      - { name: table_id, type: string, source: input, description: "FK -> GrillTable.id; the grill table occupied during this interval" }
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; the booking seated during this interval" }
      - { name: guest_count, type: integer, source: system, description: "Guests contributed to the shared table by this occupancy" }
      - { name: seated_at, type: datetime, source: system, description: "Clock instant this occupancy began" }
      - { name: expected_vacate_at, type: datetime, source: system, description: "seated_at + turn_time_standard_minutes, or + turn_time_celebration_minutes when the booking carries a celebration" }
      - { name: actual_vacated_at, type: datetime, source: system, description: "Clock instant this occupancy ended; null while status is ACTIVE" }
      - { name: occupied_minutes, type: integer, source: computed, description: "actual_vacated_at - seated_at in whole minutes, or clock - seated_at while ACTIVE" }
      - { name: status, type: enum, source: system, description: "Whether the occupancy is still running", default: "ACTIVE", constraints: "ACTIVE | VACATED" }

  # ---------------------------------------------------------------------------
  - name: ChefAssignment
    parent: Venue
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; the venue this chef works" }
      - { name: chef_name, type: string, source: input, description: "Display name of the teppanyaki chef" }
      - { name: station_zone, type: enum, source: input, description: "Hood zone the chef's grill bank sits in", constraints: "ZONE_A | ZONE_B | ZONE_C | ZONE_D" }
      - { name: status, type: enum, source: system, description: "Rotation status of the chef", default: "OFF_SHIFT", constraints: "OFF_SHIFT | ON_STATION | CLEARING" }
      - { name: sequence_index, type: integer, source: system, description: "Rotation position assigned at clock-in, 1-based" }
      - { name: current_table_id, type: string, source: system, description: "FK -> GrillTable.id; table this chef is currently working, null when not mid-show" }
      - { name: completed_show_count, type: integer, source: computed, description: "Count of ShowPerformance rows for this chef whose status is FINISHED, default 0" }
      - { name: pounds_protein_issued, type: number, source: computed, description: "Sum of ProteinTicket.issued_grams for this chef divided by 453.6, rounded to 2 decimals", default: 0 }
      - { name: minutes_since_show, type: integer, source: computed, description: "Whole minutes between the clock and the actual_start_at of this chef's most recent FINISHED show at this venue; 0 when the chef has no finished show yet" }

  # ---------------------------------------------------------------------------
  - name: ShowPerformance
    parent: Venue
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; the venue where the show happens" }
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; the booking being served" }
      - { name: chef_assignment_id, type: string, source: input, description: "FK -> ChefAssignment.id; the chef performing" }
      - { name: table_id, type: string, source: input, description: "FK -> GrillTable.id; the table the show is performed at" }
      - { name: course_phase, type: enum, source: input, description: "Phase of the meal this performance covers; SUSHI, GRILL and DESSERT are named at SEAT, and CELEBRATION is created only by the DESSERT start cascade", constraints: "SUSHI | GRILL | DESSERT | CELEBRATION" }
      - { name: planned_start_at, type: datetime, source: input, description: "Course start instant the floor planned for this phase" }
      - { name: actual_start_at, type: datetime, source: system, description: "Clock instant the phase actually started; null while status is PLANNED" }
      - { name: duration_minutes, type: integer, source: system, description: "Minutes between actual_start_at and FINISHED, or planned duration while not finished", default: 0 }
      - { name: protein_grams_served, type: integer, source: input, description: "Protein grams cooked during this phase; only meaningful for GRILL", default: 0 }
      - { name: status, type: enum, source: system, description: "Lifecycle status of the show phase", default: "PLANNED", constraints: "PLANNED | STARTED | FINISHED | SKIPPED" }
      - { name: protein_ticket_id, type: string, source: system, description: "FK -> ProteinTicket.id; the protein issue posted by this GRILL phase, null for SUSHI and DESSERT" }

  # ---------------------------------------------------------------------------
  - name: MaintenanceWindow
    parent: Venue
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; the venue whose equipment is being serviced" }
      - { name: table_id, type: string, source: input, description: "FK -> GrillTable.id; the grill table taken out of service, null for a venue-wide ventilation service" }
      - { name: maintenance_kind, type: enum, source: input, description: "VENTILATION_SERVICE | GRILL_REBUILD | HOOD_DEEP_CLEAN", constraints: "VENTILATION_SERVICE | GRILL_REBUILD | HOOD_DEEP_CLEAN" }
      - { name: planned_start_at, type: datetime, source: input, description: "Scheduled start of the downtime" }
      - { name: planned_end_at, type: datetime, source: input, description: "Scheduled end of the downtime" }
      - { name: status, type: enum, source: system, description: "Lifecycle status of the downtime window", default: "SCHEDULED", constraints: "SCHEDULED | ACTIVE | COMPLETED" }

  # ---------------------------------------------------------------------------
  - name: SushiTicket
    parent: Venue
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; the venue whose sushi kitchen fires this ticket" }
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; the booking this ticket serves" }
      - { name: item_code, type: string, source: input, description: "Menu code from the sushi kitchen's list" }
      - { name: quantity, type: integer, source: input, description: "Portions fired" }
      - { name: requested_at, type: datetime, source: input, description: "Instant the ticket must be plated by" }
      - { name: unit_price_cents, type: integer, source: input, description: "Menu price per portion" }
      - { name: prep_phase, type: enum, source: system, description: "Preparation stage of the ticket", default: "RAW_CUT", constraints: "RAW_CUT | ROLLED | PLATED" }
      - { name: status, type: enum, source: system, description: "OPEN | VOIDED", default: "OPEN", constraints: "initial OPEN" }

  # ---------------------------------------------------------------------------
  - name: VenueLedgerEntry
    parent: Venue
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; the venue this ledger entry settles against" }
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; the booking this entry belongs to" }
      - { name: entry_kind, type: enum, source: system, description: "Kind of ledger movement", constraints: "SEAT_SURCHARGE | CELEBRATION_CHARGE | TABLE_MINIMUM_TRUEUP" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount; positive charges the party, negative credits the party" }
      - { name: status, type: enum, source: system, description: "POSTED | VOIDED", default: "POSTED", constraints: "initial POSTED" }

  # ---------------------------------------------------------------------------
  - name: ProteinTicket
    parent: Venue
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; the venue whose protein inventory is consumed" }
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; the booking the protein was issued to" }
      - { name: show_id, type: string, source: system, description: "FK -> ShowPerformance.id; the GRILL phase that posted this issue" }
      - { name: chef_assignment_id, type: string, source: input, description: "FK -> ChefAssignment.id; the chef who issued the protein" }
      - { name: standard_grams, type: integer, source: system, description: "Guest count times TableTier.protein_gram_standard at the moment of issue" }
      - { name: issued_grams, type: integer, source: system, description: "Grams actually staged for the table" }
      - { name: variance_grams, type: integer, source: computed, description: "issued_grams - standard_grams, signed" }
      - { name: cost_cents, type: number, source: computed, description: "issued_grams times the pinned protein cost-per-gram constant, rounded half up at 2 decimal places", default: 0 }
      - { name: status, type: enum, source: system, description: "Whether the issue still counts against the venue rollup", default: "POSTED", constraints: "POSTED | VOIDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  - entity: Venue
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: VENTILATION_HOLD
        trigger: "system cascade (MaintenanceWindow SCHEDULED -> ACTIVE for a VENTILATION_SERVICE window at this venue)"
        actor: system
        preconditions:
          - "the accepted MaintenanceWindow.maintenance_kind == VENTILATION_SERVICE"
        side_effects:
          - "HOP 1 (this transition): Venue.occupancy_freeze -> true; every SEAT transition at this venue is blocked while it holds"
          - "HOP 2 (caused by HOP 1): every GrillTable at this venue in AVAILABLE or SEATED -> MAINTENANCE with maintenance_resume_at = the accepted window's planned_end_at"
          - "HOP 3 (caused by HOP 2, i.e. by each table entering MAINTENANCE, not by this transition directly): each such table drives its own TableSeating ACTIVE -> VACATED transition, which stamps actual_vacated_at = clock, recomputes occupied_minutes, recomputes GrillTable.guests_seated and recomputes Venue.shortfall_turn_debt_minutes"
          - "HOP 4 (caused by HOP 3, i.e. by each Reservation left with no remaining ACTIVE TableSeating row): Reservation.status -> ABANDONED, hold_until -> null, table_id -> null"
          - "HOP 5 (caused by HOP 4, i.e. by each newly ABANDONED Reservation): every VenueLedgerEntry with status POSTED for that reservation drives its own POSTED -> VOIDED transition, and that transition in turn credits Party.loyalty_credit_cents by the voided positive amount"

      - from: VENTILATION_HOLD
        to: ACTIVE
        trigger: "system (POST /venues/:venue_id/run_ops)"
        actor: system
        preconditions:
          - "Venue.hood_filter_life_index >= Venue.filter_service_threshold_index"
          - "every MaintenanceWindow at this venue with status ACTIVE has clock >= planned_end_at"
        side_effects:
          - "Venue.occupancy_freeze -> false; Venue.hood_filter_life_index -> 0"
          - "every GrillTable at this venue in MAINTENANCE -> AVAILABLE with maintenance_resume_at -> null"
          - "every MaintenanceWindow at this venue in SCHEDULED -> COMPLETED"
          - "every ChefAssignment at this venue in ON_STATION -> CLEARING"

  # ---------------------------------------------------------------------------
  - entity: GrillTable
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: SEATED
        trigger: "POST /tables/:table_id/events (SEAT) or cascade from POST /reservations/:reservation_id/seat"
        actor: "Host, system"
        preconditions:
          - "Venue.status == ACTIVE (no accepted VENTILATION_SERVICE window is ACTIVE at this venue)"
          - "the reservation being seated is in status HELD"
          - "guest_count being seated <= GrillTable.seat_capacity, and GrillTable.guests_seated + guest_count <= GrillTable.seat_capacity"
          - "no MaintenanceWindow with table_id = this table and status in {SCHEDULED, ACTIVE} overlaps the interval [clock, clock + the occupancy's expected_vacate_at)"
        side_effects:
          - "TableSeating row created in status ACTIVE with guest_count, seated_at = clock, expected_vacate_at per §1.3 occupancy_window"
          - "GrillTable.guests_seated recomputed; GrillTable.last_seated_at = clock"
          - "GrillTable.pending_turn -> true when guests_seated == GrillTable.seat_capacity"
          - "ShowPerformance rows created for course_phase = SUSHI, GRILL and DESSERT, all status = PLANNED"
          - "Reservation.seat_surcharge_cents posted per §1.3 seat_surcharge; VenueLedgerEntry of kind SEAT_SURCHARGE created with status POSTED"
          - "the selected ChefAssignment is pinned by §1.3 chef_rotation: its current_table_id is set to this table and Reservation.chef_assignment_id is set to it"

      - from: SEATED
        to: TURNING
        trigger: "GrillTable.status is driven to TURNING by POST /tables/:table_id/events (TURN) once every show at the table is FINISHED"
        actor: "Chef, FloorManager"
        preconditions:
          - "every ShowPerformance row at this table for the current seating episode has status in {FINISHED, SKIPPED}"
        side_effects:
          - "HOP 1 (this transition): every TableSeating row for this table in ACTIVE is driven through its own ACTIVE -> VACATED transition, which stamps actual_vacated_at = clock and recomputes occupied_minutes"
          - "HOP 2 (caused by HOP 1): each newly VACATED row drives the turn_debt calculation, adding its bucket allocation to Venue.shortfall_turn_debt_minutes"
          - "HOP 3 (caused by HOP 2): when the recomputed Venue.shortfall_turn_debt_minutes exceeds the TURN_DEBT_ESCALATION_THRESHOLD constant, every Party at this venue with no_show_count >= 2 -> RESTRICTED"
          - "the Reservation for each vacated TableSeating row -> CLOSED"
          - "when Venue.shortfall_turn_debt_minutes > the TURN_DEBT_ESCALATION_THRESHOLD constant, every Party at this venue with no_show_count >= 2 -> RESTRICTED"
          - "Venue.protein_cost_cents recomputed over every ProteinTicket with status POSTED at this venue"
          - "GrillTable.pending_turn -> false"

      - from: SEATED
        to: MAINTENANCE
        trigger: "POST /tables/:table_id/events (MAINTENANCE_ENTER)"
        actor: FloorManager
        preconditions:
          - "no ACTIVE TableSeating row at this table"
        side_effects:
          - "GrillTable.maintenance_resume_at = the supplied resume_at"
          - "active ShowPerformance rows at this table -> SKIPPED"

      - from: TURNING
        to: AVAILABLE
        trigger: "POST /tables/:table_id/events (TURN_RELEASE)"
        actor: FloorManager
        preconditions:
          - "GrillTable.guests_seated == 0"
          - "no ShowPerformance row at this table retains status PLANNED or STARTED"
        side_effects:
          - "GrillTable.pending_turn -> false"
          - "GrillTable.last_seated_at unchanged"

      - from: TURNING
        to: MAINTENANCE
        trigger: "POST /tables/:table_id/events (MAINTENANCE_ENTER)"
        actor: FloorManager
        preconditions:
          - "GrillTable.guests_seated == 0"
        side_effects:
          - "GrillTable.maintenance_resume_at = the supplied resume_at"

      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "system (POST /venues/:venue_id/run_ops)"
        actor: system
        preconditions:
          - "clock >= GrillTable.maintenance_resume_at"
          - "a MaintenanceWindow for this table_id exists with status SCHEDULED"
        side_effects:
          - "GrillTable.maintenance_resume_at -> null"
          - "that MaintenanceWindow -> COMPLETED"
          - "Venue.hood_filter_life_index -> 0 for a GRILL_REBUILD window"

  # ---------------------------------------------------------------------------
  - entity: ChefAssignment
    field: status
    initial_state: OFF_SHIFT
    terminal_states: []
    transitions:
      - from: OFF_SHIFT
        to: ON_STATION
        trigger: "POST /chefs/:chef_id/events (CLOCK_IN)"
        actor: Chef
        preconditions:
          - "no other ChefAssignment at this venue with the same station_zone is in status ON_STATION"
          - "Venue.occupancy_freeze == false"
        side_effects:
          - "ChefAssignment.sequence_index = 1 + max(sequence_index over ChefAssignments at this venue with status ON_STATION), or 1 when none"
          - "ChefAssignment.status -> ON_STATION"

      - from: ON_STATION
        to: CLEARING
        trigger: "POST /chefs/:chef_id/events (CLEAR_FINISH)"
        actor: Chef
        side_effects:
          - "ChefAssignment.current_table_id -> null"
          - "ChefAssignment.status -> CLEARING"

      - from: CLEARING
        to: OFF_SHIFT
        trigger: "POST /chefs/:chef_id/events (CLOCK_OUT)"
        actor: Chef
        side_effects:
          - "ChefAssignment.sequence_index -> null"

      - from: CLEARING
        to: ON_STATION
        trigger: "POST /chefs/:chef_id/events (ROTATE_SUPPRESS)"
        actor: FloorManager
        preconditions:
          - "no other ChefAssignment at this venue with the same station_zone is in status ON_STATION"
        side_effects:
          - "ChefAssignment.sequence_index = 1 + max(sequence_index over ChefAssignments at this venue with status ON_STATION), or 1 when none"

  # ---------------------------------------------------------------------------
  - entity: ShowPerformance
    field: status
    initial_state: PLANNED
    terminal_states: [FINISHED]
    transitions:
      - from: PLANNED
        to: STARTED
        trigger: "POST /show-performances/:show_id/events (START)"
        actor: Chef
        preconditions:
          - "for GRILL: a ShowPerformance row for this reservation with course_phase = SUSHI has status FINISHED"
          - "for DESSERT: a ShowPerformance row for this reservation with course_phase = GRILL has status FINISHED"
          - "for CELEBRATION: the assigned ChefAssignment is in status CLEARING"
        side_effects:
          - "ShowPerformance.actual_start_at = clock"
          - "for GRILL: a ProteinTicket row is created with standard_grams, issued_grams, status POSTED and show_id set to this phase; ShowPerformance.protein_ticket_id set to that row; Venue.protein_cost_cents recomputed; ChefAssignment.pounds_protein_issued recomputed"
          - "for GRILL: Venue.hood_filter_life_index += 1"
          - "for GRILL on a reservation whose celebration != NONE: when clock < planned_start_at - EARLY_GRILL_TOLERANCE_MINUTES, a VenueLedgerEntry of kind CELEBRATION_CHARGE is created with status POSTED, and Reservation.celebration_fee_cents is set to that amount"
          - "for DESSERT on a reservation whose celebration != NONE: a ShowPerformance row is created with course_phase = CELEBRATION, status = PLANNED, if one does not already exist"
          - "when the reservation's ShowPerformance row with course_phase = CELEBRATION is STARTED, DESSERT and CELEBRATION run as two independently progressing phases at the same table"

      - from: STARTED
        to: FINISHED
        trigger: "POST /show-performances/:show_id/events (FINISH)"
        actor: Chef
        preconditions:
          - "for GRILL: clock - actual_start_at >= TableTier.chef_show_minutes - SHOW_UNDERRUN_TOLERANCE_MINUTES"
        side_effects:
          - "ShowPerformance.duration_minutes = clock - actual_start_at in whole minutes"
          - "Reservation.final_bill_cents and Reservation.check_cents recomputed per §1.3 settlement"
          - "for GRILL on a reservation whose celebration != NONE: ChefAssignment.status -> CLEARING"
          - "for GRILL: ChefAssignment.minutes_since_show reset to 0"
          - "when every course_phase row for this reservation is FINISHED: Reservation.status -> CLOSED"

      - from: PLANNED
        to: SKIPPED
        trigger: "POST /show-performances/:show_id/events (SKIP)"
        actor: FloorManager
        preconditions:
          - "Reservation.status != CLOSED"
        side_effects: []

      - from: STARTED
        to: SKIPPED
        trigger: "POST /show-performances/:show_id/events (SKIP)"
        actor: FloorManager
        preconditions:
          - "ShowPerformance.course_phase == SUSHI"
        side_effects:
          - "Venue.occupancy_freeze-independent: no SushiTicket is voided automatically"

      - from: SKIPPED
        to: PLANNED
        trigger: "POST /show-performances/:show_id/events (REINSTATE)"
        actor: FloorManager
        preconditions:
          - "Reservation.status in {HELD, SEATED}"
          - "for GRILL: no ProteinTicket with status POSTED exists for this reservation and chef_assignment_id"
        side_effects:
          - "ShowPerformance.status -> PLANNED with actual_start_at -> null"

  # ---------------------------------------------------------------------------
  - entity: Reservation
    field: status
    initial_state: DRAFT
    terminal_states: [CLOSED, NO_SHOW]
    transitions:
      - from: DRAFT
        to: REQUESTED
        trigger: "POST /reservations/:reservation_id/events (SUBMIT)"
        actor: Host
        preconditions:
          - "Party.status == ACTIVE"
          - "Venue.status == ACTIVE"
          - "party_size >= 1 and party_size <= the seat_capacity of the TableTier named by tier_code at this venue"
          - "scheduled_time is exactly representable on the 5-minute grid and |scheduled_time - clock| <= booking_horizon_minutes"
        side_effects:
          - "Reservation.quote_final_cents = quote settlement variant per §1.3 settlement"
          - "Reservation.last_ops_epoch = Venue.ops_epoch"

      - from: REQUESTED
        to: HELD
        trigger: "POST /reservations/:reservation_id/holds"
        actor: Host
        preconditions:
          - "Venue.occupancy_freeze == false"
          - "Reservation.hold_count < HOLD_MAX_COUNT"
          - "GrillTable is AVAILABLE, or has an ACTIVE TableSeating row, with guests_seated + party_size <= seat_capacity"
          - "no MaintenanceWindow with table_id = that table and status in {SCHEDULED, ACTIVE} overlaps [clock, clock + HOLD_WINDOW_MINUTES)"
          - "when the party carries a non-null invite_code, every Reservation already holding that invite_code has hold_until > clock"
        side_effects:
          - "Reservation.table_id = the matched table; Reservation.hold_until = clock + HOLD_WINDOW_MINUTES"
          - "Reservation.hold_count += 1"
          - "Reservation.quote_final_cents recomputed per §1.3 settlement"
          - "the table is reserved for this reservation until hold_until"

      - from: HELD
        to: SEATED
        trigger: "POST /reservations/:reservation_id/seat"
        actor: Host
        preconditions:
          - "Venue.occupancy_freeze == false"
          - "clock < Reservation.hold_until (a window that has already closed is released by HOLD_RELEASE, not seated)"
          - "the assigned GrillTable is AVAILABLE or already SEATED with guests_seated + party_size <= seat_capacity"
          - "a ChefAssignment at this venue is in status ON_STATION with current_table_id == null and either no FINISHED show yet or minutes_since_show >= MIN_CHEF_RESET_MINUTES"
        side_effects:
          - "Reservation.status -> SEATED; the §1.2 GrillTable AVAILABLE -> SEATED transition fires with its full side-effect set"
          - "Reservation.chef_assignment_id = the selected chef, chosen by §1.3 chef_rotation"

      - from: HELD
        to: HELD
        trigger: "POST /reservations/:reservation_id/holds (re-park onto a different table)"
        actor: Host
        preconditions:
          - "clock >= Reservation.hold_until"
          - "Reservation.hold_count < HOLD_MAX_COUNT"
          - "a different GrillTable satisfiable by the REQUESTED -> HELD preconditions exists"
        side_effects:
          - "the previously assigned table is released: table_id -> the new table, hold_until = clock + 20 minutes"
          - "Reservation.hold_count += 1"

      - from: HELD
        to: REQUESTED
        trigger: "system (hold window closed: POST /venues/:venue_id/run_ops)"
        actor: system
        preconditions:
          - "clock >= Reservation.hold_until"
        side_effects:
          - "Reservation.hold_until -> null; Reservation.table_id -> null"
          - "the released GrillTable -> AVAILABLE when it holds no other ACTIVE TableSeating row"

      - from: SEATED
        to: SEATED
        trigger: "POST /reservations/:reservation_id/party-size (ADD_PARTY or TIER_UP)"
        actor: Host
        preconditions:
          - "the new party_size <= GrillTable.seat_capacity at the assigned table"
          - "Venue.occupancy_freeze == false"
        side_effects:
          - "Reservation.quote_final_cents recomputed; the §1.3 settlement variant may switch from COMBINED to TIER_UP"
          - "the SUSHI and GRILL ShowPerformance rows are not rescheduled"

      - from: SEATED
        to: CLOSED
        trigger: "POST /reservations/:reservation_id/close"
        actor: Host
        preconditions:
          - "at least one ACTIVE TableSeating row references this reservation"
          - "Reservation.check_cents is fully settled"
        side_effects:
          - "every ACTIVE TableSeating row for this reservation -> VACATED"
          - "Reservation.final_bill_cents and Reservation.check_cents recomputed per §1.3 settlement"
          - "Reservation.credit_applied_cents moved out of Party.loyalty_credit_cents; loyalty_credit_cents is floored at 0 and the shortfall is never charged as a negative credit"
          - "the assigned GrillTable -> SEATED -> TURNING, firing that transition's full side-effect set"
          - "a VenueLedgerEntry of kind TABLE_MINIMUM_TRUEUP is created with status POSTED when final_bill_cents < TableTier.minimum_bill_cents"

      - from: REQUESTED
        to: NO_SHOW
        trigger: "POST /reservations/:reservation_id/events (MARK_NO_SHOW)"
        actor: Host
        preconditions:
          - "clock > scheduled_time"
        side_effects:
          - "Party.no_show_count += 1"
          - "Reservation.hold_until -> null; Reservation.table_id -> null"

      - from: HELD
        to: NO_SHOW
        trigger: "POST /reservations/:reservation_id/events (MARK_NO_SHOW)"
        actor: Host
        preconditions:
          - "clock > scheduled_time + NO_SHOW_GRACE_MINUTES"
        side_effects:
          - "HOP 1 (this transition): Party.no_show_count += 1; Reservation.hold_until -> null; Reservation.table_id -> null"
          - "when Party.no_show_count reaches the NO_SHOW_RESTRICTION_COUNT constant (2), Party.status -> RESTRICTED in the same transition"
          - "HOP 2 (caused by HOP 1, i.e. by the reservation reaching NO_SHOW): every VenueLedgerEntry with status POSTED for this reservation is driven through its own POSTED -> VOIDED transition"
          - "HOP 3 (caused by HOP 2): each such VOIDED entry credits Party.loyalty_credit_cents by its positive amount"

      - from: SEATED
        to: ABANDONED
        trigger: "system cascade (Venue -> VENTILATION_HOLD)"
        actor: system
        preconditions: []
        side_effects:
          - "HOP 1 (this transition): Reservation.hold_until -> null; Reservation.table_id -> null"
          - "HOP 2 (caused by HOP 1): every TableSeating row for this reservation in ACTIVE is driven through its own ACTIVE -> VACATED transition"
          - "HOP 3 (caused by HOP 2): every VenueLedgerEntry with status POSTED for this reservation is driven through its own POSTED -> VOIDED transition"
          - "HOP 4 (caused by HOP 3): each VOIDED entry credits Party.loyalty_credit_cents by its positive amount"

      - from: ABANDONED
        to: HELD
        trigger: "POST /reservations/:reservation_id/reopen"
        actor: Host
        preconditions:
          - "Venue.status == ACTIVE"
          - "Reservation.hold_count < HOLD_MAX_COUNT"
          - "a GrillTable satisfiable by the REQUESTED -> HELD preconditions exists"
        side_effects:
          - "Reservation.status -> HELD with table_id and hold_until set as on a first hold"
          - "the voided VenueLedgerEntry rows stay VOIDED; fresh SEAT_SURCHARGE entries are posted on the next SEAT"

  # ---------------------------------------------------------------------------
  - entity: TableSeating
    field: status
    initial_state: ACTIVE
    terminal_states: [VACATED]
    transitions:
      - from: ACTIVE
        to: VACATED
        trigger: "cascade (GrillTable -> TURNING, Reservation -> CLOSED, Reservation -> ABANDONED, MaintenanceWindow -> ACTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "actual_vacated_at = clock; occupied_minutes = whole minutes between seated_at and actual_vacated_at"
          - "GrillTable.guests_seated recomputed over the remaining ACTIVE rows"
          - "Venue.shortfall_turn_debt_minutes recomputed per §1.3 turn_debt"

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /seatings/:seating_id/extend"
        actor: FloorManager
        preconditions:
          - "no MaintenanceWindow overlaps the extended interval"
          - "the extended interval does not cross into another Reservation holding this table"
        side_effects:
          - "expected_vacate_at += extension_minutes"

  # ---------------------------------------------------------------------------
  - entity: MaintenanceWindow
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /maintenance-windows/:window_id/accept"
        actor: FloorManager
        preconditions:
          - "planned_start_at is not earlier than clock - MAINTENANCE_LATE_GRACE_MINUTES"
          - "no other MaintenanceWindow with the same table_id is in status ACTIVE"
          - "for GRILL_REBUILD: the target GrillTable is AVAILABLE or TURNING"
        side_effects:
          - "MaintenanceWindow.status -> ACTIVE"
          - "for VENTILATION_SERVICE: the §1.2 Venue ACTIVE -> VENTILATION_HOLD cascade fires in full"
          - "for a window with a non-null table_id: GrillTable.status -> MAINTENANCE with maintenance_resume_at = planned_end_at"
          - "for a window with a non-null table_id: a second MaintenanceWindow of kind GRILL_REBUILD is created in status SCHEDULED against the same table_id, with planned_start_at = planned_end_at and planned_end_at = planned_end_at + GRILL_REBUILD_MINUTES"

      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /maintenance-windows/:window_id/cancel"
        actor: FloorManager
        side_effects:
          - "any MaintenanceWindow created by cascade against the same table_id -> COMPLETED"
          - "the target GrillTable is left untouched"

      - from: ACTIVE
        to: COMPLETED
        trigger: "system (POST /venues/:venue_id/run_ops)"
        actor: system
        preconditions:
          - "clock >= planned_end_at"
          - "for VENTILATION_SERVICE: Venue.hood_filter_life_index >= Venue.filter_service_threshold_index"
        side_effects:
          - "the target GrillTable -> AVAILABLE with maintenance_resume_at -> null"
          - "for VENTILATION_SERVICE: Venue.occupancy_freeze -> false and Venue.hood_filter_life_index -> 0"
          - "Venue.status -> ACTIVE when it was VENTILATION_HOLD"

      - from: ACTIVE
        to: SCHEDULED
        trigger: "POST /maintenance-windows/:window_id/reopen"
        actor: FloorManager
        preconditions:
          - "the venue holds no Reservation in status SEATED"
          - "the venue holds no MaintenanceWindow in status ACTIVE other than this one"
        side_effects:
          - "Venue.status -> ACTIVE and Venue.occupancy_freeze -> false when this was a VENTILATION_SERVICE window"
          - "the target GrillTable -> AVAILABLE with maintenance_resume_at -> null"

  # ---------------------------------------------------------------------------
  - entity: SushiTicket
    field: prep_phase
    initial_state: RAW_CUT
    terminal_states: []
    transitions:
      - from: RAW_CUT
        to: ROLLED
        trigger: "POST /sushi-tickets/:ticket_id/events (ADVANCE)"
        actor: SushiChef
        preconditions:
          - "SushiTicket.status == OPEN"
        side_effects: []

      - from: ROLLED
        to: PLATED
        trigger: "POST /sushi-tickets/:ticket_id/events (ADVANCE)"
        actor: SushiChef
        preconditions:
          - "SushiTicket.status == OPEN"
          - "clock <= SushiTicket.requested_at + SUSHI_PLATE_LATENESS_MINUTES"
        side_effects: []

      - from: PLATED
        to: PLATED
        trigger: "POST /sushi-tickets/:ticket_id/events (RESTAGE)"
        actor: SushiChef
        preconditions:
          - "the Reservation referenced by this ticket is in status SEATED"
        side_effects:
          - "requested_at += RESTAGE_PLATE_MINUTES"

      - from: PLATED
        to: RAW_CUT
        trigger: "POST /sushi-tickets/:ticket_id/events (RESTART)"
        actor: SushiChef
        preconditions:
          - "clock > SushiTicket.requested_at + SUSHI_PLATE_LATENESS_MINUTES"
          - "the Reservation referenced by this ticket is in status SEATED"
        side_effects:
          - "SushiTicket.quantity is retained; the plate is remade from raw"

  # ---------------------------------------------------------------------------
  - entity: VenueLedgerEntry
    field: status
    initial_state: POSTED
    terminal_states: []
    transitions:
      - from: POSTED
        to: VOIDED
        trigger: "system cascade (Reservation -> NO_SHOW / ABANDONED) or POST /ledger-entries/:entry_id/void"
        actor: system
        preconditions: []
        side_effects:
          - "Party.loyalty_credit_cents += amount_cents when amount_cents > 0"

      - from: VOIDED
        to: POSTED
        trigger: "POST /reservations/:reservation_id/reopen"
        actor: Host
        preconditions:
          - "the Reservation referenced by this entry is in status HELD"
          - "this entry was voided by the ABANDONED cascade, not by an explicit void"
        side_effects:
          - "Party.loyalty_credit_cents -= amount_cents when amount_cents > 0"

  # ---------------------------------------------------------------------------
  - entity: ProteinTicket
    field: status
    initial_state: POSTED
    terminal_states: [VOIDED]
    transitions:
      - from: POSTED
        to: POSTED
        trigger: "POST /protein-tickets/:ticket_id/variance"
        actor: "Chef, FloorManager"
        preconditions:
          - "issued_grams + delta_grams >= 1"
          - "issued_grams + delta_grams <= standard_grams + PROTEIN_VARIANCE_CAP_GRAMS"
        side_effects:
          - "issued_grams += delta_grams; variance_grams = issued_grams - standard_grams"
          - "ProteinTicket.cost_cents recomputed; Venue.protein_cost_cents recomputed"
          - "ChefAssignment.pounds_protein_issued recomputed"

      - from: POSTED
        to: VOIDED
        trigger: "POST /protein-tickets/:ticket_id/events (VOID)"
        actor: Chef
        preconditions: []
        side_effects:
          - "Venue.protein_cost_cents recomputed excluding this ticket"
          - "ChefAssignment.pounds_protein_issued recomputed excluding this ticket"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: hold-grant-stale-table
    parent_entity: GrillTable
    write_endpoint: "POST /reservations/:reservation_id/holds"
    occ_field: "expected_table_version"
    description: |
      Granting a hold against a GrillTable whose version has advanced since the
      client last observed it is rejected: the client's view of the table's
      capacity and occupants is stale, and the hold it computed from that view
      cannot be honoured under the table's current state.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: chef-clockin-stale-venue
    parent_entity: Venue
    write_endpoint: "POST /chefs/:chef_id/events"
    occ_field: "expected_venue_version"
    description: |
      A chef clocking in against a Venue whose version has advanced since the
      floor last read it is rejected, because the rotation pointer the client
      computed its sequence_index from is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: close-check-stale-reservation
    parent_entity: Reservation
    write_endpoint: "POST /reservations/:reservation_id/close"
    occ_field: "expected_reservation_version"
    description: |
      Closing a Reservation whose version has advanced since the closing client
      read it is rejected, because the party size and the quote the check was
      computed from are stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # --- Rule 1 / Rule 2: dual-variant settlement -------------------------------
  - name: settlement
    trigger: "Reservation SUBMIT, every hold grant, party-size change, MARK_NO_SHOW, ABANDONED cascade, every GRILL show FINISH, TableSeating VACATED, and CLOSE"
    algorithm: threshold
    formula: |
      GUESTS_BILLED(tier) = min(party_size, GUESTS_BILLED_CAP)
      ENTITLEMENT(tier)   = party_size * TableTier(tier).base_rate_per_guest_cents
      SECURED             = sum of TableTier(t).minimum_bill_cents over the set
                            T = { distinct TABLE_TIER Reservation rows that share this
                                  episode's non-null invite_code and hold_until > clock }
                            (T is empty when invite_code is null)
      P_cap               = TableTier(tier).seat_capacity * TableTier(tier).base_rate_per_guest_cents
      P_fee               = CELEBRATION_FEE_CENTS * CELEBRATION_TIER_MULTIPLIER[celebrations present]
                            where celebrations present = [own celebration, plus every
                            celebration on a Party_Row in T]
      P                   = min(P_cap, ENTITLEMENT(tier) + P_fee)
      The tier's minimum_bill_cents is NOT a floor under P — it is enforced afterwards,
      by the table_minimum_trueup calculation, so that a small party can fall under the
      minimum and attract a true-up.
      OTHER               = sum of TableTier(o).base_rate_per_guest_cents * min(Party_Row.party_size,
                            GUESTS_BILLED_CAP) over every Party_Row in T
                            minus this reservation's OWN share when this reservation is
                            itself in T, so this row is counted once and only once
      SushiAmount         = sum of SushiTicket(quantity * unit_price_cents) where
                            SushiTicket.reservation_id == this row's id and status == OPEN
      COMPLIMENT          = COMPLIMENT_CREDIT_CENTS when EVERY Party_Row in T has
                            loyalty_tier == PLATINUM, else 0
      CASE A (T empty)      base = max(0, P)
      CASE B (SECURED < P)  base = max(0, max(SECURED + SushiAmount + OTHER, P))
      CASE C (SECURED >= P) base = max(0, min(SECURED, P))
      final_bill_cents = base - COMPLIMENT
      check_cents      = final_bill_cents + seat_surcharge_cents - credit_applied_cents + trueup_cents
      The four terms of check_cents are evaluated left to right and each is already an
      integer cent amount; no rounding is applied at this step. trueup_cents is the
      value the table_minimum_trueup calculation produces for this booking.
    input_set: "Own row plus every other TABLE_TIER Reservation at the same venue sharing invite_code with hold_until > clock. NO_SHOW, ABANDONED and CLOSED rows are excluded from T."
    constants:
      GUESTS_BILLED_CAP: 3
      COMPLIMENT_CREDIT_CENTS: 500
      CELEBRATION_FEE_CENTS: 900
      CELEBRATION_TIER_MULTIPLIER: { NONE: 0.0, BIRTHDAY: 1.0, ANNIVERSARY: 1.0, GRADUATION: 1.2, CORPORATE: 1.5 }
    precision: "integer cents; no rounding at any step"
    variants:
      - name: quote
        when: "the booking is in DRAFT, REQUESTED or HELD"
        difference: "P_fee is dropped and P is recomputed as min(P_cap, ENTITLEMENT(tier)); P_cap is unchanged. A booking with a non-NONE celebration therefore quotes strictly lower than the final bill of the same inputs whenever ENTITLEMENT(tier) + P_fee still sits under P_cap. Written to Reservation.quote_final_cents."
      - name: final
        when: "a GRILL show FINISHes, a TableSeating row VACATEDs, or the reservation is CLOSED"
        difference: "adds P_fee and returns the base figure; written to Reservation.final_bill_cents, and check_cents = final_bill_cents + seat_surcharge_cents - credit_applied_cents."

  - name: protein_cost
    trigger: "GRILL show START, ProteinTicket variance adjustment, ProteinTicket VOID, GrillTable TURNING"
    algorithm: continuous_accumulation
    formula: |
      cost_cents = sum over ProteinTicket rows with status POSTED at this venue of
                   round_half_up(ProteinTicket.issued_grams * PROTEIN_COST_CENTS_PER_GRAM)
                   rounded half up at 2 decimal places
      ProteinTicket.cost_cents = round_half_up(ProteinTicket.issued_grams * PROTEIN_COST_CENTS_PER_GRAM)
      variance_grams = ProteinTicket.issued_grams - ProteinTicket.standard_grams
    input_set: "ProteinTicket rows with status POSTED only; VOIDED rows are excluded from the venue rollup and from ChefAssignment.pounds_protein_issued."
    constants:
      PROTEIN_COST_CENTS_PER_GRAM: 4.0
      PROTEIN_GRAM_COST_CONTROL_PCT: 0.05
    precision: "2 decimal places, round_half_up"
    variants:
      - name: posted
        when: "invoked when a GRILL show FINISHes"
        difference: "rolls up every ProteinTicket at the venue with status POSTED, including tickets whose standard was later adjusted upward by a variance call and excluding every VOIDED ticket."
      - name: settled
        when: "invoked when the venue's last table leaves TURNING"
        difference: "additionally folds each ticket's variance_grams into the per-guest cost report as an integer gram count and adds PROTEIN_GRAM_COST_CONTROL_PCT * cost_cents as the control allowance; this variant lives only on the read endpoint GET /venues/{id}/protein-cost-report and is never persisted into Venue.protein_cost_cents."

  # --- Rule 2 (mode b), Rule 6, Rule 9 ----------------------------------------
  - name: table_minimum_trueup
    trigger: "Reservation CLOSE, when final_bill_cents < TableTier.minimum_bill_cents"
    algorithm: threshold
    formula: |
      SHORTFALL_raw = max(0, TableTier.minimum_bill_cents - Reservation.final_bill_cents)
      if   SHORTFALL_raw == 0                        -> band_cents = 0
      elif SHORTFALL_raw <= SHORTFALL_BAND_1_CENTS   -> band_cents = SHORTFALL_FACTOR_BAND_1 * SHORTFALL_raw
      elif SHORTFALL_raw <= SHORTFALL_BAND_2_CENTS   -> band_cents = SHORTFALL_FACTOR_BAND_2 * SHORTFALL_raw
      else                                           -> band_cents = SHORTFALL_FACTOR_BAND_3 * SHORTFALL_BAND_2_CENTS
      trueup_cents = ceil(band_cents / TABLE_MINIMUM_TRUEUP_ROUND_INCREMENT_CENTS) * TABLE_MINIMUM_TRUEUP_ROUND_INCREMENT_CENTS
      The ceiling is applied ONCE, to the band result, before the value is written. Both
      of the following are explicitly NOT the pinned order:
        (i)  ceiling each guest's share and summing the ceilings
             (for a 1200-cent shortfall on four guests that yields 4 * 200 == 800);
        (ii) ceiling the band before applying the factor.
      The pinned order yields ceil(720 / 25) * 25 == 725 for that same shortfall.
      Note the band factor rises with the shortfall, and the top band uses the
      SHORTFALL_FACTOR_BAND_3 factor against the fixed SHORTFALL_BAND_2_CENTS ceiling,
      so band_cents jumps discontinuously as SHORTFALL_raw crosses SHORTFALL_BAND_2_CENTS.
      Materialised as a VenueLedgerEntry of kind TABLE_MINIMUM_TRUEUP with status POSTED.
    input_set: "Evaluated only during CLOSE; no reservation status is excluded from the true-up."
    constants:
      SHORTFALL_BAND_1_CENTS: 1000
      SHORTFALL_BAND_2_CENTS: 2000
      SHORTFALL_FACTOR_BAND_1: 0.50
      SHORTFALL_FACTOR_BAND_2: 0.60
      SHORTFALL_FACTOR_BAND_3: 0.75
      TABLE_MINIMUM_TRUEUP_ROUND_INCREMENT_CENTS: 25
    precision: "integer cents, ceiling to the next multiple of 25"

  - name: seat_surcharge
    trigger: "Reservation SEAT and Reservation CLOSE"
    algorithm: tiered_pricing
    formula: |
      raw_cents = TableTier.base_rate_per_guest_cents * GUESTS_BILLED / (party_size + 1)
      where GUESTS_BILLED = min(party_size, GUESTS_BILLED_CAP)
      seat_surcharge_cents = ceil(raw_cents / SURCHARGE_ROUNDING_INCREMENT_CENTS) * SURCHARGE_ROUNDING_INCREMENT_CENTS
      The ceiling is applied per reservation, not per guest.
    input_set: "Every reservation, independent of payment_mode and of loyalty_tier; reservations in status NO_SHOW or ABANDONED have the surcharge reversed by the VOIDED ledger cascade rather than by this calculation."
    constants:
      GUESTS_BILLED_CAP: 3
      SURCHARGE_ROUNDING_INCREMENT_CENTS: 25
    precision: "integer cents, ceiling to the next multiple of 25"

  # --- Rule 2 (mode c): circular-looking dependency with pinned evaluation order
  - name: credit_application
    trigger: "Reservation CLOSE"
    algorithm: constraint_propagation
    formula: |
      This calculation reads Reservation.check_cents, which the settlement calculation
      defines in terms of credit_applied_cents. Evaluation order is pinned: check_cents
      is FIRST evaluated with credit_applied_cents fixed at the reservation's stored
      value, and only then is credit_applied_cents recomputed and check_cents
      re-evaluated exactly once. The cap term is defined over the first evaluation and
      MUST NOT be re-derived from the second.
      CREDIT_MAX_cents = floor(min(CREDIT_CAP_CENTS, CREDIT_CAP_PCT * check_before_credit_cents))
      credit_applied_cents = min(Party.loyalty_credit_cents, credit_to_apply_cents, CREDIT_MAX_cents)
    input_set: "Requires Party.loyalty_tier IN {GOLD, PLATINUM}; a reservation whose party is NONE or SILVER allocates 0 credit and is rejected at priority 17 when credit_to_apply_cents > 0."
    constants:
      CREDIT_CAP_CENTS: 2500
      CREDIT_CAP_PCT: 0.12
      CREDIT_ELIGIBLE_TIERS: [GOLD, PLATINUM]
      CREDIT_MIN_AMOUNT_CENTS: 500
    precision: "integer cents; the floor is applied to the cap, never to the applied amount"

  - name: chef_rotation
    trigger: "Reservation SEAT; ChefAssignment CLOCK_IN, CLEAR_FINISH, CLOCK_OUT, ROTATE_SUPPRESS"
    algorithm: selector_policy
    formula: |
      candidate set = every ChefAssignment at this venue with status ON_STATION,
                      current_table_id == null, and (no FINISHED show yet at this venue
                      or minutes_since_show >= MIN_CHEF_RESET_MINUTES)
      ranking key   = (-station_bonus, minutes_since_show DESC, sequence_index ASC, chef_name ASC)
                      where station_bonus = SHORT_TABLE_BONUS when the target GrillTable's
                      tier_code is T2 or T4, else 0
      tie-break     = chef_name ascending (a canonical field, never id)
      fallback      = an empty candidate set is deferred, not failed: the request is
                      rejected with ERR_CHEF_ROTATION_EXHAUSTED and nothing is queued
                      server-side
    input_set: "ChefAssignment rows at the same venue only; OFF_SHIFT and CLEARING chefs are excluded from the candidate set entirely."
    constants:
      MIN_CHEF_RESET_MINUTES: 3
      SHORT_TABLE_BONUS: 80
    precision: "integer ordering key; no rounding"

  - name: protein_portion_standard
    trigger: "GRILL show START"
    algorithm: threshold
    formula: |
      standard_grams = guest_count * TableTier.protein_gram_standard
      where guest_count = sum of TableSeating.guest_count over ACTIVE rows at the
      show's table
      issued_grams    = standard_grams - floor(standard_grams / PROTEIN_PORTS_PER_GUEST / GUEST_PORT_SHARE_DIVISOR)
      ports_per_guest = floor(issued_grams / PROTEIN_GRAM_PORT_SIZE)
      variance_grams  = issued_grams - standard_grams
      An adjustment call may raise issued_grams by at most PROTEIN_VARIANCE_CAP_GRAMS
      above standard_grams.
    input_set: "One row per GRILL show; the table's ACTIVE TableSeating rows at the instant the show STARTs, which may exceed one when separate parties share the grill."
    constants:
      PROTEIN_PORTS_PER_GUEST: 1
      GUEST_PORT_SHARE_DIVISOR: 4
      PROTEIN_GRAM_PORT_SIZE: 30
      PROTEIN_VARIANCE_CAP_GRAMS: 40
    precision: "integer grams; floor division only, no rounding"

  - name: sushi_plating
    trigger: "SushiTicket ADVANCE (ROLLED -> PLATED) and RESTART (PLATED -> RAW_CUT)"
    algorithm: chronological
    formula: |
      advance_delta_minutes = max(
        SUSHI_ADVANCE_MINUTES,
        GRILL_START_LEAD_MINUTES - floor(GRILL_START_LEAD_MINUTES / SUSHI_LEAD_DIVISOR),
        LATE_GRILL_THRESHOLD_MINUTES + LATE_EARLY_GRILL_DEBT_MINUTES)
      A ticket may advance ROLLED -> PLATED only while clock <= requested_at +
      SUSHI_PLATE_LATENESS_MINUTES; once the clock passes that instant the only legal
      move is PLATED -> RAW_CUT, i.e. restart from raw.
      ChefAssignment.minutes_since_show = max(0, clock - actual_start_at of the chef's
      most recent FINISHED show) in whole minutes, and resets to 0 when that show FINISHes.
    input_set: "SushiTicket rows with status OPEN only; VOIDED tickets are frozen at their current prep_phase."
    constants:
      SUSHI_ADVANCE_MINUTES: 6
      GRILL_START_LEAD_MINUTES: 9
      SUSHI_LEAD_DIVISOR: 3
      LATE_GRILL_THRESHOLD_MINUTES: 6
      LATE_EARLY_GRILL_DEBT_MINUTES: 3
      SUSHI_PLATE_LATENESS_MINUTES: 8
    precision: "whole minutes; floor division"

  - name: course_timing
    trigger: "GRILL show START, DESSERT show FINISH, CELEBRATION show START, system run_ops"
    algorithm: chronological
    formula: |
      planned_minute = LATE_GRILL_THRESHOLD_MINUTES if scheduled_time.minute < HOURLY_TRIGGER_MINUTE else HOURLY_TRIGGER_MINUTE
      planned_start_at = scheduled_time with .minute replaced by planned_minute and .second/.microsecond = 0
      hard_cap_minute  = scheduled_time.minute + EARLY_GRILL_TOLERANCE_MINUTES
      late_minutes     = max(0, (actual_start_at - planned_start_at) in whole minutes)
      Venue.shortfall_turn_debt_minutes += LATE_EARLY_GRILL_DEBT_MINUTES   when late_minutes >  LATE_GRILL_THRESHOLD_MINUTES
      Venue.shortfall_turn_debt_minutes += LATE_EARLY_CHEF_DEBT_MINUTES    when actual_start_at < planned_start_at - EARLY_GRILL_TOLERANCE_MINUTES
      planned_start_at.minute MUST remain <= hard_cap_minute, otherwise the plan is
      rejected before it is scheduled.
      Sequencing: SUSHI finishes before GRILL starts; GRILL finishes before DESSERT
      starts; DESSERT finishes before CELEBRATION starts. The CELEBRATION row does not
      exist until the DESSERT row STARTS, so a booking never carries a CELEBRATION row
      while its DESSERT row is still PLANNED.
    input_set: "ShowPerformance rows at the venue whose status is not SKIPPED; rows that were SKIPPED contribute nothing to late_minutes and nothing to the turn-debt accumulation."
    constants:
      HOURLY_TRIGGER_MINUTE: 35
      LATE_GRILL_THRESHOLD_MINUTES: 6
      EARLY_GRILL_TOLERANCE_MINUTES: 10
      LATE_EARLY_GRILL_DEBT_MINUTES: 3
      LATE_EARLY_CHEF_DEBT_MINUTES: 2
      SHOW_UNDERRUN_TOLERANCE_MINUTES: 4
    precision: "whole minutes"

  - name: turn_over_window
    trigger: "TableSeating create (SEAT); GrillTable TURNING"
    algorithm: interval_merge
    formula: |
      scheduled_time = the instant passed to SEAT, snapped to the nearest earlier
      5-minute grid instant
      start_instant  = scheduled_time + floor(GRID_SNAP_MINUTES / TURN_DEBT_BUCKET_WIDTH_MINUTES) * TURN_DEBT_BUCKET_WIDTH_MINUTES
      expected_vacate_at = start_instant + TableTier.turn_time_standard_minutes
                           when Reservation.celebration == NONE
                         = start_instant + TableTier.turn_time_celebration_minutes
                           when Reservation.celebration != NONE
      A seating is a half-open interval [seated_at, expected_vacate_at); two seatings
      whose intervals merely abut (the earlier one's expected_vacate_at equals the
      later one's seated_at) do NOT conflict on a shared table.
    input_set: "One TableSeating row per reservation per SEAT; a reservation already holding an ACTIVE TableSeating row is rejected at priority 25 before this calculation runs."
    constants:
      GRID_SNAP_MINUTES: 5
      TURN_DEBT_BUCKET_WIDTH_MINUTES: 5
    precision: "whole minutes; every instant lands on the 5-minute grid"

  - name: turn_debt
    trigger: "GrillTable TURNING (TableSeating VACATED) and system run_ops batch sweep"
    algorithm: waterfall_allocation
    formula: |
      bucket_index      = min(SHORTFALL_LETTER_COUNT - 1, floor(shortfall_minutes / TURN_DEBT_BUCKET_WIDTH_MINUTES))
      base_minutes      = SHORTFALL_BUCKET_MINUTES[bucket_index]
      burst_multiplier  = BURST_TURN_DEBT_FACTOR_PCT / 100 when every table at the venue is
                          in TURNING at the same clock instant, else 1
      Venue.shortfall_turn_debt_minutes += round_half_up(base_minutes * burst_multiplier)
      Hard cap: Venue.shortfall_turn_debt_minutes is recomputed from the closed seating
      rows on every write and is never allowed to exceed MAX_TURN_DEBT_ADD_MINUTES
      multiplied by the count of CLOSED reservations at the venue.
      The sweep allocates the venue's SHORTFALL_CAPACITY_MINUTES pool across the closed
      seatings in bucket order, filling bucket 0 before bucket 1 and so on; the remainder
      that does not fill the last bucket is allocated whole, with no fractional carry, and
      ties inside a bucket are broken by reservation_id ascending (a canonical key, never id).
    input_set: "TableSeating rows with status VACATED at this venue whose shortfall_minutes > 0; ACTIVE rows and rows with shortfall_minutes == 0 are excluded from the sweep entirely."
    constants:
      TURN_DEBT_BUCKET_WIDTH_MINUTES: 5
      BURST_TURN_DEBT_FACTOR_PCT: 150
      SHORTFALL_CAPACITY_MINUTES: 480
      SHORTFALL_LETTER_COUNT: 20
      SHORTFALL_BUCKET_MINUTES: [3, 3, 4, 4, 5, 5, 6, 6, 7, 7, 8, 8, 9, 9, 10, 10, 11, 11, 12, 12]
    precision: "whole minutes, round_half_up"

  - name: restaurant_charge
    trigger: "system run_ops batch sweep, once per venue per epoch"
    algorithm: weighted_scoring
    formula: |
      billable_guest_count = sum over tables of min(GrillTable.seat_capacity, ASSIGNABLE_GUEST_CAP)
      restaurant_charge_cents = billable_guest_count * ASSIGNMENT_FEE_CENTS
      ASSIGNMENT_FEE_MULTIPLIER is evaluated as MEDIUM when 50 <= billable_guest_count <= 70,
      LOW below 50 and HIGH above 70; the charge is recomputed from scratch on each epoch,
      not accumulated, so a venue whose guest count is unchanged across two epochs is
      charged the identical amount both times and drift is exactly zero.
    input_set: "Every GrillTable at the venue whose tier status is ACTIVE, independent of the table's own status; tables in MAINTENANCE are still counted."
    constants:
      ASSIGNMENT_FEE_CENTS: 299
      ASSIGNABLE_GUEST_CAP: 12
      ASSIGNMENT_FEE_MULTIPLIER: { LOW: 0.90, MEDIUM: 1.00, HIGH: 1.20 }
    precision: "integer cents; every per-table product is a whole number before summing"

  - name: venue_cost_report
    trigger: "GET /venues/:venue_id/cost-report"
    algorithm: aggregation
    formula: |
      billable_guest_count = sum over tables of min(GrillTable.seat_capacity, ASSIGNABLE_GUEST_CAP)
      venue_cost_cents = ceil(sum of per-table product / ROUNDING_INCREMENT_CENTS) * ROUNDING_INCREMENT_CENTS
      where per-table product = TableTier.base_rate_per_guest_cents * TableTier.protein_gram_standard
      The ceiling is applied to the summed total once, never per table. The same inputs
      computed as sum of ceil(per-table product) differ by the rounding spread.
    input_set: "Every GrillTable at the venue whose tier is in READY_TIER_CODES; this read never persists its result."
    constants:
      ROUNDING_INCREMENT_CENTS: 100
      ASSIGNABLE_GUEST_CAP: 12
      READY_TIER_CODES: [T2, T4, T6, T8]
    precision: "integer cents, ceiling to the next multiple of 100"

  # --- Rule 8: second overlap family on a different resource -------------------
  - name: sushi_plate_dwell
    trigger: "SushiTicket ADVANCE (ROLLED -> PLATED) and RESTAGE; GET /sushi-tickets"
    algorithm: interval_merge
    formula: |
      A plated ticket occupies the sushi counter for the CLOSED interval
      [requested_at, requested_at + PLATE_DWELL_MINUTES] — both ends inclusive, which is
      the opposite convention from the grill table's half-open seating interval.
      Capacity on the counter is 1, so a ticket whose interval touches an already-
      occupying ticket's interval at ANY point, including a single shared instant, is
      rejected at priority 27 as ERR_SUSHI_PLATE_LATE. In particular a second plating at
      exactly requested_at + PLATE_DWELL_MINUTES of the first is rejected; it must begin
      strictly later. A RESTAGE moves
      requested_at forward by RESTAGE_PLATE_MINUTES and therefore rebuilds the interval
      rather than extending it.
    input_set: "SushiTicket rows with status OPEN and prep_phase == PLATED; tickets with status VOIDED release their capacity immediately."
    constants:
      PLATE_DWELL_MINUTES: 5
      SUSHI_COUNTER_SEAT_CAPACITY: 1
      SUSHI_PLATE_LATENESS_MINUTES: 8
      RESTAGE_PLATE_MINUTES: 5
    precision: "whole minutes"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and the role is one of the declared §1.7 roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /venues and POST /_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "The acting role is permitted for this operation; an entity_backed role may only act on resources whose owning foreign key equals its X-User-ID"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Every id in the path and every foreign key in the body resolves, checked left to right in the order the path and input list declare"
    error_id: ERR_RESERVATION_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id (POST /venues and POST /_clock/set_current_utc excluded); the first unresolvable segment determines which sibling is returned — ERR_VENUE_NOT_FOUND, ERR_PARTY_NOT_FOUND, ERR_TIER_NOT_FOUND, ERR_TABLE_NOT_FOUND, ERR_RESERVATION_NOT_FOUND, ERR_SEATING_NOT_FOUND, ERR_CHEF_NOT_FOUND, ERR_SHOW_NOT_FOUND, ERR_MAINTENANCE_WINDOW_NOT_FOUND, ERR_SUSHI_TICKET_NOT_FOUND, ERR_LEDGER_ENTRY_NOT_FOUND or ERR_PROTEIN_TICKET_NOT_FOUND"

  - priority: 4
    category: state
    check: "The target resource is in a state from which the requested transition is declared"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transition endpoints"

  - priority: 5
    category: business_temporal
    check: "scheduled_time is exactly on the 5-minute grid and no further than the BOOKING_HORIZON_MINUTES constant (20160 minutes) from the current clock"
    error_id: ERR_BOOKING_HORIZON_EXCEEDED
    http_status: 422
    applies_to: "Reservation SUBMIT, MaintenanceWindow create"

  - priority: 6
    category: business_temporal
    check: "The interval the request would occupy does not overlap an existing or accepted MaintenanceWindow on the same resource"
    error_id: ERR_MAINTENANCE_CONFLICT
    http_status: 409
    applies_to: "Reservation hold grant, Reservation SEAT, MaintenanceWindow accept, TableSeating extend"

  - priority: 7
    category: business_fiscal
    check: "The chosen TableTier exists, is not RETIRED, and its seat_capacity * over_capacity_ratio is at least the party size"
    error_id: ERR_TIER_MISMATCH
    http_status: 422
    applies_to: "Reservation create, Reservation SUBMIT, Reservation hold grant, party-size change"

  - priority: 8
    category: business_constraint
    check: "The guests to be seated do not exceed the seat capacity of the target grill table"
    error_id: ERR_TABLE_OVER_CAPACITY
    http_status: 409
    applies_to: "Reservation hold grant, Reservation SEAT, party-size change"

  - priority: 9
    category: business_constraint
    check: "hold_count is below HOLD_MAX_COUNT = 3 for this booking episode"
    error_id: ERR_HOLD_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "Reservation hold grant, Reservation reopen"

  - priority: 10
    category: business_temporal
    check: "The hold window the request depends on has not yet closed at the current clock"
    error_id: ERR_HOLD_WINDOW_CLOSED
    http_status: 409
    applies_to: "Reservation SEAT"

  - priority: 11
    category: business_referential
    check: "Every TABLE_TIER Reservation sharing this invite_code has hold_until > clock and scheduled_time within PRIOR_HOLD_GRACE_MINUTES of this reservation's"
    error_id: ERR_SHARED_SPLIT_INVALID
    http_status: 422
    applies_to: "Reservation hold grant"

  - priority: 12
    category: business_safety
    check: "The venue is not in VENTILATION_HOLD and its occupancy_freeze is false"
    error_id: ERR_VENTILATION_FREEZE
    http_status: 409
    applies_to: "Reservation hold grant, Reservation SEAT, ChefAssignment CLOCK_IN"

  - priority: 13
    category: business_constraint
    check: "A ChefAssignment exists in ON_STATION status with current_table_id null and minutes_since_show at or above MIN_CHEF_RESET_MINUTES"
    error_id: ERR_CHEF_ROTATION_EXHAUSTED
    http_status: 409
    applies_to: "Reservation SEAT"

  - priority: 14
    category: state
    check: "The prerequisite course phase for this show has reached FINISHED"
    error_id: ERR_SHOW_DEPENDENCY
    http_status: 409
    applies_to: "ShowPerformance START"

  - priority: 15
    category: business_constraint
    check: "The measured show duration meets the tier's chef_show_minutes less SHOW_UNDERRUN_TOLERANCE_MINUTES"
    error_id: ERR_SHOW_UNDERRUN
    http_status: 409
    applies_to: "ShowPerformance FINISH"

  - priority: 16
    category: business_constraint
    check: "The requested protein issue does not exceed standard_grams plus PROTEIN_VARIANCE_CAP_GRAMS, and never falls below 1 gram"
    error_id: ERR_PROTEIN_VARIANCE_EXCEEDED
    http_status: 422
    applies_to: "ProteinTicket variance adjustment"

  - priority: 17
    category: business_fiscal
    check: "Party.loyalty_tier is GOLD or PLATINUM when credit_to_apply_cents is greater than 0"
    error_id: ERR_CREDIT_INELIGIBLE
    http_status: 422
    applies_to: "Reservation CLOSE"

  - priority: 18
    category: business_fiscal
    check: "credit_to_apply_cents is 0 or at least CREDIT_MIN_AMOUNT_CENTS"
    error_id: ERR_CREDIT_BELOW_MINIMUM
    http_status: 422
    applies_to: "Reservation CLOSE"

  - priority: 19
    category: business_fiscal
    check: "credit_to_apply_cents is not greater than min(CREDIT_CAP_CENTS, CREDIT_CAP_PCT * check_cents)"
    error_id: ERR_CREDIT_OVER_CAP
    http_status: 422
    applies_to: "Reservation CLOSE"

  - priority: 20
    category: business_fiscal
    check: "Party.loyalty_credit_cents covers credit_to_apply_cents"
    error_id: ERR_CREDIT_EXCEEDED
    http_status: 402
    applies_to: "Reservation CLOSE"

  - priority: 22
    category: business_referential
    check: "Party.status is ACTIVE"
    error_id: ERR_PARTY_RESTRICTED
    http_status: 403
    applies_to: "Reservation SUBMIT, Reservation hold grant, Reservation SEAT"

  - priority: 23
    category: business_referential
    check: "The referenced TableTier has status ACTIVE at this venue"
    error_id: ERR_TIER_RETIRED
    http_status: 409
    applies_to: "Reservation create, Reservation SUBMIT, Reservation hold grant"

  - priority: 24
    category: business_safety
    check: "A TableSeating row is ACTIVE for this reservation when it is asked to CLOSE"
    error_id: ERR_NO_ACTIVE_SEATING
    http_status: 409
    applies_to: "Reservation CLOSE"

  - priority: 25
    category: business_constraint
    check: "The reservation does not already hold an ACTIVE TableSeating row at the target table"
    error_id: ERR_DUPLICATE_SEATING
    http_status: 409
    applies_to: "Reservation SEAT"

  - priority: 26
    category: business_temporal
    check: "The MaintenanceWindow is accepted no later than MAINTENANCE_LATE_GRACE_MINUTES after its planned_start_at, and the venue has been released from its ventilation hold where one applied"
    error_id: ERR_MAINTENANCE_WINDOW_LATE
    http_status: 409
    applies_to: "MaintenanceWindow accept, Reservation reopen"

  - priority: 27
    category: business_constraint
    check: "The plated sushi ticket's dwell interval does not overlap another plated ticket already occupying the sushi counter"
    error_id: ERR_SUSHI_PLATE_LATE
    http_status: 409
    applies_to: "SushiTicket ADVANCE to PLATED"

  - priority: 28
    category: business_safety
    check: "The acting role holds the segregation-of-duties grant this operation requires, or has been explicitly delegated it"
    error_id: ERR_SEGREGATION_VIOLATION
    http_status: 403
    applies_to: "MaintenanceWindow accept, Reservation close"

  - priority: 29
    category: business_referential
    check: "The expected parent version carried by the request matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "Reservation hold grant, ChefAssignment events, Reservation CLOSE"

  - priority: 30
    category: business_constraint
    check: "No other ChefAssignment at this venue already holds the requested station zone while on station"
    error_id: ERR_STATION_OCCUPIED
    http_status: 409
    applies_to: "ChefAssignment CLOCK_IN, ChefAssignment ROTATE_SUPPRESS"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Venue ------------------------------------------------------------------
  - method: POST
    path: "/service-floor/venues"
    description: "Open a new teppanyaki venue"
    roles: [PlatformAdmin]
    code: 201
    input: [venue_name, city_code, ventilation_zone, "filter_service_threshold_index?"]
    output: Venue
    side_effects: ["status initialized to ACTIVE, occupancy_freeze to false, hood_filter_life_index to 0, ops_epoch to 0"]

  - method: GET
    path: "/service-floor/venues"
    description: "List venues"
    roles: [PlatformAdmin, FloorManager, Host, Chef, SushiChef]
    code: 200
    input: ["city_code?", "limit?", "offset?"]
    output: Venue[]
    side_effects: []

  - method: GET
    path: "/service-floor/venues/{venue_id}"
    description: "Get one venue"
    roles: [PlatformAdmin, FloorManager, Host, Chef, SushiChef]
    code: 200
    input: []
    output: Venue
    side_effects: []

  - method: POST
    path: "/service-floor/venues/{venue_id}/run_ops"
    description: "Advance the venue's batch epoch: release expired holds, retire finished maintenance, reprice the restaurant charge"
    roles: [FloorManager]
    code: 200
    input: []
    output: Venue
    side_effects:
      - "ops_epoch incremented by 1"
      - "every HELD reservation whose hold_until <= clock -> REQUESTED and its table released"
      - "every MaintenanceWindow with status ACTIVE and clock >= planned_end_at -> COMPLETED"
      - "venue released from VENTILATION_HOLD when hood_filter_life_index >= filter_service_threshold_index and no ACTIVE window remains"
      - "restaurant_charge recomputed per §1.3 and written to Venue.restaurant_charge_cents; turn_debt sweep per §1.3"
      - "increments Venue.version by 1"

  - method: GET
    path: "/service-floor/venues/{venue_id}/cost-report"
    description: "Read the venue-wide cost report"
    roles: [PlatformAdmin, FloorManager, Host, Chef, SushiChef]
    code: 200
    input: []
    output: { venue_cost_cents: integer, billable_guest_count: integer }
    side_effects: ["venue_cost_report recomputed per §1.3; nothing persisted"]

  - method: POST
    path: "/service-floor/venues/{venue_id}/tiers/{tier_id}/retire"
    description: "Retire a table tier so no new booking may name it"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: TableTier
    side_effects:
      - "TableTier -> RETIRED; existing bookings naming the tier are unaffected"
      - "increments TableTier.version by 1"

  - method: POST
    path: "/service-floor/venues/{venue_id}/tables/{table_id}/maintenance-release"
    description: "Release a grill table from maintenance once its downtime has run"
    roles: [FloorManager]
    code: 200
    input: [expected_venue_version]
    output: GrillTable
    side_effects:
      - "GrillTable -> AVAILABLE with maintenance_resume_at cleared"
      - "the matching SCHEDULED MaintenanceWindow for this table -> COMPLETED"
      - "for a GRILL_REBUILD window, Venue.hood_filter_life_index -> 0"
      - "increments Venue.version by 1"

  - method: GET
    path: "/service-floor/venues/{venue_id}/protein-cost-report"
    description: "Read the venue's protein cost report, including the control allowance"
    roles: [PlatformAdmin, FloorManager, Host, Chef, SushiChef]
    code: 200
    input: []
    output: { protein_cost_cents: integer, control_allowance_cents: integer, variance_grams_total: integer }
    side_effects: ["protein_cost settled variant recomputed per §1.3; nothing persisted"]

