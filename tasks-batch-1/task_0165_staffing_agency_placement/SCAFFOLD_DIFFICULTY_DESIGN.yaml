  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: place_fills_order_rejects_siblings
        grounds:
          - state_machines.Submission.OFFER_EXTENDED_to_PLACED
          - state_machines.JobOrder.OPEN_to_FILLED
          - state_machines.Submission.CLIENT_REVIEW_to_REJECTED
          - state_machines.Candidate.AVAILABLE_to_ON_ASSIGNMENT
        distinguishing_aspect: |
          Depth-3+ cascade from POST /staffing/placements: place candidate (hop1: Placement created &
          Candidate->ON_ASSIGNMENT) -> the placement raises filled_count to openings & bumps JobOrder
          version, driving JobOrder OPEN->FILLED (hop2, caused by hop1) -> JobOrder FILLED auto-rejects
          the order's other non-terminal submissions with reason ORDER_FILLED (hop3, caused by hop2).
        test_recipe:
          setup:
            - "1-opening OPEN TEMP order; candidate A driven to OFFER_EXTENDED; candidate B left at CLIENT_REVIEW (a sibling submission on the same order)."
          setup_api_calls:
            - call: "POST /staffing/skills"
              payload: { code: "JAVA", category: "TECH" }
              as: Recruiter
            - call: "POST /staffing/clients"
              payload: { name: "Acme", credit_limit_cents: 100000000 }
              as: AccountManager
              captures: { cl_id: $.data.id }
            - call: "POST /staffing/job-orders"
              payload: { client_id: "${cl_id}", title: "Dev", employment_type: "TEMP", required_skill_code: "JAVA", openings: 1, bill_rate_cents: 12000, target_pay_rate_cents: 8000 }
              as: AccountManager
              captures: { jo_id: $.data.id }
