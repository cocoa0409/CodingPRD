    instances:
      - name: appeal_sustain_tier_to_claim_to_provider_adjustment_chain
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_SUSTAINED
          - state_machines.RatingCycle.UNDER_APPEAL_to_AWARDED
          - state_machines.SubsidyClaim.PAID_to_RECONCILE_REQUIRED
          - calculations.subsidy_reimbursement
          - calculations.validity_period
          - entities.Provider.fields.reimbursement_adjustment_cents
          - entities.SubsidyClaim.fields.reimbursement_cents
        distinguishing_aspect: |
          Triggering transition is Appeal UNDER_REVIEW -> SUSTAINED and the chain is
          strictly serial at depth 3: hop 1 rewrites RatingCycle.awarded_tier 4 -> 5;
          only because that tier changed does hop 2 move the already-PAID SubsidyClaim
          from PAID to RECONCILE_REQUIRED; only because that claim changed status does
          hop 3 move Provider.reimbursement_adjustment_cents 0 -> 468720 — the appeal
          action never touches the claim or the provider money field directly.
