  - rule_id: non_linear_state_machine
    instances:

      - name: case_deficiency_correction_cycle_runs_twice_then_hits_the_round_limit
        grounds:
          - state_machines.Case.FILED_to_DEFICIENT
          - state_machines.Case.DEFICIENT_to_FILED
          - entities.Case.fields.deficiency_round_count
          - entities.Case.fields.last_deficiency_issuer_user_id
          - entities.DeficiencyNotice.fields.round_number
          - validations[priority=60]
          - validations[priority=50]
        distinguishing_aspect: |
          The Case machine returns to a state it has already occupied: FILED -> DEFICIENT -> FILED ->
          DEFICIENT -> FILED, and the loop is bounded by a counter carried on the row rather than by
          the graph, so the third POST /udrp/cases/{id}/deficiency-notices from the very same FILED
          state that accepted the first two is refused with ERR_DEFICIENCY_ROUND_LIMIT (409) while
          Case.deficiency_round_count stays at 2 - the same trigger from the same state succeeds
          twice and then fails forever.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z throughout."
            - "Registrar IANA-7007 ACTIVE; domain loopcase.example under it."
            - "Complainant Loop BV (country_code FR), mutual_jurisdiction US, remedy TRANSFER."
            - "All three ComplaintGround rows present and SUFFICIENT and 150000 cents paid by COMPLAINANT, so the only thing standing between the case and clearance is the deficiency loop."
            - "Case is FILED with deficiency_round_count 0."
          setup_api_calls:
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
            - call: "POST /udrp/registrars"
              payload: { name: "Regis Seven", iana_id: "IANA-7007", contact_email: "abuse@regisseven.example", verification_response_hours: 48 }
              as: ProviderAdmin
              captures: { reg_id: "$.data.id" }
            - call: "POST /udrp/domains"
              payload: { domain_name: "loopcase.example", registrar_id: "${reg_id}", registrant_name_public: "Loop Holder", registrant_email_public: "loop@proxy.example", registration_date: "2022-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: ProviderAdmin
              captures: { dom_id: "$.data.id" }
            - call: "POST /udrp/complainants"
              payload: { legal_name: "Loop BV", country_code: "FR", email: "ip@loop.example" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { cpl_id: "$.data.id" }
            - call: "POST /udrp/cases"
              payload: { complainant_id: "${cpl_id}", domain_id: "${dom_id}", mutual_jurisdiction: "US", remedy_requested: "TRANSFER", panel_election: "SINGLE" }
              as: Complainant
              as_user_id: "${cpl_id}"
              captures: { case_id: "$.data.id" }
            - call: "POST /udrp/cases/${case_id}/grounds"
              payload: { ground_type: "TRADEMARK_RIGHTS", assertion_text: "LOOP is a registered Benelux word mark.", evidence_count: 2, similarity_claim: "IDENTICAL" }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_id}/grounds"
              payload: { ground_type: "NO_LEGITIMATE_INTEREST", assertion_text: "The registrant has no connection to the mark.", evidence_count: 1 }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_id}/grounds"
              payload: { ground_type: "BAD_FAITH", assertion_text: "The domain was parked with advertising links to competitors.", evidence_count: 2 }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_id}/fee-transactions"
              payload: { kind: "FILING_FEE", payer: "COMPLAINANT", amount_cents: 150000, reference: "WIRE-0007" }
              as: CaseManager
              as_user_id: "cm-001"
          trigger:
            - call: "POST /udrp/cases/${case_id}/deficiency-notices"
              payload: { deficiency_codes: ["MUTUAL_JURISDICTION_ABSENT"], correction_days: 5 }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { notice1_id: "$.data.id", round1: "$.data.round_number", dl1: "$.data.correction_deadline_at" }
            - call: "POST /udrp/cases/${case_id}/corrections"
              payload: { notice_id: "${notice1_id}", correction_notes: "Mutual jurisdiction consent appended." }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_id}/deficiency-notices"
              payload: { deficiency_codes: ["ILLEGIBLE_EVIDENCE_ANNEX", "MISSING_SIGNATURE"], correction_days: 5 }
              as: CaseManager
              as_user_id: "cm-002"
              captures: { notice2_id: "$.data.id", round2: "$.data.round_number" }
            - call: "POST /udrp/cases/${case_id}/corrections"
              payload: { notice_id: "${notice2_id}", correction_notes: "Legible annex and signature page filed." }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_id}/deficiency-notices"
              payload: { deficiency_codes: ["MISSING_SIGNATURE"], correction_days: 5 }
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /udrp/cases/${case_id}/compliance-clearance"
              payload: { reviewer_notes: "Both deficiency rounds cured." }
              as: CaseManager
              as_user_id: "cm-001"
          assert:
            - "DeficiencyNotice.${notice1_id}.round_number == 1 and correction_deadline_at == 2026-08-06T00:00:00Z"
            - "DeficiencyNotice.${notice1_id}.status == CURED and cured_at == 2026-08-01T00:00:00Z"
            - "DeficiencyNotice.${notice2_id}.round_number == 2 and status == CURED"
            - "After the first correction Case.${case_id}.status == FILED, the same state the first notice was issued from"
            - "After the second notice Case.${case_id}.last_deficiency_issuer_user_id == cm-002"
            - "The third POST /udrp/cases/${case_id}/deficiency-notices returns ERR_DEFICIENCY_ROUND_LIMIT with HTTP 409"
            - "Case.${case_id}.deficiency_round_count == 2 after the refused third attempt, unchanged"
            - "Case.${case_id}.status == FILED after the refused third attempt, so the failed trigger left no state change"
            - "GET /udrp/cases/${case_id}/deficiency-notices returns meta.total_count == 2"
            - "The final clearance as cm-001 succeeds because cm-002 issued the most recent notice, and Case.${case_id}.status becomes VERIFICATION_PENDING"
            - "Case.${case_id}.compliance_cleared_by_user_id == cm-001"

      - name: appointment_screening_forks_three_ways_out_of_one_nominated_state
        grounds:
          - state_machines.PanelistAppointment.NOMINATED_to_ACCEPTED
          - state_machines.PanelistAppointment.NOMINATED_to_WAIVER_PENDING
          - state_machines.PanelistAppointment.NOMINATED_to_CONFLICTED
          - calculations.panelist_conflict_score
          - calculations.load_and_population_counters
          - entities.Panelist.fields.active_case_load
        distinguishing_aspect: |
          One endpoint fired three times from three rows all in status NOMINATED lands in three
          different states with three different side-effect sets: conflict_score 0.00 -> ACCEPTED with
          Panelist.active_case_load incremented to 1, conflict_score 35.00 -> WAIVER_PENDING with the
