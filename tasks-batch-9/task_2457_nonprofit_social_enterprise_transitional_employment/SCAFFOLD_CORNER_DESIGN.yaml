# =============================================================================
# §1.9 Scaffold Corner Design - breadth coverage index for
# task_2457_nonprofit_social_enterprise_transitional_employment
#
# Sections and claim_type values come from references/claim-extraction-guide.md
# (Entities / State Machines / Calculations / Validations / Endpoints / Errors /
# RBAC / Cross-Cutting Complexity Layers / Consistency Model). Corners that
# §1.8 already asserts appear as `excluded_because:` stubs naming the §1.8
# instance; everything else carries a full, empty-DB-reachable test_recipe.
#
# Shared calendar facts used by the chains (identical to §1.8's):
#   2026-09-07 Mon, 2026-09-14 Mon, 2026-10-05 Mon, 2026-10-01 Thu.
#   The logical clock reads 2026-08-01T00:00:00Z until the first
#   POST /_clock/set_current_utc; every chain sets it explicitly.
# Standard viable line: scores 90/80/75 -> composite_viability_score 82.75,
#   training_slots_total 3, supervisor_capacity 2, subsidy_cap_cents 5000000.
# Standard BAND_A referral: 3 verified barriers, household_income_cents 100000,
#   household_size 2, 40 h available, TIER_1 partner -> eligibility_score 100.10.
# Standard graduation ladder: two 12.000-hour shifts in different ISO weeks
#   (24.000 h >= MIN_TRANSITIONAL_HOURS) plus two delivered 90-minute
#   JOB_COACHING activities (180 min, 2 sessions), then certify + graduate.
# Every numeric assert below was computed from §1.3 with Decimal/ROUND_HALF_UP.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: create_business_line_returns_computed_and_default_fields
        claim_type: creation
        grounds:
          - entities.BusinessLine
          - endpoints[POST /business-lines]
          - calculations.composite_viability_score
          - response_envelope.success
        distinguishing_aspect: |
          A single create call must return every declared BusinessLine field in one 201 body:
          the weighted composite (82.75 from 90/80/75), the DRAFT initial state, the CLOSED
          intake posture and zeroed counters. A response that omits the derived fields until a
          follow-up GET fails this claim.
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-09-07T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /business-lines"
              payload: { name: "Cafe & Catering", market_viability_score: 90, training_relevance_score: 80, mission_alignment_score: 75, training_slots_total: 3, supervisor_capacity: 2, target_gross_margin_pct: 0.2000, subsidy_cap_cents: 5000000 }
              as: ProgramDirector
              captures: { bl_id: $.data.id }
          assert:
            - "HTTP 201 and response_type == \"object\" with meta.api_request_id and meta.api_request_timestamp present"
            - "data.composite_viability_score == 82.75 (0.40*90 + 0.35*80 + 0.25*75)"
            - "data.status == \"DRAFT\" and data.intake_posture == \"CLOSED\" and data.launched_at == null"
            - "data.training_slots_total == 3, data.training_slots_filled == 0, data.supervisor_capacity == 2"
            - "data.cumulative_subsidy_cents == 0, data.quality_incident_count == 0, data.rejection_reason == null"
            - "data.subsidy_cap_cents == 5000000, data.target_gross_margin_pct == 0.2000, data.version == 1"

      - name: get_referral_partner_returns_stored_row
        claim_type: retrieval
        grounds:
          - entities.ReferralPartner
          - endpoints[GET /referral-partners/{referralPartnerId}]
        distinguishing_aspect: |
          The single-resource read must echo the stored MOU terms and the still-empty derived
          counters (conversion_rate null, not 0.0000) for the id created one call earlier.
        test_recipe:
          setup:
            - "One ReferralPartner on TIER_1 with quota 5 and no referrals yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /referral-partners"
              payload: { organization_name: "Eastside Works", mou_tier: "TIER_1", referral_quota_per_period: 5 }
              as: ProgramDirector
              captures: { rp_id: $.data.id }
          trigger:
            - call: "GET /referral-partners/${rp_id}"
              payload: {}
              as: FunderAnalyst
          assert:
            - "HTTP 200 and data.id == ${rp_id}"
            - "data.organization_name == \"Eastside Works\", data.mou_tier == \"TIER_1\", data.referral_quota_per_period == 5"
            - "data.mou_status == \"ACTIVE\", data.referrals_submitted_count == 0, data.enrolled_referral_count == 0"
            - "data.conversion_rate == null (empty denominator yields null, never 0.0000)"

      - name: list_referrals_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /referrals]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three referrals from one partner read back through limit/offset: the first page carries
          exactly 2 rows with total_count 3 and has_more true; the second page carries the
          remaining row with has_more false. total_count must count the filtered set, not the page.
        test_recipe:
          setup:
            - "One TIER_1 partner with quota 5 and exactly three SUBMITTED referrals."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /referral-partners"
              payload: { organization_name: "Eastside Works", mou_tier: "TIER_1", referral_quota_per_period: 5 }
              as: ProgramDirector
              captures: { rp_id: $.data.id }
            - call: "POST /referrals"
              payload: { referral_partner_id: "${rp_id}", candidate_reference: "CAND-001", declared_barrier_codes: ["JUSTICE_INVOLVED"], household_income_cents: 100000, household_size: 2, hours_available_per_week: 40 }
              as: ReferralPartner
              as_user_id: "${rp_id}"
            - call: "POST /referrals"
              payload: { referral_partner_id: "${rp_id}", candidate_reference: "CAND-002", declared_barrier_codes: ["HOUSING_INSTABILITY"], household_income_cents: 100000, household_size: 2, hours_available_per_week: 40 }
              as: ReferralPartner
              as_user_id: "${rp_id}"
            - call: "POST /referrals"
              payload: { referral_partner_id: "${rp_id}", candidate_reference: "CAND-003", declared_barrier_codes: ["LONG_TERM_UNEMPLOYED"], household_income_cents: 100000, household_size: 2, hours_available_per_week: 40 }
              as: ReferralPartner
              as_user_id: "${rp_id}"
          trigger:
            - call: "GET /referrals"
              payload: { referral_partner_id: "${rp_id}", limit: 2, offset: 0 }
              as: IntakeSpecialist
            - call: "GET /referrals"
              payload: { referral_partner_id: "${rp_id}", limit: 2, offset: 2 }
              as: IntakeSpecialist
          assert:
            - "first read: HTTP 200, response_type == \"array\", len(data) == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second read: len(data) == 1, total_count == 3, has_more == false, offset == 2"
            - "the three candidate_reference values across both pages are exactly CAND-001, CAND-002, CAND-003 with no duplicates"

      - name: get_work_shift_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /work-shifts/{workShiftId}]
          - errors[ERR_WORK_SHIFT_NOT_FOUND]
          - validations[priority 3]
        distinguishing_aspect: |
          A syntactically valid but unknown UUID on the single-resource read must produce the
          entity-specific 404 code with the error envelope, not a generic 404 or an empty 200.
        test_recipe:
          setup:
            - "Empty database apart from the clock call; no WorkShift row exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "GET /work-shifts/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and response_type == \"error\""
            - "data.error_id == \"ERR_WORK_SHIFT_NOT_FOUND\" and data.message is a non-empty string"

      - name: create_participant_missing_required_wage_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /participants]
          - errors[ERR_INVALID_REQUEST]
          - validations[priority 5]
        distinguishing_aspect: |
          wage_cents_per_hour has source input and no default, so omitting it must fail the schema
          check at priority 5 and write nothing - the ELIGIBLE referral must NOT move to ENROLLED.
        test_recipe:
          setup:
            - "Launched line, TIER_1 partner, one ELIGIBLE referral, one OPEN SubsidyPeriod."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /business-lines"
              payload: { name: "Cafe & Catering", market_viability_score: 90, training_relevance_score: 80, mission_alignment_score: 75, training_slots_total: 3, supervisor_capacity: 2, target_gross_margin_pct: 0.2000, subsidy_cap_cents: 5000000 }
              as: ProgramDirector
              captures: { bl_id: $.data.id }
            - call: "POST /business-lines/${bl_id}/review"
              payload: { decision: "APPROVED" }
              as: ProgramDirector
            - call: "POST /business-lines/${bl_id}/launch"
              payload: {}
              as: ProgramDirector
              captures: { bl_v: $.data.version }
            - call: "POST /referral-partners"
              payload: { organization_name: "Eastside Works", mou_tier: "TIER_1", referral_quota_per_period: 5 }
              as: ProgramDirector
              captures: { rp_id: $.data.id }
            - call: "POST /referrals"
              payload: { referral_partner_id: "${rp_id}", candidate_reference: "CAND-001", declared_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], household_income_cents: 100000, household_size: 2, hours_available_per_week: 40 }
              as: ReferralPartner
              as_user_id: "${rp_id}"
              captures: { ref1_id: $.data.id }
            - call: "POST /referrals/${ref1_id}/screen"
              payload: { decision: "ELIGIBLE", verified_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], verified_household_income_cents: 100000, verified_household_size: 2, verified_hours_available_per_week: 40 }
              as: IntakeSpecialist
            - call: "POST /subsidy-periods"
              payload: { business_line_id: "${bl_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", supervisor_hours: 40.0 }
              as: ProgramDirector
          trigger:
            - call: "POST /participants"
              payload: { referral_id: "${ref1_id}", business_line_id: "${bl_id}", expected_business_line_version: "${bl_v}" }
              as: IntakeSpecialist
              captures: { err: $.data.error_id }
            - call: "GET /referrals/${ref1_id}"
              payload: {}
              as: IntakeSpecialist
          assert:
            - "HTTP 422 and data.error_id == \"ERR_INVALID_REQUEST\""
            - "the referral read afterwards still shows status == \"ELIGIBLE\" (no ENROLLED side effect fired)"
            - "GET /business-lines/${bl_id} still reports training_slots_filled == 0 and the same version as ${bl_v}"

      - name: create_referral_partner_omitting_mou_status_applies_default
        claim_type: defaults
        grounds:
          - entities.ReferralPartner.fields.mou_status
          - entities.ReferralPartner.fields.conversion_rate
          - endpoints[POST /referral-partners]
        distinguishing_aspect: |
          mou_status is the only optional create input; omitting it must yield ACTIVE (so the
          partner can immediately submit referrals), while the derived counters start at 0 and
          conversion_rate starts at null.
        test_recipe:
          setup:
            - "Empty database apart from the clock call."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /referral-partners"
              payload: { organization_name: "Riverside Pathways", mou_tier: "TIER_3", referral_quota_per_period: 2 }
              as: ProgramDirector
              captures: { rp_id: $.data.id }
          assert:
            - "HTTP 201 and data.mou_status == \"ACTIVE\" (default applied)"
            - "data.referrals_submitted_count == 0, data.enrolled_referral_count == 0, data.conversion_rate == null"
            - "data.mou_tier == \"TIER_3\", data.referral_quota_per_period == 2, data.version == 1"

      - name: create_work_shift_computed_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.WorkShift.fields.duration_hours
          - entities.WorkShift.fields.status
          - entities.WorkShift.fields.assigned_count
          - entities.WorkShift.fields.billable_labor_cost_cents
          - endpoints[POST /work-shifts]
        distinguishing_aspect: |
          duration_hours, status, assigned_count and billable_labor_cost_cents are source:computed;
          client-supplied values for them must be ignored, so a body claiming duration_hours 99.000
          and status CLOSED still produces 12.000 / SCHEDULED.
        test_recipe:
          setup:
            - "Launched business line; no shifts yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /business-lines"
              payload: { name: "Cafe & Catering", market_viability_score: 90, training_relevance_score: 80, mission_alignment_score: 75, training_slots_total: 3, supervisor_capacity: 2, target_gross_margin_pct: 0.2000, subsidy_cap_cents: 5000000 }
              as: ProgramDirector
              captures: { bl_id: $.data.id }
            - call: "POST /business-lines/${bl_id}/review"
              payload: { decision: "APPROVED" }
              as: ProgramDirector
            - call: "POST /business-lines/${bl_id}/launch"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /work-shifts"
              payload: { business_line_id: "${bl_id}", starts_at: "2026-09-07T08:00:00Z", ends_at: "2026-09-07T20:00:00Z", trainee_capacity: 2, supervisor_user_id: "sup-1", duration_hours: 99.000, status: "CLOSED", assigned_count: 7, billable_labor_cost_cents: 12345 }
              as: ProgramDirector
              captures: { ws1_id: $.data.id }
          assert:
            - "HTTP 201 and data.duration_hours == 12.000 (recomputed from starts_at/ends_at, not 99.000)"
            - "data.status == \"SCHEDULED\" and data.assigned_count == 0 and data.billable_labor_cost_cents == null"
            - "data.quality_defect_count == 0 and data.customer_complaint_count == 0"
            - "data.customer_service_standard == \"STANDARD\" (default) and data.version == 1"

      - name: enroll_participant_stamps_system_fields_from_logical_clock
        claim_type: system_fields
        grounds:
          - entities.Participant.fields.enrolled_at
          - entities.Participant.fields.max_transitional_weeks
          - endpoints[POST /participants]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          id/created_at/updated_at/version are server-minted and enrolled_at is stamped from the
          LOGICAL clock (2026-09-07T00:00:00Z), never from wall-clock time; max_transitional_weeks
          falls back to its default 26 when omitted.
        test_recipe:
          setup:
            - "Launched line, TIER_1 partner, one ELIGIBLE referral, one OPEN SubsidyPeriod, clock 2026-09-07T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /business-lines"
              payload: { name: "Cafe & Catering", market_viability_score: 90, training_relevance_score: 80, mission_alignment_score: 75, training_slots_total: 3, supervisor_capacity: 2, target_gross_margin_pct: 0.2000, subsidy_cap_cents: 5000000 }
              as: ProgramDirector
              captures: { bl_id: $.data.id }
            - call: "POST /business-lines/${bl_id}/review"
              payload: { decision: "APPROVED" }
              as: ProgramDirector
            - call: "POST /business-lines/${bl_id}/launch"
              payload: {}
              as: ProgramDirector
              captures: { bl_v: $.data.version }
            - call: "POST /referral-partners"
              payload: { organization_name: "Eastside Works", mou_tier: "TIER_1", referral_quota_per_period: 5 }
              as: ProgramDirector
              captures: { rp_id: $.data.id }
            - call: "POST /referrals"
              payload: { referral_partner_id: "${rp_id}", candidate_reference: "CAND-001", declared_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], household_income_cents: 100000, household_size: 2, hours_available_per_week: 40 }
              as: ReferralPartner
              as_user_id: "${rp_id}"
              captures: { ref1_id: $.data.id }
            - call: "POST /referrals/${ref1_id}/screen"
              payload: { decision: "ELIGIBLE", verified_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], verified_household_income_cents: 100000, verified_household_size: 2, verified_hours_available_per_week: 40 }
              as: IntakeSpecialist
            - call: "POST /subsidy-periods"
              payload: { business_line_id: "${bl_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", supervisor_hours: 40.0 }
              as: ProgramDirector
          trigger:
            - call: "POST /participants"
              payload: { referral_id: "${ref1_id}", business_line_id: "${bl_id}", wage_cents_per_hour: 1650, expected_business_line_version: "${bl_v}" }
              as: IntakeSpecialist
              captures: { p1_id: $.data.id }
          assert:
            - "HTTP 201; data.id is a server-minted UUID with no type prefix and data.version == 1"
            - "data.created_at == data.updated_at (first write) and both read the logical clock instant 2026-09-07T00:00:00Z"
            - "data.enrolled_at == \"2026-09-07T00:00:00Z\" (logical clock, not wall-clock)"
            - "data.max_transitional_weeks == 26 (default) and data.status == \"TRANSITIONAL_EMPLOYED\""
            - "data.transitional_hours_worked == 0.000, data.support_activity_minutes == 0, data.delivered_coaching_count == 0, data.re_entry_count == 0"
            - "data.graduated_at == null, data.graduation_wage_cents_per_hour == null, data.eligible_re_entry_at == null"

      - name: create_support_activity_with_invalid_category_rejected
        claim_type: type_constraints
        grounds:
          - entities.SupportActivity.fields.category
          - entities.WorkShift.fields.ends_at
          - errors[ERR_INVALID_REQUEST]
          - validations[priority 5]
        distinguishing_aspect: |
          Enum membership and the interval ordering rule are both priority-5 schema checks: a
          category outside {JOB_COACHING, CASE_MANAGEMENT, TRANSPORT_VOUCHER, CHILDCARE_VOUCHER}
          and a shift whose ends_at is not strictly after starts_at both return ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Launched line, TIER_1 partner, ELIGIBLE referral, OPEN period, one enrolled participant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /business-lines"
              payload: { name: "Cafe & Catering", market_viability_score: 90, training_relevance_score: 80, mission_alignment_score: 75, training_slots_total: 3, supervisor_capacity: 2, target_gross_margin_pct: 0.2000, subsidy_cap_cents: 5000000 }
              as: ProgramDirector
              captures: { bl_id: $.data.id }
            - call: "POST /business-lines/${bl_id}/review"
              payload: { decision: "APPROVED" }
              as: ProgramDirector
            - call: "POST /business-lines/${bl_id}/launch"
              payload: {}
              as: ProgramDirector
              captures: { bl_v: $.data.version }
            - call: "POST /referral-partners"
              payload: { organization_name: "Eastside Works", mou_tier: "TIER_1", referral_quota_per_period: 5 }
              as: ProgramDirector
              captures: { rp_id: $.data.id }
            - call: "POST /referrals"
              payload: { referral_partner_id: "${rp_id}", candidate_reference: "CAND-001", declared_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], household_income_cents: 100000, household_size: 2, hours_available_per_week: 40 }
              as: ReferralPartner
              as_user_id: "${rp_id}"
              captures: { ref1_id: $.data.id }
            - call: "POST /referrals/${ref1_id}/screen"
              payload: { decision: "ELIGIBLE", verified_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], verified_household_income_cents: 100000, verified_household_size: 2, verified_hours_available_per_week: 40 }
              as: IntakeSpecialist
            - call: "POST /subsidy-periods"
              payload: { business_line_id: "${bl_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", supervisor_hours: 40.0 }
              as: ProgramDirector
            - call: "POST /participants"
              payload: { referral_id: "${ref1_id}", business_line_id: "${bl_id}", wage_cents_per_hour: 1650, expected_business_line_version: "${bl_v}" }
              as: IntakeSpecialist
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /support-activities"
              payload: { participant_id: "${p1_id}", category: "MENTORING", duration_minutes: 90, cost_cents: 6000 }
              as: JobCoach
              captures: { err_enum: $.data.error_id }
            - call: "POST /work-shifts"
              payload: { business_line_id: "${bl_id}", starts_at: "2026-09-07T20:00:00Z", ends_at: "2026-09-07T08:00:00Z", trainee_capacity: 2, supervisor_user_id: "sup-1" }
              as: ProgramDirector
              captures: { err_interval: $.data.error_id }
          assert:
            - "invalid enum: HTTP 422 with data.error_id == \"ERR_INVALID_REQUEST\"; no SupportActivity row is created"
            - "inverted interval: HTTP 422 with data.error_id == \"ERR_INVALID_REQUEST\"; no WorkShift row is created"
            - "GET /support-activities with participant_id ${p1_id} reports total_count == 0 afterwards"

      - name: create_placement_with_unknown_ids_returns_not_found_in_declared_order
        claim_type: parent_relationships
        grounds:
          - endpoints[POST /placements]
          - errors[ERR_EMPLOYER_NOT_FOUND]
          - errors[ERR_PARTICIPANT_NOT_FOUND]
          - validations[priority 3]
        distinguishing_aspect: |
          Priority 3 resolves body foreign keys in the order they are declared in the endpoint's
          input list (participant_id before employer_id) and runs BEFORE the priority-6 state check,
          so a TRANSITIONAL_EMPLOYED (non-graduated) participant still yields the FK 404, and a body
          with both ids unknown yields the participant code, never the employer code.
        test_recipe:
          setup:
            - "Launched line, TIER_1 partner, ELIGIBLE referral, OPEN period, one TRANSITIONAL_EMPLOYED participant, one ACTIVE employer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /business-lines"
              payload: { name: "Cafe & Catering", market_viability_score: 90, training_relevance_score: 80, mission_alignment_score: 75, training_slots_total: 3, supervisor_capacity: 2, target_gross_margin_pct: 0.2000, subsidy_cap_cents: 5000000 }
              as: ProgramDirector
              captures: { bl_id: $.data.id }
            - call: "POST /business-lines/${bl_id}/review"
              payload: { decision: "APPROVED" }
              as: ProgramDirector
            - call: "POST /business-lines/${bl_id}/launch"
              payload: {}
              as: ProgramDirector
              captures: { bl_v: $.data.version }
            - call: "POST /referral-partners"
              payload: { organization_name: "Eastside Works", mou_tier: "TIER_1", referral_quota_per_period: 5 }
              as: ProgramDirector
              captures: { rp_id: $.data.id }
            - call: "POST /referrals"
