            - { call: "POST /roadside/technicians", payload: { full_name: "Tim Tires", employee_code: "T-103", certifications: ["TIRES"], labor_rate_class: "STANDARD", home_depot_city: "Denver" }, as: OpsAdmin, captures: { t4: $.data.id } }
            - { call: "POST /roadside/technicians/${t4}/set-status", payload: { to_status: "AVAILABLE" }, as: Technician, as_user_id: "${t4}" }
            - { call: "POST /roadside/service-calls", payload: { vehicle_id: "${vehA}", caller_name: "Jo", caller_phone: "555-0111", breakdown_location_text: "US-6 mm 12", distance_miles_from_depot: 20, symptom_category: "TIRE_BLOWOUT", symptom_description: "drive tire shredded" }, as: Dispatcher, captures: { scA: $.data.id } }
            - { call: "POST /roadside/service-calls/${scA}/triage", payload: { severity: "BLOCKING" }, as: Dispatcher, captures: { scA_v: $.data.version } }
            - { call: "POST /roadside/service-calls/${scA}/dispatches", payload: { technician_id: "${t4}", window_start_at: "2026-08-05T09:00:00Z", window_end_at: "2026-08-05T12:00:00Z", planned_travel_miles: 20, expected_service_call_version: "${scA_v}" }, as: Dispatcher, captures: { dA: $.data.id } }
            - { call: "POST /roadside/service-calls", payload: { vehicle_id: "${vehB}", caller_name: "Jo", caller_phone: "555-0111", breakdown_location_text: "US-6 mm 30", distance_miles_from_depot: 30, symptom_category: "BRAKE_FAULT", symptom_description: "service brake fade" }, as: Dispatcher, captures: { scB: $.data.id } }
