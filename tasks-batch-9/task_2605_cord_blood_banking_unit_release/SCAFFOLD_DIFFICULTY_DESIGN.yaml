            - "after the rejected attempt: CordBloodUnit.${unit_wn_id}.processing_status is still VOLUME_REDUCED, tank_id null, slot_code null, cryopreserved_at null"
            - "after the rejected attempt: StorageTank.${tank_l_id}.occupied_slots == 0"
            - "freeze_at exactly at maintenance_window_end returns 200 (the interval is open on the right)"
            - "after the accepted attempt: CordBloodUnit.${unit_wn_id}.processing_status == CRYOPRESERVED, availability_status == PRIVATE_STORED, cryopreserved_at == 2026-09-11T00:00:00Z, tank_id == ${tank_l_id}, slot_code == L-01"
            - "after the accepted attempt: StorageTank.${tank_l_id}.occupied_slots == 1 and status is still ONLINE (the nightly run was never invoked, so no maintenance transition occurred)"
            - "GET /cbb/storage-tanks/${tank_l_id}/units → data has length 1"

  - rule_id: compensating_invariant
    instances:
      - name: tank_occupied_slots_conserved_across_confirm_then_cancel
        grounds:
          - calculations.tank_slot_occupancy
          - state_machines.Reservation.status.CONFIRMED_to_CANCELLED
          - state_machines.CordBloodUnit.availability_status.RESERVED_to_LISTED
          - endpoints[POST /cbb/reservations/{id}/cancel]
        distinguishing_aspect: |
          Conserved quantity: StorageTank.occupied_slots, defined as count(units in the tank whose
          availability_status is not RELEASED/DISPOSED). Confirming and then cancelling a hold walks the
          unit LISTED -> RESERVED -> LISTED and the listing ACTIVE -> MATCHED -> ACTIVE, and occupancy must
          read exactly 1 at all three observation points: a naive implementation that decrements on
          reservation or increments on cancel drifts immediately.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-11T03:00:00Z."
            - "One ONLINE STANDARD tank of capacity 5 holding exactly one PUBLIC_DONATION unit that is CRYOPRESERVED, ELIGIBLE and LISTED with an ACTIVE listing."
            - "One PENDING_CONFIRMATORY reservation on that unit holding [2026-09-01T00:00:00Z, 2026-09-05T00:00:00Z]."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/storage-tanks"
              payload: { tank_code: "TANK-M", tank_class: "STANDARD", capacity_slots: 5 }
              as: FacilitiesEngineer
              captures: { tank_m_id: "$.data.id" }
            - call: "POST /cbb/enrollments"
              payload: { program_type: "PUBLIC_DONATION", primary_parent_name: "Invariant Parent", expected_delivery_date: "2026-08-10", collection_site_code: "SITE-15", hla_typing_consent: true }
              as: IntakeCoordinator
              captures: { enr_iv_id: "$.data.id" }
            - call: "POST /cbb/enrollments/${enr_iv_id}/consent"
              payload: { consent_document_hash: "hash-iv-v1" }
              as: ParentGuardian
              as_user_id: "${enr_iv_id}"
            - call: "POST /cbb/collection-kits"
              payload: { enrollment_id: "${enr_iv_id}", kit_lot_code: "LOT-2026-I", courier_tracking_code: "TRK-1500" }
              as: IntakeCoordinator
              captures: { kit_iv_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/maternal-screenings"
              payload: { enrollment_id: "${enr_iv_id}", collected_at: "2026-08-10T05:00:00Z", hiv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", htlv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }
              as: MedicalDirector
              as_user_id: "md-001"
            - call: "POST /cbb/collections"
              payload: { kit_id: "${kit_iv_id}", collected_at: "2026-08-10T05:00:00Z", collection_volume_ml: 130.0, anticoagulant_volume_ml: 25.0, delivery_mode: "VAGINAL" }
              as: CollectionSite
              captures: { col_iv_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/collections/${col_iv_id}/receive"
              payload: { transport_temp_c: 20.0 }
              as: ProcessingTechnologist
            - call: "GET /cbb/collections/${col_iv_id}/units"
              payload: {}
              as: ProcessingTechnologist
              captures: { unit_iv_id: "$.data[0].id" }
            - call: "POST /cbb/processing-runs"
              payload: { unit_id: "${unit_iv_id}", method: "AUTOMATED_SEPARATION", pre_tnc_millions: 1650 }
              as: ProcessingTechnologist
              captures: { run_iv_id: "$.data.id" }
            - call: "POST /cbb/processing-runs/${run_iv_id}/complete"
              payload: { outcome: "COMPLETED", post_volume_ml: 25.0, post_tnc_millions: 1500 }
              as: ProcessingTechnologist
            - call: "POST /cbb/quality-tests"
              payload: { unit_id: "${unit_iv_id}", test_kind: "POST_PROCESSING", tnc_millions: 1500, cd34_thousands: 3000, viability_pct: 92.0, volume_ml: 25.0, sterility_result: "NEGATIVE" }
              as: ProcessingTechnologist
              as_user_id: "tech-001"
            - call: "POST /cbb/units/${unit_iv_id}/eligibility-determination"
              payload: {}
              as: MedicalDirector
              as_user_id: "md-001"
            - call: "POST /cbb/units/${unit_iv_id}/cryopreserve"
              payload: { tank_id: "${tank_m_id}", slot_code: "M-01", freeze_at: "2026-08-11T02:00:00Z" }
              as: ProcessingTechnologist
            - call: "GET /cbb/units/${unit_iv_id}"
              payload: {}
              as: RegistryOperator
              captures: { unit_iv_v1: "$.data.version" }
            - call: "POST /cbb/registry-listings"
              payload: { unit_id: "${unit_iv_id}", registry_code: "NMDP", hla_a: "A*02:01", hla_b: "B*08:01", hla_drb1: "DRB1*03:01", expected_unit_version: "${unit_iv_v1}" }
              as: RegistryOperator
              captures: { listing_iv_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T03:00:00Z" }
              as: PlatformAdmin
            - call: "GET /cbb/units/${unit_iv_id}"
              payload: {}
              as: TransplantCenter
              captures: { unit_iv_v2: "$.data.version" }
            - call: "POST /cbb/reservations"
              payload: { unit_id: "${unit_iv_id}", requesting_center_name: "Center Invariant", patient_weight_kg: 35.0, patient_hla_match_count: 6, hold_from: "2026-09-01T00:00:00Z", hold_until: "2026-09-05T00:00:00Z", expected_unit_version: "${unit_iv_v2}" }
              as: TransplantCenter
              as_user_id: "tc-001"
              captures: { res_iv_id: "$.data.id" }
            - call: "GET /cbb/storage-tanks/${tank_m_id}"
              payload: {}
              as: FacilitiesEngineer
              captures: { slots_before: "$.data.occupied_slots" }
          trigger:
            - call: "POST /cbb/reservations/${res_iv_id}/confirm"
              payload: { intended_transplant_date: "2026-09-03" }
              as: TransplantCenter
              as_user_id: "tc-001"
            - call: "POST /cbb/reservations/${res_iv_id}/cancel"
              payload: { reason_code: "PATIENT_DECEASED" }
              as: TransplantCenter
              as_user_id: "tc-001"
          assert:
            - "${slots_before} == 1 (baseline observation before the do/undo pair)"
            - "after the confirm: StorageTank.${tank_m_id}.occupied_slots == 1 while CordBloodUnit.${unit_iv_id}.availability_status == RESERVED and RegistryListing.${listing_iv_id}.listing_status == MATCHED"
            - "after the cancel: StorageTank.${tank_m_id}.occupied_slots == 1 — identical to ${slots_before}, no drift in either direction"
            - "after the cancel: Reservation.${res_iv_id}.status == CANCELLED with cancellation_reason_code == PATIENT_DECEASED and released_at null"
            - "after the cancel: CordBloodUnit.${unit_iv_id}.availability_status == LISTED (PUBLIC_DONATION restores to LISTED, not PRIVATE_STORED)"
            - "after the cancel: RegistryListing.${listing_iv_id}.listing_status == ACTIVE with suspension_reason_code null"
            - "after the cancel: CordBloodUnit.${unit_iv_id}.processing_status is still CRYOPRESERVED, eligibility_status is still ELIGIBLE, tank_id == ${tank_m_id} and slot_code == M-01 (the physical slot was never vacated)"
            - "GET /cbb/storage-tanks/${tank_m_id}/units → data has length 1 both before and after the do/undo pair"

      - name: account_balance_equals_unpaid_residual_across_delinquency_then_full_payment
        grounds:
          - calculations.account_balance_reconciliation
          - calculations.delinquency_stage_advance
          - state_machines.StorageInvoice.status.DELINQUENT_to_PAID
          - state_machines.StorageAccount.status.DELINQUENT_to_ACTIVE
          - endpoints[POST /cbb/storage-invoices/{id}/payments]
        distinguishing_aspect: |
          A different conserved quantity: the monetary identity StorageAccount.balance_cents == sum over the
          account's invoices of (amount_due_cents - amount_paid_cents), which must hold at issue, after each
          late-fee accrual and after settlement. Paying the residual in full also compensates the whole
          delinquency cascade — the account returns to ACTIVE and the PENDING_ABANDONMENT unit returns to
          PRIVATE_STORED — while lifetime_paid_cents is monotone and equals the amount actually paid.
        test_recipe:
          setup:
            - "Logical clock at 2027-01-01T00:00:00Z after two nightly runs."
            - "One PRIVATE_FAMILY 1-year StorageAccount whose only unit is CRYOPRESERVED in an ONLINE STANDARD tank."
            - "One full-year invoice issued 2026-09-01 (prorated_days 365) that has walked ISSUED -> PAST_DUE -> DELINQUENT, so amount_due_cents is 18775 and the unit is PENDING_ABANDONMENT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/storage-tanks"
              payload: { tank_code: "TANK-N", tank_class: "STANDARD", capacity_slots: 5 }
              as: FacilitiesEngineer
              captures: { tank_n_id: "$.data.id" }
            - call: "POST /cbb/enrollments"
              payload: { program_type: "PRIVATE_FAMILY", primary_parent_name: "Ledger Parent", expected_delivery_date: "2026-08-10", collection_site_code: "SITE-16" }
              as: IntakeCoordinator
              captures: { enr_lg_id: "$.data.id" }
