  # ---- Booking lifecycle ---------------------------------------------------
  - method: POST
    path: /festival-ops/bookings/{id}/countersign
    description: "Business affairs executes the contract once rider and advance are settled."
    roles: [BusinessAffairs]
    input: []
    output: Booking
    success_code: 200
    side_effects:
      - "requires contract_status == RIDER_SETTLED (priority 30), no BREACHED clause (priority 40) and an APPROVED AdvancePacket (priority 45)"
      - "contract_status RIDER_SETTLED -> COUNTERSIGNED"
      - "calculations.settlement_total re-derived and stamped on settlement_total_cents"

  - method: PATCH
    path: /festival-ops/bookings/{id}/guarantee-amendment
    description: "Amend the executed guarantee; rebuilds the installment pair and re-balances every ledger."
    roles: [TalentBuyer]
    input: [guarantee_cents, expected_booking_version, "production_fee_cents?", "amendment_reason?"]
    output: Booking
    success_code: 200
    side_effects:
      - "delta = new (guarantee + production_fee) - old (guarantee + production_fee)"
      - "BudgetTier.committed_cents += delta and Festival.committed_budget_cents += delta; tier status and lineup_posture re-derived, so an amendment can close a tier or freeze the festival"
      - "every PaymentInstallment with status == SCHEDULED is rebuilt by calculations.payment_schedule_build; PAID and RELEASED installments are left alone and the rebuilt SCHEDULED rows absorb the difference so installment_total_conservation still holds"
      - "settlement_total_cents re-derived; Booking.version += 1"

  - method: POST
    path: /festival-ops/bookings/{id}/cancel
    description: "Cancel a booking and run the depth-4 compensating cascade."
    roles: [TalentBuyer, BusinessAffairs]
    input: [cancelling_party, cancellation_reason]
    output: Booking
    success_code: 200
    side_effects:
      - "CASCADE-2 hop 1: contract_status ANY non-terminal -> CANCELLED; cancelled_at = clock_now; cancelling_party stamped"
      - "CASCADE-2 hop 2: BudgetTier.committed_cents -= (guarantee_cents + production_fee_cents) and slots_committed -= 1; Stage.booked_minutes -= set_length_minutes; SCHEDULED, HELD and RELEASED installments -> VOIDED; PAID installments -> CLAWBACK_PENDING; the RadiusClause -> RELEASED"
      - "CASCADE-2 hop 3: BudgetTier.status CLOSED -> OPEN when it drops back below its allocation, Festival.committed_budget_cents credited and lineup_posture re-derived (FROZEN can revert to RESTRICTED or OPEN); settlement_status -> RECOVERY_PENDING when any installment was PAID, otherwise -> RECOVERED with actual_recovered_cents = 0"
      - "CASCADE-2 hop 4: AnnouncementWave.assignment_count -= 1 (and headliner_count -= 1 for billing_position 1); a wave that reaches assignment_count 0 falls LOCKED -> PLANNED"
      - "calculations.deposit_recovery CONTRACTUAL variant stamps contractual_recovery_cents; actual_recovered_cents stays 0 until clawbacks land"
      - "Festival.headliner_anchor_count -= 1 when billing_position == 1"

  # ---- PaymentInstallment --------------------------------------------------
  - method: GET
    path: /festival-ops/bookings/{id}/payment-installments
    description: "List the booking's installments ordered by due_date ASC then created_at ASC — the exact order deposit_recovery ACTUAL_CHRONOLOGICAL replays."
    roles: [TalentBuyer, ArtistRep, BusinessAffairs, FinanceController]
    input: ["status?", "installment_type?", "limit?", "offset?"]
    output: "PaymentInstallment[]"
    success_code: 200
    side_effects: []

  - method: GET
    path: /festival-ops/payment-installments/{id}
    description: "Read one installment including released_at, paid_at and recovered_cents."
    roles: [TalentBuyer, ArtistRep, BusinessAffairs, FinanceController]
    input: []
    output: PaymentInstallment
    success_code: 200
    side_effects: []

  - method: POST
    path: /festival-ops/payment-installments/{id}/release
    description: "Finance releases an installment for payment inside its release window."
    roles: [FinanceController]
    input: []
    output: PaymentInstallment
    success_code: 200
    side_effects:
      - "requires status == SCHEDULED (priority 30), no BREACHED clause on the booking (priority 40) and clock_now >= due_date - RELEASE_WINDOW_DAYS (priority 58)"
      - "status SCHEDULED -> RELEASED; released_at = clock_now"

  - method: POST
    path: /festival-ops/payment-installments/{id}/mark-paid
    description: "Finance records the wire; advances the booking's settlement dimension."
    roles: [FinanceController]
    input: [paid_amount_cents]
    output: PaymentInstallment
    success_code: 200
    side_effects:
      - "status RELEASED -> PAID; paid_at = clock_now; paid_amount_cents stored"
      - "a DEPOSIT payment sets Booking.deposit_paid_cents += paid_amount_cents, moves settlement_status UNFUNDED -> DEPOSIT_PAID, and re-runs calculations.settlement_total (the deposit is subtracted at step 6)"
      - "a BALANCE payment moves settlement_status BALANCE_DUE -> SETTLED"

  - method: POST
    path: /festival-ops/payment-installments/{id}/clawback
    description: "Finance recovers cash from a paid installment after a cancellation."
    roles: [FinanceController]
    input: [recovered_cents]
    output: PaymentInstallment
    success_code: 200
    side_effects:
      - "requires status == CLAWBACK_PENDING (priority 30) and Booking.actual_recovered_cents + recovered_cents <= contractual_recovery_cents (priority 76)"
      - "status CLAWBACK_PENDING -> RECOVERED; recovered_cents stored"
      - "calculations.deposit_recovery ACTUAL_CHRONOLOGICAL re-derives Booking.actual_recovered_cents by replaying RECOVERED installments in due_date ASC order"
      - "settlement_status RECOVERY_PENDING -> RECOVERED once no CLAWBACK_PENDING installment remains"

