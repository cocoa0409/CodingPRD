              as: NetworkEngineer
              captures: { run_off_id: $.data.id }
            - call: "GET /service-plans/${plan_off_id}"
              payload: {}
              as: NetworkEngineer
              captures: { plan_off_v1: $.data.version }
          trigger:
            - call: "POST /performance-attestations"   # peak pool cardinality exactly 0 -> expect ERR_NO_ELIGIBLE_TEST_RUNS (409)
              payload: { plan_id: "${plan_off_id}", methodology_doc_id: "${doc_id}", metric_variant: "PEAK_HOUR_MEDIAN", expected_plan_version: "${plan_off_v1}" }
              as: NetworkEngineer
            - call: "POST /performance-attestations"   # all-hour pool cardinality 3 -> 201
              payload: { plan_id: "${plan_off_id}", methodology_doc_id: "${doc_id}", metric_variant: "ALL_HOUR_P20", expected_plan_version: "${plan_off_v1}" }
