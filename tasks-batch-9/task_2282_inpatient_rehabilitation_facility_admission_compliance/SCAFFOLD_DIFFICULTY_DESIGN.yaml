            - "TherapyWeek.${wk_a_id}.delivered_credited_minutes == 900"
            - "TherapyWeek.${wk_a_id}.qualifying_days_count == 3"
            - "TherapyWeek.${wk_a_id}.status == NOT_MET"
            - "TherapyWeek.${wk_b_id}.evaluation_mode == WEEKLY_15HR"
            - "TherapyWeek.${wk_b_id}.delivered_credited_minutes == 900"
            - "TherapyWeek.${wk_b_id}.qualifying_days_count == 3"
            - "TherapyWeek.${wk_b_id}.status == MET"
            - "Admission.${adm_a_id}.therapy_weeks_satisfied == false"
            - "Admission.${adm_b_id}.therapy_weeks_satisfied == true"
            - "Admission.${adm_a_id}.total_credited_minutes == 900"
            - "Admission.${adm_b_id}.total_credited_minutes == 900"

      - name: presumptive_vs_medical_review_compliance_variant_divergence
        grounds:
          - calculations.compliance_percentage
          - entities.ComplianceReview.fields.method
          - entities.ComplianceReview.fields.compliance_pct
          - entities.ComplianceReview.fields.outcome
          - state_machines.ComplianceReview.DRAFT_to_COMPUTED
          - concurrency_rules[compliance-review-create-stale-facility]
        distinguishing_aspect: |
          One cohort of two discharged, undocumented admissions is scored twice: the
          PRESUMPTIVE variant reads qualification off Patient.impairment_group_code and
          returns 50.00 with outcome PASS against a 50.00 threshold, while the
          MEDICAL_REVIEW variant reads Admission.compliance_class and returns 0.00 with
          outcome FAIL over the identical total_cases 2.
        test_recipe:
          setup:
            - "Facility with compliance_threshold_pct 50.00 and review period 2026-08-01..2026-08-31."
            - "Patient A impairment_group_code 0008 (member of PRESUMPTIVE_IGC_SET); patient B impairment_group_code 0950 with etiologic_diagnosis_code M17.11 and comorbidity_tier NONE (member of neither presumptive set)."
            - "Both admissions are admitted 2026-08-04T12:00:00Z and discharged 2026-08-06T12:00:00Z to COMMUNITY with no plan of care, no therapy week and no conference, so both finalize compliance_class NON_QUALIFYING."
            - "Two ComplianceReviews are opened for 2026-08-01..2026-08-31, one PRESUMPTIVE and one MEDICAL_REVIEW, each pinning the facility version read immediately beforehand."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /facilities"
