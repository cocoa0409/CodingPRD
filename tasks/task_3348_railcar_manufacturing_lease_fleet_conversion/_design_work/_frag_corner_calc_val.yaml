              captures: { accrued: $.data.per_diem_accrued_cents }
          assert:
            - "days == 2026-09-09 - 2026-09-04 == 5 and gross == 5 * 2001 == 10005, an odd number chosen so the 12-percent credit has a fractional part"
            - "util_pct == floor(5000 / 100) == 50, which equals Lessee.utilization_threshold_pct 50, so the credit is granted at the inclusive boundary"
            - "credit == floor(10005 * 12 / 100) == floor(1200.6) == 1200; rounding would give 1201, so CarAssignment.${asg_a}.per_diem_accrued_cents == ${accrued} == 8805 pins the floor"
            - "The accrued figure is a whole number of cents: 10005 - 1200 == 8805, with no fractional or half-cent residue"
            - "The mileage term is likewise integral: CarReturn.${ret_a}.mileage_overage_cents == ${over_a} == 48000 == max(0, 5000 - 1 * 1000) * 12 with blocks ceil(5 / 30) == 1"
