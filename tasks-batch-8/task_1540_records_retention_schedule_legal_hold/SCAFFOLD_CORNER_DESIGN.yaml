      - name: supersede_with_stale_version_rejected
        claim_type: violation_to_error
        grounds: ["concurrency_rules[rule-supersede-stale-head]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on the supersede target: after a first successor claims the head (target version 1 -> 2), a second supersede carrying the pre-claim version is rejected with ERR_STALE_VERSION (412) — deterministically, from two strictly sequential calls."
        test_recipe:
          setup: ["Program; class; jurisdiction; rule INC ACTIVE (version 1)"]
          setup_api_calls:
            - call: "POST /ig/programs"
              payload: { name: "P", fiscal_year_end_month: 12, fiscal_year_end_day: 31 }
              as: PlatformAdmin
              captures: { p: "$.data.id" }
