              payload: { show_id: "${sh}", title: "E1", publish_at: "2026-08-05T00:00:00Z" }
              as: AdOps
            - call: "POST /adnet/advertisers"
              payload: { name: "RevCo", category: "FINTECH" }
              as: AdOps
              captures: { adv: $.data.id }
            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${adv}", name: "CR", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 100, cpm_cents: 1000, billing_model: "ACTUAL_DELIVERY" }
              as: AdOps
              captures: { cmp: $.data.id }
            - call: "POST /adnet/ad-copies"
              payload: { campaign_id: "${cmp}", kind: "PRODUCED_AUDIO", script_text: "spot" }
              as: Advertiser
              as_user_id: "${adv}"
              captures: { cpy: $.data.id }
            - call: "POST /adnet/ad-copies/${cpy}/submit"
              as: Advertiser
              as_user_id: "${adv}"
            - call: "POST /adnet/ad-copies/${cpy}/review"
              payload: { action: "APPROVE" }
              as: AdOps
            - call: "POST /adnet/campaigns/${cmp}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/line-items"
              payload: { campaign_id: "${cmp}", show_id: "${sh}", ad_format: "PRODUCED_SPOT", position: "MID_ROLL", reserved_impressions: 100, priority: 1, ad_copy_id: "${cpy}" }
              as: AdOps
              captures: { li: $.data.id }
            - call: "POST /adnet/line-items/${li}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
          trigger:
            - call: "POST /adnet/ad-copies/${cpy}/review"
              payload: { action: "REQUEST_CHANGES", note: "legal flag" }
              as: AdOps
          assert:
            - "AdCopy.${cpy}.status == CHANGES_REQUESTED"
            - "LineItem.${li}.status == PAUSED (revocation cascade)"
            - "Show.${sh}.reserved_impressions == 0 and available_impressions == 9500 (reservation released)"

