# =============================================================================
# §1.8 Scaffold Difficulty Design — Utility Rate Case & Cost-of-Service Filing
# Test Targeting Index: 9 Difficulty Rules, 23 instances total.
# All numeric literals below were computed by executing the §1.3 formulas
# against the pinned fixture inputs.
#
# Canonical fixture (reused across instances):
#   Case: test year 2025-01-01..2025-12-31, return 750 bp, proposed RR
#         1,897,500,000, allocation COINCIDENT_PEAK.
#   Entries: E1 O_AND_M 1,000,000,000 (+50,000,000 VERIFIED adj A1),
#            E2 DEPRECIATION 400,000,000, E3 TAXES 200,000,000.
#   COS = 1,650,000,000.
#   Rate base: RB1 net 2,400,000,000 (3.0e9-5.0e8+1.0e8-2.0e8),
#              RB2 net 900,000,000 (1.0e9-1.0e8).
#   RR as_filed   = 1,650,000,000 + round(3,300,000,000*0.075) = 1,897,500,000
#   RR as_audited = 1,650,000,000 + round(2,400,000,000*0.075) = 1,830,000,000
#   RES class: 20,000 cust, 500 kwh/mo, charge 800, tiers 300@700/600@900/inf@1100
#     -> monthly bill 4,700c, present_revenue 1,128,000,000
#   COM class: 2,000 cust, 2,500 kwh/mo, charge 2,500, tiers 1000@800/inf@1000
#     -> monthly bill 25,500c, present_revenue 612,000,000
#   present_total = 1,740,000,000
#   System avg increase = round(10000*157,500,000/1,740,000,000) = 905 bp
#   Gradualism cap = round(1.5*905) = 1,358 bp
#   Settlement RR = 1,850,000,000 -> authorized at order.
#   True-up threshold = max(100,000, round(1,850,000,000*0.005)) = 9,250,000
#   RegulatoryAsset RA1: principal 10,000,001 over 4 months
#     -> base 2,500,000 x3, final 2,500,001.
#   Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: revenue_requirement_as_filed_vs_as_audited
        grounds:
          - calculations.revenue_requirement
          - calculations.rate_base_total
          - entities.RateCase.fields.revenue_requirement_as_filed_cents
          - entities.RateCase.fields.revenue_requirement_as_audited_cents
        distinguishing_aspect: |
          Entity domain = RateCase. The two variants share one formula and
          differ ONLY by rate-base input-set filtering on RateBaseItem.status:
          as_filed includes {SUBMITTED, AUDITED} (3,300,000,000) while
          as_audited includes {AUDITED} only (2,400,000,000), so the same
          case data yields revenue_requirement_cents 1,897,500,000 vs
          1,830,000,000 — a 67,500,000-cent delta caused solely by RB2's
          SUBMITTED status.
        test_recipe:
          setup:
            - "RateCase FILED with canonical entries locked, A1 VERIFIED->ACCEPTED at filing, RB1 SUBMITTED then AUDITED after filing, RB2 SUBMITTED and never audited"
          setup_api_calls:
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-104", utility_name: "Cascade Power & Light", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 750, proposed_revenue_requirement_cents: 1897500000, allocation_method: "COINCIDENT_PEAK" }, as: UtilityFiler, captures: { rc: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "900", category: "O_AND_M", booked_amount_cents: 1000000000 }, as: UtilityFiler, captures: { e1: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "901", category: "DEPRECIATION", booked_amount_cents: 400000000 }, as: UtilityFiler, captures: { e2: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "902", category: "TAXES", booked_amount_cents: 200000000 }, as: UtilityFiler, captures: { e3: $.data.id } }
            - { call: "POST /api/v1/adjustments", payload: { rate_case_id: "${rc}", test_year_entry_id: "${e1}", amount_cents: 50000000, reason: "Annualize pension cost" }, as: UtilityFiler, as_user_id: "uf_alice", captures: { a1: $.data.id } }
            - { call: "POST /api/v1/adjustments/${a1}/verify", payload: {}, as: UtilityFiler, as_user_id: "uf_bob" }
            - { call: "POST /api/v1/test-year-entries/${e1}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e1}/lock", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e2}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e2}/lock", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e3}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e3}/lock", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/rate-base-items", payload: { rate_case_id: "${rc}", label: "Generation plant", plant_in_service_cents: 3000000000, accumulated_depreciation_cents: 500000000, working_capital_cents: 100000000, accumulated_deferred_taxes_cents: 200000000 }, as: UtilityFiler, captures: { rb1: $.data.id } }
            - { call: "POST /api/v1/rate-base-items", payload: { rate_case_id: "${rc}", label: "Distribution plant", plant_in_service_cents: 1000000000, accumulated_depreciation_cents: 100000000, working_capital_cents: 0, accumulated_deferred_taxes_cents: 0 }, as: UtilityFiler, captures: { rb2: $.data.id } }
            - { call: "POST /api/v1/rate-base-items/${rb1}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/rate-base-items/${rb2}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/rate-cases/${rc}/submit-filing", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/rate-base-items/${rb1}/audit", payload: { outcome: "AUDIT_PASS" }, as: CommissionStaff }
          trigger:
            - { call: "GET /api/v1/rate-cases/${rc}/revenue-requirement", payload: { variant: "as_filed" }, as: CommissionStaff }
            - { call: "GET /api/v1/rate-cases/${rc}/revenue-requirement", payload: { variant: "as_audited" }, as: CommissionStaff }
          assert:
            - "as_filed response: rate_base_cents == 3300000000, cost_of_service_cents == 1650000000, return_cents == 247500000, revenue_requirement_cents == 1897500000"
            - "as_audited response: rate_base_cents == 2400000000, cost_of_service_cents == 1650000000, return_cents == 180000000, revenue_requirement_cents == 1830000000"
            - "1897500000 - 1830000000 == 67500000 == RB2.net_rate_base_cents (900000000) * 0.075 rounded; the delta is caused solely by RB2's SUBMITTED status being excluded from as_audited"

      - name: class_allocation_coincident_peak_vs_energy_average
        grounds:
          - calculations.class_cost_allocation
          - entities.CustomerClass.fields.allocated_cost_cents
        distinguishing_aspect: |
          Entity domain = CustomerClass (different from
          revenue_requirement_as_filed_vs_as_audited's RateCase domain). The
          two variants differ by allocation METHOD on identical determinants:
          COINCIDENT_PEAK allocates the 60% demand component by
          coincident-peak share (RES 0.75) while ENERGY_AVERAGE uses annual-kwh
          share (RES 2/3), moving exactly 82,500,000 cents from RES to COM.
        test_recipe:
          setup:
            - "RateCase FILED (canonical fixture) with RES and COM CustomerClass rows created before filing"
          setup_api_calls:
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-104", utility_name: "Cascade Power & Light", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 750, proposed_revenue_requirement_cents: 1897500000, allocation_method: "COINCIDENT_PEAK" }, as: UtilityFiler, captures: { rc: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "900", category: "O_AND_M", booked_amount_cents: 1000000000 }, as: UtilityFiler, captures: { e1: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "901", category: "DEPRECIATION", booked_amount_cents: 400000000 }, as: UtilityFiler, captures: { e2: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "902", category: "TAXES", booked_amount_cents: 200000000 }, as: UtilityFiler, captures: { e3: $.data.id } }
            - { call: "POST /api/v1/adjustments", payload: { rate_case_id: "${rc}", test_year_entry_id: "${e1}", amount_cents: 50000000, reason: "Annualize pension cost" }, as: UtilityFiler, as_user_id: "uf_alice", captures: { a1: $.data.id } }
            - { call: "POST /api/v1/adjustments/${a1}/verify", payload: {}, as: UtilityFiler, as_user_id: "uf_bob" }
            - { call: "POST /api/v1/test-year-entries/${e1}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e1}/lock", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e2}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e2}/lock", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e3}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e3}/lock", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/rate-base-items", payload: { rate_case_id: "${rc}", label: "Generation plant", plant_in_service_cents: 3000000000, accumulated_depreciation_cents: 500000000, working_capital_cents: 100000000, accumulated_deferred_taxes_cents: 200000000 }, as: UtilityFiler, captures: { rb1: $.data.id } }
            - { call: "POST /api/v1/rate-base-items/${rb1}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/customer-classes", payload: { rate_case_id: "${rc}", class_code: "RESIDENTIAL", customer_count: 20000, monthly_kwh_per_customer: 500, annual_kwh: 120000000, coincident_peak_kw: 120000, average_demand_kw: 80000, present_customer_charge_cents: 800, present_tiers: [ { up_to_kwh: 300, rate_mills: 700 }, { up_to_kwh: 600, rate_mills: 900 }, { up_to_kwh: null, rate_mills: 1100 } ] }, as: UtilityFiler, captures: { cls_res: $.data.id } }
            - { call: "POST /api/v1/customer-classes", payload: { rate_case_id: "${rc}", class_code: "COMMERCIAL", customer_count: 2000, monthly_kwh_per_customer: 2500, annual_kwh: 60000000, coincident_peak_kw: 40000, average_demand_kw: 20000, present_customer_charge_cents: 2500, present_tiers: [ { up_to_kwh: 1000, rate_mills: 800 }, { up_to_kwh: null, rate_mills: 1000 } ] }, as: UtilityFiler, captures: { cls_com: $.data.id } }
            - { call: "POST /api/v1/rate-cases/${rc}/submit-filing", payload: {}, as: UtilityFiler }
          trigger:
            - { call: "GET /api/v1/rate-cases/${rc}/cost-allocation", payload: { method: "COINCIDENT_PEAK" }, as: CommissionStaff }
            - { call: "GET /api/v1/rate-cases/${rc}/cost-allocation", payload: { method: "ENERGY_AVERAGE" }, as: CommissionStaff }
          assert:
            - "COINCIDENT_PEAK response: cost_of_service_cents == 1650000000, residual_cents == 0; RES line: demand 742500000, energy 275000000, customer 225000000, allocated 1242500000; COM line: demand 247500000, energy 137500000, customer 22500000, allocated 407500000"
            - "ENERGY_AVERAGE response: cost_of_service_cents == 1650000000, residual_cents == 0; RES line: demand 660000000, energy 275000000, customer 225000000, allocated 1160000000; COM line: demand 330000000, energy 137500000, customer 22500000, allocated 490000000"
            - "Only the demand component differs between variants (742500000 vs 660000000 for RES); energy and customer components are identical in both"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes (a), (b), (c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: present_revenue_tiered_straddle
        grounds:
          - calculations.present_revenue_by_class
          - entities.CustomerClass.fields.present_revenue_cents
        distinguishing_aspect: |
          Mode (a): a >=3-input formula (customer charge, ordered tier
          schedule, monthly kwh, customer count) with non-linear min/max
          bracket straddle. RES at 500 kwh straddles the 300-kwh tier
          boundary; the EDGE class at exactly 300 kwh fills tier 1 exactly
          (boundary-inclusive: width == tier width, zero spill into tier 2);
          EDGE2 at exactly 600 kwh fills tiers 1+2 exactly. The pinned
          per-tier round_half_up-then-sum order and marginal (not average)
          rate semantics decide the cents.
        test_recipe:
          setup:
            - "RateCase DRAFT with four classes: RES (500 kwh/mo), COM (2500 kwh/mo), EDGE (300 kwh/mo, RES tier schedule), EDGE2 (600 kwh/mo, RES tier schedule)"
          setup_api_calls:
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-104", utility_name: "Cascade Power & Light", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 750, proposed_revenue_requirement_cents: 1897500000, allocation_method: "COINCIDENT_PEAK" }, as: UtilityFiler, captures: { rc: $.data.id } }
            - { call: "POST /api/v1/customer-classes", payload: { rate_case_id: "${rc}", class_code: "RESIDENTIAL", customer_count: 20000, monthly_kwh_per_customer: 500, annual_kwh: 120000000, coincident_peak_kw: 120000, average_demand_kw: 80000, present_customer_charge_cents: 800, present_tiers: [ { up_to_kwh: 300, rate_mills: 700 }, { up_to_kwh: 600, rate_mills: 900 }, { up_to_kwh: null, rate_mills: 1100 } ] }, as: UtilityFiler, captures: { cls_res: $.data.id } }
            - { call: "POST /api/v1/customer-classes", payload: { rate_case_id: "${rc}", class_code: "COMMERCIAL", customer_count: 2000, monthly_kwh_per_customer: 2500, annual_kwh: 60000000, coincident_peak_kw: 40000, average_demand_kw: 20000, present_customer_charge_cents: 2500, present_tiers: [ { up_to_kwh: 1000, rate_mills: 800 }, { up_to_kwh: null, rate_mills: 1000 } ] }, as: UtilityFiler, captures: { cls_com: $.data.id } }
            - { call: "POST /api/v1/customer-classes", payload: { rate_case_id: "${rc}", class_code: "EDGE", customer_count: 1000, monthly_kwh_per_customer: 300, annual_kwh: 3600000, coincident_peak_kw: 3000, average_demand_kw: 2000, present_customer_charge_cents: 800, present_tiers: [ { up_to_kwh: 300, rate_mills: 700 }, { up_to_kwh: 600, rate_mills: 900 }, { up_to_kwh: null, rate_mills: 1100 } ] }, as: UtilityFiler, captures: { cls_edge: $.data.id } }
            - { call: "POST /api/v1/customer-classes", payload: { rate_case_id: "${rc}", class_code: "EDGE2", customer_count: 1000, monthly_kwh_per_customer: 600, annual_kwh: 7200000, coincident_peak_kw: 6000, average_demand_kw: 4000, present_customer_charge_cents: 800, present_tiers: [ { up_to_kwh: 300, rate_mills: 700 }, { up_to_kwh: 600, rate_mills: 900 }, { up_to_kwh: null, rate_mills: 1100 } ] }, as: UtilityFiler, captures: { cls_edge2: $.data.id } }
          trigger:
            - { call: "GET /api/v1/customer-classes/${cls_res}", payload: {}, as: UtilityFiler }
            - { call: "GET /api/v1/customer-classes/${cls_com}", payload: {}, as: UtilityFiler }
            - { call: "GET /api/v1/customer-classes/${cls_edge}", payload: {}, as: UtilityFiler }
            - { call: "GET /api/v1/customer-classes/${cls_edge2}", payload: {}, as: UtilityFiler }
          assert:
            - "RES.present_revenue_cents == 1128000000 (per-customer bill 4700 = 800 + 300*7 + 200*9; 500 kwh straddles only the first tier boundary)"
            - "COM.present_revenue_cents == 612000000 (bill 25500 = 2500 + 1000*8 + 1500*10)"
            - "EDGE.present_revenue_cents == 34800000 (bill 2900 = 800 + 300*7 + 0: at exactly 300 kwh no energy spills into tier 2)"
            - "EDGE2.present_revenue_cents == 67200000 (bill 5600 = 800 + 300*7 + 300*9 + 0: at exactly 600 kwh no energy spills into tier 3)"
            - "RateCase.${rc}.present_revenue_total_cents == 1842000000 (sum of the four classes)"

      - name: amortization_remainder_to_last_installment
        grounds:
          - calculations.amortization_schedule
          - entities.RegulatoryAsset.fields.monthly_base_cents
          - entities.RegulatoryAsset.fields.final_month_cents
          - state_machines.RegulatoryAsset.DEFERRED_to_APPROVED_FOR_AMORTIZATION
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The schedule floors
          each regular installment (floor(10,000,001/4) = 2,500,000) and
          pushes the entire remainder to the LAST installment (2,500,001).
          The alternative order (round each month half-up: 2,500,000.25 ->
          2,500,000 x4 = 10,000,000) loses one cent against principal; the
          pinned floor-plus-tail rule conserves principal exactly.
        test_recipe:
          setup:
            - "RateCase DECIDED: canonical filed case, settlement round adopted (RR 1,850,000,000), tariffs approved, RA1 (principal 10,000,001, 4 months, incurrence 2024) approved at issue-order so its 4 AmortizationEntry rows exist"
          setup_api_calls:
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-104", utility_name: "Cascade Power & Light", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 750, proposed_revenue_requirement_cents: 1897500000, allocation_method: "COINCIDENT_PEAK" }, as: UtilityFiler, captures: { rc: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "900", category: "O_AND_M", booked_amount_cents: 1000000000 }, as: UtilityFiler, captures: { e1: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "901", category: "DEPRECIATION", booked_amount_cents: 400000000 }, as: UtilityFiler, captures: { e2: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "902", category: "TAXES", booked_amount_cents: 200000000 }, as: UtilityFiler, captures: { e3: $.data.id } }
            - { call: "POST /api/v1/adjustments", payload: { rate_case_id: "${rc}", test_year_entry_id: "${e1}", amount_cents: 50000000, reason: "Annualize pension cost" }, as: UtilityFiler, as_user_id: "uf_alice", captures: { a1: $.data.id } }
            - { call: "POST /api/v1/adjustments/${a1}/verify", payload: {}, as: UtilityFiler, as_user_id: "uf_bob" }
            - { call: "POST /api/v1/test-year-entries/${e1}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e1}/lock", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e2}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e2}/lock", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e3}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e3}/lock", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/rate-base-items", payload: { rate_case_id: "${rc}", label: "Generation plant", plant_in_service_cents: 3000000000, accumulated_depreciation_cents: 500000000, working_capital_cents: 100000000, accumulated_deferred_taxes_cents: 200000000 }, as: UtilityFiler, captures: { rb1: $.data.id } }
            - { call: "POST /api/v1/rate-base-items/${rb1}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/customer-classes", payload: { rate_case_id: "${rc}", class_code: "RESIDENTIAL", customer_count: 20000, monthly_kwh_per_customer: 500, annual_kwh: 120000000, coincident_peak_kw: 120000, average_demand_kw: 80000, present_customer_charge_cents: 800, present_tiers: [ { up_to_kwh: 300, rate_mills: 700 }, { up_to_kwh: 600, rate_mills: 900 }, { up_to_kwh: null, rate_mills: 1100 } ] }, as: UtilityFiler, captures: { cls_res: $.data.id } }
            - { call: "POST /api/v1/customer-classes", payload: { rate_case_id: "${rc}", class_code: "COMMERCIAL", customer_count: 2000, monthly_kwh_per_customer: 2500, annual_kwh: 60000000, coincident_peak_kw: 40000, average_demand_kw: 20000, present_customer_charge_cents: 2500, present_tiers: [ { up_to_kwh: 1000, rate_mills: 800 }, { up_to_kwh: null, rate_mills: 1000 } ] }, as: UtilityFiler, captures: { cls_com: $.data.id } }
            - { call: "POST /api/v1/regulatory-assets", payload: { rate_case_id: "${rc}", asset_name: "Storm restoration deferral", principal_cents: 10000001, incurrence_start: "2024-06-01T00:00:00Z", incurrence_end: "2024-12-31T00:00:00Z", amortization_months: 4 }, as: UtilityFiler, captures: { ra1: $.data.id } }
            - { call: "POST /api/v1/rate-cases/${rc}/submit-filing", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/rate-cases/${rc}/deficiency-review", payload: { outcome: "ACCEPTED" }, as: CommissionStaff }
            - { call: "POST /api/v1/rate-cases/${rc}/open-discovery", payload: {}, as: CommissionStaff }
            - { call: "POST /api/v1/tariff-rates", payload: { rate_case_id: "${rc}", customer_class_id: "${cls_res}", label: "RES schedule 2027", proposed_customer_charge_cents: 900, proposed_tiers: [ { up_to_kwh: 300, rate_mills: 750 }, { up_to_kwh: 600, rate_mills: 950 }, { up_to_kwh: null, rate_mills: 1200 } ], effective_start: "2027-01-01T00:00:00Z", effective_end: "2028-01-01T00:00:00Z" }, as: UtilityFiler, captures: { t_res: $.data.id } }
            - { call: "POST /api/v1/tariff-rates", payload: { rate_case_id: "${rc}", customer_class_id: "${cls_com}", label: "COM schedule 2027", proposed_customer_charge_cents: 1462, proposed_tiers: [ { up_to_kwh: null, rate_mills: 1100 } ], effective_start: "2027-01-01T00:00:00Z", effective_end: "2028-01-01T00:00:00Z" }, as: UtilityFiler, captures: { t_com: $.data.id } }
            - { call: "POST /api/v1/intervenors", payload: { rate_case_id: "${rc}", party_name: "AAA Industrial Group", representative_name: "Rae Torres", contact_email: "rae@aaa.example" }, as: IntervenorRep, captures: { i1: $.data.id } }
            - { call: "POST /api/v1/intervenors", payload: { rate_case_id: "${rc}", party_name: "BBB Consumer Advocates", representative_name: "Sam Cho", contact_email: "sam@bbb.example" }, as: IntervenorRep, captures: { i2: $.data.id } }
            - { call: "POST /api/v1/rate-cases/${rc}/advance-to-hearing", payload: {}, as: ALJ }
            - { call: "POST /api/v1/rate-cases/${rc}/open-settlement-window", payload: {}, as: ALJ }
            - { call: "GET /api/v1/rate-cases/${rc}", payload: {}, as: UtilityFiler, captures: { rc_v: $.data.version } }
            - { call: "POST /api/v1/settlement-proposals", payload: { rate_case_id: "${rc}", proposed_revenue_requirement_cents: 1850000000, terms: "Black-box settlement at 1.85B cents", expected_rate_case_version: "${rc_v}" }, as: UtilityFiler, captures: { sp1: $.data.id } }
            - { call: "POST /api/v1/settlement-proposals/${sp1}/circulate", payload: {}, as: UtilityFiler }
