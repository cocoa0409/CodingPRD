# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# University Advancement & Major Gift Pipeline
# Breadth walk over §1.1-§1.7 per the claim-extraction guide. Instances already
# exercised by §1.8 are emitted as excluded_because stubs.
# Logical clock default before any set: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: prospect_creation_applies_defaults_and_initial_states
        claim_type: creation
        grounds: [entities.Prospect, state_machines.Prospect]
        distinguishing_aspect: "A created prospect starts in IDENTIFIED x QUALIFICATION with zeroed computed aggregates and null rating fields."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /advancement/prospects"
              payload: { full_name: "New Prospect", prospect_type: "INDIVIDUAL", contact_email: "n@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { p_id: $.data.id, p_ver: $.data.version }
          trigger:
            - call: "GET /advancement/prospects/${p_id}"
              payload: {}
              as: ProspectResearcher
              as_user_id: "res-1"
          assert:
            - "Prospect.${p_id}.research_status == \"IDENTIFIED\""
            - "Prospect.${p_id}.moves_stage == \"QUALIFICATION\""
            - "Prospect.${p_id}.lifetime_given_cents == 0 and outstanding_pledge_cents == 0"
            - "Prospect.${p_id}.capacity_band is null and rated_assessment_id is null and recognition_society_id is null"
            - "p_ver == 1 and id/created_at/updated_at server-generated"

      - name: prospect_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.Prospect.fields.prospect_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input prospect_type yields ERR_INVALID_REQUEST (400) with no resource created."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /advancement/prospects"
              payload: { full_name: "No Type", contact_email: "n@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_INVALID_REQUEST\""

      - name: prospect_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Prospect.fields.prospect_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "prospect_type outside {INDIVIDUAL, ORGANIZATION} is rejected at the schema priority."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /advancement/prospects"
              payload: { full_name: "Bad Enum", prospect_type: "COMPANY", contact_email: "b@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_INVALID_REQUEST\""

      - name: prospect_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_PROSPECT_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID yields ERR_PROSPECT_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /advancement/prospects/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_PROSPECT_NOT_FOUND\""

      - name: prospect_computed_field_input_rejected
        claim_type: computed_fields
        grounds: [entities.Prospect.fields.lifetime_given_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Clients cannot inject computed fields: lifetime_given_cents in the create body is an unknown-field rejection."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /advancement/prospects"
              payload: { full_name: "Sneaky", prospect_type: "INDIVIDUAL", contact_email: "s@x.com", lifetime_given_cents: 5 }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_INVALID_REQUEST\"  # unknown/computed field rejected by the strict schema"

      - name: fundraiser_creation_initializes_counters
        claim_type: creation
        grounds: [entities.Fundraiser.fields.current_prospect_count, entities.Fundraiser.fields.current_open_ask_cents]
        distinguishing_aspect: "A new fundraiser starts ACTIVE with both capacity counters at 0 and version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /advancement/fundraisers"
              payload: { display_name: "Officer One", email: "o1@x.edu", max_prospect_count: 3, max_open_ask_cents: 1000000 }
              as: VPAdvancement
              as_user_id: "vp-1"
              captures: { f_id: $.data.id }
          trigger:
            - call: "GET /advancement/fundraisers/${f_id}"
              payload: {}
              as: VPAdvancement
              as_user_id: "vp-1"
          assert:
            - "Fundraiser.${f_id}.status == \"ACTIVE\" and version == 1"
            - "Fundraiser.${f_id}.current_prospect_count == 0 and current_open_ask_cents == 0"

      - name: naming_opportunity_creation_initializes_available
        claim_type: initial_state
        grounds: [entities.NamingOpportunity.fields.status, state_machines.NamingOpportunity]
        distinguishing_aspect: "A new naming opportunity starts AVAILABLE with no reservation fields set."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /advancement/naming-opportunities"
              payload: { name: "Waters Hall", category: "BUILDING", price_floor_cents: 1500000 }
              as: VPAdvancement
              as_user_id: "vp-1"
              captures: { opp_id: $.data.id }
          trigger:
            - call: "GET /advancement/naming-opportunities/${opp_id}"
              payload: {}
              as: VPAdvancement
              as_user_id: "vp-1"
          assert:
            - "NamingOpportunity.${opp_id}.status == \"AVAILABLE\""
            - "reserved_by_agreement_id is null and reserved_until is null"

      - name: assessment_create_leaves_computed_fields_null
        claim_type: computed_fields
        grounds: [entities.ResearchAssessment.fields.adjusted_capacity_cents, entities.ResearchAssessment.fields.capacity_band_result]
        distinguishing_aspect: "On creation the assessment is SUBMITTED with all rating outputs null; the prospect moves to IN_SCREENING."
        test_recipe:
          setup: ["one prospect"]
          setup_api_calls:
            - call: "POST /advancement/prospects"
              payload: { full_name: "Donor A", prospect_type: "INDIVIDUAL", contact_email: "a@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /advancement/prospects/${p_id}/assessments"
              payload: { assessed_capacity_cents: 30000000, engagement_score: 80, philanthropy_score: 70, recency_score: 60, evidence_tier: "VERIFIED_DOCUMENT" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { a_id: $.data.id, a_status: $.data.status, a_band: $.data.capacity_band_result }
          assert:
            - "a_status == \"SUBMITTED\""
            - "a_band is null and adjusted_capacity_cents is null and affinity_score_result is null"
            - "Prospect.${p_id}.research_status == \"IN_SCREENING\""

      - name: prospects_list_paginates_with_limit_offset
        claim_type: listing
        grounds: [response_envelope, endpoints.GET /advancement/prospects]
        distinguishing_aspect: "limit/offset windowing over 3 prospects returns correct total_count and has_more on both pages."
        test_recipe:
          setup: ["three prospects"]
          setup_api_calls:
            - call: "POST /advancement/prospects"
              payload: { full_name: "P1", prospect_type: "INDIVIDUAL", contact_email: "p1@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
            - call: "POST /advancement/prospects"
              payload: { full_name: "P2", prospect_type: "INDIVIDUAL", contact_email: "p2@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
            - call: "POST /advancement/prospects"
              payload: { full_name: "P3", prospect_type: "INDIVIDUAL", contact_email: "p3@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
          trigger:
            - call: "GET /advancement/prospects?limit=2&offset=0"
              payload: {}
              as: ProspectResearcher
              as_user_id: "res-1"
            - call: "GET /advancement/prospects?limit=2&offset=2"
              payload: {}
              as: ProspectResearcher
              as_user_id: "res-1"
          assert:
            - "page1: response_type == \"array\", total_count == 3, has_more == true, exactly 2 rows"
            - "page2: total_count == 3, has_more == false, exactly 1 row"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: assessment_approval_supersedes_prior_approved
        claim_type: side_effect_execution
        grounds: [state_machines.ResearchAssessment.APPROVED_to_SUPERSEDED]
        distinguishing_aspect: "Approving a second assessment supersedes the first and re-rates the prospect to the new band."
        test_recipe:
          setup: ["prospect rated band C via assessment 1"]
          setup_api_calls:
            - call: "POST /advancement/prospects"
              payload: { full_name: "Donor A", prospect_type: "INDIVIDUAL", contact_email: "a@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { p_id: $.data.id }
            - call: "POST /advancement/prospects/${p_id}/assessments"
              payload: { assessed_capacity_cents: 30000000, engagement_score: 80, philanthropy_score: 70, recency_score: 60, evidence_tier: "VERIFIED_DOCUMENT" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { a1_id: $.data.id }
            - call: "POST /advancement/assessments/${a1_id}/review"
              payload: { decision: "APPROVE" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "POST /advancement/prospects/${p_id}/assessments"
              payload: { assessed_capacity_cents: 200000000, engagement_score: 90, philanthropy_score: 90, recency_score: 90, evidence_tier: "VERIFIED_DOCUMENT" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { a2_id: $.data.id }
          trigger:
            - call: "POST /advancement/assessments/${a2_id}/review"
              payload: { decision: "APPROVE" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "GET /advancement/prospects/${p_id}/assessments"
              payload: {}
              as: ProspectResearcher
              as_user_id: "res-1"
          assert:
            - "ResearchAssessment.${a1_id}.status == \"SUPERSEDED\""
            - "ResearchAssessment.${a2_id}.status == \"APPROVED\""
            - "Prospect.${p_id}.capacity_band == \"B\" and rated_assessment_id == ${a2_id}"

      - name: assessment_review_of_decided_assessment_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ResearchAssessment, "errors[ERR_ASSESSMENT_NOT_REVIEWABLE]"]
        distinguishing_aspect: "Reviewing an already-APPROVED assessment is rejected; reviewer differs from creator so only the state rule can fire."
        test_recipe:
          setup: ["assessment approved"]
          setup_api_calls:
            - call: "POST /advancement/prospects"
              payload: { full_name: "Donor A", prospect_type: "INDIVIDUAL", contact_email: "a@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { p_id: $.data.id }
            - call: "POST /advancement/prospects/${p_id}/assessments"
              payload: { assessed_capacity_cents: 30000000, engagement_score: 80, philanthropy_score: 70, recency_score: 60, evidence_tier: "VERIFIED_DOCUMENT" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { a_id: $.data.id }
            - call: "POST /advancement/assessments/${a_id}/review"
              payload: { decision: "APPROVE" }
              as: AdvancementDirector
              as_user_id: "dir-1"
          trigger:
            - call: "POST /advancement/assessments/${a_id}/review"
              payload: { decision: "REJECT" }
              as: AdvancementDirector
              as_user_id: "dir-2"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_ASSESSMENT_NOT_REVIEWABLE\""
            - "ResearchAssessment.${a_id}.status remains \"APPROVED\""

      - name: moves_qualification_to_negotiation_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Prospect, "errors[ERR_INVALID_MOVES_TRANSITION]"]
        distinguishing_aspect: "Stage skipping (QUALIFICATION directly to NEGOTIATION) is not a declared edge and is rejected."
        test_recipe:
          setup: ["prospect IDENTIFIED, assigned to the acting officer"]
          setup_api_calls:
            - call: "POST /advancement/fundraisers"
              payload: { display_name: "Officer One", email: "o1@x.edu", max_prospect_count: 10, max_open_ask_cents: 100000000 }
              as: VPAdvancement
              as_user_id: "vp-1"
              captures: { f_id: $.data.id, f_ver: $.data.version }
            - call: "POST /advancement/prospects"
              payload: { full_name: "Donor A", prospect_type: "INDIVIDUAL", contact_email: "a@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { p_id: $.data.id }
            - call: "POST /advancement/fundraisers/${f_id}/assignments"
              payload: { prospect_id: "${p_id}", expected_fundraiser_version: "${f_ver}" }
              as: AdvancementDirector
              as_user_id: "dir-1"
          trigger:
            - call: "POST /advancement/prospects/${p_id}/moves"
              payload: { target_stage: "NEGOTIATION" }
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_INVALID_MOVES_TRANSITION\""
            - "Prospect.${p_id}.moves_stage remains \"QUALIFICATION\""

      - name: moves_to_stewardship_directly_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Prospect]
        distinguishing_aspect: "STEWARDSHIP is reachable only as a side effect of agreement execution, never via the moves endpoint."
        test_recipe:
          setup: ["prospect assigned and in CULTIVATION (no rating required for the first move)"]
          setup_api_calls:
            - call: "POST /advancement/fundraisers"
              payload: { display_name: "Officer One", email: "o1@x.edu", max_prospect_count: 10, max_open_ask_cents: 100000000 }
              as: VPAdvancement
              as_user_id: "vp-1"
              captures: { f_id: $.data.id, f_ver: $.data.version }
            - call: "POST /advancement/prospects"
              payload: { full_name: "Donor A", prospect_type: "INDIVIDUAL", contact_email: "a@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { p_id: $.data.id }
            - call: "POST /advancement/fundraisers/${f_id}/assignments"
              payload: { prospect_id: "${p_id}", expected_fundraiser_version: "${f_ver}" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "POST /advancement/prospects/${p_id}/moves"
              payload: { target_stage: "CULTIVATION" }
              as: GiftOfficer
              as_user_id: "${f_id}"
          trigger:
            - call: "POST /advancement/prospects/${p_id}/moves"
              payload: { target_stage: "STEWARDSHIP" }
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_INVALID_MOVES_TRANSITION\""
            - "Prospect.${p_id}.moves_stage remains \"CULTIVATION\""

      - name: moves_closed_lost_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Prospect]
        distinguishing_aspect: "From CLOSED_LOST every further move is rejected; the terminal state is locked."
        test_recipe:
          setup: ["prospect assigned, moved QUALIFICATION -> CULTIVATION -> CLOSED_LOST"]
          setup_api_calls:
            - call: "POST /advancement/fundraisers"
              payload: { display_name: "Officer One", email: "o1@x.edu", max_prospect_count: 10, max_open_ask_cents: 100000000 }
              as: VPAdvancement
              as_user_id: "vp-1"
              captures: { f_id: $.data.id, f_ver: $.data.version }
            - call: "POST /advancement/prospects"
              payload: { full_name: "Donor A", prospect_type: "INDIVIDUAL", contact_email: "a@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { p_id: $.data.id }
            - call: "POST /advancement/fundraisers/${f_id}/assignments"
              payload: { prospect_id: "${p_id}", expected_fundraiser_version: "${f_ver}" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "POST /advancement/prospects/${p_id}/moves"
              payload: { target_stage: "CULTIVATION" }
              as: GiftOfficer
              as_user_id: "${f_id}"
            - call: "POST /advancement/prospects/${p_id}/moves"
              payload: { target_stage: "CLOSED_LOST" }
              as: GiftOfficer
              as_user_id: "${f_id}"
          trigger:
            - call: "POST /advancement/prospects/${p_id}/moves"
              payload: { target_stage: "CULTIVATION" }
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_INVALID_MOVES_TRANSITION\""
            - "Prospect.${p_id}.moves_stage remains \"CLOSED_LOST\""

      - name: disqualify_cascades_assignment_release_and_proposal_rejection
        claim_type: side_effect_execution
        grounds: [state_machines.Prospect, state_machines.PortfolioAssignment, state_machines.Proposal]
        distinguishing_aspect: "Disqualify releases the ACTIVE assignment with reason DISQUALIFIED, rejects the UNDER_REVIEW proposal, and zeroes both fundraiser counters."
        test_recipe:
          setup: ["prospect rated band C, assigned, CULTIVATION, with an UNDER_REVIEW STANDARD proposal of 5000000"]
          setup_api_calls:
            - call: "POST /advancement/fundraisers"
              payload: { display_name: "Officer One", email: "o1@x.edu", max_prospect_count: 10, max_open_ask_cents: 100000000 }
              as: VPAdvancement
              as_user_id: "vp-1"
              captures: { f_id: $.data.id, f_ver: $.data.version }
            - call: "POST /advancement/prospects"
              payload: { full_name: "Donor A", prospect_type: "INDIVIDUAL", contact_email: "a@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { p_id: $.data.id }
            - call: "POST /advancement/prospects/${p_id}/assessments"
              payload: { assessed_capacity_cents: 30000000, engagement_score: 80, philanthropy_score: 70, recency_score: 60, evidence_tier: "VERIFIED_DOCUMENT" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { a_id: $.data.id }
            - call: "POST /advancement/assessments/${a_id}/review"
              payload: { decision: "APPROVE" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "POST /advancement/fundraisers/${f_id}/assignments"
              payload: { prospect_id: "${p_id}", expected_fundraiser_version: "${f_ver}" }
              as: AdvancementDirector
              as_user_id: "dir-1"
              captures: { asg_id: $.data.id }
            - call: "POST /advancement/prospects/${p_id}/moves"
              payload: { target_stage: "CULTIVATION" }
              as: GiftOfficer
              as_user_id: "${f_id}"
            - call: "GET /advancement/prospects/${p_id}"
              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { p_ver: $.data.version }
            - call: "POST /advancement/proposals"
              payload: { prospect_id: "${p_id}", proposal_type: "OUTRIGHT", ask_amount_cents: 5000000, designation_purpose: "Programs", expected_prospect_version: "${p_ver}" }
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /advancement/proposals/${prop_id}/submit"
              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
          trigger:
            - call: "POST /advancement/prospects/${p_id}/disqualify"
              payload: {}
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "GET /advancement/fundraisers/${f_id}"
              payload: {}
              as: AdvancementDirector
              as_user_id: "dir-1"
              captures: { cnt: $.data.current_prospect_count, ask: $.data.current_open_ask_cents }
          assert:
            - "Prospect.${p_id}.research_status == \"DISQUALIFIED\""
            - "PortfolioAssignment.${asg_id}.status == \"RELEASED\" and released_reason == \"DISQUALIFIED\""
            - "Proposal.${prop_id}.status == \"REJECTED\" and decision_rationale == \"PROSPECT_DISQUALIFIED\""
            - "cnt == 0 and ask == 0  # both counters recomputed by the cascade"

      - name: proposal_submit_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.Proposal, "errors[ERR_PROPOSAL_STATE_FORBIDS]"]
        distinguishing_aspect: "A second submit against an UNDER_REVIEW proposal is rejected; the first submit's tier computation is not redone."
        test_recipe:
          setup: ["prospect rated band C, assigned, CULTIVATION, DRAFT proposal ask 1000000"]
          setup_api_calls:
            - call: "POST /advancement/fundraisers"
              payload: { display_name: "Officer One", email: "o1@x.edu", max_prospect_count: 10, max_open_ask_cents: 100000000 }
              as: VPAdvancement
              as_user_id: "vp-1"
              captures: { f_id: $.data.id, f_ver: $.data.version }
            - call: "POST /advancement/prospects"
              payload: { full_name: "Donor A", prospect_type: "INDIVIDUAL", contact_email: "a@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { p_id: $.data.id }
            - call: "POST /advancement/prospects/${p_id}/assessments"
              payload: { assessed_capacity_cents: 30000000, engagement_score: 80, philanthropy_score: 70, recency_score: 60, evidence_tier: "VERIFIED_DOCUMENT" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { a_id: $.data.id }
            - call: "POST /advancement/assessments/${a_id}/review"
              payload: { decision: "APPROVE" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "POST /advancement/fundraisers/${f_id}/assignments"
              payload: { prospect_id: "${p_id}", expected_fundraiser_version: "${f_ver}" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "POST /advancement/prospects/${p_id}/moves"
              payload: { target_stage: "CULTIVATION" }
              as: GiftOfficer
              as_user_id: "${f_id}"
            - call: "GET /advancement/prospects/${p_id}"
              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { p_ver: $.data.version }
            - call: "POST /advancement/proposals"
              payload: { prospect_id: "${p_id}", proposal_type: "OUTRIGHT", ask_amount_cents: 1000000, designation_purpose: "Programs", expected_prospect_version: "${p_ver}" }
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /advancement/proposals/${prop_id}/submit"
              payload: {}
              as: GiftOfficer
