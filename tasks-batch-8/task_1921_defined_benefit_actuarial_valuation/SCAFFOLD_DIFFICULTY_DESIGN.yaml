              as_user_id: "${act_rev}"
            - call: "POST /v1/assumption-sets/${aset_id}/lock"
              payload: {}
              as: SeniorActuary
              as_user_id: "${act_rev}"
          assert:
            - "AssumptionSet.${aset_id}.status == LOCKED after traversing DRAFT->IN_REVIEW->DRAFT->IN_REVIEW->APPROVED->DRAFT->IN_REVIEW->APPROVED->LOCKED"
            - "AssumptionSet.${aset_id}.approved_by_actuary_id == ${act_rev}"
            - "AssumptionSet.${aset_id}.version == ${aset_v} + 8 (one increment per transition)"

      - name: census_batch_correction_loop
        grounds:
          - state_machines.CensusBatch.transitions.UPLOADED_to_NEEDS_CORRECTION
          - state_machines.CensusBatch.transitions.NEEDS_CORRECTION_to_UPLOADED
          - state_machines.CensusBatch.transitions.UPLOADED_to_VALIDATED
        distinguishing_aspect: |
          CensusBatch is cyclic: UPLOADED -> NEEDS_CORRECTION -> UPLOADED ->
          VALIDATED -> LOCKED; the correction loop re-enters UPLOADED on each
          bulk re-post, a non-linear revision shape on a different entity than
          the assumption-set cycle.
        test_recipe:
          setup:
            - "Plan 2028 exists; census batch created with one invalid row (attained age 64, outside the pinned mortality domain [60,63]) and one valid retiree"
          setup_api_calls:
