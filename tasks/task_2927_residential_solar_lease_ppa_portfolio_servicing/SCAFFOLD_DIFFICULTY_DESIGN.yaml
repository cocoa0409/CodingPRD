      - name: cancelled_truck_roll_leaves_outage_counters_untouched
        grounds:
          - state_machines.TruckRoll.SCHEDULED_to_CANCELLED
          - state_machines.OutageEvent.DISPATCHED_to_TRIAGED
          - calculations.excused_downtime_invariant
          - calculations.monitoring_status_projection
          - calculations.truck_roll_cost_allocation
        distinguishing_aspect: |
          Dispatch-then-cancel is a compensating pair: open_outage_count must return to
          1 (not 0 and not 2), excused_downtime_minutes must stay at 0, and
          monitoring_status must be RE-DERIVED back from TRUCK_ROLL_DISPATCHED to
          OUTAGE_OPEN rather than latched. A second, genuinely completed roll with root
          cause STRING_FAULT then moves excused_downtime_minutes to exactly 2880, which
          proves the cancelled roll contributed nothing.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z, advanced to 2026-08-03T00:00:00Z for the completion."
            - "One ACTIVE LEASE agreement: start 2025-01-01, escalator 0.019, base monthly rent 12900, 8400 kWh, band 0.05, 6.40 kW."
            - "One OutageEvent detected_at 2026-08-01T00:00:00Z, triaged (severity LOW)."
            - "One TruckRoll dispatched by u_fieldops_1 for TECH-9002, window 2026-08-02T09:00Z..2026-08-02T13:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /servicing/homeowners"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@example.com", state_code: "CA", fico_score: 742, dti_ratio: 0.28, monthly_income_cents: 1150000 }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { ho1_id: $.data.id }
            - call: "POST /servicing/utility-tariffs"
              payload: { utility_code: "PGE", tariff_code: "NEM2-ETOUC", generation: "NEM_2", retail_rate_per_kwh_millicents: 32500, export_credit_rate_per_kwh_millicents: 28000, monthly_fixed_charge_cents: 1500, effective_from_date: "2020-04-15", grandfathers_predecessors: true }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { t_nem2_id: $.data.id }
            - call: "POST /servicing/agreements"
              payload: { homeowner_id: "${ho1_id}", tariff_id: "${t_nem2_id}", site_address: "77 Bayside Rd, Alameda CA", state_code: "CA", product_type: "LEASE", term_years: 20, contract_start_date: "2025-01-01", escalator_pct: 0.019, guaranteed_annual_kwh: 8400, system_dc_kw: 6.40, guarantee_band_pct: 0.05, base_monthly_lease_cents: 12900 }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { agP_id: $.data.id }
            - call: "POST /servicing/agreements/${agP_id}/activate"
              payload: {}
              as: ServicingAgent
              as_user_id: "u_agent_1"
            - call: "POST /servicing/outage-events"
              payload: { agreement_id: "${agP_id}", inverter_serial: "INV-88-0004", outage_type: "INVERTER_OFFLINE", detected_at: "2026-08-01T00:00:00Z" }
              as: FieldOpsCoordinator
              as_user_id: "u_fieldops_1"
              captures: { oeP_id: $.data.id }
            - call: "POST /servicing/outage-events/${oeP_id}/triage"
              payload: {}
              as: FieldOpsCoordinator
              as_user_id: "u_fieldops_1"
              captures: { oeP_ver1: $.data.version }
            - call: "POST /servicing/truck-rolls"
              payload: { outage_event_id: "${oeP_id}", technician_code: "TECH-9002", scheduled_window_start: "2026-08-02T09:00:00Z", scheduled_window_end: "2026-08-02T13:00:00Z", expected_outage_event_version: "${oeP_ver1}" }
              as: FieldOpsCoordinator
              as_user_id: "u_fieldops_1"
              captures: { trP1_id: $.data.id }
          trigger:
            - call: "POST /servicing/truck-rolls/${trP1_id}/cancel"
              payload: {}
              as: FieldOpsCoordinator
              as_user_id: "u_fieldops_1"
            - call: "GET /servicing/outage-events/${oeP_id}"
              payload: {}
              as: FieldOpsCoordinator
              as_user_id: "u_fieldops_1"
              captures: { oeP_ver2: $.data.version }
            - call: "POST /servicing/truck-rolls"
              payload: { outage_event_id: "${oeP_id}", technician_code: "TECH-9002", scheduled_window_start: "2026-08-02T09:00:00Z", scheduled_window_end: "2026-08-02T13:00:00Z", expected_outage_event_version: "${oeP_ver2}" }
              as: FieldOpsCoordinator
              as_user_id: "u_fieldops_1"
              captures: { trP2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /servicing/truck-rolls/${trP2_id}/complete"
              payload: { disposition: "SERVICE_COMPLETE", root_cause: "STRING_FAULT" }
              as: FieldOpsCoordinator
              as_user_id: "u_fieldops_2"
          assert:
            - "before the cancel: SolarAgreement.${agP_id}.monitoring_status == TRUCK_ROLL_DISPATCHED, open_outage_count == 1, excused_downtime_minutes == 0"
            - "the cancel -> 200; TruckRoll.${trP1_id}.status == CANCELLED"
            - "after the cancel: OutageEvent.${oeP_id}.status == TRIAGED, resolved_at null, downtime_minutes 0, excused false"
            - "after the cancel: SolarAgreement.${agP_id}.open_outage_count == 1 (not 0, not 2) and excused_downtime_minutes == 0"
            - "after the cancel: SolarAgreement.${agP_id}.monitoring_status == OUTAGE_OPEN (re-derived, not latched at TRUCK_ROLL_DISPATCHED)"
            - "the identical replacement window is accepted because a CANCELLED roll never conflicts: TruckRoll.${trP2_id}.status == SCHEDULED"
            - "the completion -> 200; TruckRoll.${trP2_id}.status == COMPLETED, billable_to == SUNRUN_OM, labor_cost_cents == 38000, diagnosed_by_user_id == u_fieldops_2"
            - "OutageEvent.${oeP_id}.status == RESOLVED, resolved_at == 2026-08-03T00:00:00Z, downtime_minutes == 2880, excused == true, severity == MEDIUM"
            - "SolarAgreement.${agP_id}.excused_downtime_minutes == 2880, open_outage_count == 0, monitoring_status == MONITORING_OK"
            - "the cancelled roll contributed nothing: 2880 is exactly one outage's downtime, not doubled"
