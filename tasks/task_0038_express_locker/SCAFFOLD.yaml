scenario: |
  Express locker operation system: locker management with locker-machine profile, compartment-size configuration,
  online status monitoring, firmware version tracking, and offline-degraded service; deposit and pickup workflow with
  courier deposit (mobile-end compartment opening, recipient phone binding, pickup code generation), recipient pickup
  (code/SMS-link/face), wrong-deposit correction, and deposit-failure retry; overtime fee with free storage period,
  tiered overtime pricing, payment before pickup enforcement, fee waiver rules (system fault/courier wrong-deposit),
  and dispute handling; stranded parcel handling with long-stay identification, courier-recall workflow,
  return-to-sender coordination, on-site disposal record, and compartment release; courier rating with deposit-success
  rate, wrong-deposit rate, complaint rate, courier blacklist, and rating-based access restriction; capacity warning
  with compartment-size occupancy threshold, peak-period warning, courier deposit-rejection rules, and rebalancing
  suggestion to operations; revenue reconciliation with overtime fee revenue, courier deposit fee revenue (if charged),
  location-partner revenue sharing, refund-induced reversal, and periodic settlement; event-driven synchronization
  with payment, IM, and courier-company systems; audit logging for compartment-opening events and fee adjustments.

domain_name: express-locker
api_prefix: /locker-machines

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - scheduled_deferred_actions
    - idempotency

  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many        # LockerMachine → Compartment, Parcel → AuditLog
    - cross_aggregate    # Parcel ↔ Compartment ↔ LockerMachine ↔ Courier
    - self_referential   # Parcel.replaces_parcel_id (wrong-deposit correction creates a successor parcel)

  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: LockerMachine
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: site_code, type: string, source: input, description: "Physical site identifier (e.g., 'BJ-CY-001')" }
      - { name: partner_id, type: string, source: input, description: "Location-partner that owns the site (used for revenue sharing)" }
      - { name: firmware_version, type: string, source: input, description: "Semver (e.g., '2.4.1'); compared lexicographically by parts" }
      - { name: online_status, type: enum, source: system, description: "ONLINE | OFFLINE", default: "ONLINE", constraints: "ONLINE|OFFLINE" }
      - { name: last_heartbeat_at, type: datetime, source: system, description: "ISO8601 UTC; updated by POST /heartbeat" }
      - { name: degraded_mode, type: boolean, source: computed, description: "True iff online_status=OFFLINE OR firmware_version below MIN_FIRMWARE_VERSION; gates new deposits" }
      - { name: total_compartments, type: integer, source: computed, description: "count of Compartments under this machine in any non-DECOMMISSIONED status" }
      - { name: occupied_count_small, type: integer, source: computed, description: "Compartments of size SMALL with status=OCCUPIED" }
      - { name: occupied_count_medium, type: integer, source: computed, description: "Compartments of size MEDIUM with status=OCCUPIED" }
      - { name: occupied_count_large, type: integer, source: computed, description: "Compartments of size LARGE with status=OCCUPIED" }
      - { name: capacity_warning_level, type: enum, source: computed, description: "NORMAL | NEAR_FULL | FULL_BLOCK_DEPOSITS — derived per §1.3 capacity_warning_level" }

  - name: Compartment
    parent: LockerMachine
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: locker_machine_id, type: string, source: system, description: "Parent LockerMachine.id" }
      - { name: slot_label, type: string, source: input, description: "Human-readable slot label, unique within machine (e.g., 'A-12')" }
      - { name: size, type: enum, source: input, description: "SMALL | MEDIUM | LARGE", constraints: "SMALL|MEDIUM|LARGE" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | RESERVED | OCCUPIED | OUT_OF_SERVICE | DECOMMISSIONED", default: "AVAILABLE" }
      - { name: current_parcel_id, type: string, source: system, description: "Parcel currently occupying this compartment; null when not OCCUPIED/RESERVED" }
      - { name: last_open_at, type: datetime, source: system, description: "Last successful compartment-opening event timestamp" }

  - name: Courier
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; equals X-User-ID when X-User-Role=Courier" }
      - { name: phone, type: string, source: input, description: "E.164 contact number" }
      - { name: company_id, type: string, source: input, description: "Courier-company external id (synced via /events/emit)" }
      - { name: lifetime_deposit_count, type: integer, source: computed, description: "Count of Parcels created by this courier in any non-DRAFT status" }
      - { name: lifetime_wrong_deposit_count, type: integer, source: computed, description: "Count of Parcels by this courier whose successor parcel has correction_origin=WRONG_DEPOSIT" }
      - { name: lifetime_deposit_success_rate, type: number, source: computed, description: "(lifetime_deposit_count - failed_attempts) / max(lifetime_deposit_count + failed_attempts, 1); 4-decimal precision; lifetime variant" }
      - { name: window_wrong_deposit_rate, type: number, source: computed, description: "wrong_deposit_count / max(deposit_count, 1) over rolling 30-day window ending at now(); 4-decimal precision; window variant" }
      - { name: complaint_count, type: integer, source: computed, description: "Count of resolved disputes with outcome=COURIER_AT_FAULT in last 30 days" }
      - { name: blacklist_status, type: enum, source: system, description: "ACTIVE | RESTRICTED | BLACKLISTED", default: "ACTIVE", constraints: "ACTIVE|RESTRICTED|BLACKLISTED" }
      - { name: blacklist_reason, type: string, source: system, description: "Free text reason set when status flips RESTRICTED or BLACKLISTED; null when ACTIVE" }

  - name: Parcel
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: tracking_no, type: string, source: input, description: "External tracking number; unique among Parcels with status NOT IN {WRONG_DEPOSIT_VOID}" }
      - { name: courier_id, type: string, source: input, description: "Foreign key to Courier.id" }
      - { name: locker_machine_id, type: string, source: system, description: "Foreign key to LockerMachine.id; immutable after deposit success" }
      - { name: compartment_id, type: string, source: system, description: "Currently assigned compartment; nulled on DISPOSED/RECALLED/RETURNED/PICKED_UP after release" }
      - { name: recipient_phone, type: string, source: input, description: "E.164 phone bound at deposit; pickup-code SMS target" }
      - { name: required_size, type: enum, source: input, description: "SMALL | MEDIUM | LARGE; deposit only fits compartment whose size >= required_size" }
      - { name: pickup_code, type: string, source: system, description: "6-digit numeric, generated on successful deposit; rotated on each replacement" }
      - { name: deposited_at, type: datetime, source: system, description: "ISO8601 UTC at the moment compartment was successfully opened and parcel placed" }
      - { name: picked_up_at, type: datetime, source: system, description: "ISO8601 UTC; null until PICKED_UP" }
      - { name: status, type: enum, source: system, description: "DRAFT | DEPOSITED | PICKUP_PENDING | PICKED_UP | WRONG_DEPOSIT_VOID | LONG_STAY | RECALLED | RETURNED | DISPOSED", constraints: "DRAFT|DEPOSITED|PICKUP_PENDING|PICKED_UP|WRONG_DEPOSIT_VOID|LONG_STAY|RECALLED|RETURNED|DISPOSED" }
      - { name: failed_open_attempts, type: integer, source: computed, description: "Count of CompartmentEvent entries with event_type=DEPOSIT_OPEN_FAILED for this parcel; capped at MAX_RETRY=3 before forced reassignment" }
      - { name: replaces_parcel_id, type: string, source: system, description: "Self-reference: id of the parcel this one replaces (wrong-deposit correction); null otherwise" }
      - { name: correction_origin, type: enum, source: system, description: "NONE | WRONG_DEPOSIT | RETRY_REASSIGN; pinned at create time of replacement parcel" }
      - { name: provisional_overtime_fee, type: number, source: computed, description: "Frozen at PICKUP_PENDING entry; computed via overtime_fee_calc with cutoff=pickup_pending_at" }
      - { name: final_overtime_fee, type: number, source: computed, description: "Computed at compartment-open during pickup; cutoff=actual pickup datetime" }
      - { name: fee_waived, type: boolean, source: system, description: "True when fee waiver rule applied (system_fault | courier_wrong_deposit | manual_dispute)" }
      - { name: fee_waiver_reason, type: enum, source: system, description: "NONE | SYSTEM_FAULT | COURIER_WRONG_DEPOSIT | MANUAL_DISPUTE", default: "NONE" }

  - name: PickupCodeAttempt
    parent: Parcel
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: parcel_id, type: string, source: system, description: "Foreign key to Parcel.id" }
      - { name: method, type: enum, source: input, description: "CODE | SMS_LINK | FACE", constraints: "CODE|SMS_LINK|FACE" }
      - { name: success, type: boolean, source: system, description: "Whether the attempt opened the compartment" }
      - { name: failure_reason, type: enum, source: system, description: "NONE | WRONG_CODE | EXPIRED_LINK | FACE_MISMATCH | FEE_UNPAID | OFFLINE_MACHINE", default: "NONE" }

  - name: OvertimeFeeRecord
    parent: Parcel
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: parcel_id, type: string, source: system, description: "Foreign key to Parcel.id" }
      - { name: variant, type: enum, source: system, description: "PROVISIONAL | FINAL", constraints: "PROVISIONAL|FINAL" }
      - { name: cutoff_at, type: datetime, source: system, description: "Datetime used as fee end-bound" }
      - { name: amount_cents, type: integer, source: computed, description: "Computed by overtime_fee_calc; integer cents" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | PAID | REFUNDED | WAIVED", default: "UNPAID", constraints: "UNPAID|PAID|REFUNDED|WAIVED" }
      - { name: payment_external_id, type: string, source: system, description: "Reference id returned by external payment system event; null until PAID" }

  - name: Dispute
    parent: Parcel
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: parcel_id, type: string, source: system, description: "Foreign key to Parcel.id" }
      - { name: opened_by_role, type: enum, source: system, description: "Recipient | Courier", constraints: "Recipient|Courier" }
      - { name: claim_type, type: enum, source: input, description: "WRONG_DEPOSIT | OVERTIME_DISPUTE | DAMAGED" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED_WAIVED | RESOLVED_REJECTED | RESOLVED_COURIER_AT_FAULT", default: "OPEN" }
      - { name: outcome_amount_cents, type: integer, source: system, description: "Amount waived/refunded if applicable; 0 if rejected" }

  - name: CompartmentEvent
    parent: Compartment
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: compartment_id, type: string, source: system, description: "Foreign key to Compartment.id" }
      - { name: parcel_id, type: string, source: system, description: "Associated parcel.id; null for OUT_OF_SERVICE_TOGGLE" }
      - { name: actor_role, type: enum, source: system, description: "Courier | Recipient | OperationsAdmin | system", constraints: "Courier|Recipient|OperationsAdmin|system" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID of the acting role; 'system' for automatic events" }
      - { name: event_type, type: enum, source: system, description: "DEPOSIT_OPEN_OK | DEPOSIT_OPEN_FAILED | PICKUP_OPEN_OK | PICKUP_OPEN_FAILED | RECALL_OPEN_OK | DISPOSAL_OPEN_OK | OUT_OF_SERVICE_TOGGLE" }

  - name: SettlementBatch
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: partner_id, type: string, source: input, description: "Location partner whose revenue is being settled" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive start (UTC)" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive end (UTC)" }
      - { name: gross_overtime_revenue_cents, type: integer, source: computed, description: "Sum of OvertimeFeeRecord.amount_cents (PAID, variant=FINAL) within window for partner's machines" }
      - { name: refund_reversal_cents, type: integer, source: computed, description: "Sum of OvertimeFeeRecord.amount_cents that flipped PAID→REFUNDED within window" }
      - { name: net_revenue_cents, type: integer, source: computed, description: "gross_overtime_revenue_cents - refund_reversal_cents" }
      - { name: partner_share_cents, type: integer, source: computed, description: "floor(net_revenue_cents * PARTNER_SHARE_RATIO); rounded down to integer cents" }
      - { name: platform_share_cents, type: integer, source: computed, description: "net_revenue_cents - partner_share_cents (no drift)" }
      - { name: status, type: enum, source: system, description: "DRAFT | LOCKED | SETTLED", default: "DRAFT", constraints: "DRAFT|LOCKED|SETTLED" }

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC" }
      - { name: actor_role, type: string, source: system, description: "Role of acting principal" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID" }
      - { name: action, type: enum, source: system, description: "COMPARTMENT_OPEN | FEE_ADJUSTMENT | BLACKLIST_CHANGE | SETTLEMENT_LOCK", constraints: "COMPARTMENT_OPEN|FEE_ADJUSTMENT|BLACKLIST_CHANGE|SETTLEMENT_LOCK" }
      - { name: subject_entity, type: string, source: system, description: "Entity name being acted upon" }
      - { name: subject_id, type: string, source: system, description: "Subject entity id" }
      - { name: payload, type: object, source: system, description: "Action-specific structured details (immutable)" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: LockerMachine
    field: online_status
    initial_state: ONLINE
    terminal_states: []
    transitions:
      - from: ONLINE
        to: OFFLINE
        trigger: "POST /locker-machines/{machineId}/offline (OperationsAdmin) OR system: heartbeat absent for HEARTBEAT_TIMEOUT_SECONDS"
        actor: OperationsAdmin
        preconditions: []
        side_effects:
          - "degraded_mode set to true"
          - "All Compartments with status=AVAILABLE remain AVAILABLE but POST /parcels/deposit on this machine returns ERR_MACHINE_OFFLINE_DEGRADED"
          - "Pending parcels in PICKUP_PENDING continue to count overtime via overtime_fee_calc (clock keeps running)"
      - from: OFFLINE
        to: ONLINE
        trigger: "POST /locker-machines/{machineId}/heartbeat with firmware_version >= MIN_FIRMWARE_VERSION"
        actor: system
        preconditions:
          - "Submitted firmware_version >= MIN_FIRMWARE_VERSION"
        side_effects:
          - "degraded_mode recomputed; if firmware_version still < MIN_FIRMWARE_VERSION, degraded_mode stays true even though online_status=ONLINE"

  - entity: Compartment
    field: status
    initial_state: AVAILABLE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /parcels (deposit start) — system selects compartment per selector_compartment_pick"
        actor: Courier
        preconditions:
          - "LockerMachine.degraded_mode is false (ERR_MACHINE_OFFLINE_DEGRADED)"
          - "size >= Parcel.required_size"
          - "current capacity_warning_level for this size != FULL_BLOCK_DEPOSITS (ERR_CAPACITY_BLOCKED)"
        side_effects:
          - "current_parcel_id = parcel.id"
          - "Parcel.status: DRAFT → DRAFT (compartment_id set)"
      - from: RESERVED
        to: OCCUPIED
        trigger: "POST /parcels/{parcelId}/confirm-deposit — courier physically placed parcel and compartment_open succeeded"
        actor: Courier
        preconditions:
          - "Parcel.status=DRAFT and compartment_id matches"
        side_effects:
          - "Parcel.status: DRAFT → DEPOSITED"
          - "Parcel.deposited_at = now()"
          - "Parcel.pickup_code generated"
          - "CompartmentEvent.DEPOSIT_OPEN_OK appended"
          - "AuditLog.COMPARTMENT_OPEN appended"
          - "Courier.lifetime_deposit_count incremented (recompute on read)"
      - from: RESERVED
        to: AVAILABLE
        trigger: "POST /parcels/{parcelId}/cancel-deposit — open failed and retry exhausted (failed_open_attempts == MAX_RETRY)"
        actor: Courier
        preconditions:
          - "Parcel.failed_open_attempts >= MAX_RETRY (=3)"
        side_effects:
          - "current_parcel_id = null"
          - "Parcel marked as failed (status=DRAFT, but a successor Parcel with correction_origin=RETRY_REASSIGN can be created)"
          - "CompartmentEvent.DEPOSIT_OPEN_FAILED appended"
      - from: OCCUPIED
        to: AVAILABLE
        trigger: "POST /parcels/{parcelId}/pickup-confirm OR /parcels/{parcelId}/recall OR /parcels/{parcelId}/dispose OR /parcels/{parcelId}/return-to-sender"
        actor: Recipient | Courier | OperationsAdmin
        preconditions:
          - "Parcel.status transitions to PICKED_UP | RECALLED | DISPOSED | RETURNED"
        side_effects:
          - "current_parcel_id = null"
          - "CompartmentEvent.PICKUP_OPEN_OK | RECALL_OPEN_OK | DISPOSAL_OPEN_OK appended (per trigger)"
          - "AuditLog.COMPARTMENT_OPEN appended"
      - from: OCCUPIED
        to: OCCUPIED
        trigger: "POST /parcels/{parcelId}/correct-wrong-deposit — courier reports wrong deposit on a parcel still inside"
        actor: Courier
        preconditions:
          - "Parcel.status = DEPOSITED"
          - "now() - Parcel.deposited_at < WRONG_DEPOSIT_GRACE_SECONDS (=900)"
        side_effects:
          - "Parcel.status: DEPOSITED → WRONG_DEPOSIT_VOID"
          - "current_parcel_id is replaced by successor Parcel.id (correction_origin=WRONG_DEPOSIT, replaces_parcel_id=old.id)"
          - "Old Parcel's overtime fee zeroed and fee_waived=true with fee_waiver_reason=COURIER_WRONG_DEPOSIT"
          - "Courier.lifetime_wrong_deposit_count incremented (recompute on read); courier_rating reevaluated"
      - from: ["AVAILABLE", "OCCUPIED", "RESERVED"]
        to: OUT_OF_SERVICE
        trigger: "POST /locker-machines/{machineId}/compartments/{compartmentId}/out-of-service (OperationsAdmin)"
        actor: OperationsAdmin
        preconditions:
          - "If was OCCUPIED: an explicit recall or dispose must precede (ERR_OCCUPIED_COMPARTMENT_NEEDS_CLEAR)"
        side_effects:
          - "CompartmentEvent.OUT_OF_SERVICE_TOGGLE appended"
      - from: OUT_OF_SERVICE
        to: AVAILABLE
        trigger: "POST /locker-machines/{machineId}/compartments/{compartmentId}/in-service (OperationsAdmin)"
        actor: OperationsAdmin
        preconditions: []
        side_effects:
          - "CompartmentEvent.OUT_OF_SERVICE_TOGGLE appended"

  - entity: Parcel
    field: status
    initial_state: DRAFT
    terminal_states: [PICKED_UP, RETURNED, DISPOSED, WRONG_DEPOSIT_VOID]
    transitions:
      - from: DRAFT
        to: DEPOSITED
        trigger: "POST /parcels/{parcelId}/confirm-deposit"
        actor: Courier
        preconditions:
          - "Parcel.compartment_id is set (compartment is RESERVED)"
          - "Courier.blacklist_status != BLACKLISTED (ERR_COURIER_BLACKLISTED)"
        side_effects:
          - "Compartment: RESERVED → OCCUPIED"
          - "pickup_code generated"
          - "deposited_at set"
          - "CompartmentEvent.DEPOSIT_OPEN_OK + AuditLog.COMPARTMENT_OPEN"
          - "Event emitted to IM system: parcel_deposited (recipient_phone, pickup_code)"
      - from: DEPOSITED
        to: PICKUP_PENDING
        trigger: "POST /parcels/{parcelId}/initiate-pickup (Recipient submits CODE | SMS_LINK | FACE method)"
        actor: Recipient
        preconditions:
          - "Method is CODE|SMS_LINK|FACE"
          - "If CODE: provided code matches Parcel.pickup_code (ERR_INVALID_PICKUP_CODE)"
          - "Compartment.status = OCCUPIED"
        side_effects:
          - "PickupCodeAttempt appended (success may be false on first attempts → status remains DEPOSITED)"
          - "On first successful authentication: provisional_overtime_fee computed and OvertimeFeeRecord(variant=PROVISIONAL) created"
      - from: PICKUP_PENDING
        to: DEPOSITED
        trigger: "system (idle for 600s after PICKUP_PENDING entry without payment or compartment-open) OR POST /parcels/{parcelId}/cancel-pickup"
        actor: system | Recipient
        preconditions: []
        side_effects:
          - "OvertimeFeeRecord(PROVISIONAL).payment_status remains UNPAID; record retained for audit"
      - from: PICKUP_PENDING
        to: PICKED_UP
        trigger: "POST /parcels/{parcelId}/pickup-confirm — recipient opens compartment after fee paid"
        actor: Recipient
        preconditions:
          - "If provisional_overtime_fee > 0 AND fee_waived = false: latest OvertimeFeeRecord(PROVISIONAL).payment_status must be PAID (ERR_FEE_PAYMENT_REQUIRED)"
          - "Compartment.status = OCCUPIED"
        side_effects:
          - "picked_up_at = now()"
          - "final_overtime_fee computed (variant=FINAL); difference vs provisional may be non-zero if a tier was crossed"
          - "Compartment: OCCUPIED → AVAILABLE; current_parcel_id null"
          - "CompartmentEvent.PICKUP_OPEN_OK + AuditLog.COMPARTMENT_OPEN"
          - "Event emitted to IM system: parcel_picked_up"
      - from: DEPOSITED
        to: WRONG_DEPOSIT_VOID
        trigger: "POST /parcels/{parcelId}/correct-wrong-deposit"
        actor: Courier
        preconditions:
          - "now() - deposited_at < WRONG_DEPOSIT_GRACE_SECONDS (=900) (ERR_WRONG_DEPOSIT_GRACE_EXPIRED)"
          - "Acting courier_id matches Parcel.courier_id (ERR_NOT_COURIER_OWNER)"
        side_effects:
          - "fee_waived=true, fee_waiver_reason=COURIER_WRONG_DEPOSIT, any provisional fee record marked WAIVED"
          - "Successor Parcel created (correction_origin=WRONG_DEPOSIT, replaces_parcel_id=this.id) — same compartment continues to host successor (Compartment OCCUPIED, current_parcel_id replaced)"
          - "Courier.lifetime_wrong_deposit_count incremented; window_wrong_deposit_rate recomputed; if rate >= BLACKLIST_THRESHOLD_RATE → blacklist_status auto-flips to RESTRICTED (cascade chain hop 2 → hop 3 affects future deposit acceptance)"
      - from: DEPOSITED
        to: LONG_STAY
        trigger: "system: POST /_sweep/run when (now() - deposited_at) >= LONG_STAY_THRESHOLD_HOURS (=168)"
        actor: system
        preconditions: []
        side_effects:
          - "Notification dispatched to IM (recipient) and courier-company"
          - "Recall window opened: courier may invoke /recall within RECALL_WINDOW_HOURS (=72)"
      - from: LONG_STAY
        to: RECALLED
        trigger: "POST /parcels/{parcelId}/recall — courier requests recall before window expiry"
        actor: Courier
        preconditions:
          - "Parcel.status = LONG_STAY"
          - "now() - long_stay_at < RECALL_WINDOW_HOURS"
          - "Acting courier matches Parcel.courier_id"
        side_effects:
          - "Compartment: OCCUPIED → AVAILABLE"
          - "All overtime fees waived (fee_waived=true, fee_waiver_reason=SYSTEM_FAULT not used here; a dedicated NONE→preserved reason — reason becomes MANUAL_DISPUTE if recipient disputed; otherwise overtime fee record cancelled to UNPAID and parcel status drives next steps)"
          - "CompartmentEvent.RECALL_OPEN_OK + AuditLog.COMPARTMENT_OPEN"
      - from: LONG_STAY
        to: RETURNED
        trigger: "POST /parcels/{parcelId}/return-to-sender — operations coordinates external pickup by courier company"
        actor: OperationsAdmin
        preconditions:
          - "Parcel.status = LONG_STAY AND now() - long_stay_at >= RECALL_WINDOW_HOURS"
        side_effects:
          - "Compartment: OCCUPIED → AVAILABLE"
          - "Event emitted to courier-company system: parcel_return_requested"
      - from: LONG_STAY
        to: DISPOSED
        trigger: "POST /parcels/{parcelId}/dispose — operations records on-site disposal"
        actor: OperationsAdmin
        preconditions:
          - "Parcel.status = LONG_STAY AND now() - long_stay_at >= DISPOSE_THRESHOLD_HOURS (=336)"
        side_effects:
          - "Compartment: OCCUPIED → AVAILABLE"
          - "AuditLog.COMPARTMENT_OPEN with action subtype DISPOSAL"

  - entity: OvertimeFeeRecord
    field: payment_status
    initial_state: UNPAID
    terminal_states: [PAID, REFUNDED, WAIVED]
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /events/emit (event_type=payment_succeeded) referencing the OvertimeFeeRecord.id"
        actor: system
        preconditions:
          - "Record exists and is UNPAID"
          - "amount_cents > 0 (ERR_FEE_ZERO_NOT_PAYABLE)"
        side_effects:
          - "payment_external_id captured"
          - "Cascade hop 1: enables Parcel.PICKUP_PENDING → PICKED_UP precondition"
      - from: PAID
        to: REFUNDED
        trigger: "POST /disputes/{disputeId}/resolve with resolution=REFUND OR POST /events/emit (event_type=payment_refunded)"
        actor: OperationsAdmin | system
        preconditions:
          - "Linked Dispute.status would transition to RESOLVED_WAIVED, OR external refund event matches payment_external_id"
        side_effects:
          - "If parcel.status=PICKED_UP: SettlementBatch.refund_reversal_cents recomputes on next /settlements run"
          - "AuditLog.FEE_ADJUSTMENT appended"
      - from: UNPAID
        to: WAIVED
        trigger: "POST /parcels/{parcelId}/waive-fee (OperationsAdmin, requires reason) OR system (degraded_mode at deposit time + LockerMachine SYSTEM_FAULT marker)"
        actor: OperationsAdmin | system
        preconditions:
          - "Reason in {SYSTEM_FAULT, COURIER_WRONG_DEPOSIT, MANUAL_DISPUTE}"
        side_effects:
          - "Parcel.fee_waived=true, fee_waiver_reason set"
          - "AuditLog.FEE_ADJUSTMENT appended"

  - entity: Courier
    field: blacklist_status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: RESTRICTED
        trigger: "system: triggered as cascade hop 3 from Parcel.correct-wrong-deposit when window_wrong_deposit_rate >= BLACKLIST_THRESHOLD_RATE (=0.10), OR POST /couriers/{courierId}/restrict (OperationsAdmin)"
        actor: system | OperationsAdmin
        preconditions: []
        side_effects:
          - "blacklist_reason set"
          - "Cascade hop 4: subsequent POST /parcels (deposit start) by this courier returns ERR_COURIER_RESTRICTED — gates capacity-warned machines and SMALL-size deposits"
          - "AuditLog.BLACKLIST_CHANGE appended"
      - from: RESTRICTED
        to: BLACKLISTED
        trigger: "system: complaint_count >= BLACKLIST_COMPLAINT_THRESHOLD (=5) within 30-day window OR POST /couriers/{courierId}/blacklist"
        actor: system | OperationsAdmin
        preconditions: []
        side_effects:
          - "All future POST /parcels by this courier rejected with ERR_COURIER_BLACKLISTED"
          - "AuditLog.BLACKLIST_CHANGE appended"
      - from: ["RESTRICTED", "BLACKLISTED"]
        to: ACTIVE
        trigger: "POST /couriers/{courierId}/reinstate (OperationsAdmin)"
        actor: OperationsAdmin
        preconditions:
          - "window_wrong_deposit_rate < BLACKLIST_THRESHOLD_RATE AND complaint_count < BLACKLIST_COMPLAINT_THRESHOLD"
        side_effects:
          - "blacklist_reason cleared"
          - "AuditLog.BLACKLIST_CHANGE appended"

  - entity: SettlementBatch
    field: status
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "POST /settlements/{batchId}/lock"
        actor: OperationsAdmin
        preconditions:
          - "period_end <= now() (ERR_PERIOD_NOT_CLOSED)"
          - "No OvertimeFeeRecord in window with payment_status=UNPAID and parcel in terminal-paid-required state (ERR_PENDING_FEES_IN_WINDOW)"
        side_effects:
          - "All amounts frozen; further refunds during this window cause status to remain LOCKED but a follow-up reversal batch is required (out of scope of single transition)"
          - "AuditLog.SETTLEMENT_LOCK appended"
      - from: LOCKED
        to: SETTLED
        trigger: "POST /settlements/{batchId}/settle"
        actor: OperationsAdmin
        preconditions: []
        side_effects:
          - "Event emitted to payment system: partner_payout (partner_id, partner_share_cents)"

  - entity: Dispute
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED_WAIVED, RESOLVED_REJECTED, RESOLVED_COURIER_AT_FAULT]
    transitions:
      - from: OPEN
        to: RESOLVED_WAIVED
        trigger: "POST /disputes/{disputeId}/resolve (resolution=WAIVE)"
        actor: OperationsAdmin
        preconditions:
          - "Parcel.status NOT IN {DISPOSED, RETURNED}"
        side_effects:
          - "OvertimeFeeRecord(latest) → REFUNDED if PAID, → WAIVED if UNPAID"
          - "Parcel.fee_waived=true, fee_waiver_reason=MANUAL_DISPUTE"
      - from: OPEN
        to: RESOLVED_REJECTED
        trigger: "POST /disputes/{disputeId}/resolve (resolution=REJECT)"
        actor: OperationsAdmin
        preconditions: []
        side_effects: []
      - from: OPEN
        to: RESOLVED_COURIER_AT_FAULT
        trigger: "POST /disputes/{disputeId}/resolve (resolution=COURIER_AT_FAULT)"
        actor: OperationsAdmin
        preconditions:
          - "Parcel.courier_id matches dispute target"
        side_effects:
          - "Courier.complaint_count incremented (recompute on read); may flip blacklist_status (cascade)"
          - "Fee waived (variant matches latest OvertimeFeeRecord)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two couriers attempt to deposit to the same compartment simultaneously"
    guarantee: "At most one Parcel.compartment_id may bind to a given Compartment in RESERVED/OCCUPIED status; second loses"
    error_id: ERR_COMPARTMENT_ALREADY_RESERVED
    http_status: 409
    serialization: "First-writer-wins on Compartment.current_parcel_id; loser sees compartment status != AVAILABLE"

  - scenario: "Recipient pickup-confirm and operations recall executed simultaneously on the same parcel"
    guarantee: "Exactly one of PICKED_UP and RECALLED wins; loser rejected"
    error_id: ERR_PARCEL_STATE_CHANGED
    http_status: 409
    serialization: "First-writer-wins on Parcel.status field"

  - scenario: "Two payment_succeeded events for the same OvertimeFeeRecord"
    guarantee: "Idempotent on payment_external_id; second event returns 200 with same record (no double credit)"
    error_id: ERR_DUPLICATE_PAYMENT_EVENT
    http_status: 409
    serialization: "Idempotency key = payment_external_id; second event with different external_id rejected"

  - scenario: "Wrong-deposit correction races with successful pickup by recipient"
    guarantee: "If Parcel.status already advanced to PICKUP_PENDING/PICKED_UP, correction is rejected"
    error_id: ERR_PARCEL_STATE_CHANGED
    http_status: 409
    serialization: "First-writer-wins on Parcel.status; correction requires status=DEPOSITED"

  - scenario: "Settlement lock races with refund of an in-window fee"
    guarantee: "If lock wins first, subsequent refund still applies but is recorded into the next batch's refund_reversal_cents"
    error_id: ERR_SETTLEMENT_LOCKED
    http_status: 409
    serialization: "First-writer-wins on SettlementBatch.status; refund continues but cannot mutate locked batch totals"

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: overtime_fee_calc
    trigger: "Parcel.DEPOSITED→PICKUP_PENDING (provisional, cutoff=pickup_pending_at) and Parcel.PICKUP_PENDING→PICKED_UP (final, cutoff=picked_up_at)"
    algorithm: tiered_pricing
    formula: |
      # Inputs: deposited_at, cutoff_at, fee_waived
      if fee_waived: return 0
      elapsed_hours = floor((cutoff_at - deposited_at).total_seconds() / 3600)   # whole-hour buckets, floor
      free_hours    = min(elapsed_hours, FREE_HOURS)
      tier1_hours   = min(max(elapsed_hours - FREE_HOURS, 0), TIER1_END_HOURS - FREE_HOURS)        # 24..72
      tier2_hours   = min(max(elapsed_hours - TIER1_END_HOURS, 0), TIER2_END_HOURS - TIER1_END_HOURS) # 72..168
      tier3_hours   = max(elapsed_hours - TIER2_END_HOURS, 0)                                       # >168
      raw_cents     = tier1_hours*TIER1_RATE_CENTS + tier2_hours*TIER2_RATE_CENTS + tier3_hours*TIER3_RATE_CENTS
      amount_cents  = min(raw_cents, FEE_CAP_CENTS)                                                 # cap
      return amount_cents
    input_set: "Parcel where status IN {DEPOSITED, PICKUP_PENDING, PICKED_UP, LONG_STAY}; ignored when fee_waived=true"
    constants:
      FREE_HOURS: 24
      TIER1_END_HOURS: 72
      TIER2_END_HOURS: 168
      TIER1_RATE_CENTS: 100   # $1.00/hour
      TIER2_RATE_CENTS: 200   # $2.00/hour
      TIER3_RATE_CENTS: 400   # $4.00/hour
      FEE_CAP_CENTS: 10000    # $100.00 hard cap
    precision: "Integer cents; floor on hour buckets; sum in cents (no per-hour rounding)"
    variants:
      - name: provisional
        when: "Parcel transitions DEPOSITED → PICKUP_PENDING (cutoff_at = pickup_pending_at, frozen at that moment)"
        difference: "Frozen as soon as recipient initiates pickup; locked into OvertimeFeeRecord(variant=PROVISIONAL) and used to enforce ERR_FEE_PAYMENT_REQUIRED"
      - name: final
        when: "Parcel transitions PICKUP_PENDING → PICKED_UP (cutoff_at = picked_up_at)"
        difference: "Recomputed at compartment-open; if a tier boundary was crossed between PROVISIONAL and FINAL, FINAL > PROVISIONAL — the delta is reconciled into a top-up OvertimeFeeRecord(variant=FINAL) with its own UNPAID→PAID flow"
    note: "Two variants on the same parcel can produce different amounts → dual-variant calc instance #1"

  - name: compartment_occupancy_warning
    trigger: "On every Compartment status change, every Parcel state change, and on read of LockerMachine"
    algorithm: threshold
    formula: |
      For each size in {SMALL, MEDIUM, LARGE}:
        size_total = count of Compartments at this machine where size==X AND status != DECOMMISSIONED
        size_occupied = count of Compartments at this machine where size==X AND status==OCCUPIED
        ratio = size_occupied / max(size_total, 1)
        if ratio >= FULL_BLOCK_RATIO (=0.95): per_size_level = FULL_BLOCK_DEPOSITS
        elif ratio >= NEAR_FULL_RATIO (=0.80): per_size_level = NEAR_FULL
        else: per_size_level = NORMAL
      capacity_warning_level = max severity across sizes (FULL_BLOCK_DEPOSITS > NEAR_FULL > NORMAL)
      During PEAK_HOURS_UTC ([10,12) and [18,21)) the NEAR_FULL_RATIO drops to 0.70 (peak-period warning).
    input_set: "Compartments where status != DECOMMISSIONED, grouped by size"
    constants:
      NEAR_FULL_RATIO: 0.80
      PEAK_NEAR_FULL_RATIO: 0.70
      FULL_BLOCK_RATIO: 0.95
      PEAK_HOURS_UTC: "[10,12),[18,21)"
    precision: "Ratio computed as exact rational comparison (no rounding); strict >= boundary"
    note: "Boundary precision: ratio >= 0.95 blocks deposits; ratio == 0.94999 still NEAR_FULL"

  - name: courier_quality_score
    trigger: "On every read of Courier; on every Parcel.confirm-deposit; on every Dispute.resolve; on every Parcel.correct-wrong-deposit"
    algorithm: weighted_scoring
    formula: |
      # Lifetime variant — used for analytic dashboards
      lifetime_success_rate = (deposited_count - failed_attempts_count) / max(deposited_count + failed_attempts_count, 1)
      # Window variant — used for blacklist gating; rolls forward with the clock
      window_deposits         = count of Parcel where courier_id=this AND deposited_at >= now()-30d AND status != DRAFT
      window_wrong_deposits   = count of those whose successor parcel has correction_origin=WRONG_DEPOSIT
      window_wrong_deposit_rate = window_wrong_deposits / max(window_deposits, 1)   # 4-decimal precision
      score = round( W_SUCCESS*lifetime_success_rate + W_LOW_WRONG*(1 - window_wrong_deposit_rate) + W_LOW_COMPLAINT*(1 - min(complaint_count/COMPLAINT_NORM, 1)), 4 )
    input_set: "Parcels and Disputes for this courier; window variant filters by deposited_at within last 30 days"
    constants:
      W_SUCCESS: 0.5
      W_LOW_WRONG: 0.3
      W_LOW_COMPLAINT: 0.2
      COMPLAINT_NORM: 5
      BLACKLIST_THRESHOLD_RATE: 0.10
    precision: "4-decimal precision on all rates; ties broken by lifetime_success_rate desc, then courier.created_at asc"
    variants:
      - name: lifetime
        when: "Used for analytics endpoints (GET /couriers/{id}/rating)"
        difference: "Numerator/denominator never reset; covers all-time deposits"
      - name: window_30d
        when: "Used for blacklist gating; the value drives auto-flip ACTIVE→RESTRICTED"
        difference: "Only deposits within last 30 days enter both numerator and denominator; rolling window means a courier whose lifetime rate is fine can still trip the gate during a bad week, and a previously RESTRICTED courier's gate clears purely by clock advance"
    note: "Two variants on different metrics → dual-variant calc instance #2"

  - name: settlement_revenue_split
    trigger: "On read of SettlementBatch; locked at SettlementBatch.lock; finalized at /settle"
    algorithm: aggregation
    formula: |
      gross_overtime_revenue_cents = sum( OvertimeFeeRecord.amount_cents
        for r in records WHERE
          r.variant == FINAL
          AND r.payment_status IN {PAID}                        # only currently-PAID at compute time
          AND parcel.locker_machine_id IN partner_machines
          AND r.created_at >= period_start AND r.created_at < period_end )
      refund_reversal_cents = sum( r.amount_cents
        for r in records WHERE
          r.variant == FINAL
          AND r.payment_status == REFUNDED
          AND r.updated_at >= period_start AND r.updated_at < period_end )
      net_revenue_cents = gross_overtime_revenue_cents - refund_reversal_cents
      partner_share_cents = floor(net_revenue_cents * PARTNER_SHARE_RATIO)        # rounding step #1: floor on partner share
      platform_share_cents = net_revenue_cents - partner_share_cents              # rounding step #2: residual to platform — preserves invariant partner+platform == net
    input_set: "OvertimeFeeRecords linked to LockerMachines whose partner_id matches batch.partner_id"
    constants:
      PARTNER_SHARE_RATIO: 0.30
    precision: "Rounding ORDER PINNED: floor partner first → derive platform as residual. Reversing the order (round platform first then derive partner) on odd cents would shift one cent to partner → different result."
    note: "Combinatorial mode (b): nested rounding where order matters → combinatorial_formula instance #2"

  - name: long_stay_sweep
    trigger: "POST /_sweep/run (test-driven)"
    algorithm: chronological
    formula: |
      For each Parcel in DEPOSITED ordered by deposited_at ASC, then by id ASC (tie-break):
        if (now() - deposited_at).total_seconds() >= LONG_STAY_THRESHOLD_HOURS*3600:
          Parcel.status -> LONG_STAY
          long_stay_at = now()
          emit IM notification + courier-company event
        else:
          break  # remaining deposits are younger; chronological order means we can stop
    input_set: "All Parcel rows where status=DEPOSITED at sweep time"
    constants:
      LONG_STAY_THRESHOLD_HOURS: 168
      RECALL_WINDOW_HOURS: 72
      DISPOSE_THRESHOLD_HOURS: 336
    precision: "Whole-hour comparison; equality (==) at the threshold triggers the transition (>= boundary semantics)"
    note: "Combinatorial mode (a): tiered/chronological selection ordered by 2-key sort with explicit tie-break — combinatorial_formula instance #1 (different mode from settlement_revenue_split)"

# =============================================================================
# 1.4 Validation Rules Table (priority-ordered)
# =============================================================================
validations:
  - { priority: 1,  category: auth,                  check: "X-User-ID and X-User-Role headers present and valid",
      error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2,  category: auth,                  check: "Role permitted for endpoint per RBAC matrix",
      error_id: ERR_INSUFFICIENT_PERMISSIONS,           http_status: 403, applies_to: "all" }
  - { priority: 3,  category: existence,             check: "Path resources exist, validated left-to-right (machineId, then compartmentId, then parcelId)",
      error_id: ERR_RESOURCE_NOT_FOUND,                  http_status: 404, applies_to: "all nested endpoints" }
  - { priority: 4,  category: state,                 check: "LockerMachine.degraded_mode is false (online_status=ONLINE AND firmware_version >= MIN_FIRMWARE_VERSION) for new deposit creation",
      error_id: ERR_MACHINE_OFFLINE_DEGRADED,            http_status: 409, applies_to: "POST /parcels (deposit)" }
  - { priority: 5,  category: state,                 check: "Target resource in correct state for the requested transition",
      error_id: ERR_PARCEL_STATE_CHANGED,                http_status: 409, applies_to: "POST /parcels/{id}/* state-transition endpoints" }
  - { priority: 6,  category: business_safety,       check: "Acting Courier.blacklist_status MUST be ACTIVE for deposit; RESTRICTED is allowed only at machines whose capacity_warning_level=NORMAL AND only for required_size!=SMALL; BLACKLISTED rejects all deposits",
      error_id: ERR_COURIER_BLACKLISTED,                 http_status: 403, applies_to: "POST /parcels (deposit)" }
  - { priority: 7,  category: business_referential,  check: "Acting courier_id matches Parcel.courier_id for /correct-wrong-deposit and /recall",
      error_id: ERR_NOT_COURIER_OWNER,                   http_status: 403, applies_to: "POST /parcels/{id}/correct-wrong-deposit, /recall" }
  - { priority: 8,  category: business_temporal,     check: "Wrong-deposit correction within WRONG_DEPOSIT_GRACE_SECONDS (=900) of deposited_at",
      error_id: ERR_WRONG_DEPOSIT_GRACE_EXPIRED,         http_status: 409, applies_to: "POST /parcels/{id}/correct-wrong-deposit" }
  - { priority: 9,  category: business_constraint,   check: "Compartment.size >= Parcel.required_size when picking the compartment",
      error_id: ERR_NO_COMPARTMENT_FITS,                 http_status: 409, applies_to: "POST /parcels (deposit)" }
  - { priority: 10, category: business_constraint,   check: "Capacity warning gate: per-size capacity_warning_level != FULL_BLOCK_DEPOSITS for required_size",
      error_id: ERR_CAPACITY_BLOCKED,                    http_status: 409, applies_to: "POST /parcels (deposit)" }
  - { priority: 11, category: business_safety,       check: "Pickup code matches Parcel.pickup_code (CODE method) OR SMS link not expired (SMS_LINK) OR face match passes (FACE)",
      error_id: ERR_INVALID_PICKUP_CODE,                 http_status: 409, applies_to: "POST /parcels/{id}/initiate-pickup" }
  - { priority: 12, category: business_fiscal,       check: "If parcel has unpaid PROVISIONAL OvertimeFeeRecord with amount_cents>0 and not waived → block /pickup-confirm",
      error_id: ERR_FEE_PAYMENT_REQUIRED,                http_status: 402, applies_to: "POST /parcels/{id}/pickup-confirm" }
  - { priority: 13, category: business_fiscal,       check: "Settlement lock requires period_end <= now() and zero pending fees in window",
      error_id: ERR_PENDING_FEES_IN_WINDOW,              http_status: 409, applies_to: "POST /settlements/{id}/lock" }
  - { priority: 14, category: business_constraint,   check: "Idempotency on payment_external_id and on Parcel.tracking_no",
      error_id: ERR_DUPLICATE_PAYMENT_EVENT,             http_status: 409, applies_to: "POST /events/emit (payment_succeeded), POST /parcels" }
  - { priority: 15, category: business_constraint,   check: "OCC version match on PUT/PATCH endpoints when version is supplied",
      error_id: ERR_VERSION_CONFLICT,                    http_status: 409, applies_to: "all PUT/PATCH endpoints" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- LockerMachine ---
  - { method: POST,  path: "/locker-machines",                                         description: "Create a LockerMachine",                       roles: [OperationsAdmin], code: 201, input: [site_code, partner_id, firmware_version], output: LockerMachine,           side_effects: ["online_status=ONLINE, degraded_mode=false"] }
  - { method: GET,   path: "/locker-machines",                                         description: "List LockerMachines",                          roles: [Any], code: 200, input: ["limit?","offset?","online_status?"], output: "LockerMachine[]", side_effects: [] }
  - { method: GET,   path: "/locker-machines/{machineId}",                             description: "Get a LockerMachine including capacity_warning_level", roles: [Any], code: 200, input: [], output: LockerMachine, side_effects: [] }
  - { method: POST,  path: "/locker-machines/{machineId}/heartbeat",                   description: "Heartbeat ping with firmware_version",         roles: [OperationsAdmin, system], code: 200, input: [firmware_version], output: LockerMachine, side_effects: ["last_heartbeat_at=now(); recompute online_status and degraded_mode"] }
  - { method: POST,  path: "/locker-machines/{machineId}/offline",                     description: "Force machine OFFLINE (operations)",           roles: [OperationsAdmin], code: 200, input: [], output: LockerMachine, side_effects: ["online_status=OFFLINE, degraded_mode=true"] }
  - { method: GET,   path: "/locker-machines/{machineId}/audit-logs",                  description: "List AuditLog entries scoped to this machine", roles: [OperationsAdmin], code: 200, input: ["limit?","offset?","action?"], output: "AuditLog[]", side_effects: [] }

  # --- Compartments ---
  - { method: POST,  path: "/locker-machines/{machineId}/compartments",                description: "Create a Compartment",                          roles: [OperationsAdmin], code: 201, input: [slot_label, size], output: Compartment, side_effects: ["status=AVAILABLE"] }
  - { method: GET,   path: "/locker-machines/{machineId}/compartments",                description: "List Compartments",                             roles: [Any], code: 200, input: ["limit?","offset?","size?","status?"], output: "Compartment[]", side_effects: [] }
  - { method: GET,   path: "/locker-machines/{machineId}/compartments/{compartmentId}", description: "Get a Compartment",                            roles: [Any], code: 200, input: [], output: Compartment, side_effects: [] }
  - { method: POST,  path: "/locker-machines/{machineId}/compartments/{compartmentId}/out-of-service", description: "Mark compartment OUT_OF_SERVICE",   roles: [OperationsAdmin], code: 200, input: [], output: Compartment, side_effects: ["CompartmentEvent.OUT_OF_SERVICE_TOGGLE"] }
  - { method: POST,  path: "/locker-machines/{machineId}/compartments/{compartmentId}/in-service",     description: "Restore compartment to AVAILABLE", roles: [OperationsAdmin], code: 200, input: [], output: Compartment, side_effects: ["CompartmentEvent.OUT_OF_SERVICE_TOGGLE"] }

  # --- Couriers ---
  - { method: POST,  path: "/couriers",                                  description: "Register a Courier (called by courier-company sync)",   roles: [OperationsAdmin], code: 201, input: [phone, company_id], output: Courier, side_effects: ["blacklist_status=ACTIVE"] }
  - { method: GET,   path: "/couriers/{courierId}",                      description: "Get a Courier including rating fields",                  roles: [OperationsAdmin, Courier], code: 200, input: [], output: Courier, side_effects: [] }
  - { method: GET,   path: "/couriers/{courierId}/rating",               description: "Get courier_quality_score with both lifetime and window_30d variants", roles: [OperationsAdmin, Courier], code: 200, input: [], output: "object{lifetime, window_30d}", side_effects: [] }
  - { method: POST,  path: "/couriers/{courierId}/restrict",             description: "Set blacklist_status=RESTRICTED",                        roles: [OperationsAdmin], code: 200, input: [reason], output: Courier, side_effects: ["AuditLog.BLACKLIST_CHANGE"] }
  - { method: POST,  path: "/couriers/{courierId}/blacklist",            description: "Set blacklist_status=BLACKLISTED",                       roles: [OperationsAdmin], code: 200, input: [reason], output: Courier, side_effects: ["AuditLog.BLACKLIST_CHANGE"] }
  - { method: POST,  path: "/couriers/{courierId}/reinstate",            description: "Restore courier to ACTIVE",                              roles: [OperationsAdmin], code: 200, input: [], output: Courier, side_effects: ["AuditLog.BLACKLIST_CHANGE"] }

  # --- Parcels (deposit + pickup workflow) ---
  - { method: POST,  path: "/parcels",                                   description: "Begin deposit: server picks compartment per selector_compartment_pick (size match, lowest occupancy, then slot_label asc)", roles: [Courier], code: 201, input: [tracking_no, locker_machine_id, recipient_phone, required_size], output: Parcel, side_effects: ["Compartment selected → RESERVED; status=DRAFT, compartment_id set"] }
  - { method: POST,  path: "/parcels/{parcelId}/confirm-deposit",        description: "Courier confirms physical placement; mints pickup_code", roles: [Courier], code: 200, input: [], output: Parcel, side_effects: ["status=DEPOSITED, deposited_at=now(), pickup_code minted, Compartment OCCUPIED, AuditLog.COMPARTMENT_OPEN, IM event emitted"] }
  - { method: POST,  path: "/parcels/{parcelId}/cancel-deposit",         description: "Cancel deposit after retry exhaustion (failed_open_attempts>=MAX_RETRY)", roles: [Courier], code: 200, input: [], output: Parcel, side_effects: ["Compartment back to AVAILABLE; current_parcel_id null; CompartmentEvent.DEPOSIT_OPEN_FAILED appended"] }
  - { method: POST,  path: "/parcels/{parcelId}/retry-open",             description: "Increment failed_open_attempts (test-driving deposit-failure retry)", roles: [Courier], code: 200, input: [], output: Parcel, side_effects: ["failed_open_attempts++; if >=MAX_RETRY further confirm-deposit returns ERR_RETRY_EXHAUSTED"] }
  - { method: POST,  path: "/parcels/{parcelId}/correct-wrong-deposit",  description: "Courier flags wrong deposit within grace window; creates successor Parcel", roles: [Courier], code: 200, input: [new_tracking_no, new_recipient_phone, new_required_size], output: Parcel, side_effects: ["Old parcel WRONG_DEPOSIT_VOID; successor created; old fee waived; courier wrong_deposit_count++; cascade may flip blacklist_status"] }
  - { method: POST,  path: "/parcels/{parcelId}/initiate-pickup",        description: "Recipient initiates pickup with method CODE|SMS_LINK|FACE", roles: [Recipient], code: 200, input: [method, "code?"], output: Parcel, side_effects: ["status DEPOSITED→PICKUP_PENDING on first success; provisional fee record created; PickupCodeAttempt appended"] }
  - { method: POST,  path: "/parcels/{parcelId}/pickup-confirm",         description: "Recipient opens compartment after fee paid", roles: [Recipient], code: 200, input: [], output: Parcel, side_effects: ["status=PICKED_UP, picked_up_at, final fee record, Compartment AVAILABLE, IM event"] }
  - { method: POST,  path: "/parcels/{parcelId}/cancel-pickup",          description: "Recipient cancels pickup mid-flow (returns to DEPOSITED)", roles: [Recipient], code: 200, input: [], output: Parcel, side_effects: ["status PICKUP_PENDING→DEPOSITED; provisional fee record retained (UNPAID)"] }
  - { method: POST,  path: "/parcels/{parcelId}/recall",                 description: "Courier recalls a LONG_STAY parcel within RECALL_WINDOW_HOURS", roles: [Courier], code: 200, input: [], output: Parcel, side_effects: ["status=RECALLED, Compartment AVAILABLE"] }
  - { method: POST,  path: "/parcels/{parcelId}/return-to-sender",       description: "Operations returns to sender (after recall window expiry)", roles: [OperationsAdmin], code: 200, input: [], output: Parcel, side_effects: ["status=RETURNED, courier-company event"] }
  - { method: POST,  path: "/parcels/{parcelId}/dispose",                description: "Operations records on-site disposal (after dispose threshold)", roles: [OperationsAdmin], code: 200, input: [reason], output: Parcel, side_effects: ["status=DISPOSED, AuditLog with disposal payload"] }
  - { method: POST,  path: "/parcels/{parcelId}/waive-fee",              description: "Operations waives overtime fee (manual)", roles: [OperationsAdmin], code: 200, input: [reason], output: OvertimeFeeRecord, side_effects: ["latest fee record→WAIVED, AuditLog.FEE_ADJUSTMENT"] }
  - { method: GET,   path: "/parcels",                                   description: "List parcels with filters",                              roles: [Any], code: 200, input: ["limit?","offset?","status?","courier_id?","locker_machine_id?"], output: "Parcel[]", side_effects: [] }
  - { method: GET,   path: "/parcels/{parcelId}",                        description: "Get a Parcel including provisional/final fees",         roles: [Any], code: 200, input: [], output: Parcel, side_effects: [] }
  - { method: GET,   path: "/parcels/{parcelId}/fees",                   description: "List OvertimeFeeRecords for parcel",                    roles: [Any], code: 200, input: ["limit?","offset?"], output: "OvertimeFeeRecord[]", side_effects: [] }

  # --- Disputes ---
  - { method: POST,  path: "/parcels/{parcelId}/disputes",  description: "Open a dispute",   roles: [Recipient, Courier], code: 201, input: [claim_type], output: Dispute, side_effects: ["status=OPEN"] }
  - { method: POST,  path: "/disputes/{disputeId}/resolve", description: "Resolve a dispute",roles: [OperationsAdmin],   code: 200, input: [resolution], output: Dispute, side_effects: ["fee waiver / refund cascade per resolution"] }

  # --- Settlements ---
  - { method: POST,  path: "/settlements",                  description: "Create a SettlementBatch DRAFT",         roles: [OperationsAdmin], code: 201, input: [partner_id, period_start, period_end], output: SettlementBatch, side_effects: ["aggregations recomputed on each read"] }
  - { method: GET,   path: "/settlements",                  description: "List SettlementBatches",                 roles: [OperationsAdmin], code: 200, input: ["limit?","offset?","partner_id?"], output: "SettlementBatch[]", side_effects: [] }
  - { method: GET,   path: "/settlements/{batchId}",        description: "Get SettlementBatch (recomputes aggregations)", roles: [OperationsAdmin], code: 200, input: [], output: SettlementBatch, side_effects: [] }
  - { method: POST,  path: "/settlements/{batchId}/lock",   description: "Lock the batch (freeze totals)",         roles: [OperationsAdmin], code: 200, input: [], output: SettlementBatch, side_effects: ["status=LOCKED, AuditLog.SETTLEMENT_LOCK"] }
  - { method: POST,  path: "/settlements/{batchId}/settle", description: "Settle a locked batch",                  roles: [OperationsAdmin], code: 200, input: [], output: SettlementBatch, side_effects: ["status=SETTLED, payment-system payout event"] }

  # --- Test-driving / sync infrastructure ---
  - { method: POST,  path: "/_clock/advance",   description: "Advance test clock by N seconds (test harness)",       roles: [OperationsAdmin], code: 200, input: [seconds], output: "object{now}", side_effects: ["server clock now() advances; long_stay sweep does NOT auto-run"] }
  - { method: POST,  path: "/_sweep/run",       description: "Run long_stay_sweep (test harness)",                   roles: [OperationsAdmin], code: 200, input: [], output: "object{transitioned_count}", side_effects: ["Parcels deposited beyond LONG_STAY_THRESHOLD_HOURS → LONG_STAY"] }
  - { method: POST,  path: "/events/emit",      description: "External event ingress: payment_succeeded | payment_refunded | im_delivered | courier_company_ack", roles: [OperationsAdmin, system], code: 200, input: [event_type, payload], output: "object{accepted, idempotent}", side_effects: ["state cascades per event_type"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # Auth & request
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID/X-User-Role missing or invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS,               http: 403, condition: "Role lacks permission for endpoint" }
  - { id: ERR_INVALID_REQUEST,                        http: 400, condition: "Generic request schema/format error" }

  # Existence
  - { id: ERR_RESOURCE_NOT_FOUND,                     http: 404, condition: "Path-id resource does not exist (machineId / compartmentId / parcelId / courierId / disputeId / batchId / fee record id)" }

  # Machine & compartment
  - { id: ERR_MACHINE_OFFLINE_DEGRADED,               http: 409, condition: "LockerMachine.degraded_mode=true; new deposits rejected" }
  - { id: ERR_COMPARTMENT_ALREADY_RESERVED,           http: 409, condition: "Selected compartment is no longer AVAILABLE (race lost)" }
  - { id: ERR_OCCUPIED_COMPARTMENT_NEEDS_CLEAR,       http: 409, condition: "Cannot OUT_OF_SERVICE an OCCUPIED compartment without prior recall/dispose" }
  - { id: ERR_NO_COMPARTMENT_FITS,                    http: 409, condition: "No compartment with size >= required_size available for deposit" }
  - { id: ERR_CAPACITY_BLOCKED,                       http: 409, condition: "Per-size capacity_warning_level == FULL_BLOCK_DEPOSITS" }

  # Parcel state
  - { id: ERR_PARCEL_STATE_CHANGED,                   http: 409, condition: "Parcel not in expected status for requested transition" }
  - { id: ERR_RETRY_EXHAUSTED,                        http: 409, condition: "Parcel.failed_open_attempts >= MAX_RETRY (=3); confirm-deposit blocked" }
  - { id: ERR_WRONG_DEPOSIT_GRACE_EXPIRED,            http: 409, condition: "Wrong-deposit correction past WRONG_DEPOSIT_GRACE_SECONDS (=900) of deposited_at" }
  - { id: ERR_NOT_COURIER_OWNER,                      http: 403, condition: "Acting courier_id != Parcel.courier_id for /correct-wrong-deposit or /recall" }
  - { id: ERR_INVALID_PICKUP_CODE,                    http: 409, condition: "CODE/SMS_LINK/FACE auth failed at /initiate-pickup" }
  - { id: ERR_FEE_PAYMENT_REQUIRED,                   http: 402, condition: "Provisional overtime fee unpaid and not waived; /pickup-confirm blocked" }
  - { id: ERR_FEE_ZERO_NOT_PAYABLE,                   http: 409, condition: "Attempt to mark a 0-cents fee record PAID via payment_succeeded event" }

  # Courier
  - { id: ERR_COURIER_BLACKLISTED,                    http: 403, condition: "Courier.blacklist_status=BLACKLISTED, or RESTRICTED at non-NORMAL machine, or RESTRICTED with required_size=SMALL" }
  - { id: ERR_COURIER_RESTRICTED,                     http: 403, condition: "Courier.blacklist_status=RESTRICTED at machine with capacity_warning_level != NORMAL" }

  # Dispute & settlement
  - { id: ERR_DISPUTE_ALREADY_RESOLVED,               http: 409, condition: "Dispute.status not OPEN" }
  - { id: ERR_PERIOD_NOT_CLOSED,                      http: 409, condition: "SettlementBatch.lock attempted before period_end <= now()" }
  - { id: ERR_PENDING_FEES_IN_WINDOW,                 http: 409, condition: "Unpaid fees still present in window when locking settlement" }
  - { id: ERR_SETTLEMENT_LOCKED,                      http: 409, condition: "Mutation attempted on a LOCKED batch" }

  # Concurrency
  - { id: ERR_DUPLICATE_PAYMENT_EVENT,                http: 409, condition: "payment_succeeded with conflicting external_id for same OvertimeFeeRecord" }
  - { id: ERR_VERSION_CONFLICT,                       http: 409, condition: "If-Match version != current entity.version" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OperationsAdmin
    description: "Operator running the locker network: machine lifecycle, compartment ops, courier blacklist, disputes, settlements, audit"
    identity: opaque
    exclusive_operations:
      - "POST /locker-machines"
      - "POST /locker-machines/{id}/offline"
      - "POST /locker-machines/{id}/compartments"
      - "POST /locker-machines/{id}/compartments/{cid}/out-of-service"
      - "POST /locker-machines/{id}/compartments/{cid}/in-service"
      - "POST /couriers"
      - "POST /couriers/{id}/restrict"
      - "POST /couriers/{id}/blacklist"
      - "POST /couriers/{id}/reinstate"
      - "POST /parcels/{id}/return-to-sender"
      - "POST /parcels/{id}/dispose"
      - "POST /parcels/{id}/waive-fee"
      - "POST /disputes/{id}/resolve"
      - "POST /settlements"
      - "POST /settlements/{id}/lock"
      - "POST /settlements/{id}/settle"
      - "POST /_clock/advance"
      - "POST /_sweep/run"
      - "POST /events/emit"
      - "GET /locker-machines/{id}/audit-logs"
    shared_operations:
      - "GET /couriers/{id}, /couriers/{id}/rating"

  - name: Courier
    description: "Delivery courier depositing parcels and recalling long-stay items"
    identity: "entity_backed:Courier"
    exclusive_operations:
      - "POST /parcels"
      - "POST /parcels/{id}/confirm-deposit"
      - "POST /parcels/{id}/cancel-deposit"
      - "POST /parcels/{id}/retry-open"
      - "POST /parcels/{id}/correct-wrong-deposit"
      - "POST /parcels/{id}/recall"
    shared_operations:
      - "POST /parcels/{id}/disputes (Courier or Recipient)"
      - "GET /couriers/{self.id}/rating"

  - name: Recipient
    description: "End recipient picking up a parcel; identity is the phone number bound to a Parcel; X-User-ID equals Parcel.recipient_phone for endpoints scoped to a single parcel"
    identity: opaque
    exclusive_operations:
      - "POST /parcels/{id}/initiate-pickup"
      - "POST /parcels/{id}/pickup-confirm"
      - "POST /parcels/{id}/cancel-pickup"
    shared_operations:
      - "POST /parcels/{id}/disputes (Courier or Recipient)"

  - name: Any
    description: "Any authenticated role; used for read-only public-info endpoints"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /locker-machines, /locker-machines/{id}"
      - "GET /locker-machines/{id}/compartments, /locker-machines/{id}/compartments/{cid}"
      - "GET /parcels, /parcels/{id}, /parcels/{id}/fees"
