            - { call: "POST /restaurants", payload: { name: "Thai Garden", cuisine: "THAI", grid_x_km: 3.0, grid_y_km: 4.0, delivery_radius_km: 10.0 }, as: PlatformAdmin, captures: { rest_garden_id: $.data.id } }
            - { call: "POST /restaurants", payload: { name: "Thai Annex", cuisine: "THAI", grid_x_km: 0.0, grid_y_km: 5.0, delivery_radius_km: 10.0 }, as: PlatformAdmin, captures: { rest_annex_id: $.data.id } }
            - { call: "POST /restaurants", payload: { name: "Thai Local", cuisine: "THAI", grid_x_km: 0.0, grid_y_km: 3.0, delivery_radius_km: 2.0 }, as: PlatformAdmin, captures: { rest_local_id: $.data.id } }
            - { call: "POST /restaurants", payload: { name: "Salad Mid", cuisine: "SALAD", grid_x_km: 6.0, grid_y_km: 0.0, delivery_radius_km: 12.0 }, as: PlatformAdmin, captures: { rest_salad_id: $.data.id } }
            - { call: "POST /restaurants", payload: { name: "Sushi Nine", cuisine: "SUSHI", grid_x_km: 1.0, grid_y_km: 0.0, delivery_radius_km: 12.0 }, as: PlatformAdmin, captures: { rest_sushi_id: $.data.id } }
            - { call: "POST /restaurants", payload: { name: "Pizza Rim", cuisine: "PIZZA", grid_x_km: 0.0, grid_y_km: 9.0, delivery_radius_km: 12.0 }, as: PlatformAdmin, captures: { rest_pizza_id: $.data.id } }
          trigger:
            - { call: "GET /meal-programs/${prog_id}/eligible-restaurants", payload: { delivery_location_id: "${loc_id}" }, as: ProgramAdmin }
            - { call: "GET /meal-programs/${prog_id}/eligible-restaurants", payload: { delivery_location_id: "${loc_far_id}" }, as: ProgramAdmin }
          assert:
            - "the HQ Lobby listing returns exactly 3 rows in the order ${rest_annex_id} (Thai Annex, 5.000), ${rest_garden_id} (Thai Garden, 5.000), ${rest_salad_id} (Salad Mid, 6.000)"
            - "${rest_local_id} is absent because effective_limit is min(8.0, 2.0) == 2.0 and its distance is 3.000"
            - "${rest_sushi_id} is absent because SUSHI is not in eligible_cuisines even though it is only 1.000 km away"
            - "${rest_pizza_id} is absent because PIZZA is not in eligible_cuisines and 9.000 also exceeds 8.0"
