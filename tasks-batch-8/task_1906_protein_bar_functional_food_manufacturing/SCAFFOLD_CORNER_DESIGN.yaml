          trigger:
            - { call: "GET /mfg/formulas", payload: { customer_id: "${c1}" }, as: BrandCustomerRep, as_user_id: "${c1}" }
            - { call: "GET /mfg/formulas/${f2}", payload: {}, as: BrandCustomerRep, as_user_id: "${c1}", captures: { err: "$.data.error_id" } }
          assert:
