# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Deposit Operations & Account Maintenance. 9 rules x 2 instances = 18.
# All dates are literals against the logical clock (default 2026-08-01T00:00:00Z).
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: garnishment_exempt_federal_vs_state_floor
        grounds:
          - calculations.exempt_funds_analysis
          - entities.GarnishmentOrder.fields.exempt_amount_cents
          - entities.GarnishmentOrder.fields.collectible_cents
        distinguishing_aspect: |
          Entity domain GarnishmentOrder: identical balance and benefit history,
          exemption_method FEDERAL_LOOKBACK yields exempt 80000 while
          STATE_MINIMUM yields exempt 100000 (state floor 100000 exceeds the
          benefit total 80000) — two valid exemption statutes, different cents.
        test_recipe:
          setup:
            - "Account A: balance 200000, two FEDERAL_BENEFIT_DEPOSIT credits of 40000 each inside the 60-day lookback; garnishment claim 150000 served 2026-08-10 with FEDERAL_LOOKBACK"
            - "Account B: identical history; garnishment with STATE_MINIMUM"
          setup_api_calls:
            - call: "POST /bank/accounts"
              payload: { primary_owner_name: "Ann A", owner_tax_id: "T1", ownership_type: INDIVIDUAL, product_code: SAVINGS, rate_bps: 0, opening_deposit_cents: 200000 }
              as: OpsOfficer
              captures: { acct_a: $.data.id }
            - call: "POST /bank/accounts"
              payload: { primary_owner_name: "Bob B", owner_tax_id: "T2", ownership_type: INDIVIDUAL, product_code: SAVINGS, rate_bps: 0, opening_deposit_cents: 200000 }
              as: OpsOfficer
              captures: { acct_b: $.data.id }
            - call: "POST /bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: OpsManager
            - call: "POST /bank/accounts/${acct_a}/transactions"
              payload: { txn_type: FEDERAL_BENEFIT_DEPOSIT, amount_cents: 40000, customer_initiated: false, posted_date: "2026-08-03" }
              as: OpsOfficer
            - call: "POST /bank/accounts/${acct_a}/transactions"
              payload: { txn_type: FEDERAL_BENEFIT_DEPOSIT, amount_cents: 40000, customer_initiated: false, posted_date: "2026-08-10" }
              as: OpsOfficer
            - call: "POST /bank/accounts/${acct_b}/transactions"
              payload: { txn_type: FEDERAL_BENEFIT_DEPOSIT, amount_cents: 40000, customer_initiated: false, posted_date: "2026-08-03" }
              as: OpsOfficer
            - call: "POST /bank/accounts/${acct_b}/transactions"
              payload: { txn_type: FEDERAL_BENEFIT_DEPOSIT, amount_cents: 40000, customer_initiated: false, posted_date: "2026-08-10" }
              as: OpsOfficer
          trigger:
            - call: "POST /bank/accounts/${acct_a}/garnishments"
              payload: { order_type: GARNISHMENT, creditor_name: "CredCo", amount_cents: 150000, served_date: "2026-08-10", exemption_method: FEDERAL_LOOKBACK }
              as: OpsOfficer
              captures: { ord_a: $.data.id, exempt_a: $.data.exempt_amount_cents, collect_a: $.data.collectible_cents }
            - call: "POST /bank/accounts/${acct_b}/garnishments"
              payload: { order_type: GARNISHMENT, creditor_name: "CredCo", amount_cents: 150000, served_date: "2026-08-10", exemption_method: STATE_MINIMUM }
              as: OpsOfficer
              captures: { ord_b: $.data.id, exempt_b: $.data.exempt_amount_cents, collect_b: $.data.collectible_cents }
          assert:
            - "GarnishmentOrder.${ord_a}.held_amount_cents == 150000"
            - "GarnishmentOrder.${ord_a}.exempt_amount_cents == 80000"
            - "GarnishmentOrder.${ord_a}.collectible_cents == 70000"
            - "GarnishmentOrder.${ord_b}.exempt_amount_cents == 100000"
            - "GarnishmentOrder.${ord_b}.collectible_cents == 50000"
            - "${exempt_a} != ${exempt_b}"

      - name: estate_release_date_of_death_vs_date_of_release
        grounds:
          - calculations.estate_release_amount
          - entities.DeceasedCase.fields.release_amount_cents
          - state_machines.DeceasedCase.VERIFIED_to_RELEASE_PENDING
        distinguishing_aspect: |
          Entity domain DeceasedCase (distinct from GarnishmentOrder in the
          sibling instance): identical transaction history, release_variant
          DATE_OF_DEATH yields 100000 (frozen snapshot) while DATE_OF_RELEASE
          yields 150000 (live balance including the post-death 50000 credit).
        test_recipe:
          setup:
            - "Account A: balance 100000, rate 0; owner reported deceased 2026-08-01, case VERIFIED (snapshots 100000 + 0 interest)"
            - "Account B: identical"
            - "Post-death FEDERAL_BENEFIT_DEPOSIT 50000 lands on each account 2026-08-05"
            - "Each account holds VERIFIED DEATH_CERTIFICATE and LETTERS_TESTAMENTARY documents"
          setup_api_calls:
            - call: "POST /bank/accounts"
              payload: { primary_owner_name: "Dec A", owner_tax_id: "T3", ownership_type: INDIVIDUAL, product_code: SAVINGS, rate_bps: 0, opening_deposit_cents: 100000 }
              as: OpsOfficer
              captures: { acct_a: $.data.id }
            - call: "POST /bank/accounts"
              payload: { primary_owner_name: "Dec B", owner_tax_id: "T4", ownership_type: INDIVIDUAL, product_code: SAVINGS, rate_bps: 0, opening_deposit_cents: 100000 }
              as: OpsOfficer
              captures: { acct_b: $.data.id }
            - call: "POST /bank/accounts/${acct_a}/documents"
              payload: { doc_type: DEATH_CERTIFICATE, reference_number: "DC-A" }
              as: OpsOfficer
              captures: { doc_a1: $.data.id }
            - call: "POST /bank/accounts/${acct_a}/documents"
              payload: { doc_type: LETTERS_TESTAMENTARY, reference_number: "LT-A" }
              as: OpsOfficer
              captures: { doc_a2: $.data.id }
            - call: "POST /bank/accounts/${acct_b}/documents"
              payload: { doc_type: DEATH_CERTIFICATE, reference_number: "DC-B" }
              as: OpsOfficer
              captures: { doc_b1: $.data.id }
            - call: "POST /bank/accounts/${acct_b}/documents"
              payload: { doc_type: LETTERS_TESTAMENTARY, reference_number: "LT-B" }
              as: OpsOfficer
              captures: { doc_b2: $.data.id }
            - call: "POST /bank/documents/${doc_a1}/review"
              payload: { decision: VERIFIED }
              as: OpsManager
            - call: "POST /bank/documents/${doc_a2}/review"
              payload: { decision: VERIFIED }
              as: OpsManager
            - call: "POST /bank/documents/${doc_b1}/review"
              payload: { decision: VERIFIED }
              as: OpsManager
            - call: "POST /bank/documents/${doc_b2}/review"
              payload: { decision: VERIFIED }
              as: OpsManager
            - call: "POST /bank/accounts/${acct_a}/deceased-cases"
              payload: { decedent_name: "Dec A", date_of_death: "2026-08-01", reported_by: "Kin A" }
              as: OpsOfficer
              captures: { case_a: $.data.id }
            - call: "POST /bank/accounts/${acct_b}/deceased-cases"
              payload: { decedent_name: "Dec B", date_of_death: "2026-08-01", reported_by: "Kin B" }
              as: OpsOfficer
              captures: { case_b: $.data.id }
            - call: "POST /bank/deceased-cases/${case_a}/verify"
              payload: {}
              as: OpsManager
            - call: "POST /bank/deceased-cases/${case_b}/verify"
              payload: {}
              as: OpsManager
            - call: "POST /bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: OpsManager
            - call: "POST /bank/accounts/${acct_a}/transactions"
              payload: { txn_type: FEDERAL_BENEFIT_DEPOSIT, amount_cents: 50000, customer_initiated: false, posted_date: "2026-08-05" }
              as: OpsOfficer
            - call: "POST /bank/accounts/${acct_b}/transactions"
              payload: { txn_type: FEDERAL_BENEFIT_DEPOSIT, amount_cents: 50000, customer_initiated: false, posted_date: "2026-08-05" }
              as: OpsOfficer
          trigger:
            - call: "POST /bank/deceased-cases/${case_a}/initiate-release"
              payload: { release_variant: DATE_OF_DEATH, estate_representative_name: "Exec A" }
              as: OpsOfficer
              captures: { rel_a: $.data.release_amount_cents }
            - call: "POST /bank/deceased-cases/${case_b}/initiate-release"
              payload: { release_variant: DATE_OF_RELEASE, estate_representative_name: "Exec B" }
              as: OpsOfficer
              captures: { rel_b: $.data.release_amount_cents }
          assert:
            - "DeceasedCase.${case_a}.release_amount_cents == 100000"
            - "DeceasedCase.${case_b}.release_amount_cents == 150000"
            - "${rel_a} != ${rel_b}"

  - rule_id: combinatorial_formula
    instances:
      - name: exempt_funds_nested_min_max_all_clauses_bind
        grounds:
          - calculations.exempt_funds_analysis
          - entities.GarnishmentOrder.fields.held_amount_cents
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: held=min(CLAIM, AV),
          exempt=min(B, benefit_total), collectible=max(0, held-exempt); here
          CLAIM(50000) binds held, benefit_total(60000) binds exempt, and the
          max clamps collectible to exactly 0 — each nested clause decides once.
        test_recipe:
          setup:
            - "Account balance 80000 with one FEDERAL_BENEFIT_DEPOSIT of 60000 in lookback"
          setup_api_calls:
            - call: "POST /bank/accounts"
              payload: { primary_owner_name: "Ned N", owner_tax_id: "T5", ownership_type: INDIVIDUAL, product_code: SAVINGS, rate_bps: 0, opening_deposit_cents: 80000 }
              as: OpsOfficer
              captures: { acct: $.data.id }
            - call: "POST /bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: OpsManager
            - call: "POST /bank/accounts/${acct}/transactions"
              payload: { txn_type: FEDERAL_BENEFIT_DEPOSIT, amount_cents: 60000, customer_initiated: false, posted_date: "2026-08-05" }
              as: OpsOfficer
          trigger:
            - call: "POST /bank/accounts/${acct}/garnishments"
              payload: { order_type: TAX_LEVY, creditor_name: "RevAuth", amount_cents: 50000, served_date: "2026-08-10", exemption_method: FEDERAL_LOOKBACK }
              as: OpsOfficer
              captures: { ord: $.data.id, held: $.data.held_amount_cents, exempt: $.data.exempt_amount_cents, collect: $.data.collectible_cents }
          assert:
            - "GarnishmentOrder.${ord}.held_amount_cents == 50000"
            - "GarnishmentOrder.${ord}.exempt_amount_cents == 60000"
            - "GarnishmentOrder.${ord}.collectible_cents == 0"
            - "DepositAccount.${acct}.available_balance_cents == 30000"

      - name: interest_rounding_per_day_vs_round_at_end
        grounds:
          - calculations.accrued_interest_settlement
          - entities.ProductConversion.fields.accrued_interest_settled_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order (distinct from mode (a) above):
          SAVINGS settles STANDARD (round each day, then sum) = 42 for 3 days at
          500bps on 100000; MONEY_MARKET settles SIMPLE (sum raw, round once) =
          41 for the identical balance series — rounding order changes the cents.
        test_recipe:
          setup:
            - "Account A: SAVINGS, rate 500, opening 100000 on 2026-08-01; conversion to BASIC_CHECKING effective 2026-08-04"
            - "Account B: MONEY_MARKET, rate 500, opening 100000 on 2026-08-01; conversion to PREMIUM_CHECKING effective 2026-08-04"
            - "Interest window [2026-08-01, 2026-08-04) = 3 days at constant balance 100000"
          setup_api_calls:
            - call: "POST /bank/accounts"
              payload: { primary_owner_name: "Sav S", owner_tax_id: "T6", ownership_type: INDIVIDUAL, product_code: SAVINGS, rate_bps: 500, opening_deposit_cents: 100000 }
              as: OpsOfficer
              captures: { acct_a: $.data.id }
            - call: "POST /bank/accounts"
              payload: { primary_owner_name: "Mm M", owner_tax_id: "T7", ownership_type: INDIVIDUAL, product_code: MONEY_MARKET, rate_bps: 500, opening_deposit_cents: 100000 }
              as: OpsOfficer
              captures: { acct_b: $.data.id }
            - call: "POST /bank/accounts/${acct_a}/conversions"
              payload: { to_product_code: BASIC_CHECKING, new_rate_bps: 100, effective_date: "2026-08-04" }
              as: OpsOfficer
              captures: { conv_a: $.data.id }
            - call: "POST /bank/accounts/${acct_b}/conversions"
              payload: { to_product_code: PREMIUM_CHECKING, new_rate_bps: 100, effective_date: "2026-08-04" }
              as: OpsOfficer
              captures: { conv_b: $.data.id }
            - call: "POST /bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: OpsManager
          trigger:
            - call: "POST /bank/conversions/${conv_a}/execute"
              payload: {}
              as: OpsOfficer
              captures: { settled_a: $.data.accrued_interest_settled_cents }
            - call: "POST /bank/conversions/${conv_b}/execute"
              payload: {}
              as: OpsOfficer
              captures: { settled_b: $.data.accrued_interest_settled_cents }
          assert:
            - "ProductConversion.${conv_a}.accrued_interest_settled_cents == 42"
            - "ProductConversion.${conv_b}.accrued_interest_settled_cents == 41"
            - "${settled_a} != ${settled_b}"
            - "DepositAccount.${acct_a}.balance_cents == 100042"
            - "DepositAccount.${acct_b}.balance_cents == 100041"

  - rule_id: non_linear_state_machine
    instances:
      - name: account_parallel_dimensions_dormant_under_legal_hold
        grounds:
          - state_machines.DepositAccount
          - entities.DepositAccount.fields.lifecycle_status
          - entities.DepositAccount.fields.restriction_status
        distinguishing_aspect: |
          DepositAccount carries two parallel state dimensions that evolve
          independently: the account goes lifecycle OPEN->DORMANT while
          restriction stays LEGAL_HOLD, then the garnishment release flips
          restriction LEGAL_HOLD->NONE while lifecycle stays DORMANT.
        test_recipe:
          setup:
            - "Account OPEN with balance 100000, last activity 2026-08-01, garnishment hold 50000 in place (restriction LEGAL_HOLD)"
          setup_api_calls:
            - call: "POST /bank/accounts"
              payload: { primary_owner_name: "Par P", owner_tax_id: "T8", ownership_type: INDIVIDUAL, product_code: SAVINGS, rate_bps: 0, opening_deposit_cents: 100000 }
              as: OpsOfficer
              captures: { acct: $.data.id }
            - call: "POST /bank/accounts/${acct}/garnishments"
              payload: { order_type: GARNISHMENT, creditor_name: "CredCo", amount_cents: 50000, served_date: "2026-08-01", exemption_method: FEDERAL_LOOKBACK }
              as: OpsOfficer
              as_user_id: "u-off-1"
              captures: { ord: $.data.id }
            - call: "POST /bank/_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-01T00:00:00Z" }
              as: OpsManager
            - call: "POST /bank/ops/daily-sweep"
              payload: {}
              as: OpsManager
          trigger:
            - call: "GET /bank/accounts/${acct}"
              payload: {}
              as: OpsManager
              captures: { lc_1: $.data.lifecycle_status, rs_1: $.data.restriction_status }
            - call: "POST /bank/garnishments/${ord}/resolve"
              payload: { resolution: RELEASED }
              as: OpsManager
              as_user_id: "u-mgr-2"
            - call: "GET /bank/accounts/${acct}"
              payload: {}
              as: OpsManager
              captures: { lc_2: $.data.lifecycle_status, rs_2: $.data.restriction_status, avail_2: $.data.available_balance_cents }
          assert:
            - "${lc_1} == DORMANT"
            - "${rs_1} == LEGAL_HOLD"
            - "DepositAccount.${acct}.balance_cents == 99500"
            - "${lc_2} == DORMANT"
            - "${rs_2} == NONE"
            - "${avail_2} == 99500"

      - name: title_change_reject_resubmit_cycle
        grounds:
          - state_machines.TitleChangeRequest.REJECTED_to_SUBMITTED
          - state_machines.TitleChangeRequest.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          TitleChangeRequest (different entity from DepositAccount) runs a
          revision loop SUBMITTED->REJECTED->SUBMITTED->APPROVED; the REJECTED
          pass clears decision_reason on resubmit and the final APPROVED pass
          mutates the account — a cycle, not a pipeline.
        test_recipe:
          setup:
            - "Account INDIVIDUAL balance 50000; title change to POD filed, rejected once, resubmitted, POD_DESIGNATION document verified"
          setup_api_calls:
            - call: "POST /bank/accounts"
              payload: { primary_owner_name: "Tit T", owner_tax_id: "T9", ownership_type: INDIVIDUAL, product_code: SAVINGS, rate_bps: 0, opening_deposit_cents: 50000 }
              as: OpsOfficer
              captures: { acct: $.data.id, v0: $.data.version }
            - call: "POST /bank/accounts/${acct}/title-changes"
              payload: { requested_ownership_type: POD, pod_beneficiary_name: "Bene A", expected_account_version: "${v0}" }
              as: OpsOfficer
              as_user_id: "u-off-1"
              captures: { req: $.data.id }
            - call: "POST /bank/title-changes/${req}/reject"
              payload: { reason: "missing pod designation" }
              as: OpsManager
              captures: { st_rej: $.data.status }
            - call: "POST /bank/title-changes/${req}/resubmit"
              payload: {}
              as: OpsOfficer
              captures: { st_resub: $.data.status }
            - call: "POST /bank/accounts/${acct}/documents"
              payload: { doc_type: POD_DESIGNATION, reference_number: "POD-1" }
              as: OpsOfficer
              captures: { doc: $.data.id }
            - call: "POST /bank/documents/${doc}/review"
              payload: { decision: VERIFIED }
              as: OpsManager
          trigger:
            - call: "POST /bank/title-changes/${req}/approve"
              payload: {}
              as: OpsManager
              as_user_id: "u-mgr-2"
              captures: { st_fin: $.data.status }
            - call: "GET /bank/accounts/${acct}"
              payload: {}
              as: OpsManager
              captures: { own_fin: $.data.ownership_type, pod_fin: $.data.pod_beneficiary_name }
          assert:
            - "${st_rej} == REJECTED"
            - "TitleChangeRequest.${req}.decision_reason == 'missing pod designation' after reject"
            - "${st_resub} == SUBMITTED"
            - "TitleChangeRequest.${req}.decision_reason == null after resubmit"
            - "${st_fin} == APPROVED"
            - "${own_fin} == POD"
            - "${pod_fin} == 'Bene A'"

  - rule_id: transitive_cascade
    instances:
      - name: dormancy_fee_zero_balance_auto_close_chain
        grounds:
          - state_machines.DepositAccount
          - calculations.inactivity_fee_assessment
          - calculations.dormancy_evaluation
        distinguishing_aspect: |
          Trigger daily-sweep, depth >= 3 with each link caused by the previous:
          sweep transitions account OPEN->DORMANT (link 1); entering DORMANT
          assesses inactivity fees (link 2); a fee drains balance to exactly 0
          which auto-closes the account (link 3); closure then cancels the
          SCHEDULED conversion, removes the signer, and suppresses the
          SCHEDULED statement cycle (link 4).
        test_recipe:
          setup:
            - "Account balance 1000, rate 0, opened 2026-08-01 with one ACTIVE signer and one SCHEDULED conversion (effective 2026-09-01) and one SCHEDULED statement cycle [2027-09-01, 2027-10-01)"
            - "Clock advanced to 2027-08-01 (365 days inactive) then to 2027-08-31 (395 days)"
          setup_api_calls:
            - call: "POST /bank/accounts"
              payload: { primary_owner_name: "Dor D", owner_tax_id: "T10", ownership_type: INDIVIDUAL, product_code: SAVINGS, rate_bps: 0, opening_deposit_cents: 1000 }
              as: OpsOfficer
              captures: { acct: $.data.id }
            - call: "POST /bank/accounts/${acct}/documents"
              payload: { doc_type: SIGNATURE_CARD, reference_number: "SC-1" }
              as: OpsOfficer
              captures: { doc: $.data.id }
            - call: "POST /bank/documents/${doc}/review"
              payload: { decision: VERIFIED }
              as: OpsManager
            - call: "POST /bank/accounts/${acct}/signers"
              payload: { full_name: "Sig S", tax_id: "TS1", signer_role: AUTHORIZED_SIGNER, signature_card_reference: "SC-1" }
              as: OpsOfficer
              captures: { signer: $.data.id }
            - call: "POST /bank/accounts/${acct}/conversions"
              payload: { to_product_code: BASIC_CHECKING, new_rate_bps: 100, effective_date: "2026-09-01" }
              as: OpsOfficer
              captures: { conv: $.data.id }
            - call: "POST /bank/accounts/${acct}/statement-cycles"
              payload: { cycle_start: "2027-09-01", cycle_end: "2027-10-01" }
              as: OpsOfficer
              captures: { cyc: $.data.id }
            - call: "POST /bank/_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-01T00:00:00Z" }
              as: OpsManager
            - call: "POST /bank/ops/daily-sweep"
              payload: {}
              as: OpsManager
              captures: { sweep1_dormant: $.data.newly_dormant, sweep1_fees: $.data.fees_assessed_cents }
          trigger:
            - call: "POST /bank/_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-31T00:00:00Z" }
              as: OpsManager
            - call: "POST /bank/ops/daily-sweep"
              payload: {}
              as: OpsManager
              captures: { sweep2_fees_n: $.data.fees_assessed_count, sweep2_fees_c: $.data.fees_assessed_cents, sweep2_closed: $.data.auto_closed_count }
            - call: "GET /bank/accounts/${acct}"
              payload: {}
              as: OpsManager
              captures: { lc: $.data.lifecycle_status, bal: $.data.balance_cents, payout: $.data.closure_payout_cents }
            - call: "GET /bank/accounts/${acct}/signers"
              payload: {}
              as: OpsManager
              captures: { signer_st: "$.data[0].status", signer_rr: "$.data[0].removed_reason"}
            - call: "GET /bank/accounts/${acct}/conversions"
              payload: {}
              as: OpsManager
              captures: { conv_st: "$.data[0].status"}
            - call: "GET /bank/accounts/${acct}/statement-cycles"
              payload: {}
              as: OpsManager
              captures: { cyc_st: "$.data[0].status", cyc_sr: "$.data[0].suppression_reason"}
          assert:
            - "${sweep1_dormant} == 1"
            - "${sweep1_fees} == 500"
            - "${sweep2_fees_n} == 1"
            - "${sweep2_fees_c} == 500"
            - "${sweep2_closed} == 1"
            - "${lc} == CLOSED"
            - "${bal} == 0"
            - "${payout} == 0"
            - "${signer_st} == REMOVED"
            - "${signer_rr} == ACCOUNT_CLOSED"
            - "${conv_st} == CANCELLED"
            - "${cyc_st} == SUPPRESSED"
            - "${cyc_sr} == CLOSED"

      - name: deceased_verify_signer_suspension_chain
        grounds:
          - state_machines.DeceasedCase.REPORTED_to_VERIFIED
          - state_machines.DepositAccount
          - state_machines.AuthorizedSigner.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Trigger deceased-case verify (different trigger from daily-sweep),
          depth >= 2: case REPORTED->VERIFIED flips the account restriction to
          DECEASED_HOLD (link 1), and entering DECEASED_HOLD suspends every
          ACTIVE signer and auto-rejects every SUBMITTED title request (link 2).
        test_recipe:
          setup:
