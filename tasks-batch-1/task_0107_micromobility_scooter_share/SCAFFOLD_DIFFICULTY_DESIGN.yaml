          trigger:
            - call: "POST /api/trips/${trip_id}/end"
              payload: { end_zone_id: "${zone_ok_id}" }
              as: Rider
              as_user_id: "${rider_id}"
            - call: "GET /api/vehicles/${veh_id}"
              payload: {}
              as: PlatformAdmin
              captures: { veh_status: $.data.status }
            - call: "GET /api/rebalancing-tasks?vehicle_id=${veh_id}"
