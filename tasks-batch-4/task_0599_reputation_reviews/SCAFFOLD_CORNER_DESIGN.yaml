  # =========================================================================
  # Errors
  # =========================================================================
  - section: errors
    instances:
      - name: missing_role_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
        distinguishing_aspect: "A request with no X-User-Role header is refused with 401 ERR_UNAUTHENTICATED before any existence or state check runs."
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
          trigger:
            - call: "GET /reputation/businesses/${biz_id}"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the trigger is re-issued with the X-User-Role header omitted entirely"
            - "HTTP status == 401"
            - "error_id == ERR_UNAUTHENTICATED"

      - name: error_frequency_cap_active_on_enqueue
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FREQUENCY_CAP_ACTIVE]
        excluded_because:
