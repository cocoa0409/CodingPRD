# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2883_police_recruit_academy_field_training
#
# 9 rule_id blocks / 21 instances. Every numeric assert below was executed
# against the SCAFFOLD.yaml calculations before being written down.
#
# Recurring literal actor ids (all opaque roles): dir-1 (AcademyDirector),
# tc-1 / tc-2 (TrainingCoordinator), bi-1 / bi-2 (BackgroundInvestigator),
# me-1 / me-2 (MedicalExaminer). The two-user pairs exist because the
# segregation-of-duties rule (ERR_SAME_ACTOR_ADJUDICATION) forbids the
# findings recorder from adjudicating the same screening.
# entity_backed roles (AcademyInstructor, FieldTrainingOfficer, Recruit) always
# carry as_user_id: ${<captured entity id>}.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: attended_basis_vs_scheduled_basis_diverge_on_partial_attendance
        grounds:
          - calculations.certified_hours_variant
          - calculations.topic_hours_ledger
          - entities.Recruit.fields.credited_hours_total
          - entities.Recruit.fields.scheduled_basis_hours_total
          - endpoints[GET /recruits/{recruitId}/certification-progress]
        distinguishing_aspect: |
          Both variants read the identical CREDITED-on-DELIVERED row set; ATTENDED_BASIS
          contributes ROUND_HALF_UP(present_hours * 0.75, 2) per row while SCHEDULED_BASIS
          contributes the whole CourseSession.scheduled_hours, so the same three rows
          report 3.39 and 6.00 in the same request.
        test_recipe:
          setup:
            - "One CertificationStandard requiring 6.00 PATROL hours with no examination, max_absence_hours 4.00."
            - "One AcademyClass on that standard, one Recruit cleared through all four screenings and advanced to pipeline_stage ACADEMY (academy_status IN_PROGRESS)."
            - "Three DELIVERED 2.00-hour PATROL CourseSessions, each with a single AttendanceRecord status PARTIAL and present_hours 1.50."
            - "Logical clock at 2026-08-12T12:00:00Z, after every session's ends_at."
          setup_api_calls:
            - call: "POST /certification-standards"
              payload: { code: "TCOLE-BASIC-A", state_code: "TX", min_total_hours: 6.00, min_passing_score: 70.00, max_remediation_attempts: 1, max_absence_hours: 4.00, topic_requirements: [{ topic_code: "PATROL", required_hours: 6.00, exam_required: false }], fitness_event_floor_points: 10, fitness_pass_score: 60 }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { std_id: $.data.id }
            - call: "POST /academy-classes"
              payload: { certification_standard_id: "${std_id}", class_code: "CLS-A", start_date: "2026-08-03", planned_seats: 30 }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { class_id: $.data.id }
            - call: "POST /instructors"
              payload: { badge_number: "B-100", full_name: "Ivy Nash" }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { instr_id: $.data.id }
            - call: "POST /instructors/${instr_id}/certify"
              payload: { certification_expires_at: "2027-08-01T00:00:00Z", authorized_topic_codes: ["PATROL"], fto_certified: true }
              as: AcademyDirector
              as_user_id: "dir-1"
            - call: "POST /lesson-plans"
              payload: { instructor_id: "${instr_id}", topic_code: "PATROL", title: "Patrol Operations", contact_hours: 2.00 }
              as: AcademyInstructor
              as_user_id: "${instr_id}"
              captures: { lp_id: $.data.id }
            - call: "POST /lesson-plans/${lp_id}/approve"
              payload: {}
              as: AcademyDirector
              as_user_id: "dir-1"
            - call: "POST /recruits"
              payload: { academy_class_id: "${class_id}", applicant_number: "A-001", full_name: "Rae Ortiz", date_of_birth: "1999-04-12", age_bracket: "AGE_20_29" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
              captures: { rec_id: $.data.id }
            - call: "POST /recruits/${rec_id}/screenings"
              payload: { screening_type: "BACKGROUND" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
              captures: { scr_bg_id: $.data.id }
            - call: "POST /screening-records/${scr_bg_id}/findings"
              payload: { raw_metrics: { summary: "no adverse history" }, disqualifier_codes: [] }
              as: BackgroundInvestigator
              as_user_id: "bi-1"
            - call: "POST /screening-records/${scr_bg_id}/adjudicate"
              payload: { decision: "CLEAR" }
              as: BackgroundInvestigator
              as_user_id: "bi-2"
            - call: "POST /recruits/${rec_id}/screenings"
              payload: { screening_type: "MEDICAL" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
              captures: { scr_med_id: $.data.id }
            - call: "POST /screening-records/${scr_med_id}/findings"
              payload: { raw_metrics: { summary: "fit for duty" }, disqualifier_codes: [] }
              as: MedicalExaminer
              as_user_id: "me-1"
            - call: "POST /screening-records/${scr_med_id}/adjudicate"
              payload: { decision: "CLEAR" }
              as: MedicalExaminer
              as_user_id: "me-2"
            - call: "POST /recruits/${rec_id}/screenings"
              payload: { screening_type: "PSYCHOLOGICAL" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
              captures: { scr_psy_id: $.data.id }
            - call: "POST /screening-records/${scr_psy_id}/findings"
