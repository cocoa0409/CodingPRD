            - "StorageAsset.${tank_id}.opening_balance_tons == 0"
            - "StorageAsset.${tank_id}.on_hand_tons == 0.000"
            - "StorageAsset.${tank_id}.available_tons == 0.000"
            - "StorageAsset.${tank_id}.version == 1"

