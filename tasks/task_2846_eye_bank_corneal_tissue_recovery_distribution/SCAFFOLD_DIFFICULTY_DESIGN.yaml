  - rule_id: compensating_invariant
    instances:

      - name: reservation_then_cancellation_restores_the_tissue_unit_ledger
        grounds:
          - calculations.tissue_availability_ledger
          - endpoints."POST /eye-bank/allocations"
          - endpoints."POST /eye-bank/allocations/{id}/cancel"
          - state_machines.CorneaTissue.disposition_status
        distinguishing_aspect: |
          The conserved quantity is a UNIT COUNT read through the filtered-list total_count:
          available + committed + held + retired == graded at every observable instant. Reserving a
          tissue moves one unit from available to committed and cancelling moves it back, so the
          before and after counts must be byte-identical (2/0) with the intermediate state (1/1)
          proving the move really happened; the sum never changes at any of the three instants.
