        claim_type: response_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "Object reads wrap data with meta.api_request_id + api_request_timestamp and response_type object; list reads use response_type array with limit/offset/total_count/has_more; errors carry data.error_id + message."
        test_recipe:
          setup: ["one customer exists"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Briscoe", account_number: "BR-360", credit_limit_cents: 500000, warranty_terms_days: 365 }, as: ServiceManager, captures: { cust: $.data.id } }
          trigger:
            - { call: "GET /customers/${cust}", payload: {}, as: ServiceManager }
            - { call: "GET /customers", payload: {}, as: ServiceManager }
            - { call: "GET /customers/123e4567-e89b-42d3-a456-426614174000", payload: {}, as: ServiceManager, captures: { err: $.data.error_id } }
          assert:
            - "GET single: response_type == object, meta.api_request_id present, meta.api_request_timestamp present"
            - "GET list: response_type == array with pagination fields limit, offset, total_count, has_more (defaults limit=10, offset=0)"
            - "error response: response_type == error, data.error_id == ERR_NOT_FOUND, data.message present"

