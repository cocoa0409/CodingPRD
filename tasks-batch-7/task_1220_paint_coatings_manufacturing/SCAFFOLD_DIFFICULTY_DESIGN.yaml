            - "After settle: Customer.${cu1}.credit_balance_cents == 20000 and credit_used_ytd_cents == 20000"
            - "After void: Customer.${cu1}.credit_balance_cents == 0 and credit_used_ytd_cents == 0 (settle/void pair is the identity on the ledger)"
            - "CreditClaim.${cl1}.status == VOIDED; ledger invariant credit_balance_cents == sum(final_credit_cents over SETTLED claims) holds at every step"

      - name: mill_reserve_release_minutes_identity
        grounds:
          - calculations.mill_reservation
          - state_machines.Batch.PLANNED_to_CANCELLED
          - entities.Mill.fields.reserved_minutes
        distinguishing_aspect: |
          Conserved quantity is machine-time, not money: creating a batch reserves
          its window minutes on the mill and cancelling the batch releases exactly
          those minutes, so mill.reserved_minutes returns to 0 — the reserve/release
          pair composes to the identity with no drift across repetitions.
        test_recipe:
          setup:
            - "F1 ACTIVE; M1 ACTIVE capacity 200"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /coatings/tint-bases"
              payload: { base_code: "B-100", product_category: "NONFLAT", base_family: "LATEX_EXTERIOR", base_voc_gpl: 80, water_fraction_pct: 40, density_kg_per_gal: 4.6, base_cost_per_gal_cents: 1500, unit_price_per_gal_cents: 3200, shelf_life_months: 24, grind_spec_um: 25 }
              as: LabTechnician
              captures: { tb1: $.data.id }
            - call: "POST /coatings/colorants"
              payload: { colorant_code: "MAG-7", voc_g_per_unit: 5, cost_per_shot_cents: 30, is_hazmat: false }
              as: LabTechnician
              captures: { c1: $.data.id }
            - call: "POST /coatings/formulas"
              payload: { formula_code: "CLR-8841", color_name: "Desert Dusk", tint_base_id: "${tb1}", is_custom: false, target_delta_e: 0.8, lines: [ { colorant_id: "${c1}", shots_per_gallon: 4, sequence: 1 } ] }
              as: LabTechnician
              captures: { f1: $.data.id }
            - { call: "POST /coatings/formulas/${f1}/activate", payload: {}, as: LabTechnician }
            - call: "POST /coatings/mills"
              payload: { mill_code: "M-1", capacity_gallons: 200 }
              as: PlantManager
              captures: { m1: $.data.id }
          trigger:
            - { call: "POST /coatings/batches", payload: { formula_id: "${f1}", mill_id: "${m1}", planned_gallons: 3, mill_window_start: "2026-06-10T08:00:00Z", mill_window_end: "2026-06-10T12:00:00Z" }, as: ProductionOperator, captures: { b1: $.data.id } }
            - { call: "POST /coatings/batches", payload: { formula_id: "${f1}", mill_id: "${m1}", planned_gallons: 3, mill_window_start: "2026-06-11T08:00:00Z", mill_window_end: "2026-06-11T10:00:00Z" }, as: ProductionOperator, captures: { b2: $.data.id } }
            - { call: "POST /coatings/batches/${b1}/cancel", payload: {}, as: ProductionOperator }
            - { call: "POST /coatings/batches/${b2}/cancel", payload: {}, as: ProductionOperator }
          assert:
            - "After both creates: Mill.${m1}.reserved_minutes == 360 (240 + 120)"
            - "After first cancel: Mill.${m1}.reserved_minutes == 120 (release subtracts exactly the cancelled window)"
            - "After second cancel: Mill.${m1}.reserved_minutes == 0 (reserve/release pair is the identity on machine-time)"
            - "Batch.${b1}.status == CANCELLED and Batch.${b2}.status == CANCELLED"
