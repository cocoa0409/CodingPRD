              as: HerdManager
              captures: { mvo3: $.data.id }
            - call: "GET /animals/${ao1}"
              as: HerdManager
              captures: { ao1_v3: $.data.version }
          trigger:
            - call: "POST /movement-records/${mvo3}/apply"
              payload: { expected_animal_version: "${ao1_v3}" }
              as: HerdManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_REST_PERIOD_VIOLATION"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: pasture_au_conservation_apply_then_revert
        grounds:
          - state_machines.MovementRecord.PLANNED_to_APPLIED
          - state_machines.MovementRecord.APPLIED_to_REVERTED
          - calculations.animal_unit_load
          - entities.Pasture.fields.current_au_load
        distinguishing_aspect: "Conserved quantity = total AU. After applying a movement (destination +1.0 AU) then reverting it, destination Pasture.current_au_load returns to 0.0 and the origin pasture's load is restored — the named invariant Pasture.current_au_load(dest) + Pasture.current_au_load(origin) is unchanged by the apply/revert pair."
        test_recipe:
          setup:
            - "Clock 2026-04-01. Herd, two PENs (A capacity 10, B capacity 10), one 454 kg animal applied into A (A load 1.0). Plan and apply a move A->B (A load 0.0, B load 1.0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "H17", species: "CATTLE", premises_id: "PR-0398-17" }
              as: HerdManager
              captures: { herd17: $.data.id }
            - call: "POST /pastures"
              payload: { name: "PenA17", kind: "PEN", capacity_au: 10 }
              as: HerdManager
              captures: { penA: $.data.id }
            - call: "POST /pastures"
              payload: { name: "PenB17", kind: "PEN", capacity_au: 10 }
              as: HerdManager
              captures: { penB: $.data.id }
            - call: "POST /animals"
              payload: { herd_id: "${herd17}", ear_tag: "P001", sex: "STEER", birth_date: "2024-01-01", birth_weight_kg: 40.0 }
              as: HerdManager
              captures: { ap1: $.data.id }
            - call: "POST /animals/${ap1}/weights"
              payload: { weighed_at: "2026-03-20", weight_kg: 454.0 }
              as: HerdManager
            - call: "POST /movement-records"
              payload: { animal_id: "${ap1}", to_pasture_id: "${penA}", effective_from: "2026-03-21T00:00:00Z" }
              as: HerdManager
              captures: { mvp1: $.data.id }
            - call: "GET /animals/${ap1}"
              as: HerdManager
              captures: { ap1_v1: $.data.version }
            - call: "POST /movement-records/${mvp1}/apply"
              payload: { expected_animal_version: "${ap1_v1}" }
              as: HerdManager
            - call: "POST /movement-records"
              payload: { animal_id: "${ap1}", to_pasture_id: "${penB}", effective_from: "2026-03-22T00:00:00Z" }
              as: HerdManager
              captures: { mvp2: $.data.id }
            - call: "GET /animals/${ap1}"
              as: HerdManager
              captures: { ap1_v2: $.data.version }
            - call: "POST /movement-records/${mvp2}/apply"
              payload: { expected_animal_version: "${ap1_v2}" }
              as: HerdManager
          trigger:
            - call: "POST /movement-records/${mvp2}/revert"
              as: HerdManager
          assert:
            - "MovementRecord.${mvp2}.status == REVERTED"
            - "Pasture.${penB}.current_au_load == 0.0"
            - "Pasture.${penA}.current_au_load == 1.0"
            - "Animal.${ap1}.current_pasture_id == ${penA}"

      - name: herd_headcount_conservation_mortality_then_void
        grounds:
          - state_machines.MortalityRecord.RECORDED_to_VOIDED
          - state_machines.Animal.ACTIVE_to_DEAD
          - state_machines.Animal.DEAD_to_ACTIVE
          - entities.Herd.fields.active_animal_count
        distinguishing_aspect: "Conserved quantity = herd head count. Recording a death (active_animal_count 2->1) then voiding it (1->2) leaves Herd.active_animal_count at its original 2 — the invariant active_animal_count is unchanged by the record/void pair, a different conserved quantity than AU."
        test_recipe:
          setup:
            - "Clock 2026-04-01. Herd with two ACTIVE animals (active_animal_count 2). Record the death of one (count -> 1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "H18", species: "CATTLE", premises_id: "PR-0398-18" }
              as: HerdManager
              captures: { herd18: $.data.id }
            - call: "POST /animals"
              payload: { herd_id: "${herd18}", ear_tag: "Q001", sex: "STEER", birth_date: "2024-01-01", birth_weight_kg: 40.0 }
              as: HerdManager
              captures: { aq1: $.data.id }
            - call: "POST /animals"
              payload: { herd_id: "${herd18}", ear_tag: "Q002", sex: "STEER", birth_date: "2024-01-01", birth_weight_kg: 40.0 }
              as: HerdManager
              captures: { aq2: $.data.id }
            - call: "POST /mortality-records"
              payload: { animal_id: "${aq1}", died_on: "2026-03-30", cause: "ACCIDENT" }
              as: HerdManager
              captures: { mrq: $.data.id }
          trigger:
            - call: "POST /mortality-records/${mrq}/void"
              as: HerdManager
            - call: "GET /herds/${herd18}"
              as: HerdManager
              captures: { cnt: $.data.active_animal_count }
          assert:
            - "MortalityRecord.${mrq}.status == VOIDED"
            - "Animal.${aq1}.life_status == ACTIVE"
            - "Herd.${herd18}.active_animal_count == 2"
