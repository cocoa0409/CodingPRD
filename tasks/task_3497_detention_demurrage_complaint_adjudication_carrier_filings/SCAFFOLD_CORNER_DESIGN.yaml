        distinguishing_aspect: "A monitoring report omitting one member (or naming a non-member) is 422 ERR_MEMBER_SET_MISMATCH; the agreement's HHI stays null."
        test_recipe:
          setup:
            - "Two-member VOCC agreement AG-2026-09."
          setup_api_calls:
            - *c_clock
            - call: "POST /fmc/carriers"
              payload: { org_name: "Cover Alpha Lines", org_type: "VOCC" }
              as: CommissionAdmin
