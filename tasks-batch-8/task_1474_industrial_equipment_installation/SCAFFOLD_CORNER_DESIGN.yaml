  # ===========================================================================
  - section: endpoints
    instances:
      - name: projects_list_pagination
        claim_type: listing_pagination
        grounds:
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - "endpoints.GET /v1/projects"
        distinguishing_aspect: "Pagination envelope honored: limit=2 over 3 projects returns has_more true then false at offset 2, with total_count 3."
        test_recipe:
          setup: ["Three projects exist"]
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "Page Job 1", customer_name: "Acme", site_address: "55 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000 }, as: ProjectManager }
            - { call: "POST /v1/projects", payload: { name: "Page Job 2", customer_name: "Acme", site_address: "56 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000 }, as: ProjectManager }
            - { call: "POST /v1/projects", payload: { name: "Page Job 3", customer_name: "Acme", site_address: "57 Plant Rd", billing_mode: LUMP_SUM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000 }, as: ProjectManager }
          trigger:
            - { call: "GET /v1/projects?limit=2&offset=0", payload: {}, as: ProjectManager }
            - { call: "GET /v1/projects?limit=2&offset=2", payload: {}, as: ProjectManager }
          assert:
            - "First page: 2 items, total_count == 3, has_more == true"
            - "Second page: 1 item, total_count == 3, has_more == false"

      - name: response_envelope_shape
        claim_type: response_envelope
        grounds:
          - response_envelope
        distinguishing_aspect: "Every success response carries meta.api_request_id, meta.api_request_timestamp, response_type, and data; object endpoints report response_type == 'object'."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/projects", payload: { name: "Envelope Job", customer_name: "Acme", site_address: "58 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000 }, as: ProjectManager, captures: { p_env: $.data.id } }
            - { call: "GET /v1/projects/${p_env}", payload: {}, as: PayrollClerk }
          assert:
            - "POST response: meta.api_request_id present (string), meta.api_request_timestamp present (ISO8601), response_type == 'object', data.id == ${p_env}"
            - "GET response: same envelope shape with response_type == 'object'"

