scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_discrepancy_measure_net_shift_vs_relative_overstatement
        grounds:
          - calculations.tally_discrepancy_measure
          - calculations.tally_discrepancy_measure.variants.NET_MARGIN_SHIFT
          - calculations.tally_discrepancy_measure.variants.MAX_RELATIVE_OVERSTATEMENT
          - entities.Audit.fields.measure_variant
          - state_machines.AuditRound.TALLYING_to_REVIEW_REQUIRED
        distinguishing_aspect: |
          The two variants are selected by Audit.audit_type on the SAME hand-count numbers (net_error_votes 6 on a
          1000-ballot batch): NET_MARGIN_SHIFT yields 0.0060 and crosses its 0.0050 threshold, while
          MAX_RELATIVE_OVERSTATEMENT yields 0.9000 and stays under its 1.0000 threshold, so one audit escalates to
          REVIEW_REQUIRED and the other keeps counting.
        test_recipe:
          setup:
            - "Election ST-01 CANVASSED-eligible contest C1 (ALVAREZ 3150 / BRENNAN 2850 of 6000 ballots, margin_votes 300, margin_pct 5.0000) with six 1000-ballot batches B-001..B-006, each machine-tabulated 525/475."
            - "Two audits on C1 seeded with the same 10-digit seed 0459231087: A1 RISK_LIMITING alpha 0.05 (planned_sample_size 3 -> B-003, B-004, B-005) and A2 COMPARISON alpha 0.05 prior_error_rate 0.10 (planned_sample_size 2 -> B-003, B-004)."
            - "Physical batch B-003 is checked out once (its custody status is shared by both audits); bipartisan team T-1 is READY."
            - "Both audits hold an uncounted AuditBatch for B-003; team T-1 books two non-overlapping sessions 30+ minutes apart so neither the team-session nor the batch-reseal-buffer rule fires."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-05T09:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { jurisdiction_code: "ST-01", election_name: "2026 General Election", election_date: "2026-11-03", certification_deadline_at: "2026-11-24T17:00:00Z" }
              as: ElectionsDirector
              captures: { e1_id: "$.data.id" }
            - call: "POST /contests"
              payload: { election_id: "${e1_id}", contest_label: "C1", office_name: "State Auditor", contest_type: "CANDIDATE", candidate_names: ["ALVAREZ", "BRENNAN"], ballots_cast: 6000, cvr_available: true }
              as: ElectionsDirector
              captures: { c1_id: "$.data.id" }
            - call: "POST /ballot-batches/bulk"
              payload: { election_id: "${e1_id}", contest_id: "${c1_id}", batches: [{ batch_label: "B-001", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-001" }, { batch_label: "B-002", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-002" }, { batch_label: "B-003", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-003" }, { batch_label: "B-004", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-004" }, { batch_label: "B-005", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-005" }, { batch_label: "B-006", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-006" }] }
              as: CustodyOfficer
              captures: { bulk_count: "$.data.created_count" }
            - call: "POST /contests/${c1_id}/canvass-results"
              payload: { reported_votes: { ALVAREZ: 3150, BRENNAN: 2850 } }
              as: ElectionsDirector
              captures: { c1_v: "$.data.version" }
            - call: "POST /tally-teams"
              payload: { election_id: "${e1_id}", team_label: "T-1", room_code: "ROOM-A" }
              as: ElectionsDirector
              captures: { t1_id: "$.data.id" }
            - call: "POST /tally-teams/${t1_id}/members"
              payload: { members: [{ user_id: "u-dem-1", party: "DEM", seat_role: "LEAD" }, { user_id: "u-rep-1", party: "REP", seat_role: "COUNTER" }] }
              as: ElectionsDirector
            - call: "POST /audits"
              payload: { contest_id: "${c1_id}", audit_type: "RISK_LIMITING", risk_limit_alpha: 0.05 }
              as: AuditManager
              captures: { a1_id: "$.data.id" }
            - call: "POST /audits/${a1_id}/seed"
              payload: { random_seed: "0459231087" }
              as: AuditManager
              captures: { a1_v: "$.data.version" }
            - call: "POST /audits/${a1_id}/rounds"
              payload: { expected_audit_version: "${a1_v}" }
              as: AuditManager
              captures: { r1_id: "$.data.id" }
            - call: "POST /audits"
              payload: { contest_id: "${c1_id}", audit_type: "COMPARISON", risk_limit_alpha: 0.05, prior_error_rate: 0.10 }
              as: AuditManager
              captures: { a2_id: "$.data.id" }
            - call: "POST /audits/${a2_id}/seed"
              payload: { random_seed: "0459231087" }
              as: AuditManager
              captures: { a2_v: "$.data.version" }
            - call: "POST /audits/${a2_id}/rounds"
              payload: { expected_audit_version: "${a2_v}" }
              as: AuditManager
              captures: { r2_id: "$.data.id" }
            - call: "GET /audit-batches"
              payload: { audit_round_id: "${r1_id}", limit: 100 }
              as: CustodyOfficer
              captures: { ab3_id: "$.data[0].id", ab4_id: "$.data[1].id", ab5_id: "$.data[2].id" }
            - call: "GET /audit-batches"
              payload: { audit_round_id: "${r2_id}", limit: 100 }
              as: CustodyOfficer
              captures: { ab3b_id: "$.data[0].id", ab4b_id: "$.data[1].id" }
            - call: "GET /ballot-batches"
              payload: { contest_id: "${c1_id}", limit: 100 }
              as: CustodyOfficer
              captures: { bb1_id: "$.data[0].id", bb1_v: "$.data[0].version", bb2_id: "$.data[1].id", bb2_v: "$.data[1].version", bb3_id: "$.data[2].id", bb3_v: "$.data[2].version", bb4_id: "$.data[3].id", bb4_v: "$.data[3].version", bb5_id: "$.data[4].id", bb5_v: "$.data[4].version", bb6_id: "$.data[5].id", bb6_v: "$.data[5].version" }
            - call: "POST /audit-batches/${ab3_id}/retrieve"
              payload: { expected_ballot_batch_version: "${bb3_v}", observed_seal_number: "SEAL-003" }
              as: CustodyOfficer
            - call: "POST /manual-tallies"
              payload: { audit_batch_id: "${ab3_id}", tally_team_id: "${t1_id}", session_start_at: "2026-11-05T09:00:00Z", session_end_at: "2026-11-05T11:00:00Z", counted_votes: { ALVAREZ: 522, BRENNAN: 478 }, ambiguous_ballot_count: 0, no_vote_count: 0 }
              as: TallyTeamLead
              as_user_id: "${t1_id}"
              captures: { mt1_id: "$.data.id" }
            - call: "POST /manual-tallies"
              payload: { audit_batch_id: "${ab3b_id}", tally_team_id: "${t1_id}", session_start_at: "2026-11-05T11:30:00Z", session_end_at: "2026-11-05T13:30:00Z", counted_votes: { ALVAREZ: 522, BRENNAN: 478 }, ambiguous_ballot_count: 0, no_vote_count: 0 }
              as: TallyTeamLead
              as_user_id: "${t1_id}"
              captures: { mt2_id: "$.data.id" }
          trigger:
            - call: "POST /manual-tallies/${mt1_id}/submit"
              payload: { }
              as: TallyTeamLead
              as_user_id: "${t1_id}"
            - call: "POST /manual-tallies/${mt2_id}/submit"
              payload: { }
              as: TallyTeamLead
              as_user_id: "${t1_id}"
          assert:
            - "Audit.${a1_id}.planned_sample_size == 3 and Audit.${a1_id}.measure_variant == NET_MARGIN_SHIFT"
            - "Audit.${a2_id}.planned_sample_size == 2 and Audit.${a2_id}.measure_variant == MAX_RELATIVE_OVERSTATEMENT"
            - "ManualTally.${mt1_id}.machine_margin_votes == 50 and ManualTally.${mt1_id}.manual_margin_votes == 44"
            - "ManualTally.${mt1_id}.net_error_votes == 6 and ManualTally.${mt1_id}.relative_taint == 0.9000"
            - "ManualTally.${mt2_id}.net_error_votes == 6 and ManualTally.${mt2_id}.relative_taint == 0.9000"
            - "AuditRound.${r1_id}.round_measure == 0.0060 and AuditRound.${r1_id}.status == REVIEW_REQUIRED"
            - "AuditRound.${r2_id}.round_measure == 0.9000 and AuditRound.${r2_id}.status == TALLYING"
            - "Audit.${a1_id}.discrepancy_measure == 0.0060 and Audit.${a1_id}.status == DISCREPANCY_REVIEW"
            - "Audit.${a2_id}.discrepancy_measure == 0.9000 and Audit.${a2_id}.status == TALLYING"
            - "Election.${e1_id}.certification_risk_flag == true"
            - "GET /discrepancies?manual_tally_id=${mt1_id} returns exactly 1 row with discrepancy_type == OVERSTATEMENT and magnitude_votes == 6"
            - "GET /discrepancies?manual_tally_id=${mt2_id} returns exactly 1 row with discrepancy_type == OVERSTATEMENT and magnitude_votes == 6"
      - name: dual_variant_recount_refund_statutory_vs_prorated
        grounds:
          - calculations.recount_cost_and_refund
          - calculations.recount_cost_and_refund.variants.STATUTORY_REFUND
          - calculations.recount_cost_and_refund.variants.PRORATED_COST_RECOVERY
          - entities.Recount.fields.refund_variant
          - state_machines.Recount.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Both recounts move the margin by exactly 10 votes, so the |margin_change_votes| >= 100 branch is inactive in
          both; only C3's recount flips the winner, so STATUTORY_REFUND returns the whole 106250 deposit with
          forfeited_cents 0 while C2's PRORATED_COST_RECOVERY forfeits the measured 68701 of cost.
        test_recipe:
          setup:
            - "Election ST-02 with two canvassed contests: C2 (CHEN 1575 / DAVIS 1425 of 3000 ballots, margin_votes 150) over batches C2-B01 1000, C2-B02 995, C2-B03 1005; C3 (FORD 1180 / GRANT 1070 of 2250 ballots, margin_votes 110) over C3-B01 1250 and C3-B02 1000."
            - "Both contests are canvassed before either recount is filed, so the election is CANVASSED and recounts may start."
            - "Candidate representative rep-davis files a FULL_CONTEST recount on C2 (required deposit 50000 + 25 * 3000 = 125000) and rep-grant files one on C3 (50000 + 25 * 2250 = 106250); both deposits are posted and both recounts are IN_PROGRESS."
            - "Clock stays at 2026-11-05T09:00:00Z, inside both contests' 5-day recount request windows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-05T09:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { jurisdiction_code: "ST-02", election_name: "2026 General Election", election_date: "2026-11-03", certification_deadline_at: "2026-11-24T17:00:00Z" }
              as: ElectionsDirector
              captures: { e2_id: "$.data.id" }
            - call: "POST /contests"
              payload: { election_id: "${e2_id}", contest_label: "C2", office_name: "State Treasurer", contest_type: "CANDIDATE", candidate_names: ["CHEN", "DAVIS"], ballots_cast: 3000, cvr_available: false }
              as: ElectionsDirector
              captures: { c2_id: "$.data.id" }
            - call: "POST /contests"
              payload: { election_id: "${e2_id}", contest_label: "C3", office_name: "County Assessor", contest_type: "CANDIDATE", candidate_names: ["FORD", "GRANT"], ballots_cast: 2250, cvr_available: false }
              as: ElectionsDirector
              captures: { c3_id: "$.data.id" }
            - call: "POST /ballot-batches/bulk"
              payload: { election_id: "${e2_id}", contest_id: "${c2_id}", batches: [{ batch_label: "C2-B01", storage_location_code: "VAULT-2", ballot_count: 1000, machine_votes: { CHEN: 525, DAVIS: 475 }, current_seal_number: "S2-01" }, { batch_label: "C2-B02", storage_location_code: "VAULT-2", ballot_count: 995, machine_votes: { CHEN: 522, DAVIS: 473 }, current_seal_number: "S2-02" }, { batch_label: "C2-B03", storage_location_code: "VAULT-2", ballot_count: 1005, machine_votes: { CHEN: 528, DAVIS: 477 }, current_seal_number: "S2-03" }] }
              as: CustodyOfficer
              captures: { c2_bulk: "$.data.created_count" }
            - call: "POST /ballot-batches/bulk"
              payload: { election_id: "${e2_id}", contest_id: "${c3_id}", batches: [{ batch_label: "C3-B01", storage_location_code: "VAULT-3", ballot_count: 1250, machine_votes: { FORD: 660, GRANT: 590 }, current_seal_number: "S3-01" }, { batch_label: "C3-B02", storage_location_code: "VAULT-3", ballot_count: 1000, machine_votes: { FORD: 520, GRANT: 480 }, current_seal_number: "S3-02" }] }
              as: CustodyOfficer
              captures: { c3_bulk: "$.data.created_count" }
            - call: "POST /contests/${c2_id}/canvass-results"
              payload: { reported_votes: { CHEN: 1575, DAVIS: 1425 } }
              as: ElectionsDirector
              captures: { c2_v: "$.data.version" }
            - call: "POST /contests/${c3_id}/canvass-results"
              payload: { reported_votes: { FORD: 1180, GRANT: 1070 } }
              as: ElectionsDirector
              captures: { c3_v: "$.data.version" }
            - call: "POST /recounts"
              payload: { contest_id: "${c2_id}", expected_contest_version: "${c2_v}", trigger_type: "CANDIDATE_REQUESTED", scope: "FULL_CONTEST", requested_by_candidate_name: "DAVIS" }
              as: CandidateRepresentative
              as_user_id: "rep-davis"
              captures: { ra_id: "$.data.id" }
            - call: "POST /recounts/${ra_id}/deposit"
              payload: { amount_cents: 125000 }
              as: CandidateRepresentative
              as_user_id: "rep-davis"
            - call: "POST /recounts/${ra_id}/start"
              payload: { }
              as: ElectionsDirector
            - call: "POST /recounts"
              payload: { contest_id: "${c3_id}", expected_contest_version: "${c3_v}", trigger_type: "CANDIDATE_REQUESTED", scope: "FULL_CONTEST", requested_by_candidate_name: "GRANT" }
              as: CandidateRepresentative
              as_user_id: "rep-grant"
              captures: { rb_id: "$.data.id" }
            - call: "POST /recounts/${rb_id}/deposit"
              payload: { amount_cents: 106250 }
              as: CandidateRepresentative
              as_user_id: "rep-grant"
            - call: "POST /recounts/${rb_id}/start"
              payload: { }
              as: ElectionsDirector
          trigger:
            - call: "POST /recounts/${ra_id}/complete"
              payload: { final_votes: { CHEN: 1570, DAVIS: 1430 }, team_hours: 6.5 }
              as: ElectionsDirector
            - call: "POST /recounts/${rb_id}/complete"
              payload: { final_votes: { FORD: 1075, GRANT: 1175 }, team_hours: 4.0 }
              as: ElectionsDirector
          assert:
            - "Recount.${ra_id}.actual_cost_cents == 68701"
            - "Recount.${ra_id}.final_margin_votes == 140 and Recount.${ra_id}.margin_change_votes == -10"
            - "Recount.${ra_id}.outcome_changed == false and Recount.${ra_id}.refund_variant == PRORATED_COST_RECOVERY"
            - "Recount.${ra_id}.forfeited_cents == 68701 and Recount.${ra_id}.refunded_cents == 56299"
            - "Recount.${ra_id}.deposit_status == PARTIALLY_REFUNDED and Recount.${ra_id}.status == COMPLETED"
            - "Recount.${rb_id}.actual_cost_cents == 47325"
            - "Recount.${rb_id}.final_margin_votes == 100 and Recount.${rb_id}.margin_change_votes == -10"
            - "Recount.${rb_id}.outcome_changed == true and Recount.${rb_id}.refund_variant == STATUTORY_REFUND"
            - "Recount.${rb_id}.forfeited_cents == 0 and Recount.${rb_id}.refunded_cents == 106250"
            - "Recount.${rb_id}.deposit_status == REFUNDED_FULL"
            - "Contest.${c2_id}.margin_votes == 140 and Contest.${c2_id}.margin_pct == 4.6667 and Contest.${c2_id}.winner_name == CHEN"
            - "Contest.${c3_id}.winner_name == GRANT and Contest.${c3_id}.margin_votes == 100 and Contest.${c3_id}.margin_pct == 4.4444"
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_sample_size_four_configurations_one_contest
        grounds:
          - calculations.audit_sample_size
          - calculations.audit_sample_size.variants.risk_limiting_sizing
          - calculations.audit_sample_size.variants.comparison_sizing
          - calculations.audit_sample_size.variants.fixed_percentage_sizing
          - validations[priority=34]
        distinguishing_aspect: |
          Mode (a): the raw requirement comes from three structurally different formulas over the same contest
          (inverse-square margin for RISK_LIMITING, inverse-linear prior-inflated margin divided by GAMMA for
          COMPARISON, and a pure batch percentage that ignores the margin for FIXED_PERCENTAGE), so one identical
          fixture yields planned_sample_size 3, 4, 2 and 2.
        test_recipe:
          setup:
            - "Election ST-01 contest C1 canvassed: ALVAREZ 3150 / BRENNAN 2850 of 6000 ballots -> margin_votes 300, margin_pct 5.0000, margin_fraction 0.05."
            - "Six batches of 1000 ballots each, so total_batches 6 and avg_batch = ceil(6000/6) = 1000."
            - "No audit exists yet; each POST /audits previews planned_sample_size without a seed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-05T09:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { jurisdiction_code: "ST-01", election_name: "2026 General Election", election_date: "2026-11-03", certification_deadline_at: "2026-11-24T17:00:00Z" }
              as: ElectionsDirector
              captures: { e1_id: "$.data.id" }
            - call: "POST /contests"
              payload: { election_id: "${e1_id}", contest_label: "C1", office_name: "State Auditor", contest_type: "CANDIDATE", candidate_names: ["ALVAREZ", "BRENNAN"], ballots_cast: 6000, cvr_available: true }
              as: ElectionsDirector
              captures: { c1_id: "$.data.id" }
            - call: "POST /ballot-batches/bulk"
              payload: { election_id: "${e1_id}", contest_id: "${c1_id}", batches: [{ batch_label: "B-001", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-001" }, { batch_label: "B-002", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-002" }, { batch_label: "B-003", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-003" }, { batch_label: "B-004", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-004" }, { batch_label: "B-005", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-005" }, { batch_label: "B-006", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-006" }] }
              as: CustodyOfficer
              captures: { bulk_count: "$.data.created_count" }
            - call: "POST /contests/${c1_id}/canvass-results"
              payload: { reported_votes: { ALVAREZ: 3150, BRENNAN: 2850 } }
              as: ElectionsDirector
              captures: { c1_v: "$.data.version" }
          trigger:
            - call: "POST /audits"
              payload: { contest_id: "${c1_id}", audit_type: "RISK_LIMITING", risk_limit_alpha: 0.05 }
              as: AuditManager
              captures: { a_rla05: "$.data.id" }
            - call: "POST /audits"
              payload: { contest_id: "${c1_id}", audit_type: "RISK_LIMITING", risk_limit_alpha: 0.01 }
              as: AuditManager
              captures: { a_rla01: "$.data.id" }
            - call: "POST /audits"
              payload: { contest_id: "${c1_id}", audit_type: "COMPARISON", risk_limit_alpha: 0.05, prior_error_rate: 0.10 }
              as: AuditManager
              captures: { a_comp: "$.data.id" }
            - call: "POST /audits"
              payload: { contest_id: "${c1_id}", audit_type: "FIXED_PERCENTAGE", fixed_percentage_pct: 5 }
              as: AuditManager
              captures: { a_fixed: "$.data.id" }
          assert:
            - "Audit.${a_rla05}.planned_sample_size == 3"
            - "Audit.${a_rla01}.planned_sample_size == 4"
            - "Audit.${a_comp}.planned_sample_size == 2"
            - "Audit.${a_fixed}.planned_sample_size == 2"
            - "Audit.${a_rla05}.measure_variant == NET_MARGIN_SHIFT and Audit.${a_comp}.measure_variant == MAX_RELATIVE_OVERSTATEMENT"
            - "Audit.${a_fixed}.measure_variant == NET_MARGIN_SHIFT and Audit.${a_fixed}.risk_limit_alpha == null"
            - "Audit.${a_rla05}.status == PLANNED and Audit.${a_rla05}.random_seed == null"
            - "Audit.${a_comp}.planned_sample_size == 2 while its raw requirement is 55 ballots -> 1 batch, proving MIN_SAMPLE_BATCHES 2 is applied after the per-type formula, not inside it"
      - name: combinatorial_recount_cost_per_line_rounding_precedes_summation
        grounds:
          - calculations.recount_cost_and_refund
          - calculations.recount_deposit_assessment
          - entities.Recount.fields.actual_cost_cents
          - state_machines.Recount.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Mode (b): the 12.5-cents-per-ballot rate is rounded round_half_up per batch line before the lines are
          summed, so a 1000/995/1005 scope costs 12500 + 12438 + 12563 = 37501 ballot cents, one cent more than the
          37500 that rounding the 37500.0 sum-first product would produce.
        test_recipe:
          setup:
            - "Election ST-02 with a single canvassed contest C2 (CHEN 1575 / DAVIS 1425 of 3000 ballots, margin_votes 150, margin_pct 5.0000)."
            - "Three batches with deliberately odd ballot counts: C2-B01 1000, C2-B02 995, C2-B03 1005."
            - "rep-davis files a PARTIAL_BATCHES recount naming all three batches: ballots_in_scope 3000, required deposit 50000 + 40 * 3000 = 170000, posted in full; recount is IN_PROGRESS."
            - "team_hours 6.5 at completion, so labor is round_half_up(6.5 * 4800) = 31200."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-05T09:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { jurisdiction_code: "ST-02", election_name: "2026 General Election", election_date: "2026-11-03", certification_deadline_at: "2026-11-24T17:00:00Z" }
              as: ElectionsDirector
              captures: { e2_id: "$.data.id" }
            - call: "POST /contests"
