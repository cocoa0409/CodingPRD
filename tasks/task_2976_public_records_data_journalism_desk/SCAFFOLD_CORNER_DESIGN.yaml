      - name: document_match_applies_every_declared_side_effect_of_the_transition
        claim_type: side_effect_execution
        grounds:
          - state_machines.Finding.UNVERIFIED_to_DOC_MATCHED
          - endpoints[POST /records-desk/findings/{id}/document-match]
          - calculations.investigation_analysis_readiness
        distinguishing_aspect: |
          The transition declares five side effects and all five must fire from one call: the state moves,
          source_document_ref and matched_page are recorded, the finding's unit moves OUT of
          unverified_finding_count and INTO doc_matched_finding_count (so the partition sum stays equal to
          finding_count), readiness is recomputed, and BOTH the Finding and the Investigation version
          increment. Moving the counter without decrementing the source bucket is the classic failure.
        test_recipe:
          setup:
            - "Desk, Investigation, one AnalysisRun, two Findings f1 and f2, both UNVERIFIED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
              payload: { name: "Metro Investigations Desk", fee_budget_total_cents: 500000, retention_policy_days: 365 }
              as: ManagingEditor
              captures: { desk_id: $.data.id }
            - call: "POST /records-desk/investigations"
              payload: { desk_id: "${desk_id}", headline: "Side effect probe", publication_mode: "METHODOLOGY_ONLY" }
              as: ManagingEditor
              captures: { inv_id: $.data.id }
            - call: "GET /records-desk/investigations/${inv_id}"
              as: DataReporter
              captures: { inv_v: $.data.version }
            - call: "POST /records-desk/analysis-runs"
              payload: { investigation_id: "${inv_id}", code_repo_ref: "git@desk/side-effects", code_commit_sha: "4444444444444444444444444444444444444444", container_digest: "sha256:4444444444444444444444444444444444444444444444444444444444444444", compute_cost_cents: 1000, labor_hours: 1.0, expected_investigation_version: "${inv_v}" }
              as: DataReporter
              as_user_id: "rep-001"
              captures: { run_id: $.data.id }
            - call: "POST /records-desk/findings"
              payload: { investigation_id: "${inv_id}", analysis_run_id: "${run_id}", claim_text: "Finding one." }
              as: DataReporter
              as_user_id: "rep-001"
              captures: { f1_id: $.data.id }
            - call: "POST /records-desk/findings"
              payload: { investigation_id: "${inv_id}", analysis_run_id: "${run_id}", claim_text: "Finding two." }
              as: DataReporter
              as_user_id: "rep-001"
              captures: { f2_id: $.data.id }
            - call: "GET /records-desk/investigations/${inv_id}"
              as: DataReporter
              captures: { inv_v_before: $.data.version }
          trigger:
            - call: "POST /records-desk/findings/${f1_id}/document-match"
              payload: { source_document_ref: "BOX-14/DOC-0231", matched_page: 7 }
              as: DataReporter
            - call: "GET /records-desk/investigations/${inv_id}"
              as: ManagingEditor
            - call: "GET /records-desk/findings/${f2_id}"
              as: ManagingEditor
          assert:
            - "trigger call 1: HTTP 200; verification_status == \"DOC_MATCHED\", source_document_ref == \"BOX-14/DOC-0231\", matched_page == 7, version == 2"
            - "trigger call 2: finding_count == 2, unverified_finding_count == 1, doc_matched_finding_count == 1, sme_confirmed_finding_count == 0, sme_disputed_finding_count == 0"
            - "trigger call 2: the partition identity holds - unverified + doc_matched + sme_confirmed + sme_disputed == finding_count"
            - "trigger call 2: analysis_readiness == \"NOT_READY\" (a doc_matched finding is not yet confirmed) and version == ${inv_v_before} + 1"
            - "trigger call 3: f2 is untouched - verification_status == \"UNVERIFIED\", matched_page == null, version == 1"
            - "the AnalysisRun is untouched: GET /records-desk/analysis-runs/${run_id} reports code_review_status == \"PENDING_REVIEW\""

      - name: submitting_the_same_request_twice_is_rejected_on_the_second_call
        claim_type: idempotency
        grounds:
          - state_machines.RecordsRequest.DRAFT_to_AWAITING_AGENCY_RESPONSE
          - errors[ERR_INVALID_REQUEST_STATE]
          - validations[priority=100]
        distinguishing_aspect: |
          A repeated action trigger is an error, not a no-op and not a re-execution: the second submit
          returns ERR_INVALID_REQUEST_STATE (409) because DRAFT is no longer the current state, and
          critically submitted_at, due_at_strict and version must all be unchanged afterwards - a
          re-stamping implementation would silently push the statutory deadline out by two days.
        test_recipe:
          setup:
            - "Desk, Agency (BUSINESS_DAYS, 10 days), one DRAFT RecordsRequest; clock at 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
