            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A2", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
              as: Scheduler
              captures: { ch2: $.data.id }
            - call: "POST /nurses"
              payload: { center_id: "${ctr}", full_name: "Nora Ade", acuity_capacity_points: 6, shift_start_minute: 480, shift_end_minute: 1140, status: "ACTIVE" }
              as: Scheduler
              captures: { nr1: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Infliximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: false }
              as: Pharmacist
              captures: { dr1: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Iron Sucrose", is_biosimilar: false, base_administration_minutes: 60, min_administration_minutes: 45, premedication_minutes: 0, observation_minutes_first_dose: 30, observation_minutes_subsequent: 15, acuity_points: 1, prep_stability_minutes: 120, unit_cost_cents: 12000, requires_lab_gate: false }
              as: Pharmacist
              captures: { dr3: $.data.id }
            - call: "POST /appointment-templates"
              payload: { center_id: "${ctr}", drug_id: "${dr1}", dose_tier: "MID" }
              as: Scheduler
              captures: { tp1: $.data.id }
            - call: "POST /appointment-templates"
              payload: { center_id: "${ctr}", drug_id: "${dr3}", dose_tier: "LOW" }
              as: Scheduler
              captures: { tp3: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", full_name: "Pat One", weight_kg: 70 }
              as: Scheduler
              captures: { pt1: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt1}", drug_id: "${dr1}", dose_mg_per_kg: 10, total_cycles: 6, premed_waived: false }
              as: Scheduler
              captures: { pl1: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt1}", drug_id: "${dr3}", dose_mg_per_kg: 5, total_cycles: 4, premed_waived: false }
              as: Scheduler
              captures: { pl3: $.data.id }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-08-10", requested_start_minute: 540, cycle_number: 1, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { ap1: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl3}", template_id: "${tp3}", service_date: "2026-08-10", requested_start_minute: 765, cycle_number: 1, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { err: $.data.error_id }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl3}", template_id: "${tp3}", service_date: "2026-08-10", requested_start_minute: 780, cycle_number: 1, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { ap3: $.data.id, start3: $.data.start_minute }
          assert:
            - "the 765 attempt returns HTTP 409 with error_id ERR_PATIENT_DOUBLE_BOOKED — [765, 855) overlaps [540, 780) with no buffer applied"
            - "the 765 attempt creates no Appointment row and leaves Chair.${ch2}.committed_minutes == 0"
            - "the 780 attempt returns HTTP 201 and Appointment.${ap3}.start_minute == 780 — the patient rule is satisfied at exact adjacency because 780 < 780 is false"
            - "Appointment.${ap3}.end_minute == 870 and chair_minutes == 90 and acuity_points == 2"
            - "Appointment.${ap3}.chair_id == ${ch2}, NOT ${ch1} — the chair rule is buffered, so A1 is still blocked at 780, and the unbuffered patient rule is what allows minute 780 at all"
            - "Appointment.${ap3}.start_minute != 795 — the selector never had to advance, because a second chair was eligible at the first candidate start"
            - "Chair.${ch1}.committed_minutes == 240 and Chair.${ch2}.committed_minutes == 90"
            - "Nurse.${nr1}.assigned_acuity_points == 5"

  - rule_id: compensating_invariant
    instances:

      - name: lot_unit_ledger_fully_restored_by_returning_an_uncompounded_dose
        grounds:
          - state_machines.DrugPreparation.transitions.REQUESTED_to_RETURNED
          - state_machines.DrugLot.transitions.AVAILABLE_to_DEPLETED
          - state_machines.DrugLot.transitions.DEPLETED_to_AVAILABLE
          - entities.DrugLot.fields.units_available
          - entities.DrugLot.fields.units_returned
        distinguishing_aspect: |
          The invariant is the lot's unit identity
          units_received == units_available + units_committed + units_administered + units_wasted,
          and the return must restore it exactly while ALSO leaving an audit trail
          (units_returned == 10) that is deliberately NOT part of the balance. Adding
          units_returned to the balance double-counts to 20; forgetting to decrement
          units_committed strands 10 units; forgetting to re-derive status leaves the lot
          DEPLETED and invisible to the FEFO selector even though it is full again.
        test_recipe:
          setup:
            - "Logical clock 2026-08-05T07:00:00Z; one center, one chair, one nurse."
            - "Drug Three (no lab gate) with a single lot of 10 units expiring 2026-12-01T00:00:00Z, well after the clock."
            - "One LOW-tier visit for Patient One on 2026-08-10 at start_minute 540."
            - "A preparation for the lot's ENTIRE 10 units is requested, which drives units_available to 0 and the lot AVAILABLE -> DEPLETED. The dose is never compounded, so the return path is the zero-charge one."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T07:00:00Z" }
              as: Scheduler
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A1", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
              as: Scheduler
              captures: { ch1: $.data.id }
            - call: "POST /nurses"
              payload: { center_id: "${ctr}", full_name: "Nora Ade", acuity_capacity_points: 6, shift_start_minute: 480, shift_end_minute: 1140, status: "ACTIVE" }
              as: Scheduler
              captures: { nr1: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Iron Sucrose", is_biosimilar: false, base_administration_minutes: 60, min_administration_minutes: 45, premedication_minutes: 0, observation_minutes_first_dose: 30, observation_minutes_subsequent: 15, acuity_points: 1, prep_stability_minutes: 120, unit_cost_cents: 12000, requires_lab_gate: false }
              as: Pharmacist
              captures: { dr3: $.data.id }
            - call: "POST /drug-lots"
              payload: { drug_id: "${dr3}", lot_number: "LOT-A", units_received: 10, expires_on: "2026-12-01T00:00:00Z" }
              as: Pharmacist
              captures: { lt1: $.data.id }
            - call: "POST /appointment-templates"
              payload: { center_id: "${ctr}", drug_id: "${dr3}", dose_tier: "LOW" }
              as: Scheduler
              captures: { tp3: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", full_name: "Pat One", weight_kg: 70 }
              as: Scheduler
              captures: { pt1: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt1}", drug_id: "${dr3}", dose_mg_per_kg: 5, total_cycles: 4, premed_waived: false }
              as: Scheduler
              captures: { pl1: $.data.id }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp3}", service_date: "2026-08-10", requested_start_minute: 540, cycle_number: 1, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { ap1: $.data.id }
            - call: "POST /appointments/${ap1}/drug-preparations"
              payload: { units_requested: 10 }
              as: Pharmacist
              captures: { pr1: $.data.id }
          trigger:
            - call: "POST /drug-preparations/${pr1}/return"
              payload: { reason: "Visit moved to the home-infusion pathway; dose never compounded" }
              as: Pharmacist
              captures: { st: $.data.status }
          assert:
            - "before the trigger DrugLot.${lt1} reads units_received 10, units_committed 10, units_available 0, units_administered 0, units_wasted 0, units_returned 0, status DEPLETED — identity: 10 == 0 + 10 + 0 + 0"
            - "after the trigger DrugLot.${lt1}.units_committed == 0 and units_available == 10"
            - "after the trigger DrugLot.${lt1}.units_returned == 10 — the audit counter records the movement"
            - "after the trigger DrugLot.${lt1}.units_received is still 10 and units_administered == 0 and units_wasted == 0 — identity: 10 == 10 + 0 + 0 + 0, and units_returned is NOT part of the balance"
            - "after the trigger DrugLot.${lt1}.status == AVAILABLE — the lot re-enters the FEFO candidate pool"
            - "DrugPreparation.${pr1}.status == RETURNED with waste_cost_cents == 0"
            - "Appointment.${ap1}.schedule_status == TENTATIVE and cancellation_charge_cents == 0 — a return is not a cancellation"
            - "Patient.${pt1}.waste_liability_cents == 0"

      - name: chair_committed_minutes_and_nurse_acuity_fully_restored_by_an_early_cancellation
        grounds:
          - state_machines.Appointment.schedule_status.transitions.TENTATIVE_to_CANCELLED
          - calculations.cancellation_charge
          - entities.Chair.fields.committed_minutes
          - entities.Nurse.fields.assigned_acuity_points
          - entities.Patient.fields.no_show_risk_score
        distinguishing_aspect: |
          Cancelling the SECOND of two visits on one chair must return the derived ledgers to
          exactly their post-first-booking values (330 -> 240 minutes and 5 -> 3 points), not
          to zero and not to a drifted 240-plus-something. The compensation is also
          asymmetric on purpose: the resource ledgers unwind completely while the patient's
          adherence history does NOT — the cancellation is permanently recorded, moving the
          score from 0.00 to 25.00 and the tier from STANDARD to ELEVATED.
        test_recipe:
          setup:
            - "Logical clock 2026-08-05T07:00:00Z; one center with a single available chair, turnover buffer 15, one nurse with capacity 6."
            - "Drug One (MID, 240-minute window, acuity 3 on a first dose) and Drug Three (LOW, 90-minute window, acuity 2 on a first dose)."
            - "Patient One's Drug One visit is booked first and occupies [540, 780), taking the chair to 240 minutes and the nurse to 3 points."
            - "Patient Two's Drug Three visit is then booked at requested_start 795 — exactly the buffered boundary — and occupies [795, 885) on the SAME chair, taking the chair to 330 minutes and the nurse to 5 points."
            - "The cancellation happens at 2026-08-05T07:00:00Z, far more than 24 hours before the 2026-08-10T13:15:00Z start, so it is an EARLY cancellation with no base charge and no wasted dose."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T07:00:00Z" }
              as: Scheduler
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A1", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
              as: Scheduler
              captures: { ch1: $.data.id }
            - call: "POST /nurses"
              payload: { center_id: "${ctr}", full_name: "Nora Ade", acuity_capacity_points: 6, shift_start_minute: 480, shift_end_minute: 1140, status: "ACTIVE" }
              as: Scheduler
              captures: { nr1: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Infliximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: false }
              as: Pharmacist
              captures: { dr1: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Iron Sucrose", is_biosimilar: false, base_administration_minutes: 60, min_administration_minutes: 45, premedication_minutes: 0, observation_minutes_first_dose: 30, observation_minutes_subsequent: 15, acuity_points: 1, prep_stability_minutes: 120, unit_cost_cents: 12000, requires_lab_gate: false }
              as: Pharmacist
              captures: { dr3: $.data.id }
            - call: "POST /appointment-templates"
              payload: { center_id: "${ctr}", drug_id: "${dr1}", dose_tier: "MID" }
              as: Scheduler
              captures: { tp1: $.data.id }
            - call: "POST /appointment-templates"
              payload: { center_id: "${ctr}", drug_id: "${dr3}", dose_tier: "LOW" }
              as: Scheduler
              captures: { tp3: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", full_name: "Pat One", weight_kg: 70 }
              as: Scheduler
              captures: { pt1: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt1}", drug_id: "${dr1}", dose_mg_per_kg: 10, total_cycles: 6, premed_waived: false }
              as: Scheduler
              captures: { pl1: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0002", full_name: "Pat Two", weight_kg: 70 }
              as: Scheduler
              captures: { pt2: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt2}", drug_id: "${dr3}", dose_mg_per_kg: 5, total_cycles: 4, premed_waived: false }
              as: Scheduler
              captures: { pl2: $.data.id }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-08-10", requested_start_minute: 540, cycle_number: 1, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { ap1: $.data.id }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt2}", treatment_plan_id: "${pl2}", template_id: "${tp3}", service_date: "2026-08-10", requested_start_minute: 795, cycle_number: 1, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { ap2: $.data.id }
          trigger:
            - call: "POST /appointments/${ap2}/cancel"
              payload: { reason: "Patient travelling that week" }
              as: Scheduler
              captures: { charge: $.data.cancellation_charge_cents, late: $.data.late_cancellation }
          assert:
            - "before the trigger Chair.${ch1}.committed_minutes == 330 and Nurse.${nr1}.assigned_acuity_points == 5"
            - "before the trigger Appointment.${ap2}.chair_id == ${ch1}, start_minute == 795, end_minute == 885"
            - "after the trigger Chair.${ch1}.committed_minutes == 240 — exactly the value it held after the first booking, with no drift"
            - "after the trigger Nurse.${nr1}.assigned_acuity_points == 3 — exactly the first visit's acuity"
            - "Appointment.${ap1}.schedule_status == TENTATIVE with chair_id == ${ch1}, start_minute 540 and end_minute 780 all unchanged"
            - "Appointment.${ap2}.schedule_status == CANCELLED with late_cancellation == false and cancellation_charge_cents == 0"
            - "Patient.${pt2}.waste_liability_cents == 0 — an early cancellation with no compounded dose costs nothing"
            - "Patient.${pt2}.no_show_risk_score == 25.00 and reminder_tier == ELEVATED — the adherence side of the ledger is deliberately NOT compensated"
            - "Patient.${pt2}.no_show_strikes == 0 and steering_status == SUITE"
            - "Patient.${pt1}.no_show_risk_score == 0.00 and reminder_tier == STANDARD — the other patient is untouched"
