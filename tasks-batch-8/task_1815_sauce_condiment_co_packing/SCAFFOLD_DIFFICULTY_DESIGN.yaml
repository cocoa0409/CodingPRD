            - { call: "POST /copack/formulas", payload: { customer_id: "${c1}", product_name: "Sauce B", sku_code: "SB-001", process_category: "ACID", allergen_class: "SOY", min_run_units: 100, unit_rate_cents: 100 }, as: OpsAdmin, captures: { fB: "$.data.id"} }
            - { call: "POST /copack/formulas", payload: { customer_id: "${c1}", product_name: "Sauce C", sku_code: "SC-001", process_category: "ACID", allergen_class: "SOY", min_run_units: 100, unit_rate_cents: 100 }, as: OpsAdmin, captures: { fC: "$.data.id"} }
            - { call: "POST /copack/pilot-cells", payload: { cell_name: "Pilot-1", max_batch_units: 5000 }, as: OpsAdmin, captures: { pc1: "$.data.id"} }
            - { call: "POST /copack/scale-up-trials", payload: { formula_id: "${fA}", pilot_cell_id: "${pc1}", batch_size_units: 100, scheduled_start: "2026-09-01T08:00:00Z", scheduled_end: "2026-09-01T12:00:00Z" }, as: OpsAdmin, captures: { tA: "$.data.id"} }
          trigger:
            - { call: "POST /copack/scale-up-trials", payload: { formula_id: "${fB}", pilot_cell_id: "${pc1}", batch_size_units: 100, scheduled_start: "2026-09-01T12:00:00Z", scheduled_end: "2026-09-01T16:00:00Z" }, as: OpsAdmin, captures: { tB: "$.data.id"} }
            - { call: "POST /copack/scale-up-trials", payload: { formula_id: "${fC}", pilot_cell_id: "${pc1}", batch_size_units: 100, scheduled_start: "2026-09-01T11:00:00Z", scheduled_end: "2026-09-01T13:00:00Z" }, as: OpsAdmin, captures: { err: "$.data.error_id"} }
          assert:
            - "tB created with status SCHEDULED (touching window 12:00 == 12:00 allowed: half-open semantics, zero buffer)"
            - "tC rejected with ERR_PILOT_CELL_CONFLICT (11:00-13:00 intersects tA 08:00-12:00)"
            - "Formula.${fB}.status == IN_TRIAL; Formula.${fC}.status remains DRAFT (rejected create has no side effects)"

  - rule_id: compensating_invariant
    instances:
      - name: confirm_cancel_restores_packaging_reserved
        grounds:
          - state_machines.ProductionRun.PLANNED_to_CONFIRMED
          - state_machines.ProductionRun.CONFIRMED_to_CANCELLED
          - entities.PackagingComponent.fields.reserved_units
        distinguishing_aspect: |
          Conserved quantity is physical component units: for every requirement line,
          confirm adds quantity_per_unit * planned_units to reserved_units and cancel
          subtracts exactly the same amount, so reserved_units and on_hand_units after
          the pair equal their pre-confirm values (on_hand untouched by both).
        test_recipe:
          setup:
            - "Chain A approved formula f1 (letter ACTIVE); bottle b1 (100000) and cap cp1 (100000); run r1 planned 2000 requiring 1 bottle + 1 cap per unit; pepper consigned 5000"
          setup_api_calls:
            - { call: "POST /copack/customers", payload: { brand_name: "Acme Foods", contact_email: "ops@acme.example", credit_limit_cents: 100000000, default_disposition_owner: "CUSTOMER" }, as: OpsAdmin, captures: { c1: "$.data.id"} }
            - { call: "POST /copack/formulas", payload: { customer_id: "${c1}", product_name: "Ghost Pepper Sauce", sku_code: "GPS-001", process_category: "ACIDIFIED", allergen_class: "NONE", min_run_units: 1000, unit_rate_cents: 120 }, as: OpsAdmin, captures: { f1: "$.data.id"} }
            - { call: "POST /copack/ingredient-supplies", payload: { formula_id: "${f1}", ingredient_name: "Ghost pepper mash", sourcing_mode: "CUSTOMER_SUPPLIED", quantity_per_unit: 0.5 }, as: OpsAdmin, captures: { s1: "$.data.id"} }
            - { call: "POST /copack/ingredient-supplies", payload: { formula_id: "${f1}", ingredient_name: "White vinegar", sourcing_mode: "COPACKER_SUPPLIED", quantity_per_unit: 0.8, unit_cost_cents: 300 }, as: OpsAdmin }
            - { call: "POST /copack/ingredient-supplies/${s1}/receive", payload: { quantity: 5000 }, as: OpsAdmin }
            - { call: "POST /copack/pilot-cells", payload: { cell_name: "Pilot-1", max_batch_units: 5000 }, as: OpsAdmin, captures: { pc1: "$.data.id"} }
            - { call: "POST /copack/scale-up-trials", payload: { formula_id: "${f1}", pilot_cell_id: "${pc1}", batch_size_units: 500, scheduled_start: "2026-09-01T08:00:00Z", scheduled_end: "2026-09-01T12:00:00Z" }, as: OpsAdmin, captures: { t1: "$.data.id"} }
            - { call: "POST /copack/scale-up-trials/${t1}/record-results", payload: { passed: true, yield_units: 480 }, as: OpsAdmin }
            - { call: "POST /copack/process-authority-letters", payload: { formula_id: "${f1}", formula_revision: 1, authority_name: "Dr. Rosa Kim", letter_number: "PAL-1001", max_ph: 4.2, max_water_activity: 0.9 }, as: ProcessAuthority, captures: { l1: "$.data.id"} }
            - { call: "POST /copack/process-authority-letters/${l1}/activate", payload: {}, as: ProcessAuthority }
            - { call: "POST /copack/kettle-lines", payload: { line_name: "Kettle-1", capacity_units: 100000 }, as: OpsAdmin, captures: { k1: "$.data.id"} }
            - { call: "POST /copack/packaging-components", payload: { component_name: "12oz woozy bottle", component_type: "BOTTLE", unit_cost_cents: 50, initial_on_hand_units: 100000 }, as: OpsAdmin, captures: { b1: "$.data.id"} }
            - { call: "POST /copack/packaging-components", payload: { component_name: "38mm cap", component_type: "CAP", unit_cost_cents: 12, initial_on_hand_units: 100000 }, as: OpsAdmin, captures: { cp1: "$.data.id"} }
            - { call: "POST /copack/production-runs", payload: { formula_id: "${f1}", kettle_line_id: "${k1}", planned_units: 2000, scheduled_start: "2026-09-10T08:00:00Z", scheduled_end: "2026-09-10T16:00:00Z", packaging_requirements: [ { component_id: "${b1}", quantity_per_unit: 1 }, { component_id: "${cp1}", quantity_per_unit: 1 } ] }, as: OpsAdmin, captures: { r1: "$.data.id"} }
            - { call: "POST /copack/production-runs/${r1}/confirm", payload: {}, as: OpsAdmin }
          trigger:
            - { call: "POST /copack/production-runs/${r1}/cancel", payload: {}, as: OpsAdmin }
            - { call: "GET /copack/packaging-components/${b1}", payload: {}, as: OpsAdmin, captures: { b_res: "$.data.reserved_units", b_on: "$.data.on_hand_units"} }
            - { call: "GET /copack/packaging-components/${cp1}", payload: {}, as: OpsAdmin, captures: { cp_res: "$.data.reserved_units"} }
            - { call: "GET /copack/ingredient-supplies/${s1}", payload: {}, as: OpsAdmin, captures: { s_con: "$.data.consigned_units_on_hand"} }
          assert:
            - "after confirm: b1.reserved_units was 2000 (invariant delta observed mid-pair)"
            - "PackagingComponent.${b1}.reserved_units == 0 and PackagingComponent.${cp1}.reserved_units == 0 after cancel"
            - "PackagingComponent.${b1}.on_hand_units == 100000 (on_hand untouched by confirm/cancel pair)"
            - "IngredientSupply.${s1}.consigned_units_on_hand == 5000 (drawn 1000 restored)"

      - name: confirm_cancel_restores_billed_cents
        grounds:
          - state_machines.ProductionRun.PLANNED_to_CONFIRMED
          - state_machines.ProductionRun.CONFIRMED_to_CANCELLED
          - entities.CustomerAccount.fields.outstanding_billed_cents
        distinguishing_aspect: |
          Conserved quantity is money (a different quantity type than physical
          packaging units): confirm debits outstanding_billed_cents by
