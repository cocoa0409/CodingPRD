            - "Call 6 - the same deploy that is about to succeed, differing only in the seal number - returns ERR_SEAL_NUMBER_DUPLICATE with HTTP 409, because SEAL-1001 is already held by BallotLot.${lot1}; the seal namespace spans BallotLot and TabulatorUnit rows of the election."
            - "Call 7 succeeds: TabulatorUnit.${tab1}.custody_status == DEPLOYED, precinct_id == ${pr1}, seal_number == SEAL-TAB-1, Election.${el}.open_seal_count == 1, and a CustodyEvent SEAL_APPLIED exists for subject ${tab1}."
            - "Call 4 and call 7 are byte-identical requests with opposite outcomes, so the deciding state is the BallotLot's custody_state and not anything on the unit."
            - "Precinct.${pr1}.deployment_status == READY after call 7 while Precinct.${pr2}.deployment_status is still NOT_READY (its unit was never deployed), so Election.${el}.deployment_readiness == BLOCKED and TabulatorUnit.${tab2}.custody_status is still IN_VAULT."

  - rule_id: resource_temporal_overlap
    instances:
      - name: rt_press_line_capacity_half_open_adjacency
        grounds:
          - validations.press-window-capacity-available
          - entities.PrintVendor.fields.press_line_count
          - errors.ERR_PRESS_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          The vendor's press lines are an aggregate capacity of 2 over HALF-OPEN windows
          [press_window_start, press_window_end), so a job starting exactly when another ends does
          NOT consume a second line, while a job that straddles two adjacent windows sees BOTH of
          them and is refused. The recipe places a job at 08-10/08-12 and an adjacent one at
          08-12/08-14 (both accepted), then a straddling 08-11/08-13 job that overlaps each of them
          on a non-empty interval and is refused; a narrower 08-11T08:00/08-11T20:00 job that
          overlaps only the first is then accepted, and a job inside that pair is refused. An
          implementation using closed intervals rejects the adjacent job; one that counts only
          strictly-containing windows accepts the straddler.
        test_recipe:
          setup:
            - "An election in STYLES_LOCKED with locked style S-100, precinct P-001 assigned to it (required_ballot_quantity 110)."
            - "Vendor Ridgeline Secure Print, certified_secure, ACTIVE, press_line_count 2, with no print jobs yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { name: "November 2026 General", jurisdiction: "Kestrel County", election_date: "2026-11-03", rotation_policy: "NONE", candidate_order_method: "ALPHABETICAL_BY_BALLOT_NAME", la_notice_hours: 48 }
              as: ElectionsDirector
              captures: { el: $.data.id }
            - call: "POST /elections/${el}/contests"
              payload: { title: "County Sheriff", contest_type: "CANDIDATE", district_code: "D-12", seats_open: 1, rotation_required: false }
              as: BallotCoordinator
              captures: { ct: $.data.id }
            - call: "POST /contests/${ct}/candidates"
              payload: { full_name: "Ana Alvarez", ballot_name: "Alvarez", filing_received_at: "2026-06-01T09:00:00Z", party_code: "IND" }
              as: BallotCoordinator
              captures: { c_alv: $.data.id }
            - call: "POST /contests/${ct}/certify"
              payload: {}
              as: ElectionsDirector
            - call: "POST /elections/${el}/ballot-styles"
              payload: { style_code: "S-100", district_codes: ["D-12"], language_set: ["EN"], required_formats: ["PAPER_STANDARD"] }
              as: BallotCoordinator
              captures: { st: $.data.id }
            - call: "POST /elections/${el}/precincts"
              payload: { precinct_code: "P-001", district_codes: ["D-12"], registered_voter_count: 100, polling_place: "Kestrel Community Hall" }
              as: BallotCoordinator
              captures: { pr: $.data.id }
            - call: "POST /elections/${el}/certify-ballot-order"
              payload: {}
              as: ElectionsDirector
            - call: "POST /ballot-styles/${st}/language-certifications"
              payload: { translated_languages: ["EN"], certified_formats: ["PAPER_STANDARD"] }
              as: LanguageAccessCoordinator
            - call: "POST /ballot-styles/${st}/request-proof"
              payload: {}
              as: BallotCoordinator
              as_user_id: "user-coord-1"
            - call: "POST /ballot-styles/${st}/proof-decision"
              payload: { decision: "APPROVE", decision_note: "Artwork accepted" }
              as: ElectionsDirector
              as_user_id: "user-director-1"
            - call: "POST /precincts/${pr}/assign-style"
              payload: { style_id: "${st}" }
              as: BallotCoordinator
            - call: "POST /elections/${el}/lock-styles"
              payload: {}
              as: ElectionsDirector
            - call: "GET /ballot-styles/${st}"
              payload: {}
              as: BallotCoordinator
              captures: { st_v: $.data.version }
            - call: "POST /print-vendors"
              payload: { name: "Ridgeline Secure Print", press_line_count: 2, certified_secure: true, status: "ACTIVE" }
              as: ElectionsDirector
              captures: { vend: $.data.id }
          trigger:
            - call: "POST /print-jobs"
              payload: { vendor_id: "${vend}", style_id: "${st}", quantity_ordered: 12500, unit_cost_cents_per_thousand: 8450, press_window_start: "2026-08-10T08:00:00Z", press_window_end: "2026-08-12T08:00:00Z", expected_ballot_style_version: "${st_v}" }
              as: BallotCoordinator
              captures: { job_a: $.data.id }
            - call: "POST /print-jobs"
              payload: { vendor_id: "${vend}", style_id: "${st}", quantity_ordered: 12500, unit_cost_cents_per_thousand: 8450, press_window_start: "2026-08-12T08:00:00Z", press_window_end: "2026-08-14T08:00:00Z", expected_ballot_style_version: "${st_v}" }
              as: BallotCoordinator
              captures: { job_b: $.data.id }
            - call: "POST /print-jobs"
              payload: { vendor_id: "${vend}", style_id: "${st}", quantity_ordered: 12500, unit_cost_cents_per_thousand: 8450, press_window_start: "2026-08-11T08:00:00Z", press_window_end: "2026-08-13T08:00:00Z", expected_ballot_style_version: "${st_v}" }
              as: BallotCoordinator
            - call: "POST /print-jobs"
              payload: { vendor_id: "${vend}", style_id: "${st}", quantity_ordered: 12500, unit_cost_cents_per_thousand: 8450, press_window_start: "2026-08-11T08:00:00Z", press_window_end: "2026-08-11T20:00:00Z", expected_ballot_style_version: "${st_v}" }
              as: BallotCoordinator
              captures: { job_d: $.data.id }
            - call: "POST /print-jobs"
              payload: { vendor_id: "${vend}", style_id: "${st}", quantity_ordered: 12500, unit_cost_cents_per_thousand: 8450, press_window_start: "2026-08-11T12:00:00Z", press_window_end: "2026-08-11T18:00:00Z", expected_ballot_style_version: "${st_v}" }
              as: BallotCoordinator
            - call: "POST /print-jobs"
              payload: { vendor_id: "${vend}", style_id: "${st}", quantity_ordered: 12500, unit_cost_cents_per_thousand: 8450, press_window_start: "2026-08-08T08:00:00Z", press_window_end: "2026-08-10T08:00:00Z", expected_ballot_style_version: "${st_v}" }
              as: BallotCoordinator
              captures: { job_f: $.data.id }
            - call: "POST /print-jobs"
              payload: { vendor_id: "${vend}", style_id: "${st}", quantity_ordered: 12500, unit_cost_cents_per_thousand: 8450, press_window_start: "2026-08-11T20:00:00Z", press_window_end: "2026-08-12T08:00:00Z", expected_ballot_style_version: "${st_v}" }
              as: BallotCoordinator
              captures: { job_g: $.data.id }
          assert:
            - "Call 1 creates JOB-A (PROOF_PENDING) - zero overlapping jobs, so 0 < press_line_count 2."
            - "Call 2 creates JOB-B even though its window starts at exactly JOB-A's end 2026-08-12T08:00:00Z: the windows are half-open, so [08-10T08:00, 08-12T08:00) and [08-12T08:00, 08-14T08:00) do not intersect and the overlap count is 0."
            - "Call 3 returns ERR_PRESS_CAPACITY_EXCEEDED with HTTP 409: [08-11T08:00, 08-13T08:00) intersects JOB-A on [08-11T08:00, 08-12T08:00) and JOB-B on [08-12T08:00, 08-13T08:00), so the count is 2 >= 2. No PrintJob row is created and PrintVendor.${vend}.active_job_count is still 2."
            - "Call 4 creates JOB-D: [08-11T08:00, 08-11T20:00) intersects only JOB-A, so the count is 1 < 2 - the capacity is an aggregate over instants, not a ban on overlap."
            - "Call 5 returns ERR_PRESS_CAPACITY_EXCEEDED: [08-11T12:00, 08-11T18:00) sits inside both JOB-A and JOB-D, and both press lines are already busy for that whole interval."
            - "Call 6 creates JOB-F: its window ENDS exactly at JOB-A's start 2026-08-10T08:00:00Z, and because the end is exclusive the intersection is empty."
            - "Call 7 creates JOB-G: [08-11T20:00, 08-12T08:00) starts exactly when JOB-D ends and ends exactly when JOB-A ends, so it overlaps JOB-A only (count 1)."
            - "At the end exactly five PrintJob rows exist for the vendor (A, B, D, F, G), PrintVendor.${vend}.active_job_count == 5, and Election.${el}.committed_print_cents is still 0 because no job has been proof-approved."

      - name: rt_unit_test_window_buffered_closed_touch_conflict
        grounds:
          - validations.unit-test-window-exclusive
          - entities.LATestSession.fields.scheduled_start
          - errors.ERR_UNIT_TEST_WINDOW_CONFLICT
        distinguishing_aspect: |
          A tabulator hosts at most UNIT_SESSION_CAPACITY == 1 session, and the resource is not the
          scheduled window but the window widened by SETUP_BUFFER_MINUTES == 30 on each side, compared
          as a CLOSED interval - so two sessions whose buffered edges merely touch DO conflict. A
          session at 19:00-21:00 (buffered from 18:30) collides with a 14:00-18:00 session (buffered to
          18:30) at the single instant 18:30, while the same session moved one minute later is
