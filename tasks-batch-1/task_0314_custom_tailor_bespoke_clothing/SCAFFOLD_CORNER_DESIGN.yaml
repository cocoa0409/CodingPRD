              captures: { c_id: $.data.id }
            - call: "POST /measurement-profiles"
              payload: { customer_id: "${c_id}", chest_cm: 100, waist_cm: 84, hip_cm: 100, inseam_cm: 80, source: "MANUAL" }
              as: SalesAssociate
              captures: { mp_id: $.data.id }
            - call: "POST /fabrics"
              payload: { name: "Wool IMC", price_per_meter_cents: 8000, bolt_meters_initial: 50 }
              as: ShopManager
              captures: { f_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", measurement_profile_id: "${mp_id}", garment_type: "SUIT", base_labor_cents: 40000, fabric_meters_required: 7.0, promised_date: "2026-08-01T00:00:00.000Z" }
              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/option-lines"
              payload: { fabric_id: "${f_id}", option_code: "MONOGRAM" }
              as: SalesAssociate
            - call: "POST /orders/${o_id}/option-lines"
              payload: { fabric_id: "${f_id}", option_code: "CONTRAST_LINING" }
              as: SalesAssociate
          trigger:
            - call: "POST /orders/${o_id}/confirm"
              payload: {}
              as: SalesAssociate
              captures: { lk: $.data.locked_total_cents, dp: $.data.deposit_due_cents }
          assert:
            - "GarmentOrder.${o_id}.locked_total_cents == 97500"
            - "GarmentOrder.${o_id}.deposit_due_cents == 48750"
            - "GarmentOrder.${o_id}.balance_due_cents == 97500"
