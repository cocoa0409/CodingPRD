            - { call: "POST /api/volunteers", payload: { full_name: "Vol S", phone: "555-2102" }, as: ProgramCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /api/volunteers/${v_id}/begin-training", payload: {}, as: ProgramCoordinator }
          trigger:
            - { call: "POST /api/call-assignments", payload: { participant_id: "${p_id}", volunteer_id: "${v_id}", scheduled_date: "2026-08-03", window_start: "18:00", window_end: "18:30" }, as: ProgramCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VOLUNTEER_NOT_CERTIFIED (priority 8 business_safety beats priority 9 business_temporal)"
            - "The 18:00 window is outside every availability window AND outside the participant schedule — temporal errors were eligible but MUST NOT win"

      - name: temporal_conflict_beats_capacity_constraint
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - errors[ERR_ASSIGNMENT_WINDOW_CONFLICT]
          - errors[ERR_WEEKLY_LOAD_EXCEEDED]
        distinguishing_aspect: |
          Category pair (business_temporal, business_constraint) — a third distinct pair: the 6th
          assignment of the week both overlaps an existing assignment under buffer-inclusive
          semantics (09:15 start against 09:00-09:30 occupying through 09:45) AND would push weekly
          load from 225 to 270 over the 225 cap; priority 9 beats 11, so ERR_ASSIGNMENT_WINDOW_CONFLICT
          wins over ERR_WEEKLY_LOAD_EXCEEDED.
        test_recipe:
          setup:
            - "Program; enrolled participant with MON-FRI 09:00-11:00 schedules; volunteer max_weekly_minutes 225, availability MON-FRI 08:00-17:00"
