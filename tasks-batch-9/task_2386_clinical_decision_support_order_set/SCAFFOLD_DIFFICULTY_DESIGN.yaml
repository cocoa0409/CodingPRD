            - call: "POST /cds/vendor-releases/${vrb_id}/deltas"
              payload: { rule_code: "DDI-B2", change_type: "SEVERITY_INCREASED", description: "Linezolid plus SSRI raised", new_severity: "CONTRAINDICATED", prior_severity: "MAJOR" }
              as: PharmacyInformaticist
