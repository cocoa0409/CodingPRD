              payload: { action_type: "WITHDRAWAL", basis: "ADMINISTRATIVE", expected_establishment_version: "${est_v}" }
              as: DistrictManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_WITHDRAWAL_CONDITIONS_NOT_MET"
            - "GET /inspection/establishments/${est_id}/enforcement-actions returns 0 rows"

      - name: humane_event_species_not_supported_returns_422
        claim_type: violation_to_error
        grounds:
          - errors.ERR_SPECIES_NOT_SUPPORTED
          - validations[priority=9]
        distinguishing_aspect: "A humane event citing SWINE at a CATTLE-only establishment fails the referential species rule with ERR_SPECIES_NOT_SUPPORTED."
        test_recipe:
          setup: ["Clock default. CATTLE-only establishment; inspector."]
          setup_api_calls:
