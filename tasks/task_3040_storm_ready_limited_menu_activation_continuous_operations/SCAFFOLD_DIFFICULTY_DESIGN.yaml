              as: ReliefCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_RELIEF_ORG_INACTIVE (409)"
            - "no ReliefPledge exists for unit ${u} (GET /ops/units/${u}/relief-pledges returns total_count == 0)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_assignment_half_open_adjacency
        grounds:
          - calculations.crew_assignment_overlap
          - validations[priority=8]
          - errors[ERR_ASSIGNMENT_OVERLAP]
        distinguishing_aspect: |
          Interval semantics 1 (resource: CrewMember availability):
          instant-level half-open windows — a new assignment with
          assigned_from exactly equal to the existing assignment's
          assigned_until does NOT overlap and is accepted, while one second
          earlier collides and is rejected.
        test_recipe:
          setup:
            - "Clock 2026-09-10T08:00:00Z. Storm WATCH; units U1 (power DOWN) and U2. Member M with existing SCHEDULED assignment [2026-09-10T10:00:00Z, 2026-09-11T10:00:00Z) on U1. A colliding assignment attempt at 09:59:59 is rejected."
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-1201", address: "3 Harbor Rd" }
              as: CommandCenterAdmin
              captures: { u1: $.data.id }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-1202", address: "4 Harbor Rd" }
              as: CommandCenterAdmin
              captures: { u2: $.data.id }
            - call: "POST /ops/units/${u1}/condition-reports"
              payload: { power: "DOWN", water: "UP", gas: "UP", payment_network: "UP" }
              as: UnitManager
            - call: "POST /ops/crew-members"
              payload: { full_name: "Jo Vega", role: "GRILL_OP", home_unit_id: "${u1}", is_jump_team: true }
              as: FieldCoordinator
              captures: { m: $.data.id }
            - call: "POST /ops/assignments"
              payload: { crew_member_id: "${m}", unit_id: "${u1}", assigned_from: "2026-09-10T10:00:00Z", assigned_until: "2026-09-11T10:00:00Z", travel_origin: "Atlanta" }
              as: FieldCoordinator
              captures: { a1: $.data.id }
            - call: "POST /ops/assignments"
              payload: { crew_member_id: "${m}", unit_id: "${u2}", assigned_from: "2026-09-11T09:59:59Z", assigned_until: "2026-09-12T10:00:00Z", travel_origin: "Atlanta" }
              as: FieldCoordinator
              captures: { err: $.data.error_id }
          trigger:
            - call: "POST /ops/assignments"
              payload: { crew_member_id: "${m}", unit_id: "${u2}", assigned_from: "2026-09-11T10:00:00Z", assigned_until: "2026-09-12T10:00:00Z", travel_origin: "Atlanta" }
              as: FieldCoordinator
              captures: { a2: $.data.id }
          assert:
            - "the 09:59:59-from assignment failed with error_id == ERR_ASSIGNMENT_OVERLAP (409)"
            - "trigger succeeds: CrewAssignment.${a2}.status == SCHEDULED (pure adjacency is not an overlap — half-open semantics)"
            - "CrewMember.${m}.status == ASSIGNED"

      - name: lodging_calendar_date_overlap_vs_instant_adjacency
        grounds:
          - calculations.lodging_night_overlap
          - calculations.lodging_cost
          - errors[ERR_LODGING_OVERLAP]
        distinguishing_aspect: |
          Interval semantics 2 (resource: LodgingBooking nights of one crew
          assignment): the overlap unit is a CALENDAR DATE, not an instant —
          booking A [Sep 10 14:00, Sep 11 00:30) and booking B [Sep 11 23:00,
          Sep 12 09:00) never share an instant but both occupy the Sep 11
          calendar night, so B is rejected with ERR_LODGING_OVERLAP. Different
          interval arithmetic from the half-open crew-assignment rule.
        test_recipe:
          setup:
            - "Clock 2026-09-10T08:00:00Z. Storm WATCH; unit U1 power DOWN with lodging fund 1000000 cents. Member M assigned to U1. Booking A confirmed for [2026-09-10T14:00Z, 2026-09-11T00:30Z) (nights Sep 10 + Sep 11, cost 18000)."
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-1301", address: "6 Harbor Rd", lodging_fund_cents: 1000000 }
              as: CommandCenterAdmin
              captures: { u1: $.data.id }
            - call: "POST /ops/units/${u1}/condition-reports"
              payload: { power: "DOWN", water: "UP", gas: "UP", payment_network: "UP" }
              as: UnitManager
            - call: "POST /ops/crew-members"
              payload: { full_name: "Jo Vega", role: "GRILL_OP", home_unit_id: "${u1}", is_jump_team: true }
              as: FieldCoordinator
              captures: { m: $.data.id }
            - call: "POST /ops/assignments"
              payload: { crew_member_id: "${m}", unit_id: "${u1}", assigned_from: "2026-09-10T10:00:00Z", assigned_until: "2026-09-13T10:00:00Z", travel_origin: "Atlanta" }
              as: FieldCoordinator
              captures: { a1: $.data.id }
            - call: "POST /ops/lodging-bookings"
              payload: { crew_assignment_id: "${a1}", unit_id: "${u1}", rooms: 1, nightly_rate_cents: 9000, check_in: "2026-09-10T14:00:00Z", check_out: "2026-09-11T00:30:00Z" }
              as: FieldCoordinator
              captures: { b1: $.data.id, b1_cost: $.data.cost_cents }
          trigger:
            - call: "POST /ops/lodging-bookings"
              payload: { crew_assignment_id: "${a1}", unit_id: "${u1}", rooms: 1, nightly_rate_cents: 9000, check_in: "2026-09-11T23:00:00Z", check_out: "2026-09-12T09:00:00Z" }
              as: FieldCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "booking A LodgingBooking.${b1}.cost_cents == 18000 (2 calendar nights Sep 10 and Sep 11 at 9000)"
            - "trigger fails with error_id == ERR_LODGING_OVERLAP despite zero shared instants — the Sep 11 calendar date collides"
            - "Unit.${u1}.lodging_fund_cents == 982000 (only booking A debited: 1000000 - 18000)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: lodging_fund_book_cancel_conservation
        grounds:
          - calculations.lodging_cost
          - state_machines.LodgingBooking.CONFIRMED_to_CANCELLED
          - entities.Unit.fields.lodging_fund_cents
        distinguishing_aspect: |
          Conserved quantity 1 (money): for any unit, lodging_fund_cents +
          sum(cost_cents of its CONFIRMED LodgingBookings) is invariant —
          booking 2 rooms x 9000 cents x 2 nights debits 36000 and cancelling
          that booking credits exactly 36000 back, returning the fund to its
          pre-booking value with zero drift.
        test_recipe:
          setup:
            - "Clock 2026-09-10T08:00:00Z. Storm WATCH; unit U1 with lodging fund 50000. Member M assigned to U1. Booking of 2 rooms at 9000 cents over [2026-09-10T14:00Z, 2026-09-12T09:00Z) confirmed."
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-1401", address: "10 Harbor Rd", lodging_fund_cents: 50000 }
              as: CommandCenterAdmin
              captures: { u1: $.data.id }
            - call: "POST /ops/crew-members"
              payload: { full_name: "Jo Vega", role: "GRILL_OP", home_unit_id: "${u1}", is_jump_team: true }
              as: FieldCoordinator
              captures: { m: $.data.id }
            - call: "POST /ops/assignments"
              payload: { crew_member_id: "${m}", unit_id: "${u1}", assigned_from: "2026-09-10T10:00:00Z", assigned_until: "2026-09-13T10:00:00Z", travel_origin: "Atlanta" }
              as: FieldCoordinator
              captures: { a1: $.data.id }
            - call: "POST /ops/lodging-bookings"
              payload: { crew_assignment_id: "${a1}", unit_id: "${u1}", rooms: 2, nightly_rate_cents: 9000, check_in: "2026-09-10T14:00:00Z", check_out: "2026-09-12T09:00:00Z" }
              as: FieldCoordinator
              captures: { b1: $.data.id }
            - call: "GET /ops/units/${u1}"
              as: CommandCenterAdmin
              captures: { fund_after_book: $.data.lodging_fund_cents }
          trigger:
            - call: "POST /ops/lodging-bookings/${b1}/cancel"
              payload: {}
              as: FieldCoordinator
            - call: "GET /ops/units/${u1}"
              as: CommandCenterAdmin
              captures: { fund_after_cancel: $.data.lodging_fund_cents }
          assert:
            - "LodgingBooking.${b1}.cost_cents == 36000 (2 rooms x 9000 x 2 nights Sep 10 + Sep 11)"
            - "after booking: Unit.${u1}.lodging_fund_cents == 14000"
            - "after cancel: Unit.${u1}.lodging_fund_cents == 50000 (book + cancel conserves the fund exactly)"
            - "LodgingBooking.${b1}.status == CANCELLED"

      - name: asset_return_redeploy_identity_conservation
        grounds:
          - state_machines.AssetAllocation.DEPLOYED_to_RETURNED
          - state_machines.AssetAllocation.RETURNED_to_DEPLOYED
          - state_machines.Asset
        distinguishing_aspect: |
          Conserved quantity 2 (asset fleet cardinality — a different quantity
          from money): an asset's return -> redeploy cycle moves it
          ALLOCATED -> RETURNED -> ALLOCATED without creating or destroying
          any Asset or AssetAllocation; exactly one allocation exists for the
          asset throughout and returned_at < dispatched_at after redeploy.
        test_recipe:
          setup:
            - "Clock 2026-09-10T08:00:00Z. Storm WATCH (inside the 48h pre-position window). Unit U1 power DOWN with a TIER1 activation. GENERATOR asset G allocated to U1 and dispatched at 08:00. Clock to 10:00, all-clear report (menu FULL)."
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-1501", address: "11 Harbor Rd" }
              as: CommandCenterAdmin
              captures: { u1: $.data.id }
            - call: "POST /ops/units/${u1}/condition-reports"
              payload: { power: "DOWN", water: "UP", gas: "UP", payment_network: "UP" }
              as: UnitManager
            - call: "POST /ops/units/${u1}/menu-activations"
              payload: { tier: "TIER1_NO_POWER" }
              as: UnitManager
            - call: "POST /ops/assets"
              payload: { kind: "GENERATOR", home_unit_id: "${u1}" }
              as: LogisticsPlanner
              captures: { g: $.data.id }
            - call: "POST /ops/allocations"
              payload: { asset_id: "${g}", unit_id: "${u1}" }
              as: LogisticsPlanner
              captures: { al: $.data.id }
            - call: "POST /ops/allocations/${al}/dispatch"
              payload: {}
              as: LogisticsPlanner
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T10:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/units/${u1}/condition-reports"
              payload: { power: "UP", water: "UP", gas: "UP", payment_network: "UP" }
              as: UnitManager
          trigger:
            - call: "POST /ops/allocations/${al}/return"
              payload: {}
              as: LogisticsPlanner
              captures: { al_st1: $.data.status }
            - call: "GET /ops/assets/${g}"
              as: LogisticsPlanner
              captures: { g_st1: $.data.status }
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T11:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/units/${u1}/condition-reports"
              payload: { power: "DOWN", water: "UP", gas: "UP", payment_network: "UP" }
              as: UnitManager
            - call: "POST /ops/allocations/${al}/dispatch"
              payload: {}
              as: LogisticsPlanner
              captures: { al_st2: $.data.status, al_disp2: $.data.dispatched_at }
            - call: "GET /ops/assets/${g}"
              as: LogisticsPlanner
              captures: { g_st2: $.data.status }
          assert:
            - "after return: AssetAllocation.${al}.status == RETURNED and Asset.${g}.status == RETURNED"
            - "after redeploy: AssetAllocation.${al}.status == DEPLOYED and Asset.${g}.status == ALLOCATED"
            - "AssetAllocation.${al}.returned_at == 2026-09-10T10:00:00.000Z and dispatched_at == 2026-09-10T11:00:00.000Z (redeploy restamps dispatch)"
            - "fleet cardinality conserved: exactly 1 asset and exactly 1 allocation for ${g} throughout (GET /assets total_count == 1; GET /allocations with asset_id filter total_count == 1)"
