              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc_id}/notify"
              payload: { channel: "EDI", sent_at: "2026-08-03T09:00:00Z" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc_id}/actual-placement"
              payload: { actual_placement_at: "2026-08-05T10:00:00Z" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc_id}/release"
              payload: { released_at: "2026-08-10T16:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/invoices"
              payload: { customer_id: "${cust_id}", billing_period_start: "2026-08-01", billing_period_end: "2026-08-31" }
              as: BillingAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /demurrage/invoices/${inv_id}/issue"
