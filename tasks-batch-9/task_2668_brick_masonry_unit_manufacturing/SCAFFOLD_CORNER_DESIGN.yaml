              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f1: "$.data.id", f1v1: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_a}", share_pct: 50.00, expected_formulation_version: "${f1v1}" }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f1v2: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_b}", share_pct: 50.00, expected_formulation_version: "${f1v2}" }
              as: BodyEngineer
              as_user_id: "body-001"
