      - name: c_sweep_marks_delinquent_establishment
        claim_type: computed_read
        grounds: [calculations.pumping_delinquency, calculations.compliance_posture]
        distinguishing_aspect: "The sweep's delinquency branch: a LOW establishment created at 2026-01-01 with no VERIFIED manifests is overdue once the clock passes created_at + 365 days; the sweep response lists it in delinquent_establishment_ids and posture becomes DELINQUENT."
        test_recipe:
          setup:
            - "clock set to 2026-01-01T00:00:00Z; LOW establishment created (freq 365); clock advanced to 2027-01-02T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
