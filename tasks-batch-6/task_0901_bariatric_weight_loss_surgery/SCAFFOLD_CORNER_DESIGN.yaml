# §1.9 Scaffold Corner Design (breadth coverage of §1.1-§1.7 claims not in §1.8)
scaffold_corner_design:

  - section: entities
    instances:
      - name: program_create_computes_baseline_bmi_and_ibw
        claim_type: Computed Fields
        grounds:
          - calculations.baseline_bmi
          - calculations.ideal_body_weight
          - entities.Program.fields.baseline_bmi
          - entities.Program.fields.ideal_body_weight_kg
        distinguishing_aspect: "POST /programs snapshots baseline_bmi=41.5 and ideal_body_weight_kg=61.437 from the patient (170cm/120kg/FEMALE); status defaults SCREENING, version 1, candidacy_status UNDETERMINED."
        test_recipe:
          setup:
            - "One FEMALE patient 170cm/120kg."
          setup_api_calls:
            - call: "POST /patients"
              payload: { mrn: "M-E1-1", full_name: "Ent One", date_of_birth: "1980-01-01", sex: "FEMALE", height_cm: 170, baseline_weight_kg: 120 }
              as: ProgramCoordinator
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /programs"
              payload: { patient_id: "${pid}", payment_pathway: "SELF_PAY", comorbidities: [] }
              as: ProgramCoordinator
              captures: { prog: $.data.id }
          assert:
            - "Program.${prog}.baseline_bmi == 41.5"
            - "Program.${prog}.ideal_body_weight_kg == 61.437"
            - "Program.${prog}.status == SCREENING"
            - "Program.${prog}.candidacy_status == UNDETERMINED"
            - "Program.${prog}.version == 1"

      - name: operating_room_default_turnover_buffer
        claim_type: Defaults
        grounds:
          - entities.OperatingRoom.fields.turnover_buffer_minutes
          - entities.OperatingRoom.fields.status
        distinguishing_aspect: "Omitting turnover_buffer_minutes applies default 30; omitting status applies default OPEN."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /operating-rooms"
              payload: { room_code: "OR-D1" }
              as: SystemAdmin
              captures: { room: $.data.id }
          assert:
            - "OperatingRoom.${room}.turnover_buffer_minutes == 30"
            - "OperatingRoom.${room}.status == OPEN"

      - name: program_not_found_on_get_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_PROGRAM_NOT_FOUND]"]
        distinguishing_aspect: "GET /programs/{unknown-uuid} returns ERR_PROGRAM_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /programs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PROGRAM_NOT_FOUND"
            - "HTTP status == 404"

      - name: surgery_case_not_found_on_get_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_SURGERY_CASE_NOT_FOUND]"]
        distinguishing_aspect: "GET /surgery-cases/{unknown} returns ERR_SURGERY_CASE_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /surgery-cases/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SURGERY_CASE_NOT_FOUND"

      - name: patient_not_found_on_program_create_returns_404
        claim_type: Parent Relationships
        grounds: ["errors[ERR_PATIENT_NOT_FOUND]", entities.Program.fields.patient_id]
        distinguishing_aspect: "POST /programs with an unknown patient_id returns ERR_PATIENT_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { patient_id: "00000000-0000-0000-0000-000000000000", payment_pathway: "SELF_PAY", comorbidities: [] }
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PATIENT_NOT_FOUND"

      - name: insurance_plan_not_found_on_program_create_returns_404
        claim_type: Parent Relationships
        grounds: ["errors[ERR_INSURANCE_PLAN_NOT_FOUND]", entities.Program.fields.insurance_plan_id]
        distinguishing_aspect: "POST /programs pathway=INSURANCE with an unknown insurance_plan_id returns ERR_INSURANCE_PLAN_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "One patient."
          setup_api_calls:
            - call: "POST /patients"
              payload: { mrn: "M-E2-1", full_name: "Ent Two", date_of_birth: "1980-01-01", sex: "MALE", height_cm: 180, baseline_weight_kg: 140 }
              as: ProgramCoordinator
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /programs"
              payload: { patient_id: "${pid}", payment_pathway: "INSURANCE", insurance_plan_id: "00000000-0000-0000-0000-000000000000", comorbidities: [] }
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INSURANCE_PLAN_NOT_FOUND"

      - name: pathway_plan_mismatch_self_pay_with_plan
        claim_type: Type Constraints
        grounds: ["errors[ERR_PATHWAY_PLAN_MISMATCH]", "validations[priority=6]"]
        distinguishing_aspect: "POST /programs pathway=SELF_PAY carrying an insurance_plan_id returns ERR_PATHWAY_PLAN_MISMATCH (422)."
        test_recipe:
          setup:
            - "One patient and one insurance plan."
          setup_api_calls:
            - call: "POST /insurance-plans"
              payload: { plan_name: "PayerX", payer_code: "PX", required_supervised_diet_months: 6, qualifying_comorbidities: ["TYPE_2_DIABETES"] }
              as: SystemAdmin
              captures: { plan: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "M-E3-1", full_name: "Ent Three", date_of_birth: "1980-01-01", sex: "MALE", height_cm: 180, baseline_weight_kg: 140 }
              as: ProgramCoordinator
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /programs"
              payload: { patient_id: "${pid}", payment_pathway: "SELF_PAY", insurance_plan_id: "${plan}", comorbidities: [] }
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PATHWAY_PLAN_MISMATCH"

  - section: validations
    instances:
      - name: patient_create_missing_required_field_returns_validation
        claim_type: Violation to Error
        grounds: ["errors[ERR_VALIDATION]", "validations[priority=4]"]
        distinguishing_aspect: "POST /patients missing height_cm returns ERR_VALIDATION (400)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { mrn: "M-V1-1", full_name: "Val One", date_of_birth: "1980-01-01", sex: "MALE", baseline_weight_kg: 140 }
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: program_create_invalid_pathway_enum_returns_validation
        claim_type: Violation to Error
        grounds: ["errors[ERR_VALIDATION]", entities.Program.fields.payment_pathway]
        distinguishing_aspect: "POST /programs with payment_pathway='CASH' (not in the enum) returns ERR_VALIDATION (400)."
        test_recipe:
          setup:
            - "One patient."
          setup_api_calls:
            - call: "POST /patients"
              payload: { mrn: "M-V2-1", full_name: "Val Two", date_of_birth: "1980-01-01", sex: "MALE", height_cm: 180, baseline_weight_kg: 140 }
              as: ProgramCoordinator
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /programs"
              payload: { patient_id: "${pid}", payment_pathway: "CASH", comorbidities: [] }
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: down_payment_exceeds_bundle_returns_422
        claim_type: Aggregate validation
        grounds: ["errors[ERR_DOWN_PAYMENT_EXCEEDS_BUNDLE]", "validations[priority=19]"]
        distinguishing_aspect: "Financing with down_payment_cents 99999999 above the 1944000 SLEEVE bundle (SELF_PAY, correct version) returns ERR_DOWN_PAYMENT_EXCEEDS_BUNDLE (422)."
        test_recipe:
          setup:
            - "SELF_PAY female 170/120 program (baseline_bmi 41.5) in SCREENING; financing has no status precondition."
          setup_api_calls:
            - call: "POST /patients"
              payload: { mrn: "M-V3-1", full_name: "Val Three", date_of_birth: "1980-01-01", sex: "FEMALE", height_cm: 170, baseline_weight_kg: 120 }
              as: ProgramCoordinator
              captures: { pid: $.data.id }
            - call: "POST /programs"
              payload: { patient_id: "${pid}", payment_pathway: "SELF_PAY", comorbidities: [] }
              as: ProgramCoordinator
              captures: { prog: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /programs/${prog}/financing-plan"
              payload: { procedure_type: "SLEEVE_GASTRECTOMY", down_payment_cents: 99999999, term_months: 12, apr_bps: 1200, expected_program_version: "${v0}" }
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DOWN_PAYMENT_EXCEEDS_BUNDLE"

  - section: state_machines
    instances:
      - name: request_clearance_from_screening_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Program.ELIGIBLE_to_CLEARANCE_IN_PROGRESS
          - errors[ERR_INVALID_PROGRAM_STATE]
        distinguishing_aspect: "request-clearance requires ELIGIBLE; calling it on a SCREENING program (candidacy not yet run) returns ERR_INVALID_PROGRAM_STATE (409)."
        test_recipe:
          setup:
            - "SELF_PAY program freshly created (SCREENING)."
          setup_api_calls:
            - call: "POST /patients"
              payload: { mrn: "M-S1-1", full_name: "Sm One", date_of_birth: "1980-01-01", sex: "MALE", height_cm: 180, baseline_weight_kg: 150 }
              as: ProgramCoordinator
              captures: { pid: $.data.id }
            - call: "POST /programs"
              payload: { patient_id: "${pid}", payment_pathway: "SELF_PAY", comorbidities: [] }
              as: ProgramCoordinator
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /programs/${prog}/request-clearance"
              payload: {}
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_PROGRAM_STATE"

      - name: candidacy_review_twice_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Program.SCREENING_to_CANDIDACY_REVIEW
          - errors[ERR_INVALID_PROGRAM_STATE]
        distinguishing_aspect: "A second candidacy-review after the program left SCREENING (now ELIGIBLE) returns ERR_INVALID_PROGRAM_STATE (409)."
        test_recipe:
          setup:
            - "SELF_PAY female 170/120 program reviewed once (ELIGIBLE)."
          setup_api_calls:
            - call: "POST /patients"
              payload: { mrn: "M-S2-1", full_name: "Sm Two", date_of_birth: "1980-01-01", sex: "FEMALE", height_cm: 170, baseline_weight_kg: 120 }
              as: ProgramCoordinator
              captures: { pid: $.data.id }
            - call: "POST /programs"
              payload: { patient_id: "${pid}", payment_pathway: "SELF_PAY", comorbidities: [] }
              as: ProgramCoordinator
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/candidacy-review"
              payload: {}
              as: ProgramCoordinator
          trigger:
            - call: "POST /programs/${prog}/candidacy-review"
              payload: {}
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_PROGRAM_STATE"

      - name: reevaluate_pending_psych_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.PsychEvaluation.DEFERRED_to_PENDING
          - errors[ERR_INVALID_PSYCH_STATE]
        distinguishing_aspect: "reevaluate requires DEFERRED; calling it on a still-PENDING evaluation returns ERR_INVALID_PSYCH_STATE (409)."
        test_recipe:
          setup:
            - "SELF_PAY program in CLEARANCE_IN_PROGRESS with a PENDING psych evaluation."
          setup_api_calls:
            - call: "POST /patients"
              payload: { mrn: "M-S3-1", full_name: "Sm Three", date_of_birth: "1980-01-01", sex: "FEMALE", height_cm: 170, baseline_weight_kg: 120 }
              as: ProgramCoordinator
              captures: { pid: $.data.id }
            - call: "POST /programs"
              payload: { patient_id: "${pid}", payment_pathway: "SELF_PAY", comorbidities: [] }
              as: ProgramCoordinator
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/candidacy-review"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/request-clearance"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/psych-evaluations"
              payload: {}
              as: BehavioralHealthClinician
              captures: { pe: $.data.id }
          trigger:
            - call: "POST /psych-evaluations/${pe}/reevaluate"
              payload: {}
              as: BehavioralHealthClinician
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_PSYCH_STATE"

      - name: psych_evaluation_not_found_on_decision_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_PSYCH_EVALUATION_NOT_FOUND]"]
        distinguishing_aspect: "POST /psych-evaluations/{unknown}/decision returns ERR_PSYCH_EVALUATION_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /psych-evaluations/00000000-0000-0000-0000-000000000000/decision"
              payload: { decision: "CLEARED" }
              as: BehavioralHealthClinician
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PSYCH_EVALUATION_NOT_FOUND"

      - name: complication_not_found_on_resolve_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_COMPLICATION_NOT_FOUND]"]
        distinguishing_aspect: "POST /complications/{unknown}/resolve returns ERR_COMPLICATION_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /complications/00000000-0000-0000-0000-000000000000/resolve"
              payload: {}
              as: Surgeon
              as_user_id: "00000000-0000-0000-0000-0000000000aa"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_COMPLICATION_NOT_FOUND"

      - name: follow_up_visit_not_found_on_record_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_FOLLOW_UP_VISIT_NOT_FOUND]"]
        distinguishing_aspect: "POST /follow-up-visits/{unknown}/record returns ERR_FOLLOW_UP_VISIT_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /follow-up-visits/00000000-0000-0000-0000-000000000000/record"
              payload: { recorded_weight_kg: 100 }
              as: Dietitian
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FOLLOW_UP_VISIT_NOT_FOUND"

  - section: errors
    instances:
      - name: surgeon_not_found_on_schedule_returns_404
        claim_type: violation_to_error
        grounds: ["errors[ERR_SURGEON_NOT_FOUND]", "validations[priority=5]"]
        distinguishing_aspect: "Body-FK existence (prio 5) precedes the CLEARED state check (prio 8): scheduling on a SCREENING program with an unknown surgeon_id returns ERR_SURGEON_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "SELF_PAY program in SCREENING; a valid OPEN room exists; surgeon_id is unknown."
          setup_api_calls:
            - call: "POST /operating-rooms"
              payload: { room_code: "OR-NF1", turnover_buffer_minutes: 30 }
              as: SystemAdmin
              captures: { room: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "M-NF1-1", full_name: "Nf One", date_of_birth: "1980-01-01", sex: "FEMALE", height_cm: 170, baseline_weight_kg: 120 }
              as: ProgramCoordinator
              captures: { pid: $.data.id }
            - call: "POST /programs"
              payload: { patient_id: "${pid}", payment_pathway: "SELF_PAY", comorbidities: [] }
              as: ProgramCoordinator
              captures: { prog: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /programs/${prog}/surgery-cases"
              payload: { operating_room_id: "${room}", surgeon_id: "00000000-0000-0000-0000-000000000000", procedure_type: "SLEEVE_GASTRECTOMY", scheduled_start: "2026-06-15T08:00:00Z", scheduled_end: "2026-06-15T09:30:00Z", expected_program_version: "${v0}" }
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SURGEON_NOT_FOUND"

      - name: operating_room_not_found_on_schedule_returns_404
        claim_type: violation_to_error
        grounds: ["errors[ERR_OPERATING_ROOM_NOT_FOUND]", "validations[priority=5]"]
        distinguishing_aspect: "Body-FK existence (prio 5) precedes the CLEARED state check: scheduling on a SCREENING program with an unknown operating_room_id returns ERR_OPERATING_ROOM_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "SELF_PAY program in SCREENING; a valid credentialed surgeon exists; operating_room_id is unknown."
          setup_api_calls:
            - call: "POST /surgeons"
              payload: { full_name: "Dr NF", npi: "1000000020", credentialed_procedures: ["SLEEVE_GASTRECTOMY"] }
              as: SystemAdmin
              captures: { surg: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "M-NF2-1", full_name: "Nf Two", date_of_birth: "1980-01-01", sex: "FEMALE", height_cm: 170, baseline_weight_kg: 120 }
              as: ProgramCoordinator
              captures: { pid: $.data.id }
            - call: "POST /programs"
              payload: { patient_id: "${pid}", payment_pathway: "SELF_PAY", comorbidities: [] }
              as: ProgramCoordinator
              captures: { prog: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /programs/${prog}/surgery-cases"
              payload: { operating_room_id: "00000000-0000-0000-0000-000000000000", surgeon_id: "${surg}", procedure_type: "SLEEVE_GASTRECTOMY", scheduled_start: "2026-06-15T08:00:00Z", scheduled_end: "2026-06-15T09:30:00Z", expected_program_version: "${v0}" }
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_OPERATING_ROOM_NOT_FOUND"

      - name: duplicate_milestone_code_returns_409
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_MILESTONE]", "validations[priority=13]"]
        distinguishing_aspect: "A second EducationMilestone with milestone_code NUTRITION_CLASS on the same program returns ERR_DUPLICATE_MILESTONE (409)."
        test_recipe:
          setup:
            - "SELF_PAY program in CLEARANCE_IN_PROGRESS with milestone NUTRITION_CLASS already recorded."
          setup_api_calls:
            - call: "POST /patients"
              payload: { mrn: "M-DM-1", full_name: "Dm One", date_of_birth: "1980-01-01", sex: "FEMALE", height_cm: 170, baseline_weight_kg: 120 }
              as: ProgramCoordinator
              captures: { pid: $.data.id }
            - call: "POST /programs"
              payload: { patient_id: "${pid}", payment_pathway: "SELF_PAY", comorbidities: [] }
              as: ProgramCoordinator
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/candidacy-review"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/request-clearance"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/milestones"
              payload: { milestone_code: "NUTRITION_CLASS", completed: true }
              as: ProgramCoordinator
          trigger:
            - call: "POST /programs/${prog}/milestones"
              payload: { milestone_code: "NUTRITION_CLASS", completed: true }
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_MILESTONE"

      - name: duplicate_diet_month_returns_409
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_DIET_MONTH]", "validations[priority=14]"]
        distinguishing_aspect: "A second SupervisedDietVisit with month_index 1 on the same program returns ERR_DUPLICATE_DIET_MONTH (409)."
        test_recipe:
          setup:
            - "INSURANCE program in CLEARANCE_IN_PROGRESS with a month_index=1 diet visit already logged."
          setup_api_calls:
            - call: "POST /insurance-plans"
              payload: { plan_name: "PayerD", payer_code: "PD", required_supervised_diet_months: 6, qualifying_comorbidities: ["TYPE_2_DIABETES"] }
              as: SystemAdmin
              captures: { plan: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "M-DD-1", full_name: "Dd One", date_of_birth: "1980-01-01", sex: "FEMALE", height_cm: 170, baseline_weight_kg: 120 }
              as: ProgramCoordinator
              captures: { pid: $.data.id }
            - call: "POST /programs"
              payload: { patient_id: "${pid}", payment_pathway: "INSURANCE", insurance_plan_id: "${plan}", comorbidities: [] }
              as: ProgramCoordinator
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/candidacy-review"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/request-clearance"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /programs/${prog}/diet-visits"
              payload: { month_index: 1, visit_date: "2026-02-01", weight_kg: 119, attended: true }
              as: Dietitian
          trigger:
            - call: "POST /programs/${prog}/diet-visits"
              payload: { month_index: 1, visit_date: "2026-02-15", weight_kg: 118, attended: true }
              as: Dietitian
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_DIET_MONTH"

      - name: financing_stale_program_version_returns_412
        claim_type: violation_to_error
        grounds:
          - "concurrency_rules[financing-plan-supersede-stale-program]"
          - "errors[ERR_STALE_PROGRAM_VERSION]"
          - "validations[priority=20]"
        distinguishing_aspect: "OCC: after an ACTIVE financing plan is created (program.version advances), a second create carrying the pre-advance expected_program_version is rejected with ERR_STALE_PROGRAM_VERSION (412)."
        test_recipe:
          setup:
            - "SELF_PAY female 170/120 program in SCREENING; one financing plan created against version v0 (advancing the program)."
          setup_api_calls:
            - call: "POST /patients"
              payload: { mrn: "M-OCC-1", full_name: "Occ One", date_of_birth: "1980-01-01", sex: "FEMALE", height_cm: 170, baseline_weight_kg: 120 }
              as: ProgramCoordinator
              captures: { pid: $.data.id }
            - call: "POST /programs"
              payload: { patient_id: "${pid}", payment_pathway: "SELF_PAY", comorbidities: [] }
              as: ProgramCoordinator
              captures: { prog: $.data.id, v0: $.data.version }
            - call: "POST /programs/${prog}/financing-plan"
              payload: { procedure_type: "SLEEVE_GASTRECTOMY", down_payment_cents: 100000, term_months: 12, apr_bps: 1200, expected_program_version: "${v0}" }
              as: BillingSpecialist
          trigger:
            - call: "POST /programs/${prog}/financing-plan"
              payload: { procedure_type: "SLEEVE_GASTRECTOMY", down_payment_cents: 100000, term_months: 12, apr_bps: 1200, expected_program_version: "${v0}" }
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_PROGRAM_VERSION"
            - "HTTP status == 412"

  - section: rbac
    instances:
      - name: unauthenticated_missing_headers_returns_401
        claim_type: role_denied
        grounds: ["errors[ERR_UNAUTHENTICATED]", "validations[priority=1]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers returns ERR_UNAUTHENTICATED (401) before any existence check."
        test_recipe:
          setup:
            - "Empty DB; auth precedes existence so a fake id is fine."
          setup_api_calls: []
          trigger:
            - call: "GET /programs/00000000-0000-0000-0000-000000000000"
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED"
            - "HTTP status == 401"

      - name: unauthorized_dietitian_creates_patient_returns_403
        claim_type: role_denied
        grounds: ["errors[ERR_UNAUTHORIZED]", "validations[priority=2]", "roles.ProgramCoordinator"]
        distinguishing_aspect: "POST /patients is exclusive to ProgramCoordinator; a Dietitian caller returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { mrn: "M-RB-1", full_name: "Rb One", date_of_birth: "1980-01-01", sex: "MALE", height_cm: 180, baseline_weight_kg: 150 }
              as: Dietitian
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"
            - "HTTP status == 403"

