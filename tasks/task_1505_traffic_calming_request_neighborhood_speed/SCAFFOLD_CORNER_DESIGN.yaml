              as: TrafficEngineer
              captures: { st1: $.data.id }
            - { call: "POST /api/speed-studies/${st1}/observations", payload: { observation_date: "2026-08-03", vehicle_count: 3000, p85_speed_mph: 40.0, mean_speed_mph: 33.0 }, as: TrafficEngineer }
            - { call: "POST /api/speed-studies/${st1}/observations", payload: { observation_date: "2026-08-04", vehicle_count: 3000, p85_speed_mph: 40.0, mean_speed_mph: 33.0 }, as: TrafficEngineer }
            - { call: "POST /api/speed-studies/${st1}/observations", payload: { observation_date: "2026-08-05", vehicle_count: 3000, p85_speed_mph: 40.0, mean_speed_mph: 33.0 }, as: TrafficEngineer }
            - { call: "POST /api/speed-studies/${st1}/analyze", payload: {}, as: TrafficEngineer }
            - { call: "POST /api/speed-studies/${st1}/certify", payload: {}, as: TrafficEngineer }
            - call: "POST /api/requests"
              payload: { street_segment_id: "${seg2}", title: "Republish R2", requested_budget_cents: 10000 }
              as: Resident
              as_user_id: "${u2a}"
              captures: { req2: $.data.id }
            - { call: "POST /api/requests/${req2}/open-petition", payload: {}, as: TrafficEngineer }
