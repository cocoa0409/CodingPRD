      - name: releasing_a_bound_or_an_already_released_line_is_refused
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.SigningLine.terminal_states
          - validations[priority=27]
          - validations[priority=32]
          - errors.ERR_SIGNING_LINE_STATE_INVALID
        distinguishing_aspect: |
          BOUND and RELEASED are both terminal for SigningLine and the line-state rule at priority 27
          answers before the program-state rule at 32. Charlie's oversubscribing line is released once
          (RELEASED, release_reason WITHDRAWN_BY_BROKER, layer back to exactly 100.0000 and therefore
          FULLY_PLACED with the program still FIRM_ORDER); a second release of the same line is 409
          ERR_SIGNING_LINE_STATE_INVALID. After the program binds, Alpha's BOUND line is refused with
          the SAME line-state error even though the program is no longer FIRM_ORDER either.
        test_recipe:
          setup:
            - "A FIRM_ORDER program whose CAT layer is FULLY_PLACED by Alpha Re 60.0000 (lead) and Bravo Re 40.0000, with an ACKNOWLEDGED disclosure so it can bind on demand."
            - "A third market, Charlie Re, has quoted 30.0000 but has not yet been firm-ordered."
