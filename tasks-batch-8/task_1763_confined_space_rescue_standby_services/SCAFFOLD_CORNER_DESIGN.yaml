  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: corner_quarter_hour_roundup
        claim_type: correct_result
        grounds: [calculations.standby_line_amount_hourly]
        distinguishing_aspect: "61 actual minutes round UP to 75 billable minutes (ceil to 15-minute grid): 1.25h * 20000 = 25000 cents with a 1h account minimum that does not bind."
        test_recipe:
          setup: ["HOURLY account (min 1h); ISSUED permit; assignment window 10:00-20:00 checked in 10:00, released at 11:01 (61 min)"]
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Lead One", role_qualifications: ["RESCUE_LEAD"] }, as: OperationsManager, captures: { rtl_id: "$.data.id" } }
