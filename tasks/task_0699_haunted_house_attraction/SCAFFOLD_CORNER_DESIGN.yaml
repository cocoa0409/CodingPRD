              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /reservations/${r_id}/tickets"
              payload: { time_slot_id: "${slot_id}", guest_age: 30, max_scare_level: 1, tier: "VIP" }
              as: BoxOffice
