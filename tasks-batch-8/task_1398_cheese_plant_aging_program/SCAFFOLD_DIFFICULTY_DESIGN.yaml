            - { call: "POST /plant/make-sheets/${make_id}/start", payload: {}, as: Cheesemaker, as_user_id: "cm_alice", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ADDITIVE_LOT_UNUSABLE"
            - "MakeSheet.${make_id}.status == SCHEDULED (unchanged)"
            - "AdditiveLot.${cul_id}.quantity_on_hand == 100.0 (no consumption)"

