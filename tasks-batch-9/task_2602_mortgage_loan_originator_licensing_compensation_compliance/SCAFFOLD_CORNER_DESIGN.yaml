      - name: renewal_request_moves_active_license_to_renewal_pending
        claim_type: valid_transition
        grounds:
          - state_machines.LicenseRegistration.ACTIVE_to_RENEWAL_PENDING
          - calculations.ce_compliance_evaluation
          - endpoints[POST /license-registrations/{id}/renewal-requests]
        distinguishing_aspect: |
          Filed at 2026-11-15 (inside [renewal_window_opens_at 2026-11-01, expiration_date
          2027-01-31)) the request moves the licence ACTIVE -> RENEWAL_PENDING, recomputes
          ce_hours_applied to 0 / ce_satisfied false under CALENDAR_YEAR_ATTRIBUTION, leaves
          expiration_date at 2027-01-31T00:00:00Z, and RETAINS authority: CA is still in
          authorized_state_codes.
        test_recipe:
          setup:
            - "Originator 2200001 with an ACTIVE, sponsored CA licence (window opens
               2026-11-01, expires 2027-01-31, required_ce_hours 8) and no CE credits filed."
            - "The clock is moved to 2026-11-15T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /originators"
              payload: { nmls_unique_id: "2200001", legal_name: "Avery Lane", hire_date: "2024-01-15T00:00:00Z" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { orig_id: $.data.id }
            - call: "POST /license-registrations"
              payload: { originator_id: "${orig_id}", state_code: "CA", license_number: "CA-DFPI-70001", issue_date: "2026-01-02T00:00:00Z", expiration_date: "2027-01-31T00:00:00Z", renewal_window_opens_at: "2026-11-01T00:00:00Z", ce_reporting_year: 2026, required_ce_hours: 8 }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_id: $.data.id }
            - call: "POST /license-registrations/${lic_id}/activations"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_v: $.data.version }
            - call: "POST /license-registrations/${lic_id}/sponsorship-transfers"
              payload: { sponsoring_institution_code: "INST-0001", effective_at: "2026-07-01T00:00:00Z", expected_license_registration_version: "${lic_v}" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /license-registrations/${lic_id}/renewal-requests"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { st: $.data.status, hrs: $.data.ce_hours_applied, sat: $.data.ce_satisfied, exp: $.data.expiration_date, aea: $.data.authority_effective_at }
            - call: "GET /originators/${orig_id}/authority"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { states: $.data.authorized_state_codes, asof: $.data.as_of }
          assert:
            - "HTTP status is 200"
            - "${st} == RENEWAL_PENDING"
            - "${hrs} == 0 and ${sat} == false"
            - "${exp} == 2027-01-31T00:00:00Z (the request does not roll the expiry forward)"
            - "${aea} == 2026-08-01T00:00:00Z (unchanged by the request)"
            - "${states} == [CA] and ${asof} == 2026-11-15T00:00:00Z"

      - name: renewal_request_before_window_opens_returns_renewal_window_closed
        claim_type: precondition_enforcement
        grounds:
          - state_machines.LicenseRegistration.ACTIVE_to_RENEWAL_PENDING
