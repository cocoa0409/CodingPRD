              payload: {}
              as: BillingAdmin
              captures: { at_two_days: "$.data[0].gross_amount_cents" }
              notes: "clock is still 2026-08-01 but the provisional line is computed against the recorded instants; free time expired 2026-08-07T23:59:59.999Z"
            - call: "POST /demurrage/placement-cycles/${cyc1_id}/release"
              payload: { released_at: "2026-08-09T16:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /demurrage/charges?placement_cycle_id=${cyc1_id}&limit=10&offset=0"
              payload: {}
              as: BillingAdmin
              captures: { two_day_gross: "$.data[0].gross_amount_cents", two_day_count: "$.data[0].billable_days" }
            - call: "POST /demurrage/placement-cycles/${cyc2_id}/release"
              payload: { released_at: "2026-08-10T16:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /demurrage/charges?placement_cycle_id=${cyc2_id}&limit=10&offset=0"
              payload: {}
