              as: PlatformAdmin
            - call: "POST /voip/jurisdictions"
              payload: { state_code: "CA", county_fips: "06001", fee_type: "PER_LINE", monthly_fee_cents: 175, remit_day_of_month: 5 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
          trigger:
            - call: "POST /voip/number-blocks"
              payload: { jurisdiction_id: "${jur_id}", npa_nxx: "415629", total_capacity: 4, max_concurrent_reservations: 2 }
              as: PortingSpecialist
              as_user_id: "porting-1"
            - call: "POST /voip/cutover-slots"
              payload: { carrier_id: "00000000-0000-4000-8000-0000000000aa", window_start: "2026-08-06T14:00:00Z", window_end: "2026-08-06T18:00:00Z" }
              as: NumberingAdmin
            - call: "POST /voip/fee-assessments"
              payload: { account_id: "00000000-0000-4000-8000-0000000000bb", jurisdiction_id: "${jur_id}", period_month: "2026-07" }
              as: E911Validator
            - call: "POST /voip/port-requests/00000000-0000-4000-8000-0000000000cc/reject"
              payload: { reason_code: "PIN_INVALID" }
              as: SecurityAnalyst
            - call: "POST /voip/jurisdictions/${jur_id}/remittance-runs"
              payload: { period_month: "2026-07" }
              as: NumberingAdmin
          assert:
            - "every one of the five triggers returns HTTP 403 with error_id ERR_ROLE_NOT_PERMITTED"
            - "none of them returns ERR_RESOURCE_NOT_FOUND, ERR_ACCOUNT_NOT_FOUND or ERR_PORT_REQUEST_NOT_FOUND despite the fabricated ids"
            - "GET /voip/number-blocks?jurisdiction_id=${jur_id} as NumberingAdmin returns total_count 0, so nothing was written"

      - name: e911_validator_cannot_capture_the_location_it_verifies
        claim_type: role_exclusivity
        grounds:
