              captures: { e_code: "$.data.error_id" }
            - call: "POST /laboratories"
              payload: { name: "Westbrook Testing", certification_id: "CERT-001", certified_methods: ["METHOD_1633"], lowest_achievable_dl_ng_per_l: 0.50, certification_expires_on: "2029-06-30T00:00:00.000Z", daily_analysis_capacity: 12 }
              as: UtilityAdmin
              captures: { e_cert: "$.data.error_id" }
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "SURFACE_WATER", population_served: 9000 }
