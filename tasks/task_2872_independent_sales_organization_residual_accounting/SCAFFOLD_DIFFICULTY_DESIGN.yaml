  - rule_id: compensating_invariant
    instances:

      - name: batch_reverse_conserves_residual_distribution
        grounds:
          - state_machines.ResidualBatch.POSTED_to_REVERSED (COMPENSATION side effects)
          - calculations.statement_net_payable
          - entities.Agent.fields.trailing_residual_cents
          - entities.ProcessorProgram.fields.posted_batch_count
        distinguishing_aspect: |
          Reverse must undo all four posting links in the opposite order and leave no
          drift: allocations and profitability rows deleted, the three auto-created
          statements recomputed to zero (but NOT deleted), all three
          Agent.trailing_residual_cents back to 0, batch.iso_retained_cents 0 with
          posted_at cleared, and the program's posted_batch_count decremented back to 0
          — every field returns to its exact pre-post value while the batch itself lands
          in the terminal REVERSED state.
        test_recipe:
          setup:
            - "Hierarchy A1 -> A2 -> A3 with M1 owned by A3 (equipment 3900, both July chargebacks)."
            - "The 2026-07 batch is POSTED, producing 1 profitability row, 3 allocations, 3 DRAFT statements and three non-zero trailing KPIs."
            - "No statement of 2026-07 is issued, so the period is unlocked and reversal is permitted."
          setup_api_calls:
            - call: "POST /processor-programs"
              payload: { name: "FirstAtlantic Core", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT" }
              as: IsoAdmin
              captures: { p1: $.data.id }
            - call: "POST /agents"
