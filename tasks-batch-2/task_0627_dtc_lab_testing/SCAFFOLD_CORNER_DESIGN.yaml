          trigger:
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cartoa}", test_offering_id: "${off_ow}" }
              as: Patient
              as_user_id: "${pob}"
              captures: { err: '$.data.error_id' }
          assert: ["returns 403 ERR_NOT_RESOURCE_OWNER"]

      - name: lab_tech_release_own_collected_specimen_sod_denied
        claim_type: ownership_denial
        grounds: ["roles", "validations[priority=9]", "errors[ERR_SOD_COLLECTOR_CANNOT_RELEASE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_vs_business_safety_release_critical_unack_state_wins
          rationale: "The SoD collector-cannot-release guard (priority 9) participates in the named §1.8 priority-conflict instance; its standalone trigger is the same business_safety check."

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_cart_version_on_checkout_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[cart-checkout-stale-cart]", "errors[ERR_STALE_CART_VERSION]"]
        distinguishing_aspect: "Checkout carrying an expected_cart_version one behind the current (after a line add bumped it) returns 412 ERR_STALE_CART_VERSION."
        test_recipe:
          setup: ["Offering OC1 @1000, OC2 @1000. Patient POC. Cart with one line; client reads version, then a second line is added (version bumps)."]
          setup_api_calls:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "OC1", display_name: "OCC One", list_price_cents: 1000, specimen_type: "BLOOD" }
              as: CatalogAdmin
              captures: { off_oc1: '$.data.id' }
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "OC2", display_name: "OCC Two", list_price_cents: 1000, specimen_type: "BLOOD" }
              as: CatalogAdmin
              captures: { off_oc2: '$.data.id' }
            - call: "POST /catalog/patients"
              payload: { email: "poc@x.com", full_name: "POC", date_of_birth: "1990-01-01", state_code: "CA" }
              as: CatalogAdmin
              captures: { poc: '$.data.id' }
            - call: "POST /catalog/carts"
              payload: { patient_id: "${poc}", fund_source: "CARD" }
              as: Patient
              as_user_id: "${poc}"
              captures: { cartoc: '$.data.id' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cartoc}", test_offering_id: "${off_oc1}" }
              as: Patient
              as_user_id: "${poc}"
            - call: "GET /catalog/carts/${cartoc}"
              as: Patient
              as_user_id: "${poc}"
              captures: { cartoc_v_stale: '$.data.version' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cartoc}", test_offering_id: "${off_oc2}" }
              as: Patient
              as_user_id: "${poc}"
          trigger:
            - call: "POST /catalog/orders"
              payload: { cart_id: "${cartoc}", fulfillment_mode: "HOME_KIT", expected_cart_version: "${cartoc_v_stale}" }
              as: Patient
              as_user_id: "${poc}"
              captures: { err: '$.data.error_id' }
          assert: ["returns 412 ERR_STALE_CART_VERSION"]

      - name: occ_correct_cart_version_checkout_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[cart-checkout-stale-cart]", "state_machines.Order.payment_status=AUTH_PENDING_to_payment_status=AUTHORIZED"]
        distinguishing_aspect: "Checkout with the current expected_cart_version succeeds (201) and Cart.status becomes CHECKED_OUT."
        test_recipe:
          setup: ["Offering OK1 @1000. Patient POK. Cart with one line; client reads the up-to-date version."]
          setup_api_calls:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "OK1", display_name: "OK One", list_price_cents: 1000, specimen_type: "BLOOD" }
              as: CatalogAdmin
              captures: { off_ok1: '$.data.id' }
            - call: "POST /catalog/patients"
              payload: { email: "pok@x.com", full_name: "POK", date_of_birth: "1990-01-01", state_code: "CA" }
              as: CatalogAdmin
              captures: { pok: '$.data.id' }
            - call: "POST /catalog/carts"
              payload: { patient_id: "${pok}", fund_source: "CARD" }
              as: Patient
              as_user_id: "${pok}"
              captures: { cartok: '$.data.id' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cartok}", test_offering_id: "${off_ok1}" }
              as: Patient
              as_user_id: "${pok}"
            - call: "GET /catalog/carts/${cartok}"
              as: Patient
              as_user_id: "${pok}"
              captures: { cartok_v: '$.data.version' }
          trigger:
            - call: "POST /catalog/orders"
              payload: { cart_id: "${cartok}", fulfillment_mode: "HOME_KIT", expected_cart_version: "${cartok_v}" }
              as: Patient
              as_user_id: "${pok}"
              captures: { orderok: '$.data.id' }
            - call: "GET /catalog/carts/${cartok}"
              as: Patient
              as_user_id: "${pok}"
              captures: { cartok_status: '$.data.status' }
          assert:
            - "order placement returns 201"
            - "Cart.${cartok}.status == CHECKED_OUT"

      - name: occ_stale_order_version_on_capture_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-capture-stale-order]", "errors[ERR_STALE_ORDER_VERSION]"]
        distinguishing_aspect: "Capture carrying an expected_order_version one behind the current (after a release bumped it) returns 412 ERR_STALE_ORDER_VERSION."
        test_recipe:
          setup: ["Offering OO @4000. Patient POO. HOME_KIT order; client reads order.version pre-release, then result released (version bumps), then capture with the stale version."]
          setup_api_calls:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "OO", display_name: "Order OCC", list_price_cents: 4000, specimen_type: "BLOOD" }
              as: CatalogAdmin
              captures: { off_oo: '$.data.id' }
            - call: "POST /catalog/patients"
              payload: { email: "poo@x.com", full_name: "POO", date_of_birth: "1990-01-01", state_code: "CA" }
              as: CatalogAdmin
              captures: { poo: '$.data.id' }
            - call: "POST /catalog/carts"
              payload: { patient_id: "${poo}", fund_source: "CARD" }
              as: Patient
              as_user_id: "${poo}"
              captures: { cartoo: '$.data.id' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cartoo}", test_offering_id: "${off_oo}" }
              as: Patient
              as_user_id: "${poo}"
            - call: "GET /catalog/carts/${cartoo}"
              as: Patient
              as_user_id: "${poo}"
              captures: { cartoo_v: '$.data.version' }
            - call: "POST /catalog/orders"
              payload: { cart_id: "${cartoo}", fulfillment_mode: "HOME_KIT", expected_cart_version: "${cartoo_v}" }
              as: Patient
              as_user_id: "${poo}"
              captures: { orderoo: '$.data.id', orderoo_v_stale: '$.data.version' }
            - call: "POST /catalog/home-kits"
              payload: { order_id: "${orderoo}", shipping_state_code: "CA" }
              as: Patient
              as_user_id: "${poo}"
            - call: "GET /catalog/order-lines?order_id=${orderoo}"
              as: CatalogAdmin
              captures: { oloo: '$.data[0].id' }
            - call: "POST /catalog/order-lines/${oloo}/collect"
              as: PhlebotomyTech
              captures: { specoo: '$.data.id' }
            - call: "POST /catalog/specimens/${specoo}/process"
              payload: { analyzer_value: 5 }
              as: LabTech
              captures: { resoo: '$.data.id' }
            - call: "POST /catalog/lab-results/${resoo}/release"
              as: LabTech
          trigger:
            - call: "POST /catalog/orders/${orderoo}/capture-payment"
              payload: { expected_order_version: "${orderoo_v_stale}" }
              as: Patient
              as_user_id: "${poo}"
              captures: { err: '$.data.error_id' }
          assert: ["returns 412 ERR_STALE_ORDER_VERSION"]

      - name: repeat_discount_lookback_window_boundary
        claim_type: rate_threshold_triggers
        grounds: [calculations.cart_estimated_total, entities.CartLine.fields.repeat_discount_applied, endpoints]
        distinguishing_aspect: "repeat_discount_applied is true on a line for a test_code with a prior RELEASED result inside REPEAT_LOOKBACK_DAYS; per-line net for a 4000 line is round_half_up(4000*0.85)=3400."
        test_recipe:
          setup: ["Offering RPD @4000. Patient PRD with a prior RELEASED RPD result. Fresh cart with one RPD line."]
          setup_api_calls:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "RPD", display_name: "Repeat Disc", list_price_cents: 4000, specimen_type: "BLOOD" }
              as: CatalogAdmin
              captures: { off_rpd: '$.data.id' }
