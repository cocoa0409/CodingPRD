          assert:
            - "${count0} == 0"
            - "${cmp1_risk} == 9 — baseline is BeerLine.created_at because last_cleaned_at is null"
            - "${cmp1_prov_l} == 37.80 and ${cmp1_prov_c} == 18144"
            - "${cmp2_prov_l} == 10.80 and ${cmp2_prov_c} == 5184"
            - "${count2} == 2"
            - "${cmp1_status} == RESOLVED and ${cmp1_set_l} == 5.00 and ${cmp1_set_c} == 2400"
            - "${count_after_resolve} == 1"
