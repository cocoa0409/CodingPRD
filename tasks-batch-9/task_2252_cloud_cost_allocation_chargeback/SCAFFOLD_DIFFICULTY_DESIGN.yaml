              payload: { cost_record_ids: ["${cr4_id}"] }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
            - call: "POST /finops/shared-cost-pools/${pool_id}/seal"
              payload: {}
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
            - call: "POST /finops/allocation-runs/${run_id}/compute"
              payload: { variant: "FINAL" }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
            - call: "POST /finops/allocation-runs/${run_id}/publish"
              payload: {}
              as: FinOpsController
              as_user_id: "controller-1"
            - call: "GET /finops/chargeback-invoices"
              payload: { allocation_run_id: "${run_id}", business_unit_id: "${bu_a_id}" }
              as: FinOpsController
              as_user_id: "controller-1"
              captures: { inv_a_id: "$.data[0].id" }
            - call: "GET /finops/chargeback-invoices"
              payload: { allocation_run_id: "${run_id}", business_unit_id: "${bu_b_id}" }
              as: FinOpsController
              as_user_id: "controller-1"
              captures: { inv_b_id: "$.data[0].id" }
            - call: "POST /finops/chargeback-invoices/${inv_a_id}/issue"
              payload: {}
              as: FinOpsController
              as_user_id: "controller-1"
            - call: "POST /finops/chargeback-invoices/${inv_b_id}/issue"
              payload: {}
              as: FinOpsController
              as_user_id: "controller-1"
          trigger:
            - call: "POST /finops/allocation-runs/${run_id}/reopen"
              payload: { reason: "Late July storage bill arrived after publication." }
              as: FinOpsController
              as_user_id: "controller-1"
            - call: "POST /finops/allocation-runs/${run_id}/compute"
              payload: { variant: "FINAL" }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
            - call: "POST /finops/allocation-runs/${run_id}/publish"
              payload: {}
              as: FinOpsController
              as_user_id: "controller-1"
          assert:
            - "Before the reopen: total_allocated_cents == scoped_effective_cost_cents == 26967, line_count == 4, BusinessUnit.${bu_a_id}.chargeback_balance_cents == 18645 and BusinessUnit.${bu_b_id}.chargeback_balance_cents == 8322"
            - "Immediately after the reopen: AllocationRun.${run_id}.status == REOPENED, reopen_count == 1, total_allocated_cents == 0, line_count == 0, and GET /finops/allocation-lines?allocation_run_id=${run_id} returns total_count == 0"
            - "After the reopen both invoices are VOIDED with net_due_cents 0, and both BU chargeback_balance_cents are 0"
            - "After the reopen CostRecord.${cr1_id}, ${cr2_id}, ${cr3_id} are UNALLOCATED with allocated_by_run_id null, while effective_cost_cents stays 7322 - the commitment discount is not undone"
            - "After the recompute the invariant is restored exactly: total_allocated_cents == scoped_effective_cost_cents == 26967, line_count == 4, no duplicate SHARED line for the 5001 pool (SharedCostPool.${pool_id}.absorbed_record_count is still 1)"
            - "After the republish, GET /finops/chargeback-invoices?allocation_run_id=${run_id} returns total_count == 4 (two VOIDED, two UNBILLED) and the new Platform BU invoice again carries gross_amount_cents 18645"

      - name: dispute_withdrawal_compensates_filing_without_ledger_drift
        grounds:
          - state_machines.ChargebackInvoice.DISPUTED_to_NONE
          - state_machines.ChargebackInvoice.ISSUED_to_PARTIALLY_CREDITED
          - calculations.invoice_settlement_ledger
          - entities.CostRecord.fields.allocation_state
          - entities.ChargebackInvoice.fields.net_due_cents
        distinguishing_aspect: |
          A second, finer-grained invariant on a different aggregate: the money identity
          gross_amount_cents == credited_amount_cents + paid_amount_cents + net_due_cents must hold at every one of
          five checkpoints, and withdrawal must undo a filing exactly - records return from DISPUTED_HOLD to
          ALLOCATED, credited_amount_cents stays 0, and the BU balance is still 10000. Only then does a real credit
          of 4000 followed by a 6000 settlement walk the identity to 10000 == 4000 + 6000 + 0 with balance 0.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "Ops BU (ACTIVE, chargeback-enabled) with one PROVISIONED COMPUTE resource and one 10000-cent record for 2026-07-01..2026-08-01."
            - "A CHARGEBACK run for that period computed FINAL by analyst-1 and PUBLISHED by controller-1."
            - "The Ops BU invoice is ISSUED at gross 10000, credited 0, paid 0, net_due 10000; the cost record is ALLOCATED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /finops/business-units"
              payload: { name: "Ops BU", cost_center_code: "CC-400", chargeback_enabled: true, headcount: 10 }
              as: PlatformAdmin
              captures: { bu_id: "$.data.id" }
            - call: "POST /finops/tagging-policies"
              payload: { name: "core-tags", mandatory_dimensions: ["team", "environment", "application"], enforcement_mode: "ADVISORY" }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
              captures: { pol_id: "$.data.id" }
            - call: "POST /finops/tagging-policies/${pol_id}/activate"
              payload: {}
              as: FinOpsController
              as_user_id: "controller-1"
            - call: "POST /finops/provisioning-requests"
              payload: { tagging_policy_id: "${pol_id}", business_unit_id: "${bu_id}", resource_kind: "COMPUTE", requested_tags: { team: "ops", environment: "prod", application: "billing" }, monthly_run_rate_cents: 10000, owner_user_id: "owner-4" }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
              captures: { pr_id: "$.data.id" }
            - call: "POST /finops/provisioning-requests/${pr_id}/approve"
              payload: {}
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
            - call: "POST /finops/provisioning-requests/${pr_id}/provision"
              payload: {}
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
            - call: "GET /finops/cloud-resources"
              payload: { provisioning_request_id: "${pr_id}" }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
              captures: { res_id: "$.data[0].id" }
            - call: "POST /finops/cost-records"
              payload: { cloud_resource_id: "${res_id}", billing_period_start: "2026-07-01T00:00:00Z", billing_period_end: "2026-08-01T00:00:00Z", resource_kind: "COMPUTE", list_cost_cents: 10000 }
              as: PlatformAdmin
              captures: { cr_id: "$.data.id" }
            - call: "POST /finops/allocation-runs"
              payload: { mode: "CHARGEBACK", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
              captures: { run_id: "$.data.id" }
            - call: "POST /finops/allocation-runs/${run_id}/compute"
              payload: { variant: "FINAL" }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
            - call: "POST /finops/allocation-runs/${run_id}/publish"
              payload: {}
              as: FinOpsController
              as_user_id: "controller-1"
            - call: "GET /finops/chargeback-invoices"
              payload: { allocation_run_id: "${run_id}", business_unit_id: "${bu_id}" }
              as: FinOpsController
              as_user_id: "controller-1"
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /finops/chargeback-invoices/${inv_id}/issue"
              payload: {}
              as: FinOpsController
              as_user_id: "controller-1"
          trigger:
            - call: "POST /finops/disputes"
              payload: { chargeback_invoice_id: "${inv_id}", reason_code: "TAGGING_ERROR", claimed_credit_cents: 4000, narrative: "Filed, then withdrawn." }
              as: BusinessUnitOwner
              as_user_id: "${bu_id}"
              captures: { dsp1_id: "$.data.id" }
            - call: "POST /finops/disputes/${dsp1_id}/withdraw"
              payload: {}
              as: BusinessUnitOwner
              as_user_id: "${bu_id}"
            - call: "POST /finops/disputes"
              payload: { chargeback_invoice_id: "${inv_id}", reason_code: "TAGGING_ERROR", claimed_credit_cents: 4000, narrative: "Refiled with the tag evidence." }
              as: BusinessUnitOwner
              as_user_id: "${bu_id}"
              captures: { dsp2_id: "$.data.id" }
            - call: "POST /finops/disputes/${dsp2_id}/start-review"
              payload: {}
              as: FinOpsController
              as_user_id: "controller-1"
            - call: "POST /finops/disputes/${dsp2_id}/resolve"
              payload: { outcome: "ADJUSTED", granted_credit_cents: 4000 }
              as: FinOpsController
              as_user_id: "controller-1"
            - call: "POST /finops/chargeback-invoices/${inv_id}/settle"
              payload: { payment_cents: 6000 }
              as: BusinessUnitOwner
              as_user_id: "${bu_id}"
          assert:
            - "Checkpoint 1 (issued): 10000 == 0 + 0 + 10000 and BusinessUnit.${bu_id}.chargeback_balance_cents == 10000"
            - "Checkpoint 2 (filed): the identity is unchanged at 10000 == 0 + 0 + 10000, dispute_status == DISPUTED, CostRecord.${cr_id}.allocation_state == DISPUTED_HOLD"
            - "Checkpoint 3 (withdrawn): Dispute.${dsp1_id}.status == WITHDRAWN, dispute_status back to NONE, CostRecord.${cr_id}.allocation_state back to ALLOCATED, credited_amount_cents still 0, balance still 10000 - no drift from the compensated filing"
            - "Checkpoint 4 (resolved ADJUSTED 4000): 10000 == 4000 + 0 + 6000, settlement_status == PARTIALLY_CREDITED, balance == 6000"
            - "Checkpoint 5 (settled 6000): 10000 == 4000 + 6000 + 0, settlement_status == SETTLED, balance == 0"
            - "A settle of 10000 instead of 6000 at checkpoint 5 returns ERR_OVERPAYMENT (422), proving the ceiling tracks the credit rather than the original gross"

