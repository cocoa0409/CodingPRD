scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: grant_creation_defaults_applied
        claim_type: defaults
        grounds: [entities.Grant.fields.variance_threshold_pct, entities.Grant.fields.final_report_due_days, entities.Grant.fields.status]
        distinguishing_aspect: "Omitting every optional field yields defaults: variance_threshold_pct 10.0, interim 30 / final 90 due days, renewal_window_days 60, required_match_cents 0, indirect_rate_pct 0, status DRAFT, version 1, original_end_date == end_date."
        test_recipe:
          setup: ["Funder exists"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "STATE", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
          trigger:
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-D", title: "T", award_amount_cents: 500, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "ANNUAL" }, as: GrantsOfficer, captures: { th: $.data.variance_threshold_pct, fd: $.data.final_report_due_days, st: $.data.status, v: $.data.version, oe: $.data.original_end_date } }
          assert:
            - "th == 10.0 and fd == 90 (defaults applied); renewal_window_days == 60, required_match_cents == 0, indirect_rate_pct == 0"
            - "st == DRAFT, v == 1, oe date portion == 2027-05-31"

      - name: grant_missing_required_field_returns_400
        claim_type: required_fields
        grounds: [entities.Grant.fields.award_amount_cents, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /grants without award_amount_cents is rejected ERR_VALIDATION (400) — the field has no default."
        test_recipe:
          setup: ["Funder exists"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "STATE", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
          trigger:
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-M", title: "T", start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "ANNUAL" }, as: GrantsOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION (http 400)"

      - name: grant_invalid_enum_returns_400
        claim_type: type_constraints
        grounds: [entities.Grant.fields.reporting_frequency, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "reporting_frequency 'WEEKLY' is not in {MONTHLY, QUARTERLY, SEMIANNUAL, ANNUAL} -> ERR_VALIDATION."
        test_recipe:
          setup: ["Funder exists"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "STATE", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
          trigger:
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-E", title: "T", award_amount_cents: 500, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "WEEKLY" }, as: GrantsOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION (http 400)"

      - name: grant_computed_total_expended_input_ignored
        claim_type: computed_fields
        grounds: [entities.Grant.fields.total_expended_cents]
        distinguishing_aspect: "Client-supplied total_expended_cents: 999 is ignored; the computed field reads 0 on the creation response."
        test_recipe:
          setup: ["Funder exists"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "STATE", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
          trigger:
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-C", title: "T", award_amount_cents: 500, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "ANNUAL", total_expended_cents: 999 }, as: GrantsOfficer, captures: { te: $.data.total_expended_cents } }
          assert:
            - "te == 0 (computed field; client input 999 ignored)"

      - name: grant_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but non-existent grant id returns ERR_NOT_FOUND (404) in the error envelope."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "STATE", contact_email: "f1@x.org" }, as: SystemAdmin }
          trigger:
            - { call: "GET /grants/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: GrantsOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND (http 404)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: report_calendar_initial_state_scheduled
        claim_type: initial_state
        grounds: [state_machines.Report, entities.Report.fields.period_type]
        distinguishing_aspect: "Activation of a QUARTERLY grant 2026-06-01..2027-05-31 creates exactly 4 reports, all SCHEDULED, period_index 1..4, only period_index 4 FINAL, with due dates 2026-09-30 / 2026-12-30 / 2027-03-30 / 2027-08-29."
        test_recipe:
          setup: ["Grant with one line and one fund, not yet activated"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-CAL", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager }
          trigger:
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "GET /grants/${g1}/reports", payload: {}, as: GrantsOfficer, captures: { s1: "$.data[0].status", t1: "$.data[0].period_type", d1: "$.data[0].due_date", t4: "$.data[3].period_type", d4: "$.data[3].due_date" } }
          assert:
            - "4 report rows exist, all status SCHEDULED (s1 == SCHEDULED)"
            - "t1 == INTERIM with d1 date portion 2026-09-30 (period_end 2026-08-31 + 30 days)"
            - "t4 == FINAL with d4 date portion 2027-08-29 (period_end 2027-05-31 + 90 days)"

      - name: accepted_report_return_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Report, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "ACCEPTED is terminal: POST /reports/{id}/return on an ACCEPTED report fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["Grant ACTIVE; R1 ACCEPTED via submit -> start-review -> accept; clock 2026-06-15"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-T1", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "GET /grants/${g1}/reports", payload: {}, as: GrantsOfficer, captures: { r1: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /reports/${r1}/start", payload: {}, as: GrantsOfficer }
            - { call: "PUT /reports/${r1}", payload: { narrative_draft: "N", outcome_entries: [{ metric_name: "m", target_value: 1, actual_value: 1, unit: "u" }] }, as: GrantsOfficer }
            - { call: "POST /reports/${r1}/submit", payload: {}, as: GrantsOfficer }
            - { call: "POST /reports/${r1}/start-review", payload: {}, as: Funder, as_user_id: "${f1}" }
            - { call: "POST /reports/${r1}/accept", payload: {}, as: Funder, as_user_id: "${f1}" }
          trigger:
            - { call: "POST /reports/${r1}/return", payload: { returned_reason: "x" }, as: Funder, as_user_id: "${f1}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (http 409); ACCEPTED is terminal"

      - name: expense_void_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Expense, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /expenses/{id}/void from DRAFT (not POSTED) is rejected ERR_INVALID_STATE; the expense row is unchanged."
        test_recipe:
          setup: ["Grant ACTIVE; expense e1 in DRAFT"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-T2", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /grants/${g1}/expenses", payload: { expense_date: "2026-06-20", vendor: "V", description: "D", amount_cents: 100000 }, as: GrantsOfficer, captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /expenses/${e1}/void", payload: {}, as: FinanceManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE; Expense.status remains DRAFT"

      - name: finding_reopen_cycle
        claim_type: valid_transition
        grounds: [state_machines.AuditFinding.RESPONSE_SUBMITTED_to_OPEN, state_machines.AuditFinding.OPEN_to_RESPONSE_SUBMITTED]
        distinguishing_aspect: "AuditFinding supports the reopen loop: OPEN -> RESPONSE_SUBMITTED -> OPEN -> RESPONSE_SUBMITTED again, each arc via its declared endpoint."
        test_recipe:
          setup: ["Grant ACTIVE; engagement in CONDUCTED; OBSERVATION finding f1 OPEN"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-T3", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /grants/${g1}/audit-engagements", payload: { engagement_type: "DESK_REVIEW", auditor_org: "AudCo", scheduled_start: "2026-07-01T00:00:00Z", scheduled_end: "2026-07-10T00:00:00Z" }, as: ProgramDirector, captures: { eng: $.data.id } }
            - { call: "POST /audit-engagements/${eng}/advance", payload: {}, as: Auditor }
            - { call: "POST /audit-engagements/${eng}/advance", payload: {}, as: Auditor }
            - { call: "POST /audit-engagements/${eng}/advance", payload: {}, as: Auditor }
            - { call: "POST /audit-engagements/${eng}/findings", payload: { severity: "OBSERVATION", description: "obs" }, as: Auditor, captures: { f1: $.data.id } }
            - { call: "POST /audit-findings/${f1}/respond", payload: { response_text: "r1" }, as: GrantsOfficer }
          trigger:
            - { call: "POST /audit-findings/${f1}/reopen", payload: {}, as: Auditor, captures: { s1: $.data.status } }
            - { call: "POST /audit-findings/${f1}/respond", payload: { response_text: "r2" }, as: GrantsOfficer, captures: { s2: $.data.status, rt: $.data.response_text } }
          assert:
            - "s1 == OPEN (reopen arc)"
            - "s2 == RESPONSE_SUBMITTED with rt == 'r2' (loop closed and re-walked)"

      - name: modification_withdraw_then_approve_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ModificationRequest.SUBMITTED_to_WITHDRAWN, "errors[ERR_MODIFICATION_NOT_PENDING]"]
        distinguishing_aspect: "A WITHDRAWN request is terminal for decisions: approve after withdraw fails ERR_MODIFICATION_NOT_PENDING (409)."
        test_recipe:
          setup: ["Grant ACTIVE; NO_COST_EXTENSION mr submitted then withdrawn; gv = grant.version"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-T4", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "GET /grants/${g1}", payload: {}, as: GrantsOfficer, captures: { gv: $.data.version } }
            - { call: "POST /grants/${g1}/modification-requests", payload: { request_type: "NO_COST_EXTENSION", justification: "j", requested_end_date: "2027-08-31" }, as: GrantsOfficer, captures: { mr: $.data.id } }
            - { call: "POST /modification-requests/${mr}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /modification-requests/${mr}/withdraw", payload: {}, as: GrantsOfficer }
          trigger:
            - { call: "POST /modification-requests/${mr}/approve", payload: { expected_grant_version: "${gv}" }, as: Funder, as_user_id: "${f1}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_MODIFICATION_NOT_PENDING (http 409)"

      - name: engagement_close_blocked_by_open_finding
        claim_type: precondition_enforcement
        grounds: [state_machines.AuditEngagement.FINDINGS_ISSUED_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "advance from FINDINGS_ISSUED to CLOSED requires all findings RESOLVED; one OPEN finding blocks it with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Grant ACTIVE; engagement advanced 4x to FINDINGS_ISSUED; one OBSERVATION finding still OPEN"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-T5", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /grants/${g1}/audit-engagements", payload: { engagement_type: "FINANCIAL_AUDIT", auditor_org: "AudCo", scheduled_start: "2026-07-01T00:00:00Z", scheduled_end: "2026-07-10T00:00:00Z" }, as: ProgramDirector, captures: { eng: $.data.id } }
            - { call: "POST /audit-engagements/${eng}/advance", payload: {}, as: Auditor }
            - { call: "POST /audit-engagements/${eng}/advance", payload: {}, as: Auditor }
            - { call: "POST /audit-engagements/${eng}/advance", payload: {}, as: Auditor }
            - { call: "POST /audit-engagements/${eng}/advance", payload: {}, as: Auditor }
            - { call: "POST /audit-engagements/${eng}/findings", payload: { severity: "OBSERVATION", description: "obs" }, as: Auditor }
          trigger:
            - { call: "POST /audit-engagements/${eng}/advance", payload: {}, as: Auditor, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE; engagement remains FINDINGS_ISSUED while a finding is OPEN"

      - name: grant_closeout_from_active_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Grant.CLOSEOUT_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /grants/{id}/closeout from ACTIVE (not CLOSEOUT) fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["Grant ACTIVE"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-T6", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
          trigger:
            - { call: "POST /grants/${g1}/closeout", payload: {}, as: ProgramDirector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: final_report_accept_moves_grant_to_closeout
        claim_type: side_effect_execution
        grounds: [state_machines.Grant.ACTIVE_to_CLOSEOUT, state_machines.Report.UNDER_REVIEW_to_ACCEPTED]
        distinguishing_aspect: "Bubble-up: accepting the FINAL report (period_index 4) automatically moves the grant ACTIVE -> CLOSEOUT."
        test_recipe:
          setup: ["Grant ACTIVE (QUARTERLY, required_match_cents 0); clock 2027-03-15; R4 (FINAL) DRAFT with narrative+outcome"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-T7", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "GET /grants/${g1}/reports", payload: {}, as: GrantsOfficer, captures: { r4: "$.data[3].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-03-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /reports/${r4}/start", payload: {}, as: GrantsOfficer }
            - { call: "PUT /reports/${r4}", payload: { narrative_draft: "N", outcome_entries: [{ metric_name: "m", target_value: 1, actual_value: 1, unit: "u" }] }, as: GrantsOfficer }
            - { call: "POST /reports/${r4}/submit", payload: {}, as: GrantsOfficer }
            - { call: "POST /reports/${r4}/start-review", payload: {}, as: Funder, as_user_id: "${f1}" }
          trigger:
            - { call: "POST /reports/${r4}/accept", payload: {}, as: Funder, as_user_id: "${f1}" }
            - { call: "GET /grants/${g1}", payload: {}, as: GrantsOfficer, captures: { gst: $.data.status } }
          assert:
            - "gst == CLOSEOUT (auto bubble-up from FINAL report acceptance)"

      - name: report_start_before_period_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Report.SCHEDULED_to_DRAFT, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "start is rejected while the logical clock (default 2026-05-01T00:00:00Z) precedes period_start 2026-06-01."
        test_recipe:
          setup: ["Grant ACTIVE; clock left at the server default 2026-05-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-T8", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "GET /grants/${g1}/reports", payload: {}, as: GrantsOfficer, captures: { r1: "$.data[0].id" } }
          trigger:
            - { call: "POST /reports/${r1}/start", payload: {}, as: GrantsOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE; report remains SCHEDULED"

      - name: late_report_submit_flagged
        claim_type: side_effect_execution
        grounds: [entities.Report.fields.submitted_late, state_machines.Report.DRAFT_to_SUBMITTED]
        distinguishing_aspect: "Submitting on 2026-10-05 against due_date 2026-09-30 succeeds but stamps submitted_late == true (late submission is flagged, not rejected)."
        test_recipe:
          setup: ["Grant ACTIVE; clock 2026-10-05; R1 DRAFT with narrative+outcome"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-T9", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "GET /grants/${g1}/reports", payload: {}, as: GrantsOfficer, captures: { r1: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /reports/${r1}/start", payload: {}, as: GrantsOfficer }
            - { call: "PUT /reports/${r1}", payload: { narrative_draft: "N", outcome_entries: [{ metric_name: "m", target_value: 1, actual_value: 1, unit: "u" }] }, as: GrantsOfficer }
          trigger:
            - { call: "POST /reports/${r1}/submit", payload: {}, as: GrantsOfficer, captures: { st: $.data.status, late: $.data.submitted_late } }
          assert:
            - "st == SUBMITTED and late == true (due_date 2026-09-30 end-of-day < submitted_at 2026-10-05)"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: indirect_de_minimis_federal_branch
        claim_type: constants_applied
        grounds: [calculations.indirect_cost_pool, entities.Funder.fields.funder_type]
        distinguishing_aspect: "With a FEDERAL funder and grant indirect_rate_pct == 0 the de minimis branch applies DE_MINIMIS_INDIRECT_PCT 10: direct_base 26000000 -> pool 2600000 (no cap set)."
        test_recipe:
          setup:
            - "FEDERAL-funded grant ACTIVE (indirect_rate_pct 0, no cap); 26000000 allocated to a PERSONNEL line"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "FED", funder_type: "FEDERAL", contact_email: "fed@x.gov" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-F1", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer, captures: { l1: $.data.id } }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager, captures: { fu1: $.data.id } }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /grants/${g1}/expenses", payload: { expense_date: "2026-06-20", vendor: "V", description: "D", amount_cents: 26000000 }, as: GrantsOfficer, as_user_id: "officer-1", captures: { e1: $.data.id } }
            - { call: "POST /expenses/${e1}/post", payload: {}, as: FinanceManager, as_user_id: "fin-1" }
            - { call: "POST /expenses/${e1}/allocations", payload: { budget_line_id: "${l1}", fund_id: "${fu1}", amount_cents: 26000000 }, as: GrantsOfficer }
          trigger:
            - { call: "GET /grants/${g1}/summary", payload: {}, as: GrantsOfficer, captures: { pool: $.data.indirect_pool_cents } }
          assert:
            - "pool == 2600000 (floor(26000000 x 10 / 100)) — de minimis 10% branch taken because rate == 0 and funder is FEDERAL"

      - name: match_standard_rate_valuation
        claim_type: correct_result
        grounds: [calculations.match_commitment_progress, entities.MatchContribution.fields.recognized_value_cents]
        distinguishing_aspect: "A VOLUNTEER_TIME contribution of 200 hours is recognized at 200 x STANDARD_VOLUNTEER_RATE_CENTS(3150) == 630000 regardless of documented_value_cents."
        test_recipe:
          setup: ["Grant ACTIVE; clock 2026-06-15"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-C2", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
          trigger:
            - { call: "POST /grants/${g1}/match-contributions", payload: { contribution_type: "VOLUNTEER_TIME", source_name: "Vol", valuation_basis: "STANDARD_RATE", volunteer_hours: 200, documented_value_cents: 999999 }, as: GrantsOfficer, captures: { rec: $.data.recognized_value_cents, st: $.data.status } }
          assert:
            - "rec == 630000 (standard-rate valuation wins over documented 999999 for VOLUNTEER_TIME)"
            - "st == PLEDGED (initial state)"

      - name: burn_rate_variant_divergence
        claim_type: variant_divergence
        grounds: [calculations.burn_rate_projection]
        distinguishing_aspect: "After two accepted periods with actuals 10000000 then 14000000, the trailing variant (window 1) projects 56000000 while the cumulative variant projects 48000000 from the same ledger."
        test_recipe:
          setup:
            - "Grant ACTIVE (threshold 25.0, award 100000000, line l1 50000000, fund 100000000); P1 actual 10000000 accepted; P2 actual 14000000 accepted; clock now 2026-12-15 (P3 open)"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-C3", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY", variance_threshold_pct: 25.0 }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 50000000 }, as: GrantsOfficer, captures: { l1: $.data.id } }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager, captures: { fu1: $.data.id } }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "GET /grants/${g1}/reports", payload: {}, as: GrantsOfficer, captures: { r1: "$.data[0].id", r2: "$.data[1].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /reports/${r1}/start", payload: {}, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/expenses", payload: { expense_date: "2026-06-20", vendor: "V1", description: "D1", amount_cents: 10000000 }, as: GrantsOfficer, as_user_id: "officer-1", captures: { e1: $.data.id } }
            - { call: "POST /expenses/${e1}/post", payload: {}, as: FinanceManager, as_user_id: "fin-1" }
            - { call: "POST /expenses/${e1}/allocations", payload: { budget_line_id: "${l1}", fund_id: "${fu1}", amount_cents: 10000000 }, as: GrantsOfficer }
            - { call: "PUT /reports/${r1}", payload: { narrative_draft: "N1", outcome_entries: [{ metric_name: "m", target_value: 1, actual_value: 1, unit: "u" }] }, as: GrantsOfficer }
            - { call: "POST /reports/${r1}/submit", payload: {}, as: GrantsOfficer }
            - { call: "POST /reports/${r1}/start-review", payload: {}, as: Funder, as_user_id: "${f1}" }
            - { call: "POST /reports/${r1}/accept", payload: {}, as: Funder, as_user_id: "${f1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /reports/${r2}/start", payload: {}, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/expenses", payload: { expense_date: "2026-09-10", vendor: "V2", description: "D2", amount_cents: 14000000 }, as: GrantsOfficer, as_user_id: "officer-1", captures: { e2: $.data.id } }
            - { call: "POST /expenses/${e2}/post", payload: {}, as: FinanceManager, as_user_id: "fin-1" }
            - { call: "POST /expenses/${e2}/allocations", payload: { budget_line_id: "${l1}", fund_id: "${fu1}", amount_cents: 14000000 }, as: GrantsOfficer }
            - { call: "PUT /reports/${r2}", payload: { narrative_draft: "N2", outcome_entries: [{ metric_name: "m", target_value: 1, actual_value: 1, unit: "u" }] }, as: GrantsOfficer }
            - { call: "POST /reports/${r2}/submit", payload: {}, as: GrantsOfficer }
            - { call: "POST /reports/${r2}/start-review", payload: {}, as: Funder, as_user_id: "${f1}" }
            - { call: "POST /reports/${r2}/accept", payload: {}, as: Funder, as_user_id: "${f1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-15T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "GET /grants/${g1}/summary", payload: {}, as: GrantsOfficer, captures: { bt: $.data.burn_trailing_cents, bc: $.data.burn_cumulative_cents, pr: $.data.pacing_ratio, te: $.data.total_expended_cents } }
          assert:
            - "bt == 56000000 (trailing window 1: 14000000 x 4 periods)"
            - "bc == 48000000 (cumulative: 24000000 / 2 elapsed x 4)"
            - "te == 24000000 and pr == 0.48 (24000000 / (100000000 x 2/4))"

      - name: calc_variance_variants_covered
        claim_type: variant_divergence
        grounds: [calculations.budget_variance_report]
        excluded_because:
          difficulty_instance: variance_period_only_vs_cumulative_gate
          rationale: "Both variants' literals (12.00 period vs 4.00 cumulative) are asserted in the named difficulty instance."

      - name: calc_match_variants_covered
        claim_type: variant_divergence
        grounds: [calculations.match_commitment_progress]
        excluded_because:
          difficulty_instance: match_progress_verified_vs_pledged
          rationale: "Both inclusion-set totals (5000000 vs 15630000) asserted in the named difficulty instance."

      - name: calc_proration_covered
        claim_type: precision
        grounds: [calculations.period_budget_proration]
        excluded_because:
          difficulty_instance: period_proration_remainder_to_final
          rationale: "Pinned rounding order and residual placement asserted in the named difficulty instance."

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers is rejected ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "STATE", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
          trigger:
            - { call: "GET /grants", payload: {}, as: "", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHENTICATED (http 401)"

      - name: duplicate_award_number_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_DUPLICATE_AWARD_NUMBER]"]
        distinguishing_aspect: "Second grant with the same award_number under the same funder fails ERR_DUPLICATE_AWARD_NUMBER; the same award_number under a different funder succeeds."
        test_recipe:
          setup: ["Funders f1 and f2; grant AW-DUP already exists under f1"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "STATE", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /funders", payload: { name: "F2", funder_type: "FOUNDATION", contact_email: "f2@x.org" }, as: SystemAdmin, captures: { f2: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-DUP", title: "T", award_amount_cents: 500, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "ANNUAL" }, as: GrantsOfficer }
          trigger:
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-DUP", title: "T2", award_amount_cents: 600, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "ANNUAL" }, as: GrantsOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /grants", payload: { funder_id: "${f2}", award_number: "AW-DUP", title: "T3", award_amount_cents: 700, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "ANNUAL" }, as: GrantsOfficer, captures: { ok: $.data.id } }
          assert:
            - "same funder duplicate: err == ERR_DUPLICATE_AWARD_NUMBER (409)"
            - "different funder same number: ok is a minted id (201) — uniqueness is scoped per funder"

      - name: modification_approve_stale_version_rejected
        claim_type: violation_to_error
        grounds: ["concurrency_rules[modification-approve-stale-grant]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After one approval bumps grant.version, a second approve carrying the previously observed version is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup:
            - "Grant ACTIVE; two SUBMITTED NO_COST_EXTENSION requests mr1 (-> 2027-08-31) and mr2 (-> 2027-11-30); gv = grant.version observed before either approval"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-V1", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "GET /grants/${g1}", payload: {}, as: GrantsOfficer, captures: { gv: $.data.version } }
            - { call: "POST /grants/${g1}/modification-requests", payload: { request_type: "NO_COST_EXTENSION", justification: "j1", requested_end_date: "2027-08-31" }, as: GrantsOfficer, captures: { mr1: $.data.id } }
            - { call: "POST /modification-requests/${mr1}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /grants/${g1}/modification-requests", payload: { request_type: "NO_COST_EXTENSION", justification: "j2", requested_end_date: "2027-11-30" }, as: GrantsOfficer, captures: { mr2: $.data.id } }
            - { call: "POST /modification-requests/${mr2}/submit", payload: {}, as: ProgramDirector }
          trigger:
            - { call: "POST /modification-requests/${mr1}/approve", payload: { expected_grant_version: "${gv}" }, as: Funder, as_user_id: "${f1}", captures: { s1: $.data.status } }
            - { call: "POST /modification-requests/${mr2}/approve", payload: { expected_grant_version: "${gv}" }, as: Funder, as_user_id: "${f1}", captures: { err: $.data.error_id } }
          assert:
            - "s1 == APPROVED (correct version succeeds and bumps grant.version)"
            - "err == ERR_STALE_VERSION (412) — the second approval's observed version is now stale"

      - name: expense_overallocated_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_EXPENSE_OVERALLOCATED]"]
        distinguishing_aspect: "Expense 100000 with 60000 already allocated rejects a further 50000 allocation (40000 unallocated) with ERR_EXPENSE_OVERALLOCATED."
        test_recipe:
          setup: ["Grant ACTIVE; POSTED expense 100000 with 60000 already allocated to l1/fu1"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-V2", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer, captures: { l1: $.data.id } }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager, captures: { fu1: $.data.id } }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /grants/${g1}/expenses", payload: { expense_date: "2026-06-20", vendor: "V", description: "D", amount_cents: 100000 }, as: GrantsOfficer, as_user_id: "officer-1", captures: { e1: $.data.id } }
            - { call: "POST /expenses/${e1}/post", payload: {}, as: FinanceManager, as_user_id: "fin-1" }
            - { call: "POST /expenses/${e1}/allocations", payload: { budget_line_id: "${l1}", fund_id: "${fu1}", amount_cents: 60000 }, as: GrantsOfficer }
          trigger:
            - { call: "POST /expenses/${e1}/allocations", payload: { budget_line_id: "${l1}", fund_id: "${fu1}", amount_cents: 50000 }, as: GrantsOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_EXPENSE_OVERALLOCATED (422); unallocated_cents stays 40000"

      - name: reallocation_below_expended_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_REALLOCATION_BELOW_EXPENDED]"]
        distinguishing_aspect: "A reallocation taking l1 from 50000000 to 10000000 while 13000000 is already expended fails at submit with ERR_REALLOCATION_BELOW_EXPENDED."
        test_recipe:
          setup: ["Grant ACTIVE; l1 PERSONNEL 50000000 with 13000000 expended; l2 TRAVEL 20000000; reallocation draft: l1 -40000000, l2 +40000000 (sum 0)"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-V3", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 50000000 }, as: GrantsOfficer, captures: { l1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "TRAVEL", budgeted_cents: 20000000 }, as: GrantsOfficer, captures: { l2: $.data.id } }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager, captures: { fu1: $.data.id } }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /grants/${g1}/expenses", payload: { expense_date: "2026-06-20", vendor: "V", description: "D", amount_cents: 13000000 }, as: GrantsOfficer, as_user_id: "officer-1", captures: { e1: $.data.id } }
            - { call: "POST /expenses/${e1}/post", payload: {}, as: FinanceManager, as_user_id: "fin-1" }
            - { call: "POST /expenses/${e1}/allocations", payload: { budget_line_id: "${l1}", fund_id: "${fu1}", amount_cents: 13000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/modification-requests", payload: { request_type: "BUDGET_REALLOCATION", justification: "j", line_deltas: [{ budget_line_id: "${l1}", delta_cents: -40000000 }, { budget_line_id: "${l2}", delta_cents: 40000000 }] }, as: GrantsOfficer, captures: { mr: $.data.id } }
          trigger:
            - { call: "POST /modification-requests/${mr}/submit", payload: {}, as: ProgramDirector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_REALLOCATION_BELOW_EXPENDED (422): 50000000 - 40000000 = 10000000 < 13000000 expended"

      - name: extension_not_forward_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_EXTENSION_NOT_FORWARD]"]
        distinguishing_aspect: "A NO_COST_EXTENSION whose requested_end_date equals the current end_date (2027-05-31) is rejected at submit with ERR_EXTENSION_NOT_FORWARD — the comparison is strict."
        test_recipe:
          setup: ["Grant ACTIVE with end_date 2027-05-31; NCE draft requesting 2027-05-31"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-V4", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /grants/${g1}/modification-requests", payload: { request_type: "NO_COST_EXTENSION", justification: "j", requested_end_date: "2027-05-31" }, as: GrantsOfficer, captures: { mr: $.data.id } }
          trigger:
            - { call: "POST /modification-requests/${mr}/submit", payload: {}, as: ProgramDirector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_EXTENSION_NOT_FORWARD (422)"

      - name: renewal_lapsed_after_window_close
        claim_type: violation_to_error
        grounds: [state_machines.RenewalApplication.ELIGIBLE_to_LAPSED, "errors[ERR_RENEWAL_WINDOW_LAPSED]"]
        distinguishing_aspect: "Advancing the clock past window_close (2027-05-31T23:59:59Z) without submitting flips the application ELIGIBLE -> LAPSED; a later submit fails ERR_RENEWAL_WINDOW_LAPSED."
        test_recipe:
          setup: ["Grant ACTIVE end_date 2027-05-31 (window 2027-04-01..2027-05-31); renewal application created while window open but never submitted; clock then moved to 2027-06-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-V5", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager }
