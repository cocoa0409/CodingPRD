               [2026-09-01T00:00:00Z, 2026-09-03T00:00:00Z], so it occupies that window plus a
               259200-second trailing cooldown on FOUNDATION."
            - "Logical clock rests at 2026-08-01T00:00:00Z, far inside both warranty windows
