# =============================================================================
# Task 1220: Paint & Coatings Manufacturing — §1.9 Scaffold Corner Design
# Breadth probe: every testable claim of §1.1–§1.7 not already covered by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Chains drive empty-DB -> precondition state
# using only §1.5 endpoints. Canonical fixtures match the difficulty file.
# =============================================================================

scaffold_corner_design:
  # ==================================================================
  - section: entities
    instances:
      - name: customer_create_defaults_and_computed_zeroes
        claim_type: creation
        grounds: [entities.Customer]
        distinguishing_aspect: "Creating a customer with valid input returns 201; computed ledger fields start at 0 and version starts at 1."
        test_recipe:
          setup: ["empty DB; clock at default"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "POST /coatings/customers", payload: { name: "Sunbelt Paints AZ", home_state_code: "AZ", annual_credit_cap_cents: 50000 }, as: PlantManager, captures: { cu1: $.data.id } }
          assert:
            - "HTTP 201; Customer.${cu1}.credit_balance_cents == 0 and credit_used_ytd_cents == 0"
            - "Customer.${cu1}.version == 1 and id is a server-minted UUID"
            - "Customer.${cu1}.created_at == 2026-05-01T00:00:00Z (logical clock, never wall clock)"

      - name: formula_create_computed_min_batch_and_version
        claim_type: computed_fields
        grounds: [entities.Formula, entities.FormulaLine]
        distinguishing_aspect: "is_custom drives computed min_batch_gallons (50 vs 1); formula_version_no starts at 1; the lines array materializes FormulaLine rows reachable via the lines listing."
        test_recipe:
          setup: ["TB2 and C2 exist"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /coatings/tint-bases"
              payload: { base_code: "B-200C", product_category: "FLAT", base_family: "LATEX_INTERIOR", base_voc_gpl: 30, water_fraction_pct: 50, density_kg_per_gal: 4.4, base_cost_per_gal_cents: 1800, unit_price_per_gal_cents: 4100, shelf_life_months: 24, grind_spec_um: 20 }
              as: LabTechnician
              captures: { tb2: $.data.id }
            - call: "POST /coatings/colorants"
              payload: { colorant_code: "BLK-H", voc_g_per_unit: 12, cost_per_shot_cents: 45, is_hazmat: true }
              as: LabTechnician
              captures: { c2: $.data.id }
          trigger:
            - { call: "POST /coatings/formulas", payload: { formula_code: "CLR-C100", color_name: "Custom Ember", tint_base_id: "${tb2}", is_custom: true, target_delta_e: 0.5, lines: [ { colorant_id: "${c2}", shots_per_gallon: 6, sequence: 1 } ] }, as: LabTechnician, captures: { f2: $.data.id } }
            - { call: "POST /coatings/formulas", payload: { formula_code: "CLR-S10", color_name: "Stock Ash", tint_base_id: "${tb2}", is_custom: false, target_delta_e: 0.8, lines: [ { colorant_id: "${c2}", shots_per_gallon: 2, sequence: 1 } ] }, as: LabTechnician, captures: { f3: $.data.id } }
            - { call: "GET /coatings/formulas/${f2}/lines", payload: {}, as: LabTechnician }
          assert:
            - "Formula.${f2}.min_batch_gallons == 50 (custom) and Formula.${f3}.min_batch_gallons == 1 (stock)"
            - "Both formulas: status == DRAFT, formula_version_no == 1, predecessor_formula_id is null"
            - "GET lines of ${f2} returns exactly 1 FormulaLine with shots_per_gallon == 6 and formula_id == ${f2}"

      - name: get_missing_batch_returns_not_found
        claim_type: not_found
        grounds: [entities.Batch, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent batch id returns 404 ERR_NOT_FOUND with the standard error envelope (data.error_id + data.message)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "GET /coatings/batches/11111111-2222-3333-4444-555555555555", payload: {}, as: PlantManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND and HTTP 404"
            - "error envelope carries data.error_id and data.message; response_type == error"

      - name: tint_base_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.TintBase, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field base_voc_gpl is rejected with 400 ERR_INVALID_REQUEST; no TintBase row is persisted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "POST /coatings/tint-bases", payload: { base_code: "B-100", product_category: "NONFLAT", base_family: "LATEX_EXTERIOR", water_fraction_pct: 40, density_kg_per_gal: 4.6, base_cost_per_gal_cents: 1500, unit_price_per_gal_cents: 3200, shelf_life_months: 24, grind_spec_um: 25 }, as: LabTechnician, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST and HTTP 400"

      - name: tint_base_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.TintBase.fields.product_category]
        distinguishing_aspect: "product_category 'GLOSSY' is outside the declared enum and is rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "POST /coatings/tint-bases", payload: { base_code: "B-100", product_category: "GLOSSY", base_family: "LATEX_EXTERIOR", base_voc_gpl: 80, water_fraction_pct: 40, density_kg_per_gal: 4.6, base_cost_per_gal_cents: 1500, unit_price_per_gal_cents: 3200, shelf_life_months: 24, grind_spec_um: 25 }, as: LabTechnician, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST (enum closure on product_category)"

      - name: customer_create_system_field_input_ignored
        claim_type: system_fields
        grounds: [entities.Customer]
        distinguishing_aspect: "Client-supplied id and computed credit_balance_cents in the create payload are ignored: the server mints its own UUID id and keeps the computed balance at 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "POST /coatings/customers", payload: { name: "Sunbelt Paints AZ", home_state_code: "AZ", annual_credit_cap_cents: 50000, id: "99999999-9999-9999-9999-999999999999", credit_balance_cents: 777 }, as: PlantManager, captures: { cu1: $.data.id } }
          assert:
            - "Customer.${cu1}.id != 99999999-9999-9999-9999-999999999999 (server minted)"
            - "Customer.${cu1}.credit_balance_cents == 0 (client-supplied computed field ignored)"

  # ==================================================================
  - section: state_machines
    instances:
      - name: fill_before_qc_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Batch.QC_APPROVED_to_FILLING, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Recording a fill while the batch is MILLING is rejected with ERR_INVALID_STATE; no container is created and the batch state is unchanged."
        test_recipe:
          setup: ["F1 ACTIVE; M1; batch B1 started (MILLING)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /coatings/tint-bases"
              payload: { base_code: "B-100", product_category: "NONFLAT", base_family: "LATEX_EXTERIOR", base_voc_gpl: 80, water_fraction_pct: 40, density_kg_per_gal: 4.6, base_cost_per_gal_cents: 1500, unit_price_per_gal_cents: 3200, shelf_life_months: 24, grind_spec_um: 25 }
              as: LabTechnician
              captures: { tb1: $.data.id }
            - call: "POST /coatings/colorants"
              payload: { colorant_code: "MAG-7", voc_g_per_unit: 5, cost_per_shot_cents: 30, is_hazmat: false }
              as: LabTechnician
              captures: { c1: $.data.id }
            - call: "POST /coatings/formulas"
              payload: { formula_code: "CLR-8841", color_name: "Desert Dusk", tint_base_id: "${tb1}", is_custom: false, target_delta_e: 0.8, lines: [ { colorant_id: "${c1}", shots_per_gallon: 4, sequence: 1 } ] }
              as: LabTechnician
              captures: { f1: $.data.id }
            - { call: "POST /coatings/formulas/${f1}/activate", payload: {}, as: LabTechnician }
            - call: "POST /coatings/mills"
              payload: { mill_code: "M-1", capacity_gallons: 200 }
              as: PlantManager
              captures: { m1: $.data.id }
            - call: "POST /coatings/batches"
              payload: { formula_id: "${f1}", mill_id: "${m1}", planned_gallons: 3, mill_window_start: "2026-06-10T08:00:00Z", mill_window_end: "2026-06-10T12:00:00Z" }
              as: ProductionOperator
              captures: { b1: $.data.id }
            - { call: "POST /coatings/batches/${b1}/start-mill", payload: {}, as: ProductionOperator }
          trigger:
            - { call: "POST /coatings/batches/${b1}/fills", payload: { size_code: "GALLON", actual_fill_g: 4600 }, as: ProductionOperator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE and Batch.${b1}.status == MILLING"
            - "GET /coatings/containers?batch_id=${b1} returns an empty list"

      - name: tint_shot_during_milling_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Batch, entities.BatchAdjustment.fields.kind]
        distinguishing_aspect: "Adjustment kinds are phase-gated: TINT_SHOT is only legal in TINTING; in MILLING it is rejected while THINNER in MILLING succeeds."
        test_recipe:
          setup: ["F1 ACTIVE; M1; batch B1 in MILLING"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /coatings/tint-bases"
              payload: { base_code: "B-100", product_category: "NONFLAT", base_family: "LATEX_EXTERIOR", base_voc_gpl: 80, water_fraction_pct: 40, density_kg_per_gal: 4.6, base_cost_per_gal_cents: 1500, unit_price_per_gal_cents: 3200, shelf_life_months: 24, grind_spec_um: 25 }
              as: LabTechnician
              captures: { tb1: $.data.id }
            - call: "POST /coatings/colorants"
              payload: { colorant_code: "MAG-7", voc_g_per_unit: 5, cost_per_shot_cents: 30, is_hazmat: false }
              as: LabTechnician
              captures: { c1: $.data.id }
            - call: "POST /coatings/formulas"
              payload: { formula_code: "CLR-8841", color_name: "Desert Dusk", tint_base_id: "${tb1}", is_custom: false, target_delta_e: 0.8, lines: [ { colorant_id: "${c1}", shots_per_gallon: 4, sequence: 1 } ] }
              as: LabTechnician
              captures: { f1: $.data.id }
            - { call: "POST /coatings/formulas/${f1}/activate", payload: {}, as: LabTechnician }
            - call: "POST /coatings/mills"
              payload: { mill_code: "M-1", capacity_gallons: 200 }
              as: PlantManager
              captures: { m1: $.data.id }
            - call: "POST /coatings/batches"
              payload: { formula_id: "${f1}", mill_id: "${m1}", planned_gallons: 3, mill_window_start: "2026-06-10T08:00:00Z", mill_window_end: "2026-06-10T12:00:00Z" }
              as: ProductionOperator
              captures: { b1: $.data.id }
            - { call: "POST /coatings/batches/${b1}/start-mill", payload: {}, as: ProductionOperator }
          trigger:
            - { call: "POST /coatings/batches/${b1}/adjustments", payload: { kind: "TINT_SHOT", quantity: 5, colorant_id: "${c1}" }, as: ProductionOperator, captures: { err: $.data.error_id } }
            - { call: "POST /coatings/batches/${b1}/adjustments", payload: { kind: "THINNER", quantity: 500 }, as: ProductionOperator, captures: { adj: $.data.id } }
          assert:
            - "err == ERR_INVALID_STATE (TINT_SHOT in MILLING)"
            - "BatchAdjustment.${adj}.voc_contribution_g == 450 (500 mL * 0.9 g/mL) and cycle_index == 0"

      - name: colormatch_double_approve_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: [state_machines.ColorMatch]
        distinguishing_aspect: "APPROVED is terminal: a second approve on the same match is rejected with ERR_INVALID_STATE and no second retain sample is minted."
        test_recipe:
          setup: ["F1 ACTIVE; M1; 3-gal batch in QC_PENDING with PENDING match CM1 (dE 0.42)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /coatings/tint-bases"
              payload: { base_code: "B-100", product_category: "NONFLAT", base_family: "LATEX_EXTERIOR", base_voc_gpl: 80, water_fraction_pct: 40, density_kg_per_gal: 4.6, base_cost_per_gal_cents: 1500, unit_price_per_gal_cents: 3200, shelf_life_months: 24, grind_spec_um: 25 }
              as: LabTechnician
              captures: { tb1: $.data.id }
            - call: "POST /coatings/colorants"
              payload: { colorant_code: "MAG-7", voc_g_per_unit: 5, cost_per_shot_cents: 30, is_hazmat: false }
              as: LabTechnician
              captures: { c1: $.data.id }
            - call: "POST /coatings/formulas"
              payload: { formula_code: "CLR-8841", color_name: "Desert Dusk", tint_base_id: "${tb1}", is_custom: false, target_delta_e: 0.8, lines: [ { colorant_id: "${c1}", shots_per_gallon: 4, sequence: 1 } ] }
              as: LabTechnician
              captures: { f1: $.data.id }
            - { call: "POST /coatings/formulas/${f1}/activate", payload: {}, as: LabTechnician }
            - call: "POST /coatings/mills"
              payload: { mill_code: "M-1", capacity_gallons: 200 }
              as: PlantManager
              captures: { m1: $.data.id }
            - call: "POST /coatings/batches"
              payload: { formula_id: "${f1}", mill_id: "${m1}", planned_gallons: 3, mill_window_start: "2026-06-10T08:00:00Z", mill_window_end: "2026-06-10T12:00:00Z" }
              as: ProductionOperator
              captures: { b1: $.data.id }
            - { call: "POST /coatings/batches/${b1}/start-mill", payload: {}, as: ProductionOperator }
            - { call: "POST /coatings/batches/${b1}/dispersion-check", payload: { grind_reading: 18 }, as: ProductionOperator }
            - { call: "POST /coatings/batches/${b1}/submit-qc", payload: { actual_gallons: 3 }, as: ProductionOperator }
            - call: "POST /coatings/color-matches"
              payload: { batch_id: "${b1}", measured_delta_e: 0.42 }
              as: LabTechnician
              as_user_id: "lab-1"
              captures: { cm1: $.data.id }
          trigger:
            - { call: "POST /coatings/color-matches/${cm1}/approve", payload: {}, as: QCInspector, as_user_id: "qc-1" }
            - { call: "POST /coatings/color-matches/${cm1}/approve", payload: {}, as: QCInspector, as_user_id: "qc-2", captures: { err: $.data.error_id } }
          assert:
            - "First approve: ColorMatch.${cm1}.status == APPROVED with retain_sample_id set and Batch.${b1}.status == QC_APPROVED"
            - "err == ERR_INVALID_STATE (terminal lockdown; even a different inspector cannot re-approve)"
            - "ColorMatch.${cm1}.decided_by_user_id == qc-1 (unchanged by the failed second approve)"

      - name: order_cancel_in_production_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.SalesOrder.IN_PRODUCTION_to_CANCELLED]
        distinguishing_aspect: "An order whose batch has started milling is IN_PRODUCTION and cannot be cancelled — the forbidden transition is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["F1 ACTIVE; M1; CU1; O1 SCHEDULED via B1; B1 started milling so O1 is IN_PRODUCTION"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /coatings/tint-bases"
              payload: { base_code: "B-100", product_category: "NONFLAT", base_family: "LATEX_EXTERIOR", base_voc_gpl: 80, water_fraction_pct: 40, density_kg_per_gal: 4.6, base_cost_per_gal_cents: 1500, unit_price_per_gal_cents: 3200, shelf_life_months: 24, grind_spec_um: 25 }
              as: LabTechnician
              captures: { tb1: $.data.id }
            - call: "POST /coatings/colorants"
              payload: { colorant_code: "MAG-7", voc_g_per_unit: 5, cost_per_shot_cents: 30, is_hazmat: false }
              as: LabTechnician
              captures: { c1: $.data.id }
            - call: "POST /coatings/formulas"
              payload: { formula_code: "CLR-8841", color_name: "Desert Dusk", tint_base_id: "${tb1}", is_custom: false, target_delta_e: 0.8, lines: [ { colorant_id: "${c1}", shots_per_gallon: 4, sequence: 1 } ] }
              as: LabTechnician
              captures: { f1: $.data.id }
            - { call: "POST /coatings/formulas/${f1}/activate", payload: {}, as: LabTechnician }
            - call: "POST /coatings/mills"
              payload: { mill_code: "M-1", capacity_gallons: 200 }
              as: PlantManager
              captures: { m1: $.data.id }
            - call: "POST /coatings/customers"
              payload: { name: "Sunbelt Paints AZ", home_state_code: "AZ", annual_credit_cap_cents: 50000 }
              as: PlantManager
              captures: { cu1: $.data.id }
            - call: "POST /coatings/orders"
              payload: { customer_id: "${cu1}", destination_state_code: "AZ", rush_flag: false, lines: [ { formula_id: "${f1}", gallons: 3, size_code: "GALLON" } ] }
              as: Dealer
              as_user_id: "${cu1}"
              captures: { o1: $.data.id }
            - call: "POST /coatings/batches"
              payload: { formula_id: "${f1}", mill_id: "${m1}", planned_gallons: 3, mill_window_start: "2026-06-10T08:00:00Z", mill_window_end: "2026-06-10T12:00:00Z", order_id: "${o1}" }
              as: ProductionOperator
              captures: { b1: $.data.id }
            - { call: "POST /coatings/orders/${o1}/schedule", payload: { batch_id: "${b1}" }, as: ProductionOperator }
            - { call: "POST /coatings/batches/${b1}/start-mill", payload: {}, as: ProductionOperator }
          trigger:
            - { call: "POST /coatings/orders/${o1}/cancel", payload: {}, as: PlantManager, as_user_id: "pm-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (IN_PRODUCTION is not cancellable)"
            - "SalesOrder.${o1}.status == IN_PRODUCTION (unchanged)"

      - name: mill_maintenance_blocks_start_mill
        claim_type: guarded_transition
        grounds: [state_machines.Batch.PLANNED_to_MILLING, "errors[ERR_MILL_NOT_AVAILABLE]"]
        distinguishing_aspect: "start-mill is guarded by the Mill's state: with the mill in MAINTENANCE the transition fails with ERR_MILL_NOT_AVAILABLE; a PLANNED batch does not block maintenance."
        test_recipe:
          setup: ["F1 ACTIVE; M1; B1 PLANNED on M1; M1 enters maintenance (allowed: B1 is only PLANNED)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /coatings/tint-bases"
              payload: { base_code: "B-100", product_category: "NONFLAT", base_family: "LATEX_EXTERIOR", base_voc_gpl: 80, water_fraction_pct: 40, density_kg_per_gal: 4.6, base_cost_per_gal_cents: 1500, unit_price_per_gal_cents: 3200, shelf_life_months: 24, grind_spec_um: 25 }
              as: LabTechnician
              captures: { tb1: $.data.id }
            - call: "POST /coatings/colorants"
              payload: { colorant_code: "MAG-7", voc_g_per_unit: 5, cost_per_shot_cents: 30, is_hazmat: false }
              as: LabTechnician
              captures: { c1: $.data.id }
            - call: "POST /coatings/formulas"
              payload: { formula_code: "CLR-8841", color_name: "Desert Dusk", tint_base_id: "${tb1}", is_custom: false, target_delta_e: 0.8, lines: [ { colorant_id: "${c1}", shots_per_gallon: 4, sequence: 1 } ] }
              as: LabTechnician
              captures: { f1: $.data.id }
            - { call: "POST /coatings/formulas/${f1}/activate", payload: {}, as: LabTechnician }
            - call: "POST /coatings/mills"
              payload: { mill_code: "M-1", capacity_gallons: 200 }
              as: PlantManager
              captures: { m1: $.data.id }
            - call: "POST /coatings/batches"
              payload: { formula_id: "${f1}", mill_id: "${m1}", planned_gallons: 3, mill_window_start: "2026-06-10T08:00:00Z", mill_window_end: "2026-06-10T12:00:00Z" }
              as: ProductionOperator
              captures: { b1: $.data.id }
            - { call: "POST /coatings/mills/${m1}/enter-maintenance", payload: {}, as: PlantManager }
          trigger:
            - { call: "POST /coatings/batches/${b1}/start-mill", payload: {}, as: ProductionOperator, captures: { err: $.data.error_id } }
            - { call: "POST /coatings/mills/${m1}/return-to-service", payload: {}, as: PlantManager }
            - { call: "POST /coatings/batches/${b1}/start-mill", payload: {}, as: ProductionOperator }
          assert:
            - "err == ERR_MILL_NOT_AVAILABLE while Mill.${m1}.status == MAINTENANCE"
            - "After return-to-service the same start-mill succeeds: Batch.${b1}.status == MILLING"

      - name: mill_busy_blocks_maintenance
        claim_type: precondition_enforcement
        grounds: [state_machines.Mill.ACTIVE_to_MAINTENANCE, "errors[ERR_MILL_BUSY]"]
        distinguishing_aspect: "A mill with an in-flight batch (MILLING) cannot enter maintenance: ERR_MILL_BUSY; after the batch is condemned the same call succeeds."
        test_recipe:
          setup: ["F1 ACTIVE; M1; B1 in MILLING on M1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /coatings/tint-bases"
              payload: { base_code: "B-100", product_category: "NONFLAT", base_family: "LATEX_EXTERIOR", base_voc_gpl: 80, water_fraction_pct: 40, density_kg_per_gal: 4.6, base_cost_per_gal_cents: 1500, unit_price_per_gal_cents: 3200, shelf_life_months: 24, grind_spec_um: 25 }
              as: LabTechnician
              captures: { tb1: $.data.id }
            - call: "POST /coatings/colorants"
              payload: { colorant_code: "MAG-7", voc_g_per_unit: 5, cost_per_shot_cents: 30, is_hazmat: false }
              as: LabTechnician
              captures: { c1: $.data.id }
            - call: "POST /coatings/formulas"
              payload: { formula_code: "CLR-8841", color_name: "Desert Dusk", tint_base_id: "${tb1}", is_custom: false, target_delta_e: 0.8, lines: [ { colorant_id: "${c1}", shots_per_gallon: 4, sequence: 1 } ] }
              as: LabTechnician
