        distinguishing_aspect: "An empty candidate pool is a 404 unpublished-benchmark condition, not a ceiling of zero: the DAYS_31_90 program is refused while an otherwise identical DAYS_1_30 program - whose bucket does have a publication - succeeds, and a benchmark dated after the as_of_date does not count."
