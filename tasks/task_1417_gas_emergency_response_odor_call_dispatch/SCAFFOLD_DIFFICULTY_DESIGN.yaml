              as: Dispatcher
              captures: { inc_id: "$.data.incident_id" }
            - call: "POST /gas-ops/incidents/${inc_id}/triage"
              payload: { priority: "P2" }
              as: Dispatcher
            - call: "POST /gas-ops/incidents/${inc_id}/dispatches"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
              captures: { disp_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:20:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/dispatches/${disp_id}/arrive"
              payload: {}
              as: FieldTechnician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /gas-ops/incidents/${inc_id}/make-safe/complete"
              payload: { leak_confirmed: false, no_make_safe_required: true }
              as: FieldTechnician
              as_user_id: "${tech_id}"
              captures: { err: "$.data.error_id" }
            - call: "POST /gas-ops/incidents/${inc_id}/atmospheric-readings"
              payload: { pct_lel: 0.0, co_ppm: 0, reading_context: "INSIDE" }
