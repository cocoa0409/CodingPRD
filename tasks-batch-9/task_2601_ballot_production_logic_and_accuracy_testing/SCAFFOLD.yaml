  - method: POST
    path: /tabulator-units/{id}/deploy
    description: "Seals a tested unit and deploys it to a precinct that already holds issued ballots (IN_VAULT -> DEPLOYED)."
    roles: [WarehouseCustodian]
    input: [precinct_id, seal_number]
    output: TabulatorUnit
    side_effects:
      - "precinct_id and seal_number stored; CustodyEvent SEAL_APPLIED appended; election.open_seal_count += 1."
      - "precinct.deployment_status and election.deployment_readiness recomputed."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_TABULATOR_NOT_FOUND, ERR_PRECINCT_NOT_FOUND, ERR_ELECTION_PHASE_INVALID, ERR_UNIT_STATE_INVALID, ERR_LOT_STATE_INVALID, ERR_UNIT_STYLE_MISMATCH, ERR_SEAL_NUMBER_DUPLICATE]

  - method: POST
    path: /tabulator-units/{id}/break-seal
    description: "Compensating action: breaks the deployment seal and returns the unit to the vault (DEPLOYED -> IN_VAULT), reversing the seal ledger entry."
    roles: [WarehouseCustodian]
    input: [reason]
    output: TabulatorUnit
    side_effects:
      - "seal_number = null; precinct_id = null; CustodyEvent SEAL_BROKEN appended; election.open_seal_count -= 1."
      - "The formerly referenced precinct recomputes deployment_status; election.deployment_readiness recomputed."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_TABULATOR_NOT_FOUND, ERR_ELECTION_PHASE_INVALID, ERR_UNIT_STATE_INVALID]

  - method: POST
    path: /tabulator-units/{id}/seal-retention
    description: "Applies the post-election retention seal to a returned unit (RETURNED -> SEALED_RETENTION). Only permitted once the election is reconciled."
    roles: [WarehouseCustodian]
    input: [seal_number, retention_days]
    output: TabulatorUnit
    side_effects:
      - "seal_number stored; retention_until = election.election_date + retention_days days; CustodyEvent RETENTION_SEAL appended; election.open_seal_count += 1."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_TABULATOR_NOT_FOUND, ERR_UNIT_STATE_INVALID, ERR_RETENTION_BEFORE_RECONCILIATION, ERR_SEAL_NUMBER_DUPLICATE]

  - method: POST
    path: /la-test-sessions
    description: "Schedules a public logic-and-accuracy test for a programmed unit against a draft deck, enforcing the unit's buffered window exclusivity."
    roles: [VotingSystemTechnician]
    input: [tabulator_id, deck_id, session_type, scheduled_start, scheduled_end, public_notice_posted_at]
    output: LATestSession
    side_effects:
      - "Creates an LATestSession with status SCHEDULED, observer_count 0, observer_names [], reported_marks [], reported_blank_count null, reported_overvote_count null, discrepancy_count null, conducted_by_user_id null, started_at null, completed_at null."
      - "notice_lead_minutes is derived as the whole minutes from public_notice_posted_at to scheduled_start (negative when the notice is posted after the start)."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_TABULATOR_NOT_FOUND, ERR_TEST_DECK_NOT_FOUND, ERR_ELECTION_PHASE_INVALID, ERR_UNIT_STATE_INVALID, ERR_DECK_STATE_INVALID, ERR_UNIT_TEST_WINDOW_CONFLICT]

  - method: GET
    path: /la-test-sessions/{id}
    description: "Reads one logic-and-accuracy session."
    roles: [ElectionsDirector, BallotCoordinator, LanguageAccessCoordinator, PrintVendorRep, WarehouseCustodian, VotingSystemTechnician, PublicObserver]
    input: []
    output: LATestSession
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_LA_SESSION_NOT_FOUND]

  - method: GET
    path: /la-test-sessions
    description: "Lists logic-and-accuracy sessions (FK reverse-reachability for LATestSession.tabulator_id and LATestSession.deck_id)."
    roles: [ElectionsDirector, BallotCoordinator, LanguageAccessCoordinator, PrintVendorRep, WarehouseCustodian, VotingSystemTechnician, PublicObserver]
    input: ["tabulator_id?", "deck_id?", "status?", "session_type?"]
    output: LATestSession[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: POST
    path: /la-test-sessions/{id}/observers
    description: "Signs a public observer in to a scheduled session."
    roles: [VotingSystemTechnician, PublicObserver]
    input: [observer_name]
    output: LATestSession
    side_effects:
      - "observer_name is appended to observer_names and observer_count is recomputed as its length."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_LA_SESSION_NOT_FOUND, ERR_SESSION_STATE_INVALID]

  - method: POST
    path: /la-test-sessions/{id}/start
    description: "Opens the public logic-and-accuracy test (SCHEDULED -> IN_PROGRESS), enforcing notice lead, observer minimum, admission window and segregation of duties."
    roles: [VotingSystemTechnician]
    input: []
    output: LATestSession
    side_effects:
      - "started_at = logical clock; conducted_by_user_id = X-User-ID; the referenced TestDeck transitions DRAFT -> SEALED."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_LA_SESSION_NOT_FOUND, ERR_SESSION_STATE_INVALID, ERR_UNIT_STATE_INVALID, ERR_DECK_STATE_INVALID, ERR_SEGREGATION_OF_DUTIES, ERR_PUBLIC_NOTICE_TOO_LATE, ERR_OUTSIDE_TEST_WINDOW, ERR_INSUFFICIENT_OBSERVERS]

  - method: POST
    path: /la-test-sessions/{id}/record-results
    description: "Records the tabulator's reported tallies, derives the discrepancy count and closes the session (IN_PROGRESS -> PASSED or FAILED). A failure starts the depth-4 deployment cascade."
    roles: [VotingSystemTechnician]
    input: [reported_marks, reported_blank_count, reported_overvote_count]
    output: LATestSession
    side_effects:
      - "discrepancy_count per calculations.la_test_discrepancy; completed_at = logical clock; session PASSED when 0 else FAILED."
      - "PASSED: deck SEALED -> CONSUMED; unit program_status -> LA_PASSED; unit.la_session_count recomputed; precinct.deployment_status and election.deployment_readiness recomputed."
      - "FAILED: deck SEALED -> VOIDED; unit program_status -> LA_FAILED; a DEPLOYED unit reverts to IN_VAULT with its seal cleared, a CustodyEvent SEAL_BROKEN appended and election.open_seal_count decremented; the precinct falls to NOT_READY and the election to BLOCKED."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_LA_SESSION_NOT_FOUND, ERR_SESSION_STATE_INVALID, ERR_SEGREGATION_OF_DUTIES]

# =============================================================================
# 1.6 Errors
# =============================================================================
errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    message: "Missing or unrecognized X-Role header."
    trigger: "Any endpoint (except POST /_clock/set_current_utc) called without a valid role header."
  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    message: "Role {role} may not perform this operation."
    trigger: "A known role calls an endpoint that does not list it."
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    message: "This action must be performed by a different user."
    trigger: "Proof requester deciding their own proof; the unit's programmer conducting its public test; a user other than the conductor recording results."
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    message: "Request payload failed schema validation: {detail}."
    trigger: "Missing required field, wrong type, unknown enum value, negative quantity, inverted window, defect_count greater than sample_size, unparseable timestamp."
  - error_id: ERR_ELECTION_NOT_FOUND
    http_status: 404
    message: "Election {id} does not exist."
    trigger: "An election id that does not resolve."
  - error_id: ERR_CONTEST_NOT_FOUND
    http_status: 404
    message: "Contest {id} does not exist."
    trigger: "A contest id that does not resolve."
  - error_id: ERR_CANDIDATE_NOT_FOUND
    http_status: 404
    message: "Candidate {id} does not exist."
    trigger: "A candidate id that does not resolve."
  - error_id: ERR_PRECINCT_NOT_FOUND
    http_status: 404
    message: "Precinct {id} does not exist."
    trigger: "A precinct id that does not resolve, or one belonging to a different election than the addressed lot or unit."
  - error_id: ERR_BALLOT_STYLE_NOT_FOUND
    http_status: 404
    message: "Ballot style {id} does not exist."
    trigger: "A style id that does not resolve, or one belonging to a different election."
  - error_id: ERR_PRINT_VENDOR_NOT_FOUND
    http_status: 404
    message: "Print vendor {id} does not exist."
    trigger: "A vendor id that does not resolve."
  - error_id: ERR_PRINT_JOB_NOT_FOUND
    http_status: 404
    message: "Print job {id} does not exist."
    trigger: "A print job id that does not resolve."
  - error_id: ERR_BALLOT_LOT_NOT_FOUND
    http_status: 404
    message: "Ballot lot {id} does not exist."
    trigger: "A lot id that does not resolve."
  - error_id: ERR_TABULATOR_NOT_FOUND
    http_status: 404
    message: "Tabulator unit {id} does not exist."
    trigger: "A tabulator id that does not resolve, or one belonging to a different election."
  - error_id: ERR_TEST_DECK_NOT_FOUND
    http_status: 404
    message: "Test deck {id} does not exist."
    trigger: "A deck id that does not resolve, or one whose style belongs to a different election than the tabulator."
  - error_id: ERR_LA_SESSION_NOT_FOUND
    http_status: 404
    message: "Logic and accuracy session {id} does not exist."
    trigger: "A session id that does not resolve."
  - error_id: ERR_STALE_ELECTION_VERSION
    http_status: 412
    message: "Election version {expected} no longer current."
    trigger: "POST /elections/{id}/reconcile with expected_election_version != election.version."
  - error_id: ERR_STALE_BALLOT_STYLE_VERSION
    http_status: 412
    message: "Ballot style version {expected} no longer current."
    trigger: "POST /print-jobs with expected_ballot_style_version != style.version."
  - error_id: ERR_ELECTION_PHASE_INVALID
    http_status: 409
    message: "Election phase {status} does not permit this operation."
    trigger: "Any operation attempted outside the election phases it declares."
  - error_id: ERR_CONTEST_STATE_INVALID
    http_status: 409
    message: "Contest state {status} does not permit this operation."
    trigger: "Certifying a certified contest, withdrawing a draft contest, filing a candidate for a non-draft contest."
  - error_id: ERR_CANDIDATE_STATE_INVALID
    http_status: 409
    message: "Candidate state {status} does not permit this operation."
    trigger: "Disqualifying an already-disqualified candidate, or certifying a CANDIDATE contest with fewer FILED candidates than seats_open."
  - error_id: ERR_STYLE_STATE_INVALID
    http_status: 409
    message: "Ballot style state {status} does not permit this operation."
    trigger: "Deciding a proof that was never requested, printing from a DRAFT or SUPERSEDED style, programming from a non-LOCKED style, certifying languages on a PROOFING style, building a deck from a DRAFT style."
  - error_id: ERR_JOB_STATE_INVALID
    http_status: 409
    message: "Print job state {status} does not permit this operation."
    trigger: "Approving a proof twice, inspecting a delivered job, delivering a job that has not passed QC."
  - error_id: ERR_LOT_STATE_INVALID
    http_status: 409
    message: "Ballot lot state {status} does not permit this operation."
    trigger: "Receiving a received lot, issuing an in-transit lot, recalling a returned lot, deploying a tabulator to a precinct with no issued lot."
  - error_id: ERR_UNIT_STATE_INVALID
    http_status: 409
    message: "Tabulator state ({program_status}, {custody_status}) does not permit this operation."
    trigger: "Programming a deployed unit, deploying an untested unit, breaking the seal of a vaulted unit, retention-sealing a unit that never returned, scheduling a session for an unprogrammed unit."
  - error_id: ERR_DECK_STATE_INVALID
    http_status: 409
    message: "Test deck state {status} does not permit this operation."
    trigger: "Scheduling or starting a session against a deck that is SEALED, CONSUMED or VOIDED."
  - error_id: ERR_SESSION_STATE_INVALID
    http_status: 409
    message: "Session state {status} does not permit this operation."
    trigger: "Adding an observer to a started session, starting a session twice, recording results for a session that is not in progress."
  - error_id: ERR_VENDOR_NOT_SECURE
    http_status: 409
    message: "Vendor {id} is not a certified secure facility."
    trigger: "Placing or approving a print job with a vendor whose certified_secure is false or whose status is SUSPENDED."
  - error_id: ERR_PROOF_VERSION_STALE
    http_status: 409
    message: "Proof was taken against style version {pinned}, current version is {current}."
    trigger: "POST /print-jobs/{id}/approve-proof after the style's version advanced past style_version_at_creation."
  - error_id: ERR_LOT_NOT_FOR_PRECINCT
    http_status: 409
    message: "Lot printed for style {lot_style} cannot be issued to a precinct assigned style {precinct_style}."
    trigger: "POST /ballot-lots/{id}/issue where the precinct's assigned style is not the lot's printed style."
  - error_id: ERR_UNIT_STYLE_MISMATCH
    http_status: 409
    message: "Unit programmed for style {unit_style} cannot be deployed to a precinct assigned style {precinct_style}."
    trigger: "POST /tabulator-units/{id}/deploy with a programming/assignment mismatch."
  - error_id: ERR_SEAL_MISMATCH
    http_status: 409
    message: "Seal {presented} does not match the shipped seal {expected}."
    trigger: "POST /ballot-lots/{id}/receive with a seal number other than the one recorded at transfer-out."
  - error_id: ERR_SEAL_NUMBER_DUPLICATE
    http_status: 409
    message: "Seal number {seal} is already in use in this election."
    trigger: "Applying a deployment, delivery or retention seal whose number is already held by another lot or unit of the election."
  - error_id: ERR_PRESS_CAPACITY_EXCEEDED
    http_status: 409
    message: "Vendor {id} has no press line free for the requested window."
    trigger: "POST /print-jobs whose half-open press window overlaps press_line_count or more of the vendor's live jobs."
  - error_id: ERR_UNIT_TEST_WINDOW_CONFLICT
    http_status: 409
    message: "Tabulator {id} already has a test session in the requested window."
    trigger: "POST /la-test-sessions whose buffered closed window touches or overlaps another session's buffered window on the same unit."
  - error_id: ERR_PUBLIC_NOTICE_TOO_LATE
    http_status: 409
    message: "Public notice lead of {actual} minutes is below the required {required}."
    trigger: "POST /la-test-sessions/{id}/start when notice_lead_minutes is below la_notice_hours * 60."
  - error_id: ERR_OUTSIDE_TEST_WINDOW
    http_status: 409
    message: "Current time is outside the session's admission window."
    trigger: "POST /la-test-sessions/{id}/start more than SESSION_EARLY_START_MINUTES before scheduled_start, or after scheduled_end."
  - error_id: ERR_INSUFFICIENT_OBSERVERS
    http_status: 409
    message: "{actual} observers signed in; {required} required."
    trigger: "POST /la-test-sessions/{id}/start below the session type's observer minimum."
  - error_id: ERR_LANGUAGE_COVERAGE_INCOMPLETE
    http_status: 409
    message: "Style {id} is missing translations or alternative formats."
    trigger: "POST /ballot-styles/{id}/request-proof before every required language and format is certified."
  - error_id: ERR_EMPTY_TEST_DECK
    http_status: 409
    message: "A test deck must contain at least one ballot."
    trigger: "POST /ballot-styles/{id}/test-decks with ballot_count below 1."
  - error_id: ERR_DECK_MARK_OFF_STYLE
    http_status: 409
    message: "Expected mark references a contest or candidate that is not printed on this style."
    trigger: "POST /ballot-styles/{id}/test-decks with an expected mark outside the style's certified layout."
  - error_id: ERR_DECK_MARKS_EXCEED_CAPACITY
    http_status: 409
    message: "{marks} expected marks exceed the {capacity} mark capacity of {ballots} ballots."
    trigger: "POST /ballot-styles/{id}/test-decks with expected_total_marks above ballot_count * LINES_PER_FACE."
  - error_id: ERR_NO_CERTIFIED_CONTESTS
    http_status: 409
    message: "Election {id} has no certified contests to order."
    trigger: "POST /elections/{id}/certify-ballot-order with zero certified contests."
  - error_id: ERR_BALLOT_ORDER_COLLISION
    http_status: 409
    message: "Contests {a} and {b} cannot be ordered deterministically."
    trigger: "POST /contests/{id}/certify while another DRAFT or CERTIFIED contest of the election shares (contest_type, district_code, title)."
  - error_id: ERR_DEPLOYMENT_NOT_READY
    http_status: 409
    message: "Election {id} is not deployment-ready."
    trigger: "POST /elections/{id}/deploy while any precinct is NOT_READY or the election has no precincts."
  - error_id: ERR_LOTS_NOT_RETURNED
    http_status: 409
    message: "{count} lots are still issued; a final canvass requires every lot returned."
    trigger: "POST /elections/{id}/reconcile with basis FINAL_CANVASS while a lot is still ISSUED."
  - error_id: ERR_RETENTION_BEFORE_RECONCILIATION
    http_status: 409
    message: "Retention seals may only be applied after reconciliation."
    trigger: "POST /tabulator-units/{id}/seal-retention while election.status is not RECONCILED."
  - error_id: ERR_QUANTITY_BELOW_REQUIREMENT
    http_status: 409
    message: "{ordered} ballots ordered is below the {required} required by the style's precincts."
    trigger: "POST /print-jobs with quantity_ordered below the summed precinct requirement for the style."
  - error_id: ERR_ISSUE_QUANTITY_EXCEEDS_RECEIPT
    http_status: 409
    message: "Cannot issue {requested} ballots from a lot that received {received}."
    trigger: "POST /ballot-lots/{id}/issue with issue_quantity above quantity_received."
  - error_id: ERR_LOT_ACCOUNTING_EXCEEDS_RECEIPT
    http_status: 409
    message: "Voted plus spoiled plus returned unused ({total}) exceeds the {received} ballots received."
    trigger: "POST /ballot-lots/{id}/return-counts with a total above quantity_received."

# =============================================================================
# 1.7 Roles (role_model: segregation_of_duties)
# =============================================================================
# The X-Role header names the acting role; the X-User-ID header names the acting
# user. Both are opaque strings the client chooses, except for PrintVendorRep,
# whose X-User-ID must equal the PrintVendor.id it acts for.
roles:
  - name: ElectionsDirector
    identity: opaque
    description: "The county elections official of record. Owns election phase advancement, contest and candidate certification, proof sign-off, press-proof approval and reconciliation."
    exclusive_operations:
      - "POST /elections"
      - "POST /elections/{id}/certify-ballot-order"
      - "POST /elections/{id}/lock-styles"
      - "POST /elections/{id}/deploy"
      - "POST /elections/{id}/close-polls"
      - "POST /elections/{id}/reconcile"
      - "POST /contests/{id}/certify"
      - "POST /contests/{id}/withdraw"
      - "POST /candidates/{id}/disqualify"
      - "POST /print-vendors"
      - "POST /print-jobs/{id}/approve-proof"
    shared_operations:
      - "POST /elections/{id}/contests (with BallotCoordinator)"
      - "POST /contests/{id}/candidates (with BallotCoordinator)"
      - "POST /elections/{id}/precincts (with BallotCoordinator)"
      - "POST /ballot-styles/{id}/proof-decision (with BallotCoordinator, subject to segregation of duties)"
      - "every GET"
  - name: BallotCoordinator
    identity: opaque
    description: "Builds the ballot: files contests and candidates, registers precincts, creates ballot styles, assigns styles to precincts, requests proofs and places print orders."
    exclusive_operations:
      - "POST /elections/{id}/ballot-styles"
      - "POST /precincts/{id}/assign-style"
      - "POST /ballot-styles/{id}/request-proof"
      - "POST /print-jobs"
    shared_operations:
      - "POST /elections/{id}/contests (with ElectionsDirector)"
      - "POST /contests/{id}/candidates (with ElectionsDirector)"
      - "POST /elections/{id}/precincts (with ElectionsDirector)"
      - "POST /ballot-styles/{id}/proof-decision (with ElectionsDirector, subject to segregation of duties)"
      - "POST /ballot-styles/{id}/test-decks (with VotingSystemTechnician)"
      - "every GET"
  - name: LanguageAccessCoordinator
    identity: opaque
    description: "Certifies translations and alternative formats. This is the only role that can attest language and accessibility coverage, which is a precondition for sending a style to proof."
    exclusive_operations:
      - "POST /ballot-styles/{id}/language-certifications"
    shared_operations:
      - "every GET"
  - name: PrintVendorRep
    identity: "entity_backed:PrintVendor"
    description: "A representative of a registered print vendor. X-User-ID must equal the PrintVendor.id the job belongs to; a rep of another vendor calling deliver is rejected with ERR_UNAUTHORIZED."
    exclusive_operations:
      - "POST /print-jobs/{id}/deliver"
    shared_operations:
      - "every GET"
  - name: WarehouseCustodian
    identity: opaque
    description: "Owns physical custody: quality inspection, lot receipt, issue, recall and return accounting, tabulator sealing, deployment and retention sealing."
    exclusive_operations:
      - "POST /print-jobs/{id}/inspect"
      - "POST /ballot-lots/{id}/receive"
      - "POST /ballot-lots/{id}/issue"
      - "POST /ballot-lots/{id}/recall"
      - "POST /ballot-lots/{id}/return-counts"
      - "POST /tabulator-units/{id}/deploy"
      - "POST /tabulator-units/{id}/break-seal"
      - "POST /tabulator-units/{id}/seal-retention"
    shared_operations:
      - "every GET"
  - name: VotingSystemTechnician
    identity: opaque
    description: "Programs equipment, builds test decks, schedules and conducts logic-and-accuracy testing. Cannot conduct the public test of a unit they programmed, and cannot record results for a session someone else conducted."
    exclusive_operations:
      - "POST /elections/{id}/tabulator-units"
      - "POST /tabulator-units/{id}/program"
      - "POST /la-test-sessions"
      - "POST /la-test-sessions/{id}/start"
      - "POST /la-test-sessions/{id}/record-results"
    shared_operations:
      - "POST /ballot-styles/{id}/test-decks (with BallotCoordinator)"
      - "POST /la-test-sessions/{id}/observers (with PublicObserver)"
      - "every GET"
  - name: PublicObserver
    identity: opaque
    description: "A member of the public observing the logic-and-accuracy test. Can sign in to a scheduled session and read anything, but can mutate nothing else."
    exclusive_operations: []
    shared_operations:
      - "POST /la-test-sessions/{id}/observers (with VotingSystemTechnician)"
      - "every GET"

segregation_of_duties_constraints:
  - constraint_id: sod-proof-decision
    description: "The user who requested a style proof (style.proof_requested_by_user_id) cannot be the user who decides it."
    enforced_at: "POST /ballot-styles/{id}/proof-decision"
    error_id: ERR_SEGREGATION_OF_DUTIES
  - constraint_id: sod-la-test-conduct
    description: "The technician who programmed a tabulator (unit.programmed_by_user_id) cannot conduct that unit's logic-and-accuracy session."
    enforced_at: "POST /la-test-sessions/{id}/start"
    error_id: ERR_SEGREGATION_OF_DUTIES
  - constraint_id: sod-la-results-entry
    description: "Only the technician who actually conducted the session (session.conducted_by_user_id) may record its results."
    enforced_at: "POST /la-test-sessions/{id}/record-results"
    error_id: ERR_SEGREGATION_OF_DUTIES
