              captures: { eng: $.data.id }
            - call: "POST /engagements/${eng}/stores"
              payload: { jurisdiction_id: "${j_ny}", store_code: "S-1301", address_line: "14 Dock St" }
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { st: $.data.id }
