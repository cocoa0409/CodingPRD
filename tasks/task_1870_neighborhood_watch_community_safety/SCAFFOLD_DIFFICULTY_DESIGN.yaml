              captures: { b_status: $.data.registration_status }
            - call: "GET /watch/members/${m1}"
              payload: {}
              as: ProgramCoordinator
              captures: { m_status: $.data.membership_status }
            - call: "GET /watch/watch-groups/${wg}"
              payload: {}
              as: ProgramCoordinator
              captures: { score_post: $.data.participation_score }
          assert:
            - "posture_pre == FORMATION and score_pre == 12 (CENSUS: 10*1 + 2*1)"
            - "b_status == DEREGISTERED (link 1)"
            - "m_status == WITHDRAWN (link 2: cascade caused by deregistration, not by a withdraw call)"
            - "score_post == 0 (block leaves REGISTERED set and member leaves ACTIVE set)"

  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_on_alert_send
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_QUIET_HOURS]
        distinguishing_aspect: |
          Category pair state (p4) vs business_temporal (p7): a send against a
          DRAFT alert whose scheduled_send_at sits inside quiet hours violates
          both rules; the state check fires first and the response must be
          ERR_INVALID_STATE (409), not ERR_QUIET_HOURS (422).
        test_recipe:
          setup:
            - "OPERATIONAL group, 1 REGISTERED block with captain; a SAFETY_TIP alert left in DRAFT with a quiet-hours-legal scheduled_send_at 2026-08-10T12:00:00Z; the clock is then advanced to 2026-08-10T23:30:00Z (inside 22:00-07:00 quiet hours) so the send attempt violates BOTH the state rule (DRAFT has no ->SENT path) and the quiet-hours rule."
          setup_api_calls:
            - call: "POST /watch/watch-groups"
              payload: { name: "Prio Watch A", precinct_code: "PCT9" }
              as: ProgramCoordinator
              captures: { wg: $.data.id, wg_v: $.data.version }
