scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: coverage_notional_basis_vs_delta_adjusted_basis
        grounds:
          - calculations.hedge_coverage_ratio
          - entities.HedgeProgram.fields.coverage_pct_notional
          - entities.HedgeProgram.fields.coverage_pct_delta
          - entities.HedgeInstrument.fields.delta_factor
          - validations[priority=20]
        distinguishing_aspect: |
          The same two executed trades yield coverage_pct_notional 45.45 and
          coverage_pct_delta 39.09 on one HedgeProgram, because the notional_basis
          variant credits every trade at 1.00 while the delta_adjusted_basis variant
          credits the COLLAR at 0.65; only the delta figure is compared against
          HedgePolicy.max_coverage_pct.
        test_recipe:
          setup:
            - "One ACTIVE HedgePolicy with max_coverage_pct 60.00, min_coverage_pct 15.00, max_single_counterparty_pct 45.00."
            - "Two PUBLISHED SUMMER forecasts giving the program a consumption_basis_gallons of 11000000."
            - "One ACTIVE HedgeProgram carrying two EXECUTED instruments: a 3000000-gallon SWAP with counterparty A and a 2000000-gallon COLLAR with counterparty B."
          setup_api_calls:
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-DV1", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 15.00, max_single_counterparty_pct: 45.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 150000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY", "WIDEBODY", "REGIONAL"] }
              as: RiskPolicyAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /fuel/counterparties"
              payload: { counterparty_code: "DLRA", legal_name: "Dealer A Bank NA", credit_rating: "A", credit_limit_usd: 1000000.00 }
              as: RiskPolicyAdmin
              captures: { cp_a_id: $.data.id }
            - call: "POST /fuel/counterparties"
              payload: { counterparty_code: "DLRB", legal_name: "Dealer B Bank NA", credit_rating: "A", credit_limit_usd: 1000000.00 }
              as: RiskPolicyAdmin
              captures: { cp_b_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "NARROWBODY", route_group: "DOMESTIC_SHORT", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 4000000 }
              as: FuelAnalyst
              captures: { f1_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts/${f1_id}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "WIDEBODY", route_group: "TRANSATLANTIC", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 6000000 }
              as: FuelAnalyst
              captures: { f2_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts/${f2_id}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/hedge-programs"
              payload: { policy_id: "${policy_id}", program_code: "HP-DV1", period_start_month: "2027-01", period_end_month: "2027-03", route_groups: ["DOMESTIC_SHORT", "TRANSATLANTIC"], target_coverage_pct: 45.00 }
              as: FuelAnalyst
              captures: { prog_id: $.data.id }
            - call: "POST /fuel/hedge-programs/${prog_id}/size"
              payload: {}
              as: FuelAnalyst
              captures: { prog_v1: $.data.version }
            - call: "POST /fuel/hedge-programs/${prog_id}/instruments"
              payload: { counterparty_id: "${cp_a_id}", instrument_type: "SWAP", notional_gallons: 3000000, maturity_month: "2027-02", strike_usd_per_gal: 2.4000, expected_hedge_program_version: "${prog_v1}" }
              as: FuelAnalyst
              captures: { i_swap_id: $.data.id }
            - call: "GET /fuel/hedge-programs/${prog_id}"
              payload: {}
              as: FuelAnalyst
              captures: { prog_v2: $.data.version }
            - call: "POST /fuel/hedge-programs/${prog_id}/instruments"
              payload: { counterparty_id: "${cp_b_id}", instrument_type: "COLLAR", notional_gallons: 2000000, maturity_month: "2027-03", cap_strike_usd_per_gal: 2.7000, floor_strike_usd_per_gal: 2.1000, expected_hedge_program_version: "${prog_v2}" }
              as: FuelAnalyst
              captures: { i_collar_id: $.data.id }
            - call: "POST /fuel/hedge-programs/${prog_id}/submit"
              payload: {}
              as: FuelAnalyst
              as_user_id: "u_analyst_1"
            - call: "POST /fuel/hedge-programs/${prog_id}/activate"
              payload: {}
              as: TreasuryRiskManager
              as_user_id: "u_trm_1"
          trigger:
            - call: "POST /fuel/hedge-instruments/${i_swap_id}/execute"
              payload: {}
              as: TreasuryRiskManager
            - call: "POST /fuel/hedge-instruments/${i_collar_id}/execute"
              payload: {}
              as: TreasuryRiskManager
          assert:
            - "HedgeInstrument.${i_swap_id}.delta_factor == 1.00 and HedgeInstrument.${i_swap_id}.delta_adjusted_gallons == 3000000.00"
            - "HedgeInstrument.${i_collar_id}.delta_factor == 0.65 and HedgeInstrument.${i_collar_id}.delta_adjusted_gallons == 1300000.00"
            - "HedgeProgram.${prog_id}.consumption_basis_gallons == 11000000"
            - "HedgeProgram.${prog_id}.hedged_gallons == 5000000 and HedgeProgram.${prog_id}.delta_adjusted_gallons == 4300000.00"
            - "HedgeProgram.${prog_id}.coverage_pct_notional == 45.45"
            - "HedgeProgram.${prog_id}.coverage_pct_delta == 39.09"
            - "HedgeProgram.${prog_id}.coverage_pct_notional != HedgeProgram.${prog_id}.coverage_pct_delta"
            - "both executions return 200 because the enforced delta figure 39.09 is below max_coverage_pct 60.00, even though the notional figure is 45.45"

      - name: tankering_planned_basis_vs_reconciled_basis
        grounds:
          - calculations.tankering_net_savings_usd
          - calculations.tankering_burn_penalty_gallons
          - entities.TankeringDirective.fields.planned_net_savings_usd
          - entities.TankeringDirective.fields.reconciled_net_savings_usd
          - entities.TankeringDirective.fields.savings_variance_usd
          - state_machines.TankeringDirective.EXECUTED_to_RECONCILED
        distinguishing_aspect: |
          The planned_basis variant prices the requested 3000 gallons over the planned
          210-minute block and yields planned_net_savings_usd 978.82, while the
          reconciled_basis variant prices the flown 2600 gallons over the actual
          250-minute block at the prices pinned at approval and yields
          reconciled_net_savings_usd 793.51, a savings_variance_usd of -185.31; the
          payload hinge is re-evaluated, so the penalty multiplier drops from 1.1712 to
          1.0520 even though the block time grew.
        test_recipe:
          setup:
            - "Logical clock at 2027-02-10T00:00:00Z."
            - "Station ORD with into_plane_fee_usd_per_gal 0.0450 and one ACTIVE supply contract at index 2.4000 plus differential 0.0250, giving all_in_price_usd_per_gal 2.4700."
            - "Station DFW with into_plane_fee_usd_per_gal 0.0800 and one ACTIVE supply contract at index 2.9000 plus differential 0.1200, giving all_in_price_usd_per_gal 3.1000."
            - "ORD holds 500000 gallons against avg_daily_liftings_gallons 100000, so supply_posture is WATCH, not SHORT."
            - "One NARROWBODY FlightLeg ORD-DFW with uplift_cap_gallons 10600.00, carrying an EXECUTED TankeringDirective for 3000 gallons."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-10T00:00:00Z" }
              as: RiskPolicyAdmin
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-DV2", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 15.00, max_single_counterparty_pct: 45.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 150000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY", "WIDEBODY", "REGIONAL"] }
              as: RiskPolicyAdmin
            - call: "POST /fuel/stations"
              payload: { iata_code: "ORD", name: "Chicago OHare", into_plane_fee_usd_per_gal: 0.0450, avg_daily_liftings_gallons: 100000, consortium_member: false }
              as: RiskPolicyAdmin
              captures: { ord_id: $.data.id }
            - call: "POST /fuel/stations"
              payload: { iata_code: "DFW", name: "Dallas Fort Worth", into_plane_fee_usd_per_gal: 0.0800, avg_daily_liftings_gallons: 100000, consortium_member: false }
              as: RiskPolicyAdmin
              captures: { dfw_id: $.data.id }
            - call: "POST /fuel/stations/${ord_id}/supply-contracts"
              payload: { contract_ref: "ORD-2027-A", index_basis: "PLATTS_USGC", index_price_usd_per_gal: 2.4000, differential_usd_per_gal: 0.0250, term_start_date: "2027-01-01", term_end_date: "2027-06-30", min_monthly_gallons: 0, max_monthly_gallons: 9000000 }
              as: RiskPolicyAdmin
            - call: "POST /fuel/stations/${dfw_id}/supply-contracts"
              payload: { contract_ref: "DFW-2027-A", index_basis: "PLATTS_USGC", index_price_usd_per_gal: 2.9000, differential_usd_per_gal: 0.1200, term_start_date: "2027-01-01", term_end_date: "2027-06-30", min_monthly_gallons: 0, max_monthly_gallons: 9000000 }
              as: RiskPolicyAdmin
            - call: "POST /fuel/stations/${ord_id}/inventory-adjustments"
              payload: { delta_gallons: 500000, reason: "Opening physical stock" }
              as: FuelOpsController
            - call: "POST /fuel/flight-legs"
              payload: { flight_number: "UA100", departure_date: "2027-02-15", origin_station_id: "${ord_id}", destination_station_id: "${dfw_id}", fleet_type: "NARROWBODY", planned_block_minutes: 210, planned_burn_gallons: 14500, tank_capacity_gallons: 26000, payload_lbs: 22000, max_takeoff_payload_lbs: 45000, landing_weight_lbs: 128000, max_landing_weight_lbs: 200000 }
              as: FuelOpsController
              captures: { leg_id: $.data.id, leg_v: $.data.version }
            - call: "POST /fuel/flight-legs/${leg_id}/tankering-directives"
              payload: { requested_uplift_gallons: 3000, expected_flight_leg_version: "${leg_v}" }
              as: FuelAnalyst
              captures: { dir_id: $.data.id }
            - call: "POST /fuel/tankering-directives/${dir_id}/approve"
              payload: {}
              as: FuelOpsController
            - call: "POST /fuel/tankering-directives/${dir_id}/execute"
              payload: {}
              as: FuelOpsController
          trigger:
            - call: "POST /fuel/tankering-directives/${dir_id}/reconcile"
              payload: { actual_uplift_gallons: 2600, actual_block_minutes: 250 }
              as: FuelOpsController
          assert:
            - "TankeringDirective.${dir_id}.planned_burn_penalty_gallons == 368.9"
            - "TankeringDirective.${dir_id}.planned_gross_savings_usd == 1890.00"
            - "TankeringDirective.${dir_id}.planned_penalty_cost_usd == 911.18"
            - "TankeringDirective.${dir_id}.planned_net_savings_usd == 978.82"
            - "TankeringDirective.${dir_id}.pinned_origin_price_usd_per_gal == 2.4700"
            - "TankeringDirective.${dir_id}.pinned_destination_price_usd_per_gal == 3.1000"
            - "TankeringDirective.${dir_id}.pinned_origin_contract_ref == \"ORD-2027-A\""
            - "TankeringDirective.${dir_id}.reconciled_burn_penalty_gallons == 341.9"
            - "TankeringDirective.${dir_id}.reconciled_net_savings_usd == 793.51"
            - "TankeringDirective.${dir_id}.savings_variance_usd == -185.31"
            - "TankeringDirective.${dir_id}.status == RECONCILED"

      - name: effectiveness_period_basis_vs_cumulative_basis
        grounds:
          - calculations.effectiveness_ratio
          - entities.EffectivenessTest.fields.period_ratio
          - entities.EffectivenessTest.fields.cumulative_ratio
          - entities.EffectivenessTest.fields.result
          - entities.HedgeInstrument.fields.cumulative_hedge_change_usd
        distinguishing_aspect: |
          The second effectiveness test records period_ratio 0.5000 — far outside the
          0.8000-1.2500 corridor — yet result is PASS, because the decisive
          cumulative_basis variant reads the since-designation totals -160000.00 over
          200000.00 and yields cumulative_ratio 0.8000.
        test_recipe:
          setup:
            - "One ACTIVE HedgeProgram on an ACTIVE policy, consumption_basis_gallons 11000000."
            - "One EXECUTED, UNDESIGNATED 1000000-gallon SWAP instrument with no prior effectiveness tests."
          setup_api_calls:
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-DV3", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 5.00, max_single_counterparty_pct: 45.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 150000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY", "WIDEBODY", "REGIONAL"] }
              as: RiskPolicyAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /fuel/counterparties"
              payload: { counterparty_code: "DLRA", legal_name: "Dealer A Bank NA", credit_rating: "A", credit_limit_usd: 1000000.00 }
              as: RiskPolicyAdmin
              captures: { cp_a_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "NARROWBODY", route_group: "DOMESTIC_SHORT", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 4000000 }
              as: FuelAnalyst
              captures: { f1_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts/${f1_id}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "WIDEBODY", route_group: "TRANSATLANTIC", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 6000000 }
              as: FuelAnalyst
              captures: { f2_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts/${f2_id}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/hedge-programs"
              payload: { policy_id: "${policy_id}", program_code: "HP-DV3", period_start_month: "2027-01", period_end_month: "2027-03", route_groups: ["DOMESTIC_SHORT", "TRANSATLANTIC"], target_coverage_pct: 10.00 }
              as: FuelAnalyst
              captures: { prog_id: $.data.id }
            - call: "POST /fuel/hedge-programs/${prog_id}/size"
              payload: {}
              as: FuelAnalyst
              captures: { prog_v1: $.data.version }
            - call: "POST /fuel/hedge-programs/${prog_id}/instruments"
              payload: { counterparty_id: "${cp_a_id}", instrument_type: "SWAP", notional_gallons: 1000000, maturity_month: "2027-03", strike_usd_per_gal: 2.4000, expected_hedge_program_version: "${prog_v1}" }
              as: FuelAnalyst
              captures: { inst_id: $.data.id }
            - call: "POST /fuel/hedge-programs/${prog_id}/submit"
              payload: {}
              as: FuelAnalyst
              as_user_id: "u_analyst_1"
            - call: "POST /fuel/hedge-programs/${prog_id}/activate"
              payload: {}
              as: TreasuryRiskManager
              as_user_id: "u_trm_1"
            - call: "POST /fuel/hedge-instruments/${inst_id}/execute"
              payload: {}
              as: TreasuryRiskManager
            - call: "POST /fuel/hedge-instruments/${inst_id}/effectiveness-tests"
              payload: { period_month: "2027-01", hedge_change_usd: -110000.00, hedged_item_change_usd: 100000.00 }
              as: HedgeAccountant
              captures: { test1_id: $.data.id }
          trigger:
            - call: "POST /fuel/hedge-instruments/${inst_id}/effectiveness-tests"
              payload: { period_month: "2027-02", hedge_change_usd: -50000.00, hedged_item_change_usd: 100000.00 }
              as: HedgeAccountant
              captures: { test2_id: $.data.id }
          assert:
            - "EffectivenessTest.${test1_id}.period_ratio == 1.1000 and EffectivenessTest.${test1_id}.cumulative_ratio == 1.1000 and EffectivenessTest.${test1_id}.result == PASS"
            - "EffectivenessTest.${test2_id}.period_ratio == 0.5000"
            - "EffectivenessTest.${test2_id}.cumulative_ratio == 0.8000"
            - "EffectivenessTest.${test2_id}.result == PASS"
            - "HedgeInstrument.${inst_id}.cumulative_hedge_change_usd == -160000.00 and HedgeInstrument.${inst_id}.cumulative_item_change_usd == 200000.00"
            - "HedgeInstrument.${inst_id}.accounting_status == UNDESIGNATED (the test does not designate, so no de-designation cascade can fire)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: tankering_burn_penalty_payload_hinge_four_inputs
        grounds:
          - calculations.tankering_burn_penalty_gallons
          - entities.FlightLeg.fields.payload_lbs
          - entities.FlightLeg.fields.max_takeoff_payload_lbs
          - entities.TankeringDirective.fields.planned_burn_penalty_gallons
          - state_machines.TankeringDirective.NEEDS_REVISION_to_PROPOSED
        distinguishing_aspect: |
          Uplift, fleet burn factor, block time and payload ratio interact through a
          hinge at PAYLOAD_RATIO_THRESHOLD 0.85: a 3000-gallon uplift lifts
          payload_ratio to 0.9356 and the multiplier to 1.1712, giving 368.9 penalty
          gallons, while the same leg with a 500-gallon uplift sits at payload_ratio
          0.5633, leaves the multiplier at exactly 1.0000, and gives 52.5 penalty
          gallons - a ratio of penalties (7.03) that no product of independent linear
          factors can reproduce.
        test_recipe:
          setup:
            - "Logical clock at 2027-02-10T00:00:00Z."
            - "Stations ORD (all-in 2.4700) and DFW (all-in 3.1000) each with one ACTIVE supply contract; ORD holds 500000 gallons."
            - "One NARROWBODY FlightLeg with planned_block_minutes 210, payload_lbs 22000, max_takeoff_payload_lbs 45000 and uplift_cap_gallons 10600.00."
            - "One TankeringDirective on that leg requesting 3000 gallons, sent back to NEEDS_REVISION by the controller."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-10T00:00:00Z" }
              as: RiskPolicyAdmin
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-CF1", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 15.00, max_single_counterparty_pct: 45.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 150000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY", "WIDEBODY", "REGIONAL"] }
              as: RiskPolicyAdmin
            - call: "POST /fuel/stations"
              payload: { iata_code: "ORD", name: "Chicago OHare", into_plane_fee_usd_per_gal: 0.0450, avg_daily_liftings_gallons: 100000, consortium_member: false }
              as: RiskPolicyAdmin
              captures: { ord_id: $.data.id }
            - call: "POST /fuel/stations"
              payload: { iata_code: "DFW", name: "Dallas Fort Worth", into_plane_fee_usd_per_gal: 0.0800, avg_daily_liftings_gallons: 100000, consortium_member: false }
              as: RiskPolicyAdmin
              captures: { dfw_id: $.data.id }
            - call: "POST /fuel/stations/${ord_id}/supply-contracts"
              payload: { contract_ref: "ORD-2027-A", index_basis: "PLATTS_USGC", index_price_usd_per_gal: 2.4000, differential_usd_per_gal: 0.0250, term_start_date: "2027-01-01", term_end_date: "2027-06-30", min_monthly_gallons: 0, max_monthly_gallons: 9000000 }
              as: RiskPolicyAdmin
            - call: "POST /fuel/stations/${dfw_id}/supply-contracts"
              payload: { contract_ref: "DFW-2027-A", index_basis: "PLATTS_USGC", index_price_usd_per_gal: 2.9000, differential_usd_per_gal: 0.1200, term_start_date: "2027-01-01", term_end_date: "2027-06-30", min_monthly_gallons: 0, max_monthly_gallons: 9000000 }
              as: RiskPolicyAdmin
            - call: "POST /fuel/stations/${ord_id}/inventory-adjustments"
              payload: { delta_gallons: 500000, reason: "Opening physical stock" }
              as: FuelOpsController
            - call: "POST /fuel/flight-legs"
              payload: { flight_number: "UA200", departure_date: "2027-02-16", origin_station_id: "${ord_id}", destination_station_id: "${dfw_id}", fleet_type: "NARROWBODY", planned_block_minutes: 210, planned_burn_gallons: 14500, tank_capacity_gallons: 26000, payload_lbs: 22000, max_takeoff_payload_lbs: 45000, landing_weight_lbs: 128000, max_landing_weight_lbs: 200000 }
              as: FuelOpsController
              captures: { leg_id: $.data.id, leg_v: $.data.version }
            - call: "POST /fuel/flight-legs/${leg_id}/tankering-directives"
              payload: { requested_uplift_gallons: 3000, expected_flight_leg_version: "${leg_v}" }
              as: FuelAnalyst
              captures: { dir_id: $.data.id }
            - call: "POST /fuel/tankering-directives/${dir_id}/request-revision"
              payload: { revision_note: "Trim the uplift, payload is tight." }
              as: FuelOpsController
          trigger:
            - call: "POST /fuel/tankering-directives/${dir_id}/revise"
              payload: { requested_uplift_gallons: 500 }
              as: FuelAnalyst
          assert:
            - "before the revision, TankeringDirective.${dir_id}.planned_burn_penalty_gallons was 368.9 for a 3000-gallon uplift"
            - "TankeringDirective.${dir_id}.requested_uplift_gallons == 500"
            - "TankeringDirective.${dir_id}.planned_burn_penalty_gallons == 52.5"
            - "TankeringDirective.${dir_id}.planned_gross_savings_usd == 315.00"
            - "TankeringDirective.${dir_id}.planned_penalty_cost_usd == 129.68"
            - "TankeringDirective.${dir_id}.planned_net_savings_usd == 185.32"
            - "TankeringDirective.${dir_id}.revision_count == 1 and TankeringDirective.${dir_id}.status == PROPOSED"

      - name: mtm_totals_round_per_instrument_then_sum
        grounds:
          - calculations.mtm_report_totals
          - entities.MarkToMarketRun.fields.total_mtm_usd
          - entities.MarkToMarketRun.fields.designated_mtm_usd
          - entities.MarkToMarketRun.fields.undesignated_mtm_usd
          - entities.HedgeInstrument.fields.mtm_value_usd
          - state_machines.MarkToMarketRun.OPEN_to_COMPUTED
        distinguishing_aspect: |
          All three exact per-instrument mark-to-market values end in a half cent
          (1481665.1850, 163005.7050, 73581.4250), so rounding each to cents first and
          then summing gives total_mtm_usd 1718252.33 while summing the exact values and
          rounding once gives 1718252.32; the pinned order is round-then-sum, and the
          two answers differ by exactly 0.01.
        test_recipe:
          setup:
            - "One ACTIVE HedgeProgram with consumption_basis_gallons 11000000 under a policy allowing max_single_counterparty_pct 45.00."
            - "Three EXECUTED instruments with three different counterparties: SWAP 3333330 gallons at strike 2.4055, COLLAR 1111150 gallons with cap 2.7033 and floor 2.1000, CALL_OPTION 777750 gallons at strike 2.6011 with premium 120000.55."
            - "The SWAP and the CALL_OPTION are DESIGNATED; the COLLAR stays UNDESIGNATED."
            - "One OPEN MarkToMarketRun for 2027-02 at settlement_index_usd_per_gal 2.8500."
          setup_api_calls:
            - call: "POST /fuel/hedge-policies"
