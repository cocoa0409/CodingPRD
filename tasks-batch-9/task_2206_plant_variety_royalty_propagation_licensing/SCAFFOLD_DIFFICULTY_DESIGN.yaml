# Scaffold Difficulty Design (SKILL.md §1.8) for
# task_2206_plant_variety_royalty_propagation_licensing.
# Nine §0.5 rule_ids, 19 instances. Every `grounds:` entry resolves into
# SCAFFOLD.yaml §1.1-§1.7. Every numeric assert below was produced by executing
# the referenced `calculations[].formula` with its `constants:` in code.
# The logical clock's startup default is 2026-08-01T00:00:00Z.

scaffold_difficulty_design:
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: royalty_report_reported_basis_versus_audited_basis_divergence
        grounds:
          - calculations.royalty_report_totals
          - calculations.effective_royalty_rate
          - entities.RoyaltyReport.fields.provisional_total_cents
          - entities.RoyaltyReport.fields.final_total_cents
          - entities.RoyaltyLineItem.fields.billable_units
          - entities.RoyaltyLineItem.fields.effective_rate_cents
          - state_machines.RoyaltyReport.review_status.DRAFT_to_SUBMITTED
          - state_machines.RoyaltyReport.review_status.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          This is the money variant pair on the RoyaltyReport / RoyaltyLineItem
          domain: identical stored data yields provisional_total_cents 394450 on
          the reported_basis variant and final_total_cents 458850 on the
          audited_basis variant, because audited_basis substitutes
          max(reported_units, quota.tags_activated_units) for the quantity AND
          that larger quantity crosses the 10000-unit volume band, dropping
          effective_rate_cents from 40.2500 to 38.2375.
        test_recipe:
          setup:
            - "One Variety with base_royalty_cents_per_plant 35 and regional_performance_index 0.00 (no trials, so the performance premium clamps to exactly 1.00)."
            - "One Propagator with an ACTIVE TIER_A PropagatorAgreement licensed for US-WA, countersigned by officer-1."
            - "One ACTIVE ProductionQuota, basis PER_PLANT, territory_class DOMESTIC, allocated_units 20000."
            - "One TagOrder for 12000 units, ISSUED then RECONCILED with activated_units 12000, so quota.tags_activated_units == 12000."
            - "One DRAFT RoyaltyReport for period 2026Q3 carrying exactly one line item with reported_units 9800 - deliberately 2200 units below the tag activations."
            - "Logical clock still at its 2026-08-01T00:00:00Z default, so the report is not late."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Orchard Gold", species: "Malus domestica", breeder_code: "OG", royalty_basis_default: "PER_PLANT", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
            - call: "POST /propagators"
              payload: { legal_name: "Northfield Nursery", home_territory_code: "US-WA" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { p_id: $.data.id }
            - call: "POST /propagator-agreements"
              payload: { propagator_id: "${p_id}", quality_tier: "TIER_A", territory_codes: ["US-WA", "US-OR"], term_start: "2026-08-01T00:00:00Z", term_end: "2027-08-01T00:00:00Z" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { a_id: $.data.id }
            - call: "POST /propagator-agreements/${a_id}/countersign"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-1"
            - call: "POST /production-quotas"
              payload: { agreement_id: "${a_id}", variety_id: "${v_id}", season_code: "2026S1", basis: "PER_PLANT", territory_code: "US-WA", territory_class: "DOMESTIC", allocated_units: 20000 }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { q_id: $.data.id, q_ver: $.data.version }
            - call: "POST /tag-orders"
              payload: { quota_id: "${q_id}", requested_units: 12000, expected_quota_version: "${q_ver}" }
              as: Propagator
              as_user_id: "${p_id}"
              captures: { t_id: $.data.id }
            - call: "POST /tag-orders/${t_id}/issue"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-1"
            - call: "POST /tag-orders/${t_id}/reconcile"
              payload: { activated_units: 12000 }
              as: Propagator
              as_user_id: "${p_id}"
            - call: "POST /royalty-reports"
              payload: { agreement_id: "${a_id}", period_code: "2026Q3", period_start: "2026-08-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z", due_at: "2026-11-15T00:00:00Z" }
              as: Propagator
              as_user_id: "${p_id}"
              captures: { r_id: $.data.id, r_ver: $.data.version }
            - call: "POST /royalty-reports/${r_id}/line-items"
              payload: { quota_id: "${q_id}", reported_units: 9800, expected_report_version: "${r_ver}" }
              as: Propagator
              as_user_id: "${p_id}"
              captures: { li_id: $.data.id }
          trigger:
            - call: "POST /royalty-reports/${r_id}/submit"
              payload: {}
              as: Propagator
              as_user_id: "${p_id}"
            - call: "POST /royalty-reports/${r_id}/accept"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-2"
          assert:
            - "After submit: RoyaltyLineItem.${li_id}.billable_units == 9800"
            - "After submit: RoyaltyLineItem.${li_id}.effective_rate_cents == 40.2500"
            - "After submit: RoyaltyLineItem.${li_id}.provisional_amount_cents == 394450"
            - "After submit: RoyaltyReport.${r_id}.provisional_total_cents == 394450"
            - "After submit: RoyaltyReport.${r_id}.final_total_cents == 0"
            - "After submit: RoyaltyLineItem.${li_id}.overrun_flagged == false"
            - "After accept: RoyaltyLineItem.${li_id}.billable_units == 12000"
            - "After accept: RoyaltyLineItem.${li_id}.effective_rate_cents == 38.2375"
            - "After accept: RoyaltyLineItem.${li_id}.final_amount_cents == 458850"
            - "After accept: RoyaltyReport.${r_id}.final_total_cents == 458850"
            - "After accept: RoyaltyLineItem.${li_id}.overrun_flagged == true"
            - "After accept: RoyaltyReport.${r_id}.provisional_total_cents == 394450 (the reported-basis figure is retained, not overwritten)"
            - "After accept: RoyaltyReport.${r_id}.late_fee_cents == 0 and RoyaltyReport.${r_id}.booked_amount_cents == 458850"
            - "final_total_cents - provisional_total_cents == 64400"

      - name: propagator_compliance_rolling_window_versus_lifetime_divergence
        grounds:
          - calculations.propagator_compliance_score
          - entities.Propagator.fields.compliance_score
          - entities.Propagator.fields.lifetime_compliance_score
          - entities.RoyaltyReport.fields.is_late
          - state_machines.RoyaltyReport.review_status.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          This is the risk-scoring variant pair on a different entity domain -
          the Propagator, not the RoyaltyReport - and it diverges on event AGE
          rather than on quantity: after the clock moves to 2026-12-25 the single
          LATE_REPORT penalty stamped at 2026-08-25 has aged out of the
          120-day rolling window (lower bound exclusive), so compliance_score
          returns to 100 while lifetime_compliance_score stays at 94.
        test_recipe:
          setup:
            - "One Variety, one Propagator, one ACTIVE TIER_B PropagatorAgreement for US-WA, one ACTIVE ProductionQuota with allocated_units 20000 and no tag orders (so tags_activated_units == 0 and no overrun penalty can arise)."
            - "One RoyaltyReport for period 2026M08 with period_end 2026-08-15T00:00:00Z and due_at 2026-08-20T00:00:00Z, carrying one line item with reported_units 5000."
            - "The logical clock is advanced to 2026-08-25T00:00:00Z before submission, so is_late becomes true and submitted_at == 2026-08-25T00:00:00Z."
            - "The report is accepted, materialising exactly one LATE_REPORT penalty event (6 points) dated 2026-08-25T00:00:00Z; both scores read 94."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Cascade Crimson", species: "Malus domestica", breeder_code: "CC", royalty_basis_default: "PER_PLANT", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
            - call: "POST /propagators"
              payload: { legal_name: "Riverbend Propagation", home_territory_code: "US-WA" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { p_id: $.data.id }
            - call: "POST /propagator-agreements"
              payload: { propagator_id: "${p_id}", quality_tier: "TIER_B", territory_codes: ["US-WA"], term_start: "2026-08-01T00:00:00Z", term_end: "2027-08-01T00:00:00Z" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { a_id: $.data.id }
            - call: "POST /propagator-agreements/${a_id}/countersign"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-1"
            - call: "POST /production-quotas"
              payload: { agreement_id: "${a_id}", variety_id: "${v_id}", season_code: "2026S1", basis: "PER_PLANT", territory_code: "US-WA", territory_class: "DOMESTIC", allocated_units: 20000 }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { q_id: $.data.id }
            - call: "POST /royalty-reports"
              payload: { agreement_id: "${a_id}", period_code: "2026M08", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-15T00:00:00Z", due_at: "2026-08-20T00:00:00Z" }
              as: Propagator
              as_user_id: "${p_id}"
              captures: { r_id: $.data.id, r_ver: $.data.version }
            - call: "POST /royalty-reports/${r_id}/line-items"
              payload: { quota_id: "${q_id}", reported_units: 5000, expected_report_version: "${r_ver}" }
              as: Propagator
              as_user_id: "${p_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00Z" }
              as: LicensingOfficer
              as_user_id: "officer-1"
            - call: "POST /royalty-reports/${r_id}/submit"
              payload: {}
              as: Propagator
              as_user_id: "${p_id}"
            - call: "POST /royalty-reports/${r_id}/accept"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-2"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-25T00:00:00Z" }
              as: LicensingOfficer
              as_user_id: "officer-1"
          assert:
            - "Before the trigger: Propagator.${p_id}.compliance_score == 94"
            - "Before the trigger: Propagator.${p_id}.lifetime_compliance_score == 94"
            - "Before the trigger: RoyaltyReport.${r_id}.is_late == true"
            - "After the trigger: Propagator.${p_id}.compliance_score == 100"
            - "After the trigger: Propagator.${p_id}.lifetime_compliance_score == 94"
            - "After the trigger: PropagatorAgreement.${a_id}.status == ACTIVE (a score recovery never reinstates and never suspends)"

  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: effective_rate_five_factor_product_clamped_by_upper_collar
        grounds:
          - calculations.effective_royalty_rate
          - calculations.trial_performance_index
          - entities.Variety.fields.regional_performance_index
          - entities.RoyaltyLineItem.fields.effective_rate_cents
          - state_machines.VarietyTrial.status.EVALUATED_to_PASSED
        distinguishing_aspect: |
          Mode (a): effective_royalty_rate multiplies five state-dependent
          factors (base rate by quota.basis, quality-tier multiplier,
          territory-class multiplier, volume band, and a performance premium
          that is itself a nested min(0.10, max(0.00, ...))) and then applies an
          outer min/max collar - so the honest product 53.5828 is clamped to
          exactly 52.5000 by RATE_CAP_FACTOR, a value no single factor predicts.
        test_recipe:
          setup:
            - "One Variety with base_royalty_cents_per_plant 35 whose regional_performance_index has been driven to exactly 78.50 by two PASSED trials in distinct regions (85.00 at region PNW and 72.00 at region CAV)."
            - "One Propagator with an ACTIVE TIER_A PropagatorAgreement licensed for US-WA."
            - "One ACTIVE ProductionQuota with basis PER_PLANT and territory_class EXPORT, allocated_units 20000, no tag orders."
            - "One DRAFT RoyaltyReport with a single line item of reported_units 8000, which keeps the volume band at 1.00."
            - "Logical clock advanced to 2026-09-20T00:00:00Z during the trial chain."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Summit Pearl", species: "Pyrus communis", breeder_code: "SP", royalty_basis_default: "PER_PLANT", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
            - call: "POST /trial-sites"
              payload: { site_name: "Yakima Station", region_code: "PNW", plot_capacity: 100 }
              as: TrialCoordinator
              as_user_id: "coord-1"
              captures: { s1_id: $.data.id }
            - call: "POST /trial-sites"
              payload: { site_name: "Fresno Station", region_code: "CAV", plot_capacity: 100 }
              as: TrialCoordinator
              as_user_id: "coord-1"
              captures: { s2_id: $.data.id }
            - call: "POST /variety-trials"
              payload: { variety_id: "${v_id}", trial_site_id: "${s1_id}", plot_count: 20, plant_date: "2026-08-05T00:00:00Z", harvest_date: "2026-09-20T00:00:00Z" }
              as: TrialCoordinator
              as_user_id: "coord-1"
              captures: { tr1_id: $.data.id }
            - call: "POST /variety-trials"
              payload: { variety_id: "${v_id}", trial_site_id: "${s2_id}", plot_count: 20, plant_date: "2026-08-05T00:00:00Z", harvest_date: "2026-09-20T00:00:00Z" }
              as: TrialCoordinator
              as_user_id: "coord-1"
              captures: { tr2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: TrialCoordinator
              as_user_id: "coord-1"
            - call: "POST /variety-trials/${tr1_id}/plant"
              payload: {}
              as: TrialCoordinator
              as_user_id: "coord-1"
            - call: "POST /variety-trials/${tr2_id}/plant"
              payload: {}
              as: TrialCoordinator
              as_user_id: "coord-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T00:00:00Z" }
              as: TrialCoordinator
              as_user_id: "coord-1"
            - call: "POST /variety-trials/${tr1_id}/evaluate"
              payload: { yield_index: 90, vigor_score: 84, uniformity_score: 86, disease_resistance_score: 75, propagation_pass_rate: 1.0000 }
              as: TrialCoordinator
              as_user_id: "coord-1"
            - call: "POST /variety-trials/${tr2_id}/evaluate"
              payload: { yield_index: 76, vigor_score: 70, uniformity_score: 72, disease_resistance_score: 66, propagation_pass_rate: 1.0000 }
              as: TrialCoordinator
              as_user_id: "coord-1"
            - call: "POST /variety-trials/${tr1_id}/certify"
              payload: {}
              as: BreederAdmin
              as_user_id: "breeder-1"
            - call: "POST /variety-trials/${tr2_id}/certify"
              payload: {}
              as: BreederAdmin
              as_user_id: "breeder-1"
            - call: "POST /propagators"
              payload: { legal_name: "Coast Range Growers", home_territory_code: "US-WA" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { p_id: $.data.id }
            - call: "POST /propagator-agreements"
              payload: { propagator_id: "${p_id}", quality_tier: "TIER_A", territory_codes: ["US-WA"], term_start: "2026-08-01T00:00:00Z", term_end: "2027-08-01T00:00:00Z" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { a_id: $.data.id }
            - call: "POST /propagator-agreements/${a_id}/countersign"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-1"
            - call: "POST /production-quotas"
              payload: { agreement_id: "${a_id}", variety_id: "${v_id}", season_code: "2026S1", basis: "PER_PLANT", territory_code: "US-WA", territory_class: "EXPORT", allocated_units: 20000 }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { q_id: $.data.id }
            - call: "POST /royalty-reports"
              payload: { agreement_id: "${a_id}", period_code: "2026Q3", period_start: "2026-08-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z", due_at: "2026-11-15T00:00:00Z" }
              as: Propagator
              as_user_id: "${p_id}"
              captures: { r_id: $.data.id, r_ver: $.data.version }
            - call: "POST /royalty-reports/${r_id}/line-items"
              payload: { quota_id: "${q_id}", reported_units: 8000, expected_report_version: "${r_ver}" }
              as: Propagator
              as_user_id: "${p_id}"
              captures: { li_id: $.data.id }
          trigger:
            - call: "POST /royalty-reports/${r_id}/submit"
              payload: {}
              as: Propagator
              as_user_id: "${p_id}"
          assert:
            - "VarietyTrial.${tr1_id}.performance_index == 85.00"
            - "VarietyTrial.${tr2_id}.performance_index == 72.00"
            - "Variety.${v_id}.passed_trial_region_count == 2"
            - "Variety.${v_id}.regional_performance_index == 78.50"
            - "Variety.${v_id}.lifecycle_state == TRIAL_COMPLETE"
            - "RoyaltyLineItem.${li_id}.effective_rate_cents == 52.5000 (the uncollared product would have been 53.5828)"
            - "RoyaltyLineItem.${li_id}.provisional_amount_cents == 420000 (an uncollared rate would have produced 428662)"
            - "RoyaltyReport.${r_id}.provisional_total_cents == 420000"

      - name: royalty_total_rounds_per_line_before_summing
        grounds:
          - calculations.royalty_report_totals
          - calculations.effective_royalty_rate
          - entities.RoyaltyLineItem.fields.provisional_amount_cents
          - entities.RoyaltyReport.fields.provisional_total_cents
        distinguishing_aspect: |
          Mode (b): the pinned per-line-then-sum rounding order is observable.
          At effective_rate_cents 37.1875 with two lines of 2 reported units
          each, every line rounds 74.375 down to 74 and the report total is 148;
          the forbidden sum-then-round order would have produced 149, so a
          one-cent difference falsifies the wrong order.
        test_recipe:
          setup:
            - "One Variety with base_royalty_cents_per_plant 35 and regional_performance_index 0.00 (no trials)."
            - "One Propagator with an ACTIVE TIER_C PropagatorAgreement for US-WA."
            - "Two ACTIVE ProductionQuotas of the same variety under that agreement, season_code 2026S1 and 2026S2, both basis PER_PLANT and territory_class EXPORT, so effective_rate_cents is 35 x 0.85 x 1.25 x 1.00 x 1.00 == 37.1875 on both."
            - "One DRAFT RoyaltyReport carrying one line item per quota, each with reported_units 2."
            - "Logical clock still at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Basalt Ruby", species: "Vitis vinifera", breeder_code: "BR", royalty_basis_default: "PER_PLANT", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
            - call: "POST /propagators"
              payload: { legal_name: "Sagebrush Vines", home_territory_code: "US-WA" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { p_id: $.data.id }
            - call: "POST /propagator-agreements"
              payload: { propagator_id: "${p_id}", quality_tier: "TIER_C", territory_codes: ["US-WA"], term_start: "2026-08-01T00:00:00Z", term_end: "2027-08-01T00:00:00Z" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { a_id: $.data.id }
            - call: "POST /propagator-agreements/${a_id}/countersign"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-1"
            - call: "POST /production-quotas"
              payload: { agreement_id: "${a_id}", variety_id: "${v_id}", season_code: "2026S1", basis: "PER_PLANT", territory_code: "US-WA", territory_class: "EXPORT", allocated_units: 5000 }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { q1_id: $.data.id }
            - call: "POST /production-quotas"
              payload: { agreement_id: "${a_id}", variety_id: "${v_id}", season_code: "2026S2", basis: "PER_PLANT", territory_code: "US-WA", territory_class: "EXPORT", allocated_units: 5000 }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { q2_id: $.data.id }
            - call: "POST /royalty-reports"
              payload: { agreement_id: "${a_id}", period_code: "2026Q3", period_start: "2026-08-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z", due_at: "2026-11-15T00:00:00Z" }
              as: Propagator
              as_user_id: "${p_id}"
              captures: { r_id: $.data.id, r_ver1: $.data.version }
            - call: "POST /royalty-reports/${r_id}/line-items"
              payload: { quota_id: "${q1_id}", reported_units: 2, expected_report_version: "${r_ver1}" }
              as: Propagator
              as_user_id: "${p_id}"
              captures: { li1_id: $.data.id }
            - call: "GET /royalty-reports/${r_id}"
              payload: {}
              as: Propagator
              as_user_id: "${p_id}"
              captures: { r_ver2: $.data.version }
            - call: "POST /royalty-reports/${r_id}/line-items"
              payload: { quota_id: "${q2_id}", reported_units: 2, expected_report_version: "${r_ver2}" }
              as: Propagator
              as_user_id: "${p_id}"
              captures: { li2_id: $.data.id }
          trigger:
            - call: "POST /royalty-reports/${r_id}/submit"
              payload: {}
              as: Propagator
              as_user_id: "${p_id}"
          assert:
            - "RoyaltyLineItem.${li1_id}.effective_rate_cents == 37.1875"
            - "RoyaltyLineItem.${li2_id}.effective_rate_cents == 37.1875"
            - "RoyaltyLineItem.${li1_id}.provisional_amount_cents == 74"
            - "RoyaltyLineItem.${li2_id}.provisional_amount_cents == 74"
            - "RoyaltyReport.${r_id}.provisional_total_cents == 148 (sum-then-round would have produced 149)"

      - name: annuity_volume_credit_tier_keyed_on_pre_credit_total
        grounds:
          - calculations.annuity_total_due
          - entities.ProtectionFiling.fields.annuity_surcharge_cents
          - entities.ProtectionFiling.fields.annuity_volume_credit_cents
          - entities.ProtectionFiling.fields.annuity_total_due_cents
          - validations[priority=38]
          - state_machines.ProtectionFiling.status.MAINTENANCE_DUE_to_GRANTED
        distinguishing_aspect: |
          Mode (c): the credit tier looks circular because the credit is part of
          the amount due, and the scaffold pins it to the PRE-credit total. With
          annuity_base_cents 481000 and 5 days late the surcharge 24050 lifts
          pre_credit_total to 505050, crossing the 500000 boundary into the 6%
          band, so annuity_total_due_cents is 474747; keying the tier on the
          post-credit figure would have landed in the 3% band at 489898.
        test_recipe:
          setup:
