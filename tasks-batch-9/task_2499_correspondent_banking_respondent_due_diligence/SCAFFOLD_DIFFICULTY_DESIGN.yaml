          assert:
            - "trigger HTTP status == 200"
            - "JurisdictionProfile[PK].jurisdiction_risk_points == 40.00   # min(40.00, 8+12+3+10.0*2.0=43)"
            - "NestedRelationship.${nest_deep}.depth == 2 and NestedRelationship.${nest_deep}.state == UNDISCLOSED_DETECTED"
            - "RespondentBank.${r1_id}.max_nested_depth == 2"
            - "RespondentBank.${r1_id}.undisclosed_nested_count == 3"
