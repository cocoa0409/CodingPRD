              payload: { dealer_id: "${dlr_a_id}", trailer_type: "STEP_DECK", allocation_basis: "CUBE", yard_window_start: "2026-08-10T08:00:00Z", yard_window_end: "2026-08-12T17:00:00Z", expected_dealer_version: "${dlr_v0}" }
