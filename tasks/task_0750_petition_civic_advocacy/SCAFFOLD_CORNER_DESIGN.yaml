  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_petitions_pagination_envelope
        claim_type: Listing
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /petitions?limit=1&offset=0 returns a paginated array response with meta pagination fields limit/offset/total_count/has_more."
        test_recipe:
          setup: ["Two DRAFT petitions exist by the same author."]
          setup_api_calls:
            - { call: "POST /users", payload: { email: "pg_a@x.com", full_name: "A", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "P1", summary: "s", body: "b", category: "OTHER", goal: 10 }, as: Member, as_user_id: "${author_id}" }
            - { call: "POST /petitions", payload: { title: "P2", summary: "s", body: "b", category: "OTHER", goal: 10 }, as: Member, as_user_id: "${author_id}" }
          trigger:
            - { call: "GET /petitions", payload: { author_user_id: "${author_id}", limit: 1, offset: 0 }, as: Guest }
          assert:
            - "response has_more == true"
            - "response total_count == 2"
            - "data array length == 1"

      - name: representative_lookup_by_jurisdiction
        claim_type: Retrieval
        grounds: [entities.Representative.fields.jurisdiction, endpoints]
        distinguishing_aspect: "After Admin adds a representative in US-CA-12, GET /representatives?jurisdiction=US-CA-12 returns that entry (representative lookup)."
        test_recipe:
          setup: ["Admin has added a representative for US-CA-12."]
          setup_api_calls:
            - { call: "POST /representatives", payload: { full_name: "Jane Rep", office: "Assembly", jurisdiction: "US-CA-12", contact_email: "jane@gov" }, as: Admin, captures: { rep_id: "$.data.id" } }
          trigger:
            - { call: "GET /representatives", payload: { jurisdiction: "US-CA-12" }, as: Guest }
          assert:
            - "data array contains representative ${rep_id}"
            - "Representative.${rep_id}.jurisdiction == US-CA-12"

      - name: update_deliver_sets_delivered_flag
        claim_type: Action endpoint
        grounds: [entities.Comment.fields.delivered, endpoints]
        distinguishing_aspect: "POST /comments/{id}/deliver on an author's APPROVED UPDATE sets delivered=true."
        test_recipe:
          setup: ["PUBLISHED petition with an author-posted UPDATE (APPROVED)."]
          setup_api_calls:
            - { call: "POST /users", payload: { email: "dl_a@x.com", full_name: "A", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "Dl", summary: "s", body: "b", category: "OTHER", goal: 10 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id", pet_v: "$.data.version" } }
            - { call: "POST /petitions/${pet_id}/target", payload: { name: "T", title: "T", office: "O", expected_petition_version: "${pet_v}" }, as: Member, as_user_id: "${author_id}", captures: { target_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/submit", payload: {}, as: Member, as_user_id: "${author_id}" }
            - { call: "POST /petitions/${pet_id}/moderate", payload: { decision: "APPROVE" }, as: Moderator }
            - { call: "POST /petitions/${pet_id}/comments", payload: { body: "we won a hearing", comment_type: "UPDATE" }, as: Member, as_user_id: "${author_id}", captures: { upd_id: "$.data.id" } }
          trigger:
            - { call: "POST /comments/${upd_id}/deliver", payload: {}, as: Member, as_user_id: "${author_id}", captures: { dv: "$.data.delivered" } }
          assert:
            - "Comment.${upd_id}.delivered == true"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_target_supersede_success_bumps_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[target-supersede-stale-petition]", state_machines.Target.ACTIVE_to_SUPERSEDED, entities.Petition.fields.version]
        distinguishing_aspect: "Setting a second target with the current expected_petition_version succeeds: the prior Target becomes SUPERSEDED, the new one is ACTIVE, and Petition.version advances from 2 to 3."
        test_recipe:
          setup: ["A petition (version 1) with one ACTIVE target already set (which advanced version to 2)."]
          setup_api_calls:
            - { call: "POST /users", payload: { email: "os_a@x.com", full_name: "A", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "Os", summary: "s", body: "b", category: "OTHER", goal: 10 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id", pet_v: "$.data.version" } }
            - { call: "POST /petitions/${pet_id}/target", payload: { name: "T1", title: "T", office: "O", expected_petition_version: "${pet_v}" }, as: Member, as_user_id: "${author_id}", captures: { target1_id: "$.data.id" } }
            - { call: "GET /petitions/${pet_id}", payload: {}, as: Member, as_user_id: "${author_id}", captures: { pet_v2: "$.data.version" } }
          trigger:
            - { call: "POST /petitions/${pet_id}/target", payload: { name: "T2", title: "T", office: "O", expected_petition_version: "${pet_v2}" }, as: Member, as_user_id: "${author_id}", captures: { target2_id: "$.data.id" } }
          assert:
            - "Target.${target1_id}.status == SUPERSEDED"
            - "Target.${target2_id}.status == ACTIVE"
            - "Petition.${pet_id}.version == 3"

      - name: occ_target_supersede_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[target-supersede-stale-petition]", "errors[ERR_STALE_PETITION_VERSION]"]
        distinguishing_aspect: "A second target-set carrying the original expected_petition_version (1, stale after the first set advanced it to 2) is rejected with ERR_STALE_PETITION_VERSION (412)."
        test_recipe:
          setup: ["A petition (version 1) with one ACTIVE target already set (version now 2)."]
          setup_api_calls:
            - { call: "POST /users", payload: { email: "ost_a@x.com", full_name: "A", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "Ost", summary: "s", body: "b", category: "OTHER", goal: 10 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id", pet_v: "$.data.version" } }
            - { call: "POST /petitions/${pet_id}/target", payload: { name: "T1", title: "T", office: "O", expected_petition_version: "${pet_v}" }, as: Member, as_user_id: "${author_id}", captures: { target1_id: "$.data.id" } }
          trigger:
            - { call: "POST /petitions/${pet_id}/target", payload: { name: "T2", title: "T", office: "O", expected_petition_version: "${pet_v}" }, as: Member, as_user_id: "${author_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_STALE_PETITION_VERSION"
            - "HTTP status == 412"

      - name: derived_pending_count_increments_on_sign
        claim_type: derived_field_reconciliation
        grounds: [entities.Petition.fields.pending_signature_count, state_machines.Signature.PENDING_VERIFICATION_to_VERIFIED]
        distinguishing_aspect: "Creating a signature (PENDING) increments Petition.pending_signature_count to 1; verifying it moves it to verified and pending returns to 0 (derived counts stay reconciled)."
        test_recipe:
          setup: ["PUBLISHED petition; one signer signs (PENDING)."]
          setup_api_calls:
            - { call: "POST /users", payload: { email: "df_a@x.com", full_name: "A", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "Df", summary: "s", body: "b", category: "OTHER", goal: 10 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id", pet_v: "$.data.version" } }
            - { call: "POST /petitions/${pet_id}/target", payload: { name: "T", title: "T", office: "O", expected_petition_version: "${pet_v}" }, as: Member, as_user_id: "${author_id}", captures: { target_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/submit", payload: {}, as: Member, as_user_id: "${author_id}" }
            - { call: "POST /petitions/${pet_id}/moderate", payload: { decision: "APPROVE" }, as: Moderator }
            - { call: "POST /users", payload: { email: "df_s@x.com", full_name: "S", jurisdiction: "US-CA-12" }, as: Guest, captures: { signer_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/signatures", payload: {}, as: Member, as_user_id: "${signer_id}", captures: { sig_id: "$.data.id", tok: "$.data.verification_token" } }
          trigger:
            - { call: "GET /petitions/${pet_id}", payload: {}, as: Guest, captures: { pend: "$.data.pending_signature_count" } }
          assert:
            - "Petition.${pet_id}.pending_signature_count == 1"
            - "Petition.${pet_id}.verified_signature_count == 0"

