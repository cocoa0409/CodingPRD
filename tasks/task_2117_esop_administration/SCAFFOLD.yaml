    roles: [PlanSponsor, Trustee, PlanAdministrator, Appraiser, Participant]
    code: 200
    input: []
    output: ParticipantStatement
    side_effects: []

  - method: GET
    path: "/participant-statements"
    description: "List statements, filterable by participant, run, plan year and delivery status. Sole discovery channel for these cascade-created rows. Results are ordered by created_at ascending."
    roles: [PlanSponsor, Trustee, PlanAdministrator, Appraiser, Participant]
    code: 200
    input: ["participant_id?", "allocation_run_id?", "plan_year?", "delivery_status?", "limit?", "offset?"]
    output: ParticipantStatement[]
    side_effects: []

  - method: POST
    path: "/participant-statements/{statement_id}/deliver"
    description: "Mark a statement as communicated to the participant."
    roles: [PlanAdministrator]
    code: 200
    input: [delivery_channel]
    output: ParticipantStatement
    side_effects: ["delivery_status GENERATED -> DELIVERED", "delivery_channel recorded; no numeric snapshot field changes"]

  # ------------------------------------------------------------ logical clock
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint. Sets the server's logical clock, which every date-sensitive rule reads. The clock starts at 2026-08-01T00:00:00Z on server startup and never falls back to wall-clock time."
    roles: [PlanSponsor, Trustee, PlanAdministrator, Appraiser, Participant]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["The logical clock is repositioned. No entity is mutated and no version is incremented."]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID is missing, or X-User-Role names a role outside the RBAC matrix."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The authenticated role is not listed in the endpoint's roles."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "A Participant acts on a resource whose owning participant_id differs from X-User-ID."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The trustee approving a valuation is the appraiser who submitted it, or the administrator finalizing an allocation run is the one who created it."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required field is absent, a field carries the wrong type, an enum value is undeclared, a numeric field falls outside its declared range, a date does not parse, effective_to_date is not strictly after effective_from_date, or a pagination parameter is out of bounds."
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "No EsopPlan matches the plan_id in the path or body."
  - id: ERR_PARTICIPANT_NOT_FOUND
    http: 404
    condition: "No Participant matches the participant_id in the path or body."
  - id: ERR_VALUATION_NOT_FOUND
    http: 404
    condition: "No Valuation matches the valuation_id in the path or body, or supersedes_valuation_id names nothing."
  - id: ERR_LOAN_NOT_FOUND
    http: 404
    condition: "No EsopLoan matches the loan_id in the path or body."
  - id: ERR_LOAN_PAYMENT_NOT_FOUND
    http: 404
    condition: "No LoanPayment matches the payment_id in the path."
  - id: ERR_RUN_NOT_FOUND
    http: 404
    condition: "No AllocationRun matches the run_id in the path."
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "No ShareAllocation matches the allocation_id in the path."
  - id: ERR_FORFEITURE_NOT_FOUND
    http: 404
    condition: "No ForfeitureEvent matches the forfeiture_id in the path."
  - id: ERR_ELECTION_NOT_FOUND
    http: 404
    condition: "No DistributionElection matches the election_id in the path or body."
  - id: ERR_INSTALLMENT_NOT_FOUND
    http: 404
    condition: "No InstallmentPayment matches the installment_id in the path."
  - id: ERR_EXERCISE_NOT_FOUND
    http: 404
    condition: "No PutOptionExercise matches the exercise_id in the path."
  - id: ERR_STATEMENT_NOT_FOUND
    http: 404
    condition: "No ParticipantStatement matches the statement_id in the path."
  - id: ERR_PLAN_FROZEN
    http: 409
    condition: "A mutating operation is attempted against a plan whose plan_status is FROZEN."
  - id: ERR_PLAN_STATE_INVALID
    http: 409
    condition: "The plan is not in the plan_status the operation requires - enrolling into a closed year, approving a valuation outside VALUATION_PENDING, finalizing outside VALUATION_PENDING, or rolling over outside ALLOCATION_LOCKED."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource is not in a state from which the requested transition is declared, including every repeat of an already-applied action."
  - id: ERR_STALE_PLAN_VERSION
    http: 412
    condition: "expected_plan_version does not equal the plan's current version."
  - id: ERR_NO_APPROVED_VALUATION
    http: 409
    condition: "An allocation run is finalized against a valuation that is not APPROVED, a priced participant operation runs while current_share_price_cents is 0, or a second valuation is approved for a plan_year that already has an APPROVED one."
  - id: ERR_ENTITY_MISMATCH
    http: 409
    condition: "At finalize, the run's valuation belongs to another plan, or run.plan_year, valuation.plan_year and plan.plan_year do not all agree."
  - id: ERR_CHALLENGE_ROUNDS_EXHAUSTED
    http: 409
    condition: "A valuation is challenged when challenge_round has already reached MAX_CHALLENGE_ROUNDS."
  - id: ERR_VALUATION_PERIOD_OVERLAP
    http: 409
    condition: "A new valuation's half-open coverage interval intersects that of another SUBMITTED, CHALLENGED or APPROVED valuation of the same plan. Touching endpoints do not trigger it."
  - id: ERR_PUT_WINDOW_BUFFER_VIOLATION
    http: 409
    condition: "An installment payment would open a put option window before the participant's previous window has been closed for PUT_WINDOW_COOLING_DAYS."
  - id: ERR_PUT_WINDOW_CLOSED
    http: 422
    condition: "A put option exercise is raised or funded outside the closed interval [window_open_date, window_close_date], or the participant has no window at all."
  - id: ERR_INSTALLMENT_NOT_DUE
    http: 422
    condition: "An installment is paid before its scheduled_date, or while an earlier installment of the same election is still SCHEDULED."
  - id: ERR_DIVERSIFICATION_WINDOW_CLOSED
    http: 422
    condition: "The plan year falls outside the participant's six-year qualified election period."
  - id: ERR_DUPLICATE_EMPLOYEE_NUMBER
    http: 409
    condition: "Another participant of the same plan already carries this employee_number."
  - id: ERR_ELECTION_NOT_PERMITTED
    http: 422
    condition: "The participant's status does not permit this election_type."
  - id: ERR_RETIREMENT_AGE_NOT_ATTAINED
    http: 422
    condition: "A termination is recorded with reason RETIREMENT before the participant reaches plan.normal_retirement_age."
  - id: ERR_NO_ELIGIBLE_PARTICIPANTS
    http: 422
    condition: "A finalize finds no ACTIVE participant of the plan with eligible_compensation_cents greater than 0."
  - id: ERR_INSUFFICIENT_SHARES
    http: 422
    condition: "requested_shares exceeds the participant's vested_shares, or shares_tendered exceeds the participant's undelivered-to-put balance."
  - id: ERR_DIVERSIFICATION_LIMIT_EXCEEDED
    http: 422
    condition: "A diversification election's requested_shares exceeds the cumulative cap for the current qualified-period year."
  - id: ERR_FORFEITURE_SWEEP_REQUIRED
    http: 409
    condition: "A rollover is attempted while forfeiture_posture is SWEEP_REQUIRED."
  - id: ERR_ANNUAL_ADDITIONS_EXCEEDED
    http: 422
    condition: "annual_additions_cap_reallocation leaves a non-zero residue on a plan configured with forfeiture_policy REDUCE_CONTRIBUTION."
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "A loan payment's principal or interest component exceeds the loan's corresponding remaining balance."
  - id: ERR_INSUFFICIENT_REPURCHASE_RESERVE
    http: 402
    condition: "A direct fund call asks for more cash than repurchase_reserve_cents holds."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlanSponsor
    description: "The employer. Owns the census and the leveraged borrowing, and drives the plan-year clock."
    identity: opaque
    exclusive_operations:
      - "POST /plans"
      - "POST /plans/{plan_id}/close-year"
      - "POST /plans/{plan_id}/rollover"
      - "POST /participants"
      - "PATCH /participants/{participant_id}"
      - "POST /participants/{participant_id}/terminate"
      - "POST /esop-loans"
    shared_operations:
      - "every GET except GET /plans/{plan_id}/repurchase-forecast, which it shares with Trustee and PlanAdministrator"
      - "POST /_clock/set_current_utc"

  - name: Appraiser
    description: "Independent valuation professional. Produces appraisals and revises them when challenged, but is barred from approving anything."
    identity: opaque
    exclusive_operations:
      - "POST /valuations"
      - "POST /valuations/{valuation_id}/resubmit"
    shared_operations:
      - "every GET except GET /plans/{plan_id}/repurchase-forecast"
      - "POST /_clock/set_current_utc"

  - name: Trustee
    description: "ESOP trustee and fiduciary. Adjudicates appraisals, controls repurchase cash, and holds the void power over finalized allocations."
    identity: opaque
    exclusive_operations:
      - "POST /valuations/{valuation_id}/challenge"
      - "POST /valuations/{valuation_id}/approve"
      - "POST /valuations/{valuation_id}/reject"
      - "POST /plans/{plan_id}/freeze"
      - "POST /plans/{plan_id}/repurchase-funding"
      - "POST /plans/{plan_id}/repurchase-sweeps"
      - "POST /allocation-runs/{run_id}/void"
      - "POST /put-option-exercises/{exercise_id}/fund"
      - "POST /put-option-exercises/{exercise_id}/settle"
    shared_operations:
      - "POST /put-option-exercises/{exercise_id}/cancel, shared with Participant"
      - "GET /plans/{plan_id}/repurchase-forecast, shared with PlanSponsor and PlanAdministrator"
      - "every other GET"
      - "POST /_clock/set_current_utc"
    note: "Segregation of duties: a Trustee whose X-User-ID equals a valuation's appraiser_user_id cannot approve that valuation."

  - name: PlanAdministrator
    description: "Third-party administrator. Runs the mechanics - loan servicing, allocation, distributions and statements."
    identity: opaque
    exclusive_operations:
      - "POST /loan-payments"
      - "POST /allocation-runs"
      - "POST /allocation-runs/{run_id}/finalize"
      - "POST /distribution-elections/{election_id}/commence"
      - "POST /installment-payments/{installment_id}/pay"
      - "POST /participant-statements/{statement_id}/deliver"
    shared_operations:
      - "POST /distribution-elections, shared with Participant"
      - "GET /plans/{plan_id}/repurchase-forecast, shared with PlanSponsor and Trustee"
      - "every other GET"
      - "POST /_clock/set_current_utc"
    note: "Segregation of duties: the administrator whose X-User-ID created an AllocationRun cannot finalize it."

  - name: Participant
    description: "An employee-owner. Raises elections against their own account and exercises the put option."
    identity: "entity_backed:Participant"
    exclusive_operations:
      - "POST /put-option-exercises"
    shared_operations:
      - "POST /distribution-elections, shared with PlanAdministrator"
      - "POST /put-option-exercises/{exercise_id}/cancel, shared with Trustee"
      - "every GET except GET /plans/{plan_id}/repurchase-forecast"
