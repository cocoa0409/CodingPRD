        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_hold_cooldown_beats_temporal_inverted_window
          rationale: "The safety-versus-temporal ordering, including the ERR_INVALID_WINDOW loser, is asserted by that difficulty instance."

      - name: unknown_trace_hit_and_unknown_run_return_their_own_not_found_errors
