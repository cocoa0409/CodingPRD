            - "trigger[1] http_status == 200"
            - "trigger[1] response.data.status == \"SEALED\""
            - "trigger[1] response.data.sealing_license_id == \"${lic_tova}\""
            - "trigger[1] response.data.seal_affixed_at == \"2026-08-01T00:00:00.000Z\""
