  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: service_line_inventory_axis_advances_while_replacement_axis_holds_in_program
        grounds:
          - state_machines.ServiceLine.inventory_state.CLASSIFIED_PROVISIONAL_to_CLASSIFIED_VERIFIED
          - state_machines.ServiceLine.replacement_state.ELIGIBLE_to_IN_PROGRAM
          - entities.ServiceLine.fields.inventory_state
          - entities.ServiceLine.fields.replacement_state
          - calculations.service_line_certainty_score
        distinguishing_aspect: |
          ServiceLine carries two parallel state dimensions on the same row:
          inventory_state advances CLASSIFIED_PROVISIONAL -> CLASSIFIED_VERIFIED purely
          from evidence while replacement_state stays pinned at IN_PROGRESS-side value
          IN_PROGRAM, and neither transition is a precondition of the other. The
          classification value is deliberately unchanged (LEAD before and after), so
          WaterSystem.inventory_status must remain PUBLISHED.
        test_recipe:
          setup:
            - "WaterSystem with a PUBLISHED inventory and one LEAD ServiceLine 101 Elm St outside any disadvantaged tract."
            - "A ReplacementOrder on that line has already driven replacement_state ELIGIBLE -> IN_PROGRAM; the order itself is still DRAFT / NOT_REQUESTED."
            - "The line already holds HISTORIC_RECORD/UTILITY/LEAD and POTHOLE/UTILITY/LEAD, so field evidence exists on the UTILITY side only and inventory_state is CLASSIFIED_PROVISIONAL."
          setup_api_calls:
            - call: "POST /lsl/water-systems"
              payload: { pwsid: "IL2031006", system_name: "Kestrel Ridge Water", compliance_deadline_date: "2027-10-16", baseline_lead_and_grr_count: 100, disadvantaged_tract_codes: [], funding_mode: "WATERFALL" }
