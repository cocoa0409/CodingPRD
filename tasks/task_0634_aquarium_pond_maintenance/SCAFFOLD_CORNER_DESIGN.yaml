              as: Dispatcher
              captures: { vid: $.data.id }
            - call: "POST /aquatics/visits/${vid}/start"
              payload: {}
              as: FieldTech
              as_user_id: "tech-1"
            - call: "POST /aquatics/visits/${vid}/complete"
              payload: { labor_minutes: 30 }
              as: FieldTech
              as_user_id: "tech-1"
              captures: { inv: $.data.invoice_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: AccountManager
          trigger:
            - call: "POST /aquatics/invoices/${inv}/flag-overdue"
              payload: {}
              as: AccountManager
              captures: { st: $.data.status }
            - call: "GET /aquatics/contracts/${cid}"
