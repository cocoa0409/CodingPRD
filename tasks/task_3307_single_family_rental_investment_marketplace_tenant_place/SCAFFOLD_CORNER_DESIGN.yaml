# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# SFR Investment Marketplace (task_3307)
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_listing_portfolio_requires_bulk_price
        claim_type: required_fields
        grounds:
          - entities.Listing.fields.bulk_price_cents
          - validations[priority=6]
        distinguishing_aspect: "PORTFOLIO listing without bulk_price_cents is rejected with ERR_VALIDATION (422); with it, creation succeeds and yield uses bulk basis."
        test_recipe:
          setup: ["Seller S registered"]
          setup_api_calls:
            - call: "POST /marketplace/sellers"
              payload: { legal_name: "Bulk Seller", seller_state: "TX", seller_type: "LLC" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /marketplace/listings"
              payload: { seller_id: "${s_id}", address_line: "1 Bulk Way", listing_state: "TX", asking_price_cents: 50000000, listing_kind: "PORTFOLIO", seller_asks_confidential: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION"

      - name: create_listing_applies_confidential_default
        claim_type: defaults
        grounds:
          - entities.Listing.fields.seller_asks_confidential
        distinguishing_aspect: "Omitting seller_asks_confidential defaults it to false; the created Listing reports seller_asks_confidential == false."
        test_recipe:
          setup: ["Seller S registered"]
          setup_api_calls:
            - call: "POST /marketplace/sellers"
              payload: { legal_name: "Default Seller", seller_state: "TX", seller_type: "INDIVIDUAL" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /marketplace/listings"
              payload: { seller_id: "${s_id}", address_line: "2 Default Dr", listing_state: "TX", asking_price_cents: 10000000, listing_kind: "SINGLE" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l_id: $.data.id }
          assert:
            - "Listing.${l_id}.seller_asks_confidential == false"
            - "Listing.${l_id}.status == DRAFT"

      - name: payment_record_computed_late_ignores_input
        claim_type: computed_fields
        grounds:
          - entities.PaymentRecord.fields.late
          - calculations.late_flag
        distinguishing_aspect: "late is computed: a payment 10 days past due flips late=true even though the client never sends it; common_fields false means no version on PaymentRecord."
        test_recipe:
          setup: ["Seller S, listing L, lease LE"]
          setup_api_calls:
            - call: "POST /marketplace/sellers"
              payload: { legal_name: "Comp Seller", seller_state: "TX", seller_type: "LLC" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /marketplace/listings"
              payload: { seller_id: "${s_id}", address_line: "3 Computed Ct", listing_state: "TX", asking_price_cents: 10000000, listing_kind: "SINGLE", seller_asks_confidential: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l_id: $.data.id }
            - call: "POST /marketplace/listings/${l_id}/leases"
              payload: { tenant_alias: "T-C", monthly_rent_cents: 100000, lease_start: "2026-01-01T00:00:00Z", lease_end: "2027-01-01T00:00:00Z", deposit_cents: 0 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { le: $.data.id }
          trigger:
            - call: "POST /marketplace/leases/${le}/payment-records"
              payload: { due_date: "2026-01-01T00:00:00Z", paid_date: "2026-01-11T00:00:00Z", amount_cents: 100000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { pr: $.data.id }
          assert:
            - "PaymentRecord.${pr}.late == true (10 days > 5-day grace)"
            - "PaymentRecord.${pr} has no version field (common_fields: false)"

      - name: get_listing_not_found_returns_404
        claim_type: not_found
        grounds:
          - validations[priority=3, errors[ERR_NOT_FOUND]]
        distinguishing_aspect: "GET on a random UUID yields ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /marketplace/listings/00000000-0000-0000-0000-000000000000"
              as: PlatformAdmin
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: listing_certified_cannot_resubmit
        claim_type: invalid_transition
        grounds:
          - state_machines.Listing.transitions
        distinguishing_aspect: "SUBMIT from CERTIFIED is not a defined transition; must fail ERR_INVALID_STATE and leave the listing untouched."
        test_recipe:
          setup: ["Certified listing L (program min 50; verified inspection)"]
          setup_api_calls:
            - call: "POST /marketplace/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/sellers"
              payload: { legal_name: "Inv Seller", seller_state: "TX", seller_type: "LLC" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /marketplace/certification-programs"
              payload: { name: "PI", min_inspection_score: 50, min_title_grade: "C", requires_lease_disclosure: false, guarantee_months_cap: 6 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /marketplace/listings"
              payload: { seller_id: "${s_id}", address_line: "5 Invalid St", listing_state: "TX", asking_price_cents: 10000000, listing_kind: "SINGLE", certification_program_id: "${prog_id}", seller_asks_confidential: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l_id: $.data.id }
            - call: "POST /marketplace/listings/${l_id}/inspection-reports"
              payload: { inspector_name: "I", inspection_date: "2026-08-01T00:00:00Z", overall_score: 80, roof_score: 80, systems_score: 80, disclosed_defects: [], title_grade: "A" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { ir: $.data.id }
            - call: "POST /marketplace/inspection-reports/${ir}/transition"
              payload: { action: "SUBMIT" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /marketplace/inspection-reports/${ir}/transition"
              payload: { action: "VERIFY" }
              as: CertificationReviewer
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "SUBMIT" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "BEGIN_REVIEW" }
              as: CertificationReviewer
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "CERTIFY" }
              as: CertificationReviewer
          trigger:
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "SUBMIT" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "Listing.${l_id}.status == CERTIFIED"

      - name: terminal_guarantee_paid_is_locked
        claim_type: terminal_lockdown
        grounds:
          - state_machines.Guarantee.transitions
        distinguishing_aspect: "Guarantee in PAID (terminal) rejects every further action including CLAIM and DENY."
        test_recipe:
          setup: ["Sold listing with guarantee G claimed then paid"]
          setup_api_calls:
            - call: "POST /marketplace/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/sellers"
              payload: { legal_name: "Term Seller", seller_state: "TX", seller_type: "LLC" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /marketplace/buyers"
              payload: { legal_name: "Term Buyer", buyer_state: "TX", entity_type: "LLC", proof_of_funds_cents: 100000000 }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /marketplace/certification-programs"
              payload: { name: "PT", min_inspection_score: 50, min_title_grade: "C", requires_lease_disclosure: false, guarantee_months_cap: 6 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /marketplace/listings"
              payload: { seller_id: "${s_id}", address_line: "7 Term St", listing_state: "TX", asking_price_cents: 10000000, listing_kind: "SINGLE", certification_program_id: "${prog_id}", seller_asks_confidential: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l_id: $.data.id }
            - call: "POST /marketplace/listings/${l_id}/inspection-reports"
              payload: { inspector_name: "I", inspection_date: "2026-08-01T00:00:00Z", overall_score: 80, roof_score: 80, systems_score: 80, disclosed_defects: [], title_grade: "A" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { ir: $.data.id }
            - call: "POST /marketplace/inspection-reports/${ir}/transition"
              payload: { action: "SUBMIT" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /marketplace/inspection-reports/${ir}/transition"
              payload: { action: "VERIFY" }
              as: CertificationReviewer
            - call: "POST /marketplace/listings/${l_id}/leases"
              payload: { tenant_alias: "T-T", monthly_rent_cents: 100000, lease_start: "2026-01-01T00:00:00Z", lease_end: "2027-01-01T00:00:00Z", deposit_cents: 0 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { le: $.data.id }
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "SUBMIT" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "BEGIN_REVIEW" }
              as: CertificationReviewer
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "CERTIFY" }
              as: CertificationReviewer
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "PUBLISH" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /marketplace/listings/${l_id}/guarantees"
              payload: { guarantee_kind: "LEASE_UP", coverage_months: 6 }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "GET /marketplace/listings/${l_id}"
              as: Seller
              as_user_id: "${s_id}"
              captures: { l_v: $.data.version }
            - call: "POST /marketplace/listings/${l_id}/offers"
              payload: { buyer_id: "${b_id}", amount_cents: 10000000, earnest_money_cents: 50000, financing_type: "CASH", expected_listing_version: "${l_v}" }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { off: $.data.id }
            - call: "POST /marketplace/offers/${off}/transition"
              payload: { action: "SUBMIT" }
              as: Buyer
              as_user_id: "${b_id}"
            - call: "POST /marketplace/offers/${off}/transition"
              payload: { action: "ACCEPT" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "GET /marketplace/offers/${off}/escrow"
              as: Buyer
              as_user_id: "${b_id}"
              captures: { esc: $.data.0.id }
            - call: "POST /marketplace/escrows/${esc}/transition"
              payload: { action: "SEND_DOCS", escrow_officer_name: "EO" }
              as: EscrowOfficer
            - call: "GET /marketplace/offers/${off}/escrow"
              as: Buyer
              as_user_id: "${b_id}"
              captures: { esc_v: $.data.0.version }
            - call: "POST /marketplace/escrows/${esc}/sign"
              payload: { expected_escrow_version: "${esc_v}" }
              as: Buyer
              as_user_id: "${b_id}"
            - call: "POST /marketplace/escrows/${esc}/fund"
              payload: { funded_amount_cents: 10000000 }
              as: Buyer
              as_user_id: "${b_id}"
            - call: "POST /marketplace/escrows/${esc}/transition"
              payload: { action: "CLOSE" }
              as: EscrowOfficer
            - call: "POST /marketplace/leases/${le}/payment-records"
              payload: { due_date: "2026-10-01T00:00:00Z", amount_cents: 100000 }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /marketplace/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/guarantees/${g_id}/transition"
              payload: { action: "CLAIM" }
              as: Buyer
              as_user_id: "${b_id}"
            - call: "POST /marketplace/guarantees/${g_id}/transition"
              payload: { action: "PAY" }
              as: ClaimsAdjuster
          trigger:
            - call: "POST /marketplace/guarantees/${g_id}/transition"
              payload: { action: "DENY" }
              as: ClaimsAdjuster
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "Guarantee.${g_id}.status == PAID"

      - name: offer_accept_expires_sibling_offers
        claim_type: side_effect_execution
        grounds:
          - state_machines.Offer.transitions
          - state_machines.Listing.OFFER_PENDING_to_UNDER_CONTRACT
        distinguishing_aspect: "Accepting offer O1 expires sibling SUBMITTED offer O2 on the same listing and moves the listing to UNDER_CONTRACT."
        test_recipe:
          setup: ["LISTED listing L; buyers B1, B2 each with a SUBMITTED offer"]
          setup_api_calls:
            - call: "POST /marketplace/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/sellers"
              payload: { legal_name: "Sib Seller", seller_state: "TX", seller_type: "LLC" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /marketplace/buyers"
              payload: { legal_name: "B One", buyer_state: "TX", entity_type: "LLC", proof_of_funds_cents: 100000000 }
              as: PlatformAdmin
              captures: { b1: $.data.id }
            - call: "POST /marketplace/buyers"
              payload: { legal_name: "B Two", buyer_state: "TX", entity_type: "LLC", proof_of_funds_cents: 100000000 }
              as: PlatformAdmin
              captures: { b2: $.data.id }
            - call: "POST /marketplace/certification-programs"
              payload: { name: "PS", min_inspection_score: 50, min_title_grade: "C", requires_lease_disclosure: false, guarantee_months_cap: 6 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /marketplace/listings"
              payload: { seller_id: "${s_id}", address_line: "9 Sib St", listing_state: "TX", asking_price_cents: 10000000, listing_kind: "SINGLE", certification_program_id: "${prog_id}", seller_asks_confidential: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l_id: $.data.id }
            - call: "POST /marketplace/listings/${l_id}/inspection-reports"
              payload: { inspector_name: "I", inspection_date: "2026-08-01T00:00:00Z", overall_score: 80, roof_score: 80, systems_score: 80, disclosed_defects: [], title_grade: "A" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { ir: $.data.id }
            - call: "POST /marketplace/inspection-reports/${ir}/transition"
              payload: { action: "SUBMIT" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /marketplace/inspection-reports/${ir}/transition"
              payload: { action: "VERIFY" }
              as: CertificationReviewer
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "SUBMIT" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "BEGIN_REVIEW" }
              as: CertificationReviewer
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "CERTIFY" }
              as: CertificationReviewer
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "PUBLISH" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "GET /marketplace/listings/${l_id}"
              as: Seller
              as_user_id: "${s_id}"
              captures: { l_v1: $.data.version }
            - call: "POST /marketplace/listings/${l_id}/offers"
              payload: { buyer_id: "${b1}", amount_cents: 10000000, earnest_money_cents: 50000, financing_type: "CASH", expected_listing_version: "${l_v1}" }
              as: Buyer
              as_user_id: "${b1}"
              captures: { off1: $.data.id }
            - call: "GET /marketplace/listings/${l_id}"
              as: Seller
              as_user_id: "${s_id}"
              captures: { l_v2: $.data.version }
            - call: "POST /marketplace/listings/${l_id}/offers"
              payload: { buyer_id: "${b2}", amount_cents: 9900000, earnest_money_cents: 50000, financing_type: "CASH", expected_listing_version: "${l_v2}" }
              as: Buyer
              as_user_id: "${b2}"
              captures: { off2: $.data.id }
            - call: "POST /marketplace/offers/${off1}/transition"
              payload: { action: "SUBMIT" }
              as: Buyer
              as_user_id: "${b1}"
            - call: "POST /marketplace/offers/${off2}/transition"
              payload: { action: "SUBMIT" }
              as: Buyer
              as_user_id: "${b2}"
          trigger:
            - call: "POST /marketplace/offers/${off1}/transition"
              payload: { action: "ACCEPT" }
              as: Seller
              as_user_id: "${s_id}"
          assert:
            - "Offer.${off1}.status == ACCEPTED"
            - "Offer.${off2}.status == EXPIRED"
            - "Listing.${l_id}.status == UNDER_CONTRACT"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: projected_yield_uses_portfolio_bulk_basis
        claim_type: correct_result
        grounds:
          - calculations.projected_yield
          - entities.Listing.fields.bulk_price_cents
        distinguishing_aspect: "For PORTFOLIO listings the yield denominator is bulk_price_cents, not asking_price_cents; same NOI gives a different yield when the two bases differ."
        test_recipe:
          setup: ["Seller S, buyer B, PORTFOLIO listing with asking 50000000 and bulk 40000000"]
          setup_api_calls:
            - call: "POST /marketplace/sellers"
              payload: { legal_name: "Yield Seller", seller_state: "TX", seller_type: "LLC" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /marketplace/buyers"
              payload: { legal_name: "Yield Buyer", buyer_state: "TX", entity_type: "LLC", proof_of_funds_cents: 100000000 }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /marketplace/listings"
              payload: { seller_id: "${s_id}", address_line: "20 Portfolio Pkwy", listing_state: "TX", asking_price_cents: 50000000, listing_kind: "PORTFOLIO", bulk_price_cents: 40000000, seller_asks_confidential: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /marketplace/listings/${l_id}/underwriting-reports"
              payload: { buyer_id: "${b_id}", rent_estimate_cents: 200000, vacancy_rate_bps: 500, opex_rate_bps: 4000 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { uw: $.data.id }
          assert:
            - "UnderwritingReport.${uw}.projected_noi_cents == 1320000"
            - "UnderwritingReport.${uw}.projected_yield_bps == 330 (floor(1320000*10000/40000000)) — NOT 264 (the asking-price basis)"

      - name: offer_expiry_sweep_on_clock_set
        claim_type: input_set_filtering
        grounds:
          - calculations.late_flag
          - state_machines.Offer.SUBMITTED_to_EXPIRED
        distinguishing_aspect: "Setting the logical clock past expires_at sweeps only SUBMITTED offers to EXPIRED; COUNTERED offers are out of the input set and survive."
        test_recipe:
          setup: ["LISTED listing L with two offers: O1 SUBMITTED at clock T (expires T+72h), O2 COUNTERED"]
          setup_api_calls:
            - call: "POST /marketplace/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/sellers"
              payload: { legal_name: "Sweep Seller", seller_state: "TX", seller_type: "LLC" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /marketplace/buyers"
              payload: { legal_name: "Sweep B1", buyer_state: "TX", entity_type: "LLC", proof_of_funds_cents: 100000000 }
              as: PlatformAdmin
              captures: { b1: $.data.id }
            - call: "POST /marketplace/buyers"
              payload: { legal_name: "Sweep B2", buyer_state: "TX", entity_type: "LLC", proof_of_funds_cents: 100000000 }
              as: PlatformAdmin
              captures: { b2: $.data.id }
            - call: "POST /marketplace/certification-programs"
              payload: { name: "PW", min_inspection_score: 50, min_title_grade: "C", requires_lease_disclosure: false, guarantee_months_cap: 6 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /marketplace/listings"
              payload: { seller_id: "${s_id}", address_line: "22 Sweep St", listing_state: "TX", asking_price_cents: 10000000, listing_kind: "SINGLE", certification_program_id: "${prog_id}", seller_asks_confidential: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l_id: $.data.id }
            - call: "POST /marketplace/listings/${l_id}/inspection-reports"
              payload: { inspector_name: "I", inspection_date: "2026-08-01T00:00:00Z", overall_score: 80, roof_score: 80, systems_score: 80, disclosed_defects: [], title_grade: "A" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { ir: $.data.id }
            - call: "POST /marketplace/inspection-reports/${ir}/transition"
              payload: { action: "SUBMIT" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /marketplace/inspection-reports/${ir}/transition"
              payload: { action: "VERIFY" }
              as: CertificationReviewer
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "SUBMIT" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "BEGIN_REVIEW" }
              as: CertificationReviewer
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "CERTIFY" }
              as: CertificationReviewer
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "PUBLISH" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "GET /marketplace/listings/${l_id}"
              as: Seller
              as_user_id: "${s_id}"
              captures: { l_v1: $.data.version }
            - call: "POST /marketplace/listings/${l_id}/offers"
              payload: { buyer_id: "${b1}", amount_cents: 10000000, earnest_money_cents: 50000, financing_type: "CASH", expected_listing_version: "${l_v1}" }
              as: Buyer
              as_user_id: "${b1}"
              captures: { off1: $.data.id }
            - call: "GET /marketplace/listings/${l_id}"
              as: Seller
              as_user_id: "${s_id}"
              captures: { l_v2: $.data.version }
