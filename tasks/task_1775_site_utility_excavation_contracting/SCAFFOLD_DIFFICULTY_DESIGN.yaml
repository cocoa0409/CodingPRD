              payload: { project_id: "${p2_id}", utility_owner_id: "${o_id}", pipe_segment_id: "${s2_id}", window_start: "2026-08-03T11:30:00Z", window_end: "2026-08-03T12:30:00Z", expected_project_version: "${p2_v2}" }
