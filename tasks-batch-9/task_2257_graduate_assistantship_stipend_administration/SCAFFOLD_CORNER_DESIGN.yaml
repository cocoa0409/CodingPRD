            - "the PROPOSED listing has total_count == 2 ordered by plan_sequence ASC"
            - "FundingAllocation.${new_first_id}.plan_sequence == 1 and funding_source_id == ${src_a_id} and share_pct == 60.00 and allocated_stipend_cents == 180000"
            - "FundingAllocation.${new_second_id}.plan_sequence == 2 and funding_source_id == ${src_b_id} and share_pct == 40.00 and allocated_stipend_cents == 120000"
            - "Appointment.${appt_id}.total_stipend_cents == 300000 and version == 4"

