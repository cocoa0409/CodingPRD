              as_user_id: "compliance-1"
            - call: "POST /recruitment/applications/${a1_id}/disclosure"
              payload: { action: "ISSUE" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { tok1: "$.data.disclosure_ack_token" }
            - call: "POST /recruitment/applications/${a1_id}/disclosure"
              payload: { action: "ACKNOWLEDGE", ack_token: "${tok1}" }
              as: Applicant
              as_user_id: "applicant-001"
            - call: "POST /recruitment/applications/${a1_id}/submit"
              payload: {}
              as: AgencyOwner
              as_user_id: "${ag1_id}"
            - call: "POST /recruitment/applications/${a1_id}/decision"
              payload: { decision: "ADMIT" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { a1_v1: "$.data.version" }
          trigger:
            - call: "POST /recruitment/applications/${a1_id}/milestones"
              payload: { milestone: "DEPOSIT_PAID", event_date: "2026-08-01", expected_application_version: "${a1_v1}" }
              as: Registrar
              as_user_id: "registrar-1"
            - call: "POST /recruitment/applications/${a1_id}/milestones"
              payload: { milestone: "ENROLLED", event_date: "2026-08-01", expected_application_version: "${a1_v1}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { err_occ: "$.data.error_id" }
            - call: "GET /recruitment/applications/${a1_id}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { a1_v2: "$.data.version" }
            - call: "POST /recruitment/applications/${a1_id}/milestones"
              payload: { milestone: "ENROLLED", event_date: "2026-08-01", expected_application_version: "${a1_v2}" }
              as: Registrar
              as_user_id: "registrar-1"
            - call: "GET /recruitment/commission-entries"
              payload: { application_id: "${a1_id}", kind: "ACCRUAL" }
              as: FinanceOfficer
              as_user_id: "finance-1"
          assert:
            - 'the first registration returns HTTP 200 with status "DEPOSIT_PAID" and version ${a1_v1} + 1'
            - 'the second returns HTTP 412 with data.error_id == "ERR_STALE_APPLICATION_VERSION" - not "ERR_MILESTONE_OUT_OF_ORDER", since ENROLLED is the legal successor of DEPOSIT_PAID'
            - '${a1_v2} == ${a1_v1} + 1 and the replay returns HTTP 200 with status "ENROLLED"'
            - 'the entry list returns total_count == 2 (one accrual per milestone): the refused call appended nothing'

      - name: five_level_cascade_verified_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: document_fraud_confirmation_five_hop_cascade
          rationale: |
            That instance drives a single CONFIRMED_FRAUD verification and asserts every hop
            of the chain in order - incident appended, both risk variants recomputed, posture
            escalated, ACTIVE contracts suspended, territories released and ISSUED disclosures
            invalidated - which is the end-to-end cascade witness for this scaffold.

      - name: both_variants_produce_expected_results_and_delta
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: commission_projection_versus_final_net_after_tier_drop
          rationale: |
            That instance computes the provisional projection at submission and the final net
            after the tier drop, then asserts both variants plus variant_delta_cents on
            GET /recruitment/applications/{id}/commission-projection, which is exactly the
            divergence-and-delta claim for this layer.

  - section: consistency model
    instances:
      - name: document_upload_cascade_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.application_fraud_signal_index
          - endpoints["POST /recruitment/applications/{id}/documents"]
        distinguishing_aspect: |
          The scaffold declares immediate consistency, so the derived work of an upload is
          visible without any second write: the POST response already carries the computed
          signal set, the index and the FLAGGED state, and the very next read of the parent
          application shows integrity_hold true with no sweep, no clock move and no re-post.
        test_recipe:
          setup:
            - "Agency ag1 is CLEARED and application a1 is in DRAFT with integrity_hold false and no documents."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Immediate Agency", home_country_code: "IN", ownership_disclosed: true, beneficial_owner_count: 1, sanctions_screen_passed: true, reference_check_count: 2 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
            - call: "POST /recruitment/agencies/${ag1_id}/vetting"
              payload: { action: "SUBMIT_FOR_SCREENING" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "POST /recruitment/agencies/${ag1_id}/vetting"
              payload: { action: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /recruitment/programs"
              payload: { code: "MSCS-2026", name: "MSc Computer Science", level: "POSTGRADUATE", annual_tuition_cents: 2000000, term_start_date: "2026-09-01", census_date: "2026-09-30", persistence_check_date: "2027-02-15" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { prog1_id: "$.data.id" }
            - call: "POST /recruitment/applications"
              payload: { agency_id: "${ag1_id}", program_id: "${prog1_id}", student_ref: "STU-001", student_residence_country: "IN", student_us_person: false }
              as: AgencyOwner
              as_user_id: "${ag1_id}"
              captures: { a1_id: "$.data.id" }
          trigger:
            - call: "POST /recruitment/applications/${a1_id}/documents"
              payload: { doc_type: "FINANCIAL_PROOF", content_hash: "hash-imm-001", issuer_name: "Unknown Bank", declared_signals: ["ISSUER_UNVERIFIED", "TRANSCRIPT_ANOMALY", "TRANSLATION_MISMATCH", "DATE_INCONSISTENCY"] }
              as: AgencyOwner
              as_user_id: "${ag1_id}"
              captures: { d1_id: "$.data.id" }
            - call: "GET /recruitment/applications/${a1_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "GET /recruitment/applications/${a1_id}/documents"
              payload: { verification_state: "FLAGGED" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
          assert:
            - 'the POST 201 body itself already reports fraud_index == 70 and verification_state == "FLAGGED" - the caller does not have to re-read the document to learn its computed state'
            - 'the immediately following application read shows integrity_hold == true with no intervening write'
            - 'the filtered document list returns total_count == 1 with data[0].id == "${d1_id}"'
            - 'no clock move or sweep was needed: the cascade from upload to parent flag is synchronous within the write'
