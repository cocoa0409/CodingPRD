        grounds: ["concurrency_rules[parcel-extend-stale-version]", "errors[ERR_STALE_PARCEL_VERSION]"]
        distinguishing_aspect: "OCC on Parcel.version: extend-contingency with the version captured at open succeeds; a second extend replaying that version is rejected 412 ERR_STALE_PARCEL_VERSION."
        test_recipe:
          setup: ["Parcel P in CONTINGENCY_ACTIVE with contingency_end_date 2027-01-01; version captured from the open-contingency response"]
          setup_api_calls:
