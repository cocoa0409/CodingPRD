# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Concierge Senior & Non-Emergency Transport.
# Sections follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:
      - name: client_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.Client.fields.billing_hold_limit_cents, entities.Client.fields.status, entities.Client.fields.credit_balance_cents]
        distinguishing_aspect: "Omitting billing_hold_limit_cents yields the 20000 default; status starts ACTIVE; credit and strike counters start at 0; version starts at 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { cli: $.data.id, limit: $.data.billing_hold_limit_cents, st: $.data.status, credit: $.data.credit_balance_cents, strikes: $.data.no_show_count, ver: $.data.version } }
          assert:
            - "billing_hold_limit_cents == 20000 (default applied)"
            - "status == ACTIVE, credit_balance_cents == 0, no_show_count == 0, version == 1"

      - name: client_missing_required_full_name_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Client.fields.full_name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A create payload missing required full_name is rejected with ERR_INVALID_REQUEST (400) before any state exists."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /clients", payload: { mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status == 400"

      - name: family_member_notify_defaults_true
        claim_type: defaults
        grounds: [entities.FamilyMember.fields.notify_on_ride_events, entities.FamilyMember.fields.status]
        distinguishing_aspect: "Omitting notify_on_ride_events stores true; status starts ACTIVE."
        test_recipe:
          setup: ["client exists"]
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { cli: $.data.id } }
          trigger:
            - { call: "POST /family-members", payload: { client_id: "${cli}", full_name: "Faye F", relation: "daughter", access_level: "VIEW_ONLY" }, as: Coordinator, captures: { fam: $.data.id, notify: $.data.notify_on_ride_events, st: $.data.status } }
          assert:
            - "notify_on_ride_events == true (default) and status == ACTIVE"

      - name: ride_snapshots_computed_at_creation
        claim_type: computed_fields
        grounds: [entities.Ride.fields.requires_wav, entities.Ride.fields.service_class, entities.Ride.fields.assist_level, entities.Ride.fields.quoted_fare_cents]
        distinguishing_aspect: "A POWER_WHEELCHAIR / DOOR_THROUGH_DOOR client gets requires_wav=true, service_class=WAV, assist_level=DOOR_THROUGH_DOOR snapshotted onto the ride, plus a WAV-card quote of 11200 for 120 min / 16 mi."
        test_recipe:
          setup: ["ACTIVE WAV card; client with mobility_aid POWER_WHEELCHAIR, assist default DOOR_THROUGH_DOOR"]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { service_class: "WAV", effective_from: "2026-01-01", effective_to: "2027-01-01", hourly_rate_cents: 3600, per_mile_cents: 175, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 3000, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 1200 }, as: PlatformAdmin, captures: { rc: $.data.id } }
            - { call: "POST /rate-cards/${rc}/activate", as: PlatformAdmin }
            - { call: "POST /clients", payload: { full_name: "Walt W", mobility_aid: "POWER_WHEELCHAIR", assist_level_default: "DOOR_THROUGH_DOOR", home_zone: "north", address: "9 Oak Ave" }, as: Coordinator, captures: { cli: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T09:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "APPOINTMENT", scheduled_pickup_at: "2026-06-03T10:00:00Z", estimated_duration_minutes: 120, estimated_distance_miles: 16, origin_zone: "north" }, as: Client, as_user_id: "${cli}", captures: { ride: $.data.id, wav: $.data.requires_wav, sclass: $.data.service_class, assist: $.data.assist_level, quote: $.data.quoted_fare_cents } }
          assert:
            - "requires_wav == true, service_class == WAV, assist_level == DOOR_THROUGH_DOOR"
            - "quoted_fare_cents == 11200 (7200 + 2800 + 1200 surcharge; computed fields cannot be set by input)"

      - name: ride_computed_field_input_ignored
        claim_type: system_fields
        grounds: [entities.Ride.fields.requires_wav, entities.Ride.fields.status]
        distinguishing_aspect: "Client-supplied requires_wav=false and status=CANCELLED in the create payload are ignored: the server snapshots requires_wav from the client's mobility_aid and forces status SCHEDULED."
        test_recipe:
          setup: ["ACTIVE WAV card; POWER_WHEELCHAIR client"]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { service_class: "WAV", effective_from: "2026-01-01", effective_to: "2027-01-01", hourly_rate_cents: 3600, per_mile_cents: 175, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 3000, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 1200 }, as: PlatformAdmin, captures: { rc: $.data.id } }
            - { call: "POST /rate-cards/${rc}/activate", as: PlatformAdmin }
            - { call: "POST /clients", payload: { full_name: "Walt W", mobility_aid: "POWER_WHEELCHAIR", assist_level_default: "DOOR_THROUGH_DOOR", home_zone: "north", address: "9 Oak Ave" }, as: Coordinator, captures: { cli: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T09:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "APPOINTMENT", scheduled_pickup_at: "2026-06-03T10:00:00Z", estimated_duration_minutes: 120, estimated_distance_miles: 16, origin_zone: "north", requires_wav: false, status: "CANCELLED" }, as: Client, as_user_id: "${cli}", captures: { wav: $.data.requires_wav, st: $.data.status } }
          assert:
            - "requires_wav == true (client input ignored) and status == SCHEDULED (client input ignored)"

      - name: get_ride_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=6]"]
        distinguishing_aspect: "Reading a ride id that does not exist yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /rides/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Coordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND and http status == 404"

      - name: invalid_enum_mobility_aid_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Client.fields.mobility_aid, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "mobility_aid outside {NONE, WALKER, FOLDING_WHEELCHAIR, POWER_WHEELCHAIR} is rejected at validation priority 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "ROCKET_CHAIR", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status == 400"

      - name: ride_event_log_is_append_only_and_ordered
        claim_type: immutability
        grounds: [entities.RideEvent, state_machines.Ride.SCHEDULED_to_DISPATCHING]
        distinguishing_aspect: "RideEvent has no update/delete endpoint; the family-portal log accumulates CREATED then DISPATCHED then OFFERED in occurred_at order and exposes no version field."
        test_recipe:
          setup: ["ACTIVE STANDARD card; client; one ACTIVE driver; one ride dispatched"]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { service_class: "STANDARD", effective_from: "2026-01-01", effective_to: "2027-01-01", hourly_rate_cents: 3000, per_mile_cents: 150, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 2501, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 0 }, as: PlatformAdmin, captures: { rc: $.data.id } }
            - { call: "POST /rate-cards/${rc}/activate", as: PlatformAdmin }
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { cli: $.data.id } }
            - { call: "POST /drivers", payload: { full_name: "Dan D", vehicle_class: "SEDAN", assist_certification: "DOOR_THROUGH_DOOR", home_zone: "north", max_daily_service_minutes: 480 }, as: Coordinator, captures: { drv: $.data.id } }
            - { call: "POST /compliance-docs", payload: { driver_id: "${drv}", doc_type: "BACKGROUND_CHECK", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: Coordinator, captures: { d1: $.data.id } }
            - { call: "POST /compliance-docs/${d1}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /compliance-docs", payload: { driver_id: "${drv}", doc_type: "BONDING", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: Coordinator, captures: { d2: $.data.id } }
            - { call: "POST /compliance-docs/${d2}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /compliance-docs", payload: { driver_id: "${drv}", doc_type: "INSURANCE", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: Coordinator, captures: { d3: $.data.id } }
            - { call: "POST /compliance-docs/${d3}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /drivers/${drv}/status-events", payload: { event_type: "ACTIVATE" }, as: Coordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "GROCERY", scheduled_pickup_at: "2026-06-05T10:00:00Z", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north" }, as: Client, as_user_id: "${cli}", captures: { ride: $.data.id } }
            - { call: "POST /rides/${ride}/dispatch", as: Coordinator, as_user_id: "coord-1" }
            - { call: "POST /family-members", payload: { client_id: "${cli}", full_name: "Faye F", relation: "daughter", access_level: "VIEW_ONLY" }, as: Coordinator, captures: { fam: $.data.id } }
          trigger:
            - { call: "GET /rides/${ride}/events", as: FamilyMember, as_user_id: "${fam}", captures: { e0: "$.data[0].event_type", e1: "$.data[1].event_type", e2: "$.data[2].event_type" } }
          assert:
            - "events[0].event_type == CREATED, events[1].event_type == DISPATCHED, events[2].event_type == OFFERED"
            - "occurred_at values are non-decreasing in list order; the entity exposes no updated_at/version mutation surface"

  # ===========================================================================
  # From Table 2 (State Machines)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: ride_created_in_scheduled_initial_state
        claim_type: initial_state
        grounds: [state_machines.Ride]
        distinguishing_aspect: "A freshly created ride starts in SCHEDULED with dispatch_round 0 and empty excluded_driver_ids."
        test_recipe:
          setup: ["ACTIVE STANDARD card; client"]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { service_class: "STANDARD", effective_from: "2026-01-01", effective_to: "2027-01-01", hourly_rate_cents: 3000, per_mile_cents: 150, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 2501, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 0 }, as: PlatformAdmin, captures: { rc: $.data.id } }
            - { call: "POST /rate-cards/${rc}/activate", as: PlatformAdmin }
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { cli: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T09:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "GROCERY", scheduled_pickup_at: "2026-06-01T10:00:00Z", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north" }, as: Client, as_user_id: "${cli}", captures: { st: $.data.status, round: $.data.dispatch_round, drv: $.data.assigned_driver_id } }
          assert:
            - "status == SCHEDULED, dispatch_round == 0, assigned_driver_id == null"

      - name: driver_created_in_applicant_initial_state
        claim_type: initial_state
        grounds: [state_machines.Driver]
        distinguishing_aspect: "A freshly onboarded driver starts APPLICANT and cannot be offered rides until activated."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /drivers", payload: { full_name: "Dan D", vehicle_class: "SEDAN", assist_certification: "DOOR_THROUGH_DOOR", home_zone: "north", max_daily_service_minutes: 480 }, as: Coordinator, captures: { drv: $.data.id, st: $.data.status } }
          assert:
            - "status == APPLICANT"

      - name: cancel_completed_ride_returns_not_cancellable
        claim_type: invalid_transition
        grounds: [state_machines.Ride, "errors[ERR_RIDE_NOT_CANCELLABLE]"]
        distinguishing_aspect: "COMPLETED is terminal for cancellation; the cancel attempt fails and final_fare_cents stays put."
        test_recipe:
          setup: ["ACTIVE card; client; driver; ride completed (service 60, 10 mi, zero wait -> 4500)"]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { service_class: "STANDARD", effective_from: "2026-01-01", effective_to: "2027-01-01", hourly_rate_cents: 3000, per_mile_cents: 150, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 2501, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 0 }, as: PlatformAdmin, captures: { rc: $.data.id } }
            - { call: "POST /rate-cards/${rc}/activate", as: PlatformAdmin }
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { cli: $.data.id } }
            - { call: "POST /drivers", payload: { full_name: "Dan D", vehicle_class: "SEDAN", assist_certification: "DOOR_THROUGH_DOOR", home_zone: "north", max_daily_service_minutes: 480 }, as: Coordinator, captures: { drv: $.data.id } }
            - { call: "POST /compliance-docs", payload: { driver_id: "${drv}", doc_type: "BACKGROUND_CHECK", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: Coordinator, captures: { d1: $.data.id } }
            - { call: "POST /compliance-docs/${d1}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /compliance-docs", payload: { driver_id: "${drv}", doc_type: "BONDING", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: Coordinator, captures: { d2: $.data.id } }
            - { call: "POST /compliance-docs/${d2}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /compliance-docs", payload: { driver_id: "${drv}", doc_type: "INSURANCE", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: Coordinator, captures: { d3: $.data.id } }
            - { call: "POST /compliance-docs/${d3}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /drivers/${drv}/status-events", payload: { event_type: "ACTIVATE" }, as: Coordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "GROCERY", scheduled_pickup_at: "2026-06-01T10:00:00Z", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north" }, as: Client, as_user_id: "${cli}", captures: { ride: $.data.id } }
            - { call: "POST /rides/${ride}/dispatch", as: Coordinator, as_user_id: "coord-1", captures: { asg: $.data.id } }
            - { call: "POST /assignments/${asg}/respond", payload: { decision: "ACCEPT" }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:40:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides/${ride}/execution-events", payload: { event_type: "EN_ROUTE" }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:55:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides/${ride}/execution-events", payload: { event_type: "ARRIVED" }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides/${ride}/execution-events", payload: { event_type: "SERVICE_STARTED" }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T11:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides/${ride}/execution-events", payload: { event_type: "COMPLETE", actual_distance_miles: 10 }, as: Driver, as_user_id: "${drv}", captures: { fare: $.data.final_fare_cents } }
          trigger:
            - { call: "POST /rides/${ride}/cancel", payload: { cancel_note: "too late" }, as: Client, as_user_id: "${cli}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_RIDE_NOT_CANCELLABLE and Ride.${ride}.final_fare_cents == 4500 unchanged"

      - name: cancel_already_cancelled_returns_not_cancellable
        claim_type: idempotency
        grounds: [state_machines.Ride, "errors[ERR_RIDE_NOT_CANCELLABLE]"]
        distinguishing_aspect: "The second cancel of the same ride is rejected; the fee computed by the first cancel is not recomputed or doubled."
        test_recipe:
          setup: ["ACTIVE card; client; ride pickup 2026-06-10T16:00:00Z; clock 2026-06-10T12:00:00Z (notice 240)"]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { service_class: "STANDARD", effective_from: "2026-01-01", effective_to: "2027-01-01", hourly_rate_cents: 3000, per_mile_cents: 150, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 2501, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 0 }, as: PlatformAdmin, captures: { rc: $.data.id } }
            - { call: "POST /rate-cards/${rc}/activate", as: PlatformAdmin }
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { cli: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-08T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "GROCERY", scheduled_pickup_at: "2026-06-10T16:00:00Z", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north" }, as: Client, as_user_id: "${cli}", captures: { ride: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides/${ride}/cancel", payload: { cancel_note: "first" }, as: Client, as_user_id: "${cli}", captures: { fee1: $.data.cancellation_fee_cents } }
          trigger:
            - { call: "POST /rides/${ride}/cancel", payload: { cancel_note: "second" }, as: Client, as_user_id: "${cli}", captures: { err: $.data.error_id } }
          assert:
            - "first cancel set cancellation_fee_cents == 1251"
            - "second cancel: error_id == ERR_RIDE_NOT_CANCELLABLE; fee stays 1251"

      - name: dispatch_cancelled_ride_returns_not_dispatchable
        claim_type: invalid_transition
        grounds: [state_machines.Ride, "errors[ERR_RIDE_NOT_DISPATCHABLE]"]
        distinguishing_aspect: "Dispatch is only legal from SCHEDULED/DISPATCHING; a CANCELLED ride rejects with ERR_RIDE_NOT_DISPATCHABLE."
        test_recipe:
          setup: ["ACTIVE card; client; ride created then cancelled free (notice > 1440)"]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { service_class: "STANDARD", effective_from: "2026-01-01", effective_to: "2027-01-01", hourly_rate_cents: 3000, per_mile_cents: 150, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 2501, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 0 }, as: PlatformAdmin, captures: { rc: $.data.id } }
            - { call: "POST /rate-cards/${rc}/activate", as: PlatformAdmin }
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { cli: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "GROCERY", scheduled_pickup_at: "2026-06-05T10:00:00Z", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north" }, as: Client, as_user_id: "${cli}", captures: { ride: $.data.id } }
            - { call: "POST /rides/${ride}/cancel", payload: { cancel_note: "changed mind" }, as: Client, as_user_id: "${cli}" }
          trigger:
            - { call: "POST /rides/${ride}/dispatch", as: Coordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_RIDE_NOT_DISPATCHABLE and http status == 409"

      - name: dispatch_with_live_offer_returns_duplicate_offer
        claim_type: invalid_transition
        grounds: ["validations[priority=11]", "errors[ERR_DUPLICATE_OFFER]"]
        distinguishing_aspect: "A second dispatch while an OFFERED assignment is still live is rejected; the ride's dispatch_round does not advance."
        test_recipe:
          setup: ["ACTIVE card; client; ACTIVE driver; ride dispatched once (offer live)"]
          setup_api_calls:
