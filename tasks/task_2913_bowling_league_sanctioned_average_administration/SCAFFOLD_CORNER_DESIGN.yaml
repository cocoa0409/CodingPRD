              payload: { full_name: "Fay Bowler", email: "fay@bowl.test", member_class: "ADULT" }
              as: AssociationOfficer
              captures: { m4_id: "$.data.id" }
            - call: "POST /leagues"
              payload: { name: "Tuesday Classic", season_year: 2026, center_name: "Cedar Lanes", declared_team_count: 2, organizational_meeting_at: "2026-08-05T00:00:00Z", secretary_member_id: "${sec_id}", treasurer_member_id: "${tre_id}" }
