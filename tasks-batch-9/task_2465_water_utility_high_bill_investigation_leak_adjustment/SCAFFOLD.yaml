scenario: |
  Generate task harder than expert level!

  2465. Water Utility High-Bill Investigation & Leak Adjustment (municipal water customer service):
  consumption anomaly detection against seasonal baseline, meter accuracy test request and bench-test
  result handling, customer-side leak determination and plumber repair proof requirement, leak
  adjustment formula with once-per-period caps and sewer-charge relief, payment arrangement and
  shutoff hold during investigation, backflow or irrigation submeter credit rules, estimated read
  correction and rebilling windows, appeal to a utility board hearing

domain_name: water-utility-high-bill-investigation
api_prefix: ""

complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Every entity is a top-level collection linked by explicit foreign keys. No entity is
  # nested in a URL path except the two append-only ledger sub-resources. Meter and
  # MeterReading and LeakAdjustment carry self-referential FKs, so the reference graph is a
  # forest of peer collections rather than a containment tree.

  state_machine_shape: cyclic
  # HighBillInvestigation loops EVIDENCE_UNDER_REVIEW -> EVIDENCE_REQUESTED (rejected proof) and
  # APPEALED -> EVIDENCE_REQUESTED (board remand) and RESOLVED -> DETERMINED (adjustment reversal).
  # ServiceAccount carries two independent state dimensions (service_status x credit_status).
  # Bill, MeterTestRequest and BoardAppeal fork into branches with divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # ServiceAccount -> Meter, Bill, AccountLedgerEntry, PaymentArrangement
    - self_referential     # Meter.parent_meter_id, MeterReading.corrects_reading_id /
                           # superseded_by_reading_id, Bill.rebill_of_bill_id,
                           # LeakAdjustment.supersedes_adjustment_id
    - cross_aggregate      # LeakAdjustment reaches across Bill, RepairProof, MeterTestRequest,
                           # BillingPeriod and ServiceAccount within one transition
    - polymorphic          # AccountLedgerEntry.source_id points at whichever entity produced it

  role_model: segregation_of_duties
  # The CustomerServiceRep who records the leak determination may not be the BillingSupervisor
  # who approves the resulting credit (compared on X-User-ID, not on role), and the
  # UtilityBoardClerk who records a hearing decision may not be the user who determined the
  # investigation.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Workflow constants
# Numeric constants referenced by §1.2 transition preconditions, §1.2 side effects
# and §1.4 validation rules. Constants that belong to a single calculation are
# declared on that calculation's own `constants:` map in §1.3 instead.
# =============================================================================
workflow_constants:
  BILL_DUE_DAYS: 21                 # due_date = BillingPeriod.end_date + 21 calendar days
  SHUTOFF_NOTICE_DAYS: 10           # shutoff_scheduled_for = clock_now + 10 calendar days
  MAX_EVIDENCE_ROUNDS: 3            # request-evidence openings permitted per investigation
  REMAND_MAX: 1                     # board REMAND decisions absorbed per investigation
  APPEAL_FILING_DAYS: 30            # calendar days from determined_at to file a BoardAppeal
  HEARING_MIN_NOTICE_DAYS: 10       # calendar days from filing_date to the earliest hearing_date
  HEARING_DOCKET_CAPACITY: 3        # SCHEDULED appeals permitted on one hearing_date
  METER_TEST_DEPOSIT_CENTS: 3000    # deposit charged for a CUSTOMER-requested accuracy test
  METER_TEST_QUARANTINE_HOURS: 48   # buffer after last_test_completed_at before a new field window

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: RateSchedule
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Human-readable schedule code
        constraints: unique across RateSchedule
      - name: base_charge_cents
        type: integer
        source: input
        description: Fixed monthly service charge added to every bill
        constraints: ">= 0"
      - name: tier1_limit_gallons
        type: integer
        source: input
        description: Upper bound of tier 1 volume, inclusive
        constraints: "> 0"
      - name: tier1_rate_cents_per_kgal
        type: integer
        source: input
        description: Tier 1 rate in cents per 1000 gallons
        constraints: "> 0"
      - name: tier2_limit_gallons
        type: integer
        source: input
        description: Upper bound of tier 2 volume, inclusive
        constraints: "> tier1_limit_gallons"
      - name: tier2_rate_cents_per_kgal
        type: integer
        source: input
        description: Tier 2 rate in cents per 1000 gallons
        constraints: "> 0"
      - name: tier3_rate_cents_per_kgal
        type: integer
        source: input
        description: Rate in cents per 1000 gallons for all volume above tier2_limit_gallons
        constraints: "> 0"
      - name: summer_surcharge_bp
        type: integer
        source: input
        description: Basis-point surcharge applied to the tier 3 line only, and only when the bill's BillingPeriod.season == SUMMER
        constraints: ">= 0"
      - name: sewer_rate_cents_per_kgal
        type: integer
        source: input
        description: Sewer volumetric rate in cents per 1000 gallons
        constraints: "> 0"
      - name: sewer_cap_gallons
        type: integer
        source: input
        description: Maximum gallons on which sewer volume is billed in one period
        constraints: "> 0"
      - name: submeter_sewer_credit_cap_gallons
        type: integer
        source: input
        description: Maximum irrigation-submeter gallons that may be excluded from sewer billing in one period
        constraints: ">= 0"
      - name: admin_fee_cents
        type: integer
        source: input
        description: Processing fee deducted from a posted leak adjustment when the capped credit is below admin_fee_waiver_threshold_cents
        constraints: ">= 0"
      - name: admin_fee_waiver_threshold_cents
        type: integer
        source: input
        description: Capped-credit amount at or above which admin_fee_cents is waived (>= comparison)
        constraints: ">= 0"

  - name: BillingPeriod
    parent: null
    common_fields: true
    fields:
      - name: period_code
        type: string
        source: input
        description: Period label such as 2026-07
        constraints: unique across BillingPeriod
      - name: start_date
        type: string
        source: input
        description: First calendar day of the period, ISO date (YYYY-MM-DD), inclusive
      - name: end_date
        type: string
        source: input
        description: Last calendar day of the period, ISO date (YYYY-MM-DD), inclusive
        constraints: ">= start_date"
      - name: season
        type: enum
        source: input
        description: Season bucket used for seasonal-baseline matching and the tier 3 summer surcharge
        constraints: SUMMER | WINTER
      - name: rebilling_deadline_date
        type: string
        source: input
        description: Last calendar day on which a bill of this period may be rebilled or a read corrected, ISO date, inclusive
      - name: status
        type: enum
        source: system
        description: Period lifecycle; gates bill creation, credit posting and rebilling
        default: OPEN
        constraints: OPEN | CLOSED | LOCKED

  - name: ServiceAccount
    parent: null
    common_fields: true
    fields:
      - name: account_number
        type: string
        source: input
        description: Utility account number
        constraints: unique across ServiceAccount
      - name: customer_name
        type: string
        source: input
        description: Name of the account holder of record
      - name: service_address
        type: string
        source: input
        description: Premise address served by this account
      - name: rate_schedule_id
        type: string
        source: input
        description: FK -> RateSchedule.id; rate table applied to every Bill on this account
      - name: service_status
        type: enum
        source: system
        description: Physical-service dimension of the account state machine; evolves independently of credit_status
        default: ACTIVE
        constraints: ACTIVE | SHUTOFF_SCHEDULED | SHUTOFF_HELD | SHUTOFF_EXECUTED
      - name: credit_status
        type: enum
        source: computed
        description: Collections dimension of the account state machine, recomputed by calculations.account_credit_status after every AccountLedgerEntry insert and every PaymentArrangement status change
        default: CURRENT
        constraints: CURRENT | PAST_DUE | IN_ARRANGEMENT | ARRANGEMENT_DEFAULTED
      - name: balance_cents
        type: integer
        source: computed
        description: Signed receivable balance; equals sum of AccountLedgerEntry.amount_cents for this account_id
      - name: shutoff_scheduled_for
        type: datetime
        source: system
        description: Instant at or after which execute-shutoff may run; null unless service_status is SHUTOFF_SCHEDULED or SHUTOFF_HELD
      - name: open_investigation_hold_count
        type: integer
        source: computed
        description: Count of HighBillInvestigation rows for this account_id with shutoff_hold_active == true
      - name: open_rebill_count
        type: integer
        source: computed
        description: Count of Bill rows for this account_id with billing_status == REBILL_PENDING

  - name: Meter
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: FK -> ServiceAccount.id; account served by this meter
      - name: meter_serial
        type: string
        source: input
        description: Manufacturer serial number
        constraints: unique across Meter
      - name: meter_type
        type: enum
        source: input
        description: Billing role of the meter; only POTABLE_MASTER may carry a Bill
        constraints: POTABLE_MASTER | IRRIGATION_SUBMETER | BACKFLOW_FIRE_LINE
      - name: size_inches
        type: number
        source: input
        description: Nominal meter size; selects the bench-test accuracy variant (<= 2.0 uses AWWA_WEIGHTED, > 2.0 uses SIMPLE_MEAN)
        constraints: "> 0"
      - name: initial_register_value
        type: integer
        source: input
        description: Cumulative register value at installation, used as the prior read when no MeterReading precedes a period
        constraints: ">= 0"
      - name: parent_meter_id
        type: string
        source: input
        description: FK -> Meter.id; master meter this device sits behind. Required when meter_type is IRRIGATION_SUBMETER or BACKFLOW_FIRE_LINE, forbidden when POTABLE_MASTER
      - name: accuracy_status
        type: enum
        source: system
        description: Latest bench/field accuracy verdict for this meter
        default: UNTESTED
        constraints: UNTESTED | VERIFIED_ACCURATE | FAILED_FAST | FAILED_SLOW
      - name: accuracy_pct
        type: number
        source: system
        description: Registration accuracy percentage from the latest completed bench test, 2 decimal places; null until a bench test closes
      - name: correction_factor
        type: number
        source: system
        description: 100 / accuracy_pct rounded half-up to 6 decimal places; null until a bench test closes
      - name: last_test_completed_at
        type: datetime
        source: system
        description: tested_at of the most recently closed MeterTestRequest on this meter; anchors the 48-hour test quarantine window

  - name: MeterReading
    parent: null
    common_fields: true
    fields:
      - name: meter_id
        type: string
        source: input
        description: FK -> Meter.id; device this read belongs to
      - name: read_date
        type: string
        source: input
        description: Calendar date of the read, ISO date (YYYY-MM-DD)
      - name: read_type
        type: enum
        source: input
        description: Provenance of the read; CORRECTED supersedes an earlier read
        constraints: ACTUAL | ESTIMATED | CORRECTED
      - name: reading_value
        type: integer
        source: input
        description: Cumulative register value at read_date
        constraints: ">= 0"
      - name: corrects_reading_id
        type: string
        source: input
        description: FK -> MeterReading.id; the read this row supersedes. Required when read_type == CORRECTED, forbidden otherwise
      - name: superseded_by_reading_id
        type: string
        source: system
        description: FK -> MeterReading.id; set on the superseded row when a CORRECTED read is posted against it. Null means the row is live
      - name: consumption_since_prior_gallons
        type: integer
        source: computed
        description: reading_value minus the reading_value of the nearest live read strictly before read_date on the same meter, falling back to Meter.initial_register_value

  - name: Bill
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: FK -> ServiceAccount.id; account billed
      - name: period_id
        type: string
        source: input
        description: FK -> BillingPeriod.id; period billed
      - name: meter_id
        type: string
        source: input
        description: FK -> Meter.id; POTABLE_MASTER meter billed
      - name: consumption_gallons
        type: integer
        source: computed
        description: Master-meter volume for the period, derived at POST /bills from the live reads bounding the period and never supplied by the caller; recomputed by calculations.read_correction_reallocation when a CORRECTED read lands inside or adjacent to this period
        constraints: ">= 0"
      - name: read_type
        type: enum
        source: input
        description: Provenance of the period-end read created alongside this bill
        constraints: ACTUAL | ESTIMATED
      - name: estimated_flag
        type: boolean
        source: computed
        description: True when the live period-end read for this bill has read_type == ESTIMATED; suppresses irrigation-submeter sewer credit
      - name: seasonal_baseline_gallons
        type: integer
        source: computed
        description: Output of calculations.seasonal_baseline; null when baseline_sample_count < BASELINE_MIN_SAMPLES
      - name: baseline_sample_count
        type: integer
        source: computed
        description: Number of qualifying same-season prior bills that fed the baseline sample
      - name: anomaly_ratio
        type: number
        source: computed
        description: consumption_gallons / seasonal_baseline_gallons rounded half-up to 3 decimals; null when seasonal_baseline_gallons is null
      - name: anomaly_flag
        type: boolean
        source: computed
        description: True when anomaly_ratio >= ANOMALY_RATIO_THRESHOLD; false when anomaly_ratio is null
        default: false
      - name: water_charge_cents
        type: integer
        source: computed
        description: Output of calculations.tiered_water_charge
      - name: submeter_credit_gallons
        type: integer
        source: computed
        description: Irrigation-submeter gallons excluded from sewer billing, after the submeter_sewer_credit_cap_gallons cap
      - name: sewer_billable_gallons
        type: integer
        source: computed
        description: Gallons on which sewer volume is charged, after the sewer cap and then the submeter exclusion
      - name: sewer_charge_cents
        type: integer
        source: computed
        description: Output of calculations.sewer_charge_with_submeter_credit
      - name: total_charge_cents
        type: integer
        source: computed
        description: water_charge_cents + sewer_charge_cents
      - name: adjusted_total_cents
        type: integer
        source: computed
        description: total_charge_cents minus the sum of LeakAdjustment.net_credit_cents over LeakAdjustment rows with this bill_id and status == POSTED
      - name: due_date
        type: string
        source: system
        description: BillingPeriod.end_date plus BILL_DUE_DAYS calendar days, ISO date
      - name: billing_status
        type: enum
        source: system
        description: Bill lifecycle dimension
        default: DRAFT
        constraints: DRAFT | ISSUED | UNDER_INVESTIGATION | ADJUSTED | UPHELD_AS_BILLED | REBILL_PENDING | REBILLED
      - name: rebill_of_bill_id
        type: string
        source: system
        description: FK -> Bill.id; the superseded bill this replacement bill was generated from. Null on originally generated bills

  - name: HighBillInvestigation
    parent: null
    common_fields: true
    fields:
      - name: bill_id
        type: string
        source: input
        description: FK -> Bill.id; the bill under investigation
      - name: account_id
        type: string
        source: system
        description: FK -> ServiceAccount.id; copied from Bill.account_id at creation
      - name: reported_cause
        type: string
        source: input
        description: Free-text cause reported by the customer or intake rep
      - name: status
        type: enum
        source: system
        description: Investigation lifecycle
        default: OPEN
        constraints: OPEN | EVIDENCE_REQUESTED | EVIDENCE_UNDER_REVIEW | EVIDENCE_EXHAUSTED | DETERMINED | ADJUSTMENT_PENDING | APPEALED | RESOLVED | CLOSED_NO_ADJUSTMENT
      - name: leak_determination
        type: enum
        source: system
        description: Cause recorded by the determine transition
        default: UNDETERMINED
        constraints: UNDETERMINED | CUSTOMER_SIDE_LEAK | UTILITY_SIDE_LEAK | METER_ERROR | NO_LEAK | IRRIGATION_USE
      - name: determination_by_user_id
        type: string
        source: system
        description: X-User-ID of the rep who ran determine; the segregation-of-duties comparison target for adjustment approval and for hearing officers
      - name: determined_at
        type: datetime
        source: system
        description: Logical-clock instant at which determine ran; anchors the APPEAL_FILING_DAYS window
      - name: evidence_round_count
        type: integer
        source: system
        description: Number of evidence rounds opened so far; capped by MAX_EVIDENCE_ROUNDS
        default: 0
      - name: remand_count
        type: integer
        source: system
        description: Number of board remands absorbed; capped by REMAND_MAX
        default: 0
      - name: shutoff_hold_active
        type: boolean
        source: computed
        description: True while status is in {OPEN, EVIDENCE_REQUESTED, EVIDENCE_UNDER_REVIEW, EVIDENCE_EXHAUSTED, DETERMINED, ADJUSTMENT_PENDING, APPEALED}; false in RESOLVED and CLOSED_NO_ADJUSTMENT
      - name: opened_by_role
        type: enum
        source: system
        description: Role that created the investigation
        constraints: CUSTOMER | CUSTOMER_SERVICE_REP
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID of the creator

  - name: MeterTestRequest
    parent: null
    common_fields: true
    fields:
      - name: investigation_id
        type: string
        source: input
        description: FK -> HighBillInvestigation.id; investigation this test serves
      - name: meter_id
        type: string
        source: input
        description: FK -> Meter.id; device to be tested
      - name: requested_test_type
        type: enum
        source: input
        description: FIELD starts with an on-site test window; BENCH sends the meter straight to the bench
        constraints: FIELD | BENCH
      - name: requested_by_kind
        type: enum
        source: input
        description: Who bears the cost of the test. CUSTOMER means the customer funds it and a deposit is charged to the account; UTILITY means the utility funds it and no deposit is charged. Supplied in the request, so a rep or technician may file either kind on the customer's behalf
        constraints: CUSTOMER | UTILITY
      - name: deposit_cents
        type: integer
        source: input
        description: Deposit charged to the account for this test. Must equal METER_TEST_DEPOSIT_CENTS when requested_by_kind == CUSTOMER and must equal 0 when requested_by_kind == UTILITY, enforced by ERR_TEST_DEPOSIT_INVALID
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Test lifecycle; the three CLOSED_* branches carry divergent side-effect sets
        default: REQUESTED
        constraints: REQUESTED | FIELD_TEST_SCHEDULED | BENCH_TEST_PENDING | CLOSED_PASS | CLOSED_FAST | CLOSED_SLOW
      - name: window_start
        type: datetime
        source: system
        description: Inclusive start of the reserved field-test window on the meter
      - name: window_end
        type: datetime
        source: system
        description: Exclusive end of the reserved field-test window on the meter
      - name: tested_at
        type: datetime
        source: system
        description: Instant the field or bench test was performed
      - name: field_result
        type: enum
        source: system
        description: On-site verdict; SUSPECT escalates to the bench
        constraints: PASS | SUSPECT
      - name: low_flow_pct
        type: number
        source: system
        description: Bench registration accuracy at the low flow point, percent
      - name: mid_flow_pct
        type: number
        source: system
        description: Bench registration accuracy at the mid flow point, percent
      - name: high_flow_pct
        type: number
        source: system
        description: Bench registration accuracy at the high flow point, percent
      - name: accuracy_method
        type: enum
        source: computed
        description: Variant selected by calculations.bench_test_accuracy from Meter.size_inches
        constraints: AWWA_WEIGHTED | SIMPLE_MEAN
      - name: accuracy_pct
        type: number
        source: computed
        description: Composite registration accuracy, 2 decimal places
      - name: bench_result
        type: enum
        source: computed
        description: Threshold classification of accuracy_pct
        constraints: PASS | FAST | SLOW
      - name: deposit_refunded
        type: boolean
        source: system
        description: True once a METER_TEST_DEPOSIT_REFUND ledger entry has been written for this request
        default: false

  - name: RepairProof
    parent: null
    common_fields: true
    fields:
      - name: investigation_id
        type: string
        source: input
        description: FK -> HighBillInvestigation.id; investigation this proof answers
      - name: plumber_license_no
        type: string
        source: input
        description: State licence number of the plumber who performed the repair
      - name: repair_date
        type: string
        source: input
        description: Calendar date the repair was completed, ISO date
      - name: leak_type
        type: enum
        source: input
        description: Physical leak class; selects the adjustment variant and sewer-relief eligibility
        constraints: SERVICE_LINE | UNDERGROUND | TOILET | IRRIGATION | POOL
      - name: invoice_amount_cents
        type: integer
        source: input
        description: Plumber invoice total, recorded for audit only; never enters the credit formula
        constraints: ">= 0"
      - name: description
        type: string
        source: input
        description: Free-text description of the repair
      - name: status
        type: enum
        source: system
        description: Review state of the proof
        default: SUBMITTED
        constraints: SUBMITTED | VERIFIED | REJECTED
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the rep who verified the proof
      - name: rejection_reason
        type: string
        source: system
        description: Reason recorded when the proof was rejected

  - name: LeakAdjustment
    parent: null
    common_fields: true
    fields:
      - name: investigation_id
        type: string
        source: input
        description: FK -> HighBillInvestigation.id; investigation authorising this credit
      - name: bill_id
        type: string
        source: input
        description: FK -> Bill.id; bill being credited. Must equal HighBillInvestigation.bill_id
      - name: leak_type
        type: enum
        source: input
        description: Leak class driving the variant; must equal the leak_type of a VERIFIED RepairProof on the investigation unless board_ordered is true
        constraints: SERVICE_LINE | UNDERGROUND | TOILET | IRRIGATION | POOL
      - name: variant_applied
        type: enum
        source: computed
        description: Credit variant chosen by calculations.leak_adjustment_credit
        constraints: EXCESS_REPRICE | BASELINE_REBILL
      - name: excess_gallons
        type: integer
        source: computed
        description: max(0, Bill.consumption_gallons - Bill.seasonal_baseline_gallons)
      - name: water_credit_cents
        type: integer
        source: computed
        description: Water portion of the credit before cap and fee
      - name: sewer_relief_gallons
        type: integer
        source: computed
        description: Gallons of sewer relief granted, zero when leak_type is not sewer-relief eligible
      - name: sewer_credit_cents
        type: integer
        source: computed
        description: Sewer portion of the credit before cap and fee
      - name: gross_credit_cents
        type: integer
        source: computed
        description: water_credit_cents + sewer_credit_cents
      - name: cap_cents
        type: integer
        source: computed
        description: min(MAX_CREDIT_CENTS, round_half_up(Bill.total_charge_cents * MAX_CREDIT_PCT_BP / 10000))
      - name: capped_credit_cents
        type: integer
        source: computed
        description: min(gross_credit_cents, cap_cents)
      - name: cap_applied
        type: boolean
        source: computed
        description: True when gross_credit_cents > cap_cents
      - name: admin_fee_charged_cents
        type: integer
        source: computed
        description: 0 when capped_credit_cents >= RateSchedule.admin_fee_waiver_threshold_cents, else min(RateSchedule.admin_fee_cents, capped_credit_cents)
      - name: net_credit_cents
        type: integer
        source: computed
        description: capped_credit_cents - admin_fee_charged_cents
      - name: status
        type: enum
        source: system
        description: Adjustment lifecycle
        default: DRAFT
        constraints: DRAFT | PENDING_APPROVAL | APPROVED | POSTED | DENIED | REVERSED
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the rep who created the draft
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the supervisor who approved the credit
      - name: posted_at
        type: datetime
        source: system
        description: Logical-clock instant the credit hit the ledger
      - name: supersedes_adjustment_id
        type: string
        source: system
        description: FK -> LeakAdjustment.id; the DENIED or REVERSED adjustment this board-ordered adjustment replaces
      - name: board_ordered
        type: boolean
        source: system
        description: True when this adjustment was created by a BoardAppeal REVERSE decision rather than by a rep
        default: false
      - name: return_reason
        type: string
        source: system
        description: Reason recorded when a supervisor returned the adjustment to DRAFT
      - name: denial_reason
        type: string
        source: system
        description: Reason recorded on denial
      - name: reversal_reason
        type: string
        source: system
        description: Reason recorded on reversal

  - name: PaymentArrangement
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: FK -> ServiceAccount.id; account entering the arrangement
      - name: bill_id
        type: string
        source: input
        description: FK -> Bill.id; bill whose adjusted_total_cents the arrangement finances
      - name: investigation_id
        type: string
        source: input
        description: FK -> HighBillInvestigation.id; investigation the arrangement was negotiated under, null when the arrangement is unrelated to an investigation
      - name: total_amount_cents
        type: integer
        source: input
        description: Amount financed; must equal Bill.adjusted_total_cents at creation time
        constraints: "> 0"
      - name: down_payment_cents
        type: integer
        source: input
        description: "Up-front payment collected at activation. The minimum share of total_amount_cents is a business rule, not a schema range: it is enforced at priority 13 by ERR_DOWN_PAYMENT_TOO_LOW, and down_payment_cents > total_amount_cents is refused by the same rule's companion clause"
        constraints: ">= 0"
      - name: installment_count
        type: integer
        source: input
        description: "Number of monthly instalments financing total_amount_cents - down_payment_cents. The upper bound is a business rule, not a schema range: installment_count > MAX_INSTALLMENTS is refused at priority 11 by ERR_INSTALLMENT_LIMIT_EXCEEDED"
        constraints: ">= 1"
      - name: installment_cents
        type: integer
        source: computed
        description: Regular instalment amount, applied to instalments 1..installment_count-1
      - name: final_installment_cents
        type: integer
        source: computed
        description: Amount of the last instalment; absorbs the whole division remainder
      - name: paid_installment_count
        type: integer
        source: system
        description: Number of on-time instalments recorded
        default: 0
      - name: missed_payment_count
        type: integer
        source: system
        description: Number of late instalments recorded; MISSED_PAYMENTS_TO_DEFAULT triggers default
        default: 0
      - name: reinstatement_count
        type: integer
        source: system
        description: Number of times the arrangement has been reinstated after default; capped by MAX_ARRANGEMENT_REINSTATEMENTS
        default: 0
      - name: status
        type: enum
        source: system
        description: Arrangement lifecycle with a single reinstatement cycle
        default: PROPOSED
        constraints: PROPOSED | ACTIVE | DEFAULTED | COMPLETED | CANCELLED

  - name: BoardAppeal
    parent: null
    common_fields: true
    fields:
      - name: investigation_id
        type: string
        source: input
        description: FK -> HighBillInvestigation.id; investigation being appealed
      - name: grounds
        type: string
        source: input
        description: Written grounds for the appeal
      - name: filed_by_user_id
        type: string
        source: system
        description: X-User-ID of the filer
      - name: filing_date
        type: datetime
        source: system
        description: Logical-clock instant of filing; anchors HEARING_MIN_NOTICE_DAYS
      - name: hearing_date
        type: string
        source: system
        description: Calendar date of the board hearing, ISO date; null until scheduled
      - name: hearing_officer_user_id
        type: string
        source: system
        description: X-User-ID of the clerk who recorded the decision
      - name: status
        type: enum
        source: system
        description: Appeal lifecycle; the three decision branches carry divergent side-effect sets
        default: FILED
        constraints: FILED | SCHEDULED | UPHELD | REVERSED | REMANDED
      - name: decision
        type: enum
        source: system
        description: Board verdict recorded at the hearing
        constraints: UPHOLD | REVERSE | REMAND
      - name: decision_note
        type: string
        source: system
        description: Free-text note recorded with the verdict

  - name: AccountLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: system
        description: FK -> ServiceAccount.id; account whose balance this entry moves
      - name: bill_id
        type: string
        source: system
        description: FK -> Bill.id; bill this entry relates to, null for account-level payments
      - name: entry_type
        type: enum
        source: system
        description: Sign convention marker; CHARGE and REVERSAL-of-credit are positive, CREDIT and PAYMENT are negative
        constraints: CHARGE | CREDIT | PAYMENT | REVERSAL
      - name: amount_cents
        type: integer
        source: system
        description: Signed movement applied to ServiceAccount.balance_cents
      - name: source_kind
        type: enum
        source: system
        description: Which rule produced the entry
        constraints: BILL_CHARGE | REBILL_REVERSAL | REBILL_CHARGE | LEAK_ADJUSTMENT_CREDIT | LEAK_ADJUSTMENT_ADMIN_FEE | LEAK_ADJUSTMENT_REVERSAL | METER_TEST_DEPOSIT | METER_TEST_DEPOSIT_REFUND | CUSTOMER_PAYMENT | ARRANGEMENT_DOWN_PAYMENT | ARRANGEMENT_INSTALLMENT
      - name: source_id
        type: string
        source: system
        description: Polymorphic id of the originating row (Bill, LeakAdjustment, MeterTestRequest or PaymentArrangement). Deliberately NOT a declared foreign key because the target entity varies by source_kind
      - name: memo
        type: string
        source: system
        description: Free-text memo
      - name: effective_at
        type: datetime
        source: system
        description: Logical-clock instant at which the entry was written

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # BillingPeriod — linear gate that every fiscal write consults
  # ---------------------------------------------------------------------------
  - entity: BillingPeriod
    initial_state: OPEN
    terminal_states: [LOCKED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /billing-periods/{id}/close"
        actor: SystemAdmin
        preconditions:
          - "period.status == OPEN"
        side_effects:
          - "No further Bill may be created for this period (ERR_BILLING_PERIOD_CLOSED); leak-adjustment posting and rebilling remain permitted"
      - from: CLOSED
        to: LOCKED
        trigger: "POST /billing-periods/{id}/lock"
        actor: SystemAdmin
        preconditions:
          - "period.status == CLOSED"
        side_effects:
          - "All fiscal writes touching a Bill of this period are refused with ERR_BILLING_PERIOD_LOCKED: leak-adjustment approval, leak-adjustment reversal, rebilling, and CORRECTED MeterReading posting"

  # ---------------------------------------------------------------------------
  # ServiceAccount — PARALLEL state dimensions (Rule 3)
  #   dimension A: service_status  (physical service)
  #   dimension B: credit_status   (collections, fully derived)
  # The two dimensions advance independently: a credit_status change never by
  # itself blocks a service_status trigger, and vice versa.
  # ---------------------------------------------------------------------------
  - entity: ServiceAccount
    initial_state: "service_status=ACTIVE; credit_status=CURRENT"
    terminal_states: []
    note: |
      Two independent dimensions on one row. Dimension B is a pure function
      (calculations.account_credit_status) recomputed after every
      AccountLedgerEntry insert and every PaymentArrangement status change.
      Dimension A is trigger-driven but consults dimension B in its
      preconditions and in one system transition.
    transitions:
      # ---- dimension A: service_status ----
      - from: "service_status=ACTIVE"
        to: "service_status=SHUTOFF_SCHEDULED"
        trigger: "POST /service-accounts/{id}/schedule-shutoff"
        actor: BillingSupervisor
        preconditions:
          - "account.service_status == ACTIVE"
          - "account.credit_status IN {PAST_DUE, ARRANGEMENT_DEFAULTED}"
        side_effects:
          - "shutoff_scheduled_for = clock_now + SHUTOFF_NOTICE_DAYS calendar days"
      - from: "service_status=SHUTOFF_SCHEDULED"
        to: "service_status=SHUTOFF_HELD"
        trigger: "system event: account.open_investigation_hold_count + account.open_rebill_count transitions from 0 to a positive number"
        actor: system
        preconditions:
          - "account.service_status == SHUTOFF_SCHEDULED"
        side_effects:
          - "shutoff_scheduled_for is preserved unchanged so the notice period resumes when the hold lifts"
      - from: "service_status=SHUTOFF_HELD"
        to: "service_status=SHUTOFF_SCHEDULED"
        trigger: "system event: account.open_investigation_hold_count + account.open_rebill_count returns to 0 while account.credit_status IN {PAST_DUE, ARRANGEMENT_DEFAULTED}"
        actor: system
        preconditions:
          - "account.service_status == SHUTOFF_HELD"
        side_effects:
          - "shutoff_scheduled_for unchanged"
      - from: "service_status=SHUTOFF_HELD"
        to: "service_status=ACTIVE"
        trigger: "system event: account.credit_status becomes CURRENT or IN_ARRANGEMENT"
        actor: system
        preconditions:
          - "account.service_status == SHUTOFF_HELD"
        side_effects:
          - "shutoff_scheduled_for = null"
        note: "Evaluated after the credit_status recompute; this is link 4 of the approve-adjustment cascade"
      - from: "service_status=SHUTOFF_SCHEDULED"
        to: "service_status=ACTIVE"
        trigger: "system event: account.credit_status becomes CURRENT or IN_ARRANGEMENT"
        actor: system
        preconditions:
          - "account.service_status == SHUTOFF_SCHEDULED"
        side_effects:
          - "shutoff_scheduled_for = null"
      - from: "service_status=SHUTOFF_SCHEDULED"
        to: "service_status=SHUTOFF_EXECUTED"
        trigger: "POST /service-accounts/{id}/execute-shutoff"
        actor: BillingSupervisor
        preconditions:
          - "account.service_status == SHUTOFF_SCHEDULED"
          - "clock_now >= account.shutoff_scheduled_for"
          - "account.open_investigation_hold_count == 0 AND account.open_rebill_count == 0"
          - "account.credit_status IN {PAST_DUE, ARRANGEMENT_DEFAULTED}"
        side_effects:
          - "shutoff_scheduled_for = null"
      - from: "service_status=SHUTOFF_EXECUTED"
        to: "service_status=ACTIVE"
        trigger: "system event: account.credit_status becomes CURRENT or IN_ARRANGEMENT"
        actor: system
        preconditions:
          - "account.service_status == SHUTOFF_EXECUTED"
        side_effects:
          - "Service restored; shutoff_scheduled_for = null"

      # ---- dimension B: credit_status (derived) ----
      - from: "credit_status=CURRENT"
        to: "credit_status=PAST_DUE"
        trigger: "system event: AccountLedgerEntry inserted and calculations.account_credit_status yields PAST_DUE"
        actor: system
        preconditions:
          - "no PaymentArrangement for this account with status IN {ACTIVE, DEFAULTED}"
          - "account.balance_cents > PAST_DUE_THRESHOLD_CENTS"
        side_effects:
          - "Enables schedule-shutoff"
      - from: "credit_status=PAST_DUE"
        to: "credit_status=CURRENT"
        trigger: "system event: AccountLedgerEntry inserted and calculations.account_credit_status yields CURRENT"
        actor: system
        preconditions:
          - "no PaymentArrangement for this account with status IN {ACTIVE, DEFAULTED}"
          - "account.balance_cents <= PAST_DUE_THRESHOLD_CENTS"
        side_effects:
          - "Triggers the service_status transitions to ACTIVE from SHUTOFF_SCHEDULED, SHUTOFF_HELD or SHUTOFF_EXECUTED"
      - from: "credit_status IN {CURRENT, PAST_DUE}"
        to: "credit_status=IN_ARRANGEMENT"
        trigger: "system event: a PaymentArrangement for this account reaches ACTIVE"
        actor: system
        preconditions:
          - "PaymentArrangement.status == ACTIVE"
        side_effects:
          - "credit_status is pinned to IN_ARRANGEMENT regardless of balance_cents while the arrangement is ACTIVE"
      - from: "credit_status=IN_ARRANGEMENT"
        to: "credit_status=ARRANGEMENT_DEFAULTED"
        trigger: "system event: the ACTIVE PaymentArrangement reaches DEFAULTED"
        actor: system
        preconditions:
          - "PaymentArrangement.status == DEFAULTED"
        side_effects:
          - "Enables schedule-shutoff again"
      - from: "credit_status=ARRANGEMENT_DEFAULTED"
        to: "credit_status=IN_ARRANGEMENT"
        trigger: "system event: POST /payment-arrangements/{id}/reinstate returns the arrangement to ACTIVE"
        actor: system
        preconditions:
          - "PaymentArrangement.status == ACTIVE"
        side_effects: []
      - from: "credit_status=IN_ARRANGEMENT"
        to: "credit_status IN {CURRENT, PAST_DUE}"
        trigger: "system event: the ACTIVE PaymentArrangement reaches COMPLETED or CANCELLED"
        actor: system
        preconditions:
          - "no PaymentArrangement for this account with status IN {ACTIVE, DEFAULTED}"
        side_effects:
          - "credit_status falls back to the balance comparison: PAST_DUE when balance_cents > PAST_DUE_THRESHOLD_CENTS, else CURRENT"

  # ---------------------------------------------------------------------------
  # Bill — BRANCHING fork with divergent side-effect sets, plus one revert edge
  # ---------------------------------------------------------------------------
  - entity: Bill
    initial_state: DRAFT
    terminal_states: [UPHELD_AS_BILLED, REBILLED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /bills/{id}/issue"
        actor: BillingSupervisor
        preconditions:
          - "bill.billing_status == DRAFT"
          - "bill.period.status IN {OPEN, CLOSED}"
        side_effects:
          - "due_date = bill.period.end_date + BILL_DUE_DAYS calendar days"
          - "Insert AccountLedgerEntry{entry_type: CHARGE, source_kind: BILL_CHARGE, amount_cents: +bill.total_charge_cents, bill_id: bill.id, source_id: bill.id}"
          - "Recompute ServiceAccount.balance_cents, then ServiceAccount.credit_status via calculations.account_credit_status"
          - "The bill becomes eligible as a seasonal-baseline sample (calculations.seasonal_baseline admits ISSUED, ADJUSTED and UPHELD_AS_BILLED bills only)"
      - from: ISSUED
        to: UNDER_INVESTIGATION
        trigger: "system event: POST /investigations creates a HighBillInvestigation with this bill_id"
        actor: system
        preconditions:
          - "bill.billing_status == ISSUED"
        side_effects:
          - "The bill stops being an eligible baseline sample only if anomaly_flag is true; the status itself does not disqualify it"
      - from: UNDER_INVESTIGATION
        to: ADJUSTED
        trigger: "system event: a LeakAdjustment with this bill_id reaches POSTED"
        actor: system
        preconditions:
          - "bill.billing_status == UNDER_INVESTIGATION"
        side_effects:
          - "Recompute bill.adjusted_total_cents"
        note: "Branch 1 of the fork out of UNDER_INVESTIGATION — credit granted"
      - from: UNDER_INVESTIGATION
        to: UPHELD_AS_BILLED
        trigger: "POST /investigations/{id}/close-no-adjustment, or system event: a BoardAppeal on this bill's investigation records decision UPHOLD"
        actor: "CustomerServiceRep | system"
        preconditions:
          - "bill.billing_status == UNDER_INVESTIGATION"
        side_effects:
          - "bill.adjusted_total_cents stays equal to total_charge_cents"
          - "No ledger entry is written"
        note: "Branch 2 of the fork — terminal, no fiscal movement, divergent from branch 1"
      - from: ADJUSTED
        to: ISSUED
        trigger: "system event: the POSTED LeakAdjustment for this bill reaches REVERSED"
        actor: system
        preconditions:
          - "bill.billing_status == ADJUSTED"
        side_effects:
          - "Recompute bill.adjusted_total_cents back to total_charge_cents"
        note: "Compensation revert edge — makes the Bill machine non-linear"
      - from: "ISSUED | UNDER_INVESTIGATION | ADJUSTED"
        to: REBILL_PENDING
        trigger: "system event: a CORRECTED MeterReading changes this bill's consumption_gallons, or a MeterTestRequest on this bill's meter closes CLOSED_FAST"
        actor: system
        preconditions:
          - "bill.billing_status IN {ISSUED, UNDER_INVESTIGATION, ADJUSTED}"
          - "bill.period.status != LOCKED"
        side_effects:
          - "Recompute bill.consumption_gallons, water_charge_cents, submeter_credit_gallons, sewer_billable_gallons, sewer_charge_cents and total_charge_cents from the live reads"
          - "Increment ServiceAccount.open_rebill_count, which drives the account's SHUTOFF_SCHEDULED -> SHUTOFF_HELD transition"
        note: "Branch 3 of the fork — recompute-and-hold, divergent from branches 1 and 2"
      - from: REBILL_PENDING
        to: REBILLED
        trigger: "POST /bills/{id}/rebill"
        actor: BillingSupervisor
        preconditions:
          - "bill.billing_status == REBILL_PENDING"
          - "bill.period.status != LOCKED"
          - "clock_now (date part) <= bill.period.rebilling_deadline_date"
        side_effects:
          - "Create replacement Bill{account_id, period_id, meter_id, consumption_gallons, read_type copied from the superseded bill, rebill_of_bill_id = bill.id} in DRAFT, then immediately auto-transition it DRAFT -> ISSUED"
          - "Insert AccountLedgerEntry{entry_type: REVERSAL, source_kind: REBILL_REVERSAL, amount_cents: -original_charge_total, bill_id: bill.id, source_id: bill.id} where original_charge_total is the sum of amount_cents over this bill's BILL_CHARGE and REBILL_CHARGE entries"
          - "The replacement bill's auto-issue writes AccountLedgerEntry{entry_type: CHARGE, source_kind: REBILL_CHARGE, amount_cents: +replacement.total_charge_cents}"
          - "Decrement ServiceAccount.open_rebill_count, which may return service_status SHUTOFF_HELD -> SHUTOFF_SCHEDULED or -> ACTIVE"
          - "The superseded bill leaves the seasonal-baseline sample pool (REBILLED is excluded); the replacement joins it"

  # ---------------------------------------------------------------------------
  # HighBillInvestigation — CYCLIC (three distinct back-edges)
  # ---------------------------------------------------------------------------
  - entity: HighBillInvestigation
    initial_state: OPEN
    terminal_states: [CLOSED_NO_ADJUSTMENT]
    note: |
      RESOLVED is settled but re-openable: reversing a posted adjustment returns the
      investigation to DETERMINED. Only CLOSED_NO_ADJUSTMENT is truly terminal.
    transitions:
      - from: OPEN
        to: EVIDENCE_REQUESTED
        trigger: "POST /investigations/{id}/request-evidence"
        actor: CustomerServiceRep
        preconditions:
          - "investigation.status IN {OPEN, EVIDENCE_REQUESTED}"
          - "investigation.evidence_round_count < MAX_EVIDENCE_ROUNDS"
        side_effects:
          - "evidence_round_count += 1"
      - from: EVIDENCE_REQUESTED
        to: EVIDENCE_UNDER_REVIEW
        trigger: "system event: a RepairProof is created for this investigation, or a MeterTestRequest for this investigation reaches CLOSED_PASS, CLOSED_FAST or CLOSED_SLOW"
        actor: system
        preconditions:
          - "investigation.status == EVIDENCE_REQUESTED"
        side_effects: []
      - from: EVIDENCE_UNDER_REVIEW
        to: EVIDENCE_REQUESTED
        trigger: "system event: POST /repair-proofs/{id}/reject on a proof of this investigation while evidence_round_count < MAX_EVIDENCE_ROUNDS"
        actor: system
        preconditions:
          - "investigation.status == EVIDENCE_UNDER_REVIEW"
          - "investigation.evidence_round_count < MAX_EVIDENCE_ROUNDS"
        side_effects:
          - "evidence_round_count += 1"
        note: "BACK-EDGE 1 — the revision loop that makes this machine cyclic"
      - from: EVIDENCE_UNDER_REVIEW
        to: EVIDENCE_EXHAUSTED
        trigger: "system event: POST /repair-proofs/{id}/reject on a proof of this investigation while evidence_round_count == MAX_EVIDENCE_ROUNDS"
        actor: system
        preconditions:
          - "investigation.status == EVIDENCE_UNDER_REVIEW"
          - "investigation.evidence_round_count >= MAX_EVIDENCE_ROUNDS"
        side_effects:
          - "evidence_round_count is NOT incremented — the loop is closed instead"
      - from: EVIDENCE_UNDER_REVIEW
        to: DETERMINED
        trigger: "POST /investigations/{id}/determine"
        actor: CustomerServiceRep
        preconditions:
          - "investigation.status == EVIDENCE_UNDER_REVIEW"
          - "bill.seasonal_baseline_gallons IS NOT NULL"
          - "when leak_determination IN {CUSTOMER_SIDE_LEAK, UTILITY_SIDE_LEAK}: at least one RepairProof for this investigation has status == VERIFIED"
          - "when leak_determination == METER_ERROR: at least one MeterTestRequest for this investigation has status IN {CLOSED_FAST, CLOSED_SLOW}"
        side_effects:
          - "leak_determination = request body value"
          - "determination_by_user_id = X-User-ID; determined_at = clock_now"
      - from: "OPEN | EVIDENCE_REQUESTED | EVIDENCE_UNDER_REVIEW | EVIDENCE_EXHAUSTED"
        to: CLOSED_NO_ADJUSTMENT
        trigger: "POST /investigations/{id}/close-no-adjustment"
        actor: CustomerServiceRep
        preconditions:
          - "investigation.status IN {OPEN, EVIDENCE_REQUESTED, EVIDENCE_UNDER_REVIEW, EVIDENCE_EXHAUSTED}"
        side_effects:
          - "shutoff_hold_active becomes false, decrementing ServiceAccount.open_investigation_hold_count"
          - "Bill UNDER_INVESTIGATION -> UPHELD_AS_BILLED"
      - from: DETERMINED
        to: ADJUSTMENT_PENDING
        trigger: "system event: POST /leak-adjustments creates a LeakAdjustment for this investigation"
        actor: system
        preconditions:
          - "investigation.status == DETERMINED"
        side_effects: []
      - from: ADJUSTMENT_PENDING
        to: DETERMINED
        trigger: "system event: the LeakAdjustment for this investigation reaches DENIED"
        actor: system
        preconditions:
          - "investigation.status == ADJUSTMENT_PENDING"
        side_effects: []
        note: "BACK-EDGE 2 — a denied adjustment returns the investigation to DETERMINED so a new draft may be raised"
      - from: ADJUSTMENT_PENDING
        to: RESOLVED
        trigger: "system event: the LeakAdjustment for this investigation reaches POSTED"
        actor: system
        preconditions:
          - "investigation.status == ADJUSTMENT_PENDING"
        side_effects:
          - "shutoff_hold_active becomes false, decrementing ServiceAccount.open_investigation_hold_count"
      - from: RESOLVED
        to: DETERMINED
        trigger: "system event: the POSTED LeakAdjustment for this investigation reaches REVERSED"
        actor: system
        preconditions:
          - "investigation.status == RESOLVED"
        side_effects:
          - "shutoff_hold_active becomes true again, incrementing ServiceAccount.open_investigation_hold_count"
        note: "BACK-EDGE 3 — reversal re-opens the investigation"
      - from: "DETERMINED | RESOLVED | CLOSED_NO_ADJUSTMENT"
        to: APPEALED
        trigger: "system event: POST /board-appeals files an appeal on this investigation"
        actor: system
        preconditions:
          - "investigation.status IN {DETERMINED, RESOLVED, CLOSED_NO_ADJUSTMENT}"
          - "investigation.determined_at IS NOT NULL for DETERMINED and RESOLVED; for CLOSED_NO_ADJUSTMENT the close instant is used"
        side_effects:
          - "shutoff_hold_active becomes true (or stays true), so a shutoff cannot be executed while the appeal is pending"
      - from: APPEALED
        to: EVIDENCE_REQUESTED
        trigger: "system event: POST /board-appeals/{id}/record-decision with decision REMAND"
        actor: system
        preconditions:
          - "investigation.status == APPEALED"
          - "investigation.remand_count < REMAND_MAX"
        side_effects:
          - "remand_count += 1; evidence_round_count += 1"
          - "Bill returns UPHELD_AS_BILLED -> UNDER_INVESTIGATION when it had been upheld, otherwise stays UNDER_INVESTIGATION"
        note: "BACK-EDGE 4 — board remand re-opens the evidence loop"
      - from: APPEALED
        to: RESOLVED
        trigger: "system event: POST /board-appeals/{id}/record-decision with decision UPHOLD"
        actor: system
        preconditions:
          - "investigation.status == APPEALED"
        side_effects:
          - "shutoff_hold_active becomes false"
          - "Bill UNDER_INVESTIGATION -> UPHELD_AS_BILLED"
      - from: APPEALED
        to: ADJUSTMENT_PENDING
        trigger: "system event: POST /board-appeals/{id}/record-decision with decision REVERSE"
        actor: system
        preconditions:
          - "investigation.status == APPEALED"
        side_effects:
          - "Create LeakAdjustment{investigation_id, bill_id = investigation.bill_id, leak_type = the leak_type of the most recent VERIFIED RepairProof on this investigation ordered by created_at DESC then version DESC, board_ordered: true, supersedes_adjustment_id = the most recent LeakAdjustment on this investigation with status IN {DENIED, REVERSED} ordered by created_at DESC then version DESC, null when that candidate set is empty} directly in PENDING_APPROVAL"
          - "The board-ordered adjustment is computed with variant_applied forced to BASELINE_REBILL regardless of leak_type"

  # ---------------------------------------------------------------------------
  # MeterTestRequest — BRANCHING, three terminal branches with divergent effects
  # ---------------------------------------------------------------------------
  - entity: MeterTestRequest
    initial_state: REQUESTED
    terminal_states: [CLOSED_PASS, CLOSED_FAST, CLOSED_SLOW]
    transitions:
      - from: REQUESTED
        to: BENCH_TEST_PENDING
        trigger: "system event: creation with requested_test_type == BENCH auto-advances immediately after the deposit entry is written"
        actor: system
        preconditions:
          - "request.requested_test_type == BENCH"
        side_effects: []
      - from: REQUESTED
        to: FIELD_TEST_SCHEDULED
        trigger: "POST /meter-test-requests/{id}/schedule-field-test"
        actor: MeterTechnician
        preconditions:
          - "request.status == REQUESTED AND request.requested_test_type == FIELD"
          - "window_end > window_start"
          - "the half-open interval [window_start, window_end) does not intersect the [window_start, window_end) interval of any other MeterTestRequest on the same meter_id with status IN {FIELD_TEST_SCHEDULED, BENCH_TEST_PENDING}"
          - "when Meter.last_test_completed_at IS NOT NULL: window_start >= Meter.last_test_completed_at + METER_TEST_QUARANTINE_HOURS hours"
        side_effects:
          - "window_start and window_end are recorded, reserving the meter for that half-open interval"
      - from: FIELD_TEST_SCHEDULED
        to: CLOSED_PASS
        trigger: "POST /meter-test-requests/{id}/record-field-result with field_result == PASS"
        actor: MeterTechnician
        preconditions:
          - "request.status == FIELD_TEST_SCHEDULED"
          - "request.window_start <= tested_at < request.window_end"
        side_effects:
          - "Meter.accuracy_status = VERIFIED_ACCURATE; Meter.last_test_completed_at = tested_at"
          - "Deposit is FORFEITED: no METER_TEST_DEPOSIT_REFUND entry is written and deposit_refunded stays false"
          - "Investigation EVIDENCE_REQUESTED -> EVIDENCE_UNDER_REVIEW"
        note: "Branch A — divergent from B and C in both the ledger effect and the absence of any read correction"
      - from: FIELD_TEST_SCHEDULED
        to: BENCH_TEST_PENDING
        trigger: "POST /meter-test-requests/{id}/record-field-result with field_result == SUSPECT"
        actor: MeterTechnician
        preconditions:
          - "request.status == FIELD_TEST_SCHEDULED"
          - "request.window_start <= tested_at < request.window_end"
        side_effects:
          - "field_result = SUSPECT; the meter reservation is released so a later request may take an adjacent window"
      - from: BENCH_TEST_PENDING
        to: CLOSED_PASS
        trigger: "POST /meter-test-requests/{id}/record-bench-result yielding bench_result == PASS"
        actor: MeterTechnician
        preconditions:
          - "request.status == BENCH_TEST_PENDING"
          - "SLOW_THRESHOLD_PCT <= accuracy_pct <= FAST_THRESHOLD_PCT"
        side_effects:
          - "Meter.accuracy_status = VERIFIED_ACCURATE; Meter.accuracy_pct and Meter.correction_factor are stored; Meter.last_test_completed_at = tested_at"
          - "Deposit is FORFEITED"
          - "Investigation EVIDENCE_REQUESTED -> EVIDENCE_UNDER_REVIEW"
      - from: BENCH_TEST_PENDING
        to: CLOSED_SLOW
        trigger: "POST /meter-test-requests/{id}/record-bench-result yielding bench_result == SLOW"
        actor: MeterTechnician
        preconditions:
          - "request.status == BENCH_TEST_PENDING"
          - "accuracy_pct < SLOW_THRESHOLD_PCT"
        side_effects:
          - "Meter.accuracy_status = FAILED_SLOW; Meter.accuracy_pct and Meter.correction_factor stored; Meter.last_test_completed_at = tested_at"
          - "Deposit REFUNDED when deposit_cents > 0: insert AccountLedgerEntry{entry_type: CREDIT, source_kind: METER_TEST_DEPOSIT_REFUND, amount_cents: -deposit_cents}; deposit_refunded = true"
          - "NO CORRECTED MeterReading is created and NO bill enters REBILL_PENDING — a slow meter under-billed the customer and the utility does not back-bill"
          - "Investigation EVIDENCE_REQUESTED -> EVIDENCE_UNDER_REVIEW"
        note: "Branch B — same deposit effect as C, opposite read-correction effect"
      - from: BENCH_TEST_PENDING
        to: CLOSED_FAST
        trigger: "POST /meter-test-requests/{id}/record-bench-result yielding bench_result == FAST"
        actor: MeterTechnician
        preconditions:
          - "request.status == BENCH_TEST_PENDING"
          - "accuracy_pct > FAST_THRESHOLD_PCT"
        side_effects:
          - "CASCADE LINK 1: Meter.accuracy_status = FAILED_FAST; Meter.accuracy_pct stored; Meter.correction_factor = round_half_up(100 / accuracy_pct, 6); Meter.last_test_completed_at = tested_at"
          - "CASCADE LINK 2 (caused by link 1): because the meter is now FAILED_FAST, insert a CORRECTED MeterReading against the live read with the greatest read_date on that meter (tie-break created_at DESC), with reading_value = prior_live_read.reading_value + round_half_up(target.consumption_since_prior_gallons * Meter.correction_factor); the superseded row gets superseded_by_reading_id set. Scope is METER_ERROR_CORRECTION_SCOPE = LATEST_LIVE_READ_ONLY"
          - "CASCADE LINK 3 (caused by link 2): the bill whose period contains the corrected read_date recomputes consumption_gallons and all charge fields and moves to REBILL_PENDING"
          - "CASCADE LINK 4 (caused by link 3): ServiceAccount.open_rebill_count increments, moving service_status SHUTOFF_SCHEDULED -> SHUTOFF_HELD"
          - "Deposit REFUNDED when deposit_cents > 0: insert AccountLedgerEntry{entry_type: CREDIT, source_kind: METER_TEST_DEPOSIT_REFUND, amount_cents: -deposit_cents}; deposit_refunded = true"
          - "Investigation EVIDENCE_REQUESTED -> EVIDENCE_UNDER_REVIEW"
        note: "Branch C — the only branch that mutates readings, bills and account service state"

  # ---------------------------------------------------------------------------
  # RepairProof — small branching machine feeding the investigation loop
  # ---------------------------------------------------------------------------
  - entity: RepairProof
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /repair-proofs/{id}/verify"
        actor: CustomerServiceRep
        preconditions:
          - "proof.status == SUBMITTED"
          - "proof.investigation.status == EVIDENCE_UNDER_REVIEW"
          - "proof.repair_date >= proof.investigation.bill.period.start_date"
        side_effects:
          - "verified_by_user_id = X-User-ID"
          - "The investigation becomes eligible for determine with leak_determination CUSTOMER_SIDE_LEAK or UTILITY_SIDE_LEAK"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /repair-proofs/{id}/reject"
        actor: CustomerServiceRep
        preconditions:
          - "proof.status == SUBMITTED"
          - "proof.investigation.status == EVIDENCE_UNDER_REVIEW"
        side_effects:
          - "rejection_reason recorded"
          - "Investigation EVIDENCE_UNDER_REVIEW -> EVIDENCE_REQUESTED when evidence_round_count < MAX_EVIDENCE_ROUNDS, otherwise -> EVIDENCE_EXHAUSTED"

  # ---------------------------------------------------------------------------
  # LeakAdjustment — approval cycle plus compensation
  # ---------------------------------------------------------------------------
  - entity: LeakAdjustment
    initial_state: DRAFT
    terminal_states: [DENIED, REVERSED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /leak-adjustments/{id}/submit"
        actor: CustomerServiceRep
        preconditions:
          - "adjustment.status == DRAFT"
          - "adjustment.investigation.status == ADJUSTMENT_PENDING"
          - "at least one RepairProof for the investigation has status == VERIFIED and leak_type == adjustment.leak_type, unless adjustment.investigation.leak_determination == METER_ERROR"
        side_effects:
          - "All computed credit fields are recomputed from the bill's current charge fields so a rebill between draft and submit cannot leave a stale credit"
      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: "POST /leak-adjustments/{id}/return"
        actor: BillingSupervisor
        preconditions:
          - "adjustment.status == PENDING_APPROVAL"
        side_effects:
          - "return_reason recorded; no ledger movement"
        note: "Revision cycle — PENDING_APPROVAL -> DRAFT -> PENDING_APPROVAL is permitted without limit"
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /leak-adjustments/{id}/approve"
        actor: BillingSupervisor
        preconditions:
          - "adjustment.status == PENDING_APPROVAL"
          - "X-User-ID != adjustment.investigation.determination_by_user_id (segregation of duties)"
          - "adjustment.bill.period.status != LOCKED"
          - "no other LeakAdjustment on this account with status IN {APPROVED, POSTED} whose bill.period.end_date falls in the rolling ADJ_ROLLING_WINDOW_MONTHS window ending at adjustment.bill.period.end_date, excluding rows whose id equals adjustment.supersedes_adjustment_id"
        side_effects:
          - "approved_by_user_id = X-User-ID"
      - from: APPROVED
        to: POSTED
        trigger: "system event: automatic continuation of the approve call, inside the same request"
        actor: system
        preconditions:
          - "adjustment.status == APPROVED"
        side_effects:
          - "CASCADE LINK 1: insert AccountLedgerEntry{entry_type: CREDIT, source_kind: LEAK_ADJUSTMENT_CREDIT, amount_cents: -capped_credit_cents, bill_id, source_id: adjustment.id}, then when admin_fee_charged_cents > 0 insert AccountLedgerEntry{entry_type: CHARGE, source_kind: LEAK_ADJUSTMENT_ADMIN_FEE, amount_cents: +admin_fee_charged_cents}"
          - "posted_at = clock_now"
          - "Bill UNDER_INVESTIGATION -> ADJUSTED and bill.adjusted_total_cents recomputed"
          - "HighBillInvestigation ADJUSTMENT_PENDING -> RESOLVED, shutoff_hold_active becomes false"
          - "CASCADE LINK 2 (caused by link 1): ServiceAccount.balance_cents recomputed as the sum of all AccountLedgerEntry.amount_cents"
          - "CASCADE LINK 3 (caused by link 2): ServiceAccount.credit_status recomputed by calculations.account_credit_status from the new balance_cents"
          - "CASCADE LINK 4 (caused by link 3): when credit_status became CURRENT or IN_ARRANGEMENT, ServiceAccount.service_status moves SHUTOFF_HELD or SHUTOFF_SCHEDULED or SHUTOFF_EXECUTED -> ACTIVE and shutoff_scheduled_for = null"
          - "Side-effect order is pinned: ledger inserts, then adjustment status, then Bill, then investigation, then balance, then credit_status, then service_status"
      - from: PENDING_APPROVAL
        to: DENIED
        trigger: "POST /leak-adjustments/{id}/deny"
        actor: BillingSupervisor
        preconditions:
          - "adjustment.status == PENDING_APPROVAL"
          - "X-User-ID != adjustment.investigation.determination_by_user_id (segregation of duties)"
        side_effects:
          - "denial_reason recorded; no ledger movement"
          - "HighBillInvestigation ADJUSTMENT_PENDING -> DETERMINED"
      - from: POSTED
        to: REVERSED
        trigger: "POST /leak-adjustments/{id}/reverse"
        actor: BillingSupervisor
        preconditions:
          - "adjustment.status == POSTED"
          - "adjustment.bill.period.status != LOCKED"
        side_effects:
          - "Insert AccountLedgerEntry{entry_type: REVERSAL, source_kind: LEAK_ADJUSTMENT_REVERSAL, amount_cents: +capped_credit_cents - admin_fee_charged_cents, bill_id, source_id: adjustment.id} — one entry that undoes both the credit and the fee"
          - "Bill ADJUSTED -> ISSUED and bill.adjusted_total_cents recomputed"
          - "HighBillInvestigation RESOLVED -> DETERMINED, shutoff_hold_active becomes true"
          - "ServiceAccount.balance_cents, credit_status and service_status recomputed in that order"
          - "INVARIANT: after reversal, ServiceAccount.balance_cents equals its value immediately before the approve call"

  # ---------------------------------------------------------------------------
  # PaymentArrangement — reinstatement cycle
  # ---------------------------------------------------------------------------
  - entity: PaymentArrangement
    initial_state: PROPOSED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: "PROPOSED | ACTIVE"
        to: CANCELLED
        trigger: "system event: POST /payment-arrangements creates a newer arrangement for the same account_id"
        actor: system
        preconditions:
          - "arrangement.status IN {PROPOSED, ACTIVE}"
        side_effects:
          - "The superseded arrangement stops counting toward calculations.account_credit_status, so credit_status is recomputed"
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /payment-arrangements/{id}/activate"
        actor: "Customer | CustomerServiceRep"
        preconditions:
          - "arrangement.status == PROPOSED"
          - "arrangement.account.service_status != SHUTOFF_EXECUTED OR arrangement.down_payment_cents > 0"
        side_effects:
          - "Insert AccountLedgerEntry{entry_type: PAYMENT, source_kind: ARRANGEMENT_DOWN_PAYMENT, amount_cents: -down_payment_cents, bill_id: arrangement.bill_id, source_id: arrangement.id}"
          - "ServiceAccount.balance_cents recomputed, then credit_status becomes IN_ARRANGEMENT"
          - "service_status SHUTOFF_SCHEDULED or SHUTOFF_HELD or SHUTOFF_EXECUTED -> ACTIVE because credit_status became IN_ARRANGEMENT"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system event: POST /payment-arrangements/{id}/record-payment brings paid_installment_count to installment_count"
        actor: system
        preconditions:
          - "arrangement.status == ACTIVE"
          - "arrangement.paid_installment_count == arrangement.installment_count"
        side_effects:
          - "credit_status falls back to the balance comparison"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "system event: POST /payment-arrangements/{id}/record-payment with on_time == false brings missed_payment_count to MISSED_PAYMENTS_TO_DEFAULT"
        actor: system
        preconditions:
          - "arrangement.status == ACTIVE"
          - "arrangement.missed_payment_count >= MISSED_PAYMENTS_TO_DEFAULT"
        side_effects:
          - "credit_status becomes ARRANGEMENT_DEFAULTED"
      - from: DEFAULTED
        to: ACTIVE
        trigger: "POST /payment-arrangements/{id}/reinstate"
        actor: BillingSupervisor
        preconditions:
          - "arrangement.status == DEFAULTED"
          - "arrangement.reinstatement_count < MAX_ARRANGEMENT_REINSTATEMENTS"
        side_effects:
          - "reinstatement_count += 1; missed_payment_count reset to 0"
          - "credit_status returns to IN_ARRANGEMENT"
        note: "Reinstatement cycle — DEFAULTED -> ACTIVE is allowed MAX_ARRANGEMENT_REINSTATEMENTS times"

  # ---------------------------------------------------------------------------
  # BoardAppeal — branching fork with three divergent decision branches
  # ---------------------------------------------------------------------------
  - entity: BoardAppeal
    initial_state: FILED
    terminal_states: [UPHELD, REVERSED, REMANDED]
    transitions:
      - from: FILED
        to: SCHEDULED
        trigger: "POST /board-appeals/{id}/schedule"
        actor: UtilityBoardClerk
        preconditions:
          - "appeal.status == FILED"
          - "hearing_date >= date(appeal.filing_date) + HEARING_MIN_NOTICE_DAYS calendar days"
          - "count of BoardAppeal rows with the same hearing_date and status == SCHEDULED < HEARING_DOCKET_CAPACITY"
        side_effects:
          - "hearing_date recorded; the date's docket count increases by one"
      - from: SCHEDULED
        to: UPHELD
        trigger: "POST /board-appeals/{id}/record-decision with decision == UPHOLD"
        actor: UtilityBoardClerk
        preconditions:
          - "appeal.status == SCHEDULED"
          - "date(clock_now) >= appeal.hearing_date"
          - "X-User-ID != appeal.investigation.determination_by_user_id"
        side_effects:
          - "hearing_officer_user_id = X-User-ID; decision = UPHOLD"
          - "HighBillInvestigation APPEALED -> RESOLVED; Bill UNDER_INVESTIGATION -> UPHELD_AS_BILLED; no ledger movement"
      - from: SCHEDULED
        to: REVERSED
        trigger: "POST /board-appeals/{id}/record-decision with decision == REVERSE"
        actor: UtilityBoardClerk
        preconditions:
          - "appeal.status == SCHEDULED"
          - "date(clock_now) >= appeal.hearing_date"
          - "X-User-ID != appeal.investigation.determination_by_user_id"
          - "at least one RepairProof for the investigation has status == VERIFIED"
        side_effects:
          - "hearing_officer_user_id = X-User-ID; decision = REVERSE"
          - "HighBillInvestigation APPEALED -> ADJUSTMENT_PENDING, creating a board_ordered LeakAdjustment directly in PENDING_APPROVAL with variant_applied forced to BASELINE_REBILL and supersedes_adjustment_id pointing at the most recent DENIED or REVERSED adjustment on the investigation"
      - from: SCHEDULED
        to: REMANDED
        trigger: "POST /board-appeals/{id}/record-decision with decision == REMAND"
        actor: UtilityBoardClerk
        preconditions:
          - "appeal.status == SCHEDULED"
          - "date(clock_now) >= appeal.hearing_date"
          - "X-User-ID != appeal.investigation.determination_by_user_id"
          - "appeal.investigation.remand_count < REMAND_MAX"
        side_effects:
          - "hearing_officer_user_id = X-User-ID; decision = REMAND"
          - "HighBillInvestigation APPEALED -> EVIDENCE_REQUESTED with remand_count += 1 and evidence_round_count += 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: adjustment-create-stale-investigation
    parent_entity: HighBillInvestigation
    write_endpoint: "POST /leak-adjustments"
    occ_field: "expected_investigation_version"
    description: |
      Creating a LeakAdjustment against a HighBillInvestigation whose version has
      advanced since the client last observed it is rejected. A new draft
      legitimately supersedes the prior one whenever the earlier adjustment was
      denied and the investigation fell back to DETERMINED, so a second create
      from a stale view of the investigation would silently overwrite work the
      client never saw.
    error_id: ERR_STALE_INVESTIGATION_VERSION
    http_status: 412

  - rule_id: arrangement-create-stale-account
    parent_entity: ServiceAccount
    write_endpoint: "POST /payment-arrangements"
    occ_field: "expected_account_version"
    description: |
      Creating a PaymentArrangement against a ServiceAccount whose version has
      advanced since the client last observed it is rejected. Creating an
      arrangement legitimately cancels any PROPOSED or ACTIVE arrangement on the
      account, so a create issued from a stale view of the account would cancel an
      arrangement the client never knew about and finance an already-superseded
      balance.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules
# =============================================================================
calculations:

  - name: tiered_water_charge
    algorithm_type: tiered_pricing
    inputs:
      - "Bill.consumption_gallons"
      - "RateSchedule.base_charge_cents, tier1_limit_gallons, tier1_rate_cents_per_kgal, tier2_limit_gallons, tier2_rate_cents_per_kgal, tier3_rate_cents_per_kgal, summer_surcharge_bp"
      - "BillingPeriod.season"
    formula: |
      Volume is split into three lines with nested clamping, then each line is rounded to whole
      cents INDEPENDENTLY and the rounded lines are summed. Rounding per line before the sum is
      mandatory; rounding a single grand total instead produces a different answer.

        g   = consumption_gallons
        t1  = min(g, tier1_limit_gallons)
        t2  = max(0, min(g, tier2_limit_gallons) - tier1_limit_gallons)
        t3  = max(0, g - tier2_limit_gallons)

        line1 = round_half_up(t1 * tier1_rate_cents_per_kgal / 1000)
        line2 = round_half_up(t2 * tier2_rate_cents_per_kgal / 1000)

        # The summer surcharge applies to the TIER 3 LINE ONLY, and is folded into the
        # line before that line is rounded.
        if season == SUMMER:
          line3 = round_half_up(t3 * tier3_rate_cents_per_kgal * (10000 + summer_surcharge_bp)
                                / (1000 * 10000))
        else:
          line3 = round_half_up(t3 * tier3_rate_cents_per_kgal / 1000)

        water_charge_cents = base_charge_cents + line1 + line2 + line3
    constants:
      TIER_DIVISOR_GALLONS: 1000
      BASIS_POINT_DIVISOR: 10000
    precision: "integer cents; each tier line rounded half-up to the nearest cent before summation"
    worked_examples:
      - "RS-STD-2026 (base 1200; t1 3000 @350; t2 to 10000 @520; t3 @890; summer_surcharge_bp 1500), SUMMER, g=4000 -> t1=3000 t2=1000 t3=0 -> line1=1050 line2=520 line3=0 -> water_charge_cents = 2770"
      - "same schedule, SUMMER, g=12000 -> t1=3000 t2=7000 t3=2000 -> line1=1050 line2=3640 line3=round_half_up(2000*890*11500/10000000)=2047 -> water_charge_cents = 7937"
      - "same schedule, SUMMER, g=41000 -> t1=3000 t2=7000 t3=31000 -> line1=1050 line2=3640 line3=round_half_up(31000*890*11500/10000000)=31729 -> water_charge_cents = 37619"
      - "same schedule, WINTER, g=41000 -> line3=round_half_up(31000*890/1000)=27590 -> water_charge_cents = 33480 (surcharge suppressed)"
      - "same schedule, SUMMER, g=40204 -> t3=30204 -> line3=round_half_up(30204*890*11500/10000000)=30914 -> water_charge_cents = 36804"

  - name: sewer_charge_with_submeter_credit
    algorithm_type: waterfall_allocation
    inputs:
      - "Bill.consumption_gallons, Bill.estimated_flag, Bill.meter_id"
      - "RateSchedule.sewer_rate_cents_per_kgal, sewer_cap_gallons, submeter_sewer_credit_cap_gallons"
      - "MeterReading rows on any Meter whose parent_meter_id == Bill.meter_id and whose meter_type == IRRIGATION_SUBMETER"
    formula: |
      Two buckets fill in a PINNED ORDER: the statutory sewer cap is applied to the master
      consumption FIRST, and only then is the capped submeter credit subtracted. Subtracting the
      credit before the cap yields a different (larger) sewer charge whenever consumption exceeds
      the cap, so the order is load-bearing.

        # bucket 1: raw submeter volume over the period
        For each Meter m with m.parent_meter_id == bill.meter_id and m.meter_type == IRRIGATION_SUBMETER:
          opening = the ACTUAL or CORRECTED MeterReading on m with the greatest read_date
                    <= bill.period.start_date; when none exists use m.initial_register_value only
                    if m.created_at < bill.period.start_date, otherwise the submeter is INELIGIBLE
          closing = the ACTUAL or CORRECTED MeterReading on m with the greatest read_date
                    <= bill.period.end_date and read_date >= bill.period.start_date;
                    when none exists the submeter is INELIGIBLE
          raw_submeter_gallons += max(0, closing.reading_value - opening.reading_value)

        # BACKFLOW_FIRE_LINE submeters are never credited: fire-line volume is not
        # sewer-discharged, and it is also never added to the master consumption.

        if bill.estimated_flag == true OR every candidate submeter was INELIGIBLE:
          submeter_credit_gallons = 0        # no credit on an estimated bill
        else:
          submeter_credit_gallons = min(raw_submeter_gallons,
                                        submeter_sewer_credit_cap_gallons)

        # STEP 1 - cap the master volume
        capped = min(bill.consumption_gallons, sewer_cap_gallons)
        # STEP 2 - then remove the credited irrigation gallons
        sewer_billable_gallons = max(0, capped - submeter_credit_gallons)

        sewer_charge_cents = round_half_up(sewer_billable_gallons
                                          * sewer_rate_cents_per_kgal / 1000)
    constants:
      TIER_DIVISOR_GALLONS: 1000
    precision: "integer cents, round half-up once on the final product"
    worked_examples:
      - "RS-STD-2026 (sewer 610/kgal, sewer_cap_gallons 12000, submeter credit cap 8000), g=4000, no submeter -> capped=4000, credit=0, billable=4000, sewer_charge_cents = 2440"
      - "g=41000, no submeter -> capped=12000, billable=12000, sewer_charge_cents = 7320"
      - "g=41000, raw submeter volume 9000 -> credit = min(9000, 8000) = 8000; capped=12000; billable=4000; sewer_charge_cents = 2440. Reversing the order (41000-8000=33000 then cap at 12000) would give 7320 - the pinned order is what distinguishes them."
      - "g=41000 with estimated_flag true and raw submeter volume 9000 -> submeter_credit_gallons = 0, billable = 12000, sewer_charge_cents = 7320"

  - name: seasonal_baseline
    algorithm_type: aggregation
    inputs:
      - "the target Bill's account_id, meter_id and period_id"
      - "prior Bill rows on the same account_id and meter_id"
      - "BillingPeriod.season, start_date, end_date of the target and of every candidate"
    formula: |
      The baseline is the mean consumption of the three most recent SAME-SEASON historical bills
      for the same meter. Only settled, non-anomalous, actually-read bills qualify.

        candidates = Bill rows where
            b.account_id == target.account_id
          AND b.meter_id == target.meter_id
          AND b.id != target.id
          AND b.period.season == target.period.season
          AND b.period.end_date < target.period.start_date
          AND b.billing_status IN {ISSUED, ADJUSTED, UPHELD_AS_BILLED}
          AND b.anomaly_flag == false
          AND b.estimated_flag == false

        order candidates by b.period.end_date DESC, then b.created_at DESC
        sample = the first BASELINE_SAMPLE_COUNT candidates

        if len(sample) < BASELINE_MIN_SAMPLES:
          seasonal_baseline_gallons = null
          baseline_sample_count     = len(sample)
        else:
          baseline_sample_count     = BASELINE_SAMPLE_COUNT
          seasonal_baseline_gallons = round_half_up(
              sum(s.consumption_gallons for s in sample) / BASELINE_SAMPLE_COUNT)
    constants:
      BASELINE_SAMPLE_COUNT: 3
      BASELINE_MIN_SAMPLES: 3
    precision: "integer gallons, round half-up; null when fewer than 3 qualifying samples exist"
    input_set_filtering: "DRAFT, UNDER_INVESTIGATION, REBILL_PENDING and REBILLED bills are excluded; so are anomaly-flagged bills and estimated bills. A rebilled bill drops out of the pool and its replacement (which is ISSUED) takes its place, so a rebill can change a later bill's baseline."
    worked_examples:
      - "Three SUMMER ISSUED non-anomalous bills of 3800, 4100 and 4100 gallons -> baseline_sample_count = 3, seasonal_baseline_gallons = round_half_up(12000/3) = 4000"
      - "Only two qualifying SUMMER bills exist -> seasonal_baseline_gallons = null, baseline_sample_count = 2, and POST /investigations on that bill fails ERR_INSUFFICIENT_BASELINE_HISTORY"

  - name: anomaly_screen
    algorithm_type: threshold
    inputs:
      - "Bill.consumption_gallons"
      - "Bill.seasonal_baseline_gallons"
    formula: |
      if seasonal_baseline_gallons IS NULL OR seasonal_baseline_gallons == 0:
        anomaly_ratio = null
        anomaly_flag  = false
      else:
        anomaly_ratio = round_half_up(consumption_gallons / seasonal_baseline_gallons, 3)
        anomaly_flag  = (anomaly_ratio >= ANOMALY_RATIO_THRESHOLD)
    constants:
      ANOMALY_RATIO_THRESHOLD: 2.000
    precision: "anomaly_ratio to 3 decimal places, round half-up; the flag comparison uses the ROUNDED ratio and is inclusive (>=)"
    worked_examples:
      - "baseline 4000, consumption 7996 -> anomaly_ratio = 1.999 -> anomaly_flag = false"
      - "baseline 4000, consumption 8000 -> anomaly_ratio = 2.000 -> anomaly_flag = true (boundary is included)"
      - "baseline 4000, consumption 41000 -> anomaly_ratio = 10.250 -> anomaly_flag = true"
      - "baseline null -> anomaly_ratio = null, anomaly_flag = false"

  - name: leak_adjustment_credit
    algorithm_type: threshold
    inputs:
      - "Bill.consumption_gallons, seasonal_baseline_gallons, water_charge_cents, sewer_charge_cents, total_charge_cents, submeter_credit_gallons"
      - "LeakAdjustment.leak_type"
      - "BillingPeriod.season"
      - "RateSchedule tier rates, sewer rate and caps, admin_fee_cents, admin_fee_waiver_threshold_cents"
    formula: |
      SIX PINNED STEPS. Steps 4 and 5 are order-sensitive: the admin-fee waiver is decided on the
      CAPPED credit, not on the gross credit, so a gross credit above the waiver threshold that
      the cap pushes below it still attracts the fee.

        excess_gallons = max(0, consumption_gallons - seasonal_baseline_gallons)

        # ---- STEP 1: water credit, DUAL VARIANT selected by leak_type ----
        # variant EXCESS_REPRICE  (leak_type IN {TOILET, IRRIGATION, POOL}) - fixture leaks:
        #   the excess is re-priced at the TIER 1 rate; the customer keeps paying tier 1
        #   for water that ran through their own fixture.
        #     repriced   = round_half_up(excess_gallons * tier1_rate_cents_per_kgal / 1000)
        #     billed_for_excess = water_charge_cents
        #                       - tiered_water_charge(seasonal_baseline_gallons, season)
        #     water_credit_cents = max(0, billed_for_excess - repriced)
        #
        # variant BASELINE_REBILL (leak_type IN {SERVICE_LINE, UNDERGROUND}) - buried leaks:
        #   the whole excess is forgiven; the bill is rewritten to the baseline.
        #     water_credit_cents = max(0, water_charge_cents
        #                              - tiered_water_charge(seasonal_baseline_gallons, season))
        #
        # A board_ordered adjustment forces variant_applied = BASELINE_REBILL for every leak_type.

        # ---- STEP 2: sewer relief ----
        # Eligible leak types are SEWER_RELIEF_LEAK_TYPES; TOILET is excluded because toilet
        # water does reach the sewer.
        if leak_type IN SEWER_RELIEF_LEAK_TYPES AND excess_gallons > 0:
          sewer_relief_gallons = min(excess_gallons, bill.sewer_billable_gallons)
          sewer_credit_cents   = round_half_up(sewer_relief_gallons
                                               * sewer_rate_cents_per_kgal / 1000)
        else:
          sewer_relief_gallons = 0
          sewer_credit_cents   = 0

        # ---- STEP 3: gross ----
        gross_credit_cents = water_credit_cents + sewer_credit_cents

        # ---- STEP 4: cap (the tighter of a percentage cap and an absolute cap) ----
        cap_cents = min(round_half_up(total_charge_cents * MAX_CREDIT_PCT_BP / 10000),
                        MAX_CREDIT_CENTS)
        capped_credit_cents = min(gross_credit_cents, cap_cents)
        cap_applied         = (capped_credit_cents < gross_credit_cents)

        # ---- STEP 5: admin fee, decided on the CAPPED credit ----
        if capped_credit_cents >= admin_fee_waiver_threshold_cents:
          admin_fee_charged_cents = 0
        else:
          admin_fee_charged_cents = min(admin_fee_cents, capped_credit_cents)

        # ---- STEP 6: net ----
        net_credit_cents = capped_credit_cents - admin_fee_charged_cents
    constants:
      MAX_CREDIT_PCT_BP: 6000
      MAX_CREDIT_CENTS: 50000
      SEWER_RELIEF_LEAK_TYPES: [SERVICE_LINE, UNDERGROUND, IRRIGATION, POOL]
      ADJ_ROLLING_WINDOW_MONTHS: 12
      TIER_DIVISOR_GALLONS: 1000
      BASIS_POINT_DIVISOR: 10000
    precision: "integer cents throughout; every division rounded half-up at the step in which it appears"
    variants:
      - name: EXCESS_REPRICE
        when: "leak_type IN {TOILET, IRRIGATION, POOL} and board_ordered == false"
      - name: BASELINE_REBILL
        when: "leak_type IN {SERVICE_LINE, UNDERGROUND}, or board_ordered == true for any leak_type"
    worked_examples:
      - "Bill g=41000 SUMMER on RS-STD-2026, baseline 4000, sewer_billable_gallons 12000, submeter_credit_gallons 0: water_charge_cents 37619, sewer_charge_cents 7320, total_charge_cents 44939. leak_type SERVICE_LINE -> variant BASELINE_REBILL; excess_gallons 37000; water_credit_cents = 37619 - 2770 = 34849; sewer_relief_gallons = sewer_relief_basis(37000, 12000, 0) = 8000; sewer_credit_cents 4880; gross 39729; cap_cents = min(round_half_up(44939*6000/10000)=26963, 50000) = 26963; capped 26963; cap_applied true; fee 0 (26963 >= 10000); net_credit_cents 26963"
      - "same bill, leak_type TOILET -> variant EXCESS_REPRICE; repriced = round_half_up(37000*350/1000) = 12950; billed_for_excess = 37619 - 2770 = 34849; water_credit_cents = 21899; TOILET is not in SEWER_RELIEF_LEAK_TYPES so sewer_credit_cents 0; gross 21899; cap 26963; capped 21899; cap_applied false; fee 0; net_credit_cents 21899"
      - "same bill, leak_type IRRIGATION -> variant EXCESS_REPRICE; water_credit_cents 21899; sewer_relief_gallons 8000; sewer_credit_cents 4880; gross 26779; cap 26963; capped 26779; cap_applied false; fee 0; net_credit_cents 26779"
      - "same bill but with an irrigation submeter contributing raw 9000 gallons: submeter_credit_gallons 8000, sewer_billable_gallons 4000, sewer_charge_cents 2440, total_charge_cents 40059. leak_type SERVICE_LINE -> water_credit_cents 34849; sewer_relief_gallons = sewer_relief_basis(37000, 4000, 8000) = 0 because the credited irrigation gallons already removed that volume from the sewer basis; sewer_credit_cents 0; gross 34849; cap_cents = min(round_half_up(40059*6000/10000)=24035, 50000) = 24035; capped 24035; cap_applied true; fee 0; net_credit_cents 24035"
      - "Bill g=12000 SUMMER, baseline 4000: water 7937, sewer 7320, total 15257. leak_type SERVICE_LINE -> water_credit 5167; sewer_relief_gallons 8000; sewer_credit_cents 4880; gross 10047; cap_cents = min(round_half_up(15257*6000/10000)=9154, 50000) = 9154; capped 9154; cap_applied true; fee = min(1500, 9154) = 1500 because 9154 < 10000 even though the GROSS 10047 was above the threshold; net_credit_cents 7654"
      - "Bill g=5000 SUMMER, baseline 4000: water 3290, sewer 3050, total 6340. leak_type SERVICE_LINE -> water_credit 520; sewer_relief_gallons 1000; sewer_credit_cents 610; gross 1130; cap_cents = min(round_half_up(6340*6000/10000)=3804, 50000) = 3804; capped 1130; cap_applied false; fee = min(1500, 1130) = 1130; net_credit_cents 0"

  - name: sewer_relief_basis
    algorithm_type: threshold
    inputs:
      - "leak_adjustment_credit.excess_gallons"
      - "Bill.sewer_billable_gallons"
      - "Bill.submeter_credit_gallons"
      - "RateSchedule.submeter_sewer_credit_cap_gallons"
    formula: |
      Helper that pins STEP 2 of leak_adjustment_credit. Relief may never exceed what the
      customer was actually billed for on the sewer side, may never exceed the statutory relief
      basis, and may never double-count gallons already excluded by an irrigation-submeter credit.

        headroom = max(0, sewer_billable_gallons - submeter_credit_gallons_already_excluded)
                   where submeter_credit_gallons_already_excluded = bill.submeter_credit_gallons

        sewer_relief_gallons = min(excess_gallons,
                                   SEWER_RELIEF_BASIS_GALLONS,
                                   headroom)
    constants:
      SEWER_RELIEF_BASIS_GALLONS: 8000
    precision: integer gallons
    worked_examples:
      - "excess 37000, sewer_billable 12000, submeter_credit 0 -> headroom 12000 -> min(37000, 8000, 12000) = 8000"
      - "excess 37000, sewer_billable 4000, submeter_credit 8000 -> headroom max(0, 4000-8000) = 0 -> min(37000, 8000, 0) = 0"
      - "excess 8000, sewer_billable 12000, submeter_credit 0 -> min(8000, 8000, 12000) = 8000"
      - "excess 1000, sewer_billable 5000, submeter_credit 0 -> min(1000, 8000, 5000) = 1000"

  - name: bench_test_accuracy
    algorithm_type: weighted_scoring
    inputs:
      - "MeterTestRequest.low_flow_pct, mid_flow_pct, high_flow_pct"
      - "Meter.size_inches"
    formula: |
      DUAL VARIANT selected by meter size. Small meters are graded on the AWWA weighted
      composite that deliberately over-weights mid flow; large meters are graded on the
      unweighted mean.

        if size_inches <= SMALL_METER_MAX_INCHES:
          accuracy_method = AWWA_WEIGHTED
          accuracy_pct = round_half_up(low_flow_pct  * AWWA_WEIGHT_LOW
                                     + mid_flow_pct  * AWWA_WEIGHT_MID
                                     + high_flow_pct * AWWA_WEIGHT_HIGH, 2)
        else:
          accuracy_method = SIMPLE_MEAN
          accuracy_pct = round_half_up((low_flow_pct + mid_flow_pct + high_flow_pct) / 3, 2)

        if accuracy_pct > FAST_THRESHOLD_PCT:   bench_result = FAST
        elif accuracy_pct < SLOW_THRESHOLD_PCT: bench_result = SLOW
        else:                                   bench_result = PASS

        correction_factor = round_half_up(100 / accuracy_pct, 6)
    constants:
      SMALL_METER_MAX_INCHES: 2.0
      AWWA_WEIGHT_LOW: 0.15
      AWWA_WEIGHT_MID: 0.70
      AWWA_WEIGHT_HIGH: 0.15
      FAST_THRESHOLD_PCT: 101.50
      SLOW_THRESHOLD_PCT: 98.50
    precision: "accuracy_pct to 2 decimal places round half-up; correction_factor to 6 decimal places round half-up; both threshold comparisons are STRICT and use the rounded accuracy_pct"
    variants:
      - name: AWWA_WEIGHTED
        when: "Meter.size_inches <= 2.0"
      - name: SIMPLE_MEAN
        when: "Meter.size_inches > 2.0"
    worked_examples:
      - "(low 95.20, mid 103.40, high 102.10) on a 1.0 inch meter -> AWWA_WEIGHTED -> 0.15*95.20 + 0.70*103.40 + 0.15*102.10 = 101.975 -> accuracy_pct 101.98 -> FAST (101.98 > 101.50) -> correction_factor round_half_up(100/101.98, 6) = 0.980584"
      - "the SAME three flow points on a 3.0 inch meter -> SIMPLE_MEAN -> (95.20+103.40+102.10)/3 = 100.2333... -> accuracy_pct 100.23 -> PASS -> correction_factor 0.997705. Same inputs, different variant, different bench_result."
      - "(101.50, 101.50, 101.50) on a 1.0 inch meter -> accuracy_pct 101.50 -> PASS, because the FAST test is strictly greater-than"
      - "(101.60, 101.60, 101.60) on a 1.0 inch meter -> accuracy_pct 101.60 -> FAST"
      - "(97.00, 98.20, 98.40) on a 1.0 inch meter -> 0.15*97.00 + 0.70*98.20 + 0.15*98.40 = 98.05 -> SLOW"

  - name: read_correction_reallocation
    algorithm_type: projection
    inputs:
      - "Meter.correction_factor"
      - "the MeterReading rows on the meter ordered by read_date"
      - "METER_ERROR_CORRECTION_SCOPE"
    formula: |
      A FAST bench result produces exactly one CORRECTED MeterReading, against the live read with
      the greatest read_date. Register readings are cumulative, so the correction is applied to
      the SEGMENT consumption and then re-accumulated onto the prior read's register value. This
      keeps the register monotonic and conserves every gallon that was billed in earlier periods.

        live_reads = MeterReading rows on the meter where superseded_by_reading_id IS NULL,
                     ordered by read_date ASC, then created_at ASC
        target     = last(live_reads)
        prior      = the live read immediately before target, or a synthetic read carrying
                     Meter.initial_register_value when target is the first read

        corrected_segment_gallons = round_half_up(
            (target.reading_value - prior.reading_value) * Meter.correction_factor)

        new MeterReading{
          meter_id: target.meter_id,
          read_date: target.read_date,
          read_type: CORRECTED,
          reading_value: prior.reading_value + corrected_segment_gallons,
          corrects_reading_id: target.id,
          consumption_since_prior_gallons: corrected_segment_gallons }

        target.superseded_by_reading_id = new.id

        INVARIANT (conservation of metered gallons): the sum of consumption_gallons over every
        Bill whose billing_status is not DRAFT and not REBILLED equals
        (greatest live reading_value on the meter) - Meter.initial_register_value.
    constants:
      METER_ERROR_CORRECTION_SCOPE: LATEST_LIVE_READ_ONLY
    precision: "integer gallons, round half-up on the segment product"
    worked_examples:
      - "Meter initial_register_value 100000 with live reads 104000, 108000, 112000, 153000; correction_factor 0.980584. target = 153000, prior = 112000, segment = 41000 -> corrected_segment_gallons = round_half_up(41000*0.980584) = 40204 -> new CORRECTED reading_value = 112000 + 40204 = 152204, and the 153000 row gets superseded_by_reading_id set."
      - "The three earlier periods are untouched: their 4000/4000/4000 gallon segments still sum with the corrected 40204 to 152204 - 100000 = 52204."

  - name: payment_arrangement_schedule
    algorithm_type: waterfall_allocation
    inputs:
      - "PaymentArrangement.total_amount_cents, down_payment_cents, installment_count"
    formula: |
      PINNED ORDER: divide once with a FLOOR, then push the whole remainder onto the FINAL
      instalment. Rounding each instalment independently and summing would not reconcile to the
      financed amount.

        financed_cents = total_amount_cents - down_payment_cents

        installment_cents       = floor(financed_cents / installment_count)
        remainder               = financed_cents - installment_cents * installment_count
        final_installment_cents = installment_cents + remainder

        minimum_down_payment_cents = round_half_up(total_amount_cents * DOWN_PAYMENT_MIN_BP / 10000)

        INVARIANT: installment_cents * (installment_count - 1) + final_installment_cents
                   == financed_cents, exactly.
    constants:
      DOWN_PAYMENT_MIN_BP: 2000
      MAX_INSTALLMENTS: 12
      MISSED_PAYMENTS_TO_DEFAULT: 2
      MAX_ARRANGEMENT_REINSTATEMENTS: 1
      BASIS_POINT_DIVISOR: 10000
    precision: "integer cents; floor on the per-instalment division, remainder to the final instalment"
    worked_examples:
      - "total 17976, down 4000, installment_count 7 -> financed 13976 -> floor(13976/7) = 1996, remainder = 13976 - 13972 = 4 -> installment_cents 1996, final_installment_cents 2000. Check: 1996*6 + 2000 = 13976. The wrong order (round_half_up(13976/7) = 1997 for all seven) sums to 13979."
      - "total 17976 -> minimum_down_payment_cents = round_half_up(17976*2000/10000) = 3595, so down_payment_cents 3595 passes and 3594 fails ERR_DOWN_PAYMENT_TOO_LOW"

  - name: account_balance
    algorithm_type: aggregation
    inputs:
      - "every AccountLedgerEntry with this account_id"
    formula: |
      balance_cents = sum(entry.amount_cents for every AccountLedgerEntry on the account)

      Signs are fixed at insert time: CHARGE entries are positive, CREDIT, PAYMENT and
      deposit-refund entries are negative, and a REVERSAL carries whatever sign undoes the
      entry it compensates. No entry is ever updated or deleted, so the balance is a pure
      replay of an append-only log.
    constants: {}
    precision: integer cents
    worked_examples:
      - "Entries +5210, +5210, +5210, +44939, -26963 -> balance_cents 33606; appending the reversal +26963 -> 60569, exactly the pre-approval balance."
      - "Entries +5210, +5210, +5210, -15630 (rebill reversal), +15257 (rebill charge), -3000 (deposit refund), -9154 (leak credit), +1500 (admin fee) -> balance_cents 4603"

  - name: account_credit_status
    algorithm_type: threshold
    inputs:
      - "ServiceAccount.balance_cents"
      - "the PaymentArrangement rows on the account"
    formula: |
      Strict precedence — the first matching clause wins:

        1. any PaymentArrangement on the account with status == DEFAULTED -> ARRANGEMENT_DEFAULTED
        2. any PaymentArrangement on the account with status == ACTIVE    -> IN_ARRANGEMENT
        3. balance_cents > PAST_DUE_THRESHOLD_CENTS                       -> PAST_DUE
        4. otherwise                                                     -> CURRENT

      Clause 2 outranks clause 3, so an account with an ACTIVE arrangement is never PAST_DUE
      no matter how large its balance is. Recomputed after every AccountLedgerEntry insert and
      after every PaymentArrangement status change.
    constants:
      PAST_DUE_THRESHOLD_CENTS: 5000
    precision: "exact integer comparison; the PAST_DUE test is strictly greater-than"
    worked_examples:
      - "balance 5000, no arrangement -> CURRENT (boundary excluded)"
      - "balance 5001, no arrangement -> PAST_DUE"
      - "balance 4603, no arrangement -> CURRENT"
      - "balance 33606 with an ACTIVE arrangement -> IN_ARRANGEMENT"
      - "balance 0 with a DEFAULTED arrangement -> ARRANGEMENT_DEFAULTED"

  - name: adjustment_preview
    algorithm_type: forward_looking
    inputs:
      - "the Bill's charge fields and seasonal_baseline_gallons"
      - "an assumed_leak_type supplied by the caller"
    formula: |
      Runs leak_adjustment_credit twice for the same bill - once forcing variant EXCESS_REPRICE
      and once forcing variant BASELINE_REBILL - and returns both nets plus the delta, without
      creating any LeakAdjustment row and without writing any ledger entry. Recomputed on every
      call, so a rebill between two preview calls changes the answer.

        excess_reprice_net_cents  = leak_adjustment_credit(bill, assumed_leak_type,
                                                           force_variant=EXCESS_REPRICE).net
        baseline_rebill_net_cents = leak_adjustment_credit(bill, assumed_leak_type,
                                                           force_variant=BASELINE_REBILL).net
        variant_delta_cents       = baseline_rebill_net_cents - excess_reprice_net_cents
        recommended_variant       = the variant that leak_adjustment_credit would actually
                                    select for assumed_leak_type
    constants: {}
    precision: integer cents
    worked_examples:
      - "Bill g=41000 SUMMER baseline 4000 (water 37619, sewer 7320, total 44939, sewer_billable 12000) with assumed_leak_type SERVICE_LINE -> excess_reprice_net_cents 26779, baseline_rebill_net_cents 26963, variant_delta_cents 184, recommended_variant BASELINE_REBILL"

# =============================================================================
# §1.4 Validation Rules — evaluated in strict ascending priority order.
# The FIRST violated rule short-circuits the request; nothing after it is
# evaluated, so a request that violates several rules always returns the
# lowest-priority-number error.
# =============================================================================
validations:

  # ---- priority 1: authentication ----
  - priority: 1
    category: auth
    rule: "X-User-ID and X-User-Role headers must both be present and non-empty on every endpoint except POST /_clock/set_current_utc"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  # ---- priority 2: authorization ----
  - priority: 2
    category: auth
    rule: "X-User-Role must be one of the six declared roles and must appear in the target endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
    note: "Evaluated on the role string alone, before any body parsing, so a forbidden role with a malformed body still returns 403 rather than 400"

  # ---- priority 3: request schema ----
  - priority: 3
    category: schema
    rule: "Body and query must parse; every required field present; every field of the declared type; every enum value in the declared set; every integer within its declared range; limit in [1,100] and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"

  # ---- priority 4: path resource existence, left to right ----
  - priority: 4
    category: existence
    rule: "Each {id} in the path must resolve, checked left to right"
    error_id: "ERR_RATE_SCHEDULE_NOT_FOUND | ERR_BILLING_PERIOD_NOT_FOUND | ERR_SERVICE_ACCOUNT_NOT_FOUND | ERR_METER_NOT_FOUND | ERR_METER_READING_NOT_FOUND | ERR_BILL_NOT_FOUND | ERR_INVESTIGATION_NOT_FOUND | ERR_METER_TEST_REQUEST_NOT_FOUND | ERR_REPAIR_PROOF_NOT_FOUND | ERR_LEAK_ADJUSTMENT_NOT_FOUND | ERR_PAYMENT_ARRANGEMENT_NOT_FOUND | ERR_BOARD_APPEAL_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  # ---- priority 5: body foreign-key existence, in declared field order ----
  - priority: 5
    category: existence
    rule: "Every FK supplied in the body must resolve, checked in the order the fields appear in the endpoint's input list"
    error_id: "the matching *_NOT_FOUND code"
    http_status: 404
    applies_to: "POST /service-accounts, POST /meters, POST /meter-readings, POST /bills, POST /investigations, POST /meter-test-requests, POST /repair-proofs, POST /leak-adjustments, POST /payment-arrangements, POST /board-appeals"

  # ---- priority 6: tenant / ownership scoping ----
  - priority: 6
    category: ownership
    rule: "A caller with role Customer may only read or act on rows reachable from the ServiceAccount whose id equals X-User-ID; any other account_id in the path, in the body or reached through an FK is refused"
    error_id: ERR_ACCOUNT_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "every endpoint whose roles list includes Customer"
    note: "Ordered after existence so a Customer probing an unknown id gets 404, not 403 — the id space is not a secret but the row contents are"

  # ---- priority 7: optimistic concurrency ----
  - priority: 7
    category: concurrency
    rule: "expected_<parent>_version must equal the parent's current version"
    error_id: "ERR_STALE_INVESTIGATION_VERSION | ERR_STALE_ACCOUNT_VERSION"
    http_status: 412
    applies_to: "POST /leak-adjustments, POST /payment-arrangements"

  # ---- priority 8: state preconditions ----
  - priority: 8
    category: state
    rule: "The subject entity must be in a state from which the requested transition is declared in §1.2; every cross-entity state precondition of that transition must hold"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every action endpoint"
  - priority: 8
    category: state
    rule: "POST /investigations requires bill.billing_status == ISSUED and requires that no non-terminal HighBillInvestigation already exists for that bill"
    error_id: ERR_INVESTIGATION_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /investigations"
  - priority: 8
    category: state
    rule: "POST /bills requires bill.period.status == OPEN"
    error_id: ERR_BILLING_PERIOD_CLOSED
    http_status: 409
    applies_to: "POST /bills"

  # ---- priority 9: business_safety (who may act, and what physical action is blocked) ----
  - priority: 9
    category: business_safety
    rule: "The X-User-ID approving, denying or reversing a LeakAdjustment must differ from investigation.determination_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /leak-adjustments/{id}/approve, POST /leak-adjustments/{id}/deny, POST /leak-adjustments/{id}/reverse"
  - priority: 9
    category: business_safety
    rule: "The X-User-ID recording a board decision must differ from investigation.determination_by_user_id and from appeal.filed_by_user_id"
    error_id: ERR_HEARING_OFFICER_CONFLICT
    http_status: 403
    applies_to: "POST /board-appeals/{id}/record-decision"
  - priority: 9
    category: business_safety
    rule: "POST /service-accounts/{id}/execute-shutoff is refused while account.open_investigation_hold_count > 0 or account.open_rebill_count > 0"
    error_id: ERR_SHUTOFF_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /service-accounts/{id}/execute-shutoff"
  - priority: 9
    category: business_safety
    rule: "POST /service-accounts/{id}/execute-shutoff is refused when clock_now < account.shutoff_scheduled_for"
    error_id: ERR_SHUTOFF_NOTICE_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /service-accounts/{id}/execute-shutoff"

  # ---- priority 10: business_temporal (dates, windows, deadlines) ----
  - priority: 10
    category: business_temporal
    rule: "Any fiscal write touching a Bill whose period.status == LOCKED is refused: leak-adjustment approve, deny, reverse, bill rebill, and CORRECTED MeterReading creation"
    error_id: ERR_BILLING_PERIOD_LOCKED
    http_status: 409
    applies_to: "POST /leak-adjustments/{id}/approve, POST /leak-adjustments/{id}/deny, POST /leak-adjustments/{id}/reverse, POST /bills/{id}/rebill, POST /meter-readings"
  - priority: 10
    category: business_temporal
    rule: "POST /bills/{id}/rebill requires date(clock_now) <= bill.period.rebilling_deadline_date"
    error_id: ERR_REBILL_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /bills/{id}/rebill"
  - priority: 10
    category: business_temporal
    rule: "POST /board-appeals requires filing within APPEAL_FILING_DAYS calendar days of the investigation's determined_at (or of its close instant when the investigation is CLOSED_NO_ADJUSTMENT): date(clock_now) <= date(reference_instant) + 30"
    error_id: ERR_APPEAL_UNTIMELY
    http_status: 422
    applies_to: "POST /board-appeals"
  - priority: 10
    category: business_temporal
    rule: "POST /board-appeals/{id}/schedule requires hearing_date >= date(appeal.filing_date) + HEARING_MIN_NOTICE_DAYS"
    error_id: ERR_HEARING_NOTICE_TOO_SHORT
    http_status: 422
    applies_to: "POST /board-appeals/{id}/schedule"
  - priority: 10
    category: business_temporal
    rule: "POST /board-appeals/{id}/record-decision requires date(clock_now) >= appeal.hearing_date"
    error_id: ERR_HEARING_NOT_YET_HELD
    http_status: 422
    applies_to: "POST /board-appeals/{id}/record-decision"
  - priority: 10
    category: business_temporal
    rule: "POST /meter-test-requests/{id}/schedule-field-test requires window_start >= Meter.last_test_completed_at + METER_TEST_QUARANTINE_HOURS whenever last_test_completed_at is not null"
    error_id: ERR_METER_TEST_QUARANTINE
    http_status: 409
    applies_to: "POST /meter-test-requests/{id}/schedule-field-test"
  - priority: 10
    category: business_temporal
    rule: "POST /meter-test-requests/{id}/record-field-result requires window_start <= tested_at < window_end (half-open)"
    error_id: ERR_TEST_RESULT_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /meter-test-requests/{id}/record-field-result"
  - priority: 10
    category: business_temporal
    rule: "POST /bills requires date(clock_now) > bill.period.end_date — a period cannot be billed before it has ended"
    error_id: ERR_BILLING_PERIOD_NOT_ENDED
    http_status: 422
    applies_to: "POST /bills"
  - priority: 10
    category: business_temporal
    rule: "POST /meter-readings requires read_date <= date(clock_now)"
    error_id: ERR_READ_DATE_IN_FUTURE
    http_status: 422
    applies_to: "POST /meter-readings"

  # ---- priority 11: business_constraint (counts, capacities, overlaps, limits) ----
  - priority: 11
    category: business_constraint
    rule: "POST /billing-periods is refused when the closed-closed interval [start_date, end_date] intersects the [start_date, end_date] of any existing BillingPeriod — sharing a single endpoint date is already an intersection"
    error_id: ERR_BILLING_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /billing-periods"
  - priority: 11
    category: business_constraint
    rule: "POST /meter-test-requests/{id}/schedule-field-test is refused when the half-open interval [window_start, window_end) intersects the half-open interval of another MeterTestRequest on the same meter with status IN {FIELD_TEST_SCHEDULED, BENCH_TEST_PENDING} — touching endpoints do NOT intersect"
    error_id: ERR_METER_TEST_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /meter-test-requests/{id}/schedule-field-test"
  - priority: 11
    category: business_constraint
    rule: "POST /bills is refused when a Bill with the same meter_id and period_id already exists with billing_status != REBILLED"
    error_id: ERR_DUPLICATE_BILL_FOR_PERIOD
    http_status: 409
    applies_to: "POST /bills"
  - priority: 11
    category: business_constraint
    rule: "POST /investigations/{id}/request-evidence is refused when investigation.evidence_round_count >= MAX_EVIDENCE_ROUNDS"
    error_id: ERR_EVIDENCE_ROUND_LIMIT
    http_status: 422
    applies_to: "POST /investigations/{id}/request-evidence"
  - priority: 11
    category: business_constraint
    rule: "POST /board-appeals/{id}/record-decision with decision REMAND is refused when investigation.remand_count >= REMAND_MAX"
    error_id: ERR_REMAND_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /board-appeals/{id}/record-decision"
  - priority: 11
    category: business_constraint
    rule: "POST /board-appeals/{id}/schedule is refused when HEARING_DOCKET_CAPACITY appeals already hold status SCHEDULED on that hearing_date"
    error_id: ERR_HEARING_DOCKET_FULL
    http_status: 409
    applies_to: "POST /board-appeals/{id}/schedule"
  - priority: 11
    category: business_constraint
    rule: "POST /payment-arrangements/{id}/reinstate is refused when arrangement.reinstatement_count >= MAX_ARRANGEMENT_REINSTATEMENTS"
    error_id: ERR_REINSTATEMENT_LIMIT
    http_status: 422
    applies_to: "POST /payment-arrangements/{id}/reinstate"
  - priority: 11
    category: business_constraint
    rule: "POST /meter-readings is refused when reading_value is less than the reading_value of the latest live read on that meter (or less than Meter.initial_register_value when there is none), unless read_type == CORRECTED"
    error_id: ERR_NEGATIVE_CONSUMPTION
    http_status: 422
    applies_to: "POST /meter-readings"
  - priority: 11
    category: business_constraint
    rule: "POST /investigations is refused when the target bill's seasonal_baseline_gallons is null (fewer than BASELINE_MIN_SAMPLES qualifying same-season bills exist)"
    error_id: ERR_INSUFFICIENT_BASELINE_HISTORY
    http_status: 422
    applies_to: "POST /investigations"
  - priority: 11
    category: business_constraint
    rule: "POST /leak-adjustments requires, unless investigation.leak_determination == METER_ERROR, at least one RepairProof on the investigation with status == VERIFIED"
    error_id: ERR_REPAIR_PROOF_REQUIRED
    http_status: 422
    applies_to: "POST /leak-adjustments"
  - priority: 11
    category: business_constraint
    rule: "POST /bills requires the meter's meter_type == POTABLE_MASTER; irrigation submeters and backflow fire lines are never billed directly"
    error_id: ERR_METER_NOT_BILLABLE
    http_status: 422
    applies_to: "POST /bills"
  - priority: 11
    category: business_constraint
    rule: "POST /meters requires parent_meter_id to be null when meter_type == POTABLE_MASTER and non-null pointing at a POTABLE_MASTER meter on the same account when meter_type IN {IRRIGATION_SUBMETER, BACKFLOW_FIRE_LINE}"
    error_id: ERR_SUBMETER_PARENT_INVALID
    http_status: 422
    applies_to: "POST /meters"
  - priority: 11
    category: business_constraint
    rule: "POST /payment-arrangements is refused when installment_count > MAX_INSTALLMENTS"
    error_id: ERR_INSTALLMENT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /payment-arrangements"

  # ---- priority 12: business_referential (cross-row coherence) ----
  - priority: 12
    category: business_referential
    rule: "POST /leak-adjustments requires leak_type to equal the leak_type of at least one VERIFIED RepairProof on the investigation, unless investigation.leak_determination == METER_ERROR"
    error_id: ERR_LEAK_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /leak-adjustments"
  - priority: 12
    category: business_referential
    rule: "POST /leak-adjustments requires bill_id == investigation.bill_id"
    error_id: ERR_ADJUSTMENT_BILL_MISMATCH
    http_status: 422
    applies_to: "POST /leak-adjustments"
  - priority: 12
    category: business_referential
    rule: "POST /meter-test-requests requires meter.account_id == investigation.account_id"
    error_id: ERR_TEST_METER_ACCOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /meter-test-requests"
  - priority: 12
    category: business_referential
    rule: "POST /payment-arrangements requires bill.account_id == account_id, and when investigation_id is supplied requires investigation.account_id == account_id"
    error_id: ERR_ARRANGEMENT_ACCOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /payment-arrangements"
  - priority: 12
    category: business_referential
    rule: "POST /bills requires meter.account_id == account_id"
    error_id: ERR_BILL_METER_ACCOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /bills"

  # ---- priority 13: business_fiscal (money) ----
  - priority: 13
    category: business_fiscal
    rule: "POST /leak-adjustments/{id}/approve is refused when another LeakAdjustment on the same account already holds status APPROVED or POSTED with bill.period.end_date inside the ADJ_ROLLING_WINDOW_MONTHS window ending at this adjustment's bill.period.end_date, excluding the row named by supersedes_adjustment_id"
    error_id: ERR_LEAK_ADJUSTMENT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /leak-adjustments/{id}/approve"
  - priority: 13
    category: business_fiscal
    rule: "POST /payment-arrangements requires round_half_up(total_amount_cents * DOWN_PAYMENT_MIN_BP / 10000) <= down_payment_cents <= total_amount_cents"
    error_id: ERR_DOWN_PAYMENT_TOO_LOW
    http_status: 422
    applies_to: "POST /payment-arrangements"
  - priority: 13
    category: business_fiscal
    rule: "POST /payment-arrangements requires total_amount_cents to equal the referenced bill's adjusted_total_cents"
    error_id: ERR_ARRANGEMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /payment-arrangements"
  - priority: 13
    category: business_fiscal
    rule: "POST /service-accounts/{id}/payments and POST /payment-arrangements/{id}/record-payment require amount_cents > 0"
    error_id: ERR_PAYMENT_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /service-accounts/{id}/payments, POST /payment-arrangements/{id}/record-payment"
  - priority: 13
    category: business_fiscal
    rule: "POST /meter-test-requests with requested_by_kind == CUSTOMER requires deposit_cents == METER_TEST_DEPOSIT_CENTS; with requested_by_kind == UTILITY requires deposit_cents == 0"
    error_id: ERR_TEST_DEPOSIT_INVALID
    http_status: 422
    applies_to: "POST /meter-test-requests"

# =============================================================================
# §1.5 Endpoint Table
# api_prefix is "" — every collection is a flat top-level segment.
# =============================================================================
endpoints:

  # ---------------------------------------------------------------------------
  # Logical clock (mandatory test-driving endpoint)
  # ---------------------------------------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    roles: [SystemAdmin, CustomerServiceRep, MeterTechnician, BillingSupervisor, UtilityBoardClerk, Customer]
    input: [current_utc]
    output: "{ current_utc: string }"
    description: |
      Sets the logical clock that every date and timestamp comparison in this service reads.
      At process startup the logical clock is 2026-08-01T00:00:00Z. Every rule that mentions
      clock_now reads this value, never the host wall clock. Accepts an ISO 8601 UTC instant.
      This endpoint does not require the X-User-ID or X-User-Role headers.
    side_effects:
      - "Replaces the logical clock value; no entity is mutated and no derived field is recomputed by the call itself"

  # ---------------------------------------------------------------------------
  # RateSchedule
  # ---------------------------------------------------------------------------
  - method: POST
    path: /rate-schedules
    roles: [SystemAdmin]
    input: [code, base_charge_cents, tier1_limit_gallons, tier1_rate_cents_per_kgal, tier2_limit_gallons, tier2_rate_cents_per_kgal, tier3_rate_cents_per_kgal, summer_surcharge_bp, sewer_rate_cents_per_kgal, sewer_cap_gallons, submeter_sewer_credit_cap_gallons, admin_fee_cents, admin_fee_waiver_threshold_cents]
    output: RateSchedule
    description: Create a rate schedule.
    side_effects: []
  - method: GET
    path: /rate-schedules
    roles: [SystemAdmin, BillingSupervisor, CustomerServiceRep]
    input: ["code?", "limit?", "offset?"]
    output: RateSchedule[]
    description: List rate schedules.
    side_effects: []
  - method: GET
    path: /rate-schedules/{id}
    roles: [SystemAdmin, BillingSupervisor, CustomerServiceRep]
    input: []
    output: RateSchedule
    description: Retrieve one rate schedule.
    side_effects: []

  # ---------------------------------------------------------------------------
  # BillingPeriod
  # ---------------------------------------------------------------------------
  - method: POST
    path: /billing-periods
    roles: [SystemAdmin]
    input: [period_code, start_date, end_date, season, rebilling_deadline_date]
    output: BillingPeriod
    description: Create a billing period. Rejected when the closed-closed date interval touches or overlaps an existing period.
    side_effects:
      - "status defaults to OPEN"
  - method: GET
    path: /billing-periods
    roles: [SystemAdmin, BillingSupervisor, CustomerServiceRep, Customer]
    input: ["season?", "status?", "period_code?", "limit?", "offset?"]
    output: BillingPeriod[]
    description: List billing periods.
    side_effects: []
  - method: GET
    path: /billing-periods/{id}
    roles: [SystemAdmin, BillingSupervisor, CustomerServiceRep, Customer]
    input: []
    output: BillingPeriod
    description: Retrieve one billing period.
    side_effects: []
  - method: POST
    path: /billing-periods/{id}/close
    roles: [SystemAdmin]
    input: []
    output: BillingPeriod
    description: Move an OPEN period to CLOSED. New bills may no longer be created for it; adjustments and rebills still may.
    side_effects:
      - "status = CLOSED"
  - method: POST
    path: /billing-periods/{id}/lock
    roles: [SystemAdmin]
    input: []
    output: BillingPeriod
    description: Move a CLOSED period to LOCKED. Every fiscal write touching a bill of this period is refused with ERR_BILLING_PERIOD_LOCKED.
    side_effects:
      - "status = LOCKED"

  # ---------------------------------------------------------------------------
  # ServiceAccount
  # ---------------------------------------------------------------------------
  - method: POST
    path: /service-accounts
    roles: [SystemAdmin, CustomerServiceRep]
    input: [account_number, customer_name, service_address, rate_schedule_id]
    output: ServiceAccount
    description: Create a service account.
    side_effects:
      - "service_status = ACTIVE; credit_status = CURRENT; balance_cents = 0; open_investigation_hold_count = 0; open_rebill_count = 0"
  - method: GET
    path: /service-accounts
    roles: [SystemAdmin, CustomerServiceRep, BillingSupervisor]
    input: ["rate_schedule_id?", "account_number?", "service_status?", "credit_status?", "limit?", "offset?"]
    output: ServiceAccount[]
    description: List service accounts, filterable by the rate schedule they sit on and by either state dimension.
    side_effects: []
  - method: GET
    path: /service-accounts/{id}
    roles: [SystemAdmin, CustomerServiceRep, BillingSupervisor, Customer]
    input: []
    output: ServiceAccount
    description: Retrieve one service account with its live balance_cents, credit_status and service_status.
    side_effects: []
  - method: GET
    path: /service-accounts/{id}/ledger-entries
    roles: [SystemAdmin, CustomerServiceRep, BillingSupervisor, Customer]
    input: ["entry_type?", "source_kind?", "limit?", "offset?"]
    output: AccountLedgerEntry[]
    description: List the append-only ledger entries of one account, ordered effective_at ASC then created_at ASC.
    side_effects: []
  - method: POST
    path: /service-accounts/{id}/schedule-shutoff
    roles: [BillingSupervisor]
    input: []
    output: ServiceAccount
    description: Schedule a shutoff on a delinquent account. Requires credit_status PAST_DUE or ARRANGEMENT_DEFAULTED.
    side_effects:
      - "service_status ACTIVE -> SHUTOFF_SCHEDULED"
      - "shutoff_scheduled_for = clock_now + SHUTOFF_NOTICE_DAYS days"
      - "The account lands in SHUTOFF_SCHEDULED even when open_investigation_hold_count + open_rebill_count is already positive: SHUTOFF_HELD is reached only by the system transition that fires when that sum moves from 0 to positive. A shutoff scheduled while a hold is already outstanding therefore sits in SHUTOFF_SCHEDULED and is blocked at execution time with ERR_SHUTOFF_HOLD_ACTIVE"
  - method: POST
    path: /service-accounts/{id}/execute-shutoff
    roles: [BillingSupervisor]
    input: []
    output: ServiceAccount
    description: Execute a scheduled shutoff. Refused while any investigation or rebill hold is open, and before the notice period has elapsed.
    side_effects:
      - "service_status SHUTOFF_SCHEDULED -> SHUTOFF_EXECUTED; shutoff_scheduled_for = null"
  - method: POST
    path: /service-accounts/{id}/payments
    roles: [Customer, CustomerServiceRep]
    input: ["amount_cents", "memo?"]
    output: AccountLedgerEntry
    description: Record a customer payment against the account.
    side_effects:
      - "Insert AccountLedgerEntry{entry_type: PAYMENT, source_kind: CUSTOMER_PAYMENT, amount_cents: -amount_cents, bill_id: null, source_id: null, effective_at: clock_now}"
      - "Recompute ServiceAccount.balance_cents, then credit_status, then service_status, in that order"

  # ---------------------------------------------------------------------------
  # Meter
  # ---------------------------------------------------------------------------
  - method: POST
    path: /meters
    roles: [SystemAdmin, MeterTechnician]
    input: ["account_id", "meter_serial", "meter_type", "size_inches", "initial_register_value", "parent_meter_id?"]
    output: Meter
    description: Register a meter. parent_meter_id is required for IRRIGATION_SUBMETER and BACKFLOW_FIRE_LINE and forbidden for POTABLE_MASTER.
    side_effects:
      - "accuracy_status = UNTESTED; accuracy_pct = null; correction_factor = null; last_test_completed_at = null"
  - method: GET
    path: /meters
    roles: [SystemAdmin, MeterTechnician, CustomerServiceRep, BillingSupervisor, Customer]
    input: ["account_id?", "parent_meter_id?", "meter_type?", "accuracy_status?", "limit?", "offset?"]
    output: Meter[]
    description: List meters, filterable by owning account and by master meter.
    side_effects: []
  - method: GET
    path: /meters/{id}
    roles: [SystemAdmin, MeterTechnician, CustomerServiceRep, BillingSupervisor, Customer]
    input: []
    output: Meter
    description: Retrieve one meter with its accuracy_status, accuracy_pct and correction_factor.
    side_effects: []

  # ---------------------------------------------------------------------------
  # MeterReading
  # ---------------------------------------------------------------------------
  - method: POST
    path: /meter-readings
    roles: [MeterTechnician, SystemAdmin]
    input: ["meter_id", "read_date", "read_type", "reading_value", "corrects_reading_id?"]
    output: MeterReading
    description: |
      Post a meter read. read_type ACTUAL and ESTIMATED must not regress the register.
      read_type CORRECTED requires corrects_reading_id and supersedes that row, and is refused
      when the affected bill's period is LOCKED or past its rebilling_deadline_date.
    side_effects:
      - "consumption_since_prior_gallons = reading_value - the reading_value of the prior live read on the meter, or - Meter.initial_register_value when this is the first read"
      - "When read_type == CORRECTED: the row named by corrects_reading_id has superseded_by_reading_id set to the new row's id"
      - "When read_type == CORRECTED and a Bill of the containing period exists in ISSUED, UNDER_INVESTIGATION or ADJUSTED: that bill recomputes every charge field and moves to REBILL_PENDING, incrementing ServiceAccount.open_rebill_count, which may move service_status SHUTOFF_SCHEDULED -> SHUTOFF_HELD"
  - method: GET
    path: /meter-readings
    roles: [MeterTechnician, SystemAdmin, CustomerServiceRep, BillingSupervisor, Customer]
    input: ["meter_id?", "corrects_reading_id?", "superseded_by_reading_id?", "read_type?", "live_only?", "limit?", "offset?"]
    output: MeterReading[]
    description: List meter readings ordered read_date ASC then created_at ASC. live_only=true returns only rows whose superseded_by_reading_id is null.
    side_effects: []
  - method: GET
    path: /meter-readings/{id}
    roles: [MeterTechnician, SystemAdmin, CustomerServiceRep, BillingSupervisor, Customer]
    input: []
    output: MeterReading
    description: Retrieve one meter reading.
    side_effects: []

  # ---------------------------------------------------------------------------
  # Bill
  # ---------------------------------------------------------------------------
  - method: POST
    path: /bills
    roles: [BillingSupervisor, SystemAdmin]
    input: ["account_id", "period_id", "meter_id", "read_type"]
    output: Bill
    description: |
      Generate a bill for one meter and one period. Consumption is derived from the live reads
      bounding the period, never supplied by the caller. seasonal_baseline_gallons,
      baseline_sample_count, anomaly_ratio and anomaly_flag are all computed here.
    side_effects:
      - "consumption_gallons derived from the live ACTUAL or CORRECTED reads bounding the period"
      - "seasonal_baseline_gallons and baseline_sample_count computed by calculations.seasonal_baseline"
      - "anomaly_ratio and anomaly_flag computed by calculations.anomaly_screen"
      - "water_charge_cents computed by calculations.tiered_water_charge"
      - "submeter_credit_gallons, sewer_billable_gallons and sewer_charge_cents computed by calculations.sewer_charge_with_submeter_credit"
      - "total_charge_cents = water_charge_cents + sewer_charge_cents; adjusted_total_cents = total_charge_cents"
      - "billing_status = DRAFT; no ledger entry is written until issue"
  - method: GET
    path: /bills
    roles: [BillingSupervisor, SystemAdmin, CustomerServiceRep, Customer]
    input: ["account_id?", "period_id?", "meter_id?", "rebill_of_bill_id?", "billing_status?", "anomaly_flag?", "limit?", "offset?"]
    output: Bill[]
    description: List bills ordered created_at ASC, filterable by account, period, meter and by the bill they replaced.
    side_effects: []
  - method: GET
    path: /bills/{id}
    roles: [BillingSupervisor, SystemAdmin, CustomerServiceRep, Customer]
    input: []
    output: Bill
    description: Retrieve one bill with every computed charge and anomaly field.
    side_effects: []
  - method: GET
    path: /bills/{id}/ledger-entries
    roles: [BillingSupervisor, SystemAdmin, CustomerServiceRep, Customer]
    input: ["source_kind?", "limit?", "offset?"]
    output: AccountLedgerEntry[]
    description: List the ledger entries attributed to one bill, ordered created_at ASC.
    side_effects: []
  - method: GET
    path: /bills/{id}/adjustment-preview
    roles: [CustomerServiceRep, BillingSupervisor]
    input: [assumed_leak_type]
    output: "{ bill_id: string, assumed_leak_type: string, recommended_variant: string, excess_gallons: integer, excess_reprice_net_cents: integer, baseline_rebill_net_cents: integer, variant_delta_cents: integer }"
    description: |
      Read-only dual-variant preview. Runs calculations.leak_adjustment_credit twice on the same
      bill, once forced to EXCESS_REPRICE and once forced to BASELINE_REBILL, and returns both
      nets plus the delta. Creates nothing and writes no ledger entry.
    side_effects: []
  - method: POST
    path: /bills/{id}/issue
    roles: [BillingSupervisor]
    input: []
    output: Bill
    description: Issue a DRAFT bill, posting its charge to the account ledger.
    side_effects:
      - "billing_status DRAFT -> ISSUED; due_date = period.end_date + BILL_DUE_DAYS days"
      - "Insert AccountLedgerEntry{entry_type: CHARGE, source_kind: BILL_CHARGE, amount_cents: +total_charge_cents, bill_id, source_id: bill.id}"
      - "Recompute ServiceAccount.balance_cents, then credit_status, then service_status, in that order"
  - method: POST
    path: /bills/{id}/rebill
    roles: [BillingSupervisor]
    input: []
    output: Bill
    description: |
      Rebill a bill sitting in REBILL_PENDING. Returns the NEW replacement bill, already ISSUED,
      whose rebill_of_bill_id points at the superseded bill. Refused past the period's
      rebilling_deadline_date and on LOCKED periods.
    side_effects:
      - "The superseded bill moves REBILL_PENDING -> REBILLED"
      - "Insert AccountLedgerEntry{entry_type: REVERSAL, source_kind: REBILL_REVERSAL, amount_cents: negative of the sum of the superseded bill's BILL_CHARGE and REBILL_CHARGE entries}"
      - "Create the replacement Bill in DRAFT with rebill_of_bill_id set, then auto-issue it, writing AccountLedgerEntry{entry_type: CHARGE, source_kind: REBILL_CHARGE, amount_cents: +replacement.total_charge_cents}"
      - "Decrement ServiceAccount.open_rebill_count; recompute balance_cents, then credit_status, then service_status"

  # ---------------------------------------------------------------------------
  # HighBillInvestigation
  # ---------------------------------------------------------------------------
  - method: POST
    path: /investigations
    roles: [CustomerServiceRep, Customer]
    input: [bill_id, reported_cause]
    output: HighBillInvestigation
    description: |
      Open a high-bill investigation on an ISSUED bill. Refused when the bill has no seasonal
      baseline (fewer than three qualifying same-season bills) and when a non-terminal
      investigation already exists for it.
    side_effects:
      - "status = OPEN; leak_determination = UNDETERMINED; evidence_round_count = 0; remand_count = 0"
      - "account_id copied from bill.account_id; opened_by_role and opened_by_user_id stamped from the request headers"
      - "shutoff_hold_active = true; ServiceAccount.open_investigation_hold_count += 1, which moves service_status SHUTOFF_SCHEDULED -> SHUTOFF_HELD when a shutoff was pending"
      - "Bill ISSUED -> UNDER_INVESTIGATION"
  - method: GET
    path: /investigations
    roles: [CustomerServiceRep, Customer, BillingSupervisor, SystemAdmin, UtilityBoardClerk]
    input: ["bill_id?", "account_id?", "status?", "leak_determination?", "limit?", "offset?"]
    output: HighBillInvestigation[]
    description: List investigations ordered created_at ASC.
    side_effects: []
  - method: GET
    path: /investigations/{id}
    roles: [CustomerServiceRep, Customer, BillingSupervisor, SystemAdmin, UtilityBoardClerk]
    input: []
    output: HighBillInvestigation
    description: Retrieve one investigation with its round and remand counters.
    side_effects: []
  - method: POST
    path: /investigations/{id}/request-evidence
    roles: [CustomerServiceRep]
    input: ["note?"]
    output: HighBillInvestigation
    description: Ask the customer for evidence. Permitted at most MAX_EVIDENCE_ROUNDS times per investigation across the initial request and every rejection-driven re-request.
    side_effects:
      - "status OPEN or EVIDENCE_REQUESTED -> EVIDENCE_REQUESTED; evidence_round_count += 1"
  - method: POST
    path: /investigations/{id}/determine
    roles: [CustomerServiceRep]
    input: [leak_determination]
    output: HighBillInvestigation
    description: |
      Record the leak determination. CUSTOMER_SIDE_LEAK and UTILITY_SIDE_LEAK require a VERIFIED
      RepairProof; METER_ERROR requires a MeterTestRequest closed FAST or SLOW.
    side_effects:
      - "status EVIDENCE_UNDER_REVIEW -> DETERMINED"
      - "leak_determination set; determination_by_user_id = X-User-ID; determined_at = clock_now"
      - "determination_by_user_id becomes the segregation-of-duties bar for adjustment approval and for the board hearing officer"
  - method: POST
    path: /investigations/{id}/close-no-adjustment
    roles: [CustomerServiceRep]
    input: ["note?"]
    output: HighBillInvestigation
    description: Close an investigation without granting any credit.
    side_effects:
      - "status -> CLOSED_NO_ADJUSTMENT"
      - "shutoff_hold_active = false; ServiceAccount.open_investigation_hold_count -= 1, which may move service_status SHUTOFF_HELD -> SHUTOFF_SCHEDULED or -> ACTIVE"
      - "Bill UNDER_INVESTIGATION -> UPHELD_AS_BILLED"

  # ---------------------------------------------------------------------------
  # MeterTestRequest
  # ---------------------------------------------------------------------------
  - method: POST
    path: /meter-test-requests
    roles: [CustomerServiceRep, MeterTechnician, Customer]
    input: [investigation_id, meter_id, requested_test_type, requested_by_kind, deposit_cents]
    output: MeterTestRequest
    description: |
      Request an accuracy test. A CUSTOMER-requested test carries a METER_TEST_DEPOSIT_CENTS
      deposit; a UTILITY-requested test carries none. requested_test_type BENCH advances the
      request to BENCH_TEST_PENDING immediately.
    side_effects:
      - "status = REQUESTED, then immediately BENCH_TEST_PENDING when requested_test_type == BENCH"
      - "When deposit_cents > 0: insert AccountLedgerEntry{entry_type: CHARGE, source_kind: METER_TEST_DEPOSIT, amount_cents: +deposit_cents}, then recompute balance_cents, credit_status and service_status"
      - "deposit_refunded = false"
  - method: GET
    path: /meter-test-requests
    roles: [CustomerServiceRep, MeterTechnician, Customer, BillingSupervisor, SystemAdmin]
    input: ["investigation_id?", "meter_id?", "status?", "requested_test_type?", "limit?", "offset?"]
    output: MeterTestRequest[]
    description: List meter test requests ordered created_at ASC.
    side_effects: []
  - method: GET
    path: /meter-test-requests/{id}
    roles: [CustomerServiceRep, MeterTechnician, Customer, BillingSupervisor, SystemAdmin]
    input: []
    output: MeterTestRequest
    description: Retrieve one meter test request with its window, flow points and computed accuracy.
    side_effects: []
  - method: POST
    path: /meter-test-requests/{id}/schedule-field-test
    roles: [MeterTechnician]
    input: [window_start, window_end]
    output: MeterTestRequest
    description: |
      Reserve the meter for a half-open field-test window [window_start, window_end). Two windows
      that merely touch at an endpoint do not conflict. A window starting inside the
      METER_TEST_QUARANTINE_HOURS buffer after the meter's last completed test is refused.
    side_effects:
      - "status REQUESTED -> FIELD_TEST_SCHEDULED; window_start and window_end recorded"
  - method: POST
    path: /meter-test-requests/{id}/record-field-result
    roles: [MeterTechnician]
    input: [tested_at, field_result]
    output: MeterTestRequest
    description: Record a field-test outcome. tested_at must fall inside the half-open reserved window. PASS closes the request; SUSPECT escalates it to a bench test.
    side_effects:
      - "field_result and tested_at recorded"
      - "PASS: status -> CLOSED_PASS; Meter.accuracy_status = VERIFIED_ACCURATE; Meter.last_test_completed_at = tested_at; the deposit is forfeited and deposit_refunded stays false"
      - "SUSPECT: status -> BENCH_TEST_PENDING; the window reservation is released"
      - "Investigation EVIDENCE_REQUESTED -> EVIDENCE_UNDER_REVIEW on PASS"
  - method: POST
    path: /meter-test-requests/{id}/record-bench-result
    roles: [MeterTechnician]
    input: [tested_at, low_flow_pct, mid_flow_pct, high_flow_pct]
    output: MeterTestRequest
    description: |
      Record the three bench flow points. accuracy_method, accuracy_pct and bench_result are
      computed by calculations.bench_test_accuracy from the flow points and the meter size; the
      caller never supplies them. A FAST result drives the four-link correction cascade.
    side_effects:
      - "accuracy_method, accuracy_pct and bench_result computed; tested_at recorded"
      - "PASS: status -> CLOSED_PASS; Meter.accuracy_status = VERIFIED_ACCURATE; deposit forfeited"
      - "SLOW: status -> CLOSED_SLOW; Meter.accuracy_status = FAILED_SLOW; deposit refunded; NO corrected read and NO rebill"
      - "FAST: status -> CLOSED_FAST; Meter.accuracy_status = FAILED_FAST and Meter.correction_factor = round_half_up(100 / accuracy_pct, 6); a CORRECTED MeterReading is created against the latest live read; the containing bill recomputes and moves to REBILL_PENDING; ServiceAccount.open_rebill_count += 1 which may move service_status SHUTOFF_SCHEDULED -> SHUTOFF_HELD; deposit refunded"
      - "On FAST and SLOW with deposit_cents > 0: insert AccountLedgerEntry{entry_type: CREDIT, source_kind: METER_TEST_DEPOSIT_REFUND, amount_cents: -deposit_cents} and set deposit_refunded = true"
      - "Meter.accuracy_pct and Meter.last_test_completed_at are set on all three branches"
      - "Investigation EVIDENCE_REQUESTED -> EVIDENCE_UNDER_REVIEW on all three branches"

  # ---------------------------------------------------------------------------
  # RepairProof
  # ---------------------------------------------------------------------------
  - method: POST
    path: /repair-proofs
    roles: [Customer, CustomerServiceRep]
    input: [investigation_id, plumber_license_no, repair_date, leak_type, invoice_amount_cents, description]
    output: RepairProof
    description: Submit plumber repair proof for an investigation.
    side_effects:
      - "status = SUBMITTED"
      - "Investigation EVIDENCE_REQUESTED -> EVIDENCE_UNDER_REVIEW"
  - method: GET
    path: /repair-proofs
    roles: [Customer, CustomerServiceRep, BillingSupervisor, SystemAdmin, UtilityBoardClerk]
    input: ["investigation_id?", "status?", "leak_type?", "limit?", "offset?"]
    output: RepairProof[]
    description: List repair proofs ordered created_at ASC.
    side_effects: []
  - method: GET
    path: /repair-proofs/{id}
    roles: [Customer, CustomerServiceRep, BillingSupervisor, SystemAdmin, UtilityBoardClerk]
    input: []
    output: RepairProof
    description: Retrieve one repair proof.
    side_effects: []
  - method: POST
    path: /repair-proofs/{id}/verify
    roles: [CustomerServiceRep]
    input: []
    output: RepairProof
    description: Verify a submitted repair proof, unlocking a leak determination and a leak adjustment of the same leak_type.
    side_effects:
      - "status SUBMITTED -> VERIFIED; verified_by_user_id = X-User-ID"
  - method: POST
    path: /repair-proofs/{id}/reject
    roles: [CustomerServiceRep]
    input: [rejection_reason]
    output: RepairProof
    description: Reject a submitted repair proof, returning the investigation to the evidence loop or exhausting it.
    side_effects:
      - "status SUBMITTED -> REJECTED; rejection_reason recorded"
      - "Investigation EVIDENCE_UNDER_REVIEW -> EVIDENCE_REQUESTED with evidence_round_count += 1 when evidence_round_count < MAX_EVIDENCE_ROUNDS, otherwise -> EVIDENCE_EXHAUSTED with the counter left unchanged"

  # ---------------------------------------------------------------------------
  # LeakAdjustment
  # ---------------------------------------------------------------------------
  - method: POST
    path: /leak-adjustments
    roles: [CustomerServiceRep]
    input: [investigation_id, bill_id, leak_type, expected_investigation_version]
    output: LeakAdjustment
    description: |
      Draft a leak adjustment. Every credit field is computed by
      calculations.leak_adjustment_credit; the caller supplies only the leak_type. Guarded by
      optimistic concurrency on the parent investigation's version.
    side_effects:
      - "variant_applied selected from leak_type (EXCESS_REPRICE for TOILET, IRRIGATION and POOL; BASELINE_REBILL for SERVICE_LINE and UNDERGROUND)"
      - "excess_gallons, water_credit_cents, sewer_relief_gallons, sewer_credit_cents, gross_credit_cents, cap_cents, capped_credit_cents, cap_applied, admin_fee_charged_cents and net_credit_cents all computed"
      - "status = DRAFT; created_by_user_id = X-User-ID; board_ordered = false"
      - "Increments HighBillInvestigation.version by 1"
      - "Investigation DETERMINED -> ADJUSTMENT_PENDING"
  - method: GET
    path: /leak-adjustments
    roles: [CustomerServiceRep, BillingSupervisor, SystemAdmin, Customer, UtilityBoardClerk]
    input: ["investigation_id?", "bill_id?", "supersedes_adjustment_id?", "status?", "variant_applied?", "limit?", "offset?"]
    output: LeakAdjustment[]
    description: List leak adjustments ordered created_at ASC, filterable by investigation, bill and superseded adjustment.
    side_effects: []
  - method: GET
    path: /leak-adjustments/{id}
    roles: [CustomerServiceRep, BillingSupervisor, SystemAdmin, Customer, UtilityBoardClerk]
    input: []
    output: LeakAdjustment
    description: Retrieve one leak adjustment with every computed credit field.
    side_effects: []
  - method: POST
    path: /leak-adjustments/{id}/submit
    roles: [CustomerServiceRep]
    input: []
    output: LeakAdjustment
    description: Submit a draft adjustment for supervisor approval, recomputing every credit field from the bill's current charges.
    side_effects:
      - "status DRAFT -> PENDING_APPROVAL"
      - "Every credit field is recomputed so a rebill between draft and submit cannot leave a stale credit"
  - method: POST
    path: /leak-adjustments/{id}/return
    roles: [BillingSupervisor]
    input: [return_reason]
    output: LeakAdjustment
    description: Return a pending adjustment to the drafter for revision. No ledger movement.
    side_effects:
      - "status PENDING_APPROVAL -> DRAFT; return_reason recorded"
  - method: POST
    path: /leak-adjustments/{id}/approve
    roles: [BillingSupervisor]
    input: []
    output: LeakAdjustment
    description: |
      Approve and immediately post the credit. Refused when the approver is the user who recorded
      the determination, when the bill's period is LOCKED, and when another approved or posted
      adjustment already sits inside the ADJ_ROLLING_WINDOW_MONTHS once-per-period window.
    side_effects:
      - "status PENDING_APPROVAL -> APPROVED -> POSTED within the same request; approved_by_user_id = X-User-ID; posted_at = clock_now"
      - "CASCADE LINK 1: insert AccountLedgerEntry{entry_type: CREDIT, source_kind: LEAK_ADJUSTMENT_CREDIT, amount_cents: -capped_credit_cents} and, when admin_fee_charged_cents > 0, AccountLedgerEntry{entry_type: CHARGE, source_kind: LEAK_ADJUSTMENT_ADMIN_FEE, amount_cents: +admin_fee_charged_cents}"
      - "Bill UNDER_INVESTIGATION -> ADJUSTED; bill.adjusted_total_cents recomputed"
      - "Investigation ADJUSTMENT_PENDING -> RESOLVED; shutoff_hold_active = false; ServiceAccount.open_investigation_hold_count -= 1"
      - "CASCADE LINK 2: ServiceAccount.balance_cents recomputed from the ledger"
      - "CASCADE LINK 3: ServiceAccount.credit_status recomputed from the new balance"
      - "CASCADE LINK 4: ServiceAccount.service_status moves to ACTIVE when credit_status became CURRENT or IN_ARRANGEMENT, and shutoff_scheduled_for = null"
  - method: POST
    path: /leak-adjustments/{id}/deny
    roles: [BillingSupervisor]
    input: [denial_reason]
    output: LeakAdjustment
    description: Deny a pending adjustment. Refused when the denier is the user who recorded the determination.
    side_effects:
      - "status PENDING_APPROVAL -> DENIED; denial_reason recorded; no ledger movement"
      - "Investigation ADJUSTMENT_PENDING -> DETERMINED so a fresh draft may be raised"
  - method: POST
    path: /leak-adjustments/{id}/reverse
    roles: [BillingSupervisor]
    input: [reversal_reason]
    output: LeakAdjustment
    description: |
      Reverse a posted adjustment. One compensating ledger entry undoes both the credit and the
      admin fee, restoring the account balance to its exact pre-approval value.
    side_effects:
      - "status POSTED -> REVERSED; reversal_reason recorded"
      - "Insert AccountLedgerEntry{entry_type: REVERSAL, source_kind: LEAK_ADJUSTMENT_REVERSAL, amount_cents: +capped_credit_cents - admin_fee_charged_cents}"
      - "Bill ADJUSTED -> ISSUED; bill.adjusted_total_cents recomputed"
      - "Investigation RESOLVED -> DETERMINED; shutoff_hold_active = true; ServiceAccount.open_investigation_hold_count += 1"
      - "ServiceAccount.balance_cents, credit_status and service_status recomputed in that order, restoring balance_cents to its pre-approval value"

  # ---------------------------------------------------------------------------
  # PaymentArrangement
  # ---------------------------------------------------------------------------
  - method: POST
    path: /payment-arrangements
    roles: [CustomerServiceRep, Customer]
    input: ["account_id", "bill_id", "total_amount_cents", "down_payment_cents", "installment_count", "expected_account_version", "investigation_id?"]
    output: PaymentArrangement
    description: |
      Propose an instalment plan for a bill. installment_cents and final_installment_cents are
      computed by calculations.payment_arrangement_schedule. Guarded by optimistic concurrency on
      the parent account's version, because creating a plan cancels any existing PROPOSED or
      ACTIVE plan on the account.
    side_effects:
      - "installment_cents and final_installment_cents computed; paid_installment_count = 0; missed_payment_count = 0; reinstatement_count = 0"
      - "status = PROPOSED"
      - "Any other PaymentArrangement on the account in PROPOSED or ACTIVE moves to CANCELLED, and ServiceAccount.credit_status is recomputed"
      - "Increments ServiceAccount.version by 1"
  - method: GET
    path: /payment-arrangements
    roles: [CustomerServiceRep, Customer, BillingSupervisor, SystemAdmin]
    input: ["account_id?", "bill_id?", "investigation_id?", "status?", "limit?", "offset?"]
    output: PaymentArrangement[]
    description: List payment arrangements ordered created_at ASC.
    side_effects: []
  - method: GET
    path: /payment-arrangements/{id}
    roles: [CustomerServiceRep, Customer, BillingSupervisor, SystemAdmin]
    input: []
    output: PaymentArrangement
    description: Retrieve one payment arrangement with its computed instalment schedule.
    side_effects: []
  - method: POST
    path: /payment-arrangements/{id}/activate
    roles: [Customer, CustomerServiceRep]
    input: []
    output: PaymentArrangement
    description: Activate a proposed plan by taking the down payment. Pins credit_status to IN_ARRANGEMENT and restores service.
    side_effects:
      - "status PROPOSED -> ACTIVE"
      - "Insert AccountLedgerEntry{entry_type: PAYMENT, source_kind: ARRANGEMENT_DOWN_PAYMENT, amount_cents: -down_payment_cents, bill_id}"
      - "ServiceAccount.balance_cents recomputed, then credit_status becomes IN_ARRANGEMENT, then service_status moves to ACTIVE"
  - method: POST
    path: /payment-arrangements/{id}/record-payment
    roles: [Customer, CustomerServiceRep]
    input: [amount_cents, on_time]
    output: PaymentArrangement
    description: Record an instalment. MISSED_PAYMENTS_TO_DEFAULT late instalments default the plan.
    side_effects:
      - "Insert AccountLedgerEntry{entry_type: PAYMENT, source_kind: ARRANGEMENT_INSTALLMENT, amount_cents: -amount_cents, bill_id}"
      - "paid_installment_count += 1; when on_time == false, missed_payment_count += 1"
      - "status -> COMPLETED when paid_installment_count reaches installment_count; status -> DEFAULTED when missed_payment_count reaches MISSED_PAYMENTS_TO_DEFAULT"
      - "ServiceAccount.balance_cents, credit_status and service_status recomputed in that order"
  - method: POST
    path: /payment-arrangements/{id}/reinstate
    roles: [BillingSupervisor]
    input: []
    output: PaymentArrangement
    description: Reinstate a defaulted plan. Allowed at most MAX_ARRANGEMENT_REINSTATEMENTS times.
    side_effects:
      - "status DEFAULTED -> ACTIVE; reinstatement_count += 1; missed_payment_count reset to 0"
      - "ServiceAccount.credit_status returns to IN_ARRANGEMENT, then service_status is recomputed"

  # ---------------------------------------------------------------------------
  # BoardAppeal
  # ---------------------------------------------------------------------------
  - method: POST
    path: /board-appeals
    roles: [Customer, CustomerServiceRep]
    input: [investigation_id, grounds]
    output: BoardAppeal
    description: |
      File an appeal to the utility board. Must be filed within APPEAL_FILING_DAYS of the
      determination (or of the no-adjustment closure). Re-asserts the shutoff hold.
    side_effects:
      - "status = FILED; filing_date = date(clock_now); filed_by_user_id = X-User-ID"
      - "Investigation DETERMINED, RESOLVED or CLOSED_NO_ADJUSTMENT -> APPEALED"
      - "shutoff_hold_active = true; ServiceAccount.open_investigation_hold_count += 1 when the hold was not already held"
  - method: GET
    path: /board-appeals
    roles: [Customer, CustomerServiceRep, UtilityBoardClerk, BillingSupervisor, SystemAdmin]
    input: ["investigation_id?", "status?", "hearing_date?", "limit?", "offset?"]
    output: BoardAppeal[]
    description: List board appeals ordered created_at ASC. Filtering by hearing_date reveals the docket load for a date.
    side_effects: []
  - method: GET
    path: /board-appeals/{id}
    roles: [Customer, CustomerServiceRep, UtilityBoardClerk, BillingSupervisor, SystemAdmin]
    input: []
    output: BoardAppeal
    description: Retrieve one board appeal.
    side_effects: []
  - method: POST
    path: /board-appeals/{id}/schedule
    roles: [UtilityBoardClerk]
    input: [hearing_date]
    output: BoardAppeal
    description: |
      Docket a hearing. Requires at least HEARING_MIN_NOTICE_DAYS of notice from the filing date
      and refuses a date already holding HEARING_DOCKET_CAPACITY scheduled hearings.
    side_effects:
      - "status FILED -> SCHEDULED; hearing_date recorded"
  - method: POST
    path: /board-appeals/{id}/record-decision
    roles: [UtilityBoardClerk]
    input: [decision, decision_note]
    output: BoardAppeal
    description: |
      Record the board's decision. UPHOLD settles the bill as billed, REVERSE creates a
      board-ordered adjustment forced to the BASELINE_REBILL variant, and REMAND returns the
      investigation to the evidence loop at most REMAND_MAX times.
    side_effects:
      - "hearing_officer_user_id = X-User-ID; decision and decision_note recorded"
      - "UPHOLD: status -> UPHELD; Investigation APPEALED -> RESOLVED; Bill -> UPHELD_AS_BILLED; shutoff_hold_active = false"
      - "REVERSE: status -> REVERSED; a LeakAdjustment{board_ordered: true, variant_applied: BASELINE_REBILL, supersedes_adjustment_id: the most recent DENIED or REVERSED adjustment on the investigation} is created directly in PENDING_APPROVAL; Investigation APPEALED -> ADJUSTMENT_PENDING"
      - "REMAND: status -> REMANDED; Investigation APPEALED -> EVIDENCE_REQUESTED with remand_count += 1 and evidence_round_count += 1"

# =============================================================================
# §1.6 Error Catalog
# =============================================================================
errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    when: "X-User-ID or X-User-Role header absent or empty"
  - error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    when: "X-User-Role is not a declared role, or is not listed on the target endpoint"
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    when: "Malformed body, missing required field, wrong type, unknown enum value, out-of-range integer, or bad pagination parameter"
  - error_id: ERR_RATE_SCHEDULE_NOT_FOUND
    http_status: 404
    when: "rate_schedule_id in path or body does not resolve"
  - error_id: ERR_BILLING_PERIOD_NOT_FOUND
    http_status: 404
    when: "billing period id in path or period_id in body does not resolve"
  - error_id: ERR_SERVICE_ACCOUNT_NOT_FOUND
    http_status: 404
    when: "service account id in path or account_id in body does not resolve"
  - error_id: ERR_METER_NOT_FOUND
    http_status: 404
    when: "meter id in path or meter_id or parent_meter_id in body does not resolve"
  - error_id: ERR_METER_READING_NOT_FOUND
    http_status: 404
    when: "meter reading id in path or corrects_reading_id in body does not resolve"
  - error_id: ERR_BILL_NOT_FOUND
    http_status: 404
    when: "bill id in path or bill_id in body does not resolve"
  - error_id: ERR_INVESTIGATION_NOT_FOUND
    http_status: 404
    when: "investigation id in path or investigation_id in body does not resolve"
  - error_id: ERR_METER_TEST_REQUEST_NOT_FOUND
    http_status: 404
    when: "meter test request id in path does not resolve"
  - error_id: ERR_REPAIR_PROOF_NOT_FOUND
    http_status: 404
    when: "repair proof id in path does not resolve"
  - error_id: ERR_LEAK_ADJUSTMENT_NOT_FOUND
    http_status: 404
    when: "leak adjustment id in path does not resolve"
  - error_id: ERR_PAYMENT_ARRANGEMENT_NOT_FOUND
    http_status: 404
    when: "payment arrangement id in path does not resolve"
  - error_id: ERR_BOARD_APPEAL_NOT_FOUND
    http_status: 404
    when: "board appeal id in path does not resolve"
  - error_id: ERR_ACCOUNT_OWNERSHIP_MISMATCH
    http_status: 403
    when: "A Customer caller reaches a row that does not belong to the ServiceAccount whose id equals X-User-ID"
  - error_id: ERR_STALE_INVESTIGATION_VERSION
    http_status: 412
    when: "expected_investigation_version does not equal HighBillInvestigation.version on POST /leak-adjustments"
  - error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    when: "expected_account_version does not equal ServiceAccount.version on POST /payment-arrangements"
  - error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    when: "The subject entity is not in a state from which the requested transition is declared in §1.2"
  - error_id: ERR_INVESTIGATION_ALREADY_OPEN
    http_status: 409
    when: "POST /investigations on a bill that already carries a non-terminal investigation"
  - error_id: ERR_BILLING_PERIOD_CLOSED
    http_status: 409
    when: "POST /bills for a period whose status is not OPEN"
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    when: "The X-User-ID approving, denying or reversing an adjustment equals investigation.determination_by_user_id"
  - error_id: ERR_HEARING_OFFICER_CONFLICT
    http_status: 403
    when: "The X-User-ID recording a board decision equals investigation.determination_by_user_id or appeal.filed_by_user_id"
  - error_id: ERR_SHUTOFF_HOLD_ACTIVE
    http_status: 409
    when: "execute-shutoff attempted while open_investigation_hold_count or open_rebill_count is positive"
  - error_id: ERR_SHUTOFF_NOTICE_NOT_ELAPSED
    http_status: 409
    when: "execute-shutoff attempted before shutoff_scheduled_for"
  - error_id: ERR_BILLING_PERIOD_LOCKED
    http_status: 409
    when: "A fiscal write touches a bill whose period.status is LOCKED"
  - error_id: ERR_REBILL_WINDOW_EXPIRED
    http_status: 422
    when: "rebill attempted after the period's rebilling_deadline_date"
  - error_id: ERR_APPEAL_UNTIMELY
    http_status: 422
    when: "Appeal filed more than APPEAL_FILING_DAYS days after the determination or closure"
  - error_id: ERR_HEARING_NOTICE_TOO_SHORT
    http_status: 422
    when: "hearing_date is fewer than HEARING_MIN_NOTICE_DAYS days after the filing date"
  - error_id: ERR_HEARING_NOT_YET_HELD
    http_status: 422
    when: "record-decision attempted before the hearing_date"
  - error_id: ERR_METER_TEST_QUARANTINE
    http_status: 409
    when: "window_start falls inside the METER_TEST_QUARANTINE_HOURS buffer after the meter's last completed test"
  - error_id: ERR_TEST_RESULT_OUTSIDE_WINDOW
    http_status: 422
    when: "tested_at is not inside the half-open reserved window"
  - error_id: ERR_BILLING_PERIOD_NOT_ENDED
    http_status: 422
    when: "POST /bills before the period's end_date has passed"
  - error_id: ERR_READ_DATE_IN_FUTURE
    http_status: 422
    when: "POST /meter-readings with read_date after the logical clock date"
  - error_id: ERR_BILLING_PERIOD_OVERLAP
    http_status: 409
    when: "A new period's closed-closed date interval intersects an existing period, including sharing one endpoint date"
  - error_id: ERR_METER_TEST_WINDOW_CONFLICT
    http_status: 409
    when: "A field-test window's half-open interval intersects another live reservation on the same meter"
  - error_id: ERR_DUPLICATE_BILL_FOR_PERIOD
    http_status: 409
    when: "A non-REBILLED bill already exists for that meter and period"
  - error_id: ERR_EVIDENCE_ROUND_LIMIT
    http_status: 422
    when: "request-evidence attempted when evidence_round_count has reached MAX_EVIDENCE_ROUNDS"
  - error_id: ERR_REMAND_LIMIT_EXCEEDED
    http_status: 422
    when: "A REMAND decision is recorded when remand_count has reached REMAND_MAX"
  - error_id: ERR_HEARING_DOCKET_FULL
    http_status: 409
    when: "HEARING_DOCKET_CAPACITY appeals already hold SCHEDULED status on that hearing_date"
  - error_id: ERR_REINSTATEMENT_LIMIT
    http_status: 422
    when: "reinstate attempted when reinstatement_count has reached MAX_ARRANGEMENT_REINSTATEMENTS"
  - error_id: ERR_NEGATIVE_CONSUMPTION
    http_status: 422
    when: "A non-CORRECTED read regresses the register below the latest live read or the initial register value"
  - error_id: ERR_INSUFFICIENT_BASELINE_HISTORY
    http_status: 422
    when: "POST /investigations on a bill whose seasonal_baseline_gallons is null"
  - error_id: ERR_REPAIR_PROOF_REQUIRED
    http_status: 422
    when: "POST /leak-adjustments with no VERIFIED RepairProof and a leak_determination other than METER_ERROR"
  - error_id: ERR_METER_NOT_BILLABLE
    http_status: 422
    when: "POST /bills against a meter whose meter_type is not POTABLE_MASTER"
  - error_id: ERR_SUBMETER_PARENT_INVALID
    http_status: 422
    when: "parent_meter_id supplied for a POTABLE_MASTER meter, omitted for a submeter, or pointing at a meter that is not a POTABLE_MASTER on the same account"
  - error_id: ERR_INSTALLMENT_LIMIT_EXCEEDED
    http_status: 422
    when: "installment_count exceeds MAX_INSTALLMENTS"
  - error_id: ERR_LEAK_TYPE_MISMATCH
    http_status: 422
    when: "The adjustment's leak_type matches no VERIFIED RepairProof on the investigation and the determination is not METER_ERROR"
  - error_id: ERR_ADJUSTMENT_BILL_MISMATCH
    http_status: 422
    when: "POST /leak-adjustments with bill_id different from investigation.bill_id"
  - error_id: ERR_TEST_METER_ACCOUNT_MISMATCH
    http_status: 422
    when: "The tested meter belongs to a different account than the investigation"
  - error_id: ERR_ARRANGEMENT_ACCOUNT_MISMATCH
    http_status: 422
    when: "The financed bill or the cited investigation belongs to a different account"
  - error_id: ERR_BILL_METER_ACCOUNT_MISMATCH
    http_status: 422
    when: "POST /bills where the meter belongs to a different account than account_id"
  - error_id: ERR_LEAK_ADJUSTMENT_CAP_EXCEEDED
    http_status: 422
    when: "Another approved or posted adjustment on the account already sits inside the ADJ_ROLLING_WINDOW_MONTHS once-per-period window"
  - error_id: ERR_DOWN_PAYMENT_TOO_LOW
    http_status: 422
    when: "down_payment_cents is below round_half_up(total_amount_cents * DOWN_PAYMENT_MIN_BP / 10000)"
  - error_id: ERR_ARRANGEMENT_AMOUNT_MISMATCH
    http_status: 422
    when: "total_amount_cents does not equal the financed bill's adjusted_total_cents"
  - error_id: ERR_PAYMENT_AMOUNT_INVALID
    http_status: 422
    when: "amount_cents is not strictly positive"
  - error_id: ERR_TEST_DEPOSIT_INVALID
    http_status: 422
    when: "deposit_cents does not match the required amount for the requested_by_kind"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: Customer
    identity: "entity_backed:ServiceAccount — X-User-ID is the id of the caller's own ServiceAccount row"
    exclusive_operations: []
    shared_operations:
      - "POST /investigations (also CustomerServiceRep)"
      - "POST /repair-proofs (also CustomerServiceRep)"
      - "POST /meter-test-requests (also CustomerServiceRep, MeterTechnician)"
      - "POST /board-appeals (also CustomerServiceRep)"
      - "POST /payment-arrangements (also CustomerServiceRep)"
      - "POST /payment-arrangements/{id}/activate (also CustomerServiceRep)"
      - "POST /payment-arrangements/{id}/record-payment (also CustomerServiceRep)"
      - "POST /service-accounts/{id}/payments (also CustomerServiceRep)"
      - "read access to their own account, meters, readings, bills, investigations, proofs, adjustments, arrangements and appeals"
    forbidden:
      - "Every /rate-schedules and /billing-periods write"
      - "POST /bills and POST /bills/{id}/issue and POST /bills/{id}/rebill"
      - "POST /investigations/{id}/determine, /request-evidence, /close-no-adjustment"
      - "POST /repair-proofs/{id}/verify and /reject"
      - "POST /leak-adjustments and every /leak-adjustments action"
      - "POST /meters and POST /meter-readings and every meter-test action endpoint"
      - "POST /board-appeals/{id}/schedule and /record-decision"
      - "POST /service-accounts/{id}/schedule-shutoff and /execute-shutoff"
      - "POST /payment-arrangements/{id}/reinstate"
      - "GET /bills/{id}/adjustment-preview"
    scoping: "Every read and write is scoped to the ServiceAccount whose id equals X-User-ID; anything else returns ERR_ACCOUNT_OWNERSHIP_MISMATCH"

  - name: CustomerServiceRep
    identity: opaque
    exclusive_operations:
      - "POST /investigations/{id}/request-evidence"
      - "POST /investigations/{id}/determine"
      - "POST /investigations/{id}/close-no-adjustment"
      - "POST /repair-proofs/{id}/verify"
      - "POST /repair-proofs/{id}/reject"
      - "POST /leak-adjustments"
      - "POST /leak-adjustments/{id}/submit"
    shared_operations:
      - "POST /service-accounts (also SystemAdmin)"
      - "POST /investigations, POST /repair-proofs, POST /meter-test-requests, POST /board-appeals, POST /payment-arrangements and its activate and record-payment actions, POST /service-accounts/{id}/payments (all also Customer)"
      - "GET /bills/{id}/adjustment-preview (also BillingSupervisor)"
      - "broad read access across every collection"
    forbidden:
      - "POST /leak-adjustments/{id}/approve, /return, /deny, /reverse"
      - "POST /bills, /issue, /rebill"
      - "POST /service-accounts/{id}/schedule-shutoff and /execute-shutoff"
      - "POST /payment-arrangements/{id}/reinstate"
      - "POST /meters, POST /meter-readings and every meter-test action endpoint"
      - "POST /board-appeals/{id}/schedule and /record-decision"
      - "Every /rate-schedules and /billing-periods write"
    scoping: "Unscoped across accounts"

  - name: MeterTechnician
    identity: opaque
    exclusive_operations:
      - "POST /meter-readings"
      - "POST /meter-test-requests/{id}/schedule-field-test"
      - "POST /meter-test-requests/{id}/record-field-result"
      - "POST /meter-test-requests/{id}/record-bench-result"
    shared_operations:
      - "POST /meters (also SystemAdmin)"
      - "POST /meter-test-requests (also CustomerServiceRep, Customer)"
      - "read access to meters, readings and meter test requests"
    forbidden:
      - "Every /bills, /investigations, /repair-proofs, /leak-adjustments, /payment-arrangements and /board-appeals write"
      - "POST /service-accounts and its action endpoints"
      - "GET /bills/{id}/adjustment-preview"
    scoping: "Unscoped across accounts"

  - name: BillingSupervisor
    identity: opaque
    exclusive_operations:
      - "POST /bills/{id}/issue"
      - "POST /bills/{id}/rebill"
      - "POST /leak-adjustments/{id}/return"
      - "POST /leak-adjustments/{id}/approve"
      - "POST /leak-adjustments/{id}/deny"
      - "POST /leak-adjustments/{id}/reverse"
      - "POST /service-accounts/{id}/schedule-shutoff"
      - "POST /service-accounts/{id}/execute-shutoff"
      - "POST /payment-arrangements/{id}/reinstate"
    shared_operations:
      - "POST /bills (also SystemAdmin)"
      - "GET /bills/{id}/adjustment-preview (also CustomerServiceRep)"
      - "broad read access across every collection"
    forbidden:
      - "POST /leak-adjustments and POST /leak-adjustments/{id}/submit — the supervisor approves credits but never drafts them"
      - "POST /investigations/{id}/determine — the determiner and the approver must be different people, and the roles are separated as well as the user ids"
      - "POST /meter-readings and every meter-test action endpoint"
      - "POST /board-appeals/{id}/schedule and /record-decision"
      - "Every /rate-schedules and /billing-periods write"
    scoping: "Unscoped across accounts"
    note: "Beyond the role separation, approve, deny and reverse additionally compare X-User-ID against investigation.determination_by_user_id and return ERR_SEGREGATION_OF_DUTIES on a match, so a single human holding both roles is still blocked"

  - name: UtilityBoardClerk
    identity: opaque
    exclusive_operations:
      - "POST /board-appeals/{id}/schedule"
      - "POST /board-appeals/{id}/record-decision"
    shared_operations:
      - "read access to investigations, repair proofs, leak adjustments and board appeals"
    forbidden:
      - "POST /board-appeals — the clerk dockets and decides appeals but does not file them"
      - "Every /bills, /meters, /meter-readings, /leak-adjustments, /payment-arrangements and /service-accounts write"
      - "GET /bills/{id}/adjustment-preview"
    scoping: "Unscoped across accounts"
    note: "record-decision compares X-User-ID against investigation.determination_by_user_id and appeal.filed_by_user_id and returns ERR_HEARING_OFFICER_CONFLICT on either match"

  - name: SystemAdmin
    identity: opaque
    exclusive_operations:
      - "POST /rate-schedules"
      - "POST /billing-periods"
      - "POST /billing-periods/{id}/close"
      - "POST /billing-periods/{id}/lock"
    shared_operations:
      - "POST /service-accounts (also CustomerServiceRep)"
      - "POST /meters (also MeterTechnician)"
      - "POST /meter-readings (also MeterTechnician)"
      - "POST /bills (also BillingSupervisor)"
      - "broad read access across every collection"
    forbidden:
      - "POST /bills/{id}/issue and /rebill"
      - "Every /leak-adjustments write and every /investigations action endpoint"
      - "Every /repair-proofs write, every /payment-arrangements write, every /board-appeals write"
      - "POST /service-accounts/{id}/schedule-shutoff, /execute-shutoff and /payments"
      - "GET /bills/{id}/adjustment-preview"
    scoping: "Unscoped across accounts"
