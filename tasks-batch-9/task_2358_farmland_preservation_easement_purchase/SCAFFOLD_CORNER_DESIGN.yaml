        test_recipe:
          setup:
            - "Application AP1 has an OFFER_ISSUED BARGAIN_SALE offer of 175,550,000 with total_program_cost_cents 160,364,925 at clock 2026-10-05. All three sources have obligation windows 2026-01-01 through 2027-12-31."
