            - call: "POST /reference-methods"
              payload: { pollutant_id: "${pm25_id}", method_code: "RFPS-0617-001", designation_type: "FRM", effective_from: "2020-01-01T00:00:00Z", max_span_drift_pct: 5.0, zero_drift_limit: 1.5, required_span_check_interval_days: 14, required_calibration_interval_days: 365 }
              as: NetworkAdmin
              captures: { frm_id: "$.data.id" }
            - call: "POST /monitoring-networks"
              payload: { name: "State Ambient Network", agency_code: "AQ01", metropolitan_population: 1200000 }
              as: NetworkAdmin
              captures: { net_id: "$.data.id" }
            - call: "POST /monitoring-sites"
              payload: { network_id: "${net_id}", site_code: "S-001", site_type: "POPULATION_ORIENTED", latitude: 39.75, longitude: -104.99, population_served: 400000, probe_height_m: 4.0, distance_to_roadway_m: 25.0, distance_to_obstruction_m: 12.0, obstruction_height_m: 6.0, distance_to_source_m: 0.0 }
              as: NetworkAdmin
              captures: { site_a_id: "$.data.id" }
            - call: "POST /monitoring-sites/${site_a_id}/siting-approval"
              payload: { waiver_granted: false }
              as: EpaRegionalReviewer
            - call: "POST /monitoring-sites/${site_a_id}/commence-operations"
              payload: {}
              as: ProgramManager
            - call: "POST /monitors"
              payload: { site_id: "${site_a_id}", reference_method_id: "${frm_id}", poc: 1, is_primary_for_design_value: true, installed_at: "2022-12-20T00:00:00Z" }
              as: NetworkAdmin
              captures: { mon_id: "$.data.id" }
            - call: "POST /monitors/${mon_id}/approve"
              payload: {}
              as: EpaRegionalReviewer
            - call: "POST /monitors/${mon_id}/commission"
              payload: {}
              as: FieldTechnician
            - call: "POST /monitors/${mon_id}/qc-events"
              payload: { event_type: "SPAN_CHECK", performed_at: "2026-01-02T00:00:00Z", span_drift_pct: 2.0 }
              as: FieldTechnician
            - call: "POST /network-assessments"
              payload: { network_id: "${net_id}", cycle_year: 2026 }
              as: ProgramManager
              captures: { assess_id: "$.data.id" }
            - call: "POST /network-assessments/${assess_id}/submit"
              payload: {}
              as: ProgramManager
            - call: "POST /site-change-requests"
              payload: { site_id: "${site_a_id}", request_type: "SHUTDOWN", justification: "Redundant with the co-located regional site", assessment_id: "${assess_id}" }
              as: ProgramManager
              captures: { scr_id: "$.data.id" }
            - call: "POST /site-change-requests/${scr_id}/submit"
              payload: {}
              as: ProgramManager
          trigger:
            - call: "POST /site-change-requests/${scr_id}/decision"
              payload: { decision: "APPROVE", decision_note: "Attempted before the assessment is approved" }
              as: EpaRegionalReviewer
              captures: { err_id: "$.data.error_id" }
            - call: "POST /network-assessments/${assess_id}/decision"
              payload: { decision: "APPROVE", decision_note: "Assessment accepted" }
              as: EpaRegionalReviewer
            - call: "POST /site-change-requests/${scr_id}/decision"
              payload: { decision: "APPROVE", decision_note: "Shutdown approved" }
              as: EpaRegionalReviewer
          assert:
            - "first decision attempt: response status == 422 and ${err_id} == ERR_ASSESSMENT_NOT_APPROVED"
            - "first decision attempt: SiteChangeRequest.${scr_id}.status == SUBMITTED"
            - "first decision attempt: MonitoringSite.${site_a_id}.status == OPERATING"
            - "after the assessment decision: NetworkAssessment.${assess_id}.status == APPROVED"
            - "after the assessment decision: MonitoringNetwork.${net_id}.network_status == ACTIVE"
            - "second decision attempt: SiteChangeRequest.${scr_id}.status == APPROVED"
            - "second decision attempt: MonitoringSite.${site_a_id}.status == SHUTDOWN"
            - "second decision attempt: Monitor.${mon_id}.monitor_status == DECOMMISSIONED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: invalidation_half_open_hours_allow_adjacency_reject_overlap
        grounds:
          - validations[priority=66]
          - entities.DataInvalidation.fields.start_hour_index
          - entities.DataInvalidation.fields.end_hour_index
          - errors[ERR_INVALIDATION_RANGE_OVERLAP]
          - concurrency_rules.invalidation-create-stale-batch
        distinguishing_aspect: |
          Interval semantics on the DataBatch resource: hour ranges are half-open [start, end) with no buffer, so [100, 200)
          is accepted immediately after [0, 100) - adjacency is legal - while [150, 250) is rejected for intersecting an
          APPLIED range. This is the opposite adjacency treatment from the closed, 24-hour-buffered event windows on
          MonitoringSite.
        test_recipe:
          setup:
            - "logical clock at 2026-01-05T00:00:00Z"
            - "one RAW 2025 Q1 quarter with scheduled_hour_count 2160 and no invalidations"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pollutants"
