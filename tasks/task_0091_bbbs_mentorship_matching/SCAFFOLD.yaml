  - method: POST
    path: "/match-meetings/{id}/hold"
    description: "Mark a SCHEDULED meeting HELD; advances Match CONFIRMED -> INTRODUCED"
    roles: [MatchSpecialist]
    code: 200
    input: ["outcome_notes?"]
    output: MatchMeeting
    side_effects: ["meeting -> HELD; Match -> INTRODUCED"]

  - method: POST
    path: "/match-meetings/{id}/no-show"
    description: "Mark a SCHEDULED meeting NO_SHOW"
    roles: [MatchSpecialist]
    code: 200
    input: []
    output: MatchMeeting
    side_effects: ["meeting -> NO_SHOW"]

  - method: POST
    path: "/match-meetings/{id}/affirm"
    description: "Affirm a HELD meeting; advances Match INTRODUCED -> ACTIVE and opens first SupervisionContact"
    roles: [MatchSpecialist]
    code: 200
    input: []
    output: MatchMeeting
    side_effects: ["meeting -> AFFIRMED; Match -> ACTIVE; first SupervisionContact OPEN created"]

  - method: POST
    path: "/match-meetings/{id}/rescind"
    description: "Rescind a HELD meeting; Match stays INTRODUCED"
    roles: [MatchSpecialist]
    code: 200
    input: []
    output: MatchMeeting
    side_effects: ["meeting -> RESCINDED"]

  # --- SupervisionContact ---
  - method: GET
    path: "/supervision-contacts/{id}"
    description: "Get a SupervisionContact"
    roles: [Coordinator, MatchSpecialist, Supervisor]
    code: 200
    input: []
    output: SupervisionContact
    side_effects: []

  - method: POST
    path: "/supervision-contacts/{id}/complete"
    description: "Complete an OPEN supervision follow-up; opens the next monthly contact"
    roles: [Supervisor]
    code: 200
    input: [contacted_at, party, "concern_flag?"]
    output: SupervisionContact
    side_effects: ["contact -> COMPLETED; next OPEN contact created; recomputes Match.compliance_status, last_contact_at"]

  # --- ExitTransition ---
  - method: GET
    path: "/exit-transitions/{id}"
    description: "Get an ExitTransition"
    roles: [Coordinator, MatchSpecialist, Supervisor]
    code: 200
    input: []
    output: ExitTransition
    side_effects: []

  - method: GET
    path: "/exit-transitions/{id}/survey"
    description: "Reverse-reachability: list OutcomeSurveys for an ExitTransition (0 or 1)"
    roles: [Coordinator, MatchSpecialist, Supervisor]
    code: 200
    input: []
    output: OutcomeSurvey[]
    side_effects: []

  - method: POST
    path: "/exit-transitions/{id}/finalize"
    description: "Finalize a DRAFT exit; closes the Match with divergent closure branches"
    roles: [Supervisor]
    code: 200
    input: []
    output: ExitTransition
    side_effects:
      - "exit -> FINALIZED; Match -> CLOSED (closure_reason=exit_type)"
      - "Cascade OPEN SupervisionContact -> MISSED; SCHEDULED MatchMeeting -> NO_SHOW; bubbles Child and Volunteer"

  # --- OutcomeSurvey ---
  - method: POST
    path: "/outcome-surveys"
    description: "Submit the Outcome Survey for a closed match (single, immutable)"
    roles: [Supervisor]
    code: 201
    input: [match_id, exit_transition_id, relationship_quality, child_outcome, would_rematch]
    output: OutcomeSurvey
    side_effects: ["computes composite_score and outcome_band"]

  - method: GET
    path: "/outcome-surveys/{id}"
    description: "Get an OutcomeSurvey"
    roles: [Coordinator, MatchSpecialist, Supervisor]
    code: 200
    input: []
    output: OutcomeSurvey
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for the operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/ill-typed field, bad enum, out-of-range number, or bad pagination param" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition is not defined from the resource's current state" }
  - { id: ERR_ADVERSE_FINDING_BLOCKS_CLEAR, http: 409, condition: "adverse_findings exceed the tolerance for the check type at CLEAR adjudication" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Supervisor finalizing an exit is the same user who confirmed the Match as MatchSpecialist" }
  - { id: ERR_CONSENT_NOT_ON_FILE, http: 409, condition: "Guardian consent not on file when proposing a match for the Child" }
  - { id: ERR_VOLUNTEER_NOT_ELIGIBLE, http: 409, condition: "Selected Volunteer is not ELIGIBLE at proposal acceptance" }
  - { id: ERR_VOLUNTEER_AT_CAPACITY, http: 409, condition: "Selected Volunteer already has an active match (one-on-one exclusivity)" }
  - { id: ERR_NO_ELIGIBLE_VOLUNTEER, http: 409, condition: "No eligible Volunteer in the candidate pool for the Child at proposal time" }
  - { id: ERR_MATCH_NOT_READY_FOR_MEETING, http: 409, condition: "Holding a meeting requires the parent Match in CONFIRMED" }
  - { id: ERR_MATCH_NOT_ACTIVE, http: 409, condition: "Supervision contact completion requires the parent Match in ACTIVE" }
  - { id: ERR_SURVEY_NOT_REQUIRED, http: 409, condition: "OutcomeSurvey submitted for an exit whose survey_required is false" }
  - { id: ERR_SURVEY_ALREADY_EXISTS, http: 409, condition: "A second OutcomeSurvey for the same match_id" }
  - { id: ERR_MEETING_WINDOW_INVALID, http: 422, condition: "MatchMeeting scheduled_end is not strictly after scheduled_start" }
  - { id: ERR_MEETING_OVERLAP, http: 409, condition: "New meeting's half-open interval overlaps an existing non-terminal meeting on the same Match" }
  - { id: ERR_GUARDIAN_DOUBLE_BOOKED, http: 409, condition: "New meeting violates the per-Guardian buffer against another of the guardian's children's meetings" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Coordinator
    description: "Intake/admin operator: registers volunteers, guardians, children, controls the test clock. Read access across the program."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc — advance/sweep the clock"
      - "POST /guardians — register guardian"
    shared_operations:
      - "POST /volunteers, POST /children, PATCH /guardians/{id} — intake"
      - "GET on all read endpoints"

  - name: BackgroundScreener
    description: "Runs and adjudicates background checks. Cannot propose or confirm matches (segregation from matching)."
    identity: opaque
    exclusive_operations:
      - "POST /volunteers/{id}/submit-screening — start screening"
      - "POST /background-checks/{id}/adjudicate — clear/flag a check"
    shared_operations:
      - "GET /volunteers/{id}, GET /volunteers, GET /volunteers/{id}/background-checks, GET /background-checks/{id}"

  - name: MatchSpecialist
    description: "Runs interest matching, proposes/accepts/declines proposals, schedules and runs match meetings, logs activities. X-User-ID of the specialist who accepts a proposal is recorded as the confirming user for segregation-of-duties checks."
    identity: opaque
    exclusive_operations:
      - "POST /children/{id}/propose-match — generate proposal"
      - "POST /match-proposals/{id}/accept, /decline — resolve proposal"
      - "POST /matches/{id}/meetings, POST /match-meetings/{id}/(hold|no-show|affirm|rescind) — meeting workflow"
      - "POST /volunteers/{id}/deactivate"
    shared_operations:
      - "POST /volunteers, POST /children, PATCH /guardians/{id} — shared intake with Coordinator"
      - "POST /matches/{id}/activities — shared activity logging with Supervisor"
      - "POST /matches/{id}/exit-transitions — open an exit (shared with Supervisor)"
      - "GET on all read endpoints"

  - name: Supervisor
    description: "Oversees active matches: completes monthly supervision contacts, finalizes exits, submits outcome surveys. Cannot be the confirming MatchSpecialist of an exit it finalizes."
    identity: opaque
    exclusive_operations:
      - "POST /supervision-contacts/{id}/complete — monthly follow-up"
      - "POST /exit-transitions/{id}/finalize — close the match"
      - "POST /outcome-surveys — submit Outcome Survey"
    shared_operations:
      - "POST /matches/{id}/activities — shared activity logging with MatchSpecialist"
      - "POST /matches/{id}/exit-transitions — open an exit (shared with MatchSpecialist)"
      - "GET on all read endpoints"
