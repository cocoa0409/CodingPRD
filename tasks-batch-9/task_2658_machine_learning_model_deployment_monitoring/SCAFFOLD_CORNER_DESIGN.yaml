      - name: pagination_bounds_are_rejected_and_never_silently_clamped
        claim_type: Error triggerable
        grounds:
          - validations.priority_10
          - errors.ERR_INVALID_PAGINATION
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          The interesting half of this rule is what it refuses to do: limit 101 is an error rather than a
          silent clamp to 100, and offset -1 is an error rather than a clamp to 0. The omitted case must
          still apply limit 10 / offset 0, and an offset past the end is a legitimate empty page, not an
          error — three different reactions to three near-identical requests.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z startup default"
            - "one Model with exactly two DRAFT ModelVersions (1.0.0 and 1.0.1) on a DRAFT dataset — no approval workflow needed to populate a list"
          setup_api_calls:
            - call: "POST /models"
              payload: { name: "fraud-scorer", task_type: "CLASSIFICATION", owner_team: "risk-ml" }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { m_id: $.data.id }
            - call: "POST /training-datasets"
              payload: { name: "snap-2026-07", snapshot_uri: "s3://snaps/2026-07", row_count: 1000000, feature_hash: "fs-v1", baseline_bin_proportions: [0.20, 0.20, 0.20, 0.20, 0.20], baseline_positive_rate: 0.30, license_class: "INTERNAL", pii_review_passed: true }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { ds_id: $.data.id }
            - call: "POST /model-versions"
              payload: { model_id: "${m_id}", training_dataset_id: "${ds_id}", semver: "1.0.0", artifact_digest: "sha256:aaa", feature_spec_hash: "fs-v1", baseline_accuracy: 0.82, baseline_positive_rate: 0.30, baseline_p95_latency_ms: 200 }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { v1_id: $.data.id }
            - call: "POST /model-versions"
              payload: { model_id: "${m_id}", training_dataset_id: "${ds_id}", semver: "1.0.1", artifact_digest: "sha256:bbb", feature_spec_hash: "fs-v1", baseline_accuracy: 0.83, baseline_positive_rate: 0.30, baseline_p95_latency_ms: 205 }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { v2_id: $.data.id }
          trigger:
            - call: "GET /model-versions"
              payload: { model_id: "${m_id}", limit: 0, offset: 0 }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { limit_zero_err: $.data.error_id }
            - call: "GET /model-versions"
              payload: { model_id: "${m_id}", limit: 101, offset: 0 }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { limit_high_err: $.data.error_id }
            - call: "GET /model-versions"
              payload: { model_id: "${m_id}", limit: 10, offset: -1 }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { offset_negative_err: $.data.error_id }
            - call: "GET /model-versions"
              payload: { model_id: "${m_id}", limit: 100, offset: 0 }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { max_limit: $.meta.limit, max_total: $.meta.total_count, max_more: $.meta.has_more }
            - call: "GET /model-versions"
              payload: { model_id: "${m_id}" }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { def_limit: $.meta.limit, def_offset: $.meta.offset, def_total: $.meta.total_count, def_more: $.meta.has_more }
            - call: "GET /model-versions"
              payload: { model_id: "${m_id}", limit: 1, offset: 0 }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { page1_more: $.meta.has_more, page1_total: $.meta.total_count }
            - call: "GET /model-versions"
              payload: { model_id: "${m_id}", limit: 1, offset: 1 }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { page2_more: $.meta.has_more }
            - call: "GET /model-versions"
              payload: { model_id: "${m_id}", limit: 1, offset: 99 }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { far_total: $.meta.total_count, far_more: $.meta.has_more }
          assert:
            - "limit 0 returns HTTP 400 'ERR_INVALID_PAGINATION' — the accepted range is [1, 100], so zero is below it"
            - "limit 101 returns HTTP 400 'ERR_INVALID_PAGINATION' rather than being clamped to 100"
            - "offset -1 returns HTTP 400 'ERR_INVALID_PAGINATION' rather than being clamped to 0"
            - "limit 100 is accepted (the inclusive upper bound) and echoes meta.limit 100 with meta.total_count 2 and meta.has_more false"
            - "omitting both parameters applies the declared defaults: meta.limit 10, meta.offset 0, meta.total_count 2, meta.has_more false"
            - "limit 1 offset 0 returns one row with meta.has_more true and meta.total_count 2; limit 1 offset 1 returns the second row with meta.has_more false"
            - "an offset far past the end is NOT an error: limit 1 offset 99 returns HTTP 200 with an empty data array, meta.total_count 2 and meta.has_more false"

