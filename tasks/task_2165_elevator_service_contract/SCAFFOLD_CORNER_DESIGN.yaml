          assert:
            - "trigger[0] returns exactly 2 rows with total_count == 2, containing ${w_e2a1} and ${w_e2b1}"
            - "trigger[1] returns exactly 2 rows with total_count == 2, containing ${w_e2a1} and ${w_e2a2}"
