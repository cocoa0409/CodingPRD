        distinguishing_aspect: |
          Half-open interval semantics on PaintLine: a slot starting exactly when another
          ends (10:00 == 10:00) is ACCEPTED, while a one-minute-early start (09:59)
          collides — adjacency allowed, true overlap rejected; different semantics and
          resource than the oven's closed-interval capacity rule.
