  # Rule 8 — resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: exclusivity_policy_half_open_effective_window
        grounds:
          - entities.ExclusivityPolicy.fields.effective_from
          - entities.ExclusivityPolicy.fields.effective_to
          - validations[priority=11]
          - errors.ERR_EXCLUSIVITY_POLICY_BREACH
        distinguishing_aspect: "Half-open interval semantics with an inclusive start and exclusive end on ExclusivityPolicy: a loan disclosing the competitor exactly at effective_from breaches the policy, while the same disclosure exactly at effective_to does not."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B15 APPROVED with a TX licence, a quote and a policy running 2026-09-01T00:00:00Z (inclusive) to 2026-12-01T00:00:00Z (exclusive) against competitor COMP-ALPHA."
          setup_api_calls:
            - call: "POST /wholesale-channel/brokers"
              payload: { legal_name: "Overlap Policy Wholesale LLC", nmls_id: "NMLS-3325015", home_state: "TX", volume_expectation_cents: 100000000 }
              as: ChannelManager
              captures: { b15: $.data.id }
            - call: "POST /wholesale-channel/brokers/${b15}/licenses"
              payload: { state_code: "TX", license_number: "TX-MB-3325-15", license_type: "MORTGAGE_BROKER", expires_on: "2027-12-31T00:00:00Z" }
              as: ChannelManager
            - call: "POST /wholesale-channel/brokers/${b15}/financial-reviews"
              payload: { net_worth_cents: 100000000, liquidity_cents: 40000000, total_liabilities_cents: 0, years_in_business: 5, prior_year_funded_volume_cents: 100000000, audit_attested: true }
              as: ChannelManager
              captures: { fr15: $.data.id }
            - call: "POST /wholesale-channel/financial-reviews/${fr15}/decision"
              payload: { outcome: "PASSED" }
              as: ChannelManager
              captures: { b15_v_fr: $.data.version }
            - call: "POST /wholesale-channel/brokers/${b15}/product-eligibilities"
              payload: { product_code: "CONVENTIONAL", max_ltv: 0.9500, min_fico: 620, max_loan_amount_cents: 200000000 }
              as: ChannelManager
              captures: { pe15: $.data.id, b15_v_pe: $.data.version }
            - call: "POST /wholesale-channel/product-eligibilities/${pe15}/decision"
              payload: { outcome: "APPROVED", expected_broker_version: "${b15_v_pe}" }
              as: ChannelManager
              captures: { b15_v_elig: $.data.version }
            - call: "POST /wholesale-channel/compensation-plans"
              payload: { broker_id: "${b15}", plan_code: "PLAN_A", default_election: "LENDER_PAID", lender_paid_amount_cents: 250000, borrower_paid_amount_cents: 300000, is_active: true }
              as: ChannelManager
              captures: { plan15: $.data.id }
            - call: "POST /wholesale-channel/brokers/${b15}/approve"
              payload: {}
              as: ChannelManager
              captures: { b15_v_appr: $.data.version }
            - call: "POST /wholesale-channel/brokers/${b15}/rate-sheets"
              payload: { product_code: "CONVENTIONAL", base_rate_pct: 6.125, adjustment_table: [{ dim: "credit", bucket: "760-plus", adjust_pct: -0.125 }, { dim: "ltv", bucket: "up-to-60", adjust_pct: 0.000 }, { dim: "occupancy", bucket: "PRIMARY_RESIDENCE", adjust_pct: 0.000 }, { dim: "product", bucket: "CONVENTIONAL", adjust_pct: 0.000 }] }
              as: ChannelManager
              captures: { rs15: $.data.id, rs15_v: $.data.version }
            - call: "POST /wholesale-channel/rate-sheets/${rs15}/pricing-quotes"
              payload: { representative_fico: 780, ltv_ratio: 0.5500, occupancy_type: "PRIMARY_RESIDENCE", loan_amount_cents: 40000000, lock_period_days: 30, loan_purpose: "PURCHASE", expected_rate_sheet_version: "${rs15_v}" }
              as: BrokerUser
              as_user_id: "${b15}"
              captures: { q15: $.data.id, q15b: $.data.id }
            - call: "POST /wholesale-channel/exclusivity-policies"
              payload: { broker_id: "${b15}", competitor_identifier: "COMP-ALPHA", competitor_name: "Alpha Mortgage Partners", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z", status: "ACTIVE", restriction_scope: "LOAN_SUBMISSION" }
              as: ChannelManager
              captures: { pol15: $.data.id }
          trigger:
            - call: "POST /wholesale-channel/loan-submissions"
              payload: { broker_id: "${b15}", pricing_quote_id: "${q15}", borrower_name: "Overlap Borrower Inside", property_state: "TX", loan_amount_cents: 40000000, lock_expires_at: "2027-01-01T00:00:00Z", competitor_channel_identifier: "comp-alpha", compensation_election: "LENDER_PAID", comp_plan_id: "${plan15}" }
              as: BrokerUser
              as_user_id: "${b15}"
              captures: { error_id_inside: $.data.error_id }
            - call: "POST /wholesale-channel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "the in-window submission at 2026-09-01T00:00:00Z returns 403 and error_id_inside == ERR_EXCLUSIVITY_POLICY_BREACH"
            - "the case-insensitive match on comp-alpha proves the identifier comparison folding"
            - "GET /wholesale-channel/brokers/${b15} reports exclusivity_status == WARNED after the single breach"
            - "ExclusivityPolicy.${pol15}.breach_count == 1"
            - "an identical submission sent once the clock reads exactly 2026-12-01T00:00:00Z does NOT return ERR_EXCLUSIVITY_POLICY_BREACH, because effective_to is exclusive"

      - name: base_rate_repricing_non_overlapping_publication_sequence
        grounds:
          - state_machines.RateSheet.transitions.PUBLISHED_to_SUPERSEDED
          - entities.RateSheet.fields.publish_sequence
          - entities.PricingQuote.fields.is_repriced
          - errors.ERR_PRICING_QUOTE_SUPERSEDED
        distinguishing_aspect: "Publication-sequence semantics on RateSheet, where only one sheet per (broker, product) may be PUBLISHED and each new publication supersedes the prior without invalidating quotes already priced: adjacency here means two sheets that do not overlap, so the older quote survives but reports is_repriced true."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B16 APPROVED, two quotes already priced off sheet V1."
          setup_api_calls:
            - call: "POST /wholesale-channel/brokers"
              payload: { legal_name: "Sequence Sheet Wholesale LP", nmls_id: "NMLS-3325016", home_state: "TX", volume_expectation_cents: 100000000 }
              as: ChannelManager
              captures: { b16: $.data.id }
            - call: "POST /wholesale-channel/brokers/${b16}/licenses"
              payload: { state_code: "TX", license_number: "TX-MB-3325-16", license_type: "MORTGAGE_BROKER", expires_on: "2027-12-31T00:00:00Z" }
              as: ChannelManager
            - call: "POST /wholesale-channel/brokers/${b16}/financial-reviews"
              payload: { net_worth_cents: 100000000, liquidity_cents: 40000000, total_liabilities_cents: 0, years_in_business: 5, prior_year_funded_volume_cents: 100000000, audit_attested: true }
              as: ChannelManager
              captures: { fr16: $.data.id }
            - call: "POST /wholesale-channel/financial-reviews/${fr16}/decision"
              payload: { outcome: "PASSED" }
              as: ChannelManager
              captures: { b16_v_fr: $.data.version }
            - call: "POST /wholesale-channel/brokers/${b16}/approve"
              payload: {}
              as: ChannelManager
              captures: { b16_v_appr: $.data.version }
            - call: "POST /wholesale-channel/brokers/${b16}/rate-sheets"
              payload: { product_code: "CONVENTIONAL", base_rate_pct: 6.125, adjustment_table: [{ dim: "credit", bucket: "760-plus", adjust_pct: -0.125 }, { dim: "ltv", bucket: "up-to-60", adjust_pct: 0.000 }, { dim: "occupancy", bucket: "PRIMARY_RESIDENCE", adjust_pct: 0.000 }, { dim: "product", bucket: "CONVENTIONAL", adjust_pct: 0.000 }] }
              as: ChannelManager
              captures: { rs16v1: $.data.id, rs16v1_v: $.data.version }
            - call: "POST /wholesale-channel/rate-sheets/${rs16v1}/pricing-quotes"
              payload: { representative_fico: 780, ltv_ratio: 0.5500, occupancy_type: "PRIMARY_RESIDENCE", loan_amount_cents: 40000000, lock_period_days: 30, loan_purpose: "PURCHASE", expected_rate_sheet_version: "${rs16v1_v}" }
              as: BrokerUser
              as_user_id: "${b16}"
              captures: { q16: $.data.id }
          trigger:
            - call: "POST /wholesale-channel/brokers/${b16}/rate-sheets"
              payload: { product_code: "CONVENTIONAL", base_rate_pct: 6.375, adjustment_table: [{ dim: "credit", bucket: "760-plus", adjust_pct: -0.125 }, { dim: "ltv", bucket: "up-to-60", adjust_pct: 0.000 }, { dim: "occupancy", bucket: "PRIMARY_RESIDENCE", adjust_pct: 0.000 }, { dim: "product", bucket: "CONVENTIONAL", adjust_pct: 0.000 }] }
              as: ChannelManager
              captures: { rs16v2: $.data.id }
          assert:
            - "the second publication returns 201 with RateSheet.${rs16v2}.publish_sequence == 2"
            - "GET /wholesale-channel/rate-sheets/${rs16v1} reports status SUPERSEDED and superseded_by_sheet_id == ${rs16v2}"
            - "GET /wholesale-channel/pricing-quotes/${q16} still reports price_points == -1.375 and note_rate_pct == 6.000, because the quote snapshots its own sheet"
            - "GET /wholesale-channel/pricing-quotes/${q16} reports is_repriced == true"
            - "a quote priced against ${rs16v1} via POST /wholesale-channel/rate-sheets/${rs16v1}/pricing-quotes returns 409 ERR_PRICING_QUOTE_SUPERSEDED"

  # ===========================================================================
  # Rule 9 — compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: compensation_commitment_zero_sum_on_submit_and_withdraw
        grounds:
          - calculations.compensation_commitment_reconciliation
          - entities.Broker.fields.total_active_compensation_commitment_cents
          - state_machines.LoanSubmission.transitions.SUBMITTED_to_WITHDRAWN
          - endpoints.GET_/wholesale-channel/brokers/{id}/reconciliation
        distinguishing_aspect: "The conserved quantity is the broker's money commitment in cents: submitting a LENDER_PAID loan raises total_active_compensation_commitment_cents by exactly lender_paid_comp_cents, and the compensating withdrawal must return it to the value it held before submission."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B17 APPROVED with a quote and an elected LENDER_PAID plan of 250000 cents; no open loans yet."
          setup_api_calls:
            - call: "POST /wholesale-channel/brokers"
              payload: { legal_name: "Conserved Money Wholesale LLC", nmls_id: "NMLS-3325017", home_state: "TX", volume_expectation_cents: 100000000 }
              as: ChannelManager
              captures: { b17: $.data.id }
            - call: "POST /wholesale-channel/brokers/${b17}/licenses"
              payload: { state_code: "TX", license_number: "TX-MB-3325-17", license_type: "MORTGAGE_BROKER", expires_on: "2027-12-31T00:00:00Z" }
              as: ChannelManager
            - call: "POST /wholesale-channel/brokers/${b17}/financial-reviews"
              payload: { net_worth_cents: 100000000, liquidity_cents: 40000000, total_liabilities_cents: 0, years_in_business: 5, prior_year_funded_volume_cents: 100000000, audit_attested: true }
              as: ChannelManager
              captures: { fr17: $.data.id }
            - call: "POST /wholesale-channel/financial-reviews/${fr17}/decision"
              payload: { outcome: "PASSED" }
              as: ChannelManager
              captures: { b17_v_fr: $.data.version }
            - call: "POST /wholesale-channel/brokers/${b17}/product-eligibilities"
              payload: { product_code: "CONVENTIONAL", max_ltv: 0.9500, min_fico: 620, max_loan_amount_cents: 200000000 }
              as: ChannelManager
              captures: { pe17: $.data.id, b17_v_pe: $.data.version }
            - call: "POST /wholesale-channel/product-eligibilities/${pe17}/decision"
              payload: { outcome: "APPROVED", expected_broker_version: "${b17_v_pe}" }
              as: ChannelManager
              captures: { b17_v_elig: $.data.version }
            - call: "POST /wholesale-channel/compensation-plans"
              payload: { broker_id: "${b17}", plan_code: "PLAN_A", default_election: "LENDER_PAID", lender_paid_amount_cents: 250000, borrower_paid_amount_cents: 300000, is_active: true }
              as: ChannelManager
              captures: { plan17: $.data.id }
            - call: "POST /wholesale-channel/brokers/${b17}/approve"
              payload: {}
              as: ChannelManager
              captures: { b17_v_appr: $.data.version }
            - call: "POST /wholesale-channel/brokers/${b17}/rate-sheets"
              payload: { product_code: "CONVENTIONAL", base_rate_pct: 6.125, adjustment_table: [{ dim: "credit", bucket: "760-plus", adjust_pct: -0.125 }, { dim: "credit", bucket: "720-739", adjust_pct: 0.000 }, { dim: "ltv", bucket: "up-to-60", adjust_pct: 0.000 }, { dim: "occupancy", bucket: "PRIMARY_RESIDENCE", adjust_pct: 0.000 }, { dim: "product", bucket: "CONVENTIONAL", adjust_pct: 0.000 }] }
              as: ChannelManager
              captures: { rs17: $.data.id, rs17_v: $.data.version }
            - call: "POST /wholesale-channel/rate-sheets/${rs17}/pricing-quotes"
              payload: { representative_fico: 780, ltv_ratio: 0.5500, occupancy_type: "PRIMARY_RESIDENCE", loan_amount_cents: 40000000, lock_period_days: 30, loan_purpose: "PURCHASE", expected_rate_sheet_version: "${rs17_v}" }
              as: BrokerUser
              as_user_id: "${b17}"
              captures: { q17: $.data.id }
          trigger:
            - call: "POST /wholesale-channel/loan-submissions"
              payload: { broker_id: "${b17}", pricing_quote_id: "${q17}", borrower_name: "Conserved Money Borrower", property_state: "TX", loan_amount_cents: 40000000, lock_expires_at: "2027-01-01T00:00:00Z", compensation_election: "LENDER_PAID", comp_plan_id: "${plan17}" }
              as: BrokerUser
              as_user_id: "${b17}"
              captures: { l17: $.data.id }
            - call: "POST /wholesale-channel/loan-submissions/${l17}/withdraw"
              payload: {}
              as: BrokerUser
              as_user_id: "${b17}"
              captures: { b17_v_wd: $.data.version }
          assert:
            - "LoanSubmission.${l17}.compensation_election == LENDER_PAID and lender_paid_comp_cents == 250000"
            - "after withdrawal LoanSubmission.${l17}.status == WITHDRAWN and Broker.${b17}.total_active_compensation_commitment_cents == 0"
            - "GET /wholesale-channel/brokers/${b17}/reconciliation reports commitment_drift_cents == 0"
            - "GET /wholesale-channel/brokers/${b17}/reconciliation reports active_loan_count == 0"

      - name: funded_volume_zero_sum_on_fund_and_repurchase
        grounds:
          - calculations.funded_volume_rollup
          - entities.Broker.fields.rolling_funded_volume_cents
          - state_machines.LoanSubmission.transitions.FUNDED_to_REPURCHASED
          - endpoints.GET_/wholesale-channel/brokers/{id}/reconciliation
        distinguishing_aspect: "The conserved quantity is funded volume in cents, a different conserved quantity from the money commitment: funding a 40000000-cent loan raises rolling_funded_volume_cents by exactly 40000000, and the compensating repurchase must return it to the pre-funding baseline even though the same repurchase also records an exposure that is a different number."
