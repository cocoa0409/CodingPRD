          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN_ROLE"
            - "CrossSellCheck.${r004_cs_id}.status stays PENDING with decided_at null"
            - "PlatformAdmin is still permitted on POST /benefits/members/${r004_id}/detect-churn, its own exclusive surface"

      - name: member_acknowledge_for_another_members_notice_is_forbidden
