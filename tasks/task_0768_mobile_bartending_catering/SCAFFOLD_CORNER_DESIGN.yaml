              payload: { full_name: "Ada", email: "ada@x.com", phone: "555-1", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /packages"
              payload: { tier: "CLASSIC", name: "Classic", base_price_cents: 150000, included_guest_count: 50, per_guest_overage_cents: 1800, included_hours: 4, min_hours: 3, per_hour_overage_cents: 25000, drinks_per_guest_per_hour: 1.25, guests_per_bartender: 50 }
              as: PlatformAdmin
              captures: { package_id: $.data.id }
          trigger:
            - call: "POST /events"
              payload: { client_id: "${client_id}", package_id: "${package_id}", title: "Gala", venue_state_code: "CA", venue_type: "INDOOR", event_start: "2026-06-01T18:00:00Z", event_end: "2026-06-01T23:00:00Z", guest_count: 80 }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_UNAUTHORIZED"

      - name: client_cannot_patch_other_clients_event
        claim_type: peer_roles
        grounds: ["roles.Client", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Client PATCHing another client's event (not the owner) returns ERR_UNAUTHORIZED (403); ownership check on entity_backed:Client."
        test_recipe:
          setup: ["Two clients A and B; A owns the event."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada A", email: "a@x.com", phone: "555-1", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { client_a: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Bob B", email: "b@x.com", phone: "555-2", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { client_b: $.data.id }
            - call: "POST /packages"
              payload: { tier: "CLASSIC", name: "Classic", base_price_cents: 150000, included_guest_count: 50, per_guest_overage_cents: 1800, included_hours: 4, min_hours: 3, per_hour_overage_cents: 25000, drinks_per_guest_per_hour: 1.25, guests_per_bartender: 50 }
              as: PlatformAdmin
              captures: { package_id: $.data.id }
            - call: "POST /events"
              payload: { client_id: "${client_a}", package_id: "${package_id}", title: "Gala", venue_state_code: "CA", venue_type: "INDOOR", event_start: "2026-06-01T18:00:00Z", event_end: "2026-06-01T23:00:00Z", guest_count: 80 }
              as: Client
              as_user_id: "${client_a}"
              captures: { event_id: $.data.id }
            - call: "GET /events/${event_id}"
              payload: {}
              as: Client
              as_user_id: "${client_b}"
              captures: { ev_v1: $.data.version }
          trigger:
            - call: "PATCH /events/${event_id}"
              payload: { expected_event_version: "${ev_v1}", guest_count: 90 }
              as: Client
              as_user_id: "${client_b}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_UNAUTHORIZED"

      - name: unauthenticated_missing_headers
        claim_type: role_denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no/unknown X-User-Role returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /events/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

  # =========================================================================
  # Section: cross_cutting
  # =========================================================================
  - section: cross_cutting
    instances:
      - name: occ_stale_event_version_on_patch
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[event-edit-stale-version]", "errors[ERR_STALE_EVENT_VERSION]"]
        distinguishing_aspect: "Two sequential PATCH /events/{id} carrying the same expected_event_version: the first succeeds (version advances), the second is rejected with ERR_STALE_EVENT_VERSION (412)."
        test_recipe:
          setup: ["One DRAFT event."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada", email: "ada@x.com", phone: "555-1", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /packages"
              payload: { tier: "CLASSIC", name: "Classic", base_price_cents: 150000, included_guest_count: 50, per_guest_overage_cents: 1800, included_hours: 4, min_hours: 3, per_hour_overage_cents: 25000, drinks_per_guest_per_hour: 1.25, guests_per_bartender: 50 }
              as: PlatformAdmin
              captures: { package_id: $.data.id }
            - call: "POST /events"
              payload: { client_id: "${client_id}", package_id: "${package_id}", title: "Gala", venue_state_code: "CA", venue_type: "INDOOR", event_start: "2026-06-01T18:00:00Z", event_end: "2026-06-01T23:00:00Z", guest_count: 80 }
              as: Client
              as_user_id: "${client_id}"
              captures: { event_id: $.data.id, ev_v1: $.data.version }
            - call: "PATCH /events/${event_id}"
              payload: { expected_event_version: "${ev_v1}", guest_count: 90 }
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "PATCH /events/${event_id}"
              payload: { expected_event_version: "${ev_v1}", guest_count: 100 }
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_EVENT_VERSION"

      - name: occ_stale_event_version_on_assignment_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[assignment-create-stale-event]", "errors[ERR_STALE_EVENT_VERSION]"]
        distinguishing_aspect: "Two sequential POST /events/{id}/assignments with the same expected_event_version: the first advances Event.version, the second is rejected with ERR_STALE_EVENT_VERSION (412)."
        test_recipe:
          setup: ["A DRAFT event and one bartender; first assignment already created."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada", email: "ada@x.com", phone: "555-1", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /packages"
              payload: { tier: "CLASSIC", name: "Classic", base_price_cents: 150000, included_guest_count: 50, per_guest_overage_cents: 1800, included_hours: 4, min_hours: 3, per_hour_overage_cents: 25000, drinks_per_guest_per_hour: 1.25, guests_per_bartender: 50 }
              as: PlatformAdmin
              captures: { package_id: $.data.id }
            - call: "POST /bartenders"
              payload: { full_name: "Ben", email: "ben@x.com", certification_expiry: "2027-01-01T00:00:00Z", hourly_rate_cents: 4000, home_state_code: "CA" }
              as: PlatformAdmin
              captures: { bartender_id: $.data.id }
            - call: "POST /events"
              payload: { client_id: "${client_id}", package_id: "${package_id}", title: "Gala", venue_state_code: "CA", venue_type: "INDOOR", event_start: "2026-06-01T18:00:00Z", event_end: "2026-06-01T23:00:00Z", guest_count: 80 }
              as: Client
              as_user_id: "${client_id}"
              captures: { event_id: $.data.id, ev_v1: $.data.version }
            - call: "POST /events/${event_id}/assignments"
              payload: { bartender_id: "${bartender_id}", shift_start: "2026-06-01T13:00:00Z", shift_end: "2026-06-01T15:00:00Z", role_on_event: "BACK", expected_event_version: "${ev_v1}" }
              as: Coordinator
              captures: { asg1_id: $.data.id }
          trigger:
            - call: "POST /events/${event_id}/assignments"
              payload: { bartender_id: "${bartender_id}", shift_start: "2026-06-01T18:00:00Z", shift_end: "2026-06-01T21:00:00Z", role_on_event: "BACK", expected_event_version: "${ev_v1}" }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_EVENT_VERSION"

      - name: inventory_plan_marked_stale_after_event_edit
        claim_type: derived_field_reconciliation
        grounds: ["entities.InventoryPlan.fields.status", "state_machines.Event.DRAFT_to_CONFIRMED"]
        distinguishing_aspect: "Generating an InventoryPlan (GENERATED) then PATCHing the event's guest_count flips the plan's status to STALE (derived-field reconciliation on edit)."
        test_recipe:
          setup: ["An event with a generated inventory plan; then guest_count is edited."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada", email: "ada@x.com", phone: "555-1", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /packages"
              payload: { tier: "CLASSIC", name: "Classic", base_price_cents: 150000, included_guest_count: 50, per_guest_overage_cents: 1800, included_hours: 4, min_hours: 3, per_hour_overage_cents: 25000, drinks_per_guest_per_hour: 1.25, guests_per_bartender: 50 }
              as: PlatformAdmin
              captures: { package_id: $.data.id }
            - call: "POST /events"
              payload: { client_id: "${client_id}", package_id: "${package_id}", title: "Gala", venue_state_code: "CA", venue_type: "INDOOR", event_start: "2026-06-01T18:00:00Z", event_end: "2026-06-01T23:00:00Z", guest_count: 80 }
              as: Client
              as_user_id: "${client_id}"
              captures: { event_id: $.data.id, ev_v1: $.data.version }
            - call: "POST /events/${event_id}/inventory-plan"
              payload: {}
              as: Coordinator
              captures: { plan_id: $.data.id }
          trigger:
            - call: "PATCH /events/${event_id}"
              payload: { expected_event_version: "${ev_v1}", guest_count: 120 }
              as: Client
              as_user_id: "${client_id}"
          assert:
            - "InventoryPlan.${plan_id}.status == STALE"

