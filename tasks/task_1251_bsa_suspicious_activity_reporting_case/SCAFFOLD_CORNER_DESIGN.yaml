            - { call: "POST /account-decisions/${dec2}/approve", as: BSAManager, as_user_id: "${mg1}" }
          trigger:
            - { call: "POST /account-decisions/${dec2}/execute", as: BSAManager, as_user_id: "${mg1}", captures: { err: $.data.error_id } }
          assert:
