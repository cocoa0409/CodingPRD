    applies_to: "all /shipment-releases/{id}/** paths, POST /engineered-orders/{id}/commissioning-jobs"
  - priority: 22
    category: existence
    check: "the SiteStorageAgreement named by {id} exists"
    error_id: ERR_STORAGE_AGREEMENT_NOT_FOUND
    http_status: 404
    applies_to: "all /site-storage-agreements/{id}/** paths"
  - priority: 23
    category: existence
    check: "the CommissioningJob named by {id} or by commissioning_job_id exists"
    error_id: ERR_COMMISSIONING_JOB_NOT_FOUND
    http_status: 404
    applies_to: "all /commissioning-jobs/{id}/** paths"
  - priority: 24
    category: existence
    check: "the PunchListItem named by {id} exists"
    error_id: ERR_PUNCH_ITEM_NOT_FOUND
    http_status: 404
    applies_to: "all /punch-list-items/{id}/** paths"
  - priority: 25
    category: existence
    check: "the WarrantyClaim named by {id} or by warranty_claim_id exists"
    error_id: ERR_WARRANTY_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "all /warranty-claims/{id}/** paths"
  - priority: 26
    category: existence
    check: "the FailureAnalysisReport named by {id} exists"
    error_id: ERR_FAILURE_REPORT_NOT_FOUND
    http_status: 404
    applies_to: "all /failure-analysis-reports/{id}/** paths"

  # --- 27-31 payload shape / enum domains / pagination ----------------------
  - priority: 27
    category: business_constraint
    check: "all required body fields for the endpoint are present and non-null"
    error_id: ERR_MISSING_REQUIRED_FIELD
    http_status: 422
    applies_to: "all POST, PUT and PATCH endpoints"
  - priority: 28
    category: business_constraint
    check: "field types match the declared entity types; integer cents, basis-point and quantity fields are integers"
    error_id: ERR_FIELD_TYPE_INVALID
    http_status: 422
    applies_to: "all POST, PUT and PATCH endpoints"
  - priority: 29
    category: business_constraint
    check: "enum-valued inputs fall inside the declared domain - disposition IN {APPROVED, APPROVED_AS_NOTED, REVISE_AND_RESUBMIT}; variant IN {PROVISIONAL, FINAL}; result IN {PASS, FAIL}; priority_class, severity, root_cause_code, allocation_policy, product_family and commodity likewise"
    error_id: ERR_ENUM_VALUE_INVALID
    http_status: 422
    applies_to: "all POST, PUT and PATCH endpoints carrying enum inputs"
  - priority: 30
    category: business_constraint
    check: "numeric inputs respect their declared ranges - quantity >= 1, rated_kv > 0, contract_value_cents > 0, cap_bp/collar_bp/stage_share_bp in 0..10000, test_duration_hours > 0, crate_count >= 1"
    error_id: ERR_FIELD_VALUE_OUT_OF_RANGE
    http_status: 422
    applies_to: "all POST, PUT and PATCH endpoints"
  - priority: 31
    category: business_constraint
    check: "limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list (GET collection) endpoints"

  # --- 32-33 optimistic concurrency ----------------------------------------
  - priority: 32
    category: business_referential
    check: "expected_engineered_order_version equals the current EngineeredOrder.version (rules submittal-revision-create-stale-order, escalation-adjustment-create-stale-order, label-create-stale-order, shipment-release-create-stale-order)"
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /engineered-orders/{id}/submittal-drawings, POST /engineered-orders/{id}/escalation-adjustments, POST /engineered-orders/{id}/compliance-labels, POST /engineered-orders/{id}/shipment-releases"
  - priority: 33
    category: business_referential
    check: "expected_component_version equals the current LongLeadComponent.version (rule allocation-create-stale-component)"
    error_id: ERR_STALE_COMPONENT_VERSION
    http_status: 412
    applies_to: "POST /component-allocations"

  # --- 34-41 state preconditions -------------------------------------------
  - priority: 34
    category: state
    check: "the target row is not already in a terminal state for its dimension (ENG_CLOSED; CLOSED/CANCELLED; APPROVED/APPROVED_AS_NOTED/VOID; ACCEPTED/WITHDRAWN; CONSUMED/RELEASED/PREEMPTED; PASSED/ABANDONED; WAIVED/RELEASED; ISSUED/VOIDED; SUPERSEDED; DELIVERED/CANCELLED; CLOSED/WAIVED; COMPLETE/CANCELLED; CLOSED/REJECTED; SETTLED/REJECTED; RETRACTED; OBSOLETE; SUSPENDED)"
    error_id: ERR_TERMINAL_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 35
    category: state
    check: "the target row's current status is a legal source state for the requested transition per its state machine"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 36
    category: state
    check: "EngineeredOrder.fulfillment_status != CANCELLED for any child-creating or child-advancing write on the order"
    error_id: ERR_ORDER_CANCELLED
    http_status: 409
    applies_to: "all writes under /engineered-orders/{id}/** and all child action endpoints resolving to a cancelled order"
  - priority: 37
    category: state
    check: "EngineeredOrder.fulfillment_status is a legal source state for the requested fulfillment transition - start-production requires MATERIAL_ALLOCATED, shipment clear requires FAT_COMPLETE or SHIPPING, commissioning mobilize requires SHIPPING or COMMISSIONING"
    error_id: ERR_ORDER_FULFILLMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /engineered-orders/{id}/start-production, POST /shipment-releases/{id}/clear, POST /commissioning-jobs/{id}/mobilize"
  - priority: 38
    category: state
    check: "EngineeredOrder.engineering_status == DESIGN_RELEASED where the operation requires a released design - start-production, FINAL escalation acceptance, compliance label generation"
    error_id: ERR_DESIGN_NOT_RELEASED
    http_status: 409
    applies_to: "POST /engineered-orders/{id}/start-production, POST /escalation-adjustments/{id}/accept, POST /compliance-labels/{id}/generate"
  - priority: 39
    category: state
    check: "EngineeredOrder.production_posture is OPEN where the operation demands an unrestricted posture, and never FROZEN where the operation only tolerates RESTRICTED; the failing posture_reason_codes are echoed in the error message"
    error_id: ERR_POSTURE_BLOCKED
    http_status: 409
    applies_to: "POST /engineered-orders/{id}/start-production, POST /shipment-releases/{id}/clear, POST /shipment-releases/{id}/ship, POST /component-allocations/{id}/commit, POST /compliance-labels/{id}/issue"
  - priority: 40
    category: state
    check: "EngineeredOrder.engineering_status != ENG_CLOSED when creating a new SubmittalDrawing revision or re-opening review"
    error_id: ERR_ENGINEERING_CLOSED
    http_status: 409
    applies_to: "POST /engineered-orders/{id}/submittal-drawings, POST /submittal-drawings/{id}/submit, POST /submittal-drawings/{id}/begin-review"
  - priority: 41
    category: state
    check: "the parent FactoryAcceptanceTest is in a state that still admits witness administration (REQUESTED, BAY_SCHEDULED or WITNESS_CONFIRMED) before an assignment is created, reinvited or waived"
    error_id: ERR_FAT_NOT_ADMINISTRABLE
    http_status: 409
    applies_to: "POST /factory-acceptance-tests/{id}/witness-assignments, POST /witness-assignments/{id}/reinvite, POST /witness-assignments/{id}/waive"

  # --- 42-53 safety / compliance / regulatory ------------------------------
  - priority: 42
    category: business_safety
    check: "per calc arc_flash_label_values, incident_energy_cal_cm2 computed from the pinned TestReport is strictly below 40.0 cal/cm2; at or above that level no arc-flash label may be produced"
    error_id: ERR_ARC_ENERGY_UNLABELABLE
    http_status: 422
    applies_to: "POST /compliance-labels/{id}/generate"
  - priority: 43
    category: business_safety
    check: "the ComplianceLabel's pinned_drawing_revision still equals EngineeredOrder.released_drawing_revision; a newer submitted revision makes the label STALE and unusable"
    error_id: ERR_LABEL_STALE
    http_status: 409
    applies_to: "POST /compliance-labels/{id}/verify, POST /compliance-labels/{id}/issue, POST /shipment-releases/{id}/clear"
  - priority: 44
    category: business_safety
    check: "at least one ComplianceLabel on the order is in status ISSUED before freight may clear or ship"
    error_id: ERR_LABEL_NOT_ISSUED
    http_status: 409
    applies_to: "POST /shipment-releases/{id}/clear, POST /shipment-releases/{id}/ship"
  - priority: 45
    category: business_safety
    check: "the TestReport pinned by the label is in status ISSUED and carries pass_result true"
    error_id: ERR_TEST_REPORT_NOT_ISSUED
    http_status: 409
    applies_to: "POST /engineered-orders/{id}/compliance-labels, POST /compliance-labels/{id}/generate"
  - priority: 46
    category: business_safety
    check: "per calc test_report_verdict every mandatory criterion is populated - winding_temp_rise_c against temp_rise_limit_c, short_circuit_current_ka, arc_duration_ms, working_distance_mm, and impulse_withstand_kv against impulse_required_kv whenever the test requires_impulse"
    error_id: ERR_TEST_REPORT_INCOMPLETE
    http_status: 422
    applies_to: "POST /test-reports/{id}/issue"
  - priority: 47
    category: business_safety
    check: "order.rated_kv <= TestBay.max_kv for the bay being scheduled"
    error_id: ERR_BAY_KV_INSUFFICIENT
    http_status: 422
    applies_to: "POST /factory-acceptance-tests/{id}/schedule"
  - priority: 48
    category: business_safety
    check: "when FactoryAcceptanceTest.requires_impulse is true the chosen TestBay must have supports_impulse true"
    error_id: ERR_BAY_IMPULSE_UNSUPPORTED
    http_status: 422
    applies_to: "POST /factory-acceptance-tests/{id}/schedule"
  - priority: 49
    category: business_safety
    check: "the chosen TestBay is in status AVAILABLE"
    error_id: ERR_BAY_UNAVAILABLE
    http_status: 409
    applies_to: "POST /factory-acceptance-tests/{id}/schedule"
  - priority: 50
    category: business_safety
    check: "WitnessParty.credential_expires_at is strictly after the test window_start_at and WitnessParty.status permits assignment"
    error_id: ERR_WITNESS_CREDENTIAL_EXPIRED
    http_status: 422
    applies_to: "POST /factory-acceptance-tests/{id}/witness-assignments, POST /witness-assignments/{id}/confirm, POST /witness-assignments/{id}/reinvite"
  - priority: 51
    category: business_safety
    check: "CommissioningJob.blocking_punch_count == 0 before energization may be requested or granted"
    error_id: ERR_BLOCKING_PUNCH_OPEN
    http_status: 409
    applies_to: "POST /commissioning-jobs/{id}/request-energization, POST /commissioning-jobs/{id}/energize"
  - priority: 52
    category: business_safety
    check: "LongLeadComponent.status == ACTIVE - a QUARANTINED or OBSOLETE component may not be allocated or committed"
    error_id: ERR_COMPONENT_QUARANTINED
    http_status: 409
    applies_to: "POST /component-allocations, POST /component-allocations/{id}/commit, POST /long-lead-components/{id}/receipts"
  - priority: 53
    category: business_safety
    check: "Supplier.status != SUSPENDED - a suspended supplier's components may not receive new allocations and its parts may not be received"
    error_id: ERR_SUPPLIER_SUSPENDED
    http_status: 409
    applies_to: "POST /component-allocations, POST /suppliers/{id}/long-lead-components, POST /long-lead-components/{id}/receipts"

  # --- 54-66 constraint satisfaction ---------------------------------------
  - priority: 54
    category: business_constraint
    check: "EngineeredOrder.order_number is unique across all orders (6-24 chars)"
    error_id: ERR_DUPLICATE_ORDER_NUMBER
    http_status: 409
    applies_to: "POST /engineered-orders"
  - priority: 55
    category: business_constraint
    check: "Supplier.supplier_code, WitnessParty.party_code, TestBay.bay_code, LongLeadComponent.part_number within a supplier, and WarrantyClaim.claim_number are each unique in their scope"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /suppliers, POST /witness-parties, POST /test-bays, POST /suppliers/{id}/long-lead-components, POST /engineered-orders/{id}/warranty-claims"
  - priority: 56
    category: business_constraint
    check: "at most one CommodityIndexPoint exists per (commodity, index_month) pair"
    error_id: ERR_DUPLICATE_INDEX_POINT
    http_status: 409
    applies_to: "POST /commodity-index-points"
  - priority: 57
    category: business_constraint
    check: "at most one EscalationClause exists per EngineeredOrder"
    error_id: ERR_CLAUSE_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /engineered-orders/{id}/escalation-clauses"
  - priority: 58
    category: business_constraint
    check: "a new SubmittalDrawing revision may only be created when no sibling drawing on the order sits in DRAFT, SUBMITTED or UNDER_REVIEW; revision_round is system-assigned as max(existing)+1 and supersedes_drawing_id must name the immediately preceding revision"
    error_id: ERR_REVISION_ROUND_CONFLICT
    http_status: 409
    applies_to: "POST /engineered-orders/{id}/submittal-drawings"
  - priority: 59
    category: business_constraint
    check: "only the highest revision_round drawing on the order may be submitted, reviewed or dispositioned"
    error_id: ERR_DRAWING_REVISION_NOT_LATEST
    http_status: 409
    applies_to: "POST /submittal-drawings/{id}/submit, POST /submittal-drawings/{id}/begin-review, POST /submittal-drawings/{id}/disposition"
  - priority: 60
    category: business_constraint
    check: "per calc bay_occupation_window the requested [window_start_at, window_end_at + changeover_buffer_hours) interval must not overlap any other non-terminal FactoryAcceptanceTest already holding the same TestBay"
    error_id: ERR_BAY_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /factory-acceptance-tests/{id}/schedule"
  - priority: 61
    category: business_constraint
    check: "at most one non-terminal WitnessAssignment exists per (factory_acceptance_test_id, witness_party_id) pair"
    error_id: ERR_WITNESS_ALREADY_ASSIGNED
    http_status: 409
    applies_to: "POST /factory-acceptance-tests/{id}/witness-assignments"
  - priority: 62
    category: business_constraint
    check: "per calc witness_daily_load, the assignment's travel_region and blackout_days must admit every calendar day of the test window; a blackout day or an inadmissible travel region rejects the confirmation"
    error_id: ERR_WITNESS_TRAVEL_BLACKOUT
    http_status: 422
    applies_to: "POST /witness-assignments/{id}/confirm, POST /factory-acceptance-tests/{id}/witness-assignments"
  - priority: 63
    category: business_constraint
    check: "a retest may only be created when retest_of_fat_id names a FactoryAcceptanceTest in status FAILED on the same order, and no other non-terminal FactoryAcceptanceTest exists on that order"
    error_id: ERR_RETEST_PREDECESSOR_NOT_FAILED
    http_status: 409
    applies_to: "POST /factory-acceptance-tests"
  - priority: 64
    category: business_constraint
    check: "per calc stage_billing_allocation the stage_share_bp of all non-CANCELLED ShipmentRelease rows on the order must total exactly 10000"
    error_id: ERR_STAGE_SHARE_TOTAL_INVALID
    http_status: 422
    applies_to: "POST /engineered-orders/{id}/shipment-releases"
  - priority: 65
    category: business_constraint
    check: "at most one ShipmentRelease per order carries is_final_stage true"
    error_id: ERR_MULTIPLE_FINAL_STAGES
    http_status: 409
    applies_to: "POST /engineered-orders/{id}/shipment-releases"
  - priority: 66
    category: business_constraint
    check: "stage_index is unique per order and dense from 1; a stage may only clear once every strictly smaller stage_index on the order is IN_TRANSIT, DELIVERED or CANCELLED"
    error_id: ERR_STAGE_INDEX_OUT_OF_SEQUENCE
    http_status: 409
    applies_to: "POST /engineered-orders/{id}/shipment-releases, POST /shipment-releases/{id}/clear"

  # --- 67-74 temporal admissibility ----------------------------------------
  - priority: 67
    category: business_temporal
    check: "EscalationClause.base_index_month must be strictly earlier than final_window_end_month, both in YYYY-MM form"
    error_id: ERR_INDEX_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /engineered-orders/{id}/escalation-clauses"
  - priority: 68
    category: business_temporal
    check: "per calc material_escalation_amount a usable CommodityIndexPoint (published_at <= logical clock) exists for the base_index_month of every commodity carrying a non-zero weight"
    error_id: ERR_INDEX_POINT_MISSING
    http_status: 422
    applies_to: "POST /engineered-orders/{id}/escalation-adjustments, POST /escalation-adjustments/{id}/recalculate"
  - priority: 69
    category: business_temporal
    check: "the FINAL variant window (months strictly after base_index_month through final_window_end_month) contains at least one usable non-provisional CommodityIndexPoint per weighted commodity"
    error_id: ERR_INDEX_WINDOW_EMPTY
    http_status: 422
    applies_to: "POST /engineered-orders/{id}/escalation-adjustments with variant FINAL, POST /escalation-adjustments/{id}/recalculate"
  - priority: 70
    category: business_temporal
    check: "FactoryAcceptanceTest.window_end_at is strictly after window_start_at and consistent with test_duration_hours"
    error_id: ERR_TEST_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /factory-acceptance-tests, POST /factory-acceptance-tests/{id}/schedule"
  - priority: 71
    category: business_temporal
    check: "ComponentAllocation.need_by_date is not earlier than the logical clock at creation, and every COMMITTED allocation on the order still has need_by_date >= logical clock when production starts"
    error_id: ERR_NEED_BY_DATE_PASSED
    http_status: 422
    applies_to: "POST /component-allocations, POST /engineered-orders/{id}/start-production"
  - priority: 72
    category: business_temporal
    check: "SiteStorageAgreement.storage_end_at is strictly after storage_start_at, and storage_start_at is not earlier than the parent ShipmentRelease's staged instant"
    error_id: ERR_STORAGE_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /shipment-releases/{id}/site-storage-agreements"
  - priority: 73
    category: business_temporal
    check: "per calc warranty_window_expiry at least one CommissioningJob on the order is in status COMPLETE to anchor the warranty window"
    error_id: ERR_WARRANTY_WINDOW_UNAVAILABLE
    http_status: 409
    applies_to: "POST /engineered-orders/{id}/warranty-claims"
  - priority: 74
    category: business_temporal
    check: "claim.failure_reported_at is STRICTLY before the computed expiry (18 calendar months for POWER_TRANSFORMER, otherwise 12, with end-of-month clamping); equality is expired"
    error_id: ERR_WARRANTY_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /engineered-orders/{id}/warranty-claims"

  # --- 75-82 capacity / quota / fiscal (evaluated last) --------------------
  - priority: 75
    category: business_fiscal
    check: "per calc component_availability the requested quantity is <= LongLeadComponent.quantity_available; q == quantity_available + 1 is the first failing quantity and no allocation row is created"
    error_id: ERR_COMPONENT_INSUFFICIENT
    http_status: 409
    applies_to: "POST /component-allocations, POST /component-allocations/{id}/commit"
  - priority: 76
    category: business_fiscal
    check: "per calc witness_daily_load the WitnessParty's confirmed assignments on any calendar day of the window must not exceed daily_witness_capacity"
    error_id: ERR_WITNESS_DAY_CAPACITY
    http_status: 409
    applies_to: "POST /witness-assignments/{id}/confirm"
  - priority: 77
    category: business_fiscal
    check: "per calc preemption_victim_selector a higher-priority allocation may only preempt when a admissible victim set of strictly lower priority_class exists; otherwise the request fails rather than partially preempting"
    error_id: ERR_PREEMPTION_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /component-allocations"
  - priority: 78
    category: business_fiscal
    check: "an EscalationAdjustment with variant FINAL may only be accepted while the order's engineering_status is DESIGN_RELEASED and no other adjustment on the same clause sits in SUBMITTED_TO_CUSTOMER, DISPUTED or RECALCULATING"
    error_id: ERR_ESCALATION_ADJUSTMENT_IN_FLIGHT
    http_status: 409
    applies_to: "POST /engineered-orders/{id}/escalation-adjustments, POST /escalation-adjustments/{id}/accept"
  - priority: 79
    category: business_fiscal
    check: "per calc warranty_liability_cap the requested credit may not exceed liability_cap_cents; the waterfall truncates at the cap rather than over-granting"
    error_id: ERR_WARRANTY_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /warranty-claims/{id}/settle"
  - priority: 80
    category: business_fiscal
    check: "consequential_claim_cents may only be non-zero when consequential_covered is true on the claim"
    error_id: ERR_CONSEQUENTIAL_NOT_COVERED
    http_status: 422
    applies_to: "POST /engineered-orders/{id}/warranty-claims, POST /warranty-claims/{id}/settle"
  - priority: 81
    category: business_fiscal
    check: "the sum of ShipmentRelease.stage_billing_cents already billed plus this stage may not exceed EngineeredOrder.net_contract_value_cents"
    error_id: ERR_BILLING_EXCEEDS_CONTRACT
    http_status: 409
    applies_to: "POST /shipment-releases/{id}/ship, POST /shipment-releases/{id}/deliver"
  - priority: 82
    category: business_fiscal
    check: "per calc allocation_release_penalty a COMMITTED allocation released inside the penalty horizon accrues release_penalty_cents; the release is rejected when the order is already CLOSED so the penalty could never be billed"
    error_id: ERR_RELEASE_PENALTY_UNBILLABLE
    http_status: 409
    applies_to: "POST /component-allocations/{id}/release"

# =============================================================================
# 1.5 API ENDPOINT TABLE
# =============================================================================
endpoints:

  # --- test-driving surface -------------------------------------------------
  - id: clock_set
    method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock used by every temporal rule. The server starts at the fixed default 2026-08-01T00:00:00Z and NEVER falls back to real wall-clock time; before the first call the clock reads exactly that default."
    roles: [PlantAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["recompute component_availability need_by staleness", "recompute site_storage_fee accruals", "recompute warranty_window_expiry admissibility"]

  # --- EngineeredOrder ------------------------------------------------------
  - id: create_engineered_order
    method: POST
    path: "/engineered-orders"
    description: "Open a new engineered order in ENG_OPEN / PLANNING"
    roles: [SalesEngineer, ContractAdmin, PlantAdmin]
    code: 201
    input: [order_number, customer_name, product_family, rated_kv, contract_value_cents, sold_at, promised_ship_at, owning_sales_user_id]
    output: EngineeredOrder
    side_effects: ["engineering_status := ENG_OPEN", "fulfillment_status := PLANNING", "production_posture := OPEN", "net_contract_value_cents := contract_value_cents"]
  - id: list_engineered_orders
    method: GET
    path: "/engineered-orders"
    description: "List orders with filters"
