  # ===================================================================
  # RULE 4 — transitive_cascade
  # ===================================================================
  - rule_id: transitive_cascade
    instances:

      - name: minutes_approval_officializes_vote_mints_number_and_creates_notice
        grounds:
          - state_machines.MinutesRecord.SUBMITTED_to_APPROVED
          - state_machines.LegislativeInstrument.ADOPTED_UNOFFICIAL_to_ADOPTED
          - entities.Motion.fields.result_official
          - entities.NumberSeries.fields.next_sequence
          - calculations.publication_requirement
        distinguishing_aspect: |
          One tally propagates four hops through four different entities:
          hop 1 MinutesRecord SUBMITTED -> APPROVED, hop 2 every Motion of the
          minuted meeting flips result_official, hop 3 that flip carries the
          ordinance ADOPTED_UNOFFICIAL -> ADOPTED and mints ORD-2026-001 off the
          NumberSeries (advancing next_sequence and minted_count), hop 4 the
          adoption creates the DRAFT ORDINANCE_FULL_TEXT notice whose insertion
          count and deadline come from a calculation. Nothing in the request
          names the number series or the notice.
        test_recipe:
          setup:
            - "NumberSeries ORD/2026 open at next_sequence 1."
            - "Ordinance (GENERAL, 1200 characters) given first reading and adopted 4-3 at meeting m1 (2026-09-15); the ordinance sits at ADOPTED_UNOFFICIAL with no number."
            - "m1 adjourned, minutes drafted and submitted; meeting m2 (2026-10-06) noticed and convened with a MINUTES_APPROVAL motion targeting m1's minutes."
          setup_api_calls:
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
