      - name: line_item_budget_exceeds_io_budget_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=23]", calculations.line_item_budget, "errors[ERR_BUDGET_EXCEEDED]"]
        distinguishing_aspect: "Aggregate fiscal check: LI1 books 50000; LI2 (goal 200000 @ 500 → 100000) would push booked_budget to 150000 > 100000 → ERR_BUDGET_EXCEEDED."
        test_recipe:
          setup: ["IO budget 100000 with LI1 (goal 100000 @ 500 → 50000)"]
          setup_api_calls:
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-31", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI1", goal_impressions: 100000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-31", pacing_mode: "EVEN" }, as: Trafficker }
          trigger:
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI2", goal_impressions: 200000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-31", pacing_mode: "EVEN" }, as: Trafficker, captures: { err: $.data.error_id } }
          assert: ["err == ERR_BUDGET_EXCEEDED", "http status == 422", "InsertionOrder.${io_id}.booked_budget_cents == 50000 (unchanged)"]
