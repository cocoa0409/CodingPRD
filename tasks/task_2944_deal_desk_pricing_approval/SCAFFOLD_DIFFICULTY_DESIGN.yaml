              captures: { rev_status: $.data.status, rev_arr: $.data.booked_arr_cents, rev_tcv: $.data.booked_tcv_cents, rev_count: $.data.booking_reversal_count, rev_reason: $.data.reversal_reason, rev_void_reason: $.data.void_reason, rev_at: $.data.booking_reversed_at }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: DealDeskAnalyst
              captures: { acct_arr_after: $.data.booked_arr_cents }
            - call: "GET /quotes/${q_id}"
              payload: {}
              as: DealDeskAnalyst
              captures: { q_status_after: $.data.status, q_arr_after: $.data.booked_arr_cents, q_tcv_after: $.data.booked_tcv_cents }
          assert:
            - "${acct_arr_before} == 0"
            - "${acct_credit_before} == CLEAR"
            - "${q_status} == APPROVED"
            - "${q_net} == 300000"
            - "${booked_status} == BOOKED"
            - "${booked_arr} == 300000"
            - "${booked_tcv} == 300000"
            - "${booked_at} == 2026-08-01T00:00:00.000Z"
            - "${acct_arr_booked} == 300000"
            - "${rev_status} == VOID"
            - "${rev_arr} == 300000"
            - "${rev_tcv} == 300000"
            - "${rev_count} == 1"
            - "${rev_void_reason} == BOOKING_REVERSED"
            - "${rev_at} == 2026-08-01T00:00:00.000Z"
            - "${acct_arr_after} == 0"
            - "${q_status_after} == APPROVED"
            - "${q_arr_after} == 0"
            - "${q_tcv_after} == 0"
            - "OrderForm.${of_id}.voided_at == 2026-08-01T00:00:00.000Z"

      - name: exception_allowance_pool_conserved_across_acceptance_and_revocation
        grounds:
          - calculations.C4_margin_and_exception_allowance
          - entities.Account.fields.exception_allowance_used_cents
          - entities.CompetitiveException.fields.allowance_consumed_cents
          - state_machines.CompetitiveException.ACCEPTED_to_REVOKED
          - entities.Quote.fields.required_approval_level
        distinguishing_aspect: |
          Account.exception_allowance_used_cents is a conserved pool equal to the sum of
          allowance_consumed_cents over the account's ACCEPTED exceptions: accepting the exception on a
          services-only quote whose final_margin_pct is 0.250000 charges the margin give-up
          round_half_up((0.35 - 0.250000) * 2000000) = 200000 and lifts required_approval_level to
          max(0, 3) = 3, and the CFO revocation must return the pool to exactly 0 and the level to 0
          while the REVOKED row keeps allowance_consumed_cents 200000 for audit.
        test_recipe:
          setup:
            - "The base configuration and account from the anchored chain; DeskPolicy.margin_floor_pct 0.35, absolute_margin_floor_pct 0.22, exception_allowance_cents 4000000."
            - "One DRAFT quote with a single Implementation Services line of quantity 10 at requested_discount_pct 0 (term_months 12, payment_terms_days 30): final_net_total_cents 2000000 against cost_total_cents 1500000, so final_blended_discount_pct is 0.000000 (C3 matrix level 0) and final_margin_pct is 0.250000 — under the 0.35 floor but above the 0.22 absolute floor, which is exactly the window in which an exception may be accepted."
            - "One CompetitiveException documented by the owning rep u-rep-1 and accepted by the CFO u-cfo-1 (a different user, satisfying segregation of duties), consuming 200000 cents of the 4000000 allowance."
          setup_api_calls:
            - *bc_clock
            - *bc_policy
            - *bc_tier1
            - *bc_tier2
            - *bc_tier3
            - *bc_tier4
            - *bc_activate
            - *bc_core
            - *bc_support
            - *bc_service
            - *bc_usage
            - *bc_vt1
            - *bc_vt2
            - *bc_vt3
            - *bc_bundle
            - *bc_account
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: DealDeskAnalyst
              captures: { pool_before: $.data.exception_allowance_used_cents }
            - call: "POST /quotes"
              payload: { account_id: "${acct_id}", title: "Northwind Implementation Program", term_months: 12, payment_terms_days: 30, billing_frequency: "ANNUAL" }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { q_id: $.data.id }
            - call: "POST /quote-lines"
              payload: { quote_id: "${q_id}", product_id: "${svc_id}", quantity: 10, requested_discount_pct: 0.00 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { line_id: $.data.id, line_net: $.data.final_net_cents }
            - call: "GET /quotes/${q_id}/pricing-preview"
              payload: {}
              as: DealDeskAnalyst
              captures: { pv_net: $.data.final_net_total_cents, pv_cost: $.data.cost_total_cents, pv_margin: $.data.final_margin_pct, pv_give_up: $.data.margin_give_up_cents, pv_level: $.data.required_approval_level }
            - call: "POST /competitive-exceptions"
              payload: { quote_id: "${q_id}", competitor_name: "Meridian Systems", competitor_quoted_total_cents: 1850000, evidence_reference: "RFP-2026-114-competitor-quote.pdf", justification: "Incumbent integrator undercut the implementation scope by 7.5 percent" }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { exc_id: $.data.id, exc_status: $.data.status, exc_documented_by: $.data.documented_by_user_id }
            - call: "POST /competitive-exceptions/${exc_id}/decide"
              payload: { decision: "ACCEPT", decision_note: "Margin give-up approved against the FY26 allowance" }
              as: CFO
              as_user_id: "u-cfo-1"
              captures: { acc_status: $.data.status, acc_consumed: $.data.allowance_consumed_cents }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: DealDeskAnalyst
              captures: { pool_after_accept: $.data.exception_allowance_used_cents }
            - call: "GET /quotes/${q_id}"
              payload: {}
              as: DealDeskAnalyst
              captures: { level_after_accept: $.data.required_approval_level }
          trigger:
            - call: "POST /competitive-exceptions/${exc_id}/revoke"
              payload: { decision_note: "Competitive threat withdrew; exception no longer justified" }
              as: CFO
              as_user_id: "u-cfo-1"
              captures: { rev_status: $.data.status, rev_consumed: $.data.allowance_consumed_cents, rev_released_at: $.data.released_at }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: DealDeskAnalyst
              captures: { pool_after_revoke: $.data.exception_allowance_used_cents }
            - call: "GET /quotes/${q_id}"
              payload: {}
              as: DealDeskAnalyst
              captures: { level_after_revoke: $.data.required_approval_level, q_status_after: $.data.status }
          assert:
            - "${pool_before} == 0"
            - "${line_net} == 2000000"
            - "${pv_net} == 2000000"
            - "${pv_cost} == 1500000"
            - "${pv_margin} == 0.250000"
            - "${pv_give_up} == 200000"
            - "${pv_level} == 0"
            - "${exc_status} == SUBMITTED"
            - "${exc_documented_by} == u-rep-1"
            - "${acc_status} == ACCEPTED"
            - "${acc_consumed} == 200000"
            - "${pool_after_accept} == 200000"
            - "${level_after_accept} == 3"
            - "${rev_status} == REVOKED"
            - "${rev_consumed} == 200000"
            - "${rev_released_at} == 2026-08-01T00:00:00.000Z"
            - "${pool_after_revoke} == 0"
            - "${level_after_revoke} == 0"
            - "${q_status_after} == DRAFT"
            - "Account.${acct_id}.exception_allowance_used_cents == 0"
