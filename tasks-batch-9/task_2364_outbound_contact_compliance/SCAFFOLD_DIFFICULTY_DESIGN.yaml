    grounds:
    - state_machines.RevocationRequest.RECEIVED_to_VALIDATED
    - state_machines.RevocationRequestPropagation.NOT_STARTED_to_IN_PROGRESS
    - state_machines.RevocationRequestPropagation.IN_PROGRESS_to_OVERDUE
    - calculations.propagation_deadline
    - entities.Contact.fields.overdue_propagation_count
    distinguishing_aspect: 'Parallel state dimensions on one RevocationRequest row: intake_status stops at VALIDATED while propagation_status walks NOT_STARTED -> IN_PROGRESS -> OVERDUE under a different trigger, and the deadline itself skips the CA holiday 2026-08-07.'
    test_recipe:
      setup:
      - logical clock at 2026-08-03T14:00:00Z (a Monday)
      - CA policy with holiday_dates ["2026-08-07"]
      - contact with one ACTIVE VOICE consent
      - revocation received verbally on 2026-08-03T14:00:00Z and already VALIDATED (propagation IN_PROGRESS)
      - clock then moved one second past the propagation deadline
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T14:00:00Z'
        as: PlatformAdmin
      - call: POST /compliance/calling-window-policies
        payload:
          state_code: CA
          window_start_local: 08:00
          window_end_local: '21:00'
          recording_consent_regime: ONE_PARTY
          effective_from: '2026-07-01T00:00:00Z'
          effective_to: '2027-01-01T00:00:00Z'
          holiday_dates:
          - '2026-08-07'
        as: PlatformAdmin
        captures:
          pol_ca_id: $.data.id
      - call: POST /compliance/contacts
        payload:
          phone_number: '+14155550101'
          state_code: CA
          utc_offset_minutes: -420
          time_zone_label: America/Los_Angeles
          phone_type: WIRELESS
          attempt_budget_total: 3
        as: PlatformAdmin
        captures:
          c1_id: $.data.id
          c1_v: $.data.version
      - call: POST /compliance/agent-scripts
        payload:
          name: CA VOICE Script
          channel: VOICE
          disclosure_blocks:
          - IDENTIFICATION
          - PURPOSE
          - OPT_OUT
          recording_consent_mode: ONE_PARTY
          covered_state_codes:
          - CA
        as: CampaignManager
        captures:
          scr_id: $.data.id
      - call: POST /compliance/consent-records
        payload:
          contact_id: ${c1_id}
          channel: VOICE
          consent_type: EXPRESS_WRITTEN
          capture_method: WEB_FORM
          disclosure_script_id: ${scr_id}
          disclosure_text_version: 1
          signature_evidence: evidence-c1-voice
          expected_contact_version: ${c1_v}
        as: ComplianceOfficer
        captures:
          cons1_id: $.data.id
      - call: POST /compliance/revocation-requests
        payload:
          contact_id: ${c1_id}
          channel_received: VOICE
          method: VERBAL_REQUEST
          scope: ALL_CHANNELS
          received_note: Consumer asked the agent to stop calling
        as: DialerOperator
        captures:
          rev_id: $.data.id
          rev_deadline: $.data.propagation_deadline_at
      - call: POST /compliance/revocation-requests/${rev_id}/validate
        payload:
          validation_note: Voice recording confirms the request
        as: ComplianceOfficer
        as_user_id: officer-adjudicator
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-18T14:00:01Z'
        as: PlatformAdmin
      trigger:
      - call: POST /compliance/revocation-requests/${rev_id}/propagate
        payload:
          target_systems:
          - DIALER
          - CRM
          - SMS_GATEWAY
        as: ComplianceOfficer
        as_user_id: officer-adjudicator
      assert:
      - RevocationRequest.${rev_id}.propagation_deadline_at == "2026-08-18T14:00:00.000Z" (10 business days skipping Sat/Sun and the 2026-08-07 holiday)
      - RevocationRequest.${rev_id}.intake_status == VALIDATED (unchanged by the propagate call)
      - RevocationRequest.${rev_id}.propagation_status == OVERDUE
      - RevocationRequest.${rev_id}.propagated_at == "2026-08-18T14:00:01.000Z"
      - RevocationRequest.${rev_id}.consent_records_revoked_count == 1
      - Contact.${c1_id}.overdue_propagation_count == 1
      - ConsentRecord.${cons1_id}.status == REVOKED
