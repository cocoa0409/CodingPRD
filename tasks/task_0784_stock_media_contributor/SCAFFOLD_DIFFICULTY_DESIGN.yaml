            - call: "POST /contributors/${c_id}/tax-forms"
              payload: { form_type: "W9", tax_id: "US-U" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /tax-forms/${tf_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", title: "Coin", media_type: "PHOTO", content_category: "COMMERCIAL", keywords: ["x"], perceptual_hash: "aaaa", requires_release: false }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { a_id: $.data.id }
            - call: "POST /assets/${a_id}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_id}"
            - call: "POST /assets/${a_id}/claim"
              payload: {}
              as: Reviewer
            - call: "POST /assets/${a_id}/reviews"
              payload: { decision: "ACCEPT" }
              as: Reviewer
            - call: "POST /downloads"
              payload: { asset_id: "${a_id}", license_tier_code: "STANDARD", buyer_reference: "buy-1" }
              as: FinanceAdmin
              captures: { dl_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FinanceAdmin
            - call: "POST /downloads/${dl_id}/settle"
              payload: {}
              as: FinanceAdmin
          trigger:
            - call: "POST /downloads/${dl_id}/reverse"
              payload: { reason: "chargeback" }
              as: FinanceAdmin
          assert:
            - "Contributor.${c_id}.lifetime_earnings_cents == 0"
            - "Contributor.${c_id}.available_balance_cents == 0"
            - "Download.${dl_id}.earning_status == REVERSED"

      - name: accept_then_takedown_conserves_accepted_count
        grounds:
          - state_machines.Asset.IN_REVIEW_to_ACCEPTED
          - state_machines.Asset.ACCEPTED_to_TAKEN_DOWN
          - entities.Contributor.fields.accepted_asset_count
        distinguishing_aspect: |
          Conserved quantity = Contributor.accepted_asset_count (a different quantity from the earnings
          ledger). ACCEPT increments +1, the takedown-uphold cascade decrements -1; count returns to 0.
        test_recipe:
          setup:
            - "Contributor ACTIVE; one ACCEPTED asset (accepted_asset_count 1); one OPEN takedown on it."
          setup_api_calls:
            - call: "POST /contributors"
              payload: { display_name: "Ro", country_code: "US" }
              as: Contributor
              captures: { c_id: $.data.id }
            - call: "POST /contributors/${c_id}/tax-forms"
              payload: { form_type: "W9", tax_id: "US-V" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /tax-forms/${tf_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
            - call: "POST /assets"
              payload: { contributor_id: "${c_id}", title: "One", media_type: "PHOTO", content_category: "COMMERCIAL", keywords: ["x"], perceptual_hash: "aaaa", requires_release: false }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { a_id: $.data.id }
            - call: "POST /assets/${a_id}/submit"
              payload: {}
              as: Contributor
              as_user_id: "${c_id}"
            - call: "POST /assets/${a_id}/claim"
              payload: {}
              as: Reviewer
            - call: "POST /assets/${a_id}/reviews"
              payload: { decision: "ACCEPT" }
              as: Reviewer
            - call: "POST /assets/${a_id}/takedowns"
              payload: { claim_type: "MODEL_RELEASE", claimant_name: "Claim" }
              as: ComplianceOfficer
              captures: { td_id: $.data.id }
          trigger:
            - call: "POST /takedowns/${td_id}/decision"
              payload: { decision: "UPHOLD" }
              as: ComplianceOfficer
          assert:
            - "Contributor.${c_id}.accepted_asset_count == 0"
            - "Asset.${a_id}.status == TAKEN_DOWN"
            - "Contributor.${c_id}.strike_count == 1"
