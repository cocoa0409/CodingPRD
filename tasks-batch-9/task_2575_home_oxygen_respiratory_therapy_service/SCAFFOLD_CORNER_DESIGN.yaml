            - call: "POST /home-oxygen/patients"
              payload: { mrn: "MRN-0271", full_name: "Kim Sato", branch_id: "${br2_id}", payer_type: "COMMERCIAL", mobility_profile: "ACTIVE_AMBULATORY" }
