              payload: { cycle_label: "Regional Plan 2027-2032", endorsement_deadline: "2026-12-01T00:00:00Z", quorum_weight_bps: 6600, max_revision_rounds: 1, required_session_count: 0 }
              as: RegionalAdministrator
              captures: { cycle_id: $.data.id }
            - call: "POST /resilience/projects"
              payload: { plan_cycle_id: "${cycle_id}", jurisdiction_id: "${j_harbor_id}", name: "Upstream Pump Station", hazard_type: "FLOOD", strategy_type: "PROTECT", base_cost_cents: 42000000, service_life_years: 30, cobenefit_points: 12, feasibility_score: 0.70 }
              as: ProjectSponsor
              as_user_id: "${j_harbor_id}"
              captures: { p_a_id: $.data.id }
            - call: "POST /resilience/projects"
              payload: { plan_cycle_id: "${cycle_id}", jurisdiction_id: "${j_harbor_id}", name: "Downstream Levee Tie-In", hazard_type: "FLOOD", strategy_type: "PROTECT", base_cost_cents: 42000000, service_life_years: 30, cobenefit_points: 12, feasibility_score: 0.70, prerequisite_project_id: "${p_a_id}" }
              as: ProjectSponsor
              as_user_id: "${j_harbor_id}"
              captures: { p_b_id: $.data.id }
          trigger:
            - call: "PATCH /resilience/projects/${p_a_id}"
              payload: { prerequisite_project_id: "00000000-0000-0000-0000-000000000000" }
              as: ProjectSponsor
              as_user_id: "${j_harbor_id}"
            - call: "PATCH /resilience/projects/${p_a_id}"
              payload: { prerequisite_project_id: "${p_b_id}" }
              as: ProjectSponsor
              as_user_id: "${j_harbor_id}"
          assert:
            - "first call: status 404 with data.error_id == ERR_PROJECT_NOT_FOUND"
            - "second call: status 409 with data.error_id == ERR_PROJECT_PREREQUISITE_CYCLE"
            - "AdaptationProject.${p_a_id}.prerequisite_project_id is still null and its version is still 1, so neither rejected PATCH wrote anything"
            - "AdaptationProject.${p_b_id}.prerequisite_project_id is still ${p_a_id}"

