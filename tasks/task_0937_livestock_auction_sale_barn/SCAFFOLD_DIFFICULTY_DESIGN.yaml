  # Rule 8 — resource temporal-overlap with DIFFERENT interval semantics on
  # DIFFERENT resource entities
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: pen_aggregate_head_capacity_over_half_open_occupancy_interval
        grounds:
          - calculations.pen_occupancy
          - validations[priority=24]
          - conservation_invariants.INV_PEN_OCCUPANCY
          - errors[ERR_PEN_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          INTERVAL SEMANTICS 1 on the Pen resource - AGGREGATE CAPACITY over a HALF-OPEN
          occupancy interval [penned_at, released_at). Several lots may share the pen at
          once as long as their head SUM stays <= head_capacity (12 head into a 12-head pen
          is admitted, 17 is refused), and a lot leaving at instant T frees its head for a
          lot arriving at the very same instant T with no cool-down.
        test_recipe:
          setup:
            - "Clock 2026-06-01T08:00:00Z; sale day BARN-1/NE in CHECK_IN_OPEN."
            - "One pen P-CAP12 with head_capacity 12."
            - "One consignment of 17 head sorted into lot A (10 head), lot C (2 head) and lot B (5 head); A and C are already in P-CAP12 so current_head is exactly 12."
          setup_api_calls:
            - call: "POST /sale-barn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: BarnAdmin
            - call: "POST /sale-barn/parties"
              payload: { legal_name: "Rocking R Ranch", party_type: "FARM", origin_state_code: "NE", origin_county: "Lincoln", tax_id: "47-1111111" }
              as: BarnAdmin
              captures: { consignor_id: "$.data.id" }
            - call: "POST /sale-barn/sale-days"
              payload: { sale_date: "2026-06-01", barn_code: "BARN-1", barn_state_code: "NE" }
              as: BarnAdmin
              captures: { sale_day_id: "$.data.id" }
            - call: "POST /sale-barn/pens"
              payload: { pen_code: "P-CAP12", species_class: "CATTLE", head_capacity: 12, pen_type: "HOLDING" }
              as: BarnAdmin
              captures: { pen_id: "$.data.id" }
            - call: "POST /sale-barn/sale-days/${sale_day_id}/advance"
              payload: { to_status: "CHECK_IN_OPEN" }
              as: BarnAdmin
            - call: "POST /sale-barn/consignments"
              payload: { sale_day_id: "${sale_day_id}", consignor_party_id: "${consignor_id}", species_class: "CATTLE", head_received: 17, weigh_basis: "PENCIL_SHRINK", pencil_shrink_pct: 0.03 }
              as: Consignor
              as_user_id: "${consignor_id}"
              captures: { cons_id: "$.data.id" }
            - call: "POST /sale-barn/consignments/${cons_id}/check-in"
              payload: {}
              as: YardOperator
            - call: "POST /sale-barn/lots"
              payload: { consignment_id: "${cons_id}", head_count: 10, livestock_class: "FEEDER_STEER", bid_basis: "PER_CWT", opening_bid: 150.00, reserve_price: 170.00 }
              as: YardOperator
              captures: { lot_a_id: "$.data.id" }
            - call: "POST /sale-barn/lots"
              payload: { consignment_id: "${cons_id}", head_count: 2, livestock_class: "CALF", bid_basis: "PER_HEAD", opening_bid: 40.00, reserve_price: 45.00 }
              as: YardOperator
              captures: { lot_c_id: "$.data.id" }
            - call: "POST /sale-barn/lots"
              payload: { consignment_id: "${cons_id}", head_count: 5, livestock_class: "FEEDER_HEIFER", bid_basis: "PER_CWT", opening_bid: 150.00, reserve_price: 170.00 }
              as: YardOperator
              captures: { lot_b_id: "$.data.id" }
            - call: "POST /sale-barn/lots/${lot_a_id}/assign-pen"
              payload: { pen_id: "${pen_id}" }
              as: YardOperator
            - call: "POST /sale-barn/lots/${lot_c_id}/assign-pen"
              payload: { pen_id: "${pen_id}" }
              as: YardOperator
          trigger:
            - call: "POST /sale-barn/lots/${lot_b_id}/assign-pen"
              payload: { pen_id: "${pen_id}" }
              as: YardOperator
              captures: { err_cap: "$.data.error_id" }
            - call: "POST /sale-barn/consignments/${cons_id}/losses"
              payload: { loss_type: "WITHDRAWN", head: 10, lot_id: "${lot_a_id}" }
              as: Consignor
              as_user_id: "${consignor_id}"
            - call: "POST /sale-barn/lots/${lot_b_id}/assign-pen"
              payload: { pen_id: "${pen_id}" }
              as: YardOperator
              captures: { lot_b_pen: "$.data.pen_id" }
          assert:
            - "Pen.${pen_id}.current_head == 12 before the first trigger call (10 + 2 == capacity exactly, admitted because the comparison is <=)"
            - "The first trigger call returns HTTP 409 with error_id == ERR_PEN_CAPACITY_EXCEEDED (12 + 5 == 17 > 12)"
            - "Lot.${lot_b_id}.pen_id is null after the first trigger call"
            - "Lot.${lot_a_id}.sale_status == WITHDRAWN after the second trigger call"
            - "Pen.${pen_id}.current_head == 2 after the second trigger call"
            - "The third trigger call returns HTTP 200 at the same clock instant the withdrawal happened"
            - "Lot.${lot_b_id}.pen_id == ${pen_id}"
            - "Pen.${pen_id}.current_head == 7"
            - "Pen.${pen_id}.status == OCCUPIED"
            - "Consignment.${cons_id}.head_balance_ok == true"

      - name: crew_booking_closed_window_with_trailing_cooldown_buffer
        grounds:
          - calculations.crew_booking_conflict
          - validations[priority=26]
          - entities.PenMove.fields.scheduled_end_at
          - errors[ERR_CREW_MOVE_OVERLAP]
        distinguishing_aspect: |
          INTERVAL SEMANTICS 2 on the DroverCrew resource, geometrically different from the
          pen rule - EXCLUSIVE (capacity one) occupancy with a TRAILING 15-minute cool-down
          appended to every booking. A 09:00-09:30 move blocks until 09:45: a second move
          starting 09:44 is refused, and one starting exactly at 09:45 is admitted. No
          summation is involved and adjacency is only legal after the buffer, not at the
          raw end instant.
        test_recipe:
          setup:
            - "Clock 2026-06-01T08:00:00Z; sale day BARN-1/NE in CHECK_IN_OPEN; pens P-01 and P-02, 60 head each."
            - "One ON_DUTY crew CREW-A."
            - "One consignment of 15 head sorted into lot A (10 head) and lot B (5 head), both standing in P-01."
            - "CREW-A already holds a REQUESTED move for lot A from P-01 to P-02 booked 2026-06-01T09:00:00Z to 09:30:00Z, so it is blocked until 09:45:00Z."
          setup_api_calls:
            - call: "POST /sale-barn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: BarnAdmin
            - call: "POST /sale-barn/parties"
              payload: { legal_name: "Rocking R Ranch", party_type: "FARM", origin_state_code: "NE", origin_county: "Lincoln", tax_id: "47-1111111" }
              as: BarnAdmin
              captures: { consignor_id: "$.data.id" }
            - call: "POST /sale-barn/sale-days"
              payload: { sale_date: "2026-06-01", barn_code: "BARN-1", barn_state_code: "NE" }
              as: BarnAdmin
              captures: { sale_day_id: "$.data.id" }
            - call: "POST /sale-barn/pens"
              payload: { pen_code: "P-01", species_class: "CATTLE", head_capacity: 60, pen_type: "RECEIVING" }
              as: BarnAdmin
              captures: { pen1_id: "$.data.id" }
            - call: "POST /sale-barn/pens"
              payload: { pen_code: "P-02", species_class: "CATTLE", head_capacity: 60, pen_type: "HOLDING" }
              as: BarnAdmin
              captures: { pen2_id: "$.data.id" }
            - call: "POST /sale-barn/drover-crews"
              payload: { crew_code: "CREW-A", member_count: 3 }
              as: YardOperator
              captures: { crew_id: "$.data.id" }
            - call: "POST /sale-barn/drover-crews/${crew_id}/duty"
              payload: { to_status: "ON_DUTY" }
              as: YardOperator
            - call: "POST /sale-barn/sale-days/${sale_day_id}/advance"
              payload: { to_status: "CHECK_IN_OPEN" }
              as: BarnAdmin
            - call: "POST /sale-barn/consignments"
              payload: { sale_day_id: "${sale_day_id}", consignor_party_id: "${consignor_id}", species_class: "CATTLE", head_received: 15, weigh_basis: "PENCIL_SHRINK", pencil_shrink_pct: 0.03 }
              as: Consignor
              as_user_id: "${consignor_id}"
              captures: { cons_id: "$.data.id" }
            - call: "POST /sale-barn/consignments/${cons_id}/check-in"
              payload: {}
              as: YardOperator
            - call: "POST /sale-barn/lots"
              payload: { consignment_id: "${cons_id}", head_count: 10, livestock_class: "FEEDER_STEER", bid_basis: "PER_CWT", opening_bid: 150.00, reserve_price: 170.00 }
              as: YardOperator
              captures: { lot_a_id: "$.data.id" }
            - call: "POST /sale-barn/lots"
              payload: { consignment_id: "${cons_id}", head_count: 5, livestock_class: "FEEDER_HEIFER", bid_basis: "PER_CWT", opening_bid: 150.00, reserve_price: 170.00 }
              as: YardOperator
              captures: { lot_b_id: "$.data.id" }
            - call: "POST /sale-barn/lots/${lot_a_id}/assign-pen"
              payload: { pen_id: "${pen1_id}" }
              as: YardOperator
            - call: "POST /sale-barn/lots/${lot_b_id}/assign-pen"
              payload: { pen_id: "${pen1_id}" }
              as: YardOperator
            - call: "POST /sale-barn/pen-moves"
              payload: { lot_id: "${lot_a_id}", to_pen_id: "${pen2_id}", crew_id: "${crew_id}", scheduled_start_at: "2026-06-01T09:00:00Z" }
              as: YardOperator
              captures: { move1_id: "$.data.id" }
          trigger:
            - call: "POST /sale-barn/pen-moves"
              payload: { lot_id: "${lot_b_id}", to_pen_id: "${pen2_id}", crew_id: "${crew_id}", scheduled_start_at: "2026-06-01T09:44:00Z" }
              as: YardOperator
              captures: { err_overlap: "$.data.error_id" }
            - call: "POST /sale-barn/pen-moves"
              payload: { lot_id: "${lot_b_id}", to_pen_id: "${pen2_id}", crew_id: "${crew_id}", scheduled_start_at: "2026-06-01T09:45:00Z" }
              as: YardOperator
              captures: { move2_id: "$.data.id" }
          assert:
            - "PenMove.${move1_id}.scheduled_end_at == 2026-06-01T09:30:00.000Z"
            - "The first trigger call returns HTTP 409 with error_id == ERR_CREW_MOVE_OVERLAP (09:44 < 09:45 blocked_until)"
            - "The second trigger call returns HTTP 201 (09:45 == blocked_until exactly, which is admitted)"
            - "PenMove.${move2_id}.status == REQUESTED"
            - "PenMove.${move2_id}.scheduled_end_at == 2026-06-01T10:15:00.000Z"
            - "GET /sale-barn/pen-moves?crew_id=${crew_id} returns total_count == 2"

  # =========================================================================
  # Rule 9 — compensating-action invariants on DIFFERENT conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: purchase_void_restores_sale_day_gross_sale_value_to_zero
        grounds:
          - state_machines.Purchase.CONFIRMED_to_VOIDED
          - state_machines.Lot.SOLD_to_NO_SALE
          - entities.SaleDay.fields.total_gross_sale_value
          - conservation_invariants.INV_GROSS_MATCH
        distinguishing_aspect: |
          CONSERVED QUANTITY 1 - MONEY, the named field SaleDay.total_gross_sale_value.
          Hammer-down (forward) drives it 0.00 -> 12391.75 and voiding the purchase
          (compensating) drives it back to exactly 0.00, with the buyer invoice subtotal,
          the buyer exposure and the consignment head_sold all returning to their
          pre-hammer values. No residue of the sale is left anywhere.
        test_recipe:
          setup:
            - "Clock 2026-06-01T08:00:00Z; sale day BARN-1/NE in RINGING; pen 60 head; certified scale."
            - "One consignment of 10 head with one weighed (7200/200, settle 6790), penned, ready lot."
            - "One BONDED buyer with credit_limit 50000 has taken the lot at 182.50 $/cwt, so a CONFIRMED Purchase and a DRAFT BuyerInvoice exist."
          setup_api_calls:
            - call: "POST /sale-barn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: BarnAdmin
            - call: "POST /sale-barn/parties"
              payload: { legal_name: "Rocking R Ranch", party_type: "FARM", origin_state_code: "NE", origin_county: "Lincoln", tax_id: "47-1111111" }
              as: BarnAdmin
              captures: { consignor_id: "$.data.id" }
            - call: "POST /sale-barn/parties"
              payload: { legal_name: "Midwest Packing", party_type: "PACKER", origin_state_code: "NE", origin_county: "Douglas", tax_id: "47-2222222" }
              as: BarnAdmin
              captures: { buyer_party_id: "$.data.id" }
            - call: "POST /sale-barn/sale-days"
              payload: { sale_date: "2026-06-01", barn_code: "BARN-1", barn_state_code: "NE" }
              as: BarnAdmin
              captures: { sale_day_id: "$.data.id" }
            - call: "POST /sale-barn/pens"
              payload: { pen_code: "P-01", species_class: "CATTLE", head_capacity: 60, pen_type: "HOLDING" }
              as: BarnAdmin
              captures: { pen_id: "$.data.id" }
            - call: "POST /sale-barn/scales"
              payload: { scale_code: "SC-1", certified_from: "2026-01-01", certification_expires_on: "2026-12-31", max_draft_lb: 60000 }
              as: BarnAdmin
              captures: { scale_id: "$.data.id" }
            - call: "POST /sale-barn/sale-days/${sale_day_id}/advance"
              payload: { to_status: "CHECK_IN_OPEN" }
              as: BarnAdmin
            - call: "POST /sale-barn/consignments"
              payload: { sale_day_id: "${sale_day_id}", consignor_party_id: "${consignor_id}", species_class: "CATTLE", head_received: 10, weigh_basis: "PENCIL_SHRINK", pencil_shrink_pct: 0.03 }
              as: Consignor
              as_user_id: "${consignor_id}"
              captures: { cons_id: "$.data.id" }
            - call: "POST /sale-barn/consignments/${cons_id}/check-in"
              payload: {}
              as: YardOperator
            - call: "POST /sale-barn/lots"
              payload: { consignment_id: "${cons_id}", head_count: 10, livestock_class: "FEEDER_STEER", bid_basis: "PER_CWT", opening_bid: 150.00, reserve_price: 170.00 }
              as: YardOperator
              captures: { lot_id: "$.data.id" }
            - call: "POST /sale-barn/lots/${lot_id}/assign-pen"
              payload: { pen_id: "${pen_id}" }
              as: YardOperator
            - call: "POST /sale-barn/weigh-tickets"
              payload: { lot_id: "${lot_id}", scale_id: "${scale_id}", head_on_draft: 10, gross_weight_lb: 7200, tare_weight_lb: 200 }
              as: YardOperator
              captures: { wt_id: "$.data.id" }
            - call: "POST /sale-barn/weigh-tickets/${wt_id}/capture"
              payload: {}
              as: YardOperator
            - call: "POST /sale-barn/lots/${lot_id}/mark-ready"
              payload: {}
              as: YardOperator
            - call: "POST /sale-barn/buyer-registrations"
              payload: { party_id: "${buyer_party_id}", sale_day_id: "${sale_day_id}", buyer_number: 101, bond_type: "BONDED", credit_limit: 50000, cash_deposit_amount: 0 }
              as: BarnAdmin
              captures: { br_id: "$.data.id" }
            - call: "POST /sale-barn/buyer-registrations/${br_id}/approve"
              payload: {}
              as: BarnAdmin
            - call: "POST /sale-barn/sale-days/${sale_day_id}/advance"
              payload: { to_status: "RINGING" }
              as: BarnAdmin
            - call: "POST /sale-barn/lots/${lot_id}/enter-ring"
              payload: {}
              as: Auctioneer
            - call: "POST /sale-barn/bids"
              payload: { lot_id: "${lot_id}", buyer_registration_id: "${br_id}", unit_price: 182.50 }
              as: RingClerk
              captures: { bid_id: "$.data.id" }
            - call: "GET /sale-barn/lots/${lot_id}"
              payload: {}
              as: Auctioneer
              captures: { lot_v: "$.data.version" }
            - call: "POST /sale-barn/lots/${lot_id}/hammer-down"
              payload: { winning_bid_id: "${bid_id}", expected_lot_version: "${lot_v}" }
              as: Auctioneer
              captures: { purchase_id: "$.data.id", invoice_id: "$.data.buyer_invoice_id" }
          trigger:
            - call: "GET /sale-barn/sale-days/${sale_day_id}"
              payload: {}
              as: SettlementClerk
              captures: { gross_before: "$.data.total_gross_sale_value" }
            - call: "POST /sale-barn/purchases/${purchase_id}/void"
              payload: { reason: "Buyer refused the load at the scale" }
              as: SettlementClerk
              captures: { purchase_status: "$.data.status" }
            - call: "GET /sale-barn/sale-days/${sale_day_id}"
              payload: {}
              as: SettlementClerk
              captures: { gross_after: "$.data.total_gross_sale_value" }
          assert:
            - "SaleDay.${sale_day_id}.total_gross_sale_value == 12391.75 before the void"
            - "SaleDay.${sale_day_id}.total_gross_sale_value == 0.00 after the void"
            - "Purchase.${purchase_id}.status == VOIDED"
            - "Lot.${lot_id}.sale_status == NO_SALE"
            - "Lot.${lot_id}.custody_status == BARN"
            - "Lot.${lot_id}.hammer_price is null and Lot.${lot_id}.extended_amount == 0.00"
            - "Bid.${bid_id}.status == VOIDED"
            - "BuyerInvoice.${invoice_id}.subtotal == 0.00 and BuyerInvoice.${invoice_id}.status == VOIDED"
            - "BuyerRegistration.${br_id}.exposure == 0.00 and available_credit == 75000.00"
            - "Consignment.${cons_id}.head_sold == 0 and head_no_saled == 10"
            - "SaleDay.${sale_day_id}.gross_match_ok == true"

      - name: lot_withdraw_then_relot_preserves_consignment_head_balance
        grounds:
          - conservation_invariants.INV_CONSIGNMENT_HEAD
          - state_machines.Lot.PENNED_to_WITHDRAWN
          - state_machines.Consignment.SORTED_to_CHECKED_IN
          - entities.Consignment.fields.head_unassigned
          - entities.Consignment.fields.head_balance_ok
        distinguishing_aspect: |
          CONSERVED QUANTITY 2 - HEAD OF LIVESTOCK, a different kind of quantity from money,
          pinned by INV_CONSIGNMENT_HEAD. Withdrawing a 10-head lot (forward) moves those
          head from head_in_lots into head_unassigned and drives the consignment back
          SORTED -> CHECKED_IN; re-sorting them into a fresh lot (compensating) restores
          head_in_lots to 17 and head_unassigned to 0. head_received stays 17 and
          head_balance_ok stays true at every step - zero drift.
        test_recipe:
          setup:
            - "Clock 2026-06-01T08:00:00Z; sale day BARN-1/NE in CHECK_IN_OPEN; one pen of 60 head."
            - "One consignment of 17 head, checked in, fully sorted into lot A (10 head, penned), lot C (2 head) and lot B (5 head), so head_unassigned is 0 and the consignment is SORTED."
          setup_api_calls:
            - call: "POST /sale-barn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: BarnAdmin
            - call: "POST /sale-barn/parties"
              payload: { legal_name: "Rocking R Ranch", party_type: "FARM", origin_state_code: "NE", origin_county: "Lincoln", tax_id: "47-1111111" }
              as: BarnAdmin
              captures: { consignor_id: "$.data.id" }
            - call: "POST /sale-barn/sale-days"
              payload: { sale_date: "2026-06-01", barn_code: "BARN-1", barn_state_code: "NE" }
              as: BarnAdmin
              captures: { sale_day_id: "$.data.id" }
            - call: "POST /sale-barn/pens"
              payload: { pen_code: "P-01", species_class: "CATTLE", head_capacity: 60, pen_type: "HOLDING" }
              as: BarnAdmin
              captures: { pen_id: "$.data.id" }
            - call: "POST /sale-barn/sale-days/${sale_day_id}/advance"
              payload: { to_status: "CHECK_IN_OPEN" }
              as: BarnAdmin
            - call: "POST /sale-barn/consignments"
              payload: { sale_day_id: "${sale_day_id}", consignor_party_id: "${consignor_id}", species_class: "CATTLE", head_received: 17, weigh_basis: "PENCIL_SHRINK", pencil_shrink_pct: 0.03 }
              as: Consignor
              as_user_id: "${consignor_id}"
              captures: { cons_id: "$.data.id" }
            - call: "POST /sale-barn/consignments/${cons_id}/check-in"
              payload: {}
              as: YardOperator
            - call: "POST /sale-barn/lots"
              payload: { consignment_id: "${cons_id}", head_count: 10, livestock_class: "FEEDER_STEER", bid_basis: "PER_CWT", opening_bid: 150.00, reserve_price: 170.00 }
              as: YardOperator
              captures: { lot_a_id: "$.data.id" }
            - call: "POST /sale-barn/lots"
              payload: { consignment_id: "${cons_id}", head_count: 2, livestock_class: "CALF", bid_basis: "PER_HEAD", opening_bid: 40.00, reserve_price: 45.00 }
              as: YardOperator
              captures: { lot_c_id: "$.data.id" }
            - call: "POST /sale-barn/lots"
              payload: { consignment_id: "${cons_id}", head_count: 5, livestock_class: "FEEDER_HEIFER", bid_basis: "PER_CWT", opening_bid: 150.00, reserve_price: 170.00 }
              as: YardOperator
              captures: { lot_b_id: "$.data.id" }
            - call: "POST /sale-barn/lots/${lot_a_id}/assign-pen"
              payload: { pen_id: "${pen_id}" }
              as: YardOperator
          trigger:
            - call: "POST /sale-barn/consignments/${cons_id}/losses"
              payload: { loss_type: "WITHDRAWN", head: 10, lot_id: "${lot_a_id}" }
              as: Consignor
              as_user_id: "${consignor_id}"
              captures: { unassigned_after_withdraw: "$.data.head_unassigned" }
            - call: "POST /sale-barn/lots"
              payload: { consignment_id: "${cons_id}", head_count: 10, livestock_class: "FEEDER_STEER", bid_basis: "PER_CWT", opening_bid: 150.00, reserve_price: 170.00 }
              as: YardOperator
              captures: { lot_d_id: "$.data.id" }
            - call: "GET /sale-barn/consignments/${cons_id}"
              payload: {}
              as: YardOperator
              captures: { balance_ok_final: "$.data.head_balance_ok" }
          assert:
            - "Consignment.${cons_id}.status == SORTED and head_unassigned == 0 and head_in_lots == 17 before the first trigger call"
            - "After the withdrawal: Lot.${lot_a_id}.sale_status == WITHDRAWN"
            - "After the withdrawal: Consignment.${cons_id}.head_unassigned == 10 and head_in_lots == 7"
            - "After the withdrawal: Consignment.${cons_id}.head_withdrawn == 0 (a withdrawn LOT returns head to the unassigned pool, it does not leave the yard)"
