          assert:
            - "Trigger 1: HTTP 409 and ${err_seg} == ERR_SEGMENT_REQUIRES_LIST (not ERR_INVALID_REQUEST - both fields are declared optional, so the body is well formed)"
            - "Trigger 1: GET /pre-bid-segments filtered by campaign_id == ${camp_id} returns total_count == 0"
            - "Trigger 2: HTTP 409 and ${err_empty} == ERR_EMPTY_LIST, a different id for the different empty-collection failure"
            - "InventoryList.${list_id}.status is still DRAFT with published_version == null and entry_count == 0"

      - name: segment_pinning_a_mistyped_list_is_rejected_in_both_directions
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_18
          - errors[ERR_LIST_ADVERTISER_MISMATCH]
        distinguishing_aspect: |
          The rule is directional and must be checked on both slots: an
          EXCLUSION list in inclusion_list_id and an INCLUSION list in
          exclusion_list_id are both violations, even though every id resolves
          and every list belongs to the right advertiser. An implementation
          that validates only inclusion_list_id builds a segment whose
          allow-list silently behaves as a block-list at pre-bid time.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; one advertiser owning one INCLUSION list and one EXCLUSION list, each with one entry, plus a DISPLAY campaign."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertisers"
              payload: { name: "Northwind Media", credit_cap_cents: 1000000 }
              as: PlatformAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q3 Display", cpm_cents: 875, min_suitability_tier: "MEDIUM_RISK", format: "DISPLAY" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /inventory-lists"
              payload: { advertiser_id: "${adv_id}", list_type: "INCLUSION", name: "Allowed sellers" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { incl_id: $.data.id }
            - call: "POST /inventory-lists/${incl_id}/entries"
              payload: { entry_type: "DOMAIN", entry_value: "good.example.com" }
              as: Advertiser
              as_user_id: "${adv_id}"
            - call: "POST /inventory-lists"
              payload: { advertiser_id: "${adv_id}", list_type: "EXCLUSION", name: "Blocked sellers" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { excl_id: $.data.id }
            - call: "POST /inventory-lists/${excl_id}/entries"
              payload: { entry_type: "DOMAIN", entry_value: "bad.example.com" }
              as: Advertiser
              as_user_id: "${adv_id}"
          trigger:
            - call: "POST /pre-bid-segments"
              payload: { campaign_id: "${camp_id}", suitability_floor_tier: "MEDIUM_RISK", inclusion_list_id: "${excl_id}" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { err_a: $.data.error_id }
            - call: "POST /pre-bid-segments"
              payload: { campaign_id: "${camp_id}", suitability_floor_tier: "MEDIUM_RISK", exclusion_list_id: "${incl_id}" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { err_b: $.data.error_id }
            - call: "POST /pre-bid-segments"
              payload: { campaign_id: "${camp_id}", suitability_floor_tier: "MEDIUM_RISK", inclusion_list_id: "${incl_id}", exclusion_list_id: "${excl_id}" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { seg_ok: $.data.id }
          assert:
            - "Trigger 1: HTTP 409 and ${err_a} == ERR_LIST_ADVERTISER_MISMATCH (an EXCLUSION list cannot sit in inclusion_list_id)"
            - "Trigger 2: HTTP 409 and ${err_b} == ERR_LIST_ADVERTISER_MISMATCH (the symmetric violation on the other slot)"
            - "Trigger 3: HTTP 201 - the correctly typed pairing is accepted; PreBidSegment.${seg_ok}.inclusion_list_id == ${incl_id}, exclusion_list_id == ${excl_id}, sync_status == PENDING"
            - "GET /pre-bid-segments filtered by campaign_id == ${camp_id} returns total_count == 1 (the two refused attempts persisted nothing)"

      - name: appeal_filing_window_is_inclusive_at_exactly_fourteen_days
        claim_type: temporal_validation
        grounds:
          - validations.priority_32
          - errors[ERR_APPEAL_WINDOW_CLOSED]
        distinguishing_aspect: |
          The window is measured from the disputed classification's created_at
          and is INCLUSIVE at the boundary: an appeal filed at exactly
          2026-08-24T00:00:00Z against a classification created at
          2026-08-10T00:00:00Z is accepted, and the same filing one second
          later is refused. Two sibling pages classified in the same request
          batch isolate the clock as the only difference, so an off-by-one
          comparison (> instead of >=) is caught rather than absorbed.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; two pages of one publisher, each classified HUMAN [GAMBLING] and CONFIRMED by analyst-2 at that instant."
          setup_api_calls:
