        distinguishing_aspect: "ReciprocalSwitchingPetition -> ServiceComplaint pair: grant is refused (ERR_PETITION_EVIDENCE_NOT_ESCALATED) while the cited service complaint is merely OPEN, and succeeds once the Board escalates it — a live cross-entity status gate at decide time."
