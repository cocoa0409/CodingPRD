            - "Loan.${loan_a_id}.status == DISBURSED"
            - "Loan.${loan_b_id}.status == REQUESTED"

      - name: rmd_distribution_year_uniqueness_closed_bucket
        grounds:
          - validations[priority=13]
          - errors[ERR_DUPLICATE_RMD_YEAR]
        distinguishing_aspect: |
          Different interval semantics: discrete closed annual bucket
          (distribution_year is an integer index, not a continuous interval).
          Different resource entity (RMDDistribution, not Loan). Two
          RMDDistributions with the same (participant_id, distribution_year)
          are rejected — the second create returns ERR_DUPLICATE_RMD_YEAR.
        test_recipe:
          setup:
            - "Clock at 2026-06-15."
            - "ACTIVE plan; ENROLLED participant age 73 (DOB 1954-01-01); one PENDING RMDDistribution already created for distribution_year 2026."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plans"
              payload: { name: "OvB", plan_year: 2026, match_formula: "TIERED", vesting_schedule: "CLIFF_3" }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/activate"
              payload: {}
