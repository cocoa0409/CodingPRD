          assert:
            - "error_id == ERR_CLAIM_FILING_DEADLINE (temporal priority 6 beats constraint priority 7)"
            - "NOT ERR_DUPLICATE_RECEIPT even though receipt_ref collides"

      - name: approve_fraud_hold_beats_allowance_exceeded
        grounds:
