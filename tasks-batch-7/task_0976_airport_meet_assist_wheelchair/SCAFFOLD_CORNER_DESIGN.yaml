        claim_type: rbac_denial
        grounds: ["roles[Dispatcher]", "endpoints[POST /maa/legs/{leg_id}/dispatch]"]
        distinguishing_aspect: "Agent role attempting dispatch → ERR_UNAUTHORIZED."
        test_recipe:
          setup:
