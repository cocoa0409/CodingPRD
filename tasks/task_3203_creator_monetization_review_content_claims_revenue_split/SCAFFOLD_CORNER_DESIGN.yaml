              captures: { r_hc: $.data.id }
          assert:
            - "RevenueRouting.${r_hc}.creator_share_cents == 551"
            - "RevenueRouting.${r_hc}.partner_share_cents == 450"
            - "a round-half-down implementation would report 550 / 451 instead"

      - name: adjusted_net_waterfall_excludes_escrow_but_keeps_it_in_gross
        claim_type: Input Set Filtering
        grounds:
          - calculations.adjusted_net_balance
