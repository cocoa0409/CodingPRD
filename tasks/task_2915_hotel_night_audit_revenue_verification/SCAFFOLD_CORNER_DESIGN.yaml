      - name: entity_type_constraints_bad_enum_and_out_of_range_numbers_are_refused
        claim_type: type_constraints
        grounds: ["entities.Folio.fields.market_segment", "entities.Folio.fields.nights_count", "entities.HotelProperty.fields.room_count_total", "validations[priority=5]"]
        distinguishing_aspect: "Three different shapes of type violation - an unknown enum member, an integer below its declared minimum, and a string where a number is declared - all resolve to the same 400 before any business rule is consulted."
        test_recipe:
          setup: ["Standard property; business date 2026-08-01."]
          setup_api_calls:
            - call: "POST /night-audit/properties"
