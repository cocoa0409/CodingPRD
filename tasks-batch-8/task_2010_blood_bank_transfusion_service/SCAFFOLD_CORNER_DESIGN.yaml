              as: SupplierCoordinator
              captures: { so1: $.data.id }
            - call: "POST /blood-bank/supplier-orders/${so1}/submit"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so1}/acknowledge"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders"
              payload: { supplier_id: "${sup_id}", is_emergency: false, lines: [{ product_type: "FFP", abo_type: "A", rh_type: "NEG", quantity: 2 }] }
              as: SupplierCoordinator
              captures: { so2: $.data.id }
            - call: "POST /blood-bank/supplier-orders/${so2}/submit"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so2}/acknowledge"
              as: SupplierCoordinator
          trigger:
            - call: "POST /blood-bank/supplier-orders/${so1}/receive"
              payload: { units: [{ unit_number: "U-100", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-500", lot_number: "LOT-1", antigen_negative: [] }] }
