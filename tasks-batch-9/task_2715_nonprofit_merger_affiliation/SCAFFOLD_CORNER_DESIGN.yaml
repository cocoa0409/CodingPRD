              as: CharitableTrustCounsel
              as_user_id: "ctc-001"
          assert:
            - "the reachable-donor petition returns HTTP status 422 and e_reachable == ERR_DONOR_CONSENT_REQUIRED; RestrictedFund.${fund_r}.transfer_status is still HELD with version 1"
            - "the wrong-basis petition returns HTTP status 422 and e_wrongbasis == ERR_DONOR_CONSENT_REQUIRED; RestrictedFund.${fund_u}.transfer_status is still HELD"
            - "the DONOR_UNREACHABLE petition returns HTTP status 200; RestrictedFund.${fund_u}.transfer_status == PETITION_FILED with petition_filed_at == 2026-08-01T00:00:00.000Z"
            - "after the granted decision RestrictedFund.${fund_u}.transfer_status == MODIFIED and transferable_amount_cents == 30000000 - a TEMP_RESTRICTED fund releases its whole value on either basis"
            - "the DONOR_CONSENT transfer returns HTTP status 422 and e_nobasis == ERR_DONOR_CONSENT_REQUIRED, NOT ERR_INVALID_FUND_STATE - MODIFIED is a state from which transfers are permitted, so priority 18 passes and priority 30 speaks about the missing consent"
            - "the JUDICIAL_MODIFICATION transfer returns HTTP status 200; RestrictedFund.${fund_u}.transfer_status == TRANSFERRED with transferred_amount_cents == 30000000, retained_amount_cents == 0 and transferred_to_org_id == ${org_b}"
            - "Organization.${org_a}.restricted_corpus_cents == 62000000 and Organization.${org_b}.restricted_corpus_cents == 30000000 after the transfer, so the pair corpus is still 92000000"
            - "Restructuring.${deal}.restricted_asset_posture == RESTRICTED_PENDING and unresolved_restricted_fund_count == 1 - fund R is still HELD"

