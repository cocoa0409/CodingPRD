  # ------------------------------------------------------------ gypsum supply
  - method: POST
    path: "/plant-ops/gypsum-lots"
    description: "Receive a synthetic or natural gypsum lot at the plant with the supplier's declared moisture and purity."
    roles: [MaterialsController]
    code: 201
    input: [plant_id, source_type, supplier_name, received_tons, declared_free_moisture_pct, declared_purity_pct]
    output: GypsumLot
    side_effects: ["status = RECEIVED; assay_count = 0; remaining_tons = received_tons; version = 1"]

  - method: POST
    path: "/plant-ops/gypsum-lots/{lotId}/assay"
    description: "Record a laboratory assay; the disposition rule approves or quarantines the lot and the re-assay cycle is bounded at three assays."
    roles: [MaterialsController]
    code: 200
    input: [free_moisture_pct, purity_pct, chloride_ppm]
    output: GypsumLot
    side_effects:
      - "runs calculations.lot_assay_disposition; sets status, quarantine_reason, assayed_at, assay_count"
      - "increments GypsumLot.version by 1"

  - method: POST
    path: "/plant-ops/gypsum-lots/{lotId}/reject"
    description: "Reject a quarantined lot that has not been drawn from; terminal."
    roles: [MaterialsController]
    code: 200
    input: [reject_note]
    output: GypsumLot
    side_effects: ["status = REJECTED; remaining_tons = 0.000; increments GypsumLot.version by 1"]

  # --------------------------------------------------------- calciner control
  - method: POST
    path: "/plant-ops/calciner-batches"
    description: "Plan a calcination batch on a feed-rate window; the aggregate calciner load over every overlapping sub-interval must fit plant capacity."
    roles: [MaterialsController]
    code: 201
    input: [plant_id, target_stucco_tons, calcination_temp_f, feed_rate_tph, feed_window_start, feed_window_end]
    output: CalcinerBatch
    side_effects:
      - "runs calculations.calciner_aggregate_capacity against PLANNED/FEEDING/CALCINING siblings"
      - "status = PLANNED; stucco_quality_flag = PENDING"

  - method: POST
    path: "/plant-ops/calciner-batches/{batchId}/feeds"
    description: "Feed an approved lot increment into a batch, recording the belt-scale moisture. OCC-guarded on the lot's version."
    roles: [MaterialsController]
    code: 201
    input: [lot_id, tons_fed, measured_free_moisture_pct, expected_lot_version]
    output: BatchFeed
    side_effects:
      - "creates BatchFeed with feed_seq and assay snapshots; batch PLANNED -> FEEDING on the first feed"
      - "lot.consumed_tons += tons_fed; lot.remaining_tons recomputed; lot may auto-transition APPROVED -> DEPLETED"
      - "increments GypsumLot.version by 1 and CalcinerBatch.version by 1"
      - "recomputes batch_blend_metrics (PLAN_BASIS and AS_FED_BASIS)"

  - method: POST
    path: "/plant-ops/calciner-batches/{batchId}/close-feed"
    description: "Close the feed side of a batch and stamp the planned stucco yield."
    roles: [MaterialsController]
    code: 200
    input: []
    output: CalcinerBatch
    side_effects: ["status FEEDING -> CALCINING; stamps stucco_yield_plan_tons and feed_purity_plan_pct; increments CalcinerBatch.version by 1"]

  - method: POST
    path: "/plant-ops/calciner-batches/{batchId}/stucco-tests"
    description: "Record a stucco quality sample. A non-FAIL sample on a CALCINING batch completes it and credits the silo; a FAIL sample on a COMPLETED batch triggers the nonconformance cascade."
    roles: [QualityInspector]
    code: 201
    input: [sample_seq, combined_water_pct, free_water_pct, set_time_minutes, normal_consistency_cc]
    output: StuccoTest
    side_effects:
      - "computes result via calculations.stucco_test_result and overwrites batch.stucco_quality_flag"
      - "CALCINING + PASS|MARGINAL: batch -> COMPLETED, stamps stucco_yield_actual_tons, credits plant.stucco_on_hand_tons, re-derives posture, increments Plant.version by 1"
      - "COMPLETED + FAIL: cascades run quality_state -> HELD, plant.held_run_count, posture, and STAGED LoadOrders -> HELD"
      - "increments CalcinerBatch.version by 1"

  - method: POST
    path: "/plant-ops/calciner-batches/{batchId}/abort"
    description: "Abort a batch before completion, restoring every fed tonne to its source lot."
    roles: [MaterialsController]
    code: 200
    input: [abort_reason]
    output: CalcinerBatch
    side_effects:
      - "status -> ABORTED; per-feed tonnage restored to each lot; DEPLETED lots return to APPROVED"
      - "increments GypsumLot.version by 1 per affected lot and CalcinerBatch.version by 1"

  # --------------------------------------------------------------- board line
  - method: POST
    path: "/plant-ops/production-runs"
    description: "Draft a production run: line window, SKU, stucco provenance, line speed, paper tension and kiln profile choice."
    roles: [ProductionScheduler]
    code: 201
    input: [plant_id, line_id, product_spec_id, calciner_batch_id, window_start, window_end, requested_planned_msf, line_speed_fpm, paper_tension_lb, kiln_dwell_minutes, kiln_exit_moisture_target_pct]
    output: ProductionRun
    side_effects:
      - "stamps required_paper_tension_lb and projected_exit_moisture_pct"
      - "status = DRAFT; quality_state = UNTESTED; saleable_grade = UNGRADED"

  - method: POST
    path: "/plant-ops/production-runs/{runId}/schedule"
    description: "Schedule a drafted run onto the line: resolves the changeover predecessor, caps the MSF to line capacity, reserves silo stucco and stamps kiln energy. OCC-guarded on the plant's version."
    roles: [ProductionScheduler]
    code: 200
    input: [expected_plant_version]
    output: ProductionRun
    side_effects:
      - "runs calculations.run_line_capacity_and_reservation steps 1..6 then calculations.kiln_energy_and_moisture"
      - "plant.stucco_committed_tons += stucco_reserved_tons; posture re-derived; increments Plant.version by 1"
      - "increments ProductionRun.version by 1"

  - method: POST
    path: "/plant-ops/production-runs/{runId}/start"
    description: "Start a scheduled run once the clock reaches its window, the line is available and the batch's stucco is conforming."
    roles: [ProductionScheduler]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["status SCHEDULED -> RUNNING; increments ProductionRun.version by 1"]

  - method: POST
    path: "/plant-ops/production-runs/{runId}/complete"
    description: "Complete a run with produced and scrapped MSF plus edge and end defect rates; releases the reservation and debits the silo."
    roles: [ProductionScheduler]
    code: 200
    input: [actual_msf, scrap_msf, edge_defect_ppm, end_defect_ppm]
    output: ProductionRun
    side_effects:
      - "stamps stucco_consumed_tons, net_good_msf, available_msf"
      - "plant.stucco_committed_tons -= stucco_reserved_tons; plant.stucco_on_hand_tons -= stucco_consumed_tons; posture re-derived; increments Plant.version by 1"
      - "auto-holds quality_state on an edge or end defect breach"
      - "increments ProductionRun.version by 1"

  - method: POST
    path: "/plant-ops/production-runs/{runId}/cancel"
    description: "Cancel a drafted or scheduled run, releasing any stucco reservation."
    roles: [ProductionScheduler, PlantManager]
    code: 200
    input: [cancel_reason]
    output: ProductionRun
    side_effects:
      - "status -> CANCELLED; stucco_reserved_tons released to the silo when the run was SCHEDULED; posture re-derived; increments Plant.version by 1 in that case"
      - "increments ProductionRun.version by 1"

  - method: POST
    path: "/plant-ops/production-runs/{runId}/board-tests"
    description: "Record a board specimen against the standard minima for core hardness, nail pull and cross flexural strength plus exit moisture. The first specimen (or the first after a hold) moves the quality dimension to IN_TEST."
    roles: [QualityInspector]
    code: 201
    input: [specimen_seq, core_hardness_lbf, nail_pull_lbf, flexural_cross_lbf, flexural_parallel_lbf, exit_moisture_pct]
    output: BoardTest
    side_effects:
      - "computes result and failing_attributes; recomputes specimen_count, failing_specimen_count, fail_rate"
      - "quality_state UNTESTED -> IN_TEST, or HELD -> IN_TEST with retest_count += 1 and held_run_count -= 1 (posture re-derived, Plant.version += 1)"
      - "records last_failing_test_recorded_by_user_id on a FAIL"
      - "increments ProductionRun.version by 1"

  - method: POST
    path: "/plant-ops/production-runs/{runId}/quality-evaluation"
    description: "Evaluate the recorded specimens and branch the quality dimension to RELEASED, DOWNGRADED or HELD."
    roles: [QualityInspector]
    code: 200
    input: []
    output: ProductionRun
    side_effects:
      - "runs calculations.board_quality_evaluation run rule; sets quality_state, saleable_grade, held_reason"
      - "HELD also increments plant.held_run_count, re-derives posture, bumps Plant.version and holds STAGED LoadOrders"
      - "RELEASED / DOWNGRADED return HELD LoadOrders to STAGED"
      - "increments ProductionRun.version by 1"

  - method: POST
    path: "/plant-ops/production-runs/{runId}/quality-disposition"
    description: "Disposition a held run: RELEASE (requires a re-test), DOWNGRADE or SCRAP. The inspector who recorded the failing specimen may not disposition it."
    roles: [QualityManager]
    code: 200
    input: [action, disposition_note]
    output: ProductionRun
    side_effects:
      - "branches per §1.2 with divergent side-effect sets; always decrements plant.held_run_count, re-derives posture and bumps Plant.version"
      - "SCRAP zeroes net_good_msf / available_msf and cancels every non-shipped LoadOrder of the run"
      - "increments ProductionRun.version by 1"

  # ------------------------------------------------------------- maintenance
  - method: POST
    path: "/plant-ops/maintenance-outages"
    description: "Propose an outage window on a line; the housing-seasonality index and opportunity cost are stamped at proposal."
    roles: [MaintenancePlanner]
    code: 201
    input: [line_id, outage_type, window_start, window_end, scope_note]
    output: MaintenanceOutage
    side_effects: ["status = PROPOSED; proposed_by_user_id = X-User-ID; stamps seasonality_index, planned_downtime_hours, at_risk_msf, opportunity_cost_usd"]

  - method: POST
    path: "/plant-ops/maintenance-outages/{outageId}/approve"
    description: "Approve a proposed outage. Segregation of duties applies, the seasonality gate must allow the window, and approval cascades through the line into overlapping runs and their load orders."
    roles: [PlantManager]
    code: 200
    input: []
    output: MaintenanceOutage
    side_effects:
      - "status -> APPROVED; approved_by_user_id = X-User-ID"
      - "line AVAILABLE -> MAINTENANCE_SCHEDULED, then overlapping DRAFT/SCHEDULED runs -> CANCELLED, then their reservations released and their load orders cancelled"
      - "increments BoardLine.version, ProductionRun.version, LoadOrder.version and Plant.version for each affected row"

  - method: POST
    path: "/plant-ops/maintenance-outages/{outageId}/defer"
    description: "Defer a proposed outage (at most twice); the second deferral makes the seasonality gate unconditional."
    roles: [MaintenancePlanner]
    code: 200
    input: [deferred_reason]
    output: MaintenanceOutage
    side_effects: ["status -> DEFERRED; deferral_count += 1; increments MaintenanceOutage.version by 1"]

  - method: POST
    path: "/plant-ops/maintenance-outages/{outageId}/repropose"
    description: "Re-propose a deferred outage on a new window, closing the deferral cycle."
    roles: [MaintenancePlanner]
    code: 200
    input: [window_start, window_end]
    output: MaintenanceOutage
    side_effects: ["status DEFERRED -> PROPOSED; overwrites the window; recomputes seasonality_index, planned_downtime_hours, at_risk_msf, opportunity_cost_usd"]

  - method: POST
    path: "/plant-ops/maintenance-outages/{outageId}/start"
    description: "Begin an approved outage once the clock reaches the window and no run is active on the line."
    roles: [MaintenancePlanner]
    code: 200
    input: []
    output: MaintenanceOutage
    side_effects: ["status -> IN_PROGRESS; line -> UNDER_MAINTENANCE; an EMERGENCY outage freezes the plant posture and bumps Plant.version"]

  - method: POST
    path: "/plant-ops/maintenance-outages/{outageId}/close"
    description: "Close an in-progress outage, returning the line to service."
    roles: [MaintenancePlanner]
    code: 200
    input: [close_note]
    output: MaintenanceOutage
    side_effects: ["status -> CLOSED; line -> AVAILABLE; posture re-derived; increments Plant.version by 1"]

  # ---------------------------------------------------- warehouse and freight
  - method: POST
    path: "/plant-ops/load-orders"
    description: "Stage a load: bundle configuration, trailer weight and quoted freight for the destination market."
    roles: [ProductionScheduler]
    code: 201
    input: [run_id, market_id, bundles_count, boards_per_bundle]
    output: LoadOrder
    side_effects:
      - "runs calculations.bundle_load_metrics then the QUOTED variant of calculations.freight_charge"
      - "status = STAGED; run.available_msf recomputed"

  - method: POST
    path: "/plant-ops/load-orders/{loadOrderId}/load"
    description: "Record the bundles actually loaded onto the trailer and re-derive MSF and weight."
    roles: [ProductionScheduler]
    code: 200
    input: [loaded_bundles_count]
    output: LoadOrder
    side_effects: ["status STAGED -> LOADED; total_msf and trailer_weight_lb recomputed on loaded_bundles_count; run.available_msf recomputed"]

  - method: POST
    path: "/plant-ops/load-orders/{loadOrderId}/ship"
    description: "Ship a loaded trailer once the source run's board is released or downgraded; settles freight against the loaded bundles."
    roles: [PlantManager]
    code: 200
    input: [backhaul]
    output: LoadOrder
    side_effects: ["status LOADED -> SHIPPED; stamps settled_freight_usd, overweight_fee_usd, freight_variance_usd"]

  - method: POST
    path: "/plant-ops/load-orders/{loadOrderId}/cancel"
    description: "Cancel a staged, held or loaded order, returning its MSF to the run."
    roles: [ProductionScheduler]
    code: 200
    input: [cancel_reason]
    output: LoadOrder
    side_effects: ["status -> CANCELLED; run.available_msf increases by total_msf"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the seven declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed for the endpoint in §1.5"
  - id: ERR_PLANT_NOT_FOUND
    http: 404
    condition: "{plantId} does not resolve to a Plant"
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "{lotId} does not resolve to a GypsumLot"
  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: "{batchId} does not resolve to a CalcinerBatch"
  - id: ERR_RUN_NOT_FOUND
    http: 404
    condition: "{runId} does not resolve to a ProductionRun"
  - id: ERR_OUTAGE_NOT_FOUND
    http: 404
    condition: "{outageId} does not resolve to a MaintenanceOutage"
  - id: ERR_LOAD_ORDER_NOT_FOUND
    http: 404
    condition: "{loadOrderId} does not resolve to a LoadOrder"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "a body-supplied foreign key (plant_id, line_id, product_spec_id, calciner_batch_id, lot_id, run_id, market_id) does not resolve"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, out-of-range or non-enum value, odd boards_per_bundle, duplicate Plant.code / sku_code / sample_seq / specimen_seq, fire_rated disagreeing with board_type, scrap_msf > actual_msf, or loaded_bundles_count > bundles_count"
  - id: ERR_PLANT_SCOPE_MISMATCH
    http: 409
    condition: "a referenced lot, line, spec or batch belongs to a different Plant than the operation's plant"
  - id: ERR_STALE_PLANT_VERSION
    http: 412
    condition: "expected_plant_version does not equal Plant.version at schedule time"
  - id: ERR_STALE_LOT_VERSION
    http: 412
    condition: "expected_lot_version does not equal GypsumLot.version at feed time"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested transition is not declared from the resource's current state, or a cross-entity state precondition without a dedicated code fails (batch not COMPLETED at run start, batch stucco FAIL at run start, load HELD, lot already consumed at reject)"
  - id: ERR_LOT_NOT_APPROVED
    http: 409
    condition: "a feed names a lot whose status is not APPROVED"
  - id: ERR_ASSAY_EXPIRED
    http: 409
    condition: "the logical clock is more than 30 days after the lot's assayed_at at feed time"
  - id: ERR_MAX_ASSAYS_REACHED
    http: 409
    condition: "a fourth assay is attempted on a lot"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the outage approver equals the proposer, or the disposition actor equals the inspector who recorded the run's most recent FAIL specimen"
  - id: ERR_PLANT_POSTURE_FROZEN
    http: 409
    condition: "a run schedule or start is attempted while production_posture == FROZEN"
  - id: ERR_POSTURE_RESTRICTED_FIRE_RATED
    http: 409
    condition: "a fire-rated SKU is scheduled while production_posture == RESTRICTED"
  - id: ERR_FIRE_RATED_STUCCO_NONCONFORMING
    http: 422
    condition: "a fire-rated SKU is scheduled against a batch whose stucco_quality_flag is not PASS"
  - id: ERR_INVALID_WINDOW
    http: 400
    condition: "window_end is not strictly after window_start"
  - id: ERR_RUN_WINDOW_NOT_STARTED
    http: 409
    condition: "run start is attempted before the logical clock reaches window_start"
  - id: ERR_OUTAGE_WINDOW_NOT_STARTED
    http: 409
    condition: "outage start is attempted before the logical clock reaches window_start"
  - id: ERR_OUTAGE_WINDOW_CONFLICT
    http: 409
    condition: "a run window intersects an APPROVED or IN_PROGRESS outage window on the same line under closed-interval semantics, or two such outages intersect"
  - id: ERR_LINE_WINDOW_CONFLICT
    http: 409
    condition: "a run's half-open window overlaps another SCHEDULED or RUNNING run on the same line"
  - id: ERR_CHANGEOVER_BUFFER_VIOLATION
    http: 409
    condition: "gap_minutes to the prior run is smaller than the required changeover_minutes"
  - id: ERR_SEASONALITY_WINDOW_UNFAVORABLE
    http: 409
    condition: "a non-emergency outage with fewer than two deferrals is approved for a month whose housing seasonality index exceeds 0.90"
  - id: ERR_MAX_DEFERRALS_REACHED
    http: 409
    condition: "a third deferral is attempted on an outage"
  - id: ERR_LINE_NOT_AVAILABLE
    http: 409
    condition: "the line's status is not AVAILABLE when starting a run or approving an outage"
  - id: ERR_RUN_ACTIVE_ON_LINE
    http: 409
    condition: "an outage start is attempted while a run on the line is RUNNING"
  - id: ERR_LINE_SPEED_EXCEEDS_SPEC
    http: 422
    condition: "line_speed_fpm exceeds the line's mechanical ceiling or the SKU's line_speed_max_fpm"
  - id: ERR_PAPER_TENSION_OUT_OF_RANGE
    http: 422
    condition: "paper_tension_lb is below the speed-scaled requirement or above the SKU ceiling"
  - id: ERR_KILN_PROFILE_INFEASIBLE
    http: 422
    condition: "the chosen dwell and slurry water project an exit moisture above the target plus 0.10"
  - id: ERR_WINDOW_TOO_SHORT_FOR_CHANGEOVER
    http: 422
    condition: "capacity_msf computes to 0.000 or less once the cold-start changeover is absorbed"
  - id: ERR_BUNDLE_CONFIG_INVALID
    http: 422
    condition: "boards_per_bundle is odd, below 2, or above the SKU's max_boards_per_bundle"
  - id: ERR_TRAILER_WEIGHT_EXCEEDED
    http: 422
    condition: "trailer_weight_lb exceeds 48000 lb at staging or at load"
  - id: ERR_NO_BOARD_TEST_SPECIMENS
    http: 422
    condition: "a run quality evaluation is requested with zero recorded specimens"
  - id: ERR_INSUFFICIENT_SPECIMENS
    http: 422
    condition: "a run quality evaluation is requested with one or two recorded specimens"
  - id: ERR_RETEST_REQUIRED
    http: 409
    condition: "a RELEASE disposition is requested on a held run whose retest_count is 0"
  - id: ERR_RUN_QUALITY_NOT_RELEASED
    http: 409
    condition: "a load is shipped while the source run's quality_state is not RELEASED or DOWNGRADED"
  - id: ERR_CALCINER_CAPACITY_EXCEEDED
    http: 409
    condition: "the aggregate feed rate over an overlapping sub-interval exceeds plant.calciner_capacity_tph"
  - id: ERR_SILO_CAPACITY_EXCEEDED
    http: 409
    condition: "crediting a batch's actual yield would push stucco_on_hand_tons above the silo capacity"
  - id: ERR_LOT_TONS_INSUFFICIENT
    http: 409
    condition: "tons_fed exceeds the lot's remaining_tons"
  - id: ERR_STUCCO_INSUFFICIENT
    http: 409
    condition: "the run's stucco_reserved_tons exceeds plant.stucco_available_tons"
  - id: ERR_RUN_MSF_INSUFFICIENT
    http: 409
    condition: "a load order's total_msf exceeds the run's available_msf"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlantAdmin
    description: "Configures plants, lines, SKUs and markets; drives the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /plant-ops/plants"
      - "POST /plant-ops/plants/{plantId}/board-lines"
      - "POST /plant-ops/plants/{plantId}/product-specs"
      - "POST /plant-ops/markets"
      - "POST /plant-ops/_clock/set_current_utc"
    shared_operations: ["every GET endpoint"]

  - name: MaterialsController
    description: "Receives and assays gypsum lots, plans calciner batches and feeds them."
    identity: opaque
    exclusive_operations:
      - "POST /plant-ops/gypsum-lots"
      - "POST /plant-ops/gypsum-lots/{lotId}/assay"
      - "POST /plant-ops/gypsum-lots/{lotId}/reject"
      - "POST /plant-ops/calciner-batches"
      - "POST /plant-ops/calciner-batches/{batchId}/feeds"
      - "POST /plant-ops/calciner-batches/{batchId}/close-feed"
      - "POST /plant-ops/calciner-batches/{batchId}/abort"
    shared_operations: ["every GET endpoint"]

  - name: ProductionScheduler
    description: "Drafts, schedules, starts and completes board runs and stages/loads freight."
    identity: opaque
    exclusive_operations:
      - "POST /plant-ops/production-runs"
      - "POST /plant-ops/production-runs/{runId}/schedule"
      - "POST /plant-ops/production-runs/{runId}/start"
      - "POST /plant-ops/production-runs/{runId}/complete"
      - "POST /plant-ops/load-orders"
      - "POST /plant-ops/load-orders/{loadOrderId}/load"
      - "POST /plant-ops/load-orders/{loadOrderId}/cancel"
    shared_operations:
      - "POST /plant-ops/production-runs/{runId}/cancel (shared with PlantManager)"
      - "every GET endpoint"

  - name: QualityInspector
    description: "Records stucco samples and board specimens and runs the quality evaluation. May never disposition a hold arising from a specimen it recorded."
    identity: opaque
    exclusive_operations:
      - "POST /plant-ops/calciner-batches/{batchId}/stucco-tests"
      - "POST /plant-ops/production-runs/{runId}/board-tests"
      - "POST /plant-ops/production-runs/{runId}/quality-evaluation"
    shared_operations: ["every GET endpoint"]

  - name: QualityManager
    description: "Dispositions held runs (release, downgrade, scrap) under segregation of duties."
    identity: opaque
    exclusive_operations:
      - "POST /plant-ops/production-runs/{runId}/quality-disposition"
    shared_operations: ["every GET endpoint"]

  - name: MaintenancePlanner
    description: "Proposes, defers, re-proposes, starts and closes outages; never approves them."
    identity: opaque
    exclusive_operations:
      - "POST /plant-ops/maintenance-outages"
      - "POST /plant-ops/maintenance-outages/{outageId}/defer"
      - "POST /plant-ops/maintenance-outages/{outageId}/repropose"
      - "POST /plant-ops/maintenance-outages/{outageId}/start"
      - "POST /plant-ops/maintenance-outages/{outageId}/close"
    shared_operations: ["every GET endpoint"]

  - name: PlantManager
    description: "Approves outages (never one it proposed) and releases freight to ship."
    identity: opaque
    exclusive_operations:
      - "POST /plant-ops/maintenance-outages/{outageId}/approve"
      - "POST /plant-ops/load-orders/{loadOrderId}/ship"
    shared_operations:
      - "POST /plant-ops/production-runs/{runId}/cancel (shared with ProductionScheduler)"
      - "every GET endpoint"
