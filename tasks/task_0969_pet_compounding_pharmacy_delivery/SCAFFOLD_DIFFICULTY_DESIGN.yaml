            - { call: "POST /prescriptions", payload: { pet_id: "${pet}", owner_id: "${own}", veterinarian_id: "${vet}", formula_id: "${frm}", quantity: 5, days_supply: 5, refills_authorized: 0, directions: "QD", written_date: "2026-05-01" }, as: PharmacyTech, captures: { rxA: $.data.id } }
            - { call: "POST /prescriptions/${rxA}/submit-verification", payload: {}, as: PharmacyTech }
            - { call: "POST /prescriptions/${rxA}/vet-confirm", payload: {}, as: Veterinarian, as_user_id: "${vet}", captures: { rxvA: $.data.version } }
            - { call: "POST /prescriptions", payload: { pet_id: "${pet}", owner_id: "${own}", veterinarian_id: "${vet}", formula_id: "${frm}", quantity: 5, days_supply: 5, refills_authorized: 0, directions: "QD", written_date: "2026-05-01" }, as: PharmacyTech, captures: { rxB: $.data.id } }
            - { call: "POST /prescriptions/${rxB}/submit-verification", payload: {}, as: PharmacyTech }
            - { call: "POST /prescriptions/${rxB}/vet-confirm", payload: {}, as: Veterinarian, as_user_id: "${vet}", captures: { rxvB: $.data.version } }
            - { call: "POST /prescriptions", payload: { pet_id: "${pet}", owner_id: "${own}", veterinarian_id: "${vet}", formula_id: "${frm}", quantity: 5, days_supply: 5, refills_authorized: 0, directions: "QD", written_date: "2026-05-01" }, as: PharmacyTech, captures: { rxC: $.data.id } }
