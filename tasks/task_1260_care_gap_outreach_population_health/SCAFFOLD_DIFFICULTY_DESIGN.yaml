              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/members"
              payload: { mrn: "M2", date_of_birth: "1961-01-01T00:00:00Z", risk_tier: "LOW" }
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/members"
              payload: { mrn: "M3", date_of_birth: "1962-01-01T00:00:00Z", risk_tier: "LOW" }
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/registry-panels"
              payload: { cohort_id: "${coh_id}", measure_id: "${meas_id}", panel_manager_id: "pm_1" }
              as: ProgramAdministrator
              captures: { panel_id: $.data.id }
            - call: "POST /population-health/registry-panels/${panel_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /population-health/registry-panels/${panel_id}/care-gaps"
              payload: {}
              as: ProgramAdministrator
              captures: { g1: $.data.0.id, g2: $.data.1.id, g3: $.data.2.id }
            - call: "POST /population-health/care-gaps/${g1}/appointments"
              payload: { provider_id: "prov_A", slot_start_at: "2026-06-01T14:00:00Z", slot_end_at: "2026-06-01T15:00:00Z", provider_capacity_per_slot: 2 }
              as: PanelManager
              as_user_id: "pm_1"
            - call: "POST /population-health/care-gaps/${g2}/appointments"
              payload: { provider_id: "prov_A", slot_start_at: "2026-06-01T14:00:00Z", slot_end_at: "2026-06-01T15:00:00Z", provider_capacity_per_slot: 2 }
              as: PanelManager
              as_user_id: "pm_1"
          trigger:
            - call: "POST /population-health/care-gaps/${g3}/appointments"
              payload: { provider_id: "prov_A", slot_start_at: "2026-06-01T14:00:00Z", slot_end_at: "2026-06-01T15:00:00Z" }
              as: PanelManager
              as_user_id: "pm_1"
              captures: { err: $.data.error_id }
