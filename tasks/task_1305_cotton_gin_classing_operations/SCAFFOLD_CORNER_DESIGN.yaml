        claim_type: correct_result
        grounds: [entities.WarehouseReceipt.fields.storage_start_date]
        distinguishing_aspect: "without any set_current_utc call the logical clock is pinned at 2026-08-01T00:00:00Z: a receipt issued immediately has storage_start_date 2026-08-01T00:00:00Z, independent of wall-clock time."
