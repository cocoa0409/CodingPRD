            - "${p4_status} == PRODUCING — the second identical start-production on the same from-state now succeeds"
            - "GroundControlInspection.${insp4_id}.caused_suspension == true"
            - "${r4_status} == SCHEDULED and ProductionRun.${r4_id}.held_reason is null — the HELD -> SCHEDULED loop-back passed the re-run capacity check because 500.0000 t/h is below the derated 550.00 t/h"
            - "Mine.${m4_id}.hoist_state == HOIST_DERATED and Mine.${m4_id}.effective_hoist_tons_per_day == 13200.00 — remediating and re-entering the panel does NOT undo the mine's derate"
            - "Mine.${m4_id}.producing_panel_count == 2 — it fell to 1 on the suspension and rose back to 2 when P-1 re-entered PRODUCING"
            - "Panel.${p4b_id}.status == PRODUCING throughout and Panel.${p4b_id}.open_defect == false — the cycle touched only P-1"

      - name: treatment_batch_pending_self_loop_bounded_at_two_reworks
        grounds:
          - state_machines.TreatmentBatch.PENDING_to_PENDING
          - state_machines.TreatmentBatch.PENDING_to_PASSED
          - calculations.treatment_yield_and_purity
          - validations[priority=17]
          - entities.TreatmentBatch.fields.rework_count
          - entities.TreatmentBatch.fields.yield_tons
        distinguishing_aspect: |
          A SELF-LOOP with a hard loop bound: qc-decision REWORK returns the batch to its own state
          PENDING while decaying yield_tons by 0.97 per pass (5527.20 -> 5361.38 -> 5200.54) and
          freezing purity, and the third REWORK is refused with ERR_REWORK_LIMIT_EXCEEDED rather than
          moving the batch anywhere.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T00:00:00Z."
            - "Mine Retsof, panel P-1 (grade 95.0) PRODUCING, one run hoisted with 6000 t, Depot A (NY, OPEN, covered 40000)."
            - "One PENDING HIGHWAY_DEICING COARSE batch: input 6000 t, moisture 2.0 pct, yield_tons 5527.20, purity_pct_nacl 95.500, rework_count 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: MinePlanner
            - call: "POST /salt/mines"
              payload: { name: "Retsof", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { m5_id: $.data.id }
            - call: "POST /salt/panels"
              payload: { mine_id: "${m5_id}", panel_code: "P-1", gross_tons_in_place: 1000000, extraction_ratio_pct: 60, grade_pct_nacl: 95.0, insolubles_pct: 5.0, pillar_recovery_allowed: true }
              as: MinePlanner
              captures: { p5_id: $.data.id }
            - call: "POST /salt/panels/${p5_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${p5_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${m5_id}"
              payload: {}
              as: MinePlanner
              captures: { m5_v: $.data.version }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${m5_id}", panel_id: "${p5_id}", planned_tons: 6000, hoist_window_start: "2026-08-11T00:00:00Z", hoist_window_end: "2026-08-11T06:00:00Z", expected_mine_version: "${m5_v}" }
              as: MinePlanner
              captures: { r5_id: $.data.id }
            - call: "POST /salt/production-runs/${r5_id}/hoist"
              payload: { hoisted_tons: 6000 }
              as: MinePlanner
            - call: "POST /salt/depots"
              payload: { name: "Depot A", state_code: "NY", covered_capacity_tons: 40000, open_pad_capacity_tons: 20000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 4.00 }
              as: LogisticsPlanner
              captures: { d5a: $.data.id }
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${r5_id}", depot_id: "${d5a}", product_line: "HIGHWAY_DEICING", screen_spec: "COARSE", anticaking_ppm: 30, corrosion_inhibitor_pct: 0.5, input_tons: 6000, moisture_pct: 2.0, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "lab-tech-1"
              captures: { b5_id: $.data.id, b5_yield0: $.data.yield_tons, b5_purity: $.data.purity_pct_nacl }
          trigger:
            - call: "POST /salt/treatment-batches/${b5_id}/qc-decision"
              payload: { decision: "REWORK", note: "clumping, re-screen" }
              as: QualityLab
              as_user_id: "lab-lead-2"
              captures: { b5_yield1: $.data.yield_tons, b5_state1: $.data.qc_state }
            - call: "POST /salt/treatment-batches/${b5_id}/qc-decision"
              payload: { decision: "REWORK", note: "still clumping" }
              as: QualityLab
              as_user_id: "lab-lead-2"
              captures: { b5_yield2: $.data.yield_tons, b5_rework2: $.data.rework_count }
            - call: "POST /salt/treatment-batches/${b5_id}/qc-decision"
              payload: { decision: "REWORK", note: "third attempt" }
              as: QualityLab
              as_user_id: "lab-lead-2"
              captures: { b5_err: $.data.error_id }
            - call: "POST /salt/treatment-batches/${b5_id}/qc-decision"
              payload: { decision: "PASS" }
              as: QualityLab
              as_user_id: "lab-lead-2"
              captures: { b5_final: $.data.qc_state }
          assert:
            - "${b5_yield0} == 5527.20 and ${b5_purity} == 95.500"
            - "${b5_state1} == PENDING — the REWORK decision is a self-loop, not a move to a distinct state"
            - "${b5_yield1} == 5361.38 (5527.20 recomputed with one 0.97 rework loss factor)"
            - "${b5_yield2} == 5200.54 and ${b5_rework2} == 2"
            - "${b5_err} == ERR_REWORK_LIMIT_EXCEEDED with HTTP 409, and TreatmentBatch.${b5_id}.rework_count is still 2 (the refused loop iteration leaves no trace)"
            - "${b5_final} == PASSED and TreatmentBatch.${b5_id}.purity_pct_nacl == 95.500 — purity was frozen at create and never re-derived by the reworks"
            - "GET /salt/stockpile-lots?treatment_batch_id=${b5_id} returns exactly 1 row with tons_on_hand == 5200.54 — the lot is minted from the DECAYED yield"

  - rule_id: transitive_cascade
    instances:
      - name: defect_inspection_cascades_panel_mine_run_and_open_tonnage
        grounds:
          - state_machines.Panel.PRODUCING_to_SUSPENDED
          - state_machines.Mine.hoist_state.HOIST_AVAILABLE_to_HOIST_DERATED
          - state_machines.ProductionRun.SCHEDULED_to_HELD
          - calculations.mine_effective_hoist_capacity
          - entities.Mine.fields.scheduled_hoist_tons_open
          - entities.Mine.fields.producing_panel_count
          - entities.GroundControlInspection.fields.caused_suspension
        distinguishing_aspect: |
          A four-hop STATE cascade across four entity types from one write: inspection (DEFECT) ->
          Panel PRODUCING->SUSPENDED -> Mine hoist_state HOIST_AVAILABLE->HOIST_DERATED with
          effective_hoist_tons_per_day recomputed 24000.00->13200.00 -> the panel's SCHEDULED run
          ->HELD -> Mine.scheduled_hoist_tons_open recomputed to 0.00.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T00:00:00Z."
            - "Mine Retsof (NY, rated 24000 t/day) HOIST_AVAILABLE + COMPLIANT, effective 24000.00 t/day, with TWO PRODUCING panels P-1 and P-2 so the cascade lands on HOIST_DERATED rather than HOIST_DOWN."
            - "Panel P-1 PRODUCING with recoverable_tons 617600.00; one SCHEDULED run of 6000 t on P-1 over a 6 h window (1000.0000 t/h, exactly the mine's hourly capacity), so Mine.scheduled_hoist_tons_open == 6000.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: MinePlanner
            - call: "POST /salt/mines"
              payload: { name: "Retsof", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { m6_id: $.data.id }
            - call: "POST /salt/panels"
              payload: { mine_id: "${m6_id}", panel_code: "P-1", gross_tons_in_place: 1000000, extraction_ratio_pct: 60, grade_pct_nacl: 95.0, insolubles_pct: 5.0, pillar_recovery_allowed: true }
              as: MinePlanner
              captures: { p6_id: $.data.id }
            - call: "POST /salt/panels/${p6_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${p6_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels"
              payload: { mine_id: "${m6_id}", panel_code: "P-2", gross_tons_in_place: 1000000, extraction_ratio_pct: 60, grade_pct_nacl: 95.0, insolubles_pct: 5.0, pillar_recovery_allowed: true }
              as: MinePlanner
              captures: { p6b_id: $.data.id }
            - call: "POST /salt/panels/${p6b_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${p6b_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${m6_id}"
              payload: {}
              as: MinePlanner
              captures: { m6_v: $.data.version, m6_open_before: $.data.scheduled_hoist_tons_open }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${m6_id}", panel_id: "${p6_id}", planned_tons: 6000, hoist_window_start: "2026-08-11T00:00:00Z", hoist_window_end: "2026-08-11T06:00:00Z", expected_mine_version: "${m6_v}" }
              as: MinePlanner
              captures: { r6_id: $.data.id, r6_rate: $.data.planned_tons_per_hour }
          trigger:
            - call: "POST /salt/ground-control-inspections"
              payload: { panel_id: "${p6_id}", roof_span_ft: 44.0, convergence_rate_in_per_day: 0.51, finding: "DEFECT" }
              as: GroundControlEngineer
              as_user_id: "gc-eng-1"
              captures: { insp6_id: $.data.id }
          assert:
            - "${r6_rate} == 1000.0000 and the run was accepted at exactly the mine's hourly capacity"
            - "hop 1 — Panel.${p6_id}.status == SUSPENDED, Panel.${p6_id}.open_defect == true, Panel.${p6_id}.ground_control_defect_count == 1"
            - "hop 2 — Mine.${m6_id}.hoist_state == HOIST_DERATED and Mine.${m6_id}.effective_hoist_tons_per_day == 13200.00 (24000 x 0.55 x 1.00)"
            - "hop 3 — ProductionRun.${r6_id}.status == HELD with held_reason == GROUND_CONTROL"
            - "hop 4 — Mine.${m6_id}.scheduled_hoist_tons_open == 0.00 (was 6000.00) and Mine.${m6_id}.producing_panel_count == 1 (P-2 survives, which is why hop 2 chose HOIST_DERATED over HOIST_DOWN)"
            - "GroundControlInspection.${insp6_id}.caused_suspension == true and the record has no version field"
            - "Mine.${m6_id}.compliance_state == COMPLIANT — the cascade moved only the hoist dimension"

      - name: shortfall_cascades_order_penalty_into_contract_ledger_and_breach_watch
        grounds:
          - state_machines.DeliveryOrder.REQUESTED_to_SHORTED
          - calculations.shortfall_penalty
          - calculations.contract_fulfillment_ledger
          - calculations.supply_reliability_score
          - entities.BidContract.fields.penalty_accrued_usd
          - entities.BidContract.fields.breach_watch
          - entities.DeliveryOrder.fields.penalty_state
        distinguishing_aspect: |
          A three-hop MONETARY cascade on a different entity chain: one allocate that shorts writes
          the order's own penalty (20565.00, the 15 pct order cap binding over the raw 24200.00), then
          re-derives the contract's penalty_accrued_usd and supply_reliability_score (78.00), then
          flips the derived boolean breach_watch because 20565.00 crosses 5 pct of the 342750.00
          contract value.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T00:00:00Z."
            - "Depot A (NY, OPEN) holds one 900.00 t HIGHWAY_DEICING lot; Depot B (NY) holds a 5527.20 t lot but is posted SURGE, so it counts for pre-season coverage yet is invisible to a ROUTINE waterfall."
            - "ACTIVE contract: committed 5000 t at 68.55/t (contract_value_usd 342750.00), min_take 80, max_take 110, penalty 22.00/t, cap 10 pct, penalty_accrued_usd 0.00, supply_reliability_score 100, breach_watch false."
            - "One REQUESTED ROUTINE delivery order at Depot A for 2000 t."
