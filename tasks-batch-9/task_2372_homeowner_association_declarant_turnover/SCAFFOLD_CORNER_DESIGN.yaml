      - name: withdrawn_claim_is_terminal_and_rejects_every_further_action
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.DefectClaim.INVESTIGATING_to_WITHDRAWN
          - errors.ERR_CLAIM_STATE_INVALID
          - entities.DefectClaim.fields.reserved_amount_cents
        distinguishing_aspect: "WITHDRAWN is terminal, so NOTICE, RESERVE, WITHDRAW again and REJECT all return ERR_CLAIM_STATE_INVALID (409) from it. Because the claim was withdrawn straight from INVESTIGATING, reserved_amount_cents was already 0 and the withdrawal performs no fiscal release — reserve_claim_committed_cents stays 0 rather than going negative."
        test_recipe:
          setup:
            - "Association 'Bracken Hollow' with reserve_claim_pool_cents 500000."
            - "One CONVEYED CommonAreaComponent, substantial_completion_date 2024-01-01T00:00:00Z, so the repose deadline 2032-01-01T00:00:00Z is far in the future."
            - "One DefectClaim withdrawn directly from INVESTIGATING."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Bracken Hollow", total_planned_lots: 6, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 0, reserve_claim_pool_cents: 500000, declarant_monthly_subsidy_cents: 0 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/components"
