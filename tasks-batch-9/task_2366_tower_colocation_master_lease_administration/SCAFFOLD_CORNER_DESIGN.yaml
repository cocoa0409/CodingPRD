              as: PortfolioAdmin
              captures: { xp_mla_id: $.data.id }
            - call: "POST /tower-colo/master-lease-agreements/${xp_mla_id}/activate"
              payload: {}
              as: PortfolioAdmin
            - call: "POST /tower-colo/colocation-applications"
              payload: { tower_id: "${xp_t_id}", master_lease_agreement_id: "${xp_mla_id}", requested_elevation_bottom_ft: 100, requested_elevation_top_ft: 140, requested_ground_space_sqft: 300, expedited_requested: true }
              as: Tenant
              as_user_id: "${xp_ten_id}"
              captures: { xp_app_id: $.data.id }
            - call: "POST /tower-colo/colocation-applications/${xp_app_id}/equipment-lines"
              payload: { equipment_type: "ANTENNA", model_code: "XP-100", quantity: 5, unit_weight_lbs: 100, wind_area_sqft: 0, mount_elevation_ft: 80 }
              as: Tenant
              as_user_id: "${xp_ten_id}"
          trigger:
            - call: "POST /tower-colo/colocation-applications/${xp_app_id}/submit"
              payload: {}
              as: Tenant
              as_user_id: "${xp_ten_id}"
          assert:
            - "response.status == 200"
            - "response.data.status == UNDER_STRUCTURAL_REVIEW"
            - "response.data.expedited_requested == true"
            - "response.data.review_deadline_at == 2026-08-16T00:00:00Z"
            - "response.data.sla_breached == false"

      - name: second_submit_on_reviewing_application_rejected
        claim_type: idempotency
        grounds:
          - state_machines.ColocationApplication.transitions.DRAFT_to_SUBMITTED
          - validations.priority_10
          - errors.ERR_INVALID_APPLICATION_STATE
        distinguishing_aspect: |
          Submitting twice is not idempotent: the second call from UNDER_STRUCTURAL_REVIEW returns
          409 ERR_INVALID_APPLICATION_STATE, revision_count stays 0 and Tower.open_review_count
          stays 1 — the review entry is not re-stamped and no second deadline is issued.
        test_recipe:
          setup:
            - "The submit_moves_draft_application_into_structural_review fixture, already submitted once: application in UNDER_STRUCTURAL_REVIEW with review_deadline_at 2026-09-15T00:00:00Z."
          setup_api_calls:
