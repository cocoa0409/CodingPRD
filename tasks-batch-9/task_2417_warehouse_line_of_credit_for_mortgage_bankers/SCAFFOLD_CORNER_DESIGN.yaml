      - name: corner_val_cure_payment_overpayment_rejected_then_exact_cure
        claim_type: violation_to_error
        grounds:
          - validations[priority=32]
          - errors.ERR_CURE_PAYMENT_EXCEEDS_OBLIGATION
          - calculations.cure_payment_waterfall
        distinguishing_aspect: |
          The obligation ceiling is the SUM of both waterfall buckets — accrued fees plus
          the call's uncured remainder — so a payment one cent over 202,016,667 is refused
          while 202,016,667 exactly is accepted and fully cures. An implementation that
          caps against only the call amount would wrongly reject anything above
          196,000,000.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility; A1 DRY CONFORMING funded to 1,960,000,000 at 2026-08-01."
            - "Aging-run at 2026-08-11 accrues 6,016,667 of fees; dwell is 10 days so nothing ages and no call is raised."
            - "One manual facility-level MarginCall of 196,000,000 moves the facility to RESTRICTED."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_dry_2b
            - *c_receipt_clear_a1
            - *c_wire_a1
            - *c_verify_w1
            - *c_fund_a1
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /facilities/${fac_id}/aging-run"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { ov_fee: "$.data.fee_accrual_cents" }
            - call: "POST /margin-calls"
              payload: { facility_id: "${fac_id}", trigger_reason: "COVENANT_BREACH" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { ov_mc_id: "$.data.id", ov_mc_amt: "$.data.call_amount_cents", ov_mc_ver: "$.data.version" }
          trigger:
            - call: "POST /margin-calls/${ov_mc_id}/cure-payments"
              payload: { amount_cents: 202016668, expected_margin_call_version: "${ov_mc_ver}" }
              as: Borrower
              as_user_id: "${fac_id}"
            - call: "POST /margin-calls/${ov_mc_id}/cure-payments"
              payload: { amount_cents: 202016667, expected_margin_call_version: "${ov_mc_ver}" }
              as: Borrower
              as_user_id: "${fac_id}"
              captures: { ov_cp_id: "$.data.id" }
          assert:
            - "setup: ov_fee == 6016667 = 4763889 (A1 interest spread) + 1252778 (unused line fee) and ov_mc_amt == 196000000 = floor(1960000000 * 0.10)"
            - "setup: dwell is 10 days so Advance.${a1_id}.is_aged == false and the aging-run raised no margin call of its own — GET /facilities/${fac_id}/margin-calls has total_count == 1"
            - "the 202016668 payment returns HTTP 422 with data.error_id == ERR_CURE_PAYMENT_EXCEEDS_OBLIGATION — the ceiling is 6016667 + (196000000 - 0)"
            - "the rejected payment left MarginCall.${ov_mc_id}.version == ov_mc_ver, which is why the second call may reuse the same token"
            - "WarehouseFacility.${fac_id}.accrued_fee_balance_cents is still 6016667 after the rejection — no partial application"
            - "the 202016667 payment returns HTTP 201 with CurePayment.${ov_cp_id}.applied_to_fees_cents == 6016667 and applied_to_principal_cents == 196000000"
            - "CurePayment.${ov_cp_id}.principal_allocation has exactly 1 element: {${a1_id}: 196000000}"
            - "MarginCall.${ov_mc_id}.cured_amount_cents == 196000000 == call_amount_cents, so status == CURED"
            - "WarehouseFacility.${fac_id}.status returns to ACTIVE and open_margin_call_count == 0 — the last open call closing lifts the restriction"
            - "WarehouseFacility.${fac_id}.accrued_fee_balance_cents == 0, outstanding_principal_cents == 1764000000, availability_cents == 18236000000"
            - "Advance.${a1_id}.outstanding_balance_cents == 1764000000; ledger principal debits total 1960000000 and principal credits total 196000000"

      - name: corner_val_repurchase_must_match_outstanding_to_the_cent
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=34]
          - errors.ERR_REPURCHASE_AMOUNT_MISMATCH
          - state_machines.Advance.funding_status.FUNDED_to_REPURCHASED
        distinguishing_aspect: |
          Equality, not sufficiency: 1,959,999,999 is refused and 1,960,000,001 would be
          refused too, while 1,960,000,000 passes. The rejected attempt must leave zero
          trace — no ledger entry, funding_status still FUNDED, version unchanged — which is
          what makes the ledger conservation invariant exactly checkable.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility; A1 DRY CONFORMING funded to exactly 1,960,000,000, never shipped."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_dry_2b
            - *c_receipt_clear_a1
            - *c_wire_a1
            - *c_verify_w1
            - *c_fund_a1
            - *c_adv_v1
          trigger:
            - call: "POST /advances/${a1_id}/repurchase"
              payload: { payment_amount_cents: 1959999999 }
              as: Borrower
              as_user_id: "${fac_id}"
            - call: "POST /advances/${a1_id}/repurchase"
              payload: { payment_amount_cents: 1960000001 }
              as: Borrower
              as_user_id: "${fac_id}"
            - call: "GET /advances/${a1_id}/ledger-entries"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /advances/${a1_id}/repurchase"
              payload: { payment_amount_cents: 1960000000 }
              as: Borrower
              as_user_id: "${fac_id}"
          assert:
            - "the 1959999999 attempt returns HTTP 422 with data.error_id == ERR_REPURCHASE_AMOUNT_MISMATCH — one cent short is not a partial repurchase"
            - "the 1960000001 attempt returns the same 422 ERR_REPURCHASE_AMOUNT_MISMATCH — overpayment is refused symmetrically, not credited"
            - "after both rejections GET /advances/${a1_id}/ledger-entries has total_count == 1 (only the ADVANCE_FUNDED DEBIT 1960000000) and Advance.${a1_id}.version == adv_v1"
            - "Advance.${a1_id}.funding_status is still FUNDED and custody_status is still RECEIVED_CLEAR"
            - "the 1960000000 attempt returns HTTP 200 with funding_status == REPURCHASED and outstanding_balance_cents == 0"
            - "a REPURCHASE CREDIT of 1960000000 is appended, so the advance ledger holds 2 entries and debits equal credits"
            - "WarehouseFacility.${fac_id}.outstanding_principal_cents == 0 and availability_cents == 20000000000"
            - "InvestorCommitment.${comm_a_id}.allocated_amount_cents == 0, remaining_amount_cents == 5000000000, status == OPEN — the allocation is released, not settled"
            - "InvestorCommitment.${comm_a_id}.settled_amount_cents == 0 — a repurchase is not an investor purchase"
            - "TakeoutInvestor.${inv_a_id}.exposure_cents == 0"

      - name: corner_val_bailee_letter_must_be_live_not_merely_issued
        claim_type: temporal_validation
        grounds:
          - validations[priority=23]
          - errors.ERR_BAILEE_LETTER_REQUIRED
          - endpoints["POST /advances/{id}/purchase"]
        distinguishing_aspect: |
          Priority 23 has a temporal half of its own: the letter must be ISSUED *and* have
          expires_at strictly after the logical clock. A1's letter is still ISSUED in the
          database at 2026-09-05 — nothing has run to expire it — yet its expires_at of
          2026-08-31 is in the past, so the purchase must fail. A2, shipped the same day,
          purchases successfully. An implementation that checks only status passes both.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility; A1 DRY CONFORMING funded 1,960,000,000 and shipped at 2026-08-01, so its BaileeLetter runs 2026-08-01 to 2026-08-31."
            - "Clock advanced to 2026-09-05 with no aging-run, so A1's letter is still stored as ISSUED."
            - "A2 DRY CONFORMING loan 1,000,000,000 created, receipted, verified, funded and shipped at 2026-09-05, so its letter runs to 2026-10-05."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_dry_2b
            - *c_receipt_clear_a1
            - *c_wire_a1
            - *c_verify_w1
            - *c_fund_a1
            - *c_ship_a1
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: CreditOfficer
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_v_b2: "$.data.version" }
            - call: "POST /advances"
              payload:
                facility_id: "${fac_id}"
                custodian_id: "${cust_id}"
                investor_commitment_id: "${comm_a_id}"
                product_code: "CONFORMING"
                loan_amount_cents: 1000000000
                note_rate: 0.0625
                funding_type: "DRY"
                payee_name: "Summit Title & Escrow"
                payee_account_last4: "4417"
                payee_routing_last4: "0021"
                expected_facility_version: "${fac_v_b2}"
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { ab2_id: "$.data.id" }
            - call: "POST /advances/${ab2_id}/receipts"
              payload: { custodian_id: "${cust_id}", document_types: ["NOTE", "MORTGAGE", "ASSIGNMENT", "TITLE_POLICY"] }
              as: Custodian
              as_user_id: "${cust_id}"
            - call: "GET /advances/${ab2_id}/wire-instructions"
              payload: {}
              as: WireOperator
              as_user_id: "wo_1"
              captures: { wb2_id: "$.data[0].id" }
            - call: "POST /wire-instructions/${wb2_id}/decision"
              payload: { decision: "VERIFY", callback_reference: "CB-999" }
              as: WireOperator
              as_user_id: "wo_1"
            - call: "POST /advances/${ab2_id}/fund"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "POST /advances/${ab2_id}/ship"
              payload: { investor_id: "${inv_a_id}" }
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { bl2_id: "$.data.id" }
          trigger:
            - call: "POST /advances/${a1_id}/purchase"
              payload: { proceeds_reference: "WIRE-IN-7781" }
              as: CollateralAnalyst
