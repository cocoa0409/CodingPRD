# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing or unknown role/user headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "role not permitted for endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path resource missing" }
  - { id: ERR_REFERENCED_NOT_FOUND, http: 422, condition: "body FK references missing resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field or malformed value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "resource not in a state permitting the transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match current version (OCC)" }
  - { id: ERR_LOT_LIMIT_EXCEEDED, http: 422, condition: "lab limits breached on release" }
  - { id: ERR_SUPPORT_STOCK_BARRED, http: 422, condition: "capped line would draw support-stock PCR" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "slot/day minute capacity exceeded" }
  - { id: ERR_LINE_OCCUPIED, http: 409, condition: "another run RUNNING on the same line slot" }
  - { id: ERR_RESIN_SHORTFALL, http: 409, condition: "resin_store below recipe draw" }
  - { id: ERR_FORMULA_UNBALANCED, http: 422, condition: "weight fractions do not sum to 10000 bp" }
  - { id: ERR_REVISION_COLLISION, http: 422, condition: "revision content hash duplicates a prior revision" }
  - { id: ERR_FORMULATION_IN_USE, http: 409, condition: "ACTIVE product line still references the formulation" }
  - { id: ERR_LINE_HAS_OPEN_ORDERS, http: 409, condition: "discontinue blocked by REQUESTED/CONFIRMED orders" }
  - { id: ERR_LINE_HAS_OPEN_CLAIMS, http: 409, condition: "sunset blocked by open claims" }
  - { id: ERR_LINE_STOCK_REMAINS, http: 409, condition: "sunset blocked by remaining finished goods" }
  - { id: ERR_LINE_SUPPORT_ONLY, http: 409, condition: "sellable run/order against a repair-support-only line" }
  - { id: ERR_LINE_SUNSET, http: 409, condition: "any production/order against a SUNSET line" }
  - { id: ERR_DEALER_SUSPENDED, http: 409, condition: "dealer not ACTIVE" }
  - { id: ERR_CREDIT_LIMIT, http: 409, condition: "projected invoice exceeds credit headroom" }
  - { id: ERR_FG_SHORTFALL, http: 409, condition: "finished goods net of confirmed demand below order size" }
  - { id: ERR_OUTSIDE_SHIP_WEEK, http: 409, condition: "ship date outside the confirmed week window" }
  - { id: ERR_RUN_NOT_TODAY, http: 409, condition: "run start on a date other than production_date" }
  - { id: ERR_OVERAGE_LIMIT, http: 409, condition: "actual_lf above 110% of planned_lf" }
  - { id: ERR_MODULES_INCOMPLETE, http: 409, condition: "required module not PASSED" }
  - { id: ERR_STALE_TRAINING, http: 409, condition: "passed module version older than current version_no" }
  - { id: ERR_MODULE_RETIRED, http: 409, condition: "pass attempted on a RETIRED module" }
  - { id: ERR_CONTRACTOR_NOT_CERTIFIED, http: 409, condition: "enhanced warranty requires CERTIFIED contractor" }
  - { id: ERR_REGISTRATION_WINDOW, http: 409, condition: "registration more than 60 days after install" }
  - { id: ERR_ALREADY_ENHANCED, http: 409, condition: "enhanced warranty already active" }
  - { id: ERR_NOT_OWNER, http: 403, condition: "contractor acting on another contractor's registration" }
  - { id: ERR_NOT_ASSIGNEE, http: 403, condition: "lead decline by a non-assignee" }
  - { id: ERR_NO_ELIGIBLE_CONTRACTOR, http: 409, condition: "lead selector found an empty candidate pool" }
  - { id: ERR_CLAIM_OUT_OF_WARRANTY, http: 409, condition: "claim filed beyond warranty_years" }
  - { id: ERR_FADE_COOLDOWN, http: 409, condition: "fade claim on legacy-revision boards before 180 days" }
  - { id: ERR_VERDICT_BLOCKS_APPROVAL, http: 409, condition: "approve attempted without CONFIRMS_DEFECT verdict" }
  - { id: ERR_NO_SUPPORT_STOCK, http: 409, condition: "replacement approved with no available support lot" }
  - { id: ERR_KIT_STILL_CURRENT, http: 409, condition: "kit retire blocked while line is current and no superseding kit exists" }
  - { id: ERR_CHIP_STOCK_SHORT, http: 409, condition: "chip fulfilment without sufficient support-stock production" }
  - { id: ERR_DUPLICATE_COMMITMENT, http: 409, condition: "second OPEN stocking commitment for same (dealer, territory)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OpsManager
    description: "Plant operations: capacity, scheduling, production execution, clock"
    identity: opaque
    exclusive_operations:
      - "POST /decking/_clock/set_current_utc"
      - "POST /decking/plants"
      - "POST /decking/plants/{id}/run-capacity-review"
      - "production-run create/start/complete/cancel"
      - "POST /decking/color-chip-requests/{id}/fulfill"
    shared_operations:
      - "read plants, runs, lots, board lots, allocation commitments"
  - name: QualityEngineer
    description: "Feedstock intake and lab disposition"
    identity: opaque
    exclusive_operations:
      - "POST /decking/suppliers"
      - "POST /decking/feedstock-lots"
      - "feedstock-lot release/reject"
    shared_operations:
      - "read suppliers, lots, plants, runs"
  - name: ProcessEngineer
    description: "Formulation authoring and revision"
    identity: opaque
    exclusive_operations:
      - "formulation create/activate/revise/retire"
    shared_operations:
      - "read formulations, product lines, runs"
  - name: ProductManager
    description: "Product line lifecycle"
    identity: opaque
    exclusive_operations:
      - "product-line create/discontinue/set-repair-support/sunset"
    shared_operations:
      - "read product lines, formulations"
  - name: ChannelManager
    description: "Dealer network, territories, price books, collection programs, season close"
    identity: opaque
    exclusive_operations:
      - "dealer create; price-book publish; collection-program create/suspend/reactivate/terminate; stocking-commitment create/close-season"
    shared_operations:
      - "read dealers, commitments, kits, programs"
  - name: DealerSalesRep
    description: "Manufacturer's sales force: order confirmation, shipping, merchandising, reservations"
    identity: opaque
    exclusive_operations:
      - "shipment-order confirm/ship/cancel; allocation-commitment create/release; sample-kit order/deliver/retire"
    shared_operations:
      - "shipment-order create; color-chip request create; read dealers, orders, commitments, price books"
  - name: Dealer
    description: "External dealer account"
    identity: "entity_backed:Dealer"
    exclusive_operations:
      - "shipment-order deliver (own orders; X-User-ID must equal the order's dealer_id)"
      - "lead-referral submit (own dealer id; X-User-ID must equal submitted_by_dealer_id)"
    shared_operations:
      - "shipment-order create; color-chip request create; read own orders, kits, commitments"
  - name: ProgramAdmin
    description: "Contractor program administration"
    identity: opaque
    exclusive_operations:
      - "contractor create/certify/suspend/reinstate; training-module create/re-version/retire; training pass/fail; lead assign"
    shared_operations:
      - "training-record enrol; read contractors, leads, registrations"
  - name: Contractor
    description: "Certified (or aspiring) installer"
    identity: "entity_backed:Contractor"
    exclusive_operations:
      - "install-registration create/mark-installed/activate-warranty/cancel (own)"
      - "lead decline (as assignee)"
      - "warranty-claim file (own registrations)"
    shared_operations:
      - "training-record enrol; read own records, registrations, claims"
  - name: ClaimsAdjuster
    description: "Warranty claim adjudication and sample review"
    identity: opaque
    exclusive_operations:
      - "warranty-claim request-sample/adjudicate; claim-sample receive/review"
    shared_operations:
      - "read claims, registrations, board lots, contractors"
