# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 0214 — Food Delivery Marketplace  (EXPERT tier)
# 9 rule_ids × 2 instances = 18 difficulty instances.
#
# Canonical zone "DT" used throughout (cents unless noted):
#   base_delivery_fee=300, per_km_fee=120, small_order_threshold=1500,
#   small_order_fee=200, service_fee_bps=850, delivery_fee_cap=2000,
#   surge_tier_1_demand=5, surge_tier_2_demand=10,
#   surge_multiplier_tier_0=1.0, _tier_1=1.25, _tier_2=1.6,
#   dasher_base_pay=250, dasher_per_km_pay=100, dasher_min_guarantee=700.
# Restaurant route_distance_km=4 (so dasher base = 250 + 100*4 = 650;
#   distance fee raw = 300 + 120*4 = 780).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # ---- Instance 1: delivery fee quote vs final on the ORDER domain ----
      - name: delivery_fee_quote_vs_final_on_order
        grounds:
          - calculations.delivery_fee_quote
          - calculations.delivery_fee_final
          - entities.Order.fields.delivery_fee_quote_cents
          - entities.Order.fields.delivery_fee_final_cents
          - state_machines.Order.PICKED_UP_to_DELIVERED
        distinguishing_aspect: |
          Quote counts the order itself in zone demand (demand=5 -> tier-1 m=1.25 -> fee 975)
          while final excludes it (demand=4 -> tier-0 m=1.0 -> fee 780); the two variants
          produce 975 vs 780 on the SAME Order entity, an Order-cost-accounting domain.
        test_recipe:
          setup:
            - "Zone DT, ACTIVE open restaurant (route_distance_km=4) with one $20.00 menu item, one online same-zone dasher (max_batch_size 5)."
            - "Four filler orders placed and left PLACED so the measured (5th) order sees zone active_order_count=5 at placement."
            - "Measured order: subtotal 2000 (>= threshold, no small-order fee), placed as the 5th active order -> quote uses demand 5."
            - "Measured order dispatched, accepted, picked-up, delivered while the four fillers remain PLACED (so demand at completion = 5, final uses 5-1=4)."
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "DT", base_delivery_fee_cents: 300, per_km_fee_cents: 120, small_order_threshold_cents: 1500, small_order_fee_cents: 200, delivery_fee_cap_cents: 2000, dasher_min_guarantee_cents: 700, dasher_per_km_pay_cents: 100, dasher_base_pay_cents: 250, service_fee_bps: 850, surge_tier_1_demand: 5, surge_tier_2_demand: 10, surge_multiplier_tier_0: 1.0, surge_multiplier_tier_1: 1.25, surge_multiplier_tier_2: 1.6 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /restaurants"
              payload: { zone_id: "${zone_id}", name: "Burgers", route_distance_km: 4, is_open: true, prep_minutes: 15 }
              as: PlatformAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /restaurants/${rest_id}/menu-items"
              payload: { name: "Combo", price_cents: 2000, available: true }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { item_id: $.data.id }
            - call: "POST /dashers"
              payload: { name: "Dan", home_zone_id: "${zone_id}", max_batch_size: 5, availability: "ONLINE" }
              as: PlatformAdmin
              captures: { dasher_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cara" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 1 } ], tip_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 1 } ], tip_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 1 } ], tip_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 1 } ], tip_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 1 } ], tip_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id, fee_quote: $.data.delivery_fee_quote_cents, m_applied: $.data.surge_multiplier_applied, ver: $.data.version }
            - call: "POST /orders/${order_id}/dispatch"
              payload: { expected_order_version: "${ver}" }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { delivery_id: $.data.id }
            - call: "POST /deliveries/${delivery_id}/accept"
              payload: {}
              as: Dasher
              as_user_id: "${dasher_id}"
            - call: "POST /deliveries/${delivery_id}/picked-up"
              payload: {}
              as: Dasher
              as_user_id: "${dasher_id}"
          trigger:
            - call: "POST /deliveries/${delivery_id}/delivered"
              payload: {}
              as: Dasher
              as_user_id: "${dasher_id}"
          assert:
            - "Order.${order_id}.delivery_fee_quote_cents == 975"
            - "Order.${order_id}.surge_multiplier_applied == 1.25"
            - "Order.${order_id}.delivery_fee_final_cents == 780"
            - "Order.${order_id}.delivery_fee_quote_cents != Order.${order_id}.delivery_fee_final_cents"

      # ---- Instance 2: dasher pay quote vs settled on the DASHER/EARNINGS domain ----
      - name: dasher_pay_quote_vs_settled_on_earnings
        grounds:
          - calculations.dasher_pay_quote
          - calculations.dasher_pay_settled
          - entities.Delivery.fields.pay_quote_cents
          - entities.Delivery.fields.settled_pay_cents
          - entities.EarningsRecord.fields.settled_pay_cents
          - state_machines.EarningsRecord.ACCRUED_to_SETTLED
        distinguishing_aspect: |
          On the Dasher/EarningsRecord domain (NOT the Order-fee domain): pay quote uses
          tip-at-dispatch=0 so the guarantee tops up to 700, while settled uses the
          raised tip=200 so pre_guarantee=850 needs no top-up -> quote 700 vs settled 850.
        test_recipe:
          setup:
            - "Zone DT, open restaurant (route_distance_km=4) with one $20 item, one online same-zone dasher."
            - "Single ASAP order placed with tip 0 (so dispatch quote sits exactly on the 700 guarantee floor: base 650 + 0 -> top-up 50)."
            - "Order dispatched & accepted, then tip raised by +200 (tip now 200) BEFORE pickup, then picked-up and delivered."
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "DT", base_delivery_fee_cents: 300, per_km_fee_cents: 120, small_order_threshold_cents: 1500, small_order_fee_cents: 200, delivery_fee_cap_cents: 2000, dasher_min_guarantee_cents: 700, dasher_per_km_pay_cents: 100, dasher_base_pay_cents: 250, service_fee_bps: 850 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /restaurants"
              payload: { zone_id: "${zone_id}", name: "Burgers", route_distance_km: 4, is_open: true }
              as: PlatformAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /restaurants/${rest_id}/menu-items"
              payload: { name: "Combo", price_cents: 2000, available: true }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { item_id: $.data.id }
            - call: "POST /dashers"
              payload: { name: "Dan", home_zone_id: "${zone_id}", max_batch_size: 2, availability: "ONLINE" }
              as: PlatformAdmin
              captures: { dasher_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cara" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 1 } ], tip_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id, ver: $.data.version }
            - call: "POST /orders/${order_id}/dispatch"
              payload: { expected_order_version: "${ver}" }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { delivery_id: $.data.id, pay_quote: $.data.pay_quote_cents }
            - call: "POST /deliveries/${delivery_id}/accept"
              payload: {}
              as: Dasher
              as_user_id: "${dasher_id}"
            - call: "POST /orders/${order_id}/tip-adjustments"
              payload: { delta_cents: 200 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /deliveries/${delivery_id}/picked-up"
              payload: {}
              as: Dasher
              as_user_id: "${dasher_id}"
          trigger:
            - call: "POST /deliveries/${delivery_id}/delivered"
              payload: {}
              as: Dasher
              as_user_id: "${dasher_id}"
          assert:
            - "Delivery.${delivery_id}.pay_quote_cents == 700"
            - "Delivery.${delivery_id}.settled_pay_cents == 850"
            - "Delivery.${delivery_id}.pay_quote_cents != Delivery.${delivery_id}.settled_pay_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # ---- Instance 1: mode (a) tiered surge with cap+small-order, >=3 inputs nonlinear ----
      - name: delivery_fee_tiered_surge_with_cap_mode_a
        grounds:
          - calculations.delivery_fee_quote
          - entities.Zone.fields.delivery_fee_cap_cents
          - entities.Zone.fields.small_order_fee_cents
          - entities.Order.fields.delivery_fee_quote_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs (base, per-km*distance, tiered surge multiplier) combined
          non-linearly via tier selection then min-cap then conditional small-order add -
          raw 780 * 1.6 (tier-2, demand 10) = 1248, under cap 2000, no small-order -> 1248.
        test_recipe:
          setup:
            - "Zone DT (cap 2000), restaurant route_distance_km=4, $20 item."
            - "Nine filler orders left PLACED so the 10th measured order sees demand exactly 10 -> tier-2 multiplier 1.6 (>= boundary)."
            - "Measured order subtotal 2000 (no small-order fee)."
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "DT", base_delivery_fee_cents: 300, per_km_fee_cents: 120, small_order_threshold_cents: 1500, small_order_fee_cents: 200, delivery_fee_cap_cents: 2000, dasher_min_guarantee_cents: 700, dasher_per_km_pay_cents: 100, dasher_base_pay_cents: 250, service_fee_bps: 850, surge_tier_1_demand: 5, surge_tier_2_demand: 10, surge_multiplier_tier_2: 1.6 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /restaurants"
              payload: { zone_id: "${zone_id}", name: "Burgers", route_distance_km: 4, is_open: true }
              as: PlatformAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /restaurants/${rest_id}/menu-items"
              payload: { name: "Combo", price_cents: 2000, available: true }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { item_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cara" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 1 } ] }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 1 } ] }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 1 } ] }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 1 } ] }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 1 } ] }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 1 } ] }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 1 } ] }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 1 } ] }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 1 } ] }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 1 } ] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id, fee: $.data.delivery_fee_quote_cents, m: $.data.surge_multiplier_applied }
          assert:
            - "Order.${order_id}.surge_multiplier_applied == 1.6"
            - "Order.${order_id}.delivery_fee_quote_cents == 1248"

      # ---- Instance 2: mode (b) per-line round-then-sum service fee ----
      - name: service_fee_round_per_line_mode_b
        grounds:
          - calculations.order_service_fee
          - entities.OrderLineItem.fields.service_fee_cents
          - entities.Order.fields.service_fee_cents
          - entities.Zone.fields.service_fee_bps
        distinguishing_aspect: |
          Mode (b): rounding order pinned to round-per-line-then-sum. Lines
          [999,500,149] at 850 bps -> per-line [85,43,13]=141, whereas sum-then-round
          would give round(1648*0.085)=140; the scaffold pins 141.
        test_recipe:
          setup:
            - "Zone DT (service_fee_bps 850), open restaurant, three menu items priced 333, 250, 149."
            - "One ASAP order with three lines: 333x3 (ext 999), 250x2 (ext 500), 149x1 (ext 149); subtotal 1648."
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "DT", base_delivery_fee_cents: 300, per_km_fee_cents: 120, small_order_threshold_cents: 1500, small_order_fee_cents: 200, delivery_fee_cap_cents: 2000, dasher_min_guarantee_cents: 700, dasher_per_km_pay_cents: 100, dasher_base_pay_cents: 250, service_fee_bps: 850 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /restaurants"
              payload: { zone_id: "${zone_id}", name: "Burgers", route_distance_km: 4, is_open: true }
              as: PlatformAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /restaurants/${rest_id}/menu-items"
              payload: { name: "A", price_cents: 333, available: true }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { item_a: $.data.id }
            - call: "POST /restaurants/${rest_id}/menu-items"
              payload: { name: "B", price_cents: 250, available: true }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { item_b: $.data.id }
            - call: "POST /restaurants/${rest_id}/menu-items"
              payload: { name: "C", price_cents: 149, available: true }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { item_c: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cara" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_a}", quantity: 3 }, { menu_item_id: "${item_b}", quantity: 2 }, { menu_item_id: "${item_c}", quantity: 1 } ] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id, sf: $.data.service_fee_cents, sub: $.data.order_subtotal_cents }
          assert:
            - "Order.${order_id}.order_subtotal_cents == 1648"
            - "Order.${order_id}.service_fee_cents == 141"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # ---- Instance 1: Order parallel dimensions (fulfillment x billing) ----
      - name: order_parallel_fulfillment_and_billing_axes
        grounds:
          - state_machines.Order.PICKED_UP_to_DELIVERED
          - entities.Order.fields.fulfillment_status
          - entities.Order.fields.billing_status
          - state_machines.Order.UNSETTLED_to_SETTLED
        distinguishing_aspect: |
          Order carries two independent state axes: after pickup the order is
          PICKED_UP x UNSETTLED, and only the delivered transition flips fulfillment to
          DELIVERED AND billing to SETTLED - the axes evolve on the same row but track
          different concerns (the parallel-dimension non-linear shape on Order).
        test_recipe:
          setup:
            - "Zone DT, open restaurant, $20 item, one online dasher."
            - "Single ASAP order placed, dispatched, accepted, picked-up - at which point fulfillment=PICKED_UP and billing is still UNSETTLED."
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "DT", base_delivery_fee_cents: 300, per_km_fee_cents: 120, small_order_threshold_cents: 1500, small_order_fee_cents: 200, delivery_fee_cap_cents: 2000, dasher_min_guarantee_cents: 700, dasher_per_km_pay_cents: 100, dasher_base_pay_cents: 250, service_fee_bps: 850 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /restaurants"
              payload: { zone_id: "${zone_id}", name: "Burgers", route_distance_km: 4, is_open: true }
              as: PlatformAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /restaurants/${rest_id}/menu-items"
              payload: { name: "Combo", price_cents: 2000, available: true }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { item_id: $.data.id }
            - call: "POST /dashers"
              payload: { name: "Dan", home_zone_id: "${zone_id}", availability: "ONLINE" }
              as: PlatformAdmin
              captures: { dasher_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cara" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 1 } ], tip_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id, ver: $.data.version }
            - call: "POST /orders/${order_id}/dispatch"
              payload: { expected_order_version: "${ver}" }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { delivery_id: $.data.id }
            - call: "POST /deliveries/${delivery_id}/accept"
              payload: {}
              as: Dasher
              as_user_id: "${dasher_id}"
            - call: "POST /deliveries/${delivery_id}/picked-up"
              payload: {}
              as: Dasher
              as_user_id: "${dasher_id}"
          trigger:
            - call: "GET /orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { fs: $.data.fulfillment_status, bs: $.data.billing_status }
          assert:
            - "Order.${order_id}.fulfillment_status == PICKED_UP"
            - "Order.${order_id}.billing_status == UNSETTLED"

      # ---- Instance 2: Delivery reassignment cycle (branching with revert) ----
      - name: delivery_reassign_cycle_reverts_order_to_placed
        grounds:
          - state_machines.Delivery.OFFERED_to_REASSIGNED
          - state_machines.Order.ROUTED_to_PLACED
          - entities.Delivery.fields.fulfillment_status
        distinguishing_aspect: |
          On the Delivery entity (different entity from the Order axes): declining an
          OFFERED delivery sends it to REASSIGNED AND reverts the parent Order
          ROUTED->PLACED, creating a re-dispatch cycle - a non-linear branch+revert shape
          that a forward-only pipeline cannot express.
        test_recipe:
          setup:
            - "Zone DT, open restaurant, $20 item, one online dasher."
            - "Order placed and dispatched (now ROUTED with an OFFERED delivery)."
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "DT", base_delivery_fee_cents: 300, per_km_fee_cents: 120, small_order_threshold_cents: 1500, small_order_fee_cents: 200, delivery_fee_cap_cents: 2000, dasher_min_guarantee_cents: 700, dasher_per_km_pay_cents: 100, dasher_base_pay_cents: 250, service_fee_bps: 850 }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /restaurants"
              payload: { zone_id: "${zone_id}", name: "Burgers", route_distance_km: 4, is_open: true }
              as: PlatformAdmin
              captures: { rest_id: $.data.id }
            - call: "POST /restaurants/${rest_id}/menu-items"
              payload: { name: "Combo", price_cents: 2000, available: true }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { item_id: $.data.id }
            - call: "POST /dashers"
              payload: { name: "Dan", home_zone_id: "${zone_id}", availability: "ONLINE" }
              as: PlatformAdmin
              captures: { dasher_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cara" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", restaurant_id: "${rest_id}", line_items: [ { menu_item_id: "${item_id}", quantity: 1 } ], tip_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id, ver: $.data.version }
            - call: "POST /orders/${order_id}/dispatch"
              payload: { expected_order_version: "${ver}" }
              as: Restaurant
              as_user_id: "${rest_id}"
              captures: { delivery_id: $.data.id }
          trigger:
            - call: "POST /deliveries/${delivery_id}/decline"
              payload: {}
              as: Dasher
              as_user_id: "${dasher_id}"
              captures: { dstate: $.data.fulfillment_status }
            - call: "GET /orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ostate: $.data.fulfillment_status }
          assert:
            - "Delivery.${delivery_id}.fulfillment_status == REASSIGNED"
            - "Order.${order_id}.fulfillment_status == PLACED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # ---- Instance 1: depth-3 cancel cascade (Order->Delivery->EarningsRecord) ----
      - name: cancel_cascade_order_delivery_earnings_depth3
        grounds:
          - state_machines.Order.ROUTED_to_CANCELLED
          - state_machines.Delivery.ACCEPTED_to_CANCELLED
          - state_machines.EarningsRecord.ACCRUED_to_REVERSED
          - entities.Delivery.fields.fulfillment_status
          - entities.EarningsRecord.fields.status
        distinguishing_aspect: |
          Trigger = order cancel. Hop 1: cancel mutates Order->CANCELLED, which causes its
          Delivery ACCEPTED->CANCELLED; hop 2: that Delivery cancellation itself causes the
          linked EarningsRecord ACCRUED->REVERSED. Each link is caused by the previous
          (depth 3), not by the original cancel directly.
        test_recipe:
          setup:
            - "Zone DT, open restaurant, $20 item, one online dasher."
            - "Order placed, dispatched, accepted (Delivery ACCEPTED, EarningsRecord ACCRUED)."
          setup_api_calls:
            - call: "POST /zones"
