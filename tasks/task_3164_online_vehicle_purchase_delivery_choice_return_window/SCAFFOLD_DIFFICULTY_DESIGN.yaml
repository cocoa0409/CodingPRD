          expected_vehicle_version: ${vehicles_v1}
        as: Customer
        as_user_id: ${zero_cust}
        captures:
          vehicles_v1: $.data.version
      trigger:
      - call: POST /vehicle-hub/financing/prequalify
        payload:
          annual_income_cents: 0
          credit_band: A
        as: Customer
        as_user_id: ${zero_cust}
        captures:
          zero_pq: $.data.id
      - call: POST /vehicle-hub/orders/${zero_ord}/structure
        payload:
          financing_id: ${zero_pq}
          down_payment_cents: 2140000
        as: Customer
        as_user_id: ${zero_cust}
      assert:
      - FinancingPrequalification.${zero_pq}.max_amount_cents == 0
      - FinancingPrequalification.${zero_pq}.monthly_payment_cents == 0
      - 'structure rejected: error_id == ERR_FINANCING_CAP_EXCEEDED (http 402) — amount_financed 0 vs cap 0 with down_payment 2,140,000 covering total due exactly 0 financed: the cap check amount_financed_cents
        (0) <= max_amount (0) passes only if financing truly zero; with financing_id supplied the minimum-down rule also applies — assert the structure call is rejected with either ERR_FINANCING_CAP_EXCEEDED
        or succeeds as fully-paid-down; the pinned behavior: amount_financed_cents == 0 with financing_id supplied is rejected as ERR_FINANCING_CAP_EXCEEDED only when financed > cap; here financed == 0
        <= 0 so structure SUCCEEDS with amount_financed_cents 0'
      - PurchaseOrder.${zero_ord}.status == STRUCTURED with amount_financed_cents == 0
    assert:
    - FinancingPrequalification.${zero_pq}.max_amount_cents == 0
    - FinancingPrequalification.${zero_pq}.monthly_payment_cents == 0
    - 'structure succeeds because amount_financed (0) <= cap (0): PurchaseOrder.${zero_ord}.status == STRUCTURED with amount_financed_cents == 0 and down_payment_cents == 2140000'
    - a second structure attempt with down_payment_cents 2139999 is rejected with ERR_FINANCING_CAP_EXCEEDED (financed 1 > cap 0)
