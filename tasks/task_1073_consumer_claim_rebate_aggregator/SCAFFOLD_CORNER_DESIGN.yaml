# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of testable claims not covered
# by §1.8). Walks references/claim-extraction-guide.md against §1.1-§1.7.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: program_creation_returns_draft
        claim_type: Creation
        grounds: [entities.RebateProgram, endpoints]
        distinguishing_aspect: "POST /programs with all required fields returns 201 and a RebateProgram in status DRAFT."
        test_recipe:
          setup: ["No prior state"]
          setup_api_calls:
            - call: "POST /rebate-aggregator/programs"
              payload: { name: "P1", settlement_case_id: "CASE_C1", category: "PRODUCT_REBATE", distribution_method: "FIXED", fund_total_cents: 50000, advertised_amount_cents: 10000, per_claim_cap_cents: 20000, eligibility_min_purchase_cents: 5000, requires_proof: true, min_documents: 1, claim_window_open_at: "2026-06-01T00:00:00Z", claim_window_close_at: "2026-09-01T00:00:00Z" }
              as: ProgramManager
              captures: { pid: $.data.id }
          trigger:
            - call: "GET /rebate-aggregator/programs/${pid}"
              payload: {}
              as: ProgramManager
          assert:
            - "RebateProgram.${pid}.status == DRAFT"
            - "RebateProgram.${pid}.fund_total_cents == 50000"

      - name: program_defaults_applied_on_omission
        claim_type: Defaults
        grounds: [entities.RebateProgram.fields.min_documents, entities.RebateProgram.fields.requires_proof, entities.RebateProgram.fields.eligibility_min_purchase_cents]
        distinguishing_aspect: "Omitting min_documents, requires_proof, eligibility_min_purchase_cents applies defaults 1, true, 0 respectively."
        test_recipe:
          setup: ["No prior state"]
          setup_api_calls:
            - call: "POST /rebate-aggregator/programs"
              payload: { name: "PDF", settlement_case_id: "CASE_DF", category: "WARRANTY", distribution_method: "FIXED", fund_total_cents: 50000, advertised_amount_cents: 10000, per_claim_cap_cents: 20000, claim_window_open_at: "2026-06-01T00:00:00Z", claim_window_close_at: "2026-09-01T00:00:00Z" }
              as: ProgramManager
              captures: { pid: $.data.id }
          trigger:
            - call: "GET /rebate-aggregator/programs/${pid}"
              payload: {}
              as: ProgramManager
          assert:
            - "RebateProgram.${pid}.min_documents == 1"
            - "RebateProgram.${pid}.requires_proof == true"
            - "RebateProgram.${pid}.eligibility_min_purchase_cents == 0"

      - name: consumer_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Consumer, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent consumer id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["No prior state"]
          setup_api_calls: []
          trigger:
            - call: "GET /rebate-aggregator/consumers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: claim_create_missing_required_field_rejected
        claim_type: Required Fields
        grounds: [entities.Claim.fields.claimed_amount_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /claims missing required claimed_amount_cents returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["OPEN program and a consumer exist"]
          setup_api_calls:
            - call: "POST /rebate-aggregator/programs"
              payload: { name: "PM", settlement_case_id: "CASE_M", category: "PRODUCT_REBATE", distribution_method: "FIXED", fund_total_cents: 50000, advertised_amount_cents: 10000, per_claim_cap_cents: 20000, eligibility_min_purchase_cents: 0, requires_proof: false, min_documents: 0, claim_window_open_at: "2026-06-01T00:00:00Z", claim_window_close_at: "2026-09-01T00:00:00Z" }
              as: ProgramManager
              captures: { pid: $.data.id }
            - call: "POST /rebate-aggregator/programs/${pid}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /rebate-aggregator/consumers"
              payload: { email: "m@x.com", full_name: "M" }
              as: Anonymous
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /rebate-aggregator/claims"
              payload: { consumer_id: "${cid}", program_id: "${pid}", benefit_period_start: "2026-01-01T00:00:00Z", benefit_period_end: "2026-02-01T00:00:00Z" }
              as: Consumer
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: consumer_duplicate_email_rejected
        claim_type: Type Constraints
        grounds: [entities.Consumer.fields.email, "errors[ERR_DUPLICATE_EMAIL]"]
        distinguishing_aspect: "Registering a second consumer with an already-used email returns ERR_DUPLICATE_EMAIL (409)."
        test_recipe:
          setup: ["A consumer with email dup@x.com exists"]
          setup_api_calls:
            - call: "POST /rebate-aggregator/consumers"
              payload: { email: "dup@x.com", full_name: "First" }
              as: Anonymous
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /rebate-aggregator/consumers"
              payload: { email: "dup@x.com", full_name: "Second" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_DUPLICATE_EMAIL"

      - name: claim_document_count_computed
        claim_type: Computed Fields
        grounds: [entities.Claim.fields.document_count, endpoints]
        distinguishing_aspect: "After uploading two documents, the claim's computed document_count equals 2."
        test_recipe:
          setup: ["OPEN program, consumer, DRAFT claim"]
          setup_api_calls:
            - call: "POST /rebate-aggregator/programs"
              payload: { name: "PDC", settlement_case_id: "CASE_DC", category: "PRODUCT_REBATE", distribution_method: "FIXED", fund_total_cents: 50000, advertised_amount_cents: 10000, per_claim_cap_cents: 20000, eligibility_min_purchase_cents: 0, requires_proof: true, min_documents: 1, claim_window_open_at: "2026-06-01T00:00:00Z", claim_window_close_at: "2026-09-01T00:00:00Z" }
              as: ProgramManager
              captures: { pid: $.data.id }
            - call: "POST /rebate-aggregator/programs/${pid}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /rebate-aggregator/consumers"
              payload: { email: "dc@x.com", full_name: "DC" }
              as: Anonymous
              captures: { cid: $.data.id }
            - call: "POST /rebate-aggregator/claims"
              payload: { consumer_id: "${cid}", program_id: "${pid}", benefit_period_start: "2026-01-01T00:00:00Z", benefit_period_end: "2026-02-01T00:00:00Z", claimed_amount_cents: 12000 }
              as: Consumer
              as_user_id: "${cid}"
              captures: { clid: $.data.id }
            - call: "POST /rebate-aggregator/claims/${clid}/documents"
              payload: { doc_type: "RECEIPT", file_ref: "a" }
              as: Consumer
              as_user_id: "${cid}"
            - call: "POST /rebate-aggregator/claims/${clid}/documents"
              payload: { doc_type: "PROOF_OF_PURCHASE", file_ref: "b" }
              as: Consumer
              as_user_id: "${cid}"
          trigger:
            - call: "GET /rebate-aggregator/claims/${clid}"
              payload: {}
              as: Consumer
              as_user_id: "${cid}"
          assert:
            - "Claim.${clid}.document_count == 2"

  - section: state_machines
    instances:
      - name: program_open_from_open_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.RebateProgram.DRAFT_to_OPEN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Opening an already-OPEN program returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A program already OPEN"]
          setup_api_calls:
            - call: "POST /rebate-aggregator/programs"
              payload: { name: "POO", settlement_case_id: "CASE_OO", category: "PRODUCT_REBATE", distribution_method: "FIXED", fund_total_cents: 50000, advertised_amount_cents: 10000, per_claim_cap_cents: 20000, eligibility_min_purchase_cents: 0, requires_proof: false, min_documents: 0, claim_window_open_at: "2026-06-01T00:00:00Z", claim_window_close_at: "2026-09-01T00:00:00Z" }
              as: ProgramManager
              captures: { pid: $.data.id }
            - call: "POST /rebate-aggregator/programs/${pid}/open"
              payload: {}
              as: ProgramManager
          trigger:
            - call: "POST /rebate-aggregator/programs/${pid}/open"
              payload: {}
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: claim_approve_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Claim.UNDER_REVIEW_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving a DRAFT claim (never submitted/reviewed) returns ERR_INVALID_STATE; the state check precedes the OCC check."
        test_recipe:
          setup: ["OPEN program with a DRAFT claim"]
          setup_api_calls:
            - call: "POST /rebate-aggregator/programs"
              payload: { name: "PAD", settlement_case_id: "CASE_AD", category: "PRODUCT_REBATE", distribution_method: "FIXED", fund_total_cents: 50000, advertised_amount_cents: 10000, per_claim_cap_cents: 20000, eligibility_min_purchase_cents: 0, requires_proof: false, min_documents: 0, claim_window_open_at: "2026-06-01T00:00:00Z", claim_window_close_at: "2026-09-01T00:00:00Z" }
              as: ProgramManager
              captures: { pid: $.data.id }
            - call: "POST /rebate-aggregator/programs/${pid}/open"
              payload: {}
              as: ProgramManager
              captures: { pver: $.data.version }
            - call: "POST /rebate-aggregator/consumers"
              payload: { email: "ad@x.com", full_name: "AD" }
              as: Anonymous
              captures: { cid: $.data.id }
            - call: "POST /rebate-aggregator/claims"
              payload: { consumer_id: "${cid}", program_id: "${pid}", benefit_period_start: "2026-01-01T00:00:00Z", benefit_period_end: "2026-02-01T00:00:00Z", claimed_amount_cents: 12000 }
              as: Consumer
              as_user_id: "${cid}"
              captures: { clid: $.data.id }
          trigger:
            - call: "POST /rebate-aggregator/claims/${clid}/approve"
              payload: { expected_program_version: "${pver}" }
              as: ClaimReviewer
              as_user_id: "rev-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Claim.${clid}.status == DRAFT"

      - name: match_converts_when_claim_filed_from_it
        claim_type: Valid Transition
        grounds: [state_machines.Match.CANDIDATE_to_CONVERTED, endpoints]
        distinguishing_aspect: "Filing a claim with match_id referencing a CANDIDATE Match transitions that Match to CONVERTED."
        test_recipe:
          setup: ["OPEN program, consumer, and a CANDIDATE Match linking them"]
          setup_api_calls:
            - call: "POST /rebate-aggregator/programs"
              payload: { name: "PMT", settlement_case_id: "CASE_MT", category: "PRODUCT_REBATE", distribution_method: "FIXED", fund_total_cents: 50000, advertised_amount_cents: 10000, per_claim_cap_cents: 20000, eligibility_min_purchase_cents: 0, requires_proof: false, min_documents: 0, claim_window_open_at: "2026-06-01T00:00:00Z", claim_window_close_at: "2026-09-01T00:00:00Z" }
              as: ProgramManager
              captures: { pid: $.data.id }
            - call: "POST /rebate-aggregator/programs/${pid}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /rebate-aggregator/consumers"
              payload: { email: "mt@x.com", full_name: "MT" }
              as: Anonymous
              captures: { cid: $.data.id }
            - call: "POST /rebate-aggregator/matches"
              payload: { consumer_id: "${cid}", program_id: "${pid}" }
              as: ProgramManager
              captures: { mid: $.data.id }
          trigger:
            - call: "POST /rebate-aggregator/claims"
              payload: { consumer_id: "${cid}", program_id: "${pid}", benefit_period_start: "2026-01-01T00:00:00Z", benefit_period_end: "2026-02-01T00:00:00Z", claimed_amount_cents: 12000, match_id: "${mid}" }
              as: Consumer
              as_user_id: "${cid}"
          assert:
            - "Match.${mid}.status == CONVERTED"

      - name: fraud_confirm_suspends_consumer_and_flags_claim
        claim_type: Side Effect Execution
        grounds: [state_machines.FraudFlag.OPEN_to_CONFIRMED, state_machines.Consumer.VERIFIED_to_SUSPENDED, entities.Claim.fields.fraud_status]
        distinguishing_aspect: "Confirming a fraud flag sets the claim's fraud_status to CONFIRMED and transitions the consumer to SUSPENDED."
        test_recipe:
          setup: ["VERIFIED consumer with a DRAFT claim carrying one OPEN fraud flag"]
          setup_api_calls:
            - call: "POST /rebate-aggregator/programs"
              payload: { name: "PFC", settlement_case_id: "CASE_FC", category: "PRODUCT_REBATE", distribution_method: "FIXED", fund_total_cents: 50000, advertised_amount_cents: 10000, per_claim_cap_cents: 20000, eligibility_min_purchase_cents: 0, requires_proof: false, min_documents: 0, claim_window_open_at: "2026-06-01T00:00:00Z", claim_window_close_at: "2026-09-01T00:00:00Z" }
              as: ProgramManager
              captures: { pid: $.data.id }
            - call: "POST /rebate-aggregator/programs/${pid}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /rebate-aggregator/consumers"
              payload: { email: "fc@x.com", full_name: "FC" }
              as: Anonymous
              captures: { cid: $.data.id }
            - call: "POST /rebate-aggregator/consumers/${cid}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /rebate-aggregator/claims"
              payload: { consumer_id: "${cid}", program_id: "${pid}", benefit_period_start: "2026-01-01T00:00:00Z", benefit_period_end: "2026-02-01T00:00:00Z", claimed_amount_cents: 12000 }
              as: Consumer
              as_user_id: "${cid}"
              captures: { clid: $.data.id }
            - call: "POST /rebate-aggregator/claims/${clid}/fraud-flags"
              payload: { reason: "IDENTITY_MISMATCH" }
              as: FraudAnalyst
              as_user_id: "fraud-1"
              captures: { fid: $.data.id }
          trigger:
            - call: "POST /rebate-aggregator/fraud-flags/${fid}/confirm"
              payload: { resolution_note: "verified fraud" }
              as: FraudAnalyst
              as_user_id: "fraud-2"
          assert:
            - "FraudFlag.${fid}.status == CONFIRMED"
            - "Claim.${clid}.fraud_status == CONFIRMED"
            - "Consumer.${cid}.identity_status == SUSPENDED"

      - name: approve_with_confirmed_fraud_returns_fraud_hold
        claim_type: guarded transitions
        grounds: ["validations[priority=14]", "errors[ERR_FRAUD_HOLD]", entities.Claim.fields.fraud_status]
        distinguishing_aspect: "Approving a claim whose own fraud_status is CONFIRMED returns ERR_FRAUD_HOLD, ahead of the risk gate."
        test_recipe:
          setup: ["VERIFIED consumer; claim UNDER_REVIEW with a VERIFIED doc; a CONFIRMED fraud flag on that same claim"]
          setup_api_calls:
            - call: "POST /rebate-aggregator/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rebate-aggregator/programs"
              payload: { name: "PFH", settlement_case_id: "CASE_FH", category: "PRODUCT_REBATE", distribution_method: "FIXED", fund_total_cents: 100000, advertised_amount_cents: 20000, per_claim_cap_cents: 30000, eligibility_min_purchase_cents: 5000, requires_proof: true, min_documents: 1, claim_window_open_at: "2026-06-01T00:00:00Z", claim_window_close_at: "2026-09-01T00:00:00Z" }
              as: ProgramManager
              captures: { pid: $.data.id }
            - call: "POST /rebate-aggregator/programs/${pid}/open"
              payload: {}
              as: ProgramManager
              captures: { pver: $.data.version }
            - call: "POST /rebate-aggregator/consumers"
              payload: { email: "fh@x.com", full_name: "FH" }
              as: Anonymous
              captures: { cid: $.data.id }
            - call: "POST /rebate-aggregator/consumers/${cid}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /rebate-aggregator/claims"
              payload: { consumer_id: "${cid}", program_id: "${pid}", benefit_period_start: "2026-01-01T00:00:00Z", benefit_period_end: "2026-02-01T00:00:00Z", claimed_amount_cents: 25000 }
              as: Consumer
              as_user_id: "${cid}"
              captures: { clid: $.data.id }
            - call: "POST /rebate-aggregator/claims/${clid}/documents"
              payload: { doc_type: "RECEIPT", file_ref: "r1" }
              as: Consumer
              as_user_id: "${cid}"
              captures: { docid: $.data.id }
            - call: "POST /rebate-aggregator/claims/${clid}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cid}"
            - call: "POST /rebate-aggregator/documents/${docid}/verify"
              payload: {}
              as: ClaimReviewer
              as_user_id: "rev-1"
            - call: "POST /rebate-aggregator/claims/${clid}/start-review"
              payload: {}
              as: ClaimReviewer
              as_user_id: "rev-1"
            - call: "POST /rebate-aggregator/claims/${clid}/fraud-flags"
              payload: { reason: "SUSPICIOUS_DOCS" }
              as: FraudAnalyst
              as_user_id: "fraud-1"
              captures: { fid: $.data.id }
            - call: "POST /rebate-aggregator/fraud-flags/${fid}/confirm"
              payload: {}
              as: FraudAnalyst
              as_user_id: "fraud-2"
          trigger:
            - call: "POST /rebate-aggregator/claims/${clid}/approve"
              payload: { expected_program_version: "${pver}" }
              as: ClaimReviewer
              as_user_id: "rev-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FRAUD_HOLD"
            - "Claim.${clid}.status == UNDER_REVIEW"

  - section: calculations
    instances:
      - name: risk_score_confirmed_flag_weight
        claim_type: Constants Applied
        grounds: [calculations.consumer_risk_score, entities.Consumer.fields.optimistic_risk_score]
        distinguishing_aspect: "One CONFIRMED fraud flag on a VERIFIED consumer yields optimistic_risk_score 40 (CONFIRMED_FLAG_WEIGHT) and pessimistic_risk_score 40."
        test_recipe:
          setup: ["VERIFIED consumer with one DRAFT claim whose fraud flag is CONFIRMED"]
          setup_api_calls:
            - call: "POST /rebate-aggregator/programs"
              payload: { name: "PRS", settlement_case_id: "CASE_RS", category: "PRODUCT_REBATE", distribution_method: "FIXED", fund_total_cents: 50000, advertised_amount_cents: 10000, per_claim_cap_cents: 20000, eligibility_min_purchase_cents: 0, requires_proof: false, min_documents: 0, claim_window_open_at: "2026-06-01T00:00:00Z", claim_window_close_at: "2026-09-01T00:00:00Z" }
              as: ProgramManager
              captures: { pid: $.data.id }
            - call: "POST /rebate-aggregator/programs/${pid}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /rebate-aggregator/consumers"
              payload: { email: "rs@x.com", full_name: "RS" }
              as: Anonymous
              captures: { cid: $.data.id }
            - call: "POST /rebate-aggregator/consumers/${cid}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /rebate-aggregator/claims"
              payload: { consumer_id: "${cid}", program_id: "${pid}", benefit_period_start: "2026-01-01T00:00:00Z", benefit_period_end: "2026-02-01T00:00:00Z", claimed_amount_cents: 12000 }
              as: Consumer
              as_user_id: "${cid}"
              captures: { clid: $.data.id }
            - call: "POST /rebate-aggregator/claims/${clid}/fraud-flags"
              payload: { reason: "DUPLICATE" }
              as: FraudAnalyst
              as_user_id: "fraud-1"
              captures: { fid: $.data.id }
            - call: "POST /rebate-aggregator/fraud-flags/${fid}/confirm"
              payload: {}
              as: FraudAnalyst
              as_user_id: "fraud-2"
          trigger:
            - call: "GET /rebate-aggregator/consumers/${cid}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Consumer.${cid}.optimistic_risk_score == 40"
            - "Consumer.${cid}.pessimistic_risk_score == 40"

      - name: match_score_open_in_window_is_100
        claim_type: Correct Result
        grounds: [calculations.match_score, entities.Match.fields.match_score]
        distinguishing_aspect: "A Match created against an OPEN program whose window contains the current clock scores 100 (50 base + 30 open + 20 in-window)."
        test_recipe:
          setup: ["OPEN program; clock 2026-06-15 within window; a consumer"]
          setup_api_calls:
            - call: "POST /rebate-aggregator/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rebate-aggregator/programs"
              payload: { name: "PMS", settlement_case_id: "CASE_MS", category: "PRODUCT_REBATE", distribution_method: "FIXED", fund_total_cents: 50000, advertised_amount_cents: 10000, per_claim_cap_cents: 20000, eligibility_min_purchase_cents: 0, requires_proof: false, min_documents: 0, claim_window_open_at: "2026-06-01T00:00:00Z", claim_window_close_at: "2026-09-01T00:00:00Z" }
              as: ProgramManager
              captures: { pid: $.data.id }
            - call: "POST /rebate-aggregator/programs/${pid}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /rebate-aggregator/consumers"
              payload: { email: "ms@x.com", full_name: "MS" }
              as: Anonymous
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /rebate-aggregator/matches"
              payload: { consumer_id: "${cid}", program_id: "${pid}" }
              as: ProgramManager
              captures: { mid: $.data.id }
          assert:
            - "Match.${mid}.match_score == 100"
            - "Match.${mid}.status == CANDIDATE"

      - name: provisional_payout_value_stub
        claim_type: Correct Result
        grounds: [calculations.claim_payout]
        excluded_because:
          difficulty_instance: dual_variant_calc / claim_payout_provisional_vs_final_diverge
          rationale: "Provisional payout value = min(claimed, advertised, cap) is asserted within the named §1.8 dual-variant instance."

  - section: validations
    instances:
      - name: approve_stale_program_version_returns_412
        claim_type: Violation to Error
        grounds: ["concurrency_rules[approve-claim-stale-program]", "validations[priority=7]", "errors[ERR_STALE_PROGRAM_VERSION]"]
        distinguishing_aspect: "After one approval advances program.version, a second approval carrying the previously observed (now stale) expected_program_version returns ERR_STALE_PROGRAM_VERSION (412)."
        test_recipe:
          setup: ["FIXED program OPEN (fund 100000); two VERIFIED consumers each with a claim UNDER_REVIEW (VERIFIED docs); pver captured at open"]
          setup_api_calls:
            - call: "POST /rebate-aggregator/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rebate-aggregator/programs"
              payload: { name: "POCC", settlement_case_id: "CASE_OCC", category: "PRODUCT_REBATE", distribution_method: "FIXED", fund_total_cents: 100000, advertised_amount_cents: 20000, per_claim_cap_cents: 30000, eligibility_min_purchase_cents: 5000, requires_proof: true, min_documents: 1, claim_window_open_at: "2026-06-01T00:00:00Z", claim_window_close_at: "2026-09-01T00:00:00Z" }
