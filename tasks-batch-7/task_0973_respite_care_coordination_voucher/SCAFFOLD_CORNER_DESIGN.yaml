      - name: caregiver_cannot_read_other_caregiver
        claim_type: ownership_scope
        grounds: [roles.Caregiver, "validations[priority=3]", "errors[ERR_FORBIDDEN_OWNERSHIP]"]
        distinguishing_aspect: "Caregiver B reading caregiver A's record passes the role check but fails ownership: ERR_FORBIDDEN_OWNERSHIP (403) — entity-backed identity binds X-User-ID to the resource's caregiver id."
        test_recipe:
          setup: ["Two caregivers enrolled: Ann (cg1) and Kim (cg2)"]
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin }
            - { call: "POST /respite/caregivers", payload: { full_name: "Ann Care", email: "ann@x.com", care_recipient_name: "Bob Care", care_recipient_condition: "dementia" }, as: Anonymous, captures: { cg1: $.data.id } }
            - { call: "POST /respite/caregivers", payload: { full_name: "Kim Care", email: "kim@x.com", care_recipient_name: "Sam Care", care_recipient_condition: "als" }, as: Anonymous, captures: { cg2: $.data.id } }
          trigger:
            - { call: "GET /respite/caregivers/${cg1}", as: Caregiver, as_user_id: "${cg2}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_OWNERSHIP"
            - "HTTP status == 403"

  # ---------------------------------------------------------------------------
  - section: complexity_layers
    instances:
      - name: occ_program_budget_adjust_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[program-budget-adjust-stale]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A budget adjustment carrying the version observed before a prior adjustment (1 instead of current 2) is rejected with ERR_STALE_VERSION (412); the well-versioned adjustment applies delta_cents to total_budget_cents."
        test_recipe:
          setup: ["Program created (version 1 captured from the create response)"]
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin, captures: { prog: $.data.id, prog_v: $.data.version } }
          trigger:
            - { call: "POST /respite/programs/${prog}/budget-adjustments", payload: { delta_cents: 100000, reason: "top-up", expected_program_version: "${prog_v}" }, as: FunderAdmin, captures: { p_total: $.data.total_budget_cents, p_v: $.data.version } }
            - { call: "POST /respite/programs/${prog}/budget-adjustments", payload: { delta_cents: 50000, reason: "stale retry", expected_program_version: "${prog_v}" }, as: FunderAdmin, captures: { err: $.data.error_id } }
          assert:
            - "first adjustment: total_budget_cents == 50100000 and version == 2"
            - "second adjustment error_id == ERR_STALE_VERSION"
            - "HTTP status == 412"
            - "total_budget_cents remains 50100000 after the rejected call"

      - name: occ_allocation_grant_adjust_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[allocation-grant-adjust-stale]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A grant adjustment carrying the allocation version observed before a voucher issue mutated the allocation is rejected with ERR_STALE_VERSION (412) — cascades bump the parent version between read and write."
        test_recipe:
          setup: ["Caregiver ACTIVE with allocation (version captured); a 10.00h voucher issued AFTER the version capture (cascade bumps allocation version)"]
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin, captures: { prog: $.data.id } }
            - { call: "POST /respite/caregivers", payload: { full_name: "Ann Care", email: "ann@x.com", care_recipient_name: "Bob Care", care_recipient_condition: "dementia" }, as: Anonymous, captures: { cg: $.data.id } }
            - { call: "POST /respite/caregivers/${cg}/eligibility-applications", payload: { need_score: 8 }, as: Caregiver, as_user_id: "${cg}", captures: { app: $.data.id } }
            - { call: "POST /respite/eligibility-applications/${app}/review-decisions", payload: { action: "APPROVE" }, as: Coordinator }
            - { call: "GET /respite/caregivers/${cg}/allocations", as: Coordinator, captures: { alloc: "$.data[0].id", alloc_v: "$.data[0].version" } }
            - { call: "POST /respite/vouchers", payload: { allocation_id: "${alloc}", caregiver_id: "${cg}", authorized_hours: 10 }, as: Caregiver, as_user_id: "${cg}", captures: { vch: $.data.id } }
          trigger:
            - { call: "POST /respite/allocations/${alloc}/grant-adjustments", payload: { delta_hours: 10, reason: "stale view", expected_allocation_version: "${alloc_v}" }, as: Coordinator, captures: { err: $.data.error_id } }
            - { call: "GET /respite/allocations/${alloc}", as: Coordinator, captures: { alloc_v2: $.data.version, alloc_granted: $.data.granted_hours } }
            - { call: "POST /respite/allocations/${alloc}/grant-adjustments", payload: { delta_hours: 10, reason: "fresh view", expected_allocation_version: "${alloc_v2}" }, as: Coordinator, captures: { alloc_granted2: $.data.granted_hours } }
          assert:
            - "stale adjustment error_id == ERR_STALE_VERSION"
            - "HTTP status == 412"
            - "Allocation.${alloc}.granted_hours was 80.00 before the fresh adjustment"
            - "fresh adjustment succeeds: granted_hours == 90.00"

      - name: selector_tiebreak_created_at_asc
        claim_type: selector_policy
        grounds: [calculations.auto_match_selector]
        distinguishing_aspect: "With two eligible ACTIVE providers holding equal (null) quality scores, the AUTO matcher picks the provider with the earlier created_at (prov1 created one clock-minute before prov2) and stamps auto_matched true."
        test_recipe:
          setup: ["Caregiver ACTIVE with allocation and 10.00h voucher; prov1 created at 2026-05-01T00:00:00Z, prov2 at 2026-05-01T00:01:00Z; both ACTIVE with windows covering 2026-05-06 10:00-12:00"]
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin, captures: { prog: $.data.id } }
            - { call: "POST /respite/caregivers", payload: { full_name: "Ann Care", email: "ann@x.com", care_recipient_name: "Bob Care", care_recipient_condition: "dementia" }, as: Anonymous, captures: { cg: $.data.id } }
            - { call: "POST /respite/caregivers/${cg}/eligibility-applications", payload: { need_score: 8 }, as: Caregiver, as_user_id: "${cg}", captures: { app: $.data.id } }
            - { call: "POST /respite/eligibility-applications/${app}/review-decisions", payload: { action: "APPROVE" }, as: Coordinator }
            - { call: "GET /respite/caregivers/${cg}/allocations", as: Coordinator, captures: { alloc: "$.data[0].id" } }
            - { call: "POST /respite/vouchers", payload: { allocation_id: "${alloc}", caregiver_id: "${cg}", authorized_hours: 10 }, as: Caregiver, as_user_id: "${cg}", captures: { vch: $.data.id } }
            - { call: "POST /respite/providers", payload: { name: "Prov First", credential_level: "STANDARD", service_zip: "94110" }, as: Anonymous, captures: { prov1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:01:00Z" }, as: FunderAdmin }
            - { call: "POST /respite/providers", payload: { name: "Prov Second", credential_level: "STANDARD", service_zip: "94110" }, as: Anonymous, captures: { prov2: $.data.id } }
            - { call: "POST /respite/providers/${prov1}/status-transitions", payload: { target_status: "ACTIVE" }, as: Coordinator }
            - { call: "POST /respite/providers/${prov2}/status-transitions", payload: { target_status: "ACTIVE" }, as: Coordinator }
            - { call: "POST /respite/providers/${prov1}/availability-windows", payload: { start_at: "2026-05-06T08:00:00Z", end_at: "2026-05-06T20:00:00Z", capacity: 1 }, as: Provider, as_user_id: "${prov1}", captures: { win1: $.data.id } }
            - { call: "POST /respite/providers/${prov2}/availability-windows", payload: { start_at: "2026-05-06T08:00:00Z", end_at: "2026-05-06T20:00:00Z", capacity: 1 }, as: Provider, as_user_id: "${prov2}", captures: { win2: $.data.id } }
          trigger:
            - { call: "POST /respite/bookings", payload: { voucher_id: "${vch}", caregiver_id: "${cg}", match_mode: "AUTO", start_at: "2026-05-06T10:00:00Z", end_at: "2026-05-06T12:00:00Z" }, as: Caregiver, as_user_id: "${cg}", captures: { bk: $.data.id, bk_prov: $.data.provider_id, bk_auto: $.data.auto_matched, bk_win: $.data.window_id } }
          assert:
            - "Booking.${bk}.provider_id == ${prov1}"
            - "Booking.${bk}.auto_matched == true"
            - "Booking.${bk}.window_id == ${win1}"
            - "Booking.${bk}.status == PENDING_CONFIRMATION"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_voucher_buckets
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model, entities.Allocation.fields.available_hours]
        distinguishing_aspect: "Immediate consistency: the GET /respite/allocations/{id} issued directly after voucher creation already reflects available 60.00 / reserved 20.00 — no lag, no reconciliation pass."
        test_recipe:
          setup: ["Caregiver ACTIVE with fresh 80.00h allocation"]
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin, captures: { prog: $.data.id } }
            - { call: "POST /respite/caregivers", payload: { full_name: "Ann Care", email: "ann@x.com", care_recipient_name: "Bob Care", care_recipient_condition: "dementia" }, as: Anonymous, captures: { cg: $.data.id } }
            - { call: "POST /respite/caregivers/${cg}/eligibility-applications", payload: { need_score: 8 }, as: Caregiver, as_user_id: "${cg}", captures: { app: $.data.id } }
            - { call: "POST /respite/eligibility-applications/${app}/review-decisions", payload: { action: "APPROVE" }, as: Coordinator }
            - { call: "GET /respite/caregivers/${cg}/allocations", as: Coordinator, captures: { alloc: "$.data[0].id" } }
          trigger:
            - { call: "POST /respite/vouchers", payload: { allocation_id: "${alloc}", caregiver_id: "${cg}", authorized_hours: 20 }, as: Caregiver, as_user_id: "${cg}", captures: { vch: $.data.id } }
            - { call: "GET /respite/allocations/${alloc}", as: Coordinator, captures: { avail: $.data.available_hours, res: $.data.reserved_hours } }
          assert:
            - "Allocation.${alloc}.available_hours == 60.00"
            - "Allocation.${alloc}.reserved_hours == 20.00"
