  # =======================================================================
  # Consistency model
  # =======================================================================
  - section: consistency_model
    instances:
      - name: corner_allocation_response_is_already_final
        claim_type: immediate_consistency
        grounds: [calculations.total_due_cents, entities.Cycle.fields.total_due_cents]
        distinguishing_aspect: "The POST /cycles/{id}/allocate response body already carries subtotal 2400, shipping 599 and total_due 2999, and an immediately following GET /cycles/{id} returns byte-identical money fields — nothing is reconciled later."
        test_recipe:
          setup: ["One ACTIVE subscription with its first cycle generated."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Plan", default_pack_count: 2, promo_discount_pct: 0, allows_hypoallergenic: true }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /skus"
              payload: { code: "S2-STD-60", name: "Stage 2 Standard 60", stage: "S2", line: "STANDARD", pack_price_cents: 1200, pack_size_units: 60, allergen_tags: [], stock_packs: 50 }
              as: OpsAdmin
              captures: { sku_std: $.data.id }
            - call: "POST /accounts"
              payload: { email: "immed@example.com", full_name: "Immediate Household", payment_method_on_file: true }
              as: Anonymous
              captures: { acct_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /accounts/${acct_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /children"
              payload: { account_id: "${acct_id}", name: "Rin", birth_date: "2025-11-01", weight_grams: 7000 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { child_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acct_id}", plan_id: "${plan_id}", child_id: "${child_id}", consumption_rate_per_day: 6, pack_count: 2 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "POST /subscriptions/${sub_id}/cycles"
              payload: {}
              as: OpsAdmin
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /cycles/${c1}/allocate"
              payload: {}
              as: OpsAdmin
              captures: { w_sub: $.data.subtotal_cents, w_ship: $.data.shipping_cents, w_due: $.data.total_due_cents }
            - call: "GET /cycles/${c1}"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { r_sub: $.data.subtotal_cents, r_ship: $.data.shipping_cents, r_due: $.data.total_due_cents }
          assert:
            - "${w_sub} == 2400 and ${r_sub} == 2400"
            - "${w_ship} == 599 and ${r_ship} == 599"
            - "${w_due} == 2999 and ${r_due} == 2999"

      - name: corner_stock_adjustment_reconciles_the_line_in_the_same_request
        claim_type: immediate_consistency
        grounds: [state_machines.CycleLine.ALLOCATED_to_SUBSTITUTION_PENDING, entities.Sku.fields.stock_packs]
        distinguishing_aspect: "A single stock adjustment both zeroes Sku.stock_packs and flips the dependent CycleLine to SUBSTITUTION_PENDING before the response is emitted; the very next GET /cycle-lines/{id} shows the new status with no intervening call."
        test_recipe:
          setup: ["One ALLOCATED cycle whose only line holds 2 packs of a SKU stocked at 50 (48 left after allocation), plus a fallback SKU at a higher price."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /plans"
