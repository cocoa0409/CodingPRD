  # ===========================================================================
  # Cross-Cutting Complexity Layers - exactly the four layers declared in
  # complexity_profile.complexity_layers. Both §1.2.1 concurrency_rules get an
  # OCC stale-version instance keyed to their declared write_endpoint/occ_field.
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_placement_version_on_invoice_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules.invoice-create-stale-placement"
          - "errors[ERR_STALE_PLACEMENT_VERSION]"
          - "calculations.service_addendum_encumbrance"
          - "validations[priority=7]"
          - "endpoints.POST_tuition_invoices"
        distinguishing_aspect: |
          The first §1.2.1 rule, exercised on its declared write_endpoint with its declared occ_field.
          The version captured after activation (3) goes stale when the addendum is authorized (placement
          -> 4) because authorize writes addendum_encumbrance_cents. The billing agent still holds 3, so
          its invoice create must be refused with 412 - even though the create is otherwise perfectly
          legal, which the immediate retry with the refreshed version proves by returning 201. This is
          why the rule cannot be implemented as a state check.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z advanced to 2026-09-01T08:00:00Z then 2026-11-02T09:00:00Z."
            - "DistrictFiscalAccount FY2027 authorized_cents 100000000 and one ACTIVE DAY Placement (create 1, execute-contract 2, activate 3 -> version 3)."
            - "One VERIFIED AttendanceRecord 20/20/0, whose verification does NOT touch the placement version."
            - "The placement version captured as 3, and THEN one ACTIVE SPEECH addendum (2.0 h/wk x 36 wk) authorized, taking the placement to version 4."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
