            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/retrofit-projects"
              payload: { measure_type: "ECM_MOTORS", capex_usd: 240240.00, projected_annual_savings_kwh: 520000.00 }
              as: EnergyAnalyst
              as_user_id: "u_analyst_rt"
              captures: { rp_id: "$.data.id" }
            - call: "POST /energy-ops/retrofit-projects/${rp_id}/approve"
              payload: { decision: "APPROVE" }
              as: EnergyManager
              as_user_id: "u_mgr_rt"
              captures: { rp_state: "$.data.state", rp_basis: "$.data.priority_basis", rp_score: "$.data.priority_score" }
          trigger:
            call: "POST /energy-ops/retrofit-projects/${rp_id}/submit-measurement"
            payload: { install_completed_iso: "2026-05-01T00:00:00Z", baseline_period_kwh: 100000.00, post_period_kwh: 30000.00, mv_period_days: 59 }
            as: EnergyAnalyst
            captures: { err: "$.data.error_id" }
          assert: |
            Setup: ${rp_state} == "APPROVED", ${rp_basis} == "RISK_ADJUSTED",
            ${rp_score} == 50.6 (48620.00 / 4.94, no refrigeration faults).
            Trigger (mv_period_days 59): 422, data.error_id ==
            "ERR_MV_PERIOD_TOO_SHORT"; GET /energy-ops/stores/${store_id}/retrofit-projects
            shows the project still "APPROVED" with adjusted_baseline_kwh null,
            measured_savings_kwh null and realization_rate null, and the store's
            verified_savings_kwh_ytd still 0.0 with
            portfolio_realization_rate still 0.85.
            Same test, second refusal: the same body with mv_period_days 90 but
            install_completed_iso "2026-09-01T00:00:00Z" (after the clock) ->
            422 "ERR_MV_PERIOD_TOO_SHORT" as well.
            Same test, admitted at the inclusive boundary: install_completed_iso
            "2026-05-01T00:00:00Z", baseline_period_kwh 100000.00,
            post_period_kwh 30000.00, mv_period_days 60 -> 200 with
            adjusted_baseline_kwh 100000.00 (MIXED factor 1.00),
            measured_savings_kwh 70000.00, expected 85479.45 (520000.00 * 60 /
            365), realization_rate 0.8189 and state "VERIFIED"; the store's
            verified_savings_kwh_ytd becomes 70000.0 and
            portfolio_realization_rate 0.8189.

      - name: a_tariff_switch_effective_at_or_before_the_clock_is_refused
        claim_type: error_triggerable
        grounds: "§1.6 ERR_TARIFF_LOCK_ACTIVE (409); §1.4 priority 111 (clock < tariff_locked_until_iso, and effective_from_iso must be strictly after the clock)"
        distinguishing_aspect: |
          Priority 111 sits BELOW the justification check at 122, so a switch
          whose effective date is not in the future must report the lock code
          even on an account whose candidate tariff would otherwise be approved -
          and, on the account that fails both, the lock code still wins. The
          boundary is strict: effective_from_iso exactly equal to the clock is
          refused, one second later is admitted.
        test_recipe:
          setup: |
            store; TOU_DEMAND account 0.1450 / 0.0800 / 14.50 with the CHEAPER
            candidate 0.1100 / 0.0700 / 11.00 (annual delta -144058.92, so the
            justification check at 122 passes); one on-peak interval of 1200.0;
            one bill recomputed to VALIDATED at 58208.15; clock
            2026-08-01T00:00:00Z; tariff_locked_until_iso is null throughout.
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-TL", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Statewide Power", rate_schedule_code: "GS-3", rate_family: "TOU_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450, rate_off_peak: 0.0800, candidate_rate_schedule_code: "GS-9", candidate_rate_family: "TOU_DEMAND", candidate_demand_charge_per_kw: 11.00, candidate_rate_on_peak: 0.1100, candidate_rate_off_peak: 0.0700 }
              as: EnergyManager
              captures: { acct_id: "$.data.id", acct_v1: "$.data.version" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-intervals"
              payload: { intervals: [ { interval_start_iso: "2026-06-15T14:00:00Z", kw_demand: 1200.0, is_on_peak: true } ] }
              as: EnergyAnalyst
            - call: "POST /energy-ops/utility-accounts/${acct_id}/utility-bills"
              payload: { period_start_iso: "2026-06-01T00:00:00Z", period_end_iso: "2026-07-01T00:00:00Z", on_peak_kwh: 144000, off_peak_kwh: 216000, billed_kwh: 360000, billed_peak_kw: 1200.0, billed_amount_usd: 58208.15 }
              as: EnergyAnalyst
              captures: { bill_id: "$.data.id" }
            - call: "POST /energy-ops/utility-bills/${bill_id}/recompute"
              payload: {}
              as: EnergyAnalyst
              captures: { bill_state: "$.data.validation_state" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/tariff-switch"
              payload: { effective_from_iso: "2026-07-01T00:00:00Z", expected_utility_account_version: "${acct_v1}" }
              as: EnergyManager
              captures: { e_past: "$.data.error_id" }
          trigger:
            call: "POST /energy-ops/utility-accounts/${acct_id}/tariff-switch"
            payload: { effective_from_iso: "2026-08-01T00:00:00Z", expected_utility_account_version: "${acct_v1}" }
            as: EnergyManager
            captures: { err: "$.data.error_id" }
          assert: |
            Setup: ${bill_state} == "VALIDATED"; the account's
            tariff_locked_until_iso is null.
            Setup call 7 (effective_from_iso a month BEFORE the clock): 409,
            ${e_past} == "ERR_TARIFF_LOCK_ACTIVE".
            Trigger (effective_from_iso EXACTLY the clock): 409, data.error_id ==
            "ERR_TARIFF_LOCK_ACTIVE" - "strictly after" excludes equality; the
            justification check at priority 122 would have passed, so the code
            proves the ordering as well as the boundary.
            After both refusals GET /energy-ops/utility-accounts/${acct_id}
            still reports tariff_state "STABLE",
            tariff_switch_effective_from_iso null and version 1.
            Same test, admitted one second later: effective_from_iso
            "2026-08-01T00:00:01Z" with the same OCC token -> 200 with
            tariff_state "PENDING_SWITCH" and version 2.

      - name: monitoring_state_transitions_are_refused_outside_the_bypass_pair
        claim_type: error_triggerable
        grounds: "§1.6 ERR_CASE_STATE_INVALID (409); §1.4 priority 65 (BYPASSED only from ARMED, ARMED only from BYPASSED, a target equal to the current state rejected); §1.5 POST /energy-ops/refrigeration-cases/{id}/monitoring-state"
        distinguishing_aspect: |
          The monitoring dimension has three states but only TWO legal edges, and
          the illegal moves are the interesting ones: re-arming an already ARMED
          case is a no-op that must be refused rather than accepted, and a case
          in ALARM cannot be bypassed at all - a technician may not silence an
          open food-safety excursion by servicing the case. That second refusal
          is a cross-state guard: the case's own state was moved by the reading
          cascade, not by this endpoint.
        test_recipe:
          setup: |
            commissioned + activated store; case A left ARMED; case B driven to
            ALARM by two breaching readings.
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-MS", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/refrigeration-cases"
              payload: { case_code: "CASE-A", case_type: "LOW_TEMP", product_class: "FROZEN", alarm_high_f: 10.0, alarm_low_f: -20.0, product_value_usd: 4000.00 }
              as: EnergyManager
              captures: { case_a: "$.data.id", a_state: "$.data.monitoring_state" }
            - call: "POST /energy-ops/stores/${store_id}/refrigeration-cases"
              payload: { case_code: "CASE-B", case_type: "LOW_TEMP", product_class: "FROZEN", alarm_high_f: 10.0, alarm_low_f: -20.0, product_value_usd: 4000.00 }
              as: EnergyManager
              captures: { case_b: "$.data.id" }
            - call: "POST /energy-ops/refrigeration-cases/${case_b}/readings"
              payload: { temp_f: 12.0, reading_iso: "2026-08-01T04:00:00Z" }
              as: BmsGateway
              as_user_id: "${store_id}"
            - call: "POST /energy-ops/refrigeration-cases/${case_b}/readings"
              payload: { temp_f: 12.0, reading_iso: "2026-08-01T04:15:00Z" }
              as: BmsGateway
              as_user_id: "${store_id}"
              captures: { b_state: "$.data.monitoring_state", b_exc: "$.data.excursion_id" }
            - call: "POST /energy-ops/refrigeration-cases/${case_a}/monitoring-state"
              payload: { target_state: "ARMED" }
              as: MaintenanceTech
              captures: { e_same: "$.data.error_id" }
          trigger:
            call: "POST /energy-ops/refrigeration-cases/${case_b}/monitoring-state"
            payload: { target_state: "BYPASSED" }
            as: MaintenanceTech
            captures: { err: "$.data.error_id" }
          assert: |
            Setup: ${a_state} == "ARMED" (the declared initial state);
            ${b_state} == "ALARM" with ${b_exc} non-null.
            Setup call 11 (ARMED -> ARMED): 409, ${e_same} ==
            "ERR_CASE_STATE_INVALID" - a target equal to the current state is
            rejected, and case A's consecutive_breach_count is NOT reset as a
            side effect.
            Trigger (ALARM -> BYPASSED): 409, data.error_id ==
            "ERR_CASE_STATE_INVALID"; case B is still "ALARM" and its excursion
            is untouched.
            Same test, the two legal edges: ${case_a} ARMED -> BYPASSED returns
            200 with consecutive_breach_count 0, and BYPASSED -> ARMED returns
            200; a third call with { target_state: "ALARM" } returns 400
            "ERR_INVALID_REQUEST" because ALARM is not an accepted target_state
            for this endpoint.

  # ===========================================================================
  - section: rbac
    instances:

      - name: no_role_may_perform_another_roles_exclusive_operation
        claim_type: role_denied
        grounds: "§1.7 exclusive_operations of all seven roles; §1.4 priority 20 -> ERR_UNAUTHORIZED (403); §1.0 role_model segregation_of_duties"
        distinguishing_aspect: |
          The role model is segregation_of_duties, NOT hierarchical_override, so
          the denials run in BOTH directions: EnergyManager - the widest role in
          the matrix - cannot recompute a bill, and PlatformAdmin, which owns
          store onboarding and the clock, cannot close a food-safety excursion.
          Every call below targets an existing entity in a state that would
          accept the operation, so only the role check can fail, and each is
          asserted to leave no trace.
        test_recipe:
          setup: |
            commissioned + activated store with a published standard, an account
            with a RECEIVED bill, an ARMED case, a DETECTED fault and an OPEN
            excursion on a second case - every target valid for its operation.
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-RB", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "COLD", store_format: "EXPRESS", season: "WINTER", cooling_setpoint_f: 72.0, heating_setpoint_f: 66.0, deadband_f: 2.0, lighting_lux_target: 600 }
              as: EnergyManager
              captures: { std_draft: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Statewide Power", rate_schedule_code: "GS-3", rate_family: "TOU_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450, rate_off_peak: 0.0800 }
              as: EnergyManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/utility-bills"
              payload: { period_start_iso: "2026-06-01T00:00:00Z", period_end_iso: "2026-07-01T00:00:00Z", on_peak_kwh: 144000, off_peak_kwh: 216000, billed_kwh: 360000, billed_peak_kw: 1200.0, billed_amount_usd: 58208.15 }
              as: EnergyAnalyst
              captures: { bill_id: "$.data.id" }
            - call: "POST /energy-ops/stores/${store_id}/refrigeration-cases"
              payload: { case_code: "CASE-RB", case_type: "MEDIUM_TEMP", product_class: "DAIRY", alarm_high_f: 41.0, alarm_low_f: 28.0, product_value_usd: 3000.00 }
              as: EnergyManager
              captures: { case_id: "$.data.id" }
            - call: "POST /energy-ops/stores/${store_id}/fault-diagnostics"
              payload: { equipment_ref: "RACK-R", equipment_class: "REFRIGERATION", fault_code: "SUCTION-HI", severity: "MINOR", occurrence_count: 2, affected_load_kw: 20.0 }
              as: MaintenanceTech
              captures: { fault_id: "$.data.id" }
            - call: "POST /energy-ops/refrigeration-cases/${case_id}/readings"
              payload: { temp_f: 43.0, reading_iso: "2026-08-01T04:00:00Z" }
              as: BmsGateway
              as_user_id: "${store_id}"
            - call: "POST /energy-ops/refrigeration-cases/${case_id}/readings"
              payload: { temp_f: 43.0, reading_iso: "2026-08-01T04:15:00Z" }
              as: BmsGateway
              as_user_id: "${store_id}"
              captures: { exc_id: "$.data.excursion_id" }
            - call: "POST /energy-ops/setpoint-standards/${std_draft}/publish"
              payload: {}
              as: EnergyAnalyst
              captures: { e1: "$.data.error_id" }
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: MaintenanceTech
              captures: { e2: "$.data.error_id" }
            - call: "POST /energy-ops/utility-bills/${bill_id}/recompute"
              payload: {}
              as: EnergyManager
              captures: { e3: "$.data.error_id" }
            - call: "POST /energy-ops/excursions/${exc_id}/close"
              payload: {}
              as: PlatformAdmin
              captures: { e4: "$.data.error_id" }
            - call: "POST /energy-ops/refrigeration-cases/${case_id}/monitoring-state"
              payload: { target_state: "BYPASSED" }
              as: BmsGateway
              as_user_id: "${store_id}"
              captures: { e5: "$.data.error_id" }
            - call: "POST /energy-ops/refrigeration-cases/${case_id}/readings"
              payload: { temp_f: 39.0, reading_iso: "2026-08-01T05:00:00Z" }
              as: FoodSafetyOfficer
              captures: { e6: "$.data.error_id" }
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-NOPE", climate_zone: "MIXED", store_format: "EXPRESS", floor_area_sqft: 9000 }
              as: EnergyManager
              captures: { e7: "$.data.error_id" }
          trigger:
            call: "POST /energy-ops/fault-diagnostics/${fault_id}/triage"
            payload: { outcome: "WORK_ORDER" }
            as: StoreManager
            as_user_id: "${store_id}"
            captures: { e8: "$.data.error_id" }
          assert: |
            Every one of the eight cross-role calls returns 403 with
            data.error_id "ERR_UNAUTHORIZED":
              ${e1} EnergyAnalyst publishing a standard (EnergyManager only),
              ${e2} MaintenanceTech activating a BMS,
              ${e3} EnergyManager recomputing a bill (EnergyAnalyst only - the
                    model is NOT hierarchical, so the widest role is still denied),
              ${e4} PlatformAdmin closing an excursion (FoodSafetyOfficer only),
              ${e5} BmsGateway bypassing a case (MaintenanceTech only) - even
                    though this gateway serves exactly this store,
              ${e6} FoodSafetyOfficer posting a reading (BmsGateway only),
              ${e7} EnergyManager creating a store (PlatformAdmin only),
              ${e8} StoreManager triaging a fault (MaintenanceTech only).
            Nothing changed: ${std_draft} is still "DRAFT", the store is still
            bms_status "ACTIVE" (never re-activated) with the excursion still
            non-CLOSED, ${bill_id} is still "RECEIVED" with
            recomputed_amount_usd null, ${case_id} is still monitoring_state
            "ALARM" with last_reading_temp_f 43.0 and last_reading_iso
            "2026-08-01T04:15:00Z" (the FoodSafetyOfficer reading was not
            stored), ${fault_id} is still "DETECTED" with no work order, and
            GET /energy-ops/stores returns total_count 1.

      - name: shared_operations_admit_every_declared_role
        claim_type: role_allowed
        grounds: "§1.7 shared_operations: refrigeration-cases (PlatformAdmin + EnergyManager), fault-diagnostics (MaintenanceTech + BmsGateway), demand-intervals (BmsGateway + EnergyAnalyst), retrofit-projects (EnergyAnalyst + EnergyManager)"
        distinguishing_aspect: |
          The mirror of the denial matrix: four endpoints are shared by exactly
          two roles each, and BOTH must be admitted with identical semantics -
          an implementation that hard-codes one role per endpoint passes the
          denial tests and fails here. One of the four pairs mixes an opaque
          role with an entity-backed one (EnergyAnalyst and BmsGateway on
          demand-intervals), so the gateway's store scoping must not turn into a
          rejection when the account belongs to its own store.
        test_recipe:
          setup: "commissioned + activated store with a utility account"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-SH", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Statewide Power", rate_schedule_code: "GS-3", rate_family: "TOU_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450, rate_off_peak: 0.0800 }
              as: EnergyManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /energy-ops/stores/${store_id}/refrigeration-cases"
              payload: { case_code: "CASE-P1", case_type: "MEDIUM_TEMP", product_class: "PRODUCE", alarm_high_f: 41.0, alarm_low_f: 28.0, product_value_usd: 1500.00 }
              as: PlatformAdmin
              captures: { c_admin: "$.data.id" }
            - call: "POST /energy-ops/stores/${store_id}/refrigeration-cases"
              payload: { case_code: "CASE-P2", case_type: "MEDIUM_TEMP", product_class: "MEAT", alarm_high_f: 40.0, alarm_low_f: 28.0, product_value_usd: 2500.00 }
              as: EnergyManager
              captures: { c_mgr: "$.data.id" }
            - call: "POST /energy-ops/stores/${store_id}/fault-diagnostics"
              payload: { equipment_ref: "RACK-S1", equipment_class: "REFRIGERATION", fault_code: "SUPERHEAT", severity: "MINOR", occurrence_count: 2, affected_load_kw: 20.0 }
              as: MaintenanceTech
              captures: { f_tech: "$.data.id" }
            - call: "POST /energy-ops/stores/${store_id}/fault-diagnostics"
              payload: { equipment_ref: "RACK-S2", equipment_class: "REFRIGERATION", fault_code: "SUPERHEAT", severity: "MINOR", occurrence_count: 2, affected_load_kw: 20.0 }
              as: BmsGateway
              as_user_id: "${store_id}"
              captures: { f_gw: "$.data.id" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-intervals"
              payload: { intervals: [ { interval_start_iso: "2026-06-15T14:00:00Z", kw_demand: 1200.0, is_on_peak: true } ] }
              as: EnergyAnalyst
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-intervals"
              payload: { intervals: [ { interval_start_iso: "2026-06-15T14:15:00Z", kw_demand: 1190.0, is_on_peak: true } ] }
              as: BmsGateway
              as_user_id: "${store_id}"
            - call: "POST /energy-ops/stores/${store_id}/retrofit-projects"
              payload: { measure_type: "LED_RETROFIT", capex_usd: 240240.00, projected_annual_savings_kwh: 520000.00 }
              as: EnergyAnalyst
              as_user_id: "u_analyst_rt"
              captures: { rp_analyst: "$.data.id", rp_a_score: "$.data.priority_score" }
          trigger:
            call: "POST /energy-ops/stores/${store_id}/retrofit-projects"
            payload: { measure_type: "CASE_DOORS", capex_usd: 240240.00, projected_annual_savings_kwh: 520000.00 }
            as: EnergyManager
            as_user_id: "u_mgr_rt"
            captures: { rp_mgr: "$.data.id", rp_m_score: "$.data.priority_score" }
          assert: |
            Every setup call above returns 201/200 - no ERR_UNAUTHORIZED
            anywhere.
            GET /energy-ops/stores/${store_id}/refrigeration-cases: total_count
            2, containing ${c_admin} and ${c_mgr}, both ARMED.
            GET /energy-ops/stores/${store_id}/fault-diagnostics: total_count 2,
            containing ${f_tech} and ${f_gw}, both DETECTED with fault_score
            39.2 - the score does not depend on who reported it.
            GET /energy-ops/utility-accounts/${acct_id}/demand-intervals:
            total_count 2 - the analyst-ingested and gateway-ingested rows sit in
            the same table with the same shape.
            Trigger: 201. ${rp_m_score} == ${rp_a_score} == 58.0 and both
            projects are PROPOSED with priority_basis SIMPLE_PAYBACK, but
            proposed_by_user_id is "u_analyst_rt" on ${rp_analyst} and
            "u_mgr_rt" on ${rp_mgr} - the identity is recorded per row, which is
            what the later segregation-of-duties check reads.

      - name: entity_backed_roles_are_confined_to_their_own_store
        claim_type: role_denied
        grounds: "§1.7 kind entity_backed:Store for StoreManager and BmsGateway; §1.4 priority 52 -> ERR_STORE_SCOPE_VIOLATION (403) on lighting-overrides, readings, excursion acknowledge and GET /energy-ops/stores/{id}"
        distinguishing_aspect: |
          For the two entity-backed roles the X-User-ID is DATA, not just a
          role tag, so authorisation splits in two: the role check at priority 20
          passes and a second check at priority 52 compares the caller's store
          against the target's store - including for a target reached
          INDIRECTLY, where the excursion's store is two hops away
          (excursion -> case -> store). The same calls from the owning store must
          succeed, which is what separates a scope check from a blanket denial.
        test_recipe:
          setup: |
            two commissioned + activated stores, A and B, each with a case; store
            A's case is driven to an OPEN excursion by two breaching readings
            from A's own gateway.
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-A", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_a: "$.data.id", a_v1: "$.data.version" }
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-B", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 130000 }
              as: PlatformAdmin
              captures: { store_b: "$.data.id", b_v1: "$.data.version" }
            - call: "POST /energy-ops/stores/${store_a}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${a_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_a}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_b}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${b_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_b}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_a}/refrigeration-cases"
              payload: { case_code: "CASE-A1", case_type: "MEDIUM_TEMP", product_class: "DAIRY", alarm_high_f: 41.0, alarm_low_f: 28.0, product_value_usd: 3000.00 }
              as: EnergyManager
              captures: { case_a: "$.data.id" }
            - call: "POST /energy-ops/refrigeration-cases/${case_a}/readings"
              payload: { temp_f: 43.0, reading_iso: "2026-08-01T04:00:00Z" }
              as: BmsGateway
              as_user_id: "${store_a}"
            - call: "POST /energy-ops/refrigeration-cases/${case_a}/readings"
              payload: { temp_f: 43.0, reading_iso: "2026-08-01T04:15:00Z" }
              as: BmsGateway
              as_user_id: "${store_a}"
              captures: { exc_a: "$.data.excursion_id" }
            - call: "POST /energy-ops/refrigeration-cases/${case_a}/readings"
              payload: { temp_f: 43.0, reading_iso: "2026-08-01T04:30:00Z" }
              as: BmsGateway
              as_user_id: "${store_b}"
              captures: { e_read: "$.data.error_id" }
            - call: "POST /energy-ops/stores/${store_a}/lighting-overrides"
              payload: { zone: "SALES_FLOOR", override_type: "OCCUPANCY_DISABLE", start_iso: "2026-08-02T00:00:00Z", end_iso: "2026-08-02T06:00:00Z", zone_load_kw: 20.0, requested_reason: "cross-store attempt" }
              as: StoreManager
              as_user_id: "${store_b}"
              captures: { e_ov: "$.data.error_id" }
            - call: "GET /energy-ops/stores/${store_a}"
              payload: {}
              as: StoreManager
              as_user_id: "${store_b}"
              captures: { e_get: "$.data.error_id" }
          trigger:
            call: "POST /energy-ops/excursions/${exc_a}/acknowledge"
            payload: {}
            as: StoreManager
            as_user_id: "${store_b}"
            captures: { e_ack: "$.data.error_id" }
          assert: |
            ${e_read} == "ERR_STORE_SCOPE_VIOLATION" (403) - store B's gateway
            cannot post a reading against store A's case, and store A's case
            still has last_reading_iso "2026-08-01T04:15:00Z" with
            consecutive_breach_count 2.
            ${e_ov} == "ERR_STORE_SCOPE_VIOLATION" (403) - and store A's
            override_kwh_used_month is still 0.0 while store B has no override.
            ${e_get} == "ERR_STORE_SCOPE_VIOLATION" (403) on a pure read.
            Trigger: 403, ${e_ack} == "ERR_STORE_SCOPE_VIOLATION" - the scope is
            resolved through excursion -> case -> store, two hops from the path
            id; the excursion is still "OPEN" with acknowledged_by_user_id null.
            Same test, the owning store succeeds: the identical acknowledge with
            X-User-ID ${store_a} returns 200 with state "ACKNOWLEDGED" and
            acknowledged_by_user_id ${store_a}; the identical lighting-override
            create against ${store_b} with X-User-ID ${store_b} returns 201; and
            GET /energy-ops/stores/${store_b} as StoreManager ${store_b} returns
            200.
            Ordering: the same cross-store acknowledge sent for an UNKNOWN
            excursion id returns 404 "ERR_EXCURSION_NOT_FOUND" (priority 46
            before 52), and sent by a MaintenanceTech returns 403
            "ERR_UNAUTHORIZED" (priority 20 before 52).

      - name: portfolio_report_reads_are_denied_to_the_operational_roles
        claim_type: role_denied
        grounds: "§1.5 GET /energy-ops/benchmark-report and GET /energy-ops/utility-accounts/{id}/tariff-comparison, both roles [PlatformAdmin, EnergyManager, EnergyAnalyst]; §1.7 shared_operations wording 'read endpoints except tariff-comparison and benchmark-report'"
        distinguishing_aspect: |
          Two GET endpoints have a NARROWER role list than every other read in
          the API, so the usual shortcut - "all roles may read" - is wrong
          exactly twice. Cross-store energy benchmarking and tariff economics are
          portfolio information: a store manager, a food-safety officer, a
          technician and a gateway are each denied, while the three portfolio
          roles are admitted on the same fixture.
        test_recipe:
          setup: "one store with a utility account carrying a candidate tariff"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-RP", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Statewide Power", rate_schedule_code: "GS-3", rate_family: "TOU_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450, rate_off_peak: 0.0800, candidate_rate_schedule_code: "GS-9", candidate_rate_family: "TOU_DEMAND", candidate_demand_charge_per_kw: 11.00, candidate_rate_on_peak: 0.1100, candidate_rate_off_peak: 0.0700 }
              as: EnergyManager
              captures: { acct_id: "$.data.id" }
            - call: "GET /energy-ops/benchmark-report"
              payload: {}
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { e_sm: "$.data.error_id" }
            - call: "GET /energy-ops/benchmark-report"
              payload: {}
              as: FoodSafetyOfficer
              captures: { e_fso: "$.data.error_id" }
            - call: "GET /energy-ops/benchmark-report"
              payload: {}
              as: MaintenanceTech
              captures: { e_mt: "$.data.error_id" }
            - call: "GET /energy-ops/utility-accounts/${acct_id}/tariff-comparison"
              payload: {}
              as: BmsGateway
              as_user_id: "${store_id}"
              captures: { e_gw: "$.data.error_id" }
          trigger:
            call: "GET /energy-ops/utility-accounts/${acct_id}/tariff-comparison"
            payload: {}
            as: MaintenanceTech
            captures: { e_mt2: "$.data.error_id" }
          assert: |
            ${e_sm}, ${e_fso}, ${e_mt}, ${e_gw} and the trigger's ${e_mt2} are
            all 403 with data.error_id "ERR_UNAUTHORIZED" - and the gateway is
            denied even though the account belongs to its OWN store, so the
            403 is a role decision, not a scope decision (never
            ERR_STORE_SCOPE_VIOLATION).
            Same test, the three portfolio roles are admitted: GET
            /energy-ops/benchmark-report as PlatformAdmin, EnergyManager and
            EnergyAnalyst each return 200, and GET
            /energy-ops/utility-accounts/${acct_id}/tariff-comparison as each of
            the three returns 200 with reference_bill_id null (no VALIDATED bill
            exists yet) rather than an error.
            By contrast GET /energy-ops/stores/${store_id}/refrigeration-cases as
            MaintenanceTech returns 200 - the narrowing applies to exactly these
            two reads.

      - name: a_retrofit_proposer_may_not_approve_their_own_project
        claim_type: segregation_of_duties
        grounds: "§1.7 role_model segregation_of_duties; §1.4 priority 54 -> ERR_SEGREGATION_OF_DUTIES (403) on POST /energy-ops/retrofit-projects/{id}/approve; §1.5 retrofit create side effect proposed_by_user_id = X-User-ID"
        distinguishing_aspect: |
          Capital approval is the second SoD pair in the API, and it is the
          harder one because the SAME role holds both ends: retrofit creation is
          shared with EnergyManager, so one manager can legally propose and then
          try to approve. The check must therefore compare X-User-ID values, not
          roles. Priority 54 also sits ABOVE the commissioning guard at 92, so on
          a store that was never commissioned the self-approval reports the SoD
          code, and only a different manager gets as far as
          ERR_BMS_NOT_COMMISSIONED - which proves both guards were live.
        test_recipe:
          setup: |
            store X never commissioned and store Y commissioned + activated;
            u_mgr_dual proposes a retrofit on each (creation is shared with
            EnergyManager and needs no commissioning).
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-X", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 110000 }
              as: PlatformAdmin
              captures: { store_x: "$.data.id" }
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-Y", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_y: "$.data.id", y_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_y}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${y_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_y}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_x}/retrofit-projects"
              payload: { measure_type: "EMS_UPGRADE", capex_usd: 240240.00, projected_annual_savings_kwh: 520000.00 }
              as: EnergyManager
              as_user_id: "u_mgr_dual"
              captures: { rp_x: "$.data.id", x_proposer: "$.data.proposed_by_user_id" }
            - call: "POST /energy-ops/stores/${store_y}/retrofit-projects"
              payload: { measure_type: "EMS_UPGRADE", capex_usd: 240240.00, projected_annual_savings_kwh: 520000.00 }
              as: EnergyManager
              as_user_id: "u_mgr_dual"
              captures: { rp_y: "$.data.id" }
            - call: "POST /energy-ops/retrofit-projects/${rp_x}/approve"
              payload: { decision: "APPROVE" }
              as: EnergyManager
              as_user_id: "u_mgr_dual"
              captures: { e_sod_x: "$.data.error_id" }
            - call: "POST /energy-ops/retrofit-projects/${rp_x}/approve"
              payload: { decision: "APPROVE" }
              as: EnergyManager
              as_user_id: "u_mgr_other"
              captures: { e_bms_x: "$.data.error_id" }
          trigger:
            call: "POST /energy-ops/retrofit-projects/${rp_y}/approve"
            payload: { decision: "APPROVE" }
            as: EnergyManager
            as_user_id: "u_mgr_dual"
            captures: { e_sod_y: "$.data.error_id" }
          assert: |
            Setup: ${x_proposer} == "u_mgr_dual" on both projects, each PROPOSED
            with priority_score 58.0 and priority_basis "SIMPLE_PAYBACK".
            ${e_sod_x} == "ERR_SEGREGATION_OF_DUTIES" (403) on the
            NON-commissioned store - priority 54 precedes priority 92.
            ${e_bms_x} == "ERR_BMS_NOT_COMMISSIONED" (409) for a DIFFERENT
            manager on the same project, proving the commissioning guard was
            violated all along and only masked by the SoD check.
            Trigger: 403, ${e_sod_y} == "ERR_SEGREGATION_OF_DUTIES" on the fully
            commissioned store, where nothing else can be wrong; ${rp_y} is
            still PROPOSED with priority_basis "SIMPLE_PAYBACK", priority_score
            58.0 and approved_by_user_id null.
            Same test, the legal approval: the identical call with X-User-ID
            "u_mgr_other" returns 200 with state "APPROVED", priority_basis
            "RISK_ADJUSTED", priority_score 50.6 and approved_by_user_id
            "u_mgr_other" - so the refusal was about identity, not about the
            project.

      - name: bill_adjustment_requires_a_second_pair_of_eyes
        claim_type: segregation_of_duties
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / segregation_of_duties_outranks_bill_state_invalid"
          rationale: |
            The other SoD pair - the analyst who recomputed a bill may not
            authorise its adjustment - is driven by that difficulty instance,
            which additionally pins priority 54 above the bill-state check at 62
            by violating both in one request and then showing the mirror call
            returning ERR_BILL_STATE_INVALID. The retrofit-approval pair above
            covers the same_role_both_ends variant, so this corner needs no
            second recipe.

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_store_commissioning_rejects_a_view_that_predates_the_activation
        claim_type: optimistic_concurrency
        grounds: "§1.2.1 concurrency_rules.store-commissioning-stale-version (write_endpoint POST /energy-ops/stores/{id}/bms-commissioning, occ_field expected_store_version, ERR_STALE_STORE_VERSION 412); §1.2 Store.bms_status transitions bms_commission_initial and bms_restandardise"
        distinguishing_aspect: |
          Re-commissioning is a LEGITIMATE product operation - a store may be
          re-standardised while ACTIVE - so no state precondition can reject the
          second write and the version token is the only guard. The client's token
          went stale for a reason it never issued itself: the activation
          incremented the version. The same call then succeeds with the current
          token, proving the 412 was about staleness rather than about the
          transition.
        test_recipe:
          setup: |
            store created (version 1), commissioned with the published standard
            (version 2) and activated (version 3); the client still holds the
            version-1 token it read at creation.
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-OC", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
              captures: { store_v2: "$.data.version", status_2: "$.data.bms_status" }
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
              captures: { store_v3: "$.data.version", status_3: "$.data.bms_status" }
          trigger:
            call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
            payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
            as: EnergyManager
            captures: { err: "$.data.error_id" }
          assert: |
            Setup: ${store_v1} == 1, ${store_v2} == 2 with ${status_2} ==
            "COMMISSIONING", ${store_v3} == 3 with ${status_3} == "ACTIVE" -
            every write increments the version by exactly 1, including the
            activation, which takes no OCC token itself.
            Trigger (replaying the version-1 token): 412, data.error_id ==
            "ERR_STALE_STORE_VERSION"; GET /energy-ops/stores/${store_id} still
            shows bms_status "ACTIVE", version 3 and active_standard_id
            ${std_id} - the rejected write neither transitioned nor bumped.
            Same test, the current token succeeds: the identical call with
            expected_store_version ${store_v3} returns 200 with bms_status
            "COMMISSIONING" and version 4 (the re-standardisation is a legal
            transition from ACTIVE), and replaying ${store_v3} once more then
            returns 412 again.
            Same test, a token from the FUTURE: expected_store_version 99 also
            returns 412 "ERR_STALE_STORE_VERSION" - the check is equality with
            the stored version, not an ordering comparison.
            Ordering: with a stale token AND an unpublished standard the response
            is 412 (priority 72 precedes 90); with a stale token and an unknown
            store id the response is 404 "ERR_STORE_NOT_FOUND" (priority 40
            precedes 72).

      - name: occ_tariff_switch_rejects_a_view_that_predates_the_pending_switch
        claim_type: optimistic_concurrency
        grounds: "§1.2.1 concurrency_rules.tariff-switch-stale-account-version (write_endpoint POST /energy-ops/utility-accounts/{id}/tariff-switch, occ_field expected_utility_account_version, ERR_STALE_ACCOUNT_VERSION 412); §1.4 priority 73"
        distinguishing_aspect: |
          The second OCC rule guards a write whose state precondition is
          deliberately absent: a switch scheduled while the account is already
          PENDING_SWITCH supersedes the pending one, so an implementation without
          the version check silently lets a client who never saw the first
          switch overwrite its effective date. Priority 73 also precedes the lock
          check at 111 and the justification check at 122, which the two mixed
          violations below pin down.
        test_recipe:
          setup: |
            store; TOU_DEMAND account 0.1450 / 0.0800 / 14.50 with the cheaper
            candidate 0.1100 / 0.0700 / 11.00; one on-peak interval of 1200.0;
            one bill recomputed to VALIDATED at 58208.15; one switch already
            scheduled for 2026-09-01, which took the account to version 2.
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-OA", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Statewide Power", rate_schedule_code: "GS-3", rate_family: "TOU_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450, rate_off_peak: 0.0800, candidate_rate_schedule_code: "GS-9", candidate_rate_family: "TOU_DEMAND", candidate_demand_charge_per_kw: 11.00, candidate_rate_on_peak: 0.1100, candidate_rate_off_peak: 0.0700 }
              as: EnergyManager
              captures: { acct_id: "$.data.id", acct_v1: "$.data.version" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-intervals"
              payload: { intervals: [ { interval_start_iso: "2026-06-15T14:00:00Z", kw_demand: 1200.0, is_on_peak: true } ] }
              as: EnergyAnalyst
            - call: "POST /energy-ops/utility-accounts/${acct_id}/utility-bills"
              payload: { period_start_iso: "2026-06-01T00:00:00Z", period_end_iso: "2026-07-01T00:00:00Z", on_peak_kwh: 144000, off_peak_kwh: 216000, billed_kwh: 360000, billed_peak_kw: 1200.0, billed_amount_usd: 58208.15 }
              as: EnergyAnalyst
              captures: { bill_id: "$.data.id" }
            - call: "POST /energy-ops/utility-bills/${bill_id}/recompute"
              payload: {}
              as: EnergyAnalyst
              captures: { bill_state: "$.data.validation_state" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/tariff-switch"
              payload: { effective_from_iso: "2026-09-01T00:00:00Z", expected_utility_account_version: "${acct_v1}" }
              as: EnergyManager
              captures: { acct_v2: "$.data.version", t_state: "$.data.tariff_state", eff_1: "$.data.tariff_switch_effective_from_iso" }
          trigger:
            call: "POST /energy-ops/utility-accounts/${acct_id}/tariff-switch"
            payload: { effective_from_iso: "2026-10-01T00:00:00Z", expected_utility_account_version: "${acct_v1}" }
            as: EnergyManager
            captures: { err: "$.data.error_id" }
          assert: |
            Setup: ${bill_state} == "VALIDATED"; ${acct_v1} == 1, ${acct_v2} == 2,
            ${t_state} == "PENDING_SWITCH", ${eff_1} ==
            "2026-09-01T00:00:00Z".
            Trigger (a second writer replaying the version-1 token): 412,
            data.error_id == "ERR_STALE_ACCOUNT_VERSION"; GET
            /energy-ops/utility-accounts/${acct_id} still reports
            tariff_switch_effective_from_iso "2026-09-01T00:00:00Z" and version
            2 - the pending switch was NOT overwritten.
            Same test, the current token supersedes legitimately: the identical
            call with expected_utility_account_version ${acct_v2} returns 200,
            tariff_state stays "PENDING_SWITCH",
            tariff_switch_effective_from_iso becomes "2026-10-01T00:00:00Z" and
            version becomes 3.
            Ordering with the two later checks, both using the STALE
            ${acct_v1} token:
              effective_from_iso "2026-08-01T00:00:00Z" (== the clock, which
              alone would give ERR_TARIFF_LOCK_ACTIVE at priority 111) -> 412
              "ERR_STALE_ACCOUNT_VERSION";
              the same stale token on a DIFFERENT account whose candidate tariff
              is more expensive (which alone would give
              ERR_TARIFF_SWITCH_NOT_JUSTIFIED at priority 122) -> 412 as well.

      - name: the_clock_sweep_activates_expires_and_completes_then_reports_zeros
        claim_type: scheduled_actions
        grounds: "§1.5 POST /energy-ops/_clock/set_current_utc (sweep steps 1-4, idempotency, output counters); §1.2 LightingOverride SCHEDULED -> ACTIVE -> EXPIRED and DemandResponseEvent ACTIVE -> COMPLETED; §1.3 store_energy_posture"
        distinguishing_aspect: |
          Every scheduled action in this API is driven by one endpoint whose
          response is a COUNTER per sweep step, so the test can distinguish "the
          sweep ran and found nothing" from "the sweep never ran": each advance
          reports exactly which rows moved, and re-setting the clock to the SAME
          value must report zeros while leaving the already-moved rows alone. The
          expiry step also proves an asymmetry with revocation - an EXPIRED
          override KEEPS its projected_kwh charged against the monthly budget,
          while a revoked one releases it.
        test_recipe:
          setup: |
            commissioned + activated store; a SALES_FLOOR override scheduled for
            2026-08-02T02:00Z..08:00Z with zone_load_kw 20.0 (projected 120.00
            kWh); an account with an event for 2026-08-02T10:00Z..12:00Z that is
            notified and activated at 10:00.
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-SW", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Statewide Power", rate_schedule_code: "GS-3", rate_family: "TOU_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450, rate_off_peak: 0.0800 }
              as: EnergyManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-intervals"
              payload: { intervals: [ { interval_start_iso: "2026-07-15T14:00:00Z", kw_demand: 1200.0, is_on_peak: true } ] }
              as: EnergyAnalyst
            - call: "POST /energy-ops/stores/${store_id}/lighting-overrides"
              payload: { zone: "SALES_FLOOR", override_type: "SCHEDULE_EXTEND", start_iso: "2026-08-02T02:00:00Z", end_iso: "2026-08-02T08:00:00Z", zone_load_kw: 20.0, requested_reason: "overnight restock" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { ov_id: "$.data.id", ov_state0: "$.data.state", ov_kwh: "$.data.projected_kwh" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-response-events"
              payload: { program_code: "DR-SW", curtailment_start_iso: "2026-08-02T10:00:00Z", curtailment_end_iso: "2026-08-02T12:00:00Z", target_reduction_kw: 200.0 }
              as: EnergyManager
              captures: { ev_id: "$.data.id" }
            - call: "POST /energy-ops/demand-response-events/${ev_id}/notify"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T03:00:00Z" }
              as: PlatformAdmin
              captures: { act_1: "$.data.overrides_activated", exp_1: "$.data.overrides_expired", done_1: "$.data.dr_events_completed", rec_1: "$.data.stores_posture_recomputed" }
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T10:00:00Z" }
              as: PlatformAdmin
              captures: { act_2: "$.data.overrides_activated", exp_2: "$.data.overrides_expired" }
            - call: "POST /energy-ops/demand-response-events/${ev_id}/activate"
              payload: {}
              as: EnergyManager
              captures: { ev_state: "$.data.event_state" }
          trigger:
            call: "POST /energy-ops/_clock/set_current_utc"
            payload: { current_utc: "2026-08-02T12:30:00Z" }
            as: PlatformAdmin
            captures: { done_3: "$.data.dr_events_completed", exp_3: "$.data.overrides_expired", act_3: "$.data.overrides_activated", rec_3: "$.data.stores_posture_recomputed", now_3: "$.data.current_utc" }
          assert: |
            At creation: ${ov_state0} == "SCHEDULED" (start_iso is after the
            clock) and ${ov_kwh} == 120.00, with the store's
            override_kwh_used_month already 120.0 - the budget is charged at
            request time, not at activation.
            First advance to 2026-08-02T03:00:00Z: ${act_1} == 1, ${exp_1} == 0,
            ${done_1} == 0, ${rec_1} == 1; the override is now "ACTIVE" and
            override_kwh_used_month is still 120.0.
            Second advance to 10:00: ${act_2} == 0 and ${exp_2} == 1 - the
            override's end_iso 08:00 is at or before the new clock, so step 3
            moved it to "EXPIRED"; override_kwh_used_month is STILL 120.0
            (expiry keeps the charge, unlike revocation).
            ${ev_state} == "ACTIVE" after the activation at exactly
            curtailment_start, and the store's energy_posture is "CURTAILED".
            Trigger (advance past curtailment_end): ${now_3} ==
            "2026-08-02T12:30:00Z", ${done_3} == 1, ${exp_3} == 0, ${act_3} == 0,
            ${rec_3} == 1; the event is "COMPLETED" with settlement_state
            "PENDING" and the store is back to energy_posture "NORMAL".
            Same test, idempotency: repeating the trigger with the identical
            current_utc "2026-08-02T12:30:00Z" returns 200 with
            dr_events_completed 0, overrides_activated 0, overrides_expired 0 and
            stores_posture_recomputed 0, and no entity changes.
            Same test, a jump that skips the window entirely: a fresh override
            scheduled for 2026-08-03T02:00Z..08:00Z followed by a single advance
            to 2026-08-03T09:00:00Z reports overrides_activated 0 and
            overrides_expired 1 - step 3 catches a still-SCHEDULED override whose
            window has fully passed.

      - name: the_reading_cascade_is_verified_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: "transitive_cascade / reading_escalation_cascade_depth_five"
          rationale: |
            The deepest chain in the API - reading -> breach counter -> excursion
            -> store posture -> demand-response opt-out -> account enrollment
            suspension - is driven end to end by that difficulty instance, which
            asserts each of the five links from a single request and checks the
            ordering by showing the intermediate posture after the shallower
            reading. fault_triage_cascade_depth_four and
            standard_publish_supersession_cascade_depth_three cover the other two
            cascades, and the consistency_model instance below asserts that the
            whole chain is visible in the triggering response.

      - name: both_calculation_variants_are_exercised_with_their_delta
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: "dual_variant_calc / bill_peak_basis_variant_divergence_on_utility_bill"
          rationale: |
            Both dual-variant calculations are covered by dedicated difficulty
            instances: this one holds the intervals fixed and switches
            rate_family so period_peak_demand's coincident_peak and anytime_peak
            variants diverge with a pinned delta, and
            retrofit_priority_basis_variant_divergence_on_capital_project does the
            same for retrofit_priority_score's simple_payback and risk_adjusted
            variants across the approval boundary. The calculations section adds
            the reconciliation half through
            verified_savings_ledger_reconciles_on_revocation.

      - name: cumulative_and_instantaneous_thresholds_are_tested_at_the_boundary
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: "boundary_precision_check / override_budget_exactly_at_allowance_admitted"
          rationale: |
            The cumulative threshold is the monthly override budget, tested at
            exactly 500.0 kWh by that difficulty instance (admitted at equality,
            rejected one kWh later, released by a revocation and then re-usable);
            the instantaneous thresholds are the inclusive alarm bound in
            reading_exactly_at_alarm_high_breaches and the exposure ladder at
            120 and 240 minutes. The fault_score urgent boundary at exactly 70.0
            and the suppression ceiling at exactly 50.0 are asserted in the
            calculations and errors sections above.

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: the_triage_response_already_reflects_the_whole_cascade
        claim_type: immediate
        grounds: "§1.0 consistency_model immediate; §1.5 POST /energy-ops/fault-diagnostics/{id}/triage inline output (fault_state, work_order_id, work_order_priority, work_order_state, store_bms_status, store_energy_posture, urgent_work_order_count, escalated_retrofit_count) and cascade links 1-4"
        distinguishing_aspect: |
          The consistency model is `immediate`, and the triage endpoint is where
          that is most visible: one request creates a work order, degrades the
          BMS, raises the store's posture and escalates every proposed retrofit,
          and the response object must ALREADY carry all four consequences -
          including counters that live on the grandparent Store. An
          implementation that persists the cascade but returns a
          pre-cascade projection (or defers the recompute to the next read) fails
          here while passing every follow-up GET, so the assertion pairs the
          response with the subsequent reads and requires them to agree.
        test_recipe:
          setup: |
            commissioned + activated store with two PROPOSED retrofit projects
            and one CRITICAL / occurrence_count 5 / affected_load_kw 60.0
            REFRIGERATION fault (fault_score 100.0 after the cap).
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-IM", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
              captures: { status_active: "$.data.bms_status", posture_0: "$.data.energy_posture" }
            - call: "POST /energy-ops/stores/${store_id}/retrofit-projects"
              payload: { measure_type: "CASE_DOORS", capex_usd: 240240.00, projected_annual_savings_kwh: 520000.00 }
              as: EnergyAnalyst
              as_user_id: "u_analyst_rt"
              captures: { rp1: "$.data.id", rp1_esc: "$.data.escalated_review" }
            - call: "POST /energy-ops/stores/${store_id}/retrofit-projects"
              payload: { measure_type: "ECM_MOTORS", capex_usd: 120000.00, projected_annual_savings_kwh: 260000.00 }
              as: EnergyAnalyst
              as_user_id: "u_analyst_rt"
              captures: { rp2: "$.data.id" }
            - call: "POST /energy-ops/stores/${store_id}/fault-diagnostics"
              payload: { equipment_ref: "RACK-IM", equipment_class: "REFRIGERATION", fault_code: "COMP-TRIP", severity: "CRITICAL", occurrence_count: 5, affected_load_kw: 60.0 }
              as: BmsGateway
              as_user_id: "${store_id}"
              captures: { fault_id: "$.data.id", f_score: "$.data.fault_score", f_state: "$.data.state" }
          trigger:
            call: "POST /energy-ops/fault-diagnostics/${fault_id}/triage"
            payload: { outcome: "WORK_ORDER" }
            as: MaintenanceTech
            captures: { t_state: "$.data.fault_state", t_wo: "$.data.work_order_id", t_pri: "$.data.work_order_priority", t_wo_state: "$.data.work_order_state", t_bms: "$.data.store_bms_status", t_posture: "$.data.store_energy_posture", t_urgent: "$.data.urgent_work_order_count", t_esc: "$.data.escalated_retrofit_count" }
          assert: |
            Setup: ${status_active} == "ACTIVE" with ${posture_0} == "NORMAL";
            ${rp1_esc} == false; ${f_score} == 100.0 (persistence 1.40,
            load_factor capped at 1.25, weighted 98.00, loaded 122.50, +15.00
            refrigeration bonus = 137.50, capped) and ${f_state} == "DETECTED".
            Trigger - ONE response carries the entire cascade:
              ${t_state}    == "TRIAGED"
              ${t_wo}       is non-null
              ${t_pri}      == "URGENT"        (100.0 >= 70.0)
              ${t_wo_state} == "OPEN"
              ${t_bms}      == "DEGRADED"      (link 2, REFRIGERATION + URGENT)
              ${t_posture}  == "CONSTRAINED"   (link 3, recomputed in-request)
              ${t_urgent}   == 1               (grandparent counter, link 2)
              ${t_esc}      == 2               (link 4, both PROPOSED projects)
            Every follow-up read agrees with that single response, with no
            second call needed to converge:
              GET /energy-ops/fault-diagnostics/${fault_id} -> state "TRIAGED",
              fault_score 100.0;
              GET /energy-ops/fault-diagnostics/${fault_id}/work-orders ->
              total_count 1, the row ${t_wo} with priority "URGENT" and state
              "OPEN";
              GET /energy-ops/stores/${store_id} -> bms_status "DEGRADED",
              energy_posture "CONSTRAINED", urgent_work_order_count 1;
              GET /energy-ops/stores/${store_id}/retrofit-projects?escalated_review=true
              -> total_count 2, containing ${rp1} and ${rp2}, both still
              "PROPOSED" with priority_basis "SIMPLE_PAYBACK" (escalation flags a
              project for review; it does not re-score or transition it).
            Same test, the store's own version advanced with the cascade, so a
            commissioning attempt replaying the pre-triage token now returns 412
            "ERR_STALE_STORE_VERSION" - the cascade's writes are visible to the
            concurrency layer in the same instant.
