  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: chair_half_open_overlap_rejected_adjacent_allowed
        grounds:
          - calculations.appointment_overlap
          - validations[priority=10]
          - errors[ERR_NO_TECH_AVAILABLE]
          - entities.Appointment.fields.end_utc
        distinguishing_aspect: |
          LashTech chair uses HALF-OPEN [start,end) interval semantics with NO buffer: a second
          appointment overlapping the first on the only tech is rejected (empty candidate set →
          ERR_NO_TECH_AVAILABLE), but an exactly-adjacent one (start == prior end) is accepted.
        test_recipe:
          setup:
            - "One tech, sanitized through far future; FULL_SET 120 min; first appt 10:00–12:00 booked."
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Glow" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /service-types"
              payload: { studio_id: "${studio_id}", code: "FULL_SET", name: "Full Set", duration_minutes: 120, base_price_cents: 12000, credit_cost: 4, category: "PREMIUM", requires_patch_test: false }
              as: StudioManager
              captures: { full_st_id: $.data.id }
            - call: "POST /lash-techs"
              payload: { studio_id: "${studio_id}", full_name: "Mara", skill_level: 3, station_number: 1 }
              as: StudioManager
              captures: { tech1_id: $.data.id }
            - call: "POST /sanitation-logs"
              payload: { lash_tech_id: "${tech1_id}", sanitized_at_utc: "2026-06-10T13:30:00Z" }
              as: StudioManager
            - call: "POST /members"
              payload: { studio_id: "${studio_id}", full_name: "Ada", email: "ada@x.com" }
              as: FrontDesk
              captures: { member_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T10:00:00Z" }
              as: StudioManager
            - call: "POST /appointments"
              payload: { member_id: "${member_id}", service_type_id: "${full_st_id}", start_utc: "2026-06-10T10:00:00Z", pay_with_credits: false }
              as: FrontDesk
              captures: { appt1_id: $.data.id, appt1_end: $.data.end_utc }
          trigger:
            - call: "POST /appointments"
              payload: { member_id: "${member_id}", service_type_id: "${full_st_id}", start_utc: "2026-06-10T11:30:00Z", pay_with_credits: false }
              as: FrontDesk
              captures: { overlap_err: $.data.error_id }
            - call: "POST /appointments"
              payload: { member_id: "${member_id}", service_type_id: "${full_st_id}", start_utc: "2026-06-10T12:00:00Z", pay_with_credits: false }
              as: FrontDesk
              captures: { adjacent_appt_id: $.data.id }
          assert:
            - "Appointment.${appt1_id}.end_utc == 2026-06-10T12:00:00Z"
            - "The overlapping 11:30 booking returns status 409 with data.error_id == ERR_NO_TECH_AVAILABLE"
            - "Appointment.${adjacent_appt_id}.status == BOOKED"
            - "Appointment.${adjacent_appt_id}.lash_tech_id == ${tech1_id}"

      - name: sanitation_closed_interval_boundary_inclusive
        grounds:
          - calculations.sanitation_window_coverage
          - validations[priority=9]
          - errors[ERR_STATION_NOT_SANITIZED]
          - entities.SanitationLog.fields.valid_through_utc
        distinguishing_aspect: |
          The station sanitation window uses a CLOSED interval (opposite geometry to the chair's
          half-open rule) and sits on a different resource (LashTech station, not the chair
          schedule): an appointment starting exactly at valid_through_utc (12h after sanitation)
          is covered and books, while one a second later fails ERR_STATION_NOT_SANITIZED.
        test_recipe:
          setup:
            - "Tech sanitized at 2026-06-10T08:00:00Z → valid_through 2026-06-10T20:00:00Z; FULL_SET 120 min."
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Glow" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /service-types"
              payload: { studio_id: "${studio_id}", code: "FULL_SET", name: "Full Set", duration_minutes: 120, base_price_cents: 12000, credit_cost: 4, category: "PREMIUM", requires_patch_test: false }
              as: StudioManager
              captures: { full_st_id: $.data.id }
            - call: "POST /lash-techs"
              payload: { studio_id: "${studio_id}", full_name: "Mara", skill_level: 3, station_number: 1 }
              as: StudioManager
              captures: { tech1_id: $.data.id }
            - call: "POST /sanitation-logs"
              payload: { lash_tech_id: "${tech1_id}", sanitized_at_utc: "2026-06-10T08:00:00Z" }
              as: StudioManager
              captures: { log_valid_through: $.data.valid_through_utc }
            - call: "POST /members"
              payload: { studio_id: "${studio_id}", full_name: "Ada", email: "ada@x.com" }
              as: FrontDesk
              captures: { member_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T10:00:00Z" }
              as: StudioManager
          trigger:
            - call: "POST /appointments"
              payload: { member_id: "${member_id}", service_type_id: "${full_st_id}", start_utc: "2026-06-10T20:00:00Z", pay_with_credits: false }
              as: FrontDesk
              captures: { boundary_appt_id: $.data.id }
          assert:
            - "SanitationLog.${tech1_id} log valid_through_utc == 2026-06-10T20:00:00Z"
            - "Appointment.${boundary_appt_id}.status == BOOKED (start exactly at valid_through_utc is covered)"
            - "Appointment.${boundary_appt_id}.lash_tech_id == ${tech1_id}"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: credit_consume_then_refund_conserves_balance
        grounds:
          - state_machines.Appointment.BOOKED_to_CANCELLED
          - calculations.credit_balance_and_book_gate
          - entities.CreditLedgerEntry.fields.delta
          - entities.Membership.fields.credit_balance
        distinguishing_aspect: |
          Conserved quantity = membership credit_balance (= sum of CreditLedgerEntry.delta).
          A credit FILL booking (CONSUME -1) followed by a timely cancel (REFUND +1) leaves
          credit_balance exactly equal to the pre-booking value; the ledger sum is the pinned
          invariant.
        test_recipe:
          setup:
            - "ACTIVE membership balance 8; FILL credit_cost=1, anchor present; timely cancel (>24h before start)."
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Glow", late_cancel_cutoff_hours: 24 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /membership-plans"
              payload: { studio_id: "${studio_id}", tier: "PREMIER", monthly_credit_allotment: 8, monthly_fee_cents: 9900 }
              as: StudioManager
              captures: { plan_id: $.data.id }
            - call: "POST /service-types"
              payload: { studio_id: "${studio_id}", code: "FULL_SET", name: "Full Set", duration_minutes: 120, base_price_cents: 12000, credit_cost: 4, category: "PREMIUM", requires_patch_test: false }
              as: StudioManager
              captures: { full_st_id: $.data.id }
            - call: "POST /service-types"
              payload: { studio_id: "${studio_id}", code: "FILL", name: "Fill", duration_minutes: 60, base_price_cents: 6000, credit_cost: 1, category: "STANDARD", requires_patch_test: false }
              as: StudioManager
              captures: { fill_st_id: $.data.id }
            - call: "POST /lash-techs"
              payload: { studio_id: "${studio_id}", full_name: "Mara", skill_level: 3, station_number: 1 }
              as: StudioManager
              captures: { tech1_id: $.data.id }
            - call: "POST /sanitation-logs"
              payload: { lash_tech_id: "${tech1_id}", sanitized_at_utc: "2026-06-01T09:00:00Z" }
              as: StudioManager
            - call: "POST /sanitation-logs"
              payload: { lash_tech_id: "${tech1_id}", sanitized_at_utc: "2026-06-10T08:00:00Z" }
              as: StudioManager
            - call: "POST /members"
              payload: { studio_id: "${studio_id}", full_name: "Ada", email: "ada@x.com" }
              as: FrontDesk
              captures: { member_id: $.data.id }
            - call: "POST /memberships"
              payload: { member_id: "${member_id}", plan_id: "${plan_id}", cycle_anchor_utc: "2026-01-15T00:00:00Z", initial_credits: 8 }
              as: FrontDesk
              captures: { ms_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: StudioManager
            - call: "POST /appointments"
              payload: { member_id: "${member_id}", service_type_id: "${full_st_id}", start_utc: "2026-06-01T10:00:00Z", pay_with_credits: false }
              as: FrontDesk
              captures: { full_appt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:30:00Z" }
              as: StudioManager
            - call: "POST /appointments/${full_appt_id}/complete"
              payload: {}
              as: LashTech
              as_user_id: "${tech1_id}"
            - call: "GET /memberships/${ms_id}"
              payload: {}
              as: FrontDesk
              captures: { ms_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T09:00:00Z" }
              as: StudioManager
            - call: "POST /appointments"
              payload: { member_id: "${member_id}", service_type_id: "${fill_st_id}", start_utc: "2026-06-09T10:00:00Z", pay_with_credits: true, membership_id: "${ms_id}", expected_membership_version: "${ms_v}" }
              as: FrontDesk
              captures: { fill_appt_id: $.data.id }
          trigger:
            - call: "POST /appointments/${fill_appt_id}/cancel"
              payload: {}
              as: FrontDesk
          assert:
            - "Appointment.${fill_appt_id}.status == CANCELLED"
            - "Membership.${ms_id}.credit_balance == 8"
            - "A CreditLedgerEntry with reason==CONSUME delta==-1 and one with reason==REFUND delta==1 both exist for membership ${ms_id} referencing ${fill_appt_id}; their deltas sum to 0"

      - name: recurring_spawn_then_cancel_conserves_schedule_slot
        grounds:
          - state_machines.RecurringFillSchedule.ACTIVE_to_ACTIVE
          - state_machines.Appointment.BOOKED_to_CANCELLED
          - entities.RecurringFillSchedule.fields.next_due_utc
          - entities.RecurringFillSchedule.fields.spawned_count
        distinguishing_aspect: |
          Conserved quantity = the recurring schedule slot pointer (next_due_utc + spawned_count),
          a different quantity than credit balance. spawn-next advances next_due_utc by cadence_days
          and spawned_count by 1; a timely cancel of that spawned fill rewinds both, restoring the
          schedule to its pre-spawn position.
        test_recipe:
          setup:
            - "ACTIVE membership balance 8; COMPLETED FULL_SET anchor 2026-06-01; ACTIVE RecurringFillSchedule cadence 14, first_start 2026-06-09T10:00:00Z; clock pre-spawn so the fill is timely-cancellable."
