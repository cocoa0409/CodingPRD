              as: TravelCoordinator
              captures: { leg_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg_id}/book"
              payload: {}
              as: TravelCoordinator
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg_id}/manifest"
              payload: { member_id: "${m1}", seat_assignment: "1A" }
              as: TravelCoordinator
              captures: { e1: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg_id}/manifest"
              payload: { member_id: "${m2}", seat_assignment: "1B" }
              as: TravelCoordinator
              captures: { e2: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/hotel-blocks"
              payload: { hotel_code: "HBOS", room_count: 4, rate_cents_per_night: 25000, check_in_date: "2026-12-19", night_count: 1, cutoff_date: "2026-12-15" }
              as: TravelCoordinator
