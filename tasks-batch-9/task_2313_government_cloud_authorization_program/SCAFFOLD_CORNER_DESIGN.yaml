  - name: confirming_a_data_category_twice_is_an_invalid_state
    claim_type: idempotency
    grounds:
    - state_machines.DataCategory.DECLARED_to_CONFIRMED
    - state_machines.DataCategory.DECLARED_to_WITHDRAWN
    - validations[priority=11]
    distinguishing_aspect: 'The confirm endpoint is not idempotent and is not in priority 12''s list: replaying CONFIRM on
      an already CONFIRMED row, and sending WITHDRAW after CONFIRM, both return ERR_INVALID_STATE, and neither re-runs the
      preliminary high-water-mark recomputation (the offering version stays put).'
    test_recipe:
      setup:
      - Clock 2026-02-01T00:00:00Z; DOT agency, MODERATE baseline and a DRAFT offering exist.
      - One DataCategory PII (MODERATE/MODERATE/LOW) already CONFIRMED by board-1, so offering.preliminary_impact_level ==
        MODERATE and offering.version == 3 (create 1 + category 2 + confirm 3).
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-02-01T00:00:00Z'
        as: ProgramBoardReviewer
        as_user_id: board-1
      - call: POST /agencies
        payload:
          name: Department of Transportation
          agency_code: DOT
          sponsorship_capacity: 3
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          agency_dot_id: $.data.id
      - call: POST /control-baselines
        payload:
          impact_level: MODERATE
          version_label: Rev5-MODERATE
          effective_from: '2026-01-01T00:00:00Z'
          families: *id001
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          baseline_mod_id: $.data.id
      - call: POST /offerings
        payload:
          name: GovCloud Compute
          provider_name: Aurora Cloud
          service_model: IAAS
          deployment_model: GOV_COMMUNITY
          assessment_budget_usd: 400000.0
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          offering_id: $.data.id
      - call: POST /offerings/${offering_id}/data-categories
        payload:
          category_code: PII
          confidentiality_impact: MODERATE
          integrity_impact: MODERATE
          availability_impact: LOW
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          dc_pii_id: $.data.id
      - call: POST /data-categories/${dc_pii_id}/confirm
        payload:
          decision: CONFIRM
        as: ProgramBoardReviewer
        as_user_id: board-1
      trigger:
      - call: POST /data-categories/${dc_pii_id}/confirm
        payload:
          decision: CONFIRM
        as: ProgramBoardReviewer
        as_user_id: board-2
        captures: *id002
      - call: POST /data-categories/${dc_pii_id}/confirm
        payload:
          decision: WITHDRAW
        as: AgencyAuthorizingOfficial
        as_user_id: ${agency_dot_id}
        captures: *id002
      assert:
      - 'both calls: HTTP 409 with error_id ERR_INVALID_STATE'
      - DataCategory.${dc_pii_id}.status == 'CONFIRMED' and confirmed_by_user_id == 'board-1' — not overwritten by board-2
        or by the agency official
      - CloudServiceOffering.${offering_id}.preliminary_impact_level == 'MODERATE' and version == 3 (no extra recomputation)
      - CloudServiceOffering.${offering_id}.status == 'DRAFT' and final_impact_level == null
