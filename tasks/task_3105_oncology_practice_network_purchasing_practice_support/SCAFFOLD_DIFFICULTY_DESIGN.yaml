              as: PracticeAdmin
              as_user_id: "pa-loess"
              captures: { o2_id: $.data.id }
            - call: "POST /networks/drug-purchase-orders/${o2_id}/confirm"
              payload: {}
              as: NetworkAdmin
            - call: "POST /networks/drug-purchase-orders/${o2_id}/ship"
              payload: {}
              as: NetworkAdmin
            - call: "POST /networks/drug-purchase-orders/${o2_id}/receive"
              payload: { lot_number: "L-2026-07D", expires_at: "2027-07-05T00:00:00Z" }
              as: PracticeAdmin
              as_user_id: "pa-loess"
              captures: { l2_id: $.data.id }
            - call: "POST /networks/patient-treatments"
              payload: { practice_id: "${p_id}", provider_id: "${pr_id}", drug_product_id: "${d2_id}", pathway_protocol_id: "${prot_id}", patient_reference: "PT-OOS-01", regimen_code: "ZOL-MONO", payer_name: "Cedar Mutual", administered_units: 500, dose_count: 1, vial_yield_units: 1, admin_fee_cents: 0, administered_at: "2026-07-10T00:00:00Z" }
              as: PracticeAdmin
              as_user_id: "pa-loess"
              captures: { t_id: $.data.id, p_v2: $.data.version }
            - call: "POST /networks/patient-treatments/${t_id}/administer"
              payload: { dose_plan: "P1", expected_practice_version: "${p_v2}" }
              as: PracticeAdmin
              as_user_id: "pa-loess"
            - call: "GET /networks/patient-treatments/${t_id}/claims"
              payload: { status: "DRAFT" }
              as: RevenueCycleManager
              captures: { cl_id: $.data.0.id }
            - call: "POST /networks/payer-claims/${cl_id}/submit"
              payload: { expected_practice_version: "${p_v2}" }
              as: RevenueCycleManager
            - call: "POST /networks/payer-claims/${cl_id}/adjudicate"
              payload: { paid_amount_cents: 500000 }
              as: PayerAdjudicator
          trigger:
            - call: "POST /networks/rebate-qualifications"
              payload: { practice_id: "${p_id}", rebate_program_id: "${prog_id}" }
              as: PracticeAdmin
              as_user_id: "pa-loess"
              captures: { q_id: $.data.id, q_share: $.data.market_share_pct, q_qual: $.data.is_qualified }
          assert:
            - "the qualification reports market_share_pct == 0.6032 — 760000 in-scope routed cents over a 1260000-cent denominator of drug purchases alone, because routing_includes_out_of_scope is false"
            - "with the agreement's routing term flipped to true the same 760000 routed cents over 1760000 give market_share_pct == 0.4318"
            - "is_qualified == true at the 0.50 threshold under the narrow denominator"
            - "RebateQualification.${q_id}.market_share_pct != 0.4318 while routing_includes_out_of_scope == false"
            - "compliance_score == 0.7500 under default weighting of 1/1/1 — reporting_timeliness 0.5 (the report was submitted after the epoch closed but inside the 30-day grace), pathway_adherence 0.75, price_transparency 1.0"
            - "compliance_score == 0.8750 when weight_transparency is set to 0, because price_transparency then leaves both numerator and denominator: (0.5 + 0.75) / 2"
            - "PayerClaim.${cl_id}.allowed_amount_cents == 500000 and status == ADJUDICATED_PAID"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: rebate_amount_rounding_order_b
        grounds:
          - calculations.rebate_qualification_amount
          - calculations.practice_compliance_score
          - entities.RebateQualification.fields.rebate_amount_cents
        distinguishing_aspect: "Combinatorial mode (b): the pinned rounding order is sum-then-round (ORDER B), which on three received orders of 12345 / 10000 / 5000 cents at rebate_pct 0.0177 yields 484 cents — while the equally defensible round-per-order-then-sum order (ORDER A) yields 485 on identical inputs."
        test_recipe:
          setup:
            - "Network N whose ladder places this practice at TIER_1; practice P with an ACTIVE TIER_1 agreement at discount_pct 0 and routing_includes_out_of_scope false; drug D at 12345 / 10000 / 5000 cents base price is not possible with one product, so the three orders use three products D1 12345, D2 10000, D3 5000, each received once; rebate program scoped ALL at rebate_pct 0.0177 with compliance_min_score 0.00 so qualification is not the variable under test; logical clock 2026-07-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks"
