          assert:
            - "${kr1_status} == SCHEDULED with ${loaded_0} == 0 at creation"
            - "${e_empty} == ERR_KILN_RUN_STATE_INVALID with HTTP 409 - firing a SCHEDULED run with no car loaded is refused even though the status itself admits start"
            - "${e_early_grade} == ERR_KILN_RUN_STATE_INVALID with HTTP 409 - grade requires FIRING"
            - "${loaded_1} == 9600 after the car is loaded"
