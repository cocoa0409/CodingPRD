scaffold_corner_design:
  # ============================================================
  # Section: entities — creation, defaults, computed fields, type constraints
  # ============================================================
  - section: entities
    instances:
      - name: client_creation_initializes_defaults
        claim_type: creation
        grounds: [entities.Client]
        distinguishing_aspect: "POST /studio/clients with only required fields initializes status=PROSPECT, account_credit_cents=0, lifetime_revision_count=0, version=1; id and created_at are server-minted"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: StudioManager
          trigger:
            - call: "POST /studio/clients"
              payload: { legal_name: "X Label", contact_email: "x@x.com" }
              as: StudioManager
              captures: { cid: $.data.id }
          assert:
            - "Client.${cid}.status == PROSPECT"
            - "Client.${cid}.account_credit_cents == 0"
            - "Client.${cid}.lifetime_revision_count == 0"
            - "Client.${cid}.version == 1"
            - "Client.${cid}.id is UUID format"

      - name: engineer_creation_defaults_availability_available
        claim_type: defaults
        grounds: [entities.Engineer]
        distinguishing_aspect: "Engineer availability_status defaults to AVAILABLE; active_project_count defaults to 0"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: StudioManager
          trigger:
            - call: "POST /studio/engineers"
              payload: { display_name: "E", tier: "JUNIOR", hourly_rate_cents: 50000, capacity_minutes_per_day: 240 }
              as: StudioManager
              captures: { eid: $.data.id }
          assert:
            - "Engineer.${eid}.availability_status == AVAILABLE"
            - "Engineer.${eid}.active_project_count == 0"

      - name: project_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.Project, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /studio/projects missing required target_platform_profile_id → ERR_INVALID_REQUEST 400"
        test_recipe:
          setup: ["Client exists"]
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: StudioManager
            - call: "POST /studio/clients"
              payload: { legal_name: "C", contact_email: "c@x.com" }
              as: StudioManager
              captures: { cli_id: $.data.id }
          trigger:
            - call: "POST /studio/projects"
              payload: { client_id: "${cli_id}", title: "P", scheduled_start_at: "2026-05-11T10:00:00Z", scheduled_duration_minutes: 60 }
              as: Client
              as_user_id: "${cli_id}"
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "http_status == 400"

      - name: project_upc_invalid_format_rejected
        claim_type: type_constraints
        grounds: [entities.Project, "errors[ERR_INVALID_FORMAT]"]
        distinguishing_aspect: "Project.upc must match ^[0-9]{12}$; an 11-digit value fails"
        test_recipe:
          setup: ["Client + profile + rush rule"]
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: StudioManager
            - call: "POST /studio/clients"
              payload: { legal_name: "C", contact_email: "c@x.com" }
              as: StudioManager
              captures: { cli_id: $.data.id }
            - call: "POST /studio/platform-profiles"
              payload: { platform_code: "SPOTIFY", integrated_lufs: -14.0, true_peak_dbtp: -1.0, loudness_range_lu: 12.0, required_sample_rate_hz: 44100, required_bit_depth: 24, container_format: "WAV" }
              as: StudioManager
              captures: { prof_id: $.data.id }
          trigger:
            - call: "POST /studio/projects"
              payload: { client_id: "${cli_id}", title: "P", upc: "12345678901", target_platform_profile_id: "${prof_id}", scheduled_start_at: "2026-05-11T10:00:00Z", scheduled_duration_minutes: 60 }
              as: Client
              as_user_id: "${cli_id}"
          assert:
            - "error_id == ERR_INVALID_FORMAT"
            - "http_status == 400"

      - name: project_upc_uniqueness_enforced
        claim_type: type_constraints
        grounds: [entities.Project, "validations[priority=11]", "errors[ERR_DUPLICATE_UPC]"]
        distinguishing_aspect: "Two Projects with the same UPC — second is rejected with ERR_DUPLICATE_UPC"
        test_recipe:
          setup: ["Client ACTIVE; one existing project with UPC 999999999999"]
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: StudioManager
            - call: "POST /studio/clients"
              payload: { legal_name: "C", contact_email: "c@x.com" }
              as: StudioManager
              captures: { cli_id: $.data.id }
            - call: "POST /studio/platform-profiles"
              payload: { platform_code: "SPOTIFY", integrated_lufs: -14.0, true_peak_dbtp: -1.0, loudness_range_lu: 12.0, required_sample_rate_hz: 44100, required_bit_depth: 24, container_format: "WAV" }
              as: StudioManager
              captures: { prof_id: $.data.id }
            - call: "POST /studio/projects"
              payload: { client_id: "${cli_id}", title: "P1", upc: "999999999999", target_platform_profile_id: "${prof_id}", scheduled_start_at: "2026-05-11T10:00:00Z", scheduled_duration_minutes: 60 }
              as: Client
              as_user_id: "${cli_id}"
          trigger:
            - call: "POST /studio/projects"
              payload: { client_id: "${cli_id}", title: "P2", upc: "999999999999", target_platform_profile_id: "${prof_id}", scheduled_start_at: "2026-05-11T13:00:00Z", scheduled_duration_minutes: 60 }
              as: Client
              as_user_id: "${cli_id}"
          assert:
            - "error_id == ERR_DUPLICATE_UPC"
            - "http_status == 409"

      - name: entity_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on non-existent project id returns ERR_NOT_FOUND 404"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: StudioManager
          trigger:
            - call: "GET /studio/projects/00000000-0000-0000-0000-000000000000"
              as: StudioManager
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "http_status == 404"

      - name: system_fields_id_and_created_at_server_minted
        claim_type: system_fields
        grounds: [entities.Client]
        distinguishing_aspect: "Client.id is server-minted UUID; client-supplied id in payload is ignored"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: StudioManager
          trigger:
            - call: "POST /studio/clients"
              payload: { legal_name: "X", contact_email: "x@x.com" }
              as: StudioManager
              captures: { cid: $.data.id }
          assert:
            - "Client.${cid}.id matches UUID regex"
            - "Client.${cid}.created_at == 2026-05-10T09:00:00.000Z"

  # ============================================================
  # Section: state_machines — valid/invalid transitions, terminal lockdown
  # ============================================================
  - section: state_machines
    instances:
      - name: cancel_booking_from_already_cancelled_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Project, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Second cancel on CANCELLED project → ERR_INVALID_STATE; no side effects fire"
        test_recipe:
          setup: ["Project CANCELLED once already"]
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: StudioManager
            - call: "POST /studio/clients"
              payload: { legal_name: "C", contact_email: "c@x.com" }
              as: StudioManager
              captures: { cli_id: $.data.id }
            - call: "POST /studio/platform-profiles"
              payload: { platform_code: "SPOTIFY", integrated_lufs: -14.0, true_peak_dbtp: -1.0, loudness_range_lu: 12.0, required_sample_rate_hz: 44100, required_bit_depth: 24, container_format: "WAV" }
              as: StudioManager
              captures: { prof_id: $.data.id }
            - call: "POST /studio/projects"
              payload: { client_id: "${cli_id}", title: "P", target_platform_profile_id: "${prof_id}", scheduled_start_at: "2026-05-11T10:00:00Z", scheduled_duration_minutes: 60 }
              as: Client
              as_user_id: "${cli_id}"
              captures: { p_id: $.data.id }
            - call: "POST /studio/projects/${p_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${cli_id}"
          trigger:
            - call: "POST /studio/projects/${p_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${cli_id}"
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: terminal_state_lockdown_archived_project_blocks_further_transitions
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Project]
        distinguishing_aspect: "An ARCHIVED project cannot transition further via cancel/book/intake — ERR_INVALID_STATE"
        excluded_because:
          difficulty_instance: compensating_invariant / engineer_active_project_count_conserved_across_book_and_archive
          rationale: "That difficulty instance drives a project to ARCHIVED; further transitions from ARCHIVED are forbidden by absence of any from: ARCHIVED clause in Project's transitions (other than RECALLED). We instead test the only allowed outgoing transition (recall) and the absence of cancel-from-archived via the initial-state machine declarations."

      - name: revision_round_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RevisionRound]
        distinguishing_aspect: "An APPROVED RevisionRound cannot be rejected — ERR_INVALID_STATE"
        test_recipe:
          setup: ["Project in APPROVED with round APPROVED"]
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: StudioManager
            - call: "POST /studio/engineers"
              payload: { display_name: "E", tier: "STAFF", hourly_rate_cents: 80000, capacity_minutes_per_day: 480 }
              as: StudioManager
              captures: { eng_id: $.data.id }
            - call: "POST /studio/platform-profiles"
              payload: { platform_code: "SPOTIFY", integrated_lufs: -14.0, true_peak_dbtp: -1.0, loudness_range_lu: 12.0, required_sample_rate_hz: 44100, required_bit_depth: 24, container_format: "WAV" }
              as: StudioManager
              captures: { prof_id: $.data.id }
            - call: "POST /studio/rush-tier-rules"
              payload: { tier: "STANDARD", multiplier_bp: 10000, sla_hours: 72, surcharge_breach_cents: 0, included_revision_rounds: 1, per_round_cents: 10000 }
              as: StudioManager
            - call: "POST /studio/clients"
              payload: { legal_name: "C", contact_email: "c@x.com" }
              as: StudioManager
              captures: { cli_id: $.data.id }
            - call: "POST /studio/clients/${cli_id}/credit-adjustments"
              payload: { amount_cents: 100000, reason: "seed" }
              as: StudioManager
            - call: "POST /studio/projects"
              payload: { client_id: "${cli_id}", title: "P", target_platform_profile_id: "${prof_id}", scheduled_start_at: "2026-05-11T10:00:00Z", scheduled_duration_minutes: 60 }
              as: Client
              as_user_id: "${cli_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /studio/clients/${cli_id}/activate"
              payload: {}
              as: StudioManager
            - call: "GET /studio/clients/${cli_id}"
              as: StudioManager
              captures: { cli_ver: $.data.version }
            - call: "POST /studio/projects/${proj_id}/book"
              payload: { expected_client_version: "${cli_ver}" }
              as: Client
              as_user_id: "${cli_id}"
            - call: "POST /studio/projects/${proj_id}/begin-intake"
              payload: {}
              as: Engineer
              as_user_id: "${eng_id}"
            - call: "POST /studio/projects/${proj_id}/source-assets"
              payload: { filename: "a.wav", sha256: "7777777777777777777777777777777777777777777777777777777777777777", sample_rate_hz: 44100, bit_depth: 24, duration_seconds: 60.0, channels: 2 }
              as: Engineer
              as_user_id: "${eng_id}"
              captures: { sa_id: $.data.id }
            - call: "POST /studio/source-assets/${sa_id}/qc-pass"
              payload: {}
              as: Engineer
              as_user_id: "${eng_id}"
            - call: "POST /studio/projects/${proj_id}/qc/complete"
              payload: {}
              as: Engineer
              as_user_id: "${eng_id}"
            - call: "POST /studio/projects/${proj_id}/start-mastering"
              payload: {}
              as: Engineer
              as_user_id: "${eng_id}"
              captures: { r1_id: $.data.current_revision_round_id, pv1: $.data.version }
            - call: "POST /studio/projects/${proj_id}/rounds/${r1_id}/submit"
              payload: { expected_project_version: "${pv1}" }
              as: Engineer
              as_user_id: "${eng_id}"
            - call: "POST /studio/projects/${proj_id}/rounds/${r1_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${cli_id}"
          trigger:
            - call: "POST /studio/projects/${proj_id}/rounds/${r1_id}/reject"
              payload: {}
              as: Client
              as_user_id: "${cli_id}"
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: initial_state_project_is_draft
        claim_type: initial_state
        grounds: [state_machines.Project]
        distinguishing_aspect: "Newly created Project is in DRAFT status with revision_round_count=0"
        test_recipe:
          setup: ["Client + profile"]
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: StudioManager
            - call: "POST /studio/clients"
              payload: { legal_name: "C", contact_email: "c@x.com" }
              as: StudioManager
              captures: { cli_id: $.data.id }
            - call: "POST /studio/platform-profiles"
              payload: { platform_code: "SPOTIFY", integrated_lufs: -14.0, true_peak_dbtp: -1.0, loudness_range_lu: 12.0, required_sample_rate_hz: 44100, required_bit_depth: 24, container_format: "WAV" }
              as: StudioManager
              captures: { prof_id: $.data.id }
          trigger:
            - call: "POST /studio/projects"
              payload: { client_id: "${cli_id}", title: "P", target_platform_profile_id: "${prof_id}", scheduled_start_at: "2026-05-11T10:00:00Z", scheduled_duration_minutes: 60 }
              as: Client
              as_user_id: "${cli_id}"
              captures: { pid: $.data.id }
          assert:
            - "Project.${pid}.status == DRAFT"
            - "Project.${pid}.revision_round_count == 0"
            - "Project.${pid}.current_revision_round_id is null"

      - name: side_effect_execution_book_creates_session_slot
        claim_type: side_effect_execution
        grounds: [state_machines.Project.DRAFT_to_BOOKED]
        distinguishing_aspect: "BOOKED transition creates a SessionSlot(BOOKED) and assigns engineer"
        test_recipe:
          setup: ["Client ACTIVE, project DRAFT"]
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: StudioManager
            - call: "POST /studio/engineers"
              payload: { display_name: "E", tier: "STAFF", hourly_rate_cents: 80000, capacity_minutes_per_day: 480 }
              as: StudioManager
              captures: { eng_id: $.data.id }
            - call: "POST /studio/platform-profiles"
              payload: { platform_code: "SPOTIFY", integrated_lufs: -14.0, true_peak_dbtp: -1.0, loudness_range_lu: 12.0, required_sample_rate_hz: 44100, required_bit_depth: 24, container_format: "WAV" }
              as: StudioManager
              captures: { prof_id: $.data.id }
            - call: "POST /studio/rush-tier-rules"
              payload: { tier: "STANDARD", multiplier_bp: 10000, sla_hours: 72, surcharge_breach_cents: 0, included_revision_rounds: 1, per_round_cents: 10000 }
              as: StudioManager
            - call: "POST /studio/clients"
              payload: { legal_name: "C", contact_email: "c@x.com" }
              as: StudioManager
              captures: { cli_id: $.data.id }
            - call: "POST /studio/projects"
              payload: { client_id: "${cli_id}", title: "P", target_platform_profile_id: "${prof_id}", scheduled_start_at: "2026-05-11T10:00:00Z", scheduled_duration_minutes: 60 }
              as: Client
              as_user_id: "${cli_id}"
              captures: { pid: $.data.id }
            - call: "POST /studio/clients/${cli_id}/activate"
              payload: {}
              as: StudioManager
            - call: "GET /studio/clients/${cli_id}"
              as: StudioManager
              captures: { cli_ver: $.data.version }
          trigger:
            - call: "POST /studio/projects/${pid}/book"
              payload: { expected_client_version: "${cli_ver}" }
              as: Client
              as_user_id: "${cli_id}"
          assert:
            - "Project.${pid}.status == BOOKED"
            - "Project.${pid}.assigned_engineer_id != null"
            - "Project.${pid}.quoted_price_cents > 0"

      - name: idempotency_second_approve_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.RevisionRound]
        distinguishing_aspect: "Second approve call on already-APPROVED round → ERR_INVALID_STATE; no double-debit of client credit"
        test_recipe:
          setup: ["Project APPROVED, round APPROVED, credit already debited once"]
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: StudioManager
            - call: "POST /studio/engineers"
              payload: { display_name: "E", tier: "STAFF", hourly_rate_cents: 80000, capacity_minutes_per_day: 480 }
              as: StudioManager
              captures: { eng_id: $.data.id }
            - call: "POST /studio/platform-profiles"
              payload: { platform_code: "SPOTIFY", integrated_lufs: -14.0, true_peak_dbtp: -1.0, loudness_range_lu: 12.0, required_sample_rate_hz: 44100, required_bit_depth: 24, container_format: "WAV" }
              as: StudioManager
              captures: { prof_id: $.data.id }
            - call: "POST /studio/rush-tier-rules"
              payload: { tier: "STANDARD", multiplier_bp: 10000, sla_hours: 72, surcharge_breach_cents: 0, included_revision_rounds: 1, per_round_cents: 10000 }
              as: StudioManager
            - call: "POST /studio/clients"
              payload: { legal_name: "C", contact_email: "c@x.com" }
              as: StudioManager
              captures: { cli_id: $.data.id }
            - call: "POST /studio/clients/${cli_id}/credit-adjustments"
              payload: { amount_cents: 100000, reason: "seed" }
              as: StudioManager
            - call: "POST /studio/projects"
              payload: { client_id: "${cli_id}", title: "P", target_platform_profile_id: "${prof_id}", scheduled_start_at: "2026-05-11T10:00:00Z", scheduled_duration_minutes: 60 }
              as: Client
              as_user_id: "${cli_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /studio/clients/${cli_id}/activate"
              payload: {}
              as: StudioManager
            - call: "GET /studio/clients/${cli_id}"
              as: StudioManager
              captures: { cli_ver: $.data.version }
            - call: "POST /studio/projects/${proj_id}/book"
              payload: { expected_client_version: "${cli_ver}" }
              as: Client
              as_user_id: "${cli_id}"
            - call: "POST /studio/projects/${proj_id}/begin-intake"
              payload: {}
              as: Engineer
              as_user_id: "${eng_id}"
            - call: "POST /studio/projects/${proj_id}/source-assets"
              payload: { filename: "a.wav", sha256: "8888888888888888888888888888888888888888888888888888888888888888", sample_rate_hz: 44100, bit_depth: 24, duration_seconds: 60.0, channels: 2 }
              as: Engineer
              as_user_id: "${eng_id}"
              captures: { sa_id: $.data.id }
            - call: "POST /studio/source-assets/${sa_id}/qc-pass"
              payload: {}
              as: Engineer
              as_user_id: "${eng_id}"
            - call: "POST /studio/projects/${proj_id}/qc/complete"
              payload: {}
              as: Engineer
              as_user_id: "${eng_id}"
            - call: "POST /studio/projects/${proj_id}/start-mastering"
              payload: {}
              as: Engineer
              as_user_id: "${eng_id}"
              captures: { r1_id: $.data.current_revision_round_id, pv1: $.data.version }
            - call: "POST /studio/projects/${proj_id}/rounds/${r1_id}/submit"
              payload: { expected_project_version: "${pv1}" }
              as: Engineer
              as_user_id: "${eng_id}"
            - call: "POST /studio/projects/${proj_id}/rounds/${r1_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${cli_id}"
            - call: "GET /studio/clients/${cli_id}"
              as: StudioManager
              captures: { credit_after_first_approve: $.data.account_credit_cents }
          trigger:
            - call: "POST /studio/projects/${proj_id}/rounds/${r1_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${cli_id}"
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "http_status == 409"
            - "Client.${cli_id}.account_credit_cents == ${credit_after_first_approve}"

  # ============================================================
  # Section: calculations — variant selection, constants, precision
  # ============================================================
  - section: calculations
    instances:
      - name: quote_provisional_excludes_extra_rounds
        claim_type: variant_selection
        grounds: [calculations.quote_provisional]
        distinguishing_aspect: "At BOOKED time, billable_rounds=0 regardless of future rounds; provisional uses rush multiplier only"
        excluded_because:
          difficulty_instance: dual_variant_calc / project_pricing_provisional_vs_final
          rationale: "Instance already asserts provisional formula value 240000."

      - name: loudness_check_precision_half_lu_tolerance
        claim_type: precision
        grounds: [calculations.loudness_compliance_check]
        distinguishing_aspect: "LUFS tolerance is 0.5; a deviation of 0.5 passes, 0.6 fails"
        test_recipe:
          setup: ["Deliverable at QC_PENDING with measured LUFS = target + 0.6"]
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: StudioManager
            - call: "POST /studio/engineers"
              payload: { display_name: "E", tier: "STAFF", hourly_rate_cents: 80000, capacity_minutes_per_day: 480 }
              as: StudioManager
              captures: { eng_id: $.data.id }
