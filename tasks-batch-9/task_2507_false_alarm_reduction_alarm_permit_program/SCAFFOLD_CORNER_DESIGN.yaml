            - "POST /false-alarm-program/payment-records/8c1f0a44-0000-4000-8000-000000000008/void returns the same 404, never ERR_PAYMENT_VOID_WINDOW_CLOSED"
            - "PaymentRecord.${pay1_id} is untouched with status APPLIED and allocated_cents 5500"

      - name: payment_allocation_read_with_an_unknown_id_is_not_found
        claim_type: Error triggerability
