            - "response.data.error_id == ERR_PSYCH_CLEARANCE_MISSING"
            - "Match.${match_id}.status == PROPOSED"

      - name: escrow_unfreeze_blocked_when_contract_void
        claim_type: guarded transitions
        grounds: ["state_machines.EscrowAccount.FROZEN_to_OPEN", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Unfreeze a FROZEN escrow whose linked Contract is VOID (via match void cascade) returns ERR_INVALID_STATE (409); escrow stays FROZEN."
