              as: UnderwritingAdmin
              captures: { fc_a: $.data.id }
            - call: "POST /fee-configs/${fc_a}/activate"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /fee-configs"
              payload: { state_code: "ND", filing_id: "${filing_nd}", flat_fee_pct: 0.22, flat_fee_cents: 90000 }
              as: UnderwritingAdmin
              captures: { fc_b: $.data.id }
