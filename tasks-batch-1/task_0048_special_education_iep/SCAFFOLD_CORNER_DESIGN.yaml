      - name: occ_stale_version_on_open_amendment_excluded
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[amendment-open-stale-iep]
        excluded_because:
          difficulty_instance: compensating_invariant / active_iep_id_set_then_cleared_invariant
          rationale: "The happy-path open-amendment with current version is asserted in the §1.8 compensating-invariant instance; the success path is fully covered there."

