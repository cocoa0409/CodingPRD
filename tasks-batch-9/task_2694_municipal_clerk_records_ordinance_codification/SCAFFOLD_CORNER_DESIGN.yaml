              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
          trigger:
            - call: "POST /clerk/records-requests/${req}/close"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
          assert:
            - "HTTP status == 200"
            - "PublicRecordsRequest.${req}.fulfillment_status == CLOSED"
            - "PublicRecordsRequest.${req}.closed_on == 2026-08-20"
            - "PublicRecordsRequest.${req}.fee_status == NOT_ASSESSED"
            - "before the close call RecordSeries.${series}.eligible_through_on == null"
            - "after the close call RecordSeries.${series}.eligible_through_on == 2031-08-20"
            - "RecordSeries.${series}.total_accessioned_count == 40 and active_item_count == 40 and destroyed_item_count == 0"

      - name: accessions_keep_the_series_custody_ledger_and_retention_anchor_in_sync
        claim_type: ledger_sync
        grounds: ["endpoints[POST /clerk/record-series/{series_id}/accessions]", "entities.RecordSeries.fields.total_accessioned_count", "calculations.record_custody_conservation"]
        distinguishing_aspect: "Two accessions in chronological order reconcile the custody triple before and after (0/0/0 then 100/100/0 then 150/150/0) while last_accessioned_on advances to the later date 2019-07-20, moving eligible_through_on from 2024-06-15 to 2024-07-20 under the CREATION trigger."
        test_recipe:
          setup: ["A CREATION-triggered series with retention_years 5 and no accessions."]
          setup_api_calls:
            - call: "POST /clerk/record-series"
              payload: { series_code: "CC-02", name: "Building permit files", retention_years: 5, retention_trigger: "CREATION" }
              as: RecordsOfficer
              as_user_id: "ro-01"
              captures: { series: $.data.id }
          trigger:
            - call: "POST /clerk/record-series/${series}/accessions"
              payload: { item_count: 100, accessioned_on: "2019-06-15" }
              as: RecordsOfficer
              as_user_id: "ro-01"
            - call: "POST /clerk/record-series/${series}/accessions"
              payload: { item_count: 50, accessioned_on: "2019-07-20" }
              as: DeputyClerk
              as_user_id: "dc-01"
          assert:
            - "both calls return HTTP status 200"
            - "after the first accession RecordSeries.${series}.total_accessioned_count == 100, active_item_count == 100, destroyed_item_count == 0, last_accessioned_on == 2019-06-15 and eligible_through_on == 2024-06-15"
            - "after the second accession RecordSeries.${series}.total_accessioned_count == 150, active_item_count == 150, destroyed_item_count == 0, last_accessioned_on == 2019-07-20 and eligible_through_on == 2024-07-20"
            - "at both observations total_accessioned_count == active_item_count + destroyed_item_count"

      - name: rescinding_a_destruction_certificate_reverses_every_side_effect
        claim_type: compensation
        excluded_because:
          difficulty_instance: rescinding_a_certified_destruction_batch_restores_the_custody_triple_with_zero_drift
          rationale: "DestructionBatch CERTIFIED -> RESCINDED is the only compensating edge in §1.2, and that §1.8 instance already asserts the full before/after triple (150/110/40 back to 150/150/0), the retention of certifying_officer_id and certified_on for audit, and zero drift in the record_custody_conservation invariant."

      - name: locking_a_cycle_advances_only_the_pending_submissions_and_leaves_the_conflict_pair_held
        claim_type: conditional_cascade
        grounds: ["state_machines.SupplementCycle[OPEN->LOCKED]", "state_machines.CodificationSubmission[PENDING->IN_REVIEW]"]
        distinguishing_aspect: "The lock cascade is conditional on child state: of three client submissions, the one still PENDING becomes IN_REVIEW while the two already in CONFLICT_HELD are untouched, and the cycle keeps conflict_count 1 with submission_count 3."
        test_recipe:
          setup: ["One CodeTitle with an OPEN cycle whose window contains the default clock date; two CODE_AMENDMENT ordinances both citing section 12.04.030 and one citing 12.04.040; three client submissions filed, the first two of which collided into CONFLICT_HELD."]
          setup_api_calls:
            - call: "POST /clerk/number-series"
              payload: { series_year: 2026, instrument_class: "ORDINANCE", prefix: "ORD" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { ns: $.data.id }
            - call: "POST /clerk/code-titles"
              payload: { title_number: 12, name: "Streets, Sidewalks and Public Places" }
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { ct: $.data.id, ctv: $.data.version }
            - call: "POST /clerk/code-titles/${ct}/supplement-cycles"
              payload: { supplement_number: 7, window_open_on: "2026-07-01", window_close_on: "2026-09-30" }
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { cyc: $.data.id }
            - call: "POST /clerk/instruments"
              payload: { instrument_class: "ORDINANCE", ordinance_category: "CODE_AMENDMENT", title: "Amending 12.04.030 (first)", full_text_length: 1800, number_series_id: "${ns}", code_title_id: "${ct}", code_section_ref: "12.04.030" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { i1: $.data.id }
            - call: "POST /clerk/instruments"
              payload: { instrument_class: "ORDINANCE", ordinance_category: "CODE_AMENDMENT", title: "Amending 12.04.030 (second)", full_text_length: 1900, number_series_id: "${ns}", code_title_id: "${ct}", code_section_ref: "12.04.030" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { i2: $.data.id }
            - call: "POST /clerk/instruments"
              payload: { instrument_class: "ORDINANCE", ordinance_category: "CODE_AMENDMENT", title: "Adding 12.04.040", full_text_length: 1200, number_series_id: "${ns}", code_title_id: "${ct}", code_section_ref: "12.04.040" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { i3: $.data.id }
            - call: "POST /clerk/codification-submissions"
              payload: { cycle_id: "${cyc}", instrument_id: "${i1}", code_section_ref: "12.04.030", action: "ADD", expected_code_title_version: "${ctv}" }
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { s1: $.data.id }
            - call: "POST /clerk/codification-submissions"
              payload: { cycle_id: "${cyc}", instrument_id: "${i2}", code_section_ref: "12.04.030", action: "ADD", expected_code_title_version: "${ctv}" }
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { s2: $.data.id }
            - call: "POST /clerk/codification-submissions"
              payload: { cycle_id: "${cyc}", instrument_id: "${i3}", code_section_ref: "12.04.040", action: "ADD", expected_code_title_version: "${ctv}" }
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { s3: $.data.id }
          trigger:
            - call: "POST /clerk/supplement-cycles/${cyc}/lock"
              payload: {}
              as: CodificationEditor
              as_user_id: "ce-01"
          assert:
            - "HTTP status == 200"
            - "SupplementCycle.${cyc}.status == LOCKED"
            - "CodificationSubmission.${s3}.status == IN_REVIEW"
            - "CodificationSubmission.${s1}.status == CONFLICT_HELD"
            - "CodificationSubmission.${s2}.status == CONFLICT_HELD"
            - "CodificationSubmission.${s1}.conflict_with_submission_id == ${s2}"
            - "CodificationSubmission.${s2}.conflict_with_submission_id == ${s1}"
            - "SupplementCycle.${cyc}.submission_count == 3"
            - "SupplementCycle.${cyc}.client_submission_count == 3"
            - "SupplementCycle.${cyc}.conflict_count == 1"

  # ===================================================================
  # SECTION 3 — calculations (§1.3)
  # ===================================================================
  - section: calculations
    instances:

      - name: a_saturday_intake_yields_a_friday_due_date_five_business_days_later
        claim_type: correct_result
        grounds: [calculations.records_request_due_date, entities.PublicRecordsRequest.fields.due_on]
        distinguishing_aspect: "Intake on Saturday 2026-08-01 must not consume a business day: the cursor walks Sunday (skipped), then Monday through Friday, landing on due_on 2026-08-07 — six calendar days later, not five."
        test_recipe:
          setup: ["Empty database; the logical clock sits at its default 2026-08-01T00:00:00Z, a Saturday."]
          setup_api_calls: []
          trigger:
            - call: "POST /clerk/records-requests"
              payload: { requester_name: "M. Rivera", requester_email: "m.rivera@example.org", subject_description: "All 2026 council agendas" }
              as: Anonymous
              as_user_id: "anon-01"
              captures: { req: $.data.id }
          assert:
            - "HTTP status == 201"
            - "PublicRecordsRequest.${req}.intake_on == 2026-08-01"
            - "PublicRecordsRequest.${req}.due_on == 2026-08-07"
            - "PublicRecordsRequest.${req}.fulfillment_status == RECEIVED"
            - "PublicRecordsRequest.${req}.fee_status == NOT_ASSESSED"
            - "PublicRecordsRequest.${req}.commercial_purpose == false"

      - name: the_request_closure_anchor_reads_only_closed_requests_and_ignores_the_accession_date
        claim_type: input_set_filtering
        grounds: ["calculations.destruction_eligibility_date", "validations[priority=72]", "errors[ERR_RETENTION_ANCHOR_UNRESOLVED]"]
        distinguishing_aspect: "The series has a last_accessioned_on of 2019-06-15, but under retention_trigger REQUEST_CLOSURE that date is not in the input set: with one WITHDRAWN and one RELEASED-but-not-CLOSED request the anchor stays unresolved and eligible_through_on stays null, and only closing the second request (retention_years 0) resolves it to 2026-08-20."
        test_recipe:
          setup: ["A REQUEST_CLOSURE series with retention_years 0 and 40 accessioned items; one WITHDRAWN request and one RELEASED request against it."]
          setup_api_calls:
            - call: "POST /clerk/record-series"
              payload: { series_code: "CC-03", name: "Disclosure working files", retention_years: 0, retention_trigger: "REQUEST_CLOSURE" }
              as: RecordsOfficer
              as_user_id: "ro-01"
              captures: { series: $.data.id }
            - call: "POST /clerk/record-series/${series}/accessions"
              payload: { item_count: 40, accessioned_on: "2019-06-15" }
              as: RecordsOfficer
              as_user_id: "ro-01"
            - call: "POST /clerk/records-requests"
              payload: { requester_name: "A. Osei", requester_email: "a.osei@example.org", subject_description: "Working files A", target_series_id: "${series}" }
              as: Anonymous
              as_user_id: "anon-01"
              captures: { req_a: $.data.id }
            - call: "POST /clerk/records-requests/${req_a}/withdraw"
              payload: {}
              as: Requester
              as_user_id: "${req_a}"
            - call: "POST /clerk/records-requests"
              payload: { requester_name: "B. Larsen", requester_email: "b.larsen@example.org", subject_description: "Working files B", target_series_id: "${series}" }
              as: Anonymous
              as_user_id: "anon-02"
              captures: { req_b: $.data.id }
            - call: "POST /clerk/records-requests/${req_b}/begin-review"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/records-requests/${req_b}/disposition"
              payload: { disposition: "FULL_RELEASE" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
          trigger:
            - call: "POST /clerk/destruction-batches"
              payload: { series_id: "${series}", item_count: 10, cutoff_on: "2019-12-31" }
              as: RecordsOfficer
              as_user_id: "ro-01"
              captures: { err: $.data.error_id }
            - call: "POST /clerk/records-requests/${req_b}/close"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/destruction-batches"
              payload: { series_id: "${series}", item_count: 10, cutoff_on: "2019-12-31" }
              as: RecordsOfficer
              as_user_id: "ro-01"
              captures: { batch: $.data.id }
          assert:
            - "the first propose returns HTTP status 409"
            - "${err} == ERR_RETENTION_ANCHOR_UNRESOLVED"
            - "before the close RecordSeries.${series}.last_accessioned_on == 2019-06-15 and eligible_through_on == null"
            - "after the close RecordSeries.${series}.eligible_through_on == 2026-08-20"
            - "the second propose returns HTTP status 201"
            - "DestructionBatch.${batch}.eligible_through_on == 2026-08-20"
            - "DestructionBatch.${batch}.status == PROPOSED"
            - "DestructionBatch.${batch}.blocking_request_id == null"

      - name: the_base_notice_hours_constant_is_keyed_on_meeting_type_alone
        claim_type: constants_applied
        grounds: [calculations.meeting_notice_requirement, constants.BASE_NOTICE_HOURS]
        distinguishing_aspect: "Two COUNCIL meetings starting at the identical instant with identical one-item packets diverge purely through BASE_NOTICE_HOURS: REGULAR takes 72 hours (deadline 2026-09-12T18:00:00Z) and SPECIAL takes 48 (deadline 2026-09-13T18:00:00Z), a 24-hour spread with the body multiplier fixed at 1.0."
        test_recipe:
          setup: ["Two venues so the two meetings can occupy the same instant; one REGULAR and one SPECIAL COUNCIL meeting on 2026-09-15T18:00:00Z, each with a single REPORT item."]
          setup_api_calls:
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue_a: $.data.id }
            - call: "POST /clerk/venues"
              payload: { name: "Hearing Room B", address: "1 Civic Plaza", capacity: 60, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue_b: $.data.id }
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue_a}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { m_reg: $.data.id, m_reg_v: $.data.version }
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "SPECIAL", venue_id: "${venue_b}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { m_spc: $.data.id, m_spc_v: $.data.version }
          trigger:
            - call: "POST /clerk/meetings/${m_reg}/agenda-packets"
              payload: { expected_meeting_version: "${m_reg_v}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { pkt_reg: $.data.id }
            - call: "POST /clerk/agenda-packets/${pkt_reg}/agenda-items"
              payload: { sequence_number: 1, item_type: "REPORT", title: "Quarterly finance report" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/agenda-packets/${pkt_reg}/post"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/meetings/${m_spc}/agenda-packets"
              payload: { expected_meeting_version: "${m_spc_v}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { pkt_spc: $.data.id }
            - call: "POST /clerk/agenda-packets/${pkt_spc}/agenda-items"
              payload: { sequence_number: 1, item_type: "REPORT", title: "Quarterly finance report" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/agenda-packets/${pkt_spc}/post"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
          assert:
            - "AgendaPacket.${pkt_reg}.required_notice_hours == 72"
            - "AgendaPacket.${pkt_reg}.notice_deadline_at == 2026-09-12T18:00:00Z"
            - "AgendaPacket.${pkt_spc}.required_notice_hours == 48"
            - "AgendaPacket.${pkt_spc}.notice_deadline_at == 2026-09-13T18:00:00Z"
            - "both packets are POSTED with notice_compliant == true"

      - name: the_publication_rate_is_rounded_half_up_on_the_exact_decimal_product
        claim_type: precision
        grounds: [calculations.publication_invoice_total, constants.RATE_CENTS_PER_COLUMN_INCH]
        distinguishing_aspect: "12.501 column inches at 500 cents an inch is exactly 6250.5 cents: round_half_up must yield per-insertion 6251, not the 6250 a banker's-rounding or float-truncating implementation returns. With one insertion the gross stays under the 50000 tier floor, so discount_pct is 0.00 and the invoice equals the rounded gross."
        test_recipe:
          setup: ["A NOTICED meeting whose DRAFT MEETING_AGENDA notice requires one insertion by 2026-09-14."]
          setup_api_calls:
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue: $.data.id }
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mtg: $.data.id, mtgv: $.data.version }
            - call: "POST /clerk/meetings/${mtg}/agenda-packets"
              payload: { expected_meeting_version: "${mtgv}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { pkt: $.data.id }
            - call: "POST /clerk/agenda-packets/${pkt}/agenda-items"
              payload: { sequence_number: 1, item_type: "REPORT", title: "Quarterly finance report" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/agenda-packets/${pkt}/post"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
            - call: "GET /clerk/publication-notices"
              payload: { meeting_id: "${mtg}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { notice: "$.data[0].id" }
          trigger:
            - call: "POST /clerk/publication-notices/${notice}/order"
              payload: { newspaper_name: "The Civic Ledger", column_inches: 12.501, publication_dates: ["2026-09-14"], affidavit_required: false }
              as: CityClerk
              as_user_id: "cc-01"
          assert:
            - "HTTP status == 200"
            - "PublicationNotice.${notice}.status == ORDERED"
            - "PublicationNotice.${notice}.gross_cost_cents == 6251"
            - "PublicationNotice.${notice}.discount_pct == 0.00"
            - "PublicationNotice.${notice}.invoice_total_cents == 6251"

      - name: one_public_hearing_item_crosses_the_hearing_threshold_and_a_second_adds_nothing
        claim_type: threshold_boundary
        grounds: [calculations.meeting_notice_requirement, calculations.agenda_notice_compliance, entities.AgendaPacket.fields.contains_public_hearing]
        distinguishing_aspect: "PUBLIC_HEARING_ADDITIONAL_HOURS is gated on a boolean, not a count: with zero hearing items the packet needs 72 hours, adding the first hearing item lifts it to 240 (deadline 2026-09-05T18:00:00Z), and adding a second hearing item leaves it at 240 rather than 408."
        test_recipe:
          setup: ["A SCHEDULED COUNCIL REGULAR meeting on 2026-09-15T18:00:00Z with a DRAFT packet holding one REPORT item."]
          setup_api_calls:
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue: $.data.id }
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mtg: $.data.id, mtgv: $.data.version }
            - call: "POST /clerk/meetings/${mtg}/agenda-packets"
              payload: { expected_meeting_version: "${mtgv}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { pkt: $.data.id }
            - call: "POST /clerk/agenda-packets/${pkt}/agenda-items"
              payload: { sequence_number: 1, item_type: "REPORT", title: "Quarterly finance report" }
              as: CityClerk
              as_user_id: "cc-01"
          trigger:
            - call: "POST /clerk/agenda-packets/${pkt}/agenda-items"
              payload: { sequence_number: 2, item_type: "PUBLIC_HEARING", title: "Hearing on the Elm Street rezoning" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/agenda-packets/${pkt}/agenda-items"
              payload: { sequence_number: 3, item_type: "PUBLIC_HEARING", title: "Hearing on the utility rate schedule" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/agenda-packets/${pkt}/post"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
          assert:
            - "with only the REPORT item AgendaPacket.${pkt}.required_notice_hours == 72 and contains_public_hearing == false"
            - "after the first PUBLIC_HEARING item AgendaPacket.${pkt}.required_notice_hours == 240 and contains_public_hearing == true"
            - "after the second PUBLIC_HEARING item AgendaPacket.${pkt}.required_notice_hours == 240"
            - "at post AgendaPacket.${pkt}.notice_deadline_at == 2026-09-05T18:00:00Z"
            - "AgendaPacket.${pkt}.item_count == 3"
            - "AgendaPacket.${pkt}.notice_compliant == true"
            - "Meeting.${mtg}.required_notice_hours == 240"

      - name: an_out_of_order_accession_does_not_move_the_retention_anchor_backwards
        claim_type: chronological_order
        grounds: [calculations.destruction_eligibility_date, entities.RecordSeries.fields.last_accessioned_on]
        distinguishing_aspect: "Accessions arrive in reverse chronological order (2019-07-20 then 2019-06-15). last_accessioned_on is the maximum, not the latest write, so it stays 2019-07-20 and eligible_through_on stays 2024-07-20 while the counters still sum to 150."
        test_recipe:
          setup: ["A CREATION-triggered series with retention_years 5 and no accessions."]
          setup_api_calls:
            - call: "POST /clerk/record-series"
              payload: { series_code: "CC-04", name: "Oath and bond files", retention_years: 5, retention_trigger: "CREATION" }
              as: RecordsOfficer
              as_user_id: "ro-01"
              captures: { series: $.data.id }
          trigger:
            - call: "POST /clerk/record-series/${series}/accessions"
              payload: { item_count: 100, accessioned_on: "2019-07-20" }
              as: RecordsOfficer
              as_user_id: "ro-01"
            - call: "POST /clerk/record-series/${series}/accessions"
              payload: { item_count: 50, accessioned_on: "2019-06-15" }
              as: RecordsOfficer
              as_user_id: "ro-01"
          assert:
            - "both calls return HTTP status 200"
            - "after the first accession RecordSeries.${series}.last_accessioned_on == 2019-07-20 and eligible_through_on == 2024-07-20"
            - "after the out-of-order second accession RecordSeries.${series}.last_accessioned_on == 2019-07-20"
            - "after the out-of-order second accession RecordSeries.${series}.eligible_through_on == 2024-07-20"
            - "RecordSeries.${series}.total_accessioned_count == 150 and active_item_count == 150"

      - name: the_fee_ledger_recomputes_from_counters_after_a_waiver_and_a_payment
        claim_type: aggregation_running_total
        grounds: ["calculations.records_request_fee_ledger", "calculations.records_request_fee_assessment", "errors[ERR_PAYMENT_EXCEEDS_BALANCE]", "errors[ERR_WAIVER_EXCEEDS_BALANCE]"]
        distinguishing_aspect: "An ACTUAL_COST assessment of 1175 cents (20 billable pages at 15 plus 1 billable quarter-hour at 875) is drawn down by a 175-cent waiver and then a 1000-cent payment: fee_balance_cents walks 1175 -> 1000 -> 0 while net_cash_cents walks 0 -> 0 -> 1000, and the floor holds — one extra cent of payment and one extra cent of waiver are both refused."
        test_recipe:
          setup: ["One records request under review with no fee assessed."]
          setup_api_calls:
            - call: "POST /clerk/records-requests"
              payload: { requester_name: "M. Rivera", requester_email: "m.rivera@example.org", subject_description: "Planning commission packets 2025" }
              as: Anonymous
              as_user_id: "anon-01"
              captures: { req: $.data.id }
            - call: "POST /clerk/records-requests/${req}/begin-review"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
          trigger:
            - call: "POST /clerk/records-requests/${req}/assess-fee"
              payload: { fee_schedule_variant: "ACTUAL_COST", fee_lines: [{ page_count: 40, staff_minutes: 40, delivery_medium: "PAPER" }] }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/records-requests/${req}/waive-fee"
              payload: { waived_cents: 175, waiver_reason: "Partial public-interest waiver" }
              as: RecordsOfficer
              as_user_id: "ro-01"
            - call: "POST /clerk/records-requests/${req}/payments"
              payload: { amount_cents: 1000 }
              as: Requester
              as_user_id: "${req}"
            - call: "POST /clerk/records-requests/${req}/payments"
              payload: { amount_cents: 1 }
              as: Requester
              as_user_id: "${req}"
              captures: { err_pay: $.data.error_id }
            - call: "POST /clerk/records-requests/${req}/waive-fee"
              payload: { waived_cents: 1, waiver_reason: "Overshoot" }
              as: RecordsOfficer
              as_user_id: "ro-01"
              captures: { err_waive: $.data.error_id }
          assert:
            - "after the assessment PublicRecordsRequest.${req}.total_assessed_cents == 1175, fee_balance_cents == 1175, net_cash_cents == 0 and fee_status == ASSESSED"
            - "after the waiver total_waived_cents == 175, fee_balance_cents == 1000, net_cash_cents == 0 and fee_status == ASSESSED"
            - "after the payment total_collected_cents == 1000, fee_balance_cents == 0, net_cash_cents == 1000 and fee_status == PAID"
            - "the extra payment returns HTTP 422 and ${err_pay} == ERR_PAYMENT_EXCEEDS_BALANCE"
            - "the extra waiver returns HTTP 422 and ${err_waive} == ERR_WAIVER_EXCEEDS_BALANCE"
            - "PublicRecordsRequest.${req}.fee_balance_cents == 0 and refunded_cents == 0 after both refusals"

      - name: publication_volume_tier_boundaries_are_walked_across_the_discount_edges
        claim_type: tiered_pricing_boundary
        excluded_because:
          difficulty_instance: publication_volume_tier_boundary_inverts_the_billing_order_at_fifty_thousand_cents
          rationale: "That §1.8 instance sits exactly on the 50000-cent tier floor and shows the smaller order billing 49995 at 0.00 while the larger one bills 47500 at 0.05 — the marginal-versus-average inversion this row asks for. §1.8 combinatorial_formula additionally covers the 150000 edge at 0.10 with the affidavit added after the discount."

      - name: the_specificity_ladder_collapses_to_created_at_for_codifiable_ordinances
        claim_type: topological_order
        excluded_because:
          difficulty_instance: supplement_cycle_certification_blocked_until_its_held_conflict_is_resolved
          rationale: "Validation 90 forces every submission's instrument to be a CODE_AMENDMENT of the cycle's own CodeTitle, so SPECIFICITY_RANK is pinned at 2 for both partners of any conflict pair and SPECIFIC_OVER_GENERAL always falls through to adoption_date DESC and then submission.created_at ASC. Ranking is therefore never observable independently of the tie-break ladder, and the §1.8 instance already resolves a held pair end-to-end (under MANUAL_OVERRIDE) with the losing row driven to REJECTED and conflict_count returned to 0. Recorded here so the PRD keeps the collapse explicit rather than implying a live three-way ordering."

      - name: the_two_fee_schedule_variants_diverge_on_identical_lines
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: records_fee_actual_cost_versus_flat_schedule_diverge_on_identical_lines
          rationale: "That §1.8 instance runs the same fee_lines through ACTUAL_COST and FLAT_SCHEDULE on two sibling requests and pins 2125 against 1875 with the 250-cent delta, covering per-line-versus-summed allowances, per-line-versus-once quarter-hour rounding and the suppressed electronic discount in a single comparison."

      - name: the_recorded_fee_variant_is_the_one_supplied_at_assessment_and_cannot_be_reselected
        claim_type: variant_selection
        grounds: ["calculations.records_request_fee_assessment.variants", "validations[priority=84]", "errors[ERR_FEE_ALREADY_ASSESSED]"]
        distinguishing_aspect: "fee_schedule_variant is a system field sourced from the assess-fee input, so FLAT_SCHEDULE billing on the same lines yields 1375 cents (20 billable pages at the 25-cent flat rate plus one billable quarter-hour), and because a fee may be assessed only once there is no reconciliation path: the second assess-fee is refused and both the variant and the total stand."
        test_recipe:
          setup: ["One records request under review with no fee assessed."]
          setup_api_calls:
            - call: "POST /clerk/records-requests"
              payload: { requester_name: "T. Nkemelu", requester_email: "t.nkemelu@example.org", subject_description: "Ordinance files 2024" }
              as: Anonymous
              as_user_id: "anon-01"
              captures: { req: $.data.id }
            - call: "POST /clerk/records-requests/${req}/begin-review"
              payload: {}
              as: DeputyClerk
              as_user_id: "dc-01"
          trigger:
            - call: "POST /clerk/records-requests/${req}/assess-fee"
              payload: { fee_schedule_variant: "FLAT_SCHEDULE", fee_lines: [{ page_count: 40, staff_minutes: 40, delivery_medium: "PAPER" }] }
              as: DeputyClerk
              as_user_id: "dc-01"
            - call: "POST /clerk/records-requests/${req}/assess-fee"
              payload: { fee_schedule_variant: "ACTUAL_COST", fee_lines: [{ page_count: 40, staff_minutes: 40, delivery_medium: "PAPER" }] }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { err: $.data.error_id }
          assert:
            - "the first assessment returns HTTP 200 with fee_schedule_variant == FLAT_SCHEDULE and total_assessed_cents == 1375"
            - "the second assessment returns HTTP status 422"
            - "${err} == ERR_FEE_ALREADY_ASSESSED"
            - "PublicRecordsRequest.${req}.fee_schedule_variant == FLAT_SCHEDULE"
            - "PublicRecordsRequest.${req}.total_assessed_cents == 1375"
            - "PublicRecordsRequest.${req}.fee_balance_cents == 1375"

  # ===================================================================
  # SECTION 4 — validations (§1.4)
  # ===================================================================
  - section: validations
    instances:

      - name: a_resolution_carrying_an_ordinance_category_is_an_invalid_request
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_INVALID_REQUEST]", "entities.LegislativeInstrument.fields.ordinance_category"]
        distinguishing_aspect: "Validation 14 is two-sided: ordinance_category must be null exactly when instrument_class == RESOLUTION, so a RESOLUTION carrying GENERAL is refused, and so is an ORDINANCE carrying no category at all."
        test_recipe:
          setup: ["One OPEN RESOLUTION series and one OPEN ORDINANCE series for 2026."]
          setup_api_calls:
            - call: "POST /clerk/number-series"
              payload: { series_year: 2026, instrument_class: "RESOLUTION", prefix: "RES" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { ns_res: $.data.id }
            - call: "POST /clerk/number-series"
              payload: { series_year: 2026, instrument_class: "ORDINANCE", prefix: "ORD" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { ns_ord: $.data.id }
          trigger:
            - call: "POST /clerk/instruments"
              payload: { instrument_class: "RESOLUTION", ordinance_category: "GENERAL", title: "Commending the volunteer fire brigade", full_text_length: 900, number_series_id: "${ns_res}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { err_res: $.data.error_id }
            - call: "POST /clerk/instruments"
              payload: { instrument_class: "ORDINANCE", title: "Amending the noise ordinance", full_text_length: 3000, number_series_id: "${ns_ord}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { err_ord: $.data.error_id }
          assert:
            - "both calls return HTTP status 422"
            - "${err_res} == ERR_INVALID_REQUEST"
            - "${err_ord} == ERR_INVALID_REQUEST"
            - "GET /clerk/instruments?number_series_id=${ns_res} returns total_count == 0"
            - "GET /clerk/instruments?number_series_id=${ns_ord} returns total_count == 0"

      - name: convening_with_attendance_exactly_at_quorum_succeeds
        claim_type: satisfaction_to_pass
        grounds: ["validations[priority=56]", "state_machines.Meeting[NOTICED->IN_SESSION]"]
        distinguishing_aspect: "The quorum test is >=, not >: present_member_count 4 against quorum_required 4 convenes the meeting and records present_member_count 4, which then becomes the base for every tally at that meeting."
        test_recipe:
          setup: ["A NOTICED meeting with a compliant posted packet and quorum_required 4."]
          setup_api_calls:
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue: $.data.id }
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mtg: $.data.id, mtgv: $.data.version }
            - call: "POST /clerk/meetings/${mtg}/agenda-packets"
              payload: { expected_meeting_version: "${mtgv}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { pkt: $.data.id }
            - call: "POST /clerk/agenda-packets/${pkt}/agenda-items"
              payload: { sequence_number: 1, item_type: "REPORT", title: "Quarterly finance report" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/agenda-packets/${pkt}/post"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
          trigger:
            - call: "POST /clerk/meetings/${mtg}/convene"
              payload: { present_member_count: 4 }
              as: PresidingOfficer
              as_user_id: "po-01"
          assert:
            - "HTTP status == 200"
            - "Meeting.${mtg}.status == IN_SESSION"
            - "Meeting.${mtg}.present_member_count == 4"
            - "Meeting.${mtg}.notice_compliant == true"

      - name: two_violated_rules_return_the_lower_numbered_priority_error
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: close_violating_both_disclosure_state_and_fee_balance_returns_not_closable
          rationale: "§1.8's priority_pair_validation_conflict rule carries four instances that each violate a specific pair and pin the surviving error id: 40 over 80, 50 over 64, 52 over 62 and 60 over 90. Restating the generic ordering claim here would add no discriminating power."

      - name: violating_a_pair_of_rules_at_different_priorities_hides_the_weaker_error
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: reschedule_violating_both_notice_deadline_and_venue_window_returns_notice_deadline_missed
          rationale: "Same four §1.8 instances. Each additionally asserts that the suppressed error id is NOT the one returned, which is the whole content of this row."

      - name: an_instrument_must_draw_from_a_series_of_its_own_class_and_year
        claim_type: cross_entity_validation
        grounds: ["validations[priority=92]", "errors[ERR_SERIES_CLASS_MISMATCH]"]
        distinguishing_aspect: "Validity is decided by the referenced NumberSeries, not by the payload: a RESOLUTION pointed at the ORDINANCE series is refused, a 2025 series is refused while the logical clock reads 2026, and the matching series accepts the same instrument unchanged."
        test_recipe:
          setup: ["An ORDINANCE 2026 series, a RESOLUTION 2025 series and a RESOLUTION 2026 series."]
          setup_api_calls:
            - call: "POST /clerk/number-series"
              payload: { series_year: 2026, instrument_class: "ORDINANCE", prefix: "ORD" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { ns_ord_2026: $.data.id }
            - call: "POST /clerk/number-series"
              payload: { series_year: 2025, instrument_class: "RESOLUTION", prefix: "RES" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { ns_res_2025: $.data.id }
            - call: "POST /clerk/number-series"
              payload: { series_year: 2026, instrument_class: "RESOLUTION", prefix: "RES" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { ns_res_2026: $.data.id }
          trigger:
            - call: "POST /clerk/instruments"
              payload: { instrument_class: "RESOLUTION", title: "Commending the volunteer fire brigade", full_text_length: 900, number_series_id: "${ns_ord_2026}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { err_class: $.data.error_id }
            - call: "POST /clerk/instruments"
              payload: { instrument_class: "RESOLUTION", title: "Commending the volunteer fire brigade", full_text_length: 900, number_series_id: "${ns_res_2025}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { err_year: $.data.error_id }
            - call: "POST /clerk/instruments"
              payload: { instrument_class: "RESOLUTION", title: "Commending the volunteer fire brigade", full_text_length: 900, number_series_id: "${ns_res_2026}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { ok_instrument: $.data.id }
          assert:
            - "the first two calls return HTTP status 422"
            - "${err_class} == ERR_SERIES_CLASS_MISMATCH"
            - "${err_year} == ERR_SERIES_CLASS_MISMATCH"
            - "the third call returns HTTP status 201"
            - "LegislativeInstrument.${ok_instrument}.status == INTRODUCED"
            - "LegislativeInstrument.${ok_instrument}.requires_publication == false"
            - "LegislativeInstrument.${ok_instrument}.assigned_number == null"

      - name: an_insertion_dated_after_the_publication_deadline_is_refused
        claim_type: temporal_validation
        grounds: ["validations[priority=68]", "errors[ERR_PUBLICATION_DEADLINE_MISSED]", "calculations.publication_requirement"]
        distinguishing_aspect: "The MEETING_AGENDA deadline is the day before the meeting (2026-09-14), so an order dated on the meeting day itself is refused even though it is only one day late and the insertion count is correct; the notice stays DRAFT with no invoice fields."
        test_recipe:
          setup: ["A NOTICED meeting on 2026-09-15 with its DRAFT MEETING_AGENDA notice."]
          setup_api_calls:
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue: $.data.id }
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mtg: $.data.id, mtgv: $.data.version }
            - call: "POST /clerk/meetings/${mtg}/agenda-packets"
              payload: { expected_meeting_version: "${mtgv}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { pkt: $.data.id }
            - call: "POST /clerk/agenda-packets/${pkt}/agenda-items"
              payload: { sequence_number: 1, item_type: "REPORT", title: "Quarterly finance report" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/agenda-packets/${pkt}/post"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
            - call: "GET /clerk/publication-notices"
              payload: { meeting_id: "${mtg}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { notice: "$.data[0].id" }
          trigger:
            - call: "POST /clerk/publication-notices/${notice}/order"
              payload: { newspaper_name: "The Civic Ledger", column_inches: 20.0, publication_dates: ["2026-09-15"], affidavit_required: false }
              as: DeputyClerk
              as_user_id: "dc-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_PUBLICATION_DEADLINE_MISSED"
            - "PublicationNotice.${notice}.status == DRAFT"
            - "PublicationNotice.${notice}.publication_deadline_on == 2026-09-14"
            - "PublicationNotice.${notice}.invoice_total_cents == null"

      - name: a_fourth_packet_revision_on_one_meeting_is_refused
        claim_type: aggregate_validation
        grounds: ["validations[priority=60]", "errors[ERR_PACKET_REVISION_LIMIT]", "entities.AgendaPacket.fields.revision_number"]
        distinguishing_aspect: "Each individual revision is valid and the third one is accepted at revision_number 3; only the aggregate cap MAX_PACKET_REVISIONS (3) refuses the fourth, and the two superseded packets remain in SUPERSEDED rather than being deleted."
        test_recipe:
          setup: ["A SCHEDULED meeting with no packets; each revision bumps Meeting.version, so the expected version is re-read before every filing."]
          setup_api_calls:
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue: $.data.id }
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mtg: $.data.id, mtgv: $.data.version }
            - call: "POST /clerk/meetings/${mtg}/agenda-packets"
              payload: { expected_meeting_version: "${mtgv}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { p1: $.data.id }
            - call: "GET /clerk/meetings/${mtg}"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mtgv2: $.data.version }
            - call: "POST /clerk/meetings/${mtg}/agenda-packets"
              payload: { expected_meeting_version: "${mtgv2}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { p2: $.data.id }
            - call: "GET /clerk/meetings/${mtg}"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mtgv3: $.data.version }
          trigger:
            - call: "POST /clerk/meetings/${mtg}/agenda-packets"
              payload: { expected_meeting_version: "${mtgv3}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { p3: $.data.id }
            - call: "GET /clerk/meetings/${mtg}"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mtgv4: $.data.version }
            - call: "POST /clerk/meetings/${mtg}/agenda-packets"
              payload: { expected_meeting_version: "${mtgv4}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { err: $.data.error_id }
          assert:
            - "the third revision returns HTTP 201 with AgendaPacket.${p3}.revision_number == 3"
            - "the fourth revision returns HTTP status 422"
            - "${err} == ERR_PACKET_REVISION_LIMIT"
            - "${err} != ERR_STALE_MEETING_VERSION — the expected version was current, only the cap was exceeded"
            - "AgendaPacket.${p1}.status == SUPERSEDED and AgendaPacket.${p2}.status == SUPERSEDED"
            - "AgendaPacket.${p3}.status == DRAFT"
            - "GET /clerk/agenda-packets?meeting_id=${mtg} returns total_count == 3"
            - "Meeting.${mtg}.version == ${mtgv4} — the refused fourth filing bumped nothing"

      - name: the_submission_window_rule_applies_only_to_client_origin_filings
        claim_type: conditional_validation
        grounds: ["validations[priority=70]", "errors[ERR_OUTSIDE_SUBMISSION_WINDOW]", "entities.CodificationSubmission.fields.origin"]
        distinguishing_aspect: "The same POST is refused at clock 2026-08-01 and accepted at clock 2026-09-15 purely because validation 70 is conditioned on origin == CLIENT and on the cycle's inclusive window 2026-09-01..2026-09-30; the accepted row records origin CLIENT and lifts client_submission_count to 1."
        test_recipe:
          setup: ["A CodeTitle with an OPEN cycle whose window opens on 2026-09-01, and one CODE_AMENDMENT ordinance citing 12.04.030."]
          setup_api_calls:
            - call: "POST /clerk/number-series"
              payload: { series_year: 2026, instrument_class: "ORDINANCE", prefix: "ORD" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { ns: $.data.id }
            - call: "POST /clerk/code-titles"
              payload: { title_number: 12, name: "Streets, Sidewalks and Public Places" }
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { ct: $.data.id, ctv: $.data.version }
            - call: "POST /clerk/code-titles/${ct}/supplement-cycles"
              payload: { supplement_number: 7, window_open_on: "2026-09-01", window_close_on: "2026-09-30" }
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { cyc: $.data.id }
            - call: "POST /clerk/instruments"
              payload: { instrument_class: "ORDINANCE", ordinance_category: "CODE_AMENDMENT", title: "Amending 12.04.030", full_text_length: 1800, number_series_id: "${ns}", code_title_id: "${ct}", code_section_ref: "12.04.030" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { instr: $.data.id }
          trigger:
            - call: "POST /clerk/codification-submissions"
              payload: { cycle_id: "${cyc}", instrument_id: "${instr}", code_section_ref: "12.04.030", action: "ADD", expected_code_title_version: "${ctv}" }
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { err: $.data.error_id }
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: CodificationEditor
              as_user_id: "ce-01"
            - call: "POST /clerk/codification-submissions"
              payload: { cycle_id: "${cyc}", instrument_id: "${instr}", code_section_ref: "12.04.030", action: "ADD", expected_code_title_version: "${ctv}" }
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { sub: $.data.id }
          assert:
            - "the first filing returns HTTP status 409"
            - "${err} == ERR_OUTSIDE_SUBMISSION_WINDOW"
            - "the second filing returns HTTP status 201"
            - "CodificationSubmission.${sub}.origin == CLIENT"
            - "CodificationSubmission.${sub}.status == PENDING"
            - "SupplementCycle.${cyc}.submission_count == 1 and client_submission_count == 1 and conflict_count == 0"

      - name: a_payment_before_assessment_is_refused_by_the_earlier_check
        claim_type: cascading_validation
        grounds: ["validations[priority=82]", "errors[ERR_FEE_NOT_ASSESSED]"]
        distinguishing_aspect: "The balance comparison cannot run before a fee exists, so validation 82 orders its own two checks: with fee_status NOT_ASSESSED the payment returns ERR_FEE_NOT_ASSESSED rather than ERR_PAYMENT_EXCEEDS_BALANCE, even though amount_cents 500 does exceed the current balance of 0."
        test_recipe:
          setup: ["One records request under review with fee_status NOT_ASSESSED."]
          setup_api_calls:
            - call: "POST /clerk/records-requests"
              payload: { requester_name: "M. Rivera", requester_email: "m.rivera@example.org", subject_description: "Bid tabulations 2026" }
              as: Anonymous
              as_user_id: "anon-01"
              captures: { req: $.data.id }
            - call: "POST /clerk/records-requests/${req}/begin-review"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
          trigger:
            - call: "POST /clerk/records-requests/${req}/payments"
              payload: { amount_cents: 500 }
              as: Requester
              as_user_id: "${req}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err} == ERR_FEE_NOT_ASSESSED"
            - "${err} != ERR_PAYMENT_EXCEEDS_BALANCE"
            - "PublicRecordsRequest.${req}.fee_status == NOT_ASSESSED"
            - "PublicRecordsRequest.${req}.total_collected_cents == 0"
            - "PublicRecordsRequest.${req}.net_cash_cents == 0"

      - name: pagination_arguments_outside_their_declared_bounds_are_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_INVALID_PAGINATION]", "response_envelope.pagination_defaults"]
        distinguishing_aspect: "The declared bounds are limit 1..100 and offset >= 0, so limit 0, limit 101 and offset -1 are each refused with ERR_INVALID_PAGINATION while limit 100 with offset 0 succeeds."
        test_recipe:
          setup: ["One venue exists so the list has something to return."]
          setup_api_calls:
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue: $.data.id }
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
          trigger:
            - call: "GET /clerk/meetings"
              payload: { limit: 0, offset: 0 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { err_low: $.data.error_id }
            - call: "GET /clerk/meetings"
              payload: { limit: 101, offset: 0 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { err_high: $.data.error_id }
            - call: "GET /clerk/meetings"
              payload: { limit: 10, offset: -1 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { err_offset: $.data.error_id }
            - call: "GET /clerk/meetings"
              payload: { limit: 100, offset: 0 }
              as: CityClerk
              as_user_id: "cc-01"
          assert:
            - "the first three calls return HTTP status 422"
            - "${err_low} == ERR_INVALID_PAGINATION"
            - "${err_high} == ERR_INVALID_PAGINATION"
            - "${err_offset} == ERR_INVALID_PAGINATION"
            - "the fourth call returns HTTP 200 with len(data) == 1, meta.total_count == 1 and meta.has_more == false"

  # ===================================================================
  # SECTION 5 — endpoints (§1.5)
  # ===================================================================
  - section: endpoints
    instances:

      - name: updating_a_venue_replaces_only_the_supplied_fields_and_bumps_the_version
        claim_type: standard_crud
        grounds: ["endpoints[PUT /clerk/venues/{venue_id}]", "entities.Venue.fields.capacity"]
        distinguishing_aspect: "PUT /clerk/venues/{venue_id} declares all three inputs optional: sending capacity alone raises it to 200, leaves teardown_buffer_minutes at 45 and status at AVAILABLE, and advances version 1 -> 2 while created_at is unchanged."
        test_recipe:
          setup: ["One venue with a non-default teardown buffer."]
          setup_api_calls:
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120, teardown_buffer_minutes: 45 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue: $.data.id, v0: $.data.version, created: $.data.created_at }
          trigger:
            - call: "PUT /clerk/venues/${venue}"
              payload: { capacity: 200 }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "GET /clerk/venues/${venue}"
              payload: {}
              as: DeputyClerk
              as_user_id: "dc-01"
          assert:
            - "the PUT returns HTTP status 200"
            - "Venue.${venue}.capacity == 200"
            - "Venue.${venue}.teardown_buffer_minutes == 45"
            - "Venue.${venue}.status == AVAILABLE"
            - "Venue.${venue}.name == 'Council Chamber'"
            - "Venue.${venue}.version == ${v0} + 1"
            - "Venue.${venue}.created_at == ${created}"
            - "the GET returns the same field values as the PUT response"

      - name: closing_a_number_series_stops_it_backing_new_instruments
        claim_type: action_endpoint
        grounds: ["endpoints[POST /clerk/number-series/{series_id}/close]", "validations[priority=36]", "errors[ERR_NUMBER_SERIES_CLOSED]"]
        distinguishing_aspect: "The close action flips status OPEN -> CLOSED without touching next_sequence or minted_count, and the very next POST /clerk/instruments naming that series is refused with ERR_NUMBER_SERIES_CLOSED."
        test_recipe:
          setup: ["One OPEN ORDINANCE 2026 series with next_sequence 5 and no instruments."]
          setup_api_calls:
            - call: "POST /clerk/number-series"
              payload: { series_year: 2026, instrument_class: "ORDINANCE", prefix: "ORD", next_sequence: 5 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { ns: $.data.id }
          trigger:
            - call: "POST /clerk/number-series/${ns}/close"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/instruments"
              payload: { instrument_class: "ORDINANCE", ordinance_category: "GENERAL", title: "Amending the noise ordinance", full_text_length: 3000, number_series_id: "${ns}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { err: $.data.error_id }
          assert:
            - "the close returns HTTP 200 with NumberSeries.${ns}.status == CLOSED"
            - "NumberSeries.${ns}.next_sequence == 5 and minted_count == 0"
            - "the instrument creation returns HTTP status 409"
            - "${err} == ERR_NUMBER_SERIES_CLOSED"
            - "GET /clerk/instruments?number_series_id=${ns} returns total_count == 0"

      - name: a_submission_links_a_cycle_and_an_instrument_and_both_must_line_up
        claim_type: cross_reference_link
        grounds: ["endpoints[POST /clerk/codification-submissions]", "validations[priority=90]", "errors[ERR_CODE_SECTION_UNKNOWN]", "errors[ERR_CYCLE_NOT_FOUND]"]
        distinguishing_aspect: "The link endpoint validates three things about the pair: the cycle must exist (unknown cycle -> ERR_CYCLE_NOT_FOUND), the submission's code_section_ref must equal the instrument's own (12.04.031 against 12.04.030 -> ERR_CODE_SECTION_UNKNOWN), and only the aligned pair creates the association, which is then readable from both filtered lists."
        test_recipe:
          setup: ["A CodeTitle with an OPEN cycle covering the default clock date, and one CODE_AMENDMENT ordinance citing 12.04.030."]
          setup_api_calls:
            - call: "POST /clerk/number-series"
              payload: { series_year: 2026, instrument_class: "ORDINANCE", prefix: "ORD" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { ns: $.data.id }
            - call: "POST /clerk/code-titles"
              payload: { title_number: 12, name: "Streets, Sidewalks and Public Places" }
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { ct: $.data.id, ctv: $.data.version }
            - call: "POST /clerk/code-titles/${ct}/supplement-cycles"
              payload: { supplement_number: 7, window_open_on: "2026-07-01", window_close_on: "2026-09-30" }
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { cyc: $.data.id }
            - call: "POST /clerk/instruments"
              payload: { instrument_class: "ORDINANCE", ordinance_category: "CODE_AMENDMENT", title: "Amending 12.04.030", full_text_length: 1800, number_series_id: "${ns}", code_title_id: "${ct}", code_section_ref: "12.04.030" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { instr: $.data.id }
          trigger:
            - call: "POST /clerk/codification-submissions"
              payload: { cycle_id: "00000000-0000-0000-0000-000000000000", instrument_id: "${instr}", code_section_ref: "12.04.030", action: "ADD", expected_code_title_version: "${ctv}" }
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { err_cycle: $.data.error_id }
            - call: "POST /clerk/codification-submissions"
              payload: { cycle_id: "${cyc}", instrument_id: "${instr}", code_section_ref: "12.04.031", action: "ADD", expected_code_title_version: "${ctv}" }
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { err_section: $.data.error_id }
            - call: "POST /clerk/codification-submissions"
              payload: { cycle_id: "${cyc}", instrument_id: "${instr}", code_section_ref: "12.04.030", action: "ADD", expected_code_title_version: "${ctv}" }
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { sub: $.data.id }
          assert:
            - "the first call returns HTTP 404 and ${err_cycle} == ERR_CYCLE_NOT_FOUND"
            - "the second call returns HTTP 422 and ${err_section} == ERR_CODE_SECTION_UNKNOWN"
            - "the third call returns HTTP status 201"
            - "CodificationSubmission.${sub}.cycle_id == ${cyc} and instrument_id == ${instr}"
            - "GET /clerk/codification-submissions?cycle_id=${cyc} returns total_count == 1"
            - "GET /clerk/codification-submissions?instrument_id=${instr} returns total_count == 1"

      - name: reading_a_request_returns_the_derived_ledger_not_stored_arithmetic
        claim_type: computed_read
        grounds: ["endpoints[GET /clerk/records-requests/{request_id}]", "calculations.records_request_fee_ledger"]
        distinguishing_aspect: "After a FLAT_SCHEDULE assessment of 1375 and a partial payment of 375, the read returns all six derived money fields consistent with one another (assessed 1375, waived 0, collected 375, refunded 0, balance 1000, net_cash 375) plus due_on 2026-08-07, and fee_status DEPOSIT_HELD alongside an untouched fulfillment_status UNDER_REVIEW."
        test_recipe:
          setup: ["One records request under review with a FLAT_SCHEDULE fee assessed and one partial payment made."]
          setup_api_calls:
            - call: "POST /clerk/records-requests"
              payload: { requester_name: "M. Rivera", requester_email: "m.rivera@example.org", subject_description: "Ordinance files 2024" }
              as: Anonymous
              as_user_id: "anon-01"
              captures: { req: $.data.id }
            - call: "POST /clerk/records-requests/${req}/begin-review"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/records-requests/${req}/assess-fee"
              payload: { fee_schedule_variant: "FLAT_SCHEDULE", fee_lines: [{ page_count: 40, staff_minutes: 40, delivery_medium: "PAPER" }] }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/records-requests/${req}/payments"
              payload: { amount_cents: 375 }
              as: Requester
              as_user_id: "${req}"
          trigger:
            - call: "GET /clerk/records-requests/${req}"
              payload: {}
              as: RecordsOfficer
              as_user_id: "ro-01"
          assert:
            - "HTTP status == 200"
            - "PublicRecordsRequest.${req}.total_assessed_cents == 1375"
            - "PublicRecordsRequest.${req}.total_waived_cents == 0"
            - "PublicRecordsRequest.${req}.total_collected_cents == 375"
            - "PublicRecordsRequest.${req}.refunded_cents == 0"
            - "PublicRecordsRequest.${req}.fee_balance_cents == 1000"
            - "PublicRecordsRequest.${req}.net_cash_cents == 375"
            - "PublicRecordsRequest.${req}.fee_status == DEPOSIT_HELD"
            - "PublicRecordsRequest.${req}.fulfillment_status == UNDER_REVIEW"
            - "PublicRecordsRequest.${req}.due_on == 2026-08-07"

      - name: a_denial_is_allowed_only_when_an_exemption_was_claimed
        claim_type: conditional_action
        grounds: ["endpoints[POST /clerk/records-requests/{request_id}/disposition]", "validations[priority=94]", "errors[ERR_DENIAL_WITHOUT_EXEMPTION]"]
        distinguishing_aspect: "Two requests reach EXEMPTION_REVIEW; the one whose exemption_claims list was empty cannot be denied (ERR_DENIAL_WITHOUT_EXEMPTION, exemption_count 0) while the one with two claims is denied and records denial_basis, proving the gate is exemption_count and not the disposition value."
        test_recipe:
          setup: ["Two records requests, both advanced to EXEMPTION_REVIEW: one with zero exemption claims and one with two."]
          setup_api_calls:
            - call: "POST /clerk/records-requests"
              payload: { requester_name: "A. Osei", requester_email: "a.osei@example.org", subject_description: "Personnel investigation file" }
              as: Anonymous
              as_user_id: "anon-01"
              captures: { req_a: $.data.id }
            - call: "POST /clerk/records-requests/${req_a}/begin-review"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/records-requests/${req_a}/exemption-review"
              payload: { exemption_claims: [] }
              as: RecordsOfficer
              as_user_id: "ro-01"
            - call: "POST /clerk/records-requests"
              payload: { requester_name: "B. Larsen", requester_email: "b.larsen@example.org", subject_description: "Litigation hold correspondence" }
              as: Anonymous
              as_user_id: "anon-02"
              captures: { req_b: $.data.id }
            - call: "POST /clerk/records-requests/${req_b}/begin-review"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/records-requests/${req_b}/exemption-review"
              payload: { exemption_claims: ["attorney-client privilege", "active investigation"] }
              as: RecordsOfficer
              as_user_id: "ro-01"
          trigger:
            - call: "POST /clerk/records-requests/${req_a}/disposition"
              payload: { disposition: "DENIAL", denial_basis: "Active investigation" }
              as: RecordsOfficer
              as_user_id: "ro-01"
              captures: { err: $.data.error_id }
            - call: "POST /clerk/records-requests/${req_b}/disposition"
              payload: { disposition: "DENIAL", denial_basis: "Attorney-client privilege" }
              as: RecordsOfficer
              as_user_id: "ro-01"
          assert:
            - "the first disposition returns HTTP status 422"
            - "${err} == ERR_DENIAL_WITHOUT_EXEMPTION"
            - "PublicRecordsRequest.${req_a}.fulfillment_status == EXEMPTION_REVIEW and exemption_count == 0 and denial_basis == null"
            - "the second disposition returns HTTP status 200"
            - "PublicRecordsRequest.${req_b}.fulfillment_status == DENIED"
            - "PublicRecordsRequest.${req_b}.exemption_count == 2"
            - "PublicRecordsRequest.${req_b}.denial_basis == 'Attorney-client privilege'"

      - name: the_agenda_item_filter_isolates_one_packet_from_another
        claim_type: standard_crud
        grounds: ["endpoints[GET /clerk/agenda-items]", "entities.AgendaItem.fields.packet_id"]
        distinguishing_aspect: "Two packet revisions on the same meeting hold two and one items respectively; the filtered list returns exactly the items of the named packet with total_count 2 and 1 — the superseded revision's items are still readable — and the item_type filter narrows further to the single PUBLIC_HEARING row."
        test_recipe:
          setup: ["One SCHEDULED meeting with two packet revisions (revision 1 SUPERSEDED by revision 2); revision 1 holds a REPORT and a PUBLIC_HEARING item, revision 2 holds one CONSENT item."]
          setup_api_calls:
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue: $.data.id }
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mtg: $.data.id, mtgv: $.data.version }
            - call: "POST /clerk/meetings/${mtg}/agenda-packets"
              payload: { expected_meeting_version: "${mtgv}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { p1: $.data.id }
            - call: "POST /clerk/agenda-packets/${p1}/agenda-items"
              payload: { sequence_number: 1, item_type: "REPORT", title: "Quarterly finance report" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/agenda-packets/${p1}/agenda-items"
              payload: { sequence_number: 2, item_type: "PUBLIC_HEARING", title: "Hearing on the Elm Street rezoning" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "GET /clerk/meetings/${mtg}"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mtgv2: $.data.version }
            - call: "POST /clerk/meetings/${mtg}/agenda-packets"
              payload: { expected_meeting_version: "${mtgv2}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { p2: $.data.id }
            - call: "POST /clerk/agenda-packets/${p2}/agenda-items"
              payload: { sequence_number: 1, item_type: "CONSENT", title: "Consent calendar" }
              as: CityClerk
              as_user_id: "cc-01"
          trigger:
            - call: "GET /clerk/agenda-items"
              payload: { packet_id: "${p1}" }
              as: DeputyClerk
              as_user_id: "dc-01"
            - call: "GET /clerk/agenda-items"
              payload: { packet_id: "${p2}" }
              as: DeputyClerk
              as_user_id: "dc-01"
            - call: "GET /clerk/agenda-items"
              payload: { packet_id: "${p1}", item_type: "PUBLIC_HEARING" }
              as: DeputyClerk
              as_user_id: "dc-01"
            - call: "GET /clerk/agenda-packets/${p1}/agenda-items"
              payload: {}
              as: DeputyClerk
              as_user_id: "dc-01"
          assert:
            - "all four calls return HTTP status 200"
            - "the p1 filter returns meta.total_count == 2 and every row has packet_id == ${p1}"
            - "the p2 filter returns meta.total_count == 1 and the row has packet_id == ${p2}"
            - "the item_type filter returns meta.total_count == 1 with item_type == PUBLIC_HEARING"
            - "the sub-resource listing under ${p1} returns the same two rows as the p1 filter"

  # ===================================================================
  # SECTION 6 — errors (§1.6) — triggerability sweep
  # ===================================================================
  - section: errors
    instances:

      - name: calls_missing_auth_headers_or_naming_an_invalid_role_are_rejected
        claim_type: error_triggerable
        grounds: ["validations[priority=1]", "validations[priority=2]", "errors[ERR_MISSING_AUTH_HEADERS]", "errors[ERR_UNKNOWN_ROLE]"]
        distinguishing_aspect: "Both auth errors are 401 and both precede every other check: a request with no X-User-Role/X-User-ID pair returns ERR_MISSING_AUTH_HEADERS and a request naming a role outside the seven in §1.7 returns ERR_UNKNOWN_ROLE, even when the body would otherwise be valid."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120 }
              as: "(both auth headers omitted)"
              as_user_id: "(omitted)"
              captures: { err_missing: $.data.error_id }
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120 }
              as: "Mayor"
              as_user_id: "mayor-01"
              captures: { err_unknown: $.data.error_id }
          assert:
            - "both calls return HTTP status 401"
            - "${err_missing} == ERR_MISSING_AUTH_HEADERS"
            - "${err_unknown} == ERR_UNKNOWN_ROLE"
            - "no Venue was created by either call"

      - name: every_remaining_entity_read_returns_its_own_not_found_error_id
        claim_type: error_triggerable
        grounds: ["validations[priority=10]", "errors[ERR_VENUE_NOT_FOUND]", "errors[ERR_BATCH_NOT_FOUND]"]
        distinguishing_aspect: "Thirteen reads against the same never-issued identifier return thirteen DISTINCT 404 error ids — the catalog does not collapse onto a single generic ERR_NOT_FOUND, and each id names the entity of the path it was read from."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /clerk/venues/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
              captures: { e_venue: $.data.error_id }
            - call: "GET /clerk/agenda-items/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
              captures: { e_item: $.data.error_id }
            - call: "GET /clerk/motions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
              captures: { e_motion: $.data.error_id }
            - call: "GET /clerk/minutes/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
              captures: { e_minutes: $.data.error_id }
            - call: "GET /clerk/number-series/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
              captures: { e_series: $.data.error_id }
            - call: "GET /clerk/instruments/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
              captures: { e_instrument: $.data.error_id }
            - call: "GET /clerk/publication-notices/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
              captures: { e_notice: $.data.error_id }
            - call: "GET /clerk/code-titles/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { e_title: $.data.error_id }
            - call: "GET /clerk/supplement-cycles/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { e_cycle: $.data.error_id }
            - call: "GET /clerk/codification-submissions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { e_submission: $.data.error_id }
            - call: "GET /clerk/records-requests/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
              captures: { e_request: $.data.error_id }
            - call: "GET /clerk/record-series/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RecordsOfficer
              as_user_id: "ro-01"
              captures: { e_recseries: $.data.error_id }
            - call: "GET /clerk/destruction-batches/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RecordsOfficer
              as_user_id: "ro-01"
              captures: { e_batch: $.data.error_id }
          assert:
            - "all thirteen calls return HTTP status 404"
