  # ===========================================================================
  # Rule 9 — compensating_invariant
  # Each instance names a quantity that MUST be conserved across a reversing
  # operation, and a companion quantity that must deliberately NOT be reversed.
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: exit_scan_restores_occupancy_while_peak_occupancy_is_retained
        grounds:
          - calculations.live_occupancy
          - calculations.gate_clearance_projection
          - entities.Event.fields.live_occupancy
          - entities.Event.fields.peak_live_occupancy
          - entities.AccessZone.fields.occupancy_count
          - state_machines.Ticket.INSIDE_to_EXITED
          - endpoints[GET /events/{id}/occupancy]
        distinguishing_aspect: |
          live_occupancy is a reversible headcount and peak_live_occupancy is a monotone
          high-water mark: after two admissions and one exit, live_occupancy must be back
          down to 1 while peak_live_occupancy stays at 2, and the ticket's
          admitted_scan_count also stays at 1 because it counts admissions, not presence.
          An implementation that recomputes the peak from the current headcount reports 1
          and fails.
        test_recipe:
          setup:
            - "Event DOORS_OPEN with fire_code_capacity 200; AccessZone GA1 (fire_code_capacity 200); Gate G1 with throughput_per_minute 20 and lanes_open 2; ONLINE ScanSession S1 open from 2026-09-12T18:10:00Z."
            - "Ada and Ben verified, each with a PAID 12000-cent ticket bound to their own device; both scan IN at 2026-09-12T18:10:00Z."
