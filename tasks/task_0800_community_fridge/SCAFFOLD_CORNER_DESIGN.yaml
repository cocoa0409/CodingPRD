        claim_type: "Violation → Error"
        grounds:
          - endpoints["POST /_clock/set_current_utc"]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Setting the logical clock to an earlier instant than its current value returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Clock at 2026-03-10."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
