            - "FeeScheduleItem.${item_parks_id}.fee_per_unit_cents == 254168 (never disturbed)"
            - "the second certify returns 200 with FeeStudy.${study_id}.status == NEXUS_CERTIFIED and certified_by_user_id analyst-1"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: notice_windows_are_half_open_so_back_to_back_notices_are_allowed
        grounds:
          - validations[priority=41]
          - entities.FeeStudy.fields.protest_window_ends_at
          - state_machines.FeeStudy.NEXUS_CERTIFIED_to_NOTICE_PUBLISHED
          - errors.ERR_NOTICE_WINDOW_OVERLAP
        distinguishing_aspect: |
          The occupied resource is the program's statutory notice window, and the
          interval is HALF-OPEN: study A occupies [2026-01-15T00:00:00Z,
          2026-02-14T00:00:00Z), so publishing study B one second before the end
          (2026-02-13T23:59:59Z) is refused with ERR_NOTICE_WINDOW_OVERLAP while publishing
          exactly at 2026-02-14T00:00:00Z is accepted. Touching endpoints do not overlap
          here - the opposite of the closed horizon-year interval.
        test_recipe:
          setup:
            - "HARBOR program with the PARKS standard only and two NEXUS_CERTIFIED studies A and B."
            - "Study A published its notice on 2026-01-15 for 30 days, so it occupies [2026-01-15T00:00:00Z, 2026-02-14T00:00:00Z) and remains in NOTICE_PUBLISHED."
            - "Study B is certified with its own allocated PARKS component and SINGLE_FAMILY line, and has never been noticed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-programs"
              payload: { name: "City of Harbor Impact Fee Program", jurisdiction_code: "HARBOR" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /facility-categories"
              payload: { fee_program_id: "${prog_id}", code: "PARKS", name: "Neighborhood Parks", demand_unit_label: "resident", existing_los_per_demand_unit: 0.0030, planned_los_per_demand_unit: 0.0040, unit_cost_cents: 45000000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cat_parks_id: $.data.id }
            - call: "POST /fee-studies"
              payload: { fee_program_id: "${prog_id}", title: "2026 Impact Fee Study", methodology: "PLAN_BASED", expected_fee_program_version: "${prog_v}" }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { study_id: $.data.id }
            - call: "GET /fee-programs/${prog_id}"
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { prog_v2: $.data.version }
            - call: "POST /fee-studies"
