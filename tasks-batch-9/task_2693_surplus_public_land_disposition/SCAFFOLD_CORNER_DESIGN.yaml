              as: RealPropertyOfficer
              captures: { parcel_id: "$.data.id", parcel_v: "$.data.version" }
            - call: "POST /appraisers"
              payload: { name: "Dana Kirkwood MAI", license_number: "AG-44274", license_expires_on: "2028-01-01T00:00:00Z" }
              as: SystemAdministrator
              captures: { appraiser_id: "$.data.id" }
            - call: "POST /appraisals"
              payload: { parcel_id: "${parcel_id}", appraiser_id: "${appraiser_id}", method: "SALES_COMPARISON", engagement_start_on: "2026-08-02T00:00:00Z", engagement_end_on: "2026-08-20T00:00:00Z", expected_parcel_version: "${parcel_v}" }
              as: RealPropertyOfficer
              captures: { appraisal_id: "$.data.id" }
            - call: "POST /appraisals/${appraisal_id}/report"
              payload: { appraised_value_cents: 100000000, effective_date: "2026-08-01T00:00:00Z", narrative: "Sales comparison of four infill sales." }
              as: Appraiser
              as_user_id: "${appraiser_id}"
            - call: "POST /declarations"
              payload: { parcel_id: "${parcel_id}", justification: "Canal Street yard is surplus after depot consolidation." }
              as: RealPropertyOfficer
              captures: { decl_id: "$.data.id" }
            - call: "POST /declarations/${decl_id}/adopt"
              payload: { resolution_number: "RES-2026-274" }
              as: BoardClerk
              as_user_id: "clerk-adopt-1"
            - call: "POST /declarations/${decl_id}/issue-notices"
              payload:
                recipient_agency_ids: ["${chal_agency_id}"]
