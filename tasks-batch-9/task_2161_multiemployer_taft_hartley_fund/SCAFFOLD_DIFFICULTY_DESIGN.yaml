  - rule_id: transitive_cascade
    instances:
      - name: audit_finalize_four_hop_eligibility_cascade
        grounds:
          - state_machines.PayrollAudit.EMPLOYER_ACCEPTED_to_CLOSED
          - calculations.participant_eligibility_replay
          - entities.PayrollAudit.fields.resulting_report_id
          - entities.CoverageMonth.fields.granting_report_id
          - entities.Participant.fields.eligibility_status
        distinguishing_aspect: |
          A depth-4 chain in which each link is caused by the previous one: finalizing the audit
          mints an AUDIT-origin POSTED report (hop 1); because that report is POSTED its line
          enters the eligibility replay and rewrites credited_hours_total to 251.30 (hop 2);
          because the replay accumulated 131.30 available hours it mints the CoverageMonth
          2026-08 (hop 3); and because coverage_through_month advanced to 2026-08 the
          participant's eligibility_status flips NOT_ELIGIBLE -> ELIGIBLE at the 2026-07 clock
          (hop 4). Its trigger is an audit closure, unlike the run-collections cascade.
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-07-01T00:00:00Z after a 2026-03 report of 151.30 hours was posted at 2026-04-01, leaving the participant with hour_bank_hours 31.30, one GRANTED CoverageMonth 2026-05 and eligibility_status NOT_ELIGIBLE."
            - "A board with 3 UNION and 3 EMPLOYER active trustees, so governance_posture is OPEN."
            - "An audit over 2026-01..2026-06 opened by auditor-001, with one 100.00-hour finding for 2026-04, accepted by the employer, and an AUDIT_SETTLEMENT motion carried by both blocs."
