      - name: an_operator_cannot_reach_another_clubs_agreement
        claim_type: peer_roles
        grounds:
          - "validations[priority=4]"
          - errors[ERR_AFFILIATE_SCOPE_VIOLATION]
          - roles[AffiliateOperator].identity
        distinguishing_aspect: "The AffiliateOperator identity is entity_backed, so the very same role and action succeeds or fails purely on whether X-User-ID equals the resource's affiliate_id — and the scope check is reached before the 404 for a genuinely unknown agreement id."
        test_recipe:
          setup:
            - "The logical clock is at 2026-04-01T00:00:00Z."
            - "Two affiliates, club A and club B; club A holds a DRAFT agreement and one OPEN MINOR facility review (score 75)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
