        distinguishing_aspect: |
          The waiver has one precondition (result == FAIL) and one non-obvious side
          effect (the deduction is halved, not cleared). Probing the PASS row first
          proves the precondition is enforced per row rather than per version, and the
          accepted waiver then pins 10 -> 5.0 deduction points and 90.0 -> 95.0
          compliance score. An implementation that zeroes the deduction reports 100.0
          and is caught by a single number.
