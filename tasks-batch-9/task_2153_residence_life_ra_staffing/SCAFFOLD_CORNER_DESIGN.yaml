              as_user_id: "${s_dee_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /residence-life/ra-applications/${app_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_eli_id}"
              captures: { err: $.data.error_id }
            - call: "POST /residence-life/ra-applications/${app_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_dee_id}"
          assert:
            - "The first submit returns HTTP 403 with data.error_id == ERR_NOT_RESOURCE_OWNER"
            - "Immediately after that refusal RAApplication.${app_id}.status == DRAFT and submitted_at == null"
            - "The second submit returns HTTP 200 and RAApplication.${app_id}.status == SUBMITTED"
            - "RAApplication.${app_id}.submitted_at == 2026-08-01T00:00:00.000Z"

