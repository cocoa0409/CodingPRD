      - name: priority_score_variant_divergence
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: priority_score_single_assessment_vs_cycle_cohort_variant
          rationale: "The single_assessment vs cycle_cohort divergence on identical stored data (75.38 versus 118.79 from the same survey, with the earliest-of-cycle input set and the days_deferred difference) is the entire subject of that §1.8 instance."
      - name: claim_basis_variant_divergence
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: claim_settlement_acv_vs_restoration_variant
          rationale: "Variant selection and divergence for the claim calculation - ACV depreciating the insured value versus RESTORATION reading the pinned estimate on the same incident data - is fully covered there."
      - name: estimate_rounding_order
        claim_type: precision
        excluded_because:
          difficulty_instance: estimate_rounds_each_line_then_sums_mode_b
          rationale: "Round-per-line-then-sum versus sum-then-round, plus the pinned overhead-before-contingency evaluation order, is exactly that §1.8 instance's discriminator."
      - name: supplemental_tier_evaluation_order
        claim_type: constants_applied
        excluded_because:
          difficulty_instance: pool_supplemental_tier_keyed_on_gross_draw_mode_c
          rationale: "Selecting the supplemental tier from the pre-fee gross draw rather than the post-fee figure is that instance's whole point; the tier-floor inclusivity corner is covered here by endowment_tier_floor_is_inclusive_and_keyed_on_the_gross_draw."
      - name: treatment_trigger_threshold_boundary
        claim_type: threshold_boundary
        excluded_because:
          difficulty_instance: condition_index_exactly_at_treatment_trigger_does_not_flag
          rationale: "The TREATMENT_TRIGGER_INDEX 55.0 boundary - exactly 55.0 stays MONITORED, 52.5 flips to TREATMENT_REQUIRED - is tested at the boundary there."

