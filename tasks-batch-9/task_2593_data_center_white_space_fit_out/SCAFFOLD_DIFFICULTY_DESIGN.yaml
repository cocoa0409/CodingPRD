# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2593 — Data Center White Space Fit-Out
#
# Every instance grounds exclusively in SCAFFOLD.yaml §1.1-§1.7. Deleting this
# file must leave the scaffold's declared behaviour identical.
#
# Shared numeric facts used by many instances (all pre-computed, never left as
# expressions in an assert):
#   busway 400A / 415V / N_PLUS_1 under a 300.00 kW PDU
#       raw_kw            = round(400 * 415 * 1.732 * 0.95 / 1000, 3) = 273.136
#       DESIGN usable     = round(min(273.1364*0.80*0.90, 240.000), 2) = 196.66
#       COMMISSIONED@0.94 = round(196.658208 * 0.94, 2)               = 184.86
#   busway 800A / 415V / N under the same PDU: raw 546.273, usable 240.00 (PDU binds)
#   busway 400A / 415V / TWO_N under the same PDU: raw 273.136, usable 109.25 (topology binds)
#   breaker derate ceiling: 32 A -> 17.48 kW, 100 A -> 54.63 kW, 400 A -> 218.51 kW, 1200 A -> 655.53 kW
#   cooling 22000 cfm / dT 18 F: 5 % leakage -> 119.07855 kW (119.08), 15 % -> 106.54396 kW (106.54)
#   cooling  3000 cfm / dT 12 F: 5 % leakage ->  10.82532 kW ( 10.83), 15 % ->   9.68581 kW (  9.69)
#   rack overhead: 7.50 -> 7.84, 12.00 -> 12.54, 15.00 -> 15.68 kW chargeable
#   diversity: 12.00 -> 10.20, 15.00 -> 12.75 kW thermal load
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: busway_usable_kw_design_vs_commissioned_divergence
        grounds:
          - calculations.busway_usable_kw
          - entities.Busway.fields.usable_variant
          - entities.Busway.fields.usable_kw
          - entities.PowerDistributionUnit.fields.measured_derate_factor
          - state_machines.Hall.FIT_OUT_to_COMMISSIONING
        distinguishing_aspect: |
          The two variants of busway_usable_kw are distinguished by whether the upstream PDU's
          measured_derate_factor participates at all: DESIGN ignores it, COMMISSIONED multiplies the
          same unrounded min() by it. Identical rated_amps / voltage_v / redundancy_topology therefore
          yield 196.66 kW before the phase advance and 184.86 kW after it on the PDU whose measured
          derate is 0.94, while the sibling busway on the 1.00-derate PDU stays at 196.66 kW — proving
          the delta comes from the variant switch, not from any change to the busway's own inputs.
        test_recipe:
          setup:
            - "Hall HA1 (MULTI_TENANT, design_kw_capacity 400.00, cooling_redundancy N) has advanced to FIT_OUT."
            - "PDU-A1 (rated 300.00 kW, feed side A, measured_derate_factor 0.94, COMMISSIONED) feeds busway BW-A1 (400 A / 415 V / N_PLUS_1); PDU-B1 (rated 300.00 kW, feed side B, measured_derate_factor 1.00, COMMISSIONED) feeds BW-B1 with identical electrical inputs."
            - "Both busways are ENERGIZED, usable_variant == DESIGN and usable_kw == 196.66."
            - "Containment zone CA-1 is at leakage_status PASS (5.00 % measured against a 5.00 % target, 20.00 Pa against a 20.00 Pa design)."
            - "Cooling unit CU-1 (120.00 kW sensible, 22000 cfm, dT 18.0 F) is IN_SERVICE, so cooling_capacity_kw == 119.08 (airflow variant binds)."
            - "Rack R-1-1 (design_kw 15.00) holds one 7.50 kW feed per side and is POWERED; Hall.committed_kw == 15.00 and each busway's committed_kw == 7.50, both far below either variant's usable_kw."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Data Hall A", code: "HA1", tenant_mode: "MULTI_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 10 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /tenants"
              payload: { name: "Northwind Systems", code: "T1", contracted_kw: 200.00, contract_start_date: "2026-01-01T00:00:00Z" }
              as: FacilityPlanner
              captures: { t1_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_a_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-B1", feed_side: "B", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_b_id: $.data.id }
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_a_id}", name: "BW-A1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
              captures: { bw_a_id: $.data.id }
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_b_id}", name: "BW-B1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
              captures: { bw_b_id: $.data.id }
            - call: "POST /containment-zones"
              payload: { hall_id: "${hall_id}", label: "CA-1", zone_type: "COLD_AISLE", containment_kind: "RIGID_ROOF", target_leakage_pct: 5.00, design_static_pressure_pa: 20.00 }
              as: MechanicalContractor
              captures: { zone1_id: $.data.id }
            - call: "POST /cooling-units"
              payload: { hall_id: "${hall_id}", name: "CU-1", rated_sensible_kw: 120.00, design_airflow_cfm: 22000, supply_delta_t_f: 18.0, redundancy_role: "PRIMARY" }
              as: MechanicalContractor
              captures: { cu1_id: $.data.id }
            - call: "POST /cages"
              payload: { hall_id: "${hall_id}", tenant_id: "${t1_id}", label: "CG-1", perimeter_length_m: 40.0 }
              as: SecurityAdministrator
              captures: { cage1_id: $.data.id }
            - call: "POST /racks"
              payload: { hall_id: "${hall_id}", containment_zone_id: "${zone1_id}", grid_row: "1", grid_col: 1, design_kw: 15.00, u_height: 45, required_feed_count: 2, cage_id: "${cage1_id}", tenant_id: "${t1_id}" }
              as: FacilityPlanner
              captures: { rack1_id: $.data.id }
            - call: "POST /halls/${hall_id}/advance-phase"
              payload: { target_status: "FIT_OUT" }
              as: FacilityPlanner
            - call: "POST /containment-zones/${zone1_id}/leakage-test"
              payload: { measured_leakage_pct: 5.00, measured_static_pressure_pa: 20.00 }
              as: MechanicalContractor
            - call: "POST /cooling-units/${cu1_id}/commission"
              payload: { measured_airflow_cfm: 22000 }
              as: MechanicalContractor
            - call: "POST /cooling-units/${cu1_id}/place-in-service"
              payload: {}
              as: MechanicalContractor
            - call: "PATCH /pdus/${pdu_a_id}"
              payload: { measured_derate_factor: 0.94 }
              as: ElectricalContractor
            - call: "PATCH /pdus/${pdu_b_id}"
              payload: { measured_derate_factor: 1.00 }
              as: ElectricalContractor
            - call: "POST /busways/${bw_a_id}/energize"
              payload: {}
              as: ElectricalContractor
            - call: "POST /busways/${bw_b_id}/energize"
              payload: {}
              as: ElectricalContractor
            - call: "POST /rack-feeds"
              payload: { rack_id: "${rack1_id}", busway_id: "${bw_a_id}", feed_side: "A", requested_kw: 7.50, breaker_amps: 32 }
              as: ElectricalContractor
              captures: { feed_a_id: $.data.id }
            - call: "POST /rack-feeds"
              payload: { rack_id: "${rack1_id}", busway_id: "${bw_b_id}", feed_side: "B", requested_kw: 7.50, breaker_amps: 32 }
              as: ElectricalContractor
              captures: { feed_b_id: $.data.id }
            - call: "POST /racks/${rack1_id}/install"
              payload: { asset_tag: "AT-0001" }
              as: FacilityPlanner
            - call: "POST /racks/${rack1_id}/power-on"
              payload: {}
              as: ElectricalContractor
          trigger:
            - call: "POST /halls/${hall_id}/advance-phase"
              payload: { target_status: "COMMISSIONING" }
              as: FacilityPlanner
          assert:
            - "Hall.${hall_id}.status == COMMISSIONING"
            - "Busway.${bw_a_id}.usable_variant == COMMISSIONED"
            - "Busway.${bw_a_id}.usable_kw == 184.86"
            - "Busway.${bw_a_id}.raw_kw == 273.136 (unchanged by the variant switch)"
            - "Busway.${bw_b_id}.usable_variant == COMMISSIONED"
            - "Busway.${bw_b_id}.usable_kw == 196.66 (measured_derate_factor 1.00 leaves the two variants equal)"
            - "the DESIGN-vs-COMMISSIONED delta on BW-A1 is exactly 11.80 kW (196.66 - 184.86)"
            - "Hall.${hall_id}.committed_kw == 15.00 and Hall.${hall_id}.spare_kw == 360.00 — the variant switch never touches the power ledger"

      - name: cooling_capacity_nameplate_vs_airflow_divergence
        grounds:
          - calculations.hall_cooling_model
          - entities.Hall.fields.cooling_capacity_nameplate_kw
          - entities.Hall.fields.cooling_capacity_airflow_kw
          - entities.Hall.fields.cooling_capacity_kw
          - state_machines.ContainmentZone.UNTESTED_to_FAIL
        distinguishing_aspect: |
          The NAMEPLATE_SENSIBLE variant is structurally blind to containment leakage while the
          AIRFLOW_LIMITED variant discounts measured airflow by the hall's WORST measured leakage, so a
          single failing leakage test moves one variant and freezes the other: nameplate stays 120.00 kW
          while airflow falls 119.08 -> 106.54 kW and the gate min() switches which variant binds.
        test_recipe:
          setup:
            - "Hall HB1 (design_kw_capacity 400.00, cooling_redundancy N) is in FIT_OUT with PDU-A1/PDU-B1 and busway BW-A1 present (phase prerequisites only)."
            - "Containment zone CA-1 is PASS with measured_leakage_pct 5.00; zone CA-2 (target 5.00 %) exists and is UNTESTED, so it takes no part in the worst-leakage selection yet."
            - "Cooling unit CU-1 (rated_sensible_kw 120.00, 22000 cfm, dT 18.0 F) is IN_SERVICE."
            - "No rack is powered, so thermal_load_kw == 0.00; cooling_capacity_nameplate_kw == 120.00, cooling_capacity_airflow_kw == 119.08, cooling_capacity_kw == 119.08, thermal_posture == NOMINAL."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Data Hall B", code: "HB1", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_a_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-B1", feed_side: "B", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_b_id: $.data.id }
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_a_id}", name: "BW-A1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
              captures: { bw_a_id: $.data.id }
            - call: "POST /containment-zones"
              payload: { hall_id: "${hall_id}", label: "CA-1", zone_type: "COLD_AISLE", containment_kind: "RIGID_ROOF", target_leakage_pct: 5.00, design_static_pressure_pa: 20.00 }
              as: MechanicalContractor
              captures: { zone1_id: $.data.id }
            - call: "POST /containment-zones"
              payload: { hall_id: "${hall_id}", label: "CA-2", zone_type: "HOT_AISLE", containment_kind: "CURTAIN", target_leakage_pct: 5.00, design_static_pressure_pa: 20.00 }
              as: MechanicalContractor
              captures: { zone2_id: $.data.id }
            - call: "POST /cooling-units"
              payload: { hall_id: "${hall_id}", name: "CU-1", rated_sensible_kw: 120.00, design_airflow_cfm: 22000, supply_delta_t_f: 18.0, redundancy_role: "PRIMARY" }
              as: MechanicalContractor
              captures: { cu1_id: $.data.id }
            - call: "POST /halls/${hall_id}/advance-phase"
              payload: { target_status: "FIT_OUT" }
              as: FacilityPlanner
            - call: "POST /containment-zones/${zone1_id}/leakage-test"
              payload: { measured_leakage_pct: 5.00, measured_static_pressure_pa: 20.00 }
              as: MechanicalContractor
            - call: "POST /cooling-units/${cu1_id}/commission"
              payload: { measured_airflow_cfm: 22000 }
              as: MechanicalContractor
            - call: "POST /cooling-units/${cu1_id}/place-in-service"
              payload: {}
              as: MechanicalContractor
          trigger:
            - call: "POST /containment-zones/${zone2_id}/leakage-test"
              payload: { measured_leakage_pct: 15.00, measured_static_pressure_pa: 20.00 }
              as: MechanicalContractor
          assert:
            - "ContainmentZone.${zone2_id}.leakage_status == FAIL"
            - "ContainmentZone.${zone2_id}.test_count == 1"
            - "Hall.${hall_id}.cooling_capacity_nameplate_kw == 120.00 (unmoved — the nameplate variant never sees leakage)"
            - "Hall.${hall_id}.cooling_capacity_airflow_kw == 106.54 (was 119.08 at 5.00 % leakage)"
            - "Hall.${hall_id}.cooling_capacity_kw == 106.54"
            - "CoolingUnit.${cu1_id}.airflow_capacity_kw == 106.54396"
            - "Hall.${hall_id}.cooling_margin_kw == 106.54 and Hall.${hall_id}.thermal_posture == NOMINAL (no rack is powered, so the drop does not breach the gate)"
            - "the two variants differ by exactly 13.46 kW after the failing test"

  - rule_id: combinatorial_formula
    instances:

      - name: busway_usable_kw_nested_min_with_topology_branch
        grounds:
          - calculations.busway_usable_kw
          - entities.Busway.fields.raw_kw
          - entities.Busway.fields.usable_kw
          - entities.Busway.fields.redundancy_topology
          - entities.PowerDistributionUnit.fields.rated_kw
        distinguishing_aspect: |
          usable_kw is not a single multiplication: it is a nested min() of a three-factor trunk term
          (rated_amps * voltage_v * SQRT3 * POWER_FACTOR / 1000, then CONTINUOUS_LOAD_FACTOR, then a
          TOPOLOGY_FACTOR selected by an enum branch) against an independent PDU ceiling
          (rated_kw * CONTINUOUS_LOAD_FACTOR). Three busways that differ only in rated_amps and
          redundancy_topology under one 300.00 kW PDU therefore land on different sides of the min():
          800 A / N is PDU-bound at 240.00, 400 A / N_PLUS_1 is trunk-bound at 196.66, and
          400 A / TWO_N is trunk-bound at 109.25 — a single flattened product reproduces none of them.
        test_recipe:
          setup:
            - "Hall HC1 (design_kw_capacity 900.00) exists in PLANNING; busway creation is not phase-gated."
            - "PDU-A1 has rated_kw 300.00, so the PDU ceiling term is round(300.00 * 0.80, 3) == 240.000 for every busway beneath it."
            - "Two busways already exist under PDU-A1: BW-BIG (800 A / 415 V / N) and BW-MID (400 A / 415 V / N_PLUS_1)."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Data Hall C", code: "HC1", tenant_mode: "MULTI_TENANT", design_kw_capacity: 900.00, gross_area_sqm: 900.0, cooling_redundancy: "N", planned_rack_count: 20 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_a_id: $.data.id }
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_a_id}", name: "BW-BIG", rated_amps: 800, voltage_v: 415, redundancy_topology: "N" }
              as: ElectricalContractor
              captures: { bw_big_id: $.data.id }
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_a_id}", name: "BW-MID", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
              captures: { bw_mid_id: $.data.id }
          trigger:
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_a_id}", name: "BW-2N", rated_amps: 400, voltage_v: 415, redundancy_topology: "TWO_N" }
              as: ElectricalContractor
              captures: { bw_2n_id: $.data.id }
          assert:
            - "Busway.${bw_big_id}.raw_kw == 546.273 and Busway.${bw_big_id}.usable_kw == 240.00 (PDU ceiling binds; the trunk term is 437.018)"
            - "Busway.${bw_mid_id}.raw_kw == 273.136 and Busway.${bw_mid_id}.usable_kw == 196.66 (trunk term binds under N_PLUS_1)"
            - "Busway.${bw_2n_id}.raw_kw == 273.136 and Busway.${bw_2n_id}.usable_kw == 109.25 (same trunk, TOPOLOGY_FACTOR 0.50 binds)"
            - "Busway.${bw_2n_id}.usable_variant == DESIGN and Busway.${bw_2n_id}.status == PLANNED"
            - "Busway.${bw_mid_id}.usable_kw != Busway.${bw_big_id}.usable_kw * 0.50, i.e. usable_kw is not a linear function of rated_amps or of the topology factor alone"
            - "Busway.${bw_2n_id}.committed_kw == 0.00 and Busway.${bw_2n_id}.feed_count == 0"

      - name: hall_chargeable_kw_round_then_sum
        grounds:
          - calculations.rack_chargeable_rollup
          - entities.Hall.fields.chargeable_kw
          - entities.Tenant.fields.allocated_kw
          - state_machines.Rack.PLANNED_to_INSTALLED
        distinguishing_aspect: |
          The roll-up pins its rounding ORDER: each rack's design_kw * 1.045 is rounded to 2 dp first and
          only then summed. Three identical 7.50 kW racks give 7.84 each and 23.52 in total, whereas
          summing first (22.50 * 1.045 = 23.5125) and rounding once gives 23.51 — a 0.01 kW discriminator
          that no reordering of the same factors can hide. The same install also advances
          Tenant.allocated_kw by raw design_kw (22.50), so the two aggregates must not be conflated.
        test_recipe:
          setup:
            - "Hall HD1 (design_kw_capacity 400.00) has advanced to FIT_OUT and holds containment zone CA-1 plus tenant T1 (contracted_kw 200.00) and cage CG-1."
            - "Three racks R-1-1, R-1-2, R-1-3 each carry design_kw 7.50, u_height 45 and tenant_id T1; all three are PLANNED, so Hall.chargeable_kw == 0.00 and Tenant.allocated_kw == 0.00."
            - "R-1-1 and R-1-2 have already been installed, giving Hall.chargeable_kw == 15.68 and Tenant.allocated_kw == 15.00."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Data Hall D", code: "HD1", tenant_mode: "MULTI_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 12 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /tenants"
              payload: { name: "Northwind Systems", code: "T1", contracted_kw: 200.00, contract_start_date: "2026-01-01T00:00:00Z" }
              as: FacilityPlanner
              captures: { t1_id: $.data.id }
            - call: "POST /containment-zones"
              payload: { hall_id: "${hall_id}", label: "CA-1", zone_type: "COLD_AISLE", containment_kind: "RIGID_ROOF", target_leakage_pct: 5.00, design_static_pressure_pa: 20.00 }
              as: MechanicalContractor
              captures: { zone1_id: $.data.id }
            - call: "POST /cages"
              payload: { hall_id: "${hall_id}", tenant_id: "${t1_id}", label: "CG-1", perimeter_length_m: 40.0 }
              as: SecurityAdministrator
              captures: { cage1_id: $.data.id }
            - call: "POST /racks"
              payload: { hall_id: "${hall_id}", containment_zone_id: "${zone1_id}", grid_row: "1", grid_col: 1, design_kw: 7.50, u_height: 45, required_feed_count: 2, cage_id: "${cage1_id}", tenant_id: "${t1_id}" }
              as: FacilityPlanner
              captures: { rack1_id: $.data.id }
            - call: "POST /racks"
              payload: { hall_id: "${hall_id}", containment_zone_id: "${zone1_id}", grid_row: "1", grid_col: 2, design_kw: 7.50, u_height: 45, required_feed_count: 2, cage_id: "${cage1_id}", tenant_id: "${t1_id}" }
              as: FacilityPlanner
              captures: { rack2_id: $.data.id }
            - call: "POST /racks"
              payload: { hall_id: "${hall_id}", containment_zone_id: "${zone1_id}", grid_row: "1", grid_col: 3, design_kw: 7.50, u_height: 45, required_feed_count: 2, cage_id: "${cage1_id}", tenant_id: "${t1_id}" }
              as: FacilityPlanner
              captures: { rack3_id: $.data.id }
            - call: "POST /halls/${hall_id}/advance-phase"
              payload: { target_status: "FIT_OUT" }
              as: FacilityPlanner
            - call: "POST /racks/${rack1_id}/install"
              payload: { asset_tag: "AT-0001" }
              as: FacilityPlanner
            - call: "POST /racks/${rack2_id}/install"
              payload: { asset_tag: "AT-0002" }
              as: FacilityPlanner
          trigger:
            - call: "POST /racks/${rack3_id}/install"
              payload: { asset_tag: "AT-0003" }
              as: FacilityPlanner
          assert:
            - "Rack.${rack3_id}.status == INSTALLED and Rack.${rack3_id}.chargeable_kw == 7.84"
            - "Hall.${hall_id}.chargeable_kw == 23.52 (round-then-sum; the sum-then-round answer 23.51 is wrong)"
            - "Tenant.${t1_id}.allocated_kw == 22.50 (raw design_kw, no overhead factor)"
            - "Hall.${hall_id}.custody_fitout_count == 3 and Hall.${hall_id}.custody_ops_count == 0"
            - "Hall.${hall_id}.committed_kw == 0.00 (installation books no electrical capacity; only rack-feeds do)"
            - "Rack.${rack3_id}.asset_tag == AT-0003 and Hall.${hall_id}.rack_total_count == 3"

      - name: hall_reserve_tier_keyed_on_committed_kw_evaluation_order
        grounds:
          - calculations.hall_power_ledger
          - entities.Hall.fields.committed_kw
          - entities.Hall.fields.commissioning_reserve_kw
          - entities.Hall.fields.spare_kw
          - validations[priority=45]
        distinguishing_aspect: |
          The ledger is a pinned three-step waterfall whose middle step is a tier lookup keyed ONLY on the
          Step 1 committed_kw, and whose Step 3 subtracts both earlier results — so the three outputs are
          jointly, not independently, determined. Adding a 5.00 kW feed at committed_kw == 100.00 (tier 1's
          inclusive upper bound) moves committed to 105.00, flips the reserve 25.00 -> 50.00 and drops
          spare_kw by 30.00, not by 5.00; a formula that recomputed the tier from spare_kw would oscillate.
        test_recipe:
          setup:
            - "Hall HE1 (design_kw_capacity 400.00) has advanced to FIT_OUT."
            - "PDU-A1 and PDU-B1 (rated_kw 300.00 each) carry busways BW-A1 and BW-B1 (400 A / 415 V / N_PLUS_1, usable_kw 196.66, still PLANNED — feed reservation does not require an energized busway)."
            - "Rack R-1-1 (design_kw 100.00, required_feed_count 2) holds a 50.00 kW RESERVED feed on each side, so committed_kw == 100.00, commissioning_reserve_kw == 25.00 (tier 1, inclusive upper bound) and spare_kw == 275.00."
            - "Rack R-1-2 (design_kw 5.00, required_feed_count 1) is PLANNED with no feed yet."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Data Hall E", code: "HE1", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 12 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /pdus"
