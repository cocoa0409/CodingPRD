      - name: scrub_conflicting_terms_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_NOTIFICATION_SCRUB_MISMATCH]"]
        distinguishing_aspect: "Two sources disagree (ratio 2 from weight-10, ratio 3 from weight-5): submitting the LOSER's terms (3:1) fails with ERR_NOTIFICATION_SCRUB_MISMATCH — the winner is chosen by reliability_weight, not by the analyst."
