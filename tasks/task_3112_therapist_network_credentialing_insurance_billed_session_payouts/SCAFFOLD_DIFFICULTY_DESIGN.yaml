              captures: { claim_q2: $.data.id }
            - call: "POST /network/claims/${claim_q1}/adjudicate"
              payload: { outcome: "PAID" }
              as: OpsAdmin
            - call: "POST /network/claims/${claim_q2}/adjudicate"
              payload: { outcome: "DENIED", denial_code: "NOT_COVERED" }
              as: OpsAdmin
            - call: "POST /network/payout-batches"
              payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-08T00:00:00Z", schedule: "WEEKLY" }
              as: OpsAdmin
              captures: { batch_b1: $.data.id }
          trigger:
            - call: "GET /network/payout-batches/${batch_b1}"
              payload: {}
              as: OpsAdmin
              captures: { b1_v: $.data.version, before_lines: $.data.line_count }
            - call: "GET /network/clinicians/${clinician_id}/payout-lines"
              payload: { line_status: "PENDING", limit: 10, offset: 0 }
              as: OpsAdmin
              captures: { before_line_net: $.data.0.net_cents, before_line_status: $.data.0.line_status }
            - call: "POST /network/payout-batches/${batch_b1}/supersede"
              payload: { expected_open_batch_version: "${b1_v}" }
              as: OpsAdmin
            - call: "POST /network/payout-batches"
              payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-08T00:00:00Z", schedule: "WEEKLY" }
              as: OpsAdmin
              captures: { batch_b2: $.data.id }
            - call: "POST /network/payout-batches/${batch_b2}/lock"
              payload: {}
              as: OpsAdmin
              captures: { b2_net: $.data.total_net_cents }
            - call: "GET /network/payout-batches/${batch_b1}"
              payload: {}
              as: OpsAdmin
              captures: { after_status: $.data.status, after_net: $.data.total_net_cents, after_lines: $.data.line_count }
            - call: "GET /network/clinicians/${clinician_id}/payout-lines"
              payload: { line_status: "PENDING", limit: 10, offset: 0 }
              as: OpsAdmin
              captures: { after_line_net: $.data.0.net_cents }
          assert:
            - "before the supersede, the scheduled-basis line net is ${before_line_net} == 30000 and ${before_line_status} == PENDING, and the line carries both session ${q1_id}, whose claim is PAID, and session ${q2_id}, whose claim is DENIED"
            - "before the supersede the batch is still OPEN with ${before_lines} == 0 lines, because lines are materialized only at lock time"
            - "after the supersede and the rebuild, PayoutBatch.${batch_b1}.status == ${after_status} == SKIPPED and its total_net_cents == ${after_net} == 0 and its line_count == ${after_lines} == 0"
            - "the replacement batch carries the whole amount: PayoutBatch.${batch_b2}.total_net_cents == ${b2_net} == 30000"
            - "the conserved quantity is invariant at 30000 cents: it is carried by the single PENDING line before the supersede, and by PayoutBatch.${batch_b2} afterwards, never by both and never by neither"
            - "the voided line is excluded rather than paid: the count of PENDING lines is 1 both before and after, and no CLAWED_BACK line exists on either batch"
            - "the clinician's single PENDING line still reports ${after_line_net} == 30000, so no earning was duplicated onto a second line"
            - "Clinician.${clinician_id}.payout_balance_cents == 0 throughout, because no batch was ever paid; the caller must POST /network/payout-batches/{id}/pay on a LOCKED batch to move it"

