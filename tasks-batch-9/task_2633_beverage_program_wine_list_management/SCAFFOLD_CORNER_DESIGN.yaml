              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "PATCH /beverage-program/list-entries/${e1_id}"
              payload: { tasting_note: "Controller edit attempt." }
              as: Controller
              as_user_id: "ctl-001"
            - call: "POST /beverage-program/list-versions/${lv_id}/entries"
              payload: { wine_id: "00000000-0000-4000-8000-000000000000", sort_rank: 3, expected_list_version_version: "${lv_v2}", by_the_glass: false, par_bottles: 6 }
