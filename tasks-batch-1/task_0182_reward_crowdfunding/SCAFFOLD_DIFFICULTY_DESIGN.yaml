              captures: { b1_id: $.data.id }
            - call: "POST /backers"
              payload: { email: "b2@x.com", display_name: "B2" }
              as: PlatformAdmin
              captures: { b2_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
