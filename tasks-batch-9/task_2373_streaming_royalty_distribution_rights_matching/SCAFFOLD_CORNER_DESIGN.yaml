              as: RightsOpsAnalyst
              captures: { wr: "$.data.id" }
            - call: "POST /royalties/works"
              payload: { work_type: "COMPOSITION", identifier: "T9001234567", title: "Midnight Ledger", artist_credit: "Vale / Okonkwo" }
