            - { call: "POST /billing-cycle-periods", payload: { cycle_code: "CF1", period_start_date: "2026-08-01", period_end_date: "2026-08-31", read_window_open_date: "2026-08-03", read_window_close_date: "2026-08-07", bill_run_date: "2026-08-31" }, as: MeterOpsAdmin, captures: { period_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /billing-cycle-periods/${period_id}/open-read-window", payload: {}, as: BillingLiaison }
            - { call: "POST /routes", payload: { billing_cycle_period_id: "${period_id}", scheduled_date: "2026-08-03", route_shift: "AM" }, as: Dispatcher, captures: { route_id: $.data.id } }
            - { call: "GET /routes/${route_id}/stops", payload: {}, as: Dispatcher, captures: { stop_id: "$.data[0].id", sv: "$.data[0].version" } }
            - { call: "POST /routes/${route_id}/assign", payload: { technician_id: "${tech_id}" }, as: Dispatcher }
            - { call: "POST /routes/${route_id}/start", payload: {}, as: FieldTechnician, as_user_id: "${tech_id}" }
          trigger:
            - { call: "POST /route-stops/${stop_id}/reads", payload: { meter_id: "${m1}", read_value: 77, read_at: "2026-08-03T09:00:00Z", expected_route_stop_version: "${sv}" }, as: FieldTechnician, as_user_id: "${tech_id}", captures: { read_id: $.data.id } }
            - { call: "GET /route-stops/${stop_id}", payload: {}, as: Dispatcher, captures: { cur: $.data.current_read_id, st: $.data.stop_status } }
          assert:
            - "immediately after capture: current_read_id == ${read_id} (${cur}) and stop_status == READ_CAPTURED (${st})"
