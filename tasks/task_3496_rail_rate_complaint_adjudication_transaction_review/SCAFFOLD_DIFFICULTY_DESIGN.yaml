              as: Shipper
              as_user_id: "shp-ada"
              captures: { t1: $.data.id }
            - call: "POST /stb/rate-complaints"
              payload: { shipper_id: "shp-ada", carrier_id: "${c_oktx}", commodity: "GRAIN", challenged_rate_cents_per_ton: 20000, alleged_variable_cost_cents_per_ton: 10000, annual_tons: 100, relief_sought_cents: 100000001, contested_fiscal_year: 2025 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { t2: $.data.id }
            - call: "POST /stb/rate-complaints"
              payload: { shipper_id: "shp-ada", carrier_id: "${c_oktx}", commodity: "GRAIN", challenged_rate_cents_per_ton: 20000, alleged_variable_cost_cents_per_ton: 10000, annual_tons: 100, relief_sought_cents: 400000000, contested_fiscal_year: 2025 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { t3: $.data.id }
            - call: "POST /stb/rate-complaints"
              payload: { shipper_id: "shp-ada", carrier_id: "${c_oktx}", commodity: "GRAIN", challenged_rate_cents_per_ton: 20000, alleged_variable_cost_cents_per_ton: 10000, annual_tons: 100, relief_sought_cents: 400000001, contested_fiscal_year: 2025 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { t4: $.data.id }
          assert:
