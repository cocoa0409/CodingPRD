              payload: { name: "CB AO", routing_number: "222000030" }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Pia", account_number: "A-2022", reg_cc_eligible: true }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-AO", amount_cents: 200000, encoded_amount_cents: 200000, image_quality_score: 90, capture_channel: "BRANCH" }
              as: ItemProcessor
              captures: { item_id: $.data.id }
            - call: "POST /bank/check-items/${item_id}/present"
              as: ItemProcessor
            - call: "POST /bank/check-items/${item_id}/pay"
              as: ItemProcessor
            - call: "POST /bank/recredit-requests"
              payload: { depositor_account_id: "${acct_id}", check_item_id: "${item_id}", claimed_amount_cents: 1000, reason: "first" }
              as: CustomerService
          trigger:
            - call: "POST /bank/recredit-requests"
              payload: { depositor_account_id: "${acct_id}", check_item_id: "${item_id}", claimed_amount_cents: 2000, reason: "second" }
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_RECREDIT_ALREADY_OPEN'"
      - name: recredit_not_eligible_account
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_RECREDIT_NOT_ELIGIBLE]"]
        distinguishing_aspect: "An account with reg_cc_eligible false cannot file recredit requests: ERR_RECREDIT_NOT_ELIGIBLE (422)."
        test_recipe:
          setup: ["account reg_cc_eligible false with a PAID item"]
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB NE", routing_number: "222000031" }
