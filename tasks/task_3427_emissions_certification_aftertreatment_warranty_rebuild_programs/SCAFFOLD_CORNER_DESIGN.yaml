# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3427_emissions_certification_aftertreatment_warranty_rebuild_programs
#
# Breadth probe across the claim-extraction-guide taxonomy. Corners already
# exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because
# stubs. Anchored chains (&k_*) replay the canonical path: clock -> PUBLISHED
# standard -> family with ACTIVE calibrated spec -> 3 ACCEPTED runs ->
# CERTIFIED -> IN_PRODUCTION -> fleet / authorized center / technician / tool.
# Each instance is transcribed against an empty database.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: standard_create_returns_201_draft_with_system_defaults
        claim_type: Creation
        grounds:
          - entities.RegulationStandard
          - state_machines.RegulationStandard
        distinguishing_aspect: "A standard created with the full field set returns 201 with status DRAFT, null published_at and successor_standard_id, version 1, and server-minted id/created_at/updated_at; the envelope carries meta.api_request_id."
        test_recipe:
          setup:
            - "Logical clock at the startup default 2026-09-01T00:00:00Z (never set)."
          setup_api_calls:
            - &k_clock0
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &k_std
              call: "POST /emissions/regulation-standards"
              payload: { code: "EPA2027-HD", nox_limit_g_per_bhp_hr: 0.35, pm_limit_g_per_bhp_hr: 0.01, useful_life_miles: 435000, useful_life_hours: 22000, useful_life_years: 10, base_warranty_years: 2, base_warranty_miles: 50000, effective_model_year_first: 2027, effective_model_year_last: 2030 }
              as: PlatformAdmin
              captures: { std_id: $.data.id, std_v: $.data.version }
          assert:
            - "the response status is 201 and response_type is object"
            - "RegulationStandard.${std_id}.status == DRAFT and version == 1 via ${std_v}"
            - "RegulationStandard.${std_id}.published_at is null and successor_standard_id is null"
            - "response data carries non-null id, created_at and updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: standard_get_round_trips_every_posted_field
        claim_type: Retrieval
        grounds:
          - entities.RegulationStandard
          - endpoints.GET_/emissions/regulation-standards/{id}
        distinguishing_aspect: "Every posted configuration value (limits, useful-life triple, base warranty pair, model-year window) round-trips byte-identical through GET."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; standard EPA2027-HD created."
          setup_api_calls:
            - *k_clock0
            - *k_std
          trigger:
            - call: "GET /emissions/regulation-standards/${std_id}"
              payload: {}
              as: RegulatoryOfficer
          assert:
            - "the response status is 200"
            - "RegulationStandard.${std_id}.nox_limit_g_per_bhp_hr == 0.35 and pm_limit_g_per_bhp_hr == 0.01"
            - "RegulationStandard.${std_id}.useful_life_miles == 435000 and useful_life_hours == 22000 and useful_life_years == 10"
            - "RegulationStandard.${std_id}.base_warranty_years == 2 and base_warranty_miles == 50000"
            - "RegulationStandard.${std_id}.effective_model_year_first == 2027 and effective_model_year_last == 2030"

      - name: engine_families_list_paginates_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/emissions/engine-families
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three DESIGN families on one standard, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns 1 row with has_more false; the certification_status filter narrows the counted set."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; standard PUBLISHED; three families F-A/F-B/F-C created, all DESIGN."
          setup_api_calls:
            - *k_clock0
            - *k_std
            - &k_std_pub
              call: "POST /emissions/regulation-standards/${std_id}/publish"
              payload: {}
              as: RegulatoryOfficer
            - &k_fam
              call: "POST /emissions/engine-families"
              payload: { family_code: "F-A", model_year: 2027, regulation_standard_id: "${std_id}", displacement_liters: 14.9, architecture: "DOC_DPF_SCR" }
              as: CertificationEngineer
              captures: { fam_id: $.data.id, fam_v: $.data.version }
            - call: "POST /emissions/engine-families"
              payload: { family_code: "F-B", model_year: 2027, regulation_standard_id: "${std_id}", displacement_liters: 8.9, architecture: "EGR_DOC_DPF_SCR" }
              as: CertificationEngineer
            - call: "POST /emissions/engine-families"
              payload: { family_code: "F-C", model_year: 2028, regulation_standard_id: "${std_id}", displacement_liters: 6.7, architecture: "DOC_DPF_SCR_ASC" }
              as: CertificationEngineer
          trigger:
            - call: "GET /emissions/engine-families"
              payload: { limit: 2, offset: 0 }
              as: CertificationEngineer
          assert:
            - "the response status is 200 and response_type is array"
            - "the page returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /emissions/engine-families?limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /emissions/engine-families?certification_status=DESIGN returns 3 rows; with no parameters the default limit 10 and offset 0 apply"

      - name: engine_unit_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/emissions/engine-units/{id}
          - errors.ERR_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but never-allocated UUID in the path yields 404 ERR_NOT_FOUND, not a 400 and not an empty object."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; empty database."
          setup_api_calls:
            - *k_clock0
          trigger:
            - call: "GET /emissions/engine-units/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { nf_err: $.data.error_id }
          assert:
            - "the response status is 404 with error_id ERR_NOT_FOUND via ${nf_err}"
            - "the response envelope has response_type error and a non-empty message"
      - name: claim_create_missing_required_amount_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.WarrantyClaim.fields.claimed_amount_cents
          - errors.ERR_INVALID_REQUEST
          - validations[priority=3]
        distinguishing_aspect: "Omitting the required claimed_amount_cents from an otherwise valid claim yields 400 ERR_INVALID_REQUEST at the request-shape gate before any state or coverage logic runs."
        test_recipe:
          setup:
            - "Logical clock 2026-12-01T00:00:00Z; family IN_PRODUCTION; unit UN-101 IN_SERVICE; center AUTHORIZED."
          setup_api_calls:
            - *k_clock0
            - *k_std
            - *k_std_pub
            - *k_fam
            - &k_spec
              call: "POST /emissions/engine-families/${fam_id}/aftertreatment-specs"
              payload: { scr_catalyst_part: "SCR-900", dpf_part: "DPF-450", doser_part: "DSR-12", nox_sensor_count: 2, expected_engine_family_version: "${fam_v}" }
              as: CertificationEngineer
              captures: { spec_id: $.data.id }
            - &k_cal
              call: "POST /emissions/aftertreatment-specs/${spec_id}/calibrate"
              payload: { observed_nox_ppm_avg: 250, observed_def_consumption_g_per_kwh: 7.4 }
              as: CertificationEngineer
            - &k_act
              call: "POST /emissions/aftertreatment-specs/${spec_id}/activate"
              payload: {}
              as: CertificationEngineer
            - &k_bt
              call: "POST /emissions/engine-families/${fam_id}/begin-testing"
              payload: {}
              as: CertificationEngineer
            - &k_ftp
              call: "POST /emissions/engine-families/${fam_id}/test-runs"
              payload: { test_type: "FTP", lab_code: "LAB-1", scheduled_start: "2026-10-05T00:00:00Z", scheduled_end: "2026-10-07T00:00:00Z" }
              as: CertificationEngineer
              captures: { run_ftp_id: $.data.id }
            - &k_ftp_rec
              call: "POST /emissions/test-runs/${run_ftp_id}/record-results"
              payload: { measured_nox_g_per_bhp_hr: 0.30, measured_pm_g_per_bhp_hr: 0.008, deterioration_factor: 1.1 }
              as: CertificationEngineer
            - &k_ftp_rev
              call: "POST /emissions/test-runs/${run_ftp_id}/review"
              payload: { decision: "ACCEPT" }
              as: RegulatoryOfficer
            - &k_rmc
              call: "POST /emissions/engine-families/${fam_id}/test-runs"
              payload: { test_type: "RMC", lab_code: "LAB-2", scheduled_start: "2026-10-05T00:00:00Z", scheduled_end: "2026-10-07T00:00:00Z" }
              as: CertificationEngineer
              captures: { run_rmc_id: $.data.id }
            - &k_rmc_rec
              call: "POST /emissions/test-runs/${run_rmc_id}/record-results"
              payload: { measured_nox_g_per_bhp_hr: 0.30, measured_pm_g_per_bhp_hr: 0.008, deterioration_factor: 1.1 }
              as: CertificationEngineer
            - &k_rmc_rev
              call: "POST /emissions/test-runs/${run_rmc_id}/review"
              payload: { decision: "ACCEPT" }
              as: RegulatoryOfficer
            - &k_set
              call: "POST /emissions/engine-families/${fam_id}/test-runs"
              payload: { test_type: "SET", lab_code: "LAB-3", scheduled_start: "2026-10-05T00:00:00Z", scheduled_end: "2026-10-07T00:00:00Z" }
              as: CertificationEngineer
              captures: { run_set_id: $.data.id }
            - &k_set_rec
              call: "POST /emissions/test-runs/${run_set_id}/record-results"
              payload: { measured_nox_g_per_bhp_hr: 0.30, measured_pm_g_per_bhp_hr: 0.008, deterioration_factor: 1.1 }
              as: CertificationEngineer
            - &k_set_rev
              call: "POST /emissions/test-runs/${run_set_id}/review"
              payload: { decision: "ACCEPT" }
              as: RegulatoryOfficer
            - &k_submit
              call: "POST /emissions/engine-families/${fam_id}/submit-review"
              payload: {}
              as: CertificationEngineer
              as_user_id: "ce-quinn"
            - &k_cert
              call: "POST /emissions/engine-families/${fam_id}/certify"
              payload: {}
              as: RegulatoryOfficer
              as_user_id: "ro-mara"
            - &k_eip
              call: "POST /emissions/engine-families/${fam_id}/enter-production"
              payload: {}
              as: RegulatoryOfficer
            - &k_fleet
              call: "POST /emissions/fleets"
              payload: { name: "Blue Line Logistics", fleet_code: "BLL", notification_contact: "ops@bll.example" }
              as: PlatformAdmin
              captures: { flt_id: $.data.id }
            - &k_center
              call: "POST /emissions/service-centers"
              payload: { name: "Desert Ridge Diesel", region: "SW", bay_capacity_per_day: 2 }
              as: PlatformAdmin
              captures: { ctr_id: $.data.id }
            - &k_tech2
              call: "POST /emissions/service-centers/${ctr_id}/technicians"
              payload: { full_name: "Tess Adey", badge_id: "T-01", certification_level: "LEVEL_2", emissions_endorsed: true }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - &k_authz
              call: "POST /emissions/service-centers/${ctr_id}/audit"
              payload: {}
              as: PlatformAdmin
            - &k_authz2
              call: "POST /emissions/service-centers/${ctr_id}/authorize"
              payload: { authorization_tier: "CERTIFIED" }
              as: PlatformAdmin
            - &k_tool
              call: "POST /emissions/service-centers/${ctr_id}/diagnostic-tools"
              payload: { tool_serial: "DT-9001", software_version: "7.3.1" }
              as: PlatformAdmin
              captures: { tool_id: $.data.id }
            - &k_unit
              call: "POST /emissions/engine-units"
              payload: { engine_family_id: "${fam_id}", fleet_id: "${flt_id}", serial_number: "UN-101", in_service_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { unit_id: $.data.id, unit_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /emissions/warranty-claims"
              payload: { engine_unit_id: "${unit_id}", service_center_id: "${ctr_id}", failed_component_class: "ENGINE_BASE", failure_code: "FC-miss" }
              as: FleetManager
              as_user_id: "${flt_id}"
              captures: { shape_err: $.data.error_id }
          assert:
            - "the response status is 400 with error_id ERR_INVALID_REQUEST via ${shape_err}"
            - "no claim row exists afterwards: GET /emissions/warranty-claims?engine_unit_id=${unit_id} returns an empty array"

      - name: technician_create_stamps_certification_window_defaults
        claim_type: Defaults
        grounds:
          - entities.Technician.fields.certification_expires_at
          - entities.Technician.fields.cert_status
        distinguishing_aspect: "A technician created at clock 2026-09-01T00:00:00 gets certified_at equal to the clock, certification_expires_at exactly 730 days later (2028-08-31T00:00:00Z, spanning the 2028 leap day), and cert_status CERT_ACTIVE."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; center created (APPLIED)."
          setup_api_calls:
            - *k_clock0
            - call: "POST /emissions/service-centers"
              payload: { name: "Desert Ridge Diesel", region: "SW", bay_capacity_per_day: 2 }
              as: PlatformAdmin
              captures: { ctr_id: $.data.id }
          trigger:
            - call: "POST /emissions/service-centers/${ctr_id}/technicians"
              payload: { full_name: "Tess Adey", badge_id: "T-01", certification_level: "LEVEL_2", emissions_endorsed: true }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Technician.${tech_id}.certified_at == 2026-09-01T00:00:00Z"
            - "Technician.${tech_id}.certification_expires_at == 2028-08-31T00:00:00Z (certified_at + 730 days)"
            - "Technician.${tech_id}.cert_status == CERT_ACTIVE and service_center_id == ${ctr_id}"

      - name: engine_unit_model_year_copied_from_family
        claim_type: Computed Fields
        grounds:
          - entities.EngineUnit.fields.model_year
        distinguishing_aspect: "The unit's model_year is copied from its family (2027); it is not a client input and cannot diverge from the family."
        test_recipe:
          setup:
            - "Logical clock 2026-11-15T00:00:00Z; family IN_PRODUCTION; fleet registered."
          setup_api_calls:
            - *k_clock0
            - *k_std
            - *k_std_pub
            - *k_fam
            - *k_spec
            - *k_cal
            - *k_act
            - *k_bt
            - *k_ftp
            - *k_ftp_rec
            - *k_ftp_rev
            - *k_rmc
            - *k_rmc_rec
            - *k_rmc_rev
            - *k_set
            - *k_set_rec
            - *k_set_rev
            - *k_submit
            - *k_cert
            - *k_eip
            - *k_fleet
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /emissions/engine-units"
              payload: { engine_family_id: "${fam_id}", fleet_id: "${flt_id}", serial_number: "UN-102", in_service_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
          assert:
            - "the response status is 201 and EngineUnit.${unit_id}.model_year == 2027 (copied from the family)"
            - "EngineUnit.${unit_id}.lifecycle == IN_SERVICE, campaign_compliance == CLEAR, accumulated_miles == 0, accumulated_hours == 0, predictive_service_due == false, version == 1"

      - name: spec_create_supersedes_prior_and_increments_version
        claim_type: Computed Fields
        grounds:
          - entities.AftertreatmentSpec.fields.spec_version
          - state_machines.AftertreatmentSpec.ACTIVE_to_SUPERSEDED
          - concurrency_rules[spec-create-stale-family]
        distinguishing_aspect: "A second spec create with the family's current version (2 after the first create bumped it) yields spec_version 2, leaves the family at version 3, and flips the first ACTIVE spec to SUPERSEDED."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; family DESIGN with one ACTIVE calibrated spec (family version 2 after the supersede-bumping first create)."
          setup_api_calls:
            - *k_clock0
            - *k_std
            - *k_std_pub
            - *k_fam
            - *k_spec
            - *k_cal
            - *k_act
            - call: "GET /emissions/engine-families/${fam_id}"
              payload: {}
              as: CertificationEngineer
              captures: { fam_v2: $.data.version }
          trigger:
            - call: "POST /emissions/engine-families/${fam_id}/aftertreatment-specs"
              payload: { scr_catalyst_part: "SCR-901", dpf_part: "DPF-451", doser_part: "DSR-12", nox_sensor_count: 2, expected_engine_family_version: "${fam_v2}" }
              as: CertificationEngineer
              captures: { spec2_id: $.data.id, spec2_v: $.data.spec_version }
            - call: "GET /emissions/aftertreatment-specs/${spec_id}"
              payload: {}
              as: CertificationEngineer
              captures: { spec1_status: $.data.status }
          assert:
            - "family version advanced to 2 after the first spec create (captured ${fam_v2} == 2), so the second create honours OCC"
            - "AftertreatmentSpec.${spec2_id}.spec_version == 2 via ${spec2_v} and status == DRAFT, calibration_status == UNCALIBRATED"
            - "first spec ${spec_id} is SUPERSEDED via ${spec1_status}"
            - "EngineFamily.${fam_id}.version == 3 after the second create"

      - name: maintenance_record_is_immutable_append_only
        claim_type: Immutability
        grounds:
          - entities.MaintenanceRecord
        distinguishing_aspect: "MaintenanceRecord carries common_fields: false — its create response has id and created_at but no version and no updated_at, and the API exposes no update or delete path for it."
        test_recipe:
          setup:
            - "Logical clock 2026-11-15T00:00:00Z; family IN_PRODUCTION; unit UN-101 IN_SERVICE."
          setup_api_calls:
            - *k_clock0
            - *k_std
            - *k_std_pub
            - *k_fam
            - *k_spec
            - *k_cal
            - *k_act
            - *k_bt
            - *k_ftp
            - *k_ftp_rec
            - *k_ftp_rev
            - *k_rmc
            - *k_rmc_rec
            - *k_rmc_rev
            - *k_set
            - *k_set_rec
            - *k_set_rev
            - *k_submit
            - *k_cert
            - *k_eip
            - *k_fleet
            - *k_unit
          trigger:
            - call: "POST /emissions/engine-units/${unit_id}/maintenance-records"
              payload: { performed_at: "2026-11-10T00:00:00Z", maintenance_type: "OIL_CHANGE", odometer_at_service: 0 }
              as: FleetManager
              as_user_id: "${flt_id}"
              captures: { mr_id: $.data.id }
          assert:
            - "the response status is 201 and data carries id and created_at"
            - "the response data has no version field and no updated_at field (append-only entity)"
            - "GET /emissions/engine-units/${unit_id}/maintenance-records returns exactly 1 row with maintenance_type == OIL_CHANGE"

      - name: family_create_with_invalid_enum_architecture_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.EngineFamily.fields.architecture
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "An architecture value outside {DOC_DPF_SCR, DOC_DPF_SCR_ASC, EGR_DOC_DPF_SCR} is rejected 400 ERR_INVALID_REQUEST at the shape gate."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; standard PUBLISHED."
          setup_api_calls:
            - *k_clock0
            - *k_std
            - *k_std_pub
          trigger:
            - call: "POST /emissions/engine-families"
              payload: { family_code: "F-BAD", model_year: 2027, regulation_standard_id: "${std_id}", displacement_liters: 14.9, architecture: "WANKEL" }
              as: CertificationEngineer
              captures: { enum_err: $.data.error_id }
          assert:
            - "the response status is 400 with error_id ERR_INVALID_REQUEST via ${enum_err}"

      - name: campaign_announce_computes_notified_unit_count
        claim_type: Computed Fields
        grounds:
          - entities.FieldCampaign.fields.notified_unit_count
          - state_machines.FieldCampaign.DRAFT_to_ANNOUNCED
        distinguishing_aspect: "notified_unit_count is never client-supplied: announcing over exactly two IN_SERVICE units stamps 2, and the response is computed at announce time."
        test_recipe:
          setup:
            - "Logical clock 2026-12-15T00:00:00Z; family IN_PRODUCTION and NON_CONFORMING; units UN-101 and UN-102 IN_SERVICE."
          setup_api_calls:
            - *k_clock0
            - *k_std
            - *k_std_pub
            - *k_fam
            - *k_spec
            - *k_cal
            - *k_act
            - *k_bt
            - *k_ftp
            - *k_ftp_rec
            - *k_ftp_rev
            - *k_rmc
            - *k_rmc_rec
            - *k_rmc_rev
            - *k_set
            - *k_set_rec
            - *k_set_rev
            - *k_submit
            - *k_cert
            - *k_eip
            - *k_fleet
            - *k_unit
            - call: "POST /emissions/engine-units"
              payload: { engine_family_id: "${fam_id}", fleet_id: "${flt_id}", serial_number: "UN-102", in_service_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { unit_b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /emissions/engine-families/${fam_id}/in-use-results"
              payload: { test_period_label: "2027-MY-Q1", sample_size: 10, passing_units: 8 }
              as: RegulatoryOfficer
            - call: "POST /emissions/field-campaigns"
              payload: { engine_family_id: "${fam_id}", campaign_code: "CMP-C1", campaign_type: "RECALL", defect_summary: "SCR washcoat", remedy_description: "Replace catalyst", remedy_bay_days: 1 }
              as: RegulatoryOfficer
              captures: { cmp_id: $.data.id }
          trigger:
            - call: "POST /emissions/field-campaigns/${cmp_id}/announce"
              payload: {}
              as: RegulatoryOfficer
              captures: { notified: $.data.notified_unit_count }
          assert:
            - "the announce response has status ANNOUNCED with notified_unit_count == 2 via ${notified}"
            - "both units now read campaign_compliance == CAMPAIGN_OPEN via GET /emissions/engine-families/${fam_id}/engine-units"
            - "FieldCampaign.${cmp_id}.announced_at == 2026-12-15T00:00:00Z"

  - section: state_machines
    instances:
      - name: begin_testing_without_active_spec_returns_error
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.EngineFamily.DESIGN_to_TESTING
          - errors.ERR_NO_ACTIVE_AFTERTREATMENT_SPEC
        distinguishing_aspect: "A family with no ACTIVE aftertreatment spec cannot begin testing: the create path is blocked until the spec pipeline (create -> calibrate -> activate) completes."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; standard PUBLISHED; family F-A DESIGN with no spec."
          setup_api_calls:
            - *k_clock0
            - *k_std
