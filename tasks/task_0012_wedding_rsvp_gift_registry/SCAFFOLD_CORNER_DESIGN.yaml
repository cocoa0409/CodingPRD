          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_ir", title: "IR Wedding", ceremony_at: "2027-06-01T18:00:00Z", rsvp_deadline_at: "2027-05-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_ir"
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /weddings/${w_id}/meal-options"
