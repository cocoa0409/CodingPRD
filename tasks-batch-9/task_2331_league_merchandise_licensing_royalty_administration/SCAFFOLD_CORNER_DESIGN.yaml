      - name: agreement_termination_revokes_approved_sku_and_suspends_authorization
        claim_type: cross_entity
        grounds:
          - state_machines.LicenseAgreement.ACTIVE_to_TERMINATED
          - state_machines.ProductSubmission.APPROVED_to_REVOKED
          - state_machines.RetailerAuthorization.AUTHORIZED_to_SUSPENDED
          - entities.RetailerAuthorization.fields.suspension_reason
          - entities.TerritoryGrant.fields.status
        distinguishing_aspect: |
          Terminating the agreement reaches a RetailerAuthorization that belongs to
          the LICENSEE, not to the agreement — three entities away. The APPROVED
          submission is revoked with revocation_reason 'COMPLIANCE_ORDER', which
          drops approved_sku_count to 0, which leaves the JERSEY sku class with no
          approved submission, which suspends the AUTHORIZED authorization with
          suspension_reason 'NO_APPROVED_SKUS'. The GRANTED territory grant is
          revoked by the same call. Stopping at the submission leaves a live
          authorization for a product nobody may make.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "licensee LIC_Q2 ACTIVE with an ACTIVE agreement AGR_Q2 on category JERSEY, a GRANTED US/ALL territory grant and MarkRight LEAGUE_SHIELD ACTIVE"
            - "one APPROVED submission for sku_class JERSEY, so approved_sku_count == 1"
            - "one AUTHORIZED DEPARTMENT authorization whose sku_classes are exactly ['JERSEY']"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/product-categories"
              payload: { category_code: "JERSEY", display_name: "Authentic Jerseys", base_royalty_rate_bps: 1200, tier_schedule: [{ from_cents: 0, to_cents: 2000000, rate_bps: 1200 }, { from_cents: 2000000, to_cents: 5000000, rate_bps: 1000 }, { from_cents: 5000000, to_cents: null, rate_bps: 800 }], closeout_rate_bps: 500, exclusivity_allowed: true, minimum_guarantee_floor_cents: 1000000, mark_usage_class: "LEAGUE_CLUB_AND_PLAYER", closeout_cap_pct_bps: 1500, closeout_hard_limit_bps: 4000, deduction_cap_pct_bps: 500, deduction_hard_limit_bps: 2000, advance_floor_bps_of_mg: 2500, central_licensing_default: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { cat_jersey: $.data.id }
            - call: "POST /licensing/mark-rights"
              payload: { mark_code: "LEAGUE_SHIELD", owner_type: "LEAGUE", usage_class: "PRIMARY", royalty_share_bps: 0 }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { mark_league: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Quayside Merch", contact_email: "ops@quayside.example", home_country_code: "US", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { lic_q2: $.data.id }
            - call: "POST /licensing/licensees/${lic_q2}/status"
              payload: { action: "ACTIVATE", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements"
              payload: { licensee_id: "${lic_q2}", category_id: "${cat_jersey}", exclusivity_mode: "NON_EXCLUSIVE", minimum_guarantee_cents: 1000000, required_advance_cents: 250000, term_start_date: "2026-01-01", term_end_date: "2027-12-31", central_licensing_flag: false }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { agr_q2: $.data.id }
            - call: "POST /licensing/agreements/${agr_q2}/territory-grants"
              payload: { territory_code: "US", channel_class: "ALL", effective_from: "2026-01-01", effective_to: "2028-01-01" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements/${agr_q2}/advance-payments"
              payload: { amount_cents: 250000 }
              as: FinanceController
              as_user_id: "u_fin_1"
            - call: "POST /licensing/agreements/${agr_q2}/contract-status"
              payload: { action: "SUBMIT_FOR_SIGNATURE" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements/${agr_q2}/contract-status"
              payload: { action: "ACTIVATE", countersigned_by: "R. Vance" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements/${agr_q2}/product-submissions"
              payload: { sku_class: "JERSEY", product_name: "Home Replica Jersey", mark_ids: ["${mark_league}"], retail_price_cents: 11999, sample_required: false }
              as: Licensee
              as_user_id: "${lic_q2}"
              captures: { sub_q2: $.data.id }
            - call: "POST /licensing/product-submissions/${sub_q2}/submit"
              as: Licensee
