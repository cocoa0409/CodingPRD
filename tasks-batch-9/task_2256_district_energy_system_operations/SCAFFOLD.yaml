        actor: SystemController
        preconditions: ["ProductionAsset.availability_state == DERATED"]
        side_effects: ["sets ProductionAsset.availability_state = AVAILABLE", "increments ProductionAsset.version by 1"]
      - from: AVAILABLE
        to: OUTAGE
        trigger: "POST /district-energy/production-assets/{asset_id}/availability with availability_state=OUTAGE, or system cascade from FuelSupplyContract to EXPIRED"
        actor: SystemController
        preconditions: ["ProductionAsset.availability_state == AVAILABLE"]
        side_effects: ["sets ProductionAsset.availability_state = OUTAGE", "increments ProductionAsset.version by 1"]
      - from: DERATED
        to: OUTAGE
        trigger: "POST /district-energy/production-assets/{asset_id}/availability with availability_state=OUTAGE, or system cascade from FuelSupplyContract to EXPIRED"
        actor: SystemController
        preconditions: ["ProductionAsset.availability_state == DERATED"]
        side_effects: ["sets ProductionAsset.availability_state = OUTAGE", "increments ProductionAsset.version by 1"]
      - from: OUTAGE
        to: AVAILABLE
