  - rule_id: transitive_cascade
    instances:
      - name: critical_escalation_five_hop_cascade_unwinds_letter_approvals_and_seats
        grounds:
          - state_machines.DiligenceRequest.OPEN_to_ESCALATED
          - state_machines.Restructuring.DILIGENCE_to_LOI_NEGOTIATION
          - state_machines.LetterOfIntent.EXECUTED_to_SUPERSEDED
          - state_machines.BoardApproval.RECORDED_to_SUPERSEDED
          - calculations.governance_seat_allocation
          - complexity_profile.complexity_layers.cascading_side_effects
        distinguishing_aspect: |
          One escalate call on a CRITICAL finding must propagate five hops that each
          depend on the previous one: (1) the finding becomes ESCALATED, (2) the deal
          reverts REGULATORY_REVIEW -> LOI_NEGOTIATION and round_no increments, (3)
          because the deal re-entered LOI_NEGOTIATION the EXECUTED letter becomes
          SUPERSEDED with exclusivity RELEASED, (4) because that letter is SUPERSEDED
          both CERTIFIED board approvals become SUPERSEDED, (5) because those approvals
          are SUPERSEDED their allocated_seats return to reserved_seat_pool and both
          organizations' governance_seats reset to 0. Cutting the chain at any depth
          leaves an observable inconsistency - most visibly reserved_seat_pool stuck at
          0 while no CERTIFIED approval holds the 15 seats.
