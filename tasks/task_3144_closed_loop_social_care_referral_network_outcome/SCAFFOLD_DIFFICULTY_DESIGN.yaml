            - "ServiceOffering.${o_id}.capacity_consumed == 0 (reservation released by hop 2)"
            - "Client.${k_id}.open_referral_count == 0"
            - "PaymentClaim.${cl_id}.status == VOIDED (hop 3: claim under the revoked-consent referral chain is voided by the cascade)"
            - "CareNetwork.${net_id}.network_escrow_reserved_cents == 5000 (hop 4: escrow reserve funded from network_escrow_cents)"
            - "CareNetwork.${net_id}.network_escrow_cents == 95000"

      - name: org_suspension_depth3_referral_decline_reassignment_overflow_cancel
        grounds:
          - state_machines.Organization.ACTIVE_to_SUSPENDED
          - state_machines.Referral.ROUTED_to_DECLINED
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (org suspension, not
