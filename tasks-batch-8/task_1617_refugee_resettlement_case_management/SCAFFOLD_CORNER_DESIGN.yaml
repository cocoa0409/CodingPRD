        distinguishing_aspect: "The snapshot includes only cases with actual_arrival_date in [period_start, period_end) and only their benchmarks with due_date in the same half-open window: a case arrived 2026-10-05 contributes itself and its four 30-day benchmarks (due 2026-11-04), while a PRE_ARRIVAL case and the 90-day benchmarks due 2027-01-03 are excluded."
