      - name: error_period_not_open_on_invoice_submit
        claim_type: Error triggerable
        grounds:
          - errors[ERR_PERIOD_NOT_OPEN]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / invoice_submit_gated_on_settlement_period_status
          rationale: "Asserted as the failure path of the named §1.8 instance, which submits into a CLOSED period."

      - name: error_no_proratable_coupons_on_final_run
        claim_type: Error triggerable
        grounds:
          - errors[ERR_NO_PRORATABLE_COUPONS]
        excluded_because:
          difficulty_instance: boundary_precision_check / final_proration_over_empty_flown_coupon_set
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_memo_window_expired_on_late_raise
        claim_type: Error triggerable
        grounds:
          - errors[ERR_MEMO_WINDOW_EXPIRED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / memo_raise_window_beats_coupon_not_on_invoice
          rationale: "The named §1.8 instance raises a memo 46 days after clearance and asserts this exact error_id."

      - name: error_carrier_suspended_on_ticket_issue
        claim_type: Error triggerable
        grounds:
          - errors[ERR_CARRIER_SUSPENDED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / suspended_carrier_safety_beats_duplicate_ticket_number
          rationale: "The named §1.8 instance issues a ticket from a suspended carrier and asserts this exact error_id."

      - name: error_duplicate_ticket_number_on_reissue
        claim_type: Error triggerable
        grounds:
          - errors[ERR_DUPLICATE_TICKET_NUMBER]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / suspended_carrier_safety_beats_duplicate_ticket_number
          rationale: "Covered as the losing check of the named §1.8 priority conflict; the same request reuses an existing ticket_number."

      - name: error_operating_carrier_suspended_on_fly
        claim_type: Error triggerable
        grounds:
          - errors[ERR_OPERATING_CARRIER_SUSPENDED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / coupon_fly_gated_on_operating_carrier_standing
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_agreement_period_overlap_on_activate
        claim_type: Error triggerable
        grounds:
          - errors[ERR_AGREEMENT_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / agreement_windows_are_closed_closed_so_shared_end_day_conflicts
