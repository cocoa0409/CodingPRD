            - "after the trigger: SeriesOrderNegotiation.${neg_id}.status == WITHDRAWN with withdrawn_reason carrying the project's abandon_reason, and agreed_at still null"
            - "after the trigger: reserved_episode_count == 0, committed_episode_count == 0, available_episode_count == 20, posture == OPEN"
