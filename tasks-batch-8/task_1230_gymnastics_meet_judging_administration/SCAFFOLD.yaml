# ============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted to invoke endpoint" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "Path-templated resource id does not exist" }
  - { id: ERR_FK_NOT_FOUND, http: 404, condition: "Body-referenced foreign key does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing or malformed (schema-level)" }
  - { id: ERR_MEET_POSTURE_FORBIDS, http: 409, condition: "Parent Meet.posture blocks the requested child mutation" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity-specific state precondition failed" }
  - { id: ERR_STALE_SCORE_VERSION, http: 412, condition: "OCC: expected_score_version does not match current Score.version" }
  - { id: ERR_STALE_INQUIRY_VERSION, http: 412, condition: "OCC: expected_inquiry_version does not match current Inquiry.version" }
  - { id: ERR_STALE_SESSION_VERSION, http: 412, condition: "OCC: expected_session_version does not match current Session.version" }
  - { id: ERR_COACH_CREDENTIAL_LAPSED, http: 422, condition: "Coach background check or safety cert expired" }
  - { id: ERR_JUDGE_CONFLICT_OF_INTEREST, http: 422, condition: "Judge.affiliated_gym matches a home_gym in the session's entry list" }
  - { id: ERR_JUDGE_UNAVAILABLE, http: 422, condition: "Judge availability window does not cover Session scheduled interval" }
  - { id: ERR_INSUFFICIENT_JUDGE_POOL, http: 422, condition: "judge_panel_selector: eligible pool < required_judge_count" }
  - { id: ERR_PANEL_UNDERSTAFFED, http: 422, condition: "JudgePanel does not have required CONFIRMED judges for activation" }
  - { id: ERR_INQUIRY_WINDOW_EXPIRED, http: 422, condition: "Inquiry filed after published_at + Meet.inquiry_window_minutes" }
  - { id: ERR_INQUIRY_ALREADY_OPEN, http: 409, condition: "Second inquiry filed while another is FILED or UNDER_REVIEW on the same score" }
  - { id: ERR_INQUIRY_RESOLUTION_INCONSISTENT, http: 422, condition: "UPHELD requires non-zero delta; DENIED requires all deltas == 0" }
  - { id: ERR_INQUIRY_DELTA_RANGE, http: 422, condition: "Inquiry delta outside allowed range" }
  - { id: ERR_WARMUP_BLOCK_OVERLAP, http: 422, condition: "WarmupBlock interval overlaps another block on the same rotation (half-open arithmetic)" }
  - { id: ERR_ROTATION_OVERLAP, http: 422, condition: "Rotation scheduled interval overlaps another rotation in the same session" }
  - { id: ERR_SESSION_OUTSIDE_MEET_WINDOW, http: 422, condition: "Session scheduled interval outside Meet's [start_date, end_date + 2h]" }
  - { id: ERR_SCORE_FIELD_RANGE, http: 422, condition: "difficulty_score, execution_score, or neutral_deduction outside declared range or precision" }
  - { id: ERR_SQUAD_CAPACITY_EXCEEDED, http: 422, condition: "Squad assignment would exceed Meet.max_athletes_per_squad" }
  - { id: ERR_LEVEL_BAND_MISMATCH, http: 422, condition: "Gymnast.competitive_level incompatible with Session.level_band" }
  - { id: ERR_GYMNAST_DOUBLE_ENTERED, http: 409, condition: "Gymnast already has non-SCRATCHED entry in another session of same meet" }
  - { id: ERR_TICKET_DUPLICATE_EMAIL, http: 409, condition: "(session_id, holder_email) already has non-VOID ticket" }
  - { id: ERR_TICKET_PRICE_MISMATCH, http: 422, condition: "COMP ticket price_cents != 0, or non-COMP price_cents <= 0" }
  - { id: ERR_TICKET_SEAT_SECTION_INVALID, http: 422, condition: "RESERVED/VIP missing seat_section, or GA/COMP has seat_section set" }
  - { id: ERR_TICKET_OUTSIDE_SCAN_WINDOW, http: 422, condition: "Scan attempted outside [session_start - 2h, session_end]" }
  - { id: ERR_REFUND_WINDOW_CLOSED, http: 422, condition: "Refund attempted after Session.scheduled_start" }
  - { id: ERR_SCORE_AMEND_AFTER_PUBLISH, http: 409, condition: "PUT /scores/{id} attempted when score_state != DRAFT" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Mutation attempted on entity in terminal state" }

# ============================================================================
# §1.7 RBAC Matrix
# ============================================================================
roles:
  - name: MeetDirector
    description: "Meet organizer; owns all meet/session/squad setup, scoring close, finalization, award generation, ticket refunds, coach pass issuance, qualification confirm/revoke"
    identity: opaque
    exclusive_operations:
      - "POST /api/v1/meets"
      - "POST /api/v1/meets/{id}/publish"
      - "POST /api/v1/meets/{id}/close-scoring"
      - "POST /api/v1/meets/{id}/finalize"
      - "POST /api/v1/meets/{id}/archive"
      - "POST /api/v1/meets/{id}/sessions"
      - "POST /api/v1/sessions/{id}/close"
      - "POST /api/v1/sessions/{id}/squads"
      - "POST /api/v1/sessions/{id}/assign-squads"
      - "POST /api/v1/sessions/{id}/rotations/generate"
      - "POST /api/v1/rotations/{id}/open-scoring"
      - "POST /api/v1/rotations/{id}/close-scoring"
      - "POST /api/v1/rotations/{id}/warmup-blocks"
      - "POST /api/v1/rotations/{id}/warmup-blocks/generate"
      - "POST /api/v1/sessions/{id}/awards/generate"
      - "POST /api/v1/coaches"
      - "POST /api/v1/coaches/{id}/verify"
      - "POST /api/v1/gymnasts"
      - "POST /api/v1/meets/{id}/coach-meet-passes"
      - "POST /api/v1/coach-meet-passes/{id}/grant-floor-access"
      - "POST /api/v1/coach-meet-passes/{id}/suspend"
      - "POST /api/v1/coach-meet-passes/{id}/reinstate"
      - "POST /api/v1/coach-meet-passes/{id}/revoke"
      - "POST /api/v1/spectator-tickets/{id}/refund"
      - "POST /api/v1/spectator-tickets/{id}/void"
      - "POST /api/v1/qualification-records/{id}/confirm"
      - "POST /api/v1/qualification-records/{id}/revoke"
      - "POST /api/v1/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints across the surface"
      - "POST /api/v1/sessions/{id}/athlete-entries (shared with Coach)"
      - "POST /api/v1/athlete-entries/{id}/scratch (shared with Coach)"
      - "POST /api/v1/meets/{id}/sessions/{sid}/spectator-tickets (shared with GateAttendant)"

  - name: MeetReferee
    description: "Head judge; oversees panels, confirms/recuses assignments, resolves inquiries, finalizes scores, voids draft scores"
    identity: opaque
    exclusive_operations:
      - "POST /api/v1/judges"
      - "POST /api/v1/sessions/{id}/judge-panels"
      - "POST /api/v1/judge-panels/{id}/auto-assign"
      - "POST /api/v1/panel-assignments/{id}/confirm"
      - "POST /api/v1/panel-assignments/{id}/recuse"
      - "POST /api/v1/panel-assignments/{id}/release"
      - "POST /api/v1/inquiries/{id}/begin-review"
      - "POST /api/v1/inquiries/{id}/return-to-queue"
      - "POST /api/v1/inquiries/{id}/resolve"
      - "POST /api/v1/scores/{id}/finalize"
      - "POST /api/v1/scores/{id}/void"
    shared_operations:
      - "GET endpoints across the surface"

  - name: JudgePanelChief
    description: "Chief judge on a specific apparatus panel; enters and publishes scores for that apparatus. Segregation-of-duties: cannot also resolve inquiries on the same score."
    identity: "entity_backed:Judge"
    exclusive_operations:
      - "POST /api/v1/athlete-entries/{id}/scores"
      - "PUT /api/v1/scores/{id}"
      - "POST /api/v1/scores/{id}/publish"
    shared_operations:
      - "GET endpoints across the surface"

  - name: Coach
    description: "Club coach; checks in athletes, scratches entries, files inquiries on own athletes' scores, declines qualification records"
    identity: "entity_backed:Coach"
    exclusive_operations:
      - "POST /api/v1/athlete-entries/{id}/check-in"
      - "POST /api/v1/scores/{id}/inquiries"
      - "POST /api/v1/inquiries/{id}/withdraw"
      - "POST /api/v1/qualification-records/{id}/decline"
    shared_operations:
      - "GET endpoints across the surface"
      - "POST /api/v1/sessions/{id}/athlete-entries (shared with MeetDirector)"
      - "POST /api/v1/athlete-entries/{id}/scratch (shared with MeetDirector)"

  - name: GateAttendant
    description: "Gate staff; scans and redeems spectator tickets, sells walk-up tickets"
    identity: opaque
    exclusive_operations:
      - "POST /api/v1/spectator-tickets/{id}/scan"
      - "POST /api/v1/spectator-tickets/{id}/redeem"
    shared_operations:
      - "POST /api/v1/meets/{id}/sessions/{sid}/spectator-tickets (shared with MeetDirector)"
      - "GET /api/v1/meets/{id}/spectator-tickets"
      - "GET /api/v1/sessions/{id}/spectator-tickets"

  - name: Spectator
    description: "Public read-only access to meet data, live scores, awards"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /api/v1/meets"
      - "GET /api/v1/meets/{id}"
      - "GET /api/v1/meets/{id}/sessions"
      - "GET /api/v1/sessions/{id}"
      - "GET /api/v1/sessions/{id}/live-scores"
      - "GET /api/v1/sessions/{id}/awards"
      - "GET /api/v1/athlete-entries/{id}/scores"
      - "GET /api/v1/athlete-entries/{id}/awards"
      - "GET /api/v1/rotations/{id}/scores"
      - "GET /api/v1/scores/{id}"
