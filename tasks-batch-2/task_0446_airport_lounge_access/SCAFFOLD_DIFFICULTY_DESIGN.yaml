  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cesd_visit_checkin_depends_on_lounge_status
        grounds:
          - state_machines.Visit.HELD_to_CHECKED_IN
          - state_machines.Lounge.OPEN_to_CLOSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Visit->Lounge pair: a HELD visit cannot check in once its Lounge is CLOSED — the Visit transition's validity
          depends on the Lounge entity's state.
        test_recipe:
          setup:
            - "Member holds VisitV on lounge L (HELD). NetworkAdmin then closes L (OCC-guarded). The held visit's check-in is now blocked because the lounge is CLOSED."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PRESTIGE", included_visits_per_year: 10, included_guest_visits_per_year: 5, overage_charge_cents: 5000, guest_charge_cents: 2500, min_card_status: "BASIC", annual_fee_cents: 0 }
              as: NetworkAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "LClose", airport_code: "PDX", capacity: 50, settlement_rate_cents: 1200, guest_fee_cents: 1000, day_pass_price_cents: 4000 }
              as: NetworkAdmin
              captures: { l_id: $.data.id, l_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", full_name: "Close Member" }
              as: NetworkAdmin
              captures: { m_id: $.data.id }
            - call: "POST /eligibility-cards"
              payload: { member_id: "${m_id}", card_status: "BASIC", fare_class: "ECONOMY", valid_until: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /visits"
              payload: { member_id: "${m_id}", lounge_id: "${l_id}", guest_count: 0, expected_lounge_version: "${l_v0}" }
              as: NetworkAdmin
              captures: { v_id: $.data.id, l_v1: $.data.version }
            - call: "POST /lounges/${l_id}/close"
              payload: { expected_lounge_version: "${l_v1}" }
              as: NetworkAdmin
          trigger:
            - call: "POST /visits/${v_id}/check-in"
              payload: {}
              as: LoungeAgent
              as_user_id: "${l_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE (Visit check-in blocked because Lounge.${l_id}.status == CLOSED)"
            - "Visit.${v_id}.status stays HELD"

      - name: cesd_visit_hold_depends_on_member_standing
        grounds:
          - state_machines.Visit.HELD_to_CHECKED_IN
          - state_machines.Member.GOOD_to_SUSPENDED
          - errors[ERR_MEMBER_SUSPENDED]
        distinguishing_aspect: |
          Visit->Member pair (different entity pair from Visit->Lounge): a member SUSPENDED by accumulated no-show
          strikes cannot open a new HELD visit — Visit creation depends on the Member entity's standing.
        test_recipe:
          setup:
            - "Member accrues 3 NO_SHOW strikes (held then expired+swept) -> standing SUSPENDED. A subsequent hold attempt is rejected."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PRESTIGE", included_visits_per_year: 50, included_guest_visits_per_year: 5, overage_charge_cents: 5000, guest_charge_cents: 2500, min_card_status: "BASIC", annual_fee_cents: 0 }
