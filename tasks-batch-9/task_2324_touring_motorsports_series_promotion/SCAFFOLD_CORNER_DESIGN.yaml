      - name: corner_cascade_a_booking_withdrawal_unwind
        claim_type: Side Effect Execution
        grounds:
          - state_machines.VenueBooking.CONFIRMED_to_WITHDRAWN
        excluded_because:
          difficulty_instance: "transitive_cascade / withdrawing_a_confirmed_booking_unwinds_stop_orders_tiers_and_season_budget"
          rationale: "All five CASCADE A links, both TicketOrder terminal branches and the Season budget release are asserted end-to-end as the whole subject of that §1.8 instance."

