scenario: "1934. Rail Crew Calling & Hours of Service (Class I crew management center): extra board & seniority-based calling, statutory rest & undisturbed-rest compliance, mark-up/lay-off status management, job assignment & deadhead transport, fatigue model & assignment limit, vacation/personal day bidding, crew shortage & recrew coordination, timekeeping & agreement-based pay rules"
domain_name: rail-crew-calling-hours-service
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Employee
    parent: null
    common_fields: true
    fields:
      - name: employee_number
        type: string
        source: input
        description: "Craft-unique payroll number supplied at hire; unique across the railroad."
      - name: full_name
        type: string
        source: input
        description: "Legal display name."
      - name: craft
        type: enum
        source: input
        description: "Operating craft; constraints: CONDUCTOR | ENGINEER | BRAKEMAN | YARDMASTER."
      - name: seniority_date
        type: datetime
        source: input
        description: "Date the employee established seniority in craft; earlier = more senior."
      - name: availability_status
        type: enum
        source: system
        description: "Availability posture; constraints: AVAILABLE | MARKED_OFF | ON_LEAVE | ON_ASSIGNMENT | ON_REST | SUSPENDED."
        default: AVAILABLE
      - name: cumulative_duty_minutes_month
        type: integer
        source: computed
        description: "Minutes on duty in the current calendar month across all assignments; recomputed by the hos_duty_accumulation calculation on every duty-event transition."
        default: 0
      - name: fatigue_score
        type: number
        source: computed
        description: "Weighted fatigue index 0..100 computed by fatigue_index; higher = more fatigued."
        default: 0
      - name: home_terminal
        type: string
        source: input
        description: "Home terminal station code where the employee reports."

  - name: ExtraBoard
    parent: null
    common_fields: true
    fields:
      - name: board_code
        type: string
        source: input
        description: "Unique board identifier (e.g. CHI-CONDR-EB-01)."
      - name: craft
        type: enum
        source: input
        description: "Craft this board protects; constraints: CONDUCTOR | ENGINEER | BRAKEMAN | YARDMASTER."
      - name: terminal
        type: string
        source: input
        description: "Terminal station code the board covers."
      - name: guaranteed_slots
        type: integer
        source: input
        description: "Agreement-guaranteed board size; the pool cannot be cut below this many ACTIVE slots."

  - name: ExtraBoardSlot
    parent: null
    common_fields: true
    fields:
      - name: board_id
        type: string
        source: input
        description: "FK -> ExtraBoard.id; the board this standing slot belongs to."
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; the employee occupying the slot."
      - name: standing_position
        type: integer
        source: computed
        description: "1-based first-out position on the board; maintained by the board_rotation calculation."
      - name: slot_status
        type: enum
        source: system
        description: "constraints: ACTIVE | FROZEN | VACATED."
        default: ACTIVE

  - name: Job
    parent: null
    common_fields: true
    fields:
      - name: job_symbol
        type: string
        source: input
        description: "Train or yard assignment symbol (e.g. M-CHIGAL1-15A)."
      - name: craft
        type: enum
        source: input
        description: "Craft required; constraints: CONDUCTOR | ENGINEER | BRAKEMAN | YARDMASTER."
      - name: origin_terminal
        type: string
        source: input
        description: "On-duty terminal code."
      - name: report_time
        type: datetime
        source: input
        description: "Scheduled on-duty time (UTC)."
      - name: crew_required
        type: integer
        source: input
        description: "Number of crew of this craft required on the job; >= 1."
      - name: filled_count
        type: integer
        source: computed
        description: "Count of Assignment rows in status MARKED_UP or ON_DUTY for this job; maintained by assignment create/lay-off cascades."
        default: 0
      - name: job_status
        type: enum
        source: system
        description: "constraints: BULLETINED | CALLING | FILLED."
        default: BULLETINED

  - name: Call
    parent: null
    common_fields: true
    fields:
      - name: job_id
        type: string
        source: input
        description: "FK -> Job.id; the job being called for."
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; the employee being called."
      - name: call_status
        type: enum
        source: system
        description: "constraints: OFFERED | ACCEPTED | DECLINED | NO_ANSWER | EXPIRED | RESCINDED."
        default: OFFERED
      - name: offered_at
        type: datetime
        source: system
        description: "Server-stamped time the call entered OFFERED."
      - name: expires_at
        type: datetime
        source: computed
        description: "offered_at + CALL_RESPONSE_WINDOW_MINUTES (constant 120 minutes); system auto-transitions OFFERED -> EXPIRED when the logical clock passes this."
      - name: responded_at
        type: datetime
        source: system
        description: "Server-stamped when ACCEPTED or DECLINED; null until response."
        constraints: "nullable"

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - name: job_id
        type: string
        source: input
        description: "FK -> Job.id."
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id."
      - name: call_id
        type: string
        source: input
        description: "FK -> Call.id; the accepted call that produced this assignment."
      - name: assignment_status
        type: enum
        source: system
        description: "constraints: MARKED_UP | ON_DUTY | TIE_UP_PENDING | COMPLETED | LAID_OFF | RECREWED."
        default: MARKED_UP
      - name: on_duty_at
        type: datetime
        source: system
        description: "Stamped on transition to ON_DUTY."
        constraints: "nullable"
      - name: off_duty_at
        type: datetime
        source: system
        description: "Stamped when duty ends (TIE_UP_PENDING)."
        constraints: "nullable"
      - name: deadhead_minutes
        type: integer
        source: input
        description: "Paid deadhead transport minutes attached to this assignment (0 if none)."
        default: 0
      - name: deadhead_mode
        type: enum
        source: input
        description: "constraints: NONE | TAXI | COMPANY_VEHICLE | TRAIN."
        default: NONE

  - name: RestPeriod
    parent: null
    common_fields: false
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; the resting employee."
      - name: rest_start
        type: datetime
        source: system
        description: "Stamped when the rest period opens (off-duty)."
      - name: rest_end
        type: datetime
        source: system
        description: "Stamped when the rest period closes (next mark-up); null while OPEN."
        constraints: "nullable"
      - name: rest_status
        type: enum
        source: system
        description: "constraints: OPEN | SATISFIED | DISTURBED."
        default: OPEN
      - name: undisturbed_minutes
        type: integer
        source: computed
        description: "Minutes between rest_start and the last disturbance (or rest_end if undisturbed); drives statutory compliance checks."

  - name: LeaveBid
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; the bidder."
      - name: leave_type
        type: enum
        source: input
        description: "constraints: VACATION | PERSONAL_DAY."
      - name: start_date
        type: datetime
        source: input
        description: "First calendar day of leave (UTC midnight, CLOSED interval start)."
      - name: end_date
        type: datetime
        source: input
        description: "Last calendar day of leave (UTC midnight, CLOSED interval end — the end day IS part of the leave)."
      - name: bid_status
        type: enum
        source: system
        description: "constraints: SUBMITTED | AWARDED | DENIED | CANCELLED."
        default: SUBMITTED
      - name: decided_at
        type: datetime
        source: system
        description: "Stamped on AWARDED/DENIED."
        constraints: "nullable"

  - name: PayRecord
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id."
      - name: assignment_id
        type: string
        source: input
        description: "FK -> Assignment.id; the assignment whose time is being claimed."
      - name: claimed_minutes
        type: integer
        source: input
        description: "Duty minutes the employee claims for the assignment."
      - name: claimed_deadhead_minutes
        type: integer
        source: input
        description: "Deadhead minutes the employee claims."
        default: 0
      - name: gross_pay_cents
        type: integer
        source: computed
        description: "Computed by agreement_pay; provisional at submit, final at finalize."
      - name: record_status
        type: enum
        source: system
        description: "constraints: DRAFT | SUBMITTED | DISPUTED | FINALIZED."
        default: DRAFT

  - name: CrewShortage
    parent: null
    common_fields: true
    fields:
      - name: job_id
        type: string
        source: input
        description: "FK -> Job.id; the uncovered job."
      - name: craft
        type: string
        source: input
        description: "Craft short."
      - name: shortage_status
        type: enum
        source: system
        description: "constraints: OPEN | RECREWING | RESOLVED | ESCALATED."
        default: OPEN
      - name: opened_at
        type: datetime
        source: system
        description: "Stamped when the shortage is declared."
      - name: resolved_at
        type: datetime
        source: system
        description: "Stamped on RESOLVED."
        constraints: "nullable"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Employee
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: MARKED_OFF
        trigger: "POST /api/employees/{id}/lay-off"
        actor: Employee
        preconditions:
          - "employee.availability_status == AVAILABLE"
        side_effects:
          - "every ExtraBoardSlot with employee_id == employee.id and slot_status == ACTIVE flips to FROZEN; board_rotation recalculates standing_position for remaining ACTIVE slots on each affected board"
        note: "Employee books off; board standing freezes (does NOT vacate) so mark-up restores position."
      - from: MARKED_OFF
        to: AVAILABLE
        trigger: "POST /api/employees/{id}/mark-up"
        actor: Employee
        preconditions:
          - "employee.availability_status == MARKED_OFF"
          - "no RestPeriod with employee_id == employee.id and rest_status == OPEN exists whose undisturbed_minutes < MIN_UNDISTURBED_REST_MINUTES"
        side_effects:
          - "any RestPeriod with employee_id == employee.id and rest_status == OPEN closes: rest_end = now, rest_status = SATISFIED if undisturbed_minutes >= MIN_UNDISTURBED_REST_MINUTES else DISTURBED"
          - "FROZEN ExtraBoardSlot rows for this employee flip back to ACTIVE with their prior standing_position"
      - from: ON_REST
        to: AVAILABLE
        trigger: "POST /api/employees/{id}/mark-up"
        actor: Employee
        preconditions:
          - "employee.availability_status == ON_REST"
          - "the single RestPeriod with rest_status == OPEN has undisturbed_minutes >= MIN_UNDISTURBED_REST_MINUTES"
        side_effects:
          - "open RestPeriod closes with rest_status SATISFIED"
      - from: AVAILABLE
        to: ON_LEAVE
        trigger: "LeaveBid transition SUBMITTED -> AWARDED where employee_id == employee.id (system)"
        actor: system
        preconditions:
          - "employee.availability_status == AVAILABLE"
        side_effects:
          - "ACTIVE ExtraBoardSlot rows for this employee flip to VACATED and the board_rotation cascade renumbers survivors"
      - from: ON_LEAVE
        to: AVAILABLE
        trigger: "POST /api/employees/{id}/return-from-leave"
        actor: Employee
        preconditions:
          - "employee.availability_status == ON_LEAVE"
        side_effects:
          - "employee is appended to the ExtraBoard of matching craft/terminal at the last standing_position (board_rotation, FIFO return rule)"
      - from: ON_ASSIGNMENT
        to: ON_REST
        trigger: "Assignment transition ON_DUTY -> TIE_UP_PENDING where employee_id == employee.id (system)"
        actor: system
        preconditions:
          - "employee.availability_status == ON_ASSIGNMENT"
        side_effects:
          - "a new RestPeriod opens: employee_id = employee.id, rest_start = now, rest_status = OPEN"
      - from: AVAILABLE
        to: ON_ASSIGNMENT
        trigger: "Assignment creation via POST /api/calls/{id}/accept where employee_id == employee.id (system)"
        actor: system
        preconditions:
          - "employee.availability_status == AVAILABLE"
        side_effects:
          - "employee.cumulative_duty_minutes_month and fatigue_score recomputed by hos_duty_accumulation / fatigue_index"
      - from: AVAILABLE
        to: SUSPENDED
        trigger: "POST /api/employees/{id}/suspend"
        actor: CrewManager
        preconditions:
          - "employee.availability_status == AVAILABLE"
        side_effects:
          - "ACTIVE ExtraBoardSlot rows flip to VACATED; any Call with call_status == OFFERED for this employee transitions OFFERED -> RESCINDED"
      - from: SUSPENDED
        to: AVAILABLE
        trigger: "POST /api/employees/{id}/reinstate"
        actor: CrewManager
        preconditions:
          - "employee.availability_status == SUSPENDED"
        side_effects:
          - "employee appended to matching ExtraBoard at last standing_position"

  - entity: Call
    initial_state: OFFERED
    terminal_states: [DECLINED, NO_ANSWER, EXPIRED, RESCINDED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /api/calls/{id}/accept"
        actor: Employee
        preconditions:
          - "call.call_status == OFFERED"
          - "logical clock < call.expires_at"
          - "employee.availability_status == AVAILABLE"
          - "employee.cumulative_duty_minutes_month + job's projected tour minutes <= MAX_DUTY_MINUTES_PER_MONTH (forward_looking variant of hos_duty_accumulation; equality passes)"
          - "job.filled_count < job.crew_required"
        side_effects:
          - "creates Assignment(job_id, employee_id, call_id) with assignment_status MARKED_UP"
          - "job.filled_count increments by 1; if job.filled_count == job.crew_required the job transitions CALLING -> FILLED"
          - "employee.availability_status AVAILABLE -> ON_ASSIGNMENT (see Employee machine)"
          - "call.responded_at stamped"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /api/calls/{id}/decline"
        actor: Employee
        preconditions:
          - "call.call_status == OFFERED"
        side_effects:
          - "call.responded_at stamped"
          - "board_rotation: declining employee's ExtraBoardSlot rotates to last standing_position on its board (penalty rotation)"
          - "if the job's remaining unfilled seats have no further eligible callee, a CrewShortage row is created with shortage_status OPEN (depth-2 link: decline -> slot rotation -> shortage check)"
      - from: OFFERED
        to: NO_ANSWER
        trigger: "POST /api/calls/{id}/no-answer"
        actor: CrewCaller
        preconditions:
          - "call.call_status == OFFERED"
        side_effects:
          - "call.responded_at stamped"
          - "board_rotation: no-answer employee's slot rotates to last standing_position (same penalty as decline)"
      - from: OFFERED
        to: EXPIRED
        trigger: "system clock sweep when now >= call.expires_at (POST /api/_clock/set_current_utc advances the clock and fires the sweep)"
        actor: system
        preconditions:
          - "call.call_status == OFFERED"
          - "now >= call.expires_at"
        side_effects:
          - "call.responded_at stamped with expires_at"
          - "board_rotation: employee's slot rotates to last standing_position"
      - from: OFFERED
        to: RESCINDED
        trigger: "POST /api/calls/{id}/rescind (CrewCaller) OR Employee AVAILABLE -> SUSPENDED cascade (system)"
        actor: CrewCaller
        preconditions:
          - "call.call_status == OFFERED"
        side_effects:
          - "call.responded_at stamped; NO board rotation penalty (rescind is railroad-initiated)"

  - entity: Assignment
    initial_state: MARKED_UP
    terminal_states: [COMPLETED, LAID_OFF, RECREWED]
    transitions:
      - from: MARKED_UP
        to: ON_DUTY
        trigger: "POST /api/assignments/{id}/on-duty"
        actor: Employee
        preconditions:
          - "assignment.assignment_status == MARKED_UP"
          - "logical clock >= job.report_time minus EARLY_REPORT_WINDOW_MINUTES (constant 60 minutes)"
        side_effects:
          - "assignment.on_duty_at stamped"
          - "employee.cumulative_duty_minutes_month recomputed (hos_duty_accumulation, chronological variant, running accumulator starts counting)"
      - from: ON_DUTY
        to: TIE_UP_PENDING
        trigger: "POST /api/assignments/{id}/tie-up"
        actor: Employee
        preconditions:
          - "assignment.assignment_status == ON_DUTY"
          - "elapsed duty minutes (now - on_duty_at) < MAX_DUTY_MINUTES_PER_TOUR (hard federal cap; tying up at or after the cap is the ONLY permitted path — no rejection)"
        side_effects:
          - "assignment.off_duty_at stamped"
          - "Employee ON_ASSIGNMENT -> ON_REST; a RestPeriod opens (see Employee machine)"
          - "hos_duty_accumulation chronological variant finalizes elapsed minutes into cumulative_duty_minutes_month"
          - "a PayRecord row is auto-created in DRAFT for (employee_id, assignment_id) with claimed_minutes = elapsed, claimed_deadhead_minutes = assignment.deadhead_minutes"
      - from: TIE_UP_PENDING
        to: COMPLETED
        trigger: "POST /api/assignments/{id}/complete"
        actor: CrewCaller
        preconditions:
          - "assignment.assignment_status == TIE_UP_PENDING"
          - "the auto-created PayRecord for this assignment has record_status in {SUBMITTED, FINALIZED}"
        side_effects:
          - "job.filled_count decrements by 1"
      - from: MARKED_UP
        to: LAID_OFF
        trigger: "POST /api/assignments/{id}/lay-off"
        actor: Employee
        preconditions:
          - "assignment.assignment_status == MARKED_UP"
          - "logical clock < job.report_time (cannot lay off after report time)"
        side_effects:
          - "job.filled_count decrements by 1; if job.job_status == FILLED and filled_count < crew_required the job transitions FILLED -> CALLING"
          - "Employee ON_ASSIGNMENT -> AVAILABLE (mark-up path, no rest opens because duty never started)"
          - "the producing Call remains ACCEPTED (immutable history) but a fresh Call may be issued for the reopened seat"
      - from: ON_DUTY
        to: RECREWED
        trigger: "CrewShortage transition OPEN/RECREWING -> RESOLVED where the resolving recrew targets this assignment (POST /api/crew-shortages/{id}/resolve with replacement_assignment linkage)"
        actor: CrewManager
        preconditions:
          - "assignment.assignment_status == ON_DUTY"
          - "a CrewShortage row with job_id == assignment.job_id is in RECREWING"
        side_effects:
          - "assignment.off_duty_at stamped at recrew handoff"
          - "Employee ON_ASSIGNMENT -> ON_REST (rest opens for the relieved employee)"
          - "the shortage's replacement Assignment is created in ON_DUTY for the relieving employee, whose availability flips AVAILABLE -> ON_ASSIGNMENT"

  - entity: LeaveBid
    initial_state: SUBMITTED
    terminal_states: [DENIED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: AWARDED
        trigger: "POST /api/leave-bids/{id}/award"
        actor: CrewManager
        preconditions:
          - "leave_bid.bid_status == SUBMITTED"
          - "no other LeaveBid for the same employee in status AWARDED overlaps [start_date, end_date] as CLOSED intervals (shared boundary day conflicts)"
          - "the count of AWARDED bids overlapping the window for the bidder's craft at the bidder's home_terminal is strictly below LEAVE_QUOTA_PER_CRAFT_DAY for every day of the window"
        side_effects:
          - "leave_bid.decided_at stamped"
          - "Employee AVAILABLE -> ON_LEAVE; ACTIVE ExtraBoardSlot rows VACATED; board_rotation renumbers (cascade depth 3: award -> employee status -> board slots -> positions)"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /api/leave-bids/{id}/deny"
        actor: CrewManager
        preconditions:
          - "leave_bid.bid_status == SUBMITTED"
        side_effects:
          - "leave_bid.decided_at stamped"
      - from: AWARDED
        to: CANCELLED
        trigger: "POST /api/leave-bids/{id}/cancel"
        actor: Employee
        preconditions:
          - "leave_bid.bid_status == AWARDED"
          - "logical clock < leave_bid.start_date (leave has not begun)"
        side_effects:
          - "Employee ON_LEAVE -> AVAILABLE via return-from-leave side effects (appended to board tail)"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /api/leave-bids/{id}/cancel"
        actor: Employee
        preconditions:
          - "leave_bid.bid_status == SUBMITTED"
        side_effects: []

  - entity: PayRecord
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/pay-records/{id}/submit"
        actor: Employee
        preconditions:
          - "pay_record.record_status == DRAFT"
          - "pay_record.claimed_minutes > 0"
        side_effects:
          - "gross_pay_cents computed by agreement_pay PROVISIONAL variant (per-line rounding)"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /api/pay-records/{id}/dispute"
        actor: CrewManager
        preconditions:
          - "pay_record.record_status == SUBMITTED"
        side_effects: []
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /api/pay-records/{id}/resubmit"
        actor: Employee
        preconditions:
          - "pay_record.record_status == DISPUTED"
        side_effects:
          - "gross_pay_cents recomputed by agreement_pay PROVISIONAL variant against the amended claimed_minutes"
      - from: SUBMITTED
        to: FINALIZED
        trigger: "POST /api/pay-records/{id}/finalize"
        actor: CrewManager
        preconditions:
          - "pay_record.record_status == SUBMITTED"
          - "expected_pay_record_version matches pay_record.version (OCC)"
        side_effects:
          - "gross_pay_cents recomputed by agreement_pay FINAL variant (sum-then-round); the delta between provisional and final is written back to gross_pay_cents"
          - "pay_record.version increments"

  - entity: CrewShortage
    initial_state: OPEN
    terminal_states: [RESOLVED, ESCALATED]
    transitions:
      - from: OPEN
        to: RECREWING
        trigger: "POST /api/crew-shortages/{id}/begin-recrew"
        actor: CrewManager
        preconditions:
          - "crew_shortage.shortage_status == OPEN"
        side_effects: []
      - from: RECREWING
        to: RESOLVED
        trigger: "POST /api/crew-shortages/{id}/resolve"
        actor: CrewManager
        preconditions:
          - "crew_shortage.shortage_status == RECREWING"
          - "relieving employee identified by relieving_employee_id is AVAILABLE and passes hos/fatigue gates"
        side_effects:
          - "target ON_DUTY Assignment transitions to RECREWED (see Assignment machine)"
          - "replacement Assignment created in ON_DUTY for the relieving employee (deadhead_minutes taken from request)"
          - "crew_shortage.resolved_at stamped"
      - from: OPEN
        to: ESCALATED
        trigger: "POST /api/crew-shortages/{id}/escalate"
        actor: CrewManager
        preconditions:
          - "crew_shortage.shortage_status == OPEN"
        side_effects: []
      - from: RECREWING
        to: ESCALATED
        trigger: "POST /api/crew-shortages/{id}/escalate"
        actor: CrewManager
        preconditions:
          - "crew_shortage.shortage_status == RECREWING"
        side_effects: []

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: pay-finalize-stale-record
    parent_entity: PayRecord
    write_endpoint: "POST /api/pay-records/{id}/finalize"
    occ_field: "expected_pay_record_version"
    description: |
      Finalizing a PayRecord whose version has advanced since the manager last
      observed it is rejected. This captures the case where another writer has
      just resubmitted the record (which legitimately recomputed gross_pay_cents
      under §agreement_pay) and the current writer's view of the record is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: job-fill-stale-job
    parent_entity: Job
    write_endpoint: "POST /api/calls/{id}/accept"
    occ_field: "expected_job_version"
    description: |
      Accepting a call against a Job whose version has advanced since the
      employee last observed it is rejected. This captures the case where
      another crew seat was just filled (bumping filled_count) and the
      accepting employee's view of remaining seats is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: hos_duty_accumulation
    trigger: "on Assignment on-duty / tie-up transitions and as a gate on Call accept"
    algorithm: chronological
    formula: |
      # Chronological variant (authoritative ledger):
      #   replay the employee's Assignment rows with on_duty_at set, ordered by
      #   on_duty_at ASC, tie-break Assignment.created_at ASC; sum elapsed
      #   minutes (off_duty_at - on_duty_at, or (now - on_duty_at) while ON_DUTY)
      #   whose on_duty_at falls in the current calendar month.
      # Forward-looking variant (accept gate):
      #   projected = cumulative_duty_minutes_month (chronological, above)
      #             + (now - on_duty_at for any ON_DUTY assignment, in minutes)
      #             + job's projected_tour_minutes (480 default when not
      #               otherwise specified on the Job)
      #   Accept gate rejects when projected > MAX_DUTY_MINUTES_PER_TOUR for the
      #   tour being accepted OR cumulative_duty_minutes_month +
      #   projected_tour_minutes > MAX_DUTY_MINUTES_PER_MONTH.
      pass
    input_set: "Assignment rows for the employee with assignment_status IN {ON_DUTY, TIE_UP_PENDING, COMPLETED, RECREWED} and on_duty_at in the current calendar month; LAID_OFF rows contribute zero."
    constants:
      MAX_DUTY_MINUTES_PER_TOUR: 720
      MAX_DUTY_MINUTES_PER_MONTH: 16560
      DEFAULT_PROJECTED_TOUR_MINUTES: 480
      LONG_TOUR_PROJECTED_MINUTES: 700
      SHORT_TOUR_PROJECTED_MINUTES: 100
    precision: "integer minutes, no rounding"
    variants:
      - name: chronological
        when: "ledger writes (tie-up finalization, monthly accumulation)"
        difference: "processes actual recorded on/off-duty intervals in time order; produces the persisted cumulative_duty_minutes_month"
      - name: forward_looking
        when: "call-accept gate"
        difference: "adds the job's projected tour minutes (LONG_TOUR 700 when job_symbol ends in '-L', SHORT_TOUR 100 when it ends in '-S', else DEFAULT 480) to the chronological total; two callers with identical history but different target jobs get different gate outcomes — at cumulative 700, a short-tour job (800 projected) passes while a default-tour job (1180 projected) fails"

  - name: board_rotation
    trigger: "on Call DECLINED / NO_ANSWER / EXPIRED, on Employee lay-off/mark-up/leave/suspend cascades, on ExtraBoardSlot creation"
    algorithm: constraint_propagation
    formula: |
      # ACTIVE slots of a board are ranked by standing_position 1..N (1 = first out).
      # Penalty rotation (decline/no-answer/expiry): the offending slot's
      # standing_position becomes N (last), and every ACTIVE slot that was behind
      # it shifts up by exactly one position.
      # Freeze (lay-off): slot_status ACTIVE -> FROZEN; the slot's position is
      # remembered; remaining ACTIVE slots renumber to 1..N-1 preserving order.
      # Restore (mark-up): FROZEN -> ACTIVE at the remembered position; slots at
      # or below that position shift down one.
      # Vacate (leave/suspend): slot_status -> VACATED, position released.
      # Return-from-leave / reinstate / new slot: appended at position N+1.
      pass
    input_set: "ExtraBoardSlot rows for the board with slot_status IN {ACTIVE, FROZEN}, ordered by standing_position ASC; VACATED rows excluded."
    constants:
      FIRST_OUT_POSITION: 1
    precision: "integer positions"

  - name: agreement_pay
    trigger: "on PayRecord submit / resubmit (PROVISIONAL) and finalize (FINAL)"
    algorithm: tiered_pricing
    formula: |
      # Rail agreement model: pay is expressed as fractions of a BASIC DAY.
      #   basic component  = BASIC_DAY_CENTS * min(claimed_minutes, 480) / 480
      #   overtime comp    = OT_MULTIPLIER * BASIC_DAY_CENTS
      #                      * max(claimed_minutes - 480, 0) / 480
      #   deadhead comp    = DEADHEAD_HOURLY_CENTS * claimed_deadhead_minutes / 60
      #                      * (TRAIN_DEADHEAD_MULTIPLIER when the Assignment's
      #                        deadhead_mode == TRAIN else 1.0)
      #
      # PROVISIONAL variant — round per component, then sum:
      #   gross = rhu(basic) + rhu(overtime) + rhu(deadhead)
      # FINAL variant — sum exact, then round once:
      #   gross = rhu(basic_exact + overtime_exact + deadhead_exact)
      # (rhu = round to integer cents, ROUND_HALF_UP.)
      # The two variants diverge whenever the components' fractional parts
      # straddle a .5 boundary, e.g. claimed=600, deadhead=100, mode=TRAIN:
      #   PROVISIONAL = 30010 + 11254 + 33603 = 74867
      #   FINAL       = rhu(74866.4583)       = 74866.
      pass
    input_set: "the single PayRecord row being submitted/resubmitted/finalized, plus its Assignment for deadhead_mode."
    constants:
      BASIC_DAY_CENTS: 30010
      OT_MULTIPLIER: 1.5
      OVERTIME_THRESHOLD_MINUTES: 480
      DEADHEAD_HOURLY_CENTS: 18755
      TRAIN_DEADHEAD_MULTIPLIER: 1.075
    precision: "integer cents, round_half_up; PROVISIONAL rounds per component then sums, FINAL sums exact then rounds once — pinned order"
    variants:
      - name: provisional
        when: "submit / resubmit"
        difference: "round_half_up each of basic/overtime/deadhead separately, then sum — per-component rounding"
      - name: final
        when: "finalize"
        difference: "sum the unrounded components (deadhead multiplied by 1.075 when deadhead_mode == TRAIN) then round_half_up once — can differ from provisional by cents (e.g. 74867 vs 74866 at claimed=600, deadhead=100, TRAIN)"

  - name: fatigue_index
    trigger: "on Employee AVAILABLE -> ON_ASSIGNMENT and on Assignment tie-up"
    algorithm: weighted_scoring
    formula: |
      # score = clamp(0..100,
      #   0.5 * (cumulative_duty_minutes_month / MAX_DUTY_MINUTES_PER_MONTH * 100)
      # + 0.3 * (consecutive_duty_days * 10)
      # + 0.2 * (disturbed_rest_count_30d * 15))
      # consecutive_duty_days = length of the streak of consecutive UTC
      # calendar days ending today such that each day has at least one
      # Assignment whose on_duty_at falls on that day; the streak is 0 when
      # today itself has no on_duty_at.
      # disturbed_rest_count_30d = RestPeriod rows for the employee with
      # rest_status == DISTURBED and rest_start within the trailing 30 days.
      # Result rounded to 1 decimal, round_half_up.
      # An employee with fatigue_score >= FATIGUE_BLOCK_THRESHOLD (80.0) cannot
      # be issued a Call (gate on POST /api/jobs/{id}/calls).
      pass
    input_set: "Employee's month-to-date Assignments (status filter per hos_duty_accumulation), RestPeriod rows with rest_status == DISTURBED in trailing 30 days."
    constants:
      FATIGUE_BLOCK_THRESHOLD: 80.0
    precision: "1 decimal place, round_half_up"

  - name: rest_compliance
    trigger: "on Employee mark-up from ON_REST and on Call accept"
    algorithm: interval_merge
    formula: |
      # The employee's open RestPeriod [rest_start, now) MUST satisfy
      # undisturbed_minutes >= MIN_UNDISTURBED_REST_MINUTES (600) at mark-up.
      # Interval semantics: half-open [start, end) — a mark-up exactly at
      # rest_start + 600 minutes SATISFIES (>= boundary inclusive).
      # A call-offer to an employee whose latest completed RestPeriod closed
      # as DISTURBED within the trailing 24 hours is permitted (compliance is
      # enforced at mark-up, not at call), but the Call accept recomputes the
      # open interval.
      pass
    input_set: "RestPeriod rows for the employee with rest_status == OPEN (at most one by construction)."
    constants:
      MIN_UNDISTURBED_REST_MINUTES: 600
    precision: "integer minutes; >= comparison at the boundary is inclusive"

  - name: calling_selector
    trigger: "on POST /api/jobs/{id}/calls (issue next call)"
    algorithm: weighted_scoring
    formula: |
      # Eligible callee set for a Job:
      #   ExtraBoardSlot where slot.board.craft == job.craft
      #     AND slot.board.terminal == job.origin_terminal
      #     AND slot.slot_status == ACTIVE
      #     AND slot.employee.availability_status == AVAILABLE
      #     AND slot.employee.fatigue_score < FATIGUE_BLOCK_THRESHOLD
      # Ranking: standing_position ASC (first-out first).
      # Tie-break: none possible — standing_position is unique per board.
      # Empty pool: no Call is created; the endpoint returns
      # ERR_CALL_POOL_EXHAUSTED and a CrewShortage row is opened
      # (shortage_status OPEN, craft = job.craft).
      pass
    input_set: "ExtraBoardSlot joined Employee, filters per formula."
    constants: {}
    precision: "n/a (selector)"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 0
    category: existence
    check: "request body is well-formed: all required fields present, types correct, enum values within declared sets, numeric fields within sign/range constraints (crew_required >= 1, claimed_minutes >= 0, etc.)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role name"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "for entity_backed Employee role, X-User-ID must equal the id of the Employee the operation targets (self-service ops: mark-up, lay-off, call accept/decline, assignment on-duty/tie-up/lay-off, pay submit/resubmit, leave cancel)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /api/employees/{id}/mark-up, POST /api/employees/{id}/lay-off, POST /api/calls/{id}/accept, POST /api/calls/{id}/decline, POST /api/assignments/{id}/on-duty, POST /api/assignments/{id}/tie-up, POST /api/assignments/{id}/lay-off, POST /api/pay-records/{id}/submit, POST /api/pay-records/{id}/resubmit, POST /api/leave-bids/{id}/cancel"
  - priority: 4
    category: existence
    check: "path ids resolve, validated left-to-right (job before call, employee before slot, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "target entity is in a from-state listed for the requested transition (call OFFERED for accept/decline/rescind/no-answer, assignment MARKED_UP for on-duty/lay-off, job BULLETINED/CALLING for call issue, etc.)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: business_constraint
    check: "call issue finds at least one eligible callee via calling_selector; an empty eligible pool (no matching board, all slots FROZEN/VACATED, all employees non-AVAILABLE or fatigue-blocked) rejects the issue and opens a CrewShortage"
    error_id: ERR_CALL_POOL_EXHAUSTED
    http_status: 422
    applies_to: "POST /api/jobs/{id}/calls"
  - priority: 7
    category: business_safety
    check: "Call accept: hos_duty_accumulation forward_looking check — employee.cumulative_duty_minutes_month + the job's projected tour minutes <= MAX_DUTY_MINUTES_PER_MONTH (<= is inclusive; equality passes). Note: fatigue gating happens inside calling_selector eligibility at call ISSUE (fatigued employees are excluded from the pool), not at accept."
    error_id: ERR_HOS_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /api/calls/{id}/accept"
  - priority: 8
    category: business_safety
    check: "mark-up from ON_REST requires open RestPeriod undisturbed_minutes >= MIN_UNDISTURBED_REST_MINUTES"
    error_id: ERR_REST_NOT_SATISFIED
    http_status: 422
    applies_to: "POST /api/employees/{id}/mark-up"
  - priority: 9
    category: business_temporal
    check: "LeaveBid start_date <= end_date and start_date >= today; assignment lay-off requires now < job.report_time; on-duty requires now >= report_time - EARLY_REPORT_WINDOW_MINUTES (60)"
    error_id: ERR_TEMPORAL_WINDOW
    http_status: 422
    applies_to: "POST /api/leave-bids, POST /api/assignments/{id}/lay-off, POST /api/assignments/{id}/on-duty"
  - priority: 10
    category: business_constraint
    check: "LeaveBid award: no overlapping AWARDED bid for same employee (CLOSED interval semantics — shared boundary day conflicts); per-craft-per-day leave quota LEAVE_QUOTA_PER_CRAFT_DAY = 1 not exceeded (count of other AWARDED bids of same craft at same terminal covering a day must be < 1, i.e. zero, for every day of the window)"
    error_id: ERR_LEAVE_CONFLICT
    http_status: 422
    applies_to: "POST /api/leave-bids/{id}/award"
  - priority: 11
    category: business_constraint
    check: "Job crew capacity: call accept rejected when job.filled_count >= job.crew_required"
    error_id: ERR_JOB_ALREADY_FILLED
    http_status: 422
    applies_to: "POST /api/calls/{id}/accept"
  - priority: 12
    category: business_referential
    check: "ExtraBoardSlot employee_id must reference an Employee of the board's craft; Job.craft must match the call target board craft; PayRecord.assignment_id must reference an Assignment belonging to pay_record.employee_id"
    error_id: ERR_REFERENTIAL_MISMATCH
    http_status: 422
    applies_to: "POST /api/extra-boards/{id}/slots, POST /api/jobs/{id}/calls, POST /api/pay-records"
  - priority: 13
    category: business_constraint
    check: "uniqueness: Employee.employee_number unique; ExtraBoard.board_code unique; at most one ACTIVE-or-FROZEN ExtraBoardSlot per employee per board"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /api/employees, POST /api/extra-boards, POST /api/extra-boards/{id}/slots"
  - priority: 14
    category: business_fiscal
    check: "pay finalize requires expected_pay_record_version == current version (OCC); call accept requires expected_job_version == current version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/pay-records/{id}/finalize, POST /api/calls/{id}/accept"
  - priority: 15
    category: business_fiscal
    check: "PayRecord submit requires claimed_minutes > 0; complete requires the assignment's PayRecord submitted-or-finalized"
    error_id: ERR_PAY_INCOMPLETE
    http_status: 422
    applies_to: "POST /api/pay-records/{id}/submit, POST /api/assignments/{id}/complete"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Advance the logical clock. Server startup default is exactly 2026-08-01T00:00:00Z (never wall-clock). Fires the Call OFFERED -> EXPIRED sweep for every OFFERED call with expires_at <= new time."
    roles: [CrewManager]
    code: 200
    input: [to_iso8601]
    output: "{ now_iso8601: string, expired_call_ids: string[] }"
    side_effects: ["Call expiry sweep", "rest undisturbed_minutes recompute"]

  - method: POST
    path: "/api/employees"
    description: "Hire/register an employee."
    roles: [CrewManager]
    code: 201
    input: [employee_number, full_name, craft, seniority_date, home_terminal]
    output: Employee
    side_effects: ["availability_status defaults AVAILABLE", "fatigue_score 0", "cumulative_duty_minutes_month 0"]

  - method: GET
    path: "/api/employees"
    description: "List employees with optional filters."
    roles: [CrewManager, CrewCaller]
    code: 200
    input: ["craft?", "availability_status?", "limit?", "offset?"]
    output: "Employee[]"
    side_effects: []

  - method: GET
    path: "/api/employees/{id}"
    description: "Fetch one employee."
    roles: [CrewManager, CrewCaller, Employee]
    code: 200
    input: []
    output: Employee
    side_effects: []

  - method: POST
    path: "/api/employees/{id}/lay-off"
    description: "Employee books off (AVAILABLE -> MARKED_OFF); freezes board slots."
    roles: [Employee]
    code: 200
    input: []
    output: Employee
    side_effects: ["ExtraBoardSlot ACTIVE -> FROZEN cascade", "board_rotation renumber"]

  - method: POST
    path: "/api/employees/{id}/mark-up"
    description: "Employee marks up from MARKED_OFF or ON_REST; closes any open RestPeriod."
    roles: [Employee]
    code: 200
    input: []
    output: Employee
    side_effects: ["RestPeriod close (SATISFIED or DISTURBED)", "FROZEN slots restore", "rest_compliance check"]

  - method: POST
    path: "/api/employees/{id}/return-from-leave"
    description: "Employee returns from awarded leave."
    roles: [Employee]
    code: 200
    input: []
    output: Employee
    side_effects: ["append to matching board tail"]

  - method: POST
    path: "/api/employees/{id}/suspend"
    description: "Manager suspends an employee; rescinds offered calls, vacates board slots."
    roles: [CrewManager]
    code: 200
    input: []
    output: Employee
    side_effects: ["Call OFFERED -> RESCINDED", "ExtraBoardSlot -> VACATED"]

  - method: POST
    path: "/api/employees/{id}/reinstate"
    description: "Manager reinstates a suspended employee."
    roles: [CrewManager]
    code: 200
    input: []
    output: Employee
    side_effects: ["append to matching board tail"]

  - method: POST
    path: "/api/extra-boards"
    description: "Create an extra board."
    roles: [CrewManager]
    code: 201
    input: [board_code, craft, terminal, guaranteed_slots]
    output: ExtraBoard
    side_effects: []

  - method: GET
    path: "/api/extra-boards/{id}"
    description: "Fetch one board."
    roles: [CrewManager, CrewCaller]
    code: 200
    input: []
    output: ExtraBoard
    side_effects: []

  - method: GET
    path: "/api/extra-boards/{id}/slots"
    description: "List slots on a board, ordered by standing_position."
    roles: [CrewManager, CrewCaller]
    code: 200
    input: ["slot_status?", "limit?", "offset?"]
    output: "ExtraBoardSlot[]"
    side_effects: []

  - method: POST
    path: "/api/extra-boards/{id}/slots"
    description: "Place an employee on the board (appended at tail)."
    roles: [CrewManager]
    code: 201
    input: [employee_id]
    output: ExtraBoardSlot
    side_effects: ["standing_position assigned at N+1 via board_rotation"]

  - method: GET
    path: "/api/extra-board-slots"
