              payload: { gift_date: "2025-05-01T00:00:00.000Z", amount_cents: 1000000, designation: "ATHLETICS_ANNUAL", gift_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/donors"
              payload: { full_name: "Hank Holeyear", email: "hank.holeyear@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { hy_id: "$.data.id" }
            - call: "POST /athletics/donors/${hy_id}/gifts"
              payload: { gift_date: "2024-05-01T00:00:00.000Z", amount_cents: 1000000, designation: "ATHLETICS_ANNUAL", gift_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/donors/${hy_id}/gifts"
              payload: { gift_date: "2026-05-01T00:00:00.000Z", amount_cents: 1000000, designation: "ATHLETICS_ANNUAL", gift_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-recalculations"
              payload: { cycle_year: 2026, cutoff_date: "2026-06-30T23:59:59.999Z", dispute_window_end: "2026-09-30T00:00:00.000Z" }
