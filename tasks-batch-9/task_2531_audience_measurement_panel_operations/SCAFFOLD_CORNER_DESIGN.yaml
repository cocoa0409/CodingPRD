# =============================================================================
# 1.9 Scaffold Corner Design - Coverage Index for Non-Difficulty Tests
# Task 2531 - Audience Measurement Panel Operations
#
# Breadth probe over §1.1-§1.7 of SCAFFOLD.yaml. Sections and claim_type values
# are taken from references/claim-extraction-guide.md; nothing else is invented.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an
# excluded_because: stub naming the covering §1.8 instance and no test_recipe.
#
# Fixture conventions (aligned with §1.8 but disjoint from it):
#   - market_code block DMA-601..DMA-699, meter serial block MT-002001..,
#     edit rule set labels RS-C01.., so no corner instance can collide with a
#     §1.8 instance or with another corner instance.
#   - the logical clock starts at 2026-08-01T00:00:00Z on an empty database.
#   - every OCC payload re-reads GET /markets/{market_id} immediately before
#     the write, so expected_market_version is never a literal.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 - Entities (§1.1)
  # ===========================================================================
  - section: entities
    instances:

      - name: market_creation_returns_computed_defaults_and_restricted_posture
        claim_type: creation
        grounds:
          - entities.Market
          - endpoints[POST /markets]
          - calculations.market_recruitment_posture
        distinguishing_aspect: "A market created with zero quota cells has under_target_cell_count == 0, so posture clause 3 fires and the brand-new market is RESTRICTED - never OPEN."
        test_recipe:
          setup:
            - "Empty database; the logical clock holds its startup default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /markets"
              payload: { name: "Metro Alpha", market_code: "DMA-601", dma_rank: 101, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m1_id: "$.data.id", m1_version: "$.data.version" }
          assert:
            - "HTTP 201 with response_type object and data.id a non-empty string"
            - "data.market_code == DMA-601, data.name == Metro Alpha, data.dma_rank == 101, data.incentive_budget_cents == 500000"
            - "data.recruitment_posture == RESTRICTED - zero cells means under_target_cell_count == 0 and clause 3 wins over clause 4"
            - "data.accreditation_status == UNAUDITED, data.publication_blocked == false, data.limitation_disclosures == []"
            - "data.incentive_budget_committed_cents == 0, data.incentive_budget_reserved_cents == 0, data.quota_cell_count == 0, data.filled_cell_count == 0, data.under_target_cell_count == 0, data.open_audit_count == 0"
            - "data.posture_changed_at == 2026-08-01T00:00:00Z and ${m1_version} == 1"

      - name: market_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /markets/{market_id}]
          - entities.Market
        distinguishing_aspect: "GET /markets/{market_id} returns the same field values the creation response carried, including the roll-ups the cell write moved."
        test_recipe:
          setup:
            - "One market DMA-602 with a single quota cell (target 2, base incentive 1000), so the cell write reserved round_half_up(1000 * 0.25 * 2, 0) == 500 cents and bumped the market version."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Beta", market_code: "DMA-602", dma_rank: 102, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m2_id: "$.data.id" }
            - call: "POST /markets/${m2_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 2, base_incentive_cents: 1000 }
              as: PanelOperationsManager
              captures: { c2_id: "$.data.id" }
          trigger:
            - call: "GET /markets/${m2_id}"
              payload: {}
              as: MethodologyStatistician
              captures: { m2_read_version: "$.data.version" }
          assert:
            - "HTTP 200 with data.id == ${m2_id} and data.market_code == DMA-602"
            - "data.quota_cell_count == 1, data.under_target_cell_count == 1, data.filled_cell_count == 0"
            - "data.incentive_budget_reserved_cents == 500 and data.incentive_budget_committed_cents == 0"
            - "data.recruitment_posture == OPEN and ${m2_read_version} == 2 - the quota-cell write bumped the market version exactly once"

      - name: market_listing_filters_by_posture_and_paginates
        claim_type: listing
        grounds:
          - endpoints[GET /markets]
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three markets exist, two of them RESTRICTED; the filtered page reports total_count 2 and has_more false while limit 1 splits the same filtered set across two pages."
        test_recipe:
          setup:
            - "Markets DMA-603 and DMA-604 are left cell-less and are therefore RESTRICTED; DMA-605 gets one quota cell and is therefore OPEN."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Gamma", market_code: "DMA-603", dma_rank: 103, incentive_budget_cents: 200000 }
              as: PanelOperationsManager
              captures: { m3_id: "$.data.id" }
            - call: "POST /markets"
              payload: { name: "Metro Delta", market_code: "DMA-604", dma_rank: 104, incentive_budget_cents: 200000 }
              as: PanelOperationsManager
              captures: { m4_id: "$.data.id" }
            - call: "POST /markets"
              payload: { name: "Metro Epsilon", market_code: "DMA-605", dma_rank: 105, incentive_budget_cents: 200000 }
              as: PanelOperationsManager
              captures: { m5_id: "$.data.id" }
            - call: "POST /markets/${m5_id}/quota-cells"
              payload: { age_band: "P35_54", income_band: "LOW", geo_zone: "RURAL", target_households: 1, base_incentive_cents: 1000 }
              as: PanelOperationsManager
          trigger:
            - call: "GET /markets"
              payload: { recruitment_posture: "RESTRICTED", limit: 1, offset: 0 }
              as: ClientServiceRep
            - call: "GET /markets"
              payload: { recruitment_posture: "RESTRICTED", limit: 1, offset: 1 }
              as: ClientServiceRep
            - call: "GET /markets"
              payload: { recruitment_posture: "OPEN" }
              as: ClientServiceRep
          assert:
            - "Trigger call 1: HTTP 200, response_type array, total_count == 2, has_more == true, limit == 1, offset == 0 and exactly 1 element"
            - "Trigger call 2: total_count == 2, has_more == false and exactly 1 element; the two pages together return ${m3_id} and ${m4_id} and never ${m5_id}"
            - "Trigger call 1 and 2 together: ordering is created_at DESC then market_code ASC, so DMA-604 precedes DMA-603"
            - "Trigger call 3: total_count == 1 with the single element's id == ${m5_id}, and limit defaults to 10 with offset 0"

      - name: quota_cell_creation_arms_boost_and_moves_market_rollups
        claim_type: computed_fields
        grounds:
          - entities.QuotaCell
          - endpoints[POST /markets/{market_id}/quota-cells]
          - calculations.quota_cell_fill
        distinguishing_aspect: "An empty cell is UNDER_TARGET, which arms the incentive boost on creation: multiplier 1.25 and a reserve of round_half_up(4000 * 0.25 * 3, 0) == 3000 cents, and it flips the market from RESTRICTED to OPEN."
        test_recipe:
          setup:
            - "One market DMA-606 with incentive_budget_cents 500000 and no cells yet, so its posture is RESTRICTED."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Zeta", market_code: "DMA-606", dma_rank: 106, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m6_id: "$.data.id" }
          trigger:
            - call: "POST /markets/${m6_id}/quota-cells"
              payload: { age_band: "P55_PLUS", income_band: "HIGH", geo_zone: "SUBURBAN", target_households: 3, base_incentive_cents: 4000 }
              as: PanelOperationsManager
              captures: { c6_id: "$.data.id" }
            - call: "GET /markets/${m6_id}"
              payload: {}
              as: PanelOperationsManager
          assert:
            - "Trigger call 1: HTTP 201 with data.intab_count == 0, data.fill_rate == 0.0000 and data.quota_status == UNDER_TARGET"
            - "Trigger call 1: data.incentive_boost_active == true and data.effective_incentive_multiplier == 1.25"
            - "Trigger call 2: data.incentive_budget_reserved_cents == 3000, data.quota_cell_count == 1, data.under_target_cell_count == 1"
            - "Trigger call 2: data.recruitment_posture == OPEN and data.posture_changed_at == 2026-08-01T00:00:00Z"

      - name: household_creation_stamps_recruited_at_and_defaults
        claim_type: defaults
        grounds:
          - entities.Household
          - endpoints[POST /households]
        distinguishing_aspect: "recruited_at is stamped from the logical clock (not wall time), and every computed field starts at its declared default: RECRUITED / PENDING / 0.0000 / 0 / []."
        test_recipe:
          setup:
            - "Market DMA-607 with one quota cell (target 2, base incentive 1000). The clock is moved to 2026-09-15T08:30:00Z before the household is recruited."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Eta", market_code: "DMA-607", dma_rank: 107, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m7_id: "$.data.id" }
            - call: "POST /markets/${m7_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 2, base_incentive_cents: 1000 }
              as: PanelOperationsManager
              captures: { c7_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T08:30:00Z" }
              as: PanelOperationsManager
          trigger:
            - call: "POST /households"
              payload: { market_id: "${m7_id}", quota_cell_id: "${c7_id}", recruitment_source: "ONLINE_PANEL_TRANSFER", persons_count: 3 }
              as: PanelOperationsManager
              captures: { h7_id: "$.data.id", h7_recruited_at: "$.data.recruited_at" }
          assert:
            - "HTTP 201 with data.status == RECRUITED and data.enumeration_verdict == PENDING"
            - "${h7_recruited_at} == 2026-09-15T08:30:00Z - stamped from the logical clock, not from wall-clock time"
            - "data.compliance_rate_rolling_30 == 0.0000, data.incentive_accrued_cents == 0, data.accrual_periods == [], data.enumeration_count == 0"
            - "data.roster_persons_count == null, data.tv_sets_count == null, data.last_enumeration_at == null, data.retired_reason == null"
            - "QuotaCell.${c7_id}.intab_count == 0 - recruitment alone never puts a household in tab"

      - name: household_system_fields_supplied_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Household
          - endpoints[POST /households]
        distinguishing_aspect: "id, created_at, version, status and recruited_at are all server-owned: a body that tries to set them is accepted and the supplied values are discarded, not echoed."
        test_recipe:
          setup:
            - "Market DMA-608 with one quota cell (target 2, base incentive 1000); the clock is at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Theta", market_code: "DMA-608", dma_rank: 108, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m8_id: "$.data.id" }
            - call: "POST /markets/${m8_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 2, base_incentive_cents: 1000 }
              as: PanelOperationsManager
              captures: { c8_id: "$.data.id" }
          trigger:
            - call: "POST /households"
              payload: { market_id: "${m8_id}", quota_cell_id: "${c8_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 2, id: "hh-supplied-by-client", status: "ACTIVE", recruited_at: "2020-01-01T00:00:00Z", incentive_accrued_cents: 9999, version: 77 }
              as: PanelOperationsManager
              captures: { h8_id: "$.data.id" }
          assert:
            - "HTTP 201 and data.id != hh-supplied-by-client - the server generates the identifier"
            - "data.status == RECRUITED (not the supplied ACTIVE) and data.recruited_at == 2026-08-01T00:00:00Z (not 2020-01-01T00:00:00Z)"
            - "data.incentive_accrued_cents == 0 (not 9999) and data.version == 1 (not 77)"
            - "data.created_at and data.updated_at are present and both equal 2026-08-01T00:00:00Z"

      - name: household_listing_filters_by_status_and_verdict
        claim_type: listing
        grounds:
          - endpoints[GET /households]
          - entities.Household.fields.status
          - entities.Household.fields.enumeration_verdict
        distinguishing_aspect: "Two households of the same cell diverge on the first enumeration - one COMPLIANT/ACTIVE, one NONCOMPLIANT/NONCOMPLIANT_HOLD - and each filter combination isolates exactly one of them."
        test_recipe:
          setup:
            - "Market DMA-609, one quota cell (target 4, base incentive 1000), two households each with an install-confirmed TV_TUNER, so both sit in ENUM_PENDING."
            - "Household A is enumerated with a matching roster (COMPLIANT -> ACTIVE); household B is enumerated with a roster of 5 against persons_count 2 (NONCOMPLIANT -> NONCOMPLIANT_HOLD)."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Iota", market_code: "DMA-609", dma_rank: 109, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m9_id: "$.data.id" }
            - call: "POST /markets/${m9_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 4, base_incentive_cents: 1000 }
              as: PanelOperationsManager
              captures: { c9_id: "$.data.id" }
            - call: "POST /households"
              payload: { market_id: "${m9_id}", quota_cell_id: "${c9_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 2 }
              as: PanelOperationsManager
              captures: { h9a_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${h9a_id}", meter_type: "TV_TUNER", serial_no: "MT-002001" }
              as: FieldTechnician
              captures: { mt9a_id: "$.data.id" }
            - call: "POST /meters/${mt9a_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /households/${h9a_id}/enumerations"
              payload: { roster_persons_count: 2, tv_sets_count: 1 }
              as: FieldTechnician
            - call: "POST /households"
              payload: { market_id: "${m9_id}", quota_cell_id: "${c9_id}", recruitment_source: "RDD_PHONE", persons_count: 2 }
              as: PanelOperationsManager
              captures: { h9b_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${h9b_id}", meter_type: "TV_TUNER", serial_no: "MT-002002" }
              as: FieldTechnician
              captures: { mt9b_id: "$.data.id" }
            - call: "POST /meters/${mt9b_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /households/${h9b_id}/enumerations"
              payload: { roster_persons_count: 5, tv_sets_count: 1 }
              as: FieldTechnician
          trigger:
            - call: "GET /households"
              payload: { quota_cell_id: "${c9_id}", status: "ACTIVE" }
              as: MethodologyStatistician
            - call: "GET /households"
              payload: { market_id: "${m9_id}", enumeration_verdict: "NONCOMPLIANT" }
              as: MethodologyStatistician
            - call: "GET /households"
              payload: { market_id: "${m9_id}" }
              as: MethodologyStatistician
          assert:
            - "Trigger call 1: total_count == 1 with the single element's id == ${h9a_id} and status == ACTIVE"
            - "Trigger call 2: total_count == 1 with the single element's id == ${h9b_id}, status == NONCOMPLIANT_HOLD and enumeration_verdict == NONCOMPLIANT"
            - "Trigger call 3: total_count == 2, has_more == false, and the elements are ordered created_at ASC so ${h9a_id} precedes ${h9b_id}"
            - "QuotaCell.${c9_id}.intab_count == 1 and fill_rate == 0.2500 - only the COMPLIANT household is in tab"

      - name: meter_creation_defaults_and_parent_household_advance
        claim_type: parent_relationships
        grounds:
          - entities.Meter
          - endpoints[POST /meters]
          - state_machines.Household.transitions.RECRUITED_to_INSTALL_SCHEDULED
        distinguishing_aspect: "The FIRST meter row moves the parent household RECRUITED -> INSTALL_SCHEDULED; a second meter of a different type leaves the parent status untouched."
        test_recipe:
          setup:
            - "Market DMA-610, one quota cell (target 2, base incentive 1000), one RECRUITED household."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Kappa", market_code: "DMA-610", dma_rank: 110, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m10_id: "$.data.id" }
            - call: "POST /markets/${m10_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 2, base_incentive_cents: 1000 }
              as: PanelOperationsManager
              captures: { c10_id: "$.data.id" }
            - call: "POST /households"
              payload: { market_id: "${m10_id}", quota_cell_id: "${c10_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 2 }
              as: PanelOperationsManager
              captures: { h10_id: "$.data.id" }
          trigger:
            - call: "POST /meters"
              payload: { household_id: "${h10_id}", meter_type: "TV_TUNER", serial_no: "MT-002003" }
              as: FieldTechnician
              captures: { mt10a_id: "$.data.id" }
            - call: "GET /households/${h10_id}"
              payload: {}
              as: FieldTechnician
            - call: "POST /meters"
              payload: { household_id: "${h10_id}", meter_type: "STREAMING_ROUTER", serial_no: "MT-002004" }
              as: FieldTechnician
              captures: { mt10b_id: "$.data.id" }
            - call: "GET /households/${h10_id}"
              payload: {}
              as: FieldTechnician
          assert:
            - "Trigger call 1: HTTP 201 with data.install_status == SHIPPED, data.health_status == HEALTHY, data.fault_count == 0, data.missing_minutes_last_scan == 0, data.installed_at == null, data.last_fault_code == null"
            - "Trigger call 2: data.status == INSTALL_SCHEDULED - the first meter row is what schedules the install"
            - "Trigger call 3: HTTP 201 - a household holding a SHIPPED TV_TUNER still accepts a meter of a different type"
            - "Trigger call 4: data.status is still INSTALL_SCHEDULED - the second meter does not re-advance the household"
            - "GET /meters?household_id=${h10_id} returns total_count == 2 with both rows in install_status SHIPPED"

      - name: tuning_interval_creation_derives_household_and_starts_raw
        claim_type: computed_fields
        grounds:
          - entities.TuningInterval
          - endpoints[POST /tuning-intervals]
        distinguishing_aspect: "household_id is copied from the meter rather than supplied, and a freshly ingested record is RAW with usable_minutes 0 - crediting happens only in the edit pass."
        test_recipe:
          setup:
            - "Market DMA-611 with one cell, one ACTIVE household whose TV_TUNER is installed. The clock stays at its startup default 2026-08-01T00:00:00Z, so an interval on 2026-07-31 is in the past."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Lambda", market_code: "DMA-611", dma_rank: 111, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m11_id: "$.data.id" }
            - call: "POST /markets/${m11_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 2, base_incentive_cents: 1000 }
              as: PanelOperationsManager
              captures: { c11_id: "$.data.id" }
            - call: "POST /households"
              payload: { market_id: "${m11_id}", quota_cell_id: "${c11_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 2 }
              as: PanelOperationsManager
              captures: { h11_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${h11_id}", meter_type: "TV_TUNER", serial_no: "MT-002005" }
              as: FieldTechnician
              captures: { mt11_id: "$.data.id" }
            - call: "POST /meters/${mt11_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /households/${h11_id}/enumerations"
              payload: { roster_persons_count: 2, tv_sets_count: 1 }
              as: FieldTechnician
          trigger:
            - call: "POST /tuning-intervals"
              payload: { meter_id: "${mt11_id}", source_methodology: "INHOME_TUNER", start_iso: "2026-07-31T18:00:00Z", end_iso: "2026-07-31T23:50:00Z", station_code: "WXYZ", tuning_minutes: 350 }
              as: MethodologyStatistician
              captures: { ti11_id: "$.data.id", ti11_household: "$.data.household_id" }
            - call: "GET /households/${h11_id}"
              payload: {}
              as: MethodologyStatistician
          assert:
            - "Trigger call 1: HTTP 201 with data.state == RAW, data.usable_minutes == 0, data.ascribed == false, data.processing_run_id == null, data.invalidation_reason == null"
            - "Trigger call 1: ${ti11_household} == ${h11_id} - POST /tuning-intervals takes no household_id in its body, so the server copies it from the meter"
            - "Trigger call 2: data.compliance_rate_rolling_30 == 1.0000 - one reported day inside the 30-day window, 350 >= 30 minutes, and the figure is stored at ingest time"
            - "GET /tuning-intervals?meter_id=${mt11_id}&state=RAW returns total_count == 1 whose id == ${ti11_id}"

      - name: universe_estimate_totals_are_summed_not_supplied
        claim_type: computed_fields
        grounds:
          - entities.UniverseEstimate
          - endpoints[POST /universe-estimates]
        distinguishing_aspect: "total_population_households and total_population_persons are summed from cell_populations over both cells (100000 + 30000 and 250000 + 70000), and the vintage starts DRAFT with published_at null."
        test_recipe:
          setup:
            - "Market DMA-612 with exactly two quota cells, so cell_populations must name both."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Mu", market_code: "DMA-612", dma_rank: 112, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m12_id: "$.data.id" }
            - call: "POST /markets/${m12_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "LOW", geo_zone: "URBAN", target_households: 1, base_incentive_cents: 1000 }
              as: PanelOperationsManager
              captures: { c12a_id: "$.data.id" }
            - call: "POST /markets/${m12_id}/quota-cells"
              payload: { age_band: "P35_54", income_band: "MID", geo_zone: "RURAL", target_households: 1, base_incentive_cents: 1000 }
              as: PanelOperationsManager
              captures: { c12b_id: "$.data.id" }
            - call: "GET /markets/${m12_id}"
              payload: {}
              as: MethodologyStatistician
              captures: { m12_version: "$.data.version" }
          trigger:
            - call: "POST /universe-estimates"
              payload: { market_id: "${m12_id}", vintage_label: "2026Q3", effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", cell_populations: [{ quota_cell_id: "${c12a_id}", population_households: 100000, population_persons: 250000 }, { quota_cell_id: "${c12b_id}", population_households: 30000, population_persons: 70000 }], expected_market_version: "${m12_version}" }
              as: MethodologyStatistician
              captures: { ue12_id: "$.data.id" }
            - call: "GET /markets/${m12_id}"
              payload: {}
              as: MethodologyStatistician
              captures: { m12_version_after: "$.data.version" }
          assert:
            - "Trigger call 1: HTTP 201 with data.total_population_households == 130000 and data.total_population_persons == 320000"
            - "Trigger call 1: data.status == DRAFT, data.published_at == null, data.superseded_at == null"
            - "Trigger call 2: ${m12_version_after} == ${m12_version} + 1 - drafting a vintage bumps the market version"

      - name: processing_run_creation_computes_window_minutes
        claim_type: computed_fields
        grounds:
          - entities.ProcessingRun
