            - "response data.restriction_reason == null"
            - "response data.version == 2"
            - "every other ServiceZone field is unchanged: remedy_spent_cents == 0, reserved_bay_minutes == 0, on_mission_robot_count == 0, lid_code_sequence == 0"
            - "GET /service-zones?permit_state=PERMITTED reports total_count == 1"
      - name: zone_permit_requires_at_least_one_approved_segment
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.ServiceZone.PROVISIONED_to_PERMITTED"
          - "validations[priority=50]"
          - "errors.ERR_INVALID_STATE_TRANSITION"
          - "entities.SidewalkSegment.fields.status"
        distinguishing_aspect: >-
          The precondition of the same transition is a cross-entity population check, not a field check on
          the zone: with S1 only SURVEYED the ACTIVATE_PERMIT is refused with 409
          ERR_INVALID_STATE_TRANSITION even though permit_state == PROVISIONED is satisfied, and the
          identical call succeeds the moment that one segment reaches APPROVED.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 PROVISIONED with ordinance_min_clearance_cm 90.0"
            - "SidewalkSegment S1 SURVEYED with measured_clearance_cm 118.0 and crossing_risk_score 0.0, so it is eligible for APPROVE but has not been approved"
            - "no other segment exists in Z1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
