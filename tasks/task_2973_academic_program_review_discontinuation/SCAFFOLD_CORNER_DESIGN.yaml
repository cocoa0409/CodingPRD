          - calculations.teach_out_seat_ledger
          - endpoints["POST /provost/displaced-students/{id}/progress"]
        distinguishing_aspect: |
          WITHDRAW from PENDING releases the student's whole holding in one hop
          and removes them from every plan aggregate at once: the guarantee's
          seats_committed drops by the held count, the student's
          committed_seat_count becomes 0, and required_seat_total loses the
          student's 4 seats so seat_shortfall recomputes from 1 to 0. The plan
