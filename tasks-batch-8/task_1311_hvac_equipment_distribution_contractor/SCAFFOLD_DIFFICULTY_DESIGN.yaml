              captures: { pc8_id: $.data.id }
          trigger:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DistributorAdmin
            - call: "GET /api/v1/warranty-registrations/${w8_id}"
              payload: {}
              as: DistributorAdmin
            - call: "GET /api/v1/parts-claims/${pc8_id}"
              payload: {}
              as: DistributorAdmin
          assert:
            - "WarrantyRegistration.${w8_id}.status == LAPSED"
            - "WarrantyRegistration.${w8_id}.extended_coverage_years == 5"
            - "PartsClaim.${pc8_id}.status == DENIED (auto-denied by the lapse cascade, not by any claim action)"
            - "PartsClaim.${pc8_id}.total_award_cents == 0"

  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict: different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_state_vs_credit_hold_priority
        grounds:
          - validations[priority=5]
          - validations[priority=19]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CREDIT_HOLD]
        distinguishing_aspect: |
          Pair (state vs business_fiscal): submitting an order that is
          ALREADY submitted on a credit-held contractor violates both rule 5
          (wrong from-state) and rule 19 (credit hold); the state error
          ERR_INVALID_STATE must win because state (5) precedes
          business_fiscal (19).
        test_recipe:
          setup:
            - "Contractor C9 with credit_hold=true; order O9 already SUBMITTED (submitted before the hold was placed)"
          setup_api_calls:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Iota Air", license_number: "LIC-009" }
              as: DistributorAdmin
              captures: { c9_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "CU-I9", equipment_type: "CONDENSER", refrigerant_type: "R410A", capacity_btuh: 36000, family_code: "FAM-S", list_price_cents: 700000 }
              as: DistributorAdmin
              captures: { m9_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${c9_id}" }
              as: ContractorUser
              as_user_id: "${c9_id}"
              captures: { o9_id: $.data.id }
            - call: "POST /api/v1/orders/${o9_id}/lines"
              payload: { equipment_model_id: "${m9_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${c9_id}"
            - call: "POST /api/v1/orders/${o9_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${c9_id}"
            - call: "PATCH /api/v1/contractors/${c9_id}"
              payload: { credit_hold: true }
              as: DistributorAdmin
          trigger:
            - call: "POST /api/v1/orders/${o9_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${c9_id}"
              captures: { o9_err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE (priority 5 beats priority 19)"
            - "Order.${o9_id}.status remains SUBMITTED"

      - name: submit_window_vs_credit_hold_priority
        grounds:
          - validations[priority=9]
          - validations[priority=19]
          - errors[ERR_WINDOW_EXPIRED]
          - errors[ERR_CREDIT_HOLD]
        distinguishing_aspect: |
          Pair (business_temporal vs business_fiscal) — disjoint categories
          from the first instance's (state vs business_fiscal): submitting a
          pre-buy order after the program window closed, on a credit-held
          contractor, violates rule 9 (window) and rule 19 (credit hold);
          ERR_WINDOW_EXPIRED (9) must win over ERR_CREDIT_HOLD (19).
        test_recipe:
          setup:
            - "Contractor C10 with credit_hold=true"
            - "PreBuyProgram P10 for FAM-R with window [2026-08-01, 2026-08-10); clock advanced to 2026-08-10T00:00:00Z (window_end is exclusive, so the window has just closed)"
            - "DRAFT order O10 under P10 with one valid line"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: DistributorAdmin
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Kappa Cooling", license_number: "LIC-010" }
              as: DistributorAdmin
              captures: { c10_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "CU-K10", equipment_type: "CONDENSER", refrigerant_type: "R410A", capacity_btuh: 36000, family_code: "FAM-R", list_price_cents: 700000 }
              as: DistributorAdmin
              captures: { m10_id: $.data.id }
            - call: "POST /api/v1/prebuy-programs"
              payload: { name: "P10", family_code: "FAM-R", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-10T00:00:00Z", ship_by_date: "2026-09-15T00:00:00Z", deposit_pct: 0.25, discount_pct: 0.10 }
              as: DistributorAdmin
              captures: { p10_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${c10_id}", prebuy_program_id: "${p10_id}" }
              as: ContractorUser
              as_user_id: "${c10_id}"
              captures: { o10_id: $.data.id }
            - call: "POST /api/v1/orders/${o10_id}/lines"
              payload: { equipment_model_id: "${m10_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${c10_id}"
            - call: "PATCH /api/v1/contractors/${c10_id}"
              payload: { credit_hold: true }
              as: DistributorAdmin
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: DistributorAdmin
          trigger:
            - call: "POST /api/v1/orders/${o10_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${c10_id}"
              captures: { o10_err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_WINDOW_EXPIRED (priority 9 business_temporal beats priority 19 business_fiscal)"
            - "Order.${o10_id}.status remains DRAFT"

  # =========================================================================
  # Rule 6 — boundary_precision_check: different metrics, different endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: tier_threshold_exact_silver_boundary
        grounds:
          - calculations.dealer_tier_calculation
          - entities.Contractor.fields.ytd_purchase_cents
        distinguishing_aspect: |
          Numeric threshold boundary on ytd_purchase_cents via the deliver
          endpoint: exactly 5,000,000 cents (>= 5,000,000) flips tier to
          SILVER, while 4,999,999 leaves STANDARD — the comparison is
          inclusive-greater-equal, tested at exact boundary minus one.
        test_recipe:
          setup:
            - "Contractor C11a with delivered orders totalling exactly 5,000,000 cents"
            - "Contractor C11b with delivered orders totalling 4,999,999 cents"
          setup_api_calls:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Lambda Exact", license_number: "LIC-011A" }
              as: DistributorAdmin
              captures: { c11a_id: $.data.id }
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Lambda Below", license_number: "LIC-011B" }
              as: DistributorAdmin
              captures: { c11b_id: $.data.id }
