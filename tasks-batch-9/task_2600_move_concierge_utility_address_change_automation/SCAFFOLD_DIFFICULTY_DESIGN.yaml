      - name: territory_closed_interval_gap_buffer_rejected
        grounds:
          - "validations[priority=33]"
          - "endpoints[POST /provider-service-territories]"
          - "entities.ProviderServiceTerritory.fields.effective_from"
          - "entities.ProviderServiceTerritory.fields.is_default_carrier"
        distinguishing_aspect: |
          A DIFFERENT resource entity with DIFFERENT interval semantics: the default-carrier slot for a
          (postal_code, utility_type) pair uses CLOSED [effective_from, effective_to] date intervals plus
          a TERRITORY_GAP_BUFFER_DAYS (1) separation, so unlike the half-open service window an
          effective_from exactly one day after the incumbent's inclusive effective_to is STILL a conflict;
          only a two-day step clears it.
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z."
            - "Two ELECTRIC providers: Georgia Metro Electric (incumbent) and Southern Grid Electric (challenger)."
            - "The incumbent holds a default-carrier territory for 30302 from 2026-01-01 through the inclusive 2026-06-30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /utility-providers"
              payload: { name: "Georgia Metro Electric", utility_type: "ELECTRIC", required_account_fields: ["account_holder_name", "service_start_date"], deposit_policy: "CREDIT_SCORE_BASED", credit_check_required: true, scheduling_lead_days: 3 }
              as: PlatformAdmin
