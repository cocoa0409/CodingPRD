      - name: bond_opinion_execution_requires_final_official_statement
        grounds:
          - validations[final-statement-before-closing]
          - entities.ClosingDocument.fields.execution_status
          - state_machines.OfficialStatement.PRELIMINARY_POSTED_to_FINAL_POSTED
          - errors[ERR_OS_NOT_FINAL_POSTED]
        distinguishing_aspect: |
          A different entity pair in the opposite direction: ClosingDocument depends on
          OfficialStatement. The BOND_OPINION document is PENDING and the acting role matches its
          signatory_role, so the only obstacle is the statement's status; the ISSUE_PRICE_CERTIFICATE
          on the same deal carries no such dependency and executes while the statement is still
