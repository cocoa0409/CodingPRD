            - *k_spring_teardown
            - *k_spring_reset
            - *k_spring_verify
            - *k_spring_activate
            - *k_spring_schedule
            - *k_spring_publish
            - *k_spring_lot
            - *k_spring_open_sale
          trigger:
            - call: "POST /livestock-lots/${k_lot_id}/care-logs"
              payload: { entry_type: "MORTALITY", mortality_count: 5 }
              as: StoreAssociate
            - call: "GET /livestock-lots/${k_lot_id}"
              payload: {}
              as: StoreManager
              captures: { mr5_status: $.data.status, mr5_rate: $.data.mortality_rate }
            - call: "POST /livestock-lots/${k_lot_id}/care-logs"
              payload: { entry_type: "MORTALITY", mortality_count: 1 }
              as: StoreAssociate
            - call: "GET /livestock-lots/${k_lot_id}"
              payload: {}
              as: StoreManager
              captures: { mr6_status: $.data.status, mr6_rate: $.data.mortality_rate }
          assert:
            - "mr5_rate == 0.05 and mr5_status == ON_SALE (exactly at threshold: no quarantine)"
            - "mr6_rate == 0.06 and mr6_status == SUSPENDED (0.06 > 0.05 quarantines)"

      - name: loyalty_accrual_posture_multiplier_only_for_feed_in_fall
        claim_type: Input Set Filtering
        grounds:
