  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: territory_assignment_half_open_adjacency_allowed
        grounds:
          - validations[priority=9]
          - errors[ERR_TERRITORY_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [start, end) on Territory — a new
          assignment starting exactly at the previous assignment_end is
          ALLOWED (adjacency), while one starting one second before it is
          rejected with ERR_TERRITORY_OVERLAP.
        test_recipe:
          setup:
            - "Territory assigned to advisor A for [2026-01-01, 2026-06-01); advisor B exists"
          setup_api_calls:
            - call: "POST /branch-office/advisors"
              payload: { full_name: "Adv T1", email: "advt1@x.com", hire_date: "2026-01-01T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { adv_a: $.data.id }
            - call: "POST /branch-office/advisors"
              payload: { full_name: "Adv T2", email: "advt2@x.com", hire_date: "2026-01-01T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { adv_b: $.data.id }
            - call: "POST /branch-office/territories"
              payload: { community_name: "Half Town", household_capacity: 500 }
              as: HomeOfficeAdmin
              captures: { ter_id: $.data.id }
            - call: "POST /branch-office/territories/${ter_id}/assign"
              payload: { advisor_id: "${adv_a}", assignment_start: "2026-01-01T00:00:00Z", assignment_end: "2026-06-01T00:00:00Z" }
              as: HomeOfficeAdmin
          trigger:
            - call: "POST /branch-office/territories/${ter_id}/assign"
              payload: { advisor_id: "${adv_b}", assignment_start: "2026-05-31T23:59:59Z", assignment_end: "2026-12-01T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { ov_err: $.data.error_id }
            - call: "POST /branch-office/territories/${ter_id}/assign"
              payload: { advisor_id: "${adv_b}", assignment_start: "2026-06-01T00:00:00Z", assignment_end: "2026-12-01T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { ter_status: $.data.status }
          assert:
            - "Overlapping assignment (start 1s before prior end) returns error_id == ERR_TERRITORY_OVERLAP (409)"
            - "Adjacent assignment (start == prior end) succeeds; Territory.status == ASSIGNED and assigned_advisor_id == ${adv_b}"
      - name: lease_closed_interval_adjacency_conflicts
        grounds:
          - validations[priority=10]
          - errors[ERR_LEASE_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: CLOSED [term_start, term_end] on LeaseAgreement
          (different geometric treatment from the territory's half-open rule):
          a second lease on the SAME site address whose term_start equals the
          existing lease's term_end CONFLICTS, because both endpoints are
          inclusive — the opposite adjacency outcome from the territory rule.
        test_recipe:
          setup:
            - "Branch A SITE_APPROVED with SIGNED lease [2026-08-01, 2027-07-31] at site '1 Shared Plaza'"
            - "Branch B proposed at the same site address"
          setup_api_calls:
            - call: "POST /branch-office/territories"
              payload: { community_name: "Lease Town", household_capacity: 500 }
              as: HomeOfficeAdmin
              captures: { ter_a: $.data.id }
            - call: "POST /branch-office/territories"
              payload: { community_name: "Lease Town North", household_capacity: 500 }
              as: HomeOfficeAdmin
              captures: { ter_b: $.data.id }
            - call: "POST /branch-office/branches"
              payload: { community_name: "Lease Town", site_address: "1 Shared Plaza", territory_id: "${ter_a}" }
              as: HomeOfficeAdmin
              captures: { br_a: $.data.id }
            - call: "POST /branch-office/branches/${br_a}/approve-site"
              payload: { monthly_rent_cents: 150000, term_start: "2026-08-01T00:00:00Z", term_end: "2027-07-31T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/branches"
              payload: { community_name: "Lease Town North", site_address: "1 Shared Plaza", territory_id: "${ter_b}" }
              as: HomeOfficeAdmin
              captures: { br_b: $.data.id }
          trigger:
            - call: "POST /branch-office/branches/${br_b}/approve-site"
              payload: { monthly_rent_cents: 160000, term_start: "2027-07-31T00:00:00Z", term_end: "2028-07-30T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { adj_err: $.data.error_id }
            - call: "POST /branch-office/branches/${br_b}/approve-site"
              payload: { monthly_rent_cents: 160000, term_start: "2027-08-01T00:00:00Z", term_end: "2028-07-31T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { br_b_status: $.data.operating_status }
          assert:
            - "Approve-site with term_start == existing term_end returns error_id == ERR_LEASE_OVERLAP (409) — closed intervals touch"
            - "Approve-site with term_start one day after existing term_end succeeds; Branch B operating_status == SITE_APPROVED"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: charge_post_reverse_conserves_period_totals
        grounds:
          - calculations.branch_net_profit
          - entities.BranchCharge.fields.status
        distinguishing_aspect: |
          Conserved quantity: the period's derived fiscal totals. Forward
          action (post charge X) paired with its compensation (reverse X)
          leaves total_charges_cents, net_profit_cents, and
          advisor_share_cents exactly as before the pair — pinned as
          sum(POSTED charges) invariant.
        test_recipe:
          setup:
            - "OPEN branch, OPEN period, revenue 900000, charges LEASE 300000 + BOA 240000 (net 360000, share 136800)"
          setup_api_calls:
            - call: "POST /branch-office/advisors"
              payload: { full_name: "Adv I", email: "advi@x.com", hire_date: "2026-01-05T00:00:00Z" }
              as: HomeOfficeAdmin
