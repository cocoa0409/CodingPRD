              payload: { side_effect_severity: "MODERATE" }
              as: Dentist
              as_user_id: "${dent_id}"
              captures: { st_held: $.data.status, adv_after_hold: $.data.applied_increment_mm }
            - call: "GET /appliances/${app_id}"
              payload: {}
              as: Dentist
              as_user_id: "${dent_id}"
              captures: { adv_mid: $.data.current_advancement_mm }
            - call: "POST /titration-visits/${v2_id}/apply"
              payload: { side_effect_severity: "SEVERE" }
              as: Dentist
              as_user_id: "${dent_id}"
              captures: { st_reduced: $.data.status, inc_reduced: $.data.applied_increment_mm }
          assert:
            - "${st_held} == HELD"
            - "${adv_after_hold} == 0.00"
            - "${adv_mid} == 5.75 — the HELD leg moved nothing"
            - "${st_reduced} == REDUCED"
            - "${inc_reduced} == -0.50"
            - "Appliance.${app_id}.current_advancement_mm == 5.25"
            - "Appliance.${app_id}.current_advancement_mm == Appliance.${app_id}.starting_advancement_mm + 1.00 + (-0.50)"
            - "Appliance.${app_id}.applied_visit_count == 2"

      - name: lot_device_population_conservation_across_remediation
        grounds:
          - calculations.lot_remediation_progress
          - state_machines.Appliance.device_hold_status.RECALL_HOLD_to_NONE
          - state_machines.ApplianceLot.RECALL_ISSUED_to_REMEDIATION_COMPLETE
          - entities.ApplianceLot.fields.pending_remediation_count
        distinguishing_aspect: |
          Conserved quantity two is a device population, not a length: affected_device_count must equal
          remediated_count plus pending_remediation_count at every observable instant after issuance,
          including the half-remediated state, and the lot may only close when pending reaches zero.
        test_recipe:
          setup:
            - "One lot holding exactly two appliances: a delivered primary in IN_TITRATION and a spare still FABRICATED."
