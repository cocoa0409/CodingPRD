        grounds:
          - validations[priority=50]
          - validations[priority=60]
          - state_machines.Athlete.NOT_SCREENED_to_SCREENED_HOLD
          - calculations.medical_risk_score
          - errors[ERR_ATHLETE_MEDICAL_HOLD]
          - errors[ERR_QUALIFYING_RESULT_INVALID]
        distinguishing_aspect: |
          ERROR-CATEGORY PAIR = business_safety (priority 50, ERR_ATHLETE_MEDICAL_HOLD, 422) versus
          business_referential (priority 60, ERR_QUALIFYING_RESULT_INVALID, 422) on
          POST /sport-entries: one request violates both because the athlete's medical dimension is
          SCREENED_HOLD and the cited QualifyingResult has meet_level LOCAL under a STATE_QUALIFIER
          source, and the response MUST be the safety error — a pair of two DIFFERENT categories
          that share the same HTTP status, so only the error_id distinguishes them.
        test_recipe:
          setup:
            - "One GamesEdition in REGISTRATION_OPEN and one LOW-contact TRACK sport with min_age 50."
            - "One 65-69 event T5000M with entry_fee_cents 7000, capacity 8, min_entries_to_stage 1."
            - "One athlete born 1958-06-15 (age_at_reference 68, age_group_code 65-69) in registration_status PENDING_PAYMENT."
            - "A screening with systolic_bp 140, resting_hr 85 and prior_cardiac_event true yields risk_score 60.0 and recommendation HOLD_PENDING_PHYSICIAN_REVIEW, so the athlete's medical_status is SCREENED_HOLD."
            - "A QualifyingResult exists for that athlete in TRACK with event_code T5000M, sanctioned true, but meet_level LOCAL."
          setup_api_calls:
            - call: "POST /senior-games/games-editions"
              payload: { name: "Prairie Senior Games 2026", host_city: "Springfield", host_state_code: "IL", competition_start_date: "2026-09-10", competition_end_date: "2026-09-20", age_reference_date: "2026-12-31", registration_deadline_utc: "2026-08-25T23:59:59Z" }
              as: GamesAdmin
              captures: { ed_id: $.data.id }
            - call: "POST /senior-games/sports"
              payload: { sport_code: "TRACK", name: "Track and Field", contact_class: "LOW", mark_direction: "LOWER_IS_BETTER", required_certification_level: 2, min_age: 50 }
              as: GamesAdmin
              captures: { sp_track_id: $.data.id }
            - call: "POST /senior-games/sport-events"
              payload: { sport_id: "${sp_track_id}", games_edition_id: "${ed_id}", event_code: "T5000M", age_group_code: "65-69", gender_division: "MEN", entry_fee_cents: 7000, capacity: 8, min_entries_to_stage: 1 }
              as: GamesAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /senior-games/games-editions/${ed_id}/open-registration"
              payload: {}
              as: GamesAdmin
            - call: "POST /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", full_name: "Cy Warden", email: "cy.warden@example.com", date_of_birth: "1958-06-15", residency_state_code: "IL" }
              as: RegistrationOfficer
              captures: { ath_id: $.data.id }
            - call: "POST /senior-games/qualifying-results"
              payload: { athlete_id: "${ath_id}", sport_id: "${sp_track_id}", event_code: "T5000M", mark_value: 1284.5, meet_date: "2026-06-14", meet_level: "LOCAL", sanctioned: true }
              as: RegistrationOfficer
              captures: { qr_id: $.data.id }
            - call: "POST /senior-games/medical-screenings"
              payload: { athlete_id: "${ath_id}", screened_by_user_id: "md-lopez", systolic_bp: 140, resting_hr: 85, prior_cardiac_event: true }
              as: MedicalDirector
              as_user_id: "md-lopez"
              captures: { ms_id: $.data.id }
          trigger:
            - call: "POST /senior-games/sport-entries"
              payload: { athlete_id: "${ath_id}", sport_event_id: "${ev_id}", qualification_source: "STATE_QUALIFIER", qualifying_result_id: "${qr_id}" }
              as: RegistrationOfficer
          assert:
            - "MedicalScreening.${ms_id}.risk_score == 60.0 and MedicalScreening.${ms_id}.recommendation == HOLD_PENDING_PHYSICIAN_REVIEW and MedicalScreening.${ms_id}.contact_sport_count == 0"
            - "Athlete.${ath_id}.medical_status == SCREENED_HOLD before the trigger"
            - "the trigger returns HTTP 422 with error_id == ERR_ATHLETE_MEDICAL_HOLD"
            - "the trigger does NOT return ERR_QUALIFYING_RESULT_INVALID even though meet_level LOCAL is illegal for qualification_source STATE_QUALIFIER"
            - "no SportEntry row exists for athlete ${ath_id} after the failed call"
            - "SportEvent.${ev_id}.accepted_entry_count == 0 and SportEvent.${ev_id}.available_slots == 8 after the failed call"
            - "control: after POST /senior-games/athletes/${ath_id}/medical-appeal with decision GRANT (medical_status becomes CLEARED_BY_APPEAL) the identical entry request returns HTTP 422 with error_id == ERR_QUALIFYING_RESULT_INVALID, proving the lower-priority rule was merely suppressed"

      - name: assignment_certification_beats_personnel_double_booking
        grounds:
          - validations[priority=64]
          - validations[priority=66]
          - calculations.personnel_conflict_window
          - entities.Personnel.fields.certified_sport_codes
          - entities.Personnel.fields.certification_level
          - errors[ERR_CERTIFICATION_INSUFFICIENT]
          - errors[ERR_PERSONNEL_DOUBLE_BOOKED]
        distinguishing_aspect: |
          ERROR-CATEGORY PAIR = business_constraint (priority 64, ERR_CERTIFICATION_INSUFFICIENT,
          422) versus business_temporal (priority 66, ERR_PERSONNEL_DOUBLE_BOOKED, 409) on
          POST /personnel-assignments: one request violates both because the official is not
          certified for SWIM and the candidate slot 09:30-10:30 collides with the person's existing
          09:00-10:00 assignment, and the response MUST be the 422 constraint error, never the 409
          temporal one.
        test_recipe:
          setup:
            - "One GamesEdition in REGISTRATION_OPEN and one venue with competition_area_count 2, EP_ADVANCED and an on-site medical bay."
            - "Two LOW-contact sports: TRACK with required_certification_level 2 and SWIM with required_certification_level 3."
            - "Two 60-64 events with capacity 8 and min_entries_to_stage 1: T100M under TRACK and S50FREE under SWIM."
            - "Two SessionSlots at the same venue: the TRACK slot 2026-09-12 09:00-10:00 and the SWIM slot 2026-09-12 09:30-10:30, both SCHEDULED (concurrent count 1 < competition_area_count 2)."
            - "One OFFICIAL with certification_level 2 and certified_sport_codes ['TRACK'] already holds an ASSIGNED assignment on the TRACK slot, so Personnel.assigned_minutes_total == 60."
