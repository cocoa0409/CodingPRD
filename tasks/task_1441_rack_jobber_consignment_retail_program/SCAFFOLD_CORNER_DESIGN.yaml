            - { call: "POST /price-directives", payload: { store_agreement_id: "${agr}", product_id: "${prod}", price_cents: 220, effective_from: "2026-08-01T07:00:00Z", expected_store_agreement_version: "${agr_v2}" }, as: JobberAdmin, captures: { err: "$.data.error_id" } }
