              payload: { full_name: "C", email: "c16@x.com" }
              as: VenueAdmin
              captures: { client_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: VenueAdmin
            - call: "POST /bookings"
              payload: { client_id: "${client_id}", venue_id: "${venue_id}", package_id: "${pkg_id}", event_date: "2026-09-12", ceremony_start: "2026-09-12T20:00:00Z", ceremony_end: "2026-09-12T21:00:00Z", reception_start: "2026-09-12T21:00:00Z", reception_end: "2026-09-13T02:00:00Z", expected_guest_count: 120 }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id, v1: $.data.version }
            - call: "POST /bookings/${booking_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { v2: $.data.version }
            - call: "POST /bookings/${booking_id}/holds"
              payload: { space_id: "${space_id}", block_role: "CEREMONY", expected_booking_version: "${v2}" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { v3: $.data.version }
            - call: "POST /bookings/${booking_id}/holds"
              payload: { space_id: "${space_id}", block_role: "RECEPTION", expected_booking_version: "${v3}" }
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /bookings/${booking_id}/place-hold"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /bookings/${booking_id}/payments"
              payload: { direction: "INBOUND", amount_cents: 783800, method: "ACH" }
              as: FinanceOfficer
            - call: "POST /bookings/${booking_id}/confirm"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
          trigger:
            - call: "POST /bookings/${booking_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          assert:
            - "OUTBOUND refund Payment.amount_cents == 587850"
            - "Booking.${booking_id}.amount_paid_cents == 195950 (== retained == round(783800*0.25))"
            - "invariant holds: inbound 783800 == retained 195950 + refunded 587850"

      - name: reschedule_conserves_distinct_committed_space_count
        grounds:
          - state_machines.RescheduleRequest.PROPOSED_to_APPROVED
          - state_machines.SpaceHold.COMMITTED_to_RELEASED
          - state_machines.SpaceHold.HELD_to_COMMITTED
          - entities.SpaceHold.fields.hold_status
        distinguishing_aspect: |
          Conserved quantity = count of COMMITTED SpaceHolds for the booking (inventory occupation),
          a different conserved quantity than cash. Approving a (non-force-majeure) reschedule releases
          each old COMMITTED hold and re-creates exactly one COMMITTED hold per block at the new
          interval, so the booking's COMMITTED-hold count is unchanged (2 before, 2 after) with zero drift.
        test_recipe:
          setup:
            - "Confirmed booking with two COMMITTED holds (ceremony+reception) on a DUAL space; a CLIENT_REQUEST reschedule to a free later date is approved"
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Vp9b", cancellation_tier: "STANDARD" }
              as: VenueAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/spaces"
              payload: { name: "Hall", space_kind: "DUAL", max_capacity: 200, base_rental_cents: 500000, turnover_buffer_minutes: 0 }
              as: VenueAdmin
              captures: { space_id: $.data.id }
            - call: "POST /venues/${venue_id}/packages"
              payload: { tier: "GOLD", per_head_cents: 15000, fb_minimum_cents: 2000000, service_charge_pct: 0.22, tax_pct: 0.08 }
              as: VenueAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /venues/${venue_id}/coordinators"
              payload: { full_name: "Coord", active_booking_cap: 8 }
              as: VenueAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C", email: "c17@x.com" }
              as: VenueAdmin
              captures: { client_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: VenueAdmin
            - call: "POST /bookings"
              payload: { client_id: "${client_id}", venue_id: "${venue_id}", package_id: "${pkg_id}", event_date: "2026-09-12", ceremony_start: "2026-09-12T20:00:00Z", ceremony_end: "2026-09-12T21:00:00Z", reception_start: "2026-09-12T21:00:00Z", reception_end: "2026-09-13T02:00:00Z", expected_guest_count: 120 }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id, v1: $.data.version }
            - call: "POST /bookings/${booking_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { v2: $.data.version }
            - call: "POST /bookings/${booking_id}/holds"
              payload: { space_id: "${space_id}", block_role: "CEREMONY", expected_booking_version: "${v2}" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { v3: $.data.version }
            - call: "POST /bookings/${booking_id}/holds"
              payload: { space_id: "${space_id}", block_role: "RECEPTION", expected_booking_version: "${v3}" }
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /bookings/${booking_id}/place-hold"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /bookings/${booking_id}/payments"
              payload: { direction: "INBOUND", amount_cents: 783800, method: "ACH" }
              as: FinanceOfficer
            - call: "POST /bookings/${booking_id}/confirm"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { v_conf: $.data.version }
            - call: "POST /bookings/${booking_id}/reschedule-requests"
              payload: { reason_kind: "CLIENT_REQUEST", proposed_event_date: "2026-11-14", proposed_ceremony_start: "2026-11-14T20:00:00Z", proposed_ceremony_end: "2026-11-14T21:00:00Z", proposed_reception_start: "2026-11-14T21:00:00Z", proposed_reception_end: "2026-11-15T02:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /reschedule-requests/${req_id}/approve"
              payload: { expected_booking_version: "${v_conf}" }
              as: Coordinator
              as_user_id: "${coord_id}"
          assert:
            - "count of SpaceHolds for ${booking_id} with hold_status == COMMITTED equals 2 after approval (unchanged from before)"
            - "the two new COMMITTED holds occupy the 2026-11-14 interval and the original 2026-09-12 holds are RELEASED"
            - "no drift: exactly one COMMITTED hold per block_role (CEREMONY, RECEPTION)"
