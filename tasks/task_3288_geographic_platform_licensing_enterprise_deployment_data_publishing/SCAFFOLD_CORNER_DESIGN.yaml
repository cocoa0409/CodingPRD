            - call: "POST /geo-orgs/eligibility-verifications"
              payload: { organization_id: "${org_id}", program_kind: "NONPROFIT_PROGRAM", evidence_document_ref: "doc-1" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /geo-orgs/eligibility-verifications/${ev_id}/transition"
              payload: { target_status: "UNDER_REVIEW", evidence_document_ref: "doc-1" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /geo-orgs/eligibility-verifications/${ev_id}/transition"
              payload: { target_status: "UNDER_REVIEW" }
              as: ComplianceOfficer
              as_user_id: "co-3"
            - call: "POST /geo-orgs/eligibility-verifications/${ev_id}/transition"
              payload: { target_status: "APPROVED" }
              as: ComplianceOfficer
              as_user_id: "co-3"
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_EV_NOT_RENEWAL_REQUIRED (resubmit path only from RENEWAL_REQUIRED; from SUBMITTED the NamedUser resubmit is rejected)"
            - "err2 == ERR_INVALID_EV_DECISION (decision_rationale missing)"
            - "the ComplianceOfficer begin-review between them succeeded (SUBMITTED → UNDER_REVIEW)"

