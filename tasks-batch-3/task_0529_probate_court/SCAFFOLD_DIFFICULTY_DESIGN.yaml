              as: Clerk
              captures: { v4: $.data.version }
            - call: "POST /accountings/${acct_inv_id}/file"
              payload: { expected_estate_version: "${v4}" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v5: $.data.version }
            - call: "POST /accountings/${acct_inv_id}/approve"
              payload: { expected_estate_version: "${v5}" }
              as: ProbateJudge
            - call: "POST /accountings"
              payload: { estate_id: "${est_id}", report_type: "INTERIM" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
              captures: { acct_int_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v6: $.data.version }
            - call: "POST /accountings/${acct_int_id}/file"
              payload: { expected_estate_version: "${v6}" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v7: $.data.version }
            - call: "POST /accountings/${acct_int_id}/approve"
              payload: { expected_estate_version: "${v7}" }
              as: ProbateJudge
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v8: $.data.version }
            - call: "POST /assets/${asset_id}/marshal"
              payload: { expected_estate_version: "${v8}" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
            - call: "POST /accountings"
              payload: { estate_id: "${est_id}", report_type: "FINAL" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
              captures: { acct_final_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v9: $.data.version }
            - call: "POST /accountings/${acct_final_id}/file"
              payload: { expected_estate_version: "${v9}" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
            - call: "POST /distributions"
              payload: { estate_id: "${est_id}", beneficiary_id: "${ben_id}", proposed_amount_cents: 300000 }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
              captures: { dist_a_id: $.data.id }
            - call: "POST /distributions"
              payload: { estate_id: "${est_id}", beneficiary_id: "${ben_id}", proposed_amount_cents: 200000 }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
              captures: { dist_b_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v_pre_first_approve: $.data.version }
            - call: "POST /distributions/${dist_a_id}/approve"
              payload: { expected_estate_version: "${v_pre_first_approve}" }
              as: ProbateJudge
          trigger:
            - call: "POST /distributions/${dist_b_id}/approve"
              payload: { expected_estate_version: "${v_pre_first_approve}" }
              as: ProbateJudge
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"
            - "HTTP status == 412"
            - "Distribution.${dist_b_id}.status == PROPOSED (unchanged)"
