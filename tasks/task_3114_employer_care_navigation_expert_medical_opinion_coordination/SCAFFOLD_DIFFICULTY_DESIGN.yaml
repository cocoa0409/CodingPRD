              as_user_id: "${m_id}"
            - call: "POST /care/authorizations/${auth_id}/approve"
              payload: {}
              as: PlanAdministrator
              as_user_id: "pa-1"
          assert:
            - "after deny: PlanAuthorization.${auth_id}.status == DENIED"
            - "after deny: ExpertOpinionCase.${emo_id}.status == AUTH_BLOCKED (link 1)"
            - "after deny: NavigationCase.${nc_id}.status == ESCALATED (link 2)"
            - "after appeal+approve: PlanAuthorization.${auth_id}.status == APPROVED"
            - "after approve: ExpertOpinionCase.${emo_id}.status == INTAKE (reverse link unblocks the case)"

