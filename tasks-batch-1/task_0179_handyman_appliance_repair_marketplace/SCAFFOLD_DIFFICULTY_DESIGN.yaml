              as: Anonymous
              captures: { pro_id: $.data.id }
            - call: "POST /pros/${pro_id}/background-checks"
              payload: { check_type: "CRIMINAL" }
              as: PlatformAdmin
              captures: { bc1: $.data.id }
            - call: "POST /background-checks/${bc1}/decide"
              payload: { decision: "PASS" }
              as: PlatformAdmin
            - call: "POST /pros/${pro_id}/background-checks"
              payload: { check_type: "IDENTITY" }
              as: PlatformAdmin
              captures: { bc2: $.data.id }
            - call: "POST /background-checks/${bc2}/decide"
              payload: { decision: "PASS" }
              as: PlatformAdmin
            - call: "POST /dispatch-windows"
              payload: { pro_id: "${pro_id}", window_start: "2026-06-01T10:00:00.000Z", window_end: "2026-06-01T12:00:00.000Z", service_zip_code: "30301" }
              as: Pro
              as_user_id: "${pro_id}"
              captures: { win_id: $.data.id, win_v: $.data.version }
            - call: "POST /jobs"
              payload: { customer_id: "${cust_id}", category_id: "${cat_id}", address_zip_code: "30301" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /jobs/${job_id}/instant-quote"
