              as: AgencyOperations
            - call: "GET /toll/image-bills"
              payload: { status: "PENDING_LOOKUP" }
              as: PlateLookupAgent
              captures: { b5: "$.data[0].id", b6: "$.data[1].id" }
            - call: "POST /toll/image-bills/${b5}/resolve"
