            - { call: "POST /fleet-wash/subscriptions", payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", cadence: "MONTHLY", next_service_date: "2026-02-15" }, as: PlatformAdmin, captures: { sub_id: $.data.id } }
            - { call: "POST /fleet-wash/_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/subscriptions/${sub_id}/events", payload: { event_type: "PAUSE", pause_days: 75 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /fleet-wash/_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/subscriptions/${sub_id}/events", payload: { event_type: "RESUME" }, as: Customer, as_user_id: "${cust_id}", captures: { pd: $.data.paused_days_365d, pc: $.data.pause_count_365d } }
