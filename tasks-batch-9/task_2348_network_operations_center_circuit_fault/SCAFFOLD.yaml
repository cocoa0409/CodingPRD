scenario: |
  Generate task harder than expert level!

  2348. Network Operations Center & Circuit Fault Management (enterprise network operations center):
  monitoring coverage across circuits, devices and application paths with alarm correlation to suppress
  noise, incident classification by severity with response and escalation matrices, carrier trouble
  ticket opening with circuit identifiers, test results and escalation through carrier tiers, service
  level agreement tracking on carrier restoration times with credit claims, redundancy verification with
  failover testing and single-point-of-failure identification, change coordination with maintenance
  notifications from carriers and internal windows, chronic circuit identification with vendor
  performance review and replacement decisions, capacity monitoring with utilization thresholds
  triggering upgrade orders
domain_name: network-operations-circuit-fault
api_prefix: ""   # flat top-level collections: /carriers, /circuits, /devices, /application-paths, /path-segments, /alarms, /incidents, /carrier-tickets, /sla-credit-claims, /maintenance-windows, /failover-tests, /upgrade-orders, /vendor-reviews, /_clock

complexity_profile:
  primary_archetype: graph_constraint
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: graph
  # ApplicationPath <-> PathSegment <-> {Circuit, Device} is a many-to-many bipartite graph with
  # leg partitions; Alarm is self-referential (correlation_parent_alarm_id) and polymorphic over
  # {Circuit, Device}; Device carries an uplink edge into Circuit. Redundancy/SPOF answers require
  # traversing the path->leg->segment->target graph, not a parent-child tree.

  state_machine_shape: cyclic
  # CarrierTicket cycles (TESTING -> ESCALATED_T2 -> RESTORED_PENDING_CONFIRM -> REOPENED -> TESTING),
  # SlaCreditClaim cycles (SUBMITTED -> REJECTED -> SUBMITTED), Circuit.operational_state cycles
  # (UP -> DOWN -> UP). Incident carries two parallel dimensions (response_state x escalation_state)
  # that advance independently on the same row; Circuit carries three (operational_state x
  # chronic_state x capacity_state).

  relationship_patterns:
    - many_to_many        # ApplicationPath <-> Circuit/Device through PathSegment
    - self_referential    # Alarm.correlation_parent_alarm_id -> Alarm.id
    - polymorphic         # Alarm source is exactly one of {Circuit, Device}; PathSegment target likewise
    - cross_aggregate     # CarrierTicket spans Incident + Circuit + Carrier; MaintenanceWindow gates FailoverTest

  role_model: segregation_of_duties
  # The user who confirms carrier restoration may not submit the resulting credit claim; the user who
  # creates an upgrade order may not approve it. CarrierLiaison is entity-backed and scoped to its own
  # Carrier's tickets, windows and claims.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal carrier name
      - name: carrier_code
        type: string
        source: input
        description: short operator code, globally unique (case-sensitive exact match)
        constraints: unique across Carrier; 2-12 chars
      - name: escalation_tier_count
        type: integer
        source: input
        description: highest carrier escalation tier available on this contract
        default: 3
        constraints: 1..3
      - name: sla_restore_minutes_critical
        type: integer
        source: input
        description: contracted restoration target in minutes for incidents classified SEV1 or SEV2
        default: 240
        constraints: ">= 1"
      - name: sla_restore_minutes_standard
        type: integer
        source: input
        description: contracted restoration target in minutes for incidents classified SEV3 or SEV4
        default: 480
        constraints: ">= 1"
      - name: credit_pct_per_breach_hour
        type: number
        source: input
        description: percent of circuit mrc_cents credited per full breach hour
        default: 5.0
        constraints: 0 < value <= 25
      - name: credit_pct_cap
        type: number
        source: input
        description: maximum percent of circuit mrc_cents claimable for a single outage
        default: 50.0
        constraints: 0 < value <= 100
      - name: min_claim_amount_cents
        type: integer
        source: input
        description: contractual floor below which a credit claim may not be submitted
        default: 5000
        constraints: ">= 0"
      - name: tier_escalation_min_minutes
        type: integer
        source: input
        description: minimum dwell time in the current carrier tier before escalating to the next tier
        default: 60
        constraints: ">= 0"
      - name: watchlist_exposure_threshold_cents
        type: integer
        source: input
        description: open credit exposure at or above which the carrier flips to WATCHLIST
        default: 100000
        constraints: ">= 1"
      - name: open_credit_exposure_cents
        type: integer
        source: computed
        description: "conserved ledger: sum of credit_amount_cents over this carrier's SlaCreditClaim rows whose state IN {DRAFT, SUBMITTED, ACKNOWLEDGED} (see calculations.carrier_exposure_ledger)"
        default: 0
      - name: committed_upgrade_mbps
        type: integer
        source: computed
        description: "conserved ledger: sum of delta_mbps over UpgradeOrder rows on this carrier's circuits whose state IN {DRAFT, SUBMITTED, APPROVED, IN_PROGRESS} (see calculations.committed_upgrade_bandwidth_ledger)"
        default: 0
      - name: watchlist_state
        type: enum
        source: computed
        description: vendor-management posture derived from open_credit_exposure_cents
        default: ACTIVE
        constraints: ACTIVE | WATCHLIST
      - name: chronic_circuit_count
        type: integer
        source: computed
        description: count of this carrier's Circuit rows whose chronic_state IN {CHRONIC, REPLACEMENT_APPROVED}
        default: 0

  - name: Circuit
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: FK -> Carrier.id; owning carrier of this access/transport circuit
      - name: carrier_circuit_identifier
        type: string
        source: input
        description: carrier-assigned circuit identifier quoted on trouble tickets
        constraints: unique per (carrier_id, carrier_circuit_identifier)
      - name: site_a_code
        type: string
        source: input
        description: A-end site code
      - name: site_z_code
        type: string
        source: input
        description: Z-end site code
      - name: bandwidth_mbps
        type: integer
        source: input
        description: provisioned bandwidth in Mbps
        constraints: must be a member of calculations.capacity_threshold_evaluation.constants.BANDWIDTH_LADDER_MBPS
      - name: mrc_cents
        type: integer
        source: input
        description: monthly recurring charge in cents, the base for SLA credit computation
        constraints: ">= 1"
      - name: monitoring_state
        type: enum
        source: input
        description: monitoring coverage state; MAINTENANCE_SUPPRESSED is set only by MaintenanceWindow start
        default: UNMONITORED
        constraints: UNMONITORED | MONITORED | MAINTENANCE_SUPPRESSED (input accepts only UNMONITORED or MONITORED)
      - name: operational_state
        type: enum
        source: computed
        description: derived from uncleared ROOT alarms on this circuit (see state_machines Circuit/operational_state)
        default: UP
        constraints: UP | DEGRADED | DOWN
      - name: chronic_state
        type: enum
        source: computed
        description: chronic-fault posture derived from fault_count_period (see calculations.chronic_circuit_evaluation)
        default: NORMAL
        constraints: NORMAL | CHRONIC_CANDIDATE | CHRONIC | REPLACEMENT_APPROVED
      - name: capacity_state
        type: enum
        source: computed
        description: utilization posture derived from consecutive_high_readings
        default: NORMAL
        constraints: NORMAL | WATCH | UPGRADE_REQUIRED
      - name: consecutive_high_readings
        type: integer
        source: computed
        description: number of consecutive CapacityReading rows (ordered by sample_at ASC) with threshold_state HIGH ending at the latest reading
        default: 0
      - name: spof_flag
        type: boolean
        source: computed
        description: true when this circuit is the sole surviving leg member of at least one ApplicationPath whose posture is DEGRADED_NO_REDUNDANCY
        default: false
      - name: fault_count_period
        type: integer
        source: computed
        description: count of Incident rows with primary_circuit_id equal to this circuit, response_state RESOLVED and resolved_at >= (clock_now - CHRONIC_WINDOW_DAYS)
        default: 0
      - name: last_incident_at
        type: datetime
        source: computed
        description: detected_at of the most recent Incident on this circuit, null when none
        default: null

  - name: Device
    parent: null
    common_fields: true
    fields:
      - name: hostname
        type: string
        source: input
        description: management hostname, globally unique
        constraints: unique across Device
      - name: site_code
        type: string
        source: input
        description: site where the device is installed
      - name: device_role
        type: enum
        source: input
        description: topology role of the device
        constraints: EDGE | CORE | ACCESS
      - name: primary_uplink_circuit_id
        type: string
        source: input
        description: FK -> Circuit.id; uplink circuit whose ROOT alarms suppress this device's alarms; null when the device has no monitored uplink
        default: null
      - name: monitoring_state
        type: enum
        source: input
        description: monitoring coverage state of the device
        default: UNMONITORED
        constraints: UNMONITORED | MONITORED
      - name: operational_state
        type: enum
        source: computed
        description: derived from uncleared ROOT alarms on this device
        default: UP
        constraints: UP | DOWN

  - name: ApplicationPath
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: business name of the monitored application path
      - name: service_tier
        type: enum
        source: input
        description: business criticality tier, feeds incident impact scoring weights
        constraints: GOLD | SILVER | BRONZE
      - name: protection_scheme
        type: enum
        source: input
        description: redundancy design of the path
        constraints: ACTIVE_ACTIVE | ACTIVE_STANDBY | UNPROTECTED
      - name: min_surviving_legs
        type: integer
        source: input
        description: minimum number of healthy legs required for the path to be considered protected
        default: 1
        constraints: 1..2
      - name: posture
        type: enum
        source: computed
        description: derived redundancy posture (see calculations.path_posture_and_legs)
        default: PROTECTED
        constraints: PROTECTED | DEGRADED_REDUNDANT | DEGRADED_NO_REDUNDANCY | DOWN
      - name: active_leg_count
        type: integer
        source: computed
        description: count of distinct leg_group values among PathSegment rows of this path with segment_state ACTIVE
        default: 0
      - name: healthy_leg_count
        type: integer
        source: computed
        description: count of distinct ACTIVE leg_group values whose every ACTIVE segment target is operationally UP
        default: 0
      - name: monitored_segment_count
        type: integer
        source: computed
        description: count of ACTIVE PathSegment rows of this path whose target monitoring_state is MONITORED
        default: 0

  - name: PathSegment
    parent: ApplicationPath
    common_fields: true
    fields:
      - name: application_path_id
        type: string
        source: input
        description: FK -> ApplicationPath.id; path this segment belongs to
      - name: leg_group
        type: enum
        source: input
        description: redundancy leg this segment belongs to
        constraints: LEG_A | LEG_B
      - name: sequence_index
        type: integer
        source: input
        description: hop position within the leg
        constraints: ">= 1; unique per (application_path_id, leg_group, sequence_index)"
      - name: circuit_id
        type: string
        source: input
        description: FK -> Circuit.id; circuit traversed at this hop; null when the hop is a device
        default: null
      - name: device_id
        type: string
        source: input
        description: FK -> Device.id; device traversed at this hop; null when the hop is a circuit
        default: null
      - name: segment_state
        type: enum
        source: system
        description: ACTIVE on creation, RETIRED after DELETE /path-segments/{id}
        default: ACTIVE
        constraints: ACTIVE | RETIRED

  - name: Alarm
    parent: null
    common_fields: false
    fields:
      - name: source_circuit_id
        type: string
        source: input
        description: FK -> Circuit.id; alarming circuit; null when the alarm source is a device
        default: null
      - name: source_device_id
        type: string
        source: input
        description: FK -> Device.id; alarming device; null when the alarm source is a circuit
        default: null
      - name: alarm_type
        type: enum
        source: input
        description: monitoring probe that fired
        constraints: LOSS_OF_SIGNAL | ERRORED_SECONDS | PATH_LATENCY | DEVICE_UNREACHABLE
      - name: raw_severity
        type: enum
        source: input
        description: severity reported by the monitoring platform before correlation
        constraints: CRITICAL | MAJOR | MINOR | WARNING
      - name: raised_at
        type: datetime
        source: input
        description: instant the monitoring platform observed the condition
        constraints: must be <= logical clock now
      - name: correlation_state
        type: enum
        source: computed
        description: ROOT when no correlation parent was selected, SUPPRESSED when a parent was selected, CLEARED once cleared_at is set
        constraints: ROOT | SUPPRESSED | CLEARED
      - name: correlation_parent_alarm_id
        type: string
        source: computed
        description: FK -> Alarm.id; selected ROOT alarm that suppresses this alarm; null for ROOT alarms
        default: null
      - name: incident_id
        type: string
        source: computed
        description: FK -> Incident.id; incident this alarm was attached to; null for SUPPRESSED alarms
        default: null
      - name: cleared_at
        type: datetime
        source: input
        description: instant the condition cleared; null while active
        default: null

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - name: primary_circuit_id
        type: string
        source: system
        description: FK -> Circuit.id; circuit the incident is anchored to (the root alarm's circuit, or the alarming device's primary_uplink_circuit_id)
      - name: root_alarm_id
        type: string
        source: system
        description: FK -> Alarm.id; ROOT alarm that opened this incident
      - name: severity
        type: enum
        source: computed
        description: classification derived from impact_score (see calculations.incident_severity_classification)
        constraints: SEV1 | SEV2 | SEV3 | SEV4
      - name: impact_score
        type: number
        source: computed
        description: weighted impact score over affected ApplicationPath rows
      - name: response_state
        type: enum
        source: computed
        description: response dimension of the incident lifecycle
        default: DETECTED
        constraints: DETECTED | TRIAGED | MITIGATED | RESOLVED
      - name: escalation_state
        type: enum
        source: computed
        description: escalation dimension of the incident lifecycle, advanced and de-escalated independently of response_state
        default: NONE
        constraints: NONE | L1 | L2 | EXEC
      - name: detected_at
        type: datetime
        source: system
        description: logical clock instant at which the incident was opened
      - name: triaged_at
        type: datetime
        source: system
        description: instant response_state became TRIAGED, null while DETECTED
        default: null
      - name: mitigated_at
        type: datetime
        source: system
        description: instant response_state became MITIGATED, null before
        default: null
      - name: resolved_at
        type: datetime
        source: system
        description: instant response_state became RESOLVED, null before; reset to null on reopen
        default: null
      - name: response_due_at
        type: datetime
        source: computed
        description: detected_at + RESPONSE_MINUTES[severity] from the response matrix
      - name: escalation_due_at
        type: datetime
        source: computed
        description: detected_at + ESCALATION_MINUTES[severity] from the escalation matrix
      - name: affected_path_count
        type: integer
        source: computed
        description: count of ApplicationPath rows having an ACTIVE PathSegment whose circuit_id equals primary_circuit_id
        default: 0
      - name: alarm_count
        type: integer
        source: computed
        description: count of Alarm rows whose incident_id equals this incident
        default: 1
      - name: reopen_count
        type: integer
        source: computed
        description: number of times response_state returned to TRIAGED from RESOLVED
        default: 0

  - name: CarrierTicket
    parent: null
    common_fields: true
    fields:
      - name: incident_id
        type: string
        source: input
        description: FK -> Incident.id; NOC incident this carrier ticket belongs to
      - name: circuit_id
        type: string
        source: input
        description: FK -> Circuit.id; faulted circuit reported to the carrier
      - name: carrier_id
        type: string
        source: computed
        description: FK -> Carrier.id; copied from Circuit.carrier_id at open time
      - name: carrier_reference
        type: string
        source: input
        description: carrier's own ticket number
        constraints: unique per (carrier_id, carrier_reference)
      - name: reported_circuit_identifier
        type: string
        source: computed
        description: snapshot of Circuit.carrier_circuit_identifier taken at open time and quoted to the carrier
      - name: state
        type: enum
        source: computed
        description: carrier ticket lifecycle state
        default: OPEN
        constraints: OPEN | TESTING | ESCALATED_T2 | ESCALATED_T3 | RESTORED_PENDING_CONFIRM | REOPENED | CLOSED_RESTORED | CLOSED_NO_FAULT
      - name: tier_level
        type: integer
        source: computed
        description: current carrier escalation tier
        default: 1
        constraints: 1..3
      - name: tier_entered_at
        type: datetime
        source: system
        description: logical clock instant the ticket entered tier_level
      - name: opened_at
        type: datetime
        source: system
        description: logical clock instant the ticket was opened with the carrier
      - name: restored_at
        type: datetime
        source: input
        description: carrier-asserted restoration instant, null until the carrier reports restoration
        default: null
      - name: confirmed_at
        type: datetime
        source: system
        description: instant the NOC confirmed restoration after soak, null before
        default: null
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID of the NocAnalyst who opened the ticket
      - name: restoration_confirmed_by_user_id
        type: string
        source: system
        description: X-User-ID of the NocShiftLead who confirmed restoration; feeds the segregation-of-duties check on claim submission
        default: null
      - name: excluded_minutes
        type: number
        source: computed
        description: minutes of [opened_at, restored_at) covered by the merged union of CARRIER_NOTIFIED MaintenanceWindow intervals on circuit_id whose state IN {APPROVED, IN_PROGRESS, COMPLETED}
        default: 0
      - name: restoration_minutes_carrier_clock
        type: number
        source: computed
        description: carrier-clock restoration duration, null until restored_at is set (see calculations.restoration_minutes_dual_clock)
        default: null
      - name: restoration_minutes_noc_clock
        type: number
        source: computed
        description: NOC-clock restoration duration, null until restored_at is set (see calculations.restoration_minutes_dual_clock)
        default: null
      - name: reopen_count
        type: integer
        source: computed
        description: number of times the ticket returned to REOPENED after a failed soak
        default: 0
      - name: fail_test_count
        type: integer
        source: computed
        description: count of TestResult rows on this ticket whose outcome IN {FAIL, INCONCLUSIVE}
        default: 0

  - name: TestResult
    parent: CarrierTicket
    common_fields: false
    fields:
      - name: carrier_ticket_id
        type: string
        source: input
        description: FK -> CarrierTicket.id; ticket the test evidence belongs to
      - name: test_type
        type: enum
        source: input
        description: test performed on the circuit
        constraints: BERT | LOOPBACK | OTDR | PING_SWEEP
      - name: outcome
        type: enum
        source: input
        description: test outcome; FAIL or INCONCLUSIVE constitutes escalation evidence
        constraints: PASS | FAIL | INCONCLUSIVE
      - name: notes
        type: string
        source: input
        description: free-text observation
        default: null
      - name: performed_at
        type: datetime
        source: system
        description: logical clock instant the test was recorded
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the analyst who recorded the test

  - name: SlaCreditClaim
    parent: null
    common_fields: true
    fields:
      - name: carrier_ticket_id
        type: string
        source: input
        description: FK -> CarrierTicket.id; restored ticket the claim is derived from
      - name: carrier_id
        type: string
        source: computed
        description: FK -> Carrier.id; copied from CarrierTicket.carrier_id
      - name: basis
        type: enum
        source: input
        description: which restoration clock the claim is computed from
        default: CARRIER_CLOCK
        constraints: CARRIER_CLOCK | NOC_CLOCK
      - name: sla_target_minutes
        type: integer
        source: computed
        description: carrier SLA target selected by the incident severity band
      - name: breach_minutes
        type: number
        source: computed
        description: max(0, restoration_minutes[basis] - sla_target_minutes)
      - name: breach_hours
        type: integer
        source: computed
        description: ceil(breach_minutes / 60), zero when breach_minutes is zero
      - name: credit_amount_cents
        type: integer
        source: computed
        description: per-path-line credit sum capped by credit_pct_cap (see calculations.sla_credit_amount)
      - name: state
        type: enum
        source: computed
        description: claim lifecycle state
        default: DRAFT
        constraints: DRAFT | SUBMITTED | ACKNOWLEDGED | PAID | REJECTED | WITHDRAWN
      - name: origin
        type: enum
        source: system
        description: AUTO_DRAFT when synthesized by restoration confirmation, MANUAL when created through POST /sla-credit-claims
        constraints: AUTO_DRAFT | MANUAL
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the VendorManager who submitted the claim, null while DRAFT
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: logical clock instant of the most recent submission, null while DRAFT
        default: null
      - name: paid_amount_cents
        type: integer
        source: input
        description: settled amount recorded when the claim moves to PAID
        default: null
      - name: rejection_reason
        type: string
        source: input
        description: carrier-supplied rejection reason, null unless the claim was rejected
        default: null
      - name: revision_count
        type: integer
        source: computed
        description: number of resubmissions after a carrier rejection
        default: 0

  - name: MaintenanceWindow
    parent: null
    common_fields: true
    fields:
      - name: circuit_id
        type: string
        source: input
        description: FK -> Circuit.id; circuit the window applies to
      - name: carrier_id
        type: string
        source: computed
        description: FK -> Carrier.id; copied from Circuit.carrier_id
      - name: origin
        type: enum
        source: input
        description: CARRIER_NOTIFIED for carrier-announced work, INTERNAL_CHANGE for NOC-driven change windows
        constraints: CARRIER_NOTIFIED | INTERNAL_CHANGE
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the maintenance interval
      - name: window_end
        type: datetime
        source: input
        description: exclusive end of the maintenance interval
        constraints: must be strictly after window_start
      - name: state
        type: enum
        source: computed
        description: window lifecycle state
        default: PROPOSED
        constraints: PROPOSED | APPROVED | REJECTED | IN_PROGRESS | COMPLETED | CANCELLED
      - name: suppresses_monitoring
        type: boolean
        source: input
        description: when true, starting the window sets Circuit.monitoring_state to MAINTENANCE_SUPPRESSED
        default: true
      - name: risk_acknowledged
        type: boolean
        source: input
        description: set at review time; required when approval would leave an affected path at or below min_surviving_legs
        default: false
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the NocShiftLead who reviewed the window, null while PROPOSED
        default: null
      - name: monitoring_state_before_start
        type: enum
        source: system
        description: Circuit.monitoring_state captured at window start so completion can restore it exactly
        default: null
        constraints: UNMONITORED | MONITORED

  - name: FailoverTest
    parent: null
    common_fields: true
    fields:
      - name: application_path_id
        type: string
        source: input
        description: FK -> ApplicationPath.id; path whose redundancy is being verified
      - name: tested_leg_group
        type: enum
        source: input
        description: leg deliberately failed during the test
        constraints: LEG_A | LEG_B
      - name: scheduled_start
        type: datetime
        source: input
        description: inclusive start of the reserved test interval
      - name: scheduled_end
        type: datetime
        source: input
        description: exclusive end of the reserved test interval
        constraints: must be strictly after scheduled_start
      - name: carrier_id_set
        type: array
        source: computed
        description: distinct Carrier ids of circuits reachable from the path's ACTIVE segments, used for the concurrent-test capacity rule
      - name: state
        type: enum
        source: computed
        description: failover test lifecycle state
        default: SCHEDULED
        constraints: SCHEDULED | IN_PROGRESS | PASSED | FAILED | ABORTED
      - name: surviving_leg_count
        type: integer
        source: input
        description: number of legs observed healthy while tested_leg_group was down, recorded at result time
        default: null
      - name: scheduled_by_user_id
        type: string
        source: system
        description: X-User-ID of the NocShiftLead who scheduled the test
      - name: attested_by_user_id
        type: string
        source: system
        description: X-User-ID of the user who recorded the result, null before
        default: null

  - name: CapacityReading
    parent: Circuit
    common_fields: false
    fields:
      - name: circuit_id
        type: string
        source: input
        description: FK -> Circuit.id; circuit the utilization sample belongs to
      - name: sample_at
        type: datetime
        source: input
        description: end instant of the 5-minute utilization sample
        constraints: must be strictly greater than the sample_at of the circuit's latest CapacityReading
      - name: utilization_pct
        type: number
        source: input
        description: peak utilization percentage in the sample interval
        constraints: 0 <= value <= 100
      - name: direction
        type: enum
        source: input
        description: traffic direction sampled
        constraints: INGRESS | EGRESS
      - name: threshold_state
        type: enum
        source: computed
        description: HIGH when utilization_pct >= HIGH_UTILIZATION_PCT, else NORMAL
        constraints: NORMAL | HIGH

  - name: UpgradeOrder
    parent: null
    common_fields: true
    fields:
      - name: circuit_id
        type: string
        source: input
        description: FK -> Circuit.id; circuit to be upgraded
      - name: target_bandwidth_mbps
        type: integer
        source: input
        description: requested bandwidth after upgrade
        constraints: must be a BANDWIDTH_LADDER_MBPS member strictly greater than Circuit.bandwidth_mbps
      - name: delta_mbps
        type: integer
        source: computed
        description: target_bandwidth_mbps - Circuit.bandwidth_mbps at creation time
      - name: expedite
        type: boolean
        source: input
        description: whether an expedite fee applies
        default: false
      - name: subtotal_cents
        type: integer
        source: computed
        description: BASE_INSTALL_CENTS + delta_mbps * PER_MBPS_CENTS
      - name: expedite_fee_cents
        type: integer
        source: computed
        description: expedite multiplier applied to subtotal_cents, zero when expedite is false
        default: 0
      - name: total_cost_cents
        type: integer
        source: computed
        description: subtotal_cents + expedite_fee_cents
      - name: state
        type: enum
        source: computed
        description: upgrade order lifecycle state
        default: DRAFT
        constraints: DRAFT | SUBMITTED | APPROVED | IN_PROGRESS | COMPLETED | CANCELLED
      - name: origin
        type: enum
        source: system
        description: AUTO_THRESHOLD when synthesized by the capacity threshold trigger, MANUAL when created through POST /upgrade-orders
        constraints: AUTO_THRESHOLD | MANUAL
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the creator, or the literal "system" for AUTO_THRESHOLD orders
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the approver, null before approval; must differ from created_by_user_id
        default: null
      - name: cancel_reason
        type: string
        source: input
        description: reason recorded when the order is cancelled
        default: null

  - name: VendorReview
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: FK -> Carrier.id; carrier under review
      - name: period_start
        type: datetime
        source: input
        description: inclusive start of the review period
      - name: period_end
        type: datetime
        source: input
        description: exclusive end of the review period
        constraints: must be strictly after period_start
      - name: chronic_circuit_count
        type: integer
        source: computed
        description: snapshot of Carrier.chronic_circuit_count taken at review creation
      - name: credit_ratio
        type: number
        source: computed
        description: acknowledged and paid credit cents in period divided by total mrc_cents of the carrier's circuits, 4 decimal places
      - name: mttr_minutes
        type: number
        source: computed
        description: mean restoration_minutes_carrier_clock over tickets confirmed in period, 2 decimal places, zero when none
      - name: net_performance_score
        type: number
        source: computed
        description: weighted vendor score (see calculations.vendor_review_score)
      - name: decision
        type: enum
        source: computed
        description: replacement decision outcome
        default: PENDING
        constraints: PENDING | RETAIN | REMEDIATION_PLAN | REPLACE
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the VendorManager who recorded the decision, null while PENDING
        default: null
      - name: justification
        type: string
        source: input
        description: decision rationale, null while PENDING
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Alarm
    dimension: correlation_state
    initial_state: ROOT
    terminal_states: [CLEARED]
    note: |
      correlation_state is decided at creation by calculations.alarm_correlation_assignment: ROOT when the
      candidate-parent set is empty, SUPPRESSED when a parent was selected. Only ROOT alarms drive circuit,
      device, path and incident state.
    transitions:
      - from: ROOT
        to: CLEARED
        trigger: "POST /alarms/{id}/clear"
        actor: NocAnalyst
        preconditions:
          - "alarm.cleared_at IS NULL (else ERR_ALARM_ALREADY_CLEARED)"
          - "body cleared_at >= alarm.raised_at AND body cleared_at <= logical clock now (else ERR_TIMESTAMP_RANGE_INVALID)"
        side_effects:
          - "sets cleared_at and correlation_state = CLEARED"
          - "CASCADE link 1: promotes the earliest SUPPRESSED child of this alarm (children ordered by raised_at ASC, tie-break created_at ASC, only children with cleared_at IS NULL) to correlation_state ROOT with correlation_parent_alarm_id = null; remaining children are re-parented to the promoted alarm"
          - "CASCADE link 2: because a new ROOT alarm now exists on the promoted alarm's source, that source's operational_state is recomputed (Device UP -> DOWN, or Circuit UP -> DEGRADED/DOWN)"
          - "CASCADE link 3: because the source's operational_state changed, every ApplicationPath with an ACTIVE PathSegment referencing that source recomputes posture, active_leg_count, healthy_leg_count via calculations.path_posture_and_legs, and spof_flag is re-derived on the surviving legs' circuits"
          - "the promoted alarm attaches to the incident open on the anchor circuit (alarm_count += 1, severity ratchet per calculations.incident_severity_classification) or opens a new Incident when none is open"
          - "when no SUPPRESSED child exists, recomputes the source's operational_state from the remaining uncleared ROOT alarms (UP when none remain) and re-derives affected path postures and spof_flag"
      - from: SUPPRESSED
        to: CLEARED
        trigger: "POST /alarms/{id}/clear"
        actor: NocAnalyst
        preconditions:
          - "alarm.cleared_at IS NULL (else ERR_ALARM_ALREADY_CLEARED)"
        side_effects:
          - "sets cleared_at and correlation_state = CLEARED"
          - "no circuit, device, path or incident state changes (suppressed alarms are noise)"
      - from: SUPPRESSED
        to: ROOT
        trigger: "system: parent alarm cleared via POST /alarms/{id}/clear"
        actor: system
        preconditions:
          - "this alarm is the earliest-raised uncleared SUPPRESSED child of the cleared parent"
        side_effects:
          - "sets correlation_parent_alarm_id = null and correlation_state = ROOT"
          - "drives the source operational_state / path posture / incident cascade described on ROOT -> CLEARED"

  - entity: Circuit
    dimension: operational_state
    initial_state: UP
    terminal_states: []
    note: "cyclic dimension; recomputed from the set of uncleared ROOT alarms on the circuit: DOWN when any has raw_severity CRITICAL, DEGRADED when any has MAJOR or MINOR, UP when none remain (WARNING alarms never change operational_state)."
    transitions:
      - from: UP
        to: DOWN
        trigger: "POST /alarms with source_circuit_id and raw_severity CRITICAL that resolves to correlation_state ROOT"
        actor: system
        preconditions: ["alarm correlation_state == ROOT"]
        side_effects:
          - "CASCADE link 2: recompute posture of every ApplicationPath with an ACTIVE PathSegment whose circuit_id is this circuit"
          - "CASCADE link 3: set spof_flag = true on every Circuit that is an ACTIVE segment target inside a healthy leg of a path whose posture just became DEGRADED_NO_REDUNDANCY"
          - "CASCADE link 4: open (or attach to) an Incident anchored on this circuit; severity/impact_score are computed AFTER links 2-3 so spof_term and worst_healthy_legs read post-cascade values"
          - "sets last_incident_at when a new incident is opened; increments version by 1"
      - from: UP
        to: DEGRADED
        trigger: "POST /alarms with source_circuit_id and raw_severity MAJOR or MINOR that resolves to correlation_state ROOT"
        actor: system
        preconditions: ["alarm correlation_state == ROOT"]
        side_effects:
          - "same links 2-4 as UP -> DOWN, but leg health is unaffected (a DEGRADED circuit still counts as UP for calculations.path_posture_and_legs), so path posture stays PROTECTED unless another target is down"
          - "increments version by 1"
      - from: DEGRADED
        to: DOWN
        trigger: "POST /alarms with source_circuit_id and raw_severity CRITICAL that resolves to correlation_state ROOT"
        actor: system
        preconditions: ["alarm correlation_state == ROOT"]
        side_effects: ["links 2-4 as above; the open incident's severity ratchets to the stronger of the existing and newly computed severity"]
      - from: DOWN
        to: UP
        trigger: "POST /alarms/{id}/clear clearing the last uncleared ROOT alarm on this circuit"
        actor: system
        preconditions: ["no uncleared ROOT alarm remains on this circuit"]
        side_effects:
          - "recompute affected ApplicationPath posture and leg counts; clear spof_flag on circuits that are no longer sole surviving legs"
          - "increments version by 1"
      - from: DEGRADED
        to: UP
        trigger: "POST /alarms/{id}/clear clearing the last uncleared ROOT alarm on this circuit"
        actor: system
        preconditions: ["no uncleared ROOT alarm remains on this circuit"]
        side_effects: ["recompute affected ApplicationPath posture; increments version by 1"]

  - entity: Circuit
    dimension: chronic_state
    initial_state: NORMAL
    terminal_states: []
    note: "auto-transitions on every incident resolution via calculations.chronic_circuit_evaluation; REPLACEMENT_APPROVED is only reachable from CHRONIC through a VendorReview REPLACE decision."
    transitions:
      - from: NORMAL
        to: CHRONIC_CANDIDATE
        trigger: "POST /incidents/{id}/resolve"
        actor: system
        preconditions: ["fault_count_period >= CHRONIC_CANDIDATE_FAULTS (2) AND < CHRONIC_FAULTS (3)"]
        side_effects: ["increments version by 1"]
      - from: CHRONIC_CANDIDATE
        to: CHRONIC
        trigger: "POST /incidents/{id}/resolve"
        actor: system
        preconditions: ["fault_count_period >= CHRONIC_FAULTS (3)"]
        side_effects: ["increments Carrier.chronic_circuit_count by 1", "increments version by 1"]
      - from: CHRONIC_CANDIDATE
        to: NORMAL
        trigger: "POST /incidents/{id}/resolve (recompute after older incidents age past CHRONIC_WINDOW_DAYS)"
        actor: system
        preconditions: ["fault_count_period < CHRONIC_CANDIDATE_FAULTS (2)"]
        side_effects: ["increments version by 1"]
      - from: CHRONIC
        to: CHRONIC_CANDIDATE
        trigger: "POST /incidents/{id}/resolve (recompute after older incidents age past CHRONIC_WINDOW_DAYS)"
        actor: system
        preconditions: ["fault_count_period < CHRONIC_FAULTS (3) AND >= CHRONIC_CANDIDATE_FAULTS (2)"]
        side_effects: ["decrements Carrier.chronic_circuit_count by 1", "increments version by 1"]
      - from: CHRONIC
        to: REPLACEMENT_APPROVED
        trigger: "POST /vendor-reviews/{id}/decide with decision REPLACE"
        actor: system
        preconditions: ["circuit.carrier_id == review.carrier_id AND circuit.chronic_state == CHRONIC"]
        side_effects:
          - "CASCADE link 2: because the circuit is slated for replacement, every UpgradeOrder on this circuit whose state IN {DRAFT, SUBMITTED, APPROVED} moves to CANCELLED with cancel_reason 'SUPERSEDED_BY_REPLACEMENT'"
          - "CASCADE link 3: because those orders left the committed set, Carrier.committed_upgrade_mbps is reduced by the sum of their delta_mbps"
          - "increments version by 1"

  - entity: Circuit
    dimension: capacity_state
    initial_state: NORMAL
    terminal_states: []
    note: "threshold dimension driven by consecutive_high_readings; see calculations.capacity_threshold_evaluation."
    transitions:
      - from: NORMAL
        to: WATCH
        trigger: "POST /circuits/{id}/capacity-readings"
        actor: system
        preconditions: ["reading threshold_state == HIGH AND resulting consecutive_high_readings IN {1, 2}"]
        side_effects: ["increments version by 1"]
      - from: WATCH
        to: UPGRADE_REQUIRED
        trigger: "POST /circuits/{id}/capacity-readings"
        actor: system
        preconditions: ["resulting consecutive_high_readings >= CONSECUTIVE_HIGH_READINGS_FOR_UPGRADE (3)"]
        side_effects:
          - "CASCADE link 2: because capacity_state became UPGRADE_REQUIRED, an UpgradeOrder is auto-created in DRAFT with origin AUTO_THRESHOLD, created_by_user_id 'system', expedite false and target_bandwidth_mbps = the first BANDWIDTH_LADDER_MBPS value strictly greater than bandwidth_mbps; when no ladder value is greater, no order is created and capacity_state still becomes UPGRADE_REQUIRED"
          - "CASCADE link 3: because the new order is in the committed set, Carrier.committed_upgrade_mbps increases by the order's delta_mbps"
          - "increments version by 1"
      - from: WATCH
        to: NORMAL
        trigger: "POST /circuits/{id}/capacity-readings"
        actor: system
        preconditions: ["reading threshold_state == NORMAL (consecutive_high_readings resets to 0)"]
        side_effects: ["increments version by 1"]
      - from: UPGRADE_REQUIRED
        to: NORMAL
        trigger: "POST /circuits/{id}/capacity-readings"
        actor: system
        preconditions: ["reading threshold_state == NORMAL (consecutive_high_readings resets to 0)"]
        side_effects: ["existing UpgradeOrder rows are left untouched", "increments version by 1"]

  - entity: Incident
    dimension: response_state
    initial_state: DETECTED
    terminal_states: []
    note: "cyclic: RESOLVED returns to TRIAGED when a new ROOT alarm lands on the anchor circuit."
    transitions:
      - from: DETECTED
        to: TRIAGED
        trigger: "POST /incidents/{id}/response with target_response_state TRIAGED"
        actor: NocAnalyst
        preconditions: ["incident.response_state == DETECTED (else ERR_RESPONSE_SEQUENCE_INVALID)"]
        side_effects: ["sets triaged_at = clock now", "increments version by 1"]
      - from: TRIAGED
        to: MITIGATED
        trigger: "POST /incidents/{id}/response with target_response_state MITIGATED"
        actor: NocAnalyst
        preconditions: ["incident.response_state == TRIAGED (else ERR_RESPONSE_SEQUENCE_INVALID)"]
        side_effects:
          - "sets mitigated_at = clock now"
          - "de-escalates escalation_state L2 -> L1 and EXEC -> L2 (one step down, NONE and L1 unchanged)"
          - "increments version by 1"
      - from: MITIGATED
        to: RESOLVED
        trigger: "POST /incidents/{id}/resolve"
        actor: NocShiftLead
        preconditions:
          - "incident.response_state == MITIGATED (else ERR_RESPONSE_SEQUENCE_INVALID)"
          - "every Alarm with incident_id == incident.id has cleared_at set (else ERR_OPEN_ALARMS_PRESENT)"
          - "no CarrierTicket on this incident is in a state outside {CLOSED_RESTORED, CLOSED_NO_FAULT} (else ERR_CARRIER_TICKET_OPEN)"
        side_effects:
          - "sets resolved_at = clock now and escalation_state = NONE"
          - "recomputes Circuit.fault_count_period and drives the Circuit.chronic_state dimension"
          - "increments version by 1"
      - from: RESOLVED
        to: TRIAGED
        trigger: "POST /alarms creating a ROOT alarm on the incident's primary_circuit_id within INCIDENT_REOPEN_WINDOW_MINUTES (120) of resolved_at"
        actor: system
        preconditions: ["clock now - incident.resolved_at <= 120 minutes"]
        side_effects:
          - "sets resolved_at = null, increments reopen_count by 1, attaches the new alarm (alarm_count += 1) and ratchets severity"
          - "increments version by 1"
        note: "a ROOT alarm arriving more than 120 minutes after resolution opens a NEW Incident instead"

  - entity: Incident
    dimension: escalation_state
    initial_state: NONE
    terminal_states: []
    note: "parallel dimension: advances only through POST /incidents/{id}/escalate and de-escalates one step on mitigation; independent of response_state except that resolution forces NONE."
    transitions:
      - from: NONE
        to: L1
        trigger: "POST /incidents/{id}/escalate with target_escalation_state L1"
        actor: NocShiftLead
        preconditions:
          - "incident.response_state != RESOLVED (else ERR_INCIDENT_ALREADY_RESOLVED)"
          - "target is exactly one step above escalation_state (else ERR_ESCALATION_SEQUENCE_INVALID)"
        side_effects: ["increments version by 1"]
      - from: L1
        to: L2
        trigger: "POST /incidents/{id}/escalate with target_escalation_state L2"
        actor: NocShiftLead
        preconditions:
          - "clock now >= incident.escalation_due_at (else ERR_ESCALATION_PREMATURE)"
          - "incident.response_state != RESOLVED"
        side_effects: ["increments version by 1"]
      - from: L2
        to: EXEC
        trigger: "POST /incidents/{id}/escalate with target_escalation_state EXEC"
        actor: NocShiftLead
        preconditions:
          - "incident.severity IN {SEV1, SEV2} (else ERR_EXEC_ESCALATION_NOT_ALLOWED)"
          - "incident.response_state != RESOLVED"
        side_effects: ["increments version by 1"]
      - from: L2
        to: L1
        trigger: "POST /incidents/{id}/response with target_response_state MITIGATED"
        actor: system
        preconditions: ["escalation_state == L2"]
        side_effects: ["one-step de-escalation performed inside the mitigation transition"]
      - from: EXEC
        to: L2
        trigger: "POST /incidents/{id}/response with target_response_state MITIGATED"
        actor: system
        preconditions: ["escalation_state == EXEC"]
        side_effects: ["one-step de-escalation performed inside the mitigation transition"]

  - entity: CarrierTicket
    initial_state: OPEN
    terminal_states: [CLOSED_RESTORED, CLOSED_NO_FAULT]
    note: "cyclic: RESTORED_PENDING_CONFIRM -> REOPENED -> TESTING repeats whenever a soak fails."
    transitions:
      - from: OPEN
        to: TESTING
        trigger: "POST /carrier-tickets/{id}/test-results"
        actor: NocAnalyst
        preconditions: ["ticket.state IN {OPEN, REOPENED, TESTING, ESCALATED_T2, ESCALATED_T3} (else ERR_TICKET_STATE_INVALID)"]
        side_effects:
          - "creates the TestResult row; increments fail_test_count when outcome IN {FAIL, INCONCLUSIVE}"
          - "state becomes TESTING only from OPEN or REOPENED; ESCALATED_T2/ESCALATED_T3 keep their state"
          - "increments version by 1"
      - from: TESTING
        to: ESCALATED_T2
        trigger: "POST /carrier-tickets/{id}/escalate with target_tier 2"
        actor: NocShiftLead
        preconditions:
          - "ticket.state IN {TESTING, ESCALATED_T2} (else ERR_TICKET_STATE_INVALID)"
          - "target_tier == tier_level + 1 (else ERR_TIER_SEQUENCE_INVALID)"
          - "target_tier <= Carrier.escalation_tier_count (else ERR_TIER_CEILING_REACHED)"
          - "ticket.fail_test_count >= 1 (else ERR_TEST_EVIDENCE_MISSING)"
          - "clock now - tier_entered_at >= Carrier.tier_escalation_min_minutes (else ERR_TIER_DWELL_NOT_MET)"
        side_effects: ["sets tier_level = 2 and tier_entered_at = clock now", "increments version by 1"]
      - from: ESCALATED_T2
        to: ESCALATED_T3
        trigger: "POST /carrier-tickets/{id}/escalate with target_tier 3"
        actor: NocShiftLead
        preconditions: ["same preconditions as TESTING -> ESCALATED_T2 with target_tier 3"]
        side_effects: ["sets tier_level = 3 and tier_entered_at = clock now", "increments version by 1"]
      - from: TESTING
        to: RESTORED_PENDING_CONFIRM
        trigger: "POST /carrier-tickets/{id}/carrier-update with update RESTORED"
        actor: CarrierLiaison
        preconditions:
          - "ticket.state IN {OPEN, TESTING, ESCALATED_T2, ESCALATED_T3, REOPENED} (else ERR_TICKET_STATE_INVALID)"
          - "X-User-ID == ticket.carrier_id (else ERR_CARRIER_SCOPE_VIOLATION)"
          - "body restored_at > ticket.opened_at AND <= clock now (else ERR_TIMESTAMP_RANGE_INVALID)"
        side_effects:
          - "sets restored_at; recomputes excluded_minutes, restoration_minutes_carrier_clock and restoration_minutes_noc_clock per calculations.restoration_minutes_dual_clock"
          - "increments version by 1"
      - from: ESCALATED_T2
        to: RESTORED_PENDING_CONFIRM
        trigger: "POST /carrier-tickets/{id}/carrier-update with update RESTORED"
        actor: CarrierLiaison
        preconditions: ["same as TESTING -> RESTORED_PENDING_CONFIRM"]
        side_effects: ["same as TESTING -> RESTORED_PENDING_CONFIRM"]
      - from: OPEN
        to: CLOSED_NO_FAULT
        trigger: "POST /carrier-tickets/{id}/carrier-update with update NO_FAULT_FOUND"
        actor: CarrierLiaison
        preconditions:
          - "ticket.state IN {OPEN, TESTING} (else ERR_TICKET_STATE_INVALID)"
          - "ticket.fail_test_count == 0 (else ERR_TEST_EVIDENCE_CONTRADICTS_NO_FAULT)"
          - "X-User-ID == ticket.carrier_id"
        side_effects: ["terminal; no SlaCreditClaim is ever synthesized for this ticket", "increments version by 1"]
      - from: RESTORED_PENDING_CONFIRM
        to: CLOSED_RESTORED
        trigger: "POST /carrier-tickets/{id}/confirm-restoration with soak_passed true"
        actor: NocShiftLead
        preconditions:
          - "ticket.state == RESTORED_PENDING_CONFIRM (else ERR_TICKET_STATE_INVALID)"
          - "clock now - ticket.restored_at >= SOAK_MINUTES (30) (else ERR_SOAK_WINDOW_NOT_ELAPSED)"
          - "no uncleared ROOT alarm remains on ticket.circuit_id (else ERR_OPEN_ALARMS_PRESENT)"
        side_effects:
          - "sets confirmed_at = clock now and restoration_confirmed_by_user_id = X-User-ID"
          - "CASCADE link 1: because the ticket closed as restored, an AUTO_DRAFT SlaCreditClaim is synthesized in DRAFT with basis CARRIER_CLOCK when its computed credit_amount_cents > 0; no claim row is created when credit_amount_cents == 0"
          - "CASCADE link 2: because the DRAFT claim entered the open-exposure set, Carrier.open_credit_exposure_cents increases by credit_amount_cents"
          - "CASCADE link 3: because exposure reached Carrier.watchlist_exposure_threshold_cents, Carrier.watchlist_state flips ACTIVE -> WATCHLIST"
          - "increments version by 1"
      - from: RESTORED_PENDING_CONFIRM
        to: REOPENED
        trigger: "POST /carrier-tickets/{id}/confirm-restoration with soak_passed false"
        actor: NocShiftLead
        preconditions: ["ticket.state == RESTORED_PENDING_CONFIRM"]
        side_effects:
          - "increments reopen_count by 1; clears restored_at, excluded_minutes, restoration_minutes_carrier_clock and restoration_minutes_noc_clock back to null/0"
          - "no claim is synthesized"
          - "increments version by 1"
      - from: ESCALATED_T3
        to: RESTORED_PENDING_CONFIRM
        trigger: "POST /carrier-tickets/{id}/carrier-update with update RESTORED"
        actor: CarrierLiaison
        preconditions:
          - "same as TESTING -> RESTORED_PENDING_CONFIRM"
        side_effects:
          - "identical to TESTING -> RESTORED_PENDING_CONFIRM; tier_level is retained so the credit claim records which carrier tier restored the circuit"
      - from: TESTING
        to: CLOSED_NO_FAULT
        trigger: "POST /carrier-tickets/{id}/carrier-update with update NO_FAULT_FOUND"
        actor: CarrierLiaison
        preconditions:
          - "ticket.state IN {OPEN, TESTING} (else ERR_TICKET_STATE_INVALID)"
          - "ticket.fail_test_count == 0 (else ERR_TEST_EVIDENCE_CONTRADICTS_NO_FAULT)"
          - "X-User-ID == ticket.carrier_id (else ERR_CARRIER_SCOPE_VIOLATION)"
        side_effects:
          - "closes the ticket as CLOSED_NO_FAULT; no SlaCreditClaim is ever synthesised from a no-fault closure"
          - "leaves the incident and the circuit's operational_state untouched (the fault, if real, is internal)"
      - from: REOPENED
        to: TESTING
        trigger: "POST /carrier-tickets/{id}/test-results"
        actor: NocAnalyst
        preconditions: ["ticket.state == REOPENED"]
        side_effects: ["creates the TestResult row; increments version by 1"]

  - entity: SlaCreditClaim
    initial_state: DRAFT
    terminal_states: [PAID, WITHDRAWN]
    note: "cyclic: REJECTED -> SUBMITTED resubmission loop with revision_count as the loop counter."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /sla-credit-claims/{id}/submit"
        actor: VendorManager
        preconditions:
          - "claim.state IN {DRAFT, REJECTED} (else ERR_CLAIM_STATE_INVALID)"
          - "parent CarrierTicket.state == CLOSED_RESTORED (else ERR_TICKET_NOT_CLOSED)"
          - "parent Incident.response_state IN {MITIGATED, RESOLVED} (else ERR_INCIDENT_NOT_MITIGATED)"
          - "X-User-ID != parent CarrierTicket.restoration_confirmed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "claim.credit_amount_cents > 0 (else ERR_NO_SLA_BREACH)"
          - "claim.credit_amount_cents >= Carrier.min_claim_amount_cents (else ERR_CLAIM_BELOW_MINIMUM)"
        side_effects:
          - "sets submitted_by_user_id = X-User-ID and submitted_at = clock now"
          - "when a body basis is supplied and differs from claim.basis, recomputes breach_minutes, breach_hours and credit_amount_cents from the new basis and adjusts Carrier.open_credit_exposure_cents by the delta"
          - "increments version by 1"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /sla-credit-claims/{id}/submit"
        actor: VendorManager
        preconditions: ["same as DRAFT -> SUBMITTED"]
        side_effects:
          - "increments revision_count by 1; clears rejection_reason"
          - "re-adds credit_amount_cents to Carrier.open_credit_exposure_cents (a REJECTED claim is outside the open set)"
          - "increments version by 1"
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /sla-credit-claims/{id}/carrier-response with response ACKNOWLEDGED"
        actor: CarrierLiaison
        preconditions:
          - "claim.state == SUBMITTED (else ERR_CLAIM_STATE_INVALID)"
          - "X-User-ID == claim.carrier_id (else ERR_CARRIER_SCOPE_VIOLATION)"
        side_effects: ["exposure unchanged (ACKNOWLEDGED remains in the open set)", "increments version by 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /sla-credit-claims/{id}/carrier-response with response REJECTED"
        actor: CarrierLiaison
        preconditions:
          - "claim.state == SUBMITTED"
          - "body rejection_reason is present and non-empty (else ERR_INVALID_REQUEST)"
          - "X-User-ID == claim.carrier_id"
        side_effects:
          - "sets rejection_reason"
          - "decreases Carrier.open_credit_exposure_cents by credit_amount_cents and re-evaluates watchlist_state"
          - "increments version by 1"
      - from: ACKNOWLEDGED
        to: PAID
        trigger: "POST /sla-credit-claims/{id}/settle"
        actor: VendorManager
        preconditions:
          - "claim.state == ACKNOWLEDGED (else ERR_CLAIM_STATE_INVALID)"
          - "body paid_amount_cents == claim.credit_amount_cents (else ERR_CREDIT_AMOUNT_MISMATCH)"
        side_effects:
          - "sets paid_amount_cents; decreases Carrier.open_credit_exposure_cents by credit_amount_cents and re-evaluates watchlist_state (PAID leaves the open set)"
          - "increments version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /sla-credit-claims/{id}/withdraw"
        actor: VendorManager
        preconditions: ["claim.state IN {DRAFT, SUBMITTED, REJECTED} (else ERR_CLAIM_STATE_INVALID)"]
        side_effects:
          - "COMPENSATION: decreases Carrier.open_credit_exposure_cents by exactly the credit_amount_cents that was added when the claim entered the open set, restoring the invariant open_credit_exposure_cents == sum(credit_amount_cents WHERE state IN {DRAFT, SUBMITTED, ACKNOWLEDGED})"
          - "re-evaluates Carrier.watchlist_state (WATCHLIST -> ACTIVE when exposure drops below the threshold)"
          - "increments version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /sla-credit-claims/{id}/withdraw"
        actor: VendorManager
        preconditions: ["claim.state IN {DRAFT, SUBMITTED, REJECTED}"]
        side_effects: ["same compensation as DRAFT -> WITHDRAWN"]
      - from: REJECTED
        to: WITHDRAWN
        trigger: "POST /sla-credit-claims/{id}/withdraw"
        actor: VendorManager
        preconditions: ["claim.state IN {DRAFT, SUBMITTED, REJECTED}"]
        side_effects: ["no exposure change (a REJECTED claim already left the open set)", "increments version by 1"]

  - entity: MaintenanceWindow
    initial_state: PROPOSED
    terminal_states: [REJECTED, COMPLETED, CANCELLED]
    note: "branching review then a linear execution leg; overlap exclusivity is enforced at review time, not at creation."
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /maintenance-windows/{id}/review with decision APPROVED"
        actor: NocShiftLead
        preconditions:
          - "window.state == PROPOSED (else ERR_WINDOW_STATE_INVALID)"
          - "SAFETY: when projected_healthy_legs <= min_surviving_legs for any ApplicationPath with an ACTIVE segment on this circuit (projected_healthy_legs defined in validations[priority=70]), body risk_acknowledged must be true (else ERR_REDUNDANCY_RISK_UNACKNOWLEDGED)"
          - "TEMPORAL: no other MaintenanceWindow on the same circuit_id with state IN {APPROVED, IN_PROGRESS} conflicts under the buffered-interval rule in validations[priority=80] (else ERR_WINDOW_OVERLAP)"
        side_effects: ["sets approved_by_user_id and risk_acknowledged", "increments version by 1"]
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /maintenance-windows/{id}/review with decision REJECTED"
        actor: NocShiftLead
        preconditions: ["window.state == PROPOSED"]
        side_effects: ["sets approved_by_user_id as the reviewer of record", "increments version by 1"]
      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /maintenance-windows/{id}/state with target_state IN_PROGRESS"
        actor: NocShiftLead
        preconditions:
          - "window.state == APPROVED (else ERR_WINDOW_STATE_INVALID)"
          - "clock now >= window_start AND clock now < window_end (else ERR_WINDOW_NOT_IN_EFFECT)"
        side_effects:
          - "captures monitoring_state_before_start = Circuit.monitoring_state; when suppresses_monitoring is true sets Circuit.monitoring_state = MAINTENANCE_SUPPRESSED"
          - "increments Circuit.version by 1 and window version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /maintenance-windows/{id}/state with target_state COMPLETED"
        actor: NocShiftLead
        preconditions: ["window.state == IN_PROGRESS (else ERR_WINDOW_STATE_INVALID)"]
        side_effects:
          - "restores Circuit.monitoring_state = monitoring_state_before_start"
          - "increments Circuit.version by 1 and window version by 1"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /maintenance-windows/{id}/state with target_state CANCELLED"
        actor: NocShiftLead
        preconditions: ["window.state IN {PROPOSED, APPROVED} (else ERR_WINDOW_STATE_INVALID)"]
        side_effects: ["increments version by 1"]
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /maintenance-windows/{id}/state with target_state CANCELLED"
        actor: NocShiftLead
        preconditions: ["window.state IN {PROPOSED, APPROVED}"]
        side_effects:
          - "the window leaves the exclusion set, so any CarrierTicket whose restoration clocks were computed against it keeps its stored values (clocks are snapshotted at carrier-update time, never retro-adjusted)"
          - "increments version by 1"

  - entity: FailoverTest
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /failover-tests/{id}/start"
        actor: NocAnalyst
        preconditions:
          - "test.state == SCHEDULED (else ERR_TEST_STATE_INVALID)"
          - "clock now >= scheduled_start AND clock now < scheduled_end (else ERR_TEST_WINDOW_NOT_IN_EFFECT)"
          - "ApplicationPath.posture == PROTECTED (else ERR_PATH_NOT_PROTECTED)"
          - "no MaintenanceWindow with state IN {APPROVED, IN_PROGRESS} covering clock now exists on any circuit reachable from the path's ACTIVE segments (else ERR_MAINTENANCE_IN_EFFECT)"
        side_effects: ["increments version by 1"]
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /failover-tests/{id}/record-result with outcome PASSED"
        actor: NocShiftLead
        preconditions:
          - "test.state == IN_PROGRESS (else ERR_TEST_STATE_INVALID)"
          - "body surviving_leg_count >= ApplicationPath.min_surviving_legs (else ERR_FAILOVER_RESULT_INCONSISTENT)"
        side_effects: ["sets surviving_leg_count and attested_by_user_id", "increments version by 1"]
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /failover-tests/{id}/record-result with outcome FAILED"
        actor: NocShiftLead
        preconditions:
          - "test.state == IN_PROGRESS"
          - "body surviving_leg_count < ApplicationPath.min_surviving_legs (else ERR_FAILOVER_RESULT_INCONSISTENT)"
        side_effects:
          - "sets surviving_leg_count and attested_by_user_id"
          - "sets ApplicationPath.protection_scheme unchanged but marks every Circuit reachable from the path's ACTIVE segments in legs other than tested_leg_group with spof_flag = true"
          - "increments version by 1"
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /failover-tests/{id}/record-result with outcome ABORTED"
        actor: NocShiftLead
        preconditions: ["test.state IN {SCHEDULED, IN_PROGRESS}"]
        side_effects: ["sets attested_by_user_id; surviving_leg_count stays null", "increments version by 1"]
      - from: IN_PROGRESS
        to: ABORTED
        trigger: "POST /failover-tests/{id}/record-result with outcome ABORTED"
        actor: NocShiftLead
        preconditions: ["test.state IN {SCHEDULED, IN_PROGRESS}"]
        side_effects: ["sets attested_by_user_id", "increments version by 1"]

  - entity: UpgradeOrder
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /upgrade-orders/{id}/submit"
        actor: CapacityPlanner
        preconditions:
          - "order.state == DRAFT (else ERR_ORDER_STATE_INVALID)"
          - "Circuit.chronic_state != REPLACEMENT_APPROVED (else ERR_CIRCUIT_SLATED_FOR_REPLACEMENT)"
        side_effects: ["exposure ledger unchanged (SUBMITTED stays in the committed set)", "increments version by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /upgrade-orders/{id}/approve"
        actor: VendorManager
        preconditions:
          - "order.state == SUBMITTED (else ERR_ORDER_STATE_INVALID)"
          - "X-User-ID != order.created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["sets approved_by_user_id", "increments version by 1"]
      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /upgrade-orders/{id}/state with target_state IN_PROGRESS"
        actor: CapacityPlanner
        preconditions: ["order.state == APPROVED (else ERR_ORDER_STATE_INVALID)"]
        side_effects: ["increments version by 1"]
        note: "driven by POST /upgrade-orders/{id}/state with target_state IN_PROGRESS"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /upgrade-orders/{id}/state with target_state COMPLETED"
        actor: CapacityPlanner
        preconditions: ["order.state == IN_PROGRESS (else ERR_ORDER_STATE_INVALID)"]
        side_effects:
          - "sets Circuit.bandwidth_mbps = target_bandwidth_mbps, resets consecutive_high_readings to 0 and capacity_state to NORMAL"
          - "decreases Carrier.committed_upgrade_mbps by delta_mbps (COMPLETED leaves the committed set)"
          - "increments Circuit.version by 1 and order version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /upgrade-orders/{id}/cancel"
        actor: CapacityPlanner
        preconditions: ["order.state IN {DRAFT, SUBMITTED, APPROVED} (else ERR_ORDER_STATE_INVALID)"]
        side_effects:
          - "COMPENSATION: decreases Carrier.committed_upgrade_mbps by exactly the delta_mbps added at creation, restoring the invariant committed_upgrade_mbps == sum(delta_mbps WHERE state IN {DRAFT, SUBMITTED, APPROVED, IN_PROGRESS})"
          - "sets cancel_reason; increments version by 1"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /upgrade-orders/{id}/cancel"
        actor: CapacityPlanner
        preconditions: ["order.state IN {DRAFT, SUBMITTED, APPROVED}"]
        side_effects: ["same compensation as DRAFT -> CANCELLED"]
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /vendor-reviews/{id}/decide with decision REPLACE (cascade) or POST /upgrade-orders/{id}/cancel"
        actor: system
        preconditions: ["order.state IN {DRAFT, SUBMITTED, APPROVED}"]
        side_effects: ["same compensation as DRAFT -> CANCELLED, with cancel_reason 'SUPERSEDED_BY_REPLACEMENT' when driven by the VendorReview cascade"]

  - entity: VendorReview
    initial_state: PENDING
    terminal_states: [RETAIN, REMEDIATION_PLAN, REPLACE]
    note: "branching fork with divergent side-effect sets per branch: RETAIN mutates nothing else, REMEDIATION_PLAN only records the decision, REPLACE drives the chronic-circuit cascade."
    transitions:
      - from: PENDING
        to: RETAIN
        trigger: "POST /vendor-reviews/{id}/decide with decision RETAIN"
        actor: VendorManager
        preconditions:
          - "review.decision == PENDING (else ERR_REVIEW_ALREADY_DECIDED)"
          - "review.net_performance_score >= REPLACE_SCORE_MAX (60) (else ERR_RETAIN_NOT_JUSTIFIED)"
        side_effects: ["sets decided_by_user_id and justification", "increments version by 1"]
      - from: PENDING
        to: REMEDIATION_PLAN
        trigger: "POST /vendor-reviews/{id}/decide with decision REMEDIATION_PLAN"
        actor: VendorManager
        preconditions: ["review.decision == PENDING"]
        side_effects: ["sets decided_by_user_id and justification", "increments version by 1"]
      - from: PENDING
        to: REPLACE
        trigger: "POST /vendor-reviews/{id}/decide with decision REPLACE"
        actor: VendorManager
        preconditions:
          - "review.decision == PENDING"
          - "review.net_performance_score < REPLACE_SCORE_MAX (60) AND review.chronic_circuit_count >= 1 (else ERR_REPLACEMENT_NOT_JUSTIFIED)"
        side_effects:
          - "CASCADE link 1: every Circuit of this carrier with chronic_state CHRONIC moves to REPLACEMENT_APPROVED"
          - "CASCADE link 2: because those circuits are slated for replacement, their UpgradeOrder rows in {DRAFT, SUBMITTED, APPROVED} move to CANCELLED with cancel_reason 'SUPERSEDED_BY_REPLACEMENT'"
          - "CASCADE link 3: because those orders left the committed set, Carrier.committed_upgrade_mbps decreases by the sum of their delta_mbps"
          - "sets decided_by_user_id and justification; increments version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: manual-claim-create-stale-ticket
    parent_entity: CarrierTicket
    write_endpoint: "POST /sla-credit-claims"
    occ_field: "expected_carrier_ticket_version"
    description: |
      Creating a MANUAL SlaCreditClaim against a CarrierTicket whose version has advanced since the
      client last observed it is rejected. A manual claim legitimately supersedes a withdrawn
      AUTO_DRAFT claim on the same ticket, so the operation is not blocked by any state precondition;
      the stale expected_carrier_ticket_version is what the server rejects.
    error_id: ERR_STALE_CARRIER_TICKET_VERSION
    http_status: 412
  - rule_id: upgrade-order-create-stale-circuit
    parent_entity: Circuit
    write_endpoint: "POST /upgrade-orders"
    occ_field: "expected_circuit_version"
    description: |
      Creating a MANUAL UpgradeOrder against a Circuit whose version has advanced since the client
      last observed it is rejected. A manual order legitimately supersedes a cancelled AUTO_THRESHOLD
      order on the same circuit, so no state precondition covers it; the stale expected_circuit_version
      is what the server rejects.
    error_id: ERR_STALE_CIRCUIT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: alarm_correlation_assignment
    trigger: "POST /alarms, before any state cascade"
    algorithm: constraint_propagation
    formula: |
      # SELECTOR (eligibility -> ranking -> tie-break -> empty-set fallback), all over entity fields.
      if new_alarm.source_device_id IS NOT NULL:
          dev = Device[new_alarm.source_device_id]
          if dev.primary_uplink_circuit_id IS NULL:
              candidates = []                       # no uplink edge -> nothing can suppress it
          else:
              candidates = [ P in Alarm
                             WHERE P.source_circuit_id == dev.primary_uplink_circuit_id
                               AND P.correlation_state == 'ROOT'
                               AND P.cleared_at IS NULL
                               AND P.raised_at <= new_alarm.raised_at
                               AND (new_alarm.raised_at - P.raised_at) <= CORRELATION_WINDOW_SECONDS ]
      else:                                          # circuit-sourced alarm: duplicate suppression
          candidates = [ P in Alarm
                         WHERE P.source_circuit_id == new_alarm.source_circuit_id
                           AND P.correlation_state == 'ROOT'
                           AND P.cleared_at IS NULL
                           AND P.raised_at <= new_alarm.raised_at
                           AND (new_alarm.raised_at - P.raised_at) <= CORRELATION_WINDOW_SECONDS ]

      # RANKING: raised_at DESC (most recent qualifying root wins).
      # TIE-BREAK: created_at ASC (never `id`).
      if candidates is EMPTY:                        # EMPTY-SET FALLBACK
          new_alarm.correlation_state = 'ROOT'
          new_alarm.correlation_parent_alarm_id = NULL
      else:
          parent = sort(candidates, key = (raised_at DESC, created_at ASC))[0]
          new_alarm.correlation_state = 'SUPPRESSED'
          new_alarm.correlation_parent_alarm_id = parent.id
          # suppressed noise never OPENS an incident, but it is filed under the parent's incident
          # so Incident.alarm_count reflects the noise volume; severity is never re-classified downward.
          new_alarm.incident_id = parent.incident_id
    input_set: "Alarm rows with correlation_state ROOT and cleared_at IS NULL only; CLEARED and SUPPRESSED alarms are never correlation parents"
    constants:
      CORRELATION_WINDOW_SECONDS: 900
    precision: "raised_at comparisons at whole-second resolution; window bound is inclusive (delta == 900s still suppresses)"

  - name: path_posture_and_legs
    trigger: "any change to Circuit.operational_state, Device.operational_state, Circuit.monitoring_state, Device.monitoring_state, or the ACTIVE PathSegment set of the path"
    algorithm: constraint_propagation
    formula: |
      active = [ S in PathSegment WHERE S.application_path_id == path.id AND S.segment_state == 'ACTIVE' ]
      legs   = distinct(S.leg_group for S in active)
      active_leg_count = count(legs)

      def target_up(S):
          if S.circuit_id IS NOT NULL: return Circuit[S.circuit_id].operational_state != 'DOWN'   # DEGRADED still counts as up
          else:                        return Device[S.device_id].operational_state == 'UP'

      def target_monitored(S):
          if S.circuit_id IS NOT NULL: return Circuit[S.circuit_id].monitoring_state == 'MONITORED'
          else:                        return Device[S.device_id].monitoring_state == 'MONITORED'

      healthy_leg_count = count(L in legs WHERE every S in active with S.leg_group == L satisfies target_up(S))
      monitored_segment_count = count(S in active WHERE target_monitored(S))

      # POSTURE — branches evaluated strictly top-to-bottom, first match wins.
      if active_leg_count == 0:                              posture = 'PROTECTED'
      elif healthy_leg_count == 0:                            posture = 'DOWN'
      elif healthy_leg_count < path.min_surviving_legs:       posture = 'DOWN'
      elif healthy_leg_count == active_leg_count:             posture = 'PROTECTED'
      elif healthy_leg_count > path.min_surviving_legs:       posture = 'DEGRADED_REDUNDANT'
      else:                                                   posture = 'DEGRADED_NO_REDUNDANCY'

      # SPOF re-derivation (derived-field reconciliation, recomputed in full, never incrementally):
      # Circuit.spof_flag = TRUE iff there exists a path with posture == 'DEGRADED_NO_REDUNDANCY'
      # having an ACTIVE segment with circuit_id == circuit.id inside a leg L where every ACTIVE
      # segment of L satisfies target_up(); otherwise FALSE.
    input_set: "ACTIVE PathSegment rows only; RETIRED segments are excluded from every count and from SPOF derivation"
    constants: {}
    precision: "integer counts; a path with zero ACTIVE segments is PROTECTED with all counts 0"

  - name: incident_severity_classification
    trigger: "Incident creation cascade (link 4 of POST /alarms) and every subsequent alarm attachment; runs AFTER path posture and spof_flag have been recomputed"
    algorithm: weighted_scoring
    formula: |
      affected_paths = [ P in ApplicationPath
                         WHERE EXISTS S in PathSegment (S.application_path_id == P.id
                                                        AND S.segment_state == 'ACTIVE'
                                                        AND S.circuit_id == incident.primary_circuit_id) ]
      tier_max = max(TIER_WEIGHT[P.service_tier] for P in affected_paths) if affected_paths else 0
      path_count_term = min(count(affected_paths), 5) * 2
      worst_healthy_legs = min(P.healthy_leg_count for P in affected_paths) if affected_paths else 99
      redundancy_term = 8 if worst_healthy_legs == 0 else (4 if worst_healthy_legs == 1 else 0)
      spof_term = 3 if Circuit[incident.primary_circuit_id].spof_flag else 0

      impact_score = tier_max * 10 + path_count_term + redundancy_term + spof_term

      # TIERED SELECTION on impact_score, inclusive lower bounds.
      severity = 'SEV1' if impact_score >= 50
            else 'SEV2' if impact_score >= 30
            else 'SEV3' if impact_score >= 12
            else 'SEV4'

      # RATCHET on attachment to an already-open incident: SEVERITY_RANK = {SEV1:1, SEV2:2, SEV3:3, SEV4:4};
      # stored severity = the value with the LOWER rank between the stored and the newly computed one.
      response_due_at   = incident.detected_at + RESPONSE_MINUTES[severity] minutes
      escalation_due_at = incident.detected_at + ESCALATION_MINUTES[severity] minutes
    input_set: "ApplicationPath rows reachable through ACTIVE PathSegment rows on the incident's primary circuit; device-only segments never make a path 'affected'"
    constants:
      TIER_WEIGHT: { GOLD: 4, SILVER: 2, BRONZE: 1 }
      RESPONSE_MINUTES: { SEV1: 15, SEV2: 30, SEV3: 120, SEV4: 480 }
      ESCALATION_MINUTES: { SEV1: 30, SEV2: 60, SEV3: 240, SEV4: 960 }
    precision: "impact_score is an integer; response_due_at / escalation_due_at are ISO 8601 UTC with three fractional digits"

  - name: restoration_minutes_dual_clock
    trigger: "POST /carrier-tickets/{id}/carrier-update with update RESTORED (values snapshotted at that instant and never retro-adjusted)"
    algorithm: interval_merge
    formula: |
      # NOC clock: wall-to-wall from customer-visible detection, no exclusions.
      noc_minutes = (ticket.restored_at - incident.detected_at) in minutes

      # CARRIER clock: carrier-facing duration minus contractually excluded carrier maintenance.
      raw_minutes = (ticket.restored_at - ticket.opened_at) in minutes
      windows = [ W in MaintenanceWindow
                  WHERE W.circuit_id == ticket.circuit_id
                    AND W.origin == 'CARRIER_NOTIFIED'
                    AND W.state IN {'APPROVED', 'IN_PROGRESS', 'COMPLETED'} ]
      # STEP 1 merge the window intervals into a disjoint union (half-open [window_start, window_end),
      #        sorted by window_start ASC, tie-break created_at ASC; touching intervals merge).
      # STEP 2 intersect the merged union with the half-open [ticket.opened_at, ticket.restored_at).
      # STEP 3 sum the intersection lengths -> excluded_minutes. Order 1-2-3 is fixed.
      excluded_minutes = sum(len(I ∩ [opened_at, restored_at)) for I in merge(windows))
      carrier_minutes = raw_minutes - excluded_minutes
    input_set: "CARRIER_NOTIFIED windows in APPROVED / IN_PROGRESS / COMPLETED only; PROPOSED, REJECTED, CANCELLED windows and every INTERNAL_CHANGE window are excluded"
    constants: {}
    precision: "2 decimal places, round_half_up, on both outputs"
    variants:
      - name: noc_clock
        when: "SlaCreditClaim.basis == 'NOC_CLOCK'; also always stored on CarrierTicket.restoration_minutes_noc_clock"
        difference: "measures from Incident.detected_at (monitoring detection) to restored_at and applies no maintenance exclusion, so it is >= the carrier clock whenever the ticket was opened after detection or any carrier window overlapped the outage"
      - name: carrier_clock
        when: "SlaCreditClaim.basis == 'CARRIER_CLOCK' (default, and the basis of every AUTO_DRAFT claim); also always stored on CarrierTicket.restoration_minutes_carrier_clock"
        difference: "measures from ticket.opened_at (carrier notification) to restored_at and subtracts excluded_minutes for approved carrier maintenance, producing a smaller breach and therefore a smaller credit for identical inputs"

  - name: sla_credit_amount
    trigger: "AUTO_DRAFT claim synthesis inside POST /carrier-tickets/{id}/confirm-restoration, POST /sla-credit-claims, and every POST /sla-credit-claims/{id}/submit that supplies a different basis"
    algorithm: tiered_pricing
    formula: |
      sla_target_minutes = Carrier.sla_restore_minutes_critical if Incident.severity IN {'SEV1','SEV2'}
                           else Carrier.sla_restore_minutes_standard
      restoration = ticket.restoration_minutes_carrier_clock if claim.basis == 'CARRIER_CLOCK'
                    else ticket.restoration_minutes_noc_clock
      breach_minutes = max(0, restoration - sla_target_minutes)
      breach_hours   = 0 if breach_minutes == 0 else ceil(breach_minutes / 60)
      credit_pct     = min(Carrier.credit_pct_per_breach_hour * breach_hours, Carrier.credit_pct_cap)

      lines = affected_paths(ticket.circuit_id)          # same definition as incident_severity_classification
      W = sum(TIER_WEIGHT[P.service_tier] for P in lines)

      # ROUNDING ORDER IS PINNED: round EACH path line to whole cents first, THEN sum the lines.
      # "sum the unrounded shares then round once" is explicitly NOT the rule and yields a different total.
      if W == 0:                                        # EMPTY-SET branch: no path lines at all
          line_total = round_half_up(Circuit.mrc_cents * credit_pct / 100)
      else:
          line_total = sum( round_half_up(Circuit.mrc_cents * (TIER_WEIGHT[P.service_tier] / W) * credit_pct / 100)
                            for P in lines )            # iteration order created_at ASC; sum is order-independent
      cap_cents = round_half_up(Circuit.mrc_cents * Carrier.credit_pct_cap / 100)
      credit_amount_cents = min(line_total, cap_cents)
    input_set: "the ticket's own circuit MRC plus every ApplicationPath reachable through an ACTIVE PathSegment on that circuit; RETIRED segments contribute no line"
    constants:
      TIER_WEIGHT: { GOLD: 4, SILVER: 2, BRONZE: 1 }
    precision: "whole cents; round_half_up applied per line before summation, and once more when computing cap_cents"

  - name: path_availability_score
    trigger: "GET /application-paths/{id}/availability"
    algorithm: interval_merge
    formula: |
      period = [from_iso8601, to_iso8601)                        # half-open, both supplied by the caller
      period_minutes = (to - from) in minutes
      active = ACTIVE PathSegment rows of the path

      def down_intervals(S):                                    # outage evidence = ROOT alarms only
          alarms = [ A in Alarm WHERE A.correlation_state IN {'ROOT','CLEARED'}
                                  AND A.correlation_parent_alarm_id IS NULL
                                  AND A.raw_severity == 'CRITICAL'
                                  AND ((S.circuit_id IS NOT NULL AND A.source_circuit_id == S.circuit_id)
                                       OR (S.device_id IS NOT NULL AND A.source_device_id == S.device_id)) ]
          return [ [max(A.raised_at, from), min(coalesce(A.cleared_at, clock_now), to)) for A in alarms
                   if that interval is non-empty ]

      leg_down[L] = merge(union of down_intervals(S) for S in active with S.leg_group == L)   # disjoint union
      leg_down_minutes[L] = sum(len(I) for I in leg_down[L])
    input_set: "ROOT (or cleared root) CRITICAL alarms whose interval intersects the period; SUPPRESSED alarms and non-CRITICAL alarms never count as downtime"
    constants: {}
    precision: "availability_pct rounded to 3 decimal places, round_half_up; minute quantities to 2 decimal places"
    variants:
      - name: intersection_basis
        when: "GET /application-paths/{id}/availability?basis=INTERSECTION"
        difference: "path_down_minutes = total length of the INTERSECTION of every leg's merged down union (the path counts as down only over instants covered by an outage on every leg); availability_pct = round_half_up(100 * (1 - path_down_minutes / period_minutes), 3)"
      - name: best_leg_basis
        when: "GET /application-paths/{id}/availability?basis=BEST_LEG"
        difference: "path_down_minutes = min over legs of leg_down_minutes[L] (each leg is scored independently and the healthiest leg's total is attributed to the path, ignoring whether the outages overlap in time); for non-overlapping leg outages this yields a strictly larger path_down_minutes than INTERSECTION on identical data"

  - name: capacity_threshold_evaluation
    trigger: "POST /circuits/{id}/capacity-readings"
    algorithm: threshold
    formula: |
      threshold_state = 'HIGH' if reading.utilization_pct >= HIGH_UTILIZATION_PCT else 'NORMAL'
      # readings are strictly ordered: sample_at must exceed the circuit's current latest sample_at,
      # so the accumulator never needs to re-sort history.
      consecutive_high_readings = (circuit.consecutive_high_readings + 1) if threshold_state == 'HIGH' else 0

      capacity_state = 'UPGRADE_REQUIRED' if consecutive_high_readings >= CONSECUTIVE_HIGH_READINGS_FOR_UPGRADE
                  else 'WATCH'            if consecutive_high_readings >= 1
                  else 'NORMAL'

      if capacity_state == 'UPGRADE_REQUIRED' and previous capacity_state != 'UPGRADE_REQUIRED':
          ladder = [ B in BANDWIDTH_LADDER_MBPS WHERE B > circuit.bandwidth_mbps ]     # eligibility filter
          if ladder is EMPTY:                                                          # fallback: nothing to order
              no UpgradeOrder is created
          else:
              target = min(ladder)                                                     # ranking: lowest qualifying rung
              auto-create UpgradeOrder(origin='AUTO_THRESHOLD', state='DRAFT', expedite=false,
                                       target_bandwidth_mbps=target, created_by_user_id='system')
    input_set: "the single incoming reading plus the circuit's stored accumulator; historical rows are never re-scanned"
    constants:
      HIGH_UTILIZATION_PCT: 80.00
      CONSECUTIVE_HIGH_READINGS_FOR_UPGRADE: 3
      BANDWIDTH_LADDER_MBPS: [100, 200, 300, 500, 1000, 10000]
    precision: "utilization_pct compared at 2 decimal places; the threshold is inclusive (>=), so exactly 80.00 is HIGH and 79.99 is NORMAL"

  - name: upgrade_order_cost
    trigger: "UpgradeOrder creation (POST /upgrade-orders and the AUTO_THRESHOLD cascade)"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED and looks circular if read carelessly: the expedite tier is keyed on
      # subtotal_cents, NOT on total_cost_cents, and the fee is computed strictly after tier selection.
      # STEP 1
      delta_mbps     = target_bandwidth_mbps - Circuit.bandwidth_mbps
      # STEP 2
      subtotal_cents = BASE_INSTALL_CENTS + delta_mbps * PER_MBPS_CENTS
      # STEP 3  tier lookup on subtotal_cents (half-open bands, inclusive lower bound)
      tier_pct = 0.25 if subtotal_cents < 500000
            else 0.15 if subtotal_cents < 1500000
            else 0.08
      # STEP 4
      expedite_fee_cents = round_half_up(subtotal_cents * tier_pct) if expedite else 0
      # STEP 5
      total_cost_cents = subtotal_cents + expedite_fee_cents
      # total_cost_cents is never fed back into STEP 3.
    input_set: "the circuit's bandwidth_mbps at creation time; later completed upgrades do not restate earlier orders"
    constants:
      BASE_INSTALL_CENTS: 250000
      PER_MBPS_CENTS: 900
    precision: "whole cents, round_half_up on the fee only"

  - name: chronic_circuit_evaluation
    trigger: "POST /incidents/{id}/resolve"
    algorithm: aggregation
    formula: |
      cutoff = clock_now - CHRONIC_WINDOW_DAYS days                     # inclusive lower bound
      fault_count_period = count( I in Incident WHERE I.primary_circuit_id == circuit.id
                                                  AND I.response_state == 'RESOLVED'
                                                  AND I.resolved_at >= cutoff )
      chronic_state = 'CHRONIC'            if fault_count_period >= CHRONIC_FAULTS
                 else 'CHRONIC_CANDIDATE'  if fault_count_period >= CHRONIC_CANDIDATE_FAULTS
                 else 'NORMAL'
      # REPLACEMENT_APPROVED is sticky: once set it is never recomputed by this rule.
      Carrier.chronic_circuit_count = count(C in Circuit WHERE C.carrier_id == carrier.id
                                                          AND C.chronic_state IN {'CHRONIC','REPLACEMENT_APPROVED'})
    input_set: "RESOLVED incidents only, anchored on this circuit, with resolved_at at or after the cutoff; reopened incidents (resolved_at reset to null) drop out of the count"
    constants:
      CHRONIC_WINDOW_DAYS: 90
      CHRONIC_CANDIDATE_FAULTS: 2
      CHRONIC_FAULTS: 3
    precision: "integer counts; the cutoff boundary is inclusive (resolved_at exactly at cutoff still counts)"

  - name: vendor_review_score
    trigger: "POST /vendor-reviews"
    algorithm: weighted_scoring
    formula: |
      claims = [ C in SlaCreditClaim WHERE C.carrier_id == carrier.id
                                       AND C.state IN {'ACKNOWLEDGED','PAID'}
                                       AND C.submitted_at >= period_start AND C.submitted_at < period_end ]
      total_credit_cents = sum(C.credit_amount_cents for C in claims)
      total_mrc_cents    = sum(X.mrc_cents for X in Circuit WHERE X.carrier_id == carrier.id
                                                             AND X.created_at < period_end)
      credit_ratio = 0.0 if total_mrc_cents == 0 else round_half_up(total_credit_cents / total_mrc_cents, 4)

      tickets = [ T in CarrierTicket WHERE T.carrier_id == carrier.id AND T.state == 'CLOSED_RESTORED'
                                       AND T.confirmed_at >= period_start AND T.confirmed_at < period_end ]
      mttr_minutes = 0.00 if tickets is EMPTY
                     else round_half_up(sum(T.restoration_minutes_carrier_clock for T in tickets) / count(tickets), 2)

      chronic_circuit_count = Carrier.chronic_circuit_count            # snapshot at review creation
      raw = 100
            - (credit_ratio * 100 * CREDIT_RATIO_WEIGHT)
            - (chronic_circuit_count * CHRONIC_WEIGHT)
            - (min(mttr_minutes / 60, MTTR_HOURS_CAP) * MTTR_WEIGHT)
      net_performance_score = max(0.00, round_half_up(raw, 2))
    input_set: "ACKNOWLEDGED and PAID claims submitted inside the half-open period; CLOSED_RESTORED tickets confirmed inside the half-open period; all of the carrier's circuits created before period_end"
    constants:
      CREDIT_RATIO_WEIGHT: 2
      CHRONIC_WEIGHT: 5
      MTTR_HOURS_CAP: 10
      MTTR_WEIGHT: 3
      REPLACE_SCORE_MAX: 60
    precision: "credit_ratio 4 decimals, mttr_minutes 2 decimals, net_performance_score 2 decimals, all round_half_up; the score floor is 0.00"

  - name: carrier_exposure_ledger
    trigger: "every SlaCreditClaim creation and every claim state transition"
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY (money). Recomputed in full after each claim mutation, never patched blindly.
      Carrier.open_credit_exposure_cents =
          sum(C.credit_amount_cents for C in SlaCreditClaim
              WHERE C.carrier_id == carrier.id AND C.state IN {'DRAFT','SUBMITTED','ACKNOWLEDGED'})
      Carrier.watchlist_state = 'WATCHLIST' if open_credit_exposure_cents >= Carrier.watchlist_exposure_threshold_cents
                                else 'ACTIVE'
    input_set: "claims in DRAFT, SUBMITTED or ACKNOWLEDGED; REJECTED, PAID and WITHDRAWN claims are outside the open set"
    constants: {}
    precision: "whole cents; the watchlist threshold is inclusive (>=)"

  - name: committed_upgrade_bandwidth_ledger
    trigger: "every UpgradeOrder creation and every order state transition"
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY (bandwidth). Distinct in type and unit from the money ledger above.
      Carrier.committed_upgrade_mbps =
          sum(O.delta_mbps for O in UpgradeOrder
              JOIN Circuit X ON O.circuit_id == X.id
              WHERE X.carrier_id == carrier.id AND O.state IN {'DRAFT','SUBMITTED','APPROVED','IN_PROGRESS'})
    input_set: "orders in DRAFT, SUBMITTED, APPROVED or IN_PROGRESS; COMPLETED and CANCELLED orders are outside the committed set"
    constants: {}
    precision: "integer Mbps"

# =============================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in section 1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "for CarrierLiaison, X-User-ID equals the carrier_id of the targeted CarrierTicket / SlaCreditClaim / MaintenanceWindow (or, on window creation, Circuit.carrier_id)"
    error_id: ERR_CARRIER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /carrier-tickets/{id}/carrier-update, POST /sla-credit-claims/{id}/carrier-response, POST /maintenance-windows (origin CARRIER_NOTIFIED), POST /maintenance-windows/{id}/review"
  - priority: 10
    category: existence
    check: "every path-parameter resource exists, validated left-to-right"
    error_id: "ERR_CARRIER_NOT_FOUND | ERR_CIRCUIT_NOT_FOUND | ERR_DEVICE_NOT_FOUND | ERR_PATH_NOT_FOUND | ERR_SEGMENT_NOT_FOUND | ERR_ALARM_NOT_FOUND | ERR_INCIDENT_NOT_FOUND | ERR_TICKET_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_WINDOW_NOT_FOUND | ERR_TEST_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_REVIEW_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 11
    category: existence
    check: "every foreign key supplied in the request body references an existing row (carrier_id, circuit_id, device_id, application_path_id, incident_id, carrier_ticket_id, source_circuit_id, source_device_id)"
    error_id: "ERR_CARRIER_NOT_FOUND | ERR_CIRCUIT_NOT_FOUND | ERR_DEVICE_NOT_FOUND | ERR_PATH_NOT_FOUND | ERR_INCIDENT_NOT_FOUND | ERR_TICKET_NOT_FOUND"
    http_status: 404
    applies_to: "POST /circuits, POST /devices, POST /path-segments, POST /alarms, POST /carrier-tickets, POST /sla-credit-claims, POST /maintenance-windows, POST /failover-tests, POST /upgrade-orders, POST /vendor-reviews"
  - priority: 20
    category: business_constraint
    check: "request body conforms to the endpoint schema: required fields present, enum members valid, integers integral, utilization_pct within 0..100, sequence_index >= 1, min_surviving_legs within 1..2, escalation_tier_count within 1..3, monitoring_state input restricted to UNMONITORED or MONITORED, pagination limit within 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 22
    category: business_temporal
    check: "interval and instant inputs are coherent: window_end > window_start, scheduled_end > scheduled_start, period_end > period_start, to_iso8601 > from_iso8601, Alarm.raised_at <= clock now, cleared_at within [raised_at, clock now], restored_at within (opened_at, clock now]"
    error_id: ERR_TIMESTAMP_RANGE_INVALID
    http_status: 422
    applies_to: "POST /alarms, POST /alarms/{id}/clear, POST /carrier-tickets/{id}/carrier-update, POST /maintenance-windows, POST /failover-tests, POST /vendor-reviews, GET /application-paths/{id}/availability"
  - priority: 30
    category: state
    check: "the alarm has not already been cleared"
    error_id: ERR_ALARM_ALREADY_CLEARED
    http_status: 409
    applies_to: "POST /alarms/{id}/clear"
  - priority: 31
    category: state
    check: "target_response_state is exactly one step ahead of incident.response_state (DETECTED->TRIAGED, TRIAGED->MITIGATED)"
    error_id: ERR_RESPONSE_SEQUENCE_INVALID
    http_status: 409
    applies_to: "POST /incidents/{id}/response, POST /incidents/{id}/resolve"
  - priority: 32
    category: state
    check: "the incident is not RESOLVED when an escalation is requested"
    error_id: ERR_INCIDENT_ALREADY_RESOLVED
    http_status: 409
    applies_to: "POST /incidents/{id}/escalate"
  - priority: 33
    category: state
    check: "target_escalation_state is exactly one step above incident.escalation_state"
    error_id: ERR_ESCALATION_SEQUENCE_INVALID
    http_status: 409
    applies_to: "POST /incidents/{id}/escalate"
  - priority: 34
    category: state
    check: "the carrier ticket is in a state that admits the requested operation (see the CarrierTicket state machine)"
    error_id: ERR_TICKET_STATE_INVALID
    http_status: 409
    applies_to: "POST /carrier-tickets/{id}/test-results, POST /carrier-tickets/{id}/escalate, POST /carrier-tickets/{id}/carrier-update, POST /carrier-tickets/{id}/confirm-restoration"
  - priority: 35
    category: state
    check: "the claim is in a state that admits the requested operation (submit from DRAFT or REJECTED, carrier-response from SUBMITTED, settle from ACKNOWLEDGED, withdraw from DRAFT / SUBMITTED / REJECTED)"
    error_id: ERR_CLAIM_STATE_INVALID
    http_status: 409
    applies_to: "POST /sla-credit-claims/{id}/submit, POST /sla-credit-claims/{id}/carrier-response, POST /sla-credit-claims/{id}/settle, POST /sla-credit-claims/{id}/withdraw"
  - priority: 36
    category: state
    check: "the maintenance window is in a state that admits the requested operation (review from PROPOSED, IN_PROGRESS from APPROVED, COMPLETED from IN_PROGRESS, CANCELLED from PROPOSED or APPROVED)"
    error_id: ERR_WINDOW_STATE_INVALID
    http_status: 409
    applies_to: "POST /maintenance-windows/{id}/review, POST /maintenance-windows/{id}/state"
  - priority: 37
    category: state
    check: "the failover test is in a state that admits the requested operation (start from SCHEDULED, record-result from IN_PROGRESS, or ABORTED from SCHEDULED / IN_PROGRESS)"
    error_id: ERR_TEST_STATE_INVALID
    http_status: 409
    applies_to: "POST /failover-tests/{id}/start, POST /failover-tests/{id}/record-result"
  - priority: 38
    category: state
    check: "the upgrade order is in a state that admits the requested operation (submit from DRAFT, approve from SUBMITTED, IN_PROGRESS from APPROVED, COMPLETED from IN_PROGRESS, cancel from DRAFT / SUBMITTED / APPROVED)"
    error_id: ERR_ORDER_STATE_INVALID
    http_status: 409
    applies_to: "POST /upgrade-orders/{id}/submit, POST /upgrade-orders/{id}/approve, POST /upgrade-orders/{id}/state, POST /upgrade-orders/{id}/cancel"
  - priority: 39
    category: state
    check: "the vendor review has not already been decided"
    error_id: ERR_REVIEW_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /vendor-reviews/{id}/decide"
  - priority: 42
    category: state
    check: "CROSS-ENTITY: the claim's parent CarrierTicket is in state CLOSED_RESTORED"
    error_id: ERR_TICKET_NOT_CLOSED
    http_status: 409
    applies_to: "POST /sla-credit-claims, POST /sla-credit-claims/{id}/submit"
  - priority: 43
    category: state
    check: "CROSS-ENTITY: the incident behind the claim's ticket has response_state MITIGATED or RESOLVED"
    error_id: ERR_INCIDENT_NOT_MITIGATED
    http_status: 409
    applies_to: "POST /sla-credit-claims/{id}/submit"
  - priority: 44
    category: state
    check: "CROSS-ENTITY: every Alarm attached to the incident is cleared before the incident may resolve, and no uncleared ROOT alarm remains on the ticket's circuit before restoration may be confirmed"
    error_id: ERR_OPEN_ALARMS_PRESENT
    http_status: 409
    applies_to: "POST /incidents/{id}/resolve, POST /carrier-tickets/{id}/confirm-restoration"
  - priority: 45
    category: state
    check: "CROSS-ENTITY: no CarrierTicket on the incident is outside {CLOSED_RESTORED, CLOSED_NO_FAULT} when the incident resolves"
    error_id: ERR_CARRIER_TICKET_OPEN
    http_status: 409
    applies_to: "POST /incidents/{id}/resolve"
  - priority: 46
    category: state
    check: "CROSS-ENTITY: the order's circuit is not slated for replacement (Circuit.chronic_state != REPLACEMENT_APPROVED)"
    error_id: ERR_CIRCUIT_SLATED_FOR_REPLACEMENT
    http_status: 409
    applies_to: "POST /upgrade-orders, POST /upgrade-orders/{id}/submit"
  - priority: 48
    category: state
    check: "OCC: expected_carrier_ticket_version equals CarrierTicket.version"
    error_id: ERR_STALE_CARRIER_TICKET_VERSION
    http_status: 412
    applies_to: "POST /sla-credit-claims"
  - priority: 49
    category: state
    check: "OCC: expected_circuit_version equals Circuit.version"
    error_id: ERR_STALE_CIRCUIT_VERSION
    http_status: 412
    applies_to: "POST /upgrade-orders"
  - priority: 50
    category: business_referential
    check: "exactly one of circuit_id / device_id is supplied on a path segment"
    error_id: ERR_SEGMENT_TARGET_INVALID
    http_status: 422
    applies_to: "POST /path-segments"
  - priority: 51
    category: business_referential
    check: "exactly one of source_circuit_id / source_device_id is supplied on an alarm"
    error_id: ERR_ALARM_SOURCE_INVALID
    http_status: 422
    applies_to: "POST /alarms"
  - priority: 52
    category: business_referential
    check: "the ticket's circuit_id equals Incident.primary_circuit_id"
    error_id: ERR_CIRCUIT_INCIDENT_MISMATCH
    http_status: 422
    applies_to: "POST /carrier-tickets"
  - priority: 53
    category: business_referential
    check: "tested_leg_group appears among the distinct leg_group values of the path's ACTIVE PathSegment rows"
    error_id: ERR_LEG_NOT_FOUND
    http_status: 422
    applies_to: "POST /failover-tests"
  - priority: 55
    category: business_constraint
    check: "carrier_code is not already used by another Carrier"
    error_id: ERR_CARRIER_CODE_DUPLICATE
    http_status: 409
    applies_to: "POST /carriers"
  - priority: 56
    category: business_constraint
    check: "(carrier_id, carrier_circuit_identifier) is unique across Circuit"
    error_id: ERR_CIRCUIT_IDENTIFIER_DUPLICATE
    http_status: 409
    applies_to: "POST /circuits"
  - priority: 57
    category: business_constraint
    check: "hostname is unique across Device"
    error_id: ERR_DEVICE_HOSTNAME_DUPLICATE
    http_status: 409
    applies_to: "POST /devices"
  - priority: 58
    category: business_constraint
    check: "(application_path_id, leg_group, sequence_index) is unique across PathSegment rows with segment_state ACTIVE"
    error_id: ERR_SEGMENT_POSITION_TAKEN
    http_status: 409
    applies_to: "POST /path-segments"
  - priority: 59
    category: business_constraint
    check: "(carrier_id, carrier_reference) is unique across CarrierTicket"
    error_id: ERR_CARRIER_REFERENCE_DUPLICATE
    http_status: 409
    applies_to: "POST /carrier-tickets"
  - priority: 60
    category: business_constraint
    check: "no CarrierTicket on the same circuit_id is in a state outside {CLOSED_RESTORED, CLOSED_NO_FAULT}"
    error_id: ERR_DUPLICATE_OPEN_TICKET
    http_status: 409
    applies_to: "POST /carrier-tickets"
  - priority: 61
    category: business_constraint
    check: "no SlaCreditClaim on the same carrier_ticket_id is in a state within {DRAFT, SUBMITTED, ACKNOWLEDGED, PAID}"
    error_id: ERR_CLAIM_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /sla-credit-claims"
  - priority: 62
    category: business_constraint
    check: "the ticket's circuit has monitoring_state MONITORED (an UNMONITORED or MAINTENANCE_SUPPRESSED circuit has no trustworthy fault evidence)"
    error_id: ERR_CIRCUIT_NOT_MONITORED
    http_status: 409
    applies_to: "POST /carrier-tickets"
  - priority: 63
    category: business_constraint
    check: "the ticket's circuit has operational_state DEGRADED or DOWN"
    error_id: ERR_CIRCUIT_NOT_FAULTED
    http_status: 409
    applies_to: "POST /carrier-tickets"
  - priority: 65
    category: business_constraint
    check: "target_tier equals CarrierTicket.tier_level + 1"
    error_id: ERR_TIER_SEQUENCE_INVALID
    http_status: 422
    applies_to: "POST /carrier-tickets/{id}/escalate"
  - priority: 66
    category: business_constraint
    check: "target_tier does not exceed Carrier.escalation_tier_count"
    error_id: ERR_TIER_CEILING_REACHED
    http_status: 409
    applies_to: "POST /carrier-tickets/{id}/escalate"
  - priority: 67
    category: business_constraint
    check: "the ticket carries at least one TestResult with outcome FAIL or INCONCLUSIVE before escalating a tier"
    error_id: ERR_TEST_EVIDENCE_MISSING
    http_status: 422
    applies_to: "POST /carrier-tickets/{id}/escalate"
  - priority: 68
    category: business_constraint
    check: "a NO_FAULT_FOUND carrier update is refused while fail_test_count > 0"
    error_id: ERR_TEST_EVIDENCE_CONTRADICTS_NO_FAULT
    http_status: 409
    applies_to: "POST /carrier-tickets/{id}/carrier-update"
  - priority: 69
    category: business_constraint
    check: "EXEC escalation requires incident.severity IN {SEV1, SEV2}"
    error_id: ERR_EXEC_ESCALATION_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /incidents/{id}/escalate"
  - priority: 70
    category: business_safety
    check: "SAFETY: for every ApplicationPath that has an ACTIVE PathSegment referencing window.circuit_id, compute projected_healthy_legs = count of leg_groups L where every ACTIVE segment of L is up per calculations.path_posture_and_legs AND no ACTIVE segment of L references window.circuit_id; when projected_healthy_legs <= path.min_surviving_legs for any such path, body risk_acknowledged MUST be true"
    error_id: ERR_REDUNDANCY_RISK_UNACKNOWLEDGED
    http_status: 422
    applies_to: "POST /maintenance-windows/{id}/review"
  - priority: 71
    category: business_safety
    check: "SAFETY: a failover test may only start while ApplicationPath.posture == PROTECTED"
    error_id: ERR_PATH_NOT_PROTECTED
    http_status: 409
    applies_to: "POST /failover-tests/{id}/start"
  - priority: 72
    category: business_safety
    check: "SAFETY: no MaintenanceWindow with state IN {APPROVED, IN_PROGRESS} covering clock now exists on any circuit reachable from the path's ACTIVE segments"
    error_id: ERR_MAINTENANCE_IN_EFFECT
    http_status: 409
    applies_to: "POST /failover-tests/{id}/start"
  - priority: 73
    category: business_constraint
    check: "a recorded failover outcome agrees with surviving_leg_count (PASSED requires surviving_leg_count >= min_surviving_legs, FAILED requires strictly fewer)"
    error_id: ERR_FAILOVER_RESULT_INCONSISTENT
    http_status: 422
    applies_to: "POST /failover-tests/{id}/record-result"
  - priority: 74
    category: business_constraint
    check: "target_bandwidth_mbps is a BANDWIDTH_LADDER_MBPS member strictly greater than Circuit.bandwidth_mbps"
    error_id: ERR_UPGRADE_TARGET_INVALID
    http_status: 422
    applies_to: "POST /upgrade-orders"
  - priority: 80
    category: business_temporal
    check: "TEMPORAL (buffered closed intervals on a Circuit): approving window W is refused when another window V on the same circuit_id with state IN {APPROVED, IN_PROGRESS} satisfies W.window_start < V.window_end + CHANGE_BUFFER_MINUTES AND V.window_start < W.window_end + CHANGE_BUFFER_MINUTES, where CHANGE_BUFFER_MINUTES = 30; back-to-back windows separated by exactly 30 minutes therefore do NOT conflict, while touching windows (W.window_start == V.window_end) DO"
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /maintenance-windows/{id}/review"
  - priority: 81
    category: business_temporal
    check: "TEMPORAL (unbuffered half-open intervals with aggregate capacity per Carrier): scheduling a failover test is refused when the count of FailoverTest rows with state IN {SCHEDULED, IN_PROGRESS} whose [scheduled_start, scheduled_end) strictly overlaps the requested interval AND whose carrier_id_set intersects the requested path's carrier_id_set is already >= MAX_CONCURRENT_FAILOVER_TESTS_PER_CARRIER (1); adjacency (existing.scheduled_end == new.scheduled_start) never conflicts"
    error_id: ERR_FAILOVER_TEST_CONFLICT
    http_status: 409
    applies_to: "POST /failover-tests"
  - priority: 82
    category: business_temporal
    check: "sample_at is strictly greater than the sample_at of the circuit's latest CapacityReading"
    error_id: ERR_READING_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /circuits/{id}/capacity-readings"
  - priority: 83
    category: business_temporal
    check: "clock now - CarrierTicket.tier_entered_at >= Carrier.tier_escalation_min_minutes"
    error_id: ERR_TIER_DWELL_NOT_MET
    http_status: 409
    applies_to: "POST /carrier-tickets/{id}/escalate"
  - priority: 84
    category: business_temporal
    check: "clock now - CarrierTicket.restored_at >= SOAK_MINUTES (30)"
    error_id: ERR_SOAK_WINDOW_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /carrier-tickets/{id}/confirm-restoration"
  - priority: 85
    category: business_temporal
    check: "clock now lies within [window_start, window_end) when a window is started"
    error_id: ERR_WINDOW_NOT_IN_EFFECT
    http_status: 409
    applies_to: "POST /maintenance-windows/{id}/state"
  - priority: 86
    category: business_temporal
    check: "clock now lies within [scheduled_start, scheduled_end) when a failover test is started"
    error_id: ERR_TEST_WINDOW_NOT_IN_EFFECT
    http_status: 409
    applies_to: "POST /failover-tests/{id}/start"
  - priority: 87
    category: business_temporal
    check: "escalating L1 -> L2 requires clock now >= Incident.escalation_due_at"
    error_id: ERR_ESCALATION_PREMATURE
    http_status: 409
    applies_to: "POST /incidents/{id}/escalate"
  - priority: 88
    category: auth
    check: "SEGREGATION OF DUTIES: X-User-ID differs from CarrierTicket.restoration_confirmed_by_user_id when submitting a claim, and from UpgradeOrder.created_by_user_id when approving an order"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /sla-credit-claims/{id}/submit, POST /upgrade-orders/{id}/approve"
  - priority: 92
    category: business_fiscal
    check: "the claim's credit_amount_cents is strictly greater than zero (restoration exceeded the SLA target)"
    error_id: ERR_NO_SLA_BREACH
    http_status: 422
    applies_to: "POST /sla-credit-claims, POST /sla-credit-claims/{id}/submit"
  - priority: 93
    category: business_fiscal
    check: "the claim's credit_amount_cents is at least Carrier.min_claim_amount_cents"
    error_id: ERR_CLAIM_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /sla-credit-claims/{id}/submit"
  - priority: 94
    category: business_fiscal
    check: "paid_amount_cents equals claim.credit_amount_cents exactly"
    error_id: ERR_CREDIT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /sla-credit-claims/{id}/settle"
  - priority: 95
    category: business_fiscal
    check: "a REPLACE decision requires net_performance_score < 60 AND chronic_circuit_count >= 1"
    error_id: ERR_REPLACEMENT_NOT_JUSTIFIED
    http_status: 422
    applies_to: "POST /vendor-reviews/{id}/decide"
  - priority: 96
    category: business_fiscal
    check: "a RETAIN decision requires net_performance_score >= 60"
    error_id: ERR_RETAIN_NOT_JUSTIFIED
    http_status: 422
    applies_to: "POST /vendor-reviews/{id}/decide"

# =============================================================================
# 1.5 Endpoint Table
# All paths are flat top-level collections (api_prefix is the empty string).
# The single path parameter is always spelled {id}.
# =============================================================================
endpoints:

  # ---- Carrier -------------------------------------------------------------
  - method: POST
    path: /carriers
    roles: [PlatformAdmin]
    input: [name, carrier_code, "escalation_tier_count?", "sla_restore_minutes_critical?", "sla_restore_minutes_standard?", "credit_pct_per_breach_hour?", "credit_pct_cap?", "min_claim_amount_cents?", "tier_escalation_min_minutes?", "watchlist_exposure_threshold_cents?"]
    output: Carrier
    status: 201
    side_effects:
      - "creates the Carrier with open_credit_exposure_cents = 0, committed_upgrade_mbps = 0, chronic_circuit_count = 0, watchlist_state = ACTIVE"
  - method: GET
    path: /carriers/{id}
    roles: [NocAnalyst, NocShiftLead, CarrierLiaison, VendorManager, CapacityPlanner, PlatformAdmin]
    input: []
    output: Carrier
    status: 200
    side_effects: []
  - method: GET
    path: /carriers/{id}/circuits
    roles: [NocAnalyst, NocShiftLead, CarrierLiaison, VendorManager, CapacityPlanner, PlatformAdmin]
    input: ["monitoring_state?", "operational_state?", "chronic_state?", "capacity_state?", "limit?", "offset?"]
    output: Circuit[]
    status: 200
    side_effects: []
  - method: GET
    path: /carriers/{id}/vendor-reviews
    roles: [NocShiftLead, VendorManager, PlatformAdmin]
    input: ["decision?", "limit?", "offset?"]
    output: VendorReview[]
    status: 200
    side_effects: []

  # ---- Circuit -------------------------------------------------------------
  - method: POST
    path: /circuits
    roles: [PlatformAdmin]
    input: [carrier_id, carrier_circuit_identifier, site_a_code, site_z_code, bandwidth_mbps, mrc_cents, "monitoring_state?"]
    output: Circuit
    status: 201
    side_effects:
      - "creates the Circuit with operational_state = UP, chronic_state = NORMAL, capacity_state = NORMAL, consecutive_high_readings = 0, spof_flag = false, fault_count_period = 0"
      - "monitoring_state defaults to UNMONITORED; pass MONITORED to place the circuit under monitoring coverage; MAINTENANCE_SUPPRESSED is never an accepted input value (only the maintenance-window cascade may set it)"
  - method: GET
    path: /circuits/{id}
    roles: [NocAnalyst, NocShiftLead, CarrierLiaison, VendorManager, CapacityPlanner, PlatformAdmin]
    input: []
    output: Circuit
    status: 200
    side_effects: []
  - method: GET
    path: /circuits/{id}/devices
    roles: [NocAnalyst, NocShiftLead, VendorManager, CapacityPlanner, PlatformAdmin]
    input: ["device_role?", "limit?", "offset?"]
    output: Device[]
    status: 200
    side_effects: []
  - method: POST
    path: /circuits/{id}/capacity-readings
    roles: [CapacityPlanner, PlatformAdmin]
    input: [sample_at, utilization_pct, direction]
    output: CapacityReading
    status: 201
    side_effects:
      - "runs capacity_threshold_evaluation: sets the reading's threshold_state, updates Circuit.consecutive_high_readings and Circuit.capacity_state"
      - "when consecutive_high_readings reaches CONSECUTIVE_HIGH_READINGS_FOR_UPGRADE the circuit moves to UPGRADE_REQUIRED and an AUTO_THRESHOLD UpgradeOrder is created in DRAFT with costs from upgrade_order_cost"
      - "the auto-created DRAFT order adds its delta_mbps to Carrier.committed_upgrade_mbps"
      - "increments Circuit.version by 1"
  - method: GET
    path: /circuits/{id}/capacity-readings
    roles: [NocAnalyst, NocShiftLead, VendorManager, CapacityPlanner, PlatformAdmin]
    input: ["direction?", "threshold_state?", "limit?", "offset?"]
    output: CapacityReading[]
    status: 200
    side_effects: []
  - method: GET
    path: /circuits/{id}/upgrade-orders
    roles: [NocShiftLead, VendorManager, CapacityPlanner, PlatformAdmin]
    input: ["state?", "origin?", "limit?", "offset?"]
    output: UpgradeOrder[]
    status: 200
    side_effects: []

  # ---- Device --------------------------------------------------------------
  - method: POST
    path: /devices
    roles: [PlatformAdmin]
    input: [hostname, site_code, device_role, "primary_uplink_circuit_id?", "monitoring_state?"]
    output: Device
    status: 201
    side_effects:
      - "creates the Device with operational_state = UP; monitoring_state defaults to UNMONITORED and accepts only UNMONITORED or MONITORED as input"
  - method: GET
    path: /devices/{id}
    roles: [NocAnalyst, NocShiftLead, VendorManager, CapacityPlanner, PlatformAdmin]
    input: []
    output: Device
    status: 200
    side_effects: []

  # ---- ApplicationPath -----------------------------------------------------
  - method: POST
    path: /application-paths
    roles: [PlatformAdmin]
    input: [name, service_tier, protection_scheme, "min_surviving_legs?"]
    output: ApplicationPath
    status: 201
    side_effects:
      - "creates the path with posture = PROTECTED, active_leg_count = 0, healthy_leg_count = 0, monitored_segment_count = 0; min_surviving_legs defaults to 1"
  - method: GET
    path: /application-paths/{id}
    roles: [NocAnalyst, NocShiftLead, VendorManager, CapacityPlanner, PlatformAdmin]
    input: []
    output: ApplicationPath
    status: 200
    side_effects: []
  - method: GET
    path: /application-paths/{id}/availability
    roles: [NocAnalyst, NocShiftLead, VendorManager, PlatformAdmin]
    input: [from_iso8601, to_iso8601, basis]
    output: "{ basis: string, period_minutes: integer, path_down_minutes: integer, availability_pct: decimal, leg_down_minutes: object }"
    status: 200
    side_effects:
      - "read-only; evaluates path_availability_score under the requested variant (basis INTERSECTION -> intersection_basis, basis BEST_LEG -> best_leg_basis)"
  - method: GET
    path: /application-paths/{id}/failover-tests
    roles: [NocAnalyst, NocShiftLead, VendorManager, PlatformAdmin]
    input: ["state?", "tested_leg_group?", "limit?", "offset?"]
    output: FailoverTest[]
    status: 200
    side_effects: []

  # ---- PathSegment ---------------------------------------------------------
  - method: POST
    path: /path-segments
    roles: [PlatformAdmin]
    input: [application_path_id, leg_group, sequence_index, "circuit_id?", "device_id?"]
    output: PathSegment
    status: 201
    side_effects:
      - "creates the segment with segment_state = ACTIVE"
      - "re-derives ApplicationPath.active_leg_count, healthy_leg_count, monitored_segment_count and posture via path_posture_and_legs"
      - "re-derives spof_flag on every Circuit reachable from the path's ACTIVE segments"
      - "increments ApplicationPath.version by 1"
  - method: GET
    path: /path-segments/{id}
    roles: [NocAnalyst, NocShiftLead, VendorManager, CapacityPlanner, PlatformAdmin]
    input: []
    output: PathSegment
    status: 200
    side_effects: []
  - method: GET
    path: /path-segments
    roles: [NocAnalyst, NocShiftLead, VendorManager, CapacityPlanner, PlatformAdmin]
    input: ["application_path_id?", "circuit_id?", "device_id?", "leg_group?", "segment_state?", "limit?", "offset?"]
    output: PathSegment[]
    status: 200
    side_effects: []
  - method: DELETE
    path: /path-segments/{id}
    roles: [PlatformAdmin]
    input: []
    output: PathSegment
    status: 200
    side_effects:
      - "sets segment_state = RETIRED (the row is retained so historical alarms stay explicable)"
      - "re-derives the parent path's leg counts and posture and every reachable circuit's spof_flag"
      - "increments PathSegment.version and ApplicationPath.version by 1 each"

  # ---- Alarm ---------------------------------------------------------------
  - method: POST
    path: /alarms
    roles: [NocAnalyst, NocShiftLead, PlatformAdmin]
    input: [alarm_type, raw_severity, raised_at, "source_circuit_id?", "source_device_id?"]
    output: Alarm
    status: 201
    side_effects:
      - "runs alarm_correlation_assignment: either SUPPRESSED under an existing ROOT parent on the same source, or ROOT"
      - "a ROOT alarm on a MONITORED source drives the source's operational_state (CRITICAL/DEVICE_UNREACHABLE -> DOWN, MAJOR/MINOR -> DEGRADED)"
      - "cascades to every affected ApplicationPath (leg counts, posture) and then to sibling-circuit spof_flag"
      - "a ROOT alarm creates (or attaches to) an Incident whose severity, impact_score, response_due_at and escalation_due_at come from incident_severity_classification evaluated AFTER the posture cascade"
      - "a SUPPRESSED alarm attaches to the parent's incident and increments Incident.alarm_count without re-classifying severity downward (severity ratchets up only)"
      - "an alarm raised on a MAINTENANCE_SUPPRESSED source is stored with correlation_state = SUPPRESSED and creates no incident"
      - "increments the affected Circuit / ApplicationPath / Incident versions by 1 each"
  - method: POST
    path: /alarms/{id}/clear
    roles: [NocAnalyst, NocShiftLead, PlatformAdmin]
    input: [cleared_at]
    output: Alarm
    status: 200
    side_effects:
      - "sets correlation_state = CLEARED and cleared_at"
      - "clearing a ROOT alarm promotes the oldest still-open SUPPRESSED child (created_at ASC) to ROOT and re-parents the remaining children to it"
      - "when no open alarm remains on the source, the source returns to operational_state = UP and the posture / spof cascade re-runs"
      - "increments Alarm.version, and the affected Circuit / ApplicationPath versions, by 1 each"
  - method: GET
    path: /alarms/{id}
    roles: [NocAnalyst, NocShiftLead, VendorManager, PlatformAdmin]
    input: []
    output: Alarm
    status: 200
    side_effects: []
  - method: GET
    path: /alarms
    roles: [NocAnalyst, NocShiftLead, VendorManager, PlatformAdmin]
    input: ["source_circuit_id?", "source_device_id?", "correlation_parent_alarm_id?", "incident_id?", "correlation_state?", "alarm_type?", "limit?", "offset?"]
    output: Alarm[]
    status: 200
    side_effects: []

  # ---- Incident ------------------------------------------------------------
  - method: GET
    path: /incidents/{id}
    roles: [NocAnalyst, NocShiftLead, VendorManager, PlatformAdmin]
    input: []
    output: Incident
    status: 200
    side_effects: []
  - method: GET
    path: /incidents
    roles: [NocAnalyst, NocShiftLead, VendorManager, PlatformAdmin]
    input: ["primary_circuit_id?", "root_alarm_id?", "severity?", "response_state?", "escalation_state?", "limit?", "offset?"]
    output: Incident[]
    status: 200
    side_effects: []
  - method: POST
    path: /incidents/{id}/response
    roles: [NocAnalyst, NocShiftLead, PlatformAdmin]
    input: [target_response_state, "note?"]
    output: Incident
    status: 200
    side_effects:
      - "DETECTED -> TRIAGED stamps triaged_at; TRIAGED -> MITIGATED stamps mitigated_at"
      - "reaching MITIGATED de-escalates escalation_state by exactly one step (EXEC -> L2, L2 -> L1, L1 -> NONE) without touching response_state"
      - "increments Incident.version by 1"
  - method: POST
    path: /incidents/{id}/escalate
    roles: [NocShiftLead, PlatformAdmin]
    input: [target_escalation_state]
    output: Incident
    status: 200
    side_effects:
      - "advances escalation_state one step along NONE -> L1 -> L2 -> EXEC, leaving response_state untouched"
      - "increments Incident.version by 1"
  - method: POST
    path: /incidents/{id}/resolve
    roles: [NocShiftLead, PlatformAdmin]
    input: ["resolution_note?"]
    output: Incident
    status: 200
    side_effects:
      - "MITIGATED -> RESOLVED stamps resolved_at"
      - "runs chronic_circuit_evaluation on the primary circuit: increments fault_count_period and may move chronic_state to CHRONIC_CANDIDATE or CHRONIC, refreshing Carrier.chronic_circuit_count"
      - "increments Incident.version, Circuit.version and Carrier.version by 1 each"

  # ---- CarrierTicket -------------------------------------------------------
  - method: POST
    path: /carrier-tickets
    roles: [NocAnalyst, NocShiftLead, PlatformAdmin]
    input: [incident_id, circuit_id, carrier_reference]
    output: CarrierTicket
    status: 201
    side_effects:
      - "creates the ticket in OPEN with tier_level = 1, tier_entered_at = opened_at = clock now, carrier_id copied from the circuit"
      - "snapshots reported_circuit_identifier from Circuit.carrier_circuit_identifier so later renames cannot rewrite carrier correspondence"
      - "increments Incident.version by 1"
  - method: GET
    path: /carrier-tickets/{id}
    roles: [NocAnalyst, NocShiftLead, CarrierLiaison, VendorManager, PlatformAdmin]
    input: []
    output: CarrierTicket
    status: 200
    side_effects: []
  - method: GET
    path: /carrier-tickets
    roles: [NocAnalyst, NocShiftLead, CarrierLiaison, VendorManager, PlatformAdmin]
    input: ["incident_id?", "circuit_id?", "carrier_id?", "state?", "tier_level?", "limit?", "offset?"]
    output: CarrierTicket[]
    status: 200
    side_effects: []
  - method: POST
    path: /carrier-tickets/{id}/test-results
    roles: [NocAnalyst, NocShiftLead, PlatformAdmin]
    input: [test_type, outcome, "notes?"]
    output: TestResult
    status: 201
    side_effects:
      - "records the immutable TestResult with performed_at = clock now and recorded_by_user_id = X-User-ID"
      - "moves the ticket OPEN -> TESTING on the first recorded result"
      - "increments CarrierTicket.fail_test_count when outcome is FAIL"
      - "increments CarrierTicket.version by 1"
  - method: GET
    path: /carrier-tickets/{id}/test-results
    roles: [NocAnalyst, NocShiftLead, CarrierLiaison, VendorManager, PlatformAdmin]
    input: ["outcome?", "test_type?", "limit?", "offset?"]
    output: TestResult[]
    status: 200
    side_effects: []
  - method: POST
    path: /carrier-tickets/{id}/escalate
    roles: [NocShiftLead, PlatformAdmin]
    input: [target_tier, "justification?"]
    output: CarrierTicket
    status: 200
    side_effects:
      - "sets tier_level = target_tier, state = ESCALATED_T2 or ESCALATED_T3, tier_entered_at = clock now"
      - "increments CarrierTicket.version by 1"
  - method: POST
    path: /carrier-tickets/{id}/carrier-update
    roles: [CarrierLiaison, PlatformAdmin]
    input: [update, "restored_at?"]
    output: CarrierTicket
    status: 200
    side_effects:
      - "update RESTORED requires restored_at, stamps it, moves the ticket to RESTORED_PENDING_CONFIRM, and computes excluded_minutes, restoration_minutes_carrier_clock and restoration_minutes_noc_clock via restoration_minutes_dual_clock (snapshotted, never retro-adjusted)"
      - "update NO_FAULT_FOUND closes the ticket as CLOSED_NO_FAULT and creates no credit claim"
      - "increments CarrierTicket.version by 1"
  - method: POST
    path: /carrier-tickets/{id}/confirm-restoration
    roles: [NocShiftLead, PlatformAdmin]
    input: [soak_passed]
    output: CarrierTicket
    status: 200
    side_effects:
      - "soak_passed true: state -> CLOSED_RESTORED, confirmed_at = clock now, restoration_confirmed_by_user_id = X-User-ID"
      - "reads the restoration_minutes_carrier_clock / restoration_minutes_noc_clock / excluded_minutes snapshot already stamped by carrier-update; it never recomputes them"
      - "when the CARRIER_CLOCK basis breaches the applicable SLA target, an AUTO_DRAFT SlaCreditClaim is created in DRAFT and its credit_amount_cents is added to Carrier.open_credit_exposure_cents, which may flip Carrier.watchlist_state to WATCHLIST"
      - "soak_passed false: state -> REOPENED, reopen_count += 1, restored_at cleared"
      - "increments CarrierTicket.version and (when a claim is drafted) Carrier.version by 1 each"

  # ---- SlaCreditClaim ------------------------------------------------------
  - method: POST
    path: /sla-credit-claims
    roles: [VendorManager, PlatformAdmin]
    input: [carrier_ticket_id, expected_carrier_ticket_version, "basis?"]
    output: SlaCreditClaim
    status: 201
    side_effects:
      - "creates a MANUAL claim in DRAFT with basis defaulting to CARRIER_CLOCK, sla_target_minutes / breach_minutes / breach_hours / credit_amount_cents from sla_credit_amount"
      - "adds credit_amount_cents to Carrier.open_credit_exposure_cents and re-evaluates watchlist_state"
      - "OCC: requires expected_carrier_ticket_version to equal CarrierTicket.version and increments CarrierTicket.version by 1"
      - "increments Carrier.version by 1"
  - method: GET
    path: /sla-credit-claims/{id}
    roles: [NocShiftLead, CarrierLiaison, VendorManager, PlatformAdmin]
    input: []
    output: SlaCreditClaim
    status: 200
    side_effects: []
  - method: GET
    path: /sla-credit-claims
    roles: [NocShiftLead, CarrierLiaison, VendorManager, PlatformAdmin]
    input: ["carrier_ticket_id?", "carrier_id?", "state?", "basis?", "origin?", "limit?", "offset?"]
    output: SlaCreditClaim[]
    status: 200
    side_effects: []
  - method: POST
    path: /sla-credit-claims/{id}/submit
    roles: [VendorManager, PlatformAdmin]
    input: ["basis?", "attestation_note?"]
    output: SlaCreditClaim
    status: 200
    side_effects:
      - "when basis is supplied it replaces the stored basis and every derived amount is recomputed under the new variant before the fiscal checks run"
      - "DRAFT -> SUBMITTED (or REJECTED -> SUBMITTED, which increments revision_count) stamps submitted_at and submitted_by_user_id"
      - "adjusts Carrier.open_credit_exposure_cents by the recomputed delta and re-evaluates watchlist_state"
      - "increments SlaCreditClaim.version and Carrier.version by 1 each"
  - method: POST
    path: /sla-credit-claims/{id}/carrier-response
    roles: [CarrierLiaison, PlatformAdmin]
    input: [response, "rejection_reason?"]
    output: SlaCreditClaim
    status: 200
    side_effects:
      - "response ACKNOWLEDGED moves SUBMITTED -> ACKNOWLEDGED and leaves the exposure ledger unchanged"
      - "response REJECTED requires rejection_reason, moves SUBMITTED -> REJECTED and removes credit_amount_cents from Carrier.open_credit_exposure_cents"
      - "increments SlaCreditClaim.version and Carrier.version by 1 each"
  - method: POST
    path: /sla-credit-claims/{id}/settle
    roles: [VendorManager, PlatformAdmin]
    input: [paid_amount_cents]
    output: SlaCreditClaim
    status: 200
    side_effects:
      - "ACKNOWLEDGED -> PAID stamps paid_amount_cents and removes the amount from Carrier.open_credit_exposure_cents (PAID is outside the open-exposure state set)"
      - "increments SlaCreditClaim.version and Carrier.version by 1 each"
  - method: POST
    path: /sla-credit-claims/{id}/withdraw
    roles: [VendorManager, PlatformAdmin]
    input: []
    output: SlaCreditClaim
    status: 200
    side_effects:
      - "COMPENSATION: moves the claim to WITHDRAWN and subtracts exactly the amount previously added, restoring Carrier.open_credit_exposure_cents and watchlist_state to their pre-claim values"
      - "increments SlaCreditClaim.version and Carrier.version by 1 each"

  # ---- MaintenanceWindow ---------------------------------------------------
  - method: POST
    path: /maintenance-windows
    roles: [NocAnalyst, NocShiftLead, CarrierLiaison, PlatformAdmin]
    input: [circuit_id, origin, window_start, window_end, "suppresses_monitoring?"]
    output: MaintenanceWindow
    status: 201
    side_effects:
      - "creates the window in PROPOSED with carrier_id copied from the circuit, risk_acknowledged = false and suppresses_monitoring defaulting to true"
  - method: GET
    path: /maintenance-windows/{id}
    roles: [NocAnalyst, NocShiftLead, CarrierLiaison, VendorManager, PlatformAdmin]
    input: []
    output: MaintenanceWindow
    status: 200
    side_effects: []
  - method: GET
    path: /maintenance-windows
    roles: [NocAnalyst, NocShiftLead, CarrierLiaison, VendorManager, PlatformAdmin]
    input: ["circuit_id?", "carrier_id?", "state?", "origin?", "limit?", "offset?"]
    output: MaintenanceWindow[]
    status: 200
    side_effects: []
  - method: POST
    path: /maintenance-windows/{id}/review
    roles: [NocShiftLead, PlatformAdmin]
    input: [decision, "risk_acknowledged?"]
    output: MaintenanceWindow
    status: 200
    side_effects:
      - "decision APPROVED moves PROPOSED -> APPROVED, stamps approved_by_user_id and persists risk_acknowledged"
      - "decision REJECTED moves PROPOSED -> REJECTED (terminal) with no schedule effect"
      - "increments MaintenanceWindow.version by 1"
  - method: POST
    path: /maintenance-windows/{id}/state
    roles: [NocShiftLead, PlatformAdmin]
    input: [target_state]
    output: MaintenanceWindow
    status: 200
    side_effects:
      - "IN_PROGRESS: records monitoring_state_before_start and, when suppresses_monitoring is true, sets Circuit.monitoring_state = MAINTENANCE_SUPPRESSED"
      - "COMPLETED: restores Circuit.monitoring_state to monitoring_state_before_start and re-runs the posture cascade"
      - "CANCELLED: terminal from PROPOSED or APPROVED; if the window had already suppressed monitoring the suppression is reversed"
      - "increments MaintenanceWindow.version and Circuit.version by 1 each"

  # ---- FailoverTest --------------------------------------------------------
  - method: POST
    path: /failover-tests
    roles: [NocShiftLead, PlatformAdmin]
    input: [application_path_id, tested_leg_group, scheduled_start, scheduled_end]
    output: FailoverTest
    status: 201
    side_effects:
      - "creates the test in SCHEDULED with scheduled_by_user_id = X-User-ID and carrier_id_set derived from the path's ACTIVE segments"
  - method: POST
    path: /failover-tests/{id}/start
    roles: [NocAnalyst, NocShiftLead, PlatformAdmin]
    input: []
    output: FailoverTest
    status: 200
    side_effects:
      - "SCHEDULED -> IN_PROGRESS; the tested leg's circuits are treated as unavailable for the duration and the path posture is re-derived"
      - "increments FailoverTest.version and each affected ApplicationPath.version by 1"
  - method: POST
    path: /failover-tests/{id}/record-result
    roles: [NocShiftLead, PlatformAdmin]
    input: [outcome, "surviving_leg_count?"]
    output: FailoverTest
    status: 200
    side_effects:
      - "outcome PASSED / FAILED / ABORTED sets state and surviving_leg_count and stamps attested_by_user_id"
      - "FAILED sets spof_flag = true on every circuit of the surviving leg and re-derives the path posture"
      - "restores the tested leg to its pre-test availability and re-derives the path posture"
      - "increments FailoverTest.version, ApplicationPath.version and each touched Circuit.version by 1"

  # ---- UpgradeOrder --------------------------------------------------------
  - method: POST
    path: /upgrade-orders
    roles: [CapacityPlanner, PlatformAdmin]
    input: [circuit_id, target_bandwidth_mbps, expected_circuit_version, "expedite?"]
    output: UpgradeOrder
    status: 201
    side_effects:
      - "creates a MANUAL order in DRAFT with delta_mbps, subtotal_cents, expedite_fee_cents and total_cost_cents from upgrade_order_cost and created_by_user_id = X-User-ID"
      - "adds delta_mbps to Carrier.committed_upgrade_mbps"
      - "OCC: requires expected_circuit_version to equal Circuit.version and increments Circuit.version by 1"
      - "increments Carrier.version by 1"
  - method: POST
    path: /upgrade-orders/{id}/submit
    roles: [CapacityPlanner, PlatformAdmin]
    input: []
    output: UpgradeOrder
    status: 200
    side_effects:
      - "DRAFT -> SUBMITTED; the committed-bandwidth ledger is unchanged because SUBMITTED is also an open state"
      - "increments UpgradeOrder.version by 1"
  - method: POST
    path: /upgrade-orders/{id}/approve
    roles: [VendorManager, PlatformAdmin]
    input: []
    output: UpgradeOrder
    status: 200
    side_effects:
      - "SUBMITTED -> APPROVED, stamps approved_by_user_id (which must differ from created_by_user_id)"
      - "increments UpgradeOrder.version by 1"
  - method: POST
    path: /upgrade-orders/{id}/state
    roles: [CapacityPlanner, PlatformAdmin]
    input: [target_state]
    output: UpgradeOrder
    status: 200
    side_effects:
      - "IN_PROGRESS keeps the bandwidth commitment open"
      - "COMPLETED raises Circuit.bandwidth_mbps to target_bandwidth_mbps, resets consecutive_high_readings to 0 and capacity_state to NORMAL, and releases delta_mbps from Carrier.committed_upgrade_mbps"
      - "increments UpgradeOrder.version, Circuit.version and Carrier.version by 1 each"
  - method: POST
    path: /upgrade-orders/{id}/cancel
    roles: [CapacityPlanner, VendorManager, PlatformAdmin]
    input: ["cancel_reason?"]
    output: UpgradeOrder
    status: 200
    side_effects:
      - "COMPENSATION: moves the order to CANCELLED and subtracts exactly the delta_mbps previously added, restoring Carrier.committed_upgrade_mbps to its pre-order value"
      - "leaves Circuit.bandwidth_mbps and capacity_state untouched (a cancelled upgrade does not clear the utilization pressure)"
      - "increments UpgradeOrder.version and Carrier.version by 1 each"

  # ---- VendorReview --------------------------------------------------------
  - method: POST
    path: /vendor-reviews
    roles: [VendorManager, PlatformAdmin]
    input: [carrier_id, period_start, period_end]
    output: VendorReview
    status: 201
    side_effects:
      - "creates the review in PENDING with chronic_circuit_count, credit_ratio, mttr_minutes and net_performance_score computed by vendor_review_score over the period"
  - method: POST
    path: /vendor-reviews/{id}/decide
    roles: [VendorManager, PlatformAdmin]
    input: [decision, "justification?"]
    output: VendorReview
    status: 200
    side_effects:
      - "RETAIN: no downstream effect beyond stamping decision and decided_by_user_id"
      - "REMEDIATION_PLAN: sets Carrier.watchlist_state = WATCHLIST"
      - "REPLACE: sets Carrier.watchlist_state = WATCHLIST and moves every CHRONIC circuit of the carrier to chronic_state = REPLACEMENT_APPROVED, which blocks further upgrade orders on those circuits"
      - "increments VendorReview.version, Carrier.version and each touched Circuit.version by 1"

  # ---- Test-driving endpoint (logical clock) -------------------------------
  - method: POST
    path: /_clock/set_current_utc
    roles: [PlatformAdmin]
    input: [to_iso8601]
    output: "{ current_utc: string }"
    status: 200
    side_effects:
      - "sets the logical clock used by every timestamp, dwell, soak, window and SLA computation; the clock defaults to 2026-08-01T00:00:00Z and only ever moves forward"
      - "no business entity is mutated"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:

  # ---- authentication / authorization --------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's §1.5 roles"
  - id: ERR_CARRIER_SCOPE_VIOLATION
    http: 403
    condition: "a CarrierLiaison acts on a ticket, claim or window whose carrier_id differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting user already performed the conflicting step (confirmed the restoration being claimed, or created the upgrade order being approved)"

  # ---- existence ----------------------------------------------------------
  - id: ERR_CARRIER_NOT_FOUND
    http: 404
    condition: "carrier id in the path or body matches no Carrier"
  - id: ERR_CIRCUIT_NOT_FOUND
    http: 404
    condition: "circuit id in the path or body matches no Circuit"
  - id: ERR_DEVICE_NOT_FOUND
    http: 404
    condition: "device id in the path or body matches no Device"
  - id: ERR_PATH_NOT_FOUND
    http: 404
    condition: "application path id in the path or body matches no ApplicationPath"
  - id: ERR_SEGMENT_NOT_FOUND
    http: 404
    condition: "path segment id matches no PathSegment"
  - id: ERR_ALARM_NOT_FOUND
    http: 404
    condition: "alarm id matches no Alarm"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "incident id in the path or body matches no Incident"
  - id: ERR_TICKET_NOT_FOUND
    http: 404
    condition: "carrier ticket id in the path or body matches no CarrierTicket"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "claim id matches no SlaCreditClaim"
  - id: ERR_WINDOW_NOT_FOUND
    http: 404
    condition: "window id matches no MaintenanceWindow"
  - id: ERR_TEST_NOT_FOUND
    http: 404
    condition: "failover test id matches no FailoverTest"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "upgrade order id matches no UpgradeOrder"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "vendor review id matches no VendorReview"

  # ---- schema / shape -----------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "required field missing, unknown enum member, non-integral integer, utilization_pct outside 0..100, sequence_index < 1, monitoring_state input of MAINTENANCE_SUPPRESSED, limit outside 1..100, offset < 0"
  - id: ERR_TIMESTAMP_RANGE_INVALID
    http: 422
    condition: "an interval end is not strictly after its start, or an instant falls outside its permitted range relative to the logical clock"

  # ---- own-entity state ---------------------------------------------------
  - id: ERR_ALARM_ALREADY_CLEARED
    http: 409
    condition: "clearing an Alarm whose correlation_state is already CLEARED"
  - id: ERR_RESPONSE_SEQUENCE_INVALID
    http: 409
    condition: "target_response_state is not exactly one step ahead of Incident.response_state"
  - id: ERR_INCIDENT_ALREADY_RESOLVED
    http: 409
    condition: "escalating an Incident whose response_state is RESOLVED"
  - id: ERR_ESCALATION_SEQUENCE_INVALID
    http: 409
    condition: "target_escalation_state is not exactly one step above Incident.escalation_state"
  - id: ERR_TICKET_STATE_INVALID
    http: 409
    condition: "the CarrierTicket state does not admit the requested operation"
  - id: ERR_CLAIM_STATE_INVALID
    http: 409
    condition: "the SlaCreditClaim state does not admit the requested operation"
  - id: ERR_WINDOW_STATE_INVALID
    http: 409
    condition: "the MaintenanceWindow state does not admit the requested review or state change"
  - id: ERR_TEST_STATE_INVALID
    http: 409
    condition: "the FailoverTest state does not admit start or record-result"
  - id: ERR_ORDER_STATE_INVALID
    http: 409
    condition: "the UpgradeOrder state does not admit the requested operation"
  - id: ERR_REVIEW_ALREADY_DECIDED
    http: 409
    condition: "deciding a VendorReview whose decision is no longer PENDING"

  # ---- cross-entity state -------------------------------------------------
  - id: ERR_TICKET_NOT_CLOSED
    http: 409
    condition: "the claim's parent CarrierTicket is not in state CLOSED_RESTORED"
  - id: ERR_INCIDENT_NOT_MITIGATED
    http: 409
    condition: "the incident behind the claim's ticket has response_state DETECTED or TRIAGED"
  - id: ERR_OPEN_ALARMS_PRESENT
    http: 409
    condition: "an uncleared Alarm still exists on the incident, or an uncleared ROOT alarm still exists on the ticket's circuit"
  - id: ERR_CARRIER_TICKET_OPEN
    http: 409
    condition: "resolving an incident that still carries a CarrierTicket outside {CLOSED_RESTORED, CLOSED_NO_FAULT}"
  - id: ERR_CIRCUIT_SLATED_FOR_REPLACEMENT
    http: 409
    condition: "creating or submitting an upgrade order on a Circuit whose chronic_state is REPLACEMENT_APPROVED"

  # ---- optimistic concurrency --------------------------------------------
  - id: ERR_STALE_CARRIER_TICKET_VERSION
    http: 412
    condition: "expected_carrier_ticket_version does not equal CarrierTicket.version"
  - id: ERR_STALE_CIRCUIT_VERSION
    http: 412
    condition: "expected_circuit_version does not equal Circuit.version"

  # ---- referential integrity ---------------------------------------------
  - id: ERR_SEGMENT_TARGET_INVALID
    http: 422
    condition: "a path segment supplies neither or both of circuit_id and device_id"
  - id: ERR_ALARM_SOURCE_INVALID
    http: 422
    condition: "an alarm supplies neither or both of source_circuit_id and source_device_id"
  - id: ERR_CIRCUIT_INCIDENT_MISMATCH
    http: 422
    condition: "the ticket's circuit_id differs from Incident.primary_circuit_id"
  - id: ERR_LEG_NOT_FOUND
    http: 422
    condition: "tested_leg_group has no ACTIVE PathSegment on the requested ApplicationPath"

  # ---- uniqueness and business constraints -------------------------------
  - id: ERR_CARRIER_CODE_DUPLICATE
    http: 409
    condition: "carrier_code already exists on another Carrier"
  - id: ERR_CIRCUIT_IDENTIFIER_DUPLICATE
    http: 409
    condition: "(carrier_id, carrier_circuit_identifier) already exists"
  - id: ERR_DEVICE_HOSTNAME_DUPLICATE
    http: 409
    condition: "hostname already exists on another Device"
  - id: ERR_SEGMENT_POSITION_TAKEN
    http: 409
    condition: "(application_path_id, leg_group, sequence_index) already exists among ACTIVE segments"
  - id: ERR_CARRIER_REFERENCE_DUPLICATE
    http: 409
    condition: "(carrier_id, carrier_reference) already exists on another CarrierTicket"
  - id: ERR_DUPLICATE_OPEN_TICKET
    http: 409
    condition: "a CarrierTicket on the same circuit is in a state outside {CLOSED_RESTORED, CLOSED_NO_FAULT}"
  - id: ERR_CLAIM_ALREADY_OPEN
    http: 409
    condition: "a SlaCreditClaim on the same ticket is in state DRAFT, SUBMITTED, ACKNOWLEDGED or PAID"
  - id: ERR_CIRCUIT_NOT_MONITORED
    http: 409
    condition: "opening a carrier ticket on a circuit whose monitoring_state is UNMONITORED or MAINTENANCE_SUPPRESSED"
  - id: ERR_CIRCUIT_NOT_FAULTED
    http: 409
    condition: "opening a carrier ticket on a circuit whose operational_state is UP"
  - id: ERR_TIER_SEQUENCE_INVALID
    http: 422
    condition: "target_tier is not CarrierTicket.tier_level + 1"
  - id: ERR_TIER_CEILING_REACHED
    http: 409
    condition: "target_tier exceeds Carrier.escalation_tier_count"
  - id: ERR_TEST_EVIDENCE_MISSING
    http: 422
    condition: "escalating a carrier tier with no TestResult of outcome FAIL or INCONCLUSIVE on the ticket"
  - id: ERR_TEST_EVIDENCE_CONTRADICTS_NO_FAULT
    http: 409
    condition: "a NO_FAULT_FOUND carrier update is attempted while CarrierTicket.fail_test_count > 0"
  - id: ERR_EXEC_ESCALATION_NOT_ALLOWED
    http: 422
    condition: "EXEC escalation requested on an incident whose severity is SEV3 or SEV4"
  - id: ERR_FAILOVER_RESULT_INCONSISTENT
    http: 422
    condition: "recorded outcome disagrees with surviving_leg_count against ApplicationPath.min_surviving_legs"
  - id: ERR_UPGRADE_TARGET_INVALID
    http: 422
    condition: "target_bandwidth_mbps is not a BANDWIDTH_LADDER_MBPS member strictly above the circuit's current bandwidth_mbps"

  # ---- safety -------------------------------------------------------------
  - id: ERR_REDUNDANCY_RISK_UNACKNOWLEDGED
    http: 422
    condition: "approving a window whose circuit carries an ACTIVE segment of a path whose projected_healthy_legs (validations[priority=70]) would fall to or below min_surviving_legs, without risk_acknowledged true"
  - id: ERR_PATH_NOT_PROTECTED
    http: 409
    condition: "starting a failover test while ApplicationPath.posture is not PROTECTED"
  - id: ERR_MAINTENANCE_IN_EFFECT
    http: 409
    condition: "starting a failover test while an APPROVED or IN_PROGRESS MaintenanceWindow covering the clock exists on a circuit of the path"

  # ---- temporal -----------------------------------------------------------
  - id: ERR_WINDOW_OVERLAP
    http: 409
    condition: "the window, widened by CHANGE_BUFFER_MINUTES, overlaps another APPROVED or IN_PROGRESS window on the same circuit"
  - id: ERR_FAILOVER_TEST_CONFLICT
    http: 409
    condition: "the requested half-open interval overlaps an existing SCHEDULED or IN_PROGRESS failover test sharing a carrier, and the per-carrier concurrency ceiling is already reached"
  - id: ERR_READING_OUT_OF_ORDER
    http: 409
    condition: "sample_at is not strictly after the circuit's latest CapacityReading.sample_at"
  - id: ERR_TIER_DWELL_NOT_MET
    http: 409
    condition: "less than Carrier.tier_escalation_min_minutes have elapsed since CarrierTicket.tier_entered_at"
  - id: ERR_SOAK_WINDOW_NOT_ELAPSED
    http: 409
    condition: "less than SOAK_MINUTES have elapsed since CarrierTicket.restored_at"
  - id: ERR_WINDOW_NOT_IN_EFFECT
    http: 409
    condition: "starting a maintenance window while the clock lies outside [window_start, window_end)"
  - id: ERR_TEST_WINDOW_NOT_IN_EFFECT
    http: 409
    condition: "starting a failover test while the clock lies outside [scheduled_start, scheduled_end)"
  - id: ERR_ESCALATION_PREMATURE
    http: 409
    condition: "escalating L1 -> L2 before Incident.escalation_due_at"

  # ---- fiscal -------------------------------------------------------------
  - id: ERR_NO_SLA_BREACH
    http: 422
    condition: "the claim's restoration minutes do not strictly exceed the applicable SLA target, so credit_amount_cents would be 0"
  - id: ERR_CLAIM_BELOW_MINIMUM
    http: 422
    condition: "credit_amount_cents is below Carrier.min_claim_amount_cents"
  - id: ERR_CREDIT_AMOUNT_MISMATCH
    http: 422
    condition: "paid_amount_cents differs from SlaCreditClaim.credit_amount_cents"
  - id: ERR_REPLACEMENT_NOT_JUSTIFIED
    http: 422
    condition: "a REPLACE decision is requested while net_performance_score >= REPLACE_SCORE_MAX or chronic_circuit_count is 0"
  - id: ERR_RETAIN_NOT_JUSTIFIED
    http: 422
    condition: "a RETAIN decision is requested while net_performance_score < REPLACE_SCORE_MAX"

# =============================================================================
# 1.7 RBAC Matrix  (role_model: segregation_of_duties)
# =============================================================================
roles:
  - name: NocAnalyst
    description: "front-line operator: ingests alarms, records circuit test evidence, triages incidents and opens carrier trouble tickets"
    identity: opaque
    exclusive_operations:
      - "POST /alarms"
    shared_operations:
      - "POST /alarms/{id}/clear"
      - "POST /incidents/{id}/response"
      - "POST /carrier-tickets"
      - "POST /carrier-tickets/{id}/test-results"
      - "POST /maintenance-windows"
      - "POST /failover-tests/{id}/start"
      - "all monitoring and inventory GET endpoints"
  - name: NocShiftLead
    description: "shift authority: escalates incidents and carrier tiers, confirms restorations, reviews maintenance windows and attests failover results"
    identity: opaque
    exclusive_operations:
      - "POST /incidents/{id}/escalate"
      - "POST /incidents/{id}/resolve"
      - "POST /carrier-tickets/{id}/escalate"
      - "POST /carrier-tickets/{id}/confirm-restoration"
      - "POST /maintenance-windows/{id}/review"
      - "POST /maintenance-windows/{id}/state"
      - "POST /failover-tests"
      - "POST /failover-tests/{id}/record-result"
    shared_operations:
      - "POST /alarms/{id}/clear"
      - "POST /incidents/{id}/response"
      - "POST /carrier-tickets"
      - "POST /carrier-tickets/{id}/test-results"
      - "POST /maintenance-windows"
      - "POST /failover-tests/{id}/start"
      - "all monitoring, ticket, claim and inventory GET endpoints"
  - name: CarrierLiaison
    description: "the carrier's own representative: posts carrier-side ticket updates, notifies planned maintenance and answers credit claims; X-User-ID is the Carrier id and every write is scoped to that carrier"
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST /carrier-tickets/{id}/carrier-update"
      - "POST /sla-credit-claims/{id}/carrier-response"
    shared_operations:
      - "POST /maintenance-windows (origin CARRIER_NOTIFIED, own circuits only)"
      - "GET /carrier-tickets, GET /carrier-tickets/{id}, GET /carrier-tickets/{id}/test-results, GET /sla-credit-claims, GET /sla-credit-claims/{id}, GET /maintenance-windows, GET /maintenance-windows/{id} (own carrier scope)"
      - "GET /carriers/{id}, GET /carriers/{id}/circuits, GET /circuits/{id}"
  - name: VendorManager
    description: "carrier commercial owner: files and settles SLA credit claims, runs vendor performance reviews and replacement decisions, approves upgrade orders"
    identity: opaque
    exclusive_operations:
      - "POST /sla-credit-claims"
      - "POST /sla-credit-claims/{id}/submit"
      - "POST /sla-credit-claims/{id}/settle"
      - "POST /sla-credit-claims/{id}/withdraw"
      - "POST /vendor-reviews"
      - "POST /vendor-reviews/{id}/decide"
      - "POST /upgrade-orders/{id}/approve"
    shared_operations:
      - "POST /upgrade-orders/{id}/cancel"
      - "all monitoring, ticket, claim, review and inventory GET endpoints"
  - name: CapacityPlanner
    description: "capacity owner: ingests utilization samples and drives upgrade orders from draft to completion"
    identity: opaque
    exclusive_operations:
      - "POST /circuits/{id}/capacity-readings"
      - "POST /upgrade-orders"
      - "POST /upgrade-orders/{id}/submit"
      - "POST /upgrade-orders/{id}/state"
    shared_operations:
      - "POST /upgrade-orders/{id}/cancel"
      - "GET /carriers/{id}, GET /carriers/{id}/circuits, GET /circuits/{id}, GET /circuits/{id}/devices, GET /circuits/{id}/capacity-readings, GET /circuits/{id}/upgrade-orders, GET /application-paths/{id}, GET /path-segments, GET /path-segments/{id}, GET /devices/{id}"
  - name: PlatformAdmin
    description: "operational superuser: seeds carriers, circuits, devices, application paths and segments, drives the logical clock, and may perform any operational write"
    identity: opaque
    exclusive_operations:
      - "POST /carriers"
      - "POST /circuits"
      - "POST /devices"
      - "POST /application-paths"
      - "POST /path-segments"
      - "DELETE /path-segments/{id}"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every other write endpoint in §1.5 (admin override) and every GET endpoint"
