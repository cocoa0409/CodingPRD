      - name: department_roles_cannot_file_or_sign_the_carriers_enforcement_documents
        claim_type: exclusive_operations
        grounds:
          - roles.InsurerRespondent
          - endpoints[POST /examinations/{id}/corrective-action-plans]
          - endpoints[POST /consent-orders/{id}/execute]
        distinguishing_aspect: |
          The enforcement endgame alternates authorship - the carrier proposes the plan, the department
