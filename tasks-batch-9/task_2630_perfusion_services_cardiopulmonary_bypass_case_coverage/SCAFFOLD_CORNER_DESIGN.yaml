            - "after ${slot4} the contract read still shows coverage_posture == THIN: the backup window starts 2026-07-30 but is clipped to the horizon, contributing only 1440 minutes (2026-08-01T00:00:00Z to 2026-08-02T00:00:00Z), not its raw 4320"
            - "after ${slot5} the contract read shows coverage_posture == COVERED: the clipped 1440 and the adjacent 1440 merge to 2880 BACKUP_CALL minutes, at or above 2160, with PRIMARY_CALL at the full 4320"
            - "every slot is still SCHEDULED and consumed == false; ECMO_RELIEF slots would have been excluded from both dimensions"

      - name: ce_ledger_counts_only_in_cycle_activities_in_the_right_status
        claim_type: input_set_filtering
        grounds:
          - calculations.perfusionist_ce_ledger
          - validations[priority=65]
          - errors.ERR_CE_ACTIVITY_OUTSIDE_CYCLE
          - entities.Perfusionist.fields.ce_credits_verified
          - entities.Perfusionist.fields.ce_credits_pending
          - state_machines.CeActivity.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          The ledger's input set is defined by three filters at once - holder, status and the
          half-open certification window - and each is probed separately: an activity dated exactly
          on issued_on counts, one dated exactly on expires_on is refused as out of cycle, REJECTED
          and REVOKED rows drop out of both totals, and issuing a *newer* CCP certification moves the
          window so previously counted in-window activities silently leave the input set on the next
          recompute. The 12.5-hour claim keeps the one-decimal precision rule observable.
        test_recipe:
          setup:
            - "Perfusionist p1 with a CCP certification cert1 spanning [2026-01-01T00:00:00Z, 2026-12-31T00:00:00Z) and a 45-hour cycle requirement. No CE activity yet, so both ledgers read 0."
          setup_api_calls:
            - call: "POST /perfusionists"
              payload: { full_name: "Rafe Mbeki", employee_code: "EMP-1001", career_case_count: 150 }
              as: ContractAdmin
              captures: { p1: $.data.id }
            - call: "POST /perfusionists/${p1}/certifications"
              payload: { cert_code: "CCP", issued_on: "2026-01-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z", cycle_credit_requirement: 45 }
              as: ContractAdmin
              captures: { cert1: $.data.id }
          trigger:
            - call: "POST /perfusionists/${p1}/ce-activities"
              payload: { category: "CLINICAL", credit_hours: 20, activity_date: "2026-03-01T00:00:00Z", accreditation_body: "ABCP" }
              as: ContractAdmin
              captures: { a1: $.data.id }
            - call: "POST /perfusionists/${p1}/ce-activities"
              payload: { category: "TECHNICAL", credit_hours: 12.5, activity_date: "2026-06-01T00:00:00Z", accreditation_body: "ABCP" }
              as: ContractAdmin
              captures: { a2: $.data.id }
            - call: "POST /perfusionists/${p1}/ce-activities"
              payload: { category: "CLINICAL", credit_hours: 5, activity_date: "2025-12-31T00:00:00Z", accreditation_body: "ABCP" }
              as: ContractAdmin
              captures: { e_before: $.data.error_id }
            - call: "POST /perfusionists/${p1}/ce-activities"
              payload: { category: "CLINICAL", credit_hours: 8, activity_date: "2026-12-31T00:00:00Z", accreditation_body: "ABCP" }
              as: ContractAdmin
              captures: { e_on_expiry: $.data.error_id }
            - call: "POST /perfusionists/${p1}/ce-activities"
              payload: { category: "SAFETY", credit_hours: 3, activity_date: "2026-01-01T00:00:00Z", accreditation_body: "ABCP" }
              as: ContractAdmin
              captures: { a5: $.data.id }
            - call: "POST /ce-activities/${a1}/verification"
              payload: { decision: "VERIFIED", note: "transcript checked" }
              as: ContractAdmin
            - call: "POST /ce-activities/${a2}/verification"
              payload: { decision: "REJECTED", note: "no accreditation record" }
              as: ContractAdmin
            - call: "POST /perfusionists/${p1}/certifications"
              payload: { cert_code: "CCP", issued_on: "2026-07-01T00:00:00Z", expires_on: "2027-06-30T00:00:00Z", cycle_credit_requirement: 45 }
              as: ContractAdmin
              captures: { cert2: $.data.id }
            - call: "POST /perfusionists/${p1}/ce-activities"
              payload: { category: "CLINICAL", credit_hours: 4, activity_date: "2026-08-01T00:00:00Z", accreditation_body: "ABCP" }
              as: ContractAdmin
              captures: { a6: $.data.id }
          assert:
            - "after ${a1} and ${a2}: Perfusionist.${p1}.ce_credits_pending == 32.5 and ce_credits_verified == 0"
            - "${e_before} == ERR_CE_ACTIVITY_OUTSIDE_CYCLE with HTTP 422 - 2025-12-31 precedes issued_on; ce_credits_pending is still 32.5 and no CeActivity row was created"
            - "${e_on_expiry} == ERR_CE_ACTIVITY_OUTSIDE_CYCLE with HTTP 422 - the window [issued_on, expires_on) is half-open, so an activity dated exactly 2026-12-31T00:00:00Z is out of cycle"
            - "${a5} was accepted at exactly issued_on (inclusive lower bound), giving ce_credits_pending == 35.5"
            - "after verifying ${a1}: ce_credits_verified == 20 and ce_credits_pending == 15.5 - the hours moved, they were not duplicated"
            - "after rejecting ${a2}: ce_credits_pending == 3 and ce_credits_verified == 20 - a REJECTED row contributes to neither total"
            - "CeActivity.${a1}.counted_toward_remediation == false and Certification.${cert1}.probation_credits_banked == 0, because cert1 is ACTIVE, never PROBATION"
            - "after ${a6}, whose creation recomputes the ledger against the newest CCP certification ${cert2} (window [2026-07-01, 2027-06-30)): ce_credits_pending == 4 and ce_credits_verified == 0 - ${a1} (2026-03-01) and ${a5} (2026-01-01) fall outside the new cycle and leave the input set"

      - name: readiness_weights_clamp_and_gate_the_admission_of_a_perfusionist
        claim_type: weighted_scoring
        grounds:
          - calculations.perfusionist_readiness_score
          - validations[priority=43]
          - errors.ERR_READINESS_BELOW_MINIMUM
          - entities.Perfusionist.fields.readiness_score
          - entities.Perfusionist.fields.readiness_variant_last
        distinguishing_aspect: |
          The weighted_scoring row demands that the two weights are applied to the right ratios, that
          each ratio is clamped at 1.0 *before* weighting, and that the result is rounded to three
          decimals once. Three assignments against the same case pin all of it with literals: 0.180
          for a perfusionist with no CE credits (rejected at the 0.6 admission floor), 0.694 for one
          with 20 claimed hours against a 45-hour cycle and a full experience ratio, and exactly
          1.000 for a chief whose 50 claimed hours and 200 career cases both exceed their targets -
          an implementation that omits the clamp scores the chief above 1 and drifts the rounding.
        test_recipe:
          setup:
            - "LEAN BASE chain through case creation: contract c1, surgeon s1 with an ACTIVE CABG card, p1 (CCP current, 20 claimed CE hours, 150 career cases), chief (200 career cases), machines d1/d2, a PRIMARY_CALL slot for p1 and case1 [2026-08-02T06:00:00Z, 12:00:00Z) still SCHEDULED."
            - "Additionally p3 holds a current CCP certification but has claimed no CE at all, and the chief holds a CCP certification, 50 claimed CE hours and a BACKUP_CALL slot across the same horizon."
