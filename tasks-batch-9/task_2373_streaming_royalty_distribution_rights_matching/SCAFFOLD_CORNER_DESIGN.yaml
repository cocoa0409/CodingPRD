              captures: { wc: "$.data.id" }
            - call: "GET /royalties/works/${wr}"
              payload: {}
              as: RightsOpsAnalyst
              captures: { wrv: "$.data.version" }
            - call: "GET /royalties/works/${wc}"
              payload: {}
              as: RightsOpsAnalyst
              captures: { wcv: "$.data.version" }
          trigger:
            - name: direct_routing_with_null_claimant_rate_rejected
              call: "POST /royalties/rights-registrations"
              payload: { work_id: "${wr}", claimant_id: "${nolbl}", right_type: "MASTER", routing: "DIRECT", share_bps: 10000, territory_set: ["GB"], effective_from: "2026-01-01", effective_to: "2027-01-01", expected_work_version: "${wrv}" }
              as: RightsHolderUser
