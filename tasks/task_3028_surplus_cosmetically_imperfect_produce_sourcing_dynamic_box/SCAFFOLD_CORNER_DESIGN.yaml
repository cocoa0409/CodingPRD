        as: PlatformAdmin
        captures:
          lg_s: $.data.id
      - call: POST /produce/suppliers/${lg_s}/lots
        payload:
          fulfillment_center_id: ${lg_c}
          product_name: LG1
          category: FRUIT
          procurement_grade: SURPLUS
          unit_weight_grams: 100
          quantity_available: 300
