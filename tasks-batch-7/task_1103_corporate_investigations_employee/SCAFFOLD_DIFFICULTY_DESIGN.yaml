# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# task_1103_corporate_investigations_employee
# 9 Difficulty Rules x >=2 instances (20 instances total).
# Every setup_api_calls / trigger chain replays cleanly against SCAFFOLD.yaml
# §1.2 / §1.4 / §1.5 / §1.6 from empty-DB (logical clock default
# 2026-05-01T00:00:00Z; every instance sets it explicitly first).
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: substantiation_provisional_vs_final_input_sets
        grounds:
          - calculations.substantiation_score
          - entities.Finding.fields.substantiation_score_provisional
          - entities.Finding.fields.substantiation_score_final
          - state_machines.Finding.DRAFT_to_CALIBRATED
        distinguishing_aspect: |
          Finding-domain dual variant: with evidence UNDER_REVIEW and the interview
          UPJOHN_DELIVERED (identical underlying data), the provisional variant counts
          both (E=1, W=1 => 0.25+0.15+0.15 = 0.55) while the final variant counts
          neither (E=0, W=0 => 0.00+0.15 = 0.15). Different input-set filtering on the
          same case state produces different scores.
        test_recipe:
          setup:
            - "Case in FINDINGS with: allegation LINKED; subject EMP-100; scope COLLECTED holding evidence e1 still UNDER_REVIEW; interview UPJOHN_DELIVERED (never completed); preservation notice ACKNOWLEDGED"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/cases"
              payload: { title: "Case DV-1", allegation_category: FRAUD, severity: HIGH, department: "Finance", lead_investigator_id: "inv-lead-1" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /api/cases/${case_id}/allegations"
              payload: { reporter_channel: HOTLINE, is_anonymous: false, reporter_ref: "rep-1", narrative: "Expense fraud" }
              as: IntakeCoordinator
              captures: { alg_id: $.data.id }
            - { call: "POST /api/cases/${case_id}/transition", payload: { to_status: TRIAGED, severity: HIGH, department: "Finance" }, as: IntakeCoordinator }
            - { call: "POST /api/allegations/${alg_id}/transition", payload: { to_status: LINKED }, as: IntakeCoordinator }
            - call: "POST /api/cases/${case_id}/subjects"
              payload: { employee_ref: "EMP-100", role_in_case: PRIMARY }
              as: Investigator
              captures: { subj_id: $.data.id }
            - call: "GET /api/cases/${case_id}"
              as: Investigator
              captures: { case_v: $.data.version }
            - call: "POST /api/cases/${case_id}/plans"
              payload: { scope_statement: "full scope", planned_start: "2026-05-02T00:00:00Z", planned_end: "2026-05-20T00:00:00Z", expected_case_version: "${case_v}" }
              as: Investigator
              as_user_id: "inv-1"
              captures: { plan_id: $.data.id }
            - { call: "POST /api/plans/${plan_id}/transition", payload: { to_status: SUBMITTED }, as: Investigator, as_user_id: "inv-1" }
            - { call: "POST /api/plans/${plan_id}/transition", payload: { to_status: APPROVED }, as: InvestigationsManager, as_user_id: "mgr-1" }
            - call: "POST /api/cases/${case_id}/preservation-notices"
              payload: { custodian_ref: "EMP-100", scope: ALL_DATA, is_regulator_ordered: false }
              as: GeneralCounsel
              captures: { notice_id: $.data.id }
            - { call: "POST /api/preservation-notices/${notice_id}/transition", payload: { to_status: ACKNOWLEDGED }, as: GeneralCounsel }
            - call: "POST /api/cases/${case_id}/collection-scopes"
              payload: { custodian_ref: "EMP-100", data_source: EMAIL, planned_start: "2026-05-05T00:00:00Z", planned_end: "2026-05-10T00:00:00Z", preservation_notice_id: "${notice_id}" }
              as: Investigator
              captures: { scope_id: $.data.id }
            - { call: "POST /api/collection-scopes/${scope_id}/transition", payload: { to_status: APPROVED }, as: InvestigationsManager, as_user_id: "mgr-1" }
            - { call: "POST /api/collection-scopes/${scope_id}/transition", payload: { to_status: IN_PROGRESS }, as: Investigator, as_user_id: "inv-1" }
            - call: "POST /api/collection-scopes/${scope_id}/evidence-items"
              payload: { custodian_ref: "EMP-100", hash_value: "h1", size_bytes: 2000000, captured_at: "2026-05-06T00:00:00Z" }
              as: Investigator
              captures: { ev_id: $.data.id }
            - { call: "POST /api/evidence-items/${ev_id}/transition", payload: { to_status: UNDER_REVIEW }, as: Investigator, as_user_id: "inv-1" }
            - { call: "POST /api/collection-scopes/${scope_id}/transition", payload: { to_status: COLLECTED }, as: Investigator, as_user_id: "inv-1" }
            - call: "POST /api/cases/${case_id}/interviews"
              payload: { witness_ref: "W-1", interviewer_id: "inv-9", scheduled_start: "2026-05-08T14:00:00Z", scheduled_end: "2026-05-08T15:00:00Z" }
              as: Investigator
              captures: { int_id: $.data.id }
            - { call: "POST /api/interviews/${int_id}/transition", payload: { to_status: UPJOHN_DELIVERED }, as: Investigator, as_user_id: "inv-1" }
            - { call: "POST /api/cases/${case_id}/transition", payload: { to_status: FINDINGS }, as: Investigator, as_user_id: "inv-1" }
          trigger:
            - call: "POST /api/cases/${case_id}/findings"
              payload: { allegation_id: "${alg_id}", subject_id: "${subj_id}", evidence_item_ids: ["${ev_id}"] }
              as: Investigator
              as_user_id: "inv-1"
              captures: { finding_id: $.data.id }
            - call: "POST /api/findings/${finding_id}/transition"
              payload: { to_status: CALIBRATED, consistency_level: MEDIUM, subject_admission: false, finding_type: INCONCLUSIVE }
              as: HRBusinessPartner
              as_user_id: "hr-1"
          assert:
            - "Finding.${finding_id}.substantiation_score_provisional == 0.55 (E=1 UNDER_REVIEW counted, W=1 UPJOHN_DELIVERED counted, C=MEDIUM 0.15)"
            - "Finding.${finding_id}.substantiation_score_final == 0.15 (final variant: ADMITTED-only E=0, COMPLETED-only W=0, C=0.15)"
            - "provisional 0.55 != final 0.15 for identical underlying case data"

      - name: discipline_matrix_vs_calibrated_adjustments
        grounds:
          - calculations.discipline_severity_index
          - entities.DisciplinaryRecommendation.fields.index_policy_matrix
          - entities.DisciplinaryRecommendation.fields.index_calibrated
          - entities.DisciplinaryRecommendation.fields.suggested_action
        distinguishing_aspect: |
          Discipline-domain dual variant (different entity domain from Finding):
          severity HIGH (base 30) with zero priors gives index_policy_matrix 30
          (tier WARNING), while the CALIBRATED variant with aggravation_count=2 adds
          +10 giving index_calibrated 40 (tier SUSPENSION) — same inputs, two valid
          algorithms, different tier outputs.
        test_recipe:
          setup:
            - "Case in FINDINGS with one FINAL SUBSTANTIATED finding (final score 0.70: 1 ADMITTED evidence + 1 COMPLETED interview + HIGH consistency)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/cases"
              payload: { title: "Case DV-2", allegation_category: FRAUD, severity: HIGH, department: "Finance", lead_investigator_id: "inv-lead-1" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /api/cases/${case_id}/allegations"
              payload: { reporter_channel: HOTLINE, is_anonymous: false, reporter_ref: "rep-1", narrative: "Expense fraud" }
              as: IntakeCoordinator
              captures: { alg_id: $.data.id }
            - { call: "POST /api/cases/${case_id}/transition", payload: { to_status: TRIAGED, severity: HIGH, department: "Finance" }, as: IntakeCoordinator }
            - { call: "POST /api/allegations/${alg_id}/transition", payload: { to_status: LINKED }, as: IntakeCoordinator }
            - call: "POST /api/cases/${case_id}/subjects"
              payload: { employee_ref: "EMP-100", role_in_case: PRIMARY }
              as: Investigator
              captures: { subj_id: $.data.id }
            - call: "GET /api/cases/${case_id}"
              as: Investigator
              captures: { case_v: $.data.version }
            - call: "POST /api/cases/${case_id}/plans"
              payload: { scope_statement: "full scope", planned_start: "2026-05-02T00:00:00Z", planned_end: "2026-05-20T00:00:00Z", expected_case_version: "${case_v}" }
              as: Investigator
              as_user_id: "inv-1"
              captures: { plan_id: $.data.id }
            - { call: "POST /api/plans/${plan_id}/transition", payload: { to_status: SUBMITTED }, as: Investigator, as_user_id: "inv-1" }
            - { call: "POST /api/plans/${plan_id}/transition", payload: { to_status: APPROVED }, as: InvestigationsManager, as_user_id: "mgr-1" }
            - call: "POST /api/cases/${case_id}/preservation-notices"
              payload: { custodian_ref: "EMP-100", scope: ALL_DATA, is_regulator_ordered: false }
              as: GeneralCounsel
              captures: { notice_id: $.data.id }
            - { call: "POST /api/preservation-notices/${notice_id}/transition", payload: { to_status: ACKNOWLEDGED }, as: GeneralCounsel }
            - call: "POST /api/cases/${case_id}/collection-scopes"
              payload: { custodian_ref: "EMP-100", data_source: EMAIL, planned_start: "2026-05-05T00:00:00Z", planned_end: "2026-05-10T00:00:00Z", preservation_notice_id: "${notice_id}" }
              as: Investigator
              captures: { scope_id: $.data.id }
            - { call: "POST /api/collection-scopes/${scope_id}/transition", payload: { to_status: APPROVED }, as: InvestigationsManager, as_user_id: "mgr-1" }
            - { call: "POST /api/collection-scopes/${scope_id}/transition", payload: { to_status: IN_PROGRESS }, as: Investigator, as_user_id: "inv-1" }
            - call: "POST /api/collection-scopes/${scope_id}/evidence-items"
              payload: { custodian_ref: "EMP-100", hash_value: "h1", size_bytes: 2000000, captured_at: "2026-05-06T00:00:00Z" }
              as: Investigator
              captures: { ev_id: $.data.id }
            - { call: "POST /api/evidence-items/${ev_id}/transition", payload: { to_status: UNDER_REVIEW }, as: Investigator, as_user_id: "inv-1" }
            - { call: "POST /api/evidence-items/${ev_id}/transition", payload: { to_status: ADMITTED }, as: Investigator, as_user_id: "inv-1" }
            - { call: "POST /api/collection-scopes/${scope_id}/transition", payload: { to_status: COLLECTED }, as: Investigator, as_user_id: "inv-1" }
            - call: "POST /api/cases/${case_id}/interviews"
              payload: { witness_ref: "W-1", interviewer_id: "inv-9", scheduled_start: "2026-05-08T14:00:00Z", scheduled_end: "2026-05-08T15:00:00Z" }
              as: Investigator
              captures: { int_id: $.data.id }
            - { call: "POST /api/interviews/${int_id}/transition", payload: { to_status: UPJOHN_DELIVERED }, as: Investigator, as_user_id: "inv-1" }
            - { call: "POST /api/interviews/${int_id}/transition", payload: { to_status: COMPLETED, completion_note: "memo" }, as: Investigator, as_user_id: "inv-1" }
            - { call: "POST /api/cases/${case_id}/transition", payload: { to_status: FINDINGS }, as: Investigator, as_user_id: "inv-1" }
            - call: "POST /api/cases/${case_id}/findings"
              payload: { allegation_id: "${alg_id}", subject_id: "${subj_id}", evidence_item_ids: ["${ev_id}"] }
              as: Investigator
              as_user_id: "inv-1"
              captures: { finding_id: $.data.id }
            - { call: "POST /api/findings/${finding_id}/transition", payload: { to_status: CALIBRATED, consistency_level: HIGH, subject_admission: false, finding_type: SUBSTANTIATED }, as: HRBusinessPartner, as_user_id: "hr-1" }
            - { call: "POST /api/findings/${finding_id}/transition", payload: { to_status: FINAL }, as: InvestigationsManager, as_user_id: "mgr-9" }
          trigger:
            - call: "POST /api/findings/${finding_id}/disciplinary-recommendations"
              payload: { mitigation_count: 0, aggravation_count: 2, recommended_action: WARNING, justification: "HR disagrees with calibrated tier" }
              as: HRBusinessPartner
              as_user_id: "hr-1"
              captures: { rec_id: $.data.id }
          assert:
            - "DisciplinaryRecommendation.${rec_id}.index_policy_matrix == 30 (base 30 x multiplier 1.0, no adjustments)"
            - "DisciplinaryRecommendation.${rec_id}.index_calibrated == 40 (30 + 5*2 aggravation)"
            - "DisciplinaryRecommendation.${rec_id}.suggested_action == SUSPENSION (calibrated tier) while the POLICY_MATRIX tier of 30 is WARNING — variants diverge"
            - "DisciplinaryRecommendation.${rec_id}.prior_history_count == 0"
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: pattern_score_multi_input_nonlinear
        grounds:
          - calculations.pattern_risk_score
          - entities.PatternAlert.fields.pattern_risk_score
          - entities.PatternAlert.fields.risk_tier
        distinguishing_aspect: |
          Mode (a) combinatorial: >= 3 inputs with non-linear interaction —
          score = round_half_up(min(100, 10 * sev_max(3) * volume(1+0.5*(3-1)=2.0)
          * recency(max(0.2, 1-0/90)=1.0) * spread(1+0.25*0=1.0)), 2) = 60.00.
          Nested min/max clamps plus multiplicative terms; tier boundary MEDIUM.
        test_recipe:
          setup:
            - "Three HIGH-severity FRAUD cases in department Finance, all created at the 2026-05-01 clock, each with ACTIVE subject EMP-100 (REPEAT_SUBJECT fires with n=3, d=0, distinct_deps=1)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/cases"
              payload: { title: "Pattern-1", allegation_category: FRAUD, severity: HIGH, department: "Finance", lead_investigator_id: "inv-lead-1" }
              as: IntakeCoordinator
              captures: { c1: $.data.id }
            - call: "POST /api/cases"
              payload: { title: "Pattern-2", allegation_category: FRAUD, severity: HIGH, department: "Finance", lead_investigator_id: "inv-lead-1" }
              as: IntakeCoordinator
              captures: { c2: $.data.id }
            - call: "POST /api/cases"
              payload: { title: "Pattern-3", allegation_category: FRAUD, severity: HIGH, department: "Finance", lead_investigator_id: "inv-lead-1" }
              as: IntakeCoordinator
              captures: { c3: $.data.id }
            - { call: "POST /api/cases/${c1}/subjects", payload: { employee_ref: "EMP-100", role_in_case: PRIMARY }, as: Investigator }
            - { call: "POST /api/cases/${c2}/subjects", payload: { employee_ref: "EMP-100", role_in_case: PRIMARY }, as: Investigator }
            - { call: "POST /api/cases/${c3}/subjects", payload: { employee_ref: "EMP-100", role_in_case: PRIMARY }, as: Investigator }
          trigger:
            - { call: "POST /api/pattern-alerts/scan", payload: {}, as: ComplianceAuditor, as_user_id: "aud-1" }
            - call: "GET /api/pattern-alerts"
              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { rep_score: "$.data[0].pattern_risk_score" }
          assert:
            - "GET /api/pattern-alerts?alert_type=REPEAT_SUBJECT returns exactly one alert with alert_key == EMP-100 and len(case_ids) == 3"
            - "REPEAT_SUBJECT alert pattern_risk_score == 60.00 and risk_tier == MEDIUM (10 * 3 * 2.0 * 1.0 * 1.0)"
            - "Second scan POST /api/pattern-alerts/scan creates no duplicate REPEAT_SUBJECT alert for EMP-100 in the same window (idempotent key)"

      - name: effort_minutes_nested_rounding_order
        grounds:
          - calculations.evidence_review_effort_minutes
          - entities.CollectionScope.fields.review_effort_minutes
          - state_machines.CollectionScope.IN_PROGRESS_to_COLLECTED
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: three 300,000-byte items give
          per-item ceil(0.6)=1 each, subtotal 3, x1.15 = 3.45, round_half_up => 3.
          The forbidden sum-first order (raw 1.8 x1.15 = 2.07 => 2) yields a different
          integer; the scaffold pins per-item-ceil-then-sum.
        test_recipe:
          setup:
            - "Case in FIELDWORK with an approved plan, ACKNOWLEDGED ALL_DATA notice for EMP-100, and a scope IN_PROGRESS holding exactly three LOGGED evidence items of 300000 bytes each"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/cases"
              payload: { title: "Case CF-b", allegation_category: DATA_BREACH, severity: MEDIUM, department: "IT", lead_investigator_id: "inv-lead-1" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - { call: "POST /api/cases/${case_id}/transition", payload: { to_status: TRIAGED, severity: MEDIUM, department: "IT" }, as: IntakeCoordinator }
            - call: "GET /api/cases/${case_id}"
              as: Investigator
              captures: { case_v: $.data.version }
            - call: "POST /api/cases/${case_id}/plans"
              payload: { scope_statement: "scope", planned_start: "2026-05-02T00:00:00Z", planned_end: "2026-05-20T00:00:00Z", expected_case_version: "${case_v}" }
              as: Investigator
              as_user_id: "inv-1"
              captures: { plan_id: $.data.id }
            - { call: "POST /api/plans/${plan_id}/transition", payload: { to_status: SUBMITTED }, as: Investigator, as_user_id: "inv-1" }
            - { call: "POST /api/plans/${plan_id}/transition", payload: { to_status: APPROVED }, as: InvestigationsManager, as_user_id: "mgr-1" }
            - call: "POST /api/cases/${case_id}/preservation-notices"
              payload: { custodian_ref: "EMP-100", scope: ALL_DATA, is_regulator_ordered: false }
              as: GeneralCounsel
              captures: { notice_id: $.data.id }
            - { call: "POST /api/preservation-notices/${notice_id}/transition", payload: { to_status: ACKNOWLEDGED }, as: GeneralCounsel }
            - call: "POST /api/cases/${case_id}/collection-scopes"
              payload: { custodian_ref: "EMP-100", data_source: EMAIL, planned_start: "2026-05-05T00:00:00Z", planned_end: "2026-05-10T00:00:00Z", preservation_notice_id: "${notice_id}" }
              as: Investigator
              captures: { scope_id: $.data.id }
            - { call: "POST /api/collection-scopes/${scope_id}/transition", payload: { to_status: APPROVED }, as: InvestigationsManager, as_user_id: "mgr-1" }
            - { call: "POST /api/collection-scopes/${scope_id}/transition", payload: { to_status: IN_PROGRESS }, as: Investigator, as_user_id: "inv-1" }
            - { call: "POST /api/collection-scopes/${scope_id}/evidence-items", payload: { custodian_ref: "EMP-100", hash_value: "ha", size_bytes: 300000, captured_at: "2026-05-06T00:00:00Z" }, as: Investigator, as_user_id: "inv-1" }
            - { call: "POST /api/collection-scopes/${scope_id}/evidence-items", payload: { custodian_ref: "EMP-100", hash_value: "hb", size_bytes: 300000, captured_at: "2026-05-06T01:00:00Z" }, as: Investigator, as_user_id: "inv-1" }
            - { call: "POST /api/collection-scopes/${scope_id}/evidence-items", payload: { custodian_ref: "EMP-100", hash_value: "hc", size_bytes: 300000, captured_at: "2026-05-06T02:00:00Z" }, as: Investigator, as_user_id: "inv-1" }
          trigger:
            - call: "POST /api/collection-scopes/${scope_id}/transition"
              payload: { to_status: COLLECTED }
              as: Investigator
              as_user_id: "inv-1"
              captures: { eff: $.data.review_effort_minutes }
          assert:
            - "CollectionScope.${scope_id}.review_effort_minutes == 3 (ceil per item: 1+1+1 = 3; 3 x 1.15 = 3.45; round_half_up = 3)"
            - "CollectionScope.${scope_id}.review_effort_minutes != 2 (the forbidden sum-first order result)"
            - "CollectionScope.${scope_id}.collected_item_count == 3 and collected_bytes == 900000"

      - name: priority_score_evaluation_order_pinned
        grounds:
          - calculations.case_priority_score
          - entities.Case.fields.case_priority_score
          - entities.Case.fields.priority_tier
          - entities.Case.fields.pattern_escalated
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order: raw uses
          severity + pattern_escalated + disclosure-urgency ONLY; tier derives from
          raw; backlog ordering consumes tier+raw+created_at but never feeds raw.
          A CRITICAL case escalated via a REPEAT_SUBJECT alert has raw 40+15 = 55
          (URGENT) regardless of how many other cases share the tier.
        test_recipe:
          setup:
            - "Two CRITICAL cases (PatternX-1, PatternX-2) sharing subject EMP-500, plus one MEDIUM case; scan raises REPEAT_SUBJECT alert for EMP-500; alert ACKNOWLEDGED then ESCALATED"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/cases"
              payload: { title: "PatternX-1", allegation_category: BRIBERY, severity: CRITICAL, department: "Sales", lead_investigator_id: "inv-lead-1" }
              as: IntakeCoordinator
              captures: { c1: $.data.id }
            - call: "POST /api/cases"
              payload: { title: "PatternX-2", allegation_category: BRIBERY, severity: CRITICAL, department: "Sales", lead_investigator_id: "inv-lead-1" }
              as: IntakeCoordinator
              captures: { c2: $.data.id }
            - { call: "POST /api/cases/${c1}/subjects", payload: { employee_ref: "EMP-500", role_in_case: PRIMARY }, as: Investigator }
            - { call: "POST /api/cases/${c2}/subjects", payload: { employee_ref: "EMP-500", role_in_case: PRIMARY }, as: Investigator }
            - call: "POST /api/cases"
              payload: { title: "Plain-Medium", allegation_category: POLICY_VIOLATION, severity: MEDIUM, department: "HR", lead_investigator_id: "inv-lead-1" }
              as: IntakeCoordinator
              captures: { c3: $.data.id }
            - { call: "POST /api/pattern-alerts/scan", payload: {}, as: ComplianceAuditor, as_user_id: "aud-1" }
            - call: "GET /api/pattern-alerts"
              as: ComplianceAuditor
              captures: { alert_id: "$.data[0].id" }
            - { call: "POST /api/pattern-alerts/${alert_id}/transition", payload: { to_status: ACKNOWLEDGED }, as: InvestigationsManager, as_user_id: "mgr-1" }
            - { call: "POST /api/pattern-alerts/${alert_id}/transition", payload: { to_status: ESCALATED }, as: InvestigationsManager, as_user_id: "mgr-1" }
          trigger:
            - call: "GET /api/cases/${c1}"
              as: Investigator
              captures: { c1_score: $.data.case_priority_score, c1_tier: $.data.priority_tier, c1_esc: $.data.pattern_escalated }
            - call: "GET /api/cases/${c3}"
              as: Investigator
              captures: { c3_score: $.data.case_priority_score, c3_tier: $.data.priority_tier }
          assert:
            - "Case.${c1}.pattern_escalated == true after alert ESCALATED"
            - "Case.${c1}.case_priority_score == 55 (40 severity + 15 escalation; no PENDING disclosure)"
            - "Case.${c1}.priority_tier == URGENT"
            - "Case.${c3}.case_priority_score == 20 and priority_tier == ELEVATED (MEDIUM=20, no escalation, backlog size irrelevant to raw)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: interview_no_show_reschedule_cycle
        grounds:
          - state_machines.WitnessInterview.SCHEDULED_to_NO_SHOW
          - state_machines.WitnessInterview.NO_SHOW_to_SCHEDULED
          - entities.WitnessInterview.fields.no_show_count
        distinguishing_aspect: |
          WitnessInterview machine is cyclic: SCHEDULED -> NO_SHOW -> SCHEDULED ->
          UPJOHN_DELIVERED -> COMPLETED. The loop re-runs overlap checks on
          reschedule, increments no_show_count exactly once per NO_SHOW entry, and
          clears upjohn_delivered_at on reschedule so the second pass re-delivers.
        test_recipe:
          setup:
            - "Case in FIELDWORK (plan approved); interview I scheduled 2026-05-02T14:00-15:00Z with interviewer inv-9; clock advanced past the window end"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/cases"
              payload: { title: "Case NL-1", allegation_category: HARASSMENT, severity: MEDIUM, department: "Ops", lead_investigator_id: "inv-lead-1" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - { call: "POST /api/cases/${case_id}/transition", payload: { to_status: TRIAGED, severity: MEDIUM, department: "Ops" }, as: IntakeCoordinator }
            - call: "GET /api/cases/${case_id}"
