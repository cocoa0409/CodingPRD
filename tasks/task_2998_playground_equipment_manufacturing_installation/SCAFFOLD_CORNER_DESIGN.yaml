            - "point 1: ${funds_0} == 0 and ${freight_0} == ${surfacing_0} == ${structure_0} == ${contingency_0} == 0 - a PLEDGED pledge contributes nothing"
            - "point 2: ${pledge1_status} == COLLECTED, ${funds_1} == 60000, ${freight_1} == 51750, ${surfacing_1} == 6450, ${structure_1} == 1800 (60000 - 51750 - 6450) and ${contingency_1} == 0"
            - "point 3: ${pledge2_status} == COLLECTED, ${funds_2} == 90000, ${freight_2} == 51750, ${surfacing_2} == 6450, ${structure_2} == 25800 (now fully funded) and ${contingency_2} == 6000 (90000 - 84000)"
            - "point 4: ${pledge2_status_after_refund} == REFUNDED, ${funds_3} == 60000 and the buckets are EXACTLY the point-2 picture again: ${freight_3} == 51750, ${surfacing_3} == 6450, ${structure_3} == 1800, ${contingency_3} == 0"
            - "the declared invariant holds at all four points: alloc_permit_freight_cents + alloc_surfacing_cents + alloc_structure_cents + alloc_contingency_cents == funds_collected_cents (0, 60000, 90000, 60000)"
            - "FundraisingPledge.${pledge1_id}.status is still COLLECTED after the second pledge is refunded - the refund touches one pledge row and the project's derived fields only"
            - "DesignProject.${p_id}.version increased by exactly 1 on each of the two collects and the one refund (three writes), and the refund of a PLEDGED-only pledge would have moved no money at all"

      - name: multi_hop_cascades_are_covered_by_the_difficulty_design
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - state_machines.PlaygroundStandard.ACTIVE_to_SUPERSEDED
        distinguishing_aspect: "A single write must propagate through four levels (standard -> models -> placements -> project -> rendering/quote) with only non-terminal rows touched, and the ordering between hops must be observable."
        excluded_because:
          difficulty_instance: standard_supersede_cascades_to_decert_models_placements_project_and_quote
          rationale: "That multi_entity_cascade instance walks the full four-hop chain end to end and pins which rows are left untouched, which is exactly this layer's claim; the §1.9 state_machines section additionally covers the project-cancel cascade."

      - name: dual_variant_calculations_are_covered_by_the_difficulty_design
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.quote_pricing.variants
          - calculations.warranty_coverage.variants
        distinguishing_aspect: "Both declared variant pairs must produce different results from identical stored data, with the delta pinned to the cent."
        excluded_because:
          difficulty_instance: quote_provisional_vs_firm_diverge_on_same_placement_set
          rationale: "That dual_variant_divergence instance pins the PROVISIONAL/FIRM delta on one placement set, and warranty_prorated_vs_step_diverge_on_identical_claim_inputs pins the second pair (150815 vs 215450), so both variant families already have divergence tests."

  # =========================================================================
  - section: consistency_model
    instances:

      - name: every_derived_and_cascaded_value_is_visible_in_the_same_response_that_causes_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /playground/play-areas/{id}/placements]
          - endpoints[POST /playground/placements/{id}/validate]
          - endpoints[POST /playground/renderings/{id}/close-review]
          - calculations.use_zone_extent
          - calculations.surfacing_depth_requirement
          - state_machines.DesignProject.COMMUNITY_REVIEW_to_REVISION_REQUESTED
        distinguishing_aspect: >-
          consistency_model is `immediate`, so there is no lag to tolerate anywhere: the placement create
          response already carries its computed use-zone interval, the very next read of the parent area
          already shows the recomputed critical_fall_height_cm and required_surfacing_depth_cm from a
          still-DRAFT placement, and the close-review response body itself is the fully cascaded
          DesignProject (REVISION_REQUESTED, revision_rounds 1) while the rendering it withdrew and the
          quote it expired are already in their new states on the immediately following reads. An
          implementation that defers any recompute to a later request - or that returns the pre-write row
          and fixes the derived fields afterwards - fails at least one of the paired checks below, and the
          pairing is what makes it falsifiable: each value is asserted BOTH in the causing response and in
          the next read, and the two must agree.
        test_recipe:
          setup:
            - "Clock 2026-08-01T09:00:00Z. Standard ASTM_F1487/2024 ACTIVE (max_fall_height_cm_preschool 152, requires_accessible_route false). One certified PRESCHOOL_2_5 DECK model with deck_height_cm 122, use_zone_footprint_cm 183, unit_price_cents 89500. One project (SANDY_LOAM, accessible_route_required false, budget 500000) in CONSULTATION with one empty PRESCHOOL_2_5 area 0..1200 at ENGINEERED_WOOD_FIBER depth 30."
          setup_api_calls:
            - call: "POST /playground/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
            - call: "POST /playground/standards"
              payload: { code: "ASTM_F1487", edition_year: 2024, effective_from: "2024-01-01", min_use_zone_clearance_cm: 183, max_fall_height_cm_toddler: 122, max_fall_height_cm_preschool: 152, max_fall_height_cm_school_age: 244, requires_accessible_route: false }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { std_id: $.data.id }
            - call: "POST /playground/standards/${std_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /playground/component-models"
              payload: { sku: "DECK-122-SQ", category: "DECK", age_group: "PRESCHOOL_2_5", deck_height_cm: 122, use_zone_footprint_cm: 183, color_options: ["FOREST_GREEN", "CRIMSON"], unit_price_cents: 89500, hardware_bag_count: 6, warranty_years: 15, parts_support_until_year: 2045, accessible_transfer_ready: false, supersedes_model_id: null }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
              captures: { m_deck_id: $.data.id }
            - call: "POST /playground/component-models/${m_deck_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /playground/projects"
              payload: { client_name: "Immediate View Park", site_length_cm: 3000, site_width_cm: 2000, site_soil_type: "SANDY_LOAM", budget_cents: 500000, fundraising_deadline: "2026-12-31", required_age_groups: ["PRESCHOOL_2_5"], accessible_route_required: false }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { p_id: $.data.id }
            - call: "POST /playground/projects/${p_id}/start-consultation"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
            - call: "POST /playground/projects/${p_id}/play-areas"
              payload: { age_group: "PRESCHOOL_2_5", axis_origin_cm: 0, axis_length_cm: 1200, surfacing_material: "ENGINEERED_WOOD_FIBER", surfacing_depth_cm: 30 }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { a_id: $.data.id, cfh_empty: $.data.critical_fall_height_cm, depth_empty: $.data.required_surfacing_depth_cm, area_ver_empty: $.data.version }
          trigger:
            # --- pair 1: the create response carries its own computed interval; the next read of the
            #     parent already shows the recomputed derivations from a still-DRAFT child
            - call: "POST /playground/play-areas/${a_id}/placements"
              payload: { component_model_id: "${m_deck_id}", color_choice: "FOREST_GREEN", x_start_cm: 400, quantity: 1 }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { pl_id: $.data.id, zone_start: $.data.use_zone_start_cm, zone_end: $.data.use_zone_end_cm, pl_status: $.data.status }
            - call: "GET /playground/play-areas/${a_id}"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { cfh_draft: $.data.critical_fall_height_cm, depth_draft: $.data.required_surfacing_depth_cm, area_status_draft: $.data.status, area_ver_draft: $.data.version }
            # --- pair 2: the validate response carries the new placement state; the next read of the
            #     parent already shows the ZONED status and the re-derived (unchanged) numbers
            - call: "POST /playground/placements/${pl_id}/validate"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { pl_status_validated: $.data.status, pl_ver_validated: $.data.version }
            - call: "GET /playground/play-areas/${a_id}"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { cfh_validated: $.data.critical_fall_height_cm, depth_validated: $.data.required_surfacing_depth_cm, area_status_validated: $.data.status, area_ver_validated: $.data.version }
            # --- build a rendering and a quote so the close-review cascade has something to touch
            - call: "POST /playground/projects/${p_id}/renderings"
              payload: { pinned_standard_id: "${std_id}" }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { r_id: $.data.id, r_round: $.data.round_number, r_status: $.data.status }
            - call: "GET /playground/projects/${p_id}"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { proj_ver: $.data.version }
            - call: "POST /playground/quotes"
              payload: { project_id: "${p_id}", rendering_id: "${r_id}", variant: "FIRM", valid_until: "2026-12-31", expected_project_version: "${proj_ver}" }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { q_id: $.data.id, q_total: $.data.total_cents, q_status: $.data.status }
            - call: "POST /playground/renderings/${r_id}/community-votes"
              payload: { yes_votes: 10, no_votes: 15 }
              as: ClientRepresentative
              as_user_id: "client-1"
              captures: { approval_pct: $.data.community_approval_pct }
            # --- pair 3: the close-review response body IS the cascaded project; the rendering it
            #     withdrew and the quote it expired are already updated on the immediately next reads
            - call: "POST /playground/renderings/${r_id}/close-review"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { proj_status_in_close_response: $.data.design_status, revision_rounds_in_close_response: $.data.revision_rounds }
            - call: "GET /playground/renderings/${r_id}"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { r_status_after: $.data.status }
            - call: "GET /playground/quotes/${q_id}"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { q_status_after: $.data.status }
            - call: "GET /playground/projects/${p_id}"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { proj_status_after: $.data.design_status, revision_rounds_after: $.data.revision_rounds }
          assert:
            - "setup: the empty area reports ${cfh_empty} == 0 and ${depth_empty} == 15 (no placements, so critical fall height 0 and the absolute floor of 15 cm applies) with ${area_ver_empty} == 1"
            - "pair 1, causing response: HTTP 201 with ${pl_status} == DRAFT, ${zone_start} == 217 (400 - 183) and ${zone_end} == 583 (400 + 183; no PLASTIC_SLIDE exit extension for a DECK)"
            - "pair 1, next read: ${cfh_draft} == 122 and ${depth_draft} == 23 (ENGINEERED_WOOD_FIBER tier for critical fall height <= 150, no toddler uplift, no CLAY uplift, and 23 > 15) with ${area_ver_draft} == 2 - a DRAFT placement already counts, and the recompute happened inside the create request"
            - "pair 1: ${area_status_draft} == PLANNED - creating a placement does NOT zone the area; only validation does"
            - "pair 2, causing response: HTTP 200 with ${pl_status_validated} == VALIDATED and ${pl_ver_validated} == 2"
            - "pair 2, next read: ${area_status_validated} == ZONED, ${area_ver_validated} == 3, and ${cfh_validated} == 122 with ${depth_validated} == 23 - identical to the DRAFT values, proving the derivations are recomputed from the same DRAFT-or-VALIDATED input set rather than accumulated"
            - "the rendering issues at ${r_round} == 1 with ${r_status} == ISSUED, and the FIRM quote is priced immediately: ${q_total} == 138750 (subtotal 89500 at the default colour + freight 49250 = 48000 + 1250 * 1, discount 0) with ${q_status} == ISSUED"
            - "${approval_pct} == 40.0 (10 yes of 25 votes), below APPROVAL_THRESHOLD_PCT 60.0"
            - "pair 3, causing response: the close-review body is the DesignProject itself and already reads ${proj_status_in_close_response} == REVISION_REQUESTED with ${revision_rounds_in_close_response} == 1 - the caller needs no second request to learn the outcome"
            - "pair 3, next reads: ${r_status_after} == WITHDRAWN and ${q_status_after} == EXPIRED - both cascade side effects of the same close-review are already visible, with no eventual-consistency window"
            - "pair 3 agreement: ${proj_status_after} == ${proj_status_in_close_response} and ${revision_rounds_after} == ${revision_rounds_in_close_response}"
            - "no assertion in this instance requires a retry, a sleep, or a second read to converge - that is the whole content of consistency_model: immediate"
