  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: room_overlap_with_turnover_buffer_halfopen
        grounds:
          - validations[priority=10]
          - entities.Room.fields.turnover_buffer_minutes
          - entities.ProcedureBooking.fields.end_at
        distinguishing_aspect: |
          Room resource, half-open interval extended by an additive turnover
          buffer: with buffer=15 the prior booking reserves [10:00,11:15); a new
          booking starting 11:00 collides and is rejected ERR_ROOM_INTERVAL_CONFLICT,
          even though 11:00 >= the raw end 11:00.
        test_recipe:
          setup:
            - "STANDARD room with turnover_buffer_minutes 15 and one BOOKED interval [10:00,11:00)."
          setup_api_calls:
            - call: "POST /providers"
