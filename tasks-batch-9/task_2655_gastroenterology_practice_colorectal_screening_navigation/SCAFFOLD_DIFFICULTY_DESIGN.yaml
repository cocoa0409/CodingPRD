  - rule_id: boundary_precision_check
    instances:
      - name: age_exactly_forty_five_is_eligible_and_forty_four_is_not
        grounds:
          - calculations.screening_eligibility
          - entities.ScreeningEpisode.fields.eligibility_status
          - entities.ScreeningEpisode.fields.index_date
          - entities.Patient.fields.birth_date
        distinguishing_aspect: |
          A whole-year age boundary evaluated at both ends of the screening age band from one fixed
          index_date: a birth date of 1981-09-01 is exactly 45 at 2026-09-01 and eligible, one day
          later is 44 and ineligible, 1951-09-01 is exactly 75 and still eligible, and 1950-09-01 is
          76 and ineligible. The precision at stake is the month/day comparison that decides whether
          the birthday has already occurred on the index date.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, so every episode's index_date is 2026-09-01"
            - "Four patients with birth dates 1981-09-01, 1981-09-02, 1951-09-01 and 1950-09-01"
            - "SCREENING_START_AGE_YEARS is 45 and SCREENING_END_AGE_YEARS is 75, both inclusive"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /insurance-plans"
              payload: { plan_code: "P1", payer_name: "Meridian Health" }
              as: PracticeAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-45", birth_date: "1981-09-01", insurance_plan_id: "${plan_id}", asa_class: 2 }
              as: PracticeAdmin
              captures: { pt_45: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-44", birth_date: "1981-09-02", insurance_plan_id: "${plan_id}", asa_class: 2 }
              as: PracticeAdmin
              captures: { pt_44: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-75", birth_date: "1951-09-01", insurance_plan_id: "${plan_id}", asa_class: 2 }
              as: PracticeAdmin
              captures: { pt_75: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-76", birth_date: "1950-09-01", insurance_plan_id: "${plan_id}", asa_class: 2 }
              as: PracticeAdmin
              captures: { pt_76: $.data.id }
          trigger:
            - call: "POST /screening-episodes"
              payload: { patient_id: "${pt_45}", indication: "SCREENING_AVERAGE_RISK" }
              as: ReferralCoordinator
              captures: { ep_45: $.data.id, st_45: $.data.eligibility_status, idx_45: $.data.index_date }
            - call: "POST /screening-episodes"
              payload: { patient_id: "${pt_44}", indication: "SCREENING_AVERAGE_RISK" }
              as: ReferralCoordinator
              captures: { ep_44: $.data.id, st_44: $.data.eligibility_status }
            - call: "POST /screening-episodes"
              payload: { patient_id: "${pt_75}", indication: "SCREENING_AVERAGE_RISK" }
              as: ReferralCoordinator
              captures: { ep_75: $.data.id, st_75: $.data.eligibility_status }
            - call: "POST /screening-episodes"
              payload: { patient_id: "${pt_76}", indication: "SCREENING_AVERAGE_RISK" }
              as: ReferralCoordinator
              captures: { ep_76: $.data.id, st_76: $.data.eligibility_status }
          assert:
            - "${idx_45} == 2026-09-01"
            - "${st_45} == ELIGIBLE"
            - "${st_44} == INELIGIBLE_AGE"
            - "${st_75} == ELIGIBLE"
            - "${st_76} == INELIGIBLE_AGE"
            - "all four episodes are created with HTTP 201 - ineligibility is recorded on the episode, not rejected at creation"
            - "ScreeningEpisode.${ep_44}.due_date == 2027-02-28 and ScreeningEpisode.${ep_76}.due_date == 2027-02-28 (index_date + 180 days is computed regardless of eligibility)"
      - name: zero_denominator_quality_period_locks_with_null_adr
        grounds:
          - calculations.adenoma_detection_rate
          - entities.QualityPeriod.fields.adr_pct
          - validations.priority_31_ERR_QUALITY_PERIOD_NOT_ENDED
          - entities.QualityPeriod.fields.benchmark_result
        distinguishing_aspect: |
          Two different boundaries in the quality domain rather than the age domain: the lock date
          boundary (locking one day before period_end_date is rejected, locking exactly on
          period_end_date is accepted) and the empty-denominator boundary (screening volume 0 is below
          MIN_SCREENING_VOLUME 1, so adr_pct must be null - not 0.0000 - and benchmark_result must be
          INSUFFICIENT_VOLUME rather than MISSED).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z"
            - "One endoscopist with adr_benchmark_pct 0.25 and no completed bookings at all"
            - "One OPEN QualityPeriod covering 2026-09-01 to 2026-09-30 under PROCEDURE_DATE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /clinicians"
              payload: { npi: "1000000001", full_name: "Dr Ada Ng", clinician_type: "ENDOSCOPIST", adr_benchmark_pct: 0.25 }
              as: PracticeAdmin
              captures: { endo_id: $.data.id }
            - call: "POST /quality-periods"
              payload: { endoscopist_id: "${endo_id}", period_start_date: "2026-09-01", period_end_date: "2026-09-30", attribution_basis: "PROCEDURE_DATE" }
              as: QualityOfficer
              captures: { qp_id: $.data.id, qp_status0: $.data.status, qp_adr0: $.data.adr_pct, qp_den0: $.data.screening_colonoscopy_count }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-29T23:59:59Z" }
              as: PracticeAdmin
          trigger:
            - call: "POST /quality-periods/${qp_id}/lock"
              payload: {}
              as: QualityOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /quality-periods/${qp_id}/lock"
              payload: {}
              as: QualityOfficer
              captures: { qp_status1: $.data.status, qp_adr1: $.data.adr_pct, qp_den1: $.data.screening_colonoscopy_count, qp_num1: $.data.adenoma_positive_count, qp_res1: $.data.benchmark_result, qp_rem1: $.data.remediation_required, qp_bench1: $.data.benchmark_pct }
          assert:
            - "${qp_status0} == OPEN and ${qp_den0} == 0 and ${qp_adr0} is null"
            - "the first lock call returns error_id ERR_QUALITY_PERIOD_NOT_ENDED with HTTP 422 and QualityPeriod.${qp_id}.status is still OPEN"
            - "the second lock call returns 200 and ${qp_status1} == LOCKED"
            - "${qp_den1} == 0 and ${qp_num1} == 0"
            - "${qp_adr1} is null, not 0.0000"
            - "${qp_res1} == INSUFFICIENT_VOLUME and ${qp_rem1} == false"
            - "${qp_bench1} == 0.25 (the benchmark is still snapshotted at lock time even with an empty denominator)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: procedure_start_requires_coverage_confirmed_session
        grounds:
          - validations.priority_22_ERR_ANESTHESIA_COVERAGE_REQUIRED
          - state_machines.EndoscopySession.COVERAGE_CONFIRMED_to_PUBLISHED
          - state_machines.ProcedureBooking.CHECKED_IN_to_IN_PROGRESS
          - entities.AnesthesiaCoverage.fields.status
        distinguishing_aspect: |
          The gate on ProcedureBooking.start lives entirely on two other entities: releasing an
          AnesthesiaCoverage row demotes the EndoscopySession from COVERAGE_CONFIRMED to PUBLISHED,
          and that demotion alone makes the start illegal while the booking's own status stays
          CHECKED_IN the whole time. Re-staffing the block restores startability with no change to the
          booking.
