scenario: "Aircraft Maintenance Shop & Annual Inspection (Part 145/A&P): work order scope & inspection checklist, discrepancy list & owner approval for repairs, airworthiness directive & service bulletin applicability, parts sourcing (new/overhaul/serviceable) & traceability, logbook entry & return to service, downtime & hangar slot management, labor rate vs flat-rate pricing, warranty on maintenance work"
domain_name: aircraft-maintenance-shop-annual
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Owner
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Owner legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique per owner" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: approval_cap_cents, type: integer, source: input, description: "Per-discrepancy pre-authorized cap in cents; discrepancies at-or-above this cap require explicit owner decision", default: 50000 }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE, constraints: "enum: {ACTIVE, SUSPENDED}" }

  - name: Aircraft
    parent: null
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: input, description: "FK -> Owner.id; registered owner" }
      - { name: tail_number, type: string, source: input, description: "FAA N-number; unique across fleet" }
      - { name: make_model, type: string, source: input, description: "e.g. Cessna 172S" }
      - { name: total_time_hours, type: number, source: input, description: "Airframe total time in tenths of hours" }
      - { name: airworthiness_posture, type: enum, source: computed, description: "AIRWORTHY | RESTRICTED | GROUNDED; derived from open directives and open discrepancies", default: AIRWORTHY, constraints: "enum: {AIRWORTHY, RESTRICTED, GROUNDED}" }
      - { name: posture_reason, type: string, source: computed, description: "Human-readable summary of the rule that produced current posture" }

  - name: Mechanic
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Mechanic legal name" }
      - { name: certificate_number, type: string, source: input, description: "A&P or IA certificate number; unique" }
      - { name: certificate_class, type: enum, source: input, description: "AP (Airframe & Powerplant) | IA (Inspection Authorization)", constraints: "enum: {AP, IA}" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Shop labor billing rate for this mechanic per hour" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE", default: ACTIVE, constraints: "enum: {ACTIVE, INACTIVE}" }

  - name: HangarSlot
    parent: null
    common_fields: true
    fields:
      - { name: hangar_code, type: string, source: input, description: "Physical hangar identifier, e.g. H1" }
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id; occupying aircraft" }
      - { name: starts_at, type: datetime, source: input, description: "Slot start UTC; half-open interval [starts_at, ends_at)" }
      - { name: ends_at, type: datetime, source: input, description: "Slot end UTC; must be strictly greater than starts_at" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Per-billing-day hangar rate" }
      - { name: status, type: enum, source: system, description: "RESERVED | OCCUPIED | RELEASED | CANCELLED", default: RESERVED, constraints: "enum: {RESERVED, OCCUPIED, RELEASED, CANCELLED}" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id" }
      - { name: hangar_slot_id, type: string, source: input, description: "FK -> HangarSlot.id; slot booked for this WO" }
      - { name: opened_by_mechanic_id, type: string, source: input, description: "FK -> Mechanic.id; mechanic who opened the WO" }
      - { name: scope_type, type: enum, source: input, description: "ANNUAL | HUNDRED_HOUR | UNSCHEDULED", constraints: "enum: {ANNUAL, HUNDRED_HOUR, UNSCHEDULED}" }
      - { name: pricing_mode, type: enum, source: input, description: "HOURLY bills actual labor hours; FLAT_RATE bills published task rates", constraints: "enum: {HOURLY, FLAT_RATE}" }
      - { name: status, type: enum, source: system, description: "DRAFT | SCHEDULED | IN_PROGRESS | INSPECTION_COMPLETE | AWAITING_OWNER_APPROVAL | APPROVED | WORK_IN_PROGRESS | READY_FOR_RTS | RETURNED_TO_SERVICE | CLOSED | CANCELLED", default: DRAFT, constraints: "enum: {DRAFT, SCHEDULED, IN_PROGRESS, INSPECTION_COMPLETE, AWAITING_OWNER_APPROVAL, APPROVED, WORK_IN_PROGRESS, READY_FOR_RTS, RETURNED_TO_SERVICE, CLOSED, CANCELLED}" }
      - { name: open_discrepancy_count, type: integer, source: computed, description: "Count of child Discrepancy rows whose status is in {OPEN, PENDING_OWNER_DECISION, APPROVED, RECTIFIED} (not VERIFIED, not REJECTED, not DEFERRED)" }
      - { name: verified_discrepancy_count, type: integer, source: computed, description: "Count of child Discrepancy rows in VERIFIED status" }
      - { name: labor_hours_tenths, type: integer, source: computed, description: "Sum of LaborEntry.duration_tenths across non-VOIDED labor entries for this WO" }

  - name: ChecklistItem
    parent: WorkOrder
    common_fields: false
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id" }
      - { name: item_code, type: string, source: input, description: "Checklist reference code, e.g. C-142-ENG" }
      - { name: description, type: string, source: input, description: "Inspection task text" }
      - { name: flat_rate_cents, type: integer, source: input, description: "Published flat-rate price for this task; used when WorkOrder.pricing_mode == FLAT_RATE" }
      - { name: result, type: enum, source: input, description: "PENDING | PASS | FAIL | NA", default: PENDING, constraints: "enum: {PENDING, PASS, FAIL, NA}" }
      - { name: inspected_by_mechanic_id, type: string, source: input, description: "FK -> Mechanic.id; nullable until result set", constraints: "nullable" }

  - name: Discrepancy
    parent: WorkOrder
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id" }
      - { name: checklist_item_id, type: string, source: input, description: "FK -> ChecklistItem.id that surfaced this discrepancy; nullable for squawks outside checklist", constraints: "nullable" }
      - { name: description, type: string, source: input, description: "Finding text" }
      - { name: severity, type: enum, source: input, description: "AIRWORTHINESS (grounding) | NON_AIRWORTHINESS (deferrable)", constraints: "enum: {AIRWORTHINESS, NON_AIRWORTHINESS}" }
      - { name: estimated_cost_cents, type: integer, source: input, description: "Shop estimate to rectify; compared against Owner.approval_cap_cents" }
      - { name: status, type: enum, source: system, description: "OPEN | PENDING_OWNER_DECISION | APPROVED | DEFERRED | REJECTED | RECTIFIED | VERIFIED", default: OPEN, constraints: "enum: {OPEN, PENDING_OWNER_DECISION, APPROVED, DEFERRED, REJECTED, RECTIFIED, VERIFIED}" }
      - { name: requires_owner_decision, type: boolean, source: computed, description: "true iff estimated_cost_cents >= Owner.approval_cap_cents at submission time" }
      - { name: decided_by_owner_id, type: string, source: system, description: "FK -> Owner.id who approved/rejected/deferred; null until decision", constraints: "nullable" }

  - name: Directive
    parent: null
    common_fields: true
    fields:
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id this directive applies to" }
      - { name: directive_type, type: enum, source: input, description: "AD (Airworthiness Directive, mandatory) | SB (Service Bulletin, advisory)", constraints: "enum: {AD, SB}" }
      - { name: reference_number, type: string, source: input, description: "e.g. AD 2023-14-08" }
      - { name: description, type: string, source: input, description: "Directive subject" }
      - { name: compliance_status, type: enum, source: system, description: "PENDING_EVALUATION | APPLICABLE_OPEN | COMPLIED | NOT_APPLICABLE", default: PENDING_EVALUATION, constraints: "enum: {PENDING_EVALUATION, APPLICABLE_OPEN, COMPLIED, NOT_APPLICABLE}" }
      - { name: evaluated_by_mechanic_id, type: string, source: system, description: "FK -> Mechanic.id who evaluated applicability", constraints: "nullable" }

  - name: Part
    parent: null
    common_fields: true
    fields:
      - { name: discrepancy_id, type: string, source: input, description: "FK -> Discrepancy.id this part rectifies" }
      - { name: part_number, type: string, source: input, description: "Manufacturer P/N" }
      - { name: serial_number, type: string, source: input, description: "Serialized part serial; empty string allowed only for CONDITION=NEW bulk hardware", constraints: "nullable" }
      - { name: condition, type: enum, source: input, description: "NEW | OVERHAUL | SERVICEABLE", constraints: "enum: {NEW, OVERHAUL, SERVICEABLE}" }
      - { name: trace_doc_ref, type: string, source: input, description: "8130-3 / yellow-tag / invoice reference; mandatory for OVERHAUL and SERVICEABLE" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Unit acquisition cost" }
      - { name: quantity, type: integer, source: input, description: "Quantity installed/planned; >= 1" }
      - { name: status, type: enum, source: system, description: "REQUESTED | SOURCED | RECEIVED | INSTALLED | RETURNED", default: REQUESTED, constraints: "enum: {REQUESTED, SOURCED, RECEIVED, INSTALLED, RETURNED}" }

  - name: LaborEntry
    parent: WorkOrder
    common_fields: false
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id" }
      - { name: mechanic_id, type: string, source: input, description: "FK -> Mechanic.id who performed the work" }
      - { name: duration_tenths, type: integer, source: input, description: "Duration in tenths of an hour; must be > 0 and a multiple of 3 (0.3h minimum billable increment)" }
      - { name: notes, type: string, source: input, description: "Work performed narrative" }
      - { name: status, type: enum, source: system, description: "POSTED | VOIDED", default: POSTED, constraints: "enum: {POSTED, VOIDED}" }

  - name: LogbookEntry
    parent: Aircraft
    common_fields: false
    fields:
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id" }
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id this entry closes out" }
      - { name: entry_type, type: enum, source: input, description: "INSPECTION_SIGNOFF | REPAIR_RECORD | RTS_STATEMENT", constraints: "enum: {INSPECTION_SIGNOFF, REPAIR_RECORD, RTS_STATEMENT}" }
      - { name: narrative, type: string, source: input, description: "Logbook text per 14 CFR 43.11" }
      - { name: signed_by_mechanic_id, type: string, source: input, description: "FK -> Mechanic.id; for scope_type=ANNUAL the signatory must hold IA" }
      - { name: signed_at, type: datetime, source: system, description: "Server-stamped signing timestamp" }

  - name: Invoice
    parent: WorkOrder
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; unique per WorkOrder (one invoice per WO)" }
      - { name: labor_charge_cents, type: integer, source: computed, description: "Variant A (HOURLY): sum(LaborEntry.duration_tenths)/10 * mechanic.hourly_rate_cents per entry, rounded per entry then summed. Variant B (FLAT_RATE): sum of ChecklistItem.flat_rate_cents where result in {PASS, FAIL}" }
      - { name: parts_charge_cents, type: integer, source: computed, description: "Sum over INSTALLED parts of (quantity * unit_cost_cents); rounding per line before summation" }
      - { name: shop_supplies_cents, type: integer, source: computed, description: "Tiered: 5% of parts_charge_cents when parts_charge_cents < 50000; 8% when parts_charge_cents >= 50000; computed on the rounded parts total" }
      - { name: hangar_fee_cents, type: integer, source: computed, description: "Billing days * daily_rate_cents; billing-day semantics pinned in calculations.hangar_downtime_fee" }
      - { name: tax_cents, type: integer, source: computed, description: "8.25% of (labor_charge_cents + parts_charge_cents + shop_supplies_cents); hangar fee exempt" }
      - { name: total_cents, type: integer, source: computed, description: "labor + parts + shop_supplies + hangar_fee + tax" }
      - { name: warranty_expires_at, type: datetime, source: computed, description: "RETURNED_TO_SERVICE timestamp + 90 days; maintenance warranty window" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PAID | VOIDED", default: DRAFT, constraints: "enum: {DRAFT, ISSUED, PAID, VOIDED}" }

state_machines:
  - entity: WorkOrder
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /api/work-orders/{id}/schedule"
        actor: ShopManager
        preconditions:
          - "WorkOrder.hangar_slot_id references a HangarSlot in RESERVED status"
          - "HangarSlot.aircraft_id == WorkOrder.aircraft_id"
          - "Aircraft.status posture != GROUNDED-by-other-WO (no other WorkOrder for same aircraft in {IN_PROGRESS, WORK_IN_PROGRESS})"
        side_effects:
          - "HangarSlot.status -> OCCUPIED when WorkOrder later enters IN_PROGRESS"
          - "WorkOrder.version += 1"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /api/work-orders/{id}/start"
        actor: Mechanic
        preconditions:
          - "HangarSlot.status == OCCUPIED or RESERVED"
          - "Mechanic.certificate_class in {AP, IA} and Mechanic.status == ACTIVE"
        side_effects:
          - "HangarSlot.status -> OCCUPIED"
          - "Aircraft.airworthiness_posture recomputed (entry into maintenance does not itself ground)"
          - "WorkOrder.version += 1"
      - from: IN_PROGRESS
        to: INSPECTION_COMPLETE
        trigger: "POST /api/work-orders/{id}/complete-inspection"
        actor: Mechanic
        preconditions:
          - "Every ChecklistItem of this WO has result in {PASS, FAIL, NA} (zero PENDING)"
          - "scope_type == ANNUAL requires at least one ChecklistItem with result != NA"
        side_effects:
          - "For every ChecklistItem with result == FAIL, ensure a Discrepancy row exists (auto-create OPEN discrepancies for FAIL items that lack one)"
          - "WorkOrder.open_discrepancy_count recomputed"
          - "WorkOrder.version += 1"
      - from: INSPECTION_COMPLETE
        to: AWAITING_OWNER_APPROVAL
        trigger: "POST /api/work-orders/{id}/submit-for-approval"
        actor: Mechanic
        preconditions:
          - "open_discrepancy_count > 0"
          - "At least one Discrepancy in {OPEN, PENDING_OWNER_DECISION} (otherwise auto-advance would apply)"
        side_effects:
          - "Each OPEN Discrepancy with requires_owner_decision == true transitions to PENDING_OWNER_DECISION"
          - "Each OPEN Discrepancy with requires_owner_decision == false auto-transitions to APPROVED (under-cap auto-approval)"
          - "WorkOrder.version += 1"
      - from: AWAITING_OWNER_APPROVAL
        to: APPROVED
        trigger: "System auto-transition when last PENDING_OWNER_DECISION Discrepancy resolves to APPROVED or DEFERRED or REJECTED"
        actor: system
        preconditions:
          - "Zero Discrepancy rows in {OPEN, PENDING_OWNER_DECISION}"
        side_effects:
          - "WorkOrder.version += 1"
      - from: AWAITING_OWNER_APPROVAL
        to: IN_PROGRESS
        trigger: "POST /api/work-orders/{id}/reopen-inspection (owner requests re-check before deciding)"
        actor: Owner
        preconditions:
          - "Owner.id == Aircraft.owner_id for the WO's aircraft"
        side_effects:
          - "All PENDING_OWNER_DECISION Discrepancies revert to OPEN"
          - "WorkOrder.version += 1"
        note: "Branching revert: owner may send WO back for additional inspection"
      - from: APPROVED
        to: WORK_IN_PROGRESS
        trigger: "POST /api/work-orders/{id}/begin-work"
        actor: Mechanic
        preconditions:
          - "Zero Discrepancy rows in {OPEN, PENDING_OWNER_DECISION}"
          - "At least one Discrepancy in APPROVED or all discrepancies already RECTIFIED/VERIFIED"
        side_effects:
          - "WorkOrder.version += 1"
      - from: WORK_IN_PROGRESS
        to: READY_FOR_RTS
        trigger: "POST /api/work-orders/{id}/ready-for-rts"
        actor: Mechanic
        preconditions:
          - "open_discrepancy_count == 0 (all discrepancies VERIFIED, DEFERRED, or REJECTED)"
          - "All AIRWORTHINESS-severity Discrepancies are VERIFIED (none DEFERRED or REJECTED)"
          - "All Directive rows for aircraft with directive_type == AD have compliance_status in {COMPLIED, NOT_APPLICABLE}"
        side_effects:
          - "Aircraft.airworthiness_posture recomputed -> AIRWORTHY if no other grounding factors"
          - "WorkOrder.version += 1"
      - from: READY_FOR_RTS
        to: RETURNED_TO_SERVICE
        trigger: "POST /api/work-orders/{id}/return-to-service"
        actor: Mechanic
        preconditions:
          - "Mechanic.certificate_class == IA when scope_type == ANNUAL; AP sufficient otherwise"
          - "Aircraft.airworthiness_posture == AIRWORTHY"
          - "A LogbookEntry with entry_type == RTS_STATEMENT exists for this WO"
        side_effects:
          - "HangarSlot.status -> RELEASED"
          - "Invoice row auto-created in DRAFT with all computed fields populated (labor, parts, supplies, hangar, tax, total)"
          - "Invoice.warranty_expires_at := now + 90 days"
          - "WorkOrder.version += 1"
      - from: RETURNED_TO_SERVICE
        to: CLOSED
        trigger: "POST /api/work-orders/{id}/close"
        actor: ShopManager
        preconditions:
          - "Invoice.status in {PAID, VOIDED}"
        side_effects:
          - "WorkOrder.version += 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/work-orders/{id}/cancel"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "HangarSlot (if linked) status -> CANCELLED"
          - "WorkOrder.version += 1"

  - entity: Discrepancy
    initial_state: OPEN
    terminal_states: [VERIFIED, REJECTED, DEFERRED]
    transitions:
      - from: OPEN
        to: PENDING_OWNER_DECISION
        trigger: "WorkOrder.submit-for-approval cascade (estimated_cost_cents >= Owner.approval_cap_cents)"
        actor: system
        preconditions: ["requires_owner_decision == true"]
        side_effects: ["Discrepancy.version += 1"]
      - from: OPEN
        to: APPROVED
        trigger: "WorkOrder.submit-for-approval cascade (estimated_cost_cents < Owner.approval_cap_cents)"
        actor: system
        preconditions: ["requires_owner_decision == false"]
        side_effects: ["Discrepancy.version += 1"]
      - from: PENDING_OWNER_DECISION
        to: APPROVED
        trigger: "POST /api/discrepancies/{id}/decide with decision=APPROVE"
        actor: Owner
        preconditions: ["Owner.id == WorkOrder.aircraft.owner_id"]
        side_effects:
          - "decided_by_owner_id := Owner.id"
          - "If zero remaining PENDING_OWNER_DECISION on WO -> WorkOrder auto-transitions AWAITING_OWNER_APPROVAL -> APPROVED"
          - "WorkOrder.open_discrepancy_count recomputed"
          - "Discrepancy.version += 1"
      - from: PENDING_OWNER_DECISION
        to: REJECTED
        trigger: "POST /api/discrepancies/{id}/decide with decision=REJECT"
        actor: Owner
        preconditions:
          - "Owner.id == WorkOrder.aircraft.owner_id"
          - "Discrepancy.severity == NON_AIRWORTHINESS (AIRWORTHINESS findings cannot be rejected)"
        side_effects:
          - "decided_by_owner_id := Owner.id"
          - "WorkOrder.open_discrepancy_count recomputed"
          - "Discrepancy.version += 1"
      - from: PENDING_OWNER_DECISION
        to: DEFERRED
        trigger: "POST /api/discrepancies/{id}/decide with decision=DEFER"
        actor: Owner
        preconditions:
          - "Owner.id == WorkOrder.aircraft.owner_id"
          - "Discrepancy.severity == NON_AIRWORTHINESS"
        side_effects:
          - "decided_by_owner_id := Owner.id"
          - "WorkOrder.open_discrepancy_count recomputed"
          - "Discrepancy.version += 1"
      - from: APPROVED
        to: RECTIFIED
        trigger: "POST /api/discrepancies/{id}/rectify"
        actor: Mechanic
        preconditions:
          - "Every Part linked to this Discrepancy with status != RETURNED has status == INSTALLED"
          - "At least one Part in INSTALLED status OR discrepancy flagged no-parts-required"
        side_effects:
          - "WorkOrder.open_discrepancy_count recomputed"
          - "Discrepancy.version += 1"
      - from: RECTIFIED
        to: VERIFIED
        trigger: "POST /api/discrepancies/{id}/verify"
        actor: Mechanic
        preconditions:
          - "Verifying mechanic's id != rectifying mechanic's id (segregation of duties)"
          - "For scope_type == ANNUAL WorkOrder, verifying mechanic holds IA"
        side_effects:
          - "WorkOrder.open_discrepancy_count -= 1; verified_discrepancy_count += 1"
          - "If all WO discrepancies terminal and WO in WORK_IN_PROGRESS, WO eligible for ready-for-rts"
          - "Discrepancy.version += 1"
      - from: RECTIFIED
        to: OPEN
        trigger: "POST /api/discrepancies/{id}/verify with outcome=FAIL"
        actor: Mechanic
        preconditions: []
        side_effects:
          - "Discrepancy reopened; rework cycle begins (cyclic loop)"
          - "Aircraft.airworthiness_posture recomputed (may regress to RESTRICTED/GROUNDED)"
          - "Discrepancy.version += 1"

  - entity: HangarSlot
    initial_state: RESERVED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: RESERVED
        to: OCCUPIED
        trigger: "WorkOrder.start cascade"
        actor: system
        preconditions: ["Linked WorkOrder enters IN_PROGRESS"]
        side_effects: ["HangarSlot.version += 1"]
      - from: OCCUPIED
        to: RELEASED
        trigger: "WorkOrder.return-to-service cascade"
        actor: system
        preconditions: []
        side_effects:
          - "Occupancy ledger released; hangar capacity restored"
          - "HangarSlot.version += 1"
      - from: RESERVED
        to: CANCELLED
        trigger: "WorkOrder.cancel cascade OR DELETE /api/hangar-slots/{id}"
        actor: ShopManager
        preconditions: ["No linked WorkOrder in {IN_PROGRESS, WORK_IN_PROGRESS}"]
        side_effects: ["HangarSlot.version += 1"]

  - entity: Part
    initial_state: REQUESTED
    terminal_states: [INSTALLED, RETURNED]
    transitions:
      - from: REQUESTED
        to: SOURCED
        trigger: "POST /api/parts/{id}/mark-sourced"
        actor: PartsClerk
        preconditions:
          - "If condition in {OVERHAUL, SERVICEABLE} then trace_doc_ref non-empty"
        side_effects: ["Part.version += 1"]
      - from: SOURCED
        to: RECEIVED
        trigger: "POST /api/parts/{id}/receive"
        actor: PartsClerk
        preconditions: []
        side_effects: ["Part.version += 1"]
      - from: RECEIVED
        to: INSTALLED
        trigger: "POST /api/parts/{id}/install"
        actor: Mechanic
        preconditions:
          - "Parent Discrepancy.status == APPROVED"
          - "trace_doc_ref non-empty for OVERHAUL/SERVICEABLE"
        side_effects:
          - "Parent Discrepancy installation-progress re-evaluated; if all parts INSTALLED and Discrepancy in APPROVED, Discrepancy becomes eligible for rectify"
          - "Part.version += 1"
      - from: RECEIVED
        to: RETURNED
        trigger: "POST /api/parts/{id}/return"
        actor: PartsClerk
        preconditions: ["Parent Discrepancy.status in {REJECTED, DEFERRED} OR part no longer required"]
        side_effects: ["Part.version += 1"]

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /api/invoices/{id}/issue"
        actor: ShopManager
        preconditions: ["WorkOrder.status == RETURNED_TO_SERVICE"]
        side_effects: ["Invoice.version += 1"]
      - from: ISSUED
        to: PAID
        trigger: "POST /api/invoices/{id}/pay"
        actor: Owner
        preconditions: ["Owner.id == Aircraft.owner_id"]
        side_effects: ["Invoice.version += 1"]
      - from: DRAFT
        to: VOIDED
        trigger: "POST /api/invoices/{id}/void"
        actor: ShopManager
        preconditions: ["Only when issued in error before RTS is finalized"]
        side_effects:
          - "Compensating reissue: a fresh DRAFT Invoice may be regenerated for the same WO"
          - "Invoice.version += 1"

concurrency_rules:
  - rule_id: workorder-schedule-stale-slot
    parent_entity: HangarSlot
    write_endpoint: "POST /api/work-orders"
    occ_field: "expected_hangar_slot_version"
    description: |
      Creating a WorkOrder against a HangarSlot whose version has advanced since
      the client last observed it is rejected with ERR_STALE_VERSION. This covers
      the case where another writer has just rebooked or cancelled the slot and
      the current writer's view of the slot is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: discrepancy-decide-stale
    parent_entity: Discrepancy
    write_endpoint: "POST /api/discrepancies/{id}/decide"
    occ_field: "expected_discrepancy_version"
    description: |
      Posting an owner decision against a Discrepancy whose version has advanced
      since the client last observed it is rejected with ERR_STALE_VERSION; the
      client must re-read the discrepancy before deciding.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: labor_charge
    trigger: "Invoice auto-creation on WorkOrder.return-to-service"
    algorithm: aggregation
    formula: |
      if work_order.pricing_mode == "HOURLY":
        # Variant A: actual hours, per-entry rounding
        labor = 0
        for entry in LaborEntry where work_order_id == wo.id and status == "POSTED":
          hours = entry.duration_tenths / 10
          rate = Mechanic[entry.mechanic_id].hourly_rate_cents
          labor += round_half_up(hours * rate)   # per-entry rounding
      else:
        # Variant B: flat-rate, ignores labor entries entirely
        labor = sum(ChecklistItem.flat_rate_cents
                    where work_order_id == wo.id and result in {"PASS", "FAIL"})
      return labor
    input_set: "LaborEntry POSTED rows for the WO (variant A) OR ChecklistItem rows with result in {PASS, FAIL} (variant B); NA items excluded from variant B"
    constants:
      PER_ENTRY_ROUNDING: half_up_to_cent
    precision: "integer cents; round_half_up per entry (variant A) before summation"
    variants:
      - name: hourly_actual
        when: "WorkOrder.pricing_mode == HOURLY"
        difference: "Bills actual clocked time per mechanic at that mechanic's rate; per-entry cent rounding"
      - name: flat_rate
        when: "WorkOrder.pricing_mode == FLAT_RATE"
        difference: "Bills published task price regardless of time spent; labor entries still recorded but not billed"

  - name: hangar_downtime_fee
    trigger: "Invoice auto-creation on WorkOrder.return-to-service"
    algorithm: threshold
    formula: |
      slot = HangarSlot[work_order.hangar_slot_id]
      # Billing-day semantics: half-open slot interval is converted to
      # CALENDAR DAYS TOUCHED, inclusive of both endpoints' UTC dates.
      start_date = utc_date(slot.starts_at)
      end_date   = utc_date(slot.ends_at)
      billing_days = (end_date - start_date).days + 1
      return billing_days * slot.daily_rate_cents
    input_set: "Single HangarSlot linked to the WorkOrder"
    constants:
      DAY_BOUNDARY: UTC midnight
    precision: "integer cents; no rounding needed"
    variants:
      - name: calendar_day
        when: "Always (pinned semantics)"
        difference: "A 25-hour slot crossing one UTC midnight bills 2 days; a 1-hour slot bills 1 day"

  - name: parts_and_supplies_charge
    trigger: "Invoice auto-creation on WorkOrder.return-to-service"
    algorithm: tiered_pricing
    formula: |
      # Rounding order is pinned: per-line first, then sum.
      parts_total = 0
      for p in Part where discrepancy_id in (Discrepancy ids of wo) and status == "INSTALLED":
        line = round_half_up(p.quantity * p.unit_cost_cents)   # per-line rounding
        parts_total += line
      # Tiered supplies fee keyed on the ROUNDED parts_total:
      if parts_total >= 50000:
        supplies = round_half_up(parts_total * 0.08)
      else:
        supplies = round_half_up(parts_total * 0.05)
      return (parts_total, supplies)
    input_set: "Part rows in INSTALLED status whose parent Discrepancy belongs to this WO; REQUESTED/SOURCED/RECEIVED/RETURNED excluded"
    constants:
      TIER_THRESHOLD_CENTS: 50000
      LOW_RATE: 0.05
      HIGH_RATE: 0.08
    precision: "integer cents; round_half_up per line, then per fee"

  - name: invoice_total
    trigger: "Invoice auto-creation on WorkOrder.return-to-service; recompute on Invoice regeneration"
    algorithm: aggregation
    formula: |
      # Evaluation order is pinned to break the apparent circularity between
      # supplies (keyed on parts) and tax (keyed on labor+parts+supplies):
      # 1. parts  2. supplies(parts)  3. labor  4. hangar  5. tax  6. total
      parts   = parts_and_supplies_charge.parts_total
      supplies= parts_and_supplies_charge.supplies
      labor   = labor_charge
      hangar  = hangar_downtime_fee
      taxable = labor + parts + supplies          # hangar fee is tax-exempt
      tax     = round_half_up(taxable * 0.0825)
      total   = labor + parts + supplies + hangar + tax
      return total
    input_set: "All four component calculations above for the same WO"
    constants:
      TAX_RATE: 0.0825
    precision: "integer cents; round_half_up on tax only (components already rounded)"

  - name: airworthiness_posture
    trigger: "Any change to Discrepancy status, Directive compliance_status, or WorkOrder status for the aircraft"
    algorithm: constraint_propagation
    formula: |
      ads_open = count(Directive where aircraft_id == a.id
                       and directive_type == "AD"
                       and compliance_status == "APPLICABLE_OPEN")
      air_disc_open = count(Discrepancy where work_order.aircraft_id == a.id
                            and severity == "AIRWORTHINESS"
                            and status in {"OPEN","PENDING_OWNER_DECISION","APPROVED","RECTIFIED"})
      any_disc_open = count(Discrepancy where work_order.aircraft_id == a.id
                            and status in {"OPEN","PENDING_OWNER_DECISION","APPROVED","RECTIFIED"})
      if ads_open > 0 or air_disc_open > 0:  return "GROUNDED"
      if any_disc_open > 0:                  return "RESTRICTED"
      return "AIRWORTHY"
    input_set: "Directive rows for aircraft; Discrepancy rows across ALL non-CANCELLED WorkOrders of the aircraft"
    constants: {}
    precision: "n/a (enum derivation)"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path id and FK reference resolves to an existing row, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "Target entity in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: business_safety
    check: "Regulatory gate: RTS requires zero APPLICABLE_OPEN ADs and zero non-terminal AIRWORTHINESS discrepancies; verify requires segregation of duties; ANNUAL signoff requires IA certificate"
    error_id: ERR_AIRWORTHINESS_BLOCKED
    http_status: 422
    applies_to: "POST /api/work-orders/{id}/ready-for-rts, POST /api/work-orders/{id}/return-to-service, POST /api/discrepancies/{id}/verify, POST /api/logbook-entries"
  - priority: 6
    category: business_constraint
    check: "HangarSlot temporal overlap: for same hangar_code, half-open [starts_at, ends_at) must not intersect another slot in {RESERVED, OCCUPIED}; touching endpoints (a.ends_at == b.starts_at) are permitted"
    error_id: ERR_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /api/hangar-slots"
  - priority: 7
    category: business_constraint
    check: "Mechanic scheduling buffer: a LaborEntry may not be posted for a mechanic whose existing same-day entries (plus 30-minute buffer) would exceed 10 billable hours cumulative"
    error_id: ERR_MECHANIC_OVERBOOKED
    http_status: 409
    applies_to: "POST /api/work-orders/{id}/labor-entries"
  - priority: 8
    category: business_referential
    check: "Traceability: Part with condition in {OVERHAUL, SERVICEABLE} MUST carry non-empty trace_doc_ref at mark-sourced and install time"
    error_id: ERR_TRACEABILITY_MISSING
    http_status: 422
    applies_to: "POST /api/parts/{id}/mark-sourced, POST /api/parts/{id}/install"
  - priority: 9
    category: business_fiscal
    check: "Owner approval cap: Discrepancy with estimated_cost_cents >= Owner.approval_cap_cents cannot auto-approve; explicit owner decision required"
    error_id: ERR_OWNER_DECISION_REQUIRED
    http_status: 422
    applies_to: "POST /api/work-orders/{id}/submit-for-approval (informational gate), POST /api/discrepancies/{id}/decide by non-owner"
  - priority: 10
    category: business_fiscal
    check: "Invoice immutability once ISSUED: no further labor entries, part installs, or discrepancy state changes on a WO whose Invoice is ISSUED or PAID"
    error_id: ERR_INVOICE_LOCKED
    http_status: 409
    applies_to: "POST /api/work-orders/{id}/labor-entries, POST /api/parts/{id}/install, POST /api/discrepancies/{id}/rectify"
  - priority: 11
    category: business_temporal
    check: "HangarSlot.ends_at must be strictly greater than starts_at and slot duration <= 30 days"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /api/hangar-slots"

