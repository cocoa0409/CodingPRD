            - { call: "GET /api/units?project_id=${proj}", payload: {}, as: ProjectCoordinator, captures: { unit: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/inspections", payload: { unit_id: "${unit}", project_id: "${proj}", inspection_type: "ACCEPTANCE", inspector_technician_id: "${t_inst}", scheduled_start: "2026-08-13T10:00:00Z", scheduled_end: "2026-08-13T09:00:00Z" }, as: ProjectCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TECHNICIAN_NOT_CERTIFIED (http 403): safety priority 6 beats temporal priority 10"
            - "error_id != ERR_INVALID_DATE_RANGE"
            - "No inspection created (GET /api/inspections?unit_id=${unit} returns empty array)"

      - name: work_order_create_existence_beats_referential
        grounds:
          - validations[priority=4]
          - validations[priority=8]
          - errors[ERR_PROJECT_NOT_FOUND]
          - errors[ERR_CONTRACTOR_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair (existence, business_referential): one creation violates both — project_id
          does not exist AND the referenced contractor is SUSPENDED. Priority 4 must win:
          ERR_PROJECT_NOT_FOUND (404), never ERR_CONTRACTOR_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Contractor BuildCo registered then SUSPENDED"
          setup_api_calls:
            - { call: "POST /api/contractors", payload: { company_name: "BuildCo", license_number: "LIC-100", license_state_code: "CA" }, as: DealerAdmin, captures: { gc: $.data.id } }
            - { call: "POST /api/contractors/${gc}/suspend", payload: {}, as: DealerAdmin }
          trigger:
            - { call: "POST /api/work-orders", payload: { project_id: "00000000-0000-0000-0000-000000000000", contractor_id: "${gc}", scope_description: "Pit deepening", scheduled_start_date: "2026-08-10T08:00:00Z", scheduled_end_date: "2026-08-15T17:00:00Z", estimated_cost: 5000.00 }, as: ProjectCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PROJECT_NOT_FOUND (http 404): existence priority 4 beats referential priority 8"
            - "error_id != ERR_CONTRACTOR_NOT_ACTIVE"

