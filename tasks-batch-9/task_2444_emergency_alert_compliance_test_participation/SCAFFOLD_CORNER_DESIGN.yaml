  # ===========================================================================
  # SECTION 8 — Cross-cutting complexity layers (§1.0 complexity_layers:
  # cascading_side_effects, dual_variant_calculation, selector_policy,
  # optimistic_concurrency; §1.2.1 concurrency_rules)
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_rule_assignment_create_stale_station_rejects_then_accepts_a_refreshed_version
        claim_type: optimistic_concurrency
        grounds:
          - "§1.2.1 concurrency_rules[assignment-create-stale-station]: parent_entity Station, write_endpoint 'POST /monitoring-assignments', occ_field 'expected_station_version', error_id ERR_STALE_STATION_VERSION, http_status 412"
          - "§1.5 POST /monitoring-assignments side effects include 'Station.version incremented by 1' and 'Station recompute event'"
          - "§1.4 priority 6 'optimistic concurrency: ERR_STALE_STATION_VERSION | ERR_STALE_TEST_EVENT_VERSION'"
        distinguishing_aspect: "The station's version advances only on successful assignment writes: the same captured value is valid exactly once, the 412 leaves version and every derived counter untouched, and re-reading the station yields a value that works immediately."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; plan KS 2026-R1 requiring ['PEP', 'SATELLITE'] activated; station KWEA; dev1 and dev2 both READY."
            - "sv1 is read once, before any assignment exists; the first create consumes it and bumps Station.version, so the second create reusing sv1 is stale by exactly one."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP", "SATELLITE"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
            - call: "POST /eas-devices"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", model_code: "DASDEC-3", device_role: "DECODER", firmware_version: "5.2.1" }
              captures: { dev1: "$.data.id" }
            - call: "POST /eas-devices/${dev1}/readiness-check"
              as: StationEngineer
              as_user_id: eng-1
              payload: { self_test_passed: true, firmware_current: true }
            - call: "POST /eas-devices"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", model_code: "SAGE-3644", device_role: "DECODER", firmware_version: "2.0.9" }
              captures: { dev2: "$.data.id" }
            - call: "POST /eas-devices/${dev2}/readiness-check"
              as: StationEngineer
              as_user_id: eng-1
              payload: { self_test_passed: true, firmware_current: true }
            - call: "GET /stations/${station_id}"
              as: StationEngineer
              as_user_id: eng-1
              captures: { sv1: "$.data.version" }
          trigger:
            - call: "POST /monitoring-assignments"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", device_id: "${dev1}", source_type: "PEP", source_call_sign: "WXPEP", expected_station_version: "${sv1}" }
              captures: { ma1: "$.data.id" }
            - call: "POST /monitoring-assignments"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", device_id: "${dev2}", source_type: "SATELLITE", source_call_sign: "PEPSAT", expected_station_version: "${sv1}" }
              captures: { e_stale: "$.data.error_id" }
            - call: "GET /stations/${station_id}"
              as: StationEngineer
              as_user_id: eng-1
              captures: { sv2: "$.data.version" }
            - call: "POST /monitoring-assignments"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", device_id: "${dev2}", source_type: "SATELLITE", source_call_sign: "PEPSAT", expected_station_version: "${sv2}" }
              captures: { ma2: "$.data.id" }
