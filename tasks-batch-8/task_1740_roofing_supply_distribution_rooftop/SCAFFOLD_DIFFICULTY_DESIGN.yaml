            - call: "POST /roofing/deliveries/${dlv_i1}/fail"
              payload: {}
              as: Dispatcher
            - call: "GET /roofing/inventory-lots/${lot_i1}"
              payload: {}
              as: WarehouseClerk
              captures: { lot_i1_on: $.data.on_hand_bundles, lot_i1_res: $.data.reserved_bundles }
          assert:
            - "InventoryLot.${lot_i1}.on_hand_bundles == 100 (restored after fail)"
            - "InventoryLot.${lot_i1}.reserved_bundles == 30 (restored after fail)"
            - "on_hand + reserved == 130, identical to pre-dispatch value"

      - name: credit_ledger_conserved_across_invoice_posting
        grounds:
          - calculations.credit_available
          - entities.ContractorAccount.fields.open_balance_cents
          - entities.ContractorAccount.fields.pending_delivery_hold_cents
        distinguishing_aspect: |
          Conserved quantity = open_balance_cents + pending_delivery_hold_cents
          on the ContractorAccount. Invoicing an order moves total_cents from
          pending_delivery_hold_cents into open_balance_cents; the sum is
          unchanged by the forward action, and is a different conserved
          quantity than inventory bundles.
        test_recipe:
          setup:
            - "Confirmed order of total 60000 (pending_delivery_hold=60000, open=0)"
          setup_api_calls:
            - call: "POST /roofing/branches"
              payload: { branch_code: "BR-I2", name: "Inv2", rooftop_delivery_capacity_per_day: 4, conveyor_fleet_size: 2, crane_available: true }
              as: PlatformAdmin
              captures: { br_i2: $.data.id }
            - call: "POST /roofing/products"
              payload: { sku: "SH-I2", manufacturer_name: "Acme", color_code: "BRN", bundles_per_square: 3.0, base_price_per_bundle_cents: 2000 }
              as: PlatformAdmin
              captures: { prod_i2: $.data.id }
            - call: "POST /roofing/branches/${br_i2}/inventory-lots"
              payload: { product_id: "${prod_i2}", lot_code: "LOT-I2", on_hand_bundles: 500 }
              as: WarehouseClerk
            - call: "POST /roofing/contractor-accounts"
              payload: { company_name: "Ledger Co", credit_limit_cents: 10000000, pricing_tier: "STANDARD" }
              as: CreditAnalyst
              captures: { ca_i2: $.data.id }
            - call: "POST /roofing/contractor-accounts/${ca_i2}/job-accounts"
              payload: { job_name: "Job I2", site_address: "15 Cedar Ave" }
              as: CreditAnalyst
              captures: { ja_i2: $.data.id }
            - call: "POST /roofing/job-accounts/${ja_i2}/takeoffs"
              payload: { product_id: "${prod_i2}", roof_squares: 10.0, waste_factor_pct: 0, valley_ridge_linear_feet: 0  }
              as: SalesRep
              captures: { tk_i2: $.data.id }
            - call: "POST /roofing/takeoffs/${tk_i2}/quote"
              payload: {}
              as: SalesRep
            - call: "POST /roofing/takeoffs/${tk_i2}/convert"
              payload: { branch_id: "${br_i2}" }
              as: Contractor
              as_user_id: "${ca_i2}"
              captures: { ord_i2: $.data.id }
            - call: "GET /roofing/contractor-accounts/${ca_i2}"
              payload: {}
              as: CreditAnalyst
              captures: { ca_i2_v: $.data.version }
            - call: "POST /roofing/orders/${ord_i2}/confirm"
              payload: { expected_contractor_account_version: "${ca_i2_v}" }
              as: Contractor
              as_user_id: "${ca_i2}"
            - call: "POST /roofing/branches/${br_i2}/delivery-slots"
              payload: { slot_date: "2026-08-16", window: "AM", equipment_type: "GROUND", capacity: 2 }
              as: Dispatcher
              captures: { slot_i2: $.data.id }
            - call: "POST /roofing/orders/${ord_i2}/deliveries"
              payload: { delivery_slot_id: "${slot_i2}", equipment_type: "GROUND" }
              as: Dispatcher
              captures: { dlv_i2: $.data.id }
            - call: "POST /roofing/deliveries/${dlv_i2}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /roofing/deliveries/${dlv_i2}/complete"
              payload: {}
              as: Dispatcher
            - call: "GET /roofing/orders/${ord_i2}"
              payload: {}
              as: CreditAnalyst
              captures: { ord_i2_total: $.data.total_cents }
          trigger:
            - call: "POST /roofing/orders/${ord_i2}/invoice"
              payload: {}
              as: CreditAnalyst
            - call: "GET /roofing/contractor-accounts/${ca_i2}"
              payload: {}
              as: CreditAnalyst
              captures: { ca_i2_open: $.data.open_balance_cents, ca_i2_pend: $.data.pending_delivery_hold_cents }
          assert:
            - "ContractorAccount.${ca_i2}.open_balance_cents == ${ord_i2_total} (invoice moved total from hold to open)"
            - "ContractorAccount.${ca_i2}.pending_delivery_hold_cents == 0"
            - "open_balance_cents + pending_delivery_hold_cents after invoice == pending_delivery_hold_cents before invoice (conserved)"
