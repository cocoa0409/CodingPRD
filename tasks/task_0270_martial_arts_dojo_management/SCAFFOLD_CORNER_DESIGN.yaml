              captures: { cls_id: $.data.id }
            - call: "POST /dojo/attendances"
              payload: { enrollment_id: "${enr_id}", class_session_id: "${cls_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /dojo/promotion-tests"
              payload: { enrollment_id: "${enr_id}", examiner_instructor_id: "${ins_id}", scheduled_for: "2026-01-03T00:00:00Z" }
              as: Instructor
              as_user_id: "${ins_id}"
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /dojo/promotion-tests/${t_id}/grade"
              payload: { score: 85 }
              as: Instructor
              as_user_id: "${ins_id}"
            - call: "GET /dojo/enrollments/${enr_id}"
              payload: {}
              as: FrontDesk
              captures: { enr_after: $.data }
          assert:
            - "Enrollment.${enr_id}.current_rank_code == GREEN immediately after grade"
            - "Enrollment.${enr_id}.status == COMPLETED (GREEN terminal) and rank_attendance_count == 0 (reset)"
