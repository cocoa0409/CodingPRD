            - { call: "POST /aml/certificate-deposits/${dep_id}/advance", payload: {}, as: OperationsAnalyst, captures: { st3: "$.data.status" } }
            - { call: "POST /aml/certificate-deposits/${dep_id}/advance", payload: {}, as: OperationsAnalyst, captures: { st4: "$.data.status", hold_rel2: "$.data.hold_release_date" } }
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/maintenance/run-daily-sweep", payload: {}, as: SystemAdmin }
