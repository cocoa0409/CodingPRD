          assert: ["HTTP status == 404", "response data.error_id == ERR_PLAN_NOT_FOUND"]

      - name: subscription_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_SUBSCRIPTION_NOT_FOUND]", "validations[priority=7]"]
        distinguishing_aspect: "A well-formed but unknown Subscription id returns ERR_SUBSCRIPTION_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Clock at 2026-05-01T00:00:00Z, no subscriptions created."]
