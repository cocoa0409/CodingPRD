# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Probe)
# Task 2820 — Pizza Delivery Zone Mapping & Driver Reimbursement
#
# Taxonomy: references/claim-extraction-guide.md. `section:` values are the
# guide's nine sections; `claim_type:` values are its per-section table rows.
# Every instance grounds only in elements declared in SCAFFOLD.yaml §1.1–§1.7,
# and every numeric literal in every `assert:` was computed by executing the
# relevant §1.3 formula as code before being written here.
#
# Shared literal geometry (store origin 39000000 / -84000000, MICRO_PER_MILE
# 15000, zone ring 38.90..39.20 N by 84.20..83.80 W, base_drive_minutes 6,
# minutes_per_mile 3, max_drive_time_minutes 40, off-peak clock):
#   addr_a  (39030000, -84015000) grid  3.00 drive 15 IN_ZONE     BASE tier
#   addr_a2 (39015000, -84030000) grid  3.00 drive 15 IN_ZONE     BASE tier
#   addr_d  (39094950, -84000000) grid  6.33 drive 25 IN_ZONE     MID  tier
#   addr_p  (39003750, -84000000) grid  0.25 drive  7 IN_ZONE     BASE tier
#   addr_r  (39066750, -84033375) grid  6.68 drive 27 IN_ZONE     FAR  tier
#   addr_e  (39000000, -84200000) grid 13.33 drive 46 EDGE  (exactly on the ring)
#   addr_o  (39000000, -84200001) grid 13.33 drive 46 OUT_OF_ZONE (one micro-degree out)
#   addr_c  (39400000, -84000000) grid 26.67 drive 87 OUT_OF_ZONE (far outside)
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: store_creation_returns_declared_fields_and_zeroed_aggregates
        claim_type: creation
        grounds:
          - entities.Store
          - endpoints.POST_stores
          - entities.Store.fields.cash_collected_total_cents
          - entities.Store.fields.unassigned_order_count
        distinguishing_aspect: "A store created with every optional config supplied echoes all input fields verbatim and initialises all four computed aggregates to 0/null, with version 1."
        test_recipe:
          setup:
            - "An empty database with the logical clock at 2026-08-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /store-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: StoreManager
              as_user_id: "boot"
          trigger:
            - call: "POST /store-ops/stores"
              payload: { store_number: "7421", name: "Riverside", latitude_micro: 39000000, longitude_micro: -84000000, promise_minutes: 30, delivery_fee_cents: 399, cash_limit_cents: 5000, hot_bag_count: 4, max_stacked_stops: 3, handoff_minutes_per_stop: 6, dispatch_reset_buffer_minutes: 10, service_posture: "OPEN" }
              as: StoreManager
              as_user_id: "boot"
              captures: { store_id: $.data.id }
          assert:
            - "HTTP 201 and the envelope carries response_type == 'object' plus meta.api_request_id and meta.api_request_timestamp"
            - "Store.${store_id}.store_number == '7421', name == 'Riverside', latitude_micro == 39000000, longitude_micro == -84000000"
            - "Store.${store_id}.promise_minutes == 30, delivery_fee_cents == 399, cash_limit_cents == 5000, hot_bag_count == 4, max_stacked_stops == 3, handoff_minutes_per_stop == 6, dispatch_reset_buffer_minutes == 10, service_posture == 'OPEN'"
            - "Store.${store_id}.cash_collected_total_cents == 0, safe_deposit_total_cents == 0, unassigned_order_count == 0"
            - "Store.${store_id}.active_zone_version_number == null, because no ZoneVersion exists yet"
            - "Store.${store_id}.version == 1"

      - name: store_optional_config_defaults_are_applied_when_omitted
        claim_type: defaults
        grounds:
          - entities.Store.fields.promise_minutes
          - entities.Store.fields.delivery_fee_cents
          - entities.Store.fields.cash_limit_cents
          - entities.Store.fields.hot_bag_count
          - entities.Store.fields.max_stacked_stops
          - entities.Store.fields.service_posture
        distinguishing_aspect: "Omitting all eight optional config fields yields exactly the §1.1 declared defaults 30 / 399 / 5000 / 4 / 3 / 6 / 10 / OPEN rather than nulls or zeros."
        test_recipe:
          setup:
            - "An empty database with the logical clock at 2026-08-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /store-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: StoreManager
              as_user_id: "boot"
          trigger:
            - call: "POST /store-ops/stores"
              payload: { store_number: "9001", name: "Bare Minimum", latitude_micro: 39000000, longitude_micro: -84000000 }
              as: StoreManager
              as_user_id: "boot"
              captures: { store_id: $.data.id }
          assert:
            - "Store.${store_id}.promise_minutes == 30"
            - "Store.${store_id}.delivery_fee_cents == 399"
            - "Store.${store_id}.cash_limit_cents == 5000"
            - "Store.${store_id}.hot_bag_count == 4"
            - "Store.${store_id}.max_stacked_stops == 3"
            - "Store.${store_id}.handoff_minutes_per_stop == 6"
            - "Store.${store_id}.dispatch_reset_buffer_minutes == 10"
            - "Store.${store_id}.service_posture == 'OPEN'"

      - name: store_system_fields_are_server_generated_and_version_starts_at_one
        claim_type: system_fields
        grounds:
          - entities.Store
          - endpoints.POST_stores
          - endpoints.PATCH_store
        distinguishing_aspect: "id, created_at, updated_at and version are minted by the server on creation (version 1, created_at == the logical clock) and version advances to 2 on the first PATCH while id and created_at stay fixed."
        test_recipe:
          setup:
            - "An empty database with the logical clock at 2026-08-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /store-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: StoreManager
              as_user_id: "boot"
            - call: "POST /store-ops/stores"
              payload: { store_number: "7421", name: "Riverside", latitude_micro: 39000000, longitude_micro: -84000000 }
              as: StoreManager
              as_user_id: "boot"
              captures: { store_id: $.data.id, store_created_at: $.data.created_at, store_v1: $.data.version }
          trigger:
            - call: "PATCH /store-ops/stores/${store_id}"
              payload: { name: "Riverside East" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { store_v2: $.data.version }
          assert:
            - "${store_v1} == 1 and ${store_created_at} == '2026-08-05T09:00:00Z', both minted by the server"
            - "${store_v2} == 2"
            - "Store.${store_id}.id == ${store_id} and created_at == ${store_created_at}, unchanged by the PATCH"
            - "Store.${store_id}.name == 'Riverside East' and store_number == '7421'"

      - name: order_creation_missing_required_customer_phone_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Order.fields.customer_phone
          - validations.priority_8
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "customer_phone is source: input with no default, so omitting it fails at §1.4 priority 8 with ERR_INVALID_REQUEST (400) and no Order row is created."
        test_recipe:
          setup:
            - "A store with an ACTIVE zone version and one IN_ZONE address at grid 3.00 miles."
          setup_api_calls:
            - call: "POST /store-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: StoreManager
              as_user_id: "boot"
            - call: "POST /store-ops/stores"
              payload: { store_number: "7421", name: "Riverside", latitude_micro: 39000000, longitude_micro: -84000000 }
              as: StoreManager
              as_user_id: "boot"
              captures: { store_id: $.data.id, store_v1: $.data.version }
            - call: "POST /store-ops/zone-versions"
              payload: { store_id: "${store_id}", polygon: [{ latitude_micro: 38900000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -83800000 }, { latitude_micro: 38900000, longitude_micro: -83800000 }], effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", expected_store_version: "${store_v1}", max_drive_time_minutes: 40, base_drive_minutes: 6, minutes_per_mile: 3, peak_surcharge_minutes: 7, barrier_surcharge_minutes: 4 }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { zv1_id: $.data.id }
            - call: "POST /store-ops/zone-versions/${zv1_id}/activate"
              payload: {}
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /store-ops/service-addresses"
              payload: { store_id: "${store_id}", line1: "12 Oak St", latitude_micro: 39030000, longitude_micro: -84015000, crosses_barrier: false }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { addr_a_id: $.data.id }
          trigger:
            - call: "POST /store-ops/orders"
              payload: { store_id: "${store_id}", service_address_id: "${addr_a_id}", customer_name: "Ann", food_subtotal_cents: 2200, payment_method: "CARD" }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400 with ${err_id} == 'ERR_INVALID_REQUEST' and response_type == 'error'"
            - "GET /store-ops/orders?store_id=${store_id} reports total_count 0 — no partial Order was written"
            - "Store.${store_id}.unassigned_order_count == 0"

      - name: driver_creation_with_an_unknown_vehicle_class_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.Driver.fields.vehicle_class
          - validations.priority_8
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "vehicle_class is constrained to CAR | SUV | SCOOTER, so the unknown member HOVERBOARD is an ERR_INVALID_REQUEST (400) at priority 8, before any Driver row or qualification state exists."
        test_recipe:
          setup:
            - "A store with no drivers."
          setup_api_calls:
            - call: "POST /store-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: StoreManager
              as_user_id: "boot"
            - call: "POST /store-ops/stores"
              payload: { store_number: "7421", name: "Riverside", latitude_micro: 39000000, longitude_micro: -84000000 }
              as: StoreManager
              as_user_id: "boot"
              captures: { store_id: $.data.id }
          trigger:
            - call: "POST /store-ops/drivers"
              payload: { store_id: "${store_id}", full_name: "Dana Ortiz", license_number: "DL-1001", vehicle_class: "HOVERBOARD" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400 with ${err_id} == 'ERR_INVALID_REQUEST'"
            - "GET /store-ops/drivers?store_id=${store_id} reports total_count 0"

      - name: service_address_computed_fields_are_derived_at_creation
        claim_type: computed_fields
        grounds:
          - calculations.grid_distance_miles
          - calculations.drive_time_estimate
          - calculations.zone_state_classification
          - entities.ServiceAddress.fields.grid_miles
          - entities.ServiceAddress.fields.drive_time_estimate_minutes
          - entities.ServiceAddress.fields.evaluated_zone_version_number
        distinguishing_aspect: "An address 94950 micro-degrees north of the store yields grid_miles 6.33, drive_time_estimate_minutes 25 and zone_state IN_ZONE computed at creation, with evaluated_at pinned to the logical clock and effective_zone_state mirroring zone_state while no override exists."
        test_recipe:
          setup:
            - "A store whose ACTIVE zone version 1 is in force at the logical clock 2026-08-05T09:00:00Z (off-peak)."
          setup_api_calls:
            - call: "POST /store-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: StoreManager
              as_user_id: "boot"
            - call: "POST /store-ops/stores"
              payload: { store_number: "7421", name: "Riverside", latitude_micro: 39000000, longitude_micro: -84000000 }
              as: StoreManager
              as_user_id: "boot"
              captures: { store_id: $.data.id, store_v1: $.data.version }
            - call: "POST /store-ops/zone-versions"
              payload: { store_id: "${store_id}", polygon: [{ latitude_micro: 38900000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -83800000 }, { latitude_micro: 38900000, longitude_micro: -83800000 }], effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", expected_store_version: "${store_v1}", max_drive_time_minutes: 40, base_drive_minutes: 6, minutes_per_mile: 3, peak_surcharge_minutes: 7, barrier_surcharge_minutes: 4 }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { zv1_id: $.data.id, zv1_number: $.data.version_number }
            - call: "POST /store-ops/zone-versions/${zv1_id}/activate"
              payload: {}
              as: StoreManager
              as_user_id: "${store_id}"
          trigger:
            - call: "POST /store-ops/service-addresses"
              payload: { store_id: "${store_id}", line1: "900 North Rd", latitude_micro: 39094950, longitude_micro: -84000000, crosses_barrier: false }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { addr_d_id: $.data.id }
          assert:
            - "ServiceAddress.${addr_d_id}.grid_miles == 6.33, from round_half_up(94950 / 15000, 2)"
            - "ServiceAddress.${addr_d_id}.drive_time_estimate_minutes == 25, from 6 + ceil(6.33 * 3) + 0"
            - "ServiceAddress.${addr_d_id}.zone_state == 'IN_ZONE' because 25 <= 40"
            - "ServiceAddress.${addr_d_id}.effective_zone_state == 'IN_ZONE' and override_state == null and override_until == null"
            - "ServiceAddress.${addr_d_id}.evaluated_at == '2026-08-05T09:00:00Z' and evaluated_zone_version_number == ${zv1_number}"

      - name: zone_version_retrieval_returns_the_stored_polygon_and_thresholds
        claim_type: retrieval
        grounds:
          - entities.ZoneVersion
          - endpoints.GET_zone_version
        distinguishing_aspect: "A GET on a DRAFT zone version returns the four submitted vertices in submission order together with the five drive-time parameters and status DRAFT, before any activation."
        test_recipe:
          setup:
            - "A store with one DRAFT zone version carrying non-default drive-time parameters."
          setup_api_calls:
            - call: "POST /store-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: StoreManager
              as_user_id: "boot"
            - call: "POST /store-ops/stores"
              payload: { store_number: "7421", name: "Riverside", latitude_micro: 39000000, longitude_micro: -84000000 }
              as: StoreManager
              as_user_id: "boot"
              captures: { store_id: $.data.id, store_v1: $.data.version }
            - call: "POST /store-ops/zone-versions"
              payload: { store_id: "${store_id}", polygon: [{ latitude_micro: 38900000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -83800000 }, { latitude_micro: 38900000, longitude_micro: -83800000 }], effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", expected_store_version: "${store_v1}", max_drive_time_minutes: 40, base_drive_minutes: 6, minutes_per_mile: 3, peak_surcharge_minutes: 7, barrier_surcharge_minutes: 4 }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { zv1_id: $.data.id }
          trigger:
            - call: "GET /store-ops/zone-versions/${zv1_id}"
              payload: {}
              as: Dispatcher
              as_user_id: "disp-1"
          assert:
            - "HTTP 200 with ZoneVersion.${zv1_id}.store_id == ${store_id} and status == 'DRAFT'"
            - "ZoneVersion.${zv1_id}.polygon has exactly 4 vertices, the first being { latitude_micro: 38900000, longitude_micro: -84200000 } in submission order"
            - "ZoneVersion.${zv1_id}.max_drive_time_minutes == 40, base_drive_minutes == 6, minutes_per_mile == 3, peak_surcharge_minutes == 7, barrier_surcharge_minutes == 4"
            - "ZoneVersion.${zv1_id}.effective_from == '2026-07-01T00:00:00Z', effective_to == '2026-09-01T00:00:00Z', activated_at == null, supersedes_zone_version_id == null"

      - name: service_addresses_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_service_addresses
          - response_envelope.pagination_fields
          - entities.ServiceAddress.fields.zone_state
        distinguishing_aspect: "With three addresses of one store, limit 2 / offset 0 returns 2 rows with total_count 3 and has_more true, while limit 2 / offset 2 returns 1 row with has_more false; adding zone_state=IN_ZONE narrows total_count to 2."
        test_recipe:
          setup:
            - "A store with an ACTIVE zone version and three addresses: two IN_ZONE at grid 3.00 and 6.33 miles, one OUT_OF_ZONE far outside the ring."
          setup_api_calls:
            - call: "POST /store-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: StoreManager
              as_user_id: "boot"
            - call: "POST /store-ops/stores"
              payload: { store_number: "7421", name: "Riverside", latitude_micro: 39000000, longitude_micro: -84000000 }
              as: StoreManager
              as_user_id: "boot"
              captures: { store_id: $.data.id, store_v1: $.data.version }
            - call: "POST /store-ops/zone-versions"
              payload: { store_id: "${store_id}", polygon: [{ latitude_micro: 38900000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -83800000 }, { latitude_micro: 38900000, longitude_micro: -83800000 }], effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", expected_store_version: "${store_v1}", max_drive_time_minutes: 40, base_drive_minutes: 6, minutes_per_mile: 3, peak_surcharge_minutes: 7, barrier_surcharge_minutes: 4 }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { zv1_id: $.data.id }
            - call: "POST /store-ops/zone-versions/${zv1_id}/activate"
              payload: {}
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /store-ops/service-addresses"
              payload: { store_id: "${store_id}", line1: "12 Oak St", latitude_micro: 39030000, longitude_micro: -84015000, crosses_barrier: false }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { addr_a_id: $.data.id }
            - call: "POST /store-ops/service-addresses"
              payload: { store_id: "${store_id}", line1: "900 North Rd", latitude_micro: 39094950, longitude_micro: -84000000, crosses_barrier: false }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { addr_d_id: $.data.id }
            - call: "POST /store-ops/service-addresses"
              payload: { store_id: "${store_id}", line1: "40 Far Ln", latitude_micro: 39400000, longitude_micro: -84000000, crosses_barrier: false }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { addr_c_id: $.data.id }
          trigger:
            - call: "GET /store-ops/service-addresses"
              payload: { store_id: "${store_id}", limit: 2, offset: 0 }
              as: Dispatcher
              as_user_id: "disp-1"
            - call: "GET /store-ops/service-addresses"
              payload: { store_id: "${store_id}", limit: 2, offset: 2 }
              as: Dispatcher
              as_user_id: "disp-1"
            - call: "GET /store-ops/service-addresses"
              payload: { store_id: "${store_id}", zone_state: "IN_ZONE", limit: 10, offset: 0 }
              as: Dispatcher
              as_user_id: "disp-1"
          assert:
            - "the first call returns response_type == 'array' with 2 items, total_count 3, has_more true, limit 2, offset 0"
            - "the second call returns 1 item, total_count 3, has_more false, offset 2"
            - "the third call returns exactly the 2 IN_ZONE addresses ${addr_a_id} and ${addr_d_id} with total_count 2 and has_more false"
            - "${addr_c_id} is absent from the filtered result because its zone_state is OUT_OF_ZONE"

      - name: get_dispatch_with_an_unknown_id_returns_dispatch_not_found
        claim_type: not_found
        grounds:
          - validations.priority_6
          - errors.ERR_DISPATCH_NOT_FOUND
          - endpoints.GET_dispatch
        distinguishing_aspect: "A well-formed UUID that matches no Dispatch resolves at §1.4 priority 6 to ERR_DISPATCH_NOT_FOUND (404), not to a 200 with an empty body."
        test_recipe:
          setup:
            - "An empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /store-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: StoreManager
              as_user_id: "boot"
          trigger:
            - call: "GET /store-ops/dispatches/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 with ${err_id} == 'ERR_DISPATCH_NOT_FOUND' and response_type == 'error'"
            - "the error payload carries a non-empty message field"

      - name: mvr_check_is_immutable_and_exposes_no_version_field
        claim_type: immutability
        grounds:
          - entities.MvrCheck
          - entities.MvrCheck.fields.recorded_by_user_id
          - endpoints.GET_mvr_check
        distinguishing_aspect: "MvrCheck is declared common_fields: false, so its read carries no version and no updated_at and §1.5 declares no update or delete endpoint for it; recorded_by_user_id is stamped from X-User-ID rather than the body."
        test_recipe:
          setup:
            - "A store with one APPLICANT driver."
          setup_api_calls:
            - call: "POST /store-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: StoreManager
              as_user_id: "boot"
            - call: "POST /store-ops/stores"
              payload: { store_number: "7421", name: "Riverside", latitude_micro: 39000000, longitude_micro: -84000000 }
              as: StoreManager
              as_user_id: "boot"
              captures: { store_id: $.data.id }
            - call: "POST /store-ops/drivers"
              payload: { store_id: "${store_id}", full_name: "Dana Ortiz", license_number: "DL-1001", vehicle_class: "CAR" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { drv_id: $.data.id }
            - call: "POST /store-ops/drivers/${drv_id}/mvr-checks"
              payload: { result: "CLEAR", violation_points: 0, checked_on: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { mvr_id: $.data.id, mvr_recorder: $.data.recorded_by_user_id }
          trigger:
            - call: "GET /store-ops/mvr-checks/${mvr_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "MvrCheck.${mvr_id} exposes driver_id, result, violation_points, checked_on, recorded_by_user_id, id and created_at, and carries NO version and NO updated_at field"
            - "${mvr_recorder} == 'co-1', taken from the X-User-ID header and not from the request body"
            - "MvrCheck.${mvr_id}.result == 'CLEAR' and violation_points == 0 and checked_on == '2026-08-01T00:00:00Z'"
            - "§1.5 declares no PATCH and no DELETE for /store-ops/mvr-checks/{mvr_check_id}, so the record cannot be amended"

      - name: order_creation_against_an_address_of_another_store_is_not_found
        claim_type: parent_relationships
        grounds:
          - validations.priority_7
          - errors.ERR_SERVICE_ADDRESS_NOT_FOUND
          - entities.Order.fields.service_address_id
