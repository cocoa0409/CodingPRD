      - name: session_lifecycle_and_provider_center_errors_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_SESSION_STATE_INVALID
          - errors.ERR_SUPPORT_SESSION_STATE_INVALID
          - errors.ERR_PROVIDER_CENTER_MISMATCH
          - state_machines.ProctorSession.SCHEDULED_to_COMPLETED
          - state_machines.SupportSession.SCHEDULED_to_COMPLETED
        distinguishing_aspect: "Both session families lock after their single forward transition - no-show on a COMPLETED proctor session returns ERR_SESSION_STATE_INVALID and a second complete on a support session returns ERR_SUPPORT_SESSION_STATE_INVALID - while a provider from another center is refused with ERR_PROVIDER_CENTER_MISMATCH before any interval arithmetic."
        test_recipe:
          setup:
            - "two 10-seat centers; center A holds one COMPUTER station and one COUNSELOR provider, center B holds a second COUNSELOR provider"
            - "one proctored ONLINE course BIO1 and one ACTIVE COMPETENCY placement at center A with a NEW_CREDIT BIO1 enrollment"
            - "one COMPLETED proctor session on that enrollment"
          setup_api_calls:
            - call: "POST /home-schools"
              payload: { name: "North High", district_code: "NHS-01", accountability_cohort_year: 2026 }
              as: DistrictAdmin
              captures: { hs_id: $.data.id }
            - call: "POST /centers"
              payload: { name: "Cedar AEC", seat_capacity: 10, certified_teacher_fte: 4.00, support_staff_fte: 2.00, max_students_per_teacher: 12 }
              as: DistrictAdmin
              captures: { ctr_a: $.data.id, ctr_a_v1: $.data.version }
            - call: "POST /centers"
              payload: { name: "Birch AEC", seat_capacity: 10, certified_teacher_fte: 4.00, support_staff_fte: 2.00, max_students_per_teacher: 12 }
              as: DistrictAdmin
              captures: { ctr_b: $.data.id }
            - call: "POST /proctor-stations"
              payload: { center_id: "${ctr_a}", label: "RM-1", station_type: "COMPUTER" }
