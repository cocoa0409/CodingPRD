scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1: Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: minimum_payment_due_draw_vs_repay
        grounds:
          - calculations.minimum_payment_due_cents
          - calculations.minimum_payment_due_cents.variants.interest_only_draw
          - calculations.minimum_payment_due_cents.variants.amortizing_repay
          - state_machines.Heloc.DRAW_to_REPAY
          - entities.Heloc.fields.status
          - entities.Heloc.fields.accrued_interest_cents
          - entities.Heloc.fields.principal_balance_cents
        distinguishing_aspect: |
          Same Heloc with identical principal_balance_cents, current_rate_bps, and accrued_interest_cents produces TWO different
          minimum_payment_due_cents values depending solely on status: the DRAW variant returns the interest-only floor (==
          accrued_interest_cents), while the REPAY variant returns an amortizing payment (strictly greater than
          accrued_interest_cents whenever principal_balance_cents > 0). The two variants operate on the same row but encode
          two valid algorithms for the same prose ("minimum payment").
        test_recipe:
          setup:
            - "POST /borrowers -> b1 (full_name='B One', email='b1@example.com')"
            - "POST /properties (borrower_id=b1, address='1 A St', appraised_value_cents=50000000, occupancy=PRIMARY) -> p1"
            - "POST /senior-liens (property_id=p1, holder_name='Bank A', principal_balance_cents=10000000) -> sl1"
            - "POST /helocs (borrower_id=b1, property_id=p1, credit_limit_cents=2000000, margin_bps=300, periodic_cap_bps=200, lifetime_cap_bps=2000, lifetime_floor_bps=100, repayment_term_years=10, annual_fee_cents=5000, annual_fee_waived_first_year=false, early_closure_fee_cents=10000) -> h1"
            - "POST /helocs/h1/activate (prime_rate_bps=500) (h1.current_rate_bps becomes 800)"
            - "POST /helocs/h1/draws (amount_cents=1000000)  # principal_balance_cents = 1000000"
            - "POST /_sweep/billing-cycle  # accrue interest for one 30-day cycle so accrued_interest_cents > 0"
          trigger:
            - "GET /helocs/h1  # observe minimum_payment_due_cents in DRAW state -> equals accrued_interest_cents"
            - "POST /_clock/advance (seconds = 10 * 365 * 86400)  # cross draw_period_end_date"
            - "POST /_sweep/billing-cycle  # triggers DRAW -> REPAY rollover"
            - "GET /helocs/h1  # observe minimum_payment_due_cents in REPAY state"
          assert:
            - "Before clock advance: GET /helocs/h1.data.status == 'DRAW' AND data.minimum_payment_due_cents == data.accrued_interest_cents"
            - "After REPAY rollover: GET /helocs/h1.data.status == 'REPAY' AND data.minimum_payment_due_cents > data.accrued_interest_cents (strictly greater because amortizing component is positive)"
            - "The DRAW reading and the REPAY reading are not equal even though principal_balance_cents and current_rate_bps were not changed by the rollover."

      - name: applied_rate_periodic_vs_lifetime_clamp
        grounds:
          - calculations.applied_rate_bps
          - entities.RateReset.fields.applied_rate_bps
          - entities.RateReset.fields.requested_rate_bps
          - entities.Heloc.fields.periodic_cap_bps
          - entities.Heloc.fields.lifetime_cap_bps
        distinguishing_aspect: |
          This calculation operates on a DIFFERENT entity domain (RateReset against Heloc, vs the Payment-shaped
          minimum_payment_due calculation above). Two valid clamp orders produce different applied_rate_bps for the same
          (prime_rate_bps, current_rate_bps): apply periodic cap first then lifetime cap vs lifetime first then periodic. The
          scaffold pins periodic-first then lifetime, which the test asserts via a request whose periodic-first clamp would
          stop ABOVE lifetime_cap_bps but whose lifetime clamp brings it back down — proving both clamps fired and the order
          is periodic-then-lifetime, not lifetime-only.
        test_recipe:
          setup:
            - "Create Borrower b2, Property p2 (occupancy=PRIMARY, appraised=50000000), SeniorLien sl2 (principal=10000000)"
            - "POST /helocs (..., margin_bps=200, periodic_cap_bps=300, lifetime_cap_bps=2100, lifetime_floor_bps=100, ...) -> h2"
            - "POST /helocs/h2/activate (prime_rate_bps=1800)  # initial_rate_bps = clamp(1800+200, 100, 2100) = 2000; current=2000"
          trigger:
            - "POST /helocs/h2/rate-resets (prime_rate_bps=2000)  # requested=2200; periodic_clamped=min(2000+300,2200)=2200; lifetime clamp -> 2100"
          assert:
            - "Latest RateReset.requested_rate_bps == 2200"
            - "Latest RateReset.applied_rate_bps == 2100  # lifetime cap won"
            - "Heloc.current_rate_bps == 2100 after the reset"
            - "If the implementation applied lifetime-only it would also return 2100, so a SECOND request distinguishes: POST /helocs/h2/rate-resets (prime_rate_bps=2400); requested=2600; periodic-then-lifetime: periodic_clamped=2100+300=2400, lifetime clamp -> 2100; applied_rate_bps == 2100. An implementation that skipped the periodic cap would still return 2100 here, BUT then POST /helocs/h2/rate-resets (prime_rate_bps=1700, after manually lowering via a prior reset to 1900): requested=1900; periodic_clamped=2100-300=1800; applied=1800. The triplet of resets uniquely identifies periodic-then-lifetime."

  # ===========================================================================
  # Rule 2: Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: amortizing_payment_three_input_nonlinear
        grounds:
          - calculations.minimum_payment_due_cents.variants.amortizing_repay
          - entities.Heloc.fields.principal_balance_cents
          - entities.Heloc.fields.current_rate_bps
          - entities.Heloc.fields.repayment_period_end_date
          - entities.Heloc.fields.accrued_interest_cents
        distinguishing_aspect: |
          MODE (a): a formula with 4 inputs (principal_balance_cents, current_rate_bps, months_remaining derived from
          repayment_period_end_date and clock time, accrued_interest_cents) combined non-linearly via the standard mortgage
          amortization formula P * r / (1 - (1+r)^-n) plus a conditional branch on monthly_rate==0. The interaction is
          non-linear in current_rate_bps (appears both as numerator coefficient and inside an exponentiation in the
          denominator), so changing the rate changes the payment in a non-proportional way that no simple linear formula can
          approximate.
        test_recipe:
          setup:
            - "Create Borrower b3, Property p3 (appraised=50000000, occupancy=PRIMARY), SeniorLien sl3 (principal=10000000)"
            - "POST /helocs (...repayment_term_years=10, margin_bps=300, periodic_cap_bps=200, lifetime_cap_bps=2000, lifetime_floor_bps=100, ...) -> h3"
            - "POST /helocs/h3/activate (prime_rate_bps=500)  # current_rate_bps=800"
            - "POST /helocs/h3/draws (amount_cents=1200000)  # principal_balance_cents=1200000"
            - "POST /_clock/advance (seconds = 10*365*86400)  # cross draw_period_end_date"
            - "POST /_sweep/billing-cycle  # DRAW -> REPAY"
          trigger:
            - "GET /helocs/h3  # capture payment_a = data.minimum_payment_due_cents"
            - "POST /helocs/h3/rate-resets (prime_rate_bps=300)  # current_rate_bps becomes 600 (subject to periodic clamp from 800 -> 600 = 200, allowed)"
            - "GET /helocs/h3  # capture payment_b at lower rate"
          assert:
            - "payment_a > payment_b  # higher rate produces higher monthly payment"
            - "payment_a != 2 * payment_b  # non-linear: halving rate does not halve payment; payment_b is closer to payment_a than to 0"
            - "payment_b > principal_balance_cents / months_remaining  # amortizing payment always exceeds pure principal slice because monthly_rate > 0"

      - name: payment_split_waterfall_with_caps
        grounds:
          - calculations.payment_split
          - entities.Payment.fields.interest_component_cents
          - entities.Payment.fields.principal_component_cents
          - entities.Heloc.fields.accrued_interest_cents
          - entities.Heloc.fields.principal_balance_cents
        distinguishing_aspect: |
          MODE (c): a circular-looking dependency where Heloc.accrued_interest_cents and Heloc.principal_balance_cents both
          gate the next Payment's split, and the scaffold pins evaluation order — interest bucket settles FIRST (capped at
          accrued_interest_cents), then principal bucket settles SECOND (capped to not go negative). Reversing the order
          (principal-first) for the same Payment.amount_cents produces a DIFFERENT principal_balance_cents and a different
          accrued_interest_cents on the resulting Heloc, even though both orderings respect the constraints. The scaffold's
          pinned order makes the answer well-defined.
        test_recipe:
          setup:
            - "Create Borrower b4, Property p4 (appraised=50000000, occupancy=PRIMARY), SeniorLien sl4 (principal=10000000)"
            - "POST /helocs (..., margin_bps=300, ...) -> h4; activate (prime_rate_bps=500)  # current_rate_bps=800"
            - "POST /helocs/h4/draws (amount_cents=1000000)  # principal_balance_cents=1000000"
            - "POST /_sweep/billing-cycle  # one cycle: accrue interest. Expected accrued: round(1000000 * 800/10000 * 30/365) = round(6575.342) = 6575 cents. Heloc.accrued_interest_cents == 6575."
          trigger:
            - "POST /helocs/h4/payments (amount_cents=10000)  # payment > accrued"
          assert:
            - "Latest Payment.interest_component_cents == 6575  # interest bucket capped at accrued"
            - "Latest Payment.principal_component_cents == 3425  # remainder = 10000 - 6575"
            - "Heloc.accrued_interest_cents == 0  # interest bucket fully cleared"
            - "Heloc.principal_balance_cents == 996575  # 1000000 - 3425"
            - "A principal-first implementation would have produced Payment.principal_component_cents == 10000 and Heloc.accrued_interest_cents == 6575 unchanged — a different observable state."

  # ===========================================================================
  # Rule 3: Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: heloc_branching_three_terminal_paths_to_closed
        grounds:
          - state_machines.Heloc.DRAW_to_REPAY
          - state_machines.Heloc.DRAW_to_DEFAULT
          - state_machines.Heloc.REPAY_to_DEFAULT
          - state_machines.Heloc.DRAW_to_CLOSED
          - state_machines.Heloc.REPAY_to_CLOSED
          - state_machines.Heloc.DEFAULT_to_CLOSED
        distinguishing_aspect: |
          Heloc has a BRANCHING (fork-join) shape: from DRAW it can split to {REPAY, DEFAULT, CLOSED}; from REPAY it can
          split to {DEFAULT, CLOSED}; from DEFAULT it can transition to CLOSED. Three distinct paths reach CLOSED with
          DIVERGENT side-effect sets per branch (DRAW->CLOSED may assess EARLY_CLOSURE fee; REPAY->CLOSED never does;
          DEFAULT->CLOSED may assess EARLY_CLOSURE fee only if tenure < 1095 days, which is impossible from REPAY but
          possible from DEFAULT if defaulted early). This is not a linear A->B->C->D pipeline.
        test_recipe:
          setup:
            - "Create three independent Helocs h_a, h_b, h_c via standard 4-step path (borrower, property, senior-lien, heloc, activate)."
            - "All three are now in DRAW."
          trigger:
            - "Path A (DRAW -> CLOSED early): POST /helocs/h_a/close (no draws taken, balance=0)"
            - "Path B (DRAW -> REPAY -> CLOSED): POST /_clock/advance (10*365*86400); POST /_sweep/billing-cycle; POST /helocs/h_b/close (balance=0)"
            - "Path C (DRAW -> DEFAULT -> CLOSED): POST /borrowers/{h_c.borrower_id}/bankruptcy-events; POST /helocs/h_c/close (balance=0)"
          assert:
            - "h_a.status == 'CLOSED' AND a Fee of type=EARLY_CLOSURE was created with amount_cents == h_a.early_closure_fee_cents (tenure was 0 days < 1095)."
            - "h_b.status == 'CLOSED' AND NO Fee of type=EARLY_CLOSURE was created (tenure was >= 3650 days)."
            - "h_c.status == 'CLOSED' AND a Fee of type=EARLY_CLOSURE was created (tenure < 1095 days because default and close happened before the clock advance)."
            - "Three branches, three different fee side-effect outcomes — confirms branching with divergent side effects."

      - name: property_insurance_cyclic_active_lapsed
        grounds:
          - state_machines.Property.ACTIVE_to_LAPSED
          - state_machines.Property.LAPSED_to_ACTIVE
          - entities.Property.fields.insurance_status
        distinguishing_aspect: |
          Property.insurance_status forms a CYCLE: ACTIVE -> LAPSED via LAPSE event, LAPSED -> ACTIVE via REINSTATE event,
          and the same Property may oscillate between the two states an unbounded number of times. The cycle belongs to a
          DIFFERENT entity (Property) from the branching machine above (Heloc). Crucially the cycle has an asymmetric
          side-effect signature: ACTIVE->LAPSED cascades DEFAULT to dependent Helocs, but LAPSED->ACTIVE does NOT
          un-default them (sticky default), so the cycle is not symmetric in observable system state.
        test_recipe:
          setup:
            - "Create Borrower b5, Property p5 (occupancy=PRIMARY), SeniorLien sl5, Heloc h5; activate h5."
          trigger:
            - "POST /properties/p5/insurance-events (event_type=LAPSE)"
            - "POST /properties/p5/insurance-events (event_type=REINSTATE)"
            - "POST /properties/p5/insurance-events (event_type=LAPSE)"
          assert:
            - "Final Property.insurance_status == 'LAPSED' (cycle traversed twice)."
            - "After step 1: h5.status == 'DEFAULT', h5.default_trigger == 'INSURANCE_LAPSE'."
            - "After step 2: h5.status == 'DEFAULT' (still — REINSTATE does NOT un-default)."
            - "After step 3: a SECOND attempt to re-default an already-DEFAULTed Heloc is a no-op (no new DefaultEvent created for h5)."

  # ===========================================================================
  # Rule 4: Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: bankruptcy_cascades_three_hops
        grounds:
          - state_machines.Borrower.SOLVENT_to_BANKRUPT
          - state_machines.Heloc.DRAW_to_DEFAULT
          - calculations.annual_fee_assessment
          - entities.DefaultEvent
          - entities.Fee
        distinguishing_aspect: |
          DEPTH = 3 cascade from a DIFFERENT trigger than the senior-lien cascade below: HOP 1 = POST /borrowers/{id}/bankruptcy-events
          mutates Borrower.bankruptcy_flag; HOP 2 = that flag flip CAUSES every DRAW/REPAY Heloc owned by the borrower to
          transition to DEFAULT (creating a DefaultEvent each); HOP 3 = each Heloc's transition to DEFAULT CAUSES future
          annual-fee sweep cycles to suppress Fee creation on that Heloc, so a subsequent annual-fees sweep produces a
          different Fee count than it would for a still-active Heloc. Each hop is caused by the previous hop, not by the
          original bankruptcy POST.
        test_recipe:
          setup:
            - "Create Borrower b6 with TWO Helocs (h6a on Property p6a, h6b on Property p6b, each with its own SeniorLien). Both activated."
            - "POST /_clock/advance (seconds = 200*86400)  # mid-year, no annual fee yet"
          trigger:
            - "POST /borrowers/b6/bankruptcy-events  # HOP 1"
            - "POST /_clock/advance (seconds = 200*86400)  # cross 365-day anniversary"
            - "POST /_sweep/annual-fees"
          assert:
            - "Borrower b6.bankruptcy_flag == true (HOP 1)"
            - "h6a.status == 'DEFAULT' AND h6a.default_trigger == 'BANKRUPTCY' (HOP 2)"
            - "h6b.status == 'DEFAULT' AND h6b.default_trigger == 'BANKRUPTCY' (HOP 2)"
            - "Two DefaultEvent rows exist (one per Heloc) tied to BankruptcyEvent.id"
            - "GET /helocs/h6a/fees and GET /helocs/h6b/fees both return ZERO Fee rows of type=ANNUAL (HOP 3: sweep suppressed the assessment because status==DEFAULT at sweep time)"

      - name: senior_lien_default_cascade_two_hops
        grounds:
          - state_machines.SeniorLien.CURRENT_to_DEFAULTED
          - state_machines.Heloc.DRAW_to_DEFAULT
          - entities.DefaultEvent
        distinguishing_aspect: |
          DEPTH = 2 cascade from a DIFFERENT trigger than the bankruptcy chain above: HOP 1 = POST /senior-liens/{id}/default-events
          mutates SeniorLien.status to DEFAULTED; HOP 2 = that flip CAUSES every DRAW/REPAY Heloc on the same Property to
          transition to DEFAULT with default_trigger=SENIOR_LIEN_DEFAULT. The originating trigger is on SeniorLien (cross-aggregate
          to Heloc via Property), not on Borrower, so the propagation pattern differs from the bankruptcy chain.
        test_recipe:
          setup:
            - "Create Borrower b7, Property p7, SeniorLien sl7, Heloc h7; activate h7."
          trigger:
            - "POST /senior-liens/sl7/default-events"
          assert:
            - "SeniorLien sl7.status == 'DEFAULTED' (HOP 1)"
            - "h7.status == 'DEFAULT' AND h7.default_trigger == 'SENIOR_LIEN_DEFAULT' (HOP 2, caused by HOP 1, not by the original POST)"
            - "A DefaultEvent exists for h7 with source_event_id == SeniorLienDefaultEvent.id from HOP 1"

  # ===========================================================================
  # Rule 5: Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_close_balance
        grounds:
          - validations[priority=11]   # state: close requires status IN {DRAW,REPAY,DEFAULT}
          - validations[priority=14]   # state: ERR_HELOC_CLOSED
          - validations[priority=31]   # business_fiscal: ERR_BALANCE_NOT_ZERO
        distinguishing_aspect: |
          PAIR = (state, business_fiscal). Construct a CLOSED Heloc and call POST /helocs/{id}/close with no payment first
          paid down — both the CLOSED-state check (priority 14, ERR_HELOC_CLOSED) and the non-zero-balance check
          (priority 31, ERR_BALANCE_NOT_ZERO) would fail. The scaffold's priority ordering pins ERR_HELOC_CLOSED as the
          winner (lower priority number = earlier check). A different ordering would surface ERR_BALANCE_NOT_ZERO instead.
        test_recipe:
          setup:
            - "Create Borrower b8, Property p8, SeniorLien sl8, Heloc h8 with early_closure_fee_cents=0; activate; POST /helocs/h8/draws (amount_cents=500000); POST /helocs/h8/close — FAILS with ERR_BALANCE_NOT_ZERO. Pay down to zero (POST /helocs/h8/payments amount_cents=accrued+500000). Now POST /helocs/h8/close — succeeds; h8.status=CLOSED."
            - "Re-attempt: take a synthetic state where balance is again non-zero is impossible after CLOSED, so we rely solely on the CLOSED state for the dual-failure."
          trigger:
            - "POST /helocs/h8/close (second close attempt on already-CLOSED Heloc)"
          assert:
            - "HTTP status == 409"
            - "data.error_id == 'ERR_HELOC_CLOSED' (priority 14 wins over the conceptually-also-applicable priority 11 state check)"

      - name: business_safety_vs_business_referential_creation
        grounds:
          - validations[priority=20]   # business_safety: occupancy must be PRIMARY
          - validations[priority=26]   # business_referential: borrower_id must own property
        distinguishing_aspect: |
          PAIR = (business_safety, business_referential), DIFFERENT from the pair above. Construct POST /helocs where both
          (a) the referenced Property has occupancy=SECONDARY and (b) Property.borrower_id != body.borrower_id. The scaffold
          pins business_safety (priority 20) before business_referential (priority 26), so ERR_OCCUPANCY_NOT_PRIMARY wins.
          A reordering would surface ERR_BORROWER_PROPERTY_MISMATCH instead.
        test_recipe:
          setup:
            - "Create Borrower b9a, Borrower b9b; Property p9 with borrower_id=b9b AND occupancy=SECONDARY; SeniorLien sl9 on p9 (CURRENT)."
          trigger:
            - "POST /helocs (borrower_id=b9a, property_id=p9, credit_limit_cents=2000000, margin_bps=300, periodic_cap_bps=200, lifetime_cap_bps=2000, lifetime_floor_bps=100, repayment_term_years=10, annual_fee_cents=5000, early_closure_fee_cents=10000)"
          assert:
            - "HTTP status == 422"
            - "data.error_id == 'ERR_OCCUPANCY_NOT_PRIMARY' (business_safety priority 20 wins over business_referential priority 26)"

  # ===========================================================================
  # Rule 6: Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: delinquency_90_day_boundary
        grounds:
          - calculations.billing_cycle_accrual_and_delinquency
          - entities.Heloc.fields.delinquency_days
          - state_machines.Heloc.DRAW_to_DEFAULT
          - validations[priority=12]
        distinguishing_aspect: |
          NUMERIC threshold boundary on Heloc.delinquency_days, reachable via POST /_sweep/billing-cycle. The condition is
          `delinquency_days >= 90` — exactly 90 fires DEFAULT(DELINQUENCY_90), 89 does not, 91 does. Test verifies the
          inclusive lower bound (>= not >) at the exact boundary.
        test_recipe:
          setup:
            - "Create Borrower b10, Property p10, SeniorLien sl10, Heloc h10; activate; POST /helocs/h10/draws (amount_cents=1000000)."
            - "Sweep cycle 1 (30 days): pay nothing. delinquency_days = 30."
            - "Sweep cycle 2 (60 days): pay nothing. delinquency_days = 60."
            - "Sweep cycle 3 (90 days): pay nothing."
          trigger:
            - "POST /_sweep/billing-cycle  # third sweep moves delinquency_days from 60 to 90"
          assert:
            - "After cycle 2: h10.status == 'DRAW' AND h10.delinquency_days == 60 (still under threshold)."
            - "After cycle 3: h10.status == 'DEFAULT' AND h10.default_trigger == 'DELINQUENCY_90' AND h10.delinquency_days >= 90 (exactly at boundary)."
            - "A boundary off-by-one implementation using `> 90` would have left h10 in DRAW after cycle 3 with delinquency_days=90."

      - name: early_closure_1095_day_boundary
        grounds:
          - calculations.early_closure_fee_assessment
          - state_machines.Heloc.DRAW_to_CLOSED
          - entities.Heloc.fields.early_closure_fee_cents
          - entities.Fee
        distinguishing_aspect: |
          DIFFERENT metric (tenure in days) reachable via a DIFFERENT endpoint (POST /helocs/{id}/close). The condition is
          `tenure_days < 1095` — exactly 1095 does NOT fire the fee, 1094 does, 0 does. Test verifies the strict upper bound
          (< not <=) at the exact boundary, distinct from the >= boundary above.
        test_recipe:
          setup:
            - "Create Borrower b11, Property p11, SeniorLien sl11, Heloc h11 with early_closure_fee_cents=15000; activate."
            - "Do NOT draw (so balance stays 0)."
            - "POST /_clock/advance (seconds = 1095 * 86400)  # exactly 1095 days"
          trigger:
            - "POST /helocs/h11/close"
          assert:
            - "h11.status == 'CLOSED'"
            - "GET /helocs/h11/fees returns ZERO Fee rows of type=EARLY_CLOSURE (because 1095 is NOT < 1095)."
            - "Contrast case: a second Heloc closed at exactly 1094 days WOULD have one EARLY_CLOSURE fee."

  # ===========================================================================
  # Rule 7: Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: heloc_activate_requires_senior_lien_current
        grounds:
          - state_machines.Heloc.PENDING_to_DRAW
          - validations[priority=21]
          - entities.SeniorLien.fields.status
          - entities.Heloc.fields.status
        distinguishing_aspect: |
          PAIR = (Heloc, SeniorLien). POST /helocs and POST /helocs/{id}/activate require Property to have at least one
          SeniorLien with status=CURRENT. If the SeniorLien is DEFAULTED at activation time, the activation is rejected
          with ERR_NO_SENIOR_LIEN even though Heloc itself is in valid PENDING state.
        test_recipe:
          setup:
            - "Create Borrower b12, Property p12, SeniorLien sl12 (CURRENT)."
            - "POST /helocs (...) -> h12 (PENDING)."
            - "POST /senior-liens/sl12/default-events  # sl12 now DEFAULTED"
          trigger:
            - "POST /helocs/h12/activate (prime_rate_bps=500)"
          assert:
            - "HTTP status == 422 AND data.error_id == 'ERR_NO_SENIOR_LIEN' (activate rechecks the senior lien gate; h12 stays in PENDING)."
            - "h12.status == 'PENDING' (unchanged)."

      - name: heloc_creation_requires_borrower_solvent
        grounds:
          - validations[priority=22]
          - entities.Borrower.fields.bankruptcy_flag
          - entities.Heloc.fields.status
        distinguishing_aspect: |
          DIFFERENT PAIR = (Heloc, Borrower). POST /helocs requires Borrower.bankruptcy_flag == false. Crossing a different
          entity pair than (Heloc, SeniorLien) above: here the dependency is on the Borrower entity, not the SeniorLien
          entity, so the scaffold exercises two distinct cross-entity dependencies.
        test_recipe:
          setup:
            - "Create Borrower b13."
            - "POST /borrowers/b13/bankruptcy-events  # b13.bankruptcy_flag = true"
            - "Create Property p13 (borrower_id=b13, occupancy=PRIMARY) and SeniorLien sl13 (CURRENT)."
          trigger:
            - "POST /helocs (borrower_id=b13, property_id=p13, credit_limit_cents=2000000, ...)"
          assert:
            - "HTTP status == 422 AND data.error_id == 'ERR_BORROWER_BANKRUPT'."
            - "No Heloc row exists for borrower_id=b13."

  # ===========================================================================
  # Rule 8: Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: annual_fee_anniversary_window_idempotency
        grounds:
          - calculations.annual_fee_assessment
          - entities.Fee
          - state_machines.Heloc.DRAW_to_DEFAULT
        distinguishing_aspect: |
          INTERVAL SEMANTICS = anniversary windows on a single resource (Heloc); each anniversary index n defines a half-open
          interval [origination_date + 365*n, origination_date + 365*(n+1)) during which exactly one ANNUAL Fee may be
          assessed. Two consecutive POST /_sweep/annual-fees calls within the same window MUST produce only one Fee — the
          second sweep is rejected at the (heloc_id, anniversary_index) uniqueness key, NOT by a 409 to the caller but by
          silent suppression in the sweep loop. The "overlap" being detected is duplicate Fee creation across two sweep calls
          covering the same anniversary index.
        test_recipe:
          setup:
            - "Create Borrower b14, Property p14, SeniorLien sl14, Heloc h14 (annual_fee_cents=5000, annual_fee_waived_first_year=false); activate."
            - "POST /_clock/advance (seconds = 365*86400)  # cross first anniversary"
          trigger:
            - "POST /_sweep/annual-fees  # first sweep creates Fee #1"
            - "POST /_sweep/annual-fees  # second sweep within same anniversary window"
          assert:
            - "GET /helocs/h14/fees returns EXACTLY ONE Fee row of type=ANNUAL with amount_cents=5000 and status=ASSESSED."
            - "The second sweep's response shows fees_created==0."

      - name: billing_cycle_30day_window_idempotency
        grounds:
          - calculations.billing_cycle_accrual_and_delinquency
          - entities.Heloc.fields.accrued_interest_cents
          - entities.Heloc.fields.delinquency_days
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource cadence: contiguous 30-day cycles on Heloc, indexed by
          cycle_index = floor((now - origination_date) / 30 days). Two POST /_sweep/billing-cycle calls without a clock
          advance between them are aliased to the same cycle_index and MUST be idempotent — accrued_interest_cents and
          delinquency_days must each advance ONCE, not twice. Contrast with the annual-fee anniversary window above
          (sparse yearly markers vs dense monthly cadence; idempotency key shape differs).
        test_recipe:
          setup:
            - "Create Borrower b15, Property p15, SeniorLien sl15, Heloc h15; activate; POST /helocs/h15/draws (amount_cents=1000000)."
          trigger:
            - "POST /_sweep/billing-cycle  # cycle 1 fires"
            - "POST /_sweep/billing-cycle  # called again without clock advance; should be a no-op for h15"
          assert:
            - "After both calls, h15.accrued_interest_cents == round(1000000 * h15.current_rate_bps/10000 * 30/365)  # interest accrued ONCE, not twice"
            - "h15.delinquency_days == 30  # advanced ONCE, not 60"
            - "Second sweep response: cycles_run==0 (idempotent for this Heloc within the same 30-day window)."

  # ===========================================================================
  # Rule 9: Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: draw_plus_payment_conserves_available_credit_when_full_repaid
        grounds:
          - calculations.payment_split
          - entities.Heloc.fields.available_credit_cents
          - entities.Heloc.fields.credit_limit_cents
          - entities.Heloc.fields.principal_balance_cents
        distinguishing_aspect: |
          CONSERVED QUANTITY = available_credit_cents + principal_balance_cents (must always equal credit_limit_cents while
          status IN {DRAW, REPAY, DEFAULT}). A POST /helocs/{id}/draws followed by a compensating POST /helocs/{id}/payments
          of amount_cents == accrued_interest_cents + draw.amount_cents MUST leave available_credit_cents identical to its
          pre-draw value and principal_balance_cents back to its pre-draw value. Drift in this sum reveals a calculation bug
          in payment_split or available_credit bookkeeping.
        test_recipe:
          setup:
            - "Create Borrower b16, Property p16, SeniorLien sl16, Heloc h16 (credit_limit_cents=2000000); activate."
            - "Record pre-draw values: available_credit_pre = 2000000, principal_pre = 0, accrued_pre = 0."
          trigger:
            - "POST /helocs/h16/draws (amount_cents=750000)  # principal -> 750000, available -> 1250000"
            - "POST /_sweep/billing-cycle  # accrue interest for one cycle; record accrued_mid = h16.accrued_interest_cents"
            - "POST /helocs/h16/payments (amount_cents = 750000 + accrued_mid)  # compensating full repayment"
          assert:
            - "After all three steps: h16.principal_balance_cents == 0 == principal_pre."
            - "h16.available_credit_cents == 2000000 == available_credit_pre."
            - "h16.accrued_interest_cents == 0 == accrued_pre."
            - "INVARIANT: h16.available_credit_cents + h16.principal_balance_cents == h16.credit_limit_cents (== 2000000) at every observation point."

      - name: rate_reset_round_trip_conserves_current_rate
        grounds:
          - calculations.applied_rate_bps
          - entities.RateReset.fields.applied_rate_bps
          - entities.Heloc.fields.current_rate_bps
          - entities.Heloc.fields.periodic_cap_bps
          - entities.Heloc.fields.lifetime_cap_bps
          - entities.Heloc.fields.lifetime_floor_bps
        distinguishing_aspect: |
          DIFFERENT conserved quantity = Heloc.current_rate_bps under symmetric rate movements when both clamps are inactive.
          Two compensating POST /helocs/{id}/rate-resets — first at prime_rate_bps = P, then at prime_rate_bps = P_original
          — MUST leave Heloc.current_rate_bps equal to its starting value, provided neither move triggers the periodic or
          lifetime clamp (the cap-active case is intentionally NOT round-trip-clean; that's part of why caps create the
          dual-variant calculation in Rule 1). This is a different invariant type than the credit-conservation invariant
          above: monetary quantity vs basis-point quantity.
        test_recipe:
          setup:
            - "Create Borrower b17, Property p17, SeniorLien sl17, Heloc h17 (margin_bps=300, periodic_cap_bps=500, lifetime_cap_bps=2500, lifetime_floor_bps=100); activate (prime_rate_bps=500)  # current_rate_bps = 800."
          trigger:
            - "POST /helocs/h17/rate-resets (prime_rate_bps=700)  # requested=1000; delta=200<500 (periodic ok); applied=1000; current_rate_bps -> 1000"
            - "POST /helocs/h17/rate-resets (prime_rate_bps=500)  # requested=800; delta=-200; |200|<500; applied=800; current_rate_bps -> 800"
          assert:
            - "After both resets, h17.current_rate_bps == 800 (exactly equal to the post-activation value)."
            - "INVARIANT: when no cap fires on either leg, the round-trip leaves current_rate_bps unchanged. If the second reset wrongly stacked the periodic cap on top of the first reset's applied rate (e.g., capping the downward move to 1000 - 500 = 500 then clamping to 700 instead of going to 800), the assertion fails."
