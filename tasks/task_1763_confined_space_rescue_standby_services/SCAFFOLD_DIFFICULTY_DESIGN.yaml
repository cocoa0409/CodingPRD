            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Rescuer One", role_qualifications: ["RESCUER"], certifications: ["CONFINED_SPACE_RESCUE"] }, as: OperationsManager, captures: { r1_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Rescuer Two", role_qualifications: ["RESCUER"], certifications: ["CONFINED_SPACE_RESCUE"] }, as: OperationsManager, captures: { r2_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Round Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 3333, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000, minimum_billable_hours: 1 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-R", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/rescue-plans", payload: { required_team_size: 1, required_certifications: ["CONFINED_SPACE_RESCUE"], retrieval_system_type: "TRIPOD", expected_space_version: "${sp_v}" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { plan: "$.data.id" } }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v2: "$.data.version" } }
            - { call: "POST /rescue-ops/rescue-plans/${plan}/approve", payload: { expected_space_version: "${sp_v2}" }, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v3: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "Rounding job", planned_start_at: "2026-08-03T19:00:00Z", planned_end_at: "2026-08-04T00:00:00Z", expected_space_version: "${sp_v3}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/issue", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/standby-assignments", payload: { rescuer_id: "${r1_id}", standby_start_at: "2026-08-03T20:00:00Z", standby_end_at: "2026-08-03T22:00:00Z" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { sa1: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/standby-assignments", payload: { rescuer_id: "${r2_id}", standby_start_at: "2026-08-03T20:00:00Z", standby_end_at: "2026-08-03T22:00:00Z" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { sa2: "$.data.id" } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T20:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/standby-assignments/${sa1}/check-in", payload: {}, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "POST /rescue-ops/standby-assignments/${sa2}/check-in", payload: {}, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T21:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/standby-assignments/${sa1}/release", payload: {}, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "POST /rescue-ops/standby-assignments/${sa2}/release", payload: {}, as: RescueTeamLead, as_user_id: "${rtl_id}" }
          trigger:
            - { call: "POST /rescue-ops/client-accounts/${acct}/statements/generate", payload: { period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-04T00:00:00Z" }, as: BillingClerk, captures: { stmt: "$.data.id" } }
            - { call: "GET /rescue-ops/statements/${stmt}/lines", as: BillingClerk, captures: { line0_amt: "$.data[0].amount_cents", line1_amt: "$.data[1].amount_cents" } }
          assert:
            - "Each STANDBY_HOURLY line: quantity 1.0, unit_rate 3333, raw 4999.5 -> round_half_up per line -> amount_cents == 5000"
            - "StatementLine[0].amount_cents == 5000 and StatementLine[1].amount_cents == 5000"
            - "BillingStatement.${stmt}.total_cents == 10000 (per-line round then sum; NOT 9999 which sum-then-round would yield)"
            - "BillingStatement.${stmt}.line_count == 2"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: permit_suspend_resume_reentry_cycle
        grounds:
          - state_machines.EntryPermit.ACTIVE_to_SUSPENDED
          - state_machines.EntryPermit.SUSPENDED_to_ACTIVE
          - entities.EntryPermit.fields.reentry_count
        distinguishing_aspect: |
          Entity = EntryPermit: a true cycle ACTIVE -> SUSPENDED -> ACTIVE, traversed
          TWICE (not a one-way pipeline). reentry_count and suspension_count must each
          reach 2, proving the loop is re-entrant rather than a linear path.
        test_recipe:
          setup:
            - "ACTIVE permit (continuous monitoring OFF so clock moves do not auto-suspend), verified isolations expiring 18:00, APPROVED plan, ON_STANDBY rescuer covering 05:00-20:00"
            - "Planned window 2026-08-03T05:00:00Z-20:00:00Z"
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T05:30:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Lead One", role_qualifications: ["RESCUE_LEAD"] }, as: OperationsManager, captures: { rtl_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Sup One", role_qualifications: ["ENTRY_SUPERVISOR"] }, as: OperationsManager, captures: { sup_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Safe One", role_qualifications: ["SAFETY_OFFICER"] }, as: OperationsManager, captures: { so_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Att One", role_qualifications: ["ATTENDANT"] }, as: OperationsManager, captures: { att_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Rescuer One", role_qualifications: ["RESCUER"], certifications: ["CONFINED_SPACE_RESCUE"] }, as: OperationsManager, captures: { r1_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Cycle Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-C", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: true, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/rescue-plans", payload: { required_team_size: 1, required_certifications: ["CONFINED_SPACE_RESCUE"], retrieval_system_type: "TRIPOD", expected_space_version: "${sp_v}" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { plan: "$.data.id" } }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v2: "$.data.version" } }
            - { call: "POST /rescue-ops/rescue-plans/${plan}/approve", payload: { expected_space_version: "${sp_v2}" }, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v3: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "Cycle job", planned_start_at: "2026-08-03T05:00:00Z", planned_end_at: "2026-08-03T20:00:00Z", expected_space_version: "${sp_v3}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/issue", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/isolation-verifications", payload: { isolation_type: "VENTILATION", evidence_ref: "vent-photo-1" }, as: SafetyOfficer, as_user_id: "${so_id}", captures: { iso1: "$.data.id" } }
            - { call: "POST /rescue-ops/isolation-verifications/${iso1}/verify", payload: {}, as: SafetyOfficer, as_user_id: "${so_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/atmospheric-readings", payload: { reading_kind: "PRE_ENTRY", o2_pct: 20.9, lel_pct: 0, h2s_ppm: 0, co_ppm: 0 }, as: Attendant, as_user_id: "${att_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/standby-assignments", payload: { rescuer_id: "${r1_id}", standby_start_at: "2026-08-03T05:00:00Z", standby_end_at: "2026-08-03T20:00:00Z" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { sa: "$.data.id" } }
            - { call: "POST /rescue-ops/standby-assignments/${sa}/check-in", payload: {}, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/activate", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
          trigger:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/entry-permits/${per}/suspend", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:05:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/entry-permits/${per}/atmospheric-readings", payload: { reading_kind: "PRE_ENTRY", o2_pct: 20.9, lel_pct: 0, h2s_ppm: 0, co_ppm: 0 }, as: Attendant, as_user_id: "${att_id}" }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:10:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/entry-permits/${per}/resume", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T11:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/entry-permits/${per}/suspend", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T11:05:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/entry-permits/${per}/atmospheric-readings", payload: { reading_kind: "PRE_ENTRY", o2_pct: 20.9, lel_pct: 0, h2s_ppm: 0, co_ppm: 0 }, as: Attendant, as_user_id: "${att_id}" }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T11:10:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/entry-permits/${per}/resume", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per_status: "$.data.status" } }
          assert:
            - "EntryPermit.${per}.status == ACTIVE after the second resume"
            - "EntryPermit.${per}.suspension_count == 2"
            - "EntryPermit.${per}.reentry_count == 2 (the cycle was traversed twice)"
            - "Each resume required a PRE_ENTRY reading recorded after the matching last_suspended_at (the 10:05 reading does not authorize the 11:10 resume)"

      - name: incident_reopen_retriage_cycle
        grounds:
          - state_machines.Incident.RESOLVED_to_REOPENED
          - state_machines.Incident.REOPENED_to_TRIAGED
          - entities.Incident.fields.escalation_level
        distinguishing_aspect: |
          Entity = Incident (DIFFERENT entity from EntryPermit in
          permit_suspend_resume_reentry_cycle): REPORTED -> TRIAGED -> RESOLVED ->
          REOPENED -> TRIAGED forms a revision loop. After the loop the incident is
          TRIAGED again with escalation_level still 0 (escalation was never taken).
        test_recipe:
          setup:
            - "ACTIVE permit (continuous monitoring OFF, planned 05:00-20:00), manually suspended at 10:00 so incident creation does not fire the emergency cascade"
            - "Incident reported by the EntrySupervisor at 10:05 on the SUSPENDED permit"
          setup_api_calls:
