            - "a DeaccessionCase with disposition TRANSFER and disposition_target_ref left null, advanced past a comment period that closed 2026-09-15, APPROVED by five APPROVE ballots"
            - "logical clock standing at 2026-09-15T00:00:00Z"
          setup_api_calls:
            - call: "POST /public-art/artists"
              payload: { full_name: "Ada Vance", is_living: true, contact_email: "ada@example.gov" }
