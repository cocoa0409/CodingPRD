            - "after the transfer: inv-101 filtered list has exactly 1 row (${inv_b}) and inv-102 filtered list has exactly 1 row (${inv_a})"
            - "global invariant: total non-terminal assignments across all investigators == 2 before AND after the transfer"
            - "InvestigationCase.${inv_a}.assigned_investigator_id == inv-102 and its version incremented by the transfer"
      - name: settle_vacate_conserve_settled_total
        grounds:
          - state_machines.Charge.IN_MEDIATION_to_CLOSED_SETTLED
          - state_machines.Charge.CLOSED_SETTLED_to_UNDER_INVESTIGATION
          - entities.Charge.fields.settled_amount_cents
        distinguishing_aspect: |
          Conserved quantity = money (global settled_amount_cents total), a
          different quantity type from the assignment-count invariant: the
          forward action (mediation conclude SETTLED at 2500000 cents) paired
          with its compensating action (vacate-settlement inside the 10-day
          window) leaves the global settled total unchanged (0) and zeroes every
          settlement field without residue.
        test_recipe:
          setup:
            - "charge in IN_MEDIATION (both accepted) at the 2026-09-01 default clock; no investigation has ever existed for this charge"
          setup_api_calls:
            - call: "POST /eeoc/employers"
