              as: SalesRep
              captures: { site_wide_id: $.data.id }
            - call: "POST /placement-permits"
              payload: { site_id: "${site_wide_id}", permit_kind: "PLACEMENT", authority_ref: "PL-8101", effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: PermitCoordinator
              captures: { permit_wide_id: $.data.id }
            - call: "POST /placement-permits/${permit_wide_id}/submit"
              payload: {}
              as: PermitCoordinator
            - call: "POST /placement-permits/${permit_wide_id}/approve"
              payload: { authority_decision_ref: "AD-8101" }
              as: ComplianceOfficer
            - call: "POST /service-sites"
              payload: { account_id: "${acct_id}", site_label: "Summit Alley Annex", jurisdiction_code: "NV-CC-CITY", access_class: "GATED", right_of_way_required: false, gate_open_minute: 360, gate_close_minute: 1200, max_truck_length_ft: 24 }
              as: SalesRep
              captures: { site_narrow_id: $.data.id }
            - call: "POST /placement-permits"
              payload: { site_id: "${site_narrow_id}", permit_kind: "PLACEMENT", authority_ref: "PL-8102", effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: PermitCoordinator
              captures: { permit_narrow_id: $.data.id }
            - call: "POST /placement-permits/${permit_narrow_id}/submit"
              payload: {}
              as: PermitCoordinator
            - call: "POST /placement-permits/${permit_narrow_id}/approve"
              payload: { authority_decision_ref: "AD-8102" }
              as: ComplianceOfficer
              captures: { narrow_permit_status: $.data.status }
            - call: "POST /asset-units"
              payload: { asset_tag: "TR2-501", unit_class: "TRAILER_2STALL", yard_code: "YD-9", tare_length_ft: 34 }
              as: PlatformAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", site_id: "${site_wide_id}", contract_kind: "CONSTRUCTION", term_start: "2026-08-01", term_end: "2026-09-30", headcount: 40, event_duration_hours: 8, service_frequency_per_week: 3, season_code: "OFF", construction_phase: "SITEWORK", ada_required: false }
              as: SalesRep
              captures: { c_wide_id: $.data.id, c_wide_v: $.data.version }
            - call: "POST /rental-contracts/${c_wide_id}/quote"
              payload: { expected_contract_version: "${c_wide_v}" }
              as: SalesRep
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", site_id: "${site_narrow_id}", contract_kind: "CONSTRUCTION", term_start: "2026-08-01", term_end: "2026-09-30", headcount: 40, event_duration_hours: 8, service_frequency_per_week: 3, season_code: "OFF", construction_phase: "SITEWORK", ada_required: false }
              as: SalesRep
              captures: { c_narrow_id: $.data.id, c_narrow_v: $.data.version }
            - call: "POST /rental-contracts/${c_narrow_id}/quote"
              payload: { expected_contract_version: "${c_narrow_v}" }
              as: SalesRep
            - call: "POST /unit-deployments"
              payload: { contract_id: "${c_wide_id}", asset_unit_id: "${asset_id}", deploy_from: "2026-08-03", deploy_to: "2026-08-10" }
              as: DispatchPlanner
              captures: { d1_id: $.data.id, d1_state: $.data.state }
          trigger:
            - call: "POST /unit-deployments"
              payload: { contract_id: "${c_narrow_id}", asset_unit_id: "${asset_id}", deploy_from: "2026-08-05", deploy_to: "2026-08-12" }
              as: DispatchPlanner
              captures: { conflict_error: $.data.error_id }
            - call: "POST /unit-deployments"
              payload: { contract_id: "${c_narrow_id}", asset_unit_id: "${asset_id}", deploy_from: "2026-09-01", deploy_to: "2026-09-05" }
              as: DispatchPlanner
              captures: { access_only_error: $.data.error_id }
            - call: "POST /unit-deployments"
              payload: { contract_id: "${c_wide_id}", asset_unit_id: "${asset_id}", deploy_from: "2026-08-05", deploy_to: "2026-08-12" }
              as: DispatchPlanner
              captures: { overlap_only_error: $.data.error_id }
          assert:
            - "${narrow_permit_status} == APPROVED, so both sites are OPEN and neither priority 40 nor 41 can pre-empt the pair under test"
            - "${d1_state} == RESERVED"
            - "${conflict_error} == ERR_SITE_ACCESS_INFEASIBLE with HTTP 422 — priority 50 (business_safety) beats priority 58 (business_temporal)"
            - "${conflict_error} != ERR_UNIT_DOUBLE_BOOKED and the response is not HTTP 409"
            - "CONTROL A — ${access_only_error} == ERR_SITE_ACCESS_INFEASIBLE for the non-overlapping window, proving the fit rule alone fires (34 > 24)"
            - "CONTROL B — ${overlap_only_error} == ERR_UNIT_DOUBLE_BOOKED on the wide site for the SAME 2026-08-05..2026-08-12 window, proving the overlap rule was genuinely violated in the conflict case"
            - "Exactly one UnitDeployment exists for ${asset_id} (GET /unit-deployments?asset_unit_id=... returns total_count 1) — none of the three refused requests persisted a row"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: trailer_tier_boundary_at_headcount_400_changes_the_mix_shape
        grounds:
          - calculations.unit_mix_quote
          - calculations.unit_mix_quote.constants.TRAILER_HEADCOUNT_FLOOR
          - endpoints["POST /rental-contracts/{id}/quote"]
          - entities.RentalContract.fields.headcount
          - entities.QuoteLine.fields.unit_class
        distinguishing_aspect: |
          Metric under test: RentalContract.headcount against TRAILER_HEADCOUNT_FLOOR (400), probed at
          399 / 400 / 400-with-tiny-capacity on POST /rental-contracts/{id}/quote. The third probe is
          what makes the claim falsifiable: base_capacity_units there is only 2, so an implementation
          that (wrongly) keys the tier on capacity rather than headcount cannot pass it.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z. One EVENT account and one site (posture is irrelevant — quoting is not posture-gated)."
            - "Three EVENT contracts, all ada_required true, season PEAK, construction_phase EVENT_NA:"
            - "  c399: headcount 399, event_duration_hours 12 -> demand 5745, base_capacity_units 23"
            - "  c400: headcount 400, event_duration_hours 12 -> demand 5760, base_capacity_units 24"
            - "  c400_small: headcount 400, event_duration_hours 1 -> demand 480, base_capacity_units 2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rental-accounts"
              payload: { legal_name: "Lakeshore Festivals", account_type: "EVENT", credit_terms_days: 0 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /service-sites"
              payload: { account_id: "${acct_id}", site_label: "Lakeshore Green", jurisdiction_code: "IL-CH-CITY", access_class: "OPEN_LOT", right_of_way_required: false, gate_open_minute: 300, gate_close_minute: 1380, max_truck_length_ft: 60 }
              as: SalesRep
              captures: { site_id: $.data.id }
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", site_id: "${site_id}", contract_kind: "EVENT", term_start: "2026-08-14", term_end: "2026-08-16", headcount: 399, event_duration_hours: 12, service_frequency_per_week: 3, season_code: "PEAK", construction_phase: "EVENT_NA", ada_required: true }
              as: SalesRep
              captures: { c399_id: $.data.id, c399_v: $.data.version }
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", site_id: "${site_id}", contract_kind: "EVENT", term_start: "2026-08-14", term_end: "2026-08-16", headcount: 400, event_duration_hours: 12, service_frequency_per_week: 3, season_code: "PEAK", construction_phase: "EVENT_NA", ada_required: true }
              as: SalesRep
              captures: { c400_id: $.data.id, c400_v: $.data.version }
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", site_id: "${site_id}", contract_kind: "EVENT", term_start: "2026-08-14", term_end: "2026-08-14", headcount: 400, event_duration_hours: 1, service_frequency_per_week: 3, season_code: "PEAK", construction_phase: "EVENT_NA", ada_required: true }
              as: SalesRep
              captures: { c400s_id: $.data.id, c400s_v: $.data.version }
          trigger:
            - call: "POST /rental-contracts/${c399_id}/quote"
              payload: { expected_contract_version: "${c399_v}" }
              as: SalesRep
              captures: { q399: $.data.quoted_cents }
            - call: "POST /rental-contracts/${c400_id}/quote"
              payload: { expected_contract_version: "${c400_v}" }
              as: SalesRep
              captures: { q400: $.data.quoted_cents }
            - call: "POST /rental-contracts/${c400s_id}/quote"
              payload: { expected_contract_version: "${c400s_v}" }
              as: SalesRep
              captures: { q400s: $.data.quoted_cents }
            - call: "GET /rental-contracts/${c399_id}/quote-lines"
              payload: { is_superseded: false }
              as: SalesRep
              captures: { lines399: $.data }
            - call: "GET /rental-contracts/${c400_id}/quote-lines"
              payload: { is_superseded: false }
              as: SalesRep
              captures: { lines400: $.data }
          assert:
            - "BELOW — ${q399} == 445000: 23 STANDARD_PORTABLE (333500) + 2 ADA_PORTABLE (45000) + 7 HANDWASH_STATION (66500)"
            - "AT — ${q400} == 906500: 3 TRAILER_8STALL (795000) + 2 ADA_PORTABLE (45000) + 7 HANDWASH_STATION (66500)"
            - "${lines399} contains no TRAILER_2STALL and no TRAILER_8STALL line even though base_capacity_units is 23"
            - "${lines400} contains no STANDARD_PORTABLE line at all — the tier switch is a shape change, not a rate change"
            - "One headcount step (399 -> 400) moves the total by 461500 cents; a `>` instead of `>=` comparison would return 445000 for ${q400}"
            - "FALSIFIER — ${q400s} == 110000: 1 TRAILER_2STALL (78000) + 1 ADA_PORTABLE (22500) + 1 HANDWASH_STATION (9500). base_capacity_units is only 2, so the trailer tier fired on headcount alone"
            - "Both ADA quantities are 2 = max(ADA_MIN_UNITS 1, ceil(restroom_units/20)) with restroom_units 23 and 24, and both handwash quantities are 7 = ceil((restroom_units + 2)/4)"

      - name: disposal_daily_cap_boundary_accepts_load_at_cap_and_rejects_one_gallon_over
