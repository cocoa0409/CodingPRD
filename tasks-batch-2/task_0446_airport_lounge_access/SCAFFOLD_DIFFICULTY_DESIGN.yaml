  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rto_shower_interval_buffered_turnover
        grounds:
          - calculations.check_shower_overlap
          - state_machines.ShowerReservation.BOOKED_to_CANCELLED
          - errors[ERR_SHOWER_CONFLICT]
        distinguishing_aspect: |
          ShowerSuite resource, pairwise half-open interval geometry with a buffered turnover: an existing
          [10:00,10:30) booking with turnover_minutes 15 blocks a new booking starting 10:30 (10:30 < 10:45) but
          a booking starting 10:45 is allowed (10:45 not < 10:45).
        test_recipe:
          setup:
            - "Lounge L with a ShowerSuite turnover_minutes 15. A member is CHECKED_IN at L (so shower booking is allowed)."
            - "Reservation R1 booked [2026-06-01T10:00:00Z, 2026-06-01T10:30:00Z). New booking at start 10:30 conflicts (buffered end 10:45); new booking at start 10:45 is accepted."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PRESTIGE", included_visits_per_year: 10, included_guest_visits_per_year: 5, overage_charge_cents: 5000, guest_charge_cents: 2500, min_card_status: "BASIC", annual_fee_cents: 0 }
              as: NetworkAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "LSh", airport_code: "HNL", capacity: 50, settlement_rate_cents: 1200, guest_fee_cents: 1000, day_pass_price_cents: 4000 }
              as: NetworkAdmin
              captures: { l_id: $.data.id, l_v0: $.data.version }
            - call: "POST /shower-suites"
              payload: { lounge_id: "${l_id}", label: "Suite A", turnover_minutes: 15 }
              as: NetworkAdmin
              captures: { suite_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: NetworkAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", full_name: "Shower Member" }
              as: NetworkAdmin
              captures: { m_id: $.data.id }
            - call: "POST /eligibility-cards"
              payload: { member_id: "${m_id}", card_status: "BASIC", fare_class: "ECONOMY", valid_until: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /visits"
              payload: { member_id: "${m_id}", lounge_id: "${l_id}", guest_count: 0, expected_lounge_version: "${l_v0}" }
              as: NetworkAdmin
              captures: { v_id: $.data.id }
            - call: "POST /visits/${v_id}/check-in"
              payload: {}
              as: LoungeAgent
              as_user_id: "${l_id}"
            - call: "POST /shower-reservations"
              payload: { shower_suite_id: "${suite_id}", visit_id: "${v_id}", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T10:30:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /shower-reservations"
              payload: { shower_suite_id: "${suite_id}", visit_id: "${v_id}", start_at: "2026-06-01T10:30:00Z", end_at: "2026-06-01T11:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { conflict_err: $.data.error_id }
            - call: "POST /shower-reservations"
              payload: { shower_suite_id: "${suite_id}", visit_id: "${v_id}", start_at: "2026-06-01T10:45:00Z", end_at: "2026-06-01T11:15:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ok_status: $.data.status }
          assert:
            - "Booking at start 10:30 -> error_id == ERR_SHOWER_CONFLICT (10:30 < buffered end 10:45), HTTP 409"
            - "Booking at start 10:45 -> status == BOOKED (10:45 is NOT < 10:45, buffer boundary is exclusive)"

      - name: rto_lounge_aggregate_capacity_overlap
        grounds:
          - validations[priority=11]
          - entities.Lounge.fields.current_occupancy
          - errors[ERR_OVER_CAPACITY]
        distinguishing_aspect: |
          Lounge resource (different entity from ShowerSuite), aggregate-capacity interval geometry: concurrent
          CHECKED_IN visits whose presence windows overlap compete for one shared capacity pool — a check-in is
          rejected when the SUM of concurrent occupant_counts would exceed capacity, not by pairwise interval math.
        test_recipe:
          setup:
            - "Lounge capacity 3. Two visits already CHECKED_IN totalling occupant_count 3 (one solo + one with 1 guest). A third single-occupant hold's check-in is rejected because aggregate occupancy 3 + 1 > 3."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PRESTIGE", included_visits_per_year: 10, included_guest_visits_per_year: 5, overage_charge_cents: 5000, guest_charge_cents: 2500, min_card_status: "BASIC", annual_fee_cents: 0 }
              as: NetworkAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "LAgg", airport_code: "AUS", capacity: 3, settlement_rate_cents: 1200, guest_fee_cents: 1000, day_pass_price_cents: 4000 }
              as: NetworkAdmin
              captures: { l_id: $.data.id, l_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", full_name: "Agg M1" }
              as: NetworkAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /eligibility-cards"
              payload: { member_id: "${m1_id}", card_status: "BASIC", fare_class: "ECONOMY", valid_until: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", full_name: "Agg M2" }
              as: NetworkAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /eligibility-cards"
              payload: { member_id: "${m2_id}", card_status: "BASIC", fare_class: "ECONOMY", valid_until: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", full_name: "Agg M3" }
              as: NetworkAdmin
              captures: { m3_id: $.data.id }
            - call: "POST /eligibility-cards"
              payload: { member_id: "${m3_id}", card_status: "BASIC", fare_class: "ECONOMY", valid_until: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /visits"
              payload: { member_id: "${m1_id}", lounge_id: "${l_id}", guest_count: 0, expected_lounge_version: "${l_v0}" }
              as: NetworkAdmin
              captures: { v1_id: $.data.id, l_v1: $.data.version }
            - call: "POST /visits/${v1_id}/check-in"
              payload: {}
              as: LoungeAgent
              as_user_id: "${l_id}"
            - call: "GET /lounges/${l_id}"
              payload: {}
              as: NetworkAdmin
              captures: { l_v_a: $.data.version }
            - call: "POST /visits"
              payload: { member_id: "${m2_id}", lounge_id: "${l_id}", guest_count: 1, guest_names: ["G"], expected_lounge_version: "${l_v_a}" }
              as: NetworkAdmin
              captures: { v2_id: $.data.id }
            - call: "POST /visits/${v2_id}/check-in"
              payload: {}
              as: LoungeAgent
              as_user_id: "${l_id}"
            - call: "GET /lounges/${l_id}"
              payload: {}
              as: NetworkAdmin
              captures: { l_v_b: $.data.version }
            - call: "POST /visits"
              payload: { member_id: "${m3_id}", lounge_id: "${l_id}", guest_count: 0, expected_lounge_version: "${l_v_b}" }
              as: NetworkAdmin
              captures: { v3_id: $.data.id }
          trigger:
            - call: "POST /visits/${v3_id}/check-in"
              payload: {}
              as: LoungeAgent
              as_user_id: "${l_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Lounge.${l_id}.current_occupancy == 3 before the third check-in (1 + 2 aggregate)"
            - "Third check-in error_id == ERR_OVER_CAPACITY (aggregate 3 + 1 > capacity 3), HTTP 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ci_settlement_reverse_lounge_balance_conserved
        grounds:
          - state_machines.Visit.CHECKED_IN_to_COMPLETED
          - state_machines.Settlement.PAYABLE_to_REVERSED
          - entities.Lounge.fields.settlement_balance_cents
        distinguishing_aspect: |
          Conserved quantity = Lounge.settlement_balance_cents == sum(amount_cents of PAYABLE settlements). Forward
          complete adds 1200; compensating reverse removes 1200; the invariant returns the balance to its pre-complete
          value 0 with zero drift.
        test_recipe:
          setup:
            - "Lounge L rate 1200, balance 0. A single-occupant visit completes -> Settlement 1200 PAYABLE, balance 1200. Reversing that settlement returns balance to 0."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PRESTIGE", included_visits_per_year: 10, included_guest_visits_per_year: 5, overage_charge_cents: 5000, guest_charge_cents: 2500, min_card_status: "BASIC", annual_fee_cents: 0 }
              as: NetworkAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "LRev", airport_code: "RDU", capacity: 50, settlement_rate_cents: 1200, guest_fee_cents: 1000, day_pass_price_cents: 4000 }
              as: NetworkAdmin
              captures: { l_id: $.data.id, l_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", full_name: "Rev Member" }
              as: NetworkAdmin
              captures: { m_id: $.data.id }
            - call: "POST /eligibility-cards"
              payload: { member_id: "${m_id}", card_status: "BASIC", fare_class: "ECONOMY", valid_until: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /visits"
              payload: { member_id: "${m_id}", lounge_id: "${l_id}", guest_count: 0, expected_lounge_version: "${l_v0}" }
              as: NetworkAdmin
              captures: { v_id: $.data.id }
            - call: "POST /visits/${v_id}/check-in"
              payload: {}
              as: LoungeAgent
              as_user_id: "${l_id}"
            - call: "POST /visits/${v_id}/complete"
              payload: {}
              as: LoungeAgent
              as_user_id: "${l_id}"
            - call: "GET /settlements?visit_id=${v_id}"
              payload: {}
              as: NetworkAdmin
              captures: { s_id: "$.data[0].id" }
          trigger:
            - call: "GET /lounges/${l_id}"
              payload: {}
              as: NetworkAdmin
              captures: { balance_before: $.data.settlement_balance_cents }
            - call: "POST /settlements/${s_id}/reverse"
              payload: {}
              as: NetworkAdmin
            - call: "GET /lounges/${l_id}"
              payload: {}
              as: NetworkAdmin
              captures: { balance_after: $.data.settlement_balance_cents }
          assert:
            - "balance_before == 1200 (forward complete added the settlement)"
            - "balance_after == 0 (compensating reverse restores Lounge.settlement_balance_cents to its pre-complete value; conserved quantity = sum of PAYABLE settlement amounts)"

      - name: ci_daypass_refund_wallet_balance_conserved
        grounds:
          - state_machines.DayPass.ISSUED_to_REFUNDED
          - entities.Member.fields.wallet_balance_cents
          - entities.LedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity = Member.wallet_balance_cents == sum(POSTED LedgerEntry.amount_cents) — a different
          conserved quantity (member wallet, not lounge payable). Forward purchase posts +4000; compensating refund
          posts -4000; net wallet returns to its pre-purchase value 0.
        test_recipe:
          setup:
            - "Lounge L day_pass_price_cents 4000. Member with wallet 0 buys a day pass -> DAY_PASS ledger +4000, wallet 4000. Refunding the unredeemed pass posts DAY_PASS_REFUND -4000, wallet back to 0."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "STANDARD", included_visits_per_year: 0, included_guest_visits_per_year: 0, overage_charge_cents: 5000, guest_charge_cents: 2500, min_card_status: "BASIC", annual_fee_cents: 0 }
              as: NetworkAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "LRef", airport_code: "TPA", capacity: 50, settlement_rate_cents: 1200, guest_fee_cents: 1000, day_pass_price_cents: 4000 }
              as: NetworkAdmin
              captures: { l_id: $.data.id, l_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", full_name: "Refund Member" }
              as: NetworkAdmin
              captures: { m_id: $.data.id }
            - call: "POST /lounges/${l_id}/day-passes"
              payload: { member_id: "${m_id}", expected_lounge_version: "${l_v0}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { dp_id: $.data.id }
          trigger:
            - call: "GET /memberships/${m_id}"
              payload: {}
              as: NetworkAdmin
              captures: { wallet_before: $.data.wallet_balance_cents }
            - call: "POST /day-passes/${dp_id}/refund"
              payload: {}
              as: NetworkAdmin
            - call: "GET /memberships/${m_id}"
              payload: {}
              as: NetworkAdmin
              captures: { wallet_after: $.data.wallet_balance_cents }
          assert:
            - "wallet_before == 4000 (purchase posted DAY_PASS +4000)"
            - "wallet_after == 0 (refund posted DAY_PASS_REFUND -4000; Member.wallet_balance_cents conserved to pre-purchase 0)"
