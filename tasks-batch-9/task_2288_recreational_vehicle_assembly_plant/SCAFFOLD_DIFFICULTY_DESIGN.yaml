  - rule_id: priority_pair_validation_conflict
    instances:

      - name: slot_reserve_on_cancelled_order_reports_state_before_credit_hold
        grounds:
          - validations[priority 7].ERR_ORDER_NOT_SLOTTABLE
          - validations[priority 16].ERR_DEALER_CREDIT_HOLD
          - calculations.dealer_credit_utilization
          - state_machines.UnitOrder.CONFIG_VALIDATED_to_CANCELLED
          - endpoints["POST /unit-orders/{id}/production-slots"]
        distinguishing_aspect: |
          The colliding pair is state (priority 7) against business_fiscal
          (priority 16): the dealer is genuinely on CREDIT_HOLD at 9501 bp, so
          both rules are live on the same request, and the 409 state error must
          win over the 422 fiscal error.
