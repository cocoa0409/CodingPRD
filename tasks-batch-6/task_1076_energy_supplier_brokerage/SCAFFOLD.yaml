# =============================================================================
# task_1076 — Deregulated Energy-Supplier Brokerage — seed tables (SCAFFOLD.yaml)
# §1.0–§1.7. Difficulty (§1.8) and corner (§1.9) designs live in sibling files.
# =============================================================================

scenario: |
  Deregulated Energy-Supplier Brokerage: account & usage/LOA, supplier RFP &
  rate/term, contract & switch/enrollment, renewal & rate-alert, green/REC
  option, demand-response enrollment, commission & true-up, reporting

domain_name: energy-supplier-brokerage
api_prefix: /            # flat topology: each entity is its own top-level collection (/customers, /accounts, /rfps, ...)

complexity_profile:
  primary_archetype: multi_party_negotiation      # RFP solicitation → supplier quotes → award
  secondary_archetype: ledger_reconciliation       # commission estimated-vs-actual true-up
  complexity_layers:
    - dual_variant_calculation                     # est-vs-actual commission; committed-vs-performed DR incentive
    - cascading_side_effects                        # LOA revoke and supplier suspend cascades
    - optimistic_concurrency                        # quote submit against a stale RFP version
    - scheduled_actions                             # logical clock drives expiry / renewal window / rate alerts

  entity_topology: flat
  # Peer entities linked by foreign keys carried in request bodies; URL paths are
  # single-segment collections (/accounts, /rfps, /quotes ...), never nested.

  state_machine_shape: cyclic
  # Rfp cycles BEST_AND_FINAL -> OPEN (re-open for another bidding round);
  # Contract branches PENDING_CUSTOMER -> {PENDING_APPROVAL, REJECTED}.

  relationship_patterns:
    - one_to_many          # Account -> UsageRecord/Rfp/Contract/DR; Rfp -> Quote
    - self_referential     # Contract.renewed_from_contract_id -> Contract.id
    - cross_aggregate      # CommissionStatement -> Contract -> Account; Quote -> Supplier

  role_model: segregation_of_duties
  # Four-eyes on the commission ledger: the BrokerManager who trues-up a
  # CommissionStatement must differ (by X-User-ID) from the one who approved it.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Customer legal / business name" }
      - { name: email, type: string, source: input, description: "Primary contact email" }
      - { name: segment, type: enum, source: input, description: "RESIDENTIAL | SMALL_COMMERCIAL | LARGE_COMMERCIAL" }
      - { name: service_state, type: string, source: input, description: "Two-letter deregulated-market state code, e.g. TX, OH, PA" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | INACTIVE" }

  - name: BrokerUser
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Broker staff member full name" }
      - { name: email, type: string, source: input, description: "Staff email" }
      - { name: staff_role, type: enum, source: input, description: "AGENT | MANAGER — the RBAC role this user acts as" }
      - { name: approval_limit_cents, type: integer, source: input, default: 0, description: "Max commission a MANAGER may approve; 0 for AGENT" }
      - { name: pipeline_commission_cents, type: integer, source: computed, description: "Sum of net_commission_cents over non-VOIDED statements on contracts this user brokered (reporting)" }

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Energy supplier name" }
      - { name: commodity, type: enum, source: input, description: "ELECTRICITY | GAS — commodity this supplier serves" }
      - { name: service_states, type: array, source: input, description: "List of two-letter state codes the supplier is licensed in" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED" }

  - name: UtilityAccount
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: broker_agent_id, type: string, source: input, description: "FK -> BrokerUser.id; the AGENT who owns this account" }
      - { name: utility_name, type: string, source: input, description: "Local distribution utility name" }
      - { name: account_number, type: string, source: input, description: "Utility account number; unique per utility_name" }
      - { name: commodity, type: enum, source: input, description: "ELECTRICITY | GAS" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code of service" }
      - { name: estimated_annual_usage_kwh, type: integer, source: input, description: "Broker estimate of annual consumption (kWh)" }
      - { name: reserved_dr_kw, type: integer, source: computed, description: "Sum of committed_kw over ENROLLED/ACTIVE DemandResponseEnrollment rows on this account" }
      - { name: status, type: enum, source: system, default: "PENDING_LOA", description: "PENDING_LOA | VERIFIED | ENROLLED | SUSPENDED" }

  - name: Authorization
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> UtilityAccount.id" }
      - { name: scope, type: enum, source: input, description: "USAGE_ONLY | USAGE_AND_ENROLL — what the LOA permits the broker to do" }
      - { name: signed_at, type: datetime, source: system, description: "Logical-clock instant the customer signed; null until SIGNED" }
      - { name: expires_at, type: datetime, source: input, description: "Instant after which the LOA is no longer valid" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SIGNED | REVOKED | EXPIRED" }

  - name: UsageRecord
    parent: null
    common_fields: false
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> UtilityAccount.id" }
      - { name: period_month, type: string, source: input, description: "Billing month YYYY-MM" }
      - { name: usage_kwh, type: integer, source: input, description: "Metered consumption for the month (kWh)" }
      - { name: source, type: enum, source: input, default: "UTILITY_EDI", description: "UTILITY_EDI | BROKER_ESTIMATE" }
      - { name: is_actual, type: boolean, source: input, default: true, description: "True for metered actuals (eligible for commission true-up); false for estimates" }

  - name: Rfp
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> UtilityAccount.id" }
      - { name: broker_agent_id, type: string, source: input, description: "FK -> BrokerUser.id; AGENT running the solicitation" }
      - { name: term_months_requested, type: integer, source: input, description: "Requested contract term in months" }
      - { name: green_pct_requested, type: integer, source: input, default: 0, description: "Requested renewable content 0-100" }
      - { name: due_at, type: datetime, source: input, description: "Bid deadline; quotes submitted at or after this instant are rejected" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | OPEN | BEST_AND_FINAL | AWARDED | CANCELLED" }

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - { name: rfp_id, type: string, source: input, description: "FK -> Rfp.id" }
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id" }
      - { name: rate_mills_per_kwh, type: integer, source: input, description: "Supplier energy rate in mills/kWh (1 mill = $0.001)" }
      - { name: term_months, type: integer, source: input, description: "Offered contract term in months" }
      - { name: green_pct, type: integer, source: input, default: 0, description: "Offered renewable content 0-100" }
      - { name: broker_adder_mills, type: integer, source: input, description: "Broker margin added on top of supplier rate, in mills/kWh" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | SHORTLISTED | AWARDED | WITHDRAWN | VOID" }

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> UtilityAccount.id" }
      - { name: quote_id, type: string, source: system, description: "FK -> Quote.id; the winning quote chosen by the award selector" }
      - { name: supplier_id, type: string, source: system, description: "FK -> Supplier.id; copied from the winning quote" }
      - { name: broker_agent_id, type: string, source: system, description: "FK -> BrokerUser.id; copied from the RFP that produced the quote" }
      - { name: renewed_from_contract_id, type: string, source: system, description: "FK -> Contract.id; set on a successor produced by /renew, else null" }
      - { name: term_months, type: integer, source: system, description: "Copied from winning quote" }
      - { name: rate_mills_per_kwh, type: integer, source: system, description: "Copied from winning quote" }
      - { name: broker_adder_mills, type: integer, source: system, description: "Copied from winning quote" }
      - { name: rec_adder_mills, type: integer, source: system, default: 0, description: "Extra mills for a green/REC rider added via /add-rec-rider" }
      - { name: green_pct, type: integer, source: system, description: "Effective renewable content; raised to 100 when a REC rider is added" }
      - { name: estimated_annual_usage_kwh, type: integer, source: input, description: "Usage basis pinned at award for provisional commission" }
      - { name: start_date, type: datetime, source: input, description: "Supply period start (inclusive)" }
      - { name: end_date, type: datetime, source: system, description: "Supply period end (exclusive) = start_date + term_months" }
      - { name: requested_switch_date, type: datetime, source: input, description: "Requested enrollment/switch date submitted to the utility" }
      - { name: confirmed_switch_date, type: datetime, source: system, description: "Switch date the utility confirmed; null until CONFIRMED" }
      - { name: renewal_window_open, type: boolean, source: system, default: false, description: "Set true by run-scheduled when end_date is within RENEWAL_WINDOW_DAYS of the clock" }
      - { name: rate_alert, type: enum, source: system, default: "NONE", description: "NONE | RATE_DROP — set by run-scheduled when the market rate falls materially below the contract rate" }
      - { name: latest_market_rate_mills, type: integer, source: system, description: "Most recent market rate observed for this commodity/state by record-market-rate" }
      - { name: status, type: enum, source: system, default: "PENDING_CUSTOMER", description: "PENDING_CUSTOMER | PENDING_APPROVAL | APPROVED | ENROLLMENT_SUBMITTED | ACTIVE | REJECTED | DROPPED | EXPIRED | RENEWED" }

  - name: CommissionStatement
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id" }
      - { name: basis, type: enum, source: system, default: "ESTIMATED", description: "ESTIMATED (provisional) | ACTUAL (after true-up)" }
      - { name: gross_commission_cents, type: integer, source: computed, description: "Provisional gross from estimated_annual_usage_kwh; pinned at creation" }
      - { name: actual_gross_cents, type: integer, source: computed, description: "Final gross from summed actual usage; null until true-up" }
      - { name: true_up_delta_cents, type: integer, source: computed, description: "actual_gross_cents - gross_commission_cents; null until true-up" }
      - { name: clawback_cents, type: integer, source: computed, default: 0, description: "max(0, gross_commission_cents - actual_gross_cents)" }
      - { name: net_commission_cents, type: integer, source: computed, description: "gross_commission_cents while PROVISIONAL/APPROVED; actual_gross_cents after true-up; 0 when VOIDED" }
      - { name: approved_by_manager_id, type: string, source: system, description: "BrokerUser id (MANAGER) who approved; audit only, not a canonical FK" }
      - { name: trued_up_by_manager_id, type: string, source: system, description: "BrokerUser id (MANAGER) who trued-up; must differ from approver (SoD); audit only" }
      - { name: status, type: enum, source: system, default: "PROVISIONAL", description: "PROVISIONAL | APPROVED | TRUED_UP | VOIDED" }

  - name: DemandResponseEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> UtilityAccount.id" }
      - { name: program_name, type: string, source: input, description: "DR program name" }
      - { name: season_start, type: datetime, source: input, description: "DR season start (inclusive)" }
      - { name: season_end, type: datetime, source: input, description: "DR season end (inclusive)" }
      - { name: committed_kw, type: integer, source: input, description: "Curtailment capacity the account commits (kW)" }
      - { name: incentive_per_kw_cents, type: integer, source: input, description: "Incentive paid per committed kW for the season (cents)" }
      - { name: performed_kw, type: integer, source: system, description: "Delivered curtailment kW recorded after an event; null until PERFORMED" }
      - { name: provisional_incentive_cents, type: integer, source: computed, description: "committed_kw * incentive_per_kw_cents; pinned at enrollment" }
      - { name: settled_incentive_cents, type: integer, source: computed, description: "Final incentive from performed_kw with shortfall penalty; null until SETTLED" }
      - { name: status, type: enum, source: system, default: "ENROLLED", description: "ENROLLED | ACTIVE | PERFORMED | SETTLED | WITHDRAWN" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Authorization
    initial_state: DRAFT
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /authorizations/{id}/sign"
        actor: Customer
        preconditions:
          - "Acting Customer owns the account this LOA references (else ERR_FORBIDDEN)"
          - "expires_at is strictly after the current logical clock (else ERR_VALIDATION)"
        side_effects:
          - "signed_at = current logical clock"

      - from: SIGNED
        to: REVOKED
        trigger: "POST /authorizations/{id}/revoke"
        actor: Customer
        preconditions: []
        side_effects:
          - "CASCADE hop 1: the referenced UtilityAccount transitions to SUSPENDED (if not already terminal)"
          - "CASCADE (via account suspension) continues in the UtilityAccount ANY->SUSPENDED transition"

      - from: SIGNED
        to: EXPIRED
        trigger: "system (run-scheduled: current clock >= expires_at)"
        actor: system
        preconditions:
          - "expires_at <= current logical clock"
        side_effects:
          - "UtilityAccount transitions to SUSPENDED if it was VERIFIED/ENROLLED and no other SIGNED LOA remains"

  - entity: UtilityAccount
    initial_state: PENDING_LOA
    terminal_states: [SUSPENDED]
    transitions:
      - from: PENDING_LOA
        to: VERIFIED
        trigger: "POST /accounts/{id}/verify"
        actor: BrokerAgent
        preconditions:
          - "A SIGNED, non-expired Authorization exists for this account (else ERR_LOA_NOT_SIGNED)"
          - "At least one UsageRecord exists for this account (else ERR_NO_USAGE_DATA)"
        side_effects: []

      - from: VERIFIED
        to: ENROLLED
        trigger: "system (a Contract on this account transitions to ACTIVE)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ANY
        to: SUSPENDED
        trigger: "system (cascade from Authorization REVOKED/EXPIRED)"
        actor: system
        preconditions:
          - "Account not already SUSPENDED"
        side_effects:
          - "CASCADE hop 2: every Rfp on this account in {DRAFT, OPEN, BEST_AND_FINAL} transitions to CANCELLED"

  - entity: Supplier
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /suppliers/{id}/set-status {status: SUSPENDED}"
        actor: OpsAdmin
        preconditions: []
        side_effects:
          - "CASCADE hop 1: every Quote from this supplier in {SUBMITTED, SHORTLISTED} transitions to WITHDRAWN"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /suppliers/{id}/set-status {status: ACTIVE}"
        actor: OpsAdmin
        preconditions: []
        side_effects: []

  - entity: Rfp
    initial_state: DRAFT
    terminal_states: [AWARDED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /rfps/{id}/transition {action: OPEN}"
        actor: BrokerAgent
        preconditions:
          - "Referenced UtilityAccount.status == VERIFIED (else ERR_ACCOUNT_NOT_VERIFIED)"
          - "A SIGNED Authorization with scope == USAGE_AND_ENROLL exists for the account (else ERR_LOA_SCOPE_INSUFFICIENT)"
        side_effects:
          - "Rfp becomes eligible to receive quotes"

      - from: OPEN
        to: BEST_AND_FINAL
        trigger: "POST /rfps/{id}/transition {action: BEST_AND_FINAL}"
        actor: BrokerAgent
        preconditions:
          - "At least one Quote in SUBMITTED or SHORTLISTED exists (else ERR_NO_QUOTES)"
        side_effects:
          - "increments Rfp.version by 1 (suppliers' prior views become stale for OCC)"

      - from: BEST_AND_FINAL
        to: OPEN
        trigger: "POST /rfps/{id}/transition {action: REOPEN}"
        actor: BrokerAgent
        preconditions: []
        side_effects:
          - "increments Rfp.version by 1 (CYCLE: re-open for another bidding round)"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /rfps/{id}/transition {action: CANCEL}"
        actor: BrokerAgent
        preconditions: []
        side_effects:
          - "CASCADE hop 3 (from LOA-revoke chain) or direct: every Quote on this Rfp in {SUBMITTED, SHORTLISTED} transitions to VOID"

      - from: BEST_AND_FINAL
        to: CANCELLED
        trigger: "POST /rfps/{id}/transition {action: CANCEL}"
        actor: BrokerAgent
        preconditions: []
        side_effects:
          - "every Quote on this Rfp in {SUBMITTED, SHORTLISTED} transitions to VOID"

      - from: OPEN
        to: AWARDED
        trigger: "system (POST /contracts award consumes this Rfp)"
        actor: system
        preconditions:
          - "The awarded Quote is SHORTLISTED and belongs to this Rfp"
        side_effects: []

      - from: BEST_AND_FINAL
        to: AWARDED
        trigger: "system (POST /contracts award consumes this Rfp)"
        actor: system
        preconditions:
          - "The awarded Quote is SHORTLISTED and belongs to this Rfp"
        side_effects: []

  - entity: Quote
    initial_state: SUBMITTED
    terminal_states: [AWARDED, WITHDRAWN, VOID]
    transitions:
      - from: SUBMITTED
        to: SHORTLISTED
        trigger: "POST /quotes/{id}/shortlist"
        actor: BrokerAgent
        preconditions:
          - "Parent Rfp in {OPEN, BEST_AND_FINAL} (else ERR_INVALID_STATE)"
        side_effects: []

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /quotes/{id}/withdraw"
        actor: Supplier
        preconditions:
          - "Acting Supplier owns this quote (else ERR_FORBIDDEN)"
        side_effects: []

      - from: SHORTLISTED
        to: WITHDRAWN
        trigger: "POST /quotes/{id}/withdraw OR system (cascade from Supplier SUSPENDED)"
        actor: Supplier | system
        preconditions: []
        side_effects:
          - "CASCADE hop 2 (supplier-suspend chain): if this quote was SHORTLISTED on an Rfp in BEST_AND_FINAL, that Rfp transitions BEST_AND_FINAL -> OPEN"

      - from: SHORTLISTED
        to: AWARDED
        trigger: "system (POST /contracts award selects this quote)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: VOID
        trigger: "system (cascade from Rfp CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SHORTLISTED
        to: VOID
        trigger: "system (cascade from Rfp CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Contract
    initial_state: PENDING_CUSTOMER
    terminal_states: [REJECTED, DROPPED, EXPIRED, RENEWED]
    transitions:
      - from: PENDING_CUSTOMER
        to: PENDING_APPROVAL
        trigger: "POST /contracts/{id}/customer-decision {decision: ACCEPT}"
        actor: Customer
        preconditions:
          - "Acting Customer owns the contract's account (else ERR_FORBIDDEN)"
        side_effects: []

      - from: PENDING_CUSTOMER
        to: REJECTED
        trigger: "POST /contracts/{id}/customer-decision {decision: REJECT}"
        actor: Customer
        preconditions: []
        side_effects:
          - "The winning Quote transitions AWARDED->VOID and the Rfp transitions AWARDED->BEST_AND_FINAL (re-openable for re-award)"

      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /contracts/{id}/approve"
        actor: BrokerManager
        preconditions:
          - "Supplier.status == ACTIVE (else ERR_SUPPLIER_NOT_ACTIVE)"
          - "broker_adder_mills >= MIN_BROKER_ADDER_MILLS (= 2 mills) (else ERR_MARGIN_BELOW_MIN)"
          - "gross_commission (estimated) <= acting manager's approval_limit_cents (else ERR_APPROVAL_LIMIT_EXCEEDED)"
        side_effects: []

      - from: APPROVED
        to: ENROLLMENT_SUBMITTED
        trigger: "POST /contracts/{id}/submit-enrollment"
        actor: BrokerAgent
        preconditions:
          - "No other Contract on the same account in {APPROVED, ENROLLMENT_SUBMITTED, ACTIVE} has a supply interval [start_date, end_date) overlapping this one (else ERR_CONTRACT_OVERLAP)"
        side_effects:
          - "requested_switch_date pinned from request"
          - "FORWARD (commission invariant): create a CommissionStatement (basis ESTIMATED, PROVISIONAL) with gross_commission_cents from the estimated-commission calc; pipeline_commission_cents rises by that amount"

      - from: ENROLLMENT_SUBMITTED
        to: ACTIVE
        trigger: "POST /contracts/{id}/enrollment-result {result: CONFIRM}"
        actor: OpsAdmin
        preconditions: []
        side_effects:
          - "confirmed_switch_date = current logical clock"
          - "The account transitions VERIFIED->ENROLLED"

      - from: ENROLLMENT_SUBMITTED
        to: DROPPED
        trigger: "POST /contracts/{id}/enrollment-result {result: REJECT}"
        actor: OpsAdmin
        preconditions: []
        side_effects:
          - "COMPENSATION (commission invariant): the contract's PROVISIONAL CommissionStatement transitions to VOIDED; net_commission_cents set to 0; pipeline_commission_cents falls back to its pre-submit value"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (run-scheduled: current clock >= end_date)"
        actor: system
        preconditions:
          - "current logical clock >= end_date"
        side_effects: []

      - from: ACTIVE
        to: RENEWED
        trigger: "POST /contracts/{id}/renew"
        actor: BrokerAgent
        preconditions:
          - "renewal_window_open == true (else ERR_RENEWAL_WINDOW_CLOSED)"
        side_effects:
          - "Create a successor Contract in PENDING_CUSTOMER with renewed_from_contract_id = this contract"

  - entity: CommissionStatement
    initial_state: PROVISIONAL
    terminal_states: [VOIDED]
    transitions:
      - from: PROVISIONAL
        to: APPROVED
        trigger: "POST /commission-statements/{id}/approve"
        actor: BrokerManager
        preconditions:
          - "Parent Contract.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "approved_by_manager_id = acting manager id"

      - from: APPROVED
        to: TRUED_UP
        trigger: "POST /commission-statements/{id}/true-up"
        actor: BrokerManager
        preconditions:
          - "acting manager id != approved_by_manager_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "At least one is_actual UsageRecord exists for the contract's account (else ERR_NO_ACTUAL_USAGE)"
        side_effects:
          - "basis = ACTUAL; compute actual_gross_cents, true_up_delta_cents, clawback_cents; net_commission_cents = actual_gross_cents"

      - from: PROVISIONAL
        to: VOIDED
        trigger: "system (cascade from Contract ENROLLMENT_SUBMITTED->DROPPED)"
        actor: system
        preconditions: []
        side_effects:
          - "net_commission_cents = 0"

  - entity: DemandResponseEnrollment
    initial_state: ENROLLED
    terminal_states: [SETTLED, WITHDRAWN]
    transitions:
      - from: ENROLLED
        to: ACTIVE
        trigger: "POST /dr-enrollments/{id}/activate"
        actor: OpsAdmin
        preconditions:
          - "Account.status == ENROLLED (has an ACTIVE supply contract) (else ERR_ACCOUNT_NOT_ENROLLED)"
        side_effects: []

      - from: ACTIVE
        to: PERFORMED
        trigger: "POST /dr-enrollments/{id}/record-performance"
        actor: OpsAdmin
        preconditions:
          - "current logical clock >= season_start (else ERR_DR_SEASON_NOT_STARTED)"
        side_effects:
          - "performed_kw pinned from request"

      - from: PERFORMED
        to: SETTLED
        trigger: "POST /dr-enrollments/{id}/settle"
        actor: BrokerManager
        preconditions: []
        side_effects:
          - "compute settled_incentive_cents from performed_kw with shortfall penalty"

      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /dr-enrollments/{id}/withdraw"
        actor: BrokerAgent
        preconditions: []
        side_effects:
          - "COMPENSATION (DR-capacity invariant): committed_kw released; account.reserved_dr_kw falls back by committed_kw"

      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /dr-enrollments/{id}/withdraw"
        actor: BrokerAgent
        preconditions: []
        side_effects:
          - "committed_kw released; account.reserved_dr_kw falls back by committed_kw"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: quote-submit-stale-rfp
    parent_entity: Rfp
    write_endpoint: "POST /quotes"
    occ_field: "expected_rfp_version"
    description: |
      Submitting a Quote against an Rfp whose version has advanced since the
      supplier last observed it is rejected. A new quote legitimately supersedes
      the supplier's own prior quote on the same Rfp (only the latest quote per
      supplier is considered at award), so a second strictly-sequential submit
      carrying the previously observed version would itself succeed under normal
      product semantics — this is a genuine create-with-supersede, not a state
      precondition. Because moving the Rfp to BEST_AND_FINAL, re-opening it, or
      another supplier's quote arriving each bump Rfp.version, the stale-version
      check detects that the RFP round the supplier priced against has moved on.
    error_id: ERR_STALE_RFP_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: estimated_commission
    trigger: "Contract APPROVED -> ENROLLMENT_SUBMITTED (CommissionStatement creation, basis ESTIMATED)"
    algorithm: tiered_pricing
    formula: |
      # MODE (a) combinatorial: >=3 inputs, tiered term multiplier + min/max clamp.
      base_cents      = round_half_up(estimated_annual_usage_kwh * broker_adder_mills / MILLS_TO_CENTS_DIVISOR)
      term_multiplier = 1.00 if term_months <= 12
                        1.10 if 13 <= term_months <= 24
                        1.20 if term_months >= 25
      tiered_cents    = round_half_up(base_cents * term_multiplier)
      gross_commission_cents = min(MAX_COMMISSION_CENTS, max(MIN_COMMISSION_CENTS, tiered_cents))
      # Provisional net equals gross until true-up.
      net_commission_cents = gross_commission_cents
    input_set: "Single Contract's own pinned fields at ENROLLMENT_SUBMITTED time"
    constants:
      MILLS_TO_CENTS_DIVISOR: 10        # 1 mill * 1 kWh = 0.1 cent
      MIN_COMMISSION_CENTS: 5000        # $50 floor per statement
      MAX_COMMISSION_CENTS: 5000000     # $50,000 ceiling per statement
    precision: "whole cents, round_half_up; multiplier applied before clamp"
    variants:
      - name: estimated
        when: "at ENROLLMENT_SUBMITTED — uses Contract.estimated_annual_usage_kwh"
        difference: "usage basis is the single pinned estimate; no per-month summation"

  - name: actual_commission_trueup
    trigger: "CommissionStatement APPROVED -> TRUED_UP (POST /commission-statements/{id}/true-up)"
    algorithm: aggregation
    formula: |
      # MODE (b) combinatorial: nested rounding where ORDER matters —
      # round each month to whole cents FIRST, THEN sum (pinned order).
      # Included usage: UsageRecord rows for the contract's account with
      # is_actual == true, ordered by period_month ASC (order affects nothing
      # here since summation is commutative, but pinned for determinism).
      per_month_cents[i] = round_half_up(usage_kwh[i] * broker_adder_mills / MILLS_TO_CENTS_DIVISOR)
      summed_cents       = sum(per_month_cents)          # sum AFTER rounding each month
      tiered_cents       = round_half_up(summed_cents * term_multiplier(term_months))
      actual_gross_cents = min(MAX_COMMISSION_CENTS, max(MIN_COMMISSION_CENTS, tiered_cents))
      true_up_delta_cents = actual_gross_cents - gross_commission_cents
      clawback_cents      = max(0, gross_commission_cents - actual_gross_cents)
      net_commission_cents = actual_gross_cents
    input_set: "UsageRecord rows for the contract's account where is_actual == true"
    constants:
      MILLS_TO_CENTS_DIVISOR: 10
      MIN_COMMISSION_CENTS: 5000
      MAX_COMMISSION_CENTS: 5000000
    precision: "round EACH month to whole cents, THEN sum; do NOT sum kWh then round once"
    variants:
      - name: actual
        when: "at true-up — uses summed metered actuals"
        difference: "same contract, actual metered usage instead of the estimate → divergent gross; drives clawback"

  - name: dr_provisional_incentive
    trigger: "DemandResponseEnrollment creation (POST /dr-enrollments)"
    algorithm: aggregation
    formula: |
      provisional_incentive_cents = committed_kw * incentive_per_kw_cents
    input_set: "Single DR enrollment's own committed_kw"
    constants: {}
    precision: "exact integer cents"
    variants:
      - name: committed
        when: "at enrollment"
        difference: "based on the committed_kw pledge, before any event"

  - name: dr_settled_incentive
    trigger: "DemandResponseEnrollment PERFORMED -> SETTLED (POST /dr-enrollments/{id}/settle)"
    algorithm: threshold
    formula: |
      # DUAL VARIANT vs dr_provisional_incentive on the SAME enrollment.
      if performed_kw >= committed_kw:
        settled_incentive_cents = committed_kw * incentive_per_kw_cents      # capped at commitment, no over-delivery bonus
      else:
        shortfall_kw = committed_kw - performed_kw
        settled_incentive_cents = max(0, performed_kw * incentive_per_kw_cents - shortfall_kw * DR_PENALTY_PER_KW_CENTS)
    input_set: "Single DR enrollment: performed_kw vs committed_kw"
    constants:
      DR_PENALTY_PER_KW_CENTS: 2000     # $20/kW shortfall penalty
    precision: "exact integer cents, floored at 0"
    variants:
      - name: performed
        when: "at settlement — uses recorded performed_kw"
        difference: "shortfall applies a per-kW penalty, diverging from the committed provisional"

  - name: contract_supply_window
    trigger: "POST /contracts (award) and run-scheduled"
    algorithm: interval_merge
    formula: |
      end_date = start_date plus term_months calendar months (exclusive upper bound)
      renewal_window_open = (end_date - current_clock) <= RENEWAL_WINDOW_DAYS days   # inclusive at exactly the boundary
      rate_alert = RATE_DROP if latest_market_rate_mills is not null
                   and latest_market_rate_mills < round_half_up(rate_mills_per_kwh * (1 - RATE_ALERT_DROP_PCT))
                   else NONE
    input_set: "Single Contract vs the current logical clock and latest market rate for its commodity/state"
    constants:
      RENEWAL_WINDOW_DAYS: 60
      RATE_ALERT_DROP_PCT: 0.10
    precision: "day-granular comparison against logical clock; boundary is inclusive (<=)"

  - name: account_reserved_dr_kw
    trigger: "DR enroll / withdraw / settle; read on GET /accounts/{id}"
    algorithm: aggregation
    formula: |
      reserved_dr_kw = sum(committed_kw for DemandResponseEnrollment on this account
                           whose status in {ENROLLED, ACTIVE, PERFORMED})
      # SETTLED and WITHDRAWN rows are excluded from the reserved pool.
    input_set: "DemandResponseEnrollment rows for this account with status in {ENROLLED, ACTIVE, PERFORMED}"
    constants: {}
    precision: "exact integer kW"

  - name: pipeline_commission
    trigger: "CommissionStatement create / void / true-up; read on GET /broker-users/{id} and GET /reports/commission-summary"
    algorithm: aggregation
    formula: |
      pipeline_commission_cents = sum(net_commission_cents for CommissionStatement
                                      where contract.broker_agent_id == this user
                                      and status in {PROVISIONAL, APPROVED, TRUED_UP})
      # VOIDED statements contribute 0 (their net_commission_cents is 0).
    input_set: "CommissionStatement rows joined via Contract.broker_agent_id, excluding VOIDED"
    constants: {}
    precision: "exact integer cents"

  - name: award_quote_selection
    trigger: "POST /contracts (award) — server selects the winning Quote"
    algorithm: weighted_scoring
    formula: |
      candidate_set = Quotes on the given Rfp with status == SHORTLISTED
      if candidate_set is empty: ERR_NO_ELIGIBLE_QUOTES        # empty-set fallback
      rank_key(q) = all_in_rate_mills = q.rate_mills_per_kwh + q.broker_adder_mills   # ascending (lowest wins)
      tie_break_1 = q.broker_adder_mills ascending
      tie_break_2 = q.created_at ascending                     # never q.id
      winner = first quote after sorting by (rank_key, tie_break_1, tie_break_2)
    input_set: "SHORTLISTED Quotes on the Rfp named in the award request"
    constants: {}
    precision: "integer mills comparison; deterministic tie-break chain ending on created_at ASC"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.7; for entity_backed roles X-User-ID must match an existing entity of that type"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all endpoints referencing a resource

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, integers non-negative, dates parseable"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all writes

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 6
    category: business_referential
    check: "Cross-entity linkage is coherent: the awarded Quote's Rfp.account_id equals the award's account, quote is SHORTLISTED; a CommissionStatement's contract matches"
    error_id: ERR_REFERENTIAL_MISMATCH
    http_status: 409
    applies_to: "POST /contracts, POST /commission-statements/* "

  - priority: 7
    category: business_referential
    check: "OCC: expected_rfp_version must equal the current Rfp.version"
    error_id: ERR_STALE_RFP_VERSION
    http_status: 412
    applies_to: "POST /quotes"

  - priority: 8
    category: business_safety
    check: "Cross-entity state dependency — RFP may open only if account VERIFIED and a SIGNED USAGE_AND_ENROLL LOA exists; Contract may be approved only if its Supplier is ACTIVE; DR may activate only if account ENROLLED"
    error_id: "ERR_ACCOUNT_NOT_VERIFIED / ERR_LOA_SCOPE_INSUFFICIENT / ERR_SUPPLIER_NOT_ACTIVE / ERR_ACCOUNT_NOT_ENROLLED"
    http_status: 409
    applies_to: "POST /rfps/{id}/transition (OPEN), POST /contracts/{id}/approve, POST /dr-enrollments/{id}/activate"

  - priority: 9
    category: business_safety
    check: "Segregation of duties — the manager truing-up a CommissionStatement must differ (X-User-ID) from the one who approved it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /commission-statements/{id}/true-up"

  - priority: 10
    category: business_temporal
    check: "Temporal windows — quote submitted at/after Rfp.due_at is rejected; new Contract supply interval [start,end) may not overlap another live contract on the account (half-open, adjacency start==prior end allowed); new DR season (closed interval) must clear existing DR seasons by DR_BUFFER_DAYS (= 14 days); renewal allowed only while renewal_window_open"
    error_id: "ERR_RFP_CLOSED / ERR_CONTRACT_OVERLAP / ERR_DR_SEASON_CONFLICT / ERR_RENEWAL_WINDOW_CLOSED"
    http_status: 409
    applies_to: "POST /quotes, POST /contracts/{id}/submit-enrollment, POST /dr-enrollments, POST /contracts/{id}/renew"

  - priority: 11
    category: business_fiscal
    check: "Fiscal floors/ceilings — broker_adder_mills below MIN_BROKER_ADDER_MILLS (= 2 mills; checked at quote submit AND at contract approve); estimated gross above the approving manager's approval_limit_cents; empty SHORTLISTED candidate set at award"
    error_id: "ERR_MARGIN_BELOW_MIN / ERR_APPROVAL_LIMIT_EXCEEDED / ERR_NO_ELIGIBLE_QUOTES"
    http_status: 409
    applies_to: "POST /quotes, POST /contracts/{id}/approve, POST /contracts"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Customer ---
  - method: POST
    path: "/customers"
    description: "Register a Customer"
    roles: [BrokerAgent, OpsAdmin]
    code: 201
    input: [legal_name, email, segment, service_state]
    output: Customer
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/customers/{customerId}"
    description: "Get a Customer"
    roles: [BrokerAgent, BrokerManager, Supplier, Customer, OpsAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --- BrokerUser ---
  - method: POST
    path: "/broker-users"
    description: "Create broker staff (AGENT or MANAGER)"
    roles: [OpsAdmin]
    code: 201
    input: [full_name, email, staff_role, "approval_limit_cents?"]
    output: BrokerUser
    side_effects: ["approval_limit_cents defaults to 0"]

  - method: GET
    path: "/broker-users/{brokerUserId}"
    description: "Get a broker user (exposes pipeline_commission_cents for reporting)"
    roles: [BrokerAgent, BrokerManager, OpsAdmin]
    code: 200
    input: []
    output: BrokerUser
    side_effects: []

  # --- Supplier ---
  - method: POST
    path: "/suppliers"
    description: "Register a Supplier"
    roles: [OpsAdmin]
    code: 201
    input: [name, commodity, service_states]
    output: Supplier
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/suppliers/{supplierId}"
    description: "Get a Supplier"
    roles: [BrokerAgent, BrokerManager, Supplier, Customer, OpsAdmin]
    code: 200
    input: []
    output: Supplier
    side_effects: []

  - method: POST
    path: "/suppliers/{supplierId}/set-status"
    description: "Suspend or reinstate a Supplier"
    roles: [OpsAdmin]
    code: 200
    input: [status]
    output: Supplier
    side_effects:
      - "On ACTIVE->SUSPENDED: cascade WITHDRAW every {SUBMITTED,SHORTLISTED} Quote from this supplier; each SHORTLISTED withdrawal on a BEST_AND_FINAL Rfp reverts that Rfp to OPEN"

  # --- UtilityAccount ---
  - method: POST
    path: "/accounts"
    description: "Create a UtilityAccount"
    roles: [BrokerAgent]
    code: 201
    input: [customer_id, broker_agent_id, utility_name, account_number, commodity, state_code, estimated_annual_usage_kwh]
    output: UtilityAccount
    side_effects: ["status=PENDING_LOA; reserved_dr_kw=0"]

  - method: GET
    path: "/accounts/{accountId}"
    description: "Get a UtilityAccount (exposes reserved_dr_kw)"
    roles: [BrokerAgent, BrokerManager, Supplier, Customer, OpsAdmin]
    code: 200
    input: []
    output: UtilityAccount
    side_effects: []

  - method: GET
    path: "/accounts"
    description: "List UtilityAccounts, optionally filtered by customer or agent"
    roles: [BrokerAgent, BrokerManager, OpsAdmin]
    code: 200
    input: ["customer_id?", "broker_agent_id?", "limit?", "offset?"]
    output: "UtilityAccount[]"
    side_effects: []

  - method: POST
    path: "/accounts/{accountId}/verify"
    description: "Verify an account (usage pulled under a signed LOA)"
    roles: [BrokerAgent]
    code: 200
    input: []
    output: UtilityAccount
    side_effects: ["status PENDING_LOA->VERIFIED"]

  # --- Authorization (LOA) ---
  - method: POST
    path: "/authorizations"
    description: "Draft an LOA for an account"
    roles: [BrokerAgent]
    code: 201
    input: [account_id, scope, expires_at]
    output: Authorization
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/authorizations/{authorizationId}"
    description: "Get an LOA"
    roles: [BrokerAgent, BrokerManager, Customer, OpsAdmin]
    code: 200
    input: []
    output: Authorization
    side_effects: []

  - method: GET
    path: "/authorizations"
    description: "List LOAs, optionally filtered by account"
    roles: [BrokerAgent, BrokerManager, Customer, OpsAdmin]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: "Authorization[]"
    side_effects: []

  - method: POST
    path: "/authorizations/{authorizationId}/sign"
    description: "Customer signs the LOA"
    roles: [Customer]
    code: 200
    input: []
    output: Authorization
    side_effects: ["status DRAFT->SIGNED; signed_at=clock"]

  - method: POST
    path: "/authorizations/{authorizationId}/revoke"
    description: "Customer revokes a signed LOA (cascade)"
    roles: [Customer]
    code: 200
    input: []
    output: Authorization
    side_effects:
      - "status SIGNED->REVOKED"
      - "cascade: account->SUSPENDED; account suspension cascades OPEN/BEST_AND_FINAL Rfps->CANCELLED; each cancel VOIDs its {SUBMITTED,SHORTLISTED} Quotes"

  # --- UsageRecord ---
  - method: POST
    path: "/usage-records"
    description: "Import a monthly usage record for an account"
    roles: [BrokerAgent, OpsAdmin]
    code: 201
    input: [account_id, period_month, usage_kwh, "source?", "is_actual?"]
    output: UsageRecord
    side_effects: []

  - method: GET
    path: "/usage-records/{usageRecordId}"
    description: "Get a usage record"
    roles: [BrokerAgent, BrokerManager, OpsAdmin]
    code: 200
    input: []
    output: UsageRecord
    side_effects: []

  - method: GET
    path: "/usage-records"
    description: "List usage records, filtered by account"
    roles: [BrokerAgent, BrokerManager, OpsAdmin]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: "UsageRecord[]"
    side_effects: []

  # --- Rfp ---
  - method: POST
    path: "/rfps"
    description: "Draft an RFP for an account"
    roles: [BrokerAgent]
    code: 201
    input: [account_id, broker_agent_id, term_months_requested, "green_pct_requested?", due_at]
    output: Rfp
    side_effects: ["status=DRAFT; version=1"]

  - method: GET
    path: "/rfps/{rfpId}"
    description: "Get an RFP"
    roles: [BrokerAgent, BrokerManager, Supplier, Customer, OpsAdmin]
    code: 200
    input: []
    output: Rfp
    side_effects: []

  - method: GET
    path: "/rfps"
    description: "List RFPs, optionally filtered by account or agent"
    roles: [BrokerAgent, BrokerManager, Supplier, OpsAdmin]
    code: 200
    input: ["account_id?", "broker_agent_id?", "limit?", "offset?"]
    output: "Rfp[]"
    side_effects: []

  - method: POST
    path: "/rfps/{rfpId}/transition"
    description: "Advance an RFP (OPEN, BEST_AND_FINAL, REOPEN, CANCEL)"
    roles: [BrokerAgent]
    code: 200
    input: [action]
    output: Rfp
    side_effects:
      - "OPEN: DRAFT->OPEN (requires account VERIFIED + SIGNED USAGE_AND_ENROLL LOA)"
      - "BEST_AND_FINAL: OPEN->BEST_AND_FINAL, version+=1"
      - "REOPEN: BEST_AND_FINAL->OPEN, version+=1 (cycle)"
      - "CANCEL: ->CANCELLED, VOID all {SUBMITTED,SHORTLISTED} quotes"

  # --- Quote ---
  - method: POST
    path: "/quotes"
    description: "Supplier submits a quote against an RFP (OCC on Rfp.version)"
    roles: [Supplier]
    code: 201
    input: [rfp_id, supplier_id, rate_mills_per_kwh, term_months, "green_pct?", broker_adder_mills, expected_rfp_version]
    output: Quote
    side_effects:
      - "status=SUBMITTED"
      - "increments Rfp.version by 1"

  - method: GET
    path: "/quotes/{quoteId}"
    description: "Get a Quote"
    roles: [BrokerAgent, BrokerManager, Supplier, OpsAdmin]
    code: 200
    input: []
    output: Quote
    side_effects: []

  - method: GET
    path: "/quotes"
    description: "List Quotes, optionally filtered by RFP and/or supplier"
    roles: [BrokerAgent, BrokerManager, Supplier, OpsAdmin]
    code: 200
    input: ["rfp_id?", "supplier_id?", "limit?", "offset?"]
    output: "Quote[]"
    side_effects: []

  - method: POST
    path: "/quotes/{quoteId}/shortlist"
    description: "Broker shortlists a submitted quote"
    roles: [BrokerAgent]
    code: 200
    input: []
    output: Quote
    side_effects: ["status SUBMITTED->SHORTLISTED"]

  - method: POST
    path: "/quotes/{quoteId}/withdraw"
    description: "Supplier withdraws a quote"
    roles: [Supplier]
    code: 200
    input: []
    output: Quote
    side_effects: ["status ->WITHDRAWN; if SHORTLISTED on a BEST_AND_FINAL Rfp, that Rfp reverts to OPEN"]

  # --- Contract ---
  - method: POST
    path: "/contracts"
    description: "Award: server selects the winning SHORTLISTED quote on the RFP and creates a Contract"
    roles: [BrokerAgent]
    code: 201
    input: [rfp_id, account_id, estimated_annual_usage_kwh, start_date, requested_switch_date]
    output: Contract
    side_effects:
      - "select winning quote via award_quote_selection (empty SHORTLISTED set -> ERR_NO_ELIGIBLE_QUOTES)"
      - "copy quote_id/supplier_id/term_months/rate_mills_per_kwh/broker_adder_mills/green_pct; broker_agent_id from Rfp"
      - "end_date = start_date + term_months; status=PENDING_CUSTOMER"
      - "winning Quote->AWARDED; Rfp->AWARDED"

  - method: GET
    path: "/contracts/{contractId}"
    description: "Get a Contract"
    roles: [BrokerAgent, BrokerManager, Supplier, Customer, OpsAdmin]
    code: 200
    input: []
    output: Contract
    side_effects: []

  - method: GET
    path: "/contracts"
    description: "List Contracts with optional filters (reverse-reachability for all Contract FKs)"
    roles: [BrokerAgent, BrokerManager, Supplier, Customer, OpsAdmin]
    code: 200
    input: ["account_id?", "quote_id?", "supplier_id?", "broker_agent_id?", "renewed_from_contract_id?", "limit?", "offset?"]
    output: "Contract[]"
    side_effects: []

  - method: POST
    path: "/contracts/{contractId}/customer-decision"
    description: "Customer accepts or rejects the awarded contract"
    roles: [Customer]
    code: 200
    input: [decision]
    output: Contract
    side_effects:
      - "ACCEPT: PENDING_CUSTOMER->PENDING_APPROVAL"
      - "REJECT: PENDING_CUSTOMER->REJECTED; winning Quote AWARDED->VOID; Rfp AWARDED->BEST_AND_FINAL"

  - method: POST
    path: "/contracts/{contractId}/approve"
    description: "Manager approves a customer-accepted contract"
    roles: [BrokerManager]
    code: 200
    input: []
    output: Contract
    side_effects: ["PENDING_APPROVAL->APPROVED (supplier ACTIVE, margin, approval-limit checks)"]

  - method: POST
    path: "/contracts/{contractId}/submit-enrollment"
    description: "Agent submits the switch/enrollment to the utility"
    roles: [BrokerAgent]
    code: 200
    input: []
    output: Contract
    side_effects:
      - "APPROVED->ENROLLMENT_SUBMITTED (rejects on supply-interval overlap)"
      - "create PROVISIONAL CommissionStatement (estimated gross); pipeline_commission_cents rises"

  - method: POST
    path: "/contracts/{contractId}/enrollment-result"
    description: "Ops posts the utility's switch result (CONFIRM or REJECT)"
    roles: [OpsAdmin]
    code: 200
    input: [result]
    output: Contract
    side_effects:
      - "CONFIRM: ENROLLMENT_SUBMITTED->ACTIVE; confirmed_switch_date=clock; account VERIFIED->ENROLLED"
      - "REJECT: ENROLLMENT_SUBMITTED->DROPPED; PROVISIONAL CommissionStatement->VOIDED (net=0); pipeline falls back"

  - method: POST
    path: "/contracts/{contractId}/add-rec-rider"
    description: "Add a green/REC rider to a not-yet-active contract"
    roles: [BrokerAgent]
    code: 200
    input: [rec_adder_mills]
    output: Contract
    side_effects: ["rec_adder_mills set; green_pct raised to 100; only when status in {PENDING_APPROVAL, APPROVED}"]

  - method: POST
    path: "/contracts/{contractId}/renew"
    description: "Renew an active contract inside its renewal window"
    roles: [BrokerAgent]
    code: 201
    input: [start_date, requested_switch_date, estimated_annual_usage_kwh]
    output: Contract
    side_effects:
      - "requires renewal_window_open==true"
      - "this contract ACTIVE->RENEWED; create successor Contract PENDING_CUSTOMER with renewed_from_contract_id set"

  # --- CommissionStatement ---
  - method: GET
    path: "/commission-statements/{statementId}"
    description: "Get a commission statement"
    roles: [BrokerAgent, BrokerManager, OpsAdmin]
    code: 200
    input: []
    output: CommissionStatement
    side_effects: []

  - method: GET
    path: "/commission-statements"
    description: "List commission statements, filtered by contract"
    roles: [BrokerAgent, BrokerManager, OpsAdmin]
    code: 200
    input: ["contract_id?", "limit?", "offset?"]
    output: "CommissionStatement[]"
    side_effects: []

  - method: POST
    path: "/commission-statements/{statementId}/approve"
    description: "Manager approves the provisional commission"
    roles: [BrokerManager]
    code: 200
    input: []
    output: CommissionStatement
    side_effects: ["PROVISIONAL->APPROVED; approved_by_manager_id=acting manager"]

  - method: POST
    path: "/commission-statements/{statementId}/true-up"
    description: "A DIFFERENT manager trues-up commission against actual usage (SoD)"
    roles: [BrokerManager]
    code: 200
    input: []
    output: CommissionStatement
    side_effects: ["APPROVED->TRUED_UP; compute actual_gross/clawback/net; trued_up_by_manager_id set"]

  # --- DemandResponseEnrollment ---
  - method: POST
    path: "/dr-enrollments"
    description: "Enroll an account into a demand-response program (reserves committed_kw)"
    roles: [BrokerAgent]
    code: 201
    input: [account_id, program_name, season_start, season_end, committed_kw, incentive_per_kw_cents]
    output: DemandResponseEnrollment
    side_effects:
      - "status=ENROLLED; provisional_incentive_cents pinned; account.reserved_dr_kw rises by committed_kw"
      - "rejects on season overlap/buffer conflict with existing DR on the account"

  - method: GET
    path: "/dr-enrollments/{drId}"
    description: "Get a DR enrollment"
    roles: [BrokerAgent, BrokerManager, OpsAdmin]
    code: 200
    input: []
    output: DemandResponseEnrollment
    side_effects: []

  - method: GET
    path: "/dr-enrollments"
    description: "List DR enrollments, filtered by account"
    roles: [BrokerAgent, BrokerManager, OpsAdmin]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: "DemandResponseEnrollment[]"
    side_effects: []

  - method: POST
    path: "/dr-enrollments/{drId}/activate"
    description: "Ops activates a DR enrollment"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: DemandResponseEnrollment
    side_effects: ["ENROLLED->ACTIVE (requires account ENROLLED)"]

  - method: POST
    path: "/dr-enrollments/{drId}/record-performance"
    description: "Ops records delivered curtailment kW after an event"
    roles: [OpsAdmin]
    code: 200
    input: [performed_kw]
    output: DemandResponseEnrollment
    side_effects: ["ACTIVE->PERFORMED; performed_kw pinned"]

  - method: POST
    path: "/dr-enrollments/{drId}/settle"
    description: "Manager settles the DR incentive (dual variant vs provisional)"
    roles: [BrokerManager]
    code: 200
    input: []
    output: DemandResponseEnrollment
    side_effects: ["PERFORMED->SETTLED; compute settled_incentive_cents"]

  - method: POST
    path: "/dr-enrollments/{drId}/withdraw"
    description: "Agent withdraws a DR enrollment (releases reserved kW)"
    roles: [BrokerAgent]
    code: 200
    input: []
    output: DemandResponseEnrollment
    side_effects: ["->WITHDRAWN; account.reserved_dr_kw falls back by committed_kw"]

  # --- Reporting & operations ---
  - method: GET
    path: "/reports/commission-summary"
    description: "Aggregate net commission across an account's non-voided statements"
    roles: [BrokerAgent, BrokerManager, OpsAdmin]
    code: 200
    input: ["account_id?"]
    output: "{ total_net_commission_cents: integer, statement_count: integer }"
    side_effects: []

  - method: POST
    path: "/operations/record-market-rate"
    description: "Record the current market rate for a commodity/state (drives rate alerts)"
    roles: [OpsAdmin]
    code: 200
    input: [commodity, state_code, rate_mills]
    output: "{ commodity: string, state_code: string, rate_mills: integer }"
    side_effects: ["latest market rate stored for later run-scheduled evaluation"]

  - method: POST
    path: "/operations/run-scheduled"
    description: "Advance system: expire LOAs/contracts, open renewal windows, set rate alerts"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: "{ expired_loas: integer, expired_contracts: integer, renewal_windows_opened: integer, rate_alerts_raised: integer }"
    side_effects:
      - "SIGNED LOAs past expires_at -> EXPIRED (cascade account SUSPEND as applicable)"
      - "ACTIVE contracts past end_date -> EXPIRED"
      - "ACTIVE contracts within RENEWAL_WINDOW_DAYS -> renewal_window_open=true"
      - "ACTIVE contracts whose latest_market_rate_mills dropped materially -> rate_alert=RATE_DROP"

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: set the logical clock. Server startup default is 2026-05-01T00:00:00Z; before any set, the clock reads exactly this default (never wall-clock)."
    roles: [OpsAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock set to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth / existence / request ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint, or entity_backed X-User-ID does not own the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced resource does not exist" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body: missing required field, bad enum, negative integer, unparseable date, or expires_at not in the future" }
  - { id: ERR_DUPLICATE_ACCOUNT_NUMBER, http: 409, condition: "account_number already exists for the same utility_name" }

  # --- State ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state from which the requested transition is defined" }

  # --- Referential / concurrency ---
  - { id: ERR_REFERENTIAL_MISMATCH, http: 409, condition: "award account_id != selected quote's Rfp.account_id, or statement/contract linkage incoherent" }
  - { id: ERR_STALE_RFP_VERSION, http: 412, condition: "expected_rfp_version != current Rfp.version on quote submit" }

  # --- Cross-entity state dependencies ---
  - { id: ERR_ACCOUNT_NOT_VERIFIED, http: 409, condition: "RFP cannot open: account not VERIFIED" }
  - { id: ERR_LOA_SCOPE_INSUFFICIENT, http: 409, condition: "RFP cannot open: no SIGNED LOA with scope USAGE_AND_ENROLL" }
  - { id: ERR_SUPPLIER_NOT_ACTIVE, http: 409, condition: "Contract cannot be approved: winning quote's Supplier is SUSPENDED" }
  - { id: ERR_ACCOUNT_NOT_ENROLLED, http: 409, condition: "DR cannot activate: account not ENROLLED (no ACTIVE supply contract)" }
  - { id: ERR_LOA_NOT_SIGNED, http: 409, condition: "Account verify: no SIGNED, non-expired LOA exists" }
  - { id: ERR_NO_USAGE_DATA, http: 409, condition: "Account verify: no UsageRecord exists for the account" }
  - { id: ERR_NO_QUOTES, http: 409, condition: "RFP cannot move to BEST_AND_FINAL: no SUBMITTED/SHORTLISTED quotes" }
  - { id: ERR_NO_ACTUAL_USAGE, http: 409, condition: "True-up: no is_actual UsageRecord for the contract's account" }

  # --- Segregation of duties ---
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "True-up manager equals the approving manager (X-User-ID)" }

  # --- Temporal ---
  - { id: ERR_RFP_CLOSED, http: 409, condition: "Quote submitted at or after Rfp.due_at" }
  - { id: ERR_CONTRACT_OVERLAP, http: 409, condition: "New supply interval [start,end) overlaps another live contract on the account (adjacency allowed)" }
  - { id: ERR_DR_SEASON_CONFLICT, http: 409, condition: "New DR season overlaps, or is within DR_BUFFER_DAYS (= 14 days) of, an existing live DR season (status in {ENROLLED, ACTIVE, PERFORMED}) on the account" }
  - { id: ERR_DR_SEASON_NOT_STARTED, http: 409, condition: "record-performance before season_start" }
  - { id: ERR_RENEWAL_WINDOW_CLOSED, http: 409, condition: "Renew requested while renewal_window_open == false" }

  # --- Fiscal ---
  - { id: ERR_MARGIN_BELOW_MIN, http: 409, condition: "broker_adder_mills < MIN_BROKER_ADDER_MILLS" }
  - { id: ERR_APPROVAL_LIMIT_EXCEEDED, http: 409, condition: "Estimated gross commission exceeds the approving manager's approval_limit_cents" }
  - { id: ERR_NO_ELIGIBLE_QUOTES, http: 409, condition: "Award attempted with an empty SHORTLISTED candidate set on the RFP" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BrokerAgent
    description: "Front-line broker: manages accounts, LOAs, usage imports, RFPs, quote shortlisting, awards, enrollment submission, REC riders, renewals, DR enrollment/withdrawal"
    identity: "entity_backed:BrokerUser"
    exclusive_operations:
      - "POST /accounts — create account"
      - "POST /accounts/{id}/verify — verify account"
      - "POST /authorizations — draft LOA"
      - "POST /rfps — draft RFP"
      - "POST /rfps/{id}/transition — advance RFP"
      - "POST /quotes/{id}/shortlist — shortlist quote"
      - "POST /contracts — award contract"
      - "POST /contracts/{id}/submit-enrollment — submit enrollment"
      - "POST /contracts/{id}/add-rec-rider — add REC rider"
      - "POST /contracts/{id}/renew — renew contract"
      - "POST /dr-enrollments — enroll DR"
      - "POST /dr-enrollments/{id}/withdraw — withdraw DR"
    shared_operations:
      - "POST /customers (with OpsAdmin)"
      - "POST /usage-records (with OpsAdmin)"
      - "GET reads across the domain"

  - name: BrokerManager
    description: "Broker supervisor: approves contracts within an approval limit, approves and trues-up commission (four-eyes SoD), settles DR incentives"
    identity: "entity_backed:BrokerUser"
    exclusive_operations:
      - "POST /contracts/{id}/approve — approve contract"
      - "POST /commission-statements/{id}/approve — approve commission"
      - "POST /commission-statements/{id}/true-up — true-up commission (must differ from approver)"
      - "POST /dr-enrollments/{id}/settle — settle DR incentive"
    shared_operations:
      - "GET reads across the domain"

  - name: Supplier
    description: "Energy supplier: submits and withdraws quotes on RFPs it can see"
    identity: "entity_backed:Supplier"
    exclusive_operations:
      - "POST /quotes — submit quote"
      - "POST /quotes/{id}/withdraw — withdraw own quote"
    shared_operations:
      - "GET reads on RFPs, quotes, suppliers, accounts, contracts"

  - name: Customer
    description: "Energy consumer: signs/revokes LOAs on own accounts, accepts/rejects awarded contracts"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /authorizations/{id}/sign — sign LOA"
      - "POST /authorizations/{id}/revoke — revoke LOA"
      - "POST /contracts/{id}/customer-decision — accept/reject contract"
    shared_operations:
      - "GET reads on own accounts, LOAs, contracts"

  - name: OpsAdmin
    description: "Operational/back-office operator (utility EDI proxy, market data, clock, scheduler). Not tied to a persisted entity"
    identity: "opaque"
    exclusive_operations:
      - "POST /broker-users — create broker staff"
      - "POST /suppliers — register supplier"
      - "POST /suppliers/{id}/set-status — suspend/reinstate supplier"
      - "POST /contracts/{id}/enrollment-result — post utility switch result"
      - "POST /dr-enrollments/{id}/activate — activate DR"
      - "POST /dr-enrollments/{id}/record-performance — record DR performance"
      - "POST /operations/record-market-rate — record market rate"
      - "POST /operations/run-scheduled — advance system"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "POST /customers (with BrokerAgent)"
      - "POST /usage-records (with BrokerAgent)"
      - "GET reads across the domain"





