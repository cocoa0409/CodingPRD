  # ===========================================================================
  # Guide section 2 — From Table 2 (State Machines)
  # ===========================================================================
  - section: state_machines
    instances:

      - name: sampling_frame_is_born_draft_with_uninitialised_slots
        claim_type: initial_state
        grounds:
          - state_machines.SamplingFrame.initial_state
          - entities.SamplingFrame.fields.open_lost_slots
        distinguishing_aspect: "A DRAFT frame must NOT have its open_<stratum>_slots seeded from the quotas — that only happens at seal, so a fresh frame reports 0 open slots despite non-zero quotas."
        test_recipe:
          setup: ["one ACTIVE program"]
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramAdmin
              as_user_id: admin-1
            - call: POST /programs
              payload: { name: "Q3 Win-Loss", fiscal_quarter: "2026-Q3", incentive_budget_usd: 10000.00, interview_incentive_cap_usd: 500.00, min_deal_value_usd: 50000.00 }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { p_id: $.data.id }
            - call: POST /programs/${p_id}/activate
              payload: {}
              as: ProgramAdmin
              as_user_id: admin-1
          trigger:
            - call: POST /sampling-frames
              payload: { program_id: "${p_id}", label: "Wave 1", window_start: "2026-04-01T00:00:00.000Z", window_end: "2026-07-01T00:00:00.000Z", quota_won: 2, quota_lost: 2, quota_no_decision: 1, selection_basis: "STRATIFIED_BY_SEGMENT" }
              as: ResearchAnalyst
              as_user_id: analyst-unbound
          assert:
            - "HTTP 201"
            - "data.status == \"DRAFT\""
            - "data.open_won_slots == 0"
            - "data.open_lost_slots == 0"
            - "data.open_no_decision_slots == 0"
            - "data.selected_won_count == 0 and data.selected_lost_count == 0 and data.selected_no_decision_count == 0"
            - "data.coverage_ratio == 0.0000"
            - "data.version == 1"

      - name: program_activation_from_draft_moves_to_active_and_bumps_version
        claim_type: valid_transition
        grounds:
          - state_machines.Program.DRAFT_to_ACTIVE
        distinguishing_aspect: "The declared DRAFT -> ACTIVE trigger must land ACTIVE with posture recomputed from a zero ledger (utilization 0.0000 -> OPEN) and version incremented exactly once."
        test_recipe:
          setup: ["one DRAFT program with a positive budget and the three mandatory guide keys"]
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramAdmin
              as_user_id: admin-1
            - call: POST /programs
              payload: { name: "Q3 Win-Loss", fiscal_quarter: "2026-Q3", incentive_budget_usd: 10000.00, interview_incentive_cap_usd: 500.00, min_deal_value_usd: 50000.00 }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { p_id: $.data.id }
          trigger:
            - call: POST /programs/${p_id}/activate
              payload: {}
              as: ProgramAdmin
              as_user_id: admin-1
          assert:
            - "HTTP 200"
            - "data.status == \"ACTIVE\""
            - "data.posture == \"OPEN\""
            - "data.version == 2"

      - name: program_close_directly_from_active_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.Program.CLOSING_to_CLOSED
          - validations.priority_13
          - errors.ERR_PROGRAM_STATE_INVALID
        distinguishing_aspect: "CLOSED is only reachable from CLOSING; skipping begin-closing must be refused and must NOT withdraw battlecards or tighten posture."
        test_recipe:
          setup: ["one ACTIVE program"]
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramAdmin
              as_user_id: admin-1
            - call: POST /programs
              payload: { name: "Q3 Win-Loss", fiscal_quarter: "2026-Q3", incentive_budget_usd: 10000.00, interview_incentive_cap_usd: 500.00, min_deal_value_usd: 50000.00 }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { p_id: $.data.id }
            - call: POST /programs/${p_id}/activate
              payload: {}
              as: ProgramAdmin
              as_user_id: admin-1
          trigger:
            - call: POST /programs/${p_id}/close
              payload: {}
              as: ProgramAdmin
              as_user_id: admin-1
          assert:
            - "HTTP 409"
            - "data.error_id == \"ERR_PROGRAM_STATE_INVALID\""
            - "GET /programs/${p_id} still returns status == \"ACTIVE\", posture == \"OPEN\", version == 2"

      - name: program_activate_twice_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Program.DRAFT_to_ACTIVE
          - validations.priority_13
        distinguishing_aspect: "Re-firing a completed transition is a conflict, not a no-op: the second activate must 409 and must not bump version to 3."
        test_recipe:
