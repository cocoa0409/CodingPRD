            - { call: "GET /participants/${pa}", as: ShopCoordinator, captures: { v2: $.data.version } }
            - { call: "POST /hour-logs/${h2}/approve", payload: { expected_participant_version: "${v2}" }, as: ShopCoordinator, as_user_id: "sc-approver-1", captures: { st: $.data.status } }
          assert:
