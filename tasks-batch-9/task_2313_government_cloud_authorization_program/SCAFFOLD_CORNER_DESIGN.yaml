  - name: a_derived_ledger_is_recomputed_after_its_source_row_is_closed
    claim_type: derived_field_reconciliation
    grounds:
    - entities.Authorization.fields.open_findings_count
    - entities.Authorization.fields.residual_risk_score
    excluded_because:
      difficulty_instance: supersede_item_chain_closes_the_replaced_finding_and_reconciles_the_authorization_ledger
      rationale: That §1.8 instance closes a finding by supersession and re-derives open_findings_count, overdue_high_count
        and residual_risk_score on the Authorization in the same call, which is the 'correct after delete of source' half
        of this layer. The 'correct after create' and 'correct after update' halves are covered by the agency-counter instance
        above and by the crm-coverage instances in the entities and calculations sections.
- section: consistency_model
  instances:
  - name: every_write_response_already_carries_the_fields_its_own_side_effects_derived
    claim_type: immediate
    grounds:
    - complexity_profile.consistency_model
    - endpoints.POST /authorization-packages/{id}/submit
    - endpoints.POST /authorization-packages/{id}/decision
    - entities.AuthorizationPackage.fields.crm_coverage_pct
    distinguishing_aspect: 'The model is immediate, so no response may carry a pre-write snapshot and no derived field may
      need a second read to settle: the submit response itself must already show the frozen coverage and risk numbers its
      own side effects computed, and the decision response must already show the minted letter reference. Rows created by
      the cascade are queryable in the very next call, with no retry and no delay in the logical clock.'
    test_recipe:
      setup:
      - Clock 2026-03-30T00:00:00Z; offering IN_ASSESSMENT on the AGENCY_SPONSORED path with a DRAFT package, an engagement
        in REPORT_DELIVERED and one LOW finding detected 2026-03-15T00:00:00Z.
      - Coverage is 100.00 over the MODERATE baseline; no MonitoringPeriod and no Authorization exist.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-02-01T00:00:00Z'
        as: ProgramBoardReviewer
        as_user_id: board-1
      - call: POST /agencies
        payload:
          name: Department of Transportation
          agency_code: DOT
          sponsorship_capacity: 3
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
