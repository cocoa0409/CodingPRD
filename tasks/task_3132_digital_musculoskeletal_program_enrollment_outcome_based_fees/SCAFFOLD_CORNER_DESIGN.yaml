  # ===========================================================================
  # section: validations
  # ===========================================================================
  - section: validations
    instances:

      - name: file_period_regression_is_refused
        claim_type: Violation → Error
        grounds:
          - validations[priority=10]
          - errors[ERR_FILE_PERIOD_REGRESSION]
          - endpoints.POST_/msk/eligibility-files
        distinguishing_aspect: "A roster period that is not strictly later than the client's greatest existing period is refused with the regression error rather than being accepted as a correction."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer client already holding a roster for 2026-09."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClinicalOps
            - call: "POST /msk/clients"
              payload: { legal_name: "Halewood Utilities", client_type: "HEALTH_PLAN" }
              as: ClinicalOps
              captures: { hw_id: $.data.id }
            - call: "POST /msk/eligibility-files"
              payload: { client_account_id: "${hw_id}", file_period: "2026-09", roster_format: "STANDARD" }
              as: EnrollmentOps
              captures: { f_09: $.data.id }
          trigger:
            - call: "POST /msk/eligibility-files"
              payload: { client_account_id: "${hw_id}", file_period: "2026-08", roster_format: "STANDARD" }
              as: EnrollmentOps
              captures: { reg_err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_FILE_PERIOD_REGRESSION"
            - "GET /msk/eligibility-files?client_account_id=${hw_id} still returns exactly one file, the 2026-09 one"
            - "a roster for 2026-10 is accepted with 201, proving the boundary is strictly-after and not at-or-after"

      - name: screening_succeeds_when_every_condition_is_satisfied
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=1]
          - endpoints.POST_/msk/eligibility-files/{id}/screen
        distinguishing_aspect: "Every precondition of the screen transition holds, so the file moves to SCREENED and each member takes its screened status rather than any error being raised."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer client with a roster carrying one member row and no predecessor state."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClinicalOps
            - call: "POST /msk/clients"
              payload: { legal_name: "Halewood Utilities", client_type: "HEALTH_PLAN" }
              as: ClinicalOps
              captures: { hw_id: $.data.id }
            - call: "POST /msk/program-tracks"
              payload: { track_code: "ACUTE", base_fee_per_member_cents: 9000, expected_sessions_per_week: 3, pain_reduction_target_points: 2.0, function_gain_target_points: 15.0, min_adherence_rate: 0.70, severity_weights: { LOW: 0.2, HIGH: 0.5 } }
              as: ClinicalOps
            - call: "POST /msk/eligibility-files"
              payload: { client_account_id: "${hw_id}", file_period: "2026-09", roster_format: "STANDARD" }
              as: EnrollmentOps
              captures: { f_id: $.data.id }
            - call: "POST /msk/members"
              payload: { client_account_id: "${hw_id}", eligibility_file_id: "${f_id}", external_member_ref: "HW-0017", full_name: "Aldo Ferretti", date_of_birth: "1980-05-05T00:00:00Z", musculo_condition_code: "KNEE_OA", baseline_pain_score: 6.5, baseline_function_score: 53.0 }
              as: EnrollmentOps
              captures: { m_a: $.data.id }
          trigger:
            - call: "POST /msk/eligibility-files/${f_id}/screen"
              payload: {}
              as: EnrollmentOps
          assert:
            - "the response status is 200 and EligibilityFile.${f_id}.file_status == SCREENED"
            - "EligibilityFile.${f_id}.screened_member_count == 1 and eligible_member_count == 1"
            - "EligibilityFile.${f_id}.total_monthly_fee_cents == 900000: 9000 * 100 * 1.0 over the single eligible member"
            - "GET /msk/members/${m_a} reports member_status == ELIGIBLE with eligibility_basis == MSK_FLAG"
            - "the file's version advanced by exactly 1"

      - name: missing_context_header_outranks_business_fiscal_refusal
        claim_type: Priority Ordering
        grounds:
          - validations[priority=1]
          - validations[priority=13]
          - errors[ERR_MISSING_OR_INVALID_CONTEXT_HEADER]
        distinguishing_aspect: "An unauthenticated request to a route that would otherwise fail its fiscal precondition returns the auth error at priority 1, not the deeper business error."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer client on file."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClinicalOps
            - call: "POST /msk/clients"
              payload: { legal_name: "Halewood Utilities", client_type: "HEALTH_PLAN" }
              as: ClinicalOps
              captures: { hw_id: $.data.id }
          trigger:
            - call: "POST /msk/eligibility-files"
              payload: { client_account_id: "${hw_id}", file_period: "2026-09", roster_format: "STANDARD" }
              as: NoSuchRole
              as_user_id: ""
              captures: { auth_err: $.data.error_id }
          assert:
            - "the response is not a 2xx and error_id == ERR_MISSING_OR_INVALID_CONTEXT_HEADER"
            - "the response is not ERR_CLIENT_NOT_ACTIVE: the header check runs before the fiscal check"
            - "the same payload sent with as EnrollmentOps returns 201, proving the failure was purely the context header"

      - name: unknown_second_segment_does_not_mask_the_first
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=3]
          - errors[ERR_RESOURCE_NOT_FOUND]
          - endpoints.POST_/msk/eligibility-files/{id}/screen
        distinguishing_aspect: "The parent roster file is resolved before anything else: an unknown file id produces the 404 even though the screen body carries no unknown reference of its own, and the same body against a real file succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer client with one roster file on file."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClinicalOps
            - call: "POST /msk/clients"
              payload: { legal_name: "Halewood Utilities", client_type: "HEALTH_PLAN" }
              as: ClinicalOps
              captures: { hw_id: $.data.id }
            - call: "POST /msk/eligibility-files"
              payload: { client_account_id: "${hw_id}", file_period: "2026-09", roster_format: "STANDARD" }
              as: EnrollmentOps
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /msk/eligibility-files/00000000-0000-4000-8000-000000000000/screen"
              payload: {}
              as: EnrollmentOps
              captures: { miss_err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_RESOURCE_NOT_FOUND"
            - "GET /msk/eligibility-files/${f_id} still reports file_status == INGESTED, untouched"
            - "the body of the request carried no reference of its own to validate, so the failure came from the path segment alone"

      - name: file_period_regression_outranks_client_not_active
        claim_type: Priority Ordering
        grounds:
          - validations[priority=10]
          - validations[priority=13]
          - errors[ERR_FILE_PERIOD_REGRESSION]
          - errors[ERR_CLIENT_NOT_ACTIVE]
        distinguishing_aspect: "With both a regressed period and a SUSPENDED client, the temporal constraint at priority 10 wins over the fiscal check at priority 13, so the reported error is the regression, not the account state."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer client already holding a 2026-09 roster and then moved to SUSPENDED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClinicalOps
            - call: "POST /msk/clients"
              payload: { legal_name: "Halewood Utilities", client_type: "HEALTH_PLAN" }
              as: ClinicalOps
              captures: { hw_id: $.data.id }
            - call: "POST /msk/eligibility-files"
              payload: { client_account_id: "${hw_id}", file_period: "2026-09", roster_format: "STANDARD" }
              as: EnrollmentOps
              captures: { f_09: $.data.id }
            - call: "POST /msk/clients/${hw_id}/suspend"
              payload: { reason: "Contract review" }
              as: BillingOps
          trigger:
            - call: "POST /msk/eligibility-files"
              payload: { client_account_id: "${hw_id}", file_period: "2026-08", roster_format: "STANDARD" }
              as: EnrollmentOps
              captures: { pri_err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_FILE_PERIOD_REGRESSION"
            - "the response is not ERR_CLIENT_NOT_ACTIVE, even though the client is SUSPENDED and that check would also fail"
            - "after POST /msk/clients/${hw_id}/reinstate, the same regressed period still returns ERR_FILE_PERIOD_REGRESSION, so the ordering is stable and not an artefact of the suspension"

      - name: duplicate_active_measurement_week_is_refused_but_superseded_weeks_are_reusable
        claim_type: Aggregate validation
        grounds:
          - validations[priority=13]
          - errors[ERR_MEASUREMENT_WEEK_DUPLICATE]
          - state_machines.OutcomeMeasurement.RECORDED_to_SUPERSEDED
        distinguishing_aspect: "A second measurement for a week already carried by a live RECORDED row is refused, while the same week is accepted again once the earlier row has been SUPERSEDED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer client with one member whose enrollment is ACTIVE, a first measurement recorded for week 2, and that row superseded by a replacement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClinicalOps
            - call: "POST /msk/clients"
              payload: { legal_name: "Halewood Utilities", client_type: "HEALTH_PLAN" }
              as: ClinicalOps
              captures: { hw_id: $.data.id, hw_v: $.data.version }
            - call: "POST /msk/program-tracks"
              payload: { track_code: "ACUTE", base_fee_per_member_cents: 9000, expected_sessions_per_week: 3, pain_reduction_target_points: 2.0, function_gain_target_points: 15.0, min_adherence_rate: 0.70, severity_weights: { LOW: 0.2, HIGH: 0.5 } }
              as: ClinicalOps
              captures: { tr_acute: $.data.id }
            - call: "POST /msk/eligibility-files"
              payload: { client_account_id: "${hw_id}", file_period: "2026-09", roster_format: "STANDARD" }
              as: EnrollmentOps
              captures: { f_id: $.data.id }
            - call: "POST /msk/members"
              payload: { client_account_id: "${hw_id}", eligibility_file_id: "${f_id}", external_member_ref: "HW-0018", full_name: "Bea Lindgren", date_of_birth: "1983-11-11T00:00:00Z", musculo_condition_code: "KNEE_OA", baseline_pain_score: 7.5, baseline_function_score: 44.0 }
              as: EnrollmentOps
              captures: { m_b: $.data.id }
            - call: "POST /msk/eligibility-files/${f_id}/screen"
              payload: {}
              as: EnrollmentOps
            - call: "POST /msk/eligibility-files/${f_id}/assign-tracks"
              payload: { expected_client_account_version: "${hw_v}" }
              as: EnrollmentOps
              captures: { f_v: $.data.version }
            - call: "POST /msk/clinicians"
              payload: { full_name: "Dana Whitfield", discipline: "PHYSICAL_THERAPIST", license_number: "PT-88123", weekly_capacity_slots: 20 }
              as: ClinicalOps
              captures: { dana_id: $.data.id }
            - call: "POST /msk/clinicians"
              payload: { full_name: "Leo Farrow", discipline: "PHYSICIAN", license_number: "MD-44120", weekly_capacity_slots: 12 }
              as: ClinicalOps
              captures: { leo_id: $.data.id }
            - call: "GET /msk/enrollments"
              payload: { member_id: "${m_b}" }
              as: EnrollmentOps
              captures: { e_b: "$.data[0].id"}
            - call: "POST /msk/clinical-reviews"
              payload: { enrollment_id: "${e_b}", reviewer_id: "${dana_id}", review_notes: "Knee OA, acute track" }
              as: EnrollmentOps
              captures: { cr_b: $.data.id }
            - call: "POST /msk/clinical-reviews/${cr_b}/conduct"
              payload: { review_decision: "APPROVE", reviewed_track_id: "${tr_acute}" }
              as: Clinician
              as_user_id: "${dana_id}"
            - call: "POST /msk/transition-reviews/${e_b}/approve"
              payload: { approving_clinician_id: "${leo_id}", expected_eligibility_file_version: "${f_v}" }
              as: Clinician
              as_user_id: "${leo_id}"
            - call: "POST /msk/outcome-measurements"
