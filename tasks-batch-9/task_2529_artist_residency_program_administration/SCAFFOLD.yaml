    code: 200
    input: ["reason?"]
    output: HousingAssignment
    side_effects:
      - "sets status = RELEASED and released_reason"
      - "recomputes HousingUnit.occupied_bed_nights and clears Residency.assigned_housing_unit_code"
      - "increments HousingAssignment.version, HousingUnit.version and Residency.version by 1"

