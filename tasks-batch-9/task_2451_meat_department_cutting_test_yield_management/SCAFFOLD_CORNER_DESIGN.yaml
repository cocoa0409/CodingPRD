      - name: subprimal_allocation_reconciles_to_the_landed_cost
        claim_type: waterfall_allocation
        grounds:
          - calculations.subprimal_cost_allocation
        excluded_because:
          difficulty_instance: combinatorial_formula / subprimal_allocation_rounds_per_line_then_reconciles_remainder
          rationale: "The named §1.8 instance asserts the per-line rounding, the remainder-line selection and the cents reconciliation with literal values."

      - name: retail_price_tier_is_chosen_from_the_first_pass_price
        claim_type: tiered_pricing
        grounds:
          - calculations.retail_price_per_lb
        excluded_because:
          difficulty_instance: combinatorial_formula / retail_price_tier_selected_once_from_first_pass_price
          rationale: "The named §1.8 instance walks the tier boundary and proves the tier is never re-evaluated against p2."

      - name: required_fill_combines_presentation_demand_and_carrying_capacity
        claim_type: threshold
        grounds:
          - calculations.required_fill_derivation
        excluded_because:
          difficulty_instance: combinatorial_formula / required_fill_nested_min_max_with_posture_branch
          rationale: "The named §1.8 instance asserts the nested min/max and both posture branches on identical line inputs."

      - name: shrink_bases_diverge_on_identical_line_data
        claim_type: variant_divergence
        grounds:
          - calculations.shrink_variance_reconciliation.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / shrink_reconciliation_yield_model_vs_physical_count_divergence
          rationale: "The named §1.8 instance runs both bases over one line set and asserts the differing variance and tolerance verdicts."

      - name: price_variant_is_selected_by_the_pricing_endpoint
        claim_type: variant_selection
        grounds:
          - calculations.retail_price_per_lb.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / provisional_vs_final_retail_price_variant_divergence
          rationale: "The named §1.8 instance proves the proposal endpoint uses the book-yield basis and the activation endpoint uses the measured basis."

      - name: yield_adjusted_cost_reconciles_after_approval
        claim_type: reconciliation
        grounds:
          - calculations.retail_price_per_lb.variants
        excluded_because:
          difficulty_instance: transitive_cascade / cutting_test_approve_cascade_reaches_stale_case_plan_lines
          rationale: "The named §1.8 instance asserts the derived-field reconciliation of yield_adjusted_cost_per_lb_cents and the resulting reprice delta."

      - name: blended_lean_is_weight_weighted
        claim_type: weighted_scoring
        grounds:
          - calculations.grind_blend_derivation
        excluded_because:
          difficulty_instance: compensating_invariant / grind_run_abort_restores_trim_pounds_with_zero_drift
          rationale: "The named §1.8 instance asserts batch_weight_lb 14.50 and the weight-weighted blended_lean_pct 84.28 from two unequal inputs."

      - name: posture_is_projected_from_the_reading_stream
        claim_type: projection
        grounds:
          - calculations.case_posture_derivation
        excluded_because:
          difficulty_instance: boundary_precision_check / temperature_out_of_spec_strict_greater_boundary_and_consecutive_threshold
          rationale: "The named §1.8 instance replays the reading stream and asserts the consecutive counter, the reset and the resulting posture at each step."

  # ===========================================================================
  - section: validations
    instances:

      - name: purchase_and_test_weight_gates_reject_impossible_yield_inputs
        claim_type: violation_to_error
        grounds:
          - validations[priority=32]
          - validations[priority=28]
          - errors[ERR_NET_WEIGHT_NOT_POSITIVE]
          - errors[ERR_YIELD_NOT_RECONCILED]
        distinguishing_aspect: "receiving_shrink_lb equal to gross_weight_lb drives net weight to zero and is refused with ERR_NET_WEIGHT_NOT_POSITIVE (422, not ERR_INVALID_REQUEST), and a CuttingTest whose test_weight_lb differs from the purchase's net_weight_lb is refused with ERR_YIELD_NOT_RECONCILED at creation time rather than at SUBMIT."
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
          trigger:
            - call: "POST /meat-ops/primal-purchases"
              payload: { department_id: "${dept_id}", primal_code: "BEEF_RIBEYE_LIP_ON", product_class: "WHOLE_MUSCLE", country_of_origin: "USA", vendor_name: "Prairie Packing", gross_weight_lb: 100.0, invoice_cost_cents: 84000, freight_cost_cents: 2500, vendor_allowance_cents: 500, receiving_shrink_lb: 100.0, received_at: "2026-08-05T06:00:00Z" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { err_net: $.data.error_id }
            - call: "POST /meat-ops/primal-purchases"
              payload: { department_id: "${dept_id}", primal_code: "BEEF_RIBEYE_LIP_ON", product_class: "WHOLE_MUSCLE", country_of_origin: "USA", vendor_name: "Prairie Packing", gross_weight_lb: 100.0, invoice_cost_cents: 84000, freight_cost_cents: 2500, vendor_allowance_cents: 500, receiving_shrink_lb: 1.5, received_at: "2026-08-05T06:00:00Z" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - call: "POST /meat-ops/cutting-tests"
              payload: { primal_purchase_id: "${p1_id}", test_weight_lb: 98.0, expected_primal_purchase_version: "${p1_v}" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { err_recon: $.data.error_id }
            - call: "POST /meat-ops/cutting-tests"
              payload: { primal_purchase_id: "${p1_id}", test_weight_lb: 98.5, expected_primal_purchase_version: "${p1_v}" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { t1_id: $.data.id }
          assert:
            - "${err_net} == ERR_NET_WEIGHT_NOT_POSITIVE with HTTP 422 and no PrimalPurchase row is created"
            - "The second purchase is created with net_weight_lb == 98.50 and version == 1"
            - "${err_recon} == ERR_YIELD_NOT_RECONCILED with HTTP 422 (98.0 != 98.50) and PrimalPurchase.${p1_id}.version stays 1"
            - "The matching test is created: CuttingTest.${t1_id}.status == DRAFT with test_weight_lb == 98.5"

      - name: submit_gates_reject_missing_salable_yield_then_a_zero_value_base
        claim_type: cascading_validation
        grounds:
          - validations[priority=29]
          - validations[priority=41]
          - errors[ERR_NO_SALABLE_YIELD]
          - errors[ERR_NO_MARKET_VALUE_BASIS]
          - calculations.subprimal_cost_allocation
        distinguishing_aspect: "The weight-base check at priority 41 can only be reached once the salable-line check at priority 29 passes: a trim-only test fails with ERR_NO_SALABLE_YIELD, while a test that has a SALABLE_CUT line of 0.00 lb (so the value weight base is 0 even though every market value is positive) fails with ERR_NO_MARKET_VALUE_BASIS."
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config; RIB01 (WHOLE_MUSCLE) exists."
            - "Purchase P1 (ribeye) and purchase P2 (strip loin) both have net_weight_lb 98.50."
            - "T1 on P1 has only a GRIND_TRIM line (80.5 lb) and a FAT_BONE_LOSS line (18.0 lb)."
            - "T2 on P2 has a SALABLE_CUT line of 0.0 lb at 1450 per lb and a FAT_BONE_LOSS line of 98.5 lb."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
            - call: "POST /meat-ops/retail-items"
              payload: { department_id: "${dept_id}", item_code: "RIB01", subprimal_code: "RIBEYE_STEAK", product_class: "WHOLE_MUSCLE" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { ri1_id: $.data.id }
            - call: "POST /meat-ops/primal-purchases"
              payload: { department_id: "${dept_id}", primal_code: "BEEF_RIBEYE_LIP_ON", product_class: "WHOLE_MUSCLE", country_of_origin: "USA", vendor_name: "Prairie Packing", gross_weight_lb: 100.0, invoice_cost_cents: 84000, freight_cost_cents: 2500, vendor_allowance_cents: 500, receiving_shrink_lb: 1.5, received_at: "2026-08-05T06:00:00Z" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - call: "POST /meat-ops/primal-purchases"
              payload: { department_id: "${dept_id}", primal_code: "BEEF_STRIP_LOIN", product_class: "WHOLE_MUSCLE", country_of_origin: "USA", vendor_name: "Prairie Packing", gross_weight_lb: 100.0, invoice_cost_cents: 90000, freight_cost_cents: 0, vendor_allowance_cents: 0, receiving_shrink_lb: 1.5, received_at: "2026-08-05T06:30:00Z" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { p2_id: $.data.id, p2_v: $.data.version }
            - call: "POST /meat-ops/cutting-tests"
              payload: { primal_purchase_id: "${p1_id}", test_weight_lb: 98.5, expected_primal_purchase_version: "${p1_v}" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { t1_id: $.data.id }
            - call: "POST /meat-ops/cutting-tests/${t1_id}/lines"
              payload: { line_seq: 1, subprimal_code: "RIBEYE_TRIM_LEAN", disposition: "GRIND_TRIM", yield_weight_lb: 80.5, market_value_per_lb_cents: 420, lean_pct: 78.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/lines"
              payload: { line_seq: 2, subprimal_code: "RIBEYE_FAT_BONE", disposition: "FAT_BONE_LOSS", yield_weight_lb: 18.0, market_value_per_lb_cents: 0 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests"
              payload: { primal_purchase_id: "${p2_id}", test_weight_lb: 98.5, expected_primal_purchase_version: "${p2_v}" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { t2_id: $.data.id }
            - call: "POST /meat-ops/cutting-tests/${t2_id}/lines"
              payload: { line_seq: 1, subprimal_code: "STRIP_STEAK", disposition: "SALABLE_CUT", yield_weight_lb: 0.0, market_value_per_lb_cents: 1450, retail_item_id: "${ri1_id}" }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${t2_id}/lines"
              payload: { line_seq: 2, subprimal_code: "STRIP_FAT_BONE", disposition: "FAT_BONE_LOSS", yield_weight_lb: 98.5, market_value_per_lb_cents: 0 }
              as: MeatCutter
              as_user_id: "cutter-01"
          trigger:
            - call: "POST /meat-ops/cutting-tests/${t1_id}/transitions"
              payload: { action: "SUBMIT" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { err_salable: $.data.error_id }
            - call: "POST /meat-ops/cutting-tests/${t2_id}/transitions"
              payload: { action: "SUBMIT" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { err_base: $.data.error_id }
          assert:
            - "Both tests reconcile: unaccounted_lb == 0.00 on T1 and T2, so priority 28 passes in both cases"
            - "${err_salable} == ERR_NO_SALABLE_YIELD with HTTP 422 and CuttingTest.${t1_id}.status == DRAFT"
            - "${err_base} == ERR_NO_MARKET_VALUE_BASIS with HTTP 422 and CuttingTest.${t2_id}.status == DRAFT"
            - "PrimalPurchase.${p1_id}.status == RECEIVED and PrimalPurchase.${p2_id}.status == RECEIVED with unallocated_cost_cents 86000 and 90000"

      - name: case_line_events_need_a_published_plan_and_unencumbered_pounds
        claim_type: aggregate_validation
        grounds:
          - validations[priority=12]
          - validations[priority=39]
          - errors[ERR_CASE_PLAN_NOT_PUBLISHED]
          - errors[ERR_LINE_POUNDS_UNAVAILABLE]
        distinguishing_aspect: "Priority 39 is an aggregate over three independent consumers of the same pounds: a 20.00 lb markdown plus a 20.00 lb shrink event on a line filled with 34.00 lb is refused, while a 14.00 lb shrink event that brings the total to exactly 34.00 lb is accepted. The same fill is also refused outright while the plan is still DRAFT."
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config; clock at 2026-08-05T08:00:00Z; posture SALES_OPEN."
            - "RIB01 is PROPOSED at 2149 (yield_adjusted_cost_per_lb_cents is still 0, so the markdown floor is 0)."
            - "CasePlan CP1 (service_date 2026-08-05) is DRAFT with line 1 (4 facings, 30.0 lb movement, required_fill_lb 34.50)."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
