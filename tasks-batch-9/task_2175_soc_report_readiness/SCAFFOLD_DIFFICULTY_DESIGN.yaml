          - state_machines.SubserviceOrganization.CARVE_OUT_to_INCLUSIVE
          - calculations.bridge_letter_coverage_days
        distinguishing_aspect: |
          Interval semantics 3 — BUFFERED occupation on the Engagement's INCLUSIVE subservice
          organizations: adjacency is not merely disallowed, a strictly positive clear space of
          SUBSERVICE_BUFFER_DAYS whole days is demanded, so a window starting the day after the
          previous window ends is rejected while one starting two days after is accepted. Neither the
          half-open nor the closed rule has this extra separation requirement.
