scaffold_difficulty_design:
  # ==========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: queue_time_estimated_vs_actual_variants
        grounds:
          - calculations.queue_time
          - entities.Order.fields.estimated_queue_seconds
          - entities.Order.fields.actual_queue_seconds
        distinguishing_aspect: |
          Same order yields two different queue metrics: the ESTIMATED variant
          computed at creation is 45 (one earlier QUEUED order * 45 s), while the
          ACTUAL variant measured at final start-assembly is 120 — different
          results for the same entity, and this instance lives in the Order domain.
        test_recipe:
          setup:
            - "Restaurant R1; AUTOMATED line L1 (rate 45, posture OPEN); MANUAL line LM; ingredient ING; recipe RC (base_complexity 0, portion ING 100g) version captured"
            - "hopper H1 on L1 for ING, loaded 1000g, IN_SERVICE"
            - "order O_EARLY created at 2026-09-01T00:00:00Z and left QUEUED on L1"
            - "clock advanced to 2026-09-01T00:02:00Z; order O_SUBJECT created (estimated 45)"
            - "clock advanced to 2026-09-01T00:04:00Z; O_SUBJECT started after O_EARLY completes? No — O_EARLY is started and completed first so the subject reaches the front; the subject's own queue_entered_at is 00:02 and its successful start is at 00:04 => actual 120"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "L1", line_type: "AUTOMATED", service_rate_seconds_per_bowl: 45 }
              as: OpsAdmin
              captures: { l1: $.data.id }
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "LM", line_type: "MANUAL", service_rate_seconds_per_bowl: 120 }
              as: OpsAdmin
              captures: { lm: $.data.id }
            - call: "POST /api/ingredients"
              payload: { sku: "ROM", name: "Romaine", station_type: "BASE", shelf_life_minutes: 240 }
              as: OpsAdmin
              captures: { ing: $.data.id }
            - call: "POST /api/recipes"
              payload: { restaurant_id: "${r1}", name: "Harvest", base_complexity: 0, portion_spec: [{ ingredient_id: "${ing}", target_grams: 100 }] }
              as: OpsAdmin
              captures: { rc: $.data.id, rc_v: $.data.version }
            - call: "POST /api/hoppers"
              payload: { line_id: "${l1}", ingredient_id: "${ing}", capacity_grams: 2000, station_slot: 0, calibration_coefficient: 1.0 }
              as: OpsAdmin
              captures: { h1: $.data.id, h1_v0: $.data.version }
            - call: "POST /api/hoppers/${h1}/load"
              payload: { load_grams: 1000, expected_hopper_version: "${h1_v0}" }
              as: LineOperator
            - call: "POST /api/orders"
              payload: { restaurant_id: "${r1}", recipe_id: "${rc}", expected_recipe_version: "${rc_v}" }
              as: Customer
              captures: { o_early: $.data.id }
            - call: "POST /api/orders/${o_early}/start-assembly"
              payload: {}
              as: LineOperator
            - call: "POST /api/orders/${o_early}/submit-verification"
              payload: { measurements: [{ hopper_id: "${h1}", actual_grams: 100.0 }] }
              as: LineOperator
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:02:00Z" }
              as: OpsAdmin
            - call: "POST /api/orders"
              payload: { restaurant_id: "${r1}", recipe_id: "${rc}", expected_recipe_version: "${rc_v}" }
              as: Customer
              captures: { o_subj: $.data.id, o_subj_est: $.data.estimated_queue_seconds }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:04:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /api/orders/${o_subj}/start-assembly"
              payload: {}
              as: LineOperator
              captures: { o_subj_actual: $.data.actual_queue_seconds }
          assert:
            - "Order.${o_subj}.estimated_queue_seconds == 45 (ESTIMATED variant at creation: zero earlier QUEUED orders ahead after O_EARLY completed... correction: O_EARLY was COMPLETED before O_SUBJ creation, so count of earlier QUEUED is 0 and the ESTIMATED value is 0, NOT 45 — see next line)"
            - "Order.${o_subj}.estimated_queue_seconds == 0"
            - "Order.${o_subj}.actual_queue_seconds == 120"
            - "The two variants diverge: estimated 0 vs actual 120 for the same order"
      - name: prep_batch_waste_live_vs_expired_variants
        grounds:
          - calculations.prep_batch_utilization
          - entities.PrepBatch.fields.available_grams
        distinguishing_aspect: |
          Same PrepBatch row yields different waste figures by variant: while READY,
          1000 g quantity with 300 consumed reports waste_pct 0.00 (live variant);
          after the expire sweep the identical consumed/available fields report
          waste_pct_expired 70.00 — the expired variant reclassifies the 700 g
          remainder. Different entity domain (PrepBatch) from the Order queue metric.
        test_recipe:
          setup:
            - "Restaurant R1; ingredient ING shelf life 60 min; batch B1 qty 1000 READY at 00:00 (expires 01:00)"
            - "one RefillTask consumed 300 g (hopper H1 depleted -> auto task -> allocated -> started -> completed)"
            - "batch B1 now READY with consumed 300, allocated 0, available 700"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "L1", line_type: "AUTOMATED", service_rate_seconds_per_bowl: 45 }
              as: OpsAdmin
              captures: { l1: $.data.id }
            - call: "POST /api/ingredients"
              payload: { sku: "ROM", name: "Romaine", station_type: "BASE", shelf_life_minutes: 60 }
              as: OpsAdmin
              captures: { ing: $.data.id }
            - call: "POST /api/hoppers"
              payload: { line_id: "${l1}", ingredient_id: "${ing}", capacity_grams: 500, station_slot: 0, calibration_coefficient: 1.0 }
              as: OpsAdmin
              captures: { h1: $.data.id, h1_v0: $.data.version }
            - call: "POST /api/hoppers/${h1}/load"
              payload: { load_grams: 300, expected_hopper_version: "${h1_v0}" }
              as: LineOperator
            - call: "POST /api/prep-batches"
              payload: { restaurant_id: "${r1}", ingredient_id: "${ing}", quantity_grams: 1000 }
              as: PrepCook
              captures: { b1: $.data.id }
            - call: "POST /api/prep-batches/${b1}/mark-ready"
              payload: {}
              as: PrepCook
            - call: "POST /api/hoppers/${h1}/sensor-reading"
              payload: { grams_reading: 0 }
              as: LineOperator
              captures: { h1_dep: $.data.status }
            - call: "GET /api/hoppers/${h1}/refill-tasks"
              payload: {}
              as: LineOperator
              captures: { t1: $.data.0.id }
            - call: "POST /api/refill-tasks/${t1}/start"
              payload: {}
              as: LineOperator
            - call: "POST /api/refill-tasks/${t1}/complete"
              payload: {}
              as: LineOperator
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T01:30:00Z" }
              as: OpsAdmin
          trigger:
            - call: "GET /api/prep-batches/${b1}"
              payload: {}
              as: PrepCook
              captures: { b1_live_avail: $.data.available_grams }
            - call: "POST /api/prep-batches/expire-sweep"
              payload: {}
              as: ShiftManager
              captures: { swept: $.data.expired_count }
            - call: "GET /api/prep-batches/${b1}"
              payload: {}
              as: PrepCook
              captures: { b1_exp_status: $.data.status }
          assert:
            - "Before sweep: PrepBatch.${b1}.available_grams == 200 (1000 - 800 consumed... see invariant: auto refill allocated min(requested, available); requested = capacity 500 - 0 = 500, available 1000 => allocated 500; consumed 500, available 500 — corrected assertions below)"
            - "Before sweep: PrepBatch.${b1}.consumed_grams == 500 and PrepBatch.${b1}.available_grams == 500"
            - "Live variant waste is 0.00% while status == READY (available 500 not waste)"
            - "After sweep: PrepBatch.${b1}.status == EXPIRED and expired-bucket waste == 50.00% (500 / 1000)"
            - "Same row, same consumed/available fields: live variant 0.00 vs expired variant 50.00"

  # ==========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: dispense_rounding_order_pinned_per_line_then_sum
        grounds:
          - calculations.dispense_mass_balance
          - entities.Order.fields.expected_total_grams
        distinguishing_aspect: |
          Mode (b) nested rounding: two 5 g portions at coefficient 1.05 each round
          to 5.3 per line and sum to 10.6, whereas summing the unrounded masses
          (10.5) and rounding once yields 10.5 — the scaffold pins round-per-line-
          then-sum, so expected_total_grams MUST be 10.6.
        test_recipe:
          setup:
            - "Restaurant R1; AUTOMATED line L1 OPEN; ingredients ING_A and ING_B; recipe RC base 0 with portions A 5g and B 5g"
            - "hoppers HA and HB on L1 (slots 0 and 2), each capacity 500, coefficient 1.05, loaded 100 g"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "L1", line_type: "AUTOMATED", service_rate_seconds_per_bowl: 45 }
              as: OpsAdmin
              captures: { l1: $.data.id }
            - call: "POST /api/ingredients"
              payload: { sku: "A1", name: "IngA", station_type: "BASE", shelf_life_minutes: 240 }
              as: OpsAdmin
              captures: { inga: $.data.id }
            - call: "POST /api/ingredients"
              payload: { sku: "B1", name: "IngB", station_type: "TOPPING", shelf_life_minutes: 240 }
              as: OpsAdmin
              captures: { ingb: $.data.id }
            - call: "POST /api/recipes"
              payload: { restaurant_id: "${r1}", name: "Duo", base_complexity: 0, portion_spec: [{ ingredient_id: "${inga}", target_grams: 5 }, { ingredient_id: "${ingb}", target_grams: 5 }] }
              as: OpsAdmin
              captures: { rc: $.data.id, rc_v: $.data.version }
            - call: "POST /api/hoppers"
              payload: { line_id: "${l1}", ingredient_id: "${inga}", capacity_grams: 500, station_slot: 0, calibration_coefficient: 1.05 }
              as: OpsAdmin
              captures: { ha: $.data.id, ha_v: $.data.version }
            - call: "POST /api/hoppers"
              payload: { line_id: "${l1}", ingredient_id: "${ingb}", capacity_grams: 500, station_slot: 2, calibration_coefficient: 1.05 }
              as: OpsAdmin
              captures: { hb: $.data.id, hb_v: $.data.version }
            - call: "POST /api/hoppers/${ha}/load"
              payload: { load_grams: 100, expected_hopper_version: "${ha_v}" }
              as: LineOperator
            - call: "POST /api/hoppers/${hb}/load"
              payload: { load_grams: 100, expected_hopper_version: "${hb_v}" }
              as: LineOperator
            - call: "POST /api/orders"
              payload: { restaurant_id: "${r1}", recipe_id: "${rc}", expected_recipe_version: "${rc_v}" }
              as: Customer
              captures: { o1: $.data.id }
            - call: "POST /api/orders/${o1}/start-assembly"
              payload: {}
              as: LineOperator
          trigger:
            - call: "POST /api/orders/${o1}/submit-verification"
              payload: { measurements: [{ hopper_id: "${ha}", actual_grams: 5.3 }, { hopper_id: "${hb}", actual_grams: 5.3 }] }
              as: LineOperator
              captures: { o1_total: $.data.expected_total_grams, o1_status: $.data.status }
          assert:
            - "Order.${o1}.expected_total_grams == 10.6 (per-line 5.3 + 5.3; NOT 10.5 from sum-then-round)"
            - "Order.${o1}.status == COMPLETED"
      - name: depletion_forecast_circular_dependency_pinned_order
        grounds:
          - calculations.depletion_forecast
          - calculations.dispense_mass_balance
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: requested_grams (FORECAST) depends on
          committed queued demand, which depends on dispense_grams, which depends on
          the current calibration coefficient, which the refill itself may precede a
          recalibration of — the scaffold pins evaluation order (freeze dispense with
          the CURRENT coefficient, then compute demand, then min() against free
          capacity), so a forecast refill on a hopper with coefficient 1.05 and one
          queued order needing 100 g of the ingredient yields requested_grams 105.0,
          not 100.0.
        test_recipe:
          setup:
            - "Restaurant R1; AUTOMATED line L1 OPEN; ingredient ING; recipe RC portion ING 100 g; hopper H1 capacity 500, coefficient 1.05, IN_SERVICE with 400 g"
            - "one order O1 QUEUED on L1 (committed demand 105.0 g for ING)"
            - "sensor reading drives H1 to DEPLETED at 60 g, auto-creating a FORECAST RefillTask: free capacity 440, queued demand 105.0 => requested_grams 105.0"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "L1", line_type: "AUTOMATED", service_rate_seconds_per_bowl: 45 }
              as: OpsAdmin
              captures: { l1: $.data.id }
            - call: "POST /api/ingredients"
              payload: { sku: "ROM", name: "Romaine", station_type: "BASE", shelf_life_minutes: 240 }
              as: OpsAdmin
              captures: { ing: $.data.id }
            - call: "POST /api/recipes"
              payload: { restaurant_id: "${r1}", name: "Harvest", base_complexity: 0, portion_spec: [{ ingredient_id: "${ing}", target_grams: 100 }] }
              as: OpsAdmin
              captures: { rc: $.data.id, rc_v: $.data.version }
            - call: "POST /api/hoppers"
              payload: { line_id: "${l1}", ingredient_id: "${ing}", capacity_grams: 500, station_slot: 0, calibration_coefficient: 1.05 }
              as: OpsAdmin
              captures: { h1: $.data.id, h1_v: $.data.version }
            - call: "POST /api/hoppers/${h1}/load"
              payload: { load_grams: 400, expected_hopper_version: "${h1_v}" }
              as: LineOperator
            - call: "POST /api/orders"
              payload: { restaurant_id: "${r1}", recipe_id: "${rc}", expected_recipe_version: "${rc_v}" }
              as: Customer
              captures: { o1: $.data.id }
            - call: "POST /api/hoppers/${h1}/sensor-reading"
              payload: { grams_reading: 60 }
              as: LineOperator
          trigger:
            - call: "GET /api/hoppers/${h1}/refill-tasks"
              payload: {}
              as: LineOperator
              captures: { t_req: $.data.0.requested_grams, t_auto: $.data.0.auto_created }
          assert:
            - "RefillTask.auto_created == true"
            - "RefillTask.requested_grams == 105.0 (queued demand with current coefficient; NOT 440 free-capacity STANDARD value and NOT 100.0 uncalibrated demand)"

  # ==========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_verification_remake_cycle
        grounds:
          - state_machines.Order
          - entities.Order.fields.remake_count
        distinguishing_aspect: |
          Order has a true cycle QUEUED -> ASSEMBLING -> VERIFICATION -> QUEUED
          (remake loop) with a cycle-count guard: the third re-queue is allowed
          (remake_count reaches 3) and the fourth failure transitions VERIFICATION
          -> CANCELLED. This non-linear machine lives on the Order entity.
        test_recipe:
          setup:
            - "Restaurant R1; AUTOMATED line L1 OPEN; ingredient ING; recipe RC 100 g; hopper H1 coefficient 1.0 loaded 1000 g IN_SERVICE"
            - "order O1 created, started, and failed verification 3 times (remake_count == 3, back in QUEUED)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "L1", line_type: "AUTOMATED", service_rate_seconds_per_bowl: 45 }
              as: OpsAdmin
              captures: { l1: $.data.id }
            - call: "POST /api/ingredients"
              payload: { sku: "ROM", name: "Romaine", station_type: "BASE", shelf_life_minutes: 240 }
              as: OpsAdmin
              captures: { ing: $.data.id }
            - call: "POST /api/recipes"
              payload: { restaurant_id: "${r1}", name: "Harvest", base_complexity: 0, portion_spec: [{ ingredient_id: "${ing}", target_grams: 100 }] }
              as: OpsAdmin
              captures: { rc: $.data.id, rc_v: $.data.version }
            - call: "POST /api/hoppers"
              payload: { line_id: "${l1}", ingredient_id: "${ing}", capacity_grams: 2000, station_slot: 0, calibration_coefficient: 1.0 }
              as: OpsAdmin
              captures: { h1: $.data.id, h1_v: $.data.version }
            - call: "POST /api/hoppers/${h1}/load"
              payload: { load_grams: 1000, expected_hopper_version: "${h1_v}" }
              as: LineOperator
            - call: "POST /api/orders"
              payload: { restaurant_id: "${r1}", recipe_id: "${rc}", expected_recipe_version: "${rc_v}" }
              as: Customer
              captures: { o1: $.data.id }
            - call: "POST /api/orders/${o1}/start-assembly"
              payload: {}
              as: LineOperator
            - call: "POST /api/orders/${o1}/submit-verification"
              payload: { measurements: [{ hopper_id: "${h1}", actual_grams: 110.0 }] }
              as: LineOperator
              captures: { rc1: $.data.remake_count }
            - call: "POST /api/orders/${o1}/start-assembly"
              payload: {}
              as: LineOperator
            - call: "POST /api/orders/${o1}/submit-verification"
              payload: { measurements: [{ hopper_id: "${h1}", actual_grams: 110.0 }] }
              as: LineOperator
              captures: { rc2: $.data.remake_count }
            - call: "POST /api/orders/${o1}/start-assembly"
              payload: {}
              as: LineOperator
            - call: "POST /api/orders/${o1}/submit-verification"
              payload: { measurements: [{ hopper_id: "${h1}", actual_grams: 110.0 }] }
              as: LineOperator
              captures: { rc3: $.data.remake_count }
          trigger:
            - call: "POST /api/orders/${o1}/start-assembly"
              payload: {}
              as: LineOperator
            - call: "POST /api/orders/${o1}/submit-verification"
              payload: { measurements: [{ hopper_id: "${h1}", actual_grams: 110.0 }] }
              as: LineOperator
              captures: { final_status: $.data.status, final_remake: $.data.remake_count }
          assert:
            - "Order.${o1}.remake_count after the 3rd failure == 3 (cycle traversed 3 times)"
            - "After the 4th failure: Order.${o1}.status == CANCELLED (boundary: remake_count == 3 cancels on the NEXT failure)"
            - "Hopper.${h1}.cumulative_waste_grams == 400.0 (100 per failed verification; dispensed mass reclassified, not returned)"
      - name: hopper_service_quarantine_cycle_reset
        grounds:
          - state_machines.Hopper
          - calculations.calibration_drift_detection
        distinguishing_aspect: |
          Hopper has a distinct cycle IN_SERVICE -> QUARANTINED -> IN_SERVICE driven
          by drift detection and cleared by calibration adjustment, with the drift
          window reset (drift_pct back to null) — a different entity (Hopper) and a
          different loop mechanism (system-triggered) from the Order remake cycle.
        test_recipe:
          setup:
            - "Restaurant R1; AUTOMATED line L1 OPEN; ingredient ING; recipe RC 100 g; hopper H1 coefficient 1.0 loaded 2000 g"
            - "3 orders completed, each verified at actual 104 g vs expected 100 (variance +4.00 each) => drift_pct == 4.00 > 3.0 => H1 auto-QUARANTINED"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "L1", line_type: "AUTOMATED", service_rate_seconds_per_bowl: 45 }
              as: OpsAdmin
              captures: { l1: $.data.id }
            - call: "POST /api/ingredients"
              payload: { sku: "ROM", name: "Romaine", station_type: "BASE", shelf_life_minutes: 240 }
              as: OpsAdmin
              captures: { ing: $.data.id }
            - call: "POST /api/recipes"
              payload: { restaurant_id: "${r1}", name: "Harvest", base_complexity: 0, portion_spec: [{ ingredient_id: "${ing}", target_grams: 100 }] }
              as: OpsAdmin
              captures: { rc: $.data.id, rc_v: $.data.version }
            - call: "POST /api/hoppers"
              payload: { line_id: "${l1}", ingredient_id: "${ing}", capacity_grams: 5000, station_slot: 0, calibration_coefficient: 1.0 }
              as: OpsAdmin
              captures: { h1: $.data.id, h1_v: $.data.version }
            - call: "POST /api/hoppers/${h1}/load"
              payload: { load_grams: 2000, expected_hopper_version: "${h1_v}" }
              as: LineOperator
            - call: "POST /api/orders"
              payload: { restaurant_id: "${r1}", recipe_id: "${rc}", expected_recipe_version: "${rc_v}" }
              as: Customer
              captures: { oa: $.data.id }
            - call: "POST /api/orders/${oa}/start-assembly"
              payload: {}
              as: LineOperator
              as_user_id: "op_verifier_1"
            - call: "POST /api/orders/${oa}/submit-verification"
              payload: { measurements: [{ hopper_id: "${h1}", actual_grams: 104.0 }] }
              as: LineOperator
              as_user_id: "op_verifier_1"
            - call: "POST /api/orders"
              payload: { restaurant_id: "${r1}", recipe_id: "${rc}", expected_recipe_version: "${rc_v}" }
              as: Customer
              captures: { ob: $.data.id }
            - call: "POST /api/orders/${ob}/start-assembly"
              payload: {}
              as: LineOperator
              as_user_id: "op_verifier_1"
            - call: "POST /api/orders/${ob}/submit-verification"
              payload: { measurements: [{ hopper_id: "${h1}", actual_grams: 104.0 }] }
              as: LineOperator
              as_user_id: "op_verifier_1"
            - call: "POST /api/orders"
              payload: { restaurant_id: "${r1}", recipe_id: "${rc}", expected_recipe_version: "${rc_v}" }
              as: Customer
              captures: { oc: $.data.id }
            - call: "POST /api/orders/${oc}/start-assembly"
              payload: {}
              as: LineOperator
              as_user_id: "op_verifier_1"
            - call: "POST /api/orders/${oc}/submit-verification"
              payload: { measurements: [{ hopper_id: "${h1}", actual_grams: 104.0 }] }
              as: LineOperator
              as_user_id: "op_verifier_1"
            - call: "GET /api/hoppers/${h1}"
              payload: {}
              as: QualityLead
              captures: { h1_status: $.data.status, h1_drift: $.data.drift_pct }
          trigger:
            - call: "POST /api/hoppers/${h1}/calibration-adjustments"
              payload: { new_coefficient: 0.95 }
              as: QualityLead
              as_user_id: "qa_approver_1"
              captures: { adj_old: $.data.old_coefficient, adj_drift: $.data.drift_pct_observed }
            - call: "GET /api/hoppers/${h1}"
              payload: {}
              as: QualityLead
              captures: { h1_after_status: $.data.status, h1_after_drift: $.data.drift_pct, h1_after_coef: $.data.calibration_coefficient }
          assert:
            - "Pre-adjustment: Hopper.${h1}.status == QUARANTINED and Hopper.${h1}.drift_pct == 4.00"
            - "CalibrationAdjustment.old_coefficient == 1.0 and drift_pct_observed == 4.00"
            - "Post-adjustment: Hopper.${h1}.status == IN_SERVICE (cycle closed), calibration_coefficient == 0.95, drift_pct == null (window reset)"

  # ==========================================================================
  # Rule 4 — transitive_cascade (different triggers)
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: sensor_depletion_cascade_sensor_to_refill_ready
        grounds:
          - state_machines.Hopper.IN_SERVICE_to_DEPLETED
          - state_machines.RefillTask
          - calculations.refill_allocation_waterfall
        distinguishing_aspect: |
          Depth-3 chain triggered by a sensor reading: sensor-reading (A) ->
          Hopper DEPLETED (B) -> auto RefillTask SCHEDULED created (C) ->
          allocation waterfall allocates the READY PrepBatch and the task becomes
          READY (D) -> linked hopper DEPLETED -> REFILL_SCHEDULED (E). Each link is
          caused by the previous one, not by the original POST.
        test_recipe:
          setup:
            - "Restaurant R1; AUTOMATED line L1 OPEN; ingredient ING shelf life 240; hopper H1 capacity 500 loaded 300 IN_SERVICE"
            - "PrepBatch B1 for ING qty 1000 already READY (so allocation can fire immediately)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "L1", line_type: "AUTOMATED", service_rate_seconds_per_bowl: 45 }
              as: OpsAdmin
              captures: { l1: $.data.id }
            - call: "POST /api/ingredients"
              payload: { sku: "ROM", name: "Romaine", station_type: "BASE", shelf_life_minutes: 240 }
              as: OpsAdmin
              captures: { ing: $.data.id }
            - call: "POST /api/hoppers"
              payload: { line_id: "${l1}", ingredient_id: "${ing}", capacity_grams: 500, station_slot: 0, calibration_coefficient: 1.0 }
              as: OpsAdmin
              captures: { h1: $.data.id, h1_v: $.data.version }
            - call: "POST /api/hoppers/${h1}/load"
              payload: { load_grams: 300, expected_hopper_version: "${h1_v}" }
              as: LineOperator
            - call: "POST /api/prep-batches"
              payload: { restaurant_id: "${r1}", ingredient_id: "${ing}", quantity_grams: 1000 }
              as: PrepCook
              captures: { b1: $.data.id }
            - call: "POST /api/prep-batches/${b1}/mark-ready"
              payload: {}
              as: PrepCook
          trigger:
            - call: "POST /api/hoppers/${h1}/sensor-reading"
              payload: { grams_reading: 150 }
              as: LineOperator
              captures: { h1_after: $.data.status }
            - call: "GET /api/hoppers/${h1}/refill-tasks"
              payload: {}
              as: LineOperator
              captures: { t1_status: $.data.0.status, t1_alloc: $.data.0.allocated_grams, t1_auto: $.data.0.auto_created }
            - call: "GET /api/assembly-lines/${l1}"
              payload: {}
              as: ShiftManager
              captures: { l1_posture: $.data.posture }
            - call: "GET /api/prep-batches/${b1}"
              payload: {}
              as: PrepCook
              captures: { b1_alloc: $.data.allocated_grams }
          assert:
            - "Hopper.${h1}.status == REFILL_SCHEDULED (DEPLETED -> REFILL_SCHEDULED via allocation, not directly by the sensor POST)"
            - "Auto RefillTask exists with auto_created == true, status == READY, allocated_grams == 350.0 (requested = capacity 500 - current 150)"
            - "PrepBatch.${b1}.allocated_grams == 350"
            - "AssemblyLine.${l1}.posture == RESTRICTED (hopper out of service)"
      - name: quarantine_cascade_verification_to_order_reroute
        grounds:
          - state_machines.Hopper.IN_SERVICE_to_QUARANTINED
          - state_machines.Order
          - calculations.line_selector
        distinguishing_aspect: |
          Different triggering transition (submit-verification, not a sensor
          reading) and depth >= 2 with a cross-entity forced reroute: verification
          (A) -> drift_pct crosses threshold so Hopper QUARANTINED (B) -> the
          quarantine itself force-reroutes each QUEUED AUTOMATED order needing the
          ingredient to the MANUAL line (C) with estimated_queue_seconds recomputed.
        test_recipe:
          setup:
            - "Restaurant R1; AUTOMATED line L1 (rate 45) and MANUAL line LM (rate 120), both OPEN; ingredient ING; recipe RC 100 g base 0"
            - "hopper H1 coefficient 1.0 loaded 2000; 3 completed orders verified at 104 g (drift 4.00 armed — quarantine fires on the 3rd verification)"
            - "order OQ created while L1 still usable... corrected: OQ is created BEFORE the 3rd verification so it is QUEUED on L1 when quarantine fires"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "L1", line_type: "AUTOMATED", service_rate_seconds_per_bowl: 45 }
              as: OpsAdmin
              captures: { l1: $.data.id }
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "LM", line_type: "MANUAL", service_rate_seconds_per_bowl: 120 }
              as: OpsAdmin
              captures: { lm: $.data.id }
            - call: "POST /api/ingredients"
              payload: { sku: "ROM", name: "Romaine", station_type: "BASE", shelf_life_minutes: 240 }
              as: OpsAdmin
              captures: { ing: $.data.id }
            - call: "POST /api/recipes"
              payload: { restaurant_id: "${r1}", name: "Harvest", base_complexity: 0, portion_spec: [{ ingredient_id: "${ing}", target_grams: 100 }] }
              as: OpsAdmin
              captures: { rc: $.data.id, rc_v: $.data.version }
            - call: "POST /api/hoppers"
              payload: { line_id: "${l1}", ingredient_id: "${ing}", capacity_grams: 5000, station_slot: 0, calibration_coefficient: 1.0 }
              as: OpsAdmin
              captures: { h1: $.data.id, h1_v: $.data.version }
            - call: "POST /api/hoppers/${h1}/load"
              payload: { load_grams: 2000, expected_hopper_version: "${h1_v}" }
              as: LineOperator
            - call: "POST /api/orders"
              payload: { restaurant_id: "${r1}", recipe_id: "${rc}", expected_recipe_version: "${rc_v}" }
              as: Customer
              captures: { o1: $.data.id }
            - call: "POST /api/orders/${o1}/start-assembly"
              payload: {}
              as: LineOperator
              as_user_id: "op_verifier_1"
            - call: "POST /api/orders/${o1}/submit-verification"
              payload: { measurements: [{ hopper_id: "${h1}", actual_grams: 104.0 }] }
              as: LineOperator
              as_user_id: "op_verifier_1"
            - call: "POST /api/orders"
              payload: { restaurant_id: "${r1}", recipe_id: "${rc}", expected_recipe_version: "${rc_v}" }
              as: Customer
              captures: { o2: $.data.id }
            - call: "POST /api/orders/${o2}/start-assembly"
              payload: {}
              as: LineOperator
              as_user_id: "op_verifier_1"
            - call: "POST /api/orders/${o2}/submit-verification"
              payload: { measurements: [{ hopper_id: "${h1}", actual_grams: 104.0 }] }
              as: LineOperator
              as_user_id: "op_verifier_1"
            - call: "POST /api/orders"
              payload: { restaurant_id: "${r1}", recipe_id: "${rc}", expected_recipe_version: "${rc_v}" }
              as: Customer
              captures: { o3: $.data.id }
            - call: "POST /api/orders"
              payload: { restaurant_id: "${r1}", recipe_id: "${rc}", expected_recipe_version: "${rc_v}" }
              as: Customer
              captures: { oq: $.data.id, oq_line: $.data.assigned_line_id, oq_route: $.data.route }
            - call: "POST /api/orders/${o3}/start-assembly"
              payload: {}
              as: LineOperator
              as_user_id: "op_verifier_1"
          trigger:
            - call: "POST /api/orders/${o3}/submit-verification"
              payload: { measurements: [{ hopper_id: "${h1}", actual_grams: 104.0 }] }
              as: LineOperator
              as_user_id: "op_verifier_1"
            - call: "GET /api/orders/${oq}"
              payload: {}
              as: ShiftManager
              captures: { oq_after_route: $.data.route, oq_after_line: $.data.assigned_line_id, oq_after_est: $.data.estimated_queue_seconds }
            - call: "GET /api/hoppers/${h1}"
              payload: {}
              as: QualityLead
              captures: { h1_q: $.data.status }
          assert:
            - "Pre-quarantine: Order.${oq}.route == AUTOMATED and assigned_line_id == ${l1}"
            - "Post-verification: Hopper.${h1}.status == QUARANTINED (3rd sample pushes drift to 4.00)"
            - "Order.${oq}.route == MANUAL and assigned_line_id == ${lm} (forced reroute by the quarantine cascade)"
            - "Order.${oq}.estimated_queue_seconds == 0 (no earlier QUEUED orders on the MANUAL line)"

  # ==========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: order_create_state_vs_business_fiscal_conflict
        grounds:
          - validations[priority=6]
          - validations[priority=17]
          - errors[ERR_STALE_RECIPE_VERSION]
          - errors[ERR_REFILL_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Pair (state OCC vs business_fiscal): the request violates BOTH a
          stale expected_recipe_version (412) and a would-exceed daily refill
          budget — but the refill-budget rule only applies to refill creation, so
          this instance pairs state (OCC 412) against business_constraint
          customization validity instead; pinned: the OCC state check at priority 6
          wins over the priority-18 business_constraint customization error.
        test_recipe:
          setup:
            - "Restaurant R1; lines L1 (AUTOMATED) + LM (MANUAL); ingredient ING; recipe RC portion 100 g (version captured as rc_v, then bumped by an eighty-six/restore round-trip so rc_v is stale)"
            - "hopper loaded so the line is usable"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "L1", line_type: "AUTOMATED", service_rate_seconds_per_bowl: 45 }
              as: OpsAdmin
              captures: { l1: $.data.id }
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "LM", line_type: "MANUAL", service_rate_seconds_per_bowl: 120 }
              as: OpsAdmin
            - call: "POST /api/ingredients"
              payload: { sku: "ROM", name: "Romaine", station_type: "BASE", shelf_life_minutes: 240 }
              as: OpsAdmin
              captures: { ing: $.data.id }
            - call: "POST /api/recipes"
              payload: { restaurant_id: "${r1}", name: "Harvest", base_complexity: 0, portion_spec: [{ ingredient_id: "${ing}", target_grams: 100 }] }
              as: OpsAdmin
              captures: { rc: $.data.id, rc_v: $.data.version }
            - call: "POST /api/hoppers"
              payload: { line_id: "${l1}", ingredient_id: "${ing}", capacity_grams: 2000, station_slot: 0, calibration_coefficient: 1.0 }
              as: OpsAdmin
              captures: { h1: $.data.id, h1_v: $.data.version }
            - call: "POST /api/hoppers/${h1}/load"
              payload: { load_grams: 1000, expected_hopper_version: "${h1_v}" }
              as: LineOperator
            - call: "POST /api/ingredients/${ing}/eighty-six"
              payload: {}
              as: ShiftManager
            - call: "POST /api/ingredients/${ing}/restore"
              payload: {}
              as: ShiftManager
          trigger:
            - call: "POST /api/orders"
              payload: { restaurant_id: "${r1}", recipe_id: "${rc}", customizations: [{ ingredient_id: "${ing}", action: "EXTRA" }, { ingredient_id: "${ing}", action: "REMOVE" }], expected_recipe_version: "${rc_v}" }
              as: Customer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_RECIPE_VERSION with http 412 (priority-6 state OCC check wins over the priority-18 duplicate-customization business_constraint violation)"
      - name: calibration_state_vs_segregation_conflict
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Different category pair from the OCC/customization conflict: here state
          (priority 5, hopper not QUARANTINED) competes with business_safety
          (priority 7, verifier approving their own finding). Pinned: the state
          error ERR_INVALID_STATE (409) wins over ERR_SEGREGATION_OF_DUTIES (403).
        test_recipe:
          setup:
            - "Restaurant R1; AUTOMATED line L1; ingredient ING; hopper H1 IN_SERVICE (NOT quarantined); one completed order verified by op_verifier_1 at 104 g (single sample, no quarantine)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "L1", line_type: "AUTOMATED", service_rate_seconds_per_bowl: 45 }
              as: OpsAdmin
              captures: { l1: $.data.id }
            - call: "POST /api/ingredients"
              payload: { sku: "ROM", name: "Romaine", station_type: "BASE", shelf_life_minutes: 240 }
              as: OpsAdmin
              captures: { ing: $.data.id }
            - call: "POST /api/recipes"
              payload: { restaurant_id: "${r1}", name: "Harvest", base_complexity: 0, portion_spec: [{ ingredient_id: "${ing}", target_grams: 100 }] }
              as: OpsAdmin
              captures: { rc: $.data.id, rc_v: $.data.version }
            - call: "POST /api/hoppers"
              payload: { line_id: "${l1}", ingredient_id: "${ing}", capacity_grams: 2000, station_slot: 0, calibration_coefficient: 1.0 }
              as: OpsAdmin
              captures: { h1: $.data.id, h1_v: $.data.version }
            - call: "POST /api/hoppers/${h1}/load"
              payload: { load_grams: 1000, expected_hopper_version: "${h1_v}" }
              as: LineOperator
            - call: "POST /api/orders"
              payload: { restaurant_id: "${r1}", recipe_id: "${rc}", expected_recipe_version: "${rc_v}" }
              as: Customer
              captures: { o1: $.data.id }
            - call: "POST /api/orders/${o1}/start-assembly"
              payload: {}
              as: LineOperator
            - call: "POST /api/orders/${o1}/submit-verification"
              payload: { measurements: [{ hopper_id: "${h1}", actual_grams: 104.0 }] }
              as: LineOperator
              as_user_id: "op_verifier_1"
          trigger:
            - call: "POST /api/hoppers/${h1}/calibration-adjustments"
              payload: { new_coefficient: 0.95 }
              as: QualityLead
              as_user_id: "op_verifier_1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE with http 409 (hopper IN_SERVICE, not QUARANTINED); the segregation-of-duties violation by the same caller is NOT reported because state (priority 5) precedes business_safety (priority 7)"

  # ==========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: depletion_threshold_exactly_200_grams
        grounds:
          - state_machines.Hopper.IN_SERVICE_to_DEPLETED
          - calculations.depletion_forecast
        distinguishing_aspect: |
          Numeric threshold boundary on the depletion metric via the sensor-reading
          endpoint: grams_reading == 200 (exactly at threshold, <= semantics) MUST
          trigger DEPLETED + auto refill; grams_reading == 201 MUST keep the hopper
          IN_SERVICE with only a rebaseline.
        test_recipe:
          setup:
            - "Restaurant R1; AUTOMATED line L1; ingredient ING; two hoppers H1 (slot 0) and H2 (needs a second ingredient/slot line) — simpler: one hopper, two sequential readings after a reload"
            - "hopper H1 capacity 1000 loaded 500, IN_SERVICE"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "L1", line_type: "AUTOMATED", service_rate_seconds_per_bowl: 45 }
              as: OpsAdmin
              captures: { l1: $.data.id }
            - call: "POST /api/ingredients"
              payload: { sku: "ROM", name: "Romaine", station_type: "BASE", shelf_life_minutes: 240 }
              as: OpsAdmin
              captures: { ing: $.data.id }
            - call: "POST /api/hoppers"
              payload: { line_id: "${l1}", ingredient_id: "${ing}", capacity_grams: 1000, station_slot: 0, calibration_coefficient: 1.0 }
              as: OpsAdmin
              captures: { h1: $.data.id, h1_v: $.data.version }
            - call: "POST /api/hoppers/${h1}/load"
              payload: { load_grams: 500, expected_hopper_version: "${h1_v}" }
              as: LineOperator
            - call: "POST /api/hoppers/${h1}/sensor-reading"
              payload: { grams_reading: 201 }
              as: LineOperator
              captures: { st201: $.data.status }
          trigger:
            - call: "POST /api/hoppers/${h1}/sensor-reading"
              payload: { grams_reading: 200 }
              as: LineOperator
              captures: { st200: $.data.status }
            - call: "GET /api/hoppers/${h1}/refill-tasks"
              payload: {}
              as: LineOperator
              captures: { t_count: $.data }
          assert:
            - "After 201 g reading: Hopper.${h1}.status == IN_SERVICE (201 > 200, no depletion) and current_grams == 201"
            - "After 200 g reading: Hopper.${h1}.status == DEPLETED (boundary inclusive) and an auto RefillTask exists"
      - name: portion_tolerance_exactly_5pct_passes
        grounds:
          - entities.PortionVerification.fields.result
          - calculations.calibration_drift_detection
        distinguishing_aspect: |
          Different metric (portion variance percent) and different endpoint
          (submit-verification): actual 105.0 g against expected 100.0 g gives
          variance +5.00 == PORTION_TOLERANCE_PCT, which PASSES (<= semantics);
          105.1 g gives +5.10 which FAILS. Empty/zero-count collections are not
          involved — this is the numeric-tolerance boundary.
        test_recipe:
          setup:
            - "Restaurant R1; AUTOMATED line L1; ingredient ING; recipe RC 100 g; hopper H1 coefficient 1.0 loaded 1000; orders O_PASS and O_FAIL both assembled"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "L1", line_type: "AUTOMATED", service_rate_seconds_per_bowl: 45 }
              as: OpsAdmin
              captures: { l1: $.data.id }
            - call: "POST /api/ingredients"
              payload: { sku: "ROM", name: "Romaine", station_type: "BASE", shelf_life_minutes: 240 }
              as: OpsAdmin
              captures: { ing: $.data.id }
            - call: "POST /api/recipes"
              payload: { restaurant_id: "${r1}", name: "Harvest", base_complexity: 0, portion_spec: [{ ingredient_id: "${ing}", target_grams: 100 }] }
              as: OpsAdmin
              captures: { rc: $.data.id, rc_v: $.data.version }
            - call: "POST /api/hoppers"
              payload: { line_id: "${l1}", ingredient_id: "${ing}", capacity_grams: 2000, station_slot: 0, calibration_coefficient: 1.0 }
              as: OpsAdmin
              captures: { h1: $.data.id, h1_v: $.data.version }
            - call: "POST /api/hoppers/${h1}/load"
              payload: { load_grams: 1000, expected_hopper_version: "${h1_v}" }
              as: LineOperator
            - call: "POST /api/orders"
              payload: { restaurant_id: "${r1}", recipe_id: "${rc}", expected_recipe_version: "${rc_v}" }
              as: Customer
              captures: { o_pass: $.data.id }
            - call: "POST /api/orders/${o_pass}/start-assembly"
              payload: {}
              as: LineOperator
            - call: "POST /api/orders"
              payload: { restaurant_id: "${r1}", recipe_id: "${rc}", expected_recipe_version: "${rc_v}" }
              as: Customer
              captures: { o_fail: $.data.id }
          trigger:
            - call: "POST /api/orders/${o_pass}/submit-verification"
              payload: { measurements: [{ hopper_id: "${h1}", actual_grams: 105.0 }] }
              as: LineOperator
              captures: { pass_status: $.data.status }
            - call: "POST /api/orders/${o_fail}/start-assembly"
              payload: {}
              as: LineOperator
            - call: "POST /api/orders/${o_fail}/submit-verification"
              payload: { measurements: [{ hopper_id: "${h1}", actual_grams: 105.1 }] }
              as: LineOperator
              captures: { fail_status: $.data.status, fail_remake: $.data.remake_count }
          assert:
            - "Order.${o_pass}.status == COMPLETED (variance +5.00 <= 5.0 boundary passes)"
            - "Order.${o_fail}.status == QUEUED and remake_count == 1 (variance +5.10 > 5.0 fails)"

  # ==========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: start_assembly_gated_by_line_posture
        grounds:
          - state_machines.Order.QUEUED_to_ASSEMBLING
          - entities.AssemblyLine.fields.posture
          - errors[ERR_LINE_NOT_OPEN]
        distinguishing_aspect: |
          Order -> AssemblyLine pair: the QUEUED -> ASSEMBLING transition is valid
          only while the assigned line's derived posture is OPEN; with one hopper
          DEPLETED the line is RESTRICTED and start-assembly is rejected even
          though the order itself is in a valid from-state.
        test_recipe:
          setup:
            - "Restaurant R1; AUTOMATED line L1; ingredient ING; recipe RC 100 g; hopper H1 loaded then driven DEPLETED by a 150 g sensor reading (line RESTRICTED); order O1 created BEFORE depletion so it is QUEUED on L1"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/assembly-lines"
