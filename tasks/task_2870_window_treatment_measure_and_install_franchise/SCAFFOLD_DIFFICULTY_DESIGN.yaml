  # -------------------------------------------------------------------
  # Rule 7 - cross_entity_state_dependency
  # -------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: install_completion_rechecks_the_order_state_a_remake_moved_underneath_it
        grounds:
          - validations.priority_29_ERR_ORDER_NOT_RECEIVED
          - state_machines.InstallJob.SCHEDULED_to_COMPLETED
          - state_machines.VendorOrder.RECEIVED_to_REMAKE_REQUESTED
          - state_machines.VendorOrder.REMAKE_REQUESTED_to_PLACED
          - calculations.remake_chargeback_waterfall
          - calculations.vendor_lead_time
        distinguishing_aspect: |
          The dependency is re-evaluated at a LATER transition of an already-valid row: the
          job was legally scheduled against a RECEIVED order, a franchisee remake then moved
          that order back to PLACED, and /complete must consult the order again rather than
          trust the check made at scheduling time. The other two instances in this rule
          check a reference at CREATION time and an ANCESTOR two hops up.
        test_recipe:
          setup:
            - "One ACTIVE territory with a large credit limit, one ACTIVE designer, one vendor with base_lead_time_days 10, cutoff_hour_utc 15, concurrent_capacity 2 and remake_policy SHARED_50_50 (no 90-day remake window to respect)."
            - "One LT-SHEER / CORDED opening measured INSIDE at 24.000 x 48.000 (list 4960), quoted (net 4960) and accepted at 2026-08-03T12:00:00.000Z; royalty 273 accrued."
            - "The order is placed at that instant (effective 2026-08-03, promised 2026-08-13, order_cost 2083), shipped, and received at 2026-08-13T09:00:00.000Z."
            - "An install job is created while the order is RECEIVED - scheduled 2026-08-17T09:00:00.000Z, motorized_channel_count 0 so commissioning_status is NOT_REQUIRED - and then the franchisee requests a REPLACEMENT remake at 2026-08-17T09:30:00.000Z, which drives the order back to PLACED."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"], royalty_rate_pct: 0.055, lead_capacity_per_week: 5, credit_limit_cents: 2000000, liability_window: "ROLLING_180D" }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t1: $.data.id }
            - call: "POST /blinds/designers"
              payload: { territory_id: "${t1}", full_name: "Dana Reed", home_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { d1: $.data.id }
            - call: "POST /blinds/vendors"
              payload: { name: "Ridgeline Shade Works", base_lead_time_days: 10, motorization_extra_days: 3, cutoff_hour_utc: 15, remake_policy: "SHARED_50_50", concurrent_capacity: 2, supported_lift_systems: ["CORDED", "CORDLESS"] }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { v1: $.data.id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Ana Ruiz", postal_code: "30301", source: "WEB_FORM", requested_at: "2026-08-01T08:00:00.000Z", child_occupied_dwelling: false }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { l1: $.data.id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l1}", designer_id: "${d1}", scheduled_start_at: "2026-08-03T10:00:00.000Z", scheduled_end_at: "2026-08-03T11:00:00.000Z", service_postal_code: "30301" }
              as: Designer
              as_user_id: "${d1}"
              captures: { c1: $.data.id }
            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "Kitchen sink window", room_type: "KITCHEN", mount_type: "INSIDE", width_top_in: 24.000, width_middle_in: 24.000, width_bottom_in: 24.000, height_left_in: 48.000, height_center_in: 48.000, height_right_in: 48.000, depth_in: 3.000 }
              as: Designer
              as_user_id: "${d1}"
              captures: { o1: $.data.id }
            - call: "PATCH /blinds/openings/${o1}/configuration"
              payload: { fabric_code: "LT-SHEER", lift_system: "CORDED", motorization_option: "NONE" }
              as: Designer
              as_user_id: "${d1}"
            - call: "GET /blinds/consultations/${c1}"
              as: Designer
              as_user_id: "${d1}"
              captures: { cv1: $.data.version }
            - call: "POST /blinds/quotes"
              payload: { consultation_id: "${c1}", expected_consultation_version: "${cv1}" }
              as: Designer
              as_user_id: "${d1}"
              captures: { q1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T12:00:00.000Z" }
              as: Franchisor
              as_user_id: "hq-ops"
            - call: "POST /blinds/quotes/${q1}/present"
              as: Designer
              as_user_id: "${d1}"
            - call: "POST /blinds/quotes/${q1}/accept"
              as: Designer
              as_user_id: "${d1}"
              captures: { qv1: $.data.version }
            - call: "POST /blinds/vendor-orders"
              payload: { quote_id: "${q1}", opening_ids: ["${o1}"], expected_quote_version: "${qv1}", preferred_vendor_id: "${v1}" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { ord1: $.data.id }
            - call: "POST /blinds/vendor-orders/${ord1}/ship"
              as: VendorRep
              as_user_id: "${v1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-13T09:00:00.000Z" }
              as: Franchisor
              as_user_id: "hq-ops"
            - call: "POST /blinds/vendor-orders/${ord1}/receive"
              as: Franchisee
              as_user_id: "${t1}"
            - call: "POST /blinds/install-jobs"
              payload: { vendor_order_id: "${ord1}", designer_id: "${d1}", scheduled_start_at: "2026-08-17T09:00:00.000Z", scheduled_end_at: "2026-08-17T11:00:00.000Z", service_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { j1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-17T09:30:00.000Z" }
              as: Franchisor
              as_user_id: "hq-ops"
            - call: "POST /blinds/vendor-orders/${ord1}/remake"
              payload: { credit_scope: "REPLACEMENT" }
              as: Franchisee
              as_user_id: "${t1}"
          trigger:
            - call: "POST /blinds/install-jobs/${j1}/complete"
              as: Designer
              as_user_id: "${d1}"
              captures: { err_order: $.data.error_id }
            - call: "POST /blinds/vendor-orders/${ord1}/ship"
              as: VendorRep
              as_user_id: "${v1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-23T09:00:00.000Z" }
              as: Franchisor
              as_user_id: "hq-ops"
            - call: "POST /blinds/vendor-orders/${ord1}/receive"
              as: Franchisee
              as_user_id: "${t1}"
            - call: "POST /blinds/install-jobs/${j1}/complete"
              as: Designer
              as_user_id: "${d1}"
          assert:
            - "the remake left the order in VendorOrder.${ord1}.status == PLACED with remake_count == 1, credit_scope == REPLACEMENT, lead_time_days == 6 (10 - 4 expedite, above the 5-day floor), effective_placement_date == 2026-08-17 and promised_ship_date == 2026-08-23"
            - "the FRANCHISEE_REQUEST waterfall on a SHARED_50_50 vendor split the 2083 wholesale cost as vendor_absorbed_cents == 1041 (floored half), territory_absorbed_cents == 1042 (the odd cent lands on the territory) and customer_absorbed_cents == 0"
            - "Territory.${t1}.remake_chargeback_cents == 1042 and exactly one REMAKE_CHARGEBACK ledger row exists with amount_cents 1042 / basis_cents 2083"
            - "the first /complete fails 409 with error_id == ERR_ORDER_NOT_RECEIVED although InstallJob.${j1}.install_status == SCHEDULED and commissioning_status == NOT_REQUIRED were both satisfiable"
            - "the failed completion writes nothing: Opening.${o1}.install_outcome == PENDING, InstallJob.${j1}.completed_at == null, Territory.${t1}.royalty_accrued_cents still == 273"
            - "after the re-shipped order is received again (VendorOrder.${ord1}.status == RECEIVED) the same /complete call succeeds: InstallJob.${j1}.install_status == COMPLETED and completed_at == 2026-08-23T09:00:00.000Z"
            - "Opening.${o1}.install_outcome == INSTALLED, Quote.${q1}.recognized_net_sales_cents == 4960 and Territory.${t1}.royalty_accrued_cents == 273 (the final variant reproduces the provisional figure)"
            - "Designer.${d1}.clean_install_count == 1 and remeasure_liability_score == 100 (clamped at BASE_SCORE, not 103)"

      - name: consultation_creation_is_refused_by_the_referenced_designers_own_state
        grounds:
          - validations.priority_14_ERR_DESIGNER_NOT_ACTIVE
          - state_machines.Designer.ACTIVE_to_INACTIVE
          - state_machines.Consultation.SCHEDULED_to_CANCELLED
          - endpoints.POST_blinds_consultations
          - entities.Designer.fields.status
        distinguishing_aspect: |
          The dependency is checked on a REFERENCE at creation time and is per-row rather
          than per-territory: the identical consultation body is refused for the retired
          designer and accepted for their ACTIVE colleague in the same territory, and the
          retirement simultaneously cancels the retired designer's future appointment while
          leaving the colleague's untouched.
        test_recipe:
          setup:
            - "One ACTIVE territory covering 30301 with lead_capacity_per_week 5."
            - "TWO ACTIVE designers in it, D1 and D2, each holding one future SCHEDULED consultation on 2026-09-10 in different hours so no calendar rule interferes."
            - "One further ROUTED lead L3 kept spare, so a fresh consultation can be attempted after the retirement."
            - "D1 is then retired with PATCH status INACTIVE at clock 2026-08-05T09:00:00.000Z; INACTIVE is a terminal state, so there is no way back."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"], royalty_rate_pct: 0.055, lead_capacity_per_week: 5, credit_limit_cents: 2000000, liability_window: "ROLLING_180D" }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t1: $.data.id }
            - call: "POST /blinds/designers"
              payload: { territory_id: "${t1}", full_name: "Dana Reed", home_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { d1: $.data.id }
            - call: "POST /blinds/designers"
              payload: { territory_id: "${t1}", full_name: "Milo Vance", home_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { d2: $.data.id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Ana Ruiz", postal_code: "30301", source: "WEB_FORM", requested_at: "2026-08-01T08:00:00.000Z", child_occupied_dwelling: false }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { l1: $.data.id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Bo Chen", postal_code: "30301", source: "REFERRAL", requested_at: "2026-08-01T09:00:00.000Z", child_occupied_dwelling: false }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { l2: $.data.id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Cy Doyle", postal_code: "30301", source: "WALK_IN", requested_at: "2026-08-01T10:00:00.000Z", child_occupied_dwelling: false }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { l3: $.data.id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l1}", designer_id: "${d1}", scheduled_start_at: "2026-09-10T14:00:00.000Z", scheduled_end_at: "2026-09-10T15:00:00.000Z", service_postal_code: "30301" }
              as: Designer
              as_user_id: "${d1}"
              captures: { c1: $.data.id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l2}", designer_id: "${d2}", scheduled_start_at: "2026-09-10T14:00:00.000Z", scheduled_end_at: "2026-09-10T15:00:00.000Z", service_postal_code: "30301" }
              as: Designer
              as_user_id: "${d2}"
              captures: { c2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00.000Z" }
              as: Franchisor
              as_user_id: "hq-ops"
            - call: "PATCH /blinds/designers/${d1}"
              payload: { status: "INACTIVE" }
              as: Franchisee
              as_user_id: "${t1}"
          trigger:
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l3}", designer_id: "${d1}", scheduled_start_at: "2026-09-15T14:00:00.000Z", scheduled_end_at: "2026-09-15T15:00:00.000Z", service_postal_code: "30301" }
              as: Designer
              as_user_id: "${d1}"
              captures: { err_designer: $.data.error_id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l3}", designer_id: "${d2}", scheduled_start_at: "2026-09-15T14:00:00.000Z", scheduled_end_at: "2026-09-15T15:00:00.000Z", service_postal_code: "30301" }
              as: Designer
              as_user_id: "${d2}"
              captures: { c3: $.data.id }
          assert:
            - "Designer.${d1}.status == INACTIVE and Designer.${d2}.status == ACTIVE"
            - "the retirement cascade cancelled only D1's row: Consultation.${c1}.status == CANCELLED and Consultation.${c2}.status == SCHEDULED"
            - "the retirement did NOT re-score anyone: Designer.${d1}.remeasure_liability_score == 100"
            - "the consultation naming D1 fails 409 with error_id == ERR_DESIGNER_NOT_ACTIVE"
            - "the identical body naming D2 succeeds 201 with Consultation.${c3}.status == SCHEDULED and designer_id == ${d2} - the gate is on the referenced designer, not on the territory"
            - "the refused create wrote nothing: GET /blinds/consultations?designer_id=${d1} returns total_count 1 (only the cancelled ${c1})"
            - "Lead.${l3}.status == ROUTED throughout and Territory.${t1}.open_leads_count == 3"

      - name: quote_acceptance_is_refused_by_its_grandparent_territorys_standing
        grounds:
          - validations.priority_13_ERR_TERRITORY_NOT_ACTIVE
          - state_machines.Quote.PRESENTED_to_ACCEPTED
          - entities.Territory.fields.status
          - endpoints.PATCH_blinds_territories_id
          - calculations.royalty_accrual
        distinguishing_aspect: |
          The dependency runs UPWARD two hops - Quote -> Consultation -> Designer/Territory -
          and the blocking state is PROBATION, a status that is neither terminal nor
          suspended, proving the rule reads "not ACTIVE" rather than "TERMINATED". The same
          quote, untouched and still live, accepts successfully once the franchise is
          restored, so the refusal is purely a function of the ancestor's state.
