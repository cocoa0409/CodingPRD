      - name: electronic_return_filing_gated_on_registration_verification
        grounds:
          - state_machines.TaxReturn.DRAFT_to_FILED
          - state_machines.JurisdictionRegistration.PENDING_to_VERIFIED
          - calculations.registration_interim_gate
          - errors.ERR_REGISTRATION_NOT_VERIFIED
        distinguishing_aspect: |
          Entity pair TaxReturn -> JurisdictionRegistration (a different
          pair than TaxDeposit -> PayrollRun): while the registration is
          PENDING the return is created with filing_method MANUAL_INTERIM
          and files as an interim manual filing; only after verification can
          a new return for the same jurisdiction be created ELECTRONIC. The
          already-FILED manual return is NOT rewritten by the later
          verification (no retroactive propagation).
        test_recipe:
          setup:
            - "Clock at 2026-10-05T00:00:00Z."
            - "CA-DE9 QUARTERLY. Client ACTIVE (activated on the FED registration) with a SECOND registration for CA still PENDING (multi-jurisdiction onboarding delay)."
            - "Return R-manual for CA created while CA registration PENDING; filed MANUAL_INTERIM."
            - "CA registration then verified; return R-electronic for CA 2026-Q4 created after verification."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "FED-941", name: "IRS Form 941", deposit_frequency: "SEMIWEEKLY", penalty_tier1_rate: 0.02, penalty_tier2_rate: 0.05, penalty_tier3_rate: 0.10, underpayment_threshold_cents: 250000 }
