      - name: rbac_portfolio_manager_denied_car_assignment_creation_returns_forbidden
        claim_type: denial
        grounds:
          - roles.LeaseAdministrator.exclusive_operations
          - roles.PortfolioManager.shared_operations
          - POST /api/v1/car-assignments
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "PortfolioManager is stopped at priority 2 with 403 ERR_FORBIDDEN on POST /car-assignments while the identical body under LeaseAdministrator clears priority 2 and is stopped only at priority 3 with 404 ERR_NOT_FOUND — the 403 is therefore role-keyed, not payload-keyed."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "A lessee and an ACTIVE FULL_SERVICE contract exist so the only unresolvable field in the placement body is the deliberately bogus lease_fleet_car_id."
            - "PortfolioManager's shared_operations carry All GET reads, which includes GET /car-assignments; POST /car-assignments lists LeaseAdministrator alone."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/lessees"
              payload: { legal_name: "LESS-PM-DENY", credit_tier: "A", utilization_threshold_pct: 50, credit_ceiling_cents: 9000000 }
              as: LeaseAdministrator
              captures: { ls_id: $.data.id }
            - call: "POST /api/v1/lease-contracts"
              payload: { lessee_id: "${ls_id}", lease_type: "FULL_SERVICE", per_diem_rate_cents: 10000, liability_bearer: "LESSOR", term_start_date: "2026-01-01", term_end_date: "2027-12-31", fleet_car_cap: 10 }
              as: LeaseAdministrator
              captures: { lc_id: $.data.id }
            - call: "POST /api/v1/lease-contracts/${lc_id}/activate"
              payload: {}
              as: LeaseAdministrator
          trigger:
            - call: "POST /api/v1/car-assignments"
              payload: { lease_fleet_car_id: "car-does-not-exist", lease_contract_id: "${lc_id}", lessee_id: "${ls_id}", start_date: "2026-09-01", end_date: "2026-12-01", mileage_allowance: 1000 }
              as: PortfolioManager
              captures: { err_id: $.data.error_id }
            - call: "GET /api/v1/car-assignments"
              payload: {}
              as: PortfolioManager
              captures: { pm_read: $.data }
            - call: "POST /api/v1/car-assignments"
              payload: { lease_fleet_car_id: "car-does-not-exist", lease_contract_id: "${lc_id}", lessee_id: "${ls_id}", start_date: "2026-09-01", end_date: "2026-12-01", mileage_allowance: 1000 }
              as: LeaseAdministrator
              captures: { err_id_la: $.data.error_id }
          assert:
            - "The PortfolioManager write returns HTTP 403 with data.error_id == ${err_id} == \"ERR_FORBIDDEN\""
            - "The identical body under LeaseAdministrator is not forbidden: it returns HTTP 404 with data.error_id == ${err_id_la} == \"ERR_NOT_FOUND\", so the placement body is structurally acceptable and only the acting role blocks it"
            - "The priority ordering is the discriminator: priority 2 fires for PortfolioManager before the body's unresolvable lease_fleet_car_id can reach priority 3"
            - "The denied role's shared GET /car-assignments returns HTTP 200, so the denial is operation-scoped inside a read-permitted role"
            - "No CarAssignment row was created by either rejected call: the shared list read is still empty"

      - name: rbac_regulatory_retrofitist_program_and_coverage_operations_succeed
        claim_type: exclusive operations
        grounds:
