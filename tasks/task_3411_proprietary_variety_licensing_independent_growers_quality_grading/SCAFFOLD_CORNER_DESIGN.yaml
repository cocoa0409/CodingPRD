        distinguishing_aspect: "The same segregation rule also bars the receiving operator: certifying as user co-1 (who recorded the receipt) fails 422 ERR_SEGREGATION_OF_DUTIES even though the QualityGrader ROLE is correct — the check is on the user id, not the role."
        test_recipe:
