# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3460_generic_medicine_application_review_patent_certification
# Breadth probe over SCAFFOLD.yaml 1.1-1.7. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# Logical clock default: 2026-09-01T00:00:00Z before any clock-set call.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: applicant_company_create_returns_envelope_defaults_and_fixed_clock
        claim_type: Creation
        grounds:
          - entities.ApplicantCompany
          - response_envelope
          - endpoints.POST_/generic-drug-review/applicant-companies
        distinguishing_aspect: "A ProgramAdmin create returns 201 with response_type object, both meta fields, the three input fields echoed, system id/created_at/updated_at/version==1, and created_at exactly 2026-09-01T00:00:00Z because the logical clock default is fixed, not wall-clock."
        test_recipe:
          setup:
            - "Empty database; no clock-set call has ever been made."
          setup_api_calls: []
          trigger:
            - call: "POST /generic-drug-review/applicant-companies"
              payload: { legal_name: "Envelope Pharma", contact_email: "reg@env.example", headquarters_country: "US" }
              as: ProgramAdmin
              captures: { ac_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "meta.api_request_id and meta.api_request_timestamp are present"
            - "ApplicantCompany.${ac_id}.legal_name == \"Envelope Pharma\" and headquarters_country == \"US\""
            - "version == 1 and id, created_at, updated_at are non-null"
            - "created_at == \"2026-09-01T00:00:00Z\" exactly (the pinned logical-clock default)"

      - name: reference_product_get_round_trips_full_configuration
        claim_type: Retrieval
        grounds:
          - entities.ReferenceProduct
          - endpoints.GET_/generic-drug-review/reference-products/{id}
        distinguishing_aspect: "Every ReferenceProduct field round-trips through GET exactly as posted, including the false is_new_chemical_entity, the two-element indication_codes array, and the opaque patent_owner_user_id."
        test_recipe:
          setup:
            - "Logical clock at default."
          setup_api_calls:
            - call: "POST /generic-drug-review/reference-products"
              payload: { brand_name: "Roundtrip", active_ingredient: "roundtripol", strength: "55 mg", dosage_form: "CAPSULE", rld_approval_date: "2015-02-14", is_new_chemical_entity: false, indication_codes: ["IND-A", "IND-B"], patent_owner_user_id: "innovator-ops-50" }
              as: ProgramAdmin
              captures: { rld_id: $.data.id }
          trigger:
            - call: "GET /generic-drug-review/reference-products/${rld_id}"
              payload: {}
              as: RegulatoryReviewer
          assert:
            - "the response status is 200"
            - "ReferenceProduct.${rld_id}.rld_approval_date == \"2015-02-14\" and is_new_chemical_entity == false"
            - "ReferenceProduct.${rld_id}.indication_codes == [\"IND-A\", \"IND-B\"] and patent_owner_user_id == \"innovator-ops-50\""

      - name: applications_list_filters_by_applicant_and_paginates
        claim_type: Listing
        grounds:
          - endpoints.GET_/generic-drug-review/applications
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Filtering by applicant_id intersects with limit/offset pagination: with 3 DRAFT applications for applicant A and 1 for applicant B, limit=2 returns total_count 3 and has_more true; offset=2 returns the remainder with has_more false."
        test_recipe:
          setup:
            - "Logical clock at default. One RLD; applicant A with three DRAFT applications; applicant B with one."
          setup_api_calls:
            - call: "POST /generic-drug-review/applicant-companies"
              payload: { legal_name: "Lister A", contact_email: "a@la.example", headquarters_country: "US" }
              as: ProgramAdmin
              captures: { ac_a: $.data.id }
            - call: "POST /generic-drug-review/applicant-companies"
              payload: { legal_name: "Lister B", contact_email: "b@lb.example", headquarters_country: "US" }
              as: ProgramAdmin
              captures: { ac_b: $.data.id }
            - call: "POST /generic-drug-review/reference-products"
              payload: { brand_name: "Listex", active_ingredient: "listexol", strength: "5 mg", dosage_form: "TABLET", rld_approval_date: "2010-01-01", is_new_chemical_entity: false, indication_codes: ["IND-A"], patent_owner_user_id: "innovator-ops-51" }
              as: ProgramAdmin
              captures: { rld_id: $.data.id }
            - call: "POST /generic-drug-review/applications"
              payload: { reference_product_id: "${rld_id}", applicant_id: "${ac_a}", review_priority: "STANDARD", labeling_mode: "FULL", carved_indication_codes: [] }
              as: ApplicantSponsor
              as_user_id: "${ac_a}"
            - call: "POST /generic-drug-review/applications"
              payload: { reference_product_id: "${rld_id}", applicant_id: "${ac_a}", review_priority: "PRIORITY", labeling_mode: "FULL", carved_indication_codes: [] }
              as: ApplicantSponsor
              as_user_id: "${ac_a}"
            - call: "POST /generic-drug-review/applications"
              payload: { reference_product_id: "${rld_id}", applicant_id: "${ac_a}", review_priority: "STANDARD", labeling_mode: "FULL", carved_indication_codes: [] }
              as: ApplicantSponsor
              as_user_id: "${ac_a}"
            - call: "POST /generic-drug-review/applications"
              payload: { reference_product_id: "${rld_id}", applicant_id: "${ac_b}", review_priority: "STANDARD", labeling_mode: "FULL", carved_indication_codes: [] }
              as: ApplicantSponsor
              as_user_id: "${ac_b}"
          trigger:
            - call: "GET /generic-drug-review/applications"
              payload: { applicant_id: "${ac_a}", limit: 2, offset: 0 }
              as: ProgramAdmin
          assert:
            - "the response status is 200, response_type is array, exactly 2 rows, total_count == 3, has_more == true"
            - "GET with applicant_id ${ac_a}, limit 2, offset 2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET with applicant_id ${ac_b} returns exactly 1 row"
            - "GET with status DRAFT and no other parameter returns 4 rows with limit defaulting to 10 and offset to 0"

      - name: application_get_with_unknown_id_returns_application_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/generic-drug-review/applications/{id}
          - errors.ERR_APPLICATION_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but unallocated application id yields the entity-specific 404 ERR_APPLICATION_NOT_FOUND, not a generic error and not a 400."
        test_recipe:
          setup:
            - "Logical clock at default; no applications exist."
          setup_api_calls: []
          trigger:
            - call: "GET /generic-drug-review/applications/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and data.error_id == ERR_APPLICATION_NOT_FOUND"

      - name: listed_patent_missing_expiry_date_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.ListedPatent.fields.expiry_date
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "expiry_date is a required input with no default; omitting it (while supplying every other field) is a 400 ERR_INVALID_REQUEST, not a 422."
        test_recipe:
          setup:
            - "Logical clock at default; one reference product registered."
          setup_api_calls:
            - call: "POST /generic-drug-review/reference-products"
              payload: { brand_name: "Reqpat", active_ingredient: "reqpatol", strength: "9 mg", dosage_form: "TABLET", rld_approval_date: "2012-02-02", is_new_chemical_entity: false, indication_codes: ["IND-A"], patent_owner_user_id: "innovator-ops-52" }
              as: ProgramAdmin
              captures: { rld_id: $.data.id }
          trigger:
            - call: "POST /generic-drug-review/reference-products/${rld_id}/listed-patents"
              payload: { patent_number: "US1111111", patent_type: "DRUG_SUBSTANCE" }
              as: InnovatorSponsor
              as_user_id: "innovator-ops-52"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and data.error_id == ERR_INVALID_REQUEST"

      - name: review_cycle_snapshot_defaults_at_submit
        claim_type: Defaults
        grounds:
          - entities.ReviewCycle.fields.base_review_months
          - entities.ReviewCycle.fields.major_amendment_extensions_count
          - calculations.goal_date_computation
        distinguishing_aspect: "Cycle 1 opened by a STANDARD submit snapshots base_review_months 10 and major_amendment_extensions_count 0 with goal_date 2027-07-01 — defaults and snapshot semantics are server-set, not client-supplied."
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01. STANDARD application with an ACCEPTED BE study; no patents."
          setup_api_calls:
            - call: "POST /generic-drug-review/applicant-companies"
              payload: { legal_name: "Defaults Co", contact_email: "reg@def.example", headquarters_country: "US" }
              as: ProgramAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /generic-drug-review/reference-products"
              payload: { brand_name: "Defaultex", active_ingredient: "defaultexol", strength: "6 mg", dosage_form: "TABLET", rld_approval_date: "2009-03-03", is_new_chemical_entity: false, indication_codes: ["IND-A"], patent_owner_user_id: "innovator-ops-53" }
              as: ProgramAdmin
              captures: { rld_id: $.data.id }
            - call: "POST /generic-drug-review/applications"
              payload: { reference_product_id: "${rld_id}", applicant_id: "${ac_id}", review_priority: "STANDARD", labeling_mode: "FULL", carved_indication_codes: [] }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { app_id: $.data.id }
            - call: "POST /generic-drug-review/applications/${app_id}/bioequivalence-studies"
              payload: { study_type: "FASTING", analyte: "defaultexol", auc_ratio_pct: 100.0, auc_ci_low_pct: 92.0, auc_ci_high_pct: 108.0, cmax_ratio_pct: 99.0, cmax_ci_low_pct: 90.0, cmax_ci_high_pct: 110.0 }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
            - call: "POST /generic-drug-review/applications/${app_id}/submit"
              payload: {}
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
          trigger:
            - call: "GET /generic-drug-review/applications/${app_id}/review-cycles"
              payload: {}
              as: RegulatoryReviewer
              captures: { cyc_status: "$.data[0].status", cyc_base: "$.data[0].base_review_months", cyc_ext: "$.data[0].major_amendment_extensions_count", cyc_goal: "$.data[0].goal_date" }
          assert:
            - "exactly one cycle exists with cycle_number == 1 and status == OPEN"
            - "base_review_months == 10 and major_amendment_extensions_count == 0"
            - "goal_date == \"2027-07-01\" (2026-09-01 + 10 months)"

      - name: bioequivalence_study_is_adequate_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.BioequivalenceStudy.fields.is_adequate
          - validations[priority=5]
        distinguishing_aspect: "A client-supplied is_adequate: false is ignored per the priority-5 unknown/computed-field policy: the server computes adequacy from the bounds and returns is_adequate true, status ACCEPTED."
        test_recipe:
          setup:
            - "Logical clock at default. DRAFT application exists."
          setup_api_calls:
            - call: "POST /generic-drug-review/applicant-companies"
              payload: { legal_name: "Ignored Input Labs", contact_email: "reg@ii.example", headquarters_country: "US" }
              as: ProgramAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /generic-drug-review/reference-products"
              payload: { brand_name: "Ignorex", active_ingredient: "ignorexol", strength: "11 mg", dosage_form: "TABLET", rld_approval_date: "2008-04-04", is_new_chemical_entity: false, indication_codes: ["IND-A"], patent_owner_user_id: "innovator-ops-54" }
              as: ProgramAdmin
              captures: { rld_id: $.data.id }
            - call: "POST /generic-drug-review/applications"
              payload: { reference_product_id: "${rld_id}", applicant_id: "${ac_id}", review_priority: "STANDARD", labeling_mode: "FULL", carved_indication_codes: [] }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /generic-drug-review/applications/${app_id}/bioequivalence-studies"
              payload: { study_type: "FASTING", analyte: "ignorexol", auc_ratio_pct: 100.0, auc_ci_low_pct: 92.0, auc_ci_high_pct: 108.0, cmax_ratio_pct: 99.0, cmax_ci_low_pct: 90.0, cmax_ci_high_pct: 110.0, is_adequate: false, status: "DEFICIENT" }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { st_id: $.data.id, st_ok: $.data.is_adequate, st_status: $.data.status }
          assert:
            - "BioequivalenceStudy.${st_id}.is_adequate == true and status == ACCEPTED despite the client sending false/DEFICIENT"
            - "the response status is 201 — unknown and computed-field keys are ignored, not rejected"

      - name: supplement_change_type_invalid_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Supplement.fields.change_type
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "change_type is a closed enum; CRYO_STORAGE is rejected 400 ERR_INVALID_REQUEST at shape validation before any business rule runs."
        test_recipe:
          setup:
            - "Logical clock at default. Application APPROVED (clean chain: ACCEPTED BE study, PASSED inspection, no patents)."
          setup_api_calls:
            - call: "POST /generic-drug-review/applicant-companies"
              payload: { legal_name: "Enum Generics", contact_email: "reg@en.example", headquarters_country: "US" }
              as: ProgramAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /generic-drug-review/reference-products"
              payload: { brand_name: "Enumex", active_ingredient: "enumexol", strength: "7 mg", dosage_form: "TABLET", rld_approval_date: "2007-05-05", is_new_chemical_entity: false, indication_codes: ["IND-A"], patent_owner_user_id: "innovator-ops-55" }
              as: ProgramAdmin
              captures: { rld_id: $.data.id }
            - call: "POST /generic-drug-review/applications"
              payload: { reference_product_id: "${rld_id}", applicant_id: "${ac_id}", review_priority: "STANDARD", labeling_mode: "FULL", carved_indication_codes: [] }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { app_id: $.data.id }
            - call: "POST /generic-drug-review/applications/${app_id}/bioequivalence-studies"
              payload: { study_type: "FASTING", analyte: "enumexol", auc_ratio_pct: 100.0, auc_ci_low_pct: 92.0, auc_ci_high_pct: 108.0, cmax_ratio_pct: 99.0, cmax_ci_low_pct: 90.0, cmax_ci_high_pct: 110.0 }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
            - call: "POST /generic-drug-review/manufacturing-facilities"
              payload: { applicant_id: "${ac_id}", facility_name: "EN Plant", fei_number: "FEI-EN-1", country_code: "US" }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /generic-drug-review/facility-inspections"
              payload: { facility_id: "${fac_id}", application_id: "${app_id}", scheduled_start_date: "2026-09-05", scheduled_end_date: "2026-09-07" }
              as: RegulatoryReviewer
              captures: { insp_id: $.data.id }
            - call: "POST /generic-drug-review/facility-inspections/${insp_id}/record-outcome"
              payload: { outcome: "PASSED" }
              as: FacilityInspector
            - call: "POST /generic-drug-review/applications/${app_id}/submit"
              payload: {}
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
            - call: "POST /generic-drug-review/applications/${app_id}/approval-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
          trigger:
            - call: "POST /generic-drug-review/applications/${app_id}/supplements"
              payload: { change_type: "CRYO_STORAGE", pathway: "PRIOR_APPROVAL" }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and data.error_id == ERR_INVALID_REQUEST"

      - name: patent_certification_under_unknown_application_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.PatentCertification.fields.application_id
          - errors.ERR_APPLICATION_NOT_FOUND
        distinguishing_aspect: "Creating a certification under a non-existent application path id fails with ERR_APPLICATION_NOT_FOUND before any body validation, even with a well-formed body."
        test_recipe:
          setup:
            - "Logical clock at default. One real DRAFT application exists (its live version is captured only to satisfy the OCC payload shape; the call targets a different, unknown id)."
          setup_api_calls:
            - call: "POST /generic-drug-review/applicant-companies"
              payload: { legal_name: "Orphan Cert Co", contact_email: "reg@oc.example", headquarters_country: "US" }
              as: ProgramAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /generic-drug-review/reference-products"
              payload: { brand_name: "Orphanex", active_ingredient: "orphanexol", strength: "13 mg", dosage_form: "TABLET", rld_approval_date: "2011-06-06", is_new_chemical_entity: false, indication_codes: ["IND-A"], patent_owner_user_id: "innovator-ops-56" }
              as: ProgramAdmin
              captures: { rld_id: $.data.id }
            - call: "POST /generic-drug-review/applications"
              payload: { reference_product_id: "${rld_id}", applicant_id: "${ac_id}", review_priority: "STANDARD", labeling_mode: "FULL", carved_indication_codes: [] }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { real_app: $.data.id, real_v: $.data.version }
          trigger:
            - call: "POST /generic-drug-review/applications/99999999-8888-4777-8666-555555555555/patent-certifications"
              payload: { patent_id: "99999999-8888-4777-8666-555555555555", certification_type: "PARAGRAPH_III_DEFER", expected_application_version: "${real_v}" }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and data.error_id == ERR_APPLICATION_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: listed_patent_created_with_past_expiry_starts_expired
        claim_type: Initial State
        grounds:
          - state_machines.ListedPatent.LISTED_to_EXPIRED
          - entities.ListedPatent.fields.status
        distinguishing_aspect: "The expiry evaluation runs at creation: a patent listed with expiry_date already in the past is born EXPIRED rather than LISTED."
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01; one reference product."
          setup_api_calls:
            - call: "POST /generic-drug-review/reference-products"
              payload: { brand_name: "Oldpat", active_ingredient: "oldpatol", strength: "14 mg", dosage_form: "TABLET", rld_approval_date: "2001-01-01", is_new_chemical_entity: false, indication_codes: ["IND-A"], patent_owner_user_id: "innovator-ops-57" }
              as: ProgramAdmin
              captures: { rld_id: $.data.id }
          trigger:
            - call: "POST /generic-drug-review/reference-products/${rld_id}/listed-patents"
              payload: { patent_number: "US5555555", patent_type: "DRUG_PRODUCT", expiry_date: "2020-06-01" }
              as: InnovatorSponsor
              as_user_id: "innovator-ops-57"
              captures: { pat_id: $.data.id, pat_status: $.data.status }
          assert:
            - "ListedPatent.${pat_id}.status == EXPIRED immediately in the creation response"

      - name: submit_happy_path_sets_received_date_and_opens_cycle_one
        claim_type: Valid Transition
        grounds:
          - state_machines.GenericApplication.DRAFT_to_RECEIVED
        distinguishing_aspect: "The DRAFT -> RECEIVED transition stamps received_date from the logical clock, bumps current_cycle_number to 1, opens cycle 1, and leaves a PARAGRAPH_IV-free application without any exclusivity award."
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01. DRAFT application with an ACCEPTED BE study; RLD has no patents."
          setup_api_calls:
            - call: "POST /generic-drug-review/applicant-companies"
              payload: { legal_name: "Happy Path Pharma", contact_email: "reg@hp.example", headquarters_country: "US" }
              as: ProgramAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /generic-drug-review/reference-products"
              payload: { brand_name: "Happyex", active_ingredient: "happyexol", strength: "16 mg", dosage_form: "TABLET", rld_approval_date: "2004-04-04", is_new_chemical_entity: false, indication_codes: ["IND-A"], patent_owner_user_id: "innovator-ops-58" }
              as: ProgramAdmin
              captures: { rld_id: $.data.id }
            - call: "POST /generic-drug-review/applications"
              payload: { reference_product_id: "${rld_id}", applicant_id: "${ac_id}", review_priority: "STANDARD", labeling_mode: "FULL", carved_indication_codes: [] }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { app_id: $.data.id }
            - call: "POST /generic-drug-review/applications/${app_id}/bioequivalence-studies"
              payload: { study_type: "FASTING", analyte: "happyexol", auc_ratio_pct: 100.0, auc_ci_low_pct: 92.0, auc_ci_high_pct: 108.0, cmax_ratio_pct: 99.0, cmax_ci_low_pct: 90.0, cmax_ci_high_pct: 110.0 }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
          trigger:
            - call: "POST /generic-drug-review/applications/${app_id}/submit"
              payload: {}
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { st: $.data.status, rd: $.data.received_date, cyc: $.data.current_cycle_number }
            - call: "GET /generic-drug-review/exclusivity-awards"
              payload: { application_id: "${app_id}" }
              as: RegulatoryReviewer
          assert:
            - "GenericApplication.${app_id}.status == RECEIVED, received_date == \"2026-09-01\", current_cycle_number == 1"
            - "GET exclusivity-awards?application_id=${app_id} returns an empty array (no P4 certification means no award)"

      - name: approval_decision_on_draft_application_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.GenericApplication.RECEIVED_to_APPROVED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "approval-decision is declared only from RECEIVED; invoking it on a DRAFT application is a 409 ERR_INVALID_STATE and records no decision."
        test_recipe:
          setup:
            - "Logical clock at default. DRAFT application (never submitted)."
          setup_api_calls:
            - call: "POST /generic-drug-review/applicant-companies"
              payload: { legal_name: "Draft Decision Co", contact_email: "reg@dd.example", headquarters_country: "US" }
              as: ProgramAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /generic-drug-review/reference-products"
              payload: { brand_name: "Draftex", active_ingredient: "draftexol", strength: "17 mg", dosage_form: "TABLET", rld_approval_date: "2003-03-03", is_new_chemical_entity: false, indication_codes: ["IND-A"], patent_owner_user_id: "innovator-ops-59" }
              as: ProgramAdmin
              captures: { rld_id: $.data.id }
            - call: "POST /generic-drug-review/applications"
              payload: { reference_product_id: "${rld_id}", applicant_id: "${ac_id}", review_priority: "STANDARD", labeling_mode: "FULL", carved_indication_codes: [] }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /generic-drug-review/applications/${app_id}/approval-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and data.error_id == ERR_INVALID_STATE"
