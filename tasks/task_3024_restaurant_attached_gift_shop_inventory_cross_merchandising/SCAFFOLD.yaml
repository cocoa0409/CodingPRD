# =============================================================================
# PRD Benchmark Seed Tables — task_3024
# Restaurant-Attached Gift Shop Inventory & Cross-Merchandising
# =============================================================================

scenario: |
  Restaurant-Attached Gift Shop Inventory & Cross-Merchandising (Cracker Barrel): dual-format store where retail and restaurant share labor, space and a single transaction, retail assortment planning on seasonal and nostalgia themes with long import lead times, waiting-area traffic conversion measured as retail sales per restaurant guest, shared point-of-sale handling combined checks with separate revenue recognition, retail markdown cadence for seasonal decor with post-holiday clearance schedules, inventory receiving into a small backroom shared with food storage, staffing crossover rules and tip-eligibility boundaries, planogram execution across a fleet with regional assortment tweaks

domain_name: restaurant-attached-gift-shop
api_prefix: /retail-ops

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
    - rate_threshold_triggers
    - resource_temporal_overlap

  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (§1.1)
# Flat topology: no URL nesting; every child collection resolves its parent
# through an explicit `<parent>_id` foreign key. Every FK field description
# starts with the canonical `FK -> {Parent}.id` prefix.
# =============================================================================
entities:
  - name: Brand
    parent: null
    common_fields: true
    fields:
      - { name: brand_code, type: string, source: input, description: "Chain code, unique across the fleet", constraints: "unique; immutable after creation" }
      - { name: legal_name, type: string, source: input, description: "Registered legal entity name" }
      - { name: retail_recognition_policy, type: enum, source: input, default: "FINAL_ONLY", description: "Revenue-recognition policy applied to every Receipt of this brand", constraints: "FINAL_ONLY | PROVISIONAL_THEN_FINAL" }
      - { name: liquidation_trigger_rpg_cents, type: integer, source: input, default: 700, description: "Retail-sales-per-guest threshold, in cents, that triggers post-holiday clearance extension at store-day close", constraints: ">= 0" }
      - { name: open_receipt_grace_hours, type: integer, source: input, default: 24, description: "Hours after store-day close within which an unreconciled Receipt may still be reconciled" }
      - { name: transfer_variance_tolerance_bps, type: integer, source: input, default: 200, description: "Allowed receiving variance in basis points of declared_units", constraints: "0 <= value <= 10000" }
      - { name: waiting_area_retail_weight_bps, type: integer, source: input, default: 6000, description: "Weight, in basis points, of retail conversion in the waiting-area conversion index", constraints: "0 <= value <= 10000" }
      - { name: tip_minimum_minutes, type: integer, source: input, default: 240, description: "Minimum clocked minutes in a tip-eligible workcode before a StaffShift is tip-eligible" }
      - { name: clearance_buffer_hours, type: integer, source: input, default: 24, description: "Mandatory quiet hours between two ClearanceSchedule windows on the same (location, item) pair" }
      - { name: food_storage_corridor_units, type: integer, source: input, default: 40, description: "Standing food-storage corridor units that backroom occupancy must never displace", constraints: ">= 0" }
      - { name: max_check_total_cents, type: integer, source: input, default: 50000, description: "Maximum combined GuestCheck total that a single check may carry", constraints: "> 0" }
      - { name: fiscal_period, type: string, source: input, description: "Reporting period label, e.g. 2026-Q3" }
      - { name: fiscal_period_status, type: enum, source: system, default: "OPEN", description: "Whether revenue may still be recognized in this period", constraints: "OPEN | CLOSED" }
      - { name: provisional_retail_revenue_cents, type: integer, source: computed, default: 0, description: "Sum of Receipt.provisional_retail_cents over receipts in status IN {RECONCILED, SETTLED, CLOSED}" }
      - { name: recognized_retail_revenue_cents, type: integer, source: computed, default: 0, description: "Sum of Receipt.recognized_retail_cents over receipts in status IN {RECONCILED, SETTLED, CLOSED}" }
      - { name: brand_retail_sales_per_guest_cents, type: integer, source: computed, default: 0, description: "Guest-count-weighted roll-up of StoreDay.retail_sales_per_guest_cents over CLOSED store days of the fiscal_period" }

  - name: Location
    parent: null
    common_fields: true
    fields:
      - { name: brand_id, type: string, source: input, description: "FK -> Brand.id; owning chain" }
      - { name: store_number, type: string, source: input, description: "Fleet store number", constraints: "unique per brand_id" }
      - { name: region_code, type: enum, source: input, description: "Regional assortment grouping", constraints: "NORTHEAST | SOUTHEAST | MIDWEST | SOUTHWEST | WEST" }
      - { name: assortment_tier, type: enum, source: input, description: "Assortment breadth the planogram must honor", constraints: "FULL | REGIONAL_TWEAK | MINIMAL" }
      - { name: backroom_capacity_units, type: integer, source: input, description: "Total receivable units the shared backroom can hold", constraints: "> 0" }
      - { name: clearance_max_active, type: integer, source: input, default: 3, description: "Maximum concurrently ACTIVE ClearanceSchedule rows on this location", constraints: ">= 1" }
      - { name: local_event_codes, type: array, source: input, default: [], description: "Regional assortment tweak codes, e.g. [\"SUMMER_BOAT\", \"LOCAL_PEACH\"]" }
      - { name: backroom_occupancy_units, type: integer, source: computed, default: 0, description: "Latest BackroomCapacityReading.occupancy_units for this location" }
      - { name: backroom_committed_units, type: integer, source: computed, default: 0, description: "Units committed to non-terminal Transfer rows in status IN {PLANNED, IN_TRANSIT}" }
      - { name: food_storage_units, type: integer, source: computed, default: 0, description: "Latest BackroomCapacityReading.food_storage_units for this location" }
      - { name: staging_free_units, type: integer, source: computed, default: 0, description: "= backroom_capacity_units - backroom_occupancy_units - backroom_committed_units - food_storage_corridor_units(Brand)" }
      - { name: active_clearance_count, type: integer, source: computed, default: 0, description: "Count of ClearanceSchedule rows in status IN {ACTIVE, EXTENDED} for this location" }
      - { name: active_planogram_version_id, type: string, source: computed, description: "PlanogramVersion.id currently PUBLISHED for this location" }

  - name: StoreDay
    parent: null
    common_fields: true
    fields:
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; store the day belongs to" }
      - { name: business_date, type: datetime, source: input, description: "Business date, ISO 8601 at 00:00:00Z", constraints: "unique per location_id" }
      - { name: traffic_state, type: enum, source: system, default: "QUIET", description: "Independent traffic dimension of the store day", constraints: "QUIET | STEADY | RUSH" }
      - { name: conversion_gate, type: enum, source: system, default: "OPEN", description: "Derived gate that governs retail-side operations for this store day", constraints: "OPEN | GATED_RESTRICTED | SUSPENDED" }
      - { name: day_status, type: enum, source: system, default: "OPEN", description: "Business-day lifecycle dimension", constraints: "OPEN | CLOSED" }
      - { name: restaurant_guest_count, type: integer, source: input, default: 0, description: "Restaurant guests seated so far", constraints: ">= 0" }
      - { name: restaurant_sales_cents, type: integer, source: input, default: 0, description: "Restaurant revenue booked so far" }
      - { name: waiting_area_shopper_count, type: integer, source: input, default: 0, description: "Guests observed in the retail waiting area", constraints: ">= 0" }
      - { name: waiting_area_converted_count, type: integer, source: input, default: 0, description: "Waiting-area shoppers who completed a retail purchase", constraints: ">= 0" }
      - { name: retail_transaction_count, type: integer, source: input, default: 0, description: "Retail receipts recorded for this store day" }
      - { name: retail_sales_cents, type: integer, source: computed, default: 0, description: "Sum of the STORED Receipt.provisional_retail_cents values for receipts of this store day in status IN {DRAFT, RECONCILED, SETTLED, CLOSED}. This field sums stored values only and never re-derives them from live Item.effective_price_cents, so a later markdown advance cannot move it" }
      - { name: retail_sales_per_guest_cents, type: integer, source: computed, default: 0, description: "Final-variant retail sales per restaurant guest, in cents" }
      - { name: provisional_retail_sales_per_guest_cents, type: integer, source: computed, default: 0, description: "Provisional-variant retail sales per guest, in cents, using the waiting-area denominator" }
      - { name: waiting_area_conversion_index_bps, type: integer, source: computed, default: 0, description: "Weighted conversion index in basis points, spanning the derived conversion rate and the realized tip share of retail sales" }
      - { name: closed_at, type: datetime, source: system, description: "Timestamp the store day was closed", constraints: "null while day_status == OPEN" }

  - name: Item
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Stock-keeping unit, unique across the brand", constraints: "unique" }
      - { name: name, type: string, source: input, description: "Selling name" }
      - { name: theme_code, type: enum, source: input, description: "Seasonal / nostalgia assortment theme", constraints: "HARVEST | WINTER_HOLIDAY | SPRING | SUMMER | NOSTALGIA_CLASSIC" }
      - { name: nostalgia_flag, type: boolean, source: input, default: false, description: "Year-round nostalgia assortment member" }
      - { name: unit_retail_cents, type: integer, source: input, description: "Everyday retail price, in cents", constraints: "> 0" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Landed unit cost, in cents", constraints: ">= 0" }
      - { name: import_lead_time_days, type: integer, source: input, description: "Days from purchase order to receiving for imported goods", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "Item lifecycle status", constraints: "ACTIVE | CLEARANCE | DISCONTINUED" }
      - { name: current_markdown_pct, type: number, source: computed, default: 0, description: "Markdown percent applied by the latest non-reversed ClearanceSchedule markdown event" }
      - { name: effective_price_cents, type: integer, source: computed, default: 0, description: "Highest-of-stacked markdown price, rounded per line item" }
      - { name: compounded_price_cents, type: integer, source: computed, default: 0, description: "Compounded-markdown price used by the dual-variant markdown comparison" }
      - { name: on_hand_units, type: integer, source: computed, default: 0, description: "Live units on hand: units received through Transfer rows in status IN {RECEIVED, RECONCILED} in receiving_zone BACKROOM minus units moved out by liquidation. This is the sole source for remaining_units snapshots and for clearance dilutive decay" }
      - { name: order_deadline_reached, type: boolean, source: computed, default: false, description: "True when import_lead_time_days no longer fits before the theme's season window opens" }
      - { name: clearance_week, type: integer, source: computed, default: 0, description: "Completed whole weeks on clearance since the schedule's most recent activation, capped at 4; advanced by POST /transfers/{id}/advance" }

  - name: PlanogramVersion
    parent: null
    common_fields: true
    fields:
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; store the planogram is executed in" }
      - { name: assortment_tier, type: enum, source: input, description: "Assortment tier this version is built for", constraints: "FULL | REGIONAL_TWEAK | MINIMAL" }
      - { name: effective_date, type: datetime, source: input, description: "Date the planogram takes effect" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "Planogram version lifecycle status", constraints: "DRAFT | PUBLISHED | SUPERSEDED | RETIRED" }
      - { name: superseded_by_version_id, type: string, source: system, description: "FK -> PlanogramVersion.id; the version that replaced this one on publish" }
      - { name: slot_count, type: integer, source: computed, default: 0, description: "Count of PlanogramSlot rows whose status != VACATED for this version" }
      - { name: published_at, type: datetime, source: system, description: "Timestamp this version was published", constraints: "null while status == DRAFT" }

  - name: PlanogramSlot
    parent: null
    common_fields: true
    fields:
      - { name: planogram_version_id, type: string, source: input, description: "FK -> PlanogramVersion.id; version this slot belongs to" }
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; item merchandised in this slot" }
      - { name: slot_position, type: integer, source: input, description: "Position index inside the planogram", constraints: "unique per planogram_version_id" }
      - { name: facings, type: integer, source: input, default: 1, description: "Number of facings allocated", constraints: ">= 1" }
      - { name: min_presentation_units, type: integer, source: input, default: 1, description: "Minimum units required to consider the slot presentable", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: "PLANNED", description: "Slot execution status", constraints: "PLANNED | APPLIED | VERIFIED | FROZEN | VACATED" }
      - { name: applied_at, type: datetime, source: system, description: "Timestamp the slot was applied on the floor" }
      - { name: verified_at, type: datetime, source: system, description: "Timestamp the slot was verified by a manager" }

  - name: GuestCheck
    parent: null
    common_fields: true
    fields:
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; store the check was opened in" }
      - { name: store_day_id, type: string, source: input, description: "FK -> StoreDay.id; business day the check belongs to" }
      - { name: table_number, type: string, source: input, description: "Dining-room table the check was opened at" }
      - { name: restaurant_guest_count, type: integer, source: input, description: "Guests seated at this check", constraints: ">= 1" }
      - { name: restaurant_subtotal_cents, type: integer, source: input, description: "Food and beverage subtotal before service fee", constraints: ">= 0" }
      - { name: retail_subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of Receipt.gross_retail_cents - Receipt discounts over receipts attached to this check" }
      - { name: service_fee_cents, type: integer, source: computed, default: 0, description: "Service fee selected from the tier keyed on the check total" }
      - { name: total_cents, type: integer, source: computed, default: 0, description: "Combined check total; retail and restaurant revenue are recognized separately" }
      - { name: check_status, type: enum, source: system, default: "PENDING", description: "Check lifecycle dimension", constraints: "PENDING | FINALIZED | VOIDED" }
      - { name: settlement_status, type: enum, source: system, default: "UNSETTLED", description: "Independent settlement dimension", constraints: "UNSETTLED | SETTLED | REFUNDED" }
      - { name: presented_shift_id, type: string, source: input, description: "FK -> StaffShift.id; shift that presented this check to the guests" }
      - { name: tip_cents, type: integer, source: input, default: 0, description: "Gratuity presented with the check", constraints: ">= 0" }
      - { name: tip_eligible, type: boolean, source: computed, default: false, description: "True only when the presenting shift is tip-eligible and the check is FINALIZED" }
      - { name: tip_pct, type: number, source: computed, default: 0, description: "tip_cents / (restaurant_subtotal_cents + retail_subtotal_cents), 4dp round_half_up" }

  - name: Receipt
    parent: null
    common_fields: true
    fields:
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; store that rang the mixed ticket" }
      - { name: store_day_id, type: string, source: input, description: "FK -> StoreDay.id; business day the ticket was rung on" }
      - { name: guest_check_id, type: string, source: input, description: "FK -> GuestCheck.id; dining check the retail portion was added to; null for a retail-only ticket" }
      - { name: receipt_number, type: string, source: input, description: "POS ticket number", constraints: "unique per location_id per business_date" }
      - { name: lines, type: array, source: input, description: "Ticket lines; each element {item_id, quantity, unit_price_cents, discount_pct, line_kind}" }
      - { name: restaurant_share_cents, type: integer, source: input, default: 0, description: "Restaurant revenue carried on this shared ticket" }
      - { name: restaurant_share_basis, type: enum, source: input, default: "CHECK_TOTAL", description: "How the restaurant share was derived", constraints: "CHECK_TOTAL | ALLOCATED" }
      - { name: payment_method, type: enum, source: input, description: "Tender used for the combined ticket", constraints: "CASH | CARD | GIFT_CARD | SPLIT" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "Receipt lifecycle status", constraints: "DRAFT | RECONCILED | DISPUTED | SETTLED | CLOSED" }
      - { name: provisional_retail_cents, type: integer, source: computed, default: 0, description: "Provisional-variant retail revenue carried on this ticket" }
      - { name: recognized_retail_cents, type: integer, source: computed, default: 0, description: "Recognized retail revenue under the brand's recognition policy" }
      - { name: recognition_delta_cents, type: integer, source: computed, default: 0, description: "= recognized_retail_cents - provisional_retail_cents" }
      - { name: reconciliation_posted_at, type: datetime, source: system, description: "Timestamp the recognition posting was written to the brand period" }
      - { name: reversal_posted_at, type: datetime, source: system, description: "Timestamp a reversal posting was written; null when no reversal is outstanding" }
      - { name: reconciled_at, type: datetime, source: system, description: "Timestamp the receipt moved to RECONCILED" }
      - { name: settled_at, type: datetime, source: system, description: "Timestamp the receipt moved to SETTLED" }
      - { name: closed_at, type: datetime, source: system, description: "Timestamp the receipt moved to CLOSED" }

  - name: ClearanceSchedule
    parent: null
    common_fields: true
    fields:
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; store the clearance runs in" }
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; item being cleared" }
      - { name: start_date, type: datetime, source: input, description: "First day of the clearance window" }
      - { name: end_date, type: datetime, source: input, description: "Last day of the clearance window; must be >= start_date" }
      - { name: stage, type: enum, source: system, default: "S1", description: "Markdown stage reached inside the clearance window; the cadence advances one stage per completed 7-day week on clearance. STAGE_MARKDOWN_PCT is S1 0.25, S2 0.40, S3 0.55, S4 0.70", constraints: "S1 | S2 | S3 | S4" }
      - { name: markdown_pct, type: number, source: computed, default: 0, description: "Markdown percent implied by stage" }
      - { name: liquidation_price_cents, type: integer, source: computed, default: 0, description: "Liquidation tier price for the remaining units" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "Clearance schedule lifecycle status", constraints: "DRAFT | ACTIVE | EXTENDED | LIQUIDATED | CANCELLED" }
      - { name: remaining_units, type: integer, source: computed, default: 0, description: "Units still on clearance; snapshot of Item.on_hand_units taken when the schedule first activates and decremented only by liquidation events. Item.on_hand_units is the live source and is decremented at the liquidation transition; remaining_units is the schedule's own frozen snapshot and MUST NOT be subtracted a second time" }
      - { name: liquidated_units, type: integer, source: computed, default: 0, description: "Units moved out by liquidation" }
      - { name: liquidation_bucket_units, type: array, source: computed, default: [], description: "Per-bucket unit counts produced by the liquidation waterfall; e.g. [2, 1, 2]" }
      - { name: liquidation_blended_cents, type: integer, source: computed, default: 0, description: "Unit-weighted average liquidation price across all buckets, in cents" }
      - { name: extension_count, type: integer, source: system, default: 0, description: "Number of post-holiday extensions applied" }
      - { name: reactivation_count, type: integer, source: system, default: 0, description: "Number of times the window was reactivated from EXTENDED" }
      - { name: activated_at, type: datetime, source: system, description: "Timestamp the schedule first became ACTIVE" }

  - name: StaffShift
    parent: null
    common_fields: true
    fields:
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; store the shift is worked in" }
      - { name: employee_id, type: string, source: input, description: "Opaque payroll employee identifier" }
      - { name: start_utc, type: datetime, source: input, description: "Shift start, ISO 8601 UTC" }
      - { name: end_utc, type: datetime, source: input, description: "Shift end, ISO 8601 UTC; half-open interval end" }
      - { name: workcode, type: enum, source: input, description: "Labor pool the shift is scheduled into", constraints: "SERVER | COOK | CASHIER | RETAIL_STOCK | RETAIL_CASHIER | RETAIL_GIFT" }
      - { name: tip_eligible_claim, type: boolean, source: input, default: false, description: "Whether the employee claims a tip-eligible position" }
      - { name: tip_eligible, type: boolean, source: computed, default: false, description: "Derived tip eligibility after workcode, minutes and store-gate checks" }
      - { name: tip_eligible_minutes, type: integer, source: computed, default: 0, description: "Clocked minutes counted toward the tip-eligibility threshold" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "Shift lifecycle status", constraints: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED" }
      - { name: crossover_authorized_by_shift_id, type: string, source: system, description: "FK -> StaffShift.id; manager shift that authorized labor crossover onto this one" }
      - { name: completed_at, type: datetime, source: system, description: "Timestamp the shift was completed" }

  - name: Transfer
    parent: null
    common_fields: true
    fields:
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; receiving store" }
      - { name: store_day_id, type: string, source: input, description: "FK -> StoreDay.id; business day the transfer lands on" }
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; item being transferred" }
      - { name: declared_units, type: integer, source: input, description: "Units declared on the transfer manifest", constraints: "> 0" }
      - { name: received_units, type: integer, source: input, description: "Units physically counted at receiving", constraints: ">= 0" }
      - { name: receiving_zone, type: enum, source: input, description: "Backroom zone the goods are staged into", constraints: "BACKROOM | FOOD_STORAGE" }
      - { name: status, type: enum, source: system, default: "PLANNED", description: "Transfer lifecycle status", constraints: "PLANNED | IN_TRANSIT | RECEIVED | RECONCILED | VOID_RECEIVING" }
      - { name: variance_units, type: integer, source: computed, default: 0, description: "= received_units - declared_units, recorded at receiving" }
      - { name: variance_bps, type: integer, source: computed, default: 0, description: "Absolute variance in basis points of declared_units" }
      - { name: dispatched_at, type: datetime, source: system, description: "Timestamp the transfer left the originating DC" }
      - { name: received_at, type: datetime, source: system, description: "Timestamp the transfer was received into the backroom" }

  - name: BackroomCapacityReading
    parent: null
    common_fields: true
    fields:
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; store whose backroom was measured" }
      - { name: store_day_id, type: string, source: input, description: "FK -> StoreDay.id; business day of the measurement" }
      - { name: trigger_transfer_id, type: string, source: input, description: "FK -> Transfer.id; transfer whose receiving produced this reading; null for manual readings" }
      - { name: measured_at, type: datetime, source: input, description: "Instant the reading describes" }
      - { name: backroom_units, type: integer, source: input, default: 0, description: "Retail units physically in the narrow backroom", constraints: ">= 0" }
      - { name: food_storage_units, type: integer, source: input, default: 0, description: "Food-storage units physically in the shared space", constraints: ">= 0" }
      - { name: dated_units, type: integer, source: input, default: 0, description: "Short-dated food units that must keep their corridor", constraints: ">= 0" }
      - { name: source, type: enum, source: input, description: "What produced the reading", constraints: "RECEIVING | SALES_FLOOR_MOVE | CYCLE_COUNT" }
      - { name: occupancy_units, type: integer, source: computed, default: 0, description: "= backroom_units + food_storage_units + dated_units" }
      - { name: committed_units, type: integer, source: computed, default: 0, description: "Location.backroom_committed_units snapshot at measured_at" }
      - { name: free_units, type: integer, source: computed, default: 0, description: "= Location.backroom_capacity_units - occupancy_units - committed_units" }
      - { name: capacity_breach, type: boolean, source: computed, default: false, description: "True when free_units < Brand.food_storage_corridor_units" }

# =============================================================================
# Table 2: State Machine Table (§1.2)
# =============================================================================
state_machines:
  # --- M_SD: parallel: day_status x (traffic_state, conversion_gate) -----------
  - entity: StoreDay
    initial_state: OPEN
    terminal_states: [CLOSED]
    note: >
      Two independent state axes on one row. day_status (OPEN -> CLOSED) governs
      whether the day may still be mutated; the pair (traffic_state, conversion_gate)
      is re-derived from guest count and settlement lag on every event and governs
      which retail-side operations are permitted. The axes do not share a value set.
    transitions:
      - from: OPEN
        to: OPEN
        trigger: "POST /store-days/{id}/guest-counts — guest count below 40"
        actor: BoutiqueManager
        preconditions: [store_day.day_status == OPEN]
        side_effects:
          - "traffic_state re-derived: restaurant_guest_count >= 120 -> RUSH; >= 40 -> STEADY; otherwise QUIET"
          - "recompute StoreDay.waiting_area_conversion_index_bps (see calculations.derive_waiting_area_conversion_index)"
          - "recompute StoreDay.retail_sales_per_guest_cents and StoreDay.provisional_retail_sales_per_guest_cents"
          - "increments StoreDay.version by 1"
      - from: OPEN
        to: OPEN
        trigger: "POST /store-days/{id}/guest-counts — guest count at or above 40 and below 120"
        actor: BoutiqueManager
        preconditions:
          - "store_day.day_status == OPEN"
          - "40 <= restaurant_guest_count <= 119"
        side_effects:
          - "traffic_state -> STEADY"
          - "recompute StoreDay.waiting_area_conversion_index_bps"
          - "increments StoreDay.version by 1"
      - from: OPEN
        to: OPEN
        trigger: "POST /store-days/{id}/guest-counts — guest count at or above 120; conversion_gate -> GATED_RESTRICTED"
        actor: BoutiqueManager
        preconditions:
          - "store_day.day_status == OPEN"
          - "restaurant_guest_count >= 120"
        side_effects:
          - "traffic_state -> RUSH"
          - "conversion_gate -> GATED_RESTRICTED"
          - "recompute StoreDay.waiting_area_conversion_index_bps"
          - "increments StoreDay.version by 1"
      - from: OPEN
        to: OPEN
        trigger: "POST /store-days/{id}/guest-counts — guest count back below 40; conversion_gate -> SUSPENDED while a receipt of the day is still disputed"
        actor: BoutiqueManager
        preconditions:
          - "store_day.day_status == OPEN"
          - "restaurant_guest_count < 40"
        side_effects:
          - "traffic_state -> QUIET"
          - "conversion_gate -> SUSPENDED when at least one Receipt of this store day has status == DISPUTED; otherwise conversion_gate -> OPEN"
          - "recompute StoreDay.waiting_area_conversion_index_bps"
          - "increments StoreDay.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /store-days/{id}/close"
        actor: BoutiqueManager
        preconditions:
          - "store_day.day_status == OPEN"
          - "every Receipt with this store_day_id has status != DRAFT"
        side_effects:
          - "for every Receipt of this store day in status SETTLED: status -> CLOSED and closed_at stamped"
          - "recompute StoreDay.retail_sales_cents (aggregation over receipts in status IN {RECONCILED, SETTLED, CLOSED})"
          - "recompute StoreDay.retail_sales_per_guest_cents (final variant) and store it on the row"
          - "recompute Brand.provisional_retail_revenue_cents and Brand.recognized_retail_revenue_cents over the brand's inclusion set"
          - "recompute Brand.brand_retail_sales_per_guest_cents (guest-count-weighted roll-up over CLOSED store days)"
          - "if StoreDay.retail_sales_per_guest_cents < Brand.liquidation_trigger_rpg_cents then for every ClearanceSchedule of this location in status ACTIVE: status -> EXTENDED, extension_count += 1 and end_date += 14 days"
          - "day_status -> CLOSED; closed_at stamped from the logical clock"
          - "increments StoreDay.version by 1"
      - from: CLOSED
        to: OPEN
        trigger: "not permitted — CLOSED is terminal"
        actor: system
        preconditions: ["always false — terminal state lockdown"]
        side_effects: []

  # --- M_RCPT: linear: DRAFT -> RECONCILED -> SETTLED -> CLOSED ---------------
  - entity: Receipt
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: RECONCILED
        trigger: "POST /receipts/{id}/reconcile"
        actor: RetailLead
        preconditions:
          - "receipt.status == DRAFT"
          - "receipt.guest_check_id is null OR the referenced GuestCheck.check_status != VOIDED"
        side_effects:
          - "receipt.provisional_retail_cents computed (see calculations.provisional_retail_revenue)"
          - "receipt.recognized_retail_cents computed per Brand.retail_recognition_policy"
          - "receipt.recognition_delta_cents = recognized_retail_cents - provisional_retail_cents"
          - "if Brand.retail_recognition_policy == PROVISIONAL_THEN_FINAL then use calculations.final_retail_revenue via blended clearing price"
          - "Brand.provisional_retail_revenue_cents and Brand.recognized_retail_revenue_cents recomputed for the fiscal period"
          - "reconciliation_posted_at set; reconciled_at stamped from the logical clock"
          - "increments Receipt.version by 1"
      - from: RECONCILED
        to: DISPUTED
        trigger: "POST /receipts/{id}/dispute"
        actor: BoutiqueManager
        preconditions:
          - "receipt.status == RECONCILED"
          - "logical clock now <= receipt.reconciled_at + Brand.open_receipt_grace_hours"
        side_effects:
          - "reversal_posted_at set (makes this receipt's posting reversals eligible)"
          - "Brand.provisional_retail_revenue_cents and Brand.recognized_retail_revenue_cents recomputed — DISPUTED receipts are excluded from the inclusion set"
          - "increments Receipt.version by 1"
      - from: DISPUTED
        to: RECONCILED
        trigger: "POST /receipts/{id}/resolve"
        actor: BoutiqueManager
        preconditions:
          - "receipt.status == DISPUTED"
          - "logical clock now <= receipt.reconciled_at + Brand.open_receipt_grace_hours"
        side_effects:
          - "reversal_posted_at cleared; provisional and recognized amounts recomputed on the current line set"
          - "Brand.provisional_retail_revenue_cents and Brand.recognized_retail_revenue_cents recomputed — this receipt re-enters the inclusion set"
          - "increments Receipt.version by 1"
      - from: RECONCILED
        to: SETTLED
        trigger: "POST /receipts/{id}/settle"
        actor: RetailLead
        preconditions:
          - "receipt.status == RECONCILED"
          - "logical clock now >= receipt.reconciled_at"
        side_effects:
          - "settled_at stamped from the logical clock"
          - "StoreDay.retail_sales_cents recomputed (aggregation over this store day's receipts in status IN {RECONCILED, SETTLED, CLOSED})"
          - "increments Receipt.version by 1"
      - from: SETTLED
        to: CLOSED
        trigger: "POST /store-days/{id}/close — bubble-up when this receipt's store day closes"
        actor: system
        preconditions:
          - "receipt.status == SETTLED"
          - "receipt.guest_check_id is null OR the referenced GuestCheck.settlement_status == SETTLED"
        side_effects:
          - "closed_at stamped from the logical clock"
          - "StoreDay.retail_sales_per_guest_cents recomputed (final variant)"
          - "increments Receipt.version by 1"
      - from: SETTLED
        to: DISPUTED
        trigger: "POST /receipts/{id}/dispute — manager reversal before store-day close"
        actor: BoutiqueManager
        preconditions:
          - "receipt.status == SETTLED"
          - "the referenced StoreDay.day_status == OPEN (guest_check_id is null for retail-only tickets)"
        side_effects:
          - "reversal_posted_at set; the receipt is removed from StoreDay.retail_sales_cents aggregation"
          - "StoreDay.retail_sales_cents and StoreDay.retail_sales_per_guest_cents recomputed"
          - "StoreDay.retail_transaction_count decremented by 1 for this store day"
          - "Brand.recognized_retail_revenue_cents recomputed over the inclusion set"
          - "increments Receipt.version by 1"

  # --- M_SHIFT: branching with revert: SCHEDULED -> {IN_PROGRESS, CANCELLED} ->
  #     COMPLETED / CANCELLED ------------------------------------------------
  - entity: StaffShift
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /staff-shifts/{id}/start"
        actor: BoutiqueManager
        preconditions:
          - "shift.status == SCHEDULED"
          - "logical clock now >= shift.start_utc"
          - "the referenced StoreDay.conversion_gate != SUSPENDED"
        side_effects:
          - "shift.tip_eligible_minutes computed (see calculations.derive_tip_eligibility)"
          - "shift.tip_eligible = (shift_workcode_tip_eligible AND shift.tip_eligible_minutes >= Brand.tip_minimum_minutes AND location_day.conversion_gate == OPEN)"
          # DEPTH-3 CASCADE (R4 #1), hop 2: recomputing this shift's tip eligibility
          # itself mutates every GuestCheck this employee presented, which in turn
          # re-weights the store day's waiting-area conversion index.
          - "for every GuestCheck gc that this employee presented (recorded on the check as presented_shift_id): recompute gc.tip_eligible = min over all StaffShift rows referencing gc — a check is tip-eligible only when EVERY presenting shift is tip-eligible"
          - "recompute GuestCheck.tip_pct for each recomputed check"
          - "recompute StoreDay.waiting_area_conversion_index_bps over the presenting shifts of this store day"
          - "increments StaffShift.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /staff-shifts/{id}/cancel"
        actor: BoutiqueManager
        preconditions:
          - "shift.status == SCHEDULED"
          - "shift.tip_eligible_claim == false OR Brand.fiscal_period_status == OPEN"
        side_effects:
          - "shift.status -> CANCELLED; completed_at not stamped"
          - "for every GuestCheck whose presented_shift_id == this shift id and whose check_status == FINALIZED: recompute tip_eligible to false"
          - "recompute StoreDay.waiting_area_conversion_index_bps for this shift's store day"
          - "increments StaffShift.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /staff-shifts/{id}/complete"
        actor: BoutiqueManager
        preconditions:
          - "shift.status == IN_PROGRESS"
          - "logical clock now >= shift.start_utc"
        side_effects:
          - "shift.tip_eligible_minutes recomputed over the worked interval"
          - "shift.tip_eligible recomputed (see calculations.derive_tip_eligibility)"
          - "for every GuestCheck whose presented_shift_id == this shift id: recompute tip_eligible across all presenting shifts"
          - "StoreDay.waiting_area_conversion_index_bps recomputed for this shift's store day"
          # DEPTH-3 CASCADE (R4 #2), hop 3: closing a crossover shift whitelists a
          # further transfer, which re-measures the shared backroom and flips the
          # location's free-units posture.
          - "whitelist_location_id = shift.location_id; the location becomes eligible for the next receiving window (see calculations.liquidation_tier_price)"
          - "increments StaffShift.version by 1"
      - from: IN_PROGRESS
        to: SCHEDULED
        trigger: "POST /staff-shifts/{id}/revert-to-scheduled — corrected punch before completion"
        actor: BoutiqueManager
        preconditions:
          - "shift.status == IN_PROGRESS"
          - "logical clock now <= shift.end_utc + Brand.open_receipt_grace_hours"
        side_effects:
          - "shift.tip_eligible -> false; tip_eligible_minutes -> 0"
          - "for every GuestCheck whose presented_shift_id == this shift id and whose check_status == FINALIZED: recompute tip_eligible"
          - "increments StaffShift.version by 1"

  # --- M_TRF: cyclic with revert: PLANNED -> IN_TRANSIT -> RECEIVED ->
  #     {RECONCILED | VOID_RECEIVING}; VOID_RECEIVING -> IN_TRANSIT -----------
  - entity: Transfer
    initial_state: PLANNED
    terminal_states: [RECONCILED]
    transitions:
      - from: PLANNED
        to: IN_TRANSIT
        trigger: "POST /transfers/{id}/dispatch"
        actor: RetailLead
        preconditions:
          - "transfer.status == PLANNED"
          - "location.staging_free_units >= 1 OR transfer.declared_units <= location.backroom_capacity_units"
        side_effects:
          - "dispatched_at stamped from the logical clock"
          - "Location.backroom_committed_units += transfer.declared_units"
          - "Location.staging_free_units recomputed"
          - "StoreDay.conversion_gate -> GATED_RESTRICTED when Location.staging_free_units <= 0"
          - "increments Transfer.version by 1"
      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /transfers/{id}/receive"
        actor: RetailLead
        side_effects:
          - "transfer.received_units set from the request body; received_at stamped"
          - "transfer.variance_units = received_units - declared_units"
          - "transfer.variance_bps = round(abs(variance_units) * 10000 / declared_units)"
          - "Location.backroom_committed_units -= transfer.declared_units; Location.staging_free_units recomputed"
          - "a BackroomCapacityReading is appended for this location and store day with source RECEIVING, backroom_units = received_units and trigger_transfer_id = this transfer id"
          - "Location.backroom_occupancy_units, Location.food_storage_units and Location.staging_free_units overwritten from that reading"
          - "Item.on_hand_units += transfer.received_units when receiving_zone == BACKROOM"
          - "When the appended reading has capacity_breach == true: for every ClearanceSchedule of this location in status IN {ACTIVE, DRAFT}, advance the markdown stage by one step (S1 -> S2 -> S3 -> S4, capped at S4) and recompute markdown_pct, Item.current_markdown_pct, Item.effective_price_cents and Item.compounded_price_cents"
          - "increments Transfer.version by 1"
      - from: RECEIVED
        to: RECONCILED
        trigger: "POST /transfers/{id}/reconcile — automatic when variance_bps <= Brand.transfer_variance_tolerance_bps"
        actor: system
        side_effects:
          - "transfer.status -> RECONCILED; the transfer becomes terminal"
          - "increments Transfer.version by 1"
      - from: RECEIVED
        to: VOID_RECEIVING
        trigger: "POST /transfers/{id}/void-receiving"
        actor: BoutiqueManager
        preconditions:
          - "transfer.status == RECEIVED"
          - "transfer.variance_bps > Brand.transfer_variance_tolerance_bps"
          - "the StoreDay of this transfer has day_status == OPEN"
        side_effects:
          - "Item.on_hand_units -= transfer.received_units; Item.on_hand_units += transfer.declared_units"
          - "a compensating BackroomCapacityReading is appended with source RECEIVING, backroom_units = -received_units and trigger_transfer_id = this transfer id"
          - "Location.backroom_occupancy_units and Location.staging_free_units recomputed from the compensating reading; the conserved quantity backroom_occupancy_units + backroom_committed_units is restored to its pre-receiving value"
          - "increments Transfer.version by 1"
      - from: VOID_RECEIVING
        to: IN_TRANSIT
        trigger: "POST /transfers/{id}/redispatch — loop back after a corrected manifest"
        actor: RetailLead
        preconditions:
          - "transfer.status == VOID_RECEIVING"
          - "location.staging_free_units >= 1 OR transfer.declared_units <= location.backroom_capacity_units"
        side_effects:
          - "Location.backroom_committed_units += transfer.declared_units; Location.staging_free_units recomputed"
          - "received_units, variance_units and variance_bps reset to 0"
          - "increments Transfer.version by 1"

  # --- M_CLR: cyclic: DRAFT -> ACTIVE -> EXTENDED -> ACTIVE (no gap) |
  #     DRAFT -> CANCELLED | ACTIVE -> LIQUIDATED | EXTENDED -> LIQUIDATED -----
  - entity: ClearanceSchedule
    initial_state: DRAFT
    terminal_states: [LIQUIDATED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /clearance-schedules/{id}/activate"
        actor: BoutiqueManager
        preconditions:
          - "schedule.status == DRAFT"
          - "the logical clock is within [schedule.start_date, schedule.end_date)"
          - "location.active_clearance_count < location.clearance_max_active"
        side_effects:
          - "schedule.activated_at stamped from the logical clock"
          - "schedule.remaining_units = item.on_hand_units"
          - "schedule.stage = S1; schedule.markdown_pct = STAGES[S1]"
          - "item.current_markdown_pct = schedule.markdown_pct; item.status = CLEARANCE"
          - "item.effective_price_cents and item.compounded_price_cents recomputed via the stacked-markdown calculation"
          - "Location.active_clearance_count += 1"
          - "increments ClearanceSchedule.version by 1"
      - from: ACTIVE
        to: EXTENDED
        trigger: "POST /store-days/{id}/close — automatic when the day's retail sales per guest falls below Brand.liquidation_trigger_rpg_cents"
        actor: system
        preconditions:
          - "store_day.day_status transitioned to CLOSED"
          - "schedule.status == ACTIVE"
          - "schedule.end_date < the logical clock"
        side_effects:
          - "schedule.status -> EXTENDED; extension_count += 1"
          - "schedule.end_date += 14 days"
          - "Location.active_clearance_count unchanged (EXTENDED still occupies a slot)"
          - "increments ClearanceSchedule.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /transfers/{id}/advance — a marketing-reset event walks the clearance cadence forward"
        actor: system
        preconditions:
          - "schedule.status == ACTIVE"
          - "logical clock now - schedule.activated_at crosses at least one further whole 7-day week"
        side_effects:
          - "schedule.stage advanced by one step per crossed week, capped at S4"
          - "schedule.markdown_pct set from STAGE_MARKDOWN_PCT; Item.current_markdown_pct mirrored"
          - "Item.effective_price_cents and Item.compounded_price_cents recomputed via calculations.apply_stacked_markdown; Item.clearance_week recomputed"
          - "increments ClearanceSchedule.version by 1 and Item.version by 1"
      - from: EXTENDED
        to: EXTENDED
        trigger: "POST /transfers/{id}/advance — a marketing-reset event inside an extended window"
        actor: system
        preconditions:
          - "schedule.status == EXTENDED"
          - "logical clock now - schedule.activated_at crosses at least one further whole 7-day week"
        side_effects:
          - "schedule.stage advanced by one step per crossed week, capped at S4"
          - "Item.effective_price_cents and Item.compounded_price_cents recomputed"
          - "increments ClearanceSchedule.version by 1"
      - from: EXTENDED
        to: ACTIVE
        trigger: "POST /clearance-schedules/{id}/reactivate — a new window with no gap is rejected by the buffer rule"
        actor: BoutiqueManager
        preconditions:
          - "schedule.status == EXTENDED"
          - "schedule.reactivation_count < 2"
        side_effects:
          - "schedule.status -> ACTIVE; reactivation_count += 1"
          - "schedule.start_date = previous schedule end_date + Brand.clearance_buffer_hours; schedule.end_date = new start_date + 7 days"
          - "increments ClearanceSchedule.version by 1"
      - from: ACTIVE
        to: LIQUIDATED
        trigger: "POST /clearance-schedules/{id}/liquidate"
        actor: BoutiqueManager
        preconditions:
          - "schedule.status == ACTIVE"
          - "schedule.stage == S4"
        side_effects:
          - "schedule.liquidated_units = schedule.remaining_units; schedule.remaining_units = 0"
          - "item.on_hand_units -= schedule.liquidated_units; item.status = DISCONTINUED"
          - "item.current_markdown_pct = 0; item.effective_price_cents refunded to item.unit_retail_cents"
          - "Location.active_clearance_count -= 1"
          - "increments ClearanceSchedule.version by 1"
      - from: EXTENDED
        to: LIQUIDATED
        trigger: "POST /clearance-schedules/{id}/liquidate"
        actor: BoutiqueManager
        preconditions:
          - "schedule.status == EXTENDED"
          - "schedule.stage == S4"
        side_effects:
          - "schedule.liquidated_units = schedule.remaining_units; schedule.remaining_units = 0"
          - "item.on_hand_units -= schedule.liquidated_units; item.status = DISCONTINUED"
          - "Location.active_clearance_count -= 1"
          - "increments ClearanceSchedule.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /clearance-schedules/{id}/cancel"
        actor: BoutiqueManager
        preconditions: ["schedule.status == DRAFT"]
        side_effects:
          - "schedule.status -> CANCELLED; item.current_markdown_pct unchanged"
          - "increments ClearanceSchedule.version by 1"

  # --- M_POG: linear with terminal lockdown: DRAFT -> PUBLISHED -> SUPERSEDED
  #     -> RETIRED ------------------------------------------------------------
  - entity: PlanogramVersion
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /planogram-versions/{id}/publish"
        actor: AssortmentPlanner
        preconditions:
          - "version.status == DRAFT"
          - "version.slot_count >= 6"
          - "no existing PlanogramVersion of this location has status == PUBLISHED whose effective_date is earlier than this version's effective_date (the older effective version is superseded first)"
        side_effects:
          - "version.status -> PUBLISHED; published_at stamped from the logical clock"
          - "Location.active_planogram_version_id -> this version id"
          - "every PlanogramSlot of this version with status PLANNED -> APPLIED and applied_at stamped"
          - "increments PlanogramVersion.version by 1"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "POST /planogram-versions/{id}/publish on a competing DRAFT version — system supersede"
        actor: system
        side_effects:
          - "version.status -> SUPERSEDED; version.superseded_by_version_id = new_version_id"
          - "every PlanogramSlot of this version with status APPLIED -> FROZEN"
          - "increments PlanogramVersion.version by 1"
      - from: SUPERSEDED
        to: RETIRED
        trigger: "POST /planogram-versions/{id}/retire"
        actor: AssortmentPlanner
        preconditions:
          - "version.status == SUPERSEDED"
          - "logical clock now >= version.published_at + 30 days"
        side_effects:
          - "version.status -> RETIRED; every PlanogramSlot of this version with status FROZEN -> VACATED"
          - "increments PlanogramVersion.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# Each entry is a genuine write-write conflict resolved by OCC on a parent's
# `version`: the second strictly-sequential request observes identical state
# and would itself legitimately succeed under the natural product semantics,
# so the state field alone cannot reject it.
# =============================================================================
concurrency_rules:
  - rule_id: receipt-attach-stale-check-version
    parent_entity: GuestCheck
    write_endpoint: "POST /receipts"
    occ_field: "expected_guest_check_version"
    description: |
      Attaching a retail Receipt to a GuestCheck whose version has advanced
      since the client last read it is rejected. The combined-check ticket is
      legitimate under the product semantics whether or not another ticket was
      added first, so the state field does not by itself reject this write; the
      stale `expected_guest_check_version` does.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: slot-reshape-stale-planogram-version
    parent_entity: PlanogramVersion
    write_endpoint: "PUT /planogram-slots/{id}"
    occ_field: "expected_planogram_version_version"
    description: |
      Reshaping a PlanogramSlot (facings or slot_position) while the slot's
      PlanogramVersion has advanced since the client last read it is rejected.
      A reshape is legitimate whenever the slot is still in PLANNED, including
      after another slot in the same version was reshaped, so the version check
      — not a state field — is what rejects the stale write.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: guest-count-stale-store-day-version
    parent_entity: StoreDay
    write_endpoint: "POST /store-days/{id}/guest-counts"
    occ_field: "expected_store_day_version"
    description: |
      Posting a guest count against a StoreDay whose version has advanced since
      the client last read it is rejected. Posting guest counts is legitimate
      under the product semantics at any point while the day is OPEN, including
      immediately after another count was posted, so no state field rejects this
      second write; the stale `expected_store_day_version` does.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (§1.3)
# Rounding rule for every monetary output: integer cents, round_half_up to 0
# decimals, unless the rule states otherwise. Rounding rule for every
# percentage output: 4 decimal places, round_half_up. Any computation that
# sums per-line values MUST round each line first and then sum the rounded
# lines; the reverse order yields a different number and is never used here.
# =============================================================================
calculations:
  - name: provisional_retail_revenue
    trigger: "Fires on POST /receipts/{id}/reconcile, and as the base variant of the recognition pair"
    algorithm: aggregation
    formula: |
      gross_line_cents(i)  = item.effective_price_cents * line.quantity
      net_line_cents(i)    = gross_line_cents - round_half_up(gross_line_cents * line.discount_pct, 2)
      base = SUM(net_line_cents(i) for i in receipt.lines)
      cleared_line_cents(i) = round_half_up(net_line_cents(i) * SALE_STAGING_FACTOR, 2)
      cleared_block          = SUM(cleared_line_cents(i) for i in receipt.lines)
      provisional_retail_cents = base - round_half_up(cleared_block / 7, 2)
      # round per line first, sum the rounded lines, divide the sum last.
    input_set: "Receipt.lines with line_kind IN {RETAIL, SEASONAL_DECOR, NOSTALGIA}; lines with line_kind == GIFT_CARD are excluded from the base block entirely"
    constants:
      SALE_STAGING_FACTOR: 0.36
      PROVISIONAL_DIVISOR: 7
    precision: "integer cents, round_half_up to 0 decimals, applied per line before summing"
    variants:
      - name: base
        when: "Receipt.guest_check_id is not null — the retail portion rides on a dining check"
        difference: "the sale-staging block is removed from the base block"
      - name: retail_only_ticket
        when: "Receipt.guest_check_id is null — a standalone retail ticket"
        difference: "no sale-staging block applies; provisional_retail_cents = SUM(net_line_cents(i))"

  - name: final_retail_revenue
    trigger: "Fires on POST /store-days/{id}/close for every receipt of the day, and as the divergent second variant of the recognition pair"
    algorithm: aggregation
    formula: |
      gross_line_cents(i)  = item.effective_price_cents * line.quantity
      net_line_cents(i)    = gross_line_cents - round_half_up(gross_line_cents * line.discount_pct, 2)
      cleared_line_cents(i) = round_half_up(net_line_cents(i) * SALE_STAGING_FACTOR, 2)
      cleared_block          = SUM(cleared_line_cents(i) for i in receipt.lines)
      base_block             = SUM(net_line_cents(i) for i in receipt.lines)
      recognized_retail_cents = base_block - round_half_up(cleared_block / 3, 2)
      # divisor 3, not 7 — this divisor term is the structure §1.8's
      # dual_variant_calc instance references; the two variants return
      # different integers for byte-identical inputs.
    input_set: "Receipt lines with line_kind IN {RETAIL, SEASONAL_DECOR, NOSTALGIA}"
    constants:
      SALE_STAGING_FACTOR: 0.36
      FINAL_DIVISOR: 3
    precision: "integer cents, round_half_up to 0 decimals, applied per line before summing"
    variants:
      - name: base
        when: "Brand.retail_recognition_policy == FINAL_ONLY — provisional posting is skipped and this value is written straight to recognized_retail_cents"
        difference: "only one posting is made; recognition_delta_cents == 0"
      - name: provisional_then_final
        when: "Brand.retail_recognition_policy == PROVISIONAL_THEN_FINAL"
        difference: "provisional_retail_revenue is written at reconcile, this value overwrites recognized_retail_cents at store-day close, and recognition_delta_cents carries the difference"

  - name: combined_check_total
    trigger: "Fires on POST /guest-checks, POST /guest-checks/{id}/finalize, POST /receipts (when a retail receipt attaches to a check) and POST /receipts/{id}/dispute"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is pinned and MUST be followed literally.
      # Step 1: retail side, from the receipts attached to this check.
      retail_subtotal_cents = SUM(r.provisional_retail_cents for r in receipts_of(check)
                                  where r.status IN {DRAFT, RECONCILED, DISPUTED, SETTLED, CLOSED})
      # Step 2: provisional total that selects the fee tier.
      total_cents = check.restaurant_subtotal_cents + retail_subtotal_cents + check.tip_cents
      # Step 3: walk SERVICE_TIERS in ascending min_total_cents order and take the
      # last tier whose min_total_cents <= total_cents. The retail side is what
      # moves the check across a tier boundary.
      # Step 4: fee percent is transparent to the tip, but the total is not.
      service_fee_cents = round_half_up(
          SERVICE_TIERS[selected].pct * (check.restaurant_subtotal_cents + retail_subtotal_cents), 0)
      # Step 5: final total. Do NOT feed service_fee_cents back into the tier walk.
      total_cents = check.restaurant_subtotal_cents + retail_subtotal_cents + check.tip_cents + service_fee_cents
    input_set: "Receipts attached to the check in status IN {DRAFT, RECONCILED, DISPUTED, SETTLED, CLOSED}; GuestCheck.tip_cents is counted for tier selection but never for the basis the fee percent multiplies."
    constants:
      SERVICE_TIERS:
        - { min_total_cents: 0, pct: 0.00 }
        - { min_total_cents: 4000, pct: 0.15 }
        - { min_total_cents: 8000, pct: 0.18 }
        - { min_total_cents: 12000, pct: 0.20 }
    precision: "integer cents, round_half_up to 0 decimals"
    variants:
      - name: base
        when: "GuestCheck.check_status == PENDING — the check is still open and receivables recompute on every attach"
        difference: "retail_subtotal_cents reflects only RECONCILED receipts; DISPUTED receipts are removed on dispute"
      - name: restaurant_share_allocated
        when: "Receipt.restaurant_share_basis == ALLOCATED — the restaurant share is derived inside one ticket"
        difference: "restaurant_share_cents = round_half_up(total_cents * restaurant_subtotal_cents / (restaurant_subtotal_cents + retail_subtotal_cents), 0); the retail share is total_cents - restaurant_share_cents"

  - name: compute_service_fee
    trigger: "Fires whenever combined_check_total recomputes its Step 2 tier selection"
    algorithm: tiered_pricing
    formula: |
      # Marginal, not average: each tier's percent applies only to the band of
      # the basis that falls inside that tier.
      basis = check.restaurant_subtotal_cents + retail_subtotal_cents
      bands = [[0, 4000), [4000, 8000), [8000, 12000), [12000, infinity)]
      fee = 0
      for index, band in enumerate(bands):
          lower = band[0]
          upper = band[1]
          portion = max(0, min(basis, upper) - lower)
          if portion <= 0 and index > 0:
              break
          fee += round_half_up(portion * SERVICE_TIERS[index].pct, 0)
      service_fee_cents = fee
    input_set: "restaurant_subtotal_cents and retail_subtotal_cents of the check; tip_cents is excluded from the basis"
    constants:
      BAND_LOW: 4000
      BAND_MID: 8000
      BAND_HIGH: 12000
      BAND_PCTS: [0.00, 0.15, 0.18, 0.20]
    precision: "integer cents, round_half_up to 0 decimals, applied to each band before summing"
    variants:
      - name: base
        when: "combined_check_total Step 3 tier selection"
        difference: "tier bounds are inclusive at the lower edge and exclusive at the upper edge"

  - name: retail_sales_per_guest
    trigger: "Fires on POST /store-days/{id}/close (final variant) and on POST /store-days/{id}/guest-counts (provisional variant)"
    algorithm: weighted_scoring
    formula: |
      # final variant — the guest count as of the close request
      if store_day.restaurant_guest_count == 0:
          retail_sales_per_guest_cents = 0        # empty set pins to 0, NOT to a divide-by-zero
      else:
          retail_sales_per_guest_cents = round_half_up(
              store_day.retail_sales_cents / store_day.restaurant_guest_count, 0)
      # provisional variant — same numerator, waiting-area denominator
      if store_day.waiting_area_shopper_count == 0:
          provisional_retail_sales_per_guest_cents = 0
      else:
          provisional_retail_sales_per_guest_cents = round_half_up(
              store_day.retail_sales_cents / store_day.waiting_area_shopper_count, 0)
    input_set: "StoreDay.restaurant_guest_count, StoreDay.retail_sales_cents (receipts in status IN {DRAFT, RECONCILED, SETTLED, CLOSED}), StoreDay.waiting_area_shopper_count"
    constants:
      EMPTY_SET_VALUE: 0
      SCALE: 1
    precision: "integer cents, round_half_up to 0 decimals"
    variants:
      - name: final
        when: "StoreDay.day_status transitioned to CLOSED; the single guest count of the closed day is used"
        difference: "numerator is the final restaurant_guest_count and the denominator is the day's retail_sales_cents"
      - name: provisional
        when: "StoreDay.day_status == OPEN and the retail lead asks for a running figure"
        difference: "the denominator swaps to the number of guests who entered the waiting area, which is a different population from restaurant_guest_count"

  - name: derive_waiting_area_conversion_index
    trigger: "Fires on POST /store-days/{id}/guest-counts, POST /guest-checks/{id}/finalize, POST /staff-shifts/{id}/complete and POST /staff-shifts/{id}/cancel"
    algorithm: weighted_scoring
    formula: |
      # raw conversion rate, in basis points of waiting-area shoppers
      raw_bps = round_half_up(store_day.waiting_area_converted_count * 10000
                              / (store_day.waiting_area_shopper_count + 1), 0)
      # dilutive decay: every retail transaction the day has already recorded
      # drags the rate down by 10 percent of the raw rate, capped at 50 percent.
      decay_pct = min(store_day.retail_transaction_count * 0.10, 0.50)
      conversion_bps = round_half_up(raw_bps * (1 - decay_pct), 0)
      w = brand.waiting_area_retail_weight_bps
      tip_share_bps = 0 if store_day.retail_sales_cents == 0 else round_half_up(
          tips_earned_cents * 10000 / store_day.retail_sales_cents, 0)
      conversion_index_bps = round_half_up(
          (w * conversion_bps + (10000 - w) * tip_share_bps) / 10000, 0)
    input_set: "StoreDay waiting-area counters, StoreDay.retail_sales_cents and StoreDay.retail_transaction_count; tips_earned_cents = SUM(GuestCheck.tip_cents over checks of this store day whose tip_eligible == true AND check_status == FINALIZED)"
    constants:
      EMPTY_SET_VALUE: 0
      WEIGHT_TOTAL_BPS: 10000
      DECAY_PER_TRANSACTION: 0.10
      DECAY_CAP: 0.50
    precision: "integer basis points, round_half_up to 0 decimals"
    variants:
      - name: base
        when: "Brand.waiting_area_retail_weight_bps is at its default 6000"
        difference: "the conversion rate carries 60 percent of the index weight"

  - name: derive_tip_eligibility
    trigger: "Fires on POST /staff-shifts/{id}/start, POST /staff-shifts/{id}/complete and POST /staff-shifts/{id}/revert-to-scheduled"
    algorithm: threshold
    formula: |
      WORKCODE_TIP_ELIGIBLE = shift.workcode IN {SERVER, CASHIER}
      # Shift length ROUNDS UP to whole hours before conversion — a shift of
      # 3:05 counts as 4 hours, i.e. 240 minutes, and therefore does cross
      # the threshold. Flooring first loses exactly the boundary cases.
      shift_minutes = ceil((shift.end_utc - shift.start_utc) / 3600) * 60
      shift.tip_eligible_minutes = shift_minutes
      shift.tip_eligible = (WORKCODE_TIP_ELIGIBLE
                            AND shift_minutes >= brand.tip_minimum_minutes
                            AND location_day.conversion_gate == OPEN)
    input_set: "StaffShift.workcode, StaffShift.start_utc, StaffShift.end_utc, Brand.tip_minimum_minutes, the referenced StoreDay.conversion_gate"
    constants:
      WORKCODE_MINUTES_PER_HOUR: 60
      DEFAULT_MINIMUM_MINUTES: 240
    precision: "integer minutes, no rounding after the ceiling"
    variants:
      - name: base
        when: "Brand.tip_minimum_minutes at its default 240"
        difference: "a 4-hour shift meets the bar exactly; a 3-hour-59-minute shift that rounds up to 4 hours also meets it"
      - name: less_than_one_hour
        when: "ceil(shift length in hours) == 0"
        difference: "shift_minutes is 0; tip_eligible is false regardless of workcode"

  - name: liquidation_tier_price
    trigger: "Fires on POST /clearance-schedules (activation recompute) and on POST /clearance-schedules/{id}/liquidate"
    algorithm: waterfall_allocation
    formula: |
      # Liquidation splits the remaining units across price buckets in
      # ascending bucket order. Each bucket is priced at its own discount rate
      # against MIN(item.unit_cost_cents, item.unit_retail_cents); units that
      # do not fill a bucket spill into the next bucket down.
      total_units = schedule.remaining_units
      unit_value  = min(item.unit_cost_cents, item.unit_retail_cents)
      tiers   = [[0.40, 0.90], [0.30, 0.70], [0.30, 0.55]]   # [share_of_units, rate]
      buckets = []
      spill   = total_units
      for share, rate in tiers:
          take = min(spill, floor(total_units * share))
          take = min(take, spill)
          if take > 0:
              buckets.append({ "units": take, "rate": rate,
                               "price_cents": round_half_up(unit_value * rate, 0) })
          spill -= take
      if spill > 0:
          buckets.append({ "units": spill, "rate": tiers[-1][1],
                           "price_cents": round_half_up(unit_value * tiers[-1][1], 0) })
      liquidation_price_cents = buckets[0].price_cents
      liquidation_blended_cents = round_half_up(
          SUM(b.units * b.price_cents for b in buckets) / total_units, 0)
      liquidation_bucket_units = [b.units for b in buckets]
    input_set: "ClearanceSchedule.remaining_units, Item.unit_cost_cents, Item.unit_retail_cents"
    constants:
      TIER_SHARES: [0.40, 0.30, 0.30]
      TIER_RATES: [0.90, 0.70, 0.55]
    precision: "integer cents, round_half_up to 0 decimals, applied per bucket before the blended average"
    variants:
      - name: base
        when: "remaining_units >= 5"
        difference: "three buckets are used and liquidation_bucket_units has three elements"
      - name: two_bucket
        when: "remaining_units == 3 or remaining_units == 4"
        difference: "floor(3*0.40)=1, floor(3*0.30)=0, so the third tier is skipped and liquidation_bucket_units == [1, 2]"

  - name: apply_stacked_markdown
    trigger: "Fires on POST /clearance-schedules/{id}/activate, POST /transfers/{id}/receive when the backroom reading breaches capacity, POST /clearance-schedules/{id}/reactivate and POST /clearance-schedules/{id}/liquidate"
    algorithm: tiered_pricing
    formula: |
      # Variant A — effective (highest-of) stacking. Re-applying a stage's
      # markdown to an already-marked item never moves the price upward.
      gross_A = item.unit_retail_cents
      for other in active_overlapping_schedules where other.item_id == item.id:
          gross_A = round_half_up(gross_A * (1 - other.markdown_pct), 0)
      effective_price_cents = round_half_up(gross_A * WEEK_FACTORS[item.clearance_week], 0)
      # Variant B — compounded chain. Each stage multiplies the previous result.
      compounded_price_cents = item.unit_retail_cents
      for other in active_overlapping_schedules ordered by other.activated_at ASC, other.created_at ASC:
          compounded_price_cents = round_half_up(compounded_price_cents * (1 - other.markdown_pct), 0)
    input_set: "ClearanceSchedule rows for the item in status IN {ACTIVE, EXTENDED}; their markdown_pct values; Item.unit_retail_cents"
    constants:
      WEEK_FACTORS: [1.00, 0.95, 0.88, 0.78, 0.70]
      DEFAULT_WEEK_FACTOR: 0.70
    precision: "integer cents, round_half_up to 0 decimals after every stage"
    variants:
      - name: highest_of
        when: "the item carries a single ACTIVE schedule — the ordinary seasonal-decor case"
        difference: "effective_price_cents is a function of the highest single markdown, so 50 percent applied twice yields 0.50 * retail"
      - name: compounded
        when: "the item carries two overlapping clearance schedules at once — a seasonal-decor window and a nostalgia-assortment window with intersecting date ranges"
        difference: "compounded_price_cents applies both stages in activation order, so 50 percent applied twice yields 0.25 * retail; the difference delta_cents = floor(effective_price_cents - compounded_price_cents) is reported on the clearance read"

  - name: project_import_need
    trigger: "Fires on POST /items/{id}/order-deadline-check and on GET /items/{id}/import-plan"
    algorithm: forward_looking
    formula: |
      # order_deadline_reached is re-derived on every call from the logical
      # clock's week number, not stored from creation time:
      #   order_deadline_reached = ((SEASON_START[theme] - current_iso_week) * 7)
      #                            < item.import_lead_time_days
      order_now_threshold_units = ceil(WEEKS_DEMAND_HORIZON * WEEK_DEMAND_CENTS
                                       / item.unit_retail_cents) + item.on_hand_units
      unit_margin_cents  = item.unit_retail_cents - item.unit_cost_cents
      margin_floor_cents = round_half_up(item.unit_cost_cents * (1 + MARGIN_FLOOR_PCT), 0)
      live_need = order_now_threshold_units
      if (item.order_deadline_reached AND unit_margin_cents < margin_floor_cents):
          # the season window can no longer be reached by a fresh import AND the
          # unit margin cannot clear the floor: nothing is ordered. The branch is
          # a conjunction — a dead margin alone does NOT zero the need.
          live_need = 0
      projected_import_need_units = live_need
    input_set: "Item fields plus the brand's planning demand constant; items with status IN {ACTIVE, CLEARANCE} only — DISCONTINUED items are excluded"
    constants:
      WEEKS_DEMAND_HORIZON: 4
      WEEK_DEMAND_CENTS: 300000
      SEASON_START: { HARVEST: 38, WINTER_HOLIDAY: 40, SPRING: 10, SUMMER: 26, NOSTALGIA_CLASSIC: 1 }
      MARGIN_FLOOR_PCT: 0.30
    precision: "integer units, ceil; the margin floor is floor-rounded to whole cents"
    variants:
      - name: base
        when: "item.import_lead_time_days fits before the season window opens"
        difference: "projected_import_need_units carries the four-week order-up-to quantity"
      - name: discontinued_or_dead_margin
        when: "item.status == DISCONTINUED, or item.order_deadline_reached AND unit_margin_cents < margin_floor_cents"
        difference: "the item is excluded from input_set entirely and the calculation returns 0"

  - name: regionally_adjusted_slot_count
    trigger: "Fires on POST /planogram-versions/{id}/publish"
    algorithm: projection
    formula: |
      target_slots = item.region_target_slots_for(planogram.location.region_code)
      multiplier   = PROFILE_MULTIPLIER[planogram.location.assortment_tier]
      drift        = (multiplier - 1.00) * 100000
      if drift > 15000:
          target_slots += REGIONAL_TWEAK_BONUS
      elif drift < -15000:
          target_slots -= REGIONAL_TWEAK_BONUS
      regionally_adjusted_slot_count = target_slots
    input_set: "PlanogramVersion.location_id -> Location.region_code and Location.assortment_tier; Location.local_event_codes adds one slot per code present"
    constants:
      PROFILE_MULTIPLIER: { FULL: 1.00, REGIONAL_TWEAK: 1.25, MINIMAL: 0.55 }
      DRIFT_BPS_GATE: 15000
      REGIONAL_TWEAK_BONUS: 4
      LOCAL_EVENT_BONUS: 1
    precision: "integer slots, no rounding"
    variants:
      - name: base
        when: "assortment_tier == FULL"
        difference: "multiplier is 1.00 and drift is 0, so the tweak bonus never applies"
      - name: minimal_brush
        when: "assortment_tier == MINIMAL"
        difference: "the item leaves the required core set for the SKU and is only carried when the location's local_event_codes is non-empty"

# =============================================================================
# Table 4: Validation Rules Table (§1.4) — ordered by priority
# Priority is a total order and every endpoint evaluates it literally. When a
# request violates two rules, the lowest `priority` value wins. The two pairs
# below are deliberately adjacent so that the winner is decided by the numeric
# ordering alone, and each pair shares at least one endpoint so the conflict is
# observable:
#   pair (A)  POST /transfers/{id}/receive — priority 7 state (ERR_INVALID_STATE)
#             vs priority 8 business_safety (ERR_STORE_DAY_GATE_SUSPENDED)
#   pair (B)  POST /receipts            — priority 8 business_safety
#             (ERR_STORE_DAY_GATE_SUSPENDED) vs priority 9 existence
#             (ERR_ITEM_NOT_FOUND)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present on the request and the role is a declared §1.7 role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The declared role is permitted for this operation per the endpoint's roles list and the §1.7 matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "The resource named in each path segment is resolved left to right and exists: a Brand segment reports ERR_BRAND_NOT_FOUND, a Location segment ERR_LOCATION_NOT_FOUND, a StoreDay segment ERR_STORE_DAY_NOT_FOUND, an Item segment ERR_ITEM_NOT_FOUND, a GuestCheck segment ERR_CHECK_NOT_FOUND, a Receipt segment ERR_RECEIPT_NOT_FOUND, a Transfer segment ERR_TRANSFER_NOT_FOUND, a StaffShift segment ERR_SHIFT_NOT_FOUND, a ClearanceSchedule segment ERR_CLEARANCE_NOT_FOUND, and a PlanogramVersion or PlanogramSlot segment ERR_PLANOGRAM_NOT_FOUND. A read that matches no resource at all and carries no typed path segment reports ERR_NOT_FOUND."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints whose path carries a resource id"

  - priority: 4
    category: business_constraint
    check: "The (Location, business_date) pair is unique — a store day cannot be opened twice"
    error_id: ERR_STORE_DAY_DUPLICATE
    http_status: 409
    applies_to: ["POST /store-days"]

  - priority: 5
    category: business_fiscal
    check: "The target business date's fiscal period referenced by Brand.fiscal_period has fiscal_period_status == OPEN"
    error_id: ERR_FISCAL_PERIOD_CLOSED
    http_status: 422
    applies_to: ["POST /receipts/{id}/reconcile", "POST /store-days/{id}/close"]

  - priority: 6
    category: business_safety
    check: "A Transfer whose receiving_zone == FOOD_STORAGE is rejected when it carries item lines in ANY category — food storage is never used for retail merchandise"
    error_id: ERR_FOOD_STORAGE_ZONE_FORBIDDEN
    http_status: 409
    applies_to: ["POST /transfers", "POST /transfers/{id}/receive"]

  - priority: 7
    category: state
    check: "The target resource is in a state from which the requested operation is defined (state-machine `from:` match); the operation's StoreDay.conversion_gate precondition is checked at priority 8, not here"
    note: "A StoreDay-scoped mutation against a day whose day_status is CLOSED reports ERR_STORE_DAY_CLOSED from this row, and a location posture that blocks the write reports ERR_POSTURE_LOCKOUT."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 8
    category: business_safety
    check: "The StoreDay's conversion_gate is not SUSPENDED — a SUSPENDED gate refuses every retail-side write named here"
    error_id: ERR_STORE_DAY_GATE_SUSPENDED
    http_status: 409
    applies_to: ["POST /receipts", "POST /transfers/{id}/receive", "POST /transfers/{id}/dispatch"]

  - priority: 9
    category: existence
    check: "Every Item id referenced by the request exists"
    note: "A request that references an unallocated planogram_version_id reports ERR_PLANOGRAM_NOT_FOUND from the same left-to-right resolution."
    error_id: ERR_ITEM_NOT_FOUND
    http_status: 404
    applies_to: ["POST /receipts", "POST /clearance-schedules", "POST /transfers", "POST /planogram-slots"]

  - priority: 10
    category: business_constraint
    check: "Receipt.receipt_number is unique within (location_id, business_date) of the referenced StoreDay"
    error_id: ERR_RECEIPT_DUPLICATE
    http_status: 409
    applies_to: ["POST /receipts"]

  - priority: 11
    category: business_constraint
    check: "A Receipt line with line_kind == GIFT_CARD is present at most once per receipt and only when payment_method == GIFT_CARD"
    note: "A Receipt attaches only to a GuestCheck whose check_status is PENDING; a FINALIZED or VOIDED host check refuses the attach with ERR_CHECK_ALREADY_FINALIZED instead."
    error_id: ERR_GIFT_CARD_LINE_MISMATCH
    http_status: 422
    applies_to: ["POST /receipts"]

  - priority: 12
    category: business_referential
    check: "A Receipt attaches only to a GuestCheck whose store_day_id equals the receipt's own store_day_id"
    error_id: ERR_CHECK_STORE_DAY_MISMATCH
    http_status: 422
    applies_to: ["POST /receipts", "PUT /receipts/{id}"]

  - priority: 13
    category: business_temporal
    check: "The ClearanceSchedule window [start_date, end_date) is separated from every other non-CANCELLED ClearanceSchedule window on the same (location_id, item_id) pair by at least Brand.clearance_buffer_hours; a zero-length gap is a rejection"
    error_id: ERR_CLEARANCE_WINDOW_OVERLAP
    http_status: 409
    applies_to: ["POST /clearance-schedules", "POST /clearance-schedules/{id}/reactivate"]

  - priority: 14
    category: business_constraint
    check: "Location.active_clearance_count < Location.clearance_max_active"
    error_id: ERR_CLEARANCE_SLOT_LIMIT
    http_status: 409
    applies_to: ["POST /clearance-schedules/{id}/activate"]

  - priority: 15
    category: state
    check: "ClearanceSchedule.stage == S4 at liquidation and Item.status == CLEARANCE at liquidation"
    error_id: ERR_CLEARANCE_NOT_FINAL
    http_status: 409
    applies_to: ["POST /clearance-schedules/{id}/liquidate"]

  - priority: 16
    category: business_fiscal
    check: "The combined Receipt would push GuestCheck.total_cents above Brand.max_check_total_cents"
    error_id: ERR_CHECK_TOTAL_EXCEEDED
    http_status: 422
    applies_to: ["POST /receipts", "PUT /receipts/{id}"]

  - priority: 17
    category: business_constraint
    check: "Location.staging_free_units >= 0 after the projected write — receiving beyond the shared backroom's free units is rejected"
    error_id: ERR_BACKROOM_OVER_CAPACITY
    http_status: 409
    applies_to: ["POST /transfers/{id}/receive"]

  - priority: 18
    category: business_safety
    check: "A StaffShift whose tip_eligible_claim == true has workcode IN {SERVER, CASHIER}; front-of-house retail workcodes are not tip-eligible positions"
    error_id: ERR_TIP_INELIGIBLE_WORKCODE
    http_status: 422
    applies_to: ["POST /staff-shifts", "POST /staff-shifts/{id}/start"]

  - priority: 19
    category: business_safety
    check: "The (location_id, employee_id) pair has no overlapping shift interval; intervals are half-open [start_utc, end_utc), so a back-to-back pair touching at a single instant is permitted and any overlap of one minute or more is rejected"
    error_id: ERR_SHIFT_OVERLAP
    http_status: 409
    applies_to: ["POST /staff-shifts"]

  - priority: 20
    category: business_safety
    check: "A StaffShift may not span both the restaurant labor pool (workcode IN {SERVER, CASHIER}) and the retail labor pool (workcode IN {RETAIL_STOCK, RETAIL_CASHIER, RETAIL_GIFT}) unless it carries an authorizing StaffShift reference from a manager shift in progress"
    error_id: ERR_CROSSOVER_NOT_AUTHORIZED
    http_status: 403
    applies_to: ["POST /staff-shifts"]

  - priority: 21
    category: business_constraint
    check: "PlanogramSlot.slot_position is unique within its planogram_version_id and the item's theme_code is carried by the location's assortment_tier on a REGIONAL_TWEAK or MINIMAL store"
    error_id: ERR_PLANOGRAM_SLOT_CONFLICT
    http_status: 409
    applies_to: ["POST /planogram-slots", "PUT /planogram-slots/{id}"]

  - priority: 22
    category: business_constraint
    check: "A PlanogramVersion may be published only when its slot_count >= 6 and no competing DRAFT version of the same location carries an earlier effective_date"
    error_id: ERR_PLANOGRAM_VERSION_CONFLICT
    http_status: 409
    applies_to: ["POST /planogram-versions/{id}/publish"]

  - priority: 23
    category: business_constraint
    check: "A PlanogramSlot may reference an item whose theme_code is in the carrying set for the location's assortment_tier: FULL carries every theme, REGIONAL_TWEAK carries the region's core themes plus Location.local_event_codes, and MINIMAL carries exactly Location.local_event_codes and nothing else"
    error_id: ERR_NO_REGIONAL_ASSORTMENT
    http_status: 403
    applies_to: ["POST /planogram-slots"]

  - priority: 24
    category: business_safety
    check: "The StoreDay's conversion_gate is not GATED_RESTRICTED for a receiving operation — a restricted gate still admits sales-floor writes but refuses new backroom load. This is the companion of the priority-8 row and is evaluated after it, so a SUSPENDED gate reports ERR_STORE_DAY_GATE_SUSPENDED rather than this id."
    error_id: ERR_STORE_DAY_GATE_RESTRICTED
    http_status: 409
    applies_to: ["POST /transfers/{id}/receive"]

  - priority: 25
    category: business_constraint
    check: "ClearanceSchedule.reactivation_count has not already reached 2 — a window may be reopened from EXTENDED at most twice"
    error_id: ERR_CLEARANCE_WINDOW_REACTIVATION_LIMIT
    http_status: 409
    applies_to: ["POST /clearance-schedules/{id}/reactivate"]

  - priority: 26
    category: business_safety
    check: "A shift that asserts tip eligibility may not be shorter than Brand.tip_minimum_minutes: a 90-minute claim cannot reach the bar and is refused with this id rather than silently recorded as ineligible"
    error_id: ERR_TIP_SHIFT_TOO_SHORT
    http_status: 422
    applies_to: ["POST /staff-shifts"]

  - priority: 27
    category: business_fiscal
    check: "A receiving may be reconciled only when Transfer.variance_bps is at or below Brand.transfer_variance_tolerance_bps; a larger shortfall stays un-reconciled until it is voided or re-dispatched"
    error_id: ERR_TRANSFER_VARIANCE_EXCEEDED
    http_status: 422
    applies_to: ["POST /transfers/{id}/reconcile"]

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table (§1.5)
# Flat topology: no nested parent/child routing. Every collection endpoint
# accepts its parent key as a query/body field; every FK has a reverse-
# reachability GET in filtered-list form.
# =============================================================================
endpoints:
  # --- Clock (test-driving) -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint. Sets the server's logical clock. The startup default is 2026-09-01T00:00:00Z — before any call to this endpoint the logical clock reads exactly that instant and never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: "datetime" }
    side_effects: ["logical clock advanced or set to to_iso8601"]

  # --- Brand ----------------------------------------------------------------
  - method: POST
    path: "/retail-ops/brands"
    description: "Create a Brand (chain) configuration"
    roles: [PlatformAdmin]
    code: 201
    input:
      - brand_code
      - legal_name
      - retail_recognition_policy?
      - liquidation_trigger_rpg_cents?
      - open_receipt_grace_hours?
      - transfer_variance_tolerance_bps?
      - waiting_area_retail_weight_bps?
      - tip_minimum_minutes?
      - clearance_buffer_hours?
      - food_storage_corridor_units?
      - max_check_total_cents?
      - fiscal_period
    output: Brand
    side_effects: ["fiscal_period_status=OPEN; provisional_retail_revenue_cents=0; recognized_retail_revenue_cents=0; brand_retail_sales_per_guest_cents=0"]

  - method: GET
    path: "/retail-ops/brands"
    description: "List brands"
    roles: [PlatformAdmin, AssortmentPlanner, BoutiqueManager, RetailLead]
    code: 200
    input:
      - brand_code?
    output: Brand[]
    side_effects: []

  - method: GET
    path: "/retail-ops/brands/{brandId}"
    description: "Get a Brand"
    roles: [PlatformAdmin, AssortmentPlanner, BoutiqueManager, RetailLead]
    code: 200
    input: []
    output: Brand
    side_effects: []

  - method: PUT
    path: "/retail-ops/brands/{brandId}"
    description: "Update Brand configuration, including opening or closing the fiscal period"
    roles: [PlatformAdmin]
    code: 200
    input:
      - retail_recognition_policy?
      - liquidation_trigger_rpg_cents?
      - open_receipt_grace_hours?
      - transfer_variance_tolerance_bps?
      - waiting_area_retail_weight_bps?
      - tip_minimum_minutes?
      - clearance_buffer_hours?
      - food_storage_corridor_units?
      - max_check_total_cents?
      - fiscal_period?
      - fiscal_period_status?
    output: Brand
    side_effects: ["increments Brand.version by 1"]

  # --- Location -------------------------------------------------------------
  - method: POST
    path: "/retail-ops/locations"
    description: "Create a Location"
    roles: [PlatformAdmin]
    code: 201
    input:
      - brand_id
      - store_number
      - region_code
      - assortment_tier
      - backroom_capacity_units
      - clearance_max_active?
      - local_event_codes?
    output: Location
    side_effects: ["backroom_occupancy_units=0; backroom_committed_units=0; food_storage_units=0; staging_free_units=backroom_capacity_units - Brand.food_storage_corridor_units; active_clearance_count=0"]

  - method: GET
    path: "/retail-ops/locations"
    description: "List locations, optionally filtered by brand"
    roles: [PlatformAdmin, AssortmentPlanner, BoutiqueManager, RetailLead]
    code: 200
    input:
      - brand_id?
      - region_code?
      - assortment_tier?
    output: Location[]
    side_effects: []

  - method: GET
    path: "/retail-ops/locations/{locationId}"
    description: "Get a Location"
    roles: [PlatformAdmin, AssortmentPlanner, BoutiqueManager, RetailLead]
    code: 200
    input: []
    output: Location
    side_effects: []

  - method: POST
    path: "/retail-ops/locations/{id}/capacity-readings"
    description: "Record a manual BackroomCapacityReading (cycle count or sales-floor move) and re-derive the location's posture"
    roles: [BoutiqueManager]
    code: 201
    input: [store_day_id, measured_at, backroom_units, food_storage_units, dated_units, source]
    output: BackroomCapacityReading
    side_effects:
      - "occupancy_units = backroom_units + food_storage_units + dated_units"
      - "committed_units = Location.backroom_committed_units; free_units = Location.backroom_capacity_units - occupancy_units - committed_units"
      - "capacity_breach = (free_units < Brand.food_storage_corridor_units)"
      - "Location.backroom_occupancy_units, Location.food_storage_units and Location.staging_free_units overwritten from this reading"
      - "when capacity_breach == true: advance the markdown stage of every ClearanceSchedule of this location in status IN {ACTIVE, DRAFT} by one step and recompute Item.effective_price_cents / Item.compounded_price_cents"
      - "increments Location.version by 1"

  - method: GET
    path: "/retail-ops/locations/{id}/capacity-readings"
    description: "Reverse-reachability GET for BackroomCapacityReading.location_id — list readings for a location"
    roles: [PlatformAdmin, BoutiqueManager, RetailLead]
    code: 200
    input:
      - store_day_id?
      - trigger_transfer_id?
      - limit?
      - offset?
    output: BackroomCapacityReading[]
    side_effects: []

  - method: GET
    path: "/retail-ops/store-days/{id}/capacity-readings"
    description: "Reverse-reachability GET for BackroomCapacityReading.store_day_id — list backroom readings appended on this business day"
    roles: [PlatformAdmin, BoutiqueManager, RetailLead]
    code: 200
    input:
      - limit?
      - offset?
    output: BackroomCapacityReading[]
    side_effects: []

  - method: GET
    path: "/retail-ops/transfers/{id}/capacity-readings"
    description: "Reverse-reachability GET for BackroomCapacityReading.trigger_transfer_id — list the readings this transfer appended or compensated"
    roles: [PlatformAdmin, BoutiqueManager, RetailLead]
    code: 200
    input:
      - limit?
      - offset?
    output: BackroomCapacityReading[]
    side_effects: []

  # --- StoreDay -------------------------------------------------------------
  - method: POST
    path: "/retail-ops/store-days"
    description: "Open a StoreDay"
    roles: [BoutiqueManager]
    code: 201
    input: [location_id, business_date]
    output: StoreDay
    side_effects: ["day_status=OPEN; traffic_state=QUIET; conversion_gate=OPEN; all counters zeroed"]

  - method: GET
    path: "/retail-ops/store-days"
    description: "List store days, filtered by location, status, date range or gate"
    roles: [PlatformAdmin, AssortmentPlanner, BoutiqueManager, RetailLead]
    code: 200
    input:
      - location_id?
      - day_status?
      - conversion_gate?
      - business_date_from?
      - business_date_to?
      - limit?
      - offset?
    output: StoreDay[]
    side_effects: []

  - method: GET
    path: "/retail-ops/store-days/{id}"
    description: "Get a StoreDay"
    roles: [PlatformAdmin, AssortmentPlanner, BoutiqueManager, RetailLead]
    code: 200
    input: []
    output: StoreDay
    side_effects: []

  - method: POST
    path: "/retail-ops/store-days/{id}/guest-counts"
    description: "Post restaurant guest counts and waiting-area counters for the day; re-derives the traffic dimension and the conversion index"
    roles: [BoutiqueManager, RetailLead]
    code: 200
    input: [expected_store_day_version, restaurant_guest_count, restaurant_sales_cents, waiting_area_shopper_count, waiting_area_converted_count]
    output: StoreDay
    side_effects:
      - "traffic_state and conversion_gate re-derived per the StoreDay state machine"
      - "StoreDay.retail_sales_cents and StoreDay.retail_sales_per_guest_cents recomputed"
      - "StoreDay.provisional_retail_sales_per_guest_cents recomputed"
      - "StoreDay.waiting_area_conversion_index_bps recomputed"
      - "increments StoreDay.version by 1"

  - method: POST
    path: "/retail-ops/store-days/{id}/close"
    description: "Close the business day: bubble settled receipts to CLOSED, recompute revenue, and run the post-holiday clearance extension"
    roles: [BoutiqueManager]
    code: 200
    input: [expected_store_day_version]
    output: StoreDay
    side_effects:
      - "every Receipt of this store day in status SETTLED -> CLOSED with closed_at stamped"
      - "StoreDay.retail_sales_cents, StoreDay.retail_sales_per_guest_cents and StoreDay.provisional_retail_sales_per_guest_cents recomputed"
      - "Brand.provisional_retail_revenue_cents and Brand.recognized_retail_revenue_cents recomputed"
      - "Brand.brand_retail_sales_per_guest_cents recomputed"
      - "every ClearanceSchedule of this location in status ACTIVE extends to EXTENDED when the day's retail sales per guest falls below Brand.liquidation_trigger_rpg_cents"
      - "day_status -> CLOSED; closed_at stamped from the logical clock"
      - "increments StoreDay.version by 1"

  # --- Item -----------------------------------------------------------------
  - method: POST
    path: "/retail-ops/items"
    description: "Create an Item in the retail assortment"
    roles: [AssortmentPlanner]
    code: 201
    input:
      - sku
      - name
      - theme_code
      - nostalgia_flag?
      - unit_retail_cents
      - unit_cost_cents
      - import_lead_time_days
    output: Item
    side_effects: ["status=ACTIVE; current_markdown_pct=0; effective_price_cents=unit_retail_cents; compounded_price_cents=unit_retail_cents; on_hand_units=0"]

  - method: GET
    path: "/retail-ops/items"
    description: "List items, filtered by theme, status or region target"
    roles: [PlatformAdmin, AssortmentPlanner, BoutiqueManager, RetailLead]
    code: 200
    input:
      - theme_code?
      - status?
      - nostalgia_flag?
      - limit?
      - offset?
    output: Item[]
    side_effects: []

  - method: GET
    path: "/retail-ops/items/{id}"
    description: "Get an Item"
    roles: [PlatformAdmin, AssortmentPlanner, BoutiqueManager, RetailLead]
    code: 200
    input: []
    output: Item
    side_effects: []

  - method: POST
    path: "/retail-ops/items/{id}/order-deadline-check"
    description: "Re-evaluate whether a fresh import can still reach the theme's season window before it opens"
    roles: [AssortmentPlanner, RetailLead]
    code: 200
    input: []
    output: Item
    side_effects: ["Item.order_deadline_reached recomputed; Item.clearance_week recomputed"]

  - method: GET
    path: "/retail-ops/items/{id}/import-plan"
    description: "Computed read: the projected four-week import need for this item"
    roles: [AssortmentPlanner, RetailLead]
    code: 200
    input: []
    output: { projected_import_need_units: integer, order_deadline_reached: boolean, unit_margin_cents: integer, margin_floor_cents: integer }
    side_effects: []

  # --- GuestCheck -----------------------------------------------------------
  - method: POST
    path: "/retail-ops/guest-checks"
    description: "Open a dining check"
    roles: [Server]
    code: 201
    input:
      - location_id
      - store_day_id
      - table_number
      - restaurant_guest_count
      - restaurant_subtotal_cents
      - presented_shift_id
    output: GuestCheck
    side_effects: ["check_status=PENDING; settlement_status=UNSETTLED; retail_subtotal_cents=0; service_fee_cents and total_cents recomputed via calculations.combined_check_total; tip_eligible=false"]

  - method: GET
    path: "/retail-ops/guest-checks"
    description: "Reverse-reachability GET for GuestCheck.location_id / store_day_id / presented_shift_id — list checks filtered by any of them"
    roles: [PlatformAdmin, BoutiqueManager, RetailLead, Server, Cashier]
    code: 200
    input:
      - location_id?
      - store_day_id?
      - presented_shift_id?
      - check_status?
      - tip_eligible?
      - limit?
      - offset?
    output: GuestCheck[]
    side_effects: []

  - method: GET
    path: "/retail-ops/guest-checks/{id}"
    description: "Get a GuestCheck"
    roles: [PlatformAdmin, BoutiqueManager, RetailLead, Server, Cashier]
    code: 200
    input: []
    output: GuestCheck
    side_effects: []

  - method: PUT
    path: "/retail-ops/guest-checks/{id}"
    description: "Edit the restaurant side of a PENDING check (guest count and food-and-beverage subtotal)"
    roles: [BoutiqueManager, Cashier]
    code: 200
    input:
      - restaurant_guest_count?
      - restaurant_subtotal_cents?
    output: GuestCheck
    side_effects: ["restaurant side updated; GuestCheck.service_fee_cents and GuestCheck.total_cents recomputed via calculations.combined_check_total; increments GuestCheck.version by 1"]

  - method: POST
    path: "/retail-ops/guest-checks/{id}/finalize"
    description: "Finalize the combined check: recompute the total and the service fee, and freeze the check"
    roles: [Cashier]
    code: 200
    input: []
    output: GuestCheck
    side_effects:
      - "GuestCheck.retail_subtotal_cents recomputed from attached receipts"
      - "GuestCheck.service_fee_cents recomputed via calculations.compute_service_fee"
      - "GuestCheck.total_cents recomputed via calculations.combined_check_total"
      - "check_status -> FINALIZED"
      - "GuestCheck.tip_eligible recomputed from the presenting shift"
      - "increments GuestCheck.version by 1"

  - method: POST
    path: "/retail-ops/guest-checks/{id}/tips"
    description: "Post a gratuity against the check"
    roles: [Cashier, Server]
    code: 200
    input: [tip_cents]
    output: GuestCheck
    side_effects: ["GuestCheck.tip_cents set; GuestCheck.tip_pct recomputed; GuestCheck.total_cents recomputed; increments GuestCheck.version by 1"]

  - method: POST
    path: "/retail-ops/guest-checks/{id}/settle"
    description: "Settle the combined check's tender"
    roles: [Cashier]
    code: 200
    input:
      - payment_method
      - restaurant_share_basis?
    output: GuestCheck
    side_effects: ["settlement_status -> SETTLED; increments GuestCheck.version by 1"]

  - method: POST
    path: "/retail-ops/guest-checks/{id}/void"
    description: "Void the check and cascade its attached receipts to DISPUTED"
    roles: [BoutiqueManager]
    code: 200
    input: []
    output: GuestCheck
    side_effects:
      - "check_status -> VOIDED"
      - "every Receipt attached to this check with status IN {RECONCILED, SETTLED} -> DISPUTED with reversal_posted_at stamped"
      - "StoreDay.retail_sales_cents, StoreDay.retail_sales_per_guest_cents and StoreDay.retail_transaction_count recomputed for the day"
      - "increments GuestCheck.version by 1 and StoreDay.version by 1"

  - method: POST
    path: "/retail-ops/receipts/{id}/attach-check"
    description: "Move a retail Receipt onto a dining GuestCheck (positive counterpart of the OCC-guarded attach performed at create time)"
    roles: [RetailLead, Cashier]
    code: 200
    input: [guest_check_id, expected_guest_check_version]
    output: Receipt
    gate_precondition: "the referenced StoreDay.conversion_gate must equal OPEN — a SUSPENDED gate rejects this endpoint with ERR_STORE_DAY_GATE_SUSPENDED (SKILL §1.4 priority 8)"
    side_effects:
      - "Receipt.guest_check_id set; Receipt.store_day_id follows the check"
      - "GuestCheck.retail_subtotal_cents recomputed"
      - "GuestCheck.total_cents and GuestCheck.service_fee_cents recomputed"
      - "increments Receipt.version by 1, GuestCheck.version by 1 and StoreDay.version by 1"

  # --- Receipt --------------------------------------------------------------
  - method: POST
    path: "/retail-ops/receipts"
    description: "Ring a retail ticket; optionally attach it to a dining check as one combined transaction"
    roles: [RetailLead, RetailCashier]
    code: 201
    input:
      - location_id
      - store_day_id
      - guest_check_id?
      - receipt_number
      - lines
      - restaurant_share_cents?
      - restaurant_share_basis?
      - payment_method
      - expected_guest_check_version?
    output: Receipt
    gate_precondition: "the referenced StoreDay.conversion_gate must equal OPEN — a SUSPENDED gate rejects this endpoint with ERR_STORE_DAY_GATE_SUSPENDED (SKILL §1.4 priority 8)"
    side_effects:
      - "status=DRAFT"
      - "Receipt.provisional_retail_cents computed (calculations.provisional_retail_revenue, base variant when guest_check_id is present)"
      - "when guest_check_id is present: GuestCheck.retail_subtotal_cents, service_fee_cents and total_cents recomputed"
      - "StoreDay.retail_transaction_count += 1; StoreDay.retail_sales_cents recomputed"
      - "increments GuestCheck.version by 1 when guest_check_id is present"
      - "increments StoreDay.version by 1 and Location.version by 1"

  - method: GET
    path: "/retail-ops/receipts"
    description: "Reverse-reachability GET for Receipt.location_id / store_day_id / guest_check_id — list receipts filtered by any of them"
    roles: [PlatformAdmin, BoutiqueManager, RetailLead, RetailCashier, Cashier]
    code: 200
    input:
      - location_id?
      - store_day_id?
      - guest_check_id?
      - status?
      - payment_method?
      - limit?
      - offset?
    output: Receipt[]
    side_effects: []

  - method: GET
    path: "/retail-ops/receipts/{id}"
    description: "Get a Receipt"
    roles: [PlatformAdmin, BoutiqueManager, RetailLead, RetailCashier, Cashier]
    code: 200
    input: []
    output: Receipt
    side_effects: []

  - method: PUT
    path: "/retail-ops/receipts/{id}"
    description: "Edit the retail lines of a DRAFT receipt"
    roles: [RetailLead, RetailCashier]
    code: 200
    input:
      - lines?
      - restaurant_share_cents?
      - restaurant_share_basis?
      - payment_method?
    output: Receipt
    gate_precondition: "the referenced StoreDay.conversion_gate must equal OPEN — a SUSPENDED gate rejects this endpoint with ERR_STORE_DAY_GATE_SUSPENDED (SKILL §1.4 priority 8)"
    side_effects: ["Receipt.provisional_retail_cents recomputed; attached GuestCheck totals recomputed; increments Receipt.version by 1"]

  - method: POST
    path: "/retail-ops/receipts/{id}/reconcile"
    description: "Post the retail revenue for this ticket under the brand's recognition policy"
    roles: [RetailLead]
    code: 200
    input: []
    output: Receipt
    gate_precondition: "the referenced StoreDay.conversion_gate must equal OPEN — a SUSPENDED gate rejects this endpoint with ERR_STORE_DAY_GATE_SUSPENDED (SKILL §1.4 priority 8)"
    side_effects:
      - "provisional_retail_cents and recognized_retail_cents recomputed"
      - "recognition_delta_cents recomputed; reconciliation_posted_at stamped"
      - "Brand.provisional_retail_revenue_cents and Brand.recognized_retail_revenue_cents recomputed"
      - "status -> RECONCILED; reconciled_at stamped"
      - "increments Receipt.version by 1, Brand.version by 1 and StoreDay.version by 1"

  - method: POST
    path: "/retail-ops/receipts/{id}/dispute"
    description: "Reverse a reconciled or settled receipt pending manager review"
    roles: [BoutiqueManager]
    code: 200
    input: []
    output: Receipt
    gate_precondition: "the referenced StoreDay.conversion_gate must equal OPEN — a SUSPENDED gate rejects this endpoint with ERR_STORE_DAY_GATE_SUSPENDED (SKILL §1.4 priority 8)"
    side_effects:
      - "status -> DISPUTED; reversal_posted_at stamped"
      - "the receipt leaves the StoreDay.retail_sales_cents aggregation set"
      - "StoreDay.retail_sales_cents and StoreDay.retail_sales_per_guest_cents recomputed; StoreDay.retail_transaction_count decremented by 1"
      - "Brand.provisional_retail_revenue_cents and Brand.recognized_retail_revenue_cents recomputed"
      - "increments Receipt.version by 1, Brand.version by 1 and StoreDay.version by 1"

  - method: POST
    path: "/retail-ops/receipts/{id}/resolve"
    description: "Return a disputed receipt to RECONCILED with freshly computed amounts"
    roles: [BoutiqueManager]
    code: 200
    input: []
    output: Receipt
    gate_precondition: "the referenced StoreDay.conversion_gate must equal OPEN — a SUSPENDED gate rejects this endpoint with ERR_STORE_DAY_GATE_SUSPENDED (SKILL §1.4 priority 8)"
    side_effects: ["status -> RECONCILED; reversal_posted_at cleared; provisional and recognized amounts recomputed; StoreDay and Brand totals recomputed; increments Receipt.version by 1, Brand.version by 1 and StoreDay.version by 1"]

  - method: POST
    path: "/retail-ops/receipts/{id}/settle"
    description: "Settle the retail tender of a reconciled receipt"
    roles: [RetailLead]
    code: 200
    input:
      - payment_method?
    output: Receipt
    gate_precondition: "the referenced StoreDay.conversion_gate must equal OPEN — a SUSPENDED gate rejects this endpoint with ERR_STORE_DAY_GATE_SUSPENDED (SKILL §1.4 priority 8)"
    side_effects: ["status -> SETTLED; settled_at stamped; StoreDay.retail_sales_cents recomputed; increments Receipt.version by 1 and StoreDay.version by 1"]

  # --- ClearanceSchedule ----------------------------------------------------
  - method: POST
    path: "/retail-ops/clearance-schedules"
    description: "Create a ClearanceSchedule for post-holiday clearance of a seasonal-decor item"
    roles: [BoutiqueManager, AssortmentPlanner]
    code: 201
    input: [location_id, item_id, start_date, end_date, expected_item_version]
    output: ClearanceSchedule
    side_effects: ["status=DRAFT; stage=S1; markdown_pct=0; remaining_units=0; liquidated_units=0; extension_count=0; reactivation_count=0"]

  - method: GET
    path: "/retail-ops/clearance-schedules"
    description: "Reverse-reachability GET for ClearanceSchedule.location_id / item_id — list clearance schedules filtered by either"
    roles: [PlatformAdmin, AssortmentPlanner, BoutiqueManager, RetailLead]
    code: 200
    input:
      - location_id?
      - item_id?
      - status?
      - item_active_price_by_region_cents?
      - limit?
      - offset?
    output: ClearanceSchedule[]
    side_effects: []

  - method: GET
    path: "/retail-ops/clearance-schedules/{id}"
    description: "Get a ClearanceSchedule with its dual-variant price comparison"
    roles: [PlatformAdmin, AssortmentPlanner, BoutiqueManager, RetailLead]
    code: 200
    input: []
    output: ClearanceSchedule
    side_effects: []

  - method: POST
    path: "/retail-ops/clearance-schedules/{id}/activate"
    description: "Activate the clearance window and apply the S1 markdown"
    roles: [BoutiqueManager]
    code: 200
    input: []
    output: ClearanceSchedule
    gate_precondition: "the referenced StoreDay.conversion_gate must equal OPEN — a SUSPENDED gate rejects this endpoint with ERR_STORE_DAY_GATE_SUSPENDED (SKILL §1.4 priority 8)"
    side_effects:
      - "status -> ACTIVE; activated_at stamped; stage=S1"
      - "remaining_units = Item.on_hand_units"
      - "Item.current_markdown_pct, Item.effective_price_cents and Item.compounded_price_cents recomputed; Item.status -> CLEARANCE"
      - "Location.active_clearance_count += 1"
      - "increments ClearanceSchedule.version by 1 and Item.version by 1"

  - method: POST
    path: "/retail-ops/clearance-schedules/{id}/extend"
    description: "Extend the clearance window into the post-holiday period"
    roles: [BoutiqueManager]
    code: 200
    input: [extra_days]
    output: ClearanceSchedule
    gate_precondition: "the referenced StoreDay.conversion_gate must equal OPEN — a SUSPENDED gate rejects this endpoint with ERR_STORE_DAY_GATE_SUSPENDED (SKILL §1.4 priority 8)"
    side_effects: ["status -> EXTENDED; extension_count += 1; end_date += extra_days; increments ClearanceSchedule.version by 1"]

  - method: POST
    path: "/retail-ops/clearance-schedules/{id}/reactivate"
    description: "Reactivate an extended clearance window as a fresh window with the mandatory quiet hours applied"
    roles: [BoutiqueManager]
    code: 200
    input: []
    output: ClearanceSchedule
    side_effects: ["status -> ACTIVE; reactivation_count += 1; start_date = previous end_date + Brand.clearance_buffer_hours; end_date = start_date + 7 days; increments ClearanceSchedule.version by 1"]

  - method: POST
    path: "/retail-ops/clearance-schedules/{id}/liquidate"
    description: "Liquidate the remaining units through the waterfall tiers"
    roles: [BoutiqueManager]
    code: 200
    input: []
    output: ClearanceSchedule
    gate_precondition: "the referenced StoreDay.conversion_gate must equal OPEN — a SUSPENDED gate rejects this endpoint with ERR_STORE_DAY_GATE_SUSPENDED (SKILL §1.4 priority 8)"
    side_effects:
      - "liquidation_bucket_units and liquidation_blended_cents recomputed via calculations.liquidation_tier_price"
      - "liquidated_units = remaining_units; remaining_units = 0"
      - "Item.on_hand_units -= liquidated_units; Item.status -> DISCONTINUED"
      - "Location.active_clearance_count -= 1"
      - "increments ClearanceSchedule.version by 1 and Item.version by 1"

  - method: POST
    path: "/retail-ops/clearance-schedules/{id}/cancel"
    description: "Cancel a DRAFT clearance window"
    roles: [BoutiqueManager]
    code: 200
    input: []
    output: ClearanceSchedule
    side_effects: ["status -> CANCELLED; increments ClearanceSchedule.version by 1"]

  # --- StaffShift -----------------------------------------------------------
  - method: POST
    path: "/retail-ops/staff-shifts"
    description: "Schedule a shift in either labor pool, with crossover authorization where required"
    roles: [BoutiqueManager]
    code: 201
    input:
      - location_id
      - employee_id
      - start_utc
      - end_utc
      - workcode
      - tip_eligible_claim?
      - crossover_authorized_by_shift_id?
    output: StaffShift
    side_effects: ["status=SCHEDULED; tip_eligible=false; tip_eligible_minutes=0"]

  - method: GET
    path: "/retail-ops/staff-shifts"
    description: "Reverse-reachability GET for StaffShift.location_id / crossover_authorized_by_shift_id — list shifts filtered by either"
    roles: [PlatformAdmin, BoutiqueManager, RetailLead, Cashier, Server]
    code: 200
    input:
      - location_id?
      - employee_id?
      - workcode?
      - status?
      - tip_eligible?
      - crossover_authorized_by_shift_id?
      - limit?
      - offset?
    output: StaffShift[]
    side_effects: []

  - method: GET
    path: "/retail-ops/staff-shifts/{id}"
    description: "Get a StaffShift"
    roles: [PlatformAdmin, BoutiqueManager, RetailLead, Cashier, Server]
    code: 200
    input: []
    output: StaffShift
    side_effects: []

  - method: POST
    path: "/retail-ops/staff-shifts/{id}/start"
    description: "Start the shift and derive tip eligibility"
    roles: [BoutiqueManager]
    code: 200
    input: []
    output: StaffShift
    gate_precondition: "the referenced StoreDay.conversion_gate must equal OPEN — a SUSPENDED gate rejects this endpoint with ERR_STORE_DAY_GATE_SUSPENDED (SKILL §1.4 priority 8)"
    side_effects:
      - "status -> IN_PROGRESS"
      - "tip_eligible_minutes and tip_eligible recomputed (calculations.derive_tip_eligibility)"
      - "every GuestCheck presented by this shift recomputes tip_eligible across all presenting shifts"
      - "StoreDay.waiting_area_conversion_index_bps recomputed"
      - "increments StaffShift.version by 1"

  - method: POST
    path: "/retail-ops/staff-shifts/{id}/complete"
    description: "Complete the shift and settle its tip-eligibility contribution"
    roles: [BoutiqueManager]
    code: 200
    input: []
    output: StaffShift
    side_effects:
      - "status -> COMPLETED; completed_at stamped"
      - "tip_eligible_minutes and tip_eligible recomputed"
      - "every GuestCheck presented by this shift recomputes tip_eligible across all presenting shifts"
      - "StoreDay.waiting_area_conversion_index_bps recomputed"
      - "the shift's location becomes eligible for the next receiving window"
      - "increments StaffShift.version by 1"

  - method: POST
    path: "/retail-ops/staff-shifts/{id}/revert-to-scheduled"
    description: "Revert an in-progress shift to SCHEDULED to correct a punch"
    roles: [BoutiqueManager]
    code: 200
    input: []
    output: StaffShift
    side_effects: ["status -> SCHEDULED; tip_eligible=false; tip_eligible_minutes=0; presented checks recomputed; increments StaffShift.version by 1"]

  - method: POST
    path: "/retail-ops/staff-shifts/{id}/cancel"
    description: "Cancel a scheduled shift"
    roles: [BoutiqueManager]
    code: 200
    input: []
    output: StaffShift
    side_effects: ["status -> CANCELLED; presented checks recomputed to tip_eligible=false; increments StaffShift.version by 1"]

  # --- Transfer -------------------------------------------------------------
  - method: POST
    path: "/retail-ops/transfers"
    description: "Create a transfer of imported goods into the shared backroom"
    roles: [RetailLead]
    code: 201
    input: [location_id, store_day_id, item_id, declared_units, received_units, receiving_zone]
    output: Transfer
    gate_precondition: "the referenced StoreDay.conversion_gate must equal OPEN — a SUSPENDED gate rejects this endpoint with ERR_STORE_DAY_GATE_SUSPENDED (SKILL §1.4 priority 8)"
    side_effects: ["status=PLANNED; variance_units=0; variance_bps=0"]

  - method: GET
    path: "/retail-ops/transfers"
    description: "Reverse-reachability GET for Transfer.location_id / store_day_id / item_id — list transfers filtered by any of them"
    roles: [PlatformAdmin, BoutiqueManager, RetailLead]
    code: 200
    input:
      - location_id?
      - store_day_id?
      - item_id?
      - status?
      - receiving_zone?
      - limit?
      - offset?
    output: Transfer[]
    side_effects: []

  - method: GET
    path: "/retail-ops/transfers/{id}"
    description: "Get a Transfer"
    roles: [PlatformAdmin, BoutiqueManager, RetailLead]
    code: 200
    input: []
    output: Transfer
    side_effects: []

  - method: POST
    path: "/retail-ops/transfers/{id}/dispatch"
    description: "Dispatch the transfer; its declared units commit backroom capacity"
    roles: [RetailLead]
    code: 200
    input: []
    output: Transfer
    gate_precondition: "the referenced StoreDay.conversion_gate must equal OPEN — a SUSPENDED gate rejects this endpoint with ERR_STORE_DAY_GATE_SUSPENDED (SKILL §1.4 priority 8)"
    side_effects:
      - "status -> IN_TRANSIT; dispatched_at stamped; Location.backroom_committed_units += declared_units; Location.staging_free_units recomputed; StoreDay.conversion_gate -> GATED_RESTRICTED when staging_free_units <= 0; increments Transfer.version by 1"

  - method: POST
    path: "/retail-ops/transfers/{id}/advance"
    description: "Advance the store day's clock anchor for a marketing-reset event, which walks the seasonal-decor clearance cadence forward"
    roles: [BoutiqueManager]
    code: 200
    input: [from_iso8601]
    output: StoreDay
    side_effects:
      - "logical clock set to from_iso8601"
      - "every ClearanceSchedule of this store day's location in status IN {ACTIVE, EXTENDED} whose (clock - activated_at) has crossed a whole multiple of 7 days advances the markdown stage by one step per completed week, capped at S4"
      - "ClearanceSchedule.markdown_pct, Item.current_markdown_pct, Item.effective_price_cents and Item.compounded_price_cents recomputed; Item.clearance_week updated"
      - "increments StoreDay.version by 1"

  - method: POST
    path: "/retail-ops/transfers/{id}/receive"
    description: "Receive the transfer into the backroom and re-measure capacity"
    roles: [RetailLead]
    code: 200
    input: [received_units]
    output: Transfer
    gate_precondition: "the referenced StoreDay.conversion_gate must equal OPEN — a SUSPENDED gate rejects this endpoint with ERR_STORE_DAY_GATE_SUSPENDED (SKILL §1.4 priority 8)"
    side_effects:
      - "status -> RECEIVED; received_at stamped"
      - "variance_units and variance_bps recomputed"
      - "a BackroomCapacityReading is appended and Location posture overwritten from it"
      - "Item.on_hand_units += received_units when receiving_zone == BACKROOM"
      - "when the reading breaches capacity: every ClearanceSchedule of this location in status IN {ACTIVE, DRAFT} advances one markdown stage; Item prices recomputed"
      - "increments Transfer.version by 1"

  - method: POST
    path: "/retail-ops/transfers/{id}/reconcile"
    description: "Reconcile the received transfer, closing the variance"
    roles: [RetailLead]
    code: 200
    input: []
    output: Transfer
    gate_precondition: "the referenced StoreDay.conversion_gate must equal OPEN — a SUSPENDED gate rejects this endpoint with ERR_STORE_DAY_GATE_SUSPENDED (SKILL §1.4 priority 8)"
    side_effects: ["status -> RECONCILED; increments Transfer.version by 1"]

  - method: POST
    path: "/retail-ops/transfers/{id}/void-receiving"
    description: "Reverse a receiving whose variance exceeded tolerance and restore the conserved backroom quantity"
    roles: [BoutiqueManager]
    code: 200
    input: []
    output: Transfer
    gate_precondition: "the referenced StoreDay.conversion_gate must equal OPEN — a SUSPENDED gate rejects this endpoint with ERR_STORE_DAY_GATE_SUSPENDED (SKILL §1.4 priority 8)"
    side_effects:
      - "status -> VOID_RECEIVING"
      - "Item.on_hand_units -= received_units; Item.on_hand_units += declared_units"
      - "a compensating BackroomCapacityReading is appended with backroom_units = -received_units"
      - "Location.backroom_occupancy_units restored so that backroom_occupancy_units + backroom_committed_units returns to its pre-receiving value"
      - "increments Transfer.version by 1"

  - method: POST
    path: "/retail-ops/transfers/{id}/redispatch"
    description: "Re-dispatch a voided receiving with a corrected manifest"
    roles: [RetailLead]
    code: 200
    input: []
    output: Transfer
    gate_precondition: "the referenced StoreDay.conversion_gate must equal OPEN — a SUSPENDED gate rejects this endpoint with ERR_STORE_DAY_GATE_SUSPENDED (SKILL §1.4 priority 8)"
    side_effects: ["status -> IN_TRANSIT; Location.backroom_committed_units += declared_units; received_units=variance_units=variance_bps=0; increments Transfer.version by 1"]

  - method: GET
    path: "/retail-ops/transfers/{id}/discrepancy"
    description: "Computed read: the receiving variance reconciliation for this transfer"
    roles: [BoutiqueManager, RetailLead]
    code: 200
    input: []
    output: { variance_units: integer, variance_bps: integer, tolerance_bps: integer, within_tolerance: boolean, conserved_backroom_units: integer }
    side_effects: []

  # --- PlanogramVersion / PlanogramSlot -------------------------------------
  - method: POST
    path: "/retail-ops/planogram-versions"
    description: "Create a DRAFT planogram version for a location"
    roles: [AssortmentPlanner]
    code: 201
    input:
      - location_id
      - assortment_tier
      - effective_date
      - clone_slots_from_version_id?
    output: PlanogramVersion
    side_effects: ["status=DRAFT; slot_count=0; when clone_slots_from_version_id is supplied, every non-VACATED slot of that version is copied into this version with status PLANNED and slot_count reflects the copies"]

  - method: GET
    path: "/retail-ops/planogram-versions"
    description: "Reverse-reachability GET for PlanogramVersion.location_id / superseded_by_version_id — list versions filtered by either"
    roles: [PlatformAdmin, AssortmentPlanner, BoutiqueManager]
    code: 200
    input:
      - location_id?
      - status?
      - assortment_tier?
      - superseded_by_version_id?
      - limit?
      - offset?
    output: PlanogramVersion[]
    side_effects: []

  - method: GET
    path: "/retail-ops/planogram-versions/{id}"
    description: "Get a PlanogramVersion"
    roles: [PlatformAdmin, AssortmentPlanner, BoutiqueManager]
    code: 200
    input: []
    output: PlanogramVersion
    side_effects: []

  - method: DELETE
    path: "/retail-ops/planogram-versions/{id}"
    description: "Delete a DRAFT planogram version; a PUBLISHED version is not deletable and must be superseded and retired instead"
    roles: [AssortmentPlanner]
    code: 204
    input: []
    output: null
    side_effects: ["the DRAFT version and its PLANNED slots are removed; increments Location.version by 1"]

  - method: PUT
    path: "/retail-ops/planogram-versions/{id}"
    description: "Update a DRAFT planogram version"
    roles: [AssortmentPlanner]
    code: 200
    input:
      - assortment_tier?
      - effective_date?
    output: PlanogramVersion
    side_effects: ["increments PlanogramVersion.version by 1"]

  - method: POST
    path: "/retail-ops/planogram-versions/{id}/publish"
    description: "Publish the planogram; the previously published version of the location is superseded and its slots freeze"
    roles: [AssortmentPlanner]
    code: 200
    input: []
    output: PlanogramVersion
    side_effects:
      - "status -> PUBLISHED; published_at stamped"
      - "Location.active_planogram_version_id -> this version id"
      - "every PlanogramSlot of this version in status PLANNED -> APPLIED with applied_at stamped"
      - "the location's previous PUBLISHED version -> SUPERSEDED with superseded_by_version_id set; its APPLIED slots -> FROZEN"
      - "increments PlanogramVersion.version by 1"

  - method: POST
    path: "/retail-ops/planogram-versions/{id}/retire"
    description: "Retire a superseded planogram version and vacate its frozen slots"
    roles: [AssortmentPlanner]
    code: 200
    input: []
    output: PlanogramVersion
    side_effects: ["status -> RETIRED; every FROZEN slot -> VACATED; increments PlanogramVersion.version by 1"]

  - method: GET
    path: "/retail-ops/planogram-versions/{id}/region-fit"
    description: "Computed read: the regionally adjusted slot count for this version"
    roles: [PlatformAdmin, AssortmentPlanner, BoutiqueManager]
    code: 200
    input: []
    output: { regionally_adjusted_slot_count: integer, regional_tweak_bonus: integer, local_event_bonus: integer, drift_bps: integer }
    side_effects: []

  - method: POST
    path: "/retail-ops/planogram-slots"
    description: "Add a slot to a DRAFT planogram version"
    roles: [AssortmentPlanner]
    code: 201
    input:
      - planogram_version_id
      - item_id
      - slot_position
      - facings?
      - min_presentation_units?
    output: PlanogramSlot
    side_effects: ["status=PLANNED; PlanogramVersion.slot_count recomputed"]

  - method: GET
    path: "/retail-ops/planogram-slots"
    description: "Reverse-reachability GET for PlanogramSlot.planogram_version_id / item_id — list slots filtered by either"
    roles: [PlatformAdmin, AssortmentPlanner, BoutiqueManager]
    code: 200
    input:
      - planogram_version_id?
      - item_id?
      - status?
      - limit?
      - offset?
    output: PlanogramSlot[]
    side_effects: []

  - method: GET
    path: "/retail-ops/planogram-slots/{id}"
    description: "Get a PlanogramSlot"
    roles: [PlatformAdmin, AssortmentPlanner, BoutiqueManager]
    code: 200
    input: []
    output: PlanogramSlot
    side_effects: []

  - method: PUT
    path: "/retail-ops/planogram-slots/{id}"
    description: "Reshape a PLANNED slot (facings or position); OCC-guarded on the parent version"
    roles: [AssortmentPlanner]
    code: 200
    input:
      - expected_planogram_version_version
      - facings?
      - slot_position?
    output: PlanogramSlot
    side_effects:
      - "slot fields updated; PlanogramVersion.slot_count recomputed"
      - "increments PlanogramVersion.version by 1"
      - "increments PlanogramSlot.version by 1"

  - method: POST
    path: "/retail-ops/planogram-slots/{id}/apply"
    description: "Apply a PLANNED slot on the floor and mark it applied"
    roles: [RetailLead, BoutiqueManager]
    code: 200
    input: []
    output: PlanogramSlot
    side_effects: ["status -> APPLIED; applied_at stamped; increments PlanogramSlot.version by 1"]

  - method: POST
    path: "/retail-ops/planogram-slots/{id}/verify"
    description: "Verify an applied slot after execution"
    roles: [BoutiqueManager]
    code: 200
    input: []
    output: PlanogramSlot
    side_effects: ["status -> VERIFIED; verified_at stamped; increments PlanogramSlot.version by 1"]

  # --- Cross-cutting reads --------------------------------------------------
  - method: GET
    path: "/retail-ops/revenue-attribution"
    description: "Computed read: the dual-variant revenue attribution for one store day"
    roles: [PlatformAdmin, AssortmentPlanner, BoutiqueManager, RetailLead]
    code: 200
    input:
      - store_day_id
      - variant?
    output: { store_day_id: "string", provisional_retail_cents: "integer", recognized_retail_cents: "integer", recognition_delta_cents: "integer", restaurant_share_cents: "integer", retail_share_cents: "integer", receipt_count: "integer" }
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog (§1.6)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header absent, or the role value is not a declared §1.7 role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "The declared role is not permitted for the operation" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version in the request body does not equal the parent entity's current version" }

  - { id: ERR_BRAND_NOT_FOUND, http: 404, condition: "brand_id references no Brand" }
  - { id: ERR_LOCATION_NOT_FOUND, http: 404, condition: "A parent id in the path or body references no Location" }
  - { id: ERR_STORE_DAY_NOT_FOUND, http: 404, condition: "store_day_id references no StoreDay" }
  - { id: ERR_ITEM_NOT_FOUND, http: 404, condition: "An Item id referenced by the request references no Item" }
  - { id: ERR_CHECK_NOT_FOUND, http: 404, condition: "guest_check_id references no GuestCheck" }
  - { id: ERR_RECEIPT_NOT_FOUND, http: 404, condition: "Receipt id in the path references no Receipt" }
  - { id: ERR_TRANSFER_NOT_FOUND, http: 404, condition: "Transfer id in the path references no Transfer" }
  - { id: ERR_SHIFT_NOT_FOUND, http: 404, condition: "StaffShift id in the path references no StaffShift" }
  - { id: ERR_CLEARANCE_NOT_FOUND, http: 404, condition: "ClearanceSchedule id in the path references no ClearanceSchedule" }
  - { id: ERR_PLANOGRAM_NOT_FOUND, http: 404, condition: "PlanogramVersion or PlanogramSlot id in the path references no such resource" }

  - { id: ERR_STORE_DAY_DUPLICATE, http: 409, condition: "A StoreDay already exists for this (location_id, business_date)" }
  - { id: ERR_RECEIPT_DUPLICATE, http: 409, condition: "receipt_number already exists for this (location_id, business_date)" }
  - { id: ERR_PLANOGRAM_SLOT_CONFLICT, http: 409, condition: "slot_position already taken within the planogram version, or the item's theme is not carried at this assortment tier" }

  - { id: ERR_INVALID_STATE, http: 409, condition: "The resource is not in a state from which the requested operation is defined" }
  - { id: ERR_STORE_DAY_CLOSED, http: 409, condition: "The operation targets a StoreDay whose day_status is CLOSED" }
  - { id: ERR_STORE_DAY_GATE_SUSPENDED, http: 409, condition: "The StoreDay's conversion_gate is SUSPENDED and the operation is gated on it" }
  - { id: ERR_STORE_DAY_GATE_RESTRICTED, http: 409, condition: "The StoreDay's conversion_gate is GATED_RESTRICTED and the operation requires the OPEN gate" }
  - { id: ERR_CHECK_ALREADY_FINALIZED, http: 409, condition: "The GuestCheck is already FINALIZED or VOIDED and cannot accept further retail lines" }

  - { id: ERR_FISCAL_PERIOD_CLOSED, http: 422, condition: "Revenue recognition is attempted after the brand's fiscal period was closed" }
  - { id: ERR_BACKROOM_OVER_CAPACITY, http: 409, condition: "Receiving would drive Location.staging_free_units below zero" }
  - { id: ERR_FOOD_STORAGE_ZONE_FORBIDDEN, http: 409, condition: "A retail transfer is routed into the FOOD_STORAGE receiving zone" }
  - { id: ERR_TRANSFER_VARIANCE_EXCEEDED, http: 422, condition: "A receiving whose variance_bps exceeds Brand.transfer_variance_tolerance_bps cannot be reconciled" }
  - { id: ERR_CROSSOVER_NOT_AUTHORIZED, http: 403, condition: "The shift spans both labor pools without an authorizing manager shift" }
  - { id: ERR_POSTURE_LOCKOUT, http: 409, condition: "The location's staging_free_units or the store day's gate blocks the requested retail-side operation" }

  - { id: ERR_CLEARANCE_WINDOW_OVERLAP, http: 409, condition: "Two ClearanceSchedule windows on the same (location_id, item_id) are separated by less than Brand.clearance_buffer_hours" }
  - { id: ERR_CLEARANCE_SLOT_LIMIT, http: 409, condition: "Location.active_clearance_count is already at Location.clearance_max_active" }
  - { id: ERR_CLEARANCE_NOT_FINAL, http: 409, condition: "Liquidation attempted before stage S4 or on an item not in CLEARANCE" }
  - { id: ERR_CLEARANCE_WINDOW_REACTIVATION_LIMIT, http: 409, condition: "ClearanceSchedule.reactivation_count has reached 2" }

  - { id: ERR_CHECK_TOTAL_EXCEEDED, http: 422, condition: "The combined check total would exceed Brand.max_check_total_cents" }
  - { id: ERR_CHECK_STORE_DAY_MISMATCH, http: 422, condition: "A receipt's store day differs from its attached GuestCheck's store day" }
  - { id: ERR_GIFT_CARD_LINE_MISMATCH, http: 422, condition: "A GIFT_CARD line appears without GIFT_CARD tender, or more than once" }
  - { id: ERR_TIP_INELIGIBLE_WORKCODE, http: 422, condition: "tip_eligible_claim is true for a front-of-house retail workcode" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "The (location_id, employee_id) pair already has a shift overlapping this interval by one minute or more" }
  - { id: ERR_TIP_SHIFT_TOO_SHORT, http: 422, condition: "A tip-eligibility claim is asserted for a shift whose worked interval cannot reach Brand.tip_minimum_minutes" }
  - { id: ERR_PLANOGRAM_VERSION_CONFLICT, http: 409, condition: "A planogram version carries fewer than six slots at publish, or a competing DRAFT version of the same location has an earlier effective_date" }
  - { id: ERR_NO_REGIONAL_ASSORTMENT, http: 403, condition: "A planogram slot references an item whose theme is not carried by this region's assortment tier" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "The request body is malformed, a required field is missing, a numeric bound is violated, or a generic type constraint fails" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "The requested top-level resource does not exist" }

# =============================================================================
# Table 7: RBAC Matrix (§1.7)
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Chain-level operator who configures the brand and can override store-level locks"
    identity: opaque
    exclusive_operations:
      - "POST /brands"
      - "PUT /brands/{brandId}"
      - "POST /locations"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /brands, GET /brands/{brandId}"
      - "GET /locations, GET /locations/{locationId}"
      - "every computed read endpoint"

  - name: AssortmentPlanner
    description: "Merchandising planner who owns the assortment and the planogram versions"
    identity: opaque
    exclusive_operations:
      - "POST /items"
      - "POST /planogram-versions"
      - "PUT /planogram-versions/{id}"
      - "POST /planogram-versions/{id}/publish"
      - "POST /planogram-versions/{id}/retire"
      - "POST /planogram-slots"
      - "PUT /planogram-slots/{id}"
    shared_operations:
      - "POST /clearance-schedules"
      - "POST /items/{id}/order-deadline-check"
