            - "err == ERR_SLIDES_NOT_READY (http 409)"
            - "Case.${c1}.status == WORKUP (unchanged) while Slide.${s1}.status == STAINED"
      - name: release_create_gated_on_case_final
        grounds:
          - validations[priority=17]
          - state_machines.ReleaseRequest.REQUESTED_to_APPROVED
          - errors[ERR_CASE_NOT_FINAL]
        distinguishing_aspect: "Entity pair ReleaseRequest x Case (distinct from the Case x Slide pair): creating a release request for a QC_PASSED slide whose case is still WORKUP fails with ERR_CASE_NOT_FINAL before any material-state check runs."
        test_recipe:
          setup:
            - "GI case in WORKUP with a QC_PASSED slide s1 (the material itself is releasable; only the case state is wrong)"
          setup_api_calls:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-801", full_name: "Pat Fourteen", date_of_birth: "1992-03-03" }, as: LabAdmin, captures: { pat: $.data.id } }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI" }, as: LabAdmin, captures: { c1: $.data.id } }
            - { call: "POST /pathology/cases/${c1}/specimens", payload: { patient_mrn: "MRN-801", patient_dob: "1992-03-03", specimen_type: "BIOPSY", anatomical_site: "Colon", collection_datetime: "2026-08-03T09:00:00Z", received_datetime: "2026-08-03T10:00:00Z", container_count: 1 }, as: Histotech, captures: { sp1: $.data.id } }
            - { call: "POST /pathology/specimens/${sp1}/gross", payload: { gross_description: "bx" }, as: PathologyAssistant }
            - { call: "POST /pathology/specimens/${sp1}/blocks", payload: { block_label: "A1" }, as: Histotech, captures: { b1: $.data.id } }
            - { call: "POST /pathology/blocks/${b1}/embed", as: Histotech }
            - { call: "POST /pathology/blocks/${b1}/slides", payload: { slide_label: "A1-1" }, as: Histotech, captures: { s1: $.data.id } }
            - { call: "POST /pathology/slides/${s1}/section", payload: { consumption_pct: 10.0 }, as: Histotech }
            - { call: "POST /pathology/slides/${s1}/stain-complete", as: Histotech }
            - { call: "POST /pathology/slides/${s1}/qc-review", payload: { result: "PASS" }, as: Histotech }
          trigger:
            - { call: "POST /pathology/release-requests", payload: { material_type: "SLIDE", slide_id: "${s1}", requesting_institution: "County Hospital", reason: "external review", requested_out_at: "2026-08-10T00:00:00Z", due_back_at: "2026-08-20T00:00:00Z" }, as: LabAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_CASE_NOT_FINAL (http 409)"
            - "no ReleaseRequest row is created (GET /pathology/release-requests?slide_id=${s1} returns total_count 0)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: consult_service_window_half_open_adjacency
        grounds:
          - validations[priority=53]
          - state_machines.CoverageWindow
          - errors[ERR_COVERAGE_WINDOW_OVERLAP]
        distinguishing_aspect: "CoverageWindow resource with HALF-OPEN [start_at, end_at) semantics: a new CONSULT_SERVICE window starting exactly at the existing window's end is allowed (adjacency), while one shifted one hour earlier into the interior is rejected with ERR_COVERAGE_WINDOW_OVERLAP."
        test_recipe:
          setup:
            - "pathologist p1 with one ACTIVE CONSULT_SERVICE window [2026-08-03T10:00:00Z, 2026-08-03T12:00:00Z]"
          setup_api_calls:
            - { call: "POST /pathology/pathologists", payload: { full_name: "Dr Window", subspecialties: ["GI"] }, as: LabAdmin, captures: { p1: $.data.id } }
            - { call: "POST /pathology/pathologists/${p1}/coverage-windows", payload: { window_type: "CONSULT_SERVICE", start_at: "2026-08-03T10:00:00Z", end_at: "2026-08-03T12:00:00Z" }, as: LabAdmin, captures: { w1: $.data.id } }
          trigger:
            - { call: "POST /pathology/pathologists/${p1}/coverage-windows", payload: { window_type: "CONSULT_SERVICE", start_at: "2026-08-03T12:00:00Z", end_at: "2026-08-03T14:00:00Z" }, as: LabAdmin, captures: { w2: $.data.id } }
            - { call: "POST /pathology/pathologists/${p1}/coverage-windows", payload: { window_type: "CONSULT_SERVICE", start_at: "2026-08-03T11:00:00Z", end_at: "2026-08-03T13:00:00Z" }, as: LabAdmin, captures: { err: $.data.error_id } }
          assert:
            - "adjacent window succeeds: CoverageWindow.${w2}.status == ACTIVE (touching endpoint end == start is not an overlap)"
            - "interior-overlapping window fails: err == ERR_COVERAGE_WINDOW_OVERLAP (http 409)"
      - name: release_loan_closed_interval_touching_conflicts
        grounds:
          - validations[priority=55]
          - state_machines.ReleaseRequest.REQUESTED_to_APPROVED
          - errors[ERR_LOAN_INTERVAL_CONFLICT]
        distinguishing_aspect: "ReleaseRequest resource (distinct entity from CoverageWindow) with CLOSED-interval semantics (different geometry from the half-open instance): a loan starting exactly when the pending loan ends still conflicts because touching endpoints count, while a one-second gap lets the approval through."
        test_recipe:
          setup:
            - "FINAL GI case with two QC_PASSED slides s1 and s2 (so the last-material safety gate does not fire for s1); pending release r1 on s1 covering [2026-08-10T00:00:00Z, 2026-08-20T00:00:00Z]"
          setup_api_calls:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-900", full_name: "Pat Fifteen", date_of_birth: "1966-06-06" }, as: LabAdmin, captures: { pat: $.data.id } }
            - { call: "POST /pathology/pathologists", payload: { full_name: "Dr Loan", subspecialties: ["GI"] }, as: LabAdmin, captures: { p1: $.data.id } }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI" }, as: LabAdmin, captures: { c1: $.data.id } }
            - { call: "POST /pathology/cases/${c1}/specimens", payload: { patient_mrn: "MRN-900", patient_dob: "1966-06-06", specimen_type: "BIOPSY", anatomical_site: "Colon", collection_datetime: "2026-08-03T09:00:00Z", received_datetime: "2026-08-03T10:00:00Z", container_count: 1 }, as: Histotech, captures: { sp1: $.data.id } }
            - { call: "POST /pathology/specimens/${sp1}/gross", payload: { gross_description: "bx" }, as: PathologyAssistant }
            - { call: "POST /pathology/specimens/${sp1}/blocks", payload: { block_label: "A1" }, as: Histotech, captures: { b1: $.data.id } }
            - { call: "POST /pathology/blocks/${b1}/embed", as: Histotech }
            - { call: "POST /pathology/blocks/${b1}/slides", payload: { slide_label: "A1-1" }, as: Histotech, captures: { s1: $.data.id } }
            - { call: "POST /pathology/blocks/${b1}/slides", payload: { slide_label: "A1-2" }, as: Histotech, captures: { s2: $.data.id } }
            - { call: "POST /pathology/slides/${s1}/section", payload: { consumption_pct: 10.0 }, as: Histotech }
            - { call: "POST /pathology/slides/${s1}/stain-complete", as: Histotech }
            - { call: "POST /pathology/slides/${s1}/qc-review", payload: { result: "PASS" }, as: Histotech }
            - { call: "POST /pathology/slides/${s2}/section", payload: { consumption_pct: 10.0 }, as: Histotech }
            - { call: "POST /pathology/slides/${s2}/stain-complete", as: Histotech }
            - { call: "POST /pathology/slides/${s2}/qc-review", payload: { result: "PASS" }, as: Histotech }
            - { call: "POST /pathology/cases/${c1}/assign", payload: { pathologist_id: "${p1}" }, as: LabAdmin }
            - { call: "POST /pathology/cases/${c1}/submit-for-signout", as: Pathologist, as_user_id: "${p1}" }
            - { call: "POST /pathology/cases/${c1}/sign-out", payload: { diagnosis_text: "benign" }, as: Pathologist, as_user_id: "${p1}" }
            - { call: "POST /pathology/release-requests", payload: { material_type: "SLIDE", slide_id: "${s1}", requesting_institution: "County Hospital", reason: "board review", requested_out_at: "2026-08-10T00:00:00Z", due_back_at: "2026-08-20T00:00:00Z" }, as: LabAdmin, captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /pathology/release-requests", payload: { material_type: "SLIDE", slide_id: "${s1}", requesting_institution: "University Hospital", reason: "touching loan", requested_out_at: "2026-08-20T00:00:00Z", due_back_at: "2026-08-25T00:00:00Z" }, as: LabAdmin, captures: { r2: $.data.id } }
            - { call: "POST /pathology/release-requests/${r2}/approve", as: LabAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /pathology/release-requests/${r2}/deny", payload: { reason: "overlap" }, as: LabAdmin }
            - { call: "POST /pathology/release-requests", payload: { material_type: "SLIDE", slide_id: "${s1}", requesting_institution: "University Hospital", reason: "gapped loan", requested_out_at: "2026-08-20T00:00:01Z", due_back_at: "2026-08-25T00:00:00Z" }, as: LabAdmin, captures: { r3: $.data.id } }
            - { call: "POST /pathology/release-requests/${r3}/approve", as: LabAdmin }
          assert:
            - "touching loan: err == ERR_LOAN_INTERVAL_CONFLICT (closed interval; endpoint contact counts as overlap)"
            - "after r2 is denied, the one-second-gapped r3 approves: ReleaseRequest.${r3}.status == APPROVED"
            - "ReleaseRequest.${r1}.status == REQUESTED throughout (approving r2/r3 does not mutate r1)"

  - rule_id: compensating_invariant
    instances:
      - name: signed_report_count_invariant
        grounds:
          - state_machines.Case.AMENDING_to_FINAL
          - state_machines.Report.DRAFT_to_CANCELLED
          - entities.Case.fields.current_signed_report_id
        distinguishing_aspect: "Conserved quantity is a COUNT invariant: for a FINAL case, exactly one Report has status SIGNED. The forward action (amend creates a DRAFT) paired with its compensation (amend/cancel discards the DRAFT) leaves the SIGNED count at 1 with the ORIGINAL report id still current — no drift."
        test_recipe:
          setup:
            - "GI case signed out by p1; rep1 is the unique SIGNED report (FINAL class, version_number 1)"
          setup_api_calls:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-950", full_name: "Pat Sixteen", date_of_birth: "1959-09-19" }, as: LabAdmin, captures: { pat: $.data.id } }
            - { call: "POST /pathology/pathologists", payload: { full_name: "Dr Invariant", subspecialties: ["GI"] }, as: LabAdmin, captures: { p1: $.data.id } }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI" }, as: LabAdmin, captures: { c1: $.data.id } }
            - { call: "POST /pathology/cases/${c1}/specimens", payload: { patient_mrn: "MRN-950", patient_dob: "1959-09-19", specimen_type: "BIOPSY", anatomical_site: "Colon", collection_datetime: "2026-08-03T09:00:00Z", received_datetime: "2026-08-03T10:00:00Z", container_count: 1 }, as: Histotech, captures: { sp1: $.data.id } }
            - { call: "POST /pathology/specimens/${sp1}/gross", payload: { gross_description: "bx" }, as: PathologyAssistant }
            - { call: "POST /pathology/specimens/${sp1}/blocks", payload: { block_label: "A1" }, as: Histotech, captures: { b1: $.data.id } }
            - { call: "POST /pathology/blocks/${b1}/embed", as: Histotech }
            - { call: "POST /pathology/blocks/${b1}/slides", payload: { slide_label: "A1-1" }, as: Histotech, captures: { s1: $.data.id } }
            - { call: "POST /pathology/slides/${s1}/section", payload: { consumption_pct: 10.0 }, as: Histotech }
            - { call: "POST /pathology/slides/${s1}/stain-complete", as: Histotech }
            - { call: "POST /pathology/slides/${s1}/qc-review", payload: { result: "PASS" }, as: Histotech }
            - { call: "POST /pathology/cases/${c1}/assign", payload: { pathologist_id: "${p1}" }, as: LabAdmin }
            - { call: "POST /pathology/cases/${c1}/submit-for-signout", as: Pathologist, as_user_id: "${p1}" }
            - { call: "POST /pathology/cases/${c1}/sign-out", payload: { diagnosis_text: "benign" }, as: Pathologist, as_user_id: "${p1}" }
            - { call: "GET /pathology/reports", payload: { case_id: "${c1}" }, as: LabAdmin, captures: { rep1: "$.data[0].id" } }
          trigger:
            - { call: "POST /pathology/cases/${c1}/amend", payload: { diagnosis_text: "draft revision", amendment_reason: "typo pass" }, as: Pathologist, as_user_id: "${p1}", captures: { draft: $.data.id } }
            - { call: "POST /pathology/cases/${c1}/amend/cancel", as: Pathologist, as_user_id: "${p1}" }
            - { call: "GET /pathology/cases/${c1}", as: LabAdmin }
            - { call: "GET /pathology/reports/${rep1}", as: LabAdmin }
            - { call: "GET /pathology/reports/${draft}", as: LabAdmin }
          assert:
            - "count of Report rows for case ${c1} with status SIGNED == 1 before the amend and after the amend/cancel round trip"
            - "Case.${c1}.status == FINAL and current_signed_report_id == ${rep1} (unchanged)"
            - "Report.${rep1}.status == SIGNED (never left SIGNED) and Report.${draft}.status == CANCELLED"
      - name: workload_conservation_on_reassign
        grounds:
          - calculations.pathologist_workload_score
          - concurrency_rules[case-reassign-stale-version]
          - entities.Pathologist.fields.workload_score
        distinguishing_aspect: "Conserved quantity is a SCORE ledger (different quantity type from the report-count invariant): assigning a MODERATE case to p1 adds exactly 2.0 to p1.workload_score, and the compensating reassign to p2 returns p1.workload_score to exactly 0.0 while p2 absorbs 2.0 — the pair leaves p1's ledger unchanged."
        test_recipe:
          setup:
            - "GI case in WORKUP scoring 4.5 (RESECTION base 3 + 1 block + 1 slide) hence MODERATE (weight 2); two GI pathologists p1 and p2 with workload 0.0; case version captured after the assignment to p1"
          setup_api_calls:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-951", full_name: "Pat Seventeen", date_of_birth: "1983-12-12" }, as: LabAdmin, captures: { pat: $.data.id } }
            - { call: "POST /pathology/pathologists", payload: { full_name: "Dr First", subspecialties: ["GI"] }, as: LabAdmin, captures: { p1: $.data.id } }
            - { call: "POST /pathology/pathologists", payload: { full_name: "Dr Second", subspecialties: ["GI"] }, as: LabAdmin, captures: { p2: $.data.id } }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI" }, as: LabAdmin, captures: { c1: $.data.id } }
            - { call: "POST /pathology/cases/${c1}/specimens", payload: { patient_mrn: "MRN-951", patient_dob: "1983-12-12", specimen_type: "RESECTION", anatomical_site: "Colon", collection_datetime: "2026-08-03T09:00:00Z", received_datetime: "2026-08-03T10:00:00Z", container_count: 2 }, as: Histotech, captures: { sp1: $.data.id } }
            - { call: "POST /pathology/specimens/${sp1}/gross", payload: { gross_description: "segment" }, as: PathologyAssistant }
            - { call: "POST /pathology/specimens/${sp1}/blocks", payload: { block_label: "A1" }, as: Histotech, captures: { b1: $.data.id } }
            - { call: "POST /pathology/blocks/${b1}/embed", as: Histotech }
            - { call: "POST /pathology/blocks/${b1}/slides", payload: { slide_label: "A1-1" }, as: Histotech }
            - { call: "GET /pathology/pathologists/${p1}", as: LabAdmin, captures: { w_pre: $.data.workload_score } }
            - { call: "POST /pathology/cases/${c1}/assign", payload: { pathologist_id: "${p1}" }, as: LabAdmin }
            - { call: "GET /pathology/pathologists/${p1}", as: LabAdmin, captures: { w_mid: $.data.workload_score } }
            - { call: "GET /pathology/cases/${c1}", as: LabAdmin, captures: { cv: $.data.version } }
          trigger:
            - { call: "POST /pathology/cases/${c1}/reassign", payload: { pathologist_id: "${p2}", expected_case_version: "${cv}" }, as: LabAdmin }
            - { call: "GET /pathology/pathologists/${p1}", as: LabAdmin }
            - { call: "GET /pathology/pathologists/${p2}", as: LabAdmin }
          assert:
            - "before assignment Pathologist.${p1}.workload_score == 0.0 (${w_pre} == 0.0)"
            - "after assignment Pathologist.${p1}.workload_score == 2.0 (${w_mid} == 2.0, COMPLEXITY_WEIGHT[MODERATE])"
            - "after the compensating reassign: Pathologist.${p1}.workload_score == 0.0 (restored) and Pathologist.${p2}.workload_score == 2.0 (absorbed)"
            - "Case.${c1}.assigned_pathologist_id == ${p2}"
