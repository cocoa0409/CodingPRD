  - name: valuation_bid_floor_versus_max_bid_divergence
    claim_type: Variant Divergence
    grounds:
    - calculations.valuation_bid_band.variants
    excluded_because:
      difficulty_instance: dual_variant_calc / valuation_bid_band_pdp_only_versus_risked_upside
      rationale: "Both variants, their pinned per-year rounding and the exact delta between bid_floor and max_bid are computed and asserted by the named §1.8 instance."

  - name: revenue_check_pinned_versus_live_variant_divergence
    claim_type: Variant Divergence
    grounds:
    - calculations.royalty_check_reconciliation.variants
    excluded_because:
      difficulty_instance: dual_variant_calc / revenue_check_pinned_decimal_versus_live_allocation_decimal
      rationale: "The named §1.8 instance drives variance_amount and audit_variance_amount apart on one detail row and proves only the pinned variant routes money."

  - name: defect_basket_waterfall_absorbs_first_dollars
    claim_type: Correct Result
    grounds:
    - calculations.defect_price_adjustment.formula
    excluded_because:
      difficulty_instance: combinatorial_formula / defect_basket_per_defect_rounding_then_sum
      rationale: "The per-defect threshold, the basket waterfall and the termination ceiling are exercised together with pre-computed literals by the named §1.8 instance."

  - name: expected_decimal_constraint_propagation_reaches_fixed_point
    claim_type: Correct Result
    grounds:
    - calculations.expected_decimal_interest.algorithm=constraint_propagation
    excluded_because:
      difficulty_instance: combinatorial_formula / expected_decimal_nested_min_max_with_non_consent_branch
      rationale: "The nested min/max, the NON_CONSENT election factor and the max(0, ...) burden floor are all covered by the named §1.8 instance."

  - name: suspense_accrual_correct_after_reversal
    claim_type: Input Set Filtering
    grounds:
    - calculations.suspense_accrual.input_set
    excluded_because:
      difficulty_instance: compensating_invariant / division_order_net_revenue_total_preserved_across_variance_hold_and_release
      rationale: "The named §1.8 instance shows accrued_amount collapsing to 0.00 once the released details leave the VARIANCE_HELD input set, with the conserved money total unchanged."

