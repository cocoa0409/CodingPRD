      - name: started_at_utc
        type: datetime
        source: input
        description: "Interval start, ISO 8601 UTC."
      - name: ended_at_utc
        type: datetime
        source: input
        description: "Interval end, must be strictly after started_at_utc."
      - name: raw_hours
