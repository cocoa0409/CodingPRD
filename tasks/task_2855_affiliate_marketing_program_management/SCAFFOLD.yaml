      - "GET /tracking-links/{id}"
      - "GET /policy-violation-cases/{id}"
      - "POST /policy-violation-cases/{id}/transition"
      - "GET /commission-ledger-entries"
      - "GET /payout-lines/{id}"
      - "GET /payout-lines"

  - name: TrackingIngestor
    description: >-
      The tracking pixel and order feed. Writes clicks, orders and attribution runs
      and nothing else; it cannot read a partner list or touch a payout.
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /tracking-links/{id}"
      - "POST /tracking-links/{id}/clicks"
      - "GET /tracking-links/{id}/clicks"
      - "POST /conversions"
      - "GET /conversions/{id}"
      - "POST /conversions/{id}/attribute"
      - "POST /conversions/{id}/order-adjustment"
      - "POST /_clock/set_current_utc"

  - name: Anonymous
    description: >-
      Unauthenticated caller. Reaches exactly one route, the partner
      self-registration, and every other route answers ERR_UNAUTHENTICATED.
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /affiliates"
