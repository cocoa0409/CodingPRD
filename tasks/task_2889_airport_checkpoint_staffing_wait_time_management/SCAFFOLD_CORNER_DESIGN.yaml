      - name: lane_assignment_two_axes_advance_independently_on_one_row
        claim_type: parallel_shape
        excluded_because:
          difficulty_instance: "non_linear_state_machine / lane_assignment_break_cycle_runs_parallel_to_duty_axis"
          rationale: "That §1.8 instance already drives break_state through DUE -> ON_BREAK -> COMPLETED -> DUE while assignment_state stays CHECKED_IN, and separately moves assignment_state CHECKED_IN -> REASSIGN_PENDING -> CHECKED_IN while break_state is preserved — the complete parallel-shape claim for this scaffold's only two-axis machine."

      - name: staffing_plan_backward_edge_reopens_the_draft
        claim_type: cyclic_shape
        excluded_because:
          difficulty_instance: "non_linear_state_machine / staffing_plan_rejected_to_draft_revision_cycle"
          rationale: "That §1.8 instance already asserts the REJECTED -> DRAFT backward edge, the revision_number increment, the nulling of all nine cost fields and the second lap through SUBMITTED with a different cost — the whole cyclic-shape claim."

      - name: equipment_fault_cascade_reaches_the_escalation_ticket
        claim_type: cross_entity_side_effect
        excluded_because:
          difficulty_instance: "transitive_cascade / equipment_fault_to_escalation_depth_four"
          rationale: "That §1.8 instance walks all four links (unit OUT_OF_SERVICE -> lane PAUSED -> assignments REASSIGN_PENDING plus posture ELEVATED -> POSTURE_DEGRADATION ticket) and asserts each intermediate state, which is strictly stronger than a single cross-entity side-effect probe."

      - name: plan_approval_supersede_cascade_recomputes_the_officer_ledger
        claim_type: ledger_sync
        excluded_because:
          difficulty_instance: "transitive_cascade / plan_approval_supersede_depth_three"
          rationale: "That §1.8 instance already asserts the depth-3 chain APPROVED plan -> prior plan SUPERSEDED -> its SCHEDULED rows CANCELLED -> Officer.committed_duty_minutes recomputed downward with the officer dropped ON_DUTY -> OFF_DUTY, which is the ledger-sync claim end to end."

  # ===========================================================================
  - section: calculations
    instances:

      - name: lane_requirement_waterfall_fills_lowest_position_index_first
        claim_type: waterfall_allocation
        grounds:
          - calculations.lane_requirement
          - entities.Lane.fields.position_index
        distinguishing_aspect: "The waterfall's only ordering key is position_index ASC. The fixture derates the lane at position 1 to 72 pax and creates the lanes out of order, so an implementation that walks candidates in creation or id order fills a 90-capacity lane first and reports 1 required lane instead of 2 — the count itself changes, not just the order."
        test_recipe:
          setup:
            - "three STANDARD lanes created in position order 3, 2, 1; the position-1 lane is DEGRADED"
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - call: "POST /lanes"
              payload: { checkpoint_id: "${cp_id}", lane_type: "STANDARD", position_index: 3, required_officer_count: 1, max_concurrent_officers: 2, secondary_positions: 0 }
              as: CheckpointManager
              captures: { w_l3: $.data.id }
            - call: "POST /equipment-units"
              payload: { lane_id: "${w_l3}", equipment_type: "WTMD", serial_number: "WT-3", calibration_due_utc: "2027-01-01T00:00:00Z" }
              as: CheckpointManager
            - call: "POST /equipment-units"
              payload: { lane_id: "${w_l3}", equipment_type: "AT_XRAY", serial_number: "XR-3", calibration_due_utc: "2027-01-01T00:00:00Z" }
              as: CheckpointManager
            - call: "POST /equipment-units"
              payload: { lane_id: "${w_l3}", equipment_type: "ADVANCED_IMAGING", serial_number: "AI-3", calibration_due_utc: "2027-01-01T00:00:00Z" }
              as: CheckpointManager
            - call: "POST /lanes"
              payload: { checkpoint_id: "${cp_id}", lane_type: "STANDARD", position_index: 2, required_officer_count: 1, max_concurrent_officers: 2, secondary_positions: 0 }
              as: CheckpointManager
              captures: { w_l2: $.data.id }
            - call: "POST /equipment-units"
              payload: { lane_id: "${w_l2}", equipment_type: "WTMD", serial_number: "WT-2", calibration_due_utc: "2027-01-01T00:00:00Z" }
              as: CheckpointManager
            - call: "POST /equipment-units"
              payload: { lane_id: "${w_l2}", equipment_type: "AT_XRAY", serial_number: "XR-2", calibration_due_utc: "2027-01-01T00:00:00Z" }
              as: CheckpointManager
            - call: "POST /equipment-units"
              payload: { lane_id: "${w_l2}", equipment_type: "ADVANCED_IMAGING", serial_number: "AI-2", calibration_due_utc: "2027-01-01T00:00:00Z" }
              as: CheckpointManager
            - call: "POST /lanes"
              payload: { checkpoint_id: "${cp_id}", lane_type: "STANDARD", position_index: 1, required_officer_count: 1, max_concurrent_officers: 2, secondary_positions: 0 }
              as: CheckpointManager
              captures: { w_l1: $.data.id }
            - call: "POST /equipment-units"
              payload: { lane_id: "${w_l1}", equipment_type: "WTMD", serial_number: "WT-1B", calibration_due_utc: "2027-01-01T00:00:00Z" }
              as: CheckpointManager
              captures: { w_l1_wtmd: $.data.id }
            - call: "POST /equipment-units"
              payload: { lane_id: "${w_l1}", equipment_type: "AT_XRAY", serial_number: "XR-1B", calibration_due_utc: "2027-01-01T00:00:00Z" }
              as: CheckpointManager
            - call: "POST /equipment-units"
              payload: { lane_id: "${w_l1}", equipment_type: "ADVANCED_IMAGING", serial_number: "AI-1B", calibration_due_utc: "2027-01-01T00:00:00Z" }
              as: CheckpointManager
            - call: "POST /equipment-units/${w_l1_wtmd}/report-state"
              payload: { state: "DEGRADED", note: "flaky coil" }
              as: CheckpointManager
              captures: { w_wtmd_state: $.data.state }
            - call: "GET /lanes/${w_l1}"
              payload: {}
              as: CheckpointManager
              captures: { w_l1_eq: $.data.equipment_state, w_l1_state: $.data.lane_state }
            - *c_curve
            - call: "POST /time-bands"
              payload: { checkpoint_id: "${cp_id}", band_start_utc: "2026-09-10T10:00:00Z", expedited_share_pct: 0, seasonal_multiplier: 1.0 }
              as: StaffingPlanner
              captures: { w_band: $.data.id }
            - call: "POST /flight-schedule-entries"
              payload: { checkpoint_id: "${cp_id}", show_up_curve_id: "${curve_id}", flight_number: "AA800", scheduled_departure_utc: "2026-09-10T10:30:00Z", seats_sold: 80, load_factor_pct: 100, carrier_type: "DOMESTIC" }
              as: StaffingPlanner
          trigger:
            - call: "POST /time-bands/${w_band}/forecast"
              payload: { variant: "CURVE_BLENDED" }
              as: StaffingPlanner
              captures: { w_pax: $.data.forecast_pax_count, w_req_std: $.data.required_standard_lanes, w_req_exp: $.data.required_expedited_lanes, w_unmet: $.data.unmet_standard_demand }
          assert:
            - "${w_wtmd_state} == DEGRADED and ${w_l1_eq} == DEGRADED while ${w_l1_state} == CLOSED — a DEGRADED unit derates but does not close"
            - "${w_pax} == 80 (80 seats x 100% load factor, one bucket covering the whole band)"
            - "the waterfall walks position 1 (capacity floor(180 * 30 / 60 * 0.80) = 72), then position 2 (capacity 90): cumulative 72 < 80 so a second lane is consumed, and ${w_req_std} == 2"
            - "an implementation ordering candidates by creation or id starts at the position-3 lane (capacity 90 >= 80) and would answer 1 — the DEGRADED lane at position 1 is what makes the ordering observable"
            - "${w_unmet} == 0 because cumulative capacity reached 162 >= 80"
            - "${w_req_exp} == 0 — MIN_OPEN_LANES.EXPEDITED is 0 and there are no expedited lanes, so the floor does not manufacture a requirement"

      - name: forecast_excludes_cancelled_flights_and_is_not_retroactive
        claim_type: input_set_filtering
        grounds:
          - calculations.time_band_pax_forecast.input_set
          - endpoints.POST_flight-schedule-entries_cancel
        distinguishing_aspect: "Two things must hold at once: a CANCELLED flight leaves the forecast input set, AND cancelling it does NOT retroactively rewrite an already-stored forecast. The stored number only changes on an explicit re-forecast, which is what makes a published plan auditable."
        test_recipe:
          setup: ["one checkpoint, one curve, one band and two flights feeding it"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_lane
            - *c_eq_wtmd
            - *c_eq_xray
            - *c_eq_ai
            - *c_curve
            - *c_band1000
            - *c_flight1030
            - call: "POST /flight-schedule-entries"
              payload: { checkpoint_id: "${cp_id}", show_up_curve_id: "${curve_id}", flight_number: "AA200", scheduled_departure_utc: "2026-09-10T10:30:00Z", seats_sold: 20, load_factor_pct: 50, carrier_type: "DOMESTIC" }
              as: StaffingPlanner
              captures: { fse2_id: $.data.id, fse2_status: $.data.status, fse2_pax: $.data.projected_pax_count }
            - call: "POST /time-bands/${band1_id}/forecast"
              payload: { variant: "CURVE_BLENDED" }
              as: StaffingPlanner
              captures: { pax_two_flights: $.data.forecast_pax_count, variant_stored: $.data.forecast_variant, computed_at: $.data.forecast_computed_at_utc }
          trigger:
            - call: "POST /flight-schedule-entries/${fse2_id}/cancel"
              payload: {}
              as: StaffingPlanner
              captures: { fse2_cancelled: $.data.status }
            - call: "GET /time-bands/${band1_id}"
              payload: {}
              as: StaffingPlanner
              captures: { pax_after_cancel: $.data.forecast_pax_count }
            - call: "POST /time-bands/${band1_id}/forecast"
              payload: { variant: "CURVE_BLENDED" }
              as: StaffingPlanner
              captures: { pax_reforecast: $.data.forecast_pax_count }
          assert:
            - "${fse2_pax} == 10 == round_half_up(20 seats x 50% load factor) and ${fse2_status} == SCHEDULED at creation"
            - "${pax_two_flights} == 20 (10 + 10) with ${variant_stored} == CURVE_BLENDED and ${computed_at} == 2026-09-10T08:00:00Z"
            - "${fse2_cancelled} == CANCELLED"
            - "${pax_after_cancel} == 20 — the cancel did NOT retroactively recompute the stored forecast"
            - "${pax_reforecast} == 10 — the explicit re-forecast drops the CANCELLED flight from the input set"

      - name: published_wait_weights_by_method_and_sample_size_above_three_samples
        claim_type: weighted_scoring
        grounds:
          - calculations.published_wait_time
          - endpoints.GET_checkpoints_wait-time
        distinguishing_aspect: "Below MIN_SAMPLES_FOR_WEIGHTED_AVERAGE (3) publication is the single most recent sample, not an average; at the third sample it switches to a METHOD_WEIGHTS x sample_size weighted mean. The fixture is built so the thin-data answer (15) and the weighted answer (12) differ, and so does the unweighted mean (900/60 = 15 vs 12)."
        test_recipe:
          setup: ["one checkpoint with an open STANDARD lane and a supervisor"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_lane
            - *c_eq_wtmd
            - *c_eq_xray
            - *c_eq_ai
            - *c_open
            - *c_off_sup
          trigger:
            - call: "POST /checkpoints/${cp_id}/wait-observations"
              payload: { lane_type: "STANDARD", sampled_wait_seconds: 600, measurement_method: "BLE_SENSOR", sample_size: 10 }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { p1: $.data.published_wait_minutes_snapshot, p1_breach: $.data.breached_threshold }
            - call: "POST /checkpoints/${cp_id}/wait-observations"
              payload: { lane_type: "STANDARD", sampled_wait_seconds: 900, measurement_method: "MANUAL_TIMESTAMP", sample_size: 5 }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { p2: $.data.published_wait_minutes_snapshot, p2_breach: $.data.breached_threshold }
            - call: "POST /checkpoints/${cp_id}/wait-observations"
              payload: { lane_type: "STANDARD", sampled_wait_seconds: 1200, measurement_method: "STAFF_ESTIMATE", sample_size: 4 }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { p3: $.data.published_wait_minutes_snapshot, p3_breach: $.data.breached_threshold }
            - call: "GET /checkpoints/${cp_id}/wait-time"
              payload: { lane_type: "STANDARD" }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { pub_min: $.data.published_wait_minutes, pub_avg: $.data.weighted_average_seconds, pub_n: $.data.sample_count, pub_thresh: $.data.threshold_minutes, pub_breach: $.data.breached }
            - call: "GET /checkpoints/${cp_id}/wait-time"
              payload: { lane_type: "EXPEDITED" }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { exp_min: $.data.published_wait_minutes, exp_n: $.data.sample_count }
          assert:
            - "${p1} == 10 — one sample, thin-data path, 600 s / 60; ${p1_breach} == false against threshold 15"
            - "${p2} == 15 — still below 3 samples, so publication is the MOST RECENT sample (900 s), not the mean of 600 and 900 (750 s -> 13); ${p2_breach} == true because the comparison is >="
            - "${p3} == 12: weights are 3x10 = 30, 2x5 = 10, 1x4 = 4 (sum 44) and SUM(weight x seconds) = 18000 + 9000 + 4800 = 31800, so weighted_average_seconds = round_half_up(31800/44, 2) = 722.73 and round_half_up(722.73/60) = 12; ${p3_breach} == false"
            - "${pub_min} == 12, ${pub_avg} == \"722.73\" serialized as a 2-decimal string, ${pub_n} == 3, ${pub_thresh} == 15 and ${pub_breach} == false"
            - "${exp_min} == null with ${exp_n} == 0 — STANDARD and EXPEDITED publish independently and no expedited sample exists"
            - "Checkpoint.consecutive_breach_count_standard is 0 after the third observation (breach, then non-breach resets it) and no EscalationTicket was raised, because the run never reached ESCALATION_BREACH_COUNT_REQUIRED = 2"

      - name: plan_cost_rounds_overtime_per_officer_before_summing
        claim_type: precision
        grounds:
          - calculations.staffing_plan_cost
          - endpoints.GET_staffing-plans_cost-summary
        distinguishing_aspect: "Two officers each land on a half-cent overtime component (15 min x 101 c/min x 1.5 = 2272.5). Rounding per officer gives 2273 + 2273 = 4546; summing the exact values and rounding once gives 4545. The one-cent divergence propagates into subtotal, admin fee input and total."
        test_recipe:
          setup:
            - "two STANDARD lanes, two officers at 101 c/min with a 45-minute regular cap, two adjacent 30-minute bands"
