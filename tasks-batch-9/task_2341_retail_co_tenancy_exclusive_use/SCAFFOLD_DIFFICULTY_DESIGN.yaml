- rule_id: combinatorial_formula
  instances:
  - name: rent_reduction_tier_three_plus_anchor_bonus_then_cap
    grounds:
    - calculations.cotenancy_rent_reduction
    - calculations.cotenancy_condition_evaluation
    - entities.RemedyElection.fields.reduction_pct
    - entities.AnchorRequirement.fields.anchor_lease_id
    - concurrency_rules[election-create-stale-lease]
    distinguishing_aspect: 'Mode (a) multi-input interaction: the shortfall 36.67 selects tier multiplier 2.0 (shortfall > 15.00), the named-anchor-dark predicate adds ANCHOR_DARK_BONUS_PCT 10.0, and max_reduction_pct
      90.0 then caps nothing - the four inputs (shortfall band, anchor bonus, MIN floor, cap) must all be composed to reach reduction_pct 83.34 rather than the single-input 73.34.'
    test_recipe:
      setup:
      - Center 300000 GLA with five OPEN leases
      - 'CoTenancyCondition on lease I1: ONGOING, GLA_PCT, required_occupancy_pct 81.67, required_anchor_count 2, grace_period_days 0, cure_period_days 30, remedy_type RENT_REDUCTION_THEN_TERMINATION, max_reduction_pct
        90.0'
      - AnchorRequirement on that condition naming anchor lease A1, substitution_allowed false
      - Anchor lease A1 (120000 sqft) driven DARK so occupied GLA is 135000 = 45.00 pct
