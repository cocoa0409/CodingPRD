      - name: scenario_multiplier_clamped_at_max
        claim_type: constants_applied
        grounds: [calculations.scenario_loss_multiplier]
        distinguishing_aspect: "Extreme macro inputs (u=2000, g=-1000) produce raw mult 52000 bps, clamped to MAX_MULT_BPS 30000; the clamp is visible in segments_breakdown.scenario_mult_bps."
