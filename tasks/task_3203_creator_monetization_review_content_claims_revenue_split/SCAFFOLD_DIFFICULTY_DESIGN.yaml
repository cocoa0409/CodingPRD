              as_user_id: "${ch_f}"
              captures: { i_f: $.data.id }
            - call: "POST /api/channels/${ch_f}/content-items/${i_f}/requests-review"
              payload: {}
              as: Creator
              as_user_id: "${ch_f}"
            - call: "GET /api/claims"
              payload: { content_item_id: "${i_f}" }
              as: Any
              captures: { "cl_f": "$.data[0].id", "cl_fv": "$.data[0].version" }
            - call: "POST /api/channels/${ch_f}/strikes"
              payload: { kind: "COMMUNITY", reason_code: "VIOLENT_CONTENT" }
              as: Moderator
