  - rule_id: resource_temporal_overlap
    instances:

      - name: commission_policy_half_open_window_adjacency_allowed_then_straddle_rejected
        grounds:
          - validations.priority_39_ERR_POLICY_WINDOW_OVERLAP
          - state_machines.CommissionPolicy.DRAFT_to_ACTIVE
          - entities.CommissionPolicy.fields.effective_from
          - entities.CommissionPolicy.fields.effective_to
        distinguishing_aspect: >-
          Policy windows are HALF-OPEN, so a policy starting at the exact instant an
          ACTIVE policy ends must activate successfully, while a third policy that
          starts one day earlier and straddles both must be rejected — the same pair
          of endpoint comparisons has to yield 201 in one case and 409 in the other.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "P1: an ACTIVE CommissionPolicy for APPAREL scoped to CONTENT over [2026-01-01T00:00:00Z, 2026-07-01T00:00:00Z)."
            - "P2: a DRAFT policy for the same category and scope over [2026-07-01T00:00:00Z, 2027-01-01T00:00:00Z) — exactly adjacent to P1."
            - "P3: a DRAFT policy for the same category and scope over [2026-06-30T00:00:00Z, 2026-08-01T00:00:00Z) — straddles the P1/P2 seam."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
            - call: "POST /commission-policies"
              payload: { policy_code: "APPAREL-CONTENT-H1", product_category: "APPAREL", partner_type_scope: ["CONTENT"], new_customer_rate_bps: 900, returning_customer_rate_bps: 400, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { p1_id: $.data.id, p1_v1: $.data.version }
            - call: "POST /commission-policies/${p1_id}/activate"
              payload: { expected_policy_version: "${p1_v1}" }
              as: ProgramAdmin
              as_user_id: "adm-001"
            - call: "POST /commission-policies"
              payload: { policy_code: "APPAREL-CONTENT-H2", product_category: "APPAREL", partner_type_scope: ["CONTENT"], new_customer_rate_bps: 950, returning_customer_rate_bps: 450, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { p2_id: $.data.id, p2_v1: $.data.version }
            - call: "POST /commission-policies"
              payload: { policy_code: "APPAREL-CONTENT-STRADDLE", product_category: "APPAREL", partner_type_scope: ["CONTENT"], new_customer_rate_bps: 1000, returning_customer_rate_bps: 500, effective_from: "2026-06-30T00:00:00Z", effective_to: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { p3_id: $.data.id, p3_v1: $.data.version }
          trigger:
            - call: "POST /commission-policies/${p2_id}/activate"
              payload: { expected_policy_version: "${p2_v1}" }
              as: ProgramAdmin
              as_user_id: "adm-001"
            - call: "POST /commission-policies/${p3_id}/activate"
              payload: { expected_policy_version: "${p3_v1}" }
              as: ProgramAdmin
              as_user_id: "adm-001"
            - call: "GET /commission-policies"
              payload: { product_category: "APPAREL", status: "ACTIVE", limit: 10, offset: 0 }
              as: ProgramAdmin
              as_user_id: "adm-001"
          assert:
            - "activating P2 returns HTTP 200 and CommissionPolicy.${p2_id}.status == \"ACTIVE\" — a window starting exactly where P1 ends does not overlap"
            - "CommissionPolicy.${p1_id}.status is still \"ACTIVE\" and superseded_by_policy_id is null — adjacency is not supersession"
            - "activating P3 returns status 409 with error_id == \"ERR_POLICY_WINDOW_OVERLAP\""
            - "CommissionPolicy.${p3_id}.status is still \"DRAFT\" and version == ${p3_v1}"
            - "GET /commission-policies?product_category=APPAREL&status=ACTIVE has total_count == 2"

      - name: monitoring_scan_closed_window_touch_and_cooldown_boundary
        grounds:
          - validations.priority_38_ERR_SCAN_WINDOW_OVERLAP
          - entities.MonitoringScan.fields.window_start
          - entities.MonitoringScan.fields.window_end
          - errors.ERR_SCAN_WINDOW_OVERLAP
        distinguishing_aspect: >-
          Scan windows are CLOSED, so a second scan starting at the exact instant the
          first ends is a touch and must be rejected, and the 24-hour cooldown makes a
          12-hour gap fail while a gap of exactly 24 hours succeeds — the opposite
          endpoint convention from the half-open commission-policy windows in the
          sibling instance, on the same domain. A different engine over the identical
          window is always allowed.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Network and one ACTIVE CONTENT partner."
            - "Scan 1: engine GOOGLE_ADS over the closed window [2026-07-01T00:00:00Z, 2026-07-15T00:00:00Z] with every signal at zero, so it opens no cases."
