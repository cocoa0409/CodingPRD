      - name: strict_cycle_refuses_the_lookback_date_that_carryover_allowed_accepts
        claim_type: conditional
        grounds:
          - validations[priority=33]
          - errors.ERR_ACTIVITY_OUTSIDE_CYCLE
          - calculations.ceu_credit_accrual.variants.STRICT_CYCLE
          - entities.RecertificationCycle.fields.accrual_basis_snapshot
        distinguishing_aspect: |
          The window rule is conditional on the cycle's snapshot flag: under STRICT_CYCLE the
