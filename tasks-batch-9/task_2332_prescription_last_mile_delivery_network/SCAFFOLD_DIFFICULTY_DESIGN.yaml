          - entities.Courier.fields.rolling_reliability_score
          - entities.Courier.fields.lifetime_reliability_score
          - entities.DeliveryAttempt.fields.reliability_credit
        distinguishing_aspect: |
          This dual variant lives in a different entity domain — courier risk scoring on Courier, not
          cost accounting on Delivery: over the identical attempt history [NO_ANSWER, DELIVERED,
