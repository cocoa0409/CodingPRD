          setup:
            - "Agency ag1 is CLEARED; contract c1 has one rate card so SEND_FOR_SIGNATURE is legal."
            - "Application a1 has an ACKNOWLEDGED disclosure pinned at disclosure_template_version 1; application a2 has an ISSUED (never acknowledged) disclosure."
