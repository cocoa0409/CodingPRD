  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: worker_double_book_overlap_halfopen_adjacency_ok
        grounds:
          - validations[priority=11]
          - errors[ERR_WORKER_UNAVAILABLE]
          - entities.Assignment.fields.shift_id
        distinguishing_aspect: |
          Resource = Worker's assignment set, HALF-OPEN [start,end) semantics: a new
          shift 2026-06-02T13:00..17:00 OVERLAPS an existing 2026-06-02T10:00..14:00
          assignment and is rejected, while a back-to-back 2026-06-02T14:00..18:00
          (gap == 0, adjacency) would be allowed. The overlapping case is triggered here.
        test_recipe:
          setup:
            - "Location L; worker W has a SCHEDULED assignment 2026-06-02T10:00..14:00"
            - "A second shift 2026-06-02T13:00..17:00 (overlaps by 1h) posted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations"
              payload: { name: "L", time_zone: "UTC", overtime_cost_guardrail_cents: 100000000, predictability_pay_enabled: false, advance_notice_days: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { loc: $.data.id }
            - call: "POST /locations/${loc}/workers"
              payload: { full_name: "W", email: "w@x.com", base_hourly_rate_cents: 2000 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { w: $.data.id }
            - call: "POST /locations/${loc}/pay-periods"
              payload: { start_utc: "2026-06-01T00:00:00Z", end_utc: "2026-06-08T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/shifts"
              payload: { role_name: "Cashier", start_utc: "2026-06-02T10:00:00Z", end_utc: "2026-06-02T14:00:00Z", headcount_required: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { s1: $.data.id }
            - call: "POST /locations/${loc}/shifts/${s1}/post"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/assignments"
              payload: { shift_id: "${s1}", worker_id: "${w}" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/shifts"
              payload: { role_name: "Cashier", start_utc: "2026-06-02T13:00:00Z", end_utc: "2026-06-02T17:00:00Z", headcount_required: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { s2: $.data.id }
            - call: "POST /locations/${loc}/shifts/${s2}/post"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /locations/${loc}/assignments"
              payload: { shift_id: "${s2}", worker_id: "${w}" }
              as: Manager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_WORKER_UNAVAILABLE"

      - name: unavailable_window_closed_boundary_touch_blocks
        grounds:
          - validations[priority=11]
          - errors[ERR_WORKER_UNAVAILABLE]
          - entities.Availability.fields.kind
        distinguishing_aspect: |
          Different resource entity (Availability) and different interval semantics:
          an UNAVAILABLE window [10:00,14:00] uses CLOSED boundaries, so a shift
          starting EXACTLY at the window's closing instant 2026-06-02T14:00 TOUCHES
          the boundary and is blocked — the opposite of the half-open adjacency rule
          on the Worker assignment set.
        test_recipe:
          setup:
            - "Location L; worker W with an UNAVAILABLE window 2026-06-02T10:00..14:00"
            - "A shift 2026-06-02T14:00..18:00 (touches the closed window boundary at 14:00) posted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations"
              payload: { name: "L", time_zone: "UTC", overtime_cost_guardrail_cents: 100000000, predictability_pay_enabled: false, advance_notice_days: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { loc: $.data.id }
            - call: "POST /locations/${loc}/workers"
              payload: { full_name: "W", email: "w@x.com", base_hourly_rate_cents: 2000 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { w: $.data.id }
            - call: "POST /locations/${loc}/pay-periods"
              payload: { start_utc: "2026-06-01T00:00:00Z", end_utc: "2026-06-08T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /workers/${w}/availability"
              payload: { kind: "UNAVAILABLE", start_utc: "2026-06-02T10:00:00Z", end_utc: "2026-06-02T14:00:00Z" }
              as: Worker
              as_user_id: "${w}"
            - call: "POST /locations/${loc}/shifts"
              payload: { role_name: "Cashier", start_utc: "2026-06-02T14:00:00Z", end_utc: "2026-06-02T18:00:00Z", headcount_required: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { s: $.data.id }
            - call: "POST /locations/${loc}/shifts/${s}/post"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /locations/${loc}/assignments"
              payload: { shift_id: "${s}", worker_id: "${w}" }
              as: Manager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_WORKER_UNAVAILABLE"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: assign_then_cancel_conserves_projected_cost
        grounds:
          - state_machines.Assignment.SCHEDULED_to_CANCELLED
          - calculations.pay_period_projected_cost
          - entities.PayPeriod.fields.projected_labor_cost_cents
          - entities.Assignment.fields.provisional_cost_cents
        distinguishing_aspect: |
          Conserved quantity #1 = PayPeriod.projected_labor_cost_cents (currency).
          With predictability disabled, assigning a worker (adds its provisional cost)
          and then cancelling that same assignment (removes exactly that provisional
          cost) leaves projected_labor_cost_cents identical to its pre-assignment
          value (0). Invariant: projected == sum over non-terminal provisional costs.
        test_recipe:
          setup:
            - "Location L predictability OFF; worker W; PayPeriod PP empty (projected 0)"
            - "An 8h shift posted; W assigned (projected becomes 16000) then cancelled"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-30T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations"
              payload: { name: "L", time_zone: "UTC", overtime_cost_guardrail_cents: 100000000, predictability_pay_enabled: false, advance_notice_days: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { loc: $.data.id }
            - call: "POST /locations/${loc}/workers"
              payload: { full_name: "W", email: "w@x.com", base_hourly_rate_cents: 2000 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { w: $.data.id }
            - call: "POST /locations/${loc}/pay-periods"
              payload: { start_utc: "2026-06-01T00:00:00Z", end_utc: "2026-06-08T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
              captures: { pp: $.data.id }
            - call: "POST /locations/${loc}/shifts"
              payload: { role_name: "Cashier", start_utc: "2026-06-02T09:00:00Z", end_utc: "2026-06-02T17:00:00Z", headcount_required: 1 }
              as: Manager
              as_user_id: "mgr-1"
              captures: { s: $.data.id }
            - call: "POST /locations/${loc}/shifts/${s}/post"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations/${loc}/assignments"
              payload: { shift_id: "${s}", worker_id: "${w}" }
              as: Manager
              as_user_id: "mgr-1"
              captures: { a: $.data.id }
          trigger:
            - call: "POST /locations/${loc}/assignments/${a}/cancel"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
            - call: "GET /pay-periods/${pp}"
              payload: {}
              as: Manager
              as_user_id: "mgr-1"
          assert:
            - "Assignment.${a}.status == CANCELLED"
            - "PayPeriod.${pp}.projected_labor_cost_cents == 0"

      - name: assign_then_cancel_conserves_headcount_filled
        grounds:
          - state_machines.Shift.OPEN_to_FULLY_STAFFED
          - state_machines.Shift.FULLY_STAFFED_to_OPEN
          - entities.Shift.fields.headcount_filled
          - state_machines.Assignment.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity #2 = Shift.headcount_filled (a count, not currency):
          assigning a worker (headcount_filled 0->1, shift OPEN->FULLY_STAFFED) and
          then cancelling (headcount_filled 1->0, shift FULLY_STAFFED->OPEN) restores
          headcount_filled to 0. Invariant: headcount_filled == count of non-terminal
          assignments on the shift.
        test_recipe:
          setup:
            - "Location L; worker W; single-seat shift S posted (headcount_filled 0)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-30T00:00:00Z" }
              as: Manager
