            - { call: "POST /mill/species-profiles", payload: { species_code: "HARD_MAPLE", common_name: "Hard Maple", density_class: "MEDIUM", tangential_shrinkage_coefficient: 0.135, target_moisture_pct: 7.0, max_moisture_gradient_pp: 1.5 }, as: MillAdmin, captures: { maple_id: "$.data.id" } }
