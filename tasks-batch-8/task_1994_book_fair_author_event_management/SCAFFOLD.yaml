    roles: [Organizer]
    code: 200
    input: [qty]
    output: StockLine
    side_effects: ["qty_damaged += qty", "qty_available_for_sale recomputed"]

  # --- Author bookings ---
  - method: POST
    path: "/author-bookings"
    description: "Organizer invites an author (INVITED, round 1, offered_by ORGANIZER)"
    roles: [Organizer]
    code: 201
    input: [fair_id, author_party_id, base_honorarium_cents, travel_cap_cents, bonus_threshold_attendees, bonus_base_cents, bonus_per_attendee_cents, offer_expiry_hours]
    output: AuthorBooking
    side_effects: ["status=INVITED", "offer_expires_at = clock + offer_expiry_hours"]
  - method: GET
    path: "/author-bookings"
    description: "List bookings (FK reverse for fair_id, author_party_id)"
    roles: [Organizer, SchoolCoordinator, PublisherRep, AuthorRep, Cashier, LineStaff]
    code: 200
    input: ["fair_id?", "author_party_id?", "status?", "limit?", "offset?"]
    output: AuthorBooking[]
    side_effects: []
  - method: GET
    path: "/author-bookings/{id}"
    description: "Read a booking (terms, counters, settlement)"
    roles: [Organizer, SchoolCoordinator, PublisherRep, AuthorRep, Cashier, LineStaff]
    code: 200
    input: []
    output: AuthorBooking
    side_effects: []
  - method: POST
    path: "/author-bookings/{id}/counter"
    description: "Counter the live offer; flips INVITED<->NEGOTIATING; OCC-guarded"
    roles: [Organizer, AuthorRep]
    code: 200
    input: [base_honorarium_cents, travel_cap_cents, bonus_threshold_attendees, bonus_base_cents, bonus_per_attendee_cents, offer_expiry_hours, expected_booking_version]
    output: AuthorBooking
    side_effects: ["status flips INVITED<->NEGOTIATING", "offered_by flips", "negotiation_round += 1", "offer_expires_at reset", "increments AuthorBooking.version by 1"]
  - method: POST
    path: "/author-bookings/{id}/accept"
    description: "Accept the live offer (non-offering side only)"
    roles: [Organizer, AuthorRep]
    code: 200
    input: []
    output: AuthorBooking
    side_effects: ["status -> CONFIRMED"]
  - method: POST
    path: "/author-bookings/{id}/decline"
