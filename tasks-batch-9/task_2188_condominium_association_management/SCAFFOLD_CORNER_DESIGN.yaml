            - call: "POST /work-orders"
              as: CommunityManager
              payload: { contract_id: "${contract1}", element_id: "${element1}", scope: "Annual traction inspection", window_start: "2026-08-06T08:00:00Z", window_end: "2026-08-06T16:00:00Z", estimated_cost_cents: 1000000, expected_contract_version: "${contract_v2}" }
              captures: { woB: "$.data.id" }
