      - name: dispatch_blocked_until_a_permit_covers_the_order
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_10_ERR_PERMIT_NOT_APPROVED
          - errors.ERR_PERMIT_NOT_APPROVED
          - entities.Jobsite.fields.requires_sidewalk_closure
        excluded_because:
          difficulty_instance: dispatch_requires_approved_permit_covering_the_whole_order
          rationale: "The named §1.8 instance walks the permit from DRAFT through SUBMITTED to APPROVED, asserting the dispatch refusal at each non-approved state and the success only once an APPROVED permit covers the order."

      - name: state_error_outranks_the_credit_hold_refusal
        claim_type: priority_conflict
        grounds:
          - validations.priority_9_ERR_WORK_ORDER_STATE
          - validations.priority_25_ERR_ACCOUNT_CREDIT_HOLD
        excluded_because:
          difficulty_instance: work_order_state_error_precedes_credit_hold_on_dispatch
          rationale: "The named §1.8 instance builds a request that violates both rules at once and asserts the priority-9 error, then relaxes the state violation to expose the priority-25 error from the same request shape."

      - name: certification_check_runs_before_the_crew_calendar
        claim_type: cascading_validation
        grounds:
          - validations.priority_12_ERR_CREW_NOT_CERTIFIED
          - validations.priority_14_ERR_CREW_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: crew_certification_precedes_crew_window_conflict
          rationale: "The named §1.8 instance dispatches an uncertified crew with a colliding calendar and asserts the certification error, then repeats with a certified crew to expose the window conflict that was masked."

  - section: endpoints
    instances:

      - name: crew_registry_create_read_and_filtered_list
        claim_type: standard_crud
        grounds:
          - endpoints.POST /fence-rentals/crews
          - endpoints.GET /fence-rentals/crews/{id}
          - endpoints.GET /fence-rentals/crews
          - entities.Crew.fields.certified_for_solid_screen
        distinguishing_aspect: |
          The crew registry is the one resource both PlatformAdmin and
          DispatchCoordinator may create, and its two list filters are
          independent: three crews across two depots yield total_count 2 for
          depot_code DEP-1, total_count 1 for certified_for_solid_screen true,
          and a limit-1 page of the DEP-1 filter reports has_more true against
          the filtered total rather than the global one.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "No crews yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fence-rentals/crews"
              payload: { crew_code: "CRW-A", depot_code: "DEP-1", daily_capacity_hours: 12.0 }
              as: DispatchCoordinator
              as_user_id: "dc-001"
              captures: { c1_id: "$.data.id" }
            - call: "POST /fence-rentals/crews"
              payload: { crew_code: "CRW-B", depot_code: "DEP-1", daily_capacity_hours: 12.0, certified_for_solid_screen: true }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { c2_id: "$.data.id" }
            - call: "POST /fence-rentals/crews"
              payload: { crew_code: "CRW-C", depot_code: "DEP-2", daily_capacity_hours: 8.0 }
              as: DispatchCoordinator
              as_user_id: "dc-001"
              captures: { c3_id: "$.data.id" }
            - call: "GET /fence-rentals/crews/${c2_id}"
              payload: {}
              as: AccountManager
              as_user_id: "am-001"
