      - name: bsa_aggregate_amount_excludes_cleared_items_and_freezes_at_submit
        claim_type: aggregation
        grounds:
          - calculations.bsa_aggregate_amount
          - entities.BsaReferral.fields.aggregate_amount_cents
          - entities.DepositItem.fields.status
        distinguishing_aspect: "With a 50000-cent PENDING item, a 60000-cent CLEARED item and a 70000-cent RETURNED item on the case's only account, aggregate_amount_cents freezes at 120000 at submit time, excluding the cleared item entirely."
        test_recipe:
          setup:
            - "One ACTIVE DepositAccount holding three CHECK deposits of 50000 (left PENDING), 60000 (settled CLEARED) and 70000 (settled RETURNED with reason NSF)."
            - "A MULE FraudCase on that account, advanced and SUBSTANTIATED, with one DRAFT BsaReferral."
