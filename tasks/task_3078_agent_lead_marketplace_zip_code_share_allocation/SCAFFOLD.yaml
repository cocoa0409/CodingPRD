errors:
- id: ERR_UNAUTHENTICATED
  http: 401
  condition: Missing or malformed X-User-Role / X-User-ID headers
- id: ERR_UNAUTHORIZED
  http: 403
  condition: Role not permitted for this endpoint per §1.7 RBAC
- id: ERR_VALIDATION
  http: 400
  condition: Malformed body, missing required field, or field constraint violation (enum, range, format)
- id: ERR_MARKET_NOT_FOUND
  http: 404
  condition: Market id does not exist
- id: ERR_BROKERAGE_NOT_FOUND
