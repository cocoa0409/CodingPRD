              as_user_id: "clerk-1"
              captures: { enc_id: $.data.id }
            - call: "POST /encounters/${enc_id}/disclosure-decision"
              payload: { decision: "ACKNOWLEDGED" }
              as: RegistrationClerk
              as_user_id: "clerk-1"
            - call: "POST /encounters/${enc_id}/begin-mse"
              payload: {}
              as: EmergencyPhysician
              as_user_id: "doc-1"
            - call: "POST /encounters/${enc_id}/complete-mse"
              payload: { stabilization_status: "STABLE" }
              as: EmergencyPhysician
              as_user_id: "doc-1"
            - call: "POST /encounters/${enc_id}/ancillary-orders"
