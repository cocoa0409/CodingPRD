            - { call: "POST /api/plans/${p2}/transition", payload: { to_status: SUBMITTED }, as: Investigator, as_user_id: "inv-1" }
            - { call: "POST /api/plans/${p2}/transition", payload: { to_status: APPROVED }, as: InvestigationsManager, as_user_id: "mgr-1" }
            - call: "GET /api/cases/${case_id}"
              as: Investigator
              captures: { case_status: $.data.status }
          assert:
            - "InvestigationPlan.${p1}.status == SUPERSEDED after the second create"
            - "InvestigationPlan.${p2}.plan_version == 2"
            - "Case.${case_id}.status == FIELDWORK after the loop resolved with an approval"

