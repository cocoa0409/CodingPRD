  # =========================================================================
  # RULE 4 - transitive_cascade
  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: impose_cascade_five_hops_reaches_a_sibling_case_and_vacates_its_proposal
        grounds:
          - state_machines.Sanction.PROPOSED_to_IMPOSED
          - state_machines.Sanction.PROPOSED_to_VACATED
          - calculations.cross_course_pattern_points
          - calculations.case_severity_index
          - calculations.sanction_ladder_placement
          - endpoints[POST /integrity/sanctions/{id}/impose]
          - entities.Student.fields.prior_upheld_count
          - entities.Student.fields.active_sanction_points
        distinguishing_aspect: |
          ONE call - impose on case A's sanction - must propagate five hops and land on a DIFFERENT case.
          HOP 1 touches the sanction, HOP 2 both of case A's state dimensions, HOP 3 the Student aggregate,
          HOP 4 re-derives sibling case B's severity from the Student aggregate that HOP 3 just changed
          (both cross_course_pattern_points 0 -> 4, because case A only now counts as a decided RESPONSIBLE
          case in another course, and prior_escalation_points 0 -> 8), and HOP 5 vacates case B's
          already-PROPOSED rank-3 sanction because the band recomputed in HOP 4 no longer contains it.
          An implementation that stops at HOP 3 leaves B at severity 44.00 / band [2,4] and its proposal
          alive; one that recomputes B's escalation from the FINAL index instead of the provisional one
          gets 14 points and severity 62.00. Only the full five-hop chain in the pinned order yields 56.00.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z, advanced to 2026-08-20T10:00:00Z for the hearing and the impose"
            - "one student with TWO open cases in DIFFERENT ENGL courses, both built on SEED-A evidence (evidence_strength_score 60.00, PLAGIARISM base 20)"
            - "case A on ENGL-201 goes FORMAL and is DECIDED RESPONSIBLE with panel_severity_recommendation 4, so its band is [3,5] and a rank-4 TRANSCRIPT_NOTATION_ONLY sanction sits PROPOSED"
            - "case B on ENGL-202 goes INFORMAL and already carries a PROPOSED rank-3 GRADE_PENALTY_COURSE sanction inside its then-current band [2,4]"
            - "at the moment of the trigger the student's prior_upheld_count is 0 and active_sanction_points is 0"
