# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# task_0180_volunteer_management (Expert)
# Breadth probe over §1.1–§1.7 claims not already covered by §1.8.
# Sections/claim_types from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_organization_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Organization, endpoints]
        distinguishing_aspect: "POST /vm/organizations with only name returns 201, status ACTIVE, version 1, reliability_suspension_threshold 40, no_show_strike_limit 3 (defaults applied)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /vm/organizations"
              payload: { name: "Fresh Org" }
              as: ComplianceOfficer
              captures: { org_id: $.data.id, st: $.data.status }
          assert:
            - "response status == 201"
            - "Organization.${org_id}.status == ACTIVE"
            - "Organization.${org_id}.version == 1"
            - "Organization.${org_id}.reliability_suspension_threshold == 40"
            - "Organization.${org_id}.no_show_strike_limit == 3"

      - name: create_volunteer_missing_email_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Volunteer.fields.email]
        distinguishing_aspect: "POST /vm/volunteers without the required email field returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["An ACTIVE Organization exists."]
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Org" }
              as: ComplianceOfficer
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /vm/volunteers"
              payload: { organization_id: "${org_id}", full_name: "No Email" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: volunteer_computed_fields_ignore_client_input
        claim_type: Computed Fields
        grounds:
          - entities.Volunteer.fields.reliability_score
          - entities.Volunteer.fields.bg_check_tier
          - entities.Volunteer.fields.milestone_tier
        distinguishing_aspect: "Computed fields are server-initialized: a new Volunteer has reliability_score 100, bg_check_tier NONE, milestone_tier NONE, total_verified_hours 0, lifetime_no_show_count 0."
        test_recipe:
          setup: ["An ACTIVE Organization exists."]
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Org" }
              as: ShiftCoordinator
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /vm/volunteers"
              payload: { organization_id: "${org_id}", full_name: "New V", email: "new@x.com" }
              as: ShiftCoordinator
              captures: { vol_id: $.data.id }
          assert:
            - "Volunteer.${vol_id}.reliability_score == 100"
            - "Volunteer.${vol_id}.bg_check_tier == NONE"
            - "Volunteer.${vol_id}.milestone_tier == NONE"
            - "Volunteer.${vol_id}.total_verified_hours == 0"
            - "Volunteer.${vol_id}.lifetime_no_show_count == 0"

      - name: get_volunteer_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Volunteer
          - errors[ERR_VOLUNTEER_NOT_FOUND]
        distinguishing_aspect: "GET /vm/volunteers/{id} with a non-existent UUID returns ERR_VOLUNTEER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB with one org so headers are valid."]
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Org" }
              as: ShiftCoordinator
          trigger:
            - call: "GET /vm/volunteers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ShiftCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_VOLUNTEER_NOT_FOUND"

      - name: create_shift_invalid_times_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Shift.fields.starts_at
          - entities.Shift.fields.ends_at
          - errors[ERR_INVALID_SHIFT_TIMES]
        distinguishing_aspect: "POST /vm/shifts with ends_at not strictly after starts_at returns ERR_INVALID_SHIFT_TIMES (400)."
        test_recipe:
          setup: ["A DRAFT Opportunity in an ACTIVE Org."]
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Org" }
              as: ShiftCoordinator
              captures: { org_id: $.data.id }
            - call: "POST /vm/opportunities"
              payload: { organization_id: "${org_id}", title: "Opp" }
              as: ShiftCoordinator
              captures: { opp_id: $.data.id }
          trigger:
            - call: "POST /vm/shifts"
              payload: { opportunity_id: "${opp_id}", starts_at: "2026-07-01T12:00:00Z", ends_at: "2026-07-01T12:00:00Z", capacity: 2 }
              as: ShiftCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "data.error_id == ERR_INVALID_SHIFT_TIMES"

      - name: create_shift_zero_capacity_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Shift.fields.capacity
          - errors[ERR_INVALID_CAPACITY]
        distinguishing_aspect: "POST /vm/shifts with capacity 0 returns ERR_INVALID_CAPACITY (400) — capacity must be >= 1."
        test_recipe:
          setup: ["A DRAFT Opportunity in an ACTIVE Org."]
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Org" }
              as: ShiftCoordinator
              captures: { org_id: $.data.id }
            - call: "POST /vm/opportunities"
              payload: { organization_id: "${org_id}", title: "Opp" }
              as: ShiftCoordinator
              captures: { opp_id: $.data.id }
          trigger:
            - call: "POST /vm/shifts"
              payload: { opportunity_id: "${opp_id}", starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T12:00:00Z", capacity: 0 }
              as: ShiftCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "data.error_id == ERR_INVALID_CAPACITY"

      - name: list_volunteers_pagination_envelope
        claim_type: Listing
        grounds: [entities.Volunteer, endpoints]
        distinguishing_aspect: "GET /vm/volunteers returns response_type array with pagination fields total_count and has_more; organization_id filter scopes results."
        test_recipe:
          setup: ["An Org with two volunteers."]
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Org" }
              as: ShiftCoordinator
              captures: { org_id: $.data.id }
            - call: "POST /vm/volunteers"
              payload: { organization_id: "${org_id}", full_name: "A", email: "a@x.com" }
              as: ShiftCoordinator
            - call: "POST /vm/volunteers"
              payload: { organization_id: "${org_id}", full_name: "B", email: "b@x.com" }
              as: ShiftCoordinator
          trigger:
            - call: "GET /vm/volunteers?organization_id=${org_id}&limit=1&offset=0"
              payload: {}
              as: ShiftCoordinator
          assert:
            - "response_type == array"
            - "meta total_count == 2 and has_more == true"
            - "returned array length == 1"

      - name: immutable_volunteerskill_has_no_version_field
        claim_type: Immutability
        grounds: [entities.VolunteerSkill]
        distinguishing_aspect: "VolunteerSkill is common_fields:false — its create response carries id and created_at but no version; proficiency defaults to VERIFIED; there is no update endpoint."
        test_recipe:
          setup: ["An Org with a Volunteer and a Skill."]
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Org" }
              as: ShiftCoordinator
              captures: { org_id: $.data.id }
            - call: "POST /vm/volunteers"
              payload: { organization_id: "${org_id}", full_name: "V", email: "v@x.com" }
              as: ShiftCoordinator
              captures: { vol_id: $.data.id }
            - call: "POST /vm/skills"
              payload: { organization_id: "${org_id}", code: "FIRST_AID", label: "First Aid" }
              as: ShiftCoordinator
              captures: { skill_id: $.data.id }
          trigger:
            - call: "POST /vm/volunteer-skills"
              payload: { volunteer_id: "${vol_id}", skill_id: "${skill_id}" }
              as: ShiftCoordinator
              captures: { vs_id: $.data.id, prof: $.data.proficiency }
          assert:
            - "response status == 201"
            - "VolunteerSkill.${vs_id}.proficiency == VERIFIED"
            - "VolunteerSkill.${vs_id} response has no version field"

      - name: create_volunteer_in_archived_org_rejected
        claim_type: Parent Relationships
        grounds:
          - entities.Organization.fields.status
          - errors[ERR_ORGANIZATION_ARCHIVED]
        distinguishing_aspect: "Creating a Volunteer under an ARCHIVED Organization returns ERR_ORGANIZATION_ARCHIVED (409)."
        test_recipe:
          setup: ["An Organization that has been archived."]
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Org" }
              as: ComplianceOfficer
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /vm/organizations/${org_id}/archive"
              payload: { expected_organization_version: "${org_v}" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /vm/volunteers"
              payload: { organization_id: "${org_id}", full_name: "Late V", email: "late@x.com" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_ORGANIZATION_ARCHIVED"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: confirm_already_confirmed_signup_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Signup.RESERVED_to_CONFIRMED
          - errors[ERR_SIGNUP_NOT_RESERVED]
        distinguishing_aspect: "Confirming a Signup already CONFIRMED returns ERR_SIGNUP_NOT_RESERVED (409); re-confirm is not idempotent."
        test_recipe:
          setup: ["A CONFIRMED Signup."]
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Org" }
              as: ShiftCoordinator
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ShiftCoordinator
            - call: "POST /vm/volunteers"
              payload: { organization_id: "${org_id}", full_name: "V", email: "v@x.com" }
              as: ShiftCoordinator
              captures: { vol_id: $.data.id }
            - call: "POST /vm/opportunities"
              payload: { organization_id: "${org_id}", title: "Opp" }
              as: ShiftCoordinator
              captures: { opp_id: $.data.id }
            - call: "POST /vm/shifts"
              payload: { opportunity_id: "${opp_id}", starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T12:00:00Z", capacity: 2 }
              as: ShiftCoordinator
              captures: { shift_id: $.data.id, shift_v: $.data.version }
            - call: "POST /vm/opportunities/${opp_id}/publish"
              payload: {}
              as: ShiftCoordinator
            - call: "POST /vm/shifts/${shift_id}/signups"
              payload: { volunteer_id: "${vol_id}", expected_shift_version: "${shift_v}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { su_id: $.data.id }
            - call: "POST /vm/signups/${su_id}/confirm"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
          trigger:
            - call: "POST /vm/signups/${su_id}/confirm"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_SIGNUP_NOT_RESERVED"

      - name: cancel_cancelled_signup_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Signup.RESERVED_to_CANCELLED
          - errors[ERR_SIGNUP_NOT_CANCELLABLE]
        distinguishing_aspect: "From terminal CANCELLED, a second cancel returns ERR_SIGNUP_NOT_CANCELLABLE (409); no seat is double-released."
        test_recipe:
          setup: ["A CANCELLED Signup (reserved then cancelled)."]
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Org" }
              as: ShiftCoordinator
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ShiftCoordinator
            - call: "POST /vm/volunteers"
              payload: { organization_id: "${org_id}", full_name: "V", email: "v@x.com" }
              as: ShiftCoordinator
              captures: { vol_id: $.data.id }
            - call: "POST /vm/opportunities"
              payload: { organization_id: "${org_id}", title: "Opp" }
              as: ShiftCoordinator
              captures: { opp_id: $.data.id }
            - call: "POST /vm/shifts"
              payload: { opportunity_id: "${opp_id}", starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T12:00:00Z", capacity: 2 }
              as: ShiftCoordinator
              captures: { shift_id: $.data.id, shift_v: $.data.version }
            - call: "POST /vm/opportunities/${opp_id}/publish"
              payload: {}
              as: ShiftCoordinator
            - call: "POST /vm/shifts/${shift_id}/signups"
              payload: { volunteer_id: "${vol_id}", expected_shift_version: "${shift_v}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { su_id: $.data.id }
            - call: "POST /vm/signups/${su_id}/cancel"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
          trigger:
            - call: "POST /vm/signups/${su_id}/cancel"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_SIGNUP_NOT_CANCELLABLE"

      - name: publish_opportunity_without_shifts_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Opportunity.DRAFT_to_PUBLISHED
          - errors[ERR_OPPORTUNITY_HAS_NO_SHIFTS]
        distinguishing_aspect: "Publishing a DRAFT Opportunity with zero child Shifts returns ERR_OPPORTUNITY_HAS_NO_SHIFTS (409)."
        test_recipe:
          setup: ["A DRAFT Opportunity with no shifts."]
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Org" }
              as: ShiftCoordinator
              captures: { org_id: $.data.id }
            - call: "POST /vm/opportunities"
              payload: { organization_id: "${org_id}", title: "Empty Opp" }
              as: ShiftCoordinator
              captures: { opp_id: $.data.id }
          trigger:
            - call: "POST /vm/opportunities/${opp_id}/publish"
              payload: {}
              as: ShiftCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_OPPORTUNITY_HAS_NO_SHIFTS"

      - name: complete_shift_before_ends_at_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Shift.OPEN_to_COMPLETED
          - errors[ERR_SHIFT_NOT_ENDED]
        distinguishing_aspect: "Completing a Shift while current clock < ends_at returns ERR_SHIFT_NOT_ENDED (409)."
        test_recipe:
          setup: ["A PUBLISHED Opportunity with an OPEN shift; clock before ends_at."]
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Org" }
              as: ShiftCoordinator
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ShiftCoordinator
            - call: "POST /vm/opportunities"
              payload: { organization_id: "${org_id}", title: "Opp" }
              as: ShiftCoordinator
              captures: { opp_id: $.data.id }
            - call: "POST /vm/shifts"
              payload: { opportunity_id: "${opp_id}", starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T12:00:00Z", capacity: 2 }
              as: ShiftCoordinator
              captures: { shift_id: $.data.id }
            - call: "POST /vm/opportunities/${opp_id}/publish"
              payload: {}
              as: ShiftCoordinator
          trigger:
            - call: "POST /vm/shifts/${shift_id}/complete"
              payload: {}
              as: ShiftCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_SHIFT_NOT_ENDED"

      - name: check_in_before_shift_start_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Signup.CONFIRMED_to_ATTENDED
          - errors[ERR_SHIFT_NOT_STARTED]
        distinguishing_aspect: "Checking in a CONFIRMED Signup while current clock < shift.starts_at returns ERR_SHIFT_NOT_STARTED (409)."
        test_recipe:
          setup: ["A CONFIRMED Signup; clock before shift starts_at."]
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Org" }
              as: ShiftCoordinator
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ShiftCoordinator
            - call: "POST /vm/volunteers"
              payload: { organization_id: "${org_id}", full_name: "V", email: "v@x.com" }
              as: ShiftCoordinator
              captures: { vol_id: $.data.id }
            - call: "POST /vm/opportunities"
              payload: { organization_id: "${org_id}", title: "Opp" }
              as: ShiftCoordinator
              captures: { opp_id: $.data.id }
            - call: "POST /vm/shifts"
              payload: { opportunity_id: "${opp_id}", starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T12:00:00Z", capacity: 2 }
              as: ShiftCoordinator
              captures: { shift_id: $.data.id, shift_v: $.data.version }
            - call: "POST /vm/opportunities/${opp_id}/publish"
              payload: {}
              as: ShiftCoordinator
            - call: "POST /vm/shifts/${shift_id}/signups"
              payload: { volunteer_id: "${vol_id}", expected_shift_version: "${shift_v}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { su_id: $.data.id }
            - call: "POST /vm/signups/${su_id}/confirm"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
          trigger:
            - call: "POST /vm/signups/${su_id}/check-in"
              payload: {}
              as: ShiftCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_SHIFT_NOT_STARTED"

      - name: log_hours_exceeding_shift_duration_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Signup.ATTENDED_to_HOURS_LOGGED
          - errors[ERR_HOURS_EXCEED_SHIFT]
        distinguishing_aspect: "Logging logged_hours 4.0 greater than the 3.0h scheduled duration returns ERR_HOURS_EXCEED_SHIFT (422)."
        test_recipe:
          setup: ["An ATTENDED Signup on a 09:00-12:00 (3h) shift."]
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Org" }
              as: ShiftCoordinator
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ShiftCoordinator
            - call: "POST /vm/volunteers"
              payload: { organization_id: "${org_id}", full_name: "V", email: "v@x.com" }
              as: ShiftCoordinator
              captures: { vol_id: $.data.id }
            - call: "POST /vm/opportunities"
              payload: { organization_id: "${org_id}", title: "Opp" }
              as: ShiftCoordinator
              captures: { opp_id: $.data.id }
            - call: "POST /vm/shifts"
              payload: { opportunity_id: "${opp_id}", starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T12:00:00Z", capacity: 2 }
              as: ShiftCoordinator
              captures: { shift_id: $.data.id, shift_v: $.data.version }
            - call: "POST /vm/opportunities/${opp_id}/publish"
              payload: {}
              as: ShiftCoordinator
            - call: "POST /vm/shifts/${shift_id}/signups"
              payload: { volunteer_id: "${vol_id}", expected_shift_version: "${shift_v}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { su_id: $.data.id }
            - call: "POST /vm/signups/${su_id}/confirm"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T12:30:00Z" }
              as: ShiftCoordinator
            - call: "POST /vm/signups/${su_id}/check-in"
              payload: {}
              as: ShiftCoordinator
          trigger:
            - call: "POST /vm/signups/${su_id}/log-hours"
              payload: { logged_hours: 4.0 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_HOURS_EXCEED_SHIFT"

      - name: shift_cancel_cascades_signup_to_cancelled
        claim_type: Side Effect Execution
        grounds: [state_machines.Shift.OPEN_to_CANCELLED, state_machines.Signup.RESERVED_to_CANCELLED]
        distinguishing_aspect: "Cancelling a Shift cascade-cancels its seat-holding RESERVED Signup (Signup.status -> CANCELLED) and the shift becomes CANCELLED."
        test_recipe:
          setup: ["A PUBLISHED Opportunity with an OPEN shift holding one RESERVED signup."]
          setup_api_calls:
            - call: "POST /vm/organizations"
              payload: { name: "Org" }
              as: ShiftCoordinator
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ShiftCoordinator
            - call: "POST /vm/volunteers"
              payload: { organization_id: "${org_id}", full_name: "V", email: "v@x.com" }
              as: ShiftCoordinator
              captures: { vol_id: $.data.id }
            - call: "POST /vm/opportunities"
              payload: { organization_id: "${org_id}", title: "Opp" }
              as: ShiftCoordinator
              captures: { opp_id: $.data.id }
            - call: "POST /vm/shifts"
              payload: { opportunity_id: "${opp_id}", starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-01T12:00:00Z", capacity: 2 }
              as: ShiftCoordinator
              captures: { shift_id: $.data.id, shift_v: $.data.version }
            - call: "POST /vm/opportunities/${opp_id}/publish"
              payload: {}
              as: ShiftCoordinator
            - call: "POST /vm/shifts/${shift_id}/signups"
              payload: { volunteer_id: "${vol_id}", expected_shift_version: "${shift_v}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { su_id: $.data.id }
          trigger:
            - call: "POST /vm/shifts/${shift_id}/cancel"
              payload: {}
              as: ShiftCoordinator
              captures: { shift_status: $.data.status }
            - call: "GET /vm/signups/${su_id}"
              payload: {}
              as: ShiftCoordinator
              captures: { su_status: $.data.status }
          assert:
            - "Shift.${shift_id}.status == CANCELLED"
            - "Signup.${su_id}.status == CANCELLED"

      - name: corporate_group_allocate_creates_group_signups
