# =============================================================================
# Task 1943 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine Difficulty Rules x >= 2 instances, plus cross-cutting layer probes.
# All chains replay-verified against SCAFFOLD.yaml §1.2/§1.4/§1.5/§1.6.
# =============================================================================

scaffold_difficulty_design:
  # ------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_correspondence_risk
        grounds:
          - calculations.correspondence_risk_score
          - entities.CorrespondenceItem.fields.provisional_risk_score
          - entities.CorrespondenceItem.fields.final_risk_score
          - state_machines.CorrespondenceItem.PENDING_REVIEW_to_FLAGGED
        distinguishing_aspect: |
          Entity domain = CorrespondenceItem. The provisional variant (pure formula: 10*hits +
          channel weight + tier bonus) and the final variant (outcome-clamped) produce different
          scores for identical item data: lexicon_hits=1 on EMAIL for a STANDARD rep gives
          provisional 15, while the FLAG decision pins final at the 70 floor.
        test_recipe:
          setup:
            - "Branch + STANDARD rep; one EMAIL correspondence item with lexicon_hits=1 -> provisional 15"
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Corr Branch", region: "NE" }
              as: FirmAdmin
              captures: { br1_id: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "100001", full_name: "Rep One", branch_id: "${br1_id}", hire_date: "2024-01-15" }
              as: FirmAdmin
              captures: { rep1_id: $.data.id }
            - call: "POST /correspondence-items"
              payload: { rep_id: "${rep1_id}", channel: "EMAIL", subject: "Client note", lexicon_hits: 1 }
              as: ComplianceAnalyst
              captures: { ci1_id: $.data.id, ci1_prov: $.data.provisional_risk_score }
          trigger:
            - call: "POST /correspondence-items/${ci1_id}/review"
              payload: { decision: "FLAG" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
          assert:
            - "ci1_prov == 15 (10*1 + 5 EMAIL + 0 STANDARD)"
            - "CorrespondenceItem.${ci1_id}.final_risk_score == 70 (max(15, 70) flag floor)"
            - "final_risk_score != provisional_risk_score — variants diverge on identical inputs"
      - name: dual_complaint_reserve_variants
        grounds:
          - calculations.complaint_reserve
          - entities.CustomerComplaint.fields.provisional_reserve_cents
          - entities.CustomerComplaint.fields.final_reserve_cents
          - state_machines.CustomerComplaint.RECEIVED_to_RESOLVED
        distinguishing_aspect: |
          Entity domain = CustomerComplaint (different from correspondence). Provisional reserve
          uses the allegation-rate estimate (SUITABILITY 0.40 -> 800000 on 2000000 claimed); the
          final variant uses actual paid+legal capped at 1.25x claimed (min(1500000+100000,
          2500000) = 1600000) — two valid algorithms, different dollars, same complaint.
        test_recipe:
          setup:
            - "Rep with a SUITABILITY complaint claiming 2000000 cents"
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Reserve Branch", region: "SE" }
              as: FirmAdmin
              captures: { br2_id: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "100002", full_name: "Rep Two", branch_id: "${br2_id}", hire_date: "2023-06-01" }
              as: FirmAdmin
              captures: { rep2_id: $.data.id }
            - call: "POST /complaints"
              payload: { rep_id: "${rep2_id}", allegation_type: "SUITABILITY", damages_claimed_cents: "2000000", received_date: "2026-08-02" }
              as: ComplianceAnalyst
              captures: { c2_id: $.data.id, c2_prov: $.data.provisional_reserve_cents }
          trigger:
            - call: "POST /complaints/${c2_id}/resolve"
              payload: { damages_paid_cents: "1500000", legal_cost_cents: "100000" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
          assert:
            - "c2_prov == 800000 (0.40 * 2000000)"
            - "CustomerComplaint.${c2_id}.final_reserve_cents == 1600000 (min(1500000+100000, round(1.25*2000000)=2500000))"
            - "CustomerComplaint.${c2_id}.status == \"RESOLVED\""
            - "provisional != final — dual-variant divergence on the complaint domain"

  # ------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: combo_branch_risk_score_weighted
        grounds:
          - calculations.branch_risk_score
          - entities.BranchOffice.fields.risk_score
        distinguishing_aspect: |
          Mode (a) — >= 3 inputs with non-linear interaction: nested min(100, ...) cap, three
          severity weights, and a conditional +20 keyed on branch.sd_rep_count. Score over
          {OPEN, OVERDUE} findings only.
        test_recipe:
          setup:
            - "Branch br_s (no SD reps); inspection started; findings: 1 HIGH + 1 MEDIUM + 2 LOW"
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Score Branch", region: "W" }
              as: FirmAdmin
              captures: { br_s_id: $.data.id, br_s_v: $.data.version }
            - call: "POST /inspections"
              payload: { branch_id: "${br_s_id}", scheduled_date: "2026-08-10", expected_branch_version: "${br_s_v}" }
              as: ComplianceAnalyst
              captures: { i_s: $.data.id }
            - call: "POST /inspections/${i_s}/start"
              as: ComplianceAnalyst
            - call: "POST /findings"
              payload: { inspection_id: "${i_s}", severity: "HIGH", description: "books gap", due_date: "2026-09-01" }
              as: ComplianceAnalyst
            - call: "POST /findings"
              payload: { inspection_id: "${i_s}", severity: "MEDIUM", description: "late review", due_date: "2026-09-01" }
              as: ComplianceAnalyst
            - call: "POST /findings"
              payload: { inspection_id: "${i_s}", severity: "LOW", description: "filing", due_date: "2026-09-01" }
              as: ComplianceAnalyst
            - call: "POST /findings"
              payload: { inspection_id: "${i_s}", severity: "LOW", description: "signage", due_date: "2026-09-01" }
              as: ComplianceAnalyst
          trigger:
            - call: "GET /branches/${br_s_id}"
              as: Any
          assert:
            - "$.data.risk_score == 24 (15*1 + 5*1 + 2*2, no SD bonus, under cap)"
            - "$.data.posture == \"NORMAL\" (only 1 HIGH open, threshold is 2)"
      - name: combo_pst_fee_rounding_order
        grounds:
          - calculations.pst_supervisory_fee_accrual
          - entities.RegisteredRepresentative.fields.pst_fee_total_cents
          - entities.OutsideActivityRequest.fields.supervisory_fee_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters (different mode than instance 1).
          Scaffold pins round-per-approval-then-sum: two compensated PSTs of 33333 cents each
          accrue 833 + 833 = 1666; the forbidden sum-then-round order would give
          round(66666 * 0.025) = 1667. One cent of divergence is the whole test.
        test_recipe:
          setup:
            - "ACTIVE rep; two compensated PST requests of 33333 cents gross each"
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Fee Branch", region: "NE" }
              as: FirmAdmin
              captures: { br_f_id: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "100003", full_name: "Rep Three", branch_id: "${br_f_id}", hire_date: "2022-01-01" }
              as: FirmAdmin
              captures: { rep_f_id: $.data.id }
            - call: "POST /outside-activities"
              payload: { activity_type: "PRIVATE_SECURITIES_TRANSACTION", description: "PST A", compensation_expected: true, estimated_gross_comp_cents: "33333", start_date: "2026-09-01" }
              as: RegisteredRep
              as_user_id: "${rep_f_id}"
              captures: { pst_a: $.data.id }
            - call: "POST /outside-activities"
              payload: { activity_type: "PRIVATE_SECURITIES_TRANSACTION", description: "PST B", compensation_expected: true, estimated_gross_comp_cents: "33333", start_date: "2026-09-01" }
              as: RegisteredRep
              as_user_id: "${rep_f_id}"
              captures: { pst_b: $.data.id }
          trigger:
            - call: "POST /outside-activities/${pst_a}/decide"
              payload: { decision: "APPROVE" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { fee_a: $.data.supervisory_fee_cents }
            - call: "POST /outside-activities/${pst_b}/decide"
              payload: { decision: "APPROVE" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { fee_b: $.data.supervisory_fee_cents }
            - call: "GET /representatives/${rep_f_id}"
              as: Any
          assert:
            - "fee_a == 833 and fee_b == 833 (round_half_up(33333 * 0.025) = round(833.325) = 833 per approval)"
            - "$.data.pst_fee_total_cents == 1666 (per-item rounding then sum; 1667 means the forbidden order was used)"

  # ------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: nonlinear_finding_remediation_cycle
        grounds:
          - state_machines.InspectionFinding.REMEDIATION_SUBMITTED_to_OPEN
          - state_machines.InspectionFinding.OPEN_to_REMEDIATION_SUBMITTED
          - entities.InspectionFinding.fields.reopen_count
        distinguishing_aspect: |
          InspectionFinding is cyclic (OPEN -> REMEDIATION_SUBMITTED -> OPEN revision loop),
          not a linear pipeline: reopen returns to OPEN and increments reopen_count; the loop
          can repeat without bound.
        test_recipe:
          setup:
            - "Inspection IN_PROGRESS with one MEDIUM finding"
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Cycle Branch", region: "S" }
              as: FirmAdmin
              captures: { br_c_id: $.data.id, br_c_v: $.data.version }
            - call: "POST /inspections"
              payload: { branch_id: "${br_c_id}", scheduled_date: "2026-08-10", expected_branch_version: "${br_c_v}" }
              as: ComplianceAnalyst
              captures: { i_c: $.data.id }
            - call: "POST /inspections/${i_c}/start"
              as: ComplianceAnalyst
            - call: "POST /findings"
              payload: { inspection_id: "${i_c}", severity: "MEDIUM", description: "consent file", due_date: "2026-09-01" }
              as: ComplianceAnalyst
              captures: { f_c: $.data.id }
            - call: "POST /findings/${f_c}/remediate"
              payload: { remediation_note: "retrained staff" }
              as: ComplianceAnalyst
          trigger:
            - call: "POST /findings/${f_c}/adjudicate"
              payload: { decision: "REOPEN", rejection_reason: "evidence incomplete" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "POST /findings/${f_c}/remediate"
              payload: { remediation_note: "second submission" }
              as: ComplianceAnalyst
            - call: "POST /findings/${f_c}/adjudicate"
              payload: { decision: "VERIFY" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
          assert:
            - "InspectionFinding.${f_c}.status == \"VERIFIED_CLOSED\""
            - "InspectionFinding.${f_c}.reopen_count == 1 (loop traversed exactly once)"
      - name: nonlinear_correspondence_escalation_branch
        grounds:
          - state_machines.CorrespondenceItem.PENDING_REVIEW_to_ESCALATED
          - state_machines.CorrespondenceItem.ESCALATED_to_APPROVED
          - calculations.correspondence_risk_score
        distinguishing_aspect: |
          CorrespondenceItem is a branching fork-join (PENDING_REVIEW -> {APPROVED, FLAGGED,
          ESCALATED} with ESCALATED rejoining the terminals) with divergent side effects per
          branch: escalation-then-APPROVE clamps final score down to 30 while direct FLAG
          clamps up to 70 — different entity and different non-linear shape than the finding cycle.
        test_recipe:
          setup:
            - "STANDARD rep; SMS correspondence with lexicon_hits=5 -> provisional 70"
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Esc Branch", region: "N" }
              as: FirmAdmin
              captures: { br_e_id: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "100004", full_name: "Rep Four", branch_id: "${br_e_id}", hire_date: "2024-03-01" }
              as: FirmAdmin
              captures: { rep_e_id: $.data.id }
            - call: "POST /correspondence-items"
              payload: { rep_id: "${rep_e_id}", channel: "SMS", subject: "urgent", lexicon_hits: 5 }
              as: ComplianceAnalyst
              captures: { ci_e: $.data.id, ci_e_prov: $.data.provisional_risk_score }
            - call: "POST /correspondence-items/${ci_e}/review"
              payload: { decision: "ESCALATE" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
          trigger:
            - call: "POST /correspondence-items/${ci_e}/resolve-escalation"
              payload: { decision: "APPROVE" }
              as: CompliancePrincipal
              as_user_id: "principal-b"
          assert:
            - "ci_e_prov == 70 (10*5 + 20 SMS)"
            - "CorrespondenceItem.${ci_e}.final_risk_score == 30 (min(70, 30) escalation-approve ceiling)"
            - "CorrespondenceItem.${ci_e}.escalated_by == \"principal-a\" and resolved_by == \"principal-b\""
            - "rep.compliance_flag_count == 0 (APPROVE branch has no flag side effect, unlike FLAG)"

  # ------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: cascade_sd_ack_chain
        grounds:
          - state_machines.DisclosureEvent.FILED_to_ACKNOWLEDGED
          - entities.RegisteredRepresentative.fields.is_statutorily_disqualified
          - entities.BranchOffice.fields.inspection_cycle_months
          - entities.BranchInspection.fields.scheduled_date
          - calculations.branch_inspection_due_date
        distinguishing_aspect: |
          Depth-3 chain across four entity types: DisclosureEvent acknowledge -> (L1) rep SD
          flags -> (L2) branch cycle accelerates 12->6 and next_inspection_due_date recomputes
          -> (L3) the branch's SCHEDULED inspection is rescheduled because its date exceeds the
          new due date. Each link is caused by the previous link's mutation, not by the
          acknowledge call directly.
        test_recipe:
          setup:
            - "Branch sd_br created at default clock 2026-08-01 (no CLOSED inspection -> due base = creation date); rep sd_rep; one SCHEDULED inspection dated 2027-03-15; SD-trigger disclosure FILED"
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "SD Branch", region: "W" }
              as: FirmAdmin
              captures: { sd_br_id: $.data.id, sd_br_v: $.data.version }
            - call: "POST /representatives"
              payload: { crd_number: "200001", full_name: "SD Rep", branch_id: "${sd_br_id}", hire_date: "2020-01-01" }
              as: FirmAdmin
              captures: { sd_rep_id: $.data.id }
            - call: "POST /inspections"
              payload: { branch_id: "${sd_br_id}", scheduled_date: "2027-03-15", expected_branch_version: "${sd_br_v}" }
              as: ComplianceAnalyst
              captures: { sd_insp: $.data.id }
            - call: "POST /disclosure-events"
              payload: { rep_id: "${sd_rep_id}", event_type: "REGULATORY_BAR", event_date: "2026-08-02" }
              as: ComplianceAnalyst
              captures: { sd_disc: $.data.id }
            - call: "POST /disclosure-events/${sd_disc}/file"
              as: CompliancePrincipal
              as_user_id: "principal-a"
          trigger:
            - call: "POST /disclosure-events/${sd_disc}/acknowledge"
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "GET /representatives/${sd_rep_id}"
              as: Any
              captures: { sd_flag: $.data.is_statutorily_disqualified }
            - call: "GET /branches/${sd_br_id}"
              as: Any
              captures: { sd_due: $.data.next_inspection_due_date, sd_cycle: $.data.inspection_cycle_months }
            - call: "GET /inspections/${sd_insp}"
              as: Any
              captures: { sd_sched: $.data.scheduled_date }
          assert:
            - "sd_flag == true (L1)"
            - "sd_cycle == 6 and sd_due == \"2027-02-01\" (L2: base 2026-08-01 branch creation + 6 accelerated months)"
            - "sd_sched == \"2027-02-01\" (L3: scheduled 2027-03-15 exceeded the recomputed due date and was pulled in)"
      - name: cascade_high_finding_posture_escalation
        grounds:
          - calculations.branch_posture_evaluation
          - entities.BranchOffice.fields.posture
          - state_machines.BranchInspection (finding-create cascade)
          - calculations.branch_risk_score
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (POST /findings, not disclosure acknowledge):
          HIGH finding create -> (L1) inspection.high_severity_open_count increments ->
          (L2) count crossing >= 2 flips branch posture to REMEDIATION_REQUIRED and pulls
          next_inspection_due_date to clock date + 90 days.
        test_recipe:
          setup:
            - "Branch created at default clock 2026-08-01 (due date initially 2027-08-01, cycle 12); inspection IN_PROGRESS"
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Posture Branch", region: "E" }
              as: FirmAdmin
              captures: { br_fx_id: $.data.id, br_fx_v: $.data.version }
            - call: "POST /inspections"
              payload: { branch_id: "${br_fx_id}", scheduled_date: "2026-08-10", expected_branch_version: "${br_fx_v}" }
              as: ComplianceAnalyst
              captures: { i_fx: $.data.id }
            - call: "POST /inspections/${i_fx}/start"
              as: ComplianceAnalyst
          trigger:
            - call: "POST /findings"
              payload: { inspection_id: "${i_fx}", severity: "HIGH", description: "high one", due_date: "2026-09-01" }
              as: ComplianceAnalyst
            - call: "POST /findings"
              payload: { inspection_id: "${i_fx}", severity: "HIGH", description: "high two", due_date: "2026-09-01" }
              as: ComplianceAnalyst
            - call: "GET /branches/${br_fx_id}"
              as: Any
          assert:
            - "$.data.posture == \"REMEDIATION_REQUIRED\" (second HIGH finding crossed the >= 2 threshold)"
            - "$.data.next_inspection_due_date == \"2026-10-30\" (min(2027-08-01, 2026-08-01 + 90 days))"
            - "$.data.risk_score == 30 (2 HIGH x 15)"
            - "$.data.high_severity_open_count == 2"

  # ------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: priority_state_before_safety_oba
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_ACTIVITY_NOT_PENDING_DECISION]
          - errors[ERR_SD_REP_REQUIRES_HEIGHTENED_PLAN]
        distinguishing_aspect: |
          Category pair = state (priority 4) vs business_safety (priority 5). A decide call on
          an OBA already cascade-suspended for an SD rep without a plan violates both; the
          state error ERR_ACTIVITY_NOT_PENDING_DECISION must win.
        test_recipe:
          setup:
            - "Rep with a SUBMITTED OBA; SD disclosure acknowledged -> OBA auto-suspended (safety gate now also armed)"
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "P1 Branch", region: "N" }
              as: FirmAdmin
              captures: { p1_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "300001", full_name: "P1 Rep", branch_id: "${p1_br}", hire_date: "2021-01-01" }
              as: FirmAdmin
              captures: { p1_rep: $.data.id }
            - call: "POST /outside-activities"
              payload: { activity_type: "OUTSIDE_BUSINESS_ACTIVITY", description: "board seat", compensation_expected: true, start_date: "2026-09-01" }
              as: RegisteredRep
              as_user_id: "${p1_rep}"
              captures: { p1_oba: $.data.id }
            - call: "POST /disclosure-events"
              payload: { rep_id: "${p1_rep}", event_type: "FELONY_CONVICTION", event_date: "2026-08-02" }
              as: ComplianceAnalyst
              captures: { p1_disc: $.data.id }
            - call: "POST /disclosure-events/${p1_disc}/file"
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "POST /disclosure-events/${p1_disc}/acknowledge"
              as: CompliancePrincipal
              as_user_id: "principal-a"
          trigger:
            - call: "POST /outside-activities/${p1_oba}/decide"
              payload: { decision: "APPROVE" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { p1_err: $.data.error_id }
          assert:
            - "p1_err == \"ERR_ACTIVITY_NOT_PENDING_DECISION\" (state, priority 4, beats business_safety, priority 5)"
            - "OutsideActivityRequest.${p1_oba}.status == \"SUSPENDED_REVIEW\" (unchanged)"
      - name: priority_temporal_before_constraint_plan
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_PLAN_START_IN_PAST]
          - errors[ERR_PLAN_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Category pair = business_temporal (priority 6) vs business_constraint (priority 7) —
          a different pair than instance 1. A plan whose start_date is in the past AND whose
          window overlaps an existing plan must report ERR_PLAN_START_IN_PAST.
        test_recipe:
          setup:
            - "Clock at 2026-02-01; rep with existing DRAFT plan [2026-01-01, 2026-06-30)"
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "P2 Branch", region: "S" }
              as: FirmAdmin
              captures: { p2_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "300002", full_name: "P2 Rep", branch_id: "${p2_br}", hire_date: "2021-01-01" }
              as: FirmAdmin
              captures: { p2_rep: $.data.id, p2_rep_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /supervision-plans"
              payload: { rep_id: "${p2_rep}", start_date: "2026-01-01", end_date: "2026-06-30", conditions: ["WEEKLY_REVIEW"], expected_representative_version: "${p2_rep_v}" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T09:00:00Z" }
              as: FirmAdmin
          trigger:
            - call: "POST /supervision-plans"
              payload: { rep_id: "${p2_rep}", start_date: "2026-01-15", end_date: "2026-07-15", conditions: ["DAILY_REVIEW"], expected_representative_version: "${p2_rep_v} + 1" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { p2_err: $.data.error_id }
          assert:
            - "p2_err == \"ERR_PLAN_START_IN_PAST\" (temporal, priority 6, beats constraint/overlap, priority 7 — even though the window also overlaps)"

  # ------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: boundary_complaint_reportability_threshold
        grounds:
          - calculations.complaint_reportability
          - entities.CustomerComplaint.fields.reportable
          - entities.CustomerComplaint.fields.regulatory_status
        distinguishing_aspect: |
          Metric = monetary threshold on POST /complaints: reportable uses >=, so exactly
          500000 cents is reportable and 499999 is not. Reachable through the complaint create
          endpoint.
        test_recipe:
          setup:
            - "One ACTIVE rep; two complaints at the boundary amounts"
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "B1 Branch", region: "E" }
              as: FirmAdmin
              captures: { b1_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "400001", full_name: "B1 Rep", branch_id: "${b1_br}", hire_date: "2022-01-01" }
              as: FirmAdmin
              captures: { b1_rep: $.data.id }
          trigger:
            - call: "POST /complaints"
              payload: { rep_id: "${b1_rep}", allegation_type: "OTHER", damages_claimed_cents: "499999", received_date: "2026-08-02" }
              as: ComplianceAnalyst
              captures: { c_under: $.data.id }
            - call: "POST /complaints"
              payload: { rep_id: "${b1_rep}", allegation_type: "OTHER", damages_claimed_cents: "500000", received_date: "2026-08-02" }
              as: ComplianceAnalyst
              captures: { c_at: $.data.id }
          assert:
            - "CustomerComplaint.${c_under}.reportable == false and regulatory_status == \"NOT_REQUIRED\""
            - "CustomerComplaint.${c_at}.reportable == true and regulatory_status == \"REQUIRED\""
      - name: boundary_attestation_deadline
        grounds:
          - calculations.meeting_attestation_fanout
          - state_machines.Attestation.PENDING_to_ATTESTED
          - state_machines.Attestation.PENDING_to_OVERDUE
        distinguishing_aspect: |
          Metric = date-window boundary on POST /attestations/{id}/attest (different metric and
          endpoint than instance 1): attesting exactly on meeting_date + 30 days succeeds
          (inclusive <=); one day later the clock-set sweep has moved the second attestation to
          OVERDUE and attest is rejected with the state error.
        test_recipe:
          setup:
            - "Two ACTIVE reps; 2026 meeting dated 2026-03-01, HELD that day; two PENDING attestations with deadline 2026-03-31 (fan-out order: rep created_at ASC -> data[0] is rep A)"
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "B2 Branch", region: "W" }
              as: FirmAdmin
              captures: { b2_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "400002", full_name: "B2 Rep A", branch_id: "${b2_br}", hire_date: "2022-01-01" }
              as: FirmAdmin
              captures: { b2_rep_a: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "400003", full_name: "B2 Rep B", branch_id: "${b2_br}", hire_date: "2022-01-01" }
              as: FirmAdmin
              captures: { b2_rep_b: $.data.id }
            - call: "POST /meetings"
              payload: { year: 2026, meeting_date: "2026-03-01" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { b2_mt: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T12:00:00Z" }
              as: FirmAdmin
            - call: "POST /meetings/${b2_mt}/hold"
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "GET /attestations?meeting_id=${b2_mt}"
              as: Any
              captures: { b2_att_a: "$.data[0].id", b2_att_b: "$.data[1].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-31T23:59:59Z" }
              as: FirmAdmin
          trigger:
            - call: "POST /attestations/${b2_att_a}/attest"
              as: RegisteredRep
              as_user_id: "${b2_rep_a}"
              captures: { b2_att_ok: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:01Z" }
              as: FirmAdmin
            - call: "POST /attestations/${b2_att_b}/attest"
              as: RegisteredRep
              as_user_id: "${b2_rep_b}"
              captures: { b2_att_late: $.data.error_id }
            - call: "GET /attestations/${b2_att_b}"
              as: Any
              captures: { b2_att_b_status: $.data.status }
          assert:
            - "b2_att_ok == \"ATTESTED\" (deadline day 2026-03-31 is inclusive)"
            - "b2_att_b_status == \"OVERDUE\" (sweep at 2026-04-01: deadline 2026-03-31 < current date)"
            - "b2_att_late == \"ERR_ATTESTATION_NOT_PENDING\" (post-sweep state check fires)"

  # ------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cross_rep_sd_gates_oba_decision
        grounds:
          - state_machines.OutsideActivityRequest.SUBMITTED_to_APPROVED
          - entities.RegisteredRepresentative.fields.is_statutorily_disqualified
          - errors[ERR_SD_REP_REQUIRES_HEIGHTENED_PLAN]
        distinguishing_aspect: |
          Entity pair = OutsideActivityRequest -> RegisteredRepresentative: the OBA's valid
          transitions depend on the rep's SD flag and on the existence of an ACTIVE heightened
          plan. A decision on a SUBMITTED OBA for an SD rep without a plan is rejected with
          ERR_SD_REP_REQUIRES_HEIGHTENED_PLAN; after the plan exists and is ACTIVE it succeeds.
        test_recipe:
          setup:
            - "Rep made SD via disclosure acknowledgement; first SUBMITTED OBA was auto-suspended; second OBA created after the ack stays SUBMITTED"
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "X1 Branch", region: "N" }
              as: FirmAdmin
              captures: { x1_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "500001", full_name: "X1 Rep", branch_id: "${x1_br}", hire_date: "2020-01-01" }
              as: FirmAdmin
              captures: { x1_rep: $.data.id }
            - call: "POST /outside-activities"
              payload: { activity_type: "OUTSIDE_BUSINESS_ACTIVITY", description: "consulting", compensation_expected: false, start_date: "2026-09-01" }
              as: RegisteredRep
              as_user_id: "${x1_rep}"
              captures: { x1_oba: $.data.id }
            - call: "POST /disclosure-events"
              payload: { rep_id: "${x1_rep}", event_type: "SECURITIES_MISDEMEANOR", event_date: "2026-08-02" }
              as: ComplianceAnalyst
              captures: { x1_disc: $.data.id }
            - call: "POST /disclosure-events/${x1_disc}/file"
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "POST /disclosure-events/${x1_disc}/acknowledge"
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "POST /outside-activities"
              payload: { activity_type: "OUTSIDE_BUSINESS_ACTIVITY", description: "second gig", compensation_expected: false, start_date: "2026-09-01" }
              as: RegisteredRep
              as_user_id: "${x1_rep}"
              captures: { x1_oba2: $.data.id }
          trigger:
            - call: "POST /outside-activities/${x1_oba2}/decide"
              payload: { decision: "APPROVE" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { x1_gate_err: $.data.error_id }
            - call: "GET /representatives/${x1_rep}"
              as: Any
              captures: { x1_rep_v2: $.data.version }
            - call: "POST /supervision-plans"
              payload: { rep_id: "${x1_rep}", start_date: "2026-08-03", end_date: "2027-08-02", conditions: ["MONTHLY_REVIEW"], expected_representative_version: "${x1_rep_v2}" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { x1_plan: $.data.id }
            - call: "POST /supervision-plans/${x1_plan}/activate"
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "POST /outside-activities/${x1_oba2}/decide"
              payload: { decision: "APPROVE" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
          assert:
            - "x1_gate_err == \"ERR_SD_REP_REQUIRES_HEIGHTENED_PLAN\" (SD rep, no ACTIVE plan; OBA still SUBMITTED so the safety gate — not the state check — fires)"
            - "after activation the same decision succeeds: OutsideActivityRequest.${x1_oba2}.status == \"APPROVED\""
            - "RegisteredRepresentative.${x1_rep}.active_approved_activity_count == 1"
            - "OutsideActivityRequest.${x1_oba}.status == \"SUSPENDED_REVIEW\" (cascade effect of the ack, untouched by the gate)"
      - name: cross_oba_resume_requires_active_plan
        grounds:
          - state_machines.OutsideActivityRequest.SUSPENDED_REVIEW_to_SUBMITTED
          - entities.HeightenedSupervisionPlan.fields.status
          - errors[ERR_NO_ACTIVE_HEIGHTENED_PLAN]
        distinguishing_aspect: |
          Entity pair = OutsideActivityRequest -> HeightenedSupervisionPlan (different pair
          than instance 1's OBA -> Rep): resume is rejected while the rep's plan is merely
          DRAFT, and succeeds after activation.
        test_recipe:
          setup:
            - "SD-flagged rep with a SUSPENDED_REVIEW OBA and a DRAFT (not yet ACTIVE) plan"
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "X2 Branch", region: "S" }
              as: FirmAdmin
              captures: { x2_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "500002", full_name: "X2 Rep", branch_id: "${x2_br}", hire_date: "2020-01-01" }
              as: FirmAdmin
              captures: { x2_rep: $.data.id }
            - call: "POST /outside-activities"
              payload: { activity_type: "OUTSIDE_BUSINESS_ACTIVITY", description: "rental", compensation_expected: true, start_date: "2026-09-01" }
              as: RegisteredRep
              as_user_id: "${x2_rep}"
              captures: { x2_oba: $.data.id }
            - call: "POST /disclosure-events"
              payload: { rep_id: "${x2_rep}", event_type: "REGULATORY_BAR", event_date: "2026-08-02" }
              as: ComplianceAnalyst
              captures: { x2_disc: $.data.id }
            - call: "POST /disclosure-events/${x2_disc}/file"
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "POST /disclosure-events/${x2_disc}/acknowledge"
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "GET /representatives/${x2_rep}"
              as: Any
              captures: { x2_rep_v2: $.data.version }
            - call: "POST /supervision-plans"
              payload: { rep_id: "${x2_rep}", start_date: "2026-08-03", end_date: "2027-08-02", conditions: ["MONTHLY_REVIEW"], expected_representative_version: "${x2_rep_v2}" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { x2_plan: $.data.id }
          trigger:
            - call: "POST /outside-activities/${x2_oba}/resume"
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { x2_err: $.data.error_id }
            - call: "POST /supervision-plans/${x2_plan}/activate"
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "POST /outside-activities/${x2_oba}/resume"
              as: CompliancePrincipal
              as_user_id: "principal-a"
          assert:
            - "x2_err == \"ERR_NO_ACTIVE_HEIGHTENED_PLAN\" (plan was DRAFT, not ACTIVE)"
            - "after activation, resume succeeds: OutsideActivityRequest.${x2_oba}.status == \"SUBMITTED\""

  # ------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: plan_window_overlap
        grounds:
          - validations[priority=7]
          - entities.HeightenedSupervisionPlan.fields.start_date
          - entities.HeightenedSupervisionPlan.fields.end_date
          - errors[ERR_PLAN_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics = half-open adjacency on the RegisteredRepresentative resource:
          [start, end) windows of DRAFT/ACTIVE plans may touch (existing end == new start is
          allowed) but may not intersect. Distinct from the inspection rule's buffer-gap math.
        test_recipe:
          setup:
            - "Clock 2026-01-01; rep with DRAFT plan [2026-06-01, 2026-12-31)"
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "OV Branch", region: "E" }
              as: FirmAdmin
              captures: { ov_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "600001", full_name: "OV Rep", branch_id: "${ov_br}", hire_date: "2021-01-01" }
              as: FirmAdmin
              captures: { ov_rep: $.data.id, ov_rep_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /supervision-plans"
              payload: { rep_id: "${ov_rep}", start_date: "2026-06-01", end_date: "2026-12-31", conditions: ["A"], expected_representative_version: "${ov_rep_v}" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { ov_p1: $.data.id }
            - call: "GET /representatives/${ov_rep}"
              as: Any
              captures: { ov_rep_v2: $.data.version }
          trigger:
            - call: "POST /supervision-plans"
              payload: { rep_id: "${ov_rep}", start_date: "2026-06-15", end_date: "2026-12-31", conditions: ["B"], expected_representative_version: "${ov_rep_v2}" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { ov_err: $.data.error_id }
          assert:
            - "ov_err == \"ERR_PLAN_WINDOW_OVERLAP\" ([2026-06-15, ...) intersects [2026-06-01, 2026-12-31))"
      - name: inspection_min_gap_buffer
        grounds:
          - validations[priority=7]
          - errors[ERR_INSPECTION_GAP_VIOLATION]
          - state_machines.BranchInspection
        distinguishing_aspect: |
          Interval semantics = minimum buffer gap on the BranchOffice resource: a new inspection
          must be scheduled >= 300 days after the last CLOSED inspection's completed_date — a
          buffer rule, not an intersection rule (different semantics, different resource than
          instance 1). 299 days fails; 300 days succeeds.
        test_recipe:
          setup:
            - "Branch; inspection completed 2026-03-01 (gap base)"
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "GAP Branch", region: "W" }
              as: FirmAdmin
              captures: { gap_br: $.data.id, gap_br_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /inspections"
              payload: { branch_id: "${gap_br}", scheduled_date: "2026-03-01", expected_branch_version: "${gap_br_v}" }
              as: ComplianceAnalyst
              captures: { gap_i1: $.data.id }
            - call: "POST /inspections/${gap_i1}/start"
              as: ComplianceAnalyst
            - call: "GET /branches/${gap_br}"
              as: Any
              captures: { gap_br_v2: $.data.version }
            - call: "POST /inspections/${gap_i1}/close"
              payload: { expected_branch_version: "${gap_br_v2}" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "GET /branches/${gap_br}"
              as: Any
              captures: { gap_br_v3: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: FirmAdmin
          trigger:
            - call: "POST /inspections"
              payload: { branch_id: "${gap_br}", scheduled_date: "2026-12-25", expected_branch_version: "${gap_br_v3}" }
              as: ComplianceAnalyst
              captures: { gap_err: $.data.error_id }
            - call: "POST /inspections"
              payload: { branch_id: "${gap_br}", scheduled_date: "2026-12-26", expected_branch_version: "${gap_br_v3}" }
              as: ComplianceAnalyst
              captures: { gap_ok: $.data.id }
          assert:
            - "gap_err == \"ERR_INSPECTION_GAP_VIOLATION\" (2026-12-25 is 299 days after 2026-03-01)"
            - "second call succeeds: 2026-12-26 is exactly 300 days after — boundary is inclusive at 300"
            - "BranchInspection.${gap_ok}.status == \"SCHEDULED\""

  # ------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: compensating_oba_approve_revoke_count
        grounds:
          - calculations.oba_active_count_conservation
          - state_machines.OutsideActivityRequest.SUBMITTED_to_APPROVED
          - state_machines.OutsideActivityRequest.APPROVED_to_REVOKED
          - entities.RegisteredRepresentative.fields.active_approved_activity_count
        distinguishing_aspect: |
          Conserved quantity = integer count of approved activities on the rep. APPROVE (+1)
          paired with REVOKE (-1) leaves rep.active_approved_activity_count unchanged — the
          cascade must not drift.
        test_recipe:
          setup:
            - "ACTIVE rep with one OBA"
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "CI1 Branch", region: "N" }
              as: FirmAdmin
              captures: { ci1_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "700001", full_name: "CI1 Rep", branch_id: "${ci1_br}", hire_date: "2022-01-01" }
              as: FirmAdmin
              captures: { ci1_rep: $.data.id }
            - call: "POST /outside-activities"
              payload: { activity_type: "OUTSIDE_BUSINESS_ACTIVITY", description: "board", compensation_expected: false, start_date: "2026-09-01" }
              as: RegisteredRep
              as_user_id: "${ci1_rep}"
              captures: { ci1_oba: $.data.id }
          trigger:
            - call: "POST /outside-activities/${ci1_oba}/decide"
              payload: { decision: "APPROVE" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "GET /representatives/${ci1_rep}"
              as: Any
              captures: { ci1_count_mid: $.data.active_approved_activity_count }
            - call: "POST /outside-activities/${ci1_oba}/revoke"
              payload: { reason: "policy change" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "GET /representatives/${ci1_rep}"
              as: Any
          assert:
            - "ci1_count_mid == 1 (after approve)"
            - "$.data.active_approved_activity_count == 0 (approve + revoke conserves the count)"
      - name: invariant_open_findings_conservation
        grounds:
          - calculations.branch_risk_score
          - state_machines.InspectionFinding.OPEN_to_REMEDIATION_SUBMITTED
          - state_machines.InspectionFinding.REMEDIATION_SUBMITTED_to_OPEN
          - entities.BranchOffice.fields.risk_score
        distinguishing_aspect: |
          Conserved quantity = weighted risk score on the branch (a different quantity type
          than instance 1's count). Remediate removes the finding from the scored
          {OPEN, OVERDUE} set (score 17 -> 2); REOPEN puts it back (2 -> 17): the forward +
          compensating pair leaves branch.risk_score unchanged.
        test_recipe:
          setup:
            - "Branch with IN_PROGRESS inspection; one HIGH finding (score 15) and one LOW finding (score 2)"
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "CI2 Branch", region: "S" }
              as: FirmAdmin
              captures: { ci2_br: $.data.id, ci2_br_v: $.data.version }
            - call: "POST /inspections"
              payload: { branch_id: "${ci2_br}", scheduled_date: "2026-08-10", expected_branch_version: "${ci2_br_v}" }
              as: ComplianceAnalyst
              captures: { ci2_insp: $.data.id }
            - call: "POST /inspections/${ci2_insp}/start"
              as: ComplianceAnalyst
            - call: "POST /findings"
              payload: { inspection_id: "${ci2_insp}", severity: "HIGH", description: "hf", due_date: "2026-09-01" }
              as: ComplianceAnalyst
              captures: { ci2_f: $.data.id }
            - call: "POST /findings"
              payload: { inspection_id: "${ci2_insp}", severity: "LOW", description: "lf", due_date: "2026-09-01" }
              as: ComplianceAnalyst
          trigger:
            - call: "POST /findings/${ci2_f}/remediate"
              payload: { remediation_note: "fixed" }
              as: ComplianceAnalyst
            - call: "GET /branches/${ci2_br}"
              as: Any
              captures: { ci2_score_mid: $.data.risk_score }
            - call: "POST /findings/${ci2_f}/adjudicate"
              payload: { decision: "REOPEN", rejection_reason: "not sufficient" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "GET /branches/${ci2_br}"
              as: Any
          assert:
            - "ci2_score_mid == 2 (only the LOW finding still scored)"
            - "$.data.risk_score == 17 (remediate + reopen conserves the score: 17 -> 2 -> 17)"

  # ------------------------------------------------------------------
  - rule_id: cross_cutting
    instances:
      - name: occ_plan_create_stale_representative
        grounds:
          - concurrency_rules[plan-create-stale-representative]
          - errors[ERR_STALE_REPRESENTATIVE_VERSION]
        distinguishing_aspect: |
          Optimistic-concurrency layer probe: a second plan creation carrying the rep version
          observed before the first creation is rejected with 412 — two strictly sequential
          requests, deterministic loser.
        test_recipe:
          setup:
            - "Clock 2026-09-01; ACTIVE rep observed at version v1"
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "OCC1 Branch", region: "E" }
              as: FirmAdmin
              captures: { occ1_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "800001", full_name: "OCC1 Rep", branch_id: "${occ1_br}", hire_date: "2020-01-01" }
              as: FirmAdmin
              captures: { occ1_rep: $.data.id, occ1_rep_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /supervision-plans"
              payload: { rep_id: "${occ1_rep}", start_date: "2026-10-01", end_date: "2027-03-31", conditions: ["A"], expected_representative_version: "${occ1_rep_v}" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { occ1_p1: $.data.id }
          trigger:
            - call: "POST /supervision-plans"
              payload: { rep_id: "${occ1_rep}", start_date: "2026-11-01", end_date: "2027-04-30", conditions: ["B"], expected_representative_version: "${occ1_rep_v}" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { occ1_err: $.data.error_id }
          assert:
            - "occ1_err == \"ERR_STALE_REPRESENTATIVE_VERSION\" (412; rep.version advanced when the first plan was registered)"
      - name: occ_inspection_create_stale_branch
        grounds:
          - concurrency_rules[inspection-create-stale-branch]
          - errors[ERR_STALE_BRANCH_VERSION]
        distinguishing_aspect: |
          Second OCC parent entity (BranchOffice, not RegisteredRepresentative): scheduling an
          inspection with the branch version observed before a prior scheduling is rejected
          with 412.
        test_recipe:
          setup:
            - "Branch observed at version v1; one inspection already scheduled against it (which advanced the version)"
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "OCC2 Branch", region: "W" }
              as: FirmAdmin
              captures: { occ2_br: $.data.id, occ2_br_v: $.data.version }
            - call: "POST /inspections"
              payload: { branch_id: "${occ2_br}", scheduled_date: "2026-09-15", expected_branch_version: "${occ2_br_v}" }
              as: ComplianceAnalyst
              captures: { occ2_i1: $.data.id }
          trigger:
            - call: "POST /inspections"
              payload: { branch_id: "${occ2_br}", scheduled_date: "2026-09-16", expected_branch_version: "${occ2_br_v}" }
              as: ComplianceAnalyst
              captures: { occ2_err: $.data.error_id }
          assert:
            - "occ2_err == \"ERR_STALE_BRANCH_VERSION\" (412; the OCC check at priority 3.5 precedes the single-open-inspection constraint at priority 7)"
      - name: compound_meeting_close_blocked
        grounds:
          - state_machines.ComplianceMeeting.HELD_to_CLOSED
          - calculations.meeting_attestation_fanout
          - entities.Attestation.fields.status
          - errors[ERR_ATTESTATIONS_STILL_PENDING]
        distinguishing_aspect: |
          Compound/parent-child aggregate gate: meeting close requires every fanned-out
          attestation terminal. Close while one attestation is PENDING fails; after the rep
          attests, close succeeds. Also proves the fan-out set excludes TERMINATED reps.
        test_recipe:
          setup:
            - "Reps mc1 (ACTIVE) and mc2 (TERMINATED before meeting creation); meeting HELD 2026-06-15; only mc1 has an attestation"
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "MC Branch", region: "N" }
              as: FirmAdmin
              captures: { mc_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "810001", full_name: "MC One", branch_id: "${mc_br}", hire_date: "2020-01-01" }
              as: FirmAdmin
              captures: { mc_r1: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "810002", full_name: "MC Two", branch_id: "${mc_br}", hire_date: "2020-01-01" }
              as: FirmAdmin
              captures: { mc_r2: $.data.id }
            - call: "POST /representatives/${mc_r2}/terminate"
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "POST /meetings"
              payload: { year: 2026, meeting_date: "2026-06-15" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { mc_mt: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: FirmAdmin
            - call: "POST /meetings/${mc_mt}/hold"
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "GET /attestations?meeting_id=${mc_mt}"
              as: Any
              captures: { mc_att: "$.data[0].id" }
          trigger:
            - call: "POST /meetings/${mc_mt}/close"
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { mc_err: $.data.error_id }
            - call: "POST /attestations/${mc_att}/attest"
              as: RegisteredRep
              as_user_id: "${mc_r1}"
            - call: "POST /meetings/${mc_mt}/close"
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "GET /attestations?rep_id=${mc_r2}"
              as: Any
          assert:
            - "mc_err == \"ERR_ATTESTATIONS_STILL_PENDING\" (aggregate gate blocks close)"
            - "after attestation the close succeeds: ComplianceMeeting.${mc_mt}.status == \"CLOSED\""
            - "rep ${mc_r2} has zero attestations (TERMINATED at fan-out time): list response data is empty"
      - name: compound_complaint_parallel_axes
        grounds:
          - state_machines.CustomerComplaint
          - entities.CustomerComplaint.fields.status
          - entities.CustomerComplaint.fields.regulatory_status
          - errors[ERR_COMPLAINT_NOT_RESOLVABLE]
        distinguishing_aspect: |
          Parallel state dimensions on one entity: regulatory_status (NOT_REQUIRED -> REQUIRED
          -> FILED) evolves independently of status (RECEIVED -> RESOLVED). A complaint can be
          RESOLVED while still REQUIRED, then reported afterwards; PATCH on a RESOLVED complaint
          is rejected without touching the regulatory axis.
        test_recipe:
          setup:
            - "Complaint with damages 600000 (reportable) -> REQUIRED"
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "PA Branch", region: "S" }
              as: FirmAdmin
              captures: { pa_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "820001", full_name: "PA Rep", branch_id: "${pa_br}", hire_date: "2021-01-01" }
              as: FirmAdmin
              captures: { pa_rep: $.data.id }
            - call: "POST /complaints"
              payload: { rep_id: "${pa_rep}", allegation_type: "MISREPRESENTATION", damages_claimed_cents: "600000", received_date: "2026-08-02" }
              as: ComplianceAnalyst
              captures: { pa_c: $.data.id }
          trigger:
            - call: "POST /complaints/${pa_c}/resolve"
              payload: { damages_paid_cents: "100000", legal_cost_cents: "0" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "POST /complaints/${pa_c}/report"
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "PATCH /complaints/${pa_c}"
              payload: { damages_claimed_cents: "700000" }
              as: ComplianceAnalyst
              captures: { pa_err: $.data.error_id }
          assert:
            - "after resolve: status == \"RESOLVED\" while regulatory_status was still \"REQUIRED\" (independent axes)"
            - "report after resolve succeeds: regulatory_status == \"FILED\""
            - "pa_err == \"ERR_COMPLAINT_NOT_RESOLVABLE\" (PATCH blocked on RESOLVED; FILED axis untouched)"
