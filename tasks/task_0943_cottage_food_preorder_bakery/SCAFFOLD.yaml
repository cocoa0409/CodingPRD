scenario: "943. Cottage-Food DTC & Pre-Order Bakery: menu & pre-order window, batch/production planning, local-pickup/porch & delivery, allergen/cottage-food labeling, subscription (bread/cookie club), payment & tip, capacity/cutoff, review"
domain_name: "cottage-food-preorder-bakery"
api_prefix: "/bakery"

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Recipe -> RecipeComponent -> Recipe (self-referential sub-recipe tree) plus
  # cross-aggregate references from OrderLine to Batch and from Order to
  # SubscriptionCycle / DeliveryRoute. Not a strict tree: the same Recipe can be
  # reached through several component paths, and Batch links OfferWindow x
  # MenuItem x Recipe.

  state_machine_shape: parallel
  # OfferWindow carries three independent axes (window_status x plan_status x
  # capacity_posture) and Order carries three (order_status x payment_status x
  # handoff_status). Most other axes are cyclic or branching.

  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
    - polymorphic

  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

global_constants:
  # ---- clock -------------------------------------------------------------
  CLOCK_DEFAULT_UTC: "2026-05-01T00:00:00Z"
  # ---- offer window / cutoff --------------------------------------------
  HOLD_TTL_MINUTES: 45
  CUTOFF_BOUNDARY_SEMANTICS: "strict_exclusive"
  CUTOFF_EXTENSION_MAX_COUNT: 1
  CUTOFF_EXTENSION_MINUTES: 120
  WINDOW_UNIT_CAPACITY_DEFAULT: 240
  WINDOW_BATCH_SLOT_CAPACITY_DEFAULT: 12
  WINDOW_OVEN_HOURS_CAPACITY_DEFAULT: 18.0
  CAPACITY_CONSTRAINED_UTILIZATION_PCT: 0.80
  # ---- batching / production --------------------------------------------
  BATCH_SLOT_UNITS: 24
  OVEN_HOURS_PER_BATCH_SLOT: 1.5
  OVEN_HOURS_PRECISION_DECIMALS: 2
  DEFAULT_YIELD_UNITS_PER_SLOT: 24
  SHORTFALL_PRIORITY_ORDER: "SHORTFALL_KEY_SUBSCRIPTION_CLUB,SHORTFALL_KEY_PREPAID,SHORTFALL_KEY_EARLIEST_PLACEMENT"
  # The three shortfall priority keys, each pinned to the field it reads.
  SHORTFALL_KEY_SUBSCRIPTION_CLUB: "Order.source == 'SUBSCRIPTION_CLUB'"
  SHORTFALL_KEY_PREPAID: "Order.prepaid == true"
  SHORTFALL_KEY_EARLIEST_PLACEMENT: "Order.created_at ASC"
  SHORTFALL_TIE_BREAK: "order_created_at ASC"
  SHORTFALL_CREDIT_MULTIPLIER: 1.00
  # ---- pricing -----------------------------------------------------------
  DOZEN_SIZE: 12
  BAKERS_DOZEN_UNITS: 13
  MIN_UNITS_PER_LINE: 1
  MAX_UNITS_PER_LINE: 120
  MAX_LINES_PER_ORDER: 12
  ROUNDING_MODE: "round_half_up"
  TAX_RATE_BPS: 725
  TAX_ROUNDING_ORDER: "per_line_then_sum"
  # ---- cottage-food statutory -------------------------------------------
  ANNUAL_GROSS_SALES_CAP_CENTS: 8500000
  TIP_COUNTS_TOWARD_GROSS_CAP: false
  DTC_ELIGIBLE_PRODUCT_CLASS: "SHELF_STABLE"
  PERMITTED_DELIVERY_RADIUS_KM: 40.0
  WHOLESALE_PERMITTED: false
  # ---- allergen ----------------------------------------------------------
  ALLERGEN_TREE_MAX_DEPTH: 5
  ALLERGEN_SEVERITY_HARD_BLOCK: "ANAPHYLACTIC"
  ALLERGEN_SEVERITY_ACK_REQUIRED: "INTOLERANCE"
  CROSS_CONTACT_ADVISORY_TEXT: "Made in a home kitchen that also handles wheat, egg, milk, soy, peanut and tree nuts."
  COTTAGE_FOOD_STATEMENT_TEXT: "Made in a home kitchen that is not subject to routine state inspection."
  # ---- handoff -----------------------------------------------------------
  PICKUP_GRACE_MINUTES: 90
  MISSED_REBOOK_MAX: 1
  FORFEIT_REFUND_PCT: 0.00
  DELIVERY_MINIMUM_CENTS: 3500
  DELIVERY_ZONE_TIER1_MAX_KM: 8.0
  DELIVERY_ZONE_TIER2_MAX_KM: 20.0
  DELIVERY_ZONE_TIER3_MAX_KM: 40.0
  DELIVERY_FEE_TIER1_CENTS: 500
  DELIVERY_FEE_TIER2_CENTS: 900
  DELIVERY_FEE_TIER3_CENTS: 1400
  ROUTE_STOP_SORT_KEY: "delivery_distance_km ASC"
  ROUTE_STOP_TIE_BREAK: "order_created_at ASC"
  # ---- subscription ------------------------------------------------------
  SKIP_DEADLINE_HOURS_BEFORE_CUTOFF: 24
  SUBSCRIPTION_PAUSE_CAP_COUNT: 2
  SUBSCRIPTION_RESERVE_UNIT_SHARE_PCT: 0.30
  PREPAID_CYCLE_DISCOUNT_PCT: 0.10
  PREPAID_DEPOSIT_CYCLES: 4
  PAST_DUE_GRACE_HOURS: 72
  # ---- payment / money ---------------------------------------------------
  TIP_PCT_MAX: 0.30
  TIP_FIXED_MAX_CENTS: 5000
  REFUND_WATERFALL_ORDER: "REFUND_LEG_TIP,REFUND_LEG_DELIVERY_FEE,REFUND_LEG_TAXABLE_SUBTOTAL,REFUND_LEG_CREDIT"
  # The four waterfall leg names, each pinned to the MoneyMovement field it fills.
  REFUND_LEG_TIP: "leg_tip_cents"
  REFUND_LEG_DELIVERY_FEE: "leg_delivery_fee_cents"
  REFUND_LEG_TAXABLE_SUBTOTAL: "leg_subtotal_cents"
  REFUND_LEG_CREDIT: "leg_credit_cents"
  CREDIT_EXPIRY_DAYS: 365
  PAYOUT_PERIOD_DAYS: 14
  # ---- review ------------------------------------------------------------
  REVIEW_WINDOW_DAYS: 21
  BAKER_RESPONSE_WINDOW_DAYS: 14
  RATING_ROLLUP_MIN_REVIEWS: 3
  RATING_SCALE_MIN: 1
  RATING_SCALE_MAX: 5
  RATING_ROLLUP_STORAGE: "stored_recomputed_on_review_status_change"
  RATING_AVG_PRECISION_DECIMALS: 2
  # ---- cascade -----------------------------------------------------------
  RECALL_CASCADE_MAX_DEPTH: 6

entities:
  - name: Baker
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: "Cottage-food operator trade name."
      - name: jurisdiction_code
        type: string
        source: input
        description: "Permitting jurisdiction code, e.g. CA-ALAMEDA."
      - name: permit_status
        type: enum
        source: system
        default: PENDING
        description: "Cottage-food permit posture; gates every order-affecting write."
        constraints: "one of PENDING, ACTIVE, SUSPENDED, CAP_REACHED"
      - name: shared_kitchen
        type: boolean
        source: input
        default: false
        description: "True when the home kitchen also produces for other operators; feeds the cross-contact advisory."
      - name: annual_cap_cents
        type: integer
        source: input
        default: 8500000
        description: "Statutory annual gross-sales ceiling for this jurisdiction; defaults to ANNUAL_GROSS_SALES_CAP_CENTS."
      - name: cap_year
        type: integer
        source: input
        default: 2026
        description: "Calendar year the annual cap is measured over."
      - name: annual_gross_sales_cents
        type: integer
        source: computed
        default: 0
        description: "Counted gross sales for cap_year per calculations.annual_gross_sales_to_date."
      - name: permitted_radius_km
        type: number
        source: input
        default: 40.0
        description: "Maximum permitted delivery radius from the home kitchen; defaults to PERMITTED_DELIVERY_RADIUS_KM."
      - name: payout_period_start
        type: datetime
        source: input
        description: "First instant of the current PAYOUT_PERIOD_DAYS payout period."
      - name: payout_net_cents
        type: integer
        source: computed
        default: 0
        description: "Net settled money for the current payout period per calculations.payout_period_net."

  - name: Customer
    parent: Baker
    common_fields: true
    fields:
      - name: baker_id
        type: string
        source: input
        description: "FK -> Baker.id; the operator this customer buys from."
      - name: display_name
        type: string
        source: input
        description: "Customer name shown on labels and routes."
      - name: email
        type: string
        source: input
        description: "Contact email; unique per baker_id."
        constraints: "unique within (baker_id, email)"
      - name: delivery_distance_km
        type: number
        source: input
        description: "Road distance from the home kitchen to this customer's address, in km."
      - name: allergen_avoidances
        type: array
        source: input
        default: []
        description: "Array of objects { allergen: string, severity: enum ANAPHYLACTIC|INTOLERANCE } forming the avoidance profile."
      - name: unattended_consent
        type: boolean
        source: input
        default: false
        description: "Standing consent to unattended porch handoff."
      - name: cooler_provided
        type: boolean
        source: input
        default: false
        description: "Customer will leave a cooler out for temp-sensitive porch handoffs."
      - name: credit_balance_cents
        type: integer
        source: computed
        default: 0
        description: "Unexpired credit per calculations.credit_balance."

  - name: Recipe
    parent: Baker
    common_fields: true
    fields:
      - name: baker_id
        type: string
        source: input
        description: "FK -> Baker.id; owning operator."
      - name: name
        type: string
        source: input
        description: "Recipe name."
      - name: recipe_status
        type: enum
        source: system
        default: DRAFT
        description: "Recipe lifecycle; only PUBLISHED recipes may back a listed MenuItem."
        constraints: "one of DRAFT, PUBLISHED, REVISING, RETIRED"
      - name: published_version
        type: integer
        source: computed
        default: 0
        description: "Monotone counter incremented on every publish; pinned onto Batch and Label."
      - name: allergen_union
        type: array
        source: computed
        default: []
        description: "Recursive union of component and sub-recipe allergens per calculations.allergen_union."
      - name: tree_depth
        type: integer
        source: computed
        default: 1
        description: "Depth of the component/sub-recipe tree rooted here, root counted as 1."
      - name: cross_contact_advisory
        type: string
        source: computed
        description: "CROSS_CONTACT_ADVISORY_TEXT when the advisory applies, otherwise null."

  - name: RecipeComponent
    parent: Recipe
    common_fields: true
    fields:
      - name: recipe_id
        type: string
        source: input
        description: "FK -> Recipe.id; the recipe this component belongs to."
      - name: sub_recipe_id
        type: string
        source: input
        description: "FK -> Recipe.id; nullable self-referential link to a nested recipe."
      - name: ingredient_lot_id
        type: string
        source: input
        description: "FK -> IngredientLot.id; nullable link to the physical lot supplying this component."
      - name: component_name
        type: string
        source: input
        description: "Human label for the component."
      - name: declared_allergens
        type: array
        source: input
        default: []
        description: "Allergen strings declared directly on this component."
      - name: quantity_grams
        type: number
        source: input
        description: "Grams of this component per batch."
      - name: recalled_component
        type: boolean
        source: system
        default: false
        description: "Latched true when the referenced ingredient lot is recalled."

  - name: IngredientLot
    parent: Baker
    common_fields: true
    fields:
      - name: baker_id
        type: string
        source: input
        description: "FK -> Baker.id; owning operator."
      - name: lot_code
        type: string
        source: input
        description: "Supplier lot code."
      - name: allergens
        type: array
        source: input
        default: []
        description: "Allergen strings intrinsic to this lot."
      - name: cross_contact_allergens
        type: array
        source: input
        default: []
        description: "Allergens the supplier flags as possible cross-contact on this lot."
      - name: lot_status
        type: enum
        source: system
        default: RECEIVED
        description: "Lot lifecycle; only RELEASED lots may be referenced by a component used in production."
        constraints: "one of RECEIVED, RELEASED, CONSUMED, RECALLED, EXPIRED"
      - name: received_at
        type: datetime
        source: input
        description: "Receipt instant."
      - name: expires_at
        type: datetime
        source: input
        description: "Lot expiry instant."

  - name: MenuItem
    parent: Baker
    common_fields: true
    fields:
      - name: baker_id
        type: string
        source: input
        description: "FK -> Baker.id; owning operator."
      - name: recipe_id
        type: string
        source: input
        description: "FK -> Recipe.id; the recipe this item is produced from."
      - name: name
        type: string
        source: input
        description: "Menu item name."
      - name: product_class
        type: enum
        source: input
        description: "Cottage-food product class; only DTC_ELIGIBLE_PRODUCT_CLASS may be sold direct."
        constraints: "one of SHELF_STABLE, REFRIGERATION_REQUIRED"
      - name: pricing_basis
        type: enum
        source: input
        description: "Selects the line-pricing variant."
        constraints: "one of PER_UNIT, PER_DOZEN_BAKERS"
      - name: unit_price_cents
        type: integer
        source: input
        description: "Price of one unit in cents."
      - name: dozen_price_cents
        type: integer
        source: input
        description: "Price of one baker's dozen (BAKERS_DOZEN_UNITS units) in cents."
      - name: temp_sensitive
        type: boolean
        source: input
        default: false
        description: "True when a porch handoff of this item requires a cooler."
      - name: oven_profile
        type: enum
        source: input
        default: STANDARD
        description: "Selects the oven-hours variant."
        constraints: "one of STANDARD, LONG_BAKE"
      - name: oven_hours_per_batch
        type: number
        source: input
        default: 1.5
        description: "Oven hours per batch slot used by the LONG_BAKE variant."
      - name: yield_units_per_slot
        type: integer
        source: input
        default: 24
        description: "Units a single batch slot yields; defaults to DEFAULT_YIELD_UNITS_PER_SLOT."
      - name: listing_status
        type: enum
        source: system
        default: DRAFT
        description: "Storefront listing posture."
        constraints: "one of DRAFT, LISTED, PAUSED, DELISTED"
      - name: rating_avg
        type: number
        source: computed
        description: "Stored rating rollup per calculations.menu_item_rating_rollup; null below RATING_ROLLUP_MIN_REVIEWS."
      - name: rating_count
        type: integer
        source: computed
        default: 0
        description: "Count of reviews counting toward the rollup."
      - name: allergen_summary
        type: array
        source: computed
        default: []
        description: "Snapshot of the backing recipe's allergen_union at the item's last recompute."

  - name: OfferWindow
    parent: Baker
    common_fields: true
    fields:
      - name: baker_id
        type: string
        source: input
        description: "FK -> Baker.id; owning operator."
      - name: label
        type: string
        source: input
        description: "Human label for the pre-order window."
      - name: opens_at
        type: datetime
        source: input
        description: "First instant orders may be placed against this window."
      - name: order_cutoff_at
        type: datetime
        source: input
        description: "Cutoff instant; orders are accepted only while now < order_cutoff_at (CUTOFF_BOUNDARY_SEMANTICS strict_exclusive)."
      - name: production_date
        type: datetime
        source: input
        description: "Instant production starts; must be at or after order_cutoff_at."
      - name: handoff_date
        type: datetime
        source: input
        description: "Instant the handoff window opens; must be at or after production_date."
      - name: handoff_window_end_at
        type: datetime
        source: input
        description: "Last instant of the scheduled handoff window; pickup grace is measured from here."
      - name: window_status
        type: enum
        source: system
        default: DRAFT
        description: "Primary lifecycle axis; LOCKED is a global write gate over order mutation."
        constraints: "one of DRAFT, OPEN, LOCKED, IN_PRODUCTION, HANDOFF_OPEN, CLOSED, CANCELLED"
      - name: plan_status
        type: enum
        source: system
        default: UNPLANNED
        description: "Production-planning axis, independent of window_status."
        constraints: "one of UNPLANNED, PLANNED, RECONCILED"
      - name: capacity_posture
        type: enum
        source: system
        default: OPEN_CAPACITY
        description: "Derived capacity axis per calculations.capacity_posture; may move back toward OPEN_CAPACITY when holds release."
        constraints: "one of OPEN_CAPACITY, CONSTRAINED, EXHAUSTED"
      - name: capacity_units
        type: integer
        source: input
        default: 240
        description: "Orderable-unit capacity for this window; defaults to WINDOW_UNIT_CAPACITY_DEFAULT."
      - name: capacity_batch_slots
        type: integer
        source: input
        default: 12
        description: "Batch-slot capacity; defaults to WINDOW_BATCH_SLOT_CAPACITY_DEFAULT."
      - name: capacity_oven_hours
        type: number
        source: input
        default: 18.0
        description: "Oven-hour capacity; defaults to WINDOW_OVEN_HOURS_CAPACITY_DEFAULT."
      - name: confirmed_units
        type: integer
        source: computed
        default: 0
        description: "Units on lines whose line_status is in {ALLOCATED, FULFILLED, SHORTED, CREDITED} plus PENDING lines of CONFIRMED orders."
      - name: held_units
        type: integer
        source: computed
        default: 0
        description: "Units on PENDING lines of orders in PENDING_HOLD whose hold has not expired."
      - name: reserved_units
        type: integer
        source: computed
        default: 0
        description: "Units pre-claimed by SubscriptionCycles in RESERVED or CONFIRMED per calculations.subscription_reserved_units."
      - name: cutoff_extension_count
        type: integer
        source: system
        default: 0
        description: "Times the cutoff has been extended; capped at CUTOFF_EXTENSION_MAX_COUNT."

  - name: Order
    parent: Customer
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the buyer."
      - name: offer_window_id
        type: string
        source: input
        description: "FK -> OfferWindow.id; the window this order is placed into."
      - name: subscription_cycle_id
        type: string
        source: input
        description: "FK -> SubscriptionCycle.id; nullable, set when the order was generated from a club cycle."
      - name: delivery_route_id
        type: string
        source: input
        description: "FK -> DeliveryRoute.id; nullable, set when the order is assigned to a delivery route."
      - name: channel
        type: enum
        source: input
        default: DTC
        description: "Sales channel; WHOLESALE is rejected because WHOLESALE_PERMITTED is false."
        constraints: "one of DTC, WHOLESALE"
      - name: handoff_mode
        type: enum
        source: input
        description: "Selects the handoff pipeline and the delivery-fee variant."
        constraints: "one of PICKUP_COUNTER, PORCH_SELF_SERVE, DELIVERY"
      - name: source
        type: enum
        source: system
        default: WALKUP
        description: "WALKUP for customer-placed orders, SUBSCRIPTION_CLUB for cycle-generated orders; drives shortfall priority."
        constraints: "one of WALKUP, SUBSCRIPTION_CLUB"
      - name: prepaid
        type: boolean
        source: computed
        default: false
        description: "True when the backing subscription's billing_mode is PREPAID; second shortfall-priority key."
      - name: order_status
        type: enum
        source: system
        default: DRAFT
        description: "Fulfilment axis."
        constraints: "one of DRAFT, PENDING_HOLD, EXPIRED_HOLD, CONFIRMED, IN_PRODUCTION, READY, FULFILLED, FORFEITED, CANCELLED, VOIDED_RECALL"
      - name: payment_status
        type: enum
        source: system
        default: UNPAID
        description: "Money axis, independent of order_status."
        constraints: "one of UNPAID, AUTHORIZED, CAPTURED, PARTIALLY_REFUNDED, REFUNDED, VOIDED"
      - name: handoff_status
        type: enum
        source: system
        default: NOT_SCHEDULED
        description: "Handoff axis, independent of order_status and payment_status."
        constraints: "one of NOT_SCHEDULED, SCHEDULED, PICKUP_READY, OUT_FOR_DELIVERY, HANDED_OFF, MISSED, FORFEITED"
      - name: placed_at
        type: datetime
        source: system
        description: "Instant the first line was added, i.e. when the hold opened; nullable while DRAFT."
      - name: hold_expires_at
        type: datetime
        source: system
        description: "placed_at + HOLD_TTL_MINUTES; nullable outside PENDING_HOLD."
      - name: allergen_ack
        type: boolean
        source: input
        default: false
        description: "Customer acknowledgement covering INTOLERANCE-tier allergen matches."
      - name: unattended_consent
        type: boolean
        source: input
        default: false
        description: "Per-order consent to unattended porch handoff."
      - name: cooler_provided
        type: boolean
        source: input
        default: false
        description: "Per-order confirmation that a cooler will be available for porch handoff."
      - name: delivery_distance_km
        type: number
        source: computed
        description: "Copied from Customer.delivery_distance_km at confirm; null for pickup orders."
      - name: stop_sequence
        type: integer
        source: computed
        description: "1-based position on the assigned delivery route; null until the route is sequenced."
      - name: subtotal_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of OrderLine.line_total_cents over lines not in {RELEASED, RECALL_VOID}."
      - name: tax_total_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of OrderLine.line_tax_cents per calculations.order_tax_total."
      - name: delivery_fee_cents
        type: integer
        source: computed
        default: 0
        description: "Zone-tier delivery fee per calculations.delivery_fee."
      - name: tip_cents
        type: integer
        source: computed
        default: 0
        description: "Tip carried from the Payment per calculations.tip_amount."
      - name: credit_applied_cents
        type: integer
        source: computed
        default: 0
        description: "Customer credit consumed by this order."
      - name: grand_total_cents
        type: integer
        source: computed
        default: 0
        description: "Amount charged per calculations.order_grand_total."
      - name: shortfall_flag
        type: boolean
        source: computed
        default: false
        description: "True once any line on this order is SHORTED or CREDITED."
      - name: rebook_count
        type: integer
        source: system
        default: 0
        description: "Times a MISSED handoff has been rebooked; capped at MISSED_REBOOK_MAX."
      - name: pickup_forfeit_at
        type: datetime
        source: computed
        description: "handoff_window_end_at + PICKUP_GRACE_MINUTES; null for delivery orders."
      - name: forfeit_latched
        type: boolean
        source: system
        default: false
        description: "Monotone latch set when the pickup grace expires; never cleared, so the grace status cannot un-fire."
      - name: fulfilled_at
        type: datetime
        source: system
        description: "Instant the handoff was recorded as HANDED_OFF; nullable."
      - name: review_window_closes_at
        type: datetime
        source: computed
        description: "fulfilled_at + REVIEW_WINDOW_DAYS; null before fulfilment."
      - name: review_window_closed_latch
        type: boolean
        source: system
        default: false
        description: "Monotone latch set the first time the review window is observed closed; never cleared."

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; owning order."
      - name: menu_item_id
        type: string
        source: input
        description: "FK -> MenuItem.id; the ordered item."
      - name: batch_id
        type: string
        source: input
        description: "FK -> Batch.id; nullable, assigned when the window is planned."
      - name: quantity
        type: integer
        source: input
        description: "Units ordered; between MIN_UNITS_PER_LINE and MAX_UNITS_PER_LINE inclusive."
      - name: disposition
        type: enum
        source: input
        default: WHOLE_UNHEATED
        description: "Selects the line-tax variant."
        constraints: "one of WHOLE_UNHEATED, WITH_UTENSILS, BY_THE_SLICE, HEATED"
      - name: line_status
        type: enum
        source: system
        default: PENDING
        description: "Line lifecycle including the hold-release branch and the recall branch."
        constraints: "one of PENDING, RELEASED, ALLOCATED, FULFILLED, SHORTED, CREDITED, RECALL_VOID"
      - name: pricing_basis_applied
        type: enum
        source: computed
        description: "Variant actually used, copied from MenuItem.pricing_basis at pricing time."
        constraints: "one of PER_UNIT, PER_DOZEN_BAKERS"
      - name: taxable
        type: boolean
        source: computed
        default: false
        description: "True when disposition is not WHOLE_UNHEATED."
      - name: line_total_cents
        type: integer
        source: computed
        default: 0
        description: "Line price per calculations.line_pricing."
      - name: line_tax_cents
        type: integer
        source: computed
        default: 0
        description: "Per-line tax per calculations.line_tax."
      - name: allocated_units
        type: integer
        source: computed
        default: 0
        description: "Units allocated from the batch's actual yield."
      - name: shorted_units
        type: integer
        source: computed
        default: 0
        description: "quantity - allocated_units after allocation."
      - name: allergen_union
        type: array
        source: computed
        default: []
        description: "Allergen union of the backing recipe tree at line-pricing time."
      - name: hold_expires_at
        type: datetime
        source: computed
        description: "Mirror of Order.hold_expires_at while the line is PENDING and the order is PENDING_HOLD."

  - name: Batch
    parent: OfferWindow
    common_fields: true
    fields:
      - name: offer_window_id
        type: string
        source: input
        description: "FK -> OfferWindow.id; the window being produced."
      - name: menu_item_id
        type: string
        source: input
        description: "FK -> MenuItem.id; the item produced by this batch."
      - name: recipe_id
        type: string
        source: input
        description: "FK -> Recipe.id; the recipe in force when the batch was planned."
      - name: batch_status
        type: enum
        source: system
        default: PLANNED
        description: "Production lifecycle with a yield fork and a recall branch."
        constraints: "one of PLANNED, MIXED, BAKED, YIELD_CONFIRMED, UNDER_YIELD, ALLOCATED, CLOSED, SCRAPPED_RECALL"
      - name: slot_count
        type: integer
        source: computed
        description: "Batch slots required per calculations.batch_slot_demand."
      - name: planned_yield_units
        type: integer
        source: computed
        description: "slot_count * MenuItem.yield_units_per_slot."
      - name: actual_yield_units
        type: integer
        source: input
        description: "Units actually produced, supplied at yield confirmation; null before that."
      - name: surplus_units
        type: integer
        source: computed
        default: 0
        description: "actual_yield_units minus the sum of allocated units; participates in the yield conservation invariant."
      - name: oven_hours
        type: number
        source: computed
        description: "Oven hours per calculations.batch_oven_hours."
      - name: recipe_version_pinned
        type: integer
        source: system
        description: "Recipe.published_version captured when the batch was planned."

  - name: Label
    parent: OrderLine
    common_fields: true
    fields:
      - name: order_line_id
        type: string
        source: input
        description: "FK -> OrderLine.id; the line this label is affixed to."
      - name: recipe_id
        type: string
        source: input
        description: "FK -> Recipe.id; the recipe the allergen statement was derived from."
      - name: recipe_version_pinned
        type: integer
        source: system
        description: "Recipe.published_version at issuance; a later publish supersedes this label."
      - name: label_status
        type: enum
        source: system
        default: ISSUED
        description: "Label lifecycle; only ISSUED labels satisfy the handoff write gate."
        constraints: "one of ISSUED, SUPERSEDED, VOID, CONSUMED"
      - name: net_weight_grams
        type: number
        source: input
        description: "Declared net weight on the label."
      - name: allergen_union
        type: array
        source: computed
        default: []
        description: "Recursive allergen union pinned at issuance per calculations.allergen_union."
      - name: cross_contact_advisory
        type: string
        source: computed
        description: "CROSS_CONTACT_ADVISORY_TEXT when the advisory applies at issuance, otherwise null."
      - name: statement_text
        type: string
        source: computed
        description: "COTTAGE_FOOD_STATEMENT_TEXT concatenated with the allergen statement."

  - name: Subscription
    parent: Customer
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the club member."
      - name: menu_item_id
        type: string
        source: input
        description: "FK -> MenuItem.id; the club item."
      - name: cadence
        type: enum
        source: input
        description: "Cycle cadence."
        constraints: "one of WEEKLY, BIWEEKLY, MONTHLY"
      - name: units_per_cycle
        type: integer
        source: input
        description: "Units claimed per cycle."
      - name: billing_mode
        type: enum
        source: input
        description: "Selects the cycle-pricing variant."
        constraints: "one of PREPAID, PAY_PER_CYCLE"
      - name: handoff_mode
        type: enum
        source: input
        description: "Handoff pipeline inherited by generated orders."
        constraints: "one of PICKUP_COUNTER, PORCH_SELF_SERVE, DELIVERY"
      - name: sub_status
        type: enum
        source: system
        default: PENDING
        description: "Club lifecycle with a pause loop and a PAST_DUE re-entry loop."
        constraints: "one of PENDING, ACTIVE, PAUSED, PAST_DUE, CANCELLED"
      - name: pause_count
        type: integer
        source: system
        default: 0
        description: "Times this subscription has been paused; capped at SUBSCRIPTION_PAUSE_CAP_COUNT."
      - name: past_due_since
        type: datetime
        source: system
        description: "Instant the subscription entered PAST_DUE; null otherwise."
      - name: prepaid_balance_cents
        type: integer
        source: computed
        default: 0
        description: "Prepaid credit remaining for PREPAID subscriptions."

  - name: SubscriptionCycle
    parent: Subscription
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the owning club membership."
      - name: offer_window_id
        type: string
        source: input
        description: "FK -> OfferWindow.id; the window this cycle claims capacity in."
      - name: sequence_number
        type: integer
        source: input
        description: "1-based cycle index within the subscription."
      - name: cycle_status
        type: enum
        source: system
        default: GENERATED
        description: "Cycle lifecycle with a skip branch and a cutoff-release branch."
        constraints: "one of GENERATED, RESERVED, CONFIRMED, SKIPPED, RELEASED, ORDER_PLACED"
      - name: reserved_units
        type: integer
        source: computed
        default: 0
        description: "Units this cycle pre-claims in the window per calculations.subscription_reserved_units."
      - name: skip_deadline_at
        type: datetime
        source: computed
        description: "OfferWindow.order_cutoff_at minus SKIP_DEADLINE_HOURS_BEFORE_CUTOFF."
      - name: cycle_price_cents
        type: integer
        source: computed
        default: 0
        description: "Cycle price per calculations.subscription_cycle_price."

  - name: Payment
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the order being paid."
      - name: payment_state
        type: enum
        source: system
        default: INITIATED
        description: "Money-movement lifecycle for this payment attempt."
        constraints: "one of INITIATED, AUTHORIZED, CAPTURED, SETTLED, DECLINED, VOIDED"
      - name: outcome
        type: enum
        source: input
        default: SUCCEEDED
        description: "Simulated processor outcome supplied at authorization."
        constraints: "one of SUCCEEDED, DECLINED"
      - name: tip_mode
        type: enum
        source: input
        description: "Selects the tip variant."
        constraints: "one of PERCENT, FIXED"
      - name: tip_pct
        type: number
        source: input
        description: "Tip fraction used when tip_mode is PERCENT; at most TIP_PCT_MAX."
      - name: tip_fixed_cents
        type: integer
        source: input
        description: "Tip amount used when tip_mode is FIXED; at most TIP_FIXED_MAX_CENTS."
      - name: tip_cents
        type: integer
        source: computed
        default: 0
        description: "Resolved tip per calculations.tip_amount."
      - name: authorized_cents
        type: integer
        source: computed
        default: 0
        description: "Order.grand_total_cents captured at authorization."
      - name: captured_cents
        type: integer
        source: computed
        default: 0
        description: "Amount captured; zero until capture."
      - name: refunded_cents
        type: integer
        source: computed
        default: 0
        description: "Cumulative refunded amount across all refund movements."

  - name: MoneyMovement
    parent: Customer
    common_fields: false
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the customer whose money or credit moved."
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; nullable, the order the movement belongs to."
      - name: payment_id
        type: string
        source: input
        description: "FK -> Payment.id; nullable, set for refund movements."
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; nullable, set for club prepaid deposits and prepaid cycle redemptions."
      - name: ledger_scope
        type: enum
        source: system
        description: "Which balance this movement belongs to; keeps subscription prepaid money out of the customer's general credit balance."
        constraints: "one of CUSTOMER_CREDIT, SUBSCRIPTION_PREPAID, SETTLEMENT"
      - name: movement_kind
        type: enum
        source: system
        description: "Kind of money movement."
        constraints: "one of REFUND, SHORTFALL_CREDIT, PREPAY_DEPOSIT, CREDIT_REDEEM"
      - name: reason
        type: enum
        source: system
        description: "Why the movement was created."
        constraints: "one of SHORTFALL, RECALL_VOID, CUSTOMER_CANCEL, SUBSCRIPTION_PREPAY, ORDER_APPLY"
      - name: amount_cents
        type: integer
        source: computed
        description: "Signed amount; positive increases customer credit, negative consumes it."
      - name: leg_tip_cents
        type: integer
        source: computed
        default: 0
        description: "Portion drawn from the tip leg of REFUND_WATERFALL_ORDER."
      - name: leg_delivery_fee_cents
        type: integer
        source: computed
        default: 0
        description: "Portion drawn from the delivery-fee leg."
      - name: leg_subtotal_cents
        type: integer
        source: computed
        default: 0
        description: "Portion drawn from the taxable-subtotal leg, tax included proportionally."
      - name: leg_credit_cents
        type: integer
        source: computed
        default: 0
        description: "Portion drawn from the credit leg."
      - name: expires_at
        type: datetime
        source: computed
        description: "created_at + CREDIT_EXPIRY_DAYS for credit-bearing movements; null for refunds."

  - name: DeliveryRoute
    parent: OfferWindow
    common_fields: true
    fields:
      - name: baker_id
        type: string
        source: input
        description: "FK -> Baker.id; owning operator."
      - name: offer_window_id
        type: string
        source: input
        description: "FK -> OfferWindow.id; the window whose delivery orders this route serves."
      - name: route_status
        type: enum
        source: system
        default: DRAFT
        description: "Route lifecycle; a resequence returns the route to DRAFT before re-entering SEQUENCED."
        constraints: "one of DRAFT, SEQUENCED, DISPATCHED, COMPLETED"
      - name: stop_count
        type: integer
        source: computed
        default: 0
        description: "Number of assigned orders with a stop_sequence."
      - name: total_distance_km
        type: number
        source: computed
        default: 0
        description: "Sum of assigned orders' delivery_distance_km."
      - name: dispatched_at
        type: datetime
        source: system
        description: "Instant the route was dispatched; null before."

  - name: Review
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the fulfilled order being reviewed."
      - name: menu_item_id
        type: string
        source: input
        description: "FK -> MenuItem.id; the item the rating rolls up to."
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the reviewer."
      - name: rating
        type: integer
        source: input
        description: "Star rating between RATING_SCALE_MIN and RATING_SCALE_MAX inclusive."
      - name: body
        type: string
        source: input
        description: "Free-text review body."
      - name: review_status
        type: enum
        source: system
        default: SUBMITTED
        description: "Moderation axis; HIDDEN can return to SUBMITTED on unhide."
        constraints: "one of SUBMITTED, RESPONDED, HIDDEN"
      - name: baker_response
        type: string
        source: system
        description: "Baker reply text; null until a response is recorded."
      - name: responded_at
        type: datetime
        source: system
        description: "Instant the baker responded; null otherwise."
      - name: shortfall_affected
        type: boolean
        source: computed
        default: false
        description: "True when the reviewed order has shortfall_flag true or any refund movement."
      - name: counts_toward_rollup
        type: boolean
        source: computed
        default: true
        description: "False while review_status is HIDDEN; drives the rating rollup input set."

state_machines:
  # ---------------------------------------------------------------- axis 1
  - entity: Baker
    axis: permit_status
    initial_state: PENDING
    terminal_states: []
    shape: "cyclic (SUSPENDED and CAP_REACHED both return to ACTIVE)"
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /bakery/bakers/{baker_id}/permit-status with to_status ACTIVE"
        actor: PlatformAdmin
        preconditions:
          - "Baker.permit_status == PENDING"
        side_effects:
          - "sets Baker.annual_gross_sales_cents to 0"
          - "increments Baker.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /bakery/bakers/{baker_id}/permit-status with to_status SUSPENDED"
        actor: PlatformAdmin
        preconditions:
          - "Baker.permit_status == ACTIVE"
        side_effects:
          - "all subsequent order-affecting writes for this baker fail validations[priority=15] with ERR_PERMIT_NOT_ACTIVE"
          - "increments Baker.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /bakery/bakers/{baker_id}/permit-status with to_status ACTIVE"
        actor: PlatformAdmin
        preconditions:
          - "Baker.permit_status == SUSPENDED"
        side_effects:
          - "increments Baker.version by 1"
        note: "Reinstatement loop; no order state is rewound."
      - from: ACTIVE
        to: CAP_REACHED
        trigger: "system, evaluated at the end of POST /bakery/orders/{order_id}/confirm"
        actor: system
        preconditions:
          - "Baker.annual_gross_sales_cents >= Baker.annual_cap_cents after the confirm's gross-sales recompute"
        side_effects:
          - "subsequent POST /bakery/orders/{order_id}/confirm calls for this baker fail validations[priority=15] with ERR_PERMIT_NOT_ACTIVE"
          - "increments Baker.version by 1"
        note: "The confirm that crosses the ceiling succeeds; the crossing latches the gate for the NEXT confirm. Orders that would exceed the ceiling are rejected earlier by validations[priority=51]."
      - from: CAP_REACHED
        to: ACTIVE
        trigger: "POST /bakery/bakers/{baker_id}/permit-status with to_status ACTIVE and cap_year advanced"
        actor: PlatformAdmin
        preconditions:
          - "Baker.permit_status == CAP_REACHED"
          - "request cap_year > Baker.cap_year"
        side_effects:
          - "sets Baker.cap_year to the requested cap_year"
          - "resets Baker.annual_gross_sales_cents to 0"
          - "increments Baker.version by 1"

  # ---------------------------------------------------------------- axis 2
  - entity: Recipe
    axis: recipe_status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    shape: "cyclic (PUBLISHED -> REVISING -> PUBLISHED)"
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /bakery/recipes/{recipe_id}/publish"
        actor: Baker
        preconditions:
          - "Recipe.recipe_status == DRAFT"
          - "the component/sub-recipe tree is acyclic"
          - "Recipe.tree_depth <= ALLERGEN_TREE_MAX_DEPTH"
        side_effects:
          - "increments Recipe.published_version by 1"
          - "recomputes Recipe.allergen_union, Recipe.tree_depth and Recipe.cross_contact_advisory per calculations.allergen_union and calculations.cross_contact_advisory"
          - "recomputes MenuItem.allergen_summary for every MenuItem whose recipe_id equals this Recipe.id"
          - "increments Recipe.version by 1"
      - from: PUBLISHED
        to: REVISING
        trigger: "POST /bakery/recipes/{recipe_id}/lifecycle with to_status REVISING"
        actor: Baker
        preconditions:
          - "Recipe.recipe_status == PUBLISHED"
        side_effects:
          - "increments Recipe.version by 1"
      - from: REVISING
        to: PUBLISHED
        trigger: "POST /bakery/recipes/{recipe_id}/publish"
        actor: Baker
        preconditions:
          - "Recipe.recipe_status == REVISING"
          - "the component/sub-recipe tree is acyclic"
          - "Recipe.tree_depth <= ALLERGEN_TREE_MAX_DEPTH"
        side_effects:
          - "increments Recipe.published_version by 1"
          - "recomputes Recipe.allergen_union, Recipe.tree_depth and Recipe.cross_contact_advisory"
          - "cascade hop 1: every Label with recipe_id == this Recipe.id and label_status == ISSUED transitions ISSUED -> SUPERSEDED"
          - "cascade hop 2: each superseded Label's OrderLine loses the handoff write gate, so validations[priority=35] now blocks POST /bakery/orders/{order_id}/handoff-outcome for the owning Order with ERR_LABEL_SUPERSEDED"
          - "cascade hop 3: MenuItem.allergen_summary is recomputed for every MenuItem backed by this recipe"
          - "increments Recipe.version by 1"
        note: "Republish is the revision cycle; it is the trigger of the depth-3 label-supersession cascade."
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /bakery/recipes/{recipe_id}/lifecycle with to_status RETIRED"
        actor: Baker
        preconditions:
          - "Recipe.recipe_status == PUBLISHED"
          - "no MenuItem with this recipe_id has listing_status == LISTED"
        side_effects:
          - "increments Recipe.version by 1"
      - from: REVISING
        to: RETIRED
        trigger: "POST /bakery/recipes/{recipe_id}/lifecycle with to_status RETIRED"
        actor: Baker
        preconditions:
          - "Recipe.recipe_status == REVISING"
          - "no MenuItem with this recipe_id has listing_status == LISTED"
        side_effects:
          - "increments Recipe.version by 1"

  # ---------------------------------------------------------------- axis 3
  - entity: IngredientLot
    axis: lot_status
    initial_state: RECEIVED
    terminal_states: [RECALLED, EXPIRED]
    shape: "branching (RELEASED forks to CONSUMED, RECALLED or EXPIRED with divergent side-effect sets)"
    transitions:
      - from: RECEIVED
        to: RELEASED
        trigger: "POST /bakery/ingredient-lots/{ingredient_lot_id}/release"
        actor: Baker
        preconditions:
          - "IngredientLot.lot_status == RECEIVED"
          - "logical now < IngredientLot.expires_at"
        side_effects:
          - "increments IngredientLot.version by 1"
      - from: RELEASED
        to: CONSUMED
        trigger: "system, on POST /bakery/batches/{batch_id}/advance with to_status BAKED"
        actor: system
        preconditions:
          - "IngredientLot.lot_status == RELEASED"
          - "a RecipeComponent references this lot and belongs to the baked batch's recipe tree"
        side_effects:
          - "increments IngredientLot.version by 1"
      - from: RECEIVED
        to: RECALLED
        trigger: "POST /bakery/ingredient-lots/{ingredient_lot_id}/recall"
        actor: PlatformAdmin
        preconditions:
          - "IngredientLot.lot_status == RECEIVED"
        side_effects:
          - "increments IngredientLot.version by 1"
        note: "A never-released lot has no downstream batches, so the recall cascade terminates at hop 2."
      - from: RELEASED
        to: RECALLED
        trigger: "POST /bakery/ingredient-lots/{ingredient_lot_id}/recall"
        actor: PlatformAdmin
        preconditions:
          - "IngredientLot.lot_status == RELEASED"
        side_effects:
          - "cascade hop 1: every RecipeComponent whose ingredient_lot_id equals this lot sets recalled_component to true"
          - "cascade hop 2: each such component's Recipe transitions PUBLISHED -> REVISING (recipe_status), and Recipe.version increments"
          - "cascade hop 3: every Batch whose recipe_id is that Recipe and whose batch_status is in {PLANNED, MIXED, BAKED} transitions to SCRAPPED_RECALL"
          - "cascade hop 4: every OrderLine whose batch_id is a scrapped Batch transitions to RECALL_VOID and its allocated_units resets to 0"
          - "cascade hop 5: every Order owning such a line, whose order_status is in {CONFIRMED, IN_PRODUCTION, READY}, transitions to VOIDED_RECALL; orders whose order_status is in {FULFILLED, CANCELLED, FORFEITED, VOIDED_RECALL} are left untouched"
          - "cascade hop 6: for every Order that transitioned to VOIDED_RECALL, each Label on its lines with label_status == ISSUED transitions to VOID, and if the Order's Payment.payment_state == CAPTURED a full refund runs per calculations.refund_waterfall creating a MoneyMovement with movement_kind REFUND and reason RECALL_VOID"
          - "increments IngredientLot.version by 1"
        note: "Depth-6 cascade. Hop 5 is guarded: a FULFILLED order does not void, and consequently its labels are NOT voided at hop 6."
      - from: CONSUMED
        to: RECALLED
        trigger: "POST /bakery/ingredient-lots/{ingredient_lot_id}/recall"
        actor: PlatformAdmin
        preconditions:
          - "IngredientLot.lot_status == CONSUMED"
        side_effects:
          - "runs the identical hop 1 through hop 6 cascade described on the RELEASED -> RECALLED transition"
          - "increments IngredientLot.version by 1"
        note: "A lot is most often recalled AFTER it has been baked into product, so CONSUMED must be recallable; without this transition the depth-6 cascade would be unreachable in every scenario where any batch has already reached BAKED."
      - from: RELEASED
        to: EXPIRED
        trigger: "POST /bakery/ingredient-lots/{ingredient_lot_id}/release with force_expiry_check true after the clock passes expires_at"
        actor: Baker
        preconditions:
          - "IngredientLot.lot_status == RELEASED"
          - "logical now >= IngredientLot.expires_at"
        side_effects:
          - "increments IngredientLot.version by 1"

  # ---------------------------------------------------------------- axis 4
  - entity: MenuItem
    axis: listing_status
    initial_state: DRAFT
    terminal_states: [DELISTED]
    shape: "cyclic (LISTED -> PAUSED -> LISTED)"
    transitions:
      - from: DRAFT
        to: LISTED
        trigger: "POST /bakery/menu-items/{menu_item_id}/listing-status with to_status LISTED"
        actor: Baker
        preconditions:
          - "MenuItem.listing_status == DRAFT"
          - "the backing Recipe.recipe_status == PUBLISHED"
        side_effects:
          - "recomputes MenuItem.allergen_summary from the backing recipe's allergen_union"
          - "increments MenuItem.version by 1"
      - from: LISTED
        to: PAUSED
        trigger: "POST /bakery/menu-items/{menu_item_id}/listing-status with to_status PAUSED"
        actor: Baker
        preconditions:
          - "MenuItem.listing_status == LISTED"
        side_effects:
          - "increments MenuItem.version by 1"
      - from: PAUSED
        to: LISTED
        trigger: "POST /bakery/menu-items/{menu_item_id}/listing-status with to_status LISTED"
        actor: Baker
        preconditions:
          - "MenuItem.listing_status == PAUSED"
          - "the backing Recipe.recipe_status == PUBLISHED"
        side_effects:
          - "recomputes MenuItem.allergen_summary"
          - "increments MenuItem.version by 1"
      - from: LISTED
        to: DELISTED
        trigger: "POST /bakery/menu-items/{menu_item_id}/listing-status with to_status DELISTED"
        actor: Baker
        preconditions:
          - "MenuItem.listing_status == LISTED"
        side_effects:
          - "increments MenuItem.version by 1"
      - from: PAUSED
        to: DELISTED
        trigger: "POST /bakery/menu-items/{menu_item_id}/listing-status with to_status DELISTED"
        actor: Baker
        preconditions:
          - "MenuItem.listing_status == PAUSED"
        side_effects:
          - "increments MenuItem.version by 1"

  # ---------------------------------------------------------------- axis 5
  - entity: OfferWindow
    axis: window_status
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    shape: "cyclic (LOCKED -> OPEN on a cutoff extension) with a CANCELLED fork"
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /bakery/offer-windows/{offer_window_id}/advance with to_status OPEN"
        actor: Baker
        preconditions:
          - "OfferWindow.window_status == DRAFT"
          - "Baker.permit_status == ACTIVE"
          - "logical now >= OfferWindow.opens_at"
        side_effects:
          - "recomputes OfferWindow.capacity_posture per calculations.capacity_posture"
          - "increments OfferWindow.version by 1"
      - from: OPEN
        to: LOCKED
        trigger: "POST /bakery/offer-windows/{offer_window_id}/lock"
        actor: Baker
        preconditions:
          - "OfferWindow.window_status == OPEN"
          - "logical now >= OfferWindow.order_cutoff_at"
        side_effects:
          - "every Order on this window with order_status == PENDING_HOLD transitions to EXPIRED_HOLD and its PENDING lines transition to RELEASED"
          - "every SubscriptionCycle on this window with cycle_status == RESERVED transitions to RELEASED and its reserved_units drop to 0"
          - "recomputes OfferWindow.held_units, OfferWindow.reserved_units and OfferWindow.capacity_posture"
          - "a LOCKED window is a global write gate: validations[priority=16] rejects every order-mutating call on this window with ERR_WINDOW_LOCKED"
          - "increments OfferWindow.version by 1"
      - from: LOCKED
        to: OPEN
        trigger: "POST /bakery/offer-windows/{offer_window_id}/extend-cutoff"
        actor: Baker
        preconditions:
          - "OfferWindow.window_status == LOCKED"
          - "OfferWindow.plan_status == UNPLANNED"
          - "OfferWindow.cutoff_extension_count < CUTOFF_EXTENSION_MAX_COUNT"
        side_effects:
          - "sets OfferWindow.order_cutoff_at to logical now plus CUTOFF_EXTENSION_MINUTES"
          - "increments OfferWindow.cutoff_extension_count by 1"
          - "recomputes skip_deadline_at on every SubscriptionCycle attached to this window"
          - "increments OfferWindow.version by 1"
        note: "Re-entry loop: released holds and released cycles are NOT restored, so capacity rises on re-open."
      - from: LOCKED
        to: IN_PRODUCTION
        trigger: "POST /bakery/offer-windows/{offer_window_id}/advance with to_status IN_PRODUCTION"
        actor: Baker
        preconditions:
          - "OfferWindow.window_status == LOCKED"
          - "OfferWindow.plan_status == PLANNED"
          - "logical now >= OfferWindow.production_date"
        side_effects:
          - "every Order on this window with order_status == CONFIRMED transitions to IN_PRODUCTION"
          - "increments OfferWindow.version by 1"
      - from: IN_PRODUCTION
        to: HANDOFF_OPEN
        trigger: "POST /bakery/offer-windows/{offer_window_id}/advance with to_status HANDOFF_OPEN"
        actor: Baker
        preconditions:
          - "OfferWindow.window_status == IN_PRODUCTION"
          - "every Batch on this window has batch_status in {ALLOCATED, CLOSED, SCRAPPED_RECALL}"
          - "logical now >= OfferWindow.handoff_date"
        side_effects:
          - "every Order on this window with order_status == IN_PRODUCTION transitions to READY"
          - "sets Order.pickup_forfeit_at to OfferWindow.handoff_window_end_at plus PICKUP_GRACE_MINUTES for every PICKUP_COUNTER or PORCH_SELF_SERVE order on this window"
          - "increments OfferWindow.version by 1"
      - from: HANDOFF_OPEN
        to: CLOSED
        trigger: "POST /bakery/offer-windows/{offer_window_id}/advance with to_status CLOSED"
        actor: Baker
        preconditions:
          - "OfferWindow.window_status == HANDOFF_OPEN"
          - "no Order on this window has order_status == READY"
        side_effects:
          - "sets OfferWindow.plan_status to RECONCILED"
          - "increments OfferWindow.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /bakery/offer-windows/{offer_window_id}/advance with to_status CANCELLED"
        actor: Baker
        preconditions:
          - "OfferWindow.window_status == DRAFT"
        side_effects:
          - "increments OfferWindow.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /bakery/offer-windows/{offer_window_id}/advance with to_status CANCELLED"
        actor: Baker
        preconditions:
          - "OfferWindow.window_status == OPEN"
          - "no Order on this window has order_status in {CONFIRMED, IN_PRODUCTION, READY}"
        side_effects:
          - "every Order on this window with order_status in {DRAFT, PENDING_HOLD, EXPIRED_HOLD} transitions to CANCELLED and its lines transition to RELEASED"
          - "increments OfferWindow.version by 1"

  # ---------------------------------------------------------------- axis 6
  - entity: OfferWindow
    axis: plan_status
    initial_state: UNPLANNED
    terminal_states: [RECONCILED]
    shape: "cyclic (PLANNED -> UNPLANNED on replan)"
    transitions:
      - from: UNPLANNED
        to: PLANNED
        trigger: "POST /bakery/offer-windows/{offer_window_id}/plan with mode PLAN"
        actor: Baker
        preconditions:
          - "OfferWindow.plan_status == UNPLANNED"
          - "OfferWindow.window_status == LOCKED"
        side_effects:
          - "creates one Batch per distinct menu_item_id across CONFIRMED orders on this window, with slot_count and planned_yield_units per calculations.batch_slot_demand and oven_hours per calculations.batch_oven_hours"
          - "sets Batch.recipe_version_pinned to the MenuItem's Recipe.published_version"
          - "sets OrderLine.batch_id on every line of a CONFIRMED order to the matching Batch"
          - "increments OfferWindow.version by 1"
      - from: PLANNED
        to: UNPLANNED
        trigger: "POST /bakery/offer-windows/{offer_window_id}/plan with mode REPLAN"
        actor: Baker
        preconditions:
          - "OfferWindow.plan_status == PLANNED"
          - "OfferWindow.window_status == LOCKED"
          - "every Batch on this window has batch_status == PLANNED"
        side_effects:
          - "deletes every Batch on this window and clears OrderLine.batch_id on every line pointing at them"
          - "increments OfferWindow.version by 1"
        note: "Replan loop; only possible before any batch is mixed."
      - from: PLANNED
        to: RECONCILED
        trigger: "system, on POST /bakery/offer-windows/{offer_window_id}/advance with to_status CLOSED"
        actor: system
        preconditions:
          - "OfferWindow.plan_status == PLANNED"
          - "OfferWindow.window_status transitions HANDOFF_OPEN -> CLOSED in the same request"
        side_effects:
          - "increments OfferWindow.version by 1"

  # ---------------------------------------------------------------- axis 7
  - entity: OfferWindow
    axis: capacity_posture
    initial_state: OPEN_CAPACITY
    terminal_states: []
    shape: "cyclic (EXHAUSTED -> CONSTRAINED -> OPEN_CAPACITY when holds and reservations release)"
    transitions:
      - from: OPEN_CAPACITY
        to: CONSTRAINED
        trigger: "system, recomputed after every capacity-affecting write on this window"
        actor: system
        preconditions:
          - "calculations.capacity_posture yields CONSTRAINED, i.e. the maximum utilization across the three axes is >= CAPACITY_CONSTRAINED_UTILIZATION_PCT and no axis is fully consumed"
        side_effects:
          - "increments OfferWindow.version by 1"
      - from: CONSTRAINED
        to: EXHAUSTED
        trigger: "system, recomputed after every capacity-affecting write on this window"
        actor: system
        preconditions:
          - "calculations.capacity_posture yields EXHAUSTED, i.e. at least one of units_remaining, batch_slots_remaining or oven_hours_remaining is 0"
        side_effects:
          - "increments OfferWindow.version by 1"
      - from: EXHAUSTED
        to: CONSTRAINED
        trigger: "system, recomputed on POST /bakery/_holds/expire-due or on a line deletion by hold release"
        actor: system
        preconditions:
          - "calculations.capacity_posture yields CONSTRAINED after held or reserved units were released"
        side_effects:
          - "increments OfferWindow.version by 1"
        note: "Non-monotone availability: capacity rises with no cancellation because expired holds release units."
      - from: CONSTRAINED
        to: OPEN_CAPACITY
        trigger: "system, recomputed on POST /bakery/_holds/expire-due or on a line deletion by hold release"
        actor: system
        preconditions:
          - "calculations.capacity_posture yields OPEN_CAPACITY after held or reserved units were released"
        side_effects:
          - "increments OfferWindow.version by 1"
      - from: OPEN_CAPACITY
        to: EXHAUSTED
        trigger: "system, recomputed after a single write that consumes an entire axis"
        actor: system
        preconditions:
          - "calculations.capacity_posture yields EXHAUSTED without passing through CONSTRAINED"
        side_effects:
          - "increments OfferWindow.version by 1"
        note: "Reachable because a single line can consume the last batch slot while unit utilization is still below CAPACITY_CONSTRAINED_UTILIZATION_PCT."
      - from: EXHAUSTED
        to: OPEN_CAPACITY
        trigger: "system, recomputed on POST /bakery/_holds/expire-due"
        actor: system
        preconditions:
          - "calculations.capacity_posture yields OPEN_CAPACITY after held units were released"
        side_effects:
          - "increments OfferWindow.version by 1"

  # ---------------------------------------------------------------- axis 8
  - entity: Order
    axis: order_status
    initial_state: DRAFT
    terminal_states: [FULFILLED, FORFEITED, CANCELLED, VOIDED_RECALL]
    shape: "cyclic (PENDING_HOLD -> EXPIRED_HOLD -> PENDING_HOLD) with terminal forks"
    transitions:
      - from: DRAFT
        to: PENDING_HOLD
        trigger: "POST /bakery/orders/{order_id}/lines (first line)"
        actor: Customer
        preconditions:
          - "Order.order_status == DRAFT"
          - "OfferWindow.window_status == OPEN"
          - "logical now < OfferWindow.order_cutoff_at"
        side_effects:
          - "sets Order.placed_at to logical now"
          - "sets Order.hold_expires_at to Order.placed_at plus HOLD_TTL_MINUTES"
          - "adds the new line's units to OfferWindow.held_units and recomputes OfferWindow.capacity_posture"
          - "increments Order.version by 1"
      - from: PENDING_HOLD
        to: EXPIRED_HOLD
        trigger: "POST /bakery/_holds/expire-due"
        actor: PlatformAdmin
        preconditions:
          - "Order.order_status == PENDING_HOLD"
          - "logical now >= Order.hold_expires_at"
        side_effects:
          - "every OrderLine of this order with line_status == PENDING transitions to RELEASED"
          - "subtracts the released units from OfferWindow.held_units and recomputes OfferWindow.capacity_posture, which may move it back toward OPEN_CAPACITY"
          - "clears Order.hold_expires_at to null"
          - "increments Order.version by 1"
      - from: EXPIRED_HOLD
        to: PENDING_HOLD
        trigger: "POST /bakery/orders/{order_id}/lines"
        actor: Customer
        preconditions:
          - "Order.order_status == EXPIRED_HOLD"
          - "OfferWindow.window_status == OPEN"
          - "logical now < OfferWindow.order_cutoff_at"
        side_effects:
          - "sets Order.placed_at to logical now and Order.hold_expires_at to that plus HOLD_TTL_MINUTES"
          - "adds the new line's units to OfferWindow.held_units"
          - "increments Order.version by 1"
        note: "Re-entry loop; the previously RELEASED lines stay RELEASED and never re-enter pricing."
      - from: PENDING_HOLD
        to: CONFIRMED
        trigger: "POST /bakery/orders/{order_id}/confirm"
        actor: Customer
        preconditions:
          - "Order.order_status == PENDING_HOLD"
          - "OfferWindow.window_status == OPEN"
          - "logical now < OfferWindow.order_cutoff_at"
          - "logical now < Order.hold_expires_at"
          - "at least one OrderLine with line_status == PENDING"
        side_effects:
          - "prices every PENDING line per calculations.line_pricing and calculations.line_tax"
          - "sets Order.subtotal_cents, Order.tax_total_cents and Order.delivery_fee_cents per calculations.order_subtotal, calculations.order_tax_total and calculations.delivery_fee"
          - "sets Order.delivery_distance_km from Customer.delivery_distance_km when handoff_mode == DELIVERY"
          - "moves the order's units from OfferWindow.held_units to OfferWindow.confirmed_units and clears Order.hold_expires_at"
          - "recomputes Baker.annual_gross_sales_cents per calculations.annual_gross_sales_to_date"
          - "may transition Baker.permit_status ACTIVE -> CAP_REACHED"
          - "recomputes OfferWindow.capacity_posture"
          - "increments Order.version by 1"
      - from: CONFIRMED
        to: IN_PRODUCTION
        trigger: "system, on POST /bakery/offer-windows/{offer_window_id}/advance with to_status IN_PRODUCTION"
        actor: system
        preconditions:
          - "Order.order_status == CONFIRMED"
        side_effects:
          - "increments Order.version by 1"
      - from: IN_PRODUCTION
        to: READY
        trigger: "system, on POST /bakery/offer-windows/{offer_window_id}/advance with to_status HANDOFF_OPEN"
        actor: system
        preconditions:
          - "Order.order_status == IN_PRODUCTION"
        side_effects:
          - "sets Order.pickup_forfeit_at for PICKUP_COUNTER and PORCH_SELF_SERVE orders"
          - "increments Order.version by 1"
      - from: READY
        to: FULFILLED
        trigger: "POST /bakery/orders/{order_id}/handoff-outcome with outcome HANDED_OFF"
        actor: Baker
        preconditions:
          - "Order.order_status == READY"
          - "Order.handoff_status in {PICKUP_READY, OUT_FOR_DELIVERY}"
          - "every OrderLine not in {RELEASED, RECALL_VOID} has a Label with label_status == ISSUED"
        side_effects:
          - "sets Order.fulfilled_at to logical now and Order.review_window_closes_at to that plus REVIEW_WINDOW_DAYS"
          - "every OrderLine with line_status in {ALLOCATED, CREDITED} transitions to FULFILLED"
          - "every Label on those lines transitions ISSUED -> CONSUMED"
          - "increments Order.version by 1"
      - from: READY
        to: FORFEITED
        trigger: "POST /bakery/orders/{order_id}/handoff-outcome with outcome FORFEITED"
        actor: Baker
        preconditions:
          - "Order.order_status == READY"
          - "Order.handoff_status == MISSED"
          - "Order.handoff_mode in {PICKUP_COUNTER, PORCH_SELF_SERVE}"
          - "logical now >= Order.pickup_forfeit_at"
        side_effects:
          - "sets Order.forfeit_latched to true, permanently"
          - "refunds FORFEIT_REFUND_PCT of the captured amount, i.e. nothing"
          - "increments Order.version by 1"
      - from: PENDING_HOLD
        to: CANCELLED
        trigger: "POST /bakery/orders/{order_id}/cancel"
        actor: Customer
        preconditions:
          - "Order.order_status == PENDING_HOLD"
        side_effects:
          - "every OrderLine with line_status == PENDING transitions to RELEASED and OfferWindow.held_units drops accordingly"
          - "increments Order.version by 1"
      - from: EXPIRED_HOLD
        to: CANCELLED
        trigger: "POST /bakery/orders/{order_id}/cancel"
        actor: Customer
        preconditions:
          - "Order.order_status == EXPIRED_HOLD"
        side_effects:
          - "increments Order.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /bakery/orders/{order_id}/cancel"
        actor: Customer
        preconditions:
          - "Order.order_status == CONFIRMED"
          - "OfferWindow.window_status == OPEN"
          - "logical now < OfferWindow.order_cutoff_at"
        side_effects:
          - "every OrderLine with line_status == PENDING transitions to RELEASED"
          - "subtracts the order's units from OfferWindow.confirmed_units and recomputes OfferWindow.capacity_posture"
          - "recomputes Baker.annual_gross_sales_cents downward"
          - "if Payment.payment_state == CAPTURED a full refund runs per calculations.refund_waterfall creating a MoneyMovement with reason CUSTOMER_CANCEL; if Payment.payment_state == AUTHORIZED it transitions to VOIDED"
          - "increments Order.version by 1"
      - from: CONFIRMED
        to: VOIDED_RECALL
        trigger: "system, cascade hop 5 of POST /bakery/ingredient-lots/{ingredient_lot_id}/recall"
        actor: system
        preconditions:
          - "Order.order_status == CONFIRMED"
          - "at least one OrderLine of this order transitioned to RECALL_VOID at hop 4"
        side_effects:
          - "cascade hop 6: every ISSUED Label on this order's lines transitions to VOID and a full refund runs when Payment.payment_state == CAPTURED"
          - "recomputes Baker.annual_gross_sales_cents downward"
          - "increments Order.version by 1"
      - from: IN_PRODUCTION
        to: VOIDED_RECALL
        trigger: "system, cascade hop 5 of POST /bakery/ingredient-lots/{ingredient_lot_id}/recall"
        actor: system
        preconditions:
          - "Order.order_status == IN_PRODUCTION"
          - "at least one OrderLine of this order transitioned to RECALL_VOID at hop 4"
        side_effects:
          - "cascade hop 6: every ISSUED Label on this order's lines transitions to VOID and a full refund runs when Payment.payment_state == CAPTURED"
          - "increments Order.version by 1"
      - from: READY
        to: VOIDED_RECALL
        trigger: "system, cascade hop 5 of POST /bakery/ingredient-lots/{ingredient_lot_id}/recall"
        actor: system
        preconditions:
          - "Order.order_status == READY"
          - "at least one OrderLine of this order transitioned to RECALL_VOID at hop 4"
        side_effects:
          - "cascade hop 6: every ISSUED Label on this order's lines transitions to VOID and a full refund runs when Payment.payment_state == CAPTURED"
          - "increments Order.version by 1"

  # ---------------------------------------------------------------- axis 9
  - entity: Order
    axis: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED, VOIDED]
    shape: "cyclic (PARTIALLY_REFUNDED -> PARTIALLY_REFUNDED on each further partial refund)"
    transitions:
      - from: UNPAID
        to: AUTHORIZED
        trigger: "POST /bakery/payments with outcome SUCCEEDED"
        actor: Customer
        preconditions:
          - "Order.payment_status == UNPAID"
          - "Order.order_status in {CONFIRMED, IN_PRODUCTION, READY}"
        side_effects:
          - "creates a Payment in AUTHORIZED with tip_cents per calculations.tip_amount"
          - "sets Order.tip_cents, Order.credit_applied_cents and Order.grand_total_cents per calculations.order_grand_total"
          - "creates a negative MoneyMovement with movement_kind CREDIT_REDEEM, reason ORDER_APPLY and ledger_scope CUSTOMER_CREDIT when credit_applied_cents > 0"
          - "increments Order.version by 1"
      - from: AUTHORIZED
        to: CAPTURED
        trigger: "POST /bakery/payments/{payment_id}/capture"
        actor: Baker
        preconditions:
          - "Order.payment_status == AUTHORIZED"
          - "Payment.payment_state == AUTHORIZED"
        side_effects:
          - "sets Payment.captured_cents to Payment.authorized_cents and Payment.payment_state to CAPTURED"
          - "recomputes Baker.payout_net_cents per calculations.payout_period_net"
          - "increments Order.version by 1"
      - from: AUTHORIZED
        to: VOIDED
        trigger: "system, on POST /bakery/orders/{order_id}/cancel"
        actor: system
        preconditions:
          - "Order.payment_status == AUTHORIZED"
        side_effects:
          - "sets Payment.payment_state to VOIDED"
          - "when Order.credit_applied_cents > 0, creates a MoneyMovement with movement_kind PREPAY_DEPOSIT, reason CUSTOMER_CANCEL and ledger_scope CUSTOMER_CREDIT whose amount_cents equals Order.credit_applied_cents, restoring the customer's credit balance"
          - "increments Order.version by 1"
      - from: CAPTURED
        to: PARTIALLY_REFUNDED
        trigger: "POST /bakery/payments/{payment_id}/refunds with amount_cents less than the refundable remainder"
        actor: Baker
        preconditions:
          - "Order.payment_status == CAPTURED"
          - "Payment.payment_state == CAPTURED"
          - "requested amount_cents < Payment.captured_cents - Payment.refunded_cents"
        side_effects:
          - "creates a MoneyMovement with movement_kind REFUND, ledger_scope SETTLEMENT and per-leg amounts per calculations.refund_waterfall"
          - "increases Payment.refunded_cents"
          - "recomputes Baker.annual_gross_sales_cents and Baker.payout_net_cents"
          - "increments Order.version by 1"
      - from: PARTIALLY_REFUNDED
        to: PARTIALLY_REFUNDED
        trigger: "POST /bakery/payments/{payment_id}/refunds with amount_cents less than the remaining refundable amount"
        actor: Baker
        preconditions:
          - "Order.payment_status == PARTIALLY_REFUNDED"
          - "requested amount_cents < Payment.captured_cents - Payment.refunded_cents"
        side_effects:
          - "creates a further MoneyMovement REFUND continuing the waterfall from the first unexhausted leg"
          - "increments Order.version by 1"
        note: "Self-loop; the waterfall resumes at the leg the previous refund left partly consumed."
      - from: PARTIALLY_REFUNDED
        to: REFUNDED
        trigger: "POST /bakery/payments/{payment_id}/refunds with amount_cents equal to the remaining refundable amount"
        actor: Baker
        preconditions:
          - "Order.payment_status == PARTIALLY_REFUNDED"
          - "requested amount_cents == Payment.captured_cents - Payment.refunded_cents"
        side_effects:
          - "sets Payment.refunded_cents equal to Payment.captured_cents"
          - "increments Order.version by 1"
      - from: CAPTURED
        to: REFUNDED
        trigger: "POST /bakery/payments/{payment_id}/refunds with amount_cents equal to Payment.captured_cents, or cascade hop 6 of a recall"
        actor: Baker
        preconditions:
          - "Order.payment_status == CAPTURED"
          - "requested amount_cents == Payment.captured_cents"
        side_effects:
          - "sets Payment.refunded_cents equal to Payment.captured_cents"
          - "increments Order.version by 1"

  # --------------------------------------------------------------- axis 10
  - entity: Order
    axis: handoff_status
    initial_state: NOT_SCHEDULED
    terminal_states: [HANDED_OFF, FORFEITED]
    shape: "cyclic (MISSED -> SCHEDULED on rebook) with two structurally different pipelines"
    transitions:
      - from: NOT_SCHEDULED
        to: SCHEDULED
        trigger: "POST /bakery/orders/{order_id}/schedule-handoff"
        actor: Customer
        preconditions:
          - "Order.handoff_status == NOT_SCHEDULED"
          - "Order.order_status in {CONFIRMED, IN_PRODUCTION}"
          - "for PORCH_SELF_SERVE, Order.unattended_consent == true"
          - "for PORCH_SELF_SERVE with any temp_sensitive line, Order.cooler_provided == true"
          - "for DELIVERY, Order.delivery_distance_km <= Baker.permitted_radius_km and Order.subtotal_cents >= DELIVERY_MINIMUM_CENTS"
        side_effects:
          - "for DELIVERY, sets Order.delivery_route_id to the referenced route"
          - "increments Order.version by 1"
      - from: SCHEDULED
        to: PICKUP_READY
        trigger: "system, on POST /bakery/offer-windows/{offer_window_id}/advance with to_status HANDOFF_OPEN, or on POST /bakery/orders/{order_id}/schedule-handoff when the window is already HANDOFF_OPEN"
        actor: system
        preconditions:
          - "Order.handoff_status == SCHEDULED"
          - "Order.handoff_mode in {PICKUP_COUNTER, PORCH_SELF_SERVE}"
        side_effects:
          - "increments Order.version by 1"
      - from: SCHEDULED
        to: OUT_FOR_DELIVERY
        trigger: "system, on POST /bakery/delivery-routes/{delivery_route_id}/status with to_status DISPATCHED"
        actor: system
        preconditions:
          - "Order.handoff_status == SCHEDULED"
          - "Order.handoff_mode == DELIVERY"
          - "Order.order_status == READY"
        side_effects:
          - "increments Order.version by 1"
      - from: PICKUP_READY
        to: HANDED_OFF
        trigger: "POST /bakery/orders/{order_id}/handoff-outcome with outcome HANDED_OFF"
        actor: Baker
        preconditions:
          - "Order.handoff_status == PICKUP_READY"
          - "logical now < Order.pickup_forfeit_at"
        side_effects:
          - "Order.order_status transitions READY -> FULFILLED"
          - "increments Order.version by 1"
      - from: OUT_FOR_DELIVERY
        to: HANDED_OFF
        trigger: "POST /bakery/orders/{order_id}/handoff-outcome with outcome HANDED_OFF"
        actor: Baker
        preconditions:
          - "Order.handoff_status == OUT_FOR_DELIVERY"
        side_effects:
          - "Order.order_status transitions READY -> FULFILLED"
          - "increments Order.version by 1"
        note: "The delivery pipeline has no grace check; validations[priority=39] applies to pickup modes only."
      - from: PICKUP_READY
        to: MISSED
        trigger: "POST /bakery/orders/{order_id}/handoff-outcome with outcome MISSED"
        actor: Baker
        preconditions:
          - "Order.handoff_status == PICKUP_READY"
        side_effects:
          - "increments Order.version by 1"
      - from: OUT_FOR_DELIVERY
        to: MISSED
        trigger: "POST /bakery/orders/{order_id}/handoff-outcome with outcome MISSED"
        actor: Baker
        preconditions:
          - "Order.handoff_status == OUT_FOR_DELIVERY"
        side_effects:
          - "increments Order.version by 1"
      - from: MISSED
        to: SCHEDULED
        trigger: "POST /bakery/orders/{order_id}/schedule-handoff"
        actor: Customer
        preconditions:
          - "Order.handoff_status == MISSED"
          - "Order.rebook_count < MISSED_REBOOK_MAX"
          - "Order.forfeit_latched == false"
        side_effects:
          - "increments Order.rebook_count by 1"
          - "when OfferWindow.window_status == HANDOFF_OPEN and Order.handoff_mode is PICKUP_COUNTER or PORCH_SELF_SERVE, handoff_status advances a second step SCHEDULED -> PICKUP_READY inside the same request, so the rebooked order is immediately collectable again"
          - "increments Order.version by 1"
        note: "Rebook loop, capped at MISSED_REBOOK_MAX. The same-request second step is what makes a SECOND miss (and therefore validations[priority=45]) reachable."
      - from: MISSED
        to: FORFEITED
        trigger: "POST /bakery/orders/{order_id}/handoff-outcome with outcome FORFEITED"
        actor: Baker
        preconditions:
          - "Order.handoff_status == MISSED"
          - "logical now >= Order.pickup_forfeit_at"
        side_effects:
          - "Order.order_status transitions READY -> FORFEITED and Order.forfeit_latched is set to true"
          - "increments Order.version by 1"

  # --------------------------------------------------------------- axis 11
  - entity: OrderLine
    axis: line_status
    initial_state: PENDING
    terminal_states: [RELEASED, FULFILLED, RECALL_VOID]
    shape: "branching (PENDING forks to ALLOCATED, SHORTED, RELEASED or RECALL_VOID with divergent side-effect sets)"
    transitions:
      - from: PENDING
        to: RELEASED
        trigger: "POST /bakery/_holds/expire-due, POST /bakery/orders/{order_id}/cancel, or the OPEN -> LOCKED window transition"
        actor: system
        preconditions:
          - "OrderLine.line_status == PENDING"
          - "the owning Order.order_status is in {PENDING_HOLD, EXPIRED_HOLD, CONFIRMED, CANCELLED}"
        side_effects:
          - "subtracts OrderLine.quantity from OfferWindow.held_units or OfferWindow.confirmed_units, whichever the line was counted in"
          - "recomputes OfferWindow.capacity_posture"
          - "increments OrderLine.version by 1"
      - from: PENDING
        to: ALLOCATED
        trigger: "system, on POST /bakery/batches/{batch_id}/confirm-yield when the line receives its full quantity"
        actor: system
        preconditions:
          - "OrderLine.line_status == PENDING"
          - "OrderLine.batch_id is the confirming batch"
          - "calculations.shortfall_allocation grants allocated_units == OrderLine.quantity"
        side_effects:
          - "sets OrderLine.allocated_units to OrderLine.quantity and OrderLine.shorted_units to 0"
          - "increments OrderLine.version by 1"
      - from: PENDING
        to: SHORTED
        trigger: "system, on POST /bakery/batches/{batch_id}/confirm-yield when the line receives less than its full quantity"
        actor: system
        preconditions:
          - "OrderLine.line_status == PENDING"
          - "OrderLine.batch_id is the confirming batch"
          - "calculations.shortfall_allocation grants allocated_units < OrderLine.quantity"
        side_effects:
          - "sets OrderLine.allocated_units and OrderLine.shorted_units per calculations.shortfall_allocation"
          - "sets the owning Order.shortfall_flag to true"
          - "increments OrderLine.version by 1"
      - from: SHORTED
        to: CREDITED
        trigger: "system, cascade hop 3 of POST /bakery/batches/{batch_id}/confirm-yield"
        actor: system
        preconditions:
          - "OrderLine.line_status == SHORTED"
        side_effects:
          - "computes the proportional credit per calculations.shortfall_credit"
          - "when the Order's Payment.payment_state == CAPTURED a MoneyMovement with movement_kind REFUND and reason SHORTFALL is created and Order.payment_status moves CAPTURED -> PARTIALLY_REFUNDED"
          - "when the Order's Payment.payment_state == AUTHORIZED a MoneyMovement with movement_kind SHORTFALL_CREDIT and reason SHORTFALL is created instead, leaving Order.payment_status unchanged"
          - "increments OrderLine.version by 1"
      - from: ALLOCATED
        to: FULFILLED
        trigger: "system, on POST /bakery/orders/{order_id}/handoff-outcome with outcome HANDED_OFF"
        actor: system
        preconditions:
          - "OrderLine.line_status == ALLOCATED"
        side_effects:
          - "the Label on this line transitions ISSUED -> CONSUMED"
          - "increments OrderLine.version by 1"
      - from: CREDITED
        to: FULFILLED
        trigger: "system, on POST /bakery/orders/{order_id}/handoff-outcome with outcome HANDED_OFF"
        actor: system
        preconditions:
          - "OrderLine.line_status == CREDITED"
        side_effects:
          - "the Label on this line transitions ISSUED -> CONSUMED"
          - "increments OrderLine.version by 1"
      - from: PENDING
        to: RECALL_VOID
        trigger: "system, cascade hop 4 of POST /bakery/ingredient-lots/{ingredient_lot_id}/recall"
        actor: system
        preconditions:
          - "OrderLine.line_status == PENDING"
          - "OrderLine.batch_id points at a Batch that transitioned to SCRAPPED_RECALL at hop 3"
        side_effects:
          - "resets OrderLine.allocated_units to 0"
          - "increments OrderLine.version by 1"
        note: "PENDING is the ONLY from-state for this hop, and that follows from hop 3's own guard rather than from a separate rule: a line only becomes ALLOCATED or SHORTED at yield confirmation, which moves its Batch out of BAKED, and hop 3 scraps only batches in {PLANNED, MIXED, BAKED}. An ALLOCATED -> RECALL_VOID transition would therefore be unreachable and is deliberately absent."

  # --------------------------------------------------------------- axis 12
  - entity: Batch
    axis: batch_status
    initial_state: PLANNED
    terminal_states: [CLOSED, SCRAPPED_RECALL]
    shape: "branching (BAKED forks to YIELD_CONFIRMED or UNDER_YIELD with divergent side-effect sets) plus a recall branch from three states"
    transitions:
      - from: PLANNED
        to: MIXED
        trigger: "POST /bakery/batches/{batch_id}/advance with to_status MIXED"
        actor: Baker
        preconditions:
          - "Batch.batch_status == PLANNED"
          - "OfferWindow.window_status == IN_PRODUCTION"
          - "no RecipeComponent in the batch's recipe tree has recalled_component == true"
        side_effects:
          - "increments Batch.version by 1"
      - from: MIXED
        to: BAKED
        trigger: "POST /bakery/batches/{batch_id}/advance with to_status BAKED"
        actor: Baker
        preconditions:
          - "Batch.batch_status == MIXED"
        side_effects:
          - "every IngredientLot referenced by the batch's recipe tree with lot_status == RELEASED transitions to CONSUMED"
          - "increments Batch.version by 1"
      - from: BAKED
        to: YIELD_CONFIRMED
        trigger: "POST /bakery/batches/{batch_id}/confirm-yield with actual_yield_units >= the batch's ordered demand"
        actor: Baker
        preconditions:
          - "Batch.batch_status == BAKED"
          - "actual_yield_units >= the sum of OrderLine.quantity over PENDING lines pointing at this batch"
        side_effects:
          - "every PENDING line pointing at this batch transitions to ALLOCATED with allocated_units == quantity"
          - "sets Batch.surplus_units to actual_yield_units minus the sum of allocated units"
          - "increments Batch.version by 1"
      - from: BAKED
        to: UNDER_YIELD
        trigger: "POST /bakery/batches/{batch_id}/confirm-yield with actual_yield_units < the batch's ordered demand"
        actor: Baker
        preconditions:
          - "Batch.batch_status == BAKED"
          - "actual_yield_units < the sum of OrderLine.quantity over PENDING lines pointing at this batch"
        side_effects:
          - "cascade hop 2: runs calculations.shortfall_allocation, transitioning lines to ALLOCATED or SHORTED"
          - "cascade hop 3: every SHORTED line transitions to CREDITED, issuing a proportional refund or credit per calculations.shortfall_credit"
          - "cascade hop 4: the owning Order.payment_status moves CAPTURED -> PARTIALLY_REFUNDED and Baker.annual_gross_sales_cents plus Baker.payout_net_cents are recomputed"
          - "sets Batch.surplus_units to 0"
          - "increments Batch.version by 1"
        note: "Depth-4 cascade originating from a different trigger than the recall cascade."
      - from: YIELD_CONFIRMED
        to: ALLOCATED
        trigger: "system, at the end of POST /bakery/batches/{batch_id}/confirm-yield"
        actor: system
        preconditions:
          - "Batch.batch_status == YIELD_CONFIRMED"
          - "the yield conservation invariant holds"
        side_effects:
          - "increments Batch.version by 1"
      - from: UNDER_YIELD
        to: ALLOCATED
        trigger: "system, at the end of POST /bakery/batches/{batch_id}/confirm-yield"
        actor: system
        preconditions:
          - "Batch.batch_status == UNDER_YIELD"
          - "the yield conservation invariant holds"
        side_effects:
          - "increments Batch.version by 1"
      - from: ALLOCATED
        to: CLOSED
        trigger: "system, on POST /bakery/offer-windows/{offer_window_id}/advance with to_status HANDOFF_OPEN"
        actor: system
        preconditions:
          - "Batch.batch_status == ALLOCATED"
        side_effects:
          - "increments Batch.version by 1"
      - from: PLANNED
        to: SCRAPPED_RECALL
        trigger: "system, cascade hop 3 of POST /bakery/ingredient-lots/{ingredient_lot_id}/recall"
        actor: system
        preconditions:
          - "Batch.batch_status == PLANNED"
          - "the Batch's recipe transitioned to REVISING at hop 2"
        side_effects:
          - "cascade hop 4: every OrderLine pointing at this batch transitions to RECALL_VOID"
          - "increments Batch.version by 1"
      - from: MIXED
        to: SCRAPPED_RECALL
        trigger: "system, cascade hop 3 of POST /bakery/ingredient-lots/{ingredient_lot_id}/recall"
        actor: system
        preconditions:
          - "Batch.batch_status == MIXED"
          - "the Batch's recipe transitioned to REVISING at hop 2"
        side_effects:
          - "cascade hop 4: every OrderLine pointing at this batch transitions to RECALL_VOID"
          - "increments Batch.version by 1"
      - from: BAKED
        to: SCRAPPED_RECALL
        trigger: "system, cascade hop 3 of POST /bakery/ingredient-lots/{ingredient_lot_id}/recall"
        actor: system
        preconditions:
          - "Batch.batch_status == BAKED"
          - "the Batch's recipe transitioned to REVISING at hop 2"
        side_effects:
          - "cascade hop 4: every OrderLine pointing at this batch transitions to RECALL_VOID"
          - "increments Batch.version by 1"
        note: "Batches already in {YIELD_CONFIRMED, ALLOCATED, CLOSED} are NOT scrapped: hop 3 does not fire for them, so the cascade stops there."

  # --------------------------------------------------------------- axis 13
  - entity: Label
    axis: label_status
    initial_state: ISSUED
    terminal_states: [VOID, CONSUMED]
    shape: "branching (ISSUED forks to SUPERSEDED, VOID or CONSUMED with divergent side-effect sets)"
    transitions:
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system, cascade hop 1 of POST /bakery/recipes/{recipe_id}/publish on a REVISING recipe"
        actor: system
        preconditions:
          - "Label.label_status == ISSUED"
          - "Label.recipe_id is the republished recipe"
          - "Label.recipe_version_pinned < Recipe.published_version after the publish"
        side_effects:
          - "the owning Order loses the handoff write gate until a fresh Label is issued"
          - "increments Label.version by 1"
      - from: SUPERSEDED
        to: VOID
        trigger: "system, cascade hop 6 of POST /bakery/ingredient-lots/{ingredient_lot_id}/recall"
        actor: system
        preconditions:
          - "Label.label_status == SUPERSEDED"
          - "the owning Order transitioned to VOIDED_RECALL at hop 5"
        side_effects:
          - "increments Label.version by 1"
      - from: ISSUED
        to: VOID
        trigger: "system, cascade hop 6 of POST /bakery/ingredient-lots/{ingredient_lot_id}/recall"
        actor: system
        preconditions:
          - "Label.label_status == ISSUED"
          - "the owning Order transitioned to VOIDED_RECALL at hop 5"
        side_effects:
          - "increments Label.version by 1"
        note: "Does NOT fire when the owning Order is FULFILLED, because hop 5 skips those orders."
      - from: ISSUED
        to: CONSUMED
        trigger: "system, on POST /bakery/orders/{order_id}/handoff-outcome with outcome HANDED_OFF"
        actor: system
        preconditions:
          - "Label.label_status == ISSUED"
          - "the owning OrderLine transitions to FULFILLED in the same request"
        side_effects:
          - "increments Label.version by 1"

  # --------------------------------------------------------------- axis 14
  - entity: Subscription
    axis: sub_status
    initial_state: PENDING
    terminal_states: [CANCELLED]
    shape: "cyclic (ACTIVE -> PAUSED -> ACTIVE and ACTIVE -> PAST_DUE -> ACTIVE)"
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /bakery/subscriptions/{subscription_id}/status with to_status ACTIVE"
        actor: Customer
        preconditions:
          - "Subscription.sub_status == PENDING"
          - "the club MenuItem.listing_status == LISTED"
        side_effects:
          - "for billing_mode PREPAID, creates a MoneyMovement with movement_kind PREPAY_DEPOSIT, reason SUBSCRIPTION_PREPAY and ledger_scope SUBSCRIPTION_PREPAID whose amount_cents is PREPAID_DEPOSIT_CYCLES * cycle price, and sets Subscription.prepaid_balance_cents per calculations.subscription_prepaid_balance; Customer.credit_balance_cents is NOT affected"
          - "increments Subscription.version by 1"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /bakery/subscriptions/{subscription_id}/status with to_status PAUSED"
        actor: Customer
        preconditions:
          - "Subscription.sub_status == ACTIVE"
          - "Subscription.pause_count < SUBSCRIPTION_PAUSE_CAP_COUNT"
        side_effects:
          - "increments Subscription.pause_count by 1"
          - "every SubscriptionCycle of this subscription with cycle_status == RESERVED transitions to RELEASED, dropping OfferWindow.reserved_units"
          - "increments Subscription.version by 1"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /bakery/subscriptions/{subscription_id}/status with to_status ACTIVE"
        actor: Customer
        preconditions:
          - "Subscription.sub_status == PAUSED"
        side_effects:
          - "increments Subscription.version by 1"
        note: "Resume loop; released cycles are not restored."
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /bakery/subscriptions/{subscription_id}/status with to_status PAST_DUE"
        actor: Baker
        preconditions:
          - "Subscription.sub_status == ACTIVE"
          - "Subscription.billing_mode == PAY_PER_CYCLE"
          - "at least one SubscriptionCycle of this subscription has cycle_status == ORDER_PLACED whose generated Order.payment_status == UNPAID"
        side_effects:
          - "sets Subscription.past_due_since to logical now"
          - "increments Subscription.version by 1"
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /bakery/subscriptions/{subscription_id}/status with to_status ACTIVE"
        actor: Baker
        preconditions:
          - "Subscription.sub_status == PAST_DUE"
          - "no SubscriptionCycle of this subscription has cycle_status == ORDER_PLACED whose generated Order.payment_status == UNPAID"
        side_effects:
          - "clears Subscription.past_due_since to null"
          - "increments Subscription.version by 1"
        note: "Re-entry loop after the arrears clear."
      - from: PAST_DUE
        to: CANCELLED
        trigger: "POST /bakery/subscriptions/{subscription_id}/status with to_status CANCELLED"
        actor: Baker
        preconditions:
          - "Subscription.sub_status == PAST_DUE"
          - "logical now >= Subscription.past_due_since plus PAST_DUE_GRACE_HOURS"
        side_effects:
          - "every SubscriptionCycle with cycle_status in {GENERATED, RESERVED} transitions to RELEASED"
          - "increments Subscription.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /bakery/subscriptions/{subscription_id}/status with to_status CANCELLED"
        actor: Customer
        preconditions:
          - "Subscription.sub_status == ACTIVE"
        side_effects:
          - "every SubscriptionCycle with cycle_status in {GENERATED, RESERVED} transitions to RELEASED"
          - "for billing_mode PREPAID, the remaining prepaid_balance_cents is zeroed by a negative SUBSCRIPTION_PREPAID CREDIT_REDEEM movement and mirrored by an equal positive CUSTOMER_CREDIT PREPAY_DEPOSIT movement with reason CUSTOMER_CANCEL"
          - "increments Subscription.version by 1"
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /bakery/subscriptions/{subscription_id}/status with to_status CANCELLED"
        actor: Customer
        preconditions:
          - "Subscription.sub_status == PAUSED"
        side_effects:
          - "increments Subscription.version by 1"

  # --------------------------------------------------------------- axis 15
  - entity: SubscriptionCycle
    axis: cycle_status
    initial_state: GENERATED
    terminal_states: [SKIPPED, RELEASED, ORDER_PLACED]
    shape: "branching (RESERVED forks to CONFIRMED, SKIPPED or RELEASED with divergent side-effect sets)"
    transitions:
      - from: GENERATED
        to: RESERVED
        trigger: "system, at the end of POST /bakery/subscriptions/{subscription_id}/cycles"
        actor: system
        preconditions:
          - "SubscriptionCycle.cycle_status == GENERATED"
          - "OfferWindow.window_status == OPEN"
          - "calculations.subscription_reserved_units grants the full Subscription.units_per_cycle"
        side_effects:
          - "sets SubscriptionCycle.reserved_units and SubscriptionCycle.skip_deadline_at and SubscriptionCycle.cycle_price_cents"
          - "adds reserved_units to OfferWindow.reserved_units and recomputes OfferWindow.capacity_posture"
          - "increments SubscriptionCycle.version by 1"
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /bakery/subscription-cycles/{subscription_cycle_id}/confirm"
        actor: Customer
        preconditions:
          - "SubscriptionCycle.cycle_status == RESERVED"
          - "Subscription.sub_status == ACTIVE"
          - "OfferWindow.window_status == OPEN"
          - "logical now < OfferWindow.order_cutoff_at"
        side_effects:
          - "increments Subscription.version by 1"
          - "increments SubscriptionCycle.version by 1"
      - from: RESERVED
        to: SKIPPED
        trigger: "POST /bakery/subscription-cycles/{subscription_cycle_id}/skip"
        actor: Customer
        preconditions:
          - "SubscriptionCycle.cycle_status == RESERVED"
          - "logical now < SubscriptionCycle.skip_deadline_at"
        side_effects:
          - "releases SubscriptionCycle.reserved_units back to the window and recomputes OfferWindow.capacity_posture"
          - "for billing_mode PREPAID, no charge is made and prepaid_balance_cents is unchanged"
          - "increments SubscriptionCycle.version by 1"
      - from: RESERVED
        to: RELEASED
        trigger: "system, on the OPEN -> LOCKED window transition, on a subscription pause, or on a subscription cancel"
        actor: system
        preconditions:
          - "SubscriptionCycle.cycle_status == RESERVED"
        side_effects:
          - "sets SubscriptionCycle.reserved_units to 0 and subtracts them from OfferWindow.reserved_units"
          - "recomputes OfferWindow.capacity_posture"
          - "increments SubscriptionCycle.version by 1"
        note: "Unconfirmed reservations are released at cutoff, freeing capacity that walk-up orders can no longer use because the window is LOCKED."
      - from: GENERATED
        to: RELEASED
        trigger: "system, on a subscription cancel from PAST_DUE or ACTIVE"
        actor: system
        preconditions:
          - "SubscriptionCycle.cycle_status == GENERATED"
        side_effects:
          - "increments SubscriptionCycle.version by 1"
      - from: CONFIRMED
        to: ORDER_PLACED
        trigger: "system, at the end of POST /bakery/subscription-cycles/{subscription_cycle_id}/confirm"
        actor: system
        preconditions:
          - "SubscriptionCycle.cycle_status == CONFIRMED"
        side_effects:
          - "creates an Order with source SUBSCRIPTION_CLUB, prepaid set from Subscription.billing_mode == PREPAID, handoff_mode from Subscription.handoff_mode, order_status CONFIRMED and one OrderLine of Subscription.units_per_cycle units in PENDING"
          - "moves reserved_units into OfferWindow.confirmed_units"
          - "for billing_mode PREPAID, debits Subscription.prepaid_balance_cents by SubscriptionCycle.cycle_price_cents through a negative MoneyMovement with movement_kind CREDIT_REDEEM, reason ORDER_APPLY and ledger_scope SUBSCRIPTION_PREPAID, sets the generated Order.credit_applied_cents to cycle_price_cents, and creates no Payment; the generated Order stays payment_status UNPAID"
          - "recomputes Baker.annual_gross_sales_cents"
          - "increments SubscriptionCycle.version by 1"

  # --------------------------------------------------------------- axis 16
  - entity: Payment
    axis: payment_state
    initial_state: INITIATED
    terminal_states: [SETTLED, DECLINED, VOIDED]
    shape: "linear pipeline INITIATED -> AUTHORIZED -> CAPTURED -> SETTLED with two terminal exits"
    transitions:
      - from: INITIATED
        to: AUTHORIZED
        trigger: "POST /bakery/payments with outcome SUCCEEDED"
        actor: Customer
        preconditions:
          - "Payment.payment_state == INITIATED"
          - "Order.payment_status == UNPAID"
        side_effects:
          - "sets Payment.authorized_cents to Order.grand_total_cents"
          - "increments Payment.version by 1"
      - from: INITIATED
        to: DECLINED
        trigger: "POST /bakery/payments with outcome DECLINED"
        actor: Customer
        preconditions:
          - "Payment.payment_state == INITIATED"
        side_effects:
          - "leaves Order.payment_status at UNPAID so a further POST /bakery/payments may be attempted"
          - "increments Payment.version by 1"
      - from: AUTHORIZED
        to: CAPTURED
        trigger: "POST /bakery/payments/{payment_id}/capture"
        actor: Baker
        preconditions:
          - "Payment.payment_state == AUTHORIZED"
          - "Order.order_status in {CONFIRMED, IN_PRODUCTION, READY}"
        side_effects:
          - "sets Payment.captured_cents to Payment.authorized_cents"
          - "Order.payment_status transitions AUTHORIZED -> CAPTURED"
          - "increments Payment.version by 1"
      - from: CAPTURED
        to: SETTLED
        trigger: "system, on POST /bakery/orders/{order_id}/handoff-outcome with outcome HANDED_OFF"
        actor: system
        preconditions:
          - "Payment.payment_state == CAPTURED"
        side_effects:
          - "recomputes Baker.payout_net_cents per calculations.payout_period_net"
          - "increments Payment.version by 1"
      - from: AUTHORIZED
        to: VOIDED
        trigger: "system, on POST /bakery/orders/{order_id}/cancel"
        actor: system
        preconditions:
          - "Payment.payment_state == AUTHORIZED"
        side_effects:
          - "increments Payment.version by 1"

  # --------------------------------------------------------------- axis 17
  - entity: DeliveryRoute
    axis: route_status
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    shape: "cyclic (SEQUENCED -> DRAFT on resequence)"
    transitions:
      - from: DRAFT
        to: SEQUENCED
        trigger: "POST /bakery/delivery-routes/{delivery_route_id}/status with to_status SEQUENCED"
        actor: Baker
        preconditions:
          - "DeliveryRoute.route_status == DRAFT"
          - "at least one Order has delivery_route_id equal to this route"
        side_effects:
          - "assigns Order.stop_sequence to every assigned order per calculations.route_stop_sequence"
          - "sets DeliveryRoute.stop_count and DeliveryRoute.total_distance_km"
          - "increments DeliveryRoute.version by 1"
      - from: SEQUENCED
        to: DRAFT
        trigger: "POST /bakery/delivery-routes/{delivery_route_id}/status with to_status DRAFT"
        actor: Baker
        preconditions:
          - "DeliveryRoute.route_status == SEQUENCED"
        side_effects:
          - "clears Order.stop_sequence to null on every assigned order and resets stop_count to 0"
          - "increments DeliveryRoute.version by 1"
        note: "Resequence loop; a newly assigned order can then be inserted in distance order."
      - from: SEQUENCED
        to: DISPATCHED
        trigger: "POST /bakery/delivery-routes/{delivery_route_id}/status with to_status DISPATCHED"
        actor: Baker
        preconditions:
          - "DeliveryRoute.route_status == SEQUENCED"
          - "OfferWindow.window_status == HANDOFF_OPEN"
        side_effects:
          - "sets DeliveryRoute.dispatched_at to logical now"
          - "every assigned Order with handoff_status == SCHEDULED and order_status == READY transitions to OUT_FOR_DELIVERY"
          - "increments DeliveryRoute.version by 1"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /bakery/delivery-routes/{delivery_route_id}/status with to_status COMPLETED"
        actor: Baker
        preconditions:
          - "DeliveryRoute.route_status == DISPATCHED"
          - "no assigned Order has handoff_status == OUT_FOR_DELIVERY"
        side_effects:
          - "increments DeliveryRoute.version by 1"

  # --------------------------------------------------------------- axis 18
  - entity: Review
    axis: review_status
    initial_state: SUBMITTED
    terminal_states: []
    shape: "cyclic (HIDDEN -> SUBMITTED on unhide)"
    transitions:
      - from: SUBMITTED
        to: RESPONDED
        trigger: "POST /bakery/reviews/{review_id}/respond"
        actor: Baker
        preconditions:
          - "Review.review_status == SUBMITTED"
          - "logical now < Review.created_at plus BAKER_RESPONSE_WINDOW_DAYS"
        side_effects:
          - "sets Review.baker_response and Review.responded_at"
          - "recomputes MenuItem.rating_avg and MenuItem.rating_count per calculations.menu_item_rating_rollup"
          - "increments Review.version by 1"
      - from: SUBMITTED
        to: HIDDEN
        trigger: "POST /bakery/reviews/{review_id}/moderation with to_status HIDDEN"
        actor: PlatformAdmin
        preconditions:
          - "Review.review_status == SUBMITTED"
        side_effects:
          - "sets Review.counts_toward_rollup to false"
          - "recomputes MenuItem.rating_avg and MenuItem.rating_count, which may drop the rollup back to null when the visible count falls below RATING_ROLLUP_MIN_REVIEWS"
          - "increments Review.version by 1"
      - from: RESPONDED
        to: HIDDEN
        trigger: "POST /bakery/reviews/{review_id}/moderation with to_status HIDDEN"
        actor: PlatformAdmin
        preconditions:
          - "Review.review_status == RESPONDED"
        side_effects:
          - "sets Review.counts_toward_rollup to false"
          - "recomputes MenuItem.rating_avg and MenuItem.rating_count"
          - "increments Review.version by 1"
      - from: HIDDEN
        to: SUBMITTED
        trigger: "POST /bakery/reviews/{review_id}/moderation with to_status SUBMITTED"
        actor: PlatformAdmin
        preconditions:
          - "Review.review_status == HIDDEN"
        side_effects:
          - "sets Review.counts_toward_rollup to true"
          - "recomputes MenuItem.rating_avg and MenuItem.rating_count"
          - "increments Review.version by 1"
        note: "Unhide loop; the baker_response, if any, is preserved but review_status returns to SUBMITTED."

concurrency_rules:
  - rule_id: line-add-stale-offer-window
    parent_entity: OfferWindow
    write_endpoint: "POST /bakery/orders/{order_id}/lines"
    occ_field: "expected_offer_window_version"
    description: |
      Adding an OrderLine against an OfferWindow whose version has advanced
      since the client last observed it is rejected. Adding a line legitimately
      consumes window capacity, so a second writer whose view of the window
      predates another line addition, a hold release, or a subscription
      reservation is working from a stale capacity picture and must re-read.
    error_id: ERR_STALE_OFFER_WINDOW_VERSION
    http_status: 412

  - rule_id: line-quantity-patch-stale-offer-window
    parent_entity: OfferWindow
    write_endpoint: "PATCH /bakery/orders/{order_id}/lines/{order_line_id}"
    occ_field: "expected_offer_window_version"
    description: |
      Changing an existing line's quantity against a stale OfferWindow version
      is rejected. A quantity change is a legitimate re-pricing and re-capacity
      operation whose admissibility depends on the window's current remaining
      units, batch slots and oven hours, so it must carry the version the
      client priced against.
    error_id: ERR_STALE_OFFER_WINDOW_VERSION
    http_status: 412

  - rule_id: label-issue-stale-recipe
    parent_entity: Recipe
    write_endpoint: "POST /bakery/labels"
    occ_field: "expected_recipe_version"
    description: |
      Issuing a Label against a Recipe whose version has advanced since the
      client last observed it is rejected. A republish legitimately supersedes
      every previously issued label, so a label minted from a stale recipe view
      would carry an allergen statement that no longer matches the published
      recipe.
    error_id: ERR_STALE_RECIPE_VERSION
    http_status: 412

  - rule_id: refund-create-stale-order
    parent_entity: Order
    write_endpoint: "POST /bakery/payments/{payment_id}/refunds"
    occ_field: "expected_order_version"
    description: |
      Creating a Refund movement against an Order whose version has advanced
      since the client last observed it is rejected. A shortfall allocation or
      an earlier partial refund legitimately advances the refundable remainder
      and the waterfall's leg positions, so a refund computed from a stale
      order view would draw from legs that are already consumed.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

  - rule_id: cycle-confirm-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /bakery/subscription-cycles/{subscription_cycle_id}/confirm"
    occ_field: "expected_subscription_version"
    description: |
      Confirming a SubscriptionCycle against a Subscription whose version has
      advanced since the client last observed it is rejected. Confirming a
      cycle legitimately debits prepaid balance and may follow a pause, a
      resume, or another cycle confirmation, all of which change the balance the
      confirmation prices against.
    error_id: ERR_STALE_SUBSCRIPTION_VERSION
    http_status: 412

conservation_invariants:
  - invariant_id: yield_conservation
    conserved_quantity: "physical units produced by a Batch"
    formula: |
      SUM(OrderLine.allocated_units WHERE OrderLine.batch_id == Batch.id
          AND OrderLine.line_status IN {ALLOCATED, SHORTED, CREDITED, FULFILLED})
        + Batch.surplus_units
        == Batch.actual_yield_units
    holds_after: "POST /bakery/batches/{batch_id}/confirm-yield, for both the YIELD_CONFIRMED and the UNDER_YIELD fork"
    error_on_violation: ERR_VALIDATION

  - invariant_id: window_unit_conservation
    conserved_quantity: "orderable units in an OfferWindow"
    formula: |
      OfferWindow.capacity_units
        == units_remaining + OfferWindow.confirmed_units
           + OfferWindow.held_units + OfferWindow.reserved_units
      where units_remaining is calculations.window_units_remaining
    holds_after: "every capacity-affecting write: line add, line quantity patch, confirm, cancel, hold expiry, cycle reserve, cycle release, window lock"

  - invariant_id: order_money_conservation
    conserved_quantity: "cents attached to one Order"
    formula: |
      For every Order that HAS a Payment (club orders settled from a prepaid
      balance have none and are covered by credit_ledger_conservation instead):
      Payment.captured_cents - Payment.refunded_cents
        == Order.grand_total_cents - SUM(MoneyMovement.amount_cents
             WHERE MoneyMovement.order_id == Order.id
               AND MoneyMovement.movement_kind == 'REFUND')
      AND for every REFUND movement:
        MoneyMovement.amount_cents
          == leg_tip_cents + leg_delivery_fee_cents
             + leg_subtotal_cents + leg_credit_cents
    holds_after: "POST /bakery/payments, POST /bakery/payments/{payment_id}/capture, POST /bakery/payments/{payment_id}/refunds, and every cascade that issues a refund"

  - invariant_id: credit_ledger_conservation
    conserved_quantity: "customer credit cents"
    formula: |
      Customer.credit_balance_cents
        == SUM(MoneyMovement.amount_cents
               WHERE MoneyMovement.customer_id == Customer.id
                 AND MoneyMovement.ledger_scope == 'CUSTOMER_CREDIT'
                 AND MoneyMovement.movement_kind IN {SHORTFALL_CREDIT, PREPAY_DEPOSIT, CREDIT_REDEEM}
                 AND (MoneyMovement.expires_at IS NULL OR logical now < MoneyMovement.expires_at))
      AND Subscription.prepaid_balance_cents
        == SUM(MoneyMovement.amount_cents
               WHERE MoneyMovement.subscription_id == Subscription.id
                 AND MoneyMovement.ledger_scope == 'SUBSCRIPTION_PREPAID')
    holds_after: "every write that grants, restores or redeems credit"

  - invariant_id: gross_sales_conservation
    conserved_quantity: "counted cottage-food gross sales for a Baker's cap_year"
    formula: |
      Baker.annual_gross_sales_cents
        == SUM(Order.subtotal_cents + Order.tax_total_cents + Order.delivery_fee_cents
               WHERE Order.order_status IN {CONFIRMED, IN_PRODUCTION, READY, FULFILLED})
           - SUM(MoneyMovement.leg_subtotal_cents + MoneyMovement.leg_delivery_fee_cents
                 WHERE MoneyMovement.movement_kind == 'REFUND')
      Tip cents are excluded because TIP_COUNTS_TOWARD_GROSS_CAP is false.
    holds_after: "POST /bakery/orders/{order_id}/confirm, POST /bakery/orders/{order_id}/cancel, every refund, and the recall and shortfall cascades"

  - invariant_id: rating_rollup_conservation
    conserved_quantity: "reviews counted into a MenuItem's rating rollup"
    formula: |
      MenuItem.rating_count
        == COUNT(Review WHERE Review.menu_item_id == MenuItem.id
                   AND Review.counts_toward_rollup == true)
      AND MenuItem.rating_avg IS NULL exactly when MenuItem.rating_count < RATING_ROLLUP_MIN_REVIEWS
    holds_after: "POST /bakery/reviews, POST /bakery/reviews/{review_id}/respond, POST /bakery/reviews/{review_id}/moderation"

calculations:
  - name: line_pricing
    trigger: "POST /bakery/orders/{order_id}/lines, PATCH /bakery/orders/{order_id}/lines/{order_line_id}, POST /bakery/orders/{order_id}/confirm, and the SubscriptionCycle CONFIRMED -> ORDER_PLACED transition"
    algorithm: tiered_pricing
    formula: |
      pricing_basis_applied = MenuItem.pricing_basis
      if pricing_basis_applied == 'PER_UNIT':
          line_total_cents = quantity * MenuItem.unit_price_cents
      else:   # PER_DOZEN_BAKERS
          full_dozens = quantity // BAKERS_DOZEN_UNITS
          remainder   = quantity %  BAKERS_DOZEN_UNITS
          line_total_cents = full_dozens * MenuItem.dozen_price_cents
                             + remainder * MenuItem.unit_price_cents
    input_set: "the single OrderLine being priced; quantity between MIN_UNITS_PER_LINE and MAX_UNITS_PER_LINE inclusive"
    constants:
      BAKERS_DOZEN_UNITS: 13
      DOZEN_SIZE: 12
      MIN_UNITS_PER_LINE: 1
      MAX_UNITS_PER_LINE: 120
    precision: "integer cents, no rounding needed"
    variants:
      - name: per_unit
        when: "MenuItem.pricing_basis == 'PER_UNIT'"
        difference: "every unit is charged at unit_price_cents; the line total is strictly increasing in quantity"
      - name: per_dozen_bakers
        when: "MenuItem.pricing_basis == 'PER_DOZEN_BAKERS'"
        difference: "each full block of BAKERS_DOZEN_UNITS units is charged at dozen_price_cents, so the effective per-unit price falls when quantity crosses 12 -> 13 and a quantity REDUCTION across a block boundary RAISES the line total"
    note: "Non-monotone in quantity. With unit_price_cents 450 and dozen_price_cents 4600: quantity 12 costs 5400 while quantity 13 costs 4600, and quantity 26 costs 9200 while quantity 25 costs 10000."

  - name: line_tax
    trigger: "same triggers as calculations.line_pricing, immediately after the line total is known"
    algorithm: threshold
    formula: |
      taxable = (OrderLine.disposition != 'WHOLE_UNHEATED')
      if not taxable:
          line_tax_cents = 0
      else:
          line_tax_cents = round_half_up(line_total_cents * TAX_RATE_BPS / 10000)
    input_set: "the single OrderLine being priced"
    constants:
      TAX_RATE_BPS: 725
      ROUNDING_MODE: "round_half_up"
    precision: "integer cents, round_half_up at the line level"
    variants:
      - name: exempt_whole_unheated
        when: "OrderLine.disposition == 'WHOLE_UNHEATED'"
        difference: "an unheated whole bakery item sold as-is is exempt, so line_tax_cents is 0 regardless of line_total_cents"
      - name: taxable_disposition
        when: "OrderLine.disposition in {WITH_UTENSILS, BY_THE_SLICE, HEATED}"
        difference: "supplying utensils, slicing, or heating flips the same units to taxable at TAX_RATE_BPS"

  - name: order_tax_total
    trigger: "POST /bakery/orders/{order_id}/confirm"
    algorithm: aggregation
    formula: |
      order_tax_total_cents = SUM(OrderLine.line_tax_cents
                                  FOR lines WHERE line_status == 'PENDING')
      # PINNED ORDER: tax is rounded per line and only then summed.
      # The rejected alternative (sum the taxable line totals, then round once)
      # can differ by whole cents.
    input_set: "OrderLines of this Order with line_status == PENDING; RELEASED and RECALL_VOID lines are excluded"
    constants:
      TAX_ROUNDING_ORDER: "per_line_then_sum"
      TAX_RATE_BPS: 725
    precision: "integer cents; per-line round_half_up, then integer summation"
    note: "Two taxable lines of 4600 and 5400 cents give 334 + 392 = 726 under the pinned order, but round_half_up(10000 * 0.0725) = 725 under the rejected order."

  - name: order_subtotal
    trigger: "POST /bakery/orders/{order_id}/confirm and every recompute triggered by a line change"
    algorithm: aggregation
    formula: |
      subtotal_cents = SUM(OrderLine.line_total_cents
                           FOR lines WHERE line_status NOT IN {'RELEASED', 'RECALL_VOID'})
    input_set: "OrderLines of this Order excluding RELEASED and RECALL_VOID lines; no time window; ties are impossible because the result is a sum"
    constants: {}
    precision: "integer cents"

  - name: delivery_fee
    trigger: "POST /bakery/orders/{order_id}/confirm"
    algorithm: tiered_pricing
    formula: |
      if Order.handoff_mode in {'PICKUP_COUNTER', 'PORCH_SELF_SERVE'}:
          delivery_fee_cents = 0
      else:   # DELIVERY
          d = Order.delivery_distance_km        # copied from Customer.delivery_distance_km
          if   d <= DELIVERY_ZONE_TIER1_MAX_KM: delivery_fee_cents = DELIVERY_FEE_TIER1_CENTS
          elif d <= DELIVERY_ZONE_TIER2_MAX_KM: delivery_fee_cents = DELIVERY_FEE_TIER2_CENTS
          elif d <= DELIVERY_ZONE_TIER3_MAX_KM: delivery_fee_cents = DELIVERY_FEE_TIER3_CENTS
          else: reject with ERR_OUT_OF_PERMITTED_ZONE
    input_set: "the single Order being confirmed"
    constants:
      DELIVERY_ZONE_TIER1_MAX_KM: 8.0
      DELIVERY_ZONE_TIER2_MAX_KM: 20.0
      DELIVERY_ZONE_TIER3_MAX_KM: 40.0
      DELIVERY_FEE_TIER1_CENTS: 500
      DELIVERY_FEE_TIER2_CENTS: 900
      DELIVERY_FEE_TIER3_CENTS: 1400
    precision: "integer cents"
    variants:
      - name: pickup_no_fee
        when: "Order.handoff_mode in {PICKUP_COUNTER, PORCH_SELF_SERVE}"
        difference: "no fee and no distance check at all; the zone rule does not apply to pickup orders"
      - name: delivery_zone_tier
        when: "Order.handoff_mode == 'DELIVERY'"
        difference: "the fee is selected by the distance tier and a distance beyond DELIVERY_ZONE_TIER3_MAX_KM is rejected outright"
    note: "Tier upper bounds are INCLUSIVE: exactly 8.0 km is tier 1 at 500 cents, and 8.01 km is tier 2 at 900 cents."

  - name: tip_amount
    trigger: "POST /bakery/payments"
    algorithm: threshold
    formula: |
      tip_base_cents = Order.subtotal_cents      # excludes tax, delivery fee and credit
      if Payment.tip_mode == 'PERCENT':
          tip_cents = round_half_up(tip_base_cents * Payment.tip_pct)
      else:   # FIXED
          tip_cents = Payment.tip_fixed_cents
    input_set: "the single Payment being created and its Order's confirmed subtotal"
    constants:
      TIP_PCT_MAX: 0.30
      TIP_FIXED_MAX_CENTS: 5000
      ROUNDING_MODE: "round_half_up"
    precision: "integer cents, round_half_up"
    variants:
      - name: percent_tip
        when: "Payment.tip_mode == 'PERCENT'"
        difference: "tip is a fraction of subtotal_cents only, rounded once at the end; tip_pct above TIP_PCT_MAX is rejected"
      - name: fixed_tip
        when: "Payment.tip_mode == 'FIXED'"
        difference: "tip is the literal tip_fixed_cents with no rounding; tip_fixed_cents above TIP_FIXED_MAX_CENTS is rejected"
    note: "Rounding order matters: tipping on subtotal and rounding once is pinned, and tipping on (subtotal + tax + fee) is the rejected reading."

  - name: order_credit_applied
    trigger: "POST /bakery/payments, evaluated after calculations.tip_amount"
    algorithm: waterfall_allocation
    formula: |
      credit_eligible_cents = Order.subtotal_cents + Order.tax_total_cents
                              + Order.delivery_fee_cents
      credit_applied_cents  = min(Customer.credit_balance_cents, credit_eligible_cents)
      # Credit NEVER offsets the tip, even when the customer's balance exceeds
      # the whole grand total.
    input_set: "the acting Customer's unexpired credit per calculations.credit_balance and the Order's confirmed money fields"
    constants: {}
    precision: "integer cents"

  - name: order_grand_total
    trigger: "POST /bakery/payments"
    algorithm: constraint_propagation
    formula: |
      # PINNED EVALUATION ORDER. Step 5 depends on a total that excludes the tip
      # computed at step 4, while step 6 includes it, so the order is not
      # interchangeable.
      step 1: for each PENDING line, line_total_cents then line_tax_cents
      step 2: subtotal_cents = calculations.order_subtotal
              tax_total_cents = calculations.order_tax_total
      step 3: delivery_fee_cents = calculations.delivery_fee
      step 4: tip_cents = calculations.tip_amount            (base = subtotal only)
      step 5: credit_applied_cents = calculations.order_credit_applied
                                     (cap excludes tip_cents)
      step 6: grand_total_cents = subtotal_cents + tax_total_cents
                                  + delivery_fee_cents + tip_cents
                                  - credit_applied_cents
    input_set: "the single Order and its PENDING lines"
    constants: {}
    precision: "integer cents"
    note: "Circular-looking: the tip depends on the subtotal, the credit cap depends on a total that excludes the tip, and the grand total depends on both. The pinned order makes the value well-defined."

  - name: window_units_remaining
    trigger: "GET /bakery/offer-windows/{offer_window_id}/capacity and every capacity-affecting write"
    algorithm: aggregation
    formula: |
      confirmed_units = SUM(OrderLine.quantity
                            FOR lines WHERE line_status NOT IN {'RELEASED','RECALL_VOID'}
                            AND owning Order.order_status IN
                              {'CONFIRMED','IN_PRODUCTION','READY','FULFILLED'})
      held_units      = SUM(OrderLine.quantity
                            FOR lines WHERE line_status == 'PENDING'
                            AND owning Order.order_status == 'PENDING_HOLD'
                            AND logical now < Order.hold_expires_at)
      reserved_units  = SUM(SubscriptionCycle.reserved_units
                            FOR cycles WHERE cycle_status IN {'RESERVED','CONFIRMED'})
      units_remaining = OfferWindow.capacity_units - confirmed_units
                        - held_units - reserved_units
    input_set: "all OrderLines and SubscriptionCycles attached to this OfferWindow, filtered by the status sets above; boundary on the hold is strict (a hold whose hold_expires_at equals now no longer counts)"
    constants:
      HOLD_TTL_MINUTES: 45
    precision: "integer units"
    note: "Non-monotone: units_remaining RISES when a hold expires, with no cancellation anywhere."

  - name: batch_slot_demand
    trigger: "POST /bakery/offer-windows/{offer_window_id}/plan with mode PLAN, and prospectively on every capacity check"
    algorithm: aggregation
    formula: |
      for each menu_item_id present on the window:
          demand_units = SUM(OrderLine.quantity FOR lines of that menu_item
                             counted by calculations.window_units_remaining)
          slot_count   = ceil(demand_units / BATCH_SLOT_UNITS)
          planned_yield_units = slot_count * MenuItem.yield_units_per_slot
      slots_used = SUM(slot_count over menu items)
      batch_slots_remaining = OfferWindow.capacity_batch_slots - slots_used
    input_set: "OrderLines grouped by menu_item_id, using exactly the counted set of calculations.window_units_remaining"
    constants:
      BATCH_SLOT_UNITS: 24
      DEFAULT_YIELD_UNITS_PER_SLOT: 24
    precision: "integer slots; ceil at the per-item level, then integer summation"
    note: "Ceiling is per menu item, not on the total: 25 units of item A and 25 of item B need 2 + 2 = 4 slots, whereas ceiling on the combined 50 units would give 3."

  - name: batch_oven_hours
    trigger: "POST /bakery/offer-windows/{offer_window_id}/plan with mode PLAN, and prospectively on every capacity check"
    algorithm: tiered_pricing
    formula: |
      if MenuItem.oven_profile == 'STANDARD':
          oven_hours = round_half_up(slot_count * OVEN_HOURS_PER_BATCH_SLOT, 2)
      else:   # LONG_BAKE
          oven_hours = round_half_up(slot_count * MenuItem.oven_hours_per_batch, 2)
      oven_hours_used = SUM(oven_hours over menu items on the window)
      oven_hours_remaining = OfferWindow.capacity_oven_hours - oven_hours_used
    input_set: "the same per-menu-item slot counts as calculations.batch_slot_demand"
    constants:
      OVEN_HOURS_PER_BATCH_SLOT: 1.5
      OVEN_HOURS_PRECISION_DECIMALS: 2
    precision: "2 decimal places, round_half_up"
    variants:
      - name: standard_profile
        when: "MenuItem.oven_profile == 'STANDARD'"
        difference: "every slot costs the fixed OVEN_HOURS_PER_BATCH_SLOT regardless of the item's own oven_hours_per_batch value"
      - name: long_bake_profile
        when: "MenuItem.oven_profile == 'LONG_BAKE'"
        difference: "the item's own oven_hours_per_batch replaces the fixed constant, so the same slot count can consume a different share of capacity_oven_hours"

  - name: capacity_posture
    trigger: "system, after every capacity-affecting write on an OfferWindow, and on GET /bakery/offer-windows/{offer_window_id}/capacity"
    algorithm: threshold
    formula: |
      units_util = (confirmed_units + held_units + reserved_units)
                   / OfferWindow.capacity_units
      slots_util = slots_used / OfferWindow.capacity_batch_slots
      oven_util  = oven_hours_used / OfferWindow.capacity_oven_hours
      if units_remaining == 0 or batch_slots_remaining == 0
         or oven_hours_remaining <= 0:
          capacity_posture = 'EXHAUSTED'
      elif max(units_util, slots_util, oven_util)
           >= CAPACITY_CONSTRAINED_UTILIZATION_PCT:
          capacity_posture = 'CONSTRAINED'
      else:
          capacity_posture = 'OPEN_CAPACITY'
    input_set: "the three capacity axes of one OfferWindow computed by calculations.window_units_remaining, calculations.batch_slot_demand and calculations.batch_oven_hours"
    constants:
      CAPACITY_CONSTRAINED_UTILIZATION_PCT: 0.80
    precision: "utilization compared as exact rational arithmetic; the CONSTRAINED comparison is >= (inclusive), the EXHAUSTED comparison on units and slots is == 0 and on oven hours is <= 0"
    note: "Three inputs interacting non-linearly through nested max and a two-level branch. An order can leave units_util at 0.20 and still push the posture to EXHAUSTED by consuming the last batch slot."

  - name: shortfall_allocation
    trigger: "POST /bakery/batches/{batch_id}/confirm-yield"
    algorithm: waterfall_allocation
    formula: |
      candidates = OrderLines WHERE batch_id == Batch.id
                              AND line_status == 'PENDING'
      sort candidates ascending by the composite key:
          k1 = 0 if owning Order.source == 'SUBSCRIPTION_CLUB' else 1
          k2 = 0 if owning Order.prepaid == true else 1
          k3 = owning Order.created_at            (ASC)
          k4 = OrderLine.created_at               (ASC)
      remaining = Batch.actual_yield_units
      for line in sorted(candidates):
          grant = min(line.quantity, remaining)
          line.allocated_units = grant
          line.shorted_units   = line.quantity - grant
          remaining -= grant
      Batch.surplus_units = remaining
    input_set: "only PENDING lines pointing at this Batch; RELEASED and RECALL_VOID lines are excluded; the sort is total because k4 breaks any k1..k3 tie and created_at is unique per line"
    constants:
      SHORTFALL_PRIORITY_ORDER: "SHORTFALL_KEY_SUBSCRIPTION_CLUB,SHORTFALL_KEY_PREPAID,SHORTFALL_KEY_EARLIEST_PLACEMENT"
      SHORTFALL_TIE_BREAK: "order_created_at ASC"
    precision: "integer units"
    note: "Fills each earlier-priority line to its full quantity before the next line receives anything, so a single line can be shorted while later lines get nothing at all. Conserved by invariant yield_conservation."

  - name: shortfall_credit
    trigger: "system, on the OrderLine SHORTED -> CREDITED transition inside POST /bakery/batches/{batch_id}/confirm-yield"
    algorithm: aggregation
    formula: |
      credit_cents = round_half_up(
          (OrderLine.line_total_cents + OrderLine.line_tax_cents)
          * OrderLine.shorted_units / OrderLine.quantity
          * SHORTFALL_CREDIT_MULTIPLIER)
    input_set: "the single SHORTED OrderLine"
    constants:
      SHORTFALL_CREDIT_MULTIPLIER: 1.00
      ROUNDING_MODE: "round_half_up"
    precision: "integer cents, round_half_up"
    variants:
      - name: refund_captured_payment
        when: "the Order's Payment.payment_state == 'CAPTURED'"
        difference: "the money leaves the baker: a MoneyMovement with movement_kind REFUND, reason SHORTFALL and ledger_scope SETTLEMENT is created, its legs filled by calculations.refund_waterfall, and Order.payment_status moves CAPTURED -> PARTIALLY_REFUNDED"
      - name: credit_unpaid_or_authorized_payment
        when: "the Order's Payment.payment_state in {INITIATED, AUTHORIZED} or the Order has no Payment"
        difference: "no money leaves the baker: a MoneyMovement with movement_kind SHORTFALL_CREDIT, reason SHORTFALL and ledger_scope CUSTOMER_CREDIT is created against the customer's credit balance and Order.payment_status is unchanged"

  - name: refund_waterfall
    trigger: "POST /bakery/payments/{payment_id}/refunds, the shortfall cascade, the recall cascade, and the CONFIRMED -> CANCELLED order transition"
    algorithm: waterfall_allocation
    formula: |
      legs, in the order fixed by REFUND_WATERFALL_ORDER:
        1 REFUND_LEG_TIP:              available = Order.tip_cents            - already_refunded_tip
        2 REFUND_LEG_DELIVERY_FEE:     available = Order.delivery_fee_cents   - already_refunded_fee
        3 REFUND_LEG_TAXABLE_SUBTOTAL: available = Order.subtotal_cents + Order.tax_total_cents
                                                                  - already_refunded_subtotal
        4 REFUND_LEG_CREDIT:           available = Order.credit_applied_cents - already_refunded_credit
      remaining = requested amount_cents
      for leg in legs:
          take = min(remaining, available(leg))
          leg_amount(leg) = take
          remaining -= take
      if remaining > 0: reject with ERR_REFUND_EXCEEDS_CAPTURED
      MoneyMovement.amount_cents = requested amount_cents
      already_refunded_* are the per-leg sums over prior REFUND movements on this Order
    input_set: "the Order's money fields plus every prior MoneyMovement with movement_kind REFUND on the same Order"
    constants:
      REFUND_WATERFALL_ORDER: "REFUND_LEG_TIP,REFUND_LEG_DELIVERY_FEE,REFUND_LEG_TAXABLE_SUBTOTAL,REFUND_LEG_CREDIT"
    precision: "integer cents; no rounding, the legs are exact integers"
    note: "Leg order is load-bearing: a partial refund of 600 cents against tip 450 / fee 500 / subtotal 4600 / credit 0 draws 450 from tip and 150 from the delivery fee, leaving the taxable subtotal untouched and therefore leaving Baker.annual_gross_sales_cents reduced by only 150."

  - name: annual_gross_sales_to_date
    trigger: "POST /bakery/orders/{order_id}/confirm, POST /bakery/orders/{order_id}/cancel, every refund, the shortfall cascade, the recall cascade, and GET /bakery/bakers/{baker_id}/compliance"
    algorithm: aggregation
    formula: |
      counted_orders = Orders of this Baker WHERE order_status IN
          {'CONFIRMED','IN_PRODUCTION','READY','FULFILLED'}
          AND calendar year of Order.placed_at == Baker.cap_year
      gross = SUM(Order.subtotal_cents + Order.tax_total_cents
                  + Order.delivery_fee_cents FOR counted_orders)
      refunded_gross = SUM(MoneyMovement.leg_subtotal_cents
                           + MoneyMovement.leg_delivery_fee_cents
                           FOR REFUND movements whose order_id is a counted order)
      annual_gross_sales_cents = gross - refunded_gross
      cap_remaining_cents = Baker.annual_cap_cents - annual_gross_sales_cents
      # Tip cents are NOT counted: TIP_COUNTS_TOWARD_GROSS_CAP is false, so a
      # refund that only consumes the TIP leg leaves this figure unchanged.
    input_set: "Orders of the Baker in the four counted statuses whose placed_at falls in Baker.cap_year; DRAFT, PENDING_HOLD, EXPIRED_HOLD, CANCELLED, FORFEITED and VOIDED_RECALL orders are excluded; FORFEITED is excluded even though the customer was charged"
    constants:
      ANNUAL_GROSS_SALES_CAP_CENTS: 8500000
      TIP_COUNTS_TOWARD_GROSS_CAP: false
    precision: "integer cents"
    note: "Threshold behaviour: validations[priority=51] rejects a confirm whose projected gross would EXCEED annual_cap_cents (strictly greater), so a confirm landing exactly on the cap succeeds and latches Baker.permit_status to CAP_REACHED."

  - name: allergen_union
    trigger: "POST /bakery/recipes/{recipe_id}/publish, POST /bakery/labels, GET /bakery/recipes/{recipe_id}/allergen-profile, and line pricing"
    algorithm: topological
    formula: |
      def union(recipe, depth):
          if depth > ALLERGEN_TREE_MAX_DEPTH: reject with ERR_RECIPE_CYCLE_DETECTED
          acc = empty set
          for c in RecipeComponents WHERE recipe_id == recipe.id
                   ordered by created_at ASC:
              acc |= set(c.declared_allergens)
              if c.ingredient_lot_id is not null:
                  acc |= set(IngredientLot(c.ingredient_lot_id).allergens)
              if c.sub_recipe_id is not null:
                  acc |= union(Recipe(c.sub_recipe_id), depth + 1)
          return acc
      allergen_union = sorted(union(recipe, 1))          # ascending, deduplicated
      tree_depth     = 1 + max(depth of each sub_recipe subtree, or 0)
      A recipe reachable from itself through any sub_recipe chain is rejected
      with ERR_RECIPE_CYCLE_DETECTED.
    input_set: "every RecipeComponent in the transitive sub-recipe closure of the root recipe, plus the IngredientLot of each component that has one; ordering by created_at ASC only affects traversal, not the resulting set"
    constants:
      ALLERGEN_TREE_MAX_DEPTH: 5
    precision: "sorted list of distinct lowercase allergen strings"
    note: "Depth 3 and deeper is normal: a cookie recipe references a cookie-dough sub-recipe which references a spice-blend sub-recipe."

  - name: cross_contact_advisory
    trigger: "POST /bakery/recipes/{recipe_id}/publish, POST /bakery/labels, GET /bakery/recipes/{recipe_id}/allergen-profile"
    algorithm: projection
    formula: |
      applies = (Baker.shared_kitchen == true)
                OR EXISTS(IngredientLot in the recipe's transitive closure
                          WHERE length(cross_contact_allergens) > 0)
      cross_contact_advisory = CROSS_CONTACT_ADVISORY_TEXT if applies else null
    input_set: "Baker.shared_kitchen plus every IngredientLot reachable through the recipe's component and sub-recipe closure"
    constants:
      CROSS_CONTACT_ADVISORY_TEXT: "Made in a home kitchen that also handles wheat, egg, milk, soy, peanut and tree nuts."
    precision: "exact string or null"
    note: "Derived separately from allergen_union: an allergen appearing only in a lot's cross_contact_allergens does NOT enter allergen_union and therefore never triggers the hard block."

  - name: allergen_gate
    trigger: "POST /bakery/orders/{order_id}/confirm"
    algorithm: threshold
    formula: |
      order_allergens = union of OrderLine.allergen_union over lines with
                        line_status == 'PENDING'
      hard_matches = {a.allergen for a in Customer.allergen_avoidances
                      if a.severity == ALLERGEN_SEVERITY_HARD_BLOCK}
                     intersect order_allergens
      soft_matches = {a.allergen for a in Customer.allergen_avoidances
                      if a.severity == ALLERGEN_SEVERITY_ACK_REQUIRED}
                     intersect order_allergens
      if hard_matches is non-empty:
          reject with ERR_ALLERGEN_HARD_BLOCK      # allergen_ack cannot clear it
      elif soft_matches is non-empty and Order.allergen_ack != true:
          reject with ERR_ALLERGEN_ACK_REQUIRED
      else:
          pass
    input_set: "the acting Customer's allergen_avoidances against the union of the allergen_union of every PENDING line"
    constants:
      ALLERGEN_SEVERITY_HARD_BLOCK: "ANAPHYLACTIC"
      ALLERGEN_SEVERITY_ACK_REQUIRED: "INTOLERANCE"
    precision: "set intersection over exact strings"
    variants:
      - name: anaphylactic_hard_block
        when: "the matched avoidance has severity ANAPHYLACTIC"
        difference: "the confirm is rejected outright and no acknowledgement flag can override it"
      - name: intolerance_recorded_acknowledgement
        when: "the matched avoidance has severity INTOLERANCE"
        difference: "the confirm succeeds provided Order.allergen_ack is true, and the acknowledgement is recorded on the Order rather than blocking it"

  - name: subscription_reserved_units
    trigger: "POST /bakery/subscriptions/{subscription_id}/cycles"
    algorithm: threshold
    formula: |
      share_cap_units = floor(OfferWindow.capacity_units
                              * SUBSCRIPTION_RESERVE_UNIT_SHARE_PCT)
      already_reserved = OfferWindow.reserved_units
      requested        = Subscription.units_per_cycle
      if already_reserved + requested > share_cap_units:
          reject with ERR_SUBSCRIPTION_RESERVE_SHARE_EXCEEDED
      reserved_units = requested
    input_set: "OfferWindow.capacity_units and the sum of reserved_units over SubscriptionCycles on the window with cycle_status IN {RESERVED, CONFIRMED}"
    constants:
      SUBSCRIPTION_RESERVE_UNIT_SHARE_PCT: 0.30
    precision: "integer units; the comparison is strictly greater, so landing exactly on share_cap_units is allowed"
    note: "With capacity_units 240 the share cap is 72 units; a third weekly cycle of 24 units lands exactly on 72 and is admitted, while a fourth is rejected."

  - name: subscription_cycle_price
    trigger: "the SubscriptionCycle GENERATED -> RESERVED transition"
    algorithm: tiered_pricing
    formula: |
      base_cents = calculations.line_pricing applied to
                   (quantity = Subscription.units_per_cycle,
                    MenuItem = Subscription's club MenuItem)
      if Subscription.billing_mode == 'PREPAID':
          cycle_price_cents = round_half_up(base_cents
                              * (1 - PREPAID_CYCLE_DISCOUNT_PCT))
      else:   # PAY_PER_CYCLE
          cycle_price_cents = base_cents
    input_set: "the single Subscription and its club MenuItem"
    constants:
      PREPAID_CYCLE_DISCOUNT_PCT: 0.10
      ROUNDING_MODE: "round_half_up"
    precision: "integer cents, round_half_up"
    variants:
      - name: prepaid_discounted
        when: "Subscription.billing_mode == 'PREPAID'"
        difference: "the cycle is PREPAID_CYCLE_DISCOUNT_PCT cheaper and is debited from Subscription.prepaid_balance_cents at cycle confirmation, so the generated Order carries payment_status UNPAID with credit already applied"
      - name: pay_per_cycle_full_price
        when: "Subscription.billing_mode == 'PAY_PER_CYCLE'"
        difference: "no discount, and the generated Order must be paid through POST /bakery/payments, so a missed payment drives the Subscription into PAST_DUE"

  - name: skip_deadline
    trigger: "the SubscriptionCycle GENERATED -> RESERVED transition, and recomputed on a cutoff extension"
    algorithm: interval_merge
    formula: |
      skip_deadline_at = OfferWindow.order_cutoff_at
                         - SKIP_DEADLINE_HOURS_BEFORE_CUTOFF hours
      A skip is admitted while logical now < skip_deadline_at (STRICT).
      Extending the cutoff moves skip_deadline_at forward by the same amount,
      so a cycle whose skip deadline had passed can become skippable again.
    input_set: "the single SubscriptionCycle and its OfferWindow"
    constants:
      SKIP_DEADLINE_HOURS_BEFORE_CUTOFF: 24
      CUTOFF_EXTENSION_MINUTES: 120
    precision: "instant comparison at second granularity; strict exclusive"
    note: "This is a window-derived status that is deliberately allowed to re-open, and it is the ONLY such status in the scaffold: it is recomputed from a stored field rather than latched, and the re-opening is caused by an explicit operator action, not by the clock."

  - name: pickup_forfeit_deadline
    trigger: "the OfferWindow IN_PRODUCTION -> HANDOFF_OPEN transition"
    algorithm: interval_merge
    formula: |
      if Order.handoff_mode in {'PICKUP_COUNTER', 'PORCH_SELF_SERVE'}:
          pickup_forfeit_at = OfferWindow.handoff_window_end_at
                              + PICKUP_GRACE_MINUTES minutes
      else:
          pickup_forfeit_at = null
      grace_expired = (logical now >= pickup_forfeit_at)
      Once a FORFEITED transition fires, Order.forfeit_latched is set to true and
      is NEVER cleared, so the derived grace status cannot silently re-enter its
      pre-state even if the clock is moved backward.
    input_set: "the single Order and its OfferWindow"
    constants:
      PICKUP_GRACE_MINUTES: 90
      MISSED_REBOOK_MAX: 1
    precision: "instant comparison at second granularity; grace expiry is >= (inclusive)"
    note: "Monotone by construction: forfeit_latched is the stored latch that pairs with this derived status, and validations[priority=45] refuses a rebook once the latch is set."

  - name: menu_item_rating_rollup
    trigger: "POST /bakery/reviews, POST /bakery/reviews/{review_id}/respond, POST /bakery/reviews/{review_id}/moderation"
    algorithm: aggregation
    formula: |
      visible = Reviews WHERE menu_item_id == MenuItem.id
                        AND counts_toward_rollup == true
      rating_count = COUNT(visible)
      if rating_count < RATING_ROLLUP_MIN_REVIEWS:
          rating_avg = null
      else:
          rating_avg = round_half_up(SUM(visible.rating) / rating_count, 2)
    input_set: "every Review on the MenuItem whose counts_toward_rollup is true, i.e. review_status IN {SUBMITTED, RESPONDED}; HIDDEN reviews are excluded; no time window; the result is order-independent"
    constants:
      RATING_ROLLUP_MIN_REVIEWS: 3
      RATING_SCALE_MIN: 1
      RATING_SCALE_MAX: 5
      RATING_AVG_PRECISION_DECIMALS: 2
      RATING_ROLLUP_STORAGE: "stored_recomputed_on_review_status_change"
    precision: "2 decimal places, round_half_up"
    note: "STORED, not derived on read. It is recomputed in the same request as every review create, respond, hide and unhide, so hiding the third review drops rating_avg back to null."

  - name: route_stop_sequence
    trigger: "POST /bakery/delivery-routes/{delivery_route_id}/status with to_status SEQUENCED"
    algorithm: chronological
    formula: |
      assigned = Orders WHERE delivery_route_id == DeliveryRoute.id
                        AND handoff_status == 'SCHEDULED'
                        AND order_status IN {'CONFIRMED','IN_PRODUCTION','READY'}
      sort assigned ascending by (Order.delivery_distance_km, Order.created_at)
      stop_sequence = 1-based index in that order
      DeliveryRoute.stop_count       = COUNT(assigned)
      DeliveryRoute.total_distance_km = SUM(assigned.delivery_distance_km)
    input_set: "Orders assigned to this route in handoff_status SCHEDULED and order_status in the three live statuses; MISSED, HANDED_OFF, FORFEITED, CANCELLED and VOIDED_RECALL orders are excluded"
    constants:
      ROUTE_STOP_SORT_KEY: "delivery_distance_km ASC"
      ROUTE_STOP_TIE_BREAK: "order_created_at ASC"
    precision: "integer stop numbers; distance summed to 2 decimal places, round_half_up"
    note: "Tie-break is created_at ASC, never id."

  - name: payout_period_net
    trigger: "POST /bakery/payments/{payment_id}/capture, POST /bakery/payments/{payment_id}/refunds, the Payment CAPTURED -> SETTLED transition, and GET /bakery/bakers/{baker_id}/compliance"
    algorithm: aggregation
    formula: |
      period = [Baker.payout_period_start,
                Baker.payout_period_start + PAYOUT_PERIOD_DAYS days)
               # left-inclusive, right-exclusive
      captured = SUM(Payment.captured_cents FOR payments on this Baker's orders
                     WHERE Payment.created_at is in period
                       AND Payment.payment_state IN {'CAPTURED','SETTLED'})
      refunded = SUM(MoneyMovement.amount_cents
                     FOR movements WHERE movement_kind == 'REFUND'
                       AND MoneyMovement.created_at is in period)
      payout_net_cents = captured - refunded
    input_set: "Payments in CAPTURED or SETTLED and REFUND movements whose created_at falls in the half-open payout period"
    constants:
      PAYOUT_PERIOD_DAYS: 14
    precision: "integer cents"

  - name: subscription_prepaid_balance
    trigger: "the Subscription PENDING -> ACTIVE transition, the SubscriptionCycle CONFIRMED -> ORDER_PLACED transition, and any transition to CANCELLED"
    algorithm: aggregation
    formula: |
      # Deposit taken once, when a PREPAID subscription is activated.
      deposit_cents = PREPAID_DEPOSIT_CYCLES * SubscriptionCycle price for this
                      subscription per calculations.subscription_cycle_price
                      (window-independent: it depends only on units_per_cycle
                      and the club MenuItem)
      prepaid_balance_cents = SUM(MoneyMovement.amount_cents
          FOR movements WHERE subscription_id == Subscription.id
            AND ledger_scope == 'SUBSCRIPTION_PREPAID')
      # PREPAY_DEPOSIT is positive, CREDIT_REDEEM is negative.
      For billing_mode PAY_PER_CYCLE no deposit is taken and
      prepaid_balance_cents stays 0.
      On cancellation the remaining prepaid_balance_cents is moved out with a
      negative SUBSCRIPTION_PREPAID CREDIT_REDEEM movement and an equal positive
      CUSTOMER_CREDIT PREPAY_DEPOSIT movement whose reason is CUSTOMER_CANCEL, so
      no money is created or destroyed.
    input_set: "MoneyMovements with ledger_scope SUBSCRIPTION_PREPAID whose subscription_id is this Subscription"
    constants:
      PREPAID_DEPOSIT_CYCLES: 4
      PREPAID_CYCLE_DISCOUNT_PCT: 0.10
    precision: "integer cents"
    note: "A PREPAID club of 24 units of the 450/4600 cookie has cycle_price_cents 8595, so activation deposits 34380 and the first confirmed cycle leaves 25785."

  - name: credit_balance
    trigger: "every write that creates a MoneyMovement, and GET /bakery/customers/{customer_id}"
    algorithm: aggregation
    formula: |
      credit_balance_cents = SUM(MoneyMovement.amount_cents
          FOR movements WHERE customer_id == Customer.id
            AND ledger_scope == 'CUSTOMER_CREDIT'
            AND movement_kind IN {'SHORTFALL_CREDIT','PREPAY_DEPOSIT','CREDIT_REDEEM'}
            AND (expires_at IS NULL OR logical now < expires_at))
      SHORTFALL_CREDIT and PREPAY_DEPOSIT movements carry a POSITIVE
      amount_cents; CREDIT_REDEEM movements carry a NEGATIVE amount_cents.
      REFUND movements never enter this sum (ledger_scope SETTLEMENT): refunded
      money leaves the system rather than becoming credit. Movements with
      ledger_scope SUBSCRIPTION_PREPAID never enter this sum either - club
      prepaid money lives on the Subscription, not on the Customer.
    input_set: "MoneyMovements of this Customer with ledger_scope CUSTOMER_CREDIT in the three credit-bearing kinds whose expires_at is null or strictly in the future"
    constants:
      CREDIT_EXPIRY_DAYS: 365
    precision: "integer cents"

validation_ladder_note: |
  The ladder below is TOTAL and DETERMINISTIC: for any request that violates
  more than one rung, the lowest priority number wins and no later rung is
  evaluated. Two rungs are ordered global write gates that pre-empt many later
  rungs: priority 15 (Baker.permit_status must be ACTIVE) and priority 16 (a
  LOCKED OfferWindow blocks every order-mutating call). Both carry explicit
  applies_to carve-outs so the endpoints that must run on a suspended baker or
  a locked window remain reachable.

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the roles declared in the RBAC matrix"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "the acting role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 4
    category: business_constraint
    check: "the request body parses as a JSON object where a body is expected, and limit is between 1 and 100 with offset >= 0 on list endpoints"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all
  - priority: 5
    category: existence
    check: "an offer_window_id appearing in the path resolves to an OfferWindow"
    error_id: ERR_OFFER_WINDOW_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints whose path contains {offer_window_id}"
  - priority: 6
    category: existence
    check: "an order_id, and then an order_line_id, appearing in the path resolves, evaluated left to right"
    error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints whose path contains {order_id} or {order_line_id}"
  - priority: 7
    category: existence
    check: "every other path id resolves to its entity, evaluated left to right"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a templated path segment other than {offer_window_id}, {order_id} and {order_line_id}"
  - priority: 8
    category: existence
    check: "a body offer_window_id resolves to an OfferWindow"
    error_id: ERR_OFFER_WINDOW_NOT_FOUND
    http_status: 404
    applies_to: "POST /bakery/orders, POST /bakery/subscriptions/{subscription_id}/cycles, POST /bakery/delivery-routes"
  - priority: 9
    category: existence
    check: "a body menu_item_id resolves to a MenuItem"
    error_id: ERR_MENU_ITEM_NOT_FOUND
    http_status: 404
    applies_to: "POST /bakery/orders/{order_id}/lines, POST /bakery/subscriptions, POST /bakery/reviews"
  - priority: 10
    category: existence
    check: "every other foreign key in the body resolves to its entity, evaluated in the alphabetical order of the field names"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints accepting a foreign key in the body"
  - priority: 11
    category: auth
    check: "when the acting role is Customer, X-User-ID equals the Customer.id that owns the target Order, Subscription, SubscriptionCycle, Payment or Review"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all Customer-callable endpoints operating on an existing resource"
  - priority: 12
    category: auth
    check: "when the acting role is Baker, X-User-ID equals the Baker.id that owns the target Recipe, IngredientLot, MenuItem, OfferWindow, Batch, Label, DeliveryRoute or the Baker of the target Order"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all Baker-callable endpoints operating on an existing resource"
  - priority: 13
    category: business_constraint
    check: "every required body field is present with the declared type, integers are non-negative where the field is a quantity or an amount, and rating is between RATING_SCALE_MIN and RATING_SCALE_MAX inclusive"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST, PUT and PATCH endpoints"
  - priority: 14
    category: business_constraint
    check: "every enum-valued body field carries a member of that field's declared constraint set. This routing is exhaustive: channel, handoff_mode, disposition, pricing_basis, product_class, oven_profile, cadence, billing_mode, tip_mode, outcome, to_status, mode, movement_kind and severity all route here, and no other field routes here"
    error_id: ERR_INVALID_ENUM
    http_status: 400
    applies_to: "all POST, PUT and PATCH endpoints"
  - priority: 15
    category: business_safety
    check: "the owning Baker.permit_status == ACTIVE (a PENDING, SUSPENDED or CAP_REACHED permit blocks the call)"
    error_id: ERR_PERMIT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /bakery/menu-items, POST /bakery/menu-items/{menu_item_id}/listing-status, POST /bakery/offer-windows, POST /bakery/offer-windows/{offer_window_id}/advance, POST /bakery/orders, POST /bakery/orders/{order_id}/lines, PATCH /bakery/orders/{order_id}/lines/{order_line_id}, POST /bakery/orders/{order_id}/confirm, POST /bakery/subscriptions, POST /bakery/subscriptions/{subscription_id}/cycles, POST /bakery/subscription-cycles/{subscription_cycle_id}/confirm, POST /bakery/payments. CARVE-OUT: never applies to POST /bakery/bakers/{baker_id}/permit-status, POST /bakery/ingredient-lots/{ingredient_lot_id}/recall, POST /bakery/orders/{order_id}/cancel, POST /bakery/payments/{payment_id}/refunds, POST /bakery/reviews or the _clock and _holds endpoints, so reinstatement, recalls, cancellations, refunds and reviews stay reachable while a permit is suspended"
  - priority: 16
    category: state
    check: "the OfferWindow the call touches does not have window_status == LOCKED"
    error_id: ERR_WINDOW_LOCKED
    http_status: 409
    applies_to: "POST /bakery/orders, POST /bakery/orders/{order_id}/lines, PATCH /bakery/orders/{order_id}/lines/{order_line_id}, POST /bakery/orders/{order_id}/confirm, POST /bakery/orders/{order_id}/cancel, POST /bakery/orders/{order_id}/schedule-handoff, POST /bakery/subscriptions/{subscription_id}/cycles, POST /bakery/subscription-cycles/{subscription_cycle_id}/confirm, POST /bakery/subscription-cycles/{subscription_cycle_id}/skip. CARVE-OUT: never applies to POST /bakery/offer-windows/{offer_window_id}/lock, /extend-cutoff, /plan or /advance, nor to POST /bakery/batches/{batch_id}/advance, /confirm-yield, POST /bakery/labels, POST /bakery/orders/{order_id}/handoff-outcome or POST /bakery/delivery-routes/{delivery_route_id}/status, all of which are only legal once the window is LOCKED or later"
  - priority: 17
    category: business_temporal
    check: "logical now < OfferWindow.order_cutoff_at, strictly (an instant exactly equal to the cutoff is already past it)"
    error_id: ERR_CUTOFF_PASSED
    http_status: 409
    applies_to: "POST /bakery/orders/{order_id}/lines, PATCH /bakery/orders/{order_id}/lines/{order_line_id}, POST /bakery/orders/{order_id}/confirm, POST /bakery/subscription-cycles/{subscription_cycle_id}/confirm"
  - priority: 18
    category: state
    check: "OfferWindow.window_status == OPEN"
    error_id: ERR_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /bakery/orders, POST /bakery/orders/{order_id}/lines, PATCH /bakery/orders/{order_id}/lines/{order_line_id}, POST /bakery/orders/{order_id}/confirm, POST /bakery/subscriptions/{subscription_id}/cycles, POST /bakery/subscription-cycles/{subscription_cycle_id}/confirm"
  - priority: 19
    category: state
    check: "the target entity's current state on the relevant axis is a declared `from:` state of the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every state-transition endpoint. CARVE-OUT: does NOT apply to POST /bakery/batches/{batch_id}/confirm-yield, whose batch-state precondition is owned exclusively by priority 36 so that ERR_BATCH_NOT_BAKED is reachable"
  - priority: 20
    category: business_referential
    check: "expected_offer_window_version equals the OfferWindow's current version"
    error_id: ERR_STALE_OFFER_WINDOW_VERSION
    http_status: 412
    applies_to: "POST /bakery/orders/{order_id}/lines, PATCH /bakery/orders/{order_id}/lines/{order_line_id}"
  - priority: 21
    category: business_referential
    check: "expected_order_version equals the Order's current version"
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /bakery/payments/{payment_id}/refunds"
  - priority: 22
    category: business_referential
    check: "expected_recipe_version equals the Recipe's current version"
    error_id: ERR_STALE_RECIPE_VERSION
    http_status: 412
    applies_to: "POST /bakery/labels"
  - priority: 23
    category: business_referential
    check: "expected_subscription_version equals the Subscription's current version"
    error_id: ERR_STALE_SUBSCRIPTION_VERSION
    http_status: 412
    applies_to: "POST /bakery/subscription-cycles/{subscription_cycle_id}/confirm"
  - priority: 24
    category: business_safety
    check: "Order.channel == DTC, because WHOLESALE_PERMITTED is false for cottage-food operations"
    error_id: ERR_WHOLESALE_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /bakery/orders, POST /bakery/orders/{order_id}/confirm"
  - priority: 25
    category: business_safety
    check: "every referenced MenuItem.product_class equals DTC_ELIGIBLE_PRODUCT_CLASS, i.e. SHELF_STABLE; a REFRIGERATION_REQUIRED item may not be sold direct"
    error_id: ERR_PRODUCT_CLASS_NOT_DTC_ELIGIBLE
    http_status: 422
    applies_to: "POST /bakery/orders/{order_id}/lines, POST /bakery/subscriptions, POST /bakery/menu-items/{menu_item_id}/listing-status"
  - priority: 26
    category: business_safety
    check: "the Recipe backing every referenced MenuItem has recipe_status == PUBLISHED"
    error_id: ERR_RECIPE_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /bakery/orders/{order_id}/lines, POST /bakery/menu-items/{menu_item_id}/listing-status, POST /bakery/labels"
  - priority: 27
    category: business_safety
    check: "no RecipeComponent in the referenced recipe's transitive closure has recalled_component == true, and no referenced IngredientLot has lot_status == RECALLED"
    error_id: ERR_LOT_RECALLED
    http_status: 409
    applies_to: "POST /bakery/recipes/{recipe_id}/publish, POST /bakery/recipes/{recipe_id}/components, POST /bakery/orders/{order_id}/lines, POST /bakery/batches/{batch_id}/advance, POST /bakery/labels"
  - priority: 28
    category: business_safety
    check: "the recipe's component and sub-recipe closure is acyclic and its tree_depth is at most ALLERGEN_TREE_MAX_DEPTH"
    error_id: ERR_RECIPE_CYCLE_DETECTED
    http_status: 422
    applies_to: "POST /bakery/recipes/{recipe_id}/components, POST /bakery/recipes/{recipe_id}/publish"
  - priority: 29
    category: business_safety
    check: "no allergen in the order's allergen union matches an avoidance of severity ALLERGEN_SEVERITY_HARD_BLOCK on the acting Customer"
    error_id: ERR_ALLERGEN_HARD_BLOCK
    http_status: 422
    applies_to: "POST /bakery/orders/{order_id}/confirm"
  - priority: 30
    category: business_safety
    check: "when an allergen matches an avoidance of severity ALLERGEN_SEVERITY_ACK_REQUIRED, Order.allergen_ack is true"
    error_id: ERR_ALLERGEN_ACK_REQUIRED
    http_status: 422
    applies_to: "POST /bakery/orders/{order_id}/confirm"
  - priority: 31
    category: business_safety
    check: "when Order.handoff_mode == PORCH_SELF_SERVE, Order.unattended_consent is true"
    error_id: ERR_UNATTENDED_CONSENT_REQUIRED
    http_status: 422
    applies_to: "POST /bakery/orders/{order_id}/schedule-handoff"
  - priority: 32
    category: business_safety
    check: "when Order.handoff_mode == PORCH_SELF_SERVE and any PENDING line's MenuItem.temp_sensitive is true, Order.cooler_provided is true"
    error_id: ERR_COOLER_CONSENT_REQUIRED
    http_status: 422
    applies_to: "POST /bakery/orders/{order_id}/schedule-handoff"
  - priority: 33
    category: business_referential
    check: "when Order.handoff_mode == DELIVERY, Customer.delivery_distance_km <= Baker.permitted_radius_km"
    error_id: ERR_OUT_OF_PERMITTED_ZONE
    http_status: 422
    applies_to: "POST /bakery/orders/{order_id}/confirm, POST /bakery/orders/{order_id}/schedule-handoff"
  - priority: 34
    category: business_constraint
    check: "the order has at most MAX_LINES_PER_ORDER lines not in {RELEASED, RECALL_VOID} and the requested quantity is between MIN_UNITS_PER_LINE and MAX_UNITS_PER_LINE inclusive"
    error_id: ERR_MAX_LINES_EXCEEDED
    http_status: 422
    applies_to: "POST /bakery/orders/{order_id}/lines, PATCH /bakery/orders/{order_id}/lines/{order_line_id}"
  - priority: 35
    category: business_constraint
    check: "every OrderLine of the order not in {RELEASED, RECALL_VOID} has a Label with label_status == ISSUED"
    error_id: ERR_LABEL_SUPERSEDED
    http_status: 409
    applies_to: "POST /bakery/orders/{order_id}/handoff-outcome with outcome HANDED_OFF"
  - priority: 36
    category: state
    check: "Batch.batch_status == BAKED"
    error_id: ERR_BATCH_NOT_BAKED
    http_status: 409
    applies_to: "POST /bakery/batches/{batch_id}/confirm-yield"
  - priority: 37
    category: business_constraint
    check: "no Review already exists for this order_id"
    error_id: ERR_DUPLICATE_REVIEW
    http_status: 409
    applies_to: "POST /bakery/reviews"
  - priority: 38
    category: business_temporal
    check: "logical now < Order.hold_expires_at, strictly"
    error_id: ERR_HOLD_EXPIRED
    http_status: 409
    applies_to: "POST /bakery/orders/{order_id}/confirm, PATCH /bakery/orders/{order_id}/lines/{order_line_id}"
  - priority: 39
    category: business_temporal
    check: "when Order.handoff_mode is PICKUP_COUNTER or PORCH_SELF_SERVE, logical now < Order.pickup_forfeit_at. This rung does NOT apply to the DELIVERY pipeline"
    error_id: ERR_PICKUP_GRACE_EXPIRED
    http_status: 409
    applies_to: "POST /bakery/orders/{order_id}/handoff-outcome with outcome HANDED_OFF"
  - priority: 40
    category: business_temporal
    check: "logical now < SubscriptionCycle.skip_deadline_at, strictly"
    error_id: ERR_SKIP_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /bakery/subscription-cycles/{subscription_cycle_id}/skip"
  - priority: 41
    category: business_temporal
    check: "logical now < Order.review_window_closes_at, strictly"
    error_id: ERR_REVIEW_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /bakery/reviews"
  - priority: 42
    category: business_temporal
    check: "logical now < Review.created_at plus BAKER_RESPONSE_WINDOW_DAYS, strictly"
    error_id: ERR_RESPONSE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /bakery/reviews/{review_id}/respond"
  - priority: 43
    category: business_constraint
    check: "Subscription.pause_count < SUBSCRIPTION_PAUSE_CAP_COUNT"
    error_id: ERR_PAUSE_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /bakery/subscriptions/{subscription_id}/status with to_status PAUSED"
  - priority: 44
    category: business_temporal
    check: "the window's instants are strictly ordered: opens_at < order_cutoff_at <= production_date <= handoff_date < handoff_window_end_at"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "POST /bakery/offer-windows"
  - priority: 45
    category: business_constraint
    check: "Order.rebook_count < MISSED_REBOOK_MAX and Order.forfeit_latched == false"
    error_id: ERR_REBOOK_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /bakery/orders/{order_id}/schedule-handoff when Order.handoff_status == MISSED"
  - priority: 46
    category: business_fiscal
    check: "for tip_mode PERCENT, 0 <= tip_pct <= TIP_PCT_MAX; for tip_mode FIXED, 0 <= tip_fixed_cents <= TIP_FIXED_MAX_CENTS"
    error_id: ERR_TIP_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /bakery/payments"
  - priority: 47
    category: business_fiscal
    check: "when Order.handoff_mode == DELIVERY, Order.subtotal_cents >= DELIVERY_MINIMUM_CENTS"
    error_id: ERR_DELIVERY_MINIMUM_NOT_MET
    http_status: 422
    applies_to: "POST /bakery/orders/{order_id}/schedule-handoff"
  - priority: 48
    category: business_fiscal
    check: "the requested apply_credit_cents is at most Customer.credit_balance_cents"
    error_id: ERR_INSUFFICIENT_CREDIT
    http_status: 422
    applies_to: "POST /bakery/payments"
  - priority: 49
    category: state
    check: "Payment.payment_state == CAPTURED"
    error_id: ERR_PAYMENT_NOT_CAPTURED
    http_status: 409
    applies_to: "POST /bakery/payments/{payment_id}/refunds"
  - priority: 50
    category: business_fiscal
    check: "the requested amount_cents is at most Payment.captured_cents minus Payment.refunded_cents"
    error_id: ERR_REFUND_EXCEEDS_CAPTURED
    http_status: 422
    applies_to: "POST /bakery/payments/{payment_id}/refunds"
  - priority: 51
    category: business_fiscal
    check: "Baker.annual_gross_sales_cents plus this order's counted gross does not EXCEED Baker.annual_cap_cents; landing exactly on the cap is admitted"
    error_id: ERR_ANNUAL_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /bakery/orders/{order_id}/confirm, POST /bakery/subscription-cycles/{subscription_cycle_id}/confirm"
  - priority: 52
    category: business_fiscal
    check: "OfferWindow.reserved_units plus Subscription.units_per_cycle does not exceed floor(OfferWindow.capacity_units * SUBSCRIPTION_RESERVE_UNIT_SHARE_PCT)"
    error_id: ERR_SUBSCRIPTION_RESERVE_SHARE_EXCEEDED
    http_status: 422
    applies_to: "POST /bakery/subscriptions/{subscription_id}/cycles"
  - priority: 53
    category: business_fiscal
    check: "calculations.window_units_remaining is at least the requested unit delta"
    error_id: ERR_UNITS_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /bakery/orders/{order_id}/lines, PATCH /bakery/orders/{order_id}/lines/{order_line_id}, POST /bakery/subscriptions/{subscription_id}/cycles"
  - priority: 54
    category: business_fiscal
    check: "batch_slots_remaining per calculations.batch_slot_demand is at least the additional slots the request requires"
    error_id: ERR_BATCH_SLOT_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /bakery/orders/{order_id}/lines, PATCH /bakery/orders/{order_id}/lines/{order_line_id}"
  - priority: 55
    category: business_fiscal
    check: "oven_hours_remaining per calculations.batch_oven_hours is at least the additional oven hours the request requires"
    error_id: ERR_OVEN_HOURS_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /bakery/orders/{order_id}/lines, PATCH /bakery/orders/{order_id}/lines/{order_line_id}"

endpoints:
  # ---------------- Baker ------------------------------------------------
  - method: POST
    path: "/bakery/bakers"
    description: "Register a cottage-food operator."
    roles: [PlatformAdmin]
    code: 201
    input: [display_name, jurisdiction_code, payout_period_start, "shared_kitchen?", "annual_cap_cents?", "cap_year?", "permitted_radius_km?"]
    output: Baker
    side_effects: ["creates the Baker in permit_status PENDING with annual_gross_sales_cents 0"]
  - method: POST
    path: "/bakery/bakers/{baker_id}/permit-status"
    description: "Move the operator's permit posture; also performs the annual cap reset when cap_year is advanced."
    roles: [PlatformAdmin]
    code: 200
    input: [to_status, "cap_year?"]
    output: Baker
    side_effects:
      - "drives the Baker.permit_status axis"
      - "on CAP_REACHED -> ACTIVE with an advanced cap_year, resets Baker.annual_gross_sales_cents to 0"
      - "increments Baker.version by 1"
  - method: GET
    path: "/bakery/bakers/{baker_id}"
    description: "Read one operator."
    roles: [PlatformAdmin, Baker, HealthInspector]
    code: 200
    input: []
    output: Baker
    side_effects: []
  - method: GET
    path: "/bakery/bakers"
    description: "List operators."
    roles: [PlatformAdmin, HealthInspector]
    code: 200
    input: ["permit_status?", "jurisdiction_code?", "limit?", "offset?"]
    output: Baker[]
    side_effects: []
  - method: GET
    path: "/bakery/bakers/{baker_id}/compliance"
    description: "Computed cottage-food compliance summary for the operator."
    roles: [PlatformAdmin, Baker, HealthInspector]
    code: 200
    input: []
    output: { annual_gross_sales_cents: integer, cap_remaining_cents: integer, annual_cap_cents: integer, cap_year: integer, permit_status: string, payout_net_cents: integer, tip_counts_toward_cap: boolean }
    side_effects: ["recomputes Baker.annual_gross_sales_cents and Baker.payout_net_cents"]

  # ---------------- Customer --------------------------------------------
  - method: POST
    path: "/bakery/customers"
    description: "Register a customer of one operator, including the allergen-avoidance profile."
    roles: [PlatformAdmin, Baker]
    code: 201
    input: [baker_id, display_name, email, delivery_distance_km, "allergen_avoidances?", "unattended_consent?", "cooler_provided?"]
    output: Customer
    side_effects: ["creates the Customer with credit_balance_cents 0"]
  - method: GET
    path: "/bakery/customers/{customer_id}"
    description: "Read one customer, including the recomputed credit balance."
    roles: [PlatformAdmin, Baker, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: ["recomputes Customer.credit_balance_cents per calculations.credit_balance"]
  - method: GET
    path: "/bakery/customers"
    description: "List customers, optionally filtered by operator."
    roles: [PlatformAdmin, Baker]
    code: 200
    input: ["baker_id?", "email?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []

  # ---------------- Recipe / components ---------------------------------
  - method: POST
    path: "/bakery/recipes"
    description: "Create a recipe in DRAFT."
    roles: [Baker]
    code: 201
    input: [baker_id, name]
    output: Recipe
    side_effects: ["creates the Recipe with recipe_status DRAFT and published_version 0"]
  - method: POST
    path: "/bakery/recipes/{recipe_id}/components"
    description: "Attach a component to a recipe; the component may reference a sub-recipe, an ingredient lot, or neither."
    roles: [Baker]
    code: 201
    input: [component_name, quantity_grams, "declared_allergens?", "sub_recipe_id?", "ingredient_lot_id?"]
    output: RecipeComponent
    side_effects:
      - "recomputes Recipe.tree_depth and Recipe.allergen_union"
      - "rejects a component that would make the sub-recipe closure cyclic or deeper than ALLERGEN_TREE_MAX_DEPTH"
      - "increments Recipe.version by 1"
  - method: POST
    path: "/bakery/recipes/{recipe_id}/publish"
    description: "Publish a DRAFT or REVISING recipe, bumping published_version and superseding every label derived from the previous version."
    roles: [Baker]
    code: 200
    input: []
    output: Recipe
    side_effects:
      - "increments Recipe.published_version by 1"
      - "recomputes Recipe.allergen_union, Recipe.tree_depth and Recipe.cross_contact_advisory"
      - "cascade depth 3: ISSUED Labels on this recipe become SUPERSEDED, which removes the handoff write gate on their Orders, and MenuItem.allergen_summary is recomputed"
      - "increments Recipe.version by 1"
  - method: POST
    path: "/bakery/recipes/{recipe_id}/lifecycle"
    description: "Move a recipe to REVISING or RETIRED."
    roles: [Baker]
    code: 200
    input: [to_status]
    output: Recipe
    side_effects: ["drives the Recipe.recipe_status axis", "increments Recipe.version by 1"]
  - method: GET
    path: "/bakery/recipes/{recipe_id}"
    description: "Read one recipe."
    roles: [Baker, PlatformAdmin, HealthInspector]
    code: 200
    input: []
    output: Recipe
    side_effects: []
  - method: GET
    path: "/bakery/recipes"
    description: "List recipes."
    roles: [Baker, PlatformAdmin, HealthInspector]
    code: 200
    input: ["baker_id?", "recipe_status?", "limit?", "offset?"]
    output: Recipe[]
    side_effects: []
  - method: GET
    path: "/bakery/recipes/{recipe_id}/allergen-profile"
    description: "Computed recursive allergen union, tree depth and cross-contact advisory for a recipe."
    roles: [Baker, PlatformAdmin, HealthInspector, Customer]
    code: 200
    input: []
    output: { allergen_union: array, tree_depth: integer, cross_contact_advisory: string, component_count: integer, published_version: integer }
    side_effects: []
  - method: GET
    path: "/bakery/recipe-components/{recipe_component_id}"
    description: "Read one recipe component."
    roles: [Baker, PlatformAdmin, HealthInspector]
    code: 200
    input: []
    output: RecipeComponent
    side_effects: []
  - method: GET
    path: "/bakery/recipe-components"
    description: "List recipe components, filterable by owning recipe, referenced sub-recipe or referenced ingredient lot."
    roles: [Baker, PlatformAdmin, HealthInspector]
    code: 200
    input: ["recipe_id?", "sub_recipe_id?", "ingredient_lot_id?", "limit?", "offset?"]
    output: RecipeComponent[]
    side_effects: []

  # ---------------- IngredientLot ---------------------------------------
  - method: POST
    path: "/bakery/ingredient-lots"
    description: "Receive an ingredient lot."
    roles: [Baker]
    code: 201
    input: [baker_id, lot_code, received_at, expires_at, "allergens?", "cross_contact_allergens?"]
    output: IngredientLot
    side_effects: ["creates the IngredientLot in RECEIVED"]
  - method: POST
    path: "/bakery/ingredient-lots/{ingredient_lot_id}/release"
    description: "Release a received lot for production, or mark an already-released lot EXPIRED when force_expiry_check is true and the clock has passed expires_at."
    roles: [Baker]
    code: 200
    input: ["force_expiry_check?"]
    output: IngredientLot
    side_effects: ["drives the IngredientLot.lot_status axis", "increments IngredientLot.version by 1"]
  - method: POST
    path: "/bakery/ingredient-lots/{ingredient_lot_id}/recall"
    description: "Recall a lot and run the depth-6 downstream cascade."
    roles: [PlatformAdmin]
    code: 200
    input: [recall_reason]
    output: IngredientLot
    side_effects:
      - "hop 1: sets recalled_component on every RecipeComponent referencing this lot"
      - "hop 2: moves each affected PUBLISHED Recipe to REVISING"
      - "hop 3: scraps every Batch of those recipes in {PLANNED, MIXED, BAKED}"
      - "hop 4: voids every OrderLine pointing at a scrapped Batch"
      - "hop 5: moves every owning Order in {CONFIRMED, IN_PRODUCTION, READY} to VOIDED_RECALL, skipping FULFILLED, CANCELLED and FORFEITED orders"
      - "hop 6: voids the ISSUED Labels of those orders and issues a full refund per calculations.refund_waterfall when the Payment is CAPTURED"
      - "increments IngredientLot.version by 1"
  - method: GET
    path: "/bakery/ingredient-lots/{ingredient_lot_id}"
    description: "Read one ingredient lot."
    roles: [Baker, PlatformAdmin, HealthInspector]
    code: 200
    input: []
    output: IngredientLot
    side_effects: []
  - method: GET
    path: "/bakery/ingredient-lots"
    description: "List ingredient lots."
    roles: [Baker, PlatformAdmin, HealthInspector]
    code: 200
    input: ["baker_id?", "lot_status?", "lot_code?", "limit?", "offset?"]
    output: IngredientLot[]
    side_effects: []

  # ---------------- MenuItem --------------------------------------------
  - method: POST
    path: "/bakery/menu-items"
    description: "Create a menu item in DRAFT."
    roles: [Baker]
    code: 201
    input: [baker_id, recipe_id, name, product_class, pricing_basis, unit_price_cents, dozen_price_cents, "temp_sensitive?", "oven_profile?", "oven_hours_per_batch?", "yield_units_per_slot?"]
    output: MenuItem
    side_effects: ["creates the MenuItem with listing_status DRAFT, rating_avg null and rating_count 0"]
  - method: POST
    path: "/bakery/menu-items/{menu_item_id}/listing-status"
    description: "List, pause, relist or delist a menu item."
    roles: [Baker]
    code: 200
    input: [to_status]
    output: MenuItem
    side_effects: ["drives the MenuItem.listing_status axis", "recomputes MenuItem.allergen_summary on entry to LISTED", "increments MenuItem.version by 1"]
  - method: GET
    path: "/bakery/menu-items/{menu_item_id}"
    description: "Read one menu item including the stored rating rollup."
    roles: [Baker, Customer, PlatformAdmin, HealthInspector]
    code: 200
    input: []
    output: MenuItem
    side_effects: []
  - method: GET
    path: "/bakery/menu-items"
    description: "List menu items."
    roles: [Baker, Customer, PlatformAdmin, HealthInspector]
    code: 200
    input: ["baker_id?", "recipe_id?", "listing_status?", "product_class?", "limit?", "offset?"]
    output: MenuItem[]
    side_effects: []

  # ---------------- OfferWindow -----------------------------------------
  - method: POST
    path: "/bakery/offer-windows"
    description: "Create a pre-order window in DRAFT with its three capacity axes."
    roles: [Baker]
    code: 201
    input: [baker_id, label, opens_at, order_cutoff_at, production_date, handoff_date, handoff_window_end_at, "capacity_units?", "capacity_batch_slots?", "capacity_oven_hours?"]
    output: OfferWindow
    side_effects: ["creates the window with window_status DRAFT, plan_status UNPLANNED and capacity_posture OPEN_CAPACITY"]
  - method: POST
    path: "/bakery/offer-windows/{offer_window_id}/lock"
    description: "Lock the window at cutoff, releasing every unconfirmed hold and every unconfirmed subscription reservation."
    roles: [Baker]
    code: 200
    input: []
    output: OfferWindow
    side_effects:
      - "window_status OPEN -> LOCKED"
      - "PENDING_HOLD orders become EXPIRED_HOLD and their PENDING lines become RELEASED"
      - "RESERVED SubscriptionCycles become RELEASED"
      - "recomputes held_units, reserved_units and capacity_posture"
      - "increments OfferWindow.version by 1"
  - method: POST
    path: "/bakery/offer-windows/{offer_window_id}/extend-cutoff"
    description: "Re-open a locked, unplanned window by pushing order_cutoff_at CUTOFF_EXTENSION_MINUTES past the current instant."
    roles: [Baker]
    code: 200
    input: []
    output: OfferWindow
    side_effects:
      - "window_status LOCKED -> OPEN"
      - "sets order_cutoff_at to logical now plus CUTOFF_EXTENSION_MINUTES and increments cutoff_extension_count"
      - "recomputes skip_deadline_at on every attached SubscriptionCycle"
      - "increments OfferWindow.version by 1"
  - method: POST
    path: "/bakery/offer-windows/{offer_window_id}/advance"
    description: "Advance the window lifecycle to OPEN, IN_PRODUCTION, HANDOFF_OPEN, CLOSED or CANCELLED."
    roles: [Baker]
    code: 200
    input: [to_status]
    output: OfferWindow
    side_effects:
      - "drives the OfferWindow.window_status axis"
      - "on IN_PRODUCTION, CONFIRMED orders become IN_PRODUCTION"
      - "on HANDOFF_OPEN, IN_PRODUCTION orders become READY, pickup orders get pickup_forfeit_at, SCHEDULED pickup orders become PICKUP_READY and ALLOCATED batches become CLOSED"
      - "on CLOSED, plan_status becomes RECONCILED"
      - "increments OfferWindow.version by 1"
  - method: POST
    path: "/bakery/offer-windows/{offer_window_id}/plan"
    description: "Build the production plan for a locked window, or tear it down again with mode REPLAN."
    roles: [Baker]
    code: 200
    input: [mode]
    output: OfferWindow
    side_effects:
      - "on PLAN, creates one Batch per menu item with slot_count, planned_yield_units and oven_hours, pins recipe_version_pinned and sets OrderLine.batch_id"
      - "on REPLAN, deletes the batches and clears OrderLine.batch_id"
      - "drives the OfferWindow.plan_status axis"
      - "increments OfferWindow.version by 1"
  - method: GET
    path: "/bakery/offer-windows/{offer_window_id}"
    description: "Read one offer window with all three status axes."
    roles: [Baker, Customer, PlatformAdmin, HealthInspector]
    code: 200
    input: []
    output: OfferWindow
    side_effects: []
  - method: GET
    path: "/bakery/offer-windows"
    description: "List offer windows."
    roles: [Baker, Customer, PlatformAdmin, HealthInspector]
    code: 200
    input: ["baker_id?", "window_status?", "plan_status?", "capacity_posture?", "limit?", "offset?"]
    output: OfferWindow[]
    side_effects: []
  - method: GET
    path: "/bakery/offer-windows/{offer_window_id}/capacity"
    description: "Computed remaining capacity on all three axes plus the derived posture."
    roles: [Baker, Customer, PlatformAdmin]
    code: 200
    input: []
    output: { units_remaining: integer, batch_slots_remaining: integer, oven_hours_remaining: number, capacity_posture: string, confirmed_units: integer, held_units: integer, reserved_units: integer, slots_used: integer, oven_hours_used: number }
    side_effects: ["recomputes OfferWindow.confirmed_units, held_units, reserved_units and capacity_posture"]

  # ---------------- Order / OrderLine -----------------------------------
  - method: POST
    path: "/bakery/orders"
    description: "Open a DRAFT order against an OPEN window."
    roles: [Customer, Baker]
    code: 201
    input: [customer_id, offer_window_id, handoff_mode, "channel?", "allergen_ack?", "unattended_consent?", "cooler_provided?"]
    output: Order
    side_effects: ["creates the Order with order_status DRAFT, payment_status UNPAID and handoff_status NOT_SCHEDULED"]
  - method: POST
    path: "/bakery/orders/{order_id}/lines"
    description: "Add a line to a DRAFT, PENDING_HOLD or EXPIRED_HOLD order, opening or refreshing the capacity hold."
    roles: [Customer, Baker]
    code: 201
    input: [menu_item_id, quantity, expected_offer_window_version, "disposition?"]
    output: OrderLine
    side_effects:
      - "prices the line per calculations.line_pricing and calculations.line_tax"
      - "order_status DRAFT -> PENDING_HOLD or EXPIRED_HOLD -> PENDING_HOLD and sets hold_expires_at"
      - "adds the units to OfferWindow.held_units and recomputes capacity_posture"
      - "increments OfferWindow.version by 1"
      - "increments Order.version by 1"
  - method: PATCH
    path: "/bakery/orders/{order_id}/lines/{order_line_id}"
    description: "Change a PENDING line's quantity or disposition, re-pricing and re-checking all three capacity axes."
    roles: [Customer, Baker]
    code: 200
    input: [quantity, expected_offer_window_version, "disposition?"]
    output: OrderLine
    side_effects:
      - "re-prices the line, which under PER_DOZEN_BAKERS can RAISE line_total_cents when quantity is reduced across a block boundary"
      - "adjusts OfferWindow.held_units by the quantity delta and recomputes capacity_posture"
      - "increments OfferWindow.version by 1"
      - "increments OrderLine.version by 1"
  - method: POST
    path: "/bakery/orders/{order_id}/confirm"
    description: "Confirm a held order: run the compliance, allergen and capacity ladder, price the order, and convert the hold into confirmed capacity."
    roles: [Customer]
    code: 200
    input: ["allergen_ack?"]
    output: Order
    side_effects:
      - "order_status PENDING_HOLD -> CONFIRMED"
      - "sets subtotal_cents, tax_total_cents, delivery_fee_cents and delivery_distance_km"
      - "moves the units from held_units to confirmed_units and recomputes capacity_posture"
      - "recomputes Baker.annual_gross_sales_cents and may latch Baker.permit_status to CAP_REACHED"
      - "increments Order.version by 1"
  - method: POST
    path: "/bakery/orders/{order_id}/cancel"
    description: "Cancel a held, expired or confirmed order, releasing capacity and unwinding money."
    roles: [Customer, Baker]
    code: 200
    input: ["cancel_reason?"]
    output: Order
    side_effects:
      - "order_status -> CANCELLED and PENDING lines -> RELEASED"
      - "releases held or confirmed units and recomputes capacity_posture"
      - "voids an AUTHORIZED payment or refunds a CAPTURED one per calculations.refund_waterfall"
      - "recomputes Baker.annual_gross_sales_cents"
      - "increments Order.version by 1"
  - method: POST
    path: "/bakery/orders/{order_id}/schedule-handoff"
    description: "Schedule the handoff, or rebook a MISSED one. Runs the consent, cooler, zone and delivery-minimum rungs that apply to the order's pipeline."
    roles: [Customer, Baker]
    code: 200
    input: ["delivery_route_id?", "unattended_consent?", "cooler_provided?"]
    output: Order
    side_effects:
      - "handoff_status NOT_SCHEDULED -> SCHEDULED or MISSED -> SCHEDULED with rebook_count incremented"
      - "for DELIVERY, sets delivery_route_id"
      - "increments Order.version by 1"
  - method: POST
    path: "/bakery/orders/{order_id}/handoff-outcome"
    description: "Record the handoff outcome: HANDED_OFF, MISSED or FORFEITED. HANDED_OFF requires an unsuperseded ISSUED label on every live line."
    roles: [Baker]
    code: 200
    input: [outcome]
    output: Order
    side_effects:
      - "on HANDED_OFF: handoff_status -> HANDED_OFF, order_status READY -> FULFILLED, lines -> FULFILLED, labels ISSUED -> CONSUMED, Payment CAPTURED -> SETTLED, sets fulfilled_at and review_window_closes_at"
      - "on MISSED: handoff_status -> MISSED with no money movement"
      - "on FORFEITED: handoff_status -> FORFEITED, order_status READY -> FORFEITED, sets forfeit_latched permanently and refunds FORFEIT_REFUND_PCT of the captured amount"
      - "increments Order.version by 1"
  - method: GET
    path: "/bakery/orders/{order_id}"
    description: "Read one order with all three status axes and every money field."
    roles: [Customer, Baker, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/bakery/orders"
    description: "List orders, filterable by customer, window, generating subscription cycle or delivery route."
    roles: [Customer, Baker, PlatformAdmin]
    code: 200
    input: ["customer_id?", "offer_window_id?", "subscription_cycle_id?", "delivery_route_id?", "order_status?", "payment_status?", "handoff_status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: GET
    path: "/bakery/orders/{order_id}/quote"
    description: "Computed money breakdown for an order in the pinned evaluation order."
    roles: [Customer, Baker, PlatformAdmin]
    code: 200
    input: []
    output: { subtotal_cents: integer, tax_total_cents: integer, delivery_fee_cents: integer, tip_cents: integer, credit_applied_cents: integer, grand_total_cents: integer, taxable_line_count: integer, exempt_line_count: integer }
    side_effects: []
  - method: GET
    path: "/bakery/order-lines/{order_line_id}"
    description: "Read one order line with its pricing, tax and allocation fields."
    roles: [Customer, Baker, PlatformAdmin]
    code: 200
    input: []
    output: OrderLine
    side_effects: []
  - method: GET
    path: "/bakery/order-lines"
    description: "List order lines, filterable by order, menu item or assigned batch."
    roles: [Customer, Baker, PlatformAdmin]
    code: 200
    input: ["order_id?", "menu_item_id?", "batch_id?", "line_status?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []

  # ---------------- Batch / Label ----------------------------------------
  - method: POST
    path: "/bakery/batches/{batch_id}/advance"
    description: "Advance a batch to MIXED or BAKED."
    roles: [Baker]
    code: 200
    input: [to_status]
    output: Batch
    side_effects:
      - "drives the Batch.batch_status axis"
      - "on BAKED, RELEASED ingredient lots in the recipe tree become CONSUMED"
      - "increments Batch.version by 1"
  - method: POST
    path: "/bakery/batches/{batch_id}/confirm-yield"
    description: "Record actual yield, forking to YIELD_CONFIRMED or UNDER_YIELD and running the shortfall allocation cascade."
    roles: [Baker]
    code: 200
    input: [actual_yield_units]
    output: Batch
    side_effects:
      - "runs calculations.shortfall_allocation over the batch's PENDING lines in the fixed priority order"
      - "lines become ALLOCATED or SHORTED, then every SHORTED line becomes CREDITED with a proportional refund or credit per calculations.shortfall_credit"
      - "sets Batch.surplus_units so the yield conservation invariant holds"
      - "the batch then auto-advances to ALLOCATED"
      - "increments Batch.version by 1"
  - method: GET
    path: "/bakery/batches/{batch_id}"
    description: "Read one batch."
    roles: [Baker, PlatformAdmin, HealthInspector]
    code: 200
    input: []
    output: Batch
    side_effects: []
  - method: GET
    path: "/bakery/batches"
    description: "List batches, filterable by window, menu item or recipe."
    roles: [Baker, PlatformAdmin, HealthInspector]
    code: 200
    input: ["offer_window_id?", "menu_item_id?", "recipe_id?", "batch_status?", "limit?", "offset?"]
    output: Batch[]
    side_effects: []
  - method: POST
    path: "/bakery/labels"
    description: "Issue a cottage-food label for one order line, pinning the recipe version and the derived allergen statement."
    roles: [Baker]
    code: 201
    input: [order_line_id, recipe_id, net_weight_grams, expected_recipe_version]
    output: Label
    side_effects:
      - "creates the Label in ISSUED with recipe_version_pinned set to Recipe.published_version"
      - "pins allergen_union per calculations.allergen_union and cross_contact_advisory per calculations.cross_contact_advisory"
      - "increments Recipe.version by 1"
  - method: GET
    path: "/bakery/labels/{label_id}"
    description: "Read one label."
    roles: [Baker, Customer, PlatformAdmin, HealthInspector]
    code: 200
    input: []
    output: Label
    side_effects: []
  - method: GET
    path: "/bakery/labels"
    description: "List labels, filterable by order line or recipe."
    roles: [Baker, Customer, PlatformAdmin, HealthInspector]
    code: 200
    input: ["order_line_id?", "recipe_id?", "label_status?", "limit?", "offset?"]
    output: Label[]
    side_effects: []

  # ---------------- Subscription / cycles --------------------------------
  - method: POST
    path: "/bakery/subscriptions"
    description: "Create a bread or cookie club membership in PENDING."
    roles: [Customer, Baker]
    code: 201
    input: [customer_id, menu_item_id, cadence, units_per_cycle, billing_mode, handoff_mode]
    output: Subscription
    side_effects: ["creates the Subscription in PENDING with pause_count 0 and prepaid_balance_cents 0"]
  - method: POST
    path: "/bakery/subscriptions/{subscription_id}/status"
    description: "Activate, pause, resume, mark PAST_DUE, or cancel a club membership."
    roles: [Customer, Baker]
    code: 200
    input: [to_status]
    output: Subscription
    side_effects:
      - "drives the Subscription.sub_status axis"
      - "on PENDING -> ACTIVE with billing_mode PREPAID, creates a PREPAY_DEPOSIT MoneyMovement and sets prepaid_balance_cents"
      - "on ACTIVE -> PAUSED, increments pause_count and releases RESERVED cycles"
      - "on -> CANCELLED, releases GENERATED and RESERVED cycles and converts any remaining prepaid balance into customer credit"
      - "increments Subscription.version by 1"
  - method: POST
    path: "/bakery/subscriptions/{subscription_id}/cycles"
    description: "Generate the next club cycle against an OPEN window, pre-claiming window capacity ahead of walk-up orders."
    roles: [Baker]
    code: 201
    input: [offer_window_id, sequence_number]
    output: SubscriptionCycle
    side_effects:
      - "creates the cycle in GENERATED and immediately reserves capacity, moving it to RESERVED"
      - "sets reserved_units, skip_deadline_at and cycle_price_cents"
      - "adds reserved_units to OfferWindow.reserved_units and recomputes capacity_posture"
      - "increments OfferWindow.version by 1"
  - method: POST
    path: "/bakery/subscription-cycles/{subscription_cycle_id}/skip"
    description: "Skip a reserved cycle before its skip deadline, releasing the reserved capacity."
    roles: [Customer]
    code: 200
    input: []
    output: SubscriptionCycle
    side_effects:
      - "cycle_status RESERVED -> SKIPPED and reserved_units drop to 0"
      - "recomputes OfferWindow.reserved_units and capacity_posture"
      - "increments SubscriptionCycle.version by 1"
  - method: POST
    path: "/bakery/subscription-cycles/{subscription_cycle_id}/confirm"
    description: "Confirm a reserved cycle, turning the reservation into a CONFIRMED club Order."
    roles: [Customer]
    code: 200
    input: [expected_subscription_version]
    output: SubscriptionCycle
    side_effects:
      - "cycle_status RESERVED -> CONFIRMED -> ORDER_PLACED"
      - "creates an Order with source SUBSCRIPTION_CLUB in order_status CONFIRMED plus one PENDING OrderLine"
      - "moves reserved_units into OfferWindow.confirmed_units"
      - "for PREPAID, debits prepaid_balance_cents and creates a CREDIT_REDEEM MoneyMovement"
      - "recomputes Baker.annual_gross_sales_cents"
      - "increments Subscription.version by 1"
  - method: GET
    path: "/bakery/subscriptions/{subscription_id}"
    description: "Read one club membership."
    roles: [Customer, Baker, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: GET
    path: "/bakery/subscriptions"
    description: "List club memberships."
    roles: [Customer, Baker, PlatformAdmin]
    code: 200
    input: ["customer_id?", "menu_item_id?", "sub_status?", "billing_mode?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []
  - method: GET
    path: "/bakery/subscription-cycles/{subscription_cycle_id}"
    description: "Read one club cycle."
    roles: [Customer, Baker, PlatformAdmin]
    code: 200
    input: []
    output: SubscriptionCycle
    side_effects: []
  - method: GET
    path: "/bakery/subscription-cycles"
    description: "List club cycles, filterable by subscription or window."
    roles: [Customer, Baker, PlatformAdmin]
    code: 200
    input: ["subscription_id?", "offer_window_id?", "cycle_status?", "limit?", "offset?"]
    output: SubscriptionCycle[]
    side_effects: []

  # ---------------- Payment / money --------------------------------------
  - method: POST
    path: "/bakery/payments"
    description: "Authorize payment for a confirmed order, resolving the tip variant, the credit application and the grand total in the pinned evaluation order."
    roles: [Customer]
    code: 201
    input: [order_id, tip_mode, "tip_pct?", "tip_fixed_cents?", "outcome?", "apply_credit_cents?"]
    output: Payment
    side_effects:
      - "creates the Payment in AUTHORIZED (or DECLINED when outcome is DECLINED)"
      - "sets Order.tip_cents, Order.credit_applied_cents and Order.grand_total_cents"
      - "creates a negative CREDIT_REDEEM MoneyMovement with ledger_scope CUSTOMER_CREDIT when credit is applied"
      - "Order.payment_status UNPAID -> AUTHORIZED on success"
      - "increments Order.version by 1"
  - method: POST
    path: "/bakery/payments/{payment_id}/capture"
    description: "Capture an authorized payment."
    roles: [Baker]
    code: 200
    input: []
    output: Payment
    side_effects:
      - "Payment.payment_state AUTHORIZED -> CAPTURED and captured_cents set"
      - "Order.payment_status AUTHORIZED -> CAPTURED"
      - "recomputes Baker.payout_net_cents"
      - "increments Payment.version by 1"
  - method: POST
    path: "/bakery/payments/{payment_id}/refunds"
    description: "Refund part or all of a captured payment through the fixed waterfall of tip, delivery fee, taxable subtotal and credit."
    roles: [Baker]
    code: 201
    input: [amount_cents, refund_reason, expected_order_version]
    output: MoneyMovement
    side_effects:
      - "creates a MoneyMovement with movement_kind REFUND and per-leg amounts per calculations.refund_waterfall"
      - "increases Payment.refunded_cents and moves Order.payment_status to PARTIALLY_REFUNDED or REFUNDED"
      - "recomputes Baker.annual_gross_sales_cents and Baker.payout_net_cents"
      - "increments Order.version by 1"
  - method: GET
    path: "/bakery/payments/{payment_id}"
    description: "Read one payment."
    roles: [Customer, Baker, PlatformAdmin]
    code: 200
    input: []
    output: Payment
    side_effects: []
  - method: GET
    path: "/bakery/payments"
    description: "List payments, filterable by order."
    roles: [Customer, Baker, PlatformAdmin]
    code: 200
    input: ["order_id?", "payment_state?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []
  - method: GET
    path: "/bakery/money-movements/{money_movement_id}"
    description: "Read one money movement with its four waterfall legs."
    roles: [Customer, Baker, PlatformAdmin]
    code: 200
    input: []
    output: MoneyMovement
    side_effects: []
  - method: GET
    path: "/bakery/money-movements"
    description: "List money movements, filterable by customer, order or payment."
    roles: [Customer, Baker, PlatformAdmin]
    code: 200
    input: ["customer_id?", "order_id?", "payment_id?", "subscription_id?", "movement_kind?", "reason?", "ledger_scope?", "limit?", "offset?"]
    output: MoneyMovement[]
    side_effects: []

  # ---------------- DeliveryRoute ----------------------------------------
  - method: POST
    path: "/bakery/delivery-routes"
    description: "Create a delivery route for a window."
    roles: [Baker]
    code: 201
    input: [baker_id, offer_window_id]
    output: DeliveryRoute
    side_effects: ["creates the route in DRAFT with stop_count 0"]
  - method: POST
    path: "/bakery/delivery-routes/{delivery_route_id}/status"
    description: "Sequence, resequence, dispatch or complete a delivery route."
    roles: [Baker]
    code: 200
    input: [to_status]
    output: DeliveryRoute
    side_effects:
      - "drives the DeliveryRoute.route_status axis"
      - "on SEQUENCED, assigns Order.stop_sequence per calculations.route_stop_sequence and sets stop_count and total_distance_km"
      - "on DRAFT, clears every Order.stop_sequence"
      - "on DISPATCHED, moves every SCHEDULED and READY assigned order to OUT_FOR_DELIVERY"
      - "increments DeliveryRoute.version by 1"
  - method: GET
    path: "/bakery/delivery-routes/{delivery_route_id}"
    description: "Read one delivery route."
    roles: [Baker, PlatformAdmin]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: []
  - method: GET
    path: "/bakery/delivery-routes"
    description: "List delivery routes, filterable by operator or window."
    roles: [Baker, PlatformAdmin]
    code: 200
    input: ["baker_id?", "offer_window_id?", "route_status?", "limit?", "offset?"]
    output: DeliveryRoute[]
    side_effects: []

  # ---------------- Review -----------------------------------------------
  - method: POST
    path: "/bakery/reviews"
    description: "Review a fulfilled order inside the review window; one review per order."
    roles: [Customer]
    code: 201
    input: [order_id, menu_item_id, rating, body]
    output: Review
    side_effects:
      - "creates the Review in SUBMITTED with shortfall_affected derived from the order"
      - "recomputes MenuItem.rating_avg and MenuItem.rating_count per calculations.menu_item_rating_rollup"
      - "increments MenuItem.version by 1"
  - method: POST
    path: "/bakery/reviews/{review_id}/respond"
    description: "Record the baker's reply inside the response window."
    roles: [Baker]
    code: 200
    input: [baker_response]
    output: Review
    side_effects: ["review_status SUBMITTED -> RESPONDED", "recomputes the MenuItem rating rollup", "increments Review.version by 1"]
  - method: POST
    path: "/bakery/reviews/{review_id}/moderation"
    description: "Hide or unhide a review, which changes whether it counts toward the menu item's rating rollup."
    roles: [PlatformAdmin]
    code: 200
    input: [to_status]
    output: Review
    side_effects:
      - "drives the Review.review_status axis between SUBMITTED, RESPONDED and HIDDEN"
      - "sets counts_toward_rollup and recomputes MenuItem.rating_avg and MenuItem.rating_count"
      - "increments Review.version by 1"
  - method: GET
    path: "/bakery/reviews/{review_id}"
    description: "Read one review."
    roles: [Customer, Baker, PlatformAdmin]
    code: 200
    input: []
    output: Review
    side_effects: []
  - method: GET
    path: "/bakery/reviews"
    description: "List reviews, filterable by order, menu item or customer."
    roles: [Customer, Baker, PlatformAdmin]
    code: 200
    input: ["order_id?", "menu_item_id?", "customer_id?", "review_status?", "limit?", "offset?"]
    output: Review[]
    side_effects: []

  # ---------------- test-driving endpoints --------------------------------
  - method: POST
    path: "/bakery/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-05-01T00:00:00Z (CLOCK_DEFAULT_UTC) and never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, previous_utc: string }
    side_effects: ["moves the logical clock; no entity is mutated"]
  - method: POST
    path: "/bakery/_holds/expire-due"
    description: "Sweep every PENDING_HOLD order whose hold_expires_at is at or before the logical clock, releasing its lines and the capacity they held."
    roles: [PlatformAdmin]
    code: 200
    input: ["offer_window_id?"]
    output: { expired_order_count: integer, released_line_count: integer, released_units: integer, capacity_posture: string }
    side_effects:
      - "order_status PENDING_HOLD -> EXPIRED_HOLD and line_status PENDING -> RELEASED for every due hold"
      - "recomputes OfferWindow.held_units and capacity_posture, which may move the posture back toward OPEN_CAPACITY"
      - "increments OfferWindow.version by 1"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role not in the RBAC matrix"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity-backed role acts on a resource owned by a different instance of its entity"
  - id: ERR_VALIDATION
    http: 400
    condition: "malformed body, missing required field, wrong type, negative quantity or amount, rating outside 1..5, pagination limit outside 1..100 or negative offset, or an offer window whose instants are not strictly ordered"
  - id: ERR_INVALID_ENUM
    http: 400
    condition: "an enum-valued field carries a value outside its declared constraint set"
  - id: ERR_OFFER_WINDOW_NOT_FOUND
    http: 404
    condition: "an offer_window_id in the path or body does not resolve"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "an order_id or order_line_id in the path does not resolve"
  - id: ERR_MENU_ITEM_NOT_FOUND
    http: 404
    condition: "a menu_item_id in the body does not resolve"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "any other referenced Baker, Customer, Recipe, RecipeComponent, IngredientLot, Batch, Label, Subscription, SubscriptionCycle, Payment, MoneyMovement, DeliveryRoute or Review does not resolve"
  - id: ERR_PERMIT_NOT_ACTIVE
    http: 409
    condition: "the owning Baker.permit_status is PENDING, SUSPENDED or CAP_REACHED on an order-affecting write"
  - id: ERR_WINDOW_LOCKED
    http: 409
    condition: "an order-mutating call touches an OfferWindow whose window_status is LOCKED"
  - id: ERR_CUTOFF_PASSED
    http: 409
    condition: "logical now is at or after OfferWindow.order_cutoff_at on a line add, line patch, order confirm or cycle confirm"
  - id: ERR_WINDOW_NOT_OPEN
    http: 409
    condition: "the OfferWindow's window_status is DRAFT, IN_PRODUCTION, HANDOFF_OPEN, CLOSED or CANCELLED where OPEN is required"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target entity's current state on the relevant axis is not a declared from-state of the requested transition"
  - id: ERR_STALE_OFFER_WINDOW_VERSION
    http: 412
    condition: "expected_offer_window_version does not equal the OfferWindow's current version"
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_order_version does not equal the Order's current version"
  - id: ERR_STALE_RECIPE_VERSION
    http: 412
    condition: "expected_recipe_version does not equal the Recipe's current version"
  - id: ERR_STALE_SUBSCRIPTION_VERSION
    http: 412
    condition: "expected_subscription_version does not equal the Subscription's current version"
  - id: ERR_WHOLESALE_NOT_PERMITTED
    http: 422
    condition: "Order.channel is WHOLESALE, which cottage-food operations may not sell through"
  - id: ERR_PRODUCT_CLASS_NOT_DTC_ELIGIBLE
    http: 422
    condition: "a referenced MenuItem.product_class is REFRIGERATION_REQUIRED"
  - id: ERR_RECIPE_NOT_PUBLISHED
    http: 409
    condition: "the Recipe backing a referenced MenuItem is DRAFT, REVISING or RETIRED"
  - id: ERR_LOT_RECALLED
    http: 409
    condition: "a referenced IngredientLot is RECALLED or a RecipeComponent in the closure has recalled_component true"
  - id: ERR_RECIPE_CYCLE_DETECTED
    http: 422
    condition: "the sub-recipe closure is cyclic or deeper than ALLERGEN_TREE_MAX_DEPTH"
  - id: ERR_ALLERGEN_HARD_BLOCK
    http: 422
    condition: "an order allergen matches a customer avoidance of severity ANAPHYLACTIC"
  - id: ERR_ALLERGEN_ACK_REQUIRED
    http: 422
    condition: "an order allergen matches a customer avoidance of severity INTOLERANCE and Order.allergen_ack is not true"
  - id: ERR_UNATTENDED_CONSENT_REQUIRED
    http: 422
    condition: "a PORCH_SELF_SERVE handoff is scheduled without Order.unattended_consent"
  - id: ERR_COOLER_CONSENT_REQUIRED
    http: 422
    condition: "a PORCH_SELF_SERVE handoff carrying a temp_sensitive item is scheduled without Order.cooler_provided"
  - id: ERR_OUT_OF_PERMITTED_ZONE
    http: 422
    condition: "a DELIVERY order's distance exceeds Baker.permitted_radius_km"
  - id: ERR_MAX_LINES_EXCEEDED
    http: 422
    condition: "the order already has MAX_LINES_PER_ORDER live lines, or the requested quantity is outside MIN_UNITS_PER_LINE..MAX_UNITS_PER_LINE"
  - id: ERR_LABEL_SUPERSEDED
    http: 409
    condition: "a HANDED_OFF outcome is recorded while some live line's Label is SUPERSEDED, VOID, CONSUMED or missing"
  - id: ERR_BATCH_NOT_BAKED
    http: 409
    condition: "yield is confirmed on a batch whose batch_status is not BAKED"
  - id: ERR_DUPLICATE_REVIEW
    http: 409
    condition: "a second Review is submitted for the same order_id"
  - id: ERR_HOLD_EXPIRED
    http: 409
    condition: "logical now is at or after Order.hold_expires_at on a confirm or a line patch"
  - id: ERR_PICKUP_GRACE_EXPIRED
    http: 409
    condition: "a HANDED_OFF outcome is recorded for a pickup order at or after Order.pickup_forfeit_at"
  - id: ERR_SKIP_DEADLINE_PASSED
    http: 409
    condition: "logical now is at or after SubscriptionCycle.skip_deadline_at on a skip"
  - id: ERR_REVIEW_WINDOW_CLOSED
    http: 409
    condition: "logical now is at or after Order.review_window_closes_at on a review submission"
  - id: ERR_RESPONSE_WINDOW_CLOSED
    http: 409
    condition: "logical now is at or after Review.created_at plus BAKER_RESPONSE_WINDOW_DAYS on a baker response"
  - id: ERR_PAUSE_CAP_EXCEEDED
    http: 409
    condition: "a pause is requested when Subscription.pause_count already equals SUBSCRIPTION_PAUSE_CAP_COUNT"
  - id: ERR_REBOOK_LIMIT_EXCEEDED
    http: 409
    condition: "a rebook is requested when Order.rebook_count already equals MISSED_REBOOK_MAX, or Order.forfeit_latched is true"
  - id: ERR_TIP_OUT_OF_RANGE
    http: 422
    condition: "tip_pct exceeds TIP_PCT_MAX, or tip_fixed_cents exceeds TIP_FIXED_MAX_CENTS, or either is negative"
  - id: ERR_DELIVERY_MINIMUM_NOT_MET
    http: 422
    condition: "a DELIVERY handoff is scheduled while Order.subtotal_cents is below DELIVERY_MINIMUM_CENTS"
  - id: ERR_INSUFFICIENT_CREDIT
    http: 422
    condition: "apply_credit_cents exceeds Customer.credit_balance_cents"
  - id: ERR_PAYMENT_NOT_CAPTURED
    http: 409
    condition: "a refund is requested on a Payment whose payment_state is not CAPTURED"
  - id: ERR_REFUND_EXCEEDS_CAPTURED
    http: 422
    condition: "the requested refund exceeds Payment.captured_cents minus Payment.refunded_cents, or the waterfall legs cannot absorb it"
  - id: ERR_ANNUAL_CAP_EXCEEDED
    http: 422
    condition: "the confirm's projected counted gross would exceed Baker.annual_cap_cents"
  - id: ERR_SUBSCRIPTION_RESERVE_SHARE_EXCEEDED
    http: 422
    condition: "a new cycle reservation would push OfferWindow.reserved_units past floor(capacity_units * SUBSCRIPTION_RESERVE_UNIT_SHARE_PCT)"
  - id: ERR_UNITS_CAPACITY_EXCEEDED
    http: 422
    condition: "the requested units exceed calculations.window_units_remaining"
  - id: ERR_BATCH_SLOT_CAPACITY_EXCEEDED
    http: 422
    condition: "the request requires more batch slots than batch_slots_remaining"
  - id: ERR_OVEN_HOURS_CAPACITY_EXCEEDED
    http: 422
    condition: "the request requires more oven hours than oven_hours_remaining"

roles:
  - name: Baker
    description: "The cottage-food operator: owns recipes, ingredient lots, menu items, offer windows, batches, labels, delivery routes, and answers reviews."
    identity: "entity_backed:Baker"
    exclusive_operations:
      - "POST /bakery/recipes"
      - "POST /bakery/recipes/{recipe_id}/components"
      - "POST /bakery/recipes/{recipe_id}/publish"
      - "POST /bakery/recipes/{recipe_id}/lifecycle"
      - "POST /bakery/ingredient-lots"
      - "POST /bakery/ingredient-lots/{ingredient_lot_id}/release"
      - "POST /bakery/menu-items"
      - "POST /bakery/menu-items/{menu_item_id}/listing-status"
      - "POST /bakery/offer-windows"
      - "POST /bakery/offer-windows/{offer_window_id}/lock"
      - "POST /bakery/offer-windows/{offer_window_id}/extend-cutoff"
      - "POST /bakery/offer-windows/{offer_window_id}/advance"
      - "POST /bakery/offer-windows/{offer_window_id}/plan"
      - "POST /bakery/orders/{order_id}/handoff-outcome"
      - "POST /bakery/batches/{batch_id}/advance"
      - "POST /bakery/batches/{batch_id}/confirm-yield"
      - "POST /bakery/labels"
      - "POST /bakery/subscriptions/{subscription_id}/cycles"
      - "POST /bakery/payments/{payment_id}/capture"
      - "POST /bakery/payments/{payment_id}/refunds"
      - "POST /bakery/delivery-routes"
      - "POST /bakery/delivery-routes/{delivery_route_id}/status"
      - "POST /bakery/reviews/{review_id}/respond"
    shared_operations:
      - "POST /bakery/customers"
      - "POST /bakery/orders"
      - "POST /bakery/orders/{order_id}/lines"
      - "PATCH /bakery/orders/{order_id}/lines/{order_line_id}"
      - "POST /bakery/orders/{order_id}/cancel"
      - "POST /bakery/orders/{order_id}/schedule-handoff"
      - "POST /bakery/subscriptions"
      - "POST /bakery/subscriptions/{subscription_id}/status"
      - "all GET endpoints except GET /bakery/bakers"

  - name: Customer
    description: "The buyer: opens orders, holds capacity, confirms, pays and tips, joins the club, skips or confirms cycles, and reviews fulfilled orders."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /bakery/orders/{order_id}/confirm"
      - "POST /bakery/payments"
      - "POST /bakery/subscription-cycles/{subscription_cycle_id}/skip"
      - "POST /bakery/subscription-cycles/{subscription_cycle_id}/confirm"
      - "POST /bakery/reviews"
    shared_operations:
      - "POST /bakery/orders"
      - "POST /bakery/orders/{order_id}/lines"
      - "PATCH /bakery/orders/{order_id}/lines/{order_line_id}"
      - "POST /bakery/orders/{order_id}/cancel"
      - "POST /bakery/orders/{order_id}/schedule-handoff"
      - "POST /bakery/subscriptions"
      - "POST /bakery/subscriptions/{subscription_id}/status"
      - "GET on own orders, order lines, payments, money movements, subscriptions, cycles, reviews, labels, menu items, offer windows, recipes and customers"

  - name: PlatformAdmin
    description: "Marketplace operator: registers bakers, moves permit posture, issues recalls, moderates reviews, drives the logical clock and the hold sweep."
    identity: "opaque"
    exclusive_operations:
      - "POST /bakery/bakers"
      - "POST /bakery/bakers/{baker_id}/permit-status"
      - "POST /bakery/ingredient-lots/{ingredient_lot_id}/recall"
      - "POST /bakery/reviews/{review_id}/moderation"
      - "POST /bakery/_clock/set_current_utc"
      - "POST /bakery/_holds/expire-due"
      - "GET /bakery/bakers"
    shared_operations:
      - "POST /bakery/customers"
      - "all GET endpoints"

  - name: HealthInspector
    description: "Read-only regulator: inspects permits, compliance figures, recipes, allergen profiles, ingredient lots, batches and labels. Never mutates anything and never sees money."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /bakery/bakers"
      - "GET /bakery/bakers/{baker_id}"
      - "GET /bakery/bakers/{baker_id}/compliance"
      - "GET /bakery/recipes"
      - "GET /bakery/recipes/{recipe_id}"
      - "GET /bakery/recipes/{recipe_id}/allergen-profile"
      - "GET /bakery/recipe-components"
      - "GET /bakery/recipe-components/{recipe_component_id}"
      - "GET /bakery/ingredient-lots"
      - "GET /bakery/ingredient-lots/{ingredient_lot_id}"
      - "GET /bakery/menu-items"
      - "GET /bakery/menu-items/{menu_item_id}"
      - "GET /bakery/offer-windows"
      - "GET /bakery/offer-windows/{offer_window_id}"
      - "GET /bakery/batches"
      - "GET /bakery/batches/{batch_id}"
      - "GET /bakery/labels"
      - "GET /bakery/labels/{label_id}"
