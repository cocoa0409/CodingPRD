          assert:
            - "${cov} == 65.00"
            - "${atm_sub} == 0.0000"
            - "${plan_state} == REVIEW_COMPLETE"
            - "the trigger call returns HTTP 422 with error_id ERR_MRV_DOMAIN_COVERAGE_MISSING"
            - "MonitoringPlan.${plan_id}.status == REVIEW_COMPLETE"
            - "MonitoringPlan.${plan_id}.approved_by_user_id == null"
            - "MonitoringPlan.${plan_id}.condition_count == 0"
            - "StorageProject.${proj_id}.effective_annual_monitoring_cost_usd == 200000.00"

      - name: permit_submit_above_computed_pressure_limit_rejected
