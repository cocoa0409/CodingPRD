          setup: "Hall CX76 in FIT_OUT (cooling_redundancy N) with both PDUs commissioned, BW-A1/BW-B1 ENERGIZED, zone CA-1 at PASS with measured leakage 5.00 percent, and rack R-1-1 (design 15.00 kW, two RESERVED 7.50 kW feeds) INSTALLED. CU-1 is rated 20.00 kW with design airflow 3000 CFM and supply delta-T 12.0 F but is still INSTALLED."
