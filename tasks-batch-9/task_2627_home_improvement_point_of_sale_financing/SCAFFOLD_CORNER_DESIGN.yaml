          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_PROJECT_NOT_FOUND]
        distinguishing_aspect: "Posting a milestone with release_pct_bps missing under a project id that does not exist violates priority 3 and priority 5 simultaneously; the answer is ERR_INVALID_REQUEST (400), and only after the body is repaired does the same call surface ERR_PROJECT_NOT_FOUND (404) — a P+N rule may never mask a P rule."
        test_recipe:
          setup:
            - "Empty system apart from the operator identities; no Project rows exist."
          setup_api_calls:
            - call: "GET /projects"
              as: ServicingAgent
              as_user_id: "sa-1"
          trigger:
            - call: "POST /projects/11111111-1111-4111-8111-111111111111/milestones"
              payload: { sequence_no: 1, name: "Tear-off" }
              as: Merchant
              as_user_id: "88888888-8888-4888-8888-888888888888"
            - call: "POST /projects/11111111-1111-4111-8111-111111111111/milestones"
              payload: { sequence_no: 1, name: "Tear-off", release_pct_bps: 3000 }
              as: Merchant
              as_user_id: "88888888-8888-4888-8888-888888888888"
          assert:
            - "TRIGGER 1: HTTP 400 with data.error_id == ERR_INVALID_REQUEST (release_pct_bps missing) — NOT 404 and NOT 403"
            - "TRIGGER 2: with the body repaired the same unknown path now yields HTTP 403 ERR_IDENTITY_UNKNOWN or, once a real merchant identity is supplied, HTTP 404 ERR_PROJECT_NOT_FOUND — either way the existence band is strictly later than the schema band"
