          assert:
            - "Before lapse: WocNurse.${n1_id}.certification_status == CERTIFIED, max_consult_load == 8 (MAX_LOAD_BY_CERT[CERTIFIED]), competency_signoff_count == 2, certification_eligibility_score == 64.00"
            - "After lapse: HTTP 200, certification_status == LAPSED and max_consult_load == 0 (MAX_LOAD_BY_CERT[LAPSED])"
            - "After lapse: active_consult_load == 0 and ce_credits == 30 — lapsing changes neither"
            - "After re-certify: HTTP 200, certification_status == CERTIFIED again, max_consult_load == 8, cert_expires_at == 2029-08-01T00:00:00Z (overwritten, not preserved)"
            - "certification_eligibility_score == 64.00 at all three checkpoints — the certification dimension does not feed the score"
            - "state_machines.WocNurse declares terminal_states as the empty list, so no WocNurse state locks the row"

      - name: retire_surface_with_live_order_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.SupportSurface.AVAILABLE_to_RETIRED
          - validations[priority=17]
          - errors[ERR_RESOURCE_NOT_ACTIVE]
        distinguishing_aspect: "The retire guard is not about the surface's own status (AVAILABLE would allow it) but about the existence of any order in {REQUESTED, APPROVED, DELIVERED} — so a merely REQUESTED order that has never touched the asset still blocks retirement, and denying that order unblocks it."
        test_recipe:
          setup:
            - "Unit 3E exists with cap 500000 and ADMITTED patient MRN-G9."
            - "SupportSurface BED-080 is AVAILABLE at daily_rate_cents 10000."
            - "Order O1 for MRN-G9 on BED-080 covering 2026-08-01..2026-08-04 is still REQUESTED."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "3E", name: "Three East", bed_count: 18, rental_budget_cap_cents: 500000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-G9", unit_id: "${u1_id}", admitted_at: "2026-07-31T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /support-surfaces"
              payload: { asset_tag: "BED-080", surface_class: "ALTERNATING_PRESSURE", daily_rate_cents: 10000, vendor_name: "AirBeds Inc" }
              as: MaterialsCoordinator
              captures: { s1_id: "$.data.id" }
            - call: "POST /support-surface-orders"
              payload: { patient_id: "${p1_id}", unit_id: "${u1_id}", support_surface_id: "${s1_id}", rental_start: "2026-08-01T00:00:00Z", rental_end: "2026-08-04T00:00:00Z", authorized_days: 3 }
              as: MaterialsCoordinator
              captures: { o1_id: "$.data.id" }
          trigger:
            - call: "POST /support-surfaces/${s1_id}/retire"
              payload: { reason: "Vendor recall." }
              as: MaterialsCoordinator
              captures: { err_id: "$.data.error_id" }
            - call: "POST /support-surface-orders/${o1_id}/deny"
              payload: { denial_reason: "Asset being recalled." }
              as: MaterialsCoordinator
            - call: "POST /support-surfaces/${s1_id}/retire"
              payload: { reason: "Vendor recall." }
              as: MaterialsCoordinator
          assert:
            - "The first retire returns HTTP 409 with data.error_id == ERR_RESOURCE_NOT_ACTIVE even though SupportSurface.${s1_id}.status == AVAILABLE"
            - "SupportSurface.${s1_id}.status == AVAILABLE after the refused retire"
            - "After deny: SupportSurfaceOrder.${o1_id}.fulfillment_status == DENIED, billing_status == UNBILLED, denial_reason == \"Asset being recalled.\""
            - "Unit.${u1_id}.rental_encumbered_cents == 0 and rental_released_cents == 0 — denying a never-approved order moves no money"
            - "The second retire returns HTTP 200 and SupportSurface.${s1_id}.status == RETIRED"
            - "SupportSurface.${s1_id}.occupied_until == null and available_from == null — the asset was never approved onto"

      - name: reconcile_before_return_rejected_on_billing_dimension
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.SupportSurfaceOrder[dimension=billing_status].COMMITTED_to_RECONCILED
          - validations[priority=13]
          - errors[ERR_ORDER_INVALID_BILLING_STATE]
        distinguishing_aspect: "reconcile is guarded on the BILLING dimension only: it is refused at ENCUMBERED both before and after delivery — proving the fulfillment dimension's progress is irrelevant — and accepted only once the return has moved billing to COMMITTED."
        test_recipe:
          setup:
            - "Unit 3E exists with cap 500000 and ADMITTED patient MRN-H1."
            - "SupportSurface BED-081 is AVAILABLE at daily_rate_cents 10000."
            - "Order O1 covers 2026-08-01T00:00:00Z..2026-08-04T00:00:00Z with authorized_days 3 and has been APPROVED, so it sits at (APPROVED, ENCUMBERED)."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "3E", name: "Three East", bed_count: 18, rental_budget_cap_cents: 500000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
