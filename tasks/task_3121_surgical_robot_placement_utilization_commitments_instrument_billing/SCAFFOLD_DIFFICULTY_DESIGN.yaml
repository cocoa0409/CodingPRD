              payload: { expected_case_version: "${blocker_v}" }
              as: HospitalProcurementOfficer
              as_user_id: "hpo-1"
          assert:
            - "ProcedureCase.${blocker}.case_status == CANCELLED"
            - "booking a replacement case at 2026-09-10T08:00:00Z for 120 minutes SUCCEEDS with 201, because the cancelled sibling contributes no occupancy and the conflict candidate set is empty"
            - "the replacement is accepted even though its buffered occupancy [2026-09-10T08:00:00Z, 2026-09-10T10:30:00Z) is exactly the interval the cancelled blocker held, so the closure is on case_status IN {SCHEDULED, COMPLETED} and not on row existence"
