            - { call: "POST /briefs/${br1}/publish", payload: {}, as: BrandManager, captures: { br1_v: $.data.version } }
            - { call: "POST /briefs", payload: { brand_id: "${b2}", title: "B", niche: "FINANCE", min_followers: 1000, min_engagement_bps: 50, slots_total: 1, budget_cents: 100000000, deliverables_per_slot: 1, usage_rights_days: 30, exclusivity_category: "FINTECH", exclusivity_days: 30, whitelisting_required: false, revision_rounds_included: 2, submission_window_start: "2026-08-01T00:00:00Z", submission_window_end: "2026-08-31T23:59:59Z", content_window_start: "2026-08-01T00:00:00Z", content_window_end: "2026-10-31T23:59:59Z" }, as: BrandManager, captures: { br2: $.data.id } }
            - { call: "POST /briefs/${br2}/publish", payload: {}, as: BrandManager, captures: { br2_v: $.data.version } }
            - { call: "POST /briefs/${br1}/pitches", payload: { creator_id: "${c_id}", proposed_fee_cents: 100000, concept_note: "a", expected_brief_version: "${br1_v}" }, as: TalentManager, captures: { p1: $.data.id } }
