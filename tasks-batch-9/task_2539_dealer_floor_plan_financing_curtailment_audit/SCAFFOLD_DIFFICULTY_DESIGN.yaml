  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: curtailment_tier_half_open_intervals_allow_touching_endpoints_per_class
        grounds:
          - validations[priority=93]
          - validations[priority=94]
          - errors.ERR_TIER_INTERVAL_OVERLAP
          - entities.CurtailmentTier.fields.age_days_from
          - entities.CurtailmentTier.fields.age_days_to
          - endpoints["POST /floorplan/credit-lines/{id}/curtailment-tiers"]
        distinguishing_aspect: |
          The shared resource is a CreditLine PARTITIONED BY inventory_class, and the
          interval convention is HALF-OPEN [from, to): touching endpoints are legal
          (180 may start a tier that ends at 180), an unbounded age_days_to == null tail
          may exist only once per (line, class), and the same [90,180) span is legal again
          under a different class. This is the deliberate mirror image of the audit-window
          instance, which uses CLOSED intervals where touching collides.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Dealer with one CreditLine in PENDING (tiers may be loaded before activation is irrelevant here; the line is activated first so the priority 61 check passes)."
            - "No CurtailmentTier rows exist yet on the line."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "u-sys-1"
            - call: "POST /floorplan/dealers"
              payload: { legal_name: "Interval Ladder Motors LLC", franchise_type: "FRANCHISE_NEW_CAR", state_code: "WY" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { d17: "$.data.id" }
            - call: "POST /floorplan/credit-lines"
              payload: { dealer_id: "${d17}", credit_limit_cents: 500000000, advance_rate_bps_new: 10000, advance_rate_bps_used: 9000, advance_rate_bps_demonstrator: 8500, max_unit_advance_cents_new: 20000000, max_unit_advance_cents_used: 10000000, max_unit_advance_cents_demonstrator: 10000000, class_sublimit_cents_used: 100000000, class_sublimit_cents_demonstrator: 50000000, curtailment_grace_days: 5 }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { cl17: "$.data.id" }
            - call: "POST /floorplan/credit-lines/${cl17}/curtailment-tiers"
              payload: { inventory_class: "NEW", age_days_from: 90, age_days_to: 180, cumulative_paydown_bps: 1000 }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { t17a: "$.data.id" }
            - call: "POST /floorplan/credit-lines/${cl17}/activate"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
          trigger:
            - call: "POST /floorplan/credit-lines/${cl17}/curtailment-tiers"
              payload: { inventory_class: "NEW", age_days_from: 180, age_days_to: 270, cumulative_paydown_bps: 2500 }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { t17b: "$.data.id" }
            - call: "POST /floorplan/credit-lines/${cl17}/curtailment-tiers"
              payload: { inventory_class: "NEW", age_days_from: 170, age_days_to: 200, cumulative_paydown_bps: 3000 }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { err17a: "$.data.error_id" }
            - call: "POST /floorplan/credit-lines/${cl17}/curtailment-tiers"
              payload: { inventory_class: "NEW", age_days_from: 270, age_days_to: null, cumulative_paydown_bps: 5000 }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { t17c: "$.data.id" }
            - call: "POST /floorplan/credit-lines/${cl17}/curtailment-tiers"
              payload: { inventory_class: "NEW", age_days_from: 400, age_days_to: null, cumulative_paydown_bps: 7500 }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { err17b: "$.data.error_id" }
            - call: "POST /floorplan/credit-lines/${cl17}/curtailment-tiers"
              payload: { inventory_class: "USED", age_days_from: 90, age_days_to: 180, cumulative_paydown_bps: 1500 }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { t17d: "$.data.id" }
            - call: "POST /floorplan/credit-lines/${cl17}/curtailment-tiers"
              payload: { inventory_class: "USED", age_days_from: 200, age_days_to: 150, cumulative_paydown_bps: 2000 }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { err17c: "$.data.error_id" }
          assert:
            - "Tier [180,270) is accepted with 201 even though tier [90,180) ends at 180 - half-open intervals permit touching endpoints"
            - "Tier [170,200) returns 409 and ${err17a} == \"ERR_TIER_INTERVAL_OVERLAP\" because it straddles both existing NEW tiers"
            - "Tier [270,null) is accepted with 201 as the single unbounded tail for (line, NEW)"
            - "Tier [400,null) returns 409 and ${err17b} == \"ERR_TIER_INTERVAL_OVERLAP\" because 400 falls inside the existing unbounded tail"
            - "USED tier [90,180) is accepted with 201 - the same span is free under a different inventory_class, so the resource is keyed on (credit_line_id, inventory_class)"
            - "USED tier [200,150) returns 422 ERR_TIER_INTERVAL_INVALID and ${err17c} == \"ERR_TIER_INTERVAL_INVALID\" because age_days_to must be strictly greater than age_days_from"
            - "GET /floorplan/credit-lines/${cl17}/curtailment-tiers?inventory_class=NEW returns exactly the three ids ${t17a}, ${t17b}, ${t17c} ordered by age_days_from ASC"
            - "GET /floorplan/credit-lines/${cl17}/curtailment-tiers?inventory_class=USED returns exactly one row, ${t17d}"

      - name: audit_windows_are_closed_intervals_and_unannounced_needs_a_fourteen_day_gap
        grounds:
          - validations[priority=92]
          - validations[priority=95]
          - validations[priority=96]
          - validations[priority=97]
          - errors.ERR_AUDIT_WINDOW_OVERLAP
          - errors.ERR_AUDIT_GAP_TOO_SHORT
          - global_constants.AUDIT_NOTICE_DAYS
          - global_constants.MIN_UNANNOUNCED_GAP_DAYS
        distinguishing_aspect: |
          The shared resource is a DEALER's calendar and the convention is CLOSED
          [start, end], so touching endpoints DO collide - the exact opposite of the
          curtailment-tier ladder - and a second, independent temporal constraint stacks
          on top: an UNANNOUNCED audit must sit at least MIN_UNANNOUNCED_GAP_DAYS after
          the most recent RECONCILED audit's window_end_date, measured from a reconciled
          window rather than from the clock.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE Dealer with an ACTIVE CreditLine and NO inventory units, so audits can be reconciled clean without observations."
            - "No FloorPlanAudit exists yet for this dealer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "u-sys-1"
            - call: "POST /floorplan/dealers"
