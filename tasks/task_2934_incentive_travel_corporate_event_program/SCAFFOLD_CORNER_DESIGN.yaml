  - name: destination_inspection_and_shortlisting_transitions_fire_with_their_side_effects
    claim_type: valid_transition
    grounds:
    - §1.2 Destination.inspection_status NOT_INSPECTED -> INSPECTED (side_effects)
    - §1.2 Destination.status CANDIDATE -> SHORTLISTED
    - §1.5 POST /destinations/{destination_id}/site-inspection, POST /destinations/{destination_id}/shortlist
    distinguishing_aspect: |-
      The site-inspection call must move only the inspection_status dimension and stamp inspection_score, inspected_by_user_id and inspected_at from the logical clock, and the shortlist call must then move only the status dimension — each transition incrementing version by exactly one and leaving the other dimension where it was.
