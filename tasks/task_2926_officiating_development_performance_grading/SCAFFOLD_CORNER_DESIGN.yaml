        distinguishing_aspect: "POST /games/{id}/mark-played executes both declared side effects in one call: every CONFIRMED assignment becomes COMPLETED and every INITIATED review on the game EXPIRES with decision null, releasing the station's capacity."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1 and replay_decision_limit_seconds 120."
            - "Game G1 is IN_PROGRESS with Dan's CONFIRMED assignment."
