      - name: body_foreign_keys_are_resolved_in_the_declared_field_order
        claim_type: parent_relationships
        grounds:
          - validations[priority=5]
          - entities.WaterSupplyEvaluation.fields.project_id
          - entities.WaterSupplyEvaluation.fields.flow_test_id
          - errors.ERR_PROJECT_NOT_FOUND
          - errors.ERR_FLOW_TEST_NOT_FOUND
        distinguishing_aspect: |
          POST /water-supply-evaluations declares project_id before flow_test_id, so a request with
          BOTH unknown returns ERR_PROJECT_NOT_FOUND and only after the project resolves does the
          unknown flow test surface as ERR_FLOW_TEST_NOT_FOUND. A server validating in an arbitrary
          order returns the wrong error_id for the first request.
        test_recipe:
          setup:
            - "Project FP-2601 exists with flow test H-14; no water supply evaluation exists"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e1: $.data.id }
            - call: "POST /ahj-reviewers"
