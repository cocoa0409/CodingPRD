scenario: |
  95. Hospital Revenue Cycle Management (HRCM): admission registration, insurance
  eligibility verification, charge capture, ICD-10/CPT coding, payer clearance,
  patient responsibility (Deductible/Coinsurance/OOP Max), bad debt write-off
domain_name: hospital-revenue-cycle
api_prefix: ""   # flat topology: multiple top-level collections (/encounters, /payers, /patients, /claims, ...)

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by foreign keys. Encounter is the central account; Payer,
  # InsurancePolicy, BenefitAccumulator, Charge, CodingAssignment, Claim, ClaimLine,
  # PatientStatement, Payment, WriteOff reference one another by FK rather than nest
  # in URL paths. No strict ownership tree; URLs are flat collections with id paths.

  state_machine_shape: branching
  # Claim carries a branching/cyclic shape: a DENIED claim may be CORRECTED back to a
  # resubmittable state (revision loop) or APPEALED; adjudication forks PAID / DENIED /
  # PARTIALLY_PAID with divergent side-effect sets. CodingAssignment forks on audit.

  relationship_patterns:
    - one_to_many       # Encounter has many Charge, Claim; Claim has many ClaimLine
    - flat_references   # InsurancePolicy -> Patient, Payer; Claim -> Encounter, InsurancePolicy
    - cross_aggregate   # Claim adjudication mutates BenefitAccumulator across aggregate boundary

  role_model: segregation_of_duties
  # Registrar registers and captures charges; Coder assigns/finalizes ICD-10/CPT codes;
  # BillingSpecialist submits claims and bills patients; FinanceManager approves bad-debt
  # write-offs. The user who finalized coding on an encounter MUST NOT be the user who
  # approves a write-off on that same encounter's statement (segregation of duties).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Payer
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, identity only
      - name: name
        type: string
        source: input
        description: payer/insurance company name
        constraints: non-empty, max 120 chars
      - name: payer_type
        type: enum
        source: input
        description: category of payer
        constraints: one of {COMMERCIAL, MEDICARE, MEDICAID, SELF_PAY}
      - name: timely_filing_days
        type: integer
        source: input
        description: number of days after discharge within which a claim must be submitted; claims submitted later are denied for timely filing
        constraints: integer, 1..365
        default: 90
      - name: appeal_window_days
        type: integer
        source: input
        description: number of days after a denial within which an appeal may be filed
        constraints: integer, 1..180
        default: 30
      - name: active
        type: boolean
        source: input
        description: whether the payer accepts new claims; inactive payers reject claim submission
        default: true

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, identity only
      - name: full_name
        type: string
        source: input
        description: patient legal name
        constraints: non-empty, max 120 chars
      - name: date_of_birth
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD)
        constraints: valid past date
      - name: financial_class
        type: enum
        source: input
        description: how the account is expected to settle
        constraints: one of {INSURED, SELF_PAY, CHARITY}
        default: INSURED

  - name: InsurancePolicy
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, identity only
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the covered patient"
      - name: payer_id
        type: string
        source: input
        description: "FK -> Payer.id; the paying insurer"
      - name: member_number
        type: string
        source: input
        description: insurer-side member identifier
        constraints: non-empty
      - name: plan_year
        type: integer
        source: input
        description: benefit year the policy terms apply to
        constraints: integer, 2000..2100
      - name: deductible_cents
        type: integer
        source: input
        description: annual individual deductible the patient must meet before coinsurance applies
        constraints: integer >= 0
      - name: coinsurance_pct
        type: number
        source: input
        description: patient coinsurance share (0.0-1.0) applied to allowed amount after the deductible is met
        constraints: 0.0 <= x <= 1.0
      - name: oop_max_cents
        type: integer
        source: input
        description: annual out-of-pocket maximum; once the patient's YTD out-of-pocket reaches this, further patient responsibility on covered services is 0
        constraints: integer >= deductible_cents
      - name: status
        type: enum
        source: system
        description: verification lifecycle; only ACTIVE policies clear eligibility
        constraints: one of {UNVERIFIED, ACTIVE, TERMINATED}
        default: UNVERIFIED

  - name: BenefitAccumulator
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, identity only
      - name: policy_id
        type: string
        source: input
        description: "FK -> InsurancePolicy.id; the policy whose YTD benefits this row accumulates"
      - name: plan_year
        type: integer
        source: input
        description: benefit year this accumulator tracks
        constraints: integer, 2000..2100
      - name: deductible_met_cents
        type: integer
        source: computed
        description: YTD amount applied to the deductible; increased when a claim adjudication assigns deductible to the patient
        default: 0
        constraints: 0 <= x <= policy.deductible_cents
      - name: oop_met_cents
        type: integer
        source: computed
        description: YTD patient out-of-pocket (deductible + coinsurance) applied; increased on each claim adjudication, never exceeds policy.oop_max_cents
        default: 0
        constraints: 0 <= x <= policy.oop_max_cents

  - name: Encounter
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, identity only
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the registered patient"
      - name: policy_id
        type: string
        source: input
        description: "FK -> InsurancePolicy.id; the policy billed for this encounter; null for self-pay encounters"
        constraints: nullable
      - name: admission_at
        type: datetime
        source: input
        description: ISO 8601 UTC admission timestamp
      - name: discharge_at
        type: datetime
        source: system
        description: ISO 8601 UTC discharge timestamp, set when the encounter is discharged; null while open
        constraints: nullable
      - name: status
        type: enum
        source: system
        description: encounter account lifecycle
        constraints: one of {REGISTERED, ELIGIBILITY_VERIFIED, CHARGES_CAPTURED, CODED, BILLED, CLOSED}
        default: REGISTERED
      - name: total_charges_cents
        type: integer
        source: computed
        description: sum of Charge.amount_cents for this encounter's POSTED charges; recomputed on every charge post/void
        default: 0
      - name: patient_responsibility_cents
        type: integer
        source: computed
        description: final patient responsibility derived from the encounter's adjudicated claim; 0 until a claim is adjudicated
        default: 0
      - name: account_balance_cents
        type: integer
        source: computed
        description: outstanding patient balance = patient_responsibility_cents minus posted payments minus written-off amount; reconciled on every payment, adjudication, and write-off
        default: 0

  - name: EligibilityCheck
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, identity only
      - name: encounter_id
        type: string
        source: input
        description: "FK -> Encounter.id; the encounter eligibility was verified for"
      - name: policy_id
        type: string
        source: input
        description: "FK -> InsurancePolicy.id; the policy that was verified"
      - name: result
        type: enum
        source: system
        description: verification outcome
        constraints: one of {ELIGIBLE, INELIGIBLE}
      - name: estimated_patient_responsibility_cents
        type: integer
        source: computed
        description: forward-looking estimate of patient responsibility computed at verification time from the encounter's expected charges and the policy's current accumulators (see estimate_patient_responsibility)
        default: 0
      - name: checked_at
        type: datetime
        source: system
        description: ISO 8601 UTC timestamp of the eligibility check

  - name: Charge
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, identity only
      - name: encounter_id
        type: string
        source: input
        description: "FK -> Encounter.id; the encounter this charge belongs to"
      - name: cpt_code
        type: string
        source: input
        description: CPT/HCPCS procedure code for the billed service
        constraints: 5-character alphanumeric
      - name: units
        type: integer
        source: input
        description: number of service units
        constraints: integer >= 1
      - name: unit_price_cents
        type: integer
        source: input
        description: chargemaster price per unit
        constraints: integer >= 0
      - name: amount_cents
        type: integer
        source: computed
        description: units * unit_price_cents
        default: 0
      - name: status
        type: enum
        source: system
        description: charge lifecycle
        constraints: one of {POSTED, VOIDED}
        default: POSTED

  - name: CodingAssignment
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, identity only
      - name: encounter_id
        type: string
        source: input
        description: "FK -> Encounter.id; the encounter being coded (one coding assignment per encounter)"
      - name: principal_icd10
        type: string
        source: input
        description: principal ICD-10 diagnosis code
        constraints: ICD-10 format (letter + 2 digits, optional dot + up to 4)
      - name: secondary_icd10
        type: array
        source: input
        description: additional ICD-10 diagnosis codes
        default: []
      - name: status
        type: enum
        source: system
        description: coding lifecycle; forks to AUDIT_HOLD when compliance risk is high
        constraints: one of {DRAFT, FINALIZED, AUDIT_HOLD, CLEARED}
        default: DRAFT
      - name: finalized_by_user_id
        type: string
        source: system
        description: X-User-ID of the Coder who finalized this coding; null while DRAFT
        constraints: nullable
      - name: compliance_risk_score
        type: integer
        source: computed
        description: weighted coding-compliance risk score computed at finalize time; >= AUDIT_THRESHOLD routes the assignment to AUDIT_HOLD (see coding_compliance_risk)
        default: 0

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, identity only
      - name: encounter_id
        type: string
        source: input
        description: "FK -> Encounter.id; the encounter being billed"
      - name: policy_id
        type: string
        source: input
        description: "FK -> InsurancePolicy.id; the policy billed"
      - name: payer_id
        type: string
        source: input
        description: "FK -> Payer.id; the payer the claim is submitted to"
      - name: billed_amount_cents
        type: integer
        source: computed
        description: snapshot of encounter.total_charges_cents at submission time
        default: 0
      - name: allowed_amount_cents
        type: integer
        source: input
        description: payer-allowed amount supplied at adjudication; the contractual allowed total the patient responsibility is computed against
        constraints: integer >= 0; nullable until adjudicated
      - name: status
        type: enum
        source: system
        description: claim lifecycle (branching/cyclic)
        constraints: one of {SUBMITTED, PAID, PARTIALLY_PAID, DENIED, CORRECTED, APPEALED, VOID}
        default: SUBMITTED
      - name: denial_reason
        type: enum
        source: input
        description: reason supplied when the payer denies the claim
        constraints: one of {CODING_ERROR, NOT_COVERED, TIMELY_FILING, DUPLICATE}; null unless DENIED
      - name: submitted_at
        type: datetime
        source: system
        description: ISO 8601 UTC submission timestamp; used for timely-filing math against the encounter discharge
      - name: patient_responsibility_cents
        type: integer
        source: computed
        description: final patient responsibility computed at adjudication (see final_patient_responsibility); 0 until adjudicated
        default: 0

  - name: ClaimLine
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, identity only
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id; the claim this adjudicated line belongs to"
      - name: cpt_code
        type: string
        source: input
        description: CPT/HCPCS code being adjudicated
        constraints: 5-character alphanumeric
      - name: line_allowed_cents
        type: integer
        source: input
        description: payer-allowed amount for this line
        constraints: integer >= 0
      - name: line_paid_cents
        type: integer
        source: computed
        description: payer-paid portion of this line after patient responsibility (line_allowed_cents minus line patient responsibility)
        default: 0

  - name: PatientStatement
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, identity only
      - name: encounter_id
        type: string
        source: input
        description: "FK -> Encounter.id; the encounter being billed to the patient"
      - name: amount_due_cents
        type: integer
        source: computed
        description: snapshot of encounter.patient_responsibility_cents at issue time
        default: 0
      - name: amount_paid_cents
        type: integer
        source: computed
        description: total Payment.amount_cents posted against this statement
        default: 0
      - name: written_off_cents
        type: integer
        source: computed
        description: amount written off as bad debt
        default: 0
      - name: status
        type: enum
        source: system
        description: statement lifecycle ending in bad-debt write-off or settlement
        constraints: one of {ISSUED, PARTIALLY_PAID, PAID, IN_COLLECTIONS, WRITTEN_OFF}
        default: ISSUED
      - name: issued_at
        type: datetime
        source: system
        description: ISO 8601 UTC issue timestamp; bad-debt aging is measured from here

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, identity only
      - name: statement_id
        type: string
        source: input
        description: "FK -> PatientStatement.id; the statement the payment is applied to"
      - name: amount_cents
        type: integer
        source: input
        description: payment amount in cents
        constraints: integer >= 1
      - name: method
        type: enum
        source: input
        description: payment instrument
        constraints: one of {CARD, CASH, CHECK, EFT}
      - name: posted_at
        type: datetime
        source: system
        description: ISO 8601 UTC timestamp the payment was posted

  - name: WriteOff
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, identity only
      - name: statement_id
        type: string
        source: input
        description: "FK -> PatientStatement.id; the statement written off"
      - name: amount_cents
        type: integer
        source: computed
        description: amount written off = statement.amount_due_cents minus amount_paid_cents at write-off time
        default: 0
      - name: reason
        type: enum
        source: input
        description: write-off justification
        constraints: one of {BAD_DEBT, CHARITY, SMALL_BALANCE}
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the FinanceManager who approved the write-off
      - name: approved_at
        type: datetime
        source: system
        description: ISO 8601 UTC approval timestamp

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Encounter
    initial_state: REGISTERED
    terminal_states: [CLOSED]
    transitions:
      - from: REGISTERED
        to: ELIGIBILITY_VERIFIED
        trigger: "POST /encounters/{id}/eligibility-checks"
        actor: Registrar
        preconditions:
          - "encounter.status == REGISTERED"
          - "encounter.policy_id is not null"
          - "the referenced InsurancePolicy.status == ACTIVE"
        side_effects:
          - "create EligibilityCheck with result ELIGIBLE"
          - "compute EligibilityCheck.estimated_patient_responsibility_cents via estimate_patient_responsibility"
          - "set encounter.status = ELIGIBILITY_VERIFIED"
          - "increments Encounter.version by 1"
        note: "If the policy is not ACTIVE the check records INELIGIBLE and the encounter stays REGISTERED (see validations)."
      - from: ELIGIBILITY_VERIFIED
        to: CHARGES_CAPTURED
        trigger: "POST /encounters/{id}/discharge"
        actor: Registrar
        preconditions:
          - "encounter.status == ELIGIBILITY_VERIFIED"
          - "at least one Charge with status POSTED exists for the encounter"
        side_effects:
          - "set encounter.discharge_at = request clock time"
          - "set encounter.status = CHARGES_CAPTURED"
          - "recompute encounter.total_charges_cents from POSTED charges"
          - "increments Encounter.version by 1"
      - from: CHARGES_CAPTURED
        to: CODED
        trigger: "POST /coding-assignments/{id}/clear (cascade) or system on coding clearance"
        actor: system
        preconditions:
          - "encounter.status == CHARGES_CAPTURED"
          - "the encounter's CodingAssignment.status == CLEARED"
        side_effects:
          - "set encounter.status = CODED"
          - "increments Encounter.version by 1"
        note: "Driven as a bubble-up side effect of the CodingAssignment reaching CLEARED."
      - from: CODED
        to: BILLED
        trigger: "POST /claims/{id}/adjudicate (cascade)"
        actor: system
        preconditions:
          - "encounter.status == CODED"
          - "the encounter's Claim reached a terminal-adjudicated state (PAID, PARTIALLY_PAID, or DENIED)"
        side_effects:
          - "set encounter.patient_responsibility_cents = claim.patient_responsibility_cents"
          - "recompute encounter.account_balance_cents"
          - "set encounter.status = BILLED"
          - "increments Encounter.version by 1"
      - from: BILLED
        to: CLOSED
        trigger: "system on statement settlement or write-off"
        actor: system
        preconditions:
          - "encounter.status == BILLED"
          - "the encounter's PatientStatement.status in {PAID, WRITTEN_OFF}"
        side_effects:
          - "recompute encounter.account_balance_cents"
          - "set encounter.status = CLOSED"
          - "increments Encounter.version by 1"

  - entity: InsurancePolicy
    initial_state: UNVERIFIED
    terminal_states: [TERMINATED]
    transitions:
      - from: UNVERIFIED
        to: ACTIVE
        trigger: "POST /insurance-policies/{id}/verify"
        actor: Registrar
        preconditions:
          - "policy.status == UNVERIFIED"
          - "the referenced Payer.active == true"
        side_effects:
          - "set policy.status = ACTIVE"
          - "create the policy's BenefitAccumulator for policy.plan_year with deductible_met_cents=0, oop_met_cents=0"
          - "increments InsurancePolicy.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /insurance-policies/{id}/terminate"
        actor: Registrar
        preconditions:
          - "policy.status == ACTIVE"
          - "no Encounter referencing this policy is in status other than CLOSED"
        side_effects:
          - "set policy.status = TERMINATED"
          - "increments InsurancePolicy.version by 1"

  - entity: CodingAssignment
    initial_state: DRAFT
    terminal_states: [CLEARED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /coding-assignments/{id}/finalize"
        actor: Coder
        preconditions:
          - "coding.status == DRAFT"
          - "the encounter's status == CHARGES_CAPTURED"
          - "compliance_risk_score < AUDIT_THRESHOLD (else branch to AUDIT_HOLD)"
        side_effects:
          - "compute compliance_risk_score via coding_compliance_risk"
          - "set finalized_by_user_id = X-User-ID"
          - "set coding.status = FINALIZED"
          - "increments CodingAssignment.version by 1"
      - from: DRAFT
        to: AUDIT_HOLD
        trigger: "POST /coding-assignments/{id}/finalize"
        actor: Coder
        preconditions:
          - "coding.status == DRAFT"
          - "the encounter's status == CHARGES_CAPTURED"
          - "compliance_risk_score >= AUDIT_THRESHOLD"
        side_effects:
          - "compute compliance_risk_score via coding_compliance_risk"
          - "set finalized_by_user_id = X-User-ID"
          - "set coding.status = AUDIT_HOLD"
          - "increments CodingAssignment.version by 1"
        note: "Branch fork: same finalize trigger forks FINALIZED vs AUDIT_HOLD on the risk threshold."
      - from: AUDIT_HOLD
        to: DRAFT
        trigger: "POST /coding-assignments/{id}/return-for-recode"
        actor: Coder
        preconditions:
          - "coding.status == AUDIT_HOLD"
        side_effects:
          - "clear finalized_by_user_id (set null)"
          - "set coding.status = DRAFT"
          - "increments CodingAssignment.version by 1"
        note: "Revision loop: AUDIT_HOLD -> DRAFT lets the coder amend codes and re-finalize."
      - from: FINALIZED
        to: CLEARED
        trigger: "POST /coding-assignments/{id}/clear"
        actor: BillingSpecialist
        preconditions:
          - "coding.status == FINALIZED"
        side_effects:
          - "set coding.status = CLEARED"
          - "bubble up: set the encounter's status CHARGES_CAPTURED -> CODED"
          - "increments CodingAssignment.version by 1"

  - entity: Claim
    initial_state: SUBMITTED
    terminal_states: [PAID, PARTIALLY_PAID, VOID]
    transitions:
      - from: SUBMITTED
        to: PAID
        trigger: "POST /claims/{id}/adjudicate"
        actor: BillingSpecialist
        preconditions:
          - "claim.status in {SUBMITTED, CORRECTED, APPEALED}"
          - "request supplies allowed_amount_cents and a ClaimLine set summing to allowed_amount_cents"
          - "computed patient_responsibility_cents == 0 (fully covered by payer)"
        side_effects:
          - "set claim.allowed_amount_cents and create ClaimLine rows"
          - "compute claim.patient_responsibility_cents via final_patient_responsibility"
          - "increase the policy's BenefitAccumulator.deductible_met_cents and oop_met_cents by the patient's applied portions"
          - "set claim.status = PAID"
          - "cascade: encounter CODED -> BILLED with patient_responsibility_cents = 0"
          - "increments Claim.version by 1"
        note: "from: also covers CORRECTED and APPEALED (re-adjudication after the revision loop)."
      - from: SUBMITTED
        to: PARTIALLY_PAID
        trigger: "POST /claims/{id}/adjudicate"
        actor: BillingSpecialist
        preconditions:
          - "claim.status in {SUBMITTED, CORRECTED, APPEALED}"
          - "request supplies allowed_amount_cents and a ClaimLine set summing to allowed_amount_cents"
          - "computed patient_responsibility_cents > 0 (patient owes deductible and/or coinsurance)"
        side_effects:
          - "set claim.allowed_amount_cents and create ClaimLine rows"
          - "compute claim.patient_responsibility_cents via final_patient_responsibility"
          - "increase the policy's BenefitAccumulator.deductible_met_cents and oop_met_cents by the patient's applied portions"
          - "set claim.status = PARTIALLY_PAID"
          - "cascade: encounter CODED -> BILLED with patient_responsibility_cents = claim.patient_responsibility_cents"
          - "cascade: create a PatientStatement (status ISSUED) for the encounter"
          - "increments Claim.version by 1"
        note: "Adjudication forks PAID vs PARTIALLY_PAID on whether the patient owes anything; only PARTIALLY_PAID issues a statement. from: also covers CORRECTED and APPEALED."
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /claims/{id}/deny"
        actor: BillingSpecialist
        preconditions:
          - "claim.status in {SUBMITTED, CORRECTED, APPEALED}"
          - "request supplies a denial_reason"
        side_effects:
          - "set claim.denial_reason and claim.status = DENIED"
          - "cascade: encounter CODED -> BILLED with patient_responsibility_cents = encounter.total_charges_cents (full balance billed to patient on denial)"
          - "cascade: create a PatientStatement (status ISSUED) for the encounter"
          - "increments Claim.version by 1"
        note: "Branch fork: the same coded encounter forks PAID / PARTIALLY_PAID / DENIED with divergent cascade side-effect sets. from: also covers CORRECTED and APPEALED."
      - from: DENIED
        to: CORRECTED
        trigger: "POST /claims/{id}/correct"
        actor: BillingSpecialist
        preconditions:
          - "claim.status == DENIED"
          - "claim.denial_reason == CODING_ERROR"
        side_effects:
          - "set claim.status = CORRECTED"
          - "cascade: the PatientStatement cascaded on denial is set status WRITTEN_OFF -> not used; instead the denial statement is reversed: set statement.amount_due_cents = 0 and statement.status = PAID (closed with nothing owed) so the corrected claim can be re-adjudicated cleanly"
          - "cascade: recompute encounter.account_balance_cents = 0 and revert encounter.status BILLED -> CODED"
          - "increments Claim.version by 1"
        note: "Revision loop: a CODING_ERROR denial may be CORRECTED, re-opening the claim (CORRECTED -> SUBMITTED-equivalent) for re-adjudication. This is a depth-3 cascade: correct -> statement reversal -> encounter balance/status revert."
      - from: DENIED
        to: APPEALED
        trigger: "POST /claims/{id}/appeal"
        actor: BillingSpecialist
        preconditions:
          - "claim.status == DENIED"
          - "claim.denial_reason in {NOT_COVERED, TIMELY_FILING}"
          - "request clock time is within Payer.appeal_window_days of claim.submitted_at"
        side_effects:
          - "set claim.status = APPEALED"
          - "cascade: reverse the denial statement (set statement.amount_due_cents = 0, statement.status = PAID) and revert encounter.status BILLED -> CODED, recompute account_balance_cents = 0"
          - "increments Claim.version by 1"
        note: "Cyclic: APPEALED rejoins the adjudicable set (CORRECTED/APPEALED -> adjudicate) so the claim can be re-adjudicated after appeal."
      - from: SUBMITTED
        to: VOID
        trigger: "POST /claims/{id}/void"
        actor: BillingSpecialist
        preconditions:
          - "claim.status in {SUBMITTED, DENIED}"
          - "denial_reason == DUPLICATE when status == DENIED"
        side_effects:
          - "set claim.status = VOID"
          - "increments Claim.version by 1"
        note: "VOID terminal sink: duplicate claims are voided, not appealed."

  - entity: PatientStatement
    initial_state: ISSUED
    terminal_states: [PAID, WRITTEN_OFF]
    transitions:
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /patient-statements/{id}/payments"
        actor: BillingSpecialist
        preconditions:
          - "statement.status == ISSUED"
          - "payment.amount_cents < (statement.amount_due_cents - statement.amount_paid_cents)"
        side_effects:
          - "create Payment; increase statement.amount_paid_cents"
          - "recompute encounter.account_balance_cents"
          - "set statement.status = PARTIALLY_PAID"
      - from: ISSUED
        to: PAID
        trigger: "POST /patient-statements/{id}/payments"
        actor: BillingSpecialist
        preconditions:
          - "statement.status == ISSUED"
          - "payment.amount_cents >= (statement.amount_due_cents - statement.amount_paid_cents)"
        side_effects:
          - "create Payment; increase statement.amount_paid_cents"
          - "set statement.status = PAID"
          - "recompute encounter.account_balance_cents"
          - "bubble up: encounter BILLED -> CLOSED"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /patient-statements/{id}/payments"
        actor: BillingSpecialist
        preconditions:
          - "statement.status == PARTIALLY_PAID"
          - "payment.amount_cents >= (statement.amount_due_cents - statement.amount_paid_cents)"
        side_effects:
          - "create Payment; increase statement.amount_paid_cents"
          - "set statement.status = PAID"
          - "recompute encounter.account_balance_cents"
          - "bubble up: encounter BILLED -> CLOSED"
      - from: PARTIALLY_PAID
        to: IN_COLLECTIONS
        trigger: "POST /patient-statements/{id}/send-to-collections"
        actor: BillingSpecialist
        preconditions:
          - "statement.status in {ISSUED, PARTIALLY_PAID}"
          - "request clock time is at least BAD_DEBT_AGING_DAYS (= 120) days after statement.issued_at"
        side_effects:
          - "set statement.status = IN_COLLECTIONS"
      - from: ISSUED
        to: IN_COLLECTIONS
        trigger: "POST /patient-statements/{id}/send-to-collections"
        actor: BillingSpecialist
        preconditions:
          - "statement.status in {ISSUED, PARTIALLY_PAID}"
          - "request clock time is at least BAD_DEBT_AGING_DAYS (= 120) days after statement.issued_at"
        side_effects:
          - "set statement.status = IN_COLLECTIONS"
      - from: IN_COLLECTIONS
        to: WRITTEN_OFF
        trigger: "POST /patient-statements/{id}/write-off"
        actor: FinanceManager
        preconditions:
          - "statement.status == IN_COLLECTIONS"
          - "X-User-ID != the encounter's CodingAssignment.finalized_by_user_id (segregation of duties)"
        side_effects:
          - "create WriteOff with amount_cents = amount_due_cents - amount_paid_cents and approved_by_user_id = X-User-ID"
          - "set statement.written_off_cents = WriteOff.amount_cents"
          - "set statement.status = WRITTEN_OFF"
          - "recompute encounter.account_balance_cents to 0"
          - "bubble up: encounter BILLED -> CLOSED"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: claim-submit-stale-encounter
    parent_entity: Encounter
    write_endpoint: "POST /encounters/{id}/claims"
    occ_field: "expected_encounter_version"
    description: |
      Submitting a Claim against an Encounter whose version has advanced since the
      client last observed it is rejected as stale. This captures the case where the
      encounter has already been advanced to BILLED by another writer's claim
      submission (which legitimately supersedes the prior billing view), so the
      current writer's snapshot of the encounter is out of date.
    error_id: ERR_STALE_ENCOUNTER_VERSION
    http_status: 412

  - rule_id: writeoff-stale-statement
    parent_entity: PatientStatement
    write_endpoint: "POST /patient-statements/{id}/write-off"
    occ_field: "expected_patient_statement_version"
    description: |
      Approving a bad-debt write-off against a PatientStatement whose version has
      advanced since the FinanceManager last observed it is rejected as stale. This
      captures the case where a late patient payment has just been posted (advancing
      the statement and reducing the outstanding balance), so the write-off amount the
      manager intends to approve no longer reflects the statement.
    error_id: ERR_STALE_STATEMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: estimate_patient_responsibility
    trigger: "on Encounter REGISTERED -> ELIGIBILITY_VERIFIED (POST /encounters/{id}/eligibility-checks)"
    algorithm: forward_looking
    formula: |
      # Forward-looking estimate at verification time. Uses the encounter's EXPECTED
      # charges (current POSTED Charge total, which may still grow before discharge)
      # and the policy's CURRENT accumulators as the baseline.
      expected_allowed = encounter.total_charges_cents   # estimate assumes payer allows full charges
      remaining_deductible = max(0, policy.deductible_cents - accum.deductible_met_cents)
      deductible_portion = min(expected_allowed, remaining_deductible)
      after_deductible = expected_allowed - deductible_portion
      coinsurance_portion = round_half_up(after_deductible * policy.coinsurance_pct)
      raw_patient = deductible_portion + coinsurance_portion
      remaining_oop = max(0, policy.oop_max_cents - accum.oop_met_cents)
      estimated_patient_responsibility_cents = min(raw_patient, remaining_oop)
    input_set: "encounter.total_charges_cents over POSTED charges at check time; policy.deductible_cents, coinsurance_pct, oop_max_cents; accum.deductible_met_cents, oop_met_cents at check time"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents; coinsurance rounded half-up to whole cents"
    variants:
      - name: pre_discharge_estimate
        when: "computed at eligibility verification (encounter still open, charges may grow)"
        difference: "uses the in-flight POSTED-charge total as expected_allowed; the deductible/OOP baseline is the accumulator state at check time, BEFORE this encounter's own claim is adjudicated"

  - name: final_patient_responsibility
    trigger: "on Claim SUBMITTED/CORRECTED/APPEALED -> PAID / PARTIALLY_PAID (POST /claims/{id}/adjudicate)"
    algorithm: chronological
    formula: |
      # Chronological/actual at adjudication. Uses the payer-ALLOWED amount (not billed
      # charges) and processes deductible then coinsurance against the accumulator state
      # AT ADJUDICATION TIME, then caps at the remaining OOP. The accumulator is then
      # advanced by exactly the patient-applied portions (deductible + coinsurance),
      # never beyond oop_max.
      allowed = claim.allowed_amount_cents
      remaining_deductible = max(0, policy.deductible_cents - accum.deductible_met_cents)
      deductible_applied = min(allowed, remaining_deductible)
      after_deductible = allowed - deductible_applied
      coinsurance_raw = round_half_up(after_deductible * policy.coinsurance_pct)
      remaining_oop = max(0, policy.oop_max_cents - accum.oop_met_cents)
      # OOP cap is applied AFTER deductible+coinsurance are summed, then clipped:
      raw_patient = deductible_applied + coinsurance_raw
      patient_responsibility_cents = min(raw_patient, remaining_oop)
      # accumulator advance (side effect):
      accum.deductible_met_cents += deductible_applied
      accum.oop_met_cents += patient_responsibility_cents
    input_set: "claim.allowed_amount_cents; policy.deductible_cents, coinsurance_pct, oop_max_cents; accum.deductible_met_cents, oop_met_cents at adjudication time"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents; coinsurance rounded half-up; OOP cap applied to the summed deductible+coinsurance"
    variants:
      - name: actual_at_adjudication
        when: "computed at claim adjudication"
        difference: "uses claim.allowed_amount_cents (payer-allowed) instead of total billed charges, and the accumulator baseline reflects any earlier claims adjudicated this plan_year; identical encounter therefore yields a DIFFERENT patient number than estimate_patient_responsibility whenever allowed != billed or the accumulator moved between verification and adjudication"

  - name: coding_compliance_risk
    trigger: "on CodingAssignment DRAFT -> FINALIZED / AUDIT_HOLD (POST /coding-assignments/{id}/finalize)"
    algorithm: weighted_scoring
    formula: |
      # Weighted coding-compliance risk. Three weighted factors; >= AUDIT_THRESHOLD
      # routes to AUDIT_HOLD. Factors evaluated in this fixed order, summed.
      score = 0
      # factor 1: unspecified principal diagnosis (ICD-10 ending in '.9' or with no
      #           decimal extension) carries documentation risk
      if principal_icd10 has no decimal point OR principal_icd10 ends with '.9':
          score += W_UNSPECIFIED
      # factor 2: high secondary-code count inflates DRG; risk grows per extra code
      score += W_PER_SECONDARY * max(0, len(secondary_icd10) - SECONDARY_FREE_COUNT)
      # factor 3: charge-to-code mismatch — distinct CPT codes on POSTED charges
      #           that exceed the codes the assignment justifies
      distinct_charge_cpt = count(distinct cpt_code over POSTED charges of the encounter)
      if distinct_charge_cpt > (1 + len(secondary_icd10)):
          score += W_MISMATCH
      compliance_risk_score = score
    input_set: "coding.principal_icd10, coding.secondary_icd10; distinct POSTED-charge cpt_code count for the encounter"
    constants:
      W_UNSPECIFIED: 40
      W_PER_SECONDARY: 10
      SECONDARY_FREE_COUNT: 3
      W_MISMATCH: 35
      AUDIT_THRESHOLD: 50
    precision: "integer score"
    variants:
      - name: finalize_scoring
        when: "evaluated at finalize"
        difference: "factor order is fixed (unspecified, then per-secondary, then mismatch); the threshold compares with >= so a score of exactly 50 routes to AUDIT_HOLD"

  - name: encounter_total_charges
    trigger: "on Charge post/void (POST /encounters/{id}/charges, POST /charges/{id}/void) and Encounter discharge"
    algorithm: aggregation
    formula: |
      # Recompute on every charge mutation. Only POSTED charges count.
      total_charges_cents = sum(c.amount_cents for c in encounter.charges if c.status == POSTED)
      # each charge amount: amount_cents = units * unit_price_cents
    input_set: "Charge.amount_cents over charges of the encounter with status == POSTED (VOIDED excluded)"
    constants: {}
    precision: "integer cents; exact sum, no rounding"

  - name: account_balance
    trigger: "on Claim adjudication, on Payment post, on WriteOff approval (derived-field reconciliation)"
    algorithm: aggregation
    formula: |
      # Outstanding patient balance reconciled after every money movement.
      paid = sum(p.amount_cents for p in payments of the encounter's statement)
      written = statement.written_off_cents (0 if no statement or not written off)
      account_balance_cents = max(0, encounter.patient_responsibility_cents - paid - written)
    input_set: "encounter.patient_responsibility_cents; Payment.amount_cents posted against the statement; statement.written_off_cents"
    constants: {}
    precision: "integer cents; floored at 0"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role is permitted to call this endpoint per the RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every resource id in the path exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 4
    category: existence
    check: "every FK supplied in the body references an existing resource"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints accepting FK body fields"
  - priority: 5
    category: business_constraint
    check: "required body fields present and typed correctly; enum values in allowed set"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 6
    category: state
    check: "the target resource is in a state from which this transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: business_referential
    check: "the encounter referenced by an eligibility check / claim has a non-null policy_id"
    error_id: ERR_NO_POLICY_ON_ENCOUNTER
    http_status: 409
    applies_to: "POST /encounters/{id}/eligibility-checks, POST /encounters/{id}/claims"
  - priority: 8
    category: business_safety
    check: "the InsurancePolicy referenced for eligibility is ACTIVE; a non-ACTIVE policy yields an INELIGIBLE eligibility result and the encounter does not advance"
    error_id: ERR_POLICY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /encounters/{id}/eligibility-checks"
  - priority: 9
    category: business_safety
    check: "the FinanceManager approving a write-off is not the Coder who finalized the encounter's coding (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /patient-statements/{id}/write-off"
  - priority: 10
    category: business_temporal
    check: "a claim submission occurs within the payer's timely_filing_days measured from encounter.discharge_at; otherwise the claim is denied for timely filing"
    error_id: ERR_TIMELY_FILING_EXCEEDED
    http_status: 409
    applies_to: "POST /encounters/{id}/claims"
  - priority: 11
    category: business_temporal
    check: "an appeal is filed within Payer.appeal_window_days of claim.submitted_at"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /claims/{id}/appeal"
  - priority: 12
    category: business_temporal
    check: "a statement may be sent to collections only after BAD_DEBT_AGING_DAYS (= 120) days have elapsed since issued_at"
    error_id: ERR_AGING_NOT_MET
    http_status: 409
    applies_to: "POST /patient-statements/{id}/send-to-collections"
  - priority: 13
    category: business_constraint
    check: "the supplied ClaimLine set sums exactly to allowed_amount_cents at adjudication"
    error_id: ERR_CLAIM_LINES_MISMATCH
    http_status: 422
    applies_to: "POST /claims/{id}/adjudicate"
  - priority: 14
    category: business_constraint
    check: "a charge cannot be posted to an encounter that is not in REGISTERED or ELIGIBILITY_VERIFIED status (charges close at discharge)"
    error_id: ERR_CHARGES_CLOSED
    http_status: 409
    applies_to: "POST /encounters/{id}/charges"
  - priority: 15
    category: business_fiscal
    check: "a payment amount must not exceed the statement's outstanding balance (amount_due_cents - amount_paid_cents)"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /patient-statements/{id}/payments"
  - priority: 16
    category: business_fiscal
    check: "OCC: expected_<parent>_version in the body matches the parent's current version"
    error_id: ERR_STALE_ENCOUNTER_VERSION
    http_status: 412
    applies_to: "POST /encounters/{id}/claims"
  - priority: 17
    category: business_fiscal
    check: "OCC: expected_patient_statement_version matches the statement's current version"
    error_id: ERR_STALE_STATEMENT_VERSION
    http_status: 412
    applies_to: "POST /patient-statements/{id}/write-off"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Payer ----
  - method: POST
    path: "/payers"
    description: "create a payer"
    roles: [Registrar, BillingSpecialist]
    code: 201
    input: [name, payer_type, "timely_filing_days?", "appeal_window_days?", "active?"]
    output: Payer
    side_effects: []
  - method: GET
    path: "/payers/{id}"
    description: "fetch a payer"
    roles: [Registrar, BillingSpecialist, Coder, FinanceManager]
    code: 200
    input: []
    output: Payer
    side_effects: []

  # ---- Patient ----
  - method: POST
    path: "/patients"
    description: "register a patient master record"
    roles: [Registrar]
    code: 201
    input: [full_name, date_of_birth, "financial_class?"]
    output: Patient
    side_effects: []
  - method: GET
    path: "/patients/{id}"
    description: "fetch a patient"
    roles: [Registrar, BillingSpecialist, Coder, FinanceManager]
    code: 200
    input: []
    output: Patient
    side_effects: []

  # ---- InsurancePolicy ----
  - method: POST
    path: "/insurance-policies"
    description: "create an insurance policy for a patient"
    roles: [Registrar]
    code: 201
    input: [patient_id, payer_id, member_number, plan_year, deductible_cents, coinsurance_pct, oop_max_cents]
    output: InsurancePolicy
    side_effects: []
  - method: GET
    path: "/insurance-policies/{id}"
    description: "fetch an insurance policy (single-resource GET; defines the insurance-policies collection segment)"
    roles: [Registrar, BillingSpecialist, FinanceManager]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: []
  - method: GET
    path: "/insurance-policies"
    description: "list/filter insurance policies; reverse-reachability for InsurancePolicy.patient_id and InsurancePolicy.payer_id"
    roles: [Registrar, BillingSpecialist, FinanceManager]
    code: 200
    input: ["limit?", "offset?", "patient_id?", "payer_id?"]
    output: InsurancePolicy[]
    side_effects: []
  - method: POST
    path: "/insurance-policies/{id}/verify"
    description: "verify a policy and open its benefit accumulator"
    roles: [Registrar]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: ["policy.status -> ACTIVE", "create BenefitAccumulator", "increments InsurancePolicy.version by 1"]
  - method: POST
    path: "/insurance-policies/{id}/terminate"
    description: "terminate an active policy"
    roles: [Registrar]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: ["policy.status -> TERMINATED", "increments InsurancePolicy.version by 1"]

  # ---- BenefitAccumulator (reverse-reachability for policy_id FK) ----
  - method: GET
    path: "/benefit-accumulators/{id}"
    description: "fetch a benefit accumulator (single-resource GET; defines the benefit-accumulators collection segment)"
    roles: [Registrar, BillingSpecialist, FinanceManager]
    code: 200
    input: []
    output: BenefitAccumulator
    side_effects: []
  - method: GET
    path: "/benefit-accumulators"
    description: "list/filter benefit accumulators; reverse-reachability for BenefitAccumulator.policy_id"
    roles: [Registrar, BillingSpecialist, FinanceManager]
    code: 200
    input: ["limit?", "offset?", "policy_id?"]
    output: BenefitAccumulator[]
    side_effects: []

  # ---- Encounter ----
  - method: POST
    path: "/encounters"
    description: "register an admission (create encounter account)"
    roles: [Registrar]
    code: 201
    input: [patient_id, "policy_id?", admission_at]
    output: Encounter
    side_effects: ["encounter.status = REGISTERED"]
  - method: GET
    path: "/encounters/{id}"
    description: "fetch an encounter account (single-resource GET; defines the encounters collection segment)"
    roles: [Registrar, BillingSpecialist, Coder, FinanceManager]
    code: 200
    input: []
    output: Encounter
    side_effects: []
  - method: GET
    path: "/encounters"
    description: "list/filter encounters; reverse-reachability for Encounter.patient_id and Encounter.policy_id"
    roles: [Registrar, BillingSpecialist, Coder, FinanceManager]
    code: 200
    input: ["limit?", "offset?", "patient_id?", "policy_id?", "status?"]
    output: Encounter[]
    side_effects: []
  - method: POST
    path: "/encounters/{id}/discharge"
    description: "discharge an encounter, closing charge capture"
    roles: [Registrar]
    code: 200
    input: []
    output: Encounter
    side_effects: ["set discharge_at", "recompute total_charges_cents", "status -> CHARGES_CAPTURED", "increments Encounter.version by 1"]

  # ---- EligibilityCheck (sub-resource of encounter covers encounter_id; filtered list covers policy_id) ----
  - method: POST
    path: "/encounters/{id}/eligibility-checks"
    description: "verify insurance eligibility for the encounter and record an estimate"
    roles: [Registrar]
    code: 201
    input: []
    output: EligibilityCheck
    side_effects: ["create EligibilityCheck", "compute estimated_patient_responsibility_cents", "encounter.status REGISTERED -> ELIGIBILITY_VERIFIED", "increments Encounter.version by 1"]
  - method: GET
    path: "/encounters/{id}/eligibility-checks"
    description: "list eligibility checks for an encounter; reverse-reachability for EligibilityCheck.encounter_id"
    roles: [Registrar, BillingSpecialist, FinanceManager]
    code: 200
    input: ["limit?", "offset?"]
    output: EligibilityCheck[]
    side_effects: []
  - method: GET
    path: "/eligibility-checks/{id}"
    description: "fetch an eligibility check (single-resource GET; defines the eligibility-checks collection segment)"
    roles: [Registrar, BillingSpecialist, FinanceManager]
    code: 200
    input: []
    output: EligibilityCheck
    side_effects: []
  - method: GET
    path: "/eligibility-checks"
    description: "list/filter eligibility checks; reverse-reachability for EligibilityCheck.policy_id"
    roles: [Registrar, BillingSpecialist, FinanceManager]
    code: 200
    input: ["limit?", "offset?", "policy_id?"]
    output: EligibilityCheck[]
    side_effects: []

  # ---- Charge (sub-resource of encounter covers encounter_id) ----
  - method: POST
    path: "/encounters/{id}/charges"
    description: "capture a charge line on the encounter"
    roles: [Registrar]
    code: 201
    input: [cpt_code, units, unit_price_cents]
    output: Charge
    side_effects: ["amount_cents = units * unit_price_cents", "recompute encounter.total_charges_cents"]
  - method: GET
    path: "/encounters/{id}/charges"
    description: "list charges for an encounter; reverse-reachability for Charge.encounter_id"
    roles: [Registrar, BillingSpecialist, Coder, FinanceManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Charge[]
    side_effects: []
  - method: GET
    path: "/charges/{id}"
    description: "fetch a charge"
    roles: [Registrar, BillingSpecialist, Coder, FinanceManager]
    code: 200
    input: []
    output: Charge
    side_effects: []
  - method: POST
    path: "/charges/{id}/void"
    description: "void a posted charge"
    roles: [Registrar]
    code: 200
    input: []
    output: Charge
    side_effects: ["charge.status -> VOIDED", "recompute encounter.total_charges_cents"]

  # ---- CodingAssignment (sub-resource of encounter covers encounter_id) ----
  - method: POST
    path: "/encounters/{id}/coding-assignment"
    description: "create the coding assignment for an encounter (ICD-10/CPT coding)"
    roles: [Coder]
    code: 201
    input: [principal_icd10, "secondary_icd10?"]
    output: CodingAssignment
    side_effects: ["coding.status = DRAFT"]
  - method: GET
    path: "/encounters/{id}/coding-assignment"
    description: "list the coding assignment(s) for an encounter; reverse-reachability for CodingAssignment.encounter_id"
    roles: [Registrar, BillingSpecialist, Coder, FinanceManager]
    code: 200
    input: ["limit?", "offset?"]
    output: CodingAssignment[]
    side_effects: []
  - method: GET
    path: "/coding-assignments/{id}"
    description: "fetch a coding assignment"
    roles: [Registrar, BillingSpecialist, Coder, FinanceManager]
    code: 200
    input: []
    output: CodingAssignment
    side_effects: []
  - method: POST
    path: "/coding-assignments/{id}/finalize"
    description: "finalize coding; computes compliance risk and forks FINALIZED vs AUDIT_HOLD"
    roles: [Coder]
    code: 200
    input: []
    output: CodingAssignment
    side_effects: ["compute compliance_risk_score", "set finalized_by_user_id", "status -> FINALIZED or AUDIT_HOLD", "increments CodingAssignment.version by 1"]
  - method: POST
    path: "/coding-assignments/{id}/return-for-recode"
    description: "return an audit-held coding to DRAFT for re-coding"
    roles: [Coder]
    code: 200
    input: []
    output: CodingAssignment
    side_effects: ["clear finalized_by_user_id", "status AUDIT_HOLD -> DRAFT", "increments CodingAssignment.version by 1"]
  - method: POST
    path: "/coding-assignments/{id}/clear"
    description: "clear finalized coding for billing; advances the encounter to CODED"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: CodingAssignment
    side_effects: ["status FINALIZED -> CLEARED", "bubble up encounter CHARGES_CAPTURED -> CODED", "increments CodingAssignment.version by 1"]

  # ---- Claim (sub-resource of encounter covers encounter_id; filtered list covers policy_id, payer_id) ----
  - method: POST
    path: "/encounters/{id}/claims"
    description: "submit a claim for a coded encounter (payer clearance)"
    roles: [BillingSpecialist]
    code: 201
    input: [payer_id, expected_encounter_version]
    output: Claim
    side_effects: ["snapshot billed_amount_cents from encounter.total_charges_cents", "set submitted_at", "claim.status = SUBMITTED", "increments Encounter.version by 1"]
  - method: GET
    path: "/encounters/{id}/claims"
    description: "list claims for an encounter; reverse-reachability for Claim.encounter_id"
    roles: [Registrar, BillingSpecialist, FinanceManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Claim[]
    side_effects: []
  - method: GET
    path: "/claims/{id}"
    description: "fetch a claim (single-resource GET; defines the claims collection segment)"
    roles: [Registrar, BillingSpecialist, FinanceManager]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: GET
    path: "/claims"
    description: "list/filter claims; reverse-reachability for Claim.policy_id and Claim.payer_id"
    roles: [Registrar, BillingSpecialist, FinanceManager]
    code: 200
    input: ["limit?", "offset?", "policy_id?", "payer_id?", "status?"]
    output: Claim[]
    side_effects: []
  - method: POST
    path: "/claims/{id}/adjudicate"
    description: "adjudicate a claim; computes final patient responsibility and advances accumulators"
    roles: [BillingSpecialist]
    code: 200
    input: [allowed_amount_cents, claim_lines]
    output: Claim
    side_effects: ["create ClaimLine rows", "compute patient_responsibility_cents", "advance BenefitAccumulator", "status -> PAID or PARTIALLY_PAID", "cascade encounter -> BILLED", "cascade create PatientStatement on PARTIALLY_PAID", "increments Claim.version by 1"]
  - method: POST
    path: "/claims/{id}/deny"
    description: "deny a claim with a reason"
    roles: [BillingSpecialist]
    code: 200
    input: [denial_reason]
    output: Claim
    side_effects: ["set denial_reason", "status -> DENIED", "cascade encounter -> BILLED with full balance", "cascade create PatientStatement", "increments Claim.version by 1"]
  - method: POST
    path: "/claims/{id}/correct"
    description: "correct a coding-error denial, re-opening the claim for re-adjudication"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Claim
    side_effects: ["status DENIED -> CORRECTED", "cascade reverse the denial statement and revert encounter BILLED -> CODED", "increments Claim.version by 1"]
  - method: POST
    path: "/claims/{id}/appeal"
    description: "appeal a denied claim within the payer appeal window, re-opening it"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Claim
    side_effects: ["status DENIED -> APPEALED", "cascade reverse the denial statement and revert encounter BILLED -> CODED", "increments Claim.version by 1"]
  - method: POST
    path: "/claims/{id}/void"
    description: "void a duplicate or unsubmitted claim"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Claim
    side_effects: ["status -> VOID", "increments Claim.version by 1"]

  # ---- ClaimLine (sub-resource of claim covers claim_id) ----
  - method: GET
    path: "/claims/{id}/lines"
    description: "list adjudicated lines for a claim; reverse-reachability for ClaimLine.claim_id"
    roles: [Registrar, BillingSpecialist, FinanceManager]
    code: 200
    input: ["limit?", "offset?"]
    output: ClaimLine[]
    side_effects: []

  # ---- PatientStatement (sub-resource of encounter covers encounter_id) ----
  - method: GET
    path: "/encounters/{id}/patient-statements"
    description: "list patient statements for an encounter; reverse-reachability for PatientStatement.encounter_id"
    roles: [Registrar, BillingSpecialist, FinanceManager]
    code: 200
    input: ["limit?", "offset?"]
    output: PatientStatement[]
    side_effects: []
  - method: GET
    path: "/patient-statements/{id}"
    description: "fetch a patient statement (single-resource GET; defines the patient-statements collection segment)"
    roles: [Registrar, BillingSpecialist, FinanceManager]
    code: 200
    input: []
    output: PatientStatement
    side_effects: []
  - method: POST
    path: "/patient-statements/{id}/payments"
    description: "post a patient payment against a statement"
    roles: [BillingSpecialist]
    code: 201
    input: [amount_cents, method]
    output: Payment
    side_effects: ["create Payment", "increase amount_paid_cents", "recompute encounter.account_balance_cents", "status -> PARTIALLY_PAID or PAID", "bubble up encounter -> CLOSED on PAID"]
  - method: POST
    path: "/patient-statements/{id}/send-to-collections"
    description: "send an aged statement to collections"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: PatientStatement
    side_effects: ["status -> IN_COLLECTIONS"]
  - method: POST
    path: "/patient-statements/{id}/write-off"
    description: "approve a bad-debt write-off (FinanceManager, segregated from coder)"
    roles: [FinanceManager]
    code: 201
    input: [reason, expected_patient_statement_version]
    output: WriteOff
    side_effects: ["create WriteOff", "set written_off_cents", "status -> WRITTEN_OFF", "recompute encounter.account_balance_cents to 0", "bubble up encounter -> CLOSED"]

  # ---- Payment / WriteOff reverse-reachability (sub-resource of statement covers statement_id) ----
  - method: GET
    path: "/patient-statements/{id}/payments"
    description: "list payments posted against a statement; reverse-reachability for Payment.statement_id"
    roles: [Registrar, BillingSpecialist, FinanceManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Payment[]
    side_effects: []
  - method: GET
    path: "/patient-statements/{id}/write-offs"
    description: "list write-offs for a statement; reverse-reachability for WriteOff.statement_id"
    roles: [Registrar, BillingSpecialist, FinanceManager]
    code: 200
    input: ["limit?", "offset?"]
    output: WriteOff[]
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the server's current UTC clock for deterministic temporal tests"
    roles: [Registrar, BillingSpecialist, FinanceManager, Coder]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server current-time source set to to_iso8601 for all subsequent timestamp/temporal checks"]


# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "acting role not permitted for the endpoint"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "FinanceManager approving a write-off is the same user who finalized the encounter's coding"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "path resource id does not exist"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "body FK references a non-existent resource"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, or out-of-set enum value"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource not in a state from which the requested transition is defined"
  - id: ERR_NO_POLICY_ON_ENCOUNTER
    http: 409
    condition: "eligibility check or claim attempted on an encounter with null policy_id"
  - id: ERR_POLICY_NOT_ACTIVE
    http: 409
    condition: "eligibility verification against a policy whose status is not ACTIVE"
  - id: ERR_PAYER_INACTIVE
    http: 409
    condition: "claim submitted to a payer whose active flag is false, or policy verify against an inactive payer"
  - id: ERR_TIMELY_FILING_EXCEEDED
    http: 409
    condition: "claim submitted later than timely_filing_days after the encounter discharge"
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 409
    condition: "appeal filed after Payer.appeal_window_days from claim.submitted_at"
  - id: ERR_NOT_APPEALABLE
    http: 409
    condition: "appeal attempted on a denial whose reason is not NOT_COVERED or TIMELY_FILING"
  - id: ERR_NOT_CORRECTABLE
    http: 409
    condition: "correct attempted on a denial whose reason is not CODING_ERROR"
  - id: ERR_AGING_NOT_MET
    http: 409
    condition: "send-to-collections before BAD_DEBT_AGING_DAYS (= 120) days elapsed since issued_at"
  - id: ERR_CHARGES_CLOSED
    http: 409
    condition: "charge posted to an encounter past charge capture (not REGISTERED/ELIGIBILITY_VERIFIED)"
  - id: ERR_NO_CHARGES
    http: 409
    condition: "discharge attempted on an encounter with no POSTED charges"
  - id: ERR_CLAIM_LINES_MISMATCH
    http: 422
    condition: "adjudication claim_lines do not sum to allowed_amount_cents"
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "payment exceeds the statement outstanding balance"
  - id: ERR_CODING_NOT_CLEARED
    http: 409
    condition: "claim submission attempted before the encounter's coding is CLEARED (encounter not CODED)"
  - id: ERR_POLICY_IN_USE
    http: 409
    condition: "policy termination attempted while an open (non-CLOSED) encounter references it"
  - id: ERR_STALE_ENCOUNTER_VERSION
    http: 412
    condition: "expected_encounter_version does not match the encounter's current version"
  - id: ERR_STALE_STATEMENT_VERSION
    http: 412
    condition: "expected_patient_statement_version does not match the statement's current version"
  - id: ERR_VALIDATION_OUT_OF_RANGE
    http: 422
    condition: "numeric body field outside its allowed range (e.g., coinsurance_pct outside 0..1, oop_max_cents < deductible_cents)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Registrar
    description: "front-desk registration, eligibility verification, charge capture, discharge"
    identity: "opaque"
    exclusive_operations:
      - "POST /patients"
      - "POST /insurance-policies"
      - "POST /insurance-policies/{id}/verify"
      - "POST /insurance-policies/{id}/terminate"
      - "POST /encounters"
      - "POST /encounters/{id}/eligibility-checks"
      - "POST /encounters/{id}/charges"
      - "POST /charges/{id}/void"
      - "POST /encounters/{id}/discharge"
    shared_operations:
      - "GET (all read endpoints)"
      - "POST /payers"
      - "POST /_clock/set_current_utc"
  - name: Coder
    description: "assigns and finalizes ICD-10/CPT coding"
    identity: "opaque"
    exclusive_operations:
      - "POST /encounters/{id}/coding-assignment"
      - "POST /coding-assignments/{id}/finalize"
      - "POST /coding-assignments/{id}/return-for-recode"
    shared_operations:
      - "GET (read endpoints in scope)"
  - name: BillingSpecialist
    description: "clears coding for billing, submits/adjudicates claims, bills patients and posts payments"
    identity: "opaque"
    exclusive_operations:
      - "POST /coding-assignments/{id}/clear"
      - "POST /encounters/{id}/claims"
      - "POST /claims/{id}/adjudicate"
      - "POST /claims/{id}/deny"
      - "POST /claims/{id}/correct"
      - "POST /claims/{id}/appeal"
      - "POST /claims/{id}/void"
      - "POST /patient-statements/{id}/payments"
      - "POST /patient-statements/{id}/send-to-collections"
    shared_operations:
      - "GET (all read endpoints)"
      - "POST /payers"
      - "POST /_clock/set_current_utc"
  - name: FinanceManager
    description: "approves bad-debt write-offs; segregated from the coder who finalized the encounter"
    identity: "opaque"
    exclusive_operations:
      - "POST /patient-statements/{id}/write-off"
    shared_operations:
      - "GET (all read endpoints)"
      - "POST /_clock/set_current_utc"
