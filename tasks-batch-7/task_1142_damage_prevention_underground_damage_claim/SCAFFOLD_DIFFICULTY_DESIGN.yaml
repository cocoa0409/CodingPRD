# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1142: Damage Prevention & Underground Damage Claim Recovery
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7; 2 instances per §0.5 rule.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: fault_default_vs_adjudicated_shares_diverge
        grounds:
          - calculations.fault_share_default
          - calculations.allocation_distribution
          - entities.FaultAllocation.fields.basis
        distinguishing_aspect: |
          Fault-domain dual variant: identical case data priced under the
          RULE_DEFAULT table (MISMARK -> LOCATOR 7000 / EXCAVATOR 3000) versus an
          ADJUDICATED 5000/5000 split yields different per-party invoices
          (84000 vs 60000 for the locator) — same subject (fault shares), two
          valid algorithms, different money.
        test_recipe:
          setup:
            - "excavator ex1, locator loc1; one COMPLETED ticket T at '1 Main St' with a MARKED response from loc1"
            - "case A: GAS/MAJOR, occurred 2026-05-02T10:00:00Z, linked to T, one evidence item, INVESTIGATING (investigator inv-1), costs LABOR 10x9000 + MATERIAL 5x3000 (subtotal 120000), allocation RULE_DEFAULT MISMARK, PROPOSED then FINAL"
            - "case B: identical but allocation ADJUDICATED shares EXCAVATOR 5000 / LOCATOR 5000, FINAL"
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
            - { call: "POST /damage-recovery/locators", payload: { company_name: "MarkCo", contact_email: "m@x.com", contract_region: "R1" }, as: RecoveryManager, captures: { loc1: $.data.id } }
            - { call: "POST /damage-recovery/locate-tickets", payload: { excavator_id: "${ex1}", dig_site_address: "1 Main St", work_start_at: "2026-05-02T08:00:00Z", work_end_at: "2026-05-02T17:00:00Z" }, as: Excavator, as_user_id: "${ex1}", captures: { tck1: $.data.id } }
            - { call: "POST /damage-recovery/locate-responses", payload: { locate_ticket_id: "${tck1}", locator_id: "${loc1}", response_code: "MARKED", marks_completed_at: "2026-05-02T07:00:00Z" }, as: Locator, as_user_id: "${loc1}" }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "1 Main St", facility_type: "GAS", severity: "MAJOR", occurred_at: "2026-05-02T10:00:00Z", locate_ticket_id: "${tck1}" }, as: IntakeCoordinator, captures: { caseA: $.data.id } }
            - { call: "POST /damage-recovery/evidence-items", payload: { damage_case_id: "${caseA}", evidence_type: "PHOTO", captured_at: "2026-05-02T12:00:00Z", description: "scene" }, as: IntakeCoordinator }
            - { call: "POST /damage-recovery/damage-cases/${caseA}/begin-investigation", payload: {}, as: DamageInvestigator, as_user_id: "inv-1", captures: { caseA_v: $.data.version } }
            - { call: "POST /damage-recovery/fault-allocations", payload: { damage_case_id: "${caseA}", root_cause_code: "MISMARK", expected_damage_case_version: "${caseA_v}" }, as: DamageInvestigator, as_user_id: "inv-1", captures: { allocA: $.data.id } }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseA}", category: "LABOR", description: "crew", quantity: 10, unit_cost_cents: 9000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseA}", category: "MATERIAL", description: "pipe", quantity: 5, unit_cost_cents: 3000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/fault-allocations/${allocA}/propose", payload: {}, as: DamageInvestigator, as_user_id: "inv-1" }
            - { call: "POST /damage-recovery/fault-allocations/${allocA}/finalize", payload: {}, as: RecoveryManager, as_user_id: "mgr-1" }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "1 Main St", facility_type: "GAS", severity: "MAJOR", occurred_at: "2026-05-02T10:00:00Z", locate_ticket_id: "${tck1}" }, as: IntakeCoordinator, captures: { caseB: $.data.id } }
            - { call: "POST /damage-recovery/evidence-items", payload: { damage_case_id: "${caseB}", evidence_type: "PHOTO", captured_at: "2026-05-02T12:00:00Z", description: "scene" }, as: IntakeCoordinator }
            - { call: "POST /damage-recovery/damage-cases/${caseB}/begin-investigation", payload: {}, as: DamageInvestigator, as_user_id: "inv-1", captures: { caseB_v: $.data.version } }
            - { call: "POST /damage-recovery/fault-allocations", payload: { damage_case_id: "${caseB}", root_cause_code: "MISMARK", expected_damage_case_version: "${caseB_v}", shares: [ { party_type: "EXCAVATOR", party_id: "${ex1}", share_bp: 5000 }, { party_type: "LOCATOR", party_id: "${loc1}", share_bp: 5000 } ] }, as: DamageInvestigator, as_user_id: "inv-1", captures: { allocB: $.data.id } }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseB}", category: "LABOR", description: "crew", quantity: 10, unit_cost_cents: 9000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseB}", category: "MATERIAL", description: "pipe", quantity: 5, unit_cost_cents: 3000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/fault-allocations/${allocB}/propose", payload: {}, as: DamageInvestigator, as_user_id: "inv-1" }
            - { call: "POST /damage-recovery/fault-allocations/${allocB}/finalize", payload: {}, as: RecoveryManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "GET /damage-recovery/claim-invoices", payload: { damage_case_id: "${caseA}", debtor_id: "${loc1}" }, as: RecoveryManager, captures: { invA_loc: "$.data[0].invoiced_cents" } }
            - { call: "GET /damage-recovery/claim-invoices", payload: { damage_case_id: "${caseB}", debtor_id: "${loc1}" }, as: RecoveryManager, captures: { invB_loc: "$.data[0].invoiced_cents" } }
          assert:
            - "allocA.basis == RULE_DEFAULT and allocB.basis == ADJUDICATED"
            - "ClaimInvoice(caseA, debtor loc1).invoiced_cents == 84000"
            - "ClaimInvoice(caseB, debtor loc1).invoiced_cents == 60000"
            - "${invA_loc} != ${invB_loc}"
            - "ClaimInvoice(caseA, debtor ${ex1}).invoiced_cents == 36000 and ClaimInvoice(caseB, debtor ${ex1}).invoiced_cents == 60000"

      - name: invoice_actual_vs_standard_basis_diverge
        grounds:
          - calculations.claim_amount_basis
          - entities.ClaimInvoice.fields.invoiced_cents
          - entities.ClaimInvoice.fields.standard_basis_cents
        distinguishing_aspect: |
          Billing-domain dual variant (different subject from fault shares): the
          same two cost lines priced on the ACTUAL basis (submitted unit costs)
          produce invoiced_cents 120000, while the STANDARD basis (scheduled
          rates) produces standard_basis_cents 131250 on the same invoice row.
        test_recipe:
          setup:
            - "excavator ex1; case C: ELECTRIC/MAJOR, occurred 2026-05-03T09:00:00Z, one evidence, INVESTIGATING (inv-2)"
            - "costs: LABOR 10x9000 (103500) + MATERIAL 5x3000 (16500) -> actual subtotal 120000"
            - "allocation RULE_DEFAULT NO_TICKET (EXCAVATOR 10000), PROPOSED, FINAL -> one invoice"
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "9 Pine St", facility_type: "ELECTRIC", severity: "MAJOR", occurred_at: "2026-05-03T09:00:00Z" }, as: IntakeCoordinator, captures: { caseC: $.data.id } }
            - { call: "POST /damage-recovery/evidence-items", payload: { damage_case_id: "${caseC}", evidence_type: "MEASUREMENT", captured_at: "2026-05-03T10:00:00Z", description: "depth" }, as: IntakeCoordinator }
            - { call: "POST /damage-recovery/damage-cases/${caseC}/begin-investigation", payload: {}, as: DamageInvestigator, as_user_id: "inv-2", captures: { caseC_v: $.data.version } }
            - { call: "POST /damage-recovery/fault-allocations", payload: { damage_case_id: "${caseC}", root_cause_code: "NO_TICKET", expected_damage_case_version: "${caseC_v}" }, as: DamageInvestigator, as_user_id: "inv-2", captures: { allocC: $.data.id } }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseC}", category: "LABOR", description: "crew", quantity: 10, unit_cost_cents: 9000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseC}", category: "MATERIAL", description: "cable", quantity: 5, unit_cost_cents: 3000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/fault-allocations/${allocC}/propose", payload: {}, as: DamageInvestigator, as_user_id: "inv-2" }
            - { call: "POST /damage-recovery/fault-allocations/${allocC}/finalize", payload: {}, as: RecoveryManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "GET /damage-recovery/claim-invoices", payload: { damage_case_id: "${caseC}" }, as: RecoveryManager, captures: { inv_actual: "$.data[0].invoiced_cents", inv_standard: "$.data[0].standard_basis_cents" } }
          assert:
            - "ClaimInvoice.invoiced_cents == 120000"
            - "ClaimInvoice.standard_basis_cents == 131250"
            - "${inv_actual} != ${inv_standard}"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: cost_line_markup_cap_emergency_interaction
        grounds:
          - calculations.repair_cost_compilation
          - entities.CostLineItem.fields.line_total_cents
        distinguishing_aspect: |
          Mode (a): a single formula with >=3 inputs and non-linear interaction —
          category markup branch (LABOR 0.15), severity branch (CRITICAL x1.25),
          and a nested min() line cap: the same LABOR 30x12000 line totals 414000
          on a MAJOR case but is clamped to 500000 on a CRITICAL case
          (517500 uncapped).
        test_recipe:
          setup:
            - "excavator ex1; case M (MAJOR) and case C (CRITICAL), same site"
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "3 Elm St", facility_type: "GAS", severity: "MAJOR", occurred_at: "2026-05-04T09:00:00Z" }, as: IntakeCoordinator, captures: { caseM: $.data.id } }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "3 Elm St", facility_type: "GAS", severity: "CRITICAL", occurred_at: "2026-05-04T11:00:00Z" }, as: IntakeCoordinator, captures: { caseC: $.data.id } }
          trigger:
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseM}", category: "LABOR", description: "crew", quantity: 30, unit_cost_cents: 12000 }, as: ClaimsAdjuster, captures: { lineM_total: $.data.line_total_cents } }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseC}", category: "LABOR", description: "crew", quantity: 30, unit_cost_cents: 12000 }, as: ClaimsAdjuster, captures: { lineC_total: $.data.line_total_cents } }
          assert:
            - "CostLineItem(caseM).line_total_cents == 414000"
            - "CostLineItem(caseC).line_total_cents == 500000"
            - "${lineM_total} == 414000 and ${lineC_total} == 500000"

      - name: nested_rounding_per_line_then_allocate
        grounds:
          - calculations.allocation_distribution
          - calculations.repair_cost_compilation
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: scaffold pins
          round-per-line-then-sum (1151 + 1153 = 2304), NOT sum-then-round
          (2305); the second rounding stage happens only at share allocation
          (round AFTER multiply; largest share absorbs the remainder).
        test_recipe:
          setup:
            - "excavator ex1, locator loc1; case MINOR with two LABOR lines 1x1001 and 1x1003"
            - "ADUDICATED shares EXCAVATOR 3334 / LOCATOR 3333 / FACILITY_OWNER 3333; PROPOSED then FINAL"
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
            - { call: "POST /damage-recovery/locators", payload: { company_name: "MarkCo", contact_email: "m@x.com", contract_region: "R1" }, as: RecoveryManager, captures: { loc1: $.data.id } }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "7 Birch Rd", facility_type: "TELECOM", severity: "MINOR", occurred_at: "2026-05-05T09:00:00Z" }, as: IntakeCoordinator, captures: { caseR: $.data.id } }
            - { call: "POST /damage-recovery/evidence-items", payload: { damage_case_id: "${caseR}", evidence_type: "SKETCH", captured_at: "2026-05-05T10:00:00Z", description: "sketch" }, as: IntakeCoordinator }
            - { call: "POST /damage-recovery/damage-cases/${caseR}/begin-investigation", payload: {}, as: DamageInvestigator, as_user_id: "inv-1", captures: { caseR_v: $.data.version } }
            - { call: "POST /damage-recovery/fault-allocations", payload: { damage_case_id: "${caseR}", root_cause_code: "MISMARK", expected_damage_case_version: "${caseR_v}", shares: [ { party_type: "EXCAVATOR", party_id: "${ex1}", share_bp: 3334 }, { party_type: "LOCATOR", party_id: "${loc1}", share_bp: 3333 }, { party_type: "FACILITY_OWNER", party_id: null, share_bp: 3333 } ] }, as: DamageInvestigator, as_user_id: "inv-1", captures: { allocR: $.data.id } }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseR}", category: "LABOR", description: "l1", quantity: 1, unit_cost_cents: 1001 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseR}", category: "LABOR", description: "l2", quantity: 1, unit_cost_cents: 1003 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/fault-allocations/${allocR}/propose", payload: {}, as: DamageInvestigator, as_user_id: "inv-1" }
            - { call: "POST /damage-recovery/fault-allocations/${allocR}/finalize", payload: {}, as: RecoveryManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "GET /damage-recovery/damage-cases/${caseR}", payload: {}, as: RecoveryManager, captures: { sub: $.data.subtotal_cents } }
            - { call: "GET /damage-recovery/claim-invoices", payload: { damage_case_id: "${caseR}" }, as: RecoveryManager }
          assert:
            - "DamageCase.subtotal_cents == 2304"
            - "every ClaimInvoice of caseR has invoiced_cents == 768"
            - "sum(ClaimInvoice.invoiced_cents over caseR) == 2304 == DamageCase.subtotal_cents"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: damage_case_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.DamageCase
          - entities.DamageCase.fields.investigation_status
          - entities.DamageCase.fields.recovery_status
        distinguishing_aspect: |
          Parallel state dimensions on ONE entity: adding a cost line moves
          recovery_status UNBILLED -> COSTING while investigation_status stays
          REPORTED; adding evidence then moves investigation REPORTED ->
          DOCUMENTING with recovery untouched at COSTING.
        test_recipe:
          setup:
            - "excavator ex1; fresh case (REPORTED / UNBILLED)"
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "2 Cedar Ln", facility_type: "WATER", severity: "MINOR", occurred_at: "2026-05-06T09:00:00Z" }, as: IntakeCoordinator, captures: { caseP: $.data.id, inv0: $.data.investigation_status, rec0: $.data.recovery_status } }
          trigger:
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseP}", category: "EQUIPMENT", description: "vac truck", quantity: 2, unit_cost_cents: 20000 }, as: ClaimsAdjuster }
            - { call: "GET /damage-recovery/damage-cases/${caseP}", payload: {}, as: RecoveryManager, captures: { inv1: $.data.investigation_status, rec1: $.data.recovery_status } }
            - { call: "POST /damage-recovery/evidence-items", payload: { damage_case_id: "${caseP}", evidence_type: "PHOTO", captured_at: "2026-05-06T10:00:00Z", description: "scene" }, as: IntakeCoordinator }
            - { call: "GET /damage-recovery/damage-cases/${caseP}", payload: {}, as: RecoveryManager, captures: { inv2: $.data.investigation_status, rec2: $.data.recovery_status } }
          assert:
            - "initial: ${inv0} == REPORTED and ${rec0} == UNBILLED"
            - "after cost line: ${inv1} == REPORTED and ${rec1} == COSTING"
            - "after evidence: ${inv2} == DOCUMENTING and ${rec2} == COSTING"

      - name: fault_allocation_contest_revise_cycle
        grounds:
          - state_machines.FaultAllocation.PROPOSED_to_CONTESTED
          - state_machines.FaultAllocation.CONTESTED_to_DRAFT
          - state_machines.DamageCase
        distinguishing_aspect: |
          Cyclic machine on FaultAllocation (different entity than DamageCase):
          DRAFT -> PROPOSED -> CONTESTED -> DRAFT (revise bumps revision_no to 1,
          case falls back to INVESTIGATING) -> PROPOSED -> FINAL; the loop is
          traversable repeatedly, unlike a linear pipeline.
        test_recipe:
          setup:
            - "excavator ex1; case with one evidence item, INVESTIGATING (inv-1); ADJUDICATED allocation EXCAVATOR 6000 / FACILITY_OWNER 4000 in DRAFT"
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "4 Maple Dr", facility_type: "GAS", severity: "MAJOR", occurred_at: "2026-05-07T09:00:00Z" }, as: IntakeCoordinator, captures: { caseF: $.data.id } }
            - { call: "POST /damage-recovery/evidence-items", payload: { damage_case_id: "${caseF}", evidence_type: "PHOTO", captured_at: "2026-05-07T10:00:00Z", description: "scene" }, as: IntakeCoordinator }
            - { call: "POST /damage-recovery/damage-cases/${caseF}/begin-investigation", payload: {}, as: DamageInvestigator, as_user_id: "inv-1", captures: { caseF_v: $.data.version } }
            - { call: "POST /damage-recovery/fault-allocations", payload: { damage_case_id: "${caseF}", root_cause_code: "NO_TICKET", expected_damage_case_version: "${caseF_v}", shares: [ { party_type: "EXCAVATOR", party_id: "${ex1}", share_bp: 6000 }, { party_type: "FACILITY_OWNER", party_id: null, share_bp: 4000 } ] }, as: DamageInvestigator, as_user_id: "inv-1", captures: { allocF: $.data.id, allocF_status0: $.data.status } }
          trigger:
            - { call: "POST /damage-recovery/fault-allocations/${allocF}/propose", payload: {}, as: DamageInvestigator, as_user_id: "inv-1", captures: { st1: $.data.status } }
            - { call: "POST /damage-recovery/fault-allocations/${allocF}/contest", payload: { contest_note: "too high" }, as: Excavator, as_user_id: "${ex1}", captures: { st2: $.data.status } }
            - { call: "POST /damage-recovery/fault-allocations/${allocF}/revise", payload: {}, as: DamageInvestigator, as_user_id: "inv-1", captures: { st3: $.data.status, rev: $.data.revision_no } }
            - { call: "POST /damage-recovery/fault-allocations/${allocF}/propose", payload: {}, as: DamageInvestigator, as_user_id: "inv-1", captures: { st4: $.data.status } }
            - { call: "POST /damage-recovery/fault-allocations/${allocF}/finalize", payload: {}, as: RecoveryManager, as_user_id: "mgr-1", captures: { st5: $.data.status } }
          assert:
            - "${allocF_status0} == DRAFT, ${st1} == PROPOSED, ${st2} == CONTESTED, ${st3} == DRAFT, ${st4} == PROPOSED, ${st5} == FINAL"
            - "FaultAllocation.revision_no == 1 after one loop"
            - "after revise, DamageCase.investigation_status == INVESTIGATING (re-propose succeeds)"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: finalize_violation_probation_training_cascade
        grounds:
          - state_machines.FaultAllocation.PROPOSED_to_FINAL
          - state_machines.Excavator
          - calculations.repeat_offender_score
          - calculations.training_assignment_selector
        distinguishing_aspect: |
          Depth-3 chain from the finalize trigger: finalize creates a
          ViolationRecord (link 1), whose creation recomputes repeat_offender_score
          and moves Excavator.program_status to PROBATION (link 2), whose band
          entry auto-creates a TrainingAssignment (link 3) — each link caused by
          the previous mutation, not by finalize directly.
        test_recipe:
          setup:
            - "course P101 (required_for_status=PROBATION) exists"
            - "excavator ex1 already carries 8 points from two MAJOR-case violations (4+4), band still GOOD_STANDING (no evaluate yet)"
            - "main case: CRITICAL, evidence present, INVESTIGATING (inv-1), ADJUDICATED shares EXCAVATOR 10000, PROPOSED"
          setup_api_calls:
            - { call: "POST /damage-recovery/training-courses", payload: { course_code: "P101", title: "Probation remediation", required_for_status: "PROBATION", credit_hours: 8 }, as: RecoveryManager, captures: { courseP: $.data.id } }
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "10 Old Rd", facility_type: "GAS", severity: "MAJOR", occurred_at: "2026-04-01T09:00:00Z" }, as: IntakeCoordinator, captures: { seed1: $.data.id } }
            - { call: "POST /damage-recovery/violation-records", payload: { excavator_id: "${ex1}", damage_case_id: "${seed1}" }, as: RecoveryManager }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "11 Old Rd", facility_type: "GAS", severity: "MAJOR", occurred_at: "2026-04-02T09:00:00Z" }, as: IntakeCoordinator, captures: { seed2: $.data.id } }
            - { call: "POST /damage-recovery/violation-records", payload: { excavator_id: "${ex1}", damage_case_id: "${seed2}" }, as: RecoveryManager }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "12 New Rd", facility_type: "ELECTRIC", severity: "CRITICAL", occurred_at: "2026-05-08T09:00:00Z" }, as: IntakeCoordinator, captures: { caseX: $.data.id } }
            - { call: "POST /damage-recovery/evidence-items", payload: { damage_case_id: "${caseX}", evidence_type: "PHOTO", captured_at: "2026-05-08T10:00:00Z", description: "scene" }, as: IntakeCoordinator }
            - { call: "POST /damage-recovery/damage-cases/${caseX}/begin-investigation", payload: {}, as: DamageInvestigator, as_user_id: "inv-1", captures: { caseX_v: $.data.version } }
            - { call: "POST /damage-recovery/fault-allocations", payload: { damage_case_id: "${caseX}", root_cause_code: "NO_TICKET", expected_damage_case_version: "${caseX_v}", shares: [ { party_type: "EXCAVATOR", party_id: "${ex1}", share_bp: 10000 } ] }, as: DamageInvestigator, as_user_id: "inv-1", captures: { allocX: $.data.id } }
            - { call: "POST /damage-recovery/fault-allocations/${allocX}/propose", payload: {}, as: DamageInvestigator, as_user_id: "inv-1" }
          trigger:
            - { call: "POST /damage-recovery/fault-allocations/${allocX}/finalize", payload: {}, as: RecoveryManager, as_user_id: "mgr-1" }
            - { call: "GET /damage-recovery/violation-records", payload: { damage_case_id: "${caseX}" }, as: RecoveryManager, captures: { v_pts: "$.data[0].points" } }
            - { call: "GET /damage-recovery/excavators/${ex1}", payload: {}, as: RecoveryManager, captures: { band: $.data.program_status, pts: $.data.offender_points } }
            - { call: "GET /damage-recovery/training-assignments", payload: { excavator_id: "${ex1}" }, as: RecoveryManager, captures: { asg_course: "$.data[0].course_id", asg_status: "$.data[0].status" } }
          assert:
            - "ViolationRecord(caseX).points == 6 (CRITICAL)"
            - "Excavator.offender_points == 14 (8 seed + 6 new)"
            - "Excavator.program_status == PROBATION (14 >= 12)"
            - "exactly one TrainingAssignment exists for ${ex1}: course_id == ${courseP} and status == ASSIGNED"

      - name: payment_reversal_reopens_invoice_and_case
        grounds:
          - state_machines.Payment.APPLIED_to_REVERSED
          - state_machines.ClaimInvoice
          - state_machines.DamageCase
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (payment reverse, not finalize):
          reversal undoes the invoice's allocation legs (link 1: invoice
          PAID -> ISSUED), whose reopening demotes DamageCase.recovery_status
          RECOVERED -> COLLECTING (link 2).
        test_recipe:
          setup:
            - "excavator ex1; case finalized with RULE_DEFAULT NO_TICKET (single excavator invoice 120000), invoice ISSUED, paid in full -> invoice PAID, case RECOVERED"
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "20 Hill St", facility_type: "GAS", severity: "MAJOR", occurred_at: "2026-05-09T09:00:00Z" }, as: IntakeCoordinator, captures: { caseY: $.data.id } }
            - { call: "POST /damage-recovery/evidence-items", payload: { damage_case_id: "${caseY}", evidence_type: "PHOTO", captured_at: "2026-05-09T10:00:00Z", description: "scene" }, as: IntakeCoordinator }
            - { call: "POST /damage-recovery/damage-cases/${caseY}/begin-investigation", payload: {}, as: DamageInvestigator, as_user_id: "inv-1", captures: { caseY_v: $.data.version } }
            - { call: "POST /damage-recovery/fault-allocations", payload: { damage_case_id: "${caseY}", root_cause_code: "NO_TICKET", expected_damage_case_version: "${caseY_v}" }, as: DamageInvestigator, as_user_id: "inv-1", captures: { allocY: $.data.id } }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseY}", category: "LABOR", description: "crew", quantity: 10, unit_cost_cents: 9000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseY}", category: "MATERIAL", description: "pipe", quantity: 5, unit_cost_cents: 3000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/fault-allocations/${allocY}/propose", payload: {}, as: DamageInvestigator, as_user_id: "inv-1" }
            - { call: "POST /damage-recovery/fault-allocations/${allocY}/finalize", payload: {}, as: RecoveryManager, as_user_id: "mgr-1" }
            - { call: "GET /damage-recovery/claim-invoices", payload: { damage_case_id: "${caseY}" }, as: RecoveryManager, captures: { invY: "$.data[0].id" } }
            - { call: "POST /damage-recovery/claim-invoices/${invY}/issue", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/payments", payload: { payer_type: "EXCAVATOR", payer_id: "${ex1}", amount_cents: 120000, claim_invoice_id: "${invY}" }, as: Excavator, as_user_id: "${ex1}", captures: { payY: $.data.id } }
            - { call: "GET /damage-recovery/claim-invoices/${invY}", payload: {}, as: RecoveryManager, captures: { invY_status_pre: $.data.status } }
            - { call: "GET /damage-recovery/damage-cases/${caseY}", payload: {}, as: RecoveryManager, captures: { caseY_rec_pre: $.data.recovery_status, caseY_recovered_pre: $.data.total_recovered_cents } }
          trigger:
            - { call: "POST /damage-recovery/payments/${payY}/reverse", payload: {}, as: RecoveryManager }
            - { call: "GET /damage-recovery/claim-invoices/${invY}", payload: {}, as: RecoveryManager, captures: { invY_status: $.data.status, invY_paid: $.data.amount_paid_cents } }
            - { call: "GET /damage-recovery/damage-cases/${caseY}", payload: {}, as: RecoveryManager, captures: { caseY_rec: $.data.recovery_status, caseY_recovered: $.data.total_recovered_cents } }
          assert:
            - "before reversal: ${invY_status_pre} == PAID and ${caseY_rec_pre} == RECOVERED and ${caseY_recovered_pre} == 120000"
            - "ClaimInvoice.amount_paid_cents == 0 and ClaimInvoice.status == ISSUED"
            - "DamageCase.recovery_status == COLLECTING and DamageCase.total_recovered_cents == 0"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: contest_final_allocation_state_error_beats_temporal
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CONTEST_WINDOW_CLOSED]
        distinguishing_aspect: |
          Error-category pair state vs business_temporal: contesting a FINAL
          allocation after the 10-day window violates both rules; priority 5
          (state) must win over priority 7 (temporal) -> ERR_INVALID_STATE,
          never ERR_CONTEST_WINDOW_CLOSED.
        test_recipe:
          setup:
            - "excavator ex1; case with evidence, INVESTIGATING; ADJUDICATED allocation EXCAVATOR 10000, PROPOSED then FINAL; logical clock advanced 11 days past proposal"
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "30 Glen Ave", facility_type: "GAS", severity: "MAJOR", occurred_at: "2026-05-01T09:00:00Z" }, as: IntakeCoordinator, captures: { caseG: $.data.id } }
            - { call: "POST /damage-recovery/evidence-items", payload: { damage_case_id: "${caseG}", evidence_type: "PHOTO", captured_at: "2026-05-01T10:00:00Z", description: "scene" }, as: IntakeCoordinator }
            - { call: "POST /damage-recovery/damage-cases/${caseG}/begin-investigation", payload: {}, as: DamageInvestigator, as_user_id: "inv-1", captures: { caseG_v: $.data.version } }
            - { call: "POST /damage-recovery/fault-allocations", payload: { damage_case_id: "${caseG}", root_cause_code: "NO_TICKET", expected_damage_case_version: "${caseG_v}", shares: [ { party_type: "EXCAVATOR", party_id: "${ex1}", share_bp: 10000 } ] }, as: DamageInvestigator, as_user_id: "inv-1", captures: { allocG: $.data.id } }
            - { call: "POST /damage-recovery/fault-allocations/${allocG}/propose", payload: {}, as: DamageInvestigator, as_user_id: "inv-1" }
            - { call: "POST /damage-recovery/fault-allocations/${allocG}/finalize", payload: {}, as: RecoveryManager, as_user_id: "mgr-1" }
            - { call: "POST /damage-recovery/_clock/set_current_utc", payload: { to_iso8601: "2026-05-12T12:00:00Z" }, as: RecoveryManager }
          trigger:
            - { call: "POST /damage-recovery/fault-allocations/${allocG}/contest", payload: { contest_note: "late" }, as: Excavator, as_user_id: "${ex1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (status FINAL fails first at priority 5)"
            - "error_id != ERR_CONTEST_WINDOW_CLOSED despite the deadline having passed"

      - name: finalize_sod_beats_invoice_authority_cap
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_INVOICE_AUTHORITY_CAP_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_fiscal (different pair
          than state/temporal): finalize by the SAME user who investigated the
          case AND a subtotal above the 5000000 cap fails both rules; priority 6
          (safety) must win -> ERR_SEGREGATION_OF_DUTIES, never
          ERR_INVOICE_AUTHORITY_CAP_EXCEEDED.
        test_recipe:
          setup:
            - "excavator ex1; case investigated by inv-9, evidence present, 11 LABOR lines 40x12000 each capped at 500000 -> subtotal 5500000 > 5000000 cap"
            - "ADJUDICATED allocation EXCAVATOR 10000, PROPOSED"
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "40 Grand Blvd", facility_type: "GAS", severity: "CRITICAL", occurred_at: "2026-05-02T09:00:00Z" }, as: IntakeCoordinator, captures: { caseH: $.data.id } }
            - { call: "POST /damage-recovery/evidence-items", payload: { damage_case_id: "${caseH}", evidence_type: "PHOTO", captured_at: "2026-05-02T10:00:00Z", description: "scene" }, as: IntakeCoordinator }
            - { call: "POST /damage-recovery/damage-cases/${caseH}/begin-investigation", payload: {}, as: DamageInvestigator, as_user_id: "inv-9", captures: { caseH_v: $.data.version } }
            - { call: "POST /damage-recovery/fault-allocations", payload: { damage_case_id: "${caseH}", root_cause_code: "NO_TICKET", expected_damage_case_version: "${caseH_v}", shares: [ { party_type: "EXCAVATOR", party_id: "${ex1}", share_bp: 10000 } ] }, as: DamageInvestigator, as_user_id: "inv-9", captures: { allocH: $.data.id } }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseH}", category: "LABOR", description: "c1", quantity: 40, unit_cost_cents: 12000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseH}", category: "LABOR", description: "c2", quantity: 40, unit_cost_cents: 12000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseH}", category: "LABOR", description: "c3", quantity: 40, unit_cost_cents: 12000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseH}", category: "LABOR", description: "c4", quantity: 40, unit_cost_cents: 12000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseH}", category: "LABOR", description: "c5", quantity: 40, unit_cost_cents: 12000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseH}", category: "LABOR", description: "c6", quantity: 40, unit_cost_cents: 12000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseH}", category: "LABOR", description: "c7", quantity: 40, unit_cost_cents: 12000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseH}", category: "LABOR", description: "c8", quantity: 40, unit_cost_cents: 12000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseH}", category: "LABOR", description: "c9", quantity: 40, unit_cost_cents: 12000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseH}", category: "LABOR", description: "c10", quantity: 40, unit_cost_cents: 12000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseH}", category: "LABOR", description: "c11", quantity: 40, unit_cost_cents: 12000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/fault-allocations/${allocH}/propose", payload: {}, as: DamageInvestigator, as_user_id: "inv-9" }
          trigger:
            - { call: "POST /damage-recovery/fault-allocations/${allocH}/finalize", payload: {}, as: RecoveryManager, as_user_id: "inv-9", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES (priority 6 beats priority 10)"
            - "error_id != ERR_INVOICE_AUTHORITY_CAP_EXCEEDED despite subtotal 5500000 > 5000000"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: offender_points_exactly_12_probation_10_watch
        grounds:
          - calculations.repeat_offender_score
          - state_machines.Excavator
        distinguishing_aspect: |
          Metric = offender points (inclusive >= thresholds): exactly 12 points
          yields PROBATION while 10 points yields WATCH on the same
          evaluate-program endpoint — the boundary is >=, not >.
        test_recipe:
          setup:
            - "excavator exA with three MAJOR-case violations (4+4+4 = 12 points)"
            - "excavator exB with two MAJOR-case and one MINOR-case violations (4+4+2 = 10 points)"
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigA", contact_email: "a@x.com" }, as: RecoveryManager, captures: { exA: $.data.id } }
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigB", contact_email: "b@x.com" }, as: RecoveryManager, captures: { exB: $.data.id } }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${exA}", dig_site_address: "1 A St", facility_type: "GAS", severity: "MAJOR", occurred_at: "2026-04-01T09:00:00Z" }, as: IntakeCoordinator, captures: { cA1: $.data.id } }
            - { call: "POST /damage-recovery/violation-records", payload: { excavator_id: "${exA}", damage_case_id: "${cA1}" }, as: RecoveryManager }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${exA}", dig_site_address: "2 A St", facility_type: "GAS", severity: "MAJOR", occurred_at: "2026-04-02T09:00:00Z" }, as: IntakeCoordinator, captures: { cA2: $.data.id } }
            - { call: "POST /damage-recovery/violation-records", payload: { excavator_id: "${exA}", damage_case_id: "${cA2}" }, as: RecoveryManager }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${exA}", dig_site_address: "3 A St", facility_type: "GAS", severity: "MAJOR", occurred_at: "2026-04-03T09:00:00Z" }, as: IntakeCoordinator, captures: { cA3: $.data.id } }
            - { call: "POST /damage-recovery/violation-records", payload: { excavator_id: "${exA}", damage_case_id: "${cA3}" }, as: RecoveryManager }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${exB}", dig_site_address: "1 B St", facility_type: "GAS", severity: "MAJOR", occurred_at: "2026-04-01T09:00:00Z" }, as: IntakeCoordinator, captures: { cB1: $.data.id } }
            - { call: "POST /damage-recovery/violation-records", payload: { excavator_id: "${exB}", damage_case_id: "${cB1}" }, as: RecoveryManager }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${exB}", dig_site_address: "2 B St", facility_type: "GAS", severity: "MAJOR", occurred_at: "2026-04-02T09:00:00Z" }, as: IntakeCoordinator, captures: { cB2: $.data.id } }
            - { call: "POST /damage-recovery/violation-records", payload: { excavator_id: "${exB}", damage_case_id: "${cB2}" }, as: RecoveryManager }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${exB}", dig_site_address: "3 B St", facility_type: "WATER", severity: "MINOR", occurred_at: "2026-04-03T09:00:00Z" }, as: IntakeCoordinator, captures: { cB3: $.data.id } }
            - { call: "POST /damage-recovery/violation-records", payload: { excavator_id: "${exB}", damage_case_id: "${cB3}" }, as: RecoveryManager }
          trigger:
            - { call: "POST /damage-recovery/excavators/${exA}/evaluate-program", payload: {}, as: RecoveryManager, captures: { bandA: $.data.program_status, ptsA: $.data.offender_points } }
            - { call: "POST /damage-recovery/excavators/${exB}/evaluate-program", payload: {}, as: RecoveryManager, captures: { bandB: $.data.program_status, ptsB: $.data.offender_points } }
          assert:
            - "Excavator exA: offender_points == 12 and program_status == PROBATION (12 >= 12)"
            - "Excavator exB: offender_points == 10 and program_status == WATCH (10 < 12, >= 6)"

      - name: filing_deadline_inclusive_boundary_on_time
        grounds:
          - calculations.late_filing_penalty
          - entities.RegulatoryReport.fields.days_late
        distinguishing_aspect: |
          Metric = filing timestamp vs deadline (different metric than points),
          reached via POST /regulatory-reports/{id}/file (different endpoint than
          evaluate-program): filing at exactly occurred_at + 30 days is ON TIME
          (deadline inclusive) with days_late == 0 and penalty_cents == 0.
        test_recipe:
          setup:
            - "excavator ex1; case occurred 2026-03-01T00:00:00Z; one INCIDENT report in DRAFT; logical clock set to exactly 2026-03-31T00:00:00Z (deadline)"
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
            - { call: "POST /damage-recovery/_clock/set_current_utc", payload: { to_iso8601: "2026-03-31T00:00:00Z" }, as: RecoveryManager }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "50 Lake Rd", facility_type: "GAS", severity: "MINOR", occurred_at: "2026-03-01T00:00:00Z" }, as: IntakeCoordinator, captures: { caseD: $.data.id } }
            - { call: "POST /damage-recovery/regulatory-reports", payload: { report_type: "INCIDENT", damage_case_id: "${caseD}", payload_notes: "initial" }, as: ClaimsAdjuster, captures: { repD: $.data.id } }
          trigger:
            - { call: "POST /damage-recovery/regulatory-reports/${repD}/file", payload: {}, as: ClaimsAdjuster, captures: { filed_at: $.data.filed_at, days_late: $.data.days_late, penalty: $.data.penalty_cents } }
          assert:
            - "RegulatoryReport.status == FILED"
            - "RegulatoryReport.filed_at == 2026-03-31T00:00:00Z == deadline (inclusive)"
            - "RegulatoryReport.days_late == 0 and RegulatoryReport.penalty_cents == 0"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: link_ticket_requires_completed_ticket
        grounds:
          - state_machines.LocateTicket
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair DamageCase -> LocateTicket: link-ticket is rejected with
          ERR_INVALID_STATE while the ticket is still OPEN, and succeeds once a
          locate response has moved the ticket to COMPLETED.
        test_recipe:
          setup:
            - "excavator ex1, locator loc1; ticket T OPEN (no response yet) covering 2026-05-10T08:00:00Z..17:00:00Z; case occurred inside the window"
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
            - { call: "POST /damage-recovery/locators", payload: { company_name: "MarkCo", contact_email: "m@x.com", contract_region: "R1" }, as: RecoveryManager, captures: { loc1: $.data.id } }
            - { call: "POST /damage-recovery/locate-tickets", payload: { excavator_id: "${ex1}", dig_site_address: "60 Ridge Rd", work_start_at: "2026-05-10T08:00:00Z", work_end_at: "2026-05-10T17:00:00Z" }, as: Excavator, as_user_id: "${ex1}", captures: { tck: $.data.id } }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "60 Ridge Rd", facility_type: "GAS", severity: "MINOR", occurred_at: "2026-05-10T10:00:00Z" }, as: IntakeCoordinator, captures: { caseL: $.data.id } }
          trigger:
            - { call: "POST /damage-recovery/damage-cases/${caseL}/link-ticket", payload: { locate_ticket_id: "${tck}" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /damage-recovery/locate-responses", payload: { locate_ticket_id: "${tck}", locator_id: "${loc1}", response_code: "MARKED", marks_completed_at: "2026-05-10T07:00:00Z" }, as: Locator, as_user_id: "${loc1}" }
            - { call: "POST /damage-recovery/damage-cases/${caseL}/link-ticket", payload: { locate_ticket_id: "${tck}" }, as: IntakeCoordinator, captures: { linked: $.data.locate_ticket_id } }
          assert:
            - "first link attempt: error_id == ERR_INVALID_STATE (ticket OPEN)"
            - "after LocateResponse completes the ticket, link succeeds: DamageCase.locate_ticket_id == ${tck}"

      - name: dispute_requires_issued_invoice
        grounds:
          - state_machines.ClaimInvoice
          - state_machines.Dispute
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair Dispute -> ClaimInvoice (different pair than
          DamageCase/LocateTicket): a dispute against a DRAFT invoice is
          rejected with ERR_INVALID_STATE; after issue the same call succeeds
          and moves the invoice to DISPUTED.
        test_recipe:
          setup:
            - "excavator ex1; case finalized (RULE_DEFAULT NO_TICKET, costs 120000) -> one DRAFT invoice owed by ex1"
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "70 Valley Rd", facility_type: "GAS", severity: "MAJOR", occurred_at: "2026-05-11T09:00:00Z" }, as: IntakeCoordinator, captures: { caseV: $.data.id } }
            - { call: "POST /damage-recovery/evidence-items", payload: { damage_case_id: "${caseV}", evidence_type: "PHOTO", captured_at: "2026-05-11T10:00:00Z", description: "scene" }, as: IntakeCoordinator }
            - { call: "POST /damage-recovery/damage-cases/${caseV}/begin-investigation", payload: {}, as: DamageInvestigator, as_user_id: "inv-1", captures: { caseV_v: $.data.version } }
            - { call: "POST /damage-recovery/fault-allocations", payload: { damage_case_id: "${caseV}", root_cause_code: "NO_TICKET", expected_damage_case_version: "${caseV_v}" }, as: DamageInvestigator, as_user_id: "inv-1", captures: { allocV: $.data.id } }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseV}", category: "LABOR", description: "crew", quantity: 10, unit_cost_cents: 9000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseV}", category: "MATERIAL", description: "pipe", quantity: 5, unit_cost_cents: 3000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/fault-allocations/${allocV}/propose", payload: {}, as: DamageInvestigator, as_user_id: "inv-1" }
            - { call: "POST /damage-recovery/fault-allocations/${allocV}/finalize", payload: {}, as: RecoveryManager, as_user_id: "mgr-1" }
            - { call: "GET /damage-recovery/claim-invoices", payload: { damage_case_id: "${caseV}" }, as: RecoveryManager, captures: { invV: "$.data[0].id", invV_st: "$.data[0].status" } }
          trigger:
            - { call: "POST /damage-recovery/disputes", payload: { target_type: "CLAIM_INVOICE", target_id: "${invV}", reason: "AMOUNT" }, as: Excavator, as_user_id: "${ex1}", captures: { err: $.data.error_id } }
            - { call: "POST /damage-recovery/claim-invoices/${invV}/issue", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/disputes", payload: { target_type: "CLAIM_INVOICE", target_id: "${invV}", reason: "AMOUNT" }, as: Excavator, as_user_id: "${ex1}", captures: { dsp: $.data.id, dsp_st: $.data.status } }
          assert:
            - "invoice was DRAFT: ${invV_st} == DRAFT and first dispute error_id == ERR_INVALID_STATE"
            - "after issue: dispute created with status OPEN (${dsp_st} == OPEN)"
            - "ClaimInvoice(${invV}).status == DISPUTED after the dispute opens"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: ticket_windows_half_open_adjacency_allowed
        grounds:
          - entities.LocateTicket.fields.work_start_at
          - validations[priority=9]
          - errors[ERR_TICKET_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Half-open interval semantics on the (excavator_id, dig_site_address)
          resource: ticket B starting exactly at ticket A's work_end_at is
          ALLOWED (adjacency, [start, end)), while ticket C straddling A's
          interior is rejected with ERR_TICKET_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "excavator ex1; ticket A at '5 Oak Ave' covering [2026-06-01T08:00:00Z, 2026-06-01T12:00:00Z)"
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
            - { call: "POST /damage-recovery/locate-tickets", payload: { excavator_id: "${ex1}", dig_site_address: "5 Oak Ave", work_start_at: "2026-06-01T08:00:00Z", work_end_at: "2026-06-01T12:00:00Z" }, as: Excavator, as_user_id: "${ex1}", captures: { tckA: $.data.id } }
          trigger:
            - { call: "POST /damage-recovery/locate-tickets", payload: { excavator_id: "${ex1}", dig_site_address: "5 Oak Ave", work_start_at: "2026-06-01T12:00:00Z", work_end_at: "2026-06-01T14:00:00Z" }, as: Excavator, as_user_id: "${ex1}", captures: { tckB: $.data.id, tckB_st: $.data.status } }
            - { call: "POST /damage-recovery/locate-tickets", payload: { excavator_id: "${ex1}", dig_site_address: "5 Oak Ave", work_start_at: "2026-06-01T11:00:00Z", work_end_at: "2026-06-01T13:00:00Z" }, as: Excavator, as_user_id: "${ex1}", captures: { err: $.data.error_id } }
          assert:
            - "adjacent ticket B created: status == OPEN (${tckB_st} == OPEN)"
            - "straddling ticket C rejected: error_id == ERR_TICKET_WINDOW_CONFLICT"

      - name: quarterly_report_periods_closed_interval_boundary_conflict
        grounds:
          - entities.RegulatoryReport.fields.period_start
          - errors[ERR_REPORT_PERIOD_OVERLAP]
        distinguishing_aspect: |
          CLOSED interval semantics on the regulatory filing calendar (different
          resource and different geometry than the half-open ticket windows): a
          quarterly period sharing only its boundary day with an existing period
          CONFLICTS (2026-03-31 belongs to both), while a period starting the
          next day is accepted.
        test_recipe:
          setup:
            - "one QUARTERLY_SUMMARY report covering the closed period [2026-01-01, 2026-03-31]"
          setup_api_calls:
            - { call: "POST /damage-recovery/regulatory-reports", payload: { report_type: "QUARTERLY_SUMMARY", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", payload_notes: "Q1" }, as: ClaimsAdjuster, captures: { repQ1: $.data.id } }
          trigger:
            - { call: "POST /damage-recovery/regulatory-reports", payload: { report_type: "QUARTERLY_SUMMARY", period_start: "2026-03-31T00:00:00Z", period_end: "2026-06-30T00:00:00Z", payload_notes: "overlap" }, as: ClaimsAdjuster, captures: { err: $.data.error_id } }
            - { call: "POST /damage-recovery/regulatory-reports", payload: { report_type: "QUARTERLY_SUMMARY", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", payload_notes: "Q2" }, as: ClaimsAdjuster, captures: { repQ2: $.data.id, repQ2_st: $.data.status } }
          assert:
            - "shared boundary day report: error_id == ERR_REPORT_PERIOD_OVERLAP"
            - "next-day report accepted: ${repQ2_st} == DRAFT"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: payment_apply_reverse_conserves_recovered_funds
        grounds:
          - calculations.payment_waterfall_allocation
          - state_machines.Payment.APPLIED_to_REVERSED
          - entities.Excavator.fields.credit_balance_cents
        distinguishing_aspect: |
          Conserved quantity = recovered funds: a waterfall payment of 150000
          against a single 120000 invoice (30000 remainder to credit) followed
          by its reversal returns invoice.amount_paid_cents AND
          Excavator.credit_balance_cents to their pre-payment values (0 and 0) —
          apply + compensate leaves zero drift.
        test_recipe:
          setup:
            - "excavator ex1; finalized case, one invoice ISSUED for 120000; excavator credit_balance_cents == 0"
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "80 Shore Dr", facility_type: "GAS", severity: "MAJOR", occurred_at: "2026-05-12T09:00:00Z" }, as: IntakeCoordinator, captures: { caseW: $.data.id } }
            - { call: "POST /damage-recovery/evidence-items", payload: { damage_case_id: "${caseW}", evidence_type: "PHOTO", captured_at: "2026-05-12T10:00:00Z", description: "scene" }, as: IntakeCoordinator }
            - { call: "POST /damage-recovery/damage-cases/${caseW}/begin-investigation", payload: {}, as: DamageInvestigator, as_user_id: "inv-1", captures: { caseW_v: $.data.version } }
            - { call: "POST /damage-recovery/fault-allocations", payload: { damage_case_id: "${caseW}", root_cause_code: "NO_TICKET", expected_damage_case_version: "${caseW_v}" }, as: DamageInvestigator, as_user_id: "inv-1", captures: { allocW: $.data.id } }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseW}", category: "LABOR", description: "crew", quantity: 10, unit_cost_cents: 9000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseW}", category: "MATERIAL", description: "pipe", quantity: 5, unit_cost_cents: 3000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/fault-allocations/${allocW}/propose", payload: {}, as: DamageInvestigator, as_user_id: "inv-1" }
            - { call: "POST /damage-recovery/fault-allocations/${allocW}/finalize", payload: {}, as: RecoveryManager, as_user_id: "mgr-1" }
            - { call: "GET /damage-recovery/claim-invoices", payload: { damage_case_id: "${caseW}" }, as: RecoveryManager, captures: { invW: "$.data[0].id" } }
            - { call: "POST /damage-recovery/claim-invoices/${invW}/issue", payload: {}, as: ClaimsAdjuster }
            - { call: "GET /damage-recovery/excavators/${ex1}", payload: {}, as: RecoveryManager, captures: { credit_pre: $.data.credit_balance_cents } }
          trigger:
            - { call: "POST /damage-recovery/payments", payload: { payer_type: "EXCAVATOR", payer_id: "${ex1}", amount_cents: 150000 }, as: Excavator, as_user_id: "${ex1}", captures: { payW: $.data.id } }
            - { call: "GET /damage-recovery/claim-invoices/${invW}", payload: {}, as: RecoveryManager, captures: { paid_mid: $.data.amount_paid_cents } }
            - { call: "GET /damage-recovery/excavators/${ex1}", payload: {}, as: RecoveryManager, captures: { credit_mid: $.data.credit_balance_cents } }
            - { call: "POST /damage-recovery/payments/${payW}/reverse", payload: {}, as: RecoveryManager }
            - { call: "GET /damage-recovery/claim-invoices/${invW}", payload: {}, as: RecoveryManager, captures: { paid_post: $.data.amount_paid_cents } }
            - { call: "GET /damage-recovery/excavators/${ex1}", payload: {}, as: RecoveryManager, captures: { credit_post: $.data.credit_balance_cents } }
          assert:
            - "invariant baseline: ${credit_pre} == 0"
            - "after apply: ${paid_mid} == 120000 and ${credit_mid} == 30000 (waterfall remainder)"
            - "after reversal (compensating action): ${paid_post} == 0 and ${credit_post} == 0 — recovered funds conserved, zero drift"

      - name: revise_cycle_conserves_allocation_mass
        grounds:
          - calculations.allocation_distribution
          - state_machines.FaultAllocation
          - errors[ERR_SHARES_MUST_SUM_10000]
        distinguishing_aspect: |
          Conserved quantity = allocation mass (different quantity than money
          recovered): every PROPOSED snapshot of the shares sums to exactly
          10000 bp across the contest/revise cycle, and at finalize the invoice
          split distributes the case subtotal exactly — sum(invoiced_cents) ==
          case.subtotal_cents == 120000 with zero created or destroyed cents.
        test_recipe:
          setup:
            - "excavator ex1, locator loc1; case with costs 120000, evidence, INVESTIGATING; ADJUDICATED allocation EXCAVATOR 6000 / LOCATOR 4000"
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
            - { call: "POST /damage-recovery/locators", payload: { company_name: "MarkCo", contact_email: "m@x.com", contract_region: "R1" }, as: RecoveryManager, captures: { loc1: $.data.id } }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "90 Cliff Rd", facility_type: "GAS", severity: "MAJOR", occurred_at: "2026-05-13T09:00:00Z" }, as: IntakeCoordinator, captures: { caseZ: $.data.id } }
            - { call: "POST /damage-recovery/evidence-items", payload: { damage_case_id: "${caseZ}", evidence_type: "PHOTO", captured_at: "2026-05-13T10:00:00Z", description: "scene" }, as: IntakeCoordinator }
            - { call: "POST /damage-recovery/damage-cases/${caseZ}/begin-investigation", payload: {}, as: DamageInvestigator, as_user_id: "inv-1", captures: { caseZ_v: $.data.version } }
            - { call: "POST /damage-recovery/fault-allocations", payload: { damage_case_id: "${caseZ}", root_cause_code: "MISMARK", expected_damage_case_version: "${caseZ_v}", shares: [ { party_type: "EXCAVATOR", party_id: "${ex1}", share_bp: 6000 }, { party_type: "LOCATOR", party_id: "${loc1}", share_bp: 4000 } ] }, as: DamageInvestigator, as_user_id: "inv-1", captures: { allocZ: $.data.id } }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseZ}", category: "LABOR", description: "crew", quantity: 10, unit_cost_cents: 9000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseZ}", category: "MATERIAL", description: "pipe", quantity: 5, unit_cost_cents: 3000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/fault-allocations/${allocZ}/propose", payload: {}, as: DamageInvestigator, as_user_id: "inv-1" }
            - { call: "POST /damage-recovery/fault-allocations/${allocZ}/contest", payload: { contest_note: "share dispute" }, as: Excavator, as_user_id: "${ex1}" }
            - { call: "POST /damage-recovery/fault-allocations/${allocZ}/revise", payload: { shares: [ { party_type: "EXCAVATOR", party_id: "${ex1}", share_bp: 5000 }, { party_type: "LOCATOR", party_id: "${loc1}", share_bp: 5000 } ] }, as: DamageInvestigator, as_user_id: "inv-1" }
          trigger:
            - { call: "POST /damage-recovery/fault-allocations/${allocZ}/propose", payload: {}, as: DamageInvestigator, as_user_id: "inv-1" }
            - { call: "POST /damage-recovery/fault-allocations/${allocZ}/finalize", payload: {}, as: RecoveryManager, as_user_id: "mgr-1" }
            - { call: "GET /damage-recovery/claim-invoices", payload: { damage_case_id: "${caseZ}", debtor_id: "${ex1}" }, as: RecoveryManager, captures: { inv_ex: "$.data[0].invoiced_cents" } }
            - { call: "GET /damage-recovery/claim-invoices", payload: { damage_case_id: "${caseZ}", debtor_id: "${loc1}" }, as: RecoveryManager, captures: { inv_loc: "$.data[0].invoiced_cents" } }
            - { call: "GET /damage-recovery/damage-cases/${caseZ}", payload: {}, as: RecoveryManager, captures: { subZ: $.data.subtotal_cents } }
          assert:
            - "shares at every PROPOSED snapshot summed to exactly 10000 bp (6000+4000, then 5000+5000)"
            - "ClaimInvoice(${ex1}).invoiced_cents == 60000 and ClaimInvoice(${loc1}).invoiced_cents == 60000"
            - "conservation: ${inv_ex} + ${inv_loc} == ${subZ} == 120000 (zero drift through the revise cycle)"
