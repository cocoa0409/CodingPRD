# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Cross-reference of SCAFFOLD.yaml §1.1–§1.7 against the nine Difficulty Rules of §0.5.
# Every logical clock reference assumes the mandated startup default 2026-08-01T00:00:00Z.

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: dual_variant_commission_provisional_versus_final_same_engagement
        grounds:
          - calculations.engagement_commission
          - entities.Engagement.fields.provisional_commission_cents
          - entities.Engagement.fields.final_commission_cents
          - entities.Engagement.fields.commission_pct_snapshot
          - state_machines.Contract.PARTIALLY_SIGNED_to_EXECUTED
          - state_machines.Engagement.CONTRACTED_to_DELIVERED
        distinguishing_aspect: |
          The two variants of engagement_commission run over the SAME engagement row at two
          lifecycle instants and differ only in whether recording_fee_cents joins the
          commissionable base: PROVISIONAL commissions the fee line alone at contract
          execution, FINAL commissions (fee + recording buy-out) at delivery, at the same
          pinned commission_pct_snapshot. Same data, two stored numbers, delta 87500.
        test_recipe:
          setup:
            - "Logical clock at the 2026-08-01T00:00:00Z default"
            - "Speaker rostered BRONZE (default_commission_pct 0.25) with tax_form_status ON_FILE, fee range 1000000..2000000, travel_class PREMIUM"
            - "Client in HEALTHCARE with credit_status GOOD"
            - "Inquiry QUALIFIED by agent-01 for a 2026-10-15 event with budget 1600000"
            - "Proposal PRESENTED carrying one option quoting 1275000 with 70000 travel allowance"
            - "Engagement CONFIRMED and its Contract EXECUTED with FULL_BUY_OUT recording rights and recording_fee_cents 350000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /speakers"
              payload: { full_name: "Dana Reyes", topics: ["AI_STRATEGY", "LEADERSHIP"], fee_floor_cents: 1000000, fee_ceiling_cents: 2000000, travel_class: "PREMIUM", travel_buffer_days: 1, tax_form_status: "ON_FILE" }
              as: BureauAdmin
              captures: { sp: $.data.id }
            - call: "POST /clients"
              payload: { org_name: "Meridian Health", industry_code: "HEALTHCARE", primary_contact_email: "ops@meridian.example" }
              as: BureauAdmin
              captures: { cl: $.data.id }
            - call: "POST /inquiries"
              payload: { client_id: "${cl}", required_topic: "AI_STRATEGY", event_start_utc: "2026-10-15T16:00:00Z", event_end_utc: "2026-10-15T18:00:00Z", audience_size: 800, budget_cents: 1600000, objective_tags: ["STRATEGY"] }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { inq: $.data.id }
            - call: "POST /inquiries/${inq}/qualify"
              payload: { outcome: "QUALIFY", qualification_note: "budget and lead time clear" }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { inq_v: $.data.version }
            - call: "POST /inquiries/${inq}/proposals"
              payload: { expected_inquiry_version: "${inq_v}", valid_until_utc: "2026-09-20T00:00:00Z" }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { pr: $.data.id }
            - call: "POST /proposal-options"
              payload: { proposal_id: "${pr}", speaker_id: "${sp}", quoted_fee_cents: 1275000, rank_no: 1, travel_allowance_cents: 70000 }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { opt: $.data.id }
            - call: "POST /proposals/${pr}/present"
              payload: {}
              as: BookingAgent
              as_user_id: "agent-01"
            - call: "POST /proposals/${pr}/select"
              payload: { option_id: "${opt}" }
              as: Client
              as_user_id: "${cl}"
              captures: { eng: $.data.id }
            - call: "POST /engagements/${eng}/confirm"
              payload: {}
              as: Speaker
              as_user_id: "${sp}"
            - call: "POST /engagements/${eng}/contracts"
              payload: { cancellation_schedule_code: "STANDARD", travel_policy_code: "POLICY_A", recording_rights: "FULL_BUY_OUT", recording_fee_cents: 350000, technical_rider_code: "STAGE_PLUS", exclusivity_days: 90 }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { ct: $.data.id }
            - call: "POST /contracts/${ct}/send"
              payload: {}
              as: BookingAgent
              as_user_id: "agent-01"
            - call: "POST /contracts/${ct}/sign"
              payload: { signature_name: "Dana Reyes" }
              as: Speaker
              as_user_id: "${sp}"
            - call: "POST /contracts/${ct}/sign"
              payload: { signature_name: "M. Okafor" }
              as: Client
              as_user_id: "${cl}"
          trigger:
            - call: "GET /engagements/${eng}"
              payload: {}
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { prov: $.data.provisional_commission_cents, snap: $.data.commission_pct_snapshot }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T20:00:00Z" }
              as: BureauAdmin
            - call: "POST /engagements/${eng}/deliver"
              payload: {}
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { fin: $.data.final_commission_cents, prov2: $.data.provisional_commission_cents }
          assert:
            - "the pre-delivery read returns commission_pct_snapshot == 0.25 and provisional_commission_cents == 318750, with final_commission_cents == null"
            - "the delivery response returns final_commission_cents == 406250"
            - "provisional_commission_cents is still 318750 after delivery — the FINAL variant does not overwrite the PROVISIONAL field"
            - "the delta 406250 - 318750 == 87500 equals round_half_up(350000 * 0.25), i.e. the commission on the recording buy-out alone"
            - "GET /remittances?engagement_id=${eng} returns one row with gross_fee_cents 1625000 and commission_cents 406250 — the remittance withholds the FINAL figure, never the provisional one"

      - name: dual_variant_speaker_score_rolling_versus_lifetime_diverge
        grounds:
          - calculations.speaker_performance_score
          - entities.Speaker.fields.rolling_score
          - entities.Speaker.fields.lifetime_score
          - entities.Feedback.fields.composite_score
          - endpoints[GET /speakers/{speakerId}/performance]
        distinguishing_aspect: |
          A different calculation in a different entity domain (Speaker, not Engagement) whose
          two variants read the SAME two Feedback rows and differ only in weighting: ROLLING
          applies renormalised recency weights 0.625/0.375 to the newest-first ordering while
          LIFETIME takes the equal-weight mean, so the newer weaker feedback drags ROLLING
          (3.98) below LIFETIME (4.10) for identical input rows.
          Not a variant of engagement_commission's base-inclusion distinction.
        test_recipe:
          setup:
            - "One speaker with two DELIVERED engagements for the same client"
            - "Feedback #1 filed 2026-10-15T20:00:00Z on the October engagement with content_score 5 and logistics_score 4 (composite 4.60)"
