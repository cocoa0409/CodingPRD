# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task 2842
# Vehicle Sales Incentive Program Administration.
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 only. Deleting this file leaves
# the declared behaviour identical; it only makes coverage harder to audit.
# Logical clock starts at 2026-08-01T00:00:00.000Z; every time-sensitive chain moves
# it explicitly with POST /_clock/set_current_utc.

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: claim_rate_basis_snapshot_versus_repriced_current
        grounds:
          - calculations.claim_payable_amount
          - calculations.repricing_reevaluation
          - entities.Claim.fields.rate_basis
          - entities.Claim.fields.snapshot_per_unit_cents
          - entities.RepricingEvent.fields.net_adjustment_cents
        distinguishing_aspect: |
          The dual variant lives on the Claim/IncentiveProgram money domain: the SAME claim on the
          SAME delivery yields approved_amount_cents 800000 under variant as_sold_snapshot and
          860000 under variant repriced_current, and the switch is driven purely by whether a
          RETROACTIVE_TO_MONTH_START RepricingEvent window contains the delivery's sale_date.
        test_recipe:
          setup:
            - "One ACTIVE FINANCE_SUBVENTION program FIN-AUG-26, per_unit_amount_cents 200000, apr_buydown_bps 300, half-open window [2026-08-01, 2026-09-01)."
            - "One eligibility rule admitting model MX5 / region WEST / build 2026-05-01..2026-07-31 / deal_type FINANCE."
            - "Dealer D-100 in region WEST, ACTIVE."
            - "One VALIDATED RetailDelivery: msrp_cents 4000000, term_months 60, contract_apr_bps 299, sale_date 2026-08-05."
            - "One SUBMITTED, UNPAID Claim on that delivery with snapshot_per_unit_cents frozen at 200000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/dealers"
              payload: { dealer_code: "D-100", name: "Northgate Motors", region_code: "WEST", historical_volume_units: 16, market_opportunity_bps: 1500 }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { dealer_id: $.data.id }
            - call: "POST /incentives/programs"
              payload: { program_code: "FIN-AUG-26", name: "August Finance Subvention", incentive_type: "FINANCE_SUBVENTION", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: 200000, budget_cents: 100000000, stack_group: "AUG-FIN", priority_rank: 20, apr_buydown_bps: 300 }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { fin_id: $.data.id }
            - call: "POST /incentives/programs/${fin_id}/eligibility-rules"
              payload: { model_code: "MX5", region_code: "WEST", build_date_from: "2026-05-01T00:00:00.000Z", build_date_to: "2026-07-31T00:00:00.000Z", allowed_deal_types: ["FINANCE"] }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs/${fin_id}/submit"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs/${fin_id}/approve"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/deliveries"
              payload: { dealer_id: "${dealer_id}", vin: "VIN2842FIN000001", model_code: "MX5", trim_code: "GT", build_date: "2026-06-15T00:00:00.000Z", msrp_cents: 4000000, sale_date: "2026-08-05T00:00:00.000Z", customer_region_code: "WEST", deal_type: "FINANCE", term_months: 60, contract_apr_bps: 299 }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { delivery_id: $.data.id }
            - call: "POST /incentives/deliveries/${delivery_id}/validate"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
            - call: "GET /incentives/programs/${fin_id}"
              payload: {}
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { fin_v1: $.data.version }
            - call: "POST /incentives/claims"
              payload: { delivery_id: "${delivery_id}", program_id: "${fin_id}", claimed_amount_cents: 800000, expected_program_version: "${fin_v1}" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /incentives/claims/${claim_id}/adjudicate"
              payload: { decision: "APPROVE" }
              as: ClaimsAuditor
              as_user_id: "u-auditor-2"
              captures: { approved_v1: $.data.approved_amount_cents, basis_v1: $.data.rate_basis, snap_v1: $.data.snapshot_per_unit_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "GET /incentives/programs/${fin_id}"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { fin_v2: $.data.version }
            - call: "POST /incentives/programs/${fin_id}/repricings"
              payload: { mode: "RETROACTIVE_TO_MONTH_START", new_per_unit_amount_cents: 260000, expected_program_version: "${fin_v2}" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { repricing_id: $.data.id }
          assert:
            - "${approved_v1} == 800000 (variant as_sold_snapshot: snapshot_per_unit_cents 200000 + finance leg 600000)"
            - "${basis_v1} == AS_SOLD_SNAPSHOT"
            - "${snap_v1} == 200000"
            - "Claim.${claim_id}.approved_amount_cents == 860000 (variant repriced_current: program.per_unit_amount_cents 260000 + finance leg 600000)"
            - "Claim.${claim_id}.rate_basis == REPRICED_CURRENT"
            - "Claim.${claim_id}.snapshot_per_unit_cents == 200000 unchanged by the repricing"
            - "Claim.${claim_id}.payment_status == UNPAID"
            - "RepricingEvent.${repricing_id}.affected_claim_count == 1"
            - "RepricingEvent.${repricing_id}.net_adjustment_cents == 60000"
            - "RepricingEvent.${repricing_id}.previous_per_unit_amount_cents == 200000"
            - "RepricingEvent.${repricing_id}.month_start == 2026-08-01T00:00:00.000Z"
            - "IncentiveProgram.${fin_id}.committed_cents == 860000"
            - "IncentiveProgram.${fin_id}.per_unit_spend_cents == 860000"

      - name: stair_step_payout_marginal_bands_versus_full_volume
        grounds:
          - calculations.dealer_stair_step_payout
          - entities.IncentiveProgram.fields.tier_bonus_mode
          - entities.DealerObjective.fields.payout_cents
          - entities.DealerObjective.fields.tier_attained
          - validations[priority=12]
        distinguishing_aspect: |
          The second dual variant sits on a different entity domain — DealerObjective unit
          attainment, not Claim money: with identical objective_units 4, achieved_units 3 and an
          identical tier_schedule, tier_bonus_mode MARGINAL pays 60000 (2 band units) while
          FULL_VOLUME pays 90000 (all 3 units re-rated at tier 1), a 30000 divergence produced by
          the mode flag alone.
        test_recipe:
          setup:
            - "Dealer D-200 in region WEST with historical_volume_units 4 and market_opportunity_bps 0, so objective_units == basis_units == 4."
            - "Two ACTIVE DEALER_STAIR_STEP programs sharing footprint MX5/WEST/CASH and window [2026-08-01, 2026-09-01), identical tier_schedule [{1, 5000 bps, 30000}, {2, 10000 bps, 50000}], differing ONLY in tier_bonus_mode (MARGINAL vs FULL_VOLUME)."
            - "A StackabilityConstraint with mode ALLOWED joins the two programs, which is what lets the second one clear validations[priority=12] while the first is already ACTIVE on the same footprint."
            - "One PROPOSED DealerObjective per program for D-200, both created with stretch_bps 0."
            - "Three VALIDATED MX5/CASH deliveries for D-200 with August sale_dates, so both objectives reach achieved_units 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/dealers"
              payload: { dealer_code: "D-200", name: "Riverbend Auto", region_code: "WEST", historical_volume_units: 4, market_opportunity_bps: 0 }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { dealer_id: $.data.id }
            - call: "POST /incentives/programs"
              payload: { program_code: "STAIR-MARG-AUG", name: "August Stair Step Marginal", incentive_type: "DEALER_STAIR_STEP", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: 0, budget_cents: 50000000, stack_group: "AUG-STAIR", priority_rank: 40, tier_schedule: [{ tier_index: 1, threshold_bps: 5000, per_unit_bonus_cents: 30000 }, { tier_index: 2, threshold_bps: 10000, per_unit_bonus_cents: 50000 }], tier_bonus_mode: "MARGINAL" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { marg_id: $.data.id }
            - call: "POST /incentives/programs"
              payload: { program_code: "STAIR-FULL-AUG", name: "August Stair Step Full Volume", incentive_type: "DEALER_STAIR_STEP", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: 0, budget_cents: 50000000, stack_group: "AUG-STAIR", priority_rank: 41, tier_schedule: [{ tier_index: 1, threshold_bps: 5000, per_unit_bonus_cents: 30000 }, { tier_index: 2, threshold_bps: 10000, per_unit_bonus_cents: 50000 }], tier_bonus_mode: "FULL_VOLUME" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { full_id: $.data.id }
            - call: "POST /incentives/programs/${marg_id}/eligibility-rules"
              payload: { model_code: "MX5", region_code: "WEST", build_date_from: "2026-05-01T00:00:00.000Z", build_date_to: "2026-07-31T00:00:00.000Z", allowed_deal_types: ["CASH"] }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs/${full_id}/eligibility-rules"
              payload: { model_code: "MX5", region_code: "WEST", build_date_from: "2026-05-01T00:00:00.000Z", build_date_to: "2026-07-31T00:00:00.000Z", allowed_deal_types: ["CASH"] }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs/${marg_id}/stackability-constraints"
              payload: { program_b_id: "${full_id}", mode: "ALLOWED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs/${marg_id}/submit"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs/${marg_id}/approve"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/programs/${full_id}/submit"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs/${full_id}/approve"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/programs/${marg_id}/objectives"
              payload: { dealer_id: "${dealer_id}", stretch_bps: 0 }
              as: FieldSalesManager
              as_user_id: "u-fsm-1"
              captures: { obj_marg_id: $.data.id }
            - call: "POST /incentives/programs/${full_id}/objectives"
              payload: { dealer_id: "${dealer_id}", stretch_bps: 0 }
              as: FieldSalesManager
              as_user_id: "u-fsm-1"
              captures: { obj_full_id: $.data.id }
            - call: "POST /incentives/deliveries"
              payload: { dealer_id: "${dealer_id}", vin: "VIN2842STR000001", model_code: "MX5", trim_code: "GT", build_date: "2026-06-01T00:00:00.000Z", msrp_cents: 3000000, sale_date: "2026-08-02T00:00:00.000Z", customer_region_code: "WEST", deal_type: "CASH" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /incentives/deliveries"
              payload: { dealer_id: "${dealer_id}", vin: "VIN2842STR000002", model_code: "MX5", trim_code: "GT", build_date: "2026-06-02T00:00:00.000Z", msrp_cents: 3000000, sale_date: "2026-08-02T00:00:00.000Z", customer_region_code: "WEST", deal_type: "CASH" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { d2_id: $.data.id }
            - call: "POST /incentives/deliveries"
              payload: { dealer_id: "${dealer_id}", vin: "VIN2842STR000003", model_code: "MX5", trim_code: "GT", build_date: "2026-06-03T00:00:00.000Z", msrp_cents: 3000000, sale_date: "2026-08-02T00:00:00.000Z", customer_region_code: "WEST", deal_type: "CASH" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { d3_id: $.data.id }
            - call: "POST /incentives/deliveries/${d1_id}/validate"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
            - call: "POST /incentives/deliveries/${d2_id}/validate"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
          trigger:
            - call: "POST /incentives/deliveries/${d3_id}/validate"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
            - call: "GET /incentives/objectives/${obj_marg_id}"
              payload: {}
              as: FieldSalesManager
              as_user_id: "u-fsm-1"
              captures: { marg_payout: $.data.payout_cents, marg_att: $.data.attainment_bps, marg_tier: $.data.tier_attained, marg_units: $.data.objective_units, marg_achieved: $.data.achieved_units }
            - call: "GET /incentives/objectives/${obj_full_id}"
              payload: {}
              as: FieldSalesManager
              as_user_id: "u-fsm-1"
              captures: { full_payout: $.data.payout_cents, full_att: $.data.attainment_bps, full_tier: $.data.tier_attained }
          assert:
            - "${marg_units} == 4 and ${marg_achieved} == 3"
            - "${marg_att} == 7500 and ${full_att} == 7500 (floor(3 * 10000 / 4), identical for both modes)"
            - "${marg_tier} == 1 and ${full_tier} == 1 (threshold_bps 5000 <= 7500 < 10000, inclusive comparison)"
            - "${marg_payout} == 60000 (MARGINAL: band 1 spans units 2..3, so 2 band units at 30000)"
            - "${full_payout} == 90000 (FULL_VOLUME: all 3 achieved units re-rated at tier 1's 30000)"
            - "${full_payout} - ${marg_payout} == 30000"

  - rule_id: combinatorial_formula
    instances:
      - name: accrual_rounds_each_eligibility_line_before_summing
        grounds:
          - calculations.budget_accrual_amount
          - calculations.program_accrual_ledger
          - entities.BudgetAccrual.fields.accrued_cents
          - entities.BudgetAccrual.fields.unit_basis
          - entities.EligibilityRule.fields.model_code
        distinguishing_aspect: |
          Mode (b) — nested rounding whose ORDER changes the answer. With per_unit_amount_cents
          200600, CANCEL_RESERVE_BPS 275, and two eligibility lines carrying 1 and 3 validated
          units, the two line values are exactly 195083.5 and 585250.5 cents; rounding each line
          half-up and then summing gives 780335, while summing first and rounding once gives
          780334. The scaffold pins round-per-line-then-sum, so 780334 is a failing answer.
        test_recipe:
          setup:
            - "One ACTIVE CUSTOMER_CASH program ACC-AUG-26 with per_unit_amount_cents 200600, accrual_method UNIT_BASED, window [2026-08-01, 2026-09-01)."
            - "Exactly two EligibilityRule rows, created in this order: rule A admits model MX5, rule B admits model TRK9; both region WEST, build 2026-05-01..2026-07-31, deal_type CASH."
            - "Dealer D-300 in region WEST, ACTIVE."
            - "Four VALIDATED deliveries with August sale_dates: one MX5 (attributed to rule A) and three TRK9 (attributed to rule B)."
            - "No BudgetAccrual row exists yet for period_month 2026-08."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/dealers"
              payload: { dealer_code: "D-300", name: "Summit Vehicle Group", region_code: "WEST", historical_volume_units: 10, market_opportunity_bps: 0 }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { dealer_id: $.data.id }
            - call: "POST /incentives/programs"
              payload: { program_code: "ACC-AUG-26", name: "August Customer Cash Accrual Test", incentive_type: "CUSTOMER_CASH", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: 200600, budget_cents: 100000000, stack_group: "AUG-CASH", priority_rank: 10, accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { acc_id: $.data.id }
            - call: "POST /incentives/programs/${acc_id}/eligibility-rules"
              payload: { model_code: "MX5", region_code: "WEST", build_date_from: "2026-05-01T00:00:00.000Z", build_date_to: "2026-07-31T00:00:00.000Z", allowed_deal_types: ["CASH"] }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { rule_a_id: $.data.id }
            - call: "POST /incentives/programs/${acc_id}/eligibility-rules"
              payload: { model_code: "TRK9", region_code: "WEST", build_date_from: "2026-05-01T00:00:00.000Z", build_date_to: "2026-07-31T00:00:00.000Z", allowed_deal_types: ["CASH"] }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { rule_b_id: $.data.id }
            - call: "POST /incentives/programs/${acc_id}/submit"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs/${acc_id}/approve"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/deliveries"
              payload: { dealer_id: "${dealer_id}", vin: "VIN2842ACC000001", model_code: "MX5", trim_code: "BASE", build_date: "2026-06-01T00:00:00.000Z", msrp_cents: 3200000, sale_date: "2026-08-10T00:00:00.000Z", customer_region_code: "WEST", deal_type: "CASH" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /incentives/deliveries"
              payload: { dealer_id: "${dealer_id}", vin: "VIN2842ACC000002", model_code: "TRK9", trim_code: "BASE", build_date: "2026-06-02T00:00:00.000Z", msrp_cents: 4100000, sale_date: "2026-08-10T00:00:00.000Z", customer_region_code: "WEST", deal_type: "CASH" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /incentives/deliveries"
              payload: { dealer_id: "${dealer_id}", vin: "VIN2842ACC000003", model_code: "TRK9", trim_code: "BASE", build_date: "2026-06-03T00:00:00.000Z", msrp_cents: 4100000, sale_date: "2026-08-11T00:00:00.000Z", customer_region_code: "WEST", deal_type: "CASH" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { b2_id: $.data.id }
            - call: "POST /incentives/deliveries"
              payload: { dealer_id: "${dealer_id}", vin: "VIN2842ACC000004", model_code: "TRK9", trim_code: "BASE", build_date: "2026-06-04T00:00:00.000Z", msrp_cents: 4100000, sale_date: "2026-08-12T00:00:00.000Z", customer_region_code: "WEST", deal_type: "CASH" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { b3_id: $.data.id }
            - call: "POST /incentives/deliveries/${a1_id}/validate"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
            - call: "POST /incentives/deliveries/${b1_id}/validate"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
            - call: "POST /incentives/deliveries/${b2_id}/validate"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
            - call: "POST /incentives/deliveries/${b3_id}/validate"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
          trigger:
            - call: "POST /incentives/programs/${acc_id}/accruals"
              payload: { period_month: "2026-08" }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { accrual_id: $.data.id, accrued: $.data.accrued_cents, basis: $.data.unit_basis, etype: $.data.entry_type, amethod: $.data.accrual_method, rev: $.data.reversal_cents }
          assert:
            - "${accrued} == 780335"
            - "${accrued} != 780334 (the sum-then-round order is a wrong answer, off by exactly 1 cent)"
            - "${basis} == 4"
            - "${etype} == ACCRUAL"
            - "${amethod} == UNIT_BASED"
            - "${rev} == 0"
            - "IncentiveProgram.${acc_id}.accrued_budget_cents == 780335"
            - "GET /incentives/programs/${acc_id}/accruals returns total_count == 1"

      - name: residual_impact_breaks_the_capitalized_cost_circularity
        grounds:
          - calculations.residual_value_impact
          - calculations.claim_payable_amount
          - calculations.delivery_stack_allocation
          - entities.IncentiveProgram.fields.residual_impact_bps
          - entities.IncentiveProgram.fields.residual_support_bps
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency with a pinned evaluation order. Capitalized cost
          "should" be msrp minus the customer cash stacked on the same delivery, but that stacked
          cash is itself bounded by a cap evaluated against a stacked total that includes this
          program's lease support. The scaffold pins RAW msrp_cents at step 3 and floor division
