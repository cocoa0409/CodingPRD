  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: cc_occ_assessment_create_stale_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[risk-assessment-create-stale-sequence]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC rule risk-assessment-create-stale-sequence: creating RA1 bumps the sequence version 1->2; a second create carrying the stale expected_sequence_version 1 is rejected 412, while the current version 2 succeeds."
        test_recipe:
          setup: ["SETUP production; DRAFT sequence at version 1"]
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "P", total_budget_cents: 10000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id }
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${prod_id}", name: "OCC Seq", hazard_class: "FIGHT", risk_category: "LOW", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { seq_id: $.data.id, seq_v: $.data.version }
            - call: "POST /api/risk-assessments"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", severity_rating: 2, likelihood_rating: 2, expected_sequence_version: "${seq_v}" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { ra1: $.data.id }
            - call: "GET /api/stunt-sequences/${seq_id}"
              as: StuntCoordinator
              captures: { seq_v2: $.data.version }
          trigger:
            - call: "POST /api/risk-assessments"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", severity_rating: 2, likelihood_rating: 3, expected_sequence_version: "${seq_v}" }
              as: StuntCoordinator
              as_user_id: "coord-1"
