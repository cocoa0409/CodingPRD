            - call: "POST /orders"
              payload: { customer_id: "${c_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${p_id}", requested_yards: 1 }
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /orders/${o_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /orders/${o_id}/pay"
              payload: { points_redeemed_on_order: 50 }
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INSUFFICIENT_POINTS"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: room_conflict_with_cleanup_buffer
        grounds:
          - validations[priority=8]
          - errors[ERR_ROOM_CONFLICT]
          - entities.Room.fields.cleanup_buffer_min
        distinguishing_aspect: "Room resource, buffer-augmented interval: session ending 12:00 and next starting 12:15 leave a 15-min gap < 30-min cleanup_buffer_min, so ERR_ROOM_CONFLICT fires even though the raw intervals do not overlap."
        test_recipe:
          setup:
            - "Room R (cleanup_buffer_min=30) with an existing session 10:00-12:00 on 2026-08-05."
          setup_api_calls:
            - call: "POST /rooms"
              payload: { name: "Studio", cleanup_buffer_min: 30 }
              as: StoreManager
              captures: { r_id: $.data.id }
            - call: "POST /workshops"
              payload: { title: "W-Room" }
              as: StoreManager
              captures: { w_id: $.data.id }
            - call: "POST /workshops/${w_id}/sessions"
              payload: { room_id: "${r_id}", instructor_code: "I1", starts_at: "2026-08-05T10:00:00Z", ends_at: "2026-08-05T12:00:00Z", capacity: 10 }
              as: StoreManager
          trigger:
            - call: "POST /workshops/${w_id}/sessions"
              payload: { room_id: "${r_id}", instructor_code: "I2", starts_at: "2026-08-05T12:15:00Z", ends_at: "2026-08-05T13:00:00Z", capacity: 10 }
              as: StoreManager
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_ROOM_CONFLICT"

      - name: customer_session_overlap_half_open
        grounds:
          - validations[priority=9]
          - errors[ERR_CUSTOMER_SESSION_OVERLAP]
        distinguishing_aspect: "Customer resource, half-open [start,end) interval with no buffer: a second registration overlapping 11:00-13:00 against an existing 10:00-12:00 registration is rejected, but exact back-to-back adjacency (12:00 start) would be allowed."
        test_recipe:
          setup:
            - "Customer C REGISTERED in session S1 (10:00-12:00, Room A). Session S2 (11:00-13:00, Room B) exists in an OPEN workshop."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { email: "c15@x.com", full_name: "C Fifteen", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "RA" }
              as: StoreManager
              captures: { ra_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "RB" }
              as: StoreManager
              captures: { rb_id: $.data.id }
            - call: "POST /workshops"
              payload: { title: "WX" }
              as: StoreManager
              captures: { w_id: $.data.id }
            - call: "POST /workshops/${w_id}/sessions"
              payload: { room_id: "${ra_id}", instructor_code: "I1", starts_at: "2026-08-06T10:00:00Z", ends_at: "2026-08-06T12:00:00Z", capacity: 10 }
              as: StoreManager
              captures: { s1_id: $.data.id }
            - call: "POST /workshops/${w_id}/sessions"
              payload: { room_id: "${rb_id}", instructor_code: "I2", starts_at: "2026-08-06T11:00:00Z", ends_at: "2026-08-06T13:00:00Z", capacity: 10 }
              as: StoreManager
              captures: { s2_id: $.data.id }
            - call: "POST /workshops/${w_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /workshops/${w_id}/register"
              payload: { session_id: "${s1_id}", customer_id: "${c_id}" }
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /workshops/${w_id}/register"
              payload: { session_id: "${s2_id}", customer_id: "${c_id}" }
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_CUSTOMER_SESSION_OVERLAP"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: inventory_yards_conserved_across_submit_then_cancel
        grounds:
          - calculations.inventory_availability
          - state_machines.Order.BUILDING_to_SUBMITTED
          - state_machines.Order.transitions
          - entities.InventoryLot.fields.available_yards
        distinguishing_aspect: "Conserved quantity = InventoryLot.available_yards: submit reserves 4 yards (available 10->6), cancel releases them, leaving available_yards back at exactly 10 with reserved_yards 0."
        test_recipe:
          setup:
            - "InventoryLot on_hand_yards=10, available_yards=10. Order O with a BY_YARD line requesting 4 yards."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c16@x.com", full_name: "C Sixteen", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "FAB-250", name: "Denim", sell_mode: "BY_YARD", unit_price_cents: 250, min_cut_increment_yards: 1 }
              as: StoreManager
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { on_hand_yards: 10 }
              as: StoreManager
              captures: { lot_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${p_id}", requested_yards: 4 }
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /orders/${o_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /orders/${o_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "GET /inventory-lots/${lot_id}"
              payload: {}
              as: StoreManager
              captures: { avail: $.data.available_yards, res: $.data.reserved_yards }
          assert:
            - "InventoryLot.${lot_id}.available_yards == 10"
            - "InventoryLot.${lot_id}.reserved_yards == 0"
            - "InventoryLot.${lot_id}.on_hand_yards == 10"

