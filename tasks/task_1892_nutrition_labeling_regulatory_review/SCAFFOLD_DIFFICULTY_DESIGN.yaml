          - state_machines.LabelVersion.release_status=NOT_RELEASED (with review_status=APPROVED)_to_release_status=RELEASED
          - state_machines.LabelVersion.release_status=RELEASED_to_release_status=WITHDRAWN
          - entities.LabelVersion.fields.review_status
          - entities.LabelVersion.fields.release_status
        distinguishing_aspect: |
          LabelVersion carries two INDEPENDENT state dimensions: review_status cycles
          DRAFT -> IN_REVIEW -> DRAFT -> IN_REVIEW -> APPROVED (reject loop, review_round
          accumulating) while release_status independently walks NOT_RELEASED -> RELEASED ->
          WITHDRAWN; after withdraw the label remains APPROVED — parallel-dimension machine
          on LabelVersion, a different entity from ClaimAssessment above.
