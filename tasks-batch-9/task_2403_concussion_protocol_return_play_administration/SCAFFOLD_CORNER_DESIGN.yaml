            - "trigger 1: Player.${player_id}.baseline_status == NONE"
            - "trigger 2: response status 409 with error_id ERR_RESOURCE_STATE_INVALID"
            - "trigger 2: BaselineTest.${baseline_id}.status == INVALIDATED"

      - name: monitoring_dimension_advances_independently_of_case_status
        claim_type: parallel
