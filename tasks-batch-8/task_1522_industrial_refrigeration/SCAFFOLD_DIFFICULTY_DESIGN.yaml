# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Industrial Refrigeration (Ammonia) Service & PSM
# 9 difficulty rules x 2 instances. Every setup_api_calls chain is replayable
# from empty DB against SCAFFOLD.yaml §1.5; all ${var} bind to earlier captures.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: charge_rollup_book_vs_gauge_diverge
        grounds:
          - calculations.facility_charge_rollup
          - entities.Facility.fields.total_charge_lbs
          - entities.RefrigerationSystem.fields.last_gauge_reading_lbs
        distinguishing_aspect: |
          Facility-domain calculation with two variants over the same physical
          plant: the book variant sums the adjustment ledger (6000.1 + 2500.0 -
          100.1 = 8400.0) while the gauge variant sums per-system physical
          readings (4200.0 + 3900.5 = 8100.5); identical inputs, delta 299.5 lbs.
        test_recipe:
          setup:
            - "Facility 'ColdCo Plant' (threshold 10000) with systems ER1 (design 4000) and ER2 (design 3500)"
            - "Ledger: ADD 6000.05 (-> 6000.1), ADD 2500.04 (-> 2500.0), REMOVE 100.05 (-> 100.1); gauges: ER1 4200.0, ER2 3900.5"
          setup_api_calls:
            - call: "POST /psm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FacilityAdmin
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant", threshold_lbs: 10000 }
              as: FacilityAdmin
              captures: { fac: $.data.id, fac_v: $.data.version }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Olivia Operator" }
              as: FacilityAdmin
              captures: { emp: $.data.id }
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "ER1", design_charge_lbs: 4000 }
              as: FacilityAdmin
              captures: { sys1: $.data.id }
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "ER2", design_charge_lbs: 3500 }
              as: FacilityAdmin
              captures: { sys2: $.data.id }
            - call: "POST /psm/charge-adjustments"
              payload: { facility_id: "${fac}", system_id: "${sys1}", adjustment_type: "ADD", quantity_lbs: 6000.05, reason: "initial charge ER1", expected_facility_version: "${fac_v}" }
              as: Operator
              as_user_id: "${emp}"
              captures: { r1: $.data.rounded_lbs }
            - call: "GET /psm/facilities/${fac}"
              as: FacilityAdmin
              captures: { fac_v2: $.data.version }
            - call: "POST /psm/charge-adjustments"
              payload: { facility_id: "${fac}", system_id: "${sys2}", adjustment_type: "ADD", quantity_lbs: 2500.04, reason: "initial charge ER2", expected_facility_version: "${fac_v2}" }
              as: Operator
              as_user_id: "${emp}"
            - call: "GET /psm/facilities/${fac}"
              as: FacilityAdmin
              captures: { fac_v3: $.data.version }
            - call: "POST /psm/charge-adjustments"
              payload: { facility_id: "${fac}", system_id: "${sys1}", adjustment_type: "REMOVE", quantity_lbs: 100.05, reason: "pump-out for valve work", expected_facility_version: "${fac_v3}" }
              as: Operator
              as_user_id: "${emp}"
            - call: "POST /psm/refrigeration-systems/${sys1}/gauge-readings"
              payload: { reading_lbs: 4200.0 }
              as: Operator
              as_user_id: "${emp}"
            - call: "POST /psm/refrigeration-systems/${sys2}/gauge-readings"
              payload: { reading_lbs: 3900.5 }
              as: Operator
              as_user_id: "${emp}"
          trigger:
            - call: "GET /psm/facilities/${fac}/charge-summary"
              as: ComplianceOfficer
              captures: { book: $.data.book_charge_lbs, gauge: $.data.gauge_charge_lbs, delta: $.data.delta_lbs, cpost: $.data.charge_posture }
          assert:
            - "charge-summary.book_charge_lbs == 8400.0 (book variant: 6000.1 + 2500.0 - 100.1)"
            - "charge-summary.gauge_charge_lbs == 8100.5 (gauge variant: 4200.0 + 3900.5)"
            - "charge-summary.delta_lbs == 299.5"
            - "charge-summary.charge_posture == 'BELOW_THRESHOLD' (book variant is authoritative for posture)"
            - "first adjustment rounded_lbs == 6000.1 (per-line round_half_up of 6000.05 at 0.1 lb)"

      - name: inspection_due_fixed_vs_condition_based
        grounds:
          - calculations.inspection_due_date
          - entities.Equipment.fields.next_due_at
          - state_machines.Inspection.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          Equipment-domain calculation: two VESSELs with identical 180-day base
          intervals completed PASS at the same instant diverge — FIXED yields
          next_due_at = completed + 180d while CONDITION_BASED yields
          completed + floor(180*1.5)=270d; a 90-day divergence from identical inputs.
        test_recipe:
          setup:
            - "Facility with one system; equipment V-101 (FIXED, 180d) and V-102 (CONDITION_BASED, 180d)"
            - "One SCHEDULED inspection each; logical clock at 2026-08-10T00:00:00Z for completion"
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "Freezeworks" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "ER1", design_charge_lbs: 3000 }
              as: FacilityAdmin
              captures: { sys: $.data.id }
            - call: "POST /psm/equipment"
              payload: { system_id: "${sys}", tag_number: "V-101", equipment_type: "VESSEL", inspection_interval_days: 180, inspection_method: "FIXED" }
              as: MaintenanceLead
              captures: { eqA: $.data.id }
            - call: "POST /psm/equipment"
              payload: { system_id: "${sys}", tag_number: "V-102", equipment_type: "VESSEL", inspection_interval_days: 180, inspection_method: "CONDITION_BASED" }
              as: MaintenanceLead
              captures: { eqB: $.data.id }
            - call: "POST /psm/inspections"
              payload: { equipment_id: "${eqA}", due_at: "2026-08-05T00:00:00Z" }
              as: MaintenanceLead
              captures: { inspA: $.data.id }
            - call: "POST /psm/inspections"
              payload: { equipment_id: "${eqB}", due_at: "2026-08-05T00:00:00Z" }
              as: MaintenanceLead
              captures: { inspB: $.data.id }
            - call: "POST /psm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: FacilityAdmin
          trigger:
            - call: "POST /psm/inspections/${inspA}/complete"
              payload: { result: "PASS" }
              as: MaintenanceLead
            - call: "POST /psm/inspections/${inspB}/complete"
              payload: { result: "PASS" }
              as: MaintenanceLead
            - call: "GET /psm/equipment/${eqA}"
              as: MaintenanceLead
              captures: { dueA: $.data.next_due_at }
            - call: "GET /psm/equipment/${eqB}"
              as: MaintenanceLead
              captures: { dueB: $.data.next_due_at }
          assert:
            - "Equipment.${eqA}.next_due_at == '2027-02-06T00:00:00Z' (FIXED: 2026-08-10 + 180 days)"
            - "Equipment.${eqB}.next_due_at == '2027-05-07T00:00:00Z' (CONDITION_BASED PASS: 2026-08-10 + 270 days)"
            - "Both inspections recorded result == PASS and completed_at == '2026-08-10T00:00:00Z' — identical inputs, variant-selected outputs diverge by 90 days"
            - "Equipment.${eqA}.integrity_status == 'CURRENT' and Equipment.${eqB}.integrity_status == 'CURRENT'"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: floating_head_pressure_load_band_clamp
        grounds:
          - calculations.floating_head_pressure_target
          - entities.RefrigerationSystem.fields.condenser_approach_f
        distinguishing_aspect: |
          Mode (a) — a >=3-input non-linear formula: the load band adds a
          conditional approach derate (+2.5F at load 80, +0.0F at load 50), the
          saturation table is piecewise-linear interpolated, and the nested
          min/max clamp binds at [150.0, 185.0]; load 80 yields 159.5 psig vs
          load 50 yielding 152.6 psig at identical wet bulb.
        test_recipe:
          setup:
            - "Facility + system ER1 with condenser_approach_f=15.0, min_head_psig=150.0, max_head_psig=185.0, float_head_enabled=true"
            - "One employee for the Operator identity"
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Olivia Operator" }
              as: FacilityAdmin
              captures: { emp: $.data.id }
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "ER1", design_charge_lbs: 3000, condenser_approach_f: 15.0, min_head_psig: 150.0, max_head_psig: 185.0, float_head_enabled: true }
              as: FacilityAdmin
              captures: { sys: $.data.id }
          trigger:
            - call: "POST /psm/refrigeration-systems/${sys}/head-pressure-target"
              payload: { wet_bulb_f: 70.0, condenser_load_pct: 80 }
              as: Operator
              as_user_id: "${emp}"
              captures: { hp80: $.data.target_psig, ap80: $.data.effective_approach_f }
            - call: "POST /psm/refrigeration-systems/${sys}/head-pressure-target"
              payload: { wet_bulb_f: 70.0, condenser_load_pct: 50 }
              as: Operator
              as_user_id: "${emp}"
              captures: { hp50: $.data.target_psig, ap50: $.data.effective_approach_f }
          assert:
            - "load-80 response target_psig == 159.5 (approach 15.0+2.5=17.5 -> T=87.5F -> interp(80:138.8, 90:166.4)=138.8+0.75*27.6=159.5; clamp inert)"
            - "load-50 response target_psig == 152.6 (approach 15.0+0.0 -> T=85.0F -> 138.8+0.5*27.6=152.6)"
            - "effective_approach_f == 17.5 at load 80 and == 15.0 at load 50 — conditional load band is the non-linear branch"
            - "Both results inside [min_head_psig=150.0, max_head_psig=185.0]; wet_bulb_f identical across calls so the delta (6.9 psig) isolates the load-band term"

      - name: charge_rollup_per_line_rounding_order
        grounds:
          - calculations.facility_charge_rollup
          - entities.ChargeAdjustment.fields.rounded_lbs
        distinguishing_aspect: |
          Mode (b) — nested rounding with pinned order: each adjustment is
          rounded to 0.1 lb round_half_up AT POSTING (10.05 -> 10.1 per line)
          and the rollup sums the stored rounded values, yielding 30.3; the
          alternative sum-then-round order would yield round(30.15)=30.2 — the
          scaffold pins per-line-then-sum.
        test_recipe:
          setup:
            - "Facility (default threshold 10000) with one operator employee; empty ledger"
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "Rounding Test Facility" }
              as: FacilityAdmin
              captures: { fac: $.data.id, fac_v: $.data.version }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Olivia Operator" }
              as: FacilityAdmin
              captures: { emp: $.data.id }
          trigger:
            - call: "POST /psm/charge-adjustments"
              payload: { facility_id: "${fac}", adjustment_type: "ADD", quantity_lbs: 10.05, reason: "top-up 1", expected_facility_version: "${fac_v}" }
              as: Operator
              as_user_id: "${emp}"
              captures: { r1: $.data.rounded_lbs }
            - call: "GET /psm/facilities/${fac}"
              as: FacilityAdmin
              captures: { fac_v2: $.data.version }
            - call: "POST /psm/charge-adjustments"
              payload: { facility_id: "${fac}", adjustment_type: "ADD", quantity_lbs: 10.05, reason: "top-up 2", expected_facility_version: "${fac_v2}" }
              as: Operator
              as_user_id: "${emp}"
              captures: { r2: $.data.rounded_lbs }
            - call: "GET /psm/facilities/${fac}"
              as: FacilityAdmin
              captures: { fac_v3: $.data.version }
            - call: "POST /psm/charge-adjustments"
              payload: { facility_id: "${fac}", adjustment_type: "ADD", quantity_lbs: 10.05, reason: "top-up 3", expected_facility_version: "${fac_v3}" }
              as: Operator
              as_user_id: "${emp}"
              captures: { r3: $.data.rounded_lbs }
            - call: "GET /psm/facilities/${fac}/charge-summary"
              as: FacilityAdmin
              captures: { book: $.data.book_charge_lbs }
          assert:
            - "All three adjustments store rounded_lbs == 10.1 (round_half_up(10.05, 0.1))"
            - "charge-summary.book_charge_lbs == 30.3 (sum of per-line rounded values)"
            - "Sum-then-round order would produce 30.2 — the literal 30.3 is only reachable via the pinned per-line-first order"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: psid_document_review_cycle_and_supersede
        grounds:
          - state_machines.PsidDocument.CURRENT_to_UNDER_REVIEW
          - state_machines.PsidDocument.UNDER_REVIEW_to_CURRENT
          - state_machines.PsidDocument.CURRENT_to_SUPERSEDED
          - concurrency_rules[psid-issue-stale-system]
        distinguishing_aspect: |
          PsidDocument runs a revision cycle CURRENT -> UNDER_REVIEW -> CURRENT
          (reaffirm stamps last_reaffirmed_at) and a separate system-driven
          supersede edge that retires the doc when a newer revision is issued —
          a cyclic, non-linear machine on the document entity.
        test_recipe:
          setup:
            - "Facility with system ER1; PsidDocument 'Rev A' issued CURRENT for (ER1, PID)"
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "ER1", design_charge_lbs: 3000 }
              as: FacilityAdmin
              captures: { sys: $.data.id, sys_v: $.data.version }
            - call: "POST /psm/psid-documents"
              payload: { system_id: "${sys}", doc_type: "PID", revision_label: "Rev A", content_uri: "s3://docs/pid-rev-a.pdf", expected_system_version: "${sys_v}" }
              as: PsCoordinator
              captures: { doc1: $.data.id }
          trigger:
            - call: "POST /psm/psid-documents/${doc1}/start-review"
              as: PsCoordinator
              captures: { st_review: $.data.status }
            - call: "POST /psm/psid-documents/${doc1}/reaffirm"
              as: PsCoordinator
              captures: { st_current: $.data.status, reaff: $.data.last_reaffirmed_at }
            - call: "GET /psm/refrigeration-systems/${sys}"
              as: PsCoordinator
              captures: { sys_v2: $.data.version }
            - call: "POST /psm/psid-documents"
              payload: { system_id: "${sys}", doc_type: "PID", revision_label: "Rev B", content_uri: "s3://docs/pid-rev-b.pdf", expected_system_version: "${sys_v2}" }
              as: PsCoordinator
              captures: { doc2: $.data.id, st_doc2: $.data.status }
            - call: "GET /psm/psid-documents/${doc1}"
              as: PsCoordinator
              captures: { st_doc1: $.data.status }
          assert:
            - "start-review yields status == 'UNDER_REVIEW'"
            - "reaffirm yields status == 'CURRENT' with last_reaffirmed_at == '2026-08-01T00:00:00Z' (default logical clock; cycle edge executed)"
            - "After Rev B issue: doc1.status == 'SUPERSEDED' and doc2.status == 'CURRENT' (exactly one CURRENT per (system_id, doc_type))"
            - "RefrigerationSystem.version advanced to 3 after two document issues (1 create + 1 per issue)"

      - name: incident_reopen_cycle
        grounds:
          - state_machines.Incident.CLOSED_to_REOPENED
          - state_machines.Incident.REOPENED_to_UNDER_INVESTIGATION
          - entities.Incident.fields.reopen_count
        distinguishing_aspect: |
          Incident is cyclic: REPORTED -> UNDER_INVESTIGATION -> CLOSED ->
          REOPENED -> UNDER_INVESTIGATION, with reopen_count accumulating and
          the facility open-incident set re-absorbing the incident on reopen.
        test_recipe:
          setup:
            - "Facility with ACTIVE employees R (reporter) and I (investigator); incident reported by R, investigated, closed with no corrective actions"
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Rita Reporter" }
              as: FacilityAdmin
              captures: { emp_r: $.data.id }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Ivan Investigator" }
              as: FacilityAdmin
              captures: { emp_i: $.data.id }
            - call: "POST /psm/incidents"
              payload: { facility_id: "${fac}", severity: "NEAR_MISS", description: "ammonia odor near valve", reported_by_employee_id: "${emp_r}" }
              as: Operator
              as_user_id: "${emp_r}"
              captures: { inc: $.data.id }
            - call: "POST /psm/incidents/${inc}/assign-investigator"
              payload: { investigator_employee_id: "${emp_i}" }
              as: ComplianceOfficer
            - call: "POST /psm/incidents/${inc}/close"
              as: ComplianceOfficer
              captures: { st_closed: $.data.status }
          trigger:
            - call: "POST /psm/incidents/${inc}/reopen"
              payload: { reason: "new evidence from vibration logs" }
              as: ComplianceOfficer
              captures: { st_reopened: $.data.status, rc: $.data.reopen_count }
            - call: "POST /psm/incidents/${inc}/assign-investigator"
              payload: { investigator_employee_id: "${emp_i}" }
              as: ComplianceOfficer
              captures: { st_ui: $.data.status }
            - call: "GET /psm/facilities/${fac}"
              as: ComplianceOfficer
              captures: { oic: $.data.open_incident_count }
          assert:
            - "close from UNDER_INVESTIGATION with zero corrective actions yields status == 'CLOSED'"
            - "reopen yields status == 'REOPENED' and reopen_count == 1"
            - "re-assign yields status == 'UNDER_INVESTIGATION' (cycle CLOSED -> REOPENED -> UNDER_INVESTIGATION completed)"
            - "Facility.open_incident_count == 1 (close dropped it to 0; reopen re-added it — REOPENED is in the open set)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: charge_threshold_crossing_cascade
        grounds:
          - calculations.facility_charge_rollup
          - entities.Facility.fields.charge_posture
          - entities.Facility.fields.psm_program_status
          - endpoints: "POST /psm/charge-adjustments side_effects"
        distinguishing_aspect: |
          Depth-3 cascade triggered by a charge posting: adjustment -> (1)
          Facility.total_charge_lbs recomputed -> (2) charge_posture flips
          BELOW->AT_OR_ABOVE at the crossing -> (3) psm_program_status becomes
          REQUIRED and an AUTO_THRESHOLD ComplianceAudit is created with
          due_at = crossing + 1095 days; each link is caused by the previous one.
        test_recipe:
          setup:
            - "Facility (threshold 10000) with ledger total 9900.0 (single ADD 9900.0); logical clock pinned at 2026-08-01T00:00:00Z so the audit due date is a literal"
          setup_api_calls:
            - call: "POST /psm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FacilityAdmin
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant", threshold_lbs: 10000 }
              as: FacilityAdmin
              captures: { fac: $.data.id, fac_v: $.data.version }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Olivia Operator" }
              as: FacilityAdmin
              captures: { emp: $.data.id }
            - call: "POST /psm/charge-adjustments"
              payload: { facility_id: "${fac}", adjustment_type: "ADD", quantity_lbs: 9900.0, reason: "initial charge", expected_facility_version: "${fac_v}" }
              as: Operator
              as_user_id: "${emp}"
            - call: "GET /psm/facilities/${fac}"
              as: FacilityAdmin
              captures: { fac_v2: $.data.version, tot_pre: $.data.total_charge_lbs, post_pre: $.data.charge_posture }
          trigger:
            - call: "POST /psm/charge-adjustments"
              payload: { facility_id: "${fac}", adjustment_type: "ADD", quantity_lbs: 150.0, reason: "top-up after expansion", expected_facility_version: "${fac_v2}" }
              as: Operator
              as_user_id: "${emp}"
            - call: "GET /psm/facilities/${fac}"
              as: FacilityAdmin
              captures: { tot: $.data.total_charge_lbs, post: $.data.charge_posture, psm: $.data.psm_program_status }
            - call: "GET /psm/compliance-audits"
              payload: { facility_id: "${fac}" }
              as: ComplianceOfficer
              captures: { a_due: "$.data[0].due_at", a_status: "$.data[0].status", a_origin: "$.data[0].origin" }
          assert:
            - "Pre-trigger: total_charge_lbs == 9900.0 and charge_posture == 'BELOW_THRESHOLD'"
            - "Post-trigger: Facility.total_charge_lbs == 10050.0"
            - "Facility.charge_posture == 'AT_OR_ABOVE_THRESHOLD' (link 2)"
            - "Facility.psm_program_status == 'REQUIRED' (link 3a)"
            - "Exactly one ComplianceAudit exists: origin == 'AUTO_THRESHOLD', status == 'SCHEDULED', due_at == '2029-07-31T00:00:00Z' (crossing at 2026-08-01 + 1095 days; link 3b)"

      - name: leak_confirm_cascade
        grounds:
          - state_machines.LeakEvent.SUSPECTED_to_CONFIRMED
          - calculations.notification_deadline
          - calculations.compliance_posture_score
          - entities.Incident.fields.source_leak_event_id
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger: leak confirm -> (1) leak
          fields set (status, notification_required, deadline) -> (2) Incident
          auto-created REPORTED with severity derived from release size ->
          (3) Facility.open_incident_count +1 recomputes posture_score 0 -> 3,
          flipping compliance_posture COMPLIANT -> DEGRADED.
        test_recipe:
          setup:
            - "Facility fully compliant (posture_score 0); system ER1; SUSPECTED leak with estimate 130.0; clock at 2026-08-10T09:00:00Z"
          setup_api_calls:
            - call: "POST /psm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Olivia Operator" }
              as: FacilityAdmin
              captures: { emp: $.data.id }
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "ER1", design_charge_lbs: 3000 }
              as: FacilityAdmin
              captures: { sys: $.data.id }
            - call: "POST /psm/leak-events"
              payload: { system_id: "${sys}", estimated_release_lbs: 130.0, source_description: "compressor seal weep" }
              as: Operator
              as_user_id: "${emp}"
              captures: { leak: $.data.id }
          trigger:
            - call: "POST /psm/leak-events/${leak}/confirm"
              payload: { final_release_lbs: 120.0 }
              as: ComplianceOfficer
              captures: { l_status: $.data.status, n_req: $.data.notification_required, n_deadline: $.data.notification_deadline_at, ainc: $.data.auto_incident_id }
            - call: "GET /psm/incidents/${ainc}"
              as: ComplianceOfficer
              captures: { i_sev: $.data.severity, i_status: $.data.status, i_rep: $.data.reported_by_employee_id }
            - call: "GET /psm/facilities/${fac}"
              as: ComplianceOfficer
              captures: { oic: $.data.open_incident_count, score: $.data.posture_score, cpost: $.data.compliance_posture }
          assert:
            - "LeakEvent.status == 'CONFIRMED', notification_required == true, notification_deadline_at == '2026-08-10T09:15:00Z' (confirmed_at + 15 min)"
            - "Auto-incident: severity == 'REPORTABLE' (120.0 >= RQ 100), status == 'REPORTED', reported_by_employee_id == null, source_leak_event_id == leak id"
            - "Facility.open_incident_count == 1 (link 2 effect)"
            - "Facility.posture_score == 3 and compliance_posture == 'DEGRADED' (link 3: 3*1 open incident)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: permit_issue_state_beats_safety_rejected
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - state_machines.HotWorkPermit.REQUESTED_to_ISSUED
        distinguishing_aspect: |
          Category pair (state vs business_safety): the permit is VOIDED
          (state violation) AND the contractor is SUSPENDED (safety
          violation); priority 5 wins — ERR_INVALID_STATE is returned, not
          ERR_CONTRACTOR_NOT_QUALIFIED.
        test_recipe:
          setup:
            - "Facility + system; contractor qualified then SUSPENDED; permit REQUESTED then VOIDED"
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "ER1", design_charge_lbs: 3000 }
              as: FacilityAdmin
              captures: { sys: $.data.id }
            - call: "POST /psm/contractors"
              payload: { company_name: "WeldPros Inc", safety_score: 80 }
              as: MaintenanceLead
              captures: { ctr: $.data.id }
            - call: "POST /psm/contractors/${ctr}/qualify"
              payload: { qualified_until: "2027-01-01T00:00:00Z" }
              as: MaintenanceLead
            - call: "POST /psm/contractors/${ctr}/suspend"
              as: MaintenanceLead
            - call: "POST /psm/hot-work-permits"
              payload: { facility_id: "${fac}", system_id: "${sys}", contractor_id: "${ctr}", work_description: "weld repair on discharge line", valid_from: "2026-09-01T08:00:00Z", valid_until: "2026-09-01T12:00:00Z" }
              as: ContractorRep
              as_user_id: "${ctr}"
              captures: { perm: $.data.id }
            - call: "POST /psm/hot-work-permits/${perm}/void"
              as: MaintenanceLead
          trigger:
            - call: "POST /psm/hot-work-permits/${perm}/issue"
              as: MaintenanceLead
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == 'ERR_INVALID_STATE' with http 409"
            - "NOT 'ERR_CONTRACTOR_NOT_QUALIFIED' — state (priority 5) beats business_safety (priority 6) when both fail"

      - name: permit_create_temporal_beats_constraint_rejected
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - entities.HotWorkPermit.fields.valid_until
        distinguishing_aspect: |
          Category pair (business_temporal vs business_constraint): the new
          permit both inverts its window (valid_from > valid_until) AND
          overlaps an existing REQUESTED permit; priority 7 wins —
          ERR_INVALID_WINDOW is returned, not ERR_PERMIT_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "Facility + system + contractor; existing permit P1 REQUESTED with window 2026-09-01T08:00:00Z .. 2026-09-01T17:00:00Z"
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "ER1", design_charge_lbs: 3000 }
              as: FacilityAdmin
              captures: { sys: $.data.id }
            - call: "POST /psm/contractors"
              payload: { company_name: "WeldPros Inc", safety_score: 80 }
              as: MaintenanceLead
              captures: { ctr: $.data.id }
            - call: "POST /psm/hot-work-permits"
              payload: { facility_id: "${fac}", system_id: "${sys}", contractor_id: "${ctr}", work_description: "P1 morning weld", valid_from: "2026-09-01T08:00:00Z", valid_until: "2026-09-01T17:00:00Z" }
              as: ContractorRep
              as_user_id: "${ctr}"
              captures: { p1: $.data.id, p1_status: $.data.status }
          trigger:
            - call: "POST /psm/hot-work-permits"
              payload: { facility_id: "${fac}", system_id: "${sys}", contractor_id: "${ctr}", work_description: "P2 inverted window overlapping P1", valid_from: "2026-09-01T12:00:00Z", valid_until: "2026-09-01T09:00:00Z" }
              as: ContractorRep
              as_user_id: "${ctr}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == 'ERR_INVALID_WINDOW' with http 422"
            - "NOT 'ERR_PERMIT_WINDOW_CONFLICT' — business_temporal (priority 7) beats business_constraint (priority 8) when both fail"
            - "P1 remains status == 'REQUESTED' and no second permit is persisted"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: charge_posture_exactly_at_threshold
        grounds:
          - calculations.facility_charge_rollup
          - entities.Facility.fields.charge_posture
        distinguishing_aspect: |
          Metric total_charge_lbs via POST /psm/charge-adjustments: exactly
          10000.0 lbs (== threshold, not above) trips AT_OR_ABOVE_THRESHOLD —
          the comparison is >=, and the full threshold cascade fires.
        test_recipe:
          setup:
            - "Facility threshold 10000; clock pinned 2026-08-01T00:00:00Z; empty ledger"
          setup_api_calls:
            - call: "POST /psm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FacilityAdmin
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant", threshold_lbs: 10000 }
              as: FacilityAdmin
              captures: { fac: $.data.id, fac_v: $.data.version }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Olivia Operator" }
              as: FacilityAdmin
              captures: { emp: $.data.id }
          trigger:
            - call: "POST /psm/charge-adjustments"
              payload: { facility_id: "${fac}", adjustment_type: "ADD", quantity_lbs: 5000.0, reason: "vessel charge 1", expected_facility_version: "${fac_v}" }
              as: Operator
              as_user_id: "${emp}"
            - call: "GET /psm/facilities/${fac}"
              as: FacilityAdmin
              captures: { fac_v2: $.data.version }
            - call: "POST /psm/charge-adjustments"
              payload: { facility_id: "${fac}", adjustment_type: "ADD", quantity_lbs: 5000.0, reason: "vessel charge 2", expected_facility_version: "${fac_v2}" }
              as: Operator
              as_user_id: "${emp}"
            - call: "GET /psm/facilities/${fac}"
              as: FacilityAdmin
              captures: { tot: $.data.total_charge_lbs, post: $.data.charge_posture, psm: $.data.psm_program_status }
          assert:
            - "Facility.total_charge_lbs == 10000.0 exactly"
            - "Facility.charge_posture == 'AT_OR_ABOVE_THRESHOLD' — exactly-at-threshold qualifies (>=), a '>' implementation would stay BELOW_THRESHOLD"
            - "Facility.psm_program_status == 'REQUIRED' and one AUTO_THRESHOLD ComplianceAudit with due_at == '2029-07-31T00:00:00Z' exists"

      - name: leak_release_exactly_at_rq
        grounds:
          - calculations.notification_deadline
          - entities.LeakEvent.fields.notification_required
        distinguishing_aspect: |
          Metric final_release_lbs via POST /psm/leak-events/{id}/confirm:
          exactly 100.0 lbs (== RQ, not above) makes notification_required
          true and the auto-incident REPORTABLE — a different metric and
          endpoint than the charge threshold boundary.
        test_recipe:
          setup:
            - "Facility + system + operator; SUSPECTED leak; clock at 2026-08-10T09:00:00Z"
          setup_api_calls:
            - call: "POST /psm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Olivia Operator" }
              as: FacilityAdmin
              captures: { emp: $.data.id }
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "ER1", design_charge_lbs: 3000 }
              as: FacilityAdmin
              captures: { sys: $.data.id }
            - call: "POST /psm/leak-events"
              payload: { system_id: "${sys}", estimated_release_lbs: 110.0, source_description: "PRV lift" }
              as: Operator
              as_user_id: "${emp}"
              captures: { leak: $.data.id }
          trigger:
            - call: "POST /psm/leak-events/${leak}/confirm"
              payload: { final_release_lbs: 100.0 }
              as: ComplianceOfficer
              captures: { n_req: $.data.notification_required, n_status: $.data.notification_status, n_deadline: $.data.notification_deadline_at, ainc: $.data.auto_incident_id }
            - call: "GET /psm/incidents/${ainc}"
              as: ComplianceOfficer
              captures: { i_sev: $.data.severity }
          assert:
            - "notification_required == true — exactly 100.0 lbs qualifies (>= RQ)"
            - "notification_status == 'PENDING' and notification_deadline_at == '2026-08-10T09:15:00Z'"
            - "Auto-incident severity == 'REPORTABLE' (100.0 >= 100 boundary)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: permit_issue_requires_contractor_qualified
        grounds:
          - state_machines.HotWorkPermit.REQUESTED_to_ISSUED
          - entities.Contractor.fields.qualification_status
          - validations[priority=6]
        distinguishing_aspect: |
          Entity pair HotWorkPermit -> Contractor: the REQUESTED -> ISSUED
          transition is gated on Contractor.qualification_status == QUALIFIED;
          PENDING blocks with ERR_CONTRACTOR_NOT_QUALIFIED, and the identical
          call succeeds after qualify flips the contractor.
        test_recipe:
          setup:
            - "Facility + system; contractor in PENDING; permit REQUESTED with clean window"
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "ER1", design_charge_lbs: 3000 }
              as: FacilityAdmin
              captures: { sys: $.data.id }
            - call: "POST /psm/contractors"
              payload: { company_name: "WeldPros Inc", safety_score: 80 }
              as: MaintenanceLead
              captures: { ctr: $.data.id }
            - call: "POST /psm/hot-work-permits"
              payload: { facility_id: "${fac}", system_id: "${sys}", contractor_id: "${ctr}", work_description: "weld repair", valid_from: "2026-09-01T08:00:00Z", valid_until: "2026-09-01T12:00:00Z" }
              as: ContractorRep
              as_user_id: "${ctr}"
              captures: { perm: $.data.id }
          trigger:
            - call: "POST /psm/hot-work-permits/${perm}/issue"
              as: MaintenanceLead
              captures: { err: $.data.error_id }
            - call: "POST /psm/contractors/${ctr}/qualify"
              payload: { qualified_until: "2027-06-01T00:00:00Z" }
              as: MaintenanceLead
            - call: "POST /psm/hot-work-permits/${perm}/issue"
              as: MaintenanceLead
              captures: { st: $.data.status }
          assert:
            - "First issue: error_id == 'ERR_CONTRACTOR_NOT_QUALIFIED' (http 422) — PENDING contractor blocks the transition"
            - "After qualify: identical issue succeeds with permit status == 'ISSUED'"
            - "Only the Contractor entity's state changed between the two calls (permit untouched)"

      - name: incident_close_requires_actions_verified
        grounds:
          - state_machines.Incident.ACTIONS_ASSIGNED_to_CLOSED
          - entities.Incident.fields.pending_action_count
          - state_machines.CorrectiveAction.COMPLETED_to_VERIFIED
        distinguishing_aspect: |
          Entity pair Incident -> CorrectiveAction: close from ACTIONS_ASSIGNED
          is gated on every child action being VERIFIED; a COMPLETED-but-
          unverified action yields ERR_ACTIONS_OPEN, and only after verify does
          the identical close succeed.
        test_recipe:
          setup:
            - "Facility with employees R, I, A; incident REPORTED -> UNDER_INVESTIGATION (investigator I); one corrective action assigned to A (incident -> ACTIONS_ASSIGNED)"
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Rita Reporter" }
              as: FacilityAdmin
              captures: { emp_r: $.data.id }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Ivan Investigator" }
              as: FacilityAdmin
              captures: { emp_i: $.data.id }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Andy Assignee" }
              as: FacilityAdmin
              captures: { emp_a: $.data.id }
            - call: "POST /psm/incidents"
              payload: { facility_id: "${fac}", severity: "RECORDABLE", description: "oil leak with ammonia trace", reported_by_employee_id: "${emp_r}" }
              as: Operator
              as_user_id: "${emp_r}"
              captures: { inc: $.data.id }
            - call: "POST /psm/incidents/${inc}/assign-investigator"
              payload: { investigator_employee_id: "${emp_i}" }
              as: ComplianceOfficer
            - call: "POST /psm/corrective-actions"
              payload: { incident_id: "${inc}", description: "replace compressor gasket", assignee_employee_id: "${emp_a}", due_at: "2026-08-20T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ca: $.data.id }
          trigger:
            - call: "POST /psm/corrective-actions/${ca}/complete"
              as: Operator
              as_user_id: "${emp_a}"
              captures: { ca_st1: $.data.status }
            - call: "POST /psm/incidents/${inc}/close"
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
            - call: "POST /psm/corrective-actions/${ca}/verify"
              as: Operator
              as_user_id: "${emp_i}"
              captures: { ca_st2: $.data.status }
            - call: "POST /psm/incidents/${inc}/close"
              as: ComplianceOfficer
              captures: { inc_st: $.data.status }
          assert:
            - "Action completion yields status == 'COMPLETED'"
            - "Close with the action COMPLETED-but-unverified fails: error_id == 'ERR_ACTIONS_OPEN' (http 409)"
            - "Verify (by investigator) yields status == 'VERIFIED'"
            - "Retry close succeeds: incident status == 'CLOSED' — the gate reads CorrectiveAction state, not incident-local data"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: permit_half_open_window_overlap
        grounds:
          - calculations.drill_gap_check
          - validations[priority=8]
          - entities.HotWorkPermit.fields.valid_from
        distinguishing_aspect: |
          Resource RefrigerationSystem with half-open interval semantics
          [valid_from, valid_until): a permit starting exactly when another
          ends (12:00 == 12:00) is ALLOWED, while a 30-minute interior overlap
          is rejected with ERR_PERMIT_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "Facility + system + contractor; no permits yet"
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "ER1", design_charge_lbs: 3000 }
              as: FacilityAdmin
              captures: { sys: $.data.id }
            - call: "POST /psm/contractors"
              payload: { company_name: "WeldPros Inc", safety_score: 80 }
              as: MaintenanceLead
              captures: { ctr: $.data.id }
          trigger:
            - call: "POST /psm/hot-work-permits"
              payload: { facility_id: "${fac}", system_id: "${sys}", contractor_id: "${ctr}", work_description: "P1 08-12", valid_from: "2026-09-01T08:00:00Z", valid_until: "2026-09-01T12:00:00Z" }
              as: ContractorRep
              as_user_id: "${ctr}"
              captures: { p1: $.data.id, p1_st: $.data.status }
            - call: "POST /psm/hot-work-permits"
              payload: { facility_id: "${fac}", system_id: "${sys}", contractor_id: "${ctr}", work_description: "P2 12-16 adjacent", valid_from: "2026-09-01T12:00:00Z", valid_until: "2026-09-01T16:00:00Z" }
              as: ContractorRep
              as_user_id: "${ctr}"
              captures: { p2: $.data.id, p2_st: $.data.status }
            - call: "POST /psm/hot-work-permits"
              payload: { facility_id: "${fac}", system_id: "${sys}", contractor_id: "${ctr}", work_description: "P3 11:30-13:00 overlapping", valid_from: "2026-09-01T11:30:00Z", valid_until: "2026-09-01T13:00:00Z" }
              as: ContractorRep
              as_user_id: "${ctr}"
              captures: { err: $.data.error_id }
          assert:
            - "P1 and P2 both persist with status == 'REQUESTED' (adjacent windows: 12:00 == 12:00 does not overlap under half-open semantics)"
            - "P3 rejected: error_id == 'ERR_PERMIT_WINDOW_CONFLICT' (http 409) — [11:30,13:00) intersects [08:00,12:00)"

      - name: drill_quiet_gap_buffer
        grounds:
          - calculations.drill_gap_check
          - entities.DrillEvent.fields.scheduled_start_at
        distinguishing_aspect: |
          Resource Facility with buffer-gap semantics (NOT half-open overlap):
          drills must keep a 24h quiet gap; a drill starting exactly 24h after
          another ends is ALLOWED, while 1h of separation is rejected with
          ERR_DRILL_GAP_VIOLATION — a different interval geometry on a
          different resource than the permit rule.
        test_recipe:
          setup:
            - "Facility with no drills"
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
          trigger:
            - call: "POST /psm/drill-events"
              payload: { facility_id: "${fac}", drill_type: "TABLETOP", scheduled_start_at: "2026-09-10T09:00:00Z", scheduled_end_at: "2026-09-10T11:00:00Z" }
              as: PsCoordinator
              captures: { d1: $.data.id, d1_st: $.data.status }
            - call: "POST /psm/drill-events"
              payload: { facility_id: "${fac}", drill_type: "FIELD", scheduled_start_at: "2026-09-11T11:00:00Z", scheduled_end_at: "2026-09-11T12:00:00Z" }
              as: PsCoordinator
              captures: { d2: $.data.id, d2_st: $.data.status }
            - call: "POST /psm/drill-events"
              payload: { facility_id: "${fac}", drill_type: "EVACUATION", scheduled_start_at: "2026-09-11T13:00:00Z", scheduled_end_at: "2026-09-11T14:00:00Z" }
              as: PsCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "D1 and D2 persist with status == 'PLANNED' — exactly 24h separation (11:00 -> 11:00 next day) is allowed (>= boundary)"
            - "D3 rejected: error_id == 'ERR_DRILL_GAP_VIOLATION' (http 409) — only 1h after D2 ends, inside the quiet buffer"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: charge_add_remove_conservation
        grounds:
          - calculations.facility_charge_rollup
          - entities.Facility.fields.total_charge_lbs
        distinguishing_aspect: |
          Conserved quantity: Facility.total_charge_lbs (book charge mass).
          ADD 300.0 followed by REMOVE 300.0 (the compensating entry) restores
          the ledger total to exactly its pre-pair value of 2000.0; only
          Facility.version advances.
        test_recipe:
          setup:
            - "Facility with empty ledger; one operator employee"
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id, fac_v: $.data.version }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Olivia Operator" }
              as: FacilityAdmin
              captures: { emp: $.data.id }
            - call: "POST /psm/charge-adjustments"
              payload: { facility_id: "${fac}", adjustment_type: "ADD", quantity_lbs: 2000.0, reason: "initial charge", expected_facility_version: "${fac_v}" }
              as: Operator
              as_user_id: "${emp}"
            - call: "GET /psm/facilities/${fac}"
              as: FacilityAdmin
              captures: { fac_v2: $.data.version, tot0: $.data.total_charge_lbs }
          trigger:
            - call: "POST /psm/charge-adjustments"
              payload: { facility_id: "${fac}", adjustment_type: "ADD", quantity_lbs: 300.0, reason: "top-up", expected_facility_version: "${fac_v2}" }
              as: Operator
              as_user_id: "${emp}"
            - call: "GET /psm/facilities/${fac}"
              as: FacilityAdmin
              captures: { fac_v3: $.data.version, tot_mid: $.data.total_charge_lbs }
            - call: "POST /psm/charge-adjustments"
              payload: { facility_id: "${fac}", adjustment_type: "REMOVE", quantity_lbs: 300.0, reason: "reverse erroneous top-up", expected_facility_version: "${fac_v3}" }
              as: Operator
              as_user_id: "${emp}"
            - call: "GET /psm/facilities/${fac}"
              as: FacilityAdmin
              captures: { tot_end: $.data.total_charge_lbs, post_end: $.data.charge_posture, ver_end: $.data.version }
          assert:
            - "Pre-pair total_charge_lbs == 2000.0; mid-pair == 2300.0"
            - "Post-pair total_charge_lbs == 2000.0 exactly — forward + compensating action conserve book charge mass"
            - "charge_posture == 'BELOW_THRESHOLD' (unchanged)"
            - "Facility.version == 4 (1 create + 3 adjustments; version is NOT part of the conserved quantity)"

      - name: corrective_action_pending_count_conservation
        grounds:
          - state_machines.CorrectiveAction.OPEN_to_COMPLETED
          - state_machines.CorrectiveAction.COMPLETED_to_OPEN
          - entities.Incident.fields.pending_action_count
        distinguishing_aspect: |
          Conserved quantity: Incident.pending_action_count (count of actions
          with status != VERIFIED). complete() then reject() on the same action
          is a forward/compensating pair — the count returns to exactly 2; a
          different conserved quantity (cardinality) than the charge mass
          invariant.
        test_recipe:
          setup:
            - "Facility with employees R, I, A1, A2; incident UNDER_INVESTIGATION -> ACTIONS_ASSIGNED with two OPEN actions (pending_action_count == 2)"
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Rita Reporter" }
              as: FacilityAdmin
              captures: { emp_r: $.data.id }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Ivan Investigator" }
              as: FacilityAdmin
              captures: { emp_i: $.data.id }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Andy One" }
              as: FacilityAdmin
              captures: { emp_a1: $.data.id }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Andy Two" }
              as: FacilityAdmin
              captures: { emp_a2: $.data.id }
            - call: "POST /psm/incidents"
              payload: { facility_id: "${fac}", severity: "RECORDABLE", description: "packing gland leak", reported_by_employee_id: "${emp_r}" }
              as: Operator
              as_user_id: "${emp_r}"
              captures: { inc: $.data.id }
            - call: "POST /psm/incidents/${inc}/assign-investigator"
              payload: { investigator_employee_id: "${emp_i}" }
              as: ComplianceOfficer
            - call: "POST /psm/corrective-actions"
              payload: { incident_id: "${inc}", description: "replace packing", assignee_employee_id: "${emp_a1}", due_at: "2026-08-20T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ca1: $.data.id }
            - call: "POST /psm/corrective-actions"
              payload: { incident_id: "${inc}", description: "torque check", assignee_employee_id: "${emp_a2}", due_at: "2026-08-21T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ca2: $.data.id }
            - call: "GET /psm/incidents/${inc}"
              as: ComplianceOfficer
              captures: { pc0: $.data.pending_action_count }
          trigger:
            - call: "POST /psm/corrective-actions/${ca1}/complete"
              as: Operator
              as_user_id: "${emp_a1}"
            - call: "GET /psm/incidents/${inc}"
              as: ComplianceOfficer
              captures: { pc1: $.data.pending_action_count }
            - call: "POST /psm/corrective-actions/${ca1}/reject"
              as: Operator
              as_user_id: "${emp_i}"
            - call: "GET /psm/incidents/${inc}"
              as: ComplianceOfficer
              captures: { pc2: $.data.pending_action_count }
            - call: "GET /psm/corrective-actions/${ca1}"
              as: ComplianceOfficer
              captures: { ca1_st: $.data.status }
          assert:
            - "Baseline pending_action_count == 2"
            - "After complete: pending_action_count == 1"
            - "After reject (compensating action): pending_action_count == 2 — the conserved count is restored exactly"
            - "CorrectiveAction.${ca1}.status == 'OPEN' after the round trip"
