        payload: {solicitation_month: 2026-08, submission_deadline: '2026-08-20', on_sale_month: 2026-10,
          max_slots: 5}
        as: SalesDirector
        captures: {cat: $.data.id, cv: $.data.version}
      - call: GET /comics/catalogs/${cat}
        payload: {}
        as: SalesDirector
      - call: GET /comics/catalogs
        payload: {status: OPEN, limit: 100, offset: 0}
