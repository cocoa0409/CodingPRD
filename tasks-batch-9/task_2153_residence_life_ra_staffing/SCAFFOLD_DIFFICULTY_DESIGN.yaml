  - rule_id: non_linear_state_machine
    instances:

      - name: ra_employment_and_certification_are_independent_parallel_dimensions
        grounds:
          - state_machines.RA.ACTIVE_to_SUSPENDED
          - state_machines.RA.SUSPENDED_to_ACTIVE
          - state_machines.RA.CERTIFIED_to_LAPSED
          - entities.RA.fields.employment_status
          - entities.RA.fields.certification_status
        distinguishing_aspect: |
          RA carries two parallel state dimensions on one row: SUSPEND then REINSTATE moves
          employment PROVISIONAL->ACTIVE->SUSPENDED->ACTIVE while a LAPSE issued in between
          moves certification CERTIFIED->LAPSED, and neither endpoint ever writes the other
          dimension, so the row ends at (ACTIVE, LAPSED) - a combination no linear machine
          can express.
        test_recipe:
          setup:
            - "Kerr Hall floor 2 with an RA whose employment_status is ACTIVE and certification_status is CERTIFIED (12 training credits, all three mandatory modules)."
          setup_api_calls:
            - call: "POST /residence-life/buildings"
              payload: { name: "Kerr Hall", code: "KERR", campus_zone: "NORTH" }
