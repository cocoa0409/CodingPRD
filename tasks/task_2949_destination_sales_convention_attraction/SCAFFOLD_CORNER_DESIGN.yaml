# SCAFFOLD_CORNER_DESIGN.yaml - Section 1.9 breadth probe for
# task_2949_destination_sales_convention_attraction.
#
# Walks references/claim-extraction-guide.md row by row against this scaffold's
# 1.1-1.7 surface. Every instance is reachable from an empty database using only
# endpoints declared in SCAFFOLD.yaml 1.5; the logical clock is pinned first in
# every chain so that all literals below are deterministic.
#
# Conventions used throughout:
#   * `as:` names a role from 1.7; `as_user_id:` pins the X-User-ID header when
#     identity matters (entity_backed roles and segregation of duties).
#   * negative triggers capture $.data.error_id and state the expected HTTP status.
#   * corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
#     `excluded_because:` stubs naming the covering 1.8 instance.

scaffold_corner_design:
  - section: entities
    instances:
      - name: meeting_planner_creation_applies_every_declared_default
        claim_type: creation
        grounds:
          - entities.MeetingPlanner
          - endpoints[POST /meeting-planners]
        distinguishing_aspect: "Creating a planner with only org_name and contact_email must materialise all nine derived/defaulted fields - legacy counters 0, definite_count 0, lost_count 0, lifetime_definite_room_nights 0, both scores 0, tier TIER_C, engagement_status PROSPECT, last_touch_at null - plus the common fields with version 1."
        test_recipe:
          setup:
            - "empty database with the logical clock pinned at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "POST /meeting-planners"
              payload: { org_name: "Continental Dental Assembly", contact_email: "meetings@cda.org" }
              as: BureauAdmin
              captures: { planner_id: $.data.id, tier: $.data.tier, engagement: $.data.engagement_status, score_lifetime: $.data.relationship_score_lifetime, score_rolling: $.data.relationship_score_rolling_24m, touch: $.data.last_touch_at, ver: $.data.version, created: $.data.created_at }
          assert:
            - "HTTP 201 and response_type == object"
            - "${tier} == TIER_C, ${engagement} == PROSPECT, ${score_lifetime} == 0, ${score_rolling} == 0"
            - "${touch} == null and ${ver} == 1 and ${created} == 2026-08-01T00:00:00Z"
            - "definite_count == 0, lost_count == 0, lifetime_definite_room_nights == 0, legacy_definite_count == 0, legacy_definite_room_nights == 0"
            - "${planner_id} is a server-minted identifier - the client never supplies it"

      - name: hotel_retrieval_returns_the_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - entities.Hotel
          - endpoints[GET /hotels/{id}]
        distinguishing_aspect: "GET /hotels/{id} echoes the stored input fields verbatim (name, committable_rooms 600, walk_distance_blocks 2, participation_status PARTICIPATING) and the three zeroed counters, without recomputing anything."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; one hotel registered"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /hotels"
              payload: { name: "Harborview Grand", committable_rooms: 600, walk_distance_blocks: 2 }
              as: BureauAdmin
              captures: { hotel_id: $.data.id }
          trigger:
            - call: "GET /hotels/${hotel_id}"
              payload: {}
              as: SalesManager
              captures: { name: $.data.name, rooms: $.data.committable_rooms, blocks: $.data.walk_distance_blocks, status: $.data.participation_status, peak: $.data.committed_peak_rooms, nights: $.data.committed_room_nights, pickup: $.data.pickup_room_nights }
          assert:
            - "HTTP 200, ${name} == Harborview Grand, ${rooms} == 600, ${blocks} == 2"
            - "${status} == PARTICIPATING (the declared default)"
            - "${peak} == 0, ${nights} == 0, ${pickup} == 0"

      - name: center_hall_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /center-halls]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three halls registered, GET /center-halls?limit=2&offset=0 returns exactly 2 rows with total_count 3 and has_more true, and offset=2 returns 1 row with has_more false; the envelope carries response_type array plus limit/offset/total_count/has_more."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; three halls registered in a fixed order"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /center-halls"
              payload: { name: "Grand Hall A", exhibit_sqft: 250000, capacity_persons: 12000, turnaround_hours: 48 }
              as: BureauAdmin
              captures: { hall_a_id: $.data.id }
            - call: "POST /center-halls"
              payload: { name: "Grand Hall B", exhibit_sqft: 180000, capacity_persons: 9000, turnaround_hours: 48 }
              as: BureauAdmin
              captures: { hall_b_id: $.data.id }
            - call: "POST /center-halls"
              payload: { name: "Ballroom C", exhibit_sqft: 40000, capacity_persons: 3000, turnaround_hours: 24 }
              as: BureauAdmin
              captures: { hall_c_id: $.data.id }
          trigger:
            - call: "GET /center-halls?limit=2&offset=0"
              payload: {}
              as: CenterScheduler
              captures: { first_name: "$.data[0].name", second_name: "$.data[1].name" }
            - call: "GET /center-halls?limit=2&offset=2"
              payload: {}
              as: CenterScheduler
              captures: { third_name: "$.data[0].name" }
          assert:
            - "page 1: HTTP 200, response_type == array, 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "page 2: 1 row, total_count == 3, has_more == false, offset == 2"
            - "${first_name}, ${second_name} and ${third_name} are three distinct halls - no row is repeated or skipped across the two pages"

      - name: opportunity_get_with_unknown_id_returns_opportunity_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /opportunities/{id}]
          - errors[ERR_OPPORTUNITY_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unknown identifier must yield the entity-specific 404 ERR_OPPORTUNITY_NOT_FOUND in the error envelope, not a generic 404 body and not ERR_VALIDATION."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; no opportunity exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "GET /opportunities/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and ${err} == ERR_OPPORTUNITY_NOT_FOUND"
            - "response_type == error and data carries error_id plus message only"

      - name: opportunity_creation_missing_required_field_returns_validation
        claim_type: required_fields
        grounds:
          - endpoints[POST /opportunities]
          - validations[priority 4 ERR_VALIDATION]
        distinguishing_aspect: "Omitting rate_ceiling_amount - a required input with no default - must fail with ERR_VALIDATION (400) before any FK or business check runs, and must not create a row."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; planner registered"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /meeting-planners"
              payload: { org_name: "Continental Dental Assembly", contact_email: "meetings@cda.org" }
              as: BureauAdmin
              captures: { planner_id: $.data.id }
          trigger:
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "CDA Annual 2028", arrival_date: "2028-04-10", departure_date: "2028-04-12", peak_rooms_requested: 1000, total_room_nights_requested: 1800, attendance_estimate: 8000, exhibit_sqft_requested: 200000 }
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and ${err} == ERR_VALIDATION"
            - "GET /opportunities returns total_count == 0"

      - name: center_hall_omitted_optional_inputs_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.CenterHall.fields.turnaround_hours
          - entities.CenterHall.fields.hall_status
        distinguishing_aspect: "Omitting turnaround_hours and hall_status yields 48 and AVAILABLE respectively; the 48-hour default is what every buffered-window conflict test later depends on, so it must come from the constant and not from a per-request value."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "POST /center-halls"
              payload: { name: "Grand Hall A", exhibit_sqft: 250000, capacity_persons: 12000 }
              as: CenterScheduler
              captures: { turnaround: $.data.turnaround_hours, hall_status: $.data.hall_status, confirmed: $.data.confirmed_hold_count }
          assert:
            - "HTTP 201, ${turnaround} == 48, ${hall_status} == AVAILABLE, ${confirmed} == 0"

      - name: opportunity_event_nights_computed_from_the_half_open_date_range
        claim_type: computed_fields
        grounds:
          - entities.Opportunity.fields.event_nights
          - calculations.hotel_nightly_block_capacity
        distinguishing_aspect: "event_nights is derived as departure_date - arrival_date over the half-open range, so 2028-04-10 -> 2028-04-12 is 2 nights (not 3); every room-night and attrition figure downstream multiplies by this value."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; planner registered"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /meeting-planners"
              payload: { org_name: "Continental Dental Assembly", contact_email: "meetings@cda.org" }
              as: BureauAdmin
              captures: { planner_id: $.data.id }
          trigger:
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "CDA Annual 2028", arrival_date: "2028-04-10", departure_date: "2028-04-12", peak_rooms_requested: 1000, total_room_nights_requested: 1800, attendance_estimate: 8000, exhibit_sqft_requested: 200000, rate_ceiling_amount: 219.00 }
              as: SalesManager
              captures: { nights: $.data.event_nights, stage: $.data.sales_stage, posture: $.data.hold_posture, coverage: $.data.block_coverage_pct }
          assert:
            - "HTTP 201 and ${nights} == 2"
            - "${stage} == LEAD, ${posture} == NONE, ${coverage} == 0.00"
            - "definite_room_nights == 0, definite_at == null, lost_reason == null, attrition_settlement_amount == 0.00"

      - name: space_hold_expiry_is_system_stamped_from_the_clock
        claim_type: system_fields
        grounds:
          - entities.SpaceHold.fields.expires_at
          - global_constants.FIRST_HOLD_DAYS
        distinguishing_aspect: "expires_at is a system field: it is not in POST /space-holds' input list and is stamped as clock + FIRST_HOLD_DAYS (90) - 2026-08-01T00:00:00Z becomes 2026-10-30T00:00:00Z - so moving the clock before the call changes it while no request field can."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; hall and QUALIFIED opportunity exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /meeting-planners"
              payload: { org_name: "Continental Dental Assembly", contact_email: "meetings@cda.org" }
              as: BureauAdmin
              captures: { planner_id: $.data.id }
            - call: "POST /center-halls"
              payload: { name: "Grand Hall A", exhibit_sqft: 250000, capacity_persons: 12000, turnaround_hours: 48 }
              as: BureauAdmin
              captures: { hall_id: $.data.id }
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "CDA Annual 2028", arrival_date: "2028-04-10", departure_date: "2028-04-12", peak_rooms_requested: 1000, total_room_nights_requested: 1800, attendance_estimate: 8000, exhibit_sqft_requested: 200000, rate_ceiling_amount: 219.00 }
              as: SalesManager
              captures: { opp_id: $.data.id }
            - call: "POST /opportunities/${opp_id}/qualify"
              payload: {}
              as: SalesManager
          trigger:
            - call: "POST /space-holds"
              payload: { opportunity_id: "${opp_id}", center_hall_id: "${hall_id}", move_in_start: "2028-04-08T00:00:00Z", move_out_end: "2028-04-13T00:00:00Z" }
              as: CenterScheduler
              captures: { expiry: $.data.expires_at, rank: $.data.hold_rank, status: $.data.status, deadline: $.data.challenge_deadline, reason: $.data.release_reason }
          assert:
            - "HTTP 201, ${expiry} == 2026-10-30T00:00:00Z, ${rank} == FIRST, ${status} == HELD"
            - "${deadline} == null and ${reason} == null"
            - "expires_at is absent from POST /space-holds input, so no request field can set it"

      - name: support_letter_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.SupportLetter
          - endpoints[POST /bid-packages/{id}/support-letters]
          - endpoints[GET /bid-packages/{id}/support-letters]
        distinguishing_aspect: "SupportLetter is declared common_fields: false, so its rows expose id / bid_package_id / organization_name / letter_type / received_at only - no version and no updated_at - and 1.5 declares no update or delete endpoint for them; the row can only be appended and read."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; QUALIFIED opportunity with a DRAFT bid package"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /meeting-planners"
              payload: { org_name: "Continental Dental Assembly", contact_email: "meetings@cda.org" }
              as: BureauAdmin
              captures: { planner_id: $.data.id }
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "CDA Annual 2028", arrival_date: "2028-04-10", departure_date: "2028-04-12", peak_rooms_requested: 1000, total_room_nights_requested: 1800, attendance_estimate: 8000, exhibit_sqft_requested: 200000, rate_ceiling_amount: 219.00 }
              as: SalesManager
              captures: { opp_id: $.data.id }
            - call: "POST /opportunities/${opp_id}/qualify"
              payload: {}
              as: SalesManager
              captures: { opp_v: $.data.version }
            - call: "POST /bid-packages"
              payload: { opportunity_id: "${opp_id}", expected_opportunity_version: "${opp_v}" }
              as: SalesManager
              captures: { bid_id: $.data.id }
          trigger:
            - call: "POST /bid-packages/${bid_id}/support-letters"
              payload: { organization_name: "Office of the Mayor", letter_type: "MAYOR" }
              as: SalesManager
              captures: { letter_id: $.data.id, ltype: $.data.letter_type, received: $.data.received_at }
            - call: "GET /bid-packages/${bid_id}/support-letters"
              payload: {}
              as: SalesManager
              captures: { listed_id: "$.data[0].id" }
          assert:
            - "HTTP 201, ${ltype} == MAYOR, ${received} == 2026-08-01T00:00:00Z"
            - "the response body has no version and no updated_at field"
            - "${listed_id} == ${letter_id} and the list has total_count == 1"
            - "BidPackage.${bid_id}.support_letter_type_count == 1 - the parent's derived counter moves even though the child is immutable"

      - name: support_letter_against_unknown_bid_package_returns_bid_not_found
        claim_type: parent_relationships
        grounds:
          - entities.SupportLetter.parent
          - errors[ERR_BID_PACKAGE_NOT_FOUND]
        distinguishing_aspect: "A child of a common_fields: false entity must validate its parent path segment: posting a letter under an unknown bid package id yields 404 ERR_BID_PACKAGE_NOT_FOUND rather than creating an orphan row."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; no bid package exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "POST /bid-packages/00000000-0000-0000-0000-000000000000/support-letters"
              payload: { organization_name: "Office of the Mayor", letter_type: "MAYOR" }
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and ${err} == ERR_BID_PACKAGE_NOT_FOUND"

      - name: opportunity_with_unknown_planner_fk_returns_planner_not_found
        claim_type: graph_topology
        grounds:
          - entities.Opportunity.fields.planner_id
          - errors[ERR_PLANNER_NOT_FOUND]
          - complexity_profile.entity_topology
        distinguishing_aspect: "In a graph topology every FK is validated on write: an opportunity naming an unknown planner_id is refused with ERR_PLANNER_NOT_FOUND (404), which is distinct from the 400 a malformed body would produce."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; no planner exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "POST /opportunities"
              payload: { planner_id: "00000000-0000-0000-0000-000000000000", event_name: "Phantom Congress", arrival_date: "2028-04-10", departure_date: "2028-04-12", peak_rooms_requested: 100, total_room_nights_requested: 200, attendance_estimate: 500, exhibit_sqft_requested: 1000, rate_ceiling_amount: 199.00 }
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and ${err} == ERR_PLANNER_NOT_FOUND"
            - "GET /opportunities returns total_count == 0"

      - name: opportunity_reversed_dates_and_bad_enum_fail_type_constraints
        claim_type: type_constraints
        grounds:
          - validations[priority 4 ERR_VALIDATION]
          - entities.Opportunity.fields.arrival_date
          - entities.ServicingOrder.fields.category
        distinguishing_aspect: "Two shape rules are enforced by the same priority-4 gate: arrival_date must be strictly before departure_date, and category must be a declared enum member; both return ERR_VALIDATION (400), never a 422 business error."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; planner registered"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /meeting-planners"
              payload: { org_name: "Continental Dental Assembly", contact_email: "meetings@cda.org" }
              as: BureauAdmin
              captures: { planner_id: $.data.id }
          trigger:
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "Backwards Congress", arrival_date: "2028-04-12", departure_date: "2028-04-10", peak_rooms_requested: 100, total_room_nights_requested: 200, attendance_estimate: 500, exhibit_sqft_requested: 1000, rate_ceiling_amount: 199.00 }
              as: SalesManager
              captures: { err_dates: $.data.error_id }
          assert:
            - "HTTP 400 and ${err_dates} == ERR_VALIDATION"
            - "a POST /servicing-orders with category CATERING (not a declared member) also returns HTTP 400 ERR_VALIDATION"
            - "a POST /center-halls with exhibit_sqft 0 (declared >= 1) also returns HTTP 400 ERR_VALIDATION"

      - name: lodging_tax_receipts_are_listed_scoped_to_their_own_fund
        claim_type: listing
        grounds:
          - entities.LodgingTaxReceipt
          - endpoints[GET /incentive-funds/{id}/lodging-tax-receipts]
        distinguishing_aspect: "Receipts are children of one fund: two receipts on fund FY2028 and one on fund FY2029 must never mix, and each fund's budget_amount and lodging_tax_receipts_total move only for its own rows (503400.00 / 3400.00 versus 100500.00 / 500.00)."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; two funds: FY2028 budget 500000.00 and FY2029 budget 100000.00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /incentive-funds"
              payload: { fiscal_year: 2028, budget_amount: 500000.00 }
              as: BureauAdmin
              captures: { fund_a_id: $.data.id }
            - call: "POST /incentive-funds"
              payload: { fiscal_year: 2029, budget_amount: 100000.00 }
              as: BureauAdmin
              captures: { fund_b_id: $.data.id }
            - call: "POST /incentive-funds/${fund_a_id}/lodging-tax-receipts"
              payload: { amount: 3000.00, received_at: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /incentive-funds/${fund_a_id}/lodging-tax-receipts"
              payload: { amount: 400.00, received_at: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
              captures: { r2_id: $.data.id }
            - call: "POST /incentive-funds/${fund_b_id}/lodging-tax-receipts"
              payload: { amount: 500.00, received_at: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
              captures: { r3_id: $.data.id }
          trigger:
            - call: "GET /incentive-funds/${fund_a_id}/lodging-tax-receipts"
              payload: {}
              as: BoardAnalyst
              captures: { first_amount: "$.data[0].amount" }
            - call: "GET /incentive-funds/${fund_a_id}"
              payload: {}
              as: BoardAnalyst
              captures: { budget_a: $.data.budget_amount, receipts_a: $.data.lodging_tax_receipts_total, uncommitted_a: $.data.uncommitted_amount }
            - call: "GET /incentive-funds/${fund_b_id}"
              payload: {}
              as: BoardAnalyst
              captures: { budget_b: $.data.budget_amount, receipts_b: $.data.lodging_tax_receipts_total }
          assert:
            - "the fund A receipt list has total_count == 2 and contains ${r1_id} and ${r2_id} but not ${r3_id}"
            - "${first_amount} is one of 3000.00 or 400.00 and the two rows sum to 3400.00"
            - "${receipts_a} == 3400.00, ${budget_a} == 503400.00, ${uncommitted_a} == 503400.00"
            - "${receipts_b} == 500.00 and ${budget_b} == 100500.00 - funds do not leak into each other"

      - name: economic_impact_estimate_variants_diverge_on_identical_data
        claim_type: computed_fields
        grounds:
          - entities.EconomicImpactEstimate
          - calculations.economic_impact_estimate
        excluded_because:
          difficulty_instance: "dual_variant_calc / impact_provisional_vs_final_diverge_for_same_opportunity"
          rationale: "That instance asserts every computed field of both variants (PROVISIONAL total 9741930.00 / yield 59130.00 versus FINAL total 2659756.61 / yield 31580.06) on one opportunity."

      - name: incentive_decision_computed_money_fields_are_derived_not_supplied
        claim_type: computed_fields
        grounds:
          - entities.IncentiveDecision
          - calculations.fund_charge_composition
        excluded_because:
          difficulty_instance: "combinatorial_formula / admin_fee_band_selected_on_gross_not_on_total_charge"
          rationale: "admin_fee_amount 4800.00, total_charge_amount 100800.00 and tax_payback_ratio 6.52 are asserted there as literals from a single approved_amount input."

  # The chains below reuse two named fixtures to stay short:
  #
  #   SETUP-BASE  = clock 2026-08-01T00:00:00Z; one planner (${planner_id}); one
  #                 hall Grand Hall A 250000 sqft / 12000 persons / 48h
  #                 (${hall_id}); one opportunity CDA Annual 2028 arrival
  #                 2028-04-10 departure 2028-04-12, peak 1000, room nights
  #                 1800, attendance 8000, exhibit 200000, ceiling 219.00
  #                 (${opp_id}).
  #   CANONICAL DEFINITE CHAIN = the complete setup_api_calls list of
  #                 SCAFFOLD_DIFFICULTY_DESIGN.yaml / dual_variant_calc /
  #                 impact_provisional_vs_final_diverge_for_same_opportunity,
  #                 clock 2027-03-01T00:00:00Z, run up to and including
  #                 POST /bid-packages/${bid_id}/planner-response {ACCEPTED};
  #                 it leaves Opportunity ${opp_id} DEFINITE / posture
  #                 CONFIRMED, SpaceHold ${hold_a_id} CONFIRMED, three
  #                 COMMITTED blocks (${c_a_id} 500, ${c_b_id} 300,
  #                 ${c_c_id} 100), BidPackage ${bid_id} ACCEPTED with
  #                 total_fund_charge_amount 12600.00 and IncentiveFund
  #                 ${fund_id} committed 12600.00 / uncommitted 487400.00.

  - section: state_machines
    instances:
      - name: sales_stage_and_hold_posture_advance_as_independent_dimensions
        claim_type: parallel_dimensions
        grounds:
          - state_machines[Opportunity sales_stage]
          - state_machines[Opportunity hold_posture]
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "The two Opportunity dimensions move on different triggers: qualify advances sales_stage LEAD -> QUALIFIED while hold_posture stays NONE, and creating the FIRST-rank hold advances hold_posture NONE -> TENTATIVE while sales_stage stays QUALIFIED. Neither trigger touches the other dimension."
        test_recipe:
          setup:
            - "SETUP-BASE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /meeting-planners"
              payload: { org_name: "Continental Dental Assembly", contact_email: "meetings@cda.org" }
              as: BureauAdmin
              captures: { planner_id: $.data.id }
            - call: "POST /center-halls"
              payload: { name: "Grand Hall A", exhibit_sqft: 250000, capacity_persons: 12000, turnaround_hours: 48 }
              as: BureauAdmin
              captures: { hall_id: $.data.id }
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "CDA Annual 2028", arrival_date: "2028-04-10", departure_date: "2028-04-12", peak_rooms_requested: 1000, total_room_nights_requested: 1800, attendance_estimate: 8000, exhibit_sqft_requested: 200000, rate_ceiling_amount: 219.00 }
              as: SalesManager
              captures: { opp_id: $.data.id, stage_0: $.data.sales_stage, posture_0: $.data.hold_posture }
          trigger:
            - call: "POST /opportunities/${opp_id}/qualify"
              payload: {}
              as: SalesManager
              captures: { stage_1: $.data.sales_stage, posture_1: $.data.hold_posture }
            - call: "POST /space-holds"
              payload: { opportunity_id: "${opp_id}", center_hall_id: "${hall_id}", move_in_start: "2028-04-08T00:00:00Z", move_out_end: "2028-04-13T00:00:00Z" }
              as: CenterScheduler
              captures: { hold_id: $.data.id, rank: $.data.hold_rank }
            - call: "GET /opportunities/${opp_id}"
              payload: {}
              as: SalesManager
              captures: { stage_2: $.data.sales_stage, posture_2: $.data.hold_posture }
          assert:
            - "${stage_0} == LEAD and ${posture_0} == NONE - both dimensions start at their declared initial_state"
            - "${stage_1} == QUALIFIED and ${posture_1} == NONE - qualify does not touch hold_posture"
            - "${rank} == FIRST, ${stage_2} == QUALIFIED and ${posture_2} == TENTATIVE - holding space does not touch sales_stage"

      - name: qualify_inside_the_min_lead_window_returns_lead_time_too_short
        claim_type: precondition_enforcement
        grounds:
          - state_machines[Opportunity sales_stage LEAD -> QUALIFIED]
          - errors[ERR_LEAD_TIME_TOO_SHORT]
          - global_constants.MIN_LEAD_DAYS
        distinguishing_aspect: "At clock 2026-08-01 an arrival of 2026-12-01 is only 122 days out and qualify fails with 422 ERR_LEAD_TIME_TOO_SHORT, while an arrival of exactly 2027-01-28 - 180 days out, the MIN_LEAD_DAYS boundary - qualifies; the lead time is measured against the logical clock, not against created_at."
        test_recipe:
          setup:
            - "SETUP-BASE plus a second short-lead opportunity and a third exactly-180-day opportunity for the same planner"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /meeting-planners"
              payload: { org_name: "Continental Dental Assembly", contact_email: "meetings@cda.org" }
              as: BureauAdmin
              captures: { planner_id: $.data.id }
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "Short Lead Regional", arrival_date: "2026-12-01", departure_date: "2026-12-03", peak_rooms_requested: 100, total_room_nights_requested: 180, attendance_estimate: 800, exhibit_sqft_requested: 10000, rate_ceiling_amount: 189.00 }
              as: SalesManager
              captures: { short_opp_id: $.data.id }
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "Exactly 180 Days Out", arrival_date: "2027-01-28", departure_date: "2027-01-30", peak_rooms_requested: 100, total_room_nights_requested: 180, attendance_estimate: 800, exhibit_sqft_requested: 10000, rate_ceiling_amount: 189.00 }
              as: SalesManager
              captures: { edge_opp_id: $.data.id }
          trigger:
            - call: "POST /opportunities/${short_opp_id}/qualify"
              payload: {}
              as: SalesManager
              captures: { err: $.data.error_id }
            - call: "POST /opportunities/${edge_opp_id}/qualify"
              payload: {}
              as: SalesManager
              captures: { edge_stage: $.data.sales_stage }
          assert:
            - "first call: HTTP 422 and ${err} == ERR_LEAD_TIME_TOO_SHORT"
            - "GET /opportunities/${short_opp_id} still shows sales_stage LEAD and an unchanged version"
            - "second call: HTTP 200 and ${edge_stage} == QUALIFIED - 2026-08-01 + 180 days == 2027-01-28 is admitted"

      - name: qualify_twice_returns_invalid_opportunity_stage
        claim_type: idempotency
        grounds:
          - state_machines[Opportunity sales_stage LEAD -> QUALIFIED]
          - errors[ERR_INVALID_OPPORTUNITY_STAGE]
        distinguishing_aspect: "The second qualify is not a silent no-op: it fails with 409 ERR_INVALID_OPPORTUNITY_STAGE because QUALIFIED is not a declared from-state of that transition, and the version does not move again."
        test_recipe:
          setup:
            - "SETUP-BASE with ${opp_id} already QUALIFIED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /meeting-planners"
              payload: { org_name: "Continental Dental Assembly", contact_email: "meetings@cda.org" }
              as: BureauAdmin
              captures: { planner_id: $.data.id }
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "CDA Annual 2028", arrival_date: "2028-04-10", departure_date: "2028-04-12", peak_rooms_requested: 1000, total_room_nights_requested: 1800, attendance_estimate: 8000, exhibit_sqft_requested: 200000, rate_ceiling_amount: 219.00 }
              as: SalesManager
              captures: { opp_id: $.data.id }
            - call: "POST /opportunities/${opp_id}/qualify"
              payload: {}
              as: SalesManager
              captures: { v_after_first: $.data.version }
          trigger:
            - call: "POST /opportunities/${opp_id}/qualify"
              payload: {}
              as: SalesManager
              captures: { err: $.data.error_id }
            - call: "GET /opportunities/${opp_id}"
              payload: {}
              as: SalesManager
              captures: { v_final: $.data.version, stage: $.data.sales_stage }
          assert:
            - "HTTP 409 and ${err} == ERR_INVALID_OPPORTUNITY_STAGE"
            - "${v_final} == ${v_after_first} - the rejected call performs no write"
            - "${stage} == QUALIFIED"

      - name: lost_opportunity_is_terminal_for_qualify_lose_hold_and_bid
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines[Opportunity sales_stage terminal_states]
          - errors[ERR_INVALID_OPPORTUNITY_STAGE]
        distinguishing_aspect: "LOST is declared terminal, so all four triggers that name a from-state - qualify, lose, POST /space-holds and POST /bid-packages - are refused with 409 ERR_INVALID_OPPORTUNITY_STAGE, even though the bid-package call also carries a perfectly fresh expected_opportunity_version."
        test_recipe:
          setup:
            - "SETUP-BASE, ${opp_id} QUALIFIED then LOST with lost_reason PLANNER_DECLINED_BID"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /meeting-planners"
              payload: { org_name: "Continental Dental Assembly", contact_email: "meetings@cda.org" }
              as: BureauAdmin
              captures: { planner_id: $.data.id }
            - call: "POST /center-halls"
              payload: { name: "Grand Hall A", exhibit_sqft: 250000, capacity_persons: 12000, turnaround_hours: 48 }
              as: BureauAdmin
              captures: { hall_id: $.data.id }
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "CDA Annual 2028", arrival_date: "2028-04-10", departure_date: "2028-04-12", peak_rooms_requested: 1000, total_room_nights_requested: 1800, attendance_estimate: 8000, exhibit_sqft_requested: 200000, rate_ceiling_amount: 219.00 }
              as: SalesManager
              captures: { opp_id: $.data.id }
            - call: "POST /opportunities/${opp_id}/qualify"
              payload: {}
              as: SalesManager
            - call: "POST /opportunities/${opp_id}/lose"
              payload: { lost_reason: "PLANNER_DECLINED_BID" }
              as: SalesManager
              captures: { lost_stage: $.data.sales_stage, lost_reason: $.data.lost_reason }
            - call: "GET /opportunities/${opp_id}"
              payload: {}
              as: SalesManager
              captures: { lost_v: $.data.version }
          trigger:
            - call: "POST /opportunities/${opp_id}/qualify"
              payload: {}
              as: SalesManager
              captures: { err_qualify: $.data.error_id }
            - call: "POST /opportunities/${opp_id}/lose"
              payload: { lost_reason: "LOST_TO_COMPETITOR" }
              as: SalesManager
              captures: { err_lose: $.data.error_id }
            - call: "POST /space-holds"
              payload: { opportunity_id: "${opp_id}", center_hall_id: "${hall_id}", move_in_start: "2028-04-08T00:00:00Z", move_out_end: "2028-04-13T00:00:00Z" }
              as: CenterScheduler
              captures: { err_hold: $.data.error_id }
            - call: "POST /bid-packages"
              payload: { opportunity_id: "${opp_id}", expected_opportunity_version: "${lost_v}" }
              as: SalesManager
              captures: { err_bid: $.data.error_id }
          assert:
            - "${lost_stage} == LOST and ${lost_reason} == PLANNER_DECLINED_BID"
            - "all four triggers return HTTP 409 with error_id ERR_INVALID_OPPORTUNITY_STAGE: ${err_qualify}, ${err_lose}, ${err_hold}, ${err_bid}"
            - "the fourth call proves stage is checked even when the OCC version matches - a correct ${lost_v} does not buy entry to a terminal stage"
            - "GET /space-holds?opportunity_id=${opp_id} returns total_count == 0"

      - name: hold_creation_preconditions_reject_renovating_halls_and_lead_stage
        claim_type: precondition_enforcement
        grounds:
          - state_machines[SpaceHold null -> HELD]
          - errors[ERR_HALL_UNAVAILABLE]
          - errors[ERR_INVALID_OPPORTUNITY_STAGE]
        distinguishing_aspect: "Two separate preconditions of the same transition are probed on the same fixture: an UNDER_RENOVATION hall yields 409 ERR_HALL_UNAVAILABLE even for a QUALIFIED opportunity, and a LEAD-stage opportunity yields 409 ERR_INVALID_OPPORTUNITY_STAGE even on an AVAILABLE hall."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; one AVAILABLE hall, one UNDER_RENOVATION hall, one QUALIFIED opportunity and one still-LEAD opportunity"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /meeting-planners"
              payload: { org_name: "Continental Dental Assembly", contact_email: "meetings@cda.org" }
              as: BureauAdmin
              captures: { planner_id: $.data.id }
            - call: "POST /center-halls"
              payload: { name: "Grand Hall A", exhibit_sqft: 250000, capacity_persons: 12000, turnaround_hours: 48, hall_status: "AVAILABLE" }
              as: CenterScheduler
              captures: { open_hall_id: $.data.id }
            - call: "POST /center-halls"
              payload: { name: "Ballroom Under Works", exhibit_sqft: 60000, capacity_persons: 4000, turnaround_hours: 24, hall_status: "UNDER_RENOVATION" }
              as: CenterScheduler
              captures: { closed_hall_id: $.data.id }
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "CDA Annual 2028", arrival_date: "2028-04-10", departure_date: "2028-04-12", peak_rooms_requested: 1000, total_room_nights_requested: 1800, attendance_estimate: 3000, exhibit_sqft_requested: 50000, rate_ceiling_amount: 219.00 }
              as: SalesManager
              captures: { qualified_opp_id: $.data.id }
            - call: "POST /opportunities/${qualified_opp_id}/qualify"
              payload: {}
              as: SalesManager
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "Untriaged Lead 2028", arrival_date: "2028-06-10", departure_date: "2028-06-12", peak_rooms_requested: 200, total_room_nights_requested: 360, attendance_estimate: 1500, exhibit_sqft_requested: 20000, rate_ceiling_amount: 199.00 }
              as: SalesManager
              captures: { lead_opp_id: $.data.id }
          trigger:
            - call: "POST /space-holds"
              payload: { opportunity_id: "${qualified_opp_id}", center_hall_id: "${closed_hall_id}", move_in_start: "2028-04-08T00:00:00Z", move_out_end: "2028-04-13T00:00:00Z" }
              as: CenterScheduler
              captures: { err_hall: $.data.error_id }
            - call: "POST /space-holds"
              payload: { opportunity_id: "${lead_opp_id}", center_hall_id: "${open_hall_id}", move_in_start: "2028-06-08T00:00:00Z", move_out_end: "2028-06-13T00:00:00Z" }
              as: CenterScheduler
              captures: { err_stage: $.data.error_id }
          assert:
            - "first call: HTTP 409 and ${err_hall} == ERR_HALL_UNAVAILABLE"
            - "second call: HTTP 409 and ${err_stage} == ERR_INVALID_OPPORTUNITY_STAGE"
            - "GET /space-holds returns total_count == 0 and both opportunities keep hold_posture NONE"

      - name: space_hold_release_is_not_repeatable_and_sets_scheduler_release
        claim_type: idempotency
        grounds:
          - state_machines[SpaceHold HELD -> RELEASED]
          - endpoints[POST /space-holds/{id}/release]
          - errors[ERR_INVALID_HOLD_STATE]
        distinguishing_aspect: "The first release moves HELD -> RELEASED with release_reason SCHEDULER_RELEASE and drops the owning opportunity's hold_posture to RELEASED; the second release of the same hold is rejected 409 ERR_INVALID_HOLD_STATE because RELEASED is terminal."
        test_recipe:
          setup:
            - "SETUP-BASE with ${opp_id} QUALIFIED and one HELD FIRST-rank hold ${hold_id}"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /meeting-planners"
              payload: { org_name: "Continental Dental Assembly", contact_email: "meetings@cda.org" }
              as: BureauAdmin
              captures: { planner_id: $.data.id }
            - call: "POST /center-halls"
              payload: { name: "Grand Hall A", exhibit_sqft: 250000, capacity_persons: 12000, turnaround_hours: 48 }
              as: BureauAdmin
              captures: { hall_id: $.data.id }
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "CDA Annual 2028", arrival_date: "2028-04-10", departure_date: "2028-04-12", peak_rooms_requested: 1000, total_room_nights_requested: 1800, attendance_estimate: 8000, exhibit_sqft_requested: 200000, rate_ceiling_amount: 219.00 }
              as: SalesManager
              captures: { opp_id: $.data.id }
            - call: "POST /opportunities/${opp_id}/qualify"
              payload: {}
              as: SalesManager
            - call: "POST /space-holds"
              payload: { opportunity_id: "${opp_id}", center_hall_id: "${hall_id}", move_in_start: "2028-04-08T00:00:00Z", move_out_end: "2028-04-13T00:00:00Z" }
              as: CenterScheduler
              captures: { hold_id: $.data.id }
          trigger:
            - call: "POST /space-holds/${hold_id}/release"
              payload: {}
              as: CenterScheduler
              captures: { status_1: $.data.status, reason_1: $.data.release_reason }
            - call: "GET /opportunities/${opp_id}"
              payload: {}
              as: SalesManager
              captures: { posture: $.data.hold_posture, stage: $.data.sales_stage }
            - call: "POST /space-holds/${hold_id}/release"
              payload: {}
              as: CenterScheduler
              captures: { err: $.data.error_id }
          assert:
            - "${status_1} == RELEASED and ${reason_1} == SCHEDULER_RELEASE"
            - "${posture} == RELEASED while ${stage} == QUALIFIED - only the posture dimension reacts"
            - "second release: HTTP 409 and ${err} == ERR_INVALID_HOLD_STATE"
            - "CenterHall.${hall_id}.confirmed_hold_count == 0 throughout - a released HELD hold was never confirmed"

      - name: expiry_run_expires_a_stale_first_hold_and_promotes_the_waiting_second
        claim_type: side_effect_execution
        grounds:
          - state_machines[SpaceHold HELD -> EXPIRED]
          - endpoints[POST /space-hold-expiry-runs]
          - errors[ERR_HOLD_EXPIRED]
          - global_constants.PROMOTION_HOLD_DAYS
        distinguishing_aspect: "A hold taken at 2026-08-01 expires at 2026-10-30 (FIRST_HOLD_DAYS 90). At clock 2026-11-01 it is still stored as HELD until a run sweeps it: challenging it first fails 409 ERR_HOLD_EXPIRED, then one run reports expired_count 1 / promoted_count 1, stamps release_reason HOLD_EXPIRED and gives the promoted SECOND hold a fresh 30-day expiry of 2026-12-01; a second run reports all zeros."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; hall Grand Hall A; opportunity A QUALIFIED with a FIRST hold on 2028-04-08 -> 2028-04-13; clock advanced to 2026-11-01T00:00:00Z; opportunity B QUALIFIED with a conflicting SECOND hold on the same hall"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /meeting-planners"
              payload: { org_name: "Continental Dental Assembly", contact_email: "meetings@cda.org" }
              as: BureauAdmin
              captures: { planner_id: $.data.id }
            - call: "POST /center-halls"
              payload: { name: "Grand Hall A", exhibit_sqft: 250000, capacity_persons: 12000, turnaround_hours: 48 }
              as: BureauAdmin
              captures: { hall_id: $.data.id }
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "CDA Annual 2028", arrival_date: "2028-04-10", departure_date: "2028-04-12", peak_rooms_requested: 1000, total_room_nights_requested: 1800, attendance_estimate: 8000, exhibit_sqft_requested: 200000, rate_ceiling_amount: 219.00 }
              as: SalesManager
              captures: { opp_a_id: $.data.id }
            - call: "POST /opportunities/${opp_a_id}/qualify"
              payload: {}
              as: SalesManager
            - call: "POST /space-holds"
              payload: { opportunity_id: "${opp_a_id}", center_hall_id: "${hall_id}", move_in_start: "2028-04-08T00:00:00Z", move_out_end: "2028-04-13T00:00:00Z" }
              as: CenterScheduler
              captures: { hold_a_id: $.data.id, expiry_a: $.data.expires_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "Rival Congress 2028", arrival_date: "2028-04-10", departure_date: "2028-04-12", peak_rooms_requested: 700, total_room_nights_requested: 1200, attendance_estimate: 6000, exhibit_sqft_requested: 150000, rate_ceiling_amount: 209.00 }
              as: SalesManager
              captures: { opp_b_id: $.data.id }
            - call: "POST /opportunities/${opp_b_id}/qualify"
              payload: {}
              as: SalesManager
            - call: "POST /space-holds"
              payload: { opportunity_id: "${opp_b_id}", center_hall_id: "${hall_id}", move_in_start: "2028-04-08T00:00:00Z", move_out_end: "2028-04-13T00:00:00Z" }
              as: CenterScheduler
              captures: { hold_b_id: $.data.id, rank_b_before: $.data.hold_rank }
          trigger:
            - call: "POST /space-holds/${hold_a_id}/challenge"
              payload: { challenging_space_hold_id: "${hold_b_id}" }
              as: CenterScheduler
              captures: { err_expired: $.data.error_id }
            - call: "POST /space-hold-expiry-runs"
              payload: {}
              as: CenterScheduler
              captures: { expired_count: $.data.expired_count, lapsed_count: $.data.lapsed_challenge_count, promoted_count: $.data.promoted_count, promoted_ids: $.data.promoted_space_hold_ids }
            - call: "GET /space-holds/${hold_a_id}"
              payload: {}
              as: CenterScheduler
              captures: { status_a: $.data.status, reason_a: $.data.release_reason }
            - call: "GET /space-holds/${hold_b_id}"
              payload: {}
              as: CenterScheduler
              captures: { rank_b_after: $.data.hold_rank, expiry_b: $.data.expires_at, status_b: $.data.status }
            - call: "POST /space-hold-expiry-runs"
              payload: {}
              as: CenterScheduler
              captures: { expired_second: $.data.expired_count, promoted_second: $.data.promoted_count }
          assert:
            - "${expiry_a} == 2026-10-30T00:00:00Z and ${rank_b_before} == SECOND"
            - "challenge: HTTP 409 and ${err_expired} == ERR_HOLD_EXPIRED - a hold past its expiry cannot be challenged even before the sweep runs"
            - "${expired_count} == 1, ${lapsed_count} == 0, ${promoted_count} == 1 and ${promoted_ids} == [${hold_b_id}]"
            - "${status_a} == EXPIRED and ${reason_a} == HOLD_EXPIRED"
            - "${status_b} == HELD, ${rank_b_after} == FIRST and ${expiry_b} == 2026-12-01T00:00:00Z (run clock 2026-11-01 + PROMOTION_HOLD_DAYS 30)"
            - "opportunity A hold_posture == RELEASED and opportunity B hold_posture == TENTATIVE"
            - "${expired_second} == 0 and ${promoted_second} == 0 - the run is idempotent once the backlog is swept"

      - name: challenge_stamps_a_fourteen_day_deadline_and_sets_posture_challenged
        claim_type: valid_transition
        grounds:
          - state_machines[SpaceHold HELD -> CHALLENGED]
          - state_machines[Opportunity hold_posture TENTATIVE -> CHALLENGED]
          - global_constants.CHALLENGE_RESPONSE_DAYS
        distinguishing_aspect: "The challenge writes to two entities at once: the blocking FIRST hold becomes CHALLENGED with challenge_deadline = clock + 14 days (2026-08-15) and challenged_by_space_hold_id set, while the challenger stays HELD/SECOND and only the challenged opportunity's posture moves TENTATIVE -> CHALLENGED."
