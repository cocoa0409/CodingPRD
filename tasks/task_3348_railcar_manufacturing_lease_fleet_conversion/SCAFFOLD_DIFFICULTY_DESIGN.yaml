      - The incumbent placement runs [2026-09-16, 2026-10-16) with mileage_allowance 1000, then is closed
        by a return on 2026-10-16 with mileage_since_last 500 and condition_grade A (days_in_placement
        = 30, blocks = ceil(30/30) = 1, included_miles = 1000, overage = max(0, 500 - 1000) = 0, mileage_overage_cents
