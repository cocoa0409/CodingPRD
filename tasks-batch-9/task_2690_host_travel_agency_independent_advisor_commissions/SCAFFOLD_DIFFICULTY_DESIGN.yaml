  - rule_id: transitive_cascade
    instances:
      - name: chargeback_demotes_supplier_reprices_pending_and_moves_tier_basis
        grounds:
          - state_machines.Booking.RECEIVED_to_CHARGED_BACK
          - calculations.cancellation_chargeback
          - calculations.booking_expected_commission
          - calculations.advisor_production_ytd
          - entities.Supplier.fields.program_status
          - entities.Supplier.fields.chargeback_count
        distinguishing_aspect: |
          Depth-4 chain, each link caused by the previous one: (1) cancelling a RECEIVED booking
          writes CHARGED_BACK plus chargeback_amount_cents 112000; (2) BECAUSE the booking
          became CHARGED_BACK, Supplier.chargeback_count reaches its threshold of 1 and
          program_status flips PREFERRED -> PROBATION; (3) BECAUSE program_status changed, the
          still-PENDING booking is repriced from 0.16 to 0.11; (4) BECAUSE that booking's
          expected_commission_cents changed, the advisor's provisional production drops to
          220000. Removing link 2 leaves links 3 and 4 unreachable.
        test_recipe:
          setup:
            - "Aurora Cruises PREFERRED co-member with probation_chargeback_threshold 1, base 0.10, preferred override 0.15, ceiling 0.18, cap 500000."
            - "One ACTIVE consortium-member advisor in NY accredited with Aurora."
            - "Booking B1: CONSORTIUM, gross 1000000, expected 160000, CONFIRMED, paid in full 160000 on 2026-07-20, settled by the POSTED 2026-07 run so settled_share_cents == 112000."
            - "Booking B3: CONSORTIUM, gross 2000000, expected 320000, still SUBMITTED / PENDING, travel 2026-09-01..2026-09-10."
            - "Advisor provisional production before the trigger is 160000 + 320000 == 480000."
