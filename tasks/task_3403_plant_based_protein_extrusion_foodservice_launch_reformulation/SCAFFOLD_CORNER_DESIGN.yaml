              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 422 ERR_FORECAST_MISMATCH (forecast channel FOODSERVICE != batch channel RETAIL_FROZEN)"

      - name: cn_val_not_expiry_risk
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_NOT_EXPIRY_RISK]"
          - "constants.EXPIRY_RISK_WINDOW_DAYS"
        distinguishing_aspect: "A FROZEN batch 270 days from expiry is not expiry-risk: EXPIRY_RISK write-down fails 422 (rule requires <= 15 days to expiry or past expiry)."
        test_recipe:
          setup: ["Canonical FROZEN batch produced 2026-09-01 (expiry 2027-05-29); clock still 2026-09-01."]
          setup_api_calls:
            - *k_clock_needed
            - *k_sup_create
            - *k_sup_qualify
            - *k_sup_activate
            - *k_lot_create
            - *k_lot_release
            - *k_line_create
            - *k_prod_create2
            - *k_label_create
            - *k_label_submit
            - *k_label_approve
            - *k_prod_pilot
            - *k_prod_activate
            - *k_run_create
            - *k_run_start
            - *k_run_complete
            - *k_batch_lookup
          trigger:
            - call: "POST /protein-ops/inventory-write-downs"
              payload: { finished_goods_batch_id: "${batch_id}", quantity_cases: 2, reason: "EXPIRY_RISK" }
              as: DemandPlanner
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 422 ERR_NOT_EXPIRY_RISK (270 days to expiry > EXPIRY_RISK_WINDOW_DAYS 15)"

      - name: cn_val_run_not_recalled
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_RUN_NOT_RECALLED]"
        distinguishing_aspect: "A RECALL write-down requires the producing run's recall_flag: a batch from a merely COMPLETED run fails 422 ERR_RUN_NOT_RECALLED."
        test_recipe:
          setup: ["Canonical FROZEN batch; run COMPLETED but never RECALLED."]
          setup_api_calls:
            - *k_clock_needed
            - *k_sup_create
            - *k_sup_qualify
            - *k_sup_activate
            - *k_lot_create
            - *k_lot_release
            - *k_line_create
            - *k_prod_create2
            - *k_label_create
            - *k_label_submit
            - *k_label_approve
            - *k_prod_pilot
            - *k_prod_activate
            - *k_run_create
            - *k_run_start
            - *k_run_complete
            - *k_batch_lookup
          trigger:
            - call: "POST /protein-ops/inventory-write-downs"
              payload: { finished_goods_batch_id: "${batch_id}", quantity_cases: 2, reason: "RECALL" }
              as: DemandPlanner
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 422 ERR_RUN_NOT_RECALLED (recall_flag is false)"

      - name: cn_val_writedown_exceeds_available
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_WRITEDOWN_EXCEEDS_AVAILABLE]"
        distinguishing_aspect: "Write-down quantity is bounded by available_cases (not quantity_cases): 11 of 10 available fails 422; reserved cases cannot be written down without releasing the reservation first."
        test_recipe:
          setup: ["Canonical FROZEN batch of 10 cases, run RECALLED (so the RECALL gate itself passes)."]
          setup_api_calls:
            - *k_clock_needed
            - *k_sup_create
            - *k_sup_qualify
            - *k_sup_activate
            - *k_lot_create
            - *k_lot_release
            - *k_line_create
            - *k_prod_create2
            - *k_label_create
            - *k_label_submit
            - *k_label_approve
            - *k_prod_pilot
            - *k_prod_activate
            - *k_run_create
            - *k_run_start
            - *k_run_complete
            - *k_batch_lookup
            - call: "POST /protein-ops/production-runs/${run_id}/transitions"
              payload: { target_status: "RECALLED" }
              as: QualityManager
          trigger:
            - call: "POST /protein-ops/inventory-write-downs"
              payload: { finished_goods_batch_id: "${batch_id}", quantity_cases: 11, reason: "RECALL" }
              as: DemandPlanner
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 422 ERR_WRITEDOWN_EXCEEDS_AVAILABLE (11 > 10)"

      - name: cn_val_batch_expired_blocks_reserve
        claim_type: violation_to_error
        grounds:
          - "calculations.batch_derived_status"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Derived status is clock-driven: after the clock passes expiry_date the batch reads EXPIRED on GET and reserve fails 409 ERR_INVALID_STATE — no sweep writes anything."
        test_recipe:
          setup: ["Canonical FROZEN batch produced 2026-09-01 (expiry 2027-05-29); LTO program PROG-K-36 ACTIVE. Clock advanced to 2027-06-01T00:00:00Z."]
          setup_api_calls:
            - *k_clock_needed
            - *k_sup_create
            - *k_sup_qualify
            - *k_sup_activate
            - *k_lot_create
            - *k_lot_release
            - *k_line_create
            - *k_prod_create2
            - *k_label_create
            - *k_label_submit
            - *k_label_approve
            - *k_prod_pilot
            - *k_prod_activate
            - &k_run_create_fs2
              call: "POST /protein-ops/production-runs"
              payload: { production_line_id: "${line_id}", product_id: "${prod_id}", label_version_id: "${lbl_id}", channel: "FOODSERVICE", planned_quantity_kg: 100, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T12:00:00Z", expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { run_id: $.data.id }
            - *k_run_start
            - *k_run_complete
            - *k_batch_lookup
            - call: "POST /protein-ops/programs"
              payload: { program_code: "PROG-K-36", program_type: "FOODSERVICE_LTO", partner_code: "CHAIN-K36", product_id: "${prod_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-31T23:59:59Z", committed_cases: 10, dedicated_run_required: true }
              as: ChannelManager
              captures: { prog_id: $.data.id }
            - call: "POST /protein-ops/programs/${prog_id}/lifecycle"
              payload: { target_status: "ACTIVE" }
              as: ChannelManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /protein-ops/finished-goods-batches/${batch_id}"
              payload: {}
              as: ChannelManager
            - call: "POST /protein-ops/finished-goods-batches/${batch_id}/reserve"
              payload: { program_id: "${prog_id}", quantity_cases: 1 }
              as: ChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "GET shows FinishedGoodsBatch.${batch_id}.derived_status == EXPIRED (FOODSERVICE shelf life: expiry 2026-10-16; clock 2027-06-01 is past it)"
            - "reserve fails 409 ERR_INVALID_STATE"
            - "available_cases still == 10 (expiry moves no quantity)"

      - name: cn_val_audit_on_owned_line
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_AUDIT_NOT_APPLICABLE]"
        distinguishing_aspect: "Equivalence audits exist only for CO_MAN lines (owned lines are the reference): posting an audit to an OWNED line fails 422 ERR_AUDIT_NOT_APPLICABLE."
        test_recipe:
          setup: ["OWNED line LINE-K-37 (CERTIFIED by default)."]
          setup_api_calls:
            - call: "POST /protein-ops/production-lines"
              payload: { line_code: "LINE-K-37", site_type: "OWNED", hourly_capacity_kg: 250, supported_isolate_types: ["PEA"] }
              as: PlantManager
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /protein-ops/production-lines/${line_id}/certification-audits"
              payload: { texture_score: 90, moisture_variance_pct: 1.0 }
              as: QualityManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails 422 ERR_AUDIT_NOT_APPLICABLE"
            - "ProductionLine.${line_id}.certification_status == CERTIFIED (unchanged)"

      - name: cn_val_invalid_window
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_INVALID_WINDOW]"
        distinguishing_aspect: "scheduled_end equal to scheduled_start (or earlier) fails 422 ERR_INVALID_WINDOW before any overlap/capacity analysis."
        test_recipe:
          setup: ["OWNED line; product PROD-K-38 ACTIVE with APPROVED label."]
          setup_api_calls:
            - *k_line_create
