  # ---------------- Advance ---------------------------------------------------
  - method: POST
    path: /fhlb/advances
    roles: [TreasuryOfficer]
    input: [member_bank_id, advance_product_id, term_days, requested_net_proceeds_cents, expected_member_bank_version, "fund_stock_from_advance?", "community_program_allocation_id?", "community_bucket?", "requested_subsidy_cents?"]
    output: Advance
    side_effects:
      - "runs calculations.advance_principal_gross_up to set gross_principal_cents, activity_stock_cents, net_proceeds_cents and rate_bps"
      - "checks the PROVISIONAL variant of calculations.borrowing_capacity and stores it in capacity_at_request_cents"
      - "credit_status = REQUESTED, collateral_status = PENDING_VERIFICATION, outstanding_principal_cents = 0"
      - "recomputes MemberBank.committed_advances_cents and borrowing_capacity_cents (CERTIFIED counts REQUESTED as a commitment), then runs calculations.collateral_posture_recompute"
      - "increments MemberBank.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_MEMBER_BANK_NOT_FOUND, ERR_ADVANCE_PRODUCT_NOT_FOUND, ERR_ALLOCATION_NOT_FOUND, ERR_MEMBER_SCOPE_VIOLATION, ERR_STALE_MEMBER_VERSION, ERR_MEMBERSHIP_NOT_ACTIVE, ERR_COLLATERAL_POSTURE_FROZEN, ERR_POSTURE_RESTRICTED_TERM_LIMIT, ERR_PRODUCT_NOT_COMMUNITY_PROGRAM, ERR_NOT_COMMUNITY_LENDING_ELIGIBLE, ERR_TERM_OUT_OF_RANGE, ERR_MIN_PRINCIPAL_NOT_MET, ERR_SUBSIDY_EXCEEDS_PRINCIPAL_CAP, ERR_INSUFFICIENT_BORROWING_CAPACITY]

  - method: GET
    path: /fhlb/advances/{advance_id}
    roles: [SystemAdmin, CreditOfficer, TreasuryOfficer, CollateralReviewAuditor, CommunityLendingManager]
    input: []
    output: Advance
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ADVANCE_NOT_FOUND, ERR_MEMBER_SCOPE_VIOLATION]

  - method: GET
    path: /fhlb/advances
    roles: [SystemAdmin, CreditOfficer, TreasuryOfficer, CollateralReviewAuditor, CommunityLendingManager]
    input: ["member_bank_id?", "advance_product_id?", "community_program_allocation_id?", "credit_status?", "collateral_status?", "limit?", "offset?"]
    output: "Advance[]"
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    note: "sorted by created_at ASC"

  - method: POST
    path: /fhlb/advances/{advance_id}/approve
    roles: [CreditOfficer]
    input: []
    output: Advance
    side_effects:
      - "drives state_machines.Advance.credit_status REQUESTED -> CREDIT_APPROVED and sets approved_by_user_id = X-User-ID"
      - "when community_program_allocation_id is set, runs calculations.setaside_waterfall_commit and may close the allocation"
      - "recomputes MemberBank.required_activity_stock_cents, required_total_stock_cents, stock_deficiency_cents; may revert a REDEMPTION_REQUESTED subscription to ISSUED"
      - "recomputes borrowing_capacity_cents and runs calculations.collateral_posture_recompute"
      - "increments MemberBank.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ADVANCE_NOT_FOUND, ERR_INVALID_STATE, ERR_MEMBERSHIP_NOT_ACTIVE, ERR_ALLOCATION_CLOSED, ERR_COLLATERAL_POSTURE_FROZEN, ERR_POSTURE_RESTRICTED_TERM_LIMIT, ERR_SETASIDE_POOL_EXHAUSTED]

  - method: POST
    path: /fhlb/advances/{advance_id}/fund
    roles: [CreditOfficer]
    input: []
    output: Advance
    side_effects:
      - "drives state_machines.Advance.credit_status CREDIT_APPROVED -> FUNDED and collateral_status PENDING_VERIFICATION -> SECURED"
      - "sets funded_by_user_id, funded_at, maturity_date = funded_at + term_days, outstanding_principal_cents = gross_principal_cents, capacity_at_funding_cents"
      - "when fund_stock_from_advance is true, creates and immediately ISSUES an ACTIVITY StockSubscription of activity_stock_cents with advance_id set"
      - "recomputes MemberBank.total_outstanding_advances_cents, committed_advances_cents, stock_held_cents, borrowing_capacity_cents, then runs calculations.collateral_posture_recompute"
      - "increments MemberBank.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ADVANCE_NOT_FOUND, ERR_INVALID_STATE, ERR_MEMBERSHIP_NOT_ACTIVE, ERR_SEGREGATION_OF_DUTIES, ERR_COLLATERAL_POSTURE_FROZEN, ERR_DELIVERY_NOT_CONFIRMED, ERR_ACTIVITY_STOCK_DEFICIENT, ERR_INSUFFICIENT_BORROWING_CAPACITY]

  - method: POST
    path: /fhlb/advances/{advance_id}/repay
    roles: [CreditOfficer]
    input: []
    output: Advance
    side_effects:
      - "drives credit_status FUNDED -> REPAID and collateral_status SECURED|SHORTFALL -> RELEASED"
      - "sets outstanding_principal_cents = 0 and moves the linked ISSUED ACTIVITY subscription to REDEMPTION_REQUESTED"
      - "recomputes MemberBank.total_outstanding_advances_cents, required_activity_stock_cents, borrowing_capacity_cents, then runs calculations.collateral_posture_recompute (which may cure an OPEN shortfall)"
      - "increments MemberBank.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ADVANCE_NOT_FOUND, ERR_INVALID_STATE]

  - method: POST
    path: /fhlb/advances/{advance_id}/prepayment-quotes
    roles: [TreasuryOfficer, CreditOfficer]
    input: [prepay_kind, prepay_amount_cents]
    output: PrepaymentEvent
    side_effects:
      - "creates a PrepaymentEvent with status = QUOTED, quote_date = logical clock, quoted_market_rate_bps = the current market rate, quoted_remaining_days and quoted_fee_cents from the QUOTE variant of calculations.prepayment_fee"
      - "settlement fields, admin_fee_cents = 0, symmetric_credit_cents = 0; no advance or member field changes"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_ADVANCE_NOT_FOUND, ERR_MEMBER_SCOPE_VIOLATION, ERR_INVALID_STATE]
    note: "only allowed while Advance.credit_status == FUNDED"

  - method: GET
    path: /fhlb/prepayment-events
    roles: [SystemAdmin, CreditOfficer, TreasuryOfficer]
    input: ["advance_id?", "prepay_kind?", "status?", "limit?", "offset?"]
    output: "PrepaymentEvent[]"
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_MEMBER_SCOPE_VIOLATION]
    note: "sorted by created_at ASC; TreasuryOfficer callers are implicitly filtered to their own member's advances"

  # ---------------- PrepaymentEvent ------------------------------------------
  - method: GET
    path: /fhlb/prepayment-events/{prepayment_event_id}
    roles: [SystemAdmin, CreditOfficer, TreasuryOfficer]
    input: []
    output: PrepaymentEvent
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PREPAYMENT_EVENT_NOT_FOUND, ERR_MEMBER_SCOPE_VIOLATION]

  - method: POST
    path: /fhlb/prepayment-events/{prepayment_event_id}/settle
    roles: [CreditOfficer]
    input: []
    output: PrepaymentEvent
    side_effects:
      - "drives QUOTED -> SETTLED, computing settlement_date, settlement_market_rate_bps, settled_remaining_days, admin_fee_cents, symmetric_credit_cents, settled_fee_cents and fee_delta_cents from the SETTLEMENT variant of calculations.prepayment_fee"
      - "prepay_kind == PARTIAL reduces Advance.outstanding_principal_cents; prepay_kind == FULL runs the FUNDED -> PREPAID cascade (advance collateral_status -> RELEASED, linked subscription -> REDEMPTION_REQUESTED, member aggregates recomputed, an OPEN shortfall cured, posture and SHORTFALL advances restored)"
      - "an attempt past the validity window drives QUOTED -> EXPIRED and returns ERR_QUOTE_EXPIRED"
      - "increments MemberBank.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_PREPAYMENT_EVENT_NOT_FOUND, ERR_INVALID_STATE, ERR_QUOTE_EXPIRED]

  # ---------------- CommunityProgramAllocation -------------------------------
  - method: POST
    path: /fhlb/community-program-allocations
    roles: [CommunityLendingManager]
    input: [program_code, fiscal_year, total_pool_cents, subsidy_rate_bps]
    output: CommunityProgramAllocation
    side_effects:
      - "runs calculations.setaside_bucket_capacities; all bucket_committed_* = 0, committed_cents = 0, remaining_cents = total_pool_cents, status = OPEN"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: GET
    path: /fhlb/community-program-allocations/{community_program_allocation_id}
    roles: [SystemAdmin, CreditOfficer, TreasuryOfficer, CommunityLendingManager]
    input: []
    output: CommunityProgramAllocation
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ALLOCATION_NOT_FOUND]

  # ---------------- test-driving endpoints -----------------------------------
  - method: POST
    path: /_clock/set_current_utc
    roles: [SystemAdmin]
    input: [now]
    output: null
    side_effects:
      - "sets the server's logical clock, which every datetime default, maturity/remaining-day computation, appraisal-age check, review-window gate and cure-deadline comparison reads"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    note: "test-driving endpoint. The logical clock defaults to 2026-08-01T00:00:00Z at server start; every scaffold fixture is computed against that default. now must be an ISO 8601 UTC instant."

  - method: POST
    path: /_ops/set-market-rate
    roles: [SystemAdmin]
    input: [market_rate_bps]
    output: null
    side_effects:
      - "sets the global market reinvestment rate read by calculations.prepayment_fee at quote time and at settlement time"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    note: "test-driving endpoint. Defaults to MARKET_RATE_DEFAULT_BPS = 300. Needed because the QUOTE-versus-SETTLEMENT variant divergence of calculations.prepayment_fee is otherwise unreachable through business endpoints: no business operation moves the market rate."

# =============================================================================
# 1.6 Error Catalog
# =============================================================================
errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    meaning: "X-User-Role or X-User-ID header missing, or the role is not one of the six declared roles"
  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    meaning: "the caller's role is not permitted on this endpoint"
  - error_id: ERR_INVALID_REQUEST
    http_status: 422
    meaning: "missing required field, wrong type, bad enum, out-of-range number, or a malformed interval / prepayment amount"
  - error_id: ERR_STOCK_NOT_PAR_MULTIPLE
    http_status: 422
    meaning: "amount_cents is not an exact multiple of the 10000-cent par value"
  - error_id: ERR_MEMBER_BANK_NOT_FOUND
    http_status: 404
    meaning: "member_bank_id in the path or body does not resolve"
  - error_id: ERR_STOCK_SUBSCRIPTION_NOT_FOUND
    http_status: 404
    meaning: "stock_subscription_id does not resolve"
  - error_id: ERR_COLLATERAL_ASSET_NOT_FOUND
    http_status: 404
    meaning: "collateral_asset_id in the path or body does not resolve"
  - error_id: ERR_SAFEKEEPING_RECEIPT_NOT_FOUND
    http_status: 404
    meaning: "safekeeping_receipt_id does not resolve"
  - error_id: ERR_REVIEW_NOT_FOUND
    http_status: 404
    meaning: "collateral_verification_review_id does not resolve"
  - error_id: ERR_REVIEW_FINDING_NOT_FOUND
    http_status: 404
    meaning: "review_finding_id does not resolve"
  - error_id: ERR_ADVANCE_PRODUCT_NOT_FOUND
    http_status: 404
    meaning: "advance_product_id in the path or body does not resolve"
  - error_id: ERR_ADVANCE_NOT_FOUND
    http_status: 404
    meaning: "advance_id does not resolve"
  - error_id: ERR_PREPAYMENT_EVENT_NOT_FOUND
    http_status: 404
    meaning: "prepayment_event_id does not resolve"
  - error_id: ERR_ALLOCATION_NOT_FOUND
    http_status: 404
    meaning: "community_program_allocation_id in the path or body does not resolve"
  - error_id: ERR_MEMBER_SCOPE_VIOLATION
    http_status: 403
    meaning: "a TreasuryOfficer addressed a resource owned by a different member bank"
  - error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412
    meaning: "expected_member_bank_version does not match the current MemberBank.version"
  - error_id: ERR_INVALID_STATE
    http_status: 409
    meaning: "the entity's current state is not a legal source state for the requested transition"
  - error_id: ERR_MEMBERSHIP_NOT_ACTIVE
    http_status: 409
    meaning: "the member bank is not ACTIVE or PROBATION"
  - error_id: ERR_PLEDGE_AGREEMENT_NOT_EXECUTED
    http_status: 409
    meaning: "collateral cannot be pledged or approved before the pledge agreement is executed"
  - error_id: ERR_ALLOCATION_CLOSED
    http_status: 409
    meaning: "the community program allocation has no remaining pool and is CLOSED"
  - error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    meaning: "the prepayment quote is older than PREPAY_QUOTE_VALIDITY_DAYS; the event is moved to EXPIRED"
  - error_id: ERR_RETEST_LIMIT_EXCEEDED
    http_status: 409
    meaning: "the review already used its MAX_RETESTS retests"
  - error_id: ERR_CRITICAL_FINDINGS_OPEN
    http_status: 409
    meaning: "a CRITICAL finding is still OPEN (close/retest), or the asset carries an UNRESOLVED finding (review-eligibility)"
  - error_id: ERR_SHORTFALL_CURE_PERIOD_ACTIVE
    http_status: 409
    meaning: "the shortfall cure deadline has not yet passed, so escalation is premature"
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    meaning: "the same user attempted both halves of a segregated pair (approve/fund, or raise/waive)"
  - error_id: ERR_COLLATERAL_POSTURE_FROZEN
    http_status: 409
    meaning: "the member's collateral posture does not permit this credit action"
  - error_id: ERR_POSTURE_RESTRICTED_TERM_LIMIT
    http_status: 409
    meaning: "a RESTRICTED member may not take an advance with term_days above RESTRICTED_MAX_TERM_DAYS"
  - error_id: ERR_SECURITIES_REQUIRE_DELIVERY
    http_status: 409
    meaning: "AGENCY_MBS and TREASURY collateral has no blanket-lien discount factor and must be specifically listed or delivered"
  - error_id: ERR_DELIVERY_NOT_CONFIRMED
    http_status: 409
    meaning: "funding requires delivered files but at least one ELIGIBLE asset is not DELIVERED"
  - error_id: ERR_DOCUMENTATION_MISSING
    http_status: 409
    meaning: "the loan file documentation is MISSING, so the asset cannot be found eligible"
  - error_id: ERR_LTV_EXCEEDS_MAX
    http_status: 409
    meaning: "ltv_bps exceeds LTV_MAX_BPS"
  - error_id: ERR_DELINQUENT_ASSET_INELIGIBLE
    http_status: 409
    meaning: "delinquency_days is at or above DELINQUENCY_INELIGIBLE_DAYS"
  - error_id: ERR_SUBSTITUTION_REDUCES_LENDABLE_VALUE
    http_status: 409
    meaning: "a FROZEN member may not substitute into a lower-valued asset"
  - error_id: ERR_ASSET_NOT_ELIGIBLE
    http_status: 409
    meaning: "the asset is INELIGIBLE or SUBSTITUTED and cannot receive a safekeeping delivery"
  - error_id: ERR_ASSET_MEMBER_MISMATCH
    http_status: 409
    meaning: "the sampled asset belongs to a different member bank than the review"
  - error_id: ERR_PRODUCT_NOT_COMMUNITY_PROGRAM
    http_status: 409
    meaning: "a community allocation was supplied for a non-community product, or omitted for a community product"
  - error_id: ERR_NOT_COMMUNITY_LENDING_ELIGIBLE
    http_status: 409
    meaning: "the member bank does not satisfy community_lending_eligible"
  - error_id: ERR_REVIEW_WINDOW_OVERLAP
    http_status: 409
    meaning: "the requested field-work window intersects another non-CLOSED review window for the same member"
  - error_id: ERR_CUSTODY_WINDOW_CONFLICT
    http_status: 409
    meaning: "the requested custody window conflicts with an existing receipt window for the same asset after the 2-day buffer expansion"
  - error_id: ERR_TERM_OUT_OF_RANGE
    http_status: 409
    meaning: "term_days is outside the selected product's min/max term"
  - error_id: ERR_MIN_PRINCIPAL_NOT_MET
    http_status: 409
    meaning: "the computed gross principal is below the product's minimum"
  - error_id: ERR_SUBSIDY_EXCEEDS_PRINCIPAL_CAP
    http_status: 409
    meaning: "requested_subsidy_cents exceeds MAX_SUBSIDY_PCT_OF_PRINCIPAL_BPS of the gross principal"
  - error_id: ERR_STOCK_REDEMPTION_WOULD_BREACH_REQUIREMENT
    http_status: 409
    meaning: "redeeming or repurchasing this subscription would leave the member below required_total_stock_cents"
  - error_id: ERR_MEMBERSHIP_STOCK_DEFICIENT
    http_status: 409
    meaning: "the member holds less than required_membership_stock_cents and cannot be activated"
  - error_id: ERR_ACTIVITY_STOCK_DEFICIENT
    http_status: 409
    meaning: "the activity-based stock obligation is not covered and the advance does not gross the stock into principal"
  - error_id: ERR_INSUFFICIENT_BORROWING_CAPACITY
    http_status: 409
    meaning: "the gross principal exceeds the applicable borrowing capacity variant"
  - error_id: ERR_SETASIDE_POOL_EXHAUSTED
    http_status: 409
    meaning: "the purpose bucket plus the GENERAL bucket cannot absorb the requested subsidy"

# =============================================================================
# 1.7 Role Permission Matrix
# =============================================================================
roles:
  - role: SystemAdmin
    identity: opaque
    scope: "global; may read every member's data"
    exclusive_operations:
      - "POST /fhlb/member-banks"
      - "POST /fhlb/advance-products"
      - "POST /_clock/set_current_utc"
      - "POST /_ops/set-market-rate"
    shared_operations:
      - "all GET endpoints except GET /fhlb/member-banks/{member_bank_id}/borrowing-capacity is also shared"

  - role: CreditOfficer
    identity: opaque
    scope: "global; the acting user id is recorded on approvals, fundings and waivers for segregation of duties"
    exclusive_operations:
      - "POST /fhlb/member-banks/{member_bank_id}/activate"
      - "PATCH /fhlb/member-banks/{member_bank_id}/condition"
      - "POST /fhlb/member-banks/{member_bank_id}/pledge-agreement"
      - "POST /fhlb/member-banks/{member_bank_id}/escalate-shortfall"
      - "POST /fhlb/stock-subscriptions/{stock_subscription_id}/issue"
      - "POST /fhlb/stock-subscriptions/{stock_subscription_id}/repurchase"
      - "POST /fhlb/collateral-assets/{collateral_asset_id}/review-eligibility"
      - "POST /fhlb/review-findings/{review_finding_id}/waive"
      - "POST /fhlb/advances/{advance_id}/approve"
      - "POST /fhlb/advances/{advance_id}/fund"
      - "POST /fhlb/advances/{advance_id}/repay"
      - "POST /fhlb/prepayment-events/{prepayment_event_id}/settle"
    shared_operations:
      - "POST /fhlb/stock-subscriptions (shared with TreasuryOfficer)"
      - "POST /fhlb/advances/{advance_id}/prepayment-quotes (shared with TreasuryOfficer)"
      - "all GET endpoints"

  - role: TreasuryOfficer
    identity: "entity_backed:MemberBank"
    scope: "the X-User-ID is the id of the caller's own MemberBank; every addressed resource must resolve to that member or ERR_MEMBER_SCOPE_VIOLATION (403) is returned"
    exclusive_operations:
      - "POST /fhlb/stock-subscriptions/{stock_subscription_id}/request-redemption"
      - "POST /fhlb/collateral-assets"
      - "POST /fhlb/collateral-assets/{collateral_asset_id}/substitute"
      - "POST /fhlb/review-findings/{review_finding_id}/remediate"
      - "POST /fhlb/advances"
    shared_operations:
      - "POST /fhlb/stock-subscriptions (shared with CreditOfficer)"
      - "POST /fhlb/advances/{advance_id}/prepayment-quotes (shared with CreditOfficer)"
      - "GET endpoints for the caller's own member, subscriptions, assets, receipts, reviews, findings, advances, prepayment events, products and allocations"

  - role: CollateralCustodian
    identity: opaque
    scope: "global over safekeeping and loan-file documentation; no credit authority"
    exclusive_operations:
      - "PATCH /fhlb/collateral-assets/{collateral_asset_id}/documentation"
      - "POST /fhlb/collateral-assets/{collateral_asset_id}/safekeeping-receipts"
      - "POST /fhlb/safekeeping-receipts/{safekeeping_receipt_id}/confirm"
    shared_operations:
      - "GET /fhlb/member-banks/{member_bank_id}"
      - "GET /fhlb/collateral-assets and GET /fhlb/collateral-assets/{collateral_asset_id}"
      - "GET /fhlb/safekeeping-receipts and GET /fhlb/safekeeping-receipts/{safekeeping_receipt_id}"

  - role: CollateralReviewAuditor
    identity: opaque
    scope: "global over collateral verification reviews; the acting user id is recorded as ReviewFinding.raised_by_user_id and may never waive"
    exclusive_operations:
      - "POST /fhlb/collateral-verification-reviews"
      - "POST /fhlb/collateral-verification-reviews/{collateral_verification_review_id}/begin-field-work"
      - "POST /fhlb/collateral-verification-reviews/{collateral_verification_review_id}/findings"
      - "POST /fhlb/collateral-verification-reviews/{collateral_verification_review_id}/issue-findings"
      - "POST /fhlb/collateral-verification-reviews/{collateral_verification_review_id}/retest"
      - "POST /fhlb/collateral-verification-reviews/{collateral_verification_review_id}/close"
    shared_operations:
      - "GET endpoints for members, subscriptions, assets, receipts, reviews, findings and advances"

  - role: CommunityLendingManager
    identity: opaque
    scope: "global over community lending program pools; no credit or collateral authority"
    exclusive_operations:
      - "POST /fhlb/community-program-allocations"
    shared_operations:
      - "GET /fhlb/community-program-allocations/{community_program_allocation_id}"
      - "GET /fhlb/member-banks/{member_bank_id} and GET /fhlb/member-banks/{member_bank_id}/borrowing-capacity"
      - "GET /fhlb/advances and GET /fhlb/advances/{advance_id}"
      - "GET /fhlb/advance-products/{advance_product_id}"
