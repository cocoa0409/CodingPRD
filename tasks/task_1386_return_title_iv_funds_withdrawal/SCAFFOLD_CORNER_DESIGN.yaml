          trigger:
            - call: "POST /r2t4/enrollments/${etb}/withdraw"
              payload: { withdrawal_type: "OFFICIAL", notification_date: "2026-09-02" }
              as: RegistrarClerk
            - call: "GET /r2t4/enrollments/${etb}"
              payload: {}
              as: RegistrarClerk
              captures: { etb_v2: $.data.version }
          assert:
            - "Enrollment.${etb}.version == 1 at creation"
            - "Enrollment.${etb}.version == 2 after withdraw"

