# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task: task_1291_cost_basis_reporting_wash_sale_tracking
# Nine Difficulty Rules × ≥2 instances each (21 instances total).
# All arithmetic in assert: lines was pre-computed by the scaffold author
# against the formulas in SCAFFOLD.yaml §1.3 (round_half_up, integer cents).
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (≥2 instances, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: wash_sale_preview_same_account_vs_settled_cross_account
        grounds:
          - calculations.wash_sale_detection
          - calculations.wash_sale_detection.variants.same_account_only
          - calculations.wash_sale_detection.variants.cross_account_full
          - state_machines.Disposition.PENDING_to_SETTLED
        distinguishing_aspect: |
          Same loss-sale data, two valid variants produce different wash-sale
          verdicts: the PREVIEW variant scans only the disposition's own account
          (finds no replacement → would_trigger=false), while the SETTLED-time
          cross-account variant scans every Account sharing the Customer's
          wash_sale_scope_key (finds the replacement in account B → disallows
          the full 100000-cent loss). Entity domain: Disposition/WashSaleEvent.
        test_recipe:
          setup:
            - "Customer C with two TAXABLE accounts A1 and A2 under firm F"
            - "Security SEC (EQUITY, covered_effective 2011-01-01)"
            - "A1 holds lot L1: 100 sh, acquisition 2025-01-05, basis 500000 cents"
            - "A2 holds lot L2 (replacement): 100 sh, acquisition 2025-06-20, basis 410000 cents"
            - "PENDING disposition DSP on A1: sell 100 sh of SEC, trade_date 2025-06-10, proceeds 400000 cents"
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm F" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-WS-1", display_name: "Wash Seller" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct1_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A2", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct2_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "123456789", ticker: "WSX", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-01-05T00:00:00Z", quantity: 100, original_cost_basis_cents: 500000, acquisition_kind: "PURCHASE" }
              as: TaxOps
              captures: { lot1_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct2_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-06-20T00:00:00Z", quantity: 100, original_cost_basis_cents: 410000, acquisition_kind: "PURCHASE" }
              as: TaxOps
              captures: { lot2_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/dispositions"
              payload: { security_id: "${sec_id}", trade_date: "2025-06-10T00:00:00Z", settlement_date: "2025-06-11T00:00:00Z", quantity: 100, proceeds_cents: 400000, method: "FIFO" }
              as: TaxOps
              captures: { disp_id: $.data.id }
          trigger:
            - call: "GET /firms/${firm_id}/dispositions/${disp_id}/preview_wash_sale"
              payload: {}
              as: TaxOps
              captures: { preview_would_trigger: $.data.would_trigger }
            - call: "POST /firms/${firmId}/dispositions/${disp_id}/settle"
              payload: {}
              as: TaxOps
          assert:
            - "preview_would_trigger == false (same-account-only variant finds no replacement lot inside account A1)"
            - "Disposition.${disp_id}.is_wash_sale_flag == true (cross-account variant finds lot ${lot2_id} in account A2 sharing wash_sale_scope_key TIN-WS-1)"
            - "Disposition.${disp_id}.wash_sale_disallowed_loss_cents == 100000"
            - "Disposition.${disp_id}.realized_gain_cents == 0 (raw -100000 + disallowed 100000)"
            - "TaxLot.${lot2_id}.wash_sale_taint_basis_cents == 100000"
            - "TaxLot.${lot2_id}.adjusted_cost_basis_cents == 510000"

      - name: lot_selection_preview_vs_settled_quantity_mutation
        grounds:
          - calculations.lot_selection_and_gain
          - calculations.lot_selection_and_gain.variants.provisional_estimate
          - calculations.lot_selection_and_gain.variants.settled_final
          - state_machines.TaxLot.OPEN_to_PARTIALLY_DISPOSED
        distinguishing_aspect: |
          Same disposition input, two valid variants of lot_selection_and_gain:
          the provisional_estimate variant (preview_gain on a PENDING disposition)
          computes allocations WITHOUT decrementing TaxLot.quantity_remaining,
          while the settled_final variant persists allocations and flips the
          first lot OPEN → FULLY_DISPOSED. Entity domain: TaxLot/Disposition —
          a different entity domain than the wash-sale instance above.
        test_recipe:
          setup:
            - "Customer C with one TAXABLE account A1 under firm F"
            - "Security SEC"
            - "Lot L1: 10 sh, 2025-01-05, basis 10000 cents (per-share 1000)"
            - "Lot L2: 10 sh, 2025-02-05, basis 12000 cents (per-share 1200)"
            - "PENDING disposition DSP: sell 15 sh FIFO, proceeds 22500 cents"
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm F2" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-LS-1", display_name: "Lot Seller" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct1_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "222222222", ticker: "LSX", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-01-05T00:00:00Z", quantity: 10, original_cost_basis_cents: 10000, acquisition_kind: "PURCHASE" }
              as: TaxOps
              captures: { lot1_id: $.data.id, lot1_version_pre: $.data.version }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-02-05T00:00:00Z", quantity: 10, original_cost_basis_cents: 12000, acquisition_kind: "PURCHASE" }
              as: TaxOps
              captures: { lot2_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/dispositions"
              payload: { security_id: "${sec_id}", trade_date: "2025-06-10T00:00:00Z", settlement_date: "2025-06-11T00:00:00Z", quantity: 15, proceeds_cents: 22500, method: "FIFO" }
              as: TaxOps
              captures: { disp_id: $.data.id }
          trigger:
            - call: "GET /firms/${firm_id}/dispositions/${disp_id}/preview_gain"
              payload: {}
              as: TaxOps
              captures: { preview_gain: $.data.realized_gain_cents }
            - call: "GET /firms/${firm_id}/tax_lots/${lot1_id}"
              payload: {}
              as: TaxOps
              captures: { lot1_qty_after_preview: $.data.quantity_remaining }
            - call: "POST /firms/${firm_id}/dispositions/${disp_id}/settle"
              payload: {}
              as: TaxOps
          assert:
            - "preview_gain == 6500 (FIFO: 10 sh × 1000 + 5 sh × 1200 = 16000 basis; 22500 - 16000 = 6500)"
            - "lot1_qty_after_preview == 10 (provisional_estimate variant does NOT mutate quantity_remaining)"
            - "Disposition.${disp_id}.realized_gain_cents == 6500 after settle"
            - "TaxLot.${lot1_id}.quantity_remaining == 0 after settle (settled_final variant persists allocations)"
            - "TaxLot.${lot1_id}.lot_status == FULLY_DISPOSED"
            - "TaxLot.${lot2_id}.quantity_remaining == 5"
            - "TaxLot.${lot2_id}.lot_status == PARTIALLY_DISPOSED"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (≥2 instances, different modes a/b/c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: wash_sale_partial_prorata_multi_input
        grounds:
          - calculations.wash_sale_detection
          - entities.WashSaleEvent.fields.matching_rule
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs and non-linear interaction —
          disallowed loss depends on (1) raw loss magnitude, (2) sold share
          count, (3) candidate replacement quantity_remaining, with a
          conditional branch on matching_rule (SHARE_FOR_SHARE vs
          PARTIAL_PRORATA) selected by comparing candidate quantity to
          shares_sold_at_loss. Only 60 of 100 loss shares find replacement,
          so PARTIAL_PRORATA allocates 60000 of the 100000-cent loss.
        test_recipe:
          setup:
            - "Customer C with accounts A1 and A2 (same wash_sale_scope_key)"
            - "A1 lot L1: 100 sh, 2025-01-05, basis 500000 cents"
            - "A2 lot L2 (replacement): 60 sh, 2025-06-20, basis 246000 cents"
            - "PENDING disposition DSP on A1: sell 100 sh, trade 2025-06-10, proceeds 400000"
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm F3" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-PP-1", display_name: "Partial Prorata" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct1_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A2", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct2_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "333333333", ticker: "PPX", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-01-05T00:00:00Z", quantity: 100, original_cost_basis_cents: 500000, acquisition_kind: "PURCHASE" }
              as: TaxOps
            - call: "POST /firms/${firm_id}/accounts/${acct2_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-06-20T00:00:00Z", quantity: 60, original_cost_basis_cents: 246000, acquisition_kind: "PURCHASE" }
              as: TaxOps
              captures: { lot2_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/dispositions"
              payload: { security_id: "${sec_id}", trade_date: "2025-06-10T00:00:00Z", settlement_date: "2025-06-11T00:00:00Z", quantity: 100, proceeds_cents: 400000, method: "FIFO" }
              as: TaxOps
              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /firms/${firm_id}/dispositions/${disp_id}/settle"
              payload: {}
              as: TaxOps
            - call: "GET /firms/${firm_id}/dispositions/${disp_id}/wash_sale_events"
              payload: {}
              as: TaxOps
              captures: { evt_rule: "$.data[0].matching_rule", evt_disallowed: "$.data[0].disallowed_loss_cents" }
          assert:
            - "evt_rule == PARTIAL_PRORATA (replacement 60 sh < 100 sh sold at loss)"
            - "evt_disallowed == 60000 (round_half_up(100000 * 60/100))"
            - "Disposition.${disp_id}.wash_sale_disallowed_loss_cents == 60000"
            - "Disposition.${disp_id}.realized_gain_cents == -40000 (raw -100000 + 60000 deferred)"
            - "TaxLot.${lot2_id}.wash_sale_taint_basis_cents == 60000"
            - "TaxLot.${lot2_id}.adjusted_cost_basis_cents == 306000 (246000 + 60000)"

      - name: spinoff_rounding_order_pinned
        grounds:
          - calculations.corporate_action_basis_adjustment
          - state_machines.CorporateAction.ANNOUNCED_to_EFFECTIVE
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the SPINOFF branch
          computes the spun-off lot's basis FIRST as round_half_up(B * pct)
          and assigns the parent remainder B - spun_off_basis. Computing in
          the opposite order (parent first, spin-off gets remainder) would
          yield 3331/6670 instead of the pinned 3330/6671 for B=10001,
          pct=0.333. The scaffold pins spun-off-first rounding.
        test_recipe:
          setup:
            - "Customer C, account A1, security SEC_P (parent) and SEC_S (spun-off)"
            - "A1 holds lot L1 on SEC_P: 10 sh, 2025-01-05, basis 10001 cents"
            - "CorporateAction CA on SEC_P: SPINOFF, spinoff_cost_allocation_pct=0.333, acquirer=SEC_S, shares_per_source=1"
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm F4" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-SP-1", display_name: "Spin Off" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct1_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "444444444", ticker: "PAR", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_p_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "555555555", ticker: "SPN", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_s_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/tax_lots"
              payload: { security_id: "${sec_p_id}", acquisition_date: "2025-01-05T00:00:00Z", quantity: 10, original_cost_basis_cents: 10001, acquisition_kind: "PURCHASE" }
              as: TaxOps
              captures: { lot1_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities/${sec_p_id}/corporate_actions"
              payload: { action_type: "SPINOFF", effective_date: "2025-03-01T00:00:00Z", merger_acquirer_security_id: "${sec_s_id}", merger_shares_per_source_share: 1, spinoff_cost_allocation_pct: 0.333 }
              as: TaxOps
              captures: { ca_id: $.data.id }
          trigger:
            - call: "POST /firms/${firm_id}/corporate_actions/${ca_id}/apply"
              payload: {}
              as: TaxOps
            - call: "GET /firms/${firm_id}/accounts/${acct1_id}/tax_lots?acquisition_kind=CORPORATE_ACTION_DERIVED"
              payload: {}
              as: TaxOps
          assert:
            - "TaxLot.${lot1_id}.lot_status == SUPERSEDED"
            - "TaxLot.${lot1_id}.superseded_by_action_id == ${ca_id}"
            - "Derived spun-off lot on security ${sec_s_id}: adjusted_cost_basis_cents == 3330 (round_half_up(10001 * 0.333) computed FIRST)"
            - "Derived parent lot on security ${sec_p_id}: adjusted_cost_basis_cents == 6671 (10001 - 3330 remainder)"
            - "3330 + 6671 == 10001 (basis conserved under pinned rounding order)"

      - name: wash_sale_evaluation_order_pinned
        grounds:
          - calculations.lot_selection_and_gain
          - calculations.wash_sale_detection
          - entities.Disposition.fields.realized_gain_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — wash_sale_detection reads
          realized_gain_cents, then wash-sale deferral writes realized_gain_cents.
          The scaffold pins evaluation order: (1) lot_selection computes RAW
          realized_gain_cents = -100000; (2) detection computes disallowed from
          that RAW value (= 100000); (3) recognized gain is then adjusted to 0.
          If step (2) re-read the adjusted value it would compute disallowed=0;
          the pinned order makes the outcome well-defined.
        test_recipe:
          setup:
            - "Customer C, accounts A1 (holds loss lot) and A2 (holds full-quantity replacement)"
            - "A1 lot L1: 100 sh, 2025-01-05, basis 500000"
            - "A2 lot L2: 100 sh, 2025-06-20, basis 410000"
            - "PENDING disposition DSP on A1: sell 100 sh, trade 2025-06-10, proceeds 400000"
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm F5" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-EO-1", display_name: "Eval Order" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct1_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A2", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct2_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "666666666", ticker: "EOX", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-01-05T00:00:00Z", quantity: 100, original_cost_basis_cents: 500000, acquisition_kind: "PURCHASE" }
              as: TaxOps
            - call: "POST /firms/${firm_id}/accounts/${acct2_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-06-20T00:00:00Z", quantity: 100, original_cost_basis_cents: 410000, acquisition_kind: "PURCHASE" }
              as: TaxOps
              captures: { lot2_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/dispositions"
              payload: { security_id: "${sec_id}", trade_date: "2025-06-10T00:00:00Z", settlement_date: "2025-06-11T00:00:00Z", quantity: 100, proceeds_cents: 400000, method: "FIFO" }
              as: TaxOps
              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /firms/${firm_id}/dispositions/${disp_id}/settle"
              payload: {}
              as: TaxOps
          assert:
            - "Disposition.${disp_id}.wash_sale_disallowed_loss_cents == 100000 (computed from RAW gain -100000, not from adjusted 0)"
            - "Disposition.${disp_id}.realized_gain_cents == 0 (adjusted exactly once, after detection)"
            - "Disposition.${disp_id}.is_wash_sale_flag == true"
            - "TaxLot.${lot2_id}.adjusted_cost_basis_cents == 510000 (410000 + 100000 taint)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (≥2 instances, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: form_1099b_correction_cycle_loop
        grounds:
          - state_machines.TaxForm1099B
          - state_machines.TaxForm1099B.FILED_to_CORRECTION_PENDING
          - state_machines.TaxForm1099B.CORRECTION_PENDING_to_REFILED
          - state_machines.TaxForm1099B.REFILED_to_CORRECTION_PENDING
        distinguishing_aspect: |
          Cyclic machine on TaxForm1099B: FILED → CORRECTION_PENDING → REFILED
          → CORRECTION_PENDING → REFILED loops an unbounded number of times
          within the correction deadline window (correction_count increments
          each REFILED). Not a linear pipeline — the entity revisits
          CORRECTION_PENDING after each REFILED.
        test_recipe:
          setup:
            - "Customer C with one account A1 holding one covered lot L1 (10 sh, basis 10000)"
            - "One SETTLED disposition DSP1 in tax_year 2025 (sell 10 sh, proceeds 15000, FIFO, no wash sale)"
            - "TaxForm1099B F1 for 2025 in DRAFT"
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm F6" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-CY-1", display_name: "Cycle Form" }
              as: FirmAdmin
              captures: { cust_id: $.data.id, cust_v0: $.data.version }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct1_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "777777777", ticker: "CYX", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-01-05T00:00:00Z", quantity: 10, original_cost_basis_cents: 10000, acquisition_kind: "PURCHASE" }
              as: TaxOps
              captures: { lot1_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/dispositions"
              payload: { security_id: "${sec_id}", trade_date: "2025-06-10T00:00:00Z", settlement_date: "2025-06-11T00:00:00Z", quantity: 10, proceeds_cents: 15000, method: "FIFO" }
              as: TaxOps
              captures: { disp1_id: $.data.id }
            - call: "POST /firms/${firm_id}/dispositions/${disp1_id}/settle"
              payload: {}
              as: TaxOps
            - call: "POST /firms/${firm_id}/customers/${cust_id}/tax_forms_1099b"
              payload: { tax_year: 2025 }
              as: TaxOps
              captures: { form_id: $.data.id }
            - call: "GET /firms/${firm_id}/customers/${cust_id}"
              payload: {}
              as: TaxOps
              captures: { cust_v1: $.data.version }
          trigger:
            - call: "POST /firms/${firm_id}/customers/${cust_id}/tax_forms_1099b/${form_id}/generate"
              payload: { expected_customer_version: "${cust_v1}" }
              as: TaxOps
            - call: "POST /firms/${firm_id}/customers/${cust_id}/tax_forms_1099b/${form_id}/file"
              payload: {}
              as: FirmAdmin
            - call: "POST /firms/${firm_id}/dispositions/${disp1_id}/correct"
              payload: { proceeds_cents: 16000 }
              as: TaxOps
            - call: "POST /firms/${firm_id}/customers/${cust_id}/tax_forms_1099b/${form_id}/refile"
              payload: {}
              as: FirmAdmin
              captures: { form_after_first_correction: $.data.correction_count }
            - call: "GET /firms/${firm_id}/customers/${cust_id}"
              payload: {}
              as: TaxOps
              captures: { cust_v2: $.data.version }
            - call: "POST /firms/${firm_id}/dispositions/${disp1_id}/correct"
              payload: { proceeds_cents: 17000 }
              as: TaxOps
            - call: "POST /firms/${firm_id}/customers/${cust_id}/tax_forms_1099b/${form_id}/refile"
              payload: {}
              as: FirmAdmin
              captures: { form_after_second_correction: $.data.correction_count, form_final_status: $.data.status, form_st_proceeds: $.data.short_term_proceeds_cents }
          assert:
            - "form_after_first_correction == 1 (FILED → CORRECTION_PENDING → REFILED once)"
            - "form_after_second_correction == 2 (the cycle looped: REFILED → CORRECTION_PENDING → REFILED again)"
            - "form_final_status == REFILED"
            - "form_st_proceeds == 17000 (re-aggregated with the second corrected disposition)"
            - "Correction cycle repeated twice proves the machine is cyclic, not a one-way pipeline"

      - name: basis_change_request_reject_resubmit_cycle
        grounds:
          - state_machines.BasisChangeRequest
          - state_machines.BasisChangeRequest.UNDER_REVIEW_to_REJECTED
          - state_machines.BasisChangeRequest.REJECTED_to_RESUBMITTED
          - state_machines.BasisChangeRequest.RESUBMITTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          Cyclic machine on BasisChangeRequest (a different entity than
          TaxForm1099B): UNDER_REVIEW → REJECTED → RESUBMITTED → UNDER_REVIEW
          loops the review cycle; the loop terminates only when APPROVED →
          APPLIED reaches the terminal state.
        test_recipe:
          setup:
            - "Customer C with account A1 holding lot L1 (10 sh, basis 10000, PURCHASE)"
            - "BasisChangeRequest REQ on L1 of kind BASIS_AMOUNT_CORRECTION proposed 12000 with doc ref"
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm F7" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-BC-1", display_name: "Basis Changer" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct1_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "888888888", ticker: "BCX", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-01-05T00:00:00Z", quantity: 10, original_cost_basis_cents: 10000, acquisition_kind: "PURCHASE" }
              as: TaxOps
              captures: { lot1_id: $.data.id, lot1_v: $.data.version }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/basis_change_requests"
              payload: { tax_lot_id: "${lot1_id}", request_kind: "BASIS_AMOUNT_CORRECTION", proposed_basis_cents: 12000, supporting_doc_ref: "DOC-1" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /firms/${firm_id}/basis_change_requests/${req_id}/start_review"
              payload: {}
              as: TaxOps
            - call: "POST /firms/${firm_id}/basis_change_requests/${req_id}/reject"
              payload: {}
              as: TaxOps
            - call: "POST /firms/${firm_id}/basis_change_requests/${req_id}/resubmit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /firms/${firm_id}/basis_change_requests/${req_id}/start_review"
              payload: {}
              as: TaxOps
            - call: "POST /firms/${firm_id}/basis_change_requests/${req_id}/approve"
              payload: {}
              as: TaxOps
              as_user_id: "taxops-reviewer-1"
            - call: "POST /firms/${firm_id}/basis_change_requests/${req_id}/apply"
              payload: { expected_tax_lot_version: "${lot1_v}" }
              as: TaxOps
              as_user_id: "taxops-applier-2"
              captures: { req_final_status: $.data.status }
          assert:
            - "req_final_status == APPLIED"
            - "The request traversed UNDER_REVIEW → REJECTED → RESUBMITTED → UNDER_REVIEW → APPROVED → APPLIED (a cycle, then terminal)"
            - "TaxLot.${lot1_id}.adjusted_cost_basis_cents == 12000 after apply"
            - "BasisChangeRequest.${req_id}.approved_by_user_id == taxops-reviewer-1"
            - "BasisChangeRequest.${req_id}.applied_by_user_id == taxops-applier-2"

      - name: transfer_statement_reject_redeliver_cycle
        grounds:
          - state_machines.TransferStatement
          - state_machines.TransferStatement.DELIVERED_to_REJECTED
          - state_machines.TransferStatement.REJECTED_to_PENDING
        distinguishing_aspect: |
          Cyclic machine on TransferStatement (third distinct entity):
          PENDING → DELIVERED → REJECTED → PENDING → DELIVERED → ACCEPTED.
          The REJECTED → PENDING redeliver transition closes the loop, and
          the second DELIVERED → ACCEPTED terminates it.
        test_recipe:
          setup:
            - "Customer C with account A1 (empty position for INBOUND)"
            - "INBOUND TransferStatement TS with lots_payload carrying one lot (10 sh, basis 10000)"
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm F8" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-TS-1", display_name: "Transfer Cyclist" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct1_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "999999999", ticker: "TSX", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/transfer_statements"
              payload: { direction: "INBOUND", counterparty_firm_name: "Other Broker", security_id: "${sec_id}", quantity: 10, transfer_date: "2025-04-01T00:00:00Z", lots_payload: [{ acquisition_date: "2024-11-01T00:00:00Z", quantity: 10, original_cost_basis_cents: 10000 }] }
              as: TaxOps
              captures: { ts_id: $.data.id }
          trigger:
            - call: "POST /firms/${firm_id}/transfer_statements/${ts_id}/deliver"
              payload: { expected_account_version: "${acct_v0}" }
              as: TaxOps
            - call: "POST /firms/${firm_id}/transfer_statements/${ts_id}/reject"
              payload: {}
              as: TaxOps
            - call: "POST /firms/${firm_id}/transfer_statements/${ts_id}/redeliver"
              payload: {}
              as: TaxOps
              captures: { ts_status_after_redeliver: $.data.status }
            - call: "GET /firms/${firm_id}/accounts/${acct1_id}"
              payload: {}
              as: TaxOps
              captures: { acct_v_pre_second_deliver: $.data.version }
            - call: "POST /firms/${firm_id}/transfer_statements/${ts_id}/deliver"
              payload: { expected_account_version: "${acct_v_pre_second_deliver}" }
              as: TaxOps
            - call: "POST /firms/${firm_id}/transfer_statements/${ts_id}/accept"
              payload: {}
              as: TaxOps
              captures: { ts_final_status: $.data.status }
          assert:
            - "ts_status_after_redeliver == PENDING (REJECTED → PENDING closes the cycle)"
            - "ts_final_status == ACCEPTED (second pass through PENDING → DELIVERED → ACCEPTED)"
            - "The statement visited DELIVERED twice — proving a cyclic, not linear, machine"
            - "After accept, one TRANSFER_IN TaxLot exists on account ${acct1_id} with original_cost_basis_cents == 10000"

  # ===========================================================================
  # Rule 4 — transitive_cascade (≥2 instances, different triggers; one depth≥3)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: settle_wash_sale_cascade_depth3
        grounds:
          - state_machines.Disposition.PENDING_to_SETTLED
          - calculations.wash_sale_detection
          - entities.WashSaleEvent.fields.disallowed_loss_cents
          - entities.TaxLot.fields.wash_sale_taint_basis_cents
        distinguishing_aspect: |
          Depth-3 transitive cascade from the settle trigger: Disposition
          PENDING→SETTLED (hop 0) creates WashSaleEvent (hop 1, caused by the
          settle), the event's creation mutates triggering_lot.
          wash_sale_taint_basis_cents (hop 2, caused by the event — not by the
          settle directly), and that taint mutation recomputes triggering_lot.
          adjusted_cost_basis_cents (hop 3, caused by hop 2). Each link is
          caused by the previous link.
        test_recipe:
          setup:
            - "Customer C, accounts A1 and A2 same wash_sale_scope_key"
            - "A1 lot L1: 100 sh, 2025-01-05, basis 500000"
            - "A2 lot L2: 100 sh, 2025-06-20, basis 410000"
            - "PENDING disposition DSP on A1: sell 100 sh, trade 2025-06-10, proceeds 400000"
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm F9" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-CASC-1", display_name: "Cascade" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct1_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A2", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct2_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "111111112", ticker: "CDC", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-01-05T00:00:00Z", quantity: 100, original_cost_basis_cents: 500000, acquisition_kind: "PURCHASE" }
              as: TaxOps
            - call: "POST /firms/${firm_id}/accounts/${acct2_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-06-20T00:00:00Z", quantity: 100, original_cost_basis_cents: 410000, acquisition_kind: "PURCHASE" }
              as: TaxOps
              captures: { lot2_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/dispositions"
              payload: { security_id: "${sec_id}", trade_date: "2025-06-10T00:00:00Z", settlement_date: "2025-06-11T00:00:00Z", quantity: 100, proceeds_cents: 400000, method: "FIFO" }
              as: TaxOps
              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /firms/${firm_id}/dispositions/${disp_id}/settle"
              payload: {}
              as: TaxOps
            - call: "GET /firms/${firm_id}/dispositions/${disp_id}/wash_sale_events"
              payload: {}
              as: TaxOps
              captures: { evt_id: "$.data[0].id", evt_triggering_lot: "$.data[0].triggering_lot_id" }
          assert:
            - "evt_triggering_lot == ${lot2_id} (hop 1: settle created the WashSaleEvent)"
            - "TaxLot.${lot2_id}.wash_sale_taint_basis_cents == 100000 (hop 2: event mutated the taint field)"
            - "TaxLot.${lot2_id}.adjusted_cost_basis_cents == 510000 (hop 3: taint mutation recomputed adjusted basis; 410000 + 100000)"
            - "TaxLot.${lot2_id}.holding_period_start == 2025-01-05T00:00:00Z (sold lot's holding period tacked onto the replacement lot)"

      - name: corporate_action_apply_cascade_depth3
        grounds:
          - state_machines.CorporateAction.ANNOUNCED_to_EFFECTIVE
          - state_machines.TaxLot.OPEN_to_SUPERSEDED
          - calculations.corporate_action_basis_adjustment
        distinguishing_aspect: |
          Different triggering transition (corporate action apply, not
          disposition settle), also depth 3: CorporateAction ANNOUNCED→EFFECTIVE
          (hop 0) flips source TaxLot to SUPERSEDED (hop 1, caused by apply),
          the supersede spawns a derived TaxLot whose basis is recomputed from
          the source lot (hop 2, caused by hop 1), and the derived-lot creation
          bubbles Account.version += 1 (hop 3, caused by hop 2).
        test_recipe:
          setup:
            - "Customer C, account A1, security SEC"
            - "A1 lot L1: 10 sh, 2025-01-05, basis 10000"
            - "ANNOUNCED CorporateAction CA on SEC: SPLIT 2:1"
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm F10" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-CASC-2", display_name: "Cascade Two" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct1_id: $.data.id, acct_v_pre: $.data.version }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "111111113", ticker: "SPL", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-01-05T00:00:00Z", quantity: 10, original_cost_basis_cents: 10000, acquisition_kind: "PURCHASE" }
              as: TaxOps
              captures: { lot1_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities/${sec_id}/corporate_actions"
              payload: { action_type: "SPLIT", effective_date: "2025-03-01T00:00:00Z", split_ratio_numerator: 2, split_ratio_denominator: 1 }
              as: TaxOps
              captures: { ca_id: $.data.id }
          trigger:
            - call: "POST /firms/${firm_id}/corporate_actions/${ca_id}/apply"
              payload: {}
              as: TaxOps
            - call: "GET /firms/${firm_id}/accounts/${acct1_id}/tax_lots?acquisition_kind=CORPORATE_ACTION_DERIVED"
              payload: {}
              as: TaxOps
              captures: { derived_qty: "$.data[0].quantity", derived_basis: "$.data[0].adjusted_cost_basis_cents", derived_id: "$.data[0].id" }
            - call: "GET /firms/${firm_id}/accounts/${acct1_id}"
              payload: {}
              as: TaxOps
              captures: { acct_v_post: $.data.version }
          assert:
            - "TaxLot.${lot1_id}.lot_status == SUPERSEDED (hop 1)"
            - "TaxLot.${lot1_id}.superseded_by_action_id == ${ca_id}"
            - "derived_qty == 20 (hop 2: split 2:1 recomputed quantity from the superseded lot)"
            - "derived_basis == 10000 (total basis carried over unchanged)"
            - "TaxLot.${derived_id}.acquisition_date == 2025-01-05T00:00:00Z (holding period tacked, not reset)"
            - "acct_v_post == ${acct_v_pre} + 1 (hop 3: derived-lot creation bubbled Account.version)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (≥2 instances, different category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: settle_state_vs_business_fiscal_priority
        grounds:
          - validations[priority=4]
          - validations[priority=14]
          - state_machines.Disposition.PENDING_to_SETTLED
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_INSUFFICIENT_LOT_QUANTITY]
        distinguishing_aspect: |
          Category pair state (priority 4) vs business_fiscal (priority 14):
          the disposition's account has been RESTRICTED (state precondition
          Account.status == OPEN fails) AND the disposition's quantity exceeds
          available lot quantity (fiscal check would also fail). The state
          error ERR_INVALID_STATE_TRANSITION MUST win because priority 4
          precedes priority 14.
        test_recipe:
          setup:
            - "Customer C, account A1, security SEC"
            - "A1 lot L1: 5 sh only, basis 5000"
            - "PENDING disposition DSP: sell 10 sh (exceeds available 5 sh)"
            - "A1 then RESTRICTED before settle"
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm F11" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-PR-1", display_name: "Priority One" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct1_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "111111114", ticker: "PR1", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-01-05T00:00:00Z", quantity: 5, original_cost_basis_cents: 5000, acquisition_kind: "PURCHASE" }
              as: TaxOps
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/dispositions"
              payload: { security_id: "${sec_id}", trade_date: "2025-06-10T00:00:00Z", settlement_date: "2025-06-11T00:00:00Z", quantity: 10, proceeds_cents: 9000, method: "FIFO" }
              as: TaxOps
              captures: { disp_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/restrict"
              payload: {}
              as: TaxOps
          trigger:
            - call: "POST /firms/${firm_id}/dispositions/${disp_id}/settle"
              payload: {}
              as: TaxOps
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION (state check at priority 4 fires before the fiscal insufficient-quantity check at priority 14)"
            - "Disposition.${disp_id}.status == PENDING (unchanged)"

      - name: disposition_create_temporal_vs_fiscal_priority
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - errors[ERR_TAX_YEAR_CLOSED]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Different category pair: business_temporal (priority 8) vs
          business_fiscal (priority 12). The create-disposition request has
          trade_date in a CLOSED tax year (2024, before firm tax_year_open
          2025) AND quantity == 0 (fiscal violation). The temporal error
          ERR_TAX_YEAR_CLOSED MUST win because priority 8 precedes 12.
        test_recipe:
          setup:
            - "Customer C, account A1, security SEC"
            - "No lots needed — the request fails validation before lot lookup"
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm F12" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-PR-2", display_name: "Priority Two" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct1_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "111111115", ticker: "PR2", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_id: $.data.id }
          trigger:
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/dispositions"
              payload: { security_id: "${sec_id}", trade_date: "2024-06-10T00:00:00Z", settlement_date: "2024-06-11T00:00:00Z", quantity: 0, proceeds_cents: 9000, method: "FIFO" }
              as: TaxOps
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_TAX_YEAR_CLOSED (temporal check at priority 8 fires before the fiscal zero-quantity check at priority 12)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (≥2 instances, different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: wash_sale_window_inclusive_day30
        grounds:
          - calculations.wash_sale_detection
          - constants.WASH_SALE_HALF_WINDOW_DAYS
        distinguishing_aspect: |
          Metric: day-distance between replacement acquisition_date and
          trade_date; endpoint: POST .../dispositions/{id}/settle. The window
          [trade_date - 30, trade_date + 30] is INCLUSIVE: a replacement
          exactly 30 days after the sale IS inside the window and triggers the
          wash sale, while 31 days after does not.
        test_recipe:
          setup:
            - "Customer C, accounts A1 (loss lot) and A2"
            - "A1 lot L1: 100 sh, 2025-01-05, basis 500000"
            - "A2 lot L2: 100 sh, acquisition exactly 2025-07-10 (trade 2025-06-10 + 30 days), basis 410000"
            - "PENDING disposition DSP: sell 100 sh, trade 2025-06-10, proceeds 400000"
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm F13" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-BD-1", display_name: "Boundary Thirty" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct1_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A2", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct2_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "111111116", ticker: "B30", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-01-05T00:00:00Z", quantity: 100, original_cost_basis_cents: 500000, acquisition_kind: "PURCHASE" }
              as: TaxOps
            - call: "POST /firms/${firm_id}/accounts/${acct2_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-07-10T00:00:00Z", quantity: 100, original_cost_basis_cents: 410000, acquisition_kind: "PURCHASE" }
              as: TaxOps
              captures: { lot2_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/dispositions"
              payload: { security_id: "${sec_id}", trade_date: "2025-06-10T00:00:00Z", settlement_date: "2025-06-11T00:00:00Z", quantity: 100, proceeds_cents: 400000, method: "FIFO" }
              as: TaxOps
              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /firms/${firm_id}/dispositions/${disp_id}/settle"
              payload: {}
              as: TaxOps
          assert:
            - "Disposition.${disp_id}.is_wash_sale_flag == true (day +30 is INSIDE the inclusive window)"
            - "Disposition.${disp_id}.wash_sale_disallowed_loss_cents == 100000"
            - "TaxLot.${lot2_id}.wash_sale_taint_basis_cents == 100000"

      - name: covered_status_effective_date_boundary
        grounds:
          - calculations.covered_status_classification
          - entities.Security.fields.covered_security_effective_date
          - entities.TaxLot.fields.covered_status
        distinguishing_aspect: |
          Metric: acquisition_date vs covered_security_effective_date;
          endpoint: POST .../accounts/{id}/tax_lots (a different endpoint than
          the wash-sale settle boundary). The comparison is >= (inclusive):
          acquisition_date EXACTLY EQUAL to the effective date classifies
          COVERED; one day earlier classifies NONCOVERED.
        test_recipe:
          setup:
            - "Customer C, account A1, security SEC with covered_security_effective_date 2011-01-01"
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm F14" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-BD-2", display_name: "Boundary Covered" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct1_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "111111117", ticker: "COV", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_id: $.data.id }
          trigger:
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2011-01-01T00:00:00Z", quantity: 10, original_cost_basis_cents: 10000, acquisition_kind: "PURCHASE" }
              as: TaxOps
              captures: { lot_on_boundary: $.data.covered_status, lot_on_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2010-12-31T00:00:00Z", quantity: 10, original_cost_basis_cents: 10000, acquisition_kind: "PURCHASE" }
              as: TaxOps
              captures: { lot_before_boundary: $.data.covered_status }
          assert:
            - "lot_on_boundary == COVERED (acquisition_date == effective date satisfies >=)"
            - "lot_before_boundary == NONCOVERED (one day earlier fails the >= test)"

      - name: long_term_threshold_365_day_boundary
        grounds:
          - calculations.short_long_term_classification
          - constants.LONG_TERM_THRESHOLD_DAYS
        distinguishing_aspect: |
          Metric: holding period in days; endpoint: dispositions/{id}/settle
          drives the classification which is then observable via the 1099-B
          aggregation totals (long_term vs short_term buckets). The rule is
          strictly > 365: exactly 365 days is SHORT_TERM, 366 days is
          LONG_TERM. Distinct metric from the wash-sale window and the
          covered-date boundary.
        test_recipe:
          setup:
            - "Customer C, account A1, security SEC"
            - "Lot L_365: 10 sh acquired 2024-06-10, basis 10000 (sold 2025-06-10 → exactly 365 days)"
            - "Lot L_366: 10 sh acquired 2024-06-09, basis 10000 (sold 2025-06-10 → 366 days)"
            - "Two PENDING dispositions, one per lot via SPECIFIC_ID, each proceeds 15000"
            - "DRAFT TaxForm1099B for 2025"
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm F15" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-BD-3", display_name: "Boundary Term" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct1_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "111111118", ticker: "TRM", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2024-06-10T00:00:00Z", quantity: 10, original_cost_basis_cents: 10000, acquisition_kind: "PURCHASE" }
              as: TaxOps
              captures: { lot_365_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2024-06-09T00:00:00Z", quantity: 10, original_cost_basis_cents: 10000, acquisition_kind: "PURCHASE" }
              as: TaxOps
              captures: { lot_366_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/dispositions"
              payload: { security_id: "${sec_id}", trade_date: "2025-06-10T00:00:00Z", settlement_date: "2025-06-11T00:00:00Z", quantity: 10, proceeds_cents: 15000, method: "SPECIFIC_ID", lot_allocations: [{ lot_id: "${lot_365_id}", quantity: 10 }] }
              as: TaxOps
              captures: { disp_365_id: $.data.id }
            - call: "POST /firms/${firm_id}/dispositions/${disp_365_id}/settle"
              payload: {}
              as: TaxOps
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/dispositions"
              payload: { security_id: "${sec_id}", trade_date: "2025-06-10T00:00:00Z", settlement_date: "2025-06-11T00:00:00Z", quantity: 10, proceeds_cents: 15000, method: "SPECIFIC_ID", lot_allocations: [{ lot_id: "${lot_366_id}", quantity: 10 }] }
              as: TaxOps
              captures: { disp_366_id: $.data.id }
            - call: "POST /firms/${firm_id}/dispositions/${disp_366_id}/settle"
              payload: {}
              as: TaxOps
            - call: "POST /firms/${firm_id}/customers/${cust_id}/tax_forms_1099b"
              payload: { tax_year: 2025 }
              as: TaxOps
              captures: { form_id: $.data.id }
            - call: "GET /firms/${firm_id}/customers/${cust_id}"
              payload: {}
              as: TaxOps
              captures: { cust_v: $.data.version }
          trigger:
            - call: "POST /firms/${firm_id}/customers/${cust_id}/tax_forms_1099b/${form_id}/generate"
              payload: { expected_customer_version: "${cust_v}" }
              as: TaxOps
              captures: { st_proceeds: $.data.short_term_proceeds_cents, lt_proceeds: $.data.long_term_proceeds_cents, st_basis: $.data.short_term_basis_cents, lt_basis: $.data.long_term_basis_cents }
          assert:
            - "st_proceeds == 15000 (the 365-day lot is SHORT_TERM: strictly > 365 required for long)"
            - "st_basis == 10000"
            - "lt_proceeds == 15000 (the 366-day lot is LONG_TERM)"
            - "lt_basis == 10000"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (≥2 instances, different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: form_file_gated_by_customer_version
        grounds:
          - state_machines.TaxForm1099B.GENERATED_to_FILED
          - entities.TaxForm1099B.fields.generated_from_version
          - entities.Customer.fields.version
          - errors[ERR_STALE_FORM_VERSION]
        distinguishing_aspect: |
          Entity pair TaxForm1099B → Customer: the GENERATED → FILED
          transition is only valid while Customer.version ==
          form.generated_from_version. Mutating the Customer (suspend) between
          generate and file makes the form stale and file is rejected.
        test_recipe:
          setup:
            - "Customer C, account A1, one covered lot, one SETTLED disposition (sell 10 sh, proceeds 15000, basis 10000, no wash sale)"
            - "TaxForm1099B F1 generated for 2025"
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm F16" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-XD-1", display_name: "Cross Dep One" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct1_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "111111119", ticker: "XD1", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-01-05T00:00:00Z", quantity: 10, original_cost_basis_cents: 10000, acquisition_kind: "PURCHASE" }
              as: TaxOps
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/dispositions"
              payload: { security_id: "${sec_id}", trade_date: "2025-06-10T00:00:00Z", settlement_date: "2025-06-11T00:00:00Z", quantity: 10, proceeds_cents: 15000, method: "FIFO" }
              as: TaxOps
              captures: { disp_id: $.data.id }
            - call: "POST /firms/${firm_id}/dispositions/${disp_id}/settle"
              payload: {}
              as: TaxOps
            - call: "POST /firms/${firm_id}/customers/${cust_id}/tax_forms_1099b"
              payload: { tax_year: 2025 }
              as: TaxOps
              captures: { form_id: $.data.id }
            - call: "GET /firms/${firm_id}/customers/${cust_id}"
              payload: {}
              as: TaxOps
              captures: { cust_v: $.data.version }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/tax_forms_1099b/${form_id}/generate"
              payload: { expected_customer_version: "${cust_v}" }
              as: TaxOps
            - call: "POST /firms/${firm_id}/customers/${cust_id}/suspend"
              payload: {}
              as: FirmAdmin
          trigger:
            - call: "POST /firms/${firm_id}/customers/${cust_id}/tax_forms_1099b/${form_id}/file"
              payload: {}
              as: FirmAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_FORM_VERSION (Customer.version advanced past generated_from_version when the customer was suspended)"
            - "TaxForm1099B.${form_id}.status == GENERATED (unchanged)"

      - name: disposition_settle_gated_by_account_status
        grounds:
          - state_machines.Disposition.PENDING_to_SETTLED
          - state_machines.Account.OPEN_to_RESTRICTED
          - entities.Account.fields.status
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          Different entity pair: Disposition → Account. The PENDING → SETTLED
          transition is only valid while the parent Account.status == OPEN;
          an account moved to RESTRICTED blocks settlement even though the
          Disposition itself is still PENDING.
        test_recipe:
          setup:
            - "Customer C, account A1, lot 10 sh basis 10000, PENDING disposition sell 10 sh proceeds 15000"
            - "A1 is then RESTRICTED"
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm F17" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-XD-2", display_name: "Cross Dep Two" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct1_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "111111120", ticker: "XD2", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-01-05T00:00:00Z", quantity: 10, original_cost_basis_cents: 10000, acquisition_kind: "PURCHASE" }
              as: TaxOps
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/dispositions"
              payload: { security_id: "${sec_id}", trade_date: "2025-06-10T00:00:00Z", settlement_date: "2025-06-11T00:00:00Z", quantity: 10, proceeds_cents: 15000, method: "FIFO" }
              as: TaxOps
              captures: { disp_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/restrict"
              payload: {}
              as: TaxOps
          trigger:
            - call: "POST /firms/${firm_id}/dispositions/${disp_id}/settle"
              payload: {}
              as: TaxOps
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION (Account.status != OPEN gates the disposition's transition)"
            - "Disposition.${disp_id}.status == PENDING (unchanged)"

      - name: basis_apply_gated_by_taxlot_version
        grounds:
          - state_machines.BasisChangeRequest.APPROVED_to_APPLIED
          - entities.BasisChangeRequest.fields.version_applied_to
          - entities.TaxLot.fields.version
          - concurrency_rules[basis-apply-stale-lot]
          - errors[ERR_STALE_LOT_VERSION]
        distinguishing_aspect: |
          Third distinct entity pair: BasisChangeRequest → TaxLot. APPROVED →
          APPLIED is only valid while TaxLot.version == version_applied_to
          (snapshot at approval). A corporate action superseding the lot
          between approve and apply bumps the lot's version, so the apply is
          rejected with ERR_STALE_LOT_VERSION.
        test_recipe:
          setup:
            - "Customer C, account A1, lot L1 (10 sh, basis 10000, PURCHASE)"
            - "BasisChangeRequest REQ approved (version_applied_to = lot v at approval)"
            - "Between approve and apply: a SPLIT 2:1 corporate action is applied, superseding L1 (version bumps)"
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm F18" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-XD-3", display_name: "Cross Dep Three" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct1_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "111111121", ticker: "XD3", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-01-05T00:00:00Z", quantity: 10, original_cost_basis_cents: 10000, acquisition_kind: "PURCHASE" }
              as: TaxOps
              captures: { lot1_id: $.data.id, lot1_v: $.data.version }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/basis_change_requests"
              payload: { tax_lot_id: "${lot1_id}", request_kind: "BASIS_AMOUNT_CORRECTION", proposed_basis_cents: 12000, supporting_doc_ref: "DOC-9" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { req_id: $.data.id }
            - call: "POST /firms/${firm_id}/basis_change_requests/${req_id}/start_review"
              payload: {}
              as: TaxOps
            - call: "POST /firms/${firm_id}/basis_change_requests/${req_id}/approve"
              payload: {}
              as: TaxOps
              as_user_id: "taxops-reviewer-1"
            - call: "POST /firms/${firm_id}/securities/${sec_id}/corporate_actions"
              payload: { action_type: "SPLIT", effective_date: "2025-03-01T00:00:00Z", split_ratio_numerator: 2, split_ratio_denominator: 1 }
              as: TaxOps
              captures: { ca_id: $.data.id }
            - call: "POST /firms/${firm_id}/corporate_actions/${ca_id}/apply"
              payload: {}
              as: TaxOps
          trigger:
            - call: "POST /firms/${firm_id}/basis_change_requests/${req_id}/apply"
              payload: { expected_tax_lot_version: "${lot1_v}" }
              as: TaxOps
              as_user_id: "taxops-applier-2"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_LOT_VERSION (corporate action superseded the lot after approval, bumping TaxLot.version past version_applied_to)"
            - "BasisChangeRequest.${req_id}.status == APPROVED (unchanged)"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (≥2 instances, different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: wash_sale_window_symmetric_inclusive_interval
        grounds:
          - calculations.wash_sale_detection
          - entities.WashSaleEvent.fields.wash_sale_window_start
          - entities.WashSaleEvent.fields.wash_sale_window_end
        distinguishing_aspect: |
          Interval semantic: symmetric point-in-window membership with
          INCLUSIVE endpoints on the TaxLot resource — a replacement
          acquisition whose acquisition_date falls anywhere in
          [trade_date - 30, trade_date + 30] collides with the sale. This
          instance places the replacement 30 days BEFORE the sale (the
          back-edge of the window), complementing the +30 front-edge case.
        test_recipe:
          setup:
            - "Customer C, accounts A1 (loss lot) and A2"
            - "A2 lot L2 bought 2025-05-11 (trade_date 2025-06-10 minus 30 days — back edge, inclusive)"
            - "A1 lot L1: 100 sh, 2025-01-05, basis 500000"
            - "PENDING disposition DSP: sell 100 sh, trade 2025-06-10, proceeds 400000"
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm F19" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-OV-1", display_name: "Overlap Window" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct1_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A2", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct2_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "111111122", ticker: "OVW", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct2_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-05-11T00:00:00Z", quantity: 100, original_cost_basis_cents: 410000, acquisition_kind: "PURCHASE" }
              as: TaxOps
              captures: { lot2_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-01-05T00:00:00Z", quantity: 100, original_cost_basis_cents: 500000, acquisition_kind: "PURCHASE" }
              as: TaxOps
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/dispositions"
              payload: { security_id: "${sec_id}", trade_date: "2025-06-10T00:00:00Z", settlement_date: "2025-06-11T00:00:00Z", quantity: 100, proceeds_cents: 400000, method: "FIFO" }
              as: TaxOps
              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /firms/${firm_id}/dispositions/${disp_id}/settle"
              payload: {}
              as: TaxOps
          assert:
            - "Disposition.${disp_id}.is_wash_sale_flag == true (replacement at exactly trade_date - 30 days is inside the inclusive window)"
            - "Disposition.${disp_id}.wash_sale_disallowed_loss_cents == 100000"
            - "TaxLot.${lot2_id}.wash_sale_taint_basis_cents == 100000"

      - name: outbound_transfer_aggregate_capacity_overlap
        grounds:
          - state_machines.TransferStatement.PENDING_to_DELIVERED
          - validations[priority=19]
          - errors[ERR_TRANSFER_INSUFFICIENT_POSITION]
        distinguishing_aspect: |
          Different interval semantic and different resource: AGGREGATE
          CAPACITY on the Account resource rather than point-in-window. Two
          OUTBOUND transfer statements for the same security compete for the
          same share pool: after the first (60 of 100 sh) reaches DELIVERED,
          the second (50 sh) is rejected because the aggregate delivered
          quantity would exceed the position. Not an adjacency/buffer rule —
          an occupation-sum rule.
        test_recipe:
          setup:
            - "Customer C, account A1 with lot L1: 100 sh, basis 100000"
            - "OUTBOUND TransferStatement TS1 for 60 sh (will reach DELIVERED)"
            - "OUTBOUND TransferStatement TS2 for 50 sh (would exceed remaining 40)"
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm F20" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-OV-2", display_name: "Overlap Capacity" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct1_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "111111123", ticker: "CAP", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-01-05T00:00:00Z", quantity: 100, original_cost_basis_cents: 100000, acquisition_kind: "PURCHASE" }
              as: TaxOps
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/transfer_statements"
              payload: { direction: "OUTBOUND", counterparty_firm_name: "Broker X", security_id: "${sec_id}", quantity: 60, transfer_date: "2025-04-01T00:00:00Z", lots_payload: [{ acquisition_date: "2025-01-05T00:00:00Z", quantity: 60, original_cost_basis_cents: 60000 }] }
              as: TaxOps
              captures: { ts1_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/transfer_statements"
              payload: { direction: "OUTBOUND", counterparty_firm_name: "Broker Y", security_id: "${sec_id}", quantity: 50, transfer_date: "2025-04-02T00:00:00Z", lots_payload: [{ acquisition_date: "2025-01-05T00:00:00Z", quantity: 50, original_cost_basis_cents: 50000 }] }
              as: TaxOps
              captures: { ts2_id: $.data.id }
            - call: "POST /firms/${firm_id}/transfer_statements/${ts1_id}/deliver"
              payload: { expected_account_version: "${acct_v0}" }
              as: TaxOps
            - call: "GET /firms/${firm_id}/accounts/${acct1_id}"
              payload: {}
              as: TaxOps
              captures: { acct_v1: $.data.version }
          trigger:
            - call: "POST /firms/${firm_id}/transfer_statements/${ts2_id}/deliver"
              payload: { expected_account_version: "${acct_v1}" }
              as: TaxOps
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_TRANSFER_INSUFFICIENT_POSITION (aggregate occupation 60 + 50 = 110 exceeds the 100-share position; remaining capacity after TS1 is 40)"
            - "TransferStatement.${ts2_id}.status == PENDING (unchanged)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (≥2 instances, different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: corporate_action_basis_conservation
        grounds:
          - calculations.corporate_action_basis_adjustment
          - state_machines.TaxLot.OPEN_to_SUPERSEDED
        distinguishing_aspect: |
          Conserved quantity: total adjusted cost basis across the security
          position. A 2:1 SPLIT supersedes the source lot and spawns a derived
          lot; the invariant is Σ adjusted_cost_basis_cents over non-SUPERSEDED
          lots BEFORE the action == Σ AFTER the action (10000 before, 10000
          after; quantity doubles but per-share halves).
        test_recipe:
          setup:
            - "Customer C, account A1, lot L1: 10 sh, basis 10000"
            - "ANNOUNCED SPLIT 2:1 corporate action"
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm F21" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-INV-1", display_name: "Invariant Basis" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct1_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "111111124", ticker: "INV", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-01-05T00:00:00Z", quantity: 10, original_cost_basis_cents: 10000, acquisition_kind: "PURCHASE" }
              as: TaxOps
              captures: { lot1_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities/${sec_id}/corporate_actions"
              payload: { action_type: "SPLIT", effective_date: "2025-03-01T00:00:00Z", split_ratio_numerator: 2, split_ratio_denominator: 1 }
              as: TaxOps
              captures: { ca_id: $.data.id }
          trigger:
            - call: "POST /firms/${firm_id}/corporate_actions/${ca_id}/apply"
              payload: {}
              as: TaxOps
            - call: "GET /firms/${firm_id}/accounts/${acct1_id}/tax_lots?acquisition_kind=CORPORATE_ACTION_DERIVED"
              payload: {}
              as: TaxOps
              captures: { derived_basis: "$.data[0].adjusted_cost_basis_cents", derived_qty: "$.data[0].quantity" }
          assert:
            - "derived_basis == 10000 (total basis conserved across the supersede+derive pair)"
            - "derived_qty == 20"
            - "TaxLot.${lot1_id}.adjusted_cost_basis_cents remains 10000 but lot_status == SUPERSEDED (excluded from the live basis sum; live sum before == live sum after == 10000)"

      - name: wash_sale_deferral_conservation
        grounds:
          - calculations.wash_sale_detection
          - entities.Disposition.fields.wash_sale_disallowed_loss_cents
          - entities.TaxLot.fields.wash_sale_taint_basis_cents
        distinguishing_aspect: |
          Different conserved quantity: economic loss. The disallowed loss
          removed from the disposition's recognized gain must equal the taint
          added to replacement lots — Σ WashSaleEvent.disallowed_loss_cents
          == Σ Δ(triggering_lot.wash_sale_taint_basis_cents) == 60000, and the
          recognized loss is reduced by exactly the same 60000 (from -100000
          to -40000). No drift between the debit and credit sides.
        test_recipe:
          setup:
            - "Customer C, accounts A1 (loss lot 100 sh basis 500000) and A2 (replacement 60 sh basis 246000)"
            - "PENDING disposition DSP on A1: sell 100 sh, trade 2025-06-10, proceeds 400000"
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm F22" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-INV-2", display_name: "Invariant Deferral" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct1_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A2", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct2_id: $.data.id }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "111111125", ticker: "DEF", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-01-05T00:00:00Z", quantity: 100, original_cost_basis_cents: 500000, acquisition_kind: "PURCHASE" }
              as: TaxOps
            - call: "POST /firms/${firm_id}/accounts/${acct2_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-06-20T00:00:00Z", quantity: 60, original_cost_basis_cents: 246000, acquisition_kind: "PURCHASE" }
              as: TaxOps
              captures: { lot2_id: $.data.id, lot2_basis_pre: $.data.adjusted_cost_basis_cents }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/dispositions"
              payload: { security_id: "${sec_id}", trade_date: "2025-06-10T00:00:00Z", settlement_date: "2025-06-11T00:00:00Z", quantity: 100, proceeds_cents: 400000, method: "FIFO" }
              as: TaxOps
              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /firms/${firm_id}/dispositions/${disp_id}/settle"
              payload: {}
              as: TaxOps
          assert:
            - "Disposition.${disp_id}.wash_sale_disallowed_loss_cents == 60000 (debit side)"
            - "TaxLot.${lot2_id}.wash_sale_taint_basis_cents == 60000 (credit side — equal and opposite)"
            - "TaxLot.${lot2_id}.adjusted_cost_basis_cents - lot2_basis_pre == 60000 (306000 - 246000)"
            - "Disposition.${disp_id}.realized_gain_cents == -40000 (raw loss reduced by exactly the deferred amount; total economic loss -100000 = -40000 recognized - 60000 deferred, conserved)"

      - name: outbound_transfer_deliver_reject_position_restored
        grounds:
          - state_machines.TransferStatement.PENDING_to_DELIVERED
          - state_machines.TransferStatement.DELIVERED_to_REJECTED
        distinguishing_aspect: |
          Third conserved quantity: account share position. The forward action
          (OUTBOUND deliver consumes 60 of 100 shares) paired with its
          compensating action (reject restores them) leaves the Account's
          total quantity_remaining for the security unchanged at 100 and the
          lot's adjusted_cost_basis_cents unchanged at 100000.
        test_recipe:
          setup:
            - "Customer C, account A1, lot L1: 100 sh, basis 100000"
            - "OUTBOUND TransferStatement TS for 60 sh"
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Firm F23" }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers"
              payload: { taxpayer_tin: "TIN-INV-3", display_name: "Invariant Position" }
              as: FirmAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /firms/${firm_id}/customers/${cust_id}/accounts"
              payload: { account_number: "A1", account_type: "TAXABLE", default_disposal_method: "FIFO" }
              as: TaxOps
              captures: { acct1_id: $.data.id, acct_v0: $.data.version }
            - call: "POST /firms/${firm_id}/securities"
              payload: { cusip: "111111126", ticker: "POS", security_type: "EQUITY", covered_security_effective_date: "2011-01-01T00:00:00Z" }
              as: TaxOps
              captures: { sec_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/tax_lots"
              payload: { security_id: "${sec_id}", acquisition_date: "2025-01-05T00:00:00Z", quantity: 100, original_cost_basis_cents: 100000, acquisition_kind: "PURCHASE" }
              as: TaxOps
              captures: { lot1_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct1_id}/transfer_statements"
              payload: { direction: "OUTBOUND", counterparty_firm_name: "Broker X", security_id: "${sec_id}", quantity: 60, transfer_date: "2025-04-01T00:00:00Z", lots_payload: [{ acquisition_date: "2025-01-05T00:00:00Z", quantity: 60, original_cost_basis_cents: 60000 }] }
              as: TaxOps
              captures: { ts_id: $.data.id }
          trigger:
            - call: "POST /firms/${firm_id}/transfer_statements/${ts_id}/deliver"
              payload: { expected_account_version: "${acct_v0}" }
              as: TaxOps
            - call: "GET /firms/${firm_id}/tax_lots/${lot1_id}"
              payload: {}
              as: TaxOps
              captures: { lot_qty_after_deliver: $.data.quantity_remaining }
            - call: "POST /firms/${firm_id}/transfer_statements/${ts_id}/reject"
              payload: {}
              as: TaxOps
            - call: "GET /firms/${firm_id}/tax_lots/${lot1_id}"
              payload: {}
              as: TaxOps
              captures: { lot_qty_after_reject: $.data.quantity_remaining, lot_basis_after_reject: $.data.adjusted_cost_basis_cents, lot_status_after_reject: $.data.lot_status }
          assert:
            - "lot_qty_after_deliver == 40 (forward action consumed 60)"
            - "lot_qty_after_reject == 100 (compensating action restored the full position)"
            - "lot_basis_after_reject == 100000 (basis restored exactly — no drift)"
            - "lot_status_after_reject == OPEN (rolled back from PARTIALLY_DISPOSED)"
