              payload: { project_id: "${proj}", trade_division: "03-CONCRETE", budget_amount: 500000.00, self_perform_intent: true }
              as: ConstructionManager
              captures: { wpa: $.data.id }
            - call: "POST /work-packages"
              payload: { project_id: "${proj}", trade_division: "09-FINISHES", budget_amount: 300000.00, self_perform_intent: false }
              as: ConstructionManager
              captures: { wpb: $.data.id }
          trigger:
            - call: "POST /work-packages/${wpa}/transparency"
              payload: { target_status: "DISCLOSED", disclosure_note: "open-book breakdowns published" }
              as: ProcurementOfficer
            - call: "POST /work-packages/${wpa}/transparency"
              payload: { target_status: "AUDITED" }
              as: IndependentAuditor
            - call: "POST /work-packages/${wpb}/transparency"
              payload: { target_status: "AUDITED" }
              as: IndependentAuditor
          assert:
            - "trigger calls 1 and 2 return 200 and WorkPackage.${wpa}.transparency_status == AUDITED"
            - "WorkPackage.${wpa}.procurement_status is still BUDGETED, awarded_bid_id is null, awarded_amount == 0.00 and bid_count == 0"
            - "trigger call 3 returns 409 with data.error_id == ERR_PACKAGE_STATE_INVALID: the disclosure axis may not skip DISCLOSED"
            - "WorkPackage.${wpb}.transparency_status is still SEALED and procurement_status is still BUDGETED"

