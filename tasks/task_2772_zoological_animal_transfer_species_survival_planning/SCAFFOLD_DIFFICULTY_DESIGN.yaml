          assert:
            - "The first four trigger calls succeed and drive status OFFERED, COUNTERED, OFFERED, COUNTERED in that order"
            - "TransferAgreement.${ta_id}.round_number == 4"
            - "TransferAgreement.${ta_id}.status == COUNTERED"
