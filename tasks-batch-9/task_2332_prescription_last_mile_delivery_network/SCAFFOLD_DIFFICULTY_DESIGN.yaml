        grounds:
          - state_machines.Delivery.OUT_FOR_DELIVERY_to_DELIVERED
          - state_machines.Delivery.PROVISIONAL_to_FINALIZED
          - entities.Delivery.fields.custody_status
          - entities.Delivery.fields.settlement_status
        distinguishing_aspect: |
          Non-linearity here is PARALLEL state dimensions on the Delivery row: custody_status reaches
          its terminal DELIVERED while settlement_status is still PROVISIONAL, then settlement moves
          to FINALIZED with custody_status unchanged, and a further custody trigger on the same row is
          rejected — two dimensions, two independent clocks, one entity.
