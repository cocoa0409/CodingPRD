            - call: "POST /price-integrity/price-change-files/${file_ok}/label-tasks"
              payload: { store_id: "${store_a}", price_change_line_id: "${line_ok}", aisle_id: "${ai_a1}", assigned_associate_id: "${la1}", scheduled_start_at: "2026-08-06T08:00:00Z", scheduled_end_at: "2026-08-06T08:00:00Z", expected_price_change_file_version: "${ok_ver}" }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { e_task: $.data.error_id }
            - call: "POST /price-integrity/exception-reports"
              payload: { store_id: "${store_a}", period_start_at: "2026-08-04T00:00:00Z", period_end_at: "2026-08-03T00:00:00Z" }
              as: ComplianceOfficer
              captures: { e_period: $.data.error_id }
            - call: "POST /price-integrity/exception-reports"
              payload: { store_id: "${store_a}", period_start_at: "2026-08-03T00:00:00Z", period_end_at: "2026-08-04T00:00:00Z" }
              as: ComplianceOfficer
              captures: { e_empty: $.data.error_id }
          assert:
            - "At 2026-08-04T23:59:59Z the distribution succeeds: HTTP 200, ${ok_status} == DISTRIBUTED, ${ok_dist_at} == 2026-08-04T23:59:59Z"
            - "At 2026-08-05T00:00:00Z the identical call on the twin file fails: HTTP 422 with ${e_late} == ERR_EFFECTIVE_DATE_PASSED, and ${late_status} is still DRAFT — the deadline is effective_date + 48h and the test is strict <"
            - "${e_sign} == ERR_INVALID_WINDOW (HTTP 422) for promo_start_at == promo_end_at"
            - "${e_audit} == ERR_INVALID_WINDOW (HTTP 422) for scan_window_start > scan_window_end"
            - "${e_task} == ERR_INVALID_WINDOW (HTTP 422) for scheduled_start_at == scheduled_end_at, reached only because the OCC version ${ok_ver} was correct and the store is OPEN"
            - "${e_period} == ERR_INVALID_WINDOW (HTTP 422) for period_start_at > period_end_at, even though the store has no CLOSED audit at all — priority 58 outranks the priority-63 data guard"
            - "${e_empty} == ERR_NO_QUALIFYING_AUDIT_DATA (HTTP 422) once the same period is well formed, which is the falsifying counterpart of the previous probe"
            - "GET /price-integrity/exception-reports?store_id=${store_a} returns total_count 0"

