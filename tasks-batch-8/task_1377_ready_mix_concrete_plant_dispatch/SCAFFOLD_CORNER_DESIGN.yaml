scaffold_corner_design:
  # =================================================================
  # Section: entities
  # =================================================================
  - section: entities
    instances:
      - name: plant_creation_fields_and_defaults
        claim_type: creation
        grounds: ["entities.Plant.fields.status"]
        distinguishing_aspect: "POST /v1/plants returns 201 with status defaulted to ACTIVE, server-minted id, created_at, and version == 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id" } }
          trigger:
            - { call: "GET /v1/plants/${p_id}", payload: {}, as: PlantManager }
          assert:
            - "Plant.status == ACTIVE (default applied)"
            - "Plant.version == 1 and created_at == 2026-08-01T00:00:00Z (clock default)"
            - "Plant.batch_cycle_minutes == 30"

      - name: customer_creation_defaults
        claim_type: defaults
        grounds: ["entities.Customer.fields.short_load_allowed", "entities.Customer.fields.credit_status"]
        distinguishing_aspect: "Omitting short_load_allowed defaults it to true; credit_status starts GOOD and credit_exposure_cents starts 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 500000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
          trigger:
            - { call: "GET /v1/customers/${c_id}", payload: {}, as: PlantManager }
          assert:
            - "Customer.short_load_allowed == true (default)"
            - "Customer.credit_status == GOOD and credit_exposure_cents == 0"

      - name: order_creation_sets_customer_from_header_and_initial_states
        claim_type: system_fields
        grounds: ["entities.Order.fields.customer_id", "state_machines.Order"]
        distinguishing_aspect: "Order.customer_id is copied from X-User-ID (system, not body); initial parallel state is PLACED x UNPRICED with delivered_qty_yd3 == 0."
        test_recipe:
          setup: ["plant + DRAFT mix + customer exist"]
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [] }, as: PlantManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 100000000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
          trigger:
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 8.0, pour_date: "2026-08-15", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 4.5 }, as: Customer, as_user_id: "${c_id}", captures: { o_id: "$.data.id" } }
          assert:
            - "Order.${o_id}.customer_id == ${c_id} (from X-User-ID, not request body)"
            - "delivery_status == PLACED and billing_status == UNPRICED"
            - "delivered_qty_yd3 == 0 and provisional_total_cents is null until confirm"

      - name: order_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Order.fields.qty_yd3", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required qty_yd3 from order create yields 400 ERR_VALIDATION."
        test_recipe:
          setup: ["plant + mix + customer exist"]
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [] }, as: PlantManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 100000000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
          trigger:
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", pour_date: "2026-08-15", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 4.5 }, as: Customer, as_user_id: "${c_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VALIDATION and http status 400"

      - name: mix_design_duplicate_code_per_plant_returns_invalid_request
        claim_type: type_constraints
        grounds: ["entities.MixDesign.fields.code", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Second mix design with the same (plant_id, code) is rejected as a uniqueness violation with ERR_VALIDATION."
        test_recipe:
          setup: ["plant exists; mix M4000 already created on it"]
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [] }, as: PlantManager }
          trigger:
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "duplicate", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [] }, as: PlantManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VALIDATION (uniqueness on (plant_id, code))"

      - name: get_nonexistent_order_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent order id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Dispatcher, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NOT_FOUND and http status 404"

      - name: water_addition_immutable_event_shape
        claim_type: immutability
        grounds: ["entities.WaterAddition.fields.added_by_user_id", "entities.WaterAddition.fields.added_at"]
        distinguishing_aspect: "WaterAddition has common_fields false: the response carries id and created_at but no version field; no update endpoint exists."
        test_recipe:
          setup: ["standard catalog; one load POURING"]
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [] }, as: PlantManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /v1/mix-designs/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", expected_plant_version: "${p_v}", base_price_per_yd3_cents: 15000, escalation_base_index_points: 100.0, min_load_yd3: 4.0, short_load_fee_cents: 7500, wait_free_minutes: 60, wait_rate_per_minute_cents: 250, wait_fee_cap_cents: 15000, saturday_surcharge_pct: 0.10, activate: true }, as: PlantManager }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 100000000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /v1/trucks", payload: { plant_id: "${p_id}", fleet_number: "T1", capacity_yd3: 10.0 }, as: Dispatcher, captures: { t1_id: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 8.0, pour_date: "2026-08-15", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 4.5 }, as: Customer, as_user_id: "${c_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /v1/orders/${o_id}/confirm", payload: {}, as: Dispatcher, captures: { o_v1: "$.data.version" } }
            - { call: "POST /v1/orders/${o_id}/loads", payload: { qty_yd3: 8.0, expected_order_version: "${o_v1}", truck_id: "${t1_id}" }, as: Dispatcher, captures: { l_id: "$.data.id" } }
            - { call: "POST /v1/loads/${l_id}/batch", payload: { batch_time: "2026-08-15T10:00:00Z" }, as: BatchOperator }
            - { call: "POST /v1/loads/${l_id}/depart", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T10:30:00Z" }, as: PlantManager }
            - { call: "POST /v1/loads/${l_id}/arrive", payload: {}, as: Driver, as_user_id: "drv-1" }
          trigger:
            - { call: "POST /v1/loads/${l_id}/water-additions", payload: { gallons: 20, customer_authorized: true }, as: Driver, as_user_id: "drv-1", captures: { wa_id: "$.data.id" } }
          assert:
            - "WaterAddition response has id and created_at but NO version or updated_at key (common_fields: false)"
            - "added_by_user_id == drv-1 and added_at == 2026-08-15T10:30:00Z"
            - "Load.${l_id}.actual_wc_ratio == 0.487 after 20 gal ((2030 + 166.8) / 4512)"

      - name: order_list_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope"]
        distinguishing_aspect: "GET /v1/orders?limit=1 returns data length 1 with total_count 2 and has_more true; offset=1 returns the second row with has_more false."
        test_recipe:
          setup: ["plant + mix + customer; two orders placed by the customer"]
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [] }, as: PlantManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 100000000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 8.0, pour_date: "2026-08-15", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 4.5 }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 5.0, pour_date: "2026-08-16", pour_window_start: "08:00", pour_window_end: "11:00", slump_in: 4.0 }, as: Customer, as_user_id: "${c_id}" }
          trigger:
            - { call: "GET /v1/orders", payload: { customer_id: "${c_id}", limit: 1, offset: 0 }, as: Dispatcher }
          assert:
            - "data length == 1, total_count == 2, has_more == true"
            - "GET with limit 1 offset 1 returns the other order and has_more == false"

  # =================================================================
  # Section: state_machines
  # =================================================================
  - section: state_machines
    instances:
      - name: load_initial_state_scheduled
        claim_type: initial_state
        grounds: ["state_machines.Load"]
        distinguishing_aspect: "A newly scheduled load starts in SCHEDULED with discharged_qty_yd3 == 0, over_watered == false, strength_liability == NONE."
        test_recipe:
          setup: ["standard catalog; confirmed order qty 8.0"]
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [] }, as: PlantManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /v1/mix-designs/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", expected_plant_version: "${p_v}", base_price_per_yd3_cents: 15000, escalation_base_index_points: 100.0, min_load_yd3: 4.0, short_load_fee_cents: 7500, wait_free_minutes: 60, wait_rate_per_minute_cents: 250, wait_fee_cap_cents: 15000, saturday_surcharge_pct: 0.10, activate: true }, as: PlantManager }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 100000000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /v1/trucks", payload: { plant_id: "${p_id}", fleet_number: "T1", capacity_yd3: 10.0 }, as: Dispatcher, captures: { t1_id: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 8.0, pour_date: "2026-08-15", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 4.5 }, as: Customer, as_user_id: "${c_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /v1/orders/${o_id}/confirm", payload: {}, as: Dispatcher, captures: { o_v1: "$.data.version" } }
          trigger:
            - { call: "POST /v1/orders/${o_id}/loads", payload: { qty_yd3: 8.0, expected_order_version: "${o_v1}", truck_id: "${t1_id}" }, as: Dispatcher, captures: { l_id: "$.data.id" } }
          assert:
            - "Load.${l_id}.status == SCHEDULED"
            - "Load.discharged_qty_yd3 == 0, over_watered == false, strength_liability == NONE, plant_id == ${p_id}"
            - "Order.${o_id}.delivery_status == SCHEDULED (first load auto-transition from CONFIRMED)"

      - name: complete_from_scheduled_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Load", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST complete on a SCHEDULED (never batched) load fails with ERR_INVALID_STATE even though discharged_qty_yd3 equals qty — state beats the volume check."
        test_recipe:
          setup: ["standard catalog; confirmed order; one SCHEDULED 8.0 yd3 load"]
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [] }, as: PlantManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /v1/mix-designs/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", expected_plant_version: "${p_v}", base_price_per_yd3_cents: 15000, escalation_base_index_points: 100.0, min_load_yd3: 4.0, short_load_fee_cents: 7500, wait_free_minutes: 60, wait_rate_per_minute_cents: 250, wait_fee_cap_cents: 15000, saturday_surcharge_pct: 0.10, activate: true }, as: PlantManager }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 100000000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /v1/trucks", payload: { plant_id: "${p_id}", fleet_number: "T1", capacity_yd3: 10.0 }, as: Dispatcher, captures: { t1_id: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 8.0, pour_date: "2026-08-15", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 4.5 }, as: Customer, as_user_id: "${c_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /v1/orders/${o_id}/confirm", payload: {}, as: Dispatcher, captures: { o_v1: "$.data.version" } }
            - { call: "POST /v1/orders/${o_id}/loads", payload: { qty_yd3: 8.0, expected_order_version: "${o_v1}", truck_id: "${t1_id}" }, as: Dispatcher, captures: { l_id: "$.data.id" } }
          trigger:
            - { call: "POST /v1/loads/${l_id}/complete", payload: { discharged_qty_yd3: 8.0 }, as: Driver, as_user_id: "drv-1", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE; Load remains SCHEDULED; no charge fields set"

      - name: cancel_completed_load_rejected_terminal
        claim_type: terminal_lockdown
        grounds: ["state_machines.Load", "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "COMPLETED is terminal: cancel on a COMPLETED load fails with ERR_ALREADY_TERMINAL (not ERR_INVALID_STATE)."
        test_recipe:
          setup: ["standard catalog (2026-08 index 115.0); one load COMPLETED for a qty 8.0 order"]
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [] }, as: PlantManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /v1/mix-designs/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", expected_plant_version: "${p_v}", base_price_per_yd3_cents: 15000, escalation_base_index_points: 100.0, min_load_yd3: 4.0, short_load_fee_cents: 7500, wait_free_minutes: 60, wait_rate_per_minute_cents: 250, wait_fee_cap_cents: 15000, saturday_surcharge_pct: 0.10, activate: true }, as: PlantManager }
            - { call: "POST /v1/cement-price-indices", payload: { plant_id: "${p_id}", effective_month: "2026-08", index_points: 115.0 }, as: PlantManager }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 100000000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /v1/trucks", payload: { plant_id: "${p_id}", fleet_number: "T1", capacity_yd3: 10.0 }, as: Dispatcher, captures: { t1_id: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 8.0, pour_date: "2026-08-15", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 4.5 }, as: Customer, as_user_id: "${c_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /v1/orders/${o_id}/confirm", payload: {}, as: Dispatcher, captures: { o_v1: "$.data.version" } }
            - { call: "POST /v1/orders/${o_id}/loads", payload: { qty_yd3: 8.0, expected_order_version: "${o_v1}", truck_id: "${t1_id}" }, as: Dispatcher, captures: { l_id: "$.data.id" } }
            - { call: "POST /v1/loads/${l_id}/batch", payload: { batch_time: "2026-08-15T10:00:00Z" }, as: BatchOperator }
            - { call: "POST /v1/loads/${l_id}/depart", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T10:30:00Z" }, as: PlantManager }
            - { call: "POST /v1/loads/${l_id}/arrive", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T11:00:00Z" }, as: PlantManager }
            - { call: "POST /v1/loads/${l_id}/complete", payload: { discharged_qty_yd3: 8.0 }, as: Driver, as_user_id: "drv-1" }
          trigger:
            - { call: "POST /v1/loads/${l_id}/cancel", payload: {}, as: Dispatcher, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_ALREADY_TERMINAL; Load remains COMPLETED; charges unchanged (final_charge_cents == 138000)"

      - name: batch_creates_ticket_and_flips_truck
        claim_type: side_effect_execution
        grounds: ["state_machines.Load.SCHEDULED_to_BATCHED", "state_machines.Truck"]
        distinguishing_aspect: "Batch side effects all fire: BatchTicket exists with ticket_number 1, Truck goes ON_DELIVERY, Order goes IN_PROGRESS, initial actual_wc_ratio == design 0.450."
        test_recipe:
          setup: ["standard catalog; confirmed order qty 8.0; one SCHEDULED load on T1"]
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [ { admixture_code: "AEA", dose_oz_per_cwt: 1.55 }, { admixture_code: "WR", dose_oz_per_cwt: 2.65 } ] }, as: PlantManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /v1/mix-designs/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", expected_plant_version: "${p_v}", base_price_per_yd3_cents: 15000, escalation_base_index_points: 100.0, min_load_yd3: 4.0, short_load_fee_cents: 7500, wait_free_minutes: 60, wait_rate_per_minute_cents: 250, wait_fee_cap_cents: 15000, saturday_surcharge_pct: 0.10, activate: true }, as: PlantManager }
