      - name: pcn_accept_spawns_ecr_depth2
        grounds:
          - state_machines.SupplierChangeNotice.UNDER_ASSESSMENT_to_ACCEPTED
          - entities.SupplierChangeNotice.fields.spawned_ecr_id
          - entities.EngineeringChangeRequest.fields.source_pcn_id
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (PCN accept): accepting a PCN (A) creates an
          ECR (B), and that created ECR's existence is recorded back on PCN.spawned_ecr_id (C
          = mutation on the PCN row caused by the ECR creation). Distinct propagation pattern
          from the make-effective cascade.
        test_recipe:
          setup:
            - "A BUY part with a default supplier, and a PCN in UNDER_ASSESSMENT for it."
          setup_api_calls:
            - call: "POST /plm/suppliers"
              payload: { name: "Sup", supplier_code: "SUP-PCN" }
              as: SupplierManager
              captures: { sup_id: $.data.id }
