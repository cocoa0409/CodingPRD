      - name: withdrawn_request_cannot_advance
        claim_type: terminal_lockdown
        grounds: [state_machines.InterconnectionRequest, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "WITHDRAWN is terminal: any further phase advance is rejected and the queue_position stays 0."
        test_recipe:
          setup: ["Project P with a request withdrawn from QUEUED"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Lock Farm", technology: "WIND", target_capacity_mw: 40, resource_class: "A" }
              as: DeveloperAdmin
              captures: { p: $.data.id }
            - call: "POST /api/projects/${p}/interconnection-requests"
              payload: { cluster_id: "CL-L", requested_capacity_mw: 40 }
              as: OriginationManager
              captures: { r: $.data.id }
            - call: "POST /api/interconnection-requests/${r}/transitions"
              payload: { to: "WITHDRAWN" }
              as: OriginationManager
          trigger:
            - call: "POST /api/interconnection-requests/${r}/transitions"
              payload: { to: "FEASIBILITY_STUDY" }
              as: OriginationManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "InterconnectionRequest.${r}.queue_position == 0"

