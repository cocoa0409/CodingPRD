  # =========================================================================
  # Endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: listings_filtered_by_shop_id_reverse_reach
        claim_type: Standard CRUD
        grounds:
          - "endpoints"
          - "entities.Listing.fields.shop_id"
        distinguishing_aspect: "GET /seller/listings?shop_id={id} returns the two listings created under that shop (FK reverse-reachability)."
        test_recipe:
          setup: ["Shop with two listings."]
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /seller/shipping-profiles"
              payload: { shop_id: "${shop_id}", name: "US", base_cost_cents: 0, per_item_cost_cents: 0 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "A", fulfillment_type: "READY_TO_SHIP", processing_time_days: 1, price_cents: 1000, quantity: 1 }
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "B", fulfillment_type: "READY_TO_SHIP", processing_time_days: 1, price_cents: 1000, quantity: 1 }
              as: Seller
              as_user_id: "${shop_id}"
          trigger:
            - call: "GET /seller/listings"
              payload: { shop_id: "${shop_id}" }
              as: Seller
              as_user_id: "${shop_id}"
          assert:
            - "response meta pagination total_count == 2"
            - "every returned Listing.shop_id == ${shop_id}"

