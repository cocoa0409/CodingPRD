            - call: "POST /allocation-cycles"
              payload: { plant_id: "${plant_id}", product_line_id: "${pl_a}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", allocation_basis: "CONTRACT_FIRST" }
              as: ChannelManager
