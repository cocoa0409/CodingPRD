              as: Shipper
              as_user_id: "${s1}"
              captures: { n1: $.data.id }
            - call: "POST /nominations/${n1}/submit"
              payload: {}
              as: Shipper
              as_user_id: "${s1}"
            - call: "POST /nominations/${n1}/confirm"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /emergency-events"
              payload: { storage_field_id: "${f1}", event_type: "OVERPRESSURE", severity: "CRITICAL", detected_at: "2026-08-01T00:00:00Z" }
              as: FieldOperator
              captures: { ev1: $.data.id }
          trigger:
