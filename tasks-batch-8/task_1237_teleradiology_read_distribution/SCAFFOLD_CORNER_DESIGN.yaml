  - section: endpoints
    instances:
      - name: assignments_filtered_by_study_reverse_lookup
        claim_type: cross_reference
        grounds: [entities.Assignment.fields.study_id, "endpoints.GET /telerad/assignments"]
        distinguishing_aspect: "GET /telerad/assignments?study_id=X returns exactly the assignments of that study (FK reverse reachability): 2 rows after an assign+release+reassign cycle, both with study_id == X."
        test_recipe:
          setup: ["full fixture with rad_a, rad_b; study assigned to rad_a, released, reassigned to rad_b"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp RL", state_code: "CA" }, as: PlatformAdmin, captures: { hosp: $.data.id, hv: $.data.version } }
            - { call: "POST /telerad/hospitals/${hosp}/activate", payload: {}, as: PlatformAdmin, captures: { hv: $.data.version } }
