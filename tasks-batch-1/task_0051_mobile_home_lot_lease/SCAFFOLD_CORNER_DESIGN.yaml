              as: ParkManager
              captures: { lease_id: $.data.id }
            - call: "POST /lot-leases/${lease_id}/activate"
              payload: {}
              as: ParkManager
            - call: "POST /conversion-votes"
              payload: { community_id: "${comm_id}", quorum_threshold_pct: 0.5 }
              as: ParkManager
              captures: { vote_id: $.data.id }
            - call: "POST /conversion-votes/${vote_id}/open"
              payload: {}
              as: ParkManager
          trigger:
            - call: "POST /conversion-votes/${vote_id}/tally"
              payload: {}
              as: ParkManager
            - call: "GET /communities/${comm_id}"
              payload: {}
              as: ParkManager
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: ParkManager
          assert:
            - "ConversionVote.${vote_id}.status == FAILED"
            - "Community.${comm_id}.ownership_model == PARK_OWNED"
            - "Lot.${lot_id}.status == OCCUPIED"

