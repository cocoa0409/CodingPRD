  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: window_locked_state_46_outranks_exclusion_limit_fiscal_80
        grounds:
          - validations[priority=46]
          - validations[priority=80]
          - errors.ERR_ELECTION_WINDOW_NOT_OPEN
          - errors.ERR_EXCLUSION_LIMIT_EXCEEDED
          - calculations.election_pretax_exclusion_split
        distinguishing_aspect: |
          Category pair state x business_fiscal. The same request body violates BOTH rules and the
          recipe first proves the low-priority one really is violated (identical body against an OPEN
          window returns ERR_EXCLUSION_LIMIT_EXCEEDED), then re-sends it against the now-LOCKED
          window and demands ERR_ELECTION_WINDOW_NOT_OPEN (409) - the cheap state gate must be
          evaluated before the exclusion-split arithmetic, not after.
        test_recipe:
          setup:
            - "Employer 'Austin Ride Share Benefits' is ACTIVE in the non-covered region US-TX-AUS with transit_group_limit_cents 10000, parking_group_limit_cents 10000, pretax_ratio_cap_pct 100, spill_policy REJECT_OVERAGE and program_cap_cents 5000000."
            - "One TRANSIT_PASS category with monthly_exclusion_limit_cents 10000 exists, so a 15000 pre-tax request overshoots the shared limit by 5000."
            - "One employee holds a TRANSIT_PASS BenefitAccount; ordinance_mandate_status stays UNASSESSED because the region is not covered and no assessment is run."
            - "ElectionWindow 2026-08 occupies [2026-07-01T00:00:00Z, 2026-08-20T00:00:00Z) and starts OPEN; the clock is at its 2026-08-01T00:00:00Z default, well inside the cutoff."
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Austin Ride Share Benefits", region_code: "US-TX-AUS", transit_group_limit_cents: 10000, parking_group_limit_cents: 10000, pretax_ratio_cap_pct: 100, spill_policy: "REJECT_OVERAGE", program_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { er_id: $.data.id }
            - call: "POST /benefits/benefit-categories"
              payload: { employer_id: "${er_id}", category_type: "TRANSIT_PASS", monthly_exclusion_limit_cents: 10000, pretax_allowed: true, posttax_allowed: true }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /benefits/employers/${er_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/employees"
              payload: { employer_id: "${er_id}", external_ref: "AUS-1", work_region_code: "US-TX-AUS", payroll_cycle: "MONTHLY", hire_date: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /benefits/benefit-accounts"
              payload: { employee_id: "${emp_id}", benefit_category_id: "${cat_id}" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /benefits/election-windows"
              payload: { employer_id: "${er_id}", benefit_month: "2026-08", opens_at: "2026-07-01T00:00:00Z", cutoff_at: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { win_id: $.data.id }
            - call: "POST /benefits/election-windows/${win_id}/open"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/elections"
              payload: { employee_id: "${emp_id}", election_window_id: "${win_id}", benefit_category_id: "${cat_id}", pretax_amount_cents: 15000, posttax_amount_cents: 0, expected_account_version: "${acct_v}" }
              as: ProgramAdmin
              captures: { lone_fiscal_error: $.data.error_id }
            - call: "POST /benefits/election-windows/${win_id}/lock"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /benefits/elections"
              payload: { employee_id: "${emp_id}", election_window_id: "${win_id}", benefit_category_id: "${cat_id}", pretax_amount_cents: 15000, posttax_amount_cents: 0, expected_account_version: "${acct_v}" }
              as: ProgramAdmin
              captures: { paired_error: $.data.error_id }
          assert:
            - "${lone_fiscal_error} == ERR_EXCLUSION_LIMIT_EXCEEDED"
            - "the pre-lock attempt returned HTTP 422"
            - "${paired_error} == ERR_ELECTION_WINDOW_NOT_OPEN"
            - "the post-lock attempt returned HTTP 409, NOT 422"
            - "ElectionWindow.${win_id}.election_count == 0"
            - "BenefitAccount.${acct_id}.version == ${acct_v}"
            - "no Election row exists for employee ${emp_id}"

