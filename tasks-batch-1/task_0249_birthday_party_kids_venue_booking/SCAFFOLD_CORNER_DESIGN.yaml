          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Vg1", weather_dependent: false }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", name: "Rg1", max_capacity: 20, buffer_minutes: 30 }
              as: VenueManager
              captures: { r_id: $.data.id }
            - call: "POST /packages"
              payload: { venue_id: "${v_id}", theme: "Dino", base_price_cents: 30000, included_children: 8, per_extra_child_cents: 1500, base_duration_minutes: 120, deposit_pct: 0.25 }
              as: VenueManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T09:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { room_id: "${r_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T10:00:00Z", children_count: 8 }
              as: Coordinator
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/hold"
              payload: {}
              as: Coordinator
          trigger:
            - call: "POST /bookings/${b_id}/confirm"
              payload: {}
              as: Guardian
              as_user_id: "${b_id}"
              captures: { eid: $.data.error_id }
          assert:
            - "response code == 403"
            - "response.data.error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "Booking.${b_id}.status == HELD"

      - name: coordinator_cannot_create_venue
        claim_type: exclusive_denied
        grounds:
          - roles.Coordinator
          - roles.VenueManager
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "Coordinator calling POST /venues (VenueManager-exclusive) returns ERR_INSUFFICIENT_PERMISSIONS (403) — peer-role isolation."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /venues"
              payload: { name: "Nope" }
              as: Coordinator
              captures: { eid: $.data.error_id }
          assert:
            - "response code == 403"
            - "response.data.error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: missing_user_context_header
        claim_type: exclusive_denied
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "A request with no X-User-Role header returns ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (401) before any other check."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /venues"
              payload: {}
              as: NoRole
              captures: { eid: $.data.error_id }
          assert:
            - "response code == 401"
            - "response.data.error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: finance_clerk_void_charge_allowed
        claim_type: exclusive_allowed
        grounds: [roles.FinanceClerk, state_machines.Payment.SETTLED_to_VOIDED]
        excluded_because:
          difficulty_instance: compensating_invariant / ci_payment_charge_void_money_conserved
          rationale: "The §1.8 invariant instance exercises FinanceClerk voiding a CHARGE successfully."

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_on_reschedule
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reschedule-stale-booking]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "A reschedule carrying an expected_booking_version one behind the booking's current version returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Weather-eligible WEATHER_HOLD booking; capture its version, then deliberately send version-1."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Vocc", weather_dependent: true }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", name: "Rocc", room_kind: "OUTDOOR", max_capacity: 20, buffer_minutes: 30 }
              as: VenueManager
              captures: { r_id: $.data.id }
            - call: "POST /packages"
              payload: { venue_id: "${v_id}", theme: "Dino", base_price_cents: 30000, included_children: 8, per_extra_child_cents: 1500, base_duration_minutes: 120, deposit_pct: 0.25 }
              as: VenueManager
              captures: { p_id: $.data.id }
            - call: "POST /staff-members"
              payload: { venue_id: "${v_id}", full_name: "Host H", skills: ["HOST"] }
              as: VenueManager
              captures: { sm_host: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T09:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { room_id: "${r_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T10:00:00Z", children_count: 8 }
              as: Coordinator
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/hold"
              payload: {}
              as: Coordinator
            - call: "POST /bookings/${b_id}/staff-assignments"
              payload: { staff_member_id: "${sm_host}", role_on_event: "HOST" }
              as: Coordinator
            - call: "POST /bookings/${b_id}/waivers"
              payload: { child_name: "c1", guardian_signature: "sig" }
              as: Coordinator
              captures: { w1: $.data.id }
            - call: "POST /bookings/${b_id}/waivers/${w1}/sign"
              payload: { guardian_signature: "sig" }
              as: Coordinator
            - call: "POST /bookings/${b_id}/payments"
              payload: { direction: "CHARGE", amount_cents: 7500, purpose: "DEPOSIT" }
              as: FinanceClerk
            - call: "POST /bookings/${b_id}/confirm"
              payload: {}
              as: Coordinator
            - call: "POST /bookings/${b_id}/weather-hold"
              payload: {}
              as: Coordinator
              captures: { v_wh: $.data.version }
          trigger:
            - call: "PATCH /bookings/${b_id}/reschedule"
              payload: { event_start_utc: "2026-07-05T10:00:00Z", expected_booking_version: "${v_wh} - 1" }
              as: Coordinator
              captures: { eid: $.data.error_id }
          assert:
            - "response code == 412"
            - "response.data.error_id == ERR_STALE_VERSION"
            - "Booking.${b_id}.status == WEATHER_HOLD"

      - name: occ_correct_version_reschedule_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reschedule-stale-booking]
          - state_machines.Booking.WEATHER_HOLD_to_RESCHEDULED
        excluded_because:
          difficulty_instance: non_linear_state_machine / nlsm_booking_weather_reschedule_cycle
          rationale: "The §1.8 cycle instance reschedules with the captured current version and asserts success + version bump."

      - name: derived_balance_reconciles_after_payment
        claim_type: derived_field_reconciliation
        grounds: [calculations.amount_paid_reconcile, entities.Booking.fields.balance_due_cents]
        distinguishing_aspect: "After a CHARGE of 10000 on a 30000-quote HELD booking, balance_due_cents reconciles to 20000 and payment_status to DEPOSIT_PAID (deposit 7500 met)."
        test_recipe:
          setup: ["HELD booking children 8 (quote 30000, deposit 7500), pay 10000."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Vdr", weather_dependent: false }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", name: "Rdr", max_capacity: 20, buffer_minutes: 30 }
              as: VenueManager
              captures: { r_id: $.data.id }
            - call: "POST /packages"
              payload: { venue_id: "${v_id}", theme: "Dino", base_price_cents: 30000, included_children: 8, per_extra_child_cents: 1500, base_duration_minutes: 120, deposit_pct: 0.25 }
              as: VenueManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T09:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { room_id: "${r_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T10:00:00Z", children_count: 8 }
              as: Coordinator
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/hold"
              payload: {}
              as: Coordinator
          trigger:
            - call: "POST /bookings/${b_id}/payments"
              payload: { direction: "CHARGE", amount_cents: 10000, purpose: "BALANCE" }
              as: FinanceClerk
          assert:
            - "Booking.${b_id}.amount_paid_cents == 10000"
            - "Booking.${b_id}.balance_due_cents == 20000"
            - "Booking.${b_id}.payment_status == DEPOSIT_PAID"

      - name: clock_scheduled_action_gates_weather_hold
        claim_type: scheduled_actions
        grounds: [endpoints, entities.Booking.fields.weather_eligible]
        excluded_because:
          difficulty_instance: non_linear_state_machine / nlsm_booking_weather_reschedule_cycle
          rationale: "The clock-gated weather-hold path is exercised positively by the §1.8 weather/reschedule cycle instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_quote_visible_in_create_response
        claim_type: immediate
        grounds: [entities.Booking.fields.quote_total_cents]
        distinguishing_aspect: "POST /bookings returns quote_total_cents computed in the same response (immediate consistency), not on a later read."
        test_recipe:
          setup: ["Venue/Room/Package; booking children 11 (overage 3 -> quote 34500)."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Vim", weather_dependent: false }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", name: "Rim", max_capacity: 20, buffer_minutes: 30 }
              as: VenueManager
              captures: { r_id: $.data.id }
            - call: "POST /packages"
              payload: { venue_id: "${v_id}", theme: "Dino", base_price_cents: 30000, included_children: 8, per_extra_child_cents: 1500, base_duration_minutes: 120, deposit_pct: 0.25 }
              as: VenueManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T09:00:00Z" }
              as: Coordinator
          trigger:
            - call: "POST /bookings"
              payload: { room_id: "${r_id}", package_id: "${p_id}", event_start_utc: "2026-07-01T10:00:00Z", children_count: 11 }
              as: Coordinator
              captures: { qt: $.data.quote_total_cents }
          assert:
            - "response code == 201"
            - "Booking.create response.data.quote_total_cents == 34500"
