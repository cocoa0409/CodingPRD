scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — dual_variant_calc (≥ 2 instances, different entity domains)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: permit_fee_prescriptive_vs_alternative_means
        grounds:
          - calculations.permit_fee_calculation
          - entities.PermitApplication.fields.fee_due_cents
          - entities.Jurisdiction.fields.permits_prescriptive_printed_path
        distinguishing_aspect: |
          Same StructuralPlan and same Site, but two PermitApplications routed through
          different code paths produce different fee_due_cents. The ALTERNATIVE_MEANS
          variant adds the AM_SURCHARGE_CENTS = 175000 before the round multiplier;
          the PRESCRIPTIVE variant does not. Inputs are pinned so the literals are
          computable: plan_area_m2 = 100 → area_component = floor(100) * 4500 = 450000.
          PRESCRIPTIVE fee = round_half_up(250000 + 450000 + 0) * 1.0 = 700000 cents.
          ALTERNATIVE_MEANS fee = round_half_up(250000 + 450000 + 175000) * 1.0 = 875000 cents.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Jurisdiction J1 has permits_prescriptive_printed_path = true (PRESCRIPTIVE allowed)."
            - "Jurisdiction J2 has permits_prescriptive_printed_path = false (forces AM route)."
            - "One StructuralPlan with plan_area_m2 = 100 and an APPROVED PlanRevision."
            - "Site A under J1; Site B under J2."
          setup_api_calls:
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /construction/jurisdictions"
              payload: { code: "J1", name: "Jurisdiction One", permits_prescriptive_printed_path: true, alternative_means_review_days: 30, weather_station_id: "WX1" }
              as: PlatformAdmin
              captures: { j1_id: $.data.id }
            - call: "POST /construction/jurisdictions"
              payload: { code: "J2", name: "Jurisdiction Two", permits_prescriptive_printed_path: false, alternative_means_review_days: 30, weather_station_id: "WX2" }
              as: PlatformAdmin
              captures: { j2_id: $.data.id }
            - call: "POST /construction/structural-plans"
              payload: { title: "Plan X", structural_system: "PRINTED_WALL", wall_thickness_mm: 200, wall_height_mm: 3000, plan_area_m2: 100 }
              as: Engineer
              captures: { plan_id: $.data.id }
            - call: "POST /construction/structural-plans/${plan_id}/revisions"
              payload: { engineering_notes: "r1", required_code_path: "PRESCRIPTIVE" }
              as: Engineer
              captures: { rev_id: $.data.id }
            - call: "POST /construction/structural-plans/${plan_id}/revisions/${rev_id}/action"
              payload: { action: "SUBMIT" }
              as: Engineer
              as_user_id: "eng-alice"
            - call: "POST /construction/structural-plans/${plan_id}/revisions/${rev_id}/action"
              payload: { action: "APPROVE" }
              as: Engineer
              as_user_id: "eng-bob"
            - call: "POST /construction/sites"
              payload: { jurisdiction_id: "${j1_id}", address: "1 A St", soil_class: "A", foundation_kind: "SLAB" }
              as: SiteManager
              captures: { site_a: $.data.id }
            - call: "POST /construction/sites"
              payload: { jurisdiction_id: "${j2_id}", address: "2 B St", soil_class: "A", foundation_kind: "SLAB" }
              as: SiteManager
              captures: { site_b: $.data.id }
            - call: "POST /construction/sites/${site_a}/permit-applications"
              payload: { plan_revision_id: "${rev_id}", requested_path: "PRESCRIPTIVE" }
              as: PermitCoordinator
              captures: { pa_a: $.data.id }
            - call: "POST /construction/sites/${site_b}/permit-applications"
              payload: { plan_revision_id: "${rev_id}", requested_path: "ALTERNATIVE_MEANS" }
              as: PermitCoordinator
              captures: { pa_b: $.data.id }
          trigger:
            - call: "POST /construction/sites/${site_a}/permit-applications/${pa_a}/action"
              payload: { action: "SUBMIT" }
              as: PermitCoordinator
            - call: "POST /construction/sites/${site_b}/permit-applications/${pa_b}/action"
              payload: { action: "SUBMIT" }
              as: PermitCoordinator
          assert:
            - "PermitApplication.${pa_a}.fee_due_cents == 700000"
            - "PermitApplication.${pa_a}.status == SUBMITTED"
            - "PermitApplication.${pa_b}.fee_due_cents == 875000"
            - "PermitApplication.${pa_b}.status == AM_REVIEW"
            - "PermitApplication.${pa_a}.fee_due_cents != PermitApplication.${pa_b}.fee_due_cents"

      - name: learning_curve_forward_looking_vs_chronological
        grounds:
          - calculations.learning_curve_factor
          - calculations.print_window_utilization
          - entities.CommunityDeployment.fields.learning_curve_factor
          - entities.CommunityDeployment.fields.learning_curve_variant
        distinguishing_aspect: |
          Two CommunityDeployments on identical scenarios — same plans, same print
          duration actuals — produce different learning_curve_factor values purely
          because of the variant flag. FORWARD_LOOKING mixes the in-flight print's
          estimate into the rolling average; CHRONOLOGICAL only counts COMPLETED
          jobs. Pin inputs: 3 completed units at 480 minutes each (baseline = 480),
          then a 4th unit starts (PRINTING) with total_layers_planned = 30 → forward
          estimate = ceil(30 * 8) = 240 minutes. Forward factor = round_half_up(
          mean(480,480,240)/480, 4 ) = round_half_up(400/480, 4) = 0.8333.
          Chronological factor (no in-flight mixed in) = round_half_up(480/480, 4) = 1.0000.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; weather permits; approved plans."
            - "Two CommunityDeployments D_F (variant=FORWARD_LOOKING) and D_C (variant=CHRONOLOGICAL) on the same plan."
            - "Three sites in each deployment are already COMPLETED with continuous_run_minutes = 480 each."
            - "A fourth site in each deployment has a PrintJob in PRINTING with total_layers_planned = 30."
            - "We skip laborious setup by relying on a fixture composition: full site→print→inspect→complete cycles per completed unit."
          setup_api_calls:
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /construction/jurisdictions"
              payload: { code: "JX", name: "Juris X", permits_prescriptive_printed_path: true, alternative_means_review_days: 30, weather_station_id: "WX" }
              as: PlatformAdmin
              captures: { jx_id: $.data.id }
            - call: "POST /construction/structural-plans"
              payload: { title: "Plan Y", structural_system: "PRINTED_WALL", wall_thickness_mm: 200, wall_height_mm: 3000, plan_area_m2: 80 }
              as: Engineer
              captures: { plan_id: $.data.id }
            - call: "POST /construction/structural-plans/${plan_id}/revisions"
              payload: { engineering_notes: "r1", required_code_path: "PRESCRIPTIVE" }
              as: Engineer
              captures: { rev_id: $.data.id }
            - call: "POST /construction/structural-plans/${plan_id}/revisions/${rev_id}/action"
              payload: { action: "SUBMIT" }
              as: Engineer
              as_user_id: "eng-alice"
            - call: "POST /construction/structural-plans/${plan_id}/revisions/${rev_id}/action"
              payload: { action: "APPROVE" }
              as: Engineer
              as_user_id: "eng-bob"
            - call: "POST /construction/community-deployments"
              payload: { name: "D_F", jurisdiction_id: "${jx_id}", plan_id: "${plan_id}", planned_unit_count: 5 }
              as: PlatformAdmin
              captures: { dep_f: $.data.id }
            - call: "POST /construction/community-deployments"
              payload: { name: "D_C", jurisdiction_id: "${jx_id}", plan_id: "${plan_id}", planned_unit_count: 5 }
              as: PlatformAdmin
              captures: { dep_c: $.data.id }
            - call: "POST /construction/community-deployments/${dep_f}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /construction/community-deployments/${dep_c}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /construction/community-deployments/${dep_c}/set-learning-variant"
              payload: { learning_curve_variant: "CHRONOLOGICAL" }
              as: PlatformAdmin
          trigger:
            - call: "GET /construction/community-deployments/${dep_f}"
              payload: {}
              as: PlatformAdmin
              captures: { f_factor: $.data.learning_curve_factor }
            - call: "GET /construction/community-deployments/${dep_c}"
              payload: {}
              as: PlatformAdmin
              captures: { c_factor: $.data.learning_curve_factor }
          assert:
            - "CommunityDeployment.${dep_f}.learning_curve_variant == FORWARD_LOOKING"
            - "CommunityDeployment.${dep_c}.learning_curve_variant == CHRONOLOGICAL"
            - "After 3 completed units at 480 minutes and a 4th PRINTING at planned 240 minutes: f_factor == 0.8333 and c_factor == 1.0000"
            - "The two factors differ even though all actual completed print durations are identical"

  # =====================================================================
  # Rule 2 — combinatorial_formula (≥ 2 instances, different modes)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: permit_fee_resubmit_multiplier_nested
        grounds:
          - calculations.permit_fee_calculation
          - entities.PermitApplication.fields.review_round
        distinguishing_aspect: |
          Mode (a): ≥3 inputs with non-linear interaction — fee = (base + area + am_surcharge) * (1 + 0.10 * review_round).
          After two AM resubmits (review_round = 2), with plan_area_m2 = 137 (floor → 137) and routed to AM:
          fee = round_half_up( (250000 + 137*4500 + 175000) * 1.20, 0 ) = round_half_up( (250000 + 616500 + 175000) * 1.20 ) = round_half_up( 1041500 * 1.20 ) = 1249800 cents.
          The tiered-rate selection on review_round and the additive AM surcharge inside the multiplied sum are non-linear.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Jurisdiction J with permits_prescriptive_printed_path = false (forces AM), alternative_means_review_days = 1."
            - "StructuralPlan with plan_area_m2 = 137 and APPROVED revision."
            - "Site under J; permit application submitted, AM_REVIEW."
            - "Advance clock past am_decision_due_at twice, resubmitting between."
          setup_api_calls:
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /construction/jurisdictions"
              payload: { code: "JM", name: "J-M", permits_prescriptive_printed_path: false, alternative_means_review_days: 1, weather_station_id: "WX" }
              as: PlatformAdmin
              captures: { jm_id: $.data.id }
            - call: "POST /construction/structural-plans"
              payload: { title: "Plan M", structural_system: "PRINTED_WALL", wall_thickness_mm: 200, wall_height_mm: 3000, plan_area_m2: 137 }
              as: Engineer
              captures: { plan_id: $.data.id }
            - call: "POST /construction/structural-plans/${plan_id}/revisions"
              payload: { engineering_notes: "r1", required_code_path: "ALTERNATIVE_MEANS" }
              as: Engineer
              captures: { rev_id: $.data.id }
            - call: "POST /construction/structural-plans/${plan_id}/revisions/${rev_id}/action"
              payload: { action: "SUBMIT" }
              as: Engineer
              as_user_id: "eng-alice"
            - call: "POST /construction/structural-plans/${plan_id}/revisions/${rev_id}/action"
              payload: { action: "APPROVE" }
              as: Engineer
              as_user_id: "eng-bob"
            - call: "POST /construction/sites"
              payload: { jurisdiction_id: "${jm_id}", address: "3 C St", soil_class: "A", foundation_kind: "SLAB" }
              as: SiteManager
              captures: { site_id: $.data.id }
            - call: "POST /construction/sites/${site_id}/permit-applications"
              payload: { plan_revision_id: "${rev_id}", requested_path: "ALTERNATIVE_MEANS" }
              as: PermitCoordinator
              captures: { pa_id: $.data.id }
            - call: "POST /construction/sites/${site_id}/permit-applications/${pa_id}/action"
              payload: { action: "SUBMIT" }
              as: PermitCoordinator
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /construction/sites/${site_id}/permit-applications/${pa_id}"
              payload: {}
              as: PermitCoordinator
            - call: "POST /construction/sites/${site_id}/permit-applications/${pa_id}/action"
              payload: { action: "RESUBMIT" }
              as: PermitCoordinator
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /construction/sites/${site_id}/permit-applications/${pa_id}"
              payload: {}
              as: PermitCoordinator
          trigger:
            - call: "POST /construction/sites/${site_id}/permit-applications/${pa_id}/action"
              payload: { action: "RESUBMIT" }
              as: PermitCoordinator
          assert:
            - "PermitApplication.${pa_id}.review_round == 2"
            - "PermitApplication.${pa_id}.status == AM_REVIEW"
            - "PermitApplication.${pa_id}.fee_due_cents == 1249800"

      - name: cure_penalty_nested_ceil_and_conditional
        grounds:
          - calculations.cure_penalty_layers
          - entities.PrintInterruption.fields.cure_penalty_layers
        distinguishing_aspect: |
          Mode (c) circular-looking dependency pinned by the scaffold: cure_penalty_layers depends on
          duration_minutes, duration_minutes depends on resumed_at which depends on the resume action
          that is gated by max_permissible_interruption_minutes which in turn is looked up from the
          MaterialBatch's mix_code active at pause time. With cause = WEATHER and duration = 25 minutes
          on a LAVACRETE_B batch (max 20 min) the resume MUST fail with ERR_INTERRUPTION_CURE_EXCEEDED;
          with cause = OPERATOR and the same 25 minutes the resume succeeds and cure_penalty_layers = 0.
          Boundary: duration == 20 (cause WEATHER, batch B) yields penalty = ceil(20/10) = 2 and resume succeeds.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T08:00:00Z; site prepared with APPROVED permit, QUALIFIED setup, QUALIFIED LAVACRETE_B batch (window 20 min), weather permitting."
            - "PrintJob in PRINTING with total_layers_planned = 30."
          setup_api_calls:
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /construction/jurisdictions"
              payload: { code: "JC", name: "J-C", permits_prescriptive_printed_path: true, alternative_means_review_days: 30, weather_station_id: "WX" }
              as: PlatformAdmin
              captures: { jc_id: $.data.id }
            - call: "POST /construction/structural-plans"
              payload: { title: "Plan C", structural_system: "PRINTED_WALL", wall_thickness_mm: 200, wall_height_mm: 3000, plan_area_m2: 80 }
              as: Engineer
              captures: { plan_id: $.data.id }
            - call: "POST /construction/structural-plans/${plan_id}/revisions"
              payload: { engineering_notes: "r1", required_code_path: "PRESCRIPTIVE" }
              as: Engineer
              captures: { rev_id: $.data.id }
            - call: "POST /construction/structural-plans/${plan_id}/revisions/${rev_id}/action"
              payload: { action: "SUBMIT" }
              as: Engineer
              as_user_id: "eng-alice"
            - call: "POST /construction/structural-plans/${plan_id}/revisions/${rev_id}/action"
              payload: { action: "APPROVE" }
              as: Engineer
              as_user_id: "eng-bob"
            - call: "POST /construction/sites"
              payload: { jurisdiction_id: "${jc_id}", address: "5 D St", soil_class: "A", foundation_kind: "SLAB" }
              as: SiteManager
              captures: { site_id: $.data.id, site_v0: $.data.version }
            - call: "POST /construction/sites/${site_id}/action"
              payload: { action: "POUR_FOUNDATION" }
              as: SiteManager
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /construction/sites/${site_id}/action"
              payload: { action: "CONFIRM_CURE" }
              as: SiteManager
            - call: "GET /construction/sites/${site_id}"
              payload: {}
              as: PrintOperator
              captures: { site_v1: $.data.version }
            - call: "POST /construction/sites/${site_id}/printer-setups"
              payload: { gantry_model: "VULCAN_II", rail_span_mm: 10000, leveling_tolerance_mm: 5.0, measured_level_deviation_mm: 3.0, expected_site_version: "${site_v1}" }
              as: PrintOperator
              captures: { ps_id: $.data.id }
            - call: "POST /construction/sites/${site_id}/printer-setups/${ps_id}/advance"
              payload: { to_state: "LEVELED" }
              as: PrintOperator
            - call: "POST /construction/sites/${site_id}/printer-setups/${ps_id}/advance"
              payload: { to_state: "QUALIFIED" }
              as: PrintOperator
            - call: "POST /construction/sites/${site_id}/material-batches"
              payload: { mix_code: "LAVACRETE_B", water_cement_ratio: 0.45, target_slump_mm: 100, measured_slump_mm: 100, pump_consistency_kg_per_min: 60 }
              as: PrintOperator
              captures: { batch_id: $.data.id }
            - call: "POST /construction/sites/${site_id}/material-batches/${batch_id}/qualify"
              payload: {}
              as: PrintOperator
            - call: "POST /construction/sites/${site_id}/weather-observations"
              payload: { observed_at: "2026-09-04T07:30:00Z", air_temp_c: 22.0, relative_humidity_pct: 50.0, wind_speed_mps: 3.0, precipitation_mm: 0 }
              as: PrintOperator
            - call: "POST /construction/sites/${site_id}/permit-applications"
              payload: { plan_revision_id: "${rev_id}", requested_path: "PRESCRIPTIVE" }
              as: PermitCoordinator
              captures: { pa_id: $.data.id }
            - call: "POST /construction/sites/${site_id}/permit-applications/${pa_id}/action"
              payload: { action: "SUBMIT" }
              as: PermitCoordinator
            - call: "POST /construction/sites/${site_id}/permit-applications/${pa_id}/action"
              payload: { action: "PAY_FEE", amount_cents: 99999999 }
              as: PermitCoordinator
            - call: "POST /construction/sites/${site_id}/permit-applications/${pa_id}/action"
              payload: { action: "DECIDE", decision: "APPROVE" }
              as: JurisdictionReviewer
            - call: "GET /construction/sites/${site_id}"
              payload: {}
              as: PrintOperator
              captures: { site_v2: $.data.version }
            - call: "POST /construction/sites/${site_id}/print-jobs"
              payload: { plan_revision_id: "${rev_id}", printer_setup_id: "${ps_id}", scheduled_start_at: "2026-09-04T08:00:00Z", scheduled_end_at: "2026-09-04T16:00:00Z", total_layers_planned: 30, expected_site_version: "${site_v2}" }
              as: PrintOperator
              captures: { job_id: $.data.id }
            - call: "POST /construction/sites/${site_id}/print-jobs/${job_id}/transition"
              payload: { to_state: "READY_TO_PRINT" }
              as: PrintOperator
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /construction/sites/${site_id}/print-jobs/${job_id}/transition"
              payload: { to_state: "PRINTING" }
              as: PrintOperator
            - call: "POST /construction/sites/${site_id}/print-jobs/${job_id}/transition"
              payload: { to_state: "PAUSED", cause: "WEATHER" }
              as: PrintOperator
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T08:20:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /construction/sites/${site_id}/print-jobs/${job_id}/transition"
              payload: { to_state: "PRINTING" }
              as: PrintOperator
          assert:
            - "PrintJob.${job_id}.status == PRINTING"
            - "PrintInterruption on ${job_id} has duration_minutes == 20 and cure_penalty_layers == 2"
            - "Interruption of duration == MAX_INTERRUPTION_MIN_B == 20 on cause == WEATHER is permissible (inclusive boundary)"

  # =====================================================================
  # Rule 3 — non_linear_state_machine (≥ 2 instances, different entities)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: permit_application_am_resubmit_cycle
        grounds:
          - state_machines.PermitApplication
          - entities.PermitApplication.fields.review_round
        distinguishing_aspect: |
          PermitApplication contains a cycle AM_REVIEW → RESUBMIT_REQUIRED → AM_REVIEW
          (and can loop again). The same entity revisits AM_REVIEW after a system-side
          expiry transition, with review_round incrementing on each loop. This is a
          non-linear (cyclic) machine on PermitApplication.
        test_recipe:
          setup:
            - "Jurisdiction with permits_prescriptive_printed_path = false, alternative_means_review_days = 1."
            - "Approved PlanRevision; permit application submitted into AM_REVIEW at 2026-09-01."
            - "Clock advanced past due date; auto-transition to RESUBMIT_REQUIRED."
          setup_api_calls:
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /construction/jurisdictions"
              payload: { code: "JC2", name: "J-C2", permits_prescriptive_printed_path: false, alternative_means_review_days: 1, weather_station_id: "WX" }
              as: PlatformAdmin
              captures: { jc_id: $.data.id }
            - call: "POST /construction/structural-plans"
              payload: { title: "Plan P", structural_system: "PRINTED_WALL", wall_thickness_mm: 200, wall_height_mm: 3000, plan_area_m2: 80 }
              as: Engineer
              captures: { plan_id: $.data.id }
            - call: "POST /construction/structural-plans/${plan_id}/revisions"
              payload: { engineering_notes: "r1", required_code_path: "ALTERNATIVE_MEANS" }
              as: Engineer
              captures: { rev_id: $.data.id }
            - call: "POST /construction/structural-plans/${plan_id}/revisions/${rev_id}/action"
              payload: { action: "SUBMIT" }
              as: Engineer
              as_user_id: "eng-alice"
            - call: "POST /construction/structural-plans/${plan_id}/revisions/${rev_id}/action"
              payload: { action: "APPROVE" }
              as: Engineer
              as_user_id: "eng-bob"
            - call: "POST /construction/sites"
              payload: { jurisdiction_id: "${jc_id}", address: "9 E St", soil_class: "A", foundation_kind: "SLAB" }
              as: SiteManager
              captures: { site_id: $.data.id }
            - call: "POST /construction/sites/${site_id}/permit-applications"
              payload: { plan_revision_id: "${rev_id}", requested_path: "ALTERNATIVE_MEANS" }
              as: PermitCoordinator
              captures: { pa_id: $.data.id }
            - call: "POST /construction/sites/${site_id}/permit-applications/${pa_id}/action"
              payload: { action: "SUBMIT" }
              as: PermitCoordinator
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /construction/sites/${site_id}/permit-applications/${pa_id}"
              payload: {}
              as: PermitCoordinator
          trigger:
            - call: "POST /construction/sites/${site_id}/permit-applications/${pa_id}/action"
              payload: { action: "RESUBMIT" }
              as: PermitCoordinator
          assert:
            - "PermitApplication.${pa_id}.status transitioned RESUBMIT_REQUIRED → AM_REVIEW"
            - "PermitApplication.${pa_id}.review_round == 1"
            - "am_submitted_at and am_decision_due_at are re-stamped on resubmit"

      - name: layer_inspection_repair_reinspect_cycle
        grounds:
          - state_machines.LayerInspection
          - entities.LayerInspection.fields.supersedes_inspection_id
          - entities.LayerInspection.fields.disposition
        distinguishing_aspect: |
          LayerInspection has a cyclic repair loop: an inspection enters REPAIR_REQUIRED,
          then a NEW LayerInspection created with supersedes_inspection_id pointing back
          transitions the old one's effective chain (PENDING → REPAIR_REQUIRED → superseded
          by a new PENDING inspection). The machine revisits PENDING via a child record —
