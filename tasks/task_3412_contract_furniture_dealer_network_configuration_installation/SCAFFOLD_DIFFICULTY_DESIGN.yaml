            - { call: "POST /configurations/${cfgB_id}/lock", payload: { expected_configuration_version: "${cfgB_v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders", payload: { volume_agreement_id: "${agr_id}", configuration_id: "${cfgB_id}", territory_code: "MI", requested_install_date: "2026-12-15" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { ordB_id: "$.data.id", ordB_v: "$.data.version" } }
            - { call: "POST /project-orders/${ordB_id}/submit", payload: { expected_order_version: "${ordB_v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders/${ordB_id}/acknowledge", as: ManufacturerAdmin }
