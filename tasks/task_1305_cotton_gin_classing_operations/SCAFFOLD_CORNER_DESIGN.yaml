              payload: { grower_id: "${g}", season: "2026", ticket_number: "T-1", module_tag: "MT-CAP", gross_weight_lbs: 11000, tare_weight_lbs: 1000, moisture_pct: 16.0, foreign_matter_pct: 9.0 }
              as: GinOperator
              captures: { m: $.data.id }
          assert:
            - "ModuleReceipt.${m}.est_lint_lbs == 3350 (0.38 - 0.020 capped - 0.025 capped = 0.335; uncapped arithmetic would give 3050)"
            - "est_seed_lbs == 5500 (seed pct 0.55 is not moisture-adjusted); status == RECEIVED (high moisture does not auto-condition)"

