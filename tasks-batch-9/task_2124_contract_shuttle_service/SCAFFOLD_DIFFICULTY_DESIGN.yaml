  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: vehicle_buffered_block_versus_driver_adjacency
        grounds:
          - validations[priority=100]
          - validations[priority=102]
          - errors[ERR_VEHICLE_BLOCK_CONFLICT]
          - calculations.vehicle_committed_block_minutes
        distinguishing_aspect: |
          The Vehicle resource uses buffered half-open intervals, so a zero-minute gap
          between an arrival at 468 and a departure at 468 is a conflict; the very same
          pair of trips on the Driver resource, which carries no layover buffer, is
          accepted because touching endpoints do not intersect.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T05:00:00Z."
            - "One ACTIVE ServiceContract with two PUBLISHED single-trip routes on 2026-09-02: one departing 420 and arriving 468, and one departing 468 and arriving 498."
            - "Two non-ADA vehicles and one driver with a 480-minute cap; the 420 trip is assigned to the first vehicle and that driver."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T05:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Adjacency Hotel", site_type: "HOTEL", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { c17: $.data.id }
            - call: "POST /service-contracts/${c17}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /routes"
              payload: { contract_id: "${c17}", name: "Early Loop", loop_minutes: 48, headway_minutes: 12, service_window_start_min: 420, service_window_end_min: 420, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { rE: $.data.id }
            - call: "POST /routes"
              payload: { contract_id: "${c17}", name: "Touching Loop", loop_minutes: 30, headway_minutes: 30, service_window_start_min: 468, service_window_end_min: 468, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { rF: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-1101", seat_capacity: 20, is_ada_accessible: false, odometer_km: 4000, service_interval_km: 20000 }
              as: FleetManager
              captures: { vP: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-1102", seat_capacity: 20, is_ada_accessible: false, odometer_km: 4200, service_interval_km: 20000 }
              as: FleetManager
              captures: { vQ: $.data.id }
            - call: "POST /drivers"
              payload: { full_name: "Hana Kim", license_class: "CDL_B", ada_certified: false, max_duty_minutes_per_day: 480 }
              as: OpsPlanner
              captures: { dP: $.data.id }
            - call: "POST /routes/${rE}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "POST /routes/${rF}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "GET /trips"
              payload: { route_id: "${rE}", service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { tE: "$.data[0].id" }
            - call: "GET /trips"
              payload: { route_id: "${rF}", service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { tF: "$.data[0].id" }
            - call: "POST /trips/${tE}/assign"
              payload: { vehicle_id: "${vP}", driver_id: "${dP}" }
              as: OpsPlanner
          trigger:
            - call: "POST /trips/${tF}/assign"
              payload: { vehicle_id: "${vP}", driver_id: "${dP}" }
              as: OpsPlanner
              captures: { err_touch: $.data.error_id }
            - call: "POST /trips/${tF}/assign"
              payload: { vehicle_id: "${vQ}", driver_id: "${dP}" }
              as: OpsPlanner
              captures: { tF_vehicle: $.data.vehicle_id }
          assert:
            - "${err_touch} == 'ERR_VEHICLE_BLOCK_CONFLICT'"
            - "the same-vehicle assign responds with HTTP 409"
            - "${tF_vehicle} == '${vQ}'"
            - "GET /trips/${tF} -> Trip.dispatch_status == 'ASSIGNED' and Trip.driver_id == '${dP}'"
            - "GET /vehicles/${vP} -> Vehicle.committed_block_minutes == 60"
            - "GET /vehicles/${vQ} -> Vehicle.committed_block_minutes == 42"
            - "GET /drivers/${dP} -> Driver.assigned_duty_minutes_current_date == 78"

      - name: driver_duty_cap_aggregate_over_service_date
        grounds:
          - validations[priority=104]
          - calculations.driver_assigned_duty_minutes
          - errors[ERR_DRIVER_DUTY_EXCEEDED]
          - entities.Driver.fields.max_duty_minutes_per_day
        distinguishing_aspect: |
          The Driver resource is governed by aggregate capacity over a whole service date
          rather than by pairwise interval geometry: the same two non-overlapping trips
          totalling 78 minutes are refused for a driver capped at 77 and accepted for a
          driver capped at exactly 78.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T05:00:00Z."
            - "One ACTIVE ServiceContract with the same two PUBLISHED single-trip routes on 2026-09-02: 420..468 (48 minutes) and 468..498 (30 minutes)."
            - "Two non-ADA vehicles, one driver capped at 77 minutes and one capped at 78 minutes; the 48-minute trip is assigned to the 77-minute driver."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T05:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Duty Cap Corp", site_type: "CORPORATE", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { c18: $.data.id }
            - call: "POST /service-contracts/${c18}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /routes"
              payload: { contract_id: "${c18}", name: "Duty Early", loop_minutes: 48, headway_minutes: 12, service_window_start_min: 420, service_window_end_min: 420, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { rG: $.data.id }
            - call: "POST /routes"
              payload: { contract_id: "${c18}", name: "Duty Late", loop_minutes: 30, headway_minutes: 30, service_window_start_min: 468, service_window_end_min: 468, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { rH: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-1201", seat_capacity: 20, is_ada_accessible: false, odometer_km: 6000, service_interval_km: 20000 }
              as: FleetManager
              captures: { vR: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-1202", seat_capacity: 20, is_ada_accessible: false, odometer_km: 6200, service_interval_km: 20000 }
              as: FleetManager
              captures: { vS: $.data.id }
            - call: "POST /drivers"
              payload: { full_name: "Cap Seventy Seven", license_class: "CDL_B", ada_certified: false, max_duty_minutes_per_day: 77 }
              as: OpsPlanner
              captures: { d77: $.data.id }
            - call: "POST /drivers"
              payload: { full_name: "Cap Seventy Eight", license_class: "CDL_B", ada_certified: false, max_duty_minutes_per_day: 78 }
              as: OpsPlanner
              captures: { d78: $.data.id }
            - call: "POST /routes/${rG}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "POST /routes/${rH}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "GET /trips"
              payload: { route_id: "${rG}", service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { tG: "$.data[0].id" }
            - call: "GET /trips"
              payload: { route_id: "${rH}", service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { tH: "$.data[0].id" }
            - call: "POST /trips/${tG}/assign"
              payload: { vehicle_id: "${vR}", driver_id: "${d77}" }
              as: OpsPlanner
          trigger:
            - call: "POST /trips/${tH}/assign"
              payload: { vehicle_id: "${vS}", driver_id: "${d77}" }
              as: OpsPlanner
              captures: { err_duty: $.data.error_id }
            - call: "POST /trips/${tG}/unassign"
              payload: {}
              as: OpsPlanner
            - call: "POST /trips/${tG}/assign"
              payload: { vehicle_id: "${vR}", driver_id: "${d78}" }
              as: OpsPlanner
            - call: "POST /trips/${tH}/assign"
              payload: { vehicle_id: "${vS}", driver_id: "${d78}" }
              as: OpsPlanner
              captures: { tH_driver: $.data.driver_id }
          assert:
            - "${err_duty} == 'ERR_DRIVER_DUTY_EXCEEDED'"
            - "the 77-minute driver's second assign responds with HTTP 422"
            - "${tH_driver} == '${d78}'"
            - "GET /drivers/${d78} -> Driver.assigned_duty_minutes_current_date == 78"
            - "GET /drivers/${d77} -> Driver.assigned_duty_minutes_current_date == 0"
            - "GET /trips/${tH} -> Trip.dispatch_status == 'ASSIGNED'"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: credit_memo_void_restores_contract_balance
        grounds:
          - calculations.contract_credit_balance
          - state_machines.Trip.UNBILLED_to_CREDITED
          - state_machines.Trip.CREDITED_to_UNBILLED
          - entities.ServiceContract.fields.credit_balance_cents
          - entities.CreditMemo.fields.status
        distinguishing_aspect: |
          The conserved quantity is money in cents: after mark-missed issues a 4500-cent
          memo and void reverses it, ServiceContract.credit_balance_cents equals its
          pre-issue value of 0 and continues to satisfy
          credit_balance_cents == SUM(CreditMemo.amount_cents WHERE status == ISSUED),
          with the trip's settlement_status back at UNBILLED and no drift left behind.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T06:00:00Z."
            - "One ACTIVE ServiceContract with penalty_rate_cents_per_missed_trip 4500 and credit_balance_cents 0."
            - "One PUBLISHED single-trip Route on 2026-09-02 whose trip has been marked MISSED with reason OPERATOR_FAULT, minting one ISSUED 4500-cent memo."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Ledger Hotel", site_type: "HOTEL", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { c19: $.data.id }
            - call: "POST /service-contracts/${c19}/activate"
              payload: {}
              as: ContractAdmin
            - call: "GET /service-contracts/${c19}"
              payload: {}
              as: ContractAdmin
              captures: { bal_pre: $.data.credit_balance_cents }
            - call: "POST /routes"
              payload: { contract_id: "${c19}", name: "Ledger Loop", loop_minutes: 48, headway_minutes: 12, service_window_start_min: 420, service_window_end_min: 420, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { r19: $.data.id }
            - call: "POST /routes/${r19}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "GET /trips"
              payload: { route_id: "${r19}", service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { k1: "$.data[0].id" }
            - call: "POST /trips/${k1}/mark-missed"
              payload: { reason: "OPERATOR_FAULT" }
              as: OpsPlanner
            - call: "GET /credit-memos"
              payload: { trip_id: "${k1}" }
              as: ContractAdmin
              captures: { m19: "$.data[0].id" }
            - call: "GET /service-contracts/${c19}"
              payload: {}
              as: ContractAdmin
              captures: { bal_mid: $.data.credit_balance_cents }
          trigger:
            - call: "POST /credit-memos/${m19}/void"
              payload: { voided_reason: "trip was operated after all" }
              as: ContractAdmin
            - call: "GET /service-contracts/${c19}"
              payload: {}
              as: ContractAdmin
              captures: { bal_post: $.data.credit_balance_cents }
          assert:
            - "${bal_pre} == 0"
            - "${bal_mid} == 4500"
            - "${bal_post} == 0"
            - "${bal_post} == ${bal_pre}"
            - "GET /credit-memos/${m19} -> CreditMemo.status == 'VOIDED' and CreditMemo.amount_cents == 4500"
            - "GET /trips/${k1} -> Trip.settlement_status == 'UNBILLED' and Trip.dispatch_status == 'MISSED'"
            - "invariant holds: ServiceContract.${c19}.credit_balance_cents == SUM of CreditMemo.amount_cents over memos of ${c19} with status ISSUED, which is 0"

      - name: trip_unassign_restores_vehicle_block_minutes
        grounds:
          - calculations.vehicle_committed_block_minutes
          - calculations.driver_assigned_duty_minutes
          - state_machines.Trip.SCHEDULED_to_ASSIGNED
          - state_machines.Trip.ASSIGNED_to_SCHEDULED
          - entities.Vehicle.fields.committed_block_minutes
        distinguishing_aspect: |
          A different conserved quantity, vehicle time in minutes rather than money:
          assign drives Vehicle.committed_block_minutes from 0 to 60 (48 loop minutes plus
          the 12-minute layover buffer) and unassign returns it to exactly 0, keeping
          committed_block_minutes == SUM(duration + 12) over ASSIGNED, IN_SERVICE and
          COMPLETED trips at every step.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T05:00:00Z."
            - "One ACTIVE ServiceContract with one PUBLISHED single-trip Route on 2026-09-02 departing 420 and arriving 468."
            - "One non-ADA vehicle at committed_block_minutes 0 and one driver at assigned_duty_minutes_current_date 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T05:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Block Minutes Campus", site_type: "CAMPUS", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { c20: $.data.id }
            - call: "POST /service-contracts/${c20}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /routes"
              payload: { contract_id: "${c20}", name: "Block Loop", loop_minutes: 48, headway_minutes: 12, service_window_start_min: 420, service_window_end_min: 420, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { r20: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-1301", seat_capacity: 20, is_ada_accessible: false, odometer_km: 9000, service_interval_km: 20000 }
              as: FleetManager
              captures: { v20: $.data.id }
            - call: "POST /drivers"
              payload: { full_name: "Yusuf Demir", license_class: "CDL_B", ada_certified: false, max_duty_minutes_per_day: 480 }
              as: OpsPlanner
              captures: { d20: $.data.id }
            - call: "POST /routes/${r20}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "GET /trips"
              payload: { route_id: "${r20}", service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { k2: "$.data[0].id" }
            - call: "GET /vehicles/${v20}"
              payload: {}
              as: FleetManager
              captures: { blk_pre: $.data.committed_block_minutes }
          trigger:
            - call: "POST /trips/${k2}/assign"
              payload: { vehicle_id: "${v20}", driver_id: "${d20}" }
              as: OpsPlanner
            - call: "GET /vehicles/${v20}"
              payload: {}
              as: FleetManager
              captures: { blk_mid: $.data.committed_block_minutes }
            - call: "POST /trips/${k2}/unassign"
              payload: {}
              as: OpsPlanner
            - call: "GET /vehicles/${v20}"
              payload: {}
              as: FleetManager
              captures: { blk_post: $.data.committed_block_minutes }
          assert:
            - "${blk_pre} == 0"
            - "${blk_mid} == 60"
            - "${blk_post} == 0"
            - "${blk_post} == ${blk_pre}"
            - "GET /trips/${k2} -> Trip.dispatch_status == 'SCHEDULED' and Trip.vehicle_id == null and Trip.driver_id == null"
            - "GET /drivers/${d20} -> Driver.assigned_duty_minutes_current_date == 0"
            - "invariant holds: Vehicle.${v20}.committed_block_minutes == SUM over its ASSIGNED, IN_SERVICE and COMPLETED trips of (scheduled_arrival_min - scheduled_departure_min + 12), which is 0"
