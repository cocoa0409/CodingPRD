          assert:
            - "second_confirm_error == 'ERR_INVALID_STATE'  (ShiftAssignment.status is already CONFIRMED, not PENDING; even though the credential is now also expired, the state check at priority 6 fires before the business_safety check at priority 7)"

      - name: allocation_reserve_role_mismatch_beats_insufficient_inventory
        grounds:
          - validations[priority=13]
          - validations[priority=14]
        distinguishing_aspect: |
          Error-category pair (business_referential, business_constraint): a
          LogisticsCoordinator attempting to reserve a MUTUAL_AID-source
          AllocationRequest against a partner lot with insufficient stock must
          fail with ERR_SOURCE_ROLE_MISMATCH (priority 13), not
          ERR_INSUFFICIENT_INVENTORY (priority 14) — role/source_type match is
          checked before the inventory-sufficiency check.
        test_recipe:
          setup:
            - "Two PODs (requesting + partner) under the same activated plan"
            - "Partner POD-scoped InventoryLot on_hand_quantity=10 for the countermeasure"
            - "AllocationRequest source_type=MUTUAL_AID, partner_pod_id=partner POD, requested_quantity=1000 (exceeds the 10 available)"
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Priority Pair B Plan", jurisdiction_code: "CTY10", target_population: 7000 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Requesting POD", site_type: FIXED_POD, address: "8 Request Rd", staffing_capacity_lanes: 3, lane_throughput_rate_per_hour: 15 }
              as: PublicHealthAdmin
              captures: { req_pod_id: $.data.id }
            - call: "POST /pods/${req_pod_id}/open"
              payload: {}
              as: PublicHealthAdmin
              captures: { req_pod_v: $.data.version }
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Partner POD", site_type: FIXED_POD, address: "10 Partner Rd", staffing_capacity_lanes: 3, lane_throughput_rate_per_hour: 15 }
              as: PublicHealthAdmin
              captures: { partner_pod_id: $.data.id }
            - call: "POST /pods/${partner_pod_id}/open"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /countermeasures"
              payload: { name: "Mutual Aid Vaccine", countermeasure_type: VACCINE, doses_required: 1, unit_cost_cents: 700, reorder_point_quantity: 5 }
              as: PublicHealthAdmin
              captures: { cm_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { countermeasure_id: "${cm_id}", pod_id: "${partner_pod_id}", lot_number: "LOT-F1", on_hand_quantity: 10, expiration_date: "2027-01-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /allocation-requests"
              payload: { pod_id: "${req_pod_id}", countermeasure_id: "${cm_id}", source_type: MUTUAL_AID, partner_pod_id: "${partner_pod_id}", requested_quantity: 1000, expected_pod_version: "${req_pod_v}" }
              as: LogisticsCoordinator
              captures: { ar_id: $.data.id }
          trigger:
            - call: "POST /allocation-requests/${ar_id}/reserve"
              payload: { expected_inventory_lot_version: "${lot_v}" }
              as: LogisticsCoordinator
              captures: { reserve_error: $.data.error_id }
          assert:
            - "reserve_error == 'ERR_SOURCE_ROLE_MISMATCH'  (LogisticsCoordinator may not reserve a MUTUAL_AID request — only MutualAidPartner may — and this referential check at priority 13 fires before the priority-14 insufficient-inventory check, even though 1000 > 10 is also true)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (>=2, different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: credential_expires_at_exact_equal_to_clock_rejected
        grounds:
          - validations[priority=7]
          - errors[ERR_CREDENTIAL_EXPIRED]
        distinguishing_aspect: |
          Datetime-metric boundary on POST /shift-assignments/{id}/confirm: the
          rule requires credential_expires_at strictly greater than current clock
          time. When expires_at exactly equals the clock, confirm is rejected;
          one second later than the clock, confirm succeeds.
        test_recipe:
          setup:
            - "clock set to 2026-03-02T10:00:00Z"
            - "StaffMember A: credential_expires_at == 2026-03-02T10:00:00Z (exact boundary, not strictly after)"
            - "StaffMember B: credential_expires_at == 2026-03-02T10:00:01Z (one second after the clock)"
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Boundary A Plan", jurisdiction_code: "CTY11", target_population: 6000 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Boundary A POD", site_type: FIXED_POD, address: "11 Boundary Way", staffing_capacity_lanes: 3, lane_throughput_rate_per_hour: 15 }
              as: PublicHealthAdmin
              captures: { pod_id: $.data.id }
            - call: "POST /pods/${pod_id}/open"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T10:00:00Z" }
              as: PublicHealthAdmin
            - call: "POST /staff-members"
              payload: { full_name: "Exact Boundary Staff", email: "exactboundary@example.org", primary_role: VACCINATOR, mrc_unit: "UnitH", credential_type: EMT_CERT, credential_expires_at: "2026-03-02T10:00:00Z" }
              as: PublicHealthAdmin
              captures: { staff_a_id: $.data.id }
            - call: "POST /staff-members/${staff_a_id}/verify-credential"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /shift-assignments"
              payload: { pod_id: "${pod_id}", staff_member_id: "${staff_a_id}", assigned_role: VACCINATOR, start_time: "2026-03-05T08:00:00Z", end_time: "2026-03-05T16:00:00Z" }
              as: PublicHealthAdmin
              captures: { sa_a_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "One Second Later Staff", email: "onesecondlater@example.org", primary_role: SCREENER, mrc_unit: "UnitH", credential_type: EMT_CERT, credential_expires_at: "2026-03-02T10:00:01Z" }
              as: PublicHealthAdmin
              captures: { staff_b_id: $.data.id }
            - call: "POST /staff-members/${staff_b_id}/verify-credential"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /shift-assignments"
              payload: { pod_id: "${pod_id}", staff_member_id: "${staff_b_id}", assigned_role: SCREENER, start_time: "2026-03-05T08:00:00Z", end_time: "2026-03-05T16:00:00Z" }
              as: PublicHealthAdmin
              captures: { sa_b_id: $.data.id }
          trigger:
            - call: "POST /shift-assignments/${sa_a_id}/confirm"
              payload: {}
              as: ClinicalLead
              captures: { confirm_a_error: $.data.error_id }
            - call: "POST /shift-assignments/${sa_b_id}/confirm"
              payload: {}
              as: ClinicalLead
              captures: { confirm_b_status: $.data.status }
          assert:
            - "confirm_a_error == 'ERR_CREDENTIAL_EXPIRED'  (credential_expires_at 2026-03-02T10:00:00Z is NOT strictly after clock 2026-03-02T10:00:00Z)"
            - "confirm_b_status == 'CONFIRMED'  (credential_expires_at 2026-03-02T10:00:01Z IS strictly after the clock, by exactly one second)"

      - name: allocation_reserve_exact_zero_available_rejected
        grounds:
          - validations[priority=14]
          - errors[ERR_INSUFFICIENT_INVENTORY]
        distinguishing_aspect: |
          Integer-quantity boundary on POST /allocation-requests/{id}/reserve,
          a different metric and endpoint than the datetime boundary above: a
          source InventoryLot with available_quantity reduced to exactly 0
          rejects a subsequent 1-dose reserve; a reserve for the full remaining
          quantity (not zero) succeeds.
        test_recipe:
          setup:
            - "Central SNS-cache InventoryLot on_hand_quantity=100"
            - "AllocationRequest 1 requests and reserves exactly 100 (the full lot), driving available_quantity to exactly 0"
            - "AllocationRequest 2 requests 1 more against the now-zero-available lot"
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Boundary B Plan", jurisdiction_code: "CTY12", target_population: 5000 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
