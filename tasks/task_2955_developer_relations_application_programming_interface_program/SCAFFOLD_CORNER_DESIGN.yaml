          assert:
            - "the version: lifecycle_state == PREVIEW, sunset_at == null, migration_guide_url == null, deprecation_announced_at == null"
            - "the lease: state == ACTIVE, expires_at == 2026-08-04T00:00:00.000Z, released_at == null, closed_reason == null"
            - "the case: state == OPENED, penalty_points == 20 (RATE_ABUSE 10 x MEDIUM 2), points_applied == 0, appeal_deadline == null, investigator_user_id == null, opened_by_user_id == tso-1"
            - "the support case: state == OPEN, escalation_tier == 0, first_response_due_minutes == 120, communication_count == 0, first_response_breached == false"
            - "the feedback item: state == SUBMITTED, raw_impact == null, priority_score == null, author_top_tier == null"
            - "ApiProduct.${p1_id}.demand_index == 0.00 (an untriaged item contributes nothing)"

      - name: promote_preview_version_to_general_availability
        claim_type: Valid Transition
        grounds:
          - state_machines.ApiVersion PREVIEW -> GENERAL_AVAILABILITY
          - endpoints.POST /api-versions/{id}/promote
        distinguishing_aspect: >-
          The promotion is the only transition out of PREVIEW and it changes lifecycle_state
          without touching the deprecation fields; the OCC version of the version row
          increments while the parent product's version does not, because promotion allocates
          nothing from the pools.
        test_recipe:
          setup:
            - "one PREVIEW version 1.0.0 exists under a product whose version is 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
