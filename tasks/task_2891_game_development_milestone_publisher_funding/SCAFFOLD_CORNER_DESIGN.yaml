  - section: rbac
    instances:
      - name: corner_actor_resolution_ladder_from_missing_headers_to_function_mismatch
        claim_type: actor_resolution
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=3]
          - validations[priority=4]
          - validations[priority=5]
          - errors.ERR_MISSING_AUTH_HEADERS
          - errors.ERR_UNKNOWN_ROLE
          - errors.ERR_ACTOR_NOT_FOUND
          - errors.ERR_ROLE_NOT_PERMITTED
          - errors.ERR_ROLE_FUNCTION_MISMATCH
        distinguishing_aspect: "The five-step preamble must be walked in exactly the declared order and each step must return its own code: no headers -> 401 ERR_MISSING_AUTH_HEADERS, an unknown role name -> 401 ERR_UNKNOWN_ROLE, a well-formed role with an X-User-ID that resolves to nothing -> 401 ERR_ACTOR_NOT_FOUND, a known actor on an endpoint its role does not own -> 403 ERR_ROLE_NOT_PERMITTED, and only then the publisher-specific check that a FINANCE-only PublisherUser cannot act as PublisherReviewer -> 403 ERR_ROLE_FUNCTION_MISMATCH. Rule 5 is the subtle one: the role IS permitted on the endpoint, so only the acting user's function makes it fail."
        test_recipe:
          setup:
            - "Agreement Aurora Solo is ACTIVE (advance 3600000) with one ALPHA milestone funded 3600000; build 1 has passed the gate so the milestone is UNDER_REVIEW and a review is legally possible."
            - "Rae has function REVIEW and Fen has function FINANCE at the same publisher."
          setup_api_calls:
            - call: "POST /studios"
              payload: { legal_name: "Northlight Studio", contact_email: "dev@northlight.example", country_code: "SE" }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /publishers"
              payload: { legal_name: "Vantage Publishing", contact_email: "ops@vantage.example", country_code: "US" }
              as: PlatformAdmin
