  - rule_id: transitive_cascade
    instances:
      - name: job_close_refractory_threshold_cascades_winddown_and_cancels_scheduled_job
        grounds:
          - state_machines.ProductionJob.RUNNING_to_COMPLETED
          - calculations.refractory_wear
          - calculations.furnace_posture_derivation
          - state_machines.Campaign.ACTIVE_to_WIND_DOWN
          - state_machines.ProductionJob.SCHEDULED_to_CANCELLED
          - entities.Furnace.fields.reserved_pull_tons
        distinguishing_aspect: |
          One job close propagates four hops with no further client calls: wear is charged to the
          furnace (hop 1) which drops refractory_remaining_pct to 3.23 and flips posture to
          REBUILD_DUE (hop 2), which auto-winds the campaign down (hop 3), which cancels the other
          SCHEDULED job and releases its 300.00 reserved tons so Furnace.reserved_pull_tons ends at
          0.00 (hop 4). Stopping after hop 2 leaves the campaign ACTIVE and reserved_pull_tons 300.00.
        test_recipe:
          setup:
            - "Furnace F-08: design_pull_tpd 300.00, refractory_life_total_units 620.00 (deliberately short)"
            - "Campaign CMP-08 ACTIVE, target_pull_tpd 300.00, window 2026-08-01 to 2026-08-11 (pool 3000.00 t)"
            - "Approved FLINT recipe BR-F08 with cullet_ratio_pct 40.00 (cullet_stress_factor 0.0000)"
            - "ProductionJob PJ-08A RUNNING, window 2026-08-01T00:00:00Z..2026-08-03T00:00:00Z, planned_pull_tpd 300.00 (reserved 600.00 t, wear 600.00 units)"
            - "ProductionJob PJ-08B SCHEDULED on the same machine, window 2026-08-05T00:00:00Z..2026-08-06T00:00:00Z, planned_pull_tpd 300.00 (reserved 300.00 t)"
