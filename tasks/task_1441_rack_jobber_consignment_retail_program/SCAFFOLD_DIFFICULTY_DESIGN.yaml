            - "margin_pct == 0.26 — tier1 selected on NET 199990 (100000 <= n < 200000); keying the tier on GROSS 200000 would wrongly give 0.27"
            - "retailer_margin_cents == 51997 (round_half_up(199990 * 0.26)); net_payable_to_jobber_cents == 147993"

  - rule_id: non_linear_state_machine
    instances:
      - name: settlement_finalize_dispute_revise_cycle
        grounds: [state_machines.SettlementStatement, calculations.settlement_net_payable]
        distinguishing_aspect: |
          Cyclic machine on SettlementStatement (FINALIZED -> DISPUTED -> PROVISIONAL
          -> FINALIZED), a different entity than the ServiceVisit cycle: version walks
          1->5 across the loop while the recomputed payable stays 1500.
        test_recipe:
          setup:
            - "ACTIVE agreement (est shrink 0); directive 200; SALE 10 units at 2026-08-01T10:00:00Z -> gross 2000"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
