  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: taxpayer_cannot_adjudicate_claims
        claim_type: role_exclusive_denial
        grounds:
          - "roles.ClaimsAdjuster.exclusive_operations"
          - "errors[ERR_INSUFFICIENT_PERMISSIONS]"
        distinguishing_aspect: "ClaimsAdjuster-exclusive endpoints reject the Taxpayer role with 403 even for a claim on the taxpayer's own return."
        test_recipe:
          setup: ["Catalog seeded; account A with ACCEPTED return; claim C FILED"]
          setup_api_calls:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040", "W2_WH"], tier_rank: 0 }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F1040", minimum_tier: "FREE", disqualifies_free_file: false }
              as: PlatformOperator
            - call: "POST /tax/accounts"
              payload: { email: "rbac1@x.com", full_name: "Rbac One", filing_status: "SINGLE", agi_cents: 1000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id, ret_v: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "F1040", amount_cents: 0, expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v2: $.data.version }
            - call: "POST /tax/returns/${ret_id}/submit-review"
              payload: { expected_return_version: "${ret_v2}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v3: $.data.version }
            - call: "POST /tax/returns/${ret_id}/file"
              payload: { transmission_payload_hash: "hash-1", expected_return_version: "${ret_v3}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { fa1: $.data.id }
            - call: "POST /tax/_authority/filing-callback"
              payload: { filing_attempt_id: "${fa1}", outcome: "ACCEPTED" }
              as: PlatformOperator
            - call: "POST /tax/returns/${ret_id}/claims"
              payload: { claimed_error_amount_cents: 5000 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /tax/claims/${claim_id}/adjudicate"
              payload: { reviewed_error_amount_cents: 5000 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { err1: $.data.error_id }
          assert:
            - "${err1} == ERR_INSUFFICIENT_PERMISSIONS"
            - "AccuracyClaim.${claim_id}.status == FILED"

      - name: claims_adjuster_cannot_seed_catalog_or_file_returns
        claim_type: role_exclusive_denial
        grounds:
          - "roles.PlatformOperator.exclusive_operations"
          - "roles.Taxpayer.exclusive_operations"
          - "errors[ERR_INSUFFICIENT_PERMISSIONS]"
        distinguishing_aspect: "PlatformOperator-exclusive seed endpoints and Taxpayer-exclusive filing endpoints both reject ClaimsAdjuster with 403."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040"], tier_rank: 0 }
              as: ClaimsAdjuster
              captures: { err1: $.data.error_id }
          assert:
            - "${err1} == ERR_INSUFFICIENT_PERMISSIONS"

      - name: missing_user_context_header_rejected
        claim_type: role_exclusive_denial
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "Requests without X-User-Role fail with 400 before any other validation."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /tax/accounts"
              payload: { email: "rbac2@x.com", full_name: "Rbac Two", filing_status: "SINGLE", agi_cents: 1000000, resident_state_code: "CA" }
              as: Taxpayer
          assert:
            - "request without headers is rejected with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) — asserted by the harness omitting the auth headers"

  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: accepted_filing_settles_active_refund_transfer
        claim_type: cascading_side_effect
        grounds: [state_machines.RefundTransferAgreement.ACTIVE_to_SETTLED, state_machines.FilingAttempt.PENDING_to_ACCEPTED]
        distinguishing_aspect: "Authority acceptance settles the ACTIVE refund-transfer agreement in the same cascade that flips the return to ACCEPTED; a VOIDED agreement is untouched."
        test_recipe:
          setup: ["Catalog seeded; account A; return R with F1040 + W2_WH(9000c); RT agreement ACTIVE; return SUBMITTED with PENDING FilingAttempt"]
          setup_api_calls:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040", "W2_WH"], tier_rank: 0 }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F1040", minimum_tier: "FREE", disqualifies_free_file: false }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "W2_WH", minimum_tier: "FREE", disqualifies_free_file: false, counts_toward_refund: true }
              as: PlatformOperator
            - call: "POST /tax/accounts"
              payload: { email: "cc1@x.com", full_name: "Cc One", filing_status: "SINGLE", agi_cents: 1000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id, ret_v: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "F1040", amount_cents: 0, expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v2: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "W2_WH", amount_cents: 9000, expected_return_version: "${ret_v2}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v3: $.data.version }
            - call: "POST /tax/returns/${ret_id}/refund-transfer"
              payload: { bank_partner_code: "BANK_B", expected_return_version: "${ret_v3}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { rta_id: $.data.id, ret_v4: $.data.version }
            - call: "POST /tax/returns/${ret_id}/refund-transfer/accept-disclosure"
              payload: { expected_return_version: "${ret_v4}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v5: $.data.version }
            - call: "POST /tax/returns/${ret_id}/submit-review"
              payload: { expected_return_version: "${ret_v5}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v6: $.data.version }
            - call: "POST /tax/returns/${ret_id}/file"
              payload: { transmission_payload_hash: "hash-rt", expected_return_version: "${ret_v6}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { fa1: $.data.id }
          trigger:
            - call: "POST /tax/_authority/filing-callback"
              payload: { filing_attempt_id: "${fa1}", outcome: "ACCEPTED" }
              as: PlatformOperator
          assert:
            - "TaxReturn.${ret_id}.status == ACCEPTED"
            - "RefundTransferAgreement.${rta_id}.status == SETTLED"
            - "FilingAttempt.${fa1}.outcome == ACCEPTED"
            - "TaxpayerAccount.${acct_id}.disclosure_accepted_version == 'RTD-2026-1'"

      - name: version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[return-form-add-stale-return]"
          - "entities.TaxpayerAccount.fields"
        distinguishing_aspect: "Each successful mutation advances TaxReturn.version by exactly 1: create=1, form add=2, second form add=3, state-return add=4."
        test_recipe:
          setup: ["Catalog seeded; account A; return R created"]
          setup_api_calls:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040", "W2_WH"], tier_rank: 0 }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F1040", minimum_tier: "FREE", disqualifies_free_file: false }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "W2_WH", minimum_tier: "FREE", disqualifies_free_file: false, counts_toward_refund: true }
              as: PlatformOperator
            - call: "POST /tax/accounts"
              payload: { email: "cc2@x.com", full_name: "Cc Two", filing_status: "SINGLE", agi_cents: 1000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "F1040", amount_cents: 0, expected_return_version: "${v1}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { v2: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "W2_WH", amount_cents: 100, expected_return_version: "${v2}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { v3: $.data.version }
            - call: "POST /tax/returns/${ret_id}/state-returns"
              payload: { state_code: "CA", expected_return_version: "${v3}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { v4: $.data.version }
          assert:
            - "${v1} == 1"
            - "${v2} == 2"
            - "${v3} == 3"
            - "${v4} == 4"

      - name: derived_fields_reconcile_after_import_and_removal
        claim_type: derived_field_reconciliation
        grounds: [calculations.minimum_tier_classification, calculations.free_file_eligibility]
        distinguishing_aspect: "minimum_required_tier and free_file_eligible track the ACTIVE form set through import (adds SCH_D via CAPITAL_LOSS) then explicit removal: PREMIER/false -> FREE/true."
        test_recipe:
          setup: ["Catalog seeded; account A; return R(2025) with ACTIVE F1040; snapshot S(2024) with one CAPITAL_LOSS item imported"]
          setup_api_calls:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040", "W2_WH"], tier_rank: 0 }
              as: PlatformOperator
            - call: "POST /tax/_tiers/seed"
              payload: { code: "PREMIER", price_cents: 12999, state_addon_price_cents: 4999, supported_forms: ["SCH_D", "F8949", "F4562"], tier_rank: 2 }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F1040", minimum_tier: "FREE", disqualifies_free_file: false }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "SCH_D", minimum_tier: "PREMIER", disqualifies_free_file: true }
              as: PlatformOperator
            - call: "POST /tax/accounts"
              payload: { email: "cc3@x.com", full_name: "Cc Three", filing_status: "SINGLE", agi_cents: 1000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id, ret_v: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "F1040", amount_cents: 0, expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v2: $.data.version }
            - call: "POST /tax/accounts/${acct_id}/prior-year-snapshots"
              payload:
                tax_year: 2024
                carryforward_items:
                  - item_type: "CAPITAL_LOSS"
                    asset_tag: "lot-9"
                    remaining_amount_cents: 75000
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { snap_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/prior-year-snapshots/${snap_id}/import"
              payload: { return_id: "${ret_id}", expected_return_version: "${ret_v2}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v3: $.data.version }
            - call: "GET /tax/returns/${ret_id}/forms"
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures:
                imported_form: "$.data[1].id"
          trigger:
            - call: "POST /tax/returns/${ret_id}/forms/${imported_form}/remove"
              payload: { expected_return_version: "${ret_v3}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
          assert:
            - "ReturnForm.${imported_form}.source == IMPORTED"
            - "ReturnForm.${imported_form}.form_code == SCH_D (CAPITAL_LOSS mapping)"
            - "ReturnForm.${imported_form}.amount_cents == 75000"
            - "after removal: TaxReturn.${ret_id}.minimum_required_tier == FREE"
            - "after removal: TaxReturn.${ret_id}.free_file_eligible == true"
            - "TaxReturn.${ret_id}.upgrade_prompt_pending == false"

