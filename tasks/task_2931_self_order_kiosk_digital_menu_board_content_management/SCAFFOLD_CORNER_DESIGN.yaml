              as: PlatformAdmin
              captures: { zone_a_id: $.data.id }
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_WEST", tier: "REGION" }
              as: ContentManager
              captures: { cl_id: $.data.id }
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "${cl_id}", price_zone_id: "${zone_a_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /kiosk-ops/devices"
              payload: { store_id: "${store_id}", device_kind: "MENU_BOARD", device_code: "B001", offline_cache_capacity: 1 }
              as: PlatformAdmin
              captures: { board_id: $.data.id, board_pay: $.data.payment_compliance_state }
            - call: "POST /kiosk-ops/devices"
              payload: { store_id: "${store_id}", device_kind: "KIOSK", device_code: "K002", offline_cache_capacity: 2, pin_pad_firmware_version: "1.4.2" }
              as: PlatformAdmin
              captures: { kiosk_id: $.data.id }
          trigger:
            - call: "POST /kiosk-ops/devices/${board_id}/heartbeat"
              payload: { printer_ok: false, touch_ok: false, screen_reader_ok: true, network_ok: true }
              as: DeviceAgent
              as_user_id: "${board_id}"
              captures: { board_roll: $.data.rolling_health_score, board_state: $.data.health_state }
            - call: "POST /kiosk-ops/devices/${kiosk_id}/heartbeat"
              payload: { printer_ok: false, touch_ok: false, screen_reader_ok: true, network_ok: true }
              as: DeviceAgent
              as_user_id: "${kiosk_id}"
              captures: { kiosk_roll: $.data.rolling_health_score, kiosk_state: $.data.health_state }
          assert:
            - "${board_pay} == NOT_APPLICABLE at registration — a MENU_BOARD has no payment device"
            - "${board_roll} == 100 (20 + 30 awarded unconditionally + 25 + 25) and ${board_state} == ONLINE"
            - "${kiosk_roll} == 50 (0 + 0 + 25 + 25) and ${kiosk_state} == DEGRADED — 50 satisfies HEALTH_DEGRADED_MIN but not HEALTH_ONLINE_MIN"
            - "worst_case_health_score is 70 for the board and 20 for the kiosk: with missed == 0 the projected charge is (0 + PROJECTED_MISSES 2) x MISS_PENALTY_POINTS 15 = 30 off each base"
            - "neither device is QUARANTINED even though the kiosk's worst case (20) is below 50, because missed 0 < QUARANTINE_MISS_FLOOR 3"

