  - rule_id: resource_temporal_overlap
    instances:
      - name: loi_exclusivity_half_open_adjacency
        grounds:
          - validations[priority=7]
          - errors[ERR_LOI_EXCLUSIVITY_OVERLAP]
          - entities.LOI.fields.exclusivity_start_date
          - entities.LOI.fields.exclusivity_end_date
        distinguishing_aspect: |
          Half-open [start, end) interval semantics on the Site resource: a new
          LOI whose start equals the active LOI's end (adjacent, 2026-10-01)
          is ACCEPTED because the intersection is empty, while a window
          starting one day earlier (2026-09-30) is rejected — adjacency is
          allowed precisely because intervals are half-open.
