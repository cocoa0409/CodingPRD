      - name: species_season_is_a_closed_interval_at_its_end_instant
        grounds:
          - validations[priority=33]
          - errors[ERR_SPECIES_OUT_OF_SEASON]
          - entities.QuotaLedger.fields.species_close_date
          - state_machines.Trip.PLANNED_to_LANDED
        distinguishing_aspect: |
          A different resource entity, QuotaLedger, and different interval semantics: the
          species window is a continuous CLOSED interval on the logical clock, so an occupation
          landing at exactly species_close_date 2026-06-01T00:00:00Z is admitted, while one
          second later collides with the closed end and is refused. This is instant-level
          endpoint inclusivity, not the discrete capacity counting of the cooler-slot rule.
        test_recipe:
          setup:
            - "an OPEN season with one share plan"
            - "a COMPLIANT vessel with a 500.00 lb SALMON entitlement whose species window ends 2026-06-01T00:00:00Z"
            - "two planned trips against that entitlement"
          setup_api_calls:
            - call: "POST /csf/seasons"
              payload: { season_code: "CSF-2026", start_date: "2026-05-04T00:00:00Z", end_date: "2026-09-21T00:00:00Z", total_weeks: 20, ambient_band: "HOT", offered_species: ["SALMON"], landing_commit_lead_hours: 72 }
