# =============================================================================
# ETC Toll Road (E-ZPass style) — benchmark seed tables (Expert)
# =============================================================================

scenario: |
  ETC Toll Road (E-ZPass style): transponder binding, license plate recognition
  supplement, cross-state interoperability, violations and fines, low-balance
  auto-reload, Carpool HOV exemption, Toll-by-Plate

domain_name: etc-toll-road
api_prefix: /etc

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by foreign keys; no nested-ownership URL paths. An
  # Account, Vehicle, Transponder, Plaza, TollTransaction, Violation, etc. are
  # all top-level collections under /etc/<collection> referencing each other
  # by FK fields carried in request bodies.

  state_machine_shape: parallel
  # TollTransaction carries two independent state dimensions (pricing_status ×
  # settlement_status). Violation is cyclic (ISSUED -> CONTESTED -> ISSUED).

  relationship_patterns:
    - one_to_many        # Account -> Transponder, Account -> Vehicle, Plaza -> TollTransaction
    - cross_aggregate    # TollTransaction references Account, Vehicle, Plaza, Transponder

  role_model: peer_roles
  # AccountHolder owns their own account/vehicles/transponders; TollOperator runs
  # plazas, pricing, and the violation pipeline; InteropClerk posts cross-state
  # interop transactions; SystemAdmin is the opaque platform operator.

  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Account
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: holder_name, type: string, source: input, description: "Account holder full name" }
      - { name: home_state_code, type: string, source: input, description: "Two-letter home state (e.g. NY, NJ, CA)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DELINQUENT | SUSPENDED | CLOSED", default: "ACTIVE", constraints: "ACTIVE,DELINQUENT,SUSPENDED,CLOSED" }
      - { name: balance_cents, type: integer, source: system, description: "Prepaid toll balance in cents; may go negative when a toll posts against insufficient funds", default: 0 }
      - { name: low_balance_threshold_cents, type: integer, source: input, description: "Balance at or below which auto-reload fires; must be >= 0", default: 1000 }
      - { name: auto_reload_enabled, type: boolean, source: input, description: "Whether low-balance auto-reload is armed", default: false }
      - { name: reload_amount_cents, type: integer, source: input, description: "Fixed top-up amount used by FIXED reload policy; must be > 0 when auto_reload_enabled", default: 4000 }
      - { name: reload_policy, type: enum, source: input, description: "FIXED (add reload_amount_cents) | RESTORE_TO_TARGET (top up to target_balance_cents)", default: "FIXED", constraints: "FIXED,RESTORE_TO_TARGET" }
      - { name: target_balance_cents, type: integer, source: input, description: "Target balance for RESTORE_TO_TARGET policy; must be > low_balance_threshold_cents when policy is RESTORE_TO_TARGET", default: 5000 }
      - { name: outstanding_fines_cents, type: integer, source: computed, description: "Sum of fine_total_cents over Violations of this account whose settlement_status IN {ASSESSED, CONTESTED}", default: 0 }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; owning account" }
      - { name: plate_number, type: string, source: input, description: "License plate string, uppercased" }
      - { name: plate_state_code, type: string, source: input, description: "Two-letter plate-issuing state" }
      - { name: registration_status, type: enum, source: system, description: "REGISTERED | LAPSED; LAPSED plates cannot price under transponder rate", default: "REGISTERED", constraints: "REGISTERED,LAPSED" }
      - { name: hov_capable, type: boolean, source: input, description: "Whether this vehicle is eligible to declare carpool/HOV windows", default: false }
      - { name: axle_count, type: integer, source: input, description: "Axle count used by axle-tier pricing; must be >= 2", default: 2 }

  - name: Transponder
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; owning account" }
      - { name: serial, type: string, source: input, description: "Hardware serial, unique across all transponders" }
      - { name: status, type: enum, source: system, description: "UNBOUND | BOUND | DEACTIVATED", default: "UNBOUND", constraints: "UNBOUND,BOUND,DEACTIVATED" }

  - name: TransponderBinding
    parent: null
    common_fields: true
    fields:
      - { name: transponder_id, type: string, source: input, description: "FK -> Transponder.id; bound device" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; vehicle the device is mounted on" }
      - { name: effective_from, type: datetime, source: input, description: "Binding start (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Binding end (exclusive); null while open" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ENDED", default: "ACTIVE", constraints: "ACTIVE,ENDED" }

  - name: HovWindow
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; vehicle declaring carpool occupancy" }
      - { name: window_from, type: datetime, source: input, description: "Window start (inclusive)" }
      - { name: window_to, type: datetime, source: input, description: "Window end (exclusive)" }
      - { name: declared_occupants, type: integer, source: input, description: "Number of occupants declared; must be >= 1" }
      - { name: status, type: enum, source: system, description: "DECLARED | REVOKED", default: "DECLARED", constraints: "DECLARED,REVOKED" }

  - name: Plaza
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Plaza name" }
      - { name: state_code, type: string, source: input, description: "Two-letter state operating the plaza" }
      - { name: base_rate_cents, type: integer, source: input, description: "Base 2-axle off-peak toll in cents; must be > 0" }
      - { name: peak_multiplier_bps, type: integer, source: input, description: "Peak surcharge in basis points applied during peak hours (e.g. 2500 = +25%); must be >= 0", default: 0 }
      - { name: axle_surcharge_cents, type: integer, source: input, description: "Per-axle surcharge above 2 axles, in cents; must be >= 0", default: 0 }
      - { name: hov_min_occupants, type: integer, source: input, description: "Minimum declared occupants for full HOV exemption at this plaza; must be >= 2", default: 3 }
      - { name: plate_surcharge_bps, type: integer, source: input, description: "Toll-by-Plate surcharge in basis points over the transponder toll; must be >= 0", default: 5000 }

  - name: TollTransaction
    parent: null
    common_fields: true
    fields:
      - { name: plaza_id, type: string, source: input, description: "FK -> Plaza.id; where the toll was read" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; resolved owner (via transponder or plate match); null when unresolved", required: false }
      - { name: vehicle_id, type: string, source: system, description: "FK -> Vehicle.id; resolved vehicle; null when plate unmatched", required: false }
      - { name: transponder_id, type: string, source: input, description: "FK -> Transponder.id; present for transponder reads", required: false }
      - { name: read_method, type: enum, source: input, description: "TRANSPONDER | PLATE", constraints: "TRANSPONDER,PLATE" }
      - { name: plate_number, type: string, source: input, description: "Captured plate for PLATE reads", required: false }
      - { name: plate_state_code, type: string, source: input, description: "Captured plate state for PLATE reads", required: false }
      - { name: read_at, type: datetime, source: input, description: "Timestamp of the gantry read" }
      - { name: is_peak, type: boolean, source: input, description: "Whether the read occurred in a peak window" }
      - { name: declared_axles, type: integer, source: input, description: "Axle count sensed at the gantry; must be >= 2", default: 2 }
      - { name: pricing_status, type: enum, source: system, description: "PENDING | PRICED | EXEMPT | REPRICED (pricing dimension)", default: "PENDING", constraints: "PENDING,PRICED,EXEMPT,REPRICED" }
      - { name: settlement_status, type: enum, source: system, description: "UNSETTLED | SETTLED | IN_VIOLATION | WRITTEN_OFF (settlement dimension)", default: "UNSETTLED", constraints: "UNSETTLED,SETTLED,IN_VIOLATION,WRITTEN_OFF" }
      - { name: gross_toll_cents, type: integer, source: computed, description: "Toll before HOV exemption and before plate surcharge", default: 0 }
      - { name: toll_cents, type: integer, source: computed, description: "Final amount charged to the account after HOV exemption and plate surcharge", default: 0 }
      - { name: hov_exempt, type: boolean, source: computed, description: "Whether an HOV window covered this read and met plaza occupancy minimum", default: false }
      - { name: interop_agency_id, type: string, source: input, description: "FK -> InteropAgency.id; set when posted by a partner agency", required: false }

  - name: Violation
    parent: null
    common_fields: true
    fields:
      - { name: toll_transaction_id, type: string, source: input, description: "FK -> TollTransaction.id; the unsettled toll being escalated" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; owning account at issuance", required: false }
      - { name: toll_due_cents, type: integer, source: system, description: "Underlying toll carried from the transaction" }
      - { name: penalty_cents, type: integer, source: computed, description: "Penalty added on top of the toll per the escalation tier", default: 0 }
      - { name: fine_total_cents, type: integer, source: computed, description: "toll_due_cents + penalty_cents", default: 0 }
      - { name: escalation_tier, type: integer, source: system, description: "Tier index; increments each re-issue cycle, starts at 1", default: 1 }
      - { name: settlement_status, type: enum, source: system, description: "ASSESSED | CONTESTED | SETTLED | DISMISSED (cyclic via re-issue)", default: "ASSESSED", constraints: "ASSESSED,CONTESTED,SETTLED,DISMISSED" }
      - { name: dispute_reason, type: string, source: input, description: "Free-text reason supplied on contest", required: false }

  - name: InteropAgency
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Partner tolling authority name" }
      - { name: state_code, type: string, source: input, description: "Two-letter home state of the partner agency" }
      - { name: settlement_fee_bps, type: integer, source: input, description: "Interop clearing fee in basis points withheld from the home authority's share; must be >= 0", default: 200 }
      - { name: active, type: boolean, source: input, description: "Whether interop posting from this agency is accepted", default: true }

  - name: LedgerEntry
    parent: null
    common_fields: false   # id, created_at only — append-only event
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; account whose balance moved" }
      - { name: entry_type, type: enum, source: system, description: "TOLL_DEBIT | RELOAD_CREDIT | VIOLATION_SETTLE | DISPUTE_REFUND | INTEROP_DEBIT", constraints: "TOLL_DEBIT,RELOAD_CREDIT,VIOLATION_SETTLE,DISPUTE_REFUND,INTEROP_DEBIT" }
      - { name: amount_cents, type: integer, source: system, description: "Signed delta applied to Account.balance_cents (negative for debits)" }
      - { name: ref_transaction_id, type: string, source: system, description: "FK -> TollTransaction.id; originating toll, when applicable", required: false }
      - { name: ref_violation_id, type: string, source: system, description: "FK -> Violation.id; originating violation, when applicable", required: false }
      - { name: balance_after_cents, type: integer, source: system, description: "Account.balance_cents immediately after this entry" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Account
    field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: DELINQUENT
        trigger: "system (a Violation for this account reaches settlement_status=ASSESSED)"
        actor: system
        preconditions: ["Account.status == ACTIVE"]
        side_effects:
          - "outstanding_fines_cents recomputed (calc account_outstanding_fines)"
      - from: DELINQUENT
        to: ACTIVE
        trigger: "system (all Violations for this account leave {ASSESSED, CONTESTED}, i.e. outstanding_fines_cents == 0)"
        actor: system
        preconditions: ["Account.status == DELINQUENT", "no Violation of this account in settlement_status IN {ASSESSED, CONTESTED}"]
        side_effects:
          - "outstanding_fines_cents recomputed to 0"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /etc/accounts/{id}/suspend"
        actor: TollOperator
        preconditions: ["Account.status == ACTIVE"]
        side_effects:
          - "All BOUND Transponders of this account -> DEACTIVATED; their ACTIVE TransponderBindings -> ENDED with effective_to = now"
      - from: DELINQUENT
        to: SUSPENDED
        trigger: "POST /etc/accounts/{id}/suspend"
        actor: TollOperator
        preconditions: ["Account.status == DELINQUENT"]
        side_effects:
          - "All BOUND Transponders of this account -> DEACTIVATED; their ACTIVE TransponderBindings -> ENDED with effective_to = now"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /etc/accounts/{id}/reinstate"
        actor: TollOperator
        preconditions: ["Account.status == SUSPENDED", "outstanding_fines_cents == 0"]
        side_effects: []
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /etc/accounts/{id}/close"
        actor: TollOperator
        preconditions: ["Account.status == SUSPENDED", "Account.balance_cents == 0", "outstanding_fines_cents == 0"]
        side_effects: []

  - entity: Transponder
    field: status
    initial_state: UNBOUND
    terminal_states: [DEACTIVATED]
    transitions:
      - from: UNBOUND
        to: BOUND
        trigger: "POST /etc/transponder-bindings"
        actor: AccountHolder
        preconditions:
          - "Transponder.status == UNBOUND"
          - "owning Account.status == ACTIVE"            # cross-entity dependency
          - "target Vehicle.account_id == Transponder.account_id"
        side_effects:
          - "a TransponderBinding row is created in ACTIVE"
      - from: BOUND
        to: UNBOUND
        trigger: "POST /etc/transponder-bindings/{id}/end"
        actor: AccountHolder
        preconditions: ["Transponder.status == BOUND"]
        side_effects:
          - "the ACTIVE TransponderBinding -> ENDED with effective_to = now"
      - from: BOUND
        to: DEACTIVATED
        trigger: "system (owning Account -> SUSPENDED)"
        actor: system
        preconditions: []
        side_effects:
          - "the ACTIVE TransponderBinding -> ENDED with effective_to = now"
      - from: UNBOUND
        to: DEACTIVATED
        trigger: "system (owning Account -> SUSPENDED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TollTransaction
    field: pricing_status
    initial_state: PENDING
    terminal_states: []
    note: "Pricing dimension. Runs independently of settlement_status (parallel dimensions on one row)."
    transitions:
      - from: PENDING
        to: PRICED
        trigger: "POST /etc/toll-transactions/{id}/price"
        actor: TollOperator
        preconditions:
          - "TollTransaction.pricing_status == PENDING"
          - "account_id resolved (transponder bound, or plate matched a Vehicle)"
          - "no DECLARED HovWindow meeting plaza.hov_min_occupants covers read_at for the vehicle"
        side_effects:
          - "gross_toll_cents and toll_cents set (calc toll_pricing)"
          - "if read_method==TRANSPONDER: Account.balance_cents debited by toll_cents, LedgerEntry TOLL_DEBIT (-toll_cents) appended, and settlement dimension UNSETTLED -> SETTLED"
          - "if read_method==PLATE AND interop_agency_id is set: Account.balance_cents debited by interop_home_share.home_debit_cents (calc interop_home_share), LedgerEntry INTEROP_DEBIT (-home_debit_cents) appended, and settlement dimension UNSETTLED -> SETTLED"
          - "if read_method==PLATE AND interop_agency_id is null: NO debit and settlement dimension stays UNSETTLED (awaits manual settle or violation)"
          - "after any debit above: if balance_cents <= low_balance_threshold_cents and auto_reload_enabled, auto-reload fires (calc auto_reload_amount), LedgerEntry RELOAD_CREDIT appended"
      - from: PENDING
        to: EXEMPT
        trigger: "POST /etc/toll-transactions/{id}/price"
        actor: TollOperator
        preconditions:
          - "TollTransaction.pricing_status == PENDING"
          - "a DECLARED HovWindow with declared_occupants >= plaza.hov_min_occupants covers read_at for the resolved vehicle"  # cross-entity dependency
        side_effects:
          - "hov_exempt = true; gross_toll_cents computed but toll_cents = 0; no account debit"
          - "settlement dimension: UNSETTLED -> SETTLED (nothing owed)"
      - from: PRICED
        to: REPRICED
        trigger: "POST /etc/toll-transactions/{id}/reprice"
        actor: TollOperator
        preconditions:
          - "TollTransaction.pricing_status == PRICED"
          - "TollTransaction.settlement_status != WRITTEN_OFF"
        side_effects:
          - "toll_cents recomputed; Account.balance_cents adjusted by (new_toll_cents - old_toll_cents); LedgerEntry TOLL_DEBIT appended for the delta"

  - entity: TollTransaction
    field: settlement_status
    initial_state: UNSETTLED
    terminal_states: [WRITTEN_OFF]
    note: "Settlement dimension. Evolves independently of pricing_status."
    transitions:
      - from: UNSETTLED
        to: SETTLED
        trigger: "system (price/reprice fully covered by funds) OR POST /etc/toll-transactions/{id}/settle"
        actor: "system or TollOperator"
        preconditions: ["TollTransaction.settlement_status == UNSETTLED", "TollTransaction.pricing_status IN {PRICED, EXEMPT, REPRICED}"]
        side_effects:
          - "Account debited for any unpaid remainder; LedgerEntry TOLL_DEBIT appended"
      - from: UNSETTLED
        to: IN_VIOLATION
        trigger: "POST /etc/violations"
        actor: TollOperator
        preconditions:
          - "TollTransaction.settlement_status == UNSETTLED"
          - "TollTransaction.pricing_status == PRICED"
          - "read_method == PLATE"                      # Toll-by-Plate unpaid escalation
        side_effects:
          - "a Violation is created in ASSESSED; owning Account -> DELINQUENT if ACTIVE (cascade)"
      - from: IN_VIOLATION
        to: SETTLED
        trigger: "system (the linked Violation -> SETTLED)"
        actor: system
        preconditions: ["TollTransaction.settlement_status == IN_VIOLATION"]
        side_effects: []
      - from: IN_VIOLATION
        to: WRITTEN_OFF
        trigger: "system (the linked Violation -> DISMISSED)"
        actor: system
        preconditions: ["TollTransaction.settlement_status == IN_VIOLATION"]
        side_effects: []

  - entity: Violation
    field: settlement_status
    initial_state: ASSESSED
    terminal_states: [SETTLED, DISMISSED]
    note: "Cyclic: ASSESSED -> CONTESTED -> ASSESSED on rejected dispute (re-issue increments escalation_tier)."
    transitions:
      - from: ASSESSED
        to: CONTESTED
        trigger: "POST /etc/violations/{id}/contest"
        actor: AccountHolder
        preconditions: ["Violation.settlement_status == ASSESSED"]
        side_effects: ["dispute_reason stored"]
      - from: CONTESTED
        to: ASSESSED
        trigger: "POST /etc/violations/{id}/reject-dispute"
        actor: TollOperator
        preconditions: ["Violation.settlement_status == CONTESTED"]
        side_effects:
          - "escalation_tier += 1; penalty_cents and fine_total_cents recomputed (calc violation_fine); Account.outstanding_fines_cents recomputed"
      - from: CONTESTED
        to: DISMISSED
        trigger: "POST /etc/violations/{id}/accept-dispute"
        actor: TollOperator
        preconditions: ["Violation.settlement_status == CONTESTED"]
        side_effects:
          - "linked TollTransaction.settlement_status IN_VIOLATION -> WRITTEN_OFF (cascade)"
          - "Account.outstanding_fines_cents recomputed; if 0 and Account.status==DELINQUENT -> ACTIVE (cascade)"
      - from: ASSESSED
        to: SETTLED
        trigger: "POST /etc/violations/{id}/pay"
        actor: AccountHolder
        preconditions: ["Violation.settlement_status == ASSESSED", "Account.balance_cents >= fine_total_cents"]
        side_effects:
          - "Account.balance_cents debited by fine_total_cents; LedgerEntry VIOLATION_SETTLE appended"
          - "linked TollTransaction.settlement_status IN_VIOLATION -> SETTLED (cascade)"
          - "Account.outstanding_fines_cents recomputed; if 0 and Account.status==DELINQUENT -> ACTIVE (cascade)"
      - from: CONTESTED
        to: SETTLED
        trigger: "POST /etc/violations/{id}/pay"
        actor: AccountHolder
        preconditions: ["Violation.settlement_status == CONTESTED", "Account.balance_cents >= fine_total_cents"]
        side_effects:
          - "Account.balance_cents debited by fine_total_cents; LedgerEntry VIOLATION_SETTLE appended"
          - "linked TollTransaction.settlement_status IN_VIOLATION -> SETTLED (cascade)"
          - "Account.outstanding_fines_cents recomputed; if 0 and Account.status==DELINQUENT -> ACTIVE (cascade)"

# =============================================================================
# Table 2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: binding-create-stale-vehicle
    parent_entity: Vehicle
    write_endpoint: "POST /etc/transponder-bindings"
    occ_field: "expected_vehicle_version"
    description: |
      Creating a TransponderBinding against a Vehicle whose version has advanced
      since the client last observed it is rejected with a stale-version error.
      This captures the case where another writer has already created a binding
      on the same vehicle (legitimately superseding the client's view, since a
      vehicle's binding history governs which transponder prices its tolls) and
      the current writer's snapshot of the vehicle is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: reprice-stale-transaction
    parent_entity: TollTransaction
    write_endpoint: "POST /etc/toll-transactions/{id}/reprice"
    occ_field: "expected_transaction_version"
    description: |
      Repricing a TollTransaction whose version has advanced since the client
      last read it is rejected with a stale-version error. The transaction's
      version is bumped by any settlement transition or cascade applied after
      the client's read, so a reprice carrying the prior version operates on a
      stale snapshot and is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: toll_pricing
    trigger: "TollTransaction PENDING -> PRICED (POST /etc/toll-transactions/{id}/price), and on reprice"
    algorithm: tiered_pricing
    formula: |
      # gross_toll_cents — combinatorial: tiered axle surcharge + peak multiplier (mode (a), >=3 inputs, non-linear)
      axle_extra = max(0, declared_axles - 2) * plaza.axle_surcharge_cents
      pre_peak   = plaza.base_rate_cents + axle_extra
      if is_peak:
          peaked = round_half_up( pre_peak * (10000 + plaza.peak_multiplier_bps) / 10000 )
      else:
          peaked = pre_peak
      gross_toll_cents = peaked
      # toll_cents — branch on read method and HOV exemption
      if hov_exempt:               # EXEMPT branch handled by state machine, toll_cents = 0
          toll_cents = 0
      elif read_method == TRANSPONDER:
          toll_cents = gross_toll_cents
      else:                        # PLATE: Toll-by-Plate surcharge
          toll_cents = round_half_up( gross_toll_cents * (10000 + plaza.plate_surcharge_bps) / 10000 )
    input_set: "Single TollTransaction in PENDING (or PRICED on reprice); inputs from its Plaza and its own read fields"
    constants:
      BPS_DENOMINATOR: 10000
    precision: "integer cents, round_half_up at each multiplicative step (peak first, then plate surcharge)"
    variants:
      - name: transponder_rate
        when: "read_method == TRANSPONDER"
        difference: "no plate surcharge; toll_cents == gross_toll_cents"
      - name: plate_rate
        when: "read_method == PLATE"
        difference: "plate_surcharge_bps applied on top of gross_toll_cents"

  - name: trip_multi_segment_toll
    trigger: "POST /etc/toll-transactions/batch-trip (a single trip spanning multiple plaza segments billed as one charge)"
    algorithm: aggregation
    formula: |
      # Combinatorial mode (b): nested rounding where order is PINNED.
      # The trip total is computed as ROUND-PER-SEGMENT-THEN-SUM (NOT sum-then-round):
      # for each segment i, compute segment_toll_cents[i] via toll_pricing (already
      # integer cents, round_half_up per its own steps), THEN:
      #   trip_total_cents = sum_over_segments( segment_toll_cents[i] )
      # The order is fixed: each segment is independently rounded to whole cents
      # first, and the already-rounded segment tolls are summed. No second rounding
      # is applied to the sum.
      trip_total_cents = sum( segment_toll_cents[i] for i in segments )
    input_set: "The ordered list of segment reads in one batch-trip request; segments processed in request order"
    constants: {}
    precision: "integer cents; round per segment (inside toll_pricing) then sum, never sum-then-round"

  - name: violation_fine
    trigger: "Violation creation (ASSESSED) and each re-issue (CONTESTED -> ASSESSED via reject-dispute)"
    algorithm: threshold
    formula: |
      # Penalty escalates by tier. Tier 1 at issuance; each rejected dispute bumps tier.
      base_penalty_cents = 2500            # flat administrative penalty
      tier_extra = (escalation_tier - 1) * 1500   # +1500 cents per re-issue cycle
      penalty_cents   = base_penalty_cents + tier_extra
      fine_total_cents = toll_due_cents + penalty_cents
    input_set: "Single Violation; toll_due_cents carried from the linked TollTransaction.toll_cents at issuance"
    constants:
      BASE_PENALTY_CENTS: 2500
      TIER_STEP_CENTS: 1500
    precision: "integer cents, exact"

  - name: auto_reload_amount
    trigger: "after any TOLL_DEBIT/VIOLATION_SETTLE leaves Account.balance_cents <= low_balance_threshold_cents and auto_reload_enabled"
    algorithm: threshold
    formula: |
      # Dual-variant: two valid top-up algorithms on the Account domain.
      if reload_policy == FIXED:
          reload_credit_cents = reload_amount_cents
      else:  # RESTORE_TO_TARGET
          reload_credit_cents = max(0, target_balance_cents - balance_cents)
      # fires only when balance_cents <= low_balance_threshold_cents (boundary: <=, not <)
    input_set: "Single Account, evaluated immediately after a balance-decreasing ledger entry"
    constants: {}
    precision: "integer cents, exact"
    variants:
      - name: fixed_topup
        when: "reload_policy == FIXED"
        difference: "adds a flat reload_amount_cents regardless of current balance"
      - name: restore_to_target
        when: "reload_policy == RESTORE_TO_TARGET"
        difference: "tops up exactly enough to reach target_balance_cents from the (possibly negative) current balance"

  - name: account_outstanding_fines
    trigger: "Violation create / pay / accept-dispute / reject-dispute"
    algorithm: aggregation
    formula: |
      outstanding_fines_cents = sum( v.fine_total_cents
                                     for v in Violations where v.account_id == account.id
                                     and v.settlement_status IN {ASSESSED, CONTESTED} )
    input_set: "All Violations of the account whose settlement_status IN {ASSESSED, CONTESTED}; SETTLED and DISMISSED excluded"
    constants: {}
    precision: "integer cents, exact"

  - name: interop_home_share
    trigger: "TollTransaction PENDING -> PRICED (POST /etc/toll-transactions/{id}/price) when read_method==PLATE and interop_agency_id is set"
    algorithm: aggregation
    formula: |
      # When a partner agency posts a toll for one of our vehicles, the home
      # authority withholds a clearing fee from the gross before debiting.
      withheld_cents = round_half_up( toll_cents * agency.settlement_fee_bps / 10000 )
      home_debit_cents = toll_cents - withheld_cents   # amount actually debited from the account
    input_set: "Single TollTransaction with interop_agency_id set and its InteropAgency"
    constants:
      BPS_DENOMINATOR: 10000
    precision: "integer cents, round_half_up on the withheld fee"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body FK ids resolve to existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: auth
    check: "For entity_backed AccountHolder ops, X-User-ID must own the targeted Account/Vehicle/Transponder"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "AccountHolder-owned resources"

  - priority: 5
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_referential
    check: "On binding, the Vehicle and Transponder belong to the same Account"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 409
    applies_to: "POST /etc/transponder-bindings"

  - priority: 7
    category: business_safety
    check: "Owning Account must be ACTIVE to bind a transponder (not DELINQUENT/SUSPENDED/CLOSED)"
    error_id: ERR_ACCOUNT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /etc/transponder-bindings"

  - priority: 8
    category: business_referential
    check: "A PLATE-read transaction can only price under transponder rate if the matched Vehicle.registration_status == REGISTERED; LAPSED forces plate rate / violation path"
    error_id: ERR_PLATE_UNREGISTERED
    http_status: 409
    applies_to: "POST /etc/toll-transactions/{id}/price"

  - priority: 9
    category: business_temporal
    check: "A new TransponderBinding interval [effective_from, effective_to) must not overlap any ACTIVE binding interval on the same Vehicle; abutting (touching endpoints) is allowed (half-open)"
    error_id: ERR_BINDING_OVERLAP
    http_status: 409
    applies_to: "POST /etc/transponder-bindings"

  - priority: 10
    category: business_temporal
    check: "A new HovWindow [window_from, window_to) must not overlap, AND must not abut within a 15-minute buffer, any DECLARED HovWindow on the same Vehicle (buffered intervals)"
    error_id: ERR_HOV_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /etc/hov-windows"

  - priority: 11
    category: business_constraint
    check: "declared_occupants >= 1; for full exemption the per-plaza check uses hov_min_occupants at price time"
    error_id: ERR_INVALID_OCCUPANCY
    http_status: 422
    applies_to: "POST /etc/hov-windows"

  - priority: 12
    category: business_constraint
    check: "Transponder serial is unique across all transponders"
    error_id: ERR_DUPLICATE_SERIAL
    http_status: 409
    applies_to: "POST /etc/transponders"

  - priority: 13
    category: business_referential
    check: "A Violation may only be opened on a PRICED, UNSETTLED, PLATE-read TollTransaction"
    error_id: ERR_NOT_VIOLATION_ELIGIBLE
    http_status: 409
    applies_to: "POST /etc/violations"

  - priority: 14
    category: business_constraint
    check: "Interop posting requires an InteropAgency with active == true"
    error_id: ERR_INTEROP_AGENCY_INACTIVE
    http_status: 409
    applies_to: "POST /etc/toll-transactions (interop)"

  - priority: 15
    category: business_fiscal
    check: "Paying a Violation requires Account.balance_cents >= fine_total_cents"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 402
    applies_to: "POST /etc/violations/{id}/pay"

  - priority: 16
    category: business_fiscal
    check: "Closing an Account requires balance_cents == 0 and outstanding_fines_cents == 0"
    error_id: ERR_BALANCE_NONZERO
    http_status: 409
    applies_to: "POST /etc/accounts/{id}/close"

  - priority: 17
    category: concurrency
    check: "expected_<parent>_version on OCC-guarded writes must match current parent.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /etc/transponder-bindings, POST /etc/toll-transactions/{id}/reprice"

  - priority: 18
    category: validation
    check: "Body is valid JSON, required fields present, enum values legal, numeric constraints satisfied"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Account ---
  - method: POST
    path: "/etc/accounts"
    description: "Create a toll account"
    roles: [AccountHolder, TollOperator]
    code: 201
    input: [holder_name, home_state_code, "low_balance_threshold_cents?", "auto_reload_enabled?", "reload_amount_cents?", "reload_policy?", "target_balance_cents?"]
    output: Account
    side_effects: ["status=ACTIVE, balance_cents=0"]

  - method: GET
    path: "/etc/accounts/{id}"
    description: "Get an account"
    roles: [AccountHolder, TollOperator, SystemAdmin]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: POST
    path: "/etc/accounts/{id}/credit"
    description: "Manually credit balance (deposit / one-off top-up)"
    roles: [AccountHolder, TollOperator]
    code: 200
    input: [amount_cents]
    output: Account
    side_effects: ["balance_cents += amount_cents; LedgerEntry RELOAD_CREDIT appended"]

  - method: POST
    path: "/etc/accounts/{id}/suspend"
    description: "Suspend an account"
    roles: [TollOperator]
    code: 200
    input: ["reason?"]
    output: Account
    side_effects: ["status -> SUSPENDED; BOUND transponders -> DEACTIVATED; ACTIVE bindings -> ENDED"]

  - method: POST
    path: "/etc/accounts/{id}/reinstate"
    description: "Reinstate a suspended account"
    roles: [TollOperator]
    code: 200
    input: []
    output: Account
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/etc/accounts/{id}/close"
    description: "Close an account"
    roles: [TollOperator]
    code: 200
    input: []
    output: Account
    side_effects: ["status -> CLOSED"]

  - method: GET
    path: "/etc/accounts/{id}/ledger-entries"
    description: "List ledger entries for an account (reverse-reachability for LedgerEntry.account_id)"
    roles: [AccountHolder, TollOperator, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  - method: GET
    path: "/etc/ledger-entries/{id}"
    description: "Get a single ledger entry"
    roles: [AccountHolder, TollOperator, SystemAdmin]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []

  - method: GET
    path: "/etc/ledger-entries"
    description: "List ledger entries, filterable by account, originating transaction, or originating violation (reverse-reachability for those FKs)"
    roles: [AccountHolder, TollOperator, SystemAdmin]
    code: 200
    input: ["account_id?", "ref_transaction_id?", "ref_violation_id?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  # --- Vehicle ---
  - method: POST
    path: "/etc/vehicles"
    description: "Register a vehicle under an account"
    roles: [AccountHolder, TollOperator]
    code: 201
    input: [account_id, plate_number, plate_state_code, "hov_capable?", "axle_count?"]
    output: Vehicle
    side_effects: ["registration_status=REGISTERED"]

  - method: GET
    path: "/etc/vehicles/{id}"
    description: "Get a vehicle"
    roles: [AccountHolder, TollOperator, SystemAdmin]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/etc/vehicles"
    description: "List vehicles, filterable by account (reverse-reachability for Vehicle.account_id)"
    roles: [AccountHolder, TollOperator, SystemAdmin]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: Vehicle[]
    side_effects: []

  - method: POST
    path: "/etc/vehicles/{id}/lapse-registration"
    description: "Mark a vehicle's plate registration LAPSED (test/admin operation)"
    roles: [TollOperator, SystemAdmin]
    code: 200
    input: []
    output: Vehicle
    side_effects: ["registration_status -> LAPSED"]

  # --- Transponder ---
  - method: POST
    path: "/etc/transponders"
    description: "Create an UNBOUND transponder under an account"
    roles: [AccountHolder, TollOperator]
    code: 201
    input: [account_id, serial]
    output: Transponder
    side_effects: ["status=UNBOUND"]

  - method: GET
    path: "/etc/transponders/{id}"
    description: "Get a transponder"
    roles: [AccountHolder, TollOperator, SystemAdmin]
    code: 200
    input: []
    output: Transponder
    side_effects: []

  - method: GET
    path: "/etc/transponders"
    description: "List transponders, filterable by account (reverse-reachability for Transponder.account_id)"
    roles: [AccountHolder, TollOperator, SystemAdmin]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: Transponder[]
    side_effects: []

  # --- TransponderBinding ---
  - method: POST
    path: "/etc/transponder-bindings"
    description: "Bind a transponder to a vehicle (OCC on Vehicle.version)"
    roles: [AccountHolder]
    code: 201
    input: [transponder_id, vehicle_id, effective_from, "effective_to?", expected_vehicle_version]
    output: TransponderBinding
    side_effects: ["Transponder -> BOUND; binding ACTIVE; increments Vehicle.version by 1"]

  - method: GET
    path: "/etc/transponder-bindings/{id}"
    description: "Get a binding"
    roles: [AccountHolder, TollOperator, SystemAdmin]
    code: 200
    input: []
    output: TransponderBinding
    side_effects: []

  - method: GET
    path: "/etc/transponder-bindings"
    description: "List bindings, filterable by transponder or vehicle (reverse-reachability for both FKs)"
    roles: [AccountHolder, TollOperator, SystemAdmin]
    code: 200
    input: ["transponder_id?", "vehicle_id?", "limit?", "offset?"]
    output: TransponderBinding[]
    side_effects: []

  - method: POST
    path: "/etc/transponder-bindings/{id}/end"
    description: "End an active binding"
    roles: [AccountHolder]
    code: 200
    input: []
    output: TransponderBinding
    side_effects: ["binding -> ENDED, effective_to=now; Transponder -> UNBOUND"]

  # --- HovWindow ---
  - method: POST
    path: "/etc/hov-windows"
    description: "Declare a carpool/HOV occupancy window for a vehicle"
    roles: [AccountHolder]
    code: 201
    input: [vehicle_id, window_from, window_to, declared_occupants]
    output: HovWindow
    side_effects: ["status=DECLARED"]

  - method: GET
    path: "/etc/hov-windows/{id}"
    description: "Get an HOV window"
    roles: [AccountHolder, TollOperator, SystemAdmin]
    code: 200
    input: []
    output: HovWindow
    side_effects: []

  - method: GET
    path: "/etc/hov-windows"
    description: "List HOV windows, filterable by vehicle (reverse-reachability for HovWindow.vehicle_id)"
    roles: [AccountHolder, TollOperator, SystemAdmin]
    code: 200
    input: ["vehicle_id?", "limit?", "offset?"]
    output: HovWindow[]
    side_effects: []

  - method: POST
    path: "/etc/hov-windows/{id}/revoke"
    description: "Revoke a declared HOV window"
    roles: [AccountHolder]
    code: 200
    input: []
    output: HovWindow
    side_effects: ["status -> REVOKED"]

  # --- Plaza ---
  - method: POST
    path: "/etc/plazas"
    description: "Create a toll plaza"
    roles: [TollOperator]
    code: 201
    input: [name, state_code, base_rate_cents, "peak_multiplier_bps?", "axle_surcharge_cents?", "hov_min_occupants?", "plate_surcharge_bps?"]
    output: Plaza
    side_effects: []

  - method: GET
    path: "/etc/plazas/{id}"
    description: "Get a plaza"
    roles: [AccountHolder, TollOperator, SystemAdmin]
    code: 200
    input: []
    output: Plaza
    side_effects: []

  - method: GET
    path: "/etc/plazas/{id}/toll-transactions"
    description: "List toll transactions at a plaza (reverse-reachability for TollTransaction.plaza_id)"
    roles: [TollOperator, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: TollTransaction[]
    side_effects: []

  # --- TollTransaction ---
  - method: POST
    path: "/etc/toll-transactions"
    description: "Record a gantry read (TRANSPONDER or PLATE); resolves account/vehicle"
    roles: [TollOperator, InteropClerk]
    code: 201
    input: [plaza_id, read_method, read_at, is_peak, "declared_axles?", "transponder_id?", "plate_number?", "plate_state_code?", "interop_agency_id?"]
    output: TollTransaction
    side_effects: ["pricing_status=PENDING, settlement_status=UNSETTLED; account_id/vehicle_id resolved"]

  - method: GET
    path: "/etc/toll-transactions/{id}"
    description: "Get a toll transaction"
    roles: [AccountHolder, TollOperator, InteropClerk, SystemAdmin]
    code: 200
    input: []
    output: TollTransaction
    side_effects: []

  - method: GET
    path: "/etc/toll-transactions"
    description: "List toll transactions, filterable by account, vehicle, transponder, or interop agency (reverse-reachability for those FKs)"
    roles: [AccountHolder, TollOperator, InteropClerk, SystemAdmin]
    code: 200
    input: ["account_id?", "vehicle_id?", "transponder_id?", "interop_agency_id?", "limit?", "offset?"]
    output: TollTransaction[]
    side_effects: []

  - method: POST
    path: "/etc/toll-transactions/{id}/price"
    description: "Price a pending transaction (PENDING -> PRICED or EXEMPT; may settle and debit)"
    roles: [TollOperator]
    code: 200
    input: []
    output: TollTransaction
    side_effects: ["calc toll_pricing; HOV exemption check; debit + auto-reload cascade; settlement transition"]

  - method: POST
    path: "/etc/toll-transactions/{id}/reprice"
    description: "Reprice a priced transaction (PRICED -> REPRICED) with OCC on TollTransaction.version"
    roles: [TollOperator]
    code: 200
    input: [declared_axles, is_peak, expected_transaction_version]
    output: TollTransaction
    side_effects: ["recompute toll_cents; adjust balance by delta; increments TollTransaction.version by 1"]

  - method: POST
    path: "/etc/toll-transactions/{id}/settle"
    description: "Manually settle an unsettled priced transaction by debiting remainder"
    roles: [TollOperator, AccountHolder]
    code: 200
    input: []
    output: TollTransaction
    side_effects: ["settlement_status UNSETTLED -> SETTLED; debit remainder; auto-reload cascade"]

  - method: POST
    path: "/etc/toll-transactions/batch-trip"
    description: "Record + price a multi-segment trip as a single billed charge (round-per-segment-then-sum)"
    roles: [TollOperator]
    code: 201
    input: [account_id, "segments"]
    output: TollTransaction[]
    side_effects: ["one TollTransaction per segment, all PRICED; account debited trip_total_cents; calc trip_multi_segment_toll"]

  # --- Violation ---
  - method: POST
    path: "/etc/violations"
    description: "Open a violation on an unpaid plate-read toll"
    roles: [TollOperator]
    code: 201
    input: [toll_transaction_id]
    output: Violation
    side_effects: ["Violation ASSESSED; calc violation_fine; TollTransaction -> IN_VIOLATION; Account -> DELINQUENT (cascade)"]

  - method: GET
    path: "/etc/violations/{id}"
    description: "Get a violation"
    roles: [AccountHolder, TollOperator, SystemAdmin]
    code: 200
    input: []
    output: Violation
    side_effects: []

  - method: GET
    path: "/etc/violations"
    description: "List violations, filterable by account or toll transaction (reverse-reachability for both FKs)"
    roles: [AccountHolder, TollOperator, SystemAdmin]
    code: 200
    input: ["account_id?", "toll_transaction_id?", "limit?", "offset?"]
    output: Violation[]
    side_effects: []

  - method: POST
    path: "/etc/violations/{id}/contest"
    description: "Account holder contests a violation"
    roles: [AccountHolder]
    code: 200
    input: [dispute_reason]
    output: Violation
    side_effects: ["ASSESSED -> CONTESTED"]

  - method: POST
    path: "/etc/violations/{id}/accept-dispute"
    description: "Operator accepts the dispute (dismiss)"
    roles: [TollOperator]
    code: 200
    input: []
    output: Violation
    side_effects: ["CONTESTED -> DISMISSED; TollTransaction -> WRITTEN_OFF; Account possibly -> ACTIVE (cascade)"]

  - method: POST
    path: "/etc/violations/{id}/reject-dispute"
    description: "Operator rejects the dispute (re-issue at higher tier)"
    roles: [TollOperator]
    code: 200
    input: []
    output: Violation
    side_effects: ["CONTESTED -> ASSESSED; escalation_tier += 1; calc violation_fine; outstanding_fines recompute"]

  - method: POST
    path: "/etc/violations/{id}/pay"
    description: "Pay a violation fine from account balance"
    roles: [AccountHolder]
    code: 200
    input: []
    output: Violation
    side_effects: ["-> SETTLED; debit fine_total_cents; TollTransaction -> SETTLED; Account possibly -> ACTIVE (cascade)"]

  # --- InteropAgency ---
  - method: POST
    path: "/etc/interop-agencies"
    description: "Register a cross-state partner tolling agency"
    roles: [SystemAdmin]
    code: 201
    input: [name, state_code, "settlement_fee_bps?", "active?"]
    output: InteropAgency
    side_effects: []

  - method: GET
    path: "/etc/interop-agencies/{id}"
    description: "Get a partner agency"
    roles: [TollOperator, InteropClerk, SystemAdmin]
    code: 200
    input: []
    output: InteropAgency
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unknown" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "AccountHolder acting on a resource they do not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body, missing required field, illegal enum, or numeric constraint violated" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 409, condition: "Vehicle and Transponder belong to different accounts on bind" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "Owning account is not ACTIVE when binding a transponder" }
  - { id: ERR_PLATE_UNREGISTERED, http: 409, condition: "Plate-matched vehicle is LAPSED and cannot price at transponder rate" }
  - { id: ERR_BINDING_OVERLAP, http: 409, condition: "New binding interval overlaps an active binding on the same vehicle" }
  - { id: ERR_HOV_WINDOW_OVERLAP, http: 409, condition: "New HOV window overlaps or falls within the 15-minute buffer of a declared window on the same vehicle" }
  - { id: ERR_INVALID_OCCUPANCY, http: 422, condition: "declared_occupants < 1" }
  - { id: ERR_DUPLICATE_SERIAL, http: 409, condition: "Transponder serial already exists" }
  - { id: ERR_NOT_VIOLATION_ELIGIBLE, http: 409, condition: "Toll transaction is not a PRICED, UNSETTLED, PLATE read" }
  - { id: ERR_INTEROP_AGENCY_INACTIVE, http: 409, condition: "Interop posting references an inactive partner agency" }
  - { id: ERR_INSUFFICIENT_BALANCE, http: 402, condition: "Account balance below the violation fine total on pay" }
  - { id: ERR_BALANCE_NONZERO, http: 409, condition: "Account close attempted with nonzero balance or outstanding fines" }
  - { id: ERR_UNRESOLVED_READ, http: 409, condition: "Pricing a transaction whose account/vehicle could not be resolved" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current parent.version (OCC)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: AccountHolder
    description: "Customer who owns an account, its vehicles, transponders, bindings, HOV windows, and pays/contests their violations"
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /etc/transponder-bindings — bind own transponder to own vehicle"
      - "POST /etc/transponder-bindings/{id}/end — end own binding"
      - "POST /etc/hov-windows — declare HOV window for own vehicle"
      - "POST /etc/hov-windows/{id}/revoke — revoke own HOV window"
      - "POST /etc/violations/{id}/contest — contest own violation"
      - "POST /etc/violations/{id}/pay — pay own violation"
    shared_operations:
      - "POST /etc/accounts — create account"
      - "POST /etc/accounts/{id}/credit — top up own balance"
      - "POST /etc/vehicles — register own vehicle"
      - "POST /etc/transponders — create own transponder"
      - "POST /etc/toll-transactions/{id}/settle — settle own transaction"
      - "GET reads on own account/vehicle/transponder/binding/hov-window/violation/toll-transaction/ledger"

  - name: TollOperator
    description: "Tolling authority staff: plazas, pricing, settlement, violation pipeline, account lifecycle"
