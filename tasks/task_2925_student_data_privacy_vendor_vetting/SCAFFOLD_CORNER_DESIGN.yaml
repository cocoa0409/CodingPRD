              payload: { observed_domain: "quizmaster.example.net", school_code: "MS-04", source: "BROWSER_EXTENSION", observed_at: "2026-07-30T09:15:00Z", distinct_user_count: 30, session_count: 120 }
              as: TelemetryAgent
              captures: { det_id: $.data.id }
          assert:
            - "status == 201"
            - "TelemetryDetection.${det_id}.application_id is null"
            - "TelemetryDetection.${det_id}.classification == UNKNOWN_DOMAIN"
            - "TelemetryDetection.${det_id}.matched_catalog_entry_id is null"
            - "TelemetryDetection.${det_id}.exposure_score == 48.00"
            - "TelemetryDetection.${det_id}.status == NEW"
            - "TelemetryDetection.${det_id}.triaged_by_user_id is null"

