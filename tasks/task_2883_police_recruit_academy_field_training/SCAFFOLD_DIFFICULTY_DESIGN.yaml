              captures: { cs3_id: $.data.id }
            - call: "POST /course-sessions/${cs1_id}/attendance"
              payload: { recruit_id: "${rec_id}", status: "PARTIAL", present_hours: 1.50 }
              as: TrainingCoordinator
              as_user_id: "tc-1"
            - call: "POST /course-sessions/${cs2_id}/attendance"
              payload: { recruit_id: "${rec_id}", status: "PARTIAL", present_hours: 1.50 }
              as: TrainingCoordinator
              as_user_id: "tc-1"
            - call: "POST /course-sessions/${cs3_id}/attendance"
