# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1178: Retail Construction Rollout Program Management
# =============================================================================
scaffold_corner_design:
  # =============================================================
  - section: entities
    instances:
      - name: c_program_create_applies_defaults
        claim_type: creation
        grounds: [entities.RolloutProgram, state_machines.RolloutProgram]
        distinguishing_aspect: "Create returns 201 with status SETUP, computed aggregates zeroed, contingency_free_cents == pool, posture WITHIN_PLAN, version 1."
        test_recipe:
          setup: ["empty DB; clock at default 2026-05-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /rollout/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramDirector }
          trigger:
            - call: "POST /rollout/programs"
              payload: { name: "FY26 Rollout", fiscal_year: 2026, total_budget_cents: 500000000, contingency_pool_cents: 250000 }
              as: ProgramDirector
              captures: { st: $.data.status, com: $.data.committed_cents, res: $.data.contingency_reserved_cents, free: $.data.contingency_free_cents, post: $.data.budget_posture, ver: $.data.version }
          assert:
            - "RolloutProgram.status == SETUP"
            - "committed_cents == 0 and contingency_reserved_cents == 0"
            - "contingency_free_cents == 250000"
            - "budget_posture == WITHIN_PLAN"
            - "version == 1; id and created_at server-minted"

      - name: c_site_create_auto_creates_opening_commitment
        claim_type: side_effect_execution
        grounds: [entities.Site, entities.OpeningCommitment]
        distinguishing_aspect: "Site creation cascade-mints exactly one OpeningCommitment whose committed_open_on mirrors target_open_date and whose posture starts PROTECTED."
        test_recipe:
          setup: ["program and market exist"]
          setup_api_calls:
            - { call: "POST /rollout/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramDirector }
            - call: "POST /rollout/programs"
              payload: { name: "FY26 Rollout", fiscal_year: 2026, total_budget_cents: 500000000, contingency_pool_cents: 5000000 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /rollout/markets"
              payload: { program_id: "${prog}", name: "DFW", state_code: "TX", max_concurrent_vendor_crews: 2 }
              as: ProgramDirector
              captures: { mkt: $.data.id }
          trigger:
            - call: "POST /rollout/sites"
              payload: { program_id: "${prog}", market_id: "${mkt}", municipality_code: "TX-DAL", address: "100 Main St", square_footage: 4000, phase_wave: 1, budget_allocation_cents: 10000000, target_open_date: "2026-09-01" }
              as: ProgramDirector
              captures: { site: $.data.id, st: $.data.status, ready: $.data.readiness_posture, base: $.data.base_contract_cents }
            - call: "GET /rollout/opening-commitments"
              payload: { site_id: "${site}" }
              as: ProgramDirector
              captures: { oc_date: $.data.0.committed_open_on, oc_post: $.data.0.protection_posture }
          assert:
            - "Site.${site}.status == LISTED and readiness_posture == ROUGH and base_contract_cents == 0"
            - "OpeningCommitment.committed_open_on == 2026-09-01"
            - "OpeningCommitment.protection_posture == PROTECTED"

      - name: c_site_list_filter_and_pagination
        claim_type: listing
        grounds: [entities.Site]
        distinguishing_aspect: "List endpoint honors market_id filter and paginates with total_count/has_more under limit=1."
        test_recipe:
          setup: ["one program, one market, two sites in the market"]
          setup_api_calls:
            - { call: "POST /rollout/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramDirector }
            - call: "POST /rollout/programs"
              payload: { name: "FY26 Rollout", fiscal_year: 2026, total_budget_cents: 500000000, contingency_pool_cents: 5000000 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /rollout/markets"
              payload: { program_id: "${prog}", name: "DFW", state_code: "TX", max_concurrent_vendor_crews: 2 }
              as: ProgramDirector
              captures: { mkt: $.data.id }
            - { call: "POST /rollout/sites", payload: { program_id: "${prog}", market_id: "${mkt}", municipality_code: "TX-DAL", address: "100 Main St", square_footage: 4000, phase_wave: 1, budget_allocation_cents: 10000000, target_open_date: "2026-09-01" }, as: ProgramDirector }
            - { call: "POST /rollout/sites", payload: { program_id: "${prog}", market_id: "${mkt}", municipality_code: "TX-DAL", address: "200 Elm St", square_footage: 3500, phase_wave: 2, budget_allocation_cents: 9000000, target_open_date: "2026-10-01" }, as: ProgramDirector }
          trigger:
            - call: "GET /rollout/sites?limit=1&offset=0"
              payload: { market_id: "${mkt}" }
              as: ProgramDirector
              captures: { total: $.total_count, more: $.has_more }
          assert:
            - "total_count == 2 for market filter"
            - "has_more == true with limit=1"
            - "exactly 1 item in data page"

      - name: c_site_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Site, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but unknown site id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /rollout/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramDirector }
          trigger:
            - call: "GET /rollout/sites/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND with http 404"

      - name: c_site_create_missing_required_field_returns_400
        claim_type: required_fields
        grounds: [entities.Site, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting budget_allocation_cents (a required input with no default) fails with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["program and market exist"]
          setup_api_calls:
            - { call: "POST /rollout/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramDirector }
            - call: "POST /rollout/programs"
              payload: { name: "FY26 Rollout", fiscal_year: 2026, total_budget_cents: 500000000, contingency_pool_cents: 5000000 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /rollout/markets"
              payload: { program_id: "${prog}", name: "DFW", state_code: "TX", max_concurrent_vendor_crews: 2 }
              as: ProgramDirector
              captures: { mkt: $.data.id }
          trigger:
            - call: "POST /rollout/sites"
              payload: { program_id: "${prog}", market_id: "${mkt}", municipality_code: "TX-DAL", address: "100 Main St", square_footage: 4000, phase_wave: 1, target_open_date: "2026-09-01" }
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with http 400"

      - name: c_drawing_revision_auto_increments_per_jurisdiction
        claim_type: computed_fields
        grounds: [entities.DrawingSet.fields.revision]
        distinguishing_aspect: "Revision is system-assigned per (program, jurisdiction): 1 then 2 within TX-DAL, restarting at 1 for TX-FTW."
        test_recipe:
          setup: ["program exists"]
          setup_api_calls:
            - { call: "POST /rollout/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramDirector }
            - call: "POST /rollout/programs"
              payload: { name: "FY26 Rollout", fiscal_year: 2026, total_budget_cents: 500000000, contingency_pool_cents: 5000000 }
              as: ProgramDirector
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /rollout/drawing-sets"
              payload: { program_id: "${prog}", jurisdiction_code: "TX-DAL" }
              as: DesignManager
              captures: { rev1: $.data.revision }
            - call: "POST /rollout/drawing-sets"
              payload: { program_id: "${prog}", jurisdiction_code: "TX-DAL" }
              as: DesignManager
              captures: { rev2: $.data.revision }
            - call: "POST /rollout/drawing-sets"
              payload: { program_id: "${prog}", jurisdiction_code: "TX-FTW" }
              as: DesignManager
              captures: { rev3: $.data.revision }
          assert:
            - "first TX-DAL revision == 1"
            - "second TX-DAL revision == 2"
            - "first TX-FTW revision == 1"

      - name: c_permit_municipality_copied_from_site
        claim_type: system_fields
        grounds: [entities.Permit.fields.municipality_code]
        distinguishing_aspect: "Permit.municipality_code is copied from the site at creation, not taken from the request."
        test_recipe:
          setup: ["site in municipality TX-DAL with approved drawing set"]
          setup_api_calls:
            - { call: "POST /rollout/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramDirector }
            - call: "POST /rollout/programs"
              payload: { name: "FY26 Rollout", fiscal_year: 2026, total_budget_cents: 500000000, contingency_pool_cents: 5000000 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /rollout/markets"
              payload: { program_id: "${prog}", name: "DFW", state_code: "TX", max_concurrent_vendor_crews: 2 }
              as: ProgramDirector
              captures: { mkt: $.data.id }
            - call: "POST /rollout/municipality-profiles"
              payload: { municipality_code: "TX-DAL", statutory_review_days: 10, observed_avg_review_days: 20, permit_validity_days: 180, fee_base_cents: 50000, fee_per_sqft_cents: 250 }
              as: PermitCoordinator
            - call: "POST /rollout/sites"
              payload: { program_id: "${prog}", market_id: "${mkt}", municipality_code: "TX-DAL", address: "100 Main St", square_footage: 4000, phase_wave: 1, budget_allocation_cents: 10000000, target_open_date: "2026-09-01" }
              as: ProgramDirector
              captures: { site: $.data.id }
            - call: "POST /rollout/drawing-sets"
              payload: { program_id: "${prog}", jurisdiction_code: "TX-DAL" }
              as: DesignManager
              captures: { ds: $.data.id }
            - { call: "POST /rollout/drawing-sets/${ds}/submit", payload: {}, as: DesignManager }
            - { call: "POST /rollout/drawing-sets/${ds}/approve", payload: {}, as: DesignManager }
          trigger:
            - call: "POST /rollout/permits"
              payload: { site_id: "${site}", permit_type: "BUILDING", drawing_set_id: "${ds}" }
              as: PermitCoordinator
              captures: { muni: $.data.municipality_code, rnd: $.data.round_number, st: $.data.status }
          assert:
            - "Permit.municipality_code == TX-DAL"
            - "Permit.round_number == 1 and status == DRAFT"

      - name: c_turnover_readiness_snapshot_pinned
        claim_type: system_fields
        grounds: [entities.Turnover.fields.readiness_snapshot, state_machines.Site.PUNCH_to_TURNOVER]
        distinguishing_aspect: "The turnover request pins a readiness_snapshot capturing punch counts and readiness at request time (version pinning on approval artifact)."
        test_recipe:
          setup:
            - "site in PUNCH with one MINOR punch item still OPEN (critical count 0)"
          setup_api_calls:
            - { call: "POST /rollout/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramDirector }
            - call: "POST /rollout/programs"
              payload: { name: "FY26 Rollout", fiscal_year: 2026, total_budget_cents: 500000000, contingency_pool_cents: 5000000 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - { call: "POST /rollout/programs/${prog}/activate", payload: {}, as: ProgramDirector }
            - call: "POST /rollout/markets"
              payload: { program_id: "${prog}", name: "DFW", state_code: "TX", max_concurrent_vendor_crews: 2 }
              as: ProgramDirector
              captures: { mkt: $.data.id }
            - { call: "POST /rollout/municipality-profiles", payload: { municipality_code: "TX-DAL", statutory_review_days: 10, observed_avg_review_days: 20, permit_validity_days: 180, fee_base_cents: 50000, fee_per_sqft_cents: 250 }, as: PermitCoordinator }
            - call: "POST /rollout/sites"
              payload: { program_id: "${prog}", market_id: "${mkt}", municipality_code: "TX-DAL", address: "100 Main St", square_footage: 4000, phase_wave: 1, budget_allocation_cents: 10000000, target_open_date: "2026-09-01" }
              as: ProgramDirector
              captures: { site: $.data.id }
            - call: "POST /rollout/drawing-sets"
              payload: { program_id: "${prog}", jurisdiction_code: "TX-DAL" }
              as: DesignManager
              captures: { ds: $.data.id }
            - { call: "POST /rollout/drawing-sets/${ds}/submit", payload: {}, as: DesignManager }
            - { call: "POST /rollout/drawing-sets/${ds}/approve", payload: {}, as: DesignManager }
            - { call: "POST /rollout/sites/${site}/advance-design", payload: {}, as: DesignManager }
            - { call: "POST /rollout/sites/${site}/submit-design", payload: {}, as: DesignManager }
            - call: "POST /rollout/permits"
              payload: { site_id: "${site}", permit_type: "BUILDING", drawing_set_id: "${ds}" }
              as: PermitCoordinator
              captures: { perm: $.data.id }
            - { call: "POST /rollout/permits/${perm}/file", payload: {}, as: PermitCoordinator }
            - { call: "POST /rollout/permits/${perm}/start-review", payload: {}, as: PermitCoordinator }
            - { call: "POST /rollout/permits/${perm}/issue", payload: {}, as: PermitCoordinator }
            - { call: "POST /rollout/sites/${site}/mark-permitted", payload: {}, as: PermitCoordinator }
            - { call: "POST /rollout/markets/${mkt}/open-bidding", payload: {}, as: ProcurementLead }
            - call: "POST /rollout/bid-packages"
              payload: { market_id: "${mkt}", phase_wave: 1, scope_description: "Wave 1 GC", bid_open_at: "2026-05-01T00:00:00Z", bid_close_at: "2026-05-10T00:00:00Z", evaluation_mode: "LOWEST_PRICE", max_duration_days: 120 }
              as: ProcurementLead
              captures: { pkg: $.data.id }
            - { call: "POST /rollout/bid-packages/${pkg}/open", payload: {}, as: ProcurementLead }
            - call: "POST /rollout/contractors"
              payload: { legal_name: "GC One LLC", license_no: "GC-100", license_state: "TX" }
              as: ProcurementLead
              captures: { gc1: $.data.id }
            - call: "POST /rollout/bids"
              payload: { bid_package_id: "${pkg}", contractor_id: "${gc1}", amount_cents: 9000000, duration_days: 90, tech_score: 80 }
              as: GCVendor
              as_user_id: "${gc1}"
            - { call: "POST /rollout/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: ProgramDirector }
            - { call: "POST /rollout/bid-packages/${pkg}/close", payload: {}, as: ProcurementLead }
            - { call: "POST /rollout/bid-packages/${pkg}/award", payload: {}, as: ProcurementLead }
            - { call: "POST /rollout/sites/${site}/start-build", payload: {}, as: SiteSuperintendent }
            - call: "POST /rollout/vendor-mobilizations"
              payload: { site_id: "${site}", vendor_type: "FIXTURE", vendor_name: "Fixtures R Us", planned_start_on: "2026-05-11", planned_end_on: "2026-05-12" }
              as: SiteSuperintendent
              captures: { vfix: $.data.id }
            - { call: "POST /rollout/vendor-mobilizations/${vfix}/schedule", payload: {}, as: SiteSuperintendent }
            - { call: "POST /rollout/_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T00:00:00Z" }, as: ProgramDirector }
            - { call: "POST /rollout/vendor-mobilizations/${vfix}/arrive", payload: {}, as: SiteSuperintendent }
            - { call: "POST /rollout/vendor-mobilizations/${vfix}/complete", payload: {}, as: SiteSuperintendent }
            - call: "POST /rollout/vendor-mobilizations"
              payload: { site_id: "${site}", vendor_type: "IT", vendor_name: "NetCabling Co", planned_start_on: "2026-05-12", planned_end_on: "2026-05-13" }
              as: SiteSuperintendent
              captures: { vit: $.data.id }
            - { call: "POST /rollout/vendor-mobilizations/${vit}/schedule", payload: {}, as: SiteSuperintendent }
            - { call: "POST /rollout/_clock/set_current_utc", payload: { to_iso8601: "2026-05-12T00:00:00Z" }, as: ProgramDirector }
            - { call: "POST /rollout/vendor-mobilizations/${vit}/arrive", payload: {}, as: SiteSuperintendent }
            - { call: "POST /rollout/vendor-mobilizations/${vit}/complete", payload: {}, as: SiteSuperintendent }
            - call: "POST /rollout/vendor-mobilizations"
              payload: { site_id: "${site}", vendor_type: "SIGNAGE", vendor_name: "SignPros", planned_start_on: "2026-05-13", planned_end_on: "2026-05-14" }
              as: SiteSuperintendent
              captures: { vsig: $.data.id }
            - { call: "POST /rollout/vendor-mobilizations/${vsig}/schedule", payload: {}, as: SiteSuperintendent }
            - { call: "POST /rollout/_clock/set_current_utc", payload: { to_iso8601: "2026-05-13T00:00:00Z" }, as: ProgramDirector }
            - { call: "POST /rollout/vendor-mobilizations/${vsig}/arrive", payload: {}, as: SiteSuperintendent }
            - { call: "POST /rollout/vendor-mobilizations/${vsig}/complete", payload: {}, as: SiteSuperintendent }
            - { call: "POST /rollout/punch-items", payload: { site_id: "${site}", description: "Paint touch-up", severity: "MINOR" }, as: SiteSuperintendent }
          trigger:
            - call: "POST /rollout/turnovers"
              payload: { site_id: "${site}" }
              as: SiteSuperintendent
              captures: { to: $.data.id, snap: $.data.readiness_snapshot }
          assert:
            - "Turnover.${to}.readiness_snapshot.punch_open_critical_count == 0"
            - "Turnover.${to}.readiness_snapshot.punch_open_total_count == 1"
            - "Turnover.${to}.readiness_snapshot.readiness_posture == SIGNAGE_HUNG"
            - "Site.${site}.status == TURNOVER"

      - name: c_bid_is_responsive_computed
        claim_type: computed_fields
        grounds: [entities.Bid.fields.is_responsive]
        excluded_because:
          difficulty_instance: best_value_responsiveness_filter_nested_min
          rationale: "is_responsive == false for the 150-day bid is asserted there."

  # =============================================================
  - section: state_machines
    instances:
      - name: c_site_open_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Site, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "Once OPEN, every further transition (here remove) is rejected with ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["site fully turned over and OPEN"]
          setup_api_calls:
            - { call: "POST /rollout/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramDirector }
            - call: "POST /rollout/programs"
