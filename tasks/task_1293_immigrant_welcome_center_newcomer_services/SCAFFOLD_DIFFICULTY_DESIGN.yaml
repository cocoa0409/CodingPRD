              as: IntakeSpecialist
              captures: { clib_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Lena C", preferred_language: "es", date_of_birth: "1990-01-03", household_size: 1 }
              as: IntakeSpecialist
              captures: { clic_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${clia_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { casea_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${clib_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { caseb_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${clic_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { casec_id: $.data.id }
          trigger:
            - call: "POST /workshop-enrollments"
              payload: { session_id: "${sess_id}", case_id: "${casea_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { ea_stat: $.data.status }
            - call: "POST /workshop-enrollments"
              payload: { session_id: "${sess_id}", case_id: "${caseb_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { eb_stat: $.data.status }
            - call: "POST /workshop-enrollments"
              payload: { session_id: "${sess_id}", case_id: "${casec_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { ec_stat: $.data.status, ec_pos: $.data.waitlist_position }
            - call: "GET /workshop-sessions/${sess_id}"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { s_enr: $.data.enrolled_count, s_wait: $.data.waitlist_count, s_open: $.data.open_seats }
          assert:
            - "Enrollment A (count was 0): status ENROLLED"
            - "Enrollment B (count was 1 == capacity-1): status ENROLLED (boundary is >=, so capacity-1 still fits)"
            - "Enrollment C (count was 2 == capacity): status WAITLISTED with waitlist_position == 1"
            - "Session: enrolled_count == 2, waitlist_count == 1, open_seats == 0"

      - name: benefits_tier_inclusive_boundary_at_138pct_fpl
        grounds:
          - calculations.benefits_tiering
          - entities.BenefitScreening.fields.tier
        distinguishing_aspect: |
          Metric: income in integer cents against floor(FPL*138/100). Exactly 2,820,720 cents is
          TIER_A (inclusive <=) and 2,820,820 (+100 cents) is TIER_B — a threshold boundary on
