        distinguishing_aspect: |
          Mode (c): an interdependent formula where the tier depends on the total and the
          bonus depends on the tier, so the evaluation order is pinned in four steps and the
          tier is never re-derived. GOOD standing on seed 1 gives provisional 330000, which
          is in the SILVER band; the SILVER rate 0.12 yields a 39600 bonus and a final
          369600 that sits inside the GOLD band — award_tier must STAY SILVER. Re-deriving
          the tier from the final total (or recomputing the bonus at the GOLD rate) is the
          trap this instance detects. It differs from both siblings: mode (a) is a sequential
          ladder and mode (b) is a bucketed waterfall, whereas this one is circularly
          dependent and resolved by a pinned step order.
