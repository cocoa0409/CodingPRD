              captures: { d2_id: $.data.id }
            - call: "POST /stores/${st_id}/service-orders"
              payload: { boat_unit_id: "${bu1_id}", order_kind: "RIGGING", promised_lead_days: 5, deal_id: "${d1_id}", boat_deal_id: "${d1_id}" }
              as: ServiceWriter
              captures: { so1_id: $.data.id }
          trigger:
            - call: "POST /stores/${st_id}/service-orders"
              payload: { boat_unit_id: "${bu1_id}", order_kind: "RIGGING", promised_lead_days: 5, deal_id: "${d1_id}", boat_deal_id: "${d1_id}" }
              as: ServiceWriter
              captures: { err: $.data.error_id }
            - call: "POST /stores/${st_id}/service-orders"
