  - section: rbac
    instances:
      - name: rbac_customer_cannot_confirm_order
        claim_type: rbac_denial
        grounds:
          - roles[OperationsManager]
          - roles[Customer]
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "Approval-chain step ownership: confirm is OperationsManager-exclusive; the ordering Customer (even the owner) gets 403 — the role check precedes any state check."
        test_recipe:
          setup: ["Order SUBMITTED by its customer"]
          setup_api_calls:
            - { call: "POST /species", payload: { species_code: "COD", common_name: "Atlantic Cod", labeling_name: "Cod", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30 }, as: OperationsManager, captures: { sp_id: $.data.id, sp_v: $.data.version } }
