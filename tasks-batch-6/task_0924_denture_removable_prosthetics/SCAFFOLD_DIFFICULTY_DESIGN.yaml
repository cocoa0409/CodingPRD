              captures: { pat_id: $.data.id }
            - call: "POST /prosthetics/cases"
              payload: { patient_id: "${pat_id}", prosthesis_type: "FLEXIBLE_PARTIAL" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { case_id: $.data.id }
            - call: "POST /prosthetics/case-arches"
              payload: { case_id: "${case_id}", arch_position: "MAXILLARY" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { arch_id: $.data.id }
          trigger:
            - call: "POST /prosthetics/case-arches/${arch_id}/start-fabrication"
              payload: {}
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 409"
            - "${err} == ERR_CROSS_ENTITY_STATE"
            - "CaseArch.${arch_id}.arch_status == PLANNED"
            - "ProsthesisCase.${case_id}.case_status == INTAKE and fabrication_started_at is null"

      - name: remake_approve_requires_cited_warranty_claim_to_be_clinic_or_lab_fault
        grounds:
