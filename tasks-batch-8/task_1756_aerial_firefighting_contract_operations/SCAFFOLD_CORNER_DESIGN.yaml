scaffold_corner_design:
  - section: entities
    instances:
      - name: contract_creation_defaults_and_system_fields
        claim_type: creation_defaults
        grounds: ["entities.Contract.fields.min_daily_available_minutes", "entities.Contract.fields.status"]
        distinguishing_aspect: "Omitting min_daily_available_minutes applies the default 570; a fresh contract starts in DRAFT with version 1 and zeroed computed counters; client-supplied id/version in the body are ignored."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_status: $.data.status, c_min: $.data.min_daily_available_minutes, c_v: $.data.version, c_billed: $.data.season_billed_cents, c_hours: $.data.season_flight_hours_tenths } }
          trigger: []
          assert:
            - "Contract.status == DRAFT, version == 1, min_daily_available_minutes == 570 (default applied)"
            - "season_billed_cents == 0 and season_flight_hours_tenths == 0 at creation"

      - name: contract_invalid_enum_rejected
        claim_type: type_constraint
        grounds: ["entities.Contract.fields.contract_type", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "contract_type outside {EXCLUSIVE_USE, CALL_WHEN_NEEDED} is a 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-009", agency: "USFS", contract_type: "WET_LEASE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and HTTP status 400"

      - name: contract_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_CONTRACT_NOT_FOUND]"]
        distinguishing_aspect: "GET /contracts/{id} with a well-formed but unknown UUID returns 404 ERR_CONTRACT_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /contracts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: CarrierOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CONTRACT_NOT_FOUND and HTTP status 404"

      - name: availability_period_missing_required_field
        claim_type: required_fields
        grounds: ["entities.AvailabilityPeriod.fields.service_date", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST availability-periods without service_date is rejected 400 before any state/business check."
        test_recipe:
          setup: ["EU contract ACTIVE with one aircraft"]
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /aircraft", payload: { tail_number: "N100AF", model: "AT-802F", tank_capacity_gallons: 800, contract_id: "${c_id}" }, as: CarrierOps, captures: { ac_id: $.data.id } }
          trigger:
            - { call: "POST /contracts/${c_id}/availability-periods", payload: { aircraft_id: "${ac_id}", available_start: "2026-08-03T07:00:00Z", available_end: "2026-08-03T16:30:00Z" }, as: CarrierOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and HTTP status 400"

      - name: aircraft_create_system_field_input_ignored
        claim_type: system_fields
        grounds: ["entities.Aircraft.fields.carding_status"]
        distinguishing_aspect: "Passing carding_status: CARDED in the create body is ignored — the aircraft is created UNCARDED because carding is system-managed via inspections only."
        test_recipe:
          setup: ["EU contract ACTIVE"]
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
          trigger:
            - { call: "POST /aircraft", payload: { tail_number: "N100AF", model: "AT-802F", tank_capacity_gallons: 800, contract_id: "${c_id}", carding_status: "CARDED" }, as: CarrierOps, captures: { ac_st: $.data.carding_status } }
          assert:
            - "Aircraft.carding_status == UNCARDED despite the input claiming CARDED"

      - name: availability_period_unique_aircraft_date
        claim_type: uniqueness_constraint
        grounds: ["errors[ERR_AVAILABILITY_OVERLAP]", "validations[priority=9]"]
        distinguishing_aspect: "A second AvailabilityPeriod for the same (aircraft_id, service_date) is rejected with ERR_AVAILABILITY_OVERLAP regardless of the first period's status."
        test_recipe:
          setup: ["EU contract ACTIVE; one aircraft; one CONFIRMED period on 2026-08-03"]
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /aircraft", payload: { tail_number: "N100AF", model: "AT-802F", tank_capacity_gallons: 800, contract_id: "${c_id}" }, as: CarrierOps, captures: { ac_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/availability-periods", payload: { aircraft_id: "${ac_id}", service_date: "2026-08-03", available_start: "2026-08-03T07:00:00Z", available_end: "2026-08-03T16:30:00Z" }, as: CarrierOps }
          trigger:
            - { call: "POST /contracts/${c_id}/availability-periods", payload: { aircraft_id: "${ac_id}", service_date: "2026-08-03", available_start: "2026-08-03T08:00:00Z", available_end: "2026-08-03T12:00:00Z" }, as: CarrierOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_AVAILABILITY_OVERLAP and HTTP status 409"

      - name: fk_reverse_reachability_contract_availability
        claim_type: parent_relationship
        grounds: ["entities.AvailabilityPeriod.fields.contract_id"]
        distinguishing_aspect: "GET /contracts/{id}/availability-periods returns exactly the periods created under that contract as an array with pagination fields."
        test_recipe:
          setup: ["EU contract ACTIVE with one aircraft and two availability periods"]
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /aircraft", payload: { tail_number: "N100AF", model: "AT-802F", tank_capacity_gallons: 800, contract_id: "${c_id}" }, as: CarrierOps, captures: { ac_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/availability-periods", payload: { aircraft_id: "${ac_id}", service_date: "2026-08-03", available_start: "2026-08-03T07:00:00Z", available_end: "2026-08-03T16:30:00Z" }, as: CarrierOps }
            - { call: "POST /contracts/${c_id}/availability-periods", payload: { aircraft_id: "${ac_id}", service_date: "2026-08-04", available_start: "2026-08-04T07:00:00Z", available_end: "2026-08-04T16:30:00Z" }, as: CarrierOps }
          trigger:
            - { call: "GET /contracts/${c_id}/availability-periods", as: CarrierOps, captures: { first_id: "$.data[0].id" } }
          assert:
            - "response_type == array, total_count == 2, has_more == false, and both returned periods carry contract_id == ${c_id}"

      - name: crew_member_list_pagination
        claim_type: listing
        grounds: ["response_envelope.pagination_defaults"]
        distinguishing_aspect: "GET /crew-members honors limit/offset: with 3 members, limit=2 returns 2 items with total_count 3 and has_more true; offset=2 returns the last one with has_more false."
        test_recipe:
          setup: ["EU contract ACTIVE with three crew members"]
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /crew-members", payload: { full_name: "Pat Reed", crew_role: "PIC", contract_id: "${c_id}", qualified_aircraft_models: ["AT-802F"] }, as: CarrierOps }
            - { call: "POST /crew-members", payload: { full_name: "Sam Ortiz", crew_role: "PIC", contract_id: "${c_id}", qualified_aircraft_models: ["AT-802F"] }, as: CarrierOps }
            - { call: "POST /crew-members", payload: { full_name: "Lee Chan", crew_role: "SIC", contract_id: "${c_id}", qualified_aircraft_models: [] }, as: CarrierOps }
          trigger:
            - { call: "GET /crew-members?limit=2", as: CarrierOps }
            - { call: "GET /crew-members?limit=2&offset=2", as: CarrierOps }
          assert:
            - "First page: 2 items, total_count == 3, has_more == true"
            - "Second page (offset 2): 1 item, total_count == 3, has_more == false"

  - section: state_machines
    instances:
      - name: contract_initial_state_and_activate
        claim_type: valid_transition
        grounds: ["state_machines.Contract.DRAFT_to_ACTIVE"]
        distinguishing_aspect: "New contract starts DRAFT; activate moves it ACTIVE and bumps version 1 -> 2."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id, st0: $.data.status } }
          trigger:
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps, captures: { st1: $.data.status, v1: $.data.version } }
          assert:
            - "initial status == DRAFT; after activate status == ACTIVE and version == 2"

      - name: contract_resume_from_active_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Contract.SUSPENDED_to_ACTIVE", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "resume is only legal from SUSPENDED; calling it on an ACTIVE contract fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["EU contract ACTIVE"]
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
          trigger:
            - { call: "POST /contracts/${c_id}/resume", payload: {}, as: CarrierOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE and status remains ACTIVE"

      - name: closed_contract_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: ["state_machines.Contract.ACTIVE_to_CLOSED", "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "CLOSED is terminal: suspend on a closed contract fails with ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["EU contract ACTIVE with no dispatch orders"]
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /contracts/${c_id}/close", payload: {}, as: CarrierOps, captures: { st: $.data.status } }
          trigger:
            - { call: "POST /contracts/${c_id}/suspend", payload: {}, as: CarrierOps, captures: { err: $.data.error_id } }
          assert:
            - "close succeeded (status CLOSED); suspend afterwards fails with ERR_ALREADY_TERMINAL (409)"

      - name: dispatch_filled_auto_transitions_compound
        claim_type: compound_state
        grounds: ["state_machines.DispatchOrder", "calculations.filled_count_invariant"]
        excluded_because:
          difficulty_instance: assignment_create_release_conserve_filled_count
          rationale: "The ACCEPTED -> PARTIALLY_FILLED -> FILLED -> PARTIALLY_FILLED -> ACCEPTED bubble-up chain is asserted step-by-step in that §1.8 instance."

      - name: retardant_drop_from_requested_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.RetardantLoad.LOADED_to_DROPPED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "drop is only legal from LOADED; dropping a still-REQUESTED load fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["EU contract ACTIVE; carded aircraft+pilot; order qty 1 ACCEPTED; assignment ON_INCIDENT; one load REQUESTED"]
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /aircraft", payload: { tail_number: "N100AF", model: "AT-802F", tank_capacity_gallons: 800, contract_id: "${c_id}" }, as: CarrierOps, captures: { ac_id: $.data.id } }
            - { call: "POST /crew-members", payload: { full_name: "Pat Reed", crew_role: "PIC", contract_id: "${c_id}", qualified_aircraft_models: ["AT-802F"] }, as: CarrierOps, captures: { p_id: $.data.id } }
            - { call: "POST /carding-inspections", payload: { subject_aircraft_id: "${ac_id}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_ac: $.data.id } }
            - { call: "POST /carding-inspections/${i_ac}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /carding-inspections", payload: { subject_crew_member_id: "${p_id}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_pl: $.data.id } }
            - { call: "POST /carding-inspections/${i_pl}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /incidents", payload: { incident_number: "USFS-2026-0801", name: "Ridge Fire", location: "39.5,-121.5", agency: "USFS", priority: "EXTENDED_ATTACK" }, as: AgencyDispatcher, captures: { inc_id: $.data.id } }
            - { call: "POST /dispatch-orders", payload: { order_number: "O-1001", contract_id: "${c_id}", incident_id: "${inc_id}", aircraft_quantity: 1 }, as: AgencyDispatcher, captures: { do_id: $.data.id } }
            - { call: "POST /dispatch-orders/${do_id}/accept", payload: {}, as: CarrierOps }
            - { call: "GET /dispatch-orders/${do_id}", as: CarrierOps, captures: { do_v: $.data.version } }
            - { call: "POST /dispatch-orders/${do_id}/assignments", payload: { aircraft_id: "${ac_id}", pilot_id: "${p_id}", planned_start: "2026-08-02T08:00:00Z", planned_end: "2026-08-02T10:00:00Z", expected_dispatch_order_version: "${do_v}" }, as: CarrierOps, captures: { a_id: $.data.id } }
            - { call: "POST /assignments/${a_id}/launch", payload: {}, as: Pilot, as_user_id: "${p_id}" }
            - { call: "POST /assignments/${a_id}/arrive", payload: {}, as: Pilot, as_user_id: "${p_id}" }
            - { call: "POST /assignments/${a_id}/retardant-loads", payload: { gallons: 700, requested_at: "2026-08-02T10:00:00Z" }, as: CarrierOps, captures: { l_id: $.data.id } }
          trigger:
            - { call: "POST /retardant-loads/${l_id}/drop", payload: { dropped_at: "2026-08-02T11:00:00Z" }, as: CarrierOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE and the load remains REQUESTED"

      - name: assignment_happy_path_walk_and_order_autoclose
        claim_type: valid_transition
        grounds: ["state_machines.Assignment", "state_machines.DispatchOrder.FILLED_to_CLOSED"]
        distinguishing_aspect: "Full forward walk ASSIGNED -> EN_ROUTE -> ON_INCIDENT -> RELEASED -> DEMOBILIZED stamps each timestamp, and demobilizing the order's last assignment auto-closes the order (FILLED -> ACCEPTED on release, then ACCEPTED -> CLOSED on demobilize)."
        test_recipe:
          setup: ["EU contract ACTIVE; carded aircraft+pilot; order qty 1 ACCEPTED; assignment ASSIGNED"]
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /aircraft", payload: { tail_number: "N100AF", model: "AT-802F", tank_capacity_gallons: 800, contract_id: "${c_id}" }, as: CarrierOps, captures: { ac_id: $.data.id } }
            - { call: "POST /crew-members", payload: { full_name: "Pat Reed", crew_role: "PIC", contract_id: "${c_id}", qualified_aircraft_models: ["AT-802F"] }, as: CarrierOps, captures: { p_id: $.data.id } }
            - { call: "POST /carding-inspections", payload: { subject_aircraft_id: "${ac_id}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_ac: $.data.id } }
            - { call: "POST /carding-inspections/${i_ac}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /carding-inspections", payload: { subject_crew_member_id: "${p_id}", scheduled_for: "2026-07-15T08:00:00Z", valid_days: 365 }, as: CardingInspector, captures: { i_pl: $.data.id } }
            - { call: "POST /carding-inspections/${i_pl}/complete", payload: { result: "PASSED", completed_at: "2026-07-15T09:00:00Z" }, as: CardingInspector }
            - { call: "POST /incidents", payload: { incident_number: "USFS-2026-0801", name: "Ridge Fire", location: "39.5,-121.5", agency: "USFS", priority: "EXTENDED_ATTACK" }, as: AgencyDispatcher, captures: { inc_id: $.data.id } }
            - { call: "POST /dispatch-orders", payload: { order_number: "O-1001", contract_id: "${c_id}", incident_id: "${inc_id}", aircraft_quantity: 1 }, as: AgencyDispatcher, captures: { do_id: $.data.id } }
            - { call: "POST /dispatch-orders/${do_id}/accept", payload: {}, as: CarrierOps }
            - { call: "GET /dispatch-orders/${do_id}", as: CarrierOps, captures: { do_v: $.data.version } }
            - { call: "POST /dispatch-orders/${do_id}/assignments", payload: { aircraft_id: "${ac_id}", pilot_id: "${p_id}", planned_start: "2026-08-02T08:00:00Z", planned_end: "2026-08-02T10:00:00Z", expected_dispatch_order_version: "${do_v}" }, as: CarrierOps, captures: { a_id: $.data.id } }
          trigger:
            - { call: "POST /assignments/${a_id}/launch", payload: {}, as: Pilot, as_user_id: "${p_id}", captures: { st1: $.data.status } }
            - { call: "POST /assignments/${a_id}/arrive", payload: {}, as: Pilot, as_user_id: "${p_id}", captures: { st2: $.data.status } }
            - { call: "POST /assignments/${a_id}/release", payload: { release_reason: "AGENCY" }, as: AgencyDispatcher, captures: { st3: $.data.status, rr: $.data.release_reason } }
            - { call: "POST /assignments/${a_id}/demobilize", payload: {}, as: CarrierOps, captures: { st4: $.data.status } }
            - { call: "GET /dispatch-orders/${do_id}", as: CarrierOps, captures: { do_st: $.data.status } }
          assert:
            - "status walk: EN_ROUTE -> ON_INCIDENT -> RELEASED -> DEMOBILIZED, release_reason == AGENCY"
            - "launched_at/arrived_at/released_at/demobilized_at all non-null and equal to the logical clock instant"
            - "DispatchOrder auto-transitioned to CLOSED once its only assignment reached DEMOBILIZED"

      - name: invoice_paid_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: ["state_machines.Invoice.RECONCILED_to_PAID", "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "PAID is terminal: disputing a paid invoice fails with ERR_ALREADY_TERMINAL; reaching PAID requires the full DRAFT -> SUBMITTED -> RECONCILED -> PAID walk with a matching agency record (50 == 50 tenths, within tolerance)."
        test_recipe:
          setup: ["EU contract ACTIVE; carded aircraft+pilot; one ON_INCIDENT assignment with a 5.0 h log on 2026-08-02; invoice 2026-08-02..2026-08-02 submitted; agency record 50 tenths imported"]
          setup_api_calls:
            - { call: "POST /contracts", payload: { contract_number: "EU-2026-001", agency: "USFS", contract_type: "EXCLUSIVE_USE", daily_availability_rate_cents: 500000, flight_hour_rate_cents: 300000, season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_flight_hour_cap_tenths: 20000, acceptance_window_minutes: 30 }, as: CarrierOps, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: CarrierOps }
            - { call: "POST /aircraft", payload: { tail_number: "N100AF", model: "AT-802F", tank_capacity_gallons: 800, contract_id: "${c_id}" }, as: CarrierOps, captures: { ac_id: $.data.id } }
