  # ===========================================================================
  # Rule 6 — boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: low_confidence_sampling_threshold_89_vs_90
        grounds:
          - state_machines.NoteDraft.IN_REVIEW_to_ATTESTED
          - entities.NoteTemplate.fields.low_confidence_threshold
          - calculations.note_completeness_score
        distinguishing_aspect: |
          Metric: completeness_at_attestation vs the template's
          low_confidence_threshold (90). 89 (strictly below) auto-queues a
          LOW_CONFIDENCE QASample; 90 (exactly equal) does not — exercised via
          the attest endpoint.
        test_recipe:
          setup:
            - "Template T1 (multiplier 1.1, threshold 90) with CRITICAL+MAJOR required fields; note A attested with only chief filled -> completeness 100-round_half_up(10*1.1)=89"
            - "Template T2 (multiplier 1.0, threshold 90) same fields; note B attested with only chief filled -> completeness 90"
          setup_api_calls:
            - call: "POST /ambient-clinical-documentation/patients"
              payload: { mrn: "MRN-BP1-1", full_name: "Pat Bp1" }
              as: PlatformAdmin
              captures: { pat: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/physicians"
              payload: { npi: "NPI-BP1-1", full_name: "Doc Bp1", specialty_code: "CARD" }
