            - "${ncp_a_cbr} == true  # the CREDIT_BUREAU_REPORT flag, not license_suspension_active or lien_recorded"
            - "${case_a_posture} == ESCALATED"

      - name: an_active_remedy_drives_a_registered_referral_to_enforcing
        claim_type: cross_entity
        grounds:
          - "state_machines.InterstateReferral"
          - "state_machines.EnforcementAction"
          - "entities.SupportCase.fields.interstate_role"
          - "endpoints[POST /child-support/interstate-referrals/{interstate_referral_id}/registration]"
          - "endpoints[POST /child-support/enforcement-actions/{enforcement_action_id}/release]"
          - "endpoints[POST /child-support/interstate-referrals/{interstate_referral_id}/return]"
        distinguishing_aspect: >
          The REGISTERED -> ENFORCING transition has no endpoint of its own: it
          fires as a side effect of an EnforcementAction on the SAME case reaching
          ACTIVE, and only for a referral whose transmittal_type is ENFORCEMENT —
          then releasing the remedy drops the case posture back to NORMAL and lets
          the referral be returned.
        test_recipe:
          setup:
            - "DIRECT_APPLICATION case with PRESUMED_MARITAL paternity and one ENTERED CURRENT_SUPPORT order whose origin_state_code is WI, effective 2026-08-01, monthly 75000."
            - "Two OPEN 75000 charges due 2026-08-15 and 2026-09-15, clock at 2026-11-01, certified arrears 151125."
            - "A RESPONDING ENFORCEMENT referral for WI registered at 2026-11-01, so the case's interstate_role is RESPONDING and the referral's controlling_order_state_code is WI."
            - "A CREDIT_BUREAU_REPORT action was noticed at 2026-11-01 with contest_deadline_at 2026-12-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Dana Ruiz", ssn_last4: "5353", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cp_id: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Alex Ruiz", ssn_last4: "5454", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncp_id: "$.data.id" }
            - call: "POST /child-support/participants/${ncp_id}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { case_id: "$.data.id" }
            - call: "POST /child-support/cases/${case_id}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
              captures: { pa_id: "$.data.id" }
            - call: "POST /child-support/cases/${case_id}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "WI", effective_date: "2026-08-01" }
              as: CaseWorker
              captures: { order_id: "$.data.id" }
            - call: "POST /child-support/orders/${order_id}/guideline-calculation"
              payload: {}
              as: CaseWorker
              captures: { g1: "$.data.guideline_monthly_cents" }
            - call: "POST /child-support/orders/${order_id}/entry"
              payload: {}
              as: SupervisingAttorney
              captures: { m1: "$.data.monthly_obligation_cents" }
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-08-01", period_end_date: "2026-09-01", due_date: "2026-08-15" }
              as: FinanceOfficer
              captures: { ch1: "$.data.id" }
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-09-01", period_end_date: "2026-10-01", due_date: "2026-09-15" }
              as: FinanceOfficer
              captures: { ch2: "$.data.id" }
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/cases/${case_id}/interstate-referrals"
              payload: { direction: "RESPONDING", other_state_code: "WI", child_home_state_code: "WI", transmittal_type: "ENFORCEMENT" }
              as: InterstateLiaison
              captures: { ref_id: "$.data.id" }
            - call: "POST /child-support/interstate-referrals/${ref_id}/registration"
              payload: {}
              as: InterstateLiaison
              captures: { r_status: "$.data.status", r_at: "$.data.registered_at", r_coid: "$.data.controlling_order_id", r_cstate: "$.data.controlling_order_state_code" }
            - call: "POST /child-support/cases/${case_id}/enforcement-actions"
              payload: { action_type: "CREDIT_BUREAU_REPORT" }
              as: CaseWorker
              captures: { act_id: "$.data.id" }
            - call: "POST /child-support/enforcement-actions/${act_id}/notice"
              payload: {}
              as: CaseWorker
              captures: { a_deadline: "$.data.contest_deadline_at" }
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-02T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /child-support/interstate-referrals/${ref_id}"
              as: InterstateLiaison
              captures: { before_ref: "$.data.status" }
            - call: "POST /child-support/enforcement-actions/${act_id}/activation"
              payload: {}
              as: CaseWorker
              captures: { a_status: "$.data.status" }
            - call: "GET /child-support/interstate-referrals/${ref_id}"
              as: InterstateLiaison
              captures: { after_ref: "$.data.status" }
            - call: "GET /child-support/cases/${case_id}"
              as: CaseWorker
              captures: { posture1: "$.data.enforcement_posture", role1: "$.data.interstate_role" }
            - call: "POST /child-support/enforcement-actions/${act_id}/release"
              payload: { release_reason: "PLAN_COMPLIANT" }
              as: SupervisingAttorney
              captures: { rel_status: "$.data.status", rel_at: "$.data.released_at", rel_remedy: "$.data.remedy_applied" }
            - call: "GET /child-support/participants/${ncp_id}"
              as: CaseWorker
              captures: { cbr: "$.data.credit_bureau_reported" }
            - call: "POST /child-support/interstate-referrals/${ref_id}/return"
              payload: { returned_reason: "INSUFFICIENT_INFO" }
              as: InterstateLiaison
              captures: { ret_status: "$.data.status" }
            - call: "GET /child-support/cases/${case_id}"
              as: CaseWorker
              captures: { posture2: "$.data.enforcement_posture", role2: "$.data.interstate_role" }
          assert:
            - "${r_status} == REGISTERED, ${r_at} == 2026-11-01T00:00:00Z"
            - "${r_coid} == ${order_id} and ${r_cstate} == WI  # child_home_state_code is WI and the sole ENTERED CURRENT_SUPPORT order has origin_state_code WI, so home_orders is non-empty and the greatest-effective_date branch selects it"
            - "${a_deadline} == 2026-12-01T00:00:00Z"
            - "${before_ref} == REGISTERED  # noticing the action did not move the referral"
            - "${a_status} == ACTIVE"
            - "${after_ref} == ENFORCING  # driven purely by the sibling EnforcementAction reaching ACTIVE"
            - "${posture1} == ESCALATED and ${role1} == RESPONDING"
            - "${rel_status} == RELEASED, ${rel_at} == 2026-12-02T00:00:00Z, ${rel_remedy} == false"
            - "${cbr} == false  # the participant flag is cleared because no other ACTIVE action of this action_type remains"
            - "${ret_status} == RETURNED  # ENFORCING -> RETURNED is legal once no ACTIVE action remains"
            - "${posture2} == NORMAL and ${role2} == NONE"

      - name: the_final_installment_completes_the_offer_and_lifts_the_stay
        claim_type: side_effect_execution
        grounds:
          - "state_machines.CompromiseOffer"
          - "calculations.compromise_settlement_amount"
          - "endpoints[POST /child-support/cases/{case_id}/compromise-offers]"
          - "endpoints[POST /child-support/compromise-offers/{compromise_offer_id}/acceptance]"
          - "endpoints[POST /child-support/cases/{case_id}/payments]"
          - "validations[priority 47]"
          - "validations[priority 10]"
          - "errors[ERR_PAYMENT_BELOW_INSTALLMENT]"
          - "errors[ERR_INVALID_OFFER_STATUS]"
        distinguishing_aspect: >
          The three installment payments walk ACCEPTED -> ACTIVE -> ACTIVE ->
          COMPLETED with compliance_payment_count 1, 2, 3 and
          next_installment_due_date advancing a month each time, and only the last
          one carries the odd remainder cent: 50468 is enough for installments 1 and
          2 but the final gate is 50470, and completion flips the case posture
          STAYED -> NORMAL and zeroes the arrears.
        test_recipe:
          setup:
            - "Non-TANF DIRECT_APPLICATION case, PRESUMED_MARITAL paternity, ENTERED CURRENT_SUPPORT order at 75000 effective 2026-08-01."
            - "Two OPEN 75000 charges due 2026-08-15 and 2026-09-15; clock 2026-11-01, so arrears_principal_cents is 150000 and the aggregate interest receivable is 1875."
            - "The NCP's compromise_risk_tier is MEDIUM (score 44), which clears the not-HIGH gate."
            - "A 3-installment offer was created and accepted by the NCP at 2026-11-01: pre_waiver_total 151875, tier 0.25, waiver 469, settlement 151406, monthly 50468, final 50470, next_installment_due_date 2026-12-01, case posture STAYED."
