        distinguishing_aspect: |
          Three different temporal frames in one probe. Period windows are CLOSED, so a new period
          starting exactly on the incumbent's window_end shares that day and is refused. A cycle must
          be contained in its parent period, so a December cycle under a period ending 2026-11-30 is
          refused. And a cycle cannot be run before its own window_start even though the cycle itself
          is perfectly legal - the clock is still 2026-09-01.
