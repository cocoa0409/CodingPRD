  - rule_id: non_linear_state_machine
    instances:
      - name: blend_order_parallel_payment_fulfillment_dims
        grounds:
          - state_machines.BlendOrder
          - entities.BlendOrder.fields.fulfillment_status
          - entities.BlendOrder.fields.payment_status
        distinguishing_aspect: |
          BlendOrder carries two INDEPENDENT state dimensions on one row:
          fulfillment_status cycles BOOKED -> QUOTED -> BOOKED -> SCHEDULED ->
          BOOKED (via requote and batch void) while payment_status independently
          moves UNPAID -> CREDIT_APPROVED -> UNPAID -> CREDIT_APPROVED; the batch
          create gate reads BOTH dims (fulfillment BOOKED AND payment IN
          {PREPAY_APPLIED, CREDIT_APPROVED}).
        test_recipe:
          setup:
            - "Grower limit 10000000, 50-ac field, APPROVED rec, APPROVED NMP cap 300, UREA sheet 52000, storage permit + 20t UREA lot, BLENDER_SITE permit, blender"
            - "Urea-only order (348.1 lb/ac, 50 ac) created QUOTED/UNPAID"
