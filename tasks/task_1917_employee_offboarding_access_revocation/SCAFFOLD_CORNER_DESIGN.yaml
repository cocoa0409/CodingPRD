              as_user_id: "hr-approver-1"
            - call: "POST /offboarding/asset-return-items"
              payload: { offboarding_case_id: "${case_occ3}", asset_tag: "L9", asset_kind: "LAPTOP", replacement_cost_cents: 200000, issued_date: "2026-01-01T00:00:00Z" }
              as: AssetClerk
              captures: { item_occ3: $.data.id, item_occ3_v: $.data.version }
            - call: "POST /offboarding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /offboarding/asset-return-items/${item_occ3}/record-return"
              payload: { condition_on_return: "GOOD", expected_asset_return_item_version: "${item_occ3_v}" }
              as: AssetClerk
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 412; error_id == ERR_STALE_ASSET_VERSION (scheduler's OVERDUE flip bumped version between capture and write)"
      - name: clock_default_is_fixed_start_time
        claim_type: satisfaction_pass
        grounds: ["endpoints[POST /offboarding/_clock/set_current_utc]"]
        distinguishing_aspect: "Before any set call, the logical clock reads exactly 2026-08-01T00:00:00Z (no wall-clock fallback)."
        test_recipe:
          setup: ["empty DB; no clock set yet"]
          setup_api_calls: []
          trigger:
            - call: "GET /offboarding/_clock/current_utc"
              payload: {}
              as: PlatformAdmin
              captures: { now: $.data.current_utc }
          assert:
            - "current_utc == 2026-08-01T00:00:00Z"
      - name: scheduled_overdue_flip_by_clock
        claim_type: side_effect_execution
        grounds: ["state_machines.AssetReturnItem.TRACKED_to_OVERDUE", "complexity_profile.complexity_layers[scheduled_deferred_actions]"]
        distinguishing_aspect: "Scheduler fires on clock advance: TRACKED asset with return_due_at < current_utc becomes OVERDUE without any direct API write to the item."
        test_recipe:
          setup: ["CA case approved; asset TRACKED; clock advanced past return_due_at (DL+3d = 2026-08-13)"]
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-SCH1", case_type: "RESIGNATION", work_state_code: "CA", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-10T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_sch1: $.data.id }
            - call: "POST /offboarding/offboarding-cases/${case_sch1}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-approver-1"
            - call: "POST /offboarding/asset-return-items"
              payload: { offboarding_case_id: "${case_sch1}", asset_tag: "M1", asset_kind: "MONITOR", replacement_cost_cents: 30000, issued_date: "2026-01-01T00:00:00Z" }
              as: AssetClerk
              captures: { item_sch1: $.data.id }
          trigger:
            - call: "POST /offboarding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /offboarding/asset-return-items/${item_sch1}"
              payload: {}
              as: AssetClerk
              captures: { item_status: $.data.status }
          assert:
            - "AssetReturnItem.${item_sch1}.status == OVERDUE (clock advance alone flipped it)"
            - "OffboardingCase.${case_sch1}.asset_posture == DEFAULTED (posture recompute: OVERDUE maps to DEFAULTED posture)"

  # =========================================================================
  # Section: consistency_model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_cascade_in_same_response_chain
        claim_type: satisfaction_pass
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Consistency model is immediate: after mark-defaulted returns 200, a subsequent GET of the case and statement already reflects deduction_total_cents and recomputed net_pay_cents (no lag)."
        test_recipe:
          setup: ["CA case approved; statement CALCULATED with regular_wages=50000; OTHER asset replacement 10000 issued 2026-08-01; clock past return_due+7d"]
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-CONS1", case_type: "RESIGNATION", work_state_code: "CA", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-10T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_cons1: $.data.id }
            - call: "POST /offboarding/offboarding-cases/${case_cons1}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-approver-1"
            - call: "POST /offboarding/asset-return-items"
              payload: { offboarding_case_id: "${case_cons1}", asset_tag: "U1", asset_kind: "OTHER", replacement_cost_cents: 10000, issued_date: "2026-08-01T00:00:00Z" }
              as: AssetClerk
              captures: { item_cons1: $.data.id }
            - call: "GET /offboarding/offboarding-cases/${case_cons1}/final-pay-statements"
              payload: {}
              as: PayrollSpecialist
              captures: { stmt_cons1: $.data.0.id, stmt_cons1_v: $.data.0.version }
            - call: "POST /offboarding/final-pay-statements/${stmt_cons1}/calculate"
              payload: { regular_wages_cents: 50000, expected_final_pay_statement_version: "${stmt_cons1_v}" }
              as: PayrollSpecialist
              as_user_id: "payroll-calc-1"
            - call: "POST /offboarding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /offboarding/asset-return-items/${item_cons1}/mark-defaulted"
              payload: {}
              as: PayrollSpecialist
            - call: "GET /offboarding/offboarding-cases/${case_cons1}"
              payload: {}
              as: PayrollSpecialist
              captures: { case_ded_total: $.data.deduction_total_cents }
            - call: "GET /offboarding/final-pay-statements/${stmt_cons1}"
              payload: {}
              as: PayrollSpecialist
              captures: { stmt_net: $.data.net_pay_cents }
          assert:
            - "Immediately after mark-defaulted: case.deduction_total_cents == 9880 (12d*10bps=120bps; 10000*0.988=9880)"
            - "statement.deduction_total_cents == 9880 and net_pay_cents == 40120 (50000-9880) visible in the same read sequence — no eventual-consistency lag"
