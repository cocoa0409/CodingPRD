      - name: dose_constraint_equality_satisfies_submission
        grounds:
          - entities.DoseConstraint.fields.satisfied
          - validations[priority=9]
        distinguishing_aspect: |
          Metric: dose in cGy; endpoint: POST treatment-plans/{id}/submit-for-check (different metric
          and endpoint than the weight and count boundaries). satisfaction is inclusive
          (evaluated_value_cGy <= limit_cGy): a MAX_DOSE constraint evaluated at exactly its 4500
          limit is satisfied and the plan submits; evaluated at 4501 it would block.
        test_recipe:
          setup:
            - "IMRT course 4000/8 brought to PLANNING with APPROVED contour set; plan created"
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-BND-3", full_name: "Boundary Three", date_of_birth: "1963-05-05" }, as: Scheduler, captures: { pat: $.data.id } }
