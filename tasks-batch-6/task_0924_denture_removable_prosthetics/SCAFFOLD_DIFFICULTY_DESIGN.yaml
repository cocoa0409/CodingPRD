  - rule_id: transitive_cascade
    instances:

      - name: remake_approval_six_link_cascade_to_paid_off_plan
        grounds:
          - state_machines.RemakeRequest.PENDING_APPROVAL_to_APPROVED
          - state_machines.CaseArch.DELIVERED_to_REMAKE_PENDING
          - state_machines.PaymentPlan.ACTIVE_to_PAID_OFF
          - state_machines.Installment.SCHEDULED_to_WAIVED
          - calculations.installment_reschedule
          - calculations.lab_remake_credit
        distinguishing_aspect: |
          Six-link chain triggered by remake approval, each link caused by the previous
          one: APPROVED -> arch REMAKE_PENDING -> prosthesis voided and open lab cases
          cancelled -> the lab credit is applied -> the plan principal is re-struck and its
          installments waived -> the plan reaches PAID_OFF. This is depth 6 and originates
          from a DIFFERENT trigger than the delivery cascade.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "A FLEXIBLE_PARTIAL case with one MAXILLARY arch delivered on 2026-05-01, fabricated by a lab case whose lab_invoice_amount is 1600.00."
            - "An ACTIVE PaymentPlan on that case with principal_amount 960.00 and three SCHEDULED installments of 320.00 each."
            - "A WarrantyClaim on the delivered prosthesis, attributed to that lab case and already adjudicated LAB_FAULT, so DentalLab.credit_issued_total and credit_available_balance are 960.00."
            - "A PENDING_APPROVAL RemakeRequest raised by dr-nunes citing that warranty claim, with charge_basis NO_CHARGE."
