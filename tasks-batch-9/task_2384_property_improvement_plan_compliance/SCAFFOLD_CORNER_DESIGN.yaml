              captures: { dispute_id: $.data.id }
            - call: "POST /pip/capital-budgets"
              payload: { plan_id: "${plan_id}", total_authorized_cents: 1182500, contingency_pct: 0.10, financing_source: "OWNER_EQUITY", expected_plan_version: "${plan_v_stale}" }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { err: $.data.error_id }
            - call: "GET /pip/plans/${plan_id}"
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { plan_v_fresh: $.data.version }
            - call: "POST /pip/capital-budgets"
              payload: { plan_id: "${plan_id}", total_authorized_cents: 1182500, contingency_pct: 0.10, financing_source: "OWNER_EQUITY", expected_plan_version: "${plan_v_fresh}" }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { budget_id: $.data.id }
          assert:
            - "the dispute create returns 201 and PipPlan.${plan_id}.dispute_state == DISPUTE_OPEN"
            - "${plan_v_fresh} == ${plan_v_stale} + 1 (the dispute incremented the plan's version)"
            - "the first budget create returns 412 and ${err} == \"ERR_STALE_PLAN_VERSION\""
            - "no CapitalBudget row existed after the refusal: the retry's row ${budget_id} is the plan's only budget"
            - "the retry returns 201 with CapitalBudget.${budget_id}.status == DRAFT and total_authorized_cents == 1182500"
            - "PipPlan.${plan_id}.funding_requirement_cents == 1182500, funding_gap_cents == 0, owner_claimed_total_cents == 1400000"
            - "PipPlan.${plan_id}.version == ${plan_v_fresh} + 1 (the successful create bumped it again)"

      - name: stale_property_version_blocks_a_draw_after_a_reserve_contribution
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules["draw-create-stale-property"]
          - errors[ERR_STALE_PROPERTY_VERSION]
          - endpoints["POST /pip/properties/{id}/reserve-contributions"]
        distinguishing_aspect: "The second OCC rule guards a different parent: a reserve contribution moves the corpus the draw's affordability was computed from, so the draw authored against the pre-contribution property version is refused with 412."
        test_recipe:
          setup:
            - "One property with reserve 50000000 and retention 5000000; an acknowledged plan carrying one GUEST_FACING item of 1000000 cents; budget 1182500 approved and LOCKED and the item IN_PROGRESS."
            - "The owner has read the property and holds its version."
          setup_api_calls:
            - call: "POST /pip/franchisee-accounts"
              payload: { legal_name: "Rushmere Hotels LLC", contact_email: "ops@rushmereh.example" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { fr_id: $.data.id }
            - call: "POST /pip/properties"
              payload: { franchisee_id: "${fr_id}", brand_code: "HRB", name: "Rushmere Pump Rooms", room_count: 200, adr_baseline_cents: 18000, occupancy_baseline_pct: 0.70, reserve_balance_cents: 50000000, minimum_retention_cents: 5000000 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { prop_id: $.data.id }
            - call: "POST /pip/plans"
              payload: { property_id: "${prop_id}", trigger_type: "POST_INSPECTION", standards_edition: "2026.1" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "GUEST_FACING", standards_reference: "GF-40.1.1", brand_estimated_cost_cents: 1000000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { item_id: $.data.id }
            - call: "POST /pip/plans/${plan_id}/issue"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/plans/${plan_id}/acknowledge"
              payload: {}
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
            - call: "GET /pip/plans/${plan_id}"
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { plan_v: $.data.version }
            - call: "POST /pip/capital-budgets"
              payload: { plan_id: "${plan_id}", total_authorized_cents: 1182500, contingency_pct: 0.10, financing_source: "RESERVE_FUND", expected_plan_version: "${plan_v}" }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { budget_id: $.data.id }
            - call: "POST /pip/capital-budgets/${budget_id}/approve"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/capital-budgets/${budget_id}/lock"
              payload: {}
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
            - call: "POST /pip/items/${item_id}/start"
              payload: {}
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
            - call: "GET /pip/properties/${prop_id}"
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { prop_v_stale: $.data.version }
          trigger:
            - call: "POST /pip/properties/${prop_id}/reserve-contributions"
              payload: { amount_cents: 1000000 }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { prop_v_after_contribution: $.data.version }
            - call: "POST /pip/reserve-draws"
              payload: { property_id: "${prop_id}", capital_budget_id: "${budget_id}", purpose_item_id: "${item_id}", amount_cents: 500000, expected_property_version: "${prop_v_stale}" }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { err: $.data.error_id }
            - call: "POST /pip/reserve-draws"
              payload: { property_id: "${prop_id}", capital_budget_id: "${budget_id}", purpose_item_id: "${item_id}", amount_cents: 500000, expected_property_version: "${prop_v_after_contribution}" }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { draw_id: $.data.id }
          assert:
            - "the contribution returns 200 with Property.${prop_id}.reserve_balance_cents == 51000000 and reserve_contributed_total_cents == 1000000"
            - "${prop_v_after_contribution} == ${prop_v_stale} + 1"
            - "the first draw create returns 412 and ${err} == \"ERR_STALE_PROPERTY_VERSION\""
            - "GET /pip/reserve-draws?property_id=${prop_id} returns total_count == 1 after both calls, i.e. only the retry persisted"
            - "the retry returns 201 with ReserveDraw.${draw_id}.status == REQUESTED and amount_cents == 500000"
            - "Property.${prop_id}.version == ${prop_v_after_contribution} + 1 and reserve_balance_cents is still 51000000 (a request encumbers but does not disburse)"
            - "Property.${prop_id}.initial_reserve_balance_cents == 50000000, so the corpus invariant still reconciles"

      - name: stale_plan_version_blocks_a_second_item_patch_reusing_the_same_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules["item-scope-revise-stale-plan"]
          - endpoints["PATCH /pip/items/{id}"]
          - errors[ERR_STALE_PLAN_VERSION]
        distinguishing_aspect: "The third OCC rule guards a write against its own earlier write: the first PATCH bumps PipPlan.version as a side effect, so a second revision computed from the same captured version is refused and the plan's aggregates keep the first revision's figures."
        test_recipe:
          setup:
            - "One property with a DRAFT plan carrying one GUEST_FACING item of 1000000 cents and one BACK_OF_HOUSE item of 500000 cents."
          setup_api_calls:
            - call: "POST /pip/franchisee-accounts"
              payload: { legal_name: "Sedgemoor Hotels LLC", contact_email: "ops@sedgemoorh.example" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { fr_id: $.data.id }
            - call: "POST /pip/properties"
              payload: { franchisee_id: "${fr_id}", brand_code: "HRB", name: "Sedgemoor Assembly Hall", room_count: 200, adr_baseline_cents: 18000, occupancy_baseline_pct: 0.70, reserve_balance_cents: 50000000, minimum_retention_cents: 5000000 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { prop_id: $.data.id }
            - call: "POST /pip/plans"
              payload: { property_id: "${prop_id}", trigger_type: "POST_INSPECTION", standards_edition: "2026.1" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "GUEST_FACING", standards_reference: "GF-41.1.1", brand_estimated_cost_cents: 1000000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { gf_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "BACK_OF_HOUSE", standards_reference: "BOH-41.1.1", brand_estimated_cost_cents: 500000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { boh_id: $.data.id }
            - call: "GET /pip/plans/${plan_id}"
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_v_stale: $.data.version }
          trigger:
            - call: "PATCH /pip/items/${gf_id}"
              payload: { expected_plan_version: "${plan_v_stale}", brand_estimated_cost_cents: 2000000 }
              as: BrandManager
              as_user_id: "bm-001"
            - call: "PATCH /pip/items/${boh_id}"
              payload: { expected_plan_version: "${plan_v_stale}", brand_estimated_cost_cents: 800000 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { err: $.data.error_id }
            - call: "GET /pip/plans/${plan_id}"
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_v_fresh: $.data.version }
            - call: "PATCH /pip/items/${boh_id}"
              payload: { expected_plan_version: "${plan_v_fresh}", brand_estimated_cost_cents: 800000 }
              as: BrandManager
              as_user_id: "bm-001"
          assert:
            - "the first PATCH returns 200 with PipItem.${gf_id}.approved_cost_cents == 2000000 and item_funding_cents == 2365000"
            - "the second PATCH returns 412 and ${err} == \"ERR_STALE_PLAN_VERSION\"; PipItem.${boh_id}.brand_estimated_cost_cents is still 500000"
            - "${plan_v_fresh} == ${plan_v_stale} + 1"
            - "the retry returns 200 with PipItem.${boh_id}.approved_cost_cents == 800000 and item_funding_cents == 910800"
            - "PipPlan.${plan_id}.brand_scoped_total_cents == 2800000 and funding_requirement_cents == 3275800"
            - "PipPlan.${plan_id}.version == ${plan_v_fresh} + 1 and scope_item_count == 2"

      - name: five_link_termination_chain_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - endpoints["POST /pip/default-notices/{id}/escalate"]
          - state_machines.PipPlan.OWNER_ACKNOWLEDGED_to_TERMINATED
        excluded_because:
          difficulty_instance: termination_cascade_from_notice_escalation
          rationale: "That §1.8 instance walks the whole chain — plan TERMINATED, item VOIDED, phase CANCELLED, booking CANCELLED, keys returned, budget CLOSED, property TERMINATED, franchisee TERMINATED_PORTFOLIO — with every intermediate figure pinned."

      - name: both_cost_bases_are_computed_on_one_scope
        claim_type: dual_variant_calculation
        grounds:
          - calculations.plan_scope_cost
          - endpoints["GET /pip/plans/{id}/cost-summary"]
        excluded_because:
          difficulty_instance: plan_scope_cost_brand_vs_owner_variance
          rationale: "That §1.8 instance is exactly the dual-variant claim: both bases on identical scope with the delta and the funding figure derived from the approved basis."

      - name: out_of_service_ratio_threshold_is_tested_at_its_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - validations[priority=52]
          - errors[ERR_OOO_CAP_EXCEEDED]
        excluded_because:
          difficulty_instance: out_of_service_ratio_boundary_at_activation
          rationale: "That §1.8 instance pins the inclusive 0.25 boundary at activation (50 of 200 keys admitted, 51 refused) together with the displacement figure that rides on it."

  # =========================================================================
  # Guide section 9 — Consistency Model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: every_derived_field_is_current_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints["POST /pip/items/{id}/start"]
          - calculations.compliance_risk_score
        distinguishing_aspect: "Nothing lags: the item-start response body itself already shows IN_PROGRESS, and reads taken immediately afterwards in the same chain show the plan at IN_EXECUTION, the property's recomputed score and the franchisee's re-derived standing with no second call or delay."
        test_recipe:
          setup:
            - "One property with an acknowledged plan carrying one GUEST_FACING item of 1000000 cents; budget 1064250 approved but deliberately left unlocked would block the start, so the budget is 1182500, approved and LOCKED."
          setup_api_calls:
            - call: "POST /pip/franchisee-accounts"
              payload: { legal_name: "Thornbury Hotels LLC", contact_email: "ops@thornburyh.example" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { fr_id: $.data.id }
