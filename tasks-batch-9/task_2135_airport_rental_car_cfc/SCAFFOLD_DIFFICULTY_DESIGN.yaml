      - name: coverage_ratio_exactly_at_12500_bps_funds_one_cent_over_does_not
        grounds:
          - calculations.debt_service_coverage_test
          - validations[priority=31]
          - errors[ERR_COVERAGE_BELOW_REQUIREMENT]
          - entities.DebtServiceObligation.fields.coverage_requirement_bps
          - state_machines.DebtServiceObligation.SCHEDULED_to_FUNDED
        distinguishing_aspect: |
          Boundary metric #1 — a NUMERIC RATIO threshold reached through
          POST /rac/debt-service-obligations/{id}/fund. With 5,000,000 cents of
          coverage cash, an obligation of 4,000,000 at 12500 bps sits exactly on
          the line (5,000,000 * 10000 == 12500 * 4,000,000) and MUST fund,
          while an obligation of 4,000,001 misses by one cent of principal and
          MUST return ERR_COVERAGE_BELOW_REQUIREMENT.
        test_recipe:
          setup:
            - "A facility whose trust_debt_service_reserve_cents is exactly 5,000,000 and trust_unallocated_cents is 0, reached by two FINAL remittances of 2,000,000 and 4,000,000 cents."
            - "No obligation existed while those remittances were received, so nothing was auto-funded."
            - "Two SCHEDULED obligations are then created: OB_OVER for 4,000,001 cents and OB_EXACT for 4,000,000 cents, both at 12500 bps."
