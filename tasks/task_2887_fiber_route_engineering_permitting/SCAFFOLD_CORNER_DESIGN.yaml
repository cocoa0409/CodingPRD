      - name: as_built_certify_by_the_stamping_engineer_returns_segregation_of_duties
        claim_type: Segregation of duties
        grounds:
          - validations[priority=12]
          - entities.DesignPackage.fields.stamped_by_user_id
          - entities.AsBuiltRecord.fields.certified_by_user_id
        distinguishing_aspect: "The duty chain reaches across entities: the engineer who stamped the design cannot certify the as-built built from it, so eng-bob is refused and eng-carol succeeds — and eng-alice, who only submitted, is not blocked by this rule."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route 'Inland Spur' at CONSTRUCTION_READY with one walked 400-foot URBAN_PAVED segment and an APPROVED MUNICIPAL_ROW permit"
            - "DesignPackage revision 1 submitted by eng-alice and STAMPED by eng-bob"
