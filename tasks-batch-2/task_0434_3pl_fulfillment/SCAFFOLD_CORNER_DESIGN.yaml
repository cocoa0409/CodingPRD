      - name: pack_units_not_summing_to_total_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=12]
          - calculations.handling_fee
          - errors[ERR_PACK_UNIT_MISMATCH]
        distinguishing_aspect: |
          Pack requires submitted carton packed_units to sum to Order.total_units;
          packing a 3-unit order into cartons summing to 2 is rejected with
          ERR_PACK_UNIT_MISMATCH and the order stays PICKING.
        test_recipe:
