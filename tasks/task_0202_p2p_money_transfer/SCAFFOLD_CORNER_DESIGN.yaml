        claim_type: violation_to_error
        grounds: [calculations.transfer_risk_gate, state_machines.Transfer.SENT_to_HELD, entities.RiskHold.fields.reason_code]
        distinguishing_aspect: "A send of 6000c (> 5000 cap) to a never-verified recipient is accepted but routed to HELD by the risk gate with RiskHold.reason_code == UNVERIFIED_RECIPIENT (held for review, not credited)."
        test_recipe:
          setup: ["Funded sender S (LOW tier); recipient R never verified; send 6000 (> 5000 cap)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "s_rnv@x.com", display_name: "S RNV" }
              as: PlatformAdmin
              captures: { srnv_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "r_rnv@x.com", display_name: "R RNV" }
              as: PlatformAdmin
              captures: { rrnv_id: $.data.id }
            - call: "POST /_ledger/seed_credit"
              payload: { account_id: "${srnv_id}", amount_cents: 50000, memo: "seed" }
              as: PlatformAdmin
          trigger:
            - call: "POST /transfers"
              payload: { sender_account_id: "${srnv_id}", recipient_account_id: "${rrnv_id}", amount_cents: 6000 }
              as: AccountHolder
              as_user_id: "${srnv_id}"
              captures: { trnv_id: $.data.id, hold_rnv_id: $.data.hold_id }
          assert:
            - "response.status == 201"
            - "Transfer.${trnv_id}.status == HELD"
            - "RiskHold.${hold_rnv_id}.reason_code == UNVERIFIED_RECIPIENT"
            - "Account.${rrnv_id}.available_balance_cents == 0"

  # =========================================================================
  # Section: cross_cutting_complexity_layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_account_version_on_second_withdrawal
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[withdrawal-stale-account-version]", "errors[ERR_STALE_ACCOUNT_VERSION]", state_machines.Withdrawal.REQUESTED_to_PAID]
        distinguishing_aspect: "After one successful withdrawal bumps Account.version, a second POST /withdrawals still carrying the now-stale expected_account_version captured before the first withdrawal (${occ_v}) -> 412 ERR_STALE_ACCOUNT_VERSION."
        test_recipe:
          setup: ["Account with VERIFIED FS and balance 500000; one successful withdrawal already advanced version."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "occ@x.com", display_name: "OCC" }
              as: PlatformAdmin
              captures: { occ_acc: $.data.id }
            - call: "POST /_ledger/seed_credit"
              payload: { account_id: "${occ_acc}", amount_cents: 500000, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /funding-sources"
              payload: { account_id: "${occ_acc}", kind: "BANK", last4: "1616" }
              as: AccountHolder
              as_user_id: "${occ_acc}"
              captures: { occ_fs: $.data.id, occ_code: $.data.micro_deposit_code }
            - call: "POST /funding-sources/${occ_fs}/verify"
              payload: { code: "${occ_code}" }
              as: AccountHolder
              as_user_id: "${occ_acc}"
            - call: "GET /accounts/${occ_acc}"
              payload: {}
              as: AccountHolder
              as_user_id: "${occ_acc}"
              captures: { occ_v: $.data.version }
            - call: "POST /withdrawals"
              payload: { account_id: "${occ_acc}", funding_source_id: "${occ_fs}", gross_amount_cents: 10000, speed: "STANDARD", expected_account_version: "${occ_v}" }
              as: AccountHolder
              as_user_id: "${occ_acc}"
              captures: { occ_w1: $.data.id }
          trigger:
            - call: "POST /withdrawals"
              payload: { account_id: "${occ_acc}", funding_source_id: "${occ_fs}", gross_amount_cents: 10000, speed: "STANDARD", expected_account_version: "${occ_v}" }
              as: AccountHolder
              as_user_id: "${occ_acc}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_ACCOUNT_VERSION"

      - name: occ_version_increments_on_each_balance_write
        claim_type: optimistic_concurrency
        grounds: [entities.Account.fields.version, state_machines.Withdrawal.REQUESTED_to_PAID]
        distinguishing_aspect: "Account.version starts at 1, increments to 2 on the seed credit, and to 3 after a successful withdrawal — every balance-moving write bumps version by exactly 1."
        test_recipe:
          setup: ["Fresh Account; observe version after seed credit and after one withdrawal."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "ver@x.com", display_name: "Ver" }
              as: PlatformAdmin
              captures: { ver_acc: $.data.id }
            - call: "POST /_ledger/seed_credit"
              payload: { account_id: "${ver_acc}", amount_cents: 500000, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /funding-sources"
              payload: { account_id: "${ver_acc}", kind: "BANK", last4: "1717" }
              as: AccountHolder
              as_user_id: "${ver_acc}"
              captures: { ver_fs: $.data.id, ver_code: $.data.micro_deposit_code }
            - call: "POST /funding-sources/${ver_fs}/verify"
              payload: { code: "${ver_code}" }
              as: AccountHolder
              as_user_id: "${ver_acc}"
            - call: "GET /accounts/${ver_acc}"
              payload: {}
              as: AccountHolder
              as_user_id: "${ver_acc}"
              captures: { ver_v: $.data.version }
            - call: "POST /withdrawals"
              payload: { account_id: "${ver_acc}", funding_source_id: "${ver_fs}", gross_amount_cents: 10000, speed: "STANDARD", expected_account_version: "${ver_v}" }
              as: AccountHolder
              as_user_id: "${ver_acc}"
          trigger:
            - call: "GET /accounts/${ver_acc}"
              payload: {}
              as: AccountHolder
              as_user_id: "${ver_acc}"
              captures: { ver_v_after: $.data.version }
          assert:
            - "Account.${ver_acc}.version == 3"

      - name: dispute_uphold_cascade_layer
        claim_type: cascading_side_effects
        grounds: [state_machines.Dispute.OPEN_to_UPHELD, state_machines.Transfer.SENT_to_SETTLED, entities.Reversal.fields.amount_cents]
        excluded_because:
          difficulty_instance: transitive_cascade / dispute_uphold_depth3_cascade
          rationale: "The full depth-3 dispute-uphold cascade (Dispute->Transfer->Reversal/ledger/risk) is asserted end-to-end by the named §1.8 instance."

      - name: instant_vs_standard_dual_variant_layer
        claim_type: dual_variant_calculation
        grounds: [calculations.withdrawal_fee]
        excluded_because:
          difficulty_instance: dual_variant_calc / withdrawal_fee_instant_vs_standard_on_withdrawal
          rationale: "INSTANT vs STANDARD fee divergence on the same gross is the named §1.8 dual-variant instance."

      - name: daily_weekly_rolling_threshold_layer
        claim_type: rate_threshold_triggers
        grounds: [calculations.transfer_limit_check]
        excluded_because:
          difficulty_instance: combinatorial_formula / transfer_limit_nested_min_across_two_windows
          rationale: "Rolling daily/weekly threshold boundaries are exercised by the named §1.8 combinatorial instance and the §1.8 aggregate-capacity overlap instance."

  # =========================================================================
  # Section: consistency_model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: settled_transfer_balances_visible_same_request
        claim_type: immediate
        grounds: [state_machines.Transfer.SENT_to_SETTLED, entities.Account.fields.available_balance_cents]
        distinguishing_aspect: "A SETTLE transfer's debit/credit are visible in the same request: the POST /transfers response and an immediate GET show sender balance dropped and recipient balance raised atomically."
        test_recipe:
          setup: ["Funded sender S (10000), verified recipient R; send 2500."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "s_im@x.com", display_name: "S IM" }
              as: PlatformAdmin
              captures: { sim_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "r_im@x.com", display_name: "R IM" }
              as: PlatformAdmin
              captures: { rim_id: $.data.id }
            - call: "POST /_ledger/seed_credit"
              payload: { account_id: "${sim_id}", amount_cents: 10000, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /recipient-verifications"
              payload: { account_id: "${rim_id}", channel: "EMAIL" }
              as: AccountHolder
              as_user_id: "${rim_id}"
              captures: { rvim_id: $.data.id, rvim_tok: $.data.confirm_token }
            - call: "POST /recipient-verifications/${rvim_id}/confirm"
              payload: { token: "${rvim_tok}" }
              as: AccountHolder
              as_user_id: "${rim_id}"
            - call: "POST /transfers"
              payload: { sender_account_id: "${sim_id}", recipient_account_id: "${rim_id}", amount_cents: 2500 }
              as: AccountHolder
              as_user_id: "${sim_id}"
              captures: { tim_id: $.data.id }
          trigger:
            - call: "GET /accounts/${sim_id}"
              payload: {}
              as: AccountHolder
              as_user_id: "${sim_id}"
          assert:
            - "Transfer.${tim_id}.status == SETTLED"
            - "Account.${sim_id}.available_balance_cents == 7500"
            - "Account.${rim_id}.available_balance_cents == 2500"
