      - name: a_pool_reduction_cannot_dip_below_committed_obligations
        claim_type: aggregate_validation
        grounds: ["validations[priority=39]", calculations.subsidy_pool_ledger, errors.ERR_POOL_BELOW_OBLIGATIONS, entities.AffiliateProgram.fields.subsidy_pool_cents, entities.AffiliateProgram.fields.subsidy_committed_cents, "endpoints.POST /homeownership/programs/{id}/subsidy-pool-adjustments"]
        distinguishing_aspect: "The floor under a reduction is not zero, it is the sum of live obligations: with one APPROVED application committing 1950000 cents, a reduction leaving 1500000 is refused while a reduction leaving exactly 1950000 succeeds and drives subsidy_available_cents to 0 and program_posture to SUBSIDY_RESTRICTED. The conserved-quantity invariant is asserted on both sides of the boundary."
        test_recipe:
          setup:
            - "Canonical program (pool 5000000) with one SELECTED household and one site appraised at 15000000. Its mortgage application has been underwritten by officer-1 and APPROVED by officer-2, so silent_second_amount_cents is 1950000, subsidy_committed_cents is 1950000 and subsidy_available_cents is 3050000."
