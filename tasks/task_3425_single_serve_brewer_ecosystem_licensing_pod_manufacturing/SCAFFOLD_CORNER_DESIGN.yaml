              as: LicensingManager
              captures: { la3_ag: $.data.id }
            - call: "POST /license-agreements/${la3_ag}/transition"
              payload: { target_state: "ACTIVE" }
              as: LicensingManager
              captures: { la3_v2: $.data.version }
            - call: "POST /license-agreements/${la3_ag}/amend"
              payload: { expected_license_agreement_version: "${la3_v2}", territory_code: "US", effective_start: "2026-06-01", effective_end: "2027-05-31", royalty_tiers: [{up_to_units: null, millicents_per_pod: 525}], quality_min_cup_score: 81, exclusive: false }
              as: LicensingManager
              captures: { la3_am: $.data.id }
          trigger:
            - call: "POST /license-agreements/${la3_am}/transition"
              payload: { target_state: "ACTIVE" }
              as: LicensingManager
              captures: { la3_am_status: $.data.status }
            - call: "GET /license-agreements/${la3_ag}"
              payload: {}
              as: LicensingManager
              captures: { la3_src_status: $.data.status }
          assert:
            - "amendment activates despite the window overlap (chain exempt): status == ACTIVE"
            - "source agreement becomes SUPERSEDED and accepts no further transitions"

      - name: new_plan_supersedes_approved_but_not_locked
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.AssortmentPlan.APPROVED_to_SUPERSEDED"
          - "errors.ERR_INVALID_STATE"
        distinguishing_aspect: "Creating a same-period plan flips the existing APPROVED plan to SUPERSEDED, but when the incumbent is LOCKED the create fails 409 ERR_INVALID_STATE — the lock is the point of no return for the retail account."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. Account, ACTIVE variety; plan A for 2026-10 taken to APPROVED (floor 0)."]
          setup_api_calls:
            - call: "POST /brands"
              payload: { name: "Supersede Brand", kind: "PLATFORM_OWNED", home_region: "US" }
              as: PlatformAdmin
              captures: { la4_brand: $.data.id }
            - call: "POST /pod-varieties"
              payload: { brand_id: "${la4_brand}", name: "Supersede Var", roast_level: "MEDIUM", flavor_family: "UNFLAVORED", wholesale_price_cents: 100, margin_cents: 20 }
              as: BrandManager
              as_user_id: "${la4_brand}"
              captures: { la4_var: $.data.id }
            - call: "POST /retail-accounts"
              payload: { name: "Supersede Mart", region: "US", shelf_slots_total: 50, productivity_floor_cents: 0 }
              as: CategoryManager
              captures: { la4_acct: $.data.id, la4_v1: $.data.version }
            - call: "POST /retail-accounts/${la4_acct}/assortment-plans"
              payload: { expected_retail_account_version: "${la4_v1}", period: "2026-10", slots: [{variety_id: "${la4_var}", facings: 1, clearance_flag: false}] }
              as: CategoryManager
              captures: { la4_pa: $.data.id }
            - call: "POST /assortment-plans/${la4_pa}/transition"
              payload: { target_state: "PROPOSED" }
              as: CategoryManager
            - call: "POST /assortment-plans/${la4_pa}/transition"
              payload: { target_state: "APPROVED" }
              as: CategoryManager
            - call: "GET /retail-accounts/${la4_acct}"
              payload: {}
              as: CategoryManager
              captures: { la4_v2: $.data.version }
          trigger:
            - call: "POST /retail-accounts/${la4_acct}/assortment-plans"
              payload: { expected_retail_account_version: "${la4_v2}", period: "2026-10", slots: [{variety_id: "${la4_var}", facings: 2, clearance_flag: false}] }
              as: CategoryManager
              captures: { la4_pb: $.data.id }
            - call: "POST /assortment-plans/${la4_pb}/transition"
              payload: { target_state: "PROPOSED" }
              as: CategoryManager
            - call: "POST /assortment-plans/${la4_pb}/transition"
              payload: { target_state: "APPROVED" }
              as: CategoryManager
            - call: "POST /assortment-plans/${la4_pb}/transition"
              payload: { target_state: "LOCKED" }
              as: CategoryManager
            - call: "GET /retail-accounts/${la4_acct}"
              payload: {}
              as: CategoryManager
              captures: { la4_v4: $.data.version }
            - call: "POST /retail-accounts/${la4_acct}/assortment-plans"
              payload: { expected_retail_account_version: "${la4_v4}", period: "2026-10", slots: [{variety_id: "${la4_var}", facings: 3, clearance_flag: false}] }
              as: CategoryManager
              captures: { la4_err: $.data.error_id }
          assert:
            - "after plan B creation: plan A (was APPROVED) reads SUPERSEDED via GET /retail-accounts/${la4_acct}/assortment-plans"
            - "plan B driven to LOCKED"
            - "creating plan C for the same period against the LOCKED incumbent: 409 ERR_INVALID_STATE"

      - name: default_logical_clock_is_fixed_startup_value
        claim_type: scheduled_actions
        grounds:
          - "endpoints.POST_/_clock/set_current_utc"
        distinguishing_aspect: "With no set_current_utc call at all, a brewer's registered_at is exactly 2026-09-01T00:00:00Z — the fixed startup default, not wall-clock time."
        test_recipe:
          setup: ["Empty database; the test never calls the clock endpoint."]
          setup_api_calls:
            - call: "POST /households"
              payload: { region: "NW", size: 1 }
              as: PlatformAdmin
              captures: { la5_hh: $.data.id }
            - call: "POST /brewer-models"
              payload: { model_code: "K-CLK", firmware_compat: "OPEN", warranty_months: 12, descale_interval_brews: 200, msrp_cents: 5000, unit_cost_cents: 4000 }
              as: PlatformAdmin
              captures: { la5_model: $.data.id }
          trigger:
            - call: "POST /households/${la5_hh}/brewers"
              payload: { model_id: "${la5_model}", serial_number: "SN-LA5" }
              as: PlatformAdmin
              captures: { la5_reg: $.data.registered_at }
          assert:
            - "registered_at == '2026-09-01T00:00:00Z' exactly"

      - name: brewers_list_scopes_to_requested_household
        claim_type: multi_tenancy
        grounds:
          - "endpoints.GET_/brewers"
        distinguishing_aspect: "GET /brewers?household_id=H1 returns exactly H1's brewers; H2's brewer never leaks across the household boundary, and total_count reflects the filtered set."
        test_recipe:
          setup: ["Clock default. Households H1 (2 brewers) and H2 (1 brewer)."]
          setup_api_calls:
            - call: "POST /households"
              payload: { region: "NW", size: 2 }
              as: PlatformAdmin
              captures: { la6_h1: $.data.id }
            - call: "POST /households"
              payload: { region: "NE", size: 1 }
              as: PlatformAdmin
              captures: { la6_h2: $.data.id }
            - call: "POST /brewer-models"
              payload: { model_code: "K-SCP", firmware_compat: "OPEN", warranty_months: 12, descale_interval_brews: 200, msrp_cents: 5000, unit_cost_cents: 4000 }
              as: PlatformAdmin
              captures: { la6_model: $.data.id }
            - call: "POST /households/${la6_h1}/brewers"
              payload: { model_id: "${la6_model}", serial_number: "SN-LA6-1" }
              as: PlatformAdmin
            - call: "POST /households/${la6_h1}/brewers"
              payload: { model_id: "${la6_model}", serial_number: "SN-LA6-2" }
              as: PlatformAdmin
            - call: "POST /households/${la6_h2}/brewers"
              payload: { model_id: "${la6_model}", serial_number: "SN-LA6-3" }
              as: PlatformAdmin
          trigger:
            - call: "GET /brewers"
              payload: { household_id: "${la6_h1}" }
              as: SupportAgent
          assert:
            - "exactly 2 rows, total_count == 2, has_more == false"
            - "every row's household_id == ${la6_h1}; SN-LA6-3 absent"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: writes_are_visible_immediately
        claim_type: immediate
        grounds:
          - "complexity_profile.consistency_model"
        distinguishing_aspect: "A variety created and immediately read back shows identical fields; a transition and its cascaded side effects are visible in the same response (immediate consistency, no lag window)."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. One brand."]
          setup_api_calls:
            - call: "POST /brands"
              payload: { name: "Immediate Brand", kind: "PLATFORM_OWNED", home_region: "US" }
              as: PlatformAdmin
              captures: { cm1_brand: $.data.id }
          trigger:
            - call: "POST /pod-varieties"
              payload: { brand_id: "${cm1_brand}", name: "Immediate Var", roast_level: "LIGHT", flavor_family: "UNFLAVORED", wholesale_price_cents: 101, margin_cents: 21 }
              as: BrandManager
              as_user_id: "${cm1_brand}"
              captures: { cm1_var: $.data.id }
            - call: "GET /pod-varieties/${cm1_var}"
              payload: {}
              as: BrandManager
              as_user_id: "${cm1_brand}"
              captures: { cm1_name: $.data.name, cm1_status: $.data.status }
            - call: "POST /pod-varieties/${cm1_var}/transition"
              payload: { target_state: "PHASE_OUT" }
              as: BrandManager
              as_user_id: "${cm1_brand}"
              captures: { cm1_after: $.data.status }
          assert:
            - "GET immediately after POST returns name 'Immediate Var', status ACTIVE, wholesale_price_cents 101"
            - "the transition response itself carries status PHASE_OUT (side effects visible in-request)"
