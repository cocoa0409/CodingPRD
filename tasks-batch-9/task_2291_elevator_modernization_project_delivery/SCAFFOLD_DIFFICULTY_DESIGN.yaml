              as: ServiceManager
          assert:
            - "Hold B (2026-08-10T00:00:00Z..2026-08-15T00:00:00Z) returns HTTP 201 even though 600 + 600 = 1200 exceeds staging_area_sqft 1000, because hold A ends exactly when hold B starts and half-open intervals do not overlap"
            - "StagingReservation.${srB_id}.status == HELD and sqft == 600"
            - "After hold B, ModernizationProject.${p_id}.staging_committed_sqft == 1200 - the ledger is a running total and is NOT capped by staging_area_sqft"
            - "After hold B, ModernizationProject.${p_id}.downtime_posture == OPEN because no outage is active and no group is below its floor, even though staging pressure is above 85 percent"
            - "Hold C (2026-08-09T00:00:00Z..2026-08-12T00:00:00Z) returns HTTP 409 with error_id ERR_STAGING_CAPACITY_EXCEEDED"
            - "The rejection is driven by the pointwise peak 600 (hold A alone over 2026-08-09..2026-08-10, then hold B alone over 2026-08-10..2026-08-12): 600 + 600 == 1200 > 1000. It is NOT the naive sum of all overlapping holds 600 + 600 + 600 == 1800"
            - "After the rejection, GET /staging-reservations?procurement_order_id=${poC_id} returns 0 rows and staging_committed_sqft is still 1200"
            - "ProcurementOrder.${poC_id}.status == ORDERED and staging_reservation_id == null"

