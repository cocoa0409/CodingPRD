            - call: "POST /franchise/territories/${ter_eq_id}/offer"
              payload: { franchisee_id: "${fr_ms_id}" }
              as: FranchiseAdmin
            - call: "GET /franchise/territories/${ter_eq_id}"
              payload: {}
