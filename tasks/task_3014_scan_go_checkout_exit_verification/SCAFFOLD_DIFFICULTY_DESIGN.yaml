# =============================================================================
# §1.8 Scaffold Difficulty Design — Scan-and-Go Checkout & Exit Verification
# 2 instances per Difficulty Rule (§0.5); every recipe replays from empty-DB
# using only §1.5 endpoints. Shared setup idioms:
#   - clock is set to 2026-09-01T12:00:00Z (720 >= open_minute 600) before
#     any session creation so the early-shopping gate is inactive.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cart_provisional_vs_final_after_mid_shop_price_change
        grounds:
          - calculations.cart_totals
          - calculations.scan_line_gross
          - entities.ScanSession.fields.provisional_total_cents
          - entities.ScanSession.fields.final_total_cents
        distinguishing_aspect: |
          Entity domain = ScanSession. The provisional variant (scan-time
          snapshots) and the final variant (pay-time re-pricing) produce
          different totals for identical cart contents: 2000 vs 2400 when the
          catalog price moves from 1000 to 1200 mid-shop.
        test_recipe:
          setup:
            - "Club (open 600, early 480, RECEIPT_CODE mode), UNIT item MILK at 1000c, PLUS member"
            - "Clock at 2026-09-01T12:00:00Z; session with 2 x MILK scanned (provisional 2000)"
            - "Catalog price moved to 1200c before payment"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club DV1", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "MILK-1G", item_name: "Milk 1G", pricing_mode: "UNIT", unit_price_cents: 1000 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /members"
              payload: { tier: "PLUS", birth_year: 1990, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { session_id: $.data.id }
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${item_id}", quantity: 2 }
              as: Member
              as_user_id: "${member_id}"
            - call: "PATCH /catalog-items/${item_id}"
              payload: { unit_price_cents: 1200 }
              as: PlatformAdmin
          trigger:
            - call: "POST /scan-sessions/${session_id}/pay"
              as: Member
              as_user_id: "${member_id}"
              captures: { final_total: $.data.final_total_cents, provisional_total: $.data.provisional_total_cents }
          assert:
            - "ScanSession.${session_id}.provisional_total_cents == 2000"
            - "ScanSession.${session_id}.final_total_cents == 2400"
            - "ScanSession.${session_id}.status == PAID"
            - "Member.${member_id}.lifetime_charged_cents == 2400"

      - name: rewards_pending_vs_posted_after_void
        grounds:
          - calculations.cash_rewards_accrual
          - state_machines.ScanSession.PAID_to_VOIDED
          - entities.Member.fields.cash_rewards_pending_cents
          - entities.Member.fields.cash_rewards_posted_cents
        distinguishing_aspect: |
          Entity domain = Member (reward ledger), not the cart. The pending
          variant counted 100c at pay; the posted variant replays the same
          payment data at settle but excludes the VOIDED session, yielding 0
          for member A while an identical non-voided session for member B
          posts 100.
        test_recipe:
          setup:
            - "Club (RECEIPT_CODE), UNIT item at 2500c, PLUS members A and B"
            - "Clock 12:00; A and B each scan qty 2 (5000c) and pay; each pending rewards 100"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club DV2", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "TV-55", item_name: "TV 55in", pricing_mode: "UNIT", unit_price_cents: 2500 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /members"
              payload: { tier: "PLUS", birth_year: 1985, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_a: $.data.id }
            - call: "POST /members"
              payload: { tier: "PLUS", birth_year: 1988, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_b: $.data.id }
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_a}"
              captures: { session_a: $.data.id }
            - call: "POST /scan-sessions/${session_a}/lines"
              payload: { catalog_item_id: "${item_id}", quantity: 2 }
              as: Member
              as_user_id: "${member_a}"
            - call: "POST /scan-sessions/${session_a}/pay"
              as: Member
              as_user_id: "${member_a}"
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_b}"
              captures: { session_b: $.data.id }
            - call: "POST /scan-sessions/${session_b}/lines"
              payload: { catalog_item_id: "${item_id}", quantity: 2 }
              as: Member
              as_user_id: "${member_b}"
            - call: "POST /scan-sessions/${session_b}/pay"
              as: Member
              as_user_id: "${member_b}"
          trigger:
            - call: "POST /scan-sessions/${session_a}/void-payment"
              as: LossPreventionOfficer
            - call: "POST /members/${member_a}/rewards/settle"
              as: PlatformAdmin
            - call: "POST /members/${member_b}/rewards/settle"
              as: PlatformAdmin
          assert:
            - "Member.${member_a}.cash_rewards_pending_cents == 0"
            - "Member.${member_a}.cash_rewards_posted_cents == 0"
            - "Member.${member_b}.cash_rewards_posted_cents == 100"
            - "ScanSession.${session_a}.status == VOIDED"
            - "ScanSession.${session_a}.refunded_cents == 5000"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: weighted_line_rounding_per_line_then_sum
        grounds:
          - calculations.scan_line_gross
          - entities.ScanLine.fields.line_gross_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-line-then-sum.
          Two 150g lines at 250c/lb: round_half_up(150*250/454)=83 each,
          total 166; the alternative sum-then-round order would give
          round_half_up(300*250/454)=165. Assertion pins 166.
        test_recipe:
          setup:
            - "Club (RECEIPT_CODE), WEIGHTED item at 250c/lb, CLUB member, clock 12:00"
            - "Session with two separate 150g scans"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club CF1", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "BANANA", item_name: "Bananas", pricing_mode: "WEIGHTED", price_per_pound_cents: 250 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /members"
              payload: { tier: "CLUB", birth_year: 1992, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { session_id: $.data.id }
          trigger:
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${item_id}", weight_grams: 150 }
              as: Member
              as_user_id: "${member_id}"
              captures: { line1_gross: $.data.line_gross_cents }
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${item_id}", weight_grams: 150 }
              as: Member
              as_user_id: "${member_id}"
              captures: { line2_gross: $.data.line_gross_cents }
            - call: "GET /scan-sessions/${session_id}"
              as: Member
              as_user_id: "${member_id}"
              captures: { prov: $.data.provisional_total_cents }
          assert:
            - "line1_gross == 83"
            - "line2_gross == 83"
            - "ScanSession.${session_id}.provisional_total_cents == 166"

      - name: weighted_offer_commenced_pounds_meets_per_member_limit
        grounds:
          - calculations.instant_savings_application
          - calculations.commenced_pound_units
          - entities.ScanLine.fields.offer_units_applied
        distinguishing_aspect: |
          Mode (a) non-linear multi-input formula: commenced pounds
          (ceil(500/454)=2) x per-member remaining allowance (3, then 1) x
          tier eligibility x connectivity gate. Line 1 redeems min(3,2)=2
          units (100c off), line 2 redeems min(1,2)=1 unit (50c off).
        test_recipe:
          setup:
            - "Club (RECEIPT_CODE), WEIGHTED item at 199c/lb, offer 50c/unit per_member_limit 3 covering 2026, PLUS member, clock 12:00"
            - "Session scans the item twice at 500g each"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club CF2", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "STEAK", item_name: "Steak", pricing_mode: "WEIGHTED", price_per_pound_cents: 199 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /clubs/${club_id}/instant-savings-offers"
              payload: { catalog_item_id: "${item_id}", discount_cents: 50, valid_from_iso: "2026-01-01T00:00:00Z", valid_to_iso: "2026-12-31T23:59:59Z", tier_eligibility: "ALL", per_member_limit: 3 }
              as: ClubManager
              captures: { offer_id: $.data.id }
            - call: "POST /members"
              payload: { tier: "PLUS", birth_year: 1980, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { session_id: $.data.id }
          trigger:
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${item_id}", weight_grams: 500 }
              as: Member
              as_user_id: "${member_id}"
              captures: { l1_units: $.data.offer_units_applied, l1_total: $.data.line_total_cents }
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${item_id}", weight_grams: 500 }
              as: Member
              as_user_id: "${member_id}"
              captures: { l2_units: $.data.offer_units_applied, l2_total: $.data.line_total_cents }
            - call: "GET /scan-sessions/${session_id}"
              as: Member
              as_user_id: "${member_id}"
              captures: { prov: $.data.provisional_total_cents }
          assert:
            - "l1_units == 2 and l1_total == 119"
            - "l2_units == 1 and l2_total == 169"
            - "ScanSession.${session_id}.provisional_total_cents == 288"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: session_review_hold_cycle_repeats
        grounds:
          - state_machines.ScanSession.OPEN_to_REVIEW_HOLD
          - state_machines.ScanSession.REVIEW_HOLD_to_OPEN
          - state_machines.RestrictedIntercept.PENDING_to_APPROVED
        distinguishing_aspect: |
          Entity = ScanSession, shape = cycle: OPEN -> REVIEW_HOLD -> OPEN ->
          REVIEW_HOLD -> OPEN via two independent restricted scans and two
          associate approvals; a linear pipeline could not re-enter
          REVIEW_HOLD after leaving it.
        test_recipe:
          setup:
            - "Club (RECEIPT_CODE), UNIT ALCOHOL item WINE at 1500c, PLUS member (birth_year 1990), clock 12:00"
            - "Session created"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club NL1", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "WINE-750", item_name: "Wine 750ml", pricing_mode: "UNIT", unit_price_cents: 1500, restricted_class: "ALCOHOL" }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /members"
              payload: { tier: "PLUS", birth_year: 1990, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { session_id: $.data.id }
          trigger:
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${item_id}", quantity: 1 }
              as: Member
              as_user_id: "${member_id}"
              captures: { line1: $.data.id }
            - call: "GET /scan-sessions/${session_id}/intercepts"
              as: Associate
              captures: { int1: "$.data[0].id" }
            - call: "POST /intercepts/${int1}/resolve"
              payload: { decision: "APPROVE", birth_year_verified: true }
              as: Associate
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${item_id}", quantity: 1 }
              as: Member
              as_user_id: "${member_id}"
            - call: "GET /scan-sessions/${session_id}"
              as: Member
              as_user_id: "${member_id}"
              captures: { mid_status: $.data.status }
            - call: "GET /intercepts?session_id=${session_id}&status=PENDING"
              as: Associate
              captures: { int2: "$.data[0].id" }
            - call: "POST /intercepts/${int2}/resolve"
              payload: { decision: "APPROVE", birth_year_verified: true }
              as: Associate
            - call: "GET /scan-sessions/${session_id}"
              as: Member
              as_user_id: "${member_id}"
              captures: { end_status: $.data.status, end_total: $.data.provisional_total_cents }
          assert:
            - "mid_status == REVIEW_HOLD (cycle re-entered after first approval)"
            - "end_status == OPEN"
            - "ScanSession.${session_id}.provisional_total_cents == 3000"

      - name: curbside_staged_demotes_to_staging_on_reschedule
        grounds:
          - state_machines.CurbsideOrder.STAGED_to_STAGING
          - state_machines.CurbsideOrder.STAGING_to_STAGED
          - concurrency_rules[curbside-reschedule-stale-version]
        distinguishing_aspect: |
          Entity = CurbsideOrder, shape = branching with revert:
          PLACED -> STAGING -> STAGED, then reschedule demotes STAGED back to
          STAGING (a backward hop no linear pipeline allows) before a second
          STAGED and PICKED_UP.
        test_recipe:
          setup:
            - "Club with default staging_slot_capacity 2; member places a curbside order"
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "Club NL2", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /members"
              payload: { tier: "CLUB", birth_year: 1975, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /clubs/${club_id}/curbside-orders"
              payload: { item_count: 4 }
              as: Member
              as_user_id: "${member_id}"
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /curbside-orders/${order_id}/stage"
              payload: { staging_slot_label: "S1", window_start_iso: "2026-09-01T14:00:00Z", window_end_iso: "2026-09-01T15:00:00Z" }
              as: Associate
              captures: { order_v2: $.data.version }
            - call: "POST /curbside-orders/${order_id}/mark-staged"
              as: Associate
              captures: { staged_status: $.data.status, order_v3: $.data.version }
          trigger:
            - call: "POST /curbside-orders/${order_id}/reschedule"
              payload: { staging_slot_label: "S2", window_start_iso: "2026-09-01T16:00:00Z", window_end_iso: "2026-09-01T17:00:00Z", expected_curbside_order_version: "${order_v3}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { demoted_status: $.data.status }
            - call: "POST /curbside-orders/${order_id}/mark-staged"
              as: Associate
            - call: "POST /curbside-orders/${order_id}/pickup"
              as: Member
              as_user_id: "${member_id}"
              captures: { final_status: $.data.status }
          assert:
            - "staged_status == STAGED"
            - "demoted_status == STAGING"
            - "CurbsideOrder.${order_id}.staging_slot_label == S2"
            - "final_status == PICKED_UP"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers; depth >= 3 and >= 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: closeout_expires_intercept_removes_line_reopens_session
        grounds:
          - state_machines.RestrictedIntercept.PENDING_to_EXPIRED
          - state_machines.ScanLine.INTERCEPTED_to_REMOVED
          - state_machines.ScanSession.REVIEW_HOLD_to_OPEN
          - calculations.receipt_code_expiry
        distinguishing_aspect: |
          Depth-3 chain triggered by POST /clubs/{id}/run-closeout: intercept
          EXPIRED (hop 1) -> its ScanLine REMOVED with totals recomputed
          (hop 2) -> session leaves REVIEW_HOLD for OPEN (hop 3). Each hop is
          caused by the previous hop, not by the closeout call directly.
        test_recipe:
          setup:
            - "Club (RECEIPT_CODE, intercept_ttl 10 default), UNIT TOBACCO item at 900c, PLUS member (birth_year 1990)"
            - "Clock 12:00; session scans the tobacco item -> INTERCEPTED, session REVIEW_HOLD"
            - "Clock advanced to 12:11 (past the 10-minute TTL)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club TC1", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "CIG-PK", item_name: "Cigarettes", pricing_mode: "UNIT", unit_price_cents: 900, restricted_class: "TOBACCO" }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /members"
              payload: { tier: "PLUS", birth_year: 1990, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { session_id: $.data.id }
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${item_id}", quantity: 1 }
              as: Member
              as_user_id: "${member_id}"
              captures: { line_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:11:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /clubs/${club_id}/run-closeout"
              as: ClubManager
            - call: "GET /scan-sessions/${session_id}"
              as: ClubManager
              captures: { sess_status: $.data.status, sess_total: $.data.provisional_total_cents }
            - call: "GET /scan-lines/${line_id}"
              as: ClubManager
              captures: { line_status: $.data.status }
            - call: "GET /intercepts?session_id=${session_id}"
              as: ClubManager
              captures: { int_status: "$.data[0].status" }
          assert:
            - "int_status == EXPIRED"
            - "line_status == REMOVED"
            - "sess_status == OPEN"
            - "sess_total == 0"

      - name: cv_mismatch_flags_session_opens_case_suspends_member
        grounds:
          - state_machines.ExitVerification.PENDING_to_MISMATCH
          - state_machines.ScanSession.EXIT_PENDING_to_FLAGGED
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - calculations.lp_escalation
        distinguishing_aspect: |
          Depth-3 chain triggered by POST /exit-verifications/{id}/cv-report
          (a different trigger than run-closeout): verification MISMATCH +
          session FLAGGED (hop 1) -> LP case OPEN created and member strikes
          incremented (hop 2) -> strikes reaching lp_suspend_strikes suspends
          the member (hop 3).
        test_recipe:
          setup:
            - "Club (CV_ARCH mode), lp_suspend_strikes patched to 1 (OCC), lp_unscanned_threshold default 2"
            - "PLUS member, UNIT item at 300c; clock 12:00"
            - "Session scans 3 units, pays, exit-scan creates PENDING CV verification (expected 3)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club TC2", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "CV_ARCH" }
              as: PlatformAdmin
              captures: { club_id: $.data.id, club_v: $.data.version }
            - call: "PATCH /clubs/${club_id}"
              payload: { expected_club_version: "${club_v}", lp_suspend_strikes: 1 }
              as: ClubManager
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "SODA-12", item_name: "Soda 12pk", pricing_mode: "UNIT", unit_price_cents: 300 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /members"
              payload: { tier: "PLUS", birth_year: 1995, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { session_id: $.data.id }
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${item_id}", quantity: 3 }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /scan-sessions/${session_id}/pay"
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /scan-sessions/${session_id}/exit-scan"
              as: Member
              as_user_id: "${member_id}"
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /exit-verifications/${ev_id}/cv-report"
              payload: { observed_item_count: 5 }
              as: Associate
              as_user_id: "assoc-flagger-1"
              captures: { ev_status: $.data.status }
            - call: "GET /scan-sessions/${session_id}"
              as: LossPreventionOfficer
              captures: { sess_status: $.data.status }
            - call: "GET /loss-prevention-cases"
              as: LossPreventionOfficer
              captures: { case_status: "$.data[0].status", case_tier: "$.data[0].tier", case_unscanned: "$.data[0].unscanned_count" }
            - call: "GET /members/${member_id}"
              as: LossPreventionOfficer
              captures: { member_status: $.data.status, member_strikes: $.data.unscanned_strikes }
          assert:
            - "ev_status == MISMATCH"
            - "sess_status == FLAGGED"
            - "case_status == OPEN and case_tier == REVIEW and case_unscanned == 2"
            - "member_strikes == 1"
            - "member_status == SUSPENDED"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pending_intercept_safety_beats_declined_tender_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_INTERCEPT_PENDING]
          - errors[ERR_TENDER_DECLINED]
        distinguishing_aspect: |
          Category pair business_safety (p5) vs business_fiscal (p9): a pay
          attempt that violates BOTH the pending-intercept gate and the
          tender gate must return ERR_INTERCEPT_PENDING, proving safety is
          evaluated before fiscal.
        test_recipe:
          setup:
            - "Club (RECEIPT_CODE), ALCOHOL item at 2000c, PLUS member with tender_status DECLINED"
            - "Clock 12:00; session scans the alcohol -> REVIEW_HOLD with PENDING intercept"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club PP1", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "VODKA-1L", item_name: "Vodka 1L", pricing_mode: "UNIT", unit_price_cents: 2000, restricted_class: "ALCOHOL" }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /members"
              payload: { tier: "PLUS", birth_year: 1990, home_club_id: "${club_id}", tender_status: "DECLINED" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { session_id: $.data.id }
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${item_id}", quantity: 1 }
              as: Member
              as_user_id: "${member_id}"
          trigger:
            - call: "POST /scan-sessions/${session_id}/pay"
              as: Member
              as_user_id: "${member_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INTERCEPT_PENDING (not ERR_TENDER_DECLINED)"
            - "ScanSession.${session_id}.status == REVIEW_HOLD (unchanged)"

      - name: invalid_window_temporal_beats_slot_capacity_constraint
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_SLOT_WINDOW_INVALID]
          - errors[ERR_SLOT_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Category pair business_temporal (p6) vs business_constraint (p7):
          a stage request whose window is inverted AND whose slot is at
          capacity must return ERR_SLOT_WINDOW_INVALID, proving temporal
          sanity is evaluated before capacity.
        test_recipe:
          setup:
            - "Club patched to staging_slot_capacity 1 (OCC)"
            - "Order A already staged in slot S1 over [09:00,13:00)"
            - "Order B exists in PLACED"
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "Club PP2", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id, club_v: $.data.version }
            - call: "PATCH /clubs/${club_id}"
              payload: { expected_club_version: "${club_v}", staging_slot_capacity: 1 }
              as: ClubManager
            - call: "POST /members"
              payload: { tier: "CLUB", birth_year: 1982, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /clubs/${club_id}/curbside-orders"
              payload: { item_count: 2 }
              as: Member
              as_user_id: "${member_id}"
              captures: { order_a: $.data.id }
            - call: "POST /curbside-orders/${order_a}/stage"
              payload: { staging_slot_label: "S1", window_start_iso: "2026-09-01T09:00:00Z", window_end_iso: "2026-09-01T13:00:00Z" }
              as: Associate
            - call: "POST /clubs/${club_id}/curbside-orders"
              payload: { item_count: 1 }
              as: Member
              as_user_id: "${member_id}"
              captures: { order_b: $.data.id }
          trigger:
            - call: "POST /curbside-orders/${order_b}/stage"
              payload: { staging_slot_label: "S1", window_start_iso: "2026-09-01T12:00:00Z", window_end_iso: "2026-09-01T11:00:00Z" }
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SLOT_WINDOW_INVALID (not ERR_SLOT_CAPACITY_EXCEEDED)"
            - "CurbsideOrder.${order_b}.status == PLACED (unchanged)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: cv_unscanned_at_threshold_mismatches_one_below_verifies
        grounds:
          - calculations.lp_escalation
          - entities.Club.fields.lp_unscanned_threshold
        distinguishing_aspect: |
          Metric = unscanned item count; endpoint = POST
          /exit-verifications/{id}/cv-report; the boundary is >= : unscanned
          == threshold (2) flips to MISMATCH while threshold - 1 (1) verifies.
        test_recipe:
          setup:
            - "Club CV_ARCH with default lp_unscanned_threshold 2 and lp_suspend_strikes 3"
            - "Two PLUS members, each with a paid session expecting 3 items, each at EXIT_PENDING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club BP1", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "CV_ARCH" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "CHIPS", item_name: "Chips", pricing_mode: "UNIT", unit_price_cents: 200 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /members"
              payload: { tier: "PLUS", birth_year: 1991, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_a: $.data.id }
            - call: "POST /members"
              payload: { tier: "PLUS", birth_year: 1993, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_b: $.data.id }
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_a}"
              captures: { sess_a: $.data.id }
            - call: "POST /scan-sessions/${sess_a}/lines"
              payload: { catalog_item_id: "${item_id}", quantity: 3 }
              as: Member
              as_user_id: "${member_a}"
            - call: "POST /scan-sessions/${sess_a}/pay"
              as: Member
              as_user_id: "${member_a}"
            - call: "POST /scan-sessions/${sess_a}/exit-scan"
              as: Member
              as_user_id: "${member_a}"
              captures: { ev_a: $.data.id }
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_b}"
              captures: { sess_b: $.data.id }
            - call: "POST /scan-sessions/${sess_b}/lines"
              payload: { catalog_item_id: "${item_id}", quantity: 3 }
              as: Member
              as_user_id: "${member_b}"
            - call: "POST /scan-sessions/${sess_b}/pay"
              as: Member
              as_user_id: "${member_b}"
            - call: "POST /scan-sessions/${sess_b}/exit-scan"
              as: Member
              as_user_id: "${member_b}"
              captures: { ev_b: $.data.id }
          trigger:
            - call: "POST /exit-verifications/${ev_a}/cv-report"
              payload: { observed_item_count: 4 }
              as: Associate
              captures: { ev_a_status: $.data.status }
            - call: "POST /exit-verifications/${ev_b}/cv-report"
              payload: { observed_item_count: 5 }
              as: Associate
              captures: { ev_b_status: $.data.status }
          assert:
            - "ev_a_status == VERIFIED (unscanned 1 < threshold 2)"
            - "ev_b_status == MISMATCH (unscanned 2 >= threshold 2)"
            - "ScanSession.${sess_a}.status == EXITED"
            - "ScanSession.${sess_b}.status == FLAGGED"

      - name: empty_cart_pay_rejected_single_line_accepted
        grounds:
          - errors[ERR_EMPTY_CART]
          - state_machines.ScanSession.OPEN_to_PAID
        distinguishing_aspect: |
          Metric = non-REMOVED line count (zero-collection edge, not a numeric
          threshold); endpoint = POST /scan-sessions/{id}/pay. Zero lines
          rejects with ERR_EMPTY_CART; adding exactly one line makes the same
          call succeed.
        test_recipe:
          setup:
            - "Club (RECEIPT_CODE), UNIT item at 450c, CLUB member, clock 12:00, empty session"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club BP2", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "BREAD", item_name: "Bread", pricing_mode: "UNIT", unit_price_cents: 450 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /members"
              payload: { tier: "CLUB", birth_year: 1987, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { session_id: $.data.id }
          trigger:
            - call: "POST /scan-sessions/${session_id}/pay"
              as: Member
              as_user_id: "${member_id}"
              captures: { err: $.data.error_id }
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${item_id}", quantity: 1 }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /scan-sessions/${session_id}/pay"
              as: Member
              as_user_id: "${member_id}"
              captures: { paid_status: $.data.status, paid_total: $.data.final_total_cents }
          assert:
            - "err == ERR_EMPTY_CART"
            - "paid_status == PAID"
            - "paid_total == 450"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: pay_blocked_until_restricted_intercept_resolved
        grounds:
          - state_machines.ScanSession.OPEN_to_PAID
          - state_machines.RestrictedIntercept.PENDING_to_APPROVED
          - errors[ERR_INTERCEPT_PENDING]
        distinguishing_aspect: |
          Entity pair ScanSession -> RestrictedIntercept: the pay transition
          on ScanSession is gated by the state of a DIFFERENT entity (no
          PENDING intercept may exist); after associate approval the same pay
          call succeeds.
        test_recipe:
          setup:
            - "Club (RECEIPT_CODE), PHARMACY item at 1200c, CLUB member, clock 12:00"
            - "Session scans the pharmacy item -> intercept PENDING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club CE1", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "RX-VID", item_name: "Pharmacy vitamins", pricing_mode: "UNIT", unit_price_cents: 1200, restricted_class: "PHARMACY" }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /members"
              payload: { tier: "CLUB", birth_year: 1990, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { session_id: $.data.id }
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${item_id}", quantity: 1 }
              as: Member
              as_user_id: "${member_id}"
            - call: "GET /scan-sessions/${session_id}/intercepts"
              as: Associate
              captures: { int_id: "$.data[0].id" }
          trigger:
            - call: "POST /scan-sessions/${session_id}/pay"
              as: Member
              as_user_id: "${member_id}"
              captures: { err: $.data.error_id }
            - call: "POST /intercepts/${int_id}/resolve"
              payload: { decision: "APPROVE", pharmacist_note: "verified at counter" }
              as: Associate
            - call: "POST /scan-sessions/${session_id}/pay"
              as: Member
              as_user_id: "${member_id}"
              captures: { paid_status: $.data.status, paid_total: $.data.final_total_cents }
          assert:
            - "err == ERR_INTERCEPT_PENDING"
            - "paid_status == PAID"
            - "paid_total == 1200"

      - name: exit_scan_requires_paid_session
        grounds:
          - state_machines.ScanSession.PAID_to_EXIT_PENDING
          - entities.ExitVerification.fields.session_id
          - errors[ERR_SESSION_NOT_PAID]
        distinguishing_aspect: |
          Entity pair ExitVerification -> ScanSession (different pair than
          ScanSession -> RestrictedIntercept): creating an ExitVerification
          via exit-scan requires the session to be PAID; on an unpaid session
          the call fails with ERR_SESSION_NOT_PAID.
        test_recipe:
          setup:
            - "Club (RECEIPT_CODE), UNIT item at 700c, CLUB member, clock 12:00, session with one scanned line, unpaid"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club CE2", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "SOAP", item_name: "Soap", pricing_mode: "UNIT", unit_price_cents: 700 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /members"
              payload: { tier: "CLUB", birth_year: 1989, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { session_id: $.data.id }
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${item_id}", quantity: 1 }
              as: Member
              as_user_id: "${member_id}"
          trigger:
            - call: "POST /scan-sessions/${session_id}/exit-scan"
              as: Member
              as_user_id: "${member_id}"
              captures: { err: $.data.error_id }
            - call: "POST /scan-sessions/${session_id}/pay"
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /scan-sessions/${session_id}/exit-scan"
              as: Member
              as_user_id: "${member_id}"
              captures: { ev_status: $.data.status, ev_expected: $.data.expected_item_count }
          assert:
            - "err == ERR_SESSION_NOT_PAID"
            - "ev_status == PENDING"
            - "ev_expected == 1"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: offer_window_closed_interval_touching_endpoints_conflict
        grounds:
          - calculations.offer_window_overlap
          - errors[ERR_OFFER_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Resource = (club, catalog_item) offer windows; interval semantics =
          CLOSED interval: a new window starting exactly when the existing one
          ends (2026-09-10T00:00:00Z) still conflicts because both endpoints
          are inclusive; a window starting the next instant succeeds.
        test_recipe:
          setup:
            - "Club, UNIT item; offer A on the item over [2026-09-01, 2026-09-10T00:00:00Z]"
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "Club TO1", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "COFFEE", item_name: "Coffee", pricing_mode: "UNIT", unit_price_cents: 800 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /clubs/${club_id}/instant-savings-offers"
              payload: { catalog_item_id: "${item_id}", discount_cents: 100, valid_from_iso: "2026-09-01T00:00:00Z", valid_to_iso: "2026-09-10T00:00:00Z", per_member_limit: 5 }
              as: ClubManager
          trigger:
            - call: "POST /clubs/${club_id}/instant-savings-offers"
              payload: { catalog_item_id: "${item_id}", discount_cents: 120, valid_from_iso: "2026-09-10T00:00:00Z", valid_to_iso: "2026-09-20T00:00:00Z", per_member_limit: 5 }
              as: ClubManager
              captures: { err: $.data.error_id }
            - call: "POST /clubs/${club_id}/instant-savings-offers"
              payload: { catalog_item_id: "${item_id}", discount_cents: 120, valid_from_iso: "2026-09-10T00:00:01Z", valid_to_iso: "2026-09-20T00:00:00Z", per_member_limit: 5 }
              as: ClubManager
              captures: { offer_c: $.data.id }
          assert:
            - "err == ERR_OFFER_WINDOW_CONFLICT (touching closed endpoints conflict)"
            - "Second offer created successfully (id present)"

      - name: staging_slot_half_open_adjacency_and_capacity
        grounds:
          - calculations.staging_slot_occupancy
          - errors[ERR_SLOT_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Resource = curbside staging slot; interval semantics = HALF-OPEN
          [start, end) with AGGREGATE capacity (not pairwise rejection):
          adjacent windows [10,11) and [11,12) coexist at capacity 1, while a
          genuinely overlapping third window is rejected only when occupancy
          reaches the capacity count.
        test_recipe:
          setup:
            - "Club patched to staging_slot_capacity 1 (OCC); member with orders A, B, C"
            - "Order A staged in slot S1 over [10:00,11:00)"
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "Club TO2", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id, club_v: $.data.version }
            - call: "PATCH /clubs/${club_id}"
              payload: { expected_club_version: "${club_v}", staging_slot_capacity: 1 }
              as: ClubManager
            - call: "POST /members"
              payload: { tier: "CLUB", birth_year: 1984, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /clubs/${club_id}/curbside-orders"
              payload: { item_count: 1 }
              as: Member
              as_user_id: "${member_id}"
              captures: { order_a: $.data.id }
            - call: "POST /curbside-orders/${order_a}/stage"
              payload: { staging_slot_label: "S1", window_start_iso: "2026-09-01T10:00:00Z", window_end_iso: "2026-09-01T11:00:00Z" }
              as: Associate
            - call: "POST /clubs/${club_id}/curbside-orders"
              payload: { item_count: 1 }
              as: Member
              as_user_id: "${member_id}"
              captures: { order_b: $.data.id }
            - call: "POST /clubs/${club_id}/curbside-orders"
              payload: { item_count: 1 }
              as: Member
              as_user_id: "${member_id}"
              captures: { order_c: $.data.id }
          trigger:
            - call: "POST /curbside-orders/${order_b}/stage"
              payload: { staging_slot_label: "S1", window_start_iso: "2026-09-01T11:00:00Z", window_end_iso: "2026-09-01T12:00:00Z" }
              as: Associate
              captures: { b_status: $.data.status }
            - call: "POST /curbside-orders/${order_c}/stage"
              payload: { staging_slot_label: "S1", window_start_iso: "2026-09-01T10:30:00Z", window_end_iso: "2026-09-01T11:30:00Z" }
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "b_status == STAGING (adjacent half-open windows coexist)"
            - "err == ERR_SLOT_CAPACITY_EXCEEDED"
            - "CurbsideOrder.${order_c}.status == PLACED"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: pay_then_void_restores_member_charged_cents
        grounds:
          - state_machines.ScanSession.PAID_to_VOIDED
          - entities.Member.fields.lifetime_charged_cents
          - entities.ScanSession.fields.refunded_cents
        distinguishing_aspect: |
          Conserved quantity = member charged cents: pay adds exactly
          final_total_cents and void-payment subtracts exactly the same
          amount, returning Member.lifetime_charged_cents to its pre-pay
          value with zero drift; refunded_cents pins the compensation amount.
        test_recipe:
          setup:
            - "Club (RECEIPT_CODE), UNIT item at 750c, PLUS member, clock 12:00"
            - "Session with qty 2 (1500c); member.lifetime_charged_cents == 0 before pay"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clubs"
              payload: { name: "Club CI1", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id }
            - call: "POST /clubs/${club_id}/catalog-items"
              payload: { sku: "TOWELS", item_name: "Towels", pricing_mode: "UNIT", unit_price_cents: 750 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /members"
              payload: { tier: "PLUS", birth_year: 1979, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /scan-sessions"
              payload: { club_id: "${club_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { session_id: $.data.id }
            - call: "POST /scan-sessions/${session_id}/lines"
              payload: { catalog_item_id: "${item_id}", quantity: 2 }
              as: Member
              as_user_id: "${member_id}"
          trigger:
            - call: "POST /scan-sessions/${session_id}/pay"
              as: Member
              as_user_id: "${member_id}"
            - call: "GET /members/${member_id}"
              as: PlatformAdmin
              captures: { charged_after_pay: $.data.lifetime_charged_cents, pending_after_pay: $.data.cash_rewards_pending_cents }
            - call: "POST /scan-sessions/${session_id}/void-payment"
              as: LossPreventionOfficer
              captures: { refunded: $.data.refunded_cents }
            - call: "GET /members/${member_id}"
              as: PlatformAdmin
              captures: { charged_after_void: $.data.lifetime_charged_cents, pending_after_void: $.data.cash_rewards_pending_cents }
          assert:
            - "charged_after_pay == 1500"
            - "pending_after_pay == 30"
            - "refunded == 1500"
            - "charged_after_void == 0 (invariant: pay + void conserves charged cents)"
            - "pending_after_void == 0 (invariant: reward accrual compensated)"

      - name: stage_then_cancel_restores_slot_occupancy
        grounds:
          - state_machines.CurbsideOrder.STAGING_to_CANCELLED
          - calculations.staging_slot_occupancy
        distinguishing_aspect: |
          Conserved quantity = staging slot occupancy count (not money):
          staging order A fills the capacity-1 slot so order B is rejected;
          cancelling A releases the occupancy and the identical stage call
          for B now succeeds — forward + compensating actions leave occupancy
          unchanged.
        test_recipe:
          setup:
            - "Club patched to staging_slot_capacity 1 (OCC); member with orders A and B"
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "Club CI2", open_minute: 600, early_shopping_start_minute: 480, exit_verification_mode: "RECEIPT_CODE" }
              as: PlatformAdmin
              captures: { club_id: $.data.id, club_v: $.data.version }
            - call: "PATCH /clubs/${club_id}"
              payload: { expected_club_version: "${club_v}", staging_slot_capacity: 1 }
              as: ClubManager
            - call: "POST /members"
              payload: { tier: "CLUB", birth_year: 1981, home_club_id: "${club_id}" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /clubs/${club_id}/curbside-orders"
              payload: { item_count: 2 }
              as: Member
              as_user_id: "${member_id}"
              captures: { order_a: $.data.id }
            - call: "POST /clubs/${club_id}/curbside-orders"
              payload: { item_count: 3 }
              as: Member
              as_user_id: "${member_id}"
              captures: { order_b: $.data.id }
          trigger:
            - call: "POST /curbside-orders/${order_a}/stage"
              payload: { staging_slot_label: "S1", window_start_iso: "2026-09-01T10:00:00Z", window_end_iso: "2026-09-01T11:00:00Z" }
              as: Associate
            - call: "POST /curbside-orders/${order_b}/stage"
              payload: { staging_slot_label: "S1", window_start_iso: "2026-09-01T10:30:00Z", window_end_iso: "2026-09-01T11:30:00Z" }
              as: Associate
              captures: { err_blocked: $.data.error_id }
            - call: "POST /curbside-orders/${order_a}/cancel"
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /curbside-orders/${order_b}/stage"
              payload: { staging_slot_label: "S1", window_start_iso: "2026-09-01T10:30:00Z", window_end_iso: "2026-09-01T11:30:00Z" }
              as: Associate
              captures: { b_status: $.data.status }
          assert:
            - "err_blocked == ERR_SLOT_CAPACITY_EXCEEDED"
            - "b_status == STAGING (occupancy restored after cancel)"
            - "CurbsideOrder.${order_a}.status == CANCELLED"
