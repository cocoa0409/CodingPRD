              as: FinanceController
              captures: { mon_pp: $.data.id }
            - call: "POST /v1/capacity-contracts"
              payload: { account_id: "${acct_pp}", term_start: "2026-09-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z", base_credits: 1000, overage_rate_per_credit: 3.00, rollover_cap_credits: 200, currency: "USD" }
              as: FinanceController
              captures: { ct_pp: $.data.id }
            - call: "POST /v1/capacity-contracts/${ct_pp}/activate"
              payload: {}
              as: FinanceController
              as_user_id: "fin-sod-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /v1/warehouses/${wh_pp}/resume"
              payload: {}
              as: DataEngineer
            - call: "POST /v1/warehouse-sessions"
              payload: { warehouse_id: "${wh_pp}" }
              as: DataEngineer
              captures: { ses_pp: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:30:00Z" }
              as: PlatformOperator
            - call: "GET /v1/warehouses/${wh_pp}"
              payload: {}
              as: DataEngineer
              captures: { wh_pp_v: $.data.version }
            - call: "POST /v1/warehouse-sessions/${ses_pp}/close"
              payload: { expected_warehouse_version: "${wh_pp_v}" }
              as: DataEngineer
          trigger:
            - call: "POST /v1/capacity-contracts/${ct_pp}/close"
              payload: {}
              as: FinanceController
