  # ===========================================================================
  # RULE 7 — Cross-entity state dependency on three different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: draw_creation_gated_on_merchant_enrollment_state
        grounds:
          - validations.priority_14
          - errors.ERR_INVALID_MERCHANT_STATE
          - state_machines.Merchant.APPROVED_to_SUSPENDED
          - state_machines.Merchant.SUSPENDED_to_APPROVED
          - endpoints.POST_/funding-draws
        distinguishing_aspect: |
          ENTITY PAIR (Merchant -> FundingDraw): the legality of a FundingDraw WRITE depends
          on the enrollment_status of the Merchant, an entity the payload never names. The
          identical request body is rejected while the merchant is SUSPENDED and accepted
          after REINSTATE, with the draw's own row, the milestone and the loan account
          unchanged in between — nothing about the draw explains the difference.
        test_recipe:
          setup:
            - "Program, APPROVED merchant, ACTIVE enrollment, ACTIVATED application, PROMO_ACTIVE LoanAccount at version 1."
            - "Project 3500000 with milestone 1 (3000 bps) VERIFIED, so max_fundable_now_cents == 1050000."
            - "A ProgramAdmin then suspends the merchant with action=SUSPEND, reason_code=ANALYST_ACTION."
            - "The suspension cascade moves the ACTIVE enrollment to SUSPENDED; there are no REQUESTED draws to deny."
