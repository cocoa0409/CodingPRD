            - call: "PATCH /flight-legs/${leg_id}"
              payload: { dep_utc: "2026-11-02T10:00:00Z", arr_utc: "2026-11-02T11:00:00Z" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { err3: "$.data.error_id" }
          assert:
            - "all three trigger calls -> HTTP 409 with data.error_id == \"ERR_FLIGHT_LEG_STATE_INVALID\""
            - "FlightLeg.${leg_id}.status == \"CANCELLED\", cancellation_reason == \"FLEET_REALLOCATION\", dep_utc still \"2026-11-02T08:00:00Z\", assigned_aircraft_id == null, departure_slot_holding_id == null"
            - "SlotHolding.${sh_id}.attached_operations == 0 and utilization_pct_as_filed == 0.00"
            - "Aircraft.${ac_id}.assigned_leg_count == 0 and rotation_feasibility_status == \"UNCHECKED\""
            - "ScheduleVersion.${sv_id}.leg_count == 1, unslotted_leg_count == 0 (the cancelled leg leaves the unslotted set), schedule_compliance_score == 100.00"

      - name: cancelling_an_already_cancelled_leg_is_rejected_on_the_second_call
        claim_type: idempotency
        grounds:
          - state_machines.FlightLeg.SLOT_BACKED_to_CANCELLED
          - "validations.priority_35_ERR_FLIGHT_LEG_STATE_INVALID"
        distinguishing_aspect: |
          The cancel action is NOT idempotent by design: the first call succeeds and the second must
          return ERR_FLIGHT_LEG_STATE_INVALID (409) rather than a second 200. A silently idempotent
          cancel would let a caller double-decrement counters such as attached_operations.
        test_recipe:
          setup:
            - "Home carrier HX; FRA and MUC; Season W26 OPEN; ScheduleVersion W26-K2 with one DRAFT FRA->MUC leg on 2026-11-02 08:00Z->09:00Z."
          setup_api_calls:
