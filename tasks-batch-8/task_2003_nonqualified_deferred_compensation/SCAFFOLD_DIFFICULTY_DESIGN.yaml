          Pair DistributionRequest -> SeparationCase (a different pair than
          election/window): verify-event for a SEPARATION request fails with
          ERR_EVENT_NOT_CONFIRMED while the linked case is merely
          EVIDENCE_SUBMITTED, and succeeds after the case reaches
          DETERMINED_SEPARATED.
