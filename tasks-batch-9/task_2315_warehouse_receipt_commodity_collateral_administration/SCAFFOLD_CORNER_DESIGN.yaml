      - name: claim_adjudicate_twice_rejected
        claim_type: idempotency
        grounds: ["state_machines.IndemnityClaim.FILED_to_ALLOWED", "validations[priority 55]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second decision=ALLOW on an already ALLOWED claim returns 409 ERR_INVALID_STATE; entitlement_cents and allowed_cents keep their first-adjudication values."
        test_recipe:
          setup:
            - "Base chain complete; DECLARE at 400 c/bu on 2026-09-01 then OPEN_CLAIMS; Ada Farms files 400000 on WR-0001 and it is ALLOWED once."
            - "Entitlement at 400 c/bu: 949 * 400 = 379600 minus (PROVISIONAL storage 9300 for the 28 inclusive days to the declaration date + receiving 5694) = 364606; allowed = min(claimed 400000, 364606)."
