            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool A", pool_principal_cents: 100000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-12-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off_id: "$.data.id" } }
            - { call: "POST /network/offerings/${off_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 10000000 }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { cert_id: "$.data.id" } }
            - { call: "POST /network/commitments/${cert_id}/approve-diligence", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
            - { call: "POST /network/commitments/${cert_id}/fund", payload: {}, as: BuyerUser, as_user_id: "${buyer_id}" }
          trigger:
            - { call: "POST /network/servicing-agreements/${ag_id}/terminate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_AGREEMENT_HAS_OPEN_CERTIFICATES"
            - "GET /network/servicing-agreements/${ag_id} status == ACTIVE (unchanged)"

      - name: agreement_create_on_suspended_cuso_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_CUSO_SUSPENDED]"]
        distinguishing_aspect: "Creating a servicing agreement under a CUSO that was SUSPENDED by the exam-finalize cascade -> ERR_CUSO_SUSPENDED."
        test_recipe:
          setup: ["CUSO suspended: IN_PROGRESS exam with open CRITICAL finding was finalized; originator CU exists"]
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-ORIG", legal_name: "Originator CU", cu_type: "ORIGINATOR", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { orig_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/exams", payload: { cuso_id: "${cuso_id}", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-15T00:00:00Z" }, as: RegulatorUser, captures: { exam_id: "$.data.id" } }
            - { call: "POST /network/findings", payload: { exam_id: "${exam_id}", severity: "CRITICAL", description: "CUSO net worth deficiency", remediation_due_date: "2026-10-01T00:00:00Z" }, as: RegulatorUser, as_user_id: "reg-1" }
            - { call: "POST /network/exams/${exam_id}/finalize", payload: {}, as: RegulatorUser }
          trigger:
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_CUSO_SUSPENDED"

      - name: investment_cap_error_path
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVESTMENT_CAP_EXCEEDED]"]
        excluded_because:
          difficulty_instance: investment_cap_equality_boundary
          rationale: "The +1-cent-over-cap approval failure is asserted there."

      - name: cure_period_expired_error_path
        claim_type: violation_to_error
        grounds: ["errors[ERR_CURE_PERIOD_EXPIRED]"]
        excluded_because:
          difficulty_instance: cure_deadline_inclusive_boundary
          rationale: "The one-second-past-deadline failure is asserted there."

      - name: exam_overlap_error_path
        claim_type: violation_to_error
        grounds: ["errors[ERR_EXAM_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: exam_window_half_open_adjacency
          rationale: "The overlapping-window rejection is asserted there."

      - name: remittance_overlap_error_path
        claim_type: violation_to_error
        grounds: ["errors[ERR_REMITTANCE_PERIOD_OVERLAP]"]
        excluded_because:
          difficulty_instance: remittance_period_closed_overlap
          rationale: "The shared-day rejection is asserted there."

      - name: agreement_not_active_error_path
        claim_type: violation_to_error
        grounds: ["errors[ERR_AGREEMENT_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: offering_creation_requires_active_agreement
          rationale: "Offering creation under a DRAFT agreement is asserted to fail with this error there."

      - name: offering_not_open_error_path
        claim_type: violation_to_error
        grounds: ["errors[ERR_OFFERING_NOT_OPEN]"]
        excluded_because:
          difficulty_instance: fund_requires_open_offering
          rationale: "Fund against a CLOSED offering is asserted to fail with this error there."

      - name: credit_union_not_active_error_path
        claim_type: violation_to_error
        grounds: ["errors[ERR_CREDIT_UNION_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: referential_beats_temporal_on_commitment
          rationale: "Commitment by a SUSPENDED buyer is asserted to fail with this error there."

      # ERR_STALE_VERSION is exercised by the real instance
      # cross_cutting.surveillance_occ_stale_version_rejected below (OCC is a
      # cross-cutting layer, not one of the nine §0.5 difficulty rules).

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: buyer_role_cannot_create_cuso_forbidden
        claim_type: rbac_denial
        grounds: ["roles.BuyerUser", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "BuyerUser calling POST /network/cusos (NetworkAdmin-only) -> ERR_FORBIDDEN_FOR_ROLE (403)."
        test_recipe:
          setup: ["Buyer CU registered"]
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-BUY", legal_name: "Buyer CU", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { buyer_id: "$.data.id" } }
          trigger:
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO X", service_line: "LENDING" }, as: BuyerUser, as_user_id: "${buyer_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_FORBIDDEN_FOR_ROLE"

      - name: treasury_role_cannot_approve_investment_forbidden
        claim_type: rbac_denial
        grounds: ["roles.TreasuryUser", "roles.RegulatorUser", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "Approval chain: the TreasuryUser who submitted an investment cannot approve it (RegulatorUser-only) -> ERR_FORBIDDEN_FOR_ROLE."
        test_recipe:
          setup: ["Investor CU and CUSO registered; investment PENDING_REVIEW"]
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-INV", legal_name: "Investor CU", cu_type: "DUAL", total_assets_cents: 5000000000, net_worth_cents: 500000000 }, as: NetworkAdmin, captures: { inv_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/cuso-investments", payload: { credit_union_id: "${inv_id}", cuso_id: "${cuso_id}", amount_cents: 1000000 }, as: TreasuryUser, as_user_id: "${inv_id}", captures: { inv_row_id: "$.data.id" } }
          trigger:
            - { call: "POST /network/cuso-investments/${inv_row_id}/approve", payload: {}, as: TreasuryUser, as_user_id: "${inv_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_FORBIDDEN_FOR_ROLE"

      - name: buyer_cannot_touch_other_buyers_certificate
        claim_type: rbac_denial
        grounds: ["validations[priority=3]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "BuyerUser B calling approve-diligence on BuyerUser A's certificate -> ERR_NOT_RESOURCE_OWNER (403) even though the role is allowed on the endpoint."
        test_recipe:
          setup: ["Certificate in PENDING_DILIGENCE owned by buyer A"]
