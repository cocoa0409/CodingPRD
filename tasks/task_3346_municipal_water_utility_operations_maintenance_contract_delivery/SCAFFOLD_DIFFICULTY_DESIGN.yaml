  - rule_id: transitive_cascade
    instances:
      - name: pm_miss_cascade_through_schedule_to_asset_to_capital_work_order
        grounds:
          - state_machines.PMSchedule.DUE_to_OVERDUE
          - state_machines.Asset.IN_SERVICE_to_REPLACEMENT_FLAGGED
          - state_machines.WorkOrder.DRAFT_to_SCHEDULED
          - calculations.expense_class_boundary
        distinguishing_aspect: |
          A depth-4 chain in which each hop is caused by the previous hop, not by the original PM evaluation: the evaluation moves the
          PMSchedule to OVERDUE, that OVERDUE row's missed_occurrence_count reaching three moves its owning Asset to REPLACEMENT_FLAGGED,
          and the Asset entering REPLACEMENT_FLAGGED is what creates the DRAFT capital WorkOrder, which is then classified on scheduling.
        test_recipe:
          setup:
            - "one OPERATING contract with one in-service Asset past the end of its nominal useful life"
            - "one ACTIVE PMSchedule on that Asset with a 30 day frequency, last due 2026-09-20T00:00:00Z and a preventive WorkOrder that never closed"
            - "the logical clock reads 2026-10-15T00:00:00Z so the grace window closed and this is the third overdue occurrence"
