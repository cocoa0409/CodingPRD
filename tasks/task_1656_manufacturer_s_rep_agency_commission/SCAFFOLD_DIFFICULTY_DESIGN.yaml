  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: registration_windows_half_open_adjacency
        grounds:
          - state_machines.ProjectRegistration.SUBMITTED_to_APPROVED
          - errors[ERR_PROTECTION_WINDOW_OVERLAP]
          - constants.PROTECTION_DAYS
        distinguishing_aspect: |
          Resource = ProjectRegistration scope (principal, customer, family);
          semantics = half-open [start, end): a new window starting exactly at
          the incumbent's protection_end is NOT an overlap (2027-01-28 ==
          2027-01-28 passes), while any start strictly inside is rejected.
        test_recipe:
          setup:
            - "BASE principal/agreement/schedule/reps/customer"
            - "reg_A APPROVED at 2026-08-01 -> window [2026-08-01T00:00:00Z, 2027-01-28T00:00:00Z)"
            - "reg_B same scope SUBMITTED at 2026-08-01"
            - "clock 2026-09-01: reg_A window still open"
          setup_api_calls:
            - call: "POST /rep-agency/principals"
              payload: { name: "P1", annual_quota_cents: 10000000, notice_period_days: 90 }
              as: AgencyAdmin
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /rep-agency/principals/${p1}/agreements"
              payload: { territory_codes: ["CA", "OR", "WA", "TX"], effective_start: "2026-01-01T00:00:00Z", specify_share_bp: 6000, registered_protection_share_bp: 10000, tail_period_days: 180 }
              as: AgencyAdmin
              captures: { a1: $.data.id }
            - call: "POST /rep-agency/agreements/${a1}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /rep-agency/principals/${p1}/rate-schedules"
              payload: { family_rates: [{ family_code: "CONNECTORS", base_rate_bp: 1000 }, { family_code: "CABLES", base_rate_bp: 800 }], attainment_tiers: [{ min_attainment_bp: 0, multiplier_bp: 10000 }, { min_attainment_bp: 8000, multiplier_bp: 11000 }, { min_attainment_bp: 10000, multiplier_bp: 12500 }], registration_bonus_bp: 200, expected_principal_version: "${p1_v}" }
              as: AgencyAdmin
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R1", territory_codes: ["CA", "OR"] }
              as: AgencyAdmin
              captures: { r1: $.data.id }
            - call: "POST /rep-agency/customers"
              payload: { name: "C1", spec_territory_code: "CA", ship_to_territory_code: "WA" }
              as: AgencyAdmin
              captures: { c1: $.data.id }
            - call: "POST /rep-agency/project-registrations"
              payload: { principal_id: "${p1}", customer_id: "${c1}", family_code: "CONNECTORS", project_name: "Project Alpha" }
              as: Rep
              as_user_id: "${r1}"
              captures: { rega: $.data.id }
            - call: "POST /rep-agency/project-registrations/${rega}/approve"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
            - call: "POST /rep-agency/project-registrations"
              payload: { principal_id: "${p1}", customer_id: "${c1}", family_code: "CONNECTORS", project_name: "Project Beta" }
              as: Rep
              as_user_id: "${r1}"
              captures: { regb: $.data.id }
            - call: "POST /rep-agency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AgencyAdmin
          trigger:
            - call: "POST /rep-agency/project-registrations/${regb}/approve"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
            - call: "POST /rep-agency/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-28T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /rep-agency/project-registrations/${regb}/approve"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
              captures: { pstart: $.data.protection_start, pend: $.data.protection_end }
          assert:
            - "approve at 2026-09-01 rejected: error_id == ERR_PROTECTION_WINDOW_OVERLAP (windows intersect)"
            - "sweep at 2027-01-28 expires reg_A; approve of reg_B then succeeds"
            - "reg_B protection_start == 2027-01-28T00:00:00Z — exactly reg_A's protection_end (adjacent half-open windows allowed)"
            - "reg_B protection_end == 2027-07-27T00:00:00Z (+180d)"

      - name: sample_checkout_buffer_closed_interval
        grounds:
          - state_machines.SampleCheckout.OPEN_to_RETURNED
          - errors[ERR_CHECKOUT_WINDOW_CONFLICT]
          - constants.CHECKOUT_BUFFER_DAYS
        distinguishing_aspect: |
          Resource = SampleUnit; semantics differ from the registration rule: a
          closed blocked interval [checked_out_at, COALESCE(returned_at, due_at)
          + CHECKOUT_BUFFER_DAYS) — a returned unit stays blocked THROUGH the
          +1 day inspection buffer (checkout at 2026-08-10T12:00 fails), and the
          buffer end itself (2026-08-11T00:00:00Z) is the first allowed instant.
        test_recipe:
          setup:
            - "principal P1 only (samples need no agreement); rep R1 [CA]"
            - "unit U9 (value 80,000c) checked out by R1 at 2026-08-01, returned SELLABLE at 2026-08-10T00:00:00Z -> blocked until 2026-08-11T00:00:00Z exclusive"
          setup_api_calls:
            - call: "POST /rep-agency/principals"
              payload: { name: "P1", annual_quota_cents: 10000000, notice_period_days: 90 }
              as: AgencyAdmin
              captures: { p1: $.data.id }
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R1", territory_codes: ["CA", "OR"] }
              as: AgencyAdmin
              captures: { r1: $.data.id }
            - call: "POST /rep-agency/sample-units"
              payload: { principal_id: "${p1}", serial_number: "S-9", family_code: "CONNECTORS", value_cents: 80000 }
              as: PrincipalOps
              as_user_id: "${p1}"
              captures: { u9: $.data.id }
            - call: "POST /rep-agency/sample-checkouts"
              payload: { sample_unit_id: "${u9}" }
              as: Rep
              as_user_id: "${r1}"
              captures: { co1: $.data.id }
            - call: "POST /rep-agency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /rep-agency/sample-checkouts/${co1}/return"
              payload: { condition_on_return: "SELLABLE" }
              as: Rep
              as_user_id: "${r1}"
            - call: "POST /rep-agency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T12:00:00Z" }
              as: AgencyAdmin
          trigger:
            - call: "POST /rep-agency/sample-checkouts"
              payload: { sample_unit_id: "${u9}" }
              as: Rep
              as_user_id: "${r1}"
              captures: { err: $.data.error_id }
            - call: "POST /rep-agency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /rep-agency/sample-checkouts"
              payload: { sample_unit_id: "${u9}" }
              as: Rep
              as_user_id: "${r1}"
              captures: { co2: $.data.id, due2: $.data.due_at }
          assert:
            - "checkout at 2026-08-10T12:00:00Z rejected: error_id == ERR_CHECKOUT_WINDOW_CONFLICT (inside inspection buffer of returned checkout)"
            - "checkout at 2026-08-11T00:00:00Z succeeds (buffer end is the first allowed instant, boundary inclusive-allowed)"
            - "new checkout due_at == 2026-09-10T00:00:00Z (+30d)"
            - "SampleUnit.${u9}.status == CHECKED_OUT again after the second checkout"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: commission_ledger_round_trip_zero_drift
        grounds:
          - calculations.order_line_commission
          - calculations.chargeback_amount
          - calculations.split_waterfall
          - entities.Rep.fields.commission_balance_cents
        distinguishing_aspect: |
          Conserved quantity = per-rep commission cents. Full forward action
          (invoice accruals +34,800 / +23,200) paired with its compensation
          (full-return chargebacks -34,800 / -23,200 at the stored original
          rates) returns every rep balance to the pre-order baseline 0 with zero
          drift, and the RMA final equals the invoiced total 58,000c exactly.
        test_recipe:
          setup:
            - "BASE with O1 invoiced: ACCRUAL R1 +34,800, R2 +23,200 (total 58,000c); balances 34,800 / 23,200"
            - "RMA returning ALL lines in full, approved"
          setup_api_calls:
            - call: "POST /rep-agency/principals"
              payload: { name: "P1", annual_quota_cents: 10000000, notice_period_days: 90 }
              as: AgencyAdmin
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /rep-agency/principals/${p1}/agreements"
              payload: { territory_codes: ["CA", "OR", "WA", "TX"], effective_start: "2026-01-01T00:00:00Z", specify_share_bp: 6000, registered_protection_share_bp: 10000, tail_period_days: 180 }
              as: AgencyAdmin
              captures: { a1: $.data.id }
            - call: "POST /rep-agency/agreements/${a1}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /rep-agency/principals/${p1}/rate-schedules"
              payload: { family_rates: [{ family_code: "CONNECTORS", base_rate_bp: 1000 }, { family_code: "CABLES", base_rate_bp: 800 }], attainment_tiers: [{ min_attainment_bp: 0, multiplier_bp: 10000 }, { min_attainment_bp: 8000, multiplier_bp: 11000 }, { min_attainment_bp: 10000, multiplier_bp: 12500 }], registration_bonus_bp: 200, expected_principal_version: "${p1_v}" }
              as: AgencyAdmin
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R1", territory_codes: ["CA", "OR"] }
              as: AgencyAdmin
              captures: { r1: $.data.id }
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R2", territory_codes: ["WA"] }
              as: AgencyAdmin
              captures: { r2: $.data.id }
            - call: "POST /rep-agency/customers"
              payload: { name: "C1", spec_territory_code: "CA", ship_to_territory_code: "WA" }
              as: AgencyAdmin
              captures: { c1: $.data.id }
            - call: "POST /rep-agency/orders"
              payload: { customer_id: "${c1}", principal_id: "${p1}", external_order_ref: "PO-1", placed_at: "2026-08-01T00:00:00Z", lines: [{ line_id: "L1", family_code: "CONNECTORS", quantity: 100, unit_price_cents: 5000 }, { line_id: "L2", family_code: "CABLES", quantity: 50, unit_price_cents: 2000 }] }
              as: AgencyAdmin
              captures: { o1: $.data.id }
            - call: "POST /rep-agency/orders/${o1}/ship"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
            - call: "POST /rep-agency/orders/${o1}/invoice"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
            - call: "POST /rep-agency/rmas"
              payload: { order_id: "${o1}", lines: [{ line_id: "L1", qty: 100 }, { line_id: "L2", qty: 50 }] }
              as: AgencyAdmin
              captures: { rma1: $.data.id }
            - call: "POST /rep-agency/rmas/${rma1}/approve"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
          trigger:
            - call: "POST /rep-agency/rmas/${rma1}/receive"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
              captures: { fin: $.data.final_chargeback_cents }
          assert:
            - "RMA.${rma1}.final_chargeback_cents == 58000 (L1 50,000 + L2 8,000 at stored original rates 1000/800bp)"
            - "invariant: Rep.${r1}.commission_balance_cents == 0 (34,800 - 30,000 - 4,800) — exactly the pre-order baseline"
            - "invariant: Rep.${r2}.commission_balance_cents == 0 (23,200 - 20,000 - 3,200)"
            - "per-rep sum of CommissionEntry rows for order ${o1} nets to exactly 0 (no drift after forward + compensating pair)"

      - name: sample_unit_count_conservation
        grounds:
          - state_machines.SampleUnit.IN_STOCK_to_CHECKED_OUT
          - state_machines.SampleUnit.CHECKED_OUT_to_IN_STOCK
          - state_machines.SampleCheckout.OPEN_to_RETURNED
        distinguishing_aspect: |
          Conserved quantity = physical sample unit cardinality (different from
          commission cents). Across the checkout loop IN_STOCK -> CHECKED_OUT ->
          IN_STOCK, the count of units of this principal over ALL statuses stays
          exactly 1 at every step — no unit is created or destroyed by the
          forward/compensating pair.
        test_recipe:
          setup:
            - "principal P1; rep R1 [CA]; one unit U1 (serial S-1, value 50,000c) registered"
          setup_api_calls:
            - call: "POST /rep-agency/principals"
              payload: { name: "P1", annual_quota_cents: 10000000, notice_period_days: 90 }
              as: AgencyAdmin
              captures: { p1: $.data.id }
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R1", territory_codes: ["CA"] }
              as: AgencyAdmin
              captures: { r1: $.data.id }
            - call: "POST /rep-agency/sample-units"
              payload: { principal_id: "${p1}", serial_number: "S-1", family_code: "CONNECTORS", value_cents: 50000 }
              as: PrincipalOps
              as_user_id: "${p1}"
              captures: { u1: $.data.id, st0: $.data.status }
          trigger:
            - call: "POST /rep-agency/sample-checkouts"
              payload: { sample_unit_id: "${u1}" }
              as: Rep
              as_user_id: "${r1}"
              captures: { co1: $.data.id }
            - call: "GET /rep-agency/sample-units?principal_id=${p1}&status=IN_STOCK"
              as: AgencyAdmin
            - call: "GET /rep-agency/sample-units?principal_id=${p1}&status=CHECKED_OUT"
              as: AgencyAdmin
            - call: "POST /rep-agency/sample-checkouts/${co1}/return"
              payload: { condition_on_return: "SELLABLE" }
              as: Rep
              as_user_id: "${r1}"
              captures: { co_st: $.data.status }
            - call: "GET /rep-agency/sample-units?principal_id=${p1}&status=IN_STOCK"
              as: AgencyAdmin
          assert:
            - "at registration: status == IN_STOCK and IN_STOCK count == 1"
            - "after checkout (forward action): IN_STOCK count == 0, CHECKED_OUT count == 1, total across statuses == 1"
            - "after SELLABLE return (compensating action): IN_STOCK count == 1 again, checkout status == RETURNED with charge_cents == 0"
            - "unit ${u1} is the same id throughout — quantity conserved, no duplicate unit materialized"
