        grounds:
          - state_machines.Booking.booking_status.CONFIRMED_to_CANCELLED
          - state_machines.Ticket.state.ISSUED_to_SCANNED
          - validations[priority=7]
        distinguishing_aspect: |
          Cross-entity pair Booking->Ticket (different from Booking->ServiceDate above): a CONFIRMED
          Booking cannot cancel once ANY of its Tickets is SCANNED. The GateAgent scanning a Ticket
          (Ticket state) blocks the Booking cancel transition with ERR_PRECONDITION_NOT_MET.
        test_recipe:
          setup:
            - "Operator; PUBLISHED route; ServiceDate seats_total=10 base 4000; ECONOMY OPEN class."
            - "Passenger P confirms+pays a single-leg booking; GateAgent scans the issued ticket."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SupportAgent
            - call: "POST /v1/operators"
              payload: { name: "Coastliner", mode: "BUS" }
              as: ScheduleManager
              captures: { op_id: $.data.id }
            - call: "POST /v1/fare-classes"
              payload: { operator_id: "${op_id}", code: "ECONOMY", seating_mode: "OPEN", refundable: true }
              as: FareAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /v1/routes"
              payload: { operator_id: "${op_id}", origin_code: "NYP", destination_code: "BOS", depart_minute_of_day: 540, arrive_minute_of_day: 780 }
              as: ScheduleManager
              captures: { rt_id: $.data.id }
            - call: "POST /v1/routes/${rt_id}/publish"
              payload: {}
              as: ScheduleManager
            - call: "POST /v1/service-dates"
              payload: { route_id: "${rt_id}", departure_date: "2026-06-15", seats_total: 10, base_fare_cents: 4000 }
              as: ScheduleManager
              captures: { sd_id: $.data.id }
            - call: "POST /v1/passengers"
              payload: { full_name: "Pat Rider", email: "pat@x.com" }
              as: Passenger
              captures: { p_id: $.data.id }
            - call: "POST /v1/bookings"
              payload: { passenger_id: "${p_id}", funding_kind: "CASH", legs: [ { service_date_id: "${sd_id}", fare_class_id: "${fc_id}", leg_order: 1 } ] }
              as: Passenger
              as_user_id: "${p_id}"
              captures: { b_id: $.data.id }
            - call: "GET /v1/service-dates/${sd_id}"
              payload: {}
              as: Passenger
              captures: { sd_v: $.data.version }
            - call: "POST /v1/bookings/${b_id}/confirm"
              payload: { expected_service_date_version: "${sd_v}" }
              as: Passenger
              as_user_id: "${p_id}"
            - call: "POST /v1/bookings/${b_id}/pay"
              payload: {}
              as: Passenger
              as_user_id: "${p_id}"
            - call: "GET /v1/tickets?booking_id=${b_id}"
              payload: {}
              as: GateAgent
              captures: { tk_id: "$.data[0].id" }
            - call: "POST /v1/tickets/${tk_id}/scan"
              payload: {}
              as: GateAgent
          trigger:
            - call: "POST /v1/bookings/${b_id}/cancel"
              payload: { refund_destination: "CASH" }
              as: Passenger
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "cancel returns error_id == ERR_PRECONDITION_NOT_MET (a Ticket is SCANNED)"
            - "Booking.${b_id}.booking_status remains CONFIRMED and Ticket.${tk_id}.state remains SCANNED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: reserved_seat_exact_collision
        grounds:
          - validations[priority=11]
          - entities.BookingLeg.fields.seat_number
          - entities.FareClass.fields.seating_mode
          - errors[ERR_SEAT_TAKEN]
        distinguishing_aspect: |
          Interval semantics A — DISCRETE exact-collision: a RESERVED seat_number occupies a point slot
          on a ServiceDate; a second ACTIVE leg requesting the SAME seat_number on the SAME ServiceDate
          collides exactly (no adjacency tolerance) -> ERR_SEAT_TAKEN. Resource entity: ServiceDate seat map.
        test_recipe:
          setup:
            - "Operator; PUBLISHED route; ServiceDate seats_total=10 base 4000; RESERVED fare class."
            - "Passenger A holds a leg with seat_number '12A'; passenger B tries to hold seat '12A' on the same ServiceDate."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SupportAgent
            - call: "POST /v1/operators"
              payload: { name: "Coastliner", mode: "RAIL" }
              as: ScheduleManager
              captures: { op_id: $.data.id }
            - call: "POST /v1/fare-classes"
              payload: { operator_id: "${op_id}", code: "BUSINESS", seating_mode: "RESERVED", surcharge_cents: 1500 }
              as: FareAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /v1/routes"
              payload: { operator_id: "${op_id}", origin_code: "NYP", destination_code: "BOS", depart_minute_of_day: 540, arrive_minute_of_day: 780 }
              as: ScheduleManager
              captures: { rt_id: $.data.id }
            - call: "POST /v1/routes/${rt_id}/publish"
              payload: {}
              as: ScheduleManager
            - call: "POST /v1/service-dates"
              payload: { route_id: "${rt_id}", departure_date: "2026-06-15", seats_total: 10, base_fare_cents: 4000 }
              as: ScheduleManager
              captures: { sd_id: $.data.id }
            - call: "POST /v1/passengers"
              payload: { full_name: "Passenger A", email: "a@x.com" }
              as: Passenger
              captures: { pa: $.data.id }
            - call: "POST /v1/bookings"
              payload: { passenger_id: "${pa}", funding_kind: "CASH", legs: [ { service_date_id: "${sd_id}", fare_class_id: "${fc_id}", leg_order: 1, seat_number: "12A" } ] }
              as: Passenger
              as_user_id: "${pa}"
              captures: { ba: $.data.id }
            - call: "POST /v1/passengers"
              payload: { full_name: "Passenger B", email: "b@x.com" }
              as: Passenger
              captures: { pb: $.data.id }
          trigger:
            - call: "POST /v1/bookings"
              payload: { passenger_id: "${pb}", funding_kind: "CASH", legs: [ { service_date_id: "${sd_id}", fare_class_id: "${fc_id}", leg_order: 1, seat_number: "12A" } ] }
              as: Passenger
              as_user_id: "${pb}"
              captures: { err: $.data.error_id }
          assert:
            - "passenger B's booking create returns error_id == ERR_SEAT_TAKEN (exact seat collision)"
            - "ServiceDate.${sd_id}.seats_held == 1 (only A's hold persists)"

      - name: connection_buffer_gap_too_tight
        grounds:
          - validations[priority=9]
          - entities.Operator.fields.default_connection_buffer_min
          - entities.Route.fields.depart_minute_of_day
          - errors[ERR_CONNECTION_TOO_TIGHT]
        distinguishing_aspect: |
          Interval semantics B — GAP-vs-BUFFER on a time axis (different geometry from the discrete seat
          collision): adjacent legs require (leg2.depart_minute - leg1.arrive_minute) >= buffer(30). With
          leg1 arriving at minute 600 and leg2 departing at minute 610, the 10-minute gap < 30 ->
          ERR_CONNECTION_TOO_TIGHT. Resource entity: Route schedule (time intervals), not the seat map.
        test_recipe:
          setup:
            - "Operator default_connection_buffer_min=30; two PUBLISHED routes; route1 arrive_minute 600, route2 depart_minute 610 (gap 10 < 30)."
            - "A ServiceDate on each route; OPEN ECONOMY class; passenger builds a 2-leg booking."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SupportAgent
            - call: "POST /v1/operators"
              payload: { name: "Coastliner", mode: "RAIL", default_connection_buffer_min: 30 }
              as: ScheduleManager
              captures: { op_id: $.data.id }
            - call: "POST /v1/fare-classes"
              payload: { operator_id: "${op_id}", code: "ECONOMY", seating_mode: "OPEN" }
              as: FareAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /v1/routes"
              payload: { operator_id: "${op_id}", origin_code: "NYP", destination_code: "PHL", depart_minute_of_day: 540, arrive_minute_of_day: 600 }
              as: ScheduleManager
              captures: { rt1: $.data.id }
            - call: "POST /v1/routes/${rt1}/publish"
              payload: {}
              as: ScheduleManager
            - call: "POST /v1/routes"
              payload: { operator_id: "${op_id}", origin_code: "PHL", destination_code: "WAS", depart_minute_of_day: 610, arrive_minute_of_day: 800 }
              as: ScheduleManager
              captures: { rt2: $.data.id }
            - call: "POST /v1/routes/${rt2}/publish"
              payload: {}
              as: ScheduleManager
            - call: "POST /v1/service-dates"
              payload: { route_id: "${rt1}", departure_date: "2026-06-15", seats_total: 10, base_fare_cents: 4000 }
              as: ScheduleManager
              captures: { sd1: $.data.id }
            - call: "POST /v1/service-dates"
              payload: { route_id: "${rt2}", departure_date: "2026-06-15", seats_total: 10, base_fare_cents: 4000 }
              as: ScheduleManager
              captures: { sd2: $.data.id }
            - call: "POST /v1/passengers"
              payload: { full_name: "Pat Rider", email: "pat@x.com" }
              as: Passenger
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /v1/bookings"
              payload: { passenger_id: "${p_id}", funding_kind: "CASH", legs: [ { service_date_id: "${sd1}", fare_class_id: "${fc_id}", leg_order: 1 }, { service_date_id: "${sd2}", fare_class_id: "${fc_id}", leg_order: 2 } ] }
              as: Passenger
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the 2-leg booking create returns error_id == ERR_CONNECTION_TOO_TIGHT (gap 10 < buffer 30)"
            - "no BookingLeg is created and neither ServiceDate's seats_held changes"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: pass_rides_conserved_on_cancel
        grounds:
          - calculations.pass_rides
          - state_machines.Booking.booking_status.CONFIRMED_to_CANCELLED
          - entities.TravelPass.fields.rides_consumed
          - entities.TravelPass.fields.rides_remaining
        distinguishing_aspect: |
          Conserved quantity #1 = TravelPass rides. Invariant rides_remaining + rides_consumed ==
          rides_total holds before and after. Confirm consumes 1 ride (consumed 1, remaining 9);
          cancelling that booking restores it (consumed 0, remaining 10) — no drift.
        test_recipe:
          setup:
            - "Operator; PUBLISHED route; ServiceDate seats_total=10 base 4000; ECONOMY OPEN class."
            - "Passenger P with TravelPass rides_total=10; P confirms a PASS-funded single-leg booking (rides_consumed=1)."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SupportAgent
            - call: "POST /v1/operators"
              payload: { name: "Coastliner", mode: "BUS" }
              as: ScheduleManager
              captures: { op_id: $.data.id }
            - call: "POST /v1/fare-classes"
              payload: { operator_id: "${op_id}", code: "ECONOMY", seating_mode: "OPEN" }
              as: FareAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /v1/routes"
              payload: { operator_id: "${op_id}", origin_code: "NYP", destination_code: "BOS", depart_minute_of_day: 540, arrive_minute_of_day: 780 }
              as: ScheduleManager
              captures: { rt_id: $.data.id }
            - call: "POST /v1/routes/${rt_id}/publish"
              payload: {}
              as: ScheduleManager
            - call: "POST /v1/service-dates"
              payload: { route_id: "${rt_id}", departure_date: "2026-06-15", seats_total: 10, base_fare_cents: 4000 }
              as: ScheduleManager
              captures: { sd_id: $.data.id }
            - call: "POST /v1/passengers"
              payload: { full_name: "Pat Rider", email: "pat@x.com" }
              as: Passenger
              captures: { p_id: $.data.id }
            - call: "POST /v1/passes"
              payload: { passenger_id: "${p_id}", operator_id: "${op_id}", rides_total: 10, expires_on: "2026-12-31" }
              as: SupportAgent
              captures: { pass_id: $.data.id }
            - call: "POST /v1/bookings"
              payload: { passenger_id: "${p_id}", funding_kind: "PASS", pass_id: "${pass_id}", legs: [ { service_date_id: "${sd_id}", fare_class_id: "${fc_id}", leg_order: 1 } ] }
              as: Passenger
              as_user_id: "${p_id}"
              captures: { b_id: $.data.id }
            - call: "GET /v1/service-dates/${sd_id}"
              payload: {}
              as: Passenger
              captures: { sd_v: $.data.version }
            - call: "POST /v1/bookings/${b_id}/confirm"
              payload: { expected_service_date_version: "${sd_v}" }
              as: Passenger
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /v1/bookings/${b_id}/cancel"
              payload: {}
              as: Passenger
              as_user_id: "${p_id}"
          assert:
            - "before cancel, TravelPass.${pass_id}.rides_consumed == 1 and rides_remaining == 9 (sum == 10)"
            - "after cancel, TravelPass.${pass_id}.rides_consumed == 0 and rides_remaining == 10 (sum still == 10, no drift)"

      - name: seat_inventory_conserved_on_cancel
        grounds:
          - calculations.seat_inventory
          - state_machines.Booking.booking_status.CONFIRMED_to_CANCELLED
          - entities.ServiceDate.fields.seats_sold
          - entities.ServiceDate.fields.seats_available
        distinguishing_aspect: |
          Conserved quantity #2 = ServiceDate seats (DIFFERENT type from pass rides). Invariant
          seats_total == seats_held + seats_sold + seats_available holds throughout. Confirm moves
          one seat held->sold; cancelling the booking releases it back to available, leaving the
          three counters summing to seats_total with zero drift.
        test_recipe:
          setup:
            - "Operator; PUBLISHED route; ServiceDate seats_total=10 base 4000; ECONOMY OPEN refundable class; passenger P confirms+pays a single-leg CASH booking (seats_sold=1, seats_available=9)."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SupportAgent
            - call: "POST /v1/operators"
              payload: { name: "Coastliner", mode: "BUS" }
              as: ScheduleManager
              captures: { op_id: $.data.id }
            - call: "POST /v1/fare-classes"
              payload: { operator_id: "${op_id}", code: "ECONOMY", seating_mode: "OPEN", refundable: true }
              as: FareAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /v1/routes"
              payload: { operator_id: "${op_id}", origin_code: "NYP", destination_code: "BOS", depart_minute_of_day: 540, arrive_minute_of_day: 780 }
              as: ScheduleManager
              captures: { rt_id: $.data.id }
            - call: "POST /v1/routes/${rt_id}/publish"
              payload: {}
              as: ScheduleManager
            - call: "POST /v1/service-dates"
              payload: { route_id: "${rt_id}", departure_date: "2026-06-15", seats_total: 10, base_fare_cents: 4000 }
              as: ScheduleManager
              captures: { sd_id: $.data.id }
            - call: "POST /v1/passengers"
              payload: { full_name: "Pat Rider", email: "pat@x.com" }
              as: Passenger
              captures: { p_id: $.data.id }
            - call: "POST /v1/bookings"
              payload: { passenger_id: "${p_id}", funding_kind: "CASH", legs: [ { service_date_id: "${sd_id}", fare_class_id: "${fc_id}", leg_order: 1 } ] }
              as: Passenger
              as_user_id: "${p_id}"
              captures: { b_id: $.data.id }
            - call: "GET /v1/service-dates/${sd_id}"
              payload: {}
              as: Passenger
              captures: { sd_v: $.data.version }
            - call: "POST /v1/bookings/${b_id}/confirm"
              payload: { expected_service_date_version: "${sd_v}" }
              as: Passenger
              as_user_id: "${p_id}"
            - call: "POST /v1/bookings/${b_id}/pay"
              payload: {}
              as: Passenger
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /v1/bookings/${b_id}/cancel"
              payload: { refund_destination: "CASH" }
              as: Passenger
              as_user_id: "${p_id}"
          assert:
            - "before cancel, ServiceDate.${sd_id}.seats_sold == 1, seats_held == 0, seats_available == 9 (sum 10)"
            - "after cancel, ServiceDate.${sd_id}.seats_sold == 0, seats_held == 0, seats_available == 10 (sum still 10, no drift)"
