# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7 per references/claim-extraction-guide.
# Names are unique across this file and SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# Role headers: as -> X-User-Role; as_user_id -> X-User-ID (opaque ids, literals).
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: program_creation_defaults_applied
        claim_type: creation
        grounds:
          - "entities.Program"
          - "endpoints.POST_/programs"
        distinguishing_aspect: "A new Program starts CHARTERING with zeroed pool fields, posture CRITICAL (total 0), null budget fields, version 1, and server-minted UUID id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /programs", payload: { program_name: "P-DEF", owner_organization: "OwnerOrg" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { st: $.data.status, v: $.data.version, post: $.data.contingency_posture, tot: $.data.contingency_total_cents, avail: $.data.contingency_available_cents, bud: $.data.current_budget_cents, blv: $.data.baseline_version_no } }
          assert:
            - "st == CHARTERING and v == 1"
            - "tot == 0 and avail == 0"
            - "post == CRITICAL   # total == 0 forces CRITICAL per calculations.contingency_posture_derivation"
            - "bud == null and blv == null"

      - name: program_list_pagination_envelope
        claim_type: listing
        grounds:
          - "endpoints.GET_/programs"
          - "response_envelope"
        distinguishing_aspect: "List endpoint honors limit/offset with total_count and has_more per the fixed envelope: 3 programs, limit 2 -> page 1 has_more true, offset 2 -> 1 item has_more false."
        test_recipe:
          setup: ["three programs exist"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_name: "P1", owner_organization: "O" }, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /programs", payload: { program_name: "P2", owner_organization: "O" }, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /programs", payload: { program_name: "P3", owner_organization: "O" }, as: OwnerRepPM, as_user_id: "pm-1" }
          trigger:
            - { call: "GET /programs", payload: { limit: 2, offset: 0 }, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs", payload: { limit: 2, offset: 2 }, as: OwnerRepPM, as_user_id: "pm-1" }
          assert:
            - "page1: 2 items, total_count == 3, has_more == true"
            - "page2: 1 item, total_count == 3, has_more == false"

      - name: program_create_missing_required_field_returns_400
        claim_type: required_fields
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required owner_organization on POST /programs is rejected at priority 3 with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /programs", payload: { program_name: "P-NOFIELD" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: program_create_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - "entities.Program"
        distinguishing_aspect: "Client-supplied id/version/created_at in the create body are ignored; the server returns its own id and version == 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /programs", payload: { program_name: "P-SYS", owner_organization: "O", id: "11111111-1111-4111-8111-111111111111", version: 99 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { v: $.data.version, pid: $.data.id } }
          assert:
            - "v == 1   # client version input ignored"
            - "pid != '11111111-1111-4111-8111-111111111111'   # server-minted id"

      - name: risk_exposure_computed_input_ignored
        claim_type: computed_fields
        grounds:
          - "entities.RiskEntry.fields.exposure_cents"
          - "calculations.risk_exposure_score"
        distinguishing_aspect: "exposure_cents is computed: a client-supplied exposure_cents is ignored and the response carries round_half_up(50*400000/100) == 200000."
        test_recipe:
          setup: ["Program ACTIVE (minimal: budget 1000000, contingency 100000)"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_name: "P-CMP", owner_organization: "O" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { prog: $.data.id } }
            - { call: "POST /charters", payload: { program_id: "${prog}", objectives: "o", scope_statement: "s" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ch: $.data.id } }
            - { call: "POST /charters/${ch}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv: $.data.version } }
            - { call: "POST /charters/${ch}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /baselines", payload: { program_id: "${prog}", total_budget_cents: 1000000, contingency_total_cents: 100000, target_finish_date: "2027-03-31", lines: [ { cost_code: "CC-100", amount_cents: 1000000 } ] }, as: OwnerRepPM, as_user_id: "pm-1", captures: { bl: $.data.id } }
            - { call: "POST /baselines/${bl}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv2: $.data.version } }
            - { call: "POST /baselines/${bl}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv2}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /programs/${prog}/activate", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
          trigger:
            - { call: "POST /risk-entries", payload: { program_id: "${prog}", title: "R", category: "COST", probability_pct: 50, impact_cents: 400000, exposure_cents: 999 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ex: $.data.exposure_cents, st: $.data.status } }
          assert:
            - "ex == 200000   # computed, client 999 ignored"
            - "st == IDENTIFIED   # creation never escalates; escalation happens on assess"

      - name: engagement_duration_minutes_computed
        claim_type: computed_fields
        grounds:
          - "entities.EngagementItem.fields.duration_minutes"
        distinguishing_aspect: "duration_minutes derives from scheduled_end - scheduled_start: a 09:00-10:45 engagement reports exactly 105."
        test_recipe:
          setup: ["Program ACTIVE; group G1 exists"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_name: "P-DUR", owner_organization: "O" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { prog: $.data.id } }
            - { call: "POST /charters", payload: { program_id: "${prog}", objectives: "o", scope_statement: "s" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ch: $.data.id } }
            - { call: "POST /charters/${ch}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv: $.data.version } }
            - { call: "POST /charters/${ch}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /baselines", payload: { program_id: "${prog}", total_budget_cents: 1000000, contingency_total_cents: 100000, target_finish_date: "2027-03-31", lines: [ { cost_code: "CC-100", amount_cents: 1000000 } ] }, as: OwnerRepPM, as_user_id: "pm-1", captures: { bl: $.data.id } }
            - { call: "POST /baselines/${bl}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv2: $.data.version } }
            - { call: "POST /baselines/${bl}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv2}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /programs/${prog}/activate", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /stakeholder-groups", payload: { program_id: "${prog}", group_name: "G1", group_type: "USER_GROUP", contact_email: "g1@x.com" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { g1: $.data.id } }
          trigger:
            - { call: "POST /engagements", payload: { stakeholder_group_id: "${g1}", title: "E", scheduled_start: "2026-09-02T09:00:00Z", scheduled_end: "2026-09-02T10:45:00Z" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { dur: $.data.duration_minutes, st: $.data.status, pid: $.data.program_id } }
          assert:
            - "dur == 105"
            - "st == PROPOSED   # initial state"
            - "pid == ${prog}   # program_id derived from the group, not client input"

      - name: lesson_entry_append_only_immutable
        claim_type: immutability
        grounds:
          - "entities.LessonEntry"
        distinguishing_aspect: "LessonEntry (common_fields false) response carries id + created_at but no version/updated_at, and no update or delete endpoint exists for the collection."
        test_recipe:
          setup: ["Program ACTIVE (minimal)"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_name: "P-LES", owner_organization: "O" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { prog: $.data.id } }
            - { call: "POST /charters", payload: { program_id: "${prog}", objectives: "o", scope_statement: "s" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ch: $.data.id } }
            - { call: "POST /charters/${ch}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv: $.data.version } }
            - { call: "POST /charters/${ch}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /baselines", payload: { program_id: "${prog}", total_budget_cents: 1000000, contingency_total_cents: 100000, target_finish_date: "2027-03-31", lines: [ { cost_code: "CC-100", amount_cents: 1000000 } ] }, as: OwnerRepPM, as_user_id: "pm-1", captures: { bl: $.data.id } }
            - { call: "POST /baselines/${bl}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv2: $.data.version } }
            - { call: "POST /baselines/${bl}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv2}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /programs/${prog}/activate", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
          trigger:
            - { call: "POST /lesson-entries", payload: { program_id: "${prog}", category: "COST", lesson_text: "contingency ran hot", recommendation: "raise floors" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { le: $.data.id } }
          assert:
            - "response has id and created_at but no version field and no updated_at field"
            - "GET /lesson-entries?program_id=${prog} returns exactly 1 entry with lesson_text 'contingency ran hot'"

      - name: baseline_lines_must_sum_to_total
        claim_type: type_constraints
        grounds:
          - "entities.Baseline.fields.lines"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "lines amounts that do not sum to total_budget_cents (and duplicate cost_codes within one baseline) are rejected as invalid requests."
        test_recipe:
          setup: ["Program exists (CHARTERING)"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_name: "P-SUM", owner_organization: "O" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { prog: $.data.id } }
          trigger:
            - { call: "POST /baselines", payload: { program_id: "${prog}", total_budget_cents: 1000000, contingency_total_cents: 100000, target_finish_date: "2027-03-31", lines: [ { cost_code: "CC-100", amount_cents: 600000 } ] }, as: OwnerRepPM, as_user_id: "pm-1", captures: { err1: $.data.error_id } }
            - { call: "POST /baselines", payload: { program_id: "${prog}", total_budget_cents: 1000000, contingency_total_cents: 100000, target_finish_date: "2027-03-31", lines: [ { cost_code: "CC-100", amount_cents: 500000 }, { cost_code: "CC-100", amount_cents: 500000 } ] }, as: OwnerRepPM, as_user_id: "pm-1", captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_INVALID_REQUEST   # 600000 != 1000000"
            - "err2 == ERR_INVALID_REQUEST   # duplicate cost_code CC-100"

      - name: change_orders_filtered_list_by_contract
        claim_type: parent_relationships
        grounds:
          - "endpoints.GET_/change-orders"
          - "entities.ChangeOrder.fields.contract_id"
        distinguishing_aspect: "FK reverse-reachability: GET /change-orders?contract_id=X returns exactly the change orders of contract X, not those of a sibling contract."
        test_recipe:
          setup: ["Program ACTIVE with contracts CT1, CT2 (both SOLICITED); one CO per contract"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_name: "P-FK", owner_organization: "O" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { prog: $.data.id } }
            - { call: "POST /charters", payload: { program_id: "${prog}", objectives: "o", scope_statement: "s" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ch: $.data.id } }
            - { call: "POST /charters/${ch}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv: $.data.version } }
            - { call: "POST /charters/${ch}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /baselines", payload: { program_id: "${prog}", total_budget_cents: 1000000, contingency_total_cents: 100000, target_finish_date: "2027-03-31", lines: [ { cost_code: "CC-100", amount_cents: 1000000 } ] }, as: OwnerRepPM, as_user_id: "pm-1", captures: { bl: $.data.id } }
            - { call: "POST /baselines/${bl}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv2: $.data.version } }
            - { call: "POST /baselines/${bl}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv2}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /programs/${prog}/activate", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /contracts", payload: { program_id: "${prog}", vendor_name: "V1", contract_type: "CONTRACTOR", solicitation_estimate_cents: 100000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ct1: $.data.id } }
            - { call: "POST /contracts", payload: { program_id: "${prog}", vendor_name: "V2", contract_type: "CONSULTANT", solicitation_estimate_cents: 100000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ct2: $.data.id } }
            - { call: "POST /change-orders", payload: { contract_id: "${ct1}", title: "CO-A", reason: "r", amount_cents: 1000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { coa: $.data.id } }
            - { call: "POST /change-orders", payload: { contract_id: "${ct2}", title: "CO-B", reason: "r", amount_cents: 2000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { cob: $.data.id } }
          trigger:
            - { call: "GET /change-orders", payload: { contract_id: "${ct1}" }, as: OwnerRepPM, as_user_id: "pm-1" }
          assert:
            - "exactly 1 item returned and its id == ${coa} and its contract_id == ${ct1}"

  - section: state_machines
    instances:
      - name: charter_decide_from_draft_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Charter"
          - "errors[ERR_INVALID_TRANSITION]"
        distinguishing_aspect: "decide on a DRAFT charter (never submitted) is not in the transition table -> ERR_INVALID_TRANSITION, and the charter stays DRAFT."
        test_recipe:
          setup: ["Program CHARTERING with charter C in DRAFT"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_name: "P-SM1", owner_organization: "O" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { prog: $.data.id } }
            - { call: "POST /charters", payload: { program_id: "${prog}", objectives: "o", scope_statement: "s" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ch: $.data.id } }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv: $.data.version } }
          trigger:
            - { call: "POST /charters/${ch}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv}" }, as: Owner, as_user_id: "owner-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_TRANSITION   # DRAFT has no decide transition (state check precedes OCC version comparison)"

      - name: charter_superseded_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Charter.APPROVED_to_SUPERSEDED"
          - "errors[ERR_INVALID_TRANSITION]"
        distinguishing_aspect: "Once charter A is SUPERSEDED by charter B's approval, every further transition on A (submit, decide, revise) is rejected — SUPERSEDED is terminal."
        test_recipe:
          setup: ["Program with charters A (approved then superseded) and B (approved)"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_name: "P-SM2", owner_organization: "O" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { prog: $.data.id } }
            - { call: "POST /charters", payload: { program_id: "${prog}", objectives: "a", scope_statement: "a" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { cha: $.data.id } }
            - { call: "POST /charters/${cha}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv1: $.data.version } }
            - { call: "POST /charters/${cha}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv1}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /charters", payload: { program_id: "${prog}", objectives: "b", scope_statement: "b" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { chb: $.data.id } }
            - { call: "POST /charters/${chb}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv2: $.data.version } }
            - { call: "POST /charters/${chb}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv2}" }, as: Owner, as_user_id: "owner-1" }
          trigger:
            - { call: "GET /charters/${cha}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { sta: $.data.status } }
            - { call: "POST /charters/${cha}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { err: $.data.error_id } }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { apc: $.data.approved_charter_id } }
          assert:
            - "sta == SUPERSEDED"
            - "err == ERR_INVALID_TRANSITION   # terminal lockdown"
            - "apc == ${chb}   # program points at the newer approved charter"

      - name: owner_report_return_resubmit_cycle
        claim_type: valid_transition
        grounds:
          - "state_machines.OwnerReport.SUBMITTED_to_RETURNED"
          - "state_machines.OwnerReport.RETURNED_to_SUBMITTED"
        distinguishing_aspect: "The monthly report supports a return-and-resubmit loop: DRAFT -> SUBMITTED -> RETURNED -> SUBMITTED, with return_note recorded and the submitter refreshed on resubmission."
        test_recipe:
          setup: ["Program ACTIVE (minimal); report for 2026-08 created"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_name: "P-SM3", owner_organization: "O" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { prog: $.data.id } }
            - { call: "POST /charters", payload: { program_id: "${prog}", objectives: "o", scope_statement: "s" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ch: $.data.id } }
            - { call: "POST /charters/${ch}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv: $.data.version } }
            - { call: "POST /charters/${ch}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /baselines", payload: { program_id: "${prog}", total_budget_cents: 1000000, contingency_total_cents: 100000, target_finish_date: "2027-03-31", lines: [ { cost_code: "CC-100", amount_cents: 1000000 } ] }, as: OwnerRepPM, as_user_id: "pm-1", captures: { bl: $.data.id } }
            - { call: "POST /baselines/${bl}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv2: $.data.version } }
            - { call: "POST /baselines/${bl}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv2}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /programs/${prog}/activate", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /owner-reports", payload: { program_id: "${prog}", period: "2026-08" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { rep: $.data.id } }
          trigger:
            - { call: "POST /owner-reports/${rep}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { s1: $.data.status } }
            - { call: "POST /owner-reports/${rep}/return", payload: { return_note: "fix forecast narrative" }, as: Owner, as_user_id: "owner-1", captures: { s2: $.data.status, rn: $.data.return_note } }
            - { call: "POST /owner-reports/${rep}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { s3: $.data.status, sb: $.data.submitted_by_user_id } }
          assert:
            - "s1 == SUBMITTED and s2 == RETURNED and rn == 'fix forecast narrative'"
            - "s3 == SUBMITTED and sb == 'pm-1'   # cycle closes back to SUBMITTED"

      - name: drawdown_release_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.ContingencyDrawdown"
          - "errors[ERR_INVALID_TRANSITION]"
        distinguishing_aspect: "A RELEASED drawdown is terminal: commit and draw on it are rejected with ERR_INVALID_TRANSITION."
        test_recipe:
          setup: ["Program ACTIVE (minimal); drawdown reserved 50000 then released"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_name: "P-SM4", owner_organization: "O" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { prog: $.data.id } }
            - { call: "POST /charters", payload: { program_id: "${prog}", objectives: "o", scope_statement: "s" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ch: $.data.id } }
            - { call: "POST /charters/${ch}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
