      assert:
      - petty_cash_cents minus deposit_liability_cents is the same integer before checkout and after close
      - at the intermediate observation petty_cash_cents == ${cash_held} == 1330 and deposit_liability_cents == ${liab_held} == 1330, whose difference is already the final value
      - after close CommercialAccount.${acct}.petty_cash_cents == 0 and CommercialAccount.${acct}.deposit_liability_cents == 0
      - ToolLoan.${ln1}.deposit_state == "REFUNDED" and ToolLoan.${ln1}.deposit_forfeited_cents == 0
      - ToolLoan.${ln1}.status == "CLOSED", so the compensating action left no open residue
