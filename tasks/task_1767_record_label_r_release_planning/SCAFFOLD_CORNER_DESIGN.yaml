  - section: cross_cutting_layers
    instances:
      - name: occ_memo_counter_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[deal-memo-counter-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "The counter endpoint rejects a request carrying the pre-counter version: first counter at version 2 succeeds (version -> 3); a second counter still carrying version 2 gets 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Label; artist; memo PROPOSED at version 2"]
          setup_api_calls:
            - { call: "POST /api/labels", payload: { name: "Label L1" }, as: LabelAdmin, captures: { label_id: $.data.id } }
            - { call: "POST /api/artists", payload: { label_id: "${label_id}", stage_name: "Artist L1", genre: "POP", birth_date: "1995-04-12", monthly_streams: 600000, social_followers: 800000, engagement_rate: 0.5, live_draw_avg: 1000 }, as: AnRManager, captures: { artist_id: $.data.id } }
            - { call: "POST /api/artists/${artist_id}/deal-memos", payload: { advance_cents: 50000, base_royalty_rate_bps: 2000, recoupment_scope: "MASTER_ONLY", promo_costs_recoupable: false, options_total: 0, option_term_months: 12, option_escalation_bps: 0, term_months: 12, valid_until_date: "2028-01-01" }, as: AnRManager, captures: { memo_id: $.data.id } }
            - { call: "POST /api/deal-memos/${memo_id}/propose", payload: {}, as: AnRManager, captures: { memo_v: $.data.version } }
          trigger:
            - { call: "POST /api/deal-memos/${memo_id}/counter", payload: { expected_deal_memo_version: "${memo_v}", advance_cents: 45000 }, as: AnRManager, captures: { v_after: $.data.version } }
            - { call: "POST /api/deal-memos/${memo_id}/counter", payload: { expected_deal_memo_version: "${memo_v}", advance_cents: 40000 }, as: ArtistPortal, as_user_id: "${artist_id}", captures: { err: $.data.error_id } }
          assert:
            - "First counter succeeds: version == 3, round_count == 1, status COUNTERED"
            - "Stale counter: error_id == ERR_STALE_VERSION (HTTP 412); version stays 3 and advance_cents stays 45000"

      - name: occ_amend_budget_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[project-budget-amend-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "amend-budget is repeatable, so staleness is resolved only by OCC: a second amendment carrying the pre-amendment version is rejected with 412."
        test_recipe:
          setup: ["Label; funded contract; project RECORDING budget 1000000, version captured after start"]
          setup_api_calls:
            - { call: "POST /api/labels", payload: { name: "Label L2" }, as: LabelAdmin, captures: { label_id: $.data.id } }
            - { call: "POST /api/artists", payload: { label_id: "${label_id}", stage_name: "Artist L2", genre: "POP", birth_date: "1995-04-12", monthly_streams: 600000, social_followers: 800000, engagement_rate: 0.5, live_draw_avg: 1000 }, as: AnRManager, captures: { artist_id: $.data.id } }
            - { call: "POST /api/artists/${artist_id}/deal-memos", payload: { advance_cents: 0, base_royalty_rate_bps: 2000, recoupment_scope: "MASTER_ONLY", promo_costs_recoupable: false, options_total: 0, option_term_months: 12, option_escalation_bps: 0, term_months: 12, valid_until_date: "2028-01-01" }, as: AnRManager, captures: { memo_id: $.data.id } }
            - { call: "POST /api/deal-memos/${memo_id}/propose", payload: {}, as: AnRManager }
            - { call: "POST /api/deal-memos/${memo_id}/approve", payload: {}, as: LabelAdmin }
            - { call: "POST /api/deal-memos/${memo_id}/execute", payload: {}, as: LabelAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /api/contracts/${contract_id}/recording-projects", payload: { title: "P-L2", project_type: "ALBUM", budget_cents: 1000000 }, as: AnRManager, captures: { proj_id: $.data.id } }
            - { call: "POST /api/recording-projects/${proj_id}/start", payload: {}, as: AnRManager }
            - { call: "GET /api/recording-projects/${proj_id}", payload: {}, as: AnRManager, captures: { proj_v: $.data.version } }
          trigger:
            - { call: "POST /api/recording-projects/${proj_id}/amend-budget", payload: { expected_recording_project_version: "${proj_v}", budget_cents: 1200000 }, as: AnRManager, captures: { v_after: $.data.version } }
            - { call: "POST /api/recording-projects/${proj_id}/amend-budget", payload: { expected_recording_project_version: "${proj_v}", budget_cents: 1100000 }, as: AnRManager, captures: { err: $.data.error_id } }
          assert:
            - "First amend succeeds: budget_cents == 1200000, version incremented by 1"
            - "Stale amend: error_id == ERR_STALE_VERSION (412); budget_cents stays 1200000"

      - name: occ_statement_adjust_stale_version
        claim_type: optimistic_concurrency
