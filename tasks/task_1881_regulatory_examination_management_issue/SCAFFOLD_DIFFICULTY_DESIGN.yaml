              as: RegulatoryAffairsManager
              captures: { ex11: $.data.id }
            - call: "POST /regulatory-exams/examinations/${ex11}/first-day-items"
              payload: { request_ref: "FDL-1", description: "x", due_date: "2026-07-20T00:00:00Z" }
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examinations/${ex11}/first-day-items"
              payload: { request_ref: "FDL-2", description: "x", due_date: "2026-07-20T00:00:00Z" }
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examinations/${ex11}/first-day-items"
              payload: { request_ref: "FDL-3", description: "x", due_date: "2026-07-20T00:00:00Z" }
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examinations/${ex11}/issue-first-day-letter"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-21T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /regulatory-exams/examinations/${ex11}"
              as: RegulatoryAffairsManager
              captures: { post3: $.data.posture, cnt3: $.data.overdue_item_count }
            - call: "POST /regulatory-exams/first-day-items/${ex11}/submissions"
