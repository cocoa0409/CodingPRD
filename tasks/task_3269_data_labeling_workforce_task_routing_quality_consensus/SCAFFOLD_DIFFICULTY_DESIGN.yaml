          trigger:
            - call: "POST /api/items/${it2_id}/dispatch-panel"
              payload: {}
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "the second dispatch is rejected with ERR_WORKER_LANE_CONFLICT at status 409, because the only eligible worker already holds a dispatched assignment whose closed interval 2026-09-01T00:00:00Z to 2026-09-01T01:00:00Z contains the new dispatch instant"
            - "advancing the clock to 2026-09-01T01:00:00Z still leaves the lanes touching, so the conflict persists at the endpoint of the first lane"
            - "advancing the clock to 2026-09-01T01:00:01Z clears the conflict and the second dispatch succeeds"
            - "the calendar rule admits zero-length adjacency while the lane rule rejects it, so the two overlap rules differ in interval semantics rather than merely in resource"
            - "a second eligible worker added to the pool also clears the conflict, isolating the resource that the overlap is measured on"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: settlement_reversal_leaves_receivable_conserved
        grounds:
          - state_machines.AppealClaim.PROPOSED_to_CONCURRENCE
          - calculations.accepted_unit_amount
          - entities.WorkerIdentity.worker_receivable_cents
          - entities.WorkerIdentity.lifetime_earned_cents
        distinguishing_aspect: |
          The conserved quantity is the worker's receivable balance, and the invariant names it as an
          explicit formula: a payout acceptance followed by a settled withdrawal and then a
          compensating reversal must restore the receivable to exactly its pre-settlement value.
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
            - "An es-MX engagement with one published unit holding one released item; a QUALIFIED PROFICIENT es-MX worker has committed it and been paid 8 cents, then settled 5 cents."
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { handle: "omar-haddad", settlement_min_cents: 1 }
              as: Anonymous
              captures: { omar_id: "$.data.id" }
            - call: "POST /api/programs"
              payload: { program_code: "AX-4416", name: "Conservation Panel", language_code: "es-MX", instruction_model: "IDEAL_RESPONSE", sensitivity_class: "STANDARD", deadline_utc: "2026-10-01T00:00:00Z", blackout_start_utc: "2026-09-20T00:00:00Z", blackout_end_utc: "2026-09-25T00:00:00Z", commitment_quorum: 1 }
              as: PlatformAdmin
              captures: { prog_id: "$.data.id", prog_v: "$.data.version" }
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-1", max_items: 10, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-09-19T00:00:00Z", expected_program_version: "${prog_v}", panel_size: 1, gold_rate: 0.0 }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id" }
            - call: "POST /api/programs/${prog_id}/program-state"
              payload: { program_action: "OPEN" }
              as: PlatformAdmin
            - call: "POST /api/workers/${omar_id}/qualifications"
              payload: { language_code: "es-MX", tier: "PROFICIENT", qualification_action: "ENROLL" }
              as: PlatformAdmin
            - call: "POST /api/workers/${omar_id}/qualifications"
              payload: { language_code: "es-MX", tier: "PROFICIENT", qualification_action: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /api/spec-units/${u1_id}/items"
              payload: { item_key: "i-0001", payload_uri: "s3://ax/0001", required_units: 1 }
              as: PlatformAdmin
              captures: { it1_id: "$.data.id" }
            - call: "POST /api/items/${it1_id}/dispatch-panel"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/items/${it1_id}/commits"
              payload: {}
              as: PlatformAdmin
              captures: { c1_id: "$.data[0].id" }
            - call: "POST /api/commits/${c1_id}/commit-label"
              payload: { payload: { label: "A" }, instructions_ack: true }
              as: Worker
              as_user_id: "${omar_id}"
            - call: "POST /api/commits/${c1_id}/payout-records"
              payload: { amount_cents: 8, currency: "USD" }
              as: PlatformAdmin
              captures: { recv_after_payout: "$.data.id" }
            - call: "POST /api/workers/${omar_id}/settlement-requests"
              payload: { amount_cents: 5 }
              as: Worker
              as_user_id: "${omar_id}"
              captures: { recv_after_settle: "$.data.id" }
            - call: "POST /api/appeal-cases"
              payload: { item_id: "${it1_id}", grounds: "AMBIGUOUS_INSTRUCTIONS", statement_text: "The instruction document does not cover the null case." }
              as: Worker
              as_user_id: "${omar_id}"
              captures: { case_id: "$.data.id", case_v: "$.data.version" }
            - call: "POST /api/appeal-cases/${case_id}/advance-appeal"
              payload: { appeal_action: "PROPOSE", proposed_outcome: "PAY_REVERSAL" }
              as: PlatformReviewer
              captures: { case_v2: "$.data.version" }
          trigger:
            - call: "POST /api/appeal-cases/${case_id}/concur"
              payload: { expected_claim_version: "${case_v2}" }
              as: PlatformReviewer
              captures: { claim_status: "$.data.status" }
          assert:
            - "before the trigger WorkerIdentity.${omar_id}.worker_receivable_cents == 3, being the 8 accepted cents less the 5 settled cents"
            - "after the trigger worker_receivable_cents == 8, because the 5 returned by the PAY_REVERSAL concurrence restore the receivable exactly"
            - "lifetime_earned_cents == 8 before and after the trigger, because a compensating reversal returns the receivable without rewinding lifetime earnings"
            - "the invariant holds as the formula worker_receivable_cents == accepted_cents - settled_cents + reversed_cents, which reads 8 - 5 + 5 == 8"
            - "the disputed commit payment_status moves to REVERSED while the disputed qualification gold_fail_streak returns to 0"

      - name: rework_round_ceiling_leaves_conserved_quantity_fixed
        grounds:
          - state_machines.LabelingItem.REWORK_to_REWORK
          - entities.LabelingItem.rework_cycles
          - entities.LabelingItem.rework_round_limit
          - entities.SpecUnit.unit_effective_points
        distinguishing_aspect: |
          A different conserved quantity -- the unit's point ceiling rather than any worker balance:
          three rework rounds and a lapsed correction may move the piece's status repeatedly but the
          unit's ceiling in points must return to exactly its pre-rework value once no item is in
          REWORK.
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
            - "An es-MX engagement of SENSITIVE class with one published unit at max_items 10, holding one released item whose single member has committed and been paid, so the piece is CERTIFIED."
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { handle: "nadia-hassan" }
              as: Anonymous
              captures: { nadia_id: "$.data.id" }
            - call: "POST /api/programs"
              payload: { program_code: "AX-4417", name: "Ceiling Panel", language_code: "es-MX", instruction_model: "IDEAL_RESPONSE", sensitivity_class: "SENSITIVE", deadline_utc: "2026-10-01T00:00:00Z", blackout_start_utc: "2026-09-20T00:00:00Z", blackout_end_utc: "2026-09-25T00:00:00Z", commitment_quorum: 1 }
              as: PlatformAdmin
              captures: { prog_id: "$.data.id", prog_v: "$.data.version" }
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-1", max_items: 10, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-09-19T00:00:00Z", expected_program_version: "${prog_v}", panel_size: 1, gold_rate: 0.0 }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id", ceiling_before: "$.data.unit_ceiling_points" }
            - call: "POST /api/programs/${prog_id}/program-state"
              payload: { program_action: "OPEN" }
              as: PlatformAdmin
            - call: "POST /api/workers/${nadia_id}/qualifications"
              payload: { language_code: "es-MX", tier: "PROFICIENT", qualification_action: "ENROLL" }
              as: PlatformAdmin
            - call: "POST /api/workers/${nadia_id}/qualifications"
              payload: { language_code: "es-MX", tier: "PROFICIENT", qualification_action: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /api/spec-units/${u1_id}/items"
              payload: { item_key: "i-0001", payload_uri: "s3://ax/0001", required_units: 1 }
              as: PlatformAdmin
              captures: { it1_id: "$.data.id" }
            - call: "POST /api/items/${it1_id}/dispatch-panel"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/items/${it1_id}/commits"
              payload: {}
              as: PlatformAdmin
              captures: { c1_id: "$.data[0].id" }
            - call: "POST /api/commits/${c1_id}/commit-label"
              payload: { payload: { label: "A" }, instructions_ack: true }
              as: Worker
              as_user_id: "${nadia_id}"
            - call: "POST /api/commits/${c1_id}/payout-records"
              payload: { amount_cents: 8, currency: "USD" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/items/${it1_id}/reviewer-action"
              payload: { reviewer_action: "OPEN_REWORK" }
              as: PlatformReviewer
              captures: { cycles_after_first: "$.data.rework_cycles" }
          assert:
            - "unit_ceiling_points == 20 before the trigger, because max_items 10 times the SENSITIVE weight of 2 is 20"
            - "while the piece sits in REWORK unit_effective_points == 24, because round_half_up(20 * 1.2) == 24, so the point ceiling is temporarily raised rather than consumed"
            - "after the rework round lapses and no item remains in REWORK, unit_effective_points returns to exactly 20, so the temporary 4 point surcharge leaves no drift in the conserved quantity"
            - "the third expired round drives rework_cycles to the limit of 3 and the piece to REJECTED with consensus_status REJECTED and holds_quorum false"
            - "the invariant is the formula unit_effective_points == unit_ceiling_points whenever no attached item has consensus_status REWORK"
            - "the same invariant holds after the engagement-level embargo cascade sets piece_status REWORK, because unit_effective_points reads the items rather than the unit-level flag"
