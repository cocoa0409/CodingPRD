        distinguishing_aspect: "With the guardian verified and the birth certificate matching the mapping, the consent activates and expires_at is stamped exactly 30 days after signed_at."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Guardian-present consent with identification_type BIRTH_CERTIFICATE and the guardian VERIFIED."
          setup_api_calls:
            - *k_clock
