  # ===========================================================================
  - section: calculations
    instances:

      - name: capitation_floor_clamp_holds_at_low_risk
        claim_type: Constants Applied
        grounds:
          - calculations.capitation_rate_cents
          - entities.Member.fields.capitation_rate_cents
        distinguishing_aspect: "A 1.0-risk COMMERCIAL_HMO member lands exactly on 84000 because their raw rate sits strictly between the 21000 floor and the 105000 ceiling, so neither clamp is applied for the ordinary case."
        test_recipe:
          setup:
            - "Logical clock default; one region, site, department and provider."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - *c_prov
            - *c_member
          trigger:
            - call: "GET /members/${m1}"
              payload: {}
              as: RegionalFinanceOfficer
          assert:
            - "Member.${m1}.capitation_rate_cents == 84000 (42000 + round_half_up(42000 * 1.0))"
            - "the value is strictly between the floor 21000 and the ceiling 105000, so no clamp fires"
            - "changing risk_score to 3.0 via PATCH /members/${m1} yields 126000, above the ceiling, so the clamp then binds"

      - name: capitation_ceiling_clamp_binds_at_extreme_risk
        claim_type: Correct Result
        grounds:
          - calculations.capitation_rate_cents
          - entities.Member.fields.capitation_rate_cents
        distinguishing_aspect: "A 3.0-risk COMMERCIAL_HMO member's raw 42000 + 126000 = 168000 is above the UPPER clamp 105000, so capitation_rate_cents pins at exactly 105000."
        test_recipe:
          setup:
            - "Logical clock default; one region, site, department and provider."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - *c_prov
            - *c_member
          trigger:
            - call: "PATCH /members/${m1}"
              payload: { risk_score: 3.0, expected_member_version: "${m1_v}" }
              as: RegionalFinanceOfficer
              captures: { m1_rate: $.data.capitation_rate_cents }
          assert:
            - "Member.${m1}.capitation_rate_cents == 105000, the UPPER clamp, not the raw 168000"
            - "Member.${m1}.risk_score == 3.0 is stored unchanged"
            - "the region's premium_revenue_cents equals the clamped member rate"

      - name: region_premium_revenue_excludes_suspended_and_terminated_members
        claim_type: Input Set Filtering
        grounds:
          - calculations.region_operating_budget
          - entities.Region.fields.premium_revenue_cents
          - state_machines.Member.ACTIVE_to_TERMINATED
        distinguishing_aspect: "The aggregation includes Member status IN {ACTIVE, TRANSFER_PENDING} and excludes SUSPENDED and TERMINATED, so terminating one of two members drops premium_revenue_cents by exactly that member's capitation."
        test_recipe:
          setup:
            - "Logical clock default; one region, site, department, provider and two members with differing plan products."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - *c_prov
            - *c_member
            - call: "POST /regions/${r1}/members"
              payload: { member_ref: "M-T-2", attributed_provider_id: "${p1}", plan_product: "MEDICARE_ADVANTAGE", benefit_tier: "TIER_2", risk_score: 1.0, coverage_effective_date: "2026-09-01T00:00:00Z" }
              as: RegionalFinanceOfficer
              captures: { m2: $.data.id, m2_v: $.data.version }
          trigger:
            - call: "GET /regions/${r1}"
              payload: {}
              as: RegionalFinanceOfficer
            - call: "POST /members/${m1}/terminate"
              payload: { expected_member_version: "${m1_v}" }
              as: RegionalFinanceOfficer
            - call: "GET /regions/${r1}"
              payload: {}
              as: RegionalFinanceOfficer
              captures: { after: $.data.premium_revenue_cents }
          assert:
            - "premium_revenue_cents is 84000 + 190000 == 274000 before termination"
            - "premium_revenue_cents == ${after} and equals 190000 after termination"
            - "member_count drops from 2 to 1"
            - "Terminated member M-T-1 contributes exactly 0 after its status becomes TERMINATED"

      - name: access_breach_pct_counts_only_non_cancelled_appointments
        claim_type: Input Set Filtering
        grounds:
          - calculations.access_wait_metric
          - entities.Region.fields.access_breach_pct
        distinguishing_aspect: "The breach percentage divides by the non-cancelled appointment count, so cancelling a breaching appointment lowers the denominator as well as the numerator."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01; one region, site, department with wait_threshold_days 14, provider and two members."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - *c_prov
            - *c_member
            - call: "POST /regions/${r1}/members"
              payload: { member_ref: "M-T-2", attributed_provider_id: "${p1}", plan_product: "COMMERCIAL_HMO", benefit_tier: "TIER_1", risk_score: 1.0, coverage_effective_date: "2026-09-01T00:00:00Z" }
              as: RegionalFinanceOfficer
              captures: { m2: $.data.id, m2_v: $.data.version }
          trigger:
            - call: "POST /appointments"
              payload: { department_id: "${d1}", provider_id: "${p1}", member_id: "${m1}", appointment_type: "ROUTINE", start_utc: "2026-09-20T00:00:00Z", duration_minutes: 20, expected_member_version: "${m1_v}" }
              as: AccessScheduler
              captures: { a1: $.data.id, a1_status: $.data.access_status }
            - call: "POST /appointments"
              payload: { department_id: "${d1}", provider_id: "${p1}", member_id: "${m2}", appointment_type: "ROUTINE", start_utc: "2026-09-05T00:00:00Z", duration_minutes: 20, expected_member_version: "${m2_v}" }
              as: AccessScheduler
              captures: { a2: $.data.id, a2_status: $.data.access_status }
            - call: "GET /regions/${r1}"
              payload: {}
              as: RegionalFinanceOfficer
              captures: { pct_before: $.data.access_breach_pct }
            - call: "POST /appointments/${a1}/cancel"
              payload: {}
              as: AccessScheduler
            - call: "GET /regions/${r1}"
              payload: {}
              as: RegionalFinanceOfficer
              captures: { pct_after: $.data.access_breach_pct }
          assert:
            - "Appointment.${a1}.access_status == BREACHED_ACCESS_TARGET and Appointment.${a2}.access_status == WITHIN_ACCESS_TARGET"
            - "access_breach_pct is 50.0 before the cancellation"
            - "access_breach_pct == 0.0 after cancelling the breaching appointment"
            - "the cancelled appointment is excluded from both the numerator and the denominator"

      - name: outside_services_liability_emergency_rate_variant
        claim_type: Variant Selection
        grounds:
          - calculations.outside_services_liability
          - entities.OutsideServiceClaim.fields.provisional_liability_cents
        distinguishing_aspect: "When emergency_flag is true the provisional variant switches to a flat 0.75 of billed, so a 420000 emergency claim books 315000 while the same claim without the flag books 294000."
        test_recipe:
          setup:
            - "Logical clock default; one region with an approved budget and a member."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - *c_prov
            - *c_member
            - *c_budget
            - call: "POST /regional-budgets/${rb1}/submit"
              payload: {}
              as: RegionalFinanceOfficer
            - call: "POST /regional-budgets/${rb1}/approve"
              payload: {}
              as: BudgetAppropriationsCommittee
          trigger:
            - call: "POST /regions/${r1}/outside-service-claims"
              payload: { member_id: "${m1}", vendor_name: "Emergency Vendor", service_code: "RADIOLOGY", claim_type: "EMERGENCY", emergency_flag: true, billed_amount_cents: 420000, provider_type: "NON_CONTRACTED", claim_line_number: 1, emergency_inject_once: false, derived_claim_type: "EMERGENCY", expected_member_version: "${m1_v}" }
              as: RegionalFinanceOfficer
              captures: { c_em: $.data.id, c_em_prov: $.data.provisional_liability_cents }
            - call: "POST /regions/${r1}/outside-service-claims"
              payload: { member_id: "${m1}", vendor_name: "Test Vendor", service_code: "RADIOLOGY", claim_type: "CONTRACTED", emergency_flag: false, billed_amount_cents: 420000, provider_type: "NON_CONTRACTED", claim_line_number: 1, emergency_inject_once: false, derived_claim_type: "CONTRACTED", expected_member_version: "${m1_v}" }
              as: RegionalFinanceOfficer
              captures: { c_pl: $.data.id, c_pl_prov: $.data.provisional_liability_cents }
          assert:
            - "OutsideServiceClaim.${c_em}.provisional_liability_cents == 315000 (0.75 * 420000)"
            - "OutsideServiceClaim.${c_pl}.provisional_liability_cents == 294000 (0.70 * 420000)"
            - "the two identical billed amounts produce different provisional liabilities purely from emergency_flag"
            - "no deductible is consumed by either provisional booking"

      - name: capacity_supply_shortfall_is_zero_when_committed_is_below_budgeted
        claim_type: Correct Result
        grounds:
          - calculations.capacity_supply_balance
          - entities.CapacityPlan.fields.supply_shortfall_slots
        distinguishing_aspect: "supply_shortfall_slots is max(0, committed - budgeted), so under-commitment floors at exactly 0 rather than going negative."
        test_recipe:
          setup:
            - "Logical clock default; one region, site, department, provider and member; an ACTIVE capacity plan with budgeted_slots 10."
          setup_api_calls:
            - *c_clock
            - *c_region
            - *c_site
            - *c_dept
            - *c_prov
            - *c_member
            - call: "POST /regions/${r1}/capacity-plans"
              payload: { department_id: "${d1}", period: "2026-09", budgeted_slots: 10, panel_target: 3 }
              as: RegionalFinanceOfficer
              captures: { cp1: $.data.id }
            - call: "POST /capacity-plans/${cp1}/review"
              payload: {}
              as: AccessScheduler
            - call: "POST /capacity-plans/${cp1}/activate"
              payload: {}
              as: RegionalFinanceOfficer
          trigger:
            - call: "POST /appointments"
              payload: { department_id: "${d1}", provider_id: "${p1}", member_id: "${m1}", appointment_type: "ROUTINE", start_utc: "2026-09-10T09:00:00Z", duration_minutes: 20, expected_member_version: "${m1_v}" }
              as: AccessScheduler
              captures: { a1: $.data.id }
            - call: "GET /capacity-plans/${cp1}"
              payload: {}
              as: RegionalFinanceOfficer
              captures: { cp1_committed: $.data.committed_slots, cp1_short: $.data.supply_shortfall_slots, cp1_epoch: $.data.recalculation_epoch }
          assert:
            - "CapacityPlan.${cp1}.committed_slots == 1 and budgeted_slots == 10"
            - "CapacityPlan.${cp1}.supply_shortfall_slots == 0, floored rather than -9"
            - "CapacityPlan.${cp1}.recalculation_epoch advanced by 1 on the booking recompute"
            - "Region.${r1}.capacity_committed_appointments == 1 and capacity_budget_appointments == 10"

      - name: internal_referral_rate_excludes_denied_referrals
        claim_type: Input Set Filtering
        grounds:
          - calculations.internal_referral_rate
          - entities.Region.fields.quality_composite_score
        distinguishing_aspect: "The internal referral rate counts only authorized referrals, so denying one of two referrals still leaves logged_internal_referral_pct at 1.0 for the authorized one."
