scenario: |
  1833. Deed-in-Lieu & Cash-for-Keys Administration (servicer property solutions team):
  eligibility evaluation & marketing period requirement, title condition & junior lien
  clearance, relocation assistance amount & condition of property standard, vacate date
  agreement & inspection at handover, payment disbursement upon key delivery & broom-clean
  verification, deficiency waiver documentation, deed recording & servicing system update,
  occupant holdover escalation to eviction.

domain_name: deed-lieu-cash-keys
api_prefix: /property-solutions

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: branching   # Case forks by program_type and by holdover outcome; Agreement is cyclic; several machines have revert loops
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (flat topology; all collections under /property-solutions)
# =============================================================================
entities:
  - name: Loan
    parent: null
    common_fields: true
    fields:
      - { name: loan_number, type: string, source: input, description: "Servicer loan number; unique across all loans" }
      - { name: unpaid_principal_balance_cents, type: integer, source: input, description: "Current unpaid principal balance in cents; must be > 0" }
      - { name: accrued_interest_cents, type: integer, source: input, description: "Accrued unpaid interest in cents as of loan boarding; >= 0" }
      - { name: escrow_advances_cents, type: integer, source: input, description: "Corporate escrow advances in cents; >= 0" }
      - { name: foreclosure_fees_cents, type: integer, source: input, description: "Foreclosure fees and costs in cents; >= 0" }
      - { name: note_annual_rate, type: number, source: input, description: "Note interest rate as decimal (e.g. 0.06); > 0 and <= 0.25" }
      - { name: per_diem_interest_cents, type: integer, source: computed, description: "round_half_up(unpaid_principal_balance_cents * note_annual_rate / 365); computed at creation and on any balance/rate change; client input ignored" }
      - { name: fair_market_value_cents, type: integer, source: input, description: "Broker price opinion FMV in cents; >= 0" }
      - { name: delinquency_days, type: integer, source: input, description: "Days delinquent at boarding; >= 0" }
      - { name: foreclosure_referral_status, type: enum, source: input, description: "NONE | REFERRED | ACTIVE | WITHDRAWN", default: "NONE" }
      - { name: status, type: enum, source: system, description: "ACTIVE_DELINQUENT | WORKOUT_IN_PROGRESS | DEED_IN_LIEU_COMPLETED | FORECLOSURE_PROCEEDING", default: "ACTIVE_DELINQUENT" }
      - { name: deficiency_balance_cents, type: integer, source: computed, description: "Unsatisfied debt after conveyance; set at waiver execution (to 0), restored on rescind; 0 before any waiver execution" , default: 0 }
      - { name: servicing_system_synced, type: boolean, source: system, description: "True once deed recording confirmation cascades the servicing-system update", default: false }

  - name: Borrower
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Borrower full legal name" }
      - { name: email, type: string, source: input, description: "Contact email; free-form string" }
      - { name: hardship_type, type: enum, source: input, description: "INVOLUNTARY_UNEMPLOYMENT | MEDICAL | DIVORCE | NONE" }
      - { name: self_reported_condition_grade, type: enum, source: input, description: "Borrower-reported property condition grade A | B | C | D; feeds provisional assistance condition_basis SELF_REPORTED" }

  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; the loan secured by this property" }
      - { name: address_line, type: string, source: input, description: "Street address" }
      - { name: county, type: string, source: input, description: "County of record (drives deed recording county)" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code" }
      - { name: occupancy_type, type: enum, source: input, description: "OWNER_OCCUPIED | TENANT_OCCUPIED | SECOND_HOME" }
      - { name: required_condition_standard, type: enum, source: input, description: "Condition standard required at handover; only BROOM_CLEAN supported", default: "BROOM_CLEAN" }

  - name: WorkoutCase
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; loan in workout" }
      - { name: borrower_id, type: string, source: input, description: "FK -> Borrower.id; borrower/occupant party to the agreement" }
      - { name: program_type, type: enum, source: input, description: "DEED_IN_LIEU | CASH_FOR_KEYS" }
      - { name: status, type: enum, source: system, description: "INTAKE | ELIGIBILITY_REVIEW | MARKETING_PERIOD | TITLE_REVIEW | TERMS_NEGOTIATION | AGREEMENT_ACTIVE | VACATE_PENDING | HANDOVER_INSPECTION | DISBURSEMENT_PENDING | RECORDING_PENDING | COMPLETED | DECLINED | WITHDRAWN | HOLDOVER_ESCALATED | EVICTION_IN_PROGRESS | CLOSED_EVICTED", default: "INTAKE" }
      - { name: assigned_specialist_id, type: string, source: system, description: "X-User-ID of the PropertySolutionsSpecialist who created the case; immutable" }
      - { name: marketing_exception_granted, type: boolean, source: system, description: "True after WorkoutManager grants marketing-period exception", default: false }
      - { name: marketing_exception_reason, type: string, source: system, description: "Reason recorded with the marketing exception; null until granted" }
      - { name: total_disbursed_cents, type: integer, source: computed, description: "Sum of amount_cents over this case's Disbursements in status RELEASED; maintained on release and clawback", default: 0 }
      - { name: remaining_assistance_cents, type: integer, source: computed, description: "Applicable assistance (final_assistance_cents if set on the ACCEPTED/COMPLETED agreement, else provisional_assistance_cents) minus total_disbursed_cents; null until an agreement exists", }
      - { name: handover_date, type: string, source: system, description: "ISO date of the completed handover inspection (logical clock date at report submit); null until then" }
      - { name: keys_returned, type: boolean, source: system, description: "True when the latest SUBMITTED handover InspectionReport has keys_returned_count > 0", default: false }

  - name: MarketingListing
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> WorkoutCase.id; case this listing markets" }
      - { name: list_date, type: string, source: input, description: "ISO date property was listed; must be <= current logical date" }
      - { name: list_price_cents, type: integer, source: input, description: "Asking price in cents; > 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED", default: "ACTIVE" }
      - { name: creditable_days, type: integer, source: computed, description: "Per calculation creditable_marketing_days: span days from list_date to current logical date minus merged suspension union; recomputed on suspend/resume/close and on read", default: 0 }

  - name: ListingSuspension
    parent: null
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: system, description: "FK -> MarketingListing.id; set by the suspend action" }
      - { name: started_at, type: datetime, source: system, description: "Logical timestamp when suspension began" }
      - { name: ended_at, type: datetime, source: system, description: "Logical timestamp when suspension ended; null while open" }
      - { name: reason, type: string, source: input, description: "Suspension reason supplied to the suspend action" }

  - name: TitleCommitment
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> WorkoutCase.id; case this commitment serves" }
      - { name: status, type: enum, source: system, description: "ORDERED | RECEIVED | CLEARED", default: "ORDERED" }
      - { name: vested_owner_name, type: string, source: system, description: "Vested owner per title; set at receive" }
      - { name: unreleased_lien_count, type: integer, source: computed, description: "Count of JuniorLiens on this commitment in status UNRELEASED", default: 0 }

  - name: JuniorLien
    parent: null
    common_fields: true
    fields:
      - { name: title_commitment_id, type: string, source: system, description: "FK -> TitleCommitment.id; commitment on which this lien appears" }
      - { name: lienholder_name, type: string, source: input, description: "Junior lienholder name" }
      - { name: amount_cents, type: integer, source: input, description: "Lien amount in cents; > 0" }
      - { name: position, type: integer, source: input, description: "Lien priority position; unique per title commitment; >= 2 (1 is the senior lien)" }
      - { name: status, type: enum, source: system, description: "UNRELEASED | RELEASED", default: "UNRELEASED" }
      - { name: settlement_amount_cents, type: integer, source: system, description: "Agreed settlement paid at release; null until released" }
      - { name: released_at, type: datetime, source: system, description: "Logical timestamp of release; null until released" }

  - name: SettlementAgreement
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> WorkoutCase.id; set from the creation path" }
      - { name: vacate_date, type: string, source: input, description: "Agreed ISO vacate date; must be >= current logical date + MIN_VACATE_NOTICE_DAYS(10) at create/reoffer" }
      - { name: provisional_assistance_cents, type: integer, source: computed, description: "Per calculation provisional_assistance_quote (condition_basis SELF_REPORTED); computed at creation and at each reoffer" }
      - { name: final_assistance_cents, type: integer, source: computed, description: "Per calculation final_assistance_settlement once a passing handover InspectionReport is SUBMITTED; null until then" }
      - { name: condition_basis, type: enum, source: system, description: "SELF_REPORTED | INSPECTED", default: "SELF_REPORTED" }
      - { name: status, type: enum, source: system, description: "DRAFT | OFFERED | COUNTERED | ACCEPTED | COMPLETED | EXPIRED | TERMINATED | SUPERSEDED", default: "DRAFT" }
      - { name: offer_expires_at, type: datetime, source: system, description: "Logical timestamp at which the current offer lapses; set by offer/reoffer" }
      - { name: round_number, type: integer, source: system, description: "Negotiation round; 0 at first offer, +1 per reoffer; hard cap MAX_NEGOTIATION_ROUNDS(3)", default: 0 }
      - { name: created_by_specialist_id, type: string, source: system, description: "X-User-ID of the specialist who created this agreement" }

  - name: InspectionAppointment
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> WorkoutCase.id; case inspected" }
      - { name: inspector_id, type: string, source: input, description: "Opaque inspector identifier; the acting Inspector's X-User-ID must match for report creation and no-access" }
      - { name: appointment_type, type: enum, source: input, description: "HANDOVER | RE_INSPECTION" }
      - { name: scheduled_start, type: datetime, source: input, description: "Half-open interval start; must be >= now + INSPECTION_MIN_NOTICE_HOURS(24) at scheduling" }
      - { name: scheduled_end, type: datetime, source: input, description: "Half-open interval end; must be > scheduled_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED | NO_ACCESS", default: "SCHEDULED" }

  - name: InspectionReport
    parent: null
    common_fields: true
    fields:
      - { name: appointment_id, type: string, source: system, description: "FK -> InspectionAppointment.id; set from the creation path" }
      - { name: case_id, type: string, source: system, description: "FK -> WorkoutCase.id; copied from the appointment" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED", default: "DRAFT" }
      - { name: broom_clean_verified, type: boolean, source: input, description: "Inspector verification of the BROOM_CLEAN condition standard" }
      - { name: keys_returned_count, type: integer, source: input, description: "Number of keys returned at handover; >= 0" }
      - { name: line_items, type: array, source: input, description: "Array of {item_code, severity}; item_code in CLEANLINESS_FAIL | DEBRIS_REMOVAL | APPLIANCE_REMOVED | FIXTURE_DAMAGE | STRUCTURAL_DAMAGE; severity STANDARD | MATERIAL" }
      - { name: total_deduction_cents, type: integer, source: computed, description: "Per calculation condition_deduction_schedule (round per line item, then sum)", default: 0 }
      - { name: result, type: enum, source: system, description: "Set at submit: FAILED if broom_clean_verified false or any STRUCTURAL_DAMAGE line; else PASSED_WITH_DEDUCTIONS if total_deduction_cents > 0; else PASSED" }

  - name: Disbursement
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> WorkoutCase.id; set from the creation path" }
      - { name: agreement_id, type: string, source: input, description: "FK -> SettlementAgreement.id; agreement funding this disbursement" }
      - { name: amount_cents, type: integer, source: input, description: "Requested disbursement in cents; must be > 0 and <= case remaining_assistance_cents" }
      - { name: purpose, type: enum, source: input, description: "RELOCATION_ASSISTANCE only", default: "RELOCATION_ASSISTANCE" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | RELEASED | VOIDED | CLAWED_BACK", default: "PENDING" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of the creating specialist" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the approving DisbursementOfficer; must differ from requested_by_user_id" }
      - { name: released_by_user_id, type: string, source: system, description: "X-User-ID of the releasing DisbursementOfficer; must differ from approved_by_user_id" }
      - { name: released_at, type: datetime, source: system, description: "Logical timestamp of release; null until released" }

  - name: DeficiencyWaiver
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> WorkoutCase.id; set at system creation on agreement acceptance (DEED_IN_LIEU only)" }
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; copied from the case" }
      - { name: status, type: enum, source: system, description: "DRAFT | DOCUMENTED | EXECUTED | RESCINDED", default: "DRAFT" }
      - { name: projected_waiver_cents, type: integer, source: computed, description: "Per calculation deficiency_waiver_amount variant projected_at_agreement; set at creation" }
      - { name: final_waiver_cents, type: integer, source: computed, description: "Variant final_at_recording; computed at execution; null until then" }
      - { name: pre_waiver_deficiency_cents, type: integer, source: system, description: "Deficiency snapshot taken at execution, before zeroing; invariant base" }
      - { name: waived_amount_cents, type: integer, source: system, description: "Amount waived: final_waiver_cents at EXECUTED, reset to 0 at RESCINDED", default: 0 }
      - { name: document_reference, type: string, source: input, description: "Executed waiver document reference supplied at documentation" }

  - name: DeedRecording
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> WorkoutCase.id; set from the creation path" }
      - { name: county, type: string, source: input, description: "Recording county" }
      - { name: instrument_number, type: string, source: system, description: "County instrument number supplied at confirm" }
      - { name: status, type: enum, source: system, description: "PENDING | SUBMITTED | RECORDED | REJECTED", default: "PENDING" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical timestamp of recordation; null until confirmed" }
      - { name: rejection_reason, type: string, source: input, description: "County rejection reason supplied at reject" }

  - name: EvictionCase
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> WorkoutCase.id; set by the escalate-holdover action" }
      - { name: reason, type: enum, source: system, description: "HOLDOVER only", default: "HOLDOVER" }
      - { name: status, type: enum, source: system, description: "ESCALATED | FILED | WRIT_ISSUED | EVICTED | DISMISSED", default: "ESCALATED" }
      - { name: court_reference, type: string, source: input, description: "Court case reference supplied at filing" }
      - { name: filed_at, type: datetime, source: system, description: "Logical timestamp of filing; null until filed" }
      - { name: dismissal_reason, type: enum, source: input, description: "OCCUPANT_VACATED | OTHER; supplied at dismiss" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: WorkoutCase
    initial_state: INTAKE
    terminal_states: [COMPLETED, DECLINED, WITHDRAWN, CLOSED_EVICTED]
    transitions:
      - from: INTAKE
        to: ELIGIBILITY_REVIEW
        trigger: "POST /property-solutions/cases/{id}/submit"
        actor: PropertySolutionsSpecialist
        preconditions:
          - "Case in INTAKE (ERR_CASE_INVALID_STATE)"
          - "Loan.status == ACTIVE_DELINQUENT (ERR_LOAN_INVALID_STATE)"
        side_effects:
          - "Loan.status ACTIVE_DELINQUENT -> WORKOUT_IN_PROGRESS"
          - "Increments WorkoutCase.version and Loan.version by 1"

      - from: ELIGIBILITY_REVIEW
        to: MARKETING_PERIOD
        trigger: "POST /property-solutions/cases/{id}/evaluate-eligibility with decision=PASS"
        actor: PropertySolutionsSpecialist
        preconditions:
          - "Case in ELIGIBILITY_REVIEW (ERR_CASE_INVALID_STATE)"
          - "Loan.delinquency_days >= 31 AND Loan.foreclosure_referral_status != ACTIVE (ERR_ELIGIBILITY_CRITERIA_NOT_MET)"
        side_effects:
          - "Increments WorkoutCase.version by 1"

      - from: ELIGIBILITY_REVIEW
        to: DECLINED
        trigger: "POST /property-solutions/cases/{id}/evaluate-eligibility with decision=FAIL"
        actor: PropertySolutionsSpecialist
        preconditions:
          - "Case in ELIGIBILITY_REVIEW (ERR_CASE_INVALID_STATE)"
        side_effects:
          - "Loan.status WORKOUT_IN_PROGRESS -> ACTIVE_DELINQUENT"
          - "Increments WorkoutCase.version and Loan.version by 1"

      - from: MARKETING_PERIOD
        to: TITLE_REVIEW
        trigger: "POST /property-solutions/cases/{id}/certify-marketing"
        actor: PropertySolutionsSpecialist
        preconditions:
          - "Case in MARKETING_PERIOD (ERR_CASE_INVALID_STATE)"
          - "At least one MarketingListing exists for the case (ERR_LISTING_MISSING)"
          - "Latest-by-created_at listing has creditable_days >= MARKETING_MIN_DAYS(90) OR case.marketing_exception_granted == true (ERR_MARKETING_PERIOD_NOT_MET)"
        side_effects:
          - "Increments WorkoutCase.version by 1"

      - from: TITLE_REVIEW
        to: TERMS_NEGOTIATION
        trigger: "POST /property-solutions/cases/{id}/certify-title"
        actor: PropertySolutionsSpecialist
        preconditions:
          - "Case in TITLE_REVIEW (ERR_CASE_INVALID_STATE)"
          - "A TitleCommitment exists for the case (ERR_TITLE_COMMITMENT_MISSING)"
          - "That TitleCommitment.status == CLEARED: an UNRELEASED lien yields ERR_JUNIOR_LIENS_OUTSTANDING; an ORDERED (not yet received) commitment with zero liens yields ERR_TITLE_INVALID_STATE"
        side_effects:
          - "Increments WorkoutCase.version by 1"

      - from: TERMS_NEGOTIATION
        to: AGREEMENT_ACTIVE
        trigger: "system (automatic when a SettlementAgreement transitions OFFERED -> ACCEPTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Increments WorkoutCase.version by 1"

      - from: AGREEMENT_ACTIVE
        to: VACATE_PENDING
        trigger: "system (automatic when a HANDOVER InspectionAppointment is scheduled for the case)"
        actor: system
        preconditions: []
        side_effects:
          - "Increments WorkoutCase.version by 1"

      - from: AGREEMENT_ACTIVE
        to: TERMS_NEGOTIATION
        trigger: "system (automatic when the ACCEPTED SettlementAgreement is terminated via POST /property-solutions/agreements/{id}/terminate)"
        actor: system
        preconditions: []
        side_effects:
          - "Increments WorkoutCase.version by 1"

      - from: VACATE_PENDING
        to: HANDOVER_INSPECTION
        trigger: "system (automatic when a handover InspectionReport is SUBMITTED for the case)"
        actor: system
        preconditions: []
        side_effects:
          - "Sets handover_date to the logical date at submit; sets keys_returned from the report"

      - from: HANDOVER_INSPECTION
        to: DISBURSEMENT_PENDING
        trigger: "system (automatic, same submit event, when report.result is PASSED or PASSED_WITH_DEDUCTIONS)"
        actor: system
        preconditions: []
        side_effects:
          - "SettlementAgreement.condition_basis SELF_REPORTED -> INSPECTED; final_assistance_cents computed per final_assistance_settlement (causes Case.remaining_assistance_cents recompute)"
          - "Increments WorkoutCase.version by 1"

      - from: HANDOVER_INSPECTION
        to: VACATE_PENDING
        trigger: "system (automatic, same submit event, when report.result is FAILED — cure-and-reinspect loop)"
        actor: system
        preconditions: []
        side_effects:
          - "Increments WorkoutCase.version by 1"

      - from: DISBURSEMENT_PENDING
        to: RECORDING_PENDING
        trigger: "system (DEED_IN_LIEU fork: automatic when remaining_assistance_cents reaches 0 after a release and keys_returned == true)"
        actor: system
        preconditions: []
        side_effects:
          - "Increments WorkoutCase.version by 1"

      - from: DISBURSEMENT_PENDING
        to: COMPLETED
        trigger: "system (CASH_FOR_KEYS fork: automatic when remaining_assistance_cents reaches 0 after a release and keys_returned == true)"
        actor: system
        preconditions: []
        side_effects:
          - "SettlementAgreement ACCEPTED -> COMPLETED"
          - "Loan.status WORKOUT_IN_PROGRESS -> DEED_IN_LIEU_COMPLETED; Loan.servicing_system_synced = true"
          - "Increments WorkoutCase.version and Loan.version by 1"

      - from: RECORDING_PENDING
        to: COMPLETED
        trigger: "system (automatic when the case's DeedRecording transitions SUBMITTED -> RECORDED)"
        actor: system
        preconditions: []
        side_effects:
          - "SettlementAgreement ACCEPTED -> COMPLETED"
          - "DeficiencyWaiver DOCUMENTED -> EXECUTED (final_waiver_cents computed per deficiency_waiver_amount final_at_recording; pre_waiver_deficiency_cents snapshot; waived_amount_cents = final_waiver_cents)"
          - "Loan.status WORKOUT_IN_PROGRESS -> DEED_IN_LIEU_COMPLETED; Loan.servicing_system_synced = true; Loan.deficiency_balance_cents = pre_waiver_deficiency_cents - waived_amount_cents (= 0); Loan.foreclosure_referral_status -> WITHDRAWN if REFERRED"
          - "Increments WorkoutCase.version, DeficiencyWaiver.version, and Loan.version by 1"

      - from: AGREEMENT_ACTIVE
        to: HOLDOVER_ESCALATED
        trigger: "POST /property-solutions/cases/{id}/escalate-holdover"
        actor: WorkoutManager
        preconditions:
          - "Current logical date > ACCEPTED agreement.vacate_date + HOLDOVER_GRACE_DAYS(3) (ERR_HOLDOVER_GRACE_NOT_ELAPSED)"
        side_effects:
          - "Creates EvictionCase(status=ESCALATED, reason=HOLDOVER) for the case"
          - "Increments WorkoutCase.version by 1"

      - from: VACATE_PENDING
        to: HOLDOVER_ESCALATED
        trigger: "POST /property-solutions/cases/{id}/escalate-holdover"
        actor: WorkoutManager
        preconditions:
          - "Current logical date > ACCEPTED agreement.vacate_date + HOLDOVER_GRACE_DAYS(3) (ERR_HOLDOVER_GRACE_NOT_ELAPSED)"
        side_effects:
          - "Creates EvictionCase(status=ESCALATED, reason=HOLDOVER) for the case"
          - "Increments WorkoutCase.version by 1"

      - from: HANDOVER_INSPECTION
        to: HOLDOVER_ESCALATED
        trigger: "POST /property-solutions/cases/{id}/escalate-holdover"
        actor: WorkoutManager
        preconditions:
          - "Current logical date > ACCEPTED agreement.vacate_date + HOLDOVER_GRACE_DAYS(3) (ERR_HOLDOVER_GRACE_NOT_ELAPSED)"
        side_effects:
          - "Creates EvictionCase(status=ESCALATED, reason=HOLDOVER) for the case"
          - "Increments WorkoutCase.version by 1"

      - from: DISBURSEMENT_PENDING
        to: HOLDOVER_ESCALATED
        trigger: "POST /property-solutions/cases/{id}/escalate-holdover"
        actor: WorkoutManager
        preconditions:
          - "Current logical date > ACCEPTED agreement.vacate_date + HOLDOVER_GRACE_DAYS(3) (ERR_HOLDOVER_GRACE_NOT_ELAPSED)"
        side_effects:
          - "Creates EvictionCase(status=ESCALATED, reason=HOLDOVER) for the case"
          - "Increments WorkoutCase.version by 1"

      - from: HOLDOVER_ESCALATED
        to: EVICTION_IN_PROGRESS
        trigger: "system (automatic when the EvictionCase transitions ESCALATED -> FILED)"
        actor: system
        preconditions: []
        side_effects:
          - "SettlementAgreement ACCEPTED -> TERMINATED"
          - "All case Disbursements in PENDING or APPROVED -> VOIDED"
          - "For DEED_IN_LIEU: Loan.status WORKOUT_IN_PROGRESS -> FORECLOSURE_PROCEEDING"
          - "Increments WorkoutCase.version by 1"

      - from: EVICTION_IN_PROGRESS
        to: CLOSED_EVICTED
        trigger: "system (automatic when the EvictionCase transitions WRIT_ISSUED -> EVICTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Increments WorkoutCase.version by 1"

      - from: HOLDOVER_ESCALATED
        to: VACATE_PENDING
        trigger: "system (automatic when the EvictionCase is DISMISSED from ESCALATED with dismissal_reason=OCCUPANT_VACATED)"
        actor: system
        preconditions: []
        side_effects:
          - "Increments WorkoutCase.version by 1"

      - from: EVICTION_IN_PROGRESS
        to: TERMS_NEGOTIATION
        trigger: "system (automatic when the EvictionCase is DISMISSED from FILED with dismissal_reason=OCCUPANT_VACATED — renegotiation cycle; prior agreement stays TERMINATED)"
        actor: system
        preconditions: []
        side_effects:
          - "For DEED_IN_LIEU: Loan.status FORECLOSURE_PROCEEDING -> WORKOUT_IN_PROGRESS"
          - "Increments WorkoutCase.version by 1"

      - from: INTAKE
        to: WITHDRAWN
        trigger: "POST /property-solutions/cases/{id}/withdraw"
        actor: PropertySolutionsSpecialist
        preconditions: []
        side_effects:
          - "Cascade: any SettlementAgreement in DRAFT/OFFERED/COUNTERED/ACCEPTED -> TERMINATED; any MarketingListing in ACTIVE/SUSPENDED -> CLOSED; any Disbursement in PENDING/APPROVED -> VOIDED; Loan.status WORKOUT_IN_PROGRESS -> ACTIVE_DELINQUENT"
          - "Increments WorkoutCase.version by 1"

      - from: ELIGIBILITY_REVIEW
        to: WITHDRAWN
        trigger: "POST /property-solutions/cases/{id}/withdraw"
        actor: PropertySolutionsSpecialist
        preconditions: []
        side_effects: ["Same withdraw cascade as INTAKE -> WITHDRAWN"]

      - from: MARKETING_PERIOD
        to: WITHDRAWN
        trigger: "POST /property-solutions/cases/{id}/withdraw"
        actor: PropertySolutionsSpecialist
        preconditions: []
        side_effects: ["Same withdraw cascade as INTAKE -> WITHDRAWN"]

      - from: TITLE_REVIEW
        to: WITHDRAWN
        trigger: "POST /property-solutions/cases/{id}/withdraw"
        actor: PropertySolutionsSpecialist
        preconditions: []
        side_effects: ["Same withdraw cascade as INTAKE -> WITHDRAWN"]

      - from: TERMS_NEGOTIATION
        to: WITHDRAWN
        trigger: "POST /property-solutions/cases/{id}/withdraw"
        actor: PropertySolutionsSpecialist
        preconditions: []
        side_effects: ["Same withdraw cascade as INTAKE -> WITHDRAWN"]

      - from: AGREEMENT_ACTIVE
        to: WITHDRAWN
        trigger: "POST /property-solutions/cases/{id}/withdraw"
        actor: PropertySolutionsSpecialist
        preconditions: []
        side_effects: ["Same withdraw cascade as INTAKE -> WITHDRAWN"]

      - from: VACATE_PENDING
        to: WITHDRAWN
        trigger: "POST /property-solutions/cases/{id}/withdraw"
        actor: PropertySolutionsSpecialist
        preconditions: []
        side_effects: ["Same withdraw cascade as INTAKE -> WITHDRAWN"]

      - from: HOLDOVER_ESCALATED
        to: WITHDRAWN
        trigger: "POST /property-solutions/cases/{id}/withdraw"
        actor: PropertySolutionsSpecialist
        preconditions: []
        side_effects: ["Same withdraw cascade as INTAKE -> WITHDRAWN; any EvictionCase in ESCALATED -> DISMISSED with dismissal_reason=OTHER"]

  - entity: Loan
    initial_state: ACTIVE_DELINQUENT
    terminal_states: [DEED_IN_LIEU_COMPLETED]
    transitions:
      - from: ACTIVE_DELINQUENT
        to: WORKOUT_IN_PROGRESS
        trigger: "system (case submit)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WORKOUT_IN_PROGRESS
        to: ACTIVE_DELINQUENT
        trigger: "system (case DECLINED on FAIL decision, or case WITHDRAWN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WORKOUT_IN_PROGRESS
        to: DEED_IN_LIEU_COMPLETED
        trigger: "system (deed recording confirmed for DIL, or final disbursement release for CFK)"
        actor: system
        preconditions: []
        side_effects: ["servicing_system_synced = true; deficiency_balance_cents per executed waiver"]
      - from: WORKOUT_IN_PROGRESS
        to: FORECLOSURE_PROCEEDING
        trigger: "system (eviction filed on a DEED_IN_LIEU case)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FORECLOSURE_PROCEEDING
        to: WORKOUT_IN_PROGRESS
        trigger: "system (eviction dismissed from FILED with OCCUPANT_VACATED on a DEED_IN_LIEU case)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MarketingListing
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /property-solutions/listings/{id}/suspend"
        actor: PropertySolutionsSpecialist
        preconditions:
          - "Listing in ACTIVE (ERR_LISTING_INVALID_STATE)"
        side_effects:
          - "Creates ListingSuspension(listing_id, started_at=now, ended_at=null, reason=input)"
          - "Recomputes creditable_days"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /property-solutions/listings/{id}/resume"
        actor: PropertySolutionsSpecialist
        preconditions:
          - "Listing in SUSPENDED (ERR_LISTING_INVALID_STATE)"
        side_effects:
          - "Closes the open ListingSuspension (ended_at=now)"
          - "Recomputes creditable_days"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /property-solutions/listings/{id}/close (or system cascade on case withdraw)"
        actor: PropertySolutionsSpecialist
        preconditions: []
        side_effects:
          - "Closes any open ListingSuspension (ended_at=now)"
          - "Freezes creditable_days at its closing value"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /property-solutions/listings/{id}/close (or system cascade on case withdraw)"
        actor: PropertySolutionsSpecialist
        preconditions: []
        side_effects: ["Closes the open ListingSuspension (ended_at=now); freezes creditable_days"]

  - entity: TitleCommitment
    initial_state: ORDERED
    terminal_states: []
    transitions:
      - from: ORDERED
        to: RECEIVED
        trigger: "POST /property-solutions/title-commitments/{id}/receive"
        actor: TitleOfficer
        preconditions:
          - "Commitment in ORDERED (ERR_TITLE_INVALID_STATE)"
        side_effects:
          - "Sets vested_owner_name; if unreleased_lien_count == 0, immediately auto-transitions RECEIVED -> CLEARED (bubble-up)"
      - from: RECEIVED
        to: CLEARED
        trigger: "system (automatic when unreleased_lien_count reaches 0 — on receive with zero liens or on the last lien release)"
        actor: system
        preconditions: []
        side_effects:
          - "Increments TitleCommitment.version by 1"
      - from: CLEARED
        to: RECEIVED
        trigger: "POST /property-solutions/title-commitments/{id}/liens (supplemental title work: a newly discovered junior lien reopens a cleared commitment)"
        actor: TitleOfficer
        preconditions: []
        side_effects:
          - "unreleased_lien_count += 1; increments TitleCommitment.version by 1"

  - entity: JuniorLien
    initial_state: UNRELEASED
    terminal_states: [RELEASED]
    transitions:
      - from: UNRELEASED
        to: RELEASED
        trigger: "POST /property-solutions/title-commitments/{id}/lien-releases"
        actor: TitleOfficer
        preconditions:
          - "Lien in UNRELEASED (ERR_LIEN_INVALID_STATE)"
          - "settlement_amount_cents <= lien.amount_cents (ERR_SETTLEMENT_EXCEEDS_LIEN)"
        side_effects:
          - "Sets settlement_amount_cents and released_at; decrements commitment.unreleased_lien_count"
          - "If unreleased_lien_count reaches 0, commitment RECEIVED -> CLEARED (bubble-up, causes commitment.version increment)"
          - "Increments TitleCommitment.version by 1 (OCC write)"

  - entity: SettlementAgreement
    initial_state: DRAFT
    terminal_states: [COMPLETED, EXPIRED, TERMINATED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: OFFERED
        trigger: "POST /property-solutions/agreements/{id}/offer"
        actor: PropertySolutionsSpecialist
        preconditions:
          - "Agreement in DRAFT (ERR_AGREEMENT_INVALID_STATE)"
        side_effects:
          - "offer_expires_at = now + offer_valid_days days; round_number stays 0"
      - from: OFFERED
        to: COUNTERED
        trigger: "POST /property-solutions/agreements/{id}/counter"
        actor: Borrower
        preconditions:
          - "Agreement in OFFERED (ERR_AGREEMENT_INVALID_STATE)"
          - "X-User-ID == case.borrower_id (ERR_FORBIDDEN)"
          - "now <= offer_expires_at (ERR_OFFER_EXPIRED)"
        side_effects:
          - "vacate_date replaced by proposed_vacate_date (must satisfy MIN_VACATE_NOTICE_DAYS — ERR_VACATE_DATE_TOO_SOON); provisional_assistance_cents unchanged"
      - from: COUNTERED
        to: OFFERED
        trigger: "POST /property-solutions/agreements/{id}/reoffer"
        actor: PropertySolutionsSpecialist
        preconditions:
          - "Agreement in COUNTERED (ERR_AGREEMENT_INVALID_STATE)"
          - "round_number < MAX_NEGOTIATION_ROUNDS(3) (ERR_NEGOTIATION_ROUND_LIMIT)"
        side_effects:
          - "vacate_date replaced by input; round_number += 1; provisional_assistance_cents recomputed; offer_expires_at = now + offer_valid_days days"
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /property-solutions/agreements/{id}/accept"
        actor: Borrower
        preconditions:
          - "Agreement in OFFERED (ERR_AGREEMENT_INVALID_STATE)"
          - "X-User-ID == case.borrower_id (ERR_FORBIDDEN)"
          - "now <= offer_expires_at (ERR_OFFER_EXPIRED) — checked BEFORE lien clearance (temporal outranks referential)"
          - "For program_type DEED_IN_LIEU only: no JuniorLien in UNRELEASED on the case's title commitment (ERR_JUNIOR_LIENS_OUTSTANDING); skipped for CASH_FOR_KEYS"
        side_effects:
          - "Case TERMS_NEGOTIATION -> AGREEMENT_ACTIVE (bubble-up)"
          - "For DEED_IN_LIEU: creates DeficiencyWaiver(status=DRAFT, projected_waiver_cents per deficiency_waiver_amount projected_at_agreement)"
      - from: OFFERED
        to: EXPIRED
        trigger: "system (evaluated lazily when the agreement is read or acted upon and now > offer_expires_at; on accept/counter the expiry guard reports ERR_OFFER_EXPIRED and the agreement then flips EXPIRED; plain reads flip it silently; the clock-set endpoint does NOT sweep)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: TERMINATED
        trigger: "POST /property-solutions/agreements/{id}/terminate, or system cascade (case withdraw, eviction filing)"
        actor: WorkoutManager
        preconditions:
          - "Agreement in ACCEPTED (ERR_AGREEMENT_INVALID_STATE)"
        side_effects:
          - "If case in AGREEMENT_ACTIVE: case AGREEMENT_ACTIVE -> TERMS_NEGOTIATION (renegotiation revert)"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (automatic when a new agreement is created for the same case while this one is DRAFT)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: COMPLETED
        trigger: "system (automatic when the case completes)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: InspectionAppointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_ACCESS]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "system (automatic when its InspectionReport is SUBMITTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /property-solutions/inspection-appointments/{id}/cancel"
        actor: PropertySolutionsSpecialist
        preconditions:
          - "Appointment in SCHEDULED (ERR_APPOINTMENT_INVALID_STATE)"
        side_effects: []
      - from: SCHEDULED
        to: NO_ACCESS
        trigger: "POST /property-solutions/inspection-appointments/{id}/no-access"
        actor: Inspector
        preconditions:
          - "Appointment in SCHEDULED (ERR_APPOINTMENT_INVALID_STATE)"
          - "X-User-ID == appointment.inspector_id (ERR_FORBIDDEN)"
        side_effects: ["Holdover evidence: no case state change; specialist may cancel and manager may escalate"]

  - entity: InspectionReport
    initial_state: DRAFT
    terminal_states: [SUBMITTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /property-solutions/inspection-reports/{id}/submit"
        actor: Inspector
        preconditions:
          - "Report in DRAFT (ERR_REPORT_INVALID_STATE)"
          - "X-User-ID == appointment.inspector_id (ERR_FORBIDDEN)"
        side_effects:
          - "Computes total_deduction_cents per condition_deduction_schedule and derives result"
          - "Hop 1 -> Appointment SCHEDULED -> COMPLETED; Case VACATE_PENDING -> HANDOVER_INSPECTION (sets handover_date, keys_returned)"
          - "Hop 2 -> if result PASSED or PASSED_WITH_DEDUCTIONS: Case HANDOVER_INSPECTION -> DISBURSEMENT_PENDING and agreement final_assistance_cents computed (condition_basis INSPECTED); if FAILED: Case HANDOVER_INSPECTION -> VACATE_PENDING (cure loop)"

  - entity: Disbursement
    initial_state: PENDING
    terminal_states: [RELEASED, VOIDED, CLAWED_BACK]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /property-solutions/disbursements/{id}/approve"
        actor: DisbursementOfficer
        preconditions:
          - "Disbursement in PENDING (ERR_DISBURSEMENT_INVALID_STATE)"
          - "SoD: approving X-User-ID != requested_by_user_id (ERR_SOD_APPROVER_EQUALS_REQUESTER)"
        side_effects: ["Sets approved_by_user_id"]
      - from: APPROVED
        to: RELEASED
        trigger: "POST /property-solutions/disbursements/{id}/release"
        actor: DisbursementOfficer
        preconditions:
          - "Disbursement in APPROVED (ERR_DISBURSEMENT_INVALID_STATE)"
          - "SoD: releasing X-User-ID != approved_by_user_id (ERR_SOD_RELEASER_EQUALS_APPROVER)"
          - "Case.keys_returned == true (ERR_KEYS_NOT_RETURNED)"
        side_effects:
          - "Sets released_by_user_id and released_at"
          - "Case.total_disbursed_cents += amount_cents; remaining_assistance_cents recomputed"
          - "If remaining_assistance_cents == 0: program fork — DEED_IN_LIEU case -> RECORDING_PENDING; CASH_FOR_KEYS case -> COMPLETED (with its completion cascade)"
      - from: PENDING
        to: VOIDED
        trigger: "POST /property-solutions/disbursements/{id}/void, or system cascade (case withdraw, eviction filing)"
        actor: PropertySolutionsSpecialist
        preconditions:
          - "Disbursement in PENDING (ERR_DISBURSEMENT_INVALID_STATE)"
        side_effects: []
      - from: APPROVED
        to: VOIDED
        trigger: "POST /property-solutions/disbursements/{id}/void, or system cascade"
        actor: PropertySolutionsSpecialist
        preconditions:
          - "Disbursement in APPROVED (ERR_DISBURSEMENT_INVALID_STATE)"
        side_effects: []
      - from: RELEASED
        to: CLAWED_BACK
        trigger: "POST /property-solutions/disbursements/{id}/clawback"
        actor: WorkoutManager
        preconditions:
          - "Disbursement in RELEASED (ERR_DISBURSEMENT_INVALID_STATE)"
        side_effects:
          - "Case.total_disbursed_cents -= amount_cents; remaining_assistance_cents recomputed (compensating action of release — INV-ASSISTANCE)"

  - entity: DeficiencyWaiver
    initial_state: DRAFT
    terminal_states: [EXECUTED, RESCINDED]
    transitions:
      - from: DRAFT
        to: DOCUMENTED
        trigger: "POST /property-solutions/deficiency-waivers/{id}/document"
        actor: LegalCounsel
        preconditions:
          - "Waiver in DRAFT (ERR_WAIVER_INVALID_STATE)"
        side_effects: ["Sets document_reference"]
      - from: DOCUMENTED
        to: EXECUTED
        trigger: "system (automatic when the case's DeedRecording is confirmed RECORDED)"
        actor: system
        preconditions: []
        side_effects:
          - "final_waiver_cents computed per deficiency_waiver_amount final_at_recording; pre_waiver_deficiency_cents = final_waiver_cents; waived_amount_cents = final_waiver_cents; Loan.deficiency_balance_cents = 0 (INV-DEBT)"
      - from: EXECUTED
        to: RESCINDED
        trigger: "POST /property-solutions/deficiency-waivers/{id}/rescind"
        actor: WorkoutManager
        preconditions:
          - "Waiver in EXECUTED (ERR_WAIVER_INVALID_STATE)"
        side_effects:
          - "waived_amount_cents reset to 0; Loan.deficiency_balance_cents restored to pre_waiver_deficiency_cents (compensating action of execution — INV-DEBT)"

  - entity: DeedRecording
    initial_state: PENDING
    terminal_states: [RECORDED, REJECTED]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /property-solutions/deed-recordings/{id}/submit"
        actor: LegalCounsel
        preconditions:
          - "Recording in PENDING (ERR_RECORDING_INVALID_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: RECORDED
        trigger: "POST /property-solutions/deed-recordings/{id}/confirm"
        actor: LegalCounsel
        preconditions:
          - "Recording in SUBMITTED (ERR_RECORDING_INVALID_STATE)"
          - "Case's DeficiencyWaiver in DOCUMENTED (ERR_WAIVER_NOT_DOCUMENTED)"
          - "Logical date <= case.handover_date + RECORDING_DEADLINE_DAYS(30) (ERR_RECORDING_DEADLINE_PASSED)"
        side_effects:
          - "Sets instrument_number and recorded_at"
          - "Hop 1 -> Case RECORDING_PENDING -> COMPLETED"
          - "Hop 2 -> (case completion causes) DeficiencyWaiver DOCUMENTED -> EXECUTED with final amounts, and Loan.status -> DEED_IN_LIEU_COMPLETED with servicing_system_synced = true"
          - "Hop 3 -> (waiver execution causes) Loan.deficiency_balance_cents = 0 and Loan.foreclosure_referral_status -> WITHDRAWN if REFERRED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /property-solutions/deed-recordings/{id}/reject"
        actor: LegalCounsel
        preconditions:
          - "Recording in SUBMITTED (ERR_RECORDING_INVALID_STATE)"
        side_effects: ["Sets rejection_reason; case remains RECORDING_PENDING and a new DeedRecording may be created"]

  - entity: EvictionCase
    initial_state: ESCALATED
    terminal_states: [EVICTED, DISMISSED]
    transitions:
      - from: ESCALATED
        to: FILED
        trigger: "POST /property-solutions/eviction-cases/{id}/file"
        actor: LegalCounsel
        preconditions:
          - "EvictionCase in ESCALATED (ERR_EVICTION_INVALID_STATE)"
        side_effects:
          - "Sets court_reference and filed_at"
          - "Case HOLDOVER_ESCALATED -> EVICTION_IN_PROGRESS (with its termination/void cascade)"
      - from: FILED
        to: WRIT_ISSUED
        trigger: "POST /property-solutions/eviction-cases/{id}/writ"
        actor: LegalCounsel
        preconditions:
          - "EvictionCase in FILED (ERR_EVICTION_INVALID_STATE)"
        side_effects: []
      - from: WRIT_ISSUED
        to: EVICTED
        trigger: "POST /property-solutions/eviction-cases/{id}/evicted"
        actor: LegalCounsel
        preconditions:
          - "EvictionCase in WRIT_ISSUED (ERR_EVICTION_INVALID_STATE)"
        side_effects: ["Case EVICTION_IN_PROGRESS -> CLOSED_EVICTED"]
      - from: ESCALATED
        to: DISMISSED
        trigger: "POST /property-solutions/eviction-cases/{id}/dismiss"
        actor: LegalCounsel
        preconditions:
          - "EvictionCase in ESCALATED (ERR_EVICTION_INVALID_STATE)"
        side_effects:
          - "If dismissal_reason == OCCUPANT_VACATED: Case HOLDOVER_ESCALATED -> VACATE_PENDING; if OTHER: case remains HOLDOVER_ESCALATED"
      - from: FILED
        to: DISMISSED
        trigger: "POST /property-solutions/eviction-cases/{id}/dismiss"
        actor: LegalCounsel
        preconditions:
          - "EvictionCase in FILED (ERR_EVICTION_INVALID_STATE)"
        side_effects:
          - "If dismissal_reason == OCCUPANT_VACATED: Case EVICTION_IN_PROGRESS -> TERMS_NEGOTIATION (renegotiation cycle; DIL loan returns to WORKOUT_IN_PROGRESS); if OTHER: case remains EVICTION_IN_PROGRESS"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: case-agreement-create-stale-version
    parent_entity: WorkoutCase
    write_endpoint: "POST /property-solutions/cases/{id}/agreements"
    occ_field: expected_case_version
    description: |
      Creating a SettlementAgreement against a WorkoutCase whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just created an agreement (which legitimately
      supersedes a prior DRAFT) or otherwise mutated the case, so the current
      writer's view of the case is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: title-lien-release-stale-version
    parent_entity: TitleCommitment
    write_endpoint: "POST /property-solutions/title-commitments/{id}/lien-releases"
    occ_field: expected_title_commitment_version
    description: |
      Releasing a JuniorLien against a TitleCommitment whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another title officer has just released a lien on the same commitment (a
      legitimate write that bumps the commitment version), so the current
      writer's view of the commitment is stale.
    error_id: ERR_STALE_TITLE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: provisional_assistance_quote
    trigger: "SettlementAgreement creation (POST /property-solutions/cases/{id}/agreements) and each reoffer"
    algorithm: tiered_pricing
    formula: |
      base = TIER(Loan.unpaid_principal_balance_cents)          # UPB tier base
      step1 = round_half_up(base * OCC_MULT[Property.occupancy_type])   # per-component rounding, whole cents
      step2 = step1 + HARDSHIP_BONUS[Borrower.hardship_type]
      step3 = max(step2, ASSISTANCE_FLOOR_CENTS)                 # floor BEFORE cap (pinned order)
      provisional_assistance_cents = min(step3, ASSISTANCE_CAP_CENTS)
      Evaluation order is pinned: tier -> occupancy multiply -> round -> hardship add -> floor -> cap.
    input_set: "The case's Loan (any status), Property (any), Borrower (any); computed with condition_basis = SELF_REPORTED"
    constants:
      TIER_1_MAX_CENTS: 10000000        # UPB <  $100,000 -> base 300000
      TIER_1_BASE_CENTS: 300000
      TIER_2_MAX_CENTS: 25000000        # UPB in [$100,000, $250,000) -> base 500000; tier boundary is INCLUSIVE of the lower bound
      TIER_2_BASE_CENTS: 500000
      TIER_3_MAX_CENTS: 50000000        # UPB in [$250,000, $500,000) -> base 750000
      TIER_3_BASE_CENTS: 750000
      TIER_4_BASE_CENTS: 1150000        # UPB >= $500,000 -> base 1150000
      ASSISTANCE_FLOOR_CENTS: 150000
      ASSISTANCE_CAP_CENTS: 1200000
    precision: "integer cents; round_half_up at the occupancy multiply step only"
    variants:
      - name: by_occupancy_multiplier
        when: "always — multiplier selected by Property.occupancy_type"
        difference: "OWNER_OCCUPIED x1.0 | TENANT_OCCUPIED x0.8 | SECOND_HOME x0.5"
      - name: by_hardship_bonus
        when: "always — bonus selected by Borrower.hardship_type"
        difference: "INVOLUNTARY_UNEMPLOYMENT +100000 | MEDICAL +50000 | DIVORCE +25000 | NONE +0"

  - name: final_assistance_settlement
    trigger: "InspectionReport submit when result is PASSED or PASSED_WITH_DEDUCTIONS"
    algorithm: constraint_propagation
    formula: |
      penalty_cap = round_half_up(provisional_assistance_cents * PENALTY_CAP_PCT)   # 0.5
      holdover_penalty = min(holdover_penalty_accrual.penalty_cents, penalty_cap)
      final_assistance_cents = max(0, provisional_assistance_cents
                                     - InspectionReport.total_deduction_cents
                                     - holdover_penalty)
      Evaluation order pinned: deductions and penalty are computed independently from
      provisional, then subtracted; floor at 0. A zero final assistance still advances
      the case to DISBURSEMENT_PENDING (no disbursement can be created for 0).
    input_set: "The ACCEPTED SettlementAgreement, the just-SUBMITTED handover InspectionReport, the case handover_date vs agreement vacate_date"
    constants:
      PENALTY_CAP_PCT: 0.5
    precision: "integer cents"
    variants:
      - name: provisional_basis
        when: "agreement created/reoffered (condition_basis SELF_REPORTED)"
        difference: "provisional_assistance_quote output; no inspection deductions, no holdover penalty — diverges from inspected basis whenever deductions or penalty are nonzero"
      - name: inspected_basis
        when: "passing handover report submitted (condition_basis INSPECTED)"
        difference: "subtracts total_deduction_cents and capped holdover penalty; final_assistance_cents replaces provisional as the disbursable amount"

  - name: condition_deduction_schedule
    trigger: "InspectionReport submit"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER (mode b): round EACH line item first, then sum.
      for each line in line_items:
          line_cents[i] = round_half_up(ITEM_BASE_CENTS[line.item_code] * SEVERITY_MULT[line.severity])
      total_deduction_cents = sum(line_cents)
      # Sum-then-round of raw products can differ by cents (e.g. two MATERIAL items on
      # CLEANLINESS_FAIL and DEBRIS_REMOVAL: per-item 22499+37499 = 59998 vs raw-sum 59997).
      # The per-item order above is the only correct one.
    input_set: "The submitting report's line_items array (order-insensitive; sum is commutative after per-item rounding)"
    constants:
      BASE_CLEANLINESS_FAIL_CENTS: 14999
      BASE_DEBRIS_REMOVAL_CENTS: 24999
      BASE_APPLIANCE_REMOVED_CENTS: 39999
      BASE_FIXTURE_DAMAGE_CENTS: 59999
      BASE_STRUCTURAL_DAMAGE_CENTS: 149999
      SEVERITY_MULT_STANDARD: 1.0
      SEVERITY_MULT_MATERIAL: 1.5
    precision: "integer cents; round_half_up per line item, then sum"

  - name: creditable_marketing_days
    trigger: "MarketingListing suspend/resume/close; on read of a listing; on certify-marketing"
    algorithm: interval_merge
    formula: |
      # PINNED EVALUATION ORDER (mode c): clamp -> sort -> merge -> subtract.
      eval_date = current logical date (for CLOSED listings: the closing date — creditable_days freezes)
      1. span_days = max(0, eval_date - list_date) in whole days
      2. Clamp every ListingSuspension interval to [list_date, eval_date];
         an OPEN suspension (ended_at null) is treated as ending at eval_date.
      3. Sort intervals by started_at (tie-break: earlier created_at first);
         merge intervals that OVERLAP OR TOUCH (adjacency gap == 0 merges) into a union.
      4. suspended_days = sum of merged union interval lengths in whole days.
      5. creditable_days = max(0, span_days - suspended_days)
      Naive per-interval subtraction double-counts overlaps and MUST NOT be used.
    input_set: "All ListingSuspension rows for the listing (any state of open/closed)"
    constants:
      MARKETING_MIN_DAYS: 90
    precision: "whole days; date arithmetic on ISO dates"

  - name: deficiency_waiver_amount
    trigger: "variant projected_at_agreement: DeficiencyWaiver creation (on DIL agreement acceptance). variant final_at_recording: DeedRecording confirm"
    algorithm: forward_looking
    formula: |
      accrual_base = Loan.unpaid_principal_balance_cents + Loan.accrued_interest_cents
                     + Loan.escrow_advances_cents + Loan.foreclosure_fees_cents
      projected: days = (agreement.vacate_date - date(agreement accepted_at)) in whole days
                 projected_waiver_cents = max(0, accrual_base + Loan.per_diem_interest_cents * days
                                                 - Loan.fair_market_value_cents)
      final:     days = (date(recording recorded_at) - date(agreement accepted_at)) in whole days
                 final_waiver_cents     = max(0, accrual_base + Loan.per_diem_interest_cents * days
                                                 - Loan.fair_market_value_cents)
      The two variants legitimately diverge whenever actual recordation lands on a
      different date than the agreed vacate date.
    input_set: "The case's Loan and the ACCEPTED agreement (accepted_at date, vacate_date); final uses DeedRecording.recorded_at"
    constants: {}
    precision: "integer cents; per_diem_interest_cents already rounded at Loan level"
    variants:
      - name: projected_at_agreement
        when: "waiver DRAFT creation at agreement acceptance"
        difference: "forward-looking accrual to the AGREED vacate_date"
      - name: final_at_recording
        when: "waiver execution at deed recording confirmation"
        difference: "chronological accrual to the ACTUAL recorded_at date; replaces projection"

  - name: holdover_penalty_accrual
    trigger: "final_assistance_settlement (as a component)"
    algorithm: chronological
    formula: |
      days_late = max(0, (case.handover_date - agreement.vacate_date) in whole days - HOLDOVER_GRACE_DAYS)
      penalty_cents = HOLDOVER_DAILY_PENALTY_CENTS * days_late
      Boundary: handover exactly on vacate_date + 3 (last grace day) => 0; on vacate_date + 4 => 15000.
    input_set: "The ACCEPTED agreement's vacate_date and the case handover_date"
    constants:
      HOLDOVER_GRACE_DAYS: 3
      HOLDOVER_DAILY_PENALTY_CENTS: 15000
    precision: "integer cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Acting role is in the endpoint's role list; entity-backed ownership: Borrower X-User-ID must equal the parent case's borrower_id for counter/accept; Inspector X-User-ID must equal appointment.inspector_id for report create/submit/no-access", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path ids resolve left-to-right; body FK fields (loan_id, borrower_id, case_id, agreement_id, lien_id) resolve", error_id: ERR_LOAN_NOT_FOUND, http_status: 404, applies_to: "all — per-entity 404 ids: ERR_LOAN_NOT_FOUND | ERR_BORROWER_NOT_FOUND | ERR_PROPERTY_NOT_FOUND | ERR_CASE_NOT_FOUND | ERR_LISTING_NOT_FOUND | ERR_TITLE_COMMITMENT_NOT_FOUND | ERR_LIEN_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_APPOINTMENT_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_DISBURSEMENT_NOT_FOUND | ERR_WAIVER_NOT_FOUND | ERR_RECORDING_NOT_FOUND | ERR_EVICTION_CASE_NOT_FOUND" }
  - { priority: 4, category: existence, check: "Request body well-formed: required fields present, types valid, enum values in domain, integer cents fields within declared sign constraints", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all; invalid enum value uses ERR_INVALID_ENUM (400)" }
  - { priority: 5, category: state, check: "Target resource is in a state from which the requested transition exists (per §1.2); terminal states reject all actions", error_id: ERR_CASE_INVALID_STATE, http_status: 409, applies_to: "all action endpoints — per-entity ids: ERR_CASE_INVALID_STATE | ERR_LOAN_INVALID_STATE | ERR_LISTING_INVALID_STATE | ERR_TITLE_INVALID_STATE | ERR_LIEN_INVALID_STATE | ERR_AGREEMENT_INVALID_STATE | ERR_APPOINTMENT_INVALID_STATE | ERR_REPORT_INVALID_STATE | ERR_DISBURSEMENT_INVALID_STATE | ERR_RECORDING_INVALID_STATE | ERR_EVICTION_INVALID_STATE | ERR_WAIVER_INVALID_STATE" }
  - { priority: 6, category: business_safety, check: "Segregation of duties: disbursement approver X-User-ID != requested_by_user_id", error_id: ERR_SOD_APPROVER_EQUALS_REQUESTER, http_status: 422, applies_to: "POST /property-solutions/disbursements/{id}/approve" }
  - { priority: 7, category: business_safety, check: "Segregation of duties: disbursement releaser X-User-ID != approved_by_user_id", error_id: ERR_SOD_RELEASER_EQUALS_APPROVER, http_status: 422, applies_to: "POST /property-solutions/disbursements/{id}/release" }
  - { priority: 8, category: business_constraint, check: "Uniqueness (disjoint per endpoint, so shared priority is unambiguous): loan_number unique (ERR_INVALID_REQUEST on conflict); one non-CLOSED MarketingListing per case", error_id: ERR_ACTIVE_LISTING_EXISTS, http_status: 409, applies_to: "POST /property-solutions/listings; POST /property-solutions/loans" }
  - { priority: 8, category: business_constraint, check: "One active SettlementAgreement per case: creating while one is OFFERED/COUNTERED/ACCEPTED is rejected (a DRAFT is superseded instead)", error_id: ERR_ACTIVE_AGREEMENT_EXISTS, http_status: 409, applies_to: "POST /property-solutions/cases/{id}/agreements" }
  - { priority: 8, category: business_constraint, check: "Lien position unique per title commitment", error_id: ERR_LIEN_POSITION_DUPLICATE, http_status: 409, applies_to: "POST /property-solutions/title-commitments/{id}/liens" }
  - { priority: 9, category: business_constraint, check: "Negotiation round cap: reoffer requires round_number < 3", error_id: ERR_NEGOTIATION_ROUND_LIMIT, http_status: 422, applies_to: "POST /property-solutions/agreements/{id}/reoffer" }
  - { priority: 10, category: business_constraint, check: "Inspector calendar: new appointment's half-open interval extended by INSPECTION_TRAVEL_BUFFER_MINUTES(30) at its end must not intersect any other SCHEDULED appointment's similarly-buffered interval for the same inspector_id (touching endpoints allowed)", error_id: ERR_INSPECTOR_SCHEDULE_CONFLICT, http_status: 409, applies_to: "POST /property-solutions/inspection-appointments" }
  - { priority: 11, category: business_constraint, check: "Eligibility gates on PASS decision: Loan.delinquency_days >= 31 and foreclosure_referral_status != ACTIVE", error_id: ERR_ELIGIBILITY_CRITERIA_NOT_MET, http_status: 422, applies_to: "POST /property-solutions/cases/{id}/evaluate-eligibility" }
  - { priority: 12, category: business_temporal, check: "Offer not expired: now <= offer_expires_at (checked before any lien/referential check on accept)", error_id: ERR_OFFER_EXPIRED, http_status: 422, applies_to: "POST /property-solutions/agreements/{id}/accept and /counter" }
  - { priority: 13, category: business_temporal, check: "vacate_date >= current logical date + 10 days at agreement create, counter, and reoffer", error_id: ERR_VACATE_DATE_TOO_SOON, http_status: 422, applies_to: "agreement create/counter/reoffer" }
  - { priority: 14, category: business_temporal, check: "Inspection scheduled_start >= now + 24 hours at scheduling (evaluated AFTER the calendar-conflict constraint)", error_id: ERR_INSPECTION_TOO_SOON, http_status: 422, applies_to: "POST /property-solutions/inspection-appointments" }
  - { priority: 15, category: business_temporal, check: "Marketing minimum: latest listing creditable_days >= 90 unless marketing_exception_granted", error_id: ERR_MARKETING_PERIOD_NOT_MET, http_status: 422, applies_to: "POST /property-solutions/cases/{id}/certify-marketing" }
  - { priority: 16, category: business_temporal, check: "Holdover escalation allowed only after vacate_date + 3 grace days", error_id: ERR_HOLDOVER_GRACE_NOT_ELAPSED, http_status: 422, applies_to: "POST /property-solutions/cases/{id}/escalate-holdover" }
  - { priority: 17, category: business_temporal, check: "Deed recording confirm within 30 days of case.handover_date", error_id: ERR_RECORDING_DEADLINE_PASSED, http_status: 422, applies_to: "POST /property-solutions/deed-recordings/{id}/confirm" }
  - { priority: 18, category: business_referential, check: "A MarketingListing exists for the case before marketing certification", error_id: ERR_LISTING_MISSING, http_status: 422, applies_to: "POST /property-solutions/cases/{id}/certify-marketing" }
  - { priority: 19, category: business_referential, check: "A TitleCommitment exists for the case before title certification", error_id: ERR_TITLE_COMMITMENT_MISSING, http_status: 422, applies_to: "POST /property-solutions/cases/{id}/certify-title" }
  - { priority: 20, category: business_referential, check: "No JuniorLien in UNRELEASED on the case's commitment — gates certify-title and (DEED_IN_LIEU only) agreement accept", error_id: ERR_JUNIOR_LIENS_OUTSTANDING, http_status: 422, applies_to: "certify-title; agreement accept (DIL only)" }
  - { priority: 21, category: business_referential, check: "Case keys_returned == true before any disbursement release", error_id: ERR_KEYS_NOT_RETURNED, http_status: 422, applies_to: "POST /property-solutions/disbursements/{id}/release" }
  - { priority: 22, category: business_referential, check: "Case DeficiencyWaiver in DOCUMENTED before deed recording confirm", error_id: ERR_WAIVER_NOT_DOCUMENTED, http_status: 422, applies_to: "POST /property-solutions/deed-recordings/{id}/confirm" }
  - { priority: 23, category: business_fiscal, check: "Disbursement amount_cents > 0", error_id: ERR_DISBURSEMENT_NOT_POSITIVE, http_status: 422, applies_to: "POST /property-solutions/cases/{id}/disbursements" }
  - { priority: 24, category: business_fiscal, check: "Disbursement amount_cents <= case remaining_assistance_cents (evaluated LAST, after state)", error_id: ERR_DISBURSEMENT_EXCEEDS_REMAINING, http_status: 422, applies_to: "POST /property-solutions/cases/{id}/disbursements" }
  - { priority: 25, category: business_fiscal, check: "Lien settlement_amount_cents <= lien amount_cents", error_id: ERR_SETTLEMENT_EXCEEDS_LIEN, http_status: 422, applies_to: "POST /property-solutions/title-commitments/{id}/lien-releases" }

# =============================================================================
# 1.5 API Endpoint Table
# Role shorthand used below: STAFF = ServicingAdmin, PropertySolutionsSpecialist,
# WorkoutManager, TitleOfficer, LegalCounsel, DisbursementOfficer, Inspector.
# Each entry lists roles explicitly.
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z; the server never falls back to wall-clock time. Sweeping side effect: OFFERED agreements whose offer_expires_at is passed flip to EXPIRED."
    roles: [ServicingAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Lazy expiry sweep for OFFERED agreements; creditable_days recompute basis moves"]

  # --- Loans ---
  - { method: POST, path: "/property-solutions/loans", description: "Board a loan", roles: [ServicingAdmin], code: 201, input: [loan_number, unpaid_principal_balance_cents, accrued_interest_cents, escrow_advances_cents, foreclosure_fees_cents, note_annual_rate, fair_market_value_cents, delinquency_days, "foreclosure_referral_status?"], output: Loan, side_effects: ["Computes per_diem_interest_cents", "status ACTIVE_DELINQUENT"] }
  - { method: GET, path: "/property-solutions/loans/{id}", description: "Get a loan", roles: [ServicingAdmin, PropertySolutionsSpecialist, WorkoutManager, TitleOfficer, LegalCounsel, DisbursementOfficer], code: 200, input: [], output: Loan, side_effects: [] }
  - { method: GET, path: "/property-solutions/loans", description: "List loans", roles: [ServicingAdmin, PropertySolutionsSpecialist, WorkoutManager, TitleOfficer, LegalCounsel, DisbursementOfficer], code: 200, input: ["status?", "limit?", "offset?"], output: "Loan[]", side_effects: [] }

  # --- Borrowers ---
  - { method: POST, path: "/property-solutions/borrowers", description: "Register a borrower", roles: [ServicingAdmin], code: 201, input: [full_name, email, hardship_type, self_reported_condition_grade], output: Borrower, side_effects: [] }
  - { method: GET, path: "/property-solutions/borrowers/{id}", description: "Get a borrower; Borrower role may read only its own id", roles: [ServicingAdmin, PropertySolutionsSpecialist, WorkoutManager, Borrower], code: 200, input: [], output: Borrower, side_effects: [] }

  # --- Properties ---
  - { method: POST, path: "/property-solutions/properties", description: "Register the subject property for a loan", roles: [ServicingAdmin], code: 201, input: [loan_id, address_line, county, state_code, occupancy_type, "required_condition_standard?"], output: Property, side_effects: [] }
  - { method: GET, path: "/property-solutions/properties/{id}", description: "Get a property", roles: [ServicingAdmin, PropertySolutionsSpecialist, WorkoutManager, TitleOfficer, LegalCounsel, DisbursementOfficer, Inspector], code: 200, input: [], output: Property, side_effects: [] }
  - { method: GET, path: "/property-solutions/properties", description: "List properties (filtered by loan_id)", roles: [ServicingAdmin, PropertySolutionsSpecialist, WorkoutManager, TitleOfficer, LegalCounsel, DisbursementOfficer, Inspector], code: 200, input: ["loan_id?", "limit?", "offset?"], output: "Property[]", side_effects: [] }

  # --- Workout cases ---
  - { method: POST, path: "/property-solutions/cases", description: "Open a workout case", roles: [PropertySolutionsSpecialist], code: 201, input: [loan_id, borrower_id, program_type], output: WorkoutCase, side_effects: ["status INTAKE", "assigned_specialist_id = X-User-ID"] }
  - { method: GET, path: "/property-solutions/cases/{id}", description: "Get a case; Borrower role may read only cases whose borrower_id equals X-User-ID", roles: [ServicingAdmin, PropertySolutionsSpecialist, WorkoutManager, TitleOfficer, LegalCounsel, DisbursementOfficer, Inspector, Borrower], code: 200, input: [], output: WorkoutCase, side_effects: [] }
  - { method: GET, path: "/property-solutions/cases", description: "List cases", roles: [ServicingAdmin, PropertySolutionsSpecialist, WorkoutManager, TitleOfficer, LegalCounsel, DisbursementOfficer, Inspector], code: 200, input: ["loan_id?", "borrower_id?", "status?", "limit?", "offset?"], output: "WorkoutCase[]", side_effects: [] }
  - { method: POST, path: "/property-solutions/cases/{id}/submit", description: "Submit for eligibility review", roles: [PropertySolutionsSpecialist], code: 200, input: [], output: WorkoutCase, side_effects: ["INTAKE->ELIGIBILITY_REVIEW", "Loan ACTIVE_DELINQUENT->WORKOUT_IN_PROGRESS", "increments WorkoutCase.version and Loan.version by 1"] }
  - { method: POST, path: "/property-solutions/cases/{id}/evaluate-eligibility", description: "Eligibility decision; PASS gates delinquency>=31 and foreclosure_referral_status!=ACTIVE", roles: [PropertySolutionsSpecialist], code: 200, input: [decision, "notes?"], output: WorkoutCase, side_effects: ["PASS: ->MARKETING_PERIOD; FAIL: ->DECLINED and Loan->ACTIVE_DELINQUENT", "increments WorkoutCase.version by 1"] }
  - { method: POST, path: "/property-solutions/cases/{id}/marketing-exception", description: "Grant marketing-period exception", roles: [WorkoutManager], code: 200, input: [reason], output: WorkoutCase, side_effects: ["marketing_exception_granted=true; records reason", "increments WorkoutCase.version by 1"] }
  - { method: POST, path: "/property-solutions/cases/{id}/certify-marketing", description: "Certify marketing period satisfied", roles: [PropertySolutionsSpecialist], code: 200, input: [], output: WorkoutCase, side_effects: ["MARKETING_PERIOD->TITLE_REVIEW", "increments WorkoutCase.version by 1"] }
  - { method: POST, path: "/property-solutions/cases/{id}/certify-title", description: "Certify title clear", roles: [PropertySolutionsSpecialist], code: 200, input: [], output: WorkoutCase, side_effects: ["TITLE_REVIEW->TERMS_NEGOTIATION", "increments WorkoutCase.version by 1"] }
  - { method: POST, path: "/property-solutions/cases/{id}/escalate-holdover", description: "Escalate occupant holdover after grace period", roles: [WorkoutManager], code: 201, input: [], output: EvictionCase, side_effects: ["Creates EvictionCase ESCALATED", "case -> HOLDOVER_ESCALATED", "increments WorkoutCase.version by 1"] }
  - { method: POST, path: "/property-solutions/cases/{id}/withdraw", description: "Withdraw the case (borrower-initiated or specialist); blocked from RECORDING_PENDING, EVICTION_IN_PROGRESS, and terminal states", roles: [PropertySolutionsSpecialist, Borrower], code: 200, input: [], output: WorkoutCase, side_effects: ["->WITHDRAWN", "cascade: agreement TERMINATED, listing CLOSED, PENDING/APPROVED disbursements VOIDED, Loan->ACTIVE_DELINQUENT, ESCALATED eviction DISMISSED(OTHER)"] }

  # --- Case sub-resource reads (FK reverse reachability) ---
  - { method: GET, path: "/property-solutions/cases/{id}/listings", description: "Listings for a case", roles: [ServicingAdmin, PropertySolutionsSpecialist, WorkoutManager, TitleOfficer, LegalCounsel, DisbursementOfficer, Inspector, Borrower], code: 200, input: ["limit?", "offset?"], output: "MarketingListing[]", side_effects: [] }
  - { method: GET, path: "/property-solutions/cases/{id}/title-commitments", description: "Title commitments for a case", roles: [ServicingAdmin, PropertySolutionsSpecialist, WorkoutManager, TitleOfficer, LegalCounsel, DisbursementOfficer, Inspector, Borrower], code: 200, input: ["limit?", "offset?"], output: "TitleCommitment[]", side_effects: [] }
  - { method: GET, path: "/property-solutions/cases/{id}/agreements", description: "Agreements for a case", roles: [ServicingAdmin, PropertySolutionsSpecialist, WorkoutManager, TitleOfficer, LegalCounsel, DisbursementOfficer, Inspector, Borrower], code: 200, input: ["limit?", "offset?"], output: "SettlementAgreement[]", side_effects: [] }
  - { method: GET, path: "/property-solutions/cases/{id}/inspection-appointments", description: "Appointments for a case", roles: [ServicingAdmin, PropertySolutionsSpecialist, WorkoutManager, TitleOfficer, LegalCounsel, DisbursementOfficer, Inspector, Borrower], code: 200, input: ["limit?", "offset?"], output: "InspectionAppointment[]", side_effects: [] }
  - { method: GET, path: "/property-solutions/cases/{id}/inspection-reports", description: "Reports for a case", roles: [ServicingAdmin, PropertySolutionsSpecialist, WorkoutManager, TitleOfficer, LegalCounsel, DisbursementOfficer, Inspector, Borrower], code: 200, input: ["limit?", "offset?"], output: "InspectionReport[]", side_effects: [] }
  - { method: GET, path: "/property-solutions/cases/{id}/disbursements", description: "Disbursements for a case", roles: [ServicingAdmin, PropertySolutionsSpecialist, WorkoutManager, TitleOfficer, LegalCounsel, DisbursementOfficer, Borrower], code: 200, input: ["limit?", "offset?"], output: "Disbursement[]", side_effects: [] }
  - { method: GET, path: "/property-solutions/cases/{id}/deficiency-waivers", description: "Deficiency waivers for a case", roles: [ServicingAdmin, PropertySolutionsSpecialist, WorkoutManager, TitleOfficer, LegalCounsel, DisbursementOfficer, Borrower], code: 200, input: ["limit?", "offset?"], output: "DeficiencyWaiver[]", side_effects: [] }
  - { method: GET, path: "/property-solutions/cases/{id}/deed-recordings", description: "Deed recordings for a case", roles: [ServicingAdmin, PropertySolutionsSpecialist, WorkoutManager, TitleOfficer, LegalCounsel, DisbursementOfficer, Borrower], code: 200, input: ["limit?", "offset?"], output: "DeedRecording[]", side_effects: [] }
  - { method: GET, path: "/property-solutions/cases/{id}/eviction-cases", description: "Eviction cases for a case", roles: [ServicingAdmin, PropertySolutionsSpecialist, WorkoutManager, TitleOfficer, LegalCounsel, DisbursementOfficer, Borrower], code: 200, input: ["limit?", "offset?"], output: "EvictionCase[]", side_effects: [] }

  # --- Marketing listings ---
  - { method: POST, path: "/property-solutions/listings", description: "List the property for the marketing period; case must be in MARKETING_PERIOD; only one non-CLOSED listing per case", roles: [PropertySolutionsSpecialist], code: 201, input: [case_id, list_date, list_price_cents], output: MarketingListing, side_effects: ["status ACTIVE", "creditable_days computed"] }
  - { method: GET, path: "/property-solutions/listings/{id}", description: "Get a listing (recomputes creditable_days on read for non-CLOSED)", roles: [ServicingAdmin, PropertySolutionsSpecialist, WorkoutManager, TitleOfficer, LegalCounsel, DisbursementOfficer, Inspector, Borrower], code: 200, input: [], output: MarketingListing, side_effects: [] }
  - { method: POST, path: "/property-solutions/listings/{id}/suspend", description: "Suspend marketing (opens a suspension interval)", roles: [PropertySolutionsSpecialist], code: 200, input: [reason], output: MarketingListing, side_effects: ["ACTIVE->SUSPENDED", "creates ListingSuspension(started_at=now, ended_at=null)", "recomputes creditable_days"] }
  - { method: POST, path: "/property-solutions/listings/{id}/resume", description: "Resume marketing (closes the open suspension)", roles: [PropertySolutionsSpecialist], code: 200, input: [], output: MarketingListing, side_effects: ["SUSPENDED->ACTIVE", "closes open ListingSuspension", "recomputes creditable_days"] }
  - { method: POST, path: "/property-solutions/listings/{id}/close", description: "Close the listing; freezes creditable_days", roles: [PropertySolutionsSpecialist], code: 200, input: [], output: MarketingListing, side_effects: ["->CLOSED", "closes any open suspension"] }
  - { method: GET, path: "/property-solutions/listings/{id}/suspensions", description: "Suspension intervals for a listing", roles: [ServicingAdmin, PropertySolutionsSpecialist, WorkoutManager, TitleOfficer, LegalCounsel, DisbursementOfficer, Inspector, Borrower], code: 200, input: ["limit?", "offset?"], output: "ListingSuspension[]", side_effects: [] }

  # --- Title ---
  - { method: POST, path: "/property-solutions/title-commitments", description: "Order a title commitment; case must be in TITLE_REVIEW", roles: [TitleOfficer], code: 201, input: [case_id], output: TitleCommitment, side_effects: ["status ORDERED"] }
  - { method: GET, path: "/property-solutions/title-commitments/{id}", description: "Get a title commitment", roles: [ServicingAdmin, PropertySolutionsSpecialist, WorkoutManager, TitleOfficer, LegalCounsel, DisbursementOfficer], code: 200, input: [], output: TitleCommitment, side_effects: [] }
  - { method: POST, path: "/property-solutions/title-commitments/{id}/receive", description: "Record receipt of the commitment; auto-CLEARS when no liens exist", roles: [TitleOfficer], code: 200, input: [vested_owner_name], output: TitleCommitment, side_effects: ["ORDERED->RECEIVED", "bubble-up to CLEARED if unreleased_lien_count==0", "increments TitleCommitment.version by 1"] }
  - { method: POST, path: "/property-solutions/title-commitments/{id}/liens", description: "Add a junior lien; commitment must be RECEIVED or CLEARED (CLEARED reverts to RECEIVED)", roles: [TitleOfficer], code: 201, input: [lienholder_name, amount_cents, position], output: JuniorLien, side_effects: ["status UNRELEASED", "increments TitleCommitment.version by 1 and unreleased_lien_count by 1"] }
  - { method: GET, path: "/property-solutions/title-commitments/{id}/liens", description: "Liens on a commitment", roles: [ServicingAdmin, PropertySolutionsSpecialist, WorkoutManager, TitleOfficer, LegalCounsel, DisbursementOfficer], code: 200, input: ["status?", "limit?", "offset?"], output: "JuniorLien[]", side_effects: [] }
  - { method: POST, path: "/property-solutions/title-commitments/{id}/lien-releases", description: "Release a junior lien (OCC on commitment version)", roles: [TitleOfficer], code: 200, input: [lien_id, settlement_amount_cents, expected_title_commitment_version], output: JuniorLien, side_effects: ["lien UNRELEASED->RELEASED", "unreleased_lien_count -= 1; bubble-up CLEARED at 0", "increments TitleCommitment.version by 1"] }

  # --- Settlement agreements ---
  - { method: POST, path: "/property-solutions/cases/{id}/agreements", description: "Draft an agreement (OCC on case version); supersedes an existing DRAFT; rejected while an OFFERED/COUNTERED/ACCEPTED agreement exists; case must be in TERMS_NEGOTIATION", roles: [PropertySolutionsSpecialist], code: 201, input: [vacate_date, expected_case_version], output: SettlementAgreement, side_effects: ["computes provisional_assistance_cents", "existing DRAFT -> SUPERSEDED", "increments WorkoutCase.version by 1"] }
  - { method: GET, path: "/property-solutions/agreements/{id}", description: "Get an agreement", roles: [ServicingAdmin, PropertySolutionsSpecialist, WorkoutManager, TitleOfficer, LegalCounsel, DisbursementOfficer, Borrower], code: 200, input: [], output: SettlementAgreement, side_effects: [] }
  - { method: POST, path: "/property-solutions/agreements/{id}/offer", description: "Offer the draft to the borrower", roles: [PropertySolutionsSpecialist], code: 200, input: [offer_valid_days], output: SettlementAgreement, side_effects: ["DRAFT->OFFERED", "offer_expires_at = now + offer_valid_days days"] }
  - { method: POST, path: "/property-solutions/agreements/{id}/counter", description: "Borrower counters with a different vacate date", roles: [Borrower], code: 200, input: [proposed_vacate_date], output: SettlementAgreement, side_effects: ["OFFERED->COUNTERED", "vacate_date = proposed_vacate_date"] }
  - { method: POST, path: "/property-solutions/agreements/{id}/reoffer", description: "Specialist re-offers after a counter; bumps round_number", roles: [PropertySolutionsSpecialist], code: 200, input: [vacate_date, offer_valid_days], output: SettlementAgreement, side_effects: ["COUNTERED->OFFERED", "round_number += 1", "recomputes provisional_assistance_cents"] }
  - { method: POST, path: "/property-solutions/agreements/{id}/accept", description: "Borrower accepts the offer", roles: [Borrower], code: 200, input: [], output: SettlementAgreement, side_effects: ["OFFERED->ACCEPTED", "case TERMS_NEGOTIATION->AGREEMENT_ACTIVE", "DIL: creates DeficiencyWaiver DRAFT with projected_waiver_cents"] }
  - { method: POST, path: "/property-solutions/agreements/{id}/terminate", description: "Manager terminates an ACCEPTED agreement; case reverts to TERMS_NEGOTIATION", roles: [WorkoutManager], code: 200, input: [], output: SettlementAgreement, side_effects: ["ACCEPTED->TERMINATED", "case AGREEMENT_ACTIVE->TERMS_NEGOTIATION"] }
  - { method: GET, path: "/property-solutions/agreements/{id}/disbursements", description: "Disbursements against an agreement", roles: [ServicingAdmin, PropertySolutionsSpecialist, WorkoutManager, TitleOfficer, LegalCounsel, DisbursementOfficer, Borrower], code: 200, input: ["limit?", "offset?"], output: "Disbursement[]", side_effects: [] }

  # --- Inspection appointments & reports ---
  - { method: POST, path: "/property-solutions/inspection-appointments", description: "Schedule an inspection; HANDOVER requires case in AGREEMENT_ACTIVE or VACATE_PENDING; RE_INSPECTION requires VACATE_PENDING; 24h minimum notice; 30-minute buffered conflict rule per inspector", roles: [PropertySolutionsSpecialist], code: 201, input: [case_id, inspector_id, appointment_type, scheduled_start, scheduled_end], output: InspectionAppointment, side_effects: ["HANDOVER scheduling: case AGREEMENT_ACTIVE->VACATE_PENDING"] }
  - { method: GET, path: "/property-solutions/inspection-appointments/{id}", description: "Get an appointment", roles: [ServicingAdmin, PropertySolutionsSpecialist, WorkoutManager, TitleOfficer, LegalCounsel, DisbursementOfficer, Inspector], code: 200, input: [], output: InspectionAppointment, side_effects: [] }
  - { method: POST, path: "/property-solutions/inspection-appointments/{id}/cancel", description: "Cancel a scheduled appointment", roles: [PropertySolutionsSpecialist], code: 200, input: [], output: InspectionAppointment, side_effects: ["SCHEDULED->CANCELLED"] }
  - { method: POST, path: "/property-solutions/inspection-appointments/{id}/no-access", description: "Inspector records no access at handover", roles: [Inspector], code: 200, input: [], output: InspectionAppointment, side_effects: ["SCHEDULED->NO_ACCESS"] }
  - { method: POST, path: "/property-solutions/inspection-appointments/{id}/reports", description: "Inspector creates a draft report on a SCHEDULED appointment", roles: [Inspector], code: 201, input: [broom_clean_verified, keys_returned_count, line_items], output: InspectionReport, side_effects: ["report DRAFT"] }
  - { method: GET, path: "/property-solutions/inspection-appointments/{id}/reports", description: "Reports for an appointment", roles: [ServicingAdmin, PropertySolutionsSpecialist, WorkoutManager, TitleOfficer, LegalCounsel, DisbursementOfficer, Inspector], code: 200, input: ["limit?", "offset?"], output: "InspectionReport[]", side_effects: [] }
  - { method: GET, path: "/property-solutions/inspection-reports/{id}", description: "Get a report", roles: [ServicingAdmin, PropertySolutionsSpecialist, WorkoutManager, TitleOfficer, LegalCounsel, DisbursementOfficer, Inspector, Borrower], code: 200, input: [], output: InspectionReport, side_effects: [] }
  - { method: POST, path: "/property-solutions/inspection-reports/{id}/submit", description: "Submit the report; computes deductions and result; drives the handover cascade", roles: [Inspector], code: 200, input: [], output: InspectionReport, side_effects: ["DRAFT->SUBMITTED", "computes total_deduction_cents and result", "appointment->COMPLETED; case->HANDOVER_INSPECTION then DISBURSEMENT_PENDING (pass) or VACATE_PENDING (fail)", "pass: agreement final_assistance_cents computed, condition_basis INSPECTED"] }

  # --- Disbursements ---
  - { method: POST, path: "/property-solutions/cases/{id}/disbursements", description: "Request a relocation-assistance disbursement; case must be in DISBURSEMENT_PENDING", roles: [PropertySolutionsSpecialist], code: 201, input: [agreement_id, amount_cents, "purpose?"], output: Disbursement, side_effects: ["status PENDING", "requested_by_user_id = X-User-ID"] }
  - { method: GET, path: "/property-solutions/disbursements/{id}", description: "Get a disbursement", roles: [ServicingAdmin, PropertySolutionsSpecialist, WorkoutManager, TitleOfficer, LegalCounsel, DisbursementOfficer], code: 200, input: [], output: Disbursement, side_effects: [] }
  - { method: POST, path: "/property-solutions/disbursements/{id}/approve", description: "Approve (SoD: approver != requester)", roles: [DisbursementOfficer], code: 200, input: [], output: Disbursement, side_effects: ["PENDING->APPROVED", "sets approved_by_user_id"] }
  - { method: POST, path: "/property-solutions/disbursements/{id}/release", description: "Release funds at key delivery (SoD: releaser != approver; keys_returned required)", roles: [DisbursementOfficer], code: 200, input: [], output: Disbursement, side_effects: ["APPROVED->RELEASED", "case.total_disbursed_cents += amount; remaining recomputed", "remaining==0: DIL->RECORDING_PENDING, CFK->COMPLETED cascade"] }
  - { method: POST, path: "/property-solutions/disbursements/{id}/void", description: "Void a PENDING or APPROVED disbursement", roles: [PropertySolutionsSpecialist], code: 200, input: [], output: Disbursement, side_effects: ["->VOIDED"] }
  - { method: POST, path: "/property-solutions/disbursements/{id}/clawback", description: "Claw back a RELEASED disbursement (compensating action)", roles: [WorkoutManager], code: 200, input: [], output: Disbursement, side_effects: ["RELEASED->CLAWED_BACK", "case.total_disbursed_cents -= amount; remaining recomputed"] }

  # --- Deficiency waivers ---
  - { method: GET, path: "/property-solutions/deficiency-waivers/{id}", description: "Get a waiver", roles: [ServicingAdmin, PropertySolutionsSpecialist, WorkoutManager, TitleOfficer, LegalCounsel, DisbursementOfficer, Borrower], code: 200, input: [], output: DeficiencyWaiver, side_effects: [] }
  - { method: POST, path: "/property-solutions/deficiency-waivers/{id}/document", description: "Attach executed waiver documentation", roles: [LegalCounsel], code: 200, input: [document_reference], output: DeficiencyWaiver, side_effects: ["DRAFT->DOCUMENTED"] }
  - { method: POST, path: "/property-solutions/deficiency-waivers/{id}/rescind", description: "Rescind an executed waiver; restores loan deficiency (compensating action)", roles: [WorkoutManager], code: 200, input: [], output: DeficiencyWaiver, side_effects: ["EXECUTED->RESCINDED", "waived_amount_cents=0; Loan.deficiency_balance_cents restored to pre_waiver_deficiency_cents"] }
  - { method: GET, path: "/property-solutions/loans/{id}/deficiency-waivers", description: "Waivers for a loan", roles: [ServicingAdmin, PropertySolutionsSpecialist, WorkoutManager, TitleOfficer, LegalCounsel, DisbursementOfficer], code: 200, input: ["limit?", "offset?"], output: "DeficiencyWaiver[]", side_effects: [] }

  # --- Deed recordings ---
  - { method: POST, path: "/property-solutions/cases/{id}/deed-recordings", description: "Create a deed recording package; case must be in RECORDING_PENDING; DEED_IN_LIEU only", roles: [LegalCounsel], code: 201, input: [county], output: DeedRecording, side_effects: ["status PENDING"] }
  - { method: GET, path: "/property-solutions/deed-recordings/{id}", description: "Get a recording", roles: [ServicingAdmin, PropertySolutionsSpecialist, WorkoutManager, TitleOfficer, LegalCounsel, DisbursementOfficer], code: 200, input: [], output: DeedRecording, side_effects: [] }
  - { method: POST, path: "/property-solutions/deed-recordings/{id}/submit", description: "Submit to county", roles: [LegalCounsel], code: 200, input: [], output: DeedRecording, side_effects: ["PENDING->SUBMITTED"] }
  - { method: POST, path: "/property-solutions/deed-recordings/{id}/confirm", description: "Confirm recordation; drives the completion cascade (case -> waiver -> loan)", roles: [LegalCounsel], code: 200, input: [instrument_number], output: DeedRecording, side_effects: ["SUBMITTED->RECORDED", "case RECORDING_PENDING->COMPLETED", "waiver DOCUMENTED->EXECUTED with final amounts", "Loan->DEED_IN_LIEU_COMPLETED, servicing_system_synced=true, deficiency zeroed"] }
  - { method: POST, path: "/property-solutions/deed-recordings/{id}/reject", description: "County rejects the package; case stays RECORDING_PENDING", roles: [LegalCounsel], code: 200, input: [rejection_reason], output: DeedRecording, side_effects: ["SUBMITTED->REJECTED"] }

  # --- Eviction cases ---
  - { method: GET, path: "/property-solutions/eviction-cases/{id}", description: "Get an eviction case", roles: [ServicingAdmin, PropertySolutionsSpecialist, WorkoutManager, TitleOfficer, LegalCounsel, DisbursementOfficer], code: 200, input: [], output: EvictionCase, side_effects: [] }
  - { method: POST, path: "/property-solutions/eviction-cases/{id}/file", description: "File the eviction in court", roles: [LegalCounsel], code: 200, input: [court_reference], output: EvictionCase, side_effects: ["ESCALATED->FILED", "case HOLDOVER_ESCALATED->EVICTION_IN_PROGRESS with agreement-termination/disbursement-void cascade", "DIL loan -> FORECLOSURE_PROCEEDING"] }
  - { method: POST, path: "/property-solutions/eviction-cases/{id}/writ", description: "Record writ issuance", roles: [LegalCounsel], code: 200, input: [], output: EvictionCase, side_effects: ["FILED->WRIT_ISSUED"] }
  - { method: POST, path: "/property-solutions/eviction-cases/{id}/evicted", description: "Record eviction execution", roles: [LegalCounsel], code: 200, input: [], output: EvictionCase, side_effects: ["WRIT_ISSUED->EVICTED", "case EVICTION_IN_PROGRESS->CLOSED_EVICTED"] }
  - { method: POST, path: "/property-solutions/eviction-cases/{id}/dismiss", description: "Dismiss from ESCALATED or FILED; OCCUPANT_VACATED routes the case back into the workout pipeline", roles: [LegalCounsel], code: 200, input: [dismissal_reason], output: EvictionCase, side_effects: ["->DISMISSED", "OCCUPANT_VACATED: ESCALATED-dismissal -> case VACATE_PENDING; FILED-dismissal -> case TERMS_NEGOTIATION (DIL loan back to WORKOUT_IN_PROGRESS)"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID, or undeclared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on endpoint, or entity-backed ownership check failed (Borrower acting on another borrower's case/agreement; Inspector acting on another inspector's appointment)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, sign-constraint violation (e.g. lien amount_cents <= 0, non-positive price), malformed datetime" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field value outside its declared domain" }
  - { id: ERR_LOAN_NOT_FOUND, http: 404, condition: "loan_id path/body reference does not resolve" }
  - { id: ERR_BORROWER_NOT_FOUND, http: 404, condition: "borrower_id path/body reference does not resolve" }
  - { id: ERR_PROPERTY_NOT_FOUND, http: 404, condition: "property_id path reference does not resolve" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "case_id path/body reference does not resolve" }
  - { id: ERR_LISTING_NOT_FOUND, http: 404, condition: "listing_id path reference does not resolve" }
  - { id: ERR_TITLE_COMMITMENT_NOT_FOUND, http: 404, condition: "commitment_id path reference does not resolve" }
  - { id: ERR_LIEN_NOT_FOUND, http: 404, condition: "lien_id in a lien-release body does not resolve on the addressed commitment" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "agreement_id path/body reference does not resolve" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "appointment_id path reference does not resolve" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "report_id path reference does not resolve" }
  - { id: ERR_DISBURSEMENT_NOT_FOUND, http: 404, condition: "disbursement_id path reference does not resolve" }
  - { id: ERR_WAIVER_NOT_FOUND, http: 404, condition: "waiver_id path reference does not resolve" }
  - { id: ERR_RECORDING_NOT_FOUND, http: 404, condition: "recording_id path reference does not resolve" }
  - { id: ERR_EVICTION_CASE_NOT_FOUND, http: 404, condition: "eviction_case_id path reference does not resolve" }
  - { id: ERR_LOAN_INVALID_STATE, http: 409, condition: "Loan not in a state allowing the operation (e.g. case submit when loan already WORKOUT_IN_PROGRESS or DEED_IN_LIEU_COMPLETED)" }
  - { id: ERR_CASE_INVALID_STATE, http: 409, condition: "WorkoutCase not in a from-state of the requested transition (incl. terminal lockdown and withdraw blocked from RECORDING_PENDING/EVICTION_IN_PROGRESS)" }
  - { id: ERR_LISTING_INVALID_STATE, http: 409, condition: "MarketingListing transition from a wrong state (suspend non-ACTIVE, resume non-SUSPENDED, act on CLOSED)" }
  - { id: ERR_TITLE_INVALID_STATE, http: 409, condition: "TitleCommitment transition from a wrong state (receive non-ORDERED; add lien on ORDERED; release on ORDERED)" }
  - { id: ERR_LIEN_INVALID_STATE, http: 409, condition: "JuniorLien not UNRELEASED at release" }
  - { id: ERR_AGREEMENT_INVALID_STATE, http: 409, condition: "SettlementAgreement transition from a wrong state (offer non-DRAFT, accept/counter non-OFFERED, reoffer non-COUNTERED, terminate non-ACCEPTED, any action on EXPIRED/TERMINATED/SUPERSEDED/COMPLETED)" }
  - { id: ERR_APPOINTMENT_INVALID_STATE, http: 409, condition: "InspectionAppointment not SCHEDULED for cancel/no-access/report-create" }
  - { id: ERR_REPORT_INVALID_STATE, http: 409, condition: "InspectionReport not DRAFT at submit (second submit rejected)" }
  - { id: ERR_DISBURSEMENT_INVALID_STATE, http: 409, condition: "Disbursement transition from a wrong state (approve non-PENDING, release non-APPROVED, void non-PENDING/APPROVED, clawback non-RELEASED)" }
  - { id: ERR_RECORDING_INVALID_STATE, http: 409, condition: "DeedRecording transition from a wrong state (submit non-PENDING, confirm/reject non-SUBMITTED)" }
  - { id: ERR_EVICTION_INVALID_STATE, http: 409, condition: "EvictionCase transition from a wrong state (file non-ESCALATED, writ non-FILED, evicted non-WRIT_ISSUED, dismiss non-ESCALATED/FILED)" }
  - { id: ERR_WAIVER_INVALID_STATE, http: 409, condition: "DeficiencyWaiver transition from a wrong state (document non-DRAFT, rescind non-EXECUTED)" }
  - { id: ERR_ACTIVE_LISTING_EXISTS, http: 409, condition: "Creating a listing while the case already has a listing in ACTIVE or SUSPENDED" }
  - { id: ERR_ACTIVE_AGREEMENT_EXISTS, http: 409, condition: "Creating an agreement while the case has one in OFFERED, COUNTERED, or ACCEPTED" }
  - { id: ERR_LIEN_POSITION_DUPLICATE, http: 409, condition: "A lien with the same position already exists on the commitment" }
  - { id: ERR_INSPECTOR_SCHEDULE_CONFLICT, http: 409, condition: "New appointment's 30-minute-end-buffered half-open interval intersects another SCHEDULED appointment of the same inspector_id" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_case_version does not match the case's current version (OCC on agreement creation)" }
  - { id: ERR_STALE_TITLE_VERSION, http: 412, condition: "expected_title_commitment_version does not match the commitment's current version (OCC on lien release)" }
  - { id: ERR_ELIGIBILITY_CRITERIA_NOT_MET, http: 422, condition: "PASS decision while Loan.delinquency_days < 31 or foreclosure_referral_status == ACTIVE" }
  - { id: ERR_OFFER_EXPIRED, http: 422, condition: "Accept/counter after offer_expires_at (checked before lien clearance)" }
  - { id: ERR_VACATE_DATE_TOO_SOON, http: 422, condition: "vacate_date earlier than current logical date + 10 days at create/counter/reoffer" }
  - { id: ERR_INSPECTION_TOO_SOON, http: 422, condition: "scheduled_start earlier than now + 24 hours (evaluated after the calendar-conflict check)" }
  - { id: ERR_MARKETING_PERIOD_NOT_MET, http: 422, condition: "Latest listing creditable_days < 90 and no marketing exception granted" }
  - { id: ERR_HOLDOVER_GRACE_NOT_ELAPSED, http: 422, condition: "Holdover escalation before vacate_date + 3 grace days" }
  - { id: ERR_RECORDING_DEADLINE_PASSED, http: 422, condition: "Recording confirm later than handover_date + 30 days" }
  - { id: ERR_LISTING_MISSING, http: 422, condition: "certify-marketing with no MarketingListing on the case" }
  - { id: ERR_TITLE_COMMITMENT_MISSING, http: 422, condition: "certify-title with no TitleCommitment on the case" }
  - { id: ERR_JUNIOR_LIENS_OUTSTANDING, http: 422, condition: "Junior lien in UNRELEASED gates certify-title, or DIL agreement accept" }
  - { id: ERR_KEYS_NOT_RETURNED, http: 422, condition: "Disbursement release while case.keys_returned is false" }
  - { id: ERR_WAIVER_NOT_DOCUMENTED, http: 422, condition: "Recording confirm while the case's DeficiencyWaiver is not DOCUMENTED" }
  - { id: ERR_SOD_APPROVER_EQUALS_REQUESTER, http: 422, condition: "DisbursementOfficer approving a disbursement they themselves requested" }
  - { id: ERR_SOD_RELEASER_EQUALS_APPROVER, http: 422, condition: "DisbursementOfficer releasing a disbursement they themselves approved" }
  - { id: ERR_DISBURSEMENT_NOT_POSITIVE, http: 422, condition: "Disbursement amount_cents <= 0" }
  - { id: ERR_DISBURSEMENT_EXCEEDS_REMAINING, http: 422, condition: "Disbursement amount_cents > case remaining_assistance_cents (evaluated after state checks)" }
  - { id: ERR_SETTLEMENT_EXCEEDS_LIEN, http: 422, condition: "Lien settlement_amount_cents > lien amount_cents" }
  - { id: ERR_NEGOTIATION_ROUND_LIMIT, http: 422, condition: "Reoffer when round_number == 3" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ServicingAdmin
    description: "Servicer platform administrator; boards loans/borrowers/properties; operates the logical clock"
    identity: opaque
    exclusive_operations: ["POST /property-solutions/loans", "POST /property-solutions/borrowers", "POST /property-solutions/properties", "POST /_clock/set_current_utc"]
    shared_operations: ["read access to all resources"]
  - name: PropertySolutionsSpecialist
    description: "Servicer property-solutions case worker; owns the case pipeline from intake through disbursement request"
    identity: opaque
    exclusive_operations: ["POST /property-solutions/cases", "case submit/evaluate-eligibility/certify-marketing/certify-title", "listing create/suspend/resume/close", "agreement create/offer/reoffer", "inspection appointment create/cancel", "disbursement create/void"]
    shared_operations: ["POST /property-solutions/cases/{id}/withdraw (with Borrower)", "read access to all resources"]
  - name: WorkoutManager
    description: "Supervisor; grants marketing exceptions, escalates holdovers, terminates agreements, rescinds waivers, claws back disbursements"
    identity: opaque
    exclusive_operations: ["POST /property-solutions/cases/{id}/marketing-exception", "POST /property-solutions/cases/{id}/escalate-holdover", "POST /property-solutions/agreements/{id}/terminate", "POST /property-solutions/deficiency-waivers/{id}/rescind", "POST /property-solutions/disbursements/{id}/clawback"]
    shared_operations: ["read access to all resources"]
  - name: TitleOfficer
    description: "Title vendor officer; manages commitments, liens, and lien releases"
    identity: opaque
    exclusive_operations: ["POST /property-solutions/title-commitments", "receive", "POST /property-solutions/title-commitments/{id}/liens", "POST /property-solutions/title-commitments/{id}/lien-releases"]
    shared_operations: ["read access to title resources"]
  - name: Borrower
    description: "Borrower/occupant party to the workout; identity equals a Borrower entity id; may counter/accept only agreements on cases whose borrower_id matches X-User-ID"
    identity: "entity_backed:Borrower"
    exclusive_operations: ["POST /property-solutions/agreements/{id}/counter", "POST /property-solutions/agreements/{id}/accept"]
    shared_operations: ["POST /property-solutions/cases/{id}/withdraw (own case only)", "read own borrower record and own case's sub-resources"]
  - name: Inspector
    description: "Field inspector; X-User-ID is the opaque inspector_id referenced by appointments"
    identity: opaque
    exclusive_operations: ["POST /property-solutions/inspection-appointments/{id}/reports", "POST /property-solutions/inspection-reports/{id}/submit", "POST /property-solutions/inspection-appointments/{id}/no-access"]
    shared_operations: ["read access to appointments and reports"]
  - name: DisbursementOfficer
    description: "Treasury disbursement officer; segregation of duties forbids approving own requests and releasing own approvals (tracked by X-User-ID)"
    identity: opaque
    exclusive_operations: ["POST /property-solutions/disbursements/{id}/approve", "POST /property-solutions/disbursements/{id}/release"]
    shared_operations: ["read access to disbursements"]
  - name: LegalCounsel
    description: "Servicer legal counsel; documents waivers, manages deed recordings, runs the eviction docket"
    identity: opaque
    exclusive_operations: ["POST /property-solutions/deficiency-waivers/{id}/document", "deed-recording create/submit/confirm/reject", "eviction file/writ/evicted/dismiss"]
    shared_operations: ["read access to all resources"]
