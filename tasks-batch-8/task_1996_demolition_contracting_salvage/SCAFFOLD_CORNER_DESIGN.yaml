  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: envelope_success_shape_on_create
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "Success envelope: meta.api_request_id + meta.api_request_timestamp present, response_type == 'object', data carries the created Project."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "Envelope", address: "78 Pine St", lot_area_sqft: 12000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
          trigger: []
          assert:
            - "HTTP 201; body.meta.api_request_id is a non-empty string; body.meta.api_request_timestamp is ISO 8601"
            - "body.response_type == object and body.data.id == ${p_id}"

      - name: envelope_error_shape_on_validation_failure
        claim_type: violation_to_error
        grounds: [response_envelope, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Error envelope: response_type == 'error' and data carries error_id + message."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - { call: "POST /demolition/projects", payload: { address: "no name given" }, as: ContractorAdmin, captures: { err: $.data.error_id, msg: $.data.message } }
          assert:
            - "HTTP 400; body.response_type == error"
            - "${err} == ERR_VALIDATION and ${msg} is a non-empty string"

      - name: projects_list_envelope_and_status_filter
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "GET /demolition/projects returns response_type array with pagination fields; status filter DRAFT includes the new project, status filter CLOSED excludes it."
        test_recipe:
          setup: ["One project in DRAFT."]
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "ListMe", address: "80 Pine St", lot_area_sqft: 12000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
          trigger:
            - { call: "GET /demolition/projects", payload: { status: "DRAFT" }, as: ContractorAdmin, captures: { hit: "$.data[0].id" } }
            - { call: "GET /demolition/projects", payload: { status: "CLOSED", limit: 10, offset: 0 }, as: ContractorAdmin }
          assert:
            - "DRAFT filter: response_type == array, total_count >= 1, ${hit} == ${p_id}"
            - "CLOSED filter: total_count == 0 and has_more == false"

      - name: default_clock_value_before_any_set
        claim_type: conditional_action
        grounds: [calculations.permit_expiry_sweep, endpoints]
        distinguishing_aspect: "Before any /_clock/set_current_utc call the logical clock reads exactly 2026-08-01T00:00:00Z: a permit ACTIVATEd with the clock unset gets activated_at 2026-08-01T00:00:00Z and expires_at 2026-10-30T00:00:00Z."
        test_recipe:
          setup: ["Project DRAFT; one CONFIRMED disconnect; permit APPROVED. Clock never set."]
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "ClockDef", address: "82 Pine St", lot_area_sqft: 12000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/utility-disconnects", payload: { utility_type: "WATER", provider_name: "City Water", disconnect_window_start: "2026-08-03T08:00:00Z", disconnect_window_end: "2026-08-03T10:00:00Z" }, as: UtilityCoordinator, captures: { ud_id: $.data.id } }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "REPORT_DISCONNECTED" }, as: UtilityCoordinator, as_user_id: "cd-r-1" }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "VERIFY" }, as: UtilityCoordinator, as_user_id: "cd-v-1" }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "CONFIRM" }, as: UtilityCoordinator, as_user_id: "cd-c-1" }
            - { call: "POST /demolition/projects/${p_id}/permits", payload: { permit_number: "P-1", gross_floor_area_sqft: 15000 }, as: PermitCoordinator, captures: { pm_id: $.data.id } }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "SUBMIT" }, as: PermitCoordinator }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "APPROVE" }, as: AuthorityReviewer }
          trigger:
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "ACTIVATE" }, as: PermitCoordinator, captures: { act: $.data.activated_at, exp: $.data.expires_at } }
          assert:
            - "${act} == 2026-08-01T00:00:00Z (startup default logical clock, not wall clock)"
            - "${exp} == 2026-10-30T00:00:00Z (activated_at + 90 days)"

