    code: 201
    input: [name, roast_level, expected_shrink_bps, charge_temp_c]
    output: RoastProfile
    side_effects: []
  - method: GET
    path: "/roast-profiles"
    description: "List roast profiles"
    roles: [RoasterStaff, SalesRep]
    code: 200
    input: ["roast_level?", "limit?", "offset?"]
    output: RoastProfile[]
    side_effects: []
  - method: GET
    path: "/roast-profiles/{id}"
    description: "Get a roast profile"
    roles: [RoasterStaff, SalesRep]
    code: 200
    input: []
    output: RoastProfile
    side_effects: []

  # ---- Product ----
  - method: POST
    path: "/products"
    description: "Create a product (catalog SKU)"
    roles: [SalesRep, RoasterStaff]
    code: 201
    input: [sku, name, roast_profile_id, base_price_cents_per_kg, freshness_window_days]
    output: Product
    side_effects: []
  - method: GET
    path: "/products"
    description: "List products (default excludes archived). Filter by roast_profile_id for FK reverse-reachability."
    roles: [SalesRep, RoasterStaff, WholesaleBuyer]
    code: 200
    input: ["roast_profile_id?", "archived?", "limit?", "offset?"]
    output: Product[]
    side_effects: []
  - method: GET
    path: "/products/{id}"
    description: "Get a product"
    roles: [SalesRep, RoasterStaff, WholesaleBuyer]
    code: 200
    input: []
    output: Product
    side_effects: []
