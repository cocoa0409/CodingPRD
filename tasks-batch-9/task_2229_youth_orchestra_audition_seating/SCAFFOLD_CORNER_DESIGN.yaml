            - "11-15 / 11-16 / 11-17, all with eligibility_window_start 2026-10-01T00:00:00Z and"
            - "soloist_selection_mode AUTO_SELECT / MANUAL / NONE respectively."
            - "Both members are rostered on all four events and both hold"
            - "performance_eligibility ELIGIBLE with attendance_index 100.00 on each concert."
            - "Every event is still programming_state DRAFT and standing_status is CLEAR for"
