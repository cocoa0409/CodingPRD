scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — dual_variant_calc: two dual-variant calculations on DIFFERENT
  # entity domains. Instance 1 = order pricing on Order (money/discounts);
  # Instance 2 = credit availability on ContractorAccount (credit posture).
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_pricing_normal_vs_surge_variant
        grounds:
          - calculations.order_pricing
          - entities.Order.fields.surge_premium_cents
          - entities.StormSurgeEvent.fields.surge_multiplier_pct
        distinguishing_aspect: |
          Same order inputs (subtotal, tier, delivery fee) price differently
          purely because Branch.surge_mode flips NORMAL -> SURGE: the surge
          variant adds a surge_premium computed from the active event's
          multiplier, while the normal variant reports 0.
        test_recipe:
          setup:
            - "Branch B in NORMAL mode with one ACTIVE Product (price 3500/bundle)"
            - "ContractorAccount VOLUME tier, credit_limit 10000000"
            - "InventoryLot with >= 90 bundles at the branch"
            - "JobAccount + MaterialTakeoff quoted at 60 shingle bundles + 2 accessory = 62 bundles total -> converted to Order"
            - "Order subtotal derives from 60 shingle bundles at 3500 = 210000; VOLUME discount applies at 5% since 210000 < 250000"
            - "Delivery fee 22500 base (rooftop); 60 bundles > 40 -> surcharge 20*350=7000 -> fee = 29500"
            - "normal-mode total = 210000 - 10500 + 0 + 29500 = 229000"
          setup_api_calls:
            - call: "POST /roofing/branches"
              payload: { branch_code: "BR-N1", name: "North", rooftop_delivery_capacity_per_day: 4, conveyor_fleet_size: 2, crane_available: true }
              as: PlatformAdmin
              captures: { br_n1: $.data.id }
            - call: "POST /roofing/products"
              payload: { sku: "SH-ARC", manufacturer_name: "Acme", color_code: "CHAR", bundles_per_square: 3.0, base_price_per_bundle_cents: 3500 }
              as: PlatformAdmin
              captures: { prod_n1: $.data.id }
            - call: "POST /roofing/branches/${br_n1}/inventory-lots"
              payload: { product_id: "${prod_n1}", lot_code: "LOT-A", on_hand_bundles: 500 }
              as: WarehouseClerk
            - call: "POST /roofing/contractor-accounts"
              payload: { company_name: "Roofer One", credit_limit_cents: 10000000, pricing_tier: "VOLUME" }
              as: CreditAnalyst
              captures: { ca_n1: $.data.id }
            - call: "POST /roofing/contractor-accounts/${ca_n1}/job-accounts"
              payload: { job_name: "Job N", site_address: "1 Oak St" }
              as: CreditAnalyst
              captures: { ja_n1: $.data.id }
            - call: "POST /roofing/job-accounts/${ja_n1}/takeoffs"
              payload: { product_id: "${prod_n1}", roof_squares: 20.0, waste_factor_pct: 0, valley_ridge_linear_feet: 40  }
              as: SalesRep
              captures: { tk_n1: $.data.id }
            - call: "POST /roofing/takeoffs/${tk_n1}/quote"
              payload: {}
              as: SalesRep
            - call: "POST /roofing/takeoffs/${tk_n1}/convert"
              payload: { branch_id: "${br_n1}" }
              as: Contractor
              as_user_id: "${ca_n1}"
              captures: { ord_n1: $.data.id }
            - call: "POST /roofing/branches/${br_n1}/delivery-slots"
              payload: { slot_date: "2026-08-10", window: "AM", equipment_type: "ROOFTOP_CONVEYOR", capacity: 3 }
              as: Dispatcher
              captures: { slot_n1: $.data.id }
            - call: "POST /roofing/orders/${ord_n1}/deliveries"
              payload: { delivery_slot_id: "${slot_n1}", equipment_type: "ROOFTOP_CONVEYOR" }
              as: Dispatcher
            - call: "GET /roofing/contractor-accounts/${ca_n1}"
              payload: {}
              as: CreditAnalyst
              captures: { ca_n1_v: $.data.version }
            - call: "POST /roofing/orders/${ord_n1}/confirm"
              payload: { expected_contractor_account_version: "${ca_n1_v}" }
              as: Contractor
              as_user_id: "${ca_n1}"
              captures: { ord_n1_norm_sub: $.data.subtotal_cents, ord_n1_norm_surge: $.data.surge_premium_cents, ord_n1_norm_total: $.data.total_cents }
          trigger:
            - call: "GET /roofing/orders/${ord_n1}"
              payload: {}
              as: SalesRep
          assert:
            - "Order.${ord_n1}.subtotal_cents == 210000"
            - "Order.${ord_n1}.discount_cents == 10500"
            - "Order.${ord_n1}.surge_premium_cents == 0"
            - "Order.${ord_n1}.delivery_fee_cents == 29500"
            - "Order.${ord_n1}.total_cents == 229000"

      - name: credit_available_with_vs_without_pending_holds
        grounds:
          - calculations.credit_available
          - entities.ContractorAccount.fields.pending_delivery_hold_cents
          - entities.ContractorAccount.fields.credit_available_cents
        distinguishing_aspect: |
          The same ContractorAccount row yields two different
          credit_available_cents values depending on variant: the order-confirm
          path includes pending_delivery_hold_cents (conservative) while the
          statement read endpoint uses the invoiced_only variant that excludes
          it — so the ledger reports more available credit than the confirm
          gate allows.
        test_recipe:
          setup:
            - "ContractorAccount credit_limit 500000, open_balance 0"
            - "One CONFIRMED order of total 120000 -> pending_delivery_hold_cents = 120000"
            - "Order-confirm gate (with_pending_deliveries) sees available = 500000-0-120000-0 = 380000"
            - "Statement endpoint (invoiced_only) sees available = 500000-0-0-0 = 500000"
          setup_api_calls:
            - call: "POST /roofing/branches"
              payload: { branch_code: "BR-C1", name: "Credit", rooftop_delivery_capacity_per_day: 4, conveyor_fleet_size: 2, crane_available: true }
              as: PlatformAdmin
              captures: { br_c1: $.data.id }
            - call: "POST /roofing/products"
              payload: { sku: "SH-3TAB", manufacturer_name: "Acme", color_code: "BLK", bundles_per_square: 3.0, base_price_per_bundle_cents: 2000 }
              as: PlatformAdmin
              captures: { prod_c1: $.data.id }
            - call: "POST /roofing/branches/${br_c1}/inventory-lots"
              payload: { product_id: "${prod_c1}", lot_code: "LOT-C", on_hand_bundles: 500 }
              as: WarehouseClerk
            - call: "POST /roofing/contractor-accounts"
              payload: { company_name: "Roofer Two", credit_limit_cents: 500000, pricing_tier: "STANDARD" }
              as: CreditAnalyst
              captures: { ca_c1: $.data.id }
            - call: "POST /roofing/contractor-accounts/${ca_c1}/job-accounts"
              payload: { job_name: "Job C", site_address: "2 Elm St" }
              as: CreditAnalyst
              captures: { ja_c1: $.data.id }
            - call: "POST /roofing/job-accounts/${ja_c1}/takeoffs"
              payload: { product_id: "${prod_c1}", roof_squares: 20.0, waste_factor_pct: 0, valley_ridge_linear_feet: 0  }
              as: SalesRep
              captures: { tk_c1: $.data.id }
            - call: "POST /roofing/takeoffs/${tk_c1}/quote"
              payload: {}
              as: SalesRep
            - call: "POST /roofing/takeoffs/${tk_c1}/convert"
              payload: { branch_id: "${br_c1}" }
              as: Contractor
              as_user_id: "${ca_c1}"
              captures: { ord_c1: $.data.id }
            - call: "GET /roofing/contractor-accounts/${ca_c1}"
              payload: {}
              as: CreditAnalyst
              captures: { ca_c1_v: $.data.version }
            - call: "POST /roofing/orders/${ord_c1}/confirm"
              payload: { expected_contractor_account_version: "${ca_c1_v}" }
              as: Contractor
              as_user_id: "${ca_c1}"
          trigger:
            - call: "GET /roofing/contractor-accounts/${ca_c1}/statement"
              payload: {}
              as: CreditAnalyst
              captures: { stmt_c1_avail: $.data.credit_available_cents, stmt_c1_pend: $.data.pending_delivery_hold_cents }
          assert:
            - "GET statement -> pending_delivery_hold_cents == 120000"
            - "GET statement -> credit_available_cents == 500000 (invoiced_only variant excludes hold)"
            - "Order-confirm gate would compute 380000 (with_pending_deliveries variant), which is strictly less than 500000"

  # =========================================================================
  # Rule 2 — combinatorial_formula: two instances in DIFFERENT modes.
  # Instance 1 = mode (a) >=3 inputs non-linear (order_pricing: tier
  # thresholds + surge + fee). Instance 2 = mode (b) nested rounding order
  # (takeoff: per-line ceil before sum).
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: order_pricing_tier_threshold_and_surge_interaction
        grounds:
          - calculations.order_pricing
          - entities.ContractorAccount.fields.pricing_tier
        distinguishing_aspect: |
          Mode (a): the formula has >= 3 interacting inputs — subtotal,
          pricing_tier (with the VOLUME threshold subtotal >= 250000
          falling back to 5%), surge_multiplier_pct, and delivery_fee —
          and the discount tier is keyed on the PRE-discount subtotal so
          evaluation order matters.
        test_recipe:
          setup:
            - "Two VOLUME-tier contractors; one order with subtotal 300000 (>= threshold -> 8%), another with subtotal 210000 (< threshold -> 5%)"
            - "Surge event active at 15%; delivery fee for the 300000-subtotal order is 22900"
            - "Expected first: disc 24000, surge 45000, total 343900; second: disc 10500"
          setup_api_calls:
            - call: "POST /roofing/branches"
              payload: { branch_code: "BR-P1", name: "Pricing", rooftop_delivery_capacity_per_day: 4, conveyor_fleet_size: 2, crane_available: true }
              as: PlatformAdmin
              captures: { br_p1: $.data.id }
            - call: "POST /roofing/products"
              payload: { sku: "SH-P1", manufacturer_name: "Acme", color_code: "BRN", bundles_per_square: 3.0, base_price_per_bundle_cents: 5000 }
              as: PlatformAdmin
              captures: { prod_p1: $.data.id }
            - call: "POST /roofing/branches/${br_p1}/inventory-lots"
              payload: { product_id: "${prod_p1}", lot_code: "LOT-P", on_hand_bundles: 1000 }
              as: WarehouseClerk
            - call: "POST /roofing/contractor-accounts"
              payload: { company_name: "Big Volume", credit_limit_cents: 100000000, pricing_tier: "VOLUME" }
              as: CreditAnalyst
              captures: { ca_p1: $.data.id }
            - call: "POST /roofing/contractor-accounts/${ca_p1}/job-accounts"
              payload: { job_name: "Big Job", site_address: "9 Pine St" }
              as: CreditAnalyst
              captures: { ja_p1: $.data.id }
            - call: "POST /roofing/job-accounts/${ja_p1}/takeoffs"
              payload: { product_id: "${prod_p1}", roof_squares: 20.0, waste_factor_pct: 0, valley_ridge_linear_feet: 0  }
              as: SalesRep
              captures: { tk_p1: $.data.id }
            - call: "POST /roofing/takeoffs/${tk_p1}/quote"
              payload: {}
              as: SalesRep
            - call: "POST /roofing/takeoffs/${tk_p1}/convert"
              payload: { branch_id: "${br_p1}" }
              as: Contractor
              as_user_id: "${ca_p1}"
              captures: { ord_p1: $.data.id }
            - call: "POST /roofing/branches/${br_p1}/delivery-slots"
              payload: { slot_date: "2026-08-11", window: "PM", equipment_type: "ROOFTOP_CONVEYOR", capacity: 5 }
              as: Dispatcher
              captures: { slot_p1: $.data.id }
            - call: "POST /roofing/orders/${ord_p1}/deliveries"
              payload: { delivery_slot_id: "${slot_p1}", equipment_type: "ROOFTOP_CONVEYOR" }
              as: Dispatcher
            - call: "POST /roofing/branches/${br_p1}/surge-events"
              payload: { event_name: "Hail-P1", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-31T23:59:59Z", surge_multiplier_pct: 15, allocation_pool_bundles: 5000 }
              as: BranchManager
              captures: { ev_p1: $.data.id }
            - call: "POST /roofing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roofing/surge-events/${ev_p1}/allocations"
              payload: { contractor_account_id: "${ca_p1}", product_id: "${prod_p1}", requested_bundles: 100 }
              as: Contractor
              as_user_id: "${ca_p1}"
              captures: { al_p1: $.data.id }
            - call: "GET /roofing/surge-events/${ev_p1}"
              payload: {}
              as: BranchManager
              captures: { ev_p1_v: $.data.version }
            - call: "POST /roofing/allocations/${al_p1}/grant"
              payload: { expected_storm_surge_event_version: "${ev_p1_v}" }
              as: BranchManager
            - call: "GET /roofing/contractor-accounts/${ca_p1}"
              payload: {}
              as: CreditAnalyst
              captures: { ca_p1_v: $.data.version }
          trigger:
            - call: "POST /roofing/orders/${ord_p1}/confirm"
              payload: { expected_contractor_account_version: "${ca_p1_v}" }
              as: Contractor
              as_user_id: "${ca_p1}"
          assert:
            - "Order.${ord_p1}.subtotal_cents == 300000"
            - "Order.${ord_p1}.discount_cents == 24000 (VOLUME 8% because subtotal >= 250000)"
            - "Order.${ord_p1}.surge_premium_cents == 45000"
            - "Order.${ord_p1}.delivery_fee_cents == 29500 (60 bundles -> 22500 + 20*350 = 29500)"
            - "Order.${ord_p1}.total_cents == 350500"

      - name: takeoff_per_line_ceil_then_sum
        grounds:
          - calculations.takeoff_material_estimate
          - entities.MaterialTakeoff.fields.estimated_bundles
        distinguishing_aspect: |
          Mode (b): nested rounding — ceil is applied per line (shingles
          separately from accessories) and THEN the lines are summed; the
          pinned order produces 66 + 3 = 69, whereas sum-then-round on the
          raw floats would give a different bundle count.
        test_recipe:
          setup:
            - "Product bundles_per_square = 3.0, accessory coverage 33 ft/bundle"
            - "roof_squares 20.0, waste 10 -> adjusted 22.0 -> ceil(22.0*3.0)=66"
            - "valley_ridge 99 -> ceil(99/33)=3"
            - "Per-line-then-sum = 69; a hypothetical sum-then-round would round a combined float"
          setup_api_calls:
            - call: "POST /roofing/branches"
              payload: { branch_code: "BR-T1", name: "Takeoff", rooftop_delivery_capacity_per_day: 4, conveyor_fleet_size: 2, crane_available: true }
              as: PlatformAdmin
              captures: { br_t1: $.data.id }
            - call: "POST /roofing/products"
              payload: { sku: "SH-T1", manufacturer_name: "Acme", color_code: "CHAR", bundles_per_square: 3.0, base_price_per_bundle_cents: 3500 }
              as: PlatformAdmin
              captures: { prod_t1: $.data.id }
            - call: "POST /roofing/contractor-accounts"
              payload: { company_name: "Takeoff Co", credit_limit_cents: 10000000, pricing_tier: "STANDARD" }
              as: CreditAnalyst
              captures: { ca_t1: $.data.id }
            - call: "POST /roofing/contractor-accounts/${ca_t1}/job-accounts"
              payload: { job_name: "Job T", site_address: "3 Birch St" }
              as: CreditAnalyst
              captures: { ja_t1: $.data.id }
          trigger:
            - call: "POST /roofing/job-accounts/${ja_t1}/takeoffs"
              payload: { product_id: "${prod_t1}", roof_squares: 20.0, waste_factor_pct: 10, valley_ridge_linear_feet: 99  }
              as: SalesRep
              captures: { tk_t1_est: $.data.estimated_bundles, tk_t1_amt: $.data.estimated_amount_cents }
          assert:
            - "MaterialTakeoff estimated_bundles == 69"
            - "MaterialTakeoff estimated_amount_cents == 243600"

  # =========================================================================
  # Rule 3 — non_linear_state_machine: two DIFFERENT entities each with a
  # non-linear shape. Instance 1 = Delivery has a FAILED->RESCHEDULED->
  # SCHEDULED cycle. Instance 2 = DamageClaim has UNDER_REVIEW->APPROVED->
  # DISPUTED->UNDER_REVIEW negotiation cycle (review_round increments).
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: delivery_fail_reschedule_cycle
        grounds:
          - state_machines.Delivery.FAILED_to_RESCHEDULED
          - state_machines.Delivery.RESCHEDULED_to_SCHEDULED
        distinguishing_aspect: |
          Delivery exhibits a true cycle (SCHEDULED -> EN_ROUTE -> FAILED ->
          RESCHEDULED -> SCHEDULED): after a failed attempt the delivery
          returns to SCHEDULED and can be dispatched again; attempt_count
          accumulates across loop iterations.
        test_recipe:
          setup:
            - "Confirmed order with a scheduled delivery; slot capacity 2"
          setup_api_calls:
            - call: "POST /roofing/branches"
              payload: { branch_code: "BR-D1", name: "Delivery", rooftop_delivery_capacity_per_day: 4, conveyor_fleet_size: 2, crane_available: true }
              as: PlatformAdmin
              captures: { br_d1: $.data.id }
            - call: "POST /roofing/products"
              payload: { sku: "SH-D1", manufacturer_name: "Acme", color_code: "GRY", bundles_per_square: 3.0, base_price_per_bundle_cents: 3000 }
              as: PlatformAdmin
              captures: { prod_d1: $.data.id }
            - call: "POST /roofing/branches/${br_d1}/inventory-lots"
              payload: { product_id: "${prod_d1}", lot_code: "LOT-D", on_hand_bundles: 200 }
              as: WarehouseClerk
            - call: "POST /roofing/contractor-accounts"
              payload: { company_name: "Deliv Co", credit_limit_cents: 10000000, pricing_tier: "STANDARD" }
              as: CreditAnalyst
              captures: { ca_d1: $.data.id }
            - call: "POST /roofing/contractor-accounts/${ca_d1}/job-accounts"
              payload: { job_name: "Job D", site_address: "4 Cedar St" }
              as: CreditAnalyst
              captures: { ja_d1: $.data.id }
            - call: "POST /roofing/job-accounts/${ja_d1}/takeoffs"
              payload: { product_id: "${prod_d1}", roof_squares: 10.0, waste_factor_pct: 0, valley_ridge_linear_feet: 0  }
              as: SalesRep
              captures: { tk_d1: $.data.id }
            - call: "POST /roofing/takeoffs/${tk_d1}/quote"
              payload: {}
              as: SalesRep
            - call: "POST /roofing/takeoffs/${tk_d1}/convert"
              payload: { branch_id: "${br_d1}" }
              as: Contractor
              as_user_id: "${ca_d1}"
              captures: { ord_d1: $.data.id }
            - call: "POST /roofing/branches/${br_d1}/delivery-slots"
              payload: { slot_date: "2026-08-12", window: "AM", equipment_type: "GROUND", capacity: 2 }
              as: Dispatcher
              captures: { slot_d1a: $.data.id }
            - call: "POST /roofing/branches/${br_d1}/delivery-slots"
              payload: { slot_date: "2026-08-13", window: "AM", equipment_type: "GROUND", capacity: 2 }
              as: Dispatcher
              captures: { slot_d1b: $.data.id }
            - call: "GET /roofing/contractor-accounts/${ca_d1}"
              payload: {}
              as: CreditAnalyst
              captures: { ca_d1_v: $.data.version }
            - call: "POST /roofing/orders/${ord_d1}/confirm"
              payload: { expected_contractor_account_version: "${ca_d1_v}" }
              as: Contractor
              as_user_id: "${ca_d1}"
            - call: "POST /roofing/orders/${ord_d1}/deliveries"
              payload: { delivery_slot_id: "${slot_d1a}", equipment_type: "GROUND" }
              as: Dispatcher
              captures: { dlv_d1: $.data.id }
            - call: "POST /roofing/deliveries/${dlv_d1}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /roofing/deliveries/${dlv_d1}/fail"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /roofing/deliveries/${dlv_d1}/reschedule"
              payload: { delivery_slot_id: "${slot_d1b}" }
              as: Dispatcher
            - call: "POST /roofing/deliveries/${dlv_d1}/reconfirm"
              payload: {}
              as: Dispatcher
            - call: "POST /roofing/deliveries/${dlv_d1}/dispatch"
              payload: {}
              as: Dispatcher
          assert:
            - "Delivery.${dlv_d1}.status == EN_ROUTE after second dispatch"
            - "Delivery.${dlv_d1}.attempt_count == 2 (incremented on each SCHEDULED -> EN_ROUTE pass)"

      - name: damage_claim_dispute_review_cycle
        grounds:
          - state_machines.DamageClaim.APPROVED_to_DISPUTED
          - state_machines.DamageClaim.DISPUTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          DamageClaim exhibits a negotiation cycle (UNDER_REVIEW -> APPROVED
          -> DISPUTED -> UNDER_REVIEW) with review_round incrementing on each
          re-entry; the cycle is on a different entity than Delivery and its
          loop counter is a persisted field.
        test_recipe:
          setup:
            - "Delivered order; a DamageClaim filed, moved to UNDER_REVIEW, APPROVED with amount 5000"
          setup_api_calls:
            - call: "POST /roofing/branches"
              payload: { branch_code: "BR-CL1", name: "Claims", rooftop_delivery_capacity_per_day: 4, conveyor_fleet_size: 2, crane_available: true }
              as: PlatformAdmin
              captures: { br_cl1: $.data.id }
            - call: "POST /roofing/products"
              payload: { sku: "SH-CL1", manufacturer_name: "Acme", color_code: "RED", bundles_per_square: 3.0, base_price_per_bundle_cents: 3000 }
              as: PlatformAdmin
              captures: { prod_cl1: $.data.id }
            - call: "POST /roofing/branches/${br_cl1}/inventory-lots"
              payload: { product_id: "${prod_cl1}", lot_code: "LOT-CL", on_hand_bundles: 200 }
              as: WarehouseClerk
            - call: "POST /roofing/contractor-accounts"
              payload: { company_name: "Claim Co", credit_limit_cents: 10000000, pricing_tier: "STANDARD" }
              as: CreditAnalyst
              captures: { ca_cl1: $.data.id }
            - call: "POST /roofing/contractor-accounts/${ca_cl1}/job-accounts"
              payload: { job_name: "Job CL", site_address: "5 Walnut St" }
              as: CreditAnalyst
              captures: { ja_cl1: $.data.id }
            - call: "POST /roofing/job-accounts/${ja_cl1}/takeoffs"
              payload: { product_id: "${prod_cl1}", roof_squares: 10.0, waste_factor_pct: 0, valley_ridge_linear_feet: 0  }
              as: SalesRep
              captures: { tk_cl1: $.data.id }
            - call: "POST /roofing/takeoffs/${tk_cl1}/quote"
              payload: {}
              as: SalesRep
            - call: "POST /roofing/takeoffs/${tk_cl1}/convert"
              payload: { branch_id: "${br_cl1}" }
              as: Contractor
              as_user_id: "${ca_cl1}"
              captures: { ord_cl1: $.data.id }
            - call: "GET /roofing/contractor-accounts/${ca_cl1}"
              payload: {}
              as: CreditAnalyst
              captures: { ca_cl1_v: $.data.version }
            - call: "POST /roofing/orders/${ord_cl1}/confirm"
              payload: { expected_contractor_account_version: "${ca_cl1_v}" }
              as: Contractor
              as_user_id: "${ca_cl1}"
            - call: "POST /roofing/branches/${br_cl1}/delivery-slots"
              payload: { slot_date: "2026-08-12", window: "AM", equipment_type: "GROUND", capacity: 2 }
              as: Dispatcher
              captures: { slot_cl1: $.data.id }
            - call: "POST /roofing/orders/${ord_cl1}/deliveries"
              payload: { delivery_slot_id: "${slot_cl1}", equipment_type: "GROUND" }
              as: Dispatcher
              captures: { dlv_cl1: $.data.id }
            - call: "POST /roofing/deliveries/${dlv_cl1}/dispatch"
              payload: {}
              as: Dispatcher
