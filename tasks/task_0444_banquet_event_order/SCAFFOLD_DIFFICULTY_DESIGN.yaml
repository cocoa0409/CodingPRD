          assert:
            - "err == ERR_NO_BOOKINGS"
            - "Event.${event_id}.status == INQUIRY"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: make_definite_requires_event_tentative_or_definite
        grounds:
          - state_machines.FunctionRoomBooking.HOLD_to_DEFINITE
          - state_machines.Event.INQUIRY_to_TENTATIVE
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair FunctionRoomBooking -> Event: a booking can only flip HOLD -> DEFINITE
          when its owning Event.status is in {TENTATIVE, DEFINITE}; on an INQUIRY event the
          make-definite is rejected with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Event still in INQUIRY (never held) with one HOLD booking."
          setup_api_calls:
            - call: "POST /function-rooms"
              payload: { name: "Salon J", max_capacity: 300, turnover_buffer_minutes: 0, hourly_rental_cents: 0 }
              as: PlatformAdmin
              captures: { room_id: $.data.id }
            - call: "POST /events"
              payload: { account_name: "Nu Inquiry", event_date: "2027-08-01", setup_style: "THEATER", expected_attendance: 50 }
              as: SalesManager
              captures: { event_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /events/${event_id}/bookings"
              payload: { function_room_id: "${room_id}", start_utc: "2027-08-01T18:00:00Z", end_utc: "2027-08-01T22:00:00Z", expected_event_version: "${ev_v0}" }
              as: SalesManager
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /events/${event_id}/bookings/${booking_id}/make-definite"
              payload: {}
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "FunctionRoomBooking.${booking_id}.hold_status == HOLD"

      - name: lock_guarantee_requires_settled_deposit_schedule_item
        grounds:
          - state_machines.Event.DEFINITE_to_CONFIRMED
          - calculations.payment_waterfall
          - entities.PaymentScheduleItem.fields.settled
          - validations[priority=12]
          - errors[ERR_DEPOSIT_UNSETTLED]
        distinguishing_aspect: |
          A DIFFERENT entity pair Event -> PaymentScheduleItem: lock-guarantee (DEFINITE ->
          CONFIRMED) is rejected with ERR_DEPOSIT_UNSETTLED when the deposit milestone
          (sequence_no==1) is not yet settled, i.e. its settled flag is false because no/insufficient
          payment has been allocated to it.
        test_recipe:
          setup:
            - "Event in DEFINITE with a deposit schedule item amount_due 500000 and zero payments applied (deposit unsettled)."
          setup_api_calls:
            - call: "POST /function-rooms"
              payload: { name: "Salon K", max_capacity: 300, turnover_buffer_minutes: 0, hourly_rental_cents: 0 }
              as: PlatformAdmin
              captures: { room_id: $.data.id }
            - call: "POST /events"
              payload: { account_name: "Xi Event", event_date: "2027-09-01", setup_style: "THEATER", expected_attendance: 50 }
              as: SalesManager
              captures: { event_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /events/${event_id}/bookings"
              payload: { function_room_id: "${room_id}", start_utc: "2027-09-01T18:00:00Z", end_utc: "2027-09-01T22:00:00Z", expected_event_version: "${ev_v0}" }
              as: SalesManager
              captures: { booking_id: $.data.id }
            - call: "POST /events/${event_id}/hold"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/bookings/${booking_id}/make-definite"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/confirm-space"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_id}/payment-schedule-items"
              payload: { label: "Deposit", due_date: "2027-08-01", amount_due_cents: 500000 }
              as: AccountingClerk
          trigger:
            - call: "POST /events/${event_id}/lock-guarantee"
              payload: { guarantee_count: 50 }
              as: BanquetCaptain
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DEPOSIT_UNSETTLED"
            - "Event.${event_id}.status == DEFINITE"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: function_room_buffered_pairwise_overlap
        grounds:
          - validations[priority=7]
          - entities.FunctionRoom.fields.turnover_buffer_minutes
          - errors[ERR_ROOM_DOUBLE_BOOKED]
          - state_machines.FunctionRoomBooking.HOLD_to_DEFINITE
        distinguishing_aspect: |
          FunctionRoom uses PAIRWISE BUFFERED EXCLUSION: on a TENTATIVE event (state passes)
          candidate 22:30-23:30 expanded by the 60-minute buffer to 21:30-00:30 intersects an
          existing DEFINITE 18:00-22:00 (21:30 < 22:00), so make-definite is rejected with
          ERR_ROOM_DOUBLE_BOOKED even though the raw windows do not touch.
        test_recipe:
          setup:
            - "Room buffer 60, ample capacity. Existing DEFINITE booking 18:00-22:00 (event A)."
            - "Event B is TENTATIVE with a HOLD booking 22:30-23:30 on the same room."
          setup_api_calls:
            - call: "POST /function-rooms"
              payload: { name: "Buffered Room", max_capacity: 300, turnover_buffer_minutes: 60, hourly_rental_cents: 0 }
              as: PlatformAdmin
              captures: { room_id: $.data.id }
            - call: "POST /events"
              payload: { account_name: "Omicron A", event_date: "2027-10-01", setup_style: "THEATER", expected_attendance: 50 }
