  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: team_leader_half_open_window_adjacent_allowed_overlap_rejected
        grounds:
          - calculations.inspection_window_conflicts
          - validations.priority_26_ERR_TEAM_LEADER_WINDOW_CONFLICT
          - constants.TEAM_LEADER_CAPACITY
        distinguishing_aspect: |
          The team-leader test is half-open [start, end) with capacity 1: a window starting exactly
          when the previous one ends is legal, while starting one minute earlier is a conflict. The
          two candidate windows differ by 60 seconds and land on opposite sides of the rule. Each
          window is placed on a DIFFERENT bridge so the 72-hour same-bridge buffer at priority 25
          cannot fire first and mask the result.
        test_recipe:
          setup:
            - "One team leader, Ivy Inspector, and three distinct bridges STR-000001 / STR-000002 / STR-000003."
            - "Inspection A: bridge 1, 2026-09-01T08:00:00Z .. 2026-09-01T16:00:00Z."
            - "Inspection B: bridge 2, 2026-09-01T16:00:00Z .. 2026-09-01T20:00:00Z - exactly adjacent to A, accepted, proving the touching boundary is allowed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /personnel"
              payload: { full_name: "Ivy Inspector", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
              as: ProgramAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true, underwater_elements: false, fracture_critical: false }
              as: ProgramAdmin
              captures: { br1_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000002", name: "Willow Slough Bridge", owner_agency: "STATE_DOT", structure_type: "CONCRETE_BOX", deck_area_sqm: 600, year_built: 1988, adt: 3000, detour_length_km: 2.0, spans_water: true, underwater_elements: false, fracture_critical: false }
              as: ProgramAdmin
              captures: { br2_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000003", name: "Granite Ridge Overpass", owner_agency: "STATE_DOT", structure_type: "PRESTRESSED_GIRDER", deck_area_sqm: 800, year_built: 1995, adt: 7000, detour_length_km: 5.0, spans_water: false, underwater_elements: false, fracture_critical: false }
              as: ProgramAdmin
              captures: { br3_id: $.data.id }
            - call: "POST /bridges/${br1_id}/inspections"
              payload: { inspection_type: "ROUTINE", team_leader_id: "${insp_id}", field_window_start: "2026-09-01T08:00:00Z", field_window_end: "2026-09-01T16:00:00Z" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ins_a_id: $.data.id }
            - call: "POST /bridges/${br2_id}/inspections"
              payload: { inspection_type: "ROUTINE", team_leader_id: "${insp_id}", field_window_start: "2026-09-01T16:00:00Z", field_window_end: "2026-09-01T20:00:00Z" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ins_b_id: $.data.id }
          trigger:
            - call: "POST /bridges/${br3_id}/inspections"
              payload: { inspection_type: "ROUTINE", team_leader_id: "${insp_id}", field_window_start: "2026-09-01T15:59:00Z", field_window_end: "2026-09-01T20:00:00Z" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
          assert:
            - "The adjacent inspection B was created with HTTP 201 - new.start == existing.end is NOT a conflict under the half-open rule"
            - "The trigger returns HTTP 409 with error_id ERR_TEAM_LEADER_WINDOW_CONFLICT"
            - "NOT ERR_BRIDGE_ACCESS_BUFFER_CONFLICT - bridge 3 has no other inspection, so the 72-hour same-bridge buffer is not in play"
            - "GET /inspections?team_leader_id=${insp_id} returns exactly 2 rows (${ins_a_id} and ${ins_b_id}); the rejected window created nothing"
            - "GET /inspections?bridge_id=${br3_id} returns an empty list with total_count 0"
            - "After POST /inspections/${ins_a_id}/void the same 15:59 window on bridge 3 is accepted, because VOIDED rows leave the team leader's capacity"

      - name: bridge_access_72h_buffer_gap_rejected
        grounds:
          - calculations.inspection_window_conflicts
          - validations.priority_25_ERR_BRIDGE_ACCESS_BUFFER_CONFLICT
          - constants.BRIDGE_ACCESS_BUFFER_HOURS
        distinguishing_aspect: |
          The same-bridge test uses the opposite interval convention from the team-leader test: a
          closed interval inflated by 72 hours on both sides. A window starting exactly 72 hours after
          the previous window's end is allowed (new.start < existing.end + 72h is false), while
          starting one hour earlier is rejected. Distinct team leaders are used so the half-open
          capacity rule at priority 26 cannot decide the outcome instead.
        test_recipe:
          setup:
            - "Three team leaders (Ivy, Frank, Gus) and one bridge STR-000001, so only the bridge-access buffer can fire."
            - "Inspection A: 2026-09-01T08:00:00Z .. 2026-09-01T16:00:00Z, led by Ivy."
            - "Inspection B: 2026-09-04T16:00:00Z .. 2026-09-04T20:00:00Z, led by Frank - starts exactly at existing.end + 72h and is accepted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /personnel"
              payload: { full_name: "Ivy Inspector", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
              as: ProgramAdmin
              captures: { ivy_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Frank Field", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
              as: ProgramAdmin
              captures: { frank_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Gus Gauge", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
              as: ProgramAdmin
              captures: { gus_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true, underwater_elements: false, fracture_critical: false }
              as: ProgramAdmin
              captures: { br_id: $.data.id }
            - call: "POST /bridges/${br_id}/inspections"
              payload: { inspection_type: "ROUTINE", team_leader_id: "${ivy_id}", field_window_start: "2026-09-01T08:00:00Z", field_window_end: "2026-09-01T16:00:00Z" }
              as: BridgeInspector
              as_user_id: "${ivy_id}"
              captures: { ins_a_id: $.data.id }
            - call: "POST /bridges/${br_id}/inspections"
              payload: { inspection_type: "SPECIAL", team_leader_id: "${frank_id}", field_window_start: "2026-09-04T16:00:00Z", field_window_end: "2026-09-04T20:00:00Z" }
              as: BridgeInspector
              as_user_id: "${frank_id}"
              captures: { ins_b_id: $.data.id }
          trigger:
            - call: "POST /bridges/${br_id}/inspections"
              payload: { inspection_type: "SPECIAL", team_leader_id: "${gus_id}", field_window_start: "2026-09-04T15:00:00Z", field_window_end: "2026-09-04T20:00:00Z" }
              as: BridgeInspector
              as_user_id: "${gus_id}"
          assert:
            - "Inspection B was created with HTTP 201: 2026-09-04T16:00:00Z == 2026-09-01T16:00:00Z + 72h exactly, and the conflict test is strict <"
            - "The trigger returns HTTP 409 with error_id ERR_BRIDGE_ACCESS_BUFFER_CONFLICT - 2026-09-04T15:00:00Z is one hour inside the buffer"
            - "NOT ERR_TEAM_LEADER_WINDOW_CONFLICT: Gus leads no other inspection, so only the bridge buffer is violated"
            - "GET /inspections?bridge_id=${br_id} returns exactly 2 rows (${ins_a_id} and ${ins_b_id})"
            - "GET /inspections?team_leader_id=${gus_id} returns an empty list with total_count 0"
            - "The two candidate windows differ by exactly 3600 seconds and land on opposite sides of the same rule, and the accepted one is the LATER start - the buffer is measured from the existing window's end, not from its start"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: program_then_withdraw_restores_budget_identity
        grounds:
          - calculations.program_budget_waterfall
          - state_machines.ProjectCandidate.IDENTIFIED_to_PROGRAMMED
          - state_machines.ProjectCandidate.PROGRAMMED_to_WITHDRAWN
          - endpoints.GET_program_cycles_id_allocation_summary
        distinguishing_aspect: |
          Money is conserved across a program / withdraw round trip: the identity
          authorized == reserve + committed + remaining holds before programming, after programming
          and after withdrawal, and the post-withdrawal numbers are byte-identical to the pre-program
          numbers even though the candidate row itself has moved to a different terminal state. The
          reserve is never recomputed from committed_cents, so the 500000000 reserve is untouched at
          every step, and the withdrawn candidate contributes to NEITHER committed_cents nor
          unprogrammed_cost_cents - the compensation removes it from both buckets, not just one.
        test_recipe:
          setup:
            - "One ProgramCycle in PLANNING: authorized_budget_cents 10000000000, reserve_pct 0.05 -> reserve_cents 500000000, available_cents 9500000000."
            - "Cedar Creek Bridge with an ACCEPTED ROUTINE inspection, so the accept cascade auto-creates one IDENTIFIED candidate with estimated_cost_cents 26588000 and priority_score 43.41."
            - "Dana District performs both the program and the withdraw."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /personnel"
              payload: { full_name: "Ivy Inspector", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
              as: ProgramAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Quinn Qa", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
              as: ProgramAdmin
              captures: { qa_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Dana District", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true, load_rating_engineer_licensed: true, pe_license_number: "PE-20044" }
              as: ProgramAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /program-cycles"
              payload: { fiscal_year: 2028, authorized_budget_cents: 10000000000, ranking_policy: "CONDITION_BASED", reserve_pct: 0.05 }
              as: ProgramAdmin
              captures: { pc_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true, underwater_elements: false, fracture_critical: false }
              as: ProgramAdmin
              captures: { br_id: $.data.id }
            - call: "POST /bridges/${br_id}/inspections"
              payload: { inspection_type: "ROUTINE", team_leader_id: "${insp_id}", field_window_start: "2026-09-02T08:00:00Z", field_window_end: "2026-09-02T16:00:00Z" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ins_id: $.data.id }
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "DECK", element_group: "DECK_GROUP", unit: "SQM", total_quantity: 1000, cs1_qty: 600, cs2_qty: 200, cs3_qty: 150, cs4_qty: 50, photo_count: 6, defect_notes: "Spalling and delamination in bay 3" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "GIRDER", element_group: "SUPERSTRUCTURE", unit: "M", total_quantity: 300, cs1_qty: 0, cs2_qty: 100, cs3_qty: 100, cs4_qty: 100, photo_count: 8, defect_notes: "Section loss at girder 2 web" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "BEARING", element_group: "SUPERSTRUCTURE", unit: "EA", total_quantity: 4, cs1_qty: 0, cs2_qty: 2, cs3_qty: 1, cs4_qty: 1, photo_count: 4, defect_notes: "Frozen bearing at pier 1" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "ABUTMENT", element_group: "SUBSTRUCTURE", unit: "EA", total_quantity: 4, cs1_qty: 3, cs2_qty: 1, cs3_qty: 0, cs4_qty: 0, photo_count: 1, defect_notes: "Minor map cracking" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /inspections/${ins_id}/submit"
              payload: { inspection_date: "2026-09-02T10:00:00Z" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/qa-claim"
              payload: {}
              as: QaReviewer
              as_user_id: "${qa_id}"
            - call: "POST /inspections/${ins_id}/qa-decision"
              payload: { decision: "ACCEPT" }
              as: QaReviewer
              as_user_id: "${qa_id}"
            - call: "GET /project-candidates?program_cycle_id=${pc_id}"
              payload: {}
              as: ProgramAdmin
              captures: { cd_id: "$.data[0].id" }
            - call: "GET /program-cycles/${pc_id}/allocation-summary"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /project-candidates/${cd_id}/program"
              payload: {}
              as: DistrictEngineer
              as_user_id: "${dist_id}"
            - call: "GET /program-cycles/${pc_id}/allocation-summary"
              payload: {}
              as: ProgramAdmin
            - call: "POST /project-candidates/${cd_id}/withdraw"
              payload: {}
              as: DistrictEngineer
              as_user_id: "${dist_id}"
            - call: "GET /program-cycles/${pc_id}/allocation-summary"
              payload: {}
              as: ProgramAdmin
          assert:
            - "BEFORE - allocation-summary reads reserve_cents 500000000, available_cents 9500000000, committed_cents 0, remaining_cents 9500000000, identified_count 1, programmed_count 0, unprogrammed_cost_cents 26588000, identity_holds true"
            - "AFTER PROGRAM - committed_cents 26588000, remaining_cents 9473412000, identified_count 0, programmed_count 1, unprogrammed_cost_cents 0, reserve_cents still 500000000, identity_holds true (500000000 + 26588000 + 9473412000 == 10000000000)"
            - "AFTER WITHDRAW - committed_cents 0, remaining_cents 9500000000, programmed_count 0, identified_count 0, deferred_count 0, unprogrammed_cost_cents 0, reserve_cents still 500000000, identity_holds true"
            - "The AFTER WITHDRAW money fields are identical to the BEFORE money fields, yet ProjectCandidate.${cd_id}.status == WITHDRAWN and programmed_at == null - the row did not return to IDENTIFIED"
            - "The withdrawn candidate contributes to neither committed_cents nor unprogrammed_cost_cents, so unprogrammed_cost_cents is 0 and not 26588000"
            - "ProjectCandidate.${cd_id}.estimated_cost_cents is still 26588000 and priority_score is still 43.41 - the compensation touches the cycle's buckets, not the candidate's own numbers"
            - "A second POST /project-candidates/${cd_id}/program returns 409 ERR_PROGRAM_STATE_INVALID: WITHDRAWN is terminal, so the restored budget cannot be re-consumed by the same row"

      - name: element_quantity_redistribution_preserves_total_units
        grounds:
          - calculations.element_health_index
          - calculations.bridge_health_index
          - calculations.bridge_deficiency_pct
          - endpoints.PUT_element_conditions_id
        distinguishing_aspect: |
          Redistributing 100 units of deck area from CS1 to CS2 and 50 units from CS3 to CS4 conserves
          two quantities exactly - total_quantity 1000 and deficient_quantity cs3+cs4 == 200 - while
          the weighted health index must move from 82.00 to 78.00 because the four condition states
          carry different weights. The physical-unit invariant and the derived deficiency percentage
          both hold at their original values (1308 inventoried, 402 deficient, 30.73 pct) while the
          health index, the deck NBI rating and the bridge health index all change. An implementation
          that keys the roll-ups off deficient quantity alone shows no change at all; one that fails
          to re-run element_health_index on PUT keeps 82.00.
        test_recipe:
          setup:
            - "Baseline staff and Cedar Creek Bridge with the four baseline element rows; the DECK row starts at cs1 600 / cs2 200 / cs3 150 / cs4 50 and element_health_index 82.00."
            - "The inspection is still in DRAFT, which is the only state in which PUT /element-conditions/{id} is allowed."
            - "No ProgramCycle exists, so acceptance creates no candidate and the assertions stay on the conservation quantities."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /personnel"
              payload: { full_name: "Ivy Inspector", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
              as: ProgramAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Quinn Qa", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
              as: ProgramAdmin
              captures: { qa_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true, underwater_elements: false, fracture_critical: false }
              as: ProgramAdmin
              captures: { br_id: $.data.id }
            - call: "POST /bridges/${br_id}/inspections"
              payload: { inspection_type: "ROUTINE", team_leader_id: "${insp_id}", field_window_start: "2026-09-02T08:00:00Z", field_window_end: "2026-09-02T16:00:00Z" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ins_id: $.data.id }
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "DECK", element_group: "DECK_GROUP", unit: "SQM", total_quantity: 1000, cs1_qty: 600, cs2_qty: 200, cs3_qty: 150, cs4_qty: 50, photo_count: 6, defect_notes: "Spalling and delamination in bay 3" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ec_deck_id: $.data.id }
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "GIRDER", element_group: "SUPERSTRUCTURE", unit: "M", total_quantity: 300, cs1_qty: 0, cs2_qty: 100, cs3_qty: 100, cs4_qty: 100, photo_count: 8, defect_notes: "Section loss at girder 2 web" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "BEARING", element_group: "SUPERSTRUCTURE", unit: "EA", total_quantity: 4, cs1_qty: 0, cs2_qty: 2, cs3_qty: 1, cs4_qty: 1, photo_count: 4, defect_notes: "Frozen bearing at pier 1" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "ABUTMENT", element_group: "SUBSTRUCTURE", unit: "EA", total_quantity: 4, cs1_qty: 3, cs2_qty: 1, cs3_qty: 0, cs4_qty: 0, photo_count: 1, defect_notes: "Minor map cracking" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "PUT /element-conditions/${ec_deck_id}"
              payload: { total_quantity: 1000, cs1_qty: 500, cs2_qty: 300, cs3_qty: 100, cs4_qty: 100, photo_count: 7, defect_notes: "Re-measured: half the CS3 area is full-depth" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /inspections/${ins_id}/submit"
              payload: { inspection_date: "2026-09-02T10:00:00Z" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/qa-claim"
              payload: {}
              as: QaReviewer
              as_user_id: "${qa_id}"
            - call: "POST /inspections/${ins_id}/qa-decision"
              payload: { decision: "ACCEPT" }
              as: QaReviewer
              as_user_id: "${qa_id}"
          assert:
            - "CONSERVED - ElementCondition.${ec_deck_id}.total_quantity == 1000 and cs1+cs2+cs3+cs4 == 1000 before and after the PUT"
            - "CONSERVED - ElementCondition.${ec_deck_id}.deficient_quantity == 200 both before (150+50) and after (100+100) the PUT"
            - "CONSERVED - Inspection.${ins_id}.reported_quantity_total == 1308 and deficient_quantity_total == 402, identical to the pre-PUT element set"
            - "CONSERVED - Bridge.${br_id}.deficiency_pct == 30.73 and inventoried_quantity_total == 1308 after acceptance"
            - "CHANGED - ElementCondition.${ec_deck_id}.element_health_index == 78.00 (100*(500 + 240 + 40 + 0)/1000), down from 82.00"
            - "CHANGED - Inspection.${ins_id}.bridge_health_index == 63.87 ((0.30*78.00 + 0.25*40.00 + 0.10*50.00 + 0.10*95.00)/0.75 = 63.8666... -> 63.87), not the 65.47 of the original set"
            - "CHANGED - Bridge.${br_id}.deck_rating == 6 (deck group index 78.00 falls in the >= 70 band), while superstructure_rating stays 3, substructure_rating stays 8 and min_nbi_rating stays 3"
            - "The estimated repair cost of a candidate built from this inspection is still 26588000 cents, because pricing keys off cs3+cs4 quantity per element and that quantity was conserved"
