            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 02", unit_code: "U02" }, as: ProgramAdmin }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 03", unit_code: "U03" }, as: ProgramAdmin }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 04", unit_code: "U04" }, as: ProgramAdmin }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 05", unit_code: "U05" }, as: ProgramAdmin }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 06", unit_code: "U06" }, as: ProgramAdmin }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 07", unit_code: "U07" }, as: ProgramAdmin }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 08", unit_code: "U08" }, as: ProgramAdmin }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 09", unit_code: "U09" }, as: ProgramAdmin }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 10", unit_code: "U10" }, as: ProgramAdmin }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 11", unit_code: "U11" }, as: ProgramAdmin }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 12", unit_code: "U12" }, as: ProgramAdmin }
          trigger:
            - { call: "GET /api/units?program_id=${pg}", payload: {}, as: Any, captures: { total: "$.data" } }
            - { call: "GET /api/units?program_id=${pg}&offset=10", payload: {}, as: Any }
          assert:
            - "page 1: len(data) == 10, total_count == 12, has_more == true (default limit 10)"
            - "page 2 (offset=10): len(data) == 2, total_count == 12, has_more == false"

      - name: response_envelope_and_any_role_get
        claim_type: standard_crud
        grounds:
          - response_envelope
          - "roles[Any]"
        distinguishing_aspect: "Every success response carries meta.api_request_id + api_request_timestamp and response_type object|array; GET endpoints are declared roles: [Any] — readable by any authenticated role (the call uses the Any pseudo-role) with 200."
        test_recipe:
          setup: ["program exists"]
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-EP2", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id" } }
          trigger:
            - { call: "GET /api/survey-programs/${pg}", payload: {}, as: Any }
          assert:
            - "200; meta.api_request_id present; response_type == object; data.id == ${pg}"

      - name: attribution_report_unit_and_provider
        claim_type: computed_read
        grounds:
          - "endpoints[GET /api/cycles/{cycleId}/attribution-report]"
          - calculations.top_box_composite_scores
        distinguishing_aspect: "Unit/provider-level attribution: 15 all-4 responses on U1/P1 and 8x4+2x3 on U2/P2 -> unit U1 adjusted overall 100.0 (n=15), provider P2 adjusted overall 80.0 (n=10); calling without exactly one scope id -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["cycle SCORING: 15 cases U1/P1 all-4 MAIL; 10 cases U2/P2: 8 all-4, 2 all-3"]
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-EP3", sampling_protocol: "STRATIFIED_BY_UNIT", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
