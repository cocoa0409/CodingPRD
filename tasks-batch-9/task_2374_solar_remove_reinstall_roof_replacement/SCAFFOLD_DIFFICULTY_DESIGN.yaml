  - rule_id: non_linear_state_machine
    instances:
      - name: party_approval_negotiation_round_cycle_voids_and_then_re_collects_all_three_consents
        grounds:
          - state_machines.PartyApproval.APPROVED_to_CHANGES_REQUESTED
          - state_machines.PartyApproval.APPROVED_to_PENDING
          - state_machines.PartyApproval.CHANGES_REQUESTED_to_APPROVED
          - state_machines.ReroofProject.APPROVALS_OPEN_to_APPROVALS_OPEN
          - state_machines.ReroofProject.APPROVALS_OPEN_to_AUTHORIZED
          - entities.ReroofProject.fields.negotiation_round
          - entities.PartyApproval.fields.round_recorded
        distinguishing_aspect: |
          Cyclic shape on PartyApproval: the row leaves APPROVED for CHANGES_REQUESTED, siblings are
          driven APPROVED -> PENDING, and the objecting row later returns CHANGES_REQUESTED -> APPROVED,
          so the same rows traverse the same states twice while ReroofProject self-loops
          APPROVALS_OPEN -> APPROVALS_OPEN with negotiation_round advancing 1 -> 2; authorization is
          reached only when three APPROVED rows all carry round_recorded == 2.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A LEASE project with three open consents (roofer, solar owner, third-party system owner), so required_approval_party_count == 3."
            - "The roofer and the solar owner have both APPROVED in round 1; the system owner has not decided, so phase is still APPROVALS_OPEN and negotiation_round == 1."
