              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: settlement_release_not_found_beats_hold_active
        grounds:
          - validations[priority=3]
          - validations[priority=8]
          - state_machines.MerchantSettlement.PENDING_to_RELEASED
        distinguishing_aspect: |
          Category pair existence(p3) vs business_temporal(p8): releasing a settlement
          id that does not exist returns ERR_NOT_FOUND (p3), NOT
          ERR_SETTLEMENT_HOLD_ACTIVE (p8) — existence outranks the temporal hold check.
          Different category pair than the state-vs-safety conflict above.
        test_recipe:
          setup:
            - "Empty DB except clock; no settlement with the probed id exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
