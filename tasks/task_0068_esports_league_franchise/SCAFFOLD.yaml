scenario: "68. North American Esports League Franchise (NBA 2K style): team Roster, Salary Cap, trade window, transfers, playoffs, Fines/Penalties, sponsorship revenue sharing, Two-Way Player"
domain_name: esports-league-franchise
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation          # salary cap is a finite pool reserved/committed/released per roster move
  secondary_archetype: multi_party_negotiation  # trades require both teams to accept; either may veto
  complexity_layers:
    - optimistic_concurrency       # OCC on Team.version guards salary-cap-consuming roster mutations
    - cascading_side_effects       # trade acceptance / fine assessment chain across Team, Contract, RosterSpot
    - dual_variant_calculation     # cap charge: standard vs two-way-exempt; payroll: active vs full-roster
    - rate_threshold_triggers      # penalty-point accumulation flips team posture at a breakpoint

  entity_topology: flat            # peer entities linked by FK (Team, Player, Contract, Trade, Fine, Sponsorship); no nested-URL ownership tree
  state_machine_shape: branching   # Trade forks PROPOSED -> {ACCEPTED, REJECTED, WITHDRAWN}; divergent side-effects per branch
  relationship_patterns:
    - one_to_many                  # Team 1..* Contract; Sponsorship 1..* RevenueShare
    - many_to_many                 # Trade associates two Teams and a set of Contracts moving between them
    - cross_aggregate              # Contract references both Team and Player across aggregate boundaries
  role_model: peer_roles           # TeamGM owns its own team's roster moves; LeagueCommissioner owns league-wide ops (cap, fines, windows, payouts)
  consistency_model: immediate     # all cap re-computations and cascades complete inside the triggering request

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Season
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Season label, e.g. '2026 Spring Split'."
      - name: salary_cap_cents
        type: integer
        source: input
        description: "Hard reference cap per team in cents; payroll above it incurs luxury tax. Must be > 0."
        constraints: ">= 1"
      - name: roster_min
        type: integer
        source: input
        description: "Minimum number of ACTIVE standard contracts a team must carry to be playoff-eligible."
        default: 5
        constraints: ">= 1"
      - name: roster_max
        type: integer
        source: input
        description: "Maximum number of ACTIVE standard (non-two-way) contracts a team may carry."
        default: 8
        constraints: ">= roster_min"
      - name: two_way_max
        type: integer
        source: input
        description: "Maximum number of ACTIVE two-way contracts a team may carry (separate from the standard limit)."
        default: 2
        constraints: ">= 0"
      - name: penalty_threshold
        type: integer
        source: input
        description: "Cumulative team penalty_points value (>=) at which the team posture flips to RESTRICTED."
        default: 3
        constraints: ">= 1"
      - name: trade_window_state
        type: enum
        source: computed
        description: "OPEN once a trade window is opened by the commissioner, CLOSED otherwise. Gates Trade creation."
        constraints: "one of {OPEN, CLOSED}; initialized CLOSED"
        default: CLOSED
      - name: phase
        type: enum
        source: computed
        description: "Season lifecycle phase; see Season state machine."
        constraints: "one of {SETUP, REGULAR, PLAYOFFS, COMPLETE}; initialized SETUP"
        default: SETUP

  - name: Team
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season this team competes in."
      - name: name
        type: string
        source: input
        description: "Franchise name; unique within a season (case-sensitive exact match)."
      - name: market_size_weight
        type: integer
        source: input
        description: "Sponsorship revenue-share weight for this team; used by the revenue waterfall. Must be >= 1."
        constraints: ">= 1"
      - name: payroll_active_cents
        type: integer
        source: computed
        description: "Sum of base_salary_cents over this team's cap-counting contracts (see active_payroll calc)."
        default: 0
      - name: penalty_points
        type: integer
        source: computed
        description: "Cumulative unwaived penalty points from assessed Fines against this team or its players."
        default: 0
      - name: posture
        type: enum
        source: computed
        description: "OPEN normally; flips to RESTRICTED at penalty_threshold; see Team state machine."
        constraints: "one of {OPEN, RESTRICTED}; initialized OPEN"
        default: OPEN
      - name: seed
        type: integer
        source: computed
        description: "Playoff seed assigned when the season enters PLAYOFFS; null until then. Lower = better seed."
        default: null
      - name: eliminated
        type: boolean
        source: computed
        description: "True once the team loses a playoff series; gates further playoff progression."
        default: false

  - name: Player
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season pool this player belongs to."
      - name: handle
        type: string
        source: input
        description: "Player gamertag; unique within a season (case-sensitive exact match)."
      - name: status
        type: enum
        source: computed
        description: "FREE_AGENT when unsigned, SIGNED when holding an ACTIVE contract; see Player state machine."
        constraints: "one of {FREE_AGENT, SIGNED}; initialized FREE_AGENT"
        default: FREE_AGENT

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - name: team_id
        type: string
        source: input
        description: "FK -> Team.id; the team currently holding this contract."
      - name: player_id
        type: string
        source: input
        description: "FK -> Player.id; the player signed under this contract."
      - name: base_salary_cents
        type: integer
        source: input
        description: "Annual base salary in cents. Counts toward cap per the cap-charge rules. Must be > 0."
        constraints: ">= 1"
      - name: contract_type
        type: enum
        source: input
        description: "STANDARD counts toward the salary cap; TWO_WAY is cap-exempt while UNPROMOTED."
        constraints: "one of {STANDARD, TWO_WAY}"
      - name: term_start
        type: datetime
        source: input
        description: "ISO 8601 UTC date the contract term begins (inclusive)."
      - name: term_end
        type: datetime
        source: input
        description: "ISO 8601 UTC date the contract term ends (inclusive). Must be >= term_start. A player may not hold two ACTIVE contracts whose CLOSED terms [term_start, term_end] overlap (touching endpoints count as overlapping)."
      - name: two_way_promoted
        type: boolean
        source: computed
        description: "For TWO_WAY contracts: false until promoted, then the contract counts toward the cap. Always false for STANDARD."
        default: false
      - name: status
        type: enum
        source: computed
        description: "Contract lifecycle; see Contract state machine. A traded contract stays ACTIVE under its new team — there is no separate TRADED status."
        constraints: "one of {ACTIVE, WAIVED}; initialized ACTIVE"
        default: ACTIVE

  - name: Stint
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; the TWO_WAY contract this call-up stint is logged against. Contract must be ACTIVE and contract_type == TWO_WAY."
      - name: player_id
        type: string
        source: computed
        description: "FK -> Player.id; denormalized from the contract's player_id at stint creation; the player called up for this stint."
      - name: starts_at
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the call-up stint (inclusive)."
      - name: ends_at
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the call-up stint (exclusive). Must be > starts_at. For a given player, two stints may NOT overlap on the HALF-OPEN interval [starts_at, ends_at); back-to-back stints where one's ends_at == the next's starts_at are allowed (adjacency permitted)."

  - name: Trade
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season whose trade window governs this trade."
      - name: from_team_id
        type: string
        source: input
        description: "FK -> Team.id; the proposing team that sends contract_ids_out."
      - name: to_team_id
        type: string
        source: input
        description: "FK -> Team.id; the counterparty team that sends contract_ids_in and must accept."
      - name: contract_ids_out
        type: array
        source: input
        description: "Contract ids leaving from_team (each must be an ACTIVE contract on from_team). May be empty only if contract_ids_in is non-empty."
      - name: contract_ids_in
        type: array
        source: input
        description: "Contract ids leaving to_team (each must be an ACTIVE contract on to_team). May be empty only if contract_ids_out is non-empty."
      - name: status
        type: enum
        source: computed
        description: "Negotiation state; see Trade state machine."
        constraints: "one of {PROPOSED, ACCEPTED, REJECTED, WITHDRAWN}; initialized PROPOSED"
        default: PROPOSED

  - name: Fine
    parent: null
    common_fields: true
    fields:
      - name: team_id
        type: string
        source: input
        description: "FK -> Team.id; the team charged the fine (and whose penalty_points the points accrue to)."
      - name: player_id
        type: string
        source: input
        description: "FK -> Player.id; the player the fine is attributed to. Must be SIGNED to a contract on team_id."
      - name: amount_cents
        type: integer
        source: input
        description: "Monetary fine in cents. Must be > 0."
        constraints: ">= 1"
      - name: penalty_points
        type: integer
        source: input
        description: "Penalty points this fine adds to the team's cumulative total when ASSESSED. Must be >= 1."
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: "ASSESSED on creation; WAIVED reverses the points; see Fine state machine."
        constraints: "one of {ASSESSED, WAIVED}; initialized ASSESSED"
        default: ASSESSED

  - name: Sponsorship
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season this sponsorship pool funds."
      - name: sponsor_name
        type: string
        source: input
        description: "Sponsor brand name."
      - name: pool_cents
        type: integer
        source: input
        description: "Total sponsorship revenue pool in cents to be shared. Must be > 0."
        constraints: ">= 1"
      - name: league_share_pct
        type: number
        source: input
        description: "Fraction the league retains off the top before the team waterfall. 0 <= x < 1."
        default: 0.40
        constraints: ">= 0 and < 1"
      - name: status
        type: enum
        source: computed
        description: "PENDING until distributed; DISTRIBUTED after the payout runs; see Sponsorship state machine."
        constraints: "one of {PENDING, DISTRIBUTED}; initialized PENDING"
        default: PENDING

  - name: RevenueShare
    parent: Sponsorship
    common_fields: false
    fields:
      - name: sponsorship_id
        type: string
        source: input
        description: "FK -> Sponsorship.id; the pool this share was carved from."
      - name: team_id
        type: string
        source: input
        description: "FK -> Team.id; the team receiving this share."
      - name: amount_cents
        type: integer
        source: computed
        description: "Cents allocated to this team by the revenue waterfall at distribution time."
      - name: weight_used
        type: integer
        source: computed
        description: "The team's market_size_weight snapshotted at distribution time, for audit."

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Season
    initial_state: SETUP
    terminal_states: [COMPLETE]
    transitions:
      - from: SETUP
        to: REGULAR
        trigger: "POST /seasons/{id}/start-regular"
        actor: LeagueCommissioner
        preconditions:
          - "season.phase == SETUP"
        side_effects:
          - "sets phase = REGULAR"
          - "increments Season.version by 1"
      - from: REGULAR
        to: PLAYOFFS
        trigger: "POST /seasons/{id}/start-playoffs"
        actor: LeagueCommissioner
        preconditions:
          - "season.phase == REGULAR"
          - "season.trade_window_state == CLOSED"
          - "every Team in this season has >= season.roster_min ACTIVE STANDARD contracts (playoff eligibility)"
        side_effects:
          - "sets phase = PLAYOFFS"
          - "assigns Team.seed to every team in this season: rank by penalty_points ascending, then payroll_active_cents descending, then created_at ascending; seed = 1-based rank"
          - "sets Team.eliminated = false for every team"
          - "increments Season.version by 1"
      - from: PLAYOFFS
        to: COMPLETE
        trigger: "POST /seasons/{id}/complete"
        actor: LeagueCommissioner
        preconditions:
          - "season.phase == PLAYOFFS"
          - "exactly one Team in this season has eliminated == false (a single champion remains)"
        side_effects:
          - "sets phase = COMPLETE"
          - "increments Season.version by 1"
      - from: REGULAR
        to: REGULAR
        trigger: "POST /seasons/{id}/trade-window"
        actor: LeagueCommissioner
        preconditions:
          - "season.phase == REGULAR"
        side_effects:
          - "sets trade_window_state to the requested value (OPEN or CLOSED)"
          - "increments Season.version by 1"
        note: "Self-loop toggling the trade window; only valid during REGULAR."

  - entity: Trade
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /trades/{id}/accept"
        actor: TeamGM
        preconditions:
          - "trade.status == PROPOSED"
          - "acting TeamGM owns to_team_id (X-User-ID == to_team_id)"
          - "season.trade_window_state == OPEN"
          - "from_team.posture == OPEN and to_team.posture == OPEN"
          - "every contract in contract_ids_out is still ACTIVE and still on from_team"
          - "every contract in contract_ids_in is still ACTIVE and still on to_team"
          - "post-trade each team's ACTIVE STANDARD count <= season.roster_max and ACTIVE TWO_WAY count <= season.two_way_max (roster_min is only enforced at start-playoffs, not on trades)"
          - "post-trade neither team's recomputed payroll_active_cents would be rejected (cap is soft; luxury tax applies, no hard rejection)"
        side_effects:
          - "reassigns each contract_ids_out contract.team_id = to_team_id; each contract_ids_in contract.team_id = from_team_id (contracts stay ACTIVE)"
          - "recomputes from_team.payroll_active_cents and to_team.payroll_active_cents (active_payroll calc)"
          - "increments from_team.version by 1 and to_team.version by 1"
          - "sets trade.status = ACCEPTED"
          - "increments Trade.version by 1"
        note: "Branch A of the PROPOSED fork — divergent side-effects (contract reassignment + payroll recompute) versus the REJECTED/WITHDRAWN branches."
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /trades/{id}/reject"
        actor: TeamGM
        preconditions:
          - "trade.status == PROPOSED"
          - "acting TeamGM owns to_team_id (X-User-ID == to_team_id)"
        side_effects:
          - "sets trade.status = REJECTED"
          - "no contract reassignment; no payroll change"
          - "increments Trade.version by 1"
        note: "Branch B of the fork — counterparty declines."
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /trades/{id}/withdraw"
        actor: TeamGM
        preconditions:
          - "trade.status == PROPOSED"
          - "acting TeamGM owns from_team_id (X-User-ID == from_team_id)"
        side_effects:
          - "sets trade.status = WITHDRAWN"
          - "no contract reassignment; no payroll change"
          - "increments Trade.version by 1"
        note: "Branch C of the fork — proposer retracts."

  - entity: Contract
    initial_state: ACTIVE
    terminal_states: [WAIVED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "system: trade acceptance reassigns this contract's team_id"
        actor: system
        preconditions:
          - "parent Trade transitions PROPOSED -> ACCEPTED and this contract is in the moving set"
        side_effects:
          - "contract.team_id reassigned to the counterparty team (status remains ACTIVE)"
        note: "A traded contract is re-homed but stays ACTIVE; no status change. Acceptance does NOT waive."
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /contracts/{id}/promote"
        actor: TeamGM
        preconditions:
          - "contract.status == ACTIVE"
          - "contract.contract_type == TWO_WAY"
          - "contract.two_way_promoted == false"
          - "acting TeamGM owns contract.team_id"
          - "team.posture == OPEN"
          - "post-promotion ACTIVE STANDARD count (treating this contract as STANDARD-counting) <= season.roster_max"
        side_effects:
          - "sets two_way_promoted = true (contract now counts toward cap)"
          - "recomputes team.payroll_active_cents (active_payroll calc) — this contract's base_salary now included"
          - "increments Contract.version by 1 and team.version by 1"
        note: "Self-loop: two-way exemption ends, cap charge begins."
      - from: ACTIVE
        to: WAIVED
        trigger: "POST /contracts/{id}/waive"
        actor: TeamGM
        preconditions:
          - "contract.status == ACTIVE"
          - "acting TeamGM owns contract.team_id"
          - "team.posture == OPEN"
        side_effects:
          - "sets contract.status = WAIVED"
          - "if no other ACTIVE contract references contract.player_id, sets that Player.status = FREE_AGENT (cross-entity, depth-2 link below)"
          - "recomputes team.payroll_active_cents (active_payroll calc)"
          - "increments Contract.version by 1 and team.version by 1"

  - entity: Player
    initial_state: FREE_AGENT
    terminal_states: []
    transitions:
      - from: FREE_AGENT
        to: SIGNED
        trigger: "POST /contracts (creates an ACTIVE contract for this player)"
        actor: TeamGM
        preconditions:
          - "player.status == FREE_AGENT"
          - "player has no other ACTIVE contract"
        side_effects:
          - "sets player.status = SIGNED"
      - from: SIGNED
        to: FREE_AGENT
        trigger: "system: last ACTIVE contract for this player becomes WAIVED"
        actor: system
        preconditions:
          - "no remaining ACTIVE contract references this player after a waive"
        side_effects:
          - "sets player.status = FREE_AGENT"

  - entity: Team
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system: Fine assessment pushes penalty_points to >= season.penalty_threshold"
        actor: system
        preconditions:
          - "team.posture == OPEN"
          - "team.penalty_points (after the assessing fine is applied) >= season.penalty_threshold"
        side_effects:
          - "sets team.posture = RESTRICTED (blocks trade accept, contract waive, contract promote for this team)"
          - "increments team.version by 1"
        note: "Rate-threshold trigger; posture gate cascades to roster operations."
      - from: RESTRICTED
        to: OPEN
        trigger: "system: Fine waive drops penalty_points below season.penalty_threshold"
        actor: system
        preconditions:
          - "team.posture == RESTRICTED"
          - "team.penalty_points (after the waive reverses points) < season.penalty_threshold"
        side_effects:
          - "sets team.posture = OPEN"
          - "increments team.version by 1"

  - entity: Sponsorship
    initial_state: PENDING
    terminal_states: [DISTRIBUTED]
    transitions:
      - from: PENDING
        to: DISTRIBUTED
        trigger: "POST /sponsorships/{id}/distribute"
        actor: LeagueCommissioner
        preconditions:
          - "sponsorship.status == PENDING"
          - "the season has >= 1 Team"
        side_effects:
          - "runs the revenue_waterfall calc and creates one RevenueShare per team in the season"
          - "sets sponsorship.status = DISTRIBUTED"
          - "increments Sponsorship.version by 1"

  - entity: Fine
    initial_state: ASSESSED
    terminal_states: [WAIVED]
    transitions:
      - from: ASSESSED
        to: WAIVED
        trigger: "POST /fines/{id}/waive"
        actor: LeagueCommissioner
        preconditions:
          - "fine.status == ASSESSED"
        side_effects:
          - "sets fine.status = WAIVED"
          - "subtracts fine.penalty_points from team.penalty_points (cross-entity, depth >= 2: may flip Team RESTRICTED -> OPEN)"
          - "increments Fine.version by 1 and team.version by 1"

# ---------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------
concurrency_rules:
  - rule_id: trade-accept-stale-to-team
    parent_entity: Team
    write_endpoint: "POST /trades/{id}/accept"
    occ_field: "expected_to_team_version"
    description: |
      Accepting a Trade carries the to_team version the GM last observed.
      If another roster mutation (a different accepted trade, a waive, a
      promotion) has advanced to_team.version since the GM read it, the
      accept is rejected as stale. This is a true CREATE-with-supersede
      style write: a second sequential accept that still carries the old
      version sees a counterparty roster that has shifted underneath it,
      so its cap/roster math is computed against a stale view.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: distribute-stale-sponsorship
    parent_entity: Sponsorship
    write_endpoint: "POST /sponsorships/{id}/distribute"
    occ_field: "expected_sponsorship_version"
    description: |
      Distributing a Sponsorship carries the sponsorship version the
      commissioner last observed. If the sponsorship's pool or league
      share was edited (its version advanced) after the commissioner read
      it, the distribute is rejected as stale so the payout is never
      computed against an out-of-date pool.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: active_payroll
    trigger: "On contract create (sign), waive, promote, and on trade acceptance — recompute the affected team(s)."
    algorithm: aggregation
    formula: |
      payroll_active_cents(team) =
        sum( c.base_salary_cents
             for c in Contract
             where c.team_id == team.id
               and c.status == ACTIVE
               and cap_counts(c) == true )
      where cap_counts(c) =
        (c.contract_type == STANDARD) OR
        (c.contract_type == TWO_WAY AND c.two_way_promoted == true)
    input_set: "ACTIVE contracts on the team; STANDARD always counted, TWO_WAY counted only when two_way_promoted == true. WAIVED contracts excluded."
    precision: "integer cents; no rounding"
    variants:
      - name: cap_standard
        when: "default — used to report the cap-counting payroll for luxury tax."
        difference: "Includes promoted two-way contracts; excludes unpromoted two-way."
      - name: full_roster_commitment
        when: "Reported via GET /teams/{id}/payroll as full_commitment_cents for transparency."
        difference: "Sums base_salary_cents over ALL ACTIVE contracts regardless of type/promotion — unpromoted two-way salaries ARE included. Diverges from cap_standard exactly by the sum of unpromoted two-way salaries."

  - name: luxury_tax
    trigger: "Computed on demand via GET /teams/{id}/payroll; reflects current payroll_active_cents vs season.salary_cap_cents."
    algorithm: tiered_pricing
    formula: |
      overage = max(0, team.payroll_active_cents - season.salary_cap_cents)
      tier1 = min(overage, TIER_WIDTH)                          # rate 1.5
      tier2 = min(max(overage - TIER_WIDTH, 0), TIER_WIDTH)      # rate 2.0
      tier3 = max(overage - 2*TIER_WIDTH, 0)                     # rate 2.5
      tax_cents = round_half_up( tier1*1.5 + tier2*2.0 + tier3*2.5 )
      # marginal tiering: each cent of overage taxed at its own tier rate.
    input_set: "Single team's payroll_active_cents and its season.salary_cap_cents."
    constants:
      TIER_WIDTH: 5000000
      RATE_TIER_1: 1.5
      RATE_TIER_2: 2.0
      RATE_TIER_3: 2.5
    precision: "round_half_up to integer cents at the END (sum-then-round; do NOT round per tier)"
    variants:
      - name: marginal
        when: "always — the pinned interpretation."
        difference: "Marginal (each tier's slice taxed at its own rate), NOT a single flat rate on the whole overage chosen by the top tier reached."

  - name: revenue_waterfall
    trigger: "On POST /sponsorships/{id}/distribute (PENDING -> DISTRIBUTED)."
    algorithm: waterfall_allocation
    formula: |
      league_cut   = round_half_up( pool_cents * league_share_pct )
      distributable = pool_cents - league_cut
      total_weight = sum( t.market_size_weight for t in teams_in_season )   # all teams, no status filter
      # provisional floor share, then distribute the rounding remainder:
      for t in teams_in_season:
        raw[t]     = distributable * t.market_size_weight / total_weight
        share[t]   = floor(raw[t])
      remainder = distributable - sum(share[t])
      # award 1 cent at a time, ordering teams by market_size_weight DESC,
      # tie-break created_at ASC, until remainder exhausted:
      order = sort(teams_in_season, key=(market_size_weight DESC, created_at ASC))
      i = 0
      while remainder > 0:
        share[ order[i % len(order)] ] += 1
        remainder -= 1
        i += 1
    input_set: "Every Team whose season_id == sponsorship.season_id (no posture/status filter — eliminated and RESTRICTED teams still share)."
    constants: {}
    precision: "floor per team, then award remainder cents one at a time by the pinned order; final shares sum EXACTLY to distributable"
    variants:
      - name: league_first
        when: "always — the pinned evaluation order."
        difference: "League cut is taken FIRST off the gross pool; the team waterfall divides only the post-cut distributable. NOT: split gross then deduct league share per team."

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 (e.g. only LeagueCommissioner assesses fines; only TeamGM proposes trades)."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Every path/body-referenced resource exists, validated left-to-right (season, team, player, contract, trade, fine, sponsorship)."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: business_referential
    check: "Ownership: a TeamGM may only mutate resources belonging to the team whose id equals X-User-ID (own contracts, own-side of a trade)."
    error_id: ERR_NOT_TEAM_OWNER
    http_status: 403
    applies_to: "contract waive/promote, trade accept (to_team), trade withdraw (from_team), POST /contracts, POST /trades, POST /stints (own-team contract)"
  - priority: 5
    category: state
    check: "Target resource is in a state from which this transition is legal (e.g. trade.status == PROPOSED to accept; contract.status == ACTIVE to waive; sponsorship.status == PENDING to distribute)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version on cap-consuming writes (trade accept, sponsorship distribute)."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /trades/{id}/accept, POST /sponsorships/{id}/distribute"
  - priority: 7
    category: business_temporal
    check: "Trade window is OPEN for the season on trade accept; trade creation also requires an OPEN window."
    error_id: ERR_TRADE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /trades, POST /trades/{id}/accept"
  - priority: 8
    category: business_safety
    check: "Neither team involved is RESTRICTED (posture gate) on trade accept, contract waive, and contract promote."
    error_id: ERR_TEAM_RESTRICTED
    http_status: 409
    applies_to: "POST /trades/{id}/accept, POST /contracts/{id}/waive, POST /contracts/{id}/promote"
  - priority: 9
    category: business_constraint
    check: "Player uniqueness: cannot sign a player who already holds an ACTIVE contract; handle unique within season; team name unique within season."
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /contracts, POST /teams, POST /players"
  - priority: 10
    category: business_constraint
    check: "Contract membership for trades: every id in contract_ids_out is ACTIVE on from_team; every id in contract_ids_in is ACTIVE on to_team; the two id lists are not both empty."
    error_id: ERR_INVALID_TRADE_ASSETS
    http_status: 422
    applies_to: "POST /trades, POST /trades/{id}/accept"
  - priority: 11
    category: business_constraint
    check: "Roster limits after a roster-adding move: ACTIVE STANDARD (incl. promoted two-way) count <= season.roster_max; ACTIVE TWO_WAY (unpromoted) count <= season.two_way_max."
    error_id: ERR_ROSTER_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /contracts, POST /contracts/{id}/promote, POST /trades/{id}/accept"
  - priority: 12
    category: business_constraint
    check: "Playoff eligibility: starting playoffs requires every team to carry >= season.roster_min ACTIVE STANDARD contracts; completing requires exactly one non-eliminated team."
    error_id: ERR_PLAYOFF_PRECONDITION
    http_status: 409
    applies_to: "POST /seasons/{id}/start-playoffs, POST /seasons/{id}/complete"
  - priority: 13
    category: business_constraint
    check: "Required-field presence and well-formedness: every required input field present; pagination limit/offset within bounds; body is valid JSON."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all create and list endpoints"
  - priority: 14
    category: business_constraint
    check: "Field-value validity: salary/amount/pool > 0; league_share_pct in [0,1); contract_type and enum values valid; market_size_weight >= 1; term_end >= term_start; ends_at > starts_at."
    error_id: ERR_INVALID_FIELD_VALUE
    http_status: 422
    applies_to: "all create endpoints"
  - priority: 15
    category: business_temporal
    check: "Contract-term overlap: the new contract's CLOSED term [term_start, term_end] must not overlap any existing ACTIVE contract for the same player_id; touching endpoints (a.term_end == b.term_start) DO count as overlap."
    error_id: ERR_CONTRACT_TERM_OVERLAP
    http_status: 409
    applies_to: "POST /contracts"
  - priority: 16
    category: business_temporal
    check: "Stint overlap: the new stint's HALF-OPEN interval [starts_at, ends_at) must not overlap any existing stint for the same player_id; adjacency (existing.ends_at == new.starts_at, or new.ends_at == existing.starts_at) is ALLOWED."
    error_id: ERR_STINT_OVERLAP
    http_status: 409
    applies_to: "POST /stints"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Season ----
  - method: POST
    path: "/seasons"
    description: "Create a season in SETUP."
    roles: [LeagueCommissioner]
    code: 201
    input: [name, salary_cap_cents, "roster_min?", "roster_max?", "two_way_max?", "penalty_threshold?"]
    output: Season
    side_effects: ["phase = SETUP", "trade_window_state = CLOSED"]
  - method: GET
    path: "/seasons/{id}"
    description: "Fetch a season."
    roles: [LeagueCommissioner, TeamGM]
    code: 200
    input: []
    output: Season
    side_effects: []
  - method: POST
    path: "/seasons/{id}/start-regular"
    description: "SETUP -> REGULAR."
    roles: [LeagueCommissioner]
    code: 200
    input: []
    output: Season
    side_effects: ["phase = REGULAR", "increments Season.version by 1"]
  - method: POST
    path: "/seasons/{id}/trade-window"
    description: "Open or close the trade window (REGULAR only)."
    roles: [LeagueCommissioner]
    code: 200
    input: [trade_window_state]
    output: Season
    side_effects: ["sets trade_window_state", "increments Season.version by 1"]
  - method: POST
    path: "/seasons/{id}/start-playoffs"
    description: "REGULAR -> PLAYOFFS; assigns seeds."
    roles: [LeagueCommissioner]
    code: 200
    input: []
    output: Season
    side_effects: ["phase = PLAYOFFS", "assigns Team.seed for all teams", "sets eliminated = false", "increments Season.version by 1"]
  - method: POST
    path: "/seasons/{id}/complete"
    description: "PLAYOFFS -> COMPLETE (one champion left)."
    roles: [LeagueCommissioner]
    code: 200
    input: []
    output: Season
    side_effects: ["phase = COMPLETE", "increments Season.version by 1"]

  # ---- Team ----
  - method: POST
    path: "/teams"
    description: "Create a team in a season (posture OPEN)."
    roles: [LeagueCommissioner]
    code: 201
    input: [season_id, name, market_size_weight]
    output: Team
    side_effects: ["payroll_active_cents = 0", "penalty_points = 0", "posture = OPEN"]
  - method: GET
    path: "/teams/{id}"
    description: "Fetch a team."
    roles: [LeagueCommissioner, TeamGM]
    code: 200
    input: []
    output: Team
    side_effects: []
  - method: GET
    path: "/teams"
    description: "List teams; filter by season_id."
    roles: [LeagueCommissioner, TeamGM]
    code: 200
    input: ["season_id?", "limit?", "offset?"]
    output: Team[]
    side_effects: []
  - method: GET
    path: "/teams/{id}/payroll"
    description: "Computed read: cap-counting payroll, full-roster commitment, and luxury tax."
    roles: [LeagueCommissioner, TeamGM]
    code: 200
    input: []
    output: "{ payroll_active_cents: integer, full_commitment_cents: integer, salary_cap_cents: integer, luxury_tax_cents: integer }"
    side_effects: []
  - method: GET
    path: "/teams/{id}/contracts"
    description: "Reverse-reachability: contracts whose team_id == this team."
    roles: [LeagueCommissioner, TeamGM]
    code: 200
    input: ["status?"]
    output: Contract[]
    side_effects: []
  - method: GET
    path: "/teams/{id}/fines"
    description: "Reverse-reachability: fines whose team_id == this team."
    roles: [LeagueCommissioner, TeamGM]
    code: 200
    input: []
    output: Fine[]
    side_effects: []
  - method: GET
    path: "/teams/{id}/revenue-shares"
    description: "Reverse-reachability: revenue shares whose team_id == this team."
    roles: [LeagueCommissioner, TeamGM]
    code: 200
    input: []
    output: RevenueShare[]
    side_effects: []
  - method: POST
    path: "/teams/{id}/eliminate"
    description: "Mark a team eliminated from the playoffs (loses a series)."
    roles: [LeagueCommissioner]
    code: 200
    input: []
    output: Team
    side_effects: ["sets eliminated = true", "increments Team.version by 1"]

  # ---- Player ----
  - method: POST
    path: "/players"
    description: "Register a free-agent player in a season."
    roles: [LeagueCommissioner]
    code: 201
    input: [season_id, handle]
    output: Player
    side_effects: ["status = FREE_AGENT"]
  - method: GET
    path: "/players/{id}"
    description: "Fetch a player."
    roles: [LeagueCommissioner, TeamGM]
    code: 200
    input: []
    output: Player
    side_effects: []
  - method: GET
    path: "/players"
    description: "List players; filter by season_id."
    roles: [LeagueCommissioner, TeamGM]
    code: 200
    input: ["season_id?", "limit?", "offset?"]
    output: Player[]
    side_effects: []

  # ---- Contract ----
  - method: POST
    path: "/contracts"
    description: "Sign a free agent to a team (ACTIVE). Two-way is cap-exempt until promoted."
    roles: [TeamGM]
    code: 201
    input: [team_id, player_id, base_salary_cents, contract_type, term_start, term_end]
    output: Contract
    side_effects: ["status = ACTIVE", "player.status = SIGNED", "recompute team.payroll_active_cents", "increments team.version by 1"]
  - method: GET
    path: "/contracts/{id}"
    description: "Fetch a contract."
    roles: [LeagueCommissioner, TeamGM]
    code: 200
    input: []
    output: Contract
    side_effects: []
  - method: GET
    path: "/contracts"
    description: "List contracts; filter by team_id or player_id."
    roles: [LeagueCommissioner, TeamGM]
    code: 200
    input: ["team_id?", "player_id?", "status?", "limit?", "offset?"]
    output: Contract[]
    side_effects: []
  - method: POST
    path: "/contracts/{id}/promote"
    description: "Promote a TWO_WAY contract so it counts toward the cap."
    roles: [TeamGM]
    code: 200
    input: [expected_team_version]
    output: Contract
    side_effects: ["two_way_promoted = true", "recompute team.payroll_active_cents", "increments Contract.version and team.version by 1"]
  - method: POST
    path: "/contracts/{id}/waive"
    description: "Waive a contract (ACTIVE -> WAIVED); may free the player."
    roles: [TeamGM]
    code: 200
    input: [expected_team_version]
    output: Contract
    side_effects: ["status = WAIVED", "maybe player.status = FREE_AGENT", "recompute team.payroll_active_cents", "increments Contract.version and team.version by 1"]

  # ---- Stint (two-way call-up periods) ----
  - method: POST
    path: "/stints"
    description: "Log a two-way call-up stint against a contract; rejected if it overlaps an existing stint for the same player."
    roles: [TeamGM]
    code: 201
    input: [contract_id, starts_at, ends_at]
    output: Stint
    side_effects: []
  - method: GET
    path: "/stints/{id}"
    description: "Fetch a stint."
    roles: [LeagueCommissioner, TeamGM]
    code: 200
    input: []
    output: Stint
    side_effects: []
  - method: GET
    path: "/stints"
    description: "List stints; filter by contract_id or player_id."
    roles: [LeagueCommissioner, TeamGM]
    code: 200
    input: ["contract_id?", "player_id?", "limit?", "offset?"]
    output: Stint[]
    side_effects: []

  # ---- Trade ----
  - method: POST
    path: "/trades"
    description: "Propose a trade between two teams (PROPOSED). Window must be OPEN."
    roles: [TeamGM]
    code: 201
    input: [season_id, from_team_id, to_team_id, contract_ids_out, contract_ids_in]
    output: Trade
    side_effects: ["status = PROPOSED"]
  - method: GET
    path: "/trades/{id}"
    description: "Fetch a trade."
    roles: [LeagueCommissioner, TeamGM]
    code: 200
    input: []
    output: Trade
    side_effects: []
  - method: GET
    path: "/trades"
    description: "List trades; filter by season_id, from_team_id, or to_team_id."
    roles: [LeagueCommissioner, TeamGM]
    code: 200
    input: ["season_id?", "from_team_id?", "to_team_id?", "status?", "limit?", "offset?"]
    output: Trade[]
    side_effects: []
  - method: POST
    path: "/trades/{id}/accept"
    description: "Counterparty accepts (PROPOSED -> ACCEPTED); reassigns contracts, recomputes payroll."
    roles: [TeamGM]
    code: 200
    input: [expected_to_team_version]
    output: Trade
    side_effects: ["reassign contracts", "recompute both teams' payroll", "increments both teams' version by 1", "status = ACCEPTED", "increments Trade.version by 1"]
  - method: POST
    path: "/trades/{id}/reject"
    description: "Counterparty rejects (PROPOSED -> REJECTED)."
    roles: [TeamGM]
    code: 200
    input: []
    output: Trade
    side_effects: ["status = REJECTED", "increments Trade.version by 1"]
  - method: POST
    path: "/trades/{id}/withdraw"
    description: "Proposer withdraws (PROPOSED -> WITHDRAWN)."
    roles: [TeamGM]
    code: 200
    input: []
    output: Trade
    side_effects: ["status = WITHDRAWN", "increments Trade.version by 1"]

  # ---- Fine ----
  - method: POST
    path: "/fines"
    description: "Assess a fine against a team/player (ASSESSED); accrues penalty points; may flip team RESTRICTED."
    roles: [LeagueCommissioner]
    code: 201
    input: [team_id, player_id, amount_cents, penalty_points]
    output: Fine
    side_effects: ["status = ASSESSED", "team.penalty_points += penalty_points", "maybe team.posture = RESTRICTED", "increments team.version by 1"]
  - method: GET
    path: "/fines/{id}"
    description: "Fetch a fine."
    roles: [LeagueCommissioner, TeamGM]
    code: 200
    input: []
    output: Fine
    side_effects: []
  - method: GET
    path: "/fines"
    description: "List fines; filter by team_id or player_id."
    roles: [LeagueCommissioner, TeamGM]
    code: 200
    input: ["team_id?", "player_id?", "limit?", "offset?"]
    output: Fine[]
    side_effects: []
  - method: POST
    path: "/fines/{id}/waive"
    description: "Waive a fine (ASSESSED -> WAIVED); reverses penalty points; may flip team OPEN."
    roles: [LeagueCommissioner]
    code: 200
    input: []
    output: Fine
    side_effects: ["status = WAIVED", "team.penalty_points -= penalty_points", "maybe team.posture = OPEN", "increments team.version by 1"]

  # ---- Sponsorship ----
  - method: POST
    path: "/sponsorships"
    description: "Create a sponsorship pool (PENDING)."
    roles: [LeagueCommissioner]
    code: 201
    input: [season_id, sponsor_name, pool_cents, "league_share_pct?"]
    output: Sponsorship
    side_effects: ["status = PENDING"]
  - method: GET
    path: "/sponsorships/{id}"
    description: "Fetch a sponsorship."
    roles: [LeagueCommissioner, TeamGM]
    code: 200
    input: []
    output: Sponsorship
    side_effects: []
  - method: GET
    path: "/sponsorships"
    description: "List sponsorships; filter by season_id."
    roles: [LeagueCommissioner, TeamGM]
    code: 200
    input: ["season_id?", "limit?", "offset?"]
    output: Sponsorship[]
    side_effects: []
  - method: GET
    path: "/sponsorships/{id}/revenue-shares"
    description: "Reverse-reachability: shares carved from this sponsorship."
    roles: [LeagueCommissioner, TeamGM]
    code: 200
    input: []
    output: RevenueShare[]
    side_effects: []
  - method: POST
    path: "/sponsorships/{id}/distribute"
    description: "Distribute the pool across all season teams (PENDING -> DISTRIBUTED)."
    roles: [LeagueCommissioner]
    code: 200
    input: [expected_sponsorship_version]
    output: Sponsorship
    side_effects: ["creates one RevenueShare per team (revenue_waterfall)", "status = DISTRIBUTED", "increments Sponsorship.version by 1"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers, or unknown role."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Authenticated role not permitted for this operation."
  - id: ERR_NOT_TEAM_OWNER
    http: 403
    condition: "TeamGM acting on a team other than the one whose id == X-User-ID."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a legal state for the requested transition."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version (OCC)."
  - id: ERR_TRADE_WINDOW_CLOSED
    http: 409
    condition: "Trade create/accept attempted while season.trade_window_state == CLOSED."
  - id: ERR_TEAM_RESTRICTED
    http: 409
    condition: "Roster mutation attempted while an involved team's posture == RESTRICTED."
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "Signing a player who already has an ACTIVE contract, or duplicate team/player name within a season."
  - id: ERR_INVALID_TRADE_ASSETS
    http: 422
    condition: "A traded contract is not ACTIVE / not on the expected team, or both id lists empty."
  - id: ERR_ROSTER_LIMIT_EXCEEDED
    http: 409
    condition: "A move would push ACTIVE STANDARD count above roster_max or ACTIVE TWO_WAY count above two_way_max."
  - id: ERR_PLAYOFF_PRECONDITION
    http: 409
    condition: "start-playoffs with a team below roster_min, or complete without exactly one non-eliminated team."
  - id: ERR_INVALID_FIELD_VALUE
    http: 422
    condition: "Out-of-range/invalid field value (non-positive amount, league_share_pct outside [0,1), bad enum, weight < 1)."
  - id: ERR_CONTRACT_TERM_OVERLAP
    http: 409
    condition: "New contract's closed term overlaps (or touches) an existing ACTIVE contract for the same player."
  - id: ERR_STINT_OVERLAP
    http: 409
    condition: "New stint's half-open interval overlaps an existing stint for the same player (adjacency allowed)."
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing required field or malformed request body / pagination params."

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: LeagueCommissioner
    description: "League operator: manages seasons, teams, players, trade windows, fines, sponsorships, playoffs."
    identity: opaque
    exclusive_operations:
      - "POST /seasons and all /seasons/{id}/* lifecycle transitions"
      - "POST /teams, POST /players"
      - "POST /fines, POST /fines/{id}/waive"
      - "POST /sponsorships, POST /sponsorships/{id}/distribute"
      - "POST /teams/{id}/eliminate"
    shared_operations:
      - "all GET reads"
  - name: TeamGM
    description: "General manager acting for a single team; X-User-ID is the team id they manage."
    identity: "entity_backed:Team"
    exclusive_operations:
      - "POST /contracts (sign), POST /contracts/{id}/promote, POST /contracts/{id}/waive (own team only)"
      - "POST /stints (log a call-up against an own-team TWO_WAY contract)"
      - "POST /trades (own team as from_team), POST /trades/{id}/accept (own team as to_team), POST /trades/{id}/withdraw (own team as from_team), POST /trades/{id}/reject (own team as to_team)"
    shared_operations:
      - "all GET reads"
