  - rule_id: cross_entity_state_dependency
    instances:
      - name: pool_calculate_gated_by_sibling_batch_state
        grounds:
          - validations.priority_14
          - state_machines.AccountingPeriod.OPEN_to_USAGE_SEALED
          - state_machines.RoyaltyPool.DRAFT_to_CALCULATED
          - errors.ERR_INVALID_PERIOD_STATE
        distinguishing_aspect: |
          Whether a pool may be calculated depends on the state of a UsageBatch the pool does not
          reference, two hops away: an OPEN sibling batch keeps the parent period out of
          USAGE_SEALED, and the pool's own status (DRAFT) plus its own fields are all perfectly
          valid — the identical call succeeds the moment the unrelated sibling finishes matching.
        test_recipe:
          setup:
            - "One EFFECTIVE GB/INDIVIDUAL schedule; period 2026-06; one catalogue recording."
            - "Batch A with one GB/INDIVIDUAL line of 300000 plays, sealed and matched by exact ISRC."
            - "Batch B with one GB/INDIVIDUAL line of 150000 plays, left OPEN — so the period cannot bubble to USAGE_SEALED."
