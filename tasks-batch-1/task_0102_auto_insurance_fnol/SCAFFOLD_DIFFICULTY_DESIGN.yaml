            - call: "POST /adjusters"
              payload: { full_name: "Adj One", license_tier: "STANDARD" }
              as: ClaimsSupervisor
              captures: { adj1: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol}", loss_datetime: "2026-06-01T00:00:00.000Z", loss_type: "COLLISION", vehicle_acv_cents: 2000000, insured_fault_pct: 0 }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { claim: $.data.id }
            - call: "POST /claim-parties"
              payload: { claim_id: "${claim}", party_role: "THIRD_PARTY", display_name: "Other Driver", fault_pct: 100, at_fault_carrier_name: "Rival Mutual" }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { party: $.data.id }
            - call: "POST /claims/${claim}/verify-coverage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { c_v1: $.data.version }
            - call: "POST /claims/${claim}/assign-adjuster"
              payload: { adjuster_id: "${adj1}", expected_claim_version: "${c_v1}" }
