      - name: underwriting_tier_unmet_when_the_provisional_payment_pushes_dti_over_the_ceiling
        claim_type: violation_to_error
        grounds:
          - validations[priority=61]
          - errors.ERR_UNDERWRITING_TIER_UNMET
          - calculations.loan_pricing_and_grade
        distinguishing_aspect: |
          The dti ceiling is applied to the dti computed FROM the provisional payment, so income
          200,000 with debt 100,000 on a 1,000,000-cent, 60-month, 900-bps loan yields
          (100,000 + 24,167) / 200,000 = 62.08 and is rejected 422 even though the borrower's
          bare debt ratio (50.00) would pass. Nothing is persisted: dti_pct stays null.
        test_recipe:
          setup:
            - "One institution with the standard product (max_dti_pct 50.00) and one GEOCODED borrower with credit score 740."
