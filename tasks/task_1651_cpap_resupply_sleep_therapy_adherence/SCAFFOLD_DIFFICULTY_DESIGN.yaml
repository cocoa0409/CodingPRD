              payload: {}
              as: RespiratoryTherapist
            - call: "POST /sleep-therapy/device-enrollments/${de12}/complete-setup"
              payload: {}
              as: RespiratoryTherapist
            - call: "GET /sleep-therapy/component-supply-plans"
              payload: { patient_id: "${pat12}", component_type: "CUSHION" }
              as: OpsAdmin
              captures: { cush12: "$.data[0].id" }
            - call: "GET /sleep-therapy/patients/${pat12}"
              payload: {}
              as: OpsAdmin
