--- # ============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 rule_ids, 19 instances. Every `grounds:` entry resolves into
# SCAFFOLD.yaml §1.1-§1.7; every numeric assert is a literal computed against the
# §1.3 formulas and their constants. The default logical clock is
# 2026-08-01T00:00:00Z and every recipe pins it explicitly.
# ============================================================================

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: dual_variant_attribution_credit_share_on_conversion
        grounds:
          - calculations.attribution_resolution
          - calculations.commission_policy_selection
          - entities.AttributionDecision.fields.algorithm_variant
          - entities.AttributionDecision.fields.selected
          - entities.Conversion.fields.gross_commission_cents
          - entities.Conversion.fields.payable_commission_cents
          - state_machines.Conversion.UNATTRIBUTED_to_CREDIT_REDUCED
        distinguishing_aspect: >-
          The money domain: one attribution run on a single Conversion materialises
          both LAST_CLICK_RAW (5320 cents) and INCREMENTALITY_ADJUSTED (1596 cents)
          from identical inputs, and the persisted row keeps both numbers in
          separate fields, so gross_commission_cents != payable_commission_cents on
          the same Conversion.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-12T12:00:00Z."
            - "One Network with fee_model HYBRID, fee_bps 375, flat_fee_cents 0."
            - "One COUPON partner, ACTIVE, freshly activated so all attribution counters are 0 and incrementality_score_bps is 3000 (tier LOW)."
            - "Its application declares COUPON_FEED, so the RESTRICTED_CATEGORY_SCREEN variant applies: base 96.00 * 0.65 * 0.90 = 56.16 -> site_quality_score 56.2, brand_suitability_score 100.0, screening_outcome CONDITIONAL, and the decision is therefore APPROVE_WITH_CONDITIONS."
            - "One ACTIVE CommissionPolicy for APPAREL scoped to COUPON with new_customer_rate_bps 900 and returning_customer_rate_bps 400 over [2026-01-01T00:00:00Z, 2027-01-01T00:00:00Z)."
            - "One ACTIVE TrackingLink with cookie_window_days 30 and device_graph_enabled false, carrying one ORGANIC_CLICK on device D1 at 2026-08-10T10:00:00.000Z."
            - "One UNATTRIBUTED Conversion of 133000 cents in APPAREL, returning customer, coupon SAVE10, placed 2026-08-12T09:00:00.000Z on device D1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T12:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
            - call: "POST /networks"
              payload: { name: "Alpha Network", fee_model: "HYBRID", fee_bps: 375, flat_fee_cents: 0, statement_currency: "USD" }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { net_id: $.data.id }
            - call: "POST /affiliates"
              payload: { legal_name: "Coupon Cove LLC", contact_email: "cc@example.com", partner_type: "COUPON", network_id: "${net_id}", payout_currency: "USD" }
              as: Anonymous
              captures: { cou_id: $.data.id, cou_v1: $.data.version }
            - call: "POST /affiliates/${cou_id}/applications"
              payload: { site_url: "https://couponcove.example", primary_traffic_source: "COUPON_DIRECTORY", monthly_traffic_estimate: 400000, declared_promo_methods: ["COUPON_FEED"], product_categories: ["APPAREL"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { cou_app_id: $.data.id }
            - call: "POST /affiliate-applications/${cou_app_id}/screen"
              payload: { domain_authority: 95, content_originality_pct: 95, broken_link_ratio_bps: 0, brand_safety_flag_count: 0, restricted_vertical_overlap_bps: 0 }
              as: ComplianceAnalyst
              as_user_id: "cmp-001"
            - call: "POST /affiliate-applications/${cou_app_id}/decide"
              payload: { decision: "APPROVE_WITH_CONDITIONS", decision_notes: "clean coupon directory", expected_affiliate_version: "${cou_v1}", conditional_requirements: ["no trademark bidding", "monthly coupon feed audit"] }
              as: PartnerManager
              as_user_id: "pm-001"
            - call: "POST /commission-policies"
              payload: { policy_code: "APPAREL-COUPON-2026", product_category: "APPAREL", partner_type_scope: ["COUPON"], new_customer_rate_bps: 900, returning_customer_rate_bps: 400, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { pol_id: $.data.id, pol_v1: $.data.version }
            - call: "POST /commission-policies/${pol_id}/activate"
              payload: { expected_policy_version: "${pol_v1}" }
              as: ProgramAdmin
              as_user_id: "adm-001"
            - call: "POST /affiliates/${cou_id}/tracking-links"
              payload: { landing_url: "https://retail.example/apparel", sub_id: "cc-apparel", cookie_window_days: 30, device_graph_enabled: false }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { link_id: $.data.id }
            - call: "POST /tracking-links/${link_id}/clicks"
              payload: { occurred_at: "2026-08-10T10:00:00.000Z", device_id: "D1", click_type: "ORGANIC_CLICK", referrer_domain: "couponcove.example" }
              as: TrackingIngestor
              as_user_id: "ing-001"
              captures: { click_id: $.data.id }
            - call: "POST /conversions"
              payload: { order_ref: "ORD-DV-1", order_total_cents: 133000, product_category: "APPAREL", customer_ref: "CUST-1", is_new_customer: false, placed_at: "2026-08-12T09:00:00.000Z", device_id: "D1", coupon_code_used: "SAVE10", other_channel_touch: "NONE" }
              as: TrackingIngestor
              as_user_id: "ing-001"
              captures: { conv_id: $.data.id, conv_v1: $.data.version }
          trigger:
            - call: "POST /conversions/${conv_id}/attribute"
              payload: { expected_conversion_version: "${conv_v1}" }
              as: TrackingIngestor
              as_user_id: "ing-001"
            - call: "GET /conversions/${conv_id}/attribution-decisions"
              as: ProgramAdmin
              as_user_id: "adm-001"
          assert:
            - "Conversion.${conv_id}.gross_commission_cents == 5320"
            - "Conversion.${conv_id}.payable_commission_cents == 1596"
            - "Conversion.${conv_id}.attribution_status == \"CREDIT_REDUCED\""
            - "Conversion.${conv_id}.attributed_affiliate_id == ${cou_id}"
            - "Conversion.${conv_id}.attributed_click_id == ${click_id}"
            - "Conversion.${conv_id}.commission_policy_id == ${pol_id}"
            - "Conversion.${conv_id}.candidate_click_count == 1"
            - "GET /conversions/${conv_id}/attribution-decisions returns total_count == 2"
            - "the AttributionDecision row with algorithm_variant == \"LAST_CLICK_RAW\" has credit_share_bps == 10000, computed_commission_cents == 5320 and selected == false"
            - "the AttributionDecision row with algorithm_variant == \"INCREMENTALITY_ADJUSTED\" has credit_share_bps == 3000, computed_commission_cents == 1596, dedup_reason == \"LOW_INCREMENTALITY_PARTNER\" and selected == true"
            - "Affiliate.${cou_id}.accrued_balance_cents == 1596"
            - "Affiliate.${cou_id}.attributed_conversion_count == 1"
            - "Affiliate.${cou_id}.coupon_assisted_conversion_count == 1"
            - "Affiliate.${cou_id}.incrementality_score_bps == 0"
            - "Affiliate.${cou_id}.incrementality_tier == \"LOW\""

      - name: dual_variant_fraud_score_point_in_time_versus_trailing_on_affiliate
        grounds:
          - calculations.fraud_risk_score
          - entities.Affiliate.fields.fraud_risk_score
          - entities.Affiliate.fields.fraud_risk_score_trailing
          - entities.PolicyViolationCase.fields.severity_weight
          - validations[priority=36]
        distinguishing_aspect: >-
          The risk domain on a different entity: the same two OPEN
          PolicyViolationCase rows yield fraud_risk_score 50 (undecayed integer)
          and fraud_risk_score_trailing 30.0 (age-decayed number to one decimal) on
          the same Affiliate row, because only the trailing variant applies the
          0.01-per-day decay.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE CONTENT partner with no violation history."
            - "Two OPEN PolicyViolationCase rows on that partner: TRADEMARK_BIDDING (severity_weight 20) detected 2026-07-22T00:00:00Z, and FORCED_CLICK (severity_weight 30) detected 2026-06-02T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
            - call: "POST /networks"
              payload: { name: "Alpha Network", fee_model: "PERCENT_OF_COMMISSION", fee_bps: 0, flat_fee_cents: 0, statement_currency: "USD" }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { net_id: $.data.id }
            - call: "POST /affiliates"
              payload: { legal_name: "Content Barn Ltd", contact_email: "cb@example.com", partner_type: "CONTENT", network_id: "${net_id}", payout_currency: "USD" }
              as: Anonymous
              captures: { aff_id: $.data.id, aff_v1: $.data.version }
            - call: "POST /affiliates/${aff_id}/applications"
              payload: { site_url: "https://contentbarn.example", primary_traffic_source: "CONTENT_NEWSLETTER", monthly_traffic_estimate: 90000, declared_promo_methods: ["EDITORIAL_CONTENT"], product_categories: ["APPAREL"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { app_id: $.data.id }
            - call: "POST /affiliate-applications/${app_id}/screen"
              payload: { domain_authority: 80, content_originality_pct: 92, broken_link_ratio_bps: 200, brand_safety_flag_count: 0, restricted_vertical_overlap_bps: 0 }
              as: ComplianceAnalyst
              as_user_id: "cmp-001"
            - call: "POST /affiliate-applications/${app_id}/decide"
              payload: { decision: "APPROVE", decision_notes: "quality newsletter", expected_affiliate_version: "${aff_v1}" }
              as: PartnerManager
              as_user_id: "pm-001"
          trigger:
            - call: "POST /policy-violation-cases"
              payload: { affiliate_id: "${aff_id}", violation_type: "TRADEMARK_BIDDING", evidence_ref: "EV-TM-1", detected_at: "2026-07-22T00:00:00Z" }
              as: ComplianceAnalyst
              as_user_id: "cmp-001"
              captures: { case_tm_id: $.data.id }
            - call: "POST /policy-violation-cases"
              payload: { affiliate_id: "${aff_id}", violation_type: "FORCED_CLICK", evidence_ref: "EV-FC-1", detected_at: "2026-06-02T00:00:00Z" }
              as: ComplianceAnalyst
              as_user_id: "cmp-001"
              captures: { case_fc_id: $.data.id }
            - call: "GET /affiliates/${aff_id}"
              as: ComplianceAnalyst
              as_user_id: "cmp-001"
          assert:
            - "PolicyViolationCase.${case_tm_id}.severity_weight == 20"
            - "PolicyViolationCase.${case_fc_id}.severity_weight == 30"
            - "Affiliate.${aff_id}.fraud_risk_score == 50"
            - "Affiliate.${aff_id}.fraud_risk_score_trailing == 30.0"
            - "Affiliate.${aff_id}.open_violation_case_count == 2"
            - "Affiliate.${aff_id}.status == \"ACTIVE\""
            - "Affiliate.${aff_id}.suspension_cause == \"NONE\""

  - rule_id: combinatorial_formula
    instances:

      - name: rounding_order_pinned_per_line_then_sum_on_payout_batch
        grounds:
          - calculations.payout_line_settlement
          - entities.PayoutLine.fields.network_fee_cents
          - entities.PayoutBatch.fields.network_fee_cents
          - entities.PayoutBatch.fields.net_payable_cents
          - entities.Network.fields.fee_bps
        distinguishing_aspect: >-
          Mode (b) — nested rounding where the order decides the cents: two lines of
          5320 cents at 375 bps round to 200 each for a batch network_fee_cents of
          400, whereas summing first and rounding once would yield 399, so the
          batch total falsifies the wrong order by exactly one cent.
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-09-15T00:00:00Z so the 30-day validation hold has elapsed."
            - "One Network with fee_model HYBRID, fee_bps 375 and flat_fee_cents 0."
            - "Two ACTIVE CONTENT partners, each with a VALID W9 whose treaty_withholding_bps is 0."
            - "Each partner holds exactly one VALIDATED Conversion of 133000 cents at the returning-customer rate of 400 bps, so each carries an ACCRUAL of 5320 cents placed 2026-08-12T09:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T12:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
            - call: "POST /networks"
              payload: { name: "Alpha Network", fee_model: "HYBRID", fee_bps: 375, flat_fee_cents: 0, statement_currency: "USD" }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { net_id: $.data.id }
            - call: "POST /commission-policies"
              payload: { policy_code: "APPAREL-CONTENT-2026", product_category: "APPAREL", partner_type_scope: ["CONTENT"], new_customer_rate_bps: 900, returning_customer_rate_bps: 400, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { pol_id: $.data.id, pol_v1: $.data.version }
            - call: "POST /commission-policies/${pol_id}/activate"
              payload: { expected_policy_version: "${pol_v1}" }
              as: ProgramAdmin
              as_user_id: "adm-001"
            - call: "POST /affiliates"
              payload: { legal_name: "Barn A Ltd", contact_email: "a@example.com", partner_type: "CONTENT", network_id: "${net_id}", payout_currency: "USD" }
              as: Anonymous
              captures: { aff_a_id: $.data.id, aff_a_v1: $.data.version }
            - call: "POST /affiliates/${aff_a_id}/applications"
              payload: { site_url: "https://a.example", primary_traffic_source: "CONTENT_NEWSLETTER", monthly_traffic_estimate: 90000, declared_promo_methods: ["EDITORIAL_CONTENT"], product_categories: ["APPAREL"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { app_a_id: $.data.id }
            - call: "POST /affiliate-applications/${app_a_id}/screen"
              payload: { domain_authority: 80, content_originality_pct: 92, broken_link_ratio_bps: 200, brand_safety_flag_count: 0, restricted_vertical_overlap_bps: 0 }
              as: ComplianceAnalyst
              as_user_id: "cmp-001"
            - call: "POST /affiliate-applications/${app_a_id}/decide"
              payload: { decision: "APPROVE", decision_notes: "ok", expected_affiliate_version: "${aff_a_v1}" }
              as: PartnerManager
              as_user_id: "pm-001"
            - call: "POST /affiliates"
              payload: { legal_name: "Barn B Ltd", contact_email: "b@example.com", partner_type: "CONTENT", network_id: "${net_id}", payout_currency: "USD" }
              as: Anonymous
              captures: { aff_b_id: $.data.id, aff_b_v1: $.data.version }
            - call: "POST /affiliates/${aff_b_id}/applications"
              payload: { site_url: "https://b.example", primary_traffic_source: "CONTENT_NEWSLETTER", monthly_traffic_estimate: 90000, declared_promo_methods: ["EDITORIAL_CONTENT"], product_categories: ["APPAREL"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { app_b_id: $.data.id }
            - call: "POST /affiliate-applications/${app_b_id}/screen"
              payload: { domain_authority: 80, content_originality_pct: 92, broken_link_ratio_bps: 200, brand_safety_flag_count: 0, restricted_vertical_overlap_bps: 0 }
              as: ComplianceAnalyst
              as_user_id: "cmp-001"
            - call: "POST /affiliate-applications/${app_b_id}/decide"
              payload: { decision: "APPROVE", decision_notes: "ok", expected_affiliate_version: "${aff_b_v1}" }
              as: PartnerManager
              as_user_id: "pm-001"
            - call: "POST /affiliates/${aff_a_id}/tax-documents"
              payload: { form_type: "W9", tax_id_last4: "1111", treaty_withholding_bps: 0, expires_on: "2027-12-31T00:00:00Z" }
              as: FinanceController
              as_user_id: "fc-001"
              captures: { tax_a_id: $.data.id }
            - call: "POST /tax-documents/${tax_a_id}/verify"
              payload: { verification_outcome: "VALID" }
              as: FinanceController
              as_user_id: "fc-001"
            - call: "POST /affiliates/${aff_b_id}/tax-documents"
              payload: { form_type: "W9", tax_id_last4: "2222", treaty_withholding_bps: 0, expires_on: "2027-12-31T00:00:00Z" }
              as: FinanceController
              as_user_id: "fc-001"
              captures: { tax_b_id: $.data.id }
            - call: "POST /tax-documents/${tax_b_id}/verify"
              payload: { verification_outcome: "VALID" }
              as: FinanceController
              as_user_id: "fc-001"
            - call: "POST /affiliates/${aff_a_id}/tracking-links"
              payload: { landing_url: "https://retail.example/apparel", sub_id: "a-1", cookie_window_days: 30, device_graph_enabled: false }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { link_a_id: $.data.id }
            - call: "POST /affiliates/${aff_b_id}/tracking-links"
              payload: { landing_url: "https://retail.example/apparel", sub_id: "b-1", cookie_window_days: 30, device_graph_enabled: false }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { link_b_id: $.data.id }
            - call: "POST /tracking-links/${link_a_id}/clicks"
              payload: { occurred_at: "2026-08-10T10:00:00.000Z", device_id: "DA", click_type: "ORGANIC_CLICK" }
              as: TrackingIngestor
              as_user_id: "ing-001"
            - call: "POST /tracking-links/${link_b_id}/clicks"
              payload: { occurred_at: "2026-08-10T11:00:00.000Z", device_id: "DB", click_type: "ORGANIC_CLICK" }
              as: TrackingIngestor
              as_user_id: "ing-001"
            - call: "POST /conversions"
              payload: { order_ref: "ORD-RO-A", order_total_cents: 133000, product_category: "APPAREL", customer_ref: "CUST-A", is_new_customer: false, placed_at: "2026-08-12T09:00:00.000Z", device_id: "DA", other_channel_touch: "NONE" }
              as: TrackingIngestor
              as_user_id: "ing-001"
              captures: { conv_a_id: $.data.id, conv_a_v1: $.data.version }
            - call: "POST /conversions/${conv_a_id}/attribute"
              payload: { expected_conversion_version: "${conv_a_v1}" }
              as: TrackingIngestor
              as_user_id: "ing-001"
            - call: "POST /conversions"
              payload: { order_ref: "ORD-RO-B", order_total_cents: 133000, product_category: "APPAREL", customer_ref: "CUST-B", is_new_customer: false, placed_at: "2026-08-12T09:00:00.000Z", device_id: "DB", other_channel_touch: "NONE" }
              as: TrackingIngestor
              as_user_id: "ing-001"
              captures: { conv_b_id: $.data.id, conv_b_v1: $.data.version }
            - call: "POST /conversions/${conv_b_id}/attribute"
              payload: { expected_conversion_version: "${conv_b_v1}" }
              as: TrackingIngestor
              as_user_id: "ing-001"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
          trigger:
            - call: "POST /payout-batches"
              payload: { network_id: "${net_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: FinanceAnalyst
              as_user_id: "fa-001"
              captures: { batch_id: $.data.id, batch_v1: $.data.version }
            - call: "GET /payout-lines"
              payload: { payout_batch_id: "${batch_id}", limit: 10, offset: 0 }
              as: FinanceAnalyst
              as_user_id: "fa-001"
          assert:
            - "Conversion.${conv_a_id}.payable_commission_cents == 5320"
            - "Conversion.${conv_b_id}.payable_commission_cents == 5320"
            - "Conversion.${conv_a_id}.validation_status == \"VALIDATED\""
            - "PayoutBatch.${batch_id}.line_count == 2"
            - "the PayoutLine for ${aff_a_id} has gross_cents == 5320, network_fee_cents == 200, withholding_cents == 0, net_cents == 5120 and state == \"INCLUDED\""
            - "the PayoutLine for ${aff_b_id} has gross_cents == 5320, network_fee_cents == 200, withholding_cents == 0, net_cents == 5120 and state == \"INCLUDED\""
            - "PayoutBatch.${batch_id}.gross_commission_cents == 10640"
            - "PayoutBatch.${batch_id}.network_fee_cents == 400"
            - "PayoutBatch.${batch_id}.withholding_cents == 0"
            - "PayoutBatch.${batch_id}.net_payable_cents == 10240"
            - "PayoutBatch.${batch_id}.network_fee_cents != 399, which is the sum-then-round answer"

      - name: circular_incrementality_pinned_evaluation_order_across_two_conversions
        grounds:
          - calculations.affiliate_incrementality_score
          - calculations.attribution_resolution
          - entities.Affiliate.fields.incrementality_score_bps
          - entities.Affiliate.fields.incrementality_tier
          - entities.Affiliate.fields.coupon_assisted_conversion_count
        distinguishing_aspect: >-
          Mode (c) — a circular-looking dependency with a pinned evaluation order:
          the first coupon-assisted order on a CONTENT partner is paid at full
          credit (5320 cents) using the pre-state tier MEDIUM even though the very
          same request drops incrementality_score_bps to 0 and the tier to LOW, and
          only the second order is reduced to 1596 cents.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-12T12:00:00Z."
            - "One Network with fee_bps 0 and flat_fee_cents 0."
            - "One freshly activated CONTENT partner, so incrementality_score_bps is 4500 and incrementality_tier is MEDIUM."
            - "One ACTIVE CommissionPolicy for APPAREL scoped to CONTENT with returning_customer_rate_bps 400 over [2026-01-01T00:00:00Z, 2027-01-01T00:00:00Z)."
            - "One ACTIVE TrackingLink with cookie_window_days 30 and device_graph_enabled false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T12:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
            - call: "POST /networks"
              payload: { name: "Alpha Network", fee_model: "PERCENT_OF_COMMISSION", fee_bps: 0, flat_fee_cents: 0, statement_currency: "USD" }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { net_id: $.data.id }
            - call: "POST /commission-policies"
              payload: { policy_code: "APPAREL-CONTENT-2026", product_category: "APPAREL", partner_type_scope: ["CONTENT"], new_customer_rate_bps: 900, returning_customer_rate_bps: 400, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { pol_id: $.data.id, pol_v1: $.data.version }
            - call: "POST /commission-policies/${pol_id}/activate"
              payload: { expected_policy_version: "${pol_v1}" }
              as: ProgramAdmin
              as_user_id: "adm-001"
            - call: "POST /affiliates"
