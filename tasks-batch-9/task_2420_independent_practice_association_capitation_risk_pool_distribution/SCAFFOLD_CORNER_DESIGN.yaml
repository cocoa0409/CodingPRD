  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: stale_expected_enrollee_version_blocks_the_superseding_assignment
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.assignment-create-stale-enrollee
          - validations.priority_7_ERR_STALE_ENROLLEE_VERSION
          - endpoints.POST_/ipa/member-assignments
        distinguishing_aspect: |
          The §1.2.1 rule exists precisely because a supersede is legitimate: the
          second writer must prove it saw the enrollee as it is now. Version 1 is
          read before the first assignment, the first assignment bumps the
          Enrollee to version 2, and replaying version 1 must fail with
          ERR_STALE_ENROLLEE_VERSION (412) — not ERR_ASSIGNMENT_PERIOD_OVERLAP,
          which the same request also violates at the lower priority 18. Retrying
          with version 2 and supersede_prior: true then succeeds, so the guard is
          a staleness check and not a blanket ban on superseding.
        test_recipe:
          setup:
            - "Agreement AGR_X1 ACTIVE, two ACTIVE physicians P_X1A / P_X1B, one enrollee E_X1 at version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
