        distinguishing_aspect: |
          MAX_CORRECTION_ROUNDS is the termination condition of the whole review
          cycle and the only thing standing between the product and an unbounded
          organization-driven rescoring loop. It is counted in ACCEPTED corrections,
          not in submitted ones, so the third request is refused only after two
          separate accept-rescore-reopen laps have each raised correction_round.
