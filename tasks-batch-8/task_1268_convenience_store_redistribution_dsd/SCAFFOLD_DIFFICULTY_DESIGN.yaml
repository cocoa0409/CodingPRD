  - rule_id: cross_entity_state_dependency
    instances:
      - name: confirm_delivery_gated_by_manifest_close
        grounds:
          - state_machines.PurchaseOrder.CLOSED_to_DELIVERED
          - state_machines.DeliveryManifest.LOADING_to_CLOSED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: |
          Entity pair PurchaseOrder -> DeliveryManifest: the order's CLOSED -> DELIVERED
          transition is only possible after the manifest's LOADING -> CLOSED transition has
          run; confirming delivery while the manifest is still LOADING (order still
          ASSIGNED) is rejected.
        test_recipe:
          setup:
            - "Order submitted and assigned to a manifest that is in LOADING (never closed)"
          setup_api_calls:
            - { call: "POST /retailers", payload: { store_name: "R", jurisdiction_code: "CA_NORTH", credit_terms: "NET7", credit_limit_cents: 10000000, delivery_day: "MON", tobacco_license_id: "TLIC-9" }, as: WholesaleAdmin, captures: { ret_id: $.data.id } }
