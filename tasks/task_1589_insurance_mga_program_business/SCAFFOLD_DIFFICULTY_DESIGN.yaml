  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: audit_escalation_cascade_depth3
        grounds:
          - state_machines.CarrierAudit.FINDINGS_ISSUED_to_ESCALATED
          - state_machines.Program.ACTIVE_to_SUSPENDED
          - state_machines.TPAAppointment.ACTIVE_to_SUSPENDED
          - state_machines.Claim.UNDER_REVIEW_to_REFERRED
        distinguishing_aspect: |
          Depth-3 chain from the audit-escalation trigger: audit ESCALATED mutates
          Program (hop 1 -> SUSPENDED); the program suspension mutates the ACTIVE
          TPAAppointment (hop 2 -> SUSPENDED); the appointment suspension mutates its
          UNDER_REVIEW Claim (hop 3 -> REFERRED, referral_reason APPOINTMENT_SUSPENDED).
          Parallel hop-2 fan-out (QUOTED policy WITHDRAWN, DRAFT bordereau CANCELLED)
          asserted as well.
        test_recipe:
          setup:
            - "ACTIVE program (standard fixture) with: EFFECTIVE filing, ACTIVE CA/ARTISAN guideline, tranche 300000"
