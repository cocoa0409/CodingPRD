          - validations[priority=19]
          - errors.ERR_CUSTODY_INTERVAL_OVERLAP
          - entities.CustodyRecord.fields.custody_started_at
        distinguishing_aspect: "An interval-overlap rule under half-open adjacency: the offering may hold at most one open custody interval, and the check is enforced by the state of the sibling record rather than by comparing timestamps — adjacency (a new receipt in the same tick as a release) is therefore admissible, because the released record is no longer IN_CUSTODY."
