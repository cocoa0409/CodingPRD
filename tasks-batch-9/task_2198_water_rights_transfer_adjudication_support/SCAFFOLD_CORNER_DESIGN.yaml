      - name: sm_decree_docket_closed_is_terminal_and_read_only
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.DecreeDocket.terminal_states
          - errors[ERR_INVALID_STATE]
          - errors[ERR_DOCKET_PHASE_INVALID]
        distinguishing_aspect: >-
          CLOSED is read-only and refuses two DIFFERENT error ids depending on
          which machine is consulted: another advance-phase is ERR_INVALID_STATE
          (no edge leaves CLOSED), while filing a new claim into it is
          ERR_DOCKET_PHASE_INVALID (the docket is not OPEN_FOR_CLAIMS).
        test_recipe:
          setup:
            - "Docket taken all the way to CLOSED: one FIELD_VERIFIED claim examined, docket to OBJECTION_PERIOD, claim decreed (bubbling the docket to DECREE_ENTERED), then advanced to CLOSED. A second ACTIVE right exists to attempt a late filing with."
