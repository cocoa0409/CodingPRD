# =============================================================================
# Task 0955 — Baby-Gear & Equipment Travel Rental
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  955. Baby-Gear & Equipment Travel Rental: catalog (crib/stroller/carseat) &
  availability, delivery-to-hotel/home & setup, rental period & cleaning/recall
  check, damage/deposit, hotel/resort partner, insurance, late/extension, route

domain_name: baby-gear-travel-rental
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_target: beyond_expert
  entity_count: 14
  state_machine_count: 9
  calculation_count: 12
  endpoint_count: 64
  error_code_count: 34
  role_count: 5

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Customer full name" }
      - { name: email, type: string, source: input, description: "Unique email address", constraints: "unique across customers" }
      - { name: phone, type: string, source: input, description: "Contact phone number" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE }
      - { name: risk_score, type: integer, source: computed, description: "0-100 weighted risk score from late returns and captured damage claims; see calculations.customer_risk_score", default: 0 }
      - { name: late_return_count, type: integer, source: system, description: "Count of settled reservations whose late_minutes exceeded the grace window", default: 0 }
      - { name: captured_damage_count, type: integer, source: system, description: "Count of damage claims captured against this customer at settlement", default: 0 }

  - name: CatalogItem
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Display name, e.g. 'Deluxe Crib'" }
      - { name: category, type: enum, source: input, description: "CRIB | STROLLER | CARSEAT" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Base daily rental rate in cents", constraints: "> 0" }
      - { name: deposit_amount_cents, type: integer, source: input, description: "Per-unit refundable deposit in cents", constraints: "> 0" }
      - { name: weight_kg, type: number, source: input, description: "Unit weight in kg; consumes route vehicle capacity", constraints: "> 0" }
      - { name: cleaning_turnaround_hours, type: integer, source: input, description: "Post-return buffer hours during which the unit is not bookable", constraints: ">= 0" }
      - { name: deep_clean_every_cycles, type: integer, source: input, description: "After this many STANDARD cleaning passes the next cleaning ticket must be DEEP", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "LISTED | DELISTED", default: LISTED }

  - name: InventoryUnit
    parent: null
    common_fields: true
    fields:
      - { name: catalog_item_id, type: string, source: input, description: "FK -> CatalogItem.id; the catalog product this unit belongs to" }
      - { name: serial_number, type: string, source: input, description: "Unique manufacturer serial number", constraints: "unique across units" }
      - { name: condition_grade, type: enum, source: input, description: "A | B | C — depreciation factor 1.0 / 0.8 / 0.6 applied to damage charges" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | RESERVED | RENTED_OUT | AWAITING_CLEANING | IN_CLEANING | QUARANTINED | RETIRED", default: AVAILABLE }
      - { name: cleans_since_deep, type: integer, source: system, description: "STANDARD cleaning passes since last DEEP pass; reset to 0 by a DEEP pass", default: 0 }
      - { name: blocked_until, type: datetime, source: system, description: "ISO8601 instant until which the unit is unbookable (returned_at + cleaning_turnaround_hours); null when not blocked", default: null }

  - name: HotelPartner
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Hotel/resort partner name" }
      - { name: zone_code, type: string, source: input, description: "Delivery zone the partner sits in" }
      - { name: commission_pct, type: number, source: input, description: "Commission fraction on settled line charges", constraints: "0 <= commission_pct <= 0.30" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE }

  - name: InsurancePlan
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique plan code, e.g. BASIC, PREMIUM", constraints: "unique" }
      - { name: pricing_model, type: enum, source: input, description: "PER_DAY | PERCENT_OF_RENTAL — selects the premium variant" }
      - { name: rate_value, type: number, source: input, description: "PER_DAY: premium cents per billable day; PERCENT_OF_RENTAL: fraction of gear subtotal in (0, 0.25]" }
      - { name: deductible_cents, type: integer, source: input, description: "Customer-paid deductible per covered damage claim", constraints: ">= 0" }
      - { name: coverage_cap_cents, type: integer, source: input, description: "Maximum insurer payout per covered damage claim", constraints: "> 0" }
      - { name: covered_severities, type: array, source: input, description: "Subset of [COSMETIC, MINOR, MAJOR, TOTAL_LOSS] the plan covers" }

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; taken from X-User-ID of the creating Customer" }
      - { name: hotel_partner_id, type: string, source: input, description: "FK -> HotelPartner.id; null means home delivery", default: null }
      - { name: delivery_address, type: string, source: input, description: "Delivery address (hotel front desk or home)" }
      - { name: zone_code, type: string, source: input, description: "Delivery zone; must equal hotel partner zone when partner present" }
      - { name: start_date, type: string, source: input, description: "Rental start date YYYY-MM-DD (inclusive)" }
      - { name: end_date, type: string, source: input, description: "Rental end date YYYY-MM-DD (exclusive); extended by approved ExtensionRequests" }
      - { name: insurance_plan_id, type: string, source: input, description: "FK -> InsurancePlan.id; null means uninsured", default: null }
      - { name: status, type: enum, source: system, description: "QUOTED | CONFIRMED | DELIVERED | RETURNED | SETTLED | CANCELLED", default: QUOTED }
      - { name: payment_status, type: enum, source: system, description: "Parallel dimension: DEPOSIT_PENDING | DEPOSIT_HELD | SETTLED_PAID | REFUNDED", default: DEPOSIT_PENDING }
      - { name: quoted_total_cents, type: integer, source: computed, description: "Provisional quote at creation/amend; see calculations.provisional_quote", default: 0 }
      - { name: gear_subtotal_cents, type: integer, source: computed, description: "Sum of provisional line charges before fees/premium", default: 0 }
      - { name: final_total_cents, type: integer, source: computed, description: "Final charge at settlement; null until SETTLED", default: null }
      - { name: deposit_hold_cents, type: integer, source: computed, description: "Deposit hold taken at confirm; see calculations.deposit_hold", default: 0 }
      - { name: deposit_captured_cents, type: integer, source: system, description: "Total captured from the deposit hold (damage + late + cancellation fee)", default: 0 }
      - { name: deposit_released_cents, type: integer, source: system, description: "Total released back to the customer", default: 0 }
      - { name: late_fee_cents, type: integer, source: computed, description: "Late fee computed at settlement; see calculations.late_fee", default: 0 }
      - { name: extension_charge_cents, type: integer, source: computed, description: "Cumulative approved extension charges; see calculations.extension_charge", default: 0 }
      - { name: extension_days, type: integer, source: system, description: "Cumulative approved extension days", default: 0 }
      - { name: commission_cents, type: integer, source: computed, description: "Hotel partner commission at settlement; see calculations.hotel_commission; 0 when no partner", default: 0 }
      - { name: returned_at, type: datetime, source: system, description: "Actual return instant (pickup stop completion clock); null until returned", default: null }

  - name: ReservationLine
    parent: null
    common_fields: true
    fields:
      - { name: reservation_id, type: string, source: system, description: "FK -> Reservation.id" }
      - { name: catalog_item_id, type: string, source: input, description: "FK -> CatalogItem.id; the rented product (one unit per line)" }
      - { name: assigned_unit_id, type: string, source: system, description: "FK -> InventoryUnit.id; null until allocation at confirm; cleared when quarantined", default: null }
      - { name: status, type: enum, source: system, description: "PENDING | ALLOCATED | OUT | RETURNED | PENDING_REALLOCATION | CANCELLED", default: PENDING }
      - { name: unit_rate_cents, type: integer, source: system, description: "Snapshot of CatalogItem.daily_rate_cents at confirm; basis for late/extension charges", default: 0 }
      - { name: line_charge_cents, type: integer, source: computed, description: "Provisional tiered line charge at quote; recomputed on amend", default: 0 }

  - name: DeliveryRoute
    parent: null
    common_fields: true
    fields:
      - { name: route_date, type: string, source: input, description: "Date YYYY-MM-DD the route runs" }
      - { name: zone_code, type: string, source: input, description: "Zone this route serves; stops must match reservation zone" }
      - { name: vehicle_capacity_kg, type: number, source: input, description: "Aggregate weight capacity of the vehicle", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "PLANNED | DISPATCHED | COMPLETED", default: PLANNED }
      - { name: planned_weight_kg, type: number, source: computed, description: "Sum of gear weight over non-cancelled, non-skipped stops", default: 0 }

  - name: RouteStop
    parent: null
    common_fields: true
    fields:
      - { name: route_id, type: string, source: input, description: "FK -> DeliveryRoute.id" }
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id" }
      - { name: stop_type, type: enum, source: input, description: "DELIVERY_SETUP | PICKUP" }
      - { name: address, type: string, source: input, description: "Stop address" }
      - { name: time_window_start, type: datetime, source: input, description: "Window start ISO8601; must fall within route_date" }
      - { name: time_window_end, type: datetime, source: input, description: "Window end ISO8601; half-open [start, end)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | FAILED | SKIPPED", default: SCHEDULED }
      - { name: sequence, type: integer, source: computed, description: "Order within route: time_window_start ASC, ties by created_at ASC", default: 0 }
      - { name: completed_at, type: datetime, source: system, description: "Clock instant when completed; null otherwise", default: null }

  - name: ExtensionRequest
    parent: null
    common_fields: true
    fields:
      - { name: reservation_id, type: string, source: system, description: "FK -> Reservation.id" }
      - { name: requested_end_date, type: string, source: input, description: "New exclusive end date; must be after current end_date" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | DENIED | SUPERSEDED", default: PENDING }
      - { name: extension_charge_cents, type: integer, source: computed, description: "Charge computed at approval; 0 while pending/denied", default: 0 }
      - { name: decided_by_user_id, type: string, source: system, description: "Opaque OperationsAdmin id that approved/denied; null while PENDING", default: null }

  - name: DamageClaim
    parent: null
    common_fields: true
    fields:
      - { name: reservation_line_id, type: string, source: input, description: "FK -> ReservationLine.id; line must be RETURNED" }
      - { name: severity, type: enum, source: input, description: "COSMETIC | MINOR | MAJOR | TOTAL_LOSS" }
      - { name: repair_cost_cents, type: integer, source: input, description: "Assessed repair cost; ignored for TOTAL_LOSS (replacement = unit deposit)", constraints: ">= 0" }
      - { name: description, type: string, source: input, description: "Damage description" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the filer (Inspector or OperationsAdmin)" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of approver/denier; must differ from filed_by_user_id; reset to null on reopen", default: null }
      - { name: status, type: enum, source: system, description: "UNDER_REVIEW | APPROVED | DENIED | DISPUTED | CAPTURED", default: UNDER_REVIEW }
      - { name: capture_amount_cents, type: integer, source: computed, description: "Customer-borne amount computed at approval; see calculations.damage_capture_amount", default: 0 }

  - name: RecallNotice
    parent: null
    common_fields: true
    fields:
      - { name: catalog_item_id, type: string, source: input, description: "FK -> CatalogItem.id under recall" }
      - { name: recall_code, type: string, source: input, description: "Manufacturer recall code" }
      - { name: severity, type: enum, source: input, description: "ADVISORY | MANDATORY — only MANDATORY blocks confirm and quarantines" }
      - { name: description, type: string, source: input, description: "Recall description" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | CLOSED", default: DRAFT }
      - { name: activated_at, type: datetime, source: system, description: "Clock instant of activation; null while DRAFT", default: null }

  - name: CleaningTicket
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> InventoryUnit.id being cleaned" }
      - { name: ticket_type, type: enum, source: system, description: "STANDARD | DEEP | RECALL_DECONTAMINATION; STANDARD/DEEP chosen by cycle rule on auto-creation; manual creation may pick any (input on POST /cleaning-tickets)", default: STANDARD }
      - { name: status, type: enum, source: system, description: "OPEN | PASSED | FAILED", default: OPEN }
      - { name: inspector_user_id, type: string, source: system, description: "Opaque Inspector id that resolved the ticket; null while OPEN", default: null }
      - { name: resolution_note, type: string, source: input, description: "Optional note on pass/fail", default: null }

  - name: DepositTransaction
    parent: null
    common_fields: false
    fields:
      - { name: reservation_id, type: string, source: system, description: "FK -> Reservation.id this ledger entry belongs to" }
      - { name: txn_type, type: enum, source: system, description: "HOLD | CAPTURE | RELEASE" }
      - { name: amount_cents, type: integer, source: system, description: "Signed-positive amount of the entry" }
      - { name: reason, type: string, source: system, description: "HOLD_AT_CONFIRM | DAMAGE_CLAIM | LATE_FEE | CANCELLATION_FEE | RELEASE_REMAINDER" }
      - { name: balance_after_cents, type: integer, source: computed, description: "Outstanding held balance after this entry (HOLD adds, CAPTURE/RELEASE subtract)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /customers/{id}/suspend, or system auto-suspension at settlement when risk_score >= 90"
        actor: OperationsAdmin | system
        preconditions: ["customer.status == ACTIVE"]
        side_effects: ["customer.version += 1", "suspended customer can no longer confirm reservations (ERR_CUSTOMER_SUSPENDED)"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /customers/{id}/reinstate"
        actor: OperationsAdmin
        preconditions: ["customer.status == SUSPENDED"]
        side_effects: ["customer.version += 1"]

  - entity: Reservation
    initial_state: QUOTED
    terminal_states: [SETTLED, CANCELLED]
    note: "Two parallel dimensions evolve on one row: rental status (this machine) and payment_status (next machine)."
    transitions:
      - from: QUOTED
        to: QUOTED
        trigger: "POST /reservations/{id}/amend-dates (self-loop: dates change, quote recomputed, version bumped, OCC expected_reservation_version)"
        actor: Customer
        preconditions:
          - "reservation.customer_id == X-User-ID"
          - "payload.expected_reservation_version == reservation.version (else ERR_STALE_VERSION)"
          - "payload.start_date < payload.end_date"
        side_effects:
          - "recompute calculations.provisional_quote -> quoted_total_cents, gear_subtotal_cents, per-line line_charge_cents"
          - "reservation.version += 1"
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /reservations/{id}/confirm"
        actor: Customer
        preconditions:
          - "reservation.customer_id == X-User-ID"
          - "customer.status == ACTIVE (else ERR_CUSTOMER_SUSPENDED)"
          - "no line's catalog item is DELISTED (else ERR_CATALOG_ITEM_DELISTED)"
          - "no line's catalog item has an ACTIVE MANDATORY RecallNotice (else ERR_RECALL_BLOCKED)"
          - "for every line, an eligible unit exists per calculations.availability_count eligibility filter (else ERR_NO_ELIGIBLE_UNIT)"
        side_effects:
          - "per line: allocate unit via selector (status==AVAILABLE, catalog match, no overlapping committed interval incl. cleaning buffer, blocked_until <= start_date; rank condition_grade A>B>C then created_at ASC) -> line.status ALLOCATED, line.assigned_unit_id set, line.unit_rate_cents snapshot, unit.status RESERVED, unit.version += 1"
          - "calculations.deposit_hold -> deposit_hold_cents (per-unit round_half_up(deposit_amount_cents x risk multiplier), summed)"
          - "append DepositTransaction(HOLD, amount=deposit_hold_cents, reason=HOLD_AT_CONFIRM)"
          - "payment_status: DEPOSIT_PENDING -> DEPOSIT_HELD"
          - "reservation.version += 1"
      - from: CONFIRMED
        to: DELIVERED
        trigger: "POST /route-stops/{id}/complete where stop.stop_type == DELIVERY_SETUP (cascade from RouteStop machine)"
        actor: system
        preconditions: ["reservation.status == CONFIRMED"]
        side_effects:
          - "every ALLOCATED line -> OUT; each assigned unit RESERVED -> RENTED_OUT (unit.version += 1)"
          - "reservation.version += 1"
      - from: DELIVERED
        to: RETURNED
        trigger: "POST /route-stops/{id}/complete where stop.stop_type == PICKUP (cascade from RouteStop machine)"
        actor: system
        preconditions: ["reservation.status == DELIVERED"]
        side_effects:
          - "reservation.returned_at = current logical clock"
          - "every OUT line -> RETURNED; each assigned unit RENTED_OUT -> AWAITING_CLEANING, unit.blocked_until = returned_at + catalog.cleaning_turnaround_hours (unit.version += 1)"
          - "per returned unit: auto-create CleaningTicket OPEN (type DEEP if unit.cleans_since_deep >= catalog.deep_clean_every_cycles else STANDARD) and unit AWAITING_CLEANING -> IN_CLEANING (unit.version += 1)"
          - "reservation.version += 1"
      - from: RETURNED
        to: SETTLED
        trigger: "POST /reservations/{id}/settle"
        actor: OperationsAdmin
        preconditions: ["reservation.status == RETURNED"]
        side_effects:
          - "calculations.late_fee -> late_fee_cents (from returned_at vs end_date); if late_minutes > GRACE_MINUTES then customer.late_return_count += 1"
          - "calculations.final charge: final_total_cents = quoted_total_cents + extension_charge_cents + late_fee_cents"
          - "every UNDER_REVIEW claim on this reservation's lines is NOT captured; every APPROVED claim -> CAPTURED (claim.version += 1, reviewed_by_user_id preserved)"
          - "calculations.deposit_settlement_waterfall appends CAPTURE txns (one per APPROVED claim in claim created_at ASC order, then one for late fee) and one RELEASE txn for the remainder; updates deposit_captured_cents / deposit_released_cents"
          - "calculations.hotel_commission -> commission_cents (per-line round then sum) when hotel_partner_id present"
          - "customer.captured_damage_count += number of claims captured; calculations.customer_risk_score recomputed; if risk_score >= 90 then customer ACTIVE -> SUSPENDED (cascade)"
          - "payment_status: DEPOSIT_HELD -> SETTLED_PAID if deposit_captured_cents > 0 else REFUNDED"
          - "reservation.version += 1"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel"
        actor: Customer | OperationsAdmin
        preconditions: ["reservation.status == QUOTED", "if actor is Customer then reservation.customer_id == X-User-ID"]
        side_effects:
          - "every PENDING line -> CANCELLED (line.version += 1)"
          - "payment_status stays DEPOSIT_PENDING; no deposit transactions"
          - "reservation.version += 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel"
        actor: Customer | OperationsAdmin
        preconditions: ["reservation.status == CONFIRMED", "if actor is Customer then reservation.customer_id == X-User-ID"]
        side_effects:
          - "every ALLOCATED line -> CANCELLED; each assigned unit RESERVED -> AVAILABLE (unit.version += 1, assigned_unit_id kept on line for audit)"
          - "every SCHEDULED RouteStop referencing this reservation -> SKIPPED (stop.version += 1); each affected DeliveryRoute.planned_weight_kg recomputed"
          - "every PENDING ExtensionRequest -> SUPERSEDED (ext.version += 1)"
          - "cancellation fee = round_half_up(quoted_total_cents x 0.10); append CAPTURE txn (reason=CANCELLATION_FEE, amount=min(fee, deposit_hold_cents)) then RELEASE txn for remainder if > 0"
          - "payment_status: DEPOSIT_HELD -> SETTLED_PAID if captured > 0 else REFUNDED"
          - "reservation.version += 1"

  - entity: Reservation
    initial_state: DEPOSIT_PENDING
    terminal_states: [SETTLED_PAID, REFUNDED]
    note: "Parallel payment_status dimension on Reservation; field name payment_status."
    transitions:
      - from: DEPOSIT_PENDING
        to: DEPOSIT_HELD
        trigger: "POST /reservations/{id}/confirm (cascade)"
        actor: system
        preconditions: ["confirm transition succeeded"]
        side_effects: ["HOLD DepositTransaction appended"]
      - from: DEPOSIT_HELD
        to: SETTLED_PAID
        trigger: "POST /reservations/{id}/settle or POST /reservations/{id}/cancel (cascade) when captured amount > 0"
        actor: system
        preconditions: ["parent rental transition succeeded"]
        side_effects: ["CAPTURE and RELEASE txns appended per waterfall"]
      - from: DEPOSIT_HELD
        to: REFUNDED
        trigger: "POST /reservations/{id}/settle (cascade) when captured amount == 0"
        actor: system
        preconditions: ["parent rental transition succeeded"]
        side_effects: ["single RELEASE txn for the full hold"]

  - entity: ReservationLine
    initial_state: PENDING
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: PENDING
        to: ALLOCATED
        trigger: "POST /reservations/{id}/confirm (cascade: selector assigns a unit)"
        actor: system
        preconditions: ["parent reservation confirm succeeded"]
        side_effects: ["assigned_unit_id set; unit_rate_cents snapshot; unit AVAILABLE -> RESERVED"]
      - from: ALLOCATED
        to: OUT
        trigger: "DELIVERY_SETUP stop completion (cascade)"
        actor: system
        preconditions: ["reservation.status == CONFIRMED"]
        side_effects: ["unit RESERVED -> RENTED_OUT"]
      - from: OUT
        to: RETURNED
        trigger: "PICKUP stop completion (cascade)"
        actor: system
        preconditions: ["reservation.status == DELIVERED"]
        side_effects: ["unit RENTED_OUT -> AWAITING_CLEANING -> IN_CLEANING; CleaningTicket auto-created"]
      - from: ALLOCATED
        to: PENDING_REALLOCATION
        trigger: "POST /recalls/{id}/activate (cascade: assigned unit quarantined by a MANDATORY recall)"
        actor: system
        preconditions: ["assigned unit transitioned to QUARANTINED by the recall cascade"]
        side_effects: ["assigned_unit_id cleared (set to null); line.version += 1"]
      - from: PENDING_REALLOCATION
        to: ALLOCATED
        trigger: "POST /reservation-lines/{id}/reallocate"
        actor: OperationsAdmin
        preconditions:
          - "line.status == PENDING_REALLOCATION"
          - "reservation.status == CONFIRMED"
          - "an eligible replacement unit exists per availability eligibility filter, excluding any unit under an ACTIVE MANDATORY recall (else ERR_UNIT_QUARANTINED if the only candidates are quarantined, else ERR_NO_ELIGIBLE_UNIT)"
        side_effects: ["assign new unit (same selector ranking); new unit AVAILABLE -> RESERVED (unit.version += 1); line.version += 1; reservation.version += 1"]
      - from: PENDING
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel from QUOTED (cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel from CONFIRMED (cascade)"
        actor: system
        preconditions: []
        side_effects: ["unit RESERVED -> AVAILABLE"]

  - entity: InventoryUnit
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    note: "Cyclic machine: rental loop AVAILABLE->RESERVED->RENTED_OUT->AWAITING_CLEANING->IN_CLEANING->AVAILABLE; quarantine loop from any non-terminal state."
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "reservation confirm or line reallocate (cascade)"
        actor: system
        preconditions: ["unit selected by allocation selector"]
        side_effects: ["unit.version += 1"]
      - from: RESERVED
        to: RENTED_OUT
        trigger: "DELIVERY_SETUP stop completion (cascade)"
        actor: system
        preconditions: []
        side_effects: ["unit.version += 1"]
      - from: RENTED_OUT
        to: AWAITING_CLEANING
        trigger: "PICKUP stop completion (cascade)"
        actor: system
        preconditions: []
        side_effects: ["unit.blocked_until = returned_at + cleaning_turnaround_hours; unit.version += 1"]
      - from: AWAITING_CLEANING
        to: IN_CLEANING
        trigger: "CleaningTicket creation for this unit (auto-cascade on pickup, or POST /cleaning-tickets)"
        actor: system | Inspector | OperationsAdmin
        preconditions: ["no OPEN CleaningTicket already exists for this unit (else ERR_INVALID_STATE)"]
        side_effects: ["unit.version += 1"]
      - from: IN_CLEANING
        to: AVAILABLE
        trigger: "POST /cleaning-tickets/{id}/pass"
        actor: Inspector
        preconditions: ["ticket.status == OPEN", "ticket.unit_id == unit.id"]
        side_effects:
          - "if ticket.ticket_type == STANDARD: unit.cleans_since_deep += 1"
          - "if ticket.ticket_type == DEEP or RECALL_DECONTAMINATION: unit.cleans_since_deep = 0"
          - "unit.version += 1"
      - from: IN_CLEANING
        to: AWAITING_CLEANING
        trigger: "POST /cleaning-tickets/{id}/fail"
        actor: Inspector
        preconditions: ["ticket.status == OPEN", "ticket.unit_id == unit.id"]
        side_effects: ["cleans_since_deep unchanged; unit.version += 1"]
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "POST /recalls/{id}/activate for the unit's catalog item with severity MANDATORY (cascade)"
        actor: system
        preconditions: []
        side_effects: ["unit.version += 1"]
      - from: RESERVED
        to: QUARANTINED
        trigger: "recall activation (cascade)"
        actor: system
        preconditions: []
        side_effects: ["the holding line ALLOCATED -> PENDING_REALLOCATION (assigned_unit_id cleared); reservation.version += 1; unit.version += 1"]
      - from: RENTED_OUT
        to: QUARANTINED
        trigger: "recall activation (cascade)"
        actor: system
        preconditions: []
        side_effects: ["unit.version += 1; unit still must be returned via pickup before decontamination"]
      - from: AWAITING_CLEANING
        to: QUARANTINED
        trigger: "recall activation (cascade)"
        actor: system
        preconditions: []
        side_effects: ["unit.version += 1"]
      - from: IN_CLEANING
        to: QUARANTINED
        trigger: "recall activation (cascade)"
        actor: system
        preconditions: []
        side_effects: ["unit.version += 1"]
      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /cleaning-tickets/{id}/pass where ticket_type == RECALL_DECONTAMINATION"
        actor: Inspector
        preconditions: ["ticket.status == OPEN", "ticket.unit_id == unit.id", "ticket.ticket_type == RECALL_DECONTAMINATION"]
        side_effects: ["unit.cleans_since_deep = 0; unit.blocked_until = null; unit.version += 1"]
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /inventory-units/{id}/retire"
        actor: OperationsAdmin
        preconditions: ["unit.status == AVAILABLE"]
        side_effects: ["unit.version += 1"]
      - from: QUARANTINED
        to: RETIRED
        trigger: "POST /inventory-units/{id}/retire"
        actor: OperationsAdmin
        preconditions: ["unit.status == QUARANTINED"]
        side_effects: ["unit.version += 1"]

  - entity: DeliveryRoute
    initial_state: PLANNED
    terminal_states: [COMPLETED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /routes/{id}/dispatch"
        actor: OperationsAdmin
        preconditions: ["route.status == PLANNED", "route has >= 1 SCHEDULED stop (else ERR_INVALID_STATE)"]
        side_effects: ["route.version += 1"]
      - from: DISPATCHED
        to: PLANNED
        trigger: "POST /routes/{id}/recall (revert branch)"
        actor: OperationsAdmin
        preconditions: ["route.status == DISPATCHED", "no stop on this route is COMPLETED (else ERR_INVALID_STATE)"]
        side_effects: ["route.version += 1"]
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /routes/{id}/complete"
        actor: OperationsAdmin
        preconditions: ["route.status == DISPATCHED", "every stop is in {COMPLETED, FAILED, SKIPPED} (else ERR_INVALID_STATE)"]
        side_effects: ["route.version += 1"]

  - entity: RouteStop
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, FAILED, SKIPPED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /route-stops/{id}/complete"
        actor: OperationsAdmin
        preconditions:
          - "stop.status == SCHEDULED"
          - "stop's DeliveryRoute.status == DISPATCHED (else ERR_INVALID_STATE)"
          - "stop_type == DELIVERY_SETUP requires reservation.status == CONFIRMED; stop_type == PICKUP requires reservation.status == DELIVERED (else ERR_INVALID_STATE)"
        side_effects:
          - "stop.completed_at = current logical clock"
          - "DELIVERY_SETUP: reservation CONFIRMED -> DELIVERED cascade (lines OUT, units RENTED_OUT)"
          - "PICKUP: reservation DELIVERED -> RETURNED cascade (returned_at set, units AWAITING_CLEANING -> IN_CLEANING, CleaningTickets auto-created)"
          - "stop.version += 1"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /route-stops/{id}/fail"
        actor: OperationsAdmin
        preconditions: ["stop.status == SCHEDULED", "stop's DeliveryRoute.status == DISPATCHED"]
        side_effects: ["stop.version += 1"]
      - from: SCHEDULED
        to: SKIPPED
        trigger: "POST /reservations/{id}/cancel from CONFIRMED (cascade) or POST /recalls/{id}/activate (cascade: a MANDATORY recall quarantines a unit on a CONFIRMED reservation that has a SCHEDULED DELIVERY_SETUP stop for a now-PENDING_REALLOCATION line)"
        actor: system
        preconditions: ["stop.status == SCHEDULED"]
        side_effects: ["route.planned_weight_kg recomputed (stop.weight removed); stop.version += 1"]

  - entity: ExtensionRequest
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /extensions/{id}/approve"
        actor: OperationsAdmin
        preconditions:
          - "extension.status == PENDING"
          - "reservation.status in {CONFIRMED, DELIVERED} (else ERR_INVALID_STATE)"
          - "for every allocated unit on the reservation: no other reservation's committed interval (incl. cleaning buffer) overlaps [current end_date, requested_end_date) (else ERR_EXTENSION_WINDOW_CONFLICT)"
        side_effects:
          - "calculations.extension_charge -> extension_charge_cents (tiered: days 1-2 at 120% of unit_rate, days >= 3 at 150%, per line, summed)"
          - "reservation.end_date = requested_end_date; reservation.extension_days += (requested_end_date - old end_date).days; reservation.extension_charge_cents += extension_charge_cents; reservation.version += 1"
          - "extension.decided_by_user_id = X-User-ID; extension.version += 1"
      - from: PENDING
        to: DENIED
        trigger: "POST /extensions/{id}/deny"
        actor: OperationsAdmin
        preconditions: ["extension.status == PENDING"]
        side_effects: ["extension.decided_by_user_id = X-User-ID; extension.version += 1"]
      - from: PENDING
        to: SUPERSEDED
        trigger: "POST /reservations/{id}/extensions (a new extension is created while this one is PENDING) or reservation cancel (cascade)"
        actor: system
        preconditions: []
        side_effects: ["extension.version += 1"]

  - entity: DamageClaim
    initial_state: UNDER_REVIEW
    terminal_states: [CAPTURED]
    note: "Cyclic review loop: DENIED -> DISPUTED -> UNDER_REVIEW via dispute + reopen. DENIED/DISPUTED are non-terminal."
    transitions:
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /damage-claims/{id}/approve"
        actor: OperationsAdmin
        preconditions:
          - "claim.status == UNDER_REVIEW"
          - "claim's reservation_line.status == RETURNED and reservation.status == RETURNED (else ERR_INVALID_STATE)"
          - "X-User-ID != claim.filed_by_user_id (segregation of duties, else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["calculations.damage_capture_amount -> capture_amount_cents; claim.reviewed_by_user_id = X-User-ID; claim.version += 1"]
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /damage-claims/{id}/deny"
        actor: OperationsAdmin
        preconditions:
          - "claim.status == UNDER_REVIEW"
          - "X-User-ID != claim.filed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["claim.reviewed_by_user_id = X-User-ID; claim.version += 1"]
      - from: DENIED
        to: DISPUTED
        trigger: "POST /damage-claims/{id}/dispute"
        actor: Customer
        preconditions: ["claim.status == DENIED", "reservation.customer_id == X-User-ID"]
        side_effects: ["claim.version += 1"]
      - from: DISPUTED
        to: UNDER_REVIEW
        trigger: "POST /damage-claims/{id}/reopen"
        actor: OperationsAdmin
        preconditions: ["claim.status == DISPUTED"]
        side_effects: ["claim.reviewed_by_user_id = null; claim.version += 1"]
      - from: APPROVED
        to: CAPTURED
        trigger: "POST /reservations/{id}/settle (cascade: waterfall captures each APPROVED claim in claim created_at ASC order)"
        actor: system
        preconditions: ["reservation settle transition running"]
        side_effects: ["CAPTURE DepositTransaction appended for min(capture_amount_cents, remaining hold); claim.version += 1"]

  - entity: RecallNotice
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /recalls/{id}/activate"
        actor: OperationsAdmin
        preconditions: ["recall.status == DRAFT"]
        side_effects:
          - "recall.activated_at = current logical clock"
          - "if severity == MANDATORY: every InventoryUnit of recall.catalog_item_id in {AVAILABLE, RESERVED, RENTED_OUT, AWAITING_CLEANING, IN_CLEANING} -> QUARANTINED (depth-1 hop)"
          - "per RESERVED unit quarantined: its ALLOCATED line -> PENDING_REALLOCATION with assigned_unit_id cleared (depth-2 hop)"
          - "per reservation with a PENDING_REALLOCATION line: any SCHEDULED DELIVERY_SETUP RouteStop for that reservation -> SKIPPED and its route's planned_weight_kg recomputed (depth-3 hop)"
          - "recall.version += 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /recalls/{id}/close"
        actor: OperationsAdmin
        preconditions: ["recall.status == ACTIVE", "no InventoryUnit of recall.catalog_item_id is QUARANTINED (else ERR_INVALID_STATE)"]
        side_effects: ["recall.version += 1"]

  - entity: CleaningTicket
    initial_state: OPEN
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: OPEN
        to: PASSED
        trigger: "POST /cleaning-tickets/{id}/pass"
        actor: Inspector
        preconditions: ["ticket.status == OPEN"]
        side_effects: ["ticket.inspector_user_id = X-User-ID", "unit IN_CLEANING -> AVAILABLE (cycle counters per unit machine); QUARANTINED unit with RECALL_DECONTAMINATION ticket -> AVAILABLE", "ticket.version += 1"]
      - from: OPEN
        to: FAILED
        trigger: "POST /cleaning-tickets/{id}/fail"
        actor: Inspector
        preconditions: ["ticket.status == OPEN"]
        side_effects: ["ticket.inspector_user_id = X-User-ID", "unit IN_CLEANING -> AWAITING_CLEANING (or stays QUARANTINED when ticket_type == RECALL_DECONTAMINATION)", "ticket.version += 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: reservation-amend-stale-version
    parent_entity: Reservation
    write_endpoint: "POST /reservations/{id}/amend-dates"
    occ_field: "expected_reservation_version"
    description: |
      Amending the dates of a QUOTED reservation whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another write (a prior amend, an extension approval cascading a
      version bump) has superseded the client's view of the quote.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: extension-create-stale-version
    parent_entity: Reservation
    write_endpoint: "POST /reservations/{id}/extensions"
    occ_field: "expected_reservation_version"
    description: |
      Creating an ExtensionRequest against a Reservation whose version has
      advanced since the client last observed it is rejected. A newly created
      extension legitimately supersedes the prior PENDING one under the
      SUPERSEDED transition, so a writer holding a stale reservation view must
      be refused rather than allowed to supersede blindly.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: provisional_quote
    description: "Provisional reservation quote at creation and on amend-dates. Mode-(c) evaluation order is pinned to remove the circular-looking dependency between the delivery-fee tier and the total."
    trigger: "POST /reservations, POST /reservations/{id}/amend-dates"
    algorithm: tiered_pricing
    formula: |
      billable_days = max(1, (end_date - start_date).days)            # end exclusive
      For each line (one unit per line, rate r = CatalogItem.daily_rate_cents):
        tiered_line = r*min(d,6) + round_half_up(r*0.85)*max(0, min(d,13)-6) + round_half_up(r*0.70)*max(0, d-13)
        # marginal tiers: days 1-6 at 100%, days 7-13 at 85%, days >=14 at 70%
      gear_subtotal_cents = SUM(tiered_line over lines)
      EVALUATION ORDER (pinned, non-negotiable):
        (1) gear_subtotal_cents computed first
        (2) delivery_fee_cents tiered on gear_subtotal_cents ONLY (never on the total):
            gear_subtotal < 10000 -> 2500; 10000..29999 -> 1500; >= 30000 -> 0
        (3) setup_fee_cents = 1500 flat
        (4) premium_cents = calculations.insurance_premium(gear_subtotal_cents, billable_days, plan) or 0 when uninsured
        (5) quoted_total_cents = gear_subtotal_cents + delivery_fee_cents + setup_fee_cents + premium_cents
      line.line_charge_cents = tiered_line (per line)
    input_set: "all lines of the reservation; CatalogItem rates read at quote time (snapshot per line at confirm)"
    constants:
      DELIVERY_FEE_TIER1_LIMIT: 10000
      DELIVERY_FEE_TIER2_LIMIT: 30000
      DELIVERY_FEE_TIER1: 2500
      DELIVERY_FEE_TIER2: 1500
      DELIVERY_FEE_TIER3: 0
      SETUP_FEE_CENTS: 1500
      TIER1_DAYS: 6
      TIER2_DAYS: 13
      TIER2_FACTOR: 0.85
      TIER3_FACTOR: 0.70
    precision: "integer cents; round_half_up wherever a factor is applied"
    variants:
      - name: provisional
        when: "at POST /reservations and amend-dates; based on planned dates"
        difference: "uses planned [start_date, end_date); stored in quoted_total_cents"
      - name: final
        when: "at POST /reservations/{id}/settle"
        difference: "final_total_cents = quoted_total_cents + extension_charge_cents + late_fee_cents; identical planned data with an approved extension or a late return therefore yields a different number than the provisional quote"

  - name: insurance_premium
    description: "Insurance premium for a reservation; the plan's pricing_model selects between two valid algorithms that produce different premiums for identical trip data."
    trigger: "inside provisional_quote (creation/amend) and again unchanged at settle"
    algorithm: threshold
    formula: |
      if plan.pricing_model == PER_DAY:   premium = round_half_up(rate_value) * billable_days
      if plan.pricing_model == PERCENT_OF_RENTAL: premium = round_half_up(gear_subtotal_cents * rate_value)
    input_set: "reservation.insurance_plan_id (null -> premium 0), gear_subtotal_cents, billable_days"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: per_day
        when: "plan.pricing_model == PER_DAY"
        difference: "premium scales with trip length only (e.g. 200 x 3 = 600)"
      - name: percent_of_rental
        when: "plan.pricing_model == PERCENT_OF_RENTAL"
        difference: "premium scales with gear value only (e.g. 0.08 x 9000 = 720); same reservation, different premium"

  - name: late_fee
    description: "Per-line late fee at settlement. Boundary: exactly GRACE_MINUTES late is free; one minute over bills a full first hour."
    trigger: "POST /reservations/{id}/settle"
    algorithm: threshold
    formula: |
      due_at = end_date T00:00:00Z   # reservation end_date (exclusive) at midnight UTC
      late_minutes = max(0, floor((returned_at - due_at) in minutes))
      if late_minutes <= 240: per-line fee = 0
      else:
        billable_hours = ceil((late_minutes - 240) / 60)
        hourly_late_rate = max(1, round_half_up(line.unit_rate_cents * 0.15))
        per-line fee = min(billable_hours * hourly_late_rate, 2 * line.unit_rate_cents)
      late_fee_cents = SUM(per-line fee over lines)
      late_return_count increments (once per reservation) iff late_minutes > 240
    input_set: "all lines of the reservation; reservation.returned_at and end_date"
    constants:
      GRACE_MINUTES: 240
      HOURLY_LATE_FACTOR: 0.15
      LATE_FEE_CAP_DAYS: 2
    precision: "integer cents, round_half_up; ceil for hours"

  - name: extension_charge
    description: "Charge for an approved extension, tiered by extension length; computed at approval and added to the reservation's extension_charge_cents."
    trigger: "POST /extensions/{id}/approve"
    algorithm: tiered_pricing
    formula: |
      ext_days = (requested_end_date - reservation.end_date at approval time).days  # >= 1
      per line: charge = round_half_up(unit_rate * 1.20) * min(ext_days, 2)
                        + round_half_up(unit_rate * 1.50) * max(0, ext_days - 2)
      extension_charge_cents = SUM(per-line charge)
    input_set: "allocated lines of the reservation (unit_rate_cents snapshots)"
    constants:
      EXT_TIER1_DAYS: 2
      EXT_TIER1_FACTOR: 1.20
      EXT_TIER2_FACTOR: 1.50
    precision: "integer cents, round_half_up per daily rate then multiply"

  - name: deposit_hold
    description: "Deposit hold at confirm; per-unit rounding pinned (round each unit's hold, then sum). Risk-tiered multiplier."
    trigger: "POST /reservations/{id}/confirm"
    algorithm: threshold
    formula: |
      multiplier = 1.5 if customer.risk_score >= 70 else 1.0
      per line: unit_hold = round_half_up(CatalogItem.deposit_amount_cents * multiplier)
      deposit_hold_cents = SUM(unit_hold)
    input_set: "confirmed lines; customer.risk_score at confirm time"
    constants:
      RISK_MULTIPLIER_THRESHOLD: 70
      RISK_MULTIPLIER: 1.5
    precision: "integer cents, round_half_up per unit BEFORE summing (rounding order pinned)"

  - name: damage_capture_amount
    description: "Customer-borne damage charge computed at claim approval. Mode-(a) combinatorial: >= 3 inputs with nested min/max and a branch on insurance coverage."
    trigger: "POST /damage-claims/{id}/approve"
    algorithm: tiered_pricing
    formula: |
      severity_factor = COSMETIC: 0.25 | MINOR: 0.60 | MAJOR: 1.00
      grade_factor    = A: 1.0 | B: 0.8 | C: 0.6   (of the assigned unit's condition_grade at approval)
      base = (severity == TOTAL_LOSS) ? catalog.deposit_amount_cents : repair_cost_cents
      charged = round_half_up(base * severity_factor_if_not_TOTAL_LOSS_else_1.0 * grade_factor)
      # i.e. TOTAL_LOSS: charged = round_half_up(deposit_amount_cents * grade_factor)
      if reservation.insurance_plan_id present AND severity in plan.covered_severities:
        capture = min(charged, plan.deductible_cents) + max(0, charged - plan.coverage_cap_cents)
      else:
        capture = charged
      claim.capture_amount_cents = capture
    input_set: "the claim, its line's assigned unit (grade), catalog item (deposit), reservation's insurance plan"
    constants: {}
    precision: "integer cents, round_half_up"

  - name: deposit_settlement_waterfall
    description: "Ordered waterfall that drains the deposit hold at settlement (or cancellation); remainder released. Conserved quantity: hold == captured + released."
    trigger: "POST /reservations/{id}/settle, POST /reservations/{id}/cancel from CONFIRMED"
    algorithm: waterfall_allocation
    formula: |
      bucket order (strict):
        1. APPROVED damage claims, processed in claim created_at ASC (ties impossible: created_at unique per append), each CAPTURE = min(claim.capture_amount_cents, remaining_hold); claim -> CAPTURED
        2. late_fee_cents (settle only): CAPTURE = min(late_fee_cents, remaining_hold) with reason LATE_FEE
        3. cancellation fee (cancel only): CAPTURE = min(round_half_up(quoted_total_cents * 0.10), remaining_hold) with reason CANCELLATION_FEE
        4. RELEASE remainder = remaining_hold with reason RELEASE_REMAINDER (only if > 0)
      deposit_captured_cents = SUM(CAPTURE); deposit_released_cents = SUM(RELEASE)
      INVARIANT: deposit_hold_cents == deposit_captured_cents + deposit_released_cents
      unrecovered shortfall (obligations beyond hold) is silently absorbed (no negative balances)
    input_set: "APPROVED claims on the reservation's lines, late_fee_cents, quoted_total_cents, deposit_hold_cents"
    constants:
      CANCELLATION_FEE_PCT: 0.10
    precision: "integer cents, round_half_up for the fee"

  - name: hotel_commission
    description: "Partner commission at settlement. Mode-(b) nested rounding: per-line rounding THEN summation is pinned; sum-then-round yields different cents and is wrong."
    trigger: "POST /reservations/{id}/settle (only when hotel_partner_id present)"
    algorithm: aggregation
    formula: |
      commission_cents = SUM over lines of round_half_up(line.line_charge_cents * partner.commission_pct)
      # PINNED ORDER: round each line first, then sum. round(SUM(line*pct)) is a different, incorrect value.
    input_set: "reservation lines (line_charge_cents at settle time = provisional charges; extensions do not change line_charge_cents), partner.commission_pct"
    constants: {}
    precision: "integer cents, round_half_up per line then integer sum"

  - name: availability_count
    description: "Forward-looking availability of a catalog item over a requested window; cleaning-turnaround buffer extends each committed interval (buffered half-open semantics)."
    trigger: "GET /catalog-items/{id}/availability; eligibility filter inside confirm / reallocate / extension approve"
    algorithm: forward_looking
    formula: |
      committed_interval(unit, res) = [res.start_dateT00:00Z, res.end_dateT00:00Z + catalog.cleaning_turnaround_hours)
      # buffered half-open: a follow-up rental may start exactly at the buffered end
      eligible(unit) for window [s, e):
        unit.catalog_item_id == item AND unit.status in {AVAILABLE, RESERVED, RENTED_OUT}
        AND (unit.blocked_until is null OR unit.blocked_until <= sT00:00Z)
        AND NOT any reservation res in {CONFIRMED, DELIVERED} holding a line assigned to unit
            with committed_interval overlapping [s, e)   # half-open overlap: s < ci_end AND ci_start < e
      available_count = COUNT(eligible units)
      # units in QUARANTINED, AWAITING_CLEANING, IN_CLEANING, RETIRED never count
    input_set: "all InventoryUnits of the catalog item; their assigned lines' reservations in {CONFIRMED, DELIVERED}"
    constants: {}
    precision: "integer count"

  - name: customer_risk_score
    description: "Weighted risk score with threshold triggers: >= 70 raises the deposit multiplier on future confirms; >= 90 auto-suspends at settlement."
    trigger: "recomputed at POST /reservations/{id}/settle after counters update"
    algorithm: weighted_scoring
    formula: |
      risk_score = min(100, 15 * late_return_count + 25 * captured_damage_count)
      thresholds: risk_score >= 70 -> deposit multiplier 1.5 (see deposit_hold)
                  risk_score >= 90 -> customer auto-transition ACTIVE -> SUSPENDED
    input_set: "customer.late_return_count, customer.captured_damage_count"
    constants:
      LATE_WEIGHT: 15
      DAMAGE_WEIGHT: 25
      MULTIPLIER_THRESHOLD: 70
      SUSPEND_THRESHOLD: 90
      SCORE_CAP: 100
    precision: "integer"

  - name: route_load_check
    description: "Aggregate-capacity overlap rule for routes (semantics distinct from unit booking windows: a shared weight pool, not interval adjacency)."
    trigger: "POST /routes/{id}/stops"
    algorithm: aggregation
    formula: |
      stop_weight(reservation) = SUM over reservation's lines of CatalogItem.weight_kg
      new_planned_weight = route.planned_weight_kg + stop_weight(reservation)
      allowed iff new_planned_weight <= vehicle_capacity_kg   # exact fit allowed (<=), any excess rejected
      on success: route.planned_weight_kg = new_planned_weight
    input_set: "route's stops in {SCHEDULED, COMPLETED} (FAILED/SKIPPED contribute 0), candidate reservation's lines"
    constants: {}
    precision: "kg, 1 decimal compare exact"

  - name: stop_sequence_assignment
    description: "Deterministic stop ordering within a route; recomputed on every stop add/skip."
    trigger: "POST /routes/{id}/stops, stop SKIPPED cascades"
    algorithm: chronological
    formula: |
      sequence over non-SKIPPED stops: order by time_window_start ASC; ties broken by created_at ASC (never by id)
    input_set: "route's stops in {SCHEDULED, COMPLETED, FAILED}"
    constants: {}
    precision: "integer sequence starting at 1"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — first match wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role is permitted for this endpoint per §1.5 roles; entity-backed ownership: Customer may only access reservations/lines/claims where reservation.customer_id == X-User-ID; HotelPartner may only read reservations where hotel_partner_id == X-User-ID"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path ids and body FK references exist, validated left-to-right (path first, then body)"
    error_id: ERR_CUSTOMER_NOT_FOUND | ERR_CATALOG_ITEM_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_PARTNER_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_RESERVATION_NOT_FOUND | ERR_LINE_NOT_FOUND | ERR_ROUTE_NOT_FOUND | ERR_STOP_NOT_FOUND | ERR_EXTENSION_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_RECALL_NOT_FOUND | ERR_TICKET_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: business_temporal
    check: "request shape: required fields present, types valid, enum members valid, email/serial/code uniqueness"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 5
    category: business_temporal
    check: "date/window sanity: end_date > start_date; amend/extension requested_end_date > current end_date; stop window within route_date and start < end"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /reservations, amend-dates, extensions, routes stops"
  - priority: 6
    category: state
    check: "state-machine preconditions: transition valid from current state (incl. terminal lockdown), stop complete requires route DISPATCHED, settle requires RETURNED, claim approve requires line/reservation RETURNED, route complete requires all stops terminal, recall close requires no QUARANTINED units, cleaning ticket creation requires unit AWAITING_CLEANING or QUARANTINED with no OPEN ticket"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: state
    check: "OCC: expected_reservation_version == reservation.version on amend-dates and extension create (checked after state preconditions)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /reservations/{id}/amend-dates, POST /reservations/{id}/extensions"
  - priority: 8
    category: business_safety
    check: "recall safety: confirm/reallocate blocked when the catalog item has an ACTIVE MANDATORY RecallNotice; a quarantined unit may never be allocated"
    error_id: ERR_RECALL_BLOCKED | ERR_UNIT_QUARANTINED
    http_status: 409
    applies_to: "POST /reservations/{id}/confirm, POST /reservation-lines/{id}/reallocate"
  - priority: 9
    category: business_temporal
    check: "temporal overlap: unit committed interval (incl. cleaning buffer) free for the whole window at confirm/reallocate; extension window [end_date, requested_end_date) free for every allocated unit; stop time windows on the same route non-overlapping (half-open)"
    error_id: ERR_UNIT_UNAVAILABLE | ERR_EXTENSION_WINDOW_CONFLICT | ERR_STOP_WINDOW_CONFLICT
    http_status: 409
    applies_to: "confirm, reallocate, POST /extensions/{id}/approve, POST /routes/{id}/stops"
  - priority: 10
    category: business_constraint
    check: "structural constraints: zone match (reservation vs partner, stop reservation vs route); partner ACTIVE; customer ACTIVE at confirm; catalog LISTED at confirm; route aggregate capacity; no duplicate stop (same reservation + stop_type on any PLANNED/DISPATCHED route); cleaning ticket type STANDARD rejected while deep-clean due; eligible unit exists"
    error_id: ERR_ZONE_MISMATCH | ERR_PARTNER_SUSPENDED | ERR_CUSTOMER_SUSPENDED | ERR_CATALOG_ITEM_DELISTED | ERR_ROUTE_CAPACITY_EXCEEDED | ERR_DUPLICATE_STOP | ERR_DEEP_CLEAN_REQUIRED | ERR_NO_ELIGIBLE_UNIT
    http_status: 422
    applies_to: "create/confirm/route/claim endpoints"
  - priority: 11
    category: business_constraint
    check: "segregation of duties: damage-claim approve/deny requires X-User-ID != claim.filed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /damage-claims/{id}/approve, POST /damage-claims/{id}/deny"
  - priority: 12
    category: business_fiscal
    check: "fiscal sanity: commission_pct in [0, 0.30]; PERCENT_OF_RENTAL rate_value in (0, 0.25]; PER_DAY rate_value a positive integer; rates/deposits > 0"
    error_id: ERR_INVALID_PLAN_RATE | ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "POST /insurance-plans, POST /hotel-partners, PATCH /hotel-partners/{id}, POST /catalog-items, PATCH /catalog-items/{id}"

