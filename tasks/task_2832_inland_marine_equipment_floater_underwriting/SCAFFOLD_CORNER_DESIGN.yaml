              captures: { polB: $.data.id }
            - call: "POST /inland-marine/policies/${polB}/coverage-parts"
              payload: { part_type: "REPORTING_FORM", valuation_basis: "ACV", deductible_cents: 100000, aggregate_limit_cents: 200000000, reporting_frequency: "MONTHLY", reporting_annual_rate_bp: 250, reporting_limit_cents: 20000000 }
              as: Underwriter
              captures: { cpB: $.data.id }
            - call: "POST /inland-marine/policies/${polB}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${polB}/bind"
