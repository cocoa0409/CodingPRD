              payload: { name: "Mercy General", hospital_code: "MERCY", timely_referral_window_minutes: 60 }
              as: OpoAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /opo/death-referrals"
              payload: { hospital_partner_id: "${hosp_id}", patient_mrn: "MRN-2001", age_years: 40, ventilated: true, gcs_score: 3, cause_of_death_category: "ANOXIA", trigger_event_at: "2026-09-03T07:30:00Z" }
              as: ReferralCoordinator
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /opo/death-referrals/${ref_id}/screenings"
              payload: {}
              as: ReferralCoordinator
              captures: { scr_id: $.data.id, scr_status: $.data.status, info_count: $.data.info_request_count, score: $.data.risk_score, tier: $.data.risk_tier, contra: $.data.absolute_contraindication, ver: $.data.version }
          assert:
            - "HTTP 201 with ${scr_status} == PENDING and ${ver} == 1"
            - "${info_count} == 0, ${score} == null, ${tier} == null, ${contra} == false"
            - "EligibilityScreening.${scr_id}.risk_variant_applied == null and risk_assessed_by_user_id == null"
            - "DeathReferral.${ref_id}.status == SCREENING: the parent moved in the same request"

      - name: clearing_the_screening_propagates_the_referral_to_screen_cleared
        claim_type: side_effect_execution
        grounds:
          - state_machines.EligibilityScreening.PENDING_to_CLEARED
          - state_machines.DeathReferral.SCREENING_to_SCREEN_CLEARED
          - endpoints[POST /opo/eligibility-screenings/{id}/decision]
        distinguishing_aspect: |
          The declared cross-entity side effect of a CLEARED decision fires in the same request: the
          screening records decided_by_user_id and the referral walks SCREENING -> SCREEN_CLEARED,
          which is what makes an authorization packet openable one call later.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-03T08:00:00Z with a PENDING screening that already carries a risk assessment scored by coord-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T08:00:00Z" }
              as: OpoAdmin
            - call: "POST /opo/hospital-partners"
              payload: { name: "Mercy General", hospital_code: "MERCY", timely_referral_window_minutes: 60 }
              as: OpoAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /opo/death-referrals"
              payload: { hospital_partner_id: "${hosp_id}", patient_mrn: "MRN-2101", age_years: 40, ventilated: true, gcs_score: 3, cause_of_death_category: "ANOXIA", trigger_event_at: "2026-09-03T07:30:00Z" }
              as: ReferralCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /opo/death-referrals/${ref_id}/screenings"
              payload: {}
              as: ReferralCoordinator
              captures: { scr_id: $.data.id, scr_v: $.data.version }
            - call: "POST /opo/eligibility-screenings/${scr_id}/risk-assessment"
              payload: { risk_factors: ["HEMODIALYSIS_12MO"], informant_reliability: "PRIMARY_NEXT_OF_KIN", expected_screening_version: "${scr_v}" }
              as: ReferralCoordinator
              as_user_id: "coord-1"
              captures: { score: $.data.risk_score, variant: $.data.risk_variant_applied, after_v: $.data.version }
          trigger:
            - call: "POST /opo/eligibility-screenings/${scr_id}/decision"
              payload: { decision: "CLEARED" }
              as: MedicalDirector
              as_user_id: "md-1"
              captures: { new_status: $.data.status }
            - call: "GET /opo/death-referrals/${ref_id}"
              payload: {}
              as: OpoAdmin
              captures: { ref_status: $.data.status }
          assert:
            - "${score} == 2.50 and ${variant} == INTERVIEW_BASED and ${after_v} == 2"
            - "${new_status} == CLEARED and EligibilityScreening.${scr_id}.decided_by_user_id == md-1"
            - "${ref_status} == SCREEN_CLEARED"
            - "EligibilityScreening.${scr_id}.ruled_out_reason == null"

      - name: second_screening_on_the_same_referral_is_rejected
        claim_type: invalid_transition
        grounds:
          - validations[priority 40]
          - errors.ERR_REFERRAL_NOT_SCREENABLE
          - state_machines.DeathReferral.RECEIVED_to_SCREENING
        distinguishing_aspect: "The RECEIVED -> SCREENING transition is one-shot: with the referral already in SCREENING and a screening row present, a second open attempt is refused and no duplicate screening appears."
        test_recipe:
          setup:
