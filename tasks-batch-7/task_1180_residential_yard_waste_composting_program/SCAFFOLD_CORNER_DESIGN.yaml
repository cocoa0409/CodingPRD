            - "capture ${err} == ERR_INSUFFICIENT_INVENTORY"

      - name: credit_segregation_same_user_rejected
        claim_type: violation_to_error
        grounds:
          - "state_machines.ServiceCredit.PENDING_APPROVAL_to_GRANTED"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
        distinguishing_aspect: "Segregation of duties: the operator who validated the missed pickup (X-User-ID ops_9) cannot approve the resulting credit even with the BillingClerk role; a different clerk approves successfully."
        test_recipe:
          setup: ["universal household ACTIVE; ticket 2026-05-04 reported missed; validated by ops_9 -> PENDING_APPROVAL credit 500"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "South", service_model: "UNIVERSAL", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 9000, universal_flat_credit_cents: 500 }, as: ProgramAdmin, captures: { zone_u: $.data.id } }
            - { call: "POST /households", payload: { address_line: "2 Elm St", zone_id: "${zone_u}" }, as: Anonymous, captures: { hh_a: $.data.id, hh_a_v: $.data.version } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_a}", season_year: 2026, expected_household_version: "${hh_a_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { sub_a: $.data.id } }
            - { call: "POST /routes", payload: { zone_id: "${zone_u}", weekday: "MONDAY", effective_start_date: "2026-05-01", effective_end_date: "2026-10-31", max_stops: 10, max_tonnage_lbs: 100000 }, as: ProgramAdmin, captures: { route_a: $.data.id } }
            - { call: "POST /routes/${route_a}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub_a}", route_id: "${route_a}", service_date: "2026-05-04" }, as: RouteSupervisor, as_user_id: "ops_9", captures: { t1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /pickup-tickets/${t1}/report-missed", payload: {}, as: Resident, as_user_id: "${hh_a}" }
            - { call: "POST /pickup-tickets/${t1}/validate-missed", payload: { validated: true }, as: RouteSupervisor, as_user_id: "ops_9" }
            - { call: "GET /service-credits?subscription_id=${sub_a}&status=PENDING_APPROVAL", as: BillingClerk, as_user_id: "clerk_1", captures: { cred: "$.data[0].id" } }
          trigger:
            - { call: "POST /service-credits/${cred}/approve", payload: {}, as: BillingClerk, as_user_id: "ops_9", captures: { err: $.data.error_id } }
            - { call: "POST /service-credits/${cred}/approve", payload: {}, as: BillingClerk, as_user_id: "clerk_1", captures: { ok: $.data.status } }
          assert:
            - "capture ${err} == ERR_SEGREGATION_OF_DUTIES"
            - "capture ${ok} == GRANTED"
            - "Household.${hh_a}.credit_balance_cents == 500"

