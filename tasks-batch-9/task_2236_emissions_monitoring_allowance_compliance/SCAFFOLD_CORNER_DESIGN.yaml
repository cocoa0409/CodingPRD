            - "no state moved: Facility.${fac_id}.version == 1, Unit.${unit_id}.dispatch_state == OFFLINE, MonitoringSystem.${cem_id}.qa_status == RECERTIFICATION_PENDING, QuarterlyReport.${q3_id}.version == ${q3_v1}, AllowanceAccount.${acct_id}.version == ${acct_v1} and AllowanceTransaction.${tx_id}.status == PROPOSED"
            - "GET /emissions/facilities returns total_count == 1 and GET /emissions/permit-limits?unit_id=${unit_id} returns total_count == 0"

