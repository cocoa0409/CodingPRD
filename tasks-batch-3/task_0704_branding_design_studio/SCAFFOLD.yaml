    side_effects: ["late_fee_cents and net_due_cents recomputed"]
  - method: POST
    path: "/studios/{studioId}/invoices/{invoiceId}/pay"
    description: "Record payment (ISSUED/OVERDUE->PAID); bubbles milestone to PAID"
