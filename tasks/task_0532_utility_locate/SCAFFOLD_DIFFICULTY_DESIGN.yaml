  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: meet_window_half_open_overlap_rejected
        grounds:
          - validations[priority=8]
          - state_machines.MeetRequest.REQUESTED_to_SCHEDULED
          - entities.MeetRequest.fields.proposed_start_min
        distinguishing_aspect: |
          MeetRequest overlap uses half-open [start,end) interval arithmetic on a single member:
          scheduling [100,200) then [150,250) collides (overlap) -> ERR_MEET_WINDOW_OVERLAP, whereas
          touching [200,300) would be allowed. Interval semantics: half-open, no buffer.
        test_recipe:
          setup:
            - "One member; two meet requests for it: first scheduled [100,200), second proposes [150,250)."
          setup_api_calls:
            - call: "POST /excavators"
              payload: { company_name: "DigCo", contact_email: "d15@x.com", state_code: "CA" }
              as: CallCenter
              captures: { exc_id: $.data.id }
            - call: "POST /member-utilities"
