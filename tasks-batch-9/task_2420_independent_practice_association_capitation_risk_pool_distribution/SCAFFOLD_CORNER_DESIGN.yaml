          rationale: "That §1.8 instance walks the appeal loop to appeal_count 2, asserts the third appeal is refused, and then takes the DENIED -> VOIDED branch that requires appeal_count == 2."

  # ===========================================================================
  - section: calculations
    instances:

      - name: pool_distribution_largest_remainder_across_two_participants
        claim_type: correct_result
        grounds:
          - calculations.pool_distribution_allocation
          - calculations.pool_settlement_waterfall
          - state_machines.RiskPool.RESERVED_to_SETTLEMENT_PROPOSED
          - entities.PoolDistribution
        distinguishing_aspect: |
          Two participants with equal member months but different composite
          scores split a shared-savings pool of 3348 cents. The exact shares are
          1806.157... and 1541.842...; flooring gives 3347, so the single
          leftover cent goes to the LARGER fractional part (P2, .842), producing
          1806 / 1542 — not 1807 / 1541 (leftover to the first participant) and
          not 1806 / 1541 (leftover dropped). The two shares must sum to exactly
          3348.
        test_recipe:
          setup:
            - "Agreement AGR_C1 is ACTIVE: base_pmpm_cents 20000, quality_withhold_bps 0, professional_pool_share_bps 10000, institutional_pool_share_bps 0, ibnr_method COMPLETION_FACTOR with ibnr_completion_factor_bps 8000, target_claims_pmpm_cents 15000, stop_loss_attachment_cents 5000000."
            - "Physicians PC1 (created first, npi 4100000001) and PC2 (npi 4100000002) are both ACTIVE; each holds one ADULT/HMO risk-10000 enrollee assigned from 2026-01-01, so each gross_pmpm_cents is 20000."
            - "The 2026-07 EnrollmentFile is POSTED, so the PROFESSIONAL 2026 pool has funded_cents 40000 and member_months_bps 20000."
            - "Two DownstreamClaims of 13520 each are PAID, so paid_claims_cents is 27040 and loss_ratio_bps is 6760 (no deficit)."
            - "Both physicians hold a FINAL 2026 scorecard: PC1 composite 8200, PC2 composite 7000, both withhold_release_bps 7500."
            - "Logical clock is 2027-01-01T00:00:00Z and the pool is RESERVED with ibnr_reserve_cents 6760."
