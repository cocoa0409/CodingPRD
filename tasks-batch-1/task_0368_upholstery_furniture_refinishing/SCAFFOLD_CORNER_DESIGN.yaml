          assert:
            - "WorkOrder.${wo_id}.promised_turnaround_days == 3"

      - name: estimate_total_forward_looking_no_rush
        claim_type: Variant Selection
        grounds: ["calculations.estimate_total", "entities.WorkOrder.fields.estimate_total_cents"]
        excluded_because:
          difficulty_instance: dual_variant_calc / workorder_estimate_vs_final_invoice_diverge
          rationale: "estimate_total forward-looking value (40300) is the estimate arm of that §1.8 dual-variant divergence instance."

      - name: material_provisional_cost_at_order
        claim_type: Variant Selection
        grounds: ["calculations.material_finalized_cost", "entities.MaterialOrder.fields.provisional_cost_cents"]
        excluded_because:
          difficulty_instance: dual_variant_calc / materialorder_provisional_vs_finalized_cost_diverge
          rationale: "provisional_cost_cents (10800) is the provisional arm of that §1.8 dual-variant instance."

