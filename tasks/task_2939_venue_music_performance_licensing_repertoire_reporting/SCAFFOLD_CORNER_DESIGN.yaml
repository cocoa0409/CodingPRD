              payload: { license_id: "${lic_p1_id}" }
              as: LicensingAdmin
              captures: { fa_p1_id: "$.data[0].id" }
            - call: "GET /licensing/licenses/${lic_p1_id}"
              payload: {}
              as: LicensingAdmin
              captures: { bill0: "$.data.billing_status", cov0: "$.data.coverage_status" }
          trigger:
            - call: "POST /licensing/fee-assessments/${fa_p1_id}/pay"
              payload: { amount_cents: 213760 }
              as: VenueOperator
              as_user_id: "${p1_id}"
              captures: { paid1: "$.data.paid_amount_cents", st1: "$.data.status" }
            - call: "GET /licensing/licenses/${lic_p1_id}"
              payload: {}
              as: LicensingAdmin
              captures: { bill1: "$.data.billing_status" }
            - call: "POST /licensing/fee-assessments/${fa_p1_id}/pay"
              payload: { amount_cents: 1 }
              as: VenueOperator
              as_user_id: "${p1_id}"
              captures: { paid2: "$.data.paid_amount_cents", st2: "$.data.status" }
            - call: "GET /licensing/licenses/${lic_p1_id}"
              payload: {}
              as: LicensingAdmin
              captures: { bill2: "$.data.billing_status" }
          assert:
            - "${bill0} is DELINQUENT and ${cov0} is ACTIVE, so activation pushed the billing dimension past the threshold without touching coverage"
            - "After the 213760-cent payment ${paid1} is 213760 and Venue.${p1_id}.outstanding_balance_cents is 250001, one cent above the tolerance, so ${bill1} is still DELINQUENT"
            - "After the single further cent ${paid2} is 213761 and outstanding_balance_cents is exactly 250000, so ${bill2} is INVOICED"
