  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_occ_stale_member_version_on_statement_generate
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[statement-generate-stale-member]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "First generate with expected_member_version 1 succeeds (member.version->2); a second generate still carrying version 1 -> ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["Member owned 5000 (version 1). One statement already generated (member.version now 2)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "Occ", email: "occ@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m: "$.data.id", mv: "$.data.version" } }
            - { call: "POST /club/members/${m}/statements", payload: { expected_member_version: "${mv}" }, as: ClubAdmin, captures: { st1: "$.data.id" } }
          trigger:
            - { call: "POST /club/members/${m}/statements", payload: { expected_member_version: "${mv}" }, as: ClubAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: corner_derived_reconcile_available_after_partial_refund
        claim_type: derived_field_reconciliation
        grounds: [calculations.bucket_available_points, entities.Reservation.fields.refunded_points]
        distinguishing_aspect: "points_available is reconciled after a PARTIAL cancel: book 1000 (available 4000) then partial-cancel refunds 500 -> available 4500."
        test_recipe:
          setup: ["Member owned 5000 holds Aug 10-14 (cost 1000). Clock default 2026-07-01 (days_out 40 -> PARTIAL)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "Dr", email: "dr@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m: "$.data.id" } }
            - { call: "GET /club/members/${m}/points-buckets", payload: {}, as: ClubAdmin, captures: { b: "$.data[0].id" } }
            - { call: "POST /club/resorts", payload: { name: "R", region: "FL" }, as: ClubAdmin, captures: { r: "$.data.id" } }
            - { call: "POST /club/resorts/${r}/unit-types", payload: { name: "2BR", total_units: 1, points_weekday_low: 150, points_weekend_low: 200, points_weekday_high: 250, points_weekend_high: 350 }, as: ClubAdmin, captures: { ut: "$.data.id" } }
            - { call: "POST /club/reservations", payload: { member_id: "${m}", unit_type_id: "${ut}", points_bucket_id: "${b}", check_in: "2026-08-10", check_out: "2026-08-14" }, as: Member, as_user_id: "${m}", captures: { res: "$.data.id" } }
          trigger:
            - { call: "POST /club/reservations/${res}/cancel", payload: {}, as: Member, as_user_id: "${m}" }
          assert:
            - "PointsBucket.${b}.points_used == 500 and points_available == 4500"

