        payload:
          release_id: ${rel}
          quantity_ordered: 1000
          sides: 2
          plating_route: TWO_STEP
          variants:
          - color_config: BLACK
            quantity: 1000
        as: CustomerServiceRep
        captures:
          ord1: $.data.id
          ord1_v: $.data.version
      - call: POST /press-orders/${ord1}/quotes
        payload:
          expected_press_order_version: ${ord1_v}
        as: CustomerServiceRep
        captures:
          ord1_v2: $.data.version
          q1_total: $.data.quote_total_cents
          q1_pct: $.data.discount_pct_snapshot
      - call: POST /customers/${cust}/credit-status
        payload:
          action: SUSPEND
        as: BillingClerk
      trigger:
      - call: POST /press-orders/${ord1}/confirm
        payload:
          expected_press_order_version: ${ord1_v2}
        as: Customer
        as_user_id: ${cust}
        captures:
          err: $.data.error_id
      - call: POST /press-orders
        payload:
          release_id: ${rel}
          quantity_ordered: 1000
          sides: 2
          plating_route: TWO_STEP
          variants:
          - color_config: BLACK
            quantity: 1000
        as: CustomerServiceRep
        captures:
          ord2: $.data.id
          ord2_v: $.data.version
      - call: POST /press-orders/${ord2}/quotes
        payload:
          expected_press_order_version: ${ord2_v}
        as: CustomerServiceRep
        captures:
          q2_pct: $.data.discount_pct_snapshot
          q2_total: $.data.quote_total_cents
      - call: POST /customers/${cust}/credit-status
        payload:
          action: REINSTATE
        as: BillingClerk
      - call: POST /press-orders/${ord1}/confirm
        payload:
          expected_press_order_version: ${ord1_v2}
        as: Customer
        as_user_id: ${cust}
        captures:
          st1: $.data.production_status
      assert:
      - 'order1 quoted while ACTIVE: discount_pct_snapshot == 0.05, quote_total_cents == 425999'
      - confirm while SUSPENDED -> error_id == ERR_CUSTOMER_SUSPENDED (409)
      - 'order2 quoted while SUSPENDED: discount_pct_snapshot == 0, quote_total_cents == 448420'
      - 'after REINSTATE: confirm succeeds (production_status == CONFIRMED)'
