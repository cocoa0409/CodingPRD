        claim_type: violation_to_error
        grounds: ["errors[ERR_AUDIT_TYPE_NOT_APPLICABLE]"]
        distinguishing_aspect: "NEW_ENTRANT audits only apply to carriers whose new_entrant_status is PENDING_AUDIT: a regular carrier gets ERR_AUDIT_TYPE_NOT_APPLICABLE."
        test_recipe:
          setup: ["regular carrier (is_new_entrant false)"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2338", legal_name: "Regular Carrier", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /safety/compliance-audit-cases", payload: { carrier_id: "${c_id}", audit_type: "NEW_ENTRANT", scheduled_date: "2026-08-01T00:00:00Z", field_work_duration_days: 7 }, as: SafetyAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_AUDIT_TYPE_NOT_APPLICABLE (409)"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: audit_readiness_computed_read
        claim_type: computed_read
        grounds: ["endpoints[GET /safety/carriers/{id}/audit-readiness]"]
        distinguishing_aspect: "Computed read walks its two rules live: each ACTIVE driver needs a RETAINED DQ_FILE (missing_dq_driver_count), and reportable accidents need matching RETAINED ACCIDENT_REGISTER_ENTRY documents (accident_register_gap)."
        test_recipe:
          setup: ["carrier with two ACTIVE drivers, one DQ_FILE (covers d1 only)"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2401", legal_name: "Ready Read Carrier", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-2401A", full_name: "Ali One", hire_date: "2025-01-01T00:00:00Z" }, as: SafetyManager, captures: { d1: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-2401B", full_name: "Ali Two", hire_date: "2025-01-01T00:00:00Z" }, as: SafetyManager, captures: { d2: $.data.id } }
            - { call: "POST /safety/document-records", payload: { carrier_id: "${c_id}", driver_id: "${d1}", document_type: "DQ_FILE", filed_at: "2026-01-01T00:00:00Z" }, as: SafetyManager }
          trigger:
            - { call: "GET /safety/carriers/${c_id}/audit-readiness", payload: {}, as: SafetyManager, captures: { r1_ready: $.data.ready, r1_missing: $.data.missing_dq_driver_count } }
            - { call: "POST /safety/document-records", payload: { carrier_id: "${c_id}", driver_id: "${d2}", document_type: "DQ_FILE", filed_at: "2026-01-01T00:00:00Z" }, as: SafetyManager }
            - { call: "GET /safety/carriers/${c_id}/audit-readiness", payload: {}, as: SafetyManager, captures: { r2_ready: $.data.ready } }
            - { call: "POST /safety/accident-records", payload: { carrier_id: "${c_id}", driver_id: "${d1}", occurred_at: "2026-06-01T00:00:00Z", fatalities: 0, injuries: 1, tow_away: false }, as: SafetyManager, as_user_id: "sm-1" }
            - { call: "GET /safety/carriers/${c_id}/audit-readiness", payload: {}, as: SafetyManager, captures: { r3_ready: $.data.ready, r3_gap: $.data.accident_register_gap } }
            - { call: "POST /safety/document-records", payload: { carrier_id: "${c_id}", document_type: "ACCIDENT_REGISTER_ENTRY", filed_at: "2026-06-02T00:00:00Z" }, as: SafetyManager }
            - { call: "GET /safety/carriers/${c_id}/audit-readiness", payload: {}, as: SafetyManager, captures: { r4_ready: $.data.ready, r4_open: $.data.open_audit_case_count } }
          assert:
            - "step 1: ready == false, missing_dq_driver_count == 1 (d2 lacks DQ_FILE)"
            - "step 2: ready == true after d2's DQ_FILE"
            - "step 3: ready == false, accident_register_gap == 1 (reportable accident without register entry)"
            - "step 4: ready == true, accident_register_gap == 0, open_audit_case_count == 0"

