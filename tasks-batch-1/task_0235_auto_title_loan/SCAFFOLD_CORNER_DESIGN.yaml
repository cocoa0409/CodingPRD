scaffold_corner_design:

  # ===================================================================
  # Entities — creation, required fields, defaults, computed/system, not-found, enum
  # ===================================================================
  - section: entities
    instances:
      - name: create_borrower_success_returns_active_status
        claim_type: Creation
        grounds: [entities.Borrower.fields.status, endpoints]
        distinguishing_aspect: "POST /atl/borrowers with all required fields returns 201 with status defaulting to ACTIVE and a server-minted id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /atl/borrowers"
              payload: { email: "newb@x.com", full_name: "New B", state_code: "CA", monthly_income_cents: 400000 }
              as: Underwriter
              captures: { bid: $.data.id }
          trigger:
            - call: "GET /atl/borrowers/${bid}"
              payload: {}
              as: Underwriter
              captures: { st: $.data.status }
          assert:
            - "Borrower.status == ACTIVE"
            - "Borrower.id is a non-empty UUID without a type prefix"

      - name: create_borrower_missing_state_code_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Borrower.fields.state_code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /atl/borrowers omitting required state_code returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /atl/borrowers"
              payload: { email: "nob@x.com", full_name: "No State", monthly_income_cents: 400000 }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (422)"

      - name: create_borrower_invalid_state_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Borrower.fields.state_code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "state_code not in {CA,TX,FL,VA,AZ} (e.g. 'NY') returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /atl/borrowers"
              payload: { email: "ny@x.com", full_name: "NY Person", state_code: "NY", monthly_income_cents: 400000 }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (422)"

      - name: get_loan_nonexistent_id_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]", endpoints]
        distinguishing_aspect: "GET /atl/loans/{id} with a random non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /atl/loans/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LoanServicer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND (404)"

      - name: appraisal_status_defaults_to_draft_on_create
        claim_type: Defaults
        grounds: [entities.Appraisal.fields.status]
        distinguishing_aspect: "POST /atl/appraisals returns status defaulting to DRAFT; basis_value_cents and max_principal_cents are null/absent until finalize."
        test_recipe:
          setup: ["CA profile, borrower, vehicle"]
          setup_api_calls:
            - call: "POST /atl/regulatory-profiles"
              payload: { state_code: "CA", max_apr_bps: 3600, max_ltv_bps: 5000, max_renewals: 2, min_term_months: 3, max_term_months: 24, redemption_grace_days: 10, valuation_basis: "AUCTION" }
              as: ComplianceAdmin
            - call: "POST /atl/borrowers"
              payload: { email: "dr@x.com", full_name: "Draft B", state_code: "CA", monthly_income_cents: 400000 }
              as: Underwriter
              captures: { b: $.data.id }
            - call: "POST /atl/vehicles"
              payload: { borrower_id: "${b}", vin: "VINDRAFT01", year: 2018, make: "Honda", model: "Fit", odometer_miles: 50000 }
              as: Appraiser
              captures: { v: $.data.id }
          trigger:
            - call: "POST /atl/appraisals"
              payload: { vehicle_id: "${v}", trade_in_value_cents: 2000000, auction_value_cents: 1600000, condition_grade: "GOOD" }
              as: Appraiser
              captures: { st: $.data.status }
          assert:
            - "Appraisal.status == DRAFT"

      - name: appraisal_computed_fields_set_on_finalize
        claim_type: Computed Fields
        grounds: [entities.Appraisal.fields.basis_value_cents, calculations.appraisal_basis_value]
        excluded_because:
          difficulty_instance: combinatorial_formula / appraisal_basis_nested_haircut_ltv_mode_a
          rationale: "basis_value_cents/max_principal_cents correctness on finalize is asserted by the named §1.8 instance."

      - name: loan_system_fields_minted_at_origination
        claim_type: System Fields
        grounds: [entities.Loan.fields.original_principal_cents, endpoints]
        distinguishing_aspect: "Loan.id and original_principal_cents are server-minted at approval; original_principal_cents == requested_principal_cents (600000) and principal_balance_cents starts at 600000."
        test_recipe:
          setup: ["CA loan approved with requested_principal_cents 600000"]
          setup_api_calls:
            - call: "POST /atl/regulatory-profiles"
              payload: { state_code: "CA", max_apr_bps: 3600, max_ltv_bps: 5000, max_renewals: 2, min_term_months: 3, max_term_months: 24, redemption_grace_days: 10, valuation_basis: "AUCTION" }
              as: ComplianceAdmin
            - call: "POST /atl/borrowers"
              payload: { email: "sys@x.com", full_name: "Sys B", state_code: "CA", monthly_income_cents: 500000 }
              as: Underwriter
              captures: { b: $.data.id }
            - call: "POST /atl/vehicles"
              payload: { borrower_id: "${b}", vin: "VINSYS001", year: 2019, make: "Mazda", model: "6", odometer_miles: 40000 }
              as: Appraiser
              captures: { v: $.data.id }
            - call: "POST /atl/appraisals"
              payload: { vehicle_id: "${v}", trade_in_value_cents: 2000000, auction_value_cents: 1600000, condition_grade: "GOOD" }
              as: Appraiser
              captures: { a: $.data.id }
            - call: "POST /atl/appraisals/${a}/finalize"
              payload: {}
              as: Appraiser
              as_user_id: "appr-sys"
            - call: "POST /atl/applications"
              payload: { borrower_id: "${b}", appraisal_id: "${a}", requested_principal_cents: 600000, contract_apr_bps: 3600, term_months: 3 }
              as: Underwriter
              captures: { app: $.data.id }
            - call: "POST /atl/applications/${app}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw-sys"
              captures: { loan: $.data.id }
          trigger:
            - call: "GET /atl/loans/${loan}"
              payload: {}
              as: LoanServicer
              captures: { op: $.data.original_principal_cents, pb: $.data.principal_balance_cents }
          assert:
            - "Loan.original_principal_cents == 600000"
            - "Loan.principal_balance_cents == 600000"

  # ===================================================================
  # State machines — invalid transition, terminal lockdown, idempotency, side effects
  # ===================================================================
  - section: state_machines
    instances:
      - name: finalize_already_finalized_appraisal_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Appraisal.DRAFT_to_FINALIZED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Finalizing an Appraisal already in FINALIZED returns ERR_INVALID_STATE (409); no recompute."
        test_recipe:
          setup: ["CA profile, vehicle, appraisal finalized"]
          setup_api_calls:
            - call: "POST /atl/regulatory-profiles"
              payload: { state_code: "CA", max_apr_bps: 3600, max_ltv_bps: 5000, max_renewals: 2, min_term_months: 3, max_term_months: 24, redemption_grace_days: 10, valuation_basis: "AUCTION" }
              as: ComplianceAdmin
            - call: "POST /atl/borrowers"
              payload: { email: "ff@x.com", full_name: "FF", state_code: "CA", monthly_income_cents: 500000 }
              as: Underwriter
              captures: { b: $.data.id }
            - call: "POST /atl/vehicles"
              payload: { borrower_id: "${b}", vin: "VINFF0001", year: 2019, make: "Mazda", model: "6", odometer_miles: 40000 }
              as: Appraiser
              captures: { v: $.data.id }
            - call: "POST /atl/appraisals"
              payload: { vehicle_id: "${v}", trade_in_value_cents: 2000000, auction_value_cents: 1600000, condition_grade: "GOOD" }
              as: Appraiser
              captures: { a: $.data.id }
            - call: "POST /atl/appraisals/${a}/finalize"
              payload: {}
              as: Appraiser
              as_user_id: "appr-ff"
          trigger:
            - call: "POST /atl/appraisals/${a}/finalize"
              payload: {}
              as: Appraiser
              as_user_id: "appr-ff"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409)"

      - name: approve_already_approved_application_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.LoanApplication.SUBMITTED_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving an application already APPROVED returns ERR_INVALID_STATE (409); no second loan created."
        test_recipe:
          setup: ["CA application approved"]
          setup_api_calls:
            - call: "POST /atl/regulatory-profiles"
              payload: { state_code: "CA", max_apr_bps: 3600, max_ltv_bps: 5000, max_renewals: 2, min_term_months: 3, max_term_months: 24, redemption_grace_days: 10, valuation_basis: "AUCTION" }
              as: ComplianceAdmin
            - call: "POST /atl/borrowers"
              payload: { email: "ap@x.com", full_name: "AP", state_code: "CA", monthly_income_cents: 500000 }
              as: Underwriter
              captures: { b: $.data.id }
            - call: "POST /atl/vehicles"
              payload: { borrower_id: "${b}", vin: "VINAP0001", year: 2019, make: "Mazda", model: "6", odometer_miles: 40000 }
              as: Appraiser
              captures: { v: $.data.id }
            - call: "POST /atl/appraisals"
              payload: { vehicle_id: "${v}", trade_in_value_cents: 2000000, auction_value_cents: 1600000, condition_grade: "GOOD" }
              as: Appraiser
              captures: { a: $.data.id }
            - call: "POST /atl/appraisals/${a}/finalize"
              payload: {}
              as: Appraiser
              as_user_id: "appr-ap"
            - call: "POST /atl/applications"
              payload: { borrower_id: "${b}", appraisal_id: "${a}", requested_principal_cents: 600000, contract_apr_bps: 3600, term_months: 3 }
              as: Underwriter
              captures: { app: $.data.id }
            - call: "POST /atl/applications/${app}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw-ap"
          trigger:
            - call: "POST /atl/applications/${app}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw-ap2"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409)"

      - name: declare_default_on_current_loan_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Loan.DELINQUENT_to_DEFAULT, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "declare-default on a loan whose delinquency_status is CURRENT (not DELINQUENT) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["CA loan CURRENT (no delinquency assessed)"]
          setup_api_calls:
            - call: "POST /atl/regulatory-profiles"
              payload: { state_code: "CA", max_apr_bps: 3600, max_ltv_bps: 5000, max_renewals: 2, min_term_months: 3, max_term_months: 24, redemption_grace_days: 10, valuation_basis: "AUCTION" }
              as: ComplianceAdmin
            - call: "POST /atl/borrowers"
              payload: { email: "dc@x.com", full_name: "DC", state_code: "CA", monthly_income_cents: 500000 }
              as: Underwriter
              captures: { b: $.data.id }
            - call: "POST /atl/vehicles"
              payload: { borrower_id: "${b}", vin: "VINDC0001", year: 2019, make: "Mazda", model: "6", odometer_miles: 40000 }
              as: Appraiser
              captures: { v: $.data.id }
            - call: "POST /atl/appraisals"
              payload: { vehicle_id: "${v}", trade_in_value_cents: 2000000, auction_value_cents: 1600000, condition_grade: "GOOD" }
              as: Appraiser
              captures: { a: $.data.id }
            - call: "POST /atl/appraisals/${a}/finalize"
              payload: {}
              as: Appraiser
              as_user_id: "appr-dc"
            - call: "POST /atl/applications"
              payload: { borrower_id: "${b}", appraisal_id: "${a}", requested_principal_cents: 600000, contract_apr_bps: 3600, term_months: 3 }
              as: Underwriter
              captures: { app: $.data.id }
            - call: "POST /atl/applications/${app}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw-dc"
              captures: { loan: $.data.id }
          trigger:
            - call: "POST /atl/loans/${loan}/declare-default"
              payload: {}
              as: LoanServicer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409)"

      - name: file_lien_already_released_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.TitleLien.FILED_to_RELEASED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "After loan PAID_OFF releases the lien (RELEASED is terminal), filing the same lien again returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["CA loan PAID_OFF via REGULAR full payment; lien FILED then RELEASED by cascade"]
          setup_api_calls:
            - call: "POST /atl/regulatory-profiles"
              payload: { state_code: "CA", max_apr_bps: 3600, max_ltv_bps: 5000, max_renewals: 2, min_term_months: 3, max_term_months: 24, redemption_grace_days: 10, valuation_basis: "AUCTION" }
              as: ComplianceAdmin
            - call: "POST /atl/borrowers"
              payload: { email: "tl@x.com", full_name: "TL", state_code: "CA", monthly_income_cents: 500000 }
              as: Underwriter
              captures: { b: $.data.id }
            - call: "POST /atl/vehicles"
              payload: { borrower_id: "${b}", vin: "VINTL0001", year: 2019, make: "Mazda", model: "6", odometer_miles: 40000 }
              as: Appraiser
              captures: { v: $.data.id }
            - call: "POST /atl/appraisals"
              payload: { vehicle_id: "${v}", trade_in_value_cents: 2000000, auction_value_cents: 1600000, condition_grade: "GOOD" }
              as: Appraiser
              captures: { a: $.data.id }
            - call: "POST /atl/appraisals/${a}/finalize"
              payload: {}
              as: Appraiser
              as_user_id: "appr-tl"
            - call: "POST /atl/applications"
              payload: { borrower_id: "${b}", appraisal_id: "${a}", requested_principal_cents: 600000, contract_apr_bps: 3600, term_months: 3 }
              as: Underwriter
              captures: { app: $.data.id }
            - call: "POST /atl/applications/${app}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw-tl"
              captures: { loan: $.data.id }
            - call: "GET /atl/loans/${loan}/title-liens"
              payload: {}
              as: TitleClerk
              captures: { lien: "$.data[0].id" }
            - call: "POST /atl/title-liens/${lien}/file"
              payload: { dmv_reference: "DMV-TL-1" }
              as: TitleClerk
            - call: "POST /atl/loans/${loan}/payments"
              payload: { amount_cents: 600000, payment_type: "REGULAR" }
              as: LoanServicer
          trigger:
            - call: "POST /atl/title-liens/${lien}/file"
              payload: { dmv_reference: "DMV-TL-2" }
              as: TitleClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409)"

      - name: paid_off_full_regular_payment_releases_lien
        claim_type: Side Effect Execution
        grounds: [state_machines.Loan.OUTSTANDING_to_PAID_OFF, entities.Vehicle.fields.lien_state]
        distinguishing_aspect: "A REGULAR payment of 600000 on a clean loan zeroes all balances, drives Loan->PAID_OFF, releases the FILED lien, and sets Vehicle.lien_state CLEAR."
        test_recipe:
          setup: ["CA loan, lien FILED, no delinquency"]
          setup_api_calls:
            - call: "POST /atl/regulatory-profiles"
              payload: { state_code: "CA", max_apr_bps: 3600, max_ltv_bps: 5000, max_renewals: 2, min_term_months: 3, max_term_months: 24, redemption_grace_days: 10, valuation_basis: "AUCTION" }
              as: ComplianceAdmin
            - call: "POST /atl/borrowers"
              payload: { email: "po@x.com", full_name: "PO", state_code: "CA", monthly_income_cents: 500000 }
              as: Underwriter
              captures: { b: $.data.id }
            - call: "POST /atl/vehicles"
              payload: { borrower_id: "${b}", vin: "VINPO0001", year: 2019, make: "Mazda", model: "6", odometer_miles: 40000 }
              as: Appraiser
              captures: { v: $.data.id }
            - call: "POST /atl/appraisals"
              payload: { vehicle_id: "${v}", trade_in_value_cents: 2000000, auction_value_cents: 1600000, condition_grade: "GOOD" }
              as: Appraiser
              captures: { a: $.data.id }
            - call: "POST /atl/appraisals/${a}/finalize"
              payload: {}
              as: Appraiser
              as_user_id: "appr-po"
            - call: "POST /atl/applications"
              payload: { borrower_id: "${b}", appraisal_id: "${a}", requested_principal_cents: 600000, contract_apr_bps: 3600, term_months: 3 }
              as: Underwriter
              captures: { app: $.data.id }
            - call: "POST /atl/applications/${app}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw-po"
              captures: { loan: $.data.id }
            - call: "GET /atl/loans/${loan}/title-liens"
              payload: {}
              as: TitleClerk
              captures: { lien: "$.data[0].id" }
            - call: "POST /atl/title-liens/${lien}/file"
              payload: { dmv_reference: "DMV-PO-1" }
              as: TitleClerk
          trigger:
            - call: "POST /atl/loans/${loan}/payments"
              payload: { amount_cents: 600000, payment_type: "REGULAR" }
              as: LoanServicer
            - call: "GET /atl/loans/${loan}"
              payload: {}
              as: LoanServicer
              captures: { ps: $.data.payoff_status }
            - call: "GET /atl/vehicles/${v}"
              payload: {}
              as: LoanServicer
              captures: { ls: $.data.lien_state }
          assert:
            - "Loan.payoff_status == PAID_OFF"
            - "TitleLien.${lien}.status == RELEASED"
            - "Vehicle.${v}.lien_state == CLEAR"

  # ===================================================================
  # Calculations — late fee, waterfall, redemption deadline, overpayment
  # ===================================================================
  - section: calculations
    instances:
      - name: late_fee_assessment_two_installments_flat_cap
        claim_type: Constants Applied
        grounds: [calculations.late_fee_assessment, entities.Installment.fields.late_fee_cents]
        distinguishing_aspect: "Assessing delinquency at clock 03-15 charges the 5000-cent cap on each of seq1 and seq2 (5% of large principal exceeds the cap), so fees_balance_cents == 10000."
        test_recipe:
          setup: ["CA loan; clock advanced to 2026-03-15 so seq1+seq2 past due"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /atl/regulatory-profiles"
              payload: { state_code: "CA", max_apr_bps: 3600, max_ltv_bps: 5000, max_renewals: 2, min_term_months: 3, max_term_months: 24, redemption_grace_days: 10, valuation_basis: "AUCTION" }
              as: ComplianceAdmin
            - call: "POST /atl/borrowers"
              payload: { email: "lf@x.com", full_name: "LF", state_code: "CA", monthly_income_cents: 500000 }
              as: Underwriter
              captures: { b: $.data.id }
            - call: "POST /atl/vehicles"
              payload: { borrower_id: "${b}", vin: "VINLF0001", year: 2019, make: "Mazda", model: "6", odometer_miles: 40000 }
              as: Appraiser
              captures: { v: $.data.id }
            - call: "POST /atl/appraisals"
              payload: { vehicle_id: "${v}", trade_in_value_cents: 2000000, auction_value_cents: 1600000, condition_grade: "GOOD" }
              as: Appraiser
              captures: { a: $.data.id }
            - call: "POST /atl/appraisals/${a}/finalize"
              payload: {}
              as: Appraiser
              as_user_id: "appr-lf"
            - call: "POST /atl/applications"
              payload: { borrower_id: "${b}", appraisal_id: "${a}", requested_principal_cents: 600000, contract_apr_bps: 3600, term_months: 3 }
              as: Underwriter
              captures: { app: $.data.id }
            - call: "POST /atl/applications/${app}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw-lf"
              captures: { loan: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00.000Z" }
              as: ComplianceAdmin
          trigger:
            - call: "POST /atl/loans/${loan}/assess-delinquency"
              payload: {}
              as: LoanServicer
              captures: { fb: $.data.fees_balance_cents }
          assert:
            - "Loan.fees_balance_cents == 10000"
            - "Loan.delinquency_status == DELINQUENT"

      - name: regular_payment_waterfall_fees_then_interest_then_principal
        claim_type: Correct Result
        grounds: [calculations.payment_allocation, entities.Payment.fields.fees_applied_cents]
        distinguishing_aspect: "On a DELINQUENT loan (fees 10000, accrued_interest 30176, principal 600000) a REGULAR payment of 15000 allocates fees 10000, interest 5000, principal 0, overpayment 0 by the fixed waterfall order."
        test_recipe:
          setup: ["CA loan DELINQUENT at clock 03-15; fees 10000, accrued_interest 30176"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /atl/regulatory-profiles"
              payload: { state_code: "CA", max_apr_bps: 3600, max_ltv_bps: 5000, max_renewals: 2, min_term_months: 3, max_term_months: 24, redemption_grace_days: 10, valuation_basis: "AUCTION" }
              as: ComplianceAdmin
            - call: "POST /atl/borrowers"
              payload: { email: "wf@x.com", full_name: "WF", state_code: "CA", monthly_income_cents: 500000 }
              as: Underwriter
              captures: { b: $.data.id }
            - call: "POST /atl/vehicles"
              payload: { borrower_id: "${b}", vin: "VINWF0001", year: 2019, make: "Mazda", model: "6", odometer_miles: 40000 }
              as: Appraiser
              captures: { v: $.data.id }
            - call: "POST /atl/appraisals"
              payload: { vehicle_id: "${v}", trade_in_value_cents: 2000000, auction_value_cents: 1600000, condition_grade: "GOOD" }
              as: Appraiser
              captures: { a: $.data.id }
            - call: "POST /atl/appraisals/${a}/finalize"
              payload: {}
              as: Appraiser
              as_user_id: "appr-wf"
            - call: "POST /atl/applications"
              payload: { borrower_id: "${b}", appraisal_id: "${a}", requested_principal_cents: 600000, contract_apr_bps: 3600, term_months: 3 }
              as: Underwriter
              captures: { app: $.data.id }
            - call: "POST /atl/applications/${app}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw-wf"
              captures: { loan: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00.000Z" }
