          setup:
            - "Rule ALC_SPIRITS (RESTRICTED, weight 6.00, requires_certification true, requires_disclaimer true, confidence_auto_disapprove_threshold 0.90, confidence_manual_threshold 0.55, sla 48, default_queue REGULATED_CERT) with overrides SE BLOCKED 2.00 and US RESTRICTED_CERT_REQUIRED requires_license true 1.50."
            - "One advertiser with identity_status and business_standing_status both VERIFIED so that a below-threshold run can legally reach AUTO_APPROVED."
            - "Four creatives, each declaring ALC_SPIRITS and each carrying disclaimer_text: crHigh and crLow target SE and US (so the strictest disposition is BLOCKED), while cr55 and cr54 target US only."
            - "Each creative is submitted and then screened in its own run with a single ALC_SPIRITS decision at confidence 0.90, 0.89, 0.55 and 0.54 respectively."
