              captures: { tech_id: "$.data.id" }
            - call: "POST /clients/${cl_id}/credit-adjustments"
              payload: { amount_cents: 200000, memo: "opening funds" }
              as: ShopManager
            - call: "POST /instruments/${inst_id}/pitch-assessments"
              payload: { reference_pitch_hz: 440.0, measured_deviation_cents: 2.0 }
              as: ShopManager
            - call: "POST /instruments/${inst_id}/condition-transitions"
              payload: { to_condition_status: "SERVICEABLE", note: "assessed" }
              as: ShopManager
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: ShopManager
              captures: { inst_v: "$.data.version" }
            - call: "POST /quotes"
              payload: { instrument_id: "${inst_id}", service_type: "VOICE", expected_instrument_version: "${inst_v}" }
              as: ShopManager
              captures: { q_id: "$.data.id" }
            - call: "POST /quotes/${q_id}/issue"
              payload: {}
              as: ShopManager
            - call: "POST /quotes/${q_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /service-orders"
              payload: { quote_id: "${q_id}", assigned_technician_id: "${tech_id}" }
              as: ShopManager
              captures: { so_id: "$.data.id" }
            - call: "POST /service-orders/${so_id}/start"
              payload: {}
              as: ShopManager
            - call: "GET /service-orders/${so_id}/milestones"
              payload: {}
              as: ShopManager
              captures: { ms1_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T14:00:00Z" }
              as: PlatformAdmin
            - call: "POST /route-days"
              payload: { technician_id: "${tech_id}", service_date: "2026-05-04" }
              as: ShopManager
              captures: { rd_id: "$.data.id", rd_v: "$.data.version" }
            - call: "POST /appointments"
              payload: { instrument_id: "${inst_id}", route_day_id: "${rd_id}", location_id: "${loc_id}", scheduled_start_utc: "2026-05-04T09:00:00Z", service_type: "VOICE", expected_route_day_version: "${rd_v}", service_order_id: "${so_id}" }
              as: ShopManager
              captures: { ap_id: "$.data.id" }
            - call: "POST /route-days/${rd_id}/status-transitions"
              payload: { to_status: "LOCKED" }
              as: ShopManager
            - call: "POST /route-days/${rd_id}/status-transitions"
              payload: { to_status: "DISPATCHED" }
              as: ShopManager
            - call: "POST /appointments/${ap_id}/no-show"
              payload: {}
