        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[originator-patch-stale-version]", "errors[ERR_STALE_VERSION]", "endpoints(PATCH /ach/originators/{id})"]
        distinguishing_aspect: "OCC on Originator.version: after approval bumps the version to 2, a PATCH still carrying the pre-approval version is rejected ERR_STALE_VERSION (412); re-issuing with the current version succeeds."
        test_recipe:
          setup: ["Originator registered (version 1)"]
          setup_api_calls:
            - call: "POST /ach/originators"
              payload: { legal_name: "Occ Co", sec_codes_allowed: ["PPD"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id", org_v: "$.data.version" }
          trigger:
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v}", decision: "APPROVE", exposure_limit_cents: 5000000, fee_discount_bps: 0 }
              as: OdfiUnderwriter
              captures: { org_v2: "$.data.version" }
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v}", exposure_limit_cents: 9000000 }
              as: OdfiUnderwriter
              captures: { err: "$.data.error_id" }
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v2}", exposure_limit_cents: 9000000 }
              as: OdfiUnderwriter
          assert:
            - "err == ERR_STALE_VERSION (http 412) for the writer carrying the pre-approval version"
            - "Retry with current version succeeds: Originator.${org_id}.exposure_limit_cents == 9000000 AND version == 3"

      - name: stale_file_version_on_entries_append_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[file-entries-stale-version]", "errors[ERR_STALE_VERSION]", "endpoints(POST /ach/ach-files/{id}/entries)"]
        distinguishing_aspect: "OCC on AchFile.version: a first append bumps the file to version 2 (totals and quoted fee recomputed); a second append carrying the stale version 1 is rejected ERR_STALE_VERSION (412) — two strictly sequential, individually-legitimate writes."
        test_recipe:
