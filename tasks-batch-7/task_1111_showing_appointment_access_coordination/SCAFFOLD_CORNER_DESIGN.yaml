# =============================================================================
# Task 1111: Showing Appointment & Access Coordination
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# =============================================================================
scaffold_corner_design:
  # ===================================================== From Table 1 (Entities)
  - section: entities
    instances:
      - name: seller_creation_defaults_applied
        claim_type: defaults
        grounds: [entities.Seller.fields.approval_timeout_minutes, entities.Seller.fields.auto_approve]
        distinguishing_aspect: "Creating a seller with only required fields applies defaults approval_timeout_minutes == 240 and auto_approve == false."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /showing-desk/sellers", payload: { full_name: "D S", contact_email: "ds@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id } }
          trigger:
            - { call: "GET /showing-desk/sellers/${s_id}", payload: {}, as: PlatformAdmin, captures: { s_to: $.data.approval_timeout_minutes, s_aa: $.data.auto_approve, s_v: $.data.version } }
          assert:
            - "approval_timeout_minutes == 240 and auto_approve == false"
            - "version == 1 and id is a server-minted UUID"
      - name: agent_registration_initial_state
        claim_type: creation
        grounds: [entities.Agent.fields.verification_status, entities.Agent.fields.standing, entities.Agent.fields.active_strike_points]
        distinguishing_aspect: "A freshly registered agent has verification_status UNVERIFIED, standing GOOD_STANDING, active_strike_points 0, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /showing-desk/agents", payload: { full_name: "New Agent", license_number: "LIC-NEW", brokerage_name: "BN" }, as: Anonymous, captures: { a_id: $.data.id } }
          trigger:
            - { call: "GET /showing-desk/agents/${a_id}", payload: {}, as: PlatformAdmin, captures: { a_vs: $.data.verification_status, a_st: $.data.standing, a_pts: $.data.active_strike_points } }
          assert:
            - "verification_status == UNVERIFIED, standing == GOOD_STANDING, active_strike_points == 0"
      - name: listing_create_rejected_with_computed_field_input
        claim_type: computed_fields
        grounds: [entities.Listing.fields.confirmed_showing_count, "validations[priority=2]"]
        distinguishing_aspect: "Sending the computed field confirmed_showing_count in the create payload is rejected with ERR_INVALID_REQUEST (unknown field); computed fields are never client-settable."
        test_recipe:
          setup: ["seller exists"]
          setup_api_calls:
            - { call: "POST /showing-desk/sellers", payload: { full_name: "CF S", contact_email: "cfs@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "CF LA", license_number: "LIC-CF-LA", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
          trigger:
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "1 Computed Way", occupancy_type: "VACANT", confirmed_showing_count: 99 }, as: ListingAgent, as_user_id: "${la_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
      - name: listing_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_LISTING_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent listing UUID returns 404 ERR_LISTING_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /showing-desk/agents", payload: { full_name: "NF LA", license_number: "LIC-NF-LA", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
          trigger:
            - { call: "GET /showing-desk/listings/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: ListingAgent, as_user_id: "${la_id}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 404 and error_id == ERR_LISTING_NOT_FOUND"
      - name: listings_pagination_and_seller_filter
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "GET /listings with seller_id filter and limit=2 over 3 listings returns 2 items with total_count == 3 and has_more == true; offset=2 returns the last item with has_more == false."
        test_recipe:
          setup: ["one seller with three listings"]
          setup_api_calls:
            - { call: "POST /showing-desk/sellers", payload: { full_name: "PG S", contact_email: "pg@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "PG LA", license_number: "LIC-PG-LA", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "1 Page St", occupancy_type: "VACANT" }, as: ListingAgent, as_user_id: "${la_id}" }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "2 Page St", occupancy_type: "OCCUPIED" }, as: ListingAgent, as_user_id: "${la_id}" }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "3 Page St", occupancy_type: "VACANT" }, as: ListingAgent, as_user_id: "${la_id}" }
          trigger:
            - { call: "GET /showing-desk/listings", payload: { seller_id: "${s_id}", limit: 2, offset: 0 }, as: ListingAgent, as_user_id: "${la_id}" }
            - { call: "GET /showing-desk/listings", payload: { seller_id: "${s_id}", limit: 2, offset: 2 }, as: ListingAgent, as_user_id: "${la_id}" }
          assert:
            - "page 1: exactly 2 items, total_count == 3, has_more == true"
            - "page 2 (offset 2): exactly 1 item, total_count == 3, has_more == false"
      - name: showing_request_buyer_agent_id_from_caller
        claim_type: system_fields
        grounds: [entities.ShowingRequest.fields.buyer_agent_id]
        distinguishing_aspect: "buyer_agent_id is server-stamped from X-User-ID of the BuyerAgent caller, not from the request body."
        test_recipe:
          setup: ["verified buyer BA; VACANT auto-approve listing"]
          setup_api_calls:
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/agents", payload: { full_name: "SF LA", license_number: "LIC-SF-LA", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "SF BA", license_number: "LIC-SF-BA", brokerage_name: "B2" }, as: Anonymous, captures: { ba_id: $.data.id } }
            - { call: "POST /showing-desk/agents/${ba_id}/verification-cases", payload: { license_document_ref: "doc-sf" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { case_id: $.data.id } }
            - { call: "POST /showing-desk/verification-cases/${case_id}/review", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/sellers", payload: { full_name: "SF S", contact_email: "sf2@x.com", auto_approve: true }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "5 System St", occupancy_type: "VACANT" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l_id: $.data.id } }
          trigger:
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-02T10:00:00Z", end_at: "2026-05-02T10:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r_ba: $.data.buyer_agent_id } }
          assert:
            - "response buyer_agent_id == the X-User-ID used (${ba_id})"

  # ============================================== From Table 2 (State Machines)
  - section: state_machines
    instances:
      - name: showing_request_initial_state_pending_on_occupied
        claim_type: initial_state
        grounds: [state_machines.ShowingRequest]
        distinguishing_aspect: "On an OCCUPIED listing (or seller without auto_approve) a new request starts in PENDING_APPROVAL; only VACANT + auto_approve starts APPROVED."
        test_recipe:
          setup: ["verified buyer; OCCUPIED listing of a manual seller"]
          setup_api_calls:
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/agents", payload: { full_name: "IS LA", license_number: "LIC-IS-LA", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "IS BA", license_number: "LIC-IS-BA", brokerage_name: "B2" }, as: Anonymous, captures: { ba_id: $.data.id } }
            - { call: "POST /showing-desk/agents/${ba_id}/verification-cases", payload: { license_document_ref: "doc-is" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { case_id: $.data.id } }
            - { call: "POST /showing-desk/verification-cases/${case_id}/review", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/sellers", payload: { full_name: "IS S", contact_email: "is@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "7 Init Ave", occupancy_type: "OCCUPIED" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l_id: $.data.id } }
          trigger:
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-02T10:00:00Z", end_at: "2026-05-02T10:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r_st: $.data.status } }
          assert:
            - "status == PENDING_APPROVAL on creation"
      - name: approve_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ShowingRequest.PENDING_APPROVAL_to_APPROVED, "errors[ERR_SHOWING_NOT_PENDING_APPROVAL]"]
        distinguishing_aspect: "Approving an already-APPROVED request fails with ERR_SHOWING_NOT_PENDING_APPROVAL (idempotency-by-state: no double approval, no duplicate side effects)."
        test_recipe:
          setup: ["OCCUPIED listing; request PENDING_APPROVAL, approved once"]
          setup_api_calls:
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/agents", payload: { full_name: "AT LA", license_number: "LIC-AT-LA", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "AT BA", license_number: "LIC-AT-BA", brokerage_name: "B2" }, as: Anonymous, captures: { ba_id: $.data.id } }
            - { call: "POST /showing-desk/agents/${ba_id}/verification-cases", payload: { license_document_ref: "doc-at" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { case_id: $.data.id } }
            - { call: "POST /showing-desk/verification-cases/${case_id}/review", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/sellers", payload: { full_name: "AT S", contact_email: "at@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "9 Twice Ct", occupancy_type: "OCCUPIED" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-02T10:00:00Z", end_at: "2026-05-02T10:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests/${r_id}/approve", payload: {}, as: Seller, as_user_id: "${s_id}" }
          trigger:
            - { call: "POST /showing-desk/showing-requests/${r_id}/approve", payload: {}, as: Seller, as_user_id: "${s_id}", captures: { err: $.data.error_id } }
          assert:
            - "second approve -> error_id == ERR_SHOWING_NOT_PENDING_APPROVAL"
      - name: cancel_completed_returns_already_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ShowingRequest, "errors[ERR_SHOWING_ALREADY_TERMINAL]"]
        distinguishing_aspect: "A COMPLETED request is terminal: cancel is rejected with ERR_SHOWING_ALREADY_TERMINAL and no side effects fire."
        test_recipe:
          setup: ["VACANT auto listing; showing 10:00-10:30 confirmed, credential redeemed 10:05, swept 10:45 -> COMPLETED"]
          setup_api_calls:
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/agents", payload: { full_name: "TC LA", license_number: "LIC-TC-LA", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "TC BA", license_number: "LIC-TC-BA", brokerage_name: "B2" }, as: Anonymous, captures: { ba_id: $.data.id } }
            - { call: "POST /showing-desk/agents/${ba_id}/verification-cases", payload: { license_document_ref: "doc-tc" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { case_id: $.data.id } }
            - { call: "POST /showing-desk/verification-cases/${case_id}/review", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/sellers", payload: { full_name: "TC S", contact_email: "tc@x.com", auto_approve: true }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "11 Terminal Ln", occupancy_type: "VACANT" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T10:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests/${r_id}/confirm", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "POST /showing-desk/showing-requests/${r_id}/access-credentials", payload: { credential_type: "LOCKBOX_CODE" }, as: ListingAgent, as_user_id: "${la_id}", captures: { c_id: $.data.id } }
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:05:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/access-credentials/${c_id}/redeem", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:45:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/_ops/run_expiration_sweep", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /showing-desk/showing-requests/${r_id}/cancel", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SHOWING_ALREADY_TERMINAL and request remains COMPLETED"
      - name: pause_withdrawn_listing_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Listing, "errors[ERR_LISTING_ALREADY_WITHDRAWN]"]
        distinguishing_aspect: "WITHDRAWN is terminal for Listing: pause on a withdrawn listing fails with ERR_LISTING_ALREADY_WITHDRAWN."
        test_recipe:
          setup: ["listing created then withdrawn"]
          setup_api_calls:
            - { call: "POST /showing-desk/sellers", payload: { full_name: "TL S", contact_email: "tl@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "TL LA", license_number: "LIC-TL-LA", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "13 Withdraw Way", occupancy_type: "VACANT" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l_id: $.data.id } }
            - { call: "POST /showing-desk/listings/${l_id}/withdraw", payload: {}, as: ListingAgent, as_user_id: "${la_id}" }
          trigger:
            - { call: "POST /showing-desk/listings/${l_id}/pause", payload: {}, as: ListingAgent, as_user_id: "${la_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_LISTING_ALREADY_WITHDRAWN"
      - name: reschedule_non_declined_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ShowingRequest.DECLINED_to_PENDING_APPROVAL, "errors[ERR_SHOWING_NOT_DECLINED]"]
        distinguishing_aspect: "Reschedule is only legal from DECLINED: calling it on a PENDING_APPROVAL request fails with ERR_SHOWING_NOT_DECLINED."
        test_recipe:
          setup: ["OCCUPIED listing; request PENDING_APPROVAL"]
          setup_api_calls:
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/agents", payload: { full_name: "RS LA", license_number: "LIC-RS-LA", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "RS BA", license_number: "LIC-RS-BA", brokerage_name: "B2" }, as: Anonymous, captures: { ba_id: $.data.id } }
            - { call: "POST /showing-desk/agents/${ba_id}/verification-cases", payload: { license_document_ref: "doc-rs" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { case_id: $.data.id } }
            - { call: "POST /showing-desk/verification-cases/${case_id}/review", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/sellers", payload: { full_name: "RS S", contact_email: "rs@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "15 Resched Rd", occupancy_type: "OCCUPIED" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-02T10:00:00Z", end_at: "2026-05-02T10:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r_id: $.data.id } }
          trigger:
            - { call: "POST /showing-desk/showing-requests/${r_id}/reschedule", payload: { start_at: "2026-05-02T12:00:00Z", end_at: "2026-05-02T12:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SHOWING_NOT_DECLINED"
      - name: feedback_submit_before_sent_unavailable
        claim_type: invalid_transition
        grounds: [state_machines.FeedbackRequest.SENT_to_SUBMITTED, "errors[ERR_FEEDBACK_NOT_AVAILABLE]"]
        distinguishing_aspect: "Submitting while the feedback request is still SCHEDULED (showing not yet completed) fails with ERR_FEEDBACK_NOT_AVAILABLE."
        test_recipe:
          setup: ["VACANT auto listing; showing confirmed (feedback request created SCHEDULED)"]
          setup_api_calls:
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/agents", payload: { full_name: "FB LA", license_number: "LIC-FB-LA", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "FB BA", license_number: "LIC-FB-BA", brokerage_name: "B2" }, as: Anonymous, captures: { ba_id: $.data.id } }
            - { call: "POST /showing-desk/agents/${ba_id}/verification-cases", payload: { license_document_ref: "doc-fb" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { case_id: $.data.id } }
            - { call: "POST /showing-desk/verification-cases/${case_id}/review", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/sellers", payload: { full_name: "FB S", contact_email: "fb@x.com", auto_approve: true }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "17 Feedback Ct", occupancy_type: "VACANT" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-02T10:00:00Z", end_at: "2026-05-02T10:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests/${r_id}/confirm", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "GET /showing-desk/showing-requests/${r_id}/feedback-request", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}", captures: { f_id: "$.data[0].id", f_st: "$.data[0].status" } }
          trigger:
            - { call: "POST /showing-desk/feedback-requests/${f_id}/submit", payload: { q1: 5, q2: 5, q3: 5, q4: 5, q5: 5 }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { err: $.data.error_id } }
          assert:
            - "feedback status == SCHEDULED before submit"
            - "submit -> error_id == ERR_FEEDBACK_NOT_AVAILABLE"
      - name: credential_redeem_before_active_window
        claim_type: precondition_enforcement
        grounds: [state_machines.AccessCredential.ISSUED_to_USED, "errors[ERR_CREDENTIAL_NOT_YET_ACTIVE]"]
        distinguishing_aspect: "Redeem at now < active_from (VACANT window opens start-60m) fails with ERR_CREDENTIAL_NOT_YET_ACTIVE."
        test_recipe:
          setup: ["VACANT auto listing; showing 2026-05-01T10:00-10:30 confirmed; credential issued (active_from 09:00)"]
          setup_api_calls:
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/agents", payload: { full_name: "NA LA", license_number: "LIC-NA-LA", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "NA BA", license_number: "LIC-NA-BA", brokerage_name: "B2" }, as: Anonymous, captures: { ba_id: $.data.id } }
