# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_2712_greenhouse_vegetable_production
#
# Nine §0.5 rule_id blocks, 2 instances each = 18 instances.
# Every `call:` resolves to a §1.5 endpoint; every `${var}` is bound by an
# earlier `captures:`; every numeric assert literal was executed against the
# §1.3 formula and its constants before being written here.
# Logical clock starts at 2026-08-01T00:00:00Z on an empty database.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: energy_cost_projected_and_settled_with_chp_diverge_on_one_strategy
        grounds:
          - calculations.energy_cost
          - entities.ClimateStrategy.fields.projected_energy_cost_usd
          - entities.ClimateStrategy.fields.settled_energy_cost_usd
          - entities.ClimateStrategy.fields.cost_variance_usd
          - entities.Zone.fields.chp_connected
        distinguishing_aspect: |
          Entity domain is the energy ledger on ClimateStrategy: the projected variant reads only
          setpoints (temperature, CO2, lighting, screen) while the settled_with_chp variant reads only
          metered volumes and splits the gas bill by power_share, so the same row must simultaneously
          hold projected_energy_cost_usd 128.96 and settled_energy_cost_usd 251.19.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One 9450 sqft glass zone with a thermal screen, supplemental lighting and a CHP connection, version captured."
            - "One ACTIVE DAY climate strategy on that zone covering a 12-hour window with temp 21.5 C, CO2 900 ppm, 6 lighting hours and a 40% screen, so the projected variant has already run."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerManager
            - call: "POST /zones"
              payload: { code: "ZA-01", area_sqft: 9450, glazing_type: "GLASS", has_thermal_screen: true, has_supplemental_lighting: true, chp_connected: true, hive_slot_capacity: 8, labor_budget_usd: 20000.00 }
              as: GrowerManager
              captures: { zone_a: $.data.id, zone_a_v0: $.data.version }
            - call: "POST /climate-strategies"
              payload: { zone_id: "${zone_a}", regime: "DAY", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T18:00:00Z", temp_setpoint_c: 21.5, rh_setpoint_pct: 80, co2_setpoint_ppm: 900, lighting_hours: 6, screen_position_pct: 40, expected_zone_version: "${zone_a_v0}" }
              as: GrowerManager
              captures: { cs_day: $.data.id, proj_cost: $.data.projected_energy_cost_usd }
          trigger:
            - call: "POST /climate-strategies/${cs_day}/actuals"
              payload: { gas_consumed_m3: 1840.0, chp_generated_kwh: 4200.0, grid_import_kwh: 350.0, screen_deployed_hours: 4.8 }
              as: GrowerManager
          assert:
            - "ClimateStrategy.${cs_day}.window_hours == 12.00"
            - "ClimateStrategy.${cs_day}.planned_heat_kwh == 552.96"
            - "ClimateStrategy.${cs_day}.planned_light_kwh == 680.40"
            - "ClimateStrategy.${cs_day}.planned_co2_kg == 97.98"
            - "${proj_cost} == 128.96"
            - "ClimateStrategy.${cs_day}.projected_energy_cost_usd == 128.96 (unchanged by the actuals post)"
            - "ClimateStrategy.${cs_day}.settled_energy_cost_usd == 251.19"
            - "ClimateStrategy.${cs_day}.cost_variance_usd == 122.23"
            - "ClimateStrategy.${cs_day}.settled_energy_cost_usd != ClimateStrategy.${cs_day}.projected_energy_cost_usd"
            - "Zone.${zone_a}.climate_plan_revision == 1"

      - name: commitment_payout_provisional_and_final_diverge_when_pounds_go_unconfirmed
        grounds:
          - calculations.commitment_payout
          - entities.CommitmentWeek.fields.provisional_penalty_usd
          - entities.CommitmentWeek.fields.final_penalty_usd
          - entities.CommitmentWeek.fields.net_payout_usd
          - entities.RetailProgram.fields.penalty_accrued_usd
          - state_machines.CommitmentWeek.SHIPPED_to_CLOSED_SHORT
        distinguishing_aspect: |
          Entity domain is the retail commitment ledger on CommitmentWeek, not the ClimateStrategy energy
          ledger: here the two variants differ by which pound base they score (allocated_lbs 3000.00 giving
          fill 100.00 and penalty 0.00, versus shipped_lbs 1200.00 giving fill 40.00 and penalty 720.00),
          and only the final variant posts to RetailProgram.penalty_accrued_usd.
          Test-recipe note: the A_ONLY program consumes only grade A pounds, so the two lots contribute
          1200.00 + 1800.00 = 3000.00 grade A pounds, exactly the weekly commitment.
        test_recipe:
          setup:
            - "Zone, tomato variety and one crop cycle in PRODUCTION with the clock at 2026-08-24T06:00:00Z."
            - "Two GRADED, COLD_HELD harvest lots holding 1200.00 and 1800.00 grade A pounds, harvested 2026-08-24 and 2026-08-25."
            - "One ACTIVE A_ONLY retail program at 3000.00 lbs/week, 1.85 USD/lb, 0.40 USD/lb shortfall penalty, priority_rank 1."
            - "One commitment week 2026-W35 starting 2026-08-24 that the allocation run has driven to ALLOCATED with allocated_lbs 3000.00."
            - "Only the 1200.00 lb allocation has been CONFIRMED; the 1800.00 lb allocation is still PROVISIONAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerManager
            - call: "POST /zones"
              payload: { code: "ZA-01", area_sqft: 9450, glazing_type: "GLASS", has_thermal_screen: true, has_supplemental_lighting: true, chp_connected: true, hive_slot_capacity: 8, labor_budget_usd: 20000.00 }
              as: GrowerManager
              captures: { zone_a: $.data.id }
            - call: "POST /varieties"
              payload: { name: "Merlice TOV", crop_type: "TOMATO", cycle_length_weeks: 13, first_harvest_week: 4, plant_density_per_sqft: 0.24, yield_curve_lbs_per_sqft: [0.4, 0.8, 1.1, 1.3, 1.3, 1.2, 1.0, 0.9, 0.7, 0.5], grade_a_ratio_pct: 60, requires_pollination: true, ec_target_ms: 3.0 }
              as: GrowerManager
              captures: { var_tom: $.data.id }
            - call: "POST /crop-cycles"
              payload: { zone_id: "${zone_a}", variety_id: "${var_tom}", transplant_date: "2026-08-03", plants_transplanted: 2157 }
              as: GrowerManager
              captures: { cyc_a: $.data.id }
            - call: "POST /workers"
              payload: { full_name: "Hana Ito", skill: "HARVEST", hourly_rate_usd: 19.50, productivity_index: 1.05, status: "ACTIVE" }
              as: GrowerManager
              captures: { w_harv: $.data.id }
            - call: "POST /crop-cycles/${cyc_a}/transitions"
              payload: { to_status: "TRANSPLANTED" }
              as: GrowerManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-24T06:00:00Z" }
              as: GrowerManager
            - call: "POST /crop-cycles/${cyc_a}/transitions"
              payload: { to_status: "PRODUCTION" }
              as: GrowerManager
            - call: "POST /harvest-lots"
              payload: { crop_cycle_id: "${cyc_a}", harvest_date: "2026-08-24", gross_weight_lbs: 2000.00 }
              as: HarvestSupervisor
              as_user_id: "${w_harv}"
              captures: { lot1: $.data.id }
            - call: "POST /harvest-lots"
              payload: { crop_cycle_id: "${cyc_a}", harvest_date: "2026-08-25", gross_weight_lbs: 3000.00 }
              as: HarvestSupervisor
              as_user_id: "${w_harv}"
              captures: { lot2: $.data.id }
            - call: "POST /harvest-lots/${lot1}/grade"
              payload: { grade_a_lbs: 1200.00, grade_b_lbs: 700.00, cull_lbs: 100.00 }
              as: HarvestSupervisor
              as_user_id: "${w_harv}"
            - call: "POST /harvest-lots/${lot2}/grade"
              payload: { grade_a_lbs: 1800.00, grade_b_lbs: 1000.00, cull_lbs: 200.00 }
              as: HarvestSupervisor
              as_user_id: "${w_harv}"
            - call: "POST /harvest-lots/${lot1}/cold-chain-events"
              payload: { to_status: "PRECOOLED", pulp_temp_c: 10.0 }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /harvest-lots/${lot1}/cold-chain-events"
              payload: { to_status: "COLD_HELD", pulp_temp_c: 6.0 }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /harvest-lots/${lot2}/cold-chain-events"
              payload: { to_status: "PRECOOLED", pulp_temp_c: 10.0 }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /harvest-lots/${lot2}/cold-chain-events"
              payload: { to_status: "COLD_HELD", pulp_temp_c: 6.0 }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /retail-programs"
              payload: { retailer_name: "Northmart", program_code: "NM-A1", grade_spec: "A_ONLY", weekly_commitment_lbs: 3000.00, price_per_lb_usd: 1.85, shortfall_penalty_per_lb_usd: 0.40, priority_rank: 1, status: "ACTIVE" }
              as: GrowerManager
              captures: { prog1: $.data.id }
            - call: "POST /commitment-weeks"
              payload: { program_id: "${prog1}", iso_week: "2026-W35", week_start_date: "2026-08-24", committed_lbs: 3000.00 }
              as: GrowerManager
              captures: { wk35: $.data.id }
            - call: "POST /allocation-runs"
              payload: { week_start_date: "2026-08-24" }
              as: GrowerManager
            - call: "GET /lot-allocations"
              payload: { commitment_week_id: "${wk35}", lot_id: "${lot1}" }
              as: GrowerManager
              captures: { alloc_l1: "$.data[0].id" }
            - call: "POST /lot-allocations/${alloc_l1}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: QualityInspector
              as_user_id: "qi-1"
          trigger:
            - call: "GET /commitment-weeks/${wk35}"
              as: GrowerManager
              captures: { prov_fill: $.data.fill_rate_pct, prov_penalty: $.data.provisional_penalty_usd, prov_shortfall: $.data.provisional_shortfall_lbs }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-28T10:00:00Z" }
              as: GrowerManager
            - call: "POST /commitment-weeks/${wk35}/transitions"
              payload: { to_status: "SHIPPED", shipped_at: "2026-08-28T10:00:00Z" }
              as: QualityInspector
              as_user_id: "qi-2"
            - call: "POST /commitment-weeks/${wk35}/transitions"
              payload: { to_status: "CLOSED" }
              as: GrowerManager
          assert:
            - "${prov_fill} == 100.00"
            - "${prov_penalty} == 0.00"
            - "${prov_shortfall} == 0.00"
            - "CommitmentWeek.${wk35}.shipped_lbs == 1200.00"
            - "CommitmentWeek.${wk35}.fill_rate_pct == 40.00"
            - "CommitmentWeek.${wk35}.final_shortfall_lbs == 1800.00"
            - "CommitmentWeek.${wk35}.final_penalty_usd == 720.00"
            - "CommitmentWeek.${wk35}.gross_revenue_usd == 2220.00"
            - "CommitmentWeek.${wk35}.net_payout_usd == 1500.00"
            - "CommitmentWeek.${wk35}.status == CLOSED_SHORT"
            - "RetailProgram.${prog1}.penalty_accrued_usd == 720.00"
            - "LotAllocation.${alloc_l1}.status == RELEASED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: yield_curve_round_then_sum_beats_sum_then_round_by_one_cent
        grounds:
          - calculations.expected_yield_curve
          - entities.CropCycle.fields.expected_weekly_yield_lbs
          - entities.CropCycle.fields.baseline_total_yield_lbs
          - entities.CropCycle.fields.density_factor
        distinguishing_aspect: |
          Mode (b), nested rounding where the order matters: each of the ten weekly products is quantized
          to 2 dp BEFORE summation, giving baseline_total_yield_lbs 82688.64, whereas summing the
          unrounded products and quantizing once gives 82688.63 — a one-cent divergence the scaffold
          resolves in favour of round-then-sum.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One 9450 sqft zone."
            - "One TOMATO variety with cycle_length_weeks 13, first_harvest_week 4, plant_density_per_sqft 0.24 and a ten-element yield curve, so nominal_plants is 2268."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerManager
            - call: "POST /zones"
              payload: { code: "ZA-01", area_sqft: 9450, glazing_type: "GLASS", has_thermal_screen: true, has_supplemental_lighting: true, chp_connected: true, hive_slot_capacity: 8, labor_budget_usd: 20000.00 }
              as: GrowerManager
              captures: { zone_a: $.data.id }
            - call: "POST /varieties"
              payload: { name: "Merlice TOV", crop_type: "TOMATO", cycle_length_weeks: 13, first_harvest_week: 4, plant_density_per_sqft: 0.24, yield_curve_lbs_per_sqft: [0.4, 0.8, 1.1, 1.3, 1.3, 1.2, 1.0, 0.9, 0.7, 0.5], grade_a_ratio_pct: 60, requires_pollination: true, ec_target_ms: 3.0 }
              as: GrowerManager
              captures: { var_tom: $.data.id }
          trigger:
            - call: "POST /crop-cycles"
              payload: { zone_id: "${zone_a}", variety_id: "${var_tom}", transplant_date: "2026-08-03", plants_transplanted: 2157 }
              as: GrowerManager
              captures: { cyc_a: $.data.id }
          assert:
            - "CropCycle.${cyc_a}.density_factor == 0.9511"
            - "CropCycle.${cyc_a}.expected_weekly_yield_lbs == [3595.16, 7190.32, 9886.68, 11684.26, 11684.26, 10785.47, 8987.90, 8089.11, 6291.53, 4493.95]"
            - "CropCycle.${cyc_a}.baseline_total_yield_lbs == 82688.64"
            - "CropCycle.${cyc_a}.expected_total_yield_lbs == 82688.64"
            - "CropCycle.${cyc_a}.baseline_total_yield_lbs != 82688.63 (the sum-then-round order is wrong)"
            - "CropCycle.${cyc_a}.first_harvest_allowed_date == 2026-08-24"
            - "CropCycle.${cyc_a}.planned_end_date == 2026-11-01"
            - "CropCycle.${cyc_a}.status == PLANNED"
            - "CropCycle.${cyc_a}.pollination_haircut_pct == 0.00"

      - name: fertigation_recirc_cap_stays_pinned_to_the_provisional_blend_ec
        grounds:
          - calculations.nutrient_blend_recirculation
          - entities.FertigationBatch.fields.provisional_blend_ec_ms
          - entities.FertigationBatch.fields.recirc_cap_pct
          - entities.FertigationBatch.fields.blended_ec_ms
          - entities.FertigationBatch.fields.injector_ml
        distinguishing_aspect: |
          Mode (c), circular-looking dependency with a pinned evaluation order: recirc_cap_pct is chosen
          from provisional_blend_ec_ms 3.200 (tier 2 => 40%), and the capped blend then lands at
          blended_ec_ms 2.080 which sits inside the 60% tier — recomputing the cap from the final blend
          would move it up a tier and change every downstream number, so the single forward pass is
          observable as cap 40 alongside blend 2.080.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-06T00:00:00Z."
            - "One zone with irrigation_posture NORMAL and one crop cycle in TRANSPLANTED on a variety whose ec_target_ms is 3.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T00:00:00Z" }
              as: GrowerManager
            - call: "POST /zones"
              payload: { code: "ZA-01", area_sqft: 9450, glazing_type: "GLASS", has_thermal_screen: true, has_supplemental_lighting: true, chp_connected: true, hive_slot_capacity: 8, labor_budget_usd: 20000.00 }
              as: GrowerManager
              captures: { zone_a: $.data.id }
            - call: "POST /varieties"
              payload: { name: "Merlice TOV", crop_type: "TOMATO", cycle_length_weeks: 13, first_harvest_week: 4, plant_density_per_sqft: 0.24, yield_curve_lbs_per_sqft: [0.4, 0.8, 1.1, 1.3, 1.3, 1.2, 1.0, 0.9, 0.7, 0.5], grade_a_ratio_pct: 60, requires_pollination: true, ec_target_ms: 3.0 }
              as: GrowerManager
              captures: { var_tom: $.data.id }
            - call: "POST /crop-cycles"
              payload: { zone_id: "${zone_a}", variety_id: "${var_tom}", transplant_date: "2026-08-03", plants_transplanted: 2157 }
              as: GrowerManager
              captures: { cyc_a: $.data.id }
            - call: "POST /crop-cycles/${cyc_a}/transitions"
              payload: { to_status: "TRANSPLANTED" }
              as: GrowerManager
          trigger:
            - call: "POST /fertigation-batches"
              payload: { zone_id: "${zone_a}", crop_cycle_id: "${cyc_a}", batch_date: "2026-08-06", planned_volume_liters: 12000, requested_recirculated_liters: 8000, reservoir_ec_ms: 4.6, target_ec_ms: 3.0, target_ph: 5.8, n_ppm: 180, k_ppm: 320, ca_ppm: 200, drain_target_pct: 30 }
              as: IrrigationTech
              captures: { batch_capped: $.data.id }
          assert:
            - "FertigationBatch.${batch_capped}.provisional_blend_ec_ms == 3.200"
            - "FertigationBatch.${batch_capped}.recirc_cap_pct == 40"
            - "FertigationBatch.${batch_capped}.recirculated_liters_applied == 4800"
            - "FertigationBatch.${batch_capped}.fresh_liters_applied == 7200"
            - "FertigationBatch.${batch_capped}.blended_ec_ms == 2.080"
            - "FertigationBatch.${batch_capped}.injector_ml == 938.4"
            - "FertigationBatch.${batch_capped}.recirc_cap_pct != 60 (the cap is never re-derived from blended_ec_ms 2.080)"
            - "FertigationBatch.${batch_capped}.status == MIXED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: harvest_lot_grading_and_cold_chain_dimensions_advance_independently
        grounds:
          - state_machines.HarvestLot.grading_status.UNGRADED_to_GRADED
          - state_machines.HarvestLot.grading_status.GRADED_to_REGRADED
          - state_machines.HarvestLot.cold_chain_status.AMBIENT_to_PRECOOLED
          - state_machines.HarvestLot.cold_chain_status.PRECOOLED_to_COLD_HELD
          - entities.HarvestLot.fields.regrade_count
          - concurrency_rules[lot-regrade-stale-lot]
        distinguishing_aspect: |
          Non-linear shape on HarvestLot is PARALLEL: cold_chain_status runs AMBIENT -> PRECOOLED ->
          COLD_HELD while grading_status is still UNGRADED, and the later grade plus regrade move
          grading_status to GRADED then REGRADED without touching cold_chain_status, which stays
          COLD_HELD throughout.
        test_recipe:
          setup:
            - "Clock at 2026-08-24T06:00:00Z, one zone, one tomato variety, one crop cycle in PRODUCTION."
            - "One HARVEST worker so the HarvestSupervisor role resolves to a Worker row."
            - "One freshly registered 2000.00 lb lot in grading_status UNGRADED and cold_chain_status AMBIENT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerManager
            - call: "POST /zones"
              payload: { code: "ZA-01", area_sqft: 9450, glazing_type: "GLASS", has_thermal_screen: true, has_supplemental_lighting: true, chp_connected: true, hive_slot_capacity: 8, labor_budget_usd: 20000.00 }
              as: GrowerManager
              captures: { zone_a: $.data.id }
            - call: "POST /varieties"
              payload: { name: "Merlice TOV", crop_type: "TOMATO", cycle_length_weeks: 13, first_harvest_week: 4, plant_density_per_sqft: 0.24, yield_curve_lbs_per_sqft: [0.4, 0.8, 1.1, 1.3, 1.3, 1.2, 1.0, 0.9, 0.7, 0.5], grade_a_ratio_pct: 60, requires_pollination: true, ec_target_ms: 3.0 }
              as: GrowerManager
              captures: { var_tom: $.data.id }
            - call: "POST /crop-cycles"
              payload: { zone_id: "${zone_a}", variety_id: "${var_tom}", transplant_date: "2026-08-03", plants_transplanted: 2157 }
              as: GrowerManager
              captures: { cyc_a: $.data.id }
            - call: "POST /workers"
              payload: { full_name: "Hana Ito", skill: "HARVEST", hourly_rate_usd: 19.50, productivity_index: 1.05, status: "ACTIVE" }
              as: GrowerManager
              captures: { w_harv: $.data.id }
            - call: "POST /crop-cycles/${cyc_a}/transitions"
              payload: { to_status: "TRANSPLANTED" }
              as: GrowerManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-24T06:00:00Z" }
              as: GrowerManager
            - call: "POST /crop-cycles/${cyc_a}/transitions"
              payload: { to_status: "PRODUCTION" }
              as: GrowerManager
            - call: "POST /harvest-lots"
              payload: { crop_cycle_id: "${cyc_a}", harvest_date: "2026-08-24", gross_weight_lbs: 2000.00 }
              as: HarvestSupervisor
              as_user_id: "${w_harv}"
              captures: { lot1: $.data.id, grading_at_birth: $.data.grading_status, cold_at_birth: $.data.cold_chain_status }
          trigger:
            - call: "POST /harvest-lots/${lot1}/cold-chain-events"
              payload: { to_status: "PRECOOLED", pulp_temp_c: 10.0 }
              as: QualityInspector
              as_user_id: "qi-1"
              captures: { grading_after_precool: $.data.grading_status }
            - call: "POST /harvest-lots/${lot1}/cold-chain-events"
              payload: { to_status: "COLD_HELD", pulp_temp_c: 6.0 }
              as: QualityInspector
              as_user_id: "qi-1"
              captures: { grading_after_cold_hold: $.data.grading_status }
            - call: "POST /harvest-lots/${lot1}/grade"
              payload: { grade_a_lbs: 1200.00, grade_b_lbs: 700.00, cull_lbs: 100.00 }
              as: HarvestSupervisor
              as_user_id: "${w_harv}"
              captures: { cold_after_grade: $.data.cold_chain_status, lot1_v_graded: $.data.version }
            - call: "POST /harvest-lots/${lot1}/regrade"
              payload: { grade_a_lbs: 1100.00, grade_b_lbs: 800.00, cull_lbs: 100.00, expected_lot_version: "${lot1_v_graded}" }
              as: HarvestSupervisor
              as_user_id: "${w_harv}"
          assert:
            - "${grading_at_birth} == UNGRADED"
            - "${cold_at_birth} == AMBIENT"
            - "${grading_after_precool} == UNGRADED"
            - "${grading_after_cold_hold} == UNGRADED"
            - "${cold_after_grade} == COLD_HELD"
            - "HarvestLot.${lot1}.grading_status == REGRADED"
            - "HarvestLot.${lot1}.cold_chain_status == COLD_HELD"
            - "HarvestLot.${lot1}.regrade_count == 1"
            - "HarvestLot.${lot1}.pack_out_pct == 95.00"
            - "HarvestLot.${lot1}.available_a_lbs == 1100.00"
