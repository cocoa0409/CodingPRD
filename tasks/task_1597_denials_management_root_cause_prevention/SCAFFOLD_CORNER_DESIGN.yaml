  # ---------------------------------------------------- complexity layers ---
  - section: complexity_layers
    instances:
      - name: occ_assign_stale_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[denial-assign-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Assign carrying the pre-triage version (stale after triage bumped the denial to version 2) is rejected with ERR_STALE_VERSION (412); no assignment occurs."
        test_recipe:
          setup: ["payer A; code CO-16; denial CLM-2601 created (version 1) then triaged (version 2)"]
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-2601", patient_account_number: "PA-2601", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 300000, denied_amount_cents: 250000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d1: $.data.id, d_v1: $.data.version }
            - call: "POST /rcm/denial-cases/${d1}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
          trigger:
            - call: "POST /rcm/denial-cases/${d1}/assign"
              payload: { specialist_id: "spec-1", expected_denial_case_version: "${d_v1}" }
              as: DenialsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION (http 412): version 1 observed before triage is stale"
            - "denial remains TRIAGED with assigned_specialist_id null"

      - name: occ_assign_fresh_version_succeeds
        claim_type: occ_fresh_version
        grounds: ["concurrency_rules[denial-assign-stale-version]"]
        distinguishing_aspect: "The same assign with the current version succeeds and bumps the denial to version 3 — the OCC gate is purely version-based."
        test_recipe:
          setup: ["payer A; code CO-16; denial CLM-2602 triaged (version 2)"]
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-2602", patient_account_number: "PA-2602", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 300000, denied_amount_cents: 250000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
