              as: Customer
              captures: { c11a: $.data.id }
            - call: "POST /customers"
              payload: { email: "c11b@example.com", full_name: "B" }
              as: Customer
              captures: { c11b: $.data.id }
            - call: "POST /customers"
              payload: { email: "c11c@example.com", full_name: "C" }
              as: Customer
              captures: { c11c: $.data.id }
            - call: "POST /plush-models"
              payload: { name: "Boundary Bat", sku: "BB-01", base_price_cents: 2000, is_licensed: false, required_stuffing_grams: 100, sound_chip_compatible: false }
              as: StoreManager
              captures: { model11: $.data.id }
            - call: "POST /consumables"
