  - rule_id: cross_entity_state_dependency
    instances:
      - name: policy_issuance_depends_on_the_designated_carriers_posture
        grounds:
          - validations[priority=8][error_id=ERR_CARRIER_SUSPENDED]
          - state_machines.Application.status.ASSIGNED_to_POLICY_ISSUED
          - calculations.carrier_performance_and_posture
          - entities.Carrier.fields.posture
          - errors[ERR_CARRIER_SUSPENDED]
        distinguishing_aspect: |
          The write targets Policy but its legality is decided entirely by a different entity's
          derived state: the designated Carrier's posture. The same call with the same payload
          succeeds while Atlas is OPEN and must fail once two upheld complaints drop its
          performance_score to 60, even though the Assignment itself is validly ACCEPTED and
          nothing about the policy payload changed. Entity pair (Policy, Carrier); the sibling
          instance uses (Policy, Claim).
