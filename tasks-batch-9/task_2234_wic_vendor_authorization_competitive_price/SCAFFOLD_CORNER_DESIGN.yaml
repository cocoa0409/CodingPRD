        distinguishing_aspect: |
          The SUBMITTED -> REJECTED -> SUBMITTED loop is bounded by
          MAX_SUBMISSION_REVISIONS: revisions 1 and 2 succeed and reset the review
          stamps, and the third is refused with ERR_REVISION_LIMIT_REACHED while the
          submission stays REJECTED with revision_count frozen at 2.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; MILK category, ITEM_MILK upc 00011122233, OPEN cycle 2026Q3 over [2026-08-01, 2026-09-01)"
