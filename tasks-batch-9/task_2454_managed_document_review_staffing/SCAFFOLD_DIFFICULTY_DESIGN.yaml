              as: StaffingCoordinator
              captures: { ca2_id: $.data.id }
          assert:
            - "first trigger call: HTTP 409 with response.data.error_id == \"ERR_CA_COVERAGE_OVERLAP\" — the touching endpoint 2026-10-31T00:00:00Z collides because the interval is closed"
            - "second trigger call: HTTP 201 with response.data.status == PENDING and coverage_start_utc == \"2026-11-01T00:00:00Z\""
            - "GET /confidentiality-agreements?reviewer_id=${ra_id} returns exactly 2 rows: the EXECUTED one and the new PENDING one"
            - "ConfidentialityAgreement.${caa_id}.status == EXECUTED — the refused call left it untouched"
            - "Matter.${m_id}.staffed_reviewer_count == 1 and status == IN_REVIEW"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: commitment_then_void_returns_ledger_to_zero
        grounds:
          - state_machines.Assignment.ASSIGNED_to_VOIDED
          - entities.BudgetLedgerEntry.fields.amount_cents
          - entities.Matter.fields.committed_spend_cents
        distinguishing_aspect: "MONEY conservation: the append-only ledger for a voided-before-billing assignment must sum to exactly 0 (COMMITMENT +85200 then REVERSAL -85200) and Matter.committed_spend_cents must return to 0 — no row is deleted and no second reversal appears."
        test_recipe:
          setup:
            - "the staffed IN_REVIEW core matter"
            - "Batch 1 (400 documents) is ASSIGNED to Reviewer A with Assignment a1 in ASSIGNED and a single COMMITMENT of 85200"
            - "no progress has been recorded and nothing is billed"
          setup_api_calls:
            - *k_clock
            - *k_client
            - *k_matter
            - *k_proto
            - *k_proto_submit
            - *k_proto_approve
            - *k_rev_a
            - *k_rev_a_verify
            - *k_screen_a
            - *k_screen_a_clear
            - *k_ca_a
            - *k_ca_a_exec
            - *k_batch1
            - *k_assign_a1
          trigger:
            - call: "POST /assignments/${a1_id}/void"
              payload: { void_reason: "CLIENT_STAFFING_CHANGE" }
              as: StaffingCoordinator
          assert:
            - "Assignment.${a1_id}.status == VOIDED with void_reason \"CLIENT_STAFFING_CHANGE\" and voided_at == \"2026-08-01T00:00:00Z\""
            - "GET /assignments/${a1_id}/budget-ledger returns exactly 2 rows in created_at ASC order: COMMITMENT +85200 then REVERSAL -85200; their amount_cents sum to 0"
            - "no BudgetLedgerEntry row was deleted — GET /matters/${m_id}/budget-ledger also returns exactly those 2 rows"
            - "Matter.${m_id}.committed_spend_cents == 0"
            - "GET /matters/${m_id}/spend-projection reports ledger_replay_basis_cents 0 and budget_headroom_cents 600000"
            - "Batch.${b1_id}.status == CREATED — the batch is re-staffable"
            - "Reviewer.${ra_id}.engagement_status == ENGAGED (the CLEARED screening and EXECUTED agreement both survive) and scorecard_strikes == 0"

      - name: document_conservation_across_batching_and_dissolve
        grounds:
          - state_machines.Batch.CREATED_to_DISSOLVED
          - entities.Matter.fields.unbatched_document_count
          - entities.Batch.fields.document_count
          - validations[priority=38]
        distinguishing_aspect: "DOCUMENT conservation rather than money: batched + unbatched must equal the matter's 600 documents at every step, and dissolving the 200-document batch returns exactly those documents to the unbatched pool — a different conserved quantity with a different reversing operation."
        test_recipe:
          setup:
            - "the core matter with 600 documents and an APPROVED protocol"
            - "Reviewer A is staffed, so the matter is IN_REVIEW"
            - "Batch 1 holds 400 documents and Batch 2 holds the remaining 200, leaving unbatched_document_count 0"
            - "Batch 2 carries no Assignment row"
          setup_api_calls:
            - *k_clock
            - *k_client
            - *k_matter
            - *k_proto
            - *k_proto_submit
            - *k_proto_approve
            - *k_rev_a
            - *k_rev_a_verify
            - *k_screen_a
            - *k_screen_a_clear
            - *k_ca_a
            - *k_ca_a_exec
            - *k_batch1
            - call: "POST /matters/${m_id}/batches"
              payload: { document_count: 200, priority_rank: 3 }
              as: EngagementManager
              captures: { b2_id: $.data.id }
            - call: "GET /matters/${m_id}"
              payload: {}
              as: EngagementManager
              captures: { unbatched_before: $.data.unbatched_document_count }
          trigger:
            - call: "POST /batches/${b2_id}/dissolve"
              payload: {}
              as: EngagementManager
            - call: "POST /matters/${m_id}/batches"
              payload: { document_count: 201, priority_rank: 3 }
              as: EngagementManager
              captures: { err: $.data.error_id }
          assert:
            - "before the trigger: Matter.${m_id}.unbatched_document_count == 0 and 400 + 200 + 0 == 600"
            - "after the dissolve: Batch.${b2_id}.status == DISSOLVED with document_count still 200 — the row is not deleted"
            - "after the dissolve: Matter.${m_id}.unbatched_document_count == 200 and 400 + 0 + 200 == 600"
            - "second trigger call: HTTP 422 with response.data.error_id == \"ERR_INSUFFICIENT_UNBATCHED_DOCUMENTS\" — 201 exceeds the 200 documents that came back"
            - "GET /batches?matter_id=${m_id} returns exactly 2 rows (one CREATED with 400, one DISSOLVED with 200)"
            - "Matter.${m_id}.committed_spend_cents == 0 — dissolving an unassigned batch touches no money"
