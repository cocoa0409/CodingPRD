      - { name: unearned_premium_cents, type: integer, source: computed, description: "written_premium_cents - earned_premium_cents" }
      - { name: per_policy_commission_cents, type: integer, source: computed, default: null, description: "Commission credited to the agent for this policy by the covering statement; null for DIRECT policies" }
      - { name: clawback_cents, type: integer, source: computed, default: 0, description: "Commission clawed back after mid-term cancellation" }

