            - "the response's expired_bid_ids contains ${bid_active_id} and only that id"
            - "Bid.${bid_active_id}.status == EXPIRED"
            - "Bid.${bid_draft_id}.status == DRAFT"

      - name: pagination_limit_above_the_declared_max_returns_invalid_request
        claim_type: Listing
        grounds:
          - response_envelope.pagination_defaults
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "The declared pagination max is 100; a limit of 200 on the elevator list is refused with ERR_INVALID_REQUEST (400) rather than silently clamped."
        test_recipe:
          setup:
            - "One desk with one elevator."
          setup_api_calls:
