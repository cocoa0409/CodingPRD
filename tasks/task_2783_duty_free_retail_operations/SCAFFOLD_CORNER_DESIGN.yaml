          trigger:
            - call: "POST /pre-orders"
              payload: { itinerary_id: "${it_160}", stock_item_id: "${si_whisky}", qty: 2, program: "PICKUP_ON_DEPARTURE", reservation_window_start: "2026-08-02T00:00:00Z", reservation_window_end: "2026-08-20T09:00:00Z", expected_stock_item_version: "${si_v_stale}" }
              as: Passenger
              as_user_id: "${it_160}"
            - call: "GET /bonded-stock-items/${si_whisky}"
              as: Passenger
              as_user_id: "${it_160}"
              captures: { si_v_fresh: $.data.version }
            - call: "POST /pre-orders"
              payload: { itinerary_id: "${it_160}", stock_item_id: "${si_whisky}", qty: 2, program: "PICKUP_ON_DEPARTURE", reservation_window_start: "2026-08-02T00:00:00Z", reservation_window_end: "2026-08-20T09:00:00Z", expected_stock_item_version: "${si_v_fresh}" }
              as: Passenger
              as_user_id: "${it_160}"
              captures: { po_160: $.data.id }
            - call: "POST /pre-orders"
              payload: { itinerary_id: "${it_160}", stock_item_id: "${si_whisky}", qty: 1, program: "PICKUP_ON_DEPARTURE", reservation_window_start: "2026-08-02T00:00:00Z", reservation_window_end: "2026-08-20T09:00:00Z", expected_stock_item_version: "${si_v_fresh}" }
              as: Passenger
              as_user_id: "${it_160}"
          assert:
            - "the first pre-order returns HTTP 412 with error_id ERR_STALE_STOCK_ITEM_VERSION"
            - "BondedStockItem.${si_whisky}.reserved_qty == 0 immediately after the 412"
            - "GET /pre-orders filtered by stock_item_id ${si_whisky} returns an empty array after the 412"
            - "${si_v_fresh} is strictly greater than ${si_v_stale} - the second receipt advanced the version"
            - "the pre-order carrying ${si_v_fresh} returns HTTP 201 and PreOrder.${po_160}.status == RESERVED"
            - "BondedStockItem.${si_whisky}.on_hand_qty == 15 and reserved_qty == 2 and available_qty == 13"
            - "the third pre-order reusing ${si_v_fresh} returns HTTP 412 with error_id ERR_STALE_STOCK_ITEM_VERSION - the successful reservation itself bumped the version"
            - "BondedStockItem.${si_whisky}.reserved_qty == 2 after the second 412"

      - name: stale_sale_version_on_line_append_is_a_precondition_failure
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[sale-line-add-stale-sale]
          - errors.ERR_STALE_SALE_VERSION
          - endpoints["POST /sales/{sale_id}/lines"]
        distinguishing_aspect: |
          Appending a second line is always legitimate while the basket is in CART, so no state check
          protects the recomputed totals - only the OCC guard does. Sale.version MUST increment on
          EVERY write (each accepted line), so the version returned with line N is stale for line
          N+1; a rejected append MUST NOT bump the version and MUST NOT create a SaleLine.
        test_recipe:
          setup:
            - "Terminal SIN in SG, two LISTED LIQUOR products with 10 units each, AU/LIQUOR allowance 10, agreement 2026-08 ACTIVE"
            - "A scanned itinerary SIN to AU departing 2026-08-20 with an empty CART sale"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { iata_code: "SIN", name: "Changi T3 Duty Free", country_code: "SG", sealed_bag_regime: "NONE", liquid_limit_ml: 3000 }
              as: TerminalAdmin
              captures: { t_sin: $.data.id }
            - call: "POST /brands"
              payload: { name: "Aurora Spirits", category: "LIQUOR" }
              as: TerminalAdmin
              captures: { b_aurora: $.data.id }
            - call: "POST /products"
              payload: { brand_id: "${b_aurora}", sku: "AUR-WHISKY-700", category: "LIQUOR", unit_price_cents: 8000, duty_rate_bps: 1500, vat_rate_bps: 900, is_liquid: true, liquid_ml: 700, target_nationality_code: "CN", required_nationality_share_bps: 0 }
              as: TerminalAdmin
              captures: { p_whisky: $.data.id }
            - call: "POST /products/${p_whisky}/list"
              payload: {}
              as: TerminalAdmin
            - call: "POST /products"
              payload: { brand_id: "${b_aurora}", sku: "AUR-GIN-500", category: "LIQUOR", unit_price_cents: 6000, duty_rate_bps: 1500, vat_rate_bps: 900, is_liquid: true, liquid_ml: 500, target_nationality_code: "CN", required_nationality_share_bps: 0 }
              as: TerminalAdmin
              captures: { p_gin: $.data.id }
            - call: "POST /products/${p_gin}/list"
              payload: {}
              as: TerminalAdmin
            - call: "POST /allowance-rules"
              payload: { destination_country: "AU", category: "LIQUOR", allowance_units: 10, advisory_text: "Australia: 2.25 L of alcohol per adult traveller." }
              as: TerminalAdmin
            - call: "POST /bonded-stock-items"
              payload: { terminal_id: "${t_sin}", product_id: "${p_whisky}" }
              as: StockController
              captures: { si_whisky: $.data.id }
            - call: "POST /bonded-movements"
              payload: { stock_item_id: "${si_whisky}", movement_type: "RECEIPT", qty_delta: 10 }
              as: StockController
            - call: "POST /bonded-stock-items"
              payload: { terminal_id: "${t_sin}", product_id: "${p_gin}" }
              as: StockController
              captures: { si_gin: $.data.id }
            - call: "POST /bonded-movements"
              payload: { stock_item_id: "${si_gin}", movement_type: "RECEIPT", qty_delta: 10 }
              as: StockController
            - call: "POST /concession-agreements"
              payload: { terminal_id: "${t_sin}", period_code: "2026-08", period_start_utc: "2026-08-01T00:00:00Z", period_end_utc: "2026-09-01T00:00:00Z", rent_pct_bps: 1200, minimum_guarantee_cents: 10000 }
              as: TerminalAdmin
              captures: { ag_sin: $.data.id }
            - call: "POST /concession-agreements/${ag_sin}/activate"
              payload: {}
              as: TerminalAdmin
            - call: "POST /itineraries"
              payload: { passenger_ref: "PAX-0161", nationality_code: "CN", boarding_pass_barcode: "BP-0161", departure_terminal_id: "${t_sin}", departure_utc: "2026-08-20T10:00:00Z", destination_country: "AU", final_destination_country: "AU" }
              as: SalesAssociate
              captures: { it_161: $.data.id }
            - call: "POST /itineraries/${it_161}/scan-boarding-pass"
              payload: { boarding_pass_barcode: "BP-0161" }
              as: SalesAssociate
            - call: "POST /sales"
              payload: { itinerary_id: "${it_161}", channel: "IN_STORE" }
              as: SalesAssociate
              captures: { sale_161: $.data.id, sale_161_v0: $.data.version }
          trigger:
            - call: "POST /sales/${sale_161}/lines"
              payload: { product_id: "${p_whisky}", qty: 1, expected_sale_version: "${sale_161_v0}" }
              as: SalesAssociate
              captures: { line_1: $.data.id }
            - call: "POST /sales/${sale_161}/lines"
              payload: { product_id: "${p_gin}", qty: 1, expected_sale_version: "${sale_161_v0}" }
              as: SalesAssociate
            - call: "GET /sales/${sale_161}"
              as: SalesAssociate
              captures: { sale_161_v1: $.data.version }
            - call: "POST /sales/${sale_161}/lines"
              payload: { product_id: "${p_gin}", qty: 1, expected_sale_version: "${sale_161_v1}" }
              as: SalesAssociate
              captures: { line_2: $.data.id }
            - call: "GET /sales/${sale_161}"
              as: SalesAssociate
              captures: { sale_161_v2: $.data.version }
          assert:
            - "the first line is accepted and SaleLine.${line_1}.line_gross_cents == 8000"
            - "the second append reusing ${sale_161_v0} returns HTTP 412 with error_id ERR_STALE_SALE_VERSION"
            - "GET /sale-lines filtered by sale_id ${sale_161} returns exactly 1 row immediately after the 412"
            - "${sale_161_v1} == ${sale_161_v0} + 1 - the accepted line bumped the version once and the rejected one not at all"
            - "the append carrying ${sale_161_v1} is accepted and SaleLine.${line_2}.line_gross_cents == 6000"
            - "${sale_161_v2} == ${sale_161_v1} + 1"
            - "Sale.${sale_161}.gross_amount_cents == 0 while the sale is still in CART - totals are stamped at pickup, not per line"
            - "BondedStockItem.${si_gin}.on_hand_qty == 10 - lines do not issue stock before pickup"

      - name: cascading_side_effects_chain_from_pickup_reaches_the_rent_basis
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.Sale.ELIGIBILITY_CLEARED_to_PICKED_UP
        excluded_because:
          difficulty_instance: transitive_cascade / pickup_cascade_depth_four_duty_status_to_ledger_to_rent_to_basis
          rationale: "That instance verifies the four-level chain end-to-end - duty_status, bonded ledger, agreement gross_sales, rent_basis - with literal values at every level, which is exactly this layer's claim."

      - name: cascading_side_effects_partial_failure_leaves_no_half_applied_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.CustomsAudit.SUBMITTED_to_CLOSED_ASSESSED
        excluded_because:
          difficulty_instance: transitive_cascade / audit_assessment_cascade_depth_three_liability_to_writeoff_to_reservation_release
          rationale: "The audit-close cascade instance already asserts the ordering-sensitive three-level chain and the untouched state after each refused close, which is this layer's partial-failure claim."

      - name: dual_variant_rent_provisional_versus_final_delta_on_switch
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.concession_rent_accrual.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / concession_rent_provisional_proration_versus_final_full_minimum_guarantee
          rationale: "Both variants and the delta at the provisional-to-final switch are asserted there with literal cent values from the same sales data."

      - name: dual_variant_duty_exemption_estimate_versus_confirmation_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.duty_exemption_allocation.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / duty_exemption_first_leg_estimate_versus_final_destination_confirmation
          rationale: "The first-leg estimate and the final-destination confirmation of the same basket, plus the delta applied at pickup, are asserted there."

      - name: rate_threshold_trigger_boundaries_on_allowance_and_shrinkage
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
          - calculations.duty_exemption_allocation.constants
          - calculations.shrinkage_assessment.constants
        excluded_because:
          difficulty_instance: boundary_precision_check / allowance_units_exactly_consumed_versus_one_unit_over
          rationale: "The cumulative allowance threshold is asserted at exactly-consumed and one-over there; the instantaneous shrinkage-tolerance threshold is asserted at exactly 2 percent by the §1.9 calculations instance shrinkage_tolerance_at_exactly_two_percent_closes_the_audit_clean."

      - name: derived_stock_fields_reconcile_after_every_source_mutation
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers
          - entities.BondedStockItem.fields.on_hand_qty
          - entities.BondedStockItem.fields.reserved_qty
          - entities.BondedStockItem.fields.duty_suspended_value_cents
        excluded_because:
          difficulty_instance: compensating_invariant / receipt_reversal_conserves_physical_units_and_duty_suspended_value
          rationale: "Derived stock fields are asserted after create, after a receipt and after the reversal of that receipt there; the reserved_qty leg after reservation and cancellation is asserted by compensating_invariant / preorder_cancellation_conserves_reserved_capacity_without_touching_on_hand."

  # =====================================================================
  # SECTION 9 - From Consistency Model (immediate)
  # =====================================================================
  - section: consistency_model
    instances:
      - name: every_cascade_is_visible_in_the_same_response_that_caused_it
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Sale.ELIGIBILITY_CLEARED_to_PICKED_UP
          - response_envelope
        distinguishing_aspect: |
          consistency_model is immediate, so the pickup response itself MUST already carry the
          stamped totals and the advanced duty_status, and an immediately following read of the
          agreement, the stock item and the movement ledger MUST show the cascade with no retry,
          no second call and no lag. Nothing may be deferred to a background pass.
        test_recipe:
          setup:
            - "Terminal SIN in SG, one LISTED LIQUOR product (8000 cents, 1500 bps duty, 900 bps VAT) with 10 units"
            - "AU/LIQUOR allowance 1 unit so the second unit of a 2-unit basket is dutiable"
            - "ConcessionAgreement 2026-08 for SIN at 1200 bps with a 1000-cent guarantee, ACTIVE"
            - "A scanned itinerary SIN to AU departing 2026-08-20 with a cleared 2-unit basket"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { iata_code: "SIN", name: "Changi T3 Duty Free", country_code: "SG", sealed_bag_regime: "NONE", liquid_limit_ml: 3000 }
              as: TerminalAdmin
              captures: { t_sin: $.data.id }
            - call: "POST /brands"
              payload: { name: "Aurora Spirits", category: "LIQUOR" }
              as: TerminalAdmin
              captures: { b_aurora: $.data.id }
            - call: "POST /products"
              payload: { brand_id: "${b_aurora}", sku: "AUR-WHISKY-700", category: "LIQUOR", unit_price_cents: 8000, duty_rate_bps: 1500, vat_rate_bps: 900, is_liquid: true, liquid_ml: 700, target_nationality_code: "CN", required_nationality_share_bps: 0 }
              as: TerminalAdmin
              captures: { p_whisky: $.data.id }
            - call: "POST /products/${p_whisky}/list"
              payload: {}
              as: TerminalAdmin
            - call: "POST /allowance-rules"
              payload: { destination_country: "AU", category: "LIQUOR", allowance_units: 1, advisory_text: "Australia: 2.25 L of alcohol per adult traveller." }
              as: TerminalAdmin
            - call: "POST /bonded-stock-items"
              payload: { terminal_id: "${t_sin}", product_id: "${p_whisky}" }
              as: StockController
              captures: { si_whisky: $.data.id }
            - call: "POST /bonded-movements"
              payload: { stock_item_id: "${si_whisky}", movement_type: "RECEIPT", qty_delta: 10 }
              as: StockController
            - call: "POST /concession-agreements"
              payload: { terminal_id: "${t_sin}", period_code: "2026-08", period_start_utc: "2026-08-01T00:00:00Z", period_end_utc: "2026-09-01T00:00:00Z", rent_pct_bps: 1200, minimum_guarantee_cents: 1000 }
              as: TerminalAdmin
              captures: { ag_sin: $.data.id }
            - call: "POST /concession-agreements/${ag_sin}/activate"
              payload: {}
              as: TerminalAdmin
            - call: "POST /itineraries"
              payload: { passenger_ref: "PAX-0170", nationality_code: "CN", boarding_pass_barcode: "BP-0170", departure_terminal_id: "${t_sin}", departure_utc: "2026-08-20T10:00:00Z", destination_country: "AU", final_destination_country: "AU" }
              as: SalesAssociate
              captures: { it_170: $.data.id }
            - call: "POST /itineraries/${it_170}/scan-boarding-pass"
              payload: { boarding_pass_barcode: "BP-0170" }
              as: SalesAssociate
            - call: "POST /sales"
              payload: { itinerary_id: "${it_170}", channel: "IN_STORE" }
              as: SalesAssociate
              captures: { sale_170: $.data.id, sale_170_v: $.data.version }
            - call: "POST /sales/${sale_170}/lines"
              payload: { product_id: "${p_whisky}", qty: 2, expected_sale_version: "${sale_170_v}" }
              as: SalesAssociate
            - call: "POST /sales/${sale_170}/clear-eligibility"
              payload: {}
              as: SalesAssociate
          trigger:
            - call: "POST /sales/${sale_170}/pickup"
              payload: {}
              as: SalesAssociate
            - call: "GET /concession-agreements/${ag_sin}"
              as: TerminalAdmin
            - call: "GET /bonded-stock-items/${si_whisky}"
              as: StockController
            - call: "GET /bonded-movements"
              payload: { stock_item_id: "${si_whisky}", movement_type: "SALE_ISSUE" }
              as: StockController
          assert:
            - "the pickup response body itself already carries fulfillment_status PICKED_UP, duty_status DUTY_LIABLE, gross_amount_cents 16000, exempt_amount_cents 8000 and duty_due_cents 1200"
            - "the pickup response carries effective_destination_country AU and picked_up_at 2026-08-01T00:00:00Z"
            - "the immediately following agreement read shows gross_sales_cents 16000 and percentage_rent_cents 1920 with rent_basis PERCENTAGE"
            - "the immediately following stock read shows on_hand_qty 8, reserved_qty 0, available_qty 8 and duty_suspended_value_cents 64000"
            - "the SALE_ISSUE movement list already contains exactly 1 row with qty_delta -2"
            - "no assertion in this instance needs a second read or a retry - every value is correct on the first read after the pickup"
            - "every response in the chain has the shape data plus error with exactly one of them non-null"
