      - name: reconciliation_variance_pct_is_zero_when_no_scan_was_derived
        claim_type: precision
        grounds:
          - calculations.reconciliation_variance
          - calculations.reconciliation_variance.constants.MAX_VARIANCE_PCT
          - validations[priority=37]
          - entities.ReconciliationReport.fields.variance_pct
        distinguishing_aspect: |
          scan_derived_attendance 0 is the division-guard case: variance_pct is pinned to
          0.00 even though variance_count is 5, so the priority-37 finalization gate passes
          with no override_reason — an implementation that divided by zero, or that used
          variance_count as a percentage, would either crash or wrongly demand an override.
        test_recipe:
          setup:
            - "Event driven to CLOSED with no gates and no scans at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "ON_SALE" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "DOORS_OPEN" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "IN_PROGRESS" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "CLOSED" }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_v: $.data.version }
          trigger:
            - call: "POST /events/${ev_id}/reconciliation-reports"
              payload: { reported_attendance: 5, expected_event_version: "${ev_v}" }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { r_id: $.data.id, r_derived: $.data.scan_derived_attendance, r_count: $.data.variance_count, r_pct: $.data.variance_pct, r_breach: $.data.fire_code_breach }
            - call: "POST /reconciliation-reports/${r_id}/finalize"
              payload: {}
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { r_status: $.data.status }
          assert:
            - "${r_derived} == 0 and ${r_count} == 5"
            - "${r_pct} == 0.00 — the guard clause fires before any division"
            - "${r_breach} == false — 0 is not greater than fire_code_capacity 200"
            - "${r_status} == FINAL — abs(0.00) <= MAX_VARIANCE_PCT 2.0, so no override_reason was required"
            - "Event.${ev_id}.status == RECONCILED"

