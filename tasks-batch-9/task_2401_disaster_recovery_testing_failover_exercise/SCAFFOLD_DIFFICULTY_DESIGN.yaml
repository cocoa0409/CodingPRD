              as_user_id: "${c1_id}"
          assert:
            - "immediately after the FLAG_DIVERGENT call Exercise.${exX_id}.data_state == DATA_DIVERGENT while execution_state == FAILOVER_COMPLETE and failback_state == FAILBACK_NOT_PLANNED"
            - "immediately after the RECORD_SYNC_FAILURE call Exercise.${exX_id}.failback_state == SYNC_FAILED while data_state == DATA_RECONCILING and execution_state == FAILOVER_COMPLETE"
            - "after the whole trigger chain Exercise.${exX_id}.execution_state == CLOSED, data_state == DATA_VERIFIED, failback_state == FAILBACK_COMPLETE"
            - "Exercise.${exX_id}.closure_reason == CLOSED_NORMALLY"
            - "Exercise.${exX_id}.achieved_rto_minutes == 13 and Exercise.${exX_id}.achieved_rpo_minutes == 4"
            - "Site.${sr_id}.reserved_capacity_units == 0 after CLOSE, down from 2 while exX sat in FAILOVER_COMPLETE"

