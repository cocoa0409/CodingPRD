  - section: cross_cutting
    instances:
      - name: occ_citator_override_stale_then_fresh
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[citator-override-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on PrimaryDocument.version: an override carrying the pre-first-write version is rejected 412 ERR_STALE_VERSION; re-reading the version and retrying succeeds. Two strictly sequential requests, deterministic."
        test_recipe:
          setup: ["published document D; client has observed version v0"]
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-05T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "MT", document_type: CASE, title: "Occ v. Doc", raw_citation_string: "99 P.3d 7", decision_date: "2026-01-01"}
              as: ContentIngester
              captures: {doc_id: $.data.id}
            - {call: "POST /legal-research/documents/${doc_id}/publish", payload: {references: []}, as: ContentIngester}
            - {call: "GET /legal-research/documents/${doc_id}", as: CitatorAnalyst, captures: {v0: $.data.version}}
            - {call: "POST /legal-research/documents/${doc_id}/citator-override", payload: {override_signal: YELLOW, rationale: "first", expected_document_version: "${v0}"}, as: CitatorAnalyst}
          trigger:
            - {call: "POST /legal-research/documents/${doc_id}/citator-override", payload: {override_signal: RED, rationale: "stale second writer", expected_document_version: "${v0}"}, as: CitatorAnalyst, captures: {err: $.data.error_id}}
            - {call: "GET /legal-research/documents/${doc_id}", as: CitatorAnalyst, captures: {v1: $.data.version}}
            - {call: "POST /legal-research/documents/${doc_id}/citator-override", payload: {override_signal: RED, rationale: "fresh retry", expected_document_version: "${v1}"}, as: CitatorAnalyst}
          assert:
            - "stale write: error_id == ERR_STALE_VERSION (HTTP 412)"
            - "fresh retry succeeds: PrimaryDocument.${doc_id}.editorial_override_signal == RED and citator_signal == RED and version == ${v1} + 1"

