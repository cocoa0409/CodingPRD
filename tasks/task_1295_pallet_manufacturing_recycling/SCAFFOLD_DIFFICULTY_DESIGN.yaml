              payload: { expected_order_version: "${o1_v2}" }
              as: SalesRep
            - call: "GET /pallet-ops/inventory-lots/${lot_id}"
              payload: {}
              as: SalesRep
              captures: { avail_mid: $.data.quantity_available }
            - call: "POST /pallet-ops/orders"
              payload: { customer_id: "${cust_id}", requested_delivery_date: "2026-08-10T00:00:00Z", spec_id: "${spec_id}", quantity: 1, quality_grade_requested: "NEW" }
              as: SalesRep
              captures: { o2: $.data.id, o2_v: $.data.version }
            - call: "POST /pallet-ops/orders/${o2}/confirm"
              payload: { expected_order_version: "${o2_v}" }
              as: SalesRep
              captures: { o2_v2: $.data.version }
          trigger:
            - call: "POST /pallet-ops/orders/${o2}/allocate"
              payload: { expected_order_version: "${o2_v2}" }
              as: SalesRep
            - call: "GET /pallet-ops/inventory-lots/${lot_id}"
              payload: {}
              as: SalesRep
              captures: { avail_end: $.data.quantity_available, lot_status: $.data.status }
          assert:
            - "avail_mid == 1 after first allocation (2 - 1)"
            - "avail_end == 0 after second allocation"
            - "InventoryLot.${lot_id}.status == DEPLETED exactly when available reaches 0"
            - "conservation: quantity_total(2) == allocated(2) + available(0) at every step"
