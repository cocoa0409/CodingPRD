    side_effects: ["deposit_paid_cents recorded", "status → CONFIRMED"]
  - method: POST
    path: "/catering-orders/{id}/fulfill"
    description: "Fulfill the order (CONFIRMED → FULFILLED)"
    roles: [Manager]
    code: 200
    input: []
    output: CateringOrder
    side_effects: ["status → FULFILLED"]
  - method: POST
    path: "/catering-orders/{id}/cancel"
    description: "Cancel a non-terminal order; frees any confirmed resource booking"
    roles: [Cashier, ShiftLead, Manager]
    code: 200
    input: []
    output: CateringOrder
    side_effects: ["status → CANCELLED"]

  # --- DailyReconciliation ---
  - method: POST
    path: "/daily-reconciliations"
    description: "Open a reconciliation for a business date"
    roles: [Manager]
    code: 201
    input: [business_date]
    output: DailyReconciliation
    side_effects: ["status = OPEN"]
  - method: GET
    path: "/daily-reconciliations"
    description: "List reconciliations"
    roles: [Manager]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "DailyReconciliation[]"
    side_effects: []
  - method: GET
    path: "/daily-reconciliations/{id}"
    description: "Get a reconciliation"
    roles: [Manager]
    code: 200
    input: []
    output: DailyReconciliation
    side_effects: []
  - method: POST
    path: "/daily-reconciliations/{id}/close"
    description: "Close the reconciliation (OPEN → CLOSED); sweeps CHARGED+UNRECONCILED tickets, finalizes loyalty, computes variance"
    roles: [Manager]
    code: 200
    input: [counted_cash_cents]
    output: DailyReconciliation
    side_effects: ["sweep tickets → RECONCILED (cascade to loyalty + vouchers)", "expected_revenue_cents computed", "cash_variance_cents computed", "status → CLOSED"]
  - method: POST
    path: "/daily-reconciliations/{id}/adjustments"
    description: "Post a manual cash adjustment (OCC on DailyReconciliation.version); re-derives expected_revenue and cash_variance"
    roles: [Manager]
    code: 201
    input: [amount_cents, reason, expected_daily_reconciliation_version]
    output: DailyReconciliation
    side_effects: ["append adjustment", "increments DailyReconciliation.version by 1", "expected_revenue_cents and cash_variance_cents re-derived"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID / X-User-Role header missing or role unknown" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role lacks permission for the operation" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field or wrong type" }
  - { id: ERR_MACHINE_NOT_FOUND, http: 404, condition: "machine_id does not resolve" }
  - { id: ERR_FLAVOR_NOT_FOUND, http: 404, condition: "flavor_id does not resolve" }
  - { id: ERR_TOPPING_NOT_FOUND, http: 404, condition: "a topping_id / topping_id does not resolve" }
  - { id: ERR_PROMOTION_NOT_FOUND, http: 404, condition: "seasonal promotion id does not resolve" }
  - { id: ERR_LOYALTY_NOT_FOUND, http: 404, condition: "loyalty_account_id does not resolve" }
  - { id: ERR_VOUCHER_NOT_FOUND, http: 404, condition: "voucher_id does not resolve" }
  - { id: ERR_TICKET_NOT_FOUND, http: 404, condition: "sale ticket id does not resolve" }
  - { id: ERR_LINE_NOT_FOUND, http: 404, condition: "sale line id does not resolve" }
  - { id: ERR_WASTE_NOT_FOUND, http: 404, condition: "waste event id does not resolve" }
  - { id: ERR_WINDOW_NOT_FOUND, http: 404, condition: "maintenance window id does not resolve" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "catering resource_id does not resolve" }
  - { id: ERR_CATERING_NOT_FOUND, http: 404, condition: "catering order id does not resolve" }
  - { id: ERR_RECONCILIATION_NOT_FOUND, http: 404, condition: "reconciliation id does not resolve" }
  - { id: ERR_MACHINE_INVALID_STATE, http: 409, condition: "Machine not in the required sanitation_status for the transition" }
  - { id: ERR_FLAVOR_INVALID_STATE, http: 409, condition: "Flavor not LOADED for rotate-out" }
  - { id: ERR_TOPPING_INVALID_STATE, http: 409, condition: "Topping not AVAILABLE for rotate-out" }
  - { id: ERR_LOYALTY_INVALID_STATE, http: 409, condition: "Loyalty account not ACTIVE for suspend" }
  - { id: ERR_TICKET_NOT_OPEN, http: 409, condition: "Operation requires ticket payment_status == OPEN" }
  - { id: ERR_TICKET_NOT_CHARGED, http: 409, condition: "Void requires ticket payment_status == CHARGED" }
  - { id: ERR_TICKET_ALREADY_RECONCILED, http: 409, condition: "Void rejected: ticket already RECONCILED" }
  - { id: ERR_EMPTY_TICKET, http: 409, condition: "Checkout requires at least one sale line" }
  - { id: ERR_CATERING_INVALID_STATE, http: 409, condition: "Catering order not in the required status for the transition" }
  - { id: ERR_WINDOW_INVALID_STATE, http: 409, condition: "Maintenance window not SCHEDULED for cancel" }
  - { id: ERR_RECONCILIATION_INVALID_STATE, http: 409, condition: "Reconciliation not OPEN for the operation" }
  - { id: ERR_LOYALTY_ACCOUNT_SUSPENDED, http: 409, condition: "Checkout attached to a SUSPENDED loyalty account" }
  - { id: ERR_VOUCHER_NOT_REDEEMABLE, http: 409, condition: "Voucher status is not ISSUED" }
  - { id: ERR_VOUCHER_EXPIRED, http: 409, condition: "Voucher redeemed at/after expires_at" }
  - { id: ERR_ALLERGEN_CONFLICT, http: 409, condition: "A cup's topping introduces an allergen the ticket excluded" }
  - { id: ERR_MACHINE_NOT_READY, http: 409, condition: "Dispensing flavor whose machine is not READY (CLEANING/OUT_OF_SERVICE)" }
  - { id: ERR_TOPPING_UNAVAILABLE, http: 409, condition: "Topping ROTATED_OUT or on_hand_units < 1, or flavor not LOADED" }
  - { id: ERR_INVALID_WEIGHT, http: 400, condition: "net_weight_oz (gross - tare) not strictly > 0" }
  - { id: ERR_RESOURCE_DOUBLE_BOOKED, http: 409, condition: "Catering interval overlaps another CONFIRMED/FULFILLED order on the resource" }
  - { id: ERR_MAINTENANCE_WINDOW_CONFLICT, http: 409, condition: "New window within MAINTENANCE_BUFFER_MINUTES of a SCHEDULED window on the same machine" }
  - { id: ERR_INVALID_WINDOW, http: 400, condition: "window_end <= window_start (or event_end <= event_start)" }
  - { id: ERR_DEPOSIT_INSUFFICIENT, http: 402, condition: "deposit_paid_cents < required_deposit_cents at confirm" }
  - { id: ERR_INSUFFICIENT_MIX, http: 402, condition: "requested net_weight_oz exceeds machine current_mix_level_oz" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_<parent>_version does not match the parent's current version" }

# =============================================================================
# 1.7 RBAC Matrix (hierarchical override: Manager >= ShiftLead >= Cashier)
# =============================================================================
roles:
  - name: Cashier
    description: "Front-counter POS operator: runs tickets and loyalty enrollment"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /sale-tickets, POST /sale-tickets/{id}/lines, POST /sale-tickets/{id}/checkout"
      - "POST /loyalty-accounts"
      - "POST /catering-orders, POST /catering-orders/{id}/cancel"
      - "All GET reads except reconciliations/waste/sanitation which are ShiftLead+/Manager"
      - "POST /_clock/set_current_utc"
  - name: ShiftLead
    description: "Shift lead: inventory, sanitation, waste, maintenance, voids (superset of Cashier)"
    identity: opaque
    exclusive_operations:
      - "POST /flavors, POST /flavors/{id}/rotate-out"
      - "POST /toppings, POST /toppings/{id}/restock, POST /toppings/{id}/rotate-out"
      - "POST /machines/{id}/start-cleaning, complete-cleaning, refill-mix, check-sanitation"
      - "POST /sale-tickets/{id}/void"
      - "POST /waste-events, POST /maintenance-windows, POST /maintenance-windows/{id}/cancel"
    shared_operations:
      - "Everything Cashier can do (hierarchical override)"
  - name: Manager
    description: "Store manager: machines, promotions, catering lifecycle, loyalty suspension, reconciliation (full superset)"
    identity: opaque
    exclusive_operations:
      - "POST /machines, POST /catering-resources, POST /seasonal-promotions"
      - "POST /loyalty-accounts/{id}/suspend"
      - "POST /catering-orders/{id}/quote, confirm, fulfill"
      - "POST /daily-reconciliations, POST /daily-reconciliations/{id}/close, POST /daily-reconciliations/{id}/adjustments"
    shared_operations:
      - "Everything ShiftLead and Cashier can do (hierarchical override)"
