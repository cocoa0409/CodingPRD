            - "r_net == 1964900"
            - "p_settled == 2005000 and p_prorated == true"
            - "inv_shares == 982450000 and inv_ded == 40100 and inv_account == \"ACTIVE\""

      - name: published_official_variant_becomes_the_next_subscription_price
        claim_type: variant_selection
        grounds:
          - calculations.transaction_price_selection
          - calculations.nav_per_share
          - entities.Subscription.fields.transaction_price_cents
          - state_machines.NavRecord.ADVISOR_CONFIRMED_to_PUBLISHED
        distinguishing_aspect: |
          Once a NAV record whose two variants differ (1000 pre-accrual versus
          997 official) is PUBLISHED, a new subscription must price at the
          official 997 — not at the pre-accrual disclosure figure and not at the
          1000-cent initial offering price.
        test_recipe:
          setup:
            - "Offering 'Solstice Income REIT' at 1000 cents per share, zero-load class I, minimum offering 10000000 cents."
            - "One documented investor subscribes 10000000 cents; breaking escrow mints a 100000000 e4 lot."
            - "One DECLARED distribution of 3 cents per share dated 2026-08-05 accrues 30000 cents."
            - "The clock is moved to 2026-09-01T00:00:00Z, then the August NAV record (gross asset value 10000000, no other liabilities) is cut and published."
