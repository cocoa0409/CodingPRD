scenario: |
  2783. Duty-Free Retail Operations (airport duty-free operator): sales eligibility by passenger
  itinerary with international departure verification and boarding pass scanning, duty and tax
  exemption accounting with bonded inventory control and periodic reconciliation, allowance limits
  by destination country with customer advisories on arrival allowances, sealed bag and liquid
  transport rules for connecting passengers, pre-order and pick-up-on-return programs with
  inventory reservation, concession agreement rent based on percentage of sales with minimum
  guarantees, product assortment governed by traveler nationality mix and exclusivity agreements
  with brands, customs audits, inventory shrinkage and unaccounted-goods duty liability
domain_name: duty-free-retail-operations
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer addressed at its own root collection (`/sales/{sale_id}`,
  # `/bonded-stock-items/{stock_item_id}`); relationships are expressed with foreign-key
  # body fields plus filtered-list reverse lookups. No nested URL ownership chains.

  state_machine_shape: parallel
  # Sale carries two independent state dimensions (fulfillment_status x duty_status) that
  # advance on different triggers; CustomsAudit is cyclic (SUBMITTED -> INFO_REQUESTED ->
  # SUBMITTED with a round counter that feeds the duty-penalty multiplier); PassengerItinerary
  # is cyclic (SCANNED -> AMENDED -> SCANNED); SealedBag and PreOrder are branching.

  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential      # BondedMovement.reversal_of_movement_id -> BondedMovement.id
    - polymorphic           # BondedMovement.source_ref_id + source_ref_type

  role_model: segregation_of_duties
  # The StockController that prepares a CustomsAudit may never be the operator that closes it;
  # TerminalAdmin owns commercial configuration, SalesAssociate owns the till, Passenger acts
  # only on its own itinerary.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Terminal
    parent: null
    common_fields: true
    fields:
      - name: iata_code
        type: string
        source: input
        description: IATA 3-letter code of the airport the terminal belongs to
        constraints: exactly 3 uppercase letters
      - name: name
        type: string
        source: input
        description: operator-facing terminal label
      - name: country_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 country the terminal is physically located in
        constraints: exactly 2 uppercase letters
      - name: sealed_bag_regime
        type: enum
        source: input
        description: which sealed-bag rule set applies to connecting passengers at this terminal
        default: ICAO_STEB
        constraints: "one of {ICAO_STEB, NONE}"
      - name: liquid_limit_ml
        type: integer
        source: input
        description: maximum aggregate millilitres of liquid goods a single sealed bag may contain
        default: 1000
        constraints: ">= 0"
      - name: traveler_nationality_mix
        type: object
        source: computed
        description: >-
          map of nationality_code -> share_bps over recently scanned itineraries departing this
          terminal; produced by calculations.terminal_nationality_mix
        default: {}
      - name: scanned_itinerary_count_30d
        type: integer
        source: computed
        description: denominator used by calculations.terminal_nationality_mix
        default: 0
      - name: unaccounted_duty_liability_cents
        type: integer
        source: computed
        description: >-
          running sum of CustomsAudit.assessed_duty_cents over CustomsAudits of this terminal whose
          status is CLOSED_ASSESSED
        default: 0

  - name: Brand
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: brand trading name
        constraints: unique across Brands
      - name: category
        type: enum
        source: input
        description: the single merchandise category this brand trades in
        constraints: "one of {LIQUOR, TOBACCO, FRAGRANCE, CONFECTIONERY, ELECTRONICS}"
      - name: status
        type: enum
        source: system
        description: commercial standing of the brand
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: suspended_at
        type: datetime
        source: system
        description: logical-clock instant the brand was suspended; null while ACTIVE
        default: null

  - name: ExclusivityGrant
    parent: null
    common_fields: true
    fields:
      - name: brand_id
        type: string
        source: input
        description: FK -> Brand.id; the brand holding the exclusivity
      - name: terminal_id
        type: string
        source: input
        description: FK -> Terminal.id; the terminal the exclusivity applies at
      - name: category
        type: enum
        source: input
        description: merchandise category the grant covers
        constraints: "one of {LIQUOR, TOBACCO, FRAGRANCE, CONFECTIONERY, ELECTRONICS}"
      - name: scope
        type: enum
        source: input
        description: >-
          TERMINAL_EXCLUSIVE blocks products of every other brand in this category from being
          LISTED at this terminal; CATEGORY_PREFERRED records the deal without blocking
        constraints: "one of {TERMINAL_EXCLUSIVE, CATEGORY_PREFERRED}"
      - name: effective_from
        type: datetime
        source: input
        description: inclusive lower bound of the grant's half-open validity interval
      - name: effective_to
        type: datetime
        source: input
        description: exclusive upper bound of the grant's half-open validity interval
        constraints: must be strictly greater than effective_from
      - name: status
        type: enum
        source: system
        description: grant lifecycle
        default: ACTIVE
        constraints: "one of {ACTIVE, REVOKED}"
      - name: revoked_at
        type: datetime
        source: system
        description: logical-clock instant the grant was revoked; null while ACTIVE
        default: null

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: brand_id
        type: string
        source: input
        description: FK -> Brand.id; owning brand
      - name: sku
        type: string
        source: input
        description: stock-keeping unit code
        constraints: unique across Products
      - name: category
        type: enum
        source: input
        description: merchandise category; must equal the owning Brand.category
        constraints: "one of {LIQUOR, TOBACCO, FRAGRANCE, CONFECTIONERY, ELECTRONICS}"
      - name: unit_price_cents
        type: integer
        source: input
        description: shelf price of one unit in cents
        constraints: "> 0"
      - name: duty_rate_bps
        type: integer
        source: input
        description: import duty rate in basis points applied to dutiable units
        constraints: "0 .. 10000"
      - name: vat_rate_bps
        type: integer
        source: input
        description: value-added tax rate in basis points applied to dutiable units
        constraints: "0 .. 10000"
      - name: is_liquid
        type: boolean
        source: input
        description: whether the unit counts toward sealed-bag liquid volume
        default: false
      - name: liquid_ml
        type: integer
        source: input
        description: millilitres of liquid per unit; required when is_liquid is true, else null
        default: null
        constraints: "> 0 when is_liquid is true"
      - name: target_nationality_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 nationality this SKU is assorted for
        constraints: exactly 2 uppercase letters
      - name: required_nationality_share_bps
        type: integer
        source: input
        description: >-
          minimum Terminal.traveler_nationality_mix share (bps) for target_nationality_code that a
          terminal must exhibit before this SKU may be LISTED
        default: 1500
        constraints: "0 .. 10000"
      - name: assortment_status
        type: enum
        source: system
        description: assortment lifecycle
        default: PENDING
        constraints: "one of {PENDING, LISTED, DELISTED}"
      - name: listed_at
        type: datetime
        source: system
        description: logical-clock instant the SKU entered LISTED; null otherwise
        default: null

  - name: AllowanceRule
    parent: null
    common_fields: true
    fields:
      - name: destination_country
        type: string
        source: input
        description: ISO 3166-1 alpha-2 arrival country the allowance applies to
        constraints: exactly 2 uppercase letters
      - name: category
        type: enum
        source: input
        description: merchandise category the allowance applies to
        constraints: "one of {LIQUOR, TOBACCO, FRAGRANCE, CONFECTIONERY, ELECTRONICS}"
      - name: allowance_units
        type: integer
        source: input
        description: number of units a single passenger may import duty-free on arrival
        constraints: ">= 0"
      - name: advisory_text
        type: string
        source: input
        description: verbatim advisory copy shown to the passenger for this destination + category
      - name: status
        type: enum
        source: system
        description: >-
          ACTIVE while it is the operative rule for (destination_country, category); flipped to
          SUPERSEDED when a newer rule for the same pair is created
        default: ACTIVE
        constraints: "one of {ACTIVE, SUPERSEDED}"
      - name: superseded_at
        type: datetime
        source: system
        description: logical-clock instant the rule was superseded; null while ACTIVE
        default: null

  - name: BondedStockItem
    parent: null
    common_fields: true
    fields:
      - name: terminal_id
        type: string
        source: input
        description: FK -> Terminal.id; bonded warehouse location holding the stock
      - name: product_id
        type: string
        source: input
        description: FK -> Product.id; the SKU held under duty suspension
      - name: on_hand_qty
        type: integer
        source: computed
        description: >-
          sum of BondedMovement.qty_delta over movements of this item whose affects == ON_HAND
        default: 0
      - name: reserved_qty
        type: integer
        source: computed
        description: >-
          sum of BondedMovement.qty_delta over movements of this item whose affects == RESERVED
        default: 0
      - name: available_qty
        type: integer
        source: computed
        description: on_hand_qty minus reserved_qty
        default: 0
      - name: duty_suspended_value_cents
        type: integer
        source: computed
        description: >-
          duty + VAT value currently under suspension on this item; produced by
          calculations.bonded_duty_suspended_value
        default: 0
      - name: last_reconciled_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent CLOSED_CLEAN or CLOSED_ASSESSED audit
        default: null

  - name: BondedMovement
    parent: null
    common_fields: false
    fields:
      - name: stock_item_id
        type: string
        source: input
        description: FK -> BondedStockItem.id; the item whose ledger this movement belongs to
      - name: movement_type
        type: enum
        source: input
        description: kind of ledger event
        constraints: "one of {RECEIPT, SALE_ISSUE, RESERVATION_HOLD, RESERVATION_RELEASE, SHRINKAGE_WRITE_OFF, AUDIT_ADJUSTMENT, REVERSAL}"
      - name: qty_delta
        type: integer
        source: input
        description: signed unit change; never 0
        constraints: "!= 0"
      - name: affects
        type: enum
        source: computed
        description: >-
          RESERVED when movement_type is RESERVATION_HOLD or RESERVATION_RELEASE; for REVERSAL it
          copies the reversed movement's affects; ON_HAND otherwise
        constraints: "one of {ON_HAND, RESERVED}"
      - name: reversal_of_movement_id
        type: string
        source: system
        description: FK -> BondedMovement.id; set only when movement_type == REVERSAL, else null
        default: null
      - name: source_ref_type
        type: enum
        source: system
        description: polymorphic discriminator naming the aggregate that caused this movement
        constraints: "one of {SALE, PRE_ORDER, CUSTOMS_AUDIT, MANUAL, REVERSAL}"
      - name: source_ref_id
        type: string
        source: system
        description: >-
          id of the Sale / PreOrder / CustomsAudit named by source_ref_type; null when
          source_ref_type == MANUAL
        default: null
      - name: posted_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator whose request produced this movement
      - name: agreement_period_code
        type: string
        source: system
        description: >-
          period_code of the ConcessionAgreement of the item's terminal whose status was ACTIVE at
          post time; null when no ACTIVE agreement existed
        default: null
      - name: reversed
        type: boolean
        source: computed
        description: true when some REVERSAL movement carries reversal_of_movement_id == this id
        default: false

  - name: PassengerItinerary
    parent: null
    common_fields: true
    fields:
      - name: passenger_ref
        type: string
        source: input
        description: operator reference for the traveller
        constraints: unique across PassengerItineraries
      - name: nationality_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 nationality shown on the travel document
        constraints: exactly 2 uppercase letters
      - name: boarding_pass_barcode
        type: string
        source: input
        description: BCBP barcode payload printed on the boarding pass
        constraints: unique across PassengerItineraries
      - name: departure_terminal_id
        type: string
        source: input
        description: FK -> Terminal.id; terminal the passenger departs from
      - name: departure_utc
        type: datetime
        source: input
        description: scheduled departure instant of the first leg
      - name: destination_country
        type: string
        source: input
        description: ISO 3166-1 alpha-2 arrival country of the first leg
      - name: has_connection
        type: boolean
        source: input
        description: whether the passenger connects onward from destination_country
        default: false
      - name: connection_country
        type: string
        source: input
        description: ISO 3166-1 alpha-2 country the onward connection is taken in; null when has_connection is false
        default: null
      - name: connection_departure_utc
        type: datetime
        source: input
        description: scheduled departure instant of the onward leg; null when has_connection is false
        default: null
      - name: final_destination_country
        type: string
        source: input
        description: >-
          ISO 3166-1 alpha-2 arrival country of the final leg; must equal destination_country when
          has_connection is false
      - name: is_international
        type: boolean
        source: computed
        description: true when destination_country differs from the departure Terminal.country_code
        default: false
      - name: scan_status
        type: enum
        source: system
        description: boarding-pass verification dimension
        default: UNSCANNED
        constraints: "one of {UNSCANNED, SCANNED, AMENDED}"
      - name: scanned_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent successful scan; null while never scanned
        default: null
      - name: amend_count
        type: integer
        source: system
        description: number of times the itinerary has been amended after a scan
        default: 0

  - name: ConcessionAgreement
    parent: null
    common_fields: true
    fields:
      - name: terminal_id
        type: string
        source: input
        description: FK -> Terminal.id; terminal the concession covers
      - name: period_code
        type: string
        source: input
        description: settlement period label, format YYYY-MM
        constraints: unique per terminal_id
      - name: period_start_utc
        type: datetime
        source: input
        description: inclusive start of the settlement period
      - name: period_end_utc
        type: datetime
        source: input
        description: exclusive end of the settlement period
        constraints: must be strictly greater than period_start_utc
      - name: rent_pct_bps
        type: integer
        source: input
        description: percentage-of-sales rent rate in basis points
        constraints: "0 .. 10000"
      - name: minimum_guarantee_cents
        type: integer
        source: input
        description: full-period minimum guaranteed rent in cents
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: agreement lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, CLOSED}"
      - name: gross_sales_cents
        type: integer
        source: computed
        description: >-
          ledger of concessionable turnover; equals the sum of Sale.gross_amount_cents over Sales
          with agreement_id == this id and fulfillment_status == PICKED_UP
        default: 0
      - name: percentage_rent_cents
        type: integer
        source: computed
        description: round_half_up(gross_sales_cents * rent_pct_bps / 10000)
        default: 0
      - name: final_rent_cents
        type: integer
        source: computed
        description: >-
          FINAL_PERIOD_CLOSE variant of calculations.concession_rent_accrual; null until close-period
        default: null
      - name: marketing_credit_cents
        type: integer
        source: computed
        description: >-
          brand marketing offset produced by calculations.net_rent_settlement; null until close-period
        default: null
      - name: net_rent_cents
        type: integer
        source: computed
        description: final_rent_cents minus marketing_credit_cents; null until close-period
        default: null
      - name: rent_basis
        type: enum
        source: computed
        description: >-
          which term won the max() in the rent formula for the variant most recently evaluated
        default: null
        constraints: "one of {PERCENTAGE, MINIMUM_GUARANTEE} or null"
      - name: closed_at
        type: datetime
        source: system
        description: logical-clock instant the period was closed; null otherwise
        default: null

  - name: Sale
    parent: null
    common_fields: true
    fields:
      - name: itinerary_id
        type: string
        source: input
        description: FK -> PassengerItinerary.id; traveller the sale is written against
      - name: terminal_id
        type: string
        source: computed
        description: FK -> Terminal.id; copied from the itinerary's departure_terminal_id at creation
      - name: agreement_id
        type: string
        source: computed
        description: >-
          FK -> ConcessionAgreement.id; the agreement of terminal_id whose status is ACTIVE at sale
          creation (at most one exists by the per-terminal uniqueness invariant)
      - name: channel
        type: enum
        source: input
        description: how the basket was originated
        constraints: "one of {IN_STORE, PRE_ORDER}"
      - name: fulfillment_status
        type: enum
        source: system
        description: till/handover dimension, independent of duty_status
        default: CART
        constraints: "one of {CART, ELIGIBILITY_CLEARED, PICKED_UP, VOIDED}"
      - name: duty_status
        type: enum
        source: system
        description: duty/tax accounting dimension, independent of fulfillment_status
        default: SUSPENDED
        constraints: "one of {SUSPENDED, EXEMPT_CONFIRMED, DUTY_LIABLE, REVERSED}"
      - name: effective_destination_country
        type: string
        source: computed
        description: >-
          the arrival country whose AllowanceRule set was used by the most recent exemption
          evaluation; null before the first evaluation
        default: null
      - name: gross_amount_cents
        type: integer
        source: computed
        description: sum of SaleLine.line_total_cents over the sale's lines
        default: 0
      - name: exempt_amount_cents
        type: integer
        source: computed
        description: sum of SaleLine.line_exempt_cents over the sale's lines
        default: 0
      - name: duty_liability_cents
        type: integer
        source: computed
        description: sum of SaleLine.line_duty_cents over the sale's lines
        default: 0
      - name: eligibility_variant
        type: enum
        source: computed
        description: which variant of calculations.duty_exemption_accounting produced the current amounts
        default: null
        constraints: "one of {SUSPENDED_ESTIMATE, EXEMPT_CONFIRMED_FINAL} or null"
      - name: sealed_bag_required
        type: boolean
        source: computed
        description: >-
          true when the terminal's sealed_bag_regime == ICAO_STEB and the itinerary's has_connection
          is true
        default: false
      - name: arrival_advisory
        type: array
        source: computed
        description: >-
          one entry per distinct product category on the sale, each the advisory_text of the ACTIVE
          AllowanceRule for (effective_destination_country, category), ordered by category name ASC
        default: []
      - name: cleared_at
        type: datetime
        source: system
        description: logical-clock instant fulfillment_status became ELIGIBILITY_CLEARED
        default: null
      - name: picked_up_at
        type: datetime
        source: system
        description: logical-clock instant fulfillment_status became PICKED_UP
        default: null
      - name: voided_at
        type: datetime
        source: system
        description: logical-clock instant fulfillment_status became VOIDED
        default: null

  - name: SaleLine
    parent: null
    common_fields: true
    fields:
      - name: sale_id
        type: string
        source: input
        description: FK -> Sale.id; owning basket
      - name: product_id
        type: string
        source: input
        description: FK -> Product.id; SKU sold on this line
      - name: qty
        type: integer
        source: input
        description: units sold on this line
        constraints: "> 0"
      - name: unit_price_cents
        type: integer
        source: computed
        description: snapshot of Product.unit_price_cents taken at line creation
      - name: line_total_cents
        type: integer
        source: computed
        description: qty * unit_price_cents
        default: 0
      - name: allowance_excess_qty
        type: integer
        source: computed
        description: units on this line that fall outside the arrival allowance
        default: 0
      - name: line_exempt_cents
        type: integer
        source: computed
        description: value of the units on this line that stay duty and tax exempt
        default: 0
      - name: line_duty_cents
        type: integer
        source: computed
        description: duty + VAT charged on this line's excess units, rounded at line level
        default: 0

  - name: SealedBag
    parent: null
    common_fields: true
    fields:
      - name: sale_id
        type: string
        source: input
        description: FK -> Sale.id; basket the bag is sealed for
      - name: terminal_id
        type: string
        source: computed
        description: FK -> Terminal.id; copied from the sale's terminal_id at issuance
      - name: seal_number
        type: string
        source: input
        description: printed tamper-evident seal serial
        constraints: unique across SealedBags
      - name: status
        type: enum
        source: system
        description: bag integrity lifecycle
        default: ISSUED
        constraints: "one of {ISSUED, INTACT_VERIFIED, TAMPERED, VOIDED}"
      - name: total_liquid_ml
        type: integer
        source: computed
        description: >-
          sum over the sale's lines of qty * Product.liquid_ml restricted to lines whose Product
          has is_liquid == true
        default: 0
      - name: issued_at
        type: datetime
        source: system
        description: logical-clock instant the bag was sealed
      - name: expires_at
        type: datetime
        source: computed
        description: itinerary.departure_utc plus SEAL_VALIDITY_HOURS
      - name: verified_at
        type: datetime
        source: system
        description: logical-clock instant the bag left ISSUED; null while ISSUED
        default: null

  - name: PreOrder
    parent: null
    common_fields: true
    fields:
      - name: itinerary_id
        type: string
        source: input
        description: FK -> PassengerItinerary.id; traveller holding the reservation
      - name: stock_item_id
        type: string
        source: input
        description: FK -> BondedStockItem.id; bonded item the units are reserved from
      - name: qty
        type: integer
        source: input
        description: units reserved
        constraints: "> 0"
      - name: program
        type: enum
        source: input
        description: whether collection happens on the outbound or the return journey
        constraints: "one of {PICKUP_ON_DEPARTURE, PICKUP_ON_RETURN}"
      - name: reservation_window_start
        type: datetime
        source: input
        description: inclusive start of the closed collection window
      - name: reservation_window_end
        type: datetime
        source: input
        description: inclusive end of the closed collection window
        constraints: must be strictly greater than reservation_window_start
      - name: status
        type: enum
        source: system
        description: reservation lifecycle
        default: RESERVED
        constraints: "one of {RESERVED, CONVERTED, CANCELLED, RELEASED}"
      - name: converted_sale_id
        type: string
        source: system
        description: FK -> Sale.id; basket created by conversion; null until CONVERTED
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: logical-clock instant the reservation left RESERVED; null while RESERVED
        default: null

  - name: CustomsAudit
    parent: null
    common_fields: true
    fields:
      - name: terminal_id
        type: string
        source: input
        description: FK -> Terminal.id; terminal under audit
      - name: stock_item_id
        type: string
        source: input
        description: FK -> BondedStockItem.id; the single bonded item being counted
      - name: period_code
        type: string
        source: input
        description: settlement period the count reconciles, format YYYY-MM
      - name: preparer_user_id
        type: string
        source: system
        description: X-User-ID of the StockController that created the audit
      - name: auditor_user_id
        type: string
        source: system
        description: X-User-ID of the CustomsAuditor that closed the audit; null until closed
        default: null
      - name: counted_qty
        type: integer
        source: input
        description: physical count declared on the most recent submit; null while DRAFT
        default: null
        constraints: ">= 0"
      - name: expected_qty_snapshot
        type: integer
        source: system
        description: >-
          BondedStockItem.on_hand_qty captured at the moment of each submit; frozen for the
          assessment so the write-off cascade cannot feed back into it
        default: null
      - name: shrinkage_qty
        type: integer
        source: computed
        description: max(0, expected_qty_snapshot - counted_qty)
        default: 0
      - name: assessable_qty
        type: integer
        source: computed
        description: shrinkage units beyond the statutory tolerance
        default: 0
      - name: assessed_duty_cents
        type: integer
        source: computed
        description: unaccounted-goods duty produced by calculations.unaccounted_goods_duty_assessment
        default: 0
      - name: round_count
        type: integer
        source: system
        description: 1 on the first submit, incremented on every re-submit after INFO_REQUESTED
        default: 1
      - name: info_request_note
        type: string
        source: system
        description: most recent auditor note attached with request-info; null until first request
        default: null
      - name: status
        type: enum
        source: system
        description: audit lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, INFO_REQUESTED, CLOSED_CLEAN, CLOSED_ASSESSED}"
      - name: closed_at
        type: datetime
        source: system
        description: logical-clock instant the audit reached a terminal state; null otherwise
        default: null

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  # --- Sale: two independent state dimensions on one row -------------------
  - entity: Sale
    initial_state: CART
    terminal_states: [VOIDED]
    note: >-
      Sale carries two independent dimensions. `fulfillment_status` (CART -> ELIGIBILITY_CLEARED ->
      PICKED_UP, with VOIDED reachable from all three) is the till dimension; `duty_status`
      (SUSPENDED -> EXEMPT_CONFIRMED | DUTY_LIABLE -> REVERSED) is the customs-accounting
      dimension. clear-eligibility advances only fulfillment_status and leaves duty_status at
      SUSPENDED; sealed-bag tampering advances only duty_status and leaves fulfillment_status at
      ELIGIBILITY_CLEARED. Transitions below name the dimension they move.
    transitions:
      - from: CART
        to: ELIGIBILITY_CLEARED
        trigger: "POST /sales/{sale_id}/clear-eligibility"
        actor: SalesAssociate
        dimension: fulfillment_status
        preconditions:
          - "sale.fulfillment_status == CART"
          - "the sale has at least one SaleLine (empty basket rejected with ERR_EMPTY_BASKET)"
          - "itinerary.scan_status IN {SCANNED, AMENDED}"
          - "itinerary.is_international == true"
          - "logical clock < itinerary.departure_utc"
          - "an ACTIVE AllowanceRule exists for (itinerary.destination_country, category) for every distinct category on the sale"
        side_effects:
          - "sets Sale.effective_destination_country = itinerary.destination_country"
          - "runs calculations.duty_exemption_accounting variant SUSPENDED_ESTIMATE, writing SaleLine.allowance_excess_qty / line_exempt_cents / line_duty_cents on every line and Sale.exempt_amount_cents / Sale.duty_liability_cents"
          - "sets Sale.eligibility_variant = SUSPENDED_ESTIMATE"
          - "recomputes Sale.arrival_advisory from the ACTIVE AllowanceRule advisory_text of each distinct category"
          - "recomputes Sale.sealed_bag_required"
          - "sets Sale.cleared_at = logical clock; leaves Sale.duty_status at SUSPENDED"
          - "increments Sale.version by 1"

      - from: ELIGIBILITY_CLEARED
        to: CART
        trigger: "system event: POST /itineraries/{itinerary_id}/amend on the sale's itinerary"
        actor: system
        dimension: fulfillment_status
        preconditions:
          - "sale.fulfillment_status == ELIGIBILITY_CLEARED"
        side_effects:
          - "resets Sale.exempt_amount_cents, Sale.duty_liability_cents to 0 and every SaleLine.allowance_excess_qty / line_exempt_cents / line_duty_cents to 0"
          - "sets Sale.eligibility_variant = null, Sale.effective_destination_country = null, Sale.arrival_advisory = [], Sale.cleared_at = null"
          - "increments Sale.version by 1"
        note: compensation for the amend; duty_status is untouched and stays SUSPENDED

      - from: ELIGIBILITY_CLEARED
        to: PICKED_UP
        trigger: "POST /sales/{sale_id}/pickup"
        actor: SalesAssociate
        dimension: fulfillment_status
        preconditions:
          - "sale.fulfillment_status == ELIGIBILITY_CLEARED"
          - "itinerary.scan_status IN {SCANNED, AMENDED}"
          - "logical clock < itinerary.departure_utc"
          - "when Sale.sealed_bag_required == true, a SealedBag with sale_id == sale.id and status == INTACT_VERIFIED exists"
          - "an ACTIVE AllowanceRule exists for (final effective destination, category) for every distinct category on the sale"
          - "for every SaleLine, the BondedStockItem with (terminal_id == sale.terminal_id, product_id == line.product_id) has available_qty >= line.qty"
        side_effects:
          - "sets Sale.effective_destination_country = itinerary.final_destination_country when itinerary.has_connection is true, else itinerary.destination_country"
          - "re-runs calculations.duty_exemption_accounting variant EXEMPT_CONFIRMED_FINAL, overwriting all line and sale exemption amounts"
          - "sets Sale.eligibility_variant = EXEMPT_CONFIRMED_FINAL, Sale.picked_up_at = logical clock"
          - "LINK 1: sets Sale.duty_status = EXEMPT_CONFIRMED when Sale.duty_liability_cents == 0, else DUTY_LIABLE"
          - "LINK 2 (caused by LINK 1): because duty_status left SUSPENDED, one SALE_ISSUE BondedMovement (qty_delta = -line.qty, source_ref_type SALE, source_ref_id = sale.id, agreement_period_code = the ACTIVE agreement's period_code) is appended per SaleLine in SaleLine.created_at ASC order, which lowers BondedStockItem.on_hand_qty and recomputes BondedStockItem.available_qty and duty_suspended_value_cents"
          - "LINK 3 (caused by LINK 2): because the SALE_ISSUE movements carry agreement_period_code, ConcessionAgreement.gross_sales_cents increases by Sale.gross_amount_cents and ConcessionAgreement.percentage_rent_cents is recomputed"
          - "LINK 4 (caused by LINK 3): because percentage_rent_cents changed, ConcessionAgreement.rent_basis is re-derived as PERCENTAGE when percentage_rent_cents >= minimum_guarantee_cents, else MINIMUM_GUARANTEE"
          - "increments Sale.version, BondedStockItem.version and ConcessionAgreement.version by 1 each"

      - from: CART
        to: VOIDED
        trigger: "POST /sales/{sale_id}/void"
        actor: SalesAssociate
        dimension: fulfillment_status
        preconditions:
          - "sale.fulfillment_status == CART"
        side_effects:
          - "sets Sale.duty_status = REVERSED, Sale.voided_at = logical clock, Sale.exempt_amount_cents = 0, Sale.duty_liability_cents = 0"
          - "sets every SealedBag with sale_id == sale.id and status IN {ISSUED, INTACT_VERIFIED, TAMPERED} to VOIDED"
          - "increments Sale.version by 1"

      - from: ELIGIBILITY_CLEARED
        to: VOIDED
        trigger: "POST /sales/{sale_id}/void"
        actor: SalesAssociate
        dimension: fulfillment_status
        preconditions:
          - "sale.fulfillment_status == ELIGIBILITY_CLEARED"
        side_effects:
          - "sets Sale.duty_status = REVERSED, Sale.voided_at = logical clock, Sale.exempt_amount_cents = 0, Sale.duty_liability_cents = 0"
          - "sets every SealedBag with sale_id == sale.id and status IN {ISSUED, INTACT_VERIFIED, TAMPERED} to VOIDED"
          - "increments Sale.version by 1"

      - from: PICKED_UP
        to: VOIDED
        trigger: "POST /sales/{sale_id}/void"
        actor: SalesAssociate
        dimension: fulfillment_status
        preconditions:
          - "sale.fulfillment_status == PICKED_UP"
          - "the sale's ConcessionAgreement.status == ACTIVE (a CLOSED period rejects with ERR_VOID_AFTER_PERIOD_CLOSE)"
        side_effects:
          - "sets Sale.duty_status = REVERSED, Sale.voided_at = logical clock, Sale.exempt_amount_cents = 0, Sale.duty_liability_cents = 0; Sale.gross_amount_cents is left intact"
          - "LINK 1: for every SALE_ISSUE BondedMovement with source_ref_id == sale.id and reversed == false, appends a REVERSAL BondedMovement with qty_delta = -original.qty_delta and reversal_of_movement_id = original.id, processed in the originals' created_at ASC order, restoring BondedStockItem.on_hand_qty and recomputing available_qty and duty_suspended_value_cents"
          - "LINK 2 (caused by LINK 1): because the reversal movements carry the same agreement_period_code, ConcessionAgreement.gross_sales_cents decreases by Sale.gross_amount_cents and percentage_rent_cents is recomputed"
          - "LINK 3 (caused by LINK 2): ConcessionAgreement.rent_basis is re-derived from the new percentage_rent_cents"
          - "sets every SealedBag with sale_id == sale.id and status IN {ISSUED, INTACT_VERIFIED, TAMPERED} to VOIDED"
          - "increments Sale.version, BondedStockItem.version and ConcessionAgreement.version by 1 each"

      - from: SUSPENDED
        to: DUTY_LIABLE
        trigger: "POST /sealed-bags/{sealed_bag_id}/verify with outcome == TAMPERED"
        actor: SalesAssociate
        dimension: duty_status
        preconditions:
          - "sale.fulfillment_status == ELIGIBILITY_CLEARED"
          - "sale.duty_status == SUSPENDED"
        side_effects:
          - "forfeits the arrival allowance: sets every SaleLine.allowance_excess_qty = line.qty, line_exempt_cents = 0 and line_duty_cents = round_half_up(line.qty * line.unit_price_cents * (product.duty_rate_bps + product.vat_rate_bps) / 10000)"
          - "sets Sale.exempt_amount_cents = 0 and Sale.duty_liability_cents = sum of the recomputed line_duty_cents"
          - "leaves Sale.fulfillment_status at ELIGIBILITY_CLEARED"
          - "increments Sale.version by 1"
        note: >-
          the duty dimension moves while the till dimension does not; pickup is then blocked by
          ERR_SEALED_BAG_REQUIRED because no INTACT_VERIFIED bag exists

  # --- PassengerItinerary: cyclic scan / amend loop ------------------------
  - entity: PassengerItinerary
    initial_state: UNSCANNED
    terminal_states: []
    transitions:
      - from: UNSCANNED
        to: SCANNED
        trigger: "POST /itineraries/{itinerary_id}/scan-boarding-pass"
        actor: SalesAssociate
        preconditions:
          - "itinerary.scan_status == UNSCANNED"
          - "submitted boarding_pass_barcode equals itinerary.boarding_pass_barcode"
          - "itinerary.is_international == true"
          - "logical clock < itinerary.departure_utc"
        side_effects:
          - "sets scanned_at = logical clock"
          - "recomputes calculations.terminal_nationality_mix for the departure Terminal, updating Terminal.traveler_nationality_mix and Terminal.scanned_itinerary_count_30d"
          - "increments PassengerItinerary.version and Terminal.version by 1 each"

      - from: SCANNED
        to: AMENDED
        trigger: "POST /itineraries/{itinerary_id}/amend"
        actor: SalesAssociate
        preconditions:
          - "itinerary.scan_status == SCANNED"
          - "logical clock < itinerary.departure_utc"
        side_effects:
          - "overwrites destination_country, final_destination_country, has_connection, connection_country, connection_departure_utc and departure_utc from the request body when supplied"
          - "recomputes is_international from the new destination_country"
          - "increments amend_count by 1"
          - "CASCADE: every Sale of this itinerary whose fulfillment_status == ELIGIBILITY_CLEARED reverts to CART with all exemption amounts reset (see the Sale ELIGIBILITY_CLEARED -> CART transition)"
          - "increments PassengerItinerary.version by 1"

      - from: AMENDED
        to: SCANNED
        trigger: "POST /itineraries/{itinerary_id}/scan-boarding-pass"
        actor: SalesAssociate
        preconditions:
          - "itinerary.scan_status == AMENDED"
          - "submitted boarding_pass_barcode equals itinerary.boarding_pass_barcode"
          - "itinerary.is_international == true"
          - "logical clock < itinerary.departure_utc"
        side_effects:
          - "sets scanned_at = logical clock"
          - "recomputes calculations.terminal_nationality_mix for the departure Terminal"
          - "increments PassengerItinerary.version and Terminal.version by 1 each"
        note: closes the SCANNED -> AMENDED -> SCANNED cycle; amend_count is not reset

  # --- CustomsAudit: cyclic review rounds, branching close -----------------
  - entity: CustomsAudit
    initial_state: DRAFT
    terminal_states: [CLOSED_CLEAN, CLOSED_ASSESSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /customs-audits/{audit_id}/submit"
        actor: StockController
        preconditions:
          - "audit.status == DRAFT"
          - "counted_qty <= BondedStockItem.on_hand_qty of the audited item"
        side_effects:
          - "stores counted_qty and sets expected_qty_snapshot = BondedStockItem.on_hand_qty at this instant"
          - "leaves round_count at 1"
          - "increments CustomsAudit.version by 1"

      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /customs-audits/{audit_id}/request-info"
        actor: CustomsAuditor
        preconditions:
          - "audit.status == SUBMITTED"
          - "X-User-ID != audit.preparer_user_id"
        side_effects:
          - "stores info_request_note"
          - "increments CustomsAudit.version by 1"

      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /customs-audits/{audit_id}/submit"
        actor: StockController
        preconditions:
          - "audit.status == INFO_REQUESTED"
          - "counted_qty <= BondedStockItem.on_hand_qty of the audited item"
        side_effects:
          - "overwrites counted_qty and re-takes expected_qty_snapshot = BondedStockItem.on_hand_qty at this instant"
          - "increments round_count by 1"
          - "increments CustomsAudit.version by 1"
        note: >-
          closes the SUBMITTED -> INFO_REQUESTED -> SUBMITTED cycle; round_count is the loop counter
          that calculations.unaccounted_goods_duty_assessment reads for its penalty multiplier

      - from: SUBMITTED
        to: CLOSED_CLEAN
        trigger: "POST /customs-audits/{audit_id}/close"
        actor: CustomsAuditor
        preconditions:
          - "audit.status == SUBMITTED"
          - "X-User-ID != audit.preparer_user_id"
          - "the ConcessionAgreement with (terminal_id == audit.terminal_id, period_code == audit.period_code) exists and has status == CLOSED"
          - "calculations.unaccounted_goods_duty_assessment yields assessable_qty == 0"
        side_effects:
          - "writes shrinkage_qty and assessable_qty (== 0); leaves assessed_duty_cents at 0"
          - "sets auditor_user_id = X-User-ID, closed_at = logical clock"
          - "sets BondedStockItem.last_reconciled_at = logical clock"
          - "increments CustomsAudit.version and BondedStockItem.version by 1 each"
        note: branch A of the fork; no write-off and no duty liability

      - from: SUBMITTED
        to: CLOSED_ASSESSED
        trigger: "POST /customs-audits/{audit_id}/close"
        actor: CustomsAuditor
        preconditions:
          - "audit.status == SUBMITTED"
          - "X-User-ID != audit.preparer_user_id"
          - "the ConcessionAgreement with (terminal_id == audit.terminal_id, period_code == audit.period_code) exists and has status == CLOSED"
          - "calculations.unaccounted_goods_duty_assessment yields assessable_qty > 0"
        side_effects:
          - "LINK 1: writes shrinkage_qty, assessable_qty and assessed_duty_cents; sets auditor_user_id = X-User-ID, closed_at = logical clock; Terminal.unaccounted_duty_liability_cents increases by assessed_duty_cents"
          - "LINK 2 (caused by LINK 1): because the audit reached CLOSED_ASSESSED with shrinkage_qty > 0, a SHRINKAGE_WRITE_OFF BondedMovement with qty_delta = -shrinkage_qty (source_ref_type CUSTOMS_AUDIT, source_ref_id = audit.id) is appended, lowering BondedStockItem.on_hand_qty and recomputing available_qty and duty_suspended_value_cents; last_reconciled_at = logical clock"
          - "LINK 3 (caused by LINK 2): because on_hand_qty is now below reserved_qty, PreOrders on that item with status == RESERVED are set to RELEASED in created_at ASC order, each appending a RESERVATION_RELEASE BondedMovement with qty_delta = -preorder.qty, until reserved_qty <= on_hand_qty"
          - "increments CustomsAudit.version, Terminal.version and BondedStockItem.version by 1 each"
        note: branch B of the fork; a strictly larger side-effect set than CLOSED_CLEAN

  # --- SealedBag: branching integrity fork --------------------------------
  - entity: SealedBag
    initial_state: ISSUED
    terminal_states: [INTACT_VERIFIED, TAMPERED, VOIDED]
    transitions:
      - from: ISSUED
        to: INTACT_VERIFIED
        trigger: "POST /sealed-bags/{sealed_bag_id}/verify with outcome == INTACT"
        actor: SalesAssociate
        preconditions:
          - "bag.status == ISSUED"
          - "the bag's Sale.fulfillment_status == ELIGIBILITY_CLEARED"
          - "logical clock <= bag.expires_at"
        side_effects:
          - "sets verified_at = logical clock"
          - "increments SealedBag.version by 1"

      - from: ISSUED
        to: TAMPERED
        trigger: "POST /sealed-bags/{sealed_bag_id}/verify with outcome == TAMPERED"
        actor: SalesAssociate
        preconditions:
          - "bag.status == ISSUED"
          - "the bag's Sale.fulfillment_status == ELIGIBILITY_CLEARED"
        side_effects:
          - "sets verified_at = logical clock"
          - "CASCADE: the bag's Sale.duty_status moves SUSPENDED -> DUTY_LIABLE with the allowance forfeited (see the Sale duty_status transition)"
          - "increments SealedBag.version and Sale.version by 1 each"

      - from: ISSUED
        to: VOIDED
        trigger: "system event: POST /sales/{sale_id}/void on the bag's sale"
        actor: system
        preconditions:
          - "bag.status IN {ISSUED, INTACT_VERIFIED, TAMPERED}"
        side_effects:
          - "sets verified_at = logical clock when it was null"
          - "increments SealedBag.version by 1"

      - from: INTACT_VERIFIED
        to: VOIDED
        trigger: "system event: POST /sales/{sale_id}/void on the bag's sale"
        actor: system
        preconditions:
          - "bag.status == INTACT_VERIFIED"
        side_effects:
          - "increments SealedBag.version by 1"

      - from: TAMPERED
        to: VOIDED
        trigger: "system event: POST /sales/{sale_id}/void on the bag's sale"
        actor: system
        preconditions:
          - "bag.status == TAMPERED"
        side_effects:
          - "increments SealedBag.version by 1"

  # --- PreOrder: branching reservation fork --------------------------------
  - entity: PreOrder
    initial_state: RESERVED
    terminal_states: [CONVERTED, CANCELLED, RELEASED]
    transitions:
      - from: RESERVED
        to: CONVERTED
        trigger: "POST /pre-orders/{pre_order_id}/convert"
        actor: StockController
        preconditions:
          - "preorder.status == RESERVED"
          - "itinerary.scan_status IN {SCANNED, AMENDED}"
          - "reservation_window_start <= logical clock <= reservation_window_end"
          - "a ConcessionAgreement of the item's terminal with status == ACTIVE exists"
          - "the reserved Product.assortment_status == LISTED"
        side_effects:
          - "creates one Sale with channel PRE_ORDER, itinerary_id = preorder.itinerary_id, terminal_id = the stock item's terminal_id, fulfillment_status CART, duty_status SUSPENDED"
          - "creates one SaleLine on that Sale with product_id = the stock item's product_id, qty = preorder.qty, unit_price_cents snapshotted from the Product, and sets Sale.gross_amount_cents = line_total_cents"
          - "appends a RESERVATION_RELEASE BondedMovement with qty_delta = -preorder.qty (source_ref_type PRE_ORDER, source_ref_id = preorder.id), lowering BondedStockItem.reserved_qty and raising available_qty"
          - "sets converted_sale_id and closed_at = logical clock"
          - "increments PreOrder.version and BondedStockItem.version by 1 each"

      - from: RESERVED
        to: CANCELLED
        trigger: "POST /pre-orders/{pre_order_id}/cancel"
        actor: Passenger
        preconditions:
          - "preorder.status == RESERVED"
          - "X-User-ID == preorder.itinerary_id"
        side_effects:
          - "appends a RESERVATION_RELEASE BondedMovement with qty_delta = -preorder.qty (source_ref_type PRE_ORDER, source_ref_id = preorder.id), lowering BondedStockItem.reserved_qty back to its pre-reservation value"
          - "sets closed_at = logical clock"
          - "increments PreOrder.version and BondedStockItem.version by 1 each"

      - from: RESERVED
        to: RELEASED
        trigger: "system event: POST /customs-audits/{audit_id}/close reaching CLOSED_ASSESSED on the same stock item"
        actor: system
        preconditions:
          - "preorder.status == RESERVED"
          - "BondedStockItem.on_hand_qty < BondedStockItem.reserved_qty after the write-off"
        side_effects:
          - "appends a RESERVATION_RELEASE BondedMovement with qty_delta = -preorder.qty (source_ref_type PRE_ORDER, source_ref_id = preorder.id)"
          - "sets closed_at = logical clock"
          - "increments PreOrder.version and BondedStockItem.version by 1 each"
        note: >-
          selection order is PreOrder.created_at ASC and the loop stops as soon as reserved_qty <=
          on_hand_qty; PreOrder.id never participates in the ordering

  # --- ConcessionAgreement: linear settlement pipeline ---------------------
  - entity: ConcessionAgreement
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /concession-agreements/{agreement_id}/activate"
        actor: TerminalAdmin
        preconditions:
          - "agreement.status == DRAFT"
          - "no other ConcessionAgreement of the same terminal_id has status == ACTIVE"
        side_effects:
          - "sets rent_basis = PERCENTAGE when percentage_rent_cents >= minimum_guarantee_cents, else MINIMUM_GUARANTEE"
          - "increments ConcessionAgreement.version by 1"

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /concession-agreements/{agreement_id}/close-period"
        actor: TerminalAdmin
        preconditions:
          - "agreement.status == ACTIVE"
          - "logical clock >= agreement.period_end_utc"
        side_effects:
          - "runs calculations.concession_rent_accrual variant FINAL_PERIOD_CLOSE, writing final_rent_cents and rent_basis"
          - "runs calculations.net_rent_settlement, writing marketing_credit_cents and net_rent_cents"
          - "sets closed_at = logical clock"
          - "increments ConcessionAgreement.version by 1"

  # --- Product: assortment pipeline with cascade-driven delist ------------
  - entity: Product
    initial_state: PENDING
    terminal_states: [DELISTED]
    transitions:
      - from: PENDING
        to: LISTED
        trigger: "POST /products/{product_id}/list"
        actor: TerminalAdmin
        preconditions:
          - "product.assortment_status == PENDING"
          - "the owning Brand.status == ACTIVE"
          - "no ACTIVE ExclusivityGrant with scope == TERMINAL_EXCLUSIVE, category == product.category and brand_id != product.brand_id covers the logical clock at any Terminal that holds a BondedStockItem for this product"
          - "for every Terminal holding a BondedStockItem for this product, Terminal.traveler_nationality_mix[product.target_nationality_code] >= product.required_nationality_share_bps"
        side_effects:
          - "sets listed_at = logical clock"
          - "increments Product.version by 1"

      - from: LISTED
        to: DELISTED
        trigger: "system event: POST /brands/{brand_id}/suspend on the owning brand"
        actor: system
        preconditions:
          - "product.assortment_status == LISTED"
        side_effects:
          - "sets listed_at = null"
          - "increments Product.version by 1"

  # --- Brand: commercial standing -----------------------------------------
  - entity: Brand
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /brands/{brand_id}/suspend"
        actor: TerminalAdmin
        preconditions:
          - "brand.status == ACTIVE"
        side_effects:
          - "sets suspended_at = logical clock"
          - "CASCADE: every Product with brand_id == brand.id and assortment_status == LISTED moves to DELISTED in Product.created_at ASC order"
          - "increments Brand.version by 1 and each affected Product.version by 1"

  # --- ExclusivityGrant: revocation ---------------------------------------
  - entity: ExclusivityGrant
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /exclusivity-grants/{grant_id}/revoke"
        actor: TerminalAdmin
        preconditions:
          - "grant.status == ACTIVE"
        side_effects:
          - "sets revoked_at = logical clock; the grant stops participating in both the overlap check and the assortment block"
          - "increments ExclusivityGrant.version by 1"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent's `version`)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: preorder-create-stale-stock-item
    parent_entity: BondedStockItem
    write_endpoint: "POST /pre-orders"
    occ_field: "expected_stock_item_version"
    description: |
      Creating a PreOrder against a BondedStockItem whose `version` has advanced since the client
      last read it is rejected with 412. A second sequential create carrying the previously observed
      version is legitimate under the product semantics — capacity may well still remain, so no
      state precondition rejects it — which is exactly why the reservation surface needs an explicit
      stale-version guard rather than a state check.
    error_id: ERR_STALE_STOCK_ITEM_VERSION
    http_status: 412

  - rule_id: sale-line-add-stale-sale
    parent_entity: Sale
    write_endpoint: "POST /sales/{sale_id}/lines"
    occ_field: "expected_sale_version"
    description: |
      Appending a SaleLine to a Sale whose `version` has advanced since the client last read it is
      rejected with 412. Adding a second line is always legitimate while the basket is in CART, so
      no state precondition catches a client working from a stale basket snapshot; the stale-version
      guard is the only deterministic protection for the recomputed basket totals.
    error_id: ERR_STALE_SALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: duty_exemption_accounting
    trigger: >-
      on the Sale CART -> ELIGIBILITY_CLEARED transition (variant SUSPENDED_ESTIMATE) and again on
      the Sale ELIGIBILITY_CLEARED -> PICKED_UP transition (variant EXEMPT_CONFIRMED_FINAL)
    algorithm: waterfall_allocation
    formula: |
      # Allowance units are consumed by the sale's own lines in a waterfall, per merchandise
      # category, in SaleLine.created_at ASC order (never SaleLine.id order).
      effective_destination =
          SUSPENDED_ESTIMATE      -> itinerary.destination_country
          EXEMPT_CONFIRMED_FINAL  -> itinerary.final_destination_country when itinerary.has_connection
                                     is true, else itinerary.destination_country

      for each line L in the sale's SaleLines ordered by created_at ASC:
          P                = Product with id == L.product_id
          rule             = the AllowanceRule with destination_country == effective_destination
                             AND category == P.category AND status == ACTIVE
                             (at most one exists; empty -> ERR_ALLOWANCE_RULE_MISSING)
          consumed_before  = sum of L2.qty over lines L2 of the same sale with
                             Product(L2).category == P.category and L2.created_at < L.created_at
          excess           = min(L.qty, max(0, consumed_before + L.qty - rule.allowance_units))
          L.allowance_excess_qty = excess
          L.line_total_cents     = L.qty * L.unit_price_cents
          L.line_exempt_cents    = (L.qty - excess) * L.unit_price_cents
          # ROUNDING ORDER IS PINNED: round at line level FIRST, then sum the rounded lines.
          # Summing the raw products and rounding once is a DIFFERENT and WRONG result.
          L.line_duty_cents      = round_half_up(excess * L.unit_price_cents
                                                 * (P.duty_rate_bps + P.vat_rate_bps) / 10000)

      Sale.gross_amount_cents   = sum of L.line_total_cents
      Sale.exempt_amount_cents  = sum of L.line_exempt_cents
      Sale.duty_liability_cents = sum of L.line_duty_cents      # sum of already-rounded lines
      Sale.effective_destination_country = effective_destination
      Sale.arrival_advisory = [ rule.advisory_text for each distinct Product.category on the sale,
                                ordered by category name ASC ]
    input_set: >-
      every SaleLine of the sale regardless of order of insertion; only AllowanceRules with status ==
      ACTIVE are eligible; SUPERSEDED rules are excluded
    constants:
      ROUNDING: round_half_up
      BPS_DENOMINATOR: 10000
    precision: "integer cents; round_half_up applied once per SaleLine, then summed"
    variants:
      - name: SUSPENDED_ESTIMATE
        when: >-
          evaluated at clear-eligibility, before the boarding-pass-verified final leg is committed
        difference: >-
          keys the allowance lookup on the FIRST-LEG arrival country (itinerary.destination_country),
          ignoring the onward connection entirely
      - name: EXEMPT_CONFIRMED_FINAL
        when: evaluated at pickup, once the sealed-bag chain for a connecting passenger is settled
        difference: >-
          keys the allowance lookup on itinerary.final_destination_country for connecting passengers,
          so the same basket can move from partly dutiable to fully exempt (or the reverse) with no
          change to any input field

  - name: concession_rent_accrual
    trigger: >-
      variant PROVISIONAL_PERIODIC on GET /concession-agreements/{agreement_id}/rent-projection;
      variant FINAL_PERIOD_CLOSE on the ConcessionAgreement ACTIVE -> CLOSED transition
    algorithm: threshold
    formula: |
      gross_sales_cents     = ConcessionAgreement.gross_sales_cents      # maintained ledger field
      percentage_rent_cents = round_half_up(gross_sales_cents * rent_pct_bps / 10000)
      period_days           = floor((period_end_utc - period_start_utc) / 86400 seconds)
      elapsed_days          = min(period_days,
                                  max(1, floor((clock_utc - period_start_utc) / 86400 seconds) + 1))

      PROVISIONAL_PERIODIC:
          prorated_minimum_guarantee_cents =
              round_half_up(minimum_guarantee_cents * elapsed_days / period_days)
          provisional_rent_cents = max(percentage_rent_cents, prorated_minimum_guarantee_cents)
          rent_basis = PERCENTAGE when percentage_rent_cents >= prorated_minimum_guarantee_cents
                       else MINIMUM_GUARANTEE

      FINAL_PERIOD_CLOSE:
          final_rent_cents = max(percentage_rent_cents, minimum_guarantee_cents)
          rent_basis = PERCENTAGE when percentage_rent_cents >= minimum_guarantee_cents
                       else MINIMUM_GUARANTEE
    input_set: >-
      gross_sales_cents counts only Sales with agreement_id == this agreement and
      fulfillment_status == PICKED_UP; CART, ELIGIBILITY_CLEARED and VOIDED sales are excluded
    constants:
      SECONDS_PER_DAY: 86400
      ROUNDING: round_half_up
    precision: integer cents, round_half_up
    variants:
      - name: PROVISIONAL_PERIODIC
        when: read at any logical-clock instant inside the open period
        difference: >-
          compares percentage rent against a DAY-PRORATED slice of the minimum guarantee, so an
          agreement mid-period can report rent_basis PERCENTAGE
      - name: FINAL_PERIOD_CLOSE
        when: written once at close-period
        difference: >-
          compares percentage rent against the FULL minimum guarantee, so the identical
          gross_sales_cents can flip rent_basis to MINIMUM_GUARANTEE and raise the rent

  - name: net_rent_settlement
    trigger: on the ConcessionAgreement ACTIVE -> CLOSED transition, immediately after concession_rent_accrual
    algorithm: tiered_pricing
    formula: |
      # Circular-looking dependency, resolved by a PINNED evaluation order.
      # net_rent depends on marketing_credit, marketing_credit depends on a tier, and the tier
      # looks like it could be keyed on either the gross or the net figure. It is keyed on the
      # GROSS figure. Re-evaluating the tier against net_rent_cents after step 4 is FORBIDDEN.
      step 1: gross_rent_cents = ConcessionAgreement.final_rent_cents      # from concession_rent_accrual
      step 2: tier_bps = 400 when gross_rent_cents >= 5000000
                         else 250 when gross_rent_cents >= 2000000
                         else 100
      step 3: marketing_credit_cents = round_half_up(gross_rent_cents * tier_bps / 10000)
      step 4: net_rent_cents = gross_rent_cents - marketing_credit_cents
    input_set: the single ConcessionAgreement being closed; no cross-entity aggregation
    constants:
      TIER_1_FLOOR_CENTS: 5000000
      TIER_1_BPS: 400
      TIER_2_FLOOR_CENTS: 2000000
      TIER_2_BPS: 250
      TIER_3_BPS: 100
    precision: integer cents, round_half_up; tier boundaries are inclusive (>=)

  - name: unaccounted_goods_duty_assessment
    trigger: on the CustomsAudit SUBMITTED -> CLOSED_CLEAN and SUBMITTED -> CLOSED_ASSESSED transitions
    algorithm: threshold
    formula: |
      # Evaluation order is pinned so the write-off cascade cannot feed back into its own input:
      # expected_qty_snapshot was frozen at submit time and is NOT re-read from the stock item here.
      expected          = CustomsAudit.expected_qty_snapshot
      shrinkage_qty     = max(0, expected - CustomsAudit.counted_qty)
      tolerance_qty     = floor(expected * SHRINKAGE_TOLERANCE_BPS / 10000)
      assessable_qty    = max(0, shrinkage_qty - tolerance_qty)
      P                 = Product of the audited BondedStockItem
      unit_duty_cents   = round_half_up(P.unit_price_cents
                                        * (P.duty_rate_bps + P.vat_rate_bps) / 10000)
      penalty_multiplier = AUDIT_PENALTY_MULTIPLIER when CustomsAudit.round_count >= AUDIT_PENALTY_ROUND_THRESHOLD
                           else 1
      assessed_duty_cents = round_half_up(assessable_qty * unit_duty_cents * penalty_multiplier)
    input_set: >-
      the single audited BondedStockItem and its Product; expected_qty_snapshot is the value frozen
      at the most recent submit, never the live on_hand_qty at close time
    constants:
      SHRINKAGE_TOLERANCE_BPS: 200
      AUDIT_PENALTY_ROUND_THRESHOLD: 3
      AUDIT_PENALTY_MULTIPLIER: 2
      ROUNDING: round_half_up
    precision: >-
      integer units for the quantity chain (floor for tolerance), integer cents with round_half_up
      applied to unit_duty_cents first and to the multiplied total second

  - name: terminal_nationality_mix
    trigger: >-
      on the PassengerItinerary UNSCANNED -> SCANNED and AMENDED -> SCANNED transitions, for the
      itinerary's departure Terminal
    algorithm: aggregation
    formula: |
      window_lo = clock_utc - NATIONALITY_MIX_WINDOW_DAYS days       # inclusive
      window_hi = clock_utc                                          # inclusive
      pool = PassengerItineraries with departure_terminal_id == T.id
             AND scan_status IN {SCANNED, AMENDED}
             AND scanned_at >= window_lo AND scanned_at <= window_hi
      T.scanned_itinerary_count_30d = count(pool)
      T.traveler_nationality_mix    = {} when count(pool) == 0, otherwise
          { n : floor(count(pool where nationality_code == n) * 10000 / count(pool))
            for each distinct nationality_code n in pool }
    input_set: >-
      only itineraries whose scan_status is SCANNED or AMENDED; UNSCANNED itineraries never enter
      the pool, so an unscanned traveller cannot influence assortment decisions
    constants:
      NATIONALITY_MIX_WINDOW_DAYS: 30
      BPS_DENOMINATOR: 10000
    precision: floor to whole basis points; shares therefore need not sum to exactly 10000

  - name: bonded_duty_suspended_value
    trigger: >-
      whenever a BondedMovement is appended for the item (RECEIPT, SALE_ISSUE, RESERVATION_HOLD,
      RESERVATION_RELEASE, SHRINKAGE_WRITE_OFF, AUDIT_ADJUSTMENT, REVERSAL)
    algorithm: aggregation
    formula: |
      on_hand_qty   = sum of M.qty_delta over BondedMovements M of this item with M.affects == ON_HAND
      reserved_qty  = sum of M.qty_delta over BondedMovements M of this item with M.affects == RESERVED
      available_qty = on_hand_qty - reserved_qty
      P             = Product of the item
      duty_suspended_value_cents =
          round_half_up(on_hand_qty * P.unit_price_cents
                        * (P.duty_rate_bps + P.vat_rate_bps) / 10000)
    input_set: every BondedMovement of the item, with no status filter (the ledger is append-only)
    constants:
      ROUNDING: round_half_up
    precision: integer units and integer cents, round_half_up

  - name: sealed_bag_liquid_volume
    trigger: on POST /sealed-bags, before the liquid-limit and seal-window checks run
    algorithm: aggregation
    formula: |
      total_liquid_ml = sum over the sale's SaleLines L of (L.qty * Product(L).liquid_ml)
                        restricted to lines whose Product.is_liquid == true
      expires_at      = itinerary.departure_utc + SEAL_VALIDITY_HOURS hours
      # limit check is inclusive: total_liquid_ml == terminal.liquid_limit_ml is ACCEPTED
      accept when total_liquid_ml <= terminal.liquid_limit_ml
      # onward-leg check is inclusive: connection_departure_utc == expires_at is ACCEPTED
      accept when itinerary.has_connection == false
                  OR itinerary.connection_departure_utc <= expires_at
    input_set: all SaleLines of the sale; non-liquid lines contribute 0
    constants:
      SEAL_VALIDITY_HOURS: 96
    precision: integer millilitres; instants compared at millisecond resolution

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "the acting X-User-Role appears in the called endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 25
    category: auth
    check: >-
      when X-User-Role == Passenger, X-User-ID equals the PassengerItinerary.id the request targets:
      the body's itinerary_id on POST /pre-orders, and preorder.itinerary_id on
      POST /pre-orders/{pre_order_id}/cancel
    error_id: ERR_NOT_ITINERARY_OWNER
    http_status: 403
    applies_to: "POST /pre-orders, POST /pre-orders/{pre_order_id}/cancel"

  - priority: 30
    category: existence
    check: "every id in the path exists, validated left to right, before any body id"
    error_id: ERR_TERMINAL_NOT_FOUND
    http_status: 404
    applies_to: "GET /terminals/{terminal_id}; any endpoint whose body carries terminal_id"

  - priority: 31
    category: existence
    check: "brand_id in path or body resolves to a Brand"
    error_id: ERR_BRAND_NOT_FOUND
    http_status: 404
    applies_to: "GET /brands/{brand_id}, POST /brands/{brand_id}/suspend, POST /exclusivity-grants, POST /products"

  - priority: 32
    category: existence
    check: "product_id in path or body resolves to a Product"
    error_id: ERR_PRODUCT_NOT_FOUND
    http_status: 404
    applies_to: "GET /products/{product_id}, POST /products/{product_id}/list, POST /bonded-stock-items, POST /sales/{sale_id}/lines"

  - priority: 33
    category: existence
    check: "grant_id, allowance_rule_id, movement_id, sale_line_id or sealed_bag_id in the path resolves"
    error_id: ERR_GRANT_NOT_FOUND
    http_status: 404
    applies_to: "GET /exclusivity-grants/{grant_id}, POST /exclusivity-grants/{grant_id}/revoke"

  - priority: 34
    category: existence
    check: "allowance_rule_id in the path resolves to an AllowanceRule"
    error_id: ERR_ALLOWANCE_RULE_NOT_FOUND
    http_status: 404
    applies_to: "GET /allowance-rules/{allowance_rule_id}"

  - priority: 35
    category: existence
    check: "stock_item_id in path or body resolves to a BondedStockItem"
    error_id: ERR_STOCK_ITEM_NOT_FOUND
    http_status: 404
    applies_to: "GET /bonded-stock-items/{stock_item_id}, POST /bonded-movements, POST /pre-orders, POST /customs-audits"

  - priority: 36
    category: existence
    check: "movement_id in the path resolves to a BondedMovement"
    error_id: ERR_MOVEMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /bonded-movements/{movement_id}, POST /bonded-movements/{movement_id}/reverse"

  - priority: 37
    category: existence
    check: "itinerary_id in path or body resolves to a PassengerItinerary"
    error_id: ERR_ITINERARY_NOT_FOUND
    http_status: 404
    applies_to: "GET /itineraries/{itinerary_id}, POST /itineraries/{itinerary_id}/scan-boarding-pass, POST /itineraries/{itinerary_id}/amend, POST /sales, POST /pre-orders"

  - priority: 38
    category: existence
    check: "sale_id in path or body resolves to a Sale"
    error_id: ERR_SALE_NOT_FOUND
    http_status: 404
    applies_to: "GET /sales/{sale_id}, POST /sales/{sale_id}/lines, POST /sales/{sale_id}/clear-eligibility, POST /sales/{sale_id}/pickup, POST /sales/{sale_id}/void, POST /sealed-bags"

  - priority: 39
    category: existence
    check: "sale_line_id in the path resolves to a SaleLine"
    error_id: ERR_SALE_LINE_NOT_FOUND
    http_status: 404
    applies_to: "GET /sale-lines/{sale_line_id}"

  - priority: 40
    category: existence
    check: "sealed_bag_id in the path resolves to a SealedBag"
    error_id: ERR_SEALED_BAG_NOT_FOUND
    http_status: 404
    applies_to: "GET /sealed-bags/{sealed_bag_id}, POST /sealed-bags/{sealed_bag_id}/verify"

  - priority: 41
    category: existence
    check: "pre_order_id in the path resolves to a PreOrder"
    error_id: ERR_PRE_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "GET /pre-orders/{pre_order_id}, POST /pre-orders/{pre_order_id}/convert, POST /pre-orders/{pre_order_id}/cancel"

  - priority: 42
    category: existence
    check: "agreement_id in the path resolves to a ConcessionAgreement"
    error_id: ERR_AGREEMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /concession-agreements/{agreement_id}, GET /concession-agreements/{agreement_id}/rent-projection, POST /concession-agreements/{agreement_id}/activate, POST /concession-agreements/{agreement_id}/close-period"

  - priority: 43
    category: existence
    check: "audit_id in the path resolves to a CustomsAudit"
    error_id: ERR_AUDIT_NOT_FOUND
    http_status: 404
    applies_to: "GET /customs-audits/{audit_id}, POST /customs-audits/{audit_id}/submit, POST /customs-audits/{audit_id}/request-info, POST /customs-audits/{audit_id}/close"

  - priority: 45
    category: business_constraint
    check: >-
      request body is well formed: every required field present, enums inside their declared set,
      qty > 0, quantities and rates inside their declared ranges, liquid_ml supplied and > 0 when
      is_liquid is true, effective_to > effective_from, period_end_utc > period_start_utc,
      reservation_window_end > reservation_window_start, and to_iso8601 >= the current logical clock
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

  - priority: 46
    category: business_constraint
    check: "sku is not already used by another Product"
    error_id: ERR_DUPLICATE_SKU
    http_status: 409
    applies_to: "POST /products"

  - priority: 47
    category: business_constraint
    check: "no BondedStockItem already exists for the (terminal_id, product_id) pair"
    error_id: ERR_DUPLICATE_STOCK_ITEM
    http_status: 409
    applies_to: "POST /bonded-stock-items"

  - priority: 48
    category: business_constraint
    check: "boarding_pass_barcode and passenger_ref are not already used by another PassengerItinerary"
    error_id: ERR_DUPLICATE_BOARDING_PASS
    http_status: 409
    applies_to: "POST /itineraries"

  - priority: 49
    category: business_constraint
    check: "no ConcessionAgreement already exists for the (terminal_id, period_code) pair"
    error_id: ERR_DUPLICATE_AGREEMENT_PERIOD
    http_status: 409
    applies_to: "POST /concession-agreements"

  - priority: 50
    category: business_constraint
    check: "seal_number is not already used by another SealedBag"
    error_id: ERR_DUPLICATE_SEAL_NUMBER
    http_status: 409
    applies_to: "POST /sealed-bags"

  # --- state preconditions (priorities 60-64) ------------------------------
  - priority: 60
    category: state
    check: "sale.fulfillment_status == CART"
    error_id: ERR_SALE_NOT_IN_CART
    http_status: 409
    applies_to: "POST /sales/{sale_id}/lines, POST /sales/{sale_id}/clear-eligibility"

  - priority: 60
    category: state
    check: "sale.fulfillment_status == ELIGIBILITY_CLEARED"
    error_id: ERR_SALE_NOT_CLEARED
    http_status: 409
    applies_to: "POST /sales/{sale_id}/pickup, POST /sealed-bags, POST /sealed-bags/{sealed_bag_id}/verify"

  - priority: 59
    category: state
    check: "sale.fulfillment_status != VOIDED"
    error_id: ERR_SALE_ALREADY_TERMINAL
    http_status: 409
    applies_to: "POST /sales/{sale_id}/void, POST /sales/{sale_id}/lines, POST /sales/{sale_id}/clear-eligibility, POST /sales/{sale_id}/pickup"

  - priority: 61
    category: state
    check: "itinerary.scan_status IN {SCANNED, AMENDED}"
    error_id: ERR_ITINERARY_NOT_SCANNED
    http_status: 409
    applies_to: "POST /sales/{sale_id}/clear-eligibility, POST /sales/{sale_id}/pickup, POST /pre-orders/{pre_order_id}/convert"

  - priority: 61
    category: state
    check: "itinerary.scan_status IN {UNSCANNED, AMENDED} for a scan, and == SCANNED for an amend"
    error_id: ERR_ITINERARY_SCAN_STATE_INVALID
    http_status: 409
    applies_to: "POST /itineraries/{itinerary_id}/scan-boarding-pass, POST /itineraries/{itinerary_id}/amend"

  - priority: 62
    category: state
    check: "product.assortment_status == PENDING"
    error_id: ERR_PRODUCT_NOT_PENDING
    http_status: 409
    applies_to: "POST /products/{product_id}/list"

  - priority: 62
    category: state
    check: "product.assortment_status == LISTED"
    error_id: ERR_PRODUCT_NOT_LISTED
    http_status: 409
    applies_to: "POST /sales/{sale_id}/lines, POST /pre-orders, POST /pre-orders/{pre_order_id}/convert"

  - priority: 62
    category: state
    check: "grant.status == ACTIVE"
    error_id: ERR_GRANT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /exclusivity-grants/{grant_id}/revoke"

  - priority: 62
    category: state
    check: "brand.status == ACTIVE"
    error_id: ERR_BRAND_ALREADY_SUSPENDED
    http_status: 409
    applies_to: "POST /brands/{brand_id}/suspend"

  - priority: 63
    category: state
    check: >-
      agreement.status == DRAFT for activate and == ACTIVE for close-period; a Sale may only be
      created while an agreement of the terminal has status == ACTIVE
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /concession-agreements/{agreement_id}/activate, POST /concession-agreements/{agreement_id}/close-period, POST /sales, POST /pre-orders/{pre_order_id}/convert"

  - priority: 63
    category: state
    check: "no other ConcessionAgreement of the same terminal_id already has status == ACTIVE"
    error_id: ERR_AGREEMENT_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /concession-agreements/{agreement_id}/activate"

  - priority: 63
    category: state
    check: "audit.status == DRAFT or INFO_REQUESTED for submit; == SUBMITTED for request-info and close"
    error_id: ERR_AUDIT_NOT_SUBMITTED
    http_status: 409
    applies_to: "POST /customs-audits/{audit_id}/submit, POST /customs-audits/{audit_id}/request-info, POST /customs-audits/{audit_id}/close"

  - priority: 64
    category: state
    check: "preorder.status == RESERVED"
    error_id: ERR_PREORDER_NOT_RESERVED
    http_status: 409
    applies_to: "POST /pre-orders/{pre_order_id}/convert, POST /pre-orders/{pre_order_id}/cancel"

  - priority: 64
    category: state
    check: "bag.status == ISSUED"
    error_id: ERR_BAG_NOT_ISSUED
    http_status: 409
    applies_to: "POST /sealed-bags/{sealed_bag_id}/verify"

  - priority: 64
    category: state
    check: >-
      the movement's movement_type IN {RECEIPT, AUDIT_ADJUSTMENT} and movement.reversed == false;
      SALE_ISSUE, RESERVATION_HOLD, RESERVATION_RELEASE, SHRINKAGE_WRITE_OFF and REVERSAL movements
      are only undone by their owning aggregate's own compensating action
    error_id: ERR_MOVEMENT_NOT_REVERSIBLE
    http_status: 409
    applies_to: "POST /bonded-movements/{movement_id}/reverse"

  # --- optimistic concurrency (priority 66) --------------------------------
  - priority: 66
    category: state
    check: "expected_stock_item_version equals the current BondedStockItem.version"
    error_id: ERR_STALE_STOCK_ITEM_VERSION
    http_status: 412
    applies_to: "POST /pre-orders"

  - priority: 66
    category: state
    check: "expected_sale_version equals the current Sale.version"
    error_id: ERR_STALE_SALE_VERSION
    http_status: 412
    applies_to: "POST /sales/{sale_id}/lines"

  # --- safety / transport compliance (priority 68) -------------------------
  - priority: 68
    category: business_safety
    check: >-
      calculations.sealed_bag_liquid_volume total_liquid_ml <= terminal.liquid_limit_ml; the
      comparison is inclusive, so a bag whose volume exactly equals the limit is accepted
    error_id: ERR_LIQUID_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /sealed-bags"

  - priority: 68
    category: business_safety
    check: >-
      when sale.sealed_bag_required == true, a SealedBag with sale_id == sale.id and status ==
      INTACT_VERIFIED exists
    error_id: ERR_SEALED_BAG_REQUIRED
    http_status: 409
    applies_to: "POST /sales/{sale_id}/pickup"

  # --- referential coherence (priority 70) ---------------------------------
  - priority: 70
    category: business_referential
    check: >-
      no ExclusivityGrant with status == ACTIVE, scope == TERMINAL_EXCLUSIVE, category ==
      product.category, brand_id != product.brand_id and effective_from <= clock < effective_to
      exists at any Terminal that holds a BondedStockItem for the product
    error_id: ERR_EXCLUSIVITY_CONFLICT
    http_status: 409
    applies_to: "POST /products/{product_id}/list"

  - priority: 70
    category: business_referential
    check: "product.category equals the owning Brand.category"
    error_id: ERR_PRODUCT_CATEGORY_MISMATCH
    http_status: 422
    applies_to: "POST /products"

  - priority: 70
    category: business_referential
    check: "the owning Brand.status == ACTIVE"
    error_id: ERR_BRAND_SUSPENDED
    http_status: 409
    applies_to: "POST /products/{product_id}/list"

  - priority: 70
    category: business_referential
    check: >-
      a BondedStockItem with (terminal_id == sale.terminal_id, product_id == body.product_id) exists
      for a sale line; and for a pre-order, the stock item's terminal_id equals the itinerary's
      departure_terminal_id
    error_id: ERR_TERMINAL_MISMATCH
    http_status: 409
    applies_to: "POST /sales/{sale_id}/lines, POST /pre-orders"

  - priority: 71
    category: business_referential
    check: >-
      an AllowanceRule with status == ACTIVE exists for (effective destination country,
      product.category) for every distinct category on the sale
    error_id: ERR_ALLOWANCE_RULE_MISSING
    http_status: 409
    applies_to: "POST /sales/{sale_id}/clear-eligibility, POST /sales/{sale_id}/pickup"

  # --- temporal windows (priority 72) --------------------------------------
  - priority: 72
    category: business_temporal
    check: >-
      at issuance, when itinerary.has_connection == true, itinerary.connection_departure_utc <=
      bag.expires_at (= itinerary.departure_utc + SEAL_VALIDITY_HOURS); at verification, logical
      clock <= bag.expires_at. Both comparisons are inclusive
    error_id: ERR_SEAL_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /sealed-bags, POST /sealed-bags/{sealed_bag_id}/verify"

  - priority: 72
    category: business_temporal
    check: "logical clock < itinerary.departure_utc"
    error_id: ERR_DEPARTURE_PASSED
    http_status: 409
    applies_to: "POST /itineraries/{itinerary_id}/scan-boarding-pass, POST /itineraries/{itinerary_id}/amend, POST /sales/{sale_id}/clear-eligibility, POST /sales/{sale_id}/pickup"

  - priority: 72
    category: business_temporal
    check: >-
      reservation_window_start >= logical clock; window_end <= itinerary.departure_utc when program
      == PICKUP_ON_DEPARTURE; window_start >= itinerary.departure_utc when program ==
      PICKUP_ON_RETURN; and for convert, reservation_window_start <= clock <= reservation_window_end
    error_id: ERR_RESERVATION_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /pre-orders, POST /pre-orders/{pre_order_id}/convert"

  - priority: 72
    category: business_temporal
    check: "logical clock >= agreement.period_end_utc"
    error_id: ERR_PERIOD_NOT_ENDED
    http_status: 409
    applies_to: "POST /concession-agreements/{agreement_id}/close-period"

  - priority: 73
    category: business_temporal
    check: >-
      no ExclusivityGrant with the same (terminal_id, category) and status == ACTIVE has a
      half-open interval [effective_from, effective_to) that intersects the new grant's half-open
      interval; intersection means existing.effective_from < new.effective_to AND
      new.effective_from < existing.effective_to, so exact adjacency
      (new.effective_from == existing.effective_to) is ACCEPTED and REVOKED grants are ignored
    error_id: ERR_EXCLUSIVITY_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /exclusivity-grants"

  # --- assortment / governance constraints (priority 78) -------------------
  - priority: 78
    category: business_constraint
    check: >-
      for every Terminal holding a BondedStockItem for the product,
      Terminal.traveler_nationality_mix[product.target_nationality_code] >=
      product.required_nationality_share_bps; a missing key counts as 0 bps and the comparison is
      inclusive, so a share exactly equal to the requirement is ACCEPTED
    error_id: ERR_NATIONALITY_MIX_BELOW_THRESHOLD
    http_status: 409
    applies_to: "POST /products/{product_id}/list"

  - priority: 78
    category: business_constraint
    check: "itinerary.is_international == true"
    error_id: ERR_ITINERARY_NOT_INTERNATIONAL
    http_status: 409
    applies_to: "POST /sales, POST /itineraries/{itinerary_id}/scan-boarding-pass"

  - priority: 78
    category: business_constraint
    check: "submitted boarding_pass_barcode equals itinerary.boarding_pass_barcode"
    error_id: ERR_BOARDING_PASS_MISMATCH
    http_status: 422
    applies_to: "POST /itineraries/{itinerary_id}/scan-boarding-pass"

  - priority: 78
    category: business_constraint
    check: "the sale has at least one SaleLine"
    error_id: ERR_EMPTY_BASKET
    http_status: 409
    applies_to: "POST /sales/{sale_id}/clear-eligibility"

  - priority: 79
    category: business_constraint
    check: "X-User-ID != audit.preparer_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /customs-audits/{audit_id}/request-info, POST /customs-audits/{audit_id}/close"

  - priority: 79
    category: business_constraint
    check: >-
      the ConcessionAgreement with (terminal_id == audit.terminal_id, period_code ==
      audit.period_code) exists and has status == CLOSED
    error_id: ERR_AUDIT_PERIOD_NOT_CLOSED
    http_status: 409
    applies_to: "POST /customs-audits/{audit_id}/close"

  - priority: 79
    category: business_constraint
    check: "counted_qty <= the audited BondedStockItem.on_hand_qty"
    error_id: ERR_COUNTED_QTY_EXCEEDS_EXPECTED
    http_status: 422
    applies_to: "POST /customs-audits/{audit_id}/submit"

  # --- fiscal / capacity checks (priority 85, evaluated last) --------------
  - priority: 85
    category: business_fiscal
    check: >-
      the BondedStockItem for the line has available_qty >= qty at line creation, and every line of
      the sale still satisfies available_qty >= line.qty at pickup
    error_id: ERR_BONDED_STOCK_INSUFFICIENT
    http_status: 409
    applies_to: "POST /sales/{sale_id}/lines, POST /sales/{sale_id}/pickup, POST /bonded-movements, POST /bonded-movements/{movement_id}/reverse"

  - priority: 85
    category: business_fiscal
    check: >-
      aggregate capacity over buffered CLOSED reservation windows: let conflicting be the RESERVED
      PreOrders P on the same stock item with P.reservation_window_start <= new_end + 24h AND
      P.reservation_window_end >= new_start - 24h; then
      sum(conflicting.qty) + new_qty <= BondedStockItem.on_hand_qty
    error_id: ERR_RESERVATION_CAPACITY_OVERLAP
    http_status: 409
    applies_to: "POST /pre-orders"

  - priority: 85
    category: business_fiscal
    check: "the sale's ConcessionAgreement.status == ACTIVE when voiding a PICKED_UP sale"
    error_id: ERR_VOID_AFTER_PERIOD_CLOSE
    http_status: 409
    applies_to: "POST /sales/{sale_id}/void"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
# `api_prefix` is the empty string, so every collection sits at the URL root.
# Single-resource GETs establish each entity's canonical collection segment;
# filtered-list GETs give every §1.1 FK a reverse-reachability channel, which
# matters because most children of a cascade (BondedMovement rows, the Sale a
# PreOrder converts into) never appear in any creation response.
# ---------------------------------------------------------------------------
endpoints:

  # --- single-resource reads ----------------------------------------------
  - method: GET
    path: "/terminals/{terminal_id}"
    description: "Fetch one terminal, including its rolling traveler nationality mix and accrued unaccounted-goods duty liability."
    roles: [TerminalAdmin, SalesAssociate, StockController, CustomsAuditor]
    code: 200
    input: []
    output: Terminal
    side_effects: []

  - method: GET
    path: "/brands/{brand_id}"
    description: "Fetch one brand."
    roles: [TerminalAdmin, SalesAssociate, StockController, CustomsAuditor]
    code: 200
    input: []
    output: Brand
    side_effects: []

  - method: GET
    path: "/allowance-rules/{allowance_rule_id}"
    description: "Fetch one arrival-allowance rule with its passenger advisory text."
    roles: [TerminalAdmin, SalesAssociate, StockController, CustomsAuditor, Passenger]
    code: 200
    input: []
    output: AllowanceRule
    side_effects: []

  - method: GET
    path: "/exclusivity-grants/{grant_id}"
    description: "Fetch one brand exclusivity grant."
    roles: [TerminalAdmin, SalesAssociate, StockController, CustomsAuditor]
    code: 200
    input: []
    output: ExclusivityGrant
    side_effects: []

  - method: GET
    path: "/products/{product_id}"
    description: "Fetch one product with its assortment status and duty/VAT rates."
    roles: [TerminalAdmin, SalesAssociate, StockController, CustomsAuditor, Passenger]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: GET
    path: "/bonded-stock-items/{stock_item_id}"
    description: "Fetch one bonded stock item, including on_hand_qty, reserved_qty, available_qty, duty_suspended_value_cents and its OCC version."
    roles: [TerminalAdmin, SalesAssociate, StockController, CustomsAuditor, Passenger]
    code: 200
    input: []
    output: BondedStockItem
    side_effects: []

  - method: GET
    path: "/bonded-movements/{movement_id}"
    description: "Fetch one append-only bonded ledger movement."
    roles: [TerminalAdmin, StockController, CustomsAuditor]
    code: 200
    input: []
    output: BondedMovement
    side_effects: []

  - method: GET
    path: "/itineraries/{itinerary_id}"
    description: "Fetch one passenger itinerary with its scan status and international-departure flag."
    roles: [TerminalAdmin, SalesAssociate, StockController, CustomsAuditor, Passenger]
    code: 200
    input: []
    output: PassengerItinerary
    side_effects: []

  - method: GET
    path: "/sales/{sale_id}"
    description: "Fetch one sale with its parallel fulfillment_status / duty_status pair, exemption accounting and arrival advisory."
    roles: [TerminalAdmin, SalesAssociate, StockController, CustomsAuditor, Passenger]
    code: 200
    input: []
    output: Sale
    side_effects: []

  - method: GET
    path: "/sale-lines/{sale_line_id}"
    description: "Fetch one sale line with its per-line exemption split."
    roles: [TerminalAdmin, SalesAssociate, StockController, CustomsAuditor, Passenger]
    code: 200
    input: []
    output: SaleLine
    side_effects: []

  - method: GET
    path: "/sealed-bags/{sealed_bag_id}"
    description: "Fetch one sealed bag (STEB) with its liquid volume and seal validity window."
    roles: [TerminalAdmin, SalesAssociate, StockController, CustomsAuditor, Passenger]
    code: 200
    input: []
    output: SealedBag
    side_effects: []

  - method: GET
    path: "/pre-orders/{pre_order_id}"
    description: "Fetch one pre-order reservation."
    roles: [TerminalAdmin, SalesAssociate, StockController, CustomsAuditor, Passenger]
    code: 200
    input: []
    output: PreOrder
    side_effects: []

  - method: GET
    path: "/concession-agreements/{agreement_id}"
    description: "Fetch one concession agreement with its accrued gross sales and settled rent figures."
    roles: [TerminalAdmin, SalesAssociate, StockController, CustomsAuditor]
    code: 200
    input: []
    output: ConcessionAgreement
    side_effects: []

  - method: GET
    path: "/customs-audits/{audit_id}"
    description: "Fetch one customs audit with its count, shrinkage and assessed duty."
    roles: [TerminalAdmin, StockController, CustomsAuditor]
    code: 200
    input: []
    output: CustomsAudit
    side_effects: []

  # --- filtered-list reads (FK reverse reachability) -----------------------
  - method: GET
    path: "/terminals"
    description: "List terminals, newest last; ordered by created_at ASC."
    roles: [TerminalAdmin, SalesAssociate, StockController, CustomsAuditor]
    code: 200
    input: ["country_code?", "limit?", "offset?"]
    output: Terminal[]
    side_effects: []

  - method: GET
    path: "/brands"
    description: "List brands filtered by category or status; ordered by created_at ASC."
    roles: [TerminalAdmin, SalesAssociate, StockController, CustomsAuditor]
    code: 200
    input: ["category?", "status?", "limit?", "offset?"]
    output: Brand[]
    side_effects: []

  - method: GET
    path: "/allowance-rules"
    description: "List arrival-allowance rules filtered by destination country, category or status; ordered by created_at ASC."
    roles: [TerminalAdmin, SalesAssociate, StockController, CustomsAuditor, Passenger]
    code: 200
    input: ["destination_country?", "category?", "status?", "limit?", "offset?"]
    output: AllowanceRule[]
    side_effects: []

  - method: GET
    path: "/exclusivity-grants"
    description: "List exclusivity grants filtered by brand, terminal, category, scope or status; ordered by created_at ASC."
    roles: [TerminalAdmin, SalesAssociate, StockController, CustomsAuditor]
    code: 200
    input: ["brand_id?", "terminal_id?", "category?", "scope?", "status?", "limit?", "offset?"]
    output: ExclusivityGrant[]
    side_effects: []

  - method: GET
    path: "/products"
    description: "List products filtered by brand, category or assortment status; ordered by created_at ASC."
    roles: [TerminalAdmin, SalesAssociate, StockController, CustomsAuditor, Passenger]
    code: 200
    input: ["brand_id?", "category?", "assortment_status?", "limit?", "offset?"]
    output: Product[]
    side_effects: []

  - method: GET
    path: "/bonded-stock-items"
    description: "List bonded stock items filtered by terminal or product; ordered by created_at ASC."
    roles: [TerminalAdmin, SalesAssociate, StockController, CustomsAuditor, Passenger]
    code: 200
    input: ["terminal_id?", "product_id?", "limit?", "offset?"]
    output: BondedStockItem[]
    side_effects: []

  - method: GET
    path: "/bonded-movements"
    description: "List bonded ledger movements filtered by stock item, movement type, reversal target or agreement period; ordered by created_at ASC. This is the only discovery channel for movements synthesized by a cascade (SALE_ISSUE, RESERVATION_HOLD, RESERVATION_RELEASE, SHRINKAGE_WRITE_OFF)."
    roles: [TerminalAdmin, StockController, CustomsAuditor]
    code: 200
    input: ["stock_item_id?", "movement_type?", "reversal_of_movement_id?", "agreement_period_code?", "source_ref_type?", "source_ref_id?", "limit?", "offset?"]
    output: BondedMovement[]
    side_effects: []

  - method: GET
    path: "/itineraries"
    description: "List passenger itineraries filtered by departure terminal, nationality or scan status; ordered by created_at ASC."
    roles: [TerminalAdmin, SalesAssociate, StockController, CustomsAuditor]
    code: 200
    input: ["departure_terminal_id?", "nationality_code?", "scan_status?", "limit?", "offset?"]
    output: PassengerItinerary[]
    side_effects: []

  - method: GET
    path: "/sales"
    description: "List sales filtered by itinerary, terminal, agreement, fulfillment status or duty status; ordered by created_at ASC."
    roles: [TerminalAdmin, SalesAssociate, StockController, CustomsAuditor]
    code: 200
    input: ["itinerary_id?", "terminal_id?", "agreement_id?", "fulfillment_status?", "duty_status?", "limit?", "offset?"]
    output: Sale[]
    side_effects: []

  - method: GET
    path: "/sale-lines"
    description: "List sale lines filtered by sale or product; ordered by created_at ASC."
    roles: [TerminalAdmin, SalesAssociate, StockController, CustomsAuditor, Passenger]
    code: 200
    input: ["sale_id?", "product_id?", "limit?", "offset?"]
    output: SaleLine[]
    side_effects: []

  - method: GET
    path: "/sealed-bags"
    description: "List sealed bags filtered by sale, terminal or status; ordered by created_at ASC."
    roles: [TerminalAdmin, SalesAssociate, StockController, CustomsAuditor, Passenger]
    code: 200
    input: ["sale_id?", "terminal_id?", "status?", "limit?", "offset?"]
    output: SealedBag[]
    side_effects: []

  - method: GET
    path: "/pre-orders"
    description: "List pre-orders filtered by itinerary, stock item, converted sale, program or status; ordered by created_at ASC."
    roles: [TerminalAdmin, SalesAssociate, StockController, CustomsAuditor, Passenger]
    code: 200
    input: ["itinerary_id?", "stock_item_id?", "converted_sale_id?", "program?", "status?", "limit?", "offset?"]
    output: PreOrder[]
    side_effects: []

  - method: GET
    path: "/concession-agreements"
    description: "List concession agreements filtered by terminal, period code or status; ordered by created_at ASC."
    roles: [TerminalAdmin, SalesAssociate, StockController, CustomsAuditor]
    code: 200
    input: ["terminal_id?", "period_code?", "status?", "limit?", "offset?"]
    output: ConcessionAgreement[]
    side_effects: []

  - method: GET
    path: "/customs-audits"
    description: "List customs audits filtered by terminal, stock item, period code or status; ordered by created_at ASC."
    roles: [TerminalAdmin, StockController, CustomsAuditor]
    code: 200
    input: ["terminal_id?", "stock_item_id?", "period_code?", "status?", "limit?", "offset?"]
    output: CustomsAudit[]
    side_effects: []

  # --- computed reads ------------------------------------------------------
  - method: GET
    path: "/concession-agreements/{agreement_id}/rent-projection"
    description: "Computed read applying the PROVISIONAL_PERIODIC variant of concession_rent_accrual at the current logical clock: percentage rent on gross sales so far versus the minimum guarantee prorated by elapsed days. Does not mutate the agreement."
    roles: [TerminalAdmin]
    code: 200
    input: []
    output: "{ provisional_rent_cents: integer, percentage_rent_cents: integer, prorated_minimum_guarantee_cents: integer, gross_sales_cents: integer, elapsed_days: integer, period_days: integer, rent_basis: string }"
    side_effects: []

  - method: GET
    path: "/terminals/{terminal_id}/nationality-mix"
    description: "Computed read applying terminal_nationality_mix over itineraries scanned within NATIONALITY_MIX_WINDOW_DAYS of the current logical clock, floored to basis points."
    roles: [TerminalAdmin]
    code: 200
    input: []
    output: "{ window_days: integer, scanned_itinerary_count: integer, mix_bps: object }"
    side_effects: []

  # --- reference-data writes ----------------------------------------------
  - method: POST
    path: "/terminals"
    description: "Register an airport terminal the operator holds concession space in. traveler_nationality_mix starts as an empty object, scanned_itinerary_count_30d and unaccounted_duty_liability_cents start at 0."
    roles: [TerminalAdmin]
    code: 201
    input: [iata_code, name, country_code, "sealed_bag_regime?", "liquid_limit_ml?"]
    output: Terminal
    side_effects: []

  - method: POST
    path: "/brands"
    description: "Register a supplier brand in a single product category. Starts ACTIVE."
    roles: [TerminalAdmin]
    code: 201
    input: [name, category]
    output: Brand
    side_effects: []

  - method: POST
    path: "/brands/{brand_id}/suspend"
    description: "Suspend a brand after a supply or compliance failure. Drives the brand-suspension cascade: every LISTED product of the brand is delisted."
    roles: [TerminalAdmin]
    code: 200
    input: []
    output: Brand
    side_effects:
      - "Brand ACTIVE -> SUSPENDED; stamps suspended_at with the logical clock"
      - "cascade: every Product of this brand with assortment_status == LISTED transitions to DELISTED and has listed_at cleared to null"

  - method: POST
    path: "/allowance-rules"
    description: "Publish the arrival allowance (duty-free units) and passenger advisory text for a (destination_country, category) pair. Supersedes any ACTIVE rule for the same pair."
    roles: [TerminalAdmin]
    code: 201
    input: [destination_country, category, allowance_units, advisory_text]
    output: AllowanceRule
    side_effects:
      - "any existing ACTIVE AllowanceRule for the same (destination_country, category) has status set to SUPERSEDED and superseded_at stamped with the logical clock"

  - method: POST
    path: "/exclusivity-grants"
    description: "Grant a brand exclusivity for a category at a terminal over a half-open [effective_from, effective_to) window. Rejected when the window intersects an ACTIVE grant for the same (terminal_id, category); exact adjacency is allowed."
    roles: [TerminalAdmin]
    code: 201
    input: [brand_id, terminal_id, category, scope, effective_from, effective_to]
    output: ExclusivityGrant
    side_effects: []

  - method: POST
    path: "/exclusivity-grants/{grant_id}/revoke"
    description: "Revoke an exclusivity grant, freeing the (terminal, category) window for other brands."
    roles: [TerminalAdmin]
    code: 200
    input: []
    output: ExclusivityGrant
    side_effects:
      - "ExclusivityGrant ACTIVE -> REVOKED; stamps revoked_at with the logical clock"

  - method: POST
    path: "/products"
    description: "Create a product under a brand. Starts PENDING (not sellable). duty_rate_bps + vat_rate_bps together form the combined levy applied to non-exempt units."
    roles: [TerminalAdmin]
    code: 201
    input: [brand_id, sku, category, unit_price_cents, duty_rate_bps, vat_rate_bps, target_nationality_code, "is_liquid?", "liquid_ml?", "required_nationality_share_bps?"]
    output: Product
    side_effects: []

  - method: POST
    path: "/products/{product_id}/list"
    description: "Admit a product into the assortment. Gated by brand status, brand exclusivity at every terminal stocking it, and the terminal's rolling traveler nationality mix for the product's target nationality."
    roles: [TerminalAdmin]
    code: 200
    input: []
    output: Product
    side_effects:
      - "Product PENDING -> LISTED; stamps listed_at with the logical clock"

  # --- bonded inventory writes --------------------------------------------
  - method: POST
    path: "/bonded-stock-items"
    description: "Open a bonded stock ledger for one (terminal, product) pair. All quantities start at 0 and version starts at 1."
    roles: [StockController]
    code: 201
    input: [terminal_id, product_id]
    output: BondedStockItem
    side_effects: []

  - method: POST
    path: "/bonded-movements"
    description: "Post a manual bonded ledger movement. Only RECEIPT (positive qty_delta) and AUDIT_ADJUSTMENT (either sign) may be posted directly; every other movement_type is synthesized by an owning aggregate's transition."
    roles: [StockController]
    code: 201
    input: [stock_item_id, movement_type, qty_delta]
    output: BondedMovement
    side_effects:
      - "appends an immutable BondedMovement with affects = ON_HAND, posted_by_user_id = X-User-ID, source_ref_type = MANUAL, source_ref_id = null"
      - "BondedStockItem.on_hand_qty += qty_delta; available_qty recomputed as on_hand_qty - reserved_qty"
      - "recomputes BondedStockItem.duty_suspended_value_cents via bonded_duty_suspended_value"
      - "increments BondedStockItem.version by 1"

  - method: POST
    path: "/bonded-movements/{movement_id}/reverse"
    description: "Compensate a previously posted RECEIPT or AUDIT_ADJUSTMENT by appending an equal-and-opposite REVERSAL movement. The original row is never mutated except for its reversed flag."
    roles: [StockController]
    code: 201
    input: []
    output: BondedMovement
    side_effects:
      - "appends an immutable BondedMovement with movement_type = REVERSAL, qty_delta = -original.qty_delta, affects = ON_HAND, reversal_of_movement_id = original.id, source_ref_type = MANUAL"
      - "sets the original BondedMovement.reversed to true"
      - "BondedStockItem.on_hand_qty += reversal qty_delta; available_qty recomputed"
      - "recomputes BondedStockItem.duty_suspended_value_cents via bonded_duty_suspended_value"
      - "increments BondedStockItem.version by 1"

  # --- itinerary writes ----------------------------------------------------
  - method: POST
    path: "/itineraries"
    description: "Record a passenger itinerary. is_international is computed as (destination_country != departure terminal's country_code); scan_status starts UNSCANNED and amend_count at 0."
    roles: [SalesAssociate]
    code: 201
    input: [passenger_ref, nationality_code, boarding_pass_barcode, departure_terminal_id, departure_utc, destination_country, final_destination_country, "has_connection?", "connection_country?", "connection_departure_utc?"]
    output: PassengerItinerary
    side_effects: []

  - method: POST
    path: "/itineraries/{itinerary_id}/scan-boarding-pass"
    description: "Scan the boarding pass to verify international departure eligibility. The scanned barcode must match the recorded one. Feeds the terminal's rolling traveler nationality mix."
    roles: [SalesAssociate]
    code: 200
    input: [boarding_pass_barcode]
    output: PassengerItinerary
    side_effects:
      - "PassengerItinerary UNSCANNED -> SCANNED, or AMENDED -> SCANNED; stamps scanned_at with the logical clock"
      - "recomputes the departure terminal's traveler_nationality_mix and scanned_itinerary_count_30d via terminal_nationality_mix"

  - method: POST
    path: "/itineraries/{itinerary_id}/amend"
    description: "Amend a scanned itinerary's routing. Invalidates the prior verification, so the pass must be rescanned, and reverts any ELIGIBILITY_CLEARED sale of this itinerary back to CART."
    roles: [SalesAssociate]
    code: 200
    input: [destination_country, final_destination_country, "has_connection?", "connection_country?", "connection_departure_utc?", "departure_utc?"]
    output: PassengerItinerary
    side_effects:
      - "PassengerItinerary SCANNED -> AMENDED; increments amend_count by 1; clears scanned_at to null; recomputes is_international"
      - "cascade: every Sale of this itinerary with fulfillment_status == ELIGIBILITY_CLEARED reverts to CART with duty_status left at SUSPENDED, cleared_at, exempt_amount_cents, duty_liability_cents, effective_destination_country, eligibility_variant, arrival_advisory and sealed_bag_required all cleared, and increments Sale.version by 1"
      - "recomputes the departure terminal's traveler_nationality_mix and scanned_itinerary_count_30d via terminal_nationality_mix"

  # --- sale writes ---------------------------------------------------------
  - method: POST
    path: "/sales"
    description: "Open a basket against a verified-international itinerary. terminal_id is copied from the itinerary's departure terminal and agreement_id from that terminal's ACTIVE ConcessionAgreement. Starts CART / SUSPENDED."
    roles: [SalesAssociate]
    code: 201
    input: [itinerary_id, channel]
    output: Sale
    side_effects: []

  - method: POST
    path: "/sales/{sale_id}/lines"
    description: "Add a LISTED product to the basket. Optimistically concurrent on the parent Sale: expected_sale_version must equal the current Sale.version."
    roles: [SalesAssociate]
    code: 201
    input: [product_id, qty, expected_sale_version]
    output: SaleLine
    side_effects:
      - "snapshots unit_price_cents from the product and sets line_total_cents = unit_price_cents * qty; allowance_excess_qty, line_exempt_cents and line_duty_cents start at 0"
      - "Sale.gross_amount_cents recomputed as the sum of its lines' line_total_cents"
      - "increments Sale.version by 1"

  - method: POST
    path: "/sales/{sale_id}/clear-eligibility"
    description: "Verify sales eligibility and price the duty/tax exemption under the SUSPENDED_ESTIMATE variant of duty_exemption_accounting, using the connecting-passenger effective destination. Attaches the arrival-allowance advisory and decides whether a sealed bag is required."
    roles: [SalesAssociate]
    code: 200
    input: []
    output: Sale
    side_effects:
      - "Sale fulfillment_status CART -> ELIGIBILITY_CLEARED; stamps cleared_at with the logical clock"
      - "Sale duty_status stays at SUSPENDED; the duty dimension is not advanced by this transition"
      - "sets effective_destination_country, exempt_amount_cents, duty_liability_cents and eligibility_variant = SUSPENDED_ESTIMATE; writes allowance_excess_qty, line_exempt_cents and line_duty_cents on every SaleLine"
      - "sets arrival_advisory to the concatenated advisory_text of the applied ACTIVE AllowanceRules, ordered by created_at ASC"
      - "sets sealed_bag_required = true when the terminal's sealed_bag_regime == ICAO_STEB, the itinerary has_connection == true, and at least one line's product is_liquid == true"
      - "increments Sale.version by 1"

  - method: POST
    path: "/sales/{sale_id}/pickup"
    description: "Hand the goods over at the gate. Re-prices the exemption under the EXEMPT_CONFIRMED_FINAL variant against the final destination, issues the bonded stock, and rolls the sale into the concession rent accrual."
    roles: [SalesAssociate]
    code: 200
    input: []
    output: Sale
    side_effects:
      - "Sale fulfillment_status ELIGIBILITY_CLEARED -> PICKED_UP; stamps picked_up_at with the logical clock"
      - "Sale duty_status SUSPENDED|DUTY_LIABLE -> EXEMPT_CONFIRMED, or -> DUTY_LIABLE when the final pass still leaves duty_liability_cents > 0"
      - "re-runs duty_exemption_accounting under EXEMPT_CONFIRMED_FINAL: rewrites effective_destination_country, exempt_amount_cents, duty_liability_cents, eligibility_variant and every SaleLine's per-line split"
      - "cascade level 2: appends one SALE_ISSUE BondedMovement per line, in SaleLine.created_at ASC order, with qty_delta = -line.qty, affects = ON_HAND, source_ref_type = SALE, source_ref_id = sale.id and agreement_period_code = the ACTIVE agreement's period_code; decrements each BondedStockItem.on_hand_qty, recomputes available_qty and duty_suspended_value_cents, and increments its version by 1"
      - "cascade level 3: ConcessionAgreement.gross_sales_cents += Sale.gross_amount_cents and percentage_rent_cents recomputed via concession_rent_accrual PROVISIONAL_PERIODIC"
      - "cascade level 4: ConcessionAgreement.rent_basis re-derived as PERCENTAGE when percentage_rent_cents >= minimum_guarantee_cents, else MINIMUM_GUARANTEE"
      - "increments Sale.version by 1"

  - method: POST
    path: "/sales/{sale_id}/void"
    description: "Void a basket. A PICKED_UP sale is fully compensated: bonded units are returned by an equal-and-opposite ledger movement and the concession rent accrual is unwound, leaving both conserved quantities exactly as they were before pickup."
    roles: [SalesAssociate]
    code: 200
    input: []
    output: Sale
    side_effects:
      - "Sale fulfillment_status CART|ELIGIBILITY_CLEARED|PICKED_UP -> VOIDED; duty_status -> REVERSED; stamps voided_at with the logical clock"
      - "when the sale was PICKED_UP: for every SALE_ISSUE BondedMovement with source_ref_id == sale.id and reversed == false, in the originals' created_at ASC order, appends a REVERSAL BondedMovement with qty_delta = -original.qty_delta, affects = ON_HAND, reversal_of_movement_id = original.id, source_ref_type = SALE, source_ref_id = sale.id; restores each BondedStockItem.on_hand_qty, recomputes available_qty and duty_suspended_value_cents, and increments its version by 1"
      - "when the sale was PICKED_UP: ConcessionAgreement.gross_sales_cents -= Sale.gross_amount_cents, percentage_rent_cents recomputed and rent_basis re-derived"
      - "sets every SealedBag with sale_id == sale.id and status IN {ISSUED, INTACT_VERIFIED, TAMPERED} to VOIDED"
      - "increments Sale.version by 1"

  # --- sealed bag writes ---------------------------------------------------
  - method: POST
    path: "/sealed-bags"
    description: "Issue a tamper-evident sealed bag (STEB) for a cleared basket's liquid lines. total_liquid_ml and the 96-hour seal validity window come from sealed_bag_liquid_volume."
    roles: [SalesAssociate]
    code: 201
    input: [sale_id, seal_number]
    output: SealedBag
    side_effects:
      - "terminal_id copied from the sale; total_liquid_ml computed from the sale's liquid lines; issued_at = logical clock; expires_at = itinerary.departure_utc + SEAL_VALIDITY_HOURS; status starts ISSUED"

  - method: POST
    path: "/sealed-bags/{sealed_bag_id}/verify"
    description: "Record the connecting-airport seal inspection outcome. outcome INTACT drives INTACT_VERIFIED, TAMPERED drives TAMPERED, which blocks pickup for any sale that requires a bag."
    roles: [SalesAssociate]
    code: 200
    input: [outcome]
    output: SealedBag
    side_effects:
      - "SealedBag ISSUED -> INTACT_VERIFIED or ISSUED -> TAMPERED; stamps verified_at with the logical clock"
      - "when outcome == TAMPERED and the sale's duty_status == SUSPENDED: the sale's duty dimension moves SUSPENDED -> DUTY_LIABLE, forfeiting the allowance on every SaleLine (allowance_excess_qty = line.qty, line_exempt_cents = 0, line_duty_cents recomputed), setting Sale.exempt_amount_cents = 0 and Sale.duty_liability_cents to the recomputed sum, leaving fulfillment_status at ELIGIBILITY_CLEARED, and incrementing Sale.version by 1"

  # --- pre-order writes ----------------------------------------------------
  - method: POST
    path: "/pre-orders"
    description: "Reserve bonded units for a pre-order / pick-up-on-return program. Optimistically concurrent on the parent BondedStockItem: expected_stock_item_version must equal the current BondedStockItem.version. Aggregate capacity is checked over buffered reservation windows, not just the requested one."
    roles: [Passenger]
    code: 201
    input: [itinerary_id, stock_item_id, qty, program, reservation_window_start, reservation_window_end, expected_stock_item_version]
    output: PreOrder
    side_effects:
      - "PreOrder starts RESERVED with converted_sale_id and closed_at null"
      - "appends a RESERVATION_HOLD BondedMovement with qty_delta = +qty, affects = RESERVED, source_ref_type = PRE_ORDER, source_ref_id = the pre-order id"
      - "BondedStockItem.reserved_qty += qty; available_qty recomputed as on_hand_qty - reserved_qty"
      - "increments BondedStockItem.version by 1"

  - method: POST
    path: "/pre-orders/{pre_order_id}/convert"
    description: "Convert a reservation into a real basket at pick-up time. Creates the Sale and its single line, then releases the reservation hold so the units are issued once, by the sale, and not double-counted."
    roles: [StockController]
    code: 200
    input: []
    output: PreOrder
    side_effects:
      - "PreOrder RESERVED -> CONVERTED; sets converted_sale_id and closed_at = logical clock"
      - "creates one Sale (channel PRE_ORDER, fulfillment_status CART, duty_status SUSPENDED) plus one SaleLine for the reserved product and qty; sets Sale.gross_amount_cents"
      - "appends a RESERVATION_RELEASE BondedMovement with qty_delta = -preorder.qty, affects = RESERVED; BondedStockItem.reserved_qty decreases and available_qty is recomputed"
      - "increments PreOrder.version and BondedStockItem.version by 1 each"

  - method: POST
    path: "/pre-orders/{pre_order_id}/cancel"
    description: "Passenger cancels their own reservation. Restores reserved capacity exactly, conserving the reserved-units invariant."
    roles: [Passenger]
    code: 200
    input: []
    output: PreOrder
    side_effects:
      - "PreOrder RESERVED -> CANCELLED; sets closed_at = logical clock"
      - "appends a RESERVATION_RELEASE BondedMovement with qty_delta = -preorder.qty, affects = RESERVED; BondedStockItem.reserved_qty returns to its pre-reservation value and available_qty is recomputed"
      - "increments PreOrder.version and BondedStockItem.version by 1 each"

  # --- concession agreement writes -----------------------------------------
  - method: POST
    path: "/concession-agreements"
    description: "Draft a concession agreement for one settlement period at a terminal: percentage-of-sales rent with a minimum guarantee. All accrual fields start at 0 and status starts DRAFT."
    roles: [TerminalAdmin]
    code: 201
    input: [terminal_id, period_code, period_start_utc, period_end_utc, rent_pct_bps, minimum_guarantee_cents]
    output: ConcessionAgreement
    side_effects: []

  - method: POST
    path: "/concession-agreements/{agreement_id}/activate"
    description: "Activate the drafted agreement so sales at the terminal accrue against it. At most one agreement per terminal may be ACTIVE."
    roles: [TerminalAdmin]
    code: 200
    input: []
    output: ConcessionAgreement
    side_effects:
      - "ConcessionAgreement DRAFT -> ACTIVE"
      - "sets rent_basis = PERCENTAGE when percentage_rent_cents >= minimum_guarantee_cents, else MINIMUM_GUARANTEE"
      - "increments ConcessionAgreement.version by 1"

  - method: POST
    path: "/concession-agreements/{agreement_id}/close-period"
    description: "Close the settlement period once the logical clock has reached period_end_utc. Applies the FINAL_PERIOD_CLOSE variant of concession_rent_accrual (no proration of the minimum guarantee) and then settles net rent through the tiered marketing credit."
    roles: [TerminalAdmin]
    code: 200
    input: []
    output: ConcessionAgreement
    side_effects:
      - "ConcessionAgreement ACTIVE -> CLOSED; sets closed_at = logical clock"
      - "runs concession_rent_accrual FINAL_PERIOD_CLOSE, writing final_rent_cents and rent_basis"
      - "runs net_rent_settlement, writing marketing_credit_cents and net_rent_cents"
      - "increments ConcessionAgreement.version by 1"

  # --- customs audit writes ------------------------------------------------
  - method: POST
    path: "/customs-audits"
    description: "Open a customs stock-count audit against one bonded stock item for a settlement period. preparer_user_id is stamped from X-User-ID, status starts DRAFT and round_count at 1."
    roles: [StockController]
    code: 201
    input: [terminal_id, stock_item_id, period_code]
    output: CustomsAudit
    side_effects: []

  - method: POST
    path: "/customs-audits/{audit_id}/submit"
    description: "Submit the physical count. Re-submission after an information request increments round_count, which drives the repeat-finding penalty multiplier in unaccounted_goods_duty_assessment."
    roles: [StockController]
    code: 200
    input: [counted_qty]
    output: CustomsAudit
    side_effects:
      - "CustomsAudit DRAFT -> SUBMITTED (round_count stays 1) or INFO_REQUESTED -> SUBMITTED (round_count += 1)"
      - "stores counted_qty and re-takes expected_qty_snapshot = the audited BondedStockItem.on_hand_qty at this instant"
      - "increments CustomsAudit.version by 1"

  - method: POST
    path: "/customs-audits/{audit_id}/request-info"
    description: "Auditor returns the submission for more information, reopening the count cycle. Segregation of duties: the requesting X-User-ID must differ from the audit's preparer_user_id."
    roles: [CustomsAuditor]
    code: 200
    input: [info_request_note]
    output: CustomsAudit
    side_effects:
      - "CustomsAudit SUBMITTED -> INFO_REQUESTED; stores info_request_note"
      - "increments CustomsAudit.version by 1"

  - method: POST
    path: "/customs-audits/{audit_id}/close"
    description: "Close the audit. Branches on unaccounted_goods_duty_assessment: assessable_qty == 0 closes CLEAN, otherwise closes ASSESSED and drives the shrinkage write-off and unaccounted-goods duty liability cascade. Requires the matching settlement period to already be CLOSED, and an auditor other than the preparer."
    roles: [CustomsAuditor]
    code: 200
    input: []
    output: CustomsAudit
    side_effects:
      - "writes shrinkage_qty, assessable_qty and assessed_duty_cents; sets auditor_user_id = X-User-ID and closed_at = logical clock"
      - "CLOSED_CLEAN branch: sets BondedStockItem.last_reconciled_at only"
      - "CLOSED_ASSESSED branch, cascade level 1: Terminal.unaccounted_duty_liability_cents += assessed_duty_cents"
      - "CLOSED_ASSESSED branch, cascade level 2: appends a SHRINKAGE_WRITE_OFF BondedMovement with qty_delta = -shrinkage_qty, affects = ON_HAND, source_ref_type = CUSTOMS_AUDIT, source_ref_id = audit.id; lowers BondedStockItem.on_hand_qty, recomputes available_qty and duty_suspended_value_cents, sets last_reconciled_at"
      - "CLOSED_ASSESSED branch, cascade level 3: while reserved_qty > on_hand_qty, RESERVED PreOrders on that item are set to RELEASED in created_at ASC order, each appending a RESERVATION_RELEASE BondedMovement with qty_delta = -preorder.qty and affects = RESERVED"
      - "increments CustomsAudit.version, Terminal.version and BondedStockItem.version by 1 each"

  # --- test-driving endpoint -----------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every deadline, seal-validity, reservation-window, nationality-mix and settlement-period rule reads. The startup default is exactly 2026-08-01T00:00:00Z and the clock MUST NOT fall back to real wall-clock time before this endpoint is called. The clock is monotonic: to_iso8601 earlier than the current logical time is rejected with ERR_INVALID_REQUEST."
    roles: [TerminalAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- authentication and authorization ------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-Role header missing, empty, or naming a role outside the §1.7 matrix"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the caller's role is not listed in the target endpoint's roles"
  - id: ERR_NOT_ITINERARY_OWNER
    http: 403
    condition: "a Passenger acts on an itinerary, sale, sale line, sealed bag or pre-order that does not trace back to their own PassengerItinerary id"

  # --- existence -----------------------------------------------------------
  - id: ERR_TERMINAL_NOT_FOUND
    http: 404
    condition: "terminal_id in the path or body matches no Terminal"
  - id: ERR_BRAND_NOT_FOUND
    http: 404
    condition: "brand_id in the path or body matches no Brand"
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "product_id in the path or body matches no Product"
  - id: ERR_GRANT_NOT_FOUND
    http: 404
    condition: "grant_id in the path matches no ExclusivityGrant"
  - id: ERR_ALLOWANCE_RULE_NOT_FOUND
    http: 404
    condition: "allowance_rule_id in the path matches no AllowanceRule"
  - id: ERR_STOCK_ITEM_NOT_FOUND
    http: 404
    condition: "stock_item_id in the path or body matches no BondedStockItem"
  - id: ERR_MOVEMENT_NOT_FOUND
    http: 404
    condition: "movement_id in the path matches no BondedMovement"
  - id: ERR_ITINERARY_NOT_FOUND
    http: 404
    condition: "itinerary_id in the path or body matches no PassengerItinerary"
  - id: ERR_SALE_NOT_FOUND
    http: 404
    condition: "sale_id in the path or body matches no Sale"
  - id: ERR_SALE_LINE_NOT_FOUND
    http: 404
    condition: "sale_line_id in the path matches no SaleLine"
  - id: ERR_SEALED_BAG_NOT_FOUND
    http: 404
    condition: "sealed_bag_id in the path matches no SealedBag"
  - id: ERR_PRE_ORDER_NOT_FOUND
    http: 404
    condition: "pre_order_id in the path matches no PreOrder"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "agreement_id in the path matches no ConcessionAgreement"
  - id: ERR_AUDIT_NOT_FOUND
    http: 404
    condition: "audit_id in the path matches no CustomsAudit"

  # --- schema and uniqueness ----------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "a required input field is missing, an enum value is outside its declared set, a quantity or basis-point figure is negative, a period or reservation window has end <= start, is_liquid is true with liquid_ml absent, or POST /_clock/set_current_utc moves the logical clock backwards"
  - id: ERR_DUPLICATE_SKU
    http: 409
    condition: "another Product already exists with the same sku"
  - id: ERR_DUPLICATE_STOCK_ITEM
    http: 409
    condition: "a BondedStockItem already exists for the same (terminal_id, product_id) pair"
  - id: ERR_DUPLICATE_BOARDING_PASS
    http: 409
    condition: "another PassengerItinerary already exists with the same boarding_pass_barcode"
  - id: ERR_DUPLICATE_AGREEMENT_PERIOD
    http: 409
    condition: "a ConcessionAgreement already exists for the same (terminal_id, period_code) pair"
  - id: ERR_DUPLICATE_SEAL_NUMBER
    http: 409
    condition: "another SealedBag already exists with the same seal_number"

  # --- state preconditions -------------------------------------------------
  - id: ERR_SALE_ALREADY_TERMINAL
    http: 409
    condition: "the sale is already VOIDED, so no further till action is possible"
  - id: ERR_SALE_NOT_IN_CART
    http: 409
    condition: "adding a line to, or clearing eligibility on, a sale whose fulfillment_status is not CART"
  - id: ERR_SALE_NOT_CLEARED
    http: 409
    condition: "picking up, issuing a sealed bag for, or verifying a sealed bag of a sale whose fulfillment_status is not ELIGIBILITY_CLEARED"
  - id: ERR_ITINERARY_NOT_SCANNED
    http: 409
    condition: "the itinerary's boarding pass has not been verified (scan_status is UNSCANNED) at eligibility clearance, pickup or pre-order conversion"
  - id: ERR_ITINERARY_SCAN_STATE_INVALID
    http: 409
    condition: "scanning an already-SCANNED itinerary, or amending one that is not currently SCANNED"
  - id: ERR_PRODUCT_NOT_PENDING
    http: 409
    condition: "listing a product whose assortment_status is not PENDING"
  - id: ERR_PRODUCT_NOT_LISTED
    http: 409
    condition: "selling, reserving or converting a product whose assortment_status is not LISTED"
  - id: ERR_GRANT_NOT_ACTIVE
    http: 409
    condition: "revoking an ExclusivityGrant that is already REVOKED"
  - id: ERR_BRAND_ALREADY_SUSPENDED
    http: 409
    condition: "suspending a Brand that is already SUSPENDED"
  - id: ERR_AGREEMENT_NOT_ACTIVE
    http: 409
    condition: "activating a non-DRAFT agreement, closing a non-ACTIVE agreement, or opening a sale or converting a pre-order at a terminal with no ACTIVE ConcessionAgreement"
  - id: ERR_AGREEMENT_ALREADY_ACTIVE
    http: 409
    condition: "activating a second ConcessionAgreement at a terminal that already has one ACTIVE"
  - id: ERR_AUDIT_NOT_SUBMITTED
    http: 409
    condition: "submitting an audit that is neither DRAFT nor INFO_REQUESTED, or requesting information on / closing an audit that is not SUBMITTED"
  - id: ERR_PREORDER_NOT_RESERVED
    http: 409
    condition: "converting or cancelling a PreOrder that is no longer RESERVED"
  - id: ERR_BAG_NOT_ISSUED
    http: 409
    condition: "verifying a SealedBag that has already been verified, tampered or voided"
  - id: ERR_MOVEMENT_NOT_REVERSIBLE
    http: 409
    condition: "reversing a BondedMovement whose movement_type is not RECEIPT or AUDIT_ADJUSTMENT, or one already reversed"

  # --- optimistic concurrency ---------------------------------------------
  - id: ERR_STALE_STOCK_ITEM_VERSION
    http: 412
    condition: "expected_stock_item_version does not match the current BondedStockItem.version"
  - id: ERR_STALE_SALE_VERSION
    http: 412
    condition: "expected_sale_version does not match the current Sale.version"

  # --- transport safety ----------------------------------------------------
  - id: ERR_LIQUID_LIMIT_EXCEEDED
    http: 422
    condition: "the sealed bag's total_liquid_ml would exceed the terminal's liquid_limit_ml"
  - id: ERR_SEALED_BAG_REQUIRED
    http: 409
    condition: "pickup attempted on a sale with sealed_bag_required == true and no INTACT_VERIFIED SealedBag"

  # --- referential coherence ----------------------------------------------
  - id: ERR_EXCLUSIVITY_CONFLICT
    http: 409
    condition: "listing a product whose category is held under an ACTIVE TERMINAL_EXCLUSIVE grant by a different brand at a terminal that stocks it"
  - id: ERR_PRODUCT_CATEGORY_MISMATCH
    http: 422
    condition: "the product's category differs from its owning Brand's category"
  - id: ERR_BRAND_SUSPENDED
    http: 409
    condition: "listing a product whose owning Brand is SUSPENDED"
  - id: ERR_TERMINAL_MISMATCH
    http: 409
    condition: "no BondedStockItem exists at the sale's terminal for the requested product, or a pre-order's stock item sits at a terminal other than the itinerary's departure terminal"
  - id: ERR_ALLOWANCE_RULE_MISSING
    http: 409
    condition: "no ACTIVE AllowanceRule exists for the effective destination country and one of the sale's product categories"

  # --- temporal windows ----------------------------------------------------
  - id: ERR_SEAL_WINDOW_EXPIRED
    http: 409
    condition: "the connecting departure, or the verification instant, falls after the seal's expires_at"
  - id: ERR_DEPARTURE_PASSED
    http: 409
    condition: "the logical clock has reached or passed the itinerary's departure_utc"
  - id: ERR_RESERVATION_WINDOW_INVALID
    http: 422
    condition: "the reservation window starts in the logical past, sits on the wrong side of departure for the chosen program, or the conversion instant falls outside the window"
  - id: ERR_PERIOD_NOT_ENDED
    http: 409
    condition: "closing a settlement period before the logical clock reaches period_end_utc"
  - id: ERR_EXCLUSIVITY_WINDOW_OVERLAP
    http: 409
    condition: "the new grant's half-open window intersects an ACTIVE grant's window for the same (terminal_id, category); exact adjacency does not intersect"

  # --- governance constraints ---------------------------------------------
  - id: ERR_NATIONALITY_MIX_BELOW_THRESHOLD
    http: 409
    condition: "the stocking terminal's rolling traveler nationality mix for the product's target nationality is strictly below required_nationality_share_bps"
  - id: ERR_ITINERARY_NOT_INTERNATIONAL
    http: 409
    condition: "the itinerary's destination country equals the departure terminal's country, so no duty-free entitlement exists"
  - id: ERR_BOARDING_PASS_MISMATCH
    http: 422
    condition: "the scanned boarding_pass_barcode differs from the itinerary's recorded barcode"
  - id: ERR_EMPTY_BASKET
    http: 409
    condition: "clearing eligibility on a sale with no SaleLine"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the auditor requesting information or closing the audit is the same X-User-ID that prepared it"
  - id: ERR_AUDIT_PERIOD_NOT_CLOSED
    http: 409
    condition: "closing an audit before the ConcessionAgreement for its (terminal_id, period_code) has status CLOSED"
  - id: ERR_COUNTED_QTY_EXCEEDS_EXPECTED
    http: 422
    condition: "the submitted counted_qty exceeds the audited BondedStockItem.on_hand_qty"

  # --- fiscal and capacity -------------------------------------------------
  - id: ERR_BONDED_STOCK_INSUFFICIENT
    http: 409
    condition: "available_qty is below the requested quantity at line creation or pickup, or a manual movement/reversal would drive on_hand_qty negative"
  - id: ERR_RESERVATION_CAPACITY_OVERLAP
    http: 409
    condition: "the reserved quantities of RESERVED pre-orders whose buffered windows touch the requested window, plus the new quantity, exceed the stock item's on_hand_qty"
  - id: ERR_VOID_AFTER_PERIOD_CLOSE
    http: 409
    condition: "voiding a PICKED_UP sale whose ConcessionAgreement has already been CLOSED, which would retroactively change settled rent"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: TerminalAdmin
    description: "Commercial administrator of the duty-free estate: registers terminals, brands, products, arrival-allowance rules and exclusivity grants, governs the assortment, and drafts, activates and settles concession agreements. Also owns the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /terminals"
      - "POST /brands"
      - "POST /brands/{brand_id}/suspend"
      - "POST /allowance-rules"
      - "POST /exclusivity-grants"
      - "POST /exclusivity-grants/{grant_id}/revoke"
      - "POST /products"
      - "POST /products/{product_id}/list"
      - "POST /concession-agreements"
      - "POST /concession-agreements/{agreement_id}/activate"
      - "POST /concession-agreements/{agreement_id}/close-period"
      - "GET /concession-agreements/{agreement_id}/rent-projection"
      - "GET /terminals/{terminal_id}/nationality-mix"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all single-resource and filtered-list GETs"

  - name: SalesAssociate
    description: "Till operator at the store: records itineraries, scans boarding passes, builds baskets, clears sales eligibility, issues and verifies sealed bags, hands goods over at pickup and voids sales."
    identity: opaque
    exclusive_operations:
      - "POST /itineraries"
      - "POST /itineraries/{itinerary_id}/scan-boarding-pass"
      - "POST /itineraries/{itinerary_id}/amend"
      - "POST /sales"
      - "POST /sales/{sale_id}/lines"
      - "POST /sales/{sale_id}/clear-eligibility"
      - "POST /sales/{sale_id}/pickup"
      - "POST /sales/{sale_id}/void"
      - "POST /sealed-bags"
      - "POST /sealed-bags/{sealed_bag_id}/verify"
    shared_operations:
      - "all single-resource and filtered-list GETs except GET /concession-agreements/{agreement_id}/rent-projection, GET /terminals/{terminal_id}/nationality-mix, GET /bonded-movements and GET /bonded-movements/{movement_id}"

  - name: StockController
    description: "Bonded warehouse controller: opens stock ledgers, posts receipts and audit adjustments, reverses its own manual movements, prepares customs stock-count audits and converts pre-orders into baskets. Prepares audits but may never adjudicate them."
    identity: opaque
    exclusive_operations:
      - "POST /bonded-stock-items"
      - "POST /bonded-movements"
      - "POST /bonded-movements/{movement_id}/reverse"
      - "POST /pre-orders/{pre_order_id}/convert"
      - "POST /customs-audits"
      - "POST /customs-audits/{audit_id}/submit"
    shared_operations:
      - "all single-resource and filtered-list GETs except GET /concession-agreements/{agreement_id}/rent-projection and GET /terminals/{terminal_id}/nationality-mix"

  - name: CustomsAuditor
    description: "Independent customs adjudicator: returns submissions for more information and closes audits, assessing unaccounted-goods duty. Segregation of duties bars the auditor from adjudicating an audit they prepared themselves."
    identity: opaque
    exclusive_operations:
      - "POST /customs-audits/{audit_id}/request-info"
      - "POST /customs-audits/{audit_id}/close"
    shared_operations:
      - "all single-resource and filtered-list GETs except GET /concession-agreements/{agreement_id}/rent-projection and GET /terminals/{terminal_id}/nationality-mix"

  - name: Passenger
    description: "The traveller themselves, identified by their PassengerItinerary id in X-User-ID. May place and cancel their own pre-order reservations and read only the records that trace back to their own itinerary."
    identity: "entity_backed:PassengerItinerary"
    exclusive_operations:
      - "POST /pre-orders"
      - "POST /pre-orders/{pre_order_id}/cancel"
    shared_operations:
      - "GET /allowance-rules, GET /allowance-rules/{allowance_rule_id}, GET /products, GET /products/{product_id}, GET /bonded-stock-items, GET /bonded-stock-items/{stock_item_id}, and the itinerary-scoped reads GET /itineraries/{itinerary_id}, GET /sales/{sale_id}, GET /sale-lines, GET /sale-lines/{sale_line_id}, GET /sealed-bags, GET /sealed-bags/{sealed_bag_id}, GET /pre-orders, GET /pre-orders/{pre_order_id} — each restricted to rows tracing back to the caller's own itinerary, else ERR_NOT_ITINERARY_OWNER"
