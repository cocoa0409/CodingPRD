      - name: occ_stale_version_on_issue_create
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[issue-create-stale-exam]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Issue create with stale expected_examination_version returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["exam driven to FINDINGS_DELIVERED; version captured pre and post an unrelated mutation"]
          setup_api_calls:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "OC", agency_name: "OC", jurisdiction: "FEDERAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 20000 }
              as: PlatformAdmin
              captures: { ag: $.data.id }
            - call: "POST /regulatory-exams/examinations"
              payload: { agency_id: "${ag}", exam_cycle_code: "OC", exam_type: "IT", scheduled_start_date: "2026-07-06T00:00:00Z", scheduled_end_date: "2026-07-10T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { ex: $.data.id }
            - call: "POST /regulatory-exams/examinations/${ex}/first-day-items"
              payload: { request_ref: "F", description: "d", due_date: "2026-07-15T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { it: $.data.id }
            - call: "POST /regulatory-exams/examinations/${ex}/issue-first-day-letter"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/first-day-items/${it}/waive"
              payload: { waived_reason: "na" }
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examinations/${ex}/begin-fieldwork"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examiner-meetings"
              payload: { examination_id: "${ex}", meeting_date: "2026-07-07T10:00:00Z", attendees: ["E", "O"], minutes_summary: "m" }
              as: RegulatoryAffairsManager
              captures: { mt: $.data.id }
            - call: "POST /regulatory-exams/examiner-meetings/${mt}/finalize"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examinations/${ex}/deliver-findings"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "GET /regulatory-exams/examinations/${ex}"
              as: RegulatoryAffairsManager
              captures: { ex_v_observed: $.data.version }
            # Unrelated mutation bumps version (creating an issue itself)
            - call: "POST /regulatory-exams/examinations/${ex}/issues"
              payload: { issue_ref: "MRA-OC-1", classification: "MRA", severity: "LOW", due_date: "2026-09-01T00:00:00Z", expected_examination_version: "${ex_v_observed}" }
              as: RegulatoryAffairsManager
          trigger:
            # Second create carrying the SAME (now stale) version
            - call: "POST /regulatory-exams/examinations/${ex}/issues"
              payload: { issue_ref: "MRA-OC-2", classification: "MRA", severity: "HIGH", due_date: "2026-09-01T00:00:00Z", expected_examination_version: "${ex_v_observed}" }
              as: RegulatoryAffairsManager
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_STALE_VERSION"

