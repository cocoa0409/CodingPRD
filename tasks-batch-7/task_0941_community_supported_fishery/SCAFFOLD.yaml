scenario: "941. Community-Supported Fishery (CSF): share & catch-of-week, dock-to-door cold-chain, member pickup-hub & delivery, variable catch & substitution, sustainability/traceability (vessel/gear), subscription & skip, vendor settlement, seasonal"
domain_name: community-supported-fishery
api_prefix: "/csf"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Landed pounds are the finite pool: a trip lands a variable weight that must be
    partitioned across active shares, surplus buckets and regulatory discards with
    exact conservation (quota/allocation archetype). Layered on top is a pricing
    engine whose per-delivery price forks on a three-axis product matrix and whose
    fulfillment fee chain forks on two structurally different pipelines
    (hub pickup vs home delivery). Topology is a graph: ShareDelivery links a
    Subscription to a LandingLot and a SubLot and a PickupWindow simultaneously,
    Subscription is self-referential through renewed_from_subscription_id, and
    ColdChainEvent attaches to both a LandingLot and a SubLot.
    State-machine shape is parallel: ShareDelivery carries three independent axes
    (fill_status x fulfillment_status x billing_status) and Subscription carries two
    (lifecycle_status x billing_status).

system_constants:
  CLOCK_DEFAULT_UTC: "2026-05-01T00:00:00Z"
  SHARE_SIZE_BASE_CENTS: { SMALL: 2400, MEDIUM: 3600, LARGE: 5200 }
  SPECIES_TIER_MULTIPLIER: { WHITEFISH: 1.00, PREMIUM_FINFISH: 1.25, SHELLFISH: 1.55 }
  FREQUENCY_FACTOR: { WEEKLY: 1.00, BIWEEKLY: 1.10 }
  SHARE_SIZE_WEIGHT_UNITS: { SMALL: 1, MEDIUM: 2, LARGE: 3 }
  LB_PER_WEIGHT_UNIT: 2.5
  SHARE_MIN_FLOOR_LB: { SMALL: 1.00, MEDIUM: 2.00, LARGE: 3.00 }
  PREPAY_DISCOUNT_PCT: 0.08
  RETAIL_CENTS_PER_LB: { WHITEFISH: 1150, PREMIUM_FINFISH: 1850, SHELLFISH: 2650 }
  SPECIES_TIER_MAP:
    COD: WHITEFISH
    HADDOCK: WHITEFISH
    POLLOCK: WHITEFISH
    HALIBUT: PREMIUM_FINFISH
    SALMON: PREMIUM_FINFISH
    TUNA: PREMIUM_FINFISH
    LOBSTER: SHELLFISH
    SCALLOP: SHELLFISH
    OYSTER: SHELLFISH
  SURPLUS_SECONDARY_MAX_PCT: 0.60
  COLD_CHAIN_CUMULATIVE_BUDGET_MIN: 45
  COLD_CHAIN_SINGLE_EXCURSION_MAX_MIN: 20
  COLD_CHAIN_RELEASE_LIMIT_MIN: 60
  COLD_CHAIN_DISCOUNT_LIMIT_MIN: 90
  QUALITY_RELEASE_TEMP_C: 7.0
  QUALITY_DISCOUNT_CREDIT_PCT: 0.30
  VENDOR_DISCOUNT_HOLDBACK_RELEASE_PCT: 0.50
  PACK_SMALL_MAX_LB: 6.00
  PACK_MEDIUM_MAX_LB: 14.00
  PACK_BASE_FEE_CENTS: { SMALL: 300, MEDIUM: 450, LARGE: 600 }
  GEL_PACK_FEE_CENTS: 175
  GEL_PACK_HOURS:
    COOL: { SMALL: 3.0, MEDIUM: 6.0, LARGE: 8.0 }
    MILD: { SMALL: 2.0, MEDIUM: 4.0, LARGE: 5.5 }
    HOT: { SMALL: 1.5, MEDIUM: 3.0, LARGE: 4.0 }
  ZONE_BASE_FEE_CENTS: { TIER_1: 500, TIER_2: 800, TIER_3: 1250 }
  REMOTE_SURCHARGE_CENTS: 250
  FREE_SURCHARGE_THRESHOLD_CENTS: 6000
  DEFAULT_GRACE_MINUTES: 90
  NO_SHOW_WARN_THRESHOLD: 1
  NO_SHOW_RESTRICT_THRESHOLD: 2
  SKIP_CAP_PER_SEASON: 4
  DEFAULT_LANDING_COMMIT_LEAD_HOURS: 72
  GEAR_BASE_SCORE: { HOOK_AND_LINE: 90, TRAP: 78, DIVE: 85, GILLNET: 60, TRAWL: 45 }
  SUSTAINABILITY_GREEN_MIN: 80
  SUSTAINABILITY_YELLOW_MIN: 60
  SUSTAINABILITY_ORANGE_MIN: 40
  BAND_PREMIUM_FACTOR: { GREEN: 1.00, YELLOW: 0.85, ORANGE: 0.50, RED: 0.00 }
  CSF_PREMIUM_BRACKET_1_MAX_LB: 100.00
  CSF_PREMIUM_BRACKET_2_MAX_LB: 300.00
  CSF_PREMIUM_RATE_1_CENTS_PER_LB: 60
  CSF_PREMIUM_RATE_2_CENTS_PER_LB: 45
  CSF_PREMIUM_RATE_3_CENTS_PER_LB: 30
  DOCK_FEE_CENTS: 4500
  ICE_HANDLING_CENTS_PER_LB: 12
  OFFLOAD_LABOR_CENTS_PER_MINUTE: 95
  HOLDBACK_PCT: 0.10
  QUOTA_WARNING_PCT: 0.85
  HANDLING_LEVY_PCT: 0.0125
  DISCARD_OFFSET_PCT: 0.25
  TRANSFER_FEE_CENTS: 2500
  TRUE_UP_MIN_REFUND_CENTS: 5000
  ALLOCATION_POUND_PRECISION: 0.01

entities:
  - name: Season
    parent: null
    common_fields: true
    fields:
      - name: season_code
        type: string
        source: input
        description: human-readable season identifier, unique across seasons
        constraints: "1..32 chars; unique"
      - name: start_date
        type: datetime
        source: input
        description: ISO 8601 UTC instant of the week-1 scheduled delivery
      - name: end_date
        type: datetime
        source: input
        description: ISO 8601 UTC instant after which no deliveries are scheduled
      - name: total_weeks
        type: integer
        source: input
        description: number of delivery weeks in the season, week_index runs 1..total_weeks
        constraints: "integer 1..40"
      - name: ambient_band
        type: enum
        source: input
        description: ambient temperature band governing gel-pack sizing for this season
        default: MILD
        constraints: "one of COOL, MILD, HOT"
      - name: offered_species
        type: array
        source: input
        description: species codes landable and substitutable during this season
        constraints: "non-empty array of species enum members"
      - name: landing_commit_lead_hours
        type: integer
        source: input
        description: hours before a week's scheduled_at at which the landing commitment locks; skip notice is measured against it
        default: 72
        constraints: "integer 0..336"
      - name: status
        type: enum
        source: system
        description: season lifecycle state
        default: PLANNING
        constraints: "one of PLANNING, OPEN, LANDINGS_CLOSED, TRUE_UP, CLOSED"
      - name: shortfall_flag_count
        type: integer
        source: computed
        description: number of Subscription rows whose true_up_status has been driven to SHORTFALL_FLAGGED by a voided delivery cascade
        default: 0
      - name: true_up_run_at
        type: datetime
        source: system
        description: logical-clock instant at which the season true-up ran; null before it runs
        default: null

  - name: SharePlan
    parent: Season
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season this plan is sold for"
      - name: plan_code
        type: string
        source: input
        description: human-readable plan identifier
        constraints: "1..32 chars; unique within season_id"
      - name: share_size
        type: enum
        source: input
        description: portion tier of the box
        constraints: "one of SMALL, MEDIUM, LARGE"
      - name: delivery_frequency
        type: enum
        source: input
        description: cadence of scheduled deliveries
        constraints: "one of WEEKLY, BIWEEKLY"
      - name: species_tier
        type: enum
        source: input
        description: species tier this plan is entitled to receive
        constraints: "one of WHITEFISH, PREMIUM_FINFISH, SHELLFISH"
      - name: price_per_delivery_cents
        type: integer
        source: computed
        description: matrix list price per delivery, from calculations.share_price_per_delivery
      - name: weight_units
        type: integer
        source: computed
        description: allocation weight of one share of this size, from SHARE_SIZE_WEIGHT_UNITS
      - name: target_pounds_per_delivery
        type: number
        source: computed
        description: full-fill pound target of one box, weight_units * LB_PER_WEIGHT_UNIT
      - name: min_floor_pounds
        type: number
        source: computed
        description: per-share minimum floor in pounds, from SHARE_MIN_FLOOR_LB
      - name: scheduled_delivery_count
        type: integer
        source: computed
        description: full-season delivery count for a week-1 join, from calculations.scheduled_delivery_count

  - name: DeliveryZone
    parent: null
    common_fields: true
    fields:
      - name: zone_code
        type: string
        source: input
        description: human-readable route zone identifier
        constraints: "1..32 chars; unique"
      - name: fee_tier
        type: enum
        source: input
        description: zone base-fee tier
        constraints: "one of TIER_1, TIER_2, TIER_3"
      - name: transit_hours
        type: number
        source: input
        description: door-to-door transit hours used for gel-pack sizing
        constraints: "number > 0, at most 2 decimals"
      - name: is_serviceable
        type: boolean
        source: input
        description: whether home delivery may be sold into this zone
        default: true

  - name: PickupHub
    parent: null
    common_fields: true
    fields:
      - name: hub_code
        type: string
        source: input
        description: human-readable hub identifier
        constraints: "1..32 chars; unique"
      - name: cooler_slots_default
        type: integer
        source: input
        description: default cooler-slot capacity applied to windows created under this hub
        constraints: "integer >= 1"
      - name: grace_minutes
        type: integer
        source: input
        description: minutes after closes_at during which a member may still collect a staged box
        default: 90
        constraints: "integer 0..480"

  - name: PickupWindow
    parent: PickupHub
    common_fields: true
    fields:
      - name: pickup_hub_id
        type: string
        source: input
        description: "FK -> PickupHub.id; the hub this window belongs to"
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season this window belongs to"
      - name: week_index
        type: integer
        source: input
        description: delivery week this window serves
        constraints: "integer 1..Season.total_weeks; unique with pickup_hub_id and season_id"
      - name: opens_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the pickup window opens
      - name: closes_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the pickup window closes; must be strictly after opens_at
      - name: grace_minutes
        type: integer
        source: computed
        description: copied from PickupHub.grace_minutes at window creation and frozen thereafter
      - name: cooler_slots_total
        type: integer
        source: input
        description: cooler-slot capacity of this window; defaults to PickupHub.cooler_slots_default when omitted
        constraints: "integer >= 1"
      - name: slots_reserved
        type: integer
        source: computed
        description: slots held by boxes staged at the hub and not yet collected
        default: 0
      - name: slots_occupied
        type: integer
        source: computed
        description: slots consumed by boxes already collected in this window
        default: 0
      - name: slots_forfeited
        type: integer
        source: computed
        description: slots consumed by boxes forfeited to no-show in this window
        default: 0
      - name: slots_free
        type: integer
        source: computed
        description: cooler_slots_total - slots_reserved - slots_occupied - slots_forfeited
      - name: status
        type: enum
        source: system
        description: pickup window lifecycle state
        default: SCHEDULED
        constraints: "one of SCHEDULED, OPEN, GRACE, CLOSED, RECONCILED"

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: member display name
        constraints: "1..120 chars"
      - name: email
        type: string
        source: input
        description: member contact email
        constraints: "must contain '@'; unique"
      - name: allergy_exclusions
        type: array
        source: input
        description: species codes that must never be placed in this member's box, hard block
        default: []
      - name: dislikes
        type: array
        source: input
        description: species codes the member prefers to avoid, soft block that yields when no other species remains
        default: []
      - name: never_substitute
        type: boolean
        source: input
        description: when true the member refuses all substitutions and takes a credit instead
        default: false
      - name: season_no_show_count
        type: integer
        source: computed
        description: number of hub no-shows charged to this member in the current season
        default: 0
      - name: standing
        type: enum
        source: system
        description: member standing driven by season_no_show_count escalation
        default: GOOD
        constraints: "one of GOOD, WARNED, RESTRICTED"
      - name: credit_balance_cents
        type: integer
        source: computed
        description: member-level credit accumulated from substitution deltas, quality discounts and refunds
        default: 0

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the subscribing member"
      - name: share_plan_id
        type: string
        source: input
        description: "FK -> SharePlan.id; the product matrix row purchased"
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season subscribed to"
      - name: pickup_hub_id
        type: string
        source: input
        description: "FK -> PickupHub.id; required when fulfillment_mode is HUB_PICKUP, null otherwise"
        default: null
      - name: delivery_zone_id
        type: string
        source: input
        description: "FK -> DeliveryZone.id; required when fulfillment_mode is HOME_DELIVERY, null otherwise"
        default: null
      - name: renewed_from_subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; self-referential link to the prior-season subscription this one renews, null for a fresh join"
        default: null
      - name: fulfillment_mode
        type: enum
        source: input
        description: which of the two fulfillment pipelines this subscription uses
        constraints: "one of HUB_PICKUP, HOME_DELIVERY"
      - name: payment_basis
        type: enum
        source: input
        description: how the season commitment is priced and settled
        constraints: "one of PREPAID_FULL_SEASON, INSTALLMENT"
      - name: join_week_index
        type: integer
        source: input
        description: first delivery week this subscription participates in
        constraints: "integer 1..Season.total_weeks"
      - name: lifecycle_status
        type: enum
        source: system
        description: membership lifecycle axis, independent of billing_status
        default: PENDING
        constraints: "one of PENDING, WAITLISTED, ACTIVE, PAUSED, PAST_DUE, TRANSFERRED, CANCELLED, COMPLETED"
      - name: billing_status
        type: enum
        source: system
        description: money axis, evolves independently of lifecycle_status
        default: UNBILLED
        constraints: "one of UNBILLED, CURRENT, DUNNING, PREPAID_SETTLED, REFUND_PENDING, SETTLED"
      - name: commitment_cents
        type: integer
        source: computed
        description: total season obligation, from calculations.subscription_commitment_total
      - name: price_per_delivery_cents
        type: integer
        source: computed
        description: per-delivery unit price this subscription is credited and charged at; prepaid subscriptions carry the discounted unit price
      - name: promised_delivery_count
        type: integer
        source: computed
        description: number of delivery weeks promised from join_week_index onward, from calculations.promised_delivery_count
      - name: delivered_count
        type: integer
        source: computed
        description: count of this subscription's deliveries in DELIVERED or PICKED_UP
        default: 0
      - name: credited_count
        type: integer
        source: computed
        description: count of promised deliveries the CSF failed to deliver and credited; counts VOIDED deliveries only, never skips
        default: 0
      - name: skip_credited_count
        type: integer
        source: computed
        description: count of SkipRequest rows for this subscription whose status is CREDITED
        default: 0
      - name: undelivered_count
        type: integer
        source: computed
        description: promised deliveries that reached season close in neither a fulfilled, credited, skipped nor member-fault state; written by the true-up sweep
        default: 0
      - name: member_fault_count
        type: integer
        source: computed
        description: count of promised deliveries lost to member fault (NO_SHOW forfeits plus FORFEITED skips)
        default: 0
      - name: skip_count
        type: integer
        source: computed
        description: number of non-revoked skip requests filed this season, counts both CREDITED and FORFEITED
        default: 0
      - name: skip_credit_balance_cents
        type: integer
        source: computed
        description: banked skip credits available to offset the season true-up
        default: 0
      - name: paid_cents
        type: integer
        source: computed
        description: cash received against this subscription
        default: 0
      - name: rollover_credit_cents
        type: integer
        source: computed
        description: credit carried into the next season by the true-up CREDIT variant
        default: 0
      - name: expired_credit_cents
        type: integer
        source: computed
        description: skip credit that remained unapplied when the season closed and therefore expired
        default: 0
      - name: true_up_status
        type: enum
        source: system
        description: season-end reconciliation axis
        default: NOT_DUE
        constraints: "one of NOT_DUE, SHORTFALL_FLAGGED, REFUNDED, CREDITED"
      - name: true_up_amount_cents
        type: integer
        source: computed
        description: signed amount produced by calculations.season_true_up, positive means owed to the member
        default: 0

  - name: Vessel
    parent: null
    common_fields: true
    fields:
      - name: vessel_name
        type: string
        source: input
        description: vessel display name
        constraints: "1..120 chars"
      - name: permit_number
        type: string
        source: input
        description: federal permit number carried by the vessel
        constraints: "1..32 chars; unique"
      - name: home_port
        type: string
        source: input
        description: home port of the vessel
      - name: gear_types
        type: array
        source: input
        description: gear types this vessel is rigged for
        constraints: "non-empty array of HOOK_AND_LINE, TRAP, DIVE, GILLNET, TRAWL"
      - name: compliance_status
        type: enum
        source: system
        description: regulatory standing of the vessel, re-entrant
        default: COMPLIANT
        constraints: "one of COMPLIANT, PROBATION, SUSPENDED"
      - name: violation_count
        type: integer
        source: computed
        description: number of compliance downgrades recorded against this vessel
        default: 0

  - name: QuotaLedger
    parent: null
    common_fields: true
    fields:
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id; the permit holder this entitlement belongs to"
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season this entitlement applies to"
      - name: species
        type: enum
        source: input
        description: species this entitlement covers
        constraints: "one of COD, HADDOCK, POLLOCK, HALIBUT, SALMON, TUNA, LOBSTER, SCALLOP, OYSTER"
      - name: management_area
        type: string
        source: input
        description: fishery management area code this entitlement covers
        constraints: "1..16 chars; unique with vessel_id, season_id and species"
      - name: entitlement_pounds
        type: number
        source: input
        description: annual catch entitlement in pounds
        constraints: "number > 0, at most 2 decimals"
      - name: committed_pounds
        type: number
        source: computed
        description: pounds already debited against the entitlement by accepted landings
        default: 0
      - name: remaining_pounds
        type: number
        source: computed
        description: entitlement_pounds - committed_pounds
      - name: area_closed
        type: boolean
        source: input
        description: whether the management area is administratively closed
        default: false
      - name: species_open_date
        type: datetime
        source: input
        description: ISO 8601 UTC instant the species season opens in this area, inclusive
      - name: species_close_date
        type: datetime
        source: input
        description: ISO 8601 UTC instant the species season closes in this area, inclusive
      - name: permitted_gears
        type: array
        source: input
        description: gear types permitted for this species and area
        constraints: "non-empty array of HOOK_AND_LINE, TRAP, DIVE, GILLNET, TRAWL"
      - name: area_sensitivity_penalty
        type: integer
        source: input
        description: habitat sensitivity penalty subtracted from the gear base score
        default: 0
        constraints: "integer 0..40"
      - name: species_stock_adjustment
        type: integer
        source: input
        description: stock health adjustment added to the sustainability score
        default: 0
        constraints: "integer -20..10"
      - name: status
        type: enum
        source: system
        description: entitlement consumption state, re-entrant when a rejected landing releases pounds
        default: OPEN
        constraints: "one of OPEN, WARNING, EXHAUSTED, SUSPENDED"

  - name: Trip
    parent: null
    common_fields: true
    fields:
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id; the vessel that made the trip"
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season the trip belongs to"
      - name: quota_ledger_id
        type: string
        source: input
        description: "FK -> QuotaLedger.id; the entitlement the landing will be debited against"
      - name: gear_type
        type: enum
        source: input
        description: gear deployed on this trip
        constraints: "one of HOOK_AND_LINE, TRAP, DIVE, GILLNET, TRAWL"
      - name: management_area
        type: string
        source: input
        description: management area fished, must equal QuotaLedger.management_area
      - name: landed_at
        type: datetime
        source: system
        description: logical-clock instant at which the landing was recorded; null before landing
        default: null
      - name: offload_minutes
        type: integer
        source: input
        description: offload labor minutes recorded at landing, supplied on the land call
        default: 0
        constraints: "integer >= 0"
      - name: sustainability_score
        type: integer
        source: computed
        description: score from calculations.sustainability_score, computed at landing
        default: 0
      - name: sustainability_band
        type: enum
        source: computed
        description: band derived from sustainability_score
        default: GREEN
        constraints: "one of GREEN, YELLOW, ORANGE, RED"
      - name: status
        type: enum
        source: system
        description: trip lifecycle state
        default: PLANNED
        constraints: "one of PLANNED, LANDED, VERIFIED, REJECTED"

  - name: LandingLot
    parent: Trip
    common_fields: true
    fields:
      - name: trip_id
        type: string
        source: input
        description: "FK -> Trip.id; the trip that produced this lot"
      - name: species
        type: enum
        source: input
        description: species landed, must equal the trip's QuotaLedger.species
        constraints: "one of COD, HADDOCK, POLLOCK, HALIBUT, SALMON, TUNA, LOBSTER, SCALLOP, OYSTER"
      - name: landed_pounds_gross
        type: number
        source: input
        description: pounds brought over the rail before quota trimming
        constraints: "number > 0, at most 2 decimals"
      - name: landed_pounds_net
        type: number
        source: computed
        description: pounds actually debited to the entitlement and available downstream
      - name: discarded_over_quota_pounds
        type: number
        source: computed
        description: pounds trimmed off as a regulatory discard under partial-fill semantics
        default: 0
      - name: allocation_week_index
        type: integer
        source: computed
        description: delivery week this lot was allocated to; null before allocation
        default: null
      - name: allocated_pounds_total
        type: number
        source: computed
        description: sum of allocated_pounds over the ShareDelivery rows this lot filled
        default: 0
      - name: surplus_secondary_pounds
        type: number
        source: computed
        description: surplus pounds routed to the secondary market
        default: 0
      - name: surplus_donated_pounds
        type: number
        source: computed
        description: surplus pounds routed to donation
        default: 0
      - name: split_pounds_total
        type: number
        source: computed
        description: sum of SubLot.pounds created from this lot
        default: 0
      - name: ex_vessel_price_cents_per_lb
        type: integer
        source: input
        description: ex-vessel price agreed with the vessel for this lot
        constraints: "integer > 0"
      - name: retail_value_cents_per_lb
        type: integer
        source: computed
        description: CSF retail value per pound, from RETAIL_CENTS_PER_LB for the species tier
      - name: cold_chain_cumulative_minutes
        type: integer
        source: computed
        description: sum of minutes_above_threshold over every ColdChainEvent attached to this lot
        default: 0
      - name: cold_chain_max_single_minutes
        type: integer
        source: computed
        description: largest single minutes_above_threshold over this lot's ColdChainEvent rows
        default: 0
      - name: peak_temp_c
        type: number
        source: computed
        description: largest peak_temp_c over this lot's ColdChainEvent rows
        default: 0
      - name: allocation_variant
        type: enum
        source: computed
        description: which branch of calculations.catch_allocation ran
        default: NONE
        constraints: "one of NONE, NORMAL_FILL, SHORT_FILL"
      - name: status
        type: enum
        source: system
        description: lot custody axis
        default: RECORDED
        constraints: "one of RECORDED, ALLOCATED, SPLIT, DISPATCHED, CLOSED, RECALLED"
      - name: quality_status
        type: enum
        source: system
        description: lot quality axis, evolves independently of status
        default: CLEAR
        constraints: "one of CLEAR, HOLD, RELEASED, DISCOUNTED, DISCARDED"

  - name: SubLot
    parent: LandingLot
    common_fields: true
    fields:
      - name: landing_lot_id
        type: string
        source: input
        description: "FK -> LandingLot.id; the parent lot this sub-lot was split from"
      - name: pickup_hub_id
        type: string
        source: input
        description: "FK -> PickupHub.id; destination hub when destination_type is HUB, null otherwise"
        default: null
      - name: delivery_zone_id
        type: string
        source: input
        description: "FK -> DeliveryZone.id; destination route zone when destination_type is ROUTE, null otherwise"
        default: null
      - name: destination_type
        type: enum
        source: input
        description: which fulfillment pipeline this sub-lot feeds
        constraints: "one of HUB, ROUTE"
      - name: pounds
        type: number
        source: input
        description: pounds assigned to this sub-lot at the split
        constraints: "number > 0, at most 2 decimals"
      - name: status
        type: enum
        source: system
        description: sub-lot custody state
        default: IN_TRANSIT
        constraints: "one of IN_TRANSIT, ARRIVED, CONSUMED, RETURNED, DESTROYED"

  - name: ShareDelivery
    parent: Subscription
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the subscription this box belongs to"
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; denormalized season of the subscription"
      - name: landing_lot_id
        type: string
        source: input
        description: "FK -> LandingLot.id; the lot that filled this box, null before allocation"
        default: null
      - name: sub_lot_id
        type: string
        source: input
        description: "FK -> SubLot.id; the sub-lot that carried this box, null before the split"
        default: null
      - name: pickup_window_id
        type: string
        source: input
        description: "FK -> PickupWindow.id; the window this box was staged into, null for home delivery"
        default: null
      - name: week_index
        type: integer
        source: system
        description: delivery week this box belongs to
      - name: scheduled_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant this box is scheduled for, season.start_date plus (week_index - 1) * 7 days
      - name: allocated_pounds
        type: number
        source: computed
        description: pounds allocated to this box by the catch allocation run
        default: 0
      - name: substituted_pounds
        type: number
        source: computed
        description: pounds added to this box by an accepted substitution
        default: 0
      - name: box_pounds
        type: number
        source: computed
        description: allocated_pounds + substituted_pounds, the physical weight packed
        default: 0
      - name: pack_size
        type: enum
        source: computed
        description: insulated pack tier chosen for this box, NONE for hub pickup
        default: NONE
        constraints: "one of NONE, SMALL, MEDIUM, LARGE"
      - name: gel_pack_count
        type: integer
        source: computed
        description: gel packs required, from calculations.gel_pack_count, 0 for hub pickup
        default: 0
      - name: subtotal_cents
        type: integer
        source: computed
        description: the share charge for this delivery before any fee, equals Subscription.price_per_delivery_cents
        default: 0
      - name: surcharge_cents
        type: integer
        source: computed
        description: remote surcharge applied or waived per calculations.member_week_invoice
        default: 0
      - name: delivery_fee_cents
        type: integer
        source: computed
        description: total fulfillment fee, always 0 on the hub pickup pipeline
        default: 0
      - name: invoice_total_cents
        type: integer
        source: computed
        description: subtotal_cents + delivery_fee_cents
        default: 0
      - name: charged_cents
        type: integer
        source: computed
        description: amount actually charged for this delivery
        default: 0
      - name: credit_cents
        type: integer
        source: computed
        description: credit issued against this delivery from substitution delta, quality discount, void or recall
        default: 0
      - name: fill_status
        type: enum
        source: system
        description: allocation outcome axis
        default: PENDING
        constraints: "one of PENDING, FULL_FILL, UNDER_FILLED, SUBSTITUTED, VOID"
      - name: fulfillment_status
        type: enum
        source: system
        description: custody axis, forks into the home-delivery and hub-pickup pipelines
        default: SCHEDULED
        constraints: "one of SCHEDULED, SKIPPED, ALLOCATED, PACKED, IN_TRANSIT, DELIVERED, AT_HUB, PICKED_UP, NO_SHOW, DONATED, VOIDED"
      - name: billing_status
        type: enum
        source: system
        description: money axis, evolves independently of fulfillment_status
        default: PENDING
        constraints: "one of PENDING, CHARGED, PARTIALLY_CREDITED, CREDITED, REFUNDED, FORFEITED"

  - name: SubstitutionEvent
    parent: ShareDelivery
    common_fields: true
    fields:
      - name: share_delivery_id
        type: string
        source: input
        description: "FK -> ShareDelivery.id; the under-filled box being made whole"
      - name: substitute_landing_lot_id
        type: string
        source: input
        description: "FK -> LandingLot.id; the lot supplying the substitute species"
      - name: substitute_species
        type: enum
        source: computed
        description: species drawn from the substitute lot
        constraints: "one of COD, HADDOCK, POLLOCK, HALIBUT, SALMON, TUNA, LOBSTER, SCALLOP, OYSTER"
      - name: substitute_pounds
        type: number
        source: input
        description: pounds of the substitute species offered
        constraints: "number > 0, at most 2 decimals"
      - name: shortfall_pounds
        type: number
        source: computed
        description: plan target pounds minus allocated_pounds on the delivery at proposal time
      - name: owed_value_cents
        type: integer
        source: computed
        description: retail value of the shortfall in the plan's own species tier
      - name: substitute_value_cents
        type: integer
        source: computed
        description: retail value of the offered substitute
      - name: settlement_variant
        type: enum
        source: computed
        description: which branch of calculations.substitution_value_settlement ran
        constraints: "one of EQUAL_OR_GREATER, BELOW_VALUE"
      - name: member_credit_cents
        type: integer
        source: computed
        description: credit owed to the member for a below-value substitution
        default: 0
      - name: status
        type: enum
        source: system
        description: substitution offer state
        default: PROPOSED
        constraints: "one of PROPOSED, ACCEPTED, REJECTED, CREDIT_ISSUED"

  - name: ColdChainEvent
    parent: LandingLot
    common_fields: false
    fields:
      - name: landing_lot_id
        type: string
        source: input
        description: "FK -> LandingLot.id; the lot whose cold chain this leg belongs to"
      - name: sub_lot_id
        type: string
        source: input
        description: "FK -> SubLot.id; the sub-lot carrying the leg, null for the dock leg"
        default: null
      - name: custody_leg
        type: enum
        source: input
        description: which custody leg the excursion was measured on
        constraints: "one of DOCK_TO_HUB, HUB_HOLD, HUB_TO_DOOR"
      - name: minutes_above_threshold
        type: integer
        source: input
        description: minutes this leg spent above the cold-chain temperature threshold
        constraints: "integer >= 0"
      - name: peak_temp_c
        type: number
        source: input
        description: peak temperature reached on this leg in Celsius
        constraints: "number, at most 1 decimal"
      - name: recorded_at
        type: datetime
        source: system
        description: logical-clock instant the leg was logged
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator who logged this leg, used by the segregation-of-duties gate on disposition
      - name: breach_type
        type: enum
        source: computed
        description: which cold-chain budget this leg breached, evaluated against the lot's running totals
        default: NONE
        constraints: "one of NONE, SINGLE_EXCURSION, CUMULATIVE, BOTH"

  - name: SkipRequest
    parent: Subscription
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the subscription skipping a week"
      - name: share_delivery_id
        type: string
        source: input
        description: "FK -> ShareDelivery.id; the scheduled box being skipped"
      - name: week_index
        type: integer
        source: computed
        description: delivery week skipped, copied from the target delivery
      - name: requested_at
        type: datetime
        source: system
        description: logical-clock instant the skip was filed
      - name: cutoff_at
        type: datetime
        source: computed
        description: delivery scheduled_at minus Season.landing_commit_lead_hours
      - name: settlement_variant
        type: enum
        source: computed
        description: which branch of calculations.skip_settlement ran
        constraints: "one of CREDIT, FORFEIT"
      - name: credit_cents
        type: integer
        source: computed
        description: skip credit banked on the subscription, 0 on the forfeit branch
        default: 0
      - name: status
        type: enum
        source: system
        description: skip request state
        default: REQUESTED
        constraints: "one of REQUESTED, CREDITED, FORFEITED, REVOKED"

  - name: SettlementStatement
    parent: Trip
    common_fields: true
    fields:
      - name: trip_id
        type: string
        source: input
        description: "FK -> Trip.id; the trip being settled"
      - name: landing_lot_id
        type: string
        source: input
        description: "FK -> LandingLot.id; the lot being settled"
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id; the payee vessel"
      - name: ex_vessel_cents
        type: integer
        source: computed
        description: ex_vessel_price_cents_per_lb times landed_pounds_net, rounded once
        default: 0
      - name: premium_cents
        type: integer
        source: computed
        description: tiered CSF premium above ex-vessel, band-adjusted
        default: 0
      - name: gross_cents
        type: integer
        source: computed
        description: ex_vessel_cents + premium_cents
        default: 0
      - name: dock_fee_cents
        type: integer
        source: computed
        description: flat dock fee line
        default: 0
      - name: ice_handling_cents
        type: integer
        source: computed
        description: ice and handling line, rounded on its own
        default: 0
      - name: offload_labor_cents
        type: integer
        source: computed
        description: offload labor line, rounded on its own
        default: 0
      - name: handling_levy_cents
        type: integer
        source: computed
        description: handling levy line computed off gross_cents, rounded on its own
        default: 0
      - name: deductions_cents
        type: integer
        source: computed
        description: sum of the three individually rounded deduction lines
        default: 0
      - name: holdback_cents
        type: integer
        source: computed
        description: quality holdback retained from gross_cents
        default: 0
      - name: holdback_released_cents
        type: integer
        source: computed
        description: portion of the holdback released once quality disposition cleared
        default: 0
      - name: holdback_forfeited_cents
        type: integer
        source: computed
        description: portion of the holdback forfeited to the CSF
        default: 0
      - name: offset_cents
        type: integer
        source: computed
        description: additional charge back to the vessel when the lot was discarded
        default: 0
      - name: net_payable_cents
        type: integer
        source: computed
        description: amount currently payable under the active variant
        default: 0
      - name: net_paid_cents
        type: integer
        source: computed
        description: cash actually disbursed
        default: 0
      - name: variant
        type: enum
        source: computed
        description: which branch of calculations.settlement_holdback produced net_payable_cents
        default: PROVISIONAL
        constraints: "one of PROVISIONAL, FINAL"
      - name: status
        type: enum
        source: system
        description: settlement lifecycle state
        default: DRAFT
        constraints: "one of DRAFT, PROVISIONAL, HELD, FINAL, PAID, VOID"

  - name: ShareTransfer
    parent: null
    common_fields: true
    fields:
      - name: from_subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the transferring subscription"
      - name: to_subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the waitlisted subscription receiving the share"
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season both subscriptions belong to"
      - name: remaining_delivery_count
        type: integer
        source: computed
        description: promised deliveries still ahead of the effective week at request time
      - name: effective_week_index
        type: integer
        source: input
        description: first delivery week the transferee takes over
        constraints: "integer 1..Season.total_weeks"
      - name: transfer_fee_cents
        type: integer
        source: computed
        description: flat transfer fee, from TRANSFER_FEE_CENTS
      - name: transferor_refund_cents
        type: integer
        source: computed
        description: cash returned to the transferor, 0 on the installment branch
        default: 0
      - name: transferee_charge_cents
        type: integer
        source: computed
        description: obligation assumed by the transferee
        default: 0
      - name: settlement_variant
        type: enum
        source: computed
        description: which branch of calculations.transfer_settlement ran
        constraints: "one of PREPAID, INSTALLMENT"
      - name: status
        type: enum
        source: system
        description: transfer offer state
        default: REQUESTED
        constraints: "one of REQUESTED, ACCEPTED, DECLINED, EXPIRED"

  - name: RecallNotice
    parent: LandingLot
    common_fields: true
    fields:
      - name: landing_lot_id
        type: string
        source: input
        description: "FK -> LandingLot.id; the lot being recalled"
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; denormalized season of the lot"
      - name: reason
        type: enum
        source: input
        description: why the recall was raised
        constraints: "one of PATHOGEN, MISLABEL, COLD_CHAIN, REGULATORY"
      - name: impacted_sub_lot_count
        type: integer
        source: computed
        description: number of SubLot rows walked forward from the lot
        default: 0
      - name: impacted_delivery_count
        type: integer
        source: computed
        description: number of ShareDelivery rows reached through those sub-lots
        default: 0
      - name: impacted_member_count
        type: integer
        source: computed
        description: number of distinct Member rows reached
        default: 0
      - name: total_credit_cents
        type: integer
        source: computed
        description: sum of credits issued to impacted deliveries
        default: 0
      - name: status
        type: enum
        source: system
        description: recall lifecycle state
        default: INITIATED
        constraints: "one of INITIATED, SCOPED, REMEDIATED, CLOSED"

state_machines:
  - entity: Season
    state_field: status
    shape: linear
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: OPEN
        trigger: "POST /csf/seasons/{id}/open"
        actor: CsfAdmin
        preconditions:
          - "Season.status == PLANNING"
          - "at least one SharePlan exists with share_plan.season_id == season.id"
        side_effects:
          - "subscription creation, landings and allocations become permitted for this season"
      - from: OPEN
        to: LANDINGS_CLOSED
        trigger: "POST /csf/seasons/{id}/close-landings"
        actor: CsfAdmin
        preconditions:
          - "Season.status == OPEN"
        side_effects:
          - "every ShareTransfer with season_id == season.id and status == REQUESTED transitions to EXPIRED"
          - "further POST /csf/trips/{id}/land calls for this season are rejected with ERR_SEASON_NOT_OPEN"
      - from: LANDINGS_CLOSED
        to: TRUE_UP
        trigger: "POST /csf/seasons/{id}/true-up"
        actor: CsfAdmin
        preconditions:
          - "Season.status == LANDINGS_CLOSED"
          - "Season.true_up_run_at IS NULL"
        side_effects:
          - "for every Subscription with season_id == season.id and lifecycle_status IN {ACTIVE, PAUSED, PAST_DUE}, run calculations.season_true_up and set true_up_amount_cents, true_up_status and expired_credit_cents"
          - "sets Season.true_up_run_at to the current logical-clock instant"
      - from: TRUE_UP
        to: CLOSED
        trigger: "system, immediately after the true-up sweep finishes within the same POST /csf/seasons/{id}/true-up request"
        actor: system
        preconditions:
          - "every Subscription with season_id == season.id and lifecycle_status IN {ACTIVE, PAUSED, PAST_DUE} has true_up_status IN {REFUNDED, CREDITED}"
        side_effects:
          - "every such Subscription transitions lifecycle_status to COMPLETED and billing_status to SETTLED"
          - "no further mutation is accepted on any resource whose season_id == season.id, per validations priority 14"
        note: "TRUE_UP is an intra-request waypoint; the response of the true-up call already shows Season.status == CLOSED"

  - entity: Subscription
    state_field: lifecycle_status
    shape: cyclic
    initial_state: PENDING
    terminal_states: [CANCELLED, TRANSFERRED, COMPLETED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /csf/subscriptions/{id}/activate"
        actor: CsfAdmin
        preconditions:
          - "Subscription.lifecycle_status == PENDING"
          - "Season.status == OPEN"
          - "Member.standing IN {GOOD, WARNED}"
          - "Subscription.paid_cents >= Subscription.commitment_cents when payment_basis == PREPAID_FULL_SEASON"
        side_effects:
          - "creates one ShareDelivery per delivery week produced by calculations.delivery_week_set, each with fulfillment_status SCHEDULED, fill_status PENDING, billing_status PENDING"
          - "sets Subscription.promised_delivery_count to the number of ShareDelivery rows created"
          - "sets billing_status to PREPAID_SETTLED when payment_basis == PREPAID_FULL_SEASON, otherwise to CURRENT"
      - from: PENDING
        to: WAITLISTED
        trigger: "POST /csf/subscriptions with waitlist_requested true"
        actor: CsfAdmin
        preconditions:
          - "Subscription.lifecycle_status == PENDING"
        side_effects:
          - "no ShareDelivery rows are created; the subscription is eligible to receive a ShareTransfer"
        note: "applied within the create call itself when waitlist_requested is true"
      - from: WAITLISTED
        to: ACTIVE
        trigger: "POST /csf/share-transfers/{id}/accept"
        actor: Member
        preconditions:
          - "Subscription.lifecycle_status == WAITLISTED"
          - "ShareTransfer.status == REQUESTED and ShareTransfer.to_subscription_id == subscription.id"
        side_effects:
          - "creates one ShareDelivery per delivery week from ShareTransfer.effective_week_index onward"
          - "sets commitment_cents to ShareTransfer.transferee_charge_cents and billing_status to CURRENT"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /csf/subscriptions/{id}/pause"
        actor: Member
        preconditions:
          - "Subscription.lifecycle_status == ACTIVE"
        side_effects:
          - "every ShareDelivery of this subscription with fulfillment_status == SCHEDULED and week_index strictly greater than the current delivery week becomes ineligible for catch allocation"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /csf/subscriptions/{id}/resume"
        actor: Member
        preconditions:
          - "Subscription.lifecycle_status == PAUSED"
          - "Member.standing IN {GOOD, WARNED}"
          - "Season.status == OPEN"
        side_effects:
          - "future SCHEDULED ShareDelivery rows become eligible for catch allocation again"
        note: "ACTIVE -> PAUSED -> ACTIVE is the re-entrant loop on this axis"
      - from: ACTIVE
        to: PAUSED
        trigger: "system, cascade hop 4 of the hub no-show cascade when Member.standing becomes RESTRICTED"
        actor: system
        preconditions:
          - "Subscription.lifecycle_status == ACTIVE"
          - "Member.standing == RESTRICTED"
        side_effects:
          - "records the pause as member-standing driven; POST /csf/subscriptions/{id}/resume is rejected with ERR_MEMBER_RESTRICTED while standing == RESTRICTED"
      - from: ACTIVE
        to: PAST_DUE
        trigger: "system, when a delivery is charged and Subscription.paid_cents is less than the cumulative charged amount at POST /csf/share-deliveries/{id}/pack"
        actor: system
        preconditions:
          - "Subscription.payment_basis == INSTALLMENT"
          - "Subscription.paid_cents < sum of charged_cents over this subscription's ShareDelivery rows with billing_status IN {CHARGED, PARTIALLY_CREDITED}"
        side_effects:
          - "sets billing_status to DUNNING"
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /csf/subscriptions/{id}/payments"
        actor: Member
        preconditions:
          - "Subscription.lifecycle_status == PAST_DUE"
          - "Subscription.paid_cents after this payment >= sum of charged_cents over this subscription's ShareDelivery rows with billing_status IN {CHARGED, PARTIALLY_CREDITED}"
        side_effects:
          - "sets billing_status to CURRENT"
        note: "ACTIVE -> PAST_DUE -> ACTIVE is the second re-entrant loop on this axis"
      - from: PENDING
        to: PENDING
        trigger: "POST /csf/subscriptions/{id}/payments"
        actor: Member
        preconditions:
          - "Subscription.lifecycle_status == PENDING"
        side_effects:
          - "increases paid_cents; this is how a PREPAID_FULL_SEASON subscription reaches paid_cents >= commitment_cents before activation"
        note: "self-loop; payments are accepted in PENDING, ACTIVE and PAST_DUE, and only the PAST_DUE case moves the axis"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /csf/subscriptions/{id}/payments"
        actor: Member
        preconditions:
          - "Subscription.lifecycle_status == ACTIVE"
        side_effects:
          - "increases paid_cents, keeping the installment arrears test satisfied ahead of future charges"
        note: "self-loop on the lifecycle axis"
      - from: ACTIVE
        to: TRANSFERRED
        trigger: "POST /csf/share-transfers/{id}/accept"
        actor: Member
        preconditions:
          - "Subscription.lifecycle_status == ACTIVE and subscription.id == ShareTransfer.from_subscription_id"
        side_effects:
          - "every ShareDelivery of this subscription with week_index >= ShareTransfer.effective_week_index and fulfillment_status == SCHEDULED is re-parented to ShareTransfer.to_subscription_id"
          - "sets billing_status to REFUND_PENDING when payment_basis == PREPAID_FULL_SEASON, otherwise to SETTLED"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /csf/subscriptions/{id}/cancel"
        actor: Member
        preconditions:
          - "Subscription.lifecycle_status IN {ACTIVE, PAUSED, PAST_DUE}"
        side_effects:
          - "every ShareDelivery of this subscription with fulfillment_status == SCHEDULED transitions to VOIDED and fill_status to VOID with no member credit"
          - "sets billing_status to SETTLED"
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /csf/subscriptions/{id}/cancel"
        actor: Member
        preconditions:
          - "Subscription.lifecycle_status == PAUSED"
        side_effects:
          - "same as the ACTIVE -> CANCELLED transition"
      - from: PAST_DUE
        to: CANCELLED
        trigger: "POST /csf/subscriptions/{id}/cancel"
        actor: CsfAdmin
        preconditions:
          - "Subscription.lifecycle_status == PAST_DUE"
        side_effects:
          - "same as the ACTIVE -> CANCELLED transition"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system, during the season true-up sweep"
        actor: system
        preconditions:
          - "Season.status == TRUE_UP"
          - "Subscription.true_up_status IN {REFUNDED, CREDITED}"
        side_effects:
          - "sets billing_status to SETTLED"
      - from: PAUSED
        to: COMPLETED
        trigger: "system, during the season true-up sweep"
        actor: system
        preconditions:
          - "Season.status == TRUE_UP"
          - "Subscription.true_up_status IN {REFUNDED, CREDITED}"
        side_effects:
          - "sets billing_status to SETTLED"
      - from: PAST_DUE
        to: COMPLETED
        trigger: "system, during the season true-up sweep"
        actor: system
        preconditions:
          - "Season.status == TRUE_UP"
          - "Subscription.true_up_status IN {REFUNDED, CREDITED}"
        side_effects:
          - "sets billing_status to SETTLED"

  - entity: Subscription
    state_field: billing_status
    shape: parallel
    initial_state: UNBILLED
    terminal_states: [SETTLED]
    transitions:
      - from: UNBILLED
        to: CURRENT
        trigger: "POST /csf/subscriptions/{id}/activate with payment_basis INSTALLMENT"
        actor: CsfAdmin
        preconditions:
          - "Subscription.payment_basis == INSTALLMENT"
        side_effects: ["none beyond the axis change"]
      - from: UNBILLED
        to: PREPAID_SETTLED
        trigger: "POST /csf/subscriptions/{id}/activate with payment_basis PREPAID_FULL_SEASON"
        actor: CsfAdmin
        preconditions:
          - "Subscription.paid_cents >= Subscription.commitment_cents"
        side_effects: ["none beyond the axis change"]
      - from: CURRENT
        to: DUNNING
        trigger: "system, alongside the lifecycle ACTIVE -> PAST_DUE transition"
        actor: system
        preconditions:
          - "Subscription.lifecycle_status transitioned to PAST_DUE in this request"
        side_effects: ["none beyond the axis change"]
      - from: DUNNING
        to: CURRENT
        trigger: "POST /csf/subscriptions/{id}/payments clearing the arrears"
        actor: Member
        preconditions:
          - "Subscription.paid_cents after this payment >= the cumulative charged amount"
        side_effects: ["none beyond the axis change"]
        note: "CURRENT -> DUNNING -> CURRENT is a loop on the money axis that is independent of the lifecycle axis"
      - from: PREPAID_SETTLED
        to: REFUND_PENDING
        trigger: "POST /csf/share-transfers/{id}/accept on a prepaid transferor, or the true-up REFUND variant"
        actor: system
        preconditions:
          - "Subscription.payment_basis == PREPAID_FULL_SEASON"
        side_effects: ["records the refund owed in true_up_amount_cents or transferor_refund_cents"]
      - from: REFUND_PENDING
        to: SETTLED
        trigger: "system, when the refund is disbursed during the same request that created it"
        actor: system
        preconditions:
          - "the refund amount has been written to true_up_amount_cents or ShareTransfer.transferor_refund_cents"
        side_effects: ["none beyond the axis change"]
      - from: CURRENT
        to: SETTLED
        trigger: "system, on subscription cancel, transfer-out or true-up completion"
        actor: system
        preconditions:
          - "Subscription.lifecycle_status IN {CANCELLED, TRANSFERRED, COMPLETED}"
        side_effects: ["none beyond the axis change"]
      - from: DUNNING
        to: SETTLED
        trigger: "system, on subscription cancel by CsfAdmin"
        actor: system
        preconditions:
          - "Subscription.lifecycle_status == CANCELLED"
        side_effects: ["none beyond the axis change"]
      - from: PREPAID_SETTLED
        to: SETTLED
        trigger: "system, on true-up completion for a prepaid subscription with no refund owed"
        actor: system
        preconditions:
          - "Subscription.true_up_status IN {REFUNDED, CREDITED}"
        side_effects: ["none beyond the axis change"]

  - entity: Subscription
    state_field: true_up_status
    shape: branching
    initial_state: NOT_DUE
    terminal_states: [REFUNDED, CREDITED]
    transitions:
      - from: NOT_DUE
        to: SHORTFALL_FLAGGED
        trigger: "system, cascade hop 5 of the discard cascade, caused by the delivery credit written in hop 4"
        actor: system
        preconditions:
          - "Subscription.credited_count increased in this request"
          - "Subscription.true_up_status == NOT_DUE"
        side_effects:
          - "cascade hop 6: increments Season.shortfall_flag_count by 1"
      - from: NOT_DUE
        to: REFUNDED
        trigger: "system, during the season true-up sweep, REFUND variant"
        actor: system
        preconditions:
          - "Subscription.payment_basis == PREPAID_FULL_SEASON"
          - "calculations.season_true_up returned refund_cents >= TRUE_UP_MIN_REFUND_CENTS"
        side_effects:
          - "writes true_up_amount_cents and moves billing_status PREPAID_SETTLED -> REFUND_PENDING -> SETTLED"
      - from: SHORTFALL_FLAGGED
        to: REFUNDED
        trigger: "system, during the season true-up sweep, REFUND variant"
        actor: system
        preconditions:
          - "Subscription.payment_basis == PREPAID_FULL_SEASON"
          - "calculations.season_true_up returned refund_cents >= TRUE_UP_MIN_REFUND_CENTS"
        side_effects:
          - "writes true_up_amount_cents"
      - from: NOT_DUE
        to: CREDITED
        trigger: "system, during the season true-up sweep, CREDIT variant"
        actor: system
        preconditions:
          - "Subscription.payment_basis == INSTALLMENT, or the computed refund is strictly below TRUE_UP_MIN_REFUND_CENTS"
        side_effects:
          - "writes rollover_credit_cents and expired_credit_cents"
      - from: SHORTFALL_FLAGGED
        to: CREDITED
        trigger: "system, during the season true-up sweep, CREDIT variant"
        actor: system
        preconditions:
          - "Subscription.payment_basis == INSTALLMENT, or the computed refund is strictly below TRUE_UP_MIN_REFUND_CENTS"
        side_effects:
          - "writes rollover_credit_cents and expired_credit_cents"

  - entity: Member
    state_field: standing
    shape: cyclic
    initial_state: GOOD
    terminal_states: []
    transitions:
      - from: GOOD
        to: WARNED
        trigger: "system, cascade hop 3 of the hub no-show cascade"
        actor: system
        preconditions:
          - "Member.season_no_show_count >= NO_SHOW_WARN_THRESHOLD"
          - "Member.season_no_show_count < NO_SHOW_RESTRICT_THRESHOLD"
        side_effects: ["none; the member may still subscribe and resume"]
      - from: WARNED
        to: RESTRICTED
        trigger: "system, cascade hop 3 of the hub no-show cascade"
        actor: system
        preconditions:
          - "Member.season_no_show_count >= NO_SHOW_RESTRICT_THRESHOLD"
        side_effects:
          - "cascade hop 4: every Subscription of this member with lifecycle_status == ACTIVE transitions to PAUSED"
          - "POST /csf/subscriptions and POST /csf/subscriptions/{id}/resume for this member are rejected with ERR_MEMBER_RESTRICTED"
      - from: RESTRICTED
        to: GOOD
        trigger: "PATCH /csf/members/{id}/preferences with standing_reset true"
        actor: CsfAdmin
        preconditions:
          - "Member.standing == RESTRICTED"
        side_effects:
          - "resets season_no_show_count to 0"
        note: "RESTRICTED -> GOOD closes the loop on this axis; paused subscriptions are not auto-resumed"
      - from: WARNED
        to: GOOD
        trigger: "PATCH /csf/members/{id}/preferences with standing_reset true"
        actor: CsfAdmin
        preconditions:
          - "Member.standing == WARNED"
        side_effects:
          - "resets season_no_show_count to 0"

  - entity: Vessel
    state_field: compliance_status
    shape: cyclic
    initial_state: COMPLIANT
    terminal_states: []
    transitions:
      - from: COMPLIANT
        to: PROBATION
        trigger: "POST /csf/vessels/{id}/compliance with target_status PROBATION"
        actor: CsfAdmin
        preconditions:
          - "Vessel.compliance_status == COMPLIANT"
        side_effects:
          - "increments Vessel.violation_count by 1"
      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /csf/vessels/{id}/compliance with target_status SUSPENDED"
        actor: CsfAdmin
        preconditions:
          - "Vessel.compliance_status == PROBATION"
        side_effects:
          - "increments Vessel.violation_count by 1"
          - "every QuotaLedger with vessel_id == vessel.id and status IN {OPEN, WARNING} transitions to SUSPENDED"
          - "POST /csf/trips and POST /csf/trips/{id}/land for this vessel are rejected with ERR_VESSEL_SUSPENDED"
      - from: SUSPENDED
        to: COMPLIANT
        trigger: "POST /csf/vessels/{id}/compliance with target_status COMPLIANT"
        actor: CsfAdmin
        preconditions:
          - "Vessel.compliance_status == SUSPENDED"
        side_effects:
          - "every QuotaLedger with vessel_id == vessel.id and status == SUSPENDED returns to OPEN when committed_pounds / entitlement_pounds < QUOTA_WARNING_PCT, otherwise to WARNING"
        note: "COMPLIANT -> PROBATION -> SUSPENDED -> COMPLIANT is the cycle on this axis"
      - from: PROBATION
        to: COMPLIANT
        trigger: "POST /csf/vessels/{id}/compliance with target_status COMPLIANT"
        actor: CsfAdmin
        preconditions:
          - "Vessel.compliance_status == PROBATION"
        side_effects: ["none beyond the axis change"]

  - entity: QuotaLedger
    state_field: status
    shape: cyclic
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: WARNING
        trigger: "system, on POST /csf/trips/{id}/land after the quota debit"
        actor: system
        preconditions:
          - "committed_pounds / entitlement_pounds >= QUOTA_WARNING_PCT"
          - "remaining_pounds > 0"
        side_effects: ["none; landings continue to be accepted"]
      - from: WARNING
        to: EXHAUSTED
        trigger: "system, on POST /csf/trips/{id}/land after the quota debit"
        actor: system
        preconditions:
          - "remaining_pounds == 0"
        side_effects:
          - "further POST /csf/trips/{id}/land against this ledger are rejected with ERR_QUOTA_EXCEEDED"
      - from: OPEN
        to: EXHAUSTED
        trigger: "system, on POST /csf/trips/{id}/land after the quota debit"
        actor: system
        preconditions:
          - "remaining_pounds == 0"
        side_effects:
          - "further POST /csf/trips/{id}/land against this ledger are rejected with ERR_QUOTA_EXCEEDED"
      - from: EXHAUSTED
        to: WARNING
        trigger: "POST /csf/trips/{id}/verify with accepted false"
        actor: CsfAdmin
        preconditions:
          - "Trip.status == LANDED"
          - "the rejected trip's LandingLot.landed_pounds_net is credited back to committed_pounds"
          - "committed_pounds / entitlement_pounds >= QUOTA_WARNING_PCT after the credit"
        side_effects:
          - "landings against this ledger are accepted again"
        note: "EXHAUSTED -> WARNING -> EXHAUSTED is the re-entrant loop driven by landing rejection"
      - from: EXHAUSTED
        to: OPEN
        trigger: "POST /csf/trips/{id}/verify with accepted false"
        actor: CsfAdmin
        preconditions:
          - "committed_pounds / entitlement_pounds < QUOTA_WARNING_PCT after the credit"
        side_effects:
          - "landings against this ledger are accepted again"
      - from: WARNING
        to: OPEN
        trigger: "POST /csf/trips/{id}/verify with accepted false"
        actor: CsfAdmin
        preconditions:
          - "committed_pounds / entitlement_pounds < QUOTA_WARNING_PCT after the credit"
        side_effects: ["none beyond the axis change"]
      - from: OPEN
        to: SUSPENDED
        trigger: "system, when the owning Vessel transitions to SUSPENDED"
        actor: system
        preconditions:
          - "Vessel.compliance_status == SUSPENDED"
        side_effects: ["landings against this ledger are rejected with ERR_VESSEL_SUSPENDED"]
      - from: WARNING
        to: SUSPENDED
        trigger: "system, when the owning Vessel transitions to SUSPENDED"
        actor: system
        preconditions:
          - "Vessel.compliance_status == SUSPENDED"
        side_effects: ["landings against this ledger are rejected with ERR_VESSEL_SUSPENDED"]
      - from: SUSPENDED
        to: OPEN
        trigger: "system, when the owning Vessel returns to COMPLIANT"
        actor: system
        preconditions:
          - "committed_pounds / entitlement_pounds < QUOTA_WARNING_PCT"
        side_effects: ["none beyond the axis change"]
      - from: SUSPENDED
        to: WARNING
        trigger: "system, when the owning Vessel returns to COMPLIANT"
        actor: system
        preconditions:
          - "committed_pounds / entitlement_pounds >= QUOTA_WARNING_PCT"
        side_effects: ["none beyond the axis change"]

  - entity: Trip
    state_field: status
    shape: branching
    initial_state: PLANNED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: PLANNED
        to: LANDED
        trigger: "POST /csf/trips/{id}/land"
        actor: Vendor
        preconditions:
          - "Trip.status == PLANNED"
          - "Season.status == OPEN"
          - "Vessel.compliance_status IN {COMPLIANT, PROBATION}"
          - "QuotaLedger.area_closed == false"
          - "the landing instant is within QuotaLedger.species_open_date .. species_close_date inclusive"
          - "Trip.gear_type is a member of QuotaLedger.permitted_gears"
          - "the sustainability band computed by calculations.sustainability_score is not RED"
          - "landed_pounds_gross <= QuotaLedger.remaining_pounds, unless allow_partial_fill is true"
        side_effects:
          - "computes Trip.sustainability_score and Trip.sustainability_band"
          - "creates one LandingLot with status RECORDED and quality_status CLEAR"
          - "runs calculations.quota_debit, writing LandingLot.landed_pounds_net and LandingLot.discarded_over_quota_pounds"
          - "increments QuotaLedger.committed_pounds by landed_pounds_net and recomputes remaining_pounds and QuotaLedger.status"
          - "sets Trip.landed_at to the current logical-clock instant"
      - from: LANDED
        to: VERIFIED
        trigger: "POST /csf/trips/{id}/verify with accepted true"
        actor: CsfAdmin
        preconditions:
          - "Trip.status == LANDED"
        side_effects:
          - "POST /csf/trips/{id}/settlements becomes permitted for this trip"
      - from: LANDED
        to: REJECTED
        trigger: "POST /csf/trips/{id}/verify with accepted false"
        actor: CsfAdmin
        preconditions:
          - "Trip.status == LANDED"
          - "the trip's LandingLot.status == RECORDED"
        side_effects:
          - "credits LandingLot.landed_pounds_net back to QuotaLedger.committed_pounds and recomputes QuotaLedger.status"
          - "the trip's LandingLot transitions status RECORDED -> CLOSED with quality_status unchanged"

  - entity: LandingLot
    state_field: status
    shape: branching
    initial_state: RECORDED
    terminal_states: [CLOSED, RECALLED]
    transitions:
      - from: RECORDED
        to: ALLOCATED
        trigger: "POST /csf/landing-lots/{id}/allocations"
        actor: CsfAdmin
        preconditions:
          - "LandingLot.status == RECORDED"
          - "LandingLot.quality_status == CLEAR"
          - "Trip.status == LANDED"
          - "Trip.sustainability_band IN {GREEN, YELLOW, ORANGE}"
          - "Season.status == OPEN"
          - "the request carries expected_landing_lot_version equal to LandingLot.version"
        side_effects:
          - "runs calculations.catch_allocation over the eligible ShareDelivery set and writes allocated_pounds on each"
          - "sets LandingLot.allocation_variant, allocated_pounds_total, surplus_secondary_pounds, surplus_donated_pounds and allocation_week_index"
          - "each filled ShareDelivery transitions fulfillment_status SCHEDULED -> ALLOCATED and fill_status PENDING -> FULL_FILL or PENDING -> UNDER_FILLED"
          - "increments LandingLot.version by 1"
      - from: ALLOCATED
        to: ALLOCATED
        trigger: "POST /csf/landing-lots/{id}/allocations, re-run"
        actor: CsfAdmin
        preconditions:
          - "LandingLot.status == ALLOCATED"
          - "LandingLot.quality_status == CLEAR"
          - "no SubLot exists with landing_lot_id == lot.id"
          - "the request carries expected_landing_lot_version equal to LandingLot.version"
        side_effects:
          - "discards the prior allocation: every ShareDelivery with landing_lot_id == lot.id returns to fulfillment_status SCHEDULED, fill_status PENDING, allocated_pounds 0.00 and landing_lot_id null"
          - "re-runs calculations.catch_allocation and calculations.surplus_routing over the eligible set for the supplied week_index"
          - "increments LandingLot.version by 1"
        note: "self-loop; this is the supersede semantics the OCC rule allocation-create-stale-lot guards"
      - from: ALLOCATED
        to: SPLIT
        trigger: "POST /csf/landing-lots/{id}/splits"
        actor: CsfAdmin
        preconditions:
          - "LandingLot.status == ALLOCATED"
          - "LandingLot.quality_status == CLEAR"
          - "the sum of the requested destination pounds equals LandingLot.allocated_pounds_total to the cent-pound"
          - "each destination's pounds equals the sum of allocated_pounds over the ShareDelivery rows routed to that destination"
        side_effects:
          - "creates one SubLot per destination with status IN_TRANSIT"
          - "sets sub_lot_id on every ShareDelivery routed to that destination"
          - "sets LandingLot.split_pounds_total to the sum of SubLot.pounds"
      - from: SPLIT
        to: DISPATCHED
        trigger: "system, when the last SubLot of this lot leaves IN_TRANSIT"
        actor: system
        preconditions:
          - "no SubLot of this lot has status == IN_TRANSIT"
        side_effects: ["none beyond the axis change"]
      - from: DISPATCHED
        to: CLOSED
        trigger: "system, when every ShareDelivery of this lot has fulfillment_status IN {DELIVERED, PICKED_UP, DONATED, VOIDED}"
        actor: system
        preconditions:
          - "no ShareDelivery of this lot has fulfillment_status IN {ALLOCATED, PACKED, IN_TRANSIT, AT_HUB, NO_SHOW}"
        side_effects: ["none beyond the axis change"]
      - from: RECORDED
        to: CLOSED
        trigger: "POST /csf/trips/{id}/verify with accepted false"
        actor: CsfAdmin
        preconditions:
          - "Trip.status == LANDED"
        side_effects: ["the lot is never allocated"]
      - from: SPLIT
        to: RECALLED
        trigger: "POST /csf/recall-notices"
        actor: CsfAdmin
        preconditions:
          - "LandingLot.status IN {SPLIT, DISPATCHED, CLOSED}"
        side_effects:
          - "recall cascade hop 1; see the RecallNotice machine for hops 2 to 4"
      - from: DISPATCHED
        to: RECALLED
        trigger: "POST /csf/recall-notices"
        actor: CsfAdmin
        preconditions:
          - "LandingLot.status IN {SPLIT, DISPATCHED, CLOSED}"
        side_effects:
          - "recall cascade hop 1"
      - from: CLOSED
        to: RECALLED
        trigger: "POST /csf/recall-notices"
        actor: CsfAdmin
        preconditions:
          - "LandingLot.status IN {SPLIT, DISPATCHED, CLOSED}"
        side_effects:
          - "recall cascade hop 1"

  - entity: LandingLot
    state_field: quality_status
    shape: parallel
    initial_state: CLEAR
    terminal_states: [RELEASED, DISCOUNTED, DISCARDED]
    transitions:
      - from: CLEAR
        to: HOLD
        trigger: "system, on POST /csf/cold-chain-events whose breach_type is not NONE"
        actor: system
        preconditions:
          - "LandingLot.cold_chain_cumulative_minutes > COLD_CHAIN_CUMULATIVE_BUDGET_MIN after this event, or the event's minutes_above_threshold > COLD_CHAIN_SINGLE_EXCURSION_MAX_MIN"
        side_effects:
          - "POST /csf/share-deliveries/{id}/deliver and POST /csf/share-deliveries/{id}/pickup for this lot are rejected with ERR_LOT_ON_QUALITY_HOLD"
          - "any SettlementStatement of this lot with status == PROVISIONAL transitions to HELD"
      - from: HOLD
        to: RELEASED
        trigger: "POST /csf/landing-lots/{id}/disposition with disposition RELEASE"
        actor: QualityOfficer
        preconditions:
          - "LandingLot.quality_status == HOLD"
          - "LandingLot.cold_chain_cumulative_minutes <= COLD_CHAIN_RELEASE_LIMIT_MIN"
          - "LandingLot.peak_temp_c <= QUALITY_RELEASE_TEMP_C"
          - "the acting X-User-ID differs from every ColdChainEvent.recorded_by_user_id whose breach_type is not NONE on this lot"
        side_effects:
          - "deliveries of this lot may resume; no member billing change"
          - "any SettlementStatement of this lot with status == HELD returns to PROVISIONAL"
      - from: HOLD
        to: DISCOUNTED
        trigger: "POST /csf/landing-lots/{id}/disposition with disposition DISCOUNT"
        actor: QualityOfficer
        preconditions:
          - "LandingLot.quality_status == HOLD"
          - "LandingLot.cold_chain_cumulative_minutes <= COLD_CHAIN_DISCOUNT_LIMIT_MIN"
          - "the acting X-User-ID differs from every ColdChainEvent.recorded_by_user_id whose breach_type is not NONE on this lot"
        side_effects:
          - "every ShareDelivery of this lot with billing_status IN {CHARGED, PARTIALLY_CREDITED} receives a credit of round_half_up(invoice_total_cents * QUALITY_DISCOUNT_CREDIT_PCT) and moves billing_status to PARTIALLY_CREDITED"
          - "Member.credit_balance_cents increases by the same amount for each affected member"
          - "any SettlementStatement of this lot with status == HELD becomes eligible for finalize with the DISCOUNT holdback split"
      - from: HOLD
        to: DISCARDED
        trigger: "POST /csf/landing-lots/{id}/disposition with disposition DISCARD"
        actor: QualityOfficer
        preconditions:
          - "LandingLot.quality_status == HOLD"
          - "the acting X-User-ID differs from every ColdChainEvent.recorded_by_user_id whose breach_type is not NONE on this lot"
        side_effects:
          - "discard cascade hop 2: every SubLot of this lot with status IN {IN_TRANSIT, ARRIVED} transitions to DESTROYED"
          - "discard cascade hop 3 is caused by hop 2, hop 4 by hop 3, hop 5 by hop 4 and hop 6 by hop 5; see the SubLot, ShareDelivery and Subscription machines"
          - "any SettlementStatement of this lot with status == HELD becomes eligible for finalize with full holdback forfeiture and an offset"

  - entity: SubLot
    state_field: status
    shape: branching
    initial_state: IN_TRANSIT
    terminal_states: [CONSUMED, RETURNED, DESTROYED]
    transitions:
      - from: IN_TRANSIT
        to: ARRIVED
        trigger: "POST /csf/sub-lots/{id}/arrive"
        actor: HubOperator
        preconditions:
          - "SubLot.status == IN_TRANSIT"
          - "LandingLot.quality_status != DISCARDED"
        side_effects:
          - "when no SubLot of the parent lot remains IN_TRANSIT, the parent lot transitions SPLIT -> DISPATCHED"
      - from: ARRIVED
        to: CONSUMED
        trigger: "system, when every ShareDelivery carried by this sub-lot has fulfillment_status IN {DELIVERED, PICKED_UP, DONATED}"
        actor: system
        preconditions:
          - "no ShareDelivery with sub_lot_id == subLot.id has fulfillment_status IN {PACKED, IN_TRANSIT, AT_HUB, NO_SHOW}"
        side_effects: ["none beyond the axis change"]
      - from: IN_TRANSIT
        to: DESTROYED
        trigger: "system, discard cascade hop 2"
        actor: system
        preconditions:
          - "LandingLot.quality_status == DISCARDED"
        side_effects:
          - "discard cascade hop 3: every ShareDelivery with sub_lot_id == subLot.id and fulfillment_status IN {ALLOCATED, PACKED, IN_TRANSIT, AT_HUB} transitions to VOIDED with fill_status VOID"
      - from: ARRIVED
        to: DESTROYED
        trigger: "system, discard cascade hop 2"
        actor: system
        preconditions:
          - "LandingLot.quality_status == DISCARDED"
        side_effects:
          - "discard cascade hop 3, as above"
      - from: IN_TRANSIT
        to: RETURNED
        trigger: "system, recall cascade hop 2"
        actor: system
        preconditions:
          - "LandingLot.status == RECALLED"
        side_effects:
          - "recall cascade hop 3: every ShareDelivery with sub_lot_id == subLot.id is credited or voided per the ShareDelivery machine"
      - from: ARRIVED
        to: RETURNED
        trigger: "system, recall cascade hop 2"
        actor: system
        preconditions:
          - "LandingLot.status == RECALLED"
        side_effects:
          - "recall cascade hop 3, as above"

  - entity: PickupWindow
    state_field: status
    shape: linear
    initial_state: SCHEDULED
    terminal_states: [RECONCILED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /csf/pickup-windows/{id}/open"
        actor: HubOperator
        preconditions:
          - "PickupWindow.status == SCHEDULED"
          - "the current logical-clock instant is at or after PickupWindow.opens_at"
        side_effects:
          - "POST /csf/share-deliveries/{id}/pickup becomes permitted for boxes staged in this window"
      - from: OPEN
        to: GRACE
        trigger: "system, on the first POST /csf/share-deliveries/{id}/pickup made strictly after closes_at and at or before closes_at plus grace_minutes"
        actor: system
        preconditions:
          - "PickupWindow.status == OPEN"
          - "the current logical-clock instant is strictly after PickupWindow.closes_at"
        side_effects:
          - "POST /csf/share-deliveries/{id}/stage-at-hub is rejected with ERR_WINDOW_NOT_OPEN once the window is in GRACE"
      - from: OPEN
        to: CLOSED
        trigger: "POST /csf/pickup-windows/{id}/close"
        actor: HubOperator
        preconditions:
          - "PickupWindow.status IN {OPEN, GRACE}"
          - "the current logical-clock instant is strictly after closes_at plus grace_minutes"
        side_effects:
          - "no-show cascade hop 1: every ShareDelivery with pickup_window_id == window.id and fulfillment_status == AT_HUB transitions to NO_SHOW"
      - from: GRACE
        to: CLOSED
        trigger: "POST /csf/pickup-windows/{id}/close"
        actor: HubOperator
        preconditions:
          - "PickupWindow.status IN {OPEN, GRACE}"
          - "the current logical-clock instant is strictly after closes_at plus grace_minutes"
        side_effects:
          - "no-show cascade hop 1, as above"
      - from: CLOSED
        to: RECONCILED
        trigger: "system, immediately after the no-show sweep finishes within the same close request"
        actor: system
        preconditions:
          - "no ShareDelivery with pickup_window_id == window.id has fulfillment_status == AT_HUB"
        side_effects:
          - "slots_reserved reaches 0 and slots_free is recomputed"

  - entity: ShareDelivery
    state_field: fulfillment_status
    shape: branching
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, PICKED_UP, DONATED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: ALLOCATED
        trigger: "POST /csf/landing-lots/{id}/allocations"
        actor: CsfAdmin
        preconditions:
          - "ShareDelivery.fulfillment_status == SCHEDULED"
          - "Subscription.lifecycle_status == ACTIVE"
          - "SharePlan.species_tier == SPECIES_TIER_MAP[LandingLot.species]"
          - "ShareDelivery.week_index == the week_index supplied on the allocation call"
        side_effects:
          - "sets landing_lot_id and allocated_pounds"
          - "sets fill_status to FULL_FILL when allocated_pounds >= SharePlan.target_pounds_per_delivery, otherwise to UNDER_FILLED"
      - from: SCHEDULED
        to: SKIPPED
        trigger: "POST /csf/skip-requests"
        actor: Member
        preconditions:
          - "ShareDelivery.fulfillment_status == SCHEDULED"
          - "Subscription.skip_count < SKIP_CAP_PER_SEASON"
        side_effects:
          - "sets billing_status to CREDITED on the CREDIT branch or to FORFEITED on the FORFEIT branch"
      - from: SKIPPED
        to: SCHEDULED
        trigger: "POST /csf/skip-requests/{id}/revoke"
        actor: Member
        preconditions:
          - "SkipRequest.status == CREDITED"
          - "the current logical-clock instant is at or before SkipRequest.cutoff_at"
        side_effects:
          - "returns billing_status to PENDING and removes the banked credit from Subscription.skip_credit_balance_cents"
        note: "SCHEDULED -> SKIPPED -> SCHEDULED is the re-entrant loop on the fulfillment axis"
      - from: ALLOCATED
        to: PACKED
        trigger: "POST /csf/share-deliveries/{id}/pack"
        actor: HubOperator
        preconditions:
          - "ShareDelivery.fulfillment_status == ALLOCATED"
          - "ShareDelivery.sub_lot_id IS NOT NULL"
          - "ShareDelivery.fill_status IN {FULL_FILL, UNDER_FILLED, SUBSTITUTED}; an UNDER_FILLED box whose substitution was rejected or never proposed is packed short"
        side_effects:
          - "runs calculations.member_week_invoice, writing box_pounds, pack_size, gel_pack_count, subtotal_cents, surcharge_cents, delivery_fee_cents and invoice_total_cents"
          - "sets charged_cents to invoice_total_cents and billing_status PENDING -> CHARGED"
          - "may drive Subscription lifecycle ACTIVE -> PAST_DUE when the installment arrears test fails"
      - from: PACKED
        to: IN_TRANSIT
        trigger: "POST /csf/share-deliveries/{id}/dispatch"
        actor: HubOperator
        preconditions:
          - "ShareDelivery.fulfillment_status == PACKED"
          - "Subscription.fulfillment_mode == HOME_DELIVERY"
          - "SubLot.destination_type == ROUTE"
          - "ShareDelivery.gel_pack_count >= 1"
        side_effects:
          - "the box leaves the hub on the home-delivery pipeline"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /csf/share-deliveries/{id}/deliver"
        actor: HubOperator
        preconditions:
          - "ShareDelivery.fulfillment_status == IN_TRANSIT"
          - "LandingLot.quality_status IN {CLEAR, RELEASED, DISCOUNTED}"
          - "at least one ColdChainEvent exists with landing_lot_id == delivery.landing_lot_id and custody_leg == HUB_TO_DOOR"
        side_effects:
          - "may drive SubLot ARRIVED -> CONSUMED and LandingLot DISPATCHED -> CLOSED"
      - from: PACKED
        to: AT_HUB
        trigger: "POST /csf/share-deliveries/{id}/stage-at-hub"
        actor: HubOperator
        preconditions:
          - "ShareDelivery.fulfillment_status == PACKED"
          - "Subscription.fulfillment_mode == HUB_PICKUP"
          - "SubLot.destination_type == HUB"
          - "PickupWindow.status IN {SCHEDULED, OPEN}"
          - "PickupWindow.slots_free >= 1"
        side_effects:
          - "sets pickup_window_id and increments PickupWindow.slots_reserved by 1, decrementing slots_free by 1"
      - from: AT_HUB
        to: PICKED_UP
        trigger: "POST /csf/share-deliveries/{id}/pickup"
        actor: Member
        preconditions:
          - "ShareDelivery.fulfillment_status == AT_HUB"
          - "PickupWindow.status IN {OPEN, GRACE}"
          - "the current logical-clock instant is at or before closes_at plus grace_minutes"
          - "LandingLot.quality_status IN {CLEAR, RELEASED, DISCOUNTED}"
          - "at least one ColdChainEvent exists with landing_lot_id == delivery.landing_lot_id and custody_leg == HUB_HOLD"
        side_effects:
          - "decrements PickupWindow.slots_reserved by 1 and increments slots_occupied by 1"
          - "increments Subscription.delivered_count by 1"
          - "moves the window OPEN -> GRACE when the pickup instant is strictly after closes_at"
      - from: AT_HUB
        to: NO_SHOW
        trigger: "system, no-show cascade hop 1 on POST /csf/pickup-windows/{id}/close"
        actor: system
        preconditions:
          - "ShareDelivery.fulfillment_status == AT_HUB"
          - "PickupWindow.status transitioned to CLOSED in this request"
        side_effects:
          - "no-show cascade hop 2 follows on this same delivery"
      - from: NO_SHOW
        to: DONATED
        trigger: "system, no-show cascade hop 2, caused by hop 1"
        actor: system
        preconditions:
          - "ShareDelivery.fulfillment_status == NO_SHOW"
        side_effects:
          - "sets billing_status CHARGED -> FORFEITED with credit_cents 0"
          - "decrements PickupWindow.slots_reserved by 1 and increments slots_forfeited by 1"
          - "increments Member.season_no_show_count by 1 and Subscription.member_fault_count by 1"
          - "no-show cascade hop 3 is caused by the Member counter written here"
      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /csf/subscriptions/{id}/cancel, or recall cascade hop 3"
        actor: system
        preconditions:
          - "ShareDelivery.fulfillment_status == SCHEDULED"
        side_effects:
          - "sets fill_status to VOID"
      - from: ALLOCATED
        to: VOIDED
        trigger: "system, discard cascade hop 3 or recall cascade hop 3"
        actor: system
        preconditions:
          - "the carrying SubLot transitioned to DESTROYED or RETURNED in this request"
        side_effects:
          - "sets fill_status to VOID; discard cascade hop 4 follows on the billing axis"
      - from: PACKED
        to: VOIDED
        trigger: "system, discard cascade hop 3 or recall cascade hop 3"
        actor: system
        preconditions:
          - "the carrying SubLot transitioned to DESTROYED or RETURNED in this request"
        side_effects:
          - "sets fill_status to VOID; discard cascade hop 4 follows on the billing axis"
      - from: IN_TRANSIT
        to: VOIDED
        trigger: "system, discard cascade hop 3 or recall cascade hop 3"
        actor: system
        preconditions:
          - "the carrying SubLot transitioned to DESTROYED or RETURNED in this request"
        side_effects:
          - "sets fill_status to VOID; discard cascade hop 4 follows on the billing axis"
      - from: AT_HUB
        to: VOIDED
        trigger: "system, discard cascade hop 3 or recall cascade hop 3"
        actor: system
        preconditions:
          - "the carrying SubLot transitioned to DESTROYED or RETURNED in this request"
        side_effects:
          - "sets fill_status to VOID, releases the reserved cooler slot, and discard cascade hop 4 follows"

  - entity: ShareDelivery
    state_field: fill_status
    shape: branching
    initial_state: PENDING
    terminal_states: [VOID]
    transitions:
      - from: PENDING
        to: FULL_FILL
        trigger: "POST /csf/landing-lots/{id}/allocations"
        actor: CsfAdmin
        preconditions:
          - "allocated_pounds >= SharePlan.target_pounds_per_delivery"
        side_effects: ["none beyond the axis change"]
      - from: PENDING
        to: UNDER_FILLED
        trigger: "POST /csf/landing-lots/{id}/allocations"
        actor: CsfAdmin
        preconditions:
          - "allocated_pounds < SharePlan.target_pounds_per_delivery"
        side_effects:
          - "POST /csf/share-deliveries/{id}/substitutions becomes permitted for this delivery"
      - from: UNDER_FILLED
        to: SUBSTITUTED
        trigger: "POST /csf/substitution-events/{id}/accept"
        actor: Member
        preconditions:
          - "SubstitutionEvent.status == PROPOSED"
        side_effects:
          - "adds SubstitutionEvent.substitute_pounds to ShareDelivery.substituted_pounds"
      - from: UNDER_FILLED
        to: VOID
        trigger: "system, discard or recall cascade hop 3, or POST /csf/subscriptions/{id}/cancel"
        actor: system
        preconditions:
          - "the fulfillment axis moved to VOIDED in this request"
        side_effects: ["none beyond the axis change"]
      - from: FULL_FILL
        to: VOID
        trigger: "system, discard or recall cascade hop 3, or POST /csf/subscriptions/{id}/cancel"
        actor: system
        preconditions:
          - "the fulfillment axis moved to VOIDED in this request"
        side_effects: ["none beyond the axis change"]
      - from: SUBSTITUTED
        to: VOID
        trigger: "system, discard or recall cascade hop 3"
        actor: system
        preconditions:
          - "the fulfillment axis moved to VOIDED in this request"
        side_effects: ["none beyond the axis change"]
      - from: PENDING
        to: VOID
        trigger: "POST /csf/subscriptions/{id}/cancel"
        actor: Member
        preconditions:
          - "the fulfillment axis moved SCHEDULED -> VOIDED in this request"
        side_effects: ["none beyond the axis change"]

  - entity: ShareDelivery
    state_field: billing_status
    shape: cyclic
    initial_state: PENDING
    terminal_states: [REFUNDED, FORFEITED]
    transitions:
      - from: PENDING
        to: CHARGED
        trigger: "POST /csf/share-deliveries/{id}/pack"
        actor: HubOperator
        preconditions:
          - "ShareDelivery.billing_status == PENDING"
        side_effects:
          - "sets charged_cents to invoice_total_cents"
      - from: PENDING
        to: CREDITED
        trigger: "POST /csf/skip-requests on the CREDIT branch"
        actor: Member
        preconditions:
          - "the skip settlement variant is CREDIT"
        side_effects:
          - "adds Subscription.price_per_delivery_cents to Subscription.skip_credit_balance_cents and increments skip_credited_count by 1"
      - from: PENDING
        to: FORFEITED
        trigger: "POST /csf/skip-requests on the FORFEIT branch"
        actor: Member
        preconditions:
          - "the skip settlement variant is FORFEIT"
        side_effects:
          - "increments Subscription.member_fault_count by 1 and issues no credit"
      - from: CREDITED
        to: PENDING
        trigger: "POST /csf/skip-requests/{id}/revoke"
        actor: Member
        preconditions:
          - "SkipRequest.status == CREDITED"
        side_effects:
          - "removes the banked credit and decrements skip_credited_count by 1"
        note: "PENDING -> CREDITED -> PENDING is the loop on the money axis"
      - from: CHARGED
        to: PARTIALLY_CREDITED
        trigger: "POST /csf/substitution-events/{id}/accept on the BELOW_VALUE branch, or the DISCOUNT disposition"
        actor: system
        preconditions:
          - "ShareDelivery.billing_status == CHARGED"
          - "the credit amount is strictly greater than 0 and strictly less than charged_cents"
        side_effects:
          - "adds the credit to ShareDelivery.credit_cents and to Member.credit_balance_cents"
      - from: PARTIALLY_CREDITED
        to: PARTIALLY_CREDITED
        trigger: "a second credit on the same delivery, for example a substitution credit followed by a quality DISCOUNT credit"
        actor: system
        preconditions:
          - "credit_cents after the addition remains strictly less than charged_cents"
        side_effects:
          - "accumulates ShareDelivery.credit_cents"
        note: "self-loop; the money axis is re-entrant on PARTIALLY_CREDITED"
      - from: CHARGED
        to: CREDITED
        trigger: "system, recall cascade hop 3 on a delivery already in DELIVERED or PICKED_UP"
        actor: system
        preconditions:
          - "ShareDelivery.fulfillment_status IN {DELIVERED, PICKED_UP}"
          - "LandingLot.status == RECALLED"
        side_effects:
          - "sets credit_cents to invoice_total_cents and adds it to Member.credit_balance_cents"
      - from: PARTIALLY_CREDITED
        to: CREDITED
        trigger: "system, recall cascade hop 3 on a delivery already in DELIVERED or PICKED_UP"
        actor: system
        preconditions:
          - "LandingLot.status == RECALLED"
        side_effects:
          - "raises credit_cents to invoice_total_cents"
      - from: CHARGED
        to: REFUNDED
        trigger: "system, discard cascade hop 4, caused by the VOIDED transition in hop 3"
        actor: system
        preconditions:
          - "ShareDelivery.fulfillment_status == VOIDED"
        side_effects:
          - "sets credit_cents to invoice_total_cents, adds it to Member.credit_balance_cents and increments Subscription.credited_count by 1"
          - "discard cascade hop 5 is caused by the credited_count written here"
      - from: PARTIALLY_CREDITED
        to: REFUNDED
        trigger: "system, discard cascade hop 4"
        actor: system
        preconditions:
          - "ShareDelivery.fulfillment_status == VOIDED"
        side_effects:
          - "raises credit_cents to invoice_total_cents and increments Subscription.credited_count by 1"
      - from: CHARGED
        to: FORFEITED
        trigger: "system, no-show cascade hop 2"
        actor: system
        preconditions:
          - "ShareDelivery.fulfillment_status == NO_SHOW"
        side_effects:
          - "leaves credit_cents at 0"

  - entity: SubstitutionEvent
    state_field: status
    shape: branching
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, REJECTED, CREDIT_ISSUED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /csf/substitution-events/{id}/accept"
        actor: Member
        preconditions:
          - "SubstitutionEvent.status == PROPOSED"
          - "ShareDelivery.fill_status == UNDER_FILLED"
          - "SubstitutionEvent.settlement_variant == EQUAL_OR_GREATER"
        side_effects:
          - "adds substitute_pounds to ShareDelivery.substituted_pounds and moves fill_status UNDER_FILLED -> SUBSTITUTED"
          - "no member credit is issued on this branch"
      - from: PROPOSED
        to: CREDIT_ISSUED
        trigger: "POST /csf/substitution-events/{id}/accept"
        actor: Member
        preconditions:
          - "SubstitutionEvent.status == PROPOSED"
          - "ShareDelivery.fill_status == UNDER_FILLED"
          - "SubstitutionEvent.settlement_variant == BELOW_VALUE"
        side_effects:
          - "adds substitute_pounds to ShareDelivery.substituted_pounds and moves fill_status UNDER_FILLED -> SUBSTITUTED"
          - "adds member_credit_cents to ShareDelivery.credit_cents and Member.credit_balance_cents; when the delivery is already CHARGED the money axis moves CHARGED -> PARTIALLY_CREDITED"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /csf/substitution-events/{id}/reject"
        actor: Member
        preconditions:
          - "SubstitutionEvent.status == PROPOSED"
        side_effects:
          - "ShareDelivery.fill_status remains UNDER_FILLED and the box is packed short"

  - entity: SkipRequest
    state_field: status
    shape: branching
    initial_state: REQUESTED
    terminal_states: [FORFEITED, REVOKED]
    transitions:
      - from: REQUESTED
        to: CREDITED
        trigger: "POST /csf/skip-requests filed at or before cutoff_at"
        actor: Member
        preconditions:
          - "the current logical-clock instant is at or before cutoff_at"
        side_effects:
          - "banks credit_cents on Subscription.skip_credit_balance_cents and moves the delivery to SKIPPED with billing_status CREDITED"
        note: "applied within the create call itself"
      - from: REQUESTED
        to: FORFEITED
        trigger: "POST /csf/skip-requests filed strictly after cutoff_at"
        actor: Member
        preconditions:
          - "the current logical-clock instant is strictly after cutoff_at"
        side_effects:
          - "issues no credit, moves the delivery to SKIPPED with billing_status FORFEITED and increments Subscription.member_fault_count"
        note: "applied within the create call itself"
      - from: CREDITED
        to: REVOKED
        trigger: "POST /csf/skip-requests/{id}/revoke"
        actor: Member
        preconditions:
          - "SkipRequest.status == CREDITED"
          - "the current logical-clock instant is at or before cutoff_at"
        side_effects:
          - "removes credit_cents from Subscription.skip_credit_balance_cents, decrements Subscription.skip_count and Subscription.skip_credited_count by 1, and returns the delivery to SCHEDULED with billing_status PENDING"

  - entity: SettlementStatement
    state_field: status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: PROVISIONAL
        trigger: "POST /csf/trips/{id}/settlements"
        actor: CsfAdmin
        preconditions:
          - "Trip.status == VERIFIED"
          - "the request carries expected_trip_version equal to Trip.version"
        side_effects:
          - "runs calculations.vendor_settlement_gross, calculations.vendor_settlement_deductions and calculations.settlement_holdback on the PROVISIONAL variant"
          - "increments Trip.version by 1"
          - "any earlier SettlementStatement of this trip with status IN {DRAFT, PROVISIONAL} transitions to VOID"
        note: "applied within the create call itself; DRAFT is the pre-computation waypoint"
      - from: PROVISIONAL
        to: HELD
        trigger: "system, when the lot's quality_status becomes HOLD"
        actor: system
        preconditions:
          - "LandingLot.quality_status == HOLD"
        side_effects:
          - "POST /csf/settlement-statements/{id}/finalize is rejected with ERR_HOLDBACK_NOT_CLEARED while the lot is on hold"
      - from: HELD
        to: PROVISIONAL
        trigger: "system, when the lot's quality_status becomes RELEASED"
        actor: system
        preconditions:
          - "LandingLot.quality_status == RELEASED"
        side_effects: ["none beyond the axis change"]
        note: "PROVISIONAL -> HELD -> PROVISIONAL is the re-entrant loop on this axis"
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /csf/settlement-statements/{id}/finalize"
        actor: CsfAdmin
        preconditions:
          - "SettlementStatement.status == PROVISIONAL"
          - "LandingLot.quality_status IN {CLEAR, RELEASED}"
        side_effects:
          - "runs the FINAL variant of calculations.settlement_holdback, writing holdback_released_cents, holdback_forfeited_cents, offset_cents and net_payable_cents"
      - from: HELD
        to: FINAL
        trigger: "POST /csf/settlement-statements/{id}/finalize"
        actor: CsfAdmin
        preconditions:
          - "SettlementStatement.status == HELD"
          - "LandingLot.quality_status IN {DISCOUNTED, DISCARDED}"
        side_effects:
          - "runs the FINAL variant with the DISCOUNT or DISCARD holdback split and offset"
      - from: FINAL
        to: PAID
        trigger: "POST /csf/settlement-statements/{id}/pay"
        actor: CsfAdmin
        preconditions:
          - "SettlementStatement.status == FINAL"
        side_effects:
          - "sets net_paid_cents to net_payable_cents"
      - from: DRAFT
        to: VOID
        trigger: "POST /csf/trips/{id}/settlements creating a restated statement"
        actor: CsfAdmin
        preconditions:
          - "a newer SettlementStatement for the same trip_id was created in this request"
        side_effects: ["none beyond the axis change"]
      - from: PROVISIONAL
        to: VOID
        trigger: "POST /csf/trips/{id}/settlements creating a restated statement"
        actor: CsfAdmin
        preconditions:
          - "a newer SettlementStatement for the same trip_id was created in this request"
        side_effects: ["none beyond the axis change"]

  - entity: ShareTransfer
    state_field: status
    shape: branching
    initial_state: REQUESTED
    terminal_states: [ACCEPTED, DECLINED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: ACCEPTED
        trigger: "POST /csf/share-transfers/{id}/accept"
        actor: Member
        preconditions:
          - "ShareTransfer.status == REQUESTED"
          - "the acting X-User-ID equals the Member.id of the to_subscription's member"
          - "to_subscription.lifecycle_status == WAITLISTED"
          - "from_subscription.lifecycle_status == ACTIVE"
          - "Season.status == OPEN"
        side_effects:
          - "from_subscription transitions ACTIVE -> TRANSFERRED, to_subscription transitions WAITLISTED -> ACTIVE"
          - "moves every SCHEDULED ShareDelivery with week_index >= effective_week_index to the transferee"
          - "applies transferor_refund_cents and transferee_charge_cents from calculations.transfer_settlement"
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /csf/share-transfers/{id}/decline"
        actor: Member
        preconditions:
          - "ShareTransfer.status == REQUESTED"
          - "the acting X-User-ID equals the Member.id of the to_subscription's member"
        side_effects:
          - "both subscriptions keep their current lifecycle_status"
      - from: REQUESTED
        to: EXPIRED
        trigger: "system, when the season transitions OPEN -> LANDINGS_CLOSED"
        actor: system
        preconditions:
          - "Season.status transitioned to LANDINGS_CLOSED in this request"
        side_effects:
          - "no money moves"

  - entity: RecallNotice
    state_field: status
    shape: linear
    initial_state: INITIATED
    terminal_states: [CLOSED]
    transitions:
      - from: INITIATED
        to: SCOPED
        trigger: "POST /csf/recall-notices"
        actor: CsfAdmin
        preconditions:
          - "LandingLot.status IN {SPLIT, DISPATCHED, CLOSED}"
        side_effects:
          - "recall cascade hop 1: LandingLot.status -> RECALLED"
          - "recall cascade hop 2 is caused by hop 1: every SubLot of the lot with status IN {IN_TRANSIT, ARRIVED} -> RETURNED"
          - "recall cascade hop 3 is caused by hop 2: every ShareDelivery on those sub-lots with fulfillment_status IN {DELIVERED, PICKED_UP} moves billing_status to CREDITED with credit_cents = invoice_total_cents, and every other such delivery moves to VOIDED"
          - "recall cascade hop 4 is caused by hop 3: Member.credit_balance_cents rises by each credit and impacted_sub_lot_count, impacted_delivery_count, impacted_member_count and total_credit_cents are written"
        note: "applied within the create call itself; INITIATED is the pre-scope waypoint"
      - from: SCOPED
        to: REMEDIATED
        trigger: "POST /csf/recall-notices/{id}/remediate"
        actor: CsfAdmin
        preconditions:
          - "RecallNotice.status == SCOPED"
          - "no SubLot of the recalled lot has status == IN_TRANSIT"
        side_effects:
          - "records that every impacted member has been notified"
      - from: REMEDIATED
        to: CLOSED
        trigger: "system, immediately after remediation completes within the same request"
        actor: system
        preconditions:
          - "RecallNotice.status == REMEDIATED"
        side_effects:
          - "the recall is archived; no further mutation is accepted on it"

concurrency_rules:
  - rule_id: allocation-create-stale-lot
    parent_entity: LandingLot
    write_endpoint: "POST /csf/landing-lots/{id}/allocations"
    occ_field: "expected_landing_lot_version"
    description: |
      Creating a catch allocation against a LandingLot whose version has advanced
      since the client last observed it is rejected. A newly created allocation run
      legitimately supersedes the allocation the lot already carries, so a writer
      holding a stale view of the lot would silently overwrite pound assignments it
      never saw. The stale-version check turns that into a deterministic rejection.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: transfer-create-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /csf/share-transfers"
    occ_field: "expected_subscription_version"
    description: |
      Creating a ShareTransfer against a from_subscription whose version has advanced
      since the client last observed it is rejected. A new transfer request legitimately
      supersedes the delivery ownership recorded on the subscription, so a writer whose
      view predates a pause, a payment or an earlier transfer would price the transfer
      off stale remaining-delivery counts.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: settlement-create-stale-trip
    parent_entity: Trip
    write_endpoint: "POST /csf/trips/{id}/settlements"
    occ_field: "expected_trip_version"
    description: |
      Creating a SettlementStatement against a Trip whose version has advanced since the
      client last observed it is rejected. A restated statement legitimately voids the
      statement the trip already carries, so a writer holding a stale view of the trip
      would void a statement it never read and republish superseded numbers.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: share_price_per_delivery
    trigger: "POST /csf/share-plans, writing SharePlan.price_per_delivery_cents"
    algorithm: tiered_pricing
    formula: |
      base = SHARE_SIZE_BASE_CENTS[share_size]
      price_per_delivery_cents = round_half_up(base
                                 * SPECIES_TIER_MULTIPLIER[species_tier]
                                 * FREQUENCY_FACTOR[delivery_frequency])
      weight_units               = SHARE_SIZE_WEIGHT_UNITS[share_size]
      target_pounds_per_delivery = weight_units * LB_PER_WEIGHT_UNIT
      min_floor_pounds           = SHARE_MIN_FLOOR_LB[share_size]
    input_set: "the three matrix axes on the SharePlan row being created; no other entity participates"
    constants:
      SHARE_SIZE_BASE_CENTS: { SMALL: 2400, MEDIUM: 3600, LARGE: 5200 }
      SPECIES_TIER_MULTIPLIER: { WHITEFISH: 1.00, PREMIUM_FINFISH: 1.25, SHELLFISH: 1.55 }
      FREQUENCY_FACTOR: { WEEKLY: 1.00, BIWEEKLY: 1.10 }
      SHARE_SIZE_WEIGHT_UNITS: { SMALL: 1, MEDIUM: 2, LARGE: 3 }
      LB_PER_WEIGHT_UNIT: 2.5
      SHARE_MIN_FLOOR_LB: { SMALL: 1.00, MEDIUM: 2.00, LARGE: 3.00 }
    precision: "cents, integer, round_half_up applied once to the whole product"
    worked_example: "MEDIUM x PREMIUM_FINFISH x WEEKLY = round_half_up(3600 * 1.25 * 1.00) = 4500 with weight_units 2, target_pounds_per_delivery 5.00 and min_floor_pounds 2.00; LARGE x SHELLFISH x BIWEEKLY = round_half_up(5200 * 1.55 * 1.10) = 8866 with weight_units 3, target 7.50 and floor 3.00; SMALL carries weight_units 1, target 2.50 and floor 1.00"

  - name: scheduled_delivery_count
    trigger: "POST /csf/share-plans, writing SharePlan.scheduled_delivery_count"
    algorithm: aggregation
    formula: |
      WEEKLY   -> scheduled_delivery_count = Season.total_weeks
      BIWEEKLY -> scheduled_delivery_count = ceil(Season.total_weeks / 2)
    input_set: "the Season named by SharePlan.season_id"
    constants: {}
    precision: "integer"
    worked_example: "total_weeks 20 gives 20 for WEEKLY and 10 for BIWEEKLY"

  - name: delivery_week_set
    trigger: "POST /csf/subscriptions/{id}/activate, and POST /csf/share-transfers/{id}/accept for the transferee"
    algorithm: projection
    formula: |
      WEEKLY   -> { w : join_week_index <= w <= Season.total_weeks }
      BIWEEKLY -> { w : join_week_index <= w <= Season.total_weeks
                        AND (w - join_week_index) mod 2 == 0 }
      for each w in the set, create a ShareDelivery with
        week_index   = w
        scheduled_at = Season.start_date + (w - 1) * 7 days, keeping the time-of-day of start_date
    input_set: "the Subscription's join_week_index and its SharePlan.delivery_frequency; parity is anchored on the join week, not on the season"
    constants: {}
    precision: "whole days; scheduled_at is rendered with three fractional-second digits and a trailing Z"
    worked_example: "season start 2026-05-04T00:00:00Z, WEEKLY, join_week_index 11, total_weeks 20 gives weeks 11..20, the week-11 box being scheduled_at 2026-07-13T00:00:00.000Z"

  - name: promised_delivery_count
    trigger: "POST /csf/subscriptions/{id}/activate, writing Subscription.promised_delivery_count"
    algorithm: aggregation
    formula: |
      promised_delivery_count = cardinality of calculations.delivery_week_set
    input_set: "the same week set the activation materialises as ShareDelivery rows"
    constants: {}
    precision: "integer"
    worked_example: "WEEKLY join 11 of 20 gives 10; BIWEEKLY join 11 of 20 gives 5 (weeks 11, 13, 15, 17, 19)"

  - name: subscription_commitment_total
    trigger: "POST /csf/subscriptions, writing Subscription.commitment_cents and Subscription.price_per_delivery_cents"
    algorithm: forward_looking
    formula: |
      list_ppd = SharePlan.price_per_delivery_cents
      INSTALLMENT branch:
        price_per_delivery_cents = list_ppd
        commitment_cents         = list_ppd * promised_delivery_count
      PREPAID_FULL_SEASON branch:
        price_per_delivery_cents = round_half_up(list_ppd * (1 - PREPAY_DISCOUNT_PCT))
        commitment_cents         = price_per_delivery_cents * SharePlan.scheduled_delivery_count
    input_set: "the subscription's own payment_basis, join_week_index and plan; no other subscription participates"
    constants:
      PREPAY_DISCOUNT_PCT: 0.08
    precision: "cents, integer; the discount is rounded once on the unit price, never on the season total"
    variants:
      - name: installment_prorated
        when: "payment_basis == INSTALLMENT"
        difference: "the commitment is prorated onto the remaining scheduled deliveries from join_week_index, and the unit price is the undiscounted list price"
      - name: prepaid_full_season_unprorated
        when: "payment_basis == PREPAID_FULL_SEASON"
        difference: "the commitment covers the full-season delivery count regardless of join week, but every unit is discounted by PREPAY_DISCOUNT_PCT; promised_delivery_count is still only the weeks from join_week_index onward, so a late prepaid join pays for weeks it will never receive"
    worked_example: "MEDIUM x PREMIUM_FINFISH x WEEKLY (list 4500) joining at week 11 of 20: INSTALLMENT gives ppd 4500 and commitment 45000; PREPAID_FULL_SEASON gives ppd 4140 and commitment 82800, with promised_delivery_count 10 on both branches"

  - name: sustainability_score
    trigger: "POST /csf/trips/{id}/land, writing Trip.sustainability_score and Trip.sustainability_band"
    algorithm: weighted_scoring
    formula: |
      raw   = GEAR_BASE_SCORE[Trip.gear_type]
              - QuotaLedger.area_sensitivity_penalty
              + QuotaLedger.species_stock_adjustment
      score = max(0, min(100, raw))
      band  = GREEN  when score >= SUSTAINABILITY_GREEN_MIN
              YELLOW when SUSTAINABILITY_YELLOW_MIN <= score < SUSTAINABILITY_GREEN_MIN
              ORANGE when SUSTAINABILITY_ORANGE_MIN <= score < SUSTAINABILITY_YELLOW_MIN
              RED    when score < SUSTAINABILITY_ORANGE_MIN
    input_set: "the trip's gear_type and the QuotaLedger row named by Trip.quota_ledger_id"
    constants:
      GEAR_BASE_SCORE: { HOOK_AND_LINE: 90, TRAP: 78, DIVE: 85, GILLNET: 60, TRAWL: 45 }
      SUSTAINABILITY_GREEN_MIN: 80
      SUSTAINABILITY_YELLOW_MIN: 60
      SUSTAINABILITY_ORANGE_MIN: 40
    precision: "integer score; band boundaries are inclusive at the lower edge"
    worked_example: "TRAP with area_sensitivity_penalty 38 and species_stock_adjustment 0 scores exactly 40 and lands in ORANGE; TRAWL with penalty 10 scores 35 and lands in RED, which blocks the landing with ERR_SUSTAINABILITY_BLOCKED"

  - name: quota_debit
    trigger: "POST /csf/trips/{id}/land, writing LandingLot.landed_pounds_net, LandingLot.discarded_over_quota_pounds and QuotaLedger.committed_pounds"
    algorithm: threshold
    formula: |
      remaining = QuotaLedger.entitlement_pounds - QuotaLedger.committed_pounds
      if landed_pounds_gross <= remaining:
        landed_pounds_net           = landed_pounds_gross
        discarded_over_quota_pounds = 0.00
      else if allow_partial_fill == true:
        landed_pounds_net           = remaining
        discarded_over_quota_pounds = landed_pounds_gross - remaining
      else:
        reject with ERR_QUOTA_EXCEEDED
      QuotaLedger.committed_pounds += landed_pounds_net
      QuotaLedger.remaining_pounds  = entitlement_pounds - committed_pounds
    input_set: "the single QuotaLedger named by Trip.quota_ledger_id"
    constants:
      QUOTA_WARNING_PCT: 0.85
    precision: "pounds to 2 decimals, exact subtraction, no rounding"
    worked_example: "entitlement 500.00 with committed 480.00 leaves remaining 20.00; a 25.00 lb gross landing with allow_partial_fill false is rejected, and with allow_partial_fill true yields landed_pounds_net 20.00 and discarded_over_quota_pounds 5.00, driving the ledger to EXHAUSTED. A gross of exactly 20.00 is accepted on both settings."

  - name: catch_allocation
    trigger: "POST /csf/landing-lots/{id}/allocations, writing ShareDelivery.allocated_pounds and LandingLot.allocation_variant"
    algorithm: waterfall_allocation
    formula: |
      P = LandingLot.landed_pounds_net
      eligible = every ShareDelivery E where
                 E.season_id == LandingLot.trip.season_id
                 AND E.week_index == the week_index supplied on the call
                 AND E.fulfillment_status == SCHEDULED
                 AND E.subscription.lifecycle_status == ACTIVE
                 AND E.subscription.share_plan.species_tier == SPECIES_TIER_MAP[LandingLot.species]
      order = eligible sorted by SharePlan.weight_units DESC, then ShareDelivery.created_at ASC
      U     = sum of SharePlan.weight_units over eligible
      raw_i = P * weight_units_i / U            (exact rational, not rounded)

      SHORT_FILL branch, taken when raw_i < SharePlan.min_floor_pounds for at least one i:
        walk `order`; each share whose min_floor_pounds is <= the pounds still unassigned
        receives exactly its min_floor_pounds; each share for which it is not receives 0.00.
        Then any pounds still unassigned are spread over the shares that did receive their
        floor, in proportion to weight_units, truncated down to 0.01, and the residue is
        handed out 0.01 at a time in `order` to shares still below target_pounds_per_delivery.
      NORMAL_FILL branch, taken otherwise:
        allocated_i = min(truncate_down_to_0.01(raw_i), target_pounds_per_delivery_i)
        the residue P - sum(allocated) is handed out 0.01 at a time in `order`
        to shares still strictly below target_pounds_per_delivery.
      surplus_pounds = P - sum(allocated) after the residue pass; it is routed by
      calculations.surplus_routing.
    input_set: "only ShareDelivery rows matching every clause of `eligible`; PAUSED, PAST_DUE, CANCELLED and TRANSFERRED subscriptions and species-tier mismatches are excluded"
    constants:
      ALLOCATION_POUND_PRECISION: 0.01
    precision: "pounds to 2 decimals; truncation down inside the proportional pass, residue handed out in 0.01 steps"
    variants:
      - name: normal_fill
        when: "every share's exact proportional share reaches its min_floor_pounds"
        difference: "pounds are proportional to weight_units and capped at each share's target"
      - name: short_fill
        when: "at least one share's exact proportional share falls below its min_floor_pounds"
        difference: "floors are satisfied first in weight-descending order and the shares that cannot be floored receive 0.00 pounds and become UNDER_FILLED, which is what opens the substitution ladder"
    worked_example: "three eligible shares in created order d1 MEDIUM (units 2, target 5.00, floor 2.00), d2 LARGE (units 3, target 7.50, floor 3.00), d3 SMALL (units 1, target 2.50, floor 1.00), so U = 6 and the targets sum to 15.00. P=8.00 -> NORMAL_FILL 2.66/4.01/1.33, the single 0.01 residue going to d2 on weight_units DESC. P=6.00 -> NORMAL_FILL 2.00/3.00/1.00, exactly on the floors. P=5.99 -> SHORT_FILL 2.39/3.60/0.00. P=5.00 -> SHORT_FILL 2.00/3.00/0.00. P=18.00 -> NORMAL_FILL 5.00/7.50/2.50 with all three capped at target and surplus 3.00."

  - name: surplus_routing
    trigger: "POST /csf/landing-lots/{id}/allocations, writing LandingLot.surplus_secondary_pounds and surplus_donated_pounds"
    algorithm: waterfall_allocation
    formula: |
      surplus = landed_pounds_net - allocated_pounds_total
      surplus_secondary_pounds = truncate_down_to_0.01(surplus * SURPLUS_SECONDARY_MAX_PCT)
      surplus_donated_pounds   = surplus - surplus_secondary_pounds
    input_set: "the single lot being allocated"
    constants:
      SURPLUS_SECONDARY_MAX_PCT: 0.60
    precision: "pounds to 2 decimals; the donation bucket absorbs the truncation residue so the three buckets sum exactly to landed_pounds_net"
    worked_example: "surplus 3.00 routes 1.80 to the secondary market and 1.20 to donation; surplus 1.00 routes 0.60 and 0.40"

  - name: lot_retail_value
    trigger: "POST /csf/trips/{id}/land, writing LandingLot.retail_value_cents_per_lb"
    algorithm: aggregation
    formula: |
      retail_value_cents_per_lb = RETAIL_CENTS_PER_LB[SPECIES_TIER_MAP[LandingLot.species]]
    input_set: "the lot's own species"
    constants:
      RETAIL_CENTS_PER_LB: { WHITEFISH: 1150, PREMIUM_FINFISH: 1850, SHELLFISH: 2650 }
    precision: "integer cents per pound"
    worked_example: "COD maps to WHITEFISH and therefore 1150; SALMON maps to PREMIUM_FINFISH and therefore 1850"

  - name: substitution_value_settlement
    trigger: "POST /csf/share-deliveries/{id}/substitutions, writing SubstitutionEvent.settlement_variant and member_credit_cents"
    algorithm: threshold
    formula: |
      shortfall_pounds       = SharePlan.target_pounds_per_delivery - ShareDelivery.allocated_pounds
      owed_value_cents       = round_half_up(shortfall_pounds
                               * RETAIL_CENTS_PER_LB[SharePlan.species_tier])
      substitute_value_cents = round_half_up(substitute_pounds
                               * substitute_lot.retail_value_cents_per_lb)
      if substitute_value_cents >= owed_value_cents:
        settlement_variant = EQUAL_OR_GREATER ; member_credit_cents = 0
      else:
        settlement_variant = BELOW_VALUE
        member_credit_cents = min(owed_value_cents - substitute_value_cents,
                                  ShareDelivery.subtotal_cents)
    input_set: "the under-filled ShareDelivery, its SharePlan, and the LandingLot named by substitute_landing_lot_id"
    constants:
      RETAIL_CENTS_PER_LB: { WHITEFISH: 1150, PREMIUM_FINFISH: 1850, SHELLFISH: 2650 }
    precision: "cents, integer, round_half_up applied once per value line"
    variants:
      - name: equal_or_greater_costs_nothing
        when: "substitute_value_cents >= owed_value_cents"
        difference: "the member is made whole in kind and receives no money"
      - name: below_value_partial_credit
        when: "substitute_value_cents < owed_value_cents"
        difference: "the member keeps the substitute and additionally receives the value delta as credit, capped at the delivery's own share charge"
    worked_example: "a SMALL PREMIUM_FINFISH box allocated 0.00 lb against a 2.50 lb target has shortfall 2.50 and owes round_half_up(2.50 * 1850) = 4625 cents. 4.03 lb of COD is worth round_half_up(4634.5) = 4635 -> EQUAL_OR_GREATER, credit 0. 4.02 lb of COD is worth 4623 -> BELOW_VALUE, credit 2. 2.00 lb of COD is worth 2300 -> BELOW_VALUE, credit 2325."

  - name: cold_chain_budget_evaluation
    trigger: "POST /csf/cold-chain-events, writing ColdChainEvent.breach_type and the lot's cold-chain roll-ups"
    algorithm: aggregation
    formula: |
      cold_chain_cumulative_minutes  = sum of minutes_above_threshold over every
                                       ColdChainEvent with this landing_lot_id, this one included
      cold_chain_max_single_minutes  = max of minutes_above_threshold over the same set
      peak_temp_c                    = max of peak_temp_c over the same set
      single_breach     = this event's minutes_above_threshold > COLD_CHAIN_SINGLE_EXCURSION_MAX_MIN
      cumulative_breach = cold_chain_cumulative_minutes > COLD_CHAIN_CUMULATIVE_BUDGET_MIN
      breach_type = BOTH             when single_breach and cumulative_breach
                    SINGLE_EXCURSION when single_breach and not cumulative_breach
                    CUMULATIVE       when cumulative_breach and not single_breach
                    NONE             otherwise
      breach_type != NONE moves LandingLot.quality_status CLEAR -> HOLD
    input_set: "every ColdChainEvent whose landing_lot_id equals this lot, ordered by created_at ASC; no event is ever excluded once written"
    constants:
      COLD_CHAIN_CUMULATIVE_BUDGET_MIN: 45
      COLD_CHAIN_SINGLE_EXCURSION_MAX_MIN: 20
    precision: "whole minutes; both budgets breach on strictly greater than, so 20 and 45 are still inside budget"
    worked_example: "legs of 18 then 22 minutes: the second is SINGLE_EXCURSION because 22 > 20, while the cumulative 40 is still inside 45. Legs of 20, 20 then 6 minutes: the third is CUMULATIVE because 46 > 45 while 6 is inside 20. Legs of 20, 20 then 21: the third is BOTH."

  - name: quality_disposition_billing_adjustment
    trigger: "POST /csf/landing-lots/{id}/disposition, writing ShareDelivery.credit_cents and Member.credit_balance_cents"
    algorithm: threshold
    formula: |
      RELEASE  -> no member money moves
      DISCOUNT -> for every ShareDelivery of this lot with billing_status IN {CHARGED, PARTIALLY_CREDITED}:
                    credit_delta = round_half_up(invoice_total_cents * QUALITY_DISCOUNT_CREDIT_PCT)
                    credit_cents += credit_delta ; Member.credit_balance_cents += credit_delta
      DISCARD  -> the discard cascade voids the deliveries and hop 4 refunds each one in full:
                    credit_cents = invoice_total_cents
    input_set: "ShareDelivery rows whose landing_lot_id is this lot; deliveries already in billing_status REFUNDED or FORFEITED are excluded"
    constants:
      QUALITY_DISCOUNT_CREDIT_PCT: 0.30
      COLD_CHAIN_RELEASE_LIMIT_MIN: 60
      COLD_CHAIN_DISCOUNT_LIMIT_MIN: 90
      QUALITY_RELEASE_TEMP_C: 7.0
    precision: "cents, integer, round_half_up per delivery"
    variants:
      - name: discount_partial_credit
        when: "disposition == DISCOUNT"
        difference: "each affected delivery keeps its charge and receives 30 percent of its invoice total back, moving the money axis to PARTIALLY_CREDITED"
      - name: discard_full_refund
        when: "disposition == DISCARD"
        difference: "each affected delivery is voided and refunded in full, moving the money axis to REFUNDED and driving the six-hop cascade"
    worked_example: "a delivery whose invoice_total_cents is 6250 receives 1875 on the DISCOUNT branch and 6250 on the DISCARD branch"

  - name: pack_size_selection
    trigger: "POST /csf/share-deliveries/{id}/pack, writing ShareDelivery.pack_size"
    algorithm: threshold
    formula: |
      box_pounds = allocated_pounds + substituted_pounds
      HUB_PICKUP -> pack_size = NONE
      HOME_DELIVERY ->
        pack_size = SMALL  when box_pounds <= PACK_SMALL_MAX_LB
                    MEDIUM when PACK_SMALL_MAX_LB < box_pounds <= PACK_MEDIUM_MAX_LB
                    LARGE  when box_pounds > PACK_MEDIUM_MAX_LB
    input_set: "the single delivery being packed and its subscription's fulfillment_mode"
    constants:
      PACK_SMALL_MAX_LB: 6.00
      PACK_MEDIUM_MAX_LB: 14.00
    precision: "pounds to 2 decimals; both boundaries are inclusive at the top of the lower tier"
    worked_example: "6.00 lb selects SMALL, 6.01 lb selects MEDIUM, 14.00 lb selects MEDIUM, 14.01 lb selects LARGE"

  - name: gel_pack_count
    trigger: "POST /csf/share-deliveries/{id}/pack, writing ShareDelivery.gel_pack_count"
    algorithm: threshold
    formula: |
      HUB_PICKUP -> gel_pack_count = 0
      HOME_DELIVERY ->
        hours_per_pack = GEL_PACK_HOURS[Season.ambient_band][pack_size]
        gel_pack_count = max(1, ceil(DeliveryZone.transit_hours / hours_per_pack))
    input_set: "the delivery's pack_size, the Season.ambient_band of the delivery's season, and the DeliveryZone named by the subscription"
    constants:
      GEL_PACK_HOURS:
        COOL: { SMALL: 3.0, MEDIUM: 6.0, LARGE: 8.0 }
        MILD: { SMALL: 2.0, MEDIUM: 4.0, LARGE: 5.5 }
        HOT: { SMALL: 1.5, MEDIUM: 3.0, LARGE: 4.0 }
    precision: "integer packs, ceiling"
    non_monotone_note: |
      A SMALL pack has less thermal mass than a MEDIUM one, so it consumes gel packs
      faster. In the HOT band over a 6.0 hour transit a SMALL pack needs
      ceil(6.0 / 1.5) = 4 packs while a MEDIUM pack needs ceil(6.0 / 3.0) = 2.
      This is the mechanism behind the non-monotone fee reversal pinned in
      calculations.member_week_invoice.
    worked_example: "HOT band, transit 6.0 h: SMALL -> 4 packs, MEDIUM -> 2 packs, LARGE -> 2 packs. MILD band, transit 5.0 h: SMALL -> 3 packs."

  - name: member_week_invoice
    trigger: "POST /csf/share-deliveries/{id}/pack, writing subtotal_cents, surcharge_cents, delivery_fee_cents and invoice_total_cents"
    algorithm: constraint_propagation
    formula: |
      EVALUATION ORDER IS PINNED AND MUST BE FOLLOWED EXACTLY:
        step 1  subtotal_cents = Subscription.price_per_delivery_cents
        step 2  HUB_PICKUP  -> pack_cost_cents = 0, zone_base_cents = 0
                HOME_DELIVERY -> pack_cost_cents = PACK_BASE_FEE_CENTS[pack_size]
                                                   + gel_pack_count * GEL_PACK_FEE_CENTS
                                 zone_base_cents = ZONE_BASE_FEE_CENTS[DeliveryZone.fee_tier]
        step 3  surcharge_cents = 0 when Subscription.fulfillment_mode == HUB_PICKUP
                surcharge_cents = 0 when subtotal_cents >= FREE_SURCHARGE_THRESHOLD_CENTS
                surcharge_cents = REMOTE_SURCHARGE_CENTS otherwise
                the waiver test reads subtotal_cents ONLY. It must not read
                zone_base_cents, pack_cost_cents, delivery_fee_cents or
                invoice_total_cents, even though invoice_total_cents is where the
                surcharge ultimately lands.
        step 4  delivery_fee_cents = zone_base_cents + pack_cost_cents + surcharge_cents
        step 5  invoice_total_cents = subtotal_cents + delivery_fee_cents
        step 6  charged_cents = invoice_total_cents
    input_set: "the single delivery being packed, its subscription, its plan, its zone and its season"
    constants:
      PACK_BASE_FEE_CENTS: { SMALL: 300, MEDIUM: 450, LARGE: 600 }
      GEL_PACK_FEE_CENTS: 175
      ZONE_BASE_FEE_CENTS: { TIER_1: 500, TIER_2: 800, TIER_3: 1250 }
      REMOTE_SURCHARGE_CENTS: 250
      FREE_SURCHARGE_THRESHOLD_CENTS: 6000
    precision: "cents, integer throughout; no rounding is needed because every term is already an integer"
    circular_dependency_note: |
      The surcharge is a component of delivery_fee_cents which is a component of
      invoice_total_cents, while the surcharge waiver is a test on a total. The
      scaffold breaks the loop by pinning the waiver to subtotal_cents, evaluated at
      step 3 before any fee exists. The tempting alternative reading -- waive once the
      pre-surcharge running total (subtotal + zone + pack) clears the threshold --
      produces a different number on the same inputs.
    non_monotone_note: |
      Concrete reversal, verified arithmetically. Season ambient_band HOT, DeliveryZone
      TIER_1 with transit_hours 6.0, plan LARGE x WHITEFISH x WEEKLY so
      subtotal_cents = 5200 on both runs.
        box_pounds 6.00 -> pack SMALL, 4 gel packs, pack_cost 300 + 700 = 1000,
                           surcharge 250, delivery_fee 500 + 1000 + 250 = 1750,
                           invoice_total 6950
        box_pounds 6.01 -> pack MEDIUM, 2 gel packs, pack_cost 450 + 350 = 800,
                           surcharge 250, delivery_fee 500 + 800 + 250 = 1550,
                           invoice_total 6750
      One extra hundredth of a pound of fish makes the box 200 cents CHEAPER. The
      member who receives less product pays more, both in absolute fee and per pound
      (1750 / 6.00 = 291.7 c/lb against 1550 / 6.01 = 257.9 c/lb).
    worked_example: "MEDIUM x PREMIUM_FINFISH weekly home delivery, box 3.00 lb, TIER_1, 6.0 h, HOT: subtotal 4500, pack SMALL, 4 gel packs, surcharge 250, delivery_fee 1750, invoice_total 6250. The same plan on HUB_PICKUP: pack NONE, 0 gel packs, surcharge 0, delivery_fee 0, invoice_total 4500."

  - name: hub_slot_accounting
    trigger: "POST /csf/share-deliveries/{id}/stage-at-hub, POST /csf/share-deliveries/{id}/pickup and POST /csf/pickup-windows/{id}/close"
    algorithm: aggregation
    formula: |
      stage-at-hub -> slots_reserved += 1
      pickup       -> slots_reserved -= 1 ; slots_occupied += 1
      no-show      -> slots_reserved -= 1 ; slots_forfeited += 1
      void of a staged box -> slots_reserved -= 1
      slots_free = cooler_slots_total - slots_reserved - slots_occupied - slots_forfeited
      staging is rejected with ERR_HUB_CAPACITY_EXCEEDED when slots_free < 1 before the increment
    input_set: "every ShareDelivery whose pickup_window_id equals this window"
    constants: {}
    precision: "integers; the four buckets always sum to cooler_slots_total"
    worked_example: "a window with cooler_slots_total 2 accepts two staged boxes and rejects the third with ERR_HUB_CAPACITY_EXCEEDED; after one pickup and one no-show the buckets read reserved 0, occupied 1, forfeited 1, free 0"

  - name: no_show_escalation
    trigger: "no-show cascade hop 3, on POST /csf/pickup-windows/{id}/close"
    algorithm: threshold
    formula: |
      Member.season_no_show_count += 1
      standing = RESTRICTED when season_no_show_count >= NO_SHOW_RESTRICT_THRESHOLD
                 WARNED     when NO_SHOW_WARN_THRESHOLD <= season_no_show_count
                                 < NO_SHOW_RESTRICT_THRESHOLD
                 unchanged  otherwise
    input_set: "the single member whose box was forfeited"
    constants:
      NO_SHOW_WARN_THRESHOLD: 1
      NO_SHOW_RESTRICT_THRESHOLD: 2
    precision: "integer counts; both thresholds fire on greater-than-or-equal"
    worked_example: "count 0 leaves standing GOOD, count 1 sets WARNED, count 2 sets RESTRICTED and pauses every ACTIVE subscription of that member"

  - name: skip_settlement
    trigger: "POST /csf/skip-requests, writing SkipRequest.settlement_variant and credit_cents"
    algorithm: threshold
    formula: |
      cutoff_at = ShareDelivery.scheduled_at - Season.landing_commit_lead_hours hours
      if current_utc <= cutoff_at:
        settlement_variant = CREDIT
        credit_cents       = Subscription.price_per_delivery_cents
        Subscription.skip_credit_balance_cents += credit_cents
        Subscription.skip_credited_count       += 1
      else:
        settlement_variant = FORFEIT
        credit_cents       = 0
        Subscription.member_fault_count += 1
      Subscription.skip_count += 1 on both branches
    input_set: "the single target ShareDelivery and its season; the cap test counts every SkipRequest of this subscription whose status is CREDITED or FORFEITED, REVOKED rows excluded"
    constants:
      SKIP_CAP_PER_SEASON: 4
      DEFAULT_LANDING_COMMIT_LEAD_HOURS: 72
    precision: "instant comparison to the second; the cutoff instant itself still earns the credit"
    variants:
      - name: credit_before_cutoff
        when: "the filing instant is at or before cutoff_at"
        difference: "the member banks a full unit price as skip credit and the delivery's money axis moves PENDING -> CREDITED"
      - name: forfeit_after_cutoff
        when: "the filing instant is strictly after cutoff_at"
        difference: "the landing was already committed against this share, so no credit is issued, the box is donated and member_fault_count rises"
    worked_example: "week-11 box scheduled_at 2026-07-13T00:00:00Z with lead 72 h gives cutoff_at 2026-07-10T00:00:00Z. Filing at exactly 2026-07-10T00:00:00Z credits 4500 cents; filing at 2026-07-10T00:00:01Z forfeits."

  - name: skip_credit_expiry
    trigger: "POST /csf/seasons/{id}/true-up, writing Subscription.expired_credit_cents"
    algorithm: waterfall_allocation
    formula: |
      outstanding_balance_cents = max(0, commitment_cents - paid_cents)
      applied_skip_credit_cents = min(skip_credit_balance_cents, outstanding_balance_cents)
      paid_cents               += applied_skip_credit_cents
      expired_credit_cents      = skip_credit_balance_cents - applied_skip_credit_cents
      skip_credit_balance_cents = 0
    input_set: "the single subscription being trued up"
    constants: {}
    precision: "cents, integer"
    worked_example: "a prepaid subscription has no outstanding balance, so a banked 4140 cents of skip credit is applied 0 and expires 4140; an installment subscription owing 9000 applies the whole 4500 and expires 0"

  - name: vendor_settlement_gross
    trigger: "POST /csf/trips/{id}/settlements, writing SettlementStatement.ex_vessel_cents, premium_cents and gross_cents"
    algorithm: tiered_pricing
    formula: |
      P  = LandingLot.landed_pounds_net
      ex_vessel_cents = round_half_up(LandingLot.ex_vessel_price_cents_per_lb * P)
      b1 = min(P, CSF_PREMIUM_BRACKET_1_MAX_LB)
      b2 = max(min(P, CSF_PREMIUM_BRACKET_2_MAX_LB) - CSF_PREMIUM_BRACKET_1_MAX_LB, 0)
      b3 = max(P - CSF_PREMIUM_BRACKET_2_MAX_LB, 0)
      premium_raw   = b1 * CSF_PREMIUM_RATE_1_CENTS_PER_LB
                    + b2 * CSF_PREMIUM_RATE_2_CENTS_PER_LB
                    + b3 * CSF_PREMIUM_RATE_3_CENTS_PER_LB
      premium_cents = round_half_up(premium_raw * BAND_PREMIUM_FACTOR[Trip.sustainability_band])
      gross_cents   = ex_vessel_cents + premium_cents
    input_set: "the single LandingLot named by the statement and the band on its Trip"
    constants:
      CSF_PREMIUM_BRACKET_1_MAX_LB: 100.00
      CSF_PREMIUM_BRACKET_2_MAX_LB: 300.00
      CSF_PREMIUM_RATE_1_CENTS_PER_LB: 60
      CSF_PREMIUM_RATE_2_CENTS_PER_LB: 45
      CSF_PREMIUM_RATE_3_CENTS_PER_LB: 30
      BAND_PREMIUM_FACTOR: { GREEN: 1.00, YELLOW: 0.85, ORANGE: 0.50, RED: 0.00 }
    precision: "the premium is a marginal bracket sum kept exact and rounded ONCE after the band factor is applied; the ex-vessel line is rounded separately"
    worked_example: "350.00 lb: brackets give 100*60 + 200*45 + 50*30 = 16500 raw. GREEN keeps 16500, YELLOW gives 14025, ORANGE gives 8250. At exactly 100.00 lb the raw premium is 6000 and at 100.01 lb it is 6000.45 which rounds to 6000. For 10.04 lb at ex-vessel 850 c/lb and GREEN: ex_vessel 8534, premium round_half_up(602.4) = 602, gross 9136."

  - name: vendor_settlement_deductions
    trigger: "POST /csf/trips/{id}/settlements, writing dock_fee_cents, ice_handling_cents, offload_labor_cents and deductions_cents"
    algorithm: aggregation
    formula: |
      ROUNDING ORDER IS PINNED: each deduction line is rounded to whole cents on its
      own, and only the four rounded lines are summed. Summing the raw lines and
      rounding once at the end is WRONG and produces a different total.
        dock_fee_cents      = DOCK_FEE_CENTS
        ice_handling_cents  = round_half_up(landed_pounds_net * ICE_HANDLING_CENTS_PER_LB)
        offload_labor_cents = round_half_up(Trip.offload_minutes * OFFLOAD_LABOR_CENTS_PER_MINUTE)
        handling_levy_cents = round_half_up(gross_cents * HANDLING_LEVY_PCT)
        deductions_cents    = dock_fee_cents + ice_handling_cents
                              + offload_labor_cents + handling_levy_cents
    input_set: "the single LandingLot and its Trip"
    constants:
      DOCK_FEE_CENTS: 800
      ICE_HANDLING_CENTS_PER_LB: 12
      OFFLOAD_LABOR_CENTS_PER_MINUTE: 95
      HANDLING_LEVY_PCT: 0.0125
    precision: "cents, integer, round_half_up per line then sum"
    rounding_order_note: |
      For landed_pounds_net 10.04, offload_minutes 12 and gross_cents 9136 the raw
      lines are 800, 120.48, 1140 and 114.20. Rounding each line first gives
      800 + 120 + 1140 + 114 = 2174. Summing first gives 2174.68 which rounds to 2175.
      The scaffold pins 2174.
    worked_example: "landed_pounds_net 10.04, offload_minutes 12, gross 9136 -> deductions_cents 2174"

  - name: settlement_holdback
    trigger: "POST /csf/trips/{id}/settlements for the PROVISIONAL variant and POST /csf/settlement-statements/{id}/finalize for the FINAL variant"
    algorithm: forward_looking
    formula: |
      holdback_cents = round_half_up(gross_cents * HOLDBACK_PCT)
      PROVISIONAL variant, written at statement creation:
        holdback_released_cents = 0
        holdback_forfeited_cents = 0
        offset_cents             = 0
        net_payable_cents        = gross_cents - deductions_cents - holdback_cents
      FINAL variant, written at finalize, keyed on LandingLot.quality_status:
        CLEAR or RELEASED ->
          holdback_released_cents  = holdback_cents
          holdback_forfeited_cents = 0
          offset_cents             = 0
        DISCOUNTED ->
          holdback_released_cents  = round_half_up(holdback_cents
                                     * VENDOR_DISCOUNT_HOLDBACK_RELEASE_PCT)
          holdback_forfeited_cents = holdback_cents - holdback_released_cents
          offset_cents             = 0
        DISCARDED ->
          holdback_released_cents  = 0
          holdback_forfeited_cents = holdback_cents
          offset_cents             = min(round_half_up(ex_vessel_cents * DISCARD_OFFSET_PCT),
                                         gross_cents - deductions_cents - holdback_cents)
        net_payable_cents = gross_cents - deductions_cents
                            - holdback_forfeited_cents - offset_cents
    input_set: "the single statement, its lot's quality_status at the moment finalize runs"
    constants:
      HOLDBACK_PCT: 0.10
      VENDOR_DISCOUNT_HOLDBACK_RELEASE_PCT: 0.50
      DISCARD_OFFSET_PCT: 0.25
    precision: "cents, integer, round_half_up on the holdback, on the release split and on the offset"
    variants:
      - name: provisional_holdback_retained
        when: "the statement has just been created and quality disposition has not cleared"
        difference: "the entire holdback is withheld and neither released nor forfeited, so net_payable_cents is at its lowest"
      - name: final_holdback_resolved
        when: "the statement is finalized after the lot's quality_status has settled"
        difference: "the holdback splits into released and forfeited according to the disposition, and a DISCARD additionally charges an offset back to the vessel"
    worked_example: "gross 9136, deductions 2174, holdback round_half_up(913.6) = 914. PROVISIONAL net_payable 6048. FINAL with quality CLEAR 6962. FINAL with DISCOUNTED: released 457, forfeited 457, net_payable 6505. FINAL with DISCARDED: forfeited 914, offset min(round_half_up(2133.5)=2134, 6048) = 2134, net_payable 3914."

  - name: season_true_up
    trigger: "POST /csf/seasons/{id}/true-up, writing Subscription.true_up_amount_cents, true_up_status, rollover_credit_cents and undelivered_count"
    algorithm: chronological
    formula: |
      undelivered_count = promised_delivery_count - delivered_count - credited_count
                          - member_fault_count - skip_credited_count
      base_owed_cents   = (credited_count + undelivered_count) * price_per_delivery_cents
      run calculations.skip_credit_expiry first, then:
      PREPAID_FULL_SEASON branch:
        if base_owed_cents >= TRUE_UP_MIN_REFUND_CENTS:
          true_up_status        = REFUNDED
          true_up_amount_cents  = base_owed_cents
          rollover_credit_cents = 0
          billing_status moves PREPAID_SETTLED -> REFUND_PENDING -> SETTLED
        else:
          true_up_status        = CREDITED
          true_up_amount_cents  = base_owed_cents
          rollover_credit_cents = base_owed_cents
      INSTALLMENT branch:
        true_up_status        = CREDITED
        true_up_amount_cents  = base_owed_cents
        rollover_credit_cents = base_owed_cents
        no cash moves
    input_set: "every Subscription with season_id equal to this season and lifecycle_status IN {ACTIVE, PAUSED, PAST_DUE}, processed in Subscription.created_at ASC order; CANCELLED and TRANSFERRED subscriptions are excluded"
    constants:
      TRUE_UP_MIN_REFUND_CENTS: 5000
    precision: "cents, integer; the subscription's own price_per_delivery_cents is used, which is the discounted unit price on the prepaid branch"
    variants:
      - name: prepaid_cash_refund
        when: "payment_basis == PREPAID_FULL_SEASON and base_owed_cents >= TRUE_UP_MIN_REFUND_CENTS"
        difference: "cash goes back to the member and true_up_status becomes REFUNDED"
      - name: installment_rollover_credit
        when: "payment_basis == INSTALLMENT, or a prepaid subscription whose base_owed_cents is strictly below TRUE_UP_MIN_REFUND_CENTS"
        difference: "no cash moves; the same amount is written to rollover_credit_cents for the next season and true_up_status becomes CREDITED"
    worked_example: "prepaid subscription with price_per_delivery_cents 4140 and one credited delivery owes 4140, which is below 5000, so it takes the credit branch; with two credited deliveries it owes 8280 and takes the refund branch. An installment subscription with price_per_delivery_cents 4500 and one credited delivery always takes the credit branch with rollover_credit_cents 4500."

  - name: transfer_settlement
    trigger: "POST /csf/share-transfers, writing remaining_delivery_count, transfer_fee_cents, transferor_refund_cents, transferee_charge_cents and settlement_variant"
    algorithm: forward_looking
    formula: |
      remaining_delivery_count = count of ShareDelivery rows of from_subscription with
                                 week_index >= effective_week_index
                                 AND fulfillment_status == SCHEDULED
      ppd                      = from_subscription.price_per_delivery_cents
      transfer_fee_cents       = TRANSFER_FEE_CENTS
      PREPAID branch, when from_subscription.payment_basis == PREPAID_FULL_SEASON:
        settlement_variant       = PREPAID
        transferee_charge_cents  = remaining_delivery_count * ppd
        transferor_refund_cents  = transferee_charge_cents - transfer_fee_cents
      INSTALLMENT branch, when from_subscription.payment_basis == INSTALLMENT:
        settlement_variant       = INSTALLMENT
        transferee_charge_cents  = remaining_delivery_count * ppd + transfer_fee_cents
        transferor_refund_cents  = 0
    input_set: "the from_subscription's own SCHEDULED deliveries at or after effective_week_index; deliveries already ALLOCATED, PACKED, SKIPPED or terminal are excluded"
    constants:
      TRANSFER_FEE_CENTS: 2500
    precision: "cents, integer"
    variants:
      - name: prepaid_refund_minus_fee
        when: "from_subscription.payment_basis == PREPAID_FULL_SEASON"
        difference: "the transferor gets cash back for the unused prepaid value less the fee, and the transferee pays exactly the unused value"
      - name: installment_liability_assumed
        when: "from_subscription.payment_basis == INSTALLMENT"
        difference: "no cash returns to the transferor because nothing was prepaid; the transferee assumes the remaining liability and additionally pays the fee"
    worked_example: "10 remaining weekly deliveries. PREPAID with ppd 4140: transferee_charge 41400, transferor_refund 38900, fee 2500. INSTALLMENT with ppd 4500: transferee_charge 47500, transferor_refund 0, fee 2500. On both branches the CSF's net take is exactly 2500."

  - name: sublot_split_conservation
    trigger: "POST /csf/landing-lots/{id}/splits, writing SubLot.pounds and LandingLot.split_pounds_total"
    algorithm: constraint_propagation
    formula: |
      requested_total = sum of destinations[].pounds
      reject with ERR_MASS_CONSERVATION_VIOLATION when
        requested_total != LandingLot.allocated_pounds_total
      for each destination d:
        expected_d = sum of allocated_pounds over ShareDelivery rows whose
                     landing_lot_id == lot.id and whose subscription routes to d
                     (pickup_hub_id == d.destination_id for HUB,
                      delivery_zone_id == d.destination_id for ROUTE)
        reject with ERR_MASS_CONSERVATION_VIOLATION when d.pounds != expected_d
      split_pounds_total = requested_total
    input_set: "every ShareDelivery with landing_lot_id equal to this lot and fill_status IN {FULL_FILL, UNDER_FILLED, SUBSTITUTED}"
    constants: {}
    precision: "pounds compared exactly to 2 decimals; no tolerance is permitted"
    worked_example: "a lot with allocated_pounds_total 9.00 split as HUB-A 4.50 and ROUTE-Z 4.50 is accepted only when the deliveries routed to HUB-A were allocated exactly 4.50 pounds in total; 4.49 or 4.51 is rejected"

  - name: recall_impact_scope
    trigger: "POST /csf/recall-notices, writing the four impacted counters and total_credit_cents"
    algorithm: topological
    formula: |
      level 1  sub_lots  = every SubLot with landing_lot_id == lot.id
      level 2  deliveries = every ShareDelivery with sub_lot_id in sub_lots
      level 3  members    = the distinct Member rows behind those deliveries' subscriptions
      impacted_sub_lot_count  = count(sub_lots)
      impacted_delivery_count = count(deliveries)
      impacted_member_count   = count(distinct members)
      for each delivery in deliveries, processed in ShareDelivery.created_at ASC:
        if fulfillment_status IN {DELIVERED, PICKED_UP}:
           credit = invoice_total_cents - credit_cents ; billing_status -> CREDITED
        else:
           credit = invoice_total_cents - credit_cents ; fulfillment_status -> VOIDED
        credit_cents += credit ; Member.credit_balance_cents += credit
      total_credit_cents = sum of the credits issued in this walk
    input_set: "the closure reachable from the recalled lot through SubLot then ShareDelivery; deliveries already in billing_status REFUNDED or FORFEITED are visited but receive credit 0"
    constants: {}
    precision: "cents, integer"
    worked_example: "a lot split into 2 sub-lots carrying 3 deliveries for 3 distinct members with invoice totals 6250, 4500 and 4500 and no prior credits yields impacted_sub_lot_count 2, impacted_delivery_count 3, impacted_member_count 3 and total_credit_cents 15250"

invariants:
  - id: INV_LANDED_POUNDS_PARTITION
    quantity: "pounds landed over the rail"
    statement: "LandingLot.landed_pounds_gross == LandingLot.landed_pounds_net + LandingLot.discarded_over_quota_pounds"
    compensating_pair: "POST /csf/trips/{id}/land with allow_partial_fill true, against the ledger debit it performs"
  - id: INV_ALLOCATION_PARTITION
    quantity: "net landed pounds"
    statement: "LandingLot.landed_pounds_net == LandingLot.allocated_pounds_total + LandingLot.surplus_secondary_pounds + LandingLot.surplus_donated_pounds"
    compensating_pair: "POST /csf/landing-lots/{id}/allocations against calculations.surplus_routing"
  - id: INV_SPLIT_MASS
    quantity: "allocated pounds"
    statement: "sum of SubLot.pounds over SubLot rows with landing_lot_id == lot.id == LandingLot.split_pounds_total == LandingLot.allocated_pounds_total"
    compensating_pair: "POST /csf/landing-lots/{id}/splits against the allocation it consumes"
  - id: INV_QUOTA_LEDGER
    quantity: "annual catch entitlement in pounds"
    statement: "QuotaLedger.entitlement_pounds == QuotaLedger.committed_pounds + QuotaLedger.remaining_pounds"
    compensating_pair: "POST /csf/trips/{id}/land debits the ledger and POST /csf/trips/{id}/verify with accepted false credits exactly the same pounds back, leaving entitlement_pounds and committed_pounds at their pre-landing values"
  - id: INV_HUB_SLOT_PARTITION
    quantity: "cooler slots in a pickup window"
    statement: "PickupWindow.cooler_slots_total == PickupWindow.slots_free + PickupWindow.slots_reserved + PickupWindow.slots_occupied + PickupWindow.slots_forfeited"
    compensating_pair: "POST /csf/share-deliveries/{id}/stage-at-hub reserves a slot and POST /csf/share-deliveries/{id}/pickup or the window-close no-show sweep consumes exactly that reservation"
  - id: INV_VENDOR_MONEY
    quantity: "gross settlement cents owed on a lot"
    statement: "SettlementStatement.gross_cents == SettlementStatement.deductions_cents + SettlementStatement.net_payable_cents + SettlementStatement.holdback_forfeited_cents + SettlementStatement.offset_cents, on every FINAL statement"
    compensating_pair: "POST /csf/settlement-statements/{id}/finalize resolves the holdback that POST /csf/trips/{id}/settlements withheld; released plus forfeited always equals holdback_cents"
  - id: INV_MEMBER_CREDIT
    quantity: "member credit cents"
    statement: "Member.credit_balance_cents == sum of ShareDelivery.credit_cents over every delivery of every subscription of that member"
    compensating_pair: "POST /csf/substitution-events/{id}/accept on the BELOW_VALUE branch, the DISCOUNT disposition and the recall walk each write both sides of this equality in the same request"
  - id: INV_PROMISED_COUNT_PARTITION
    quantity: "promised deliveries on a subscription"
    statement: "Subscription.promised_delivery_count == delivered_count + credited_count + member_fault_count + skip_credited_count + undelivered_count, evaluated after the true-up sweep"
    compensating_pair: "POST /csf/skip-requests moves one unit from undelivered to skip_credited or member_fault, and POST /csf/skip-requests/{id}/revoke moves it straight back"
  - id: INV_TRANSFER_NET_TAKE
    quantity: "the CSF's net cash take from a share transfer"
    statement: "ShareTransfer.transferee_charge_cents - ShareTransfer.transferor_refund_cents - (remaining_delivery_count * from_subscription.price_per_delivery_cents when settlement_variant == INSTALLMENT else 0) == ShareTransfer.transfer_fee_cents"
    compensating_pair: "POST /csf/share-transfers/{id}/accept moves the obligation and the cash in one request; the equality holds on both settlement variants"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID request headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role names one of the five roles declared in the RBAC matrix"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "the acting role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 4
    category: business_constraint
    check: "every field marked required in the endpoint's input list is present and non-null; unknown body fields are ignored, not rejected"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 5
    category: business_constraint
    check: |
      every supplied enum-typed field carries a declared member. This rung owns exactly
      and only these fields, and no other field routes here: SharePlan.share_size,
      SharePlan.delivery_frequency, SharePlan.species_tier, Season.ambient_band,
      DeliveryZone.fee_tier, Subscription.fulfillment_mode, Subscription.payment_basis,
      Vessel.gear_types members, QuotaLedger.species, QuotaLedger.permitted_gears members,
      Trip.gear_type, LandingLot.species, SubLot.destination_type,
      ColdChainEvent.custody_leg, RecallNotice.reason, the disposition field on
      POST /csf/landing-lots/{id}/disposition, and the target_status field on
      POST /csf/vessels/{id}/compliance.
    error_id: ERR_INVALID_ENUM
    http_status: 400
    applies_to: "all write endpoints carrying one of the listed fields"
  - priority: 6
    category: business_constraint
    check: "numeric and format constraints hold: pounds are strictly positive with at most 2 decimals, cents are non-negative integers, week_index is between 1 and Season.total_weeks, minutes are non-negative integers, datetimes parse as ISO 8601 UTC, closes_at is strictly after opens_at, species_close_date is at or after species_open_date"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 7
    category: existence
    check: "the Season named in the path or in a season_id body field exists"
    error_id: ERR_SEASON_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying a season id"
  - priority: 8
    category: existence
    check: "the SharePlan, DeliveryZone, PickupHub or PickupWindow named in the path or in a share_plan_id, delivery_zone_id, pickup_hub_id or pickup_window_id body field exists"
    error_id: ERR_CATALOG_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying a catalog id"
  - priority: 9
    category: existence
    check: "the Member named in the path or in a member_id body field exists"
    error_id: ERR_MEMBER_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying a member id"
  - priority: 10
    category: existence
    check: "the Subscription named in the path or in a subscription_id, from_subscription_id, to_subscription_id or renewed_from_subscription_id body field exists"
    error_id: ERR_SUBSCRIPTION_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying a subscription id"
  - priority: 11
    category: existence
    check: "the Vessel named in the path or in a vessel_id body field exists"
    error_id: ERR_VESSEL_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying a vessel id"
  - priority: 12
    category: existence
    check: "the QuotaLedger named in a quota_ledger_id body field exists"
    error_id: ERR_QUOTA_LEDGER_NOT_FOUND
    http_status: 404
    applies_to: "POST /csf/trips and GET /csf/quota-ledgers/{id}"
  - priority: 13
    category: existence
    check: "the Trip named in the path or in a trip_id body field exists"
    error_id: ERR_TRIP_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying a trip id"
  - priority: 14
    category: existence
    check: "the LandingLot named in the path or in a landing_lot_id or substitute_landing_lot_id body field exists"
    error_id: ERR_LANDING_LOT_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying a landing lot id"
  - priority: 15
    category: existence
    check: "the SubLot named in the path or in a sub_lot_id body field exists"
    error_id: ERR_SUB_LOT_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying a sub-lot id"
  - priority: 16
    category: existence
    check: "the ShareDelivery named in the path or in a share_delivery_id body field exists"
    error_id: ERR_SHARE_DELIVERY_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying a share delivery id"
  - priority: 17
    category: existence
    check: "the SubstitutionEvent named in the path exists"
    error_id: ERR_SUBSTITUTION_NOT_FOUND
    http_status: 404
    applies_to: "POST /csf/substitution-events/{id}/accept, POST /csf/substitution-events/{id}/reject, GET /csf/substitution-events/{id}"
  - priority: 18
    category: existence
    check: "the SkipRequest named in the path exists"
    error_id: ERR_SKIP_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "POST /csf/skip-requests/{id}/revoke, GET /csf/skip-requests/{id}"
  - priority: 19
    category: existence
    check: "the SettlementStatement named in the path exists"
    error_id: ERR_SETTLEMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /csf/settlement-statements/{id}/finalize, POST /csf/settlement-statements/{id}/pay, GET /csf/settlement-statements/{id}"
  - priority: 20
    category: existence
    check: "the ShareTransfer named in the path exists"
    error_id: ERR_SHARE_TRANSFER_NOT_FOUND
    http_status: 404
    applies_to: "POST /csf/share-transfers/{id}/accept, POST /csf/share-transfers/{id}/decline, GET /csf/share-transfers/{id}"
  - priority: 21
    category: existence
    check: "the RecallNotice named in the path exists"
    error_id: ERR_RECALL_NOT_FOUND
    http_status: 404
    applies_to: "POST /csf/recall-notices/{id}/remediate, GET /csf/recall-notices/{id}"
  - priority: 22
    category: auth
    check: "an entity-backed actor owns the resource it is acting on: a Member's X-User-ID equals Subscription.member_id for subscription, skip, pickup, substitution and transfer actions; a Vendor's X-User-ID equals Trip.vessel_id for trip actions"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "every endpoint whose roles list includes Member or Vendor"
  - priority: 23
    category: business_referential
    check: "declared cross-references agree: Trip.management_area equals QuotaLedger.management_area and Trip.vessel_id equals QuotaLedger.vessel_id; LandingLot.species equals QuotaLedger.species; a HUB_PICKUP subscription supplies pickup_hub_id and no delivery_zone_id while a HOME_DELIVERY subscription supplies delivery_zone_id and no pickup_hub_id; a HOME_DELIVERY subscription's DeliveryZone.is_serviceable is true; SharePlan.season_id equals the subscription's season_id; both subscriptions of a ShareTransfer share the same season_id; a substitution's substitute lot belongs to the same season as the delivery; a staged box's PickupWindow.week_index equals the ShareDelivery.week_index and PickupWindow.pickup_hub_id equals the subscription's pickup_hub_id"
    error_id: ERR_REFERENCE_MISMATCH
    http_status: 422
    applies_to: "POST /csf/trips, POST /csf/trips/{id}/land, POST /csf/subscriptions, POST /csf/share-transfers, POST /csf/share-deliveries/{id}/substitutions, POST /csf/share-deliveries/{id}/stage-at-hub"
  - priority: 24
    category: state
    check: "the Season of the addressed resource is not CLOSED. Carve-outs, in force so the rung cannot make its own successors unreachable: POST /csf/seasons/{id}/true-up itself, POST /csf/_clock/set_current_utc, every GET, and PATCH /csf/members/{id}/preferences"
    error_id: ERR_SEASON_CLOSED
    http_status: 409
    applies_to: "every write endpoint whose addressed resource resolves to a season"
  - priority: 25
    category: state
    check: "the Season is in the status the operation requires: OPEN for POST /csf/subscriptions, activate, resume, POST /csf/trips, land, allocations and share-transfers; OPEN for close-landings; LANDINGS_CLOSED for true-up; PLANNING for open"
    error_id: ERR_SEASON_NOT_OPEN
    http_status: 409
    applies_to: "POST /csf/subscriptions, POST /csf/subscriptions/{id}/activate, POST /csf/subscriptions/{id}/resume, POST /csf/trips, POST /csf/trips/{id}/land, POST /csf/landing-lots/{id}/allocations, POST /csf/share-transfers, POST /csf/seasons/{id}/open, POST /csf/seasons/{id}/close-landings, POST /csf/seasons/{id}/true-up"
  - priority: 26
    category: business_safety
    check: "the acting or referenced Member is not RESTRICTED"
    error_id: ERR_MEMBER_RESTRICTED
    http_status: 403
    applies_to: "POST /csf/subscriptions, POST /csf/subscriptions/{id}/activate, POST /csf/subscriptions/{id}/resume"
  - priority: 27
    category: business_safety
    check: "the Vessel behind the trip has compliance_status IN {COMPLIANT, PROBATION}"
    error_id: ERR_VESSEL_SUSPENDED
    http_status: 403
    applies_to: "POST /csf/trips, POST /csf/trips/{id}/land"
  - priority: 28
    category: state
    check: "the addressed resource is in a from-state the requested transition declares in the state machine table, including terminal-state lockdown: a terminal resource accepts no further transition. This rung also owns the substitution-creation gate ShareDelivery.fill_status == UNDER_FILLED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint that drives a state transition"
  - priority: 29
    category: state
    check: "the Subscription behind the operation has lifecycle_status == ACTIVE"
    error_id: ERR_SUBSCRIPTION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /csf/skip-requests, POST /csf/share-transfers, POST /csf/share-deliveries/{id}/pickup, POST /csf/share-deliveries/{id}/substitutions"
  - priority: 30
    category: business_fiscal
    check: "money owed is in place: a PREPAID_FULL_SEASON activation requires paid_cents >= commitment_cents, and staging or dispatching a box requires the subscription's lifecycle_status to not be PAST_DUE"
    error_id: ERR_PAYMENT_REQUIRED
    http_status: 402
    applies_to: "POST /csf/subscriptions/{id}/activate, POST /csf/share-deliveries/{id}/stage-at-hub, POST /csf/share-deliveries/{id}/dispatch"
  - priority: 31
    category: business_constraint
    check: "the supplied expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /csf/landing-lots/{id}/allocations, POST /csf/share-transfers, POST /csf/trips/{id}/settlements"
  - priority: 32
    category: business_safety
    check: "QuotaLedger.area_closed is false"
    error_id: ERR_AREA_CLOSED
    http_status: 422
    applies_to: "POST /csf/trips/{id}/land"
  - priority: 33
    category: business_temporal
    check: "the current logical-clock instant is at or after QuotaLedger.species_open_date and at or before QuotaLedger.species_close_date"
    error_id: ERR_SPECIES_OUT_OF_SEASON
    http_status: 422
    applies_to: "POST /csf/trips/{id}/land"
  - priority: 34
    category: business_safety
    check: "Trip.gear_type is a member of QuotaLedger.permitted_gears and of Vessel.gear_types"
    error_id: ERR_GEAR_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /csf/trips/{id}/land"
  - priority: 35
    category: business_safety
    check: "the sustainability band computed for the trip is not RED"
    error_id: ERR_SUSTAINABILITY_BLOCKED
    http_status: 422
    applies_to: "POST /csf/trips/{id}/land"
  - priority: 36
    category: business_fiscal
    check: "landed_pounds_gross is at most QuotaLedger.remaining_pounds, or allow_partial_fill is true; a ledger already in status EXHAUSTED or SUSPENDED accepts no landing"
    error_id: ERR_QUOTA_EXCEEDED
    http_status: 422
    applies_to: "POST /csf/trips/{id}/land"
  - priority: 37
    category: business_safety
    check: "the substitute species is not a member of Member.allergy_exclusions"
    error_id: ERR_ALLERGY_EXCLUSION
    http_status: 422
    applies_to: "POST /csf/share-deliveries/{id}/substitutions"
  - priority: 38
    category: business_safety
    check: "Member.never_substitute is false"
    error_id: ERR_NEVER_SUBSTITUTE
    http_status: 422
    applies_to: "POST /csf/share-deliveries/{id}/substitutions"
  - priority: 39
    category: business_constraint
    check: "when the substitute species is a member of Member.dislikes, at least one other species in Season.offered_species is neither in allergy_exclusions nor in dislikes and is carried by some LandingLot of the same season with status IN {RECORDED, ALLOCATED, SPLIT} and quality_status == CLEAR; if such an alternative exists the disliked substitute is refused"
    error_id: ERR_DISLIKE_ALTERNATIVE_AVAILABLE
    http_status: 422
    applies_to: "POST /csf/share-deliveries/{id}/substitutions"
  - priority: 40
    category: business_constraint
    check: "the substitute lot can supply the offer: substitute_pounds is at most substitute_lot.landed_pounds_net minus substitute_lot.allocated_pounds_total minus the pounds already committed to ACCEPTED or CREDIT_ISSUED substitutions drawn from that lot"
    error_id: ERR_NO_SUBSTITUTE_AVAILABLE
    http_status: 422
    applies_to: "POST /csf/share-deliveries/{id}/substitutions"
  - priority: 41
    category: business_safety
    check: "the LandingLot behind the box has quality_status IN {CLEAR, RELEASED, DISCOUNTED}"
    error_id: ERR_LOT_ON_QUALITY_HOLD
    http_status: 409
    applies_to: "POST /csf/share-deliveries/{id}/deliver, POST /csf/share-deliveries/{id}/pickup"
  - priority: 42
    category: business_safety
    check: "the custody evidence the pipeline requires exists: a HUB_TO_DOOR ColdChainEvent on the lot before deliver, a HUB_HOLD ColdChainEvent on the lot before pickup"
    error_id: ERR_COLD_CHAIN_EVIDENCE_MISSING
    http_status: 422
    applies_to: "POST /csf/share-deliveries/{id}/deliver, POST /csf/share-deliveries/{id}/pickup"
  - priority: 43
    category: business_safety
    check: "the requested disposition is within its cold-chain budget: RELEASE requires cold_chain_cumulative_minutes <= COLD_CHAIN_RELEASE_LIMIT_MIN and peak_temp_c <= QUALITY_RELEASE_TEMP_C, DISCOUNT requires cold_chain_cumulative_minutes <= COLD_CHAIN_DISCOUNT_LIMIT_MIN, DISCARD has no budget test"
    error_id: ERR_COLD_CHAIN_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /csf/landing-lots/{id}/disposition"
  - priority: 44
    category: business_safety
    check: "the acting X-User-ID differs from every ColdChainEvent.recorded_by_user_id whose breach_type is not NONE on this lot"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /csf/landing-lots/{id}/disposition"
  - priority: 45
    category: business_temporal
    check: "the PickupWindow is in a status that admits the operation: staging requires status IN {SCHEDULED, OPEN}, pickup requires status IN {OPEN, GRACE}, close requires status IN {OPEN, GRACE}"
    error_id: ERR_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /csf/share-deliveries/{id}/stage-at-hub, POST /csf/share-deliveries/{id}/pickup, POST /csf/pickup-windows/{id}/close"
  - priority: 46
    category: business_temporal
    check: "the pickup instant is at or before PickupWindow.closes_at plus grace_minutes; one second later is refused"
    error_id: ERR_WINDOW_GRACE_EXPIRED
    http_status: 409
    applies_to: "POST /csf/share-deliveries/{id}/pickup"
  - priority: 47
    category: business_constraint
    check: "PickupWindow.slots_free is at least 1 before the reservation"
    error_id: ERR_HUB_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /csf/share-deliveries/{id}/stage-at-hub"
  - priority: 48
    category: business_constraint
    check: "the split's destination pounds reconcile exactly with the allocation, per calculations.sublot_split_conservation"
    error_id: ERR_MASS_CONSERVATION_VIOLATION
    http_status: 422
    applies_to: "POST /csf/landing-lots/{id}/splits"
  - priority: 49
    category: business_constraint
    check: "Subscription.skip_count is strictly below SKIP_CAP_PER_SEASON before the new skip is counted"
    error_id: ERR_SKIP_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /csf/skip-requests"
  - priority: 50
    category: business_temporal
    check: "a skip revoke arrives at or before SkipRequest.cutoff_at"
    error_id: ERR_SKIP_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /csf/skip-requests/{id}/revoke"
  - priority: 51
    category: business_constraint
    check: "the transfer is eligible: to_subscription.lifecycle_status == WAITLISTED, from_subscription.lifecycle_status == ACTIVE, the two subscriptions belong to different members, and remaining_delivery_count is strictly greater than 0"
    error_id: ERR_TRANSFER_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /csf/share-transfers, POST /csf/share-transfers/{id}/accept"
  - priority: 52
    category: business_fiscal
    check: "the lot's quality disposition has resolved before the statement is finalized: LandingLot.quality_status is not HOLD"
    error_id: ERR_HOLDBACK_NOT_CLEARED
    http_status: 409
    applies_to: "POST /csf/settlement-statements/{id}/finalize"
  - priority: 53
    category: business_constraint
    check: "scoped uniqueness holds: Season.season_code, Member.email, Vessel.permit_number, PickupHub.hub_code and DeliveryZone.zone_code are globally unique; SharePlan.plan_code is unique within season_id; QuotaLedger is unique on (vessel_id, season_id, species, management_area); PickupWindow is unique on (pickup_hub_id, season_id, week_index); a Member has at most one Subscription per season with lifecycle_status IN {PENDING, WAITLISTED, ACTIVE, PAUSED, PAST_DUE}"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /csf/seasons, POST /csf/members, POST /csf/vessels, POST /csf/pickup-hubs, POST /csf/delivery-zones, POST /csf/share-plans, POST /csf/quota-ledgers, POST /csf/pickup-hubs/{id}/windows, POST /csf/subscriptions"

endpoints:
  - method: POST
    path: "/csf/seasons"
    description: "create a season in PLANNING"
    roles: [CsfAdmin]
    code: 201
    input: [season_code, start_date, end_date, total_weeks, "ambient_band?", offered_species, "landing_commit_lead_hours?"]
    output: Season
    side_effects: ["none"]
  - method: GET
    path: "/csf/seasons/{id}"
    description: "read one season"
    roles: [CsfAdmin, Member, Vendor, HubOperator, QualityOfficer]
    code: 200
    input: []
    output: Season
    side_effects: ["none"]
  - method: POST
    path: "/csf/seasons/{id}/open"
    description: "move the season PLANNING -> OPEN"
    roles: [CsfAdmin]
    code: 200
    input: []
    output: Season
    side_effects: ["subscriptions, landings and allocations become permitted for this season"]
  - method: POST
    path: "/csf/seasons/{id}/close-landings"
    description: "move the season OPEN -> LANDINGS_CLOSED"
    roles: [CsfAdmin]
    code: 200
    input: []
    output: Season
    side_effects: ["every REQUESTED ShareTransfer of this season transitions to EXPIRED"]
  - method: POST
    path: "/csf/seasons/{id}/true-up"
    description: "run the season-end true-up sweep, moving the season LANDINGS_CLOSED -> TRUE_UP -> CLOSED in one request"
    roles: [CsfAdmin]
    code: 200
    input: []
    output: Season
    side_effects:
      - "runs calculations.skip_credit_expiry and calculations.season_true_up for every ACTIVE, PAUSED or PAST_DUE subscription of the season"
      - "writes Subscription.undelivered_count, true_up_amount_cents, rollover_credit_cents, expired_credit_cents and true_up_status"
      - "transitions every trued-up subscription to lifecycle_status COMPLETED and billing_status SETTLED"
      - "sets Season.true_up_run_at and Season.status CLOSED"
  - method: POST
    path: "/csf/share-plans"
    description: "create a product-matrix row for a season"
    roles: [CsfAdmin]
    code: 201
    input: [season_id, plan_code, share_size, delivery_frequency, species_tier]
    output: SharePlan
    side_effects: ["runs calculations.share_price_per_delivery and calculations.scheduled_delivery_count"]
  - method: GET
    path: "/csf/share-plans/{id}"
    description: "read one share plan"
    roles: [CsfAdmin, Member, Vendor, HubOperator, QualityOfficer]
    code: 200
    input: []
    output: SharePlan
    side_effects: ["none"]
  - method: GET
    path: "/csf/share-plans"
    description: "list share plans, filterable by season"
    roles: [CsfAdmin, Member, Vendor, HubOperator, QualityOfficer]
    code: 200
    input: ["season_id?", "limit?", "offset?"]
    output: SharePlan[]
    side_effects: ["none"]
  - method: POST
    path: "/csf/delivery-zones"
    description: "create a home-delivery route zone"
    roles: [CsfAdmin]
    code: 201
    input: [zone_code, fee_tier, transit_hours, "is_serviceable?"]
    output: DeliveryZone
    side_effects: ["none"]
  - method: POST
    path: "/csf/pickup-hubs"
    description: "create a member pickup hub"
    roles: [CsfAdmin]
    code: 201
    input: [hub_code, cooler_slots_default, "grace_minutes?"]
    output: PickupHub
    side_effects: ["none"]
  - method: POST
    path: "/csf/pickup-hubs/{id}/windows"
    description: "create a weekly pickup window under a hub"
    roles: [CsfAdmin]
    code: 201
    input: [season_id, week_index, opens_at, closes_at, "cooler_slots_total?"]
    output: PickupWindow
    side_effects: ["copies PickupHub.grace_minutes onto the window and defaults cooler_slots_total from PickupHub.cooler_slots_default"]
  - method: GET
    path: "/csf/pickup-windows/{id}"
    description: "read one pickup window"
    roles: [CsfAdmin, Member, HubOperator]
    code: 200
    input: []
    output: PickupWindow
    side_effects: ["none"]
  - method: GET
    path: "/csf/pickup-windows"
    description: "list pickup windows, filterable by hub and season"
    roles: [CsfAdmin, Member, HubOperator]
    code: 200
    input: ["pickup_hub_id?", "season_id?", "week_index?", "limit?", "offset?"]
    output: PickupWindow[]
    side_effects: ["none"]
  - method: POST
    path: "/csf/pickup-windows/{id}/open"
    description: "move the window SCHEDULED -> OPEN once the clock reaches opens_at"
    roles: [CsfAdmin, HubOperator]
    code: 200
    input: []
    output: PickupWindow
    side_effects: ["pickup becomes permitted for boxes staged in this window"]
  - method: POST
    path: "/csf/pickup-windows/{id}/close"
    description: "close the window past grace and run the no-show sweep"
    roles: [CsfAdmin, HubOperator]
    code: 200
    input: []
    output: PickupWindow
    side_effects:
      - "no-show cascade hop 1: every AT_HUB delivery in this window transitions to NO_SHOW"
      - "no-show cascade hop 2: each such delivery transitions to DONATED with billing_status FORFEITED, the cooler slot moves from reserved to forfeited, and Member.season_no_show_count rises"
      - "no-show cascade hop 3: Member.standing escalates per calculations.no_show_escalation"
      - "no-show cascade hop 4: every ACTIVE subscription of a member who became RESTRICTED transitions to PAUSED"
      - "the window transitions CLOSED -> RECONCILED in the same request"
  - method: POST
    path: "/csf/members"
    description: "create a member"
    roles: [CsfAdmin]
    code: 201
    input: [full_name, email, "allergy_exclusions?", "dislikes?", "never_substitute?"]
    output: Member
    side_effects: ["none"]
  - method: GET
    path: "/csf/members/{id}"
    description: "read one member"
    roles: [CsfAdmin, Member, HubOperator]
    code: 200
    input: []
    output: Member
    side_effects: ["none"]
  - method: PATCH
    path: "/csf/members/{id}/preferences"
    description: "update the substitution preference profile; standing_reset is CsfAdmin-only and clears a WARNED or RESTRICTED standing"
    roles: [CsfAdmin, Member]
    code: 200
    input: ["allergy_exclusions?", "dislikes?", "never_substitute?", "standing_reset?"]
    output: Member
    side_effects: ["standing_reset true sets season_no_show_count to 0 and standing to GOOD"]
  - method: POST
    path: "/csf/subscriptions"
    description: "create a subscription in PENDING, or in WAITLISTED when waitlist_requested is true"
    roles: [CsfAdmin]
    code: 201
    input: [member_id, share_plan_id, season_id, fulfillment_mode, payment_basis, join_week_index, "pickup_hub_id?", "delivery_zone_id?", "renewed_from_subscription_id?", "waitlist_requested?"]
    output: Subscription
    side_effects:
      - "runs calculations.promised_delivery_count and calculations.subscription_commitment_total"
      - "carries Subscription.rollover_credit_cents of the renewed_from subscription into paid_cents when renewed_from_subscription_id is supplied"
  - method: GET
    path: "/csf/subscriptions/{id}"
    description: "read one subscription"
    roles: [CsfAdmin, Member]
    code: 200
    input: []
    output: Subscription
    side_effects: ["none"]
  - method: GET
    path: "/csf/subscriptions"
    description: "list subscriptions, filterable by every declared foreign key and by lifecycle_status"
    roles: [CsfAdmin, Member]
    code: 200
    input: ["member_id?", "share_plan_id?", "season_id?", "pickup_hub_id?", "delivery_zone_id?", "renewed_from_subscription_id?", "lifecycle_status?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: ["none"]
  - method: POST
    path: "/csf/subscriptions/{id}/activate"
    description: "move the subscription PENDING -> ACTIVE and materialise its ShareDelivery rows"
    roles: [CsfAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects:
      - "creates one ShareDelivery per week in calculations.delivery_week_set"
      - "sets promised_delivery_count and billing_status"
  - method: POST
    path: "/csf/subscriptions/{id}/pause"
    description: "move the subscription ACTIVE -> PAUSED"
    roles: [CsfAdmin, Member]
    code: 200
    input: []
    output: Subscription
    side_effects: ["future SCHEDULED deliveries stop being eligible for catch allocation"]
  - method: POST
    path: "/csf/subscriptions/{id}/resume"
    description: "move the subscription PAUSED -> ACTIVE"
    roles: [CsfAdmin, Member]
    code: 200
    input: []
    output: Subscription
    side_effects: ["future SCHEDULED deliveries become eligible for catch allocation again"]
  - method: POST
    path: "/csf/subscriptions/{id}/cancel"
    description: "cancel the subscription and void its remaining SCHEDULED deliveries"
    roles: [CsfAdmin, Member]
    code: 200
    input: []
    output: Subscription
    side_effects: ["every SCHEDULED delivery transitions to VOIDED with fill_status VOID and no member credit"]
  - method: POST
    path: "/csf/subscriptions/{id}/payments"
    description: "record cash received against the subscription"
    roles: [CsfAdmin, Member]
    code: 200
    input: [amount_cents]
    output: Subscription
    side_effects: ["increases paid_cents; clears PAST_DUE and DUNNING when the arrears test passes"]
  - method: GET
    path: "/csf/subscriptions/{id}/ledger"
    description: "computed read of the subscription's count and money position"
    roles: [CsfAdmin, Member]
    code: 200
    input: []
    output: "{ promised_delivery_count: integer, delivered_count: integer, credited_count: integer, member_fault_count: integer, skip_credited_count: integer, undelivered_count: integer, skip_credit_balance_cents: integer, expired_credit_cents: integer, commitment_cents: integer, paid_cents: integer, rollover_credit_cents: integer, true_up_amount_cents: integer }"
    side_effects: ["none"]
  - method: POST
    path: "/csf/vessels"
    description: "create a fishing vessel"
    roles: [CsfAdmin]
    code: 201
    input: [vessel_name, permit_number, home_port, gear_types]
    output: Vessel
    side_effects: ["none"]
  - method: GET
    path: "/csf/vessels/{id}"
    description: "read one vessel"
    roles: [CsfAdmin, Vendor]
    code: 200
    input: []
    output: Vessel
    side_effects: ["none"]
  - method: POST
    path: "/csf/vessels/{id}/compliance"
    description: "move the vessel's compliance_status around the COMPLIANT / PROBATION / SUSPENDED cycle"
    roles: [CsfAdmin]
    code: 200
    input: [target_status]
    output: Vessel
    side_effects:
      - "SUSPENDED suspends every OPEN or WARNING QuotaLedger of the vessel"
      - "returning to COMPLIANT returns each SUSPENDED ledger to OPEN or WARNING per its consumption ratio"
  - method: POST
    path: "/csf/quota-ledgers"
    description: "create an annual catch entitlement for a vessel, species and management area"
    roles: [CsfAdmin]
    code: 201
    input: [vessel_id, season_id, species, management_area, entitlement_pounds, species_open_date, species_close_date, permitted_gears, "area_closed?", "area_sensitivity_penalty?", "species_stock_adjustment?"]
    output: QuotaLedger
    side_effects: ["sets remaining_pounds to entitlement_pounds"]
  - method: GET
    path: "/csf/quota-ledgers/{id}"
    description: "read one quota ledger"
    roles: [CsfAdmin, Vendor]
    code: 200
    input: []
    output: QuotaLedger
    side_effects: ["none"]
  - method: GET
    path: "/csf/quota-ledgers"
    description: "list quota ledgers, filterable by vessel and season"
    roles: [CsfAdmin, Vendor]
    code: 200
    input: ["vessel_id?", "season_id?", "limit?", "offset?"]
    output: QuotaLedger[]
    side_effects: ["none"]
  - method: POST
    path: "/csf/trips"
    description: "plan a trip against a vessel's entitlement"
    roles: [CsfAdmin, Vendor]
    code: 201
    input: [vessel_id, season_id, quota_ledger_id, gear_type, management_area]
    output: Trip
    side_effects: ["none"]
  - method: GET
    path: "/csf/trips/{id}"
    description: "read one trip"
    roles: [CsfAdmin, Vendor]
    code: 200
    input: []
    output: Trip
    side_effects: ["none"]
  - method: GET
    path: "/csf/trips"
    description: "list trips, filterable by vessel, season and ledger"
    roles: [CsfAdmin, Vendor]
    code: 200
    input: ["vessel_id?", "season_id?", "quota_ledger_id?", "limit?", "offset?"]
    output: Trip[]
    side_effects: ["none"]
  - method: POST
    path: "/csf/trips/{id}/land"
    description: "record the landing, creating the LandingLot and debiting the entitlement"
    roles: [Vendor]
    code: 201
    input: [species, landed_pounds_gross, ex_vessel_price_cents_per_lb, offload_minutes, "allow_partial_fill?"]
    output: LandingLot
    side_effects:
      - "runs calculations.sustainability_score, calculations.quota_debit and calculations.lot_retail_value"
      - "moves the Trip PLANNED -> LANDED and sets Trip.landed_at, offload_minutes, sustainability_score and sustainability_band"
      - "increments QuotaLedger.committed_pounds and may move the ledger to WARNING or EXHAUSTED"
  - method: POST
    path: "/csf/trips/{id}/verify"
    description: "accept or reject the landing report"
    roles: [CsfAdmin]
    code: 200
    input: [accepted]
    output: Trip
    side_effects:
      - "accepted true moves the trip LANDED -> VERIFIED and unlocks settlement creation"
      - "accepted false moves the trip LANDED -> REJECTED, closes the lot and credits landed_pounds_net back to the ledger, possibly moving it EXHAUSTED -> WARNING or EXHAUSTED -> OPEN"
  - method: POST
    path: "/csf/trips/{id}/settlements"
    description: "create the vendor settlement statement for the trip's lot; a new statement voids any earlier statement of the same trip"
    roles: [CsfAdmin]
    code: 201
    input: [expected_trip_version]
    output: SettlementStatement
    side_effects:
      - "runs calculations.vendor_settlement_gross, calculations.vendor_settlement_deductions and the PROVISIONAL variant of calculations.settlement_holdback"
      - "increments Trip.version by 1"
      - "voids any earlier DRAFT or PROVISIONAL statement of this trip"
  - method: GET
    path: "/csf/landing-lots/{id}"
    description: "read one landing lot"
    roles: [CsfAdmin, Vendor, HubOperator, QualityOfficer]
    code: 200
    input: []
    output: LandingLot
    side_effects: ["none"]
  - method: GET
    path: "/csf/landing-lots"
    description: "list landing lots, filterable by trip"
    roles: [CsfAdmin, Vendor, HubOperator, QualityOfficer]
    code: 200
    input: ["trip_id?", "limit?", "offset?"]
    output: LandingLot[]
    side_effects: ["none"]
  - method: POST
    path: "/csf/landing-lots/{id}/allocations"
    description: "run the catch-of-week allocation for one delivery week; a new run supersedes the allocation the lot already carries"
    roles: [CsfAdmin]
    code: 200
    input: [week_index, expected_landing_lot_version]
    output: LandingLot
    side_effects:
      - "runs calculations.catch_allocation and calculations.surplus_routing"
      - "moves each filled ShareDelivery SCHEDULED -> ALLOCATED with fill_status FULL_FILL or UNDER_FILLED"
      - "moves the lot RECORDED -> ALLOCATED"
      - "increments LandingLot.version by 1"
  - method: POST
    path: "/csf/landing-lots/{id}/splits"
    description: "split the allocated lot into destination sub-lots with exact mass conservation"
    roles: [CsfAdmin]
    code: 200
    input: [destinations]
    output: LandingLot
    side_effects:
      - "runs calculations.sublot_split_conservation"
      - "creates one SubLot per destination in IN_TRANSIT and stamps sub_lot_id onto the routed ShareDelivery rows"
      - "moves the lot ALLOCATED -> SPLIT"
  - method: POST
    path: "/csf/landing-lots/{id}/disposition"
    description: "resolve a quality hold as RELEASE, DISCOUNT or DISCARD"
    roles: [QualityOfficer]
    code: 200
    input: [disposition]
    output: LandingLot
    side_effects:
      - "RELEASE returns any HELD settlement to PROVISIONAL and moves no member money"
      - "DISCOUNT credits 30 percent of each affected delivery's invoice_total_cents"
      - "DISCARD drives the six-hop cascade: sub-lots DESTROYED, deliveries VOIDED, deliveries REFUNDED, Subscription.true_up_status SHORTFALL_FLAGGED, Season.shortfall_flag_count incremented"
  - method: GET
    path: "/csf/sub-lots/{id}"
    description: "read one sub-lot"
    roles: [CsfAdmin, HubOperator, QualityOfficer]
    code: 200
    input: []
    output: SubLot
    side_effects: ["none"]
  - method: GET
    path: "/csf/sub-lots"
    description: "list sub-lots, filterable by lot, hub and zone"
    roles: [CsfAdmin, HubOperator, QualityOfficer]
    code: 200
    input: ["landing_lot_id?", "pickup_hub_id?", "delivery_zone_id?", "limit?", "offset?"]
    output: SubLot[]
    side_effects: ["none"]
  - method: POST
    path: "/csf/sub-lots/{id}/arrive"
    description: "record the sub-lot arriving at its destination"
    roles: [HubOperator]
    code: 200
    input: []
    output: SubLot
    side_effects: ["moves the parent lot SPLIT -> DISPATCHED once no sub-lot of the lot remains IN_TRANSIT"]
  - method: GET
    path: "/csf/share-deliveries/{id}"
    description: "read one share delivery box"
    roles: [CsfAdmin, Member, HubOperator]
    code: 200
    input: []
    output: ShareDelivery
    side_effects: ["none"]
  - method: GET
    path: "/csf/share-deliveries"
    description: "list share deliveries, filterable by every declared foreign key, week and fulfillment_status"
    roles: [CsfAdmin, Member, HubOperator]
    code: 200
    input: ["subscription_id?", "season_id?", "landing_lot_id?", "sub_lot_id?", "pickup_window_id?", "week_index?", "fulfillment_status?", "limit?", "offset?"]
    output: ShareDelivery[]
    side_effects: ["none"]
  - method: POST
    path: "/csf/share-deliveries/{id}/pack"
    description: "pack the box, pricing it through the invoice chain"
    roles: [HubOperator]
    code: 200
    input: []
    output: ShareDelivery
    side_effects:
      - "runs calculations.pack_size_selection, calculations.gel_pack_count and calculations.member_week_invoice"
      - "moves the delivery ALLOCATED -> PACKED and billing_status PENDING -> CHARGED"
      - "may move the subscription ACTIVE -> PAST_DUE with billing_status CURRENT -> DUNNING"
  - method: POST
    path: "/csf/share-deliveries/{id}/dispatch"
    description: "put a packed home-delivery box on the road"
    roles: [HubOperator]
    code: 200
    input: []
    output: ShareDelivery
    side_effects: ["moves the delivery PACKED -> IN_TRANSIT on the home-delivery pipeline only"]
  - method: POST
    path: "/csf/share-deliveries/{id}/deliver"
    description: "record a home delivery as delivered"
    roles: [HubOperator]
    code: 200
    input: []
    output: ShareDelivery
    side_effects:
      - "moves the delivery IN_TRANSIT -> DELIVERED"
      - "may move the sub-lot ARRIVED -> CONSUMED and the lot DISPATCHED -> CLOSED"
  - method: POST
    path: "/csf/share-deliveries/{id}/stage-at-hub"
    description: "stage a packed hub-pickup box into a cooler slot"
    roles: [HubOperator]
    code: 200
    input: [pickup_window_id]
    output: ShareDelivery
    side_effects:
      - "runs calculations.hub_slot_accounting, reserving one cooler slot"
      - "moves the delivery PACKED -> AT_HUB and stamps pickup_window_id"
  - method: POST
    path: "/csf/share-deliveries/{id}/pickup"
    description: "record the member collecting a staged box"
    roles: [CsfAdmin, Member, HubOperator]
    code: 200
    input: []
    output: ShareDelivery
    side_effects:
      - "moves the delivery AT_HUB -> PICKED_UP and the cooler slot from reserved to occupied"
      - "increments Subscription.delivered_count"
      - "moves the window OPEN -> GRACE when the pickup instant is strictly after closes_at"
  - method: POST
    path: "/csf/share-deliveries/{id}/substitutions"
    description: "propose a substitute species for an under-filled box"
    roles: [CsfAdmin]
    code: 201
    input: [substitute_landing_lot_id, substitute_pounds]
    output: SubstitutionEvent
    side_effects: ["runs calculations.substitution_value_settlement and creates the offer in PROPOSED"]
  - method: GET
    path: "/csf/substitution-events/{id}"
    description: "read one substitution offer"
    roles: [CsfAdmin, Member]
    code: 200
    input: []
    output: SubstitutionEvent
    side_effects: ["none"]
  - method: GET
    path: "/csf/substitution-events"
    description: "list substitution offers, filterable by delivery and substitute lot"
    roles: [CsfAdmin, Member]
    code: 200
    input: ["share_delivery_id?", "substitute_landing_lot_id?", "limit?", "offset?"]
    output: SubstitutionEvent[]
    side_effects: ["none"]
  - method: POST
    path: "/csf/substitution-events/{id}/accept"
    description: "member accepts the substitute"
    roles: [Member]
    code: 200
    input: []
    output: SubstitutionEvent
    side_effects:
      - "moves the delivery's fill_status UNDER_FILLED -> SUBSTITUTED and adds substitute_pounds to substituted_pounds"
      - "on the BELOW_VALUE branch issues member_credit_cents and moves the money axis CHARGED -> PARTIALLY_CREDITED when the box was already charged"
  - method: POST
    path: "/csf/substitution-events/{id}/reject"
    description: "member refuses the substitute and takes the box short"
    roles: [Member]
    code: 200
    input: []
    output: SubstitutionEvent
    side_effects: ["the delivery stays UNDER_FILLED"]
  - method: POST
    path: "/csf/cold-chain-events"
    description: "log a temperature excursion on one custody leg"
    roles: [HubOperator, QualityOfficer]
    code: 201
    input: [landing_lot_id, custody_leg, minutes_above_threshold, peak_temp_c, "sub_lot_id?"]
    output: ColdChainEvent
    side_effects:
      - "runs calculations.cold_chain_budget_evaluation and refreshes the lot's cold-chain roll-ups"
      - "a breach moves the lot's quality_status CLEAR -> HOLD and any PROVISIONAL settlement of the lot to HELD"
      - "stamps recorded_by_user_id from the X-User-ID header"
  - method: GET
    path: "/csf/cold-chain-events/{id}"
    description: "read one cold-chain leg record"
    roles: [CsfAdmin, HubOperator, QualityOfficer]
    code: 200
    input: []
    output: ColdChainEvent
    side_effects: ["none"]
  - method: GET
    path: "/csf/cold-chain-events"
    description: "list cold-chain leg records, filterable by lot and sub-lot"
    roles: [CsfAdmin, HubOperator, QualityOfficer]
    code: 200
    input: ["landing_lot_id?", "sub_lot_id?", "limit?", "offset?"]
    output: ColdChainEvent[]
    side_effects: ["none"]
  - method: POST
    path: "/csf/skip-requests"
    description: "file a skip for one scheduled week"
    roles: [Member]
    code: 201
    input: [share_delivery_id]
    output: SkipRequest
    side_effects:
      - "runs calculations.skip_settlement"
      - "moves the delivery SCHEDULED -> SKIPPED with billing_status CREDITED or FORFEITED"
      - "increments Subscription.skip_count and either skip_credited_count or member_fault_count"
  - method: GET
    path: "/csf/skip-requests/{id}"
    description: "read one skip request"
    roles: [CsfAdmin, Member]
    code: 200
    input: []
    output: SkipRequest
    side_effects: ["none"]
  - method: GET
    path: "/csf/skip-requests"
    description: "list skip requests, filterable by subscription and delivery"
    roles: [CsfAdmin, Member]
    code: 200
    input: ["subscription_id?", "share_delivery_id?", "limit?", "offset?"]
    output: SkipRequest[]
    side_effects: ["none"]
  - method: POST
    path: "/csf/skip-requests/{id}/revoke"
    description: "withdraw a credited skip while the cutoff has not passed"
    roles: [Member]
    code: 200
    input: []
    output: SkipRequest
    side_effects: ["returns the delivery to SCHEDULED with billing_status PENDING and removes the banked credit"]
  - method: GET
    path: "/csf/settlement-statements/{id}"
    description: "read one settlement statement"
    roles: [CsfAdmin, Vendor]
    code: 200
    input: []
    output: SettlementStatement
    side_effects: ["none"]
  - method: GET
    path: "/csf/settlement-statements"
    description: "list settlement statements, filterable by trip, lot and vessel"
    roles: [CsfAdmin, Vendor]
    code: 200
    input: ["trip_id?", "landing_lot_id?", "vessel_id?", "limit?", "offset?"]
    output: SettlementStatement[]
    side_effects: ["none"]
  - method: POST
    path: "/csf/settlement-statements/{id}/finalize"
    description: "resolve the holdback and publish the FINAL numbers"
    roles: [CsfAdmin]
    code: 200
    input: []
    output: SettlementStatement
    side_effects: ["runs the FINAL variant of calculations.settlement_holdback"]
  - method: POST
    path: "/csf/settlement-statements/{id}/pay"
    description: "disburse the final net payable to the vessel"
    roles: [CsfAdmin]
    code: 200
    input: []
    output: SettlementStatement
    side_effects: ["sets net_paid_cents to net_payable_cents and moves the statement FINAL -> PAID"]
  - method: POST
    path: "/csf/share-transfers"
    description: "offer an active share to a waitlisted subscription; a new offer supersedes the delivery ownership recorded on the transferring subscription"
    roles: [CsfAdmin, Member]
    code: 201
    input: [from_subscription_id, to_subscription_id, season_id, effective_week_index, expected_subscription_version]
    output: ShareTransfer
    side_effects:
      - "runs calculations.transfer_settlement"
      - "increments Subscription.version by 1 on the from_subscription"
  - method: GET
    path: "/csf/share-transfers/{id}"
    description: "read one transfer offer"
    roles: [CsfAdmin, Member]
    code: 200
    input: []
    output: ShareTransfer
    side_effects: ["none"]
  - method: GET
    path: "/csf/share-transfers"
    description: "list transfer offers, filterable by either subscription and by season"
    roles: [CsfAdmin, Member]
    code: 200
    input: ["from_subscription_id?", "to_subscription_id?", "season_id?", "limit?", "offset?"]
    output: ShareTransfer[]
    side_effects: ["none"]
  - method: POST
    path: "/csf/share-transfers/{id}/accept"
    description: "the waitlisted member accepts the share"
    roles: [Member]
    code: 200
    input: []
    output: ShareTransfer
    side_effects:
      - "moves from_subscription ACTIVE -> TRANSFERRED and to_subscription WAITLISTED -> ACTIVE"
      - "re-parents every SCHEDULED delivery at or after effective_week_index and applies the transfer money"
  - method: POST
    path: "/csf/share-transfers/{id}/decline"
    description: "the waitlisted member refuses the share"
    roles: [Member]
    code: 200
    input: []
    output: ShareTransfer
    side_effects: ["both subscriptions keep their lifecycle_status"]
  - method: POST
    path: "/csf/recall-notices"
    description: "raise a recall on a lot and walk it forward to every member share it reached"
    roles: [CsfAdmin]
    code: 201
    input: [landing_lot_id, reason]
    output: RecallNotice
    side_effects:
      - "runs calculations.recall_impact_scope"
      - "recall cascade hops 1 to 4: lot RECALLED, sub-lots RETURNED, deliveries CREDITED or VOIDED, member credit balances raised and the four impacted counters written"
      - "the notice is returned in SCOPED"
  - method: GET
    path: "/csf/recall-notices/{id}"
    description: "read one recall notice"
    roles: [CsfAdmin, QualityOfficer]
    code: 200
    input: []
    output: RecallNotice
    side_effects: ["none"]
  - method: GET
    path: "/csf/recall-notices"
    description: "list recall notices, filterable by lot and season"
    roles: [CsfAdmin, QualityOfficer]
    code: 200
    input: ["landing_lot_id?", "season_id?", "limit?", "offset?"]
    output: RecallNotice[]
    side_effects: ["none"]
  - method: POST
    path: "/csf/recall-notices/{id}/remediate"
    description: "close out the recall once no sub-lot remains in transit"
    roles: [CsfAdmin]
    code: 200
    input: []
    output: RecallNotice
    side_effects: ["moves the notice SCOPED -> REMEDIATED -> CLOSED in the same request"]
  - method: POST
    path: "/csf/_clock/set_current_utc"
    description: "set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-05-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [CsfAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["every subsequent deadline, cutoff, window and season comparison is evaluated against the new instant"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header is missing, empty, or names a role outside the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed on the endpoint, or an entity-backed actor addresses a resource it does not own"
  - id: ERR_VALIDATION
    http: 400
    condition: "a required body field is missing, or a supplied value violates a declared numeric, format or range constraint"
  - id: ERR_INVALID_ENUM
    http: 400
    condition: "an enum-typed field carries a value outside its declared member list"
  - id: ERR_SEASON_NOT_FOUND
    http: 404
    condition: "the Season named in the path or in a season_id body field does not exist"
  - id: ERR_CATALOG_NOT_FOUND
    http: 404
    condition: "the SharePlan, DeliveryZone, PickupHub or PickupWindow named in the path or body does not exist"
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "the Member named in the path or in a member_id body field does not exist"
  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "the Subscription named in the path or in a subscription id body field does not exist"
  - id: ERR_VESSEL_NOT_FOUND
    http: 404
    condition: "the Vessel named in the path or in a vessel_id body field does not exist"
  - id: ERR_QUOTA_LEDGER_NOT_FOUND
    http: 404
    condition: "the QuotaLedger named in the path or in a quota_ledger_id body field does not exist"
  - id: ERR_TRIP_NOT_FOUND
    http: 404
    condition: "the Trip named in the path or in a trip_id body field does not exist"
  - id: ERR_LANDING_LOT_NOT_FOUND
    http: 404
    condition: "the LandingLot named in the path or in a landing_lot_id or substitute_landing_lot_id body field does not exist"
  - id: ERR_SUB_LOT_NOT_FOUND
    http: 404
    condition: "the SubLot named in the path or in a sub_lot_id body field does not exist"
  - id: ERR_SHARE_DELIVERY_NOT_FOUND
    http: 404
    condition: "the ShareDelivery named in the path or in a share_delivery_id body field does not exist"
  - id: ERR_SUBSTITUTION_NOT_FOUND
    http: 404
    condition: "the SubstitutionEvent named in the path does not exist"
  - id: ERR_SKIP_REQUEST_NOT_FOUND
    http: 404
    condition: "the SkipRequest named in the path does not exist"
  - id: ERR_SETTLEMENT_NOT_FOUND
    http: 404
    condition: "the SettlementStatement named in the path does not exist"
  - id: ERR_SHARE_TRANSFER_NOT_FOUND
    http: 404
    condition: "the ShareTransfer named in the path does not exist"
  - id: ERR_RECALL_NOT_FOUND
    http: 404
    condition: "the RecallNotice named in the path does not exist"
  - id: ERR_REFERENCE_MISMATCH
    http: 422
    condition: "two references that must agree do not: trip area against ledger area, lot species against ledger species, fulfillment_mode against the supplied hub or zone, an unserviceable zone, plan season against subscription season, or the two subscriptions of a transfer sitting in different seasons"
  - id: ERR_SEASON_CLOSED
    http: 409
    condition: "a write addresses a resource whose season has status CLOSED, outside the declared carve-outs"
  - id: ERR_SEASON_NOT_OPEN
    http: 409
    condition: "the season is not in the status the operation requires, including a landing attempted after close-landings"
  - id: ERR_MEMBER_RESTRICTED
    http: 403
    condition: "the acting or referenced member has standing RESTRICTED"
  - id: ERR_VESSEL_SUSPENDED
    http: 403
    condition: "the vessel behind the trip has compliance_status SUSPENDED"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the addressed resource is not in a from-state the requested transition declares, including any attempt to transition out of a terminal state"
  - id: ERR_SUBSCRIPTION_NOT_ACTIVE
    http: 409
    condition: "the subscription behind the operation is not in lifecycle_status ACTIVE"
  - id: ERR_PAYMENT_REQUIRED
    http: 402
    condition: "a prepaid activation is underpaid, or a box is staged or dispatched for a PAST_DUE subscription"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "the supplied expected_landing_lot_version, expected_subscription_version or expected_trip_version does not equal the parent's current version"
  - id: ERR_AREA_CLOSED
    http: 422
    condition: "the management area of the entitlement is administratively closed"
  - id: ERR_SPECIES_OUT_OF_SEASON
    http: 422
    condition: "the landing instant falls outside the entitlement's species_open_date to species_close_date window"
  - id: ERR_GEAR_NOT_PERMITTED
    http: 422
    condition: "the trip's gear_type is absent from the entitlement's permitted_gears or from the vessel's gear_types"
  - id: ERR_SUSTAINABILITY_BLOCKED
    http: 422
    condition: "the computed sustainability band is RED"
  - id: ERR_QUOTA_EXCEEDED
    http: 422
    condition: "the landing exceeds the entitlement's remaining pounds without allow_partial_fill, or the ledger is already EXHAUSTED or SUSPENDED"
  - id: ERR_ALLERGY_EXCLUSION
    http: 422
    condition: "the substitute species appears in the member's allergy_exclusions"
  - id: ERR_NEVER_SUBSTITUTE
    http: 422
    condition: "the member has never_substitute set to true"
  - id: ERR_DISLIKE_ALTERNATIVE_AVAILABLE
    http: 422
    condition: "the substitute species appears in the member's dislikes while an acceptable alternative species is still available this season"
  - id: ERR_NO_SUBSTITUTE_AVAILABLE
    http: 422
    condition: "the substitute lot cannot supply the offered pounds from its uncommitted balance"
  - id: ERR_LOT_ON_QUALITY_HOLD
    http: 409
    condition: "a box is handed over while its lot's quality_status is HOLD or DISCARDED"
  - id: ERR_COLD_CHAIN_EVIDENCE_MISSING
    http: 422
    condition: "the custody leg evidence the pipeline requires has not been logged for the lot"
  - id: ERR_COLD_CHAIN_BUDGET_EXCEEDED
    http: 422
    condition: "the requested disposition is outside its cold-chain budget"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the officer dispositioning the hold is the same user who logged a breaching cold-chain leg on that lot"
  - id: ERR_WINDOW_NOT_OPEN
    http: 409
    condition: "the pickup window is not in a status that admits the requested operation"
  - id: ERR_WINDOW_GRACE_EXPIRED
    http: 409
    condition: "the pickup instant is later than closes_at plus grace_minutes"
  - id: ERR_HUB_CAPACITY_EXCEEDED
    http: 409
    condition: "the pickup window has no free cooler slot"
  - id: ERR_MASS_CONSERVATION_VIOLATION
    http: 422
    condition: "a split's destination pounds do not reconcile exactly with the lot's allocation"
  - id: ERR_SKIP_CAP_EXCEEDED
    http: 422
    condition: "the subscription has already filed SKIP_CAP_PER_SEASON non-revoked skips this season"
  - id: ERR_SKIP_WINDOW_CLOSED
    http: 409
    condition: "a skip revoke arrives after the landing-commit cutoff"
  - id: ERR_TRANSFER_NOT_ELIGIBLE
    http: 422
    condition: "the transfer's source or target subscription is in the wrong lifecycle_status, the two belong to the same member, or there is no remaining delivery to transfer"
  - id: ERR_HOLDBACK_NOT_CLEARED
    http: 409
    condition: "a settlement is finalized while its lot's quality_status is still HOLD"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "a scoped uniqueness constraint is violated"

roles:
  - name: CsfAdmin
    description: "runs the CSF: seasons, catalog, subscriptions, allocation, splits, settlement, transfers and recalls"
    identity: opaque
    exclusive_operations:
      - "create and advance seasons"
      - "create share plans, delivery zones, pickup hubs, pickup windows, members, vessels and quota ledgers"
      - "create and activate subscriptions"
      - "run catch allocations and lot splits"
      - "verify landings and create, finalize and pay settlement statements"
      - "raise and remediate recall notices"
      - "propose substitutions"
      - "move vessel compliance status"
      - "set the logical clock"
    shared_operations:
      - "pause, resume, cancel and pay subscriptions, with Member"
      - "create trips, with Vendor"
      - "open and close pickup windows, with HubOperator"
      - "create share transfers, with Member"
      - "record a pickup, with Member and HubOperator"
      - "read seasons, plans, subscriptions, trips, lots, sub-lots, deliveries, events, skips, settlements, transfers and recalls"
  - name: Member
    description: "a CSF shareholder acting on their own subscription and boxes"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "file and revoke skip requests"
      - "accept or reject a substitution offer"
      - "accept or decline a share transfer"
    shared_operations:
      - "pause, resume, cancel and pay their own subscription, with CsfAdmin"
      - "update their own preference profile, with CsfAdmin"
      - "create a share transfer from their own subscription, with CsfAdmin"
      - "collect their own staged box, with CsfAdmin and HubOperator"
      - "read their own subscriptions, deliveries, skips, substitutions and transfers"
  - name: Vendor
    description: "a fishing vessel operator reporting trips and landings"
    identity: "entity_backed:Vessel"
    exclusive_operations:
      - "record a landing against a planned trip"
    shared_operations:
      - "create trips, with CsfAdmin"
      - "read vessels, quota ledgers, trips, lots and settlement statements"
  - name: HubOperator
    description: "hub and route staff moving fish through custody"
    identity: opaque
    exclusive_operations:
      - "record sub-lot arrival"
      - "pack, dispatch, deliver and stage boxes"
    shared_operations:
      - "open and close pickup windows, with CsfAdmin"
      - "log cold-chain legs, with QualityOfficer"
      - "record a pickup, with CsfAdmin and Member"
      - "read members, pickup windows, lots, sub-lots, deliveries and cold-chain events"
  - name: QualityOfficer
    description: "food-safety officer who resolves quality holds; segregation of duties bars the officer who logged a breaching leg from dispositioning that lot"
    identity: opaque
    exclusive_operations:
      - "issue a quality disposition of RELEASE, DISCOUNT or DISCARD"
    shared_operations:
      - "log cold-chain legs, with HubOperator"
      - "read seasons, lots, sub-lots, cold-chain events and recall notices"
