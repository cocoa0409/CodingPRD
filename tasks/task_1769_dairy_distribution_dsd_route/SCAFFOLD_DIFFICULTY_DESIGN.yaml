              as_user_id: "${d1}"
              captures: { sb: $.data.id }
            - { call: "POST /dairy/routes/${r1}/activate", payload: {}, as: TerritoryManager }
            - call: "POST /dairy/products"
              payload: { sku: "BUTTER-4", name: "Butter", units_per_case: 1, shelf_life_days: 60, regulated: false, list_price_cents: 250 }
              as: TerritoryManager
