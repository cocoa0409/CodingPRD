  - name: superseded_revision_cannot_be_revised
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.DesignRevision.terminal_states
    - state_machines.DesignRevision.transitions[APPROVED -> SUPERSEDED]
    - errors[ERR_REVISION_STATE_INVALID]
    distinguishing_aspect: Approving a successor pushes revision A into the terminal SUPERSEDED state; the revise trigger (legal only from CHANGES_REQUESTED) is then permanently refused.
    test_recipe:
      setup:
      - Product FG-EXT-24-IA has revision A APPROVED, then revision B APPROVED with supersedes_revision_id pointing at A, so A is SUPERSEDED.
      - The logical clock is 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemOperator
      - call: POST /ladder-ops/products
        payload:
          model_code: FG-EXT-24-IA
          product_type: EXTENSION_LADDER
          material: FIBERGLASS_PULTRUSION
          duty_rating: TYPE_IA
          working_length_ft: 24.0
          retail_sku: SKU-FG24IA
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          p1: $.data.id
          p1v: $.data.version
      - call: POST /ladder-ops/design-revisions
        payload:
          product_id: ${p1}
          revision_label: A
          joint_type: RIVETED
          structural_margin_pct: 6.5
          rail_section_modulus_in3: 0.25
          expected_product_version: ${p1v}
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          r1: $.data.id
      - call: POST /ladder-ops/design-revisions/${r1}/submit
        payload: {}
        as: DesignEngineer
        as_user_id: eng-1
      - call: POST /ladder-ops/design-revisions/${r1}/review
        payload:
          decision: APPROVE
        as: DesignApprover
        as_user_id: appr-1
      - call: GET /ladder-ops/products/${p1}
        payload: {}
        as: DesignEngineer
        captures:
          p1v2: $.data.version
      - call: POST /ladder-ops/design-revisions
        payload:
          product_id: ${p1}
          revision_label: B
          joint_type: RIVETED
          structural_margin_pct: 7.0
          rail_section_modulus_in3: 0.26
          supersedes_revision_id: ${r1}
          expected_product_version: ${p1v2}
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          r2: $.data.id
      - call: POST /ladder-ops/design-revisions/${r2}/submit
        payload: {}
        as: DesignEngineer
        as_user_id: eng-1
      - call: POST /ladder-ops/design-revisions/${r2}/review
        payload:
          decision: APPROVE
        as: DesignApprover
        as_user_id: appr-1
      trigger:
      - call: POST /ladder-ops/design-revisions/${r1}/revise
        payload:
          structural_margin_pct: 8.0
        as: DesignEngineer
        as_user_id: eng-1
      assert:
      - HTTP status == 409
      - response.data.error_id == ERR_REVISION_STATE_INVALID
      - DesignRevision.${r1}.status == SUPERSEDED
      - DesignRevision.${r1}.superseded_at == 2026-08-01T00:00:00Z
      - DesignRevision.${r1}.structural_margin_pct == 6.50
      - DesignRevision.${r2}.status == APPROVED
