              captures: { eng_b: $.data.id }
            - call: "POST /coopcare/sitting-engagements/${eng_b}/quote"
              as: Dispatcher
            - call: "POST /coopcare/sitting-engagements"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", start_date: "2026-08-04T00:00:00Z", end_date: "2026-08-06T00:00:00Z", daily_window_start: "10:00" }
