            - call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, licensee_id: "${lS}", allocation_cycle_id: "${cB}", product_line_id: "${pl1}", quantity: 6, delivery_mode: FREIGHT_TO_STORE }
              as: LicenseeManager
              as_user_id: "${lS}"
              captures: { oS: $.data.id }
            - call: "POST /api/orders/${oS}/transition"
              payload: { action: SUBMIT }
              as: LicenseeManager
              as_user_id: "${lS}"
              captures: { oS_pre: $.data.allocation_state }
          trigger:
