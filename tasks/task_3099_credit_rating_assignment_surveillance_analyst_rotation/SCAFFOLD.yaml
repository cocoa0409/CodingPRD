    input: []
    output: AppearanceReconciliation
    side_effects: ["reconciliation_status → APPEAL_PENDING"]
  - method: POST
    path: "/rating-agency/appearance-reconciliations/{appearanceReconciliationId}/clear"
    description: "Clear an appearance reconciliation, reopening appeal admissibility"
    roles: [CommitteeChair]
    code: 200
    input: []
    output: AppearanceReconciliation
    side_effects: ["reconciliation_status → CLEARED"]

  # --- Test-driving endpoint (logical clock) ---
  - method: POST
    path: "/rating-agency/_clock/set_current_utc"
    description: "Set the logical clock. The server's startup default is exactly 2026-09-01T00:00:00Z; before any call the logical clock reads that default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["logical clock set; overdue_days recomputed on subsequent reads"]

