            - { call: "POST /par-levels", payload: { unit_id: "${u1}", stock_id: "${s1}", base_par_quantity: 20, cart_cycle: "DAILY" }, as: LinenManager, as_user_id: "lm-1", captures: { p1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r1: $.data.id } }
            - { call: "POST /cart-runs/${r1}/complete", payload: { soiled_lines: [], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1" }
            - { call: "POST /cart-runs/${r1}/reconcile", payload: {}, as: UnitClerk, as_user_id: "${u1}" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T11:00:00Z", scheduled_end: "2026-08-02T12:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r2: $.data.id } }
          trigger:
            - { call: "POST /cart-runs/${r2}/complete", payload: { soiled_lines: [], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1", captures: { rl: $.data.restock_lines, sf: $.data.shortage_flag, st: $.data.status } }
          assert:
            - "restock_lines == [ { stock_id: ${s1}, pieces: 0 } ] (deficit exactly 0)"
            - "shortage_flag == false and status == COMPLETED"
            - "ParLevel.${p1}.on_hand == 20 and LinenStock.${s1}.in_circulation == 80 (unchanged)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: finalize_blocked_by_unreconciled_manifest
        grounds:
          - state_machines.VendorInvoice.PROVISIONAL_to_FINALIZED
          - state_machines.SoiledManifest.RETURNED_to_RECONCILED
        distinguishing_aspect: |
          VendorInvoice -> SoiledManifest pair: finalize is rejected while a
          linked manifest is RETURNED-not-RECONCILED, and succeeds immediately
          after the manifest is reconciled.
        test_recipe:
          setup:
            - "Facility (no cap); unit ICU; stock S1 par 20; manifest m1 (16.00 lbs) RETURNED with 7 pieces, not reconciled; invoice over m1"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /units", payload: { facility_id: "${fac}", name: "ICU", unit_tier: "CRITICAL" }, as: LinenManager, as_user_id: "lm-1", captures: { u1: $.data.id } }
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "SHEET-T", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 50, reorder_point_pieces: 20, opening_pieces: 100, opening_reserve_pieces: 10 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id } }
            - { call: "POST /par-levels", payload: { unit_id: "${u1}", stock_id: "${s1}", base_par_quantity: 20, cart_cycle: "DAILY" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r1: $.data.id } }
            - { call: "POST /cart-runs/${r1}/complete", payload: { soiled_lines: [], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1" }
            - { call: "POST /cart-runs/${r1}/reconcile", payload: {}, as: UnitClerk, as_user_id: "${u1}" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T11:00:00Z", scheduled_end: "2026-08-02T12:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r2: $.data.id } }
            - { call: "POST /cart-runs/${r2}/complete", payload: { soiled_lines: [ { stock_id: "${s1}", pieces: 8 } ], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1" }
            - { call: "POST /cart-runs/${r2}/reconcile", payload: {}, as: UnitClerk, as_user_id: "${u1}" }
            - { call: "POST /soiled-manifests", payload: { facility_id: "${fac}", cart_run_ids: [ "${r2}" ], lines: [ { stock_id: "${s1}", weight_lbs: 16.00, isolation_flag: false } ] }, as: EVSOperator, as_user_id: "evs-1", captures: { m1: $.data.id } }
            - { call: "POST /soiled-manifests/${m1}/return", payload: { returned_lines: [ { stock_id: "${s1}", pieces: 7, condemned_pieces: 0 } ] }, as: LaundryVendor, as_user_id: "ven-1" }
            - { call: "POST /invoices", payload: { facility_id: "${fac}", manifest_ids: [ "${m1}" ], period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-07T00:00:00Z", period_adjusted_patient_days: 50 }, as: LinenManager, as_user_id: "lm-1", captures: { inv: $.data.id } }
          trigger:
            - { call: "POST /invoices/${inv}/finalize", payload: {}, as: LinenManager, as_user_id: "lm-2", captures: { err: $.data.error_id } }
            - { call: "POST /soiled-manifests/${m1}/reconcile", payload: {}, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /invoices/${inv}/finalize", payload: {}, as: LinenManager, as_user_id: "lm-2", captures: { st: $.data.status } }
          assert:
            - "first finalize: error_id == ERR_MANIFEST_NOT_RECONCILED"
            - "after manifest reconcile: finalize succeeds, status == FINALIZED"

      - name: surge_activate_blocked_by_facility_posture
        grounds:
          - state_machines.SurgeEvent.DECLARED_to_ACTIVE
          - entities.Facility.fields.surge_posture
        distinguishing_aspect: |
          SurgeEvent -> Facility pair (different pair from Invoice->Manifest):
          activating a second, non-overlapping surge while the facility is in
          SURGE posture is rejected with ERR_FACILITY_IN_SURGE.
        test_recipe:
          setup:
            - "Facility; surge sg1 [08-01..08-10] DECLARED then ACTIVE"
            - "Surge sg2 [08-11..08-15] DECLARED (windows do not overlap)"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /surge-events", payload: { facility_id: "${fac}", severity: "LEVEL_1", par_multiplier: 1.5, starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-10T00:00:00Z" }, as: LinenManager, as_user_id: "lm-1", captures: { sg1: $.data.id } }
            - { call: "POST /surge-events/${sg1}/activate", payload: {}, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /surge-events", payload: { facility_id: "${fac}", severity: "LEVEL_2", par_multiplier: 2.0, starts_at: "2026-08-11T00:00:00Z", ends_at: "2026-08-15T00:00:00Z" }, as: LinenManager, as_user_id: "lm-1", captures: { sg2: $.data.id } }
          trigger:
            - { call: "POST /surge-events/${sg2}/activate", payload: {}, as: LinenManager, as_user_id: "lm-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FACILITY_IN_SURGE"
            - "SurgeEvent.${sg2}.status == DECLARED (unchanged)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: cart_run_buffer_gap_conflict
        grounds:
          - validations[priority=9]
          - errors[ERR_RUN_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Unit resource, half-open windows with a mandatory 120-minute buffer:
          a run starting 90 minutes after the previous window's end conflicts,
          while exactly 120 minutes is accepted (gap >= 120).
        test_recipe:
          setup:
            - "Facility; unit ICU with one par level; run r1 SCHEDULED 08:00-09:00"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /units", payload: { facility_id: "${fac}", name: "ICU", unit_tier: "CRITICAL" }, as: LinenManager, as_user_id: "lm-1", captures: { u1: $.data.id } }
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "SHEET-T", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 50, reorder_point_pieces: 20, opening_pieces: 100, opening_reserve_pieces: 10 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id } }
            - { call: "POST /par-levels", payload: { unit_id: "${u1}", stock_id: "${s1}", base_par_quantity: 20, cart_cycle: "TWICE_DAILY" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T10:30:00Z", scheduled_end: "2026-08-02T11:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { err: $.data.error_id } }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T11:00:00Z", scheduled_end: "2026-08-02T12:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r3: $.data.id } }
          assert:
            - "10:30 start: error_id == ERR_RUN_WINDOW_CONFLICT (gap 90 min < 120)"
            - "11:00 start: 201 created (gap exactly 120 min is allowed)"

      - name: surge_closed_interval_adjacency_conflict
        grounds:
          - validations[priority=9]
          - errors[ERR_SURGE_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Facility resource, CLOSED interval semantics (different geometry from
          the cart-run buffer rule): a surge whose starts_at equals another
          surge's ends_at still conflicts, because shared endpoints overlap.
        test_recipe:
          setup:
            - "Facility; surge sg1 DECLARED with window [2026-08-01, 2026-08-10]"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /surge-events", payload: { facility_id: "${fac}", severity: "LEVEL_1", par_multiplier: 1.5, starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-10T00:00:00Z" }, as: LinenManager, as_user_id: "lm-1", captures: { sg1: $.data.id } }
          trigger:
            - { call: "POST /surge-events", payload: { facility_id: "${fac}", severity: "LEVEL_2", par_multiplier: 2.0, starts_at: "2026-08-10T00:00:00Z", ends_at: "2026-08-15T00:00:00Z" }, as: LinenManager, as_user_id: "lm-1", captures: { err: $.data.error_id } }
            - { call: "POST /surge-events", payload: { facility_id: "${fac}", severity: "LEVEL_2", par_multiplier: 2.0, starts_at: "2026-08-11T00:00:00Z", ends_at: "2026-08-15T00:00:00Z" }, as: LinenManager, as_user_id: "lm-1", captures: { sg3: $.data.id } }
          assert:
            - "starts_at == sg1.ends_at: error_id == ERR_SURGE_WINDOW_CONFLICT (closed intervals share the endpoint)"
            - "starts_at 2026-08-11: 201 created"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: stock_adjustment_pair_conserves_total_pieces
        grounds:
          - concurrency_rules[stock_adjustment_stale]
          - endpoints[POST /linen-stocks/{stockId}/adjustments]
          - entities.LinenStock.fields.in_circulation
        distinguishing_aspect: |
          Conserved quantity = total accounted pieces: a +5 adjustment followed
          by its -5 compensation leaves in_circulation and the global piece
          identity (in_circulation + in_wash + reserve + Σ on_hand + retired +
          lost == opening_pieces + Σ deltas) unchanged at 110.
        test_recipe:
          setup:
            - "Facility; stock S1 opening 100, reserve 10 (total 110), version observed"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "SHEET-T", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 50, reorder_point_pieces: 20, opening_pieces: 100, opening_reserve_pieces: 10 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "POST /linen-stocks/${s1}/adjustments", payload: { delta_pieces: 5, reason: "FOUND", expected_linen_stock_version: "${v1}" }, as: LinenManager, as_user_id: "lm-1", captures: { v2: $.data.version, c1: $.data.in_circulation } }
            - { call: "POST /linen-stocks/${s1}/adjustments", payload: { delta_pieces: -5, reason: "WRITE_OFF_CORRECTION", expected_linen_stock_version: "${v2}" }, as: LinenManager, as_user_id: "lm-1", captures: { v3: $.data.version, c2: $.data.in_circulation } }
          assert:
            - "after +5: in_circulation == 105, version == 2"
            - "after -5: in_circulation == 100, version == 3"
            - "total accounted pieces == 110 before and after the pair"

      - name: complaint_verify_rescind_restores_billed_total
        grounds:
          - state_machines.Complaint.OPEN_to_VERIFIED
          - state_machines.Complaint.VERIFIED_to_RESCINDED
          - calculations.complaint_credit
        distinguishing_aspect: |
          Conserved quantity = invoice billed cents (different quantity from
          pieces): verify then rescind leaves billed_total_cents == 810 and
          credit_total_cents == 0 exactly — no drift from the round trip.
        test_recipe:
          setup:
            - "Facility; unit ICU; stock S1 par 20; manifest m1 (16.00 lbs, returned 7) reconciled; invoice over m1 FINALIZED (final 810, billed 810)"
            - "Complaint c1 (STAINS, 2 pieces) on m1"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /units", payload: { facility_id: "${fac}", name: "ICU", unit_tier: "CRITICAL" }, as: LinenManager, as_user_id: "lm-1", captures: { u1: $.data.id } }
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "SHEET-T", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 50, reorder_point_pieces: 20, opening_pieces: 100, opening_reserve_pieces: 10 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id } }
            - { call: "POST /par-levels", payload: { unit_id: "${u1}", stock_id: "${s1}", base_par_quantity: 20, cart_cycle: "DAILY" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r1: $.data.id } }
            - { call: "POST /cart-runs/${r1}/complete", payload: { soiled_lines: [], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1" }
            - { call: "POST /cart-runs/${r1}/reconcile", payload: {}, as: UnitClerk, as_user_id: "${u1}" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T11:00:00Z", scheduled_end: "2026-08-02T12:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r2: $.data.id } }
            - { call: "POST /cart-runs/${r2}/complete", payload: { soiled_lines: [ { stock_id: "${s1}", pieces: 8 } ], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1" }
            - { call: "POST /cart-runs/${r2}/reconcile", payload: {}, as: UnitClerk, as_user_id: "${u1}" }
            - { call: "POST /soiled-manifests", payload: { facility_id: "${fac}", cart_run_ids: [ "${r2}" ], lines: [ { stock_id: "${s1}", weight_lbs: 16.00, isolation_flag: false } ] }, as: EVSOperator, as_user_id: "evs-1", captures: { m1: $.data.id } }
            - { call: "POST /soiled-manifests/${m1}/return", payload: { returned_lines: [ { stock_id: "${s1}", pieces: 7, condemned_pieces: 0 } ] }, as: LaundryVendor, as_user_id: "ven-1" }
            - { call: "POST /soiled-manifests/${m1}/reconcile", payload: {}, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /invoices", payload: { facility_id: "${fac}", manifest_ids: [ "${m1}" ], period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-07T00:00:00Z", period_adjusted_patient_days: 50 }, as: LinenManager, as_user_id: "lm-1", captures: { inv: $.data.id } }
            - { call: "POST /invoices/${inv}/finalize", payload: {}, as: LinenManager, as_user_id: "lm-2" }
            - { call: "POST /complaints", payload: { unit_id: "${u1}", manifest_id: "${m1}", stock_id: "${s1}", complaint_type: "STAINS", pieces_affected: 2 }, as: UnitClerk, as_user_id: "${u1}", captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /complaints/${c1}/verify", payload: {}, as: LinenManager, as_user_id: "lm-1", captures: { credit: $.data.credit_cents } }
            - { call: "GET /invoices/${inv}", payload: {}, as: LinenManager, as_user_id: "lm-1", captures: { billed_mid: $.data.billed_total_cents, cred_mid: $.data.credit_total_cents } }
            - { call: "POST /complaints/${c1}/rescind", payload: {}, as: LinenManager, as_user_id: "lm-1" }
            - { call: "GET /invoices/${inv}", payload: {}, as: LinenManager, as_user_id: "lm-1", captures: { billed_end: $.data.billed_total_cents, cred_end: $.data.credit_total_cents } }
          assert:
            - "after verify: credit_cents == 160, invoice credit_total_cents == 160, billed_total_cents == 650"
            - "after rescind: credit_total_cents == 0, billed_total_cents == 810 (exact restoration)"
            - "Complaint.${c1}.status == RESCINDED"
