            - call: "POST /customers"
              payload: { account_number: "ACC-A3", circuit_id: "${alpha_id}", customer_class: "RESIDENTIAL", medical_baseline: false, preferred_language: "ZH", notification_channels: ["SMS"], accessibility_needs: ["AUDIO", "TTY"], address_zone_code: "Z2" }
              as: GridPlanner
            - call: "POST /customers"
              payload: { account_number: "ACC-B1", circuit_id: "${bravo_id}", customer_class: "RESIDENTIAL", medical_baseline: false, preferred_language: "EN", notification_channels: ["SMS"], accessibility_needs: [], address_zone_code: "Z3" }
              as: GridPlanner
            - call: "POST /customers"
              payload: { account_number: "ACC-C1", circuit_id: "${charlie_id}", customer_class: "RESIDENTIAL", medical_baseline: false, preferred_language: "EN", notification_channels: ["EMAIL"], accessibility_needs: [], address_zone_code: "Z4" }
              as: GridPlanner
            - call: "POST /psps-events"
              payload: { event_code: "EV-1", trigger_fire_potential_index_id: "${fpi_fc_id}", forecast_onset_at: "2026-08-15T18:00:00Z", forecast_all_clear_at: "2026-08-16T18:00:00Z" }
              as: PSPSDutyOfficer
              captures: { ev1_id: $.data.id, ev1_v0: $.data.version }
            - call: "POST /psps-events/${ev1_id}/scope"
              payload: { expected_psps_event_version: "${ev1_v0}" }
              as: PSPSDutyOfficer
            - call: "POST /notification-batches"
              payload: { psps_event_id: "${ev1_id}", stage: "ADVANCE_48H", scheduled_send_at: "2026-08-13T18:00:00Z" }
              as: CommunityLiaison
              captures: { batch_adv_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T18:00:00Z" }
              as: PSPSDutyOfficer
            - call: "POST /notification-batches/${batch_adv_id}/dispatch"
              payload: {}
              as: CommunityLiaison
          trigger:
            - call: "POST /psps-events/${ev1_id}/arm"
              payload: {}
              as: PSPSDutyOfficer
            - call: "POST /psps-events/${ev1_id}/cancel"
              payload: { cancellation_reason: "offshore wind event dissipated" }
              as: PSPSDutyOfficer
          assert:
            - "Before the arm, GET /circuits?energization_state=ENERGIZED returns 3 rows whose customer_count values sum to exactly 5"
            - "After the arm, GET /circuits?energization_state=ENERGIZED returns total_count 0, and GET /circuits?energization_state=DE_ENERGIZATION_PENDING returns 3 rows summing to 5"
            - "After the cancel, GET /circuits?energization_state=ENERGIZED again returns 3 rows whose customer_count values sum to exactly 5 — the pre-arm value with zero drift"
            - "Circuit.${alpha_id}.customer_count == 3, Circuit.${bravo_id}.customer_count == 1, Circuit.${charlie_id}.customer_count == 1"
            - "Circuit.${alpha_id}.risk_posture == EXTREME (left LOCKED by the compensation)"
            - "PSPSEvent.${ev1_id}.scope_status == CANCELLED with cancellation_reason 'offshore wind event dissipated'"
            - "PSPSEvent.${ev1_id}.confirmed_scope_count == 0 and excluded_scope_count == 3"
            - "GET /psps-events/${ev1_id}/scopes still returns 3 rows, each with scope_status EXCLUDED and exclusion_justification 'EVENT_CANCELLED'"
            - "PSPSEvent.${ev1_id}.actual_de_energized_at == null"

      - name: record_completion_then_withdraw_conserves_hardened_mileage_ledger
        grounds:
          - calculations.hardened_mileage_ledger
          - calculations.circuit_hardened_fraction
          - state_machines.MitigationProject.COMPLETED_to_WITHDRAWN
          - entities.Circuit.fields.covered_conductor_miles
          - concurrency_rules[mitigation-completion-stale-circuit]
        distinguishing_aspect: |
          A different conserved quantity from the customer-count invariant: HARDENED MILEAGE. Recording
          4.0 covered-conductor miles moves Circuit.covered_conductor_miles from 0.0 to 4.0 and
          hardened_fraction from 0.0000 to 0.3429; the WITHDRAW decision reverses exactly those 4.0 miles,
          returning both fields to 0.0 / 0.0000 and re-establishing the identity
          per_circuit_ledger == project_side with no residue in completed_miles.
        test_recipe:
          setup:
            - "Circuit ALPHA is TIER_3 with overhead_miles 7.0, covered_conductor_miles 0.0, underground_miles 0.0 and hardened_fraction 0.0000."
            - "Project MP-CC-1 (COVERED_CONDUCTOR, 4.0 miles, plan_year 2026) has been submitted and approved by reviewer_1."
          setup_api_calls:
            - call: "POST /circuits"
              payload: { circuit_code: "ALPHA", district_code: "D-NORTH", hftd_tier: "TIER_3", overhead_miles: 7.0, equipment_condition_index: 55, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", fast_trip_enabled: false }
              as: GridPlanner
              captures: { alpha_id: $.data.id }
            - call: "POST /mitigation-projects"
              payload: { project_code: "MP-CC-1", circuit_id: "${alpha_id}", program_type: "COVERED_CONDUCTOR", plan_year: 2026, planned_miles: 4.0, unit_cost_per_mile_cents: 1250000 }
              as: GridPlanner
              captures: { mp_cc_id: $.data.id }
            - call: "POST /mitigation-projects/${mp_cc_id}/submit"
              payload: {}
              as: GridPlanner
            - call: "POST /mitigation-projects/${mp_cc_id}/review"
              payload: { decision: "APPROVE", review_note: "approved" }
              as: RegulatoryReviewer
              as_user_id: "reviewer_1"
            - call: "GET /circuits/${alpha_id}"
              payload: {}
              as: AssetInspector
              captures: { alpha_v_pre: $.data.version }
          trigger:
            - call: "POST /mitigation-projects/${mp_cc_id}/record-completion"
              payload: { completed_miles_delta: 4.0, completion_date: "2026-07-20T00:00:00Z", expected_circuit_version: "${alpha_v_pre}" }
              as: AssetInspector
            - call: "POST /mitigation-projects/${mp_cc_id}/review"
              payload: { decision: "WITHDRAW", review_note: "route abandoned after permitting denial" }
              as: RegulatoryReviewer
              as_user_id: "reviewer_2"
          assert:
            - "After the record-completion: MitigationProject.${mp_cc_id}.status == COMPLETED with completed_miles == 4.0"
            - "After the record-completion: Circuit.${alpha_id}.covered_conductor_miles == 4.0 and hardened_fraction == 0.3429"
            - "After the WITHDRAW: MitigationProject.${mp_cc_id}.status == WITHDRAWN with completed_miles == 0.0"
            - "After the WITHDRAW: Circuit.${alpha_id}.covered_conductor_miles == 0.0, underground_miles == 0.0 and hardened_fraction == 0.0000 — exactly the pre-completion values"
            - "After the WITHDRAW: Circuit.${alpha_id}.risk_posture == NORMAL (no FORECAST index exists for ALPHA in this fixture)"
            - "MitigationProject.${mp_cc_id}.planned_miles == 4.0 and budget_cents == 5000000 (the compensation reverses executed mileage, not the plan of record)"
            - "GET /circuits/${alpha_id}/mitigation-projects returns the single WITHDRAWN row, so the sum of completed_miles over mileage-bearing projects in {IN_EXECUTION, SUSPENDED, COMPLETED} is 0.0 and matches the circuit ledger"
