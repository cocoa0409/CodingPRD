              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${case_id}/begin_investigation"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${case_id}/set_bar_date"
              payload: { bar_date: "2026-06-01T00:00:00Z" }
              as: Clerk
            - call: "POST /trustee/cases/${case_id}/avoidance_actions"
              payload: { transferee_creditor_id: "${cred_k}", transfer_date: "2025-10-17T00:00:00Z", transfer_amount_cents: 100000, action_type: "PREFERENCE_547", demand_amount_cents: 100000 }
              as: Trustee
              as_user_id: "trust-0001"
              captures: { act_edge: $.data.id, edge_avoidable: $.data.avoidable }
            - call: "POST /trustee/cases/${case_id}/avoidance_actions"
              payload: { transferee_creditor_id: "${cred_k}", transfer_date: "2025-10-16T00:00:00Z", transfer_amount_cents: 100000, action_type: "PREFERENCE_547", demand_amount_cents: 100000 }
              as: Trustee
              as_user_id: "trust-0001"
