      - name: program_slot_buffered_overlap_rejected
        grounds:
          - validations[priority=10]
          - state_machines.ControllerProgram.DRAFT_to_ACTIVE
          - entities.ControllerProgram.fields.slots
        distinguishing_aspect: |
          ControllerProgram resource, buffered interval semantics (different from route's plain
          half-open): two slots must be separated by VALVE_SWITCH_BUFFER_SEC; slot B starting at
          slot A's exact end (no buffer gap) is rejected (ERR_PROGRAM_SLOT_OVERLAP) even though it
          would be allowed under plain adjacency.
        test_recipe:
          setup:
            - "A system in season_state=ACTIVE with two MAPPED zones; a DRAFT program whose two slots are exactly adjacent (zone1 [21600,22800), zone2 [22800,24000)) — gap=0 < buffer."
          setup_api_calls:
