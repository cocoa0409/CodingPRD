# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3417_long_lifecycle_analog_supply_direct_sales_inventory
# Depth probe: 9 Difficulty Rules x 2 instances, grounded in SCAFFOLD.yaml.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: buffer_target_trailing_vs_forward_pipeline
        grounds:
          - calculations.calc_buffer_position
          - entities.Part.fields.posture
          - endpoints.GET_/parts/{id}/inventory-position
        distinguishing_aspect: |
          Part-domain dual variant: identical Part fields yield target_trailing_units
          (planner demand only) != target_forward_units (demand + weighted ACTIVE
          design-win pipeline); posture is driven by the trailing variant alone.
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z."
            - "Part demand_rate 40/wk, buffer_multiple 1.5 -> trailing target ceil(40*1.5*26) = 1560."
            - "One ACTIVE design win with annual_volume_units 5200 on the part -> pipeline 100/wk, weighted 0.5 -> 50; forward target ceil(90*1.5*26) = 3510."
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "OPA2376AIDGKR", description: "Precision op amp", package_family: "VSSOP", process_technology: "CMOS_180NM", demand_rate_units_per_week: 40, buffer_multiple: 1.5 }
              as: SupplyPlanner
              captures: { dvp_part_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "AutoMotive Controls GmbH", tier: "STRATEGIC", channel: "DIRECT_FIELD", credit_limit_cents: 10000000 }
              as: ChannelManager
              captures: { dvp_cust_id: $.data.id }
            - call: "POST /reference-designs"
              payload: { title: "1kW motor drive reference", featured_part_number: "OPA2376AIDGKR" }
              as: FieldEngineer
              captures: { dvp_rd_id: $.data.id }
            - call: "POST /reference-designs/${dvp_rd_id}/publish"
              payload: {}
              as: FieldEngineer
            - call: "POST /design-wins"
              payload: { reference_design_id: "${dvp_rd_id}", customer_id: "${dvp_cust_id}", part_id: "${dvp_part_id}", expected_lifetime_revenue_cents: 1000000, annual_volume_units: 5200, start_date: "2027-01-01T00:00:00Z" }
              as: FieldEngineer
              captures: { dvp_dw_id: $.data.id }
            - call: "POST /design-wins/${dvp_dw_id}/activate"
              payload: {}
              as: FieldEngineer
          trigger:
            - call: "GET /parts/${dvp_part_id}/inventory-position"
              payload: {}
              as: SupplyPlanner
              captures: { dvp_trail: $.data.target_trailing_units, dvp_fwd: $.data.target_forward_units, dvp_posture: $.data.posture }
          assert:
            - "target_trailing_units == 1560 (ceil(40 * 1.5 * 26))"
            - "target_forward_units == 3510 (ceil((40 + (5200/52)*0.5) * 1.5 * 26))"
            - "target_trailing_units != target_forward_units — same part fields, two valid demand definitions"
            - "posture == SHORTAGE (coverage_trailing = 0/1560 = 0 < 0.75); the forward pipeline never feeds posture"

      - name: design_win_tail_ramped_vs_flat_recognition
        grounds:
          - calculations.calc_revenue_tail
          - entities.DesignWin.fields.recognized_revenue_cents
        distinguishing_aspect: |
          DesignWin-domain dual variant (different entity domain than the Part
          buffer variant): identical inputs recognize 200000 cents under the
          RAMPED profile vs 250000 under FLAT at the same clock, and the
          canonical field selects ramped for automotive parts, flat otherwise.
        test_recipe:
          setup:
            - "Two parts: automotive-grade and industrial (non-automotive)."
            - "One ACTIVE design win per part, each expected_lifetime_revenue_cents 1000000, start_date 2027-01-01T00:00:00Z."
            - "Logical clock advanced to 2028-06-01T00:00:00Z -> exactly 1 full anniversary elapsed (2028-01-01), second anniversary (2029-01-01) not yet reached."
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "TPS7A4700RGWR-A", description: "Auto LDO", package_family: "VQFN", process_technology: "ANALOG_BIPOLAR", automotive_grade: true }
              as: SupplyPlanner
              captures: { dvt_part_a: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "TPS7A4700RGWR-I", description: "Industrial LDO", package_family: "VQFN", process_technology: "ANALOG_BIPOLAR", automotive_grade: false }
              as: SupplyPlanner
              captures: { dvt_part_i: $.data.id }
            - call: "POST /customers"
              payload: { name: "Powertrain Systems Inc", tier: "KEY", channel: "DIRECT_FIELD", credit_limit_cents: 10000000 }
              as: ChannelManager
              captures: { dvt_cust: $.data.id }
            - call: "POST /reference-designs"
              payload: { title: "ADAS power tree", featured_part_number: "TPS7A4700RGWR-A" }
              as: FieldEngineer
              captures: { dvt_rd_a: $.data.id }
            - call: "POST /reference-designs/${dvt_rd_a}/publish"
              payload: {}
              as: FieldEngineer
            - call: "POST /reference-designs"
              payload: { title: "Factory IO supply", featured_part_number: "TPS7A4700RGWR-I" }
              as: FieldEngineer
              captures: { dvt_rd_i: $.data.id }
            - call: "POST /reference-designs/${dvt_rd_i}/publish"
              payload: {}
              as: FieldEngineer
            - call: "POST /design-wins"
              payload: { reference_design_id: "${dvt_rd_a}", customer_id: "${dvt_cust}", part_id: "${dvt_part_a}", expected_lifetime_revenue_cents: 1000000, annual_volume_units: 5200, start_date: "2027-01-01T00:00:00Z" }
              as: FieldEngineer
              captures: { dvt_dw_a: $.data.id }
            - call: "POST /design-wins/${dvt_dw_a}/activate"
              payload: {}
              as: FieldEngineer
            - call: "POST /design-wins"
              payload: { reference_design_id: "${dvt_rd_i}", customer_id: "${dvt_cust}", part_id: "${dvt_part_i}", expected_lifetime_revenue_cents: 1000000, annual_volume_units: 5200, start_date: "2027-01-01T00:00:00Z" }
              as: FieldEngineer
              captures: { dvt_dw_i: $.data.id }
            - call: "POST /design-wins/${dvt_dw_i}/activate"
              payload: {}
              as: FieldEngineer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /design-wins/${dvt_dw_a}"
              payload: {}
              as: FieldEngineer
              captures: { dvt_ra: $.data.recognized_ramped_cents, dvt_fa: $.data.recognized_flat_cents, dvt_ca: $.data.recognized_revenue_cents }
            - call: "GET /design-wins/${dvt_dw_i}"
              payload: {}
              as: FieldEngineer
              captures: { dvt_ri: $.data.recognized_ramped_cents, dvt_fi: $.data.recognized_flat_cents, dvt_ci: $.data.recognized_revenue_cents }
          assert:
            - "automotive win: recognized_ramped_cents == 200000 and recognized_flat_cents == 250000 at the same clock"
            - "automotive win canonical recognized_revenue_cents == 200000 (ramped selected because part.automotive_grade == true)"
            - "industrial win canonical recognized_revenue_cents == 250000 (flat selected)"
            - "recognized_ramped_cents != recognized_flat_cents on both wins — 50000-cent divergence on identical inputs"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: allocation_waterfall_nested_min_priority
        grounds:
          - calculations.calc_allocation_awards
          - calculations.calc_priority_score
          - endpoints.POST_/allocation-runs
        distinguishing_aspect: |
          Mode (a) combinatorial: a waterfall with >= 3 inputs (per-line remaining,
          per-part available units, priority_score) interacting through nested
          min() and a multi-key ordering — distinct from the per-line rounding
          mode (b) instance in this same rule.
        test_recipe:
          setup:
            - "Part LM317T demand 40/wk, buffer 1.5 -> trailing target 1560; on_hand 100 -> coverage 0.0641 -> SHORTAGE."
            - "Customers: A STRATEGIC with an ACTIVE design win on the part (score 100+25=125), B KEY (70), C STANDARD (40); all DIRECT_FIELD, credit 10000000, no discount."
            - "Orders A qty 80, B qty 50, C qty 30, all submitted -> all BACKORDERED (SHORTAGE part: no auto-award)."
            - "Available for the run: on_hand - reserved = 100 - 0 = 100."
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "LM317T", description: "Adj voltage regulator", package_family: "TO220", process_technology: "ANALOG_BIPOLAR", demand_rate_units_per_week: 40, buffer_multiple: 1.5 }
              as: SupplyPlanner
              captures: { wa_part: $.data.id }
            - call: "POST /capacity-pools"
              payload: { site_name: "DFAB", process_technology: "ANALOG_BIPOLAR", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-01T00:00:00Z", total_units: 500 }
              as: SupplyPlanner
              captures: { wa_pool: $.data.id }
            - call: "POST /parts/${wa_part}/receipts"
              payload: { capacity_pool_id: "${wa_pool}", units: 100 }
              as: SupplyPlanner
              captures: { wa_part_v: $.data.version }
            - call: "POST /pricing-schedules"
              payload: { part_id: "${wa_part}", effective_from: "2026-08-01T00:00:00Z", tiers: [{ min_qty: 1, unit_price_cents: 100 }], expected_part_version: "${wa_part_v}" }
              as: ChannelManager
            - call: "POST /customers"
              payload: { name: "Strategic Motors", tier: "STRATEGIC", channel: "DIRECT_FIELD", credit_limit_cents: 10000000 }
              as: ChannelManager
              captures: { wa_cust_a: $.data.id }
            - call: "POST /customers"
              payload: { name: "Key Controls", tier: "KEY", channel: "DIRECT_FIELD", credit_limit_cents: 10000000 }
              as: ChannelManager
              captures: { wa_cust_b: $.data.id }
            - call: "POST /customers"
              payload: { name: "Standard Devices", tier: "STANDARD", channel: "DIRECT_FIELD", credit_limit_cents: 10000000 }
              as: ChannelManager
              captures: { wa_cust_c: $.data.id }
            - call: "POST /reference-designs"
              payload: { title: "Rail PSU reference", featured_part_number: "LM317T" }
              as: FieldEngineer
              captures: { wa_rd: $.data.id }
            - call: "POST /reference-designs/${wa_rd}/publish"
              payload: {}
              as: FieldEngineer
            - call: "POST /design-wins"
              payload: { reference_design_id: "${wa_rd}", customer_id: "${wa_cust_a}", part_id: "${wa_part}", expected_lifetime_revenue_cents: 1000000, annual_volume_units: 5200, start_date: "2027-01-01T00:00:00Z" }
              as: FieldEngineer
              captures: { wa_dw: $.data.id }
            - call: "POST /design-wins/${wa_dw}/activate"
              payload: {}
              as: FieldEngineer
            - call: "POST /orders"
              payload: { customer_id: "${wa_cust_a}", lines: [{ part_id: "${wa_part}", quantity: 80 }] }
              as: Customer
              as_user_id: "${wa_cust_a}"
              captures: { wa_ord_a: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${wa_cust_b}", lines: [{ part_id: "${wa_part}", quantity: 50 }] }
              as: Customer
              as_user_id: "${wa_cust_b}"
              captures: { wa_ord_b: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${wa_cust_c}", lines: [{ part_id: "${wa_part}", quantity: 30 }] }
              as: Customer
              as_user_id: "${wa_cust_c}"
              captures: { wa_ord_c: $.data.id }
            - call: "POST /orders/${wa_ord_a}/submit"
              payload: {}
              as: Customer
              as_user_id: "${wa_cust_a}"
            - call: "POST /orders/${wa_ord_b}/submit"
              payload: {}
              as: Customer
              as_user_id: "${wa_cust_b}"
            - call: "POST /orders/${wa_ord_c}/submit"
              payload: {}
              as: Customer
              as_user_id: "${wa_cust_c}"
            - call: "GET /order-lines"
              payload: { order_id: "${wa_ord_a}" }
              as: SupplyPlanner
              captures: { wa_line_a: "$.data[0].id" }
            - call: "GET /order-lines"
              payload: { order_id: "${wa_ord_b}" }
              as: SupplyPlanner
              captures: { wa_line_b: "$.data[0].id" }
            - call: "GET /order-lines"
              payload: { order_id: "${wa_ord_c}" }
              as: SupplyPlanner
              captures: { wa_line_c: "$.data[0].id" }
            - call: "POST /allocation-runs"
              payload: { period_label: "2026-W40" }
              as: SupplyPlanner
              captures: { wa_run: $.data.id }
          trigger:
            - call: "POST /allocation-runs/${wa_run}/publish"
              payload: {}
              as: SupplyPlanner
          assert:
            - "GET /order-lines/${wa_line_a}: awarded_units == 80, allocation_rank == 1, allocation_priority_score == 125 (STRATEGIC 100 + design-win bonus 25)"
            - "GET /order-lines/${wa_line_b}: awarded_units == 20, allocation_rank == 2, allocation_priority_score == 70 (min(50, remaining 20) — nested min binds)"
            - "GET /order-lines/${wa_line_c}: awarded_units == 0, allocation_rank == 3, allocation_priority_score == 40 (zero-award entry is still recorded)"
            - "GET /orders/${wa_ord_a}: status == ALLOCATED (fully covered 80/80)"
            - "GET /orders/${wa_ord_b} and /orders/${wa_ord_c}: status == BACKORDERED"
            - "GET /parts/${wa_part}: reserved_units == 100 and on_hand_units == 100"

      - name: order_totals_per_line_rounding_beats_sum_rounding
        grounds:
          - calculations.calc_order_totals
          - entities.OrderLine.fields.line_total_cents
          - endpoints.POST_/orders/{id}/submit
        distinguishing_aspect: |
          Mode (b) combinatorial: nested rounding where order matters — the
          scaffold pins round-per-line-then-sum; sum-then-round yields 10395
          while the conformant per-line order yields 10396 on this fixture.
        test_recipe:
          setup:
            - "Part TL431ACDR, demand_rate 0 (target 0 -> posture NORMAL), on_hand 100."
            - "Published schedule: single tier {min_qty 1, unit_price_cents 175}."
            - "Customer KEY, DIRECT_FIELD, discount_pct 0.10, credit 10000000."
            - "Order with two lines, each 33 units of the same part: raw 175*33 = 5775, discounted 5775*0.9 = 5197.5 -> round_half_up 5198 per line."
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "TL431ACDR", description: "Shunt reference", package_family: "SOIC", process_technology: "ANALOG_BIPOLAR" }
              as: SupplyPlanner
              captures: { rn_part: $.data.id }
            - call: "POST /capacity-pools"
              payload: { site_name: "DFAB", process_technology: "ANALOG_BIPOLAR", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-01T00:00:00Z", total_units: 500 }
              as: SupplyPlanner
              captures: { rn_pool: $.data.id }
            - call: "POST /parts/${rn_part}/receipts"
              payload: { capacity_pool_id: "${rn_pool}", units: 100 }
              as: SupplyPlanner
              captures: { rn_part_v: $.data.version }
            - call: "POST /pricing-schedules"
              payload: { part_id: "${rn_part}", effective_from: "2026-08-01T00:00:00Z", tiers: [{ min_qty: 1, unit_price_cents: 175 }], expected_part_version: "${rn_part_v}" }
              as: ChannelManager
            - call: "POST /customers"
              payload: { name: "Key Instrumentation", tier: "KEY", channel: "DIRECT_FIELD", credit_limit_cents: 10000000, discount_pct: 0.10 }
              as: ChannelManager
              captures: { rn_cust: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${rn_cust}", lines: [{ part_id: "${rn_part}", quantity: 33 }, { part_id: "${rn_part}", quantity: 33 }] }
              as: Customer
              as_user_id: "${rn_cust}"
              captures: { rn_ord: $.data.id }
          trigger:
            - call: "POST /orders/${rn_ord}/submit"
              payload: {}
              as: Customer
              as_user_id: "${rn_cust}"
              captures: { rn_status: $.data.status, rn_sub: $.data.subtotal_cents, rn_fee: $.data.service_fee_cents, rn_tot: $.data.total_cents }
          assert:
            - "status == ALLOCATED (posture NORMAL, available 100 >= 66)"
            - "each line: GET /order-lines?order_id=${rn_ord} shows line_total_cents == 5198 on both lines (round_half_up(5197.5) per line)"
            - "subtotal_cents == 10396 — NOT 10395 (the sum-then-round result); per-line rounding is the pinned order"
            - "service_fee_cents == 0 (tier KEY, channel DIRECT_FIELD)"
            - "total_cents == 10396"
            - "Part reserved_units == 66 after submit"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: part_lifecycle_eol_rescind_cycle
        grounds:
          - state_machines.Part.EOL_ANNOUNCED_to_ACTIVE
          - state_machines.EolNotice.ANNOUNCED_to_RESCINDED
        distinguishing_aspect: |
          Cyclic machine on Part: ACTIVE -> EOL_ANNOUNCED -> ACTIVE via notice
          rescission (a true loop, not a pipeline); the loop's side effects
          (design-win at_risk) must also unwind.
        test_recipe:
          setup:
            - "Part REF5025IDR ACTIVE with one ACTIVE design win (at_risk false, customer at_risk count 0)."
            - "EOL notice issued 2026-09-01 (last_order 2027-02-28, last_ship 2027-05-29) -> part EOL_ANNOUNCED, win at_risk true."
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "REF5025IDR", description: "Voltage reference", package_family: "SOIC", process_technology: "CMOS_180NM" }
              as: SupplyPlanner
              captures: { cy_part: $.data.id }
            - call: "POST /customers"
              payload: { name: "Med Devices", tier: "KEY", channel: "DIRECT_FIELD", credit_limit_cents: 10000000 }
              as: ChannelManager
              captures: { cy_cust: $.data.id }
            - call: "POST /reference-designs"
              payload: { title: "Patient monitor AFE", featured_part_number: "REF5025IDR" }
              as: FieldEngineer
              captures: { cy_rd: $.data.id }
            - call: "POST /reference-designs/${cy_rd}/publish"
              payload: {}
              as: FieldEngineer
            - call: "POST /design-wins"
              payload: { reference_design_id: "${cy_rd}", customer_id: "${cy_cust}", part_id: "${cy_part}", expected_lifetime_revenue_cents: 1000000, annual_volume_units: 5200, start_date: "2027-01-01T00:00:00Z" }
              as: FieldEngineer
              captures: { cy_dw: $.data.id }
            - call: "POST /design-wins/${cy_dw}/activate"
              payload: {}
              as: FieldEngineer
            - call: "POST /parts/${cy_part}/eol-notices"
              payload: { notice_date: "2026-09-01T00:00:00Z", last_order_date: "2027-02-28T00:00:00Z", last_ship_date: "2027-05-29T00:00:00Z", reason: "Fab closure" }
              as: SupplyPlanner
              captures: { cy_notice: $.data.id }
            - call: "GET /parts/${cy_part}"
              payload: {}
              as: SupplyPlanner
              captures: { cy_mid_status: $.data.lifecycle_status }
          trigger:
            - call: "POST /eol-notices/${cy_notice}/rescind"
              payload: {}
              as: SupplyPlanner
              captures: { cy_notice_status: $.data.status }
          assert:
            - "the pre-rescind read showed lifecycle_status == EOL_ANNOUNCED (the cycle genuinely entered the EOL state)"
            - "trigger response notice status == RESCINDED"
            - "GET /parts/${cy_part}: lifecycle_status == ACTIVE — the machine looped back to its initial state"
            - "GET /design-wins/${cy_dw}: at_risk == false (cascade unwound)"
            - "GET /customers/${cy_cust}: at_risk_design_win_count == 0"

      - name: order_submit_branching_alloc_vs_backorder
        grounds:
          - state_machines.SalesOrder.DRAFT_to_ALLOCATED
          - state_machines.SalesOrder.DRAFT_to_BACKORDERED
        distinguishing_aspect: |
          Branching machine on SalesOrder (different entity than Part): the same
          submit trigger forks DRAFT -> ALLOCATED or DRAFT -> BACKORDERED with
          divergent side effects — only the ALLOCATED branch reserves units;
          the BACKORDERED branch leaves awarded_units == 0.
        test_recipe:
          setup:
            - "Part SN74HC00N demand 0 (posture NORMAL), on_hand 1000; Part TPS5430DDAR demand 10 buffer 1.5 (target 390), on_hand 100 -> coverage 0.2564 -> SHORTAGE."
            - "Both parts have a published single-tier schedule at 100 cents."
            - "One STANDARD / DIRECT_FIELD customer, credit 10000000; two DRAFT orders of 5 units each, one per part."
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "SN74HC00N", description: "Quad NAND", package_family: "PDIP", process_technology: "CMOS_180NM" }
              as: SupplyPlanner
              captures: { br_pn: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "TPS5430DDAR", description: "Buck converter", package_family: "SOIC", process_technology: "ANALOG_BIPOLAR", demand_rate_units_per_week: 10, buffer_multiple: 1.5 }
              as: SupplyPlanner
              captures: { br_ps: $.data.id }
            - call: "POST /capacity-pools"
              payload: { site_name: "DFAB", process_technology: "CMOS_180NM", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-01T00:00:00Z", total_units: 2000 }
              as: SupplyPlanner
              captures: { br_pool1: $.data.id }
            - call: "POST /capacity-pools"
              payload: { site_name: "DFAB", process_technology: "ANALOG_BIPOLAR", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-01T00:00:00Z", total_units: 500 }
              as: SupplyPlanner
              captures: { br_pool2: $.data.id }
            - call: "POST /parts/${br_pn}/receipts"
              payload: { capacity_pool_id: "${br_pool1}", units: 1000 }
              as: SupplyPlanner
              captures: { br_pn_v: $.data.version }
            - call: "POST /parts/${br_ps}/receipts"
              payload: { capacity_pool_id: "${br_pool2}", units: 100 }
              as: SupplyPlanner
              captures: { br_ps_v: $.data.version }
            - call: "POST /pricing-schedules"
              payload: { part_id: "${br_pn}", effective_from: "2026-08-01T00:00:00Z", tiers: [{ min_qty: 1, unit_price_cents: 100 }], expected_part_version: "${br_pn_v}" }
              as: ChannelManager
            - call: "POST /pricing-schedules"
              payload: { part_id: "${br_ps}", effective_from: "2026-08-01T00:00:00Z", tiers: [{ min_qty: 1, unit_price_cents: 100 }], expected_part_version: "${br_ps_v}" }
              as: ChannelManager
            - call: "POST /customers"
              payload: { name: "Standard Buyer", tier: "STANDARD", channel: "DIRECT_FIELD", credit_limit_cents: 10000000 }
              as: ChannelManager
              captures: { br_cust: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${br_cust}", lines: [{ part_id: "${br_pn}", quantity: 5 }] }
              as: Customer
              as_user_id: "${br_cust}"
              captures: { br_o1: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${br_cust}", lines: [{ part_id: "${br_ps}", quantity: 5 }] }
              as: Customer
              as_user_id: "${br_cust}"
              captures: { br_o2: $.data.id }
          trigger:
            - call: "POST /orders/${br_o1}/submit"
              payload: {}
              as: Customer
              as_user_id: "${br_cust}"
              captures: { br_s1: $.data.status }
            - call: "POST /orders/${br_o2}/submit"
              payload: {}
              as: Customer
              as_user_id: "${br_cust}"
              captures: { br_s2: $.data.status }
          assert:
            - "order on the NORMAL part: status == ALLOCATED (fork branch A)"
            - "order on the SHORTAGE part: status == BACKORDERED (fork branch B)"
            - "GET /order-lines?order_id=${br_o1}: awarded_units == 5; GET /order-lines?order_id=${br_o2}: awarded_units == 0"
            - "GET /parts/${br_pn}: reserved_units == 5; GET /parts/${br_ps}: reserved_units == 0 (reservation side effect only on branch A)"
            - "GET /customers/${br_cust}: open_exposure_cents == 1000 (500 + 500 — exposure is taken on BOTH branches)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: eol_notice_cascades_part_designwin_customer
        grounds:
          - state_machines.Part.ACTIVE_to_EOL_ANNOUNCED
          - entities.DesignWin.fields.at_risk
          - entities.Customer.fields.at_risk_design_win_count
        distinguishing_aspect: |
          Depth-3 cascade from the EOL-notice-create trigger: EolNotice creation
          mutates Part (link 1); the part leaving ACTIVE flips each ACTIVE
          DesignWin.at_risk (link 2, caused by link 1); each flipped win
          recomputes its owning Customer.at_risk_design_win_count (link 3,
          caused by link 2).
        test_recipe:
          setup:
            - "Part OPA333AIDBVR ACTIVE; one customer with one ACTIVE design win on the part (at_risk false; customer at_risk_design_win_count 0)."
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "OPA333AIDBVR", description: "Zero-drift op amp", package_family: "SOT23", process_technology: "CMOS_180NM" }
              as: SupplyPlanner
              captures: { cc_part: $.data.id }
            - call: "POST /customers"
              payload: { name: "Metering Labs", tier: "KEY", channel: "DIRECT_ONLINE", credit_limit_cents: 10000000 }
              as: ChannelManager
              captures: { cc_cust: $.data.id }
            - call: "POST /reference-designs"
              payload: { title: "Energy meter front end", featured_part_number: "OPA333AIDBVR" }
              as: FieldEngineer
              captures: { cc_rd: $.data.id }
            - call: "POST /reference-designs/${cc_rd}/publish"
              payload: {}
              as: FieldEngineer
            - call: "POST /design-wins"
              payload: { reference_design_id: "${cc_rd}", customer_id: "${cc_cust}", part_id: "${cc_part}", expected_lifetime_revenue_cents: 1000000, annual_volume_units: 5200, start_date: "2027-01-01T00:00:00Z" }
              as: FieldEngineer
              captures: { cc_dw: $.data.id }
            - call: "POST /design-wins/${cc_dw}/activate"
              payload: {}
              as: FieldEngineer
          trigger:
            - call: "POST /parts/${cc_part}/eol-notices"
              payload: { notice_date: "2026-09-01T00:00:00Z", last_order_date: "2027-02-28T00:00:00Z", last_ship_date: "2027-05-29T00:00:00Z", reason: "Die bank exhausted" }
              as: SupplyPlanner
          assert:
            - "link 1: GET /parts/${cc_part} shows lifecycle_status == EOL_ANNOUNCED"
            - "link 2: GET /design-wins/${cc_dw} shows at_risk == true (flipped because the part left ACTIVE)"
            - "link 3: GET /customers/${cc_cust} shows at_risk_design_win_count == 1 (recomputed because the win flipped)"
            - "GET /parts/${cc_part}/eol-notices returns exactly 1 notice with status ANNOUNCED"

      - name: allocation_publish_cascades_order_part_posture
        grounds:
          - state_machines.AllocationRun.DRAFT_to_PUBLISHED
          - state_machines.SalesOrder.BACKORDERED_to_ALLOCATED
          - calculations.calc_buffer_position
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (run publish): publish applies
          awards to the order line and flips the order BACKORDERED -> ALLOCATED
          (link 1); the order's new reservation raises Part.reserved_units
          (link 2); the reservation drop in coverage flips Part.posture
          WATCH -> SHORTAGE (link 3).
        test_recipe:
          setup:
            - "Part INA128PA demand 40/wk buffer 1.5 -> target 1560; receipt of 1180 units -> coverage 0.7564 -> WATCH."
            - "Order of 1200 units submitted: available 1180 < 1200 -> BACKORDERED with awarded_units 0; reserved stays 0."
            - "Second receipt of 300 -> on_hand 1480, coverage 0.9487, posture still WATCH."
            - "Allocation run created with the line eligible (remaining 1200 > 0); frozen award min(1200, 1480) = 1200."
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "INA128PA", description: "Instrumentation amp", package_family: "PDIP", process_technology: "ANALOG_BIPOLAR", demand_rate_units_per_week: 40, buffer_multiple: 1.5 }
              as: SupplyPlanner
              captures: { cp_part: $.data.id }
            - call: "POST /capacity-pools"
              payload: { site_name: "DFAB", process_technology: "ANALOG_BIPOLAR", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-01T00:00:00Z", total_units: 5000 }
              as: SupplyPlanner
              captures: { cp_pool: $.data.id }
            - call: "POST /parts/${cp_part}/receipts"
              payload: { capacity_pool_id: "${cp_pool}", units: 1180 }
              as: SupplyPlanner
              captures: { cp_part_v: $.data.version }
            - call: "POST /pricing-schedules"
              payload: { part_id: "${cp_part}", effective_from: "2026-08-01T00:00:00Z", tiers: [{ min_qty: 1, unit_price_cents: 100 }], expected_part_version: "${cp_part_v}" }
              as: ChannelManager
            - call: "POST /customers"
              payload: { name: "Process Controls SA", tier: "STANDARD", channel: "DIRECT_FIELD", credit_limit_cents: 10000000 }
              as: ChannelManager
              captures: { cp_cust: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cp_cust}", lines: [{ part_id: "${cp_part}", quantity: 1200 }] }
              as: Customer
              as_user_id: "${cp_cust}"
              captures: { cp_ord: $.data.id }
            - call: "POST /orders/${cp_ord}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cp_cust}"
            - call: "POST /parts/${cp_part}/receipts"
              payload: { capacity_pool_id: "${cp_pool}", units: 300 }
              as: SupplyPlanner
            - call: "GET /parts/${cp_part}/inventory-position"
              payload: {}
              as: SupplyPlanner
              captures: { cp_pre_posture: $.data.posture }
            - call: "GET /order-lines"
              payload: { order_id: "${cp_ord}" }
              as: SupplyPlanner
              captures: { cp_line: "$.data[0].id" }
            - call: "POST /allocation-runs"
              payload: { period_label: "2026-W41" }
              as: SupplyPlanner
              captures: { cp_run: $.data.id }
          trigger:
            - call: "POST /allocation-runs/${cp_run}/publish"
              payload: {}
              as: SupplyPlanner
          assert:
            - "pre-publish posture capture == WATCH (coverage 1480/1560 = 0.9487)"
            - "link 1: GET /order-lines/${cp_line} shows awarded_units == 1200; GET /orders/${cp_ord} shows status == ALLOCATED"
            - "link 2: GET /parts/${cp_part} shows reserved_units == 1200 (raised by the order's award, not by the run directly)"
            - "link 3: inventory-position now shows coverage_trailing == 0.1795 ((1480-1200)/1560) and posture == SHORTAGE — flipped by link 2"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_cancelled_order_state_beats_credit
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors.ERR_INVALID_STATE
          - errors.ERR_CREDIT_LIMIT_EXCEEDED
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: the order is CANCELLED
          (state failure) AND its total would breach the credit limit (fiscal
          failure); the state error must win.
        test_recipe:
          setup:
            - "Part with published schedule; customer STANDARD / DIRECT_FIELD with credit_limit_cents 100 (order total 200 would exceed it)."
            - "Order of 2 units created, then cancelled from DRAFT."
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "NE555P", description: "Timer", package_family: "PDIP", process_technology: "ANALOG_BIPOLAR" }
              as: SupplyPlanner
              captures: { pc_part: $.data.id, pc_part_v: $.data.version }
            - call: "POST /pricing-schedules"
              payload: { part_id: "${pc_part}", effective_from: "2026-08-01T00:00:00Z", tiers: [{ min_qty: 1, unit_price_cents: 100 }], expected_part_version: "${pc_part_v}" }
              as: ChannelManager
            - call: "POST /customers"
              payload: { name: "Tiny Credit Co", tier: "STANDARD", channel: "DIRECT_FIELD", credit_limit_cents: 100 }
              as: ChannelManager
              captures: { pc_cust: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${pc_cust}", lines: [{ part_id: "${pc_part}", quantity: 2 }] }
              as: Customer
              as_user_id: "${pc_cust}"
              captures: { pc_ord: $.data.id }
            - call: "POST /orders/${pc_ord}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${pc_cust}"
          trigger:
            - call: "POST /orders/${pc_ord}/submit"
              payload: {}
              as: Customer
              as_user_id: "${pc_cust}"
              captures: { pc_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (priority 5 state check wins)"
            - "error_id != ERR_CREDIT_LIMIT_EXCEEDED although the credit check would also fail"
            - "HTTP status == 409"
            - "GET /orders/${pc_ord}: status still CANCELLED, total_cents is null (never priced)"

      - name: submit_discontinued_part_referential_beats_credit
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors.ERR_PART_NOT_ORDERABLE
          - errors.ERR_CREDIT_LIMIT_EXCEEDED
        distinguishing_aspect: |
          Different error-category pair than the sibling instance:
          business_referential (part not orderable) vs business_fiscal (credit);
          the referential error must win even though both fail.
        test_recipe:
          setup:
            - "Part CD4049BE with a published schedule, taken through the full EOL program: notice 2026-09-01 (last_order 2027-02-28, last_ship 2027-05-29), then clock to 2027-05-29 -> DISCONTINUED."
            - "Customer STANDARD / DIRECT_FIELD with credit_limit_cents 1 (any submit fails the credit gate too)."
            - "DRAFT order of 10 units of the discontinued part."
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "CD4049BE", description: "Hex inverter", package_family: "PDIP", process_technology: "CMOS_180NM", demand_rate_units_per_week: 5 }
              as: SupplyPlanner
              captures: { pr_part: $.data.id, pr_part_v: $.data.version }
            - call: "POST /pricing-schedules"
              payload: { part_id: "${pr_part}", effective_from: "2026-08-01T00:00:00Z", tiers: [{ min_qty: 1, unit_price_cents: 50 }], expected_part_version: "${pr_part_v}" }
              as: ChannelManager
            - call: "POST /parts/${pr_part}/eol-notices"
              payload: { notice_date: "2026-09-01T00:00:00Z", last_order_date: "2027-02-28T00:00:00Z", last_ship_date: "2027-05-29T00:00:00Z", reason: "Process retirement" }
              as: SupplyPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-29T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { name: "Micro Credit LLC", tier: "STANDARD", channel: "DIRECT_FIELD", credit_limit_cents: 1 }
              as: ChannelManager
              captures: { pr_cust: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${pr_cust}", lines: [{ part_id: "${pr_part}", quantity: 10 }] }
              as: Customer
              as_user_id: "${pr_cust}"
              captures: { pr_ord: $.data.id }
          trigger:
            - call: "POST /orders/${pr_ord}/submit"
              payload: {}
              as: Customer
              as_user_id: "${pr_cust}"
              captures: { pr_err: $.data.error_id }
          assert:
            - "error_id == ERR_PART_NOT_ORDERABLE (priority 9 referential check wins)"
            - "error_id != ERR_CREDIT_LIMIT_EXCEEDED although credit_limit_cents == 1 guarantees the fiscal failure"
            - "HTTP status == 422"
            - "GET /parts/${pr_part}: lifecycle_status == DISCONTINUED (clock sweep drove EOL_ANNOUNCED -> LAST_TIME_BUY -> DISCONTINUED)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: quote_qty_at_tier_boundary_gets_tier_price
        grounds:
          - calculations.calc_unit_price_quote
          - endpoints.POST_/pricing/quote
        distinguishing_aspect: |
          Numeric threshold boundary on the quote endpoint: tier membership uses
          inclusive min_qty — qty 99 prices at tier 1 while qty 100 (== min_qty)
          prices at tier 2; one unit changes the unit price.
        test_recipe:
          setup:
            - "Part with published 3-tier schedule: [{1, 250}, {100, 210}, {1000, 175}] effective 2026-08-01."
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "LM358DR", description: "Dual op amp", package_family: "SOIC", process_technology: "ANALOG_BIPOLAR" }
              as: SupplyPlanner
              captures: { bq_part: $.data.id, bq_part_v: $.data.version }
            - call: "POST /pricing-schedules"
              payload: { part_id: "${bq_part}", effective_from: "2026-08-01T00:00:00Z", tiers: [{ min_qty: 1, unit_price_cents: 250 }, { min_qty: 100, unit_price_cents: 210 }, { min_qty: 1000, unit_price_cents: 175 }], expected_part_version: "${bq_part_v}" }
              as: ChannelManager
          trigger:
            - call: "POST /pricing/quote"
              payload: { part_id: "${bq_part}", quantity: 99, channel: "DIRECT_ONLINE" }
              as: ChannelManager
              captures: { bq_q99: $.data.unit_price_cents }
            - call: "POST /pricing/quote"
              payload: { part_id: "${bq_part}", quantity: 100, channel: "DIRECT_ONLINE" }
              as: ChannelManager
              captures: { bq_q100: $.data.unit_price_cents, bq_t100: $.data.tier_min_qty }
            - call: "POST /pricing/quote"
              payload: { part_id: "${bq_part}", quantity: 1000, channel: "DISTRIBUTOR" }
              as: ChannelManager
              captures: { bq_q1000: $.data.unit_price_cents }
            - call: "POST /pricing/quote"
              payload: { part_id: "${bq_part}", quantity: 100, channel: "DISTRIBUTOR" }
              as: ChannelManager
              captures: { bq_q100d: $.data.unit_price_cents }
          assert:
            - "qty 99 -> unit_price_cents == 250, tier_min_qty == 1"
            - "qty 100 -> unit_price_cents == 210, tier_min_qty == 100 (inclusive >= boundary)"
            - "qty 1000 -> unit_price_cents == 175, tier_min_qty == 1000"
            - "qty 100 via DISTRIBUTOR channel -> unit_price_cents == 210 — published pricing is channel-invariant"

      - name: allocation_run_with_zero_eligible_lines_publishes_empty
        grounds:
          - calculations.calc_allocation_awards
          - endpoints.POST_/allocation-runs/{id}/publish
          - entities.AllocationRun.fields.awards
        distinguishing_aspect: |
          Empty-set boundary on a different metric and endpoint than the pricing
          boundary: with zero eligible lines the run computes an empty awards
          array and still publishes — award count exactly 0, not an error.
        test_recipe:
          setup:
            - "One part, demand 0 (posture NORMAL), no orders at all -> no BACKORDERED lines exist."
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "UA741CP", description: "General op amp", package_family: "PDIP", process_technology: "ANALOG_BIPOLAR" }
              as: SupplyPlanner
          trigger:
            - call: "POST /allocation-runs"
              payload: { period_label: "2026-W42" }
              as: SupplyPlanner
              captures: { be_run: $.data.id, be_awards: $.data.awards, be_shortage: $.data.shortage_part_ids }
            - call: "POST /allocation-runs/${be_run}/publish"
              payload: {}
              as: SupplyPlanner
              captures: { be_status: $.data.status }
          assert:
            - "run create response: status == DRAFT, awards == [] (empty array, exactly 0 entries — no synthetic rows)"
            - "shortage_part_ids == [] (no SHORTAGE part exists)"
            - "publish response: status == PUBLISHED and awards remains []"
            - "no order or part field changes (GET /parts shows reserved_units == 0)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_submit_blocked_when_part_discontinued
        grounds:
          - state_machines.SalesOrder.DRAFT_to_ALLOCATED
          - validations[priority=9]
          - errors.ERR_PART_NOT_ORDERABLE
        distinguishing_aspect: |
          Entity pair SalesOrder -> Part: the order's submit transition is
          gated by the lifecycle state of a different entity (the line's part);
          DISCONTINUED blocks it while the order itself is in a valid state.
        test_recipe:
          setup:
            - "Part LM741CN with published schedule; EOL notice 2026-09-01 (last_order 2027-02-28, last_ship 2027-05-29); clock at 2027-05-29 -> part DISCONTINUED."
            - "Customer STANDARD / DIRECT_FIELD with ample credit 10000000; DRAFT order of 10 units."
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "LM741CN", description: "Classic op amp", package_family: "PDIP", process_technology: "ANALOG_BIPOLAR", demand_rate_units_per_week: 5 }
              as: SupplyPlanner
              captures: { xd_part: $.data.id, xd_part_v: $.data.version }
            - call: "POST /pricing-schedules"
              payload: { part_id: "${xd_part}", effective_from: "2026-08-01T00:00:00Z", tiers: [{ min_qty: 1, unit_price_cents: 60 }], expected_part_version: "${xd_part_v}" }
              as: ChannelManager
            - call: "POST /parts/${xd_part}/eol-notices"
              payload: { notice_date: "2026-09-01T00:00:00Z", last_order_date: "2027-02-28T00:00:00Z", last_ship_date: "2027-05-29T00:00:00Z", reason: "Fab shutdown" }
              as: SupplyPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-29T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { name: "Ample Credit Co", tier: "STANDARD", channel: "DIRECT_FIELD", credit_limit_cents: 10000000 }
              as: ChannelManager
              captures: { xd_cust: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${xd_cust}", lines: [{ part_id: "${xd_part}", quantity: 10 }] }
              as: Customer
              as_user_id: "${xd_cust}"
              captures: { xd_ord: $.data.id }
          trigger:
            - call: "POST /orders/${xd_ord}/submit"
              payload: {}
              as: Customer
              as_user_id: "${xd_cust}"
              captures: { xd_err: $.data.error_id }
          assert:
            - "error_id == ERR_PART_NOT_ORDERABLE, HTTP 422 — the gate is the PART's state, not the order's"
            - "GET /orders/${xd_ord}: status remains DRAFT (no transition, no price lock: total_cents is null)"
            - "GET /parts/${xd_part}: lifecycle_status == DISCONTINUED"

      - name: automotive_receipt_blocked_when_site_qualification_suspended
        grounds:
          - validations[priority=6]
          - state_machines.SiteQualification.QUALIFIED_to_SUSPENDED
          - errors.ERR_SITE_NOT_QUALIFIED
        distinguishing_aspect: |
          Different entity pair (ProductionReceipt -> SiteQualification, joined
          via CapacityPool.site_name): suspending the site's AUTOMOTIVE
          qualification closes the receipt gate for automotive parts even
          though the pool itself is OPEN and has capacity.
        test_recipe:
          setup:
            - "Automotive-grade part LM2904QDRQ1; capacity pool at site ATX-ASSEMBLY, window [2026-09-01, 2026-12-01) -> OPEN at default clock, total 500."
            - "SiteQualification (ATX-ASSEMBLY, AUTOMOTIVE) driven REQUESTED -> IN_REVIEW -> QUALIFIED; a first receipt of 10 succeeds."
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "LM2904QDRQ1", description: "Auto dual op amp", package_family: "SOIC", process_technology: "ANALOG_BIPOLAR", automotive_grade: true }
              as: SupplyPlanner
              captures: { xq_part: $.data.id }
            - call: "POST /capacity-pools"
              payload: { site_name: "ATX-ASSEMBLY", process_technology: "ANALOG_BIPOLAR", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-01T00:00:00Z", total_units: 500 }
              as: SupplyPlanner
              captures: { xq_pool: $.data.id }
            - call: "POST /site-qualifications"
              payload: { site_name: "ATX-ASSEMBLY", segment: "AUTOMOTIVE" }
              as: QualityEngineer
              captures: { xq_qual: $.data.id }
            - call: "POST /site-qualifications/${xq_qual}/transition"
              payload: { to_state: "IN_REVIEW" }
              as: QualityEngineer
            - call: "POST /site-qualifications/${xq_qual}/transition"
              payload: { to_state: "QUALIFIED" }
              as: QualityEngineer
            - call: "POST /parts/${xq_part}/receipts"
              payload: { capacity_pool_id: "${xq_pool}", units: 10 }
              as: SupplyPlanner
            - call: "POST /site-qualifications/${xq_qual}/transition"
              payload: { to_state: "SUSPENDED" }
              as: QualityEngineer
          trigger:
            - call: "POST /parts/${xq_part}/receipts"
              payload: { capacity_pool_id: "${xq_pool}", units: 5 }
              as: SupplyPlanner
              captures: { xq_err: $.data.error_id }
          assert:
            - "error_id == ERR_SITE_NOT_QUALIFIED, HTTP 422"
            - "the first receipt (while QUALIFIED) succeeded — the gate is the qualification's state, not the pool's"
            - "GET /parts/${xq_part}: on_hand_units == 10 (rejected receipt changed nothing)"
            - "GET /capacity-pools/${xq_pool}: allocated_units == 10 and qualified_for_automotive == false after suspension"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: capacity_pool_periods_half_open_adjacency
        grounds:
          - validations[priority=7]
          - errors.ERR_POOL_PERIOD_OVERLAP
          - entities.CapacityPool
        distinguishing_aspect: |
          Half-open interval semantics on CapacityPool: [start, end) — a new
          pool whose start == an existing pool's end is adjacent and ALLOWED,
          while a one-day interior overlap is rejected; same site+technology.
        test_recipe:
          setup:
            - "Pool A: site RFAB, tech CMOS_180NM, [2026-09-01, 2026-10-01)."
          setup_api_calls:
            - call: "POST /capacity-pools"
              payload: { site_name: "RFAB", process_technology: "CMOS_180NM", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", total_units: 300 }
              as: SupplyPlanner
              captures: { to_pool_a: $.data.id }
            - call: "POST /capacity-pools"
              payload: { site_name: "RFAB", process_technology: "CMOS_180NM", period_start: "2026-10-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z", total_units: 300 }
              as: SupplyPlanner
              captures: { to_pool_b: $.data.id }
          trigger:
            - call: "POST /capacity-pools"
              payload: { site_name: "RFAB", process_technology: "CMOS_180NM", period_start: "2026-09-15T00:00:00Z", period_end: "2026-10-15T00:00:00Z", total_units: 100 }
              as: SupplyPlanner
              captures: { to_err: $.data.error_id }
          assert:
            - "pool B (start == A.end, adjacent) was accepted with 201 — half-open adjacency is not a conflict"
            - "trigger pool C ([2026-09-15, 2026-10-15), intersects both A and B interiors) -> error_id == ERR_POOL_PERIOD_OVERLAP, HTTP 409"
            - "a pool with the same window but a different process_technology would not conflict (scoped resource)"

      - name: eol_notice_window_closed_overlap_rejected
        grounds:
          - validations[priority=7]
          - errors.ERR_EOL_NOTICE_ACTIVE_EXISTS
          - entities.EolNotice
        distinguishing_aspect: |
          Different interval semantics and resource than the pool rule: EOL
          notice windows are CLOSED intervals [notice_date, last_ship_date] on
          the part resource — a second ANNOUNCED notice that merely touches the
          existing window's endpoint still counts as overlap and is rejected.
        test_recipe:
          setup:
            - "Part with ANNOUNCED notice N1: [notice 2026-09-01 .. last_ship 2027-05-29]."
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "ULN2003AN", description: "Darlington array", package_family: "PDIP", process_technology: "ANALOG_BIPOLAR", demand_rate_units_per_week: 5 }
              as: SupplyPlanner
              captures: { en_part: $.data.id }
            - call: "POST /parts/${en_part}/eol-notices"
              payload: { notice_date: "2026-09-01T00:00:00Z", last_order_date: "2027-02-28T00:00:00Z", last_ship_date: "2027-05-29T00:00:00Z", reason: "Package retirement" }
              as: SupplyPlanner
              captures: { en_n1: $.data.id }
          trigger:
            - call: "POST /parts/${en_part}/eol-notices"
              payload: { notice_date: "2027-05-29T00:00:00Z", last_order_date: "2027-11-25T00:00:00Z", last_ship_date: "2028-02-23T00:00:00Z", reason: "Successor program" }
              as: SupplyPlanner
              captures: { en_err: $.data.error_id }
          assert:
            - "error_id == ERR_EOL_NOTICE_ACTIVE_EXISTS, HTTP 409 — closed-interval touch at 2027-05-29 counts as overlap"
            - "the new window itself is shape-valid (last_order = notice + 180d, last_ship = last_order + 90d) — only the overlap rejects it"
            - "GET /parts/${en_part}/eol-notices: total_count == 1, still only N1 ANNOUNCED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: allocate_then_cancel_conserves_physical_units
        grounds:
          - state_machines.SalesOrder.ALLOCATED_to_CANCELLED
          - entities.Part.fields.reserved_units
          - entities.Part.fields.on_hand_units
        distinguishing_aspect: |
          Conserved quantity = physical units: forward action (submit ->
          ALLOCATED) reserves 200 of 500 on-hand; the compensating cancel must
          return reserved_units to its baseline and leave on_hand_units
          bit-identical — no drift in on_hand or reserved.
        test_recipe:
          setup:
            - "Part demand 0 (NORMAL), on_hand 500, reserved 0; published schedule at 100 cents; customer STANDARD / DIRECT_FIELD, credit 10000000."
            - "Baseline: on_hand_units + reserved_units == 500 and reserved_units == 0."
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "CD4050BE", description: "Hex buffer", package_family: "PDIP", process_technology: "CMOS_180NM" }
              as: SupplyPlanner
              captures: { ci_part: $.data.id }
            - call: "POST /capacity-pools"
              payload: { site_name: "DFAB", process_technology: "CMOS_180NM", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-01T00:00:00Z", total_units: 1000 }
              as: SupplyPlanner
              captures: { ci_pool: $.data.id }
            - call: "POST /parts/${ci_part}/receipts"
              payload: { capacity_pool_id: "${ci_pool}", units: 500 }
              as: SupplyPlanner
              captures: { ci_part_v: $.data.version }
            - call: "POST /pricing-schedules"
              payload: { part_id: "${ci_part}", effective_from: "2026-08-01T00:00:00Z", tiers: [{ min_qty: 1, unit_price_cents: 100 }], expected_part_version: "${ci_part_v}" }
              as: ChannelManager
            - call: "POST /customers"
              payload: { name: "Invariant Test Co", tier: "STANDARD", channel: "DIRECT_FIELD", credit_limit_cents: 10000000 }
              as: ChannelManager
              captures: { ci_cust: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${ci_cust}", lines: [{ part_id: "${ci_part}", quantity: 200 }] }
              as: Customer
              as_user_id: "${ci_cust}"
              captures: { ci_ord: $.data.id }
            - call: "POST /orders/${ci_ord}/submit"
              payload: {}
              as: Customer
              as_user_id: "${ci_cust}"
            - call: "GET /parts/${ci_part}/inventory-position"
              payload: {}
              as: SupplyPlanner
              captures: { ci_oh_mid: $.data.on_hand_units, ci_rv_mid: $.data.reserved_units }
          trigger:
            - call: "POST /orders/${ci_ord}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${ci_cust}"
          assert:
            - "mid-state (after submit): on_hand_units == 500 and reserved_units == 200"
            - "post-cancel: GET /parts/${ci_part}/inventory-position shows on_hand_units == 500 and reserved_units == 0 — both fields exactly back to baseline"
            - "GET /order-lines?order_id=${ci_ord}: awarded_units == 0 after cancel"
            - "GET /orders/${ci_ord}: status == CANCELLED"

      - name: submit_then_cancel_conserves_customer_exposure
        grounds:
          - calculations.calc_credit_exposure
          - calculations.calc_order_totals
          - entities.Customer.fields.open_exposure_cents
        distinguishing_aspect: |
          Different conserved quantity than the sibling instance (monetary
          exposure, not physical units): submit debits open_exposure_cents by
          the computed total (including the small-order service fee) and the
          compensating cancel credits exactly the same amount back to zero.
        test_recipe:
          setup:
            - "Part demand 0 (NORMAL), on_hand 100, published single-tier 210 cents."
            - "Customer SMALL / DIRECT_ONLINE, credit 10000000, no discount; baseline open_exposure_cents == 0."
            - "Order of 40 units: subtotal 40*210 = 8400 < 10000 -> service fee 500 applies; total 8900."
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "MCP6002-I/P", description: "Rail-to-rail op amp", package_family: "PDIP", process_technology: "CMOS_180NM" }
              as: SupplyPlanner
              captures: { ce_part: $.data.id }
            - call: "POST /capacity-pools"
              payload: { site_name: "DFAB", process_technology: "CMOS_180NM", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-01T00:00:00Z", total_units: 500 }
              as: SupplyPlanner
              captures: { ce_pool: $.data.id }
            - call: "POST /parts/${ce_part}/receipts"
              payload: { capacity_pool_id: "${ce_pool}", units: 100 }
              as: SupplyPlanner
              captures: { ce_part_v: $.data.version }
            - call: "POST /pricing-schedules"
              payload: { part_id: "${ce_part}", effective_from: "2026-08-01T00:00:00Z", tiers: [{ min_qty: 1, unit_price_cents: 210 }], expected_part_version: "${ce_part_v}" }
              as: ChannelManager
            - call: "POST /customers"
              payload: { name: "Hobby Electronics", tier: "SMALL", channel: "DIRECT_ONLINE", credit_limit_cents: 10000000 }
              as: ChannelManager
              captures: { ce_cust: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${ce_cust}", lines: [{ part_id: "${ce_part}", quantity: 40 }] }
              as: Customer
              as_user_id: "${ce_cust}"
              captures: { ce_ord: $.data.id }
            - call: "POST /orders/${ce_ord}/submit"
              payload: {}
              as: Customer
              as_user_id: "${ce_cust}"
              captures: { ce_sub: $.data.subtotal_cents, ce_fee: $.data.service_fee_cents, ce_tot: $.data.total_cents }
            - call: "GET /customers/${ce_cust}"
              payload: {}
              as: ChannelManager
              captures: { ce_exp_mid: $.data.open_exposure_cents }
          trigger:
            - call: "POST /orders/${ce_ord}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${ce_cust}"
          assert:
            - "submit response: subtotal_cents == 8400, service_fee_cents == 500 (SMALL + DIRECT_ONLINE + subtotal < 10000), total_cents == 8900"
            - "mid-state: open_exposure_cents == 8900"
            - "post-cancel: GET /customers/${ce_cust} shows open_exposure_cents == 0 — exact reversal, no fee residue"
            - "GET /orders/${ce_ord}: status == CANCELLED"
