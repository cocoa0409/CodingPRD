            - call: "POST /otb/category-plans/${plan_id}/reforecasts"
              payload: { reason_note: "chase the opening weeks", expected_category_plan_version: "${plan_v}" }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { cycle_id: $.data.id }
            - call: "POST /otb/chase-cancel-decisions"
              payload: { reforecast_cycle_id: "${cycle_id}", assortment_item_id: "${item_a}", action: "CHASE", requested_units: 500, rationale: "reorder the opening-week best seller" }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { dec_a: $.data.id }
            - call: "POST /otb/chase-cancel-decisions/${dec_a}/approve"
              payload: { decision_note: "funded" }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { a_units: $.data.approved_units, a_status: $.data.status }
            - call: "GET /otb/plan-months/${m1_id}"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { m1_open_after_a: $.data.otb_open_cents }
            - call: "POST /otb/chase-cancel-decisions"
              payload: { reforecast_cycle_id: "${cycle_id}", assortment_item_id: "${item_b}", action: "CHASE", requested_units: 500, rationale: "same chase, later in the round" }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { dec_b: $.data.id }
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { new_clock: $.data.current_utc, expired: $.data.expired_overlay_count }
          trigger:
            - call: "POST /otb/chase-cancel-decisions/${dec_b}/approve"
              payload: { decision_note: "too late in the season" }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { b_error: $.data.error_id }
            - call: "GET /otb/chase-cancel-decisions/${dec_b}"
              payload: {}
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { dec_b_status: $.data.status, dec_b_units: $.data.approved_units }
            - call: "GET /otb/reforecast-cycles/${cycle_id}"
              payload: {}
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { cycle_status: $.data.status }
            - call: "GET /otb/assortment-items/${item_b}"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { item_b_status: $.data.status, item_b_units: $.data.planned_units }
            - call: "GET /otb/plan-months/${m1_id}"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { m1_open_after_b: $.data.otb_open_cents, m1_committed: $.data.otb_committed_cents }
          assert:
            - "the baseline approval succeeded at clock 2026-08-01: ${a_units} == 500, ${a_status} == APPROVED and ${m1_open_after_a} == 16900000 (18,200,000 - 500 * 2600), with one CHASE_DECISION commitment created on M1 over [2027-03-05, 2027-03-19) - so the whole chase machinery is demonstrably wired"
            - "${new_clock} == 2027-03-01T00:00:00Z and ${expired} == 0 (no overlays exist), and 2027-03-01 plus the vendor's 45 days is 2027-04-15"
            - "${b_error} == ERR_NO_FEASIBLE_RECEIPT_MONTH (422): the bucket filter keeps only months with first_receipt_date >= 2027-04-15, and M1 (2027-03-05) and M2 (2027-04-02) both fall short, so buckets is empty and approved_units would be 0"
            - "no earlier rung of the ladder can account for the rejection: the caller is a PlanningDirector (priorities 1, 2), every referenced row exists (priorities 5, 6), director-1 != planner-1 who proposed it (priority 8), ${dec_b_status} was PROPOSED, the cycle was OPEN and ${b_status} == IN_SEASON (priority 9), and M1's otb_open of 16,900,000 leaves floor(16900000 / 2600) = 6500 affordable units against a request of only 500"
            - "vendor capacity is provably not the cause either: weekly_unit_capacity is 12000 against 500 requested, and max_open_units 40000 against 500 already open"
            - "${dec_b_status} == PROPOSED and ${dec_b_units} is null: the failed approval left the decision untouched rather than APPROVED-with-zero"
            - "${cycle_status} == OPEN: the bubble-up to DECIDED did NOT fire, because a PROPOSED decision still remains in the cycle"
            - "${item_b_status} == IN_SEASON and ${item_b_units} == ${b_units} == 276: the IN_SEASON -> CHASED transition and the planned_units increment were both rolled back with the request"
            - "${m1_open_after_b} == ${m1_open_after_a} == 16900000 and ${m1_committed} == 1300000: the month's dollars are exactly what decision A left, so the failed approval created no commitment - GET /otb/receipt-commitments filtered to assortment_item_id ${item_b} returns total_count 0"

      - name: frozen_posture_outranks_otb_exceeded_on_the_same_request
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: frozen_posture_beats_otb_exceeded
          rationale: "The §1.8 instance already drives a single POST /otb/receipt-commitments into simultaneous violation of priority 16 (FROZEN posture) and priority 37 (cost above otb_open) and asserts that ERR_OTB_POSTURE_FROZEN wins, then lifts the freeze so the same payload surfaces ERR_OTB_EXCEEDED. Repeating a priority_conflict probe here would duplicate that setup and its assertions verbatim, so the corner is left to the depth probe."

