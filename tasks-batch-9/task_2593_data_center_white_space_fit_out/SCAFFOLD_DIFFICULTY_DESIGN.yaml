      - name: containment_leak_failure_blocks_level_four_packages
        grounds:
          - state_machines.ContainmentZone.UNTESTED_to_FAIL
          - state_machines.CommissioningPackage.witness_status_PENDING_to_BLOCKED
          - calculations.hall_cooling_model
          - calculations.hall_release_posture
          - entities.Hall.fields.thermal_posture
        distinguishing_aspect: |
          A single leakage test on a zone that holds no racks reaches three levels away: the zone's own
          FAIL (link 1) lowers the hall's AIRFLOW_LIMITED capacity and flips thermal_posture to CONSTRAINED
          (link 2), which in turn moves every L4/L5 package with witness_status PENDING to BLOCKED
          (link 3) while L1 packages are left alone. The cascade is level-filtered and posture-mediated,
          so it cannot be reproduced by any rule that looks only at the failing zone's own racks.
