            - call: "POST /political-ads/stations/${st}/audit-sweep"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-01"
          assert:
            - "${due} == 2026-08-15T09:00:00.000Z"
            - "${st1} == RESPONDED"
            - "${cure_at} == 2026-09-04T09:00:00.000Z"
            - "${open_after_reopen} == 1"
            - "${posture_reopened} == RESTRICTED"
