  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pc_state_beats_constraint_on_request
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_MEMBER_NOT_ACTIVE]
        distinguishing_aspect: "A SUSPENDED CRUISE member requesting at a reciprocal dock violates BOTH a state check (member not ACTIVE, priority 6, category state) and a constraint check (reciprocal access denied, priority 9, category business_constraint); the state error ERR_MEMBER_NOT_ACTIVE wins — pair (state, business_constraint)."
        test_recipe:
          setup:
            - "A CRUISE member (no reciprocal access) is ACTIVE and BASIC-certified, then administratively suspended."
            - "A separate reciprocal dock with a PONTOON boat exists."
          setup_api_calls:
            - { call: "POST /membership-tiers", payload: { tier_code: "CRUISE", monthly_dues_cents: 15000, max_active_reservations: 1, reservations_per_week: 2, reciprocal_access_allowed: false, advance_booking_days_max: 7 }, as: ClubAdmin }
            - { call: "POST /docks", payload: { name: "Home", location_code: "HM", capacity: 10, is_reciprocal: false }, as: ClubAdmin, captures: { hd: "$.data.id" } }
            - { call: "POST /docks", payload: { name: "Recip", location_code: "RC", capacity: 10, is_reciprocal: true }, as: ClubAdmin, captures: { rd: "$.data.id" } }
            - { call: "POST /boats", payload: { dock_id: "${rd}", boat_type: "PONTOON" }, as: ClubAdmin, captures: { rb: "$.data.id" } }
            - { call: "POST /members", payload: { full_name: "A", email: "a@x.com", membership_tier: "CRUISE", home_dock_id: "${hd}" }, as: ClubAdmin, captures: { m: "$.data.id" } }
            - { call: "POST /training-sessions", payload: { dock_id: "${hd}", session_type: "ORIENTATION", start_time: "2026-05-02T09:00:00Z", end_time: "2026-05-02T11:00:00Z", capacity: 5, instructor_name: "I" }, as: ClubAdmin, captures: { so: "$.data.id" } }
            - { call: "POST /enrollments", payload: { member_id: "${m}", session_id: "${so}" }, as: Member, as_user_id: "${m}", captures: { eo: "$.data.id" } }
            - { call: "POST /enrollments/${eo}/mark-attendance", payload: { attended: true }, as: DockStaff }
            - { call: "POST /training-sessions", payload: { dock_id: "${hd}", session_type: "BASIC_CERT", start_time: "2026-05-02T12:00:00Z", end_time: "2026-05-02T14:00:00Z", capacity: 5, instructor_name: "I" }, as: ClubAdmin, captures: { sb: "$.data.id" } }
            - { call: "POST /enrollments", payload: { member_id: "${m}", session_id: "${sb}" }, as: Member, as_user_id: "${m}", captures: { eb: "$.data.id" } }
            - { call: "POST /enrollments/${eb}/mark-attendance", payload: { attended: true }, as: DockStaff }
            - { call: "POST /members/${m}/suspend", payload: { reason: "for-cause" }, as: ClubAdmin }
          trigger:
            - { call: "POST /reservations", payload: { member_id: "${m}", dock_id: "${rd}", boat_type: "PONTOON", start_time: "2026-05-05T10:00:00Z", end_time: "2026-05-05T12:00:00Z" }, as: Member, as_user_id: "${m}", captures: { err: "$.data.error_id" } }
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_MEMBER_NOT_ACTIVE"
            - "response data.error_id != ERR_RECIPROCAL_NOT_ALLOWED"

      - name: pc_safety_beats_fiscal_on_request
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors[ERR_CERT_INSUFFICIENT]
        distinguishing_aspect: "An ACTIVE, BASIC-only member with outstanding fees over the block limit requesting a CENTER_CONSOLE (needs ADVANCED) violates BOTH a safety check (cert insufficient, priority 7, category business_safety) and a fiscal check (outstanding fees, priority 10, category business_fiscal); the safety error ERR_CERT_INSUFFICIENT wins — pair (business_safety, business_fiscal)."
        test_recipe:
          setup:
            - "A CRUISE member (deductible 50000) is ACTIVE and BASIC-certified (not ADVANCED); the tier is configured max_active_reservations=2 so the earlier PONTOON reservation does not trip the active cap."
            - "A SEVERE DAMAGE fee of 60000 (= min(60000, 50000+20000)) is ASSESSED, putting outstanding_fees_cents (60000) over FEE_BLOCK_LIMIT_CENTS (50000)."
            - "A CENTER_CONSOLE boat exists at the home dock."
          setup_api_calls:
            - { call: "POST /membership-tiers", payload: { tier_code: "CRUISE", monthly_dues_cents: 15000, max_active_reservations: 2, reservations_per_week: 2, reciprocal_access_allowed: false, advance_booking_days_max: 7 }, as: ClubAdmin }
            - { call: "POST /docks", payload: { name: "Home", location_code: "HM", capacity: 10, is_reciprocal: false }, as: ClubAdmin, captures: { hd: "$.data.id" } }
            - { call: "POST /boats", payload: { dock_id: "${hd}", boat_type: "PONTOON" }, as: ClubAdmin, captures: { b1: "$.data.id" } }
            - { call: "POST /boats", payload: { dock_id: "${hd}", boat_type: "CENTER_CONSOLE" }, as: ClubAdmin, captures: { cc: "$.data.id" } }
            - { call: "POST /members", payload: { full_name: "A", email: "a@x.com", membership_tier: "CRUISE", home_dock_id: "${hd}" }, as: ClubAdmin, captures: { m: "$.data.id" } }
            - { call: "POST /training-sessions", payload: { dock_id: "${hd}", session_type: "ORIENTATION", start_time: "2026-05-02T09:00:00Z", end_time: "2026-05-02T11:00:00Z", capacity: 5, instructor_name: "I" }, as: ClubAdmin, captures: { so: "$.data.id" } }
            - { call: "POST /enrollments", payload: { member_id: "${m}", session_id: "${so}" }, as: Member, as_user_id: "${m}", captures: { eo: "$.data.id" } }
            - { call: "POST /enrollments/${eo}/mark-attendance", payload: { attended: true }, as: DockStaff }
            - { call: "POST /training-sessions", payload: { dock_id: "${hd}", session_type: "BASIC_CERT", start_time: "2026-05-02T12:00:00Z", end_time: "2026-05-02T14:00:00Z", capacity: 5, instructor_name: "I" }, as: ClubAdmin, captures: { sb: "$.data.id" } }
            - { call: "POST /enrollments", payload: { member_id: "${m}", session_id: "${sb}" }, as: Member, as_user_id: "${m}", captures: { eb: "$.data.id" } }
            - { call: "POST /enrollments/${eb}/mark-attendance", payload: { attended: true }, as: DockStaff }
            - { call: "POST /reservations", payload: { member_id: "${m}", dock_id: "${hd}", boat_type: "PONTOON", start_time: "2026-05-05T08:00:00Z", end_time: "2026-05-05T09:00:00Z" }, as: Member, as_user_id: "${m}", captures: { r0: "$.data.id" } }
            - { call: "POST /damage-reports", payload: { reservation_id: "${r0}", boat_id: "${b1}", severity: "SEVERE", repair_cost_cents: 60000 }, as: DockStaff, captures: { dr: "$.data.id" } }
            - { call: "POST /damage-reports/${dr}/assess", payload: {}, as: DockStaff }
          trigger:
            - { call: "POST /reservations", payload: { member_id: "${m}", dock_id: "${hd}", boat_type: "CENTER_CONSOLE", start_time: "2026-05-06T10:00:00Z", end_time: "2026-05-06T12:00:00Z" }, as: Member, as_user_id: "${m}", captures: { err: "$.data.error_id" } }
          assert:
            - "response status == 422"
            - "response data.error_id == ERR_CERT_INSUFFICIENT"
            - "response data.error_id != ERR_OUTSTANDING_FEES"

