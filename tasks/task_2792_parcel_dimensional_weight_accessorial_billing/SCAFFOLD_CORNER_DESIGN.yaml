            - "The DELIVERED filter returns total_count == 1 with ${first_delivered} == ${p1}"
            - "The IN_TRANSIT page returns total_count == 2, two items and has_more == false"
            - "The limit 2 / offset 2 page returns one item with ${page2_first} == ${p3}, total_count == 3 and has_more == false"
            - "The limit 0 call returns HTTP 400 with ${err} == ERR_INVALID_PAGINATION"

      - name: waiving_an_accessorial_is_an_action_endpoint_that_moves_money
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /accessorial-charges/{id}/waive]
          - state_machines.AccessorialCharge.ASSESSED_to_WAIVED
          - calculations.billing_reconciliation_branch
        distinguishing_aspect: |
          There is no PATCH on AccessorialCharge: the only way to stop a charge is the waive
          action, which keeps the row at its original amount_cents 590 but flips it to WAIVED,
          drops the shipment's accessorial_total to 0 and reprices the OPEN invoice line from
          3250 to 2660. A second waive is a 409, so the action is not idempotent.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with ACTIVE contract C1 (divisor 139, min charge 1195, zone-2 rows 380/340/305, residential_waived false) and ServiceLevel EXPRESS."
            - "Parcel 1Z-E-2001 is 12 x 10 x 8 in at 6.0 lb, zone 2, residential_declared true, so it carries one ASSESSED AUTO RESIDENTIAL charge of 590."
            - "It is delivered and swept onto INV1, which is left OPEN with one line of 3250."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
                residential_waived: false
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-E-2001", zone: 2, residential_declared: true, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { p: $.data.id }
            - call: "POST /shipments/${p}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /invoices"
              payload: { shipper_id: "${sh}", period_start: "2026-08-01", period_end: "2026-08-01" }
              as: BillingOps
              captures: { inv: $.data.id, net0: $.data.net_amount_cents }
            - call: "GET /shipments/${p}/accessorials"
              payload: {}
              as: BillingOps
              captures: { acc: "$.data[0].id", acc_amt: "$.data[0].amount_cents" }
          trigger:
            - call: "POST /accessorial-charges/${acc}/waive"
              payload: { reason: "goodwill: commercial dock confirmed" }
              as: BillingOps
              captures: { st: $.data.status, amt: $.data.amount_cents, av: $.data.version }
            - call: "GET /invoices/${inv}"
              payload: {}
              as: BillingOps
              captures: { net1: $.data.net_amount_cents, acc_sub: $.data.accessorial_subtotal_cents }
            - call: "GET /shipments/${p}"
              payload: {}
              as: BillingOps
              captures: { sh_acc: $.data.accessorial_total_cents }
            - call: "POST /accessorial-charges/${acc}/waive"
              payload: { reason: "second attempt" }
              as: BillingOps
              captures: { err: $.data.error_id }
          assert:
            - "${acc_amt} == 590 and ${net0} == 3250 before the action"
            - "The waive returns HTTP 200 with ${st} == WAIVED, ${amt} == 590 (the row keeps its historical amount) and ${av} == 2"
            - "${sh_acc} == 0 — a WAIVED charge no longer contributes to the shipment's accessorial total"
            - "${net1} == 2660 and ${acc_sub} == 0 — the OPEN invoice line was repriced in place (billing_reconciliation_branch BRANCH B), not adjusted"
            - "GET /billing-adjustments returns total_count == 0 — an OPEN invoice needs no adjustment row"
            - "The second waive returns HTTP 409 with ${err} == ERR_ACCESSORIAL_NOT_WAIVABLE and the charge's version stays 2"

      - name: the_guarantee_audit_sweep_files_every_eligible_claim_in_one_call
        claim_type: bulk_action
        grounds:
          - endpoints[POST /guarantee-claims/scan]
          - calculations.guarantee_refund
          - validations[priority=53]  # ERR_SHIPMENT_NOT_LATE
        distinguishing_aspect: |
          The audit sweep is the bulk form of POST /guarantee-claims: over three delivered
