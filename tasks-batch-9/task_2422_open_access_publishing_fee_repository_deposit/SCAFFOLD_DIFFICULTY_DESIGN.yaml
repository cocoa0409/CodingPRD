      - name: fund_auto_freeze_at_exactly_ninety_eight_percent_vs_one_cent_below
        grounds:
          - calculations.apc_fund_waterfall_allocation
          - state_machines.APCFund.OPEN_to_FROZEN
          - entities.APCFund.fields.freeze_reason
          - entities.APCFund.fields.available_cents
        distinguishing_aspect: |
          Fund A ends at committed_cents 196000 against round_half_up(200000 * 0.98) ==
          196000, so the inclusive `>=` threshold freezes it with freeze_reason
          AUTO_THRESHOLD, while fund B ends at 195999 — one cent below the identical
          threshold — and stays OPEN with freeze_reason null.
