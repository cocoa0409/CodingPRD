  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: budget_commit_release_conserves_cap
        grounds:
          - state_machines.BillingClaim.DRAFT_to_SUBMITTED
          - state_machines.BillingClaim.SUBMITTED_to_DENIED
          - entities.PilotProgram.fields.available_budget_cents
          - entities.PilotProgram.fields.committed_spend_cents
        distinguishing_aspect: |
          Conserved quantity = budget cents: committed_spend_cents + available_budget_cents ==
          budget_cap_cents (1000000) always; a submit (commit 65000) followed by its
          compensating denial restores available to 1000000 and committed to 0.
        test_recipe:
          setup:
            - "Enrollment with ACTIVE CarePlan and one completed home visit; a claim submitted (committing 65000)."
          setup_api_calls:
            - call: "POST /mih/payers"
              payload: { name: "BlueMIH", payer_type: "MEDICAID" }
              as: ProgramAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /mih/programs"
              payload: { name: "P16", payer_id: "${payer_id}", budget_cap_cents: 1000000, enrollment_cap: 10, per_visit_rate_cents: 15000, per_telehealth_rate_cents: 8000, diversion_bonus_cents: 50000, readmission_penalty_cents: 30000, diversion_target_max_ed_visits: 1, avg_ed_cost_cents: 124700, diversion_credit_pct: 0.855, start_date: "2026-01-01T00:00:00Z", end_date: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
