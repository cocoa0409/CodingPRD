            - call: "POST /shop-audits"
              payload: { certificate_id: "${cert_id}", audit_type: "INTERNAL_QMS", scheduled_date: "2026-09-01" }
              as: ShopAdmin
              captures: { audit_id: $.data.id }
            - call: "POST /vessel-jobs"
              payload: { certificate_id: "${cert_id}", job_number: "J-2885-C21", customer_name: "Northline Energy", vessel_type: "PRESSURE_VESSEL", design_code: "DIV1", mawp_psi: 350, design_temp_f: 650, mdmt_f: -20, inside_radius_in: 30, stress_ratio: 1.00 }
              as: ShopAdmin
              captures: { job_id: $.data.id }
            - call: "POST /material-heats"
              payload: { heat_number: "H-5400", spec: "SA-516-70", form: "PLATE", mtr_received: true, mtr_certified_yield_ksi: 41.0, mtr_certified_tensile_ksi: 75.0, quantity_received_lb: 2000.00 }
              as: QCInspector
              as_user_id: "${qc1_id}"
              captures: { heat_id: $.data.id }
            - call: "POST /wps"
              payload: { wps_number: "WPS-94", process: "SMAW", base_metal_p_number: 1, filler_f_number: 4, thickness_min_in: 0.1875, thickness_max_in: 3.0000, position: "1G", pwht_required: false, preheat_min_f: 50, supporting_pqr_number: "PQR-94" }
              as: WeldingEngineer
              as_user_id: "${we1_id}"
              captures: { wps_id: $.data.id }
          assert:
            - "CertificateOfAuthorization.${cert_id}.status == ACTIVE with version == 1 and renewal_count == 0"
            - "ShopAudit.${audit_id}.status == SCHEDULED with version == 1, major_finding_count == 0, minor_finding_count == 0 and satisfactory == false"
            - "VesselJob.${job_id}.status == DRAFT with version == 1"
            - "MaterialHeat.${heat_id}.status == QUARANTINE with version == 1"
            - "WPS.${wps_id}.status == DRAFT with version == 1"

      - name: state_machine_wps_draft_to_qualified_on_qualify
        claim_type: Valid Transition
        grounds:
          - state_machines.WPS.transitions[DRAFT->QUALIFIED]
          - endpoints[POST /wps/{wps_id}/qualify]
        distinguishing_aspect: "The only declared WPS transition: a DRAFT procedure with a non-blank supporting_pqr_number moves to QUALIFIED and its version increments by exactly 1, which is the gate every production weld later depends on."
        test_recipe:
          setup:
            - "WPS-95 exists at DRAFT with supporting_pqr_number PQR-95 and version 1."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Wes Iyer", role_code: "WELDING_ENGINEER", stamp_initials: "WI" }
              as: ShopAdmin
              captures: { we1_id: $.data.id }
            - call: "POST /wps"
              payload: { wps_number: "WPS-95", process: "SMAW", base_metal_p_number: 1, filler_f_number: 4, thickness_min_in: 0.1875, thickness_max_in: 3.0000, position: "1G", pwht_required: false, preheat_min_f: 50, supporting_pqr_number: "PQR-95" }
              as: WeldingEngineer
              as_user_id: "${we1_id}"
              captures: { wps_id: $.data.id }
          trigger:
            - call: "POST /wps/${wps_id}/qualify"
              payload: {}
              as: WeldingEngineer
              as_user_id: "${we1_id}"
          assert:
            - "HTTP 200 and WPS.${wps_id}.status == QUALIFIED"
            - "WPS.${wps_id}.version == 2, one increment for the one transition"
            - "GET /wps?status=QUALIFIED with limit 10 and offset 0 returns total_count == 1 and exactly ${wps_id}"

      - name: state_machine_approve_precondition_requires_submitted_calculation
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.DesignCalculation.transitions[SUBMITTED->APPROVED].preconditions
          - validations[priority=50]
          - errors[ERR_INVALID_CALCULATION_STATE]
        distinguishing_aspect: "The approve transition's first precondition is status = SUBMITTED: approving a sheet that is still DRAFT must fail with ERR_INVALID_CALCULATION_STATE 409, leave reviewed_by_personnel_id null, and leave the parent job in DRAFT — the review step cannot be skipped."
        test_recipe:
          setup:
            - "A DRAFT SHELL calculation sheet prepared by Dana Reyes exists on job J-2885-C23; Efrain Cole is a second DESIGN_ENGINEER."
          setup_api_calls:
            - call: "POST /personnel"
              payload: { full_name: "Dana Reyes", role_code: "DESIGN_ENGINEER", stamp_initials: "DR" }
              as: ShopAdmin
              captures: { de1_id: $.data.id }
