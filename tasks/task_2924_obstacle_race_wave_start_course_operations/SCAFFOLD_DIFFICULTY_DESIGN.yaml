  - rule_id: priority_pair_validation_conflict
    instances:
      - name: held_wave_returns_state_error_not_the_course_safety_or_bottleneck_error
        grounds:
          - validations[priority=9].ERR_WAVE_NOT_RELEASABLE
          - validations[priority=12].ERR_COURSE_UNSAFE
          - validations[priority=32].ERR_BOTTLENECK_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          One vacate leaves THREE release-time rules violated at once on the same request:
          the state rule at priority 9 (the heat is HELD, not SCHEDULED), the safety rule at
          priority 12 (readiness_posture is RESTRICTED) and the fiscal rule at priority 32
          (capacity 112 exceeds floor(0 * 15 / 60) == 0). The ordered list must surface the
          lowest priority number, ERR_WAVE_NOT_RELEASABLE, and never ERR_COURSE_UNSAFE or
          ERR_BOTTLENECK_CAPACITY_EXCEEDED. A control call on the unhold endpoint, where the
          state rule is satisfied, proves the priority-12 rule really is violated.
