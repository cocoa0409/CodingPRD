              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_id: $.data.id, p_v: $.data.version }
          trigger:
            - call: "POST /v1/dock-reservations"
              payload: { project_id: "${p_id}", start_utc: "2026-08-05T00:00:00Z", end_utc: "2026-08-05T00:00:00Z", expected_project_version: "${p_v}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_RESERVATION_WINDOW_INVALID"
      - name: tm_item_missing_hours_returns_pricing_invalid
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_PRICING_INPUT_INVALID]"]
        distinguishing_aspect: "Conditional validation: TIME_AND_MATERIALS without estimated_hours is ERR_PRICING_INPUT_INVALID, even though estimated_hours is not a schema-required field for other modes."
