  - section: consistency_model
    instances:
      - name: ratify_response_already_carries_the_allocation_no_second_read_required
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Budget.transitions.NOTICED_to_ADOPTED.side_effects
          - calculations.assessment_allocation
        distinguishing_aspect: "Under immediate consistency the ratify response body itself must contain the fully populated allocation_snapshot and adopted_at; a response that returns the ADOPTED status with allocation_snapshot still null (populated only by a later read) violates the model even if the follow-up GET is correct."
        test_recipe:
          setup:
            - "A NOTICED fiscal-2026 budget (13200000 total) over two 5000 bp units with a convened meeting."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: CommunityManager
              payload: { current_utc: "2026-08-01T00:00:00Z" }
            - call: "POST /associations"
              as: CommunityManager
              payload: { legal_name: "Harbor Point Condominium Association", board_quorum_seats: 1 }
