      - name: xlayer_version_pinning_snapshot_retained
        claim_type: version_pinning
        grounds: [entities.LabelVersion.fields.panel_snapshot_id, state_machines.LabelVersion.review_status=DRAFT_to_review_status=IN_REVIEW]
        distinguishing_aspect: "Submit-review pins the latest CURRENT panel; a later panel computation does NOT retarget the pinned snapshot; reject + resubmit re-pins the newer panel."
        test_recipe:
          setup: ["client, product, LOCKED recipe, DATABASE panel p1, RACC, label submitted (snapshot p1); then second DATABASE panel p2 computed"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "Acme Foods", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cookie", product_category: "BAKED_GOOD", net_weight_g: 110, total_surface_area_sq_in: 30.0, pdp_area_sq_in: 6.0, household_unit_name: "piece", household_unit_weight_g: 27.5 }, as: ClientRep, as_user_id: "${cid}", captures: { pid: $.data.id, pver: $.data.version } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Wafers", kcal_per_100g: 400, fat_g_per_100g: 8.0, satfat_g_per_100g: 2.0, chol_mg_per_100g: 0, sodium_mg_per_100g: 200, carb_g_per_100g: 70, fiber_g_per_100g: 2.0, sugar_g_per_100g: 20.0, protein_g_per_100g: 5.0 }, as: ClientRep, as_user_id: "${cid}", captures: { i_waf: $.data.id } }
            - { call: "POST /api/products/${pid}/recipes", payload: { name: "v1", lines: [ { ingredient_id: "${i_waf}", quantity_g: 100 } ] }, as: ClientRep, as_user_id: "${cid}", captures: { rid: $.data.id } }
            - { call: "POST /api/recipes/${rid}/lock", as: ClientRep, as_user_id: "${cid}" }
            - { call: "POST /api/recipes/${rid}/nutrient-panels", payload: { method: "DATABASE" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { pan1: $.data.id } }
            - { call: "POST /api/products/${pid}/racc-assignments", payload: { market_code: "US_FDA" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { ra: $.data.id } }
            - { call: "POST /api/products/${pid}/label-versions", payload: { market_code: "US_FDA", nutrient_basis: "DATABASE", racc_assignment_id: "${ra}", declared_format: "TABULAR", declared_type_size_in: 0.0625, ingredient_statement_text: "Wafers", contains_text: "Contains: None.", expected_product_version: "${pver}" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { lv: $.data.id } }
            - { call: "POST /api/label-versions/${lv}/submit-review", as: LabelAnalyst, as_user_id: "analyst-1", captures: { snap1: $.data.panel_snapshot_id } }
            - { call: "POST /api/recipes/${rid}/nutrient-panels", payload: { method: "DATABASE" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { pan2: $.data.id } }
          trigger:
            - { call: "GET /api/label-versions/${lv}", as: PlatformAdmin, captures: { snap_held: $.data.panel_snapshot_id } }
            - { call: "POST /api/label-versions/${lv}/reject", payload: { reason: "re-pin" }, as: RegulatoryReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /api/label-versions/${lv}/submit-review", as: LabelAnalyst, as_user_id: "analyst-1", captures: { snap2: $.data.panel_snapshot_id } }
          assert:
            - "snap1 == pan1 and snap_held == pan1 (p2's creation did not retarget the pinned snapshot)"
            - "snap2 == pan2 (resubmit pins the latest CURRENT panel by created_at)"

  # ===================================================================
  # Section: consistency_model
  # ===================================================================
  - section: consistency_model
    instances:
      - name: consistency_immediate_visibility
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "All mutations are visible synchronously: lock returns status LOCKED and a subsequent GET shows LOCKED with refreshed updated_at; panel computation returns computed fields in the same response."
        test_recipe:
          setup: ["client, product, ingredient, recipe DRAFT"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "Acme Foods", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cookie", product_category: "BAKED_GOOD", net_weight_g: 110, total_surface_area_sq_in: 30.0, pdp_area_sq_in: 6.0 }, as: ClientRep, as_user_id: "${cid}", captures: { pid: $.data.id } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Wafers", kcal_per_100g: 400, fat_g_per_100g: 8.0, satfat_g_per_100g: 2.0, chol_mg_per_100g: 0, sodium_mg_per_100g: 200, carb_g_per_100g: 70, fiber_g_per_100g: 2.0, sugar_g_per_100g: 20.0, protein_g_per_100g: 5.0 }, as: ClientRep, as_user_id: "${cid}", captures: { i_waf: $.data.id } }
            - { call: "POST /api/products/${pid}/recipes", payload: { name: "v1", lines: [ { ingredient_id: "${i_waf}", quantity_g: 100 } ] }, as: ClientRep, as_user_id: "${cid}", captures: { rid: $.data.id, r_updated0: $.data.updated_at } }
          trigger:
            - { call: "POST /api/recipes/${rid}/lock", as: ClientRep, as_user_id: "${cid}", captures: { r_status: $.data.status } }
            - { call: "GET /api/recipes/${rid}", as: PlatformAdmin, captures: { r_status2: $.data.status, r_updated1: $.data.updated_at, r_ver: $.data.version } }
            - { call: "POST /api/recipes/${rid}/nutrient-panels", payload: { method: "DATABASE" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { pan_kcal: $.data.kcal_per_100g, pan_status: $.data.status } }
          assert:
            - "r_status == LOCKED and r_status2 == LOCKED (same-request and follow-up reads agree)"
            - "r_ver == 2 and r_updated1 > r_updated0 (mutation refreshed version and updated_at)"
            - "pan_status == CURRENT and pan_kcal == 400.0 (computed fields present in the write response — no eventual lag)"
