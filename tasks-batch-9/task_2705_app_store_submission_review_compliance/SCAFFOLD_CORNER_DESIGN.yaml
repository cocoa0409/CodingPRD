              as: ComplianceOfficer
              as_user_id: "${acct_id}"
            - *c_rule_v2
            - *c_rule_v2_pub
            - *c_ia_list
            - *c_ia_start
          trigger:
            - call: "POST /impact-assessments/${ia_id}/assess"
              payload: { action: "ACCEPT_NO_CHANGE", note: "Both flows already comply with the new wording." }
