  - rule_id: compensating_invariant
    instances:
      - name: void_permit_conserves_parcel_money_ledger
        grounds:
          - calculations.parcel_fee_ledger
          - calculations.construction_permit_fee
          - state_machines.ConstructionPermit.ISSUED_to_VOIDED
          - entities.Parcel.fields.fee_balance_cents
          - entities.Parcel.fields.fees_credited_cents
        distinguishing_aspect: |
          Conserved quantity #1 is MONEY, pinned as the explicit formula
          fee_balance_cents == fees_assessed_cents - fees_paid_cents - fees_credited_cents.
          Issuing a 73018-cent permit and then voiding that same permit must return
          fee_balance_cents to its exact pre-issue value of 0 while both fees_assessed_cents
          and fees_credited_cents stand at 73018 — the ledger keeps the audit trail but leaks
          no drift.
