          - entities.OutingConsent.fields.effective
        distinguishing_aspect: "A GRANTED consent whose expires_on precedes the outing's departure date is computed effective == false, so the consent dimension never reaches CONSENT_COMPLETE and FINALIZE is refused with ERR_CONSENT_INCOMPLETE even though the escort ratio is satisfied."
        test_recipe:
          setup:
            - "one ADMITTED TIER_1 resident whose consent is GRANTED with expires_on 2026-09-18, one day before the outing departs 2026-09-19"
            - "escort_count is 1 and required_escorts is 1, so the supervision rule at priority 35 passes and cannot mask the consent rule at 36"
