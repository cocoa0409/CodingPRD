            - call: "POST /society/classrooms"
              payload: { school_id: "${y_id}", name: "CY", age_level: "EARLY_CHILDHOOD", declared_age_span_years: 3, enrolled_student_count: 24, assistant_count: 1 }
              as: SchoolAdmin
