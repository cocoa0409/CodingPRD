# §1.8 Scaffold Difficulty Design for task 2730 - Union Representation Election Response.
# Every instance grounds only in elements declared in SCAFFOLD.yaml §1.1-§1.7.
# Every numeric assertion below was executed against the §1.3 formulas and §1.4 constants
# before being written down; no assertion contains an unevaluated expression.
scaffold_difficulty_design:

  # =========================================================================
  # RULE 1 - dual_variant_calc
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: soi_ratio_as_petitioned_denominator
        grounds:
          - calculations.showing_of_interest_ratio
          - entities.Petition.fields.showing_headcount_basis
          - entities.Petition.fields.total_classified_headcount
          - state_machines.Petition.SOI_VERIFIED_to_DISMISSED
        distinguishing_aspect: |
          With at least one Classification still PENDING the ratio must divide by
          total_classified_headcount (110), producing 27.27 and an INSUFFICIENT verdict, whereas the
          AS_RULED sibling instance divides the identical 30 valid cards by included_headcount (90).
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00Z"
            - "one RC petition in SCOPE_ANALYSIS with four classifications totalling 110 heads, every scope_ruling still PENDING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: LaborRelationsDirector
            - call: "POST /labor-relations/petitions"
              payload: { case_number: "07-RC-330011", petition_type: "RC", union_name: "United Plant Workers Local 812", filed_date: "2026-08-03", proposed_unit_description: "All full-time and regular part-time production and maintenance employees at Plant 1", claimed_employee_count: 120, payroll_period_end: "2026-08-14" }
              as: LaborRelationsDirector
              captures: { pet_id: $.data.id }
            - call: "POST /labor-relations/petitions/${pet_id}/open-scope-analysis"
              payload: {}
              as: LaborRelationsDirector
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_id}", code: "PROD", title: "Production Operator", headcount: 60, avg_hourly_wage_cents: 2400, shift_code: "A", work_location: "PLANT_1", supervisory_authority_count: 0, employer_position: "INCLUDE", union_position: "INCLUDE", supervision_overlap: 88, skills_overlap: 90, functional_integration: 92, interchange_rate: 74, work_conditions_overlap: 95 }
              as: LaborRelationsDirector
              captures: { cls_prod_id: $.data.id }
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_id}", code: "MAINT", title: "Maintenance Mechanic", headcount: 30, avg_hourly_wage_cents: 3200, shift_code: "A", work_location: "PLANT_1", supervisory_authority_count: 0, employer_position: "INCLUDE", union_position: "INCLUDE", supervision_overlap: 82, skills_overlap: 78, functional_integration: 86, interchange_rate: 61, work_conditions_overlap: 84 }
              as: LaborRelationsDirector
              captures: { cls_maint_id: $.data.id }
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_id}", code: "QC", title: "Quality Control Inspector", headcount: 12, avg_hourly_wage_cents: 2900, shift_code: "B", work_location: "PLANT_1_LAB", supervisory_authority_count: 0, employer_position: "EXCLUDE", union_position: "INCLUDE", supervision_overlap: 41, skills_overlap: 55, functional_integration: 61, interchange_rate: 21, work_conditions_overlap: 71 }
              as: LaborRelationsDirector
              captures: { cls_qc_id: $.data.id }
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_id}", code: "LEAD", title: "Lead Operator", headcount: 8, avg_hourly_wage_cents: 2800, shift_code: "A", work_location: "PLANT_1", supervisory_authority_count: 4, employer_position: "EXCLUDE", union_position: "INCLUDE", supervision_overlap: 78, skills_overlap: 82, functional_integration: 80, interchange_rate: 66, work_conditions_overlap: 88 }
              as: LaborRelationsDirector
              captures: { cls_lead_id: $.data.id }
          trigger:
            - call: "POST /labor-relations/petitions/${pet_id}/verify-showing"
              payload: { submitted_card_count: 40, duplicate_card_count: 3, undated_card_count: 2, stale_card_count: 2, nonunit_card_count: 3 }
              as: BoardAgent
          assert:
            - "Petition.${pet_id}.valid_card_count == 30"
            - "Petition.${pet_id}.total_classified_headcount == 110"
            - "Petition.${pet_id}.showing_headcount_basis == AS_PETITIONED"
            - "Petition.${pet_id}.showing_of_interest_pct == 27.27"
            - "Petition.${pet_id}.showing_verdict == INSUFFICIENT"
            - "Petition.${pet_id}.case_status == DISMISSED"

      - name: soi_ratio_as_ruled_denominator
        grounds:
          - calculations.showing_of_interest_ratio
          - entities.Petition.fields.included_headcount
          - state_machines.Classification.PENDING_to_INCLUDED
          - state_machines.Classification.PENDING_to_EXCLUDED
          - state_machines.Petition.SCOPE_ANALYSIS_to_SOI_VERIFIED
        distinguishing_aspect: |
          Once every classification is ruled, the same 30 valid cards are divided by
          included_headcount (90) instead of total_classified_headcount (110), so the identical card
          audit flips from 27.27/INSUFFICIENT to 33.33/SUFFICIENT.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00Z"
            - "the four-classification petition of soi_ratio_as_petitioned_denominator, every classification scored and ruled: PROD and MAINT INCLUDED (90 heads), QC and LEAD EXCLUDED (20 heads)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: LaborRelationsDirector
            - call: "POST /labor-relations/petitions"
              payload: { case_number: "07-RC-330012", petition_type: "RC", union_name: "United Plant Workers Local 812", filed_date: "2026-08-03", proposed_unit_description: "All production and maintenance employees at Plant 1", claimed_employee_count: 120, payroll_period_end: "2026-08-14" }
              as: LaborRelationsDirector
              captures: { pet_id: $.data.id }
            - call: "POST /labor-relations/petitions/${pet_id}/open-scope-analysis"
              payload: {}
              as: LaborRelationsDirector
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_id}", code: "PROD", title: "Production Operator", headcount: 60, avg_hourly_wage_cents: 2400, shift_code: "A", work_location: "PLANT_1", supervisory_authority_count: 0, employer_position: "INCLUDE", union_position: "INCLUDE", supervision_overlap: 88, skills_overlap: 90, functional_integration: 92, interchange_rate: 74, work_conditions_overlap: 95 }
              as: LaborRelationsDirector
              captures: { cls_prod_id: $.data.id }
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_id}", code: "MAINT", title: "Maintenance Mechanic", headcount: 30, avg_hourly_wage_cents: 3200, shift_code: "A", work_location: "PLANT_1", supervisory_authority_count: 0, employer_position: "INCLUDE", union_position: "INCLUDE", supervision_overlap: 82, skills_overlap: 78, functional_integration: 86, interchange_rate: 61, work_conditions_overlap: 84 }
              as: LaborRelationsDirector
              captures: { cls_maint_id: $.data.id }
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_id}", code: "QC", title: "Quality Control Inspector", headcount: 12, avg_hourly_wage_cents: 2900, shift_code: "B", work_location: "PLANT_1_LAB", supervisory_authority_count: 0, employer_position: "EXCLUDE", union_position: "INCLUDE", supervision_overlap: 41, skills_overlap: 55, functional_integration: 61, interchange_rate: 21, work_conditions_overlap: 71 }
              as: LaborRelationsDirector
              captures: { cls_qc_id: $.data.id }
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_id}", code: "LEAD", title: "Lead Operator", headcount: 8, avg_hourly_wage_cents: 2800, shift_code: "A", work_location: "PLANT_1", supervisory_authority_count: 4, employer_position: "EXCLUDE", union_position: "INCLUDE", supervision_overlap: 78, skills_overlap: 82, functional_integration: 80, interchange_rate: 66, work_conditions_overlap: 88 }
              as: LaborRelationsDirector
              captures: { cls_lead_id: $.data.id }
            - call: "POST /labor-relations/classifications/${cls_prod_id}/score"
              payload: { scoring_standard: "TRADITIONAL" }
              as: EmploymentCounsel
            - call: "POST /labor-relations/classifications/${cls_maint_id}/score"
              payload: { scoring_standard: "TRADITIONAL" }
              as: EmploymentCounsel
            - call: "POST /labor-relations/classifications/${cls_qc_id}/score"
              payload: { scoring_standard: "TRADITIONAL" }
              as: EmploymentCounsel
            - call: "POST /labor-relations/classifications/${cls_lead_id}/score"
              payload: { scoring_standard: "TRADITIONAL" }
              as: EmploymentCounsel
            - call: "POST /labor-relations/classifications/${cls_prod_id}/rule"
              payload: { ruling: "INCLUDED", ruling_rationale: "Core production group, undisputed" }
              as: BoardAgent
            - call: "POST /labor-relations/classifications/${cls_maint_id}/rule"
              payload: { ruling: "INCLUDED", ruling_rationale: "Shares supervision and conditions with production" }
              as: BoardAgent
            - call: "POST /labor-relations/classifications/${cls_qc_id}/rule"
              payload: { ruling: "EXCLUDED", ruling_rationale: "Distinct laboratory community of interest" }
              as: BoardAgent
            - call: "POST /labor-relations/classifications/${cls_lead_id}/rule"
              payload: { ruling: "EXCLUDED", ruling_rationale: "Statutory supervisor under Section 2(11)" }
              as: BoardAgent
          trigger:
            - call: "POST /labor-relations/petitions/${pet_id}/verify-showing"
              payload: { submitted_card_count: 40, duplicate_card_count: 3, undated_card_count: 2, stale_card_count: 2, nonunit_card_count: 3 }
              as: BoardAgent
          assert:
            - "Petition.${pet_id}.included_headcount == 90"
            - "Petition.${pet_id}.excluded_headcount == 20"
            - "Petition.${pet_id}.pending_headcount == 0"
            - "Petition.${pet_id}.showing_headcount_basis == AS_RULED"
            - "Petition.${pet_id}.showing_of_interest_pct == 33.33"
            - "Petition.${pet_id}.showing_verdict == SUFFICIENT"
            - "Petition.${pet_id}.case_status == SOI_VERIFIED"

      - name: voter_list_deadline_directed_anchor
        grounds:
          - calculations.deadline_schedule
          - entities.ElectionAgreement.fields.voter_list_due_at
          - entities.ElectionAgreement.fields.decision_date
          - state_machines.ElectionAgreement.HEARING_REQUESTED_to_DIRECTED
        distinguishing_aspect: |
          The DIRECTED variant anchors the two-business-day voter-list deadline on decision_date
          (2026-08-25 -> 2026-08-27T23:59:59Z), while the STIPULATED variant anchors it on the
          approval instant, which on the same 2026-08-27T10:00:00Z clock would yield
          2026-08-31T23:59:59Z - a different entity field pair and a different calendar anchor from
          the showing-of-interest instances.
        test_recipe:
          setup:
            - "petition in SOI_VERIFIED with all four classifications ruled"
            - "an ElectionAgreement in HEARING_REQUESTED because the employer refused to stipulate"
            - "logical clock advanced to 2026-08-27T10:00:00Z, two days after the hearing decision date"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: LaborRelationsDirector
            - call: "POST /labor-relations/petitions"
              payload: { case_number: "07-RC-330013", petition_type: "RC", union_name: "United Plant Workers Local 812", filed_date: "2026-08-03", proposed_unit_description: "All production and maintenance employees at Plant 1", claimed_employee_count: 120, payroll_period_end: "2026-08-14" }
              as: LaborRelationsDirector
              captures: { pet_id: $.data.id }
            - call: "POST /labor-relations/petitions/${pet_id}/open-scope-analysis"
              payload: {}
              as: LaborRelationsDirector
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_id}", code: "PROD", title: "Production Operator", headcount: 60, avg_hourly_wage_cents: 2400, shift_code: "A", work_location: "PLANT_1", supervisory_authority_count: 0, employer_position: "INCLUDE", union_position: "INCLUDE", supervision_overlap: 88, skills_overlap: 90, functional_integration: 92, interchange_rate: 74, work_conditions_overlap: 95 }
              as: LaborRelationsDirector
              captures: { cls_prod_id: $.data.id }
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_id}", code: "MAINT", title: "Maintenance Mechanic", headcount: 30, avg_hourly_wage_cents: 3200, shift_code: "A", work_location: "PLANT_1", supervisory_authority_count: 0, employer_position: "INCLUDE", union_position: "INCLUDE", supervision_overlap: 82, skills_overlap: 78, functional_integration: 86, interchange_rate: 61, work_conditions_overlap: 84 }
              as: LaborRelationsDirector
              captures: { cls_maint_id: $.data.id }
            - call: "POST /labor-relations/classifications/${cls_prod_id}/score"
              payload: { scoring_standard: "TRADITIONAL" }
              as: EmploymentCounsel
            - call: "POST /labor-relations/classifications/${cls_maint_id}/score"
              payload: { scoring_standard: "TRADITIONAL" }
              as: EmploymentCounsel
            - call: "POST /labor-relations/classifications/${cls_prod_id}/rule"
              payload: { ruling: "INCLUDED", ruling_rationale: "Core production group" }
              as: BoardAgent
            - call: "POST /labor-relations/classifications/${cls_maint_id}/rule"
              payload: { ruling: "INCLUDED", ruling_rationale: "Integrated with production" }
              as: BoardAgent
            - call: "POST /labor-relations/petitions/${pet_id}/verify-showing"
              payload: { submitted_card_count: 40, duplicate_card_count: 3, undated_card_count: 2, stale_card_count: 2, nonunit_card_count: 3 }
              as: BoardAgent
            - call: "POST /labor-relations/election-agreements"
              payload: { petition_id: "${pet_id}", agreement_type: "STIPULATED", proposed_election_date: "2026-09-01", proposed_voting_method: "MANUAL" }
              as: LaborRelationsDirector
              captures: { agr_id: $.data.id }
            - call: "POST /labor-relations/election-agreements/${agr_id}/request-hearing"
              payload: { hearing_requested_by_party: "EMPLOYER" }
              as: LaborRelationsDirector
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-27T10:00:00Z" }
              as: BoardAgent
          trigger:
            - call: "POST /labor-relations/election-agreements/${agr_id}/direct-election"
              payload: { decision_date: "2026-08-25", approved_election_date: "2026-09-15", voting_method: "MANUAL", polls_open_at: "2026-09-15T06:00:00Z", polls_close_at: "2026-09-15T17:00:00Z" }
              as: BoardAgent
          assert:
            - "ElectionAgreement.${agr_id}.status == DIRECTED"
            - "ElectionAgreement.${agr_id}.route == DIRECTED"
            - "ElectionAgreement.${agr_id}.voter_list_due_at == 2026-08-27T23:59:59Z"
            - "Petition.${pet_id}.case_status == ELECTION_SET"
            - "GET /labor-relations/election-rounds?petition_id=${pet_id} returns exactly one round with round_number == 1 and status == SCHEDULED"

  # =========================================================================
  # RULE 2 - combinatorial_formula  (three modes over IDENTICAL inputs)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: coi_mode_traditional_weighted_mean
        grounds:
          - calculations.community_of_interest_score
          - calculations.core_wage_snapshot
          - entities.Classification.fields.scoring_standard
          - entities.Classification.fields.coi_score
          - entities.Classification.fields.wage_proximity
        distinguishing_aspect: |
          Mode TRADITIONAL sums all six per-term-rounded weighted factors and returns 50.68 for the
          QC factor set, which is numerically different from the OVERWHELMING (35.84) and ACCRETION
          (42.00) results computed from exactly the same stored inputs.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00Z"
            - "petition in SCOPE_ANALYSIS with PROD (60 @ 2400, both positions INCLUDE), MAINT (30 @ 3200, both INCLUDE) and QC (12 @ 2900, employer EXCLUDE / union INCLUDE, factors 41/55/61/21/71, supervisory_authority_count 0)"
            - "no classification has been scored yet, so the core wage snapshot is still null"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: LaborRelationsDirector
            - call: "POST /labor-relations/petitions"
              payload: { case_number: "07-RC-330021", petition_type: "RC", union_name: "United Plant Workers Local 812", filed_date: "2026-08-03", proposed_unit_description: "All production and maintenance employees at Plant 1", claimed_employee_count: 120, payroll_period_end: "2026-08-14" }
              as: LaborRelationsDirector
              captures: { pet_id: $.data.id }
            - call: "POST /labor-relations/petitions/${pet_id}/open-scope-analysis"
              payload: {}
              as: LaborRelationsDirector
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_id}", code: "PROD", title: "Production Operator", headcount: 60, avg_hourly_wage_cents: 2400, shift_code: "A", work_location: "PLANT_1", supervisory_authority_count: 0, employer_position: "INCLUDE", union_position: "INCLUDE", supervision_overlap: 88, skills_overlap: 90, functional_integration: 92, interchange_rate: 74, work_conditions_overlap: 95 }
              as: LaborRelationsDirector
              captures: { cls_prod_id: $.data.id }
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_id}", code: "MAINT", title: "Maintenance Mechanic", headcount: 30, avg_hourly_wage_cents: 3200, shift_code: "A", work_location: "PLANT_1", supervisory_authority_count: 0, employer_position: "INCLUDE", union_position: "INCLUDE", supervision_overlap: 82, skills_overlap: 78, functional_integration: 86, interchange_rate: 61, work_conditions_overlap: 84 }
              as: LaborRelationsDirector
              captures: { cls_maint_id: $.data.id }
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_id}", code: "QC", title: "Quality Control Inspector", headcount: 12, avg_hourly_wage_cents: 2900, shift_code: "B", work_location: "PLANT_1_LAB", supervisory_authority_count: 0, employer_position: "EXCLUDE", union_position: "INCLUDE", supervision_overlap: 41, skills_overlap: 55, functional_integration: 61, interchange_rate: 21, work_conditions_overlap: 71 }
              as: LaborRelationsDirector
              captures: { cls_qc_id: $.data.id }
          trigger:
            - call: "POST /labor-relations/classifications/${cls_qc_id}/score"
              payload: { scoring_standard: "TRADITIONAL" }
              as: EmploymentCounsel
          assert:
            - "Petition.${pet_id}.core_avg_hourly_wage_cents == 2667"
            - "Petition.${pet_id}.core_wage_locked_at == 2026-08-03T09:00:00Z"
            - "Classification.${cls_qc_id}.wage_proximity == 91.26"
            - "Classification.${cls_qc_id}.coi_score == 50.68"
            - "Classification.${cls_qc_id}.scoring_standard == TRADITIONAL"
            - "Classification.${cls_qc_id}.coi_recommendation == CONTESTED_COMMUNITY"

      - name: coi_mode_overwhelming_min_anchored
        grounds:
          - calculations.community_of_interest_score
          - entities.Classification.fields.scoring_standard
          - entities.Classification.fields.coi_recommendation
        distinguishing_aspect: |
          Mode OVERWHELMING replaces the plain weighted mean with 0.5 * weighted_mean + 0.5 * the
          single weakest factor (interchange_rate 21), returning 35.84 - not the TRADITIONAL 50.68 -
          and dropping the verdict from CONTESTED_COMMUNITY to DISTINCT_COMMUNITY on identical inputs.
        test_recipe:
          setup:
            - "identical petition, PROD, MAINT and QC rows as coi_mode_traditional_weighted_mean"
            - "logical clock at 2026-08-03T09:00:00Z, nothing scored yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: LaborRelationsDirector
            - call: "POST /labor-relations/petitions"
              payload: { case_number: "07-RC-330022", petition_type: "RC", union_name: "United Plant Workers Local 812", filed_date: "2026-08-03", proposed_unit_description: "All production and maintenance employees at Plant 1", claimed_employee_count: 120, payroll_period_end: "2026-08-14" }
              as: LaborRelationsDirector
              captures: { pet_id: $.data.id }
            - call: "POST /labor-relations/petitions/${pet_id}/open-scope-analysis"
              payload: {}
              as: LaborRelationsDirector
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_id}", code: "PROD", title: "Production Operator", headcount: 60, avg_hourly_wage_cents: 2400, shift_code: "A", work_location: "PLANT_1", supervisory_authority_count: 0, employer_position: "INCLUDE", union_position: "INCLUDE", supervision_overlap: 88, skills_overlap: 90, functional_integration: 92, interchange_rate: 74, work_conditions_overlap: 95 }
              as: LaborRelationsDirector
              captures: { cls_prod_id: $.data.id }
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_id}", code: "MAINT", title: "Maintenance Mechanic", headcount: 30, avg_hourly_wage_cents: 3200, shift_code: "A", work_location: "PLANT_1", supervisory_authority_count: 0, employer_position: "INCLUDE", union_position: "INCLUDE", supervision_overlap: 82, skills_overlap: 78, functional_integration: 86, interchange_rate: 61, work_conditions_overlap: 84 }
              as: LaborRelationsDirector
              captures: { cls_maint_id: $.data.id }
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_id}", code: "QC", title: "Quality Control Inspector", headcount: 12, avg_hourly_wage_cents: 2900, shift_code: "B", work_location: "PLANT_1_LAB", supervisory_authority_count: 0, employer_position: "EXCLUDE", union_position: "INCLUDE", supervision_overlap: 41, skills_overlap: 55, functional_integration: 61, interchange_rate: 21, work_conditions_overlap: 71 }
              as: LaborRelationsDirector
              captures: { cls_qc_id: $.data.id }
          trigger:
            - call: "POST /labor-relations/classifications/${cls_qc_id}/score"
              payload: { scoring_standard: "OVERWHELMING" }
              as: EmploymentCounsel
          assert:
            - "Classification.${cls_qc_id}.wage_proximity == 91.26"
            - "Classification.${cls_qc_id}.coi_score == 35.84"
            - "Classification.${cls_qc_id}.scoring_standard == OVERWHELMING"
            - "Classification.${cls_qc_id}.coi_recommendation == DISTINCT_COMMUNITY"

      - name: coi_mode_accretion_integration_only
        grounds:
          - calculations.community_of_interest_score
          - entities.Classification.fields.coi_score
          - entities.Classification.fields.coi_recommendation
        distinguishing_aspect: |
          Mode ACCRETION drops three of the six factors entirely and reweights the remaining three
          (0.40 functional_integration + 0.35 interchange_rate + 0.25 supervision_overlap), returning
          exactly 42.00 - so skills_overlap, work_conditions_overlap and wage_proximity have provably
          zero influence, unlike both other modes.
        test_recipe:
          setup:
            - "identical petition, PROD, MAINT and QC rows as coi_mode_traditional_weighted_mean"
            - "logical clock at 2026-08-03T09:00:00Z, nothing scored yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: LaborRelationsDirector
            - call: "POST /labor-relations/petitions"
              payload: { case_number: "07-RC-330023", petition_type: "RC", union_name: "United Plant Workers Local 812", filed_date: "2026-08-03", proposed_unit_description: "All production and maintenance employees at Plant 1", claimed_employee_count: 120, payroll_period_end: "2026-08-14" }
              as: LaborRelationsDirector
              captures: { pet_id: $.data.id }
            - call: "POST /labor-relations/petitions/${pet_id}/open-scope-analysis"
              payload: {}
              as: LaborRelationsDirector
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_id}", code: "PROD", title: "Production Operator", headcount: 60, avg_hourly_wage_cents: 2400, shift_code: "A", work_location: "PLANT_1", supervisory_authority_count: 0, employer_position: "INCLUDE", union_position: "INCLUDE", supervision_overlap: 88, skills_overlap: 90, functional_integration: 92, interchange_rate: 74, work_conditions_overlap: 95 }
              as: LaborRelationsDirector
              captures: { cls_prod_id: $.data.id }
