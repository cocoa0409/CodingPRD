              payload: { delivery_order_id: "${o1}", fault_code: "COURIER_DELAY", claimed_amount_cents: 100 }
              as: Courier
              as_user_id: "${c_id}"
              captures: { e3: $.data.error_id }
          assert:
            - "e1 == ERR_UNAUTHORIZED_ROLE and e2 == ERR_UNAUTHORIZED_ROLE and e3 == ERR_UNAUTHORIZED_ROLE (all 403)"
            - "DeliveryOrder.${o1}.fulfillment_status still QUOTED"

      - name: support_agent_cannot_decide_merchant_config_or_drive_deliveries
        claim_type: Violation -> Error
        grounds:
          - roles.SupportAgent
          - errors.ERR_UNAUTHORIZED_ROLE
        distinguishing_aspect: "SupportAgent is a review-only writer: decide and start-review are allowed, but pricing-policy activation (Merchant), complete-delivery (Courier) and report finalize (PlatformAdmin) each 403 — peer-role exclusivity holds in all three directions."
        test_recipe:
          setup:
            - "Base chain through o1 IN_TRANSIT with a FILED claim and an OPEN report."
          setup_api_calls:
            - *c_clock
            - *c_merchant
            - *c_activate
            - *c_store
            - *c_policy
            - *c_mgetv
            - *c_pact
            - *c_courier
            - *c_quote1
            - *c_order1
            - *c_accept
            - *c_ready
            - *c_batch
            - *c_dispatch
            - *c_pickup
            - *c_transit
            - *c_claim
            - call: "POST /merchants/${m_id}/sla-reports"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /merchants/${m_id}/pricing-policies/${p_id}/activate"
              payload: { expected_merchant_version: "${m_v}" }
              as: SupportAgent
              captures: { e1: $.data.error_id }
            - call: "POST /delivery-orders/${o1}/complete-delivery"
              payload: {}
              as: SupportAgent
              captures: { e2: $.data.error_id }
            - call: "POST /sla-reports/${r_id}/finalize"
              payload: {}
              as: SupportAgent
              captures: { e3: $.data.error_id }
          assert:
            - "e1 == ERR_UNAUTHORIZED_ROLE (403)"
            - "e2 == ERR_UNAUTHORIZED_ROLE (403)"
            - "e3 == ERR_UNAUTHORIZED_ROLE (403)"
            - "SupportAgent can still perform its own exclusive op: POST /refund-claims/${cl_id}/start-review as SupportAgent returns 200"

      - name: missing_role_header_rejected_before_any_business_check
        claim_type: Violation -> Error
        grounds:
          - validations.priority_1
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "A request with no X-User-Role header fails 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER even when the path id is also bogus — auth (priority 1) precedes existence (priority 3)."
        test_recipe:
          setup:
            - "Logical clock set; empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /merchants/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "400 and err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (not 404 ERR_MERCHANT_NOT_FOUND)"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: occ_version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[policy-activate-stale-merchant]
          - entities.Merchant
        distinguishing_aspect: "Merchant.version starts 1 and increments on every mutation observable through the OCC field: create 1 -> activate 2 -> PATCH config 3 -> policy activate 4; a stale expected_merchant_version fails 412 while the fresh value succeeds."
        test_recipe:
          setup:
            - "Logical clock set; merchant created (v1), activated (v2)."
          setup_api_calls:
            - *c_clock
            - *c_merchant
            - *c_activate
            - *c_store
            - *c_policy
          trigger:
            - call: "PATCH /merchants/${m_id}"
              payload: { default_refund_split_merchant_pct: 60 }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { v3: $.data.version }
            - call: "POST /merchants/${m_id}/pricing-policies/${p_id}/activate"
              payload: { expected_merchant_version: "${v3}" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { v4: $.data.version }
            - call: "POST /merchants/${m_id}/pricing-policies/${p_id}/activate"
              payload: { expected_merchant_version: "${v3}" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "v3 == 3 (PATCH bumped the version)"
            - "policy activate with fresh version succeeds; v4 == 1 on the policy but Merchant now reports version 4"
            - "replay with stale ${v3}: 412 err == ERR_STALE_MERCHANT_VERSION"
            - "Merchant.${m_id}.default_refund_split_merchant_pct == 60 persisted"

      - name: cascading_side_effects_and_threshold_and_pagination
        claim_type: excluded_because
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: "transitive_cascade / refund_settle_cascade_to_merchant_suspension_and_order_cancellation"
          rationale: "N-level cascade ordering asserted there; threshold triggers covered by boundary_precision instances; pagination covered by delivery_orders_list_pagination_and_status_filter in entities."

      - name: idempotency_layer
        claim_type: idempotency
        grounds:
          - entities.DeliveryOrder.fields.idempotency_key
        distinguishing_aspect: "The idempotency layer is fully exercised by the endpoints-section corner order_create_idempotency_key_replay_returns_original in this file; no duplicate corner needed."
        excluded_because:
          difficulty_instance: "settle_reverse_restores_billing_balance_exactly"
          rationale: "Not a §1.8 duplicate — the replay semantics are asserted by the §1.9 endpoints-section instance order_create_idempotency_key_replay_returns_original; this stub only prevents double-enumeration."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_consistency_writes_visible_in_same_response_and_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Every mutation is atomic and immediately visible: the accept response itself shows billing_status AUTHORIZED, and the very next GET (no delay, no recompute endpoint) shows merchant balance debited by exactly 500 — no eventual-consistency lag anywhere."
        test_recipe:
          setup:
            - "Base chain through order created."
          setup_api_calls:
            - *c_clock
            - *c_merchant
            - *c_activate
            - *c_store
            - *c_policy
            - *c_mgetv
            - *c_pact
            - *c_quote1
            - *c_order1
          trigger:
            - call: "POST /delivery-orders/${o1}/accept"
              payload: { promised_at: "2026-09-01T02:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { o_billing: $.data.billing_status }
            - call: "GET /merchants/${m_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "o_billing == AUTHORIZED in the accept response itself"
            - "immediate GET: Merchant.${m_id}.billing_balance_cents == 99500"
            - "immediate GET /delivery-orders/${o1}/tracking-events shows the ORDER_ACCEPTED row already"
