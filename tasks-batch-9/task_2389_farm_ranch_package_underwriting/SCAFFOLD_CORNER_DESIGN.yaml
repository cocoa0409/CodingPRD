        excluded_because:
          difficulty_instance: inspector_half_open_window_with_travel_buffer
          rationale: "The §1.8 resource_temporal_overlap pair covers both interval semantics: the half-open inspector window with its 90-minute trailing buffer and the closed-closed policy term overlap, each at its exact touching boundary."

  - section: endpoints
    instances:

      - name: corner_pool_patch_can_drive_available_capacity_negative
        claim_type: standard_crud
        grounds: ["endpoints.PATCH_/cat-capacity-pools/{id}", "entities.CatCapacityPool.fields.available_cents"]
        distinguishing_aspect: "Shrinking total_capacity_cents below the already-reserved amount is accepted and available_cents goes to -10000000: the derived field is recomputed from the new total rather than floored at zero, and the existing reservation is untouched."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, the ZN-1 pool trio, one policy with an RC DWELLING at 40000000 rated to 269200 (HAIL reserved 20000000)"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_pool_hail
            - *k_pool_wind
            - *k_pool_fire
            - *k_acct
            - *k_policy
            - *k_item
            - *k_rate_get
            - *k_rate
            - call: "GET /cat-capacity-pools/${pool_hail}"
              as: PlatformAdmin
              captures: { hail_v: $.data.version, hail_avail: $.data.available_cents }
          trigger:
            - call: "PATCH /cat-capacity-pools/${pool_hail}"
              payload: { expected_pool_version: "${hail_v}", total_capacity_cents: 10000000 }
              as: PlatformAdmin
              captures: { shrunk_avail: $.data.available_cents, shrunk_v: $.data.version }
          assert:
            - "before the PATCH the pool shows total 200000000, reserved 20000000, committed 0 and available_cents 180000000 at version 2 (rating bumped it from 1)"
            - "after the PATCH available_cents == -10000000 = 10000000 - 20000000 - 0 and version == 3"
            - "reserved_cents is still 20000000 and the CatReservation is still RESERVED with amount_cents 20000000 and utilization_at_rating 0.100000"
            - "total_premium_cents on the policy is still 269200 — a pool resize never re-rates a policy"

      - name: corner_compliance_sweep_reports_every_counter_it_moved
        claim_type: bulk_action
        grounds: ["endpoints.POST_/compliance-sweeps", "state_machines.FarmPolicy.compliance_status", "state_machines.LaborProfile[VERIFIED->LAPSED]"]
        distinguishing_aspect: "One unfiltered sweep over two policies moves five different counters at once and only the RATED policy reaches SUSPENDED in the same pass; the immediately repeated sweep returns all-zero deltas, proving the sweep is not double-counting."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z, the ZN-1 pool trio, one Agent, one Inspector"
            - "policy P1 (account A1): DRAFT, one RC DWELLING, one completed INITIAL inspection carrying one MINOR finding due 2026-08-10 -> compliance RECS_OPEN"
            - "policy P2 (account A2): rated to 269200, a VERIFIED labor profile with wc_expiry_date 2026-08-10, then a completed INITIAL inspection carrying one CRITICAL finding due 2026-08-10 -> compliance RECS_OPEN"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - *k_agent
            - *k_pool_hail
            - *k_pool_wind
            - *k_pool_fire
            - *k_inspector
            - call: "POST /farm-accounts"
              payload: { legal_name: "Sweep One Farms", state_code: "KS", county_name: "Reno", cat_zone_code: "ZN-1", acreage: 1200, operation_type: "MIXED" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { acct_s1: $.data.id }
            - call: "POST /farm-policies"
              payload: { account_id: "${acct_s1}", term_start_date: "2026-09-01", term_end_date: "2027-08-31", deductible_cents: 500000 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { pol_s1: $.data.id }
            - call: "POST /farm-policies/${pol_s1}/scheduled-items"
              payload: { item_class: "DWELLING", description: "Ranch house", valuation_basis: "RC", stated_value_cents: 40000000, age_years: 22, condition_grade: "B" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { it_s1: $.data.id }
            - call: "POST /inspections"
              payload: { policy_id: "${pol_s1}", inspector_id: "${insp_id}", inspection_type: "INITIAL", scheduled_for: "2026-08-02T09:00:00Z", duration_minutes: 120 }
              as: Underwriter
              captures: { ins_s1: $.data.id }
            - call: "POST /inspections/${ins_s1}/complete"
              payload: { findings_summary: "extinguisher tags expired", findings: [{ severity: "MINOR", description: "Re-tag the extinguishers", due_date: "2026-08-10" }] }
              as: LossControlSpecialist
              as_user_id: "${insp_id}"
              captures: { s1_hazard: $.data.hazard_score }
            - call: "POST /farm-accounts"
              payload: { legal_name: "Sweep Two Farms", state_code: "KS", county_name: "Reno", cat_zone_code: "ZN-1", acreage: 1200, operation_type: "MIXED" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { acct_s2: $.data.id }
            - call: "POST /farm-policies"
              payload: { account_id: "${acct_s2}", term_start_date: "2026-09-01", term_end_date: "2027-08-31", deductible_cents: 500000 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { pol_s2: $.data.id, pol_s2_v: $.data.version }
            - call: "POST /farm-policies/${pol_s2}/scheduled-items"
              payload: { item_class: "DWELLING", description: "Ranch house", valuation_basis: "RC", stated_value_cents: 40000000, age_years: 22, condition_grade: "B" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { it_s2: $.data.id }
            - call: "PUT /farm-policies/${pol_s2}/labor-profile"
              payload: { full_time_count: 4, seasonal_count: 4, migrant_h2a_count: 0, wc_carrier_name: "Prairie Mutual WC", wc_policy_number: "WC-2026-0011", wc_expiry_date: "2026-08-10" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { lab_s2: $.data.id }
            - call: "POST /labor-profiles/${lab_s2}/wc-verification"
              payload: { note: "certificate on file" }
              as: ComplianceOfficer
              captures: { lab_s2_status: $.data.coordination_status }
            - call: "POST /farm-policies/${pol_s2}/rate"
              payload: { expected_policy_version: "${pol_s2_v}" }
              as: Underwriter
              captures: { s2_total: $.data.total_premium_cents }
            - call: "POST /inspections"
              payload: { policy_id: "${pol_s2}", inspector_id: "${insp_id}", inspection_type: "INITIAL", scheduled_for: "2026-08-03T09:00:00Z", duration_minutes: 120 }
              as: Underwriter
              captures: { ins_s2: $.data.id }
            - call: "POST /inspections/${ins_s2}/complete"
              payload: { findings_summary: "anhydrous storage unguarded", findings: [{ severity: "CRITICAL", description: "Cage the anhydrous tank", due_date: "2026-08-10" }] }
              as: LossControlSpecialist
              as_user_id: "${insp_id}"
              captures: { s2_hazard: $.data.hazard_score }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /compliance-sweeps"
              as: ComplianceOfficer
              captures: { sw_scanned: $.data.policies_scanned, sw_od: $.data.recommendations_marked_overdue, sw_ro: $.data.policies_marked_recs_overdue, sw_susp: $.data.policies_suspended, sw_lapsed: $.data.labor_profiles_lapsed }
            - call: "POST /compliance-sweeps"
              as: ComplianceOfficer
              captures: { sw2_od: $.data.recommendations_marked_overdue, sw2_susp: $.data.policies_suspended, sw2_lapsed: $.data.labor_profiles_lapsed }
          assert:
            - "P1 scored hazard 14 (INITIAL 10 + MINOR 4) and P2 scored 40 (10 + CRITICAL 30); P2 was already RATED when it was inspected, and 40 is only a referral trigger at rating time, so P2 stayed RATED"
            - "the first sweep returns policies_scanned 2, recommendations_marked_overdue 2, policies_marked_recs_overdue 2, policies_suspended 1 and labor_profiles_lapsed 1"
            - "P1 ends at compliance_status RECS_OVERDUE — it is DRAFT, so the RECS_OVERDUE -> SUSPENDED hop is not available to it"
            - "P2 ends at compliance_status SUSPENDED: both hops ran inside the single sweep pass because its uw_status is RATED"
            - "LaborProfile ${lab_s2} ends LAPSED because wc_expiry_date 2026-08-10 is before the 2026-08-15 clock"
            - "the second sweep returns policies_scanned 2 with recommendations_marked_overdue 0, policies_marked_recs_overdue 0, policies_suspended 0 and labor_profiles_lapsed 0, and nothing moves"
            - "neither sweep touches a premium figure: P2 still totals 269200"

      - name: corner_reservation_read_shows_frozen_rating_snapshot
        claim_type: computed_read
        grounds: ["endpoints.GET_/cat-reservations/{id}", "entities.CatReservation.fields.utilization_at_rating", "calculations.cat_load"]
        distinguishing_aspect: "utilization_at_rating is a snapshot, not a live ratio: after the pool total is doubled the reservation still reads 0.100000 and its amount and load are unchanged, while the pool's own available_cents has moved."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, the ZN-1 pool trio, one policy with an RC DWELLING at 40000000 rated to 269200"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_pool_hail
            - *k_pool_wind
            - *k_pool_fire
            - *k_acct
            - *k_policy
            - *k_item
            - *k_rate_get
            - *k_rate
            - call: "GET /cat-reservations"
              payload: { policy_id: "${pol_id}", peril: "HAIL" }
              as: Underwriter
              captures: { res_hail: "$.data[0].id" }
            - call: "GET /cat-capacity-pools/${pool_hail}"
              as: PlatformAdmin
              captures: { hail_v2: $.data.version }
            - call: "PATCH /cat-capacity-pools/${pool_hail}"
              payload: { expected_pool_version: "${hail_v2}", total_capacity_cents: 400000000 }
              as: PlatformAdmin
              captures: { doubled_avail: $.data.available_cents }
          trigger:
            - call: "GET /cat-reservations/${res_hail}"
              as: Underwriter
              captures: { snap_util: $.data.utilization_at_rating, snap_amt: $.data.amount_cents, snap_load: $.data.load_cents }
          assert:
            - "the reservation reads amount_cents 20000000, utilization_at_rating 0.100000 and load_cents 64000 — computed as 20000000 / 200000000 against the pool as it stood at rating"
            - "the pool now reads total 400000000, reserved 20000000 and available_cents 380000000, i.e. a live utilization of 0.050000 that the reservation deliberately does not reflect"
            - "the policy still reports cat_load_cents 125200 and total_premium_cents 269200"

      - name: corner_endorsement_creation_is_gated_on_uw_status
        claim_type: conditional_action
        grounds: ["endpoints.POST_/farm-policies/{id}/endorsements", "validations[priority=9]", "errors.ERR_POLICY_NOT_RATED"]
        distinguishing_aspect: "The same request body is rejected on a DRAFT policy with ERR_POLICY_NOT_RATED (409) and accepted on both RATED and BOUND, and neither accepted creation bumps FarmPolicy.version or any premium field."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, the ZN-1 pool trio, one DRAFT policy with an RC DWELLING at 40000000 and an all-zero labor profile"
          setup_api_calls:
