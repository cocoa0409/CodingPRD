              as_user_id: "${p1_id}"
            - call: "POST /rental-applications"
              payload: { prospect_id: "${p1_id}", home_id: "${home_id}", requested_move_in_date: "2026-10-01", lease_term_months: 12, pet_count: 1, pet_breeds: ["LABRADOR"] }
              as: Prospect
              as_user_id: "${p1_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "PATCH /homes/${home_id}"
              payload: { assessed_value_cents: 24800000 }
              as: AcquisitionAnalyst
              as_user_id: "analyst-1"
            - call: "GET /homes/${home_id}"
              payload: {}
              as: AcquisitionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /rental-applications/${app_id}/screen"
              payload: {}
              as: LeasingAgent
              as_user_id: "agent-1"
            - call: "GET /homes/${home_id}"
              payload: {}
              as: LeasingAgent
              as_user_id: "agent-1"
          assert:
            - "before trigger call 1: Home.${home_id}.property_tax_annual_cents == 350000"
            - "trigger call 1: response.http_status == 200"
            - "trigger call 1: response.data.assessed_value_cents == 24800000"
            - "trigger call 1: response.data.property_tax_annual_cents == 310000"
            - "trigger call 1: response.data.version == 2"
            - "trigger call 2: response.data.property_tax_annual_cents == 310000"
            - "trigger call 3: response.http_status == 200"
            - "trigger call 3: response.data.status == CONDITIONAL_APPROVED"
            - "trigger call 3: response.data.rent_to_income_bps == 3839"
            - "trigger call 3: response.data.risk_multiplier_bps == 15000"
            - "trigger call 3: response.data.security_deposit_cents == 322500"
            - "trigger call 3: response.data.pet_deposit_cents == 30000"
            - "trigger call 3: response.data.total_move_in_deposit_cents == 352500"
            - "trigger call 4: response.data.occupancy_status == RESERVED"
            - "trigger call 4: response.data.leasing_posture == RESTRICTED"
