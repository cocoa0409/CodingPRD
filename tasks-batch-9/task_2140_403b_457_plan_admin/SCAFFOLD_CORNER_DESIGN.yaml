              payload: { legal_name: "Northline Annuity", vendor_code: "NLA", contact_email: "ops@northline.example" }
              as: SystemOperator
              captures: { v1_id: $.data.id }
            - call: "POST /plan-admin/plans"
              payload: { employer_id: "${emp_id}", plan_name: "Riverbend 403(b)", plan_type: "PLAN_403B", plan_year: 2026, reported_participant_count: 250 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { p403_id: $.data.id }
            - call: "POST /plan-admin/plans/${p403_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
            - call: "POST /plan-admin/participants"
              payload: { employer_id: "${emp_id}", full_name: "Ada Reyes", date_of_birth: "1975-05-05", hire_date: "2014-08-01", scheduled_hours_per_week: 40, prior_year_hours_worked: 2000, includible_compensation_cents: 9000000, years_of_service: 12 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { pa_id: $.data.id }
            - call: "POST /plan-admin/vendor-accounts"
              payload: { participant_id: "${pa_id}", plan_id: "${p403_id}", vendor_id: "${v1_id}", contract_number: "NLA-0001", accumulated_benefit_cents: 5000000, vested_percentage_bps: 10000 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { a_id: $.data.id }
            - call: "POST /plan-admin/remittance-batches"
              payload: { plan_id: "${p403_id}", pay_period_start: "2026-07-01", pay_period_end: "2026-07-16", withholding_date: "2026-07-15", total_elective_deferral_cents: 100000, line_items: [{ vendor_account_id: "${a_id}", elective_deferral_cents: 100000, employer_contribution_cents: 0 }] }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { batch_id: $.data.id }
            - call: "POST /plan-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /plan-admin/remittance-batches/${batch_id}/deposit"
              payload: { deposit_date: "2026-09-30" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
            - call: "GET /plan-admin/plans/${p403_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /plan-admin/vendor-accounts/${a_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "the deposit response body already reports deposit_state == DEPOSITED, compliance_state == CORRECTION_PENDING, calendar_days_late == 40 and business_days_late == 27"
            - "the immediately following plan read reports open_correction_count == 1 and compliance_posture == UNDER_CORRECTION"
            - "the immediately following contract read reports ytd_elective_deferrals_cents == 100000 and pending_lost_earnings_cents == 658"
            - "no re-read or delay is required for any of these values to appear"
