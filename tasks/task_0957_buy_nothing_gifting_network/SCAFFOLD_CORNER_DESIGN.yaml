      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/groups/00000000-0000-0000-0000-000000000000"
              as: Member
          assert:
            - "request sent WITHOUT X-User-Role / X-User-ID headers: http 401, error_id == ERR_UNAUTHENTICATED (auth beats the 404 the path would otherwise produce)"

      - name: claim_nonexistent_post_returns_gift_post_not_found
