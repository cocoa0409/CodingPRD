            - "Units 3E and 4W exist. Nurse Nina is at CANDIDATE, which qualifies her as a survey observer."
            - "Patients MRN-K1 and MRN-K2 are ADMITTED on 3E; MRN-K3 is ADMITTED on 4W."
            - "PREVALENCE round R1 covers the closed window 2026-08-01T00:00:00Z..2026-08-05T00:00:00Z on both units and is OPEN."
            - "Three observations are filed: on 3E one injury and one clean patient, on 4W one injury."
