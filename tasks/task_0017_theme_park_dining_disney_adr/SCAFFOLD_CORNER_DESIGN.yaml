  # =========================================================================
  # Section: errors  (every error code triggerable somewhere)
  # =========================================================================
  - section: errors
    instances:
      - name: error_err_outside_booking_window_covered_in_difficulty
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OUTSIDE_BOOKING_WINDOW]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_vs_temporal_priority_conflict_guest_suspended_outside_window
          rationale: "Outside-window error catalog entry exercised as the conflicting validation in the §1.8 priority-pair scenario, AND positively in boundary_precision_check / window_open_at_boundary_inclusive_on_post_reservations (the negative companion case)."

      - name: error_err_slot_capacity_exceeded_covered_in_difficulty
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SLOT_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / restaurant_slot_capacity_aggregate_seat_sum_half_open_overlap
          rationale: "Directly asserted as the failure response in the §1.8 overlap instance."

      - name: error_err_guest_double_booking_covered_in_difficulty
        claim_type: violation_to_error
        grounds:
          - errors[ERR_GUEST_DOUBLE_BOOKING]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / guest_double_booking_padded_buffer_60min_pairwise_overlap
          rationale: "Directly asserted as the failure response in the §1.8 overlap instance."

      - name: error_err_stale_version_on_cancel_negative_test
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STALE_VERSION]
          - concurrency_rules[reservation-cancel-stale-version]
          - endpoints.POST_/v1/reservations/{id}/cancel
        distinguishing_aspect: |
          OCC stale-version test: client reads Reservation.version=N (after confirm),
          then in a separate request applies a party-size patch (advancing version to N+1).
          A subsequent cancel with expected_reservation_version=${res_v_after_confirm}
          (the stale N) is rejected with ERR_STALE_VERSION (412).
        test_recipe:
          setup:
            - "Reservation CONFIRMED; version captured."
            - "Party-size patch applied, advancing version to N+1."
            - "Client still holds the stale captured version."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/guests"
              payload: { email: "g_sv@x.com", full_name: "SV", home_timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/restaurants"
              payload: { name: "Rsv", park_code: "EPCOT", capacity_per_slot: 20, slot_minutes: 30, dining_plan_credit_cost: 1, no_show_base_fee_cents: 1000, opening_local_time: "11:00", closing_local_time: "22:00" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/dining-plans"
              payload: { guest_id: "${g_id}", tier: "STANDARD", table_service_credits_initial: 10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { dp_id: $.data.id }
            - call: "POST /v1/park-sessions"
              payload: { guest_id: "${g_id}", park_code: "EPCOT", visit_date: "2026-02-15" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { ps_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { guest_id: "${g_id}", restaurant_id: "${r_id}", park_session_id: "${ps_id}", dining_plan_id: "${dp_id}", slot_start_utc: "2026-02-15T18:00:00Z", party_size: 2 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id }
            - call: "POST /v1/reservations/${res_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_v_after_confirm: $.data.version }
            - call: "POST /v1/reservations/${res_id}/party-size"
              payload: { party_size: 3 }
              as: Guest
              as_user_id: "${g_id}"
          trigger:
            - call: "POST /v1/reservations/${res_id}/cancel"
              payload: { expected_reservation_version: "${res_v_after_confirm}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response HTTP status == 412"
            - "response.data.error_id == 'ERR_STALE_VERSION'"
            - "Reservation.${res_id}.status == 'CONFIRMED'"

