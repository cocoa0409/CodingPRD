        test_recipe:
          setup: ["lot QUARANTINE with RECORDED test; volunteer Vol ACTIVE (the recorder)"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "GARDEN", region_zone: "ZONE_7A" }
