            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "ACCEPTED", measured_mbps: 505.0 }
              as: NetworkEngineer
            - call: "POST /towers/${tower_id}/status-changes"
              payload: { to_status: "ACTIVE" }
              as: NetworkEngineer
            - call: "POST /spectrum-licenses"
              payload: { license_ref: "CBRS-PAL-4412", band: "CBRS_3_5GHZ", channel_center_mhz: 3600.0, channel_width_mhz: 100.0, max_eirp_dbm: 47.0, license_area_code: "WY-021", effective_from: "2025-01-01T00:00:00Z", effective_to: "2030-01-01T00:00:00Z" }
              as: NetworkEngineer
