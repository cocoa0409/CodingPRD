        captures:
          quote_id: $.data[0].id
          quote_id_v: $.data[0].version
      - call: POST /v1/bookings
        payload:
          load_id: ${load_id}
          carrier_id: ${carrier_id}
          rate_quote_id: ${quote_id}
          equipment_id: ${equipment_id}
          expected_load_version: ${load_id_v}
        as: Carrier
        as_user_id: ${carrier_id}
        captures:
          booking_id: $.data.id
          booking_id_v: $.data.version
      - call: POST /v1/_clock/set_current_utc
        payload:
          current_utc: '2026-10-05T06:00:00Z'
        as: PlatformAdmin
      - call: POST /v1/loads/${load_id}/tracking-pings
        payload:
          carrier_id: ${carrier_id}
          sequence: 1
          reported_status: EN_ROUTE_PICKUP
          location_code: 9vg81
          eta_utc: '2026-10-07T18:00:00Z'
        as: Carrier
        as_user_id: ${carrier_id}
        captures:
          ping_id: $.data.id
      - call: POST /v1/loads/${load_id}/tracking-pings
        payload:
          carrier_id: ${carrier_id}
          sequence: 2
          reported_status: AT_PICKUP
          location_code: 9vg82
        as: Carrier
        as_user_id: ${carrier_id}
        captures:
          ping_id: $.data.id
      trigger:
      - call: POST /v1/loads/${load_id}/tracking-pings
        payload:
          carrier_id: ${carrier_id}
          sequence: 99
          reported_status: IN_TRANSIT
          location_code: 9vg8zz
          eta_utc: '2026-10-07T18:00:00Z'
          status_rank: 5
        as: Carrier
        as_user_id: ${carrier_id}
        captures:
          ping_seq: $.data.sequence
          ping_rank: $.data.status_rank
          ping_id: $.data.id
      assert:
      - the response status is 201
      - TrackingPing.${ping_id}.sequence == 3 and TrackingPing.${ping_id}.sequence != 99
      - TrackingPing.${ping_id}.status_rank == 3 and TrackingPing.${ping_id}.status_rank != 5
      - TrackingPing.${ping_id}.recorded_at is non-null
      - GET /v1/loads/${load_id}/tracking-pings returns exactly 3 rows
  - name: tracking_ping_is_created_with_only_the_fields_the_endpoint_declares
    claim_type: Creation
    grounds:
    - entities.TrackingPing
    - endpoints.POST_/v1/loads/{id}/tracking-pings
    - errors.ERR_TRACKING_SEQUENCE_OUT_OF_ORDER
    distinguishing_aspect: 'A ping is the smallest resource in the scaffold with common_fields false: the created row carries
      id and created_at only, and the response is a 201 object whose data has sequence 2, reported_status AT_PICKUP and a
      computed status_rank of 2 with no updated_at or version keys.'
