              as_user_id: "compliance-001"
              captures: { e_neutral: $.data.error_id }
            - call: "GET /warranty/reserve-entries/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-001"
              captures: { e_entry: $.data.error_id }
          assert:
            - "every probe returns HTTP 404"
            - "${e_builder} == \"ERR_BUILDER_NOT_FOUND\", ${e_homeowner} == \"ERR_HOMEOWNER_NOT_FOUND\", ${e_policy} == \"ERR_POLICY_NOT_FOUND\" and ${e_term} == \"ERR_COVERAGE_TERM_NOT_FOUND\""
            - "${e_transfer} == \"ERR_TRANSFER_NOT_FOUND\", ${e_case} == \"ERR_ESCALATION_CASE_NOT_FOUND\", ${e_neutral} == \"ERR_NEUTRAL_NOT_FOUND\" and ${e_entry} == \"ERR_RESERVE_ENTRY_NOT_FOUND\""
            - "no probe returns 401 or 403 - each caller holds a role listed on the endpoint it probes"

      - name: body_foreign_keys_that_do_not_resolve_return_not_found_for_the_named_entity
        claim_type: "Not Found"
        grounds:
          - validations.priority_11
          - validations.priority_4
          - errors[ERR_HOMEOWNER_NOT_FOUND]
          - errors[ERR_NEUTRAL_NOT_FOUND]
