# =============================================================================
# SCAFFOLD — Outfitter & Guide Special Use Permit Administration
# Sections §1.0 – §1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# corner design in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2646. Outfitter & Guide Special Use Permit Administration (federal land outfitter permit
  program): permit application with needs assessment, capacity determination and prospectus
  solicitation when demand exceeds allocation, service day allocation, use limits by area and
  seasonal restrictions, guide qualification, first aid certification and client-to-guide ratio
  requirements, insurance, bonding and indemnification requirements with annual certificate
  collection, actual use reporting with fee calculation as a percentage of adjusted gross
  revenue, operating plan review covering sanitation, campsite use, stock and resource
  protection, performance evaluation, noncompliance action and permit suspension, permit
  renewal, transfer restrictions and holder change approval

domain_name: outfitter-guide-special-use-permits
api_prefix: /osup

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — VERBATIM)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §0.1–§0.3 Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  # Every entity is a peer addressed by its own top-level collection under /osup.
  # Relationships are carried by FK fields in request bodies and by two read-only
  # sub-resource index paths per parent; no business identity is nested in a URL.

  state_machine_shape: parallel
  # Permit carries two independent state dimensions (administrative_status ×
  # compliance_status) that evolve on different triggers; PermitApplication is a
  # branching fork (DIRECT vs PROSPECTUS routing with divergent side effects);
  # OperatingPlan and Guide are cyclic (revision loop / lapse-and-recertify loop).

  relationship_patterns:
    - one_to_many          # UseArea -> PermitApplication, Permit -> TripUseReport
    - many_to_many         # Guide <-> Permit via GuideAreaAuthorization
    - self_referential     # Permit.predecessor_permit_id, TripUseReport.supersedes_report_id
    - cross_aggregate      # Permit compliance reads InsuranceCertificate / Bond / Guide state

  role_model: segregation_of_duties
  # The AuthorizedOfficer who took custody of an OperatingPlan review cannot approve it,
  # and the officer who issued a NoncomplianceAction cannot decide its appeal.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  - name: Outfitter
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered business name of the outfitting company.
      - name: ein
        type: string
        source: input
        description: Employer identification number.
        constraints: exactly 9 digits, unique across Outfitter
      - name: contact_email
        type: string
        source: input
        description: Primary correspondence address for permit administration.
      - name: prequalification_insurance_verified
        type: boolean
        source: input
        description: Officer-verified flag that the applicant produced acceptable liability coverage evidence at prequalification; consumed by the FINAL variant of prospectus_evaluation_score.
        default: false
      - name: status
        type: enum
        source: system
        description: Holder standing. Recomputed after every Permit.administrative_status change by outfitter_status_derivation.
        default: APPLICANT
        constraints: one of {APPLICANT, PERMITTED, SUSPENDED}
      - name: prior_permit_count
        type: integer
        source: computed
        description: Count of every Permit row with this outfitter_id, in ANY administrative_status including ISSUED, exactly as outfitter_status_derivation computes it; feeds prospectus_evaluation_score experience points. A permit counts from the moment it is issued, so an outfitter that has never held a permit is the only case that reads 0.
      - name: active_permit_count
        type: integer
        source: computed
        description: Count of Permit rows with this outfitter_id whose administrative_status == ACTIVE.

  - name: UseArea
    parent: null
    common_fields: true
    fields:
      - name: area_code
        type: string
        source: input
        description: Short administrative code for the managed area.
        constraints: unique across UseArea
      - name: name
        type: string
        source: input
        description: Human-readable area name.
      - name: total_allocated_service_days
        type: integer
        source: input
        description: Service days the land management plan allocates to commercial outfitting in this area for season_year.
        constraints: ">= 1"
      - name: reserved_admin_service_days
        type: integer
        source: input
        description: Service days withheld from competition for administrative and non-commercial use.
        default: 0
        constraints: ">= 0 and < total_allocated_service_days"
      - name: season_year
        type: integer
        source: input
        description: Calendar year the season_open_date / season_close_date window belongs to.
      - name: season_close_date
        type: datetime
        source: input
        description: Last date (inclusive) on which authorized commercial use may occur, ISO 8601 date-time UTC.
      - name: season_open_date
        type: datetime
        source: input
        description: First date (inclusive) on which authorized commercial use may occur, ISO 8601 date-time UTC.
      - name: party_size_max
        type: integer
        source: input
        description: Maximum clients allowed in one commercial party in this area; also the minimum aggregate client capacity a Permit's authorized guide roster must supply before activation.
      - name: max_clients_per_guide
        type: integer
        source: input
        description: Area-specific client-to-guide ratio ceiling applied to every GuideAreaAuthorization issued under a Permit in this area.
      - name: min_liability_coverage_cents
        type: integer
        source: input
        description: Minimum per-occurrence general liability limit, in cents, a Permit in this area must carry.
        default: 100000000
      - name: committed_service_days
        type: integer
        source: computed
        description: Sum of Permit.authorized_service_days for Permits in this area with administrative_status IN {ISSUED, ACTIVE, SUSPENDED}; see calculation use_area_service_day_availability.
      - name: pending_service_days
        type: integer
        source: computed
        description: Sum of PermitApplication.requested_service_days for applications in this area with status IN {CAPACITY_SCREENED, DIRECT_AWARD_PENDING, PROSPECTUS_QUEUED, PROSPECTUS_RESPONDED, AWARDED}.
      - name: available_service_days
        type: integer
        source: computed
        description: total_allocated_service_days - reserved_admin_service_days - committed_service_days - pending_service_days. May be 0, and may go NEGATIVE when successive screenings oversubscribe the area, because screening places its service-day hold unconditionally; a negative value is precisely what fires the cascade that reroutes sibling DIRECT_AWARD_PENDING applications to PROSPECTUS_QUEUED. Permit issuance, prospectus award and holder change can never drive it below zero, since each of those moves the same day count between pending and committed or replaces one holder with another.
      - name: demand_ratio
        type: number
        source: computed
        description: (committed_service_days + pending_service_days) / (total_allocated_service_days - reserved_admin_service_days), rounded half-up to 4 decimals.
      - name: allocation_posture
        type: enum
        source: computed
        description: Derived gate published by use_area_service_day_availability; EXHAUSTED when available_service_days <= 0, CONSTRAINED when available_service_days > 0 and demand_ratio >= 0.8, else OPEN.
        constraints: one of {OPEN, CONSTRAINED, EXHAUSTED}

  - name: NeedsAssessment
    parent: null
    common_fields: true
    fields:
      - name: use_area_id
        type: string
        source: input
        description: FK -> UseArea.id; the area whose public need and commercial capacity this assessment determines.
      - name: assessment_year
        type: integer
        source: input
        description: Season year the assessment governs.
      - name: public_need_finding
        type: enum
        source: input
        description: Documented finding on whether a public need for commercial outfitting exists.
        constraints: one of {NEED_EXISTS, NO_NEED}
      - name: determined_capacity_service_days
        type: integer
        source: input
        description: Commercial service-day capacity the officer determines the area can sustain; must not exceed UseArea.total_allocated_service_days - UseArea.reserved_admin_service_days.
      - name: allocated_service_days
        type: integer
        source: computed
        description: UseArea.committed_service_days + UseArea.pending_service_days at the moment of recomputation, for the assessment's use_area_id.
      - name: unallocated_service_days
        type: integer
        source: computed
        description: max(0, determined_capacity_service_days - allocated_service_days).
      - name: prospectus_required
        type: boolean
        source: computed
        description: "True when public_need_finding == NO_NEED or unallocated_service_days <= 0, exactly as needs_assessment_allocation_recomputation computes it; recorded evidence that a solicitation is owed because demand has met or exceeded the determined allocation."
      - name: status
        type: enum
        source: system
        description: Publication lifecycle; only a PUBLISHED assessment may back a screening or a Prospectus.
        default: DRAFT
        constraints: one of {DRAFT, PUBLISHED, SUPERSEDED}
      - name: published_at
        type: datetime
        source: system
        description: Logical-clock instant at which publish succeeded; null while DRAFT.

  - name: Prospectus
    parent: null
    common_fields: true
    fields:
      - name: use_area_id
        type: string
        source: input
        description: FK -> UseArea.id; area whose unallocated service days are being competed.
      - name: needs_assessment_id
        type: string
        source: input
        description: FK -> NeedsAssessment.id; the PUBLISHED assessment that authorizes this solicitation.
      - name: offered_service_days
        type: integer
        source: input
        description: Service days offered to the winning applicant.
        constraints: ">= 1"
      - name: submission_deadline_date
        type: datetime
        source: input
        description: Last logical-clock instant at which an application may be attached as a response, inclusive.
      - name: min_qualifying_score
        type: number
        source: input
        description: Minimum FINAL prospectus_evaluation_score an application must reach to be eligible for award.
        default: 60.0
      - name: responsive_application_count
        type: integer
        source: computed
        description: Count of PermitApplication rows whose prospectus_id == this id and status == PROSPECTUS_RESPONDED.
      - name: awarded_application_id
        type: string
        source: computed
        description: Id of the PermitApplication chosen by the award selector; null until status == AWARDED. Reverse index is PermitApplication.prospectus_id.
      - name: cancellation_reason_code
        type: string
        source: input
        description: Officer-supplied reason recorded when the solicitation is cancelled; null otherwise.
      - name: status
        type: enum
        source: system
        description: Solicitation lifecycle.
        default: OPEN
        constraints: one of {OPEN, EVALUATING, AWARDED, CANCELLED}

  - name: PermitApplication
    parent: null
    common_fields: true
    fields:
      - name: outfitter_id
        type: string
        source: input
        description: FK -> Outfitter.id; the applicant.
      - name: use_area_id
        type: string
        source: input
        description: FK -> UseArea.id; the area whose service days are requested.
      - name: prospectus_id
        type: string
        source: input
        description: FK -> Prospectus.id; set only when the application is attached as a prospectus response, null otherwise.
      - name: predecessor_permit_id
        type: string
        source: input
        description: FK -> Permit.id; required when application_type == RENEWAL, must be null when application_type == NEW.
      - name: application_type
        type: enum
        source: input
        description: NEW competes for unallocated days; RENEWAL claims priority consideration behind an expiring permit.
        constraints: one of {NEW, RENEWAL}
      - name: season_year
        type: integer
        source: input
        description: "Season year requested. It selects WHICH NeedsAssessment must be PUBLISHED for the area before the application may be screened (see ERR_NEEDS_ASSESSMENT_NOT_PUBLISHED); it is deliberately NOT required to equal UseArea.season_year, so a prior-season application is admissible whenever the matching assessment year has been published."
      - name: requested_service_days
        type: integer
        source: input
        description: Service days requested.
        constraints: ">= 1"
      - name: proposed_activity_type
        type: enum
        source: input
        description: Class of guided activity proposed.
        constraints: one of {HUNTING, FISHING, PACK_STOCK, RIVER_FLOAT, MOUNTAINEERING}
      - name: narrative
        type: string
        source: input
        description: Applicant statement of proposed operations.
      - name: status
        type: enum
        source: system
        description: Application lifecycle; see state machine PermitApplication.
        default: DRAFT
        constraints: one of {DRAFT, SUBMITTED, CAPACITY_SCREENED, DIRECT_AWARD_PENDING, PROSPECTUS_QUEUED, PROSPECTUS_RESPONDED, AWARDED, PERMIT_ISSUED, DENIED, WITHDRAWN}
      - name: routing_decision
        type: enum
        source: computed
        description: Fork label written by prospectus_requirement_determination during screening; DIRECT sends the application to DIRECT_AWARD_PENDING, PROSPECTUS sends it to PROSPECTUS_QUEUED. Null before screening.
        constraints: one of {DIRECT, PROSPECTUS}
      - name: hold_expires_at
        type: datetime
        source: computed
        description: Logical-clock instant screened_at + 30 days, written only on the DIRECT fork; null on the PROSPECTUS fork.
      - name: preliminary_evaluation_score
        type: number
        source: computed
        description: PRELIMINARY variant output of prospectus_evaluation_score, written when the parent Prospectus closes submissions; null otherwise.
      - name: final_evaluation_score
        type: number
        source: computed
        description: FINAL variant output of prospectus_evaluation_score, written when the parent Prospectus is awarded; null otherwise.
      - name: denial_reason_code
        type: string
        source: input
        description: Reason recorded on deny, or the literal NOT_SELECTED when the award cascade denies a losing response.
      - name: screened_at
        type: datetime
        source: system
        description: Logical-clock instant of the screen transition; null before screening.

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - name: outfitter_id
        type: string
        source: input
        description: FK -> Outfitter.id; the permit holder. Copied from the issuing application, or replaced by holder-change approval.
      - name: use_area_id
        type: string
        source: input
        description: FK -> UseArea.id; area of authorized operation, copied from the issuing application.
      - name: application_id
        type: string
        source: input
        description: FK -> PermitApplication.id; the application this permit was issued from.
      - name: predecessor_permit_id
        type: string
        source: input
        description: FK -> Permit.id; self-referential succession link set on renewal issuance and on holder-change successor creation, null for a first-generation permit.
      - name: authorized_service_days
        type: integer
        source: computed
        description: Service days authorized by this permit; equals PermitApplication.requested_service_days when prospectus_id is null, else min(requested_service_days, Prospectus.offered_service_days). Carried unchanged onto a holder-change successor.
      - name: term_start_date
        type: datetime
        source: input
        description: First date of the authorized term, inclusive.
      - name: term_end_date
        type: datetime
        source: input
        description: Last date of the authorized term, inclusive; must be > term_start_date.
      - name: fee_schedule_code
        type: enum
        source: input
        description: Selects the fee algorithm branch; GRADUATED applies the bracketed rate table, FLAT_THREE_PERCENT applies 300 bp to all adjusted gross revenue.
        default: GRADUATED
        constraints: one of {GRADUATED, FLAT_THREE_PERCENT}
      - name: indemnification_acknowledged
        type: boolean
        source: input
        description: Holder acknowledgement of the indemnification and hold-harmless clause; must be true before activation.
        default: false
      - name: administrative_status
        type: enum
        source: system
        description: Authorization dimension of the parallel state machine.
        default: ISSUED
        constraints: one of {ISSUED, ACTIVE, SUSPENDED, REVOKED, EXPIRED, CLOSED}
      - name: compliance_status
        type: enum
        source: system
        description: Compliance dimension of the parallel state machine, recomputed by permit_compliance_derivation on every input change.
        default: COMPLIANT
        constraints: one of {COMPLIANT, PROBATION, NONCOMPLIANT}
      - name: open_noncompliance_points
        type: integer
        source: computed
        description: Output of noncompliance_point_accumulation over this permit's NoncomplianceAction rows.
      - name: insurance_current
        type: boolean
        source: computed
        description: True when at least one InsuranceCertificate with permit_id == this id, coverage_type == GENERAL_LIABILITY, status == ACTIVE, additional_insured_endorsed == true and coverage_amount_cents >= UseArea.min_liability_coverage_cents exists.
      - name: bond_current
        type: boolean
        source: computed
        description: True when at least one Bond with permit_id == this id, status == ACTIVE and bond_amount_cents >= required_financial_assurance output exists.
      - name: fee_delinquent
        type: boolean
        source: computed
        description: True when any FeeAssessment for this permit with status IN {PROVISIONAL, FINAL} has balance_due_cents > 0.
      - name: authorized_client_capacity_total
        type: integer
        source: computed
        description: Sum of GuideAreaAuthorization.authorized_client_capacity for rows with this permit_id and status == AUTHORIZED.
      - name: service_days_used_ytd
        type: integer
        source: computed
        description: Sum of TripUseReport.service_days_used for rows with this permit_id and status == ACCEPTED, restricted to season_year == year(term_start_date) unless a later season is reported.
      - name: suspension_count
        type: integer
        source: system
        description: Number of times this permit has entered SUSPENDED, incremented on each entry.
        default: 0
      - name: suspended_until_date
        type: datetime
        source: system
        description: Logical-clock date through which the suspension runs; null when not suspended.
      - name: suspension_reason_code
        type: enum
        source: system
        description: Cause recorded on the most recent suspension.
        constraints: one of {OFFICER_ORDER, POINTS_THRESHOLD, INSURANCE_LAPSE}
      - name: revocation_reason_code
        type: string
        source: input
        description: Reason recorded on revoke; null otherwise.
      - name: latest_performance_rating
        type: enum
        source: computed
        description: rating of the PerformanceEvaluation for this permit with the highest evaluation_year, tie-broken by created_at DESC; null when none exists.
        constraints: one of {SUPERIOR, SATISFACTORY, MARGINAL, UNSATISFACTORY}

  - name: OperatingPlan
    parent: null
    common_fields: true
    fields:
      - name: permit_id
        type: string
        source: input
        description: FK -> Permit.id; the permit the annual operating plan belongs to.
      - name: plan_year
        type: integer
        source: input
        description: Operating season the plan governs; unique per permit_id.
      - name: sanitation_section
        type: object
        source: input
        description: Sanitation commitments; complete when keys human_waste_method, greywater_method and packout_commitment are all present and non-null.
      - name: campsite_section
        type: object
        source: input
        description: Campsite use commitments; complete when keys designated_sites_only, max_nights_per_site and fire_policy are all present and non-null.
      - name: stock_section
        type: object
        source: input
        description: Stock handling commitments; complete when keys stock_type, max_head, feed_source and tie_method are all present and non-null.
      - name: resource_protection_section
        type: object
        source: input
        description: Resource protection commitments; complete when keys weed_free_certification, sensitive_site_avoidance and monitoring_commitment are all present and non-null.
      - name: completeness_score
        type: number
        source: computed
        description: 25.0 for each of the four sections whose required keys are all present and non-null; must equal 100.0 to submit.
      - name: status
        type: enum
        source: system
        description: Review lifecycle with a revision cycle; see state machine OperatingPlan.
        default: DRAFT
        constraints: one of {DRAFT, SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, APPROVED, REJECTED}
      - name: revision_round
        type: integer
        source: system
        description: Number of completed request-revision cycles; incremented on each request-revision.
        default: 0
      - name: deficiency_sections
        type: array
        source: input
        description: Section names cited in the most recent request-revision; emptied when the plan is resubmitted.
        default: []
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID that took custody of the review via start-review; segregation of duties compares it to the approving user.
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID that approved the plan; null until APPROVED.
      - name: rejection_reason_code
        type: string
        source: input
        description: Reason recorded on reject; null otherwise.

  - name: Guide
    parent: null
    common_fields: true
    fields:
      - name: outfitter_id
        type: string
        source: input
        description: FK -> Outfitter.id; the employing outfitter.
      - name: full_name
        type: string
        source: input
        description: Guide legal name.
      - name: qualification_level
        type: enum
        source: input
        description: Field qualification tier; TRAINEE may never carry clients.
        constraints: one of {TRAINEE, ASSISTANT, LEAD}
      - name: first_aid_cert_type
        type: enum
        source: input
        description: Highest first aid certification held.
        constraints: one of {NONE, BASIC_FIRST_AID, WFR, WEMT}
      - name: first_aid_expires_on
        type: datetime
        source: input
        description: Expiration date of first_aid_cert_type, inclusive — a certificate expiring exactly on the logical-clock date is still valid.
      - name: seasons_experience
        type: integer
        source: input
        description: Completed guided seasons, feeding the experience bonus of guide_client_capacity.
        default: 0
      - name: base_client_capacity
        type: integer
        source: computed
        description: Area-independent client ceiling from guide_client_capacity; recomputed on qualify and on every certifications write.
      - name: status
        type: enum
        source: system
        description: Qualification lifecycle with a lapse-and-recertify cycle.
        default: PENDING_QUALIFICATION
        constraints: one of {PENDING_QUALIFICATION, QUALIFIED, LAPSED}
      - name: qualified_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent entry into QUALIFIED; null while PENDING_QUALIFICATION.

  - name: GuideAreaAuthorization
    parent: null
    common_fields: true
    fields:
      - name: guide_id
        type: string
        source: input
        description: FK -> Guide.id; the authorized guide.
      - name: permit_id
        type: string
        source: input
        description: FK -> Permit.id; the permit (and therefore the use area) the guide is authorized under.
      - name: authorized_client_capacity
        type: integer
        source: computed
        description: min(UseArea.max_clients_per_guide, Guide.base_client_capacity) evaluated at authorization time and frozen thereafter.
      - name: status
        type: enum
        source: system
        description: Authorization standing.
        default: AUTHORIZED
        constraints: one of {AUTHORIZED, REVOKED}
      - name: authorized_at
        type: datetime
        source: system
        description: Logical-clock instant of authorization.
      - name: revoked_at
        type: datetime
        source: system
        description: Logical-clock instant of revocation; null while AUTHORIZED.
      - name: revocation_reason_code
        type: enum
        source: system
        description: Cause of revocation, set by the holder request path or by one of the three cascade paths.
        constraints: one of {HOLDER_REQUEST, GUIDE_LAPSED, PERMIT_SUSPENDED, PERMIT_CLOSED}

  - name: InsuranceCertificate
    parent: null
    common_fields: true
    fields:
      - name: permit_id
        type: string
        source: input
        description: FK -> Permit.id; the permit the certificate is filed against.
      - name: coverage_type
        type: enum
        source: input
        description: Line of coverage evidenced.
        constraints: one of {GENERAL_LIABILITY, AUTO_LIABILITY, WATERCRAFT_LIABILITY}
      - name: carrier_name
        type: string
        source: input
        description: Issuing carrier.
      - name: coverage_amount_cents
        type: integer
        source: input
        description: Per-occurrence limit in cents.
      - name: effective_date
        type: datetime
        source: input
        description: First date of coverage, inclusive.
      - name: expiration_date
        type: datetime
        source: input
        description: Last date of coverage, inclusive; a certificate expiring exactly on the logical-clock date is still ACTIVE.
      - name: additional_insured_endorsed
        type: boolean
        source: input
        description: True when the United States is named as additional insured, required for the GENERAL_LIABILITY line.
        default: false
      - name: status
        type: enum
        source: system
        description: Certificate standing; superseded when a newer certificate of the same coverage_type is filed on the permit.
        default: ACTIVE
        constraints: one of {ACTIVE, EXPIRED, SUPERSEDED}

  - name: Bond
    parent: null
    common_fields: true
    fields:
      - name: permit_id
        type: string
        source: input
        description: FK -> Permit.id; the permit the performance bond secures.
      - name: bond_amount_cents
        type: integer
        source: input
        description: Face amount of the bond in cents.
      - name: surety_name
        type: string
        source: input
        description: Issuing surety.
      - name: effective_date
        type: datetime
        source: input
        description: First date the bond is in force, inclusive.
      - name: expiration_date
        type: datetime
        source: input
        description: Last date the bond is in force, inclusive.
      - name: required_amount_cents
        type: integer
        source: computed
        description: required_financial_assurance output for the parent permit at filing time, frozen on the row for audit.
      - name: status
        type: enum
        source: system
        description: Bond standing; superseded when a newer bond is filed on the permit.
        default: ACTIVE
        constraints: one of {ACTIVE, EXPIRED, SUPERSEDED}

  - name: TripUseReport
    parent: null
    common_fields: true
    fields:
      - name: permit_id
        type: string
        source: input
        description: FK -> Permit.id; the permit whose actual use is reported.
      - name: supersedes_report_id
        type: string
        source: input
        description: FK -> TripUseReport.id; self-referential amendment link set only on a report created by the amend endpoint, null on an original filing.
      - name: period_start_date
        type: datetime
        source: input
        description: First date of the reported use period, inclusive.
      - name: period_end_date
        type: datetime
        source: input
        description: Exclusive end of the reported use period — two reports whose period_end_date and period_start_date are the same date do NOT overlap.
      - name: season_year
        type: integer
        source: computed
        description: Calendar year of period_start_date; groups reports into a FeeAssessment.
      - name: service_days_used
        type: integer
        source: input
        description: Client days actually delivered in the period.
        constraints: ">= 0"
      - name: client_count
        type: integer
        source: input
        description: Distinct clients served in the period.
        constraints: ">= 0"
      - name: gross_revenue_cents
        type: integer
        source: input
        description: Gross revenue attributable to authorized use in the period, in cents.
      - name: allowable_deductions_cents
        type: integer
        source: input
        description: Deductions claimed against gross revenue; capped at floor(gross_revenue_cents * 0.15).
        default: 0
      - name: adjusted_gross_revenue_cents
        type: integer
        source: computed
        description: gross_revenue_cents - allowable_deductions_cents.
      - name: applied_rate_bp
        type: integer
        source: computed
        description: Basis-point rate the PROVISIONAL_PER_REPORT variant charged this report, chosen from the cumulative adjusted gross revenue of strictly earlier ACCEPTED reports.
      - name: fee_component_cents
        type: integer
        source: computed
        description: Per-report fee the PROVISIONAL_PER_REPORT variant attributes to this report, rounded half-up to the cent.
      - name: status
        type: enum
        source: system
        description: Report standing; SUPERSEDED is terminal.
        default: SUBMITTED
        constraints: one of {SUBMITTED, ACCEPTED, SUPERSEDED}
      - name: accepted_at
        type: datetime
        source: system
        description: Logical-clock instant of acceptance; null while SUBMITTED.

  - name: FeeAssessment
    parent: null
    common_fields: true
    fields:
      - name: permit_id
        type: string
        source: input
        description: FK -> Permit.id; the permit being billed.
      - name: season_year
        type: integer
        source: system
        description: Season the assessment covers; unique per permit_id.
      - name: variant_applied
        type: enum
        source: computed
        description: Which permit_fee_assessment variant produced the current assessed_fee_cents.
        constraints: one of {PROVISIONAL_PER_REPORT, FINAL_AGGREGATE}
      - name: reported_agr_cents
        type: integer
        source: computed
        description: Sum of TripUseReport.adjusted_gross_revenue_cents over rows with this permit_id, this season_year and status == ACCEPTED.
      - name: assessed_fee_cents
        type: integer
        source: computed
        description: Fee owed for the season under variant_applied, never below MINIMUM_ANNUAL_FEE_CENTS.
      - name: minimum_fee_applied
        type: boolean
        source: computed
        description: True when the minimum annual fee floor, rather than the rate computation, determined assessed_fee_cents.
      - name: paid_to_date_cents
        type: integer
        source: system
        description: Cumulative payments recorded against this assessment; never decreases.
        default: 0
      - name: balance_due_cents
        type: integer
        source: computed
        description: max(0, assessed_fee_cents - paid_to_date_cents).
      - name: credit_balance_cents
        type: integer
        source: computed
        description: max(0, paid_to_date_cents - assessed_fee_cents); the overpayment side of the fee conservation identity.
      - name: status
        type: enum
        source: system
        description: Billing lifecycle; reverts FINAL/PAID to PROVISIONAL when an accepted report is amended.
        default: PROVISIONAL
        constraints: one of {PROVISIONAL, FINAL, PAID, CLOSED}
      - name: finalized_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent finalize; cleared when the assessment reverts to PROVISIONAL.

  - name: PerformanceEvaluation
    parent: null
    common_fields: false
    fields:
      - name: permit_id
        type: string
        source: input
        description: FK -> Permit.id; the permit evaluated.
      - name: evaluation_year
        type: integer
        source: input
        description: Season evaluated; unique per permit_id.
      - name: resource_protection_score
        type: integer
        source: input
        description: Officer score for resource protection performance.
        constraints: 0 to 100 inclusive
      - name: client_safety_score
        type: integer
        source: input
        description: Officer score for client safety performance.
        constraints: 0 to 100 inclusive
      - name: reporting_timeliness_score
        type: integer
        source: input
        description: Officer score for use-report and certificate timeliness.
        constraints: 0 to 100 inclusive
      - name: fee_compliance_score
        type: integer
        source: input
        description: Officer score for fee payment compliance.
        constraints: 0 to 100 inclusive
      - name: raw_score
        type: number
        source: computed
        description: Weighted sum before penalty, step 1 of performance_weighted_rating.
      - name: provisional_band
        type: enum
        source: computed
        description: Band of raw_score, step 2 of performance_weighted_rating; selects the penalty multiplier and is never recomputed from weighted_score.
        constraints: one of {SUPERIOR, SATISFACTORY, MARGINAL, UNSATISFACTORY}
      - name: penalty_points_applied
        type: number
        source: computed
        description: Noncompliance penalty actually subtracted, step 4 of performance_weighted_rating.
      - name: weighted_score
        type: number
        source: computed
        description: raw_score - penalty_points_applied, floored at 0.0, step 5.
      - name: rating
        type: enum
        source: computed
        description: Band of weighted_score, step 6; the published rating.
        constraints: one of {SUPERIOR, SATISFACTORY, MARGINAL, UNSATISFACTORY}
      - name: evaluator_user_id
        type: string
        source: system
        description: X-User-ID of the PermitSpecialist who recorded the evaluation.

  - name: NoncomplianceAction
    parent: null
    common_fields: true
    fields:
      - name: permit_id
        type: string
        source: input
        description: FK -> Permit.id; the permit cited.
      - name: severity
        type: enum
        source: input
        description: Severity of the cited violation; drives the point value.
        constraints: one of {MINOR, MODERATE, MAJOR}
      - name: action_type
        type: enum
        source: input
        description: Enforcement instrument selected by the officer; constrained by severity (MINOR allows WARNING only, MODERATE allows WARNING or SUSPENSION, MAJOR allows SUSPENSION or REVOCATION).
        constraints: one of {WARNING, SUSPENSION, REVOCATION}
      - name: cited_provision
        type: string
        source: input
        description: Permit clause or regulation cited.
      - name: cure_deadline_date
        type: datetime
        source: input
        description: Last logical-clock date on which the holder may cure, inclusive.
      - name: points
        type: integer
        source: computed
        description: Point value from noncompliance_point_accumulation constants; 2 for MINOR, 5 for MODERATE, 10 for MAJOR.
      - name: status
        type: enum
        source: system
        description: Enforcement lifecycle; CURED and RESCINDED stop contributing points.
        default: ISSUED
        constraints: one of {ISSUED, CURED, APPEALED, UPHELD, RESCINDED}
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the issuing AuthorizedOfficer; the segregation-of-duties comparand for appeal decisions.
      - name: appeal_basis
        type: string
        source: input
        description: Holder statement recorded on appeal; null otherwise.
      - name: appeal_decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the officer who decided the appeal; null until decided.
      - name: corrective_summary
        type: string
        source: input
        description: Holder description of the corrective action recorded on cure; null otherwise.

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:

  - entity: NeedsAssessment
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    note: |
      The publication gate every screening and every solicitation hangs from. Only one PUBLISHED
      assessment may exist per (use_area_id, assessment_year); publishing a second one supersedes the
      first inside the same request, and a SUPERSEDED assessment is never recomputed again.
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /osup/needs-assessments/{id}/publish"
        actor: AuthorizedOfficer | ProgramAdministrator
        preconditions:
          - "assessment.status == DRAFT (else ERR_INVALID_ASSESSMENT_STATE)"
        side_effects:
          - "stamps published_at from the logical clock; increments version"
          - "any other PUBLISHED assessment for the same (use_area_id, assessment_year) moves to SUPERSEDED"
          - "runs needs_assessment_allocation_recomputation so allocated_service_days, unallocated_service_days and prospectus_required reflect the area's current committed and pending totals at publication time"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system, when a newer assessment for the same use_area_id and assessment_year is published"
        actor: system
        preconditions:
          - "assessment.status == PUBLISHED"
          - "the newly published assessment has the same use_area_id and assessment_year"
        side_effects:
          - "increments version; the row keeps its published_at and its last computed figures and is excluded from every later recomputation"

  - entity: PermitApplication
    initial_state: DRAFT
    terminal_states: [PERMIT_ISSUED, DENIED, WITHDRAWN]
    note: |
      Branching fork-join. The screen transition lands on CAPACITY_SCREENED and then, inside the
      same request, fires exactly one of two automatic forks whose side-effect sets differ
      (DIRECT writes a 30-day hold; PROSPECTUS writes no hold and marks the assessment).
      Both forks rejoin at AWARDED / PERMIT_ISSUED.
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /osup/permit-applications/{id}/submit"
        actor: OutfitterRepresentative
        preconditions:
          - "application.status == DRAFT"
          - "acting X-User-ID == application.outfitter_id"
          - "Outfitter.status != SUSPENDED"
          - "when application_type == RENEWAL: predecessor_permit_id is non-null and that Permit.administrative_status IN {ACTIVE, SUSPENDED, EXPIRED} and its use_area_id == application.use_area_id"
        side_effects:
          - "sets updated_at; increments PermitApplication.version by 1"
          - "no service-day hold is placed yet — SUBMITTED is outside UseArea.pending_service_days"
      - from: SUBMITTED
        to: CAPACITY_SCREENED
        trigger: "POST /osup/permit-applications/{id}/screen"
        actor: PermitSpecialist
        preconditions:
          - "application.status == SUBMITTED"
          - "a NeedsAssessment with use_area_id == application.use_area_id, assessment_year == application.season_year and status == PUBLISHED exists (else ERR_NEEDS_ASSESSMENT_NOT_PUBLISHED)"
          - "that NeedsAssessment.public_need_finding == NEED_EXISTS (else ERR_NO_PUBLIC_NEED)"
        side_effects:
          - "writes screened_at = logical clock"
          - "evaluates prospectus_requirement_determination and writes routing_decision"
          - "adds requested_service_days to UseArea.pending_service_days and recomputes UseArea.available_service_days, demand_ratio and allocation_posture (use_area_service_day_availability)"
          - "recomputes NeedsAssessment.allocated_service_days, unallocated_service_days and prospectus_required for the published assessment of the area/year (needs_assessment_allocation_recomputation)"
          - "if the recomputation leaves UseArea.available_service_days < 0, every OTHER application on the area in DIRECT_AWARD_PENDING moves to PROSPECTUS_QUEUED"
          - "immediately fires the automatic fork below"
      - from: CAPACITY_SCREENED
        to: DIRECT_AWARD_PENDING
        trigger: "system, inside the screen request, when routing_decision == DIRECT"
        actor: system
        preconditions:
          - "routing_decision == DIRECT"
        side_effects:
          - "writes hold_expires_at = screened_at + 30 days"
        note: "DIRECT fork — a hold instant is written; the application is award-ready without competition."
      - from: CAPACITY_SCREENED
        to: PROSPECTUS_QUEUED
        trigger: "system, inside the screen request, when routing_decision == PROSPECTUS"
        actor: system
        preconditions:
          - "routing_decision == PROSPECTUS"
        side_effects:
          - "leaves hold_expires_at null"
          - "sets NeedsAssessment.prospectus_required = true for the published assessment of the area/year"
        note: "PROSPECTUS fork — no hold instant; the application must be attached to a Prospectus to advance."
      - from: DIRECT_AWARD_PENDING
        to: PROSPECTUS_QUEUED
        trigger: "system, cascade hop 3 of the screen chain, when a sibling screening leaves UseArea.available_service_days below zero"
        actor: system
        preconditions:
          - "UseArea.available_service_days < 0 after the recomputation caused by a sibling application's screening"
          - "the rerouted application is NOT the application being screened in this request"
        side_effects:
          - "clears hold_expires_at to null"
          - "sets routing_decision = PROSPECTUS"
          - "causes NeedsAssessment.prospectus_required recomputation (cascade hop 4)"
        note: |
          Oversubscription, not mere exhaustion, is the trigger. A permit issuance can never fire this
          hop: issuance moves the same day count out of pending_service_days and into
          committed_service_days, so available_service_days is arithmetically unchanged by it. Only a
          screening adds days to the pending side, and only a screening can therefore push the area
          past its allocatable total. Once the applications on hand claim more days than the area can
          allocate, every direct-award hold still waiting for a permit loses its non-competitive
          standing and must be re-competed through a prospectus.
      - from: PROSPECTUS_QUEUED
        to: PROSPECTUS_RESPONDED
        trigger: "POST /osup/prospectuses/{id}/responses"
        actor: OutfitterRepresentative
        preconditions:
          - "application.status == PROSPECTUS_QUEUED"
          - "acting X-User-ID == application.outfitter_id"
          - "Prospectus.status == OPEN"
          - "Prospectus.use_area_id == application.use_area_id"
          - "logical clock date <= Prospectus.submission_deadline_date (else ERR_SUBMISSION_DEADLINE_PASSED)"
        side_effects:
          - "writes application.prospectus_id"
          - "recomputes Prospectus.responsive_application_count"
      - from: PROSPECTUS_RESPONDED
        to: AWARDED
        trigger: "system, on POST /osup/prospectuses/{id}/award, for the selected application"
        actor: system
        preconditions:
          - "application is the selector winner per prospectus_award_selector"
        side_effects:
          - "writes final_evaluation_score"
          - "writes Prospectus.awarded_application_id"
      - from: PROSPECTUS_RESPONDED
        to: DENIED
        trigger: "system, on POST /osup/prospectuses/{id}/award, for every non-selected response"
        actor: system
        preconditions:
          - "application.prospectus_id == awarded prospectus id and application is not the selector winner"
        side_effects:
          - "writes final_evaluation_score and denial_reason_code = NOT_SELECTED"
          - "removes requested_service_days from UseArea.pending_service_days and recomputes availability"
      - from: PROSPECTUS_RESPONDED
        to: PROSPECTUS_QUEUED
        trigger: "system, on POST /osup/prospectuses/{id}/cancel"
        actor: system
        preconditions:
          - "Prospectus.status IN {OPEN, EVALUATING}"
        side_effects:
          - "clears application.prospectus_id and preliminary_evaluation_score to null"
          - "leaves the service-day hold in place because PROSPECTUS_QUEUED is also inside pending_service_days"
        note: "Compensation for the responses linkage."
      - from: DIRECT_AWARD_PENDING
        to: PERMIT_ISSUED
        trigger: "POST /osup/permit-applications/{id}/issue-permit"
        actor: AuthorizedOfficer
        preconditions:
          - "application.status IN {DIRECT_AWARD_PENDING, AWARDED}"
          - "UseArea.available_service_days + application.requested_service_days >= computed authorized_service_days (else ERR_INSUFFICIENT_SERVICE_DAYS)"
          - "no other Permit for the same (outfitter_id, use_area_id) violates the 14-day term buffer (else ERR_PERMIT_TERM_CONFLICT)"
        side_effects:
          - "creates a Permit in administrative_status ISSUED / compliance_status COMPLIANT (cascade hop 1)"
          - "removes requested_service_days from UseArea.pending_service_days and adds authorized_service_days to UseArea.committed_service_days, then recomputes available_service_days, demand_ratio and allocation_posture (cascade hop 2); available_service_days is unchanged by construction on the DIRECT path because the same day count leaves pending and enters committed"
          - "recomputes Outfitter.prior_permit_count and active_permit_count (cascade hop 3)"
          - "re-derives Outfitter.status from those counts (cascade hop 4)"
      - from: AWARDED
        to: PERMIT_ISSUED
        trigger: "POST /osup/permit-applications/{id}/issue-permit"
        actor: AuthorizedOfficer
        preconditions:
          - "application.status == AWARDED"
          - "Prospectus.status == AWARDED and Prospectus.awarded_application_id == application.id"
        side_effects:
          - "same chain as the DIRECT_AWARD_PENDING_to_PERMIT_ISSUED transition, with authorized_service_days = min(requested_service_days, Prospectus.offered_service_days)"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /osup/permit-applications/{id}/deny"
        actor: AuthorizedOfficer
        preconditions:
          - "application.status IN {SUBMITTED, CAPACITY_SCREENED, DIRECT_AWARD_PENDING, PROSPECTUS_QUEUED, PROSPECTUS_RESPONDED}"
        side_effects:
          - "writes denial_reason_code"
          - "if the application had been screened, removes requested_service_days from UseArea.pending_service_days and recomputes availability"
      - from: DIRECT_AWARD_PENDING
        to: WITHDRAWN
        trigger: "POST /osup/permit-applications/{id}/withdraw"
        actor: OutfitterRepresentative
        preconditions:
          - "application.status IN {DRAFT, SUBMITTED, CAPACITY_SCREENED, DIRECT_AWARD_PENDING, PROSPECTUS_QUEUED, PROSPECTUS_RESPONDED}"
          - "acting X-User-ID == application.outfitter_id"
        side_effects:
          - "if the application had been screened, removes requested_service_days from UseArea.pending_service_days and recomputes available_service_days, demand_ratio and allocation_posture"
          - "recomputes NeedsAssessment.allocated_service_days and unallocated_service_days"
        note: "Compensating action for the screen hold; the named conserved quantity allocatable_service_days is unchanged."

  - entity: Prospectus
    initial_state: OPEN
    terminal_states: [AWARDED, CANCELLED]
    transitions:
      - from: OPEN
        to: EVALUATING
        trigger: "POST /osup/prospectuses/{id}/close-submissions"
        actor: PermitSpecialist   # exclusive to the specialist per §1.5 / §1.7; the officer awards but never closes submissions
        preconditions:
          - "prospectus.status == OPEN"
        side_effects:
          - "writes preliminary_evaluation_score on every application with prospectus_id == this id and status == PROSPECTUS_RESPONDED using the PRELIMINARY variant of prospectus_evaluation_score"
          - "recomputes responsive_application_count"
      - from: EVALUATING
        to: AWARDED
        trigger: "POST /osup/prospectuses/{id}/award"
        actor: AuthorizedOfficer
        preconditions:
          - "prospectus.status == EVALUATING"
          - "expected_use_area_version == UseArea.version (else ERR_STALE_USE_AREA_VERSION)"
          - "at least one responsive application reaches min_qualifying_score under the FINAL variant (else ERR_NO_RESPONSIVE_APPLICATIONS)"
          # DELIBERATELY NO area-capacity precondition here. A solicitation exists precisely because
          # demand exceeded the allocation, so the competing responses' own holds normally leave the
          # area EXHAUSTED at award time; gating the award on posture would make the whole prospectus
          # path unreachable. Service-day capacity is enforced twice instead, exactly as §1.4 priority
          # 12 declares: when a response is filed (requested <= Prospectus.offered_service_days) and
          # again when the winner's permit is issued (available + requested >= authorized).
        side_effects:
          - "writes final_evaluation_score on every responsive application using the FINAL variant"
          - "selects the winner per prospectus_award_selector and writes awarded_application_id"
          - "moves the winner PROSPECTUS_RESPONDED -> AWARDED and every other response PROSPECTUS_RESPONDED -> DENIED with denial_reason_code NOT_SELECTED"
          - "recomputes UseArea.pending_service_days, available_service_days, demand_ratio and allocation_posture after the denials release their holds"
          - "increments UseArea.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /osup/prospectuses/{id}/cancel"
        actor: AuthorizedOfficer
        preconditions:
          - "prospectus.status IN {OPEN, EVALUATING}"
        side_effects:
          - "writes cancellation_reason_code"
          - "returns every PROSPECTUS_RESPONDED application to PROSPECTUS_QUEUED and clears its prospectus_id and preliminary_evaluation_score"
          - "recomputes responsive_application_count to 0"
      - from: EVALUATING
        to: CANCELLED
        trigger: "POST /osup/prospectuses/{id}/cancel"
        actor: AuthorizedOfficer
        preconditions:
          - "prospectus.status == EVALUATING"
        side_effects:
          - "same as the OPEN_to_CANCELLED transition"

  - entity: Permit
    dimension: administrative_status
    initial_state: ISSUED
    terminal_states: [REVOKED, EXPIRED, CLOSED]
    note: |
      Dimension 1 of the parallel machine. administrative_status answers "may the holder operate";
      compliance_status (dimension 2 below) answers "is the holder in good standing". They advance
      on different triggers and their state names are disjoint, so a Permit row carries an
      independent pair such as (ACTIVE, PROBATION) or (SUSPENDED, NONCOMPLIANT).
    transitions:
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /osup/permits/{id}/activate"
        actor: AuthorizedOfficer
        preconditions:
          - "permit.administrative_status == ISSUED"
          - "permit.indemnification_acknowledged == true (else ERR_INDEMNIFICATION_NOT_ACKNOWLEDGED)"
          - "an OperatingPlan with permit_id == permit.id, plan_year == year(term_start_date) and status == APPROVED exists (else ERR_OPERATING_PLAN_NOT_APPROVED)"
          - "permit.insurance_current == true (else ERR_INSURANCE_COVERAGE_INSUFFICIENT)"
          - "permit.bond_current == true (else ERR_BOND_INSUFFICIENT)"
          - "permit.authorized_client_capacity_total >= UseArea.party_size_max (else ERR_CLIENT_GUIDE_RATIO_UNMET)"
          - "permit.compliance_status == COMPLIANT (else ERR_PERMIT_NOT_OPERATIONAL)"
        side_effects:
          - "sets updated_at, increments Permit.version by 1"
          - "recomputes Outfitter.active_permit_count and re-derives Outfitter.status to PERMITTED"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /osup/permits/{id}/suspend, or system when compliance_status enters NONCOMPLIANT, or the sweep when insurance_current becomes false"
        actor: AuthorizedOfficer | system
        preconditions:
          - "permit.administrative_status == ACTIVE"
        side_effects:
          - "increments suspension_count by 1; writes suspended_until_date = logical clock date + suspension_days and suspension_reason_code (OFFICER_ORDER for the endpoint, POINTS_THRESHOLD for the compliance cascade, INSURANCE_LAPSE for the sweep cascade)"
          - "because the permit is no longer operable, every GuideAreaAuthorization with this permit_id and status == AUTHORIZED becomes REVOKED with revocation_reason_code PERMIT_SUSPENDED, and authorized_client_capacity_total is recomputed to 0"
          - "because the holder now has one fewer ACTIVE permit, Outfitter.active_permit_count is recomputed and Outfitter.status re-derived (PERMITTED -> SUSPENDED when active_permit_count reaches 0 and at least one permit is SUSPENDED)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /osup/permits/{id}/reinstate"
        actor: AuthorizedOfficer
        preconditions:
          - "permit.administrative_status == SUSPENDED"
          - "permit.open_noncompliance_points < 12 (else ERR_POINTS_THRESHOLD_UNRESOLVED)"
          - "permit.insurance_current == true (else ERR_INSURANCE_COVERAGE_INSUFFICIENT)"
          - "permit.bond_current == true (else ERR_BOND_INSUFFICIENT)"
          - "permit.fee_delinquent == false (else ERR_FEE_BALANCE_OUTSTANDING)"
        side_effects:
          - "clears suspended_until_date and suspension_reason_code to null; leaves suspension_count at its accumulated value"
          - "re-derives compliance_status via permit_compliance_derivation"
          - "recomputes Outfitter.active_permit_count and re-derives Outfitter.status"
        note: "Guide authorizations revoked by the suspension are NOT restored; the holder must re-authorize guides, which is what makes authorized_client_capacity_total a conserved quantity to check."
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /osup/permits/{id}/revoke, or system when a NoncomplianceAction with action_type == REVOCATION is issued"
        actor: AuthorizedOfficer | system
        preconditions:
          - "permit.administrative_status IN {ISSUED, ACTIVE, SUSPENDED}"
        side_effects:
          - "writes revocation_reason_code"
          - "releases the committed allocation: UseArea.committed_service_days drops by authorized_service_days and available_service_days, demand_ratio and allocation_posture are recomputed"
          - "revokes every AUTHORIZED GuideAreaAuthorization with revocation_reason_code PERMIT_CLOSED"
          - "closes every FeeAssessment for this permit whose balance_due_cents == 0 (status -> CLOSED); assessments with balance_due_cents > 0 keep their status"
          - "recomputes Outfitter.active_permit_count and re-derives Outfitter.status"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /osup/permits/{id}/revoke"
        actor: AuthorizedOfficer
        preconditions:
          - "permit.administrative_status == SUSPENDED"
        side_effects:
          - "same as the ACTIVE_to_REVOKED transition"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system, POST /osup/_ops/run-daily-compliance-sweep step 3"
        actor: system
        preconditions:
          - "permit.administrative_status IN {ISSUED, ACTIVE, SUSPENDED}"
          - "permit.term_end_date < logical clock date"
        side_effects:
          - "releases the committed allocation exactly as ACTIVE_to_REVOKED does"
          - "revokes every AUTHORIZED GuideAreaAuthorization with revocation_reason_code PERMIT_CLOSED"
          - "recomputes Outfitter.active_permit_count and re-derives Outfitter.status"
      - from: ACTIVE
        to: CLOSED
        trigger: "system, on POST /osup/permits/{id}/holder-change for the predecessor permit"
        actor: system
        preconditions:
          - "permit.administrative_status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "successor Permit is created in ISSUED with predecessor_permit_id == this permit id, the same authorized_service_days, and outfitter_id == new_outfitter_id"
          - "UseArea.committed_service_days is unchanged across the pair because the predecessor leaves and the successor enters the committed set inside the same request"
          - "revokes every AUTHORIZED GuideAreaAuthorization with revocation_reason_code PERMIT_CLOSED"
          - "closes every FeeAssessment for this permit whose balance_due_cents == 0"
          - "re-derives Outfitter.status for both the outgoing and the incoming holder"

  - entity: Permit
    dimension: compliance_status
    initial_state: COMPLIANT
    terminal_states: []
    note: |
      Dimension 2 of the parallel machine, and cyclic: COMPLIANT -> PROBATION -> NONCOMPLIANT ->
      PROBATION -> COMPLIANT are all reachable. Every transition here is a system re-derivation
      by permit_compliance_derivation; no endpoint sets compliance_status directly.
    transitions:
      - from: COMPLIANT
        to: PROBATION
        trigger: "system, after any change to open_noncompliance_points, insurance_current or fee_delinquent"
        actor: system
        preconditions:
          - "5 <= open_noncompliance_points < 12, OR insurance_current == false, OR fee_delinquent == true"
        side_effects:
          - "sets updated_at and increments Permit.version by 1"
          - "does NOT alter administrative_status"
      - from: PROBATION
        to: NONCOMPLIANT
        trigger: "system, after any change to open_noncompliance_points"
        actor: system
        preconditions:
          - "open_noncompliance_points >= 12"
        side_effects:
          - "because the permit became NONCOMPLIANT, administrative_status ACTIVE -> SUSPENDED fires with suspension_reason_code POINTS_THRESHOLD and suspension_days = 30 * (1 + count of NoncomplianceAction rows for this permit with severity == MAJOR and status == UPHELD)"
      - from: COMPLIANT
        to: NONCOMPLIANT
        trigger: "system, after a single action pushes points from below 5 to 12 or more"
        actor: system
        preconditions:
          - "open_noncompliance_points >= 12"
        side_effects:
          - "same as PROBATION_to_NONCOMPLIANT"
      - from: NONCOMPLIANT
        to: PROBATION
        trigger: "system, after a cure or a rescinded appeal lowers points below 12"
        actor: system
        preconditions:
          - "5 <= open_noncompliance_points < 12, OR insurance_current == false, OR fee_delinquent == true"
        side_effects:
          - "does NOT auto-reinstate administrative_status; reinstatement is an explicit officer action"
      - from: PROBATION
        to: COMPLIANT
        trigger: "system, after cures, a new certificate filing, or a payment clears every trigger"
        actor: system
        preconditions:
          - "open_noncompliance_points < 5 AND insurance_current == true AND fee_delinquent == false"
        side_effects:
          - "sets updated_at and increments Permit.version by 1"
      - from: NONCOMPLIANT
        to: COMPLIANT
        trigger: "system, when every trigger clears in one request"
        actor: system
        preconditions:
          - "open_noncompliance_points < 5 AND insurance_current == true AND fee_delinquent == false"
        side_effects:
          - "sets updated_at and increments Permit.version by 1"

  - entity: OperatingPlan
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    note: "Cyclic: UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED -> UNDER_REVIEW may repeat, bounded by MAX_REVISION_ROUNDS = 2."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /osup/operating-plans/{id}/submit"
        actor: OutfitterRepresentative
        preconditions:
          - "plan.status IN {DRAFT, REVISION_REQUESTED}"
          - "acting X-User-ID == Permit.outfitter_id for plan.permit_id"
          - "plan.completeness_score == 100.0 (else ERR_OPERATING_PLAN_INCOMPLETE)"
          - "Permit.administrative_status IN {ISSUED, ACTIVE, SUSPENDED} (else ERR_PERMIT_NOT_OPERATIONAL)"
        side_effects:
          - "clears deficiency_sections to []"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /osup/operating-plans/{id}/submit"
        actor: OutfitterRepresentative
        preconditions:
          - "plan.status == REVISION_REQUESTED"
          - "plan.completeness_score == 100.0"
        side_effects:
          - "clears deficiency_sections to []"
          - "leaves revision_round at its accumulated value and clears reviewed_by_user_id to null so a fresh reviewer must take custody"
        note: "Closes the revision cycle."
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /osup/operating-plans/{id}/start-review"
        actor: PermitSpecialist | AuthorizedOfficer
        preconditions:
          - "plan.status == SUBMITTED"
        side_effects:
          - "writes reviewed_by_user_id = acting X-User-ID"
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /osup/operating-plans/{id}/request-revision"
        actor: PermitSpecialist | AuthorizedOfficer
        preconditions:
          - "plan.status == UNDER_REVIEW"
          - "plan.revision_round < 2 (else ERR_REVISION_LIMIT_EXCEEDED)"
          - "every entry of deficiency_sections is one of {sanitation_section, campsite_section, stock_section, resource_protection_section} (else ERR_INVALID_REQUEST)"
        side_effects:
          - "increments revision_round by 1"
          - "stores deficiency_sections"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /osup/operating-plans/{id}/approve"
        actor: AuthorizedOfficer
        preconditions:
          - "plan.status == UNDER_REVIEW"
          - "acting X-User-ID != plan.reviewed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "writes approved_by_user_id = acting X-User-ID"
          - "unblocks the Permit ISSUED -> ACTIVE precondition for plan_year"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /osup/operating-plans/{id}/reject"
        actor: AuthorizedOfficer
        preconditions:
          - "plan.status == UNDER_REVIEW"
          - "acting X-User-ID != plan.reviewed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "writes rejection_reason_code"

  - entity: Guide
    initial_state: PENDING_QUALIFICATION
    terminal_states: []
    note: "Cyclic: QUALIFIED -> LAPSED -> QUALIFIED repeats every certification cycle."
    transitions:
      - from: PENDING_QUALIFICATION
        to: QUALIFIED
        trigger: "POST /osup/guides/{id}/qualify"
        actor: PermitSpecialist
        preconditions:
          - "guide.status IN {PENDING_QUALIFICATION, LAPSED}"
          - "guide.first_aid_cert_type != NONE (else ERR_FIRST_AID_CERT_MISSING)"
          - "guide.first_aid_expires_on >= logical clock date (else ERR_FIRST_AID_CERT_EXPIRED)"
          - "guide.qualification_level != TRAINEE (else ERR_GUIDE_LEVEL_INELIGIBLE)"
        side_effects:
          - "writes qualified_at and recomputes base_client_capacity via guide_client_capacity"
      - from: QUALIFIED
        to: LAPSED
        trigger: "system, POST /osup/_ops/run-daily-compliance-sweep step 2"
        actor: system
        preconditions:
          - "guide.status == QUALIFIED"
          - "guide.first_aid_expires_on < logical clock date"
        side_effects:
          - "recomputes base_client_capacity to 0"
          - "because the guide lapsed, every GuideAreaAuthorization with this guide_id and status == AUTHORIZED becomes REVOKED with revocation_reason_code GUIDE_LAPSED"
          - "because those authorizations were revoked, each affected Permit.authorized_client_capacity_total is recomputed, and any Permit whose recomputed total drops below UseArea.party_size_max while administrative_status == ACTIVE has compliance_status re-derived to PROBATION"
      - from: LAPSED
        to: QUALIFIED
        trigger: "POST /osup/guides/{id}/certifications"
        actor: OutfitterRepresentative
        preconditions:
          - "guide.status IN {PENDING_QUALIFICATION, LAPSED, QUALIFIED}"
          - "acting X-User-ID == guide.outfitter_id"
          - "submitted first_aid_expires_on >= logical clock date (else ERR_FIRST_AID_CERT_EXPIRED)"
          - "submitted first_aid_cert_type != NONE (else ERR_FIRST_AID_CERT_MISSING)"
          - "guide.qualification_level != TRAINEE (else the guide stays in its current status)"
        side_effects:
          - "overwrites first_aid_cert_type and first_aid_expires_on, recomputes base_client_capacity, writes qualified_at"
        note: "Does NOT restore revoked GuideAreaAuthorization rows; the specialist must re-authorize."

  - entity: GuideAreaAuthorization
    initial_state: AUTHORIZED
    terminal_states: [REVOKED]
    transitions:
      - from: AUTHORIZED
        to: REVOKED
        trigger: "POST /osup/guide-authorizations/{id}/revoke, or one of the three system cascades (guide lapse, permit suspension, permit close/expire/revoke)"
        actor: "OutfitterRepresentative | AuthorizedOfficer | system"
        preconditions:
          - "authorization.status == AUTHORIZED (else ERR_AUTHORIZATION_NOT_ACTIVE; REVOKED is terminal and a second revoke is refused rather than being a no-op)"
        side_effects:
          - "writes revoked_at and revocation_reason_code"
          - "recomputes Permit.authorized_client_capacity_total"

  - entity: InsuranceCertificate
    initial_state: ACTIVE
    terminal_states: [EXPIRED, SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system, on POST /osup/permits/{id}/insurance-certificates for the same coverage_type"
        actor: system
        preconditions:
          - "an existing ACTIVE certificate on the permit shares the new certificate's coverage_type"
        side_effects:
          - "recomputes Permit.insurance_current and re-derives Permit.compliance_status"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system, POST /osup/_ops/run-daily-compliance-sweep step 1"
        actor: system
        preconditions:
          - "certificate.status == ACTIVE"
          - "certificate.expiration_date < logical clock date"
        side_effects:
          - "because no ACTIVE GENERAL_LIABILITY certificate meeting the area minimum remains, Permit.insurance_current becomes false"
          - "because insurance_current became false, Permit.compliance_status is re-derived to PROBATION (or stays NONCOMPLIANT)"
          - "because insurance_current became false while administrative_status == ACTIVE, the permit is suspended with suspension_reason_code INSURANCE_LAPSE"
          - "because the permit was suspended, its AUTHORIZED GuideAreaAuthorization rows are revoked with revocation_reason_code PERMIT_SUSPENDED"

  - entity: Bond
    initial_state: ACTIVE
    terminal_states: [EXPIRED, SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system, on POST /osup/permits/{id}/bonds"
        actor: system
        preconditions:
          - "an existing ACTIVE bond on the permit"
        side_effects:
          - "recomputes Permit.bond_current"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system, POST /osup/_ops/run-daily-compliance-sweep step 1"
        actor: system
        preconditions:
          - "bond.status == ACTIVE"
          - "bond.expiration_date < logical clock date"
        side_effects:
          - "recomputes Permit.bond_current to false, which blocks reinstatement until a new bond is filed"

  - entity: TripUseReport
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /osup/trip-use-reports/{id}/accept"
        actor: PermitSpecialist
        preconditions:
          - "report.status == SUBMITTED"
          - "cumulative ACCEPTED service_days_used for the permit and season, including this report, <= Permit.authorized_service_days (else ERR_SERVICE_DAY_LIMIT_EXCEEDED)"
        side_effects:
          - "writes accepted_at"
          - "creates the FeeAssessment for (permit_id, season_year) in PROVISIONAL if none exists, then recomputes reported_agr_cents, applied_rate_bp and fee_component_cents for every ACCEPTED report and assessed_fee_cents under the PROVISIONAL_PER_REPORT variant"
          - "recomputes Permit.service_days_used_ytd and Permit.fee_delinquent, then re-derives Permit.compliance_status"
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "POST /osup/trip-use-reports/{id}/amend"
        actor: OutfitterRepresentative
        preconditions:
          - "report.status == ACCEPTED"
          - "acting X-User-ID == Permit.outfitter_id"
          - "expected_permit_version == Permit.version (else ERR_STALE_PERMIT_VERSION)"
        side_effects:
          - "creates a replacement TripUseReport in ACCEPTED with supersedes_report_id == this id, the same period_start_date / period_end_date, and the amended figures (cascade hop 1)"
          - "because the ACCEPTED report set changed, the FeeAssessment for the season reverts FINAL or PAID to PROVISIONAL, clears finalized_at, and recomputes reported_agr_cents, assessed_fee_cents, balance_due_cents and credit_balance_cents under PROVISIONAL_PER_REPORT (cascade hop 2)"
          - "because balance_due_cents became positive, Permit.fee_delinquent becomes true (cascade hop 3)"
          - "because fee_delinquent became true, Permit.compliance_status is re-derived COMPLIANT -> PROBATION (cascade hop 4)"
          - "increments Permit.version by 1"

  - entity: FeeAssessment
    initial_state: PROVISIONAL
    terminal_states: [CLOSED]
    transitions:
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /osup/fee-assessments/{id}/finalize"
        actor: PermitSpecialist
        preconditions:
          - "assessment.status == PROVISIONAL"
          - "no TripUseReport with this permit_id and season_year is still SUBMITTED (else ERR_USE_REPORTS_PENDING)"
          - "at least one ACCEPTED report necessarily exists and needs no separate guard: the FeeAssessment row itself is created only by an acceptance and no endpoint deletes a report, so the accepted set for the season can never be empty once the assessment exists"
        side_effects:
          - "recomputes reported_agr_cents and assessed_fee_cents under the FINAL_AGGREGATE variant, sets variant_applied = FINAL_AGGREGATE and finalized_at"
          - "recomputes balance_due_cents and credit_balance_cents, then Permit.fee_delinquent and Permit.compliance_status"
      - from: FINAL
        to: PAID
        trigger: "POST /osup/fee-assessments/{id}/payments"
        actor: OutfitterRepresentative
        preconditions:
          - "assessment.status IN {PROVISIONAL, FINAL}"
          - "amount_cents <= balance_due_cents (else ERR_PAYMENT_EXCEEDS_BALANCE)"
        side_effects:
          - "adds amount_cents to paid_to_date_cents and recomputes balance_due_cents and credit_balance_cents"
          - "moves to PAID only when balance_due_cents reaches 0; otherwise the status is unchanged"
          - "recomputes Permit.fee_delinquent and re-derives Permit.compliance_status"
      - from: PAID
        to: PROVISIONAL
        trigger: "system, on POST /osup/trip-use-reports/{id}/amend"
        actor: system
        preconditions:
          - "assessment.status IN {FINAL, PAID}"
        side_effects:
          - "clears finalized_at, sets variant_applied = PROVISIONAL_PER_REPORT and recomputes every money field"
        note: "Revert edge that makes PAID non-terminal; paid_to_date_cents is never reduced, so an overpayment surfaces in credit_balance_cents."
      - from: FINAL
        to: PROVISIONAL
        trigger: "system, on POST /osup/trip-use-reports/{id}/amend"
        actor: system
        preconditions:
          - "assessment.status == FINAL"
        side_effects:
          - "same as the PAID_to_PROVISIONAL transition"
      - from: PAID
        to: CLOSED
        trigger: "POST /osup/fee-assessments/{id}/close, or system on permit revocation, expiry or holder-change close"
        actor: "ProgramAdministrator | system"
        preconditions:
          - "assessment.status == PAID (else ERR_FEE_ASSESSMENT_CLOSED — a PROVISIONAL, FINAL or already CLOSED assessment is not closable)"
          - "assessment.balance_due_cents == 0"
        side_effects:
          - "locks the assessment; further payments are rejected with ERR_FEE_ASSESSMENT_CLOSED"

  - entity: NoncomplianceAction
    initial_state: ISSUED
    terminal_states: [CURED, UPHELD, RESCINDED]
    note: "Branching: ISSUED forks to CURED or to APPEALED, and APPEALED forks to UPHELD or RESCINDED with opposite point consequences."
    transitions:
      - from: ISSUED
        to: CURED
        trigger: "POST /osup/noncompliance-actions/{id}/cure"
        actor: OutfitterRepresentative
        preconditions:
          - "action.status == ISSUED"
          - "acting X-User-ID == Permit.outfitter_id"
          - "logical clock date <= action.cure_deadline_date (else ERR_CURE_DEADLINE_PASSED)"
        side_effects:
          - "writes corrective_summary"
          - "the action stops contributing points, so Permit.open_noncompliance_points is recomputed and compliance_status re-derived downward"
      - from: ISSUED
        to: APPEALED
        trigger: "POST /osup/noncompliance-actions/{id}/appeal"
        actor: OutfitterRepresentative
        preconditions:
          - "action.status == ISSUED"
          - "acting X-User-ID == Permit.outfitter_id"
        side_effects:
          - "writes appeal_basis; points keep accruing while the appeal is pending"
      - from: APPEALED
        to: UPHELD
        trigger: "POST /osup/noncompliance-actions/{id}/decide-appeal with decision UPHELD"
        actor: AuthorizedOfficer
        preconditions:
          - "action.status == APPEALED"
          - "acting X-User-ID != action.issued_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "writes appeal_decided_by_user_id; points unchanged"
          - "an UPHELD MAJOR action raises the suspension_days multiplier used by the next points-threshold suspension"
      - from: APPEALED
        to: RESCINDED
        trigger: "POST /osup/noncompliance-actions/{id}/decide-appeal with decision RESCINDED"
        actor: AuthorizedOfficer
        preconditions:
          - "action.status == APPEALED"
          - "acting X-User-ID != action.issued_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "writes appeal_decided_by_user_id; the action stops contributing points, Permit.open_noncompliance_points is recomputed and compliance_status re-derived downward"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's version, only true races)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: prospectus-award-stale-use-area
    parent_entity: UseArea
    write_endpoint: "POST /osup/prospectuses/{id}/award"
    occ_field: "expected_use_area_version"
    description: |
      Awarding a Prospectus commits service days out of the UseArea allocation the officer
      inspected before deciding. If UseArea.version has advanced since that read — because a
      different solicitation in the same area was awarded, or a sibling permit was issued and
      changed available_service_days — the award is rejected as stale. The award itself would
      otherwise still be legitimate under the product rules (a second prospectus in the same
      area may be awarded on its own merits), so the conflict cannot be reduced to a status
      precondition on the Prospectus.
    error_id: ERR_STALE_USE_AREA_VERSION
    http_status: 412

  - rule_id: use-report-amend-stale-permit
    parent_entity: Permit
    write_endpoint: "POST /osup/trip-use-reports/{id}/amend"
    occ_field: "expected_permit_version"
    description: |
      An amendment creates a replacement report that supersedes an already accepted one and
      rewrites the season's FeeAssessment. Amending against a Permit whose version has advanced
      since the holder last read it is rejected as stale, because the fee basis the holder
      computed from is no longer the basis the server holds. Amending a different report of the
      same permit is legitimate on its own, so the conflict is a stale-version condition rather
      than a status precondition on the report.
    error_id: ERR_STALE_PERMIT_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# -----------------------------------------------------------------------------
calculations:

  - name: use_area_service_day_availability
    trigger: "on PermitApplication screen / deny / withdraw, on prospectus award and cancel, on permit issuance, revocation, expiry and holder-change close"
    algorithm: aggregation
    formula: |
      allocatable = total_allocated_service_days - reserved_admin_service_days
      committed_service_days = SUM(Permit.authorized_service_days)
          WHERE Permit.use_area_id == area.id
            AND Permit.administrative_status IN {ISSUED, ACTIVE, SUSPENDED}
      pending_service_days = SUM(PermitApplication.requested_service_days)
          WHERE PermitApplication.use_area_id == area.id
            AND PermitApplication.status IN {CAPACITY_SCREENED, DIRECT_AWARD_PENDING,
                                            PROSPECTUS_QUEUED, PROSPECTUS_RESPONDED, AWARDED}
      available_service_days = allocatable - committed_service_days - pending_service_days
      demand_ratio = round_half_up((committed_service_days + pending_service_days) / allocatable, 4)
                     # allocatable is validated >= 1 at UseArea creation, so no zero divide
      allocation_posture =
          EXHAUSTED    if available_service_days <= 0
          CONSTRAINED  if available_service_days > 0 AND demand_ratio >= 0.8
          OPEN         otherwise
    input_set: |
      Permit rows in {ISSUED, ACTIVE, SUSPENDED} only — REVOKED, EXPIRED and CLOSED permits release
      their days. PermitApplication rows in the five holding statuses only — DRAFT and SUBMITTED
      applications hold nothing, PERMIT_ISSUED / DENIED / WITHDRAWN release. No time window: the
      whole set for the area is recomputed from scratch on every trigger (full recompute, never
      incremental).
    constants:
      CONSTRAINED_DEMAND_RATIO: 0.8
    precision: "integers for day counts; demand_ratio to 4 decimal places, round_half_up"

  - name: allocatable_service_day_conservation
    trigger: "invariant asserted after every write that touches committed_service_days or pending_service_days"
    algorithm: aggregation
    formula: |
      allocatable_service_days == committed_service_days + pending_service_days + available_service_days
      # holds for every UseArea at every observable instant. A screen moves days
      # available -> pending; an issuance moves pending -> committed; a withdraw, deny,
      # revoke, expiry or losing-response denial moves them back to available; a
      # holder-change moves committed -> committed with zero net change.
    input_set: "one UseArea row and the two aggregates defined by use_area_service_day_availability"
    constants: {}
    precision: "exact integers, no rounding"

  - name: prospectus_requirement_determination
    trigger: "POST /osup/permit-applications/{id}/screen"
    algorithm: threshold
    formula: |
      avail = UseArea.available_service_days   # BEFORE this application's hold is added
      IF application.application_type == RENEWAL:
          pred = Permit[application.predecessor_permit_id]
          IF pred.compliance_status == COMPLIANT
             AND pred.latest_performance_rating IN {SUPERIOR, SATISFACTORY}
             AND application.requested_service_days <= pred.authorized_service_days:
              routing_decision = DIRECT
          ELSE:
              routing_decision = PROSPECTUS
      ELSE:  # NEW
          routing_decision = DIRECT      IF application.requested_service_days <= avail
          routing_decision = PROSPECTUS  otherwise
    input_set: |
      avail is read before the screening hold is applied, so an application asking for exactly the
      remaining days routes DIRECT. A RENEWAL with no PerformanceEvaluation on its predecessor has
      latest_performance_rating == null, which is not in the priority set, so it routes PROSPECTUS.
    constants: {}
    precision: "integer comparison; the boundary is <= (requested == avail routes DIRECT)"

  - name: needs_assessment_allocation_recomputation
    trigger: "NeedsAssessment creation, and every screen / deny / withdraw / award / cancel / issue-permit / revoke that changes the area's committed or pending totals"
    algorithm: aggregation
    formula: |
      # for the PUBLISHED assessment of (use_area_id, assessment_year)
      allocated_service_days   = UseArea.committed_service_days + UseArea.pending_service_days
      unallocated_service_days = determined_capacity_service_days - allocated_service_days
      prospectus_required      = (public_need_finding == NO_NEED) OR (unallocated_service_days <= 0)
      # At creation time the assessment has no permits or applications behind it, so
      # allocated_service_days is taken from the request's allocated_service_days input and
      # recomputed from the area's aggregates on every later trigger.
    input_set: "the single PUBLISHED NeedsAssessment for the area and year; DRAFT and SUPERSEDED assessments are never recomputed"
    constants: {}
    precision: "exact integers; the prospectus_required threshold is <= 0, so a determined capacity exactly consumed by existing claims already requires a prospectus"

  - name: guide_client_capacity
    trigger: "POST /osup/guides/{id}/qualify, POST /osup/guides/{id}/certifications, and GuideAreaAuthorization creation"
    algorithm: weighted_scoring
    formula: |
      level_ratio = {TRAINEE: 0, ASSISTANT: 4, LEAD: 8}[guide.qualification_level]
      cert_cap    = {NONE: 0, BASIC_FIRST_AID: 4, WFR: 8, WEMT: 12}[guide.first_aid_cert_type]
      experience_bonus = min(2, floor(guide.seasons_experience / 3))
      IF guide.qualification_level == TRAINEE OR guide.first_aid_cert_type == NONE:
          base_client_capacity = 0
      ELSE:
          base_client_capacity = max(0, min(level_ratio, cert_cap) + experience_bonus)
      # frozen onto the junction row at authorization time:
      GuideAreaAuthorization.authorized_client_capacity =
          min(UseArea.max_clients_per_guide, Guide.base_client_capacity)
      Permit.authorized_client_capacity_total = SUM(authorized_client_capacity)
          WHERE permit_id == permit.id AND status == AUTHORIZED
    input_set: |
      Four inputs interact non-linearly: qualification_level and first_aid_cert_type are combined by
      min() (the weaker of field tier and medical tier binds), the experience bonus is added after
      that min and capped at 2, and the area ceiling is applied last by a second min(). The two
      categorical zero cases short-circuit before the arithmetic.
    constants:
      LEVEL_RATIO: { TRAINEE: 0, ASSISTANT: 4, LEAD: 8 }
      CERT_CAP: { NONE: 0, BASIC_FIRST_AID: 4, WFR: 8, WEMT: 12 }
      EXPERIENCE_BONUS_MAX: 2
      EXPERIENCE_SEASONS_PER_POINT: 3
    precision: "integers, floor on the experience division"

  - name: guide_capacity_conservation
    trigger: "invariant asserted across a revoke / re-authorize pair on the same permit"
    algorithm: aggregation
    formula: |
      Permit.authorized_client_capacity_total ==
          SUM(GuideAreaAuthorization.authorized_client_capacity
              WHERE permit_id == permit.id AND status == AUTHORIZED)
      # A revoke followed by a fresh authorization of the same guide, with the guide's inputs
      # unchanged, must return authorized_client_capacity_total to its pre-revoke value. The
      # revoked row keeps its frozen capacity but no longer counts, so any implementation that
      # decrements a stored counter instead of recomputing the sum drifts here.
    input_set: "GuideAreaAuthorization rows for one permit, status == AUTHORIZED only"
    constants: {}
    precision: "exact integers"

  - name: permit_fee_assessment
    trigger: "TripUseReport accept (PROVISIONAL_PER_REPORT), FeeAssessment finalize (FINAL_AGGREGATE), TripUseReport amend (reverts to PROVISIONAL_PER_REPORT)"
    algorithm: tiered_pricing
    formula: |
      # per report, computed at accept time and stored on the report row
      adjusted_gross_revenue_cents = gross_revenue_cents - allowable_deductions_cents
      # allowable_deductions_cents > floor(gross_revenue_cents * 0.15) is rejected before this runs

      bracket_rate_bp(x) =
          RATE_TIER_1_BP  if x <= TIER_1_CEILING_CENTS
          RATE_TIER_2_BP  if x <= TIER_2_CEILING_CENTS
          RATE_TIER_3_BP  otherwise

      ### VARIANT A — PROVISIONAL_PER_REPORT (round per report, then sum)
      ordered = ACCEPTED reports for (permit_id, season_year)
                sorted by period_start_date ASC, tie-break created_at ASC
      cum = 0
      FOR r IN ordered:
          IF permit.fee_schedule_code == FLAT_THREE_PERCENT: r.applied_rate_bp = 300
          ELSE:                                              r.applied_rate_bp = bracket_rate_bp(cum)
          r.fee_component_cents = round_half_up(r.adjusted_gross_revenue_cents * r.applied_rate_bp / 10000)
          cum = cum + r.adjusted_gross_revenue_cents
      rate_fee = SUM(r.fee_component_cents)

      ### VARIANT B — FINAL_AGGREGATE (sum first, then apply brackets, then round once)
      total_agr = SUM(r.adjusted_gross_revenue_cents FOR r IN ordered)
      IF permit.fee_schedule_code == FLAT_THREE_PERCENT:
          rate_fee = round_half_up(total_agr * 300 / 10000)
      ELSE:
          b1 = min(total_agr, TIER_1_CEILING_CENTS)
          b2 = max(0, min(total_agr, TIER_2_CEILING_CENTS) - TIER_1_CEILING_CENTS)
          b3 = max(0, total_agr - TIER_2_CEILING_CENTS)
          rate_fee = round_half_up((b1*RATE_TIER_1_BP + b2*RATE_TIER_2_BP + b3*RATE_TIER_3_BP) / 10000)

      ### common tail, both variants
      minimum_fee_applied = rate_fee < MINIMUM_ANNUAL_FEE_CENTS
      assessed_fee_cents  = max(MINIMUM_ANNUAL_FEE_CENTS, rate_fee)
      reported_agr_cents  = total_agr
      balance_due_cents   = max(0, assessed_fee_cents - paid_to_date_cents)
      credit_balance_cents = max(0, paid_to_date_cents - assessed_fee_cents)
    input_set: |
      Only TripUseReport rows with status == ACCEPTED and season_year == assessment.season_year
      participate; SUBMITTED and SUPERSEDED rows are excluded. Rounding order is PINNED: variant A
      rounds every per-report product to the cent and then sums; variant B sums the untouched
      adjusted gross revenues, applies the graduated brackets to that single total and rounds
      exactly once. The variants also assign brackets differently — A charges a report entirely at
      the bracket its pre-report cumulative falls in, B splits the season total across brackets —
      so identical accepted reports yield different assessed_fee_cents.
    constants:
      TIER_1_CEILING_CENTS: 2500000
      TIER_2_CEILING_CENTS: 10000000
      RATE_TIER_1_BP: 300
      RATE_TIER_2_BP: 400
      RATE_TIER_3_BP: 500
      MINIMUM_ANNUAL_FEE_CENTS: 30000
      DEDUCTION_CAP_PCT: 0.15
    precision: "cents, round_half_up; variant A rounds N times (once per report), variant B rounds once"
    variants:
      - name: PROVISIONAL_PER_REPORT
        when: "any time an accepted-report set changes — report acceptance, and the revert caused by an amendment"
        difference: "bracket chosen from the cumulative adjusted gross revenue of strictly earlier reports; each per-report product rounded to the cent before summing"
      - name: FINAL_AGGREGATE
        when: "FeeAssessment finalize, once every report for the season has left SUBMITTED"
        difference: "season total split across graduated brackets and rounded once; a report that straddles a bracket boundary is billed partly at the higher rate instead of entirely at the lower one"

  - name: fee_obligation_conservation
    trigger: "invariant asserted after every accept, finalize, payment and amend"
    algorithm: aggregation
    formula: |
      assessed_fee_cents + credit_balance_cents == paid_to_date_cents + balance_due_cents
      # Money identity for one FeeAssessment. An amendment that raises the fee moves the delta into
      # balance_due_cents; an amendment that lowers it below what was already paid moves the delta
      # into credit_balance_cents. paid_to_date_cents never decreases, so a forward amendment paired
      # with its reversing amendment must land back on the original assessed_fee_cents with the
      # identity intact and zero drift.
    input_set: "one FeeAssessment row"
    constants: {}
    precision: "exact integer cents"

  - name: required_financial_assurance
    trigger: "Bond creation, Permit activation and reinstatement"
    algorithm: threshold
    formula: |
      raw = permit.authorized_service_days * BOND_CENTS_PER_SERVICE_DAY
      required_amount_cents = min(BOND_CEILING_CENTS, max(BOND_FLOOR_CENTS, raw))
      bond_current = EXISTS Bond WHERE permit_id == permit.id
                                   AND status == ACTIVE
                                   AND bond_amount_cents >= required_amount_cents
    input_set: "Bond rows with status == ACTIVE only; SUPERSEDED and EXPIRED bonds never satisfy the requirement"
    constants:
      BOND_CENTS_PER_SERVICE_DAY: 5000
      BOND_FLOOR_CENTS: 250000
      BOND_CEILING_CENTS: 5000000
    precision: "exact integer cents; the comparison is >= (a bond exactly equal to the requirement satisfies it)"

  - name: prospectus_evaluation_score
    trigger: "POST /osup/prospectuses/{id}/close-submissions (PRELIMINARY), POST /osup/prospectuses/{id}/award (FINAL)"
    algorithm: weighted_scoring
    formula: |
      experience_pts = min(100, Outfitter.prior_permit_count * 25)

      guide_total = COUNT(Guide WHERE outfitter_id == app.outfitter_id
                                  AND status IN {QUALIFIED, PENDING_QUALIFICATION, LAPSED})
      guide_numerator =
          COUNT(... status IN {QUALIFIED, PENDING_QUALIFICATION})   # PRELIMINARY
          COUNT(... status == QUALIFIED)                            # FINAL
      guide_pts = 0.00 IF guide_total == 0
                  ELSE round_half_up(100 * guide_numerator / guide_total, 2)

      assurance_pts = 100.0                                                # PRELIMINARY
                      100.0 IF Outfitter.prequalification_insurance_verified ELSE 0.0   # FINAL

      need_match_pts = 100.0 - min(100.0,
          round_half_up(abs(app.requested_service_days - prospectus.offered_service_days)
                        * 100 / prospectus.offered_service_days, 2))

      score = round_half_up(0.30*experience_pts + 0.30*guide_pts
                            + 0.20*assurance_pts + 0.20*need_match_pts, 2)
    input_set: |
      One score per PermitApplication with status == PROSPECTUS_RESPONDED and prospectus_id == the
      solicitation. The two variants differ on two axes at once: the guide roster numerator
      (PRELIMINARY credits not-yet-qualified hires, FINAL credits only QUALIFIED guides) and the
      assurance term (PRELIMINARY assumes documents acceptable, FINAL reads the verified flag).
      Because the axes push in opposite directions for different applicants, the PRELIMINARY
      ranking and the FINAL ranking can order the same pool differently.
    constants:
      WEIGHT_EXPERIENCE: 0.30
      WEIGHT_GUIDE: 0.30
      WEIGHT_ASSURANCE: 0.20
      WEIGHT_NEED_MATCH: 0.20
      EXPERIENCE_PTS_PER_PRIOR_PERMIT: 25
    precision: "2 decimal places, round_half_up, on guide_pts, need_match_pts and the final score"
    variants:
      - name: PRELIMINARY
        when: "written to PermitApplication.preliminary_evaluation_score when the prospectus closes submissions"
        difference: "guide numerator includes PENDING_QUALIFICATION guides; assurance_pts is 100.0 for every applicant"
      - name: FINAL
        when: "written to PermitApplication.final_evaluation_score when the prospectus is awarded, and it alone decides the winner"
        difference: "guide numerator counts only QUALIFIED guides; assurance_pts is 0.0 unless Outfitter.prequalification_insurance_verified is true"

  - name: prospectus_award_selector
    trigger: "POST /osup/prospectuses/{id}/award"
    algorithm: weighted_scoring
    formula: |
      candidates = PermitApplication WHERE prospectus_id == prospectus.id
                                       AND status == PROSPECTUS_RESPONDED
                                       AND final_evaluation_score >= prospectus.min_qualifying_score
      IF candidates is empty: reject with ERR_NO_RESPONSIVE_APPLICATIONS (409)
      rank by final_evaluation_score DESC
      tie-break by created_at ASC        # earliest filed application wins an exact score tie
      winner = first row after ranking
    input_set: |
      Eligibility filter, ranking expression, tie-break and empty-pool fallback are all pinned.
      Applications that responded but scored below min_qualifying_score are excluded from the
      candidate pool and are denied with denial_reason_code NOT_SELECTED alongside the losers.
      The record id is never consulted; created_at ASC is the only fallback ordering.
    constants: {}
    precision: "score comparison at 2 decimal places"

  - name: performance_weighted_rating
    trigger: "POST /osup/permits/{id}/performance-evaluations"
    algorithm: weighted_scoring
    formula: |
      # evaluation order is PINNED — the multiplier reads the PROVISIONAL band, the published
      # rating reads the ADJUSTED score. There is no fixed-point iteration: the calculation
      # looks circular (penalty depends on band, band depends on score net of penalty) and is
      # resolved by executing exactly these six steps once, in order.
      step 1: raw_score = round_half_up(0.35*resource_protection_score + 0.25*client_safety_score
                                       + 0.20*reporting_timeliness_score + 0.20*fee_compliance_score, 2)
      step 2: provisional_band = band(raw_score)
      step 3: multiplier = {SUPERIOR: 0.5, SATISFACTORY: 1.0,
                            MARGINAL: 1.5, UNSATISFACTORY: 2.0}[provisional_band]
      step 4: penalty_points_applied = round_half_up(min(30.0,
                    Permit.open_noncompliance_points * multiplier), 2)
      step 5: weighted_score = round_half_up(max(0.0, raw_score - penalty_points_applied), 2)
      step 6: rating = band(weighted_score)

      band(s) = SUPERIOR       if s >= 90.0
                SATISFACTORY   if s >= 75.0
                MARGINAL       if s >= 60.0
                UNSATISFACTORY otherwise
      # after the row is written, Permit.latest_performance_rating is recomputed as the rating of
      # the evaluation with the highest evaluation_year, tie-broken by created_at DESC
    input_set: |
      Four officer scores plus Permit.open_noncompliance_points read at request time. Steps 2 and 6
      call the same band() function on different arguments; swapping them (deriving the multiplier
      from the adjusted score) produces a different published rating for the same inputs.
    constants:
      WEIGHT_RESOURCE_PROTECTION: 0.35
      WEIGHT_CLIENT_SAFETY: 0.25
      WEIGHT_REPORTING_TIMELINESS: 0.20
      WEIGHT_FEE_COMPLIANCE: 0.20
      PENALTY_CAP: 30.0
      BAND_SUPERIOR_MIN: 90.0
      BAND_SATISFACTORY_MIN: 75.0
      BAND_MARGINAL_MIN: 60.0
    precision: "2 decimal places, round_half_up, at steps 1, 4 and 5"

  - name: noncompliance_point_accumulation
    trigger: "NoncomplianceAction creation, cure, appeal decision, and every compliance re-derivation"
    algorithm: threshold
    formula: |
      points(action) = {MINOR: 2, MODERATE: 5, MAJOR: 10}[action.severity]
      open_noncompliance_points = SUM(points(a))
          WHERE a.permit_id == permit.id
            AND a.status IN {ISSUED, APPEALED, UPHELD}
            AND a.created_at >= (logical clock instant - 1095 days)
      # CURED and RESCINDED actions contribute 0. The window boundary is inclusive: an action
      # created exactly 1095 days before the current logical clock still counts.
      suspension_days_for_threshold = 30 * (1 + COUNT(a WHERE a.permit_id == permit.id
                                                        AND a.severity == MAJOR
                                                        AND a.status == UPHELD))
    input_set: "NoncomplianceAction rows for one permit inside the rolling 1095-day window, statuses ISSUED / APPEALED / UPHELD only"
    constants:
      POINTS_MINOR: 2
      POINTS_MODERATE: 5
      POINTS_MAJOR: 10
      NONCOMPLIANT_POINT_THRESHOLD: 12
      PROBATION_POINT_THRESHOLD: 5
      ROLLING_WINDOW_DAYS: 1095
      BASE_SUSPENSION_DAYS: 30
    precision: "exact integers; both thresholds are >= comparisons (12 points suspends, 11 does not)"

  - name: permit_compliance_derivation
    trigger: "after any change to open_noncompliance_points, insurance_current, bond_current or fee_delinquent"
    algorithm: constraint_propagation
    formula: |
      # NOT evaluated at permit issuance. A newly issued Permit is created with
      # compliance_status == COMPLIANT even though insurance_current and bond_current are still
      # false, because no InsuranceCertificate, Bond, NoncomplianceAction or FeeAssessment write
      # has happened yet. Missing insurance blocks activation through the activate precondition
      # ERR_INSURANCE_COVERAGE_INSUFFICIENT, not through compliance_status. The derivation below
      # runs only after a write that actually touches one of the four driver values.
      # evaluated in this order, first match wins
      IF open_noncompliance_points >= 12:                      compliance_status = NONCOMPLIANT
      ELIF open_noncompliance_points >= 5
           OR insurance_current == false
           OR fee_delinquent == true:                          compliance_status = PROBATION
      ELSE:                                                    compliance_status = COMPLIANT

      # propagation: entering NONCOMPLIANT while administrative_status == ACTIVE suspends the
      # permit (suspension_reason_code POINTS_THRESHOLD); leaving NONCOMPLIANT never
      # auto-reinstates. Leaving PROBATION never changes administrative_status.
    input_set: "one Permit row plus the three derived booleans and the point total"
    constants: {}
    precision: "enum comparison"

  - name: operating_plan_completeness
    trigger: "OperatingPlan creation and every submit"
    algorithm: aggregation
    formula: |
      REQUIRED_KEYS = {
        sanitation_section:          [human_waste_method, greywater_method, packout_commitment],
        campsite_section:            [designated_sites_only, max_nights_per_site, fire_policy],
        stock_section:               [stock_type, max_head, feed_source, tie_method],
        resource_protection_section: [weed_free_certification, sensitive_site_avoidance, monitoring_commitment] }
      completeness_score = SUM(25.0 for each section whose REQUIRED_KEYS are all present and non-null)
      # submit requires completeness_score == 100.0 exactly
    input_set: "the four section objects of one OperatingPlan"
    constants:
      SECTION_WEIGHT: 25.0
      SUBMIT_THRESHOLD: 100.0
    precision: "1 decimal place; the submit gate is an equality test against 100.0"

  - name: outfitter_status_derivation
    trigger: "after any Permit.administrative_status change and after holder-change approval"
    algorithm: constraint_propagation
    formula: |
      active_permit_count = COUNT(Permit WHERE outfitter_id == o.id AND administrative_status == ACTIVE)
      suspended_count     = COUNT(Permit WHERE outfitter_id == o.id AND administrative_status == SUSPENDED)
      held_count          = COUNT(Permit WHERE outfitter_id == o.id
                                          AND administrative_status IN {ISSUED, ACTIVE, SUSPENDED})
      prior_permit_count  = COUNT(Permit WHERE outfitter_id == o.id)
                            # every permit ever issued to the outfitter, in any administrative_status
      # first match wins
      IF active_permit_count >= 1:                          status = PERMITTED
      ELIF suspended_count >= 1:                            status = SUSPENDED
      ELIF held_count >= 1:                                 status = PERMITTED
      ELSE:                                                 status = APPLICANT
    input_set: "all Permit rows for one Outfitter, no time window"
    constants: {}
    precision: "exact integer counts"

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (Ordered by Priority)
#
# Evaluation is strictly top-down by `priority`. The FIRST rule whose condition is
# violated produces the response; no later rule is consulted. Within one priority
# number, path parameters are validated left-to-right as they appear in the URL, and
# body-referenced ids after the path ids in the field order declared by §1.5 `input:`.
# -----------------------------------------------------------------------------
validations:

  # ---- 1. Authentication ----
  - priority: 1
    category: auth
    check: "X-User-Role header is present and holds one of the four role names in §1.7; X-User-ID is present and non-empty on every mutating request"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  # ---- 2. Authorization ----
  - priority: 2
    category: auth
    check: "the X-User-Role value appears in the endpoint's `roles` list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  # ---- 3. Existence (path ids left-to-right, then body ids in declared order) ----
  - priority: 3
    category: existence
    check: "use_area_id / {id} resolves to a UseArea"
    error_id: ERR_USE_AREA_NOT_FOUND
    http_status: 404
    applies_to: "GET|POST /osup/use-areas/{id}/**, POST /osup/permit-applications, POST /osup/prospectuses"
  - priority: 3
    category: existence
    check: "outfitter_id / {id} resolves to an Outfitter"
    error_id: ERR_OUTFITTER_NOT_FOUND
    http_status: 404
    applies_to: "GET|POST /osup/outfitters/{id}/**, POST /osup/permit-applications, POST /osup/permits/{id}/holder-change"
  - priority: 3
    category: existence
    check: "needs_assessment_id / {id} resolves to a NeedsAssessment"
    error_id: ERR_NEEDS_ASSESSMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /osup/needs-assessments/{id}/publish, POST /osup/prospectuses"
  - priority: 3
    category: existence
    check: "prospectus_id / {id} resolves to a Prospectus"
    error_id: ERR_PROSPECTUS_NOT_FOUND
    http_status: 404
    applies_to: "GET|POST /osup/prospectuses/{id}/**, POST /osup/permit-applications"
  - priority: 3
    category: existence
    check: "application_id / {id} resolves to a PermitApplication"
    error_id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    applies_to: "GET|POST /osup/permit-applications/{id}/**"
  - priority: 3
    category: existence
    check: "permit_id / {id} / predecessor_permit_id resolves to a Permit"
    error_id: ERR_PERMIT_NOT_FOUND
    http_status: 404
    applies_to: "GET|POST /osup/permits/{id}/**, POST /osup/permit-applications"
  - priority: 3
    category: existence
    check: "{id} resolves to an OperatingPlan"
    error_id: ERR_OPERATING_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "POST /osup/operating-plans/{id}/**"
  - priority: 3
    category: existence
    check: "guide_id / {id} resolves to a Guide"
    error_id: ERR_GUIDE_NOT_FOUND
    http_status: 404
    applies_to: "GET|POST /osup/guides/{id}/**, POST /osup/permits/{id}/guide-authorizations"
  - priority: 3
    category: existence
    check: "{id} resolves to a GuideAreaAuthorization"
    error_id: ERR_AUTHORIZATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /osup/guide-authorizations/{id}/revoke"
  - priority: 3
    category: existence
    check: "{id} / supersedes_report_id resolves to a TripUseReport"
    error_id: ERR_USE_REPORT_NOT_FOUND
    http_status: 404
    applies_to: "GET|POST /osup/trip-use-reports/{id}/**"
  - priority: 3
    category: existence
    check: "{id} resolves to a FeeAssessment"
    error_id: ERR_FEE_ASSESSMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /osup/fee-assessments/{id}/**"
  - priority: 3
    category: existence
    check: "{id} resolves to a NoncomplianceAction"
    error_id: ERR_NONCOMPLIANCE_ACTION_NOT_FOUND
    http_status: 404
    applies_to: "POST /osup/noncompliance-actions/{id}/**"

  # ---- 4. Ownership (writes only; all GETs are readable by every role) ----
  - priority: 4
    category: auth
    check: |
      when X-User-Role == OutfitterRepresentative, the caller's entity-backed Outfitter id must equal the
      owning Outfitter of the target resource: PermitApplication.outfitter_id, Permit.outfitter_id,
      Guide.outfitter_id, OperatingPlan -> Permit.outfitter_id, TripUseReport -> Permit.outfitter_id,
      GuideAreaAuthorization -> Permit.outfitter_id, InsuranceCertificate / Bond -> Permit.outfitter_id,
      FeeAssessment -> Permit.outfitter_id, and the outfitter_id supplied on POST /osup/permit-applications.
      A holder-change names a NEW outfitter, so the incoming outfitter is NOT the owner and cannot
      initiate it — only AuthorizedOfficer may.
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "every POST whose target resource has an owning Outfitter"

  # ---- 5. Request shape ----
  - priority: 5
    category: business_constraint
    check: |
      every required field of the §1.5 `input:` list is present and non-null; enum fields hold a
      declared member; integer fields are integers within the stated range (service days 1..3650,
      cents >= 0, scores 0..100, party sizes >= 1); dates are ISO-8601 calendar dates and datetimes
      are RFC-3339 UTC; period_start_date < period_end_date, effective_date < expiration_date,
      term_start_date < term_end_date; ein is exactly 9 digits and unique across Outfitters;
      area_code is unique across UseAreas; unknown body fields are ignored, not rejected
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  # ---- 6. Optimistic concurrency (see §1.2.1) ----
  - priority: 6
    category: state
    check: "expected_use_area_version equals the current UseArea.version"
    error_id: ERR_STALE_USE_AREA_VERSION
    http_status: 412
    applies_to: "POST /osup/prospectuses/{id}/award"
  - priority: 6
    category: state
    check: "expected_permit_version equals the current Permit.version"
    error_id: ERR_STALE_PERMIT_VERSION
    http_status: 412
    applies_to: "POST /osup/trip-use-reports/{id}/amend"

  # ---- 7. State preconditions ----
  - priority: 7
    category: state
    check: "the NeedsAssessment is still DRAFT when publish is requested; a PUBLISHED or SUPERSEDED assessment cannot be published again"
    error_id: ERR_INVALID_ASSESSMENT_STATE
    http_status: 409
    applies_to: "POST /osup/needs-assessments/{id}/publish"
  - priority: 7
    category: state
    check: "the PermitApplication is in a status from which the requested trigger is declared in §1.2"
    error_id: ERR_INVALID_APPLICATION_STATE
    http_status: 409
    applies_to: "POST /osup/permit-applications/{id}/{submit|screen|deny|withdraw|issue-permit}, POST /osup/prospectuses/{id}/responses"
  - priority: 7
    category: state
    check: "the OperatingPlan is in a status from which the requested trigger is declared in §1.2"
    error_id: ERR_INVALID_PLAN_STATE
    http_status: 409
    applies_to: "POST /osup/operating-plans/{id}/{submit|start-review|request-revision|approve|reject}"
  - priority: 7
    category: state
    check: |
      the Permit's administrative_status permits the operation: guide authorization, use-report
      submission, insurance and bond filing, performance evaluation and holder-change require
      administrative_status IN {ISSUED, ACTIVE}; suspend and revoke require ACTIVE or SUSPENDED per
      §1.2; reinstate requires SUSPENDED. A SUSPENDED, REVOKED, EXPIRED or CLOSED permit is not
      operational for any new authorization or reporting write.
    error_id: ERR_PERMIT_NOT_OPERATIONAL
    http_status: 409
    applies_to: "POST /osup/permits/{id}/**, POST /osup/operating-plans/**"
  - priority: 7
    category: state
    check: "the Prospectus is OPEN for responses, EVALUATING for award, and OPEN or EVALUATING for cancel"
    error_id: ERR_PROSPECTUS_NOT_OPEN
    http_status: 409
    applies_to: "POST /osup/prospectuses/{id}/{responses|close-submissions|award|cancel}"
  - priority: 7
    category: state
    check: "the FeeAssessment is not CLOSED; a CLOSED assessment accepts no finalize, payment or amendment-driven revert. The same error covers the mirror condition on close itself: only a PAID assessment is closable, so closing a PROVISIONAL, FINAL or already CLOSED assessment is rejected"
    error_id: ERR_FEE_ASSESSMENT_CLOSED
    http_status: 409
    applies_to: "POST /osup/fee-assessments/{id}/{finalize|payments|close}, POST /osup/trip-use-reports/{id}/amend"
  - priority: 7
    category: state
    check: "cure requires the NoncomplianceAction in ISSUED; appeal requires ISSUED; decide-appeal requires APPEALED"
    error_id: ERR_ACTION_NOT_APPEALABLE
    http_status: 409
    applies_to: "POST /osup/noncompliance-actions/{id}/{cure|appeal|decide-appeal}"
  - priority: 7
    category: state
    check: "accept requires the TripUseReport in SUBMITTED; amend requires ACCEPTED"
    error_id: ERR_USE_REPORT_STATE_INVALID
    http_status: 409
    applies_to: "POST /osup/trip-use-reports/{id}/{accept|amend}"
  - priority: 7
    category: state
    check: "the GuideAreaAuthorization is still AUTHORIZED when a revoke is requested; REVOKED is terminal, so a second revoke — whether the first was manual or a system cascade — is refused rather than treated as a no-op"
    error_id: ERR_AUTHORIZATION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /osup/guide-authorizations/{id}/revoke"
  - priority: 7
    category: state
    check: "no TripUseReport for the permit and season remains in SUBMITTED when the assessment is finalized"
    error_id: ERR_USE_REPORTS_PENDING
    http_status: 409
    applies_to: "POST /osup/fee-assessments/{id}/finalize"

  # ---- 8. Business: public safety and client protection (regulatory, ranks above every
  #         paperwork, scheduling and money check) ----
  - priority: 8
    category: business_safety
    check: "the guide's first_aid_expires_on is on or after the current logical date (inclusive: expiring today is still valid) on the authorization's authorized_at date"
    error_id: ERR_FIRST_AID_CERT_EXPIRED
    http_status: 422
    applies_to: "POST /osup/permits/{id}/guide-authorizations, POST /osup/guides/{id}/qualify"
  - priority: 8
    category: business_safety
    check: "the guide's first_aid_cert_type is not NONE"
    error_id: ERR_FIRST_AID_CERT_MISSING
    http_status: 422
    applies_to: "POST /osup/permits/{id}/guide-authorizations, POST /osup/guides/{id}/qualify"
  - priority: 8
    category: business_safety
    check: "qualification_level is not TRAINEE — a trainee carries a base_client_capacity of 0 and can never be authorized to lead clients"
    error_id: ERR_GUIDE_LEVEL_INELIGIBLE
    http_status: 422
    applies_to: "POST /osup/permits/{id}/guide-authorizations"
  - priority: 8
    category: business_safety
    check: "the guide's status is QUALIFIED; PENDING_QUALIFICATION and LAPSED guides cannot be authorized"
    error_id: ERR_GUIDE_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /osup/permits/{id}/guide-authorizations"
  - priority: 8
    category: business_safety
    check: |
      Permit.authorized_client_capacity_total >= UseArea.party_size_max before the permit may be
      activated, and TripUseReport.client_count <= Permit.authorized_client_capacity_total on every
      submitted report — the client-to-guide ratio must be satisfiable for the largest party the
      area allows and must have been satisfied by the trips actually run
    error_id: ERR_CLIENT_GUIDE_RATIO_UNMET
    http_status: 422
    applies_to: "POST /osup/permits/{id}/activate, POST /osup/permits/{id}/trip-use-reports"

  # ---- 9. Business: referential / cross-entity consistency ----
  - priority: 9
    category: business_referential
    check: "the Guide's outfitter_id equals the Permit's outfitter_id"
    error_id: ERR_GUIDE_OUTFITTER_MISMATCH
    http_status: 422
    applies_to: "POST /osup/permits/{id}/guide-authorizations"
  - priority: 9
    category: business_referential
    check: "the UseArea has a NeedsAssessment with status == PUBLISHED for the application's season_year before any application may be screened, and a prospectus may only cite a PUBLISHED assessment"
    error_id: ERR_NEEDS_ASSESSMENT_NOT_PUBLISHED
    http_status: 422
    applies_to: "POST /osup/permit-applications/{id}/screen, POST /osup/prospectuses"
  - priority: 9
    category: business_referential
    check: "the governing NeedsAssessment's public_need_finding is NEED_EXISTS; a NO_NEED finding blocks screening and prospectus issuance outright"
    error_id: ERR_NO_PUBLIC_NEED
    http_status: 422
    applies_to: "POST /osup/permit-applications/{id}/screen, POST /osup/prospectuses"
  - priority: 9
    category: business_referential
    check: "the Permit has an OperatingPlan with status == APPROVED for the plan_year covering the activation date before the permit may be activated or reinstated"
    error_id: ERR_OPERATING_PLAN_NOT_APPROVED
    http_status: 422
    applies_to: "POST /osup/permits/{id}/activate, POST /osup/permits/{id}/reinstate"
  - priority: 9
    category: business_referential
    check: |
      on a RENEWAL application the predecessor_permit_id must be present, must belong to the same
      outfitter_id and use_area_id as the application, and must be in administrative_status
      IN {ACTIVE, SUSPENDED, EXPIRED}; on a NEW application predecessor_permit_id must be absent
    error_id: ERR_SUCCESSION_PREDECESSOR_INVALID
    http_status: 422
    applies_to: "POST /osup/permit-applications, POST /osup/permit-applications/{id}/screen"
  - priority: 9
    category: business_referential
    check: "indemnification_acknowledged is true on the Permit before activation"
    error_id: ERR_INDEMNIFICATION_NOT_ACKNOWLEDGED
    http_status: 422
    applies_to: "POST /osup/permits/{id}/activate"

  # ---- 10. Business: temporal windows, intervals and overlaps ----
  - priority: 10
    category: business_temporal
    check: |
      the TripUseReport's [period_start_date, period_end_date) lies inside
      [UseArea.season_open_date, UseArea.season_close_date] for the report's season_year, and
      inside [Permit.term_start_date, Permit.term_end_date]
    error_id: ERR_OUTSIDE_SEASON_WINDOW
    http_status: 422
    applies_to: "POST /osup/permits/{id}/trip-use-reports"
  - priority: 10
    category: business_temporal
    check: "the current logical date is on or before Prospectus.submission_deadline_date (inclusive) when a response is filed"
    error_id: ERR_SUBMISSION_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /osup/prospectuses/{id}/responses"
  - priority: 10
    category: business_temporal
    check: "period_end_date is on or before the current logical date — a period that has not finished cannot be reported"
    error_id: ERR_PERIOD_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /osup/permits/{id}/trip-use-reports"
  - priority: 10
    category: business_temporal
    check: |
      the new report's half-open interval [period_start_date, period_end_date) must not intersect the
      interval of any TripUseReport for the same permit with status IN {SUBMITTED, ACCEPTED};
      SUPERSEDED reports are ignored. Adjacent periods that share an endpoint
      (A.period_end_date == B.period_start_date) do NOT intersect and are accepted.
    error_id: ERR_REPORTING_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /osup/permits/{id}/trip-use-reports"
  - priority: 10
    category: business_temporal
    check: |
      the new permit's CLOSED interval [term_start_date, term_end_date] must be separated by at least
      PERMIT_TERM_BUFFER_DAYS = 14 clear days from the term of any other Permit with the same
      (outfitter_id, use_area_id) whose administrative_status IS IN {ISSUED, ACTIVE, SUSPENDED};
      touching or overlapping terms, and gaps of 13 days or fewer, are rejected. A permit created by
      an approved holder-change succession is exempt (see ERR_SUCCESSION_TERM_NOT_CONTIGUOUS).
    error_id: ERR_PERMIT_TERM_CONFLICT
    http_status: 409
    applies_to: "POST /osup/permit-applications/{id}/issue-permit"
  - priority: 10
    category: business_temporal
    check: |
      the succession term must be contiguous with the predecessor's. The successor's term_start_date is
      server-computed as the calendar day immediately after the predecessor's term_end_date and is never
      supplied by the caller; the caller's successor_term_end_date must fall strictly after that computed
      start date. A successor_term_end_date on or before the predecessor's term_end_date describes a
      backdated term with no forward coverage and is rejected.
    error_id: ERR_SUCCESSION_TERM_NOT_CONTIGUOUS
    http_status: 422
    applies_to: "POST /osup/permits/{id}/holder-change"
  - priority: 10
    category: business_temporal
    check: |
      the ACTIVE InsuranceCertificate set for the permit must cover [term_start_date, term_end_date]
      with no uncovered calendar day: certificate intervals are CLOSED [effective_date,
      expiration_date] and two certificates are contiguous when the later one starts on or before the
      day after the earlier one expires. A one-day hole is a coverage gap. This rule needs at least one
      ACTIVE GENERAL_LIABILITY certificate to have something to measure: when the ACTIVE set is EMPTY
      the failure is a sufficiency failure, not a gap, and priority 12 ERR_INSURANCE_COVERAGE_INSUFFICIENT
      is returned instead.
    error_id: ERR_INSURANCE_COVERAGE_GAP
    http_status: 422
    applies_to: "POST /osup/permits/{id}/activate, POST /osup/permits/{id}/reinstate"
  - priority: 10
    category: business_temporal
    check: "the guide's first_aid_expires_on must be on or after the Permit's term_end_date OR the authorization is limited to the current season — a certificate expiring before UseArea.season_close_date of the permit's current season_year is rejected"
    error_id: ERR_GUIDE_TERM_CONFLICT
    http_status: 422
    applies_to: "POST /osup/permits/{id}/guide-authorizations"
  - priority: 10
    category: business_temporal
    check: "the current logical date is on or before NoncomplianceAction.cure_deadline_date (inclusive) when a cure is filed"
    error_id: ERR_CURE_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /osup/noncompliance-actions/{id}/cure"

  # ---- 11. Business: structural constraints, uniqueness and duty separation ----
  - priority: 11
    category: business_constraint
    check: "the count of GuideAreaAuthorization rows with status == AUTHORIZED for the permit is below MAX_AUTHORIZED_GUIDES_PER_PERMIT = 8"
    error_id: ERR_GUIDE_ROSTER_FULL
    http_status: 409
    applies_to: "POST /osup/permits/{id}/guide-authorizations"
  - priority: 11
    category: business_constraint
    check: "no OperatingPlan already exists for the (permit_id, plan_year) pair in a status other than REJECTED"
    error_id: ERR_DUPLICATE_PLAN_YEAR
    http_status: 409
    applies_to: "POST /osup/permits/{id}/operating-plans"
  - priority: 11
    category: business_constraint
    check: "OperatingPlan.revision_round is below MAX_REVISION_ROUNDS = 2 when a revision is requested; the third deficiency finding must be a rejection instead"
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /osup/operating-plans/{id}/request-revision"
  - priority: 11
    category: business_constraint
    check: "OperatingPlan.completeness_score == 100.0 — all four of the sanitation, campsite, stock and resource-protection sections carry every required key"
    error_id: ERR_OPERATING_PLAN_INCOMPLETE
    http_status: 422
    applies_to: "POST /osup/operating-plans/{id}/submit"
  - priority: 11
    category: business_constraint
    check: |
      the X-User-ID approving or rejecting an OperatingPlan must differ from the X-User-ID that
      started its review (OperatingPlan.reviewed_by_user_id), and the X-User-ID deciding a
      NoncomplianceAction appeal must differ from NoncomplianceAction.issued_by_user_id
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /osup/operating-plans/{id}/{approve|reject}, POST /osup/noncompliance-actions/{id}/decide-appeal"
  - priority: 11
    category: business_constraint
    check: |
      a holder-change is permitted only when the permit's compliance_status == COMPLIANT, its
      administrative_status IN {ISSUED, ACTIVE}, suspension_count == 0, the incoming Outfitter's
      prequalification_insurance_verified is true, and the incoming Outfitter differs from the
      current holder. A permit may be transferred at most MAX_HOLDER_CHANGES = 1 time, tracked by
      the presence of a predecessor_permit_id on the permit being transferred.
    error_id: ERR_TRANSFER_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /osup/permits/{id}/holder-change"
  - priority: 11
    category: business_constraint
    check: "at least one PermitApplication in status PROSPECTUS_RESPONDED scores at or above Prospectus.min_qualifying_score on the FINAL variant"
    error_id: ERR_NO_RESPONSIVE_APPLICATIONS
    http_status: 409
    applies_to: "POST /osup/prospectuses/{id}/award"
  - priority: 11
    category: business_constraint
    check: "action_type is allowed for the severity: MINOR admits WARNING only, MODERATE admits WARNING or SUSPENSION, MAJOR admits SUSPENSION or REVOCATION"
    error_id: ERR_ACTION_TYPE_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /osup/permits/{id}/noncompliance-actions"
  - priority: 11
    category: business_constraint
    check: "a permit whose open_noncompliance_points is at or above NONCOMPLIANT_POINT_THRESHOLD = 12 cannot be reinstated until enough actions are CURED or RESCINDED to bring the total below the threshold"
    error_id: ERR_POINTS_THRESHOLD_UNRESOLVED
    http_status: 409
    applies_to: "POST /osup/permits/{id}/reinstate"

  # ---- 12. Business: fiscal / quota / capacity (money and days are checked LAST) ----
  - priority: 12
    category: business_fiscal
    check: "the cumulative service_days_used for the permit's season plus the report's service_days_used must not exceed Permit.authorized_service_days"
    error_id: ERR_SERVICE_DAY_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /osup/permits/{id}/trip-use-reports"
  - priority: 12
    category: business_fiscal
    check: "PermitApplication.requested_service_days must not exceed UseArea.available_service_days at issuance time (the DIRECT path) or Prospectus.offered_service_days (the PROSPECTUS path)"
    error_id: ERR_INSUFFICIENT_SERVICE_DAYS
    http_status: 409
    applies_to: "POST /osup/permit-applications/{id}/issue-permit, POST /osup/prospectuses/{id}/responses"
  - priority: 12
    category: business_fiscal
    check: "the sum of coverage_amount_cents over ACTIVE GENERAL_LIABILITY certificates is at least UseArea.min_liability_coverage_cents, and additional_insured_endorsed is true on each"
    error_id: ERR_INSURANCE_COVERAGE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /osup/permits/{id}/activate, POST /osup/permits/{id}/reinstate"
  - priority: 12
    category: business_fiscal
    check: "an ACTIVE Bond exists whose bond_amount_cents >= required_financial_assurance(permit)"
    error_id: ERR_BOND_INSUFFICIENT
    http_status: 422
    applies_to: "POST /osup/permits/{id}/activate, POST /osup/permits/{id}/reinstate"
  - priority: 12
    category: business_fiscal
    check: "no FeeAssessment for the permit has balance_due_cents > 0 (equivalently Permit.fee_delinquent == false) when a renewal permit is issued, a holder-change is approved, or a suspended permit is reinstated"
    error_id: ERR_FEE_BALANCE_OUTSTANDING
    http_status: 409
    applies_to: "POST /osup/permit-applications/{id}/issue-permit, POST /osup/permits/{id}/holder-change, POST /osup/permits/{id}/reinstate"
  - priority: 12
    category: business_fiscal
    check: "amount_cents on a payment must be > 0 and must not exceed the assessment's current balance_due_cents"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /osup/fee-assessments/{id}/payments"
  - priority: 12
    category: business_fiscal
    check: "allowable_deductions_cents must not exceed floor(gross_revenue_cents * DEDUCTION_CAP_PCT) with DEDUCTION_CAP_PCT = 0.15"
    error_id: ERR_DEDUCTIONS_EXCEED_CAP
    http_status: 422
    applies_to: "POST /osup/permits/{id}/trip-use-reports, POST /osup/trip-use-reports/{id}/amend"

# Pinned priority-conflict outcomes (a single request violating both rules returns the FIRST):
#   * priority 7 ERR_PERMIT_NOT_OPERATIONAL  BEATS  priority 12 ERR_SERVICE_DAY_LIMIT_EXCEEDED
#     — a use report filed against a SUSPENDED permit that would also blow the day cap returns the
#       state error, never the fiscal one.
#   * priority 8 ERR_FIRST_AID_CERT_EXPIRED  BEATS  priority 11 ERR_GUIDE_ROSTER_FULL
#     — safety outranks the structural roster cap.
#   * priority 10 ERR_OUTSIDE_SEASON_WINDOW  BEATS  priority 12 ERR_DEDUCTIONS_EXCEED_CAP
#     — the reporting window is validated before the money on the report.
#
# Intra-tier ordering inside priority 12 on POST /osup/permits/{id}/{activate|reinstate}, where three
# fiscal rules share the tier, is fixed as:
#   ERR_INSURANCE_COVERAGE_INSUFFICIENT, then ERR_BOND_INSUFFICIENT, then ERR_FEE_BALANCE_OUTSTANDING.
# A permit carrying neither an insurance certificate nor a bond therefore returns the insurance error
# on its first activation attempt, and the bond error only after the coverage requirement is met.
#
# Intra-tier ordering inside priority 8 on POST /osup/permits/{id}/guide-authorizations, where four
# safety rules share the tier, is fixed as:
#   ERR_FIRST_AID_CERT_MISSING, then ERR_FIRST_AID_CERT_EXPIRED, then ERR_GUIDE_LEVEL_INELIGIBLE,
#   then ERR_GUIDE_NOT_QUALIFIED.
# The certificate itself is judged before the derived Guide.status, so a LAPSED guide — whose status
# is LAPSED precisely because its certificate expired — returns ERR_FIRST_AID_CERT_EXPIRED, not
# ERR_GUIDE_NOT_QUALIFIED. ERR_GUIDE_NOT_QUALIFIED is therefore reachable only for a guide still in
# PENDING_QUALIFICATION.

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
#
# Every path is rooted at api_prefix `/osup`. `input:` lists BODY fields for
# POST/PUT/PATCH and QUERY parameters for GET; path parameters are not repeated
# there. A trailing `?` marks an optional field. All GET endpoints are readable by
# every declared role — read access is never the thing under test; writes carry the
# role and ownership restrictions.
# -----------------------------------------------------------------------------
endpoints:

  # ==== Test-driving surface (/_<name> namespace) ====
  - method: POST
    path: "/osup/_clock/set_current_utc"
    description: |
      Sets the server's logical clock, which every date/time comparison in §1.3 and §1.4 reads
      (season windows, certificate and bond expiry, submission and cure deadlines, the 1095-day
      noncompliance window, permit term expiry). MANDATORY DEFAULT: before any call to this
      endpoint the logical clock reads exactly `2026-08-01T00:00:00Z`; the server MUST NOT fall
      back to real wall-clock time at any point. Moving the clock never mutates stored rows on its
      own — derived expiry state changes only when the compliance sweep or a subsequent write runs.
    roles: [ProgramAdministrator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["logical clock repositioned; no entity rows written"]

  - method: POST
    path: "/osup/_ops/run-daily-compliance-sweep"
    description: |
      Runs the nightly compliance batch against the current logical clock in this PINNED order:
      (1) InsuranceCertificate and Bond rows whose expiration_date is strictly before the current
      logical date move ACTIVE -> EXPIRED; (2) Guide rows whose first_aid_expires_on is strictly
      before the current logical date move QUALIFIED -> LAPSED; (3) Permit rows whose term_end_date
      is strictly before the current logical date move ISSUED/ACTIVE/SUSPENDED -> EXPIRED;
      (4) every remaining permit's insurance_current, bond_current, fee_delinquent and
      open_noncompliance_points are recomputed and permit_compliance_derivation runs, in permit
      `created_at ASC` order; (5) GuideAreaAuthorization rows whose guide LAPSED or whose permit
      left {ISSUED, ACTIVE} move AUTHORIZED -> REVOKED; (6) every touched Outfitter's status is
      re-derived. Steps 1-3 must precede step 4 or the derived booleans read stale certificate
      state; step 5 must follow step 4 or suspensions raised in step 4 leave their guides authorized.
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: { swept_at: datetime, certificates_expired: integer, bonds_expired: integer, guides_lapsed: integer, permits_expired: integer, authorizations_revoked: integer, permits_suspended: integer }
    side_effects:
      - "InsuranceCertificate / Bond ACTIVE -> EXPIRED"
      - "Guide QUALIFIED -> LAPSED"
      - "Permit -> EXPIRED past term_end_date"
      - "recomputes insurance_current, bond_current, fee_delinquent, open_noncompliance_points"
      - "runs permit_compliance_derivation; may drive ACTIVE -> SUSPENDED with reason INSURANCE_LAPSE or POINTS_THRESHOLD"
      - "GuideAreaAuthorization AUTHORIZED -> REVOKED with reason GUIDE_LAPSED / PERMIT_SUSPENDED / PERMIT_CLOSED"
      - "runs outfitter_status_derivation"
      - "increments version on every row it mutates"

  # ==== UseArea ====
  - method: POST
    path: "/osup/use-areas"
    description: "Opens a use area for a season with its allocation ceiling, seasonal window and ratio limits. total_allocated_service_days - reserved_admin_service_days must be at least 1."
    roles: [ProgramAdministrator]
    code: 201
    input: [area_code, name, total_allocated_service_days, season_year, season_open_date, season_close_date, party_size_max, max_clients_per_guide, "reserved_admin_service_days?", "min_liability_coverage_cents?"]
    output: UseArea
    side_effects: ["runs use_area_service_day_availability on an empty permit and application set: committed 0, pending 0, available = allocatable, demand_ratio 0.0, allocation_posture OPEN"]

  - method: GET
    path: "/osup/use-areas/{id}"
    description: "Reads one use area including its four derived allocation fields and its version (the OCC token for prospectus award)."
    roles: [OutfitterRepresentative, PermitSpecialist, AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: []
    output: UseArea
    side_effects: []

  - method: GET
    path: "/osup/use-areas"
    description: "Lists use areas, newest first by created_at DESC, with optional season and posture filters."
    roles: [OutfitterRepresentative, PermitSpecialist, AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: ["season_year?", "allocation_posture?", "limit?", "offset?"]
    output: UseArea[]
    side_effects: []

  - method: GET
    path: "/osup/use-areas/{id}/allocation-summary"
    description: "Computed read: recomputes use_area_service_day_availability from scratch and returns the conservation identity's four terms alongside the posture, so a test can reconcile allocatable == committed + pending + available without trusting stored fields."
    roles: [OutfitterRepresentative, PermitSpecialist, AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: []
    output: { use_area_id: uuid, allocatable_service_days: integer, committed_service_days: integer, pending_service_days: integer, available_service_days: integer, demand_ratio: decimal, allocation_posture: string }
    side_effects: []

  # ==== Outfitter ====
  - method: POST
    path: "/osup/outfitters"
    description: "Registers a prospective permit holder. ein must be exactly 9 digits and unique. status starts APPLICANT; prior_permit_count and active_permit_count start 0."
    roles: [PermitSpecialist, ProgramAdministrator]
    code: 201
    input: [legal_name, ein, contact_email, "prequalification_insurance_verified?"]
    output: Outfitter
    side_effects: []

  - method: GET
    path: "/osup/outfitters/{id}"
    description: "Reads one outfitter including its derived status and permit counts."
    roles: [OutfitterRepresentative, PermitSpecialist, AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: []
    output: Outfitter
    side_effects: []

  - method: POST
    path: "/osup/outfitters/{id}/prequalification"
    description: "Records the outcome of the specialist's insurance and bonding prequalification review. The flag is read by the FINAL variant of prospectus_evaluation_score and gates holder-change approval."
    roles: [PermitSpecialist, ProgramAdministrator]
    code: 200
    input: [verified]
    output: Outfitter
    side_effects: ["sets prequalification_insurance_verified", "increments Outfitter.version"]

  # ==== NeedsAssessment ====
  - method: POST
    path: "/osup/use-areas/{id}/needs-assessments"
    description: "Drafts the public-need finding and capacity determination for one area and year. unallocated_service_days = determined_capacity_service_days - allocated_service_days; prospectus_required is set true when unallocated_service_days <= 0 or public_need_finding is NO_NEED."
    roles: [PermitSpecialist, ProgramAdministrator]
    code: 201
    input: [assessment_year, public_need_finding, determined_capacity_service_days, allocated_service_days]
    output: NeedsAssessment
    side_effects: ["computes unallocated_service_days and prospectus_required"]

  - method: POST
    path: "/osup/needs-assessments/{id}/publish"
    description: "Publishes the assessment, making it the governing finding for the area and year. Any earlier PUBLISHED assessment for the same (use_area_id, assessment_year) is moved to SUPERSEDED."
    roles: [AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: []
    output: NeedsAssessment
    side_effects: ["DRAFT -> PUBLISHED", "stamps published_at from the logical clock", "prior PUBLISHED sibling -> SUPERSEDED", "increments version on both rows"]

  - method: GET
    path: "/osup/use-areas/{id}/needs-assessments"
    description: "Lists the assessments recorded for one area, ordered created_at ASC."
    roles: [OutfitterRepresentative, PermitSpecialist, AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: ["assessment_year?", "status?"]
    output: NeedsAssessment[]
    side_effects: []

  # ==== Prospectus ====
  - method: POST
    path: "/osup/prospectuses"
    description: "Issues a competitive solicitation for the service days an area cannot allocate directly. Requires a PUBLISHED NeedsAssessment for the area with public_need_finding NEED_EXISTS. min_qualifying_score defaults to 60.0."
    roles: [PermitSpecialist, ProgramAdministrator]
    code: 201
    input: [use_area_id, needs_assessment_id, offered_service_days, submission_deadline_date, "min_qualifying_score?"]
    output: Prospectus
    side_effects: ["status OPEN", "responsive_application_count 0"]

  - method: GET
    path: "/osup/prospectuses/{id}"
    description: "Reads one solicitation including responsive_application_count and, once awarded, awarded_application_id."
    roles: [OutfitterRepresentative, PermitSpecialist, AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: []
    output: Prospectus
    side_effects: []

  - method: GET
    path: "/osup/prospectuses"
    description: "Lists solicitations, ordered created_at ASC, filterable by area, governing assessment and status."
    roles: [OutfitterRepresentative, PermitSpecialist, AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: ["use_area_id?", "needs_assessment_id?", "status?", "limit?", "offset?"]
    output: Prospectus[]
    side_effects: []

  - method: POST
    path: "/osup/prospectuses/{id}/responses"
    description: "Files a PROSPECTUS_QUEUED application as a response to this solicitation. The application must already be queued for the same use area and must not exceed offered_service_days; the logical date must be on or before submission_deadline_date."
    roles: [OutfitterRepresentative]
    code: 200
    input: [application_id]
    output: PermitApplication
    side_effects: ["PermitApplication PROSPECTUS_QUEUED -> PROSPECTUS_RESPONDED", "sets PermitApplication.prospectus_id", "increments Prospectus.responsive_application_count", "increments version on both rows"]

  - method: POST
    path: "/osup/prospectuses/{id}/close-submissions"
    description: "Closes the submission window and scores every responsive application with the PRELIMINARY variant of prospectus_evaluation_score, writing preliminary_evaluation_score on each. No winner is chosen here. Exclusive to PermitSpecialist."
    roles: [PermitSpecialist]
    code: 200
    input: []
    output: Prospectus
    side_effects: ["OPEN -> EVALUATING", "writes PermitApplication.preliminary_evaluation_score for every PROSPECTUS_RESPONDED application", "increments version on every row written"]

  - method: POST
    path: "/osup/prospectuses/{id}/award"
    description: "Re-scores every responsive application with the FINAL variant, applies prospectus_award_selector, awards the winner and denies the rest with denial_reason_code NOT_SELECTED. Requires expected_use_area_version to match the governing UseArea's current version, because the award converts offered days into a held allocation on that area."
    roles: [AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: [expected_use_area_version]
    output: Prospectus
    side_effects: ["writes PermitApplication.final_evaluation_score for every PROSPECTUS_RESPONDED application", "EVALUATING -> AWARDED", "sets awarded_application_id", "winner PROSPECTUS_RESPONDED -> AWARDED, losers -> DENIED", "recomputes UseArea availability and posture", "increments UseArea.version by 1", "increments version on every application written"]

  - method: POST
    path: "/osup/prospectuses/{id}/cancel"
    description: "Cancels a solicitation that has not been awarded and compensates every response: each PROSPECTUS_RESPONDED application returns to PROSPECTUS_QUEUED with its prospectus_id, preliminary_evaluation_score and final_evaluation_score cleared, leaving no residue of the cancelled competition."
    roles: [AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: [cancellation_reason_code]
    output: Prospectus
    side_effects: ["OPEN or EVALUATING -> CANCELLED", "responses PROSPECTUS_RESPONDED -> PROSPECTUS_QUEUED with prospectus_id and both scores cleared", "responsive_application_count reset to 0", "recomputes UseArea availability", "increments version on every row written"]

  # ==== PermitApplication ====
  - method: POST
    path: "/osup/permit-applications"
    description: "Drafts an application. application_type NEW forbids predecessor_permit_id; RENEWAL requires one belonging to the same outfitter and area. prospectus_id is normally left null and set by filing a response."
    roles: [OutfitterRepresentative, PermitSpecialist]
    code: 201
    input: [outfitter_id, use_area_id, application_type, season_year, requested_service_days, proposed_activity_type, "narrative?", "prospectus_id?", "predecessor_permit_id?"]
    output: PermitApplication
    side_effects: ["status DRAFT", "no service days are held yet"]

  - method: GET
    path: "/osup/permit-applications/{id}"
    description: "Reads one application including routing_decision, hold_expires_at and both evaluation scores."
    roles: [OutfitterRepresentative, PermitSpecialist, AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: []
    output: PermitApplication
    side_effects: []

  - method: GET
    path: "/osup/permit-applications"
    description: "Lists applications ordered created_at ASC. The filters reach every application FK, including predecessor_permit_id for renewal chains."
    roles: [OutfitterRepresentative, PermitSpecialist, AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: ["outfitter_id?", "use_area_id?", "prospectus_id?", "predecessor_permit_id?", "status?", "season_year?", "limit?", "offset?"]
    output: PermitApplication[]
    side_effects: []

  - method: POST
    path: "/osup/permit-applications/{id}/submit"
    description: "Submits a drafted application for capacity screening. Still holds no service days."
    roles: [OutfitterRepresentative]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["DRAFT -> SUBMITTED", "increments version"]

  - method: POST
    path: "/osup/permit-applications/{id}/screen"
    description: |
      Runs the capacity screen. This is the branching fork of the whole program: it stamps
      routing_decision from prospectus_requirement_determination, places the service-day hold, and
      then moves the application automatically to DIRECT_AWARD_PENDING or PROSPECTUS_QUEUED in the
      same request. The two branches carry different side effects — only the DIRECT branch stamps
      hold_expires_at, only the PROSPECTUS branch flips the governing NeedsAssessment's
      prospectus_required flag. Screening is the PermitSpecialist's exclusive act; no other role,
      including ProgramAdministrator, may perform it.
    roles: [PermitSpecialist]
    code: 200
    input: []
    output: PermitApplication
    side_effects:
      - "SUBMITTED -> CAPACITY_SCREENED, then automatically to DIRECT_AWARD_PENDING or PROSPECTUS_QUEUED"
      - "stamps routing_decision and screened_at"
      - "adds requested_service_days to UseArea.pending_service_days and recomputes availability, demand_ratio and allocation_posture"
      - "DIRECT branch only: stamps hold_expires_at at 30 days past screened_at"
      - "PROSPECTUS branch only: sets the governing NeedsAssessment.prospectus_required to true"
      - "recomputes the governing NeedsAssessment's allocated_service_days and unallocated_service_days"
      - "if the recomputation leaves available_service_days below zero, every OTHER DIRECT_AWARD_PENDING application on the area is re-routed to PROSPECTUS_QUEUED with hold_expires_at cleared and routing_decision set to PROSPECTUS"
      - "increments version on the application, the use area, the governing assessment and every re-routed sibling"

  - method: POST
    path: "/osup/permit-applications/{id}/deny"
    description: "Denies an application from any pre-award status, releasing whatever service-day hold it carried."
    roles: [AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: [denial_reason_code]
    output: PermitApplication
    side_effects: ["-> DENIED", "releases the pending service-day hold and recomputes UseArea availability and posture", "increments version on both rows"]

  - method: POST
    path: "/osup/permit-applications/{id}/withdraw"
    description: "Holder-initiated withdrawal from any pre-award status. Releases the hold, restoring the area's availability exactly to its pre-screen value."
    roles: [OutfitterRepresentative]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["-> WITHDRAWN", "releases the pending service-day hold and recomputes UseArea availability and posture", "increments version on both rows"]

  - method: POST
    path: "/osup/permit-applications/{id}/issue-permit"
    description: |
      Issues the permit for an application in DIRECT_AWARD_PENDING or AWARDED. authorized_service_days
      is copied from requested_service_days, converting the pending hold into a committed allocation
      with zero net change to the area's allocatable total. The permit lands in ISSUED, not ACTIVE —
      activation has its own insurance, bond, plan and ratio gates.
    roles: [AuthorizedOfficer, ProgramAdministrator]
    code: 201
    input: [term_start_date, term_end_date, "fee_schedule_code?", "indemnification_acknowledged?"]
    output: Permit
    side_effects:
      - "creates a Permit in administrative_status ISSUED, compliance_status COMPLIANT"
      - "application -> PERMIT_ISSUED"
      - "moves requested_service_days from UseArea.pending_service_days to committed_service_days and recomputes availability, demand_ratio and posture"
      - "recomputes the governing NeedsAssessment's allocated_service_days, unallocated_service_days and prospectus_required"
      - "recomputes Outfitter.prior_permit_count and active_permit_count, then re-derives Outfitter.status"
      - "increments version on the application, the use area, the governing assessment and the outfitter"

  # ==== Permit ====
  - method: GET
    path: "/osup/permits/{id}"
    description: "Reads one permit including both status dimensions, the four derived compliance signals, authorized_client_capacity_total, service_days_used_ytd and its version (the OCC token for use-report amendment)."
    roles: [OutfitterRepresentative, PermitSpecialist, AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: []
    output: Permit
    side_effects: []

  - method: GET
    path: "/osup/permits"
    description: "Lists permits ordered created_at ASC. The filters reach every permit FK, including predecessor_permit_id so a succession chain can be walked forward."
    roles: [OutfitterRepresentative, PermitSpecialist, AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: ["outfitter_id?", "use_area_id?", "application_id?", "predecessor_permit_id?", "administrative_status?", "compliance_status?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []

  - method: POST
    path: "/osup/permits/{id}/acknowledge-indemnification"
    description: "The holder accepts the hold-harmless and indemnification clause. Required before activation; irreversible once set."
    roles: [OutfitterRepresentative]
    code: 200
    input: []
    output: Permit
    side_effects: ["sets indemnification_acknowledged true", "increments version"]

  - method: POST
    path: "/osup/permits/{id}/activate"
    description: |
      Activates an ISSUED permit. Every operating condition must be satisfied at once: an APPROVED
      operating plan, indemnification acknowledged, gap-free general-liability coverage at or above
      the area's minimum with the United States endorsed as additional insured, an ACTIVE bond at or
      above required_financial_assurance, and an authorized guide roster whose combined client
      capacity covers the area's largest permitted party.
    roles: [AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: []
    output: Permit
    side_effects: ["ISSUED -> ACTIVE", "recomputes insurance_current, bond_current and required bond amount", "recomputes Outfitter.active_permit_count and status", "increments version on both rows"]

  - method: POST
    path: "/osup/permits/{id}/suspend"
    description: "Officer-ordered suspension of an ACTIVE permit. Suspension revokes the entire authorized guide roster, so reinstatement requires rebuilding it."
    roles: [AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: [suspension_reason_code, suspended_until_date]
    output: Permit
    side_effects: ["ACTIVE -> SUSPENDED", "increments suspension_count", "stamps suspended_until_date and suspension_reason_code", "every AUTHORIZED GuideAreaAuthorization -> REVOKED with reason PERMIT_SUSPENDED and authorized_client_capacity_total recomputed to 0", "recomputes Outfitter.active_permit_count and status", "increments version on every row written"]

  - method: POST
    path: "/osup/permits/{id}/reinstate"
    description: "Returns a SUSPENDED permit to ACTIVE once the point total is back under the threshold and the insurance, bond, plan and ratio gates all pass again."
    roles: [AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: []
    output: Permit
    side_effects: ["SUSPENDED -> ACTIVE", "clears suspended_until_date and suspension_reason_code; suspension_count is NOT decremented", "recomputes the derived compliance signals and compliance_status", "recomputes Outfitter.active_permit_count and status", "increments version on both rows"]

  - method: POST
    path: "/osup/permits/{id}/revoke"
    description: "Terminal revocation from ISSUED, ACTIVE or SUSPENDED. Releases the committed service days back to the area and revokes the guide roster."
    roles: [AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: [revocation_reason_code]
    output: Permit
    side_effects: ["-> REVOKED (terminal)", "releases authorized_service_days from UseArea.committed_service_days and recomputes availability, demand_ratio and posture", "every AUTHORIZED GuideAreaAuthorization -> REVOKED with reason PERMIT_CLOSED", "recomputes Outfitter counts and status", "increments version on every row written"]

  - method: POST
    path: "/osup/permits/{id}/holder-change"
    description: |
      Approves a change of permit holder. The transfer is NOT an in-place edit of outfitter_id: the
      predecessor permit is CLOSED and a successor Permit is created for the incoming outfitter,
      carrying the same use_area_id, application_id and authorized_service_days, with
      predecessor_permit_id pointing back at the closed permit. The successor's term starts the day
      after the predecessor's term_end_date and its administrative_status is ISSUED, so the incoming
      holder must satisfy every activation gate in its own right.
    roles: [AuthorizedOfficer, ProgramAdministrator]
    code: 201
    input: [incoming_outfitter_id, successor_term_end_date]
    output: Permit
    side_effects:
      - "predecessor permit -> CLOSED and its AUTHORIZED guide authorizations -> REVOKED with reason PERMIT_CLOSED"
      - "creates the successor Permit in ISSUED / COMPLIANT with predecessor_permit_id set and indemnification_acknowledged false"
      - "UseArea.committed_service_days is unchanged: the predecessor releases exactly what the successor commits"
      - "re-derives status and permit counts for BOTH the outgoing and the incoming Outfitter"
      - "increments version on the predecessor, the use area and both outfitters"

  # ==== OperatingPlan ====
  - method: POST
    path: "/osup/permits/{id}/operating-plans"
    description: |
      Files the annual operating plan. Each of the four sections is an object; a section counts toward
      completeness_score only when every one of its required keys is present and non-null —
      sanitation_section needs human_waste_method, greywater_method and packout_commitment;
      campsite_section needs designated_sites_only, max_nights_per_site and fire_policy;
      stock_section needs stock_type, max_head, feed_source and tie_method; resource_protection_section
      needs weed_free_certification, sensitive_site_avoidance and monitoring_commitment. Sections may
      be filed empty and completed later via the sections endpoint.
    roles: [OutfitterRepresentative]
    code: 201
    input: [plan_year, sanitation_section, campsite_section, stock_section, resource_protection_section]
    output: OperatingPlan
    side_effects: ["status DRAFT, revision_round 0", "runs operating_plan_completeness"]

  - method: GET
    path: "/osup/permits/{id}/operating-plans"
    description: "Lists the operating plans filed against one permit, ordered created_at ASC."
    roles: [OutfitterRepresentative, PermitSpecialist, AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: ["plan_year?", "status?"]
    output: OperatingPlan[]
    side_effects: []

  - method: GET
    path: "/osup/operating-plans/{id}"
    description: "Reads one operating plan including completeness_score, revision_round, deficiency_sections and both reviewer user ids."
    roles: [OutfitterRepresentative, PermitSpecialist, AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: []
    output: OperatingPlan
    side_effects: []

  - method: POST
    path: "/osup/operating-plans/{id}/sections"
    description: "Replaces one section of a plan in DRAFT or REVISION_REQUESTED and recomputes completeness_score. section_name is one of sanitation_section, campsite_section, stock_section, resource_protection_section."
    roles: [OutfitterRepresentative]
    code: 200
    input: [section_name, section_body]
    output: OperatingPlan
    side_effects: ["replaces the named section", "runs operating_plan_completeness", "increments version"]

  - method: POST
    path: "/osup/operating-plans/{id}/submit"
    description: "Submits a DRAFT or REVISION_REQUESTED plan for review. Requires completeness_score exactly 100.0; a resubmission clears deficiency_sections but keeps revision_round."
    roles: [OutfitterRepresentative]
    code: 200
    input: []
    output: OperatingPlan
    side_effects: ["DRAFT or REVISION_REQUESTED -> SUBMITTED", "clears deficiency_sections", "increments version"]

  - method: POST
    path: "/osup/operating-plans/{id}/start-review"
    description: "The reviewing specialist or officer takes the plan under review and is recorded in reviewed_by_user_id. That user is thereafter barred from approving or rejecting the same plan."
    roles: [PermitSpecialist, AuthorizedOfficer]
    code: 200
    input: []
    output: OperatingPlan
    side_effects: ["SUBMITTED -> UNDER_REVIEW", "stamps reviewed_by_user_id from X-User-ID", "increments version"]

  - method: POST
    path: "/osup/operating-plans/{id}/request-revision"
    description: "Returns a plan under review to the holder with the deficient sections named. Allowed only while revision_round is below 2; the third finding must be a rejection."
    roles: [PermitSpecialist, AuthorizedOfficer]
    code: 200
    input: [deficiency_sections]
    output: OperatingPlan
    side_effects: ["UNDER_REVIEW -> REVISION_REQUESTED", "increments revision_round by 1", "stores deficiency_sections", "increments version"]

  - method: POST
    path: "/osup/operating-plans/{id}/approve"
    description: "Approves a plan under review. The approving X-User-ID must differ from reviewed_by_user_id. Any other APPROVED plan for the same (permit_id, plan_year) is impossible by the duplicate-year rule, so approval is unconditionally the governing plan for that year."
    roles: [AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: []
    output: OperatingPlan
    side_effects: ["UNDER_REVIEW -> APPROVED (terminal)", "stamps approved_by_user_id from X-User-ID", "increments version"]

  - method: POST
    path: "/osup/operating-plans/{id}/reject"
    description: "Rejects a plan under review. The rejecting X-User-ID must differ from reviewed_by_user_id. A rejected plan_year frees the (permit_id, plan_year) slot for a fresh filing."
    roles: [AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: [rejection_reason_code]
    output: OperatingPlan
    side_effects: ["UNDER_REVIEW -> REJECTED (terminal)", "increments version"]

  # ==== Guide ====
  - method: POST
    path: "/osup/outfitters/{id}/guides"
    description: "Adds a guide to the outfitter's roster in PENDING_QUALIFICATION. base_client_capacity is computed immediately from qualification_level, first_aid_cert_type and seasons_experience even while the guide is unqualified, because the PRELIMINARY prospectus variant credits pending hires."
    roles: [OutfitterRepresentative]
    code: 201
    input: [full_name, qualification_level, first_aid_cert_type, first_aid_expires_on, "seasons_experience?"]
    output: Guide
    side_effects: ["status PENDING_QUALIFICATION", "runs guide_client_capacity"]

  - method: GET
    path: "/osup/outfitters/{id}/guides"
    description: "Lists the guides on one outfitter's roster, ordered created_at ASC."
    roles: [OutfitterRepresentative, PermitSpecialist, AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: ["status?"]
    output: Guide[]
    side_effects: []

  - method: GET
    path: "/osup/guides/{id}"
    description: "Reads one guide including base_client_capacity and qualification status."
    roles: [OutfitterRepresentative, PermitSpecialist, AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: []
    output: Guide
    side_effects: []

  - method: POST
    path: "/osup/guides/{id}/certifications"
    description: "Records a new or renewed first-aid certification. Recomputes base_client_capacity and, for a non-TRAINEE guide, moves LAPSED back to QUALIFIED; it does NOT restore GuideAreaAuthorization rows that were revoked while the guide was lapsed — those must be re-created."
    roles: [OutfitterRepresentative]
    code: 200
    input: [first_aid_cert_type, first_aid_expires_on]
    output: Guide
    side_effects: ["updates first_aid_cert_type and first_aid_expires_on", "runs guide_client_capacity", "increments version"]

  - method: POST
    path: "/osup/guides/{id}/qualify"
    description: "The program qualifies a guide whose certification is unexpired and non-NONE, moving PENDING_QUALIFICATION or LAPSED to QUALIFIED. A TRAINEE may be qualified but still carries base_client_capacity 0 and cannot be authorized to a permit."
    roles: [PermitSpecialist, AuthorizedOfficer]
    code: 200
    input: []
    output: Guide
    side_effects: ["PENDING_QUALIFICATION or LAPSED -> QUALIFIED", "stamps qualified_at", "runs guide_client_capacity", "increments version"]

  # ==== GuideAreaAuthorization ====
  - method: POST
    path: "/osup/permits/{id}/guide-authorizations"
    description: "Authorizes one of the holder's QUALIFIED guides to work under this permit. authorized_client_capacity is FROZEN at min(UseArea.max_clients_per_guide, Guide.base_client_capacity) at this instant; a later certification upgrade does not raise it."
    roles: [OutfitterRepresentative]
    code: 201
    input: [guide_id]
    output: GuideAreaAuthorization
    side_effects: ["status AUTHORIZED, stamps authorized_at", "freezes authorized_client_capacity", "recomputes Permit.authorized_client_capacity_total as the sum over AUTHORIZED rows", "increments Permit.version"]

  - method: GET
    path: "/osup/permits/{id}/guide-authorizations"
    description: "Lists the guide authorizations attached to one permit, ordered created_at ASC, including revoked rows unless filtered."
    roles: [OutfitterRepresentative, PermitSpecialist, AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: ["status?"]
    output: GuideAreaAuthorization[]
    side_effects: []

  - method: GET
    path: "/osup/guides/{id}/guide-authorizations"
    description: "Lists every permit one guide is or was authorized under, ordered created_at ASC."
    roles: [OutfitterRepresentative, PermitSpecialist, AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: ["status?"]
    output: GuideAreaAuthorization[]
    side_effects: []

  - method: POST
    path: "/osup/guide-authorizations/{id}/revoke"
    description: "Revokes an authorization. The revoked row retains its frozen authorized_client_capacity for the audit record but stops counting toward the permit's total, which is recomputed as a fresh sum rather than decremented."
    roles: [OutfitterRepresentative, AuthorizedOfficer]
    code: 200
    input: [revocation_reason_code]
    output: GuideAreaAuthorization
    side_effects: ["AUTHORIZED -> REVOKED (terminal), stamps revoked_at", "recomputes Permit.authorized_client_capacity_total", "increments version on both rows"]

  # ==== InsuranceCertificate ====
  - method: POST
    path: "/osup/permits/{id}/insurance-certificates"
    description: "Files an annual certificate of insurance. Filing a certificate of the same coverage_type whose interval fully contains an existing ACTIVE certificate's interval supersedes that certificate."
    roles: [OutfitterRepresentative]
    code: 201
    input: [coverage_type, carrier_name, coverage_amount_cents, effective_date, expiration_date, "additional_insured_endorsed?"]
    output: InsuranceCertificate
    side_effects: ["status ACTIVE", "a fully contained same-type ACTIVE certificate -> SUPERSEDED", "recomputes Permit.insurance_current and runs permit_compliance_derivation", "increments Permit.version"]

  - method: GET
    path: "/osup/permits/{id}/insurance-certificates"
    description: "Lists the certificates on file for one permit, ordered effective_date ASC then created_at ASC, so a test can walk the coverage timeline for gaps."
    roles: [OutfitterRepresentative, PermitSpecialist, AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: ["coverage_type?", "status?"]
    output: InsuranceCertificate[]
    side_effects: []

  # ==== Bond ====
  - method: POST
    path: "/osup/permits/{id}/bonds"
    description: "Files a performance bond. required_amount_cents is frozen onto the row from required_financial_assurance at filing time; a later change to authorized_service_days does not retroactively alter the stored requirement, but bond_current is always evaluated against the permit's current requirement."
    roles: [OutfitterRepresentative]
    code: 201
    input: [bond_amount_cents, surety_name, effective_date, expiration_date]
    output: Bond
    side_effects: ["status ACTIVE", "any prior ACTIVE bond -> SUPERSEDED", "freezes required_amount_cents", "recomputes Permit.bond_current and runs permit_compliance_derivation", "increments Permit.version"]

  - method: GET
    path: "/osup/permits/{id}/bonds"
    description: "Lists the bonds filed against one permit, ordered created_at ASC."
    roles: [OutfitterRepresentative, PermitSpecialist, AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: ["status?"]
    output: Bond[]
    side_effects: []

  # ==== TripUseReport ====
  - method: POST
    path: "/osup/permits/{id}/trip-use-reports"
    description: |
      Files actual use for a reporting period. The period is HALF-OPEN — [period_start_date,
      period_end_date) — so a period ending on the day a later period begins does not overlap it.
      season_year is derived from period_start_date. adjusted_gross_revenue_cents is computed at
      filing; applied_rate_bp and fee_component_cents stay null until the report is accepted.
    roles: [OutfitterRepresentative]
    code: 201
    input: [period_start_date, period_end_date, service_days_used, client_count, gross_revenue_cents, "allowable_deductions_cents?"]
    output: TripUseReport
    side_effects: ["status SUBMITTED", "computes season_year and adjusted_gross_revenue_cents"]

  - method: GET
    path: "/osup/trip-use-reports/{id}"
    description: "Reads one use report including applied_rate_bp and fee_component_cents once accepted, and supersedes_report_id once amended."
    roles: [OutfitterRepresentative, PermitSpecialist, AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: []
    output: TripUseReport
    side_effects: []

  - method: GET
    path: "/osup/trip-use-reports"
    description: "Lists use reports ordered period_start_date ASC then created_at ASC — the exact order the PROVISIONAL_PER_REPORT fee variant walks. supersedes_report_id reaches the amendment chain."
    roles: [OutfitterRepresentative, PermitSpecialist, AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: ["permit_id?", "supersedes_report_id?", "status?", "season_year?", "limit?", "offset?"]
    output: TripUseReport[]
    side_effects: []

  - method: POST
    path: "/osup/trip-use-reports/{id}/accept"
    description: |
      Accepts a submitted report. This is the cascade entry point for money: it stamps the report's
      applied_rate_bp and fee_component_cents, then creates or updates the season's FeeAssessment with
      the PROVISIONAL_PER_REPORT variant. The FeeAssessment is never created directly by any endpoint —
      it exists only as a consequence of acceptance and is discoverable only through the permit's
      fee-assessments listing. Acceptance is the PermitSpecialist's exclusive act.
    roles: [PermitSpecialist]
    code: 200
    input: []
    output: TripUseReport
    side_effects:
      - "SUBMITTED -> ACCEPTED, stamps accepted_at"
      - "stamps applied_rate_bp and fee_component_cents from permit_fee_assessment variant PROVISIONAL_PER_REPORT"
      - "creates the (permit_id, season_year) FeeAssessment in PROVISIONAL if none exists, else recomputes it"
      - "adds service_days_used to Permit.service_days_used_ytd"
      - "recomputes Permit.fee_delinquent and runs permit_compliance_derivation"
      - "increments version on the report, the assessment and the permit"

  - method: POST
    path: "/osup/trip-use-reports/{id}/amend"
    description: |
      Amends an ACCEPTED report. The original row is preserved and moved to SUPERSEDED; a NEW report
      row is created for the same period carrying supersedes_report_id, so the audit trail keeps both
      figures. Because the amendment rewrites the season's fee basis, expected_permit_version must
      match the permit's current version.
    roles: [OutfitterRepresentative]
    code: 201
    input: [expected_permit_version, service_days_used, client_count, gross_revenue_cents, "allowable_deductions_cents?"]
    output: TripUseReport
    side_effects:
      - "original report ACCEPTED -> SUPERSEDED"
      - "creates a replacement TripUseReport in ACCEPTED with supersedes_report_id set to the original"
      - "the season FeeAssessment reverts FINAL or PAID -> PROVISIONAL and is recomputed with variant PROVISIONAL_PER_REPORT over the new accepted set"
      - "paid_to_date_cents is preserved; the difference lands in balance_due_cents or credit_balance_cents"
      - "recalculates Permit.service_days_used_ytd from the accepted set, recomputes fee_delinquent and runs permit_compliance_derivation"
      - "increments `Permit.version` by 1, and the version of the assessment and both report rows"

  # ==== FeeAssessment (cascade-created; no direct POST) ====
  - method: GET
    path: "/osup/permits/{id}/fee-assessments"
    description: "The only discovery channel for fee assessments, which are synthesized by report acceptance. Ordered season_year ASC then created_at ASC."
    roles: [OutfitterRepresentative, PermitSpecialist, AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: ["season_year?", "status?"]
    output: FeeAssessment[]
    side_effects: []

  - method: GET
    path: "/osup/fee-assessments/{id}"
    description: "Reads one assessment: variant_applied, reported_agr_cents, assessed_fee_cents, minimum_fee_applied, paid_to_date_cents, balance_due_cents and credit_balance_cents."
    roles: [OutfitterRepresentative, PermitSpecialist, AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: []
    output: FeeAssessment
    side_effects: []

  - method: POST
    path: "/osup/fee-assessments/{id}/finalize"
    description: "Recomputes the assessment with the FINAL_AGGREGATE variant and moves it to FINAL. Requires at least one ACCEPTED report for the season and no report left in SUBMITTED. The delta against the provisional figure appears in balance_due_cents or credit_balance_cents."
    roles: [PermitSpecialist, ProgramAdministrator]
    code: 200
    input: []
    output: FeeAssessment
    side_effects: ["PROVISIONAL -> FINAL", "sets variant_applied FINAL_AGGREGATE and stamps finalized_at", "recomputes assessed_fee_cents, minimum_fee_applied, balance_due_cents and credit_balance_cents", "recomputes Permit.fee_delinquent and runs permit_compliance_derivation", "increments version on both rows"]

  - method: POST
    path: "/osup/fee-assessments/{id}/payments"
    description: "Records a payment against the assessment. amount_cents must be positive and must not exceed the current balance_due_cents. paid_to_date_cents only ever increases."
    roles: [OutfitterRepresentative]
    code: 200
    input: [amount_cents]
    output: FeeAssessment
    side_effects: ["adds amount_cents to paid_to_date_cents and reduces balance_due_cents", "FINAL -> PAID when balance_due_cents reaches 0", "recomputes Permit.fee_delinquent and runs permit_compliance_derivation", "increments version on both rows"]

  - method: POST
    path: "/osup/fee-assessments/{id}/close"
    description: "Administratively closes a PAID assessment. A CLOSED assessment is terminal: it accepts no further payment, finalization or amendment-driven revert, so an amendment to one of its reports is rejected rather than silently reopening a closed season."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: FeeAssessment
    side_effects: ["PAID -> CLOSED (terminal)", "increments version"]

  # ==== PerformanceEvaluation (immutable record) ====
  - method: POST
    path: "/osup/permits/{id}/performance-evaluations"
    description: "Records the officer's annual performance evaluation. The four component scores are inputs in 0..100; raw_score, provisional_band, penalty_points_applied, weighted_score and rating are all computed by performance_weighted_rating in its pinned six-step order. The row is immutable — there is no update endpoint and no version field."
    roles: [AuthorizedOfficer]
    code: 201
    input: [evaluation_year, resource_protection_score, client_safety_score, reporting_timeliness_score, fee_compliance_score]
    output: PerformanceEvaluation
    side_effects: ["runs performance_weighted_rating", "stamps evaluator_user_id from X-User-ID", "sets Permit.latest_performance_rating to the rating of the highest evaluation_year", "increments Permit.version"]

  - method: GET
    path: "/osup/permits/{id}/performance-evaluations"
    description: "Lists the evaluations recorded against one permit, ordered evaluation_year ASC then created_at ASC."
    roles: [OutfitterRepresentative, PermitSpecialist, AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: ["evaluation_year?"]
    output: PerformanceEvaluation[]
    side_effects: []

  # ==== NoncomplianceAction ====
  - method: POST
    path: "/osup/permits/{id}/noncompliance-actions"
    description: "Issues a noncompliance action. points are derived from severity (MINOR 2, MODERATE 5, MAJOR 10) and the requested action_type must be allowed for that severity. Issuing an action can by itself suspend the permit through the point-threshold cascade."
    roles: [AuthorizedOfficer]
    code: 201
    input: [severity, action_type, cited_provision, cure_deadline_date]
    output: NoncomplianceAction
    side_effects:
      - "status ISSUED, stamps issued_by_user_id from X-User-ID and derives points"
      - "recomputes Permit.open_noncompliance_points over the rolling 1095-day window"
      - "runs permit_compliance_derivation; crossing 12 points while ACTIVE drives the permit to SUSPENDED with reason POINTS_THRESHOLD, which revokes the guide roster and re-derives the Outfitter's status"
      - "increments version on every row written"

  - method: GET
    path: "/osup/permits/{id}/noncompliance-actions"
    description: "Lists the actions issued against one permit, ordered created_at ASC."
    roles: [OutfitterRepresentative, PermitSpecialist, AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: ["status?", "severity?"]
    output: NoncomplianceAction[]
    side_effects: []

  - method: POST
    path: "/osup/noncompliance-actions/{id}/cure"
    description: "The holder documents correction of an ISSUED action on or before its cure_deadline_date. A CURED action stops contributing points, which can pull the permit back below a threshold — but never auto-reinstates a suspended permit."
    roles: [OutfitterRepresentative]
    code: 200
    input: [corrective_summary]
    output: NoncomplianceAction
    side_effects: ["ISSUED -> CURED (terminal)", "recomputes Permit.open_noncompliance_points and runs permit_compliance_derivation", "increments version on both rows"]

  - method: POST
    path: "/osup/noncompliance-actions/{id}/appeal"
    description: "The holder appeals an ISSUED action. An APPEALED action keeps contributing its points while the appeal is pending — appealing is not a stay."
    roles: [OutfitterRepresentative]
    code: 200
    input: [appeal_basis]
    output: NoncomplianceAction
    side_effects: ["ISSUED -> APPEALED", "points continue to count; open_noncompliance_points is unchanged", "increments version"]

  - method: POST
    path: "/osup/noncompliance-actions/{id}/decide-appeal"
    description: "Decides a pending appeal. decision is UPHELD or RESCINDED. The deciding X-User-ID must differ from issued_by_user_id. RESCINDED drops the points; UPHELD keeps them and, for a MAJOR action, lengthens any future point-threshold suspension."
    roles: [AuthorizedOfficer, ProgramAdministrator]
    code: 200
    input: [decision]
    output: NoncomplianceAction
    side_effects: ["APPEALED -> UPHELD or RESCINDED (both terminal)", "stamps appeal_decided_by_user_id from X-User-ID", "recomputes Permit.open_noncompliance_points and runs permit_compliance_derivation", "increments version on both rows"]

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:

  # ---- auth ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header absent or not one of the four declared roles, or X-User-ID absent on a mutating request"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the caller's role is not listed in the endpoint's §1.5 roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an OutfitterRepresentative attempts a write against a resource whose owning Outfitter is not the caller's own"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the same X-User-ID that started an operating-plan review tries to approve or reject it, or the officer who issued a noncompliance action tries to decide its appeal"

  # ---- not found ----
  - id: ERR_USE_AREA_NOT_FOUND
    http: 404
    condition: "no UseArea matches the supplied id"
  - id: ERR_OUTFITTER_NOT_FOUND
    http: 404
    condition: "no Outfitter matches the supplied id"
  - id: ERR_NEEDS_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "no NeedsAssessment matches the supplied id"
  - id: ERR_PROSPECTUS_NOT_FOUND
    http: 404
    condition: "no Prospectus matches the supplied id"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "no PermitApplication matches the supplied id"
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "no Permit matches the supplied id, including a predecessor_permit_id that resolves to nothing"
  - id: ERR_OPERATING_PLAN_NOT_FOUND
    http: 404
    condition: "no OperatingPlan matches the supplied id"
  - id: ERR_GUIDE_NOT_FOUND
    http: 404
    condition: "no Guide matches the supplied id"
  - id: ERR_AUTHORIZATION_NOT_FOUND
    http: 404
    condition: "no GuideAreaAuthorization matches the supplied id"
  - id: ERR_USE_REPORT_NOT_FOUND
    http: 404
    condition: "no TripUseReport matches the supplied id"
  - id: ERR_FEE_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "no FeeAssessment matches the supplied id"
  - id: ERR_NONCOMPLIANCE_ACTION_NOT_FOUND
    http: 404
    condition: "no NoncomplianceAction matches the supplied id"

  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is absent or null, an enum value is not a declared member, a numeric field is out of range, a date is malformed or a date pair is inverted, or ein / area_code collides with an existing row"

  # ---- optimistic concurrency ----
  - id: ERR_STALE_USE_AREA_VERSION
    http: 412
    condition: "expected_use_area_version on a prospectus award does not equal the governing UseArea's current version"
  - id: ERR_STALE_PERMIT_VERSION
    http: 412
    condition: "expected_permit_version on a use-report amendment does not equal the permit's current version"

  # ---- state ----
  - id: ERR_INVALID_ASSESSMENT_STATE
    http: 409
    condition: "publishing a NeedsAssessment that is already PUBLISHED, or one that has been SUPERSEDED by a later assessment for the same area and year"
  - id: ERR_INVALID_APPLICATION_STATE
    http: 409
    condition: "the trigger is not declared for the PermitApplication's current status — for example screening an application still in DRAFT, or issuing a permit from PROSPECTUS_QUEUED"
  - id: ERR_INVALID_PLAN_STATE
    http: 409
    condition: "the trigger is not declared for the OperatingPlan's current status — for example approving a plan that is still SUBMITTED, or submitting an APPROVED plan again"
  - id: ERR_PERMIT_NOT_OPERATIONAL
    http: 409
    condition: "the permit's administrative_status does not admit the operation — a use report, guide authorization, certificate, bond, evaluation or holder-change against a SUSPENDED, REVOKED, EXPIRED or CLOSED permit, activating a permit that is not ISSUED, or reinstating one that is not SUSPENDED"
  - id: ERR_PROSPECTUS_NOT_OPEN
    http: 409
    condition: "a response or close-submissions against a prospectus that is not OPEN, an award against one that is not EVALUATING, or a cancel against one already AWARDED or CANCELLED"
  - id: ERR_USE_REPORT_STATE_INVALID
    http: 409
    condition: "accepting a report that is not SUBMITTED, or amending one that is not ACCEPTED"
  - id: ERR_AUTHORIZATION_NOT_ACTIVE
    http: 409
    condition: "revoking a GuideAreaAuthorization that is already REVOKED"
  - id: ERR_FEE_ASSESSMENT_CLOSED
    http: 409
    condition: "a finalize, payment, or amendment-driven revert targets a FeeAssessment already CLOSED, or a close is attempted on an assessment that is not PAID"
  - id: ERR_ACTION_NOT_APPEALABLE
    http: 409
    condition: "curing or appealing an action that is not ISSUED, or deciding an appeal on an action that is not APPEALED"
  - id: ERR_USE_REPORTS_PENDING
    http: 409
    condition: "finalizing a season while at least one TripUseReport for that permit and season is still SUBMITTED"

  # ---- business: safety ----
  - id: ERR_FIRST_AID_CERT_EXPIRED
    http: 422
    condition: "the guide's first_aid_expires_on is strictly before the current logical date at qualification or authorization"
  - id: ERR_FIRST_AID_CERT_MISSING
    http: 422
    condition: "the guide's first_aid_cert_type is NONE at qualification or authorization"
  - id: ERR_GUIDE_LEVEL_INELIGIBLE
    http: 422
    condition: "a TRAINEE-level guide is offered for permit authorization"
  - id: ERR_GUIDE_NOT_QUALIFIED
    http: 422
    condition: "a PENDING_QUALIFICATION or LAPSED guide is offered for permit authorization"
  - id: ERR_CLIENT_GUIDE_RATIO_UNMET
    http: 422
    condition: "activation is attempted while authorized_client_capacity_total is below UseArea.party_size_max, or a use report declares a client_count above authorized_client_capacity_total"

  # ---- business: referential ----
  - id: ERR_GUIDE_OUTFITTER_MISMATCH
    http: 422
    condition: "the offered guide belongs to a different Outfitter than the permit holder"
  - id: ERR_NEEDS_ASSESSMENT_NOT_PUBLISHED
    http: 422
    condition: "no PUBLISHED NeedsAssessment governs the area and year at screening, or a prospectus cites a DRAFT or SUPERSEDED assessment"
  - id: ERR_NO_PUBLIC_NEED
    http: 422
    condition: "the governing NeedsAssessment records public_need_finding NO_NEED"
  - id: ERR_OPERATING_PLAN_NOT_APPROVED
    http: 422
    condition: "activation or reinstatement is attempted with no APPROVED OperatingPlan covering the year"
  - id: ERR_SUCCESSION_PREDECESSOR_INVALID
    http: 422
    condition: "a RENEWAL application has no predecessor_permit_id, names one belonging to another outfitter or area, or names one in an administrative_status outside {ACTIVE, SUSPENDED, EXPIRED}; or a NEW application supplies one"
  - id: ERR_INDEMNIFICATION_NOT_ACKNOWLEDGED
    http: 422
    condition: "activation is attempted while Permit.indemnification_acknowledged is false"

  # ---- business: temporal ----
  - id: ERR_OUTSIDE_SEASON_WINDOW
    http: 422
    condition: "a reporting period falls partly or wholly outside the area's seasonal window or the permit's authorized term"
  - id: ERR_SUBMISSION_DEADLINE_PASSED
    http: 422
    condition: "a prospectus response is filed after submission_deadline_date"
  - id: ERR_PERIOD_NOT_ELAPSED
    http: 422
    condition: "a reporting period whose period_end_date is after the current logical date is reported"
  - id: ERR_REPORTING_PERIOD_OVERLAP
    http: 409
    condition: "the new report's half-open period intersects the period of an existing SUBMITTED or ACCEPTED report on the same permit"
  - id: ERR_PERMIT_TERM_CONFLICT
    http: 409
    condition: "the new permit's closed term is not separated by at least 14 clear days from another held permit for the same outfitter and area"
  - id: ERR_SUCCESSION_TERM_NOT_CONTIGUOUS
    http: 422
    condition: "a holder-change successor term does not begin the day after the predecessor's term_end_date, or ends on or before that date"
  - id: ERR_INSURANCE_COVERAGE_GAP
    http: 422
    condition: "the ACTIVE certificate set leaves at least one uncovered calendar day inside the permit term"
  - id: ERR_GUIDE_TERM_CONFLICT
    http: 422
    condition: "the guide's certification expires before the close of the season being authorized"
  - id: ERR_CURE_DEADLINE_PASSED
    http: 422
    condition: "a cure is filed after the action's cure_deadline_date"

  # ---- business: constraint ----
  - id: ERR_GUIDE_ROSTER_FULL
    http: 409
    condition: "the permit already carries 8 AUTHORIZED guide authorizations"
  - id: ERR_DUPLICATE_PLAN_YEAR
    http: 409
    condition: "an OperatingPlan already exists for the permit and plan_year in a status other than REJECTED"
  - id: ERR_REVISION_LIMIT_EXCEEDED
    http: 409
    condition: "a third revision is requested on a plan whose revision_round already reached 2"
  - id: ERR_OPERATING_PLAN_INCOMPLETE
    http: 422
    condition: "submission is attempted while completeness_score is below 100.0 because a required key is missing from one of the four sections"
  - id: ERR_TRANSFER_NOT_PERMITTED
    http: 409
    condition: "a holder-change is attempted on a permit that is not COMPLIANT, has been suspended before, has already been transferred once, or names an incoming outfitter that is unverified or identical to the current holder"
  - id: ERR_NO_RESPONSIVE_APPLICATIONS
    http: 409
    condition: "an award is attempted with no responsive application scoring at or above min_qualifying_score on the FINAL variant"
  - id: ERR_ACTION_TYPE_NOT_ALLOWED
    http: 422
    condition: "the requested action_type is not admissible for the cited severity"
  - id: ERR_POINTS_THRESHOLD_UNRESOLVED
    http: 409
    condition: "reinstatement is attempted while open_noncompliance_points is still at or above 12"

  # ---- business: fiscal ----
  - id: ERR_SERVICE_DAY_LIMIT_EXCEEDED
    http: 422
    condition: "the reported service days would carry the permit's season total past authorized_service_days"
  - id: ERR_INSUFFICIENT_SERVICE_DAYS
    http: 409
    condition: "the area no longer has enough available service days to issue the permit, or the response asks for more than the prospectus offered"
  - id: ERR_INSURANCE_COVERAGE_INSUFFICIENT
    http: 422
    condition: "ACTIVE general-liability coverage is below the area's minimum, or a certificate lacks the additional-insured endorsement"
  - id: ERR_BOND_INSUFFICIENT
    http: 422
    condition: "no ACTIVE bond meets required_financial_assurance for the permit's authorized service days"
  - id: ERR_FEE_BALANCE_OUTSTANDING
    http: 409
    condition: "a renewal issuance or holder-change is attempted while any FeeAssessment for the permit carries balance_due_cents above 0"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "a payment is non-positive or exceeds the assessment's current balance_due_cents"
  - id: ERR_DEDUCTIONS_EXCEED_CAP
    http: 422
    condition: "allowable_deductions_cents exceeds 15 percent of gross_revenue_cents, computed as floor(gross_revenue_cents * 0.15)"

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix — role_model: segregation_of_duties
#
# Filing, screening, deciding and administering are held by four different roles.
# Two duty separations are enforced on X-User-ID within a single role:
# an operating plan cannot be reviewed and then approved or rejected by the same
# person, and a noncompliance action cannot be issued and then upheld or rescinded
# by the same officer.
# -----------------------------------------------------------------------------
roles:

  - name: OutfitterRepresentative
    description: "The permit holder or applicant. Files applications, prospectus responses, operating plans, guides, certificates, bonds, use reports, amendments, payments, cures and appeals. Every write is confined to resources owned by its own Outfitter."
    identity: "entity_backed:Outfitter"
    exclusive_operations:
      - "POST /osup/permit-applications/{id}/submit"
      - "POST /osup/permit-applications/{id}/withdraw"
      - "POST /osup/prospectuses/{id}/responses"
      - "POST /osup/permits/{id}/acknowledge-indemnification"
      - "POST /osup/permits/{id}/operating-plans"
      - "POST /osup/operating-plans/{id}/sections"
      - "POST /osup/operating-plans/{id}/submit"
      - "POST /osup/outfitters/{id}/guides"
      - "POST /osup/guides/{id}/certifications"
      - "POST /osup/permits/{id}/guide-authorizations"
      - "POST /osup/permits/{id}/insurance-certificates"
      - "POST /osup/permits/{id}/bonds"
      - "POST /osup/permits/{id}/trip-use-reports"
      - "POST /osup/trip-use-reports/{id}/amend"
      - "POST /osup/fee-assessments/{id}/payments"
      - "POST /osup/noncompliance-actions/{id}/cure"
      - "POST /osup/noncompliance-actions/{id}/appeal"
    shared_operations:
      - "POST /osup/permit-applications (shared with PermitSpecialist)"
      - "POST /osup/guide-authorizations/{id}/revoke (shared with AuthorizedOfficer)"
      - "every GET endpoint"

  - name: PermitSpecialist
    description: "The program's case worker. Registers outfitters, records prequalification, drafts needs assessments, issues prospectuses, screens applications, starts plan reviews, requests revisions, qualifies guides, accepts use reports and finalizes fee assessments. Cannot award, deny, activate, suspend, revoke, approve or reject."
    identity: "opaque"
    exclusive_operations:
      - "POST /osup/permit-applications/{id}/screen"
      - "POST /osup/prospectuses/{id}/close-submissions"
      - "POST /osup/trip-use-reports/{id}/accept"
    shared_operations:
      - "POST /osup/outfitters (shared with ProgramAdministrator)"
      - "POST /osup/outfitters/{id}/prequalification (shared with ProgramAdministrator)"
      - "POST /osup/use-areas/{id}/needs-assessments (shared with ProgramAdministrator)"
      - "POST /osup/prospectuses (shared with ProgramAdministrator)"
      - "POST /osup/permit-applications (shared with OutfitterRepresentative)"
