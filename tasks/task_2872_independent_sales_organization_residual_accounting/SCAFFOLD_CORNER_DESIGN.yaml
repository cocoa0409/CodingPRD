              captures: { b1: $.data.id }
            - call: "POST /residual-batches/${b1}/lines"
              payload: { merchant_id: "${m1}", transaction_count: 100, sales_volume_cents: 1000000, interchange_cents: 20000, assessments_cents: 1300, gross_income_cents: 40000 }
              as: ResidualAnalyst
            - call: "POST /residual-batches/${b1}/normalize"
              payload: {}
              as: ResidualAnalyst
            - call: "POST /residual-batches/${b1}/post"
              payload: {}
              as: ResidualController
            - call: "GET /agent-statements"
              payload: { agent_id: "${a1}", period_month: "2026-07" }
              as: ResidualController
              captures: { st: "$.data[0].id", sv: "$.data[0].version" }
            - call: "POST /agent-statements/${st}/adjustments"
              payload: { kind: "MANUAL_DEBIT", amount_cents: -800, reason: "Equipment shortfall recharge", expected_statement_version: "${sv}" }
              as: ResidualAnalyst
              as_user_id: analyst-1
              captures: { adj1: $.data.id }
            - call: "POST /agent-statements/${st}/adjustments"
              payload: { kind: "DISPUTE_CREDIT", amount_cents: 200, reason: "Assessment overbill credit", expected_statement_version: "${sv}" }
              as: ResidualAnalyst
              as_user_id: analyst-1
              captures: { adj2: $.data.id }
            - call: "POST /statement-adjustments/${adj1}/review"
