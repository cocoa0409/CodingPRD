    instances:
      - name: existence_beats_shape_validation
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=5]"]
        distinguishing_aspect: "A request with both a nonexistent path id and an invalid to_state enum returns ERR_NOT_FOUND (existence priority 4 precedes shape priority 5)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/families/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/transition", payload: { to_state: "BOGUS" }, as: PracticeAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_NOT_FOUND"

