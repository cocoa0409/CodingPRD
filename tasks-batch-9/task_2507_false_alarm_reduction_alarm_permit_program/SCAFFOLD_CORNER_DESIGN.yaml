          - endpoints.GET_/false-alarm-program/compliance-reports/{reportId}
        distinguishing_aspect: "The reportId segment also fronts review and correct, so the 404 must precede both the correction-limit aggregate and the variance check: an unknown report can never answer ERR_CORRECTION_LIMIT_REACHED."
        test_recipe:
          setup:
