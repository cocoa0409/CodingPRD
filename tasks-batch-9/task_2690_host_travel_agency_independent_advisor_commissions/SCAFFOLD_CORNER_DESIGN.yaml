              payload: { advisor_id: "${adv_id}", supplier_id: "00000000-0000-4000-8000-000000000000", client_id: "${cli_id}", channel: "SUPPLIER_DIRECT", payment_method: "MERCHANT_DIRECT", gross_sale_cents: 1000000, deposit_amount_cents: 0, travel_start_date: "2026-10-01", travel_end_date: "2026-10-10" }
              as: Advisor
              as_user_id: "${adv_id}"
              captures: { err_sup: $.data.error_id }
            - call: "POST /host-agency/bookings"
              payload: { advisor_id: "${adv_id}", supplier_id: "${sup_id}", client_id: "00000000-0000-4000-8000-000000000000", channel: "SUPPLIER_DIRECT", payment_method: "MERCHANT_DIRECT", gross_sale_cents: 1000000, deposit_amount_cents: 0, travel_start_date: "2026-10-01", travel_end_date: "2026-10-10" }
