            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1: $.data.id, v1_status: $.data.status}}
          trigger:
            - {call: "POST /score-variants/${v1}/recall", payload: {}, as: ModelDeveloper, captures: {err_draft: $.data.error_id}}
            - {call: "POST /score-variants/${v1}/release", payload: {}, as: ModelDeveloper, captures: {var_released: $.data.status}}
            - {call: "POST /score-variants/${v1}/recall", payload: {}, as: ModelDeveloper, captures: {var_recalled: $.data.status}}
          assert:
            - "data.v1_status == \"DRAFT\" on creation"
            - "the recall from DRAFT returns 409 with data.err_draft == \"ERR_INVALID_STATE_MACHINE_EDGE\""
            - "data.var_released == \"RELEASED\" and data.var_recalled == \"RECALLED\", so the same trigger succeeds once the from: state is satisfied"

