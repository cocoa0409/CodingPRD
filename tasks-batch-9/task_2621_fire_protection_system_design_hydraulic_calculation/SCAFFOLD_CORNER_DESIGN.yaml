      - name: fee_payment_of_one_cent_against_a_zero_balance_is_refused
        claim_type: violation_error
        grounds:
          - validations[priority=44]
          - errors.ERR_FEE_PAYMENT_EXCEEDS_BALANCE
          - endpoints.POST_/projects/{id}/fee-payments
          - entities.Project.fields.review_fee_balance_usd
        distinguishing_aspect: |
          Overpayment is refused rather than clamped to zero or carried as a credit, and the boundary is
          one cent above a zero balance on a project that has never been submitted. The refusal is also
          inert: Project.version is identical before and after, proving no partial write and no
          version bump happened on the rejected call.
        test_recipe:
          setup:
            - "A freshly created project FP-2601 with review_fee_balance_usd 0.00 and no submittals"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e1: $.data.id }
            - call: "POST /ahj-reviewers"
              payload: { full_name: "Marisol Vega", jurisdiction_code: "TX-AUS" }
              as: FirmAdmin
              captures: { r1: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "FP-2601", building_name: "Rio Grande Distribution Center", jurisdiction_code: "TX-AUS", jurisdiction_state: "TX", occupancy_type: "STORAGE", building_height_ft: 42.0, underground_lead_in_loss_psi: 5.0, lead_engineer_id: "${e1}", ahj_reviewer_id: "${r1}" }
              as: FirmAdmin
              captures: { p1: $.data.id }
            - call: "GET /projects/${p1}"
              as: FirmAdmin
              captures: { pv0: $.data.version }
          trigger:
            - call: "POST /projects/${p1}/fee-payments"
              payload: { amount_usd: 0.01 }
              as: Contractor
              captures: { err: $.data.error_id }
            - call: "GET /projects/${p1}"
              as: FirmAdmin
              captures: { pv1: $.data.version }
          assert:
            - "trigger 1: HTTP 422 with error_id == ERR_FEE_PAYMENT_EXCEEDS_BALANCE"
            - "Project.${p1}.review_fee_balance_usd == 0.00 - unchanged, not -0.01"
            - "${pv1} == ${pv0} - the rejected payment did not advance the version"
            - "Project.${p1}.submittal_cycle_count == 0"

