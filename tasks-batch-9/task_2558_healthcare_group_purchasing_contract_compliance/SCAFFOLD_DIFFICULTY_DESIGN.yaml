              as: DistributorAgent
              captures: { facc: $.data.id }
            - call: "POST /gpo/distributor-files/${facc}/validate"
              payload: {}
              as: DistributorAgent
            - call: "POST /gpo/distributor-files/${facc}/load"
              payload: {}
              as: ComplianceAnalyst
            - call: "POST /gpo/distributor-files"
              payload: { member_id: "${m1}", contract_id: "${ccol}", distributor_code: "D-A", period_start: "2026-08-01", period_end: "2026-09-01", lines: [ { member_item_number: "MI-2", quantity_units: 500, unit_price_paid_cents: 9500, purchase_date: "2026-08-05" } ] }
              as: DistributorAgent
              captures: { fcol: $.data.id }
            - call: "POST /gpo/distributor-files/${fcol}/validate"
              payload: {}
              as: DistributorAgent
            - call: "POST /gpo/distributor-files/${fcol}/load"
