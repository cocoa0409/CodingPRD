        claim_type: System Fields
        grounds:
          - entities.AssetClassSlot.fields.ips_id
          - entities.AssetClassSlot.fields.status
          - endpoints.POST_/governance/asset-class-slots
        distinguishing_aspect: "Slot creation accepts only plan_id, asset_class_code, designation and slot_index, yet the stored row carries id, created_at, updated_at, version 1, status EMPTY, current_fund_id null and ips_id pinned to the plan's ADOPTED IPS — ips_id is declared source: input in §1.1 but has no input slot on the create endpoint, so it must be resolved server-side."
        test_recipe:
          setup:
            - "Governed plan with IPS-2026-A ADOPTED and no slots yet (L1 + L2)."
          setup_api_calls: *chain_l2
          trigger:
