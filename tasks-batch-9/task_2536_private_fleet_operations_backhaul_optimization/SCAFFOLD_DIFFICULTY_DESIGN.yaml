            - call: "POST /fleet/replenishment-orders"
              payload: { store_id: "${store_s1_id}", cases: 900, weight_lbs: 21000, requested_window_start: "2026-08-03T08:00:00Z", requested_window_end: "2026-08-03T12:00:00Z", temperature_mode: "DRY", priority: 2 }
