# =============================================================================
# Custom Cabinetry & Millwork Shop — benchmark seed tables (Expert)
# §1.0–§1.7. The §1.8 difficulty design and §1.9 corner design live in their
# sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Custom Cabinetry & Millwork Shop: design & measure, cut list & material (BOM),
  CNC/build scheduling, finish selection, deposit & progress draw, delivery &
  install, change order, punch/touch-up.

domain_name: custom-cabinetry-millwork-shop
api_prefix: ""
# Nested business paths (/shops/{id}/projects/{id}/...) express the ownership tree
# for actions; flat top-level read aliases (/projects/{id}, /draws?project_id=...)
# provide single-resource GET + FK-filtered list reverse-reachability for every entity.

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  # Shop -> Customer -> Project tree, with cross-aggregate FKs from BuildJob to
  # Machine and from MaterialReservation to Material (both Shop-scoped config),
  # so production scheduling and stock allocation cut across the project tree.
  state_machine_shape: cyclic
  # Project carries a change-order revision loop (IN_PRODUCTION -> CHANGE_PENDING
  # -> IN_PRODUCTION) and ChangeOrder carries a SUBMITTED -> REVISING -> SUBMITTED
  # loop; Installation carries a punch reopen loop. Linear pipelines elsewhere.
  relationship_patterns:
    - one_to_many        # Project has many CabinetSpec / Draw / ChangeOrder
    - cross_aggregate    # BuildJob -> Machine, MaterialReservation -> Material
  role_model: peer_roles
  # Designer owns design/measure/quote; ShopManager owns contract/finance/scheduling
  # overrides; Customer (entity_backed) approves quotes/change-orders & pays draws;
  # Installer owns install/punch. ShopAdmin is the operational superset.
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Shop
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Shop display name" }
      - { name: currency, type: string, source: input, default: "USD", description: "ISO currency code" }
      - { name: tax_rate_bps, type: integer, source: input, default: 0, description: "Sales tax in basis points applied to taxable contract subtotal; 0..2000" }
      - { name: deposit_pct_bps, type: integer, source: input, default: 3000, description: "Deposit percentage in basis points of contract_total used to compute the deposit draw; 0..10000" }
      - { name: retainage_pct_bps, type: integer, source: input, default: 1000, description: "Retainage percentage in basis points withheld until install completion; 0..5000" }
      - { name: rush_surcharge_bps, type: integer, source: input, default: 1500, description: "Surcharge in basis points added to contract_total when a Project is flagged rush; 0..5000" }
      - { name: max_installs_per_day, type: integer, source: input, default: 2, description: "Aggregate install-slot capacity per calendar day across the whole shop; >=1" }
      - { name: change_order_buffer_pct_bps, type: integer, source: input, default: 0, description: "Reserved for goodwill discounting; unused in pricing, kept 0" }
      - { name: current_utc, type: datetime, source: system, default: null, description: "Shop test clock; set via /_clock/set_current_utc, used as the now() for all scheduling and draw-due checks" }

  - name: Customer
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id" }
      - { name: full_name, type: string, source: input, description: "Customer full name" }
      - { name: email, type: string, source: input, description: "Customer email, unique per shop" }
      - { name: credit_hold, type: boolean, source: system, default: false, description: "When true, blocks issuing any new Draw to this customer's projects" }
      - { name: lifetime_paid_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over this customer's Draw rows whose status == PAID, all projects" }

  - name: Project
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id" }
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id" }
      - { name: title, type: string, source: input, description: "Project title" }
      - { name: is_rush, type: boolean, source: input, default: false, description: "Rush flag; adds Shop.rush_surcharge_bps to contract_total at lock time" }
      - { name: install_address, type: string, source: input, required: false, description: "Delivery/install address" }
      - { name: margin_policy, type: enum, source: input, default: "STANDARD", description: "STANDARD | PREMIUM; selects the margin tier table used by contract_total" }
      - { name: estimate_total_cents, type: integer, source: computed, default: 0, description: "Forward-looking contract_total over DRAFT specs (estimate variant); recomputed on spec add/remove while DRAFT/MEASURED/QUOTED" }
      - { name: contract_total_cents, type: integer, source: computed, default: 0, description: "Final locked contract_total over LOCKED specs (final variant); set at CONTRACTED, then mutated only by approved ChangeOrder deltas" }
      - { name: deposit_required_cents, type: integer, source: computed, default: 0, description: "round_half_up(contract_total_cents * Shop.deposit_pct_bps / 10000) set at CONTRACTED" }
      - { name: billed_to_date_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over this project's Draw rows whose status IN {ISSUED, PAID}; conserved under issue+void" }
      - { name: paid_to_date_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over this project's Draw rows whose status == PAID" }
      - { name: open_change_delta_cents, type: integer, source: computed, default: 0, description: "Sum of delta_cents over this project's ChangeOrder rows whose status == APPROVED but not yet folded; informational" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | MEASURED | QUOTED | CONTRACTED | IN_PRODUCTION | CHANGE_PENDING | READY_FOR_DELIVERY | INSTALLED | CLOSED | CANCELLED" }

  - name: CabinetSpec
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: label, type: string, source: input, description: "Cabinet label e.g. 'Base-36'" }
      - { name: width_mm, type: integer, source: input, description: "Cabinet width in millimeters; >0" }
      - { name: height_mm, type: integer, source: input, description: "Cabinet height in millimeters; >0" }
      - { name: depth_mm, type: integer, source: input, description: "Cabinet depth in millimeters; >0" }
      - { name: quantity, type: integer, source: input, description: "Number of identical cabinets; >=1" }
      - { name: base_unit_price_cents, type: integer, source: input, description: "Pre-margin pre-finish per-cabinet cost in cents; >=0" }
      - { name: panel_area_mm2, type: integer, source: computed, description: "Total flat-panel area per cabinet = 2*(w*h) + 2*(h*d) + 1*(w*d); used by cut_list_sheets" }
      - { name: material_id, type: string, source: input, description: "FK -> Material.id; sheet stock this cabinet is cut from" }
      - { name: lock_state, type: enum, source: system, default: "OPEN", description: "OPEN | LOCKED; flips to LOCKED at CONTRACTED, blocking spec edits" }

  - name: Material
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id" }
      - { name: sku, type: string, source: input, description: "Material SKU, unique per shop" }
      - { name: sheet_area_mm2, type: integer, source: input, description: "Usable area of one sheet in mm^2; >0" }
      - { name: sheet_price_cents, type: integer, source: input, description: "Price per sheet in cents; >=0" }
      - { name: on_hand_sheets, type: integer, source: system, default: 0, description: "Physical sheets currently in the rack; adjusted by /restock and by COMMITTED->CONSUMED" }
      - { name: reserved_sheets, type: integer, source: computed, default: 0, description: "Sum of sheets over this material's MaterialReservation rows whose status IN {HELD, COMMITTED}" }
      - { name: available_sheets, type: integer, source: computed, default: 0, description: "on_hand_sheets - reserved_sheets; the quota a new reservation draws from" }

  - name: MaterialReservation
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: material_id, type: string, source: input, description: "FK -> Material.id" }
      - { name: sheets, type: integer, source: input, description: "Number of sheets to reserve; >=1" }
      - { name: status, type: enum, source: system, default: "HELD", description: "HELD | COMMITTED | CONSUMED | RELEASED" }

  - name: Machine
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id" }
      - { name: name, type: string, source: input, description: "CNC/build station name" }
      - { name: changeover_buffer_min, type: integer, source: input, default: 30, description: "Mandatory idle buffer in minutes required between two BuildJobs on this machine; >=0" }
      - { name: status, type: enum, source: input, default: "ONLINE", description: "ONLINE | OFFLINE; OFFLINE machines reject new BuildJob scheduling" }

  - name: BuildJob
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: machine_id, type: string, source: input, description: "FK -> Machine.id" }
      - { name: start_utc, type: datetime, source: input, description: "Job start (inclusive)" }
      - { name: end_utc, type: datetime, source: input, description: "Job end (exclusive); must be strictly after start_utc" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | IN_PROGRESS | COMPLETE | CANCELLED" }

  - name: FinishSelection
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: finish_code, type: enum, source: input, description: "RAW | STAIN | PAINT | LACQUER; finish drives the per-cabinet finish upcharge tier" }
      - { name: sheen, type: enum, source: input, default: "SATIN", description: "MATTE | SATIN | GLOSS" }
      - { name: is_active, type: boolean, source: computed, default: true, description: "Exactly one FinishSelection per project is active; selecting a new one deactivates the prior" }

  - name: Draw
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: draw_type, type: enum, source: input, description: "DEPOSIT | PROGRESS | RETAINAGE; selects the amount formula variant" }
      - { name: requested_pct_bps, type: integer, source: input, required: false, description: "For PROGRESS draws only: requested percent-of-contract in basis points; ignored for DEPOSIT/RETAINAGE" }
      - { name: amount_cents, type: integer, source: computed, description: "Computed draw amount per draw_amount calc; immutable after creation" }
      - { name: due_utc, type: datetime, source: input, required: false, description: "Optional due date used by late-fee tiering at PAID time" }
      - { name: late_fee_cents, type: integer, source: computed, default: 0, description: "Late fee folded into the payment at PAID time per draw_settlement calc" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | ISSUED | PAID | VOIDED" }

  - name: ChangeOrder
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: description, type: string, source: input, description: "What changes" }
      - { name: spec_price_delta_cents, type: integer, source: input, description: "Signed pre-margin per-project subtotal change proposed (cents); may be negative" }
      - { name: delta_cents, type: integer, source: computed, description: "Margin/finish/tax-adjusted signed change to contract_total per change_order_delta calc; set at SUBMITTED, frozen at APPROVED" }
      - { name: revision_round, type: integer, source: system, default: 1, description: "Increments by 1 on each REVISING->SUBMITTED cycle" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | APPROVED | REJECTED | REVISING | CANCELLED" }

  - name: Installation
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: install_date, type: string, source: input, description: "Calendar date YYYY-MM-DD; counted against Shop.max_installs_per_day aggregate capacity" }
      - { name: window_start_utc, type: datetime, source: input, description: "Crew arrival window start (inclusive)" }
      - { name: window_end_utc, type: datetime, source: input, description: "Crew window end (exclusive); strictly after window_start_utc" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | IN_PROGRESS | PUNCH_PENDING | COMPLETE | CANCELLED" }

  - name: PunchItem
    parent: Installation
    common_fields: true
    fields:
      - { name: installation_id, type: string, source: system, description: "FK -> Installation.id" }
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: description, type: string, source: input, description: "Defect / touch-up note" }
      - { name: severity, type: enum, source: input, default: "MINOR", description: "MINOR | MAJOR; a MAJOR open item blocks Installation COMPLETE" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | RESOLVED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Project
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: MEASURED
        trigger: "POST /shops/{shopId}/projects/{projectId}/measure"
        actor: Designer
        preconditions:
          - "At least one CabinetSpec exists on the project (else ERR_NO_SPECS)"
          - "Every CabinetSpec has width_mm>0, height_mm>0, depth_mm>0, quantity>=1"
        side_effects:
          - "Recompute estimate_total_cents over all CabinetSpec rows (estimate variant of contract_total)"
      - from: MEASURED
        to: QUOTED
        trigger: "POST /shops/{shopId}/projects/{projectId}/quote"
        actor: Designer
        preconditions:
          - "Exactly one FinishSelection has is_active==true (else ERR_FINISH_REQUIRED)"
        side_effects:
          - "Recompute estimate_total_cents including active finish upcharge"
      - from: QUOTED
        to: DRAFT
        trigger: "POST /shops/{shopId}/projects/{projectId}/revise"
        actor: Designer
        preconditions: []
        side_effects:
          - "Re-open spec editing; estimate_total_cents stays as last computed until next measure"
        note: "Revision loop — Project may cycle DRAFT->MEASURED->QUOTED->DRAFT any number of times before contract."
      - from: QUOTED
        to: CONTRACTED
        trigger: "POST /shops/{shopId}/projects/{projectId}/contract"
        actor: Customer
        preconditions:
          - "expected_project_version matches Project.version (else ERR_STALE_VERSION)"
          - "Customer.credit_hold == false (else ERR_CUSTOMER_CREDIT_HOLD)"
        side_effects:
          - "Set lock_state=LOCKED on every CabinetSpec"
          - "Compute contract_total_cents (final variant, including rush surcharge if is_rush)"
          - "Compute deposit_required_cents = round_half_up(contract_total_cents * Shop.deposit_pct_bps / 10000)"
          - "Create one DEPOSIT Draw in PENDING (cascade hop 1 of contract-lock chain)"
          - "increments Project.version by 1"
      - from: CONTRACTED
        to: IN_PRODUCTION
        trigger: "POST /shops/{shopId}/projects/{projectId}/build-jobs (first BuildJob scheduled)"
        actor: ShopManager
        preconditions:
          - "Project.paid_to_date_cents >= Project.deposit_required_cents (else ERR_DEPOSIT_UNPAID)"
          - "Project.status == CONTRACTED"
        side_effects:
          - "Project enters IN_PRODUCTION on first BuildJob creation"
        note: "Cross-entity guard: BuildJob creation drives this transition only when deposit is fully paid."
      - from: IN_PRODUCTION
        to: CHANGE_PENDING
        trigger: "POST /shops/{shopId}/projects/{projectId}/change-orders/{changeOrderId}/submit"
        actor: ShopManager
        preconditions:
          - "ChangeOrder.status == DRAFT"
        side_effects:
          - "Project frozen for production scheduling while a ChangeOrder is SUBMITTED"
      - from: CHANGE_PENDING
        to: IN_PRODUCTION
        trigger: "POST /shops/{shopId}/projects/{projectId}/change-orders/{changeOrderId}/approve OR .../reject"
        actor: Customer
        preconditions:
          - "expected_project_version matches Project.version (else ERR_STALE_VERSION) on approve"
        side_effects:
          - "On approve: fold ChangeOrder.delta_cents into contract_total_cents (cascade hop 1 of change-order chain); recompute deposit_required_cents; create PROGRESS adjustment Draw in PENDING (hop 2); increments Project.version by 1"
          - "On reject: no ledger change; increments Project.version by 1"
        note: "Change-order revision loop returns Project to IN_PRODUCTION."
      - from: IN_PRODUCTION
        to: READY_FOR_DELIVERY
        trigger: "POST /shops/{shopId}/projects/{projectId}/mark-ready"
        actor: ShopManager
        preconditions:
          - "Every BuildJob on the project has status==COMPLETE (else ERR_BUILD_INCOMPLETE)"
          - "No ChangeOrder on the project is in status SUBMITTED or REVISING (else ERR_CHANGE_OPEN)"
        side_effects: []
      - from: READY_FOR_DELIVERY
        to: INSTALLED
        trigger: "system (Installation COMPLETE bubbles up)"
        actor: system
        preconditions:
          - "An Installation on the project reached COMPLETE"
        side_effects:
          - "Create one RETAINAGE Draw in PENDING (cascade hop 1 of install chain)"
      - from: INSTALLED
        to: CLOSED
        trigger: "POST /shops/{shopId}/projects/{projectId}/close"
        actor: ShopManager
        preconditions:
          - "Project.paid_to_date_cents >= Project.contract_total_cents (else ERR_BALANCE_OUTSTANDING)"
          - "No PunchItem on any Installation is OPEN (else ERR_PUNCH_OPEN)"
        side_effects:
          - "Release any HELD MaterialReservation rows back to stock"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /shops/{shopId}/projects/{projectId}/cancel"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "Release all non-terminal MaterialReservation rows (HELD/COMMITTED -> RELEASED)"
      - from: MEASURED
        to: CANCELLED
        trigger: "POST /shops/{shopId}/projects/{projectId}/cancel"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "Release all non-terminal MaterialReservation rows (HELD/COMMITTED -> RELEASED)"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /shops/{shopId}/projects/{projectId}/cancel"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "Release all non-terminal MaterialReservation rows (HELD/COMMITTED -> RELEASED)"
      - from: CONTRACTED
        to: CANCELLED
        trigger: "POST /shops/{shopId}/projects/{projectId}/cancel"
        actor: ShopManager
        preconditions:
          - "Project.paid_to_date_cents == 0 (else ERR_DEPOSIT_PAID_NO_CANCEL)"
        side_effects:
          - "Void all PENDING/ISSUED Draw rows; release all non-terminal MaterialReservation rows"

  - entity: ChangeOrder
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /shops/{shopId}/projects/{projectId}/change-orders/{changeOrderId}/submit"
        actor: ShopManager
        preconditions:
          - "Project.status == IN_PRODUCTION (else ERR_INVALID_STATE)"
        side_effects:
          - "Compute delta_cents (change_order_delta calc) using current margin_policy and active finish"
          - "Drive Project IN_PRODUCTION -> CHANGE_PENDING"
      - from: SUBMITTED
        to: REVISING
        trigger: "POST /shops/{shopId}/projects/{projectId}/change-orders/{changeOrderId}/request-revision"
        actor: Customer
        preconditions: []
        side_effects:
          - "Project stays CHANGE_PENDING; delta_cents retained pending resubmit"
      - from: REVISING
        to: SUBMITTED
        trigger: "POST /shops/{shopId}/projects/{projectId}/change-orders/{changeOrderId}/resubmit"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "Increment revision_round by 1; recompute delta_cents"
        note: "Cyclic loop: a ChangeOrder may bounce SUBMITTED<->REVISING multiple rounds."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /shops/{shopId}/projects/{projectId}/change-orders/{changeOrderId}/approve"
        actor: Customer
        preconditions:
          - "expected_project_version matches Project.version (else ERR_STALE_VERSION)"
        side_effects:
          - "Freeze delta_cents; drive Project CHANGE_PENDING -> IN_PRODUCTION with ledger fold"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /shops/{shopId}/projects/{projectId}/change-orders/{changeOrderId}/reject"
        actor: Customer
        preconditions: []
        side_effects:
          - "Drive Project CHANGE_PENDING -> IN_PRODUCTION with no ledger change"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /shops/{shopId}/projects/{projectId}/change-orders/{changeOrderId}/cancel"
        actor: ShopManager
        preconditions: []
        side_effects: []

  - entity: Draw
    initial_state: PENDING
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: PENDING
        to: ISSUED
        trigger: "POST /shops/{shopId}/projects/{projectId}/draws/{drawId}/issue"
        actor: ShopManager
        preconditions:
          - "Customer.credit_hold == false (else ERR_CUSTOMER_CREDIT_HOLD)"
          - "Draw.amount_cents > 0 (else ERR_EMPTY_DRAW)"
        side_effects:
          - "Add amount_cents to Project.billed_to_date_cents (ledger sync)"
      - from: ISSUED
        to: PAID
        trigger: "POST /shops/{shopId}/projects/{projectId}/draws/{drawId}/pay"
        actor: Customer
        preconditions:
          - "Draw.status == ISSUED"
        side_effects:
          - "Compute late_fee_cents (draw_settlement calc) from due_utc vs Shop.current_utc"
          - "Add amount_cents to Project.paid_to_date_cents and to Customer.lifetime_paid_cents"
      - from: PENDING
        to: VOIDED
        trigger: "POST /shops/{shopId}/projects/{projectId}/draws/{drawId}/void"
        actor: ShopManager
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: VOIDED
        trigger: "POST /shops/{shopId}/projects/{projectId}/draws/{drawId}/void"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "Subtract amount_cents from Project.billed_to_date_cents (compensation — leaves billed_to_date_cents at its pre-issue value)"

  - entity: MaterialReservation
    initial_state: HELD
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: HELD
        to: COMMITTED
        trigger: "POST /shops/{shopId}/projects/{projectId}/material-reservations/{reservationId}/commit"
        actor: ShopManager
        preconditions:
          - "Project.status IN {IN_PRODUCTION, CHANGE_PENDING} (else ERR_INVALID_STATE)"
        side_effects: []
      - from: COMMITTED
        to: CONSUMED
        trigger: "system (BuildJob COMPLETE consumes committed reservations)"
        actor: system
        preconditions: []
        side_effects:
          - "Decrement Material.on_hand_sheets by sheets (cascade hop 3 of build-complete chain)"
      - from: HELD
        to: RELEASED
        trigger: "POST /shops/{shopId}/projects/{projectId}/material-reservations/{reservationId}/release OR system (project cancel/close)"
        actor: ShopManager | system
        preconditions: []
        side_effects:
          - "reserved_sheets drops by sheets (compensation — restores Material.available_sheets to its pre-hold value)"
      - from: COMMITTED
        to: RELEASED
        trigger: "POST /shops/{shopId}/projects/{projectId}/material-reservations/{reservationId}/release"
        actor: ShopManager
        preconditions:
          - "Project.status != IN_PRODUCTION (else ERR_RESERVATION_LOCKED)"
        side_effects:
          - "reserved_sheets drops by sheets (compensation)"

  - entity: BuildJob
    initial_state: SCHEDULED
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /shops/{shopId}/projects/{projectId}/build-jobs/{buildJobId}/start"
        actor: ShopManager
        preconditions:
          - "Machine.status == ONLINE (else ERR_MACHINE_OFFLINE)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /shops/{shopId}/projects/{projectId}/build-jobs/{buildJobId}/complete"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "Transition every COMMITTED MaterialReservation on the project to CONSUMED (cascade hop 2 of build-complete chain)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /shops/{shopId}/projects/{projectId}/build-jobs/{buildJobId}/cancel"
        actor: ShopManager
        preconditions: []
        side_effects: []

  - entity: Installation
    initial_state: SCHEDULED
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /shops/{shopId}/projects/{projectId}/installations/{installationId}/start"
        actor: Installer
        preconditions:
          - "Project.status == READY_FOR_DELIVERY (else ERR_PROJECT_NOT_READY)"
        side_effects: []
      - from: IN_PROGRESS
        to: PUNCH_PENDING
        trigger: "POST /shops/{shopId}/projects/{projectId}/installations/{installationId}/walkthrough"
        actor: Installer
        preconditions: []
        side_effects: []
      - from: PUNCH_PENDING
        to: COMPLETE
        trigger: "POST /shops/{shopId}/projects/{projectId}/installations/{installationId}/complete"
        actor: Installer
        preconditions:
          - "No PunchItem with severity==MAJOR and status==OPEN (else ERR_MAJOR_PUNCH_OPEN)"
        side_effects:
          - "Bubble up: drive Project READY_FOR_DELIVERY -> INSTALLED (creates RETAINAGE Draw)"
      - from: PUNCH_PENDING
        to: IN_PROGRESS
        trigger: "POST /shops/{shopId}/projects/{projectId}/installations/{installationId}/reopen"
        actor: Installer
        preconditions:
          - "At least one PunchItem with status==OPEN (else ERR_NOTHING_TO_REOPEN)"
        side_effects: []
        note: "Punch reopen loop: PUNCH_PENDING -> IN_PROGRESS -> PUNCH_PENDING."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /shops/{shopId}/projects/{projectId}/installations/{installationId}/cancel"
        actor: Installer | ShopManager
        preconditions: []
        side_effects: []

# =============================================================================
# Concurrency Rules (§1.2.1) — true CREATE-with-supersede race only
# =============================================================================
concurrency_rules:
  - rule_id: change-order-submit-stale-project
    parent_entity: Project
    write_endpoint: "POST /shops/{shopId}/projects/{projectId}/change-orders/{changeOrderId}/submit"
    occ_field: "expected_project_version"
    description: |
      Submitting a ChangeOrder against a Project whose version has advanced since
      the client last read it is rejected. The submit recomputes delta_cents from
      the Project's current contract_total/margin and folds the project into
      CHANGE_PENDING; if another approved change-order has already advanced the
      Project version (and thus contract_total), the submitter's view is stale and
      the recomputed delta would key off an out-of-date base. The OCC check on
      Project.version turns this into a deterministic stale-version rejection.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: cut_list_sheets
    trigger: "GET /shops/{shopId}/projects/{projectId}/cut-list; also at material-reservation suggestion"
    algorithm: aggregation
    formula: |
      # Order is PINNED: round UP per CabinetSpec, THEN sum. (round-per-line then sum)
      per_spec_sheets(spec):
        panel_area_mm2 = 2*(width_mm*height_mm) + 2*(height_mm*depth_mm) + 1*(width_mm*depth_mm)
        total_panel_area = panel_area_mm2 * quantity
        sheets = ceil( (total_panel_area * (10000 + KERF_WASTE_BPS) / 10000) / material.sheet_area_mm2 )
        return sheets
      project_sheets[material_id] = sum over specs of that material of per_spec_sheets(spec)
      # NOTE: summing ceil-per-spec differs from ceil(sum-of-areas); this scaffold
      # pins ceil-per-spec-then-sum. Do NOT pool fractional sheets across specs.
    input_set: "All CabinetSpec rows of the project, grouped by material_id; included regardless of lock_state."
    constants:
      KERF_WASTE_BPS: 1200   # 12% saw-kerf + offcut waste uplift on panel area
    precision: "integer sheets, ceil per spec then sum"

  - name: contract_total
    trigger: "Project measure/quote (estimate variant); Project contract (final variant)"
    algorithm: tiered_pricing
    formula: |
      # >=3 inputs with non-linear interaction: per-spec base * margin-tier
      # multiplier (selected by margin_policy AND the spec's own qty tier),
      # plus finish upcharge, then min/max clamp, then optional rush, then tax.
      per_spec_priced(spec, finish_code):
        line_base = base_unit_price_cents * quantity
        margin_mult_bps = MARGIN_TABLE[margin_policy][qty_tier(quantity)]
        # qty_tier: SMALL if quantity<=2, MED if 3..6, BULK if >=7
        margined = round_half_up( line_base * margin_mult_bps / 10000 )
        finish_upcharge = round_half_up( margined * FINISH_BPS[finish_code] / 10000 )
        line_total = margined + finish_upcharge
        # clamp each priced line into [MIN_LINE_CENTS, MAX_LINE_CENTS]
        line_total = min(MAX_LINE_CENTS, max(MIN_LINE_CENTS, line_total))
        return line_total
      subtotal = sum over included specs of per_spec_priced(spec, active_finish_code)
      if is_rush (final variant only): subtotal += round_half_up(subtotal * Shop.rush_surcharge_bps / 10000)
      tax = round_half_up( subtotal * Shop.tax_rate_bps / 10000 )
      total = subtotal + tax
    input_set: |
      Estimate variant: all CabinetSpec rows (any lock_state), active finish if any
        (else FINISH_BPS[RAW]=0); rush surcharge NOT applied.
      Final variant: all CabinetSpec rows (now all LOCKED), active finish required;
        rush surcharge applied when Project.is_rush==true.
    constants:
      MARGIN_TABLE: "{ STANDARD: { SMALL: 13500, MED: 13000, BULK: 12500 }, PREMIUM: { SMALL: 16000, MED: 15500, BULK: 15000 } }"  # margin multiplier in bps
      FINISH_BPS: "{ RAW: 0, STAIN: 800, PAINT: 1200, LACQUER: 2000 }"  # finish upcharge in bps of margined line
      MIN_LINE_CENTS: 5000
      MAX_LINE_CENTS: 5000000
    precision: "round_half_up to whole cents at each pinned step: margined, finish_upcharge, rush, tax"
    variants:
      - name: estimate
        when: "Project measure/quote — writes estimate_total_cents"
        difference: "No rush surcharge; finish defaults to RAW (0 bps) until a FinishSelection is active; specs may be OPEN."
      - name: final
        when: "Project contract — writes contract_total_cents"
        difference: "Rush surcharge applied when is_rush; finish required; all specs LOCKED. For identical specs+finish, final >= estimate, strictly > when is_rush or finish chosen after estimate."

  - name: material_consumption
    trigger: "MaterialReservation create (provisional reserve); BuildJob COMPLETE (actual consume)"
    algorithm: forward_looking
    formula: |
      provisional_reserve(material, sheets):
        # forward-looking: bites against available = on_hand - reserved, may exceed
        # what is ultimately consumed if the build uses fewer sheets.
        reserved_sheets += sheets
        available_sheets = on_hand_sheets - reserved_sheets
      actual_consume(material):
        # chronological at COMPLETE: only COMMITTED reservations of the project are
        # consumed; on_hand decremented by their summed sheets; reserved drops too.
        consumed = sum(sheets of project's COMMITTED reservations)
        on_hand_sheets -= consumed
        reserved_sheets -= consumed
    input_set: "Provisional: the single new reservation. Actual: project's MaterialReservation rows with status==COMMITTED."
    constants: {}
    precision: "integer sheets"
    variants:
      - name: provisional
        when: "On reservation create — increases reserved_sheets, may over-reserve vs final build need"
        difference: "Reserves the requested sheets up front against available quota; HELD rows can later be RELEASED, returning the quota."
      - name: actual
        when: "On BuildJob COMPLETE — consumes only COMMITTED reservations"
        difference: "Permanently decrements on_hand_sheets; HELD (never committed) reservations are NOT consumed even though they held quota."

  - name: draw_amount
    trigger: "Draw creation (deposit cascade, progress request, retainage cascade)"
    algorithm: waterfall_allocation
    formula: |
      # Each draw fills against the contract, never letting cumulative billed
      # exceed contract_total. Buckets fill in order: deposit, progress, retainage.
      remaining_billable = Project.contract_total_cents - Project.billed_to_date_cents
      if draw_type == DEPOSIT:
        raw = round_half_up(contract_total_cents * Shop.deposit_pct_bps / 10000)
      elif draw_type == PROGRESS:
        raw = round_half_up(contract_total_cents * requested_pct_bps / 10000)
      elif draw_type == RETAINAGE:
        raw = round_half_up(contract_total_cents * Shop.retainage_pct_bps / 10000)
      amount_cents = min(raw, remaining_billable)   # waterfall cap: never over-bill
      if amount_cents < 0: amount_cents = 0
    input_set: "Project.contract_total_cents and billed_to_date_cents at draw-creation time, plus Shop pct constants."
    precision: "round_half_up to whole cents, then min-cap to remaining_billable"
    variants:
      - name: deposit
        when: "DEPOSIT draw created at contract lock"
        difference: "Uses deposit_pct_bps."
      - name: progress
        when: "PROGRESS draw created on demand or as change-order adjustment"
        difference: "Uses requested_pct_bps from the request body."
      - name: retainage
        when: "RETAINAGE draw created at install completion"
        difference: "Uses retainage_pct_bps; this draw clears the remaining_billable balance so cumulative billed equals contract_total."

  - name: draw_settlement
    trigger: "Draw pay (ISSUED -> PAID)"
    algorithm: threshold
    formula: |
      # Circular-looking dependency PINNED: settlement_total = amount + late_fee,
      # but late_fee is a tiered rate keyed on the lateness bucket, which is keyed
      # on amount_cents itself. Evaluation order is: (1) compute days_late from the
      # clock, (2) select tier rate, (3) late_fee = round_half_up(amount * rate),
      # (4) settlement_total = amount + late_fee.
      if due_utc is null OR Shop.current_utc <= due_utc:
        days_late = 0
      else:
        days_late = floor( (Shop.current_utc - due_utc) / 86400 seconds )   # whole days
      # tier selection (boundary >= matters):
      if days_late <= 0:    rate_bps = 0
      elif days_late <= 30: rate_bps = LATE_TIER1_BPS
      else:                 rate_bps = LATE_TIER2_BPS
      late_fee_cents = round_half_up( amount_cents * rate_bps / 10000 )
      settlement_total_cents = amount_cents + late_fee_cents
      # NOTE: paid_to_date_cents increases by amount_cents only (principal); the
      # late_fee is recorded on the Draw but NOT counted toward contract balance.
    input_set: "The single Draw being paid; Shop.current_utc as now()."
    constants:
      LATE_TIER1_BPS: 150   # 1.5% for 1..30 days late
      LATE_TIER2_BPS: 400   # 4.0% for >30 days late
    precision: "round_half_up to whole cents"

  - name: change_order_delta
    trigger: "ChangeOrder SUBMITTED / REVISING->SUBMITTED resubmit (delta recompute)"
    algorithm: forward_looking
    formula: |
      # Applies the SAME margin/finish/tax pipeline as contract_total to the signed
      # pre-margin spec_price_delta, using the project's CURRENT margin_policy and
      # active finish. Sign is preserved through every step (negative deltas reduce).
      margin_mult_bps = MARGIN_TABLE[Project.margin_policy][BULK]   # change-orders priced at BULK margin tier
      margined = round_half_up( spec_price_delta_cents * margin_mult_bps / 10000 )
      finish_upcharge = round_half_up( margined * FINISH_BPS[active_finish_code] / 10000 )
      line_delta = margined + finish_upcharge
      taxed = line_delta + round_half_up( line_delta * Shop.tax_rate_bps / 10000 )
      delta_cents = taxed
      # On APPROVE: contract_total_cents += delta_cents; deposit_required recomputed;
      # a PROGRESS adjustment Draw is created for max(0, delta_cents).
    input_set: "ChangeOrder.spec_price_delta_cents, Project.margin_policy, active FinishSelection.finish_code, Shop.tax_rate_bps."
    constants:
      MARGIN_TABLE: "{ STANDARD: { BULK: 12500 }, PREMIUM: { BULK: 15000 } }"  # mirror of contract_total BULK column
      FINISH_BPS: "{ RAW: 0, STAIN: 800, PAINT: 1200, LACQUER: 2000 }"
    precision: "round_half_up to whole cents at margined, finish_upcharge, tax; sign preserved"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For entity_backed roles acting on a resource (Customer paying/approving), X-User-ID must equal the resource's owning Customer.id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Customer-actor endpoints: contract, draw pay, change-order approve/reject/request-revision"

  - priority: 4
    category: existence
    check: "All path-referenced resources exist, validated left-to-right (shop, then project, then sub-resource)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 5
    category: business_constraint
    check: "Request body required fields present and well-typed (enums in range, positive dimensions/quantities, bps within declared bounds)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 7
    category: business_referential
    check: "FK targets resolve within the same shop (material_id, machine_id belong to the path shop; project belongs to path customer's shop)"
    error_id: ERR_CROSS_SHOP_REFERENCE
    http_status: 409
    applies_to: "spec create, reservation create, build-job create"

  - priority: 8
    category: business_safety
    check: "BuildJob machine must be ONLINE to start a job"
    error_id: ERR_MACHINE_OFFLINE
    http_status: 409
    applies_to: "build-job start"

  - priority: 9
    category: business_temporal
    check: "BuildJob interval [start_utc,end_utc) must not collide with another non-CANCELLED BuildJob on the same machine, INCLUDING the machine's changeover_buffer_min gap on either side"
    error_id: ERR_MACHINE_TIME_CONFLICT
    http_status: 409
    applies_to: "build-job create"

  - priority: 10
    category: business_temporal
    check: "Installation count for install_date must not exceed Shop.max_installs_per_day (aggregate daily capacity across the shop), counting non-CANCELLED installations"
    error_id: ERR_INSTALL_CAPACITY_FULL
    http_status: 409
    applies_to: "installation create"

  - priority: 11
    category: business_constraint
    check: "MaterialReservation sheets must be <= Material.available_sheets at create time (strict over-allocation rejected)"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "material-reservation create"

  - priority: 12
    category: business_fiscal
    check: "Project.paid_to_date_cents >= Project.deposit_required_cents before first BuildJob may move project to IN_PRODUCTION"
    error_id: ERR_DEPOSIT_UNPAID
    http_status: 409
    applies_to: "build-job create"

  - priority: 13
    category: business_fiscal
    check: "Customer.credit_hold must be false to issue a Draw or to contract a project"
    error_id: ERR_CUSTOMER_CREDIT_HOLD
    http_status: 409
    applies_to: "draw issue, project contract"

  - priority: 14
    category: business_fiscal
    check: "A Draw must have amount_cents > 0 to be issued"
    error_id: ERR_EMPTY_DRAW
    http_status: 409
    applies_to: "draw issue"

  - priority: 15
    category: business_constraint
    check: "Project mark-ready requires every BuildJob COMPLETE and no SUBMITTED/REVISING ChangeOrder"
    error_id: "ERR_BUILD_INCOMPLETE | ERR_CHANGE_OPEN"
    http_status: 409
    applies_to: "project mark-ready"

  - priority: 16
    category: business_constraint
    check: "Installation complete requires no OPEN MAJOR PunchItem; project close requires no OPEN PunchItem and full payment"
    error_id: "ERR_MAJOR_PUNCH_OPEN | ERR_PUNCH_OPEN | ERR_BALANCE_OUTSTANDING"
    http_status: 409
    applies_to: "installation complete, project close"

  - priority: 17
    category: business_constraint
    check: "OCC: expected_project_version must equal Project.version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "project contract, change-order submit, change-order approve"

# =============================================================================
# Response envelope (FIXED — verbatim per §1.0)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Shop / config ---
  - method: POST
    path: "/shops"
    description: "Create a shop"
    roles: [ShopAdmin]
    code: 201
    input: [name, "currency?", "tax_rate_bps?", "deposit_pct_bps?", "retainage_pct_bps?", "rush_surcharge_bps?", "max_installs_per_day?", "change_order_buffer_pct_bps?"]
    output: Shop
    side_effects: ["current_utc=null until set via clock endpoint"]

  - method: GET
    path: "/shops/{shopId}"
    description: "Get a shop"
    roles: [ShopAdmin, ShopManager, Designer, Installer, Customer]
    code: 200
    input: []
    output: Shop
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the shop test clock used as now()"
    roles: [ShopAdmin]
    code: 200
    input: [shop_id, to_iso8601]
    output: Shop
    side_effects: ["Sets Shop.current_utc"]

  - method: POST
    path: "/shops/{shopId}/materials"
    description: "Create a material SKU"
    roles: [ShopAdmin, ShopManager]
    code: 201
    input: [sku, sheet_area_mm2, sheet_price_cents]
    output: Material
    side_effects: ["on_hand_sheets=0, reserved_sheets=0, available_sheets=0"]

  - method: GET
    path: "/shops/{shopId}/materials/{materialId}"
    description: "Get a material (with computed reserved/available)"
    roles: [ShopAdmin, ShopManager, Designer]
    code: 200
    input: []
    output: Material
    side_effects: []

  - method: GET
    path: "/shops/{shopId}/materials"
    description: "List materials in a shop"
    roles: [ShopAdmin, ShopManager, Designer]
    code: 200
    input: ["limit?", "offset?"]
    output: Material[]
    side_effects: []

  - method: POST
    path: "/shops/{shopId}/materials/{materialId}/restock"
    description: "Add physical sheets to on-hand"
    roles: [ShopAdmin, ShopManager]
    code: 200
    input: [sheets]
    output: Material
    side_effects: ["on_hand_sheets += sheets; available_sheets recomputed"]

  - method: POST
    path: "/shops/{shopId}/machines"
    description: "Create a CNC/build machine"
    roles: [ShopAdmin, ShopManager]
    code: 201
    input: [name, "changeover_buffer_min?", "status?"]
    output: Machine
    side_effects: []

  - method: GET
    path: "/shops/{shopId}/machines/{machineId}"
    description: "Get a machine"
    roles: [ShopAdmin, ShopManager]
    code: 200
    input: []
    output: Machine
    side_effects: []

  - method: PATCH
    path: "/shops/{shopId}/machines/{machineId}"
    description: "Update machine status (ONLINE/OFFLINE)"
    roles: [ShopAdmin, ShopManager]
    code: 200
    input: [status]
    output: Machine
    side_effects: []

  # --- Customer ---
  - method: POST
    path: "/shops/{shopId}/customers"
    description: "Create a customer"
    roles: [ShopAdmin, ShopManager, Designer]
    code: 201
    input: [full_name, email]
    output: Customer
    side_effects: ["credit_hold=false, lifetime_paid_cents=0"]

  - method: GET
    path: "/shops/{shopId}/customers/{customerId}"
    description: "Get a customer"
    roles: [ShopAdmin, ShopManager, Designer, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: PATCH
    path: "/shops/{shopId}/customers/{customerId}"
    description: "Set/clear customer credit hold"
    roles: [ShopAdmin, ShopManager]
    code: 200
    input: [credit_hold]
    output: Customer
    side_effects: []

  - method: GET
    path: "/shops/{shopId}/customers"
    description: "List customers (filterable)"
    roles: [ShopAdmin, ShopManager, Designer]
    code: 200
    input: ["shop_id?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []

  # --- Project ---
  - method: POST
    path: "/shops/{shopId}/customers/{customerId}/projects"
    description: "Create a project (DRAFT)"
    roles: [ShopAdmin, ShopManager, Designer]
    code: 201
    input: [title, "is_rush?", "install_address?", "margin_policy?"]
    output: Project
    side_effects: ["status=DRAFT; ledger fields zeroed"]

  - method: GET
    path: "/shops/{shopId}/projects/{projectId}"
    description: "Get a project (with computed ledger fields)"
    roles: [ShopAdmin, ShopManager, Designer, Installer, Customer]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: GET
    path: "/shops/{shopId}/projects"
    description: "List projects (filter by customer)"
    roles: [ShopAdmin, ShopManager, Designer, Installer, Customer]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: Project[]
    side_effects: []

  - method: GET
    path: "/shops/{shopId}/customers/{customerId}/projects"
    description: "List a customer's projects (FK reverse-reachability for Project.customer_id)"
    roles: [ShopAdmin, ShopManager, Designer, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: Project[]
    side_effects: []

  - method: GET
    path: "/shops/{shopId}/projects/{projectId}/cut-list"
    description: "Computed read: per-material sheet requirements (cut_list_sheets)"
    roles: [ShopAdmin, ShopManager, Designer]
    code: 200
    input: []
    output: "{ materials: array, total_sheets: integer }"
    side_effects: []

  - method: POST
    path: "/shops/{shopId}/projects/{projectId}/measure"
    description: "DRAFT -> MEASURED; recompute estimate_total_cents"
    roles: [Designer, ShopManager, ShopAdmin]
    code: 200
    input: []
    output: Project
    side_effects: ["status=MEASURED; recompute estimate_total_cents"]

  - method: POST
    path: "/shops/{shopId}/projects/{projectId}/quote"
    description: "MEASURED -> QUOTED; finalize estimate with finish"
    roles: [Designer, ShopManager, ShopAdmin]
    code: 200
    input: []
    output: Project
    side_effects: ["status=QUOTED; recompute estimate_total_cents with active finish"]

  - method: POST
    path: "/shops/{shopId}/projects/{projectId}/revise"
    description: "QUOTED -> DRAFT (revision loop)"
    roles: [Designer, ShopManager, ShopAdmin]
    code: 200
    input: []
    output: Project
    side_effects: ["status=DRAFT; specs editable again"]

  - method: POST
    path: "/shops/{shopId}/projects/{projectId}/contract"
    description: "QUOTED -> CONTRACTED; lock specs, compute final total, create DEPOSIT draw"
    roles: [Customer]
    code: 200
    input: [expected_project_version]
    output: Project
    side_effects: ["lock specs; set contract_total_cents/deposit_required_cents; create DEPOSIT Draw PENDING; increments Project.version by 1"]

  - method: POST
    path: "/shops/{shopId}/projects/{projectId}/mark-ready"
    description: "IN_PRODUCTION -> READY_FOR_DELIVERY"
    roles: [ShopManager, ShopAdmin]
    code: 200
    input: []
    output: Project
    side_effects: ["status=READY_FOR_DELIVERY"]

  - method: POST
    path: "/shops/{shopId}/projects/{projectId}/close"
    description: "INSTALLED -> CLOSED"
    roles: [ShopManager, ShopAdmin]
    code: 200
    input: []
    output: Project
    side_effects: ["status=CLOSED; release HELD reservations"]

  - method: POST
    path: "/shops/{shopId}/projects/{projectId}/cancel"
    description: "Cancel project from any non-terminal pre-install state"
    roles: [ShopManager, ShopAdmin]
    code: 200
    input: []
    output: Project
    side_effects: ["status=CANCELLED; release non-terminal reservations; void open draws (CONTRACTED only)"]

  # --- CabinetSpec ---
  - method: POST
    path: "/shops/{shopId}/projects/{projectId}/specs"
    description: "Add a cabinet spec (only while specs OPEN)"
    roles: [Designer, ShopManager, ShopAdmin]
    code: 201
    input: [label, width_mm, height_mm, depth_mm, quantity, base_unit_price_cents, material_id]
