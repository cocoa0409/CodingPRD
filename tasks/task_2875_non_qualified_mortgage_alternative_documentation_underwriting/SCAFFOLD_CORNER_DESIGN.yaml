      - name: corner_cascading_side_effects_four_level_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - state_machines.AuditFinding
          - state_machines.PostCloseAudit
          - state_machines.SecuritizationPool
        excluded_because:
          difficulty_instance: transitive_cascade / audit_material_defect_cascade_to_pool_rebalance
          rationale: "The named 1.8 instance drives the whole four-hop chain end to end - finding UPHELD, audit MATERIAL_DEFECT, loan file CLOSED to AUDIT_DEFECT with repurchase_flag, pool OPEN to REBALANCING with all three metrics recomputed - and asserts every hop's fields at each level, including that the detached loan leaves the member set entirely."
      - name: corner_dual_variant_calculation_expense_factor_and_rent
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.bank_statement_income
          - calculations.dscr_ratio
        excluded_because:
          difficulty_instance: dual_variant_calc / bank_statement_expense_factor_variant_divergence
          rationale: "The named 1.8 instance runs the same twelve deposits through the FIXED_FACTOR and CPA_LETTER variants and asserts the divergent monthly incomes plus the floor that clamps an aggressive CPA factor; its sibling instance does the same for the lease-in-place versus market-rent DSCR variants, so both dual-variant calculations are covered with their deltas."
      - name: corner_rate_threshold_triggers_hpml_and_hoepa_boundaries
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers.rate_threshold_triggers
          - calculations.points_and_fees_test
          - calculations.atr_determination
        excluded_because:
          difficulty_instance: boundary_precision_check / hoepa_tier_boundary_and_exact_cap_equality_at_one_cent
          rationale: "The named 1.8 instance sits the total loan amount exactly on the tier boundary and the included points and fees exactly on the resulting cap, then moves a single cent to flip PASS to FAIL; the rate-spread side of the layer is asserted in the same instance through the lien-position-dependent higher-priced threshold, so both the cumulative and the instantaneous threshold boundaries are tested."
      - name: corner_version_pinning_on_approval_voids_stale_waiver
        claim_type: version_pinning_on_approval
        grounds:
          - complexity_profile.complexity_layers.version_pinning_on_approval
          - entities.ExceptionRequest.fields.pinned_metric_value
          - entities.ExceptionRequest.fields.pinned_overlay_version
          - state_machines.ExceptionRequest
        excluded_because:
          difficulty_instance: transitive_cascade / second_valuation_acceptance_cascade_to_exception_void
          rationale: "The named 1.8 instance approves a waiver against a pinned LTV, then accepts a second appraisal that moves reconciled_value_cents and therefore the pinned metric, and asserts that the APPROVED exception auto-voids with decision_reason PINNED_METRIC_CHANGED, the breach returns to unresolved_overlay_breach_count and the loan file cascades to SUSPENDED."

  - section: consistency_model
    instances:
      - name: corner_immediate_consistency_worksheet_accept_publishes_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.asset_depletion_income
          - entities.LoanFile.fields.qualifying_income_monthly_cents
          - entities.LoanFile.fields.dti_pct
          - entities.LoanFile.fields.residual_income_cents
          - entities.LoanFile.fields.documented_reserves_months
        distinguishing_aspect: "The accept response is itself already final - monthly_qualifying_income_cents 647041 appears in the accept call's own body - and the very next read of the parent loan file, with no delay and no second write, already shows qualifying_income_monthly_cents 647041, dti_pct 56.37, residual_income_cents 282277 and documented_reserves_months 14.56. An eventually-consistent implementation that recomputes the parent on a later read or a background pass fails the immediate read."
