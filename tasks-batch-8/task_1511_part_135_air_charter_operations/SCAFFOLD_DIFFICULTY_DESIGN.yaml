      - name: crew_rest_minimum_gap_violation
        grounds:
          - calculations.crew_duty_legality
          - entities.CrewAssignment.fields.rest_legal
        distinguishing_aspect: |
          Resource CrewMember with minimum-gap semantics (different resource
