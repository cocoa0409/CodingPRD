          A different priority pair on a different endpoint: business_referential
          (priority 90, waiver never signed -> liability_waiver_status MISSING)
          beats business_fiscal (priority 100, BILLING_HOLD) on
          POST /loaner-assignments, so the response is
          ERR_LIABILITY_WAIVER_MISSING / 409. Category-disjoint from the
          state-vs-fiscal pair above, and the loser error is the same id in both
          instances, which pins the ordering rather than the error catalog.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z"
            - "one CustomerAccount that never signed a waiver (liability_waiver_status MISSING) and is on BILLING_HOLD"
            - "one AVAILABLE LoanerUnit of the requested ModelSpec with certification_valid_until 2026-12-31"
          setup_api_calls:
            - *c_clock
            - *c_model
            - *c_acct
            - call: "POST /customer-accounts/${acct_id}/billing-hold"
              payload: { hold: true, reason: "unpaid invoice 8841" }
              as: PlantManager
            - call: "POST /loaner-units"
              payload: { model_spec_id: "${model_id}", asset_tag: "LN-001", condition_grade: "A", certification_valid_until: "2026-12-31T00:00:00Z" }
              as: PlantManager
              captures: { loaner_id: $.data.id }
          trigger:
            - call: "POST /loaner-assignments"
              payload: { customer_account_id: "${acct_id}", requested_model_spec_id: "${model_id}", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-12T00:00:00Z" }
              as: IntakeClerk
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response error_id == ERR_LIABILITY_WAIVER_MISSING"
            - "response error_id != ERR_ACCOUNT_ON_HOLD"
            - "GET /loaner-assignments?customer_account_id=${acct_id} returns 0 records"
            - "LoanerUnit.${loaner_id}.status == AVAILABLE"
            - "LoanerUnit.${loaner_id}.assignment_count == 0"
            - "CustomerAccount.${acct_id}.liability_waiver_status == MISSING"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: severity_index_exactly_at_pass_limit_is_inclusive_pass
        grounds:
          - calculations.shell_test_severity_index
          - entities.ModelSpec.fields.pass_si_max
          - entities.ShellTest.fields.computed_result
          - validations.v-request-schema
        distinguishing_aspect: |
          Off-by-one on an inclusive comparison: unit A's 300/300/300 gives
          severity_index exactly 300.0 == pass_si_max, which must classify PASS
          (<=, not <), while unit B's 300/300/310 gives 302.0 and must classify
          REPAIR. Two units on the same bench isolate the comparison operator:
          a strict `<` implementation flips only unit A.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z"
            - "ModelSpec SF-2026 with pass_si_max 300.0 and repair_si_max 360.0"
            - "two units of that model in INSPECTED, each with a SCHEDULED AMBIENT shell test on the same calibrated bench in non-conflicting windows"
          setup_api_calls:
            - *c_clock
            - *c_model
            - *c_acct
            - *c_waiver
            - call: "POST /intake-shipments"
              payload: { customer_account_id: "${acct_id}", sport: "FOOTBALL", service_tier: "STANDARD", declared_unit_count: 2, season_start_date: "2026-08-25T00:00:00Z", season_end_date: "2026-11-20T00:00:00Z" }
