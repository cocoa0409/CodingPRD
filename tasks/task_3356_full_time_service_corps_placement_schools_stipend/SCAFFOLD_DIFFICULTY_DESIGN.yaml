            - "${svc4} == ACTIVE and ${sti4} == ACTIVE (service resume restores the stipend dimension)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: school_termination_depth3_cascade
        grounds:
          - state_machines.School.agreement_status.ACTIVE_to_TERMINATED
          - state_machines.Team.status.DEPLOYED_to_DISSOLVED
          - state_machines.TeamAssignment.fields.status
          - state_machines.StipendPayment.status
        distinguishing_aspect: |
          Depth-3 chain from the school-termination trigger: TERMINATED school
          dissolves its team (link 1); the dissolved team ends its ACTIVE
          assignment (link 2); the member losing their last ACTIVE assignment
          is stipend-suspended and their SCHEDULED payment is forfeited
          (link 3) — each link caused by the previous, not by the original call.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Full world: site ACTIVE, school ACTIVE, Team Alpha DEPLOYED with the member's ACTIVE assignment, and one SCHEDULED stipend payment (period 2026-09-01..2026-09-14) created by sa-1."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_site_on
            - *k_school
            - *k_ds_sign
            - *k_agr_sign
            - *k_agr_active
            - &k_team
              call: "POST /corps/teams"
              payload: { school_id: "${school_id}", name: "Team Alpha", backfill_deadline: "2027-01-15", backfill_limit: 2 }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { team_id: $.data.id, team_v: $.data.version }
            - *k_app
            - *k_screen
            - *k_interview
            - *k_offer
            - *k_accept
            - *k_enroll
            - *k_activate
            - &k_assign
              call: "POST /corps/teams/${team_id}/assignments"
              payload: { corps_member_id: "${member_id}", start_date: "2026-09-01", expected_team_version: "${team_v}" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { asg_id: $.data.id }
            - &k_deploy
              call: "POST /corps/teams/${team_id}/state"
              payload: { to_status: "DEPLOYED" }
              as: SiteDirector
              as_user_id: "sd-1"
            - call: "POST /corps/members/${member_id}/stipend-payments"
              payload: { period_start: "2026-09-01", period_end: "2026-09-14" }
              as: StipendAdministrator
              as_user_id: "sa-1"
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /corps/schools/${school_id}/state"
              payload: { to_status: "TERMINATED", dimension: "AGREEMENT" }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { sch_st: $.data.agreement_status }
            - call: "GET /corps/teams/${team_id}"
              payload: {}
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { team_st: $.data.status, team_cnt: $.data.active_assignment_count }
            - call: "GET /corps/teams/${team_id}/assignments"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { asg_st: "$.data[0].status", asg_end: "$.data[0].end_date" }
            - call: "GET /corps/members/${member_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { m_stip: $.data.stipend_status, m_assigns: $.data.active_assignment_count }
            - call: "GET /corps/members/${member_id}/stipend-payments"
              payload: {}
              as: StipendAdministrator
              as_user_id: "sa-1"
              captures: { pay_st: "$.data[0].status", pay_reason: "$.data[0].decision_reason" }
          assert:
            - "${sch_st} == TERMINATED"
            - "${team_st} == DISSOLVED and ${team_cnt} == 0 (link 1: school -> team)"
            - "${asg_st} == ENDED and ${asg_end} == 2026-09-01 (link 2: team dissolution -> assignment ended at clock date)"
            - "${m_assigns} == 0 and ${m_stip} == SUSPENDED (link 3: last ACTIVE assignment ending stipend-suspends the still-ACTIVE member)"
            - "${pay_st} == FORFEITED and ${pay_reason} == TEAM_DISSOLVED (link 3: SCHEDULED payment forfeited by the same cascade)"

      - name: member_exit_depth2_understaffed_cascade
        grounds:
          - state_machines.CorpsMember.service_status.ACTIVE_to_EXITED_EARLY
          - state_machines.Team.status.DEPLOYED_to_UNDERSTAFFED
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (member exit, not school
          termination): exit ends the assignment (link 1); the ended assignment
          drops the DEPLOYED team below min staffing and auto-flips it to
          UNDERSTAFFED (link 2) — the team transition is caused by the
          assignment ending, never by the exit call directly.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Full world with Team Alpha (team_size 3, min_active_members 1) DEPLOYED on exactly one ACTIVE assignment."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_site_on
            - *k_school
            - *k_ds_sign
            - *k_agr_sign
            - *k_agr_active
            - *k_team
            - *k_app
            - *k_screen
            - *k_interview
            - *k_offer
            - *k_accept
            - *k_enroll
            - *k_activate
            - *k_assign
            - *k_deploy
            - call: "GET /corps/members/${member_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { m_v: $.data.version }
          trigger:
            - call: "POST /corps/members/${member_id}/exit"
              payload: { expected_member_version: "${m_v}", exit_type: "NON_COMPELLING" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { svc_st: $.data.service_status, award_st: $.data.award_status, sti_st: $.data.stipend_status }
            - call: "GET /corps/teams/${team_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { team_st: $.data.status, team_cnt: $.data.active_assignment_count }
            - call: "GET /corps/teams/${team_id}/assignments"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { asg_st: "$.data[0].status", asg_end: "$.data[0].end_date" }
          assert:
            - "${svc_st} == EXITED_EARLY and ${award_st} == FORFEITED and ${sti_st} == ENDED"
            - "${asg_st} == ENDED and ${asg_end} == 2026-09-01 (link 1: exit ends the assignment at the exit/clock date)"
            - "${team_st} == UNDERSTAFFED and ${team_cnt} == 0 (link 2: 0 < min_active_members 1 auto-demotes the DEPLOYED team; nothing set the team state directly)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_beats_fiscal_on_stipend_pay
        grounds:
          - validations[priority=8]
          - validations[priority=31]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SITE_FUNDING_DEFICIT]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: the payment is in the
          wrong state for PAID (SCHEDULED, never approved) AND the site is in
          DEFICIT (no funding; headroom = 0 - 0 - 1300000 obligations = -1300000).
          The state-category error must win over the fiscal-category error.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Site ACTIVE with NO funding received. Member ACTIVE (stipend ACTIVE -> projected_obligations 1300000 -> funding_headroom -1300000 -> DEFICIT). One SCHEDULED payment exists (period 2026-09-01..2026-09-14)."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_site_on
            - *k_app
            - *k_screen
            - *k_interview
            - *k_offer
            - *k_accept
            - *k_enroll
            - *k_activate
            - call: "GET /corps/sites/${site_id}"
              payload: {}
              as: StipendAdministrator
              as_user_id: "sa-1"
              captures: { site_posture: $.data.funding_posture }
            - call: "POST /corps/members/${member_id}/stipend-payments"
              payload: { period_start: "2026-09-01", period_end: "2026-09-14" }
              as: StipendAdministrator
              as_user_id: "sa-1"
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /corps/stipend-payments/${pay_id}/state"
              payload: { to_status: "PAID" }
              as: StipendAdministrator
              as_user_id: "sa-2"
              captures: { pay_err: $.data.error_id }
          assert:
            - "${site_posture} == DEFICIT (fiscal precondition would fail too)"
            - "${pay_err} == ERR_INVALID_STATE (state priority 8 beats business_fiscal priority 31; NOT ERR_SITE_FUNDING_DEFICIT)"
            - "GET of the payment list still shows status SCHEDULED (rejection mutated nothing)"

      - name: temporal_beats_constraint_on_hour_verify
        grounds:
          - validations[priority=13]
          - validations[priority=21]
          - errors[ERR_VERIFICATION_WINDOW_EXPIRED]
          - errors[ERR_DAILY_HOUR_CAP_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair business_temporal vs business_constraint: the
          candidate entry is BOTH 31 days past its service_date (window
          expired) and a daily-cap breach (12.0 already verified that day +
          0.25 candidate > 12.0). The temporal error must win.
        test_recipe:
          setup:
            - "Clock starts 2026-09-01T00:00:00Z. Member ACTIVE. Entry A: 12.0 DIRECT_SERVICE on 2026-09-01, verified while the clock is still 2026-09-01. Entry B: 0.25 DIRECT_SERVICE on 2026-09-01, created (PENDING) on 2026-09-01. Clock then advanced to 2026-10-02T00:00:00Z (31 days after the service date)."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_site_on
            - *k_app
            - *k_screen
            - *k_interview
            - *k_offer
            - *k_accept
            - *k_enroll
            - *k_activate
            - call: "POST /corps/hour-entries"
              payload: { corps_member_id: "${member_id}", service_date: "2026-09-01", hours: 12.0, category: "DIRECT_SERVICE" }
              as: CorpsMember
              as_user_id: "${member_id}"
              captures: { ea: $.data.id }
            - call: "POST /corps/hour-entries/${ea}/review"
              payload: { decision: "VERIFY" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /corps/hour-entries"
              payload: { corps_member_id: "${member_id}", service_date: "2026-09-01", hours: 0.25, category: "DIRECT_SERVICE" }
              as: CorpsMember
              as_user_id: "${member_id}"
              captures: { eb: $.data.id }
            - call: "POST /corps/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: SiteDirector
              as_user_id: "sd-1"
          trigger:
            - call: "POST /corps/hour-entries/${eb}/review"
              payload: { decision: "VERIFY" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { dual_err: $.data.error_id }
          assert:
            - "${dual_err} == ERR_VERIFICATION_WINDOW_EXPIRED (temporal priority 13 beats constraint priority 21; NOT ERR_DAILY_HOUR_CAP_EXCEEDED even though 12.0 + 0.25 > 12.0)"
            - "Entry ${eb} remains PENDING"

