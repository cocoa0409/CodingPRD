  - rule_id: resource_temporal_overlap
    instances:

      - name: vehicle_transfer_windows_half_open_adjacency_allowed
        grounds:
          - validations[priority 17 ERR_VEHICLE_TRANSFER_OVERLAP]
          - entities.RedistributionOrder.fields.planned_depart_at
          - entities.RedistributionOrder.fields.planned_receive_at
          - endpoints[POST /fleet/redistribution-orders]
        distinguishing_aspect: |
          The contended resource is the VEHICLE's own calendar and the interval is
          HALF-OPEN: [planned_depart_at, planned_receive_at). Touching endpoints are
          therefore legal, so a window starting exactly when another ends is accepted
          while a window starting one day earlier is a 409. The scope is also restricted
          to non-terminal orders, so cancelling the incumbent frees its slot.
