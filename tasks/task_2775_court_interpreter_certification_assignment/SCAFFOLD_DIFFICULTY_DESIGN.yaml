      - name: hearing_continuance_cascades_into_late_cancellation_pay_and_pending_ledger
        grounds:
          - state_machines.Hearing.COVERED_to_CONTINUED
          - state_machines.Assignment.CONFIRMED_to_CANCELLED
          - state_machines.PayClaim.ENCUMBERED_to_FINALIZED
          - calculations.assignment_pay
          - calculations.courthouse_encumbrance_ledger
          - entities.PayClaim.fields.late_cancellation
          - entities.Interpreter.fields.pending_pay_cents
        distinguishing_aspect: |
          A continuance 33 hours before the hearing (inside the 48-hour
          late_cancellation_hours threshold) cascades Hearing -> CONTINUED ->
          Assignment CANCELLED -> PayClaim recomputed on the LATE_CANCELLATION
          variant, so the claim FINALIZES at 17500 instead of being VOIDED, and the
          courthouse's 35000-cent encumbrance is replaced by a 17500-cent obligation
          that also lands in Interpreter.pending_pay_cents.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Language spa; courthouse CH_MAIN; rate schedule effective 2026-01-01 with late_cancellation_hours 48 and late_cancellation_pay_hours 2.0."
            - "Interpreter Ana Reyes ACTIVE with an ACTIVE CERTIFIED spa credential."
            - "Hearing H4 at CH_MAIN 2026-08-02T09:00-13:00Z, spa, TRIAL, in custody; lead_time_days 1, priority_score 83, priority_class A."
            - "Assignment A4 for Ana with estimated_one_way_miles 12.0 (inside the 30-mile free radius), CONFIRMED with an ENCUMBERED PayClaim of 35000 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /languages"
              payload: { code: "spa", name: "Spanish", tier_class: "DESIGNATED", oral_exam_available: true, telephonic_vendor_available: false }
              as: ProgramAdmin
              captures: { lang_spa: "$.data.id" }
            - call: "POST /courthouses"
              payload: { name: "Capitol Main Courthouse", county_code: "CAS", courtroom_count: 12, remote_equipment_tier: "CERTIFIED_VRI", vri_concurrent_capacity: 1, pay_budget_cents: 5000000, status: "OPEN" }
              as: ProgramAdmin
