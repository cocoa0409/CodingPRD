      - call: POST /chargemaster/departments
        payload:
          facility_id: ${fac_id}
          name: Cardiac Cath Lab
          cost_center_code: CC-4100
          manager_user_id: dept_mgr_1
          allowed_revenue_code_values: []
        as: SystemAdmin
        as_user_id: sysadmin_1
        captures:
          dept_id: $.data.id
      - call: POST /chargemaster/charge-capture-batches
        payload:
          facility_id: ${fac_id}
          department_id: ${dept_id}
          window_start_date: '2026-08-03T00:00:00Z'
          window_end_date: '2026-08-07T00:00:00Z'
        as: DepartmentManager
        as_user_id: dept_mgr_1
        captures:
          b1_id: $.data.id
      - call: POST /chargemaster/charge-capture-batches
        payload:
          facility_id: ${fac_id}
          department_id: ${dept_id}
          window_start_date: '2026-08-05T00:00:00Z'
          window_end_date: '2026-08-10T00:00:00Z'
        as: DepartmentManager
        as_user_id: dept_mgr_1
        captures:
          b2_id: $.data.id
      trigger:
      - call: POST /chargemaster/charge-capture-batches
        payload:
          facility_id: ${fac_id}
          department_id: ${dept_id}
          window_start_date: '2026-08-07T00:00:00Z'
          window_end_date: '2026-08-08T00:00:00Z'
        as: DepartmentManager
        as_user_id: dept_mgr_1
      - call: POST /chargemaster/charge-capture-batches
        payload:
          facility_id: ${fac_id}
          department_id: ${dept_id}
          window_start_date: '2026-08-08T00:00:00Z'
          window_end_date: '2026-08-12T00:00:00Z'
        as: DepartmentManager
        as_user_id: dept_mgr_1
        captures:
          b4_id: $.data.id
      assert:
      - trigger step 1 response.http_status == 409
      - trigger step 1 response.error.error_id == ERR_BATCH_WINDOW_CAPACITY_EXCEEDED
      - trigger step 2 response.http_status == 201 (2026-08-08 is covered only by B2, so the new batch takes that day to multiplicity 2, which is still within capacity)
      - ChargeCaptureBatch.${b4_id}.status == INGESTED
      - ChargeCaptureBatch.${b4_id}.window_start_date == 2026-08-08T00:00:00Z
      - ChargeCaptureBatch.${b1_id}.status == INGESTED
      - ChargeCaptureBatch.${b2_id}.status == INGESTED
      - GET /chargemaster/charge-capture-batches?department_id=${dept_id} returns exactly 3 rows
- rule_id: compensating_invariant
  instances:
  - name: compensating_invariant__department_leakage_money_conserved_across_confirm_then_resolve
    grounds:
    - state_machines.MissingChargeFinding.OPEN_to_CONFIRMED
    - state_machines.MissingChargeFinding.CONFIRMED_to_RESOLVED
    - entities.Department.fields.unresolved_finding_amount_cents
    - entities.Department.fields.recovered_charge_cents
    - entities.Department.fields.capture_hold
    - entities.MissingChargeFinding.fields.estimated_lost_charge_cents
    - calculations.missing_charge_detection
    - calculations.charge_capture_variance_summary
    - validations[priority=31]
    distinguishing_aspect: 'The conserved quantity is the Department''s leakage MONEY total

      Q = Department.unresolved_finding_amount_cents + Department.recovered_charge_cents, which

      must equal 512000 both immediately after the two CONFIRM forward actions and after the

      two compensating RESOLVE actions have moved every cent from unresolved to recovered, and

      the derived capture_hold flag must therefore return from true to false.

      '
    test_recipe:
      setup:
      - Logical clock pinned at 2026-08-01T00:00:00Z.
      - Facility with rounding_mode NEAREST_CENT and aggregate_markup_limit_bp 40000; one department managed by dept_mgr_1; one ACTIVE revenue code 0300.
      - One open-ended PriceRule (COST_PLUS_MARKUP, tiers 0/32000, 50000/24000, 250000/18000, min_medicare_multiple_bp 10000, market_cap_multiple_bp 20000).
      - Companion item C (cdm CDM-2002, cost_basis 40000) repriced to gross_charge_cents 128000 and ACTIVE.
      - Trigger item T (cdm CDM-1001, cost_basis 100000, companion_required_item_id = C, companion_window_hours 24) repriced to gross_charge_cents 240000 and ACTIVE.
      - 'One INGESTED capture batch over closed window [2026-08-03T00:00:00Z, 2026-08-10T23:59:59Z] with four lines: for each of encounters ENC-1 and ENC-2 a T line (quantity 2, posted 480000) and a C line
        posted 48 hours later (quantity 2, posted 256000) — outside the 24-hour companion window, so both T lines are unpaired.'
      - One reconcile pass therefore leaves the batch RECONCILING with two OPEN MissingChargeFinding rows, each with estimated_lost_charge_cents == 256000.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemAdmin
        as_user_id: sysadmin_1
      - call: POST /chargemaster/facilities
        payload:
          name: St Vitus Medical Center
          cms_certification_number: CCN-2193-LEAKAGE
          rounding_mode: NEAREST_CENT
          aggregate_markup_limit_bp: 40000
        as: SystemAdmin
        as_user_id: sysadmin_1
        captures:
          fac_id: $.data.id
      - call: POST /chargemaster/revenue-codes
        payload:
          code: '0300'
          description: Laboratory - general
          requires_hcpcs: false
          allowed_code_types:
          - CPT
          - HCPCS
          - REV_ONLY
          - CDM_INTERNAL
          pricing_class: PROCEDURE
          status: ACTIVE
        as: SystemAdmin
        as_user_id: sysadmin_1
        captures:
          rc_id: $.data.id
      - call: POST /chargemaster/departments
        payload:
          facility_id: ${fac_id}
          name: Cardiac Cath Lab
          cost_center_code: CC-4100
          manager_user_id: dept_mgr_1
          allowed_revenue_code_values: []
        as: SystemAdmin
        as_user_id: sysadmin_1
        captures:
          dept_id: $.data.id
      - call: POST /chargemaster/price-rules
        payload:
          facility_id: ${fac_id}
          revenue_code_id: ${rc_id}
          pricing_method: COST_PLUS_MARKUP
          markup_tiers:
          - min_cost_basis_cents: 0
            markup_bp: 32000
          - min_cost_basis_cents: 50000
            markup_bp: 24000
          - min_cost_basis_cents: 250000
            markup_bp: 18000
          min_medicare_multiple_bp: 10000
          market_cap_multiple_bp: 20000
          effective_from: '2026-08-01T00:00:00Z'
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
        captures:
          pr_id: $.data.id
      - call: POST /chargemaster/charge-items
        payload:
          facility_id: ${fac_id}
          department_id: ${dept_id}
          revenue_code_id: ${rc_id}
          cdm_number: CDM-2002
          description: Cardiac catheter sheath kit
          code_type: CDM_INTERNAL
          cost_basis_cents: 40000
          medicare_rate_cents: 20000
          market_p75_cents: 300000
          effective_from: '2026-08-01T00:00:00Z'
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
        captures:
          item_c_id: $.data.id
      - call: POST /chargemaster/charge-items/${item_c_id}/reprice
        payload: {}
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
      - call: POST /chargemaster/charge-items/${item_c_id}/lifecycle
        payload:
          action: SUBMIT_FOR_REVIEW
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
      - call: POST /chargemaster/charge-items/${item_c_id}/lifecycle
        payload:
          action: APPROVE
        as: PricingCommitteeApprover
        as_user_id: approver_1
      - call: POST /chargemaster/charge-items/${item_c_id}/lifecycle
        payload:
          action: ACTIVATE
        as: PricingCommitteeApprover
        as_user_id: approver_1
      - call: POST /chargemaster/charge-items
        payload:
          facility_id: ${fac_id}
          department_id: ${dept_id}
          revenue_code_id: ${rc_id}
          cdm_number: CDM-1001
          description: Left heart catheterization procedure
          code_type: CDM_INTERNAL
          cost_basis_cents: 100000
          medicare_rate_cents: 50000
          market_p75_cents: 500000
          effective_from: '2026-08-01T00:00:00Z'
          companion_required_item_id: ${item_c_id}
          companion_window_hours: 24
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
        captures:
          item_t_id: $.data.id
      - call: POST /chargemaster/charge-items/${item_t_id}/reprice
        payload: {}
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
      - call: POST /chargemaster/charge-items/${item_t_id}/lifecycle
        payload:
          action: SUBMIT_FOR_REVIEW
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
      - call: POST /chargemaster/charge-items/${item_t_id}/lifecycle
        payload:
          action: APPROVE
        as: PricingCommitteeApprover
        as_user_id: approver_1
      - call: POST /chargemaster/charge-items/${item_t_id}/lifecycle
        payload:
          action: ACTIVATE
        as: PricingCommitteeApprover
        as_user_id: approver_1
      - call: POST /chargemaster/charge-capture-batches
        payload:
          facility_id: ${fac_id}
          department_id: ${dept_id}
          window_start_date: '2026-08-03T00:00:00Z'
          window_end_date: '2026-08-10T23:59:59Z'
        as: DepartmentManager
        as_user_id: dept_mgr_1
        captures:
          batch_id: $.data.id
      - call: POST /chargemaster/charge-capture-batches/${batch_id}/lines
        payload:
          submitted_cdm_number: CDM-1001
