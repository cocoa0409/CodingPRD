  - { method: GET, path: "/identity-protection/tax-returns/{id}/dependent-claims", description: " List a return's dependent claims", roles: [Taxpayer, TaxPreparer, FraudAnalyst, SystemAdmin], code: 200, input: ["limit?", "offset?"], output: " DependentClaim[]", side_effects: [] }
