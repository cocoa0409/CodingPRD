            - { call: "POST /api/members", payload: { full_name: "M Two", email: "m2.ce2@x.com" }, as: CircleAdmin, captures: { m2_id: $.data.id } }
            - { call: "POST /api/memberships", payload: { member_id: "${m1_id}", circle_id: "${circle_id}", tier: "STANDARD" }, as: CircleAdmin, captures: { ms1_id: $.data.id } }
            - { call: "POST /api/memberships", payload: { member_id: "${m2_id}", circle_id: "${circle_id}", tier: "STANDARD" }, as: CircleAdmin, captures: { ms2_id: $.data.id } }
            - { call: "POST /api/memberships/${ms1_id}/accept", payload: {}, as: Member, as_user_id: "${m1_id}" }
            - { call: "POST /api/memberships/${ms2_id}/accept", payload: {}, as: Member, as_user_id: "${m2_id}" }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin }
            - { call: "POST /api/contributions", payload: { cycle_id: "${cycle_id}", membership_id: "${ms1_id}", amount_cents: 100000 }, as: Member, as_user_id: "${m1_id}", captures: { c1_id: $.data.id } }
            - { call: "POST /api/contributions/${c1_id}/receive", payload: {}, as: CircleAdmin }
            - { call: "POST /api/contributions", payload: { cycle_id: "${cycle_id}", membership_id: "${ms2_id}", amount_cents: 100000 }, as: Member, as_user_id: "${m2_id}", captures: { c2_id: $.data.id } }
            - { call: "GET /api/cycles/${cycle_id}", as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin }
          trigger:
            - { call: "POST /api/contributions/${c2_id}/receive", payload: {}, as: CircleAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CYCLE_PHASE (409)"
            - "Contribution.${c2_id}.status == PLEDGED (unchanged)"
            - "GivingCycle.${cycle_id}.received_total_cents == 100000 (unchanged)"
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: site_visit_halfopen_adjacency
        grounds:
          - validations[priority=13]
          - errors[ERR_SITE_VISIT_OVERLAP]
          - entities.SiteVisit.fields.starts_at
        distinguishing_aspect: |
          Interval semantics: half-open [start, end) on the nonprofit resource
          — a visit starting exactly when another ends (11:00 == 11:00) is
          accepted, while a 10:30-11:30 visit straddling the boundary is
          rejected with ERR_SITE_VISIT_OVERLAP.
        test_recipe:
          setup:
            - "Cycle in VETTING; nomination N1 in VETTING; visit A already SCHEDULED 2026-06-10T10:00-11:00Z for N1's nonprofit"
          setup_api_calls:
            - { call: "POST /api/circles", payload: { name: "Circle TO1", admin_fee_percent: 5, quorum_percent: 50, standard_minimum_cents: 100000, leader_minimum_cents: 250000, operating_reserve_cents: 0, vetting_profile: "BALANCED" }, as: CircleAdmin, captures: { circle_id: $.data.id } }
            - { call: "POST /api/cycles", payload: { circle_id: "${circle_id}", year_label: "2026" }, as: CircleAdmin, captures: { cycle_id: $.data.id, cycle_v: $.data.version } }
            - { call: "POST /api/members", payload: { full_name: "M One", email: "m1.to1@x.com" }, as: CircleAdmin, captures: { m1_id: $.data.id } }
            - { call: "POST /api/memberships", payload: { member_id: "${m1_id}", circle_id: "${circle_id}", tier: "STANDARD" }, as: CircleAdmin, captures: { ms1_id: $.data.id } }
            - { call: "POST /api/memberships/${ms1_id}/accept", payload: {}, as: Member, as_user_id: "${m1_id}" }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin }
            - { call: "POST /api/contributions", payload: { cycle_id: "${cycle_id}", membership_id: "${ms1_id}", amount_cents: 100000 }, as: Member, as_user_id: "${m1_id}", captures: { c1_id: $.data.id } }
            - { call: "POST /api/contributions/${c1_id}/receive", payload: {}, as: CircleAdmin }
            - { call: "GET /api/cycles/${cycle_id}", as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin }
            - { call: "POST /api/nonprofits", payload: { ein: "99-0000031", legal_name: "NP Visit", mission_category: "arts" }, as: CircleAdmin, captures: { np1_id: $.data.id } }
            - { call: "POST /api/nominations", payload: { cycle_id: "${cycle_id}", nonprofit_id: "${np1_id}", statement: "s" }, as: Member, as_user_id: "${m1_id}", captures: { n1_id: $.data.id } }
            - { call: "GET /api/cycles/${cycle_id}", as: CircleAdmin, captures: { cycle_v: $.data.version } }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin }
            - { call: "POST /api/nominations/${n1_id}/start-vetting", payload: {}, as: CircleAdmin }
            - { call: "POST /api/site-visits", payload: { nomination_id: "${n1_id}", starts_at: "2026-06-10T10:00:00Z", ends_at: "2026-06-10T11:00:00Z" }, as: CircleAdmin, captures: { va_id: $.data.id } }
          trigger:
            - { call: "POST /api/site-visits", payload: { nomination_id: "${n1_id}", starts_at: "2026-06-10T11:00:00Z", ends_at: "2026-06-10T12:00:00Z" }, as: CircleAdmin, captures: { vb_id: $.data.id } }
            - { call: "POST /api/site-visits", payload: { nomination_id: "${n1_id}", starts_at: "2026-06-10T10:30:00Z", ends_at: "2026-06-10T11:30:00Z" }, as: CircleAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Adjacent visit (11:00 start == 11:00 end) accepted: SiteVisit.${vb_id}.status == SCHEDULED"
            - "Straddling visit (10:30-11:30) rejected with ERR_SITE_VISIT_OVERLAP (409)"
            - "Exactly 2 site visits exist for Nomination.${n1_id}"

      - name: learning_session_buffer_gap
        grounds:
          - validations[priority=13]
          - errors[ERR_SESSION_OVERLAP_BUFFER]
          - entities.LearningSession.fields.starts_at
        distinguishing_aspect: |
          Different interval semantics on a different resource (the cycle's
          session calendar): a 15-minute turnover buffer applies — a session
          starting 10 minutes after another ends is rejected, while one
          starting exactly 15 minutes after is accepted (gap >= 15 passes).
        test_recipe:
          setup:
            - "Cycle (DRAFT) with SCHEDULED session S1 2026-06-10T10:00-11:00Z"
          setup_api_calls:
            - { call: "POST /api/circles", payload: { name: "Circle TO2", admin_fee_percent: 5, quorum_percent: 50, standard_minimum_cents: 100000, leader_minimum_cents: 250000, operating_reserve_cents: 0, vetting_profile: "BALANCED" }, as: CircleAdmin, captures: { circle_id: $.data.id } }
            - { call: "POST /api/cycles", payload: { circle_id: "${circle_id}", year_label: "2026" }, as: CircleAdmin, captures: { cycle_id: $.data.id } }
            - { call: "POST /api/learning-sessions", payload: { cycle_id: "${cycle_id}", title: "S1", starts_at: "2026-06-10T10:00:00Z", ends_at: "2026-06-10T11:00:00Z", capacity: 10 }, as: CircleAdmin, captures: { s1_id: $.data.id } }
          trigger:
            - { call: "POST /api/learning-sessions", payload: { cycle_id: "${cycle_id}", title: "S2 too close", starts_at: "2026-06-10T11:10:00Z", ends_at: "2026-06-10T12:00:00Z", capacity: 10 }, as: CircleAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /api/learning-sessions", payload: { cycle_id: "${cycle_id}", title: "S3 exact buffer", starts_at: "2026-06-10T11:15:00Z", ends_at: "2026-06-10T12:00:00Z", capacity: 10 }, as: CircleAdmin, captures: { s3_id: $.data.id } }
          assert:
            - "Gap 10 min < 15 buffer: rejected with ERR_SESSION_OVERLAP_BUFFER (409)"
            - "Gap exactly 15 min: accepted — LearningSession.${s3_id}.status == SCHEDULED"
            - "Total SCHEDULED sessions in cycle == 2 (S1 and S3)"
