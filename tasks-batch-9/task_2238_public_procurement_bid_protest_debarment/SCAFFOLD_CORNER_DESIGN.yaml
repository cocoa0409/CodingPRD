            - "no Protest row exists on ${c_s26_id}; Vendor.${c_v58_id}.protest_fee_balance_cents == 100000 and Solicitation.${c_s26_id}.protest_escrow_cents == 0"

      - name: corner_question_submitted_after_the_deadline_is_stamped_rejected_late
        claim_type: Conditional validation
        grounds:
          - entities.QuestionSubmission.fields.status
          - validations[priority=17]
          - state_machines.QuestionSubmission
        distinguishing_aspect: "A question arriving after question_deadline_utc while the solicitation is still ISSUED is accepted with HTTP 201 and stamped REJECTED_LATE (not an error), and that status gives no PROSPECTIVE_BIDDER standing; only after close-question-period does the same call return ERR_QUESTION_PERIOD_CLOSED."
        test_recipe:
          setup:
            - "clock pinned to 2026-08-01T00:00:00Z; one Vendor with a 100000-cent fee balance; one ISSUED Solicitation with question_deadline_utc 2026-08-20T00:00:00Z that has NOT been moved to QUESTION_PERIOD_CLOSED; the clock is then set to 2026-08-21T00:00:00Z"
