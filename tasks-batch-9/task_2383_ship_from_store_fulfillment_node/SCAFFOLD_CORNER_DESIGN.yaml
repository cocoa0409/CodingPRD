              as_user_id: "${s1}"
              captures: { e_stale: "$.data.error_id" }
            - call: "GET /fulfillment-network/carrier-pickups/${p1}"
              payload: {}
              as: CarrierCoordinator
              captures: { p1_v_fresh: "$.data.version" }
            - call: "POST /fulfillment-network/assignments/${a2}/ship"
              payload: { carrier_pickup_id: "${p1}", expected_pickup_version: "${p1_v_fresh}" }
              as: StoreAssociate
              as_user_id: "${s1}"
          assert:
            - "${p1_v_stale} == 1 was read before either tender; the first ship returns HTTP 200 with FulfillmentAssignment.${a1}.status == SHIPPED and bumps CarrierPickup.${p1} to reserved_parcels 1 and version 2"
            - "${e_stale} == ERR_STALE_PICKUP_VERSION with HTTP 412 for the second tender replaying version ${p1_v_stale}"
            - "the refusal is not a capacity problem: CarrierPickup.${p1}.parcel_capacity == 5 with reserved_parcels 1, so ERR_PICKUP_CAPACITY_EXCEEDED (priority 41) cannot explain it, and it is not a window problem either since 09:00Z sits inside [08:30Z, 10:00Z)"
            - "the refusal is inert: FulfillmentAssignment.${a2}.status is still PACKED with carrier_pickup_id null, CarrierPickup.${p1}.reserved_parcels is still 1 and version is still 2"
            - "${p1_v_fresh} == 2 and the retry returns HTTP 200: FulfillmentAssignment.${a2}.status == SHIPPED, CarrierPickup.${p1}.reserved_parcels == 2 and version == 3"
            - "each successful tender incremented the guarded parent by exactly 1, so reserved_parcels 2 equals the count of SHIPPED assignments pointing at ${p1}"
            - "both assignments settle at final_cost_cents 1000 (MIN_BILLABLE_LABOR 10 * 42 = 420 labour + MEDIUM_BOX 130 + 30 dunnage + 420 freight); PackagingSupply.${pk_m}.on_hand_units == 2"

      - name: stale_expected_inventory_version_blocks_a_second_cycle_count
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.inventory-adjustment-stale-inventory
          - errors.ERR_STALE_INVENTORY_VERSION
          - validations.priority 7
          - calculations.store_available_to_promise
        distinguishing_aspect: "Two counters replay the same version against one inventory row: the first count writes and bumps the row, the second is refused at 412 rather than silently overwriting the intervening figure, and the retry proves the second count would otherwise have erased a 3-unit shrink."
        test_recipe:
          setup:
            - "Empty database; clock 2026-08-03T09:00:00Z. One node, one SKU and one inventory row at on_hand 12 / safety 2, read once at version 1 by both counters."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S1-DOWNTOWN", region_code: "WEST", origin_zone: 4, daily_unit_capacity: 120, staffed_labor_minutes: 480, labor_standard_minutes_per_order: 12, pick_labor_minutes_per_unit: 3, labor_rate_cents_per_minute: 42, cutoff_utc_minutes: 1020, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s1: "$.data.id" }
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-A", unit_weight_grams: 800, unit_price_cents: 4500, package_class: "MEDIUM", hazmat_flag: false }
              as: NetworkPlanner
              captures: { sku_a: "$.data.id" }
            - call: "POST /fulfillment-network/store-inventories"
              payload: { store_id: "${s1}", sku_id: "${sku_a}", on_hand_units: 12, safety_stock_units: 2 }
              as: NetworkPlanner
              captures: { inv_a: "$.data.id" }
            - call: "GET /fulfillment-network/store-inventories/${inv_a}"
              payload: {}
              as: NetworkPlanner
              captures: { inv_v_stale: "$.data.version" }
          trigger:
            - call: "POST /fulfillment-network/store-inventories/${inv_a}/adjustments"
              payload: { expected_inventory_version: "${inv_v_stale}", counted_on_hand_units: 9, reason: "SHRINK" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/store-inventories/${inv_a}/adjustments"
              payload: { expected_inventory_version: "${inv_v_stale}", counted_on_hand_units: 12, reason: "CYCLE_COUNT" }
              as: StoreAssociate
              as_user_id: "${s1}"
              captures: { e_stale: "$.data.error_id" }
            - call: "GET /fulfillment-network/store-inventories/${inv_a}"
              payload: {}
              as: StoreAssociate
              as_user_id: "${s1}"
              captures: { inv_v_fresh: "$.data.version" }
            - call: "POST /fulfillment-network/store-inventories/${inv_a}/adjustments"
              payload: { expected_inventory_version: "${inv_v_fresh}", counted_on_hand_units: 12, reason: "CYCLE_COUNT" }
              as: StoreAssociate
              as_user_id: "${s1}"
          assert:
            - "${inv_v_stale} == 1 from creation; the first adjustment returns HTTP 200 with StoreInventory.${inv_a}.on_hand_units == 9, available_to_promise_units == 7 (9 - 0 reserved - 2 safety), last_adjustment_reason == SHRINK and version == 2"
            - "${e_stale} == ERR_STALE_INVENTORY_VERSION with HTTP 412 for the second adjustment, which replays version 1"
            - "the refusal protects the shrink: StoreInventory.${inv_a}.on_hand_units is still 9, last_adjustment_reason is still SHRINK and version is still 2 - the count of 12 was not written"
            - "the scope check passes before the version check for the second call: the acting StoreAssociate is ${s1}, the row's own node, so the 412 is a genuine staleness verdict and not a masked priority-6 refusal"
            - "${inv_v_fresh} == 2 and the retry returns HTTP 200 with on_hand_units == 12, available_to_promise_units == 10, last_adjustment_reason == CYCLE_COUNT and version == 3"
            - "version increments by exactly 1 on every accepted write and never on a refused one: the row moves 1 -> 2 -> 3 across three adjustment calls of which one failed"

      - name: node_deactivation_cascade_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers cascading_side_effects
          - state_machines.Store
        excluded_because:
          difficulty_instance: transitive_cascade / node_deactivation_cascade_reroutes_to_replacement_node
          rationale: "The layer claim - an N-level chain verified end to end with ordering sensitivity - is asserted at its deepest point by the transitive_cascade instance of that name in §1.8, which drives ops-run step 3 through assignment cancellation, unit release, node re-posture and the step-6 reroute onto a replacement node in one response."
      - name: provisional_and_final_cost_variants_both_land
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers dual_variant_calculation
          - calculations.assignment_fulfillment_cost
        excluded_because:
          difficulty_instance: dual_variant_calc / assignment_provisional_cost_versus_final_cost_at_ship
          rationale: "The layer claim - both variants produce their expected result and the delta on switch is correct - is the entire subject of the dual_variant_calc instance of that name in §1.8, which pins provisional 1336, final 1630 and the 312-cent order-level variance on one assignment."
      - name: waterfall_selector_policy_picks_the_declared_winner
        claim_type: selector_policy
        grounds:
          - complexity_profile.complexity_layers selector_policy
          - calculations.routing_node_selection_waterfall
        excluded_because:
          difficulty_instance: combinatorial_formula / coverage_units_is_three_way_nested_minimum
          rationale: "The selector-policy claim - that the winner follows the declared ranking and its split-minimization restriction rather than raw score - is exercised by the combinatorial_formula instance of that name in §1.8, where the three-way nested minimum decides coverage_units and therefore which candidate is full-coverage and selectable."
      - name: ops_run_checkpoint_executes_its_pinned_steps_in_order
        claim_type: ops_run_checkpoint
        grounds:
          - complexity_profile.complexity_layers ops_run_checkpoint
          - endpoints.POST /fulfillment-network/performance-windows/close
        excluded_because:
          difficulty_instance: non_linear_state_machine / store_node_status_cycles_eligible_probation_deactivated_eligible
          rationale: "The checkpoint claim - that one ops-run call performs its seven pinned steps in the declared order and is the only clock that advances epochs - is asserted across three consecutive runs by the non_linear_state_machine instance of that name in §1.8, which walks a node ELIGIBLE -> PROBATION -> DEACTIVATED -> ELIGIBLE purely through ops-runs."

  - section: consistency_model
    instances:
      - name: every_side_effect_of_a_commit_run_is_visible_to_the_very_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model immediate
          - endpoints.POST /fulfillment-network/orders/{order_id}/routing-runs
          - calculations.order_routing_status_derivation
        distinguishing_aspect: "One COMMIT response settles nine different rows across five entities - run, candidates, assignment, assignment lines, order projections, inventory reservation, node counters, node score - and every one of them is already at its final value on the next read, with no queued job, no PENDING intermediate status and no settling step anywhere in the API."
        test_recipe:
          setup:
            - "Empty database; clock 2026-08-03T09:00:00Z. Two nodes exist but only S1 stocks SKU-A, and order O1 carries one A x 2 line."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S1-DOWNTOWN", region_code: "WEST", origin_zone: 4, daily_unit_capacity: 120, staffed_labor_minutes: 480, labor_standard_minutes_per_order: 12, pick_labor_minutes_per_unit: 3, labor_rate_cents_per_minute: 42, cutoff_utc_minutes: 1020, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s1: "$.data.id" }
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S3-SUBURB", region_code: "WEST", origin_zone: 2, daily_unit_capacity: 200, staffed_labor_minutes: 600, labor_standard_minutes_per_order: 10, pick_labor_minutes_per_unit: 2, labor_rate_cents_per_minute: 20, cutoff_utc_minutes: 960, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s3: "$.data.id" }
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-A", unit_weight_grams: 800, unit_price_cents: 4500, package_class: "MEDIUM", hazmat_flag: false }
              as: NetworkPlanner
              captures: { sku_a: "$.data.id" }
            - call: "POST /fulfillment-network/store-inventories"
              payload: { store_id: "${s1}", sku_id: "${sku_a}", on_hand_units: 12, safety_stock_units: 2 }
              as: NetworkPlanner
              captures: { inv_a: "$.data.id" }
            - call: "POST /fulfillment-network/orders"
              payload: { order_code: "O-P001", customer_ref: "C-1020", destination_zone: 4, service_level: "GROUND", promised_ship_by_utc: "2026-08-04T15:00:00Z" }
              as: CustomerCare
              captures: { o1: "$.data.id" }
            - call: "POST /fulfillment-network/orders/${o1}/lines"
              payload: { sku_id: "${sku_a}", quantity: 2, unit_price_cents: 4500 }
              as: CustomerCare
              captures: { l1: "$.data.id" }
            - call: "GET /fulfillment-network/orders/${o1}"
              payload: {}
              as: NetworkPlanner
              captures: { o1_v: "$.data.version" }
          trigger:
            - call: "POST /fulfillment-network/orders/${o1}/routing-runs"
              payload: { mode: "COMMIT", expected_order_version: "${o1_v}" }
              as: NetworkPlanner
              captures: { run1: "$.data.id" }
            - call: "GET /fulfillment-network/routing-candidates"
              payload: { routing_run_id: "${run1}" }
              as: NetworkPlanner
              captures: { cands: "$.data" }
            - call: "GET /fulfillment-network/assignments"
              payload: { routing_run_id: "${run1}" }
              as: NetworkPlanner
              captures: { a1: "$.data[0].id" }
            - call: "GET /fulfillment-network/assignment-lines"
              payload: { assignment_id: "${a1}" }
              as: NetworkPlanner
              captures: { al1: "$.data[0].id" }
            - call: "GET /fulfillment-network/orders/${o1}"
              payload: {}
              as: NetworkPlanner
            - call: "GET /fulfillment-network/store-inventories/${inv_a}"
              payload: {}
              as: NetworkPlanner
            - call: "GET /fulfillment-network/stores/${s1}"
              payload: {}
              as: NetworkPlanner
            - call: "GET /fulfillment-network/notifications"
              payload: { order_id: "${o1}" }
              as: NetworkPlanner
          assert:
            - "the COMMIT response itself already carries the final projections: RoutingRun.${run1}.status == COMMITTED with selected_store_count 1, planned_split_count 1, unfulfillable_units 0, projected_cost_cents 1416 and projected_cost_index_bps 6775 - no status such as PENDING or PROCESSING exists in the RoutingRun state machine"
            - "the ${cands} listing returns 2 rows in ascending store.created_at order, both persisted by the same call: S1 eligible with routing_score 82.58 (45 * 1.0000 coverage + 25 * 0.4150 cost + 20 * 1.0000 speed + 10 * 0.7200 health) and selected true, S3 ineligible with ineligible_reason NO_ATP and both routing_score and rank null"
            - "FulfillmentAssignment.${a1} is already ASSIGNED at version 1 with store_id ${s1}, assigned_units 2, epoch 1, provisional_cost_cents 1336, pick_deadline_utc 2026-08-03T13:00:00Z and labor_minutes_reserved 18.00, and AssignmentLine.${al1}.units_assigned == 2"
            - "CustomerOrder.${o1} is already re-derived on the next read: routing_status COVERED, fulfillment_status PENDING, provisional_cost_cents 1416, cost_index_bps 6775, version 3 and OrderLine.${l1}.open_units == 0 with assigned_units 2"
            - "StoreInventory.${inv_a} is already reserved on the next read: reserved_units 2, available_to_promise_units 8, version 2 - no reconciliation pass is needed to reach that figure"
            - "Store.${s1} is already re-postured on the next read: units_committed_epoch 2, reserved_labor_minutes 18.00 and eligibility_score 70.48 (23.6000 capacity at 118/200, 28.8750 labour at 462/480, 18.0000 cold-start), with eligibility_score_basis still COLD_START"
            - "the customer-facing side effect is immediate too: GET /notifications?order_id=${o1} already returns exactly one ASSIGNED notification emitted by the same call"
            - "consistency is immediate rather than eventual or saga-based: there is no reconcile, settle, retry or outbox endpoint in the API surface, and the ops-run is a business checkpoint that closes windows rather than a convergence pass"
