              as: MaterialsController
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 400 and ${err_id} == ERR_INVALID_REQUEST"
            - "GET /plant-ops/gypsum-lots?plant_id=${plant_id} returns total_count == 0"

      - name: duplicate_plant_code_and_sku_code_return_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Plant.fields.code
          - entities.ProductSpec.fields.sku_code
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Plant.code is globally unique and ProductSpec.sku_code is unique per plant, so replaying
          either creation with the same identifier returns ERR_INVALID_REQUEST (400) rather than a
          second row or a 409 conflict code.
        test_recipe:
          setup:
            - "Plant GYP-1 exists with the REGULAR SKU REG-050-4X12."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /plant-ops/plants/${plant_id}/product-specs"
              payload: { sku_code: "REG-050-4X12", thickness_in: 0.5, board_type: "REGULAR", fire_rated: false, board_width_in: 48.0, board_length_ft: 12.0, target_board_weight_lb_per_msf: 1600.0, stucco_lb_per_msf: 1350.0, slurry_water_stucco_ratio: 0.75, line_speed_max_fpm: 480, paper_tension_min_lb: 28.0, paper_tension_max_lb: 46.0, core_hardness_min_lbf: 15.0, nail_pull_min_lbf: 77.0, flexural_cross_min_lbf: 36.0, max_boards_per_bundle: 48, changeover_family: "STANDARD" }
              as: PlantAdmin
              captures: { spec_reg_id: $.data.id }
          trigger:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Duplicate Plant", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { err_plant: $.data.error_id }
            - call: "POST /plant-ops/plants/${plant_id}/product-specs"
              payload: { sku_code: "REG-050-4X12", thickness_in: 0.5, board_type: "REGULAR", fire_rated: false, board_width_in: 48.0, board_length_ft: 12.0, target_board_weight_lb_per_msf: 1600.0, stucco_lb_per_msf: 1350.0, slurry_water_stucco_ratio: 0.75, line_speed_max_fpm: 480, paper_tension_min_lb: 28.0, paper_tension_max_lb: 46.0, core_hardness_min_lbf: 15.0, nail_pull_min_lbf: 77.0, flexural_cross_min_lbf: 36.0, max_boards_per_bundle: 48, changeover_family: "STANDARD" }
              as: PlantAdmin
              captures: { err_spec: $.data.error_id }
          assert:
