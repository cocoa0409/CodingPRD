          rationale: "The named §1.8 instance exhausts the two permitted info laps and asserts the third is refused."

  # =====================================================================
  # Section 5 — Endpoints (§1.5): action-endpoint side effects, the
  # array-returning bulk settlement, the entity-backed advertiser link and
  # the fiscal guard on the credit pool.
  # =====================================================================
  - section: endpoints
    instances:
      - name: settle_guarantees_with_no_shortfall_rejected
        claim_type: conditional_action
        grounds:
          - validations[priority=81]
          - errors[ERR_NO_SHORTFALL_TO_SETTLE]
          - endpoints[POST /circulation/statements/{id}/settle-guarantees]
        distinguishing_aspect: "Settlement is a conditional action: with delivered circulation (1200) ABOVE the guaranteed rate base (1000) the endpoint must refuse rather than return an empty array, and no obligation row or guarantees_settled_at timestamp may appear."
        test_recipe:
          setup:
            - "publication with all three rules and one qualified 1200-copy PAID recipient"
            - "an ACTIVE contract guaranteeing only 1000 copies with a 2.00 percent tolerance"
            - "clock at 2026-10-01 with a FILED statement for [2026-07-01, 2026-09-01)"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Over Delivery Monthly", frequency: "MONTHLY", industry_code: "MANUFACTURING" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "POST /circulation/publications/${pub_id}/qualification-rules"
              payload: { dimension: "JOB_FUNCTION", allowed_values: ["ENGINEERING_MGMT"], points: 45, is_mandatory: true }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "POST /circulation/publications/${pub_id}/qualification-rules"
              payload: { dimension: "INDUSTRY", allowed_values: ["MANUFACTURING"], points: 30, is_mandatory: false }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "POST /circulation/publications/${pub_id}/qualification-rules"
              payload: { dimension: "PURCHASING_AUTHORITY", allowed_values: ["APPROVES"], points: 25, is_mandatory: false }
