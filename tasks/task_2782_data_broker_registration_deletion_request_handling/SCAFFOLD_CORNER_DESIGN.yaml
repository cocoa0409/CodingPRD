            - "DeletionRequest.${req_id}.downstream_task_count == 1"
            - "DeletionRequest.${req_id}.acked_task_count == 1"
            - "DeletionRequest.${req_id}.outstanding_task_count == 2"
            - "DeletionRequest.${req_id}.completion_ratio == 0.2500"
            - "DeletionRequest.${req_id}.status == EXECUTING"

      - name: registry_standing_requires_every_operating_state_to_be_covered
        claim_type: input_set_filtering
        grounds:
          - calculations.registry_standing_derivation
          - entities.DataBroker.fields.operating_state_codes
          - entities.DataBroker.fields.delinquent_since
        distinguishing_aspect: >
          A broker operating in CA and NV stays DELINQUENT after only the CA filing is accepted —
          the COMPLIANT clause requires an in-window ACCEPTED registration for every operating
          state, not merely one — and flips to COMPLIANT with delinquent_since cleared to null only
          when the NV filing is accepted too. The ledger must then read fee_paid_cents 46614 and
          fee_credit_cents 453386 against an unchanged fee_deposited_cents of 500000.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one DataBroker with operating_state_codes [CA, NV] and a 500000-cent deposit."
            - "One ACCEPTED CA Registration covering 2026-09-01 to 2027-03-01 with the four required disclosures at full length (completeness 80.00, provisional 47000, final 23307)."
            - "No NV Registration exists yet, so the broker is still DELINQUENT with delinquent_since 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Silverleaf Data Exchange", primary_contact_email: "compliance@silverleaf.example", home_state_code: "CA", operating_state_codes: ["CA", "NV"], business_description: "Resells licensed automotive and household ownership attributes to lead generators." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /brokers/${broker_id}/fee-deposits"
              payload: { amount_cents: 500000 }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { broker_v1: $.data.version }
            - call: "POST /registrations"
              payload: { broker_id: "${broker_id}", state_code: "CA", coverage_period_start: "2026-09-01T00:00:00Z", coverage_period_end: "2027-03-01T00:00:00Z", business_description: "California registry filing for the automotive and household attribute resale business.", expected_broker_version: "${broker_v1}" }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { ca_reg_id: $.data.id }
            - call: "POST /registrations/${ca_reg_id}/disclosures"
              payload: { category: "SOURCES", content: "Public records, loyalty programme partners and licensed survey panels supply the source data.", covers_sensitive_categories: false }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /registrations/${ca_reg_id}/disclosures"
              payload: { category: "RECIPIENTS", content: "Advertising networks, analytics vendors and credit marketing affiliates receive the segments.", covers_sensitive_categories: false }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /registrations/${ca_reg_id}/disclosures"
              payload: { category: "RETENTION", content: "Records are retained for thirty-six months after the last verified engagement event.", covers_sensitive_categories: false }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /registrations/${ca_reg_id}/disclosures"
              payload: { category: "OPT_OUT_MECHANISM", content: "Consumers opt out through the web portal, the state platform or a recognised GPC signal.", covers_sensitive_categories: false }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /registrations/${ca_reg_id}/submit"
              payload: {}
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /registrations/${ca_reg_id}/accept"
              payload: {}
              as: PlatformAdmin
            - call: "GET /brokers/${broker_id}"
              payload: {}
              as: PlatformAdmin
              captures: { broker_v_after_ca: $.data.version }
          trigger:
            - call: "POST /registrations"
              payload: { broker_id: "${broker_id}", state_code: "NV", coverage_period_start: "2026-09-01T00:00:00Z", coverage_period_end: "2027-03-01T00:00:00Z", business_description: "Nevada registry filing for the automotive and household attribute resale business.", expected_broker_version: "${broker_v_after_ca}" }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { nv_reg_id: $.data.id }
            - call: "POST /registrations/${nv_reg_id}/disclosures"
              payload: { category: "SOURCES", content: "Public records, loyalty programme partners and licensed survey panels supply the source data.", covers_sensitive_categories: false }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /registrations/${nv_reg_id}/disclosures"
              payload: { category: "RECIPIENTS", content: "Advertising networks, analytics vendors and credit marketing affiliates receive the segments.", covers_sensitive_categories: false }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /registrations/${nv_reg_id}/disclosures"
              payload: { category: "RETENTION", content: "Records are retained for thirty-six months after the last verified engagement event.", covers_sensitive_categories: false }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /registrations/${nv_reg_id}/disclosures"
              payload: { category: "OPT_OUT_MECHANISM", content: "Consumers opt out through the web portal, the state platform or a recognised GPC signal.", covers_sensitive_categories: false }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /registrations/${nv_reg_id}/submit"
              payload: {}
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "POST /registrations/${nv_reg_id}/accept"
              payload: {}
              as: PlatformAdmin
          assert:
            - "immediately after the CA acceptance in setup, DataBroker.${broker_id}.registry_standing == DELINQUENT with delinquent_since == 2026-09-01T00:00:00Z"
            - "the NV acceptance returns HTTP 200 with Registration.${nv_reg_id}.status == ACCEPTED"
            - "Registration.${nv_reg_id}.coverage_days == 181"
            - "Registration.${nv_reg_id}.provisional_filing_fee_cents == 47000"
            - "Registration.${nv_reg_id}.final_filing_fee_cents == 23307"
            - "DataBroker.${broker_id}.registry_standing == COMPLIANT"
            - "DataBroker.${broker_id}.delinquent_since == null"
            - "DataBroker.${broker_id}.fee_deposited_cents == 500000"
            - "DataBroker.${broker_id}.fee_paid_cents == 46614"
            - "DataBroker.${broker_id}.fee_credit_cents == 453386"
            - "GET /brokers/${broker_id}/audit-events?event_type=STANDING_CHANGED reports total_count == 1"

      - name: filing_fee_variants_diverge_between_submit_and_acceptance
        claim_type: variant_divergence
        grounds:
          - calculations.filing_fee_assessment.variants
        excluded_because:
          difficulty_instance: filing_fee_provisional_at_submit_versus_final_at_acceptance
          rationale: >
            The §1.8 dual_variant_calc instance already runs the same disclosure set through both
            variants and asserts the exact cent delta between 47000 and 23307, which is precisely
            the variant-divergence claim.

      - name: assurance_variant_selected_by_method_reference_and_intake_channel
        claim_type: variant_selection
        grounds:
          - calculations.identity_assurance_score.variants
        excluded_because:
          difficulty_instance: identity_assurance_platform_asserted_floor_versus_fraud_weighted
          rationale: >
            The §1.8 dual_variant_calc instance already asserts that the same zero-evidence
            PLATFORM_ASSERTION attempt scores 70.00 and PASSES on a STATE_PLATFORM request but
            25.00 and FAILS on a DIRECT_PORTAL one, covering the three-part selection condition.

      - name: filing_fee_settlement_delta_reconciles_the_broker_ledger
        claim_type: reconciliation
        grounds:
          - state_machines.Registration.transitions.SUBMITTED_to_ACCEPTED.settlement_delta
        excluded_because:
          difficulty_instance: broker_fee_ledger_reconciles_across_submit_accept_and_withdraw
          rationale: >
            The §1.8 compensating_invariant instance already walks the ledger through submit, accept
            and withdraw asserting fee_deposited_cents == fee_paid_cents + fee_credit_cents at every
            step, which subsumes the provisional-to-final reconciliation claim.

  - section: validations
    instances:
      - name: duplicate_disclosure_category_on_the_same_registration_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_19.ERR_DUPLICATE_DISCLOSURE_CATEGORY
          - state_machines.Registration.transitions.DRAFT_to_DRAFT
        distinguishing_aspect: >
          A second SOURCES item on the same DRAFT filing must return
          ERR_DUPLICATE_DISCLOSURE_CATEGORY at HTTP 409 and must not double-count the weight: the
          completeness score stays 20.00 rather than climbing to 40.00.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one DataBroker operating in CA and one DRAFT CA Registration carrying exactly one full-length SOURCES disclosure."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Silverleaf Data Exchange", primary_contact_email: "compliance@silverleaf.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Resells licensed automotive and household ownership attributes to lead generators." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id, broker_v1: $.data.version }
            - call: "POST /registrations"
              payload: { broker_id: "${broker_id}", state_code: "CA", coverage_period_start: "2026-09-01T00:00:00Z", coverage_period_end: "2027-03-01T00:00:00Z", business_description: "California registry filing for the automotive and household attribute resale business.", expected_broker_version: "${broker_v1}" }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/disclosures"
              payload: { category: "SOURCES", content: "Public records, loyalty programme partners and licensed survey panels supply the source data.", covers_sensitive_categories: false }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
          trigger:
            - call: "POST /registrations/${reg_id}/disclosures"
              payload: { category: "SOURCES", content: "Second attempt at the same category with completely different wording of the source list.", covers_sensitive_categories: false }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              expect_error: { error_id: ERR_DUPLICATE_DISCLOSURE_CATEGORY, http_status: 409 }
          assert:
            - "the response carries data.error_id == ERR_DUPLICATE_DISCLOSURE_CATEGORY with HTTP 409"
            - "Registration.${reg_id}.disclosure_completeness_score == 20.00"
            - "Registration.${reg_id}.status == DRAFT"
            - "GET /registrations/${reg_id}/disclosures?category=SOURCES reports total_count == 1"

      - name: identity_hash_uniqueness_is_scoped_to_the_broker
        claim_type: violation_to_error
        grounds:
          - validations.priority_18.ERR_IDENTITY_HASH_DUPLICATE
          - entities.Consumer.fields.identity_hash
        distinguishing_aspect: >
          Re-using an identity_hash inside the same broker must return
          ERR_IDENTITY_HASH_DUPLICATE at HTTP 409, while the identical hash under a different broker
          must be accepted with HTTP 201 — the constraint is per-broker, not global.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z and two unrelated DataBrokers, Alpha and Beta."
            - "Alpha already holds one CA Consumer with identity_hash sha256:dup00001dup00001."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Alpha Attribute Works", primary_contact_email: "office@alpha.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Builds purchase propensity attributes for national retail advertising buyers." }
              as: PlatformAdmin
              captures: { alpha_id: $.data.id }
            - call: "POST /brokers"
              payload: { legal_name: "Beta Household Index", primary_contact_email: "office@beta.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Publishes household composition indices licensed to insurance marketing partners." }
              as: PlatformAdmin
              captures: { beta_id: $.data.id }
            - call: "POST /consumers"
              payload: { broker_id: "${alpha_id}", identity_hash: "sha256:dup00001dup00001", state_code: "CA", source_label: "AGENCY_FEED_A", derived_profile_count: 0 }
              as: IntakeAgent
              captures: { alpha_consumer_id: $.data.id }
          trigger:
            - call: "POST /consumers"
              payload: { broker_id: "${alpha_id}", identity_hash: "sha256:dup00001dup00001", state_code: "CA", source_label: "AGENCY_FEED_B", derived_profile_count: 0 }
              as: IntakeAgent
              expect_error: { error_id: ERR_IDENTITY_HASH_DUPLICATE, http_status: 409 }
            - call: "POST /consumers"
              payload: { broker_id: "${beta_id}", identity_hash: "sha256:dup00001dup00001", state_code: "CA", source_label: "BETA_FEED", derived_profile_count: 0 }
              as: IntakeAgent
              captures: { beta_consumer_id: $.data.id }
          assert:
            - "the first trigger carries data.error_id == ERR_IDENTITY_HASH_DUPLICATE with HTTP 409"
            - "the second trigger returns HTTP 201 with Consumer.${beta_consumer_id}.broker_id == ${beta_id}"
            - "GET /consumers?broker_id=${alpha_id} reports total_count == 1"
            - "GET /consumers?broker_id=${beta_id} reports total_count == 1"
            - "Consumer.${alpha_consumer_id}.source_label == AGENCY_FEED_A"

      - name: active_all_sources_suppression_blocks_recollection
        claim_type: violation_to_error
        grounds:
          - validations.priority_30.ERR_SUPPRESSION_ACTIVE
          - entities.SuppressionEntry.fields.blocked_recollection_count
        distinguishing_aspect: >
          A collection event landing inside an ACTIVE ALL_SOURCES window must be refused with
          ERR_SUPPRESSION_ACTIVE at HTTP 409 while still being recorded as a blocked attempt: the
          entry's blocked_recollection_count rises to 1 and a RECOLLECTION_BLOCKED audit event is
          appended, but the consumer's collection_event_count stays at 1.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one DataBroker, one CA Consumer with no sensitive categories, one RECEIVED DeletionRequest, and one ACTIVE SuppressionEntry with source_scope ALL_SOURCES over the default 2026-09-01 to 2028-08-31 window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Silverleaf Data Exchange", primary_contact_email: "compliance@silverleaf.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Resells licensed automotive and household ownership attributes to lead generators." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /consumers"
              payload: { broker_id: "${broker_id}", identity_hash: "sha256:sup00001sup00001", state_code: "CA", source_label: "OWNERSHIP_FEED_D", derived_profile_count: 0 }
              as: IntakeAgent
              captures: { consumer_id: $.data.id, consumer_v1: $.data.version }
            - call: "POST /deletion-requests"
              payload: { broker_id: "${broker_id}", consumer_id: "${consumer_id}", intake_channel: "EMAIL", requested_scope: "DELETE_ALL", expected_consumer_version: "${consumer_v1}" }
              as: IntakeAgent
              captures: { req_id: $.data.id }
            - call: "POST /suppression-entries"
              payload: { broker_id: "${broker_id}", consumer_id: "${consumer_id}", originating_request_id: "${req_id}", source_scope: "ALL_SOURCES" }
              as: PrivacyReviewer
              as_user_id: "reviewer-alpha"
              captures: { supp_id: $.data.id }
          trigger:
            - call: "POST /consumers/${consumer_id}/collections"
              payload: { source_label: "OWNERSHIP_FEED_E", derived_profile_count: 2 }
              as: IntakeAgent
              expect_error: { error_id: ERR_SUPPRESSION_ACTIVE, http_status: 409 }
          assert:
            - "the response carries data.error_id == ERR_SUPPRESSION_ACTIVE with HTTP 409"
            - "SuppressionEntry.${supp_id}.blocked_recollection_count == 1"
            - "SuppressionEntry.${supp_id}.status == ACTIVE"
            - "Consumer.${consumer_id}.collection_event_count == 1"
            - "Consumer.${consumer_id}.source_label == OWNERSHIP_FEED_D"
            - "Consumer.${consumer_id}.derived_profile_count == 0"
            - "GET /brokers/${broker_id}/audit-events?event_type=RECOLLECTION_BLOCKED reports total_count == 1"
            - "GET /brokers/${broker_id}/audit-events?event_type=CONSUMER_COLLECTION_RECORDED reports total_count == 1"

      - name: sensitive_consumer_collection_requires_granted_consent
        claim_type: conditional_validation
        grounds:
          - validations.priority_31.ERR_SENSITIVE_CONSENT_REQUIRED
          - entities.Consumer.fields.sensitive_categories
          - state_machines.Consumer.consent_dimension.transitions.CONSENT_PENDING_to_CONSENT_GRANTED
        distinguishing_aspect: >
          The rule applies only to consumers carrying a non-empty sensitive_categories list. Such a
          consumer starts at CONSENT_PENDING, so a collection is refused with
          ERR_SENSITIVE_CONSENT_REQUIRED at HTTP 422; once the consumer grants consent the identical
          call succeeds and collection_event_count rises from 1 to 2.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one DataBroker and one CA Consumer created with sensitive_categories [PRECISE_GEOLOCATION, HEALTH], so consent_status is CONSENT_PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Silverleaf Data Exchange", primary_contact_email: "compliance@silverleaf.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Resells licensed automotive and household ownership attributes to lead generators." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /consumers"
              payload: { broker_id: "${broker_id}", identity_hash: "sha256:sen00001sen00001", state_code: "CA", source_label: "OWNERSHIP_FEED_D", sensitive_categories: ["PRECISE_GEOLOCATION", "HEALTH"], derived_profile_count: 0 }
              as: IntakeAgent
              captures: { consumer_id: $.data.id }
          trigger:
            - call: "POST /consumers/${consumer_id}/collections"
              payload: { source_label: "OWNERSHIP_FEED_E" }
              as: IntakeAgent
              expect_error: { error_id: ERR_SENSITIVE_CONSENT_REQUIRED, http_status: 422 }
            - call: "POST /consumers/${consumer_id}/consent"
              payload: { action: "GRANT" }
              as: Consumer
              as_user_id: "${consumer_id}"
            - call: "POST /consumers/${consumer_id}/collections"
              payload: { source_label: "OWNERSHIP_FEED_E" }
              as: IntakeAgent
          assert:
            - "Consumer.${consumer_id}.consent_status == CONSENT_PENDING immediately after creation"
            - "the first collection carries data.error_id == ERR_SENSITIVE_CONSENT_REQUIRED with HTTP 422 and leaves Consumer.${consumer_id}.collection_event_count == 1"
            - "the consent call returns HTTP 200 with Consumer.${consumer_id}.consent_status == CONSENT_GRANTED"
            - "the second collection returns HTTP 200"
            - "Consumer.${consumer_id}.collection_event_count == 2"
            - "Consumer.${consumer_id}.source_label == OWNERSHIP_FEED_E"
            - "Consumer.${consumer_id}.collection_status == ACTIVE"

      - name: decide_verification_below_the_assurance_threshold_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_33.ERR_ASSURANCE_BELOW_THRESHOLD
          - calculations.identity_assurance_score.constants.ATTEMPT_PASS_THRESHOLD
        distinguishing_aspect: >
          A single TWO_DATA_POINTS attempt with 1 evidence point and document_quality_score 40
          scores 45.50, so deciding VERIFIED must return ERR_ASSURANCE_BELOW_THRESHOLD at HTTP 422,
          leave the request in VERIFICATION_PENDING and leave verification_decided_by_user_id null
          so no reviewer is yet barred from executing.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one DataBroker, one CA Consumer, and one DIRECT_PORTAL DeletionRequest carrying one FAIL verification attempt worth 45.50."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Silverleaf Data Exchange", primary_contact_email: "compliance@silverleaf.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Resells licensed automotive and household ownership attributes to lead generators." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /consumers"
              payload: { broker_id: "${broker_id}", identity_hash: "sha256:asr00001asr00001", state_code: "CA", source_label: "OWNERSHIP_FEED_D", derived_profile_count: 0 }
              as: IntakeAgent
              captures: { consumer_id: $.data.id, consumer_v1: $.data.version }
            - call: "POST /deletion-requests"
              payload: { broker_id: "${broker_id}", consumer_id: "${consumer_id}", intake_channel: "DIRECT_PORTAL", requested_scope: "DELETE_ALL", expected_consumer_version: "${consumer_v1}" }
              as: IntakeAgent
              captures: { req_id: $.data.id }
            - call: "POST /deletion-requests/${req_id}/verification-attempts"
              payload: { method: "TWO_DATA_POINTS", evidence_points_count: 1, document_quality_score: 40 }
              as: IntakeAgent
          trigger:
            - call: "POST /deletion-requests/${req_id}/decide-verification"
              payload: { decision: "VERIFIED" }
