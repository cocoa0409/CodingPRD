              as_user_id: "${acq_id}"
          assert:
            - "HTTP status == 200"
            - "response data.status == SUBMITTED"
            - "response data.record_count == 1"
            - "response data.total_assessed_cents == 0"
            - "TransactionRecord.${rec_id}.qualification_status == PENDING"
            - "TransactionRecord.${rec_id}.assessed_interchange_cents == 0"
            - "TransactionRecord.${rec_id}.authorization_status == AUTH_APPROVED"

