              as: MethodologyStatistician
              captures: { rs64b_id: "$.data.id" }
          trigger:
            - call: "POST /methodology-changes"
              payload: { title: "Ascription window 60 -> 72 minutes", target_edit_rule_set_id: "${rs64_id}", proposed_edit_rule_set_id: "${rs62_id}", affected_market_ids: ["${m64_id}"] }
              as: GovernanceDirector
              as_user_id: "gov-drafter-64a"
              captures: { ch64a_id: "$.data.id", ch64a_v: "$.data.version" }
            - call: "POST /methodology-changes/${ch64a_id}/impact-analyses"
              payload: { baseline_processing_run_id: "${run64_id}", expected_methodology_change_version: "${ch64a_v}" }
              as: GovernanceDirector
              as_user_id: "gov-analyst-64"
            - call: "POST /methodology-changes"
              payload: { title: "Ascription window 60 -> 71 minutes", target_edit_rule_set_id: "${rs64_id}", proposed_edit_rule_set_id: "${rs63_id}", affected_market_ids: ["${m64_id}"] }
              as: GovernanceDirector
              as_user_id: "gov-drafter-64b"
              captures: { ch64b_id: "$.data.id", ch64b_v: "$.data.version" }
            - call: "POST /methodology-changes/${ch64b_id}/impact-analyses"
              payload: { baseline_processing_run_id: "${run64_id}", expected_methodology_change_version: "${ch64b_v}" }
              as: GovernanceDirector
              as_user_id: "gov-analyst-64"
            - call: "POST /methodology-changes"
              payload: { title: "Outlier weight ratio cap 2.5 -> 10.0", target_edit_rule_set_id: "${rs64_id}", proposed_edit_rule_set_id: "${rs64b_id}", affected_market_ids: ["${m64_id}"] }
              as: GovernanceDirector
              as_user_id: "gov-drafter-64c"
              captures: { ch64c_id: "$.data.id", ch64c_v: "$.data.version" }
            - call: "POST /methodology-changes/${ch64c_id}/impact-analyses"
              payload: { baseline_processing_run_id: "${run64_id}", expected_methodology_change_version: "${ch64c_v}" }
              as: GovernanceDirector
              as_user_id: "gov-analyst-64"
          assert:
            - "Trigger call 2: a == 0, b == 0, c == min(1.0, 12/60) == 0.2 -> impact_delta_pct == round_half_up(0.25 * 0.2, 4) == 0.0500, which meets TIER_MODERATE_THRESHOLD exactly: data.impact_tier == MODERATE, data.notification_lead_hours == 336 and data.notification_deadline_at == 2026-08-25T00:00:00Z"
            - "Trigger call 2: data.state == IMPACT_ASSESSED, data.baseline_processing_run_id == ${run64_id}, data.baseline_projected_average_audience == 24306 (copied from the baseline run, not recomputed) and data.version is one higher than ${ch64a_v} because the OCC write bumped it"
            - "Trigger call 4: c == min(1.0, 11/60) == 0.18333... -> impact_delta_pct == round_half_up(0.0458333..., 4) == 0.0458 < 0.0500: data.impact_tier == MINOR, data.notification_lead_hours == 72 and data.notification_deadline_at == 2026-08-14T00:00:00Z - one minute of ascription window separates the two tiers"
            - "Trigger call 6: a == min(1.0, abs(10.0 - 2.5) / 2.5) == min(1.0, 3.0) == 1.0 CLAMPED, so impact_delta_pct == round_half_up(0.40 * 1.0, 4) == 0.4000 and not 1.2000: data.impact_tier == MATERIAL, data.notification_lead_hours == 720 and data.notification_deadline_at == 2026-09-10T00:00:00Z"
            - "Trigger call 6: b and c are both 0 for this change, confirming each dimension is normalised against its own divisor (2.5 / 300 / 60) before the weights are applied"

      - name: weighting_variants_diverge_on_the_same_edited_run
