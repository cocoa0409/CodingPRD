          assert:
            - "While cert SUSPENDED: err == ERR_CERT_NOT_ACTIVE"
            - "After reinstate: v_ok_st == SCHEDULED (identical payload now succeeds)"

      - name: renewal_requires_valid_rabies
        grounds:
          - validations[priority=8]
          - state_machines.VaccinationRecord.VALID_to_EXPIRED
          - errors[ERR_VACCINATION_EXPIRED]
        distinguishing_aspect: |
          Pair = Certification -> VaccinationRecord (distinct pair from
          Visit->Certification): with the rabies record lapsed the renewal is
          rejected with ERR_VACCINATION_EXPIRED; after recording a fresh
          RABIES vaccination the SAME renewal request passes the safety gate
          and advances to the next gate (visit minimum), proving the
          dependency was the vaccination record's state.
        test_recipe:
          setup:
            - "Certification c activated 2026-08-02 (expires_on 2028-08-01); rabies valid_until 2027-06-30; policy ACTIVE through 2029-12-31; clock at 2028-07-02, sweep run (cert RENEWAL_DUE, rabies lapsed); zero verified visits"
          setup_api_calls:
            - { call: "POST /v1/handlers", payload: { full_name: "H X2", email: "hx2@x.com", region_code: "WA", volunteer_since: "2024-08-01" }, as: Anonymous, captures: { h: $.data.id } }
