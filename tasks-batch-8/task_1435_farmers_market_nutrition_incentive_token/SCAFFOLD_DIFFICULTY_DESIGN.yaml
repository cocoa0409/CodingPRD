    instances:
      - name: daily_match_cap_exact_boundary_then_exhaustion
        grounds:
          - calculations.match_computation
          - calculations.shopper_match_usage
        distinguishing_aspect: |
          Numeric-threshold boundary on POST /issuances: match exactly AT the SNAP daily cap (2000) is granted
          in full (cap is an inclusive allowance, not an exclusive tripwire); the very next issuance on the
          same day, even charging 100, receives match 0 — the boundary sits between '==' (allowed) and '+1'.
        test_recipe:
          setup:
            - "Base setup; SNAP shopper ACTIVE; day OPEN; no prior issuance"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 100000 }, as: ProgramAdmin, captures: { prog: $.data.id } }
