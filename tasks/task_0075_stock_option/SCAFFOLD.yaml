# =============================================================================
# task_0075_stock_option — Scaffold (single source of truth)
# =============================================================================

scenario: |
  Stock option incentive system: grant plan with grant-batch configuration,
  grantee list and eligibility, grant-quantity calculation rules, grant-condition
  declaration, board-and-shareholder approval workflow, and grant-agreement
  signing; exercise calendar with exercise-window configuration (open/blackout
  periods), corporate-event blackout (earnings/material-events),
  exercise-eligibility verification, exercise-window notification, and
  historical exercise-window archiving; exercise price calculation with
  grant-date fair value, repricing rules (split/dividend/restructuring
  adjustment), exercise-price-version control, and exercise-price-disclosure to
  grantees; vesting conditions (cliff / vesting schedule) with cliff period
  configuration, periodic vesting (monthly/quarterly/annual),
  performance-condition vesting, vested-quantity tracking,
  vesting-acceleration rules (change-of-control/IPO), and vesting-record
  archiving; exercise processing with exercise application submission,
  eligibility and quantity verification, payment of exercise price,
  share-issuance or cash-settlement handling, share-registration coordination,
  and exercise-record archiving; tax calculation with tax-event identification
  (grant/vest/exercise/sale), tax-jurisdiction rules, withholding-tax
  calculation, tax-deferral plan handling, and tax-document issuance;
  departure handling with departure-type classification
  (resignation/termination/retirement/death), unvested-option forfeiture,
  vested-option exercise window post-departure, special-case
  (good-leaver/bad-leaver) rules, and departure-settlement workflow;
  event-driven synchronization with HR, payroll, banking, and share-registry
  systems; audit logging for grant changes and exercise records.

domain_name: stock-option-incentive
api_prefix: /option-plans

# -----------------------------------------------------------------------------
# Complexity Profile (Step 0)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: event_sourcing
  complexity_layers:
    - temporal_windowing            # exercise windows, blackout, vesting schedule, post-departure window
    - dual_variant_calculation      # vested-qty algorithm, repriced exercise price, tax variant
    - cascading_side_effects        # corporate-event repricing cascades to all grants; departure cascades to vesting & exercise
    - version_pinning_on_approval   # exercise-price-version snapshot at grant agreement; subsequent repricing emits new version
    - scheduled_deferred_actions    # clock-driven cliff/periodic vesting accrual, window archive sweep

  entity_topology: hybrid
  # OptionPlan → GrantBatch → Grant (hierarchical) plus flat peers
  # (ExerciseWindow, ExercisePriceVersion, CorporateEvent, TaxEventRecord,
  # DepartureRecord, AuditLogEntry) referenced by FK across the tree.

  state_machine_shape: branching
  # Grant has fork-join approval (board ∧ shareholder) before agreement sign;
  # ExerciseApplication branches into share-issuance OR cash-settlement;
  # DepartureRecord branches by departure_type and good/bad-leaver classification.

  relationship_patterns:
    - one_to_many                   # Plan → Batch → Grant
    - many_to_many                  # ExerciseWindow ↔ Grant (via eligibility resolution)
    - cross_aggregate               # CorporateEvent affects all grants under a Plan; DepartureRecord touches Grant + ExerciseApplication

  role_model: segregation_of_duties
  # PlanAdministrator drafts; BoardSecretary records board approval; ShareholderRegistrar records shareholder approval;
  # the same X-User-ID cannot perform two of {draft submission, board approval, shareholder approval} on the same Grant.

  consistency_model: immediate
  # Single-request atomic mutations; cascades (repricing, departure forfeiture)
  # complete inside the triggering request.

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  - name: OptionPlan
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Plan name (unique per active status)" }
      - { name: pool_total_options, type: integer, source: input, description: "Total option pool size (positive integer)" }
      - { name: pool_reserved_options, type: integer, source: computed, default: 0, description: "Sum of approved + agreement-signed Grant.quantity under this plan" }
      - { name: pool_remaining_options, type: integer, source: computed, description: "= pool_total_options - pool_reserved_options" }
      - { name: jurisdiction_code, type: enum, source: input, description: "US | UK | CN | SG — drives tax-jurisdiction rules" }
      - { name: current_clock_ts, type: datetime, source: system, description: "Server-controlled clock for this plan; advanced via /clock/advance" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | CLOSED", constraints: "transitions DRAFT→ACTIVE→CLOSED only" }

  - name: GrantBatch
    parent: OptionPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "Parent OptionPlan id" }
      - { name: batch_label, type: string, source: input, description: "Human-readable batch label, unique within plan" }
      - { name: cliff_months, type: integer, source: input, description: "Cliff length in months; 0 means no cliff" }
      - { name: vesting_total_months, type: integer, source: input, description: "Total months from grant to fully vested (must be >= cliff_months and a multiple of vesting_period_months)" }
      - { name: vesting_period_months, type: enum, source: input, description: "1 (monthly) | 3 (quarterly) | 12 (annual)" }
      - { name: vesting_algorithm, type: enum, source: input, description: "ANNIVERSARY_BATCH | CONTINUOUS_DAILY — controls vested-qty interpretation (see Calc §1.3)" }
      - { name: performance_condition_required, type: boolean, source: input, default: false, description: "If true, vesting is gated by performance attestation" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN_FOR_GRANTS | LOCKED" }

  - name: Grantee
    parent: OptionPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "Parent OptionPlan id" }
      - { name: hr_employee_id, type: string, source: input, description: "Foreign-key to HR system payload" }
      - { name: full_name, type: string, source: input, description: "Grantee display name" }
      - { name: tax_residency, type: enum, source: input, description: "US | UK | CN | SG — drives tax variants" }
      - { name: eligibility_status, type: enum, source: system, default: ELIGIBLE, description: "ELIGIBLE | INELIGIBLE | DEPARTED" }
      - { name: departed_at, type: datetime, source: system, description: "Set when DepartureRecord finalized; null otherwise" }

  - name: Grant
    parent: GrantBatch
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "Owning plan id" }
      - { name: batch_id, type: string, source: system, description: "Owning batch id" }
      - { name: grantee_id, type: string, source: input, description: "Recipient Grantee id" }
      - { name: quantity, type: integer, source: input, description: "Granted option count (positive integer)" }
      - { name: grant_date, type: datetime, source: system, description: "Set on board-approval transition" }
      - { name: grant_date_fair_value_cents, type: integer, source: input, description: "Per-option fair value at grant date, integer cents (>=1)" }
      - { name: pinned_price_version_id, type: string, source: system, description: "Snapshot of the ExercisePriceVersion id active at AGREEMENT_SIGNED; locked thereafter" }
      - { name: board_approval_actor_id, type: string, source: system, description: "X-User-ID who approved on board side; null until BOARD_APPROVED" }
      - { name: shareholder_approval_actor_id, type: string, source: system, description: "X-User-ID who approved on shareholder side; null until SHAREHOLDER_APPROVED" }
      - { name: submitted_by_actor_id, type: string, source: system, description: "X-User-ID who created the draft (segregation-of-duties anchor)" }
      - { name: vested_quantity, type: integer, source: computed, description: "Number of vested options as of plan clock; recomputed on read and on sweep" }
      - { name: exercised_quantity, type: integer, source: computed, default: 0, description: "Cumulative options exercised across completed ExerciseApplications" }
      - { name: forfeited_quantity, type: integer, source: computed, default: 0, description: "Cumulative options forfeited (unvested at departure or bad-leaver vested)" }
      - { name: outstanding_quantity, type: integer, source: computed, description: "= quantity - exercised_quantity - forfeited_quantity" }
      - { name: performance_attested_at, type: datetime, source: system, description: "Set when performance condition attested; null otherwise" }
      - { name: status, type: enum, source: system, description: "DRAFT | BOARD_APPROVED | SHAREHOLDER_APPROVED | AGREEMENT_SIGNED | LIVE | FROZEN | TERMINATED" }

  - name: ExerciseWindow
    parent: OptionPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "Parent plan id" }
      - { name: label, type: string, source: input, description: "Window label, unique within plan" }
      - { name: open_ts, type: datetime, source: input, description: "Inclusive open timestamp" }
      - { name: close_ts, type: datetime, source: input, description: "Exclusive close timestamp; must be > open_ts" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | CLOSED | ARCHIVED", constraints: "auto-transitions via clock and /windows/sweep" }
      - { name: notified_at, type: datetime, source: system, description: "Set when OPEN-state notification dispatched" }

  - name: CorporateEvent
    parent: OptionPlan
    common_fields: false
    fields:
      - { name: plan_id, type: string, source: system, description: "Parent plan id" }
      - { name: event_type, type: enum, source: input, description: "EARNINGS_BLACKOUT | MATERIAL_EVENT_BLACKOUT | STOCK_SPLIT | CASH_DIVIDEND | RESTRUCTURING | CHANGE_OF_CONTROL | IPO" }
      - { name: effective_ts, type: datetime, source: input, description: "When the event takes effect on the plan clock" }
      - { name: blackout_end_ts, type: datetime, source: input, description: "Required for *_BLACKOUT types; exclusive end" }
      - { name: split_ratio_numerator, type: integer, source: input, description: "Required for STOCK_SPLIT, e.g. 2 for 2-for-1" }
      - { name: split_ratio_denominator, type: integer, source: input, description: "Required for STOCK_SPLIT, e.g. 1 for 2-for-1" }
      - { name: dividend_amount_cents, type: integer, source: input, description: "Required for CASH_DIVIDEND; integer cents per share" }
      - { name: restructure_factor_bps, type: integer, source: input, description: "Required for RESTRUCTURING; basis-point adjustment factor (10000 = 1.0x)" }

  - name: ExercisePriceVersion
    parent: OptionPlan
    common_fields: false
    fields:
      - { name: plan_id, type: string, source: system, description: "Parent plan id" }
      - { name: batch_id, type: string, source: system, description: "Owning batch id (each batch carries its own version chain)" }
      - { name: version_index, type: integer, source: system, description: "1, 2, 3, … monotonically increasing per batch_id" }
      - { name: parent_version_id, type: string, source: system, description: "Previous version on the chain; null for version_index=1" }
      - { name: cause, type: enum, source: system, description: "INITIAL | STOCK_SPLIT | CASH_DIVIDEND | RESTRUCTURING" }
      - { name: corporate_event_id, type: string, source: system, description: "Triggering CorporateEvent id; null when cause=INITIAL" }
      - { name: price_per_option_cents, type: integer, source: computed, description: "Per-option exercise price in integer cents after applying cause to parent (see Calc §1.3)" }
      - { name: effective_from_ts, type: datetime, source: system, description: "Plan-clock timestamp when this version became active" }
      - { name: disclosed_at, type: datetime, source: system, description: "Set when /exercise-price-versions/{id}/disclose is called" }

  - name: ExerciseApplication
    parent: Grant
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "Owning plan id" }
      - { name: grant_id, type: string, source: system, description: "Source Grant id" }
      - { name: window_id, type: string, source: input, description: "Target ExerciseWindow id; must be OPEN at submission" }
      - { name: pinned_price_version_id, type: string, source: system, description: "Snapshot of Grant.pinned_price_version_id at submission" }
      - { name: requested_quantity, type: integer, source: input, description: "Options requested for exercise (positive integer)" }
      - { name: settlement_mode, type: enum, source: input, description: "SHARE_ISSUANCE | CASH_SETTLEMENT" }
      - { name: gross_proceeds_cents, type: integer, source: computed, description: "= requested_quantity * pinned_price; recomputed at PAYMENT_RECEIVED" }
      - { name: withholding_tax_cents, type: integer, source: computed, description: "From withholding_tax calc; pinned at TAX_WITHHELD" }
      - { name: net_proceeds_cents, type: integer, source: computed, description: "= gross_proceeds_cents - withholding_tax_cents (CASH_SETTLEMENT only)" }
      - { name: payment_reference, type: string, source: input, description: "Banking reference recorded when /pay is invoked" }
      - { name: share_registry_reference, type: string, source: input, description: "Share-registry reference recorded when /issue-shares is invoked" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ELIGIBILITY_VERIFIED | PAYMENT_RECEIVED | TAX_WITHHELD | SETTLED | REJECTED | CANCELLED" }

  - name: VestingRecord
    parent: Grant
    common_fields: false
    fields:
      - { name: grant_id, type: string, source: system, description: "Owning Grant id" }
      - { name: tranche_index, type: integer, source: system, description: "Monotonic per-Grant index of the vesting tranche (1, 2, …)" }
      - { name: vested_ts, type: datetime, source: system, description: "Plan-clock timestamp when this tranche vested" }
      - { name: tranche_quantity, type: integer, source: system, description: "Number of options that vested in this tranche" }
      - { name: cause, type: enum, source: system, description: "CLIFF | PERIODIC | PERFORMANCE_ATTEST | ACCELERATION_CHANGE_OF_CONTROL | ACCELERATION_IPO" }
      - { name: archived, type: boolean, source: system, default: false, description: "Set true when /vesting-records/archive is called" }

  - name: TaxEventRecord
    parent: Grant
    common_fields: false
    fields:
      - { name: grant_id, type: string, source: system, description: "Owning Grant id" }
      - { name: exercise_application_id, type: string, source: system, description: "Related ExerciseApplication; null for grant/vest events" }
      - { name: event_type, type: enum, source: system, description: "GRANT | VEST | EXERCISE | SALE" }
      - { name: taxable_amount_cents, type: integer, source: computed, description: "Per the jurisdiction calc; integer cents" }
      - { name: withheld_amount_cents, type: integer, source: computed, description: "= round(taxable_amount * effective_rate); 0 for deferred plans" }
      - { name: deferred, type: boolean, source: computed, description: "True when plan jurisdiction + event_type qualifies for deferral" }
      - { name: jurisdiction_code, type: enum, source: system, description: "Snapshot of plan.jurisdiction_code at event time" }
      - { name: document_id, type: string, source: system, description: "Set when /tax-events/{id}/issue-document is called" }
      - { name: event_ts, type: datetime, source: system, description: "Plan-clock timestamp at event creation" }

  - name: DepartureRecord
    parent: Grantee
    common_fields: true
    fields:
      - { name: grantee_id, type: string, source: system, description: "Departing grantee id" }
      - { name: departure_type, type: enum, source: input, description: "RESIGNATION | TERMINATION | RETIREMENT | DEATH" }
      - { name: leaver_class, type: enum, source: input, description: "GOOD_LEAVER | BAD_LEAVER — required when departure_type=TERMINATION; auto-derived for others (see §1.3 departure_class_derivation)" }
      - { name: departed_ts, type: datetime, source: input, description: "Effective departure timestamp on plan clock" }
      - { name: post_departure_window_days, type: integer, source: computed, description: "Days the grantee may still exercise vested options; see §1.3" }
      - { name: post_departure_exercise_deadline_ts, type: datetime, source: computed, description: "= departed_ts + post_departure_window_days; null for BAD_LEAVER" }
      - { name: forfeited_options_total, type: integer, source: computed, description: "Sum of forfeited quantity across the grantee's Grants" }
      - { name: status, type: enum, source: system, description: "DRAFT | SETTLED — DRAFT is created on submission; SETTLED after /settle finalizes cascades" }

  - name: AuditLogEntry
    parent: OptionPlan
    common_fields: false
    fields:
      - { name: plan_id, type: string, source: system, description: "Parent plan id" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID at the time of the audited action" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role at the time of the audited action" }
      - { name: action_code, type: enum, source: system, description: "GRANT_CREATED | GRANT_BOARD_APPROVED | GRANT_SHAREHOLDER_APPROVED | GRANT_AGREEMENT_SIGNED | GRANT_TERMINATED | EXERCISE_SUBMITTED | EXERCISE_SETTLED | EXERCISE_REJECTED | PRICE_VERSION_CREATED | DEPARTURE_SETTLED" }
      - { name: target_entity, type: string, source: system, description: "Logical entity name affected (e.g., Grant)" }
      - { name: target_id, type: string, source: system, description: "Affected entity id" }
      - { name: payload_summary, type: object, source: system, description: "JSON snapshot of key fields before/after" }
      - { name: occurred_ts, type: datetime, source: system, description: "Plan-clock timestamp" }

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:

  - entity: OptionPlan
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /option-plans/{planId}/activate
        actor: PlanAdministrator
        preconditions:
          - "pool_total_options >= 1 (ERR_INVALID_REQUEST)"
        side_effects:
          - "current_clock_ts initialized to request's now_iso input (or server-now if omitted)"

      - from: ACTIVE
        to: CLOSED
        trigger: POST /option-plans/{planId}/close
        actor: PlanAdministrator
        preconditions:
          - "No Grant under this plan is in DRAFT, BOARD_APPROVED, or SHAREHOLDER_APPROVED (ERR_PENDING_GRANTS_EXIST)"
          - "No ExerciseApplication under this plan in SUBMITTED, ELIGIBILITY_VERIFIED, PAYMENT_RECEIVED, or TAX_WITHHELD (ERR_OPEN_EXERCISES_EXIST)"
        side_effects:
          - "All ACTIVE-or-SCHEDULED ExerciseWindow rows under this plan auto-transition to CLOSED with archived flag set on next sweep"

  - entity: GrantBatch
    initial_state: DRAFT
    terminal_states: [LOCKED]
    transitions:
      - from: DRAFT
        to: OPEN_FOR_GRANTS
        trigger: POST /option-plans/{planId}/grant-batches/{batchId}/open
        actor: PlanAdministrator
        preconditions:
          - "cliff_months <= vesting_total_months (ERR_INVALID_REQUEST)"
          - "vesting_total_months % vesting_period_months == 0 (ERR_INVALID_REQUEST)"
          - "Plan in ACTIVE state (ERR_PLAN_NOT_ACTIVE)"
        side_effects:
          - "ExercisePriceVersion v1 with cause=INITIAL is auto-created for this batch (price_per_option_cents must be supplied in request body)"

      - from: OPEN_FOR_GRANTS
        to: LOCKED
        trigger: POST /option-plans/{planId}/grant-batches/{batchId}/lock
        actor: PlanAdministrator
        preconditions:
          - "No Grant under this batch in DRAFT, BOARD_APPROVED, or SHAREHOLDER_APPROVED (ERR_PENDING_GRANTS_EXIST)"
        side_effects: []

  - entity: Grant
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: BOARD_APPROVED
        trigger: POST /grants/{grantId}/board-approve
        actor: BoardSecretary
        preconditions:
          - "Acting X-User-ID != Grant.submitted_by_actor_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "Grant in DRAFT state (ERR_GRANT_NOT_IN_DRAFT)"
          - "Batch in OPEN_FOR_GRANTS state (ERR_BATCH_NOT_OPEN)"
          - "Grant.quantity <= plan.pool_remaining_options (ERR_POOL_INSUFFICIENT)"
        side_effects:
          - "Grant.board_approval_actor_id := X-User-ID"
          - "plan.pool_reserved_options += Grant.quantity"
          - "AuditLogEntry(action_code=GRANT_BOARD_APPROVED) appended"

      - from: BOARD_APPROVED
        to: SHAREHOLDER_APPROVED
        trigger: POST /grants/{grantId}/shareholder-approve
        actor: ShareholderRegistrar
        preconditions:
          - "Acting X-User-ID NOT IN {Grant.submitted_by_actor_id, Grant.board_approval_actor_id} (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "Grant in BOARD_APPROVED state (ERR_GRANT_NOT_BOARD_APPROVED)"
        side_effects:
          - "Grant.shareholder_approval_actor_id := X-User-ID"
          - "Grant.grant_date := plan.current_clock_ts"
          - "TaxEventRecord(event_type=GRANT) appended (taxable_amount may be 0 depending on jurisdiction; see §1.3)"
          - "AuditLogEntry(action_code=GRANT_SHAREHOLDER_APPROVED) appended"

      - from: SHAREHOLDER_APPROVED
        to: AGREEMENT_SIGNED
        trigger: POST /grants/{grantId}/sign-agreement
        actor: Grantee
        preconditions:
          - "Acting X-User-ID == Grant.grantee_id mapped to Grantee.hr_employee_id (ERR_INSUFFICIENT_PERMISSIONS)"
          - "Grant in SHAREHOLDER_APPROVED state (ERR_GRANT_NOT_SHAREHOLDER_APPROVED)"
          - "Grantee.eligibility_status == ELIGIBLE (ERR_GRANTEE_INELIGIBLE)"
        side_effects:
          - "Grant.pinned_price_version_id := latest ExercisePriceVersion.id for this batch (the version chain's tip at this instant)"
          - "AuditLogEntry(action_code=GRANT_AGREEMENT_SIGNED) appended"

      - from: AGREEMENT_SIGNED
        to: LIVE
        trigger: "system (automatic at end of /sign-agreement when no FROZEN gating event is active)"
        actor: system
        preconditions:
          - "No active *_BLACKOUT CorporateEvent overlapping plan.current_clock_ts for this plan (ERR_BLACKOUT_ACTIVE — checked first)"
        side_effects:
          - "Grant becomes eligible for vesting accrual"

      - from: AGREEMENT_SIGNED
        to: FROZEN
        trigger: "system (automatic at end of /sign-agreement when an active *_BLACKOUT exists)"
        actor: system
        preconditions: []
        side_effects:
          - "Grant remains vesting-eligible by clock but excluded from exercise applications"

      - from: FROZEN
        to: LIVE
        trigger: "system (automatic when /clock/advance crosses the blackout_end_ts of all overlapping blackouts)"
        actor: system
        preconditions: []
        side_effects: []

      - from: LIVE
        to: TERMINATED
        trigger: "system (cascaded from DepartureRecord /settle when leaver_class=BAD_LEAVER)"
        actor: system
        preconditions: []
        side_effects:
          - "Grant.forfeited_quantity += outstanding_quantity"
          - "plan.pool_reserved_options -= forfeited_quantity"
          - "All ExerciseApplication rows for this Grant in {SUBMITTED, ELIGIBILITY_VERIFIED, PAYMENT_RECEIVED, TAX_WITHHELD} auto-transition to REJECTED with note=BAD_LEAVER_FORFEITURE"
          - "AuditLogEntry(action_code=GRANT_TERMINATED) appended"

      - from: FROZEN
        to: TERMINATED
        trigger: "system (same departure cascade as LIVE→TERMINATED for BAD_LEAVER)"
        actor: system
        preconditions: []
        side_effects:
          - "Same as LIVE→TERMINATED"

  - entity: ExerciseWindow
    initial_state: SCHEDULED
    terminal_states: [ARCHIVED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "system (automatic on POST /option-plans/{planId}/exercise-windows/sweep when plan.current_clock_ts in [open_ts, close_ts))"
        actor: system
        preconditions:
          - "No *_BLACKOUT CorporateEvent overlapping the window interval (ERR_BLACKOUT_OVERLAPS_WINDOW — checked by sweep, window stays SCHEDULED if violated)"
        side_effects:
          - "notified_at := plan.current_clock_ts"
          - "GranteeNotification side-effect: server emits a logical notification to each eligible Grantee (recorded via AuditLogEntry per grantee_id; tests assert ledger rows, not real outbound mail)"

      - from: OPEN
        to: CLOSED
        trigger: "system (automatic on /windows/sweep when plan.current_clock_ts >= close_ts)"
        actor: system
        preconditions: []
        side_effects:
          - "All ExerciseApplication rows in SUBMITTED for this window auto-transition to REJECTED with note=WINDOW_CLOSED"

      - from: CLOSED
        to: ARCHIVED
        trigger: POST /option-plans/{planId}/exercise-windows/{windowId}/archive
        actor: PlanAdministrator
        preconditions:
          - "Window in CLOSED state (ERR_WINDOW_NOT_CLOSED)"
          - "No ExerciseApplication for this window in non-terminal state (ERR_OPEN_EXERCISES_EXIST)"
        side_effects: []

  - entity: ExerciseApplication
    initial_state: SUBMITTED
    terminal_states: [SETTLED, REJECTED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: ELIGIBILITY_VERIFIED
        trigger: POST /exercise-applications/{appId}/verify
        actor: PlanAdministrator
        preconditions:
          - "Grant in LIVE state (ERR_GRANT_NOT_LIVE — checked first)"
          - "Window in OPEN state (ERR_WINDOW_NOT_OPEN)"
          - "Grantee.eligibility_status == ELIGIBLE, OR (eligibility_status==DEPARTED AND plan.current_clock_ts <= DepartureRecord.post_departure_exercise_deadline_ts) (ERR_NOT_IN_EXERCISE_WINDOW)"
          - "requested_quantity <= Grant.vested_quantity - Grant.exercised_quantity (ERR_INSUFFICIENT_VESTED_QUANTITY)"
        side_effects:
          - "Recompute Grant.vested_quantity from current clock + vesting algorithm before the comparison"

      - from: ELIGIBILITY_VERIFIED
        to: PAYMENT_RECEIVED
        trigger: POST /exercise-applications/{appId}/pay
        actor: PlanAdministrator
        preconditions:
          - "settlement_mode == SHARE_ISSUANCE (ERR_INVALID_REQUEST — CASH_SETTLEMENT skips this transition)"
          - "payment_reference present and non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "gross_proceeds_cents := requested_quantity * ExercisePriceVersion(pinned_price_version_id).price_per_option_cents"

      - from: ELIGIBILITY_VERIFIED
        to: TAX_WITHHELD
        trigger: "system (automatic when settlement_mode == CASH_SETTLEMENT and ELIGIBILITY_VERIFIED reached; OR after /pay for SHARE_ISSUANCE)"
        actor: system
        preconditions: []
        side_effects:
          - "Run withholding_tax calculation; pin TaxEventRecord(event_type=EXERCISE) with withheld_amount_cents and deferred flag"
          - "ExerciseApplication.withholding_tax_cents := TaxEventRecord.withheld_amount_cents"

      - from: PAYMENT_RECEIVED
        to: TAX_WITHHELD
        trigger: "system (automatic immediately after PAYMENT_RECEIVED for SHARE_ISSUANCE)"
        actor: system
        preconditions: []
        side_effects:
          - "Same as ELIGIBILITY_VERIFIED→TAX_WITHHELD"

      - from: TAX_WITHHELD
        to: SETTLED
        trigger: POST /exercise-applications/{appId}/settle
        actor: PlanAdministrator
        preconditions:
          - "settlement_mode == SHARE_ISSUANCE → share_registry_reference in request (ERR_INVALID_REQUEST)"
          - "settlement_mode == CASH_SETTLEMENT → payment_reference in request (ERR_INVALID_REQUEST)"
        side_effects:
          - "Grant.exercised_quantity += requested_quantity"
          - "plan.pool_reserved_options -= requested_quantity (options leave the reservation pool — they have been issued or cashed out)"
          - "AuditLogEntry(action_code=EXERCISE_SETTLED) appended"

      - from: SUBMITTED
        to: REJECTED
        trigger: POST /exercise-applications/{appId}/reject
        actor: PlanAdministrator
        preconditions: []
        side_effects:
          - "AuditLogEntry(action_code=EXERCISE_REJECTED) appended"

      - from: ELIGIBILITY_VERIFIED
        to: REJECTED
        trigger: POST /exercise-applications/{appId}/reject
        actor: PlanAdministrator
        preconditions: []
        side_effects:
          - "AuditLogEntry(action_code=EXERCISE_REJECTED) appended"

      - from: SUBMITTED
        to: CANCELLED
        trigger: POST /exercise-applications/{appId}/cancel
        actor: Grantee
        preconditions:
          - "Acting X-User-ID == Grantee.hr_employee_id of Grant.grantee_id (ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects: []

  - entity: DepartureRecord
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: SETTLED
        trigger: POST /grantees/{granteeId}/departure-records/{depId}/settle
        actor: PlanAdministrator
        preconditions:
          - "DepartureRecord in DRAFT (ERR_DEPARTURE_NOT_DRAFT)"
          - "Grantee.eligibility_status == ELIGIBLE (ERR_GRANTEE_ALREADY_DEPARTED)"
        side_effects:
          - "Grantee.eligibility_status := DEPARTED; Grantee.departed_at := DepartureRecord.departed_ts"
          - "For every LIVE/FROZEN Grant of this Grantee: unvested options are forfeited (Grant.forfeited_quantity += outstanding_quantity - vested_quantity_at_departure); pool_reserved_options reduced accordingly"
          - "If leaver_class == BAD_LEAVER: each affected Grant transitions LIVE/FROZEN → TERMINATED (cascade per Grant SM), and vested options are also forfeited (Grant.forfeited_quantity += vested_quantity - exercised_quantity)"
          - "If leaver_class == GOOD_LEAVER: Grant stays LIVE/FROZEN; post_departure_exercise_deadline_ts set; new ExerciseApplication permitted only while plan.current_clock_ts <= deadline"
          - "AuditLogEntry(action_code=DEPARTURE_SETTLED) appended"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - scenario: "Two ExerciseApplications submitted by the same Grantee within the same OPEN window whose combined requested_quantity exceeds the Grant's exercisable quantity"
    guarantee: "First-writer-wins on the pool-debit step; second submission is rejected with quantity-shortfall semantics"
    error_id: ERR_INSUFFICIENT_VESTED_QUANTITY
    http_status: 409
    serialization: "First-writer-wins on Grant.vested_quantity - Grant.exercised_quantity decrement (pessimistic check inside the transaction)"

  - scenario: "Board approval and submission rescission (DRAFT→TERMINATED via /cancel-draft) race on the same Grant"
    guarantee: "Exactly one operation succeeds; loser observes a state error"
    error_id: ERR_GRANT_NOT_IN_DRAFT
    http_status: 409
    serialization: "First-writer-wins on Grant.status"

  - scenario: "Corporate event creation (STOCK_SPLIT) racing with a Grant agreement signing on the same batch"
    guarantee: "Exactly one operation succeeds; if the corporate event commits first, the sign-agreement loser pins the new version (no rejection — version-pinning is the resolution). If sign-agreement commits first, the corporate event still succeeds and emits a new version, leaving the just-signed Grant on the prior version (also no rejection). Race is benign by design and produces no error; this rule is asserted only as an invariant: the audit log MUST record exactly one PRICE_VERSION_CREATED and one GRANT_AGREEMENT_SIGNED."
    error_id: ERR_VERSION_MISMATCH
    http_status: 409
    serialization: "First-writer-wins on plan-clock-monotonic effective_from_ts vs Grant.pinned_price_version_id capture; emitted only if both writers attempt to claim the same version_index"

  - scenario: "Two concurrent DepartureRecord /settle calls on the same Grantee"
    guarantee: "First settle commits; second observes the grantee already departed and rejects"
    error_id: ERR_GRANTEE_ALREADY_DEPARTED
    http_status: 409
    serialization: "First-writer-wins on Grantee.eligibility_status flip ELIGIBLE→DEPARTED"

  - scenario: "Window archive races with a still-open ExerciseApplication settlement on that window"
    guarantee: "Settle commits first iff it acquired the window row before archive; otherwise archive rejects with open-exercise reason"
    error_id: ERR_OPEN_EXERCISES_EXIST
    http_status: 409
    serialization: "Archive checks 'no non-terminal applications' atomically after acquiring the window row"

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# -----------------------------------------------------------------------------
calculations:

  - name: vested_quantity
    trigger: "every read of Grant; ExerciseApplication /verify; manual sweep POST /grants/{grantId}/vesting/recompute"
    algorithm: dual_variant
    input_set: "VestingRecord rows for the Grant where archived=false (active), plus Grant.quantity, batch.cliff_months, batch.vesting_total_months, batch.vesting_period_months, batch.vesting_algorithm, batch.performance_condition_required, Grant.performance_attested_at, Grant.grant_date, plan.current_clock_ts"
    formula: |
      months_elapsed = floor_months_between(Grant.grant_date, plan.current_clock_ts)
      if months_elapsed < batch.cliff_months:
        unconditional_vested = 0
      else if batch.vesting_algorithm == ANNIVERSARY_BATCH:
        # Tranches vest in lump sums on each multiple of vesting_period_months *after* cliff
        completed_periods = floor((months_elapsed - batch.cliff_months) / batch.vesting_period_months) + 1
        completed_periods = min(completed_periods, batch.vesting_total_months / batch.vesting_period_months)
        unconditional_vested = floor(Grant.quantity * completed_periods * batch.vesting_period_months / batch.vesting_total_months)
      else if batch.vesting_algorithm == CONTINUOUS_DAILY:
        # Daily linear accrual after cliff, capped at quantity
        days_since_cliff = max(0, days_between(Grant.grant_date + months(batch.cliff_months), plan.current_clock_ts))
        total_vesting_days = days_in_months(batch.vesting_total_months) - days_in_months(batch.cliff_months)
        unconditional_vested = floor(Grant.quantity * min(days_since_cliff, total_vesting_days) / total_vesting_days)
      if batch.performance_condition_required and Grant.performance_attested_at is null:
        gated_vested = 0
      else:
        gated_vested = unconditional_vested
      accelerated_vested = sum(VestingRecord.tranche_quantity where cause in {ACCELERATION_CHANGE_OF_CONTROL, ACCELERATION_IPO})
      return min(Grant.quantity, max(gated_vested, accelerated_vested))
    constants:
      DAYS_PER_MONTH: 30   # used by days_in_months for the CONTINUOUS_DAILY branch
    precision: "integer options (floor)"
    variants:
      - name: ANNIVERSARY_BATCH
        when: "batch.vesting_algorithm == ANNIVERSARY_BATCH"
        difference: "Vests in discrete chunks at each vesting_period_months boundary; between boundaries the vested count is flat."
      - name: CONTINUOUS_DAILY
        when: "batch.vesting_algorithm == CONTINUOUS_DAILY"
        difference: "Vests by linear daily accrual after cliff; same inputs produce different counts mid-period from ANNIVERSARY_BATCH."

  - name: exercise_price_per_version
    trigger: "ExercisePriceVersion creation (initial or corporate-event cascade)"
    algorithm: constraint_propagation
    input_set: "Parent ExercisePriceVersion.price_per_option_cents (or initial input), CorporateEvent fields"
    formula: |
      # version_index = 1, INITIAL: price = input.initial_price_per_option_cents
      # version_index > 1, by cause:
      if cause == STOCK_SPLIT:
        # Adjust DOWN by ratio_denominator/ratio_numerator (2-for-1 split halves the price)
        new_price = floor(parent.price_per_option_cents * CorporateEvent.split_ratio_denominator
                          / CorporateEvent.split_ratio_numerator)
      elif cause == CASH_DIVIDEND:
        # Reduce by dividend per share, clamped to 1 cent minimum
        new_price = max(1, parent.price_per_option_cents - CorporateEvent.dividend_amount_cents)
      elif cause == RESTRUCTURING:
        # Multiply by restructure_factor_bps / 10000, round HALF_UP at the final step
        new_price = round_half_up(parent.price_per_option_cents * CorporateEvent.restructure_factor_bps / 10000)
        new_price = max(1, new_price)
      return new_price
    constants:
      BPS_DIVISOR: 10000
      MIN_PRICE_CENTS: 1
    precision: "integer cents; STOCK_SPLIT uses floor, CASH_DIVIDEND uses subtraction, RESTRUCTURING uses round_half_up after multiplication"
    note: "Order of operations is pinned: multiplication first, division second, rounding LAST. Reversing the order produces different cents."

  - name: withholding_tax
    trigger: "TaxEventRecord creation (GRANT, VEST, EXERCISE, SALE)"
    algorithm: tiered_pricing
    input_set: "TaxEventRecord.event_type, plan.jurisdiction_code, Grantee.tax_residency, taxable_amount_cents (per below), deferral eligibility flag"
    formula: |
      # 1. taxable_amount_cents by event_type:
      if event_type == GRANT:
        taxable_amount_cents = 0  # all jurisdictions treat option grants as non-taxable here
      elif event_type == VEST:
        # Only US treats vest as ordinary income for NQSO-style options
        if plan.jurisdiction_code == US: taxable_amount_cents = VestingRecord.tranche_quantity * Grant.grant_date_fair_value_cents
        else: taxable_amount_cents = 0
      elif event_type == EXERCISE:
        spread = max(0, current_fair_value_cents - pinned_price_version.price_per_option_cents)
        taxable_amount_cents = spread * ExerciseApplication.requested_quantity
      elif event_type == SALE:
        taxable_amount_cents = (sale_proceeds_cents - cost_basis_cents) * sold_quantity   # captured via /tax-events POST sale

      # 2. effective_rate (basis points) by jurisdiction × residency × event_type
      table = {
        (US, US, EXERCISE):   tiered: [(0, 1000000, 2200), (1000000, MAX_INT, 3700)],   # 22% then 37%
        (US, US, VEST):       tiered: [(0, MAX_INT, 2200)],
        (UK, UK, EXERCISE):   tiered: [(0, 5000000, 2000), (5000000, MAX_INT, 4500)],   # 20% / 45%
        (CN, CN, EXERCISE):   tiered: [(0, 3600000, 2000), (3600000, MAX_INT, 4500)],
        (SG, SG, EXERCISE):   tiered: [(0, MAX_INT, 1500)],                              # flat 15%
        (US, UK, EXERCISE):   tiered: [(0, MAX_INT, 3000)],                              # treaty composite 30%
        (US, CN, EXERCISE):   tiered: [(0, MAX_INT, 3000)],
        (US, SG, EXERCISE):   tiered: [(0, MAX_INT, 1500)],
        ... (mirror for other plan×residency combinations; SALE uses long_term flag with -1000bps after 1y holding)
      }
      # Marginal-rate over tiers:
      withheld = 0
      remaining = taxable_amount_cents
      cursor = 0
      for (lo, hi, rate_bps) in tiers:
        slab = max(0, min(remaining + cursor, hi) - max(cursor, lo))
        withheld += round_half_up(slab * rate_bps / 10000)
        cursor += slab
        if cursor >= taxable_amount_cents: break

      # 3. Deferral
      deferred = (plan.jurisdiction_code == UK and event_type == EXERCISE and Grantee.tax_residency == UK
                  and exists ApprovedDeferralPlan(Grantee.id))    # ApprovedDeferralPlan is a TaxEventRecord with event_type=GRANT and a 'deferral_approved' boolean recorded in payload_summary; if deferred is true, withheld := 0
      if deferred: withheld_amount_cents := 0; else: withheld_amount_cents := withheld
      return (taxable_amount_cents, withheld_amount_cents, deferred)
    constants:
      BPS_DIVISOR: 10000
      LONG_TERM_HOLDING_MONTHS: 12
      LONG_TERM_DISCOUNT_BPS: 1000   # -10 percentage points for long-term capital gains
    precision: "integer cents; round_half_up applied PER TIER SLAB before summing — order matters and is pinned (round-per-slab then sum, not sum-then-round)"
    variants:
      - name: PROVISIONAL_AT_VERIFY
        when: "Called inside ExerciseApplication /verify with intent='provisional' — used for grantee disclosure but NOT pinned to TaxEventRecord"
        difference: "Uses tiers as of plan.current_clock_ts at /verify; never persists withheld_amount_cents to TaxEventRecord"
      - name: FINAL_AT_TAX_WITHHELD
        when: "Persisted at the ELIGIBILITY_VERIFIED→TAX_WITHHELD transition"
        difference: "Uses tiers as of plan.current_clock_ts at the transition instant; pins TaxEventRecord.withheld_amount_cents and deferred. Same input data evaluated even microseconds later can produce a different number if /clock/advance crossed a tier boundary or if Grantee.tax_residency changed; the FINAL value is the legally binding one."

  - name: post_departure_window_resolution
    trigger: "DepartureRecord /settle"
    algorithm: threshold
    input_set: "DepartureRecord.departure_type, DepartureRecord.leaver_class, plan.jurisdiction_code"
    formula: |
      if leaver_class == BAD_LEAVER:
        post_departure_window_days = 0
        post_departure_exercise_deadline_ts = null
      else:
        base_window_days = {
          RESIGNATION: 90,
          TERMINATION: 180,    # only reachable when GOOD_LEAVER (TERMINATION requires leaver_class)
          RETIREMENT: 1095,    # 3 years
          DEATH:      365,
        }[departure_type]
        # Apply jurisdiction floor: UK and SG never grant <120 days for GOOD_LEAVER
        if leaver_class == GOOD_LEAVER and plan.jurisdiction_code in {UK, SG}:
          base_window_days = max(base_window_days, 120)
        post_departure_window_days = base_window_days
        post_departure_exercise_deadline_ts = DepartureRecord.departed_ts + days(post_departure_window_days)
    precision: "integer days; deadline_ts at second resolution"
    note: "TERMINATION requires explicit leaver_class; RESIGNATION/RETIREMENT auto-derive to GOOD_LEAVER, DEATH auto-derives to GOOD_LEAVER. BAD_LEAVER is only producible via TERMINATION."

  - name: departure_forfeiture_settlement
    trigger: "DepartureRecord /settle"
    algorithm: chronological
    input_set: "All Grants of the Grantee in {LIVE, FROZEN} state, evaluated in (grant.batch_id, grant.grant_date, grant.id) lexicographic order. For each grant: vested_quantity (recomputed at departed_ts using the active vesting algorithm), Grant.exercised_quantity, leaver_class"
    formula: |
      total_unvested_forfeited = 0
      total_vested_forfeited   = 0
      for each Grant g of the Grantee in order:
        vested_at_dep      = compute_vested_quantity(g, plan.current_clock_ts := DepartureRecord.departed_ts)
        unvested           = g.quantity - vested_at_dep - g.forfeited_quantity
        outstanding_vested = vested_at_dep - g.exercised_quantity
        # 1. Forfeit unvested unconditionally
        g.forfeited_quantity += unvested
        total_unvested_forfeited += unvested
        # 2. BAD_LEAVER also forfeits outstanding vested
        if leaver_class == BAD_LEAVER:
          g.forfeited_quantity += outstanding_vested
          total_vested_forfeited += outstanding_vested
          # Cascade: g.status := TERMINATED (see Grant SM)
        # 3. Plan pool reconciliation
        plan.pool_reserved_options -= (unvested + (outstanding_vested if leaver_class==BAD_LEAVER else 0))
      DepartureRecord.forfeited_options_total = total_unvested_forfeited + total_vested_forfeited
    precision: "integer options"
    note: "Order is pinned (lex by batch_id, grant_date, id) because vested_at_dep depends only on per-grant fields, but pool_reserved_options decrement is a running aggregate; reordering still yields identical totals BUT the audit log records per-grant cause codes in this deterministic order."

  - name: pool_reservation_check
    trigger: "Grant /board-approve; corporate-event repricing"
    algorithm: aggregation
    input_set: "All Grants under the plan in {BOARD_APPROVED, SHAREHOLDER_APPROVED, AGREEMENT_SIGNED, LIVE, FROZEN} status (exercised/forfeited subtracted)"
    formula: |
      pool_reserved_options = sum over plan's Grants where status IN {BOARD_APPROVED, SHAREHOLDER_APPROVED, AGREEMENT_SIGNED, LIVE, FROZEN}
                              of (g.quantity - g.exercised_quantity - g.forfeited_quantity)
      pool_remaining_options = plan.pool_total_options - pool_reserved_options
    precision: "integer options"

  - name: exercise_proceeds
    trigger: "ExerciseApplication ELIGIBILITY_VERIFIED→PAYMENT_RECEIVED or →TAX_WITHHELD (CASH_SETTLEMENT)"
    algorithm: aggregation
    input_set: "ExerciseApplication.requested_quantity, ExercisePriceVersion(pinned_price_version_id).price_per_option_cents, withholding_tax_cents"
    formula: |
      gross_proceeds_cents = ExerciseApplication.requested_quantity * pinned_price_version.price_per_option_cents
      if settlement_mode == CASH_SETTLEMENT:
        net_proceeds_cents = gross_proceeds_cents - withholding_tax_cents
      else:
        net_proceeds_cents = null   # not applicable for SHARE_ISSUANCE
    precision: "integer cents; no per-line rounding (one multiplication)"

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# -----------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "X-User-Role must be permitted to invoke this endpoint per RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Resource IDs in path must exist (planId, batchId, granteeId, grantId, windowId, appId, depId, eventId, versionId); validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints with path params

  - priority: 3.5
    category: concurrency
    check: "When `version` is supplied in a mutation body, it must equal the resource's current version"
    error_id: ERR_VERSION_MISMATCH
    http_status: 409
    applies_to: "All PUT/PATCH/POST action endpoints on common_fields:true entities"

  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition is defined per §1.2"
    error_id: "state-specific (ERR_GRANT_NOT_IN_DRAFT, ERR_GRANT_NOT_BOARD_APPROVED, ERR_GRANT_NOT_SHAREHOLDER_APPROVED, ERR_GRANT_NOT_LIVE, ERR_WINDOW_NOT_OPEN, ERR_WINDOW_NOT_CLOSED, ERR_BATCH_NOT_OPEN, ERR_PLAN_NOT_ACTIVE, ERR_DEPARTURE_NOT_DRAFT)"
    http_status: 409
    applies_to: state-mutating endpoints

  - priority: 5
    category: business_referential
    check: "Cross-entity ownership: grant.batch_id must equal batchId, grant.plan_id must equal planId; window.plan_id must equal planId; exercise_application.grant_id and window.plan_id must share planId"
    error_id: ERR_CROSS_RESOURCE_MISMATCH
    http_status: 422
    applies_to: nested endpoints

  - priority: 6
    category: business_safety
    check: "Segregation of duties: the X-User-ID acting on /board-approve must differ from Grant.submitted_by_actor_id; X-User-ID on /shareholder-approve must not be in {submitted_by_actor_id, board_approval_actor_id}"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 403
    applies_to: "POST /grants/{grantId}/board-approve, POST /grants/{grantId}/shareholder-approve"

  - priority: 7
    category: business_temporal
    check: "ExerciseWindow open_ts < close_ts; CorporateEvent blackout_end_ts > effective_ts; VestingRecord acceleration triggers must reference a CorporateEvent of type CHANGE_OF_CONTROL or IPO"
    error_id: ERR_INVALID_TIME_INTERVAL
    http_status: 422
    applies_to: "POST /exercise-windows, POST /corporate-events, POST /grants/{grantId}/accelerate-vesting"

  - priority: 8
    category: business_temporal
    check: "ExerciseWindow may not overlap any *_BLACKOUT CorporateEvent: forbidden if [open_ts, close_ts) ∩ [effective_ts, blackout_end_ts) is non-empty; half-open intervals on both sides"
    error_id: ERR_BLACKOUT_OVERLAPS_WINDOW
    http_status: 409
    applies_to: "POST /option-plans/{planId}/exercise-windows, POST /option-plans/{planId}/corporate-events when *_BLACKOUT"

  - priority: 9
    category: business_safety
    check: "Grantee.eligibility_status == ELIGIBLE for grant agreement signing; OR (DEPARTED AND now <= post_departure_exercise_deadline_ts) for exercise submission"
    error_id: ERR_GRANTEE_INELIGIBLE
    http_status: 403
    applies_to: "POST /grants/{grantId}/sign-agreement"

  - priority: 10
    category: business_temporal
    check: "ExerciseApplication submitted only while window is OPEN and within optional post-departure window"
    error_id: ERR_NOT_IN_EXERCISE_WINDOW
    http_status: 409
    applies_to: "POST /grants/{grantId}/exercise-applications"

  - priority: 11
    category: business_safety
    check: "No *_BLACKOUT CorporateEvent overlaps plan.current_clock_ts for grant /sign-agreement→LIVE transition (the FROZEN branch is taken if any blackout active)"
    error_id: ERR_BLACKOUT_ACTIVE
    http_status: 409
    applies_to: "POST /grants/{grantId}/sign-agreement (only when caller passes require_live=true; default behavior is FROZEN routing without error)"

  - priority: 12
    category: business_constraint
    check: "ExerciseApplication.requested_quantity <= (Grant.vested_quantity - Grant.exercised_quantity)"
    error_id: ERR_INSUFFICIENT_VESTED_QUANTITY
    http_status: 409
    applies_to: "POST /grants/{grantId}/exercise-applications, POST /exercise-applications/{appId}/verify"

  - priority: 13
    category: business_constraint
    check: "performance_condition_required==true requires Grant.performance_attested_at != null before vested_quantity contributes to exercisable count"
    error_id: ERR_PERFORMANCE_CONDITION_NOT_MET
    http_status: 409
    applies_to: "POST /exercise-applications/{appId}/verify"

  - priority: 14
    category: business_fiscal
    check: "Grant.quantity at /board-approve must not exceed plan.pool_remaining_options"
    error_id: ERR_POOL_INSUFFICIENT
    http_status: 402
    applies_to: "POST /grants/{grantId}/board-approve"

  - priority: 15
    category: business_constraint
    check: "When closing a plan or locking a batch or archiving a window: no dependent rows in pending states"
    error_id: "ERR_PENDING_GRANTS_EXIST or ERR_OPEN_EXERCISES_EXIST (specific to context)"
    http_status: 409
    applies_to: "POST /option-plans/{planId}/close, POST /grant-batches/{batchId}/lock, POST /exercise-windows/{windowId}/archive"

  - priority: 16
    category: business_referential
    check: "At submission, ExerciseApplication.pinned_price_version_id MUST equal the current TIP of the batch's version chain (latest ExercisePriceVersion.id ordered by version_index). At /verify, the same check re-runs against the current tip; if a corporate-event repricing emitted a new version between submission and /verify, the application's pinned version is stale relative to the tip and rejects."
    error_id: ERR_STALE_PRICE_VERSION
    http_status: 409
    applies_to: "POST /grants/{grantId}/exercise-applications, POST /exercise-applications/{appId}/verify"

  - priority: 17
    category: business_constraint
    check: "CorporateEvent of type STOCK_SPLIT requires split_ratio_numerator >= 1 and split_ratio_denominator >= 1; CASH_DIVIDEND requires dividend_amount_cents >= 1; RESTRUCTURING requires 100 <= restructure_factor_bps <= 100000"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "POST /option-plans/{planId}/corporate-events"

  - priority: 18
    category: business_safety
    check: "BAD_LEAVER classification is permitted only when departure_type == TERMINATION"
    error_id: ERR_BAD_LEAVER_REQUIRES_TERMINATION
    http_status: 422
    applies_to: "POST /grantees/{granteeId}/departure-records"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
# -----------------------------------------------------------------------------
endpoints:

  # --- Option Plans ---
  - method: POST
    path: "/option-plans"
    description: "Create a new Option Plan (status=DRAFT)"
    roles: [PlanAdministrator]
    code: 201
    input: [name, pool_total_options, jurisdiction_code]
    output: OptionPlan
    side_effects: ["status=DRAFT; current_clock_ts := server-now"]

  - method: GET
    path: "/option-plans"
    description: "List Option Plans"
    roles: [PlanAdministrator, BoardSecretary, ShareholderRegistrar, AuditViewer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "OptionPlan[]"
    side_effects: []

  - method: GET
    path: "/option-plans/{planId}"
    description: "Get a specific Option Plan"
    roles: [PlanAdministrator, BoardSecretary, ShareholderRegistrar, AuditViewer]
    code: 200
    input: []
    output: OptionPlan
    side_effects: []

  - method: POST
    path: "/option-plans/{planId}/activate"
    description: "Activate plan; transitions DRAFT→ACTIVE"
    roles: [PlanAdministrator]
    code: 200
    input: ["now_iso?"]
    output: OptionPlan
    side_effects: ["current_clock_ts := now_iso (or server-now)"]

  - method: POST
    path: "/option-plans/{planId}/close"
    description: "Close plan; transitions ACTIVE→CLOSED"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: OptionPlan
    side_effects: ["Cascades scheduled windows to CLOSED on next sweep"]

  - method: POST
    path: "/option-plans/{planId}/clock/advance"
    description: "Advance plan clock; drives time-gated transitions (vesting accrual, window auto-open/close, blackout end)"
    roles: [PlanAdministrator]
    code: 200
    input: [by_seconds]
    output: OptionPlan
    side_effects: ["current_clock_ts += by_seconds; auto-recomputes vested_quantity on read"]

  # --- Grant Batches ---
  - method: POST
    path: "/option-plans/{planId}/grant-batches"
    description: "Create a Grant Batch under the plan"
    roles: [PlanAdministrator]
    code: 201
    input: [batch_label, cliff_months, vesting_total_months, vesting_period_months, vesting_algorithm, "performance_condition_required?", initial_price_per_option_cents]
    output: GrantBatch
    side_effects: ["GrantBatch.status=DRAFT; initial_price_per_option_cents staged for v1 ExercisePriceVersion"]

  - method: GET
    path: "/option-plans/{planId}/grant-batches"
    description: "List Grant Batches"
    roles: [PlanAdministrator, BoardSecretary, ShareholderRegistrar, AuditViewer]
    code: 200
    input: []
    output: "GrantBatch[]"
    side_effects: []

  - method: POST
    path: "/option-plans/{planId}/grant-batches/{batchId}/open"
    description: "Open batch for grants (DRAFT→OPEN_FOR_GRANTS); auto-creates v1 ExercisePriceVersion"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: GrantBatch
    side_effects: ["ExercisePriceVersion v1 created with cause=INITIAL"]

  - method: POST
    path: "/option-plans/{planId}/grant-batches/{batchId}/lock"
    description: "Lock batch (OPEN_FOR_GRANTS→LOCKED)"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: GrantBatch
    side_effects: []

  # --- Grantees ---
  - method: POST
    path: "/option-plans/{planId}/grantees"
    description: "Register a Grantee"
    roles: [PlanAdministrator]
    code: 201
    input: [hr_employee_id, full_name, tax_residency]
    output: Grantee
    side_effects: ["eligibility_status=ELIGIBLE"]

  - method: GET
    path: "/option-plans/{planId}/grantees"
    description: "List Grantees"
    roles: [PlanAdministrator, BoardSecretary, ShareholderRegistrar, AuditViewer]
    code: 200
    input: ["limit?", "offset?", "eligibility_status?"]
    output: "Grantee[]"
    side_effects: []

  # --- Grants ---
  - method: POST
    path: "/option-plans/{planId}/grant-batches/{batchId}/grants"
    description: "Submit a Grant draft for a Grantee under a Batch"
    roles: [PlanAdministrator]
    code: 201
    input: [grantee_id, quantity, grant_date_fair_value_cents]
    output: Grant
    side_effects: ["status=DRAFT; submitted_by_actor_id := X-User-ID"]

  - method: GET
    path: "/option-plans/{planId}/grants"
    description: "List Grants in plan"
    roles: [PlanAdministrator, BoardSecretary, ShareholderRegistrar, AuditViewer]
    code: 200
    input: ["limit?", "offset?", "grantee_id?", "status?"]
    output: "Grant[]"
    side_effects: []

  - method: GET
    path: "/grants/{grantId}"
    description: "Get a Grant (includes recomputed vested_quantity, outstanding_quantity)"
    roles: [PlanAdministrator, BoardSecretary, ShareholderRegistrar, Grantee, AuditViewer]
    code: 200
    input: []
    output: Grant
    side_effects: ["vested_quantity recomputed against plan.current_clock_ts"]

  - method: POST
    path: "/grants/{grantId}/board-approve"
    description: "Record board approval (DRAFT→BOARD_APPROVED)"
    roles: [BoardSecretary]
    code: 200
    input: []
    output: Grant
    side_effects: ["plan.pool_reserved_options += Grant.quantity; AuditLogEntry appended"]

  - method: POST
    path: "/grants/{grantId}/shareholder-approve"
    description: "Record shareholder approval (BOARD_APPROVED→SHAREHOLDER_APPROVED)"
    roles: [ShareholderRegistrar]
    code: 200
    input: []
    output: Grant
    side_effects: ["Grant.grant_date := plan.current_clock_ts; TaxEventRecord(GRANT) appended"]

  - method: POST
    path: "/grants/{grantId}/sign-agreement"
    description: "Grantee signs agreement (SHAREHOLDER_APPROVED→AGREEMENT_SIGNED→{LIVE|FROZEN})"
    roles: [Grantee]
    code: 200
    input: ["require_live?"]
    output: Grant
    side_effects: ["Grant.pinned_price_version_id := latest version on this batch; LIVE if no blackout, FROZEN if blackout active (or ERR_BLACKOUT_ACTIVE if require_live=true)"]

  - method: POST
    path: "/grants/{grantId}/accelerate-vesting"
    description: "Apply acceleration on CHANGE_OF_CONTROL or IPO event"
    roles: [PlanAdministrator]
    code: 200
    input: [corporate_event_id]
    output: Grant
    side_effects: ["Appends a VestingRecord with cause=ACCELERATION_*; vested_quantity recomputed"]

  - method: POST
    path: "/grants/{grantId}/attest-performance"
    description: "Attest performance condition for a Grant (no-op if performance_condition_required=false)"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: Grant
    side_effects: ["Grant.performance_attested_at := plan.current_clock_ts"]

  - method: POST
    path: "/grants/{grantId}/vesting/recompute"
    description: "Manually recompute Grant.vested_quantity (and emit VestingRecord deltas if periodic boundaries crossed since last record)"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: Grant
    side_effects: ["New VestingRecord rows with cause IN {CLIFF, PERIODIC} appended for each crossed boundary"]

  - method: GET
    path: "/grants/{grantId}/vesting-records"
    description: "List VestingRecords (active and archived)"
    roles: [PlanAdministrator, Grantee, AuditViewer]
    code: 200
    input: ["archived?"]
    output: "VestingRecord[]"
    side_effects: []

  - method: POST
    path: "/grants/{grantId}/vesting-records/archive"
    description: "Archive all non-archived VestingRecords for a Grant (terminal-state housekeeping)"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: "VestingRecord[]"
    side_effects: ["VestingRecord.archived := true for all rows of this Grant"]

  # --- Exercise Windows ---
  - method: POST
    path: "/option-plans/{planId}/exercise-windows"
    description: "Create an ExerciseWindow"
    roles: [PlanAdministrator]
    code: 201
    input: [label, open_ts, close_ts]
    output: ExerciseWindow
    side_effects: ["status=SCHEDULED (becomes OPEN on next sweep if clock has crossed open_ts)"]

  - method: GET
    path: "/option-plans/{planId}/exercise-windows"
    description: "List exercise windows"
    roles: [PlanAdministrator, BoardSecretary, ShareholderRegistrar, Grantee, AuditViewer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "ExerciseWindow[]"
    side_effects: []

  - method: POST
    path: "/option-plans/{planId}/exercise-windows/sweep"
    description: "Run the window sweep — auto-transitions SCHEDULED→OPEN→CLOSED based on plan.current_clock_ts"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: "ExerciseWindow[]"
    side_effects: ["Each transition fires notification side-effect; CLOSED→ARCHIVED requires explicit /archive"]

  - method: POST
    path: "/option-plans/{planId}/exercise-windows/{windowId}/archive"
    description: "Archive a CLOSED ExerciseWindow"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: ExerciseWindow
    side_effects: []

  # --- Corporate Events & Exercise Price Versions ---
  - method: POST
    path: "/option-plans/{planId}/corporate-events"
    description: "Record a corporate event (split/dividend/restructure/blackout/CoC/IPO). For split/dividend/restructure, this cascades a new ExercisePriceVersion per affected batch."
    roles: [PlanAdministrator]
    code: 201
    input: [event_type, effective_ts, "blackout_end_ts?", "split_ratio_numerator?", "split_ratio_denominator?", "dividend_amount_cents?", "restructure_factor_bps?"]
    output: CorporateEvent
    side_effects: ["For each GrantBatch under this plan, append a new ExercisePriceVersion with cause IN {STOCK_SPLIT, CASH_DIVIDEND, RESTRUCTURING}; PRICE_VERSION_CREATED AuditLogEntry per batch"]

  - method: GET
    path: "/option-plans/{planId}/corporate-events"
    description: "List corporate events"
    roles: [PlanAdministrator, BoardSecretary, ShareholderRegistrar, AuditViewer]
    code: 200
    input: ["limit?", "offset?", "event_type?"]
    output: "CorporateEvent[]"
    side_effects: []

  - method: GET
    path: "/grant-batches/{batchId}/exercise-price-versions"
    description: "List the version chain for a batch, ordered by version_index"
    roles: [PlanAdministrator, Grantee, AuditViewer]
    code: 200
    input: []
    output: "ExercisePriceVersion[]"
    side_effects: []

  - method: POST
    path: "/exercise-price-versions/{versionId}/disclose"
    description: "Mark a price version as disclosed to grantees (sets disclosed_at)"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: ExercisePriceVersion
    side_effects: ["disclosed_at := plan.current_clock_ts; AuditLogEntry appended"]

  # --- Exercise Applications ---
  - method: POST
    path: "/grants/{grantId}/exercise-applications"
    description: "Submit an exercise application against an OPEN window"
    roles: [Grantee]
    code: 201
    input: [window_id, requested_quantity, settlement_mode, pinned_price_version_id]
    output: ExerciseApplication
    side_effects: ["status=SUBMITTED; gross_proceeds_cents pre-computed (not yet pinned)"]

  - method: GET
    path: "/option-plans/{planId}/exercise-applications"
    description: "List exercise applications"
    roles: [PlanAdministrator, BoardSecretary, ShareholderRegistrar, AuditViewer]
    code: 200
    input: ["limit?", "offset?", "grant_id?", "status?", "window_id?"]
    output: "ExerciseApplication[]"
    side_effects: []

  - method: POST
    path: "/exercise-applications/{appId}/verify"
    description: "Verify eligibility (SUBMITTED→ELIGIBILITY_VERIFIED); cascades to TAX_WITHHELD if CASH_SETTLEMENT"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: ExerciseApplication
    side_effects: ["For CASH_SETTLEMENT: also triggers ELIGIBILITY_VERIFIED→TAX_WITHHELD auto-transition; pins TaxEventRecord and withholding_tax_cents"]

  - method: POST
    path: "/exercise-applications/{appId}/pay"
    description: "Record payment for SHARE_ISSUANCE applications (ELIGIBILITY_VERIFIED→PAYMENT_RECEIVED→TAX_WITHHELD)"
    roles: [PlanAdministrator]
    code: 200
    input: [payment_reference]
    output: ExerciseApplication
    side_effects: ["gross_proceeds_cents pinned; auto-cascade to TAX_WITHHELD pins withholding_tax_cents"]

  - method: POST
    path: "/exercise-applications/{appId}/settle"
    description: "Settle the application (TAX_WITHHELD→SETTLED); requires share_registry_reference for SHARE_ISSUANCE, payment_reference for CASH_SETTLEMENT"
    roles: [PlanAdministrator]
    code: 200
    input: ["share_registry_reference?", "payment_reference?"]
    output: ExerciseApplication
    side_effects: ["Grant.exercised_quantity += requested_quantity; plan.pool_reserved_options -= requested_quantity; AuditLogEntry"]

  - method: POST
    path: "/exercise-applications/{appId}/reject"
    description: "Reject application (SUBMITTED or ELIGIBILITY_VERIFIED → REJECTED)"
    roles: [PlanAdministrator]
    code: 200
    input: ["reason?"]
    output: ExerciseApplication
    side_effects: ["AuditLogEntry appended"]

  - method: POST
    path: "/exercise-applications/{appId}/cancel"
    description: "Grantee cancels their own SUBMITTED application"
    roles: [Grantee]
    code: 200
    input: []
    output: ExerciseApplication
    side_effects: []

  # --- Tax Events ---
  - method: POST
    path: "/grants/{grantId}/tax-events"
    description: "Record an out-of-band tax event (typically SALE post-issuance)"
    roles: [PlanAdministrator]
    code: 201
    input: [event_type, "sale_proceeds_cents?", "cost_basis_cents?", "sold_quantity?"]
    output: TaxEventRecord
    side_effects: ["taxable_amount_cents, withheld_amount_cents, deferred computed"]

  - method: GET
    path: "/grants/{grantId}/tax-events"
    description: "List tax events for a Grant"
    roles: [PlanAdministrator, Grantee, AuditViewer]
    code: 200
    input: ["event_type?"]
    output: "TaxEventRecord[]"
    side_effects: []

  - method: POST
    path: "/tax-events/{eventId}/issue-document"
    description: "Issue a tax document (sets document_id)"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: TaxEventRecord
    side_effects: ["document_id := server-minted; AuditLogEntry appended"]

  # --- Departures ---
  - method: POST
    path: "/option-plans/{planId}/grantees/{granteeId}/departure-records"
    description: "Create a departure record (status=DRAFT)"
    roles: [PlanAdministrator]
    code: 201
    input: [departure_type, "leaver_class?", departed_ts]
    output: DepartureRecord
    side_effects: ["post_departure_window_days/deadline_ts computed per §1.3"]

  - method: POST
    path: "/grantees/{granteeId}/departure-records/{depId}/settle"
    description: "Finalize departure cascade (DRAFT→SETTLED): forfeit unvested, optionally forfeit vested for BAD_LEAVER, set Grantee.eligibility_status=DEPARTED"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: DepartureRecord
    side_effects: ["Grant SM cascade (LIVE/FROZEN→TERMINATED for BAD_LEAVER); ExerciseApplication cascade (non-terminal→REJECTED)"]

  - method: GET
    path: "/option-plans/{planId}/departure-records"
    description: "List departure records"
    roles: [PlanAdministrator, AuditViewer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "DepartureRecord[]"
    side_effects: []

  # --- Audit Log ---
  - method: GET
    path: "/option-plans/{planId}/audit-log"
    description: "Query AuditLogEntries (append-only)"
    roles: [PlanAdministrator, AuditViewer]
    code: 200
    input: ["limit?", "offset?", "action_code?", "target_entity?", "target_id?"]
    output: "AuditLogEntry[]"
    side_effects: []

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing or empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource not found (planId, batchId, granteeId, grantId, windowId, appId, depId, eventId, versionId)" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Request body fails schema or domain-shape validation (negative pool, settlement_mode mismatch, missing payment_reference, etc.)" }
  - { id: ERR_VERSION_MISMATCH, http: 409, condition: "Supplied `version` does not match current resource version" }
  - { id: ERR_CROSS_RESOURCE_MISMATCH, http: 422, condition: "Nested path IDs are inconsistent across entities" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "Operation requires OptionPlan in ACTIVE status" }
  - { id: ERR_BATCH_NOT_OPEN, http: 409, condition: "Operation requires GrantBatch in OPEN_FOR_GRANTS status" }
  - { id: ERR_GRANT_NOT_IN_DRAFT, http: 409, condition: "Operation requires Grant in DRAFT" }
  - { id: ERR_GRANT_NOT_BOARD_APPROVED, http: 409, condition: "Operation requires Grant in BOARD_APPROVED" }
  - { id: ERR_GRANT_NOT_SHAREHOLDER_APPROVED, http: 409, condition: "Operation requires Grant in SHAREHOLDER_APPROVED" }
  - { id: ERR_GRANT_NOT_LIVE, http: 409, condition: "Operation requires Grant in LIVE" }
  - { id: ERR_WINDOW_NOT_OPEN, http: 409, condition: "ExerciseWindow not in OPEN status" }
  - { id: ERR_WINDOW_NOT_CLOSED, http: 409, condition: "ExerciseWindow not in CLOSED status (archive precondition)" }
  - { id: ERR_DEPARTURE_NOT_DRAFT, http: 409, condition: "DepartureRecord must be DRAFT to /settle" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Same X-User-ID attempted two distinct approval roles on the same Grant" }
  - { id: ERR_POOL_INSUFFICIENT, http: 402, condition: "Grant.quantity exceeds plan.pool_remaining_options at board approval" }
  - { id: ERR_INSUFFICIENT_VESTED_QUANTITY, http: 409, condition: "requested_quantity exceeds Grant.vested_quantity - Grant.exercised_quantity" }
  - { id: ERR_PERFORMANCE_CONDITION_NOT_MET, http: 409, condition: "Grant has performance_condition_required=true but performance_attested_at is null" }
  - { id: ERR_BLACKOUT_ACTIVE, http: 409, condition: "Active *_BLACKOUT CorporateEvent overlaps current operation" }
  - { id: ERR_BLACKOUT_OVERLAPS_WINDOW, http: 409, condition: "Half-open intersection between exercise window and blackout interval is non-empty" }
  - { id: ERR_INVALID_TIME_INTERVAL, http: 422, condition: "open_ts >= close_ts, blackout_end_ts <= effective_ts, or required acceleration event missing" }
  - { id: ERR_NOT_IN_EXERCISE_WINDOW, http: 409, condition: "ExerciseApplication submitted outside an OPEN window or past post-departure deadline" }
  - { id: ERR_GRANTEE_INELIGIBLE, http: 403, condition: "Grantee.eligibility_status != ELIGIBLE for an operation that requires active employment" }
  - { id: ERR_GRANTEE_ALREADY_DEPARTED, http: 409, condition: "Departure /settle invoked on a Grantee already DEPARTED" }
  - { id: ERR_BAD_LEAVER_REQUIRES_TERMINATION, http: 422, condition: "leaver_class=BAD_LEAVER supplied with departure_type != TERMINATION" }
  - { id: ERR_PENDING_GRANTS_EXIST, http: 409, condition: "Plan close or batch lock blocked by non-terminal Grants" }
  - { id: ERR_OPEN_EXERCISES_EXIST, http: 409, condition: "Plan close or window archive blocked by non-terminal ExerciseApplications" }
  - { id: ERR_STALE_PRICE_VERSION, http: 409, condition: "ExerciseApplication.pinned_price_version_id does not match Grant.pinned_price_version_id (client read stale price)" }

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix
# -----------------------------------------------------------------------------
roles:

  - name: PlanAdministrator
    description: "Operational administrator of the option plan. Drafts grants, configures batches/windows, runs sweeps, advances clock, records corporate events, settles exercises, and finalizes departures. Cannot perform board or shareholder approval."
    identity: opaque
    exclusive_operations:
      - "POST /option-plans"
      - "POST /option-plans/{planId}/activate"
      - "POST /option-plans/{planId}/close"
      - "POST /option-plans/{planId}/clock/advance"
      - "POST /option-plans/{planId}/grant-batches"
      - "POST /option-plans/{planId}/grant-batches/{batchId}/open"
      - "POST /option-plans/{planId}/grant-batches/{batchId}/lock"
      - "POST /option-plans/{planId}/grantees"
      - "POST /option-plans/{planId}/grant-batches/{batchId}/grants"
      - "POST /grants/{grantId}/accelerate-vesting"
      - "POST /grants/{grantId}/attest-performance"
      - "POST /grants/{grantId}/vesting/recompute"
      - "POST /grants/{grantId}/vesting-records/archive"
      - "POST /option-plans/{planId}/exercise-windows"
      - "POST /option-plans/{planId}/exercise-windows/sweep"
      - "POST /option-plans/{planId}/exercise-windows/{windowId}/archive"
      - "POST /option-plans/{planId}/corporate-events"
      - "POST /exercise-price-versions/{versionId}/disclose"
      - "POST /exercise-applications/{appId}/verify"
      - "POST /exercise-applications/{appId}/pay"
      - "POST /exercise-applications/{appId}/settle"
      - "POST /exercise-applications/{appId}/reject"
      - "POST /grants/{grantId}/tax-events"
      - "POST /tax-events/{eventId}/issue-document"
      - "POST /option-plans/{planId}/grantees/{granteeId}/departure-records"
      - "POST /grantees/{granteeId}/departure-records/{depId}/settle"
    shared_operations:
      - "All GET endpoints (read access)"

  - name: BoardSecretary
    description: "Records board approval decisions. Cannot draft or shareholder-approve. Operator identity (not tied to an entity)."
    identity: opaque
    exclusive_operations:
      - "POST /grants/{grantId}/board-approve"
    shared_operations:
      - "All GET endpoints"

  - name: ShareholderRegistrar
    description: "Records shareholder approval decisions. Cannot draft or board-approve. Operator identity."
    identity: opaque
    exclusive_operations:
      - "POST /grants/{grantId}/shareholder-approve"
    shared_operations:
      - "All GET endpoints"

  - name: Grantee
    description: "Option recipient. X-User-ID equals the Grantee.hr_employee_id of one persisted Grantee row."
    identity: "entity_backed:Grantee"
    exclusive_operations:
      - "POST /grants/{grantId}/sign-agreement"
      - "POST /grants/{grantId}/exercise-applications"
      - "POST /exercise-applications/{appId}/cancel"
    shared_operations:
      - "GET /grants/{grantId} (only own grants)"
      - "GET /grants/{grantId}/vesting-records (only own)"
      - "GET /grants/{grantId}/tax-events (only own)"
      - "GET /grant-batches/{batchId}/exercise-price-versions"
      - "GET /option-plans/{planId}/exercise-windows"

  - name: AuditViewer
    description: "Read-only role for compliance auditors. No write access; can read all audit log entries and resource lists."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints (including /option-plans/{planId}/audit-log)"
