            - "${err} == ERR_CONDITIONING_PARTY_VETO with HTTP 422, not ERR_SUPPORT_THRESHOLD_NOT_MET"
            - "${st_mid} == CIRCULATED and ${sup_mid} == null (the rejected EXECUTE persisted nothing)"
            - "${st_after} == NEGOTIATING with ${rn_after} == 2 and ${tvw} == 6"
            - "${sup_after} == 83.33 (50.00 for ${sig_t} plus 33.33 for ${sig_n})"
            - "the two SUPPORT rows carry ${share0} and ${share1} equal to 50.00 and 33.33 in some order"
            - "PmeMeasure rows of the settlement stay PROPOSED and RelicensingProject.${proj}.total_pme_annual_cost_usd == 0"

      - name: plan_approval_blocked_until_the_mandatory_comment_is_resolved
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=50]
          - validations[priority=45]
          - errors[ERR_UNRESOLVED_MANDATORY_COMMENTS]
          - errors[ERR_COMMENT_ALREADY_RESOLVED]
        distinguishing_aspect: "Approval depends on a counter maintained by a different entity's lifecycle; resolving the comment clears it and the same determination then succeeds, while a second resolve of the same comment is rejected without touching the counters."
        test_recipe:
          setup:
            - "Project at STUDY_PHASE with a plan carrying one study and one OPEN mandatory comment from the conditioning agency."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9037", project_name: "Mandatory Comment Reach", installed_capacity_mw: 9.0, base_annual_generation_mwh: 50000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id }
            - call: "POST /relicensing/sites"
              payload: { project_id: "${proj}", site_code: "S1", river_mile: 1.0 }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { site: $.data.id }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "PAD" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/study-plans"
              payload: { project_id: "${proj}", plan_title: "Study Plan 1" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { plan: $.data.id }
            - call: "POST /relicensing/studies"
              payload: { study_plan_id: "${plan}", site_id: "${site}", resource_category: "FISH_PASSAGE", study_title: "Fish passage assessment", fieldwork_window_start: "2026-09-01", fieldwork_window_end: "2026-10-01" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/parties"
              payload: { project_id: "${proj}", party_name: "State Fish Agency", party_type: "AGENCY", has_conditioning_authority: true, vote_weight: 1, contact_user_id: "u_agency" }
              as: Regulator
              captures: { party: $.data.id }
            - call: "POST /relicensing/comments"
              payload: { study_plan_id: "${plan}", party_id: "${party}", resource_category: "FISH_PASSAGE", comment_text: "Add a downstream passage study" }
              as: AgencyReviewer
              as_user_id: "u_agency"
              captures: { cmt: $.data.id, mand: $.data.is_mandatory_condition }
            - call: "POST /relicensing/study-plans/${plan}/submit"
              payload: { submission_note: "plan for review" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { st_sub: $.data.status, unres: $.data.unresolved_mandatory_comment_count }
          trigger:
            - call: "POST /relicensing/study-plans/${plan}/determination"
              payload: { determination: "APPROVE" }
              as: AgencyReviewer
              as_user_id: "u_agency"
              captures: { err: $.data.error_id }
            - call: "POST /relicensing/comments/${cmt}/resolve"
              payload: { disposition: "ADOPTED", resolution_note: "study added" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { c_st: $.data.resolution_status, c_disp: $.data.disposition }
            - call: "POST /relicensing/comments/${cmt}/resolve"
              payload: { disposition: "REJECTED", resolution_note: "changed our mind" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { err2: $.data.error_id }
            - call: "POST /relicensing/study-plans/${plan}/determination"
              payload: { determination: "APPROVE" }
              as: AgencyReviewer
              as_user_id: "u_agency"
              captures: { st_final: $.data.status, appr: $.data.approved_at, unres_final: $.data.unresolved_mandatory_comment_count, open_final: $.data.open_comment_count }
            - call: "GET /relicensing/projects/${proj}"
              payload: {}
              as: Regulator
              captures: { p_unres: $.data.unresolved_mandatory_comment_count, posture: $.data.regulatory_posture }
          assert:
            - "${mand} == true (the comment comes from a conditioning-authority party) and ${st_sub} == UNDER_AGENCY_REVIEW with ${unres} == 1"
            - "${err} == ERR_UNRESOLVED_MANDATORY_COMMENTS with HTTP 409 and the plan stays UNDER_AGENCY_REVIEW with approved_at null"
            - "${c_st} == RESOLVED and ${c_disp} == ADOPTED"
            - "${err2} == ERR_COMMENT_ALREADY_RESOLVED with HTTP 409 and ConsultationComment.${cmt}.disposition stays ADOPTED"
            - "${st_final} == APPROVED with ${appr} == 2026-08-01T00:00:00Z, ${unres_final} == 0 and ${open_final} == 0"
            - "${p_unres} == 0 and ${posture} == OPEN (the project leaves RESTRICTED with the last mandatory comment)"

      - name: prerequisite_cycle_and_self_reference_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=58]
          - errors[ERR_PREREQUISITE_CYCLE]
        distinguishing_aspect: "The acyclicity check runs on PATCH as well as on creation and treats a one-hop back edge and a self reference identically, leaving the stored graph untouched."
        test_recipe:
          setup:
            - "Project with pad_year 2026 and two INCLUDED AGENCY_PRESCRIPTION measures where B lists A as its prerequisite."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9038", project_name: "Cycle Reach", installed_capacity_mw: 24.0, base_annual_generation_mwh: 250000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "PAD" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/pme-measures"
              payload: { project_id: "${proj}", measure_name: "Upstream collector", resource_category: "FISH_PASSAGE", source: "AGENCY_PRESCRIPTION", capital_cost_usd: 600000.00, annual_om_cost_usd: 20000.00, construction_start_year: 2026, implementation_months: 6, flow_release_cfs: 40, gross_head_ft: 60, release_days: 120 }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { m_a: $.data.id, a_prereq: $.data.prerequisite_measure_id }
            - call: "POST /relicensing/pme-measures"
              payload: { project_id: "${proj}", prerequisite_measure_id: "${m_a}", measure_name: "Downstream bypass", resource_category: "FISH_PASSAGE", source: "AGENCY_PRESCRIPTION", capital_cost_usd: 600000.00, annual_om_cost_usd: 20000.00, construction_start_year: 2026, implementation_months: 9, flow_release_cfs: 40, gross_head_ft: 60, release_days: 120 }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { m_b: $.data.id, b_prereq: $.data.prerequisite_measure_id, b_ver: $.data.version }
          trigger:
            - call: "PATCH /relicensing/pme-measures/${m_a}"
              payload: { prerequisite_measure_id: "${m_b}" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { err_cycle: $.data.error_id }
            - call: "PATCH /relicensing/pme-measures/${m_b}"
              payload: { prerequisite_measure_id: "${m_b}" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { err_self: $.data.error_id }
            - call: "PATCH /relicensing/pme-measures/${m_b}"
              payload: { measure_name: "Downstream bypass and screen" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { b_name: $.data.measure_name, b_ver2: $.data.version, b_prereq2: $.data.prerequisite_measure_id }
          assert:
            - "${a_prereq} == null and ${b_prereq} == ${m_a}"
            - "${err_cycle} == ERR_PREREQUISITE_CYCLE with HTTP 422 and PmeMeasure.${m_a}.prerequisite_measure_id stays null"
            - "${err_self} == ERR_PREREQUISITE_CYCLE with HTTP 422 and ${b_ver} is unchanged by the two rejections"
            - "${b_name} == Downstream bypass and screen with ${b_ver2} == ${b_ver} + 1 and ${b_prereq2} == ${m_a}"

      - name: pad_filed_after_the_due_date_rejected_then_the_sweep_freezes_the_project
        claim_type: priority_ordering
        grounds:
          - validations[priority=63]
          - validations[priority=42]
          - calculations.relicensing_timeline_posture
        distinguishing_aspect: "The deadline rule at priority 63 is evaluated against the live clock while the posture gate at priority 42 reads the stored posture, so a project whose posture is still a stale OPEN reports ERR_FILING_DEADLINE_PASSED and the very same call reports ERR_PROJECT_POSTURE_FROZEN once a sweep refreshes the posture."
        test_recipe:
          setup:
            - "Project created at clock 2026-08-01 with license_expiration_date 2033-12-31, so pad_due_date is 2028-06-30 and the stored timeline_posture is ON_TRACK."
            - "The clock is moved to 2028-07-01 without running a sweep, so the stored posture is stale."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9039", project_name: "Missed Deadline Reach", installed_capacity_mw: 9.0, base_annual_generation_mwh: 50000, license_expiration_date: "2033-12-31" }
              as: Regulator
              captures: { proj: $.data.id, tl0: $.data.timeline_posture, posture0: $.data.regulatory_posture }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-07-01T00:00:00Z" }
              as: Regulator
          trigger:
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "late PAD" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { err_deadline: $.data.error_id }
            - call: "GET /relicensing/projects/${proj}"
              payload: {}
              as: Regulator
              captures: { stage_mid: $.data.stage, tl_mid: $.data.timeline_posture, posture_mid: $.data.regulatory_posture }
            - call: "POST /relicensing/projects/${proj}/run-compliance-sweep"
              payload: {}
              as: Regulator
              captures: { tl_after: $.data.timeline_posture, posture_after: $.data.regulatory_posture }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "late PAD again" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { err_frozen: $.data.error_id }
          assert:
            - "${tl0} == ON_TRACK and ${posture0} == OPEN at creation (slack 699 days to 2028-06-30)"
            - "${err_deadline} == ERR_FILING_DEADLINE_PASSED with HTTP 409 (slack -1 against the live clock)"
            - "${stage_mid} == PRE_FILING, ${tl_mid} == ON_TRACK and ${posture_mid} == OPEN (a rejected request recomputes nothing)"
            - "${tl_after} == DELINQUENT and ${posture_after} == FROZEN after the sweep"
            - "${err_frozen} == ERR_PROJECT_POSTURE_FROZEN with HTTP 409, because priority 42 now precedes priority 63"
            - "RelicensingProject.${proj}.pad_filed_at == null and pad_year == null throughout"

