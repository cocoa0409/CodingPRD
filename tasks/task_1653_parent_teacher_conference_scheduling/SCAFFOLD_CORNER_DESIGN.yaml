# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_1653_parent_teacher_conference_scheduling
# Standard fixture shorthand used below: window L=20, B=5, travel=30,
# day 2026-10-05 15:00-19:00Z -> 8 slots/teacher (starts 15:00, 15:25, 15:50,
# 16:15, 16:55, 17:20, 17:45, 18:10); open 2026-09-01, close 2026-10-01.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_window_with_all_required_fields_returns_201
        claim_type: creation
        grounds: ["endpoints[POST /conf/windows]", "entities.ConferenceWindow"]
        distinguishing_aspect: "Create with all required fields returns 201, status DRAFT, version 1, counters 0."
        test_recipe:
          setup: ["empty DB; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /conf/windows"
              payload: { name: "Fall", term_label: "2026-FALL", format: "ELEMENTARY", slot_length_minutes: 20, buffer_minutes: 5, travel_minutes: 30, day_windows: [{ date: "2026-10-05", start_at: "2026-10-05T15:00:00Z", end_at: "2026-10-05T19:00:00Z" }], booking_open_at: "2026-09-01T00:00:00Z", booking_close_at: "2026-10-01T00:00:00Z", teacher_daily_conf_cap: 6, family_conf_cap: 8, cancel_cutoff_hours: 24, waitlist_offer_ttl_hours: 24, no_show_strike_threshold: 3, auto_no_show_grace_hours: 24 }
              as: SchoolAdmin
          assert:
            - "HTTP 201; data.status == DRAFT; data.version == 1"
            - "data.slots_total_count == 0 and data.bookings_confirmed_count == 0 and data.ops_run_index == 0"
            - "data.id is a UUID; created_at == updated_at"

      - name: create_window_missing_required_name_rejected
        claim_type: required_fields
        grounds: ["entities.ConferenceWindow.fields.name", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required input field name yields ERR_VALIDATION 422."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /conf/windows"
              payload: { term_label: "2026-FALL", format: "ELEMENTARY", slot_length_minutes: 20, buffer_minutes: 5, travel_minutes: 30, day_windows: [{ date: "2026-10-05", start_at: "2026-10-05T15:00:00Z", end_at: "2026-10-05T19:00:00Z" }], booking_open_at: "2026-09-01T00:00:00Z", booking_close_at: "2026-10-01T00:00:00Z", teacher_daily_conf_cap: 6 }
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert: ["error_id == ERR_VALIDATION, HTTP 422"]

      - name: create_window_invalid_format_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.ConferenceWindow.fields.format", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "format outside {ELEMENTARY, SECONDARY} yields ERR_VALIDATION."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /conf/windows"
              payload: { name: "Fall", term_label: "2026-FALL", format: "MIDDLE", slot_length_minutes: 20, buffer_minutes: 5, travel_minutes: 30, day_windows: [{ date: "2026-10-05", start_at: "2026-10-05T15:00:00Z", end_at: "2026-10-05T19:00:00Z" }], booking_open_at: "2026-09-01T00:00:00Z", booking_close_at: "2026-10-01T00:00:00Z", teacher_daily_conf_cap: 6 }
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert: ["error_id == ERR_VALIDATION, HTTP 422"]

      - name: create_student_grade_out_of_range_rejected
        claim_type: type_constraints
        grounds: ["entities.Student.fields.grade_level", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "grade_level 13 (> 12) yields ERR_VALIDATION."
        test_recipe:
          setup: ["family F exists"]
          setup_api_calls:
            - { call: "POST /conf/families", payload: { primary_guardian_name: "G", email: "g@x.com" }, as: FrontOfficeStaff, captures: { fam: $.data.id } }
          trigger:
            - { call: "POST /conf/families/${fam}/students", payload: { full_name: "S", grade_level: 13 }, as: FrontOfficeStaff, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_VALIDATION, HTTP 422"]

      - name: window_optional_defaults_applied
        claim_type: defaults
        grounds: [entities.ConferenceWindow.fields.family_conf_cap, entities.ConferenceWindow.fields.cancel_cutoff_hours, entities.ConferenceWindow.fields.waitlist_offer_ttl_hours]
        distinguishing_aspect: "Omitted optional config fields default to 8 / 24 / 24 / 3 / 24."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /conf/windows"
              payload: { name: "Fall", term_label: "2026-FALL", format: "SECONDARY", slot_length_minutes: 15, buffer_minutes: 5, travel_minutes: 25, day_windows: [{ date: "2026-10-06", start_at: "2026-10-06T15:00:00Z", end_at: "2026-10-06T18:00:00Z" }], booking_open_at: "2026-09-01T00:00:00Z", booking_close_at: "2026-10-01T00:00:00Z", teacher_daily_conf_cap: 5 }
              as: SchoolAdmin
          assert:
            - "data.family_conf_cap == 8"
            - "data.cancel_cutoff_hours == 24"
            - "data.waitlist_offer_ttl_hours == 24"
            - "data.no_show_strike_threshold == 3"
            - "data.auto_no_show_grace_hours == 24"

      - name: create_family_extraneous_status_input_ignored
        claim_type: system_fields
        grounds: [entities.Family.fields.status]
        distinguishing_aspect: "Client-supplied system field status is ignored; server stamps ACTIVE and version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /conf/families", payload: { primary_guardian_name: "G", email: "g@x.com", status: "RESTRICTED" }, as: FrontOfficeStaff }
          assert:
            - "HTTP 201; data.status == ACTIVE (input ignored, not rejected)"
            - "data.no_show_strike_count == 0 and data.attendance_risk_score == 0.00 and data.version == 1"

      - name: get_window_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "endpoints[GET /conf/windows/{id}]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID yields ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /conf/windows/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: SchoolAdmin, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_NOT_FOUND, HTTP 404"]

      - name: create_student_unknown_family_returns_404
        claim_type: parent_relationships
        grounds: ["entities.Student.fields.family_id", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Nested create under a non-existent parent family yields ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /conf/families/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/students", payload: { full_name: "S", grade_level: 3 }, as: FrontOfficeStaff, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_NOT_FOUND, HTTP 404"]

      - name: slots_list_pagination_fields
        claim_type: listing
        grounds: ["response_envelope", "endpoints[GET /conf/windows/{id}/slots]"]
        distinguishing_aspect: "List responses carry limit/offset/total_count/has_more; limit 3 over 8 slots pages deterministically by start_at ASC."
        test_recipe:
          setup: ["window PUBLISHED with teacher T1 and 8 generated slots"]
          setup_api_calls:
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SchoolAdmin }
            - call: "POST /conf/windows"
              payload: { name: "Fall", term_label: "2026-FALL", format: "ELEMENTARY", slot_length_minutes: 20, buffer_minutes: 5, travel_minutes: 30, day_windows: [{ date: "2026-10-05", start_at: "2026-10-05T15:00:00Z", end_at: "2026-10-05T19:00:00Z" }], booking_open_at: "2026-09-01T00:00:00Z", booking_close_at: "2026-10-01T00:00:00Z", teacher_daily_conf_cap: 6 }
              as: SchoolAdmin
              captures: { w: $.data.id, w_v1: $.data.version }
            - { call: "POST /conf/teachers", payload: { full_name: "T1", email: "t1@x.edu", grade_band: "ELEMENTARY", subjects: [], supports_in_person: true }, as: SchoolAdmin, captures: { t1: $.data.id } }
            - { call: "POST /conf/windows/${w}/publish", payload: {}, as: SchoolAdmin, captures: { w_v2: $.data.version } }
            - { call: "POST /conf/windows/${w}/generate-slots", payload: { expected_window_version: "${w_v2}" }, as: SchoolAdmin }
          trigger:
            - { call: "GET /conf/windows/${w}/slots", payload: { limit: 3, offset: 6 }, as: SchoolAdmin }
          assert:
            - "response data is an array of length 2 (slots 7 and 8 of 8)"
            - "pagination fields: total_count == 8, limit == 3, offset == 6, has_more == false"
            - "repeating with limit 3 offset 0 returns the first 3 slots and has_more == true"

      - name: attendance_record_has_no_version_field
        claim_type: immutability
        grounds: [entities.AttendanceRecord]
        distinguishing_aspect: "common_fields: false entity carries id and created_at only — no version, no updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["window IN_PROGRESS; booking b1 CONFIRMED on slot 0; clock 2026-10-05T15:30:00Z"]
          setup_api_calls:
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SchoolAdmin }
            - call: "POST /conf/windows"
              payload: { name: "Fall", term_label: "2026-FALL", format: "ELEMENTARY", slot_length_minutes: 20, buffer_minutes: 5, travel_minutes: 30, day_windows: [{ date: "2026-10-05", start_at: "2026-10-05T15:00:00Z", end_at: "2026-10-05T19:00:00Z" }], booking_open_at: "2026-09-01T00:00:00Z", booking_close_at: "2026-10-01T00:00:00Z", teacher_daily_conf_cap: 6 }
              as: SchoolAdmin
              captures: { w: $.data.id, w_v1: $.data.version }
            - { call: "POST /conf/teachers", payload: { full_name: "T1", email: "t1@x.edu", grade_band: "ELEMENTARY", subjects: [], supports_in_person: true }, as: SchoolAdmin, captures: { t1: $.data.id } }
            - { call: "POST /conf/windows/${w}/publish", payload: {}, as: SchoolAdmin, captures: { w_v2: $.data.version } }
            - { call: "POST /conf/windows/${w}/generate-slots", payload: { expected_window_version: "${w_v2}" }, as: SchoolAdmin }
            - { call: "GET /conf/windows/${w}/slots", as: SchoolAdmin, captures: { s0: "$.data[0].id" } }
            - { call: "POST /conf/windows/${w}/open-booking", payload: {}, as: SchoolAdmin }
            - { call: "POST /conf/families", payload: { primary_guardian_name: "G", email: "g@x.com" }, as: FrontOfficeStaff, captures: { fam: $.data.id } }
            - { call: "POST /conf/families/${fam}/students", payload: { full_name: "S1", grade_level: 3 }, as: FrontOfficeStaff, captures: { st1: $.data.id } }
            - { call: "POST /conf/students/${st1}/teacher-links", payload: { teacher_id: "${t1}", is_homeroom: true }, as: FrontOfficeStaff }
            - { call: "POST /conf/bookings", payload: { slot_id: "${s0}", student_id: "${st1}", channel: "IN_PERSON" }, as: FamilyGuardian, as_user_id: "${fam}", captures: { b1: $.data.id } }
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-10-02T00:00:00Z" }, as: SchoolAdmin }
            - { call: "POST /conf/windows/${w}/lock", payload: {}, as: SchoolAdmin }
            - { call: "POST /conf/windows/${w}/start", payload: {}, as: SchoolAdmin }
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-10-05T15:30:00Z" }, as: SchoolAdmin }
          trigger:
            - { call: "POST /conf/bookings/${b1}/attendance", payload: { outcome: "ATTENDED" }, as: FrontOfficeStaff }
            - { call: "GET /conf/attendance-records", payload: { booking_id: "${b1}" }, as: FrontOfficeStaff, captures: { rec_id: "$.data[0].id" } }
          assert:
            - "exactly one AttendanceRecord exists for b1 with outcome == ATTENDED and marked_by_role == FrontOfficeStaff"
            - "the record object has no `version` key and no `updated_at` key (append-only, common_fields false)"

  - section: state_machines
    instances:
      - name: window_initial_state_draft
        claim_type: initial_state
        grounds: [state_machines.ConferenceWindow]
        distinguishing_aspect: "Newly created window starts in DRAFT with ops_run_index 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /conf/windows"
              payload: { name: "Fall", term_label: "2026-FALL", format: "ELEMENTARY", slot_length_minutes: 20, buffer_minutes: 5, travel_minutes: 30, day_windows: [{ date: "2026-10-05", start_at: "2026-10-05T15:00:00Z", end_at: "2026-10-05T19:00:00Z" }], booking_open_at: "2026-09-01T00:00:00Z", booking_close_at: "2026-10-01T00:00:00Z", teacher_daily_conf_cap: 6 }
              as: SchoolAdmin
          assert: ["data.status == DRAFT and data.ops_run_index == 0"]

      - name: republish_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.ConferenceWindow.PUBLISHED", "errors[ERR_INVALID_WINDOW_STATE]"]
        distinguishing_aspect: "publish from PUBLISHED (not DRAFT) is rejected with ERR_INVALID_WINDOW_STATE."
        test_recipe:
          setup: ["window PUBLISHED"]
          setup_api_calls:
            - call: "POST /conf/windows"
              payload: { name: "Fall", term_label: "2026-FALL", format: "ELEMENTARY", slot_length_minutes: 20, buffer_minutes: 5, travel_minutes: 30, day_windows: [{ date: "2026-10-05", start_at: "2026-10-05T15:00:00Z", end_at: "2026-10-05T19:00:00Z" }], booking_open_at: "2026-09-01T00:00:00Z", booking_close_at: "2026-10-01T00:00:00Z", teacher_daily_conf_cap: 6 }
              as: SchoolAdmin
              captures: { w: $.data.id }
            - { call: "POST /conf/windows/${w}/publish", payload: {}, as: SchoolAdmin }
          trigger:
            - { call: "POST /conf/windows/${w}/publish", payload: {}, as: SchoolAdmin, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_WINDOW_STATE, HTTP 409; window remains PUBLISHED"]

      - name: archive_before_complete_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ConferenceWindow]
        distinguishing_aspect: "archive from BOOKING_OPEN (skipping lock/start/complete) is rejected."
        test_recipe:
          setup: ["window BOOKING_OPEN with slots"]
          setup_api_calls:
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SchoolAdmin }
            - call: "POST /conf/windows"
              payload: { name: "Fall", term_label: "2026-FALL", format: "ELEMENTARY", slot_length_minutes: 20, buffer_minutes: 5, travel_minutes: 30, day_windows: [{ date: "2026-10-05", start_at: "2026-10-05T15:00:00Z", end_at: "2026-10-05T19:00:00Z" }], booking_open_at: "2026-09-01T00:00:00Z", booking_close_at: "2026-10-01T00:00:00Z", teacher_daily_conf_cap: 6 }
              as: SchoolAdmin
              captures: { w: $.data.id, w_v1: $.data.version }
            - { call: "POST /conf/teachers", payload: { full_name: "T1", email: "t1@x.edu", grade_band: "ELEMENTARY", subjects: [], supports_in_person: true }, as: SchoolAdmin }
            - { call: "POST /conf/windows/${w}/publish", payload: {}, as: SchoolAdmin, captures: { w_v2: $.data.version } }
            - { call: "POST /conf/windows/${w}/generate-slots", payload: { expected_window_version: "${w_v2}" }, as: SchoolAdmin }
            - { call: "POST /conf/windows/${w}/open-booking", payload: {}, as: SchoolAdmin }
          trigger:
            - { call: "POST /conf/windows/${w}/archive", payload: {}, as: SchoolAdmin, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_WINDOW_STATE, HTTP 409"]

      - name: archived_window_is_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ConferenceWindow]
        distinguishing_aspect: "From ARCHIVED no further transition is possible (start attempt rejected); reaching ARCHIVED requires the full DRAFT->...->COMPLETED walk."
        test_recipe:
          setup: ["window walked to ARCHIVED (no bookings, no outreach tasks)"]
          setup_api_calls:
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SchoolAdmin }
            - call: "POST /conf/windows"
              payload: { name: "Fall", term_label: "2026-FALL", format: "ELEMENTARY", slot_length_minutes: 20, buffer_minutes: 5, travel_minutes: 30, day_windows: [{ date: "2026-10-05", start_at: "2026-10-05T15:00:00Z", end_at: "2026-10-05T19:00:00Z" }], booking_open_at: "2026-09-01T00:00:00Z", booking_close_at: "2026-10-01T00:00:00Z", teacher_daily_conf_cap: 6 }
              as: SchoolAdmin
              captures: { w: $.data.id, w_v1: $.data.version }
            - { call: "POST /conf/teachers", payload: { full_name: "T1", email: "t1@x.edu", grade_band: "ELEMENTARY", subjects: [], supports_in_person: true }, as: SchoolAdmin }
            - { call: "POST /conf/windows/${w}/publish", payload: {}, as: SchoolAdmin, captures: { w_v2: $.data.version } }
            - { call: "POST /conf/windows/${w}/generate-slots", payload: { expected_window_version: "${w_v2}" }, as: SchoolAdmin }
            - { call: "POST /conf/windows/${w}/open-booking", payload: {}, as: SchoolAdmin }
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-10-02T00:00:00Z" }, as: SchoolAdmin }
            - { call: "POST /conf/windows/${w}/lock", payload: {}, as: SchoolAdmin }
            - { call: "POST /conf/windows/${w}/start", payload: {}, as: SchoolAdmin }
            - { call: "POST /conf/windows/${w}/complete", payload: {}, as: SchoolAdmin }
            - { call: "POST /conf/windows/${w}/archive", payload: {}, as: SchoolAdmin, captures: { final_status: $.data.status } }
          trigger:
            - { call: "POST /conf/windows/${w}/start", payload: {}, as: SchoolAdmin, captures: { err: $.data.error_id } }
          assert:
            - "archive succeeded with status ARCHIVED"
            - "start from ARCHIVED rejected with error_id == ERR_INVALID_WINDOW_STATE"

      - name: cancel_already_cancelled_booking_rejected
        claim_type: idempotency
        grounds: [state_machines.Booking]
        distinguishing_aspect: "Second cancel of a CANCELLED booking is rejected with ERR_INVALID_STATE (no silent re-apply, no double side effects)."
        test_recipe:
          setup: ["window BOOKING_OPEN; booking b1 CONFIRMED on slot 0"]
          setup_api_calls:
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SchoolAdmin }
            - call: "POST /conf/windows"
              payload: { name: "Fall", term_label: "2026-FALL", format: "ELEMENTARY", slot_length_minutes: 20, buffer_minutes: 5, travel_minutes: 30, day_windows: [{ date: "2026-10-05", start_at: "2026-10-05T15:00:00Z", end_at: "2026-10-05T19:00:00Z" }], booking_open_at: "2026-09-01T00:00:00Z", booking_close_at: "2026-10-01T00:00:00Z", teacher_daily_conf_cap: 6 }
              as: SchoolAdmin
              captures: { w: $.data.id, w_v1: $.data.version }
            - { call: "POST /conf/teachers", payload: { full_name: "T1", email: "t1@x.edu", grade_band: "ELEMENTARY", subjects: [], supports_in_person: true }, as: SchoolAdmin, captures: { t1: $.data.id } }
            - { call: "POST /conf/windows/${w}/publish", payload: {}, as: SchoolAdmin, captures: { w_v2: $.data.version } }
            - { call: "POST /conf/windows/${w}/generate-slots", payload: { expected_window_version: "${w_v2}" }, as: SchoolAdmin }
            - { call: "GET /conf/windows/${w}/slots", as: SchoolAdmin, captures: { s0: "$.data[0].id" } }
            - { call: "POST /conf/windows/${w}/open-booking", payload: {}, as: SchoolAdmin }
            - { call: "POST /conf/families", payload: { primary_guardian_name: "G", email: "g@x.com" }, as: FrontOfficeStaff, captures: { fam: $.data.id } }
            - { call: "POST /conf/families/${fam}/students", payload: { full_name: "S1", grade_level: 3 }, as: FrontOfficeStaff, captures: { st1: $.data.id } }
            - { call: "POST /conf/students/${st1}/teacher-links", payload: { teacher_id: "${t1}", is_homeroom: true }, as: FrontOfficeStaff }
            - { call: "POST /conf/bookings", payload: { slot_id: "${s0}", student_id: "${st1}", channel: "IN_PERSON" }, as: FamilyGuardian, as_user_id: "${fam}", captures: { b1: $.data.id } }
          trigger:
            - { call: "POST /conf/bookings/${b1}/cancel", payload: {}, as: FamilyGuardian, as_user_id: "${fam}" }
            - { call: "POST /conf/bookings/${b1}/cancel", payload: {}, as: FamilyGuardian, as_user_id: "${fam}", captures: { err: $.data.error_id } }
          assert: ["first cancel succeeds (CANCELLED); second cancel rejected with error_id == ERR_INVALID_STATE"]

      - name: double_attendance_mark_rejected
        claim_type: idempotency
        grounds: [state_machines.Booking]
        distinguishing_aspect: "Attendance on a COMPLETED booking is rejected with ERR_INVALID_STATE — attendance is terminal, exactly one AttendanceRecord exists."
        test_recipe:
          setup: ["window IN_PROGRESS; booking b1 CONFIRMED on slot 0; clock past slot start"]
          setup_api_calls:
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SchoolAdmin }
            - call: "POST /conf/windows"
              payload: { name: "Fall", term_label: "2026-FALL", format: "ELEMENTARY", slot_length_minutes: 20, buffer_minutes: 5, travel_minutes: 30, day_windows: [{ date: "2026-10-05", start_at: "2026-10-05T15:00:00Z", end_at: "2026-10-05T19:00:00Z" }], booking_open_at: "2026-09-01T00:00:00Z", booking_close_at: "2026-10-01T00:00:00Z", teacher_daily_conf_cap: 6 }
              as: SchoolAdmin
              captures: { w: $.data.id, w_v1: $.data.version }
            - { call: "POST /conf/teachers", payload: { full_name: "T1", email: "t1@x.edu", grade_band: "ELEMENTARY", subjects: [], supports_in_person: true }, as: SchoolAdmin, captures: { t1: $.data.id } }
            - { call: "POST /conf/windows/${w}/publish", payload: {}, as: SchoolAdmin, captures: { w_v2: $.data.version } }
            - { call: "POST /conf/windows/${w}/generate-slots", payload: { expected_window_version: "${w_v2}" }, as: SchoolAdmin }
            - { call: "GET /conf/windows/${w}/slots", as: SchoolAdmin, captures: { s0: "$.data[0].id" } }
            - { call: "POST /conf/windows/${w}/open-booking", payload: {}, as: SchoolAdmin }
            - { call: "POST /conf/families", payload: { primary_guardian_name: "G", email: "g@x.com" }, as: FrontOfficeStaff, captures: { fam: $.data.id } }
