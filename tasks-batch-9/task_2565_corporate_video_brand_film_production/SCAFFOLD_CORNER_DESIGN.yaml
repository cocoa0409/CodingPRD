      - name: unknown_ids_across_every_resource_return_their_own_not_found_codes
        claim_type: triggerable
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - validations[priority=8]
          - validations[priority=9]
          - validations[priority=10]
          - validations[priority=11]
          - validations[priority=12]
          - validations[priority=13]
          - validations[priority=14]
          - validations[priority=15]
        distinguishing_aspect: "Each resource family owns its own 404 code rather than a shared generic one: ten reads and writes against a nonexistent id return ten distinct error_ids, one per not-found rule."
        test_recipe:
          setup:
            - "An empty dataset; every id below is a well-formed UUID that was never created"
          setup_api_calls: []
          trigger:
            - call: "GET /projects/00000000-0000-4000-8000-000000000601"
              payload: {}
              as: LineProducer
              as_user_id: "producer-1"
            - call: "GET /deliverables/00000000-0000-4000-8000-000000000701"
              payload: {}
              as: LineProducer
              as_user_id: "producer-1"
            - call: "GET /deliverable-versions/00000000-0000-4000-8000-000000000801"
              payload: {}
              as: PostSupervisor
              as_user_id: "post-1"
            - call: "POST /change-orders/00000000-0000-4000-8000-000000000901/decision"
              payload: { decision: "APPROVE", decision_note: "No such order." }
              as: ClientApprover
              as_user_id: "client-1"
            - call: "GET /shoot-days/00000000-0000-4000-8000-000000001001"
              payload: {}
              as: ProductionCoordinator
              as_user_id: "coord-1"
            - call: "GET /locations/00000000-0000-4000-8000-000000001101"
              payload: {}
              as: ProductionCoordinator
              as_user_id: "coord-1"
            - call: "GET /crew-members/00000000-0000-4000-8000-000000001201"
              payload: {}
              as: ProductionCoordinator
              as_user_id: "coord-1"
            - call: "GET /crew-bookings/00000000-0000-4000-8000-000000001301"
              payload: {}
              as: ProductionCoordinator
              as_user_id: "coord-1"
            - call: "GET /compliance-certs/00000000-0000-4000-8000-000000001401"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /talent-engagements/00000000-0000-4000-8000-000000001501/confirm"
              payload: {}
              as: LineProducer
              as_user_id: "producer-1"
          assert:
            - "All ten calls return HTTP 404"
            - "The error_ids are, in order, ERR_PROJECT_NOT_FOUND, ERR_DELIVERABLE_NOT_FOUND, ERR_DELIVERABLE_VERSION_NOT_FOUND, ERR_CHANGE_ORDER_NOT_FOUND, ERR_SHOOT_DAY_NOT_FOUND"
            - "and then ERR_LOCATION_NOT_FOUND, ERR_CREW_MEMBER_NOT_FOUND, ERR_CREW_BOOKING_NOT_FOUND, ERR_COMPLIANCE_CERT_NOT_FOUND, ERR_TALENT_ENGAGEMENT_NOT_FOUND"
            - "The 404 for the change-order decision precedes any state or segregation check, so no ERR_CHANGE_ORDER_STATE_INVALID or ERR_SEGREGATION_OF_DUTIES appears"

      - name: err_min_crew_not_met_is_triggerable_below_three_confirmed
        claim_type: triggerable
        grounds:
          - errors[ERR_MIN_CREW_NOT_MET]
        excluded_because:
          difficulty_instance: boundary_precision_check / call_sheet_crew_threshold_rejects_two_and_clears_at_exactly_three
          rationale: "That §1.8 instance publishes with two confirmed crew for the error and again with exactly three for the pass."

      - name: err_crew_double_booked_and_turnaround_violation_are_triggerable
        claim_type: triggerable
        grounds:
          - errors[ERR_CREW_DOUBLE_BOOKED]
          - errors[ERR_CREW_TURNAROUND_VIOLATION]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / crew_closed_interval_touch_and_ten_hour_turnaround_boundary
          rationale: "That §1.8 instance raises both codes on the same crew member and then clears at exactly ten hours of rest."

      - name: err_revision_rounds_exhausted_is_triggerable_after_a_void
        claim_type: triggerable
        grounds:
          - errors[ERR_REVISION_ROUNDS_EXHAUSTED]
        excluded_because:
          difficulty_instance: compensating_invariant / change_order_void_restores_entitlement_and_reblocks_submission
          rationale: "That §1.8 instance voids the approved change order and shows the next submit blocked again with this code."

      - name: err_change_order_pending_is_triggerable_across_sibling_deliverables
        claim_type: triggerable
        grounds:
          - errors[ERR_CHANGE_ORDER_PENDING]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / version_submit_gated_on_sibling_deliverables_pending_change_order
          rationale: "That §1.8 instance freezes the whole project's review loop on a sibling's pending change order and then unfreezes it."

      - name: an_empty_user_id_header_returns_4xx_unauthenticated
        claim_type: triggerable
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Identity is checked before authorisation and before any not-found lookup: a request carrying a declared role but an empty X-User-ID is 401 ERR_UNAUTHENTICATED, never 403 or 404."
        test_recipe:
          setup:
            - "No prerequisites; the request is rejected before any resource is touched"
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { client_name: "Nobody At All", campaign_title: "Headerless", creative_brief_summary: "Brand film request with no acting user.", channel_scope: ["OLV"], usage_term_months: 12, budget_ceiling_cents: 50000000 }
              as: LineProducer
              as_user_id: ""
            - call: "GET /projects/00000000-0000-4000-8000-000000000601"
              payload: {}
              as: LineProducer
              as_user_id: ""
          assert:
            - "Both calls return HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "The second call returns 401 rather than ERR_PROJECT_NOT_FOUND, proving identity precedes resolution"
            - "No Project row is created by the first call"

  - section: rbac
    instances:
      - name: coordinator_cannot_approve_the_budget_returns_4xx
        claim_type: exclusive_operations
        grounds:
          - roles.ClientApprover.exclusive_operations
          - validations[priority=2]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "Budget approval is exclusively the client's: the production coordinator receives 403 ERR_ROLE_NOT_PERMITTED, the project stays SCOPED, and the identical call from ClientApprover then succeeds."
        test_recipe:
          setup:
            - "A SCOPED project with one deliverable and one 2000000-cent PLANNED line"
          setup_api_calls:
            - call: "POST /projects"
              payload: { client_name: "Nardin Group", campaign_title: "Wrong Hands", creative_brief_summary: "Brand film where the coordinator tries to approve the budget.", channel_scope: ["OLV"], usage_term_months: 12, budget_ceiling_cents: 50000000 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { proj: $.data.id }
            - call: "POST /deliverables"
              payload: { project_id: "${proj}", title: "Wrong Hands 60", channel: "OLV", aspect_ratio: "16:9", target_duration_seconds: 60, caption_requirement: "NONE", usage_rights_months: 12, air_date: "2026-12-01T00:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
            - call: "POST /budget-lines"
              payload: { project_id: "${proj}", category: "POST_PRODUCTION", description: "Edit and finish", quantity: 1, unit_rate_cents: 2000000, markup_pct: 0 }
              as: LineProducer
              as_user_id: "producer-1"
            - call: "POST /projects/${proj}/lock-scope"
              payload: {}
              as: LineProducer
              as_user_id: "producer-1"
          trigger:
            - call: "POST /projects/${proj}/approve-budget"
              payload: { approved_budget_cents: 2000000 }
              as: ProductionCoordinator
              as_user_id: "coord-1"
            - call: "POST /projects/${proj}/approve-budget"
              payload: { approved_budget_cents: 2000000 }
              as: ClientApprover
              as_user_id: "client-1"
          assert:
            - "The coordinator's call returns HTTP 403 with data.error_id == ERR_ROLE_NOT_PERMITTED"
            - "Project.${proj}.status is still SCOPED and approved_budget_cents is null after that call"
            - "The approver's identical call returns HTTP 200 with Project.${proj}.status == IN_PRODUCTION"

      - name: post_supervisor_cannot_write_a_budget_line_returns_4xx
        claim_type: exclusive_operations
        grounds:
          - roles.LineProducer.exclusive_operations
          - validations[priority=2]
        distinguishing_aspect: "The money endpoints belong to the line producer alone: the post supervisor's budget-line write is 403 ERR_ROLE_NOT_PERMITTED and no row appears, even though the payload is entirely valid."
        test_recipe:
          setup:
            - "A DRAFT project with one deliverable"
          setup_api_calls:
            - call: "POST /projects"
              payload: { client_name: "Nardin Group", campaign_title: "Post Overreach", creative_brief_summary: "Brand film where post tries to budget.", channel_scope: ["OLV"], usage_term_months: 12, budget_ceiling_cents: 50000000 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { proj: $.data.id }
            - call: "POST /deliverables"
              payload: { project_id: "${proj}", title: "Post Overreach 60", channel: "OLV", aspect_ratio: "16:9", target_duration_seconds: 60, caption_requirement: "NONE", usage_rights_months: 12, air_date: "2026-12-01T00:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
          trigger:
            - call: "POST /budget-lines"
              payload: { project_id: "${proj}", category: "POST_PRODUCTION", description: "Extra finishing days", quantity: 1, unit_rate_cents: 400000, markup_pct: 0 }
              as: PostSupervisor
              as_user_id: "post-1"
          assert:
            - "The response is HTTP 403 with data.error_id == ERR_ROLE_NOT_PERMITTED"
            - "GET /projects/${proj}/budget-lines returns total_count == 0"
            - "Project.${proj}.provisional_cost_cents == 0"

      - name: compliance_officer_cannot_publish_a_call_sheet_returns_4xx
        claim_type: peer_roles
        grounds:
          - roles.ProductionCoordinator.exclusive_operations
          - roles.ComplianceOfficer
          - validations[priority=2]
        distinguishing_aspect: "The two peer specialists cannot reach into each other's endpoints: the compliance officer who issued the very certificates the call sheet depends on still gets 403 ERR_ROLE_NOT_PERMITTED when publishing it, and the coordinator cannot decide a certificate either."
        test_recipe:
          setup:
            - "A SCOPED project with one PLANNED shoot day and one SUBMITTED FILM_PERMIT"
          setup_api_calls:
            - call: "POST /projects"
              payload: { client_name: "Marden Freight", campaign_title: "Peer Lines", creative_brief_summary: "Brand film exercising the peer role boundary.", channel_scope: ["OLV"], usage_term_months: 12, budget_ceiling_cents: 50000000 }
              as: LineProducer
