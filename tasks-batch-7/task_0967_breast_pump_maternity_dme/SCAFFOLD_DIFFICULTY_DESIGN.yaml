            - "PriorAuthorization.${pa_id}.auth_number == AUTH-77"
            - "PumpOrder.${o_id}.billing_status == AUTH_APPROVED"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: delivery_cascade_order_to_schedules_to_member
        grounds:
          - state_machines.Shipment
          - state_machines.PumpOrder
          - calculations.resupply_next_eligible_date
          - entities.Member.fields.next_resupply_date
        distinguishing_aspect: |
          Depth-3 cascade triggered by shipment advance: Shipment DELIVERED -> PumpOrder
          DELIVERED (delivery_date set) -> two ResupplySchedules auto-created with
          next_eligible 2026-07-30 -> Member aggregates recomputed
          (active_schedule_count 2, next_resupply_date 2026-07-30). Each link is caused
          by the previous one, not by the original call.
        test_recipe:
          setup:
            - "Catalog: pump + PART VALVE (covered) + PART TUBE (covered); policy frequency 90 ROLLING"
            - "Order QUALIFIED; shipment created and advanced to OUT_FOR_DELIVERY at clock 2026-05-01"
          setup_api_calls:
            - call: "POST /dme/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PUMP", name: "StdPump", sku: "PUMP-STD", unit_price_cents: 30000, insurance_tier: "STANDARD", pump_type: "DOUBLE_ELECTRIC", warranty_months: 12 }
              as: PlatformAdmin
              captures: { pump_id: $.data.id }
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PART", name: "Valve", sku: "PART-VALVE", unit_price_cents: 500, covered_under_resupply: true, max_qty_per_frequency: 4 }
              as: PlatformAdmin
              captures: { valve_id: $.data.id }
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PART", name: "Tube", sku: "PART-TUBE", unit_price_cents: 800, covered_under_resupply: true, max_qty_per_frequency: 2 }
              as: PlatformAdmin
            - call: "POST /dme/members"
              payload: { full_name: "Cas Mem", email: "cas@x.com", date_of_birth: "1995-01-01", shipping_address: "9 Cherry St" }
              as: CareCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /dme/policies"
              payload: { member_id: "${m_id}", payer_name: "PayerX", plan_type: "COMMERCIAL_PPO", benefit_period_start: "2026-01-01", benefit_period_end: "2027-01-01", resupply_frequency_days: 90, schedule_mode: "ROLLING" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /dme/prescriptions"
              payload: { member_id: "${m_id}", diagnosis_code: "Z39.1", pump_type: "DOUBLE_ELECTRIC", issued_date: "2026-04-15", expiration_date: "2026-10-01" }
              as: CareCoordinator
              captures: { rx_id: $.data.id }
            - call: "POST /dme/prescriptions/${rx_id}/verify"
              as: InsuranceSpecialist
            - call: "POST /dme/pump-orders"
              payload: { member_id: "${m_id}", policy_id: "${pol_id}", prescription_id: "${rx_id}", pump_item_id: "${pump_id}", shipping_address: "9 Cherry St" }
              as: CareCoordinator
              captures: { o_id: $.data.id }
            - call: "POST /dme/pump-orders/${o_id}/qualify"
              as: InsuranceSpecialist
            - call: "POST /dme/shipments"
              payload: { pump_order_id: "${o_id}", carrier: "UPS", tracking_number: "1Z-D" }
              as: WarehouseOperator
              captures: { sh_id: $.data.id }
            - call: "POST /dme/shipments/${sh_id}/advance"
              payload: { to_status: "IN_TRANSIT" }
              as: WarehouseOperator
            - call: "POST /dme/shipments/${sh_id}/advance"
              payload: { to_status: "OUT_FOR_DELIVERY" }
              as: WarehouseOperator
          trigger:
            - call: "POST /dme/shipments/${sh_id}/advance"
              payload: { to_status: "DELIVERED" }
              as: WarehouseOperator
            - call: "GET /dme/resupply-schedules"
              payload: { member_id: "${m_id}", catalog_item_id: "${valve_id}" }
              as: CareCoordinator
              captures: { valve_sched: "$.data[0].id" }
          assert:
            - "PumpOrder.${o_id}.fulfillment_status == DELIVERED"
            - "PumpOrder.${o_id}.delivery_date == 2026-05-01"
            - "GET /dme/resupply-schedules?member_id=${m_id} returns exactly 2 schedules, both status ACTIVE"
            - "ResupplySchedule.${valve_sched}.anchor_date == 2026-05-01 and next_eligible_date == 2026-07-30"
            - "Member.${m_id}.active_schedule_count == 2"
            - "Member.${m_id}.next_resupply_date == 2026-07-30"

      - name: warranty_replace_cascade_to_shipment_and_order_posture
        grounds:
          - state_machines.WarrantyClaim
          - entities.PumpOrder.fields.replacement_count
          - entities.PumpOrder.fields.warranty_blocked
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (warranty resolve, not shipment
          advance): WarrantyClaim RESOLVED -> replacement Shipment auto-created ->
          PumpOrder.replacement_count incremented; at count 2 the derived
          warranty_blocked flag flips and blocks any further warranty claim with
          ERR_WARRANTY_REPLACEMENT_EXHAUSTED.
        test_recipe:
          setup:
            - "Pump order (warranty_months 12) DELIVERED at 2026-05-01; no resupply-covered parts in catalog"
            - "Two warranty claims each decided APPROVED_REPLACE and resolved"
          setup_api_calls:
            - call: "POST /dme/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PUMP", name: "StdPump", sku: "PUMP-STD", unit_price_cents: 30000, insurance_tier: "STANDARD", pump_type: "DOUBLE_ELECTRIC", warranty_months: 12 }
              as: PlatformAdmin
              captures: { pump_id: $.data.id }
            - call: "POST /dme/members"
              payload: { full_name: "War Mem", email: "war@x.com", date_of_birth: "1990-10-10", shipping_address: "10 Maple St" }
              as: CareCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /dme/policies"
              payload: { member_id: "${m_id}", payer_name: "PayerX", plan_type: "COMMERCIAL_PPO", benefit_period_start: "2026-01-01", benefit_period_end: "2027-01-01" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /dme/prescriptions"
              payload: { member_id: "${m_id}", diagnosis_code: "Z39.1", pump_type: "DOUBLE_ELECTRIC", issued_date: "2026-04-15", expiration_date: "2026-10-01" }
              as: CareCoordinator
              captures: { rx_id: $.data.id }
            - call: "POST /dme/prescriptions/${rx_id}/verify"
              as: InsuranceSpecialist
            - call: "POST /dme/pump-orders"
              payload: { member_id: "${m_id}", policy_id: "${pol_id}", prescription_id: "${rx_id}", pump_item_id: "${pump_id}", shipping_address: "10 Maple St" }
              as: CareCoordinator
              captures: { o_id: $.data.id }
            - call: "POST /dme/pump-orders/${o_id}/qualify"
              as: InsuranceSpecialist
            - call: "POST /dme/shipments"
              payload: { pump_order_id: "${o_id}", carrier: "UPS", tracking_number: "1Z-W1" }
              as: WarehouseOperator
              captures: { sh_id: $.data.id }
            - call: "POST /dme/shipments/${sh_id}/advance"
              payload: { to_status: "IN_TRANSIT" }
              as: WarehouseOperator
            - call: "POST /dme/shipments/${sh_id}/advance"
              payload: { to_status: "OUT_FOR_DELIVERY" }
              as: WarehouseOperator
            - call: "POST /dme/shipments/${sh_id}/advance"
              payload: { to_status: "DELIVERED" }
              as: WarehouseOperator
            - call: "POST /dme/warranty-claims"
              payload: { pump_order_id: "${o_id}", serial_number: "SN-1", issue_type: "MOTOR_FAILURE" }
              as: CareCoordinator
              captures: { wc1: $.data.id }
            - call: "POST /dme/warranty-claims/${wc1}/decide"
              payload: { decision: "APPROVED_REPLACE", resolution_notes: "replace unit" }
              as: PlatformAdmin
            - call: "POST /dme/warranty-claims/${wc1}/resolve"
              as: PlatformAdmin
          trigger:
            - call: "POST /dme/warranty-claims"
              payload: { pump_order_id: "${o_id}", serial_number: "SN-2", issue_type: "BATTERY_FAILURE" }
              as: CareCoordinator
              captures: { wc2: $.data.id }
            - call: "POST /dme/warranty-claims/${wc2}/decide"
              payload: { decision: "APPROVED_REPLACE", resolution_notes: "replace unit again" }
              as: PlatformAdmin
            - call: "POST /dme/warranty-claims/${wc2}/resolve"
              as: PlatformAdmin
            - call: "POST /dme/warranty-claims"
              payload: { pump_order_id: "${o_id}", serial_number: "SN-3", issue_type: "SUCTION_LOSS" }
              as: CareCoordinator
              captures: { err3: $.data.error_id }
          assert:
            - "WarrantyClaim.${wc1}.status == RESOLVED and replacement_shipment_id is non-null"
            - "WarrantyClaim.${wc2}.status == RESOLVED"
            - "PumpOrder.${o_id}.replacement_count == 2"
            - "PumpOrder.${o_id}.warranty_blocked == true"
            - "GET /dme/shipments?pump_order_id=${o_id} returns 3 shipments, exactly 2 with is_warranty_replacement == true"
            - "third warranty claim attempt returns error_id == ERR_WARRANTY_REPLACEMENT_EXHAUSTED"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_temporal_on_qualify_cancelled_order
        grounds:
          - "validations[priority=6]"
          - "validations[priority=8]"
        distinguishing_aspect: |
          Error-category pair state vs business_temporal: the order is CANCELLED (state)
          and its prescription is EXPIRED (temporal); the state error ERR_INVALID_STATE
          must win over ERR_PRESCRIPTION_EXPIRED.
        test_recipe:
          setup:
            - "Order created and cancelled while PENDING_QUALIFICATION; prescription was VERIFIED"
            - "Clock advanced to 2026-10-02, past the prescription expiration 2026-10-01 (rx now EXPIRED)"
          setup_api_calls:
            - call: "POST /dme/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PUMP", name: "StdPump", sku: "PUMP-STD", unit_price_cents: 30000, insurance_tier: "STANDARD", pump_type: "DOUBLE_ELECTRIC", warranty_months: 12 }
              as: PlatformAdmin
              captures: { pump_id: $.data.id }
            - call: "POST /dme/members"
              payload: { full_name: "Pri Mem", email: "pri@x.com", date_of_birth: "1990-11-11", shipping_address: "11 Poplar St" }
              as: CareCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /dme/policies"
              payload: { member_id: "${m_id}", payer_name: "PayerX", plan_type: "COMMERCIAL_PPO", benefit_period_start: "2026-01-01", benefit_period_end: "2027-01-01" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /dme/prescriptions"
              payload: { member_id: "${m_id}", diagnosis_code: "Z39.1", pump_type: "DOUBLE_ELECTRIC", issued_date: "2026-04-15", expiration_date: "2026-10-01" }
              as: CareCoordinator
              captures: { rx_id: $.data.id }
            - call: "POST /dme/prescriptions/${rx_id}/verify"
              as: InsuranceSpecialist
            - call: "POST /dme/pump-orders"
              payload: { member_id: "${m_id}", policy_id: "${pol_id}", prescription_id: "${rx_id}", pump_item_id: "${pump_id}", shipping_address: "11 Poplar St" }
              as: CareCoordinator
              captures: { o_id: $.data.id }
            - call: "POST /dme/pump-orders/${o_id}/cancel"
              as: CareCoordinator
            - call: "POST /dme/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /dme/pump-orders/${o_id}/qualify"
              as: InsuranceSpecialist
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "PumpOrder.${o_id}.fulfillment_status == CANCELLED"
            - "Prescription.${rx_id}.status == VERIFIED (lazy expiry never evaluated — the state check short-circuits before the temporal check)"

      - name: segregation_of_duties_beats_remittance_imbalance
        grounds:
          - "validations[priority=7]"
          - "validations[priority=10]"
        distinguishing_aspect: |
          Error-category pair business_safety vs business_fiscal (different pair than
          state/temporal): the remitter is the claim's submitter AND the remittance is
          imbalanced; ERR_SEGREGATION_OF_DUTIES (safety) must win over
          ERR_REMITTANCE_IMBALANCE (fiscal).
        test_recipe:
          setup:
