  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: enrollment_confirm_requires_departure_open_or_guaranteed
        grounds:
          - state_machines.Enrollment.PENDING_to_CONFIRMED
          - entities.Departure.fields.status
          - errors[ERR_DEPARTURE_NOT_OPEN]
        distinguishing_aspect: |
          PAIR Enrollment -> Departure: an enrollment whose deposit is paid cannot move
          PENDING->CONFIRMED while its Departure is still DRAFT; POST /enrollments/{id}/confirm
          returns ERR_DEPARTURE_NOT_OPEN and lifecycle_status stays PENDING.
