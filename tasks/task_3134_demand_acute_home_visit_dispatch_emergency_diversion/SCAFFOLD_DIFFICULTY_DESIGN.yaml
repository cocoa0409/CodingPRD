            - call: "POST /dh/visit-requests/${vr_b}/follow-up-notices"
              payload: { pcp_npi: "7777777778", payload_summary: "Visit summary for PCP: patient stable after home visit; follow-up as needed." }
              as: TriageNurse
          trigger:
            - call: "POST /dh/claims/${claim_a}/submit"
              payload: { expected_visit_request_version: "${vr_a_v_cur}" }
              as: BillingSpecialist
              captures: { ok_a: $.data.status }
            - call: "POST /dh/claims/${claim_b}/submit"
              payload: { expected_visit_request_version: "${vr_b_v_cur}" }
              as: BillingSpecialist
              captures: { err_b: $.data.error_id }
          assert:
            - "ok_a == SUBMITTED (encounter ended at 11:59:59, within [effective_from, effective_to))"
            - "err_b == ERR_CONTRACT_NOT_IN_FORCE and HTTP 422 (encounter ended AT effective_to, exclusive bound violated)"
            - "VisitRequest.${vr_b}.status == CLAIM_DRAFT (claim submission failed; visit remains in pre-submit state)"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: care_team_active_dispatch_count_invariant
        grounds:
          - entities.CareTeam.fields.active_dispatch_count
          - state_machines.DispatchAssignment
        distinguishing_aspect: |
          Conserved quantity: CareTeam.active_dispatch_count. Invariant:
          ∀ CareTeam, active_dispatch_count == count of DispatchAssignments for
          that team in {OFFERED, ACCEPTED, EN_ROUTE, ARRIVED}. Forward action
          (offer) increments; compensating action (reject or complete)
          decrements. After offer+reject, count MUST equal its pre-offer value.
        test_recipe:
          setup:
            - "CareTeam with active_dispatch_count == 0."
            - "Dispatch offer created (count → 1). Dispatch rejected (count → 0)."
          setup_api_calls:
            - call: "POST /dh/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dh/markets"
              payload: { market_code: "DFW-N", display_name: "DFW N", polygon_geojson: "{\"type\":\"Polygon\",\"coordinates\":[[[-97.5,32.5],[-96.5,32.5],[-96.5,33.5],[-97.5,33.5],[-97.5,32.5]]]}", response_window_minutes_urgent: 60, response_window_minutes_standard: 240 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /dh/patients"
              payload: { full_name: "Oscar O", date_of_birth: "1980-01-01", payer_code: "AETNA", member_id: "M1600", pcp_name: "Dr. Q", pcp_npi: "8888888889", comorbidity_count: 1, home_address_geo: "{\"type\":\"Point\",\"coordinates\":[-97.0,33.0]}" }
              as: TriageNurse
              captures: { patient_id: $.data.id }
            - call: "POST /dh/care-teams"
              payload: { market_id: "${mkt_id}", app_user_id: "app-O", tech_user_id: "tech-O", supervising_physician_user_id: "md-O", skill_tags: ["POCT"] }
              as: Dispatcher
              captures: { team_id: $.data.id }
            - call: "POST /dh/care-teams/${team_id}/go-available"
              payload: {}
              as: Dispatcher
            - call: "POST /dh/vehicle-shifts"
              payload: { care_team_id: "${team_id}", market_id: "${mkt_id}", vehicle_plate: "TX-O", window_start: "2026-09-15T08:00:00Z", window_end: "2026-09-15T20:00:00Z" }
              as: Dispatcher
              captures: { shift_id: $.data.id }
            - call: "POST /dh/vehicle-shifts/${shift_id}/start"
              payload: {}
              as: Dispatcher
            - call: "POST /dh/visit-requests"
              payload: { patient_id: "${patient_id}", market_id: "${mkt_id}", requestor_role: "PATIENT", chief_complaint: "fever" }
              as: TriageNurse
              captures: { vr_id: $.data.id, vr_v0: $.data.version }
            - call: "POST /dh/visit-requests/${vr_id}/triage-assessments"
              payload: { heart_rate: 130, systolic_bp: 95, spo2_pct: 92, is_chest_pain: false, is_stroke_signs: false, is_severe_trauma: false, is_altered_mental_status: false }
              as: TriageNurse
              captures: { trg_id: $.data.id }
            - call: "POST /dh/triage-assessments/${trg_id}/submit"
              payload: { outcome: "APPROPRIATE" }
              as: TriageNurse
          trigger:
            - call: "GET /dh/care-teams/${team_id}"
              payload: {}
              as: Dispatcher
              captures: { count_before: $.data.active_dispatch_count }
            - call: "POST /dh/visit-requests/${vr_id}/dispatch-offers"
              payload: { expected_visit_request_version: "${vr_v0}" }
              as: Dispatcher
              captures: { da_id: $.data.id }
            - call: "GET /dh/care-teams/${team_id}"
              payload: {}
              as: Dispatcher
              captures: { count_after_offer: $.data.active_dispatch_count }
            - call: "POST /dh/dispatch-assignments/${da_id}/reject"
              payload: {}
              as: CareTeamMember
              as_user_id: "app-O"
            - call: "GET /dh/care-teams/${team_id}"
              payload: {}
              as: Dispatcher
              captures: { count_after_reject: $.data.active_dispatch_count }
          assert:
            - "count_before == 0"
            - "count_after_offer == 1 (forward action)"
            - "count_after_reject == 0 (compensating action; conserved quantity restored)"
            - "CareTeam.${team_id}.status == AVAILABLE (status cascades back)"

      - name: market_open_visit_count_invariant_on_terminal_transitions
        grounds:
          - entities.MarketCoverageArea.fields.open_visit_count
          - state_machines.VisitRequest
        distinguishing_aspect: |
          Different conserved quantity from active_dispatch_count:
          MarketCoverageArea.open_visit_count. Invariant:
          open_visit_count == count of VisitRequests in the market in
          non-terminal states. Intake increments (+1); EMS_DIVERTED, DECLINED,
          and CLOSED each decrement (-1). After intake+divert, the count MUST
          return to its pre-intake value.
        test_recipe:
          setup:
            - "Market with open_visit_count == 0."
            - "Visit created (+1). Triage diverts to EMS (-1)."
          setup_api_calls:
            - call: "POST /dh/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dh/markets"
              payload: { market_code: "DFW-N", display_name: "DFW N", polygon_geojson: "{\"type\":\"Polygon\",\"coordinates\":[[[-97.5,32.5],[-96.5,32.5],[-96.5,33.5],[-97.5,33.5],[-97.5,32.5]]]}", response_window_minutes_urgent: 60, response_window_minutes_standard: 240 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /dh/patients"
              payload: { full_name: "Pam P", date_of_birth: "1980-01-01", payer_code: "AETNA", member_id: "M1700", pcp_name: "Dr. R", pcp_npi: "9999999990", comorbidity_count: 1, home_address_geo: "{\"type\":\"Point\",\"coordinates\":[-97.0,33.0]}" }
              as: TriageNurse
              captures: { patient_id: $.data.id }
          trigger:
            - call: "GET /dh/markets/${mkt_id}"
              payload: {}
              as: Dispatcher
              captures: { count_before: $.data.open_visit_count }
            - call: "POST /dh/visit-requests"
              payload: { patient_id: "${patient_id}", market_id: "${mkt_id}", requestor_role: "PATIENT", chief_complaint: "crushing chest pain" }
              as: TriageNurse
              captures: { vr_id: $.data.id }
            - call: "GET /dh/markets/${mkt_id}"
              payload: {}
              as: Dispatcher
              captures: { count_after_intake: $.data.open_visit_count }
            - call: "POST /dh/visit-requests/${vr_id}/triage-assessments"
              payload: { heart_rate: 130, systolic_bp: 90, spo2_pct: 90, is_chest_pain: true, is_stroke_signs: false, is_severe_trauma: false, is_altered_mental_status: false }
              as: TriageNurse
              captures: { trg_id: $.data.id }
            - call: "POST /dh/triage-assessments/${trg_id}/submit"
              payload: { outcome: "EMERGENCY_DIVERTED" }
              as: TriageNurse
            - call: "GET /dh/markets/${mkt_id}"
              payload: {}
              as: Dispatcher
              captures: { count_after_divert: $.data.open_visit_count }
          assert:
            - "count_before == 0"
            - "count_after_intake == 1 (forward action on VisitRequest INTAKE)"
            - "count_after_divert == 0 (compensating action on EMS_DIVERTED; conserved quantity restored)"
            - "VisitRequest.${vr_id}.status == EMS_DIVERTED (terminal)"
