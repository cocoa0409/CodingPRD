  - rule_id: priority_pair_validation_conflict
    instances:

      - name: fund_with_open_curative_and_wrong_wire_amount_yields_state_error_first
        grounds:
          - validations[priority=27]
          - validations[priority=83]
          - errors[ERR_CURATIVE_PERIOD_OPEN]
          - errors[ERR_FUNDING_AMOUNT_MISMATCH]
          - endpoints[POST /psas/{id}/fund]
        conflicting_rules:
          higher: { priority: 27, category: state, error_id: ERR_CURATIVE_PERIOD_OPEN }
          lower: { priority: 83, category: business_fiscal, error_id: ERR_FUNDING_AMOUNT_MISMATCH }
        distinguishing_aspect: |
          A single POST /psas/{id}/fund call violates a state rule (curative_status is still
          CURATIVE_OPEN) and a fiscal rule (wire_amount 45000.00 does not equal
          adjusted_purchase_price 48000.00). The state category at priority 27 must win with a
          409, so the 422 fiscal error is never reported. Closing curative then re-sending the
          same wrong wire proves the lower rule is real and was merely masked.
        test_recipe:
          setup:
            - "logical clock at its default 2026-08-01T00:00:00Z"
            - "an EXECUTED PurchaseSaleAgreement with purchase_price 48000.00, adjusted_purchase_price 48000.00, curative_status CURATIVE_OPEN, funding_status UNFUNDED, no TitleDefect"
