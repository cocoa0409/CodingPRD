# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid auth headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_SEGREGATION_OF_DUTY, http: 403, condition: "Same user attempts to approve their own submission" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "Body FK reference does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition invalid from current state" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Resource already in terminal state" }
  - { id: ERR_INVALID_TIME_WINDOW, http: 400, condition: "end <= start or malformed time window" }
  - { id: ERR_DUPLICATE_IDENTIFIER, http: 409, condition: "Uniqueness constraint violated (site_code, serial, imei, iccid, slice_name, sector_label, erp_account_code)" }
  - { id: ERR_CAPACITY_SHORTFALL, http: 422, condition: "CoverageDesign.capacity_shortfall_mbps > 0 at approval" }
  - { id: ERR_TARGET_CAPACITY_TOO_LOW, http: 422, condition: "Site.target_capacity_mbps < 100 at design submission" }
  - { id: ERR_SURVEY_SIGNAL_TOO_WEAK, http: 422, condition: "SiteSurvey.measured_rsrp_dbm < -110 at approval" }
  - { id: ERR_INTERFERENCE_MARGIN_EXCEEDED, http: 422, condition: "interference_report.worst_case_margin_db < 0 at coordination approval" }
  - { id: ERR_SPECTRUM_OVERLAP, http: 409, condition: "SHARED_CBRS+PAL lease/coordination overlaps existing PAL on same band/frequency bucket" }
  - { id: ERR_NO_ACTIVE_LEASE, http: 422, condition: "No ACTIVE SpectrumLease covering the requested band_class and time window at registration" }
  - { id: ERR_ASSIGNMENT_OVERLAP, http: 409, condition: "SpectrumAssignment time window overlaps another ACTIVE assignment on same CellSector" }
  - { id: ERR_LEASE_BANDWIDTH_EXCEEDED, http: 422, condition: "Sum of ACTIVE assignments on the lease + new > lease.bandwidth_mhz" }
  - { id: ERR_CONTRACT_OVERLAP, http: 409, condition: "Another ACTIVE ServiceContract on same Enterprise overlaps with same sla_tier" }
  - { id: ERR_SLICE_BANDWIDTH_EXCEEDED, http: 422, condition: "Sum of ACTIVATED slice guaranteed_bandwidth_mbps + new > Site.target_capacity_mbps" }
  - { id: ERR_SLICE_DEVICE_CAP_EXCEEDED, http: 422, condition: "NetworkSlice.bound_device_count >= max_devices at bind" }
  - { id: ERR_URLLC_REQUIRES_EDGE, http: 422, condition: "URLLC slice activation without ON_PREMISE or NEAR_EDGE edge_compute_placement" }
  - { id: ERR_REMEDIATION_CELLS_MISSING, http: 422, condition: "New ON_AIR cells since remediation start != additional_cells_planned" }
  - { id: ERR_REMEDIATION_OPEN, http: 422, condition: "Cannot resolve alert while referencing CoverageRemediation is open" }
  - { id: ERR_CROSS_ENTERPRISE_REFERENCE, http: 422, condition: "SIMProfile.enterprise_id != Site.enterprise_id at device bind" }
  - { id: ERR_CHILDREN_ACTIVE, http: 422, condition: "Site has non-terminal CellSectors or Devices at decommission" }
  - { id: ERR_ENTERPRISE_CHILDREN_ACTIVE, http: 422, condition: "Enterprise has non-terminal Sites or Contracts at offboard" }
  - { id: ERR_STALE_SITE_VERSION, http: 412, condition: "OCC mismatch on Site.version during design creation" }
  - { id: ERR_STALE_REQUEST_VERSION, http: 412, condition: "OCC mismatch on SpectrumCoordinationRequest.version during approval" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, malformed enum value, or out-of-range numeric" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: NetworkArchitect
    description: "Verizon enterprise solutions architect; owns Enterprise/Site/Slice/Contract lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /private-wireless/enterprises"
      - "POST /private-wireless/enterprises/{id}/activate|suspend|resume|offboard"
      - "POST /private-wireless/enterprises/{id}/sites"
      - "POST /private-wireless/sites/{id}/activate|decommission"
      - "POST /private-wireless/sites/{id}/designs/{id}/approve|reject"
      - "POST /private-wireless/sites/{id}/slices"
      - "POST /private-wireless/sites/{id}/slices/{id}/activate|suspend|retire"
      - "POST /private-wireless/enterprises/{id}/contracts"
      - "POST /private-wireless/enterprises/{id}/contracts/{id}/activate|renew|terminate"
      - "POST /private-wireless/sites/{id}/remediations/{id}/approve|complete|reopen"
      - "POST /private-wireless/_clock/set_current_utc"
    shared_operations:
      - "GET on all resources"

  - name: RFEngineer
    description: "Radio frequency design engineer; authors surveys approval, coverage designs, remediations"
    identity: opaque
    exclusive_operations:
      - "POST /private-wireless/sites/{id}/surveys/{id}/approve|reject"
      - "POST /private-wireless/sites/{id}/designs"
      - "POST /private-wireless/sites/{id}/designs/{id}/submit"
      - "POST /private-wireless/sites/{id}/cells"
      - "POST /private-wireless/sites/{id}/remediations"
      - "POST /private-wireless/sites/{id}/remediations/{id}/start"
    shared_operations:
      - "GET on all resources"

  - name: SpectrumCoordinator
    description: "Spectrum planning specialist; files coordination requests and manages leases"
    identity: opaque
    exclusive_operations:
      - "POST /private-wireless/enterprises/{id}/spectrum-leases"
      - "POST /private-wireless/spectrum-leases/{id}/activate|cancel"
      - "POST /private-wireless/sites/{id}/coordination-requests"
      - "POST /private-wireless/sites/{id}/coordination-requests/{id}/submit|begin-coordination|register|withdraw"
      - "POST /private-wireless/cells/{id}/spectrum-assignments"
    shared_operations:
      - "GET on all resources"

  - name: SpectrumRegulator
    description: "External regulator (FCC/SAS administrator proxy); approves/rejects coordination requests"
    identity: opaque
    exclusive_operations:
      - "POST /private-wireless/sites/{id}/coordination-requests/{id}/approve|reject"
    shared_operations:
      - "GET on spectrum leases, contracts, coordination requests"

  - name: FieldTechnician
    description: "On-site field engineer; performs surveys, configures cells, provisions devices, responds to alerts"
    identity: opaque
    exclusive_operations:
      - "POST /private-wireless/sites/{id}/surveys"
      - "POST /private-wireless/sites/{id}/surveys/{id}/submit"
      - "POST /private-wireless/sites/{id}/cells/{id}/configure|on-air|off-air|decommission"
      - "POST /private-wireless/enterprises/{id}/sim-profiles"
      - "POST /private-wireless/cells/{id}/devices"
      - "POST /private-wireless/cells/{id}/devices/{id}/bind-sim|activate|suspend|resume|decommission"
      - "POST /private-wireless/cells/{id}/spectrum-assignments/{id}/release"
      - "POST /private-wireless/sites/{id}/slices/{id}/bind-device|unbind-device"
      - "POST /private-wireless/sites/{id}/alerts"
      - "POST /private-wireless/sites/{id}/alerts/{id}/acknowledge|mitigate|resolve|mark-false-alarm"
      - "POST /private-wireless/sites/{id}/remediations/{id}/verify"
    shared_operations:
      - "GET on all resources"
