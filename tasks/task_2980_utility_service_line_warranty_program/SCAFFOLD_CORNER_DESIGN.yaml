              payload: { enrollment_id: "${enrollment_id}", line_type: "WATER_SERVICE_LINE", defect_location: "CURB_STOP_TO_METER", urgency: "ROUTINE", incident_description: "Standing water above the service line." }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { claim_id: $.data.id, claim_v1: $.data.version }
          trigger:
            - call: "POST /claims/${claim_id}/dispatches"
              payload: { window_start: "2026-09-10T09:00:00.000Z", expected_claim_version: "${claim_v1}", contractor_id: "${contractor_a}" }
