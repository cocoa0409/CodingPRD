# =============================================================================
# Task 1871 — Dog Park Membership & Access Program
# PRD Benchmark scaffold (§1.0–§1.7)
# =============================================================================

scenario: |
  1871. Dog Park Membership & Access Program (municipal/private dog park): membership
  registration with vaccination/license verification, gate access credential & guest
  policy, capacity/peak-hour management, incident (bite/aggression) reporting &
  membership suspension, park maintenance & waste station servicing, small dog/large
  dog area rules, annual renewal & fee structure, community rule enforcement &
  volunteer stewards

domain_name: dog-park-membership
api_prefix: /dog-park

# =============================================================================
# Complexity Profile (§0)
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # per-area capacity with peak-hour derating
  secondary_archetype: compliance_audit      # vaccination/license verification, incident strikes, suspension
  complexity_layers:
    - rate_threshold_triggers                # strike threshold 30 -> suspension; fill_pct >= 80 -> NEEDS_SERVICE; capacity boundary
    - cascading_side_effects                 # incident CONFIRMED -> strikes -> suspension -> membership/visits/passes
    - optimistic_concurrency                 # OCC on Member.version and Membership.version
    - ops_run_checkpoint                     # nightly service-run advances the epoch
  entity_topology: flat                      # peer collections joined by FK references, no URL nesting of writes
  state_machine_shape: cyclic                # Member ACTIVE->SUSPENDED->ACTIVE; Dog SUBMITTED->REJECTED->SUBMITTED
  relationship_patterns:
    - one_to_many                            # Member -> Dogs / Memberships / GuestPasses / Visits
    - cross_aggregate                        # ParkVisit references Member, Dog, GuestPass, ParkArea
  role_model: hierarchical_override          # ParkAdmin superset; Steward = member with is_steward flag; Member self-service
  consistency_model: immediate               # all side effects atomic within the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (9 entities)
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true    # id, created_at, updated_at, version
    fields:
      - { name: full_name, type: string, source: input, description: "Member legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique per member" }
      - { name: phone, type: string, source: input, description: "Optional contact phone", default: null }
      - { name: is_steward, type: boolean, source: system, description: "Volunteer-steward flag; gates X-User-Role: Steward", default: false }
      - { name: status, type: enum, source: system, description: "PENDING_VERIFICATION | ACTIVE | SUSPENDED | LAPSED" }
      - { name: strike_points, type: integer, source: computed, description: "Sum of severity points over this member's CONFIRMED IncidentReports; reset to 0 by reinstatement", default: 0 }
      - { name: provisional_strike_score, type: integer, source: computed, description: "strike_points + round_half_up(0.5 * pending points) over FILED/UNDER_REVIEW reports", default: 0 }
      - { name: guest_passes_used_this_month, type: integer, source: computed, description: "Count of GuestPasses with created_at in current calendar month and status != VOID", default: 0 }

  - name: Dog
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; owning member" }
      - { name: name, type: string, source: input, description: "Dog name" }
      - { name: size_class, type: enum, source: input, description: "SMALL | LARGE; gates area admission" }
      - { name: license_number, type: string, source: input, description: "Municipal dog license number" }
      - { name: vaccination_expires_on, type: string, source: input, description: "Rabies vaccination expiry, ISO date YYYY-MM-DD; must be >= current date at verify/resubmit and at check-in" }
      - { name: verification_status, type: enum, source: system, description: "SUBMITTED | VERIFIED | REJECTED | EXPIRED" }
      - { name: rejection_reason, type: string, source: system, description: "Set on REJECTED; cleared on resubmit", default: null }

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; owning member" }
      - { name: term_start, type: datetime, source: system, description: "ISO8601 UTC; purchase/renewal instant" }
      - { name: term_end, type: datetime, source: system, description: "ISO8601 UTC; always YYYY-12-31T23:59:59Z of the term's final calendar year" }
      - { name: charged_fee_cents, type: integer, source: computed, description: "Fee charged by the most recent purchase/renewal (integer cents)" }
      - { name: renewal_count, type: integer, source: system, description: "Number of successful renewals", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | EXPIRED" }

  - name: GuestPass
    parent: null
    common_fields: true
    fields:
      - { name: sponsor_member_id, type: string, source: system, description: "FK -> Member.id; purchasing member (from X-User-ID)" }
      - { name: guest_dog_size_class, type: enum, source: input, description: "SMALL | LARGE; gates area admission at redemption" }
      - { name: valid_on, type: string, source: input, description: "ISO date YYYY-MM-DD the pass may be redeemed; may be a future date" }
      - { name: fee_cents, type: integer, source: computed, description: "Weekday 1500; weekend (Sat/Sun UTC) round_half_up(1500*1.5)=2250" }
      - { name: status, type: enum, source: system, description: "ISSUED | REDEEMED | VOID | EXPIRED" }

  - name: ParkArea
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Area display name" }
      - { name: size_class_restriction, type: enum, source: input, description: "SMALL | LARGE; only matching dogs/passes admitted" }
      - { name: capacity, type: integer, source: input, description: "Standard max concurrent OPEN visits; > 0" }
      - { name: peak_capacity, type: integer, source: input, description: "Max concurrent OPEN visits during peak windows; must be <= capacity" }
      - { name: peak_windows, type: array, source: input, description: "Array of {start_minute, end_minute} minute-of-day ranges, half-open [start, end)", default: [] }
      - { name: current_occupancy, type: integer, source: computed, description: "Count of ParkVisits with area_id = this and status = OPEN", default: 0 }
      - { name: effective_capacity, type: integer, source: computed, description: "0 if any ACTIVE AreaClosure on this area; else peak_capacity if current minute-of-day inside any peak window; else capacity" }

  - name: AreaClosure
    parent: null
    common_fields: true
    fields:
      - { name: area_id, type: string, source: input, description: "FK -> ParkArea.id; closed area" }
      - { name: starts_at, type: datetime, source: input, description: "Closure window start, ISO8601 UTC (inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "Closure window end, ISO8601 UTC (exclusive); must be > starts_at" }
      - { name: reason, type: string, source: input, description: "Maintenance reason" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ACTIVE | COMPLETED | CANCELLED" }

  - name: ParkVisit
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; checking-in member (sponsor for guest visits, from X-User-ID)" }
      - { name: dog_id, type: string, source: input, description: "FK -> Dog.id; exactly one of dog_id / guest_pass_id set", default: null }
      - { name: guest_pass_id, type: string, source: input, description: "FK -> GuestPass.id; exactly one of dog_id / guest_pass_id set", default: null }
      - { name: area_id, type: string, source: input, description: "FK -> ParkArea.id; area entered" }
      - { name: checked_in_at, type: datetime, source: system, description: "ISO8601 UTC check-in instant" }
      - { name: checked_out_at, type: datetime, source: system, description: "ISO8601 UTC check-out instant; null while OPEN", default: null }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | FORCE_CLOSED" }
      - { name: close_reason, type: enum, source: system, description: "VOLUNTARY | MEMBER_SUSPENDED | NIGHTLY_SWEEP; null while OPEN", default: null }

  - name: IncidentReport
    parent: null
    common_fields: true
    fields:
      - { name: reporter_member_id, type: string, source: system, description: "FK -> Member.id; filing member (from X-User-ID); null when filed by ParkAdmin", default: null }
      - { name: subject_member_id, type: string, source: input, description: "FK -> Member.id; member the report is against" }
      - { name: subject_dog_id, type: string, source: input, description: "FK -> Dog.id; optional involved dog", default: null }
      - { name: area_id, type: string, source: input, description: "FK -> ParkArea.id; optional area where incident occurred", default: null }
      - { name: severity, type: enum, source: input, description: "MINOR (10 pts) | MAJOR (20 pts) | SEVERE (30 pts)" }
      - { name: description, type: string, source: input, description: "Free-text incident narrative" }
      - { name: occurred_at, type: datetime, source: input, description: "ISO8601 UTC when the incident occurred" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | CONFIRMED | DISMISSED" }
      - { name: resolution_note, type: string, source: system, description: "Optional note recorded at CONFIRMED/DISMISSED", default: null }

  - name: WasteStation
    parent: null
    common_fields: true
    fields:
      - { name: area_id, type: string, source: input, description: "FK -> ParkArea.id; area served" }
      - { name: name, type: string, source: input, description: "Station display name" }
      - { name: fill_pct, type: integer, source: system, description: "0..100; +25 per visit to its area since previous service-run (or creation), capped at 100; reset to 0 by servicing", default: 0 }
      - { name: status, type: enum, source: system, description: "OK | NEEDS_SERVICE (fill_pct >= 80)" }
      - { name: last_serviced_at, type: datetime, source: system, description: "ISO8601 UTC of last servicing; null until first service", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    field: status
    initial_state: PENDING_VERIFICATION
    terminal_states: []
    transitions:
      - from: PENDING_VERIFICATION
        to: ACTIVE
        trigger: "POST /dog-park/members/{id}/memberships (initial purchase)"
        actor: system
        preconditions:
          - "Member has >= 1 Dog with verification_status == VERIFIED (ERR_NO_VERIFIED_DOG)"
        side_effects:
          - "Member.version incremented; Membership created ACTIVE"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (strike_points reaches >= 30 after an IncidentReport is CONFIRMED)"
        actor: system
        preconditions:
          - "strike_points >= 30 (SUSPENSION_THRESHOLD)"
        side_effects:
          - "This suspension flips Membership ACTIVE -> SUSPENDED"
          - "Member's OPEN ParkVisits -> FORCE_CLOSED (close_reason=MEMBER_SUSPENDED); ParkArea.current_occupancy recomputed"
          - "Member's ISSUED GuestPasses -> VOID; guest_passes_used_this_month recomputed (VOID excluded)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /dog-park/members/{memberId}/reinstate"
        actor: ParkAdmin
        preconditions:
          - "Membership.status == SUSPENDED (else see SUSPENDED -> LAPSED)"
        side_effects:
          - "strike_points reset to 0"
          - "Membership SUSPENDED -> ACTIVE"
      - from: SUSPENDED
        to: LAPSED
        trigger: "POST /dog-park/members/{memberId}/reinstate"
        actor: ParkAdmin
        preconditions:
          - "Membership.status == EXPIRED"
        side_effects:
          - "strike_points reset to 0; membership remains EXPIRED (member must renew to reactivate)"
      - from: ACTIVE
        to: LAPSED
        trigger: "system (nightly service-run flips membership ACTIVE -> EXPIRED)"
        actor: system
        preconditions:
          - "Membership.status became EXPIRED in the same run"
        side_effects: []
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /dog-park/memberships/{membershipId}/renew (lapsed renewal)"
        actor: system
        preconditions:
          - "Membership EXPIRED -> ACTIVE in the same request"
        side_effects: []

  - entity: Dog
    field: verification_status
    initial_state: SUBMITTED
    terminal_states: []
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /dog-park/dogs/{dogId}/verify {decision: VERIFIED}"
        actor: ParkAdmin
        preconditions:
          - "vaccination_expires_on >= current logical date (ERR_VACCINATION_EXPIRED)"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /dog-park/dogs/{dogId}/verify {decision: REJECTED}"
        actor: ParkAdmin
        preconditions: []
        side_effects:
          - "rejection_reason set from request reason"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /dog-park/dogs/{dogId}/resubmit"
        actor: Member
        preconditions:
          - "caller owns the dog (ERR_NOT_OWNER)"
          - "new vaccination_expires_on >= current logical date (ERR_VACCINATION_EXPIRED)"
        side_effects:
          - "rejection_reason cleared to null"
      - from: VERIFIED
        to: EXPIRED
        trigger: "system (nightly service-run sweep when vaccination_expires_on < run date)"
        actor: system
        preconditions:
          - "vaccination_expires_on < current logical date"
        side_effects: []
      - from: EXPIRED
        to: SUBMITTED
        trigger: "POST /dog-park/dogs/{dogId}/resubmit"
        actor: Member
        preconditions:
          - "caller owns the dog (ERR_NOT_OWNER)"
          - "new vaccination_expires_on >= current logical date (ERR_VACCINATION_EXPIRED)"
        side_effects:
          - "rejection_reason cleared to null"

  - entity: Membership
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /dog-park/memberships/{membershipId}/renew (early renewal)"
        actor: Member
        preconditions:
          - "expected_membership_version matches Membership.version (ERR_STALE_VERSION) — checked FIRST, before member/membership state"
          - "Member.status == ACTIVE (ERR_MEMBER_NOT_ACTIVE) — checked before membership-state checks"
        side_effects:
          - "term_end extends to YYYY-12-31T23:59:59Z of the year after current term_end"
          - "charged_fee_cents = early-bird fee (renewal_fee.early_renewal)"
          - "renewal_count += 1; Membership.version incremented"
        note: "Self-loop: successive early renewals are legitimate; OCC on version is the only guard"
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /dog-park/memberships/{membershipId}/renew (lapsed renewal)"
        actor: Member
        preconditions:
          - "expected_membership_version matches Membership.version (ERR_STALE_VERSION) — checked FIRST"
          - "Member.status == LAPSED (ERR_MEMBER_NOT_ACTIVE) — checked before membership-state checks"
        side_effects:
          - "term_start = now; term_end = YYYY-12-31T23:59:59Z of current year"
          - "charged_fee_cents = lapsed fee (renewal_fee.lapsed_renewal)"
          - "renewal_count += 1; Membership.version incremented"
          - "Member LAPSED -> ACTIVE"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (member suspension cascade)"
        actor: system
        preconditions:
          - "Member.status became SUSPENDED in the same triggering request"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (member reinstatement cascade, membership not yet EXPIRED)"
        actor: system
        preconditions:
          - "Member reinstated via POST /dog-park/members/{memberId}/reinstate"
        side_effects: []
      - from: [ACTIVE, SUSPENDED]
        to: EXPIRED
        trigger: "system (nightly service-run when term_end < run time)"
        actor: system
        preconditions:
          - "term_end < current logical time"
        side_effects:
          - "If prior status was ACTIVE: Member ACTIVE -> LAPSED (member remains SUSPENDED if prior status was SUSPENDED)"

  - entity: GuestPass
    field: status
    initial_state: ISSUED
    terminal_states: [REDEEMED, VOID, EXPIRED]
    transitions:
      - from: ISSUED
        to: REDEEMED
        trigger: "POST /dog-park/visits/check-in with guest_pass_id"
        actor: Member
        preconditions:
          - "valid_on == current logical date (ERR_GUEST_PASS_NOT_REDEEMABLE)"
          - "guest_dog_size_class == area.size_class_restriction (ERR_DOG_SIZE_AREA_MISMATCH)"
          - "area capacity check passes (ERR_AREA_AT_CAPACITY)"
        side_effects:
          - "ParkVisit created OPEN with guest_pass_id set; member_id = sponsor"
          - "ParkArea.current_occupancy recomputed"
      - from: ISSUED
        to: VOID
        trigger: "POST /dog-park/guest-passes/{passId}/void OR system (sponsor suspension cascade)"
        actor: ParkAdmin
        preconditions:
          - "status == ISSUED (ERR_GUEST_PASS_NOT_VOIDABLE)"
        side_effects:
          - "guest_passes_used_this_month recomputed (VOID excluded => allotment refunded)"
      - from: ISSUED
        to: EXPIRED
        trigger: "system (nightly service-run when valid_on < run date)"
        actor: system
        preconditions:
          - "valid_on < current logical date"
        side_effects:
          - "guest_passes_used_this_month recomputed (EXPIRED still counts against the purchase month's allotment)"

  - entity: ParkVisit
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED, FORCE_CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /dog-park/visits/{visitId}/check-out"
        actor: Member
        preconditions:
          - "status == OPEN (ERR_VISIT_NOT_OPEN)"
          - "caller is visit.member_id (ERR_NOT_OWNER; ParkAdmin exempt)"
        side_effects:
          - "checked_out_at set; close_reason = VOLUNTARY"
          - "ParkArea.current_occupancy recomputed"
      - from: OPEN
        to: FORCE_CLOSED
        trigger: "system (member suspension cascade OR nightly service-run sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "checked_out_at set; close_reason = MEMBER_SUSPENDED or NIGHTLY_SWEEP"
          - "ParkArea.current_occupancy recomputed"

  - entity: IncidentReport
    field: status
    initial_state: FILED
    terminal_states: [CONFIRMED, DISMISSED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /dog-park/incident-reports/{reportId}/advance {to: UNDER_REVIEW}"
        actor: Steward
        preconditions:
          - "status == FILED (ERR_INCIDENT_NOT_ADVANCABLE)"
          - "caller is a Steward (is_steward member) or ParkAdmin"
        side_effects:
          - "subject member's provisional_strike_score recomputed"
      - from: UNDER_REVIEW
        to: CONFIRMED
        trigger: "POST /dog-park/incident-reports/{reportId}/advance {to: CONFIRMED}"
        actor: ParkAdmin
        preconditions:
          - "status == UNDER_REVIEW (ERR_INCIDENT_NOT_ADVANCABLE)"
          - "caller is ParkAdmin (Steward receives ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects:
          - "subject Member.strike_points recomputed (CONFIRMED severities: MINOR 10 / MAJOR 20 / SEVERE 30)"
          - "If strike_points >= 30: Member -> SUSPENDED; that suspension cascades: Membership ACTIVE -> SUSPENDED; member's OPEN ParkVisits -> FORCE_CLOSED (MEMBER_SUSPENDED); member's ISSUED GuestPasses -> VOID (allotment refunded)"
          - "resolution_note recorded if provided"
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /dog-park/incident-reports/{reportId}/advance {to: DISMISSED}"
        actor: ParkAdmin
        preconditions:
          - "status == UNDER_REVIEW (ERR_INCIDENT_NOT_ADVANCABLE)"
        side_effects:
          - "subject member's provisional_strike_score recomputed (report no longer pending)"
          - "resolution_note recorded if provided"

  - entity: AreaClosure
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system (nightly service-run when starts_at <= run time < ends_at)"
        actor: system
        preconditions:
          - "starts_at <= current logical time < ends_at"
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (nightly service-run when run time >= ends_at)"
        actor: system
        preconditions:
          - "current logical time >= ends_at"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /dog-park/closures/{closureId}/cancel"
        actor: ParkAdmin
        preconditions:
          - "status == SCHEDULED (ERR_CLOSURE_NOT_CANCELLABLE)"
        side_effects: []

  - entity: WasteStation
    field: status
    initial_state: OK
    terminal_states: []
    transitions:
      - from: OK
        to: NEEDS_SERVICE
        trigger: "system (nightly service-run accumulation: fill_pct >= 80 after adding 25 per area visit since previous run)"
        actor: system
        preconditions:
          - "fill_pct >= 80 (FILL_THRESHOLD_PCT) after accumulation"
        side_effects: []
      - from: [OK, NEEDS_SERVICE]
        to: OK
        trigger: "POST /dog-park/waste-stations/{stationId}/service"
        actor: Steward
        preconditions: []
        side_effects:
          - "fill_pct reset to 0; last_serviced_at = current logical time"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version; the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: member-profile-update-occ
    parent_entity: Member
    write_endpoint: "PATCH /dog-park/members/{memberId}"
    occ_field: expected_member_version
    description: |
      Updating a Member profile whose version has advanced since the client last
      observed it is rejected. Two sequential profile updates are each legitimate
      under product semantics; the one carrying a stale expected_member_version
      is rejected so a client never silently overwrites fields it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: membership-renew-stale-version
    parent_entity: Membership
    write_endpoint: "POST /dog-park/memberships/{membershipId}/renew"
    occ_field: expected_membership_version
    description: |
      Renewing a Membership whose version has advanced since the client last
      observed it is rejected. Successive early renewals legitimately extend the
      term by one year each, so a second renewal sent with a stale
      expected_membership_version would silently double-extend without the OCC
      guard; the stale request is rejected instead.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: initial_membership_fee
    trigger: "POST /dog-park/members/{id}/memberships (initial purchase)"
    algorithm: proration
    formula: |
      days_remaining = whole days from purchase date (inclusive) through Dec 31 (inclusive)
      base_line = round_half_up(BASE_ANNUAL_FEE_CENTS * days_remaining / DAYS_IN_YEAR)
      extra_dogs = max(0, count(member's VERIFIED dogs) - 1)
      dog_line = round_half_up(ADDITIONAL_DOG_FEE_CENTS * extra_dogs * days_remaining / DAYS_IN_YEAR)
      charged_fee_cents = base_line + dog_line
      ROUNDING ORDER PINNED: each line is rounded to integer cents FIRST, then summed.
      (Sum-then-round is the rejected alternative: at days_remaining=61 with 2 dogs,
      per-line gives 2005 + 501 = 2506 while sum-then-round gives 2507.)
    input_set: "Member's Dogs with verification_status == VERIFIED at purchase time; first dog included in base"
    constants:
      BASE_ANNUAL_FEE_CENTS: 12000
      ADDITIONAL_DOG_FEE_CENTS: 3000
      DAYS_IN_YEAR: 365
    precision: "integer cents, round_half_up per line, then sum"

  - name: renewal_fee
    trigger: "POST /dog-park/memberships/{membershipId}/renew"
    algorithm: tiered_pricing
    formula: |
      extra_dogs = max(0, count(member's VERIFIED dogs) - 1)
      early_renewal (membership ACTIVE at renewal):
        base_line = round_half_up(BASE_ANNUAL_FEE_CENTS * (1 - EARLY_BIRD_DISCOUNT_PCT))
        dog_line  = round_half_up(ADDITIONAL_DOG_FEE_CENTS * extra_dogs * (1 - EARLY_BIRD_DISCOUNT_PCT))
        charged_fee_cents = base_line + dog_line
      lapsed_renewal (membership EXPIRED at renewal):
        charged_fee_cents = BASE_ANNUAL_FEE_CENTS + ADDITIONAL_DOG_FEE_CENTS * extra_dogs + REINSTATEMENT_FEE_CENTS
        (full calendar-year lines, no proration, no discount, plus flat reinstatement)
    input_set: "Member's Dogs with verification_status == VERIFIED at renewal time"
    constants:
      BASE_ANNUAL_FEE_CENTS: 12000
      ADDITIONAL_DOG_FEE_CENTS: 3000
      EARLY_BIRD_DISCOUNT_PCT: 0.10
      REINSTATEMENT_FEE_CENTS: 2500
    precision: "integer cents, round_half_up per line, then sum"
    variants:
      - name: early_renewal
        when: "Membership.status == ACTIVE at renewal time"
        difference: "10% off each fee line; term_end extends to Dec 31 of the year AFTER current term_end"
      - name: lapsed_renewal
        when: "Membership.status == EXPIRED at renewal time"
        difference: "full undiscounted lines + 2500 reinstatement fee; term restarts at now and ends Dec 31 of current year"

  - name: strike_score
    trigger: "IncidentReport transitions to UNDER_REVIEW / CONFIRMED / DISMISSED"
    algorithm: weighted_scoring
    formula: |
      confirmed_points = sum(SEVERITY_POINTS[s] for subject's reports with status == CONFIRMED)
      pending_points   = sum(SEVERITY_POINTS[s] for subject's reports with status IN {FILED, UNDER_REVIEW})
      confirmed_score    = confirmed_points
      provisional_score  = confirmed_points + round_half_up(PROVISIONAL_WEIGHT * pending_points)
      Suspension fires when confirmed_score >= SUSPENSION_THRESHOLD (boundary: exactly 30 suspends).
    input_set: "IncidentReports with subject_member_id = member; CONFIRMED at full weight, FILED/UNDER_REVIEW at half weight, DISMISSED excluded"
    constants:
      SEVERITY_POINTS: { MINOR: 10, MAJOR: 20, SEVERE: 30 }
      PROVISIONAL_WEIGHT: 0.5
      SUSPENSION_THRESHOLD: 30
    precision: "integer points, round_half_up on the pending half-weight term only"
    variants:
      - name: confirmed_score
        when: "authoritative record on Member.strike_points; drives suspension"
        difference: "counts only CONFIRMED reports at full weight"
      - name: provisional_score
        when: "advisory read on Member.provisional_strike_score; never suspends"
        difference: "adds round_half_up(0.5 * pending points) on top of confirmed points"

  - name: effective_capacity
    trigger: "POST /dog-park/visits/check-in; also exposed on ParkArea reads"
    algorithm: threshold
    formula: |
      if exists AreaClosure on area with status == ACTIVE:
        effective_capacity = 0
      elif current minute-of-day IN any peak window [start_minute, end_minute) (half-open):
        effective_capacity = min(capacity, peak_capacity)
      else:
        effective_capacity = capacity
      check-in admitted iff count(OPEN visits in area) < effective_capacity
      (boundary: occupancy == effective_capacity rejects; == effective_capacity - 1 admits)
    input_set: "ParkArea.capacity, peak_capacity, peak_windows; AreaClosures with status == ACTIVE; current logical minute-of-day"
    constants: {}
    precision: "integer visit count"

  - name: occupancy_count
    trigger: "ParkVisit create / check-out / force-close; exposed on ParkArea reads"
    algorithm: aggregation
    formula: |
      current_occupancy = count(ParkVisit where area_id = area.id and status == OPEN)
      Only OPEN visits count; CLOSED and FORCE_CLOSED are excluded.
    input_set: "ParkVisits for the area with status == OPEN"
    constants: {}
    precision: "integer count"

  - name: guest_pass_fee
    trigger: "POST /dog-park/guest-passes"
    algorithm: threshold
    formula: |
      if weekday_of(valid_on, UTC) IN {Saturday, Sunday}:
        fee_cents = round_half_up(GUEST_WEEKDAY_FEE_CENTS * GUEST_WEEKEND_MULTIPLIER)   # = 2250
      else:
        fee_cents = GUEST_WEEKDAY_FEE_CENTS                                              # = 1500
    input_set: "the pass's valid_on date only"
    constants:
      GUEST_WEEKDAY_FEE_CENTS: 1500
      GUEST_WEEKEND_MULTIPLIER: 1.5
    precision: "integer cents, round_half_up"
    variants:
      - name: weekday
        when: "valid_on is Monday-Friday (UTC)"
        difference: "flat 1500"
      - name: weekend_peak
        when: "valid_on is Saturday or Sunday (UTC)"
        difference: "1500 * 1.5 = 2250"

  - name: waste_fill_accumulation
    trigger: "POST /dog-park/service-runs/nightly"
    algorithm: threshold
    formula: |
      for each WasteStation:
        new_visits = count(ParkVisit in station's area with checked_in_at after the
                     previous service-run time (or station creation time if no prior run))
        fill_pct = min(100, fill_pct + FILL_PER_VISIT_PCT * new_visits)
        if fill_pct >= FILL_THRESHOLD_PCT: status = NEEDS_SERVICE
      (boundary: 3 visits -> 75 stays OK; 4 visits -> 100 flips NEEDS_SERVICE)
    input_set: "ParkVisits in the station's area checked in since the previous run/creation; all visit statuses counted"
    constants:
      FILL_PER_VISIT_PCT: 25
      FILL_THRESHOLD_PCT: 80
    precision: "integer percent, capped at 100"

  - name: guest_monthly_usage
    trigger: "GuestPass purchase / void / expire; exposed as Member.guest_passes_used_this_month"
    algorithm: aggregation
    formula: |
      guest_passes_used_this_month = count(GuestPass where sponsor_member_id = member.id
        AND created_at within current calendar month (logical clock)
        AND status IN {ISSUED, REDEEMED, EXPIRED})     # VOID excluded: voiding refunds the allotment
      purchase admitted iff guest_passes_used_this_month < GUEST_MONTHLY_LIMIT
      (boundary: count == 2 rejects a third purchase; count == 1 admits)
    input_set: "Sponsor's GuestPasses created in the current calendar month; VOID excluded"
    constants:
      GUEST_MONTHLY_LIMIT: 2
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "X-User-Role == Steward requires the caller Member.is_steward == true (ParkAdmin exempt)"
    error_id: ERR_NOT_A_STEWARD
    http_status: 403
    applies_to: "endpoints listing Steward in roles"
  - priority: 4
    category: auth
    check: "Member role acts only on own resources: path memberId == X-User-ID; dog/membership/pass/visit belongs to X-User-ID; list sponsor filter == X-User-ID (ParkAdmin/Steward exempt per endpoint roles)"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "member-scoped endpoints"
  - priority: 5
    category: existence
    check: "Request shape: required fields present, enum values valid, exactly one of dog_id/guest_pass_id at check-in, ends_at > starts_at, peak_capacity <= capacity, limit/offset within pagination bounds"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 6
    category: existence
    check: "Path ids exist, validated left-to-right (memberId, then dogId/areaId, then child id)"
    error_id: "ERR_MEMBER_NOT_FOUND / ERR_DOG_NOT_FOUND / ERR_MEMBERSHIP_NOT_FOUND / ERR_GUEST_PASS_NOT_FOUND / ERR_AREA_NOT_FOUND / ERR_CLOSURE_NOT_FOUND / ERR_VISIT_NOT_FOUND / ERR_INCIDENT_NOT_FOUND / ERR_WASTE_STATION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 7
    category: state
    check: "OCC: expected_<parent>_version equals the parent entity's current version (checked before resource-state rules)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /dog-park/members/{memberId}; POST /dog-park/memberships/{membershipId}/renew"
  - priority: 8
    category: state
    check: "State preconditions per state machine: member ACTIVE (or LAPSED for renew; member-state checked before membership-state on renew), dog VERIFIED at check-in, pass ISSUED, visit OPEN, report in valid from-state, closure SCHEDULED for cancel, >= 1 VERIFIED dog at membership purchase"
    error_id: "ERR_MEMBER_NOT_ACTIVE / ERR_MEMBER_NOT_SUSPENDED / ERR_DOG_NOT_VERIFIABLE / ERR_DOG_NOT_RESUBMITTABLE / ERR_DOG_NOT_VERIFIED / ERR_NO_VERIFIED_DOG / ERR_GUEST_PASS_NOT_REDEEMABLE / ERR_GUEST_PASS_NOT_VOIDABLE / ERR_CLOSURE_NOT_CANCELLABLE / ERR_VISIT_NOT_OPEN / ERR_INCIDENT_NOT_ADVANCABLE"
    http_status: 409
    applies_to: "state transition endpoints"
  - priority: 9
    category: business_safety
    check: "Rabies vaccination current: vaccination_expires_on >= current logical date at dog verify/resubmit and at check-in"
    error_id: ERR_VACCINATION_EXPIRED
    http_status: 422
    applies_to: "POST /dog-park/dogs/{dogId}/verify; POST /dog-park/dogs/{dogId}/resubmit; POST /dog-park/visits/check-in"
  - priority: 10
    category: business_constraint
    check: "Dog/pass size class matches area restriction; no second OPEN visit for the same dog (open-ended interval); reporter != subject on incident filing"
    error_id: "ERR_DOG_SIZE_AREA_MISMATCH / ERR_ALREADY_CHECKED_IN / ERR_SELF_REPORT_NOT_ALLOWED"
    http_status: 409
    applies_to: "check-in; incident filing"
  - priority: 11
    category: business_temporal
    check: "No ACTIVE AreaClosure on the target area at check-in; guest pass valid_on == current logical date at redemption; new closure window must not overlap an existing SCHEDULED/ACTIVE closure on the same area (half-open [starts_at, ends_at); adjacency allowed)"
    error_id: "ERR_AREA_CLOSED / ERR_GUEST_PASS_NOT_REDEEMABLE / ERR_CLOSURE_OVERLAP"
    http_status: 409
    applies_to: "check-in; closure creation"
  - priority: 12
    category: business_fiscal
    check: "Quota last: area OPEN-visit count < effective_capacity; sponsor monthly guest-pass usage < GUEST_MONTHLY_LIMIT"
    error_id: "ERR_AREA_AT_CAPACITY / ERR_GUEST_PASS_MONTHLY_LIMIT"
    http_status: 409
    applies_to: "POST /dog-park/visits/check-in; POST /dog-park/guest-passes"

# =============================================================================
# §1.5 API Endpoint Table (36 endpoints)
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/dog-park/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time."
    roles: [ParkAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["logical clock set; no entity mutations"]

  # --- Member ---
  - method: POST
    path: "/dog-park/members"
    description: "Register a new member account"
    roles: [Anonymous]
    code: 201
    input: [full_name, email, "phone?"]
    output: Member
    side_effects: ["status=PENDING_VERIFICATION; strike_points=0; provisional_strike_score=0; is_steward=false; guest_passes_used_this_month=0; version=1"]

  - method: GET
    path: "/dog-park/members/{memberId}"
    description: "Get a member (Member role: self only)"
    roles: [Member, Steward, ParkAdmin]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: PATCH
    path: "/dog-park/members/{memberId}"
    description: "Update member profile with OCC on Member.version"
    roles: [Member, ParkAdmin]
    code: 200
    input: [expected_member_version, "full_name?", "email?", "phone?"]
    output: Member
    side_effects: ["increments Member.version by 1"]

  - method: POST
    path: "/dog-park/members/{memberId}/reinstate"
    description: "Reinstate a suspended member; clears strikes and reactivates a SUSPENDED membership"
    roles: [ParkAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["Member SUSPENDED -> ACTIVE (membership SUSPENDED) or SUSPENDED -> LAPSED (membership EXPIRED); strike_points=0; Membership SUSPENDED -> ACTIVE when applicable; increments Member.version by 1"]

  - method: POST
    path: "/dog-park/members/{memberId}/steward-status"
    description: "Grant or revoke the volunteer-steward flag"
    roles: [ParkAdmin]
    code: 200
    input: [is_steward]
    output: Member
    side_effects: ["is_steward set; increments Member.version by 1"]

  # --- Dog ---
  - method: POST
    path: "/dog-park/members/{id}/dogs"
    description: "Register a dog for a member (vaccination/license submitted for verification)"
    roles: [Member, ParkAdmin]
    code: 201
    input: [name, size_class, license_number, vaccination_expires_on]
    output: Dog
    side_effects: ["verification_status=SUBMITTED; rejection_reason=null"]

  - method: GET
    path: "/dog-park/members/{id}/dogs"
    description: "List a member's dogs (Member role: self only)"
    roles: [Member, Steward, ParkAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Dog[]"
    side_effects: []

  - method: GET
    path: "/dog-park/dogs/{dogId}"
    description: "Get a dog (Member role: owner only)"
    roles: [Member, Steward, ParkAdmin]
    code: 200
    input: []
    output: Dog
    side_effects: []

  - method: POST
    path: "/dog-park/dogs/{dogId}/verify"
    description: "Verify or reject a submitted dog's vaccination/license documents"
    roles: [ParkAdmin]
    code: 200
    input: [decision, "reason?"]
    output: Dog
    side_effects: ["SUBMITTED -> VERIFIED (decision=VERIFIED) or -> REJECTED (decision=REJECTED, rejection_reason set); increments Dog.version by 1"]

  - method: POST
    path: "/dog-park/dogs/{dogId}/resubmit"
    description: "Resubmit a REJECTED or EXPIRED dog with refreshed vaccination/license data"
    roles: [Member]
    code: 200
    input: [vaccination_expires_on, license_number]
    output: Dog
    side_effects: ["REJECTED|EXPIRED -> SUBMITTED; rejection_reason=null; increments Dog.version by 1"]

  # --- Membership ---
  - method: POST
    path: "/dog-park/members/{id}/memberships"
    description: "Purchase the initial annual membership (prorated fee; term ends Dec 31)"
    roles: [Member, ParkAdmin]
    code: 201
    input: []
    output: Membership
    side_effects: ["requires >= 1 VERIFIED dog; status=ACTIVE; term_start=now; term_end=YYYY-12-31T23:59:59Z; charged_fee_cents per initial_membership_fee; Member PENDING_VERIFICATION -> ACTIVE (increments Member.version by 1)"]

  - method: GET
    path: "/dog-park/members/{id}/memberships"
    description: "List a member's memberships (Member role: self only)"
    roles: [Member, ParkAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Membership[]"
    side_effects: []

  - method: POST
    path: "/dog-park/memberships/{membershipId}/renew"
    description: "Renew a membership with OCC: early renewal (ACTIVE, 10% off, extends a year) or lapsed renewal (EXPIRED, full fee + reinstatement)"
    roles: [Member, ParkAdmin]
    code: 200
    input: [expected_membership_version]
    output: Membership
    side_effects: ["renewal_fee per variant; term extended/restarted; renewal_count += 1; increments Membership.version by 1; lapsed renewal cascades Member LAPSED -> ACTIVE"]

  # --- GuestPass ---
  - method: POST
    path: "/dog-park/guest-passes"
    description: "Purchase a guest day pass (sponsor = calling member)"
    roles: [Member]
    code: 201
    input: [guest_dog_size_class, valid_on]
    output: GuestPass
    side_effects: ["requires sponsor Member.status == ACTIVE; monthly usage < 2; fee_cents per guest_pass_fee; status=ISSUED; sponsor_member_id from X-User-ID"]

  - method: GET
    path: "/dog-park/guest-passes"
    description: "List guest passes, filterable (Member role: sponsor_member_id must equal X-User-ID or is auto-scoped to it)"
    roles: [Member, Steward, ParkAdmin]
    code: 200
    input: ["sponsor_member_id?", "status?", "valid_on?", "limit?", "offset?"]
    output: "GuestPass[]"
    side_effects: []

  - method: GET
    path: "/dog-park/guest-passes/{passId}"
    description: "Get a guest pass (Member role: sponsor only)"
    roles: [Member, Steward, ParkAdmin]
    code: 200
    input: []
    output: GuestPass
    side_effects: []

  - method: POST
    path: "/dog-park/guest-passes/{passId}/void"
    description: "Void an ISSUED guest pass (refunds the sponsor's monthly allotment)"
    roles: [ParkAdmin]
    code: 200
    input: []
    output: GuestPass
    side_effects: ["ISSUED -> VOID; guest_passes_used_this_month recomputed (VOID excluded)"]

  # --- ParkArea ---
  - method: POST
    path: "/dog-park/areas"
    description: "Create a park area (size-class restriction, capacity, peak derating)"
    roles: [ParkAdmin]
    code: 201
    input: [name, size_class_restriction, capacity, peak_capacity, "peak_windows?"]
    output: ParkArea
    side_effects: ["current_occupancy=0; effective_capacity=capacity"]

  - method: GET
    path: "/dog-park/areas"
    description: "List park areas with computed occupancy/effective capacity"
    roles: [Member, Steward, ParkAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ParkArea[]"
    side_effects: []

  - method: GET
    path: "/dog-park/areas/{areaId}"
    description: "Get a park area with computed current_occupancy and effective_capacity"
    roles: [Member, Steward, ParkAdmin]
    code: 200
    input: []
    output: ParkArea
    side_effects: []

  # --- AreaClosure ---
  - method: POST
    path: "/dog-park/areas/{id}/closures"
    description: "Schedule a maintenance closure window (half-open [starts_at, ends_at); no overlap with SCHEDULED/ACTIVE closures on the same area; adjacency allowed)"
    roles: [ParkAdmin]
    code: 201
    input: [starts_at, ends_at, reason]
    output: AreaClosure
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/dog-park/areas/{id}/closures"
    description: "List closure windows for an area"
    roles: [Member, Steward, ParkAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "AreaClosure[]"
    side_effects: []

  - method: POST
    path: "/dog-park/closures/{closureId}/cancel"
    description: "Cancel a SCHEDULED closure"
    roles: [ParkAdmin]
    code: 200
    input: []
    output: AreaClosure
    side_effects: ["SCHEDULED -> CANCELLED"]

  # --- ParkVisit ---
  - method: POST
    path: "/dog-park/visits/check-in"
    description: "Gate check-in with a member dog OR a guest pass (exactly one); enforces verification, vaccination, size rule, closure, capacity"
    roles: [Member, ParkAdmin]
    code: 201
    input: [area_id, "dog_id?", "guest_pass_id?"]
    output: ParkVisit
    side_effects: ["ParkVisit created OPEN (member_id = caller/sponsor); guest pass ISSUED -> REDEEMED when guest_pass_id given; ParkArea.current_occupancy recomputed"]

  - method: POST
    path: "/dog-park/visits/{visitId}/check-out"
    description: "Voluntary check-out of an OPEN visit"
    roles: [Member, ParkAdmin]
    code: 200
    input: []
    output: ParkVisit
    side_effects: ["OPEN -> CLOSED (VOLUNTARY); checked_out_at set; ParkArea.current_occupancy recomputed"]

  - method: GET
    path: "/dog-park/visits"
    description: "List visits, filterable by all FKs and status"
    roles: [Steward, ParkAdmin]
    code: 200
    input: ["member_id?", "dog_id?", "area_id?", "guest_pass_id?", "status?", "limit?", "offset?"]
    output: "ParkVisit[]"
    side_effects: []

  - method: GET
    path: "/dog-park/visits/{visitId}"
    description: "Get a visit (Member role: own visits only)"
    roles: [Member, Steward, ParkAdmin]
    code: 200
    input: []
    output: ParkVisit
    side_effects: []

  # --- IncidentReport ---
  - method: POST
    path: "/dog-park/incident-reports"
    description: "File a bite/aggression incident report against a member"
    roles: [Member, Steward, ParkAdmin]
    code: 201
    input: [subject_member_id, severity, occurred_at, description, "subject_dog_id?", "area_id?"]
    output: IncidentReport
    side_effects: ["status=FILED; reporter_member_id from X-User-ID (null for ParkAdmin); subject's provisional_strike_score recomputed"]

  - method: GET
    path: "/dog-park/incident-reports"
    description: "List incident reports, filterable"
    roles: [Steward, ParkAdmin]
    code: 200
    input: ["reporter_member_id?", "subject_member_id?", "subject_dog_id?", "area_id?", "status?", "limit?", "offset?"]
    output: "IncidentReport[]"
    side_effects: []

  - method: GET
    path: "/dog-park/incident-reports/{reportId}"
    description: "Get an incident report"
    roles: [Steward, ParkAdmin]
    code: 200
    input: []
    output: IncidentReport
    side_effects: []

  - method: POST
    path: "/dog-park/incident-reports/{reportId}/advance"
    description: "Advance a report: FILED->UNDER_REVIEW (Steward or ParkAdmin); UNDER_REVIEW->CONFIRMED|DISMISSED (ParkAdmin only)"
    roles: [Steward, ParkAdmin]
    code: 200
    input: [to, "resolution_note?"]
    output: IncidentReport
    side_effects: ["state transition per role; CONFIRMED recomputes strike_points and may trigger the full suspension cascade"]

  # --- WasteStation ---
  - method: POST
    path: "/dog-park/areas/{id}/waste-stations"
    description: "Install a waste station in an area"
    roles: [ParkAdmin]
    code: 201
    input: [name]
    output: WasteStation
    side_effects: ["fill_pct=0; status=OK; last_serviced_at=null"]

  - method: GET
    path: "/dog-park/areas/{id}/waste-stations"
    description: "List waste stations in an area"
    roles: [Steward, ParkAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "WasteStation[]"
    side_effects: []

  - method: POST
    path: "/dog-park/waste-stations/{stationId}/service"
    description: "Record waste-station servicing (empties station, clears NEEDS_SERVICE)"
    roles: [Steward, ParkAdmin]
    code: 200
    input: []
    output: WasteStation
    side_effects: ["fill_pct=0; status=OK; last_serviced_at=now"]

  # --- Ops-run checkpoint ---
  - method: POST
    path: "/dog-park/service-runs/nightly"
    description: "Execute the nightly service-run epoch, in pinned order: (1) force-close all OPEN visits (NIGHTLY_SWEEP); (2) expire memberships past term_end and lapse their ACTIVE members; (3) expire ISSUED guest passes with valid_on < today; (4) activate/complete closure windows; (5) accumulate waste-station fill from area visits since the previous run and flag NEEDS_SERVICE; (6) expire dog verifications past vaccination_expires_on"
    roles: [ParkAdmin]
    code: 201
    input: []
    output: { visits_force_closed: integer, memberships_expired: integer, members_lapsed: integer, guest_passes_expired: integer, closures_activated: integer, closures_completed: integer, dogs_expired: integer, stations_flagged: integer }
    side_effects: ["all six cascade steps above execute atomically in order; every mutated entity's version increments"]

# =============================================================================
# §1.6 Error Code Catalog (34 errors)
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or not a declared role" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Caller role not in endpoint roles (incl. Steward attempting ParkAdmin-only advance outcomes)" }
  - { id: ERR_NOT_A_STEWARD, http: 403, condition: "X-User-Role=Steward but the caller Member.is_steward is false" }
  - { id: ERR_NOT_OWNER, http: 403, condition: "Member role acting on a resource owned by another member" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, both/neither dog_id+guest_pass_id, ends_at <= starts_at, peak_capacity > capacity, bad pagination params" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "memberId does not exist" }
  - { id: ERR_DOG_NOT_FOUND, http: 404, condition: "dogId does not exist" }
  - { id: ERR_MEMBERSHIP_NOT_FOUND, http: 404, condition: "membershipId does not exist" }
  - { id: ERR_GUEST_PASS_NOT_FOUND, http: 404, condition: "passId does not exist" }
  - { id: ERR_AREA_NOT_FOUND, http: 404, condition: "areaId does not exist" }
  - { id: ERR_CLOSURE_NOT_FOUND, http: 404, condition: "closureId does not exist" }
  - { id: ERR_VISIT_NOT_FOUND, http: 404, condition: "visitId does not exist" }
  - { id: ERR_INCIDENT_NOT_FOUND, http: 404, condition: "reportId does not exist" }
  - { id: ERR_WASTE_STATION_NOT_FOUND, http: 404, condition: "stationId does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_MEMBER_NOT_ACTIVE, http: 409, condition: "Operation requires Member.status ACTIVE (or LAPSED for renewal); PENDING_VERIFICATION/SUSPENDED rejected" }
  - { id: ERR_MEMBER_NOT_SUSPENDED, http: 409, condition: "Reinstate requires Member.status SUSPENDED" }
  - { id: ERR_DOG_NOT_VERIFIABLE, http: 409, condition: "Verify requires Dog.verification_status SUBMITTED" }
  - { id: ERR_DOG_NOT_RESUBMITTABLE, http: 409, condition: "Resubmit requires Dog.verification_status REJECTED or EXPIRED" }
  - { id: ERR_DOG_NOT_VERIFIED, http: 409, condition: "Check-in requires Dog.verification_status VERIFIED" }
  - { id: ERR_NO_VERIFIED_DOG, http: 409, condition: "Membership purchase requires >= 1 VERIFIED dog" }
  - { id: ERR_GUEST_PASS_NOT_REDEEMABLE, http: 409, condition: "Guest pass not ISSUED, or valid_on != current logical date" }
  - { id: ERR_GUEST_PASS_NOT_VOIDABLE, http: 409, condition: "Void requires GuestPass.status ISSUED (REDEEMED/EXPIRED/VOID rejected)" }
  - { id: ERR_CLOSURE_NOT_CANCELLABLE, http: 409, condition: "Cancel requires AreaClosure.status SCHEDULED" }
  - { id: ERR_VISIT_NOT_OPEN, http: 409, condition: "Check-out requires ParkVisit.status OPEN" }
  - { id: ERR_INCIDENT_NOT_ADVANCABLE, http: 409, condition: "Advance target not reachable from current status (FILED->UNDER_REVIEW; UNDER_REVIEW->CONFIRMED/DISMISSED only)" }
  - { id: ERR_VACCINATION_EXPIRED, http: 422, condition: "vaccination_expires_on < current logical date at verify/resubmit/check-in" }
  - { id: ERR_DOG_SIZE_AREA_MISMATCH, http: 409, condition: "Dog size_class or pass guest_dog_size_class != area.size_class_restriction" }
  - { id: ERR_ALREADY_CHECKED_IN, http: 409, condition: "Dog already has an OPEN visit (unbounded open interval overlap)" }
  - { id: ERR_SELF_REPORT_NOT_ALLOWED, http: 422, condition: "subject_member_id equals the reporting member's id" }
  - { id: ERR_CLOSURE_OVERLAP, http: 409, condition: "New closure window overlaps an existing SCHEDULED/ACTIVE closure on the same area (half-open adjacency allowed)" }
  - { id: ERR_AREA_CLOSED, http: 409, condition: "An ACTIVE AreaClosure exists on the target area at check-in" }
  - { id: ERR_AREA_AT_CAPACITY, http: 409, condition: "Area OPEN-visit count >= effective_capacity" }
  - { id: ERR_GUEST_PASS_MONTHLY_LIMIT, http: 409, condition: "Sponsor already used 2 guest-pass allotments this calendar month" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated registrant context"
    identity: opaque
    exclusive_operations:
      - "POST /dog-park/members — register a member account"
    shared_operations: []

  - name: Member
    description: "Registered dog-park member; X-User-ID is the Member.id and ownership is enforced against it"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /dog-park/dogs/{dogId}/resubmit — resubmit own dog"
      - "POST /dog-park/guest-passes — purchase guest pass (sponsor = self)"
    shared_operations:
      - "PATCH /dog-park/members/{memberId} — update own profile (shared with ParkAdmin)"
      - "POST /dog-park/members/{id}/dogs — add dog to own account (shared with ParkAdmin)"
      - "POST /dog-park/members/{id}/memberships — purchase membership (shared with ParkAdmin)"
      - "POST /dog-park/memberships/{membershipId}/renew — renew own membership (shared with ParkAdmin)"
      - "POST /dog-park/visits/check-in, POST /dog-park/visits/{visitId}/check-out — own visits (shared with ParkAdmin)"
      - "POST /dog-park/incident-reports — file report (shared with Steward, ParkAdmin)"
      - "GET reads of own member/dogs/memberships/passes/visits and of areas/closures (shared with Steward, ParkAdmin)"

  - name: Steward
    description: "Volunteer steward; X-User-ID is a Member.id whose is_steward flag is true (else ERR_NOT_A_STEWARD)"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /dog-park/waste-stations/{stationId}/service — record servicing (shared with ParkAdmin)"
      - "POST /dog-park/incident-reports/{reportId}/advance with to=UNDER_REVIEW — triage (shared with ParkAdmin; CONFIRMED/DISMISSED are ParkAdmin-only)"
    shared_operations:
      - "POST /dog-park/incident-reports — file report (shared with Member, ParkAdmin)"
      - "GET lists of visits/incidents/waste-stations and reads of members/dogs/areas/closures (shared with ParkAdmin)"

  - name: ParkAdmin
    description: "Municipal park administrator; hierarchical superset of all member/steward operations"
    identity: opaque
    exclusive_operations:
      - "POST /dog-park/dogs/{dogId}/verify — verify/reject dog documents"
      - "POST /dog-park/members/{memberId}/reinstate — reinstate suspended member"
      - "POST /dog-park/members/{memberId}/steward-status — grant/revoke steward flag"
      - "POST /dog-park/areas, POST /dog-park/areas/{id}/closures, POST /dog-park/closures/{closureId}/cancel — area & closure management"
      - "POST /dog-park/areas/{id}/waste-stations — install stations"
      - "POST /dog-park/guest-passes/{passId}/void — void guest pass"
      - "POST /dog-park/incident-reports/{reportId}/advance with to=CONFIRMED|DISMISSED — adjudicate"
      - "POST /dog-park/service-runs/nightly — run the nightly epoch"
      - "POST /dog-park/_clock/set_current_utc — set logical clock"
    shared_operations:
      - "All Member and Steward shared_operations (hierarchical override; ownership checks exempt)"
