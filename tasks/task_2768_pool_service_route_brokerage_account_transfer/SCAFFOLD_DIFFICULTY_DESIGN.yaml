      - name: reinstate_account_restores_listing_claimed_rollup_exactly
        grounds:
          - "calculations.listing_claimed_mrr_conservation_invariant"
          - "state_machines.ServiceAccount.EXCLUDED_to_UNVERIFIED"
          - "state_machines.ServiceAccount.UNVERIFIED_to_EXCLUDED"
          - "entities.RouteListing.fields.claimed_recurring_mrr_cents"
          - "entities.ServiceAccount.fields.exclusion_reason_code"
          - "endpoints[POST /service-accounts/{id}/reinstate]"
        distinguishing_aspect: "Conserved quantity: the listing's CLAIMED roll-up, not cash. reinstate is the compensating action for exclude and must restore claimed_recurring_mrr_cents, claimed_repair_mrr_cents and claimed_account_count to the exact pre-exclusion values while clearing exclusion_reason_code, so the round trip is observably a no-op on the parent even though ServiceAccount.version has moved twice."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; AZ profile; Seller SUN ACTIVE."
            - "One DRAFT canonical PHX-NE listing with three UNVERIFIED accounts: A1 claimed 16000 / repair 1500, A2 claimed 15000 / repair 2000, A3 claimed 12000 / repair 500."
            - "The listing roll-ups are therefore claimed_recurring_mrr_cents 43000, claimed_repair_mrr_cents 4000, claimed_account_count 3, verification_posture EMPTY."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
            - call: "POST /state-license-profiles"
