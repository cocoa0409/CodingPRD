              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-X-2001", zone: 2, residential_declared: false, declared_length_in: 95, declared_width_in: 6, declared_height_in: 6, declared_weight_lbs: 5.0 }
              as: CarrierOps
              captures: { under: $.data.id, u_bw: $.data.billable_weight_lbs, u_basis: $.data.preliminary_basis, u_over: $.data.oversize_flag, u_ah: $.data.additional_handling_flag, u_acc: $.data.accessorial_total_cents }
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-X-2002", zone: 2, residential_declared: false, declared_length_in: 100, declared_width_in: 6, declared_height_in: 6, declared_weight_lbs: 5.0 }
              as: CarrierOps
              captures: { over: $.data.id, o_bw: $.data.billable_weight_lbs, o_basis: $.data.preliminary_basis, o_over: $.data.oversize_flag, o_ah: $.data.additional_handling_flag, o_acc: $.data.accessorial_total_cents }
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-X-2003", zone: 2, residential_declared: false, declared_length_in: 40, declared_width_in: 24, declared_height_in: 24, declared_weight_lbs: 5.0 }
              as: CarrierOps
              captures: { girth: $.data.id, g_bw: $.data.billable_weight_lbs, g_basis: $.data.preliminary_basis, g_over: $.data.oversize_flag, g_acc: $.data.accessorial_total_cents }
            - call: "GET /shipments/${under}/billing-preview"
              payload: {}
              as: BillingOps
              captures: { u_rate: $.data.rate_cents_per_lb, u_base: $.data.transportation_base_cents, u_total: $.data.line_total_cents }
            - call: "GET /shipments/${over}/billing-preview"
              payload: {}
              as: BillingOps
              captures: { o_rate: $.data.rate_cents_per_lb, o_base: $.data.transportation_base_cents, o_total: $.data.line_total_cents }
            - call: "GET /shipments/${girth}/billing-preview"
              payload: {}
              as: BillingOps
              captures: { g_rate: $.data.rate_cents_per_lb, g_base: $.data.transportation_base_cents, g_total: $.data.line_total_cents }
            - call: "GET /shipments/${over}/accessorials"
              payload: {}
              as: BillingOps
              captures: { o_code: "$.data[0].code", o_amt: "$.data[0].amount_cents" }
            - call: "GET /shipments/${under}/accessorials"
              payload: {}
              as: BillingOps
              captures: { u_code: "$.data[0].code", u_amt: "$.data[0].amount_cents" }
          assert:
            - "UNDER: longest 95 is not > 96 and length_plus_girth 119 is not > 130, so ${u_over} == false and ${u_ah} == true (longest > AH_LONGEST_IN 48); ${u_acc} == 2450 with ${u_code} == ADDITIONAL_HANDLING and ${u_amt} == 2450"
            - "UNDER prices on the dimensional variant: cube 3420, dim 25, actual 5, so ${u_bw} == 25 and ${u_basis} == DIMENSIONAL at ${u_rate} == 340, ${u_base} == 8500 and ${u_total} == 10950"
            - "OVER: longest 100 > 96, so ${o_over} == true and ${o_ah} == false — OVERSIZE absorbs ADDITIONAL_HANDLING; total_count of its accessorials is 1 with ${o_code} == OVERSIZE and ${o_amt} == 12500, so ${o_acc} == 12500"
            - "OVER also picks up the 90 lb floor: cube 3600 gives dim 26 and actual is 5, so ${o_bw} == 90 and ${o_basis} == OVERSIZE_FLOOR — the only basis value the other two parcels never take"
            - "The floor pushes OVER into the 71-9999 rate row: ${o_rate} == 305, ${o_base} == 27450 and ${o_total} == 39950, against UNDER's 10950 — 29000 cents of difference from five inches"
            - "GIRTH crosses the same flag the other way: longest 40 is under 96 but length_plus_girth 40 + 2*(24+24) == 136 > 130, so ${g_over} == true and ${g_acc} == 12500"
            - "GIRTH's dim weight already beats the floor: cube 23040 gives dim 166, so ${g_bw} == 166 and ${g_basis} == DIMENSIONAL (not OVERSIZE_FLOOR), with ${g_rate} == 305, ${g_base} == 50630 and ${g_total} == 63130"
            - "The 1195 minimum charge never binds for any of the three"

      - name: a_rescan_cascades_from_the_scan_through_the_line_to_the_shipper_ledger
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: automated_rescan_cascades_through_a_frozen_issued_invoice_to_the_shipper_ledger
          rationale: |
            The §1.8 cascade_depth instance already walks the deepest chain in the domain —
            scan to reweighed shipment to reversed and re-created accessorials to a system
            PROPOSED WEIGHT_CORRECTION to the applied line and invoice recompute to the
            ShipperAccount ledger — and asserts every hop. A second walk of the same chain here
            would be pure duplication.

      - name: the_preliminary_and_final_billable_weight_variants_can_disagree
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: billable_weight_preliminary_vs_final_basis_flip
          rationale: |
            The §1.8 dual_variant_divergence instance already builds the one parcel whose
            PRELIMINARY variant lands on DIMENSIONAL and whose FINAL variant lands on ACTUAL
            after a scan, asserting both variants coexist on the same Shipment row and that
            billable_weight_lbs follows the FINAL one. The mode-dependent divisor and
            per-dimension rounding variants are covered by the same rule's second instance.
      - name: the_tier_discount_and_the_surcharge_windows_react_to_the_same_subtotal
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: invoice_tier_reads_pre_discount_transportation_subtotal_mode_c
          rationale: |
            The §1.8 mode_dependent_calculation instance already pins which subtotal the tier
            row reads — transportation base plus surcharges, before any discount or adjustment
            — and this section's own rate_threshold_triggers instance covers the orthogonal
            geometry threshold instead of re-testing the money threshold.

  # =====================================================================
  # SECTION 9 — CONSISTENCY MODEL (§1.0)
  # =====================================================================
  - section: consistency_model
    instances:
      - name: every_write_is_visible_to_the_next_read_with_no_settling_period
        claim_type: immediate
        grounds:
          - calculations.shipper_ledger_aggregates
          - calculations.invoice_totals
          - state_machines.Invoice.ISSUED_to_SETTLED
        distinguishing_aspect: |
          Each write's full derived closure — counters, aggregates, statuses and stamped
          deadlines — is readable on the very next request, with no polling, no retry loop and
          no second call to force recomputation. The ledger even distinguishes the states as it
          goes: an OPEN invoice contributes nothing to open_charges_cents, issuing it
          contributes 2660 immediately, and settling it removes that 2660 immediately.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with ACTIVE contract C1 (divisor 139, min charge 1195, zone-2 rows 380/340/305) and ServiceLevel EXPRESS. The logical clock is 2026-08-01T00:00:00Z and DISPUTE_WINDOW_DAYS is 90."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
          trigger:
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-Y-1001", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { p: $.data.id }
            - call: "GET /shipper-accounts/${sh}"
              payload: {}
              as: BillingOps
              captures: { t1: $.data.total_shipment_count, u1: $.data.unbilled_shipment_count, o1: $.data.open_charges_cents }
            - call: "POST /shipments/${p}/deliver"
              payload: {}
              as: CarrierOps
            - call: "GET /shipments/${p}"
              payload: {}
              as: BillingOps
              captures: { mv: $.data.movement_status, dat: $.data.delivered_at }
            - call: "POST /invoices"
              payload: { shipper_id: "${sh}", period_start: "2026-08-01", period_end: "2026-08-01" }
              as: BillingOps
              captures: { inv: $.data.id, net: $.data.net_amount_cents }
            - call: "GET /shipper-accounts/${sh}"
              payload: {}
              as: BillingOps
              captures: { u2: $.data.unbilled_shipment_count, b2: $.data.billed_shipment_count, o2: $.data.open_charges_cents }
            - call: "GET /shipments/${p}"
              payload: {}
              as: BillingOps
              captures: { bs: $.data.billing_status }
            - call: "POST /invoices/${inv}/issue"
              payload: {}
              as: BillingOps
              captures: { st: $.data.status, deadline: $.data.dispute_deadline_utc, issued: $.data.issued_at }
            - call: "GET /shipper-accounts/${sh}"
              payload: {}
              as: BillingOps
              captures: { o3: $.data.open_charges_cents }
            - call: "POST /invoices/${inv}/settle"
              payload: { payment_reference: "ACH-77120" }
              as: BillingOps
              captures: { st2: $.data.status, pref: $.data.payment_reference }
            - call: "GET /shipper-accounts/${sh}"
              payload: {}
              as: BillingOps
              captures: { o4: $.data.open_charges_cents, c4: $.data.credit_balance_cents }
          assert:
            - "${t1} == 1, ${u1} == 1 and ${o1} == 0 on the first read after the induction — the counters are already correct, with no second call needed to trigger recomputation"
            - "${mv} == DELIVERED and ${dat} == 2026-08-01T00:00:00.000Z on the read immediately after the delivery"
            - "${net} == 2660 in the sweep's own response body, not only in a later read"
            - "${u2} == 0, ${b2} == 1 and ${bs} == BILLED immediately after the sweep, while ${o2} == 0 because an OPEN invoice is not yet a receivable"
            - "${st} == ISSUED with ${issued} == 2026-08-01T00:00:00.000Z and ${deadline} == 2026-10-30T00:00:00.000Z (issued_at plus 90 days), both computed inside the issue call"
            - "${o3} == 2660 on the very next read — the ledger aggregate moved in the same request that issued the invoice"
            - "${st2} == SETTLED with ${pref} == ACH-77120, and ${o4} == 0 with ${c4} == 0 immediately afterwards"
            - "No assertion in this recipe requires a sleep, a poll or a repeated read: the second identical GET would return exactly the same body as the first"
