            - "The labor call is now RECONCILED, swept by the finalize cascade."

      - name: risk_score_at_the_exact_high_band_boundary_then_override_approves_escalation
        claim_type: weighted_scoring
        grounds:
          - "§1.3 financial_risk_score RENTAL variant: 0.50 * credit_factor (B -> 0.50) + 0.30 * min(1, arrears_ratio) + 0.20 * (1 - min(1, lead_days/120)); bands HIGH >= 55, PROHIBITIVE >= 75."
          - "§1.2 Engagement.financial_clearance UNASSESSED -> ESCALATED (override absent or false) and ESCALATED -> ESCALATED_APPROVED (override true, risk_tier != PROHIBITIVE)."
          - "§1.3 deposit_requirement: credit B -> 0.50 of the core, so the arrears ratio has a non-trivial denominator."
        distinguishing_aspect: >-
          Every weighted term is chosen so the sum lands on exactly 55.0 - the
          HIGH band's inclusive lower edge - with the lead term driven to exactly
          0 by a 122-day lead (past the 120-day target, so the min() clamp is
          also exercised) and the arrears term driven to exactly 1 by an
          outstanding balance equal to the required deposit. The same assessment
          then re-runs with override_escalation true to walk the approval edge.
        test_recipe:
          setup:
            - "Grand Hall exists (1200 seats, 500000 per performance day)."
            - "Rental client 'Coastline Touring Co' exists: credit_rating B, is_nonprofit false, outstanding_balance_cents 250000 supplied explicitly."
            - "A RENTAL engagement exists with performance_start_utc 2026-12-01T00:00:00Z (exactly 122 days after the 2026-08-01 clock), 1 performance day and 0 load-in days, so facility_fee_cents is 500000 and deposit_required_cents is ceil_100(round_half_up(0.50 * 500000)) = 250000 - identical to the outstanding balance, making arrears_ratio exactly 1.0."
            - "No labor calls and no equipment lines exist, so the deposit is not recomputed away from 250000."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /rental-clients"
              as: RentalManager
              payload: { org_name: "Coastline Touring Co", contact_email: "ap@coastline.example", credit_rating: "B", is_nonprofit: false, outstanding_balance_cents: 250000 }
              captures: { client_id: "$.data.id" }
            - call: "POST /engagements"
              as: RentalManager
              payload: { engagement_type: "RENTAL", space_id: "${space_id}", rental_client_id: "${client_id}", title: "Coastline December Booking", load_in_start_utc: "2026-11-30T08:00:00Z", performance_start_utc: "2026-12-01T00:00:00Z", performance_end_utc: "2026-12-01T03:00:00Z", load_out_end_utc: "2026-12-01T08:00:00Z", performance_day_count: 1, load_in_day_count: 0 }
              captures: { engagement_id: "$.data.id", eng_v0: "$.data.version" }
          trigger:
            - call: "POST /engagements/${engagement_id}/assess-risk"
              as: FinanceController
              payload: { expected_engagement_version: "${eng_v0}" }
              captures: { eng_v1: "$.data.version" }
            - call: "POST /engagements/${engagement_id}/assess-risk"
              as: FinanceController
              payload: { expected_engagement_version: "${eng_v1}", override_escalation: true }
          assert:
            - "First assessment: risk_score == 55 exactly (0.50*0.50 credit + 0.30*1.00 arrears + 0.20*(1 - min(1, 122/120)) = 0.25 + 0.30 + 0 = 0.55)."
            - "risk_tier == 'HIGH' because the band comparison is `>= 55`, and financial_clearance == 'ESCALATED' because override_escalation was absent."
            - "The lead term is exactly 0: 122 days exceeds LEAD_TARGET_DAYS 120, so min(1, ratio) clamps rather than going negative."
            - "Second assessment with override_escalation true: 200 with financial_clearance == 'ESCALATED_APPROVED', risk_score still 55 and risk_tier still 'HIGH' - approval does not rewrite the score."
            - "engagement.version == ${eng_v1} + 1, and lifecycle_status is still 'DRAFT' (clearance is an independent dimension)."
            - "Routing slack and historical sell-through never appear: the RENTAL variant has no artist, so a PRESENTED-shaped scorer cannot reproduce 55."

      - name: settlement_waterfall_evaluation_order_is_pinned
        claim_type: waterfall_allocation
        excluded_because:
          difficulty_instance: settlement_presented_split_pinned_evaluation_order
          rationale: >-
            §1.8's combinatorial_formula instance already walks the seven
            numbered PRESENTED_SPLIT steps in order (cap band from adjusted
            gross, reimbursable from the cap, artist share from the overage, net
            from all four subtractions, reserve from net plus restoration) and
            asserts the forbidden signatures produced by reordering them.

      - name: subscription_remainder_goes_to_the_first_tier_in_the_pinned_order
        claim_type: waterfall_allocation
        excluded_because:
          difficulty_instance: price_tier_seat_conservation_across_sales_subscription_holds_and_refunds
          rationale: >-
            The floor-per-tier allocation and the single remainder assignment to
            the first tier by engagement.created_at ASC (then
            performance_start_utc ASC, never by id) are asserted there, together
            with the per-order booking of subscription_held_qty and
            subscription_revenue_cents.

      - name: labor_estimate_and_actual_variants_diverge_by_the_meal_penalty
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: labor_call_estimate_vs_actual_meal_penalty_divergence
          rationale: >-
            That §1.8 dual_variant_calc instance holds the duration constant and
            shows ACTUAL exceeding ESTIMATE by exactly meal_penalty_cents *
            crew_size, which is the guide's Variant Divergence claim verbatim.

      - name: projected_figures_are_reconciled_into_realized_at_settlement
        claim_type: variant_reconciliation
        excluded_because:
          difficulty_instance: engagement_margin_projected_vs_realized_input_set_divergence
          rationale: >-
            The projected -> realized switch (different input sets, different
            cost bases, the delta landing on realized_margin_cents at
