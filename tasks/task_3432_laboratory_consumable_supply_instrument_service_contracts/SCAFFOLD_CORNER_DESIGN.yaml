      - name: resolve_by_unassigned_engineer_forbidden
        claim_type: ownership_denied
        grounds: ["roles.FieldEngineer", "validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "FieldEngineer identity binds resolution to the assignee: the request was dispatched to the first-created engineer, so the second engineer's resolve is 403 ERR_FORBIDDEN even though FieldEngineer is a listed role."
        test_recipe:
          setup: ["Two BREAK_FIX engineers in CA-NORTH created one second apart (Zed first, Ann second); dispatch ties at 0 open tickets and the created_at ASC tie-break assigns Zed."]
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Ownership Lab", segment: "PHARMA", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { a_id: $.data.id }
            - call: "POST /lab/engineers"
              payload: { name: "Zed First", territory_code: "CA-NORTH", skills: ["INSTALL", "BREAK_FIX"] }
              as: ServiceDispatcher
              captures: { e1: $.data.id }
            - call: "POST /lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:01Z" }
