          - validations[priority=52]
          - errors[ERR_RESTATEMENT_NOT_REQUIRED]
          - entities.CirculationStatement.fields.restates_statement_id
        distinguishing_aspect: "The self-referential FK is state-guarded: the target exists and belongs to the same publication, but it is FILED rather than RESTATEMENT_REQUIRED, so restatement is refused at priority 52 before any period-overlap test at 61 can run."
        test_recipe:
          setup:
            - "one publication with a FILED statement for [2026-05-01, 2026-08-01) that was never audited"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Restatement Guard Monthly", frequency: "MONTHLY", industry_code: "LOGISTICS" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id, pub_ver_1: $.data.version }
            - call: "POST /circulation/statements"
              payload: { publication_id: "${pub_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", basis: "AS_OF_PERIOD_END", expected_publication_version: "${pub_ver_1}" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { st_a_id: $.data.id }
            - call: "POST /circulation/statements/${st_a_id}/certify"
              payload: { certification_note: "filed and quiet" }
              as: PublisherExecutive
              as_user_id: "exec-01"
              captures: { st_a_status: $.data.status }
            - call: "GET /circulation/publications/${pub_id}"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_ver_2: $.data.version }
          trigger:
            - call: "POST /circulation/statements"
              payload: { publication_id: "${pub_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", basis: "AUDIT_VERIFIED", restates_statement_id: "${st_a_id}", expected_publication_version: "${pub_ver_2}" }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { err: $.data.error_id }
          assert:
            - "${st_a_status} == FILED"
            - "HTTP 409 with ${err} == ERR_RESTATEMENT_NOT_REQUIRED"
            - "no second CirculationStatement row was created and CirculationStatement.${st_a_id}.status is still FILED"
            - "a restates_statement_id naming a statement of a DIFFERENT publication is refused with the same error_id"

      - name: purge_before_retention_elapsed_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=64]
          - errors[ERR_RETENTION_NOT_ELAPSED]
          - entities.SourceDocument.fields.retention_expires_at
        distinguishing_aspect: "Audit evidence cannot be destroyed early: with the default 36-month retention the document is locked until 2029-07-15, and the guard compares the logical clock against the stored retention_expires_at rather than against captured_at."
        test_recipe:
          setup:
            - "publication with the default source_doc_retention_months 36 and one recipient with a document captured 2026-07-15"
            - "clock at the default 2026-08-01T00:00:00Z"
