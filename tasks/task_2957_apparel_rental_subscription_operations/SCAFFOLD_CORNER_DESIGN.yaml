      - name: calc_resale_first_listing_uses_the_high_tier_fee
        claim_type: constants_applied
        grounds:
          - "calculations.resale_pricing"
          - "entities.ResaleListing.fields.base_price_cents"
          - "entities.ResaleListing.fields.list_price_cents"
          - "entities.ResaleListing.fields.channel_fee_cents"
          - "entities.ResaleListing.fields.net_recovery_cents"
          - "endpoints.POST /resale-listings"
        distinguishing_aspect: >-
          A grade-A unit of a 48000-cent style lists at round_half_up(48000 * 0.45) == 21600, which is at or above
          TIER_HIGH_FLOOR_CENTS 20000, so the OUTLET fee percentage must be the HIGH-tier 0.12 and not the MID-
          tier 0.08: channel_fee_cents 2592 and net_recovery_cents 21600 - 2592 - 400 == 18608. Because the
          provisional net clears MIN_NET_RECOVERY_CENTS, floor_adjusted must be false and list_price_cents must
          equal base_price_cents exactly.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "style AUR-GOWN-01 with retail_price_cents 48000"
            - "one grade-A size-M unit AUR-GOWN-001 with no reservations and no damage claims"
            - "the unit has been retired with retirement_reason PLANNED_REFRESH, so availability_state is RETIRED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /styles"
              payload: { style_code: "AUR-GOWN-01", brand: "Aurelia", category: "GOWN", retail_price_cents: 48000, acquisition_cost_cents: 21000, size_run: ["S", "M", "L"], expected_rental_turns_per_unit: 12, planned_eol_value_cents: 9000, forecast_monthly_requests: 8, avg_rental_days: 6, planned_depth_units: 3 }
              as: InventoryPlanner
              captures: { style_gown_id: "$.data.id" }
            - call: "POST /styles/${style_gown_id}/rental-units"
              payload: { unit_code: "AUR-GOWN-001", size: "M", acquisition_cost_cents: 21000, condition_grade: "A" }
              as: InventoryPlanner
              captures: { unit1_id: "$.data.id" }
            - call: "POST /rental-units/${unit1_id}/retirement"
              payload: { retirement_reason: "PLANNED_REFRESH" }
              as: InventoryPlanner
            - call: "GET /rental-units/${unit1_id}"
              payload: {}
              as: InventoryPlanner
              captures: { unit1_v: "$.data.version" }
          trigger:
            - call: "POST /resale-listings"
              payload: { rental_unit_id: "${unit1_id}", expected_rental_unit_version: "${unit1_v}", channel: "OUTLET" }
              as: InventoryPlanner
          assert:
            - "HTTP 201"
            - "ResaleListing.state == LISTED"
            - "ResaleListing.listed_at == 2026-08-03T09:00:00Z"
            - "ResaleListing.markdown_step == 0"
            - "ResaleListing.base_price_cents == 21600"
            - "ResaleListing.list_price_cents == 21600"
            - "ResaleListing.channel_fee_cents == 2592"
            - "ResaleListing.net_recovery_cents == 18608"
            - "ResaleListing.floor_adjusted == false"
            - "GET /rental-units/${unit1_id} reports availability_state == RETIRED"
      - name: calc_resale_reprice_floor_correction_pins_net_recovery_at_the_minimum
        claim_type: precision
        grounds:
          - "calculations.resale_pricing"
          - "entities.ResaleListing.fields.floor_adjusted"
          - "entities.ResaleListing.fields.markdown_step"
          - "endpoints.POST /resale-listings/{listing_id}/reprice"
          - "state_machines.ResaleListing.transitions.EXPIRED_to_LISTED"
        distinguishing_aspect: >-
          The markdown ladder is what forces the floor correction: at markdown_step 1 the grade-D unit prices at
          round_half_up(48000 * 0.08 * 0.85) == 3264 whose provisional net 3264 - 490 - 900 == 1874 is below
          MIN_NET_RECOVERY_CENTS, so the corrective pass restates list_price_cents as round_half_up((2000 + 900) /
          (1 - 0.15)) == 3412 and reuses the LOW-tier fee percentage frozen at Step 2 — channel_fee_cents 512 and
          net_recovery_cents exactly 2000. An implementation that re-derives the tier from the corrected price, or
          that omits Step 7's restatement, lands on 3412 with a stale fee of 490 and a net of 2022.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "style AUR-GOWN-01 with retail_price_cents 48000"
            - "one grade-D size-M unit AUR-GOWN-001 with no reservations, retired with retirement_reason PLANNED_REFRESH"
            - "a PARTNER_RESALE listing created on 2026-08-03 at markdown_step 0: base 3840, LOW tier, fee 576, net 2364, floor_adjusted false"
            - "the logical clock is moved to 2026-09-05T09:00:00Z, which is at least LISTING_WINDOW_DAYS 30 after listed_at, and the listing is expired"
