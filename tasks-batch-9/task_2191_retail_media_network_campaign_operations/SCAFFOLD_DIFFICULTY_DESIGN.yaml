  - rule_id: priority_pair_validation_conflict
    instances:
      - name: ppvc_frozen_pool_state_beats_fiscal_insufficiency
        grounds:
          - validations[priority=39]
          - validations[priority=74]
          - validations[priority=23]
          - state_machines.TradeFundAccount.OPEN_to_FROZEN
          - calculations.trade_fund_available
          - concurrency_rules[trade-fund-deduction-stale-account]
          - entities.TradeFundAccount.fields.account_status
          - entities.TradeFundAccount.fields.available_cents
        distinguishing_aspect: |
          This conflict pairs category `state` (priority 39, ERR_TRADE_FUND_FROZEN) against category
          `business_fiscal` (priority 74, ERR_TRADE_FUND_INSUFFICIENT) on
          POST /rmn/trade-fund-accounts/{id}/deductions, and the single request trips both at once
          because the pool is FROZEN and the requested 500000 cents exceeds its available 100000
          cents, so the response MUST carry ERR_TRADE_FUND_FROZEN with HTTP 409.
        test_recipe:
          setup:
            - "Logical clock at the 2026-08-01T00:00:00Z startup default (no time gate involved)."
            - "Advertiser FUNDCO (SELF_SERVE) at onboarding_status=ACTIVE."
            - "TradeFundAccount for (FUNDCO, 2026-Q3) with deduction_cap_pct=0.6, one accrual of 100000 cents booked so accrued_cents=100000, reserved_cents=0, deducted_cents=0, available_cents=100000."
            - "That account then frozen: account_status=FROZEN with frozen_reason=AUDIT."
            - "No BudgetPlan reserves against the pool, so reserved_cents stays 0."
          setup_api_calls:
            - call: "POST /rmn/advertisers"
              payload: { legal_name: "Fund Co Retail", brand_code: "FUNDCO", service_model: "SELF_SERVE", credit_limit_cents: 100000000 }
              as: NetworkAdmin
              as_user_id: "u_admin_1"
              captures: { adv_id: $.data.id }
            - call: "POST /rmn/advertisers/${adv_id}/submit-onboarding"
              payload: { kyc_document_count: 2 }
              as: AccountManager
              as_user_id: "u_am_1"
            - call: "POST /rmn/advertisers/${adv_id}/kyc-decision"
              payload: { decision: "APPROVE" }
              as: CreditAnalyst
              as_user_id: "u_ca_1"
            - call: "POST /rmn/trade-fund-accounts"
              payload: { advertiser_id: "${adv_id}", fiscal_period_code: "2026-Q3", accrual_basis: "PURCHASE_VOLUME", deduction_cap_pct: 0.6 }
              as: BillingOps
              as_user_id: "u_billing_1"
              captures: { tfa_id: $.data.id }
            - call: "POST /rmn/trade-fund-accounts/${tfa_id}/accruals"
              payload: { accrual_amount_cents: 100000, accrual_reference: "ACC-2026Q3-001" }
              as: BillingOps
              as_user_id: "u_billing_1"
            - call: "POST /rmn/trade-fund-accounts/${tfa_id}/freeze"
              payload: { frozen_reason: "AUDIT" }
              as: BillingOps
              as_user_id: "u_billing_1"
              captures: { tfa_v: $.data.version }
          trigger:
            - call: "POST /rmn/trade-fund-accounts/${tfa_id}/deductions"
              payload: { deduction_amount_cents: 500000, deduction_reference: "MAN-DED-001", expected_trade_fund_account_version: "${tfa_v}" }
              as: BillingOps
              as_user_id: "u_billing_1"
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_TRADE_FUND_FROZEN"
            - "response.data.error_id != ERR_TRADE_FUND_INSUFFICIENT"
            - "TradeFundAccount.${tfa_id}.account_status == FROZEN"
            - "TradeFundAccount.${tfa_id}.accrued_cents == 100000"
            - "TradeFundAccount.${tfa_id}.deducted_cents == 0"
            - "TradeFundAccount.${tfa_id}.available_cents == 100000"
            - "TradeFundAccount.${tfa_id}.version == ${tfa_v}"

      - name: ppvc_flight_window_temporal_beats_channel_mix_constraint
        grounds:
          - validations[priority=46]
          - validations[priority=64]
          - validations[priority=21]
          - entities.LineItem.fields.flight_start_at
          - entities.Campaign.fields.channel_mix
          - entities.PlacementSlot.fields.channel
          - concurrency_rules[line-item-create-stale-campaign]
        distinguishing_aspect: |
          This conflict pairs category `business_temporal` (priority 46,
          ERR_FLIGHT_WINDOW_OUTSIDE_CAMPAIGN) against category `business_constraint` (priority 64,
          ERR_OFFSITE_CHANNEL_MISMATCH) on POST /rmn/line-items — a different error-category pair
          from the state-versus-fiscal conflict above — and the single request trips both because
          the requested flight lies entirely after the campaign flight AND the slot is OFFSITE on an
          ONSITE_ONLY campaign, so the response MUST carry ERR_FLIGHT_WINDOW_OUTSIDE_CAMPAIGN with
          HTTP 422.
        test_recipe:
          setup:
            - "Logical clock at the 2026-08-01T00:00:00Z startup default."
            - "Advertiser MIXCO (SELF_SERVE) at onboarding_status=ACTIVE."
            - "BudgetPlan 2026-Q3 in DRAFT with committed_total_cents=1000000, window [2026-08-01T00:00:00Z, 2026-11-01T00:00:00Z)."
            - "Campaign MIX-ONSITE with channel_mix=ONSITE_ONLY, delivery_status=DRAFT, flight [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z), allocated_budget_cents=500000, daily_cap_cents=400000."
            - "One OFFSITE PlacementSlot OFFSITE-SOC-01 with slot_status=OPEN and buffer_minutes=0."
            - "No LineItem rows exist yet on the campaign or the slot."
          setup_api_calls:
            - call: "POST /rmn/advertisers"
              payload: { legal_name: "Mix Co Retail", brand_code: "MIXCO", service_model: "SELF_SERVE", credit_limit_cents: 100000000 }
              as: NetworkAdmin
              as_user_id: "u_admin_1"
              captures: { adv_id: $.data.id }
            - call: "POST /rmn/advertisers/${adv_id}/submit-onboarding"
              payload: { kyc_document_count: 2 }
              as: AccountManager
              as_user_id: "u_am_1"
            - call: "POST /rmn/advertisers/${adv_id}/kyc-decision"
              payload: { decision: "APPROVE" }
              as: CreditAnalyst
              as_user_id: "u_ca_1"
              captures: { adv_v: $.data.version }
            - call: "POST /rmn/budget-plans"
              payload: { advertiser_id: "${adv_id}", fiscal_period_code: "2026-Q3", committed_total_cents: 1000000, trade_fund_share_cents: 0, window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-11-01T00:00:00Z", expected_advertiser_version: "${adv_v}" }
              as: NetworkAdmin
              as_user_id: "u_admin_1"
              captures: { plan_id: $.data.id }
            - call: "POST /rmn/placement-slots"
              payload: { slot_code: "OFFSITE-SOC-01", channel: "OFFSITE", page_type: "OFFSITE_SOCIAL", position_index: 1, max_concurrent_line_items: 2, floor_cpc_cents: 1000, relevance_weight: 1.0, buffer_minutes: 0 }
              as: NetworkAdmin
              as_user_id: "u_admin_1"
              captures: { slot_id: $.data.id }
            - call: "POST /rmn/campaigns"
              payload: { advertiser_id: "${adv_id}", budget_plan_id: "${plan_id}", name: "MIX-ONSITE", channel_mix: "ONSITE_ONLY", flight_start_at: "2026-08-01T00:00:00Z", flight_end_at: "2026-09-01T00:00:00Z", allocated_budget_cents: 500000, pacing_mode: "EVEN", daily_cap_cents: 400000, attribution_model: "LAST_TOUCH", attribution_window_days: 14 }
              as: AccountManager
              as_user_id: "u_am_1"
              captures: { camp_id: $.data.id, camp_v: $.data.version }
          trigger:
            - call: "POST /rmn/line-items"
              payload: { campaign_id: "${camp_id}", placement_slot_id: "${slot_id}", bid_cents: 5000, bid_type: "CPM", flight_start_at: "2026-09-05T00:00:00Z", flight_end_at: "2026-09-10T00:00:00Z", daily_budget_cents: 100000, category_code: "COFFEE", keyword_match_terms: ["coffee"], expected_campaign_version: "${camp_v}" }
              as: AccountManager
              as_user_id: "u_am_1"
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_FLIGHT_WINDOW_OUTSIDE_CAMPAIGN"
            - "response.data.error_id != ERR_OFFSITE_CHANNEL_MISMATCH"
            - "count(LineItem rows with campaign_id == ${camp_id}) == 0"
            - "Campaign.${camp_id}.version == ${camp_v}"

  - rule_id: boundary_precision_check
    instances:
      - name: bpc_significance_score_exactly_at_minimum_versus_one_ulp_below
        grounds:
          - calculations.incremental_sales_lift
          - calculations.study_window_washout
          - validations[priority=44]
          - state_machines.IncrementalityStudy.RUNNING_to_MEASURING
          - state_machines.IncrementalityStudy.MEASURING_to_PUBLISHED
          - entities.IncrementalityStudy.fields.significance_score
          - entities.IncrementalityStudy.fields.significance_flag
          - entities.Campaign.fields.incremental_revenue_cents
          - concurrency_rules[study-create-stale-campaign]
        distinguishing_aspect: |
          The boundary metric here is significance_score against SIGNIFICANCE_MIN = 1.96 under the
          inclusive `>=` comparison, reached through POST /rmn/incrementality-studies/{id}/measure
          followed by POST /rmn/incrementality-studies/{id}/publish: a score of exactly 1.9600 sets
          significance_flag = true and publishes, while 1.9500 sets it false and the publish is
          refused with ERR_STUDY_NOT_SIGNIFICANT.
