scaffold_corner_design:

  # ============================================================
  # Section: entities
  # ============================================================
  - section: entities
    instances:
      - name: production_create_returns_201_with_server_minted_id
        claim_type: creation_success
        grounds: [entities.Production, "endpoints.POST_/productions"]
        distinguishing_aspect: "POST /productions with all required fields returns 201 with server-minted UUID, initial status DRAFT, posture UNBOUND, version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformOperator
          trigger:
            - call: "POST /productions"
              payload:
                production_code: "PRD-E1"
                title: "Entity Create Show"
                production_type: "FEATURE"
                principal_photography_start: "2026-06-01T00:00:00Z"
                principal_photography_end: "2026-08-01T00:00:00Z"
                budget_cents: 100000000
              as: BrokerAgent
              captures: { prod_id: $.data.id, status: $.data.status, posture: $.data.coverage_posture, version: $.data.version }
          assert:
            - "Production.id is non-empty UUID"
            - "Production.status == DRAFT"
            - "Production.coverage_posture == UNBOUND"
            - "Production.version == 1"
            - "Production.requires_completion_bond == false (default applied)"

      - name: production_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Production, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /productions/{id} with non-existent UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformOperator
          trigger:
            - call: "GET /productions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: BrokerAgent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "http_status == 404"

      - name: production_list_pagination_envelope
        claim_type: listing
        grounds: [entities.Production, response_envelope]
        distinguishing_aspect: "GET /productions honors limit/offset, returns pagination fields total_count, has_more."
        test_recipe:
          setup: ["3 productions exist"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /productions"
              payload:
                production_code: "PRD-PE1"
                title: "P1"
                production_type: "FEATURE"
                principal_photography_start: "2026-06-01T00:00:00Z"
                principal_photography_end: "2026-08-01T00:00:00Z"
                budget_cents: 100000000
              as: BrokerAgent
            - call: "POST /productions"
              payload:
                production_code: "PRD-PE2"
                title: "P2"
                production_type: "EPISODIC"
                principal_photography_start: "2026-06-01T00:00:00Z"
                principal_photography_end: "2026-08-01T00:00:00Z"
                budget_cents: 200000000
              as: BrokerAgent
            - call: "POST /productions"
              payload:
                production_code: "PRD-PE3"
                title: "P3"
                production_type: "COMMERCIAL"
                principal_photography_start: "2026-06-01T00:00:00Z"
                principal_photography_end: "2026-08-01T00:00:00Z"
                budget_cents: 50000000
              as: BrokerAgent
          trigger:
            - call: "GET /productions?limit=2&offset=0"
              payload: {}
              as: BrokerAgent
          assert:
            - "response contains pagination fields: limit, offset, total_count, has_more"
            - "total_count == 3"
            - "returned array length == 2"
            - "has_more == true"

      - name: production_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Production, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /productions missing production_code returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformOperator
          trigger:
            - call: "POST /productions"
              payload:
                title: "No Code"
                production_type: "FEATURE"
                principal_photography_start: "2026-06-01T00:00:00Z"
                principal_photography_end: "2026-08-01T00:00:00Z"
                budget_cents: 100000000
              as: BrokerAgent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: production_invalid_enum_production_type_returns_invalid_enum
        claim_type: type_constraints
        grounds: [entities.Production.fields.production_type, "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "POST /productions with production_type=BAD returns ERR_INVALID_ENUM."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformOperator
          trigger:
            - call: "POST /productions"
              payload:
                production_code: "PRD-EE"
                title: "Bad Enum"
                production_type: "BAD_TYPE"
                principal_photography_start: "2026-06-01T00:00:00Z"
                principal_photography_end: "2026-08-01T00:00:00Z"
                budget_cents: 100000000
              as: BrokerAgent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_ENUM"

      - name: production_invalid_temporal_range_returns_temporal_error
        claim_type: type_constraints
        grounds: [entities.Production.fields.principal_photography_end, "errors[ERR_TEMPORAL_RANGE_INVALID]"]
        distinguishing_aspect: "principal_photography_end <= principal_photography_start returns ERR_TEMPORAL_RANGE_INVALID."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformOperator
          trigger:
            - call: "POST /productions"
              payload:
                production_code: "PRD-TI"
                title: "Bad Time"
                production_type: "FEATURE"
                principal_photography_start: "2026-08-01T00:00:00Z"
                principal_photography_end: "2026-06-01T00:00:00Z"
                budget_cents: 100000000
              as: BrokerAgent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TEMPORAL_RANGE_INVALID"

  # ============================================================
  # Section: state_machines
  # ============================================================
  - section: state_machines
    instances:
      - name: production_terminal_wrap_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Production]
        distinguishing_aspect: "After WRAPPED, POST /productions/{id}/activate and /cancel return ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Production ACTIVE with BOUND GL policy; no open claims; no DRAFT certs"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /productions"
              payload:
                production_code: "PRD-TL"
                title: "Terminal Lock"
                production_type: "COMMERCIAL"
                principal_photography_start: "2026-06-01T00:00:00Z"
                principal_photography_end: "2026-06-15T00:00:00Z"
                budget_cents: 100000000
                requires_completion_bond: false
              as: BrokerAgent
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/policies"
              payload:
                coverage_line: "GENERAL_LIABILITY"
                carrier_code: "AIG"
                policy_number: "AIG-GL-TL"
                limit_cents: 100000000
                aggregate_limit_cents: 200000000
                deductible_cents: 100000
                effective_date: "2026-05-01T00:00:00Z"
                expiry_date: "2026-12-31T00:00:00Z"
                payroll_basis_cents: 10000000
              as: BrokerAgent
              captures: { pol_id: $.data.id }
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { prod_v: $.data.version }
            - call: "POST /productions/${prod_id}/policies/${pol_id}/bind"
              payload: { expected_production_version: "${prod_v}" }
              as: BrokerAgent
            - call: "POST /productions/${prod_id}/activate"
              payload: {}
              as: BrokerAgent
            - call: "POST /productions/${prod_id}/wrap"
              payload: {}
              as: ProductionManager
          trigger:
            - call: "POST /productions/${prod_id}/activate"
              payload: {}
              as: BrokerAgent
              captures: { err1: $.data.error_id }
            - call: "POST /productions/${prod_id}/cancel"
              payload: {}
              as: BrokerAgent
              captures: { err2: $.data.error_id }
          assert:
            - "activate on WRAPPED returns error_id == ERR_INVALID_STATE"
            - "cancel on WRAPPED returns error_id == ERR_INVALID_STATE"

      - name: certificate_issue_invalid_from_issued
        claim_type: invalid_transition
        grounds: [state_machines.Certificate, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Certificate already ISSUED — a second issue attempt returns ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Production ACTIVE with BOUND GL policy"
            - "Certificate c already ISSUED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /productions"
              payload:
                production_code: "PRD-IT"
                title: "Invalid Transition"
                production_type: "COMMERCIAL"
                principal_photography_start: "2026-06-01T00:00:00Z"
                principal_photography_end: "2026-06-30T00:00:00Z"
                budget_cents: 100000000
                requires_completion_bond: false
              as: BrokerAgent
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/policies"
              payload:
                coverage_line: "GENERAL_LIABILITY"
                carrier_code: "AIG"
                policy_number: "AIG-GL-IT"
                limit_cents: 100000000
                aggregate_limit_cents: 200000000
                deductible_cents: 100000
                effective_date: "2026-05-01T00:00:00Z"
                expiry_date: "2026-12-31T00:00:00Z"
                payroll_basis_cents: 10000000
              as: BrokerAgent
              captures: { pol_id: $.data.id }
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { prod_v: $.data.version }
            - call: "POST /productions/${prod_id}/policies/${pol_id}/bind"
              payload: { expected_production_version: "${prod_v}" }
              as: BrokerAgent
            - call: "POST /productions/${prod_id}/activate"
              payload: {}
              as: BrokerAgent
            - call: "POST /productions/${prod_id}/certificates"
              payload:
                certificate_type: "LOCATION"
                holder_name: "Lot"
                holder_address: "1 Lot"
                additional_insured_name: "Owner"
                coverage_lines: ["GENERAL_LIABILITY"]
                location_start: "2026-06-01T00:00:00Z"
                location_end: "2026-06-15T00:00:00Z"
              as: BrokerAgent
              captures: { cert_id: $.data.id }
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { prod_v2: $.data.version }
            - call: "POST /productions/${prod_id}/certificates/${cert_id}/issue"
              payload: { expected_production_version: "${prod_v2}" }
              as: BrokerAgent
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { prod_v3: $.data.version }
          trigger:
            - call: "POST /productions/${prod_id}/certificates/${cert_id}/issue"
              payload: { expected_production_version: "${prod_v3}" }
              as: BrokerAgent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: clearance_waiver_requires_justification
        claim_type: precondition_enforcement
        grounds: [state_machines.ClearanceItem.FLAGGED_to_WAIVED, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Resolving a FLAGGED clearance to WAIVED without waiver_justification returns ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Production DRAFT with a ClearanceItem FLAGGED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /productions"
              payload:
                production_code: "PRD-CW"
                title: "Clearance Waive"
                production_type: "FEATURE"
                principal_photography_start: "2026-06-01T00:00:00Z"
                principal_photography_end: "2026-08-01T00:00:00Z"
                budget_cents: 100000000
              as: BrokerAgent
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/clearance-items"
              payload:
                clearance_kind: "SCRIPT"
                item_reference: "Script v1"
                legal_reviewer: "Counsel A"
              as: ClearanceCounsel
              captures: { clr_id: $.data.id }
            - call: "POST /productions/${prod_id}/clearance-items/${clr_id}/resolve"
              payload: { outcome: "FLAGGED" }
              as: ClearanceCounsel
          trigger:
            - call: "POST /productions/${prod_id}/clearance-items/${clr_id}/resolve"
              payload: { outcome: "WAIVED" }
              as: ClearanceCounsel
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: claim_side_effects_on_settle
        claim_type: side_effect_execution
        grounds: [state_machines.Claim.UNDER_REVIEW_to_SETTLED, entities.ClaimEvent]
        distinguishing_aspect: "Settle zeroes reserve and appends ClaimEvent(SETTLE) to event log."
        test_recipe:
          setup:
            - "Claim in UNDER_REVIEW with reserve=400000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /productions"
              payload:
                production_code: "PRD-SE"
                title: "Side Effect"
                production_type: "COMMERCIAL"
                principal_photography_start: "2026-06-01T00:00:00Z"
                principal_photography_end: "2026-06-15T00:00:00Z"
                budget_cents: 100000000
              as: BrokerAgent
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/policies"
              payload:
                coverage_line: "GENERAL_LIABILITY"
                carrier_code: "AIG"
                policy_number: "AIG-GL-SE"
                limit_cents: 100000000
                aggregate_limit_cents: 200000000
                deductible_cents: 100000
                effective_date: "2026-05-01T00:00:00Z"
                expiry_date: "2026-12-31T00:00:00Z"
                payroll_basis_cents: 10000000
              as: BrokerAgent
              captures: { pol_id: $.data.id }
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { prod_v: $.data.version }
            - call: "POST /productions/${prod_id}/policies/${pol_id}/bind"
              payload: { expected_production_version: "${prod_v}" }
              as: BrokerAgent
            - call: "POST /productions/${prod_id}/activate"
              payload: {}
              as: BrokerAgent
            - call: "POST /productions/${prod_id}/claims"
              payload:
                policy_id: "${pol_id}"
                claim_type: "DAMAGE"
                occurrence_date: "2026-06-05T00:00:00Z"
                loss_amount_cents: 500000
              as: ProductionManager
              captures: { claim_id: $.data.id }
            - call: "POST /productions/${prod_id}/claims/${claim_id}/acknowledge"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /productions/${prod_id}/claims/${claim_id}/settle"
              payload: { settlement_amount_cents: 300000 }
              as: ClaimsAdjuster
              as_user_id: "adjuster-X"
            - call: "GET /productions/${prod_id}/claims/${claim_id}/events"
              payload: {}
              as: ClaimsAdjuster
              captures: { events: $.data }
          assert:
            - "Claim.${claim_id}.reserve_cents == 0"
            - "Claim.${claim_id}.status == SETTLED"
            - "events list contains entries with event_type SUBMIT and SETTLE"

  # ============================================================
  # Section: calculations
  # ============================================================
  - section: calculations
    instances:
      - name: claim_deductible_applied_cents_below_deductible
        claim_type: correct_result
        grounds: [calculations.claim_deductible_applied]
        distinguishing_aspect: "loss_amount < deductible: deductible_applied == loss_amount, carrier_payable == 0."
        test_recipe:
          setup:
            - "Production ACTIVE with BOUND GL policy, deductible 200000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /productions"
              payload:
                production_code: "PRD-CD"
                title: "Deductible Below"
                production_type: "COMMERCIAL"
                principal_photography_start: "2026-06-01T00:00:00Z"
                principal_photography_end: "2026-06-15T00:00:00Z"
                budget_cents: 100000000
              as: BrokerAgent
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/policies"
              payload:
                coverage_line: "GENERAL_LIABILITY"
                carrier_code: "AIG"
                policy_number: "AIG-GL-CD"
                limit_cents: 100000000
                aggregate_limit_cents: 200000000
                deductible_cents: 200000
                effective_date: "2026-05-01T00:00:00Z"
                expiry_date: "2026-12-31T00:00:00Z"
                payroll_basis_cents: 10000000
              as: BrokerAgent
              captures: { pol_id: $.data.id }
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { prod_v: $.data.version }
            - call: "POST /productions/${prod_id}/policies/${pol_id}/bind"
              payload: { expected_production_version: "${prod_v}" }
              as: BrokerAgent
            - call: "POST /productions/${prod_id}/activate"
              payload: {}
              as: BrokerAgent
          trigger:
            - call: "POST /productions/${prod_id}/claims"
              payload:
                policy_id: "${pol_id}"
                claim_type: "DAMAGE"
                occurrence_date: "2026-06-05T00:00:00Z"
                loss_amount_cents: 150000
              as: ProductionManager
              captures: { ded: $.data.deductible_applied_cents, pay: $.data.carrier_payable_cents }
          assert:
            - "Claim.deductible_applied_cents == 150000"
            - "Claim.carrier_payable_cents == 0"

      - name: posture_recompute_after_endorsement_revoke
        claim_type: derived_field_reconciliation
        grounds: [calculations.production_posture_derive, entities.Production.fields.coverage_posture]
        distinguishing_aspect: "Posture recomputed after endorsement revoke: failed_cast_exams changes affect posture_reasons."
        test_recipe:
          setup:
            - "Production ACTIVE with CAST policy BOUND, endorsement ISSUED on PRINCIPAL cast"
            - "Coverage posture should include cast-endorsement state"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /productions"
              payload:
                production_code: "PRD-DR"
                title: "Derived Recon"
                production_type: "FEATURE"
                principal_photography_start: "2026-06-01T00:00:00Z"
                principal_photography_end: "2026-08-01T00:00:00Z"
                budget_cents: 100000000
                requires_completion_bond: false
              as: BrokerAgent
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/cast-members"
              payload: { full_name: "Principal D", role_tier: "PRINCIPAL", weekly_salary_cents: 1000000, essential_element: true }
              as: ProductionManager
              captures: { cm_id: $.data.id }
            - call: "POST /productions/${prod_id}/cast-members/${cm_id}/physical-exam"
              payload: { outcome: "CLEARED" }
              as: UnderwriterAgent
            - call: "POST /productions/${prod_id}/policies"
              payload:
                coverage_line: "GENERAL_LIABILITY"
                carrier_code: "AIG"
                policy_number: "AIG-GL-DR"
                limit_cents: 100000000
                aggregate_limit_cents: 200000000
                deductible_cents: 100000
                effective_date: "2026-05-01T00:00:00Z"
                expiry_date: "2026-12-31T00:00:00Z"
                payroll_basis_cents: 10000000
              as: BrokerAgent
              captures: { gl_id: $.data.id }
            - call: "POST /productions/${prod_id}/policies"
              payload:
                coverage_line: "CAST"
                carrier_code: "CHUBB"
                policy_number: "CHU-CAST-DR"
                limit_cents: 50000000
                aggregate_limit_cents: 100000000
                deductible_cents: 100000
                effective_date: "2026-05-01T00:00:00Z"
                expiry_date: "2026-12-31T00:00:00Z"
                payroll_basis_cents: 100000000
              as: BrokerAgent
              captures: { cast_id: $.data.id }
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { prod_v: $.data.version }
            - call: "POST /productions/${prod_id}/policies/${gl_id}/bind"
              payload: { expected_production_version: "${prod_v}" }
              as: BrokerAgent
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { prod_v2: $.data.version }
            - call: "POST /productions/${prod_id}/policies/${cast_id}/bind"
              payload: { expected_production_version: "${prod_v2}" }
              as: BrokerAgent
            - call: "POST /productions/${prod_id}/cast-endorsements"
              payload:
                cast_member_id: "${cm_id}"
                policy_id: "${cast_id}"
                endorsement_type: "ESSENTIAL_ELEMENT"
              as: UnderwriterAgent
              captures: { endo_id: $.data.id }
            - call: "POST /productions/${prod_id}/cast-endorsements/${endo_id}/issue"
              payload: {}
              as: UnderwriterAgent
            - call: "POST /productions/${prod_id}/activate"
              payload: {}
              as: BrokerAgent
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { posture_before: $.data.coverage_posture }
          trigger:
            - call: "POST /productions/${prod_id}/cast-endorsements/${endo_id}/revoke"
              payload: {}
              as: UnderwriterAgent
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { posture_after: $.data.coverage_posture }
          assert:
            - "Production.coverage_posture reflects updated endorsement state"
            - "posture changes OR posture_reasons reflect revoked endorsement contribution"

  # ============================================================
  # Section: validations
  # ============================================================
  - section: validations
    instances:
      - name: posture_blocks_certificate_issuance_when_restricted
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_POSTURE_BLOCKS_ISSUANCE]"]
        distinguishing_aspect: "Posture RESTRICTED blocks certificate issuance with ERR_POSTURE_BLOCKS_ISSUANCE."
        test_recipe:
          setup:
            - "Production ACTIVE with BOUND GL policy, posture RESTRICTED due to open INJURY claim"
