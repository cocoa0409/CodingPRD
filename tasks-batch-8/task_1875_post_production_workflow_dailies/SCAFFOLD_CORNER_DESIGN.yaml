            - call: "POST /post-production/projects/${proj_id}/bays"
              payload: { bay_name: "BAY-01", bay_type: "OFFLINE", capacity_hours_per_day: 8 }
              as: PostSupervisor
              captures: { bay_id: $.data.id, bay_v0: $.data.version }
            - call: "POST /post-production/projects/${proj_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/bookings"
              payload: { bay_id: "${bay_id}", artist_email: "a@x.com", session_date: "2026-08-05", start_hour: 9, end_hour: 10, version_tag: "v1", expected_bay_version: "${bay_v0}" }
              as: PostSupervisor
          trigger:
            - call: "POST /post-production/projects/${proj_id}/bookings"
              payload: { bay_id: "${bay_id}", artist_email: "b@x.com", session_date: "2026-08-05", start_hour: 10, end_hour: 11, version_tag: "v2", expected_bay_version: "${bay_v0}" }
              as: PostSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION   # bay version advanced to V0+1 by first booking create"

