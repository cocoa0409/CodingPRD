  - rule_id: boundary_precision_check
    instances:
      - name: significance_score_exactly_at_threshold_is_significant
        grounds:
          - calculations.resource_significance_score
          - entities.ReviewOffice.fields.significance_threshold
          - entities.ResourceAnalysis.fields.significance_determination
          - endpoints.POST_resource_analyses_id_finalize
        distinguishing_aspect: |
          Metric: the two-decimal significance_score against significance_threshold 60.0 at
          POST /resource-analyses/{id}/finalize. A WATER analysis lands on exactly 60.00 and must be
          SIGNIFICANT (inclusive >=), while a SOCIOECONOMIC analysis one cent-equivalent below at
          59.99 must be NOT_SIGNIFICANT — a 0.01 separation that also proves round_half_up is applied
          to 59.988 before the comparison.
        test_recipe:
          setup:
            - "ReviewOffice ERO-1 has significance_threshold 60.0, intensity_weight 0.6 and context_weight 0.4."
            - "The Ridgeline action is at review_stage ANALYSIS with no CumulativeAction rows for WATER or SOCIOECONOMIC, so both cumulative uplift terms are exactly 0."
            - "A WATER analysis has intensity_score 60.0, context_sensitivity_score 60.0, affected_area_hectares 0.0 and no mitigation points."
            - "A SOCIOECONOMIC analysis has intensity_score 59.98, context_sensitivity_score 60.0, affected_area_hectares 0.0 and no mitigation points."
          setup_api_calls:
            - *c_clk_aug1
            - *c_office
            - *c_action
            - *c_screen1
            - *c_adj_cleared
            - *c_classify
            - *c_pn1
            - *c_scope1
            - *c_get_act_v
            - *c_adopt_pn1
            - *c_close_scope1
            - call: "POST /proposed-actions/${act_id}/resource-analyses"
              payload: { resource_area: "WATER", intensity_score: 60.0, context_sensitivity_score: 60.0, affected_area_hectares: 0.0 }
              as: ResourceSpecialist
              captures: { ra_water_id: $.data.id }
            - call: "POST /proposed-actions/${act_id}/resource-analyses"
              payload: { resource_area: "SOCIOECONOMIC", intensity_score: 59.98, context_sensitivity_score: 60.0, affected_area_hectares: 0.0 }
              as: ResourceSpecialist
              captures: { ra_socio_id: $.data.id }
          trigger:
            - call: "POST /resource-analyses/${ra_water_id}/finalize"
              payload: { basis: "UNMITIGATED" }
              as: ResourceSpecialist
            - call: "POST /resource-analyses/${ra_socio_id}/finalize"
              payload: { basis: "UNMITIGATED" }
              as: ResourceSpecialist
          assert:
            - "ResourceAnalysis.${ra_water_id}.cumulative_effect_score == 0.00"
            - "ResourceAnalysis.${ra_water_id}.significance_score == 60.00"
            - "ResourceAnalysis.${ra_water_id}.significance_determination == SIGNIFICANT"
            - "ResourceAnalysis.${ra_socio_id}.significance_score == 59.99"
            - "ResourceAnalysis.${ra_socio_id}.significance_determination == NOT_SIGNIFICANT"
            - "ProposedAction.${act_id}.max_unmitigated_score == 60.00"
            - "ProposedAction.${act_id}.cumulative_intensity_index == 0.00"

      - name: publish_rejected_when_screened_in_alternative_count_is_zero
        grounds:
          - validations.priority_12_business_constraint
          - entities.ReviewOffice.fields.min_screened_in_alternatives_ea
          - entities.ProposedAction.fields.alternatives_screened_in_count
          - errors.ERR_INSUFFICIENT_ALTERNATIVES
          - endpoints.POST_documents_id_publish
        distinguishing_aspect: |
          A different metric on a different endpoint: collection cardinality (the SCREENED_IN
          alternative count) against min_screened_in_alternatives_ea 1 at
          POST /documents/{id}/publish. The empty set at count 0 must be rejected and the very next
          count, 1, must be accepted — the empty-collection boundary, not a decimal threshold.
        test_recipe:
          setup:
            - "The ERO-1 / Ridgeline action is CLASSIFIED as ENVIRONMENTAL_ASSESSMENT, at review_stage ANALYSIS, with the required ESA_SECTION_7 consultation CONCURRED and no scoping issues."
            - "Alternative A (NO_ACTION) has been SCREENED_OUT and Alternative B is still PROPOSED, so alternatives_screened_in_count is exactly 0."
            - "office.min_screened_in_alternatives_ea is 1 and the logical clock reads 2026-09-05T00:00:00Z."
          setup_api_calls:
            - *c_clk_aug1
            - *c_office
            - *c_action
            - *c_screen1
            - *c_adj_cleared
            - *c_classify
            - *c_pn1
            - *c_scope1
            - *c_get_act_v
            - *c_adopt_pn1
            - *c_alt_a
            - *c_alt_b
            - call: "POST /alternatives/${altA_id}/screen"
              payload: { decision: "SCREENED_OUT" }
              as: ReviewingOfficial
            - *c_agency_fws
