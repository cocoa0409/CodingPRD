# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Brewery / Winery Tasting Room & Club — Expert
# Breadth probe across the claim-extraction-guide taxonomy. Every active instance
# carries an executable setup_api_calls/trigger chain conforming to §1.5; corners
# already covered by a §1.8 difficulty instance are emitted as excluded_because stubs.
# =============================================================================

scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_winery_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Winery, endpoints]
        distinguishing_aspect: "POST /wineries with name+ttb_permit_number+home_state_code returns 201, status=ACTIVE, version=1, all balances 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /wineries"
              payload: { name: "Fresh Co", ttb_permit_number: "FR-1", home_state_code: "OR" }
              as: ComplianceOfficer
              captures: { w: $.data.id }
          assert:
            - "HTTP 201; Winery.${w}.status == ACTIVE; Winery.${w}.version == 1; Winery.${w}.excise_tax_owed_cents == 0; Winery.${w}.loyalty_point_liability == 0"

      - name: create_batch_missing_required_volume_rejected
        claim_type: Required Fields
        grounds: ["entities.ProductionBatch.fields.volume_in_gallons", "validations[priority=17]"]
        distinguishing_aspect: "POST /batches without volume_in_gallons (a source:input no-default field) returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["An ACTIVE winery."]
          setup_api_calls:
            - call: "POST /wineries"
              payload: { name: "B Co", ttb_permit_number: "B-1", home_state_code: "CA" }
              as: ComplianceOfficer
              captures: { w: $.data.id }
          trigger:
            - call: "POST /batches"
              payload: { winery_id: "${w}", lot_code: "L1", beverage_class: "WINE", abv_percent: 13.5 }
              as: CellarManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; data.error_id == ERR_INVALID_REQUEST"

      - name: product_is_age_restricted_default_true
        claim_type: Defaults
        grounds: [entities.Product.fields.is_age_restricted]
        distinguishing_aspect: "POST /products omitting is_age_restricted defaults it to true."
        test_recipe:
          setup: ["A winery with a FERMENTING batch."]
          setup_api_calls:
            - call: "POST /wineries"
              payload: { name: "D Co", ttb_permit_number: "D-1", home_state_code: "CA" }
              as: ComplianceOfficer
              captures: { w: $.data.id }
            - call: "POST /batches"
              payload: { winery_id: "${w}", lot_code: "L1", beverage_class: "WINE", volume_in_gallons: 100, abv_percent: 13.5 }
              as: CellarManager
              captures: { b: $.data.id }
          trigger:
            - call: "POST /products"
              payload: { winery_id: "${w}", source_batch_id: "${b}", sku: "S1", vintage_year: 2024, bottle_volume_ml: 750, list_price_cents: 5000 }
              as: CellarManager
              captures: { p: $.data.id }
          assert:
            - "HTTP 201; Product.${p}.is_age_restricted == true; Product.${p}.status == DRAFT"

      - name: product_computed_free_bottles_correct_after_bottling
        claim_type: Computed Fields
        grounds: [entities.Product.fields.free_bottles, entities.Product.fields.on_hand_bottles, entities.Product.fields.allocated_bottles]
        distinguishing_aspect: "free_bottles = on_hand_bottles - allocated_bottles; after bottling 40 with no allocation, on_hand=40, allocated=0, free=40."
        test_recipe:
          setup: ["A WINE batch in BOTTLING with a DRAFT product."]
          setup_api_calls:
            - call: "POST /wineries"
              payload: { name: "F Co", ttb_permit_number: "F-1", home_state_code: "CA" }
              as: ComplianceOfficer
              captures: { w: $.data.id }
            - call: "POST /batches"
              payload: { winery_id: "${w}", lot_code: "L1", beverage_class: "WINE", volume_in_gallons: 100, abv_percent: 13.5 }
              as: CellarManager
              captures: { b: $.data.id }
            - call: "POST /products"
              payload: { winery_id: "${w}", source_batch_id: "${b}", sku: "S1", vintage_year: 2024, bottle_volume_ml: 750, list_price_cents: 5000 }
              as: CellarManager
              captures: { p: $.data.id }
            - call: "POST /batches/${b}/transitions"
              payload: { action: "BEGIN_AGING" }
              as: CellarManager
            - call: "POST /batches/${b}/transitions"
              payload: { action: "OPEN_BOTTLING" }
              as: CellarManager
          trigger:
            - call: "POST /batches/${b}/bottling-runs"
              payload: { product_id: "${p}", requested_bottles: 40 }
              as: CellarManager
          assert:
            - "Product.${p}.on_hand_bottles == 40; Product.${p}.allocated_bottles == 0; Product.${p}.free_bottles == 40"

      - name: get_nonexistent_winery_returns_404
        claim_type: Not Found
        grounds: ["entities.Winery", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /wineries/{bogus-uuid} returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /wineries/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; data.error_id == ERR_NOT_FOUND"

      - name: ledger_entry_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.ComplianceLedgerEntry]
        distinguishing_aspect: "ComplianceLedgerEntry has common_fields:false — created by bottling, read-only via GET /ledger-entries, carries id+created_at only, no version, no update endpoint."
        test_recipe:
          setup: ["A WINE batch in BOTTLING; one bottling run booked, producing BOTTLING_REMOVAL + EXCISE_ACCRUAL ledger entries."]
          setup_api_calls:
            - call: "POST /wineries"
              payload: { name: "L Co", ttb_permit_number: "L-1", home_state_code: "CA" }
              as: ComplianceOfficer
              captures: { w: $.data.id }
            - call: "POST /batches"
              payload: { winery_id: "${w}", lot_code: "L1", beverage_class: "WINE", volume_in_gallons: 100, abv_percent: 13.5 }
              as: CellarManager
              captures: { b: $.data.id }
            - call: "POST /products"
              payload: { winery_id: "${w}", source_batch_id: "${b}", sku: "S1", vintage_year: 2024, bottle_volume_ml: 750, list_price_cents: 5000 }
              as: CellarManager
              captures: { p: $.data.id }
            - call: "POST /batches/${b}/transitions"
              payload: { action: "BEGIN_AGING" }
              as: CellarManager
            - call: "POST /batches/${b}/transitions"
              payload: { action: "OPEN_BOTTLING" }
              as: CellarManager
            - call: "POST /batches/${b}/bottling-runs"
              payload: { product_id: "${p}", requested_bottles: 50 }
              as: CellarManager
          trigger:
            - call: "GET /ledger-entries"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "Response lists ComplianceLedgerEntry rows of entry_type BOTTLING_REMOVAL and EXCISE_ACCRUAL for winery ${w}; each carries id + created_at only (no version)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: confirm_already_completed_reservation_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Reservation.REQUESTED_to_CONFIRMED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CONFIRM on a COMPLETED reservation (terminal) returns ERR_INVALID_STATE 409; no side effects."
        test_recipe:
          setup: ["A reservation driven to COMPLETED (CONFIRM->SEAT->COMPLETE)."]
          setup_api_calls:
            - call: "POST /wineries"
              payload: { name: "R Co", ttb_permit_number: "R-1", home_state_code: "CA" }
              as: ComplianceOfficer
              captures: { w: $.data.id }
            - call: "POST /reservations"
              payload: { winery_id: "${w}", table_code: "T1", party_size: 2, starts_at: "2026-06-20T18:00:00Z", ends_at: "2026-06-20T19:00:00Z" }
              as: TastingRoomStaff
              captures: { res: $.data.id }
            - call: "POST /reservations/${res}/transitions"
              payload: { action: "CONFIRM" }
              as: TastingRoomStaff
            - call: "POST /reservations/${res}/transitions"
              payload: { action: "SEAT" }
              as: TastingRoomStaff
            - call: "POST /reservations/${res}/transitions"
              payload: { action: "COMPLETE" }
              as: TastingRoomStaff
          trigger:
            - call: "POST /reservations/${res}/transitions"
              payload: { action: "CONFIRM" }
              as: TastingRoomStaff
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_INVALID_STATE; Reservation.${res}.status == COMPLETED"

      - name: dump_batch_with_inventory_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.ProductionBatch.FERMENTING_to_DUMPED", "errors[ERR_BATCH_HAS_INVENTORY]"]
        distinguishing_aspect: "DUMP is blocked once a Product sourced from the batch has on_hand_bottles>0 — but a FERMENTING batch cannot have bottled inventory, so the test asserts a batch already advanced past FERMENTING cannot DUMP (ERR_INVALID_STATE), confirming DUMP only from FERMENTING."
        test_recipe:
          setup: ["A batch advanced to AGING (no longer FERMENTING)."]
          setup_api_calls:
            - call: "POST /wineries"
              payload: { name: "Dx Co", ttb_permit_number: "DX-1", home_state_code: "CA" }
              as: ComplianceOfficer
              captures: { w: $.data.id }
            - call: "POST /batches"
              payload: { winery_id: "${w}", lot_code: "L1", beverage_class: "WINE", volume_in_gallons: 100, abv_percent: 13.5 }
              as: CellarManager
              captures: { b: $.data.id }
            - call: "POST /batches/${b}/transitions"
              payload: { action: "BEGIN_AGING" }
              as: CellarManager
          trigger:
            - call: "POST /batches/${b}/transitions"
              payload: { action: "DUMP" }
              as: CellarManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_INVALID_STATE (DUMP only from FERMENTING)"

      - name: terminal_dumped_batch_no_transitions
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ProductionBatch.FERMENTING_to_DUMPED]
        distinguishing_aspect: "From terminal DUMPED, BEGIN_AGING is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["A DUMPED batch."]
          setup_api_calls:
            - call: "POST /wineries"
              payload: { name: "Tx Co", ttb_permit_number: "TX-1", home_state_code: "CA" }
              as: ComplianceOfficer
              captures: { w: $.data.id }
            - call: "POST /batches"
              payload: { winery_id: "${w}", lot_code: "L1", beverage_class: "WINE", volume_in_gallons: 100, abv_percent: 13.5 }
              as: CellarManager
              captures: { b: $.data.id }
            - call: "POST /batches/${b}/transitions"
              payload: { action: "DUMP" }
              as: CellarManager
          trigger:
            - call: "POST /batches/${b}/transitions"
              payload: { action: "BEGIN_AGING" }
              as: CellarManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_INVALID_STATE; Reservation/ batch stays DUMPED"

      - name: no_show_frees_table_for_later_confirm
        claim_type: Conditional cascade
        grounds: [state_machines.Reservation.CONFIRMED_to_NO_SHOW, state_machines.Reservation.REQUESTED_to_CONFIRMED]
        distinguishing_aspect: "After MARK_NO_SHOW on a CONFIRMED 18:00-19:00 T1 reservation, a later overlapping REQUESTED reservation on T1 18:30-19:30 can now CONFIRM successfully (interval freed)."
        test_recipe:
          setup: ["One CONFIRMED 18:00-19:00 reservation on T1 marked NO_SHOW; a second REQUESTED 18:30-19:30 on T1."]
          setup_api_calls:
            - call: "POST /wineries"
              payload: { name: "Ns Co", ttb_permit_number: "NS-1", home_state_code: "CA" }
              as: ComplianceOfficer
              captures: { w: $.data.id }
            - call: "POST /reservations"
              payload: { winery_id: "${w}", table_code: "T1", party_size: 2, starts_at: "2026-06-20T18:00:00Z", ends_at: "2026-06-20T19:00:00Z" }
              as: TastingRoomStaff
              captures: { res1: $.data.id }
            - call: "POST /reservations/${res1}/transitions"
              payload: { action: "CONFIRM" }
              as: TastingRoomStaff
            - call: "POST /reservations/${res1}/transitions"
              payload: { action: "MARK_NO_SHOW" }
              as: TastingRoomStaff
            - call: "POST /reservations"
              payload: { winery_id: "${w}", table_code: "T1", party_size: 3, starts_at: "2026-06-20T18:30:00Z", ends_at: "2026-06-20T19:30:00Z" }
              as: TastingRoomStaff
              captures: { res2: $.data.id }
          trigger:
            - call: "POST /reservations/${res2}/transitions"
              payload: { action: "CONFIRM" }
              as: TastingRoomStaff
          assert:
            - "HTTP 200; Reservation.${res2}.status == CONFIRMED (no ERR_TABLE_DOUBLE_BOOKED after NO_SHOW freed the interval)"

      - name: batch_dump_branch_covered_by_difficulty
        claim_type: Valid Transition
        grounds: [state_machines.ProductionBatch.FERMENTING_to_DUMPED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / batch_branch_ferment_to_dumped
          rationale: "The valid FERMENTING->DUMPED transition and its side-effects are asserted by the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: cider_excise_flat_per_gallon
        claim_type: Correct Result
        grounds: [calculations.excise_accrual]
        distinguishing_aspect: "CIDER variant: 100 bottles x 750ml = 19.812913 gal at 23c/gal -> round_half_up = 456c excise."
        test_recipe:
          setup: ["A CIDER batch in BOTTLING with a DRAFT product 750ml."]
          setup_api_calls:
            - call: "POST /wineries"
              payload: { name: "Cdr Co", ttb_permit_number: "CDR-1", home_state_code: "CA" }
              as: ComplianceOfficer
              captures: { w: $.data.id }
            - call: "POST /batches"
              payload: { winery_id: "${w}", lot_code: "L1", beverage_class: "CIDER", volume_in_gallons: 100, abv_percent: 6.0 }
              as: CellarManager
              captures: { b: $.data.id }
            - call: "POST /products"
              payload: { winery_id: "${w}", source_batch_id: "${b}", sku: "S1", vintage_year: 2024, bottle_volume_ml: 750, list_price_cents: 5000 }
              as: CellarManager
              captures: { p: $.data.id }
            - call: "POST /batches/${b}/transitions"
              payload: { action: "BEGIN_AGING" }
              as: CellarManager
            - call: "POST /batches/${b}/transitions"
              payload: { action: "OPEN_BOTTLING" }
              as: CellarManager
          trigger:
            - call: "POST /batches/${b}/bottling-runs"
              payload: { product_id: "${p}", requested_bottles: 100 }
              as: CellarManager
          assert:
            - "Winery.${w}.excise_tax_owed_cents == 456 (round_half_up(19.812913 * 23))"

      - name: wine_excise_tier2_above_14pct
        claim_type: Constants Applied
        grounds: [calculations.excise_accrual]
        distinguishing_aspect: "WINE abv 15.5 (>14) selects tier2 157c/gal: 100x750ml = 19.812913 gal -> round_half_up = 3111c."
        test_recipe:
          setup: ["A WINE batch abv 15.5 in BOTTLING with a DRAFT product 750ml."]
          setup_api_calls:
            - call: "POST /wineries"
              payload: { name: "W2 Co", ttb_permit_number: "W2-1", home_state_code: "CA" }
              as: ComplianceOfficer
              captures: { w: $.data.id }
            - call: "POST /batches"
              payload: { winery_id: "${w}", lot_code: "L1", beverage_class: "WINE", volume_in_gallons: 100, abv_percent: 15.5 }
              as: CellarManager
              captures: { b: $.data.id }
            - call: "POST /products"
              payload: { winery_id: "${w}", source_batch_id: "${b}", sku: "S1", vintage_year: 2024, bottle_volume_ml: 750, list_price_cents: 5000 }
              as: CellarManager
              captures: { p: $.data.id }
            - call: "POST /batches/${b}/transitions"
              payload: { action: "BEGIN_AGING" }
              as: CellarManager
            - call: "POST /batches/${b}/transitions"
              payload: { action: "OPEN_BOTTLING" }
              as: CellarManager
          trigger:
            - call: "POST /batches/${b}/bottling-runs"
              payload: { product_id: "${p}", requested_bottles: 100 }
              as: CellarManager
          assert:
            - "Winery.${w}.excise_tax_owed_cents == 3111 (round_half_up(19.812913 * 157))"

      - name: distribution_freight_low_below_threshold
        claim_type: Correct Result
        grounds: [calculations.distribution_invoice]
        distinguishing_aspect: "1 case @8000 list -> gross 96000, wholesale_base 48000 < 50000 -> freight LOW 2500, total 50500 (boundary below)."
        test_recipe:
          setup: ["An ACTIVE winery with a product list 8000c."]
          setup_api_calls:
            - call: "POST /wineries"
              payload: { name: "Dl Co", ttb_permit_number: "DL-1", home_state_code: "CA" }
              as: ComplianceOfficer
              captures: { w: $.data.id }
            - call: "POST /batches"
              payload: { winery_id: "${w}", lot_code: "L1", beverage_class: "WINE", volume_in_gallons: 100, abv_percent: 13.5 }
              as: CellarManager
              captures: { b: $.data.id }
            - call: "POST /products"
              payload: { winery_id: "${w}", source_batch_id: "${b}", sku: "S1", vintage_year: 2024, bottle_volume_ml: 750, list_price_cents: 8000 }
              as: CellarManager
              captures: { p: $.data.id }
          trigger:
            - call: "POST /distribution-orders"
              payload: { winery_id: "${w}", product_id: "${p}", retailer_license_number: "RET-1", dest_state_code: "CA", case_count: 1 }
              as: ComplianceOfficer
              captures: { d: $.data.id }
          assert:
            - "DistributionOrder.${d}.wholesale_total_cents == 50500"

      - name: event_deposit_computed
        claim_type: Correct Result
        grounds: [calculations.event_deposit, entities.Reservation.fields.deposit_cents]
        distinguishing_aspect: "is_event=true party_size 4 -> deposit_cents = 4*1500 = 6000; non-event would be 0."
        test_recipe:
          setup: ["An ACTIVE winery."]
          setup_api_calls:
            - call: "POST /wineries"
              payload: { name: "Ev Co", ttb_permit_number: "EV-1", home_state_code: "CA" }
              as: ComplianceOfficer
              captures: { w: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { winery_id: "${w}", table_code: "PATIO", party_size: 4, starts_at: "2026-06-20T18:00:00Z", ends_at: "2026-06-20T20:00:00Z", is_event: true }
              as: TastingRoomStaff
              captures: { res: $.data.id }
          assert:
            - "Reservation.${res}.deposit_cents == 6000; Reservation.${res}.status == REQUESTED"

      - name: excise_wine_vs_beer_divergence_covered
        claim_type: Variant Divergence
        grounds: [calculations.excise_accrual]
        excluded_because:
          difficulty_instance: dual_variant_calc / excise_wine_tier_vs_beer_barrel_diverge
          rationale: "WINE-vs-BEER divergence on identical gallons is asserted by the named §1.8 instance."

      - name: shipment_pricing_volume_kicker_cap_covered
        claim_type: Correct Result
        grounds: [calculations.shipment_pricing]
        excluded_because:
          difficulty_instance: combinatorial_formula / shipment_pricing_kicker_then_cap_mode_a
          rationale: "Kicker+cap nesting asserted by the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: per_member_cap_exceeded_on_schedule
        claim_type: Violation → Error
        grounds: ["validations[priority=11]", "errors[ERR_PER_MEMBER_CAP_EXCEEDED]"]
        distinguishing_aspect: "Release per_member_cap=6; scheduling a single shipment of 7 bottles for one membership returns ERR_PER_MEMBER_CAP_EXCEEDED 422."
        test_recipe:
          setup: ["OPEN release pool 12, per_member_cap 6; ACTIVE membership; schedule 7 bottles."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wineries"
              payload: { name: "Cap Co", ttb_permit_number: "CAP-1", home_state_code: "CA" }
              as: ComplianceOfficer
              captures: { w: $.data.id }
            - call: "POST /batches"
              payload: { winery_id: "${w}", lot_code: "L1", beverage_class: "WINE", volume_in_gallons: 100, abv_percent: 13.5 }
              as: CellarManager
              captures: { b: $.data.id }
            - call: "POST /products"
              payload: { winery_id: "${w}", source_batch_id: "${b}", sku: "S1", vintage_year: 2024, bottle_volume_ml: 750, list_price_cents: 5000 }
              as: CellarManager
              captures: { p: $.data.id, pv0: $.data.version }
            - call: "POST /batches/${b}/transitions"
              payload: { action: "BEGIN_AGING" }
              as: CellarManager
            - call: "POST /batches/${b}/transitions"
              payload: { action: "OPEN_BOTTLING" }
              as: CellarManager
            - call: "POST /batches/${b}/bottling-runs"
              payload: { product_id: "${p}", requested_bottles: 30 }
              as: CellarManager
            - call: "POST /products/${p}/transitions"
              payload: { action: "ACTIVATE", expected_product_version: "${pv0}" }
              as: CellarManager
              captures: { pv1: $.data.version }
            - call: "POST /releases"
              payload: { winery_id: "${w}", product_id: "${p}", pool_bottles: 12, per_member_cap: 6, opens_at: "2026-06-01T00:00:00Z", closes_at: "2026-07-01T00:00:00Z" }
              as: CellarManager
              captures: { r: $.data.id, rv0: $.data.version }
            - call: "POST /releases/${r}/transitions"
              payload: { action: "OPEN_RELEASE", expected_release_version: "${rv0}", expected_product_version: "${pv1}" }
              as: CellarManager
            - call: "POST /members"
              payload: { winery_id: "${w}", full_name: "Ada Adult", email: "ada@x.com", date_of_birth: "1990-01-01T00:00:00Z", ship_to_state_code: "CA" }
              as: ClubManager
              captures: { m: $.data.id }
            - call: "POST /members/${m}/transitions"
              payload: { action: "ACTIVATE" }
              as: ClubManager
            - call: "POST /memberships"
              payload: { winery_id: "${w}", member_id: "${m}", tier: "SILVER", cadence_months: 3, bottles_per_shipment: 6 }
              as: ClubManager
              captures: { ms: $.data.id }
            - call: "POST /memberships/${ms}/transitions"
              payload: { action: "ACTIVATE" }
              as: ClubManager
          trigger:
            - call: "POST /shipments"
              payload: { winery_id: "${w}", membership_id: "${ms}", release_id: "${r}", requested_bottles: 7 }
              as: ClubManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; data.error_id == ERR_PER_MEMBER_CAP_EXCEEDED"

      - name: pa_state_forbids_any_dtc_shipment
        claim_type: Violation → Error
        grounds: ["validations[priority=9]", "calculations.ship_state_limit_check", "errors[ERR_STATE_SHIPPING_LIMIT]"]
