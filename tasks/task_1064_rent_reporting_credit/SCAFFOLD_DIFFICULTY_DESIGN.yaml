            - call: "POST /api/tenants"
              payload: { full_name: "Bri Branch", email: "bri@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/landlords"
              payload: { company_name: "Acme PM", email: "pm@x.com" }
              as: PlatformAdmin
              captures: { ll_id: $.data.id }
            - call: "POST /api/enrollments"
              payload: { tenant_id: "${t_id}", plan_id: "${plan_id}" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { en_id: $.data.id }
            - call: "GET /api/invoices"
              payload: { enrollment_id: "${en_id}", kind: "SUBSCRIPTION" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { sub_inv_id: "$.data[0].id" }
            - call: "POST /api/invoices/${sub_inv_id}/pay"
              payload: {}
              as: Tenant
              as_user_id: "${t_id}"
            - call: "POST /api/leases"
              payload: { tenant_id: "${t_id}", landlord_id: "${ll_id}", property_address: "5 Elm St", rent_amount_cents: 120000, monthly_due_day: 5, lease_start: "2026-01-01T00:00:00Z", lease_end: "2027-01-01T00:00:00Z" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { lease_id: $.data.id }
            - call: "POST /api/leases/${lease_id}/verify"
              payload: { decision: "VERIFIED" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { lease_v2: $.data.version }
            - call: "POST /api/rent-payments"
              payload: { lease_id: "${lease_id}", period_month: "2026-06", due_date: "2026-06-05T00:00:00Z", paid_date: "2026-06-20T00:00:00Z", amount_paid_cents: 120000, expected_lease_version: "${lease_v2}" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { pay_id: $.data.id }
            - call: "POST /api/rent-payments/${pay_id}/report"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
              captures: { ri_id: $.data.id }
            - call: "POST /api/disputes"
              payload: { reported_item_id: "${ri_id}", reason_code: "PAID_ON_TIME" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { d_id: $.data.id }
            - call: "POST /api/disputes/${d_id}/investigate"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /api/disputes/${d_id}/resolve"
              payload: { resolution: "CORRECTED", corrected_on_time: true }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "POST /api/disputes/${d_id}/resolve .data.status == RESOLVED_CORRECTED"
            - "GET /api/reported-items/${ri_id} .data.status == CORRECTED"
            - "GET /api/reported-items?supersedes_item_id=${ri_id} .data[0].status == REPORTED"
            - "GET /api/reported-items?supersedes_item_id=${ri_id} .data[0].on_time == true"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_terminates_lease_retracts_item_recomputes_rate
        grounds:
          - state_machines.Enrollment.ACTIVE_to_CANCELLED
          - state_machines.Lease.VERIFIED_to_TERMINATED
          - state_machines.ReportedItem.REPORTED_to_RETRACTED
          - entities.Tenant.fields.effective_reported_items
        distinguishing_aspect: |
          Depth-4 transitive chain from cancel: Enrollment ACTIVE->CANCELLED causes Lease VERIFIED->TERMINATED,
          which causes its ReportedItem REPORTED->RETRACTED, which causes tenant.effective_reported_items to drop
          to 0. Each hop is caused by the prior hop's mutation, not by the cancel directly.
