              payload: { service_type: "WATER", unit: "GALLON", fixed_charge_cents: 1000, tiers: [{upper_bound_units: 6000, rate_cents_per_1000: 315}, {upper_bound_units: 12000, rate_cents_per_1000: 500}, {upper_bound_units: null, rate_cents_per_1000: 800}], effective_date: "2026-01-01T00:00:00Z" }
              as: BillingSpecialist
            - call: "POST /accounts"
              payload: { account_holder_name: "Clear Cleo", service_address: "128 Oak", occupant_type: "RESIDENTIAL" }
              as: BillingSpecialist
              captures: { a_id: $.data.id }
            - call: "POST /accounts/${a_id}/meters"
              payload: { service_type: "WATER" }
              as: BillingSpecialist
              captures: { m_id: $.data.id }
            - call: "POST /meters/${m_id}/readings"
              payload: { read_date: "2026-04-15T00:00:00Z", reading_value: 9500, read_type: "ACTUAL" }
              as: MeterTech
            - call: "POST /accounts/${a_id}/bills"
              payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-05-01T00:00:00Z" }
              as: BillingSpecialist
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: CollectionsOfficer
            - call: "POST /bills/${b_id}/mark-delinquent"
              payload: {}
              as: CollectionsOfficer
            - call: "POST /accounts/${a_id}/shutoff-orders"
              payload: { scheduled_date: "2026-06-20T00:00:00Z", reason: "DELINQUENCY" }
              as: CollectionsOfficer
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /accounts/${a_id}/payments"
              payload: { amount_cents: 4640, method: "ACH" }
