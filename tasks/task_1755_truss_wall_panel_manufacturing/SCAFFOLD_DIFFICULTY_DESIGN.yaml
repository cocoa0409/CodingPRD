          setup:
            - "Same production/delivery preamble as claim_cap_vs_settlement_divergence: load2 DELIVERED with bundle bd1; claim c1 (claimed 500000) TRIAGED by adj-1 then APPROVE_CREDIT 0.30 by adj-2; claim c2 (claimed 75000) filed on the same bundle and TRIAGED by adj-1"
