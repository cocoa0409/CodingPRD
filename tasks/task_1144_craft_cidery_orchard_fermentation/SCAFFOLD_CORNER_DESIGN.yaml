      - name: back_blend_action_endpoint
        claim_type: action_endpoint
        grounds:
          - "endpoints.\"POST /cidery/fermentation-batches/{batchId}/back-blend\""
        distinguishing_aspect: |
          Back-blend moves volume from a source batch into the target and
          recomputes gravity as weighted average. Self-referential FK.
        test_recipe:
          setup: ["two READY batches fb_src (30 L, gravity 4.0) and fb_dst (70 L, gravity 5.0)"]
          setup_api_calls:
            - call: "POST /cidery/_clock/set_current_utc"
