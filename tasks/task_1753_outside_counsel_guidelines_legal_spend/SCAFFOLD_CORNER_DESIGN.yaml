scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: legal_department_creation_returns_defaults
        claim_type: creation
        grounds: [entities.LegalDepartment]
        distinguishing_aspect: "POST /legal-departments with all six required fields returns 201 with id, created_at, updated_at, version=1 populated by the system."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /legal-departments"
              payload: { name: "D", annual_rate_increase_cap_pct: 5.00, partner_ratio_min_pct: 10, partner_ratio_max_pct: 90, guideline_notice_days: 30, acknowledgment_window_days: 14 }
              as: LegalOpsReviewer
              captures: { dept_id: $.data.id, dept_v: $.data.version }
          assert:
            - "dept_id is a UUID string"
            - "dept_v == 1"
            - "created_at and updated_at are ISO-8601 with 3 fractional digits"

      - name: matter_computed_fields_ignore_input
        claim_type: computed_fields
        grounds: [entities.Matter.fields.billed_to_date_cents, entities.Matter.fields.accrual_outstanding_cents]
        distinguishing_aspect: "Client-supplied billed_to_date_cents/accrual_outstanding_cents in the create payload are ignored; server initializes both to 0."
        test_recipe:
          setup: ["dept + firm exist"]
          setup_api_calls:
            - call: "POST /legal-departments"
              payload: { name: "D", annual_rate_increase_cap_pct: 5.00, partner_ratio_min_pct: 10, partner_ratio_max_pct: 90, guideline_notice_days: 30, acknowledgment_window_days: 14 }
              as: LegalOpsReviewer
              captures: { dept_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms"
              payload: { firm_name: "F" }
              as: LegalOpsReviewer
              captures: { firm_id: $.data.id }
          trigger:
            - call: "POST /legal-departments/${dept_id}/matters"
              payload: { panel_firm_id: "${firm_id}", title: "M", budget_cents: 1000 }
              as: LegalOpsReviewer
              captures: { m_billed: $.data.billed_to_date_cents, m_accr: $.data.accrual_outstanding_cents }
          assert:
            - "m_billed == 0"
            - "m_accr == 0"

      - name: timekeeper_invalid_tk_class_rejected
        claim_type: type_constraints
        grounds: [entities.Timekeeper.fields.tk_class]
        distinguishing_aspect: "tk_class value outside {PARTNER, ASSOCIATE, PARALEGAL} is rejected with ERR_INVALID_REQUEST-class 400."
        test_recipe:
          setup: ["dept + firm exist"]
          setup_api_calls:
            - call: "POST /legal-departments"
              payload: { name: "D", annual_rate_increase_cap_pct: 5.00, partner_ratio_min_pct: 10, partner_ratio_max_pct: 90, guideline_notice_days: 30, acknowledgment_window_days: 14 }
              as: LegalOpsReviewer
              captures: { dept_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms"
              payload: { firm_name: "F" }
              as: LegalOpsReviewer
              captures: { firm_id: $.data.id }
          trigger:
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/timekeepers"
              payload: { full_name: "X", tk_class: "PARTNER_SHIP" }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "request rejected with a 400-class error (invalid enum)"

      - name: get_nonexistent_matter_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent matter UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["dept exists"]
          setup_api_calls:
            - call: "POST /legal-departments"
              payload: { name: "D", annual_rate_increase_cap_pct: 5.00, partner_ratio_min_pct: 10, partner_ratio_max_pct: 90, guideline_notice_days: 30, acknowledgment_window_days: 14 }
              as: LegalOpsReviewer
              captures: { dept_id: $.data.id }
          trigger:
            - call: "GET /legal-departments/${dept_id}/matters/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: LegalOpsReviewer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: matter_creation_missing_required_field
        claim_type: required_fields
        grounds: [entities.Matter.fields.budget_cents]
        distinguishing_aspect: "Omitting required budget_cents on matter create is rejected with a 400-class error."
        test_recipe:
          setup: ["dept + firm exist"]
          setup_api_calls:
            - call: "POST /legal-departments"
              payload: { name: "D", annual_rate_increase_cap_pct: 5.00, partner_ratio_min_pct: 10, partner_ratio_max_pct: 90, guideline_notice_days: 30, acknowledgment_window_days: 14 }
              as: LegalOpsReviewer
              captures: { dept_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms"
              payload: { firm_name: "F" }
              as: LegalOpsReviewer
              captures: { firm_id: $.data.id }
          trigger:
            - call: "POST /legal-departments/${dept_id}/matters"
              payload: { panel_firm_id: "${firm_id}", title: "NoBudget" }
              as: LegalOpsReviewer
              captures: { err: $.data.error_id }
          assert:
            - "request rejected with a 400-class error (missing required field)"

      - name: matter_listing_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "GET /matters?limit=1&offset=0 returns data array + meta plus pagination fields total_count and has_more honoring the envelope contract."
        test_recipe:
          setup: ["dept + firm + two matters exist"]
          setup_api_calls:
            - call: "POST /legal-departments"
              payload: { name: "D", annual_rate_increase_cap_pct: 5.00, partner_ratio_min_pct: 10, partner_ratio_max_pct: 90, guideline_notice_days: 30, acknowledgment_window_days: 14 }
              as: LegalOpsReviewer
              captures: { dept_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms"
              payload: { firm_name: "F" }
              as: LegalOpsReviewer
              captures: { firm_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/matters"
              payload: { panel_firm_id: "${firm_id}", title: "M1", budget_cents: 1000 }
              as: LegalOpsReviewer
            - call: "POST /legal-departments/${dept_id}/matters"
              payload: { panel_firm_id: "${firm_id}", title: "M2", budget_cents: 1000 }
              as: LegalOpsReviewer
          trigger:
            - call: "GET /legal-departments/${dept_id}/matters?limit=1&offset=0"
              payload: {}
              as: LegalOpsReviewer
          assert:
            - "response contains meta.api_request_id, response_type == 'array'"
            - "data is an array of length 1"
            - "pagination: total_count == 2, has_more == true, limit == 1, offset == 0"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: engage_already_engaged_matter_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Matter.transitions.ENGAGED_to_ENGAGED]
        distinguishing_aspect: "Re-engaging an ENGAGED matter is rejected with ERR_INVALID_STATE (no ENGAGED→ENGAGED transition exists)."
        test_recipe:
          setup: ["matter ENGAGED"]
          setup_api_calls:
            - call: "POST /legal-departments"
              payload: { name: "D", annual_rate_increase_cap_pct: 5.00, partner_ratio_min_pct: 10, partner_ratio_max_pct: 90, guideline_notice_days: 30, acknowledgment_window_days: 14 }
              as: LegalOpsReviewer
              captures: { dept_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms"
              payload: { firm_name: "F" }
              as: LegalOpsReviewer
              captures: { firm_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/matters"
              payload: { panel_firm_id: "${firm_id}", title: "M", budget_cents: 1000 }
              as: LegalOpsReviewer
              captures: { matter_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/engage"
              payload: {}
              as: PanelFirmUser
              as_user_id: "${firm_id}"
          trigger:
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/engage"
              payload: {}
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: acknowledge_already_acknowledged_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.GuidelineAcknowledgment]
        distinguishing_aspect: "Double-acknowledging the same acknowledgment is rejected with ERR_INVALID_STATE (ACKNOWLEDGED is terminal)."
        test_recipe:
          setup: ["guideline published (creates PENDING ack), firm acknowledges once"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LegalOpsReviewer
            - call: "POST /legal-departments"
              payload: { name: "D", annual_rate_increase_cap_pct: 5.00, partner_ratio_min_pct: 10, partner_ratio_max_pct: 90, guideline_notice_days: 30, acknowledgment_window_days: 14 }
              as: LegalOpsReviewer
              captures: { dept_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms"
              payload: { firm_name: "F" }
              as: LegalOpsReviewer
              captures: { firm_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/guideline-versions"
              payload: { version_label: "V1", effective_date: "2026-09-01T00:00:00Z" }
              as: LegalOpsReviewer
              captures: { gv_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/guideline-versions/${gv_id}/publish"
              payload: {}
              as: LegalOpsReviewer
            - call: "GET /legal-departments/${dept_id}/panel-firms/${firm_id}/acknowledgments"
              payload: {}
              as: LegalOpsReviewer
              captures: { ack_id: "$.data[0].id" }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/acknowledgments/${ack_id}/acknowledge"
              payload: {}
              as: PanelFirmUser
              as_user_id: "${firm_id}"
          trigger:
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/acknowledgments/${ack_id}/acknowledge"
              payload: {}
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: paid_invoice_cannot_be_voided_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Invoice]
        distinguishing_aspect: "PAID is terminal for the void action; attempting to void a PAID invoice returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["invoice fully approved and paid"]
          setup_api_calls:
            - call: "POST /legal-departments"
              payload: { name: "D", annual_rate_increase_cap_pct: 5.00, partner_ratio_min_pct: 10, partner_ratio_max_pct: 90, guideline_notice_days: 30, acknowledgment_window_days: 14 }
              as: LegalOpsReviewer
              captures: { dept_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms"
              payload: { firm_name: "F" }
              as: LegalOpsReviewer
              captures: { firm_id: $.data.id, firm_v: $.data.version }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/timekeepers"
              payload: { full_name: "P", tk_class: "PARTNER" }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { tk_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/timekeepers/${tk_id}/qualify"
              payload: {}
              as: LegalOpsReviewer
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards"
              payload: { effective_year: 2026, expected_panel_firm_version: "${firm_v}" }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { card_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card_id}/rates"
              payload: { timekeeper_id: "${tk_id}", hourly_rate_cents: 100000 }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card_id}/submit"
              payload: {}
              as: PanelFirmUser
              as_user_id: "${firm_id}"
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card_id}/approve"
              payload: {}
              as: LegalOpsReviewer
            - call: "POST /legal-departments/${dept_id}/matters"
              payload: { panel_firm_id: "${firm_id}", title: "M", budget_cents: 100000000 }
              as: LegalOpsReviewer
              captures: { matter_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/engage"
              payload: {}
              as: PanelFirmUser
              as_user_id: "${firm_id}"
            - call: "GET /legal-departments/${dept_id}/matters/${matter_id}"
              payload: {}
              as: LegalOpsReviewer
              captures: { matter_v: $.data.version }
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/invoices"
              payload:
                invoice_number: "INV-T"
                billing_period_start: "2026-08-01T00:00:00Z"
                billing_period_end: "2026-09-01T00:00:00Z"
                expected_matter_version: "${matter_v}"
                line_items:
                  - { timekeeper_id: "${tk_id}", utbms_task_code: "L110", narrative: "clean L110", hours: 1.00, rate_cents: 100000 }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { invoice_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/invoices/${invoice_id}/pay"
              payload: {}
              as: LegalOpsReviewer
          trigger:
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/invoices/${invoice_id}/void"
              payload: {}
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: pay_invoice_twice_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.Invoice.APPROVED_to_PAID]
        distinguishing_aspect: "Second pay on an already-PAID invoice returns ERR_INVALID_STATE — the trigger is not idempotent."
        test_recipe:
          setup: ["invoice fully approved and already paid"]
          setup_api_calls:
            - call: "POST /legal-departments"
              payload: { name: "D", annual_rate_increase_cap_pct: 5.00, partner_ratio_min_pct: 10, partner_ratio_max_pct: 90, guideline_notice_days: 30, acknowledgment_window_days: 14 }
              as: LegalOpsReviewer
              captures: { dept_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms"
              payload: { firm_name: "F" }
              as: LegalOpsReviewer
              captures: { firm_id: $.data.id, firm_v: $.data.version }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/timekeepers"
              payload: { full_name: "P", tk_class: "PARTNER" }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { tk_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/timekeepers/${tk_id}/qualify"
              payload: {}
              as: LegalOpsReviewer
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards"
              payload: { effective_year: 2026, expected_panel_firm_version: "${firm_v}" }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { card_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card_id}/rates"
              payload: { timekeeper_id: "${tk_id}", hourly_rate_cents: 100000 }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card_id}/submit"
              payload: {}
              as: PanelFirmUser
              as_user_id: "${firm_id}"
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card_id}/approve"
              payload: {}
              as: LegalOpsReviewer
            - call: "POST /legal-departments/${dept_id}/matters"
              payload: { panel_firm_id: "${firm_id}", title: "M", budget_cents: 100000000 }
              as: LegalOpsReviewer
              captures: { matter_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/engage"
              payload: {}
              as: PanelFirmUser
              as_user_id: "${firm_id}"
            - call: "GET /legal-departments/${dept_id}/matters/${matter_id}"
              payload: {}
              as: LegalOpsReviewer
              captures: { matter_v: $.data.version }
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/invoices"
              payload:
                invoice_number: "INV-PP"
                billing_period_start: "2026-08-01T00:00:00Z"
                billing_period_end: "2026-09-01T00:00:00Z"
                expected_matter_version: "${matter_v}"
                line_items:
                  - { timekeeper_id: "${tk_id}", utbms_task_code: "L110", narrative: "clean L110", hours: 1.00, rate_cents: 100000 }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { invoice_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/invoices/${invoice_id}/pay"
              payload: {}
              as: LegalOpsReviewer
          trigger:
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/invoices/${invoice_id}/pay"
              payload: {}
              as: LegalOpsReviewer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: close_matter_with_open_invoice_blocked
        claim_type: precondition_enforcement
        grounds: ["state_machines.Matter.ENGAGED_to_CLOSED", "errors[ERR_MATTER_HAS_OPEN_INVOICES]"]
        distinguishing_aspect: "Matter with an UNDER_REVIEW invoice cannot close; ERR_MATTER_HAS_OPEN_INVOICES."
        test_recipe:
          setup: ["matter ENGAGED with an invoice whose single line is PENDING (rate-not-on-card path) leaving invoice UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /legal-departments"
              payload: { name: "D", annual_rate_increase_cap_pct: 5.00, partner_ratio_min_pct: 10, partner_ratio_max_pct: 90, guideline_notice_days: 30, acknowledgment_window_days: 14 }
              as: LegalOpsReviewer
              captures: { dept_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms"
              payload: { firm_name: "F" }
              as: LegalOpsReviewer
              captures: { firm_id: $.data.id, firm_v: $.data.version }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/timekeepers"
              payload: { full_name: "P", tk_class: "PARTNER" }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { tk_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/timekeepers/${tk_id}/qualify"
              payload: {}
              as: LegalOpsReviewer
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards"
              payload: { effective_year: 2026, expected_panel_firm_version: "${firm_v}" }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { card_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card_id}/rates"
              payload: { timekeeper_id: "${tk_id}", hourly_rate_cents: 100000 }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card_id}/submit"
              payload: {}
              as: PanelFirmUser
              as_user_id: "${firm_id}"
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card_id}/approve"
              payload: {}
              as: LegalOpsReviewer
            - call: "POST /legal-departments/${dept_id}/matters"
              payload: { panel_firm_id: "${firm_id}", title: "M", budget_cents: 100000000 }
              as: LegalOpsReviewer
              captures: { matter_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/engage"
              payload: {}
              as: PanelFirmUser
              as_user_id: "${firm_id}"
            - call: "GET /legal-departments/${dept_id}/matters/${matter_id}"
              payload: {}
              as: LegalOpsReviewer
              captures: { matter_v: $.data.version }
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/invoices"
              payload:
                invoice_number: "INV-OPEN"
                billing_period_start: "2026-08-01T00:00:00Z"
                billing_period_end: "2026-09-01T00:00:00Z"
                expected_matter_version: "${matter_v}"
                line_items:
                  - { timekeeper_id: "${tk_id}", utbms_task_code: "L110", narrative: "clean L110", hours: 1.00, rate_cents: 90000 }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
          trigger:
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/close"
              payload: {}
              as: LegalOpsReviewer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MATTER_HAS_OPEN_INVOICES"

      - name: disqualify_timekeeper_with_pending_lines_blocked
        claim_type: precondition_enforcement
        grounds: ["state_machines.Timekeeper.QUALIFIED_to_DISQUALIFIED", "errors[ERR_TIMEKEEPER_HAS_PENDING_LINES]"]
        distinguishing_aspect: "Timekeeper referenced by a PENDING line item cannot be disqualified."
        test_recipe:
          setup: ["timekeeper QUALIFIED; invoice with one rate-not-on-card line (PENDING) referencing them"]
          setup_api_calls:
            - call: "POST /legal-departments"
              payload: { name: "D", annual_rate_increase_cap_pct: 5.00, partner_ratio_min_pct: 10, partner_ratio_max_pct: 90, guideline_notice_days: 30, acknowledgment_window_days: 14 }
              as: LegalOpsReviewer
              captures: { dept_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms"
              payload: { firm_name: "F" }
              as: LegalOpsReviewer
              captures: { firm_id: $.data.id, firm_v: $.data.version }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/timekeepers"
              payload: { full_name: "P", tk_class: "PARTNER" }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { tk_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/timekeepers/${tk_id}/qualify"
              payload: {}
              as: LegalOpsReviewer
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards"
              payload: { effective_year: 2026, expected_panel_firm_version: "${firm_v}" }
              as: PanelFirmUser
