  # =========================================================================
  - section: endpoints
    instances:

      - name: corner_pagination_pnms_list_total_count_has_more
        claim_type: pagination
        grounds:
          - endpoints
        distinguishing_aspect: |
          GET /rush/pnms returns the response envelope's pagination fields
          {limit, offset, total_count, has_more} with defaults limit=10,
          offset=0. With 3 PNMs and limit=2, the first page returns
          total_count=3, has_more=true; second page (offset=2) returns
          total_count=3, has_more=false.
        test_recipe:
          setup:
            - "Three PNMs registered."
          setup_api_calls:
            - call: "POST /rush/pnms/register"
              payload: { full_name: "A", gpa: 3.50 }
              as: Anonymous
            - call: "POST /rush/pnms/register"
              payload: { full_name: "B", gpa: 3.50 }
              as: Anonymous
            - call: "POST /rush/pnms/register"
              payload: { full_name: "C", gpa: 3.50 }
              as: Anonymous
          trigger:
            - call: "GET /rush/pnms?limit=2&offset=0"
              payload: {}
              as: PanhellenicAdmin
            - call: "GET /rush/pnms?limit=2&offset=2"
              payload: {}
              as: PanhellenicAdmin
          assert:
            - "First-page response pagination: total_count=3, has_more=true, returned 2 items."
            - "Second-page response pagination: total_count=3, has_more=false, returned 1 item."

      - name: corner_response_envelope_success_shape
        claim_type: response_envelope
        grounds:
          - endpoints
        distinguishing_aspect: |
          Every success response uses the FIXED envelope: top-level keys
          meta {api_request_id, api_request_timestamp}, response_type, data.
          api_request_id begins with 'req_'; api_request_timestamp is ISO 8601.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /rush/chapters"
              payload: { name: "EnvShape", greek_type: "FRATERNITY", quota_total: 2, dues_per_member_cents: 5000, legacy_priority_slots: 0 }
              as: PanhellenicAdmin
          assert:
            - "Response JSON has keys meta, response_type, data."
            - "meta.api_request_id matches /^req_[A-Za-z0-9_-]+$/."
            - "meta.api_request_timestamp parses as ISO 8601 UTC."
            - "response_type == 'object'."

  # =========================================================================
  - section: errors
    instances:

      - name: corner_error_envelope_shape_on_404
        claim_type: error_envelope
        grounds:
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: |
          Error responses use envelope: data = { error_id, message }. The
          error_id is the catalog id; message is human-readable.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /rush/parties/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PanhellenicAdmin
              captures: { err_id: "$.data.error_id", err_msg: "$.data.message" }
          assert:
            - "HTTP status 404."
            - "err_id == 'ERR_RESOURCE_NOT_FOUND'."
            - "err_msg is a non-empty string."
            - "response_type == 'error'."

      - name: corner_error_reference_not_found_on_invitation_create
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - errors[ERR_REFERENCE_NOT_FOUND]
        distinguishing_aspect: |
          POST /rush/invitations with body party_id pointing to a real party
          but pnm_id pointing to a non-existent PNM returns 422
          ERR_REFERENCE_NOT_FOUND (priority 4: body FKs), not 404 (priority 3:
          path-param existence).
        test_recipe:
          setup:
            - "A real party; no PNM with the queried id."
          setup_api_calls:
            - call: "POST /rush/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PanhellenicAdmin
            - call: "POST /rush/chapters"
              payload: { name: "RefNF", greek_type: "FRATERNITY", quota_total: 2, dues_per_member_cents: 5000, legacy_priority_slots: 0 }
              as: PanhellenicAdmin
              captures: { ch: "$.data.id" }
            - call: "POST /rush/rounds"
              payload: { cycle_label: "Fall 2026 rnf", bid_day_at: "2026-09-15T12:00:00Z" }
              as: PanhellenicAdmin
              captures: { rnd: "$.data.id" }
            - call: "POST /rush/parties"
              payload: { round_id: "${rnd}", chapter_id: "${ch}", scheduled_start_utc: "2026-09-05T18:00:00Z", duration_minutes: 60, capacity: 5 }
              as: ChapterOfficer
              as_user_id: "${ch}"
              captures: { pt: "$.data.id" }
          trigger:
            - call: "POST /rush/invitations"
              payload: { party_id: "${pt}", pnm_id: "00000000-0000-0000-0000-000000000000" }
              as: ChapterOfficer
              as_user_id: "${ch}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status 422."
            - "err_id == 'ERR_REFERENCE_NOT_FOUND'."

  # =========================================================================
  - section: rbac
    instances:

      - name: corner_rbac_pnm_cannot_create_chapter
        claim_type: rbac_denial
        grounds:
          - roles
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          POST /rush/chapters is exclusive to PanhellenicAdmin. A PNM
          calling it returns 403 ERR_UNAUTHORIZED.
        test_recipe:
          setup:
            - "A registered PNM."
          setup_api_calls:
            - call: "POST /rush/pnms/register"
              payload: { full_name: "RbacP", gpa: 3.50 }
              as: Anonymous
              captures: { p: "$.data.id" }
          trigger:
            - call: "POST /rush/chapters"
              payload: { name: "Forbidden", greek_type: "SORORITY", quota_total: 2, dues_per_member_cents: 1, legacy_priority_slots: 0 }
              as: PNM
              as_user_id: "${p}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status 403."
            - "err_id == 'ERR_UNAUTHORIZED'."

      - name: corner_auth_missing_returns_unauthenticated
        claim_type: rbac_denial
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          A non-public endpoint called WITHOUT X-User-Role/X-User-ID returns
          401 ERR_UNAUTHENTICATED at priority 1, before the priority-2
          authorization check would fire.
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "GET /rush/rounds"
              payload: {}
              as: Anonymous
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status 401."
            - "err_id == 'ERR_UNAUTHENTICATED'."

  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: corner_occ_stale_chapter_version_on_bid_create
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[chapter-quota-stale-version]
          - validations[priority=6]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: |
          Two sequential POST /rush/bid-matches against the same chapter
          both quoting the pre-bump Chapter.version: the first succeeds
          (and bumps Chapter.version); the second is rejected with 412
          ERR_STALE_VERSION even though the chapter still has quota
          headroom.
        test_recipe:
          setup:
            - "Chapter with quota_total=2; round in BID_DAY; two ACTIVE PNMs eligible to be manually bid."
          setup_api_calls:
            - call: "POST /rush/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PanhellenicAdmin
            - call: "POST /rush/chapters"
              payload: { name: "OccChap", greek_type: "FRATERNITY", quota_total: 2, dues_per_member_cents: 10000, legacy_priority_slots: 0 }
              as: PanhellenicAdmin
              captures: { ch: "$.data.id" }
            - call: "POST /rush/rounds"
              payload: { cycle_label: "Fall 2026 occ", bid_day_at: "2026-09-15T12:00:00Z" }
              as: PanhellenicAdmin
              captures: { rnd: "$.data.id" }
            - call: "POST /rush/pnms/register"
              payload: { full_name: "OA", gpa: 3.50 }
              as: Anonymous
              captures: { oa: "$.data.id" }
            - call: "POST /rush/pnms/register"
              payload: { full_name: "OB", gpa: 3.50 }
              as: Anonymous
              captures: { ob: "$.data.id" }
            - call: "POST /rush/pnms/${oa}/activate"
              payload: {}
              as: RecruitmentChair
            - call: "POST /rush/pnms/${ob}/activate"
              payload: {}
              as: RecruitmentChair
            - call: "POST /rush/parties"
              payload: { round_id: "${rnd}", chapter_id: "${ch}", scheduled_start_utc: "2026-09-05T18:00:00Z", duration_minutes: 60, capacity: 10 }
              as: ChapterOfficer
              as_user_id: "${ch}"
              captures: { pt: "$.data.id" }
            - call: "POST /rush/parties/${pt}/open"
              payload: {}
              as: ChapterOfficer
              as_user_id: "${ch}"
            - call: "POST /rush/invitations"
              payload: { party_id: "${pt}", pnm_id: "${oa}" }
              as: ChapterOfficer
              as_user_id: "${ch}"
              captures: { ioa: "$.data.id" }
            - call: "POST /rush/invitations"
              payload: { party_id: "${pt}", pnm_id: "${ob}" }
              as: ChapterOfficer
              as_user_id: "${ch}"
              captures: { iob: "$.data.id" }
            - call: "POST /rush/invitations/${ioa}/accept"
              payload: {}
              as: PNM
              as_user_id: "${oa}"
            - call: "POST /rush/invitations/${iob}/accept"
              payload: {}
              as: PNM
              as_user_id: "${ob}"
            - call: "POST /rush/parties/${pt}/complete"
              payload: {}
              as: ChapterOfficer
              as_user_id: "${ch}"
            - call: "POST /rush/rounds/${rnd}/advance"
              payload: {}
              as: RecruitmentChair
            - call: "POST /rush/preferences"
              payload: { round_id: "${rnd}", side: "PNM_TO_CHAPTER", pnm_id: "${oa}", chapter_id: "${ch}", rank: 1 }
              as: PNM
              as_user_id: "${oa}"
            - call: "POST /rush/preferences"
              payload: { round_id: "${rnd}", side: "PNM_TO_CHAPTER", pnm_id: "${ob}", chapter_id: "${ch}", rank: 1 }
              as: PNM
              as_user_id: "${ob}"
            - call: "POST /rush/preferences"
              payload: { round_id: "${rnd}", side: "CHAPTER_TO_PNM", pnm_id: "${oa}", chapter_id: "${ch}", rank: 1 }
              as: ChapterOfficer
              as_user_id: "${ch}"
            - call: "POST /rush/preferences"
              payload: { round_id: "${rnd}", side: "CHAPTER_TO_PNM", pnm_id: "${ob}", chapter_id: "${ch}", rank: 2 }
              as: ChapterOfficer
              as_user_id: "${ch}"
            - call: "POST /rush/rounds/${rnd}/advance"
              payload: {}
              as: RecruitmentChair
            - call: "GET /rush/chapters/${ch}"
              payload: {}
              as: PanhellenicAdmin
              captures: { ch_v_observed: "$.data.version" }
          trigger:
            - call: "POST /rush/bid-matches"
              payload: { round_id: "${rnd}", chapter_id: "${ch}", pnm_id: "${oa}", expected_chapter_version: "${ch_v_observed}" }
              as: ChapterOfficer
              as_user_id: "${ch}"
            - call: "POST /rush/bid-matches"
              payload: { round_id: "${rnd}", chapter_id: "${ch}", pnm_id: "${ob}", expected_chapter_version: "${ch_v_observed}" }
              as: ChapterOfficer
              as_user_id: "${ch}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "First trigger call returns 201."
            - "Second trigger call returns 412 with err_id == 'ERR_STALE_VERSION' (Chapter.version bumped by the first call)."
            - "Chapter ${ch}.pledged_count is unchanged from 0 at the moment of the second call's rejection (still 0, since the first bid is only PROPOSED, not ACCEPTED — but Chapter.version did bump on PROPOSED creation per §1.5 side effects)."

      - name: corner_derived_field_chapter_pledged_count_already_covered
        claim_type: derived_field
        grounds:
          - entities.Chapter.fields.pledged_count
        excluded_because:
          difficulty_instance: ci_chapter_quota_count_conserved_accept_then_rescind
          rationale: "Chapter.pledged_count derived-field correctness is asserted as part of the §1.8 quota-conservation invariant."

      - name: corner_cascade_party_complete_marks_no_show_already_covered
        claim_type: cascade_down
        grounds:
          - state_machines.Party.OPEN_to_COMPLETED
        excluded_because:
          difficulty_instance: nlsm_party_branching_open_cancel_complete
          rationale: "Party complete -> INVITED becomes NO_SHOW is asserted in §1.8 nlsm Party branching."

  # =========================================================================
  - section: consistency_model
    instances:

      - name: corner_immediate_consistency_chapter_version_after_put
        claim_type: immediate_consistency
        grounds:
          - entities.Chapter
        distinguishing_aspect: |
          PUT /rush/chapters/{id} reflects in a subsequent GET in the same
          request sequence: a sequential GET after PUT shows the new value
          immediately (immediate consistency, not eventual).
        test_recipe:
          setup:
            - "A chapter with dues_per_member_cents=10000."
          setup_api_calls:
            - call: "POST /rush/chapters"
              payload: { name: "ImmCons", greek_type: "SORORITY", quota_total: 3, dues_per_member_cents: 10000, legacy_priority_slots: 0 }
              as: PanhellenicAdmin
              captures: { ch: "$.data.id" }
          trigger:
            - call: "PUT /rush/chapters/${ch}"
              payload: { dues_per_member_cents: 25000 }
              as: PanhellenicAdmin
            - call: "GET /rush/chapters/${ch}"
              payload: {}
              as: PanhellenicAdmin
              captures: { got_dues: "$.data.dues_per_member_cents", got_version: "$.data.version" }
          assert:
            - "got_dues == 25000."
            - "got_version == 2 (incremented from 1)."
