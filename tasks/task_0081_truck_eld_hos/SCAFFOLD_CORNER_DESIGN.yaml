        claim_type: aggregate_validation
        grounds: ["validations[priority=12]", "errors[ERR_DUPLICATE_ADVERSE_CLAIM]"]
        distinguishing_aspect: "Approving a second AdverseConditionsClaim for the same (driver_id, log_date) when one is already APPROVED -> 409 ERR_DUPLICATE_ADVERSE_CLAIM."
        test_recipe:
