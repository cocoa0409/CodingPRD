            - *c_tra
            - *c_trb
            - *c_trc
            - *c_cert
            - *c_mem
            - *c_case
            - *c_triage
            - *c_assign
            - *c_note_intake
            - *c_note_contact
            - *c_note_resolution
            - *c_round
            - *c_accept
            - call: "POST /reemployment/ombudsmen"
