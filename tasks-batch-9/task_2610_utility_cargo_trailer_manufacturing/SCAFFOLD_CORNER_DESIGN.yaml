        distinguishing_aspect: |
          The waiver comparison is >= FREIGHT_WAIVER_CENTS and the subtotal lands EXACTLY on 50000, which
          is only reachable because the 30% markup is rounded per line BEFORE the quantity multiply:
          9615 * 1.30 = 12499.5 -> 12500 -> x4 = 50000. Summing the raw marked-up values first would give
