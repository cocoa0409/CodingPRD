          trigger:
            - call: "POST /api/integration-programs/${prog_id}/recall-campaigns/${recall_id}/activate"
              payload: {}
              as: SafetyOfficer
              as_user_id: "so-1"
          assert:
            - "RecallCampaign.${recall_id}.status == ACTIVE"
            - "RecallCampaign.${recall_id}.packs_in_scope == 1"
            - "RecallCampaign.${recall_id}.packs_contained == 1"
