            - call: "POST /seating-reservations"
              payload: { resident_id: "${r_id}", venue_id: "${v_id}", service_date: "2026-08-11", meal_period: "LUNCH", seat_start_utc: "2026-08-11T12:00:00Z", party_size: 1, expected_venue_version: "${v_v2}" }
              as: DiningServicesManager
              captures: { res_id: $.data.id, res_status: $.data.status }
          assert:
            - "${do_clinical} == PENDING_REVIEW and ${do_review} == AWAITING_DIETITIAN"
            - "${blocked_error} == ERR_DIET_ORDER_NOT_VERIFIED with HTTP 409"
            - "${do_clinical_after} == ACTIVE and ${do_review_after} == APPROVED"
            - "${res_status} == RESERVED (identical payload, only the DietOrder's state changed)"
            - "GET /venues/${v_id}/seat-availability for 2026-08-11 / LUNCH reports committed_seats 1 and open_seats 7"
      - name: ticket_depends_on_venue_temperature_posture
        entity_pair: "MealServiceTicket depends on DiningVenue"
        grounds:
          - validations[priority=12]
          - validations[priority=13]
          - errors[id=ERR_VENUE_POSTURE_RESTRICTED]
          - errors[id=ERR_VENUE_SERVICE_SUSPENDED]
          - calculations.temperature_posture
          - entities.DiningVenue.fields.temp_compliance_posture
        distinguishing_aspect: |
          A different entity pair and a graded dependency: MealServiceTicket issuance reads the
          satellite venue's food-safety posture, which is itself derived from the TemperatureLog
          stream. At WATCH only RESIDENT tickets pass while GUEST is refused; one more violation
          escalates to SUSPENDED and even the RESIDENT ticket is refused — the same payload changes
          verdict twice without ever being edited.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "One community, one SATELLITE venue with seat_capacity 6."
            - "One ACTIVE resident with an APPROVED, ACTIVE REGULAR/THIN diet order."
            - "Two out-of-range HOT_HOLDING readings of 120.0 F with no corrective action, driving consecutive_temp_violation_count to 2 and posture to WATCH."
