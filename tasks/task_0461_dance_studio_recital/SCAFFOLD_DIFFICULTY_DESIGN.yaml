              as: StudioAdmin
              captures: { room_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Mr EX", email: "ex@x.com" }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${term_id}", room_id: "${room_id}", instructor_id: "${inst_id}", discipline: "JAZZ", required_level: "PETITE", min_age: 5, max_age: 18, monthly_tuition_cents: 8000, capacity_cap: 20 }
              as: StudioAdmin
              captures: { sec_id: $.data.id }
            - call: "POST /sections/${sec_id}/sessions"
              payload: { day_of_week: 0, start_minute: 600, end_minute: 660 }
              as: StudioAdmin
          trigger:
            - call: "POST /sections/00000000-0000-4000-8000-000000000000/sessions"
              payload: { day_of_week: 0, start_minute: 600, end_minute: 660 }
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_NOT_FOUND"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: costume_rush_boundary_on_close_date
        grounds:
          - calculations.costume_order_price
          - entities.CostumeOrder.fields.price_cents
          - entities.Costume.fields.size_window_close_date
        distinguishing_aspect: |
          On the size_window_close_date itself (clock == close date) NO rush surcharge applies (price 4500);
          strictly after it, rush applies (price 6000). Boundary is `>` not `>=` on a monetary metric reached
          via POST /costumes/{id}/submit-order.
        test_recipe:
          setup:
            - "Term OPEN; section; family student CONFIRMED; costume unit_price 4500 rush 1500 close 2026-03-15."
            - "Clock set to exactly 2026-03-15T00:00:00Z (the close date) so NO rush applies."
