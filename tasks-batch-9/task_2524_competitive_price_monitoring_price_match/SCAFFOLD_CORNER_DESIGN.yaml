      - name: corner_confidence_variant_selection_at_identifier_score_90
        claim_type: variant_selection
        grounds: [calculations.match_confidence_score.constants.IDENTIFIER_ANCHOR_MIN_SCORE, calculations.match_confidence_score.variants]
        distinguishing_aspect: "Variant choice, not variant arithmetic: match_method IDENTIFIER with identifier_score 89 falls back to ATTRIBUTE_BLEND (and therefore inherits the low-image ceiling, 6000) while 90 crosses IDENTIFIER_ANCHOR_MIN_SCORE into IDENTIFIER_ANCHORED (9500, ceiling not applicable) — one point of identifier score moves the row two grades."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; product SKU-VAR-1; ACTIVE PRIMARY competitors C-A and C-B."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
