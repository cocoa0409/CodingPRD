  - rule_id: resource_temporal_overlap
    instances:
      - name: designer_measure_windows_half_open_with_cross_store_buffer
        grounds:
          - "validations[priority=7]"
          - entities.DesignJob.fields.measure_window_start
          - "errors[ERR_DESIGNER_WINDOW_OVERLAP]"
        distinguishing_aspect: |
          Interval semantics: half-open [start, end) on the designer resource,
          so back-to-back at the SAME store is legal, while a DIFFERENT store
          requires a 30-minute travel buffer — tested exactly at the buffer
          boundary. Distinct semantics from the aggregate-capacity slot rule.
        test_recipe:
          setup:
            - "RETAIL account store_codes [ST-1, ST-2]; program ACTIVE with line F1; clock 2026-09-01T00:00:00Z; single designer des-1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/accounts"
