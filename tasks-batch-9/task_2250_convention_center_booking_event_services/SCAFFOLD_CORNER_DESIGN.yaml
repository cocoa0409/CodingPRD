              captures: { lic_v_stale: $.data.version }
            - call: "POST /convention-center/licenses/${lic_id}/amendments"
              payload: { expected_license_version: "${lic_v_stale}", amendment_note: "add a second loading dock slot" }
              as: SalesManager
            - call: "POST /convention-center/licenses/${lic_id}/accept-amendment"
              payload: {}
              as: Licensee
              as_user_id: "${cl_ssp_id}"
          trigger:
            - call: "POST /convention-center/licenses/${lic_id}/amendments"
              payload: { expected_license_version: "${lic_v_stale}", amendment_note: "extend move-out by four hours" }
              as: SalesManager
          assert:
            - "the trigger returns 412 with data.error_id == ERR_STALE_LICENSE_VERSION"
            - "LicenseAgreement.${lic_id}.status == EXECUTED"
            - "LicenseAgreement.${lic_id}.amendment_round == 1"
            - "LicenseAgreement.${lic_id}.pending_amendment_note == null"
            - "a fresh GET /convention-center/licenses/${lic_id} reports a version strictly greater than ${lic_v_stale}, and the identical amendment presented with that value returns 200 and moves the license to AMENDMENT_PENDING with amendment_round 2"

      - name: hold_creation_with_a_stale_expected_booking_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[EventBooking]
          - validations[priority=42]
          - errors[ERR_STALE_BOOKING_VERSION]
          - endpoints[POST /convention-center/bookings/{id}/holds]
        distinguishing_aspect: |
          Placing a hold is itself a write to the parent booking, because it bumps
          hold_count and the booking's version. So the version that authorised the first
          hold is already stale for the second, and the tentative hold hierarchy cannot be
          extended from a cached read even though max_holds_per_booking is 2. The refusal
          must not consume the remaining hold slot.
        test_recipe:
          setup:
            - "a Ballroom B CONSUMER_SHOW booking exists under a window whose max_holds_per_booking is 2"
            - "one hold has been placed using the version observed at creation, which bumped the booking's version"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
              as: VenueAdmin
            - call: "POST /convention-center/spaces"
              payload: { name: "Ballroom B", space_class: "BALLROOM", rentable_sqft: 40000, daily_base_rate_cents: 1200000 }
              as: VenueAdmin
              captures: { sp_bb_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "Sunbelt Show Promotions", contact_email: "ssp@example.org", organization_type: "PROMOTER" }
              as: VenueAdmin
              captures: { cl_ssp_id: $.data.id }
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", space_id: "${sp_bb_id}", event_name: "Sunbelt Boat Show", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-06-08", show_start_date: "2027-06-10", show_end_date: "2027-06-12", move_out_end_date: "2027-06-13" }
              as: SalesManager
              captures: { bk_id: $.data.id, bk_v1: $.data.version }
            - call: "POST /convention-center/bookings/${bk_id}/holds"
              payload: { expected_booking_version: "${bk_v1}" }
              as: SalesManager
              captures: { hold_first_id: $.data.id }
          trigger:
            - call: "POST /convention-center/bookings/${bk_id}/holds"
              payload: { expected_booking_version: "${bk_v1}" }
              as: SalesManager
          assert:
            - "the trigger returns 412 with data.error_id == ERR_STALE_BOOKING_VERSION"
            - "EventBooking.${bk_id}.hold_count == 1"
            - "EventBooking.${bk_id}.status == TENTATIVE"
            - "GET /convention-center/holds filtered on ${bk_id} returns total_count == 1"
            - "SpaceHold.${hold_first_id}.hold_rank == 1 and status == ACTIVE"
            - "a fresh GET /convention-center/bookings/${bk_id} reports a version strictly greater than ${bk_v1}, and the identical hold request presented with that value returns 201 with hold_rank 2"

      - name: hold_sweep_reruns_with_all_counters_at_zero
        claim_type: scheduled_actions
        grounds:
          - endpoints[POST /convention-center/_ops/hold-sweep]
          - complexity_profile.complexity_layers
          - entities.SpaceHold.fields.release_deadline_utc
        distinguishing_aspect: |
          The sweep is a checkpointed operation, not a pure function of the clock: the
          first run past a release deadline reports one released hold and one released
          booking, and an immediate second run at the identical clock reports every counter
          at zero because the work is already recorded. A stateless reimplementation that
          recomputes "which holds are past deadline" would report the same non-zero counts
          twice and would also try to release an already-released booking.
        test_recipe:
          setup:
            - "a Ballroom B CONSUMER_SHOW booking with show_start_date 2027-06-10 carries an ACTIVE hold whose release_deadline_utc is 2027-03-10T00:00:00Z"
            - "the clock has advanced to 2027-03-11T00:00:00Z, one day past that deadline"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
              as: VenueAdmin
            - call: "POST /convention-center/spaces"
              payload: { name: "Ballroom B", space_class: "BALLROOM", rentable_sqft: 40000, daily_base_rate_cents: 1200000 }
              as: VenueAdmin
              captures: { sp_bb_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "Sunbelt Show Promotions", contact_email: "ssp@example.org", organization_type: "PROMOTER" }
              as: VenueAdmin
              captures: { cl_ssp_id: $.data.id }
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", space_id: "${sp_bb_id}", event_name: "Sunbelt Boat Show", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-06-08", show_start_date: "2027-06-10", show_end_date: "2027-06-12", move_out_end_date: "2027-06-13" }
              as: SalesManager
              captures: { bk_id: $.data.id, bk_v1: $.data.version }
            - call: "POST /convention-center/bookings/${bk_id}/holds"
              payload: { expected_booking_version: "${bk_v1}" }
              as: SalesManager
              captures: { hold_id: $.data.id }
            - call: "POST /convention-center/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-11T00:00:00Z" }
              as: VenueAdmin
          trigger:
            - call: "POST /convention-center/_ops/hold-sweep"
              payload: {}
              as: VenueAdmin
            - call: "POST /convention-center/_ops/hold-sweep"
              payload: {}
              as: VenueAdmin
          assert:
            - "the first trigger returns 200 with data.expired_challenge_count == 0, data.released_hold_count == 1, data.promoted_hold_count == 0 and data.released_booking_count == 1"
            - "the second trigger returns 200 with all four counters at 0"
            - "SpaceHold.${hold_id}.status == RELEASED"
            - "EventBooking.${bk_id}.status == RELEASED and hold_count == 0"
            - "SpaceUnit.${sp_bb_id}.committed_space_days == 0"

      - name: layer_dual_variant_rental_basis_switch
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.settlement_rental_basis
        excluded_because:
          difficulty_instance: dual_variant_calc / actual_usage_rental_basis_diverges_from_contracted_rental_on_same_booking
          rationale: "The named §1.8 instance already prices one booking under both settlement bases and pins the delta on the switch."

      - name: layer_dual_variant_labor_charge_switch
        claim_type: dual_variant_calculation
