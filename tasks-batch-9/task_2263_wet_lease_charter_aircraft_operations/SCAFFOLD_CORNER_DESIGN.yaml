      - name: rolling_28_day_block_limit_rejects_the_fifth_long_haul_leg
        claim_type: Aggregate validation
        grounds:
          - validations[priority 53 ERR_CREW_BLOCK_LIMIT_EXCEEDED]
          - validations[priority 52 ERR_CREW_DUTY_LIMIT_EXCEEDED]
          - calculations.crew_duty_and_block_exposure
          - errors.ERR_CREW_BLOCK_LIMIT_EXCEEDED
        distinguishing_aspect: |
          Every one of the five legs is individually lawful; only their 28-day AGGREGATE breaks the
          5400-minute block ceiling. Four 1200-minute legs on 09-02, 09-06, 09-10 and 09-14 total
          4800 stored block minutes, and the 700-minute candidate on 09-18 projects
          4800 + 700 = 5500 > 5400 inside the window [2026-08-21T06:00Z, 2026-09-18T06:00Z) anchored
          on the CANDIDATE's scheduled_out. The 7-day duty projection is simultaneously fine
          (only the 09-14 leg falls in [09-11T06:00Z, 09-18T06:00Z), so 1305 + 805 = 2110 <= 3600),
          which is what forces the answer to be ERR_CREW_BLOCK_LIMIT_EXCEEDED rather than the
          duty error at priority 52.
          
