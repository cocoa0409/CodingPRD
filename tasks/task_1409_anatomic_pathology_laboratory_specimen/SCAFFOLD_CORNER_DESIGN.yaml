          - state_machines.Case.AMENDING_to_FINAL
        distinguishing_aspect: "Amendment re-finalization does NOT rewrite finalized_at: the amended sign at 2026-08-04 leaves finalized_at at the original 2026-08-03T12:00:00Z, and tat_breached stays computed from that first finalization."
        test_recipe:
          setup: ["case signed out at logical time 2026-08-03T12:00:00Z (SIMPLE CALENDAR deadline 2026-08-05T10:00:00Z, not breached)"]
          setup_api_calls:
