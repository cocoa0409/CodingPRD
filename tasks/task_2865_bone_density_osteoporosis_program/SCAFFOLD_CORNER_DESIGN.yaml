      - name: cross_calibration_constants_bracket_the_no_factor_and_excessive_drift_edges
        claim_type: constants_applied
        grounds:
          - calculations.cross_calibration_factor.constants.CROSS_CAL_NO_FACTOR_PCT
          - calculations.cross_calibration_factor.constants.CROSS_CAL_MAX_DRIFT_PCT
          - state_machines.CalibrationEvent.PHANTOM_SET_COMPLETE_to_APPROVED
          - state_machines.CalibrationEvent.PHANTOM_SET_COMPLETE_to_REJECTED
        distinguishing_aspect: "Two SOFTWARE_UPGRADE events on the same device pin both constants: 0.90 percent is below CROSS_CAL_NO_FACTOR_PCT 1.00 so the outcome is WITHIN_TOLERANCE_NO_FACTOR with proposed_cross_cal_factor exactly 1.0000 (not 0.9911) and adjudication still bumps calibration_generation to 2, while 6.00 percent exceeds CROSS_CAL_MAX_DRIFT_PCT 5.00 so the outcome is REJECTED_EXCESSIVE_DRIFT with a null factor and adjudication leaves the device in CROSS_CAL_PENDING with calibration_generation still 2. The CROSS_CAL runs themselves, including the 6.000-SD failing one, must not touch Densitometer.status or consecutive_qc_pass_count."
        test_recipe:
          setup:
            - "A registered device with phantom baseline 1.0000 / 0.0100 and no patients involved; the clock is 2026-03-02T08:00:00Z."
          setup_api_calls:
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bone-density/densitometers"
              payload: { serial_number: "HLG-0002", manufacturer: "HOLOGIC", model: "Horizon A", site_code: "MAIN", phantom_baseline_bmd_g_cm2: 1.0000, phantom_baseline_sd_g_cm2: 0.0100, appointment_buffer_minutes: 15, daily_scan_capacity: 12 }
              as: ProgramAdmin
              captures: { dev_b_id: $.data.id }
            - call: "POST /bone-density/densitometers/${dev_b_id}/calibration-events"
              payload: { change_type: "SOFTWARE_UPGRADE", change_note: "vendor patch 7.2" }
              as: ProgramAdmin
              captures: { cal1_id: $.data.id }
            - call: "POST /bone-density/densitometers/${dev_b_id}/qc-runs"
              payload: { purpose: "CROSS_CAL_BASELINE", phantom_bmd_g_cm2: 1.0000, scan_mode: "ARRAY", calibration_event_id: "${cal1_id}" }
              as: ProgramAdmin
            - call: "POST /bone-density/densitometers/${dev_b_id}/qc-runs"
              payload: { purpose: "CROSS_CAL_BASELINE", phantom_bmd_g_cm2: 1.0000, scan_mode: "ARRAY", calibration_event_id: "${cal1_id}" }
              as: ProgramAdmin
            - call: "POST /bone-density/densitometers/${dev_b_id}/qc-runs"
              payload: { purpose: "CROSS_CAL_BASELINE", phantom_bmd_g_cm2: 1.0000, scan_mode: "ARRAY", calibration_event_id: "${cal1_id}" }
              as: ProgramAdmin
            - call: "POST /bone-density/densitometers/${dev_b_id}/qc-runs"
              payload: { purpose: "CROSS_CAL_NEW", phantom_bmd_g_cm2: 1.0090, scan_mode: "ARRAY", calibration_event_id: "${cal1_id}" }
              as: ProgramAdmin
            - call: "POST /bone-density/densitometers/${dev_b_id}/qc-runs"
              payload: { purpose: "CROSS_CAL_NEW", phantom_bmd_g_cm2: 1.0090, scan_mode: "ARRAY", calibration_event_id: "${cal1_id}" }
              as: ProgramAdmin
            - call: "POST /bone-density/densitometers/${dev_b_id}/qc-runs"
              payload: { purpose: "CROSS_CAL_NEW", phantom_bmd_g_cm2: 1.0090, scan_mode: "ARRAY", calibration_event_id: "${cal1_id}" }
              as: ProgramAdmin
          trigger:
            - call: "POST /bone-density/calibration-events/${cal1_id}/close"
              payload: {}
              as: ProgramAdmin
            - call: "POST /bone-density/calibration-events/${cal1_id}/adjudicate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /bone-density/densitometers/${dev_b_id}/calibration-events"
              payload: { change_type: "SOFTWARE_UPGRADE", change_note: "vendor patch 7.3" }
              as: ProgramAdmin
              captures: { cal2_id: $.data.id }
            - call: "POST /bone-density/densitometers/${dev_b_id}/qc-runs"
              payload: { purpose: "CROSS_CAL_BASELINE", phantom_bmd_g_cm2: 1.0000, scan_mode: "ARRAY", calibration_event_id: "${cal2_id}" }
              as: ProgramAdmin
            - call: "POST /bone-density/densitometers/${dev_b_id}/qc-runs"
              payload: { purpose: "CROSS_CAL_BASELINE", phantom_bmd_g_cm2: 1.0000, scan_mode: "ARRAY", calibration_event_id: "${cal2_id}" }
              as: ProgramAdmin
            - call: "POST /bone-density/densitometers/${dev_b_id}/qc-runs"
              payload: { purpose: "CROSS_CAL_BASELINE", phantom_bmd_g_cm2: 1.0000, scan_mode: "ARRAY", calibration_event_id: "${cal2_id}" }
              as: ProgramAdmin
            - call: "POST /bone-density/densitometers/${dev_b_id}/qc-runs"
              payload: { purpose: "CROSS_CAL_NEW", phantom_bmd_g_cm2: 1.0600, scan_mode: "ARRAY", calibration_event_id: "${cal2_id}" }
              as: ProgramAdmin
            - call: "POST /bone-density/densitometers/${dev_b_id}/qc-runs"
              payload: { purpose: "CROSS_CAL_NEW", phantom_bmd_g_cm2: 1.0600, scan_mode: "ARRAY", calibration_event_id: "${cal2_id}" }
