  # ---------------------------------------------------------------------------
  # SECTION: dual_variant_calculation (complexity layer)
  # Variant DIVERGENCE on the selector (the layer's hardest case: the two bases pick a
  # different winner from an identical pool) and variant RECONCILIATION on the incentive
  # (the provisional is recomputed on the NEW interval at reschedule, and the committed
  # ledger must hold the new amount, not the old one and not the sum).
  # ---------------------------------------------------------------------------
  - section: dual_variant_calculation
    instances:

      - name: the_two_selection_bases_draw_different_deals_from_an_identical_pool
        claim_type: variant_divergence
        grounds:
          - calculations.sample_selection_rank_score.variants
          - endpoints.POST /sampling-frames/{frame_id}/draw
          - complexity_layers.dual_variant_calculation
        distinguishing_aspect: "Two programs hold byte-identical pools (a 500000.00 ENTERPRISE deal closing 2026-04-05 and a 150000.00 MIDMARKET deal closing 2026-06-30, both against a PRIMARY competitor), and the ONLY difference is frame.selection_basis. STRATIFIED_BY_SEGMENT (0.40/0.40) scores the MIDMARKET deal 0.8689 against 0.8378 and draws it; VALUE_WEIGHTED (0.65/0.15 with the 1.25 ENTERPRISE multiplier) scores the ENTERPRISE deal 1.2521 against 0.8133 and draws that one instead. An implementation that hard-codes one basis, or that applies the ENTERPRISE multiplier under both, picks the same deal twice and fails."
        test_recipe:
          setup: ["two ACTIVE programs with identical deal pools and consented contacts; program 1 has a sealed STRATIFIED_BY_SEGMENT frame, program 2 a sealed VALUE_WEIGHTED frame; clock 2026-08-01 so recency is 0.3444 for the April deal and 0.8222 for the June deal"]
