scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: block_rate_draw_then_list_price_overage_on_identical_studies
        grounds:
          - calculations.study_base_price_cents
          - calculations.block_draw_decision
          - entities.ClinicContract.fields.block_remaining_studies
          - entities.Study.fields.price_basis
          - state_machines.Study.billing.UNBILLED_to_POSTED
        distinguishing_aspect: |
          Two byte-identical ULTRASOUND studies on the same clinic are priced
          20000 and 26000 cents respectively, because the first draws the last
          unit of a PREPAID_BLOCK contract and the second, finding
          block_remaining_studies == 0, reverts to the list table. The variant
          is selected on the ClinicContract entity domain (a balance counter),
          not on anything about the study.
        test_recipe:
          setup:
            - "one clinic on a PREPAID_BLOCK contract with exactly 1 study purchased"
            - "one mobile unit with a calibrated ULTRASOUND modality unit and an ULTRASOUND-certified technician"
            - "one route stop at that clinic carrying one appointment with two ULTRASOUND studies"
            - "both studies acquired at the same stop, image-QC ACCEPTED, read and FINALIZED"
            - "one OPEN invoice for the clinic covering 2026-05-01..2026-05-31"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clinics"
              payload: { name: "Northside Vet", address_zone: "Z1" }
              as: PlatformAdmin
              captures: { cl_a: $.data.id }
            - call: "POST /contracts"
              payload: { clinic_id: "${cl_a}", kind: "PREPAID_BLOCK", valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-08-01T00:00:00Z", block_purchased_studies: 1 }
              as: BillingAdmin
              captures: { ct_a: $.data.id }
            - call: "POST /mobile-units"
              payload: { name: "Van 1" }
              as: PlatformAdmin
              captures: { un_1: $.data.id }
            - call: "POST /equipment"
              payload: { modality: "ULTRASOUND", serial_label: "US-1", assigned_unit_id: "${un_1}" }
              as: PlatformAdmin
              captures: { eq_1: $.data.id }
            - call: "POST /equipment/${eq_1}/calibrate"
              payload: { calibration_valid_from: "2026-05-01T00:00:00Z", calibration_valid_until: "2026-05-29T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /technicians"
              payload: { full_name: "Tam Ito", certified_modalities: ["ULTRASOUND"] }
              as: PlatformAdmin
              captures: { tc_1: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Dr Reed", modality_privileges: ["ULTRASOUND"], species_privileges: ["CANINE"], stat_eligible: true }
              as: PlatformAdmin
              captures: { sp_1: $.data.id }
            - call: "POST /routes"
              payload: { mobile_unit_id: "${un_1}", technician_id: "${tc_1}", service_date: "2026-05-04", shift_start_minute: 480, shift_end_minute: 900 }
              as: Scheduler
              captures: { rt_1: $.data.id, rt_v1: $.data.version }
            - call: "POST /routes/${rt_1}/stops"
              payload: { clinic_id: "${cl_a}", planned_arrival_minute: 540, service_minutes: 45, drive_minutes_from_prev: 20, stop_priority: "ROUTINE", expected_route_version: "${rt_v1}" }
              as: Scheduler
              captures: { st_1: $.data.id }
            - call: "POST /referrals"
              payload: { clinic_id: "${cl_a}", patient_name: "Rex", species: "CANINE", study_kind: "MOBILE", requested_modality: "ULTRASOUND", priority: "ROUTINE", clinical_history: "abdominal pain 2 days" }
              as: ClinicUser
              as_user_id: "${cl_a}"
              captures: { rf_1: $.data.id }
            - call: "POST /referrals/${rf_1}/accept"
              payload: {}
              as: Scheduler
            - call: "POST /appointments"
              payload: { referral_id: "${rf_1}", route_stop_id: "${st_1}" }
              as: Scheduler
              captures: { ap_1: $.data.id }
            - call: "POST /studies"
              payload: { appointment_id: "${ap_1}", modality: "ULTRASOUND", body_region: "ABDOMEN" }
              as: ClinicUser
              as_user_id: "${cl_a}"
              captures: { sx: $.data.id }
            - call: "POST /studies"
              payload: { appointment_id: "${ap_1}", modality: "ULTRASOUND", body_region: "THORAX" }
              as: ClinicUser
              as_user_id: "${cl_a}"
              captures: { sy: $.data.id }
            - call: "POST /routes/${rt_1}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /routes/${rt_1}/dispatch"
              payload: {}
              as: FieldTech
              as_user_id: "${tc_1}"
            - call: "POST /route-stops/${st_1}/arrive"
              payload: {}
              as: FieldTech
              as_user_id: "${tc_1}"
            - call: "POST /studies/${sx}/acquire"
              payload: { equipment_id: "${eq_1}", technician_id: "${tc_1}", image_count: 10 }
              as: FieldTech
              as_user_id: "${tc_1}"
            - call: "POST /studies/${sy}/acquire"
              payload: { equipment_id: "${eq_1}", technician_id: "${tc_1}", image_count: 8 }
              as: FieldTech
              as_user_id: "${tc_1}"
            - call: "POST /studies/${sx}/qc"
              payload: { qc_result: "ACCEPTED" }
              as: FieldTech
              as_user_id: "${tc_1}"
            - call: "POST /studies/${sy}/qc"
              payload: { qc_result: "ACCEPTED" }
              as: FieldTech
              as_user_id: "${tc_1}"
            - call: "GET /studies/${sx}"
              payload: {}
              as: Scheduler
              captures: { sx_v: $.data.version }
            - call: "POST /read-assignments"
              payload: { study_id: "${sx}", specialist_id: "${sp_1}", expected_study_version: "${sx_v}" }
              as: Scheduler
              captures: { ag_x: $.data.id }
            - call: "POST /read-assignments/${ag_x}/accept"
              payload: {}
              as: Specialist
              as_user_id: "${sp_1}"
            - call: "POST /reports"
              payload: { study_id: "${sx}", kind: "FINAL", findings: "no abnormality detected" }
              as: Specialist
              as_user_id: "${sp_1}"
              captures: { rp_x: $.data.id }
            - call: "POST /reports/${rp_x}/publish"
              payload: {}
              as: Specialist
              as_user_id: "${sp_1}"
            - call: "GET /studies/${sy}"
              payload: {}
              as: Scheduler
              captures: { sy_v: $.data.version }
            - call: "POST /read-assignments"
              payload: { study_id: "${sy}", specialist_id: "${sp_1}", expected_study_version: "${sy_v}" }
              as: Scheduler
              captures: { ag_y: $.data.id }
            - call: "POST /read-assignments/${ag_y}/accept"
              payload: {}
              as: Specialist
              as_user_id: "${sp_1}"
            - call: "POST /reports"
              payload: { study_id: "${sy}", kind: "FINAL", findings: "mild pleural effusion" }
              as: Specialist
              as_user_id: "${sp_1}"
              captures: { rp_y: $.data.id }
            - call: "POST /reports/${rp_y}/publish"
              payload: {}
              as: Specialist
              as_user_id: "${sp_1}"
            - call: "POST /invoices"
              payload: { clinic_id: "${cl_a}", period_start: "2026-05-01", period_end: "2026-05-31" }
              as: BillingAdmin
              captures: { iv_1: $.data.id, iv_v1: $.data.version }
          trigger:
            - call: "POST /invoices/${iv_1}/post-study"
              payload: { study_id: "${sx}", expected_invoice_version: "${iv_v1}" }
              as: BillingAdmin
              captures: { iv_v2: $.data.version }
            - call: "POST /invoices/${iv_1}/post-study"
              payload: { study_id: "${sy}", expected_invoice_version: "${iv_v2}" }
              as: BillingAdmin
          assert:
            - "Study.${sx}.price_basis == BLOCK_RATE"
            - "Study.${sx}.base_price_cents == 20000"
            - "Study.${sx}.trip_share_cents == 6250"
            - "Study.${sx}.admin_fee_cents == 788"
            - "Study.${sx}.total_price_cents == 27038"
            - "Study.${sy}.price_basis == LIST_PRICE"
            - "Study.${sy}.base_price_cents == 26000"
            - "Study.${sy}.trip_share_cents == 6250"
            - "Study.${sy}.admin_fee_cents == 968"
            - "Study.${sy}.total_price_cents == 33218"
            - "Invoice.${iv_1}.total_cents == 60256"
            - "ClinicContract.${ct_a}.block_consumed_studies == 1"
            - "ClinicContract.${ct_a}.block_remaining_studies == 0"
            - "GET /block-ledger-entries?contract_id=${ct_a} returns exactly 1 row with delta_studies == -1 and balance_after_studies == 0"

      - name: route_planned_versus_actual_occupied_minutes_diverge
        grounds:
          - calculations.route_occupied_minutes
          - entities.Route.fields.planned_occupied_minutes
          - entities.Route.fields.actual_occupied_minutes
          - entities.RouteStop.fields.actual_service_minutes
          - state_machines.RouteStop.ARRIVED_to_SERVICED
        distinguishing_aspect: |
          On the Route entity domain — a completely different subject from the
          study-pricing dual variant — the same single stop yields
          planned_occupied_minutes == 65 (20 drive + 45 reserved service) and
          actual_occupied_minutes == 40 (20 drive + 20 observed service), because
          the PLANNED variant reads the scheduler's reservation and the ACTUAL
          variant reads arrived_at -> departed_at.
        test_recipe:
          setup:
            - "one IN_SERVICE mobile unit with an ACTIVE technician"
            - "one route on 2026-05-04 with shift window 480..900 carrying exactly one stop reserved for 45 service minutes after 20 drive minutes"
            - "the route dispatched, the stop arrived at 09:00Z and departed at 09:20Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clinics"
              payload: { name: "Eastgate Animal Hospital", address_zone: "Z2" }
              as: PlatformAdmin
              captures: { cl_b: $.data.id }
            - call: "POST /mobile-units"
              payload: { name: "Van 2" }
              as: PlatformAdmin
              captures: { un_2: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Bo Chen", certified_modalities: ["RADIOGRAPHY"] }
              as: PlatformAdmin
              captures: { tc_2: $.data.id }
            - call: "POST /routes"
              payload: { mobile_unit_id: "${un_2}", technician_id: "${tc_2}", service_date: "2026-05-04", shift_start_minute: 480, shift_end_minute: 900 }
              as: Scheduler
              captures: { rt_2: $.data.id, rt2_v1: $.data.version }
            - call: "POST /routes/${rt_2}/stops"
              payload: { clinic_id: "${cl_b}", planned_arrival_minute: 540, service_minutes: 45, drive_minutes_from_prev: 20, stop_priority: "ROUTINE", expected_route_version: "${rt2_v1}" }
              as: Scheduler
              captures: { st_2: $.data.id }
            - call: "POST /routes/${rt_2}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /routes/${rt_2}/dispatch"
              payload: {}
              as: FieldTech
              as_user_id: "${tc_2}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /route-stops/${st_2}/arrive"
              payload: {}
              as: FieldTech
              as_user_id: "${tc_2}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:20:00Z" }
              as: PlatformAdmin
            - call: "POST /route-stops/${st_2}/depart"
              payload: {}
              as: FieldTech
              as_user_id: "${tc_2}"
          trigger:
            - call: "GET /routes/${rt_2}"
              payload: {}
              as: Scheduler
              captures: { planned_min: $.data.planned_occupied_minutes, actual_min: $.data.actual_occupied_minutes, slack_min: $.data.slack_minutes }
          assert:
            - "${planned_min} == 65"
            - "${actual_min} == 40"
            - "${slack_min} == 355"
            - "Route.${rt_2}.stop_count == 1"
            - "RouteStop.${st_2}.actual_service_minutes == 20"
            - "RouteStop.${st_2}.status == SERVICED"

  - rule_id: combinatorial_formula
    instances:
      - name: trip_fee_floor_plus_remainder_across_three_studies
        grounds:
          - calculations.study_trip_share_cents
          - calculations.study_admin_fee_cents
          - entities.RouteStop.fields.trip_fee_cents
          - conservation_invariants.INV_MONEY_INVOICE_TOTAL
        distinguishing_aspect: |
          Mode (b) — nested rounding where the ORDER matters. 12500 cents split
          three ways must be floored first (4166) and the two leftover cents
          handed out in created_at ASC order, giving [4167, 4167, 4166] whose
          sum is exactly 12500. Rounding each share independently
          (round_half_up(12500/3) = 4167 three times) would allocate 12501 and
          break the trip-fee conservation by one cent.
        test_recipe:
          setup:
            - "one clinic on a PER_STUDY_LIST contract"
            - "one route stop carrying one appointment with three ULTRASOUND studies, all acquired on the same calibrated unit"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clinics"
              payload: { name: "Riverbend Vet", address_zone: "Z3" }
              as: PlatformAdmin
              captures: { cl_c: $.data.id }
            - call: "POST /contracts"
              payload: { clinic_id: "${cl_c}", kind: "PER_STUDY_LIST", valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /mobile-units"
              payload: { name: "Van 3" }
              as: PlatformAdmin
              captures: { un_3: $.data.id }
            - call: "POST /equipment"
              payload: { modality: "ULTRASOUND", serial_label: "US-3", assigned_unit_id: "${un_3}" }
              as: PlatformAdmin
              captures: { eq_3: $.data.id }
            - call: "POST /equipment/${eq_3}/calibrate"
              payload: { calibration_valid_from: "2026-05-01T00:00:00Z", calibration_valid_until: "2026-05-29T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /technicians"
              payload: { full_name: "Ana Ruiz", certified_modalities: ["ULTRASOUND"] }
              as: PlatformAdmin
              captures: { tc_3: $.data.id }
            - call: "POST /routes"
              payload: { mobile_unit_id: "${un_3}", technician_id: "${tc_3}", service_date: "2026-05-04", shift_start_minute: 480, shift_end_minute: 900 }
              as: Scheduler
              captures: { rt_3: $.data.id, rt3_v1: $.data.version }
            - call: "POST /routes/${rt_3}/stops"
              payload: { clinic_id: "${cl_c}", planned_arrival_minute: 540, service_minutes: 45, drive_minutes_from_prev: 20, stop_priority: "ROUTINE", expected_route_version: "${rt3_v1}" }
              as: Scheduler
              captures: { st_3: $.data.id }
            - call: "POST /referrals"
              payload: { clinic_id: "${cl_c}", patient_name: "Bella", species: "CANINE", study_kind: "MOBILE", requested_modality: "ULTRASOUND", priority: "ROUTINE", clinical_history: "screening" }
              as: ClinicUser
              as_user_id: "${cl_c}"
              captures: { rf_3: $.data.id }
            - call: "POST /referrals/${rf_3}/accept"
              payload: {}
              as: Scheduler
            - call: "POST /appointments"
              payload: { referral_id: "${rf_3}", route_stop_id: "${st_3}" }
              as: Scheduler
              captures: { ap_3: $.data.id }
            - call: "POST /studies"
              payload: { appointment_id: "${ap_3}", modality: "ULTRASOUND", body_region: "ABDOMEN" }
              as: ClinicUser
              as_user_id: "${cl_c}"
              captures: { s1: $.data.id }
            - call: "POST /studies"
              payload: { appointment_id: "${ap_3}", modality: "ULTRASOUND", body_region: "THORAX" }
              as: ClinicUser
              as_user_id: "${cl_c}"
              captures: { s2: $.data.id }
            - call: "POST /studies"
              payload: { appointment_id: "${ap_3}", modality: "ULTRASOUND", body_region: "PELVIS" }
              as: ClinicUser
              as_user_id: "${cl_c}"
              captures: { s3: $.data.id }
            - call: "POST /routes/${rt_3}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /routes/${rt_3}/dispatch"
              payload: {}
              as: FieldTech
              as_user_id: "${tc_3}"
            - call: "POST /route-stops/${st_3}/arrive"
              payload: {}
              as: FieldTech
              as_user_id: "${tc_3}"
            - call: "POST /studies/${s1}/acquire"
              payload: { equipment_id: "${eq_3}", technician_id: "${tc_3}", image_count: 6 }
              as: FieldTech
              as_user_id: "${tc_3}"
            - call: "POST /studies/${s2}/acquire"
              payload: { equipment_id: "${eq_3}", technician_id: "${tc_3}", image_count: 6 }
              as: FieldTech
              as_user_id: "${tc_3}"
            - call: "POST /studies/${s3}/acquire"
              payload: { equipment_id: "${eq_3}", technician_id: "${tc_3}", image_count: 6 }
              as: FieldTech
              as_user_id: "${tc_3}"
          trigger:
            - call: "GET /studies/${s1}/pricing"
              payload: {}
              as: BillingAdmin
              captures: { t1: $.data.trip_share_cents, tot1: $.data.total_price_cents, n1: $.data.billable_studies_at_stop }
            - call: "GET /studies/${s2}/pricing"
              payload: {}
              as: BillingAdmin
              captures: { t2: $.data.trip_share_cents, tot2: $.data.total_price_cents }
            - call: "GET /studies/${s3}/pricing"
              payload: {}
              as: BillingAdmin
              captures: { t3: $.data.trip_share_cents, tot3: $.data.total_price_cents, adm3: $.data.admin_fee_cents }
          assert:
            - "${n1} == 3"
            - "${t1} == 4167"
            - "${t2} == 4167"
            - "${t3} == 4166"
            - "${t1} + ${t2} + ${t3} == 12500"
            - "${tot1} == 31072"
            - "${tot2} == 31072"
            - "${tot3} == 31071"
            - "${adm3} == 905"
            - "Equipment.${eq_3}.usage_count_since_qc == 3"

      - name: route_capacity_two_independent_ceilings_with_buffer_allowance
        grounds:
          - calculations.route_capacity_feasibility
          - entities.MobileUnit.fields.max_stops
          - entities.MobileUnit.fields.max_shift_minutes
          - validations[priority=44]
        distinguishing_aspect: |
          Mode (a) — a formula with five inputs and non-linear interaction:
          occupied + proposed_load + ROUTE_STOP_BUFFER_MINUTES * (new_n - 1)
          compared against min(shift window, unit.max_shift_minutes), with a
          conditional branch on stop_priority. A different mode from the
          trip-fee rounding instance: nothing here is a rounding-order question,
          and the buffer term makes the ceiling depend on the stop COUNT even
          when only the MINUTES ceiling is the one that fails.
        test_recipe:
          setup:
            - "a mobile unit whose max_stops is 5 but whose max_shift_minutes is only 120"
            - "a route on that unit with a 420-minute shift window, so the unit cap and not the window is the binding budget"
            - "two stops already inserted, together consuming 110 occupied minutes plus a 10-minute buffer = exactly 120"
            - "three distinct clinics so the same-service-date rule never fires"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clinics"
              payload: { name: "Clinic B1", address_zone: "Z4" }
              as: PlatformAdmin
              captures: { b1: $.data.id }
            - call: "POST /clinics"
              payload: { name: "Clinic B2", address_zone: "Z4" }
              as: PlatformAdmin
              captures: { b2: $.data.id }
            - call: "POST /clinics"
              payload: { name: "Clinic B3", address_zone: "Z4" }
              as: PlatformAdmin
              captures: { b3: $.data.id }
            - call: "POST /mobile-units"
              payload: { name: "Van Short-Shift", max_stops: 5, max_shift_minutes: 120 }
              as: PlatformAdmin
              captures: { un_s: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Kit Marsh", certified_modalities: ["RADIOGRAPHY"] }
              as: PlatformAdmin
              captures: { tc_s: $.data.id }
            - call: "POST /routes"
              payload: { mobile_unit_id: "${un_s}", technician_id: "${tc_s}", service_date: "2026-05-04", shift_start_minute: 480, shift_end_minute: 900 }
              as: Scheduler
              captures: { rt_s: $.data.id, rts_v1: $.data.version }
            - call: "POST /routes/${rt_s}/stops"
              payload: { clinic_id: "${b1}", planned_arrival_minute: 480, service_minutes: 45, drive_minutes_from_prev: 10, stop_priority: "ROUTINE", expected_route_version: "${rts_v1}" }
              as: Scheduler
            - call: "GET /routes/${rt_s}"
              payload: {}
              as: Scheduler
              captures: { rts_v2: $.data.version }
            - call: "POST /routes/${rt_s}/stops"
              payload: { clinic_id: "${b2}", planned_arrival_minute: 540, service_minutes: 45, drive_minutes_from_prev: 10, stop_priority: "ROUTINE", expected_route_version: "${rts_v2}" }
              as: Scheduler
            - call: "GET /routes/${rt_s}"
              payload: {}
              as: Scheduler
              captures: { rts_v3: $.data.version, occ_after_two: $.data.planned_occupied_minutes }
          trigger:
            - call: "POST /routes/${rt_s}/stops"
              payload: { clinic_id: "${b3}", planned_arrival_minute: 700, service_minutes: 15, drive_minutes_from_prev: 5, stop_priority: "ROUTINE", expected_route_version: "${rts_v3}" }
              as: Scheduler
              captures: { err_id: $.data.error_id }
          assert:
            - "${occ_after_two} == 110"
            - "${err_id} == ERR_ROUTE_SHIFT_MINUTES_EXCEEDED"
            - "HTTP status == 409"
            - "Route.${rt_s}.stop_count == 2"
            - "Route.${rt_s}.planned_occupied_minutes == 110"
            - "Route.${rt_s}.slack_minutes == 310"
            - "the second stop was accepted at exactly 110 + 10 buffer = 120 == min(420, 120), proving the ceiling is <= and not <"

      - name: admin_fee_evaluated_after_stat_surcharge_not_before
        grounds:
          - calculations.study_total_price_cents
          - calculations.study_admin_fee_cents
          - calculations.study_stat_surcharge_cents
          - state_machines.Study.tat.ACCRUING_to_BREACHED
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency whose evaluation order the
          scaffold pins. The admin fee is a percentage of a subtotal that itself
          contains the STAT surcharge, so escalating one already-acquired study
          moves admin_fee_cents from 1155 to 1290 and total_price_cents from
          39655 to 44290. Computing the admin fee before step 4 would leave it
          at 1155 and the total at 44155.
        test_recipe:
          setup:
            - "one clinic on a PER_STUDY_LIST contract"
            - "one ULTRASOUND study, sole occupant of its route stop, acquired and still ROUTINE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clinics"
              payload: { name: "Hillcrest Vet", address_zone: "Z5" }
              as: PlatformAdmin
              captures: { cl_h: $.data.id }
            - call: "POST /contracts"
