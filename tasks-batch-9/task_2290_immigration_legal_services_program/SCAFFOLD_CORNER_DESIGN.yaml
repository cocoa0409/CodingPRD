          - calculations.invariant_active_caseload_conservation
          - calculations.invariant_grant_allocation_conservation
        distinguishing_aspect: "ERR_INVARIANT_VIOLATION (500) is a post-write assertion, so the falsifiable claim is the negative one: the heaviest available cascade — a recognition LAPSE that suspends two accreditations, two representatives, two assignments and pushes two matters to COVERAGE_GAP, followed by a grant report over those matters — must return 200 with all three conservation sums balanced, and no request in this file may ever produce a 5xx. The paired positive claim is atomicity: if the assertion did fail the transaction rolls back whole, so a 500 must never leave a half-applied cascade."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z. Cycle FY26-H2 with total_case_slots 10 and reserved_detained_slots 2. Recognition REC-2026-001 with all four forums."
            - "Nadia Rey and Omar Vale are ACCREDITED_REPs with APPROVED accreditations. Each holds an ACTIVE LEAD assignment on one of two accepted non-detained U_VISA matters, each supervised by Ada Ortiz's ACTIVE SUPERVISOR assignment on that matter."
            - "4.00 DIRECT hours are logged on each lead assignment, so the grant rollup has non-zero money to allocate."
          setup_api_calls:
            - call: "the full 20-call chain of the no_bulk_endpoint_exists_so_multi_row_effects_arrive_only_through_cascades instance, up to and including both ACTIVE LEAD assignments"
              payload: {}
              as: ProgramDirector
              captures: { rec_id: "$.data.id", nadia_id: "$.data.id", omar_id: "$.data.id", nadia_acc_id: "$.data.id", omar_acc_id: "$.data.id", nadia_lead_id: "$.data.id", omar_lead_id: "$.data.id", m2_id: "$.data[0].id" }
            - call: "POST /case-assignments/${nadia_lead_id}/log-hours"
              payload: { hours: 4.0, hours_kind: "DIRECT", service_date: "2026-08-03" }
              as: CaseRepresentative
              as_user_id: "${nadia_id}"
            - call: "POST /case-assignments/${omar_lead_id}/log-hours"
              payload: { hours: 4.0, hours_kind: "DIRECT", service_date: "2026-08-03" }
              as: CaseRepresentative
              as_user_id: "${omar_id}"
            - call: "GET /capacity-cycles/${cycle_id}"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /organization-recognitions/${rec_id}/transition"
              payload: { action: "LAPSE" }
              as: ProgramDirector
            - call: "GET /capacity-cycles/${cycle_id}"
              payload: {}
              as: ProgramDirector
            - call: "GET /representatives/${nadia_id}"
              payload: {}
              as: ProgramDirector
            - call: "POST /grant-reports"
              payload: { cycle_id: "${cycle_id}", grant_code: "EOIR-LOP-2026", period_start_date: "2026-07-01", period_end_date: "2026-12-31", disclosure_level: "AGGREGATE_ONLY" }
              as: GrantAnalyst
              as_user_id: "${atty_b_id}"
              captures: { rpt_id: "$.data.id" }
            - call: "POST /grant-reports/${rpt_id}/transition"
              payload: { action: "GENERATE" }
              as: GrantAnalyst
              as_user_id: "${atty_b_id}"
          assert:
            - "trigger 1: HTTP status == 200 — NOT 500; every one of the four cascade hops applied and the three post-write assertions passed"
            - "trigger 2: general_slots_consumed == 2 and available_slot_count == 6 — total_case_slots 10 minus reserved 2 minus general 2; slot conservation held even though both matters moved to COVERAGE_GAP, because COVERAGE_GAP is not WITHDRAWN_FROM and still holds its slot"
            - "trigger 3: Representative.${nadia_id}.active_case_load == 0 and authorization_status == 'AUTHORIZATION_SUSPENDED' — the caseload counter was decremented exactly once by the SUSPEND hop, matching the count of assignments that left ACTIVE"
            - "trigger 5: HTTP status == 200 with reported_matter_count == 2, base_reimbursable_cents == 100000 (4.00 hours times 12500 per matter, per-matter rounded then summed), surcharge_pct == 0.00 because 100000 is below SURCHARGE_TIER_1_MIN 500000, total_reimbursable_cents == 100000 and allocated_total_cents == 100000"
            - "trigger 5: the per-matter allocation array sums to exactly 100000 with remainder 0 — allocation conservation held, so no 500 was raised"
            - "no trigger anywhere in this file returns HTTP 5xx; ERR_INVARIANT_VIOLATION is reachable only from an implementation bug, and its contract is that the transaction is rolled back with no partial cascade persisted"

  # ===========================================================================
  # §1.7 breadth. role_model is segregation_of_duties, so the guide's
  # "Segregation of duties" row is the governing pattern; neither
  # hierarchical_override nor approval_chain is declared, and the instances below
  # assert the ABSENCE of a hierarchical override explicitly (ProgramDirector is
  # denied SupervisingAttorney's exclusive CERTIFY).
  - section: rbac
    instances:

      - name: program_director_exclusive_operations_are_denied_to_all_five_other_roles
        claim_type: Other roles' exclusive operations denied
        grounds:
          - roles[ProgramDirector].exclusive_operations
          - errors[ERR_ROLE_NOT_PERMITTED]
          - validations[priority 2]
        distinguishing_aspect: "Fourteen exclusive operations, probed one per denied role so that no role's denial can be explained by a different rule: the clock, the recognition roster, the representative roster, the accreditation lifecycle, the capacity levers and set-facility each reject a different caller with ERR_ROLE_NOT_PERMITTED (403) BEFORE any path id is resolved — proven by sending a bogus path id in the same request and still getting 403 rather than 404."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z. TEMPLATE A gives a cycle, three representatives, Rosa Mena, an accepted matter and an ACTIVE LEAD. A recognition REC-2026-001 exists."
          setup_api_calls:
            - call: "TEMPLATE A"
              payload: {}
              as: ProgramDirector
            - call: "POST /organization-recognitions"
              payload: { recognition_number: "REC-2026-001", effective_date: "2026-01-01", expiry_date: "2030-01-01", authorized_forums: ["USCIS", "ASYLUM_OFFICE", "EOIR_IMMIGRATION_COURT", "BIA"] }
              as: ProgramDirector
              captures: { rec_id: "$.data.id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00.000Z" }
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "POST /capacity-cycles"
              payload: { cycle_label: "FY27-H1", period_start_date: "2027-01-01", period_end_date: "2027-06-30", total_case_slots: 10, reserved_detained_slots: 2 }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /capacity-cycles/00000000-0000-4000-8000-0000000000cc/posture-override"
              payload: { posture_override_until_utc: "2026-09-01T00:00:00.000Z", override_reason_code: "DIRECTOR_DISCRETION" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /capacity-cycles/${cycle_id}/checkpoint"
              payload: {}
              as: GrantAnalyst
              as_user_id: "${atty_b_id}"
            - call: "POST /detention-facilities"
              payload: { facility_code: "PHX-ICE", facility_name: "Phoenix ICE", jurisdiction_code: "AZ-ELO", expedited_filing_days: 21, visit_lead_time_hours: 48, max_daily_visit_slots: 4, access_credential_required: true }
              as: ClientPortalUser
              as_user_id: "${client_id}"
            - call: "POST /representatives"
              payload: { full_name: "Mallory Doe", rep_type: "STAFF_ATTORNEY", languages: ["en"], max_case_load: 25, max_supervisees: 10, weekly_capacity_hours: 40, bar_number: "BAR-6006" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "PATCH /representatives/${atty_a_id}"
              payload: { max_case_load: 99 }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /organization-recognitions/${rec_id}/transition"
              payload: { action: "LAPSE" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /case-matters/${matter_id}/set-facility"
              payload: { detained: false }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /case-matters/00000000-0000-4000-8000-0000000000dd/withdraw-representation"
              payload: { withdrawal_reason_code: "CLIENT_REQUEST" }
              as: GrantAnalyst
              as_user_id: "${atty_b_id}"
          assert:
            - "trigger 1: HTTP status == 403 and error_id == 'ERR_ROLE_NOT_PERMITTED'; the logical clock is still 2026-08-03T09:00:00.000Z"
            - "trigger 2: HTTP status == 403 and error_id == 'ERR_ROLE_NOT_PERMITTED'; GET /capacity-cycles still returns exactly 1 row"
            - "trigger 3: HTTP status == 403 and error_id == 'ERR_ROLE_NOT_PERMITTED' and NOT 404 ERR_CYCLE_NOT_FOUND, even though the cycle id is fabricated — priority 2 is evaluated before any path id lookup"
            - "trigger 4: HTTP status == 403 and error_id == 'ERR_ROLE_NOT_PERMITTED'; ProgramCapacityCycle.${cycle_id}.checkpoint_epoch is still 0"
            - "trigger 5: HTTP status == 403 and error_id == 'ERR_ROLE_NOT_PERMITTED'; GET /detention-facilities returns 0 rows"
            - "trigger 6: HTTP status == 403 and error_id == 'ERR_ROLE_NOT_PERMITTED'; GET /representatives still returns exactly 3 rows — a SupervisingAttorney cannot enlarge the roster it supervises"
            - "trigger 7: HTTP status == 403 and error_id == 'ERR_ROLE_NOT_PERMITTED'; Representative.${atty_a_id}.max_case_load is still 25 — a representative cannot raise its OWN cap, so identity ownership grants nothing here"
            - "trigger 8: HTTP status == 403 and error_id == 'ERR_ROLE_NOT_PERMITTED'; OrganizationRecognition.${rec_id}.status is still 'ACTIVE' and suspended_accreditation_count == 0 — no cascade hop fired"
            - "trigger 9: HTTP status == 403 and error_id == 'ERR_ROLE_NOT_PERMITTED' — set-facility is director/supervisor only, so the assigned lead is denied on its own matter and the denial is a role denial, not ERR_ACTOR_NOT_ON_CASE"
            - "trigger 10: HTTP status == 403 and error_id == 'ERR_ROLE_NOT_PERMITTED' and NOT 404 — the second proof that the role gate precedes existence resolution"

      - name: intake_screener_and_supervising_attorney_exclusive_operations_are_mutually_denied
        claim_type: Other roles' exclusive operations denied
        grounds:
          - roles[IntakeScreener].exclusive_operations
          - roles[SupervisingAttorney].exclusive_operations
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "Two roles' exclusive lists probed against each other and against the ProgramDirector, which is the sharpest available proof that this scaffold has NO hierarchical override: the director may create an intake (a shared op) but may NOT run /screen, and may NOT certify a declaration or continue a hearing, both of which are SupervisingAttorney-exclusive. Conversely the SupervisingAttorney cannot open a screening, so neither role dominates the other."
        test_recipe:
          setup:
            - "TEMPLATE B gives a matter with an IN_REVIEW Spanish declaration ${decl_id} prepared by Ada Ortiz, plus a SCHEDULED MASTER_CALENDAR_HEARING event for the matter."
          setup_api_calls:
            - call: "TEMPLATE B, stopping just before the CERTIFY step so ${decl_id} is left at IN_REVIEW"
              payload: {}
              as: ProgramDirector
            - call: "POST /calendar-events"
              payload: { matter_id: "${matter_id}", event_type: "MASTER_CALENDAR_HEARING", starts_at_utc: "2026-08-20T14:00:00.000Z", ends_at_utc: "2026-08-20T15:00:00.000Z", location_code: "ELP-EOIR", assigned_representative_id: "${atty_a_id}" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
              captures: { evt_id: "$.data.id" }
          trigger:
            - call: "POST /intake-screenings"
              payload: { client_id: "${client_id}", cycle_id: "${cycle_id}", case_type: "ADJUSTMENT_OF_STATUS", detained: false }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /intake-screenings"
              payload: { client_id: "${client_id}", cycle_id: "${cycle_id}", case_type: "ADJUSTMENT_OF_STATUS", detained: false }
              as: ProgramDirector
              captures: { intake2_id: "$.data.id" }
            - call: "POST /intake-screenings/${intake2_id}/screen"
              payload: {}
              as: ProgramDirector
            - call: "POST /intake-screenings/${intake2_id}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "POST /declarations/${decl_id}/transition"
              payload: { action: "CERTIFY", reviewer_assignment_id: "${cocounsel_id}" }
              as: ProgramDirector
            - call: "POST /declarations/${decl_id}/transition"
              payload: { action: "CERTIFY", reviewer_assignment_id: "${cocounsel_id}" }
              as: CaseRepresentative
              as_user_id: "${atty_b_id}"
            - call: "POST /calendar-events/${evt_id}/transition"
              payload: { action: "CONTINUE", successor_starts_at_utc: "2026-09-20T14:00:00.000Z", successor_ends_at_utc: "2026-09-20T15:00:00.000Z" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
          assert:
            - "trigger 1: HTTP status == 403 and error_id == 'ERR_ROLE_NOT_PERMITTED' — POST /intake-screenings is IntakeScreener-exclusive and shared only with ProgramDirector"
            - "trigger 2: HTTP status == 201 — the ProgramDirector IS on that endpoint's role list, so the denial in trigger 1 is specific to the SupervisingAttorney and not a property of the endpoint"
            - "trigger 3: HTTP status == 403 and error_id == 'ERR_ROLE_NOT_PERMITTED' — /screen is IntakeScreener-exclusive with NO director share, so the highest-privilege role in the system is denied a subordinate's exclusive op: there is no hierarchical override"
            - "trigger 4: HTTP status == 200 and IntakeScreening.${intake2_id}.status == 'SCREENED' with screened_by_representative_id == '${screener_id}'"
            - "trigger 5: HTTP status == 403 and error_id == 'ERR_ROLE_NOT_PERMITTED' — CERTIFY is SupervisingAttorney-exclusive; the director is denied a second time"
            - "trigger 5: Declaration.${decl_id}.status is still 'IN_REVIEW' and reviewer_assignment_id is still null"
            - "trigger 6: HTTP status == 403 and error_id == 'ERR_ROLE_NOT_PERMITTED' — the SAME human (${atty_b_id}) who would be allowed to certify as SupervisingAttorney is denied when presenting as CaseRepresentative, so the gate keys on the declared role header and not on the identity's capabilities"
            - "trigger 7: HTTP status == 403 and error_id == 'ERR_ROLE_NOT_PERMITTED' — CONTINUE is SupervisingAttorney-exclusive even though CaseRepresentative may run every other CalendarEvent transition on the same row; GET /calendar-events?continued_from_event_id=${evt_id} returns 0 rows"

      - name: client_portal_user_acknowledge_is_exclusive_and_row_scoped_to_its_own_client_id
        claim_type: Segregation of duties
        grounds:
          - roles[ClientPortalUser].exclusive_operations
          - errors[ERR_ACTOR_NOT_ON_CASE]
          - validations[priority 3]
          - state_machines.InformedDecision
        distinguishing_aspect: "ACKNOWLEDGE is the client's only write and it is structurally segregated: the representative documents, the client acknowledges, and no representative role may do both halves. On top of the role gate there is a row gate — a DIFFERENT client's portal user is refused with ERR_ACTOR_NOT_ON_CASE (403, priority 3) rather than a 404, so the existence of another household's decision is never disclosed."
        test_recipe:
          setup:
            - "TEMPLATE B gives a matter for Rosa Mena with a CERTIFIED Spanish declaration and Ada Ortiz as ACTIVE LEAD. A PENDING FILE_AFFIRMATIVE InformedDecision is recorded by Ada."
            - "A second unrelated client Bea Rios is registered so a foreign portal identity exists."
          setup_api_calls:
            - call: "TEMPLATE B"
              payload: {}
              as: ProgramDirector
            - call: "POST /clients"
              payload: { full_name: "Bea Rios", preferred_language_code: "es", country_of_birth_code: "GT", date_of_birth: "1988-02-19", household_size: 1, annual_household_income_cents: 1000000 }
              as: IntakeScreener
              as_user_id: "${screener_id}"
              captures: { bea_id: "$.data.id" }
            - call: "GET /case-matters/${matter_id}"
              payload: {}
              as: ProgramDirector
              captures: { mv_1: "$.data.version" }
            - call: "POST /informed-decisions"
              payload: { matter_id: "${matter_id}", counseled_by_assignment_id: "${lead_id}", decision_type: "FILE_AFFIRMATIVE", risks_disclosed: ["DENIAL_RISK"], alternatives_disclosed: ["WITHDRAW"], counseling_language_code: "es", expected_matter_version: "${mv_1}" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
              captures: { dec_id: "$.data.id" }
          trigger:
            - call: "POST /informed-decisions/${dec_id}/transition"
              payload: { action: "ACKNOWLEDGE" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /informed-decisions/${dec_id}/transition"
              payload: { action: "ACKNOWLEDGE" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /informed-decisions/${dec_id}/transition"
              payload: { action: "ACKNOWLEDGE" }
              as: ProgramDirector
            - call: "POST /informed-decisions/${dec_id}/transition"
              payload: { action: "ACKNOWLEDGE" }
              as: ClientPortalUser
              as_user_id: "${bea_id}"
            - call: "GET /informed-decisions"
              payload: { matter_id: "${matter_id}" }
              as: ClientPortalUser
              as_user_id: "${bea_id}"
            - call: "POST /informed-decisions/${dec_id}/transition"
              payload: { action: "ACKNOWLEDGE" }
              as: ClientPortalUser
              as_user_id: "${client_id}"
            - call: "POST /informed-decisions/${dec_id}/transition"
              payload: { action: "ACKNOWLEDGE" }
              as: ClientPortalUser
              as_user_id: "${client_id}"
          assert:
            - "triggers 1, 2 and 3: each HTTP status == 403 with error_id == 'ERR_ROLE_NOT_PERMITTED' — the counselling representative, its supervisor and the program director are all barred from acknowledging on the client's behalf; InformedDecision.${dec_id}.status stays 'PENDING' and acknowledged_at_utc stays null"
            - "trigger 4: HTTP status == 403 and error_id == 'ERR_ACTOR_NOT_ON_CASE' — the role gate at priority 2 passes because ClientPortalUser owns this operation, so the row gate at priority 3 is what fires; NOT 404, so the decision's existence is not disclosed"
            - "trigger 5: HTTP status == 200 with exactly 0 rows — the same partition applied to reads; Bea Rios sees an empty list rather than a 403 or a 404"
            - "trigger 6: HTTP status == 200, status == 'DOCUMENTED' and acknowledged_at_utc == '2026-08-03T09:00:00.000Z' — the owning client succeeds at the identical request"
            - "trigger 7: HTTP status == 409 and error_id == 'ERR_INVALID_STATE_TRANSITION' — the second acknowledgement is not idempotent, and the failure is a state failure rather than a permission failure"

      - name: grant_analyst_is_read_only_on_case_substance_and_case_representative_is_row_scoped
        claim_type: Shared operations
        grounds:
          - roles[GrantAnalyst]
          - roles[CaseRepresentative]
          - errors[ERR_ACTOR_NOT_ON_CASE]
          - errors[ERR_REPRESENTATIVE_INACTIVE]
          - validations[priority 3]
          - validations[priority 4]
        distinguishing_aspect: "GrantAnalyst has an empty exclusive list and may only touch grant reports, so every case-substance write it attempts is 403 while its reads over the same collections are 200 — the read/write split inside one role. CaseRepresentative is the mirror image: it may write everywhere on matters it is assigned to, is refused with ERR_ACTOR_NOT_ON_CASE on a matter where it holds no row, and — once its own Representative row is SEPARATED — is refused with ERR_REPRESENTATIVE_INACTIVE on the matter it IS assigned to, proving priority 3 and priority 4 are distinct gates in that order."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z. TEMPLATE A gives matter M1 for Rosa Mena with Ada Ortiz as ACTIVE LEAD. A second matter M2 is accepted for Bea Rios with Ben Cole as its ACTIVE LEAD; Ada holds NO assignment on M2."
          setup_api_calls:
            - call: "TEMPLATE A"
              payload: {}
              as: ProgramDirector
            - call: "POST /clients then ACCEPT_INTAKE(client=Bea Rios, case_type=U_VISA, detained=false) giving matter M2, then create and ACTIVATE a LEAD assignment for Ben Cole on M2 with a freshly read expected_matter_version"
              payload: {}
              as: ProgramDirector
              captures: { m2_id: "$.data[0].id", m2_lead_id: "$.data.id" }
            - call: "GET /case-matters/${m2_id}"
              payload: {}
              as: ProgramDirector
              captures: { m2v: "$.data.version" }
          trigger:
            - call: "POST /evidence-items"
              payload: { matter_id: "${matter_id}", item_type: "IDENTITY_DOCUMENT", tier: "REQUIRED", weight_points: 20, requires_translation: false }
              as: GrantAnalyst
              as_user_id: "${atty_b_id}"
            - call: "POST /case-assignments"
              payload: { matter_id: "${matter_id}", representative_id: "${atty_b_id}", role_on_case: "CO_COUNSEL", expected_matter_version: "${matter_v1}" }
              as: GrantAnalyst
              as_user_id: "${atty_b_id}"
            - call: "GET /case-matters"
              payload: {}
              as: GrantAnalyst
              as_user_id: "${atty_b_id}"
            - call: "GET /case-assignments"
              payload: { matter_id: "${matter_id}" }
              as: GrantAnalyst
              as_user_id: "${atty_b_id}"
            - call: "POST /evidence-items"
              payload: { matter_id: "${m2_id}", item_type: "IDENTITY_DOCUMENT", tier: "REQUIRED", weight_points: 20, requires_translation: false }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /evidence-items"
              payload: { matter_id: "${matter_id}", item_type: "IDENTITY_DOCUMENT", tier: "REQUIRED", weight_points: 20, requires_translation: false }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
              captures: { ev_id: "$.data.id" }
            - call: "PATCH /representatives/${atty_a_id}"
              payload: { status: "SEPARATED" }
              as: ProgramDirector
            - call: "POST /evidence-items"
              payload: { matter_id: "${matter_id}", item_type: "MEDICAL_RECORD", tier: "SUPPORTING", weight_points: 5, requires_translation: false }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /evidence-items"
              payload: { matter_id: "${m2_id}", item_type: "MEDICAL_RECORD", tier: "SUPPORTING", weight_points: 5, requires_translation: false }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
          assert:
            - "trigger 1: HTTP status == 403 and error_id == 'ERR_ROLE_NOT_PERMITTED' — evidence is not on the GrantAnalyst's endpoint list at all"
            - "trigger 2: HTTP status == 403 and error_id == 'ERR_ROLE_NOT_PERMITTED', not ERR_STALE_MATTER_VERSION — the role gate at priority 2 precedes the OCC gate at priority 38, so a GrantAnalyst never learns whether its version token was current"
            - "trigger 3: HTTP status == 200 with exactly 2 rows and meta.total_count == 2 — unfiltered, because the GrantAnalyst is an opaque identity with no row scope"
            - "trigger 4: HTTP status == 200 with exactly 1 row — the read half of the same collection whose write half was refused in trigger 1"
            - "trigger 5: HTTP status == 403 and error_id == 'ERR_ACTOR_NOT_ON_CASE' — Ada Ortiz holds no assignment of any status on M2, and the refusal is NOT 404, so M2's existence is not disclosed"
            - "trigger 6: HTTP status == 201 — the identical request on the matter she IS assigned to succeeds, so trigger 5 was row scoping and not a role denial"
            - "trigger 8: HTTP status == 403 and error_id == 'ERR_REPRESENTATIVE_INACTIVE' — on the very matter where her ACTIVE LEAD assignment still exists, so priority 4 fires only after priority 3 has passed"
            - "trigger 9: HTTP status == 403 and error_id == 'ERR_ACTOR_NOT_ON_CASE' — with BOTH the row gate and the inactive gate failing, priority 3 wins over priority 4"

      - name: segregation_of_duties_screener_cannot_decide_and_nobody_approves_its_own_accreditation
        claim_type: Segregation of duties
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - endpoints[POST /intake-screenings/{intake_id}/decide]
          - endpoints[POST /accreditations/{accreditation_id}/transition]
          - state_machines.Accreditation
        distinguishing_aspect: "Two of the three structural pairs, both keyed on X-User-ID rather than on role (the third, preparer-versus-certifier, is exercised by cascading_validation_assignment_activity_is_checked_before_segregation_of_duties). The screen/decide pair is per-ROW, not per-user: the same screener may decide a DIFFERENT intake it did not screen, which is what separates a segregation rule from a blanket role denial. The accreditation pair fires even when the self-approver would ALSO fail the actor-credential clause, because §1.3 lists the no-self-approval precondition before the STAFF_ATTORNEY clause."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z. TEMPLATE A gives cycle FY26-H2, Ada Ortiz, Ben Cole and Sara Ruiz. Recognition REC-2026-001 with all four forums exists."
            - "Nadia Rey is an ACCREDITED_REP with a PENDING FULL accreditation over all four forums."
            - "Two clients, Rosa Mena and Bea Rios, each have a SCREENED U_VISA intake; Sara Ruiz screened Rosa's and Ada Ortiz screened Bea's."
          setup_api_calls:
