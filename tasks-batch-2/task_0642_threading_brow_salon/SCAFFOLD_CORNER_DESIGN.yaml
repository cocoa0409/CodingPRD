- section: state_machines
  instances:
  - name: error_visit_estimate_vs_final_divergence_stub
    claim_type: Side Effect Execution
    grounds:
    - calculations.finalize_settlement
    excluded_because:
      difficulty_instance: dual_variant_calc / visit_estimate_vs_final_settlement_diverge
      rationale: Estimate-vs-final divergence and the package-credit settlement are asserted by the named §1.8 instance.
  - name: error_no_show_suspend_threshold_stub
    claim_type: Precondition Enforcement
    grounds:
    - calculations.no_show_strike_score
    excluded_because:
      difficulty_instance: boundary_precision_check / suspend_at_exactly_two_strikes
      rationale: The exactly-2-strikes SUSPENDED boundary is covered by the named §1.8 instance.
  - name: error_void_compensation_invariants_stub
    claim_type: Compensation
    grounds:
    - state_machines.ServiceVisit.IN_SERVICE_to_VOIDED
    excluded_because:
      difficulty_instance: compensating_invariant / void_conserves_retail_stock
      rationale: Void compensation of retail stock and loyalty is the subject of the named §1.8 compensating-invariant instances.
  - name: error_seat_chair_not_open_stub
    claim_type: Precondition Enforcement
    grounds:
    - errors[ERR_CHAIR_NOT_OPEN]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / seat_requires_chair_open_pair_visit_chair
      rationale: ERR_CHAIR_NOT_OPEN at seating onto an OUT_OF_SERVICE chair is asserted by the named §1.8 instance.
  - name: error_technician_not_available_stub
    claim_type: Precondition Enforcement
    grounds:
    - errors[ERR_TECHNICIAN_NOT_AVAILABLE]
    excluded_because:
      difficulty_instance: resource_temporal_overlap / technician_double_booking_busy_block
      rationale: ERR_TECHNICIAN_NOT_AVAILABLE for a BUSY technician is asserted by the named §1.8 instance.
