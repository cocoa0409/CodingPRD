              captures: { ob_post: $.data.outstanding_balance_cents, tpp_post: $.data.total_principal_paid_cents }
            - call: "POST /disaster-relief/payments/${pay_id}/reverse"
              payload: {}
              as: ServicingAgent
            - call: "GET /disaster-relief/loans/${loan_id}"
              payload: {}
              as: ServicingAgent
              captures: { ob_rev: $.data.outstanding_balance_cents, tpp_rev: $.data.total_principal_paid_cents, tip_rev: $.data.total_interest_paid_cents, acc_rev: $.data.accrued_interest_balance_cents, lad_rev: $.data.last_accrual_date }
          assert:
            - "payment allocation: fee_portion_cents == 0, interest_portion_cents == 28896 (round_half_up(11250000 * 0.03125 * 30 / 365) computed once before allocation), principal_portion_cents == 71104 (remainder)"
            - "invariant holds after payment: outstanding 11178896 + total_principal_paid 71104 == 11250000 == pre-payment outstanding 11250000 + pre-payment total_principal_paid 0"
            - "after reverse: outstanding_balance_cents == 11250000, total_principal_paid_cents == 0, total_interest_paid_cents == 0, accrued_interest_balance_cents == 28896, last_accrual_date back to 2026-11-01"
            - "Payment.${pay_id}.status == REVERSED and loan.lifecycle_status stays ACTIVE"

