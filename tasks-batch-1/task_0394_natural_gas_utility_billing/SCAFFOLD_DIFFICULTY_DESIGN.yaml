              as: BillingAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "O2" }
              as: CustomerService
              captures: { acct_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingAdmin
              captures: { acct_v0: $.data.version }
            - call: "POST /accounts/${acct_id}/budget-plans"
              payload: { anchor_month: "2026-01", projected_annual_cents: 96000, expected_account_version: "${acct_v0}" }
              as: BillingAdmin
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingAdmin
              captures: { acct_v1: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/budget-plans"
              payload: { anchor_month: "2026-06", projected_annual_cents: 96000, expected_account_version: "${acct_v1}" }
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_BUDGET_PERIOD_OVERLAP"
            - "response.status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deposit_collect_then_refund_conserves_held_cents
        grounds:
          - state_machines.Deposit.REQUIRED_to_HELD
          - state_machines.Deposit.HELD_to_REFUNDED
          - entities.Account.fields.deposit_held_cents
        distinguishing_aspect: |
          Conserved quantity = Account.deposit_held_cents (money). Collecting a 15000c deposit raises it
          to 15000; refunding (after enough on-time payments) returns it to exactly 0 — the forward
          (collect) and compensating (refund) actions leave deposit_held_cents unchanged at 0.
        test_recipe:
          setup:
            - "RES account with consecutive_ontime_payments >= 12 (so refund is permitted); a NEW_SERVICE deposit of 15000c collected then refunded."
            - "Note: 12 on-time bill payments are produced by issuing and paying 12 monthly bills on time."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-05T00:00:00.000Z", heating_season_active: false }
              as: BillingAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RES-CI", customer_class: "RESIDENTIAL", fixed_customer_charge_cents: 1000, distribution_rate_cents_per_therm: 0, btu_factor: 1.0, minimum_bill_cents: 0 }
              as: BillingAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /pga-schedules"
              payload: { effective_month: "2026-01", customer_class: "RESIDENTIAL", commodity_rate_cents_per_therm: 0, supplier_refund_cents_per_therm: 0 }
              as: BillingAdmin
            - call: "POST /accounts"
