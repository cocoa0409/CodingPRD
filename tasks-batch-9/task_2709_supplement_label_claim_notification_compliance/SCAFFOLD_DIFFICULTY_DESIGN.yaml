# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2709 — Supplement Label Claim & Notification Compliance
# Nine §0.5 Difficulty Rules x 2 differentiated instances = 18 instances.
# Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.7; every ${var} is bound by an
# earlier captures: block; every asserted number is pre-computed from the §1.3 formulas.
# The logical clock starts at its mandatory default 2026-08-01T00:00:00Z.

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: substantiation_score_screening_vs_final_peer_exclusion
        grounds:
          - calculations.substantiation_strength_score
          - entities.SubstantiationDossier.fields.screening_score
          - entities.SubstantiationDossier.fields.final_score
          - state_machines.SubstantiationDossier.DRAFT_to_UNDER_REVIEW
          - validations[priority=36]
        distinguishing_aspect: |
          Divergence is produced by the INPUT-SET difference between the two variants of
          substantiation_strength_score: screening_provisional keeps a non-peer-reviewed
          RCT and uses SUBJECT_DENOM 50, while competent_reliable_final drops that study
          entirely and uses SUBJECT_DENOM 100 — the same three studies score 70.80
          (above the 65.00 acceptance threshold) provisionally and 28.80 (below it) finally.
        test_recipe:
          setup:
            - "One BOTANICAL ingredient determined GRANDFATHERED, one DRAFT product, one DRAFT claim authored by u_ras_01."
            - "One DRAFT dossier on that claim holding exactly three studies: a 60-subject peer-reviewed dose-matched RCT, a 200-subject peer-reviewed non-dose-matched observational study, and a 300-subject NON-peer-reviewed dose-matched RCT."
            - "Logical clock still at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /supplement-compliance/ingredients"
              payload: { ingredient_name: "Turmeric Extract 95%", ingredient_class: "BOTANICAL", pre_dshea_marketed: true, chemical_alteration: false, daily_intake_mg: 1000 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { ing_id: $.data.id }
            - call: "POST /supplement-compliance/ingredients/${ing_id}/eligibility-determination"
              payload: {}
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { ing_status: $.data.eligibility_status }
            - call: "POST /supplement-compliance/products"
              payload: { brand_name: "VitaTrust", product_name: "Turmeric 500", net_quantity_g: 90, servings_per_container: 45 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { prod_id: $.data.id }
            - call: "POST /supplement-compliance/claims"
              payload: { product_id: "${prod_id}", ingredient_id: "${ing_id}", claim_text: "Helps maintain joint flexibility", claim_type: "STRUCTURE_FUNCTION" }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { claim_id: $.data.id }
            - call: "GET /supplement-compliance/claims/${claim_id}"
              payload: {}
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { claim_v: $.data.version }
            - call: "POST /supplement-compliance/substantiation-dossiers"
              payload: { claim_id: "${claim_id}", expected_claim_version: "${claim_v}", dossier_summary: "Joint flexibility substantiation, three human studies" }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { dossier_id: $.data.id }
            - call: "POST /supplement-compliance/substantiation-dossiers/${dossier_id}/evidence"
              payload: { study_type: "RCT_HUMAN", subject_count: 60, dose_match: true, peer_reviewed: true, citation: "Okafor 2023 J Joint Health 12:44" }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "POST /supplement-compliance/substantiation-dossiers/${dossier_id}/evidence"
              payload: { study_type: "OBSERVATIONAL_HUMAN", subject_count: 200, dose_match: false, peer_reviewed: true, citation: "Lindqvist 2022 Nutr Obs 8:210" }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "POST /supplement-compliance/substantiation-dossiers/${dossier_id}/evidence"
              payload: { study_type: "RCT_HUMAN", subject_count: 300, dose_match: true, peer_reviewed: false, citation: "Internal Trial TX-9 (unpublished)" }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { screening_after_three: $.data.screening_score }
          trigger:
            - call: "POST /supplement-compliance/claims/${claim_id}/submit-for-review"
              payload: {}
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "POST /supplement-compliance/substantiation-dossiers/${dossier_id}/review"
              payload: { decision: "ACCEPT" }
              as: SubstantiationReviewer
              as_user_id: "u_rev_01"
              captures: { err: $.data.error_id }
          assert:
            - "after the third evidence append: SubstantiationDossier.${dossier_id}.study_count == 3 and screening_score == 70.80 (30.00 + 10.80 + 30.00)"
            - "after submit-for-review: SubstantiationDossier.${dossier_id}.final_score == 28.80 (18.00 + 10.80 + 0, the non-peer-reviewed RCT excluded) and dossier_status == UNDER_REVIEW"
            - "the ACCEPT review returns HTTP 409 with error_id == ERR_SUBSTANTIATION_INSUFFICIENT because 28.80 < 65.00, while the provisional 70.80 would have cleared it"
            - "SubstantiationDossier.${dossier_id}.dossier_status is still UNDER_REVIEW and reviewed_by_user_id is still null"
            - "StructureFunctionClaim.${claim_id}.substantiation_status == UNDER_SUBSTANTIATION_REVIEW"
      - name: claim_notification_due_date_launch_basis_vs_activation_basis
        grounds:
          - calculations.claim_notification_due_date
          - entities.StructureFunctionClaim.fields.notification_due_basis
          - entities.StructureFunctionClaim.fields.notification_due_date
          - state_machines.StructureFunctionClaim.NOT_DUE_to_DUE
        distinguishing_aspect: |
          Divergence is produced by the ANCHOR-DATE difference between the two variants of
          claim_notification_due_date on ONE product: the claim approved before marketing
          anchors its 30-day window on marketing_start_date 2026-09-10 (due 2026-10-10,
          PRODUCT_LAUNCH_BASIS) while the claim approved on 2026-10-05 after the product is
          already MARKETED anchors on its own approved_at (due 2026-11-04,
          CLAIM_ACTIVATION_BASIS) — a 25-day spread from the same 30-day rule.
        test_recipe:
          setup:
            - "One GRANDFATHERED VITAMIN ingredient (rdi_mg 90) on a DRAFT product with one ACTIVE line, panel LOCKED so the product is LABEL_LOCKED."
            - "Claim A approved by u_cao_01 on 2026-09-01 while the product is LABEL_LOCKED; product then marketed with marketing_start_date 2026-09-10."
            - "Claim B created and approved on 2026-10-05 while the product is already MARKETED."
