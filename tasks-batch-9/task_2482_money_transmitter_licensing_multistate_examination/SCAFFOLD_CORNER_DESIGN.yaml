              as_user_id: "${ca_id}"
            - call: "GET /state-licenses?application_id=${app_id}"
              as: LicensingManager
              captures: { lic_ca_id: "$.data[0].id" }
            - call: "POST /state-licenses/${lic_ca_id}/bond"
              payload: { amount_cents: 5000000, bond_issuer: "Atlas Surety", effective_date: "2026-08-01T00:00:00Z" }
              as: LicensingManager
              captures: { v_stale: "$.data.version" }
            - call: "PATCH /state-licenses/${lic_ca_id}/obligations"
              payload: { delta_cents: 250000, memo: "Intraday float" }
              as: LicensingManager
            - call: "PATCH /state-licenses/${lic_ca_id}/obligations"
              payload: { delta_cents: -250000, memo: "Float settled" }
