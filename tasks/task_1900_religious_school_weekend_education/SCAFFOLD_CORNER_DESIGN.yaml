  - section: validations
    instances:
      - name: role_denial_precedes_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=4]", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "A Parent calling an admin-only endpoint on a NON-EXISTENT year id still gets 403 ERR_UNAUTHORIZED_ROLE — authorization (priority 2) outranks existence (priority 4)."
        test_recipe:
          setup: ["one family exists (to supply a Parent identity)"]
          setup_api_calls:
            - { call: "POST /school/families", payload: { family_name: "Fam P", primary_email: "p@x.org", membership_status: "MEMBER" }, as: SchoolAdmin, captures: { fam: $.data.id } }
          trigger:
            - { call: "POST /school/school-years/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/open", payload: {}, as: Parent, as_user_id: "${fam}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHORIZED_ROLE (HTTP 403), NOT ERR_NOT_FOUND"

      - name: award_params_required_when_approved
