              as_user_id: "${d_fc_b}"
          assert:
            - "hop 1: CoordinationRequest.${d_req_ab}.status == DECLINED and responded_at is non-null"
            - "hop 2: Product.${d_prod}.status == DRAFT (reverted because of the decline)"
            - "hop 3: CoordinationRequest.${d_req_ac}.status == CANCELLED and responded_at is null (cancelled by the product's reversion — nobody ever responded to it)"

      - name: supersede_cascade_withdraws_prior_records
        grounds:
          - state_machines.Product.ISSUED_to_SUPERSEDED
          - state_machines.Product.DRAFT_to_ISSUED
