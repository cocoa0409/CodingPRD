            - { call: "POST /wetland-permits/applications/${app_id}/screening", payload: { action: "BEGIN" }, as: Reviewer, as_user_id: "rev-1" }
          trigger:
            - { call: "POST /wetland-permits/applications/${app_id}/render-decision", payload: { outcome: "ISSUE" }, as: Reviewer, as_user_id: "rev-2", captures: { err: "$.data.error_id" } }
