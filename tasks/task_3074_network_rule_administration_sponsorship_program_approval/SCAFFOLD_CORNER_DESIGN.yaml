  - section: errors
    instances:
      - name: error_catalog_triggerability
        claim_type: violation_to_error
        grounds: [errors]
        distinguishing_aspect: "Every error id in the catalog is exercised by at least one §1.8 or §1.9 instance; this index row records the audit mapping."
        excluded_because:
          difficulty_instance: multiple
          rationale: "ERR_VALIDATION (member_creation_invalid_enum_rejected, merchant_xor_boarding_constraint, bin_prefix_format_constraint), ERR_INVALID_REQUEST (member_creation_missing_required_field), ERR_NOT_FOUND (not_found_on_unknown_member_id, bin_approve_existence_vs_program_gate), ERR_INVALID_STATE (member_approve_from_active_rejected, member_terminal_lockdown, dispute_decide_idempotency_second_decide_rejected, violation_assess_state_vs_sod), ERR_FORBIDDEN (role_forbidden_endpoint_denied), ERR_UNAUTHENTICATED (auth_missing_headers_rejected), ERR_IDENTITY_MISMATCH (identity_mismatch_on_violation_appeal), ERR_SEGREGATION_OF_DUTIES (violation_assess_state_vs_sod), ERR_WINDOW_EXPIRED (dispute_window_inclusive_vs_exclusive_boundary, cycle_evaluation_before_period_end_rejected, commit_outside_window_time_rejected), ERR_CERTIFICATION_STALE (certification_stale_version_blocks_approval), ERR_PROGRAM_NOT_ENABLED (bin_approve_existence_vs_program_gate, program_production_enablement_after_edit_blocked), ERR_RATE_NOT_FOUND (quote_rate_not_found_when_no_tier_matches), ERR_SETTLEMENT_INVALID (settlement_fiscal_self_transfer_rejected), ERR_RULE_NOT_EFFECTIVE (cite_violation_on_non_effective_rule_rejected), ERR_SPONSOR_INACTIVE (participant_approval_gated_on_sponsor_member_state), ERR_WINDOW_NOT_OPEN (settlement_single_open_window_cardinality), ERR_DRAFT_LINES_REMAIN (settlement_reconcile_blocked_by_single_draft_line), ERR_MERCHANT_NOT_ACTIVE (fraud_confirm_gated_on_merchant_state), ERR_STALE_VERSION (occ_stale_rule_supersede_rejected, occ_program_approve_stale_version), ERR_DUPLICATE (duplicate_rule_registration_rejected)."

  - section: rbac
    instances:
      - name: pricing_analyst_cannot_publish_rules
        claim_type: role_exclusive_denial
        grounds: [roles.PricingAnalyst, roles.RulesAdministrator]
        distinguishing_aspect: "PricingAnalyst attempting RulesAdministrator's exclusive rule-publish is denied ERR_FORBIDDEN; the rule stays DRAFT."
        test_recipe:
          setup: ["Rule R in DRAFT"]
          setup_api_calls:
            - call: "POST /network/rules"
              payload:
                rule_code: "R-R1"
                title: "T"
                body: "b"
                region_scope: "GLOBAL"
                effective_from: "2026-09-01T00:00:00Z"
                fine_schedule: [ { min_amount_minor: 1, max_amount_minor: ~, fine_cents: 100 } ]
              as: RulesAdministrator
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /network/rules/${r1}/publish"
              payload: {}
              as: PricingAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN (403)"
            - "NetworkRule.${r1}.status == DRAFT"

      - name: member_role_cannot_operate_settlement
        claim_type: role_exclusive_denial
        grounds: [roles.Member, roles.SettlementOperator]
        distinguishing_aspect: "An entity-backed Member calling SettlementOperator's exclusive window-create endpoint is denied ERR_FORBIDDEN."
        test_recipe:
          setup: ["Member M ACTIVE"]
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "B", member_kind: "BOTH", region: "NA" }
              as: NetworkOperator
              captures: { m1: $.data.id }
            - call: "POST /network/members/${m1}/approve"
              payload: {}
              as: NetworkOperator
