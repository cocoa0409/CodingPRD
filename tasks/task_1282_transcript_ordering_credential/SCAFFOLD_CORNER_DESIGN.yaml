scaffold_corner_design:

  # =========================================================================
  # Section 1: Entities
  # =========================================================================
  - section: entities
    instances:
      - name: student_creation_returns_201_with_system_fields
        claim_type: creation
        grounds: [entities.Student, "endpoints[POST /registrar/students]"]
        distinguishing_aspect: "POST with all required fields returns 201, system-minted id/created_at/updated_at/version=1, and honors ferpa_restricted default of false when omitted."
        test_recipe:
          setup: ["Empty DB; clock default 2026-08-01"]
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
          trigger:
            - call: "POST /registrar/students"
              payload:
                student_number: "SB000001"
                full_name: "Sam B"
                date_of_birth: "2000-01-01"
                email: "sam@example.edu"
              as: RegistrarAdmin
              captures: { sid: $.data.id, ferpa: $.data.ferpa_restricted, ver: $.data.version }
          assert:
            - "Response code 201"
            - "Student.${sid}.version == 1"
            - "Student.${sid}.ferpa_restricted == false (default applied)"
            - "Student.${sid}.archived_record_flag == false (default applied)"
            - "Student.${sid}.status == ACTIVE (default applied)"

      - name: student_get_by_id_returns_stored
        claim_type: retrieval
        grounds: [entities.Student, "endpoints[GET /registrar/students/{id}]"]
        distinguishing_aspect: "GET returns the previously-created Student with all input fields preserved."
        test_recipe:
          setup: ["Student exists"]
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/students"
              payload:
                student_number: "SB000002"
                full_name: "Sam C"
                date_of_birth: "2001-02-02"
                email: "samc@example.edu"
              as: RegistrarAdmin
              captures: { sid: $.data.id }
          trigger:
            - call: "GET /registrar/students/${sid}"
              payload: {}
              as: RegistrarAdmin
          assert:
            - "Response code 200"
            - "Response body student_number == SB000002"
            - "Response body full_name == Sam C"

      - name: student_list_pagination_fields_present
        claim_type: listing
        grounds: [entities.Student, "endpoints[GET /registrar/students]", response_envelope.pagination_fields]
        distinguishing_aspect: "GET /students returns an array envelope with limit/offset/total_count/has_more; default limit is 10."
        test_recipe:
          setup: ["Three students exist"]
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/students"
              payload: { student_number: "SB000101", full_name: "A", date_of_birth: "2000-01-01", email: "a@x.edu" }
              as: RegistrarAdmin
            - call: "POST /registrar/students"
              payload: { student_number: "SB000102", full_name: "B", date_of_birth: "2000-01-01", email: "b@x.edu" }
              as: RegistrarAdmin
            - call: "POST /registrar/students"
              payload: { student_number: "SB000103", full_name: "C", date_of_birth: "2000-01-01", email: "c@x.edu" }
              as: RegistrarAdmin
          trigger:
            - call: "GET /registrar/students"
              payload: {}
              as: RegistrarAdmin
          assert:
            - "Envelope contains meta.api_request_id"
            - "Envelope data is array"
            - "Pagination fields limit, offset, total_count, has_more present"
            - "total_count == 3"

      - name: student_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Student, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
          trigger:
            - call: "GET /registrar/students/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RegistrarAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: student_missing_required_field_returns_400
        claim_type: required_fields
        grounds: [entities.Student.fields.student_number, "errors[ERR_INVALID_REQUEST]", "validations[priority=20]"]
        distinguishing_aspect: "POST /students without student_number is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
          trigger:
            - call: "POST /registrar/students"
              payload: { full_name: "NoNum", date_of_birth: "2000-01-01", email: "n@x.edu" }
              as: RegistrarAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: student_record_gpa_computed_ignores_input
        claim_type: computed_fields
        grounds: [entities.StudentRecord.fields.gpa_cents, calculations.gpa_cents_recompute]
        distinguishing_aspect: "gpa_cents is computed server-side from courses; any client-supplied gpa_cents is ignored."
        test_recipe:
          setup: ["Student exists"]
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/students"
              payload: { student_number: "SB000201", full_name: "GPA T", date_of_birth: "2000-01-01", email: "gpa@x.edu" }
              as: RegistrarAdmin
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /registrar/students/${sid}/records"
              payload:
                effective_term: "2026-SPR"
                earned_credits: 6
                courses:
                  - { grade_points: 4.0, credits: 3 }
                  - { grade_points: 3.0, credits: 3 }
              as: RegistrarAdmin
              captures: { gpa: $.data.gpa_cents, rv: $.data.record_version }
          assert:
            # (4.0*3 + 3.0*3) / 6 = 21/6 = 3.5 -> 350 cents
            - "gpa == 350"
            - "rv == 1"

      - name: identity_verification_immutable_no_update_endpoint
        claim_type: immutability
        grounds: [entities.IdentityVerification]
        distinguishing_aspect: "IdentityVerification has common_fields: false (no version, no updated_at); the only mutation paths are the action endpoints confirm/reject and the system EXPIRED transition — no PATCH/PUT exists for it."
        test_recipe:
          setup: ["IdentityVerification exists in PENDING"]
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/students"
              payload: { student_number: "SB000301", full_name: "IV T", date_of_birth: "2000-01-01", email: "iv@x.edu" }
              as: RegistrarAdmin
              captures: { sid: $.data.id }
            - call: "POST /registrar/recipients"
              payload: { kind: "EMAIL_PDF", display_name: "Self", email_address: "iv@x.edu" }
              as: RegistrarAdmin
              captures: { rid: $.data.id }
            - call: "POST /registrar/orders"
              payload: { student_id: "${sid}", order_kind: "OFFICIAL" }
              as: Student
              as_user_id: "${sid}"
              captures: { oid: $.data.id, ov: $.data.version }
            - call: "POST /registrar/orders/${oid}/line-items"
              payload: { recipient_id: "${rid}", delivery_kind: "EMAIL_PDF", quantity: 1, expected_order_version: "${ov}" }
              as: Student
              as_user_id: "${sid}"
            - call: "POST /registrar/identity-verifications"
              payload: { student_id: "${sid}", order_id: "${oid}", method: "SSN_DOB" }
              as: Student
              as_user_id: "${sid}"
              captures: { idv_id: $.data.id }
          trigger:
            - call: "GET /registrar/identity-verifications/${idv_id}"
              payload: {}
              as: RegistrarAdmin
          assert:
            - "Response body has no version field (common_fields: false)"
            - "Response body has no updated_at field"
            - "Response body has verification_token field (server-minted)"

      - name: order_references_student_via_fk
        claim_type: parent_relationships
        grounds: [entities.TranscriptOrder.fields.student_id, "errors[ERR_REFERENCED_NOT_FOUND]"]
        distinguishing_aspect: "POST /orders with a non-existent student_id is rejected with ERR_REFERENCED_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
          trigger:
            - call: "POST /registrar/orders"
              payload: { student_id: "00000000-0000-0000-0000-000000000000", order_kind: "OFFICIAL" }
              as: Student
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_REFERENCED_NOT_FOUND"
            - "HTTP status == 404"

  # =========================================================================
  # Section 2: State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: order_draft_to_submitted_valid_transition
        claim_type: valid_transition
        grounds: [state_machines.TranscriptOrder.DRAFT_to_SUBMITTED]
        distinguishing_aspect: "Clean happy-path submit transitions DRAFT -> SUBMITTED (and on to READY_TO_FULFILL when no holds), sets submitted_at, quoted_fee_cents, and final_fee_cents."
        test_recipe:
          setup:
            - "Student, Recipient, FeeSchedule, IdentityVerification VERIFIED"
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/fee-schedules"
              payload:
                code: "FS-SM1"
                official_base_cents: 1000
                unofficial_base_cents: 500
                paper_surcharge_cents: 200
                pickup_surcharge_cents: 100
                rush_flat_cents: 1500
                rush_multiplier_bp: 15000
                volume_tiers: []
                effective_from: "2026-08-01T00:00:00Z"
                active: true
              as: RegistrarAdmin
            - call: "POST /registrar/students"
              payload: { student_number: "SC000001", full_name: "SM One", date_of_birth: "2000-01-01", email: "sm1@x.edu" }
              as: RegistrarAdmin
              captures: { sid: $.data.id }
            - call: "POST /registrar/recipients"
              payload: { kind: "EMAIL_PDF", display_name: "Self", email_address: "sm1@x.edu" }
              as: RegistrarAdmin
              captures: { rid: $.data.id }
            - call: "POST /registrar/orders"
              payload: { student_id: "${sid}", order_kind: "OFFICIAL" }
              as: Student
              as_user_id: "${sid}"
              captures: { oid: $.data.id, ov0: $.data.version }
            - call: "POST /registrar/orders/${oid}/line-items"
              payload: { recipient_id: "${rid}", delivery_kind: "EMAIL_PDF", quantity: 1, expected_order_version: "${ov0}" }
              as: Student
              as_user_id: "${sid}"
              captures: { ov1: $.data.version }
            - call: "POST /registrar/identity-verifications"
              payload: { student_id: "${sid}", order_id: "${oid}", method: "SSN_DOB" }
              as: Student
              as_user_id: "${sid}"
              captures: { idv: $.data.id, tok: $.data.verification_token }
            - call: "POST /registrar/identity-verifications/${idv}/confirm"
              payload: { verification_token: "${tok}" }
              as: Student
              as_user_id: "${sid}"
          trigger:
            - call: "POST /registrar/orders/${oid}/submit"
              payload: { expected_order_version: "${ov1}" }
              as: Student
              as_user_id: "${sid}"
              captures: { status: $.data.fulfillment_status, submitted: $.data.submitted_at }
          assert:
            - "status == READY_TO_FULFILL (auto-advance, no holds)"
            - "submitted is non-null"
            - "quoted_fee_cents == 1000"
            - "final_fee_cents == 1000"

      - name: order_submit_from_submitted_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.TranscriptOrder, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Submitting an already-SUBMITTED order fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Order o is SUBMITTED (post-submit state)"]
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/fee-schedules"
              payload:
                code: "FS-SM2"
                official_base_cents: 1000
                unofficial_base_cents: 500
                paper_surcharge_cents: 200
                pickup_surcharge_cents: 100
                rush_flat_cents: 1500
                rush_multiplier_bp: 15000
                volume_tiers: []
                effective_from: "2026-08-01T00:00:00Z"
                active: true
              as: RegistrarAdmin
            - call: "POST /registrar/students"
              payload: { student_number: "SC000002", full_name: "SM Two", date_of_birth: "2000-01-01", email: "sm2@x.edu" }
              as: RegistrarAdmin
              captures: { sid: $.data.id }
            - call: "POST /registrar/recipients"
              payload: { kind: "EMAIL_PDF", display_name: "Self", email_address: "sm2@x.edu" }
              as: RegistrarAdmin
              captures: { rid: $.data.id }
            - call: "POST /registrar/orders"
              payload: { student_id: "${sid}", order_kind: "OFFICIAL" }
              as: Student
              as_user_id: "${sid}"
              captures: { oid: $.data.id, ov0: $.data.version }
            - call: "POST /registrar/orders/${oid}/line-items"
              payload: { recipient_id: "${rid}", delivery_kind: "EMAIL_PDF", quantity: 1, expected_order_version: "${ov0}" }
              as: Student
              as_user_id: "${sid}"
              captures: { ov1: $.data.version }
            - call: "POST /registrar/identity-verifications"
              payload: { student_id: "${sid}", order_id: "${oid}", method: "SSN_DOB" }
              as: Student
              as_user_id: "${sid}"
              captures: { idv: $.data.id, tok: $.data.verification_token }
            - call: "POST /registrar/identity-verifications/${idv}/confirm"
              payload: { verification_token: "${tok}" }
              as: Student
              as_user_id: "${sid}"
            - call: "POST /registrar/orders/${oid}/submit"
              payload: { expected_order_version: "${ov1}" }
              as: Student
              as_user_id: "${sid}"
              captures: { ov2: $.data.version }
          trigger:
            - call: "POST /registrar/orders/${oid}/submit"
              payload: { expected_order_version: "${ov2}" }
              as: Student
              as_user_id: "${sid}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: order_terminal_delivered_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.TranscriptOrder]
        distinguishing_aspect: "Once DELIVERED, the order admits only the reissue transition; cancel returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Order DELIVERED"]
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/fee-schedules"
              payload:
                code: "FS-SM3"
                official_base_cents: 1000
                unofficial_base_cents: 500
                paper_surcharge_cents: 200
                pickup_surcharge_cents: 100
                rush_flat_cents: 1500
                rush_multiplier_bp: 15000
                volume_tiers: []
                effective_from: "2026-08-01T00:00:00Z"
                active: true
              as: RegistrarAdmin
            - call: "POST /registrar/students"
              payload: { student_number: "SC000003", full_name: "SM Three", date_of_birth: "2000-01-01", email: "sm3@x.edu" }
              as: RegistrarAdmin
              captures: { sid: $.data.id }
            - call: "POST /registrar/recipients"
              payload: { kind: "EMAIL_PDF", display_name: "Self", email_address: "sm3@x.edu" }
              as: RegistrarAdmin
              captures: { rid: $.data.id }
            - call: "POST /registrar/orders"
              payload: { student_id: "${sid}", order_kind: "OFFICIAL" }
              as: Student
              as_user_id: "${sid}"
              captures: { oid: $.data.id, ov0: $.data.version }
            - call: "POST /registrar/orders/${oid}/line-items"
              payload: { recipient_id: "${rid}", delivery_kind: "EMAIL_PDF", quantity: 1, expected_order_version: "${ov0}" }
              as: Student
              as_user_id: "${sid}"
              captures: { ov1: $.data.version, lid: $.data.id }
            - call: "POST /registrar/identity-verifications"
              payload: { student_id: "${sid}", order_id: "${oid}", method: "SSN_DOB" }
              as: Student
              as_user_id: "${sid}"
              captures: { idv: $.data.id, tok: $.data.verification_token }
            - call: "POST /registrar/identity-verifications/${idv}/confirm"
              payload: { verification_token: "${tok}" }
              as: Student
              as_user_id: "${sid}"
            - call: "POST /registrar/orders/${oid}/submit"
              payload: { expected_order_version: "${ov1}" }
              as: Student
              as_user_id: "${sid}"
            - call: "POST /registrar/payments"
              payload: { order_id: "${oid}", idempotency_key: "pay-sm3" }
              as: Student
              as_user_id: "${sid}"
              captures: { pid: $.data.id }
            - call: "POST /registrar/payments/${pid}/capture"
              payload: {}
              as: RegistrarOperator
            - call: "POST /registrar/line-items/${lid}/dispatch"
              payload: {}
              as: RegistrarOperator
            - call: "POST /registrar/line-items/${lid}/mark-delivered"
              payload: {}
              as: RegistrarOperator
          trigger:
            - call: "POST /registrar/orders/${oid}/cancel"
              payload: { cancelled_reason: "too late" }
              as: Student
              as_user_id: "${sid}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: hold_initial_state_is_active
        claim_type: initial_state
        grounds: [state_machines.Hold]
        distinguishing_aspect: "Newly created Hold has status=ACTIVE, placed_at populated, released_at null."
        test_recipe:
          setup: ["Student exists"]
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/students"
              payload: { student_number: "SC000101", full_name: "H Init", date_of_birth: "2000-01-01", email: "h@x.edu" }
              as: RegistrarAdmin
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /registrar/holds"
              payload: { student_id: "${sid}", hold_type: "LIBRARY", blocking_scope: "OFFICIAL" }
              as: LibraryOffice
              captures: { status: $.data.status, placed: $.data.placed_at, released: $.data.released_at }
          assert:
            - "status == ACTIVE"
            - "placed is non-null"
            - "released is null"

      - name: dispatch_side_effect_flips_order_to_in_transit
        claim_type: side_effect_execution
        grounds: [state_machines.OrderLineItem.QUEUED_to_SENT, state_machines.TranscriptOrder.READY_TO_FULFILL_to_IN_TRANSIT]
        distinguishing_aspect: "First line-item dispatch on a READY_TO_FULFILL order bubbles up: order.fulfillment_status -> IN_TRANSIT."
        test_recipe:
          setup: ["Order READY_TO_FULFILL with payment CAPTURED"]
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/fee-schedules"
              payload:
                code: "FS-SM4"
                official_base_cents: 1000
                unofficial_base_cents: 500
                paper_surcharge_cents: 200
                pickup_surcharge_cents: 100
                rush_flat_cents: 1500
                rush_multiplier_bp: 15000
                volume_tiers: []
                effective_from: "2026-08-01T00:00:00Z"
                active: true
              as: RegistrarAdmin
            - call: "POST /registrar/students"
              payload: { student_number: "SC000202", full_name: "SM Four", date_of_birth: "2000-01-01", email: "sm4@x.edu" }
              as: RegistrarAdmin
              captures: { sid: $.data.id }
            - call: "POST /registrar/recipients"
              payload: { kind: "EMAIL_PDF", display_name: "Self", email_address: "sm4@x.edu" }
              as: RegistrarAdmin
              captures: { rid: $.data.id }
            - call: "POST /registrar/orders"
              payload: { student_id: "${sid}", order_kind: "OFFICIAL" }
              as: Student
              as_user_id: "${sid}"
              captures: { oid: $.data.id, ov0: $.data.version }
            - call: "POST /registrar/orders/${oid}/line-items"
              payload: { recipient_id: "${rid}", delivery_kind: "EMAIL_PDF", quantity: 1, expected_order_version: "${ov0}" }
              as: Student
              as_user_id: "${sid}"
              captures: { ov1: $.data.version, lid: $.data.id }
            - call: "POST /registrar/identity-verifications"
              payload: { student_id: "${sid}", order_id: "${oid}", method: "SSN_DOB" }
              as: Student
              as_user_id: "${sid}"
              captures: { idv: $.data.id, tok: $.data.verification_token }
            - call: "POST /registrar/identity-verifications/${idv}/confirm"
              payload: { verification_token: "${tok}" }
              as: Student
              as_user_id: "${sid}"
            - call: "POST /registrar/orders/${oid}/submit"
              payload: { expected_order_version: "${ov1}" }
              as: Student
              as_user_id: "${sid}"
            - call: "POST /registrar/payments"
              payload: { order_id: "${oid}", idempotency_key: "pay-sm4" }
              as: Student
              as_user_id: "${sid}"
              captures: { pid: $.data.id }
            - call: "POST /registrar/payments/${pid}/capture"
              payload: {}
              as: RegistrarOperator
          trigger:
            - call: "POST /registrar/line-items/${lid}/dispatch"
              payload: {}
              as: RegistrarOperator
          assert:
            - "OrderLineItem.${lid}.line_status == SENT"
            - "TranscriptOrder.${oid}.fulfillment_status == IN_TRANSIT"

      - name: reissue_reject_reverts_order_to_delivered
        claim_type: compensation
        grounds: [state_machines.TranscriptOrder.REISSUE_PENDING_to_DELIVERED, state_machines.ReissueRequest.REQUESTED_to_REJECTED]
        distinguishing_aspect: "Rejecting a ReissueRequest is a compensating action: order.fulfillment_status reverts REISSUE_PENDING -> DELIVERED, ReissueRequest -> REJECTED; no replacement order is created."
        test_recipe:
          setup: ["Order DELIVERED, ReissueRequest REQUESTED, order in REISSUE_PENDING"]
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/fee-schedules"
              payload:
