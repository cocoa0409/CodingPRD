        distinguishing_aspect: "claim_number uniqueness at priority 62 fires before duplicate detection, so a second submission reusing CLM-VAL-10 returns ERR_DUPLICATE_CLAIM_NUMBER (409) rather than being stored as DUPLICATE_REJECTED."
