# =============================================================================
# PRD Benchmark Scaffold: Beauty & Salon Professional Distribution
# =============================================================================

scenario: |
  Beauty & Salon Professional Distribution (SalonCentric): professional-only
  authorization & diversion audit, salon account tier & education credits,
  stylist backbar vs retail pricing, brand exclusivity by territory,
  hazmat (aerosol/flammable) shipping, promotional bundle & sample allocation,
  distributor sales-consultant route, discontinued-line liquidation

domain_name: salon-professional-distribution
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit        # professional-only authorization + diversion audit trail
  secondary_archetype: pricing_engine        # tier / backbar-vs-retail / liquidation / promo pricing
  complexity_layers:
    - optimistic_concurrency                 # OCC on SalonAccount.version, Promotion.version, Order.version
    - cascading_side_effects                 # license expiry -> suspension -> order cancel -> redemption reversal
    - dual_variant_calculation               # provisional-vs-final credit accrual; straight-vs-accelerator commission
    - ops_run_checkpoint                     # POST /api/ops/run-daily-sweep advances the compliance epoch
  entity_topology: flat                      # peer collections under /api, FK-linked
  state_machine_shape: cyclic                # dominant shape; Order adds parallel dims, RoutePlan is compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties          # case filer may not adjudicate; buyer sells, compliance adjudicates
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: SalonAccount
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Salon legal business name" }
      - { name: territory_code, type: string, source: input, description: "Two-letter territory/state code the salon operates in (e.g. CA)" }
      - { name: assigned_consultant_id, type: string, source: input, description: "FK -> SalesConsultant.id; nullable; attributed sales consultant" }
      - { name: status, type: enum, source: system, description: "PENDING_VERIFICATION | ACTIVE | SUSPENDED | DEACTIVATED", default: PENDING_VERIFICATION }
      - { name: tier, type: enum, source: computed, description: "SILVER | GOLD | PLATINUM; derived by evaluate-tier or tier-override", default: SILVER }
      - { name: tier_override_active, type: boolean, source: system, description: "true after a manual tier-override; evaluate-tier must not change tier while true", default: false }
      - { name: education_credit_points, type: integer, source: computed, description: "Ledger balance: sum of signed points over all EducationCreditEntry rows", default: 0 }
      - { name: diversion_strike_points, type: integer, source: computed, description: "Sum of strike_points_awarded over SUBSTANTIATED DiversionCase rows", default: 0 }
      - { name: diversion_risk_score, type: number, source: computed, description: "Decay-weighted diversion risk score, 0..100 (see calculations.diversion_risk_score)", default: 0 }
      - { name: trailing_12m_delivered_volume_cents, type: integer, source: computed, description: "Delivered merchandise volume over trailing 365 days, refreshed by evaluate-tier", default: 0 }
      - { name: suspension_reason, type: enum, source: system, description: "MANUAL | LICENSE_EXPIRED | DIVERSION_STRIKES; null unless SUSPENDED" }

  - name: ProfessionalLicense
    parent: SalonAccount
    common_fields: true
    fields:
      - { name: salon_account_id, type: string, source: system, description: "FK -> SalonAccount.id" }
      - { name: license_number, type: string, source: input, description: "State-issued license number" }
      - { name: issuing_state, type: string, source: input, description: "Two-letter issuing state code" }
      - { name: license_type, type: enum, source: input, description: "COSMETOLOGY | ESTHETICIAN | BARBER | NAIL_TECH | SALON_BUSINESS" }
      - { name: valid_until, type: datetime, source: input, description: "License expiry instant (ISO 8601 UTC); must be after the logical clock at submit" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VERIFIED | REJECTED | EXPIRED", default: SUBMITTED }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who verified or rejected; null until reviewed" }

  - name: Brand
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Brand name; unique across brands" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCONTINUED", default: ACTIVE }
      - { name: discontinued_at, type: datetime, source: system, description: "Logical-clock instant of discontinuation; null while ACTIVE" }

  - name: BrandTerritoryExclusive
    parent: Brand
    common_fields: true
    fields:
      - { name: brand_id, type: string, source: system, description: "FK -> Brand.id" }
      - { name: territory_code, type: string, source: input, description: "Two-letter territory code covered by exclusivity" }
      - { name: effective_from, type: datetime, source: input, description: "Window start, inclusive (half-open semantics)" }
      - { name: effective_to, type: datetime, source: input, description: "Window end, exclusive; must be strictly after effective_from" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: brand_id, type: string, source: input, description: "FK -> Brand.id" }
      - { name: sku, type: string, source: input, description: "SKU; unique across products" }
      - { name: name, type: string, source: input, description: "Product display name" }
      - { name: variant_type, type: enum, source: input, description: "BACKBAR (professional use, not for resale) | RETAIL (for resale to consumers)" }
      - { name: hazmat_class, type: enum, source: input, description: "NONE | AEROSOL | FLAMMABLE_LIQUID" }
      - { name: base_price_cents, type: integer, source: input, description: "List unit price in cents; must be > 0" }
      - { name: weight_grams, type: integer, source: input, description: "Unit weight in grams; must be > 0" }
      - { name: lifecycle_status, type: enum, source: system, description: "ACTIVE | DISCONTINUED | LIQUIDATION | ARCHIVED", default: ACTIVE }
      - { name: discontinued_at, type: datetime, source: system, description: "Instant of discontinuation; null while ACTIVE" }
      - { name: liquidation_started_at, type: datetime, source: system, description: "Instant liquidation began; drives the markdown ladder; null until LIQUIDATION first entered" }

  - name: SalesConsultant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Consultant full name" }
      - { name: territory_codes, type: array, source: input, description: "Non-empty array of two-letter territory codes the consultant covers" }
      - { name: commission_model, type: enum, source: input, description: "STRAIGHT | ACCELERATOR; selects commission variant" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE", default: ACTIVE }
      - { name: commission_accrued_cents, type: integer, source: computed, description: "Lifetime accrued commission in cents", default: 0 }
      - { name: commission_month, type: string, source: system, description: "YYYY-MM of the current accelerator accumulation window; null until first attribution" }
      - { name: commission_month_volume_cents, type: integer, source: computed, description: "Delivered merchandise attributed in commission_month", default: 0 }

  - name: RoutePlan
    parent: null
    common_fields: true
    fields:
      - { name: sales_consultant_id, type: string, source: input, description: "FK -> SalesConsultant.id" }
      - { name: name, type: string, source: input, description: "Route plan name" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | COMPLETED", default: DRAFT }

  - name: RouteStop
    parent: null
    common_fields: true
    fields:
      - { name: route_plan_id, type: string, source: system, description: "FK -> RoutePlan.id" }
      - { name: salon_account_id, type: string, source: input, description: "FK -> SalonAccount.id" }
      - { name: start_at, type: datetime, source: input, description: "Visit window start (ISO 8601 UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Visit window end; must be strictly after start_at" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | NO_SHOW | CANCELLED", default: SCHEDULED }
      - { name: visited_at, type: datetime, source: system, description: "Instant the stop was completed; null until COMPLETED" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: salon_account_id, type: string, source: input, description: "FK -> SalonAccount.id" }
      - { name: fulfillment_status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | FULFILLING | SHIPPED | DELIVERED | CANCELLED | REJECTED", default: DRAFT }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | AUTHORIZED | CAPTURED | VOIDED | REFUNDED", default: UNPAID }
      - { name: merchandise_total_cents, type: integer, source: computed, description: "Sum of line_total_cents over all items", default: 0 }
      - { name: credit_applied_cents, type: integer, source: computed, description: "Education-credit redemption applied, in cents (points x 100)", default: 0 }
      - { name: net_merch_cents, type: integer, source: computed, description: "merchandise_total_cents - credit_applied_cents", default: 0 }
      - { name: shipping_total_cents, type: integer, source: computed, description: "Sum of shipping_charge_cents over non-voided, non-PLANNED-after-void shipments", default: 0 }
      - { name: grand_total_cents, type: integer, source: computed, description: "net_merch_cents + shipping_total_cents", default: 0 }
      - { name: promo_applied_code, type: string, source: system, description: "Code of the promotion redeemed on this order; null if none" }
      - { name: submitted_at, type: datetime, source: system, description: "Instant of submit; null until SUBMITTED" }
      - { name: delivered_at, type: datetime, source: system, description: "Instant the order fully delivered; null until DELIVERED" }

  - name: OrderItem
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: quantity, type: integer, source: input, description: "Units ordered; must be > 0" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Price snapshot per calculations.line_unit_pricing at add time" }
      - { name: line_total_cents, type: integer, source: computed, description: "unit_price_cents x quantity (pinned rounding order)" }
      - { name: is_promotional, type: boolean, source: system, description: "true for zero-priced lines injected by a promotion redemption", default: false }
      - { name: pricing_snapshot, type: string, source: system, description: "Human-readable pricing context, e.g. 'GOLD+BACKBAR' or 'LIQUIDATION_W1'" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id" }
      - { name: method, type: enum, source: input, description: "GROUND | AIR" }
      - { name: items, type: array, source: input, description: "Array of {order_item_id, quantity}; quantities must not exceed remaining unshipped units" }
      - { name: status, type: enum, source: system, description: "PLANNED | LABEL_CREATED | IN_TRANSIT | DELIVERED", default: PLANNED }
      - { name: hazmat_declaration_required, type: boolean, source: computed, description: "true iff any shipped item's product has hazmat_class != NONE" }
      - { name: hazmat_surcharge_cents, type: integer, source: computed, description: "0 if no hazmat; else 2500 + 2 x total hazmat grams", default: 0 }
      - { name: shipping_charge_cents, type: integer, source: computed, description: "method base (GROUND 1200 | AIR 3000) + hazmat_surcharge_cents" }

  - name: Promotion
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Redemption code; unique across promotions" }
      - { name: promo_type, type: enum, source: input, description: "BUNDLE | SAMPLE" }
      - { name: eligible_tiers, type: array, source: input, description: "Non-empty subset of {SILVER, GOLD, PLATINUM}" }
      - { name: starts_at, type: datetime, source: input, description: "Promotion window start, inclusive" }
      - { name: ends_at, type: datetime, source: input, description: "Promotion window end, exclusive; must be strictly after starts_at" }
      - { name: budget_units, type: integer, source: input, description: "Total promotional units funded; must be > 0" }
      - { name: remaining_budget_units, type: integer, source: computed, description: "budget_units minus units on APPLIED redemptions", default: null }
      - { name: per_salon_cap, type: integer, source: input, description: "Max units one salon may redeem on this promotion; must be > 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | PAUSED | ENDED", default: DRAFT }
      - { name: required_product_id, type: string, source: input, description: "FK -> Product.id; BUNDLE only; qualifying product" }
      - { name: required_qty, type: integer, source: input, description: "BUNDLE only; units of required_product_id needed on the order" }
      - { name: free_product_id, type: string, source: input, description: "FK -> Product.id; BUNDLE only; product granted free" }
      - { name: free_qty, type: integer, source: input, description: "BUNDLE only; free units granted per redemption" }
      - { name: sample_product_id, type: string, source: input, description: "FK -> Product.id; SAMPLE only; product granted as sample" }
      - { name: sample_units_per_redemption, type: integer, source: input, description: "SAMPLE only; units granted per redemption" }

  - name: PromotionRedemption
    parent: null
    common_fields: true
    fields:
      - { name: promotion_id, type: string, source: system, description: "FK -> Promotion.id" }
      - { name: order_id, type: string, source: system, description: "FK -> Order.id" }
      - { name: salon_account_id, type: string, source: system, description: "FK -> SalonAccount.id" }
      - { name: units_consumed, type: integer, source: computed, description: "Budget units consumed (free_qty or sample_units_per_redemption)" }
      - { name: status, type: enum, source: system, description: "APPLIED | REVERSED", default: APPLIED }
      - { name: reversal_reason, type: enum, source: system, description: "ORDER_CANCELLED | ORDER_REJECTED | ACCOUNT_SUSPENDED; null while APPLIED" }

  - name: EducationCreditEntry
    parent: null
    common_fields: false
    fields:
      - { name: salon_account_id, type: string, source: system, description: "FK -> SalonAccount.id" }
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; null for EXPIRY entries" }
      - { name: entry_type, type: enum, source: system, description: "PROVISIONAL_ACCRUAL | FINAL_ACCRUAL | REDEMPTION | REVERSAL | EXPIRY" }
      - { name: points, type: integer, source: system, description: "Signed points: positive accrual/reversal-of-redemption, negative redemption/reversal-of-accrual/expiry" }
      - { name: consumed_points, type: integer, source: system, description: "On accrual entries only: points already consumed by redemptions or expiry (FIFO)", default: 0 }
      - { name: earned_at, type: datetime, source: system, description: "Instant the entry was posted (logical clock)" }
      - { name: expires_at, type: datetime, source: system, description: "Accrual entries only: earned_at + 12 calendar months; null on non-accrual entries" }

  - name: DiversionCase
    parent: null
    common_fields: true
    fields:
      - { name: salon_account_id, type: string, source: input, description: "FK -> SalonAccount.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the diverted product" }
      - { name: filed_by_consultant_id, type: string, source: system, description: "FK -> SalesConsultant.id; set when filer role is SalesConsultant, else null" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the filer" }
      - { name: severity, type: enum, source: input, description: "MINOR (1 pt) | MAJOR (2 pts) | SEVERE (3 pts)" }
      - { name: evidence_note, type: string, source: input, description: "Free-text evidence summary" }
      - { name: hold_shipments, type: boolean, source: input, description: "If true, blocks shipment creation for the salon while the case is OPEN or UNDER_REVIEW", default: false }
      - { name: status, type: enum, source: system, description: "OPEN | UNDER_REVIEW | SUBSTANTIATED | DISMISSED", default: OPEN }
      - { name: adjudicated_by_user_id, type: string, source: system, description: "X-User-ID of the adjudicating ComplianceOfficer; null until SUBSTANTIATED or DISMISSED" }
      - { name: strike_points_awarded, type: integer, source: system, description: "Points added to salon.diversion_strike_points on substantiation", default: 0 }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SalonAccount
    initial_state: PENDING_VERIFICATION
    terminal_states: [DEACTIVATED]
    transitions:
      - from: PENDING_VERIFICATION
        to: ACTIVE
        trigger: "system: a ProfessionalLicense of this salon transitions SUBMITTED -> VERIFIED via POST /api/licenses/{id}/verify"
        actor: system
        preconditions:
          - "Salon is PENDING_VERIFICATION"
          - "The verified license has valid_until after the logical clock"
        side_effects:
          - "SalonAccount.status -> ACTIVE"
          - "SalonAccount.version increments by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/salon-accounts/{id}/suspend (ComplianceOfficer) | system: ops sweep expired the salon's last valid VERIFIED license | system: diversion substantiation pushed diversion_strike_points >= 3"
        actor: ComplianceOfficer | system
        preconditions:
          - "Salon is ACTIVE (ERR_INVALID_ACCOUNT_STATE otherwise)"
        side_effects:
          - "suspension_reason set to MANUAL | LICENSE_EXPIRED | DIVERSION_STRIKES"
          - "Every Order of this salon in SUBMITTED or APPROVED -> CANCELLED (see Order machine for per-order compensation); DRAFT carts survive but cannot submit while suspended"
          - "SalonAccount.version increments by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/salon-accounts/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "Salon is SUSPENDED (ERR_INVALID_ACCOUNT_STATE otherwise)"
          - "Salon has at least one VERIFIED ProfessionalLicense with valid_until after the logical clock (ERR_NO_VALID_LICENSE otherwise)"
        side_effects:
          - "suspension_reason cleared to null"
          - "SalonAccount.version increments by 1"
      - from: ACTIVE
        to: DEACTIVATED
        trigger: "POST /api/salon-accounts/{id}/deactivate"
        actor: ComplianceOfficer
        preconditions:
          - "Salon is ACTIVE or SUSPENDED (ERR_INVALID_ACCOUNT_STATE otherwise)"
        side_effects:
          - "Every Order of this salon in SUBMITTED or APPROVED -> CANCELLED (same compensation cascade); DRAFT carts survive"
          - "SalonAccount.version increments by 1"
      - from: SUSPENDED
        to: DEACTIVATED
        trigger: "POST /api/salon-accounts/{id}/deactivate"
        actor: ComplianceOfficer
        preconditions:
          - "Salon is ACTIVE or SUSPENDED"
        side_effects:
          - "Same order-cancellation cascade as ACTIVE -> DEACTIVATED"

  - entity: ProfessionalLicense
    initial_state: SUBMITTED
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /api/licenses/{id}/verify"
        actor: ComplianceOfficer
        preconditions:
          - "License is SUBMITTED (ERR_INVALID_LICENSE_STATE otherwise)"
          - "valid_until is after the logical clock (ERR_LICENSE_DATE_INVALID otherwise)"
        side_effects:
          - "reviewed_by_user_id := caller X-User-ID"
          - "If owning SalonAccount is PENDING_VERIFICATION -> salon transitions to ACTIVE"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/licenses/{id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "License is SUBMITTED (ERR_INVALID_LICENSE_STATE otherwise)"
        side_effects:
          - "reviewed_by_user_id := caller X-User-ID"
      - from: VERIFIED
        to: EXPIRED
        trigger: "system: POST /api/ops/run-daily-sweep finds valid_until before the logical clock"
        actor: system
        preconditions: []
        side_effects:
          - "If no other VERIFIED license of the salon has valid_until after the logical clock AND salon is ACTIVE -> salon transitions ACTIVE -> SUSPENDED with suspension_reason LICENSE_EXPIRED (full suspension cascade fires)"

  - entity: Product
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /api/products/{id}/lifecycle {target_status: DISCONTINUED} | system: brand discontinuation cascade"
        actor: DistributionAdmin | system
        preconditions:
          - "Product is ACTIVE (ERR_INVALID_PRODUCT_STATE otherwise)"
        side_effects:
          - "discontinued_at := logical clock"
          - "Every ACTIVE Promotion referencing this product (as required_product_id, free_product_id, or sample_product_id) -> PAUSED"
      - from: DISCONTINUED
        to: ACTIVE
        trigger: "POST /api/products/{id}/lifecycle {target_status: ACTIVE}"
        actor: DistributionAdmin
        preconditions:
          - "Product is DISCONTINUED; owning Brand must be ACTIVE (ERR_INVALID_PRODUCT_STATE otherwise)"
        side_effects:
          - "discontinued_at cleared to null"
      - from: DISCONTINUED
        to: LIQUIDATION
        trigger: "POST /api/products/{id}/lifecycle {target_status: LIQUIDATION}"
        actor: DistributionAdmin
        preconditions:
          - "Product is DISCONTINUED (ERR_INVALID_PRODUCT_STATE otherwise)"
        side_effects:
          - "liquidation_started_at := logical clock (set once; re-entering LIQUIDATION later does not reset it)"
      - from: LIQUIDATION
        to: DISCONTINUED
        trigger: "POST /api/products/{id}/lifecycle {target_status: DISCONTINUED}"
        actor: DistributionAdmin
        preconditions:
          - "Product is LIQUIDATION (ERR_INVALID_PRODUCT_STATE otherwise)"
        side_effects: []
      - from: LIQUIDATION
        to: ARCHIVED
        trigger: "POST /api/products/{id}/lifecycle {target_status: ARCHIVED}"
        actor: DistributionAdmin
        preconditions:
          - "Product is LIQUIDATION (ERR_INVALID_PRODUCT_STATE otherwise)"
        side_effects: []

  - entity: Brand
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /api/brands/{id}/discontinue"
        actor: DistributionAdmin
        preconditions:
          - "Brand is ACTIVE (ERR_INVALID_PRODUCT_STATE... no: ERR_INVALID_REQUEST if already DISCONTINUED)"
        side_effects:
          - "discontinued_at := logical clock"
          - "Every ACTIVE Product of this brand -> DISCONTINUED (which itself pauses referencing ACTIVE promotions)"

  - entity: Order
    initial_state: DRAFT
    dimension: fulfillment_status
    terminal_states: [CANCELLED, REJECTED, DELIVERED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/orders/{id}/submit"
        actor: SalonBuyer
        preconditions:
          - "Order is DRAFT (ERR_INVALID_ORDER_STATE otherwise)"
          - "Order has at least one non-promotional item (ERR_INVALID_ORDER_STATE otherwise)"
          - "SalonAccount.status == ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
          - "Backbar quota check passes (ERR_BACKBAR_QUOTA_EXCEEDED)"
          - "Territory exclusivity holds for every line's brand (ERR_BRAND_TERRITORY_RESTRICTED)"
          - "credit_applied_cents revalidation passes (ERR_INSUFFICIENT_CREDIT_BALANCE, ERR_CREDIT_REDEMPTION_EXCEEDS_CAP)"
        side_effects:
          - "payment_status UNPAID -> AUTHORIZED"
          - "submitted_at := logical clock"
          - "PROVISIONAL_ACCRUAL education-credit entry posted (calculations.education_credit_accrual, provisional variant)"
          - "Order.version increments by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/orders/{id}/approve"
        actor: DistributionAdmin
        preconditions:
          - "Order is SUBMITTED (ERR_INVALID_ORDER_STATE otherwise)"
          - "SalonAccount.status == ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
        side_effects:
          - "payment_status AUTHORIZED -> CAPTURED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/orders/{id}/reject"
        actor: DistributionAdmin
        preconditions:
          - "Order is SUBMITTED (ERR_INVALID_ORDER_STATE otherwise)"
        side_effects:
          - "payment_status AUTHORIZED -> VOIDED"
          - "APPLIED PromotionRedemption on this order -> REVERSED (reason ORDER_REJECTED); promotion remaining_budget_units restored"
          - "REDEMPTION credit entry reversed via REVERSAL entry (consumed_points unwound on the same accrual entries)"
          - "PROVISIONAL_ACCRUAL reversed via REVERSAL entry"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/orders/{id}/cancel"
        actor: SalonBuyer
        preconditions:
          - "Order is DRAFT or SUBMITTED (ERR_INVALID_ORDER_STATE otherwise)"
        side_effects:
          - "If a REDEMPTION credit entry exists for this order -> REVERSAL entry restores points"
          - "If a PromotionRedemption is APPLIED -> REVERSED (ORDER_CANCELLED or ACCOUNT_SUSPENDED), budget restored"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /api/orders/{id}/cancel | system: salon suspension/deactivation cascade"
        actor: SalonBuyer | system
        preconditions:
          - "Order is DRAFT or SUBMITTED"
        side_effects:
          - "payment_status AUTHORIZED -> VOIDED"
          - "PROVISIONAL_ACCRUAL reversed via REVERSAL entry"
          - "REDEMPTION reversed via REVERSAL entry (consumed_points unwound)"
          - "APPLIED PromotionRedemption -> REVERSED; budget restored"
      - from: APPROVED
        to: CANCELLED
        trigger: "system: salon suspension/deactivation cascade only (buyer cannot cancel after approval)"
        actor: system
        preconditions:
          - "Cascade origin: owning salon entered SUSPENDED or DEACTIVATED"
        side_effects:
          - "payment_status CAPTURED -> REFUNDED"
          - "PROVISIONAL_ACCRUAL reversed; REDEMPTION reversed; APPLIED PromotionRedemption -> REVERSED (ACCOUNT_SUSPENDED); budget restored"
      - from: APPROVED
        to: FULFILLING
        trigger: "system: first Shipment created for this order"
        actor: system
        preconditions: []
        side_effects: []
      - from: FULFILLING
        to: SHIPPED
        trigger: "system: every ordered unit is covered by shipments in IN_TRANSIT or DELIVERED"
        actor: system
        preconditions: []
        side_effects: []
      - from: SHIPPED
        to: DELIVERED
        trigger: "system: every shipment of the order is DELIVERED (fires inside POST /api/shipments/{id}/deliver)"
        actor: system
        preconditions: []
        side_effects:
          - "delivered_at := logical clock"
          - "FINAL_ACCRUAL entry posted with delta = final - provisional (calculations.education_credit_accrual, final variant)"
          - "Consultant commission attributed (calculations.consultant_commission)"
      - from: FULFILLING
        to: DELIVERED
        trigger: "system: single-shipment order fully delivered"
        actor: system
        preconditions: []
        side_effects:
          - "Same side effects as SHIPPED -> DELIVERED"

  - entity: Order
    initial_state: UNPAID
    dimension: payment_status
    terminal_states: [VOIDED, REFUNDED]
    transitions:
      - from: UNPAID
        to: AUTHORIZED
        trigger: "system: order submit"
        actor: system
        preconditions: []
        side_effects: []
      - from: AUTHORIZED
        to: CAPTURED
        trigger: "system: order approve"
        actor: system
        preconditions: []
        side_effects: []
      - from: AUTHORIZED
        to: VOIDED
        trigger: "system: order cancelled or rejected while AUTHORIZED"
        actor: system
        preconditions: []
        side_effects: []
      - from: CAPTURED
        to: REFUNDED
        trigger: "system: order cancelled by salon suspension/deactivation cascade while CAPTURED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Shipment
    initial_state: PLANNED
    terminal_states: [DELIVERED]
    transitions:
      - from: PLANNED
        to: LABEL_CREATED
        trigger: "POST /api/shipments/{id}/create-label"
        actor: WarehouseOperator
        preconditions:
          - "Shipment is PLANNED (ERR_INVALID_SHIPMENT_STATE otherwise)"
        side_effects: []
      - from: LABEL_CREATED
        to: PLANNED
        trigger: "POST /api/shipments/{id}/void-label"
        actor: WarehouseOperator
        preconditions:
          - "Shipment is LABEL_CREATED (ERR_INVALID_SHIPMENT_STATE otherwise)"
        side_effects:
          - "This shipment's shipping_charge_cents removed from Order.shipping_total_cents; grand_total_cents recomputed"
      - from: LABEL_CREATED
        to: IN_TRANSIT
        trigger: "POST /api/shipments/{id}/ship"
        actor: WarehouseOperator
        preconditions:
          - "Shipment is LABEL_CREATED (ERR_INVALID_SHIPMENT_STATE otherwise)"
        side_effects:
          - "If all ordered units are now covered by IN_TRANSIT/DELIVERED shipments -> Order FULFILLING -> SHIPPED"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /api/shipments/{id}/deliver"
        actor: WarehouseOperator
        preconditions:
          - "Shipment is IN_TRANSIT (ERR_INVALID_SHIPMENT_STATE otherwise)"
        side_effects:
          - "If every shipment of the order is DELIVERED -> Order -> DELIVERED (final accrual + commission fire)"

  - entity: Promotion
    initial_state: DRAFT
    terminal_states: [ENDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/promotions/{id}/activate"
        actor: DistributionAdmin
        preconditions:
          - "Promotion is DRAFT (ERR_INVALID_PROMOTION_STATE otherwise)"
          - "ends_at is after the logical clock (ERR_INVALID_TIME_WINDOW otherwise)"
        side_effects:
          - "remaining_budget_units := budget_units"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /api/promotions/{id}/pause | system: a referenced product became DISCONTINUED"
        actor: DistributionAdmin | system
        preconditions:
          - "Promotion is ACTIVE (ERR_INVALID_PROMOTION_STATE otherwise)"
        side_effects: []
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /api/promotions/{id}/resume"
        actor: DistributionAdmin
        preconditions:
          - "Promotion is PAUSED (ERR_INVALID_PROMOTION_STATE otherwise)"
          - "ends_at is after the logical clock (ERR_INVALID_TIME_WINDOW otherwise)"
          - "Every referenced product (required/free/sample) is ACTIVE or LIQUIDATION (ERR_INVALID_PRODUCT_STATE otherwise)"
        side_effects: []
      - from: ACTIVE
        to: ENDED
        trigger: "system: a redemption drove remaining_budget_units to 0 | system: ops sweep finds ends_at before the logical clock"
        actor: system
        preconditions: []
        side_effects: []
      - from: PAUSED
        to: ENDED
        trigger: "system: ops sweep finds ends_at before the logical clock"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PromotionRedemption
    initial_state: APPLIED
    terminal_states: [REVERSED]
    transitions:
      - from: APPLIED
        to: REVERSED
        trigger: "system: the redeeming order is cancelled or rejected (directly or via salon cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Promotion.remaining_budget_units += units_consumed (promotion stays ENDED if it already ended)"
          - "reversal_reason := ORDER_CANCELLED | ORDER_REJECTED | ACCOUNT_SUSPENDED"

  - entity: DiversionCase
    initial_state: OPEN
    terminal_states: [SUBSTANTIATED, DISMISSED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /api/diversion-cases/{id}/start-review"
        actor: ComplianceOfficer
        preconditions:
          - "Case is OPEN (ERR_INVALID_DIVERSION_CASE_STATE otherwise)"
        side_effects: []
      - from: UNDER_REVIEW
        to: OPEN
        trigger: "POST /api/diversion-cases/{id}/request-evidence"
        actor: ComplianceOfficer
        preconditions:
          - "Case is UNDER_REVIEW (ERR_INVALID_DIVERSION_CASE_STATE otherwise)"
        side_effects: []
      - from: UNDER_REVIEW
        to: SUBSTANTIATED
        trigger: "POST /api/diversion-cases/{id}/substantiate"
        actor: ComplianceOfficer
        preconditions:
          - "Case is UNDER_REVIEW (ERR_INVALID_DIVERSION_CASE_STATE otherwise)"
          - "Caller X-User-ID != filed_by_user_id (ERR_SEGREGATION_OF_DUTIES otherwise)"
        side_effects:
          - "adjudicated_by_user_id := caller; strike_points_awarded := severity points (MINOR 1 | MAJOR 2 | SEVERE 3)"
          - "SalonAccount.diversion_strike_points += strike_points_awarded; diversion_risk_score recomputed"
          - "If diversion_strike_points >= 3 and salon is ACTIVE -> salon SUSPENDED (DIVERSION_STRIKES) with full suspension cascade"
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /api/diversion-cases/{id}/dismiss"
        actor: ComplianceOfficer
        preconditions:
          - "Case is UNDER_REVIEW or OPEN (ERR_INVALID_DIVERSION_CASE_STATE otherwise)"
          - "Caller X-User-ID != filed_by_user_id (ERR_SEGREGATION_OF_DUTIES otherwise)"
        side_effects:
          - "adjudicated_by_user_id := caller; hold_shipments effect ends"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /api/diversion-cases/{id}/dismiss"
        actor: ComplianceOfficer
        preconditions:
          - "Case is UNDER_REVIEW or OPEN"
          - "Caller X-User-ID != filed_by_user_id"
        side_effects:
          - "adjudicated_by_user_id := caller; hold_shipments effect ends"

  - entity: RoutePlan
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /api/route-plans/{id}/publish"
        actor: SalesConsultant | DistributionAdmin
        preconditions:
          - "Plan is DRAFT (ERR_INVALID_ROUTE_PLAN_STATE otherwise)"
          - "Plan has at least one RouteStop in SCHEDULED (ERR_INVALID_ROUTE_PLAN_STATE otherwise)"
          - "Plan's SalesConsultant is ACTIVE (ERR_INVALID_CONSULTANT_STATE otherwise)"
        side_effects: []
      - from: PUBLISHED
        to: DRAFT
        trigger: "POST /api/route-plans/{id}/unpublish"
        actor: SalesConsultant | DistributionAdmin
        preconditions:
          - "Plan is PUBLISHED (ERR_INVALID_ROUTE_PLAN_STATE otherwise)"
          - "No stop of the plan is COMPLETED (ERR_INVALID_ROUTE_PLAN_STATE otherwise)"
        side_effects: []
      - from: PUBLISHED
        to: COMPLETED
        trigger: "system: every stop of the plan is COMPLETED or CANCELLED and at least one stop is COMPLETED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RouteStop
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /api/route-stops/{id}/complete"
        actor: SalesConsultant | DistributionAdmin
        preconditions:
          - "Stop is SCHEDULED (ERR_INVALID_ROUTE_STOP_STATE otherwise)"
          - "Owning RoutePlan is PUBLISHED (ERR_INVALID_ROUTE_PLAN_STATE otherwise)"
        side_effects:
          - "visited_at := logical clock"
          - "Bubble-up: if all stops now terminal with >= 1 COMPLETED -> RoutePlan PUBLISHED -> COMPLETED"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /api/route-stops/{id}/no-show"
        actor: SalesConsultant | DistributionAdmin
        preconditions:
          - "Stop is SCHEDULED (ERR_INVALID_ROUTE_STOP_STATE otherwise)"
          - "Owning RoutePlan is PUBLISHED (ERR_INVALID_ROUTE_PLAN_STATE otherwise)"
        side_effects: []
      - from: NO_SHOW
        to: SCHEDULED
        trigger: "POST /api/route-stops/{id}/reschedule"
        actor: SalesConsultant | DistributionAdmin
        preconditions:
          - "Stop is NO_SHOW (ERR_INVALID_ROUTE_STOP_STATE otherwise)"
          - "New window passes the 30-minute buffer rule against all non-CANCELLED sibling stops (ERR_ROUTE_STOP_BUFFER_VIOLATION)"
        side_effects:
          - "start_at/end_at replaced with the new window"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/route-stops/{id}/cancel"
        actor: SalesConsultant | DistributionAdmin
        preconditions:
          - "Stop is SCHEDULED or NO_SHOW (ERR_INVALID_ROUTE_STOP_STATE otherwise)"
        side_effects:
          - "Bubble-up: if all stops now terminal with >= 1 COMPLETED -> RoutePlan COMPLETED"
      - from: NO_SHOW
        to: CANCELLED
        trigger: "POST /api/route-stops/{id}/cancel"
        actor: SalesConsultant | DistributionAdmin
        preconditions:
          - "Stop is SCHEDULED or NO_SHOW"
        side_effects:
          - "Same bubble-up as SCHEDULED -> CANCELLED"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: tier-override-stale-salon
    parent_entity: SalonAccount
    write_endpoint: "POST /api/salon-accounts/{id}/tier-override"
    occ_field: expected_salon_account_version
    description: |
      A tier override carries the SalonAccount.version the caller last observed.
      If the salon's version has advanced past that value (e.g. an evaluate-tier
      run, a suspension, or a cascade wrote the account in between), the override
      is based on stale state and is rejected with ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: promotion-budget-adjust-stale
    parent_entity: Promotion
    write_endpoint: "POST /api/promotions/{id}/budget-adjustments"
    occ_field: expected_promotion_version
    description: |
      A budget adjustment carries the Promotion.version the caller last observed.
      Budget adjustments are otherwise always legal, so a version that has since
      advanced (a redemption consumed budget, or another adjustment landed) means
      the caller's view of remaining budget is stale; rejected with ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: order-item-add-stale-order
    parent_entity: Order
    write_endpoint: "POST /api/orders/{id}/items"
    occ_field: expected_order_version
    description: |
      Adding an item to a DRAFT order carries the Order.version the caller last
      observed (the order is otherwise still DRAFT and the add would legitimately
      succeed). If the version has advanced since (another item add, a credit or
      promotion redemption changed the order), the stale add is rejected with
      ERR_STALE_VERSION so pricing never applies to a snapshot the caller did not see.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: line_unit_pricing
    trigger: "POST /api/orders (for initial items) and POST /api/orders/{id}/items; snapshot stored on OrderItem.unit_price_cents"
    algorithm: tiered_pricing
    formula: |
      Inputs: product.base_price_cents, salon.tier, product.variant_type,
              product.lifecycle_status, liquidation week index w.
      Branch 1 (liquidation): if product.lifecycle_status == LIQUIDATION:
        w = floor((now - product.liquidation_started_at) / 14 days) using the logical clock
        liq_pct = 0.20 if w in {0,1}... precisely: elapsed_days < 14 -> 0.20;
                  14 <= elapsed_days < 28 -> 0.40; elapsed_days >= 28 -> 0.60
        unit_price_cents = round_half_up(base_price_cents * (1 - liq_pct))
        (liquidation price replaces tier and backbar discounts entirely)
      Branch 2 (normal): lifecycle_status == ACTIVE:
        tier_pct = TIER_DISCOUNT[salon.tier]
        backbar_pct = BACKBAR_DISCOUNT if variant_type == BACKBAR else 0
        unit_price_cents = round_half_up( round_half_up(base * (1 - tier_pct)) * (1 - backbar_pct) )
        (tier discount rounds first, then the backbar discount applies to the
         already-rounded value; this nesting is pinned)
    input_set: "the product being priced and the salon's tier at item-add time"
    constants:
      TIER_DISCOUNT: { SILVER: 0.00, GOLD: 0.10, PLATINUM: 0.15 }
      BACKBAR_DISCOUNT: 0.20
      LIQ_WEEK0_PCT: 0.20
      LIQ_WEEK2_PCT: 0.40
      LIQ_WEEK4_PCT: 0.60
      LIQ_STEP_DAYS: 14
    precision: "integer cents, round_half_up at each pinned rounding step"
    variants:
      - name: liquidation_flat
        when: "product.lifecycle_status == LIQUIDATION"
        difference: "flat ladder discount off base; tier and backbar discounts do not apply"

  - name: order_totals
    trigger: "any OrderItem add/remove, redeem-credits, redeem-promotion, shipment create/void"
    algorithm: aggregation
    formula: |
      Pinned evaluation order (mode: nested rounding, order matters):
      1. unit_price_cents per line (already rounded by line_unit_pricing)
      2. line_total_cents = unit_price_cents * quantity        (exact integer; NO re-rounding
         of base*qty*(1-discount) — that alternative order yields different cents and is wrong)
      3. merchandise_total_cents = sum(line_total_cents) over all items (promotional lines contribute 0)
      4. credit_applied_cents (see credit_redemption_cap)
      5. net_merch_cents = merchandise_total_cents - credit_applied_cents
      6. shipping_total_cents = sum(shipping_charge_cents) over shipments NOT voided back to PLANNED
      7. grand_total_cents = net_merch_cents + shipping_total_cents
    input_set: "all OrderItems of the order; non-voided shipments of the order"
    precision: "integer cents"
    variants: []

  - name: credit_redemption_cap
    trigger: "POST /api/orders/{id}/redeem-credits and revalidated at submit"
    algorithm: constraint_propagation
    formula: |
      Circular-looking chain, pinned evaluation order:
        merchandise_total_cents  ->  cap_cents  ->  credit_applied_cents  ->  net_merch_cents  ->  accrual base
      1. cap_cents = floor(merchandise_total_cents * CREDIT_CAP_RATIO)
      2. requested_cents = points * POINT_VALUE_CENTS
      3. credit_applied_cents = min(requested_cents, cap_cents, salon_redeemable_points * POINT_VALUE_CENTS)
         - if requested points > salon_redeemable    -> ERR_INSUFFICIENT_CREDIT_BALANCE (checked FIRST)
         - else if requested_cents > cap_cents       -> ERR_CREDIT_REDEMPTION_EXCEEDS_CAP (checked SECOND)
         (so on success credit_applied_cents == requested_cents; the min only documents the ceiling)
      4. net_merch_cents = merchandise_total_cents - credit_applied_cents
      5. education_credit_accrual uses net_merch_cents (NOT merchandise_total_cents)
      salon_redeemable_points = sum over accrual entries (points - consumed_points)
        with expires_at after the logical clock.
    input_set: "the order's items; the salon's non-expired accrual entries"
    constants:
      CREDIT_CAP_RATIO: 0.5
      POINT_VALUE_CENTS: 100
    precision: "integer cents/points"
    variants: []

  - name: education_credit_accrual
    trigger: "provisional: order submit; final: order reaches DELIVERED"
    algorithm: forward_looking
    formula: |
      points = floor(net_merch_cents / ACCRUAL_DIVISOR_CENTS) * TIER_MULTIPLIER[tier]
      Provisional posting: PROVISIONAL_ACCRUAL entry, tier = salon.tier at submit.
      Final posting: FINAL_ACCRUAL entry with delta = final_points - provisional_points,
        recomputed over delivered non-promotional lines' line_total_cents minus
        credit_applied_cents, tier = salon.tier at delivery. Delta may be negative.
      Both postings bump SalonAccount.education_credit_points by their signed points.
    input_set: "the order's non-promotional items; salon tier at the relevant instant"
    constants:
      ACCRUAL_DIVISOR_CENTS: 1000
      TIER_MULTIPLIER: { SILVER: 1, GOLD: 2, PLATINUM: 3 }
    precision: "integer points, floor division"
    variants:
      - name: provisional
        when: "order submit"
        difference: "forward-looking estimate using tier at submit time"
      - name: final
        when: "order DELIVERED"
        difference: "chronological recomputation at delivery using tier at delivery time; posts signed delta"

  - name: consultant_commission
    trigger: "order reaches DELIVERED; attributed to salon.assigned_consultant_id (skip if null or consultant INACTIVE)"
    algorithm: tiered_pricing
    formula: |
      base_cents = delivered order's net_merch_cents
      STRAIGHT variant: commission = round_half_up(base_cents * STRAIGHT_RATE)
      ACCELERATOR variant (monthly marginal tiers, chronological within calendar month
      of the logical clock; consultant.commission_month / commission_month_volume_cents
      reset when the delivery month differs from commission_month):
        v0 = consultant.commission_month_volume_cents (before this order)
        tiers: [0, T1) at 0.04 ; [T1, T2) at 0.06 ; [T2, inf) at 0.08   (T1=1000000, T2=3000000)
        commission = marginal_rate_integral(v0, v0 + base_cents)
          = 0.04 * overlap(v0, v0+base, 0, T1) + 0.06 * overlap(..., T1, T2) + 0.08 * overlap(..., T2, inf)
        round_half_up to integer cents
      consultant.commission_accrued_cents += commission; month volume += base_cents
    input_set: "the delivered order; the attributed consultant's month-to-date volume"
    constants:
      STRAIGHT_RATE: 0.05
      ACC_T1_CENTS: 1000000
      ACC_T2_CENTS: 3000000
      ACC_R1: 0.04
      ACC_R2: 0.06
      ACC_R3: 0.08
    precision: "integer cents, round_half_up"
    variants:
      - name: straight
        when: "consultant.commission_model == STRAIGHT"
        difference: "flat 5% of net_merch_cents regardless of monthly volume"
      - name: accelerator
        when: "consultant.commission_model == ACCELERATOR"
        difference: "marginal monthly tiers 4%/6%/8%; same order yields a different commission than straight"

  - name: diversion_risk_score
    trigger: "diversion case substantiation (recompute for the salon)"
    algorithm: decay_function
    formula: |
      score = min(100, sum over SUBSTANTIATED cases of severity_points * decay)
      decay: substantiated < 12 months ago -> 1.0 ; 12-24 months -> 0.5 ; > 24 months -> 0
      (step decay evaluated against the logical clock; case substantiation date = updated_at of the SUBSTANTIATED transition)
      severity_points: MINOR 1, MAJOR 2, SEVERE 3
    input_set: "SUBSTANTIATED DiversionCase rows of the salon only (OPEN/UNDER_REVIEW/DISMISSED excluded)"
    constants:
      DECAY_FULL_MONTHS: 12
      DECAY_HALF_MONTHS: 24
      SCORE_CAP: 100
    precision: "1 decimal place, round_half_up"
    variants: []

  - name: backbar_quota_check
    trigger: "POST /api/orders/{id}/submit"
    algorithm: threshold
    formula: |
      Window: [now - 90 days, now] per the logical clock.
      hist_backbar = sum(quantity) over non-promotional items of this salon's DELIVERED orders
                     with delivered_at in window, where product.variant_type == BACKBAR
      hist_retail  = same for RETAIL
      proj_backbar = hist_backbar + this order's non-promotional BACKBAR quantity
      proj_retail  = hist_retail  + this order's non-promotional RETAIL quantity
      Constraint: proj_backbar <= BACKBAR_RATIO * proj_retail   (inclusive: equality is allowed)
      Violation -> ERR_BACKBAR_QUOTA_EXCEEDED
    input_set: "DELIVERED orders of the salon in the window; the submitting order's non-promotional items"
    constants:
      BACKBAR_RATIO: 2.0
      WINDOW_DAYS: 90
    precision: "integer units; ratio comparison exact"
    variants: []

  - name: sample_allocation
    trigger: "POST /api/orders/{id}/redeem-promotion"
    algorithm: waterfall_allocation
    formula: |
      Waterfall of gates, in order:
      1. promotion budget bucket: units = (promo_type == SAMPLE ? sample_units_per_redemption : free_qty)
         if remaining_budget_units < units -> ERR_PROMOTION_BUDGET_EXHAUSTED (no partial grants)
      2. per-salon bucket: salon_used = sum(units_consumed) over APPLIED redemptions of
         (promotion, salon); if salon_used + units > per_salon_cap -> ERR_PER_SALON_CAP_EXCEEDED
      3. grant: inject zero-priced promotional OrderItem (free_product_id x free_qty for BUNDLE;
         sample_product_id x sample_units_per_redemption for SAMPLE), create PromotionRedemption
         (APPLIED, units_consumed = units), remaining_budget_units -= units
      4. if remaining_budget_units == 0 -> promotion ACTIVE -> ENDED
      BUNDLE extra gate (before bucket 1): order must contain >= required_qty non-promotional
      units of required_product_id, else ERR_BUNDLE_REQUIREMENT_NOT_MET.
    input_set: "the promotion; APPLIED redemptions of (promotion, salon); the order's non-promotional items"
    precision: "integer units"
    variants: []

  - name: liquidation_price
    trigger: "inside line_unit_pricing when product.lifecycle_status == LIQUIDATION"
    algorithm: decay_function
    formula: |
      elapsed_days = floor((now - liquidation_started_at) / 86400s) on the logical clock
      elapsed_days < 14 -> pct 0.20 ; 14 <= elapsed_days < 28 -> 0.40 ; >= 28 -> 0.60
      price = round_half_up(base_price_cents * (1 - pct))
      Boundary: at exactly liquidation_started_at + 14 days, pct is 0.40 (left-closed step).
    input_set: "the liquidation product; logical clock"
    constants:
      LIQ_STEP_DAYS: 14
    precision: "integer cents, round_half_up"
    variants: []

  - name: tier_evaluation
    trigger: "POST /api/salon-accounts/{id}/evaluate-tier"
    algorithm: threshold
    formula: |
      vol = sum(net_merch_cents) over the salon's DELIVERED orders with
            delivered_at in [now - 365 days, now]  (inclusive both ends)
      store vol into trailing_12m_delivered_volume_cents
      if tier_override_active: tier unchanged
      else: tier = PLATINUM if vol >= PLATINUM_FLOOR_CENTS
                   else GOLD if vol >= GOLD_FLOOR_CENTS
                   else SILVER
      Boundaries are inclusive: vol == GOLD_FLOOR_CENTS yields GOLD.
    input_set: "the salon's DELIVERED orders in the trailing 365-day window"
    constants:
      GOLD_FLOOR_CENTS: 2000000
      PLATINUM_FLOOR_CENTS: 5000000
      WINDOW_DAYS: 365
    precision: "integer cents"
    variants: []

  - name: hazmat_shipping_charge
    trigger: "POST /api/orders/{id}/shipments (per shipment); void reverses it from order totals"
    algorithm: aggregation
    formula: |
      hazmat_grams = sum(item.quantity * product.weight_grams) over items whose
                     product.hazmat_class != NONE
      hazmat_surcharge_cents = 0 if hazmat_grams == 0 else HAZMAT_FLAT_CENTS + HAZMAT_PER_GRAM_CENTS * hazmat_grams
      hazmat_declaration_required = (hazmat_grams > 0)
      shipping_charge_cents = METHOD_BASE_CENTS[method] + hazmat_surcharge_cents
    input_set: "the shipment's items and their products"
    constants:
      METHOD_BASE_CENTS: { GROUND: 1200, AIR: 3000 }
      HAZMAT_FLAT_CENTS: 2500
      HAZMAT_PER_GRAM_CENTS: 2
    precision: "integer cents"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role; for entity_backed roles X-User-ID must resolve to an existing entity of that type"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: business_constraint
    check: "Request body schema: required fields present, types valid, enum values in declared sets, integer fields > 0 where declared, window fields strictly increasing (start < end)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a body; window fields use ERR_INVALID_TIME_WINDOW"
  - priority: 3
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all
  - priority: 4
    category: auth
    check: "Ownership: SalonBuyer acts only on its own salon's resources (X-User-ID == salon_account_id of the target); SalesConsultant acts only on route plans/stops whose sales_consultant_id == X-User-ID; segregation of duties: diversion adjudicator != filer"
    error_id: ERR_FORBIDDEN_RESOURCE
    http_status: 403
    applies_to: "SalonBuyer and SalesConsultant scoped endpoints; ERR_SEGREGATION_OF_DUTIES (403) for the adjudication rule"
  - priority: 5
    category: existence
    check: "Path and body-referenced resource ids exist, validated left-to-right along the path"
    error_id: "ERR_<RESOURCE>_NOT_FOUND (ERR_SALON_ACCOUNT_NOT_FOUND | ERR_LICENSE_NOT_FOUND | ERR_BRAND_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_CONSULTANT_NOT_FOUND | ERR_ROUTE_PLAN_NOT_FOUND | ERR_ROUTE_STOP_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_ORDER_ITEM_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_PROMOTION_NOT_FOUND | ERR_REDEMPTION_NOT_FOUND | ERR_DIVERSION_CASE_NOT_FOUND)"
    http_status: 404
    applies_to: all
  - priority: 6
    category: state
    check: "Target entity is in a valid from-state for the requested transition (all state machines)"
    error_id: "ERR_INVALID_ACCOUNT_STATE | ERR_INVALID_LICENSE_STATE | ERR_INVALID_PRODUCT_STATE | ERR_INVALID_ORDER_STATE | ERR_INVALID_SHIPMENT_STATE | ERR_INVALID_PROMOTION_STATE | ERR_INVALID_DIVERSION_CASE_STATE | ERR_INVALID_ROUTE_PLAN_STATE | ERR_INVALID_ROUTE_STOP_STATE | ERR_INVALID_CONSULTANT_STATE"
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 7
    category: state
    check: "Order creation and submit require SalonAccount.status == ACTIVE; approve requires the salon still ACTIVE"
    error_id: ERR_ACCOUNT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /api/orders, POST /api/orders/{id}/submit, POST /api/orders/{id}/approve"
  - priority: 8
    category: business_safety
    check: "Hazmat: a shipment containing any item with hazmat_class != NONE must use method GROUND"
    error_id: ERR_HAZMAT_AIR_FORBIDDEN
    http_status: 422
    applies_to: "POST /api/orders/{id}/shipments"
  - priority: 9
    category: business_safety
    check: "Diversion hold: no OPEN or UNDER_REVIEW DiversionCase with hold_shipments == true exists for the order's salon"
    error_id: ERR_SHIPMENT_HELD_DIVERSION
    http_status: 409
    applies_to: "POST /api/orders/{id}/shipments"
  - priority: 10
    category: business_referential
    check: "Shipment items reference items of this order and per-item shipped quantity (over non-voided shipments) does not exceed ordered quantity"
    error_id: ERR_SHIPMENT_QUANTITY_EXCEEDS_ORDER
    http_status: 409
    applies_to: "POST /api/orders/{id}/shipments"
  - priority: 11
    category: business_constraint
    check: "Brand territory exclusivity: for each order line's brand, if any BrandTerritoryExclusive exists for the brand, the salon's territory_code must be covered by a window containing the logical clock (half-open [effective_from, effective_to))"
    error_id: ERR_BRAND_TERRITORY_RESTRICTED
    http_status: 422
    applies_to: "POST /api/orders (per initial item), POST /api/orders/{id}/items, re-checked at POST /api/orders/{id}/submit"
  - priority: 12
    category: business_constraint
    check: "Backbar quota: projected backbar units <= 2.0 x projected retail units over the trailing 90-day delivered window plus this order (calculations.backbar_quota_check)"
    error_id: ERR_BACKBAR_QUOTA_EXCEEDED
    http_status: 422
    applies_to: "POST /api/orders/{id}/submit"
  - priority: 13
    category: business_constraint
    check: "Uniqueness: Brand.name unique; Product.sku unique; Promotion.code unique"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /api/brands, POST /api/products, POST /api/promotions"
  - priority: 14
    category: business_temporal
    check: "BrandTerritoryExclusive windows for the same (brand_id, territory_code) must not overlap under half-open semantics: overlap iff new.effective_from < existing.effective_to AND existing.effective_from < new.effective_to; adjacency (new.from == existing.to) is allowed"
    error_id: ERR_TERRITORY_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /api/brands/{id}/territory-exclusives"
  - priority: 15
    category: business_temporal
    check: "Route stop buffer: on the same RoutePlan, non-CANCELLED stops sorted by start_at must satisfy next.start_at - prev.end_at >= 30 minutes for every adjacent pair (checked for the new/rescheduled stop against all siblings)"
    error_id: ERR_ROUTE_STOP_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /api/route-plans/{id}/stops, POST /api/route-stops/{id}/reschedule"
  - priority: 16
    category: business_constraint
    check: "Route stop salon territory must be in the plan consultant's territory_codes"
    error_id: ERR_CONSULTANT_TERRITORY_MISMATCH
    http_status: 422
    applies_to: "POST /api/route-plans/{id}/stops"
  - priority: 17
    category: business_temporal
    check: "License valid_until must be after the logical clock at submit; re-checked at verify"
    error_id: ERR_LICENSE_DATE_INVALID
    http_status: 400
    applies_to: "POST /api/salon-accounts/{id}/licenses, POST /api/licenses/{id}/verify"
  - priority: 18
    category: business_temporal
    check: "Promotion window contains the logical clock at redemption: starts_at <= now < ends_at"
    error_id: ERR_PROMOTION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /api/orders/{id}/redeem-promotion"
  - priority: 19
    category: business_constraint
    check: "Promotion tier eligibility: salon.tier must be in promotion.eligible_tiers; order must not already have a redemption of the same promotion (ERR_PROMOTION_ALREADY_APPLIED); BUNDLE: order contains >= required_qty non-promotional units of required_product_id (ERR_BUNDLE_REQUIREMENT_NOT_MET)"
    error_id: "ERR_PROMOTION_TIER_INELIGIBLE | ERR_PROMOTION_ALREADY_APPLIED | ERR_BUNDLE_REQUIREMENT_NOT_MET"
    http_status: 422
    applies_to: "POST /api/orders/{id}/redeem-promotion"
  - priority: 20
    category: business_fiscal
    check: "Credit redemption, evaluated in this order: (1) requested points <= salon redeemable points -> ERR_INSUFFICIENT_CREDIT_BALANCE; (2) requested_cents <= floor(merchandise_total_cents * 0.5) (inclusive: exactly at the cap is allowed) -> ERR_CREDIT_REDEMPTION_EXCEEDS_CAP"
    error_id: "ERR_INSUFFICIENT_CREDIT_BALANCE | ERR_CREDIT_REDEMPTION_EXCEEDS_CAP"
    http_status: 422
    applies_to: "POST /api/orders/{id}/redeem-credits, revalidated at POST /api/orders/{id}/submit"
  - priority: 21
    category: business_fiscal
    check: "Promotion budget and per-salon cap (calculations.sample_allocation waterfall)"
    error_id: "ERR_PROMOTION_BUDGET_EXHAUSTED | ERR_PER_SALON_CAP_EXCEEDED"
    http_status: 422
    applies_to: "POST /api/orders/{id}/redeem-promotion"
  - priority: 22
    category: business_constraint
    check: "Reinstate requires at least one VERIFIED license with valid_until after the logical clock"
    error_id: ERR_NO_VALID_LICENSE
    http_status: 409
    applies_to: "POST /api/salon-accounts/{id}/reinstate"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving / ops ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z; the server never falls back to wall-clock time."
    roles: [DistributionAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Logical clock advanced; no lazy expiries fire here (sweep endpoint does that)"]

  - method: POST
    path: "/api/ops/run-daily-sweep"
    description: "Ops-run checkpoint: expire VERIFIED licenses past valid_until (with salon suspension cascade), end ACTIVE/PAUSED promotions past ends_at, post EXPIRY credit entries for expired accrual residuals"
    roles: [DistributionAdmin]
    code: 200
    input: []
    output: { expired_license_count: integer, suspended_salon_count: integer, expired_credit_points: integer, ended_promotion_count: integer }
    side_effects:
      - "VERIFIED licenses with valid_until < now -> EXPIRED; if that was the salon's last valid VERIFIED license and salon is ACTIVE -> SUSPENDED (LICENSE_EXPIRED) with full order-cancellation cascade"
      - "Promotions ACTIVE/PAUSED with ends_at < now -> ENDED"
      - "Accrual credit entries with expires_at < now and residual points -> EXPIRY entry of -(points - consumed_points); consumed_points set to points"

  # --- SalonAccount ---
  - method: POST
    path: "/api/salon-accounts"
    description: "Open a salon account (field sales onboarding)"
    roles: [SalesConsultant]
    code: 201
    input: [legal_name, territory_code, "assigned_consultant_id?"]
    output: SalonAccount
    side_effects: ["status = PENDING_VERIFICATION, tier = SILVER, all counters 0"]

  - method: GET
