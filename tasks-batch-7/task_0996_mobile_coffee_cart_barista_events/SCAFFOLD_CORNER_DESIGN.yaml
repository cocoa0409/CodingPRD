scaffold_corner_design:

  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: client_creation_required_fields
        claim_type: creation
        grounds: [entities.Client.fields.company_name, entities.Client.fields.contact_email]
        distinguishing_aspect: "POST /clients with both required fields returns 201 with system-minted id, status=ACTIVE, version=1."
        test_recipe:
          setup: ["Clock default"]
          setup_api_calls:
            - call: "POST /coffee-cart/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
          trigger:
            - call: "POST /coffee-cart/clients"
              payload: { company_name: "Acme", contact_email: "acme@x.com" }
              as: OperationsManager
              captures: { cid: $.data.id, status: $.data.status, version: $.data.version }
          assert:
            - "cid is a UUID string"
            - "status == ACTIVE"
            - "version == 1"

      - name: client_missing_contact_email_rejected
        claim_type: required_fields
        grounds: [entities.Client.fields.contact_email]
        distinguishing_aspect: "Omitting required contact_email triggers ERR_VALIDATION 400."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /coffee-cart/clients"
              payload: { company_name: "Acme" }
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"

      - name: booking_computed_fields_initialized_zero
        claim_type: computed_fields
        grounds: [entities.EventBooking.fields.quoted_total_cents, entities.EventBooking.fields.deposit_due_cents]
        distinguishing_aspect: "At creation (QUOTE), computed quoted_* and deposit_due_cents are 0 — they are not populated until submit."
        test_recipe:
          setup: ["Active catalog and client"]
          setup_api_calls:
            - call: "POST /coffee-cart/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /coffee-cart/clients"
              payload: { company_name: "Acme", contact_email: "acme@x.com" }
              as: OperationsManager
              captures: { client_id: $.data.id }
            - call: "POST /coffee-cart/carts"
              payload: { cart_code: "CART-A", max_drinks_per_hour: 200, requires_power_hookup: false, requires_water_hookup: false, home_base_lat: 37.0, home_base_lng: -122.0 }
              as: OperationsManager
              captures: { cart_id: $.data.id }
            - call: "POST /coffee-cart/packages"
              payload: { package_code: "PKG-FLAT", pricing_model: "FLAT", base_hours: 2, included_drinks: 100, flat_price_cents: 60000, per_cup_price_cents: 0, per_cup_minimum_cents: 0, max_guests: 80 }
              as: OperationsManager
              captures: { pkg_flat_id: $.data.id }
            - call: "POST /coffee-cart/travel-zones"
              payload: { zone_code: "ZONE-1", max_distance_km: 25, banded_fee_cents: 5000, per_km_rate_cents: 200, min_booking_subtotal_cents: 0 }
              as: OperationsManager
              captures: { zone1_id: $.data.id }
          trigger:
            - call: "POST /coffee-cart/bookings"
              payload: { client_id: "${client_id}", package_id: "${pkg_flat_id}", cart_id: "${cart_id}", travel_zone_id: "${zone1_id}", event_start: "2026-05-10T10:00:00Z", event_end: "2026-05-10T12:00:00Z", guest_count: 40, venue_provides_power: true, venue_provides_water: true, distance_km: 10 }
              as: Client
              as_user_id: "${client_id}"
              captures: { total: $.data.quoted_total_cents, deposit: $.data.deposit_due_cents, status: $.data.status }
          assert:
            - "total == 0"
            - "deposit == 0"
            - "status == QUOTE"

      - name: booking_addon_applied_price_snapshot
        claim_type: computed_fields
        grounds: [entities.BookingAddOn.fields.applied_price_cents]
        distinguishing_aspect: "BookingAddOn.applied_price_cents is a snapshot of AddOn.price_cents at attach time; later AddOn price changes do NOT retroactively alter it."
        test_recipe:
          setup: ["Active addon LATTE_ART price=8000"]
          setup_api_calls:
            - call: "POST /coffee-cart/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /coffee-cart/clients"
              payload: { company_name: "Acme", contact_email: "acme@x.com" }
              as: OperationsManager
              captures: { client_id: $.data.id }
            - call: "POST /coffee-cart/carts"
              payload: { cart_code: "CART-A", max_drinks_per_hour: 200, requires_power_hookup: false, requires_water_hookup: false, home_base_lat: 37.0, home_base_lng: -122.0 }
              as: OperationsManager
              captures: { cart_id: $.data.id }
            - call: "POST /coffee-cart/packages"
              payload: { package_code: "PKG-FLAT", pricing_model: "FLAT", base_hours: 2, included_drinks: 100, flat_price_cents: 60000, per_cup_price_cents: 0, per_cup_minimum_cents: 0, max_guests: 80 }
              as: OperationsManager
              captures: { pkg_flat_id: $.data.id }
            - call: "POST /coffee-cart/travel-zones"
              payload: { zone_code: "ZONE-1", max_distance_km: 25, banded_fee_cents: 5000, per_km_rate_cents: 200, min_booking_subtotal_cents: 0 }
              as: OperationsManager
              captures: { zone1_id: $.data.id }
            - call: "POST /coffee-cart/addons"
              payload: { addon_code: "LATTE_ART", price_cents: 8000, requires_lead_barista: false, requires_latte_art_cert: true }
              as: OperationsManager
              captures: { addon_id: $.data.id }
            - call: "POST /coffee-cart/bookings"
              payload: { client_id: "${client_id}", package_id: "${pkg_flat_id}", cart_id: "${cart_id}", travel_zone_id: "${zone1_id}", event_start: "2026-05-10T10:00:00Z", event_end: "2026-05-10T12:00:00Z", guest_count: 40, venue_provides_power: true, venue_provides_water: true, distance_km: 10 }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /coffee-cart/bookings/${booking_id}/addons"
              payload: { addon_id: "${addon_id}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { applied: $.data.applied_price_cents }
          assert:
            - "applied == 8000"

      - name: not_found_on_random_uuid
        claim_type: not_found
        grounds: [errors.ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "GET /bookings/{random-uuid} returns 404 ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "GET /coffee-cart/bookings/00000000-0000-0000-0000-000000000000"
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_RESOURCE_NOT_FOUND"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: booking_initial_state_quote
        claim_type: initial_state
        grounds: [state_machines.EventBooking]
        distinguishing_aspect: "Newly created EventBooking starts in QUOTE."
        test_recipe:
          setup: ["Catalog + client"]
          setup_api_calls:
            - call: "POST /coffee-cart/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /coffee-cart/clients"
              payload: { company_name: "Acme", contact_email: "acme@x.com" }
              as: OperationsManager
              captures: { client_id: $.data.id }
            - call: "POST /coffee-cart/carts"
              payload: { cart_code: "CART-A", max_drinks_per_hour: 200, requires_power_hookup: false, requires_water_hookup: false, home_base_lat: 37.0, home_base_lng: -122.0 }
              as: OperationsManager
              captures: { cart_id: $.data.id }
            - call: "POST /coffee-cart/packages"
              payload: { package_code: "PKG-FLAT", pricing_model: "FLAT", base_hours: 2, included_drinks: 100, flat_price_cents: 60000, per_cup_price_cents: 0, per_cup_minimum_cents: 0, max_guests: 80 }
              as: OperationsManager
              captures: { pkg_flat_id: $.data.id }
            - call: "POST /coffee-cart/travel-zones"
              payload: { zone_code: "ZONE-1", max_distance_km: 25, banded_fee_cents: 5000, per_km_rate_cents: 200, min_booking_subtotal_cents: 0 }
              as: OperationsManager
              captures: { zone1_id: $.data.id }
            - call: "POST /coffee-cart/bookings"
              payload: { client_id: "${client_id}", package_id: "${pkg_flat_id}", cart_id: "${cart_id}", travel_zone_id: "${zone1_id}", event_start: "2026-05-10T10:00:00Z", event_end: "2026-05-10T12:00:00Z", guest_count: 40, venue_provides_power: true, venue_provides_water: true, distance_km: 10 }
              as: Client
              as_user_id: "${client_id}"
              captures: { st: $.data.status }
          trigger: []
          assert:
            - "st == QUOTE"

      - name: cancel_from_completed_rejected_terminal
        claim_type: invalid_transition
        grounds: [state_machines.EventBooking]
        distinguishing_aspect: "Attempting to cancel a COMPLETED booking is rejected with ERR_INVALID_STATE (COMPLETED is terminal)."
        test_recipe:
          setup: ["Booking driven to COMPLETED via full lifecycle"]
          setup_api_calls:
            - call: "POST /coffee-cart/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /coffee-cart/clients"
              payload: { company_name: "Acme", contact_email: "acme@x.com" }
              as: OperationsManager
              captures: { client_id: $.data.id }
            - call: "POST /coffee-cart/carts"
              payload: { cart_code: "CART-A", max_drinks_per_hour: 200, requires_power_hookup: false, requires_water_hookup: false, home_base_lat: 37.0, home_base_lng: -122.0 }
              as: OperationsManager
              captures: { cart_id: $.data.id, cart_v0: $.data.version }
            - call: "POST /coffee-cart/baristas"
              payload: { full_name: "Bia", skill_level: "LEAD", latte_art_certified: true, hourly_rate_cents: 3000, weekly_hour_cap: 40 }
              as: OperationsManager
              captures: { barista_id: $.data.id, barista_v0: $.data.version }
            - call: "POST /coffee-cart/packages"
              payload: { package_code: "PKG-FLAT", pricing_model: "FLAT", base_hours: 2, included_drinks: 100, flat_price_cents: 60000, per_cup_price_cents: 0, per_cup_minimum_cents: 0, max_guests: 80 }
              as: OperationsManager
              captures: { pkg_flat_id: $.data.id }
            - call: "POST /coffee-cart/travel-zones"
              payload: { zone_code: "ZONE-1", max_distance_km: 25, banded_fee_cents: 5000, per_km_rate_cents: 200, min_booking_subtotal_cents: 0 }
              as: OperationsManager
              captures: { zone1_id: $.data.id }
            - call: "POST /coffee-cart/bookings"
              payload: { client_id: "${client_id}", package_id: "${pkg_flat_id}", cart_id: "${cart_id}", travel_zone_id: "${zone1_id}", event_start: "2026-05-03T10:00:00Z", event_end: "2026-05-03T12:00:00Z", guest_count: 40, venue_provides_power: true, venue_provides_water: true, distance_km: 10 }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /coffee-cart/bookings/${booking_id}/assignments"
              payload: { barista_id: "${barista_id}", is_primary: true }
              as: OperationsManager
              captures: { asg_id: $.data.id }
            - call: "POST /coffee-cart/assignments/${asg_id}/accept"
              as: Barista
              as_user_id: "${barista_id}"
            - call: "POST /coffee-cart/bookings/${booking_id}/submit"
              payload: { expected_cart_version: "${cart_v0}", expected_primary_barista_version: "${barista_v0}" }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /coffee-cart/bookings/${booking_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 18600, idempotency_key: "dep-1" }
              as: Client
              as_user_id: "${client_id}"
              captures: { pay_id: $.data.id }
            - call: "POST /coffee-cart/payments/${pay_id}/mark-succeeded"
              as: OperationsManager
            - call: "POST /coffee-cart/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T13:00:00Z" }
              as: OperationsManager
            - call: "POST /coffee-cart/assignments/${asg_id}/resolve"
              payload: { attended: true }
              as: OperationsManager
            - call: "POST /coffee-cart/bookings/${booking_id}/complete"
              as: OperationsManager
              captures: { st_completed: $.data.status }
          trigger:
            - call: "POST /coffee-cart/bookings/${booking_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "st_completed == COMPLETED"
            - "err == ERR_INVALID_STATE"

      - name: payment_idempotency_same_key_returns_same_row
        claim_type: idempotency
        grounds: ["validations[priority=19]"]
        distinguishing_aspect: "POST /payments with the same idempotency_key after a SUCCEEDED payment returns the same Payment row, not a duplicate."
        test_recipe:
          setup: ["PENDING_DEPOSIT booking"]
          setup_api_calls:
            - call: "POST /coffee-cart/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /coffee-cart/clients"
              payload: { company_name: "Acme", contact_email: "acme@x.com" }
              as: OperationsManager
              captures: { client_id: $.data.id }
            - call: "POST /coffee-cart/carts"
              payload: { cart_code: "CART-A", max_drinks_per_hour: 200, requires_power_hookup: false, requires_water_hookup: false, home_base_lat: 37.0, home_base_lng: -122.0 }
              as: OperationsManager
              captures: { cart_id: $.data.id, cart_v0: $.data.version }
            - call: "POST /coffee-cart/baristas"
              payload: { full_name: "Bia", skill_level: "LEAD", latte_art_certified: true, hourly_rate_cents: 3000, weekly_hour_cap: 40 }
              as: OperationsManager
              captures: { barista_id: $.data.id, barista_v0: $.data.version }
            - call: "POST /coffee-cart/packages"
              payload: { package_code: "PKG-FLAT", pricing_model: "FLAT", base_hours: 2, included_drinks: 100, flat_price_cents: 60000, per_cup_price_cents: 0, per_cup_minimum_cents: 0, max_guests: 80 }
              as: OperationsManager
              captures: { pkg_flat_id: $.data.id }
            - call: "POST /coffee-cart/travel-zones"
              payload: { zone_code: "ZONE-1", max_distance_km: 25, banded_fee_cents: 5000, per_km_rate_cents: 200, min_booking_subtotal_cents: 0 }
              as: OperationsManager
              captures: { zone1_id: $.data.id }
            - call: "POST /coffee-cart/bookings"
              payload: { client_id: "${client_id}", package_id: "${pkg_flat_id}", cart_id: "${cart_id}", travel_zone_id: "${zone1_id}", event_start: "2026-05-10T10:00:00Z", event_end: "2026-05-10T12:00:00Z", guest_count: 40, venue_provides_power: true, venue_provides_water: true, distance_km: 10 }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /coffee-cart/bookings/${booking_id}/assignments"
              payload: { barista_id: "${barista_id}", is_primary: true }
              as: OperationsManager
            - call: "POST /coffee-cart/bookings/${booking_id}/submit"
              payload: { expected_cart_version: "${cart_v0}", expected_primary_barista_version: "${barista_v0}" }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /coffee-cart/bookings/${booking_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 18600, idempotency_key: "dep-1" }
              as: Client
              as_user_id: "${client_id}"
              captures: { pay1_id: $.data.id }
            - call: "POST /coffee-cart/payments/${pay1_id}/mark-succeeded"
              as: OperationsManager
          trigger:
            - call: "POST /coffee-cart/bookings/${booking_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 18600, idempotency_key: "dep-1" }
              as: Client
              as_user_id: "${client_id}"
              captures: { pay2_id: $.data.id }
          assert:
            - "pay2_id == pay1_id"

      - name: assignment_decline_terminal_no_reaccept
        claim_type: invalid_transition
        grounds: [state_machines.BaristaAssignment]
        distinguishing_aspect: "DECLINED is terminal; POST accept on a DECLINED assignment is rejected."
        test_recipe:
          setup: ["OFFERED assignment, barista declines"]
          setup_api_calls:
            - call: "POST /coffee-cart/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /coffee-cart/clients"
              payload: { company_name: "Acme", contact_email: "acme@x.com" }
              as: OperationsManager
              captures: { client_id: $.data.id }
            - call: "POST /coffee-cart/carts"
              payload: { cart_code: "CART-A", max_drinks_per_hour: 200, requires_power_hookup: false, requires_water_hookup: false, home_base_lat: 37.0, home_base_lng: -122.0 }
              as: OperationsManager
              captures: { cart_id: $.data.id }
            - call: "POST /coffee-cart/baristas"
              payload: { full_name: "Bia", skill_level: "LEAD", latte_art_certified: true, hourly_rate_cents: 3000, weekly_hour_cap: 40 }
              as: OperationsManager
              captures: { barista_id: $.data.id }
            - call: "POST /coffee-cart/packages"
              payload: { package_code: "PKG-FLAT", pricing_model: "FLAT", base_hours: 2, included_drinks: 100, flat_price_cents: 60000, per_cup_price_cents: 0, per_cup_minimum_cents: 0, max_guests: 80 }
              as: OperationsManager
              captures: { pkg_flat_id: $.data.id }
            - call: "POST /coffee-cart/travel-zones"
              payload: { zone_code: "ZONE-1", max_distance_km: 25, banded_fee_cents: 5000, per_km_rate_cents: 200, min_booking_subtotal_cents: 0 }
              as: OperationsManager
              captures: { zone1_id: $.data.id }
            - call: "POST /coffee-cart/bookings"
              payload: { client_id: "${client_id}", package_id: "${pkg_flat_id}", cart_id: "${cart_id}", travel_zone_id: "${zone1_id}", event_start: "2026-05-10T10:00:00Z", event_end: "2026-05-10T12:00:00Z", guest_count: 40, venue_provides_power: true, venue_provides_water: true, distance_km: 10 }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /coffee-cart/bookings/${booking_id}/assignments"
              payload: { barista_id: "${barista_id}", is_primary: true }
              as: OperationsManager
              captures: { asg_id: $.data.id }
            - call: "POST /coffee-cart/assignments/${asg_id}/decline"
              payload: { decline_reason: "conflict" }
              as: Barista
              as_user_id: "${barista_id}"
          trigger:
            - call: "POST /coffee-cart/assignments/${asg_id}/accept"
              as: Barista
              as_user_id: "${barista_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

  # =========================================================================
  # Section: calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: metered_travel_variant_applied_when_distance_under_threshold
        claim_type: correct_result
        grounds: [calculations.quoted_travel_fee_cents]
        distinguishing_aspect: "distance_km=20 (<= METERED_MAX_KM=25) selects METERED variant: fee = 20 * 200 = 4000 cents."
        test_recipe:
          setup: ["QUOTE booking distance=20 zone-1"]
          setup_api_calls:
            - call: "POST /coffee-cart/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /coffee-cart/clients"
              payload: { company_name: "Acme", contact_email: "acme@x.com" }
              as: OperationsManager
              captures: { client_id: $.data.id }
            - call: "POST /coffee-cart/carts"
              payload: { cart_code: "CART-A", max_drinks_per_hour: 200, requires_power_hookup: false, requires_water_hookup: false, home_base_lat: 37.0, home_base_lng: -122.0 }
              as: OperationsManager
              captures: { cart_id: $.data.id, cart_v0: $.data.version }
            - call: "POST /coffee-cart/baristas"
              payload: { full_name: "Bia", skill_level: "LEAD", latte_art_certified: true, hourly_rate_cents: 3000, weekly_hour_cap: 40 }
              as: OperationsManager
              captures: { barista_id: $.data.id, barista_v0: $.data.version }
            - call: "POST /coffee-cart/packages"
              payload: { package_code: "PKG-FLAT", pricing_model: "FLAT", base_hours: 2, included_drinks: 100, flat_price_cents: 60000, per_cup_price_cents: 0, per_cup_minimum_cents: 0, max_guests: 80 }
              as: OperationsManager
              captures: { pkg_flat_id: $.data.id }
            - call: "POST /coffee-cart/travel-zones"
              payload: { zone_code: "ZONE-1", max_distance_km: 25, banded_fee_cents: 5000, per_km_rate_cents: 200, min_booking_subtotal_cents: 0 }
              as: OperationsManager
              captures: { zone1_id: $.data.id }
            - call: "POST /coffee-cart/bookings"
              payload: { client_id: "${client_id}", package_id: "${pkg_flat_id}", cart_id: "${cart_id}", travel_zone_id: "${zone1_id}", event_start: "2026-05-10T10:00:00Z", event_end: "2026-05-10T12:00:00Z", guest_count: 40, venue_provides_power: true, venue_provides_water: true, distance_km: 20 }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /coffee-cart/bookings/${booking_id}/assignments"
              payload: { barista_id: "${barista_id}", is_primary: true }
              as: OperationsManager
          trigger:
            - call: "POST /coffee-cart/bookings/${booking_id}/submit"
              payload: { expected_cart_version: "${cart_v0}", expected_primary_barista_version: "${barista_v0}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { travel: $.data.quoted_travel_fee_cents, variant: $.data.travel_variant_used }
          assert:
            - "travel == 4000"
            - "variant == METERED"

      - name: banded_travel_variant_applied_when_distance_over_threshold
        claim_type: correct_result
        grounds: [calculations.quoted_travel_fee_cents]
        distinguishing_aspect: "distance_km=30 (> METERED_MAX_KM=25) selects BANDED variant: fee = zone.banded_fee_cents (5000), independent of exact distance."
        test_recipe:
          setup: ["QUOTE booking distance=30 zone-1"]
          setup_api_calls:
            - call: "POST /coffee-cart/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /coffee-cart/clients"
