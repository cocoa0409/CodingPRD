# =============================================================================
# §1.9 Scaffold Corner Design — Breadth Coverage Index
# Task 2208 — Police Property and Evidence Room Management
#
# Walks references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1-§1.7 and
# emits one instance per applicable row. Corners already pinned by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) appear here as `excluded_because` stubs
# that name the owning §1.8 instance and carry no test_recipe.
#
# This file has its own anchor set (&c_*), because YAML anchors are file-local.
# The canonical empty-DB fixture chain is anchored once in the first instance and
# aliased by every later instance:
#   clock 2026-08-01T00:00:00Z; room CPD "Central Property Unit";
#   statutes TH-3 (STANDARD 365/30), AB-1 (STANDARD 0/0),
#            BIO-1 (BIOLOGICAL_INDEFINITE 365/30, court order required);
#   locations G-01 GENERAL(2), G-09 GENERAL(1), V-01 HIGH_VALUE_VAULT(3, dual
#             signature), R-01 REFRIGERATED(3, 3.5C),
#             R-09 REFRIGERATED(3, 6.0C — recorded warm, non-compliant);
#   custodians T-100 / T-101 EVIDENCE_TECH, L-200 LAB_ANALYST, I-300
#              INVESTIGATOR, A-400 AUDITOR (all certified to 2028-01-01);
#   cases 26-00001 (TH-3), 26-00002 (AB-1), 26-00003 (BIO-1).
# Every numeric and temporal literal was computed from the §1.3 formulas.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: evidence_item_intake_creation_returns_barcode_and_initial_states
        claim_type: Creation
        grounds:
          - "endpoints[POST /evidence-items]"
          - "entities.EvidenceItem.fields.barcode"
          - "entities.EvidenceItem.fields.item_sequence"
          - "entities.EvidenceItem.fields.custody_state"
          - "entities.EvidenceItem.fields.disposition_state"
          - "calculations.barcode_assignment"
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-01T00:00:00Z."
            - "Room CPD with statutes TH-3 / AB-1 / BIO-1, five storage bins, five custodians and three cases."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PropertyRoomManager
            - &c_room
              call: "POST /property-rooms"
              payload: { name: "Central Property Unit", agency_code: "CPD" }
              as: PropertyRoomManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - &c_stat_th3
              call: "POST /offense-statutes"
              payload: { offense_code: "TH-3", description: "Grand theft third degree", preservation_class: "STANDARD", statutory_retention_days: 365, appeal_window_days: 30, destruction_requires_court_order: false }
              as: PropertyRoomManager
              captures: { th3_id: $.data.id }
            - &c_stat_ab1
              call: "POST /offense-statutes"
              payload: { offense_code: "AB-1", description: "Abandoned property recovery", preservation_class: "STANDARD", statutory_retention_days: 0, appeal_window_days: 0, destruction_requires_court_order: false }
              as: PropertyRoomManager
              captures: { ab1_id: $.data.id }
            - &c_stat_bio
              call: "POST /offense-statutes"
              payload: { offense_code: "BIO-1", description: "Sexual assault kit preservation", preservation_class: "BIOLOGICAL_INDEFINITE", statutory_retention_days: 365, appeal_window_days: 30, destruction_requires_court_order: true }
              as: PropertyRoomManager
              captures: { bio_id: $.data.id }
            - &c_loc_g
              call: "POST /storage-locations"
              payload: { property_room_id: "${room_id}", code: "G-01", category: "GENERAL", capacity_slots: 2 }
              as: PropertyRoomManager
              captures: { loc_g_id: $.data.id, loc_g_v: $.data.version }
            - &c_loc_g9
              call: "POST /storage-locations"
              payload: { property_room_id: "${room_id}", code: "G-09", category: "GENERAL", capacity_slots: 1 }
              as: PropertyRoomManager
              captures: { loc_g9_id: $.data.id, loc_g9_v: $.data.version }
            - &c_loc_v
              call: "POST /storage-locations"
              payload: { property_room_id: "${room_id}", code: "V-01", category: "HIGH_VALUE_VAULT", capacity_slots: 3, requires_dual_signature: true }
              as: PropertyRoomManager
              captures: { loc_v_id: $.data.id, loc_v_v: $.data.version }
            - &c_loc_r
              call: "POST /storage-locations"
              payload: { property_room_id: "${room_id}", code: "R-01", category: "REFRIGERATED", capacity_slots: 3, temperature_c: 3.5 }
              as: PropertyRoomManager
              captures: { loc_r_id: $.data.id, loc_r_v: $.data.version }
            - &c_loc_rw
              call: "POST /storage-locations"
              payload: { property_room_id: "${room_id}", code: "R-09", category: "REFRIGERATED", capacity_slots: 3, temperature_c: 6.0 }
              as: PropertyRoomManager
              captures: { loc_rw_id: $.data.id, loc_rw_v: $.data.version }
            - &c_tech
              call: "POST /custodians"
              payload: { property_room_id: "${room_id}", badge_number: "T-100", full_name: "Tara Ng", role_type: "EVIDENCE_TECH", certification_expires_at: "2028-01-01T00:00:00Z" }
              as: PropertyRoomManager
              captures: { tech_id: $.data.id }
            - &c_tech2
              call: "POST /custodians"
              payload: { property_room_id: "${room_id}", badge_number: "T-101", full_name: "Tom Reed", role_type: "EVIDENCE_TECH", certification_expires_at: "2028-01-01T00:00:00Z" }
              as: PropertyRoomManager
              captures: { tech2_id: $.data.id }
            - &c_lab
              call: "POST /custodians"
              payload: { property_room_id: "${room_id}", badge_number: "L-200", full_name: "Lena Ruiz", role_type: "LAB_ANALYST", certification_expires_at: "2028-01-01T00:00:00Z" }
              as: PropertyRoomManager
              captures: { lab_id: $.data.id }
            - &c_inv
              call: "POST /custodians"
              payload: { property_room_id: "${room_id}", badge_number: "I-300", full_name: "Ivan Cole", role_type: "INVESTIGATOR", certification_expires_at: "2028-01-01T00:00:00Z" }
              as: PropertyRoomManager
              captures: { inv_id: $.data.id }
            - &c_aud
              call: "POST /custodians"
              payload: { property_room_id: "${room_id}", badge_number: "A-400", full_name: "Ada Vance", role_type: "AUDITOR", certification_expires_at: "2028-01-01T00:00:00Z" }
              as: PropertyRoomManager
              captures: { aud_id: $.data.id }
            - &c_case1
              call: "POST /cases"
              payload: { property_room_id: "${room_id}", case_number: "26-00001", offense_statute_id: "${th3_id}" }
              as: PropertyRoomManager
              captures: { case1_id: $.data.id }
            - &c_case2
              call: "POST /cases"
              payload: { property_room_id: "${room_id}", case_number: "26-00002", offense_statute_id: "${ab1_id}" }
              as: PropertyRoomManager
              captures: { case2_id: $.data.id }
            - &c_case3
              call: "POST /cases"
              payload: { property_room_id: "${room_id}", case_number: "26-00003", offense_statute_id: "${bio_id}" }
              as: PropertyRoomManager
              captures: { case3_id: $.data.id }
          trigger:
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Pawn ticket folder", category: "GENERAL", packaging_type: "RIGID_BOX", appraised_value_cents: 120000, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_id: $.data.id, item_barcode: $.data.barcode }
          assert:
            - "Responds 201 with the full EvidenceItem body"
            - "item_sequence == 1 and barcode == 'CPD-26-00001-0001-2' (agency CPD + case 26-00001 + 0001, check digit 2 from calculations.barcode_assignment)"
            - "intake_at == '2026-08-01T00:00:00.000Z' (the logical clock), while seized_at is echoed as '2026-07-31T12:00:00.000Z'"
            - "custody_state == 'LOGGED', disposition_state == 'RETAINED', storage_location_id == null, current_holder_id == null, open_transfer_count == 0"
            - "required_storage_category == 'GENERAL' (GENERAL category appraised at 120000 < 500000)"
            - "retention_basis == 'PRELIMINARY' and retention_release_at == '2027-08-01T00:00:00.000Z' (intake_at + 365 statutory days)"
            - "GET /retention-determinations?evidence_item_id=${item_id} returns total_count == 1 with basis == 'PRELIMINARY' and superseded == false"
            - "GET /cases/${case1_id} shows item_count == 1 and undisposed_item_count == 1"

      - name: evidence_item_retrieval_returns_stored_row
        claim_type: Retrieval
        grounds:
          - "endpoints[GET /evidence-items/{itemId}]"
          - "entities.EvidenceItem.fields.item_description"
        test_recipe:
          setup:
            - "Base fixture; one GENERAL item logged into case 26-00001."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_stat_ab1
            - *c_stat_bio
            - *c_loc_g
            - *c_loc_g9
            - *c_loc_v
            - *c_loc_r
            - *c_loc_rw
            - *c_tech
            - *c_tech2
            - *c_lab
            - *c_inv
            - *c_aud
            - *c_case1
            - *c_case2
            - *c_case3
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Pawn ticket folder", category: "GENERAL", packaging_type: "RIGID_BOX", appraised_value_cents: 120000, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_id: $.data.id }
          trigger:
            - call: "GET /evidence-items/${item_id}"
              payload: {}
              as: InternalAuditor
              as_user_id: "${aud_id}"
          assert:
            - "Responds 200 with id == ${item_id}"
            - "item_description == 'Pawn ticket folder', category == 'GENERAL', packaging_type == 'RIGID_BOX', appraised_value_cents == 120000"
            - "barcode == 'CPD-26-00001-0001-2' and case_id == ${case1_id}, identical to the creation response"
            - "version == 1 and updated_at == created_at (no write has touched the row since intake)"

      - name: evidence_item_listing_paginates_with_total_count
        claim_type: Listing
        grounds:
          - "endpoints[GET /evidence-items]"
          - "response_envelope.pagination_fields"
        test_recipe:
          setup:
            - "Base fixture; three GENERAL items logged into case 26-00001 in creation order."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_stat_ab1
            - *c_stat_bio
            - *c_loc_g
            - *c_loc_g9
            - *c_loc_v
            - *c_loc_r
            - *c_loc_rw
            - *c_tech
            - *c_tech2
            - *c_lab
            - *c_inv
            - *c_aud
            - *c_case1
            - *c_case2
            - *c_case3
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Item one", category: "GENERAL", packaging_type: "PAPER_BAG", appraised_value_cents: 1000, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item1_id: $.data.id }
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Item two", category: "GENERAL", packaging_type: "PAPER_BAG", appraised_value_cents: 2000, seized_at: "2026-07-31T12:05:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item2_id: $.data.id }
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Item three", category: "GENERAL", packaging_type: "PAPER_BAG", appraised_value_cents: 3000, seized_at: "2026-07-31T12:10:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item3_id: $.data.id }
          trigger:
            - call: "GET /evidence-items?case_id=${case1_id}&limit=2&offset=0"
              payload: {}
              as: PropertyRoomManager
              captures: { first_page_head: "$.data[0].id" }
            - call: "GET /evidence-items?case_id=${case1_id}&limit=2&offset=2"
              payload: {}
              as: PropertyRoomManager
              captures: { second_page_head: "$.data[0].id" }
          assert:
            - "Page one responds 200 with response_type == 'array', exactly 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Page two returns exactly 1 row, total_count == 3, has_more == false, offset == 2"
            - "${first_page_head} == ${item1_id} and ${second_page_head} == ${item3_id}: the two pages are disjoint and cover all three items"
            - "GET /evidence-items with no limit uses the default limit 10 and returns all 3 rows with has_more == false"

      - name: case_retrieval_with_unknown_id_not_found
        claim_type: Not Found
        grounds:
          - "endpoints[GET /cases/{caseId}]"
          - "validations[priority=5]"
          - "errors[ERR_CASE_NOT_FOUND]"
        test_recipe:
          setup:
            - "Base fixture only; the requested UUID belongs to no Case."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_stat_ab1
            - *c_stat_bio
            - *c_loc_g
            - *c_loc_g9
            - *c_loc_v
            - *c_loc_r
            - *c_loc_rw
            - *c_tech
            - *c_tech2
            - *c_lab
            - *c_inv
            - *c_aud
            - *c_case1
            - *c_case2
            - *c_case3
          trigger:
            - call: "GET /cases/00000000-0000-4000-8000-000000000abc"
              payload: {}
              as: PropertyRoomManager
              captures: { err: $.data.error_id }
          assert:
            - "Responds 404 with response_type == 'error' and ${err} == 'ERR_CASE_NOT_FOUND'"
            - "The three seeded cases are untouched: GET /cases returns total_count == 3"

      - name: evidence_item_intake_missing_required_seized_at_rejected
        claim_type: Required Fields
        grounds:
          - "endpoints[POST /evidence-items]"
          - "entities.EvidenceItem.fields.seized_at"
          - "validations[priority=6]"
          - "errors[ERR_INVALID_REQUEST]"
        test_recipe:
          setup:
            - "Base fixture; seized_at is an input field with no default, so omitting it is a shape violation."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_stat_ab1
            - *c_stat_bio
            - *c_loc_g
            - *c_loc_g9
            - *c_loc_v
            - *c_loc_r
            - *c_loc_rw
            - *c_tech
            - *c_tech2
            - *c_lab
            - *c_inv
            - *c_aud
            - *c_case1
            - *c_case2
            - *c_case3
          trigger:
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "No seizure timestamp", category: "GENERAL", packaging_type: "PAPER_BAG", appraised_value_cents: 500 }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Responds 400 with ${err} == 'ERR_INVALID_REQUEST'"
            - "No EvidenceItem row is created: GET /evidence-items?case_id=${case1_id} returns total_count == 0"
            - "Case.${case1_id}.item_count remains 0 and no barcode sequence is consumed, so the next successful intake still receives item_sequence == 1"

      - name: evidence_item_is_found_property_defaults_to_false
        claim_type: Defaults
        grounds:
          - "endpoints[POST /evidence-items]"
          - "entities.EvidenceItem.fields.is_found_property"
        test_recipe:
          setup:
            - "Base fixture; is_found_property is optional on intake with default false."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_stat_ab1
            - *c_stat_bio
            - *c_loc_g
            - *c_loc_g9
            - *c_loc_v
            - *c_loc_r
            - *c_loc_rw
            - *c_tech
            - *c_tech2
            - *c_lab
            - *c_inv
            - *c_aud
            - *c_case1
            - *c_case2
            - *c_case3
          trigger:
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Seized toolbox", category: "GENERAL", packaging_type: "RIGID_BOX", appraised_value_cents: 4000, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { omitted_id: $.data.id, omitted_flag: $.data.is_found_property }
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Bicycle found in alley", category: "GENERAL", packaging_type: "CHAIN_TAG_ONLY", appraised_value_cents: 4000, seized_at: "2026-07-31T12:00:00Z", is_found_property: true }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { explicit_id: $.data.id, explicit_flag: $.data.is_found_property }
          assert:
            - "Omitting the field yields ${omitted_flag} == false; supplying true yields ${explicit_flag} == true"
            - "The default is materialised, not left null: GET /evidence-items/${omitted_id} returns is_found_property == false"
            - "The default has downstream force: an owner claim on the defaulted item uses SEIZED_PROPERTY_NOTICE_DAYS 30, while a claim on ${explicit_id} uses FOUND_PROPERTY_NOTICE_DAYS 90"

      - name: evidence_item_barcode_computed_field_input_ignored
        claim_type: Computed Fields
        grounds:
          - "endpoints[POST /evidence-items]"
          - "entities.EvidenceItem.fields.barcode"
          - "entities.EvidenceItem.fields.required_storage_category"
          - "calculations.barcode_assignment"
        test_recipe:
          setup:
            - "Base fixture; the client posts values for the computed fields barcode, item_sequence and required_storage_category."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_stat_ab1
            - *c_stat_bio
            - *c_loc_g
            - *c_loc_g9
            - *c_loc_v
            - *c_loc_r
            - *c_loc_rw
            - *c_tech
            - *c_tech2
            - *c_lab
            - *c_inv
            - *c_aud
            - *c_case1
            - *c_case2
            - *c_case3
          trigger:
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Cash bundle", category: "CURRENCY", packaging_type: "SEALED_ENVELOPE", appraised_value_cents: 250000, seized_at: "2026-07-31T12:00:00Z", barcode: "ZZZ-99-99999-9999-9", item_sequence: 77, required_storage_category: "GENERAL", retention_release_at: "2030-01-01T00:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_id: $.data.id }
          assert:
            - "The client-supplied barcode is ignored: barcode == 'CPD-26-00001-0001-2', not 'ZZZ-99-99999-9999-9'"
            - "item_sequence == 1, not 77"
            - "required_storage_category == 'HIGH_VALUE_VAULT' (derived from category CURRENCY), not the posted 'GENERAL'"
            - "retention_release_at == '2027-08-01T00:00:00.000Z' from calculations.retention_release_at, not the posted 2030-01-01"

      - name: evidence_item_system_fields_generated_by_server
        claim_type: System Fields
        grounds:
          - "endpoints[POST /evidence-items]"
          - "entities.EvidenceItem.fields.intake_at"
          - "entities.EvidenceItem.fields.custody_state"
        test_recipe:
          setup:
            - "Base fixture; clock pinned at 2026-08-01T00:00:00Z, then advanced to 2026-08-03T09:30:00Z before the second intake."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_stat_ab1
            - *c_stat_bio
            - *c_loc_g
            - *c_loc_g9
            - *c_loc_v
            - *c_loc_r
            - *c_loc_rw
            - *c_tech
            - *c_tech2
            - *c_lab
            - *c_inv
            - *c_aud
            - *c_case1
            - *c_case2
            - *c_case3
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "First intake", category: "GENERAL", packaging_type: "PAPER_BAG", appraised_value_cents: 100, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { first_id: $.data.id, first_intake: $.data.intake_at }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:30:00Z" }
              as: PropertyRoomManager
          trigger:
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Second intake", category: "GENERAL", packaging_type: "PAPER_BAG", appraised_value_cents: 100, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { second_id: $.data.id, second_intake: $.data.intake_at }
          assert:
            - "Both rows carry a server-generated id, created_at, updated_at and version == 1"
            - "${first_intake} == '2026-08-01T00:00:00.000Z' and ${second_intake} == '2026-08-03T09:30:00.000Z': intake_at tracks the logical clock, not the client-supplied seized_at"
            - "${first_id} != ${second_id} and item_sequence is 1 then 2, assigned by the server"
            - "custody_state == 'LOGGED' and disposition_state == 'RETAINED' on both rows, set by the server rather than by input"

      - name: storage_location_create_invalid_enum_category_rejected
        claim_type: Type Constraints
        grounds:
          - "endpoints[POST /storage-locations]"
          - "entities.StorageLocation.fields.category"
          - "validations[priority=6]"
          - "errors[ERR_INVALID_REQUEST]"
        test_recipe:
          setup:
            - "Base fixture; 'FREEZER_ANNEX' is not one of the four declared StorageLocation categories."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_stat_ab1
            - *c_stat_bio
            - *c_loc_g
            - *c_loc_g9
            - *c_loc_v
            - *c_loc_r
            - *c_loc_rw
            - *c_tech
            - *c_tech2
            - *c_lab
            - *c_inv
            - *c_aud
            - *c_case1
            - *c_case2
            - *c_case3
          trigger:
            - call: "POST /storage-locations"
              payload: { property_room_id: "${room_id}", code: "X-01", category: "FREEZER_ANNEX", capacity_slots: 4 }
              as: PropertyRoomManager
              captures: { enum_err: $.data.error_id }
            - call: "POST /storage-locations"
              payload: { property_room_id: "${room_id}", code: "X-02", category: "GENERAL", capacity_slots: 0 }
              as: PropertyRoomManager
              captures: { range_err: $.data.error_id }
          assert:
            - "The unknown enum responds 400 with ${enum_err} == 'ERR_INVALID_REQUEST'"
            - "capacity_slots 0 violates '>= 1 and <= 1000' and also responds 400 with ${range_err} == 'ERR_INVALID_REQUEST'"
            - "Neither row is persisted: GET /storage-locations?property_room_id=${room_id} still returns total_count == 5"

      - name: chain_event_records_are_immutable_and_versionless
