              payload: { candidate_tower_id: "${tower_id}", requested_plan_id: "${std_plan}", contact_name: "Early Bird", premise_latitude: 41.2600, premise_longitude: -104.7600, premise_ground_elevation_m: 1210.0, roof_height_m: 4.0, declared_tree_line_height_m: 3.0, obstruction_class: "CLEAR", path_distance_km: 5.0 }
              as: SalesAgent
              captures: { sr_early: $.data.id, early_status: $.data.status }
            - call: "POST /serviceability-requests"
              payload: { candidate_tower_id: "${tower_id}", requested_plan_id: "${gig_plan}", contact_name: "Gig Buyer", premise_latitude: 41.2610, premise_longitude: -104.7610, premise_ground_elevation_m: 1210.0, roof_height_m: 4.0, declared_tree_line_height_m: 3.0, obstruction_class: "CLEAR", path_distance_km: 5.0 }
