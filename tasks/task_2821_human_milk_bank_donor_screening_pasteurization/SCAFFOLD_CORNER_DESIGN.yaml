      - name: pool_commit_gate_ladder_empty_then_donor_count_then_volume
        claim_type: cascading_validation
        grounds:
          - validations[priority=64]
          - validations[priority=65]
          - validations[priority=67]
          - errors[ERR_POOL_EMPTY]
          - errors[ERR_POOL_DONOR_COUNT_INSUFFICIENT]
