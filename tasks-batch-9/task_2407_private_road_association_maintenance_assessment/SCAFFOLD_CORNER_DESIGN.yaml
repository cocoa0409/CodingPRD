            - "a CONNECTION_FEE charge exists with amount_cents 841329, roll_id equal to the LEVIED roll, member_id equal to the parent parcel's member m2_id, status OPEN and due_date 2026-09-15"
            - "the association now reads reserve_balance_cents 686897, reserve_funding_ratio 0.6869 and reserve_posture ADEQUATE"

