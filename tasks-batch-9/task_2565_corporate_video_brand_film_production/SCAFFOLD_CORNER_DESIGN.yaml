              as_user_id: "producer-1"
            - call: "POST /locations"
              payload: { name: "Marden Yard", address: "6 Freight Way, Leeds", stage_count: 1, daily_fee_cents: 90000, insurance_minimum_cents: 50000000, permit_authority: "Leeds Film Office" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { loc: $.data.id }
            - call: "POST /shoot-days"
              payload: { project_id: "${proj}", location_id: "${loc}", shoot_date: "2026-09-10", call_time: "2026-09-10T06:00:00Z", wrap_time: "2026-09-10T16:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { day1: $.data.id }
            - call: "POST /compliance-certs"
              payload: { project_id: "${proj}", shoot_day_id: "${day1}", cert_type: "FILM_PERMIT", carrier_or_authority: "Leeds Film Office", reference_code: "PERMIT-MF-1", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-09-30T00:00:00Z", fee_cents: 40000 }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { permit: $.data.id }
          trigger:
            - call: "POST /shoot-days/${day1}/publish-call-sheet"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /compliance-certs/${permit}/decision"
              payload: { decision: "ISSUE", decision_note: "Coordinator trying to issue a permit." }
