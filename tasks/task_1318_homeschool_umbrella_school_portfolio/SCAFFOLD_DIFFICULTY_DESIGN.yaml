        grounds:
          - state_machines.Enrollment.REGISTERED_to_ACTIVE
          - validations[priority=11]
          - errors[ERR_NOTICE_NOT_ACKNOWLEDGED]
          - state_machines.NoticeOfIntent.FILED_to_ACKNOWLEDGED
        distinguishing_aspect: |
          Entity pair Enrollment <- NoticeOfIntent: the REGISTERED->ACTIVE
          transition is rejected while the enrollment's notice is merely FILED,
          and succeeds after that notice reaches ACKNOWLEDGED. Different entity
          pair than the graduation<-portfolio instance.
        test_recipe:
          setup:
            - "Year OPEN; family; grade-4 student; enrollment REGISTERED"
