            - "TreatmentPlan.${k_plan_np_id}.injections_administered == 1"

      - name: corner_closing_a_recall_from_initiated_cannot_skip_states
        claim_type: invalid_transitions
        grounds:
          - state_machines.LotRecall.CREDIT_RECONCILED_to_CLOSED
          - errors[ERR_RECALL_STATE_INVALID]
          - validations.priority_13
        distinguishing_aspect: "LotRecall must walk INITIATED -> PATIENTS_NOTIFIED -> RETURN_SHIPPED -> CREDIT_RECONCILED -> CLOSED; closing straight from INITIATED returns ERR_RECALL_STATE_INVALID (409) and neither ship-return nor reconcile-credit is reachable from INITIATED either."
        test_recipe:
          setup:
            - "the corner prologue with ENC-NP DOCUMENTED, so lot RX-9001 has 4 IN_STOCK and 1 ADMINISTERED vial"
