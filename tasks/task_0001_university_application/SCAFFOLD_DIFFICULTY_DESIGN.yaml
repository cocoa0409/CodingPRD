              captures: { rec_as2: $.data.id }
            - call: "POST /recommendation-requests/${rec_as1}/submit"
              payload: { rating: 5 }
              as: PlatformAdmin
            - call: "POST /recommendation-requests/${rec_as2}/submit"
              payload: { rating: 5 }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applications/${app_as_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${a_as_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applications/${app_as_id}/begin-review"
