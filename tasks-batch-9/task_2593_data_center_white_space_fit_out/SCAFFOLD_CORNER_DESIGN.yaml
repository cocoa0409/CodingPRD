        distinguishing_aspect: "The same energize call is refused with ERR_HALL_PHASE_INVALID 409 while the hall is PLANNING and succeeds unchanged once the hall reaches FIT_OUT — the action is gated by the parent hall's phase, not by anything on the busway."
