            - { call: "POST /fleet/parts", payload: { sku: "P-T7", description: "Belt", part_class: "CONSUMABLE", unit_cost_cents: 900, reorder_point: 0, initial_on_hand: 3, warranty_eligible: false }, as: PartsClerk, captures: { p: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "Lead", employee_ref: "T7A" }, as: MaintenanceSupervisor, captures: { m1: $.data.id } }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b}", wo_type: "CORRECTIVE", priority: "ROUTINE", planned_start_date: "2026-08-02", planned_end_date: "2026-08-03", estimated_labor_hours: 1, estimated_cost_cents: 900, lead_mechanic_id: "${m1}", expected_bus_version: "${bv}" }, as: MaintenanceSupervisor, captures: { wo: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "START" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SET_AWAITING_PARTS" }, as: Mechanic, as_user_id: "${m1}", captures: { st1: $.data.status } }
            - { call: "POST /fleet/work-orders/${wo}/part-lines", payload: { part_id: "${p}", qty: 1 }, as: PartsClerk, captures: { ln: $.data.id } }
          trigger:
            - { call: "POST /fleet/part-lines/${ln}/events", payload: { event_type: "ISSUE" }, as: Mechanic, as_user_id: "${m1}", captures: { lst: $.data.issue_status } }
            - { call: "GET /fleet/work-orders/${wo}", payload: {}, as: MaintenanceSupervisor, captures: { wst: $.data.status } }
          assert:
            - "WO entered AWAITING_PARTS via SET_AWAITING_PARTS"
            - "After ISSUE of the only RESERVED line: line issue_status == ISSUED and WO status == IN_PROGRESS automatically"

      - name: warranty_auto_draft_on_base_eligible_wo_close
        claim_type: cross_entity
        grounds:
          - state_machines.WorkOrder.PENDING_QA_to_CLOSED
          - entities.WarrantyClaim.fields.auto_created
        distinguishing_aspect: "Closing a CORRECTIVE WO whose bus was inside base warranty at open auto-creates exactly one DRAFT BASE_OEM claim with auto_created true — discoverable via GET /fleet/work-orders/{id}/warranty-claims."
        test_recipe:
          setup: ["Bus inside base warranty (odo 50000 <= 100000, opened 2026-08-02 <= 2027-01-01); labor-only CORRECTIVE WO"]
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "T8", vin: "VINT8", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 50000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 100000, base_warranty_expiry_date: "2027-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b: $.data.id, bv: $.data.version } }
            - { call: "POST /fleet/mechanics", payload: { name: "Lead", employee_ref: "T8A" }, as: MaintenanceSupervisor, captures: { m1: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "QA", employee_ref: "T8B" }, as: MaintenanceSupervisor, captures: { m2: $.data.id } }
            - { call: "POST /fleet/mechanics/${m2}/certifications", payload: { cert_type: "QA_AUTHORITY", issued_date: "2026-01-01", expiry_date: "2027-01-01" }, as: MaintenanceSupervisor }
