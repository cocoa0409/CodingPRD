          - entities.Lane.fields.status
          - errors[ERR_LANE_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair RunListEntry->Lane: open-bidding on a lot is gated on its referenced Lane.status ==
          ACTIVE (a different entity). The start cascade flips the lane PLANNED->ACTIVE, and only
          then does the lot transition SCHEDULED->BIDDING_OPEN — asserted by Lane.status==ACTIVE and
          RunListEntry.status==BIDDING_OPEN in the same chain.
        test_recipe:
          setup:
            - "Sale RUNNING (start activated lane to ACTIVE); lot SCHEDULED in that ACTIVE lane"
