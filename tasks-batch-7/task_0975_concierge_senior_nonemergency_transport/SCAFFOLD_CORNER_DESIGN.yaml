            - { call: "POST /rides/${ride}/dispatch", as: Coordinator, as_user_id: "coord-1", captures: { asg: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:31:00Z" }, as: PlatformAdmin }
            - { call: "POST /ops/run-cycle", as: PlatformAdmin, captures: { expired: $.data.expired_assignment_ids } }
            - { call: "GET /assignments/${asg}", as: Coordinator, captures: { st: $.data.status } }
