# =============================================================================
# Structured Cabling & Low-Voltage Contracting — benchmark seed tables (v1)
# §1.0–§1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 in
# SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2942. Structured Cabling & Low-Voltage Contracting (structured cabling contractor):
  pathway and space design with cable tray, conduit fill and separation from power,
  cable type selection by application, distance limits and plenum-rating requirements,
  labeling and administration standards for identifiers, records and drawings,
  termination, testing and certification of every link with test result reporting,
  rack elevation design, grounding, bonding and power distribution in telecom rooms,
  coordination with ceiling, electrical and mechanical trades on installation sequence,
  warranty registration through manufacturer programs, moves-adds-changes ticketing
  after occupancy

domain_name: structured-cabling-contracting
api_prefix: /cabling

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: graph_constraint
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: graph
  # Peer entities linked by FKs, PLUS two self-referential edges
  # (PathwaySegment.upstream_segment_id, TradeCoordination.predecessor_coordination_id)
  # PLUS a many-to-many junction (LinkPathwayRoute joins Link x PathwaySegment).
  # No nesting of business resources in URL paths — every collection is top-level
  # under /cabling; sub-resource GETs exist only as reverse-reachability reads.

  state_machine_shape: cyclic
  # Link.install_state cycles TESTED_FAIL -> TERMINATED -> TESTED_* (retest loop);
  # MacTicket cycles IN_PROGRESS -> SUBMITTED (rework loop);
  # WarrantyRegistration cycles REJECTED -> DRAFT (reopen loop);
  # Link additionally carries a SECOND independent dimension (record_state) that
  # advances independently of install_state and gates certification.

  relationship_patterns:
    - one_to_many          # CablingProject -> TelecomRoom / PathwaySegment / Link
    - many_to_many         # Link <-> PathwaySegment via LinkPathwayRoute
    - self_referential     # PathwaySegment.upstream_segment_id, TradeCoordination.predecessor_coordination_id
    - cross_aggregate      # Link -> TelecomRoom.grounding_status, MacTicket -> CablingProject.occupancy_status

  role_model: segregation_of_duties
  # The X-User-ID that terminated a Link may not certify it, and may not be the
  # X-User-ID that recorded its passing test. Roles are otherwise peer-scoped.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 12 entities / 63 endpoints / 59 error codes / 15 calculations (4 of them
  # dual-variant) / 10 state machines with transitions plus one stateless Rack
  # ledger entry (5 cyclic, 2 independent dimensions on Link) /
  # 6 OCC-guarded write endpoints.

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: CablingProject
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Project name", constraints: "1..120 chars" }
      - { name: site_code, type: string, source: input, description: "Owner site code", constraints: "^[A-Z]{2,4}[0-9]{1,2}$" }
      - { name: plenum_ceiling, type: boolean, source: input, description: "True when the ceiling cavity is a plenum air-handling space" }
      - { name: identifier_scheme, type: enum, source: input, description: "TIA-606 identifier class governing Link.identifier format", constraints: "TIA_606_CLASS_1 | TIA_606_CLASS_2" }
      - { name: warranty_program, type: enum, source: input, default: STANDARD_15Y, description: "Manufacturer program the project intends to register under", constraints: "NONE | STANDARD_15Y | EXTENDED_25Y" }
      - { name: mac_budget_cents, type: integer, source: input, default: 500000, description: "Post-occupancy moves-adds-changes budget in cents", constraints: ">= 0" }
      - { name: occupancy_status, type: enum, source: system, default: PRE_OCCUPANCY, description: "PRE_OCCUPANCY | OCCUPIED — flipped by POST /cabling/projects/{project_id}/occupancy" }
      - { name: total_link_count, type: integer, source: computed, description: "Count of Link rows for this project in any install_state (see calculations.project_certification_rollup)" }
      - { name: certified_link_count, type: integer, source: computed, description: "Count of Link rows with install_state == CERTIFIED" }
      - { name: failed_link_count, type: integer, source: computed, description: "Count of Link rows with install_state == TESTED_FAIL" }
      - { name: completeness_pct_strict, type: number, source: computed, description: "STRICT variant of certification completeness, 2dp; 0.00 when total_link_count == 0" }
      - { name: completeness_pct_provisional, type: number, source: computed, description: "PROVISIONAL variant of certification completeness, 2dp; counts CERTIFIED + TESTED_PASS" }
      - { name: warranty_status, type: enum, source: computed, default: NOT_ELIGIBLE, description: "NOT_ELIGIBLE | ELIGIBLE | SUBMITTED | REGISTERED | REJECTED | REVOKED — derived from completeness_pct_strict and WarrantyRegistration transitions" }
      - { name: as_built_cost_cents, type: integer, source: computed, description: "Installed cable material + termination labour, per calculations.project_as_built_cost" }
      - { name: consumed_mac_cents, type: integer, source: computed, default: 0, description: "MAC spend already committed, per calculations.mac_budget_ledger" }

  - name: TelecomRoom
    parent: CablingProject
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CablingProject.id; owning project" }
      - { name: room_code, type: string, source: input, description: "Room identifier used as the first field of a Class 1 link identifier", constraints: "^[A-Z]{2}[0-9]{2}$; unique per project" }
      - { name: floor, type: integer, source: input, description: "Floor number the room sits on" }
      - { name: branch_circuit_amps, type: integer, source: input, description: "Dedicated branch circuit rating feeding the room", constraints: ">= 15" }
      - { name: ups_capacity_va, type: integer, source: input, description: "UPS apparent-power capacity available to racks in this room", constraints: ">= 0" }
      - { name: room_state, type: enum, source: system, default: ROUGH_IN, description: "ROUGH_IN | GROUNDED | ENERGIZED — see state_machines.TelecomRoom" }
      - { name: tgb_installed, type: boolean, source: input, default: false, description: "Telecommunications grounding busbar present; set by grounding-verification" }
      - { name: bonding_conductor_awg, type: integer, source: input, description: "AWG size of the bonding conductor to the busbar; smaller number = larger conductor" }
      - { name: ground_resistance_milliohms, type: number, source: input, description: "Measured ground resistance in milliohms" }
      - { name: grounding_status, type: enum, source: computed, default: UNVERIFIED, description: "UNVERIFIED | COMPLIANT | NON_COMPLIANT — per calculations.grounding_compliance_evaluation" }
      - { name: power_load_va, type: integer, source: computed, default: 0, description: "Sum of Rack.power_draw_va for racks in this room" }
      - { name: power_headroom_va, type: integer, source: computed, description: "= ups_capacity_va - power_load_va; conserved per calculations.room_power_ledger" }

  - name: Rack
    parent: TelecomRoom
    common_fields: true
    fields:
      - { name: telecom_room_id, type: string, source: input, description: "FK -> TelecomRoom.id; room the rack stands in" }
      - { name: rack_code, type: string, source: input, description: "Rack identifier used as the second field of a link identifier", constraints: "^[A-Z]$; unique per telecom room" }
      - { name: total_ru, type: integer, source: input, description: "Rack usable height in rack units", constraints: "1..52" }
      - { name: occupied_ru, type: integer, source: computed, default: 0, description: "Sum of (end_ru - start_ru + 1) over RackUnitAssignment rows with assignment_state == ACTIVE" }
      - { name: available_ru, type: integer, source: computed, description: "= total_ru - occupied_ru" }
      - { name: power_draw_va, type: integer, source: computed, default: 0, description: "Sum of RackUnitAssignment.power_va over rows with assignment_state == ACTIVE" }

  - name: RackUnitAssignment
    parent: Rack
    common_fields: true
    fields:
      - { name: rack_id, type: string, source: input, description: "FK -> Rack.id; rack this equipment occupies" }
      - { name: equipment_label, type: string, source: input, description: "Equipment name shown on the rack elevation drawing" }
      - { name: start_ru, type: integer, source: input, description: "Lowest rack unit occupied, inclusive", constraints: ">= 1" }
      - { name: end_ru, type: integer, source: input, description: "Highest rack unit occupied, inclusive", constraints: ">= start_ru" }
      - { name: span_ru, type: integer, source: computed, description: "= end_ru - start_ru + 1" }
      - { name: power_va, type: integer, source: input, description: "Apparent power drawn by this equipment", constraints: ">= 0" }
      - { name: assignment_state, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RELEASED — see state_machines.RackUnitAssignment" }
      - { name: released_reason, type: string, source: input, description: "Reason captured when the assignment is released; null while ACTIVE" }

  - name: PathwaySegment
    parent: CablingProject
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CablingProject.id; owning project" }
      - { name: segment_code, type: string, source: input, description: "Segment identifier on the pathway drawing", constraints: "unique per project" }
      - { name: pathway_type, type: enum, source: input, description: "CABLE_TRAY | EMT_CONDUIT | INNERDUCT | J_HOOK" }
      - { name: usable_area_sq_mm, type: number, source: input, description: "Interior cross-sectional area available for cable, sq mm", constraints: "> 0" }
      - { name: length_m, type: number, source: input, description: "Segment run length in metres", constraints: "> 0" }
      - { name: bend_count, type: integer, source: input, default: 0, description: "Number of 90-degree equivalent bends in the segment", constraints: ">= 0" }
      - { name: in_plenum_space, type: boolean, source: input, default: false, description: "Segment passes through a plenum air-handling space" }
      - { name: shared_with_power, type: boolean, source: input, default: false, description: "Segment shares its space with unshielded power conductors" }
      - { name: power_separation_mm, type: integer, source: input, default: 0, description: "Clear separation from the nearest power conductor, mm" }
      - { name: upstream_segment_id, type: string, source: input, description: "FK -> PathwaySegment.id; the segment feeding this one, null at a pathway root" }
      - { name: pathway_depth, type: integer, source: computed, description: "Hop count from the pathway root, per calculations.pathway_graph_depth; 0 at a root" }
      - { name: occupying_route_count, type: integer, source: computed, default: 0, description: "Count of LinkPathwayRoute rows on this segment with route_state == OCCUPYING" }
      - { name: fill_area_used_sq_mm, type: number, source: computed, default: 0, description: "Sum of CableType.cross_section_area_sq_mm over OCCUPYING routes, 2dp" }
      - { name: allowed_fill_pct, type: integer, source: computed, description: "Code-allowed fill percentage for the current occupying count, per calculations.pathway_fill_evaluation" }
      - { name: fill_ratio, type: number, source: computed, default: 0, description: "= round(fill_area_used_sq_mm / usable_area_sq_mm, 4)" }
      - { name: pathway_state, type: enum, source: system, default: SERVICEABLE, description: "SERVICEABLE | CONDEMNED — see state_machines.PathwaySegment" }
      - { name: condemned_reason, type: string, source: input, description: "Inspection finding captured on condemn; null while SERVICEABLE" }

  - name: CableType
    parent: null
    common_fields: false
    fields:
      - { name: category, type: enum, source: input, description: "CAT5E | CAT6 | CAT6A | OM4_MMF | OS2_SMF | COAX_RG6" }
      - { name: jacket_rating, type: enum, source: input, description: "CM | CMR | CMP | LSZH — CMP and LSZH are plenum-admissible" }
      - { name: outer_diameter_mm, type: number, source: input, description: "Nominal cable outside diameter, mm", constraints: "> 0" }
      - { name: cross_section_area_sq_mm, type: number, source: computed, description: "= round(PI * (outer_diameter_mm / 2)^2, 2)" }
      - { name: max_channel_length_m, type: number, source: input, description: "Manufacturer channel length limit for this cable, metres", constraints: "> 0" }
      - { name: shielded, type: boolean, source: input, default: false, description: "Overall foil/braid screen present" }
      - { name: cost_per_meter_cents, type: integer, source: input, description: "Installed material cost per metre, cents", constraints: ">= 0" }
      - { name: applications, type: array, source: input, description: "Applications this cable is approved for", constraints: "non-empty subset of {DATA_HORIZONTAL, BACKBONE, WAP, CAMERA, ACCESS_CONTROL, AV_DISTRIBUTION}" }

  - name: Link
    parent: CablingProject
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CablingProject.id; owning project" }
      - { name: telecom_room_id, type: string, source: input, description: "FK -> TelecomRoom.id; room housing the link's horizontal cross-connect" }
      - { name: cable_type_id, type: string, source: input, description: "FK -> CableType.id; cable selected for this link" }
      - { name: identifier, type: string, source: input, description: "TIA-606 link identifier; format governed by CablingProject.identifier_scheme, unique per project" }
      - { name: application, type: enum, source: input, description: "DATA_HORIZONTAL | BACKBONE | WAP | CAMERA | ACCESS_CONTROL | AV_DISTRIBUTION; must appear in CableType.applications" }
      - { name: horizontal_length_m, type: number, source: input, description: "Measured horizontal cable run, metres", constraints: "> 0" }
      - { name: consolidation_point_stub_m, type: number, source: input, default: 0, description: "Extra cable between a consolidation point and the work area outlet, metres", constraints: ">= 0" }
      - { name: patch_cord_allowance_m, type: number, source: input, default: 0, description: "Total patch/equipment cord length at both ends, metres", constraints: ">= 0" }
      - { name: permanent_link_length_m, type: number, source: computed, description: "PERMANENT_LINK variant length per calculations.link_length_evaluation, 2dp" }
      - { name: channel_length_m, type: number, source: computed, description: "CHANNEL variant length per calculations.link_length_evaluation, 2dp" }
      - { name: install_state, type: enum, source: system, default: DESIGNED, description: "DESIGNED | PULLED | TERMINATED | TESTED_PASS | TESTED_FAIL | CERTIFIED — see state_machines.Link (install_state)" }
      - { name: record_state, type: enum, source: system, default: UNLABELED, description: "UNLABELED | LABELED | RECORDED — independent administration dimension, see state_machines.Link (record_state)" }
      - { name: applied_identifier, type: string, source: input, description: "Identifier physically applied at the outlet; must equal identifier" }
      - { name: drawing_sheet_ref, type: string, source: input, description: "As-built drawing sheet the link appears on; set when record_state becomes RECORDED" }
      - { name: installer_user_id, type: string, source: system, description: "Opaque X-User-ID that performed the TERMINATED transition; null before termination" }
      - { name: certifier_user_id, type: string, source: system, description: "Opaque X-User-ID that performed the CERTIFIED transition; null before certification" }
      - { name: routed_segment_count, type: integer, source: computed, default: 0, description: "Count of LinkPathwayRoute rows for this link with route_state == OCCUPYING" }
      - { name: test_attempt_count, type: integer, source: computed, default: 0, description: "Count of TestResult rows recorded against this link" }
      - { name: latest_test_outcome, type: enum, source: computed, description: "Outcome of the TestResult with the greatest recorded_at for this link; null when none exist" }
      - { name: material_cost_cents, type: integer, source: computed, default: 0, description: "Per-link rounded material cost, per calculations.project_as_built_cost step 1" }

  - name: LinkPathwayRoute
    parent: Link
    common_fields: true
    fields:
      - { name: link_id, type: string, source: input, description: "FK -> Link.id; link occupying the pathway" }
      - { name: pathway_segment_id, type: string, source: input, description: "FK -> PathwaySegment.id; segment being occupied" }
      - { name: sequence_index, type: integer, source: input, description: "1-based position of this segment in the link's ordered pathway chain", constraints: ">= 1; unique per link among OCCUPYING routes" }
      - { name: consumed_area_sq_mm, type: number, source: computed, description: "Snapshot of CableType.cross_section_area_sq_mm at route creation, 2dp; the exact amount released on withdraw" }
      - { name: route_state, type: enum, source: system, default: OCCUPYING, description: "OCCUPYING | WITHDRAWN | SUSPENDED — see state_machines.LinkPathwayRoute" }

  - name: TestResult
    parent: Link
    common_fields: false
    fields:
      - { name: link_id, type: string, source: input, description: "FK -> Link.id; link under test" }
      - { name: test_standard, type: enum, source: input, description: "PERMANENT_LINK | CHANNEL — selects the length variant and limit used to grade the result" }
      - { name: tester_model, type: string, source: input, description: "Field tester model string printed on the certification report" }
      - { name: insertion_loss_db, type: number, source: input, description: "Worst-pair insertion loss measured, dB", constraints: ">= 0" }
      - { name: insertion_loss_budget_db, type: number, source: computed, description: "Allowed insertion loss for the graded length, 2dp" }
      - { name: next_margin_db, type: number, source: input, description: "Worst-pair NEXT margin, dB; negative means the limit line was crossed" }
      - { name: return_loss_margin_db, type: number, source: input, description: "Worst-pair return loss margin, dB" }
      - { name: worst_margin_db, type: number, source: computed, description: "= min(next_margin_db, return_loss_margin_db)" }
      - { name: length_measured_m, type: number, source: input, description: "Length the tester reported, metres" }
      - { name: outcome, type: enum, source: computed, description: "PASS | PASS_ASTERISK | FAIL — per calculations.link_test_outcome" }
      - { name: failure_reason, type: enum, source: computed, description: "LENGTH_LIMIT | INSERTION_LOSS | MARGIN | null — set only when outcome == FAIL" }
      - { name: tester_user_id, type: string, source: system, description: "Opaque X-User-ID that recorded the result" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical clock reading when the result was recorded, ISO 8601 UTC with 3 fractional digits" }

  - name: WarrantyRegistration
    parent: CablingProject
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CablingProject.id; project being registered" }
      - { name: manufacturer_program, type: enum, source: input, description: "STANDARD_15Y | EXTENDED_25Y — manufacturer warranty programme applied for" }
      - { name: registration_state, type: enum, source: system, default: DRAFT, description: "DRAFT | READY | SUBMITTED | REGISTERED | REJECTED | REVOKED — see state_machines.WarrantyRegistration" }
      - { name: pinned_project_version, type: integer, source: system, description: "CablingProject.version captured when the registration became READY; re-validated at decision time" }
      - { name: submitted_certified_link_count, type: integer, source: system, description: "CablingProject.certified_link_count captured at SUBMITTED; frozen thereafter" }
      - { name: coverage_years, type: integer, source: computed, description: "Warranty term granted, per calculations.warranty_coverage_determination; computed at SUBMITTED" }
      - { name: registration_number, type: string, source: input, description: "Manufacturer-issued number supplied with a REGISTER decision" }
      - { name: rejection_reason, type: string, source: input, description: "Reason supplied with a REJECT decision" }

  - name: MacTicket
    parent: CablingProject
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CablingProject.id; project the ticket belongs to" }
      - { name: link_id, type: string, source: input, description: "FK -> Link.id; link being moved, added to or changed" }
      - { name: telecom_room_id, type: string, source: input, description: "FK -> TelecomRoom.id; room the crew will work in" }
      - { name: ticket_type, type: enum, source: input, description: "MOVE | ADD | CHANGE" }
      - { name: requested_window_start, type: datetime, source: input, description: "Client's requested work window start, ISO 8601 UTC" }
      - { name: requested_window_end, type: datetime, source: input, description: "Client's requested work window end, ISO 8601 UTC", constraints: "> requested_window_start" }
      - { name: scheduled_window_start, type: datetime, source: input, description: "Confirmed window start stamped at SCHEDULED; null before" }
      - { name: scheduled_window_end, type: datetime, source: input, description: "Confirmed window end stamped at SCHEDULED; null before" }
      - { name: labor_hours_estimate, type: number, source: input, description: "Estimated crew hours", constraints: "> 0" }
      - { name: actual_labor_hours, type: number, source: input, description: "Crew hours reported at completion; null before" }
      - { name: expedite_requested, type: boolean, source: input, default: false, description: "Client asked for out-of-cycle expedited service" }
      - { name: estimated_billed_cents, type: integer, source: computed, description: "ESTIMATE variant of calculations.mac_ticket_billing, stamped at SCHEDULED" }
      - { name: final_billed_cents, type: integer, source: computed, description: "FINAL variant of calculations.mac_ticket_billing, stamped at COMPLETED" }
      - { name: new_identifier, type: string, source: input, description: "Replacement TIA-606 identifier applied by a CHANGE ticket; null otherwise" }
      - { name: ticket_state, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | SCHEDULED | IN_PROGRESS | COMPLETED | REJECTED — see state_machines.MacTicket" }
      - { name: rework_count, type: integer, source: computed, default: 0, description: "Number of IN_PROGRESS -> SUBMITTED rework transitions this ticket has taken" }

  - name: TradeCoordination
    parent: CablingProject
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> CablingProject.id; owning project" }
      - { name: trade, type: enum, source: input, description: "CEILING | ELECTRICAL | MECHANICAL | FIRE_ALARM" }
      - { name: milestone, type: enum, source: input, description: "PATHWAY_ROUGH_IN | CEILING_CLOSE | POWER_ENERGIZE | DUCT_CLOSE" }
      - { name: predecessor_coordination_id, type: string, source: input, description: "FK -> TradeCoordination.id; coordination that must be RELEASED first, null when this is the sequence head" }
      - { name: confirmed_date, type: string, source: input, description: "Date the trade confirmed the milestone, YYYY-MM-DD; null before CONFIRMED" }
      - { name: coordination_state, type: enum, source: system, default: REQUESTED, description: "REQUESTED | CONFIRMED | RELEASED | BLOCKED — see state_machines.TradeCoordination" }
      - { name: block_reason, type: string, source: input, description: "Reason a confirmed milestone was blocked by another trade; null otherwise" }

# =============================================================================
# §1.2 State Machine Table
# Ten machines. Link carries TWO independent dimensions (install_state and
# record_state) that advance independently on the same row; Link.install_state,
# MacTicket.ticket_state, TelecomRoom.room_state, TradeCoordination.coordination_state
# and WarrantyRegistration.registration_state each contain a cycle.
# =============================================================================
state_machines:

  - entity: CablingProject
    state_field: occupancy_status
    initial_state: PRE_OCCUPANCY
    terminal_states: [OCCUPIED]
    transitions:
      - from: PRE_OCCUPANCY
        to: OCCUPIED
        trigger: "POST /cabling/projects/{project_id}/occupancy with occupancy_status=OCCUPIED"
        actor: ProjectManager
        preconditions:
          - "completeness_pct_strict >= 90.00 (owner will not accept the space below 90% certified links)"
          - "every TradeCoordination of this project with trade == CEILING is in coordination_state == RELEASED"
        side_effects:
          - "occupancy_status = OCCUPIED"
          - "unlocks POST /cabling/mac-tickets for this project (see validations priority 125 ERR_PROJECT_NOT_OCCUPIED)"
          - "increments CablingProject.version by 1"

  - entity: TelecomRoom
    state_field: room_state
    initial_state: ROUGH_IN
    terminal_states: [ENERGIZED]
    transitions:
      - from: ROUGH_IN
        to: GROUNDED
        trigger: "POST /cabling/telecom-rooms/{room_id}/grounding-verification whose graded grounding_status == COMPLIANT"
        actor: ProjectManager
        preconditions:
          - "bonding_conductor_awg <= 6 (else ERR_BONDING_NON_COMPLIANT, request rejected with no state change)"
          - "calculations.grounding_compliance_evaluation grades COMPLIANT"
        side_effects:
          - "grounding_status = COMPLIANT"
          - "room_state = GROUNDED"
          - "unblocks Link PULLED -> TERMINATED for links whose telecom_room_id is this room"
          - "increments TelecomRoom.version by 1"
      - from: ROUGH_IN
        to: ROUGH_IN
        trigger: "POST /cabling/telecom-rooms/{room_id}/grounding-verification whose graded grounding_status == NON_COMPLIANT"
        actor: ProjectManager
        preconditions: ["bonding_conductor_awg <= 6"]
        side_effects:
          - "grounding_status = NON_COMPLIANT"
          - "room_state unchanged (ROUGH_IN)"
          - "increments TelecomRoom.version by 1"
        note: "Self-loop: the measurement is recorded even when it fails the code limit."
      - from: GROUNDED
        to: ROUGH_IN
        trigger: "POST /cabling/telecom-rooms/{room_id}/grounding-verification whose graded grounding_status == NON_COMPLIANT"
        actor: ProjectManager
        preconditions: ["bonding_conductor_awg <= 6"]
        side_effects:
          - "grounding_status = NON_COMPLIANT"
          - "room_state = ROUGH_IN (demotion; cycle back)"
          - "increments TelecomRoom.version by 1"
      - from: GROUNDED
        to: ENERGIZED
        trigger: "POST /cabling/telecom-rooms/{room_id}/energize"
        actor: ProjectManager
        preconditions:
          - "grounding_status == COMPLIANT (else ERR_ROOM_NOT_GROUNDED)"
          - "power_load_va <= ups_capacity_va (else ERR_POWER_CAPACITY_EXCEEDED)"
          - "the project has a TradeCoordination with trade == ELECTRICAL and milestone == POWER_ENERGIZE in coordination_state == RELEASED (else ERR_TRADE_NOT_COORDINATED)"
        side_effects:
          - "room_state = ENERGIZED"
          - "increments TelecomRoom.version by 1"

  - entity: Rack
    state_field: null
    initial_state: null
    terminal_states: []
    transitions: []
    note: "Rack has no lifecycle of its own; it is a capacity ledger reconciled by calculations.rack_ru_ledger and calculations.room_power_ledger."

  - entity: RackUnitAssignment
    state_field: assignment_state
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: null
        to: ACTIVE
        trigger: "POST /cabling/rack-unit-assignments"
        actor: DesignEngineer
        preconditions:
          - "payload expected_rack_version equals Rack.version (else ERR_STALE_RACK_VERSION)"
          - "end_ru <= Rack.total_ru (else ERR_RACK_CAPACITY_EXCEEDED)"
          - "closed interval [start_ru, end_ru] shares no rack unit with any ACTIVE assignment on the rack (else ERR_RACK_RU_CONFLICT)"
          - "TelecomRoom.power_load_va + power_va <= TelecomRoom.ups_capacity_va (else ERR_POWER_CAPACITY_EXCEEDED)"
        side_effects:
          - "span_ru = end_ru - start_ru + 1"
          - "Rack.occupied_ru += span_ru; Rack.available_ru recomputed; Rack.power_draw_va += power_va (hop 2)"
          - "TelecomRoom.power_load_va recomputed from its racks; TelecomRoom.power_headroom_va = ups_capacity_va - power_load_va (hop 3, caused by the Rack ledger change)"
          - "increments Rack.version by 1; increments TelecomRoom.version by 1"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /cabling/rack-unit-assignments/{assignment_id}/release"
        actor: DesignEngineer
        preconditions:
          - "assignment_state == ACTIVE (else ERR_INVALID_ASSIGNMENT_STATE)"
          - "payload expected_rack_version equals Rack.version (else ERR_STALE_RACK_VERSION)"
        side_effects:
          - "assignment_state = RELEASED; released_reason stored"
          - "Rack.occupied_ru -= span_ru; Rack.power_draw_va -= power_va (hop 2)"
          - "TelecomRoom.power_load_va and power_headroom_va recomputed (hop 3)"
          - "compensating invariant: TelecomRoom.power_load_va + TelecomRoom.power_headroom_va == TelecomRoom.ups_capacity_va holds before and after, and power_load_va returns to its pre-assignment value"
          - "increments Rack.version by 1; increments TelecomRoom.version by 1"

  - entity: PathwaySegment
    state_field: pathway_state
    initial_state: SERVICEABLE
    terminal_states: [CONDEMNED]
    transitions:
      - from: SERVICEABLE
        to: CONDEMNED
        trigger: "POST /cabling/pathway-segments/{segment_id}/condemn"
        actor: ProjectManager
        preconditions:
          - "pathway_state == SERVICEABLE (else ERR_SEGMENT_CONDEMNED)"
        side_effects:
          - "pathway_state = CONDEMNED; condemned_reason stored (hop 1)"
          - "hop 2 — caused by hop 1: every LinkPathwayRoute on this segment with route_state == OCCUPYING becomes SUSPENDED; fill_area_used_sq_mm is reduced by each route's consumed_area_sq_mm (reaching 0.00), occupying_route_count -> 0, allowed_fill_pct and fill_ratio recomputed"
          - "hop 3 — caused by hop 2: every Link that lost an OCCUPYING route has routed_segment_count recomputed and, when its install_state is one of PULLED/TERMINATED/TESTED_PASS/TESTED_FAIL/CERTIFIED, install_state reverts to DESIGNED, record_state reverts to UNLABELED, installer_user_id and certifier_user_id are cleared, and Link.version increments by 1"
          - "hop 4 — caused by hop 3: CablingProject counters (total_link_count, certified_link_count, failed_link_count, completeness_pct_strict, completeness_pct_provisional, as_built_cost_cents) are recomputed; when warranty_status was REGISTERED it becomes REVOKED and the REGISTERED WarrantyRegistration becomes REVOKED; when warranty_status was ELIGIBLE and completeness_pct_strict falls below 100.00 it becomes NOT_ELIGIBLE and every READY WarrantyRegistration reverts to DRAFT; CablingProject.version increments by 1"
          - "increments PathwaySegment.version by 1"
        note: "Cascade B. Each hop is caused by the previous hop, not by the condemn call itself."

  - entity: LinkPathwayRoute
    state_field: route_state
    initial_state: OCCUPYING
    terminal_states: [WITHDRAWN, SUSPENDED]
    transitions:
      - from: null
        to: OCCUPYING
        trigger: "POST /cabling/link-routes"
        actor: DesignEngineer
        preconditions:
          - "Link.install_state == DESIGNED (else ERR_INVALID_LINK_STATE)"
          - "PathwaySegment.pathway_state == SERVICEABLE (else ERR_SEGMENT_CONDEMNED)"
          - "payload expected_segment_version equals PathwaySegment.version (else ERR_STALE_PATHWAY_VERSION)"
          - "plenum admissibility: when PathwaySegment.in_plenum_space is true, CableType.jacket_rating IN {CMP, LSZH} (else ERR_PLENUM_RATING_REQUIRED)"
          - "power separation: when PathwaySegment.shared_with_power is true, PathwaySegment.power_separation_mm >= required separation from calculations.power_separation_requirement (else ERR_POWER_SEPARATION_INSUFFICIENT)"
          - "sequence continuity: when sequence_index > 1, the link's OCCUPYING route at sequence_index - 1 sits on a segment whose id equals this segment's upstream_segment_id (else ERR_ROUTE_SEQUENCE_GAP)"
          - "fill: calculations.pathway_fill_evaluation admits the candidate (else ERR_PATHWAY_FILL_EXCEEDED)"
        side_effects:
          - "consumed_area_sq_mm = CableType.cross_section_area_sq_mm snapshot"
          - "PathwaySegment.occupying_route_count += 1; fill_area_used_sq_mm += consumed_area_sq_mm; allowed_fill_pct and fill_ratio recomputed"
          - "Link.routed_segment_count += 1"
          - "increments PathwaySegment.version by 1"
      - from: OCCUPYING
        to: WITHDRAWN
        trigger: "POST /cabling/link-routes/{route_id}/withdraw"
        actor: DesignEngineer
        preconditions:
          - "route_state == OCCUPYING (else ERR_INVALID_ROUTE_STATE)"
          - "Link.install_state == DESIGNED (else ERR_INVALID_LINK_STATE)"
          - "payload expected_segment_version equals PathwaySegment.version (else ERR_STALE_PATHWAY_VERSION)"
        side_effects:
          - "route_state = WITHDRAWN"
          - "PathwaySegment.occupying_route_count -= 1; fill_area_used_sq_mm -= consumed_area_sq_mm; allowed_fill_pct and fill_ratio recomputed"
          - "Link.routed_segment_count -= 1"
          - "compensating invariant: PathwaySegment.fill_area_used_sq_mm == sum of consumed_area_sq_mm over its OCCUPYING routes, before and after"
          - "increments PathwaySegment.version by 1"
      - from: OCCUPYING
        to: SUSPENDED
        trigger: "system — hop 2 of the POST /cabling/pathway-segments/{segment_id}/condemn cascade"
        actor: system
        preconditions: ["the owning PathwaySegment transitioned SERVICEABLE -> CONDEMNED"]
        side_effects:
          - "route_state = SUSPENDED"
          - "same fill release as WITHDRAWN"

  - entity: Link
    state_field: install_state
    initial_state: DESIGNED
    terminal_states: [CERTIFIED]
    transitions:
      - from: DESIGNED
        to: PULLED
        trigger: "POST /cabling/links/{link_id}/pull"
        actor: Installer
        preconditions:
          - "install_state == DESIGNED (else ERR_INVALID_LINK_STATE)"
          - "routed_segment_count >= 1 (else ERR_LINK_NOT_ROUTED)"
          - "every OCCUPYING route of this link sits on a PathwaySegment with pathway_state == SERVICEABLE (else ERR_SEGMENT_CONDEMNED)"
          - "the project has a TradeCoordination with trade == CEILING and milestone == PATHWAY_ROUGH_IN in coordination_state IN {CONFIRMED, RELEASED} (else ERR_TRADE_NOT_COORDINATED)"
          - "permanent_link_length_m <= the PERMANENT_LINK limit from calculations.link_length_evaluation (else ERR_LINK_LENGTH_EXCEEDED)"
        side_effects:
          - "install_state = PULLED"
          - "increments Link.version by 1"
      - from: PULLED
        to: TERMINATED
        trigger: "POST /cabling/links/{link_id}/terminate"
        actor: Installer
        preconditions:
          - "install_state == PULLED (else ERR_INVALID_LINK_STATE)"
          - "the link's TelecomRoom has grounding_status == COMPLIANT (else ERR_ROOM_NOT_GROUNDED)"
        side_effects:
          - "install_state = TERMINATED"
          - "installer_user_id = acting X-User-ID (overwritten on every re-termination)"
          - "increments Link.version by 1"
      - from: TESTED_FAIL
        to: TERMINATED
        trigger: "POST /cabling/links/{link_id}/terminate (re-termination after a failed test)"
        actor: Installer
        preconditions:
          - "install_state == TESTED_FAIL"
          - "the link's TelecomRoom has grounding_status == COMPLIANT (else ERR_ROOM_NOT_GROUNDED)"
        side_effects:
          - "install_state = TERMINATED"
          - "installer_user_id = acting X-User-ID"
          - "increments Link.version by 1"
        note: "Cycle edge: TERMINATED -> TESTED_FAIL -> TERMINATED is the remediation loop; test_attempt_count is never reset."
      - from: TERMINATED
        to: TESTED_PASS
        trigger: "POST /cabling/test-results whose graded outcome is PASS or PASS_ASTERISK"
        actor: TestTechnician
        preconditions:
          - "install_state IN {TERMINATED, TESTED_PASS, TESTED_FAIL} (else ERR_INVALID_LINK_STATE)"
        side_effects:
          - "install_state = TESTED_PASS"
          - "test_attempt_count += 1; latest_test_outcome = the graded outcome"
          - "increments Link.version by 1"
      - from: TERMINATED
        to: TESTED_FAIL
        trigger: "POST /cabling/test-results whose graded outcome is FAIL"
        actor: TestTechnician
        preconditions:
          - "install_state IN {TERMINATED, TESTED_PASS, TESTED_FAIL}"
        side_effects:
          - "install_state = TESTED_FAIL"
          - "test_attempt_count += 1; latest_test_outcome = FAIL"
          - "CablingProject.failed_link_count recomputed; CablingProject.version increments by 1"
      - from: TESTED_FAIL
        to: TESTED_PASS
        trigger: "POST /cabling/test-results whose graded outcome is PASS or PASS_ASTERISK (retest without re-termination)"
        actor: TestTechnician
        preconditions: ["install_state == TESTED_FAIL"]
        side_effects:
          - "install_state = TESTED_PASS"
          - "test_attempt_count += 1; latest_test_outcome updated"
          - "CablingProject.failed_link_count recomputed; CablingProject.version increments by 1"
      - from: TESTED_PASS
        to: TESTED_FAIL
        trigger: "POST /cabling/test-results whose graded outcome is FAIL (retest regression)"
        actor: TestTechnician
        preconditions: ["install_state == TESTED_PASS"]
        side_effects:
          - "install_state = TESTED_FAIL"
          - "test_attempt_count += 1; latest_test_outcome = FAIL"
          - "CablingProject.failed_link_count recomputed; CablingProject.version increments by 1"
      - from: TESTED_PASS
        to: CERTIFIED
        trigger: "POST /cabling/links/{link_id}/certify"
        actor: Certifier
        preconditions:
          - "install_state == TESTED_PASS (else ERR_LINK_NOT_TESTED)"
          - "record_state == RECORDED (else ERR_LINK_NOT_RECORDED)"
          - "acting X-User-ID != installer_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "acting X-User-ID != tester_user_id of the link's latest TestResult (else ERR_SEGREGATION_OF_DUTIES)"
          - "latest_test_outcome == PASS strictly; PASS_ASTERISK is not certifiable (else ERR_MARGINAL_TEST_NOT_CERTIFIABLE)"
        side_effects:
          - "install_state = CERTIFIED; certifier_user_id = acting X-User-ID (hop 1)"
          - "hop 2 — caused by hop 1: CablingProject.certified_link_count, completeness_pct_strict, completeness_pct_provisional and as_built_cost_cents are recomputed; CablingProject.version increments by 1"
          - "hop 3 — caused by hop 2: when completeness_pct_strict >= 100.00 and total_link_count >= 1, CablingProject.warranty_status moves NOT_ELIGIBLE -> ELIGIBLE"
          - "hop 4 — caused by hop 3: every WarrantyRegistration of this project in registration_state == DRAFT moves DRAFT -> READY and stamps pinned_project_version = the project's post-bump version; WarrantyRegistration.version increments by 1"
          - "increments Link.version by 1"
        note: "Cascade A."
      - from: CERTIFIED
        to: DESIGNED
        trigger: "system — hop 3 of the condemn cascade (Cascade B)"
        actor: system
        preconditions: ["an OCCUPYING route of this link was suspended by hop 2"]
        side_effects:
          - "install_state = DESIGNED; record_state = UNLABELED; installer_user_id and certifier_user_id cleared"
          - "increments Link.version by 1"
      - from: CERTIFIED
        to: TERMINATED
        trigger: "system — hop 2 of the MacTicket COMPLETED cascade when new_identifier is supplied (Cascade C)"
        actor: system
        preconditions: ["the completing MacTicket has ticket_type == CHANGE and a non-null new_identifier"]
        side_effects:
          - "identifier = new_identifier; applied_identifier cleared; record_state = LABELED -> UNLABELED"
          - "install_state = TERMINATED; certifier_user_id cleared"
          - "increments Link.version by 1"

  - entity: Link
    state_field: record_state
    initial_state: UNLABELED
    terminal_states: []
    transitions:
      - from: UNLABELED
        to: LABELED
        trigger: "POST /cabling/links/{link_id}/label"
        actor: Installer
        preconditions:
          - "record_state == UNLABELED (else ERR_INVALID_RECORD_STATE)"
          - "install_state IN {TERMINATED, TESTED_PASS, TESTED_FAIL} (else ERR_INVALID_LINK_STATE)"
          - "payload applied_identifier == Link.identifier (else ERR_LABEL_MISMATCH)"
        side_effects:
          - "record_state = LABELED; applied_identifier stored"
          - "increments Link.version by 1"
        note: "This dimension evolves independently of install_state: a link may be LABELED while still TESTED_FAIL, and may be TESTED_PASS while still UNLABELED."
      - from: LABELED
        to: RECORDED
        trigger: "POST /cabling/links/{link_id}/record"
        actor: DesignEngineer
        preconditions:
          - "record_state == LABELED (else ERR_INVALID_RECORD_STATE)"
        side_effects:
          - "record_state = RECORDED; drawing_sheet_ref stored"
          - "increments Link.version by 1"
      - from: RECORDED
        to: UNLABELED
        trigger: "system — hop 2 of Cascade C (MacTicket CHANGE completion renames the link) or hop 3 of Cascade B (condemn)"
        actor: system
        preconditions: ["the link's identifier changed, or one of its routes was suspended"]
        side_effects:
          - "record_state = UNLABELED; applied_identifier cleared"

  - entity: WarrantyRegistration
    state_field: registration_state
    initial_state: DRAFT
    terminal_states: [REGISTERED, REVOKED]
    transitions:
      - from: DRAFT
        to: READY
        trigger: "system — hop 4 of Cascade A (CablingProject.warranty_status became ELIGIBLE)"
        actor: system
        preconditions: ["CablingProject.warranty_status transitioned to ELIGIBLE"]
        side_effects:
          - "registration_state = READY; pinned_project_version = CablingProject.version"
          - "increments WarrantyRegistration.version by 1"
      - from: READY
        to: DRAFT
        trigger: "system — hop 4 of Cascade B or C when completeness_pct_strict falls below 100.00"
        actor: system
        preconditions: ["CablingProject.warranty_status left ELIGIBLE"]
        side_effects:
          - "registration_state = DRAFT; pinned_project_version cleared"
          - "increments WarrantyRegistration.version by 1"
      - from: READY
        to: SUBMITTED
        trigger: "POST /cabling/warranty-registrations/{registration_id}/submit"
        actor: ProjectManager
        preconditions:
          - "registration_state == READY (else ERR_INVALID_WARRANTY_STATE)"
          - "CablingProject.warranty_status == ELIGIBLE (else ERR_WARRANTY_NOT_ELIGIBLE)"
          - "payload expected_project_version equals CablingProject.version (else ERR_STALE_PROJECT_VERSION)"
        side_effects:
          - "registration_state = SUBMITTED; submitted_certified_link_count = CablingProject.certified_link_count; coverage_years computed per calculations.warranty_coverage_determination"
          - "CablingProject.warranty_status = SUBMITTED; increments CablingProject.version by 1"
          - "pinned_project_version is re-stamped to the project's post-bump version"
          - "increments WarrantyRegistration.version by 1"
      - from: SUBMITTED
        to: REGISTERED
        trigger: "POST /cabling/warranty-registrations/{registration_id}/decision with decision=REGISTER"
        actor: ManufacturerAgent
        preconditions:
          - "registration_state == SUBMITTED (else ERR_INVALID_WARRANTY_STATE)"
          - "CablingProject.version == pinned_project_version (else ERR_WARRANTY_PIN_STALE; the registration is left SUBMITTED)"
          - "registration_number present (else ERR_INVALID_REQUEST)"
        side_effects:
          - "registration_state = REGISTERED; registration_number stored"
          - "CablingProject.warranty_status = REGISTERED; increments CablingProject.version by 1"
          - "increments WarrantyRegistration.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /cabling/warranty-registrations/{registration_id}/decision with decision=REJECT"
        actor: ManufacturerAgent
        preconditions:
          - "registration_state == SUBMITTED"
          - "rejection_reason present (else ERR_INVALID_REQUEST)"
        side_effects:
          - "registration_state = REJECTED; rejection_reason stored"
          - "CablingProject.warranty_status = REJECTED; increments CablingProject.version by 1"
          - "increments WarrantyRegistration.version by 1"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /cabling/warranty-registrations/{registration_id}/reopen"
        actor: ProjectManager
        preconditions:
          - "registration_state == REJECTED (else ERR_INVALID_WARRANTY_STATE)"
        side_effects:
          - "registration_state = DRAFT; rejection_reason cleared; coverage_years cleared; pinned_project_version cleared"
          - "CablingProject.warranty_status is recomputed from completeness_pct_strict (ELIGIBLE when >= 100.00 with at least one link, else NOT_ELIGIBLE); increments CablingProject.version by 1"
          - "increments WarrantyRegistration.version by 1"
        note: "Cycle edge: DRAFT -> READY -> SUBMITTED -> REJECTED -> DRAFT."
      - from: REGISTERED
        to: REVOKED
        trigger: "system — hop 4 of Cascade B or C"
        actor: system
        preconditions: ["CablingProject.completeness_pct_strict fell below 100.00 while warranty_status was REGISTERED"]
        side_effects:
          - "registration_state = REVOKED; CablingProject.warranty_status = REVOKED"
          - "increments WarrantyRegistration.version by 1"

  - entity: MacTicket
    state_field: ticket_state
    initial_state: SUBMITTED
    terminal_states: [COMPLETED, REJECTED]
    transitions:
      - from: null
        to: SUBMITTED
        trigger: "POST /cabling/mac-tickets"
        actor: Client
        preconditions:
          - "CablingProject.occupancy_status == OCCUPIED (else ERR_PROJECT_NOT_OCCUPIED)"
          - "the referenced Link.project_id equals project_id and the referenced TelecomRoom.project_id equals project_id (else ERR_CROSS_PROJECT_REFERENCE)"
          - "requested_window_end > requested_window_start (else ERR_INVALID_REQUEST)"
        side_effects:
          - "ticket_state = SUBMITTED; rework_count = 0"
      - from: SUBMITTED
        to: SCHEDULED
        trigger: "POST /cabling/mac-tickets/{ticket_id}/schedule"
        actor: ProjectManager
        preconditions:
          - "ticket_state == SUBMITTED (else ERR_INVALID_TICKET_STATE)"
          - "scheduled_window_end > scheduled_window_start (else ERR_INVALID_REQUEST)"
          - "calculations.mac_window_occupancy_check admits the window on the ticket's TelecomRoom (else ERR_ROOM_WINDOW_CONFLICT)"
          - "CablingProject.consumed_mac_cents + the ESTIMATE variant of calculations.mac_ticket_billing <= CablingProject.mac_budget_cents (else ERR_MAC_BUDGET_EXCEEDED)"
        side_effects:
          - "ticket_state = SCHEDULED; scheduled_window_start and scheduled_window_end stamped"
          - "estimated_billed_cents = ESTIMATE variant of calculations.mac_ticket_billing"
          - "CablingProject.consumed_mac_cents += estimated_billed_cents; increments CablingProject.version by 1"
          - "increments MacTicket.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /cabling/mac-tickets/{ticket_id}/reject"
        actor: ProjectManager
        preconditions:
          - "ticket_state == SUBMITTED (else ERR_INVALID_TICKET_STATE)"
        side_effects:
          - "ticket_state = REJECTED"
          - "increments MacTicket.version by 1"
        note: "Branch edge: SUBMITTED forks to SCHEDULED or REJECTED with disjoint side-effect sets (only the SCHEDULED branch touches the MAC budget ledger)."
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /cabling/mac-tickets/{ticket_id}/start"
        actor: Installer
        preconditions:
          - "ticket_state == SCHEDULED (else ERR_INVALID_TICKET_STATE)"
          - "the logical clock reading is within the half-open interval [scheduled_window_start, scheduled_window_end) (else ERR_TICKET_WINDOW_NOT_OPEN)"
        side_effects:
          - "ticket_state = IN_PROGRESS"
          - "increments MacTicket.version by 1"
      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: "POST /cabling/mac-tickets/{ticket_id}/rework"
        actor: ProjectManager
        preconditions:
          - "ticket_state == IN_PROGRESS (else ERR_INVALID_TICKET_STATE)"
        side_effects:
          - "ticket_state = SUBMITTED; scheduled_window_start, scheduled_window_end and estimated_billed_cents cleared; rework_count += 1"
          - "CablingProject.consumed_mac_cents -= the estimated_billed_cents that was committed at SCHEDULED; increments CablingProject.version by 1"
          - "compensating invariant: CablingProject.consumed_mac_cents == sum of estimated_billed_cents over SCHEDULED and IN_PROGRESS tickets plus sum of final_billed_cents over COMPLETED tickets, before and after"
          - "increments MacTicket.version by 1"
        note: "Cycle edge: SCHEDULED -> IN_PROGRESS -> SUBMITTED -> SCHEDULED may repeat; rework_count records the loop count."
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /cabling/mac-tickets/{ticket_id}/complete"
        actor: Installer
        preconditions:
          - "ticket_state == IN_PROGRESS (else ERR_INVALID_TICKET_STATE)"
          - "actual_labor_hours > 0 (else ERR_INVALID_REQUEST)"
          - "when ticket_type == CHANGE and new_identifier is supplied, new_identifier matches the project's identifier_scheme pattern (else ERR_IDENTIFIER_FORMAT_INVALID) and is not already used by another Link of the project (else ERR_DUPLICATE_LINK_IDENTIFIER)"
        side_effects:
          - "ticket_state = COMPLETED; actual_labor_hours stored; final_billed_cents = FINAL variant of calculations.mac_ticket_billing (hop 1)"
          - "CablingProject.consumed_mac_cents += (final_billed_cents - estimated_billed_cents); increments CablingProject.version by 1"
          - "hop 2 — caused by hop 1 when ticket_type == CHANGE with a non-null new_identifier: the referenced Link.identifier = new_identifier, applied_identifier cleared, record_state -> UNLABELED and install_state CERTIFIED -> TERMINATED with certifier_user_id cleared; Link.version increments by 1"
          - "hop 3 — caused by hop 2: CablingProject.certified_link_count, completeness_pct_strict, completeness_pct_provisional and as_built_cost_cents recomputed"
          - "hop 4 — caused by hop 3: when completeness_pct_strict falls below 100.00, warranty_status ELIGIBLE -> NOT_ELIGIBLE with READY registrations reverting to DRAFT, or REGISTERED -> REVOKED with the REGISTERED registration becoming REVOKED"
          - "increments MacTicket.version by 1"
        note: "Cascade C."

  - entity: TradeCoordination
    state_field: coordination_state
    initial_state: REQUESTED
    terminal_states: [RELEASED]
    transitions:
      - from: null
        to: REQUESTED
        trigger: "POST /cabling/trade-coordinations"
        actor: ProjectManager
        preconditions:
          - "when predecessor_coordination_id is supplied it names a TradeCoordination of the same project (else ERR_CROSS_PROJECT_REFERENCE)"
          - "the predecessor chain closes no cycle: no coordination in the chain carries the same (trade, milestone) pair as the row being created, and the chain is at most MAX_PATHWAY_DEPTH hops long (else ERR_COORDINATION_CYCLE)"
        side_effects:
          - "coordination_state = REQUESTED"
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /cabling/trade-coordinations/{coordination_id}/confirm"
        actor: ProjectManager
        preconditions:
          - "coordination_state == REQUESTED (else ERR_INVALID_COORDINATION_STATE)"
          - "when predecessor_coordination_id is set, that coordination is in coordination_state == RELEASED (else ERR_PREDECESSOR_NOT_RELEASED)"
        side_effects:
          - "coordination_state = CONFIRMED; confirmed_date stored"
          - "unblocks Link DESIGNED -> PULLED for CEILING / PATHWAY_ROUGH_IN coordinations"
          - "increments TradeCoordination.version by 1"
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /cabling/trade-coordinations/{coordination_id}/release"
        actor: ProjectManager
        preconditions:
          - "coordination_state == CONFIRMED (else ERR_INVALID_COORDINATION_STATE)"
        side_effects:
          - "coordination_state = RELEASED"
          - "increments TradeCoordination.version by 1"
      - from: CONFIRMED
        to: BLOCKED
        trigger: "POST /cabling/trade-coordinations/{coordination_id}/block"
        actor: ProjectManager
        preconditions:
          - "coordination_state == CONFIRMED (else ERR_INVALID_COORDINATION_STATE)"
        side_effects:
          - "coordination_state = BLOCKED; block_reason stored"
          - "re-blocks Link DESIGNED -> PULLED for CEILING / PATHWAY_ROUGH_IN coordinations"
          - "increments TradeCoordination.version by 1"
      - from: BLOCKED
        to: REQUESTED
        trigger: "POST /cabling/trade-coordinations/{coordination_id}/unblock"
        actor: ProjectManager
        preconditions:
          - "coordination_state == BLOCKED (else ERR_INVALID_COORDINATION_STATE)"
        side_effects:
          - "coordination_state = REQUESTED; block_reason cleared; confirmed_date cleared"
          - "increments TradeCoordination.version by 1"
        note: "Cycle edge: REQUESTED -> CONFIRMED -> BLOCKED -> REQUESTED."

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: route-create-stale-segment
    parent_entity: PathwaySegment
    write_endpoint: "POST /cabling/link-routes"
    occ_field: "expected_segment_version"
    description: |
      Creating a LinkPathwayRoute against a PathwaySegment whose version has
      advanced since the client last read it is rejected. This captures the case
      where another route has already been admitted onto the segment and taken
      fill area the current writer still believes is free — the fill verdict the
      client reasoned about is stale, so the write is refused rather than
      silently graded against different occupancy.
    error_id: ERR_STALE_PATHWAY_VERSION
    http_status: 412

  - rule_id: rack-assignment-stale-rack
    parent_entity: Rack
    write_endpoint: "POST /cabling/rack-unit-assignments"
    occ_field: "expected_rack_version"
    description: |
      Creating a RackUnitAssignment against a Rack whose version has advanced
      since the client last read the elevation is rejected. Rack units are
      allotted from a shared elevation drawing, so a writer holding an outdated
      view of occupied_ru would place equipment against a superseded layout.
    error_id: ERR_STALE_RACK_VERSION
    http_status: 412

  - rule_id: warranty-submit-stale-project
    parent_entity: CablingProject
    write_endpoint: "POST /cabling/warranty-registrations/{registration_id}/submit"
    occ_field: "expected_project_version"
    description: |
      Submitting a WarrantyRegistration whose payload carries a CablingProject
      version older than the project's current version is rejected. A submission
      freezes submitted_certified_link_count and coverage_years, so it may only
      be built on the exact project state the submitter observed; any intervening
      certification, condemnation or MAC completion advances the version and
      invalidates that view.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# All money is integer cents. All decimal rounding is ROUND_HALF_UP on exact
# decimal arithmetic (never binary float), at the precision named per rule.
# =============================================================================
calculations:

  - name: link_length_evaluation
    trigger: "POST /cabling/links stores both variants; the PERMANENT_LINK variant is enforced by the Link DESIGNED -> PULLED transition; the variant used to grade a test is selected by TestResult.test_standard at POST /cabling/test-results"
    algorithm: threshold
    formula: |
      permanent_link_length_m = ROUND_HALF_UP(horizontal_length_m + consolidation_point_stub_m, 2)
      channel_length_m       = ROUND_HALF_UP(permanent_link_length_m
                                             + patch_cord_allowance_m * PATCH_CORD_DERATE_FACTOR, 2)

      if CableType.category IN {CAT5E, CAT6, CAT6A, COAX_RG6}:      # balanced twisted-pair / coax
          limit_permanent_m = MAX_PERMANENT_LINK_M                  # 90.00
          limit_channel_m   = MAX_CHANNEL_M                         # 100.00
      else:                                                        # OM4_MMF, OS2_SMF
          limit_channel_m   = CableType.max_channel_length_m
          limit_permanent_m = ROUND_HALF_UP(CableType.max_channel_length_m * FIBER_PERMANENT_FRACTION, 2)

      # enforcement at DESIGNED -> PULLED:
      reject with ERR_LINK_LENGTH_EXCEEDED when permanent_link_length_m > limit_permanent_m
      # exactly equal is admitted (> , not >=)
    input_set: "Fields of the Link row under construction plus the referenced CableType row; no other Link participates."
    constants:
      PATCH_CORD_DERATE_FACTOR: 1.2
      MAX_PERMANENT_LINK_M: 90.00
      MAX_CHANNEL_M: 100.00
      FIBER_PERMANENT_FRACTION: 0.9
    precision: "2 decimal places, ROUND_HALF_UP; the channel value is derived from the already-rounded permanent-link value, not from the raw sum"
    variants:
      - name: PERMANENT_LINK
        when: "Enforced at POST /cabling/links/{link_id}/pull, and used to grade a TestResult whose test_standard == PERMANENT_LINK"
        difference: "Counts horizontal cable plus the consolidation-point stub only; patch cords are excluded; graded against limit_permanent_m (90.00 m for copper)."
      - name: CHANNEL
        when: "Used to grade a TestResult whose test_standard == CHANNEL, and as the metre count priced by project_as_built_cost"
        difference: "Adds patch_cord_allowance_m multiplied by PATCH_CORD_DERATE_FACTOR (stranded cords attenuate more per metre) and is graded against limit_channel_m (100.00 m for copper). A link with horizontal_length_m 84.00, consolidation_point_stub_m 0.00 and patch_cord_allowance_m 14.00 yields permanent_link_length_m 84.00 (admitted) and channel_length_m 100.80 (rejected by the CHANNEL grading), so the two variants disagree on the same row."

  - name: pathway_fill_evaluation
    trigger: "POST /cabling/link-routes (candidate admission) and every recomputation of PathwaySegment.fill_area_used_sq_mm, occupying_route_count, allowed_fill_pct and fill_ratio"
    algorithm: threshold
    formula: |
      n = PathwaySegment.occupying_route_count + 1        # candidate included in the count
      if PathwaySegment.pathway_type == CABLE_TRAY: base_pct = TRAY_FILL_PCT          # 50
      elif n == 1:                                        base_pct = FILL_PCT_1_CABLE  # 53
      elif n == 2:                                        base_pct = FILL_PCT_2_CABLES # 31
      else:                                               base_pct = FILL_PCT_3_PLUS   # 40
      allowed_fill_pct = max(MIN_FILL_PCT,
                             base_pct - BEND_DERATE_PCT * max(0, PathwaySegment.bend_count - 2))
      candidate_area   = CableType.cross_section_area_sq_mm            # = ROUND_HALF_UP(PI*(d/2)^2, 2)
      used_area        = ROUND_HALF_UP(PathwaySegment.fill_area_used_sq_mm + candidate_area, 2)
      allowed_area     = ROUND_HALF_UP(PathwaySegment.usable_area_sq_mm * allowed_fill_pct / 100, 2)
      reject with ERR_PATHWAY_FILL_EXCEEDED when used_area > allowed_area   # equality is admitted
      on success: fill_area_used_sq_mm = used_area
                  fill_ratio = ROUND_HALF_UP(used_area / usable_area_sq_mm, 4)
    input_set: "The candidate CableType plus the LinkPathwayRoute rows on this segment whose route_state == OCCUPYING; WITHDRAWN and SUSPENDED routes are excluded from both the count and the area sum."
    constants:
      FILL_PCT_1_CABLE: 53
      FILL_PCT_2_CABLES: 31
      FILL_PCT_3_PLUS: 40
      TRAY_FILL_PCT: 50
      BEND_DERATE_PCT: 2
      MIN_FILL_PCT: 25
      PI: 3.141592653589793
    precision: "areas 2 decimal places ROUND_HALF_UP; fill_ratio 4 decimal places ROUND_HALF_UP; allowed_fill_pct is an integer percentage"
    note: "The conduit tier table is deliberately non-monotonic: the two-cable allowance (31%) is LOWER than the three-or-more allowance (40%). An implementation that treats the table as monotone admits a second cable it must refuse."

  - name: power_separation_requirement
    trigger: "POST /cabling/link-routes, evaluated before the fill check"
    algorithm: threshold
    formula: |
      if CableType.category IN {OM4_MMF, OS2_SMF}:  required_separation_mm = SEPARATION_FIBER_MM     # 0
      elif CableType.shielded is true:              required_separation_mm = SEPARATION_SHIELDED_MM  # 25
      else:                                         required_separation_mm = SEPARATION_UNSHIELDED_MM # 50
      if PathwaySegment.shared_with_power is true and
         PathwaySegment.power_separation_mm < required_separation_mm:
          reject with ERR_POWER_SEPARATION_INSUFFICIENT      # exactly equal is admitted
    input_set: "The candidate CableType row and the target PathwaySegment row."
    constants:
      SEPARATION_FIBER_MM: 0
      SEPARATION_SHIELDED_MM: 25
      SEPARATION_UNSHIELDED_MM: 50
    precision: "integer millimetres"

  - name: link_test_outcome
    trigger: "POST /cabling/test-results — grades the submitted measurements and drives the Link install_state transition"
    algorithm: threshold
    formula: |
      if test_standard == CHANNEL:
          graded_length_m = Link.channel_length_m
          limit_m         = limit_channel_m        from link_length_evaluation
      else:
          graded_length_m = Link.permanent_link_length_m
          limit_m         = limit_permanent_m      from link_length_evaluation

      worst_margin_db          = min(next_margin_db, return_loss_margin_db)
      insertion_loss_budget_db = ROUND_HALF_UP(IL_BASE_DB + IL_PER_M_DB * graded_length_m, 2)

      # ordered, first match wins:
      if graded_length_m > limit_m:                       outcome = FAIL,  failure_reason = LENGTH_LIMIT
      elif insertion_loss_db > insertion_loss_budget_db:  outcome = FAIL,  failure_reason = INSERTION_LOSS
      elif worst_margin_db < MARGIN_PASS_MIN_DB:          outcome = FAIL,  failure_reason = MARGIN
      elif worst_margin_db < TESTER_ACCURACY_BAND_DB:     outcome = PASS_ASTERISK, failure_reason = null
      else:                                              outcome = PASS,  failure_reason = null
    input_set: "The submitted measurement fields, the Link's two stored length variants, and the referenced CableType's category (to pick the limit pair). Earlier TestResult rows are not consulted."
    constants:
      IL_BASE_DB: 0.40
      IL_PER_M_DB: 0.19
      MARGIN_PASS_MIN_DB: 0.0
      TESTER_ACCURACY_BAND_DB: 0.5
    precision: "insertion_loss_budget_db and worst_margin_db to 2 decimal places ROUND_HALF_UP"
    note: "Boundary: worst_margin_db exactly 0.00 is NOT a FAIL — it grades PASS_ASTERISK (marginal, within tester accuracy); exactly 0.50 grades PASS. PASS_ASTERISK moves the link to TESTED_PASS but is refused by certification (ERR_MARGINAL_TEST_NOT_CERTIFIABLE)."
    variants:
      - name: PERMANENT_LINK
        when: "test_standard == PERMANENT_LINK"
        difference: "Grades Link.permanent_link_length_m against limit_permanent_m and budgets insertion loss on that shorter length."
      - name: CHANNEL
        when: "test_standard == CHANNEL"
        difference: "Grades Link.channel_length_m against limit_channel_m and budgets insertion loss on the longer channel length, so the same physical link can PASS one standard and FAIL the other."

  - name: project_as_built_cost
    trigger: "Recomputed whenever a Link of the project enters or leaves the priced input set — the PULLED -> TERMINATED, TESTED_*, TESTED_PASS -> CERTIFIED, CERTIFIED -> DESIGNED (Cascade B hop 3) and CERTIFIED -> TERMINATED (Cascade C hop 2) transitions all refresh CablingProject.as_built_cost_cents"
    algorithm: aggregation
    formula: |
      # STEP 1 — per link, rounded to whole cents FIRST:
      for each Link L in the priced set, ordered by L.created_at ASC:
          material_cents(L) = ROUND_HALF_UP(CableType(L).cost_per_meter_cents * L.channel_length_m, 0)
          labor_cents(L)    = TERMINATION_LABOR_CENTS_PER_END * TERMINATION_ENDS_PER_LINK
          link_cost(L)      = material_cents(L) + labor_cents(L)
          L.material_cost_cents = material_cents(L)
      # STEP 2 — then sum the already-rounded per-link amounts:
      as_built_cost_cents = sum over the priced set of link_cost(L)
    input_set: "Link rows of the project whose install_state IS one of {TERMINATED, TESTED_PASS, TESTED_FAIL, CERTIFIED}. Links still DESIGNED or PULLED are excluded (no cable is terminated yet). Iteration order is created_at ASC."
    constants:
      TERMINATION_LABOR_CENTS_PER_END: 4750
      TERMINATION_ENDS_PER_LINK: 2
    precision: "PINNED ROUNDING ORDER: round each link's material cost to whole cents, THEN sum. Summing the unrounded products and rounding once is a different number — e.g. two links each priced at 150 cents/m over channel_length_m 88.03 give 150 * 88.03 = 13204.5 cents each; rounding per link yields 13205 + 13205 = 26410, while sum-then-round yields ROUND_HALF_UP(26409.00) = 26409. This scaffold pins the per-link order."

  - name: mac_ticket_billing
    trigger: "The ESTIMATE variant runs at POST /cabling/mac-tickets/{ticket_id}/schedule; the FINAL variant runs at POST /cabling/mac-tickets/{ticket_id}/complete"
    algorithm: tiered_pricing
    formula: |
      # PINNED EVALUATION ORDER — the discount tier is keyed on subtotal_cents,
      # NOT on billed_cents, and the expedite fee is charged on the DISCOUNTED base.
      # STEP 1
      billable_hours = max(MAC_MIN_BILLABLE_HOURS, hours_input)
      # STEP 2
      subtotal_cents = ROUND_HALF_UP(billable_hours * MAC_LABOR_RATE_CENTS_PER_HOUR, 0)
      # STEP 3 — tier selected from subtotal_cents:
      if   subtotal_cents <  VOLUME_TIER_1_CENTS: volume_discount_pct = 0    # < 50000
      elif subtotal_cents <  VOLUME_TIER_2_CENTS: volume_discount_pct = 5    # 50000 .. 149999
      else:                                       volume_discount_pct = 10   # >= 150000
      # STEP 4
      discount_cents = ROUND_HALF_UP(subtotal_cents * volume_discount_pct / 100, 0)
      # STEP 5 — expedite is a percentage of the post-discount base:
      expedite_fee_cents = expedite_requested
                           ? ROUND_HALF_UP((subtotal_cents - discount_cents) * EXPEDITE_PCT / 100, 0)
                           : 0
      # STEP 6
      billed_cents = subtotal_cents - discount_cents + expedite_fee_cents
    input_set: "One MacTicket row: labor_hours_estimate for the ESTIMATE variant, actual_labor_hours for the FINAL variant, plus expedite_requested. No other ticket participates."
    constants:
      MAC_LABOR_RATE_CENTS_PER_HOUR: 9600
      MAC_MIN_BILLABLE_HOURS: 1.0
      VOLUME_TIER_1_CENTS: 50000
      VOLUME_TIER_2_CENTS: 150000
      EXPEDITE_PCT: 15
    precision: "integer cents at every step; ROUND_HALF_UP applied at STEP 2, STEP 4 and STEP 5 independently (no deferred rounding)"
    note: "Circular-looking dependency resolved by the pinned order: billed_cents depends on discount_cents, and the discount tier looks like it should be read off the total the client actually pays. It is not — the tier is read off subtotal_cents. With expedite_requested true and 5.0 hours, subtotal 48000 sits below VOLUME_TIER_1_CENTS so volume_discount_pct is 0 and billed_cents is 55200; keying the tier on billed_cents (55200 >= 50000) would wrongly grant 5% and bill 52440."
    variants:
      - name: ESTIMATE
        when: "SUBMITTED -> SCHEDULED; hours_input = labor_hours_estimate"
        difference: "Uses the client's estimate, stamps MacTicket.estimated_billed_cents, and commits that amount to CablingProject.consumed_mac_cents for the budget check."
      - name: FINAL
        when: "IN_PROGRESS -> COMPLETED; hours_input = actual_labor_hours"
        difference: "Uses the crew's reported hours, stamps MacTicket.final_billed_cents, and adjusts CablingProject.consumed_mac_cents by (final_billed_cents - estimated_billed_cents). Identical ticket, different hours: 6.0 estimated hours bill 62928 cents while 4.0 actual hours bill 44160 cents."

  - name: mac_budget_ledger
    trigger: "Recomputed on the MacTicket SUBMITTED -> SCHEDULED, IN_PROGRESS -> SUBMITTED and IN_PROGRESS -> COMPLETED transitions"
    algorithm: aggregation
    formula: |
      consumed_mac_cents = sum of estimated_billed_cents over MacTicket rows of the project
                             whose ticket_state IN {SCHEDULED, IN_PROGRESS}
                         + sum of final_billed_cents over MacTicket rows of the project
                             whose ticket_state == COMPLETED
      # SUBMITTED and REJECTED tickets contribute 0.
      budget_check at SCHEDULED: reject with ERR_MAC_BUDGET_EXCEEDED when
          consumed_mac_cents + candidate estimated_billed_cents > CablingProject.mac_budget_cents
    input_set: "MacTicket rows of the project; SUBMITTED and REJECTED tickets excluded; iteration order created_at ASC (sum is order-insensitive but the order is pinned for reproducibility)."
    constants: {}
    precision: "integer cents; equality with mac_budget_cents is admitted (> , not >=)"

  - name: project_certification_rollup
    trigger: "Recomputed on every Link install_state transition and on every cascade hop that changes a Link's install_state (Cascade A hop 2, Cascade B hop 4, Cascade C hop 3)"
    algorithm: aggregation
    formula: |
      total_link_count     = count of Link rows of the project (any install_state)
      certified_link_count = count of Link rows with install_state == CERTIFIED
      failed_link_count    = count of Link rows with install_state == TESTED_FAIL
      completeness_pct_strict      = total_link_count == 0 ? 0.00
                                     : ROUND_HALF_UP(100 * certified_link_count / total_link_count, 2)
      completeness_pct_provisional = total_link_count == 0 ? 0.00
                                     : ROUND_HALF_UP(100 * (certified_link_count
                                        + count of install_state == TESTED_PASS) / total_link_count, 2)
      warranty_status transition:
          NOT_ELIGIBLE -> ELIGIBLE when completeness_pct_strict >= 100.00 AND total_link_count >= 1
          ELIGIBLE -> NOT_ELIGIBLE when completeness_pct_strict < 100.00
    input_set: "All Link rows whose project_id is this project. There is no state filter on total_link_count — DESIGNED links dilute completeness."
    constants:
      ELIGIBILITY_PCT: 100.00
    precision: "percentages 2 decimal places ROUND_HALF_UP"
    note: "Zero-link edge: a project with total_link_count == 0 has completeness_pct_strict 0.00, not 100.00, and therefore stays NOT_ELIGIBLE — an empty project is never warranty-eligible."
    variants:
      - name: STRICT
        when: "Authoritative for warranty eligibility and for the PRE_OCCUPANCY -> OCCUPIED readiness gate"
        difference: "Counts only install_state == CERTIFIED in the numerator."
      - name: PROVISIONAL
        when: "Reported by GET /cabling/projects/{project_id}/certification-summary alongside the strict value"
        difference: "Counts CERTIFIED plus TESTED_PASS in the numerator, so a project with 1 certified and 1 tested-but-uncertified link reports strict 50.00 and provisional 100.00 for the same data."

  - name: rack_ru_ledger
    trigger: "Recomputed on RackUnitAssignment creation (null -> ACTIVE) and release (ACTIVE -> RELEASED)"
    algorithm: aggregation
    formula: |
      span_ru(A)   = A.end_ru - A.start_ru + 1
      occupied_ru  = sum of span_ru(A) over RackUnitAssignment rows of the rack with assignment_state == ACTIVE
      available_ru = Rack.total_ru - occupied_ru
      # spatial occupancy check on the CLOSED inclusive interval [start_ru, end_ru]:
      conflict when an ACTIVE assignment A satisfies
          candidate.start_ru <= A.end_ru AND candidate.end_ru >= A.start_ru      -> ERR_RACK_RU_CONFLICT
      capacity check: candidate.end_ru > Rack.total_ru                            -> ERR_RACK_CAPACITY_EXCEEDED
    input_set: "RackUnitAssignment rows of this rack with assignment_state == ACTIVE; RELEASED rows are excluded and free their units immediately."
    constants:
      RU_CAPACITY_PER_UNIT: 1
    precision: "integer rack units; the interval is CLOSED at both ends and every rack unit has capacity 1, so touching intervals ([1,2] then [3,4]) are admitted with zero gap while any shared unit is refused"

  - name: room_power_ledger
    trigger: "Recomputed on RackUnitAssignment creation and release, and read by the TelecomRoom GROUNDED -> ENERGIZED precondition"
    algorithm: aggregation
    formula: |
      Rack.power_draw_va         = sum of power_va over the rack's ACTIVE RackUnitAssignment rows
      TelecomRoom.power_load_va  = sum of Rack.power_draw_va over the room's racks
      TelecomRoom.power_headroom_va = TelecomRoom.ups_capacity_va - TelecomRoom.power_load_va
      admission check at RackUnitAssignment creation:
          reject with ERR_POWER_CAPACITY_EXCEEDED when
          TelecomRoom.power_load_va + candidate.power_va > TelecomRoom.ups_capacity_va
    input_set: "All Rack rows of the room, and for each rack its RackUnitAssignment rows with assignment_state == ACTIVE."
    constants: {}
    precision: "integer volt-amperes; equality with ups_capacity_va is admitted (> , not >=)"
    note: "Conserved quantity: power_load_va + power_headroom_va == ups_capacity_va must hold after every mutation, and a create followed by its release must return power_load_va to the exact pre-create value."

  - name: grounding_compliance_evaluation
    trigger: "POST /cabling/telecom-rooms/{room_id}/grounding-verification"
    algorithm: threshold
    formula: |
      if bonding_conductor_awg > MAX_BONDING_AWG:            # numerically larger AWG = thinner conductor
          reject the whole request with ERR_BONDING_NON_COMPLIANT   # nothing is recorded
      grounding_status = (tgb_installed is true
                          AND bonding_conductor_awg <= MAX_BONDING_AWG
                          AND ground_resistance_milliohms <= MAX_GROUND_RESISTANCE_MILLIOHMS)
                         ? COMPLIANT : NON_COMPLIANT
    input_set: "The three measurement fields submitted with this call; earlier verifications are overwritten, not merged."
    constants:
      MAX_BONDING_AWG: 6
      MAX_GROUND_RESISTANCE_MILLIOHMS: 5000
    precision: "milliohms to 2 decimal places; the comparison is <= so exactly 5000 milliohms grades COMPLIANT"

  - name: mac_window_occupancy_check
    trigger: "POST /cabling/mac-tickets/{ticket_id}/schedule"
    algorithm: interval_merge
    formula: |
      BUFFER = ROOM_CHANGEOVER_BUFFER_MINUTES                      # 30
      effective_start = candidate.scheduled_window_start - BUFFER
      effective_end   = candidate.scheduled_window_end   + BUFFER
      occupied = MacTicket rows with the same telecom_room_id and ticket_state IN {SCHEDULED, IN_PROGRESS},
                 excluding the candidate ticket itself
      overlapping_count = count of T in occupied where
                 T.scheduled_window_start <  effective_end
             AND T.scheduled_window_end   >  effective_start          # half-open intersection
      reject with ERR_ROOM_WINDOW_CONFLICT when overlapping_count >= ROOM_CONCURRENT_CREW_CAPACITY
    input_set: "MacTicket rows of the same TelecomRoom whose ticket_state is SCHEDULED or IN_PROGRESS; SUBMITTED, COMPLETED and REJECTED tickets never occupy the room."
    constants:
      ROOM_CHANGEOVER_BUFFER_MINUTES: 30
      ROOM_CONCURRENT_CREW_CAPACITY: 2
    precision: "minute resolution on ISO 8601 UTC instants; intervals are HALF-OPEN [start, end), and the 30-minute buffer is added to BOTH ends of the candidate only. A ticket ending exactly 30 minutes before the candidate starts does not overlap (T.end > effective_start is false at equality), so an exact 30-minute gap is admitted."
    note: "Aggregate capacity 2: two overlapping windows in one room are legal, the third is refused. This is a different interval geometry from rack_ru_ledger, which uses CLOSED integer intervals with capacity 1 and no buffer."

  - name: pathway_graph_depth
    trigger: "POST /cabling/pathway-segments and POST /cabling/pathway-segments/{segment_id}/reparent"
    algorithm: topological
    formula: |
      walk the upstream_segment_id chain from the segment towards the root:
          pathway_depth = number of hops until upstream_segment_id is null
      cycle detection at reparent: starting from the proposed upstream segment, follow
      upstream_segment_id; if the segment being reparented is reached, or the walk exceeds
      MAX_PATHWAY_DEPTH hops, reject with ERR_PATHWAY_CYCLE
      after a successful reparent, pathway_depth is recomputed for the segment AND for every
      segment whose upstream chain passes through it (descendants), in breadth-first order
      from the reparented segment
    input_set: "PathwaySegment rows of the same project reachable through upstream_segment_id."
    constants:
      MAX_PATHWAY_DEPTH: 8
    precision: "integer hop count; a root segment has pathway_depth 0"

  - name: warranty_coverage_determination
    trigger: "The WarrantyRegistration READY -> SUBMITTED transition"
    algorithm: threshold
    formula: |
      base_years = manufacturer_program == EXTENDED_25Y ? EXTENDED_BASE_YEARS : STANDARD_BASE_YEARS
      rework_link_count = count of Link rows of the project with test_attempt_count >= REWORK_ATTEMPT_THRESHOLD
      coverage_years = max(WARRANTY_MIN_YEARS,
                           base_years - REWORK_PENALTY_YEARS * rework_link_count)
    input_set: "All Link rows of the project regardless of install_state; test_attempt_count is never reset, so remediation history follows the link permanently."
    constants:
      STANDARD_BASE_YEARS: 15
      EXTENDED_BASE_YEARS: 25
      REWORK_ATTEMPT_THRESHOLD: 3
      REWORK_PENALTY_YEARS: 5
      WARRANTY_MIN_YEARS: 10
    precision: "integer years; the floor is applied after the penalty, so two rework links on a STANDARD_15Y project give max(10, 15 - 10) = 10, not 5"

  - name: identifier_format_check
    trigger: "POST /cabling/links, POST /cabling/links/{link_id}/label and the MacTicket CHANGE completion that supplies new_identifier"
    algorithm: constraint_propagation
    formula: |
      pattern = CablingProject.identifier_scheme == TIA_606_CLASS_1
                ? CLASS_1_PATTERN : CLASS_2_PATTERN
      reject with ERR_IDENTIFIER_FORMAT_INVALID when the identifier does not fully match pattern
      reject with ERR_DUPLICATE_LINK_IDENTIFIER when another Link of the same project already
        carries that identifier (comparison is case-sensitive and exact)
      at POST /cabling/links/{link_id}/label:
        reject with ERR_LABEL_MISMATCH when applied_identifier != Link.identifier
    input_set: "The owning CablingProject.identifier_scheme plus every other Link row of the same project."
    constants:
      CLASS_1_PATTERN: "^[A-Z]{2}[0-9]{2}-[A-Z][0-9]{2}$"
      CLASS_2_PATTERN: "^[0-9]{2}[A-Z]-[A-Z]{2}[0-9]{2}-[A-Z][0-9]{2}$"
    precision: "exact full-string regex match; no trimming, no case folding"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# Priority families: 10-30 request admissibility, 40 existence, 50-56 state,
# 60 optimistic concurrency, 70-95 life-safety / code compliance,
# 100-140 referential and workflow integrity, 145-190 physical constraints,
# 195-205 capacity and budget. Code compliance always outranks capacity: a
# request that violates both reports the compliance error.
# =============================================================================
validations:

  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are present and non-empty; X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "The acting role appears in the target endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 30
    category: business_constraint
    check: "Request body admissibility: every required input field present, types match, enum values are declared members, numeric constraints hold (start_ru <= end_ru, requested_window_end > requested_window_start, positive lengths, non-negative money), pagination limit in 1..100 and offset >= 0, and no unknown fields"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 40
    category: existence
    check: "Every resource named in the path exists, validated left-to-right, then every foreign key in the body exists — project_id, telecom_room_id, rack_id, cable_type_id, link_id, pathway_segment_id, upstream_segment_id, predecessor_coordination_id"
    error_id: "ERR_PROJECT_NOT_FOUND | ERR_TELECOM_ROOM_NOT_FOUND | ERR_RACK_NOT_FOUND | ERR_PATHWAY_SEGMENT_NOT_FOUND | ERR_CABLE_TYPE_NOT_FOUND | ERR_LINK_NOT_FOUND | ERR_RACK_ASSIGNMENT_NOT_FOUND | ERR_ROUTE_NOT_FOUND | ERR_TEST_RESULT_NOT_FOUND | ERR_MAC_TICKET_NOT_FOUND | ERR_WARRANTY_REGISTRATION_NOT_FOUND | ERR_COORDINATION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying a path id or a body foreign key"

  - priority: 50
    category: state
    check: "The target resource is in a state from which this transition is declared in §1.2"
    error_id: "ERR_INVALID_LINK_STATE | ERR_INVALID_RECORD_STATE | ERR_INVALID_TICKET_STATE | ERR_INVALID_WARRANTY_STATE | ERR_INVALID_COORDINATION_STATE | ERR_INVALID_ROUTE_STATE | ERR_INVALID_ASSIGNMENT_STATE | ERR_INVALID_ROOM_STATE | ERR_INVALID_PROJECT_STATE | ERR_SEGMENT_CONDEMNED"
    http_status: 409
    applies_to: "all transition endpoints EXCEPT POST /cabling/links/{link_id}/certify, whose state precondition reports the more specific errors at priorities 55 and 56"

  - priority: 55
    category: state
    check: "Certification target has install_state == TESTED_PASS"
    error_id: ERR_LINK_NOT_TESTED
    http_status: 409
    applies_to: "POST /cabling/links/{link_id}/certify"

  - priority: 56
    category: state
    check: "Certification target has record_state == RECORDED (label applied and as-built drawing updated)"
    error_id: ERR_LINK_NOT_RECORDED
    http_status: 409
    applies_to: "POST /cabling/links/{link_id}/certify"

  - priority: 60
    category: state
    check: "The submitted expected_<parent>_version equals the parent's current version (see §1.2.1)"
    error_id: "ERR_STALE_PATHWAY_VERSION | ERR_STALE_RACK_VERSION | ERR_STALE_PROJECT_VERSION"
    http_status: 412
    applies_to: "POST /cabling/link-routes, POST /cabling/link-routes/{route_id}/withdraw, POST /cabling/pathway-segments/{segment_id}/reparent, POST /cabling/rack-unit-assignments, POST /cabling/rack-unit-assignments/{assignment_id}/release, POST /cabling/warranty-registrations/{registration_id}/submit"

  - priority: 70
    category: business_safety
    check: "Segregation of duties: the acting X-User-ID differs from Link.installer_user_id AND from the tester_user_id of the link's latest TestResult"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /cabling/links/{link_id}/certify"

  - priority: 80
    category: business_safety
    check: "Plenum rating: a route through a PathwaySegment with in_plenum_space true requires CableType.jacket_rating IN {CMP, LSZH}"
    error_id: ERR_PLENUM_RATING_REQUIRED
    http_status: 422
    applies_to: "POST /cabling/link-routes"

  - priority: 85
    category: business_safety
    check: "Separation from power: when PathwaySegment.shared_with_power is true, power_separation_mm >= the requirement from calculations.power_separation_requirement"
    error_id: ERR_POWER_SEPARATION_INSUFFICIENT
    http_status: 422
    applies_to: "POST /cabling/link-routes"

  - priority: 90
    category: business_safety
    check: "The link's TelecomRoom has grounding_status == COMPLIANT before any conductor is terminated or the room is energized"
    error_id: ERR_ROOM_NOT_GROUNDED
    http_status: 409
    applies_to: "POST /cabling/links/{link_id}/terminate, POST /cabling/telecom-rooms/{room_id}/energize"

  - priority: 95
    category: business_safety
    check: "Bonding conductor is at least #6 AWG (bonding_conductor_awg <= 6); a thinner conductor is refused outright and no measurement is recorded"
    error_id: ERR_BONDING_NON_COMPLIANT
    http_status: 422
    applies_to: "POST /cabling/telecom-rooms/{room_id}/grounding-verification"

  - priority: 100
    category: business_referential
    check: "Cross-aggregate consistency: referenced Link, TelecomRoom, PathwaySegment and TradeCoordination rows belong to the same CablingProject as the request's project_id"
    error_id: ERR_CROSS_PROJECT_REFERENCE
    http_status: 409
    applies_to: "POST /cabling/links, POST /cabling/link-routes, POST /cabling/mac-tickets, POST /cabling/trade-coordinations, POST /cabling/pathway-segments"

  - priority: 105
    category: business_referential
    check: "Pathway continuity: a route with sequence_index > 1 must sit on the segment whose upstream_segment_id equals the segment id of the link's route at sequence_index - 1, and sequence_index must not duplicate an OCCUPYING route of the link"
    error_id: ERR_ROUTE_SEQUENCE_GAP
    http_status: 422
    applies_to: "POST /cabling/link-routes"

  - priority: 110
    category: business_referential
    check: "Acyclicity of self-referential graphs: an upstream_segment_id chain must not reach the segment being reparented nor exceed MAX_PATHWAY_DEPTH hops, and a predecessor_coordination_id chain must not already contain the (trade, milestone) pair being created nor exceed MAX_PATHWAY_DEPTH hops"
    error_id: "ERR_PATHWAY_CYCLE | ERR_COORDINATION_CYCLE"
    http_status: 422
    applies_to: "POST /cabling/pathway-segments, POST /cabling/pathway-segments/{segment_id}/reparent, POST /cabling/trade-coordinations"

  - priority: 115
    category: business_referential
    check: "A link may only be pulled once it has at least one OCCUPYING route and all of those routes sit on SERVICEABLE segments"
    error_id: ERR_LINK_NOT_ROUTED
    http_status: 409
    applies_to: "POST /cabling/links/{link_id}/pull"

  - priority: 120
    category: business_referential
    check: "Trade sequence: pulling requires a CEILING / PATHWAY_ROUGH_IN coordination in CONFIRMED or RELEASED; energizing requires an ELECTRICAL / POWER_ENERGIZE coordination in RELEASED; declaring occupancy requires every CEILING coordination of the project in RELEASED"
    error_id: ERR_TRADE_NOT_COORDINATED
    http_status: 409
    applies_to: "POST /cabling/links/{link_id}/pull, POST /cabling/telecom-rooms/{room_id}/energize, POST /cabling/projects/{project_id}/occupancy"

  - priority: 125
    category: business_referential
    check: "MAC tickets exist only after occupancy: CablingProject.occupancy_status == OCCUPIED"
    error_id: ERR_PROJECT_NOT_OCCUPIED
    http_status: 409
    applies_to: "POST /cabling/mac-tickets"

  - priority: 130
    category: business_referential
    check: "Warranty submission requires CablingProject.warranty_status == ELIGIBLE"
    error_id: ERR_WARRANTY_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /cabling/warranty-registrations/{registration_id}/submit"

  - priority: 135
    category: business_referential
    check: "Version pinning: a REGISTER decision requires CablingProject.version == WarrantyRegistration.pinned_project_version"
    error_id: ERR_WARRANTY_PIN_STALE
    http_status: 409
    applies_to: "POST /cabling/warranty-registrations/{registration_id}/decision"

  - priority: 140
    category: business_referential
    check: "Only a strict PASS may be certified; a PASS_ASTERISK (margin inside tester accuracy) is not certifiable"
    error_id: ERR_MARGINAL_TEST_NOT_CERTIFIABLE
    http_status: 409
    applies_to: "POST /cabling/links/{link_id}/certify"

  - priority: 145
    category: business_constraint
    check: "Identifier matches the project's TIA-606 pattern (calculations.identifier_format_check)"
    error_id: ERR_IDENTIFIER_FORMAT_INVALID
    http_status: 422
    applies_to: "POST /cabling/links, POST /cabling/mac-tickets/{ticket_id}/complete"

  - priority: 150
    category: business_constraint
    check: "Identifier is unique among the project's links"
    error_id: ERR_DUPLICATE_LINK_IDENTIFIER
    http_status: 409
    applies_to: "POST /cabling/links, POST /cabling/mac-tickets/{ticket_id}/complete"

  - priority: 155
    category: business_constraint
    check: "applied_identifier equals Link.identifier"
    error_id: ERR_LABEL_MISMATCH
    http_status: 422
    applies_to: "POST /cabling/links/{link_id}/label"

  - priority: 160
    category: business_constraint
    check: "Link.application appears in CableType.applications"
    error_id: ERR_APPLICATION_NOT_SUPPORTED
    http_status: 422
    applies_to: "POST /cabling/links"

  - priority: 165
    category: business_constraint
    check: "The closed rack-unit interval [start_ru, end_ru] shares no unit with an ACTIVE assignment on the same rack"
    error_id: ERR_RACK_RU_CONFLICT
    http_status: 409
    applies_to: "POST /cabling/rack-unit-assignments"

  - priority: 170
    category: business_temporal
    check: "The buffered candidate window overlaps fewer than ROOM_CONCURRENT_CREW_CAPACITY occupying tickets in the room (calculations.mac_window_occupancy_check)"
    error_id: ERR_ROOM_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /cabling/mac-tickets/{ticket_id}/schedule"

  - priority: 175
    category: business_temporal
    check: "The logical clock sits inside the half-open scheduled window [scheduled_window_start, scheduled_window_end)"
    error_id: ERR_TICKET_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /cabling/mac-tickets/{ticket_id}/start"

  - priority: 180
    category: business_constraint
    check: "permanent_link_length_m <= the PERMANENT_LINK limit (90.00 m for copper, 90% of max_channel_length_m for fibre)"
    error_id: ERR_LINK_LENGTH_EXCEEDED
    http_status: 422
    applies_to: "POST /cabling/links/{link_id}/pull"

  - priority: 185
    category: business_constraint
    check: "Conduit/tray fill after admitting the candidate stays within allowed_fill_pct (calculations.pathway_fill_evaluation)"
    error_id: ERR_PATHWAY_FILL_EXCEEDED
    http_status: 422
    applies_to: "POST /cabling/link-routes"

  - priority: 190
    category: business_constraint
    check: "end_ru <= Rack.total_ru"
    error_id: ERR_RACK_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /cabling/rack-unit-assignments"

  - priority: 195
    category: business_fiscal
    check: "TelecomRoom.power_load_va plus the candidate's power_va stays within ups_capacity_va; energizing requires power_load_va <= ups_capacity_va"
    error_id: ERR_POWER_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /cabling/rack-unit-assignments, POST /cabling/telecom-rooms/{room_id}/energize"

  - priority: 200
    category: business_fiscal
    check: "consumed_mac_cents plus the candidate ESTIMATE stays within CablingProject.mac_budget_cents"
    error_id: ERR_MAC_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /cabling/mac-tickets/{ticket_id}/schedule"

  - priority: 205
    category: business_constraint
    check: "Occupancy readiness: completeness_pct_strict >= 90.00 before the space may be declared OCCUPIED"
    error_id: ERR_OCCUPANCY_READINESS_NOT_MET
    http_status: 409
    applies_to: "POST /cabling/projects/{project_id}/occupancy"

# =============================================================================
# §1.5 API Endpoint Table
# Flat graph topology: every entity has its own top-level collection under
# /cabling, a detail GET, and — where it is the child side of a foreign key —
# a filterable list GET that accepts the FK field as a query parameter.
# =============================================================================
endpoints:

  # ---- CablingProject ------------------------------------------------------
  - method: POST
    path: "/cabling/projects"
    description: "Open a new structured-cabling project"
    roles: [ProjectManager]
    code: 201
    input: [name, site_code, plenum_ceiling, identifier_scheme, "warranty_program?", "mac_budget_cents?"]
    output: CablingProject
    side_effects:
      - "occupancy_status = PRE_OCCUPANCY, warranty_status = NOT_ELIGIBLE, all roll-up counters 0, completeness_pct_strict = 0.00, consumed_mac_cents = 0, version = 1"

  - method: GET
    path: "/cabling/projects/{project_id}"
    description: "Read a project with its roll-up counters"
    roles: [ProjectManager, DesignEngineer, Installer, TestTechnician, Certifier, ManufacturerAgent, Client]
    code: 200
    input: []
    output: CablingProject
    side_effects: []

  - method: GET
    path: "/cabling/projects"
    description: "List projects, filterable and paginated"
    roles: [ProjectManager, DesignEngineer, ManufacturerAgent]
    code: 200
    input: ["site_code?", "warranty_status?", "occupancy_status?", "limit?", "offset?"]
    output: CablingProject[]
    side_effects: []

  - method: POST
    path: "/cabling/projects/{project_id}/occupancy"
    description: "Declare the space occupied, unlocking moves-adds-changes ticketing"
    roles: [ProjectManager]
    code: 200
    input: [occupancy_status]
    output: CablingProject
    side_effects:
      - "PRE_OCCUPANCY -> OCCUPIED per state_machines.CablingProject"
      - "increments CablingProject.version by 1"

  - method: GET
    path: "/cabling/projects/{project_id}/certification-summary"
    description: "Computed read: both variants of certification completeness plus the as-built cost roll-up"
    roles: [ProjectManager, DesignEngineer, Certifier, ManufacturerAgent, Client]
    code: 200
    input: []
    output: "{ total_link_count: integer, certified_link_count: integer, failed_link_count: integer, completeness_pct_strict: number, completeness_pct_provisional: number, warranty_status: string, as_built_cost_cents: integer, consumed_mac_cents: integer }"
    side_effects: []

  # ---- TelecomRoom ---------------------------------------------------------
  - method: POST
    path: "/cabling/telecom-rooms"
    description: "Add a telecom room to a project"
    roles: [ProjectManager]
    code: 201
    input: [project_id, room_code, floor, branch_circuit_amps, ups_capacity_va]
    output: TelecomRoom
    side_effects:
      - "room_state = ROUGH_IN, grounding_status = UNVERIFIED, power_load_va = 0, power_headroom_va = ups_capacity_va, version = 1"

  - method: GET
    path: "/cabling/telecom-rooms/{room_id}"
    description: "Read a telecom room with its grounding and power ledger"
    roles: [ProjectManager, DesignEngineer, Installer, TestTechnician, Certifier, Client]
    code: 200
    input: []
    output: TelecomRoom
    side_effects: []

  - method: GET
    path: "/cabling/telecom-rooms"
    description: "List telecom rooms; reverse-reachability read for TelecomRoom.project_id"
    roles: [ProjectManager, DesignEngineer, Installer, TestTechnician, Certifier, Client]
    code: 200
    input: ["project_id?", "room_state?", "grounding_status?", "limit?", "offset?"]
    output: TelecomRoom[]
    side_effects: []

  - method: POST
    path: "/cabling/telecom-rooms/{room_id}/grounding-verification"
    description: "Record a bonding and grounding measurement; grades grounding_status"
    roles: [ProjectManager, Certifier]
    code: 200
    input: [tgb_installed, bonding_conductor_awg, ground_resistance_milliohms]
    output: TelecomRoom
    side_effects:
      - "grounding_status graded by calculations.grounding_compliance_evaluation"
      - "room_state ROUGH_IN -> GROUNDED on COMPLIANT; GROUNDED -> ROUGH_IN on NON_COMPLIANT"
      - "increments TelecomRoom.version by 1"

  - method: POST
    path: "/cabling/telecom-rooms/{room_id}/energize"
    description: "Energize the room's rack power distribution"
    roles: [ProjectManager]
    code: 200
    input: []
    output: TelecomRoom
    side_effects:
      - "room_state GROUNDED -> ENERGIZED"
      - "increments TelecomRoom.version by 1"

  # ---- Rack / rack elevation ----------------------------------------------
  - method: POST
    path: "/cabling/racks"
    description: "Add a rack to a telecom room"
    roles: [DesignEngineer]
    code: 201
    input: [telecom_room_id, rack_code, total_ru]
    output: Rack
    side_effects:
      - "occupied_ru = 0, available_ru = total_ru, power_draw_va = 0, version = 1"

  - method: GET
    path: "/cabling/racks/{rack_id}"
    description: "Read a rack with its rack-unit and power ledger"
    roles: [ProjectManager, DesignEngineer, Installer, TestTechnician, Certifier, Client]
    code: 200
    input: []
    output: Rack
    side_effects: []

  - method: GET
    path: "/cabling/racks"
    description: "List racks; reverse-reachability read for Rack.telecom_room_id"
    roles: [ProjectManager, DesignEngineer, Installer, TestTechnician, Certifier, Client]
    code: 200
    input: ["telecom_room_id?", "limit?", "offset?"]
    output: Rack[]
    side_effects: []

  - method: POST
    path: "/cabling/rack-unit-assignments"
    description: "Place equipment on the rack elevation over a closed rack-unit interval"
    roles: [DesignEngineer]
    code: 201
    input: [rack_id, equipment_label, start_ru, end_ru, power_va, expected_rack_version]
    output: RackUnitAssignment
    side_effects:
      - "span_ru computed; Rack.occupied_ru, Rack.available_ru and Rack.power_draw_va updated (hop 2)"
      - "TelecomRoom.power_load_va and power_headroom_va recomputed (hop 3)"
      - "increments Rack.version by 1; increments TelecomRoom.version by 1"

  - method: GET
    path: "/cabling/rack-unit-assignments/{assignment_id}"
    description: "Read one rack elevation placement"
    roles: [ProjectManager, DesignEngineer, Installer, Certifier]
    code: 200
    input: []
    output: RackUnitAssignment
    side_effects: []

  - method: GET
    path: "/cabling/rack-unit-assignments"
    description: "Rack elevation read; reverse-reachability read for RackUnitAssignment.rack_id"
    roles: [ProjectManager, DesignEngineer, Installer, Certifier]
    code: 200
    input: ["rack_id?", "assignment_state?", "limit?", "offset?"]
    output: RackUnitAssignment[]
    side_effects: []

  - method: POST
    path: "/cabling/rack-unit-assignments/{assignment_id}/release"
    description: "Remove equipment from the elevation and give its rack units and power back"
    roles: [DesignEngineer]
    code: 200
    input: [released_reason, expected_rack_version]
    output: RackUnitAssignment
    side_effects:
      - "assignment_state ACTIVE -> RELEASED"
      - "Rack.occupied_ru, Rack.available_ru, Rack.power_draw_va, TelecomRoom.power_load_va and power_headroom_va restored to their pre-assignment values"
      - "increments Rack.version by 1; increments TelecomRoom.version by 1"

  # ---- PathwaySegment ------------------------------------------------------
  - method: POST
    path: "/cabling/pathway-segments"
    description: "Design a cable tray, conduit, innerduct or J-hook segment"
    roles: [DesignEngineer]
    code: 201
    input: [project_id, segment_code, pathway_type, usable_area_sq_mm, length_m, "bend_count?", "in_plenum_space?", "shared_with_power?", "power_separation_mm?", "upstream_segment_id?"]
    output: PathwaySegment
    side_effects:
      - "pathway_state = SERVICEABLE, occupying_route_count = 0, fill_area_used_sq_mm = 0.00, fill_ratio = 0.0000, pathway_depth computed by calculations.pathway_graph_depth, version = 1"

  - method: GET
    path: "/cabling/pathway-segments/{segment_id}"
    description: "Read a pathway segment with its fill ledger"
    roles: [ProjectManager, DesignEngineer, Installer, TestTechnician, Certifier, Client]
    code: 200
    input: []
    output: PathwaySegment
    side_effects: []

  - method: GET
    path: "/cabling/pathway-segments"
    description: "List pathway segments; reverse-reachability read for PathwaySegment.project_id and PathwaySegment.upstream_segment_id"
    roles: [ProjectManager, DesignEngineer, Installer, TestTechnician, Certifier, Client]
    code: 200
    input: ["project_id?", "upstream_segment_id?", "pathway_state?", "pathway_type?", "limit?", "offset?"]
    output: PathwaySegment[]
    side_effects: []

  - method: POST
    path: "/cabling/pathway-segments/{segment_id}/condemn"
    description: "Condemn a segment after an inspection finding; releases its fill and reverts the links routed through it"
    roles: [ProjectManager]
    code: 200
    input: [condemned_reason]
    output: PathwaySegment
    side_effects:
      - "Cascade B hops 1-4 per state_machines.PathwaySegment"
      - "increments PathwaySegment.version by 1"

  - method: POST
    path: "/cabling/pathway-segments/{segment_id}/reparent"
    description: "Re-point a segment at a different upstream segment; rejects cycles and depth overflow"
    roles: [DesignEngineer]
    code: 200
    input: [upstream_segment_id, expected_segment_version]
    output: PathwaySegment
    side_effects:
      - "upstream_segment_id updated; pathway_depth recomputed for the segment and every descendant"
      - "increments PathwaySegment.version by 1"

  # ---- CableType (immutable catalogue) ------------------------------------
  - method: POST
    path: "/cabling/cable-types"
    description: "Register an immutable cable type in the selection catalogue"
    roles: [DesignEngineer]
    code: 201
    input: [category, jacket_rating, outer_diameter_mm, max_channel_length_m, "shielded?", cost_per_meter_cents, applications]
    output: CableType
    side_effects:
      - "cross_section_area_sq_mm computed from outer_diameter_mm; the row is immutable thereafter — no update endpoint and no version field"

  - method: GET
    path: "/cabling/cable-types/{cable_type_id}"
    description: "Read a cable type"
    roles: [ProjectManager, DesignEngineer, Installer, TestTechnician, Certifier, Client]
    code: 200
    input: []
    output: CableType
    side_effects: []

  - method: GET
    path: "/cabling/cable-types"
    description: "List the cable type catalogue"
    roles: [ProjectManager, DesignEngineer, Installer, TestTechnician, Certifier, Client]
    code: 200
    input: ["category?", "jacket_rating?", "limit?", "offset?"]
    output: CableType[]
    side_effects: []

  # ---- Link ----------------------------------------------------------------
  - method: POST
    path: "/cabling/links"
    description: "Design a link: cable selection, identifier and both length variants"
    roles: [DesignEngineer]
    code: 201
    input: [project_id, telecom_room_id, cable_type_id, identifier, application, horizontal_length_m, "consolidation_point_stub_m?", "patch_cord_allowance_m?"]
    output: Link
    side_effects:
      - "permanent_link_length_m and channel_length_m computed by both variants of calculations.link_length_evaluation"
      - "material_cost_cents computed per calculations.project_as_built_cost step 1"
      - "install_state = DESIGNED, record_state = UNLABELED, routed_segment_count = 0, test_attempt_count = 0, version = 1"
      - "CablingProject.total_link_count incremented; completeness_pct_strict and completeness_pct_provisional recomputed; increments CablingProject.version by 1"

  - method: GET
    path: "/cabling/links/{link_id}"
    description: "Read a link with both install and record dimensions"
    roles: [ProjectManager, DesignEngineer, Installer, TestTechnician, Certifier, ManufacturerAgent, Client]
    code: 200
    input: []
    output: Link
    side_effects: []

  - method: GET
    path: "/cabling/links"
    description: "List links; reverse-reachability read for Link.project_id, Link.telecom_room_id and Link.cable_type_id"
    roles: [ProjectManager, DesignEngineer, Installer, TestTechnician, Certifier, ManufacturerAgent, Client]
    code: 200
    input: ["project_id?", "telecom_room_id?", "cable_type_id?", "install_state?", "record_state?", "application?", "limit?", "offset?"]
    output: Link[]
    side_effects: []

  - method: POST
    path: "/cabling/links/{link_id}/pull"
    description: "Pull the cable through its routed pathway chain"
    roles: [Installer]
    code: 200
    input: []
    output: Link
    side_effects:
      - "install_state DESIGNED -> PULLED"
      - "increments Link.version by 1"

  - method: POST
    path: "/cabling/links/{link_id}/terminate"
    description: "Terminate both ends of the link at the outlet and the patch panel"
    roles: [Installer]
    code: 200
    input: []
    output: Link
    side_effects:
      - "install_state PULLED -> TERMINATED, or TESTED_FAIL -> TERMINATED for a re-termination"
      - "installer_user_id set to the calling X-User-ID; on a re-termination it is overwritten with the current caller"
      - "increments Link.version by 1"

  - method: POST
    path: "/cabling/links/{link_id}/label"
    description: "Apply the TIA-606 identifier physically at both ends"
    roles: [Installer]
    code: 200
    input: [applied_identifier]
    output: Link
    side_effects:
      - "record_state UNLABELED -> LABELED"
      - "increments Link.version by 1"

  - method: POST
    path: "/cabling/links/{link_id}/record"
    description: "File the link on an as-built drawing sheet, completing administration records"
    roles: [DesignEngineer, ProjectManager]
    code: 200
    input: [drawing_sheet_ref]
    output: Link
    side_effects:
      - "record_state LABELED -> RECORDED"
      - "increments Link.version by 1"

  - method: POST
    path: "/cabling/links/{link_id}/certify"
    description: "Certify the link; drives Cascade A up to warranty eligibility"
    roles: [Certifier]
    code: 200
    input: []
    output: Link
    side_effects:
      - "Cascade A hops 1-4 per state_machines.Link (install_state) CERTIFIED transition"
      - "certifier_user_id set to the calling X-User-ID"
      - "increments Link.version by 1; increments CablingProject.version by 1"

  - method: GET
    path: "/cabling/links/{link_id}/certification-report"
    description: "Computed read: the certification report for one link, assembled from its latest TestResult"
    roles: [ProjectManager, DesignEngineer, TestTechnician, Certifier, ManufacturerAgent, Client]
    code: 200
    input: []
    output: "{ link_id: string, identifier: string, install_state: string, record_state: string, test_attempt_count: integer, latest_test_outcome: string, latest_test_standard: string, graded_length_m: number, insertion_loss_budget_db: number, worst_margin_db: number, failure_reason: string, certifier_user_id: string }"
    side_effects: []

  # ---- LinkPathwayRoute (many-to-many junction) ---------------------------
  - method: POST
    path: "/cabling/link-routes"
    description: "Route a link through one pathway segment; admits or rejects the cable against the segment's fill and separation rules"
    roles: [DesignEngineer]
    code: 201
    input: [link_id, pathway_segment_id, sequence_index, expected_segment_version]
    output: LinkPathwayRoute
    side_effects:
      - "consumed_area_sq_mm snapshotted from CableType.cross_section_area_sq_mm"
      - "PathwaySegment.occupying_route_count, fill_area_used_sq_mm, allowed_fill_pct and fill_ratio recomputed by calculations.pathway_fill_evaluation"
      - "Link.routed_segment_count recomputed"
      - "increments PathwaySegment.version by 1; increments Link.version by 1"

  - method: GET
    path: "/cabling/link-routes/{route_id}"
    description: "Read one routing of a link through a segment"
    roles: [ProjectManager, DesignEngineer, Installer, TestTechnician, Certifier]
    code: 200
    input: []
    output: LinkPathwayRoute
    side_effects: []

  - method: GET
    path: "/cabling/link-routes"
    description: "List routes; reverse-reachability read for LinkPathwayRoute.link_id and LinkPathwayRoute.pathway_segment_id"
    roles: [ProjectManager, DesignEngineer, Installer, TestTechnician, Certifier]
    code: 200
    input: ["link_id?", "pathway_segment_id?", "route_state?", "limit?", "offset?"]
    output: LinkPathwayRoute[]
    side_effects: []

  - method: POST
    path: "/cabling/link-routes/{route_id}/withdraw"
    description: "Withdraw a routing; releases exactly the area it consumed"
    roles: [DesignEngineer]
    code: 200
    input: [expected_segment_version]
    output: LinkPathwayRoute
    side_effects:
      - "route_state OCCUPYING -> WITHDRAWN"
      - "PathwaySegment.fill_area_used_sq_mm reduced by consumed_area_sq_mm; occupying_route_count, allowed_fill_pct and fill_ratio recomputed"
      - "Link.routed_segment_count recomputed"
      - "increments PathwaySegment.version by 1; increments Link.version by 1"

  # ---- TestResult (immutable) ---------------------------------------------
  - method: POST
    path: "/cabling/test-results"
    description: "Record a field-tester result for a link and grade it"
    roles: [TestTechnician]
    code: 201
    input: [link_id, test_standard, tester_model, insertion_loss_db, next_margin_db, return_loss_margin_db, length_measured_m]
    output: TestResult
    side_effects:
      - "insertion_loss_budget_db, worst_margin_db, outcome and failure_reason graded by calculations.link_test_outcome"
      - "Link.install_state moves to TESTED_PASS or TESTED_FAIL; Link.test_attempt_count and latest_test_outcome recomputed"
      - "CablingProject.failed_link_count and completeness_pct_provisional recomputed"
      - "the row is immutable thereafter — no update endpoint and no version field"

  - method: GET
    path: "/cabling/test-results/{test_result_id}"
    description: "Read one recorded test result"
    roles: [ProjectManager, DesignEngineer, Installer, TestTechnician, Certifier, ManufacturerAgent, Client]
    code: 200
    input: []
    output: TestResult
    side_effects: []

  - method: GET
    path: "/cabling/test-results"
    description: "Test result reporting; reverse-reachability read for TestResult.link_id"
    roles: [ProjectManager, DesignEngineer, Installer, TestTechnician, Certifier, ManufacturerAgent, Client]
    code: 200
    input: ["link_id?", "outcome?", "test_standard?", "limit?", "offset?"]
    output: TestResult[]
    side_effects: []

  # ---- WarrantyRegistration ------------------------------------------------
  - method: POST
    path: "/cabling/warranty-registrations"
    description: "Open a manufacturer warranty registration for a project"
    roles: [ProjectManager]
    code: 201
    input: [project_id, manufacturer_program]
    output: WarrantyRegistration
    side_effects:
      - "registration_state = DRAFT, pinned_project_version = null, coverage_years = null, version = 1"

  - method: GET
    path: "/cabling/warranty-registrations/{registration_id}"
    description: "Read a warranty registration"
    roles: [ProjectManager, DesignEngineer, Certifier, ManufacturerAgent, Client]
    code: 200
    input: []
    output: WarrantyRegistration
    side_effects: []

  - method: GET
    path: "/cabling/warranty-registrations"
    description: "List warranty registrations; reverse-reachability read for WarrantyRegistration.project_id"
    roles: [ProjectManager, DesignEngineer, Certifier, ManufacturerAgent, Client]
    code: 200
    input: ["project_id?", "registration_state?", "manufacturer_program?", "limit?", "offset?"]
    output: WarrantyRegistration[]
    side_effects: []

  - method: POST
    path: "/cabling/warranty-registrations/{registration_id}/submit"
    description: "Submit a READY registration to the manufacturer programme"
    roles: [ProjectManager]
    code: 200
    input: [expected_project_version]
    output: WarrantyRegistration
    side_effects:
      - "registration_state READY -> SUBMITTED"
      - "submitted_certified_link_count frozen from CablingProject.certified_link_count; coverage_years computed by calculations.warranty_coverage_determination"
      - "increments WarrantyRegistration.version by 1"

  - method: POST
    path: "/cabling/warranty-registrations/{registration_id}/decision"
    description: "Manufacturer decides a submitted registration"
    roles: [ManufacturerAgent]
    code: 200
    input: [decision, "registration_number?", "rejection_reason?"]
    output: WarrantyRegistration
    side_effects:
      - "registration_state SUBMITTED -> REGISTERED on decision=REGISTER, or SUBMITTED -> REJECTED on decision=REJECT"
      - "CablingProject.warranty_status set to REGISTERED or ELIGIBLE respectively"
      - "increments WarrantyRegistration.version by 1; increments CablingProject.version by 1"

  - method: POST
    path: "/cabling/warranty-registrations/{registration_id}/reopen"
    description: "Return a rejected registration to DRAFT so the deficiency can be fixed"
    roles: [ProjectManager]
    code: 200
    input: []
    output: WarrantyRegistration
    side_effects:
      - "registration_state REJECTED -> DRAFT; pinned_project_version, submitted_certified_link_count and coverage_years cleared to null"
      - "increments WarrantyRegistration.version by 1"

  # ---- MacTicket -----------------------------------------------------------
  - method: POST
    path: "/cabling/mac-tickets"
    description: "Raise a moves-adds-changes ticket after occupancy"
    roles: [Client]
    code: 201
    input: [project_id, link_id, telecom_room_id, ticket_type, requested_window_start, requested_window_end, labor_hours_estimate, "expedite_requested?", "new_identifier?"]
    output: MacTicket
    side_effects:
      - "ticket_state = SUBMITTED, rework_count = 0, estimated_billed_cents = null, final_billed_cents = null, version = 1"

  - method: GET
    path: "/cabling/mac-tickets/{ticket_id}"
    description: "Read a moves-adds-changes ticket"
    roles: [ProjectManager, DesignEngineer, Installer, Certifier, Client]
    code: 200
    input: []
    output: MacTicket
    side_effects: []

  - method: GET
    path: "/cabling/mac-tickets"
    description: "List tickets; reverse-reachability read for MacTicket.project_id, MacTicket.link_id and MacTicket.telecom_room_id"
    roles: [ProjectManager, DesignEngineer, Installer, Certifier, Client]
    code: 200
    input: ["project_id?", "link_id?", "telecom_room_id?", "ticket_state?", "ticket_type?", "limit?", "offset?"]
    output: MacTicket[]
    side_effects: []

  - method: POST
    path: "/cabling/mac-tickets/{ticket_id}/schedule"
    description: "Schedule a crew window; runs the ESTIMATE billing variant and reserves the room window"
    roles: [ProjectManager]
    code: 200
    input: [scheduled_window_start, scheduled_window_end]
    output: MacTicket
    side_effects:
      - "ticket_state SUBMITTED -> SCHEDULED"
      - "estimated_billed_cents stamped by the ESTIMATE variant of calculations.mac_ticket_billing"
      - "CablingProject.consumed_mac_cents recomputed by calculations.mac_budget_ledger"
      - "increments MacTicket.version by 1; increments CablingProject.version by 1"

  - method: POST
    path: "/cabling/mac-tickets/{ticket_id}/reject"
    description: "Reject a submitted ticket outright"
    roles: [ProjectManager]
    code: 200
    input: []
    output: MacTicket
    side_effects:
      - "ticket_state SUBMITTED -> REJECTED (terminal)"
      - "increments MacTicket.version by 1"

  - method: POST
    path: "/cabling/mac-tickets/{ticket_id}/start"
    description: "Crew starts work inside the scheduled window"
    roles: [Installer]
    code: 200
    input: []
    output: MacTicket
    side_effects:
      - "ticket_state SCHEDULED -> IN_PROGRESS"
      - "increments MacTicket.version by 1"

  - method: POST
    path: "/cabling/mac-tickets/{ticket_id}/rework"
    description: "Send work in progress back for rescheduling"
    roles: [ProjectManager]
    code: 200
    input: []
    output: MacTicket
    side_effects:
      - "ticket_state IN_PROGRESS -> SUBMITTED; rework_count incremented; scheduled_window_start, scheduled_window_end and estimated_billed_cents cleared to null"
      - "CablingProject.consumed_mac_cents recomputed"
      - "increments MacTicket.version by 1; increments CablingProject.version by 1"

  - method: POST
    path: "/cabling/mac-tickets/{ticket_id}/complete"
    description: "Close out the ticket; runs the FINAL billing variant and applies a CHANGE ticket's rename cascade"
    roles: [Installer]
    code: 200
    input: [actual_labor_hours, "new_identifier?"]
    output: MacTicket
    side_effects:
      - "Cascade C hops 1-4 per state_machines.MacTicket COMPLETED transition"
      - "final_billed_cents stamped by the FINAL variant of calculations.mac_ticket_billing; CablingProject.consumed_mac_cents recomputed"
      - "increments MacTicket.version by 1; increments Link.version by 1; increments CablingProject.version by 1"

  # ---- TradeCoordination ---------------------------------------------------
  - method: POST
    path: "/cabling/trade-coordinations"
    description: "Request a coordination milestone from another trade"
    roles: [ProjectManager]
    code: 201
    input: [project_id, trade, milestone, "predecessor_coordination_id?"]
    output: TradeCoordination
    side_effects:
      - "coordination_state = REQUESTED, confirmed_date = null, block_reason = null, version = 1"

  - method: GET
    path: "/cabling/trade-coordinations/{coordination_id}"
    description: "Read a coordination milestone"
    roles: [ProjectManager, DesignEngineer, Installer, Certifier, Client]
    code: 200
    input: []
    output: TradeCoordination
    side_effects: []

  - method: GET
    path: "/cabling/trade-coordinations"
    description: "List coordinations; reverse-reachability read for TradeCoordination.project_id and TradeCoordination.predecessor_coordination_id"
    roles: [ProjectManager, DesignEngineer, Installer, Certifier, Client]
    code: 200
    input: ["project_id?", "predecessor_coordination_id?", "trade?", "milestone?", "coordination_state?", "limit?", "offset?"]
    output: TradeCoordination[]
    side_effects: []

  - method: POST
    path: "/cabling/trade-coordinations/{coordination_id}/confirm"
    description: "The other trade confirms the milestone date"
    roles: [ProjectManager]
    code: 200
    input: [confirmed_date]
    output: TradeCoordination
    side_effects:
      - "coordination_state REQUESTED -> CONFIRMED"
      - "increments TradeCoordination.version by 1"

  - method: POST
    path: "/cabling/trade-coordinations/{coordination_id}/release"
    description: "Release the milestone, unblocking the installation sequence that depends on it"
    roles: [ProjectManager]
    code: 200
    input: []
    output: TradeCoordination
    side_effects:
      - "coordination_state CONFIRMED -> RELEASED (terminal)"
      - "increments TradeCoordination.version by 1"

  - method: POST
    path: "/cabling/trade-coordinations/{coordination_id}/block"
    description: "Block a confirmed milestone because another trade is in the way"
    roles: [ProjectManager]
    code: 200
    input: [block_reason]
    output: TradeCoordination
    side_effects:
      - "coordination_state CONFIRMED -> BLOCKED"
      - "increments TradeCoordination.version by 1"

  - method: POST
    path: "/cabling/trade-coordinations/{coordination_id}/unblock"
    description: "Clear a block and send the milestone back to REQUESTED for re-confirmation"
    roles: [ProjectManager]
    code: 200
    input: []
    output: TradeCoordination
    side_effects:
      - "coordination_state BLOCKED -> REQUESTED; confirmed_date and block_reason cleared to null"
      - "increments TradeCoordination.version by 1"

  # ---- Logical clock -------------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-only logical clock control. The server starts at the fixed default 2026-08-01T00:00:00Z and only ever advances when this endpoint is called; every recorded_at, created_at and updated_at reads this clock."
    roles: [ProjectManager, DesignEngineer, Installer, TestTechnician, Certifier, ManufacturerAgent, Client]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "sets the logical clock; no business entity is modified"

# =============================================================================
# §1.6 Error Code Catalog
# Every id below is triggerable through at least one §1.5 endpoint.
# =============================================================================
errors:

  # ---- auth ----------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty on any endpoint other than POST /_clock/set_current_utc"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is not listed in the endpoint's roles, or is not a role declared in §1.7"

  # ---- request shape -------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required input field is missing, an enum value is outside its declared domain, a numeric field violates its declared constraint, a datetime is not ISO 8601 UTC, or a window ends at or before it starts"

  # ---- existence -----------------------------------------------------------
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "project_id in the path or payload matches no CablingProject"
  - id: ERR_TELECOM_ROOM_NOT_FOUND
    http: 404
    condition: "room_id or telecom_room_id matches no TelecomRoom"
  - id: ERR_RACK_NOT_FOUND
    http: 404
    condition: "rack_id matches no Rack"
  - id: ERR_RACK_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "assignment_id matches no RackUnitAssignment"
  - id: ERR_PATHWAY_SEGMENT_NOT_FOUND
    http: 404
    condition: "segment_id, pathway_segment_id or upstream_segment_id matches no PathwaySegment"
  - id: ERR_CABLE_TYPE_NOT_FOUND
    http: 404
    condition: "cable_type_id matches no CableType"
  - id: ERR_LINK_NOT_FOUND
    http: 404
    condition: "link_id matches no Link"
  - id: ERR_ROUTE_NOT_FOUND
    http: 404
    condition: "route_id matches no LinkPathwayRoute"
  - id: ERR_TEST_RESULT_NOT_FOUND
    http: 404
    condition: "test_result_id matches no TestResult"
  - id: ERR_WARRANTY_REGISTRATION_NOT_FOUND
    http: 404
    condition: "registration_id matches no WarrantyRegistration"
  - id: ERR_MAC_TICKET_NOT_FOUND
    http: 404
    condition: "ticket_id matches no MacTicket"
  - id: ERR_COORDINATION_NOT_FOUND
    http: 404
    condition: "coordination_id or predecessor_coordination_id matches no TradeCoordination"

  # ---- state (§1.4 priority 50-60) ----------------------------------------
  - id: ERR_INVALID_PROJECT_STATE
    http: 409
    condition: "A CablingProject transition is requested from a state that does not declare it — e.g. declaring occupancy on a project already OCCUPIED"
  - id: ERR_INVALID_ROOM_STATE
    http: 409
    condition: "A TelecomRoom transition is requested from a state that does not declare it — e.g. energizing a room already ENERGIZED"
  - id: ERR_INVALID_LINK_STATE
    http: 409
    condition: "A Link install_state transition is requested from a state that does not declare it — e.g. terminating a DESIGNED link, or certifying a link that is not TESTED_PASS"
  - id: ERR_INVALID_RECORD_STATE
    http: 409
    condition: "A Link record_state transition is requested from a state that does not declare it — e.g. recording a link that is still UNLABELED, or labelling a link that is already LABELED"
  - id: ERR_INVALID_ROUTE_STATE
    http: 409
    condition: "A LinkPathwayRoute transition is requested from a state that does not declare it — e.g. withdrawing a route that is already WITHDRAWN or SUSPENDED"
  - id: ERR_INVALID_ASSIGNMENT_STATE
    http: 409
    condition: "A RackUnitAssignment transition is requested from a state that does not declare it — e.g. releasing an assignment that is already RELEASED"
  - id: ERR_INVALID_TICKET_STATE
    http: 409
    condition: "A MacTicket transition is requested from a state that does not declare it — e.g. starting a SUBMITTED ticket, or completing a ticket that is not IN_PROGRESS"
  - id: ERR_INVALID_WARRANTY_STATE
    http: 409
    condition: "A WarrantyRegistration transition is requested from a state that does not declare it — e.g. submitting a DRAFT registration, or deciding one that is not SUBMITTED"
  - id: ERR_INVALID_COORDINATION_STATE
    http: 409
    condition: "A TradeCoordination transition is requested from a state that does not declare it — e.g. releasing a REQUESTED milestone, or blocking one that is already BLOCKED"
  - id: ERR_SEGMENT_CONDEMNED
    http: 409
    condition: "The targeted PathwaySegment is in pathway_state CONDEMNED, which is terminal: it accepts no new routes, no reparent and no further condemn"
  - id: ERR_LINK_NOT_TESTED
    http: 409
    condition: "Certification requested for a link whose install_state is not TESTED_PASS because no passing test exists yet"
  - id: ERR_LINK_NOT_RECORDED
    http: 409
    condition: "Certification requested for a link whose record_state is not RECORDED — the administration dimension lags the installation dimension"
  - id: ERR_STALE_PATHWAY_VERSION
    http: 412
    condition: "expected_segment_version does not equal the PathwaySegment's current version (concurrency_rules route-create-stale-segment)"
  - id: ERR_STALE_RACK_VERSION
    http: 412
    condition: "expected_rack_version does not equal the Rack's current version (concurrency_rules rack-assignment-stale-rack)"
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version does not equal the CablingProject's current version (concurrency_rules warranty-submit-stale-project)"

  # ---- business safety -----------------------------------------------------
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The X-User-ID certifying a link equals Link.installer_user_id or the tester_user_id of that link's latest TestResult"
  - id: ERR_PLENUM_RATING_REQUIRED
    http: 422
    condition: "A cable whose jacket_rating is neither CMP nor LSZH is routed through a segment with in_plenum_space true on a project with plenum_ceiling true, or terminated in such a space"
  - id: ERR_POWER_SEPARATION_INSUFFICIENT
    http: 422
    condition: "PathwaySegment.power_separation_mm is below the minimum that calculations.power_separation_requirement derives for the candidate cable on a segment shared with power"
  - id: ERR_ROOM_NOT_GROUNDED
    http: 409
    condition: "An operation that depends on a bonded room is attempted while the TelecomRoom's grounding_status is not COMPLIANT or its room_state is still ROUGH_IN"
  - id: ERR_BONDING_NON_COMPLIANT
    http: 422
    condition: "A grounding verification reports no telecommunications grounding busbar, a bonding conductor thinner than MAX_BONDING_AWG, or a ground resistance above MAX_GROUND_RESISTANCE_MILLIOHMS"

  # ---- business referential ------------------------------------------------
  - id: ERR_CROSS_PROJECT_REFERENCE
    http: 409
    condition: "Two referenced entities resolve to different CablingProjects — e.g. a route whose link and segment belong to different projects, or a ticket whose link and room disagree"
  - id: ERR_ROUTE_SEQUENCE_GAP
    http: 422
    condition: "sequence_index duplicates or leaves a gap in the link's ordered chain of OCCUPYING routes"
  - id: ERR_PATHWAY_CYCLE
    http: 422
    condition: "An upstream_segment_id assignment would close a cycle in the pathway graph or push pathway_depth past MAX_PATHWAY_DEPTH"
  - id: ERR_COORDINATION_CYCLE
    http: 422
    condition: "The predecessor_coordination_id chain of a coordination being created already contains a coordination with the same (trade, milestone) pair — the milestone would depend on itself — or the chain is longer than MAX_PATHWAY_DEPTH hops"
  - id: ERR_LINK_NOT_ROUTED
    http: 409
    condition: "A link is pulled with no OCCUPYING route, or while one of its routes sits on a segment that is not SERVICEABLE"
  - id: ERR_TRADE_NOT_COORDINATED
    http: 409
    condition: "An installation step runs before the TradeCoordination milestone it depends on reached RELEASED"
  - id: ERR_PREDECESSOR_NOT_RELEASED
    http: 409
    condition: "A TradeCoordination is released while its predecessor_coordination_id chain has a milestone that is not yet RELEASED"
  - id: ERR_PROJECT_NOT_OCCUPIED
    http: 409
    condition: "A moves-adds-changes ticket is raised while the project's occupancy_status is still PRE_OCCUPANCY"
  - id: ERR_WARRANTY_NOT_ELIGIBLE
    http: 409
    condition: "A registration is submitted while the project's warranty_status is not ELIGIBLE"
  - id: ERR_WARRANTY_PIN_STALE
    http: 409
    condition: "A decision is requested on a registration whose pinned_project_version no longer equals the project's current version, because the certified population moved after submission"
  - id: ERR_MARGINAL_TEST_NOT_CERTIFIABLE
    http: 409
    condition: "Certification requested for a link whose latest_test_outcome is PASS_ASTERISK — a marginal result must be retested, not certified"

  # ---- business constraints ------------------------------------------------
  - id: ERR_IDENTIFIER_FORMAT_INVALID
    http: 422
    condition: "An identifier does not match the pattern that CablingProject.identifier_scheme selects in calculations.identifier_format_check"
  - id: ERR_DUPLICATE_LINK_IDENTIFIER
    http: 409
    condition: "The identifier is already used by another Link in the same project"
  - id: ERR_LABEL_MISMATCH
    http: 422
    condition: "applied_identifier does not equal the link's identifier"
  - id: ERR_APPLICATION_NOT_SUPPORTED
    http: 422
    condition: "Link.application is not listed in the selected CableType.applications"
  - id: ERR_RACK_RU_CONFLICT
    http: 409
    condition: "The requested closed rack-unit interval [start_ru, end_ru] intersects an ACTIVE assignment on the same rack, including at a single shared unit"
  - id: ERR_RACK_CAPACITY_EXCEEDED
    http: 422
    condition: "end_ru exceeds Rack.total_ru, or the placement would push occupied_ru past total_ru"
  - id: ERR_LINK_LENGTH_EXCEEDED
    http: 422
    condition: "The graded length exceeds its variant's limit — permanent link above MAX_PERMANENT_LINK_M or channel above MAX_CHANNEL_M / CableType.max_channel_length_m"
  - id: ERR_PATHWAY_FILL_EXCEEDED
    http: 422
    condition: "Admitting the candidate cable would push fill_area_used_sq_mm past the allowed area that calculations.pathway_fill_evaluation derives for the resulting cable count, pathway type and bend derate"
  - id: ERR_OCCUPANCY_READINESS_NOT_MET
    http: 409
    condition: "Occupancy is declared while completeness_pct_strict is below the readiness threshold"

  # ---- business temporal ---------------------------------------------------
  - id: ERR_ROOM_WINDOW_CONFLICT
    http: 409
    condition: "The candidate crew window, widened by ROOM_CHANGEOVER_BUFFER_MINUTES at both ends, overlaps at least ROOM_CONCURRENT_CREW_CAPACITY already-scheduled or in-progress windows in the same TelecomRoom"
  - id: ERR_TICKET_WINDOW_NOT_OPEN
    http: 409
    condition: "Work is started outside the ticket's scheduled window as read from the logical clock"

  # ---- business fiscal -----------------------------------------------------
  - id: ERR_POWER_CAPACITY_EXCEEDED
    http: 422
    condition: "A rack placement would push TelecomRoom.power_load_va past ups_capacity_va, leaving power_headroom_va negative"
  - id: ERR_MAC_BUDGET_EXCEEDED
    http: 402
    condition: "Scheduling or completing a ticket would push CablingProject.consumed_mac_cents past mac_budget_cents"

# =============================================================================
# §1.7 RBAC Matrix
# role_model: segregation_of_duties — the identity that terminated or tested a
# link may never be the identity that certifies it. All roles are operational
# crew identities, not persisted rows, so every identity is `opaque`.
# =============================================================================
roles:

  - name: ProjectManager
    description: "Owns the project record, telecom rooms, trade coordination, occupancy declaration and warranty submission"
    identity: "opaque"
    exclusive_operations:
      - "POST /cabling/projects"
      - "POST /cabling/projects/{project_id}/occupancy"
      - "POST /cabling/telecom-rooms"
      - "POST /cabling/telecom-rooms/{room_id}/energize"
      - "POST /cabling/pathway-segments/{segment_id}/condemn"
      - "POST /cabling/warranty-registrations"
      - "POST /cabling/warranty-registrations/{registration_id}/submit"
      - "POST /cabling/warranty-registrations/{registration_id}/reopen"
      - "POST /cabling/mac-tickets/{ticket_id}/schedule"
      - "POST /cabling/mac-tickets/{ticket_id}/reject"
      - "POST /cabling/mac-tickets/{ticket_id}/rework"
      - "POST /cabling/trade-coordinations"
      - "POST /cabling/trade-coordinations/{coordination_id}/confirm"
      - "POST /cabling/trade-coordinations/{coordination_id}/release"
      - "POST /cabling/trade-coordinations/{coordination_id}/block"
      - "POST /cabling/trade-coordinations/{coordination_id}/unblock"
    shared_operations:
      - "POST /cabling/telecom-rooms/{room_id}/grounding-verification (with Certifier)"
      - "POST /cabling/links/{link_id}/record (with DesignEngineer)"
      - "all GET reads"

  - name: DesignEngineer
    description: "Designs pathways, racks, elevations, the cable catalogue and links; files as-built records"
    identity: "opaque"
    exclusive_operations:
      - "POST /cabling/racks"
      - "POST /cabling/rack-unit-assignments"
      - "POST /cabling/rack-unit-assignments/{assignment_id}/release"
      - "POST /cabling/pathway-segments"
      - "POST /cabling/pathway-segments/{segment_id}/reparent"
      - "POST /cabling/cable-types"
      - "POST /cabling/links"
      - "POST /cabling/link-routes"
      - "POST /cabling/link-routes/{route_id}/withdraw"
    shared_operations:
      - "POST /cabling/links/{link_id}/record (with ProjectManager)"
      - "all GET reads except GET /cabling/mac-tickets and GET /cabling/warranty-registrations detail-plus-list which it also reads"

  - name: Installer
    description: "Field crew: pulls, terminates and labels cable, and executes moves-adds-changes work"
    identity: "opaque"
    exclusive_operations:
      - "POST /cabling/links/{link_id}/pull"
      - "POST /cabling/links/{link_id}/terminate"
      - "POST /cabling/links/{link_id}/label"
      - "POST /cabling/mac-tickets/{ticket_id}/start"
      - "POST /cabling/mac-tickets/{ticket_id}/complete"
    shared_operations:
      - "all GET reads except GET /cabling/projects"

  - name: TestTechnician
    description: "Operates the field tester and records every link's measurements"
    identity: "opaque"
    exclusive_operations:
      - "POST /cabling/test-results"
    shared_operations:
      - "all GET reads except GET /cabling/projects, GET /cabling/rack-unit-assignments and GET /cabling/mac-tickets"

  - name: Certifier
    description: "Independent certifier: verifies grounding and certifies links for warranty; barred from certifying its own installation or test work"
    identity: "opaque"
    exclusive_operations:
      - "POST /cabling/links/{link_id}/certify"
    shared_operations:
      - "POST /cabling/telecom-rooms/{room_id}/grounding-verification (with ProjectManager)"
      - "all GET reads except GET /cabling/projects"

  - name: ManufacturerAgent
    description: "Manufacturer warranty programme desk: decides submitted registrations"
    identity: "opaque"
    exclusive_operations:
      - "POST /cabling/warranty-registrations/{registration_id}/decision"
    shared_operations:
      - "GET /cabling/projects, GET /cabling/projects/{project_id}, GET /cabling/projects/{project_id}/certification-summary"
      - "GET /cabling/links, GET /cabling/links/{link_id}, GET /cabling/links/{link_id}/certification-report"
      - "GET /cabling/test-results, GET /cabling/test-results/{test_result_id}"
      - "GET /cabling/warranty-registrations, GET /cabling/warranty-registrations/{registration_id}"

  - name: Client
    description: "Building owner's representative: raises moves-adds-changes tickets after occupancy and reads certification evidence"
    identity: "opaque"
    exclusive_operations:
      - "POST /cabling/mac-tickets"
    shared_operations:
      - "all GET reads except GET /cabling/projects and GET /cabling/rack-unit-assignments"
