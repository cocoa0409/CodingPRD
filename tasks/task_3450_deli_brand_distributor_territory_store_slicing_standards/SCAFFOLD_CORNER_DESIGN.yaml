  - section: cross_cutting_layers
    instances:
      - name: territory_grant_occ_stale_then_fresh
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[territory-grant-stale-version"]', 'errors[ERR_STALE_VERSION]']
        distinguishing_aspect: "OCC on Territory.version: a superseding grant carrying the pre-grant version (1) is rejected 412 while the same grant carrying the current version (2) succeeds."
        test_recipe:
          setup: ["territory T1 granted to D1 (version advanced 1 -> 2); D2 exists"]
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/distributors", payload: { code: "D2", name: "Dist Two" }, as: BrandAdmin, captures: { d2: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin, captures: { t1v2: $.data.version } }
          trigger:
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d2}", expected_territory_version: "${t1v}" }, as: BrandAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d2}", expected_territory_version: "${t1v2}" }, as: BrandAdmin, captures: { t1v3: $.data.version } }
          assert:
            - "err == ERR_STALE_VERSION (http 412) for the stale expected version captured before the first grant"
            - "the fresh grant succeeds: Territory.${t1}.granted_distributor_id == ${d2} and version advanced to 3 (t1v3 == 3)"

      - name: distributor_suspend_cancels_open_visits
        claim_type: cascading_side_effects
        grounds: [state_machines.Distributor.ACTIVE_to_SUSPENDED, state_machines.ServiceVisit.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "Cascade layer: suspending a distributor cancels its SCHEDULED and REWORK visits but leaves a VERIFIED visit terminal-untouched."
        test_recipe:
          setup: ["D1 ACTIVE with visit V1 SCHEDULED and visit V2 VERIFIED"]
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
            - { call: "POST /api/accounts", payload: { name: "Store A", channel: "INDEPENDENT_GROCER", territory_id: "${t1}" }, as: DistributorRep, as_user_id: "${d1}", captures: { a1: $.data.id } }
            - { call: "POST /api/accounts/${a1}/review", payload: { decision: "APPROVE" }, as: BrandAdmin }
            - { call: "POST /api/service-visits", payload: { account_id: "${a1}", window_start: "2026-09-02T09:00:00Z", window_end: "2026-09-02T10:00:00Z" }, as: DistributorRep, as_user_id: "${d1}", captures: { v1: $.data.id } }
            - { call: "POST /api/service-visits", payload: { account_id: "${a1}", window_start: "2026-09-02T10:30:00Z", window_end: "2026-09-02T11:30:00Z" }, as: DistributorRep, as_user_id: "${d1}", captures: { v2: $.data.id } }
            - { call: "POST /api/service-visits/${v2}/submit", payload: { score: 90, rotation_compliant: true, slicer_presentation_ok: true }, as: DistributorRep, as_user_id: "${d1}" }
            - { call: "POST /api/service-visits/${v2}/review", payload: { verdict: "VERIFY" }, as: SafetyOfficer }
          trigger:
            - { call: "POST /api/distributors/${d1}/suspend", payload: {}, as: BrandAdmin }
          assert:
            - "ServiceVisit.${v1}.status == CANCELLED (conditional cascade: only non-terminal visits)"
            - "ServiceVisit.${v2}.status stays VERIFIED"

  - section: consistency_model
    instances:
      - name: immediate_read_after_write
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: a creation is visible with its server-minted fields in the very next list read, no delay."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
          trigger:
            - { call: "GET /api/distributors", payload: {}, as: BrandAdmin }
          assert:
            - "the list contains ${d1} with status PROSPECT and created_at set to the logical clock default 2026-09-01T00:00:00Z"
