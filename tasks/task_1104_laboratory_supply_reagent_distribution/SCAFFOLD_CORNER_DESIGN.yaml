            - "captured charge == 95 and price_snap == 105"
            - "captured bal == 95"

      - name: standing_order_catchup_generates_three_runs
        claim_type: chronological_order
        grounds: [calculations.standing_order_run_generation]
        distinguishing_aspect: "Setting the clock from the default to 2026-05-20 with next_run 2026-05-03 and interval 7 fires exactly the three due runs (05-03, 05-10, 05-17), lands next_run_date on 2026-05-24, and generates three ALLOCATED orders."
        test_recipe:
          setup:
            - "warehouse + AMBIENT zone + product (500 cents) with lot of 100; customer; standing order qty 2, interval 7, window [2026-05-03, 2026-12-31]"
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "AMBIENT", capacity_units: 500 }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "CS-500", name: "Consigned Stain", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 500, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Kappa", credit_limit_cents: 10000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 100, manufacture_date: "2026-01-15" }, as: InventoryClerk }
            - { call: "POST /lab/standing-orders", payload: { customer_id: "${cust_id}", product_id: "${prod_id}", warehouse_id: "${wh_id}", quantity_per_run: 2, interval_days: 7, effective_from: "2026-05-03", effective_until: "2026-12-31" }, as: Customer, as_user_id: "${cust_id}", captures: { so_id: "$.data.id" } }
          trigger:
            - { call: "POST /lab/_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: OpsAdmin, captures: { gen: "$.data.orders_generated", ran: "$.data.standing_orders_run" } }
            - { call: "GET /lab/standing-orders/${so_id}", payload: {}, as: OpsAdmin, captures: { nxt: "$.data.next_run_date", cnt: "$.data.generated_order_count" } }
            - { call: "GET /lab/orders", payload: { customer_id: "${cust_id}" }, as: OpsAdmin, captures: { first_status: "$.data[0].status" } }
          assert:
            - "captured gen == 3 and ran == 1"
            - "captured nxt == \"2026-05-24\" and cnt == 3"
            - "captured first_status == ALLOCATED (each generated order auto-submitted against stock)"

      - name: lot_expiry_sweep_at_clock_boundary
        claim_type: threshold_boundary
        grounds: [calculations.expiry_date_derivation, state_machines.ReagentLot.AVAILABLE_to_EXPIRED]
        distinguishing_aspect: "The lot is still AVAILABLE at 2026-05-31T12:00 (its expiry date) and flips EXPIRED only when the clock reaches 2026-06-01 (strictly-after semantics)."
        test_recipe:
          setup: ["warehouse, zone, product shelf_life 60; lot manufacture 2026-04-01 (expiry 2026-05-31)"]
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "REFRIGERATED_2_8", capacity_units: 100 }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "RG-100", name: "Enzyme Mix", storage_requirement: "REFRIGERATED_2_8", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 20000, requires_cold_chain: true, shelf_life_days: 60, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 20, manufacture_date: "2026-04-01" }, as: InventoryClerk, captures: { lot_id: "$.data.id" } }
          trigger:
            - { call: "POST /lab/_clock/set_current_utc", payload: { to_iso8601: "2026-05-31T12:00:00Z" }, as: OpsAdmin, captures: { expired1: "$.data.lots_expired" } }
            - { call: "GET /lab/lots/${lot_id}", payload: {}, as: OpsAdmin, captures: { st1: "$.data.status" } }
            - { call: "POST /lab/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OpsAdmin, captures: { expired2: "$.data.lots_expired" } }
            - { call: "GET /lab/lots/${lot_id}", payload: {}, as: OpsAdmin, captures: { st2: "$.data.status" } }
          assert:
            - "captured expired1 == 0 and st1 == AVAILABLE (expiry date itself still usable)"
            - "captured expired2 == 1 and st2 == EXPIRED (day after expiry)"

      - name: zone_capacity_exactly_at_capacity
        claim_type: threshold_boundary
        grounds: [calculations.zone_occupancy, "validations[priority=17]", "errors[ERR_ZONE_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: "occupied 100 into capacity 100 is allowed (<= boundary); one more unit is rejected ERR_ZONE_CAPACITY_EXCEEDED."
        test_recipe:
          setup: ["warehouse; AMBIENT zone capacity 100; product; lot of exactly 100 received"]
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "AMBIENT", capacity_units: 100 }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "CH-105", name: "Buffer Salt", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 105, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 100, manufacture_date: "2026-01-15" }, as: InventoryClerk, captures: { lot_id: "$.data.id" } }
          trigger:
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 1, manufacture_date: "2026-01-15" }, as: InventoryClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "first receipt succeeded at exactly 100/100 (occupied_units == 100)"
            - "captured err == ERR_ZONE_CAPACITY_EXCEEDED (101 would exceed 100)"

      - name: credit_check_exactly_at_limit_passes
        claim_type: threshold_boundary
        grounds: [calculations.customer_outstanding_and_credit, "errors[ERR_CREDIT_LIMIT_EXCEEDED]"]
        distinguishing_aspect: "outstanding 0 + product_total 1000 + STANDARD estimate 800 == credit_limit 1800 passes (<= boundary); the order lands ALLOCATED."
        test_recipe:
          setup: ["warehouse, zone, lot of 10; product 1000 cents; customer credit_limit exactly 1800"]
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "AMBIENT", capacity_units: 500 }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "CH-1000", name: "Assay Vial", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 1000, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Edge", credit_limit_cents: 1800 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 10, manufacture_date: "2026-01-15" }, as: InventoryClerk }
            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "STANDARD", requested_ship_date: "2026-05-10", lines: [ { product_id: "${prod_id}", quantity: 1, fulfillment_mode: "ANY" } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: "$.data.id" } }
          trigger:
            - { call: "POST /lab/orders/${order_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { st: "$.data.status" } }
          assert:
            - "captured st == ALLOCATED (equality passes the <= check; one cent more would fail)"

      - name: consignment_replenishment_fires_at_reorder_point
        claim_type: threshold_trigger
        grounds: [calculations.consignment_replenishment]
        distinguishing_aspect: "Consuming 15 from stocked 30 leaves on-hand 15, which satisfies the <= reorder_point 20 trigger; the generated replenishment order tops up to the ceiling (qty 85) and auto-submits ALLOCATED."
        test_recipe:
          setup: ["warehouse + AMBIENT zone + lot of 100; product 500 cents; agreement ceiling 100, initial_stocked 30, reorder_point 20"]
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "AMBIENT", capacity_units: 500 }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "CS-500", name: "Consigned Stain", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 500, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Kappa", credit_limit_cents: 10000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 100, manufacture_date: "2026-01-15" }, as: InventoryClerk }
            - { call: "POST /lab/consignment-agreements", payload: { customer_id: "${cust_id}", product_id: "${prod_id}", ceiling_quantity: 100, reorder_point: 20, contract_unit_price_cents: 500, replenishment_warehouse_id: "${wh_id}", initial_stocked_quantity: 30, effective_from: "2026-05-01", effective_until: "2027-05-01" }, as: AccountManager, captures: { agr_id: "$.data.id" } }
          trigger:
            - { call: "POST /lab/consignment-agreements/${agr_id}/consumption", payload: { quantity: 15 }, as: AccountManager, captures: { charge: "$.data.charge_cents" } }
            - { call: "GET /lab/orders", payload: { customer_id: "${cust_id}" }, as: OpsAdmin, captures: { repl_status: "$.data[0].status" } }
          assert:
            - "captured charge == 7500 (15 x 500, no discount)"
            - "captured repl_status == ALLOCATED — the replenishment order for exactly 85 units (100 - 15 on-hand) was generated and auto-submitted"
            - "ConsignmentAgreement.${agr_id}.consumed_quantity == 15"

  - section: validations
    instances:
      - name: request_missing_auth_headers_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-Role fails priority 1 with 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any routing."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /lab/warehouses", payload: {}, as: MissingRoleHeader, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER and HTTP status == 400"

      - name: existence_checked_before_state_ordering
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=7]", "errors[ERR_ORDER_NOT_FOUND]"]
        distinguishing_aspect: "Cancelling a non-existent order id returns 404 ERR_ORDER_NOT_FOUND (priority 4 existence) rather than any 409 state error."
        test_recipe:
          setup: ["customer exists (needed as the acting identity)"]
          setup_api_calls:
            - { call: "POST /lab/customers", payload: { name: "Lab Mu", credit_limit_cents: 10000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
          trigger:
            - { call: "POST /lab/orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/cancel", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_ORDER_NOT_FOUND and HTTP status == 404"

      - name: shelf_life_gate_hard_failure_with_stock_present
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", calculations.shelf_life_gate, "errors[ERR_SHELF_LIFE_TOO_SHORT]"]
        distinguishing_aspect: "Stock exists (10 units) but its expiry 2026-05-31 is only 6 days past requested_ship_date 2026-05-25 (< 7 required), so submit fails ERR_SHELF_LIFE_TOO_SHORT instead of silently backordering."
        test_recipe:
          setup: ["warehouse, REFRIGERATED zone, cold-chain product min_remaining 7; lot of 10 manufacture 2026-04-01; customer; order requested_ship_date 2026-05-25"]
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "REFRIGERATED_2_8", capacity_units: 100 }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "RG-100", name: "Enzyme Mix", storage_requirement: "REFRIGERATED_2_8", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 20000, requires_cold_chain: true, shelf_life_days: 60, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Alpha", credit_limit_cents: 10000000, hazmat_endorsement: "FULL", cold_chain_certified: true }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 10, manufacture_date: "2026-04-01" }, as: InventoryClerk }
            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "EXPRESS", requested_ship_date: "2026-05-25", lines: [ { product_id: "${prod_id}", quantity: 2, fulfillment_mode: "ANY" } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: "$.data.id" } }
          trigger:
            - { call: "POST /lab/orders/${order_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_SHELF_LIFE_TOO_SHORT and HTTP status == 409"
            - "Order.${order_id}.status remains DRAFT and no reservations were created"

      - name: dry_ice_cap_boundary
        claim_type: threshold_boundary
        grounds: [calculations.hazmat_load_check, "errors[ERR_DRY_ICE_LIMIT_EXCEEDED]"]
        distinguishing_aspect: "DRY_ICE coolant_units 20 ships fine (== cap); 21 is rejected ERR_DRY_ICE_LIMIT_EXCEEDED on an otherwise identical order."
        test_recipe:
          setup: ["cold-chain chain; two ALLOCATED orders of qty 1; shipment A with 20 dry-ice units"]
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "REFRIGERATED_2_8", capacity_units: 1000, rotation_policy: "FEFO" }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "RG-100", name: "Enzyme Mix", storage_requirement: "REFRIGERATED_2_8", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 20000, requires_cold_chain: true, shelf_life_days: 60, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Alpha", credit_limit_cents: 10000000, hazmat_endorsement: "FULL", cold_chain_certified: true }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 100, manufacture_date: "2026-04-01" }, as: InventoryClerk }
            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "EXPRESS", requested_ship_date: "2026-05-10", lines: [ { product_id: "${prod_id}", quantity: 1, fulfillment_mode: "ANY" } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_a: "$.data.id" } }
            - { call: "POST /lab/orders/${order_a}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "EXPRESS", requested_ship_date: "2026-05-10", lines: [ { product_id: "${prod_id}", quantity: 1, fulfillment_mode: "ANY" } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_b: "$.data.id" } }
            - { call: "POST /lab/orders/${order_b}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /lab/shipments", payload: { order_id: "${order_a}", coolant_type: "DRY_ICE", coolant_units: 20, declared_weight_grams: 3000 }, as: InventoryClerk, captures: { ship_a: "$.data.id" } }
            - { call: "POST /lab/shipments", payload: { order_id: "${order_b}", coolant_type: "DRY_ICE", coolant_units: 21, declared_weight_grams: 3000 }, as: InventoryClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "Shipment A created (captured ship_a present): 20 == DRY_ICE_CAP passes"
            - "captured err == ERR_DRY_ICE_LIMIT_EXCEEDED (21 > 20)"

      - name: consumption_on_suspended_agreement_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.ConsignmentAgreement.ACTIVE_to_SUSPENDED, "errors[ERR_AGREEMENT_NOT_ACTIVE]"]
        distinguishing_aspect: "Consumption requires agreement ACTIVE; a SUSPENDED agreement rejects with ERR_AGREEMENT_NOT_ACTIVE and posts nothing."
        test_recipe:
          setup: ["warehouse, product, customer; agreement (ceiling 100, initial_stocked 100) suspended"]
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "CS-500", name: "Consigned Stain", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 500, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Kappa", credit_limit_cents: 10000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/consignment-agreements", payload: { customer_id: "${cust_id}", product_id: "${prod_id}", ceiling_quantity: 100, reorder_point: 0, contract_unit_price_cents: 500, replenishment_warehouse_id: "${wh_id}", initial_stocked_quantity: 100, effective_from: "2026-05-01", effective_until: "2027-05-01" }, as: AccountManager, captures: { agr_id: "$.data.id" } }
            - { call: "POST /lab/consignment-agreements/${agr_id}/suspend", payload: {}, as: AccountManager }
          trigger:
            - { call: "POST /lab/consignment-agreements/${agr_id}/consumption", payload: { quantity: 5 }, as: AccountManager, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_AGREEMENT_NOT_ACTIVE"
            - "ConsignmentAgreement.${agr_id}.consumed_quantity remains 0"

      - name: hazmat_warehouse_not_certified_on_lot_receipt
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_HAZMAT_WAREHOUSE_NOT_CERTIFIED]"]
        distinguishing_aspect: "Receiving a FLAMMABLE product into a warehouse with hazmat_certified false is rejected ERR_HAZMAT_WAREHOUSE_NOT_CERTIFIED."
        test_recipe:
          setup: ["NON-hazmat-certified warehouse with AMBIENT zone; FLAMMABLE product"]
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-PLAIN", region_code: "US-NE", hazmat_certified: false }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "AMBIENT", capacity_units: 100 }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "HZ-200", name: "Solvent X", storage_requirement: "AMBIENT", hazard_class: "FLAMMABLE", unit_haz_factor: 2, max_qty_per_shipment: 100, unit_price_cents: 10000, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
          trigger:
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 5, manufacture_date: "2026-01-15" }, as: InventoryClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_HAZMAT_WAREHOUSE_NOT_CERTIFIED and HTTP status == 409"

      - name: endorsement_insufficient_for_toxic_product
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_HAZMAT_ENDORSEMENT_INSUFFICIENT]"]
        distinguishing_aspect: "A LIMITED-endorsed customer ordering a TOXIC product fails submit with 403 ERR_HAZMAT_ENDORSEMENT_INSUFFICIENT (LIMITED covers only FLAMMABLE/CORROSIVE)."
        test_recipe:
          setup: ["hazmat warehouse, AMBIENT zone, TOXIC product, lot of 10; LIMITED customer; DRAFT order qty 1"]
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-HZ", region_code: "US-SW", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "AMBIENT", capacity_units: 500 }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "TX-10", name: "Toxin Reagent", storage_requirement: "AMBIENT", hazard_class: "TOXIC", unit_haz_factor: 1, max_qty_per_shipment: 100, unit_price_cents: 1000, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
