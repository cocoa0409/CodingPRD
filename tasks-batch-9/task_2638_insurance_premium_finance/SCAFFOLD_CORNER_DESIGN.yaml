            - "${cf_gross} == 600000 — the input is preserved verbatim; the computed fields diverge from it rather than overwriting it"
            - "${cf_agr_policy_count} == 1 and ${cf_agr_verified_count} == 1"

      - name: state_rate_rule_type_constraints_invalid_enum_and_out_of_range_rejected
        claim_type: type_constraints
        grounds:
          - entities.StateRateRule.fields.finance_charge_method
          - entities.StateRateRule.fields.max_annual_rate_bps
          - entities.StateRateRule.fields.late_fee_max_cents
          - entities.StateRateRule.fields.state_code
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Four different constraint kinds on one entity all collapse to ERR_INVALID_REQUEST (400):
          an out-of-enum finance_charge_method, a max_annual_rate_bps of 3001 one past the declared
          <= 3000 ceiling, a late_fee_max_cents BELOW late_fee_min_cents (a cross-field constraint,
          not a range), and a lowercase two-letter state_code. The interesting one is the relational
          pair — 400 and 900 are each individually legal numbers, so only the cross-field rule
          rejects it.
        test_recipe:
          setup:
            - "empty database at the 2026-08-01 clock default"
          setup_api_calls: []
          trigger:
            - call: "POST /state-rate-rules"
              payload: { state_code: "TX", finance_charge_method: "DISCOUNT", max_annual_rate_bps: 1800, max_service_fee_cents: 2000, min_down_payment_bps: 1500, max_term_months: 10, late_fee_bps: 500, late_fee_min_cents: 500, late_fee_max_cents: 10000, grace_period_days: 10, noic_notice_days: 10, unearned_premium_method: "PRO_RATA", short_rate_penalty_bps: 1000, rebate_method: "RULE_OF_78", max_late_fees_per_agreement: 3 }
              as: ComplianceOfficer
              captures: { tc_enum_error: "$.data.error_id" }
            - call: "POST /state-rate-rules"
              payload: { state_code: "TX", finance_charge_method: "ADD_ON", max_annual_rate_bps: 3001, max_service_fee_cents: 2000, min_down_payment_bps: 1500, max_term_months: 10, late_fee_bps: 500, late_fee_min_cents: 500, late_fee_max_cents: 10000, grace_period_days: 10, noic_notice_days: 10, unearned_premium_method: "PRO_RATA", short_rate_penalty_bps: 1000, rebate_method: "RULE_OF_78", max_late_fees_per_agreement: 3 }
              as: ComplianceOfficer
              captures: { tc_range_error: "$.data.error_id" }
            - call: "POST /state-rate-rules"
              payload: { state_code: "TX", finance_charge_method: "ADD_ON", max_annual_rate_bps: 1800, max_service_fee_cents: 2000, min_down_payment_bps: 1500, max_term_months: 10, late_fee_bps: 500, late_fee_min_cents: 900, late_fee_max_cents: 400, grace_period_days: 10, noic_notice_days: 10, unearned_premium_method: "PRO_RATA", short_rate_penalty_bps: 1000, rebate_method: "RULE_OF_78", max_late_fees_per_agreement: 3 }
              as: ComplianceOfficer
              captures: { tc_cross_error: "$.data.error_id" }
            - call: "POST /state-rate-rules"
              payload: { state_code: "tx", finance_charge_method: "ADD_ON", max_annual_rate_bps: 1800, max_service_fee_cents: 2000, min_down_payment_bps: 1500, max_term_months: 10, late_fee_bps: 500, late_fee_min_cents: 500, late_fee_max_cents: 10000, grace_period_days: 10, noic_notice_days: 10, unearned_premium_method: "PRO_RATA", short_rate_penalty_bps: 1000, rebate_method: "RULE_OF_78", max_late_fees_per_agreement: 3 }
              as: ComplianceOfficer
              captures: { tc_case_error: "$.data.error_id" }
            - call: "POST /state-rate-rules"
              payload: { state_code: "TX", finance_charge_method: "ADD_ON", max_annual_rate_bps: 3000, max_service_fee_cents: 2000, min_down_payment_bps: 1500, max_term_months: 10, late_fee_bps: 500, late_fee_min_cents: 500, late_fee_max_cents: 500, grace_period_days: 10, noic_notice_days: 10, unearned_premium_method: "PRO_RATA", short_rate_penalty_bps: 1000, rebate_method: "RULE_OF_78", max_late_fees_per_agreement: 3 }
              as: ComplianceOfficer
              captures: { tc_ok_rate: "$.data.max_annual_rate_bps", tc_ok_min: "$.data.late_fee_min_cents", tc_ok_max: "$.data.late_fee_max_cents" }
          assert:
            - "${tc_enum_error} == 'ERR_INVALID_REQUEST' with HTTP 400 — 'DISCOUNT' is outside {ADD_ON, SIMPLE_INTEREST}"
            - "${tc_range_error} == 'ERR_INVALID_REQUEST' with HTTP 400 — 3001 is one past the declared <= 3000"
            - "${tc_cross_error} == 'ERR_INVALID_REQUEST' with HTTP 400 — 900 and 400 are individually legal, so only the cross-field late_fee_max_cents >= late_fee_min_cents rule rejects the pair"
            - "${tc_case_error} == 'ERR_INVALID_REQUEST' with HTTP 400 — state_code must be exactly two UPPERCASE letters and is not auto-upcased"
            - "the boundary request succeeds with HTTP 201: ${tc_ok_rate} == 3000 (inclusive ceiling) and ${tc_ok_min} == ${tc_ok_max} == 500 (equality satisfies >=)"
            - "exactly one StateRateRule exists afterwards; none of the four rejections created a row, so a later TX create would collide on uniqueness with the surviving one"

      - name: premium_verification_is_immutable_with_no_common_fields
        claim_type: immutability
        grounds:
          - entities.PremiumVerification
          - entities.PremiumVerification.fields.superseded
          - endpoints.GET_policies_id_verifications
        distinguishing_aspect: |
          PremiumVerification is declared common_fields: false — it is an append-only attestation
          log with no version field and no update or delete endpoint anywhere in §1.5. Corrections
          are therefore made by SUPERSEDING, not editing: reopening a disputed policy flips
          superseded = true on the existing rows and leaves their decision and effective_premium_cents
          exactly as filed, so the historical record of the disagreement survives.
        test_recipe:
          setup:
            - "the canonical TX regime with an effective License, one Insured, one ProducerAgent, one Insurer"
            - "one submitted agreement whose single 600000 policy is DISPUTED with dispute_reason PREMIUM_MISMATCH, because the carrier attested 600000 and the agency corrected to 590000"
