              as: CycleAdmin
              captures: { m: "$.data.id" }
            - call: "POST /comp/contribution-records"
              payload: { partner_id: "${pp}", cycle_id: "${cy}", matter_id: "${m}", kind: "BILLABLE", category: "CLIENT_WORK", hours: 5.00, standard_rate_cents: 40000, service_period_start: "2026-02-01", service_period_end: "2026-02-28" }
              as: CycleAdmin
              captures: { cr: "$.data.id" }
            - call: "POST /comp/contribution-records/${cr}/verify"
              payload: {}
              as: CycleAdmin
              captures: { ver: "$.data.verified" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "SELF_ASSESSMENT" }
              as: CycleAdmin
              captures: { cst2: "$.data.state" }
            - call: "GET /comp/partners/${pp}"
              payload: {}
              as: CycleAdmin
              captures: { rh: "$.data.verified_billable_hours" }
            - call: "GET /comp/matters/${m}/credit-allocations"
              payload: {}
              as: CycleAdmin
              captures: { a0role: "$.data[0].credit_role" }
          assert:
            - "${cst} == OPEN_INTAKE and ${pstatus} == ACTIVE"
            - "${ver} == true and ${rh} == 5.00"
            - "${cst2} == SELF_ASSESSMENT"
            - "${a0role} == BILLING - the first allocation seeded at matter creation, ordered by created_at ASC"
            - "GET /comp/matters/${m}/credit-allocations returns 3 rows: BILLING, RESPONSIBLE and the WORKING row created by the verify"
            - "no call in this sequence returned ERR_ROLE_NOT_PERMITTED or ERR_ACTOR_NOT_A_PARTNER"

      - name: an_actor_id_that_is_not_an_eligible_partner_row_is_refused
        claim_type: Cannot perform other roles' exclusive_operations
        grounds:
          - validations[priority=30]
          - errors[ERR_ACTOR_NOT_A_PARTNER]
          - entities.Partner.fields.is_committee_member
          - entities.Partner.fields.is_credit_arbiter
        distinguishing_aspect: |
          The entity-backed roles are checked against the Partner row itself at priority 30,
          after the role gate and before any body parsing: an unknown actor id, a partner
          without is_committee_member acting as CommitteeMember and a partner without
          is_credit_arbiter acting as CreditArbiter all yield ERR_ACTOR_NOT_A_PARTNER 403
          rather than ERR_PARTNER_NOT_FOUND 404 or ERR_ROLE_NOT_PERMITTED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 exists; partner P is a plain partner with is_committee_member false and is_credit_arbiter false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Plain Partner", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2014 }
              as: CycleAdmin
              captures: { pp: "$.data.id" }
          trigger:
            - call: "GET /comp/cycles/${cy}"
              payload: {}
              as: Partner
              as_user_id: "77777777-7777-4777-8777-777777777777"
              captures: { e1: "$.data.error_id" }
            - call: "GET /comp/partners"
              payload: {}
              as: CommitteeMember
              as_user_id: "${pp}"
              captures: { e2: "$.data.error_id" }
            - call: "GET /comp/credit-transitions"
              payload: {}
              as: CreditArbiter
              as_user_id: "${pp}"
              captures: { e3: "$.data.error_id" }
            - call: "GET /comp/cycles/${cy}"
              payload: {}
              as: Partner
              as_user_id: "${pp}"
              captures: { ok: "$.data.state" }
          assert:
            - "${e1} == ERR_ACTOR_NOT_A_PARTNER with HTTP 403, not ERR_PARTNER_NOT_FOUND - the actor check is not a path-existence check"
            - "${e2} == ERR_ACTOR_NOT_A_PARTNER with HTTP 403, because is_committee_member is false"
            - "${e3} == ERR_ACTOR_NOT_A_PARTNER with HTTP 403, because is_credit_arbiter is false"
            - "${ok} == OPEN_INTAKE - the same partner acting as Partner is admitted"

      - name: a_partner_may_act_only_on_rows_they_own
        claim_type: Segregation of duties
        grounds:
          - validations[priority=60]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - endpoints[POST /comp/self-assessments/{id}/submit]
          - endpoints[POST /comp/contribution-records]
        distinguishing_aspect: |
          Ownership is checked by X-User-ID against the row's own partner column, not by
          role: P2 holds the identical Partner role as P1 yet is refused with
          ERR_NOT_RESOURCE_OWNER 403 both when submitting P1's assessment and when logging
          hours in P1's name, while P1 succeeds on the same calls.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 has reached SELF_ASSESSMENT; partners P1 and P2 both exist and P1 holds a DRAFT assessment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Own One", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2013 }
              as: CycleAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Own Two", practice_group: "LITIGATION", compensation_model: "FORMULA", admission_year: 2015 }
              as: CycleAdmin
              captures: { p2: "$.data.id" }
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "SELF_ASSESSMENT" }
              as: CycleAdmin
            - call: "POST /comp/self-assessments"
              payload: { cycle_id: "${cy}", narrative: "My own statement.", claimed_origination_pct_total: 0.00, claimed_non_billable_hours: 0.00 }
              as: Partner
              as_user_id: "${p1}"
              captures: { sa: "$.data.id" }
          trigger:
            - call: "POST /comp/self-assessments/${sa}/submit"
              payload: {}
              as: Partner
              as_user_id: "${p2}"
              captures: { e1: "$.data.error_id" }
            - call: "POST /comp/contribution-records"
              payload: { partner_id: "${p1}", cycle_id: "${cy}", kind: "NON_BILLABLE", category: "PRO_BONO", hours: 30.00, service_period_start: "2026-04-01", service_period_end: "2026-04-30" }
              as: Partner
              as_user_id: "${p2}"
              captures: { e2: "$.data.error_id" }
            - call: "POST /comp/self-assessments/${sa}/submit"
              payload: {}
              as: Partner
              as_user_id: "${p1}"
              captures: { st: "$.data.state" }
            - call: "POST /comp/contribution-records"
              payload: { partner_id: "${p1}", cycle_id: "${cy}", kind: "NON_BILLABLE", category: "PRO_BONO", hours: 30.00, service_period_start: "2026-04-01", service_period_end: "2026-04-30" }
              as: Partner
              as_user_id: "${p1}"
              captures: { crid: "$.data.id", crver: "$.data.verified" }
          assert:
            - "${e1} == ERR_NOT_RESOURCE_OWNER with HTTP 403 and SelfAssessment.${sa}.state was still DRAFT at that point"
            - "${e2} == ERR_NOT_RESOURCE_OWNER with HTTP 403 and no ContributionRecord was created"
            - "${st} == SUBMITTED"
            - "${crver} == false - a partner-created record is unverified, so Partner.${p1}.non_billable_points is still 0.00 until a CycleAdmin verifies ${crid}"

      - name: the_same_member_cannot_both_evaluate_and_vote_on_themselves
        claim_type: Segregation of duties
        grounds:
          - validations[priority=100]
          - errors[ERR_SELF_VOTE_FORBIDDEN]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / self_vote_safety_beats_points_cap_constraint
          rationale: "The declared role_model segregation_of_duties claim - the same X-User-ID may not perform both the subject and the decider step - is asserted by the named §1.8 instance, where a committee member casting on their own ballot is refused with ERR_SELF_VOTE_FORBIDDEN even though the body also breaches the points cap."

  # =====================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_matter_financials_replayed_against_a_stale_matter_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[matter-financials-stale-matter]
          - endpoints[POST /comp/matters/{id}/financials]
          - errors[ERR_STALE_VERSION]
          - calculations.matter_realization_and_profitability
        distinguishing_aspect: |
          Financial deltas are additive, so the only thing separating an intended second
          posting from a re-send is the version: the first post with the creation-time
          version succeeds and bumps the version, and replaying the identical body with the
          same expected_matter_version returns ERR_STALE_VERSION 412 leaving billed_cents at
          1000000 rather than 2000000.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; partner P is billing and responsible attorney of OPEN Matter M with an empty ledger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/partners"
              payload: { full_name: "Occ Matter", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2014 }
              as: CycleAdmin
              captures: { pp: "$.data.id" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-OM", client_display_name: "Occ Matter Mills", matter_type: "EXISTING", practice_group: "CORPORATE", opened_on: "2026-01-10", billing_attorney_id: "${pp}", responsible_attorney_id: "${pp}" }
              as: CycleAdmin
              captures: { m: "$.data.id", mv0: "$.data.version" }
          trigger:
            - call: "POST /comp/matters/${m}/financials"
              payload: { billed_delta_cents: 1000000, collected_delta_cents: 900000, direct_cost_delta_cents: 200000, expected_matter_version: "${mv0}" }
              as: CycleAdmin
              captures: { mv1: "$.data.version", billed: "$.data.billed_cents", real: "$.data.realization_pct", pic: "$.data.profitability_index_contribution" }
            - call: "POST /comp/matters/${m}/financials"
              payload: { billed_delta_cents: 1000000, collected_delta_cents: 900000, direct_cost_delta_cents: 200000, expected_matter_version: "${mv0}" }
              as: CycleAdmin
              captures: { err: "$.data.error_id" }
            - call: "GET /comp/matters/${m}"
              payload: {}
              as: CycleAdmin
              captures: { billed2: "$.data.billed_cents", mv2: "$.data.version" }
          assert:
            - "${mv1} == ${mv0} + 1 - the accepted write bumps the version"
            - "${billed} == 1000000, ${real} == 0.9000 and ${pic} == 0.7778"
            - "${err} == ERR_STALE_VERSION with HTTP 412"
            - "${billed2} == 1000000 and ${mv2} == ${mv1} - the rejected replay is a complete no-op"

      - name: occ_two_adjudications_on_one_matter_from_the_same_read
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[claim-adjudicate-stale-matter]
          - endpoints[POST /comp/credit-claims/{id}/adjudicate]
          - errors[ERR_STALE_VERSION]
          - validations[priority=120]
        distinguishing_aspect: |
          Two claims on the same matter cannot both be adjudicated from one matter read:
          the first ALLOCATE consumes 60.00 of the matter's 100.00 capacity and bumps
          Matter.version, so the second adjudication carrying the pre-read version is
          refused with ERR_STALE_VERSION 412 at priority 80 - before the priority-120
          capacity check would even have had anything to complain about.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 in OPEN_INTAKE."
            - "Matter M for the new client CLI-OA has billing and responsible attorney P2; P1 and P2 each hold a SUBMITTED NEW_CLIENT claim on it; ARB is an uninvolved credit arbiter."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Occ Claim One", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2013 }
              as: CycleAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Occ Claim Two", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2015 }
              as: CycleAdmin
              captures: { p2: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Occ Arbiter", practice_group: "REGULATORY", compensation_model: "FORMULA", admission_year: 2004, is_credit_arbiter: true, evaluation_required: false }
              as: CycleAdmin
              captures: { arb: "$.data.id" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-OA", client_display_name: "Occ Adjudication Assoc", matter_type: "NEW", practice_group: "CORPORATE", opened_on: "2026-02-01", billing_attorney_id: "${p2}", responsible_attorney_id: "${p2}" }
              as: CycleAdmin
              captures: { m: "$.data.id", mv0: "$.data.version" }
            - call: "POST /comp/credit-claims"
              payload: { cycle_id: "${cy}", matter_id: "${m}", claim_basis: "NEW_CLIENT", requested_pct: 60.00, narrative: "I sourced the client." }
              as: Partner
              as_user_id: "${p1}"
              captures: { cl1: "$.data.id" }
            - call: "POST /comp/credit-claims"
              payload: { cycle_id: "${cy}", matter_id: "${m}", claim_basis: "NEW_CLIENT", requested_pct: 40.00, narrative: "I closed the engagement." }
              as: Partner
              as_user_id: "${p2}"
              captures: { cl2: "$.data.id" }
            - call: "POST /comp/credit-claims/${cl1}/submit"
              payload: {}
              as: Partner
              as_user_id: "${p1}"
            - call: "POST /comp/credit-claims/${cl2}/submit"
              payload: {}
              as: Partner
              as_user_id: "${p2}"
          trigger:
            - call: "POST /comp/credit-claims/${cl1}/adjudicate"
              payload: { decision: "ALLOCATE", approved_pct: 60.00, expected_matter_version: "${mv0}" }
              as: CreditArbiter
