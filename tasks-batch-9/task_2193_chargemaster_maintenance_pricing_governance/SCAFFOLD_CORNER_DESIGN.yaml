              captures: { e_entry_add: $.data.error_id }
          assert:
            - "${cycle_status} == LOADED and ${entry_count0} == 0"
            - "${e_empty} == ERR_CYCLE_HAS_NO_ENTRIES with HTTP 422"
            - "${e1_status} == PENDING (entries may be added while the cycle is LOADED)"
            - "${e_loaded} == ERR_INVALID_CYCLE_STATE with HTTP 409 — the entry itself is PENDING, so the failure comes from the cycle status"
            - "${mapping} == MAPPING and Facility.${fac}.chargemaster_posture == RESTRICTED"
            - "${e_zero} == ERR_CROSSWALK_TARGET_NOT_FOUND with HTTP 404 (no item carries 93999)"
            - "${e_ambig} == ERR_CROSSWALK_TARGET_AMBIGUOUS with HTTP 409 (both ${it2} and ${it3} carry 93460)"
            - "${e1_deferred} == DEFERRED and ${e1_reason} == 'No local item carries 93999'"
            - "${e_entry_state} == ERR_INVALID_ENTRY_STATE with HTTP 409 (only PENDING entries can be dispositioned)"
            - "${e2_deferred} == DEFERRED and CodeUpdateCycle.${cycle}.unmapped_entry_count == 0"
            - "${e_nomapped} == ERR_CYCLE_HAS_NO_MAPPED_ENTRIES with HTTP 422 — unmapped_entry_count 0 is not enough, at least one entry must be MAPPED"
