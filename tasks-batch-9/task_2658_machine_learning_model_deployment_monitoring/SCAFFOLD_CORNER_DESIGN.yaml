      - name: skew_check_uses_the_training_key_set_and_short_circuits_on_missing_feature
        claim_type: Input Set Filtering
        grounds:
          - calculations.feature_skew_ratio
          - entities.SkewCheck.fields.missing_features
          - entities.SkewCheck.fields.status
          - entities.SkewCheck.fields.max_skew_feature
        distinguishing_aspect: |
          Two asymmetries the §1.8 threshold instance does not touch: the feature list is the KEY SET of
          training_feature_stats (a serving-only key is invisible, so it can never produce skew), and the
          status ladder short-circuits — one missing feature yields FAIL_MISSING_FEATURE even when a
          present feature is at 1.2500, i.e. above the block threshold. The max_skew_feature tie-break
          is the lexicographically smallest NAME, not insertion order.
