            - call: "POST /api/rescue-runs"
              payload: { offer_id: "${o}", expected_offer_version: "${ov}", driver_id: "${v1}", agency_id: "${ag}", cooler_ids: ["${c1}"] }
              as: DispatchAdmin
              captures: { r: "$.data.id" }
            - call: "GET /api/recipient-agencies/${ag}"
              as: DispatchAdmin
              captures: { committed_proposed: "$.data.committed_cold_held_lbs" }
            - call: "POST /api/rescue-runs/${r}/respond"
              payload: { decision: "ACCEPT" }
              as: VolunteerDriver
              as_user_id: "${v1}"
            - call: "GET /api/recipient-agencies/${ag}"
              as: DispatchAdmin
              captures: { committed_confirmed: "$.data.committed_cold_held_lbs" }
            - call: "POST /api/rescue-runs/${r}/fail"
              payload: { fault_party: "DONOR", reason: "DONOR_NO_SHOW" }
              as: VolunteerDriver
              as_user_id: "${v1}"
            - call: "GET /api/recipient-agencies/${ag}"
              as: DispatchAdmin
              captures: { committed_after: "$.data.committed_cold_held_lbs", received_after: "$.data.received_total_lbs" }
          assert:
            - "committed_proposed == 45 (reservation begins at dispatch, not at accept)"
            - "committed_confirmed == 45 (accept does not double-count the already-reserved run)"
            - "committed_after == 0 (compensating fail exactly restores the pre-dispatch value)"
            - "received_after == 0 (no delivery occurred)"

      - name: cooler_single_active_reservation_invariant
        grounds:
          - state_machines.Cooler
          - state_machines.CoolerReservation
        distinguishing_aspect: |
          Conserved quantity: per-cooler active reservation count and its
          status correspondence (distinct from instance 1's lbs): for every
          cooler, count(reservations in {RESERVED, CHECKED_OUT}) <= 1 AND
          (status == AVAILABLE iff that count == 0). Dispatch + decline
          round-trips C1 to AVAILABLE with zero active reservations, and a
          later dispatch re-reserves the SAME cooler — proving release was
          exact, not lossy.
        test_recipe:
          setup:
            - "Donor D ACTIVE; agency AG cold capacity 100; driver V1 ACTIVE certified with windows W1 09:00-13:00 and W2 13:00-15:00 (2026-08-02Z)"
            - "Cooler C1 30L; offers O1 (window 10:00-12:00) and O2 (13:00-14:00), COLD_HELD est 10, OPEN; clock 09:30Z"
