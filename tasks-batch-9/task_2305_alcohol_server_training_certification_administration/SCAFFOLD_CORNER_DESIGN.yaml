      - name: empty_rate_constants_diverge_between_a_location_and_its_account
        claim_type: Constants Applied
        grounds:
          - calculations.location_compliance_metrics
          - entities.EmployerLocation.fields.compliance_rate_strict_pct
          - entities.EmployerAccount.fields.account_compliance_rate_pct
        distinguishing_aspect: |
          On an account whose single MANDATED location has never had an assignment, the
          location constant is 100.00 on both rates with posture COMPLIANT while the
          account constant is 0.00 - the same zero denominator yields opposite values by
          design, and location_count reads 1.
        test_recipe:
          setup:
            - "A TX jurisdiction (MANDATORY, both tracks) and employer Lone Star Taverns LLC with exactly one ON_PREMISE location and no servers at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /state-jurisdictions"
              payload: { state_code: "TX", mandate_type: "MANDATORY", mandated_tracks: ["ON_PREMISE", "OFF_PREMISE"] }
              as: ProgramAdmin
              captures: { tx_id: $.data.id }
            - call: "POST /employer-accounts"
              payload: { legal_name: "Lone Star Taverns LLC", billing_state_code: "TX" }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /employer-accounts/${emp_id}/locations"
              payload: { location_name: "Alamo Taproom", state_jurisdiction_id: "${tx_id}", premise_type: "ON_PREMISE", annual_premium_cents: 4821734 }
              as: EmployerAdmin
              as_user_id: "${emp_id}"
              captures: { loc_a_id: $.data.id }
          assert:
            - "response status == 201 and EmployerLocation.${loc_a_id}.training_requirement == 'MANDATED'"
            - "EmployerLocation.${loc_a_id}.compliance_rate_strict_pct == 100.00 and compliance_rate_grace_inclusive_pct == 100.00 and compliance_posture == 'COMPLIANT'"
            - "EmployerLocation.${loc_a_id}.assigned_server_count == 0"
            - "EmployerAccount.${emp_id}.location_count == 1 and account_compliance_rate_pct == 0.00"
            - "EmployerAccount.${emp_id}.dram_shop_discount_status == 'NOT_DOCUMENTED' (0.00 is below the 80.00 promotion floor)"

      - name: voluntary_premise_type_makes_the_posture_not_applicable
        claim_type: Correct Result
        grounds:
