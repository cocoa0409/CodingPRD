              captures: { chk_id: "$.data[0].id", chk_pre_result: "$.data[0].result", chk_pre_reason: "$.data[0].failure_reason", chk_req_pc: "$.data[0].required_ped_clear_sec", chk_prov_pc: "$.data[0].provided_ped_clear_sec" }
          trigger:
            - call: "POST /signal-ops/pedestrian-checks/${chk_id}/waive"
              payload: { waiver_justification: "Crosswalk shortened by a pending median refuge; interim clearance accepted by the city engineer." }
              as: CertifyingEngineer
              as_user_id: "cert-1"
              captures: { chk_post_result: $.data.result, chk_waived_by: $.data.waived_by_user_id }
            - call: "GET /signal-ops/timing-plans/${pl1_id}"
              payload: {}
              as: CertifyingEngineer
              as_user_id: "cert-1"
              captures: { st_after_waive: $.data.status, ped_after_waive: $.data.ped_compliance_state }
            - call: "POST /signal-ops/timing-plans/${pl1_id}/submit"
