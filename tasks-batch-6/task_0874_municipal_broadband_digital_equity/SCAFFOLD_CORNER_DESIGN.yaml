            - { call: "POST /subscriptions", payload: { subscriber_id: "${s_id}", plan_id: "${p_id}", service_area_id: "${a_id}" }, as: CustomerCare, captures: { sub_id: "$.data.id" } }
            - { call: "POST /technicians", payload: { name: "Tec", region: "North" }, as: ProgramAdmin, captures: { t_id: "$.data.id" } }
            - { call: "POST /install-orders", payload: { subscription_id: "${sub_id}", technician_id: "${t_id}", scheduled_start_at: "2026-06-01T09:00:00Z" }, as: Dispatcher, captures: { io_id: "$.data.id" } }
            - { call: "POST /install-orders/${io_id}/complete", payload: {}, as: FieldTech, as_user_id: "${t_id}" }
            - { call: "POST /subscriptions/${sub_id}/activate", payload: {}, as: CustomerCare }
            - { call: "POST /subscriptions/${sub_id}/invoices", payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: Billing, captures: { inv_id: "$.data.id", inv_v: "$.data.version" } }
            - { call: "POST /subscriptions/${sub_id}/cancel", payload: {}, as: CustomerCare }
          trigger:
            - { call: "POST /invoices/${inv_id}/payments", payload: { amount_cents: 1000, expected_invoice_version: "${inv_v}" }, as: Billing, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVOICE_NOT_PAYABLE (409)"
            - "Invoice.${inv_id}.status == VOID"

      - name: invoice_period_end_before_start_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_PERIOD_INVALID]"]
        distinguishing_aspect: "Generating an invoice with period_end <= period_start returns ERR_PERIOD_INVALID (422)."
        test_recipe:
          setup: ["An ACTIVE subscription."]
          setup_api_calls:
            - { call: "POST /grants", payload: { funding_source: "BEAD", program_name: "Metro BEAD", award_amount_cents: 100000000, match_required_pct: 25, take_rate_milestone_pct: 40 }, as: ProgramAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /service-areas", payload: { grant_id: "${g_id}", name: "Area 1", census_block_group: "010010001001", homes_passed: 100, fiber_ready: true }, as: ProgramAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-plans", payload: { tier: "STANDARD", name: "Standard 100", download_mbps: 100, upload_mbps: 20, monthly_price_cents: 6000, sla_uptime_pct: 99.5 }, as: ProgramAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /subscribers", payload: { service_area_id: "${a_id}", full_name: "Jane Doe", email: "jane@x.com", service_address: "1 Main St", household_size: 2 }, as: CustomerCare, captures: { s_id: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${s_id}", plan_id: "${p_id}", service_area_id: "${a_id}" }, as: CustomerCare, captures: { sub_id: "$.data.id" } }
            - { call: "POST /technicians", payload: { name: "Tec", region: "North" }, as: ProgramAdmin, captures: { t_id: "$.data.id" } }
            - { call: "POST /install-orders", payload: { subscription_id: "${sub_id}", technician_id: "${t_id}", scheduled_start_at: "2026-06-01T09:00:00Z" }, as: Dispatcher, captures: { io_id: "$.data.id" } }
            - { call: "POST /install-orders/${io_id}/complete", payload: {}, as: FieldTech, as_user_id: "${t_id}" }
            - { call: "POST /subscriptions/${sub_id}/activate", payload: {}, as: CustomerCare }
          trigger:
            - { call: "POST /subscriptions/${sub_id}/invoices", payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z" }, as: Billing, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_PERIOD_INVALID (422)"

  # =========================================================================
  # RBAC — role denial and segregation of duties
  # =========================================================================
  - section: rbac
    instances:
      - name: customercare_cannot_create_grant_unauthorized
        claim_type: role_denied
        grounds: [roles.CustomerCare, roles.ProgramAdmin, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "POST /grants as CustomerCare (a ProgramAdmin-exclusive op) returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - { call: "POST /grants", payload: { funding_source: "BEAD", program_name: "Bad", award_amount_cents: 1000, match_required_pct: 25, take_rate_milestone_pct: 40 }, as: CustomerCare, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_UNAUTHORIZED (403)"

      - name: sod_approver_equals_submitter_rejected
        claim_type: segregation_of_duties
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]", state_machines.GrantClaim.SUBMITTED_to_APPROVED]
        distinguishing_aspect: "Approving a claim while acting X-User-ID equals submitted_by (analyst-1) returns ERR_SEGREGATION_OF_DUTIES (403), even though the ComplianceOfficer role is otherwise permitted."
        test_recipe:
          setup: ["A SUBMITTED claim whose submitted_by is analyst-1 (area SERVICEABLE, amount 0)."]
          setup_api_calls:
            - { call: "POST /grants", payload: { funding_source: "BEAD", program_name: "Metro BEAD", award_amount_cents: 100000000, match_required_pct: 25, take_rate_milestone_pct: 40 }, as: ProgramAdmin, captures: { g_id: "$.data.id", g_v: "$.data.version" } }
            - { call: "POST /service-areas", payload: { grant_id: "${g_id}", name: "Area 1", census_block_group: "010010001001", homes_passed: 100, fiber_ready: true }, as: ProgramAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /grants/${g_id}/claims", payload: { claim_period_start: "2026-06-01T00:00:00Z", claim_period_end: "2026-07-01T00:00:00Z", service_area_ids: ["${a_id}"], expected_grant_version: "${g_v}" }, as: ComplianceAnalyst, captures: { c_id: "$.data.id" } }
            - { call: "POST /grant-claims/${c_id}/submit", payload: {}, as: ComplianceAnalyst, as_user_id: "analyst-1" }
          trigger:
            - { call: "POST /grant-claims/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "analyst-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_SEGREGATION_OF_DUTIES (403)"
            - "GrantClaim.${c_id}.status == SUBMITTED"

      - name: fieldtech_complete_wrong_technician_unauthorized
        claim_type: role_denied
        grounds: [roles.FieldTech, state_machines.InstallOrder.SCHEDULED_to_COMPLETED, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A FieldTech completing an install whose technician_id is a different technician returns ERR_UNAUTHORIZED (ownership check X-User-ID == technician_id)."
        test_recipe:
          setup: ["A SCHEDULED install assigned to technician A; a second technician B exists."]
          setup_api_calls:
            - { call: "POST /grants", payload: { funding_source: "BEAD", program_name: "Metro BEAD", award_amount_cents: 100000000, match_required_pct: 25, take_rate_milestone_pct: 40 }, as: ProgramAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /service-areas", payload: { grant_id: "${g_id}", name: "Area 1", census_block_group: "010010001001", homes_passed: 100, fiber_ready: true }, as: ProgramAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-plans", payload: { tier: "STANDARD", name: "Standard 100", download_mbps: 100, upload_mbps: 20, monthly_price_cents: 6000, sla_uptime_pct: 99.5 }, as: ProgramAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /subscribers", payload: { service_area_id: "${a_id}", full_name: "Jane Doe", email: "jane@x.com", service_address: "1 Main St", household_size: 2 }, as: CustomerCare, captures: { s_id: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${s_id}", plan_id: "${p_id}", service_area_id: "${a_id}" }, as: CustomerCare, captures: { sub_id: "$.data.id" } }
            - { call: "POST /technicians", payload: { name: "Tech A", region: "North" }, as: ProgramAdmin, captures: { ta: "$.data.id" } }
            - { call: "POST /technicians", payload: { name: "Tech B", region: "North" }, as: ProgramAdmin, captures: { tb: "$.data.id" } }
            - { call: "POST /install-orders", payload: { subscription_id: "${sub_id}", technician_id: "${ta}", scheduled_start_at: "2026-06-01T09:00:00Z" }, as: Dispatcher, captures: { io_id: "$.data.id" } }
          trigger:
            - { call: "POST /install-orders/${io_id}/complete", payload: {}, as: FieldTech, as_user_id: "${tb}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_UNAUTHORIZED (403)"
            - "InstallOrder.${io_id}.status == SCHEDULED"

  # =========================================================================
  # Endpoints — reverse-reachability filtered list; pagination envelope
  # =========================================================================
  - section: endpoints
    instances:
      - name: list_subscriptions_filtered_by_subscriber
        claim_type: computed_read
        grounds: ["endpoints.GET /subscriptions", entities.Subscription.fields.subscriber_id]
        distinguishing_aspect: "GET /subscriptions?subscriber_id returns only that subscriber's subscriptions with pagination fields total_count/has_more."
        test_recipe:
          setup: ["A subscriber with exactly one subscription."]
          setup_api_calls:
            - { call: "POST /grants", payload: { funding_source: "BEAD", program_name: "Metro BEAD", award_amount_cents: 100000000, match_required_pct: 25, take_rate_milestone_pct: 40 }, as: ProgramAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /service-areas", payload: { grant_id: "${g_id}", name: "Area 1", census_block_group: "010010001001", homes_passed: 100, fiber_ready: true }, as: ProgramAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-plans", payload: { tier: "STANDARD", name: "Standard 100", download_mbps: 100, upload_mbps: 20, monthly_price_cents: 6000, sla_uptime_pct: 99.5 }, as: ProgramAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /subscribers", payload: { service_area_id: "${a_id}", full_name: "Jane Doe", email: "jane@x.com", service_address: "1 Main St", household_size: 2 }, as: CustomerCare, captures: { s_id: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${s_id}", plan_id: "${p_id}", service_area_id: "${a_id}" }, as: CustomerCare, captures: { sub_id: "$.data.id" } }
          trigger:
            - { call: "GET /subscriptions", payload: { subscriber_id: "${s_id}" }, as: CustomerCare }
          assert:
            - "response data is an array containing exactly the subscription ${sub_id}"
            - "response meta/pagination exposes total_count == 1 and has_more == false"

  # =========================================================================
  # Excluded — corners already exercised by a §1.8 difficulty instance
  # =========================================================================
  - section: errors
    instances:
      - name: error_area_not_serviceable_on_claim_submit
        claim_type: violation_to_error
        grounds: ["errors[ERR_AREA_NOT_SERVICEABLE]"]
        excluded_because:
          difficulty_instance: claim_submit_requires_serviceable_area
          rationale: "Asserted as the failure path of the named §1.8 cross_entity_state_dependency instance."
      - name: error_install_not_completed_on_activate
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSTALL_NOT_COMPLETED]"]
        excluded_because:
          difficulty_instance: subscription_activate_requires_completed_install
          rationale: "Asserted as the failure path of the named §1.8 cross_entity_state_dependency instance."
      - name: error_technician_double_booked_on_install_create
        claim_type: violation_to_error
        grounds: ["errors[ERR_TECHNICIAN_DOUBLE_BOOKED]"]
        excluded_because:
          difficulty_instance: technician_double_booked_halfopen
          rationale: "Asserted as the failure path of the named §1.8 resource_temporal_overlap instance."
      - name: error_outage_overlap_on_report
        claim_type: violation_to_error
        grounds: ["errors[ERR_OUTAGE_OVERLAP]"]
        excluded_because:
          difficulty_instance: outage_buffer_overlap_closed
          rationale: "Asserted as the failure path of the named §1.8 resource_temporal_overlap instance."
      - name: error_technician_inactive_on_install_create
        claim_type: violation_to_error
        grounds: ["errors[ERR_TECHNICIAN_INACTIVE]"]
        excluded_because:
          difficulty_instance: referential_beats_temporal_on_install_create
          rationale: "Asserted as the winning error of the named §1.8 priority-conflict instance."
      - name: error_insufficient_grant_funds_on_submit
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSUFFICIENT_GRANT_FUNDS]"]
        excluded_because:
          difficulty_instance: state_beats_fiscal_on_resubmit
          rationale: "The fiscal ceiling is the lower-priority violation exercised by the named §1.8 priority-conflict instance (available=0 < amount=1000)."
