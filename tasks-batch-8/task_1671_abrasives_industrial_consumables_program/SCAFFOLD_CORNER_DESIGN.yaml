      - name: lot_depleted_at_zero_usage
        claim_type: side_effect_execution
        grounds:
          - "state_machines.InventoryLot.AVAILABLE_to_DEPLETED"
          - "errors[ERR_LOT_QTY_EXCEEDED]"
        distinguishing_aspect: "Usage qty == qty_on_hand is allowed (inclusive) and drives the lot to exactly 0, auto-transitioning it to DEPLETED."
        test_recipe:
          setup: ["COATED product rpm 6000; ACTIVE machine; ACTIVE standard 0.0250 open window; lot qty 5"]
          setup_api_calls:
