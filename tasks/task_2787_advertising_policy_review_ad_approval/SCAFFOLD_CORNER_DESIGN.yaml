              as: PolicyReviewer
              as_user_id: "${rev1}"
            - call: "GET /ad-policy/disapproval-notices"
              payload: { ad_creative_id: "${cr_id}" }
              as: PolicyAdmin
              captures: { notice_id: "$.data[0].id" }
            - call: "POST /ad-policy/appeals"
              payload: { disapproval_notice_id: "${notice_id}", justification: "The published rate schedule supports every claim in the creative." }
              as: Advertiser
