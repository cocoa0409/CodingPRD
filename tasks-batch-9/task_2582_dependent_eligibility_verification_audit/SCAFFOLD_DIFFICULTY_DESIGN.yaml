# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2582 - Dependent Eligibility Verification Audit
# 9 rule_ids x 2 instances = 18 instances. Every numeric assert below was computed
# by executing the named calculations[].formula against its constants:.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: savings_provisional_vs_audited_diverge_on_one_dependent_set
        grounds:
          - calculations.savings_measurement
          - entities.AuditProgram.fields.provisional_annual_savings_cents
          - entities.AuditProgram.fields.audited_annual_savings_cents
          - entities.AuditProgram.fields.last_savings_variant
          - endpoints[POST /audit-programs/{id}/measure-savings]
        distinguishing_aspect: |
          This instance's two variants live in the AuditProgram savings domain: PROVISIONAL annualises
          every unresolved termination at 12 months (1559112) while AUDITED counts only dependents whose
          coverage actually ended and prorates from the coverage_end_date month (91500) - a 1467612 cent gap
          on the identical three-dependent set.
        test_recipe:
          setup:
            - "Employee E1 holds SPOUSE dependent D1 (49713 cents/month) and CHILD_BIOLOGICAL dependent D2 (30500); Employee E2 holds DOMESTIC_PARTNER dependent D3 (49713)."
            - "Program P is FULL_CENSUS-scoped over both employees, announced 2026-09-01 (amnesty_end 2026-09-22, response_deadline 2026-10-16)."
            - "D2 was voluntarily removed under amnesty on 2026-09-10 -> coverage_end_date 2026-09-30, so it contributes 30500 * (12 - 9) = 91500 to AUDITED."
            - "The clock is 2026-10-17 and one sweep has run S1 then S2, so D1 and D3 are TERMINATION_PENDING with ISSUED notices and both cases are ESCALATED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employees"
              payload: { full_name: "Dana Reyes", work_email: "dana.reyes@acme.test", coverage_tier: "FAMILY", employer_monthly_premium_cents: 148000, hire_date: "2019-03-04" }
              as: ProgramAdmin
              captures: { emp1_id: "$.data.id" }
            - call: "POST /employees"
              payload: { full_name: "Kofi Mensah", work_email: "kofi.mensah@acme.test", coverage_tier: "EMPLOYEE_SPOUSE", employer_monthly_premium_cents: 121000, hire_date: "2021-06-14" }
              as: ProgramAdmin
              captures: { emp2_id: "$.data.id" }
            - call: "POST /employees/${emp1_id}/dependents"
              payload: { relationship_type: "SPOUSE", full_name: "Marta Reyes", date_of_birth: "1988-04-12", monthly_cost_cents: 49713 }
              as: ProgramAdmin
              captures: { dep1_id: "$.data.id" }
            - call: "POST /employees/${emp1_id}/dependents"
              payload: { relationship_type: "CHILD_BIOLOGICAL", full_name: "Ivo Reyes", date_of_birth: "2014-02-02", monthly_cost_cents: 30500 }
              as: ProgramAdmin
              captures: { dep2_id: "$.data.id" }
            - call: "POST /employees/${emp2_id}/dependents"
              payload: { relationship_type: "DOMESTIC_PARTNER", full_name: "Ama Mensah", date_of_birth: "1990-11-30", monthly_cost_cents: 49713 }
              as: ProgramAdmin
              captures: { dep3_id: "$.data.id" }
            - call: "POST /audit-programs"
              payload: { program_name: "PY2026 Dependent Eligibility Audit", plan_year: 2026, amnesty_days: 21, response_days: 45, reminder_min_gap_days: 7, max_reminders: 3, poe_verification_enabled: false }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /audit-programs/${prog_id}/documentation-rules"
              payload: { relationship_type: "SPOUSE", phase: "AUDIT", acceptable_proof_types: ["MARRIAGE_CERTIFICATE", "JOINT_TAX_RETURN", "JOINT_ACCOUNT_STATEMENT"], min_accepted_documents: 2, affidavit_allowed: false, requires_recency_days: 365, auto_terminate_on_lapse: false }
              as: ProgramAdmin
            - call: "POST /audit-programs/${prog_id}/documentation-rules"
              payload: { relationship_type: "CHILD_BIOLOGICAL", phase: "AUDIT", acceptable_proof_types: ["BIRTH_CERTIFICATE"], min_accepted_documents: 1, affidavit_allowed: false, requires_recency_days: 365, auto_terminate_on_lapse: false }
              as: ProgramAdmin
            - call: "POST /audit-programs/${prog_id}/documentation-rules"
              payload: { relationship_type: "DOMESTIC_PARTNER", phase: "AUDIT", acceptable_proof_types: ["DOMESTIC_PARTNER_AFFIDAVIT", "JOINT_ACCOUNT_STATEMENT"], min_accepted_documents: 2, affidavit_allowed: true, requires_recency_days: 365, auto_terminate_on_lapse: false }
              as: ProgramAdmin
            - call: "GET /audit-programs/${prog_id}"
              as: ProgramAdmin
              captures: { pv: "$.data.version" }
            - call: "POST /audit-programs/${prog_id}/scope"
              payload: { expected_program_version: "${pv}", scope_type: "FULL_CENSUS" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /audit-programs/${prog_id}/communicate"
              payload: { channel: "EMAIL", template_code: "AUDIT_ANNOUNCE_V1" }
              as: ProgramAdmin
            - call: "GET /audit-cases"
              payload: { program_id: "${prog_id}", employee_id: "${emp1_id}" }
              as: ProgramAdmin
              captures: { case1_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /amnesty-removals"
              payload: { dependent_id: "${dep2_id}", case_id: "${case1_id}", reason_code: "NO_LONGER_ELIGIBLE", attestation_signed: true }
              as: Employee
              as_user_id: "${emp1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-17T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /audit-programs/${prog_id}/run-sweep"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /audit-programs/${prog_id}/measure-savings"
              payload: { variant: "PROVISIONAL" }
              as: ProgramAdmin
            - call: "POST /audit-programs/${prog_id}/measure-savings"
              payload: { variant: "AUDITED" }
              as: ProgramAdmin
          assert:
            - "AuditProgram.${prog_id}.provisional_annual_savings_cents == 1559112"
            - "AuditProgram.${prog_id}.audited_annual_savings_cents == 91500"
            - "AuditProgram.${prog_id}.provisional_annual_savings_cents - AuditProgram.${prog_id}.audited_annual_savings_cents == 1467612"
            - "AuditProgram.${prog_id}.last_savings_variant == AUDITED"
            - "Dependent.${dep2_id}.coverage_end_date == 2026-09-30 and Dependent.${dep2_id}.coverage_status == AMNESTY_REMOVED"
            - "Dependent.${dep1_id}.coverage_status == TERMINATION_PENDING and Dependent.${dep3_id}.coverage_status == TERMINATION_PENDING"

      - name: recovery_strict_vs_equitable_diverge_on_one_claim_line_set
        grounds:
          - calculations.claims_recovery_amount
          - entities.ClaimRecovery.fields.recoverable_subtotal_cents
          - entities.PaidClaimLine.fields.employee_premium_offset_cents
          - concurrency_rules[recovery-create-stale-dependent]
          - endpoints[POST /claim-recoveries]
        distinguishing_aspect: |
          This instance's two variants live in the ClaimRecovery domain (not AuditProgram): over the identical
          three PaidClaimLine rows STRICT reaches back to ineligibility_onset_date and ignores premium offsets
          (270000) while EQUITABLE starts at the announcement date and nets each line by its offset (120000).
        test_recipe:
          setup:
            - "Employee E1 holds SPOUSE dependent D1 (49713 cents/month) with three paid claim lines: 2026-07-15 paid 120000 offset 20000; 2026-09-20 paid 150000 offset 30000; 2026-11-15 paid 50000 offset 0."
            - "Program P was announced 2026-09-01; D1 never responded, so the 2026-10-17 sweep issued a notice with effective_date 2026-10-31 and the 2026-11-01 sweep finalized it: D1 is TERMINATED with coverage_end_date 2026-10-31."
            - "The 2026-11-15 line falls outside the closed [onset, coverage_end] window under both variants; the 2026-07-15 line is inside the STRICT window only."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employees"
              payload: { full_name: "Dana Reyes", work_email: "dana.reyes@acme.test", coverage_tier: "EMPLOYEE_SPOUSE", employer_monthly_premium_cents: 121000, hire_date: "2019-03-04" }
              as: ProgramAdmin
              captures: { emp1_id: "$.data.id" }
            - call: "POST /employees/${emp1_id}/dependents"
              payload: { relationship_type: "SPOUSE", full_name: "Marta Reyes", date_of_birth: "1988-04-12", monthly_cost_cents: 49713 }
              as: ProgramAdmin
              captures: { dep1_id: "$.data.id" }
            - call: "POST /dependents/${dep1_id}/paid-claims"
              payload: { service_date: "2026-07-15", paid_cents: 120000, employee_premium_offset_cents: 20000, claim_reference: "CLM-0001", provider_type: "MEDICAL" }
              as: ProgramAdmin
            - call: "POST /dependents/${dep1_id}/paid-claims"
              payload: { service_date: "2026-09-20", paid_cents: 150000, employee_premium_offset_cents: 30000, claim_reference: "CLM-0002", provider_type: "MEDICAL" }
              as: ProgramAdmin
            - call: "POST /dependents/${dep1_id}/paid-claims"
              payload: { service_date: "2026-11-15", paid_cents: 50000, employee_premium_offset_cents: 0, claim_reference: "CLM-0003", provider_type: "PHARMACY" }
              as: ProgramAdmin
            - call: "POST /audit-programs"
              payload: { program_name: "PY2026 Dependent Eligibility Audit", plan_year: 2026, amnesty_days: 21, response_days: 45, reminder_min_gap_days: 7, max_reminders: 3, poe_verification_enabled: false }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /audit-programs/${prog_id}/documentation-rules"
              payload: { relationship_type: "SPOUSE", phase: "AUDIT", acceptable_proof_types: ["MARRIAGE_CERTIFICATE", "JOINT_TAX_RETURN", "JOINT_ACCOUNT_STATEMENT"], min_accepted_documents: 2, affidavit_allowed: false, requires_recency_days: 365, auto_terminate_on_lapse: false }
              as: ProgramAdmin
            - call: "GET /audit-programs/${prog_id}"
              as: ProgramAdmin
              captures: { pv: "$.data.version" }
            - call: "POST /audit-programs/${prog_id}/scope"
              payload: { expected_program_version: "${pv}", scope_type: "FULL_CENSUS" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /audit-programs/${prog_id}/communicate"
              payload: { channel: "EMAIL", template_code: "AUDIT_ANNOUNCE_V1" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-17T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /audit-programs/${prog_id}/run-sweep"
              payload: {}
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /audit-programs/${prog_id}/run-sweep"
              payload: {}
              as: ProgramAdmin
            - call: "GET /termination-notices"
              payload: { dependent_id: "${dep1_id}" }
              as: RecoveryAgent
              captures: { notice1_id: "$.data[0].id" }
            - call: "GET /dependents/${dep1_id}"
              as: RecoveryAgent
              captures: { dv1: "$.data.version" }
          trigger:
            - call: "POST /claim-recoveries"
              payload: { dependent_id: "${dep1_id}", termination_notice_id: "${notice1_id}", recovery_variant: "STRICT", ineligibility_onset_date: "2026-06-01", expected_dependent_version: "${dv1}" }
              as: RecoveryAgent
              captures: { rec_strict_id: "$.data.id" }
            - call: "GET /dependents/${dep1_id}"
              as: RecoveryAgent
              captures: { dv2: "$.data.version" }
            - call: "POST /claim-recoveries"
              payload: { dependent_id: "${dep1_id}", termination_notice_id: "${notice1_id}", recovery_variant: "EQUITABLE", ineligibility_onset_date: "2026-06-01", expected_dependent_version: "${dv2}" }
              as: RecoveryAgent
              captures: { rec_equitable_id: "$.data.id" }
          assert:
            - "ClaimRecovery.${rec_strict_id}.recoverable_subtotal_cents == 270000"
            - "ClaimRecovery.${rec_equitable_id}.recoverable_subtotal_cents == 120000"
            - "ClaimRecovery.${rec_strict_id}.recoverable_subtotal_cents - ClaimRecovery.${rec_equitable_id}.recoverable_subtotal_cents == 150000"
            - "ClaimRecovery.${rec_strict_id}.status == SUPERSEDED"
            - "ClaimRecovery.${rec_equitable_id}.status == OPEN"
            - "Dependent.${dep1_id}.recovery_revision == 2"

  - rule_id: combinatorial_formula
    instances:
      - name: continuation_premium_rounds_each_component_before_summing
        grounds:
          - calculations.continuation_premium
          - entities.TerminationNotice.fields.continuation_monthly_premium_cents
          - endpoints[POST /termination-notices/{id}/continuation-election]
        distinguishing_aspect: |
          Mode (b) rounding-order sensitivity: the load factor 1.02 is applied and rounded per coverage
          component (MEDICAL 45125 -> 46028, DENTAL 3313 -> 3379, VISION 1275 -> 1301, sum 50708). The
          forbidden single-rounding order round_half_up(49713 * 1.02) yields 50707, so a one-cent gap
          exposes any implementation that sums first. SPOUSE is mandatory here: child component costs
          happen to round identically under both orders and would hide the defect.
        test_recipe:
          setup:
            - "Employee E1 holds SPOUSE dependent D1; program P announced 2026-09-01 with response_deadline 2026-10-16."
            - "The 2026-10-17 sweep issued a TerminationNotice (issued_at 2026-10-17, effective_date 2026-10-31, continuation_election_deadline 2026-12-16) and the 2026-11-01 sweep finalized it."
            - "The clock is 2026-11-05, inside the 60-day election window; continuation_election_status is still NOT_ELECTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employees"
              payload: { full_name: "Dana Reyes", work_email: "dana.reyes@acme.test", coverage_tier: "EMPLOYEE_SPOUSE", employer_monthly_premium_cents: 121000, hire_date: "2019-03-04" }
              as: ProgramAdmin
              captures: { emp1_id: "$.data.id" }
            - call: "POST /employees/${emp1_id}/dependents"
              payload: { relationship_type: "SPOUSE", full_name: "Marta Reyes", date_of_birth: "1988-04-12", monthly_cost_cents: 49713 }
              as: ProgramAdmin
              captures: { dep1_id: "$.data.id" }
            - call: "POST /audit-programs"
              payload: { program_name: "PY2026 Dependent Eligibility Audit", plan_year: 2026, amnesty_days: 21, response_days: 45, reminder_min_gap_days: 7, max_reminders: 3, poe_verification_enabled: false }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /audit-programs/${prog_id}/documentation-rules"
              payload: { relationship_type: "SPOUSE", phase: "AUDIT", acceptable_proof_types: ["MARRIAGE_CERTIFICATE", "JOINT_TAX_RETURN"], min_accepted_documents: 2, affidavit_allowed: false, requires_recency_days: 365, auto_terminate_on_lapse: false }
              as: ProgramAdmin
            - call: "GET /audit-programs/${prog_id}"
              as: ProgramAdmin
              captures: { pv: "$.data.version" }
            - call: "POST /audit-programs/${prog_id}/scope"
              payload: { expected_program_version: "${pv}", scope_type: "FULL_CENSUS" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /audit-programs/${prog_id}/communicate"
              payload: { channel: "EMAIL", template_code: "AUDIT_ANNOUNCE_V1" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-17T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /audit-programs/${prog_id}/run-sweep"
              payload: {}
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /audit-programs/${prog_id}/run-sweep"
              payload: {}
              as: ProgramAdmin
            - call: "GET /termination-notices"
              payload: { dependent_id: "${dep1_id}" }
              as: ProgramAdmin
              captures: { notice1_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-05T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /termination-notices/${notice1_id}/continuation-election"
              payload: { election: "ELECT" }
              as: Employee
              as_user_id: "${emp1_id}"
          assert:
            - "TerminationNotice.${notice1_id}.continuation_monthly_premium_cents == 50708"
            - "TerminationNotice.${notice1_id}.continuation_monthly_premium_cents != 50707"
            - "TerminationNotice.${notice1_id}.continuation_election_status == ELECTED"
            - "TerminationNotice.${notice1_id}.continuation_elected_at == 2026-11-05T00:00:00Z"
            - "TerminationNotice.${notice1_id}.continuation_start_date == 2026-11-01"
            - "TerminationNotice.${notice1_id}.continuation_end_date == 2028-05-01"

      - name: admin_fee_tier_keys_on_subtotal_not_fee_inclusive_total
        grounds:
          - calculations.net_recovery_demand
          - entities.ClaimRecovery.fields.admin_fee_pct
          - entities.ClaimRecovery.fields.net_demand_cents
          - endpoints[POST /claim-recoveries/{id}/issue-demand]
        distinguishing_aspect: |
          Mode (c) evaluation-order sensitivity on a self-referential fee: the demand contains the fee, so an
          implementation that tiers on the finished demand (514500 >= 500000 -> 0.08 -> 39200 -> 529200) diverges
          from the pinned STEP 2 order that tiers on the 490000 subtotal (0.05 -> 24500 -> 514500). Both orders
          use the same constants; only the sequencing differs.
        test_recipe:
          setup:
            - "Employee E1 holds SPOUSE dependent D1 with two paid claim lines: 2026-09-20 paid 240000 and 2026-09-25 paid 250000 (subtotal 490000, deliberately just under the 500000 tier-3 threshold)."
            - "Program P was announced 2026-09-01; the 2026-10-17 and 2026-11-01 sweeps left D1 TERMINATED with coverage_end_date 2026-10-31 and its notice FINAL."
            - "A STRICT ClaimRecovery with ineligibility_onset_date 2026-09-01 is OPEN with recoverable_subtotal_cents 490000; no waiver credit is claimed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employees"
              payload: { full_name: "Dana Reyes", work_email: "dana.reyes@acme.test", coverage_tier: "EMPLOYEE_SPOUSE", employer_monthly_premium_cents: 121000, hire_date: "2019-03-04" }
              as: ProgramAdmin
              captures: { emp1_id: "$.data.id" }
            - call: "POST /employees/${emp1_id}/dependents"
              payload: { relationship_type: "SPOUSE", full_name: "Marta Reyes", date_of_birth: "1988-04-12", monthly_cost_cents: 49713 }
              as: ProgramAdmin
              captures: { dep1_id: "$.data.id" }
            - call: "POST /dependents/${dep1_id}/paid-claims"
              payload: { service_date: "2026-09-20", paid_cents: 240000, employee_premium_offset_cents: 0, claim_reference: "CLM-2001", provider_type: "MEDICAL" }
              as: ProgramAdmin
            - call: "POST /dependents/${dep1_id}/paid-claims"
              payload: { service_date: "2026-09-25", paid_cents: 250000, employee_premium_offset_cents: 0, claim_reference: "CLM-2002", provider_type: "MEDICAL" }
              as: ProgramAdmin
            - call: "POST /audit-programs"
              payload: { program_name: "PY2026 Dependent Eligibility Audit", plan_year: 2026, amnesty_days: 21, response_days: 45, reminder_min_gap_days: 7, max_reminders: 3, poe_verification_enabled: false }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /audit-programs/${prog_id}/documentation-rules"
              payload: { relationship_type: "SPOUSE", phase: "AUDIT", acceptable_proof_types: ["MARRIAGE_CERTIFICATE", "JOINT_TAX_RETURN"], min_accepted_documents: 2, affidavit_allowed: false, requires_recency_days: 365, auto_terminate_on_lapse: false }
              as: ProgramAdmin
            - call: "GET /audit-programs/${prog_id}"
              as: ProgramAdmin
              captures: { pv: "$.data.version" }
            - call: "POST /audit-programs/${prog_id}/scope"
              payload: { expected_program_version: "${pv}", scope_type: "FULL_CENSUS" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /audit-programs/${prog_id}/communicate"
              payload: { channel: "EMAIL", template_code: "AUDIT_ANNOUNCE_V1" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-17T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /audit-programs/${prog_id}/run-sweep"
              payload: {}
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /audit-programs/${prog_id}/run-sweep"
              payload: {}
              as: ProgramAdmin
            - call: "GET /termination-notices"
              payload: { dependent_id: "${dep1_id}" }
              as: RecoveryAgent
              captures: { notice1_id: "$.data[0].id" }
            - call: "GET /dependents/${dep1_id}"
              as: RecoveryAgent
              captures: { dv1: "$.data.version" }
            - call: "POST /claim-recoveries"
              payload: { dependent_id: "${dep1_id}", termination_notice_id: "${notice1_id}", recovery_variant: "STRICT", ineligibility_onset_date: "2026-09-01", expected_dependent_version: "${dv1}" }
              as: RecoveryAgent
              captures: { rec1_id: "$.data.id" }
          trigger:
            - call: "POST /claim-recoveries/${rec1_id}/issue-demand"
              payload: { waiver_credit_cents: 0 }
              as: RecoveryAgent
          assert:
            - "ClaimRecovery.${rec1_id}.recoverable_subtotal_cents == 490000"
            - "ClaimRecovery.${rec1_id}.admin_fee_pct == 0.05"
            - "ClaimRecovery.${rec1_id}.admin_fee_cents == 24500"
            - "ClaimRecovery.${rec1_id}.net_demand_cents == 514500"
            - "ClaimRecovery.${rec1_id}.net_demand_cents != 529200"
            - "ClaimRecovery.${rec1_id}.status == DEMAND_ISSUED"
            - "AuditProgram.${prog_id}.recovery_ledger_cents == 514500"

  - rule_id: non_linear_state_machine
    instances:
      - name: audit_case_cycles_escalated_back_to_in_progress_on_appeal_grant
        grounds:
          - state_machines.AuditCase.ESCALATED_to_IN_PROGRESS
          - state_machines.AuditCase.IN_PROGRESS_to_NON_RESPONSIVE
          - state_machines.Dependent.TERMINATION_PENDING_to_VERIFIED
          - endpoints[POST /appeals/{id}/decision]
        distinguishing_aspect: |
