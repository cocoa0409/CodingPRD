scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_dock_returns_201_with_accrual_fields_initialised
        claim_type: Creation
        grounds: ["entities.Dock", "endpoints.POST /harbor/docks"]
        distinguishing_aspect: "A dock created with all required fields returns 201, id, created_at, version 1, accrued_fee_cents 0 and fee_status ACCRUING."
        test_recipe:
          setup: ["Empty database; the logical clock is untouched and reads 2026-08-01T00:00:00Z."]
          setup_api_calls: []
          trigger:
            - call: "POST /harbor/docks"
              payload: { name: "Pier One", berth_count: 2, min_turnaround_minutes: 15, landing_fee_per_pax_cents: 120, berth_minute_rate_cents: 40, monthly_fee_cap_cents: 1000000, shared_operator_count: 2 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { dock_id: $.data.id, dock_v: $.data.version }
          assert:
            - "HTTP status of the trigger == 201"
            - "Dock.${dock_id}.berth_count == 2"
            - "Dock.${dock_id}.accrued_fee_cents == 0"
            - "Dock.${dock_id}.fee_status == ACCRUING"
            - "${dock_v} == 1"
            - "response envelope carries meta.api_request_id and response_type object"

      - name: create_dock_without_min_turnaround_applies_the_declared_default
        claim_type: Defaults
        grounds: ["entities.Dock.fields.min_turnaround_minutes"]
        distinguishing_aspect: "Omitting min_turnaround_minutes stores 15, and omitting shared_operator_count stores 1."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /harbor/docks"
              payload: { name: "Default Dock", berth_count: 1, landing_fee_per_pax_cents: 100, berth_minute_rate_cents: 30, monthly_fee_cap_cents: 500000 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { dock_id: $.data.id }
          assert:
            - "Dock.${dock_id}.min_turnaround_minutes == 15"
            - "Dock.${dock_id}.shared_operator_count == 1"

      - name: create_vessel_missing_required_draft_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Vessel.fields.draft_m", "validations[priority=6]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A vessel POST without draft_m is rejected with ERR_INVALID_REQUEST 400 and no Vessel row is created."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /harbor/vessels"
              payload: { name: "No Draft", seat_capacity: 20, hull_class: "HARBOR", required_endorsement: "MASTER_25T" }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_INVALID_REQUEST"
            - "HTTP status of the trigger == 400"

      - name: create_ride_pass_with_undeclared_zone_tier_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["entities.RidePass.fields.zone_tier", "validations[priority=6]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "zone_tier accepts only INNER, OUTER and ALL_ZONE; the value MIDDLE is rejected with 400."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /harbor/ride-passes"
              payload: { zone_tier: "MIDDLE", rides_purchased: 5, purchase_price_cents: 5000, valid_until: "2026-12-31" }
              as: Rider
              as_user_id: "rider-ann"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_INVALID_REQUEST"
            - "HTTP status of the trigger == 400"

      - name: ride_pass_creation_derives_balance_fields_and_ignores_client_supplied_ones
        claim_type: Computed Fields
        grounds: ["entities.RidePass.fields.rides_remaining", "entities.RidePass.fields.rides_consumed", "entities.RidePass.fields.rider_user_id"]
        distinguishing_aspect: "rides_remaining is set to rides_purchased, rides_consumed to 0, status ACTIVE, and rider_user_id is stamped from X-User-ID rather than from the body."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /harbor/ride-passes"
              payload: { zone_tier: "OUTER", rides_purchased: 8, purchase_price_cents: 12000, valid_until: "2026-12-31" }
              as: Rider
              as_user_id: "rider-ann"
              captures: { pass_id: $.data.id }
          assert:
            - "RidePass.${pass_id}.rides_remaining == 8"
            - "RidePass.${pass_id}.rides_consumed == 0"
            - "RidePass.${pass_id}.status == ACTIVE"
            - "RidePass.${pass_id}.rider_user_id == rider-ann"
            - "RidePass.${pass_id}.refund_amount_cents == 0"
            - "RidePass.${pass_id}.refund_basis == null"

      - name: vessel_inspection_stamps_inspector_and_derives_expiry_and_carries_no_version
        claim_type: System Fields
        grounds: ["entities.VesselInspection", "entities.VesselInspection.fields.expires_on", "entities.VesselInspection.fields.inspector_user_id"]
        distinguishing_aspect: "An ANNUAL row stamps inspector_user_id from X-User-ID and derives expires_on as performed_on + 365 days (2026-08-01 -> 2027-08-01); a PRE_DEPARTURE row derives expires_on null. The entity is immutable, so no update endpoint exists."
        test_recipe:
          setup: ["One vessel 'Osprey' registered."]
          setup_api_calls:
            - call: "POST /harbor/vessels"
              payload: { name: "Osprey", seat_capacity: 40, draft_m: 1.20, hull_class: "OFFSHORE", required_endorsement: "MASTER_25T" }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { vessel_id: $.data.id }
          trigger:
            - call: "POST /harbor/vessels/${vessel_id}/inspections"
              payload: { inspection_type: "ANNUAL", result: "PASS", deficiency_count: 0, performed_on: "2026-08-01" }
              as: MarineInspector
              as_user_id: "insp-1"
              captures: { annual_id: $.data.id }
            - call: "POST /harbor/vessels/${vessel_id}/inspections"
              payload: { inspection_type: "PRE_DEPARTURE", result: "PASS", deficiency_count: 0, performed_on: "2026-08-02" }
              as: MarineInspector
              as_user_id: "insp-1"
              captures: { predep_id: $.data.id }
          assert:
            - "VesselInspection.${annual_id}.inspector_user_id == insp-1"
            - "VesselInspection.${annual_id}.expires_on == 2027-08-01"
            - "VesselInspection.${predep_id}.expires_on == null"
            - "Vessel.${vessel_id}.annual_inspection_expires_on == 2027-08-01"
            - "Vessel.${vessel_id}.service_state == IN_SERVICE"

      - name: get_trip_with_unknown_id_returns_trip_not_found
        claim_type: Not Found
        grounds: ["endpoints.GET /harbor/trips/{id}", "errors[ERR_TRIP_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "A well-formed UUID that names no Trip answers ERR_TRIP_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /harbor/trips/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_TRIP_NOT_FOUND"
            - "HTTP status of the trigger == 404"

      - name: create_stop_under_unknown_dock_returns_dock_not_found
        claim_type: Parent Relationships
        grounds: ["entities.Stop.fields.dock_id", "errors[ERR_DOCK_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "The path dock id is resolved before the body is validated, so an unknown dock answers ERR_DOCK_NOT_FOUND 404 rather than ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /harbor/docks/00000000-0000-4000-8000-000000000000/stops"
              payload: { name: "Ghost Stop", zone_index: 1, charted_depth_m: 3.00 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_DOCK_NOT_FOUND"
            - "HTTP status of the trigger == 404"

      - name: create_trip_with_unknown_master_crew_returns_crew_not_found
        claim_type: Foreign key references validated
        grounds: ["entities.Trip.fields.master_crew_id", "errors[ERR_CREW_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "Flat topology: body foreign keys are resolved in the endpoint's declared input order, so an unknown master_crew_id answers ERR_CREW_NOT_FOUND 404 even though every other reference resolves."
        test_recipe:
          setup: ["Two docks with one stop each, one vessel, and ServiceDay 2026-09-12 at posture NORMAL."]
          setup_api_calls:
            - call: "POST /harbor/docks"
              payload: { name: "Pier One", berth_count: 2, min_turnaround_minutes: 15, landing_fee_per_pax_cents: 120, berth_minute_rate_cents: 40, monthly_fee_cap_cents: 1000000 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { dock_a_id: $.data.id }
            - call: "POST /harbor/docks/${dock_a_id}/stops"
              payload: { name: "Ferry Landing", zone_index: 1, charted_depth_m: 3.50 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { stop1_id: $.data.id }
            - call: "POST /harbor/docks"
              payload: { name: "Pier Two", berth_count: 1, min_turnaround_minutes: 0, landing_fee_per_pax_cents: 200, berth_minute_rate_cents: 60, monthly_fee_cap_cents: 1000000 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { dock_b_id: $.data.id }
            - call: "POST /harbor/docks/${dock_b_id}/stops"
              payload: { name: "Quay Two", zone_index: 2, charted_depth_m: 4.00 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { stop2_id: $.data.id }
            - call: "POST /harbor/vessels"
              payload: { name: "Osprey", seat_capacity: 40, draft_m: 1.20, hull_class: "OFFSHORE", required_endorsement: "MASTER_25T" }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { vessel_id: $.data.id }
            - call: "POST /harbor/service-days"
              payload: { service_date: "2026-09-12", wind_knots: 10.0, wave_height_m: 0.30, low_water_m: 2.10 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { day_id: $.data.id }
          trigger:
            - call: "POST /harbor/trips"
              payload: { service_day_id: "${day_id}", vessel_id: "${vessel_id}", master_crew_id: "00000000-0000-4000-8000-000000000000", origin_stop_id: "${stop1_id}", destination_stop_id: "${stop2_id}", service_mode: "SCHEDULED", scheduled_departure_utc: "2026-09-12T14:00:00Z", scheduled_arrival_utc: "2026-09-12T14:25:00Z" }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_CREW_NOT_FOUND"
            - "HTTP status of the trigger == 404"
            - "GET /harbor/trips?service_day_id=${day_id} returns total_count 0"

      - name: list_trips_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds: ["endpoints.GET /harbor/trips", "response_envelope.pagination_fields"]
        distinguishing_aspect: "With three trips on one service day, limit 2 offset 0 returns two rows, total_count 3 and has_more true; limit 2 offset 2 returns one row and has_more false."
        test_recipe:
          setup: ["Two docks with one stop each, one vessel, one crew member, ServiceDay 2026-09-12 at posture NORMAL, and three SCHEDULED trips at 14:00, 15:00 and 16:00."]
          setup_api_calls:
            - call: "POST /harbor/docks"
              payload: { name: "Pier One", berth_count: 2, min_turnaround_minutes: 15, landing_fee_per_pax_cents: 120, berth_minute_rate_cents: 40, monthly_fee_cap_cents: 1000000 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { dock_a_id: $.data.id }
            - call: "POST /harbor/docks/${dock_a_id}/stops"
              payload: { name: "Ferry Landing", zone_index: 1, charted_depth_m: 3.50 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { stop1_id: $.data.id }
            - call: "POST /harbor/docks"
              payload: { name: "Pier Two", berth_count: 1, min_turnaround_minutes: 0, landing_fee_per_pax_cents: 200, berth_minute_rate_cents: 60, monthly_fee_cap_cents: 1000000 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { dock_b_id: $.data.id }
            - call: "POST /harbor/docks/${dock_b_id}/stops"
              payload: { name: "Quay Two", zone_index: 2, charted_depth_m: 4.00 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { stop2_id: $.data.id }
            - call: "POST /harbor/vessels"
              payload: { name: "Osprey", seat_capacity: 40, draft_m: 1.20, hull_class: "OFFSHORE", required_endorsement: "MASTER_25T" }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { vessel_id: $.data.id }
            - call: "POST /harbor/crew-members"
              payload: { name: "K. Rowe", endorsement_class: "MASTER_100T", cert_expires_on: "2027-12-31", medical_expires_on: "2027-12-31" }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { crew_id: $.data.id }
            - call: "POST /harbor/service-days"
              payload: { service_date: "2026-09-12", wind_knots: 10.0, wave_height_m: 0.30, low_water_m: 2.10 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { day_id: $.data.id }
            - call: "POST /harbor/trips"
              payload: { service_day_id: "${day_id}", vessel_id: "${vessel_id}", master_crew_id: "${crew_id}", origin_stop_id: "${stop1_id}", destination_stop_id: "${stop2_id}", service_mode: "SCHEDULED", scheduled_departure_utc: "2026-09-12T14:00:00Z", scheduled_arrival_utc: "2026-09-12T14:25:00Z" }
              as: Dispatcher
              as_user_id: "disp-1"
            - call: "POST /harbor/trips"
              payload: { service_day_id: "${day_id}", vessel_id: "${vessel_id}", master_crew_id: "${crew_id}", origin_stop_id: "${stop1_id}", destination_stop_id: "${stop2_id}", service_mode: "SCHEDULED", scheduled_departure_utc: "2026-09-12T15:00:00Z", scheduled_arrival_utc: "2026-09-12T15:25:00Z" }
              as: Dispatcher
              as_user_id: "disp-1"
            - call: "POST /harbor/trips"
              payload: { service_day_id: "${day_id}", vessel_id: "${vessel_id}", master_crew_id: "${crew_id}", origin_stop_id: "${stop1_id}", destination_stop_id: "${stop2_id}", service_mode: "SCHEDULED", scheduled_departure_utc: "2026-09-12T16:00:00Z", scheduled_arrival_utc: "2026-09-12T16:25:00Z" }
              as: Dispatcher
              as_user_id: "disp-1"
          trigger:
            - call: "GET /harbor/trips"
              payload: { service_day_id: "${day_id}", limit: 2, offset: 0 }
              as: Dispatcher
              as_user_id: "disp-1"
            - call: "GET /harbor/trips"
              payload: { service_day_id: "${day_id}", limit: 2, offset: 2 }
              as: Dispatcher
              as_user_id: "disp-1"
          assert:
            - "the first trigger returns 2 items with total_count 3 and has_more true"
            - "the second trigger returns 1 item with total_count 3 and has_more false"
            - "response_type of both responses == array"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: depart_directly_from_scheduled_returns_trip_not_boarding
        claim_type: Invalid Transitions
        grounds: ["state_machines.Trip.BOARDING_to_DEPARTED", "errors[ERR_TRIP_NOT_BOARDING]", "validations[priority=10]"]
        distinguishing_aspect: |
          SCHEDULED is not a legal `from:` state for the depart trigger, so a trip that never boarded is
          rejected with ERR_TRIP_NOT_BOARDING and no fee posting or clock stamp occurs.
        test_recipe:
          setup:
            - "The standard 2026-09-12 harbour world with one SCHEDULED trip 14:00-14:25 that has never been boarded."
          setup_api_calls:
            - call: "POST /harbor/docks"
              payload: { name: "Pier One", berth_count: 2, min_turnaround_minutes: 15, landing_fee_per_pax_cents: 120, berth_minute_rate_cents: 40, monthly_fee_cap_cents: 1000000 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { dock_a_id: $.data.id }
            - call: "POST /harbor/docks/${dock_a_id}/stops"
              payload: { name: "Ferry Landing", zone_index: 1, charted_depth_m: 3.50 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { stop1_id: $.data.id }
            - call: "POST /harbor/docks"
              payload: { name: "Pier Two", berth_count: 1, min_turnaround_minutes: 0, landing_fee_per_pax_cents: 200, berth_minute_rate_cents: 60, monthly_fee_cap_cents: 1000000 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { dock_b_id: $.data.id }
            - call: "POST /harbor/docks/${dock_b_id}/stops"
              payload: { name: "Quay Two", zone_index: 2, charted_depth_m: 4.00 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { stop2_id: $.data.id }
            - call: "POST /harbor/vessels"
              payload: { name: "Osprey", seat_capacity: 40, draft_m: 1.20, hull_class: "OFFSHORE", required_endorsement: "MASTER_25T" }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { vessel_id: $.data.id }
            - call: "POST /harbor/crew-members"
              payload: { name: "K. Rowe", endorsement_class: "MASTER_100T", cert_expires_on: "2027-12-31", medical_expires_on: "2027-12-31" }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { crew_id: $.data.id }
            - call: "POST /harbor/vessels/${vessel_id}/inspections"
              payload: { inspection_type: "ANNUAL", result: "PASS", deficiency_count: 0, performed_on: "2026-08-01" }
              as: MarineInspector
              as_user_id: "insp-1"
            - call: "POST /harbor/service-days"
              payload: { service_date: "2026-09-12", wind_knots: 10.0, wave_height_m: 0.30, low_water_m: 2.10 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { day_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T13:00:00Z" }
              as: HarborAdmin
              as_user_id: "admin-1"
            - call: "POST /harbor/trips"
              payload: { service_day_id: "${day_id}", vessel_id: "${vessel_id}", master_crew_id: "${crew_id}", origin_stop_id: "${stop1_id}", destination_stop_id: "${stop2_id}", service_mode: "SCHEDULED", scheduled_departure_utc: "2026-09-12T14:00:00Z", scheduled_arrival_utc: "2026-09-12T14:25:00Z" }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { trip_id: $.data.id, trip_v: $.data.version }
          trigger:
            - call: "POST /harbor/trips/${trip_id}/depart"
              payload: {}
              as: VesselMaster
              as_user_id: "${crew_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_TRIP_NOT_BOARDING"
            - "HTTP status of the trigger == 409"
            - "Trip.${trip_id}.operational_status == SCHEDULED"
            - "Trip.${trip_id}.settlement_status == UNSETTLED"
            - "Trip.${trip_id}.actual_departure_utc == null"
      - name: board_a_trip_cancelled_by_the_posture_cascade_returns_trip_not_scheduled
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Trip.SCHEDULED_to_CANCELLED", "errors[ERR_TRIP_NOT_SCHEDULED]", "validations[priority=10]"]
        distinguishing_aspect: |
          CANCELLED is terminal on the movement axis: after the day is suspended the same board call that
          would have worked is rejected with ERR_TRIP_NOT_SCHEDULED, and the priority ladder answers the
          state error rather than ERR_SERVICE_SUSPENDED.
        test_recipe:
          setup:
            - "The standard 2026-09-12 harbour world with one SCHEDULED trip."
            - "The day has then been patched to manual_suspension true, so posture is SUSPENDED and the trip is CANCELLED with settlement VOID."
          setup_api_calls:
            - call: "POST /harbor/docks"
              payload: { name: "Pier One", berth_count: 2, min_turnaround_minutes: 15, landing_fee_per_pax_cents: 120, berth_minute_rate_cents: 40, monthly_fee_cap_cents: 1000000 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { dock_a_id: $.data.id }
            - call: "POST /harbor/docks/${dock_a_id}/stops"
              payload: { name: "Ferry Landing", zone_index: 1, charted_depth_m: 3.50 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { stop1_id: $.data.id }
            - call: "POST /harbor/docks"
              payload: { name: "Pier Two", berth_count: 1, min_turnaround_minutes: 0, landing_fee_per_pax_cents: 200, berth_minute_rate_cents: 60, monthly_fee_cap_cents: 1000000 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { dock_b_id: $.data.id }
            - call: "POST /harbor/docks/${dock_b_id}/stops"
              payload: { name: "Quay Two", zone_index: 2, charted_depth_m: 4.00 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { stop2_id: $.data.id }
            - call: "POST /harbor/vessels"
              payload: { name: "Osprey", seat_capacity: 40, draft_m: 1.20, hull_class: "OFFSHORE", required_endorsement: "MASTER_25T" }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { vessel_id: $.data.id }
            - call: "POST /harbor/crew-members"
              payload: { name: "K. Rowe", endorsement_class: "MASTER_100T", cert_expires_on: "2027-12-31", medical_expires_on: "2027-12-31" }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { crew_id: $.data.id }
            - call: "POST /harbor/vessels/${vessel_id}/inspections"
              payload: { inspection_type: "ANNUAL", result: "PASS", deficiency_count: 0, performed_on: "2026-08-01" }
              as: MarineInspector
              as_user_id: "insp-1"
            - call: "POST /harbor/service-days"
              payload: { service_date: "2026-09-12", wind_knots: 10.0, wave_height_m: 0.30, low_water_m: 2.10 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { day_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T13:00:00Z" }
              as: HarborAdmin
              as_user_id: "admin-1"
