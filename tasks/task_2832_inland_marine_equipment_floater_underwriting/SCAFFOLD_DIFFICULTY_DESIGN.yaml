  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: premium_balance_reconciles_after_endorsement_add_then_remove
        grounds:
          - calculations.endorsement_prorated_premium
          - calculations.policy_written_premium
          - calculations.coverage_part_equipment_premium
          - entities.Policy.fields.premium_balance_cents
          - entities.LedgerEntry.fields.entry_type
          - endpoints[DELETE /inland-marine/equipment-items/{id}]
        distinguishing_aspect: |
          Adding an item mid-term and endorsing it straight back off must leave
          premium_balance_cents at exactly its pre-endorsement 180251 with three
          PREMIUM ledger rows (+180251, +6721, -6721) rather than two or a net
          drift, and the compensation is asymmetric on purpose: the two ledger
          rows are 6721 each while written_premium_cents moved 180251 -> 189596 ->
          180251, a swing of 9345, because the expense load is re-applied to the
          written premium but never to the endorsement ledger amount.
        test_recipe:
          setup:
            - "Two PUBLISHED T2_URBAN rate cells: EXCAVATOR age band 0-5 base_rate_bp 180 grade A, and GENERATOR age band 6-12 base_rate_bp 120 grade C."
            - "One IN_FORCE Policy, T2_URBAN, 2026-08-01 to 2027-08-01, term_days 365, minimum_premium_cents 100000."
            - "One ACTIVE SCHEDULED_EQUIPMENT CoveragePart: ACV, SCHEDULED, deductible 100000, per_item_limit 20000000, aggregate_limit 200000000."
            - "One ACTIVE EquipmentItem E1 (EXCAVATOR, model_year 2022, original_cost 12000000): insured_value_cents 8160000, rated_premium_cents 173318."
            - "Bind produced one LedgerEntry {INITIAL_PREMIUM, PREMIUM, +180251}; Policy.premium_balance_cents is 180251 and written_premium_cents is 180251."
            - "Logical clock advanced to 2026-11-01T00:00:00Z, leaving 273 of the 365 term days unexpired."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
              as: Actuary
              captures: { rr_exc: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr_exc}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "GENERATOR", territory_code: "T2_URBAN", age_band_min_years: 6, age_band_max_years: 12, base_rate_bp: 120, theft_hazard_grade: "C" }
              as: Actuary
              captures: { rr_gen: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr_gen}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Ridgeline Contractors", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "E1 excavator", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", geo_tracker_installed: false, expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { item_e1: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/equipment-items/${item_e1}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
              as: UnderwritingManager
          trigger:
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v2: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "E2 generator", equipment_type: "GENERATOR", model_year: 2018, original_cost_cents: 2000000, ownership: "OWNED", geo_tracker_installed: false, expected_policy_version: "${pol_v2}" }
              as: Underwriter
              captures: { item_e2: $.data.id }
            - call: "DELETE /inland-marine/equipment-items/${item_e2}"
              payload: {}
              as: Underwriter
            - call: "GET /inland-marine/policies/${pol}/ledger-entries"
              payload: { ledger: "PREMIUM" }
              as: Underwriter
          assert:
            - "before trigger[0]: Policy.${pol}.premium_balance_cents == 180251 and written_premium_cents == 180251"
            - "after trigger[1]: EquipmentItem.${item_e2}.age_years_at_rating == 8 and insured_value_cents == 720000 and rated_premium_cents == 8986"
            - "after trigger[1]: CoveragePart.${cp}.rated_premium_cents == 182304"
            - "after trigger[1]: Policy.${pol}.written_premium_cents == 189596"
            - "after trigger[1]: a LedgerEntry {entry_type: ENDORSEMENT_PREMIUM, ledger: PREMIUM, amount_cents: 6721} exists (8986 * 273 / 365, load NOT re-applied)"
            - "after trigger[1]: Policy.${pol}.premium_balance_cents == 186972"
            - "after trigger[2]: EquipmentItem.${item_e2}.status == REMOVED and removed_at == 2026-11-01T00:00:00Z"
            - "after trigger[2]: a LedgerEntry {entry_type: ENDORSEMENT_RETURN, ledger: PREMIUM, amount_cents: -6721} exists"
            - "after trigger[2]: CoveragePart.${cp}.rated_premium_cents == 173318 (back to the pre-endorsement value)"
            - "after trigger[2]: Policy.${pol}.written_premium_cents == 180251 and premium_balance_cents == 180251"
            - "after trigger[2]: Policy.${pol}.total_insured_value_cents == 8160000"
            - "trigger[3] response: total_count == 3 and the three amount_cents sum to exactly 180251"
            - "invariant: Policy.premium_balance_cents == SUM(LedgerEntry.amount_cents WHERE ledger == PREMIUM) holds after every one of the four triggers"
            - "the ledger swung by 6721 in each direction while written_premium_cents swung by 9345, so the two figures cannot be conflated"
            - "EquipmentItem.${item_e1} is untouched: status ACTIVE, rated_premium_cents 173318"

      - name: part_aggregate_capacity_conserved_across_settlement_and_salvage
        grounds:
          - calculations.claim_settlement_amount
          - entities.CoveragePart.fields.aggregate_available_cents
          - entities.CoveragePart.fields.aggregate_paid_net_cents
          - entities.Claim.fields.salvage_credit_cents
          - state_machines.Claim.SETTLED_to_CLOSED
          - endpoints[POST /inland-marine/claims/{id}/salvage-recovery]
        distinguishing_aspect: |
          The identity aggregate_limit_cents == aggregate_available_cents +
          aggregate_paid_net_cents must hold at 200000000 before, between and
          after the two money-moving calls: settlement drives the pair to
          191940000 / 8060000 and salvage recovery of 1500000 restores it to
          193440000 / 6560000 - so salvage credits capacity back rather than
          merely recording proceeds, and Policy.incurred_loss_cents follows from
          8060000 down to 6560000.
        test_recipe:
          setup:
            - "One PUBLISHED T2_URBAN EXCAVATOR rate cell, age band 0-5, base_rate_bp 180, theft_hazard_grade A."
            - "One IN_FORCE Policy, T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 100000, written_premium_cents 180251."
            - "One ACTIVE SCHEDULED_EQUIPMENT CoveragePart: ACV, SCHEDULED, deductible 100000, per_item_limit 20000000, aggregate_limit 200000000, aggregate_available_cents 200000000, aggregate_paid_net_cents 0."
            - "One ACTIVE EquipmentItem E1, insured_value_cents 8160000."
            - "Logical clock at 2026-11-01T00:00:00Z."
            - "One Claim on E1, loss_date 2026-10-20, INSPECTED by user adj-1 with repair_estimate_cents 7000000 and actual_value_at_loss_cents 8160000, then adjusted TOTAL_LOSS by adj-1 so adjustment_status is TOTAL_LOSS_DECLARED, salvage_status is PENDING and total_loss_basis_settlement_cents is 8060000."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
              as: Actuary
              captures: { rr_exc: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr_exc}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Ridgeline Contractors", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "E1 excavator", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", geo_tracker_installed: false, expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { item_e1: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/equipment-items/${item_e1}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
              as: UnderwritingManager
            - call: "POST /inland-marine/policies/${pol}/claims"
              payload: { coverage_part_id: "${cp}", loss_date: "2026-10-20", loss_type: "FIRE", equipment_item_id: "${item_e1}" }
              as: Underwriter
              captures: { clm: $.data.id }
            - call: "POST /inland-marine/claims/${clm}/inspect"
              payload: { repair_estimate_cents: 7000000, actual_value_at_loss_cents: 8160000 }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /inland-marine/claims/${clm}/adjust"
              payload: { adjustment_basis: "TOTAL_LOSS" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          trigger:
            - call: "POST /inland-marine/claims/${clm}/settle"
              payload: {}
              as: UnderwritingManager
              as_user_id: "mgr-1"
            - call: "POST /inland-marine/claims/${clm}/salvage-recovery"
              payload: { salvage_proceeds_cents: 1500000 }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "GET /inland-marine/claims/${clm}/ledger-entries"
              payload: {}
              as: Underwriter
          assert:
            - "before trigger[0]: CoveragePart.${cp}.aggregate_available_cents == 200000000 and aggregate_paid_net_cents == 0 (sum 200000000)"
            - "before trigger[0]: Claim.${clm}.valuation_at_loss_cents == 8160000 and total_loss_basis_settlement_cents == 8060000 and settlement_amount_cents == 8060000"
            - "before trigger[0]: Claim.${clm}.adjustment_status == TOTAL_LOSS_DECLARED and salvage_status == PENDING"
            - "after trigger[0]: Claim.${clm}.adjustment_status == SETTLED (not CLOSED, because the salvage axis is still PENDING) and settlement_paid_cents == 8060000"
            - "after trigger[0]: CoveragePart.${cp}.aggregate_available_cents == 191940000 and aggregate_paid_net_cents == 8060000 (sum 200000000)"
            - "after trigger[0]: EquipmentItem.${item_e1}.status == TOTALED"
            - "after trigger[0]: Policy.${pol}.incurred_loss_cents == 8060000"
            - "after trigger[1]: Claim.${clm}.salvage_proceeds_cents == 1500000 and salvage_credit_cents == 1500000 and salvage_status == RECOVERED"
            - "after trigger[1]: Claim.${clm}.adjustment_status == CLOSED (both axes joined)"
            - "after trigger[1]: CoveragePart.${cp}.aggregate_available_cents == 193440000 and aggregate_paid_net_cents == 6560000 (sum 200000000)"
            - "after trigger[1]: Policy.${pol}.incurred_loss_cents == 6560000"
            - "trigger[2] response: total_count == 2, one {CLAIM_SETTLEMENT, LOSS, 8060000} and one {SALVAGE_RECOVERY, LOSS, -1500000}, summing to 6560000"
            - "invariant: CoveragePart.aggregate_limit_cents == aggregate_available_cents + aggregate_paid_net_cents == 200000000 before, between and after both triggers"
            - "invariant: Policy.incurred_loss_cents == SUM(LedgerEntry.amount_cents WHERE ledger == LOSS) at every step"
            - "Policy.${pol}.premium_balance_cents stays 180251: loss activity never touches the PREMIUM ledger"
