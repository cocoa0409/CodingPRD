          The request violates three rules at once - the order is already SCHEDULED (state, priority
          24), the requested window overlaps an existing BOOKED slot on the same device once the
          15-minute buffer is applied (business_temporal, priority 58), and the patient already has a
          BOOKED appointment on the same UTC calendar date (priority 59). Only the lowest priority
          number may surface, so the response must be ERR_ORDER_NOT_SCHEDULABLE and never
          ERR_DEVICE_SLOT_CONFLICT or ERR_PATIENT_DOUBLE_BOOKED.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-02T08:00:00Z."
            - "One ACTIVE Densitometer with appointment_buffer_minutes 15 and daily_scan_capacity 12."
            - "Patient MRN-1101 with order O1 already booked as A1 on 2026-03-10T09:00:00Z-09:30:00Z, so O1.status is SCHEDULED."
