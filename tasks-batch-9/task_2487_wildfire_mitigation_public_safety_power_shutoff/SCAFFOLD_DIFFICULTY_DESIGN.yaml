              as: GridPlanner
            - call: "POST /customers"
              payload: { account_number: "ACC-C1", circuit_id: "${charlie_id}", customer_class: "RESIDENTIAL", medical_baseline: false, preferred_language: "EN", notification_channels: ["EMAIL"], accessibility_needs: [], address_zone_code: "Z4" }
              as: GridPlanner
            - call: "POST /psps-events"
              payload: { event_code: "EV-1", trigger_fire_potential_index_id: "${fpi_fc_id}", forecast_onset_at: "2026-08-15T18:00:00Z", forecast_all_clear_at: "2026-08-16T18:00:00Z" }
              as: PSPSDutyOfficer
