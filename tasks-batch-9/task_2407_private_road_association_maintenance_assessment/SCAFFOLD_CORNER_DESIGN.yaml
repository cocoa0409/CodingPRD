      - name: paving_award_is_conditional_on_a_compliant_segment_and_a_funded_reserve
        claim_type: conditional_action
        grounds:
          - endpoints[POST /maintenance-projects/{project_id}/award]
          - validations[priority=28]
          - validations[priority=56]
          - calculations.project_reserve_draw
        distinguishing_aspect: "The same award endpoint carries different preconditions per category: a PAVING award first fails on an UNKNOWN access grade, then fails again with ERR_INSUFFICIENT_RESERVE once the segment is COMPLIANT because the 500,000-cent draw exceeds a zero reserve, while a GRADING award on that same segment succeeds with reserve_draw_cents 0."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one Association with reserve_balance_cents 0; one 1600-foot RoadSegment left at emergency_access_grade UNKNOWN; a PAVING project for window 2026-09-01..2026-09-10 created by rc-1 with a single bonded bid of 500,000 (below the three-bid threshold)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RoadCommissioner
              as_user_id: "rc-1"
            - call: "POST /associations"
              payload: { name: "Blacktop Road Association", reserve_target_cents: 1000000 }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Blacktop Main", length_feet: 1600, width_feet: 22, max_grade_pct: 8, surface_type: "GRAVEL", turnout_count: 1, turnaround_present: true, bridge_present: false, culvert_count: 2 }
              as: RoadCommissioner
              as_user_id: "rc-1"
              captures: { seg_id: $.data.id }
            - call: "POST /maintenance-projects"
              payload: { road_segment_id: "${seg_id}", category: "PAVING", window_start_date: "2026-09-01", window_end_date: "2026-09-10" }
              as: RoadCommissioner
              as_user_id: "rc-1"
              captures: { pave_id: $.data.id, pave_v: $.data.version }
            - call: "POST /maintenance-projects/${pave_id}/contractor-bids"
              payload: { contractor_name: "Basin Paving LLC", amount_cents: 500000, bond_on_file: true, expected_project_version: "${pave_v}" }
              as: Contractor
              as_user_id: "c-1"
              captures: { pave_bid: $.data.id }
          trigger:
            - call: "POST /maintenance-projects/${pave_id}/award"
              payload: { bid_id: "${pave_bid}" }
              as: RoadCommissioner
              as_user_id: "rc-2"
              captures: { err_access: $.data.error_id }
            - call: "POST /road-segments/${seg_id}/access-inspections"
              payload: { inspected_at: "2026-08-02T00:00:00Z", measured_width_feet: 22, measured_max_grade_pct: 8, measured_turnout_count: 1, turnaround_present: true }
              as: RoadCommissioner
              as_user_id: "rc-1"
            - call: "POST /maintenance-projects/${pave_id}/award"
              payload: { bid_id: "${pave_bid}" }
              as: RoadCommissioner
              as_user_id: "rc-2"
              captures: { err_reserve: $.data.error_id }
            - call: "POST /maintenance-projects"
              payload: { road_segment_id: "${seg_id}", category: "GRADING", window_start_date: "2026-09-15", window_end_date: "2026-09-18" }
              as: RoadCommissioner
              as_user_id: "rc-1"
              captures: { grade_id: $.data.id, grade_v: $.data.version }
            - call: "POST /maintenance-projects/${grade_id}/contractor-bids"
              payload: { contractor_name: "Basin Grading LLC", amount_cents: 400000, bond_on_file: true, expected_project_version: "${grade_v}" }
              as: Contractor
              as_user_id: "c-1"
              captures: { grade_bid: $.data.id }
            - call: "POST /maintenance-projects/${grade_id}/award"
              payload: { bid_id: "${grade_bid}" }
              as: RoadCommissioner
              as_user_id: "rc-2"
          assert:
            - "the first PAVING award returns HTTP 409 with error_id ERR_EMERGENCY_ACCESS_DEFICIENT because emergency_access_grade is UNKNOWN, which is not COMPLIANT"
            - "the inspection returns HTTP 200 with emergency_access_grade COMPLIANT, required_turnouts 1 (max(0, ceil(1600/800) - 1)) and last_inspection_at 2026-08-02T00:00:00Z"
            - "the second PAVING award returns HTTP 409 with error_id ERR_INSUFFICIENT_RESERVE, since the draw of 500000 (no funding proposal) exceeds reserve_balance_cents 0"
            - "the PAVING project still reads status BID_SOLICITATION with awarded_bid_id null, awarded_amount_cents 0 and reserve_draw_cents 0, and its bid is still SUBMITTED"
            - "the GRADING award returns HTTP 200 with status AWARDED, awarded_amount_cents 400000, reserve_draw_cents 0 and awarded_by_user_id rc-2: the reserve gate is vacuous for operating categories"
            - "the association still reads reserve_balance_cents 0 and reserve_posture UNDERFUNDED"

      - name: release_action_endpoint_voids_an_initiated_notice_without_touching_the_charge
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /delinquency-actions/{action_id}/release]
