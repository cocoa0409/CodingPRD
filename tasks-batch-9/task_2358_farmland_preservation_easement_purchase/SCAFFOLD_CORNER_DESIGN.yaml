            - *k_plan_a
            - *k_clk_1012
          trigger:
            - call: "GET /funding-sources/${src_local_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - *k_accept_a
            - call: "GET /funding-sources/${src_local_id}"
