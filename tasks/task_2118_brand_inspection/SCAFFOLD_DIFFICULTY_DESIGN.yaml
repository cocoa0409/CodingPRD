        grounds:
          - state_machines.InspectionOrder.fee_status.ASSESSED_to_UNASSESSED
          - state_machines.InspectionOrder.fee_status.UNASSESSED_to_ASSESSED
          - calculations.owner_arrears_and_standing
          - entities.Owner.fields.projected_arrears_cents
          - entities.InspectionOrder.fields.assessed_fee_cents
        distinguishing_aspect: |
          The conserved quantity is money: Owner.projected_arrears_cents must equal the sum of
          assessed_fee_cents over that owner's orders with fee_status IN {ASSESSED, DELINQUENT} at
          every instant, so completing order 1 raises it from 2500 to 9950 and voiding that same
          assessment must return it to exactly 2500 with zero drift.
