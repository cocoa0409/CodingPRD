            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/material-events"
              payload: { category: "LITIGATION_JUDGMENT", occurred_utc: "2026-07-30T12:00:00Z", discovered_utc: "2026-08-03T09:00:00Z", magnitude_amount: 499000, description: "Adverse trial court judgment, appeal filed." }
              as: LegalCounsel
              as_user_id: "${legal_id}"
              captures: { ev_a_id: $.data.id, sev_a: $.data.severity_score }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/material-events"
              payload: { category: "IMPAIRMENT", occurred_utc: "2026-07-30T12:00:00Z", discovered_utc: "2026-08-03T09:00:00Z", magnitude_amount: 500000, description: "Retail segment goodwill impairment indicator." }
              as: LegalCounsel
              as_user_id: "${legal_id}"
              captures: { ev_b_id: $.data.id, sev_b: $.data.severity_score }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/material-events"
              payload: { category: "DEBT_COVENANT_BREACH", occurred_utc: "2026-07-30T12:00:00Z", discovered_utc: "2026-08-03T09:00:00Z", magnitude_amount: 501000, description: "Leverage covenant breached at quarter end." }
              as: LegalCounsel
              as_user_id: "${legal_id}"
              captures: { ev_c_id: $.data.id, sev_c: $.data.severity_score }
            - call: "GET /disclosure/reporting-cycles/${cycle_id}"
