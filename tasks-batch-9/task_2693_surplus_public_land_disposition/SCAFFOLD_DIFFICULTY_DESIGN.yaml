  - rule_id: transitive_cascade
    instances:
      - name: close_bidding_failure_cascades_offering_declaration_appraisal_parcel
        grounds:
          - state_machines.DispositionOffering.OPEN_to_FAILED_NO_QUALIFYING_BID
          - state_machines.SurplusDeclaration.OFFERING_AUTHORIZED_to_UNSUCCESSFUL
          - state_machines.Appraisal.ACCEPTED_to_SUPERSEDED
          - calculations.parcel_disposition_readiness
          - calculations.award_selection
        distinguishing_aspect: |
          Trigger is POST /offerings/{id}/close-bidding and the cascade depth is 4:
          the offering reaches FAILED_NO_QUALIFYING_BID (link 1), which forces
          SurplusDeclaration OFFERING_AUTHORIZED -> UNSUCCESSFUL with reoffer_count
          1 (link 2), which supersedes the ACCEPTED Appraisal with
          revaluation_required true (link 3), which flips Parcel.valuation_status
          CURRENT -> STALE and disposition_ready true -> false (link 4) - and no
          request field of close-bidding names the parcel, the appraisal or the
          declaration.
        test_recipe:
          setup:
            - "One custodian Agency and one TRANSIT Agency that DECLINES its notice, so no PreferenceOffer exists."
            - "One Parcel with book_value_cents 70000000, one TitleCurativeItem resolved CURED at 250000 and an ACCEPTED Appraisal at 100000000 with expires_on 2027-08-01T00:00:00Z, so valuation_status is CURRENT and disposition_ready is true."
            - "A SurplusDeclaration in OFFERING_AUTHORIZED for COMPETITIVE_SALE with an EXEMPT CERTIFIED EnvironmentalReview and reoffer_count 0."
            - "A published COMPETITIVE_SALE offering over [2026-08-01T00:00:00Z, 2026-12-31T00:00:00Z) with minimum_price_cents 99750000 and required_deposit_cents 4987500."
            - "One bid of amount_cents 105000000 and deposit_amount_cents 4987500 from a bidder funded 10000000, whose debarment_status was then set to DEBARRED, so the qualifying candidate set will be empty."
            - "The logical clock advanced to 2026-12-31T00:00:00Z, exactly bid_close_at."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "City of Riverbend", agency_type: "MUNICIPAL", contact_email: "realproperty@riverbend.gov" }
              as: SystemAdministrator
