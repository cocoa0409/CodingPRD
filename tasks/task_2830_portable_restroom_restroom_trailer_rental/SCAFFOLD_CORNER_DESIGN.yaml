      - name: requests_with_a_missing_or_unknown_role_header_are_unauthenticated
        claim_type: unauthenticated_denial
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - roles
        distinguishing_aspect: "The 401 check runs at priority 1, ahead of the 403 role check, so a request with no X-User-Role, with an unknown role string, or with no X-User-ID must return ERR_UNAUTHENTICATED even when the URL is one the caller could never be authorised for anyway."
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z. One account so that a legitimate follow-up read has something to return."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rental-accounts"
              payload: { legal_name: "Sentinel Baseline Co", account_type: "EVENT", credit_terms_days: 15 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "GET /rental-accounts/${acct_id}"
              payload: {}
              as: NONE
              captures: { e_no_role: $.data.error_id }
            - call: "GET /rental-accounts/${acct_id}"
              payload: {}
              as: SuperUser
              captures: { e_unknown_role: $.data.error_id }
            - call: "POST /rental-accounts"
              payload: { legal_name: "Ghost Co", account_type: "EVENT", credit_terms_days: 15 }
              as: NONE
              captures: { e_write_no_role: $.data.error_id }
            - call: "GET /rental-accounts/${acct_id}"
              payload: {}
              as: PlatformAdmin
              captures: { baseline_name: $.data.legal_name }
          assert:
            - "the first call omits the X-User-Role header entirely: ${e_no_role} == ERR_UNAUTHENTICATED with HTTP 401"
            - "the second call sends X-User-Role: SuperUser, which is not one of the seven declared roles: ${e_unknown_role} == ERR_UNAUTHENTICATED with HTTP 401, not 403"
            - "a request that also omits X-User-ID returns ERR_UNAUTHENTICATED (401)"
            - "${e_write_no_role} == ERR_UNAUTHENTICATED (401) — priority 1 precedes the priority 2 role check and the priority 3 shape check on a write"
            - "${baseline_name} == Sentinel Baseline Co — the same URL served correctly to an authenticated PlatformAdmin, so the three 401s were caused by the headers alone and the refused write persisted nothing"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_expected_contract_version_on_a_requote_returns_stale_contract_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[quote-supersede-stale-contract]
          - endpoints["POST /rental-contracts/{id}/quote"]
          - state_machines.RentalContract.QUOTED_to_QUOTED
          - errors[ERR_STALE_CONTRACT_VERSION]
        distinguishing_aspect: "The OCC field is checked against the contract's CURRENT stored version, and a rejected write must not itself bump that version — so replaying the very first version token after one successful quote is a 412, and the token that the successful quote returned still works afterwards."
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z. Account, placeable site, CONSTRUCTION contract 60 / freq 2 / ada true in DRAFT at version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rental-accounts"
              payload: { legal_name: "Larkspur Infrastructure", account_type: "CONSTRUCTION", credit_terms_days: 30 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /service-sites"
              payload: { account_id: "${acct_id}", site_label: "Larkspur Reach", jurisdiction_code: "CO-DE-CITY", access_class: "OPEN_LOT", right_of_way_required: false, gate_open_minute: 360, gate_close_minute: 1080, max_truck_length_ft: 40 }
              as: SalesRep
              captures: { site_id: $.data.id }
            - call: "POST /placement-permits"
              payload: { site_id: "${site_id}", permit_kind: "PLACEMENT", authority_ref: "PL-12201", effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: PermitCoordinator
              captures: { permit_id: $.data.id }
            - call: "POST /placement-permits/${permit_id}/submit"
              payload: {}
              as: PermitCoordinator
            - call: "POST /placement-permits/${permit_id}/approve"
              payload: { authority_decision_ref: "AD-12201" }
              as: ComplianceOfficer
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", site_id: "${site_id}", contract_kind: "CONSTRUCTION", term_start: "2026-08-03", term_end: "2026-09-30", headcount: 60, event_duration_hours: 8, service_frequency_per_week: 2, season_code: "SHOULDER", construction_phase: "VERTICAL", ada_required: true }
              as: SalesRep
              captures: { contract_id: $.data.id, c_v1: $.data.version }
            - call: "POST /rental-contracts/${contract_id}/quote"
              payload: { expected_contract_version: "${c_v1}" }
              as: SalesRep
              captures: { c_v2: $.data.version, quoted_1: $.data.quoted_cents }
          trigger:
            - call: "POST /rental-contracts/${contract_id}/quote"
              payload: { expected_contract_version: "${c_v1}", quote_note: "replaying a stale view" }
              as: SalesRep
              captures: { e_stale: $.data.error_id }
            - call: "GET /rental-contracts/${contract_id}"
              payload: {}
              as: SalesRep
              captures: { v_after_412: $.data.version, quoted_after_412: $.data.quoted_cents }
            - call: "GET /rental-contracts/${contract_id}/quote-lines"
              payload: { is_superseded: false }
              as: SalesRep
              captures: { live_lines_after_412: $.data }
            - call: "POST /rental-contracts/${contract_id}/quote"
              payload: { expected_contract_version: "${c_v2}", quote_note: "fresh view" }
              as: SalesRep
              captures: { c_v3: $.data.version, quoted_2: $.data.quoted_cents }
            - call: "GET /rental-contracts/${contract_id}/quote-lines"
              payload: { is_superseded: true }
              as: SalesRep
              captures: { dead_lines: $.data }
          assert:
            - "${c_v2} == ${c_v1} + 1 and ${quoted_1} == 181500 (9 STANDARD + 1 ADA + 3 HANDWASH)"
            - "${e_stale} == ERR_STALE_CONTRACT_VERSION with HTTP 412"
            - "${v_after_412} == ${c_v2} — a rejected write does NOT bump the version, which is what makes ${c_v2} still usable"
            - "${quoted_after_412} == 181500 and ${live_lines_after_412} has length 3 — the refused requote superseded nothing"
            - "${c_v3} == ${c_v2} + 1 and ${quoted_2} == 181500 — the identical payload with the current token succeeds"
            - "${dead_lines} has length 3 — exactly one supersede happened across the whole recipe, not two"

      - name: stale_expected_route_version_on_a_second_manifest_seal_returns_stale_route_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[manifest-seal-stale-route]
          - endpoints["POST /waste-manifests/{id}/seal"]
          - state_machines.WasteManifest.OPEN_to_SEALED
          - errors[ERR_STALE_ROUTE_VERSION]
        distinguishing_aspect: "Two manifests are opened against the same route while it is at one version; the first seal bumps Route.version, so the second seal's token — captured before either seal — is stale and must 412 even though every other seal precondition still holds, and the refused seal must not bump the version a second time."
        test_recipe:
          setup:
