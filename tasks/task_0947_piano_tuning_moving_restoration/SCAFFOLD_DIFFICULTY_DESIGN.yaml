            - "One client, one ZONE_A location, one UPRIGHT instrument assessed at TIER_0 so appointment estimated_price_cents is 19500."
            - "One APPRENTICE technician serving ZONE_A holds two route days, 2026-05-03 and 2026-05-04."
            - "The instrument holds one stop on each day: 2026-05-03T23:59:00Z (71.983 hours out) and 2026-05-04T00:00:00Z (exactly 72 hours out)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Ember House", email: "ember@example.com", phone: "555-0210", home_zone_code: "ZONE_A", client_type: "INDIVIDUAL" }
