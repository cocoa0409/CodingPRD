            - { call: "GET /clinic-accounts/${c}", payload: {}, as: QASupervisor }
            - { call: "GET /clinic-accounts/${c}/providers", payload: {}, as: QASupervisor }
            - { call: "GET /clinic-accounts/${c}/sla-policies", payload: {}, as: QASupervisor }
            - { call: "GET /providers/${p}", payload: {}, as: QASupervisor }
            - { call: "GET /dictation-jobs?provider_id=${p}", payload: {}, as: QASupervisor }
