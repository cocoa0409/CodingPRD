              payload: { variant: "FINAL" }
              as: ContractManager
          assert:
            - "FINAL breakdown billable_line_count == 2"
            - "FINAL breakdown linehaul_cents == 1648749"
            - "FINAL breakdown linehaul_cents != 1648750 - summing raw line values and rounding once is the wrong order"
            - "FINAL breakdown fuel_surcharge_cents == 74194"

      - name: volume_rebate_tier_keyed_on_subtotal_not_on_post_rebate_total
        grounds:
          - calculations.contract_total_charge
          - calculations.linehaul_freight_charge
          - calculations.fuel_surcharge_assessment
          - entities.FreightContract.fields.subtotal_cents
          - entities.FreightContract.fields.volume_rebate_cents
          - state_machines.FreightContract.NOT_BILLED_to_INVOICED
        distinguishing_aspect: |
          Mode (c) - a formula that reads circular and is disambiguated only by a
          pinned evaluation order. On a 1052-mile haul the subtotal is 5051340,
          which sits in the 3.0 percent rebate tier and yields a 151540 rebate and a
          4899800 total; because the total falls below 5000000, keying the tier on
          the post-rebate total instead would drop to 1.5 percent and produce 4977843.
          Only subtotal-keyed evaluation gives 4899800.
        test_recipe:
          setup:
            - "Same reference data, but the contract runs river mile 1252 -> 200, a 1052-mile haul, so the two outturn lines are 2196753 and 2139458 cents."
            - "Both barges discharged with the same timestamps as the two-barge movement, giving a FINAL pooled-net demurrage of 520000 cents."
            - "Contract movement_status DISCHARGED, billing_status NOT_BILLED, shipper version read immediately before the invoice."
