  - section: endpoints
    note: "Table-5 patterns over the 61-endpoint surface: partial-update CRUD with version bumping, list filtering where two filters interact, the accept fan-out that links an escrow and one LicenseTransfer per required permit, the derived-instant read after close, the DENIED -> APPLIED conditional retry edge, and the one-shot qualify action."
    instances:

      - name: patch_listing_updates_only_the_named_fields_and_bumps_the_version
        claim_type: standard_crud
        grounds:
          - "endpoints[PATCH /route-listings/{id}]"
          - "entities.RouteListing.fields.asking_price_cents"
          - "errors.ERR_INVALID_LISTING_TRANSITION"
          - "validations[priority=30]"
        distinguishing_aspect: "PATCH is a partial update, not a replace: a body carrying only asking_price_cents leaves listed_mrr_cents, listed_account_count and the exclusivity window exactly as they were while still incrementing version -- and the same body is refused once the listing is WITHDRAWN, so the verb is state-gated too."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; AZ profile, ACTIVE seller, APPROVED buyer."
            - "DRAFT listing PHX-NE: asking_price_cents 460000, listed_mrr_cents 43000, listed_account_count 3, exclusivity [2026-08-01, 2026-11-01), version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
            - call: "POST /state-license-profiles"
              payload: {"state_code": "AZ", "required_permit_types": ["PESTICIDE_APPLICATOR", "BUSINESS_TAX"], "reciprocity_states": ["NV"], "transfer_processing_days": 21, "cooling_off_days": 14, "provisional_operation_allowed": false}
              as: PlatformAdmin
              captures: {"az_profile_id": "$.data.id"}
            - call: "POST /sellers"
              payload: {"legal_name": "Sun Valley Pools LLC", "state_code": "AZ", "license_number": "AZ-PA-1001"}
              as: Broker
              captures: {"seller_id": "$.data.id"}
            - call: "POST /buyers"
              payload: {"legal_name": "Desert Blue Route Co", "state_code": "AZ", "license_status": "LICENSED", "prequalified_amount_cents": 30000000}
