      - name: warranty_claim_one_second_past_the_component_window_is_refused
        claim_type: error_triggerable
        grounds:
          - validations[priority 37]
          - errors[ERR_WARRANTY_PERIOD_EXPIRED]
          - calculations.warranty_charge_and_window.variants
          - entities.ConversionProject.fields.warranty_start_at
          - endpoints[POST /conversion-projects/{id}/warranty-claims]
        distinguishing_aspect: "The window test is INCLUSIVE at the expiry instant and its length is
          selected per component, so at exactly warranty_start_at + 62,208,000 s the non-structural ROOF
          claim is still admissible, one second later it is refused, and at that same later instant the
          structural FOUNDATION claim (155,520,000 s window) is still accepted. An implementation that uses
          a strict comparison, or one window for all components, diverges on one of these three calls."
        test_recipe:
          setup:
            - "Golden path as far as a RECORDED declaration (so ConversionProject.warranty_start_at ==
              2026-08-01T00:00:00Z) with two VERIFIED components: a non-structural ROOF and a structural
              FOUNDATION."
          setup_api_calls:
            - call: "POST /conversion-projects"
              payload: { building_address: "44 Cove Lane, Bangor ME", year_built: 1968, total_unit_count: 2, sponsor_user_id: "sponsor-1" }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { proj_id: "$.data.id" }
            - call: "POST /conversion-projects/${proj_id}/engineering-reports"
              payload: { report_label: "ER-1", inspection_date: "2026-07-10T00:00:00Z", submitted_by_user_id: "eng-1" }
              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { er_id: "$.data.id" }
            - call: "POST /engineering-reports/${er_id}/major-components"
              payload: { component_type: "ROOF", remaining_useful_life_years: 30, effective_age_years: 10, replacement_cost_cents: 10000000, funded_pct_bp: 0, condition_rating: "EXCELLENT" }
              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { mc_id: "$.data.id" }
            - call: "POST /engineering-reports/${er_id}/major-components"
              payload: { component_type: "FOUNDATION", remaining_useful_life_years: 50, effective_age_years: 10, replacement_cost_cents: 8000000, funded_pct_bp: 0, condition_rating: "EXCELLENT", is_structural: true }
              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { mc_struct: "$.data.id" }
            - call: "POST /engineering-reports/${er_id}/submit"
              payload: {}
              as: LicensedEngineer
              as_user_id: "eng-1"
            - call: "POST /major-components/${mc_id}/verification"
              payload: { verified: true }
              as: PeerReviewEngineer
              as_user_id: "peer-1"
            - call: "POST /major-components/${mc_struct}/verification"
              payload: { verified: true }
              as: PeerReviewEngineer
              as_user_id: "peer-1"
            - call: "POST /engineering-reports/${er_id}/peer-review-decisions"
              payload: { decision: "ACCEPT", reviewed_by_user_id: "peer-1" }
              as: PeerReviewEngineer
              as_user_id: "peer-1"
            - call: "GET /engineering-reports/${er_id}"
              payload: {}
              as: PeerReviewEngineer
              as_user_id: "peer-1"
              captures: { er_v: "$.data.version" }
            - call: "POST /engineering-reports/${er_id}/suitability-assessments"
              payload: { variant: "AS_INSPECTED", expected_engineering_report_version: "${er_v}" }
              as: PeerReviewEngineer
              as_user_id: "peer-1"
              captures: { sa_id: "$.data.id" }
            - call: "POST /conversion-projects/${proj_id}/declaration-packages"
              payload: { declaration_text_ref: "decl-1", bylaws_text_ref: "bylaws-1", boundary_convention: "PAINT_TO_PAINT" }
