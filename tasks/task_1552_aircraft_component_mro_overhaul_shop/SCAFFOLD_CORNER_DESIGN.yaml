        excluded_because:
          difficulty_instance: ber_estimate_exactly_at_threshold_is_ber
          rationale: "The difficulty instance asserts both legs: exactly-at-threshold is BER and one-cent-below (6499999) is not."
      - name: tat_penalty_cap_binds_on_huge_delay
        claim_type: constants_applied
        grounds: [calculations.tat_penalty_calc, entities.Customer.fields.tat_penalty_cap_pct]
        distinguishing_aspect: "Cap branch of the min(): elapsed 999h, zero delay, excess 899h * 5000 = 4495000 raw exceeds the 50% cap on the 2400000 subtotal, so penalty is exactly 1200000 and the invoice total equals 1200000."
        test_recipe:
          setup: ["ADJUSTED customer (100h/5000ph/50% cap); OVERHAUL work order approved immediately (delay 0); one 4h booking 2026-09-11T11:00:00Z-15:00:00Z; test at 2026-09-11T14:00:00Z inside the window; release at 14:00 (elapsed 998h)"]
