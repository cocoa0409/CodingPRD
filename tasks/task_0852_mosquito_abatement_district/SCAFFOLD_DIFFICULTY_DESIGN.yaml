              as: DistrictAdmin
              captures: { tech_id: $.data.id }
            - call: "GET /service-areas/${area_id}"
              payload: {}
              as: VectorEcologist
              as_user_id: "u-eco-1"
              captures: { area_v: $.data.version }
            - call: "POST /service-areas/${area_id}/risk-assessments"
              payload: { as_of_date: "2026-06-01", expected_service_area_version: "${area_v}" }
              as: VectorEcologist
              as_user_id: "u-eco-1"
              captures: { ra_id: $.data.id }
            - call: "POST /risk-assessments/${ra_id}/confirm"
              payload: {}
              as: VectorEcologist
              as_user_id: "u-eco-1"
            - call: "POST /pesticide-products"
              payload: { name: "VectoBac 12AS", epa_reg_no: "EPA-202", active_ingredient: "BTI", application_method: "LARVICIDE", label_rate_ml_per_acre: 100.0, reentry_interval_hours: 4, cost_cents_per_liter: 4000, received_total_ml: 100000.0 }
              as: DistrictAdmin
              captures: { prod_id: $.data.id, on_hand_before: $.data.on_hand_ml }
            - call: "POST /treatment-plans"
              payload: { service_area_id: "${area_id}", trigger_assessment_id: "${ra_id}", treatment_type: "LARVICIDE" }
              as: VectorEcologist
              as_user_id: "u-eco-1"
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/routes"
              payload: { applicator_id: "${tech_id}", pesticide_product_id: "${prod_id}", route_code: "R-1", window_start: "2026-06-05T09:00:00.000Z", window_end: "2026-06-05T12:00:00.000Z", planned_acres: 1.0, center_x_m: 20000, center_y_m: 20000, swath_radius_m: 0 }
              as: VectorEcologist
              as_user_id: "u-eco-1"
              captures: { route_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/transitions"
              payload: { action: "SUBMIT" }
              as: VectorEcologist
              as_user_id: "u-eco-1"
            - call: "POST /treatment-plans/${plan_id}/transitions"
              payload: { action: "APPROVE" }
              as: AbatementManager
              as_user_id: "u-mgr-1"
          trigger:
            - call: "POST /treatment-routes/${route_id}/transitions"
              payload: { action: "COMMIT" }
              as: AbatementManager
              as_user_id: "u-mgr-1"
            - call: "GET /pesticide-products/${prod_id}"
              payload: {}
              as: AbatementManager
              as_user_id: "u-mgr-1"
              captures: { on_hand_committed: $.data.on_hand_ml, committed_mid: $.data.committed_ml }
            - call: "POST /treatment-routes/${route_id}/transitions"
              payload: { action: "RELEASE" }
              as: AbatementManager
              as_user_id: "u-mgr-1"
          assert:
            - "${on_hand_before} == 100000.00"
            - "${on_hand_committed} == 99900.00"
            - "${committed_mid} == 100.00"
            - "PesticideProduct.${prod_id}.on_hand_ml == 100000.00"
            - "PesticideProduct.${prod_id}.committed_ml == 0.00"
            - "PesticideProduct.${prod_id}.applied_ml == 0.00"
            - "PesticideProduct.${prod_id}.received_total_ml == 100000.00"
            - "TreatmentRoute.${route_id}.status == RELEASED"
            - "TreatmentPlan.${plan_id}.estimated_total_ml == 0.00"
            - "Applicator.${tech_id}.assigned_route_count == 0"
            - "ServiceArea.${area_id}.seasonal_application_count == 0"

      - name: service_request_case_count_partition_unchanged_by_resolve_then_reopen
        grounds:
          - calculations.service_request_count_partition
          - state_machines.ServiceRequest.INSPECTED_to_RESOLVED
          - state_machines.ServiceRequest.RESOLVED_to_TRIAGED
          - entities.ServiceArea.fields.request_total_count
          - entities.ServiceArea.fields.request_open_count
        distinguishing_aspect: |
          Conserved quantity #2 is a COUNT PARTITION rather than a material volume:
          request_open_count + request_resolved_count + request_closed_count must equal
          request_total_count (3) both before the compensating REOPEN (1 + 1 + 1) and
          after it (2 + 0 + 1), so the bucket contents move while the total never does.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00.000Z; ServiceArea NW1 with NORMAL posture and one ACTIVE applicator."
            - "Request A filed, triaged PRIORITY, assigned, inspected FIELD_CONFIRMED and RESOLVED."
            - "Request B filed and left in RECEIVED."
            - "Request C filed and CLOSED straight from RECEIVED, so the area shows total 3 / open 1 / resolved 1 / closed 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DistrictAdmin
            - call: "POST /service-areas"
              payload: { name: "Northwest Zone", code: "NW1", season_start_date: "2026-05-01", population: 50000 }
              as: DistrictAdmin
              captures: { area_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Tess Vega", license_no: "L-1001", license_category: "LARVICIDE_ONLY", license_expires_on: "2027-12-31" }
              as: DistrictAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /service-requests"
              payload: { service_area_id: "${area_id}", reporter_contact: "a@example.com", category: "STANDING_WATER", description: "Standing water in alley", x_m: 100, y_m: 100 }
              as: Resident
              as_user_id: "u-res-1"
              captures: { req_a: $.data.id }
            - call: "POST /service-requests/${req_a}/transitions"
              payload: { action: "TRIAGE", priority: "PRIORITY" }
              as: AbatementManager
              as_user_id: "u-mgr-1"
            - call: "POST /service-requests/${req_a}/transitions"
              payload: { action: "ASSIGN", assigned_applicator_id: "${tech_id}" }
              as: AbatementManager
              as_user_id: "u-mgr-1"
            - call: "POST /service-requests/${req_a}/transitions"
              payload: { action: "INSPECT", verification_status: "FIELD_CONFIRMED" }
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /service-requests/${req_a}/transitions"
              payload: { action: "RESOLVE", resolution_note: "Alley drained and larvicided" }
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /service-requests"
              payload: { service_area_id: "${area_id}", reporter_contact: "b@example.com", category: "DEAD_BIRD", description: "Dead crow on the verge", x_m: 200, y_m: 200 }
              as: Resident
              as_user_id: "u-res-2"
              captures: { req_b: $.data.id }
            - call: "POST /service-requests"
              payload: { service_area_id: "${area_id}", reporter_contact: "c@example.com", category: "SPRAY_CONCERN", description: "Duplicate of an earlier call", x_m: 300, y_m: 300 }
              as: Resident
              as_user_id: "u-res-3"
              captures: { req_c: $.data.id }
            - call: "POST /service-requests/${req_c}/transitions"
              payload: { action: "CLOSE" }
              as: AbatementManager
              as_user_id: "u-mgr-1"
            - call: "GET /service-areas/${area_id}"
              payload: {}
              as: AbatementManager
              as_user_id: "u-mgr-1"
              captures: { open_before: $.data.request_open_count, resolved_before: $.data.request_resolved_count, closed_before: $.data.request_closed_count, total_before: $.data.request_total_count }
          trigger:
            - call: "POST /service-requests/${req_a}/transitions"
              payload: { action: "REOPEN" }
              as: AbatementManager
              as_user_id: "u-mgr-1"
          assert:
            - "${total_before} == 3"
            - "${open_before} == 1"
            - "${resolved_before} == 1"
            - "${closed_before} == 1"
            - "ServiceArea.${area_id}.request_total_count == 3"
            - "ServiceArea.${area_id}.request_open_count == 2"
            - "ServiceArea.${area_id}.request_resolved_count == 0"
            - "ServiceArea.${area_id}.request_closed_count == 1"
            - "ServiceRequest.${req_a}.handling_status == TRIAGED"
            - "ServiceRequest.${req_a}.verification_status == UNVERIFIED"
            - "ServiceRequest.${req_a}.assigned_applicator_id == null"
            - "ServiceRequest.${req_a}.reopen_count == 1"
            - "ServiceRequest.${req_a}.priority == PRIORITY"
            - "ServiceRequest.${req_a}.due_at == 2026-06-03T00:00:00.000Z"
            - "ServiceRequest.${req_b}.handling_status == RECEIVED"
            - "ServiceRequest.${req_c}.handling_status == CLOSED"
