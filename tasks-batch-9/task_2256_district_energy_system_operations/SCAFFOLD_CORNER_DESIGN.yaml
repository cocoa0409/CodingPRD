              captures: { e_forecast_loop: $.data.error_id }
            - call: "POST /district-energy/connection-agreements"
              payload: { loop_id: "${loop_z1_id}", rate_schedule_id: "${rs_u_id}", customer_name: "Zenith Chillers", customer_class: "UNIVERSITY", reserved_capacity_kw: 400.0, service_mode: "COOLING", service_start_date: "2026-09-01T00:00:00Z", service_end_date: "2027-09-01T00:00:00Z" }
