            - "RemanOrder.${o2_id}.surcharge_labor_minutes == 0"
            - "HardPart.${p1_id}.qty_on_hand == 3 and qty_reserved == 2 (released then re-reserved by the promotion)"

      - name: core_grade_settles_invoice_closes_order
        grounds:
          - state_machines.CoreUnit.transitions.RECEIVED_to_GRADED
          - state_machines.CoreDepositInvoice.transitions.AWAITING_GRADE_to_SETTLED_FULL
          - entities.RemanOrder.fields.core_settlement_status
        distinguishing_aspect: |
          Depth-2 chain triggered by the inspect call (different trigger than
          the dyno-run chain): CoreUnit grading -> CoreDepositInvoice settles
          SETTLED_FULL -> RemanOrder.core_settlement_status flips PENDING ->
          CLOSED. Each hop is caused by the previous hop.
        test_recipe:
          setup:
            - "One SHIPPED order (deposit 50000c) with invoice OPEN; core registered on-time (invoice AWAITING_GRADE)"
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "MIN-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200}, {gear: 2, target_pressure_kpa: 220}, {gear: 3, target_pressure_kpa: 240}, {gear: 4, target_pressure_kpa: 260} ], required_parts: [] }
