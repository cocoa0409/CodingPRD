              as: PlatformAdmin
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /tsdf/containers"
              payload: { manifest_line_id: "3f1b9c7e-0000-4000-8000-0000000000ff", storage_unit_id: "${unit_id}", container_type: "DRUM_55G", capacity_kg: 250.0, net_weight_kg: 200.0, accumulation_start_date: "2026-08-01T00:00:00Z", label_waste_codes: ["D001"], label_hazard_class: "3", label_accumulation_start_marked: true }
              as: ReceivingClerk
          assert:
            - "response status == 404 and data.error_id == ERR_REFERENCE_NOT_FOUND"
            - "StorageUnit.${unit_id}.container_count == 0"
            - "StorageUnit.${unit_id}.stored_kg == 0.0"
            - "StorageUnit.${unit_id}.posture == OPEN"

      - name: manifest_line_profile_from_another_facility_rejected
        claim_type: cross_reference_integrity
        grounds:
          - complexity_profile.entity_topology
          - validations[priority=8]
          - errors[ERR_FACILITY_SCOPE_MISMATCH]
        distinguishing_aspect: |
          The topology is flat, so cross-aggregate integrity is a validation, not a routing property:
          an APPROVED profile whose facility_id is facility B cannot be shipped on a manifest bound
          for facility A. Priority 8 must win even though the profile itself is perfectly valid
          (it is APPROVED and unexpired, so priorities 14 and 15 are satisfied).
        test_recipe:
          setup:
            - "Two facilities A and B; the generator's profile is approved AGAINST FACILITY B"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
