      - name: documentation_review_chain_rejects_self_review_coverage_gaps_and_a_spent_cycle_budget
        claim_type: cascading
        grounds:
          - validations[priority=30]
          - validations[priority=44]
          - validations[priority=67]
          - validations[priority=72]
          - validations[priority=74]
          - calculations.documentation_posture_rollup
        distinguishing_aspect: |
          Coverage is recomputed from the live PUBLISHED part population at review
          time (not from what the author typed), the author may never approve his
          own revision, and the rejection budget is consumed rather than reset —
          each check depends on the result of the one before it.
        test_recipe:
          setup:
            - "Profile US-CA; model CRX-V07 (TIER_A); parts SKU-V07-A and SKU-V07-B both PUBLISHED with in-window compatibility rows, so required_skus has two members."
