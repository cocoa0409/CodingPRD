          - errors[ERR_MCT_VIOLATION]
          - calculations.connection_slack_minutes
        distinguishing_aspect: "The cross-entity pair is Connection over Bag, a different pair from the Bag-over-Flight instance: the Connection's own fields satisfy both the MCT and the PENDING precondition, and the refusal comes solely from the bag's independent screening axis."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; station SEA with lane EDS-2; airline DL; flight DL1423 departs 15:00 and flight DL1788 departs 17:30"
            - "transfer bag T1 48 lb DOMESTIC ticketed on DL1423 inbound and DL1788 onward, with an alarmed screening window carrying alarm_code EDS_ALARM_A1 so screening_status is ALARMED and custody_status is HELD"
            - "one Connection with required_mct_minutes 165, whose connect_slack_minutes is therefore -15"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/stations"
              payload: { code: "SEA", name: "Seattle-Tacoma", sorter_capacity_bags: 60 }
              as: PlatformAdmin
              captures: { st: $.data.id }
            - call: "POST /baggage/airlines"
              payload: { code: "DL", name: "Delta Air Lines", interline_agreement_active: true, max_excess_weight_lb: 50, excess_weight_fee_cents: 7500, compensation_cap_cents: 300000 }
              as: PlatformAdmin
              captures: { al: $.data.id }
            - call: "POST /baggage/screening-lanes"
              payload: { station_id: "${st}", lane_code: "EDS-2" }
              as: PlatformAdmin
              captures: { lane: $.data.id }
            - call: "POST /baggage/flights"
              payload: { station_id: "${st}", airline_id: "${al}", flight_number: "DL1423", bank_code: "B1", scheduled_departure_utc: "2026-09-01T15:00:00Z" }
              as: PlatformAdmin
              captures: { f1: $.data.id }
            - call: "POST /baggage/flights"
              payload: { station_id: "${st}", airline_id: "${al}", flight_number: "DL1788", bank_code: "B2", scheduled_departure_utc: "2026-09-01T17:30:00Z" }
              as: PlatformAdmin
              captures: { f2: $.data.id }
            - call: "POST /baggage/bags"
              payload: { station_id: "${st}", passenger_name: "Nakamura, Yui", passenger_ref: "PNR2W8H", itinerary_type: "DOMESTIC", weight_lb: 48, length_in: 20, width_in: 14, height_in: 16 }
              as: AcceptanceAgent
              captures: { t1: $.data.id }
            - call: "POST /baggage/bags/${t1}/weigh"
              payload: { scale_weight_lb: 48.0 }
              as: AcceptanceAgent
            - call: "POST /baggage/connections"
              payload: { bag_id: "${t1}", inbound_flight_id: "${f1}", onward_flight_id: "${f2}", required_mct_minutes: 75 }
              as: TransferAgent
              captures: { cn1: $.data.id }
            - call: "POST /baggage/connections"
              payload: { bag_id: "${t1}", inbound_flight_id: "${f1}", onward_flight_id: "${f2}", required_mct_minutes: 165 }
              as: TransferAgent
              captures: { cn2: $.data.id }
            - call: "POST /baggage/screenings"
              payload: { bag_id: "${t1}", lane_id: "${lane}", start_utc: "2026-09-01T07:20:00Z", alarm_code: "EDS_ALARM_A1" }
              as: Screener
              captures: { se: $.data.id }
          trigger:
            - call: "POST /baggage/connections/${cn1}/confirm"
              payload: {}
              as: TransferAgent
              captures: { err: $.data.error_id }
            - call: "POST /baggage/connections/${cn2}/declare-rush"
              payload: {}
              as: TransferAgent
              captures: { cn2_v: $.data.version }
            - call: "POST /baggage/screenings/${se}/resolve"
              payload: { outcome: "CLEARED" }
              as: Screener
            - call: "POST /baggage/connections/${cn1}/confirm"
              payload: {}
              as: TransferAgent
          assert:
            - "Connection.${cn1}.connect_slack_minutes == 75 (17:30 minus 15:00 truncated is 150 minutes, minus the required 75)"
            - "the first confirm on CN1 fails with 409 ERR_SCREENING_NOT_CLEARED even though the connection is PENDING and its slack is positive"
            - "Connection.${cn2}.connect_slack_minutes == -15, so confirm on CN2 would fail with ERR_MCT_VIOLATION — a different gate on the same pair"
            - "CN2's declare-rush instead succeeds (slack -15 is exactly the >= -15 boundary) and Connection.${cn2}.status == RUSH with rush_declared_utc stamped"
            - "after the alarm is cleared: Bag.${t1}.screening_status == CLEARED while custody_status is STILL HELD"
            - "the repeated confirm on CN1 now returns 200 and Connection.${cn1}.status == CONFIRMED, proving the refusal tracked the Bag's screening axis and not the Connection's own fields"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: makeup_identity_bucket_membership_ignores_interval_magnitude
        grounds:
          - validations[priority=8]
          - calculations.makeup_area_occupancy
          - entities.MakeupArea.fields.buffer_minutes
          - state_machines.Bag.SORTED_to_IN_MAKEUP
        distinguishing_aspect: "Interval semantics are buffer-bucketed rather than half-open: any interval whose 15-minute identity bucket is already occupied conflicts regardless of how small the collateral overlap is, and the bucket width is the area's buffer_minutes rather than a fixed constant."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; station SEA capacity 60 with make-up area MA-3 capacity_slots 2 and buffer_minutes 15; lane EDS-2; airline DL; flight DL1423 departs 15:00"
            - "bag P1 48 lb DOMESTIC cleanly screened and sorted, flight DL1423"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/stations"
              payload: { code: "SEA", name: "Seattle-Tacoma", sorter_capacity_bags: 60 }
              as: PlatformAdmin
              captures: { st: $.data.id }
            - call: "POST /baggage/airlines"
              payload: { code: "DL", name: "Delta Air Lines", interline_agreement_active: true, max_excess_weight_lb: 50, excess_weight_fee_cents: 7500, compensation_cap_cents: 300000 }
              as: PlatformAdmin
              captures: { al: $.data.id }
            - call: "POST /baggage/makeup-areas"
              payload: { station_id: "${st}", code: "MA-3", capacity_slots: 2, buffer_minutes: 15 }
              as: PlatformAdmin
              captures: { ma: $.data.id }
            - call: "POST /baggage/screening-lanes"
              payload: { station_id: "${st}", lane_code: "EDS-2" }
              as: PlatformAdmin
              captures: { lane: $.data.id }
            - call: "POST /baggage/flights"
              payload: { station_id: "${st}", airline_id: "${al}", flight_number: "DL1423", bank_code: "B1", scheduled_departure_utc: "2026-09-01T15:00:00Z" }
              as: PlatformAdmin
              captures: { f1: $.data.id }
            - call: "POST /baggage/bags"
              payload: { station_id: "${st}", flight_id: "${f1}", passenger_name: "Adeyemi, Tunde", passenger_ref: "PNR9K3L", itinerary_type: "DOMESTIC", weight_lb: 48, length_in: 20, width_in: 14, height_in: 16 }
              as: AcceptanceAgent
              captures: { p1: $.data.id }
            - call: "POST /baggage/bags/${p1}/weigh"
              payload: { scale_weight_lb: 48.0 }
              as: AcceptanceAgent
              captures: { p1v: $.data.version }
            - call: "POST /baggage/screenings"
              payload: { bag_id: "${p1}", lane_id: "${lane}", start_utc: "2026-09-01T07:20:00Z" }
              as: Screener
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T13:00:00Z" }
              as: PlatformAdmin
            - call: "GET /baggage/bags/${p1}"
              payload: {}
              as: AcceptanceAgent
              captures: { p1v_f: $.data.version }
            - call: "POST /baggage/bags/${p1}/assign-makeup"
              payload: { expected_bag_version: "${p1v_f}", makeup_area_id: "${ma}", induction_utc: "2026-09-01T13:36:00Z", makeup_interval_minutes: 120 }
              as: SortationAgent
          trigger:
            - call: "GET /baggage/bags/${p1}"
              payload: {}
              as: AcceptanceAgent
              captures: { p1v_f: $.data.version }
            - call: "POST /baggage/bags/${p1}/assign-makeup"
              payload: { expected_bag_version: "${p1v_f}", makeup_area_id: "${ma}", induction_utc: "2026-09-01T13:48:00Z", makeup_interval_minutes: 120 }
              as: SortationAgent
              captures: { err: $.data.error_id }
          assert:
            - "the first assignment at 13:36 opens the identity bucket starting 13:30 and returns 200; MakeupArea.${ma}.free_slots == 1"
            - "re-issuing assign-makeup for the same bag at 13:48 falls in the SAME identity bucket [13:30, 13:45 + 120) and returns 409 ERR_MAKEUP_SLOT_CONFLICT"
            - "re-issuing it for the same bag at 13:12 falls in the distinct bucket starting 13:00 and the sameness exemption applies, so it returns 200"
            - "issuing it at 13:48 for the same bag is refused even though 13:48 is only 12 minutes later — the bucket width is the area's buffer_minutes, not a magnitude threshold"
            - "MakeupArea.${ma}.occupied_slots stays 1 throughout, because the refusals never wrote a second interval"
            - "a second bag moving into the 13:12 bucket succeeds and lifts occupied_slots to 2, while a third bag targeting either bucket then fails on the capacity bound"

      - name: screening_lane_windows_are_strict_half_open_with_no_buffer
        grounds:
          - validations[priority=9]
          - state_machines.ScreeningEvent.IN_PROGRESS_to_CLEARED
          - entities.ScreeningEvent.fields.end_utc
          - entities.ScreeningLane.fields.last_event_end_utc
        distinguishing_aspect: "Interval semantics are strict half-open identity buckets with NO changeover buffer, the opposite treatment from the make-up area rule: an event starting exactly at another event's end is legal, while one starting twenty minutes earlier collides."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; station SEA with lane EDS-2; airline DL; flight DL1423 departs 15:00"
            - "bag L1 48 lb DOMESTIC weighed so its screening_status is IN_LINE"
            - "one screening window already recorded on lane EDS-2 for bag L1 starting 2026-09-01T07:00:00Z, hence closing at 07:20:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/stations"
              payload: { code: "SEA", name: "Seattle-Tacoma", sorter_capacity_bags: 60 }
              as: PlatformAdmin
              captures: { st: $.data.id }
            - call: "POST /baggage/airlines"
              payload: { code: "DL", name: "Delta Air Lines", interline_agreement_active: true, max_excess_weight_lb: 50, excess_weight_fee_cents: 7500, compensation_cap_cents: 300000 }
              as: PlatformAdmin
              captures: { al: $.data.id }
            - call: "POST /baggage/screening-lanes"
              payload: { station_id: "${st}", lane_code: "EDS-2" }
              as: PlatformAdmin
              captures: { lane: $.data.id }
            - call: "POST /baggage/flights"
              payload: { station_id: "${st}", airline_id: "${al}", flight_number: "DL1423", bank_code: "B1", scheduled_departure_utc: "2026-09-01T15:00:00Z" }
              as: PlatformAdmin
              captures: { f1: $.data.id }
            - call: "POST /baggage/bags"
              payload: { station_id: "${st}", flight_id: "${f1}", passenger_name: "Silva, Rui", passenger_ref: "PNR6D5P", itinerary_type: "DOMESTIC", weight_lb: 48, length_in: 20, width_in: 14, height_in: 16 }
              as: AcceptanceAgent
              captures: { l1: $.data.id }
            - call: "POST /baggage/bags/${l1}/weigh"
              payload: { scale_weight_lb: 48.0 }
              as: AcceptanceAgent
            - call: "POST /baggage/screenings"
              payload: { bag_id: "${l1}", lane_id: "${lane}", start_utc: "2026-09-01T07:00:00Z" }
              as: Screener
              captures: { se1: $.data.id }
          trigger:
            - call: "POST /baggage/screenings"
              payload: { bag_id: "${l1}", lane_id: "${lane}", start_utc: "2026-09-01T07:20:00Z" }
              as: Screener
              captures: { se2: $.data.id }
            - call: "POST /baggage/screenings"
              payload: { bag_id: "${l1}", lane_id: "${lane}", start_utc: "2026-09-01T07:00:00Z" }
              as: Screener
              captures: { err: $.data.error_id }
          assert:
            - "the setup window on EDS-2 covers the half-open interval [07:00, 07:20) and ScreeningLane.${lane}.last_event_end_utc == 2026-09-01T07:20:00Z"
            - "an event starting at exactly 07:20:00Z is ACCEPTED, because 07:20 is the exclusive end of the previous bucket's successor and adjacency is legal on a lane with no buffer"
            - "ScreeningEvent.${se2}.end_utc == 2026-09-01T07:40:00Z"
            - "a third event starting at 07:00:00Z is REFUSED with 409 ERR_LANE_INTERVAL_CONFLICT, because it lands in the same 20-minute identity bucket"
            - "Bag.${l1}.screening_status is still IN_LINE after the refusal and no third ScreeningEvent row was written"
            - "ScreeningLane.${lane}.last_event_end_utc remains 07:40:00Z"
