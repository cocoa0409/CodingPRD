            - "${e_both} == ERR_COVERAGE_EXHAUSTED with HTTP 409, NOT ERR_RESERVE_INSUFFICIENT — priority 70 is evaluated before priority 72"
            - "${e_reserve_only} == ERR_RESERVE_INSUFFICIENT with HTTP 422 — Demand B's total of 648,000 fits the untouched 900,000 tower, so the coverage check passes and the reserve check finally runs; this proves 72 is reachable rather than shadowed"
            - "${revised} == 1500000 == 900,000 + 600,000 (both demands still open, weighted at their demand amounts) and ${out1} == 1500000"
            - "${b_total} == 648000 == 600,000 + round_half_up(600,000 * 0.08) with ${b_status} == SETTLED"
            - "${e_consumed} == ERR_COVERAGE_EXHAUSTED with HTTP 409 on the retry of Demand A — the remaining capacity is 900,000 - 648,000 = 252,000, so the check counts the capacity this very claim already consumed, even though the reserve now holds 852,000"
            - "${ind} == 600000, ${alae} == 48000, ${out2} == 852000, ${sir} == 648000 and ${h} == NEGOTIATION — every refusal left the ledger exactly where the successful settlement put it"

  # =========================================================================
  - section: endpoints
    instances:

      - name: create_read_list_round_trip_with_no_update_or_delete_verb
        claim_type: standard_crud
        grounds:
          - endpoints[POST /terminals]
          - endpoints[GET /terminals/{id}]
          - endpoints[GET /drivers]
          - complexity_profile.entity_topology
        distinguishing_aspect: "Every row in this API is created once and thereafter mutated only through named action endpoints: the create/read/list round trip returns identical field values, and §1.5 declares no PATCH, PUT or DELETE anywhere."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "Greenville Terminal", terminal_code: "GRE02", region_code: "OH", annual_miles_millions: 7.5 }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { t1: $.data.id, t1_name: $.data.name, t1_miles: $.data.annual_miles_millions, t1_created: $.data.created_at, t1_ver: $.data.version }
            - call: "POST /terminals"
              payload: { name: "Hillsboro Terminal", terminal_code: "HIL03", region_code: "IN", annual_miles_millions: 1.25 }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { t2: $.data.id }
          trigger:
            - call: "GET /terminals/${t1}"
              payload: {}
              as: Auditor
              as_user_id: "aud-001"
              captures: { g_name: $.data.name, g_code: $.data.terminal_code, g_region: $.data.region_code, g_miles: $.data.annual_miles_millions, g_created: $.data.created_at, g_ver: $.data.version, g_active: $.data.active_driver_count, g_tier: $.data.risk_tier }
            - call: "POST /drivers"
              payload: { terminal_id: "${t1}", employee_code: "D-5701", full_name: "Bodil Achterberg", cdl_number: "OH-CDL-5701", hire_date: "2018-04-16" }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { d1: $.data.id, d1_band: $.data.tenure_band, d1_status: $.data.status }
            - call: "POST /drivers"
              payload: { terminal_id: "${t2}", employee_code: "D-5701", full_name: "Cato Villanueva", cdl_number: "IN-CDL-5702", hire_date: "2019-05-17" }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { d2: $.data.id }
            - call: "GET /drivers"
              payload: { terminal_id: "${t1}", limit: 10, offset: 0 }
              as: Auditor
              as_user_id: "aud-001"
              captures: { list_t1: $.data }
            - call: "GET /drivers"
              payload: { status: "ACTIVE", limit: 10, offset: 0 }
              as: Auditor
              as_user_id: "aud-001"
              captures: { list_active: $.data }
            - call: "GET /drivers"
              payload: { status: "ON_LEAVE" }
              as: Auditor
              as_user_id: "aud-001"
              captures: { e_filter: $.data.error_id }
            - call: "GET /terminals"
              payload: { region_code: "IN", limit: 10, offset: 0 }
              as: Auditor
              as_user_id: "aud-001"
              captures: { list_in: $.data }
          assert:
            - "${g_name} == ${t1_name} == 'Greenville Terminal', ${g_code} == GRE02, ${g_region} == OH, ${g_miles} == ${t1_miles} == 7.5 and ${g_created} == ${t1_created} — the read returns the stored row byte for byte, including the number 7.5 as a number and not a string"
            - "${g_ver} == ${t1_ver} == 1 — the version starts at 1 and a GET never bumps it"
            - "${g_active} == 0 and ${g_tier} == STANDARD on a terminal with no drivers and no crashes — the computed fields are present from creation, not null"
            - "${d1_band} == OVER_36_MONTHS and ${d1_status} == ACTIVE, the Driver initial state"
            - "${d2} is created with HTTP 201 despite reusing employee_code D-5701 — that code is unique per terminal, and ${t2} is a different terminal"
            - "${list_t1} has exactly 1 row (${d1}) with meta.pagination.total_count == 1, and ${list_active} has 2 rows — the terminal_id filter and the status filter are both honoured"
            - "${e_filter} == ERR_INVALID_REQUEST with HTTP 400 — a filter value outside the enum domain is rejected rather than returning an empty page"
            - "${list_in} has exactly 1 row (${t2}) with total_count 1 and has_more false"
            - "No PATCH, PUT or DELETE endpoint exists anywhere in §1.5: a name typo on ${t1} cannot be corrected, so every state change in this API travels through a named POST action endpoint"

      - name: regulatory_report_action_files_late_or_refuses_outright
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /crashes/{id}/regulatory-report]
          - state_machines.Crash.reporting_status
          - entities.Terminal.fields.late_filing_count
        distinguishing_aspect: "The one filing action drives three different outcomes from the same endpoint: FILED before the deadline, LATE_FILED one second after it with the terminal's late_filing_count incremented, and an outright refusal on a crash that was never recordable."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. One Terminal and one Driver."
            - "Crash R: 1 transported injury, occurred 2026-07-31T06:00:00Z, so report_due_at is 2026-08-03T06:00:00Z. Crash L: 1 transported injury, occurred 2026-07-30T06:00:00Z, so report_due_at is 2026-08-02T06:00:00Z. Crash N: nothing recordable at all."
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "Ironton Terminal", terminal_code: "IRN03", region_code: "OH", annual_miles_millions: 3.0 }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { t_id: $.data.id, lf0: $.data.late_filing_count }
            - call: "POST /drivers"
              payload: { terminal_id: "${t_id}", employee_code: "D-5801", full_name: "Dario Selvaggio", cdl_number: "OH-CDL-5801", hire_date: "2013-03-13" }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { d_id: $.data.id }
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-07-31T06:00:00Z", notified_at: "2026-07-31T06:30:00Z", location_text: "US-52 at Center St", severity: "MODERATE", route_class: "REGIONAL", tow_away: false, tow_reason: "NONE", injury_transported_count: 1, fatality_count: 0, hazmat_release: false, mechanical_factor: false, third_party_at_fault: false }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { c_r: $.data.id, due_r: $.data.report_due_at, rs_r: $.data.reporting_status }
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-07-30T06:00:00Z", notified_at: "2026-07-30T06:30:00Z", location_text: "SR-93 at the tunnel", severity: "MODERATE", route_class: "REGIONAL", tow_away: false, tow_reason: "NONE", injury_transported_count: 1, fatality_count: 0, hazmat_release: false, mechanical_factor: false, third_party_at_fault: false }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { c_l: $.data.id, due_l: $.data.report_due_at }
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-07-31T09:00:00Z", notified_at: "2026-07-31T09:05:00Z", location_text: "Yard row C", severity: "MINOR", route_class: "LOCAL", tow_away: true, tow_reason: "CONVENIENCE", injury_transported_count: 0, fatality_count: 0, hazmat_release: false, mechanical_factor: false, third_party_at_fault: false }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { c_n: $.data.id, rs_n: $.data.reporting_status, rec_n: $.data.dot_recordable }
          trigger:
            - call: "POST /crashes/${c_r}/regulatory-report"
              payload: { filing_reference: "FMCSA-2026-IRN03-0001" }
              as: SafetyManager
              as_user_id: "sm-001"
              captures: { rs_filed: $.data.reporting_status, ref_filed: $.data.filing_reference, at_filed: $.data.filed_at }
            - call: "POST /crashes/${c_r}/regulatory-report"
              payload: { filing_reference: "FMCSA-2026-IRN03-0001-DUP" }
              as: SafetyManager
              as_user_id: "sm-001"
              captures: { e_dup: $.data.error_id }
            - call: "POST /crashes/${c_n}/regulatory-report"
              payload: { filing_reference: "FMCSA-2026-IRN03-0002" }
              as: SafetyManager
              as_user_id: "sm-001"
              captures: { e_not_req: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T06:00:01Z" }
              as: SafetyAdmin
              as_user_id: "sa-001"
            - call: "POST /crashes/${c_l}/regulatory-report"
              payload: { filing_reference: "FMCSA-2026-IRN03-0003" }
              as: SafetyManager
              as_user_id: "sm-001"
              captures: { rs_late: $.data.reporting_status, at_late: $.data.filed_at }
            - call: "GET /terminals/${t_id}"
              payload: {}
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { lf1: $.data.late_filing_count }
            - call: "GET /crashes"
              payload: { terminal_id: "${t_id}", reporting_status: "LATE_FILED", limit: 10, offset: 0 }
              as: Auditor
              as_user_id: "aud-001"
              captures: { late_page: $.data }
          assert:
            - "${lf0} == 0, ${rs_r} == PENDING_FILING, ${due_r} == 2026-08-03T06:00:00Z and ${due_l} == 2026-08-02T06:00:00Z — the plain 72-hour window from occurred_at"
            - "${rec_n} == false with ${rs_n} == NOT_REQUIRED — a CONVENIENCE tow triggers nothing"
            - "${rs_filed} == FILED with ${ref_filed} == 'FMCSA-2026-IRN03-0001' and ${at_filed} == 2026-08-01T00:00:00Z — the action stamps the logical clock, not the crash time"
            - "${e_dup} == ERR_CRASH_STATE_INVALID with HTTP 409 on the second filing, and GET /crashes/${c_r} still reports the ORIGINAL filing_reference — a refused action overwrites nothing"
            - "${e_not_req} == ERR_CRASH_STATE_INVALID with HTTP 409 — the dot_recordable precondition refuses a crash that has nothing to report"
            - "${rs_late} == LATE_FILED with ${at_late} == 2026-08-02T06:00:01Z — one second past report_due_at selects the second branch of the same trigger"
            - "${lf1} == 1 — only the LATE_FILED branch touches Terminal.late_filing_count; the on-time filing of ${c_r} left it at 0"
            - "${late_page} has exactly 1 row (${c_l}) — the reporting_status filter separates the two branches"

      - name: appeal_evidence_link_is_stored_and_reverse_reachable
        claim_type: cross_reference_link
        grounds:
          - entities.ReviewCase.fields.appeal_evidence_item_id
          - endpoints[GET /review-cases]
          - endpoints[POST /review-cases/{id}/appeal]
        distinguishing_aspect: "Granting a NEW_EVIDENCE appeal stores a pointer from the ReviewCase to an EvidenceItem, and that association is discoverable from the evidence side through the list filter without mutating the item itself."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. One Terminal, one Driver, one MINOR crash whose only required kind is TELEMATICS_SNAPSHOT, preserved so the posture is COMPLETE."
            - "The case is decided NON_PREVENTABLE by three NON_PREVENTABLE ballots on the UNWEIGHTED_MAJORITY path. A second crash carries its own preserved SCENE_PHOTO that is never cited."
