    input: []
    output: Order
    side_effects: ["cascade-create Order; advance next_release_at by cadence_days; increment cycles_released; increments StandingOrder.version by 1"]
  - method: POST
    path: "/standing-orders/{id}/pause"
    description: "Pause a standing order"
    roles: [SalesRep, WholesaleBuyer]
    code: 200
    input: []
    output: StandingOrder
    side_effects: ["status ACTIVE->PAUSED; increments version by 1"]
  - method: POST
    path: "/standing-orders/{id}/resume"
    description: "Resume a paused standing order"
    roles: [SalesRep, WholesaleBuyer]
    code: 200
    input: []
    output: StandingOrder
    side_effects: ["status PAUSED->ACTIVE; increments version by 1"]
  - method: POST
    path: "/standing-orders/{id}/cancel"
    description: "Cancel a standing order"
    roles: [SalesRep, WholesaleBuyer]
    code: 200
    input: []
    output: StandingOrder
    side_effects: ["status ->CANCELLED; increments version by 1"]

  # ---- Order ----
  - method: POST
    path: "/accounts/{id}/orders"
    description: "Create a wholesale order for an account"
    roles: [SalesRep, WholesaleBuyer]
    code: 201
    input: [lines]
    output: Order
    side_effects: ["price per tier: compute subtotal/discount/total; fulfillment_status OPEN; billing_status UNBILLED"]
  - method: GET
    path: "/accounts/{id}/orders"
    description: "List orders for an account (FK reverse-reachability for Order.account_id)"
    roles: [SalesRep, RoasterStaff, WholesaleBuyer]
    code: 200
    input: ["fulfillment_status?", "billing_status?", "standing_order_id?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: GET
    path: "/orders"
    description: "List orders. Filter by standing_order_id (FK reverse-reachability for Order.standing_order_id) or account_id, fulfillment_status, billing_status."
    roles: [SalesRep, RoasterStaff]
    code: 200
    input: ["standing_order_id?", "account_id?", "fulfillment_status?", "billing_status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: GET
    path: "/orders/{id}"
    description: "Get an order"
    roles: [SalesRep, RoasterStaff, WholesaleBuyer]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel an OPEN, UNBILLED order; cancels its RESERVED fulfillments"
    roles: [SalesRep, WholesaleBuyer]
    code: 200
    input: []
    output: Order
    side_effects: ["fulfillment_status->CANCELLED; cascade-cancel RESERVED Fulfillments releasing roasted-lot reservations; increments Order.version by 1"]
  - method: POST
    path: "/orders/{id}/invoice"
    description: "Issue an invoice for a (partially) fulfilled order; credit-checked"
    roles: [SalesRep]
    code: 201
    input: []
    output: Invoice
    side_effects: ["billing_status->INVOICED; cascade-create Invoice; recompute account.outstanding_balance_cents; increments Order.version by 1"]

  # ---- Fulfillment ----
  - method: POST
    path: "/orders/{id}/fulfillments"
    description: "Reserve a roasted lot against an order line; freshness- and quota-gated; OCC on roasted lot"
    roles: [SalesRep]
    code: 201
    input: [product_id, roasted_lot_id, allocated_kg, expected_roasted_lot_version]
    output: Fulfillment
    side_effects: ["status RESERVED; roast_date copied from lot; RoastedLot reserved/available recompute; increments RoastedLot.version by 1; increments Order.version by 1"]
  - method: GET
    path: "/orders/{id}/fulfillments"
    description: "List fulfillments for an order (FK reverse-reachability for Fulfillment.order_id)"
    roles: [SalesRep, RoasterStaff, WholesaleBuyer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Fulfillment[]
    side_effects: []
  - method: GET
    path: "/fulfillments"
    description: "List fulfillments. Filter by roasted_lot_id (FK reverse-reachability) or product_id."
    roles: [SalesRep, RoasterStaff]
    code: 200
    input: ["roasted_lot_id?", "product_id?", "status?", "limit?", "offset?"]
    output: Fulfillment[]
    side_effects: []
  - method: GET
    path: "/fulfillments/{id}"
    description: "Get a fulfillment"
    roles: [SalesRep, RoasterStaff, WholesaleBuyer]
    code: 200
    input: []
    output: Fulfillment
    side_effects: []
  - method: POST
    path: "/fulfillments/{id}/ship"
    description: "Ship a reserved fulfillment; converts reservation to consumption; bubble-up order fulfillment_status"
    roles: [RoasterStaff]
    code: 200
    input: []
    output: Fulfillment
    side_effects: ["status RESERVED->SHIPPED; RoastedLot on_hand recompute; Order.fulfillment_status re-derived; increments Order.version by 1"]
  - method: POST
    path: "/fulfillments/{id}/cancel"
    description: "Cancel a reserved fulfillment; release roasted-lot reservation"
    roles: [SalesRep]
    code: 200
    input: []
    output: Fulfillment
    side_effects: ["status RESERVED->CANCELLED; RoastedLot reserved/available recompute; increments Order.version by 1"]

  # ---- SampleRequest ----
  - method: POST
    path: "/accounts/{id}/sample-requests"
    description: "Create a sample / cupping request for an account"
    roles: [SalesRep, WholesaleBuyer]
    code: 201
    input: [product_id, sample_kg]
    output: SampleRequest
    side_effects: ["status REQUESTED"]
  - method: GET
    path: "/accounts/{id}/sample-requests"
    description: "List sample requests for an account (FK reverse-reachability for SampleRequest.account_id)"
    roles: [SalesRep, RoasterStaff, WholesaleBuyer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SampleRequest[]
    side_effects: []
  - method: GET
    path: "/sample-requests"
    description: "List sample requests. Filter by product_id (FK reverse-reachability for SampleRequest.product_id) or account_id or status."
    roles: [SalesRep, RoasterStaff]
    code: 200
    input: ["product_id?", "account_id?", "status?", "limit?", "offset?"]
    output: SampleRequest[]
    side_effects: []
  - method: GET
    path: "/sample-requests/{id}"
    description: "Get a sample request"
    roles: [SalesRep, RoasterStaff, WholesaleBuyer]
    code: 200
    input: []
    output: SampleRequest
    side_effects: []
  - method: POST
    path: "/sample-requests/{id}/review"
    description: "Review a sample request: APPROVE (records cupping_score) or DECLINE (branching fork)"
    roles: [RoasterStaff]
    code: 200
    input: [decision, cupping_score]
    output: SampleRequest
    side_effects: ["status REQUESTED->APPROVED or ->DECLINED; cupping_score recorded; increments version by 1"]
  - method: POST
    path: "/sample-requests/{id}/convert"
    description: "Convert an approved sample (cupping_score >= 80) into an order"
    roles: [SalesRep]
    code: 201
    input: [qty_kg]
    output: Order
    side_effects: ["status APPROVED->CONVERTED; cascade-create Order; increments version by 1"]

  # ---- Invoice + Payment ----
  - method: GET
    path: "/accounts/{id}/invoices"
    description: "List invoices for an account (FK reverse-reachability for Invoice.account_id)"
    roles: [SalesRep, RoasterStaff, WholesaleBuyer]
    code: 200
    input: ["status?", "order_id?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: ["recompute paid/amount_due"]
  - method: GET
    path: "/invoices"
    description: "List invoices. Filter by order_id (FK reverse-reachability for Invoice.order_id) or account_id or status."
    roles: [SalesRep, RoasterStaff]
    code: 200
    input: ["order_id?", "account_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: ["recompute paid/amount_due"]
  - method: GET
    path: "/invoices/{id}"
    description: "Get an invoice (computed paid/amount_due/status)"
    roles: [SalesRep, RoasterStaff, WholesaleBuyer]
    code: 200
    input: []
    output: Invoice
    side_effects: ["recompute paid/amount_due"]
  - method: POST
    path: "/invoices/{id}/payments"
    description: "Apply a payment to an invoice (no overpayment); advances invoice status"
    roles: [SalesRep]
    code: 201
    input: [amount_cents]
    output: Payment
    side_effects: ["create Payment CLEARED; recompute invoice paid/amount_due/status; recompute account.outstanding_balance_cents; may release account CREDIT_HOLD"]
  - method: GET
    path: "/invoices/{id}/payments"
    description: "List payments on an invoice (FK reverse-reachability for Payment.invoice_id)"
    roles: [SalesRep, RoasterStaff, WholesaleBuyer]
    code: 200
    input: ["limit?", "offset?"]
    output: Payment[]
    side_effects: []

  # ---- Test-driving clock (last-resort namespace) ----
  - method: POST
    path: "/_clock/set"
    description: "Set the simulated current UTC clock (test-driving; governs roast_date stamping, freshness, due dates, standing-order release timing)"
    roles: [SalesRep, RoasterStaff]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["sets server clock; does NOT itself run aging"]
  - method: POST
    path: "/_clock/advance"
    description: "Advance the simulated clock to a timestamp and run the invoice aging sweep (ISSUED/PARTIALLY_PAID past due_at -> OVERDUE; account credit-hold cascade)"
    roles: [SalesRep, RoasterStaff]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["sets clock; ages overdue invoices; cascades WholesaleAccount.status CREDIT_HOLD"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header, or unknown role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the operation; or WholesaleBuyer acting on another account's resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource (account, product, green lot, roasted lot, batch, order, invoice, fulfillment, sample, standing order, tier, payment) does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/invalid body field, bad enum, non-positive quantity, disallowed net_terms_days/cadence_days/roast_level" }
  - { id: ERR_DUPLICATE, http: 409, condition: "PriceTier.code / Product.sku / GreenLot.lot_ref not unique within its active scope" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not allowed from the resource's current state (incl. reroast beyond MAX_REROASTS)" }
  - { id: ERR_PRODUCT_MISMATCH, http: 409, condition: "RoastedLot product != fulfillment product, or sample/standing-order product is archived" }
  - { id: ERR_STALE_ROAST, http: 409, condition: "Roasted lot age in days exceeds min(product.freshness_window_days, tier.freshness_max_days)" }
  - { id: ERR_RELEASE_NOT_DUE, http: 409, condition: "Standing-order release attempted before next_release_at" }
  - { id: ERR_INSUFFICIENT_GREEN, http: 409, condition: "actual_green_kg exceeds GreenLot.on_hand_kg at start" }
  - { id: ERR_INSUFFICIENT_ROASTED, http: 409, condition: "allocated_kg exceeds RoastedLot.available_kg, or pushes line allocation above ordered qty_kg" }
  - { id: ERR_WEIGHT_GAIN, http: 409, condition: "actual_roasted_kg exceeds actual_green_kg at complete" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 409, condition: "outstanding_balance + order total exceeds credit_limit, or account not ACTIVE, at invoice" }
  - { id: ERR_OVERPAYMENT, http: 409, condition: "Payment amount_cents not in (0, invoice.amount_due_cents]" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_green_lot_version / expected_roasted_lot_version != current parent version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RoasterStaff
    description: "Production side — receives green lots, plans/runs roast batches, manages roasted inventory, ships fulfillments, reviews sample cuppings"
    identity: opaque
    exclusive_operations:
      - "POST /green-lots (receive green)"
      - "POST /roast-profiles"
      - "POST /roast-batches (plan; OCC on green lot)"
      - "POST /roast-batches/{id}/start|drop|reroast|complete|cancel"
      - "POST /fulfillments/{id}/ship"
      - "POST /sample-requests/{id}/review (cupping decision)"
    shared_operations:
      - "POST /products, POST /products/{id}/archive (with SalesRep)"
      - "GET reads across catalog, inventory, accounts, orders, invoices, fulfillments, samples, standing orders"
      - "POST /_clock/set, POST /_clock/advance (test-driving)"

  - name: SalesRep
    description: "Commercial side — manages accounts/tiers, orders, ful.reservations, invoicing, payments, sample conversion, standing-order lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /price-tiers"
      - "POST /accounts"
      - "POST /orders/{id}/cancel|invoice (for any account)"
      - "POST /orders/{id}/fulfillments (reserve; OCC on roasted lot)"
      - "POST /fulfillments/{id}/cancel"
      - "POST /invoices/{id}/payments"
      - "POST /standing-orders/{id}/release"
      - "POST /sample-requests/{id}/convert"
    shared_operations:
      - "POST /products, POST /products/{id}/archive (with RoasterStaff)"
      - "POST /accounts/{id}/orders, /standing-orders, /sample-requests (with WholesaleBuyer)"
      - "POST /standing-orders/{id}/pause|resume|cancel (with WholesaleBuyer)"
      - "GET reads across all resources"
      - "POST /_clock/set, POST /_clock/advance (test-driving)"

  - name: WholesaleBuyer
    description: "The buyer acting as their own account — places own orders, standing orders, sample requests, reads own data"
    identity: "entity_backed:WholesaleAccount"
    exclusive_operations: []
    shared_operations:
      - "POST /accounts/{id}/orders (own account only — X-User-ID == account id)"
      - "POST /accounts/{id}/standing-orders (own account only)"
      - "POST /accounts/{id}/sample-requests (own account only)"
      - "POST /standing-orders/{id}/pause|resume|cancel (own account's standing orders)"
      - "GET reads scoped to own account's resources (account, orders, invoices, standing orders, samples, fulfillments)"
