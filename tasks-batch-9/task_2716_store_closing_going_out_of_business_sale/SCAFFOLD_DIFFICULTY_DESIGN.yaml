  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: stage_activation_requires_license_period_to_cover_that_stage_window
        grounds:
          - state_machines.MarkdownStage.ARMED_to_ACTIVE
          - validations[priority=52]
          - errors[ERR_LICENSE_NOT_ACTIVE]
          - entities.GobLicense.fields.period_end_date
          - entities.MarkdownStage.fields.window_end_date
        distinguishing_aspect: |
          The gate is a relation between two different entities' data, not a state on the stage: one
          and the same APPROVED GobLicense permits stage 2 (whose half-open window ends 2026-10-13,
          last selling day 2026-10-12) and refuses stage 3 (window ending 2026-10-20, last selling
          day 2026-10-19) because the licence period ends 2026-10-14. The store stays SELLING and
          the licence stays APPROVED across both calls, so nothing about either entity's own state
          explains the difference.
        test_recipe:
          setup:
            - "One SELLING store in NY under an APPROVED licence for 2026-09-15..2026-10-14"
            - "Three stages: 1 (0.20, target 0.0000, [2026-09-15,2026-09-29)), 2 (0.40, target 0.0000, [2026-09-29,2026-10-13)), 3 (0.60, target 0.60, [2026-10-13,2026-10-20))"
            - "No sales days at all, so Store.realized_sell_through_pct is 0.0000 and the zero targets make every checkpoint ON_SCHEDULE"
          setup_api_calls:
