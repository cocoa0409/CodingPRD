# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Enumerative walk of §1.1–§1.7 claims not already covered by §1.8.
# Fixture shorthand reused across instances (replayed from empty DB each time):
#   BASE: portfolio P1 (start month 1) -> pm1 (PM Co) -> asset A1
#         (OFFICE, 100,000 sqft, acq 800,000,000 on 2024-06-15, hold 5y)
#   PLAN10: 10 single month-1 budget lines — RENT 11,000,000; PARKING 500,000;
#         OTHER_REVENUE 100,000; CAM 200,000; TAX 300,000; INSURANCE 50,000;
#         UTILITIES 80,000; MANAGEMENT_FEE 120,000; OTHER_OPEX 90,000;
#         CAPITAL 36,000,000.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: portfolio_create_applies_defaults
        claim_type: defaults
        grounds: [entities.Portfolio.fields.fiscal_year_start_month, entities.Portfolio.fields.base_currency]
        distinguishing_aspect: "Omitting optional inputs applies defaults base_currency=USD, fiscal_year_start_month=1, status=ACTIVE, risk_posture=NORMAL, total_value_cents=0, version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/portfolios", payload: { name: "P1" }, as: PortfolioDirector, captures: { p1: $.data.id, ccy: $.data.base_currency, fsm: $.data.fiscal_year_start_month, st: $.data.status, post: $.data.risk_posture, tv: $.data.total_value_cents, v: $.data.version } }
          assert:
            - "ccy == USD and fsm == 1 (defaults applied)"
            - "st == ACTIVE, post == NORMAL, tv == 0, v == 1 (system/computed initialization)"

      - name: asset_get_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns the error envelope with ERR_NOT_FOUND and http 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/assets/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Analyst, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND and http status 404; envelope response_type == error with meta.api_request_id present"

      - name: asset_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Asset.fields.asset_class, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Enum outside {OFFICE, RETAIL, INDUSTRIAL, MULTIFAMILY} is rejected before any state change."
        test_recipe:
          setup: ["portfolio + manager exist"]
          setup_api_calls:
            - { call: "POST /api/portfolios", payload: { name: "P1" }, as: PortfolioDirector, captures: { p1: $.data.id } }
            - { call: "POST /api/property-managers", payload: { firm_name: "PM Co", contact_email: "pm@x.com" }, as: PortfolioDirector, captures: { pm1: $.data.id } }
          trigger:
            - { call: "POST /api/assets", payload: { portfolio_id: "${p1}", property_manager_id: "${pm1}", name: "A1", address: "1 Main St", asset_class: "RETAILX", net_rentable_sqft: 100000, acquisition_price_cents: 800000000, acquisition_date: "2024-06-15", hold_period_years: 5 }, as: PortfolioDirector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST (400); GET /api/portfolios/${p1}/assets returns total_count == 0"

      - name: asset_create_future_acquisition_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_FUTURE_PERIOD]"]
        distinguishing_aspect: "acquisition_date 2026-08-02 is after the default logical clock 2026-08-01T00:00:00Z — pins both the temporal rule AND the clock default."
        test_recipe:
          setup: ["portfolio + manager exist; clock never set (default 2026-08-01T00:00:00Z)"]
          setup_api_calls:
            - { call: "POST /api/portfolios", payload: { name: "P1" }, as: PortfolioDirector, captures: { p1: $.data.id } }
            - { call: "POST /api/property-managers", payload: { firm_name: "PM Co", contact_email: "pm@x.com" }, as: PortfolioDirector, captures: { pm1: $.data.id } }
          trigger:
            - { call: "POST /api/assets", payload: { portfolio_id: "${p1}", property_manager_id: "${pm1}", name: "A1", address: "1 Main St", asset_class: "OFFICE", net_rentable_sqft: 100000, acquisition_price_cents: 800000000, acquisition_date: "2026-08-02", hold_period_years: 5 }, as: PortfolioDirector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FUTURE_PERIOD (422) — proves the unset clock reads 2026-08-01, not wall-clock time"

      - name: budget_lines_pagination_fields
        claim_type: listing
        grounds: [response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "21 created lines paginate 10/10/1 with total_count == 21 and has_more true/true/false; default limit is 10 when params omitted."
        test_recipe:
          setup: ["BASE + FY2027 DRAFT plan with 21 lines (RENT m1-12 + 9 singles)"]
          setup_api_calls:
            - { call: "POST /api/portfolios", payload: { name: "P1" }, as: PortfolioDirector, captures: { p1: $.data.id } }
            - { call: "POST /api/property-managers", payload: { firm_name: "PM Co", contact_email: "pm@x.com" }, as: PortfolioDirector, captures: { pm1: $.data.id } }
            - { call: "POST /api/assets", payload: { portfolio_id: "${p1}", property_manager_id: "${pm1}", name: "A1", address: "1 Main St", asset_class: "OFFICE", net_rentable_sqft: 100000, acquisition_price_cents: 800000000, acquisition_date: "2024-06-15", hold_period_years: 5 }, as: PortfolioDirector, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /api/business-plans", payload: { asset_id: "${a1}", fiscal_year: 2027, expected_asset_version: "${a1_v}" }, as: AssetManager, as_user_id: "am-1", captures: { pl1: $.data.id } }
            - call: "POST /api/budget-lines"
              payload:
                plan_id: "${pl1}"
                lines:
                  - { category: RENT_REVENUE, month_index: 1, budget_amount_cents: 11000000 }
                  - { category: RENT_REVENUE, month_index: 2, budget_amount_cents: 11000000 }
                  - { category: RENT_REVENUE, month_index: 3, budget_amount_cents: 11000000 }
                  - { category: RENT_REVENUE, month_index: 4, budget_amount_cents: 11000000 }
                  - { category: RENT_REVENUE, month_index: 5, budget_amount_cents: 11000000 }
                  - { category: RENT_REVENUE, month_index: 6, budget_amount_cents: 11000000 }
                  - { category: RENT_REVENUE, month_index: 7, budget_amount_cents: 11000000 }
                  - { category: RENT_REVENUE, month_index: 8, budget_amount_cents: 11000000 }
                  - { category: RENT_REVENUE, month_index: 9, budget_amount_cents: 11000000 }
                  - { category: RENT_REVENUE, month_index: 10, budget_amount_cents: 11000000 }
                  - { category: RENT_REVENUE, month_index: 11, budget_amount_cents: 11000000 }
                  - { category: RENT_REVENUE, month_index: 12, budget_amount_cents: 11000000 }
                  - { category: PARKING_REVENUE, month_index: 1, budget_amount_cents: 500000 }
                  - { category: OTHER_REVENUE, month_index: 1, budget_amount_cents: 100000 }
                  - { category: CAM_EXPENSE, month_index: 1, budget_amount_cents: 200000 }
                  - { category: TAX_EXPENSE, month_index: 1, budget_amount_cents: 300000 }
                  - { category: INSURANCE_EXPENSE, month_index: 1, budget_amount_cents: 50000 }
                  - { category: UTILITIES_EXPENSE, month_index: 1, budget_amount_cents: 80000 }
                  - { category: MANAGEMENT_FEE_EXPENSE, month_index: 1, budget_amount_cents: 120000 }
                  - { category: OTHER_OPEX, month_index: 1, budget_amount_cents: 90000 }
                  - { category: CAPITAL, month_index: 1, budget_amount_cents: 36000000 }
              as: AssetManager
              as_user_id: "am-1"
          trigger:
            - { call: "GET /api/business-plans/${pl1}/budget-lines?limit=10&offset=0", payload: {}, as: Analyst, captures: { tc1: "$.data[0].id" } }
            - { call: "GET /api/business-plans/${pl1}/budget-lines?limit=10&offset=20", payload: {}, as: Analyst }
          assert:
            - "Page 1: total_count == 21, has_more == true, 10 items, first item category RENT_REVENUE month 1 (created_at ASC)"
            - "Page 3 (offset 20): total_count == 21, has_more == false, exactly 1 item (CAPITAL month 1)"
            - "Omitted params default to limit=10, offset=0"

      - name: covenant_test_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.CovenantTest]
        distinguishing_aspect: "CovenantTest declares common_fields: false — records carry id and created_at only; no version/updated_at keys, and no update/delete endpoint exists in §1.5."
        test_recipe:
          setup: ["FIX_A1-lite: plan APPROVED with month-1 actuals (RENT 4,000,000 / CAM 500,000); loan 300M @ 1000bps; MIN_DSCR covenant 12,500"]
          setup_api_calls:
            - { call: "POST /api/portfolios", payload: { name: "P1" }, as: PortfolioDirector, captures: { p1: $.data.id } }
            - { call: "POST /api/property-managers", payload: { firm_name: "PM Co", contact_email: "pm@x.com" }, as: PortfolioDirector, captures: { pm1: $.data.id } }
            - { call: "POST /api/assets", payload: { portfolio_id: "${p1}", property_manager_id: "${pm1}", name: "A1", address: "1 Main St", asset_class: "OFFICE", net_rentable_sqft: 100000, acquisition_price_cents: 800000000, acquisition_date: "2024-06-15", hold_period_years: 5 }, as: PortfolioDirector, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /api/business-plans", payload: { asset_id: "${a1}", fiscal_year: 2026, expected_asset_version: "${a1_v}" }, as: AssetManager, as_user_id: "am-1", captures: { pl1: $.data.id } }
            - call: "POST /api/budget-lines"
              payload:
                plan_id: "${pl1}"
                lines:
                  - { category: RENT_REVENUE, month_index: 1, budget_amount_cents: 4200000 }
                  - { category: PARKING_REVENUE, month_index: 1, budget_amount_cents: 100000 }
                  - { category: OTHER_REVENUE, month_index: 1, budget_amount_cents: 50000 }
                  - { category: CAM_EXPENSE, month_index: 1, budget_amount_cents: 500000 }
                  - { category: TAX_EXPENSE, month_index: 1, budget_amount_cents: 300000 }
                  - { category: INSURANCE_EXPENSE, month_index: 1, budget_amount_cents: 50000 }
                  - { category: UTILITIES_EXPENSE, month_index: 1, budget_amount_cents: 80000 }
                  - { category: MANAGEMENT_FEE_EXPENSE, month_index: 1, budget_amount_cents: 120000 }
                  - { category: OTHER_OPEX, month_index: 1, budget_amount_cents: 90000 }
                  - { category: CAPITAL, month_index: 1, budget_amount_cents: 36000000 }
              as: AssetManager
              as_user_id: "am-1"
              captures: { rent_m1: "$.data[0].id", cam_m1: "$.data[3].id" }
            - { call: "POST /api/business-plans/${pl1}/submit", payload: {}, as: AssetManager, as_user_id: "am-1" }
            - { call: "POST /api/business-plans/${pl1}/approve", payload: {}, as: PortfolioDirector }
            - { call: "POST /api/actuals-reports", payload: { plan_id: "${pl1}", month_index: 1, lines: [ { budget_line_id: "${rent_m1}", actual_amount_cents: 4000000 }, { budget_line_id: "${cam_m1}", actual_amount_cents: 500000 } ] }, as: PropertyManager, as_user_id: "${pm1}", captures: { ar1: $.data.id } }
            - { call: "POST /api/actuals-reports/${ar1}/accept", payload: {}, as: AssetManager, as_user_id: "am-1" }
            - { call: "POST /api/loans", payload: { asset_id: "${a1}", lender_name: "Bank", principal_balance_cents: 300000000, annual_interest_rate_bps: 1000, origination_date: "2026-01-01", maturity_date: "2028-06-30" }, as: PortfolioDirector, captures: { ln1: $.data.id } }
            - { call: "POST /api/covenants", payload: { loan_id: "${ln1}", covenant_type: "MIN_DSCR", threshold_bps: 12500, test_frequency: "QUARTERLY" }, as: PortfolioDirector, captures: { cv1: $.data.id } }
            - { call: "POST /api/covenant-tests", payload: { covenant_id: "${cv1}", period_label: "2026-Q3" }, as: Analyst, captures: { t1: $.data.id } }
          trigger:
            - { call: "GET /api/covenants/${cv1}/covenant-tests", payload: {}, as: Analyst, captures: { got: "$.data[0].id" } }
          assert:
            - "got == ${t1}; the record exposes id, created_at, covenant_id, period_label, measured_value_bps, annualized_noi_cents_used, result — and MUST NOT expose version or updated_at"
            - "measured_value_bps == 14000 (month-1 NOI 3,500,000 x 12 / 1 -> 42,000,000; 42,000,000*10000/30,000,000)"

      - name: response_envelope_object_shape
        claim_type: creation
        grounds: [response_envelope]
        distinguishing_aspect: "Every success response wraps data in { meta: { api_request_id, api_request_timestamp }, response_type, data } — object type for single-entity GET."
        test_recipe:
          setup: ["one portfolio"]
          setup_api_calls:
            - { call: "POST /api/portfolios", payload: { name: "P1" }, as: PortfolioDirector, captures: { p1: $.data.id } }
          trigger:
            - { call: "GET /api/portfolios/${p1}", payload: {}, as: Lender, captures: { got: $.data.id } }
          assert:
            - "got == ${p1}; envelope has meta.api_request_id (string), meta.api_request_timestamp (ISO8601), response_type == object"

      - name: read_after_write_immediate_consistency
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "consistency_model immediate: the POST response body itself reflects the mutation and a subsequent GET agrees."
        test_recipe:
          setup: ["one portfolio"]
          setup_api_calls:
            - { call: "POST /api/portfolios", payload: { name: "P1" }, as: PortfolioDirector, captures: { p1: $.data.id, v0: $.data.version } }
          trigger:
            - { call: "POST /api/property-managers", payload: { firm_name: "PM Co", contact_email: "pm@x.com" }, as: PortfolioDirector, captures: { pm1: $.data.id, pm_st: $.data.status } }
            - { call: "GET /api/property-managers/${pm1}", payload: {}, as: Analyst, captures: { pm_st2: $.data.status, pm_v2: $.data.version } }
          assert:
            - "pm_st == ACTIVE in the create response and pm_st2 == ACTIVE on re-read (no lag)"
            - "pm_v2 == 1 (created version, no hidden mutations)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: plan_initial_state_is_draft
        claim_type: initial_state
        grounds: [state_machines.BusinessPlan]
        excluded_because:
          difficulty_instance: non_linear_state_machine / plan_revision_cycle_rejected_to_resubmitted
          rationale: "That instance asserts st0 == DRAFT on the create response."

      - name: plan_invalid_submit_transitions_rejected
        claim_type: invalid_transition
        grounds: [state_machines.BusinessPlan.DRAFT_to_SUBMITTED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "submit on an already-SUBMITTED plan and submit on an APPROVED plan are both rejected; no transition is defined from those states."
        test_recipe:
          setup: ["BASE + FY2027 plan with PLAN10 lines, SUBMITTED"]
          setup_api_calls:
            - { call: "POST /api/portfolios", payload: { name: "P1" }, as: PortfolioDirector, captures: { p1: $.data.id } }
            - { call: "POST /api/property-managers", payload: { firm_name: "PM Co", contact_email: "pm@x.com" }, as: PortfolioDirector, captures: { pm1: $.data.id } }
            - { call: "POST /api/assets", payload: { portfolio_id: "${p1}", property_manager_id: "${pm1}", name: "A1", address: "1 Main St", asset_class: "OFFICE", net_rentable_sqft: 100000, acquisition_price_cents: 800000000, acquisition_date: "2024-06-15", hold_period_years: 5 }, as: PortfolioDirector, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /api/business-plans", payload: { asset_id: "${a1}", fiscal_year: 2027, expected_asset_version: "${a1_v}" }, as: AssetManager, as_user_id: "am-1", captures: { pl1: $.data.id } }
            - call: "POST /api/budget-lines"
              payload:
                plan_id: "${pl1}"
                lines:
                  - { category: RENT_REVENUE, month_index: 1, budget_amount_cents: 11000000 }
                  - { category: PARKING_REVENUE, month_index: 1, budget_amount_cents: 500000 }
                  - { category: OTHER_REVENUE, month_index: 1, budget_amount_cents: 100000 }
                  - { category: CAM_EXPENSE, month_index: 1, budget_amount_cents: 200000 }
                  - { category: TAX_EXPENSE, month_index: 1, budget_amount_cents: 300000 }
                  - { category: INSURANCE_EXPENSE, month_index: 1, budget_amount_cents: 50000 }
                  - { category: UTILITIES_EXPENSE, month_index: 1, budget_amount_cents: 80000 }
                  - { category: MANAGEMENT_FEE_EXPENSE, month_index: 1, budget_amount_cents: 120000 }
                  - { category: OTHER_OPEX, month_index: 1, budget_amount_cents: 90000 }
                  - { category: CAPITAL, month_index: 1, budget_amount_cents: 36000000 }
              as: AssetManager
              as_user_id: "am-1"
            - { call: "POST /api/business-plans/${pl1}/submit", payload: {}, as: AssetManager, as_user_id: "am-1" }
          trigger:
            - { call: "POST /api/business-plans/${pl1}/submit", payload: {}, as: AssetManager, as_user_id: "am-1", captures: { err1: $.data.error_id } }
            - { call: "POST /api/business-plans/${pl1}/approve", payload: {}, as: PortfolioDirector }
            - { call: "POST /api/business-plans/${pl1}/submit", payload: {}, as: AssetManager, as_user_id: "am-1", captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_INVALID_STATE_TRANSITION (submit from SUBMITTED)"
            - "err2 == ERR_INVALID_STATE_TRANSITION (submit from APPROVED); plan remains APPROVED"

      - name: plan_submit_on_listed_asset_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.BusinessPlan.DRAFT_to_SUBMITTED, "errors[ERR_ASSET_NOT_OPERATING]"]
        distinguishing_aspect: "Guarded transition: plan submit requires the ASSET (cross-entity) to be OWNED; LISTED_FOR_SALE blocks with ERR_ASSET_NOT_OPERATING."
        test_recipe:
          setup: ["BASE with acquisition 2021-06-15 (sell_signal armed via hold years at default clock); SELL decision ratified+executed (asset LISTED_FOR_SALE); FY2027 DRAFT plan with PLAN10"]
          setup_api_calls:
            - { call: "POST /api/portfolios", payload: { name: "P1" }, as: PortfolioDirector, captures: { p1: $.data.id } }
            - { call: "POST /api/property-managers", payload: { firm_name: "PM Co", contact_email: "pm@x.com" }, as: PortfolioDirector, captures: { pm1: $.data.id } }
            - { call: "POST /api/assets", payload: { portfolio_id: "${p1}", property_manager_id: "${pm1}", name: "A1", address: "1 Main St", asset_class: "OFFICE", net_rentable_sqft: 100000, acquisition_price_cents: 800000000, acquisition_date: "2021-06-15", hold_period_years: 5 }, as: PortfolioDirector, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /api/business-plans", payload: { asset_id: "${a1}", fiscal_year: 2027, expected_asset_version: "${a1_v}" }, as: AssetManager, as_user_id: "am-1", captures: { pl1: $.data.id } }
            - call: "POST /api/budget-lines"
              payload:
                plan_id: "${pl1}"
                lines:
                  - { category: RENT_REVENUE, month_index: 1, budget_amount_cents: 11000000 }
                  - { category: PARKING_REVENUE, month_index: 1, budget_amount_cents: 500000 }
                  - { category: OTHER_REVENUE, month_index: 1, budget_amount_cents: 100000 }
                  - { category: CAM_EXPENSE, month_index: 1, budget_amount_cents: 200000 }
                  - { category: TAX_EXPENSE, month_index: 1, budget_amount_cents: 300000 }
                  - { category: INSURANCE_EXPENSE, month_index: 1, budget_amount_cents: 50000 }
                  - { category: UTILITIES_EXPENSE, month_index: 1, budget_amount_cents: 80000 }
                  - { category: MANAGEMENT_FEE_EXPENSE, month_index: 1, budget_amount_cents: 120000 }
                  - { category: OTHER_OPEX, month_index: 1, budget_amount_cents: 90000 }
                  - { category: CAPITAL, month_index: 1, budget_amount_cents: 36000000 }
              as: AssetManager
              as_user_id: "am-1"
            - { call: "POST /api/disposition-decisions", payload: { asset_id: "${a1}", trigger_type: "SELL" }, as: AssetManager, as_user_id: "am-1", captures: { dd1: $.data.id } }
            - { call: "POST /api/disposition-decisions/${dd1}/submit-review", payload: {}, as: AssetManager, as_user_id: "am-1" }
            - { call: "POST /api/disposition-decisions/${dd1}/ratify", payload: {}, as: InvestmentCommittee, as_user_id: "ic-1" }
            - { call: "POST /api/disposition-decisions/${dd1}/execute", payload: {}, as: PortfolioDirector }
          trigger:
            - { call: "POST /api/business-plans/${pl1}/submit", payload: {}, as: AssetManager, as_user_id: "am-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ASSET_NOT_OPERATING (409); plan remains DRAFT"

      - name: covenant_test_on_waived_covenant_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Covenant, "errors[ERR_COVENANT_NOT_TESTABLE]"]
        distinguishing_aspect: "WAIVED is terminal: recording a test on a WAIVED covenant fails with ERR_COVENANT_NOT_TESTABLE."
        test_recipe:
          setup: ["FIX_A2_30M (4 actuals months, NOI 30,000,000); loan 500M @ 500bps; covenant IN_BREACH via FAIL test; then WAIVED by Lender"]
          setup_api_calls:
            - { call: "POST /api/portfolios", payload: { name: "P1" }, as: PortfolioDirector, captures: { p1: $.data.id } }
            - { call: "POST /api/property-managers", payload: { firm_name: "PM Co", contact_email: "pm@x.com" }, as: PortfolioDirector, captures: { pm1: $.data.id } }
            - { call: "POST /api/assets", payload: { portfolio_id: "${p1}", property_manager_id: "${pm1}", name: "A1", address: "1 Main St", asset_class: "OFFICE", net_rentable_sqft: 100000, acquisition_price_cents: 800000000, acquisition_date: "2024-06-15", hold_period_years: 5 }, as: PortfolioDirector, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /api/business-plans", payload: { asset_id: "${a1}", fiscal_year: 2026, expected_asset_version: "${a1_v}" }, as: AssetManager, as_user_id: "am-1", captures: { pl1: $.data.id } }
            - call: "POST /api/budget-lines"
              payload:
                plan_id: "${pl1}"
                lines:
                  - { category: RENT_REVENUE, month_index: 1, budget_amount_cents: 3200000 }
                  - { category: CAM_EXPENSE, month_index: 1, budget_amount_cents: 500000 }
                  - { category: PARKING_REVENUE, month_index: 1, budget_amount_cents: 100000 }
                  - { category: OTHER_REVENUE, month_index: 1, budget_amount_cents: 50000 }
                  - { category: TAX_EXPENSE, month_index: 1, budget_amount_cents: 300000 }
                  - { category: INSURANCE_EXPENSE, month_index: 1, budget_amount_cents: 50000 }
                  - { category: UTILITIES_EXPENSE, month_index: 1, budget_amount_cents: 80000 }
                  - { category: MANAGEMENT_FEE_EXPENSE, month_index: 1, budget_amount_cents: 120000 }
                  - { category: OTHER_OPEX, month_index: 1, budget_amount_cents: 90000 }
                  - { category: CAPITAL, month_index: 1, budget_amount_cents: 36000000 }
              as: AssetManager
              as_user_id: "am-1"
              captures: { rent_m1: "$.data[0].id", cam_m1: "$.data[1].id" }
            - { call: "POST /api/business-plans/${pl1}/submit", payload: {}, as: AssetManager, as_user_id: "am-1" }
            - { call: "POST /api/business-plans/${pl1}/approve", payload: {}, as: PortfolioDirector }
