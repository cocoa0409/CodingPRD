        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: refund_approval_cascade_flags_guest_and_repriorities_waitlist
          rationale: "That §1.8 instance walks the full four-level chain — exception decision, ledger pair, Guest.lifetime_refunded_cents crossing the scrutiny threshold, and the re-prioritisation of that guest's WAITING waitlist entries — which is exactly the N-level end-to-end claim this row asks for."

      - name: cascading_side_effects_release_run_ordering_sensitivity
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: release_run_cascade_to_double_promotion_and_sold_out
          rationale: "Ordering sensitivity is the whole point of that §1.8 instance: the release pass must finish across every class in created_at order before the promotion pass starts, or an early class consumes a later class's inventory."

