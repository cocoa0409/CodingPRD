scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: hedge_policy_create_returns_201_with_system_defaults
        claim_type: creation
        grounds:
          - endpoints[POST /fuel/hedge-policies]
          - entities.HedgePolicy.fields.status
          - entities.HedgePolicy.fields.open_exception_count
        distinguishing_aspect: |
          A freshly created HedgePolicy echoes every input field verbatim and stamps
          exactly three server-owned values: status ACTIVE, open_exception_count 0
          and version 1. No caller may supply any of the three.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-CORNER", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 5.00, max_single_counterparty_pct: 100.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY", "WIDEBODY", "REGIONAL"] }
              as: RiskPolicyAdmin
              as_user_id: u_admin_1
          assert:
            - "HTTP 201."
            - "data.status == \"ACTIVE\"."
            - "data.open_exception_count == 0."
            - "data.version == 1."
            - "data.max_coverage_pct == 60.00 and data.min_coverage_pct == 5.00 and data.max_single_counterparty_pct == 100.00."
            - "data.permitted_instrument_types == [\"SWAP\", \"COLLAR\", \"CALL_OPTION\"]."
            - "data.eligible_fleet_types == [\"NARROWBODY\", \"WIDEBODY\", \"REGIONAL\"]."
            - "data.id is a UUID string with no type prefix; data.created_at and data.updated_at are ISO 8601 UTC with three fractional digits."

      - name: station_create_missing_required_avg_daily_liftings_returns_400
        claim_type: required_fields
        grounds:
          - endpoints[POST /fuel/stations]
          - entities.Station.fields.avg_daily_liftings_gallons
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          avg_daily_liftings_gallons is the days_cover denominator and therefore a
          required input with no default, unlike the three consortium fields on the
          same endpoint which are optional. Omitting it is ERR_INVALID_REQUEST at
          priority 3, not a Station with a null denominator.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /fuel/stations"
              payload: { iata_code: "MEM", name: "Memphis International", into_plane_fee_usd_per_gal: 0.0500 }
              as: RiskPolicyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400."
            - "data.error_id == \"ERR_INVALID_REQUEST\"."
            - "No Station row is persisted: GET /fuel/stations/{any-id} for the omitted row is impossible because no id was minted."

      - name: station_create_applies_consortium_and_inventory_defaults
        claim_type: defaults
        grounds:
          - entities.Station.fields.consortium_member
          - entities.Station.fields.consortium_share_pct
          - entities.Station.fields.consortium_pool_gallons
          - entities.Station.fields.inventory_gallons
          - entities.Station.fields.supply_posture
          - calculations.station_supply_posture
        distinguishing_aspect: |
          Omitting all three optional consortium inputs yields consortium_member
          false, consortium_share_pct 0 and consortium_pool_gallons 0, so the
          consortium entitlement is 0 and effective_inventory_gallons equals
          inventory_gallons 0. days_cover 0.00 is strictly below min_days_cover
          3.00, so a brand-new Station is born SHORT, not NORMAL.
        test_recipe:
          setup:
            - "One ACTIVE HedgePolicy with min_days_cover 3.00."
          setup_api_calls:
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-CORNER", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 5.00, max_single_counterparty_pct: 100.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY", "WIDEBODY", "REGIONAL"] }
              as: RiskPolicyAdmin
          trigger:
            - call: "POST /fuel/stations"
              payload: { iata_code: "MEM", name: "Memphis International", into_plane_fee_usd_per_gal: 0.0500, avg_daily_liftings_gallons: 100000 }
              as: RiskPolicyAdmin
              captures: { station_id: $.data.id }
          assert:
            - "HTTP 201."
            - "data.consortium_member == false."
            - "data.consortium_share_pct == 0."
            - "data.consortium_pool_gallons == 0."
            - "data.inventory_gallons == 0."
            - "data.effective_inventory_gallons == 0."
            - "data.days_cover == 0.00."
            - "data.supply_posture == \"SHORT\"."
            - "data.version == 1."

      - name: flight_leg_uplift_cap_binding_term_differs_across_three_legs
        claim_type: computed_fields
        grounds:
          - calculations.tankering_uplift_cap_gallons
          - entities.FlightLeg.fields.uplift_cap_gallons
          - entities.HedgePolicy.fields.max_tankering_uplift_gallons
        distinguishing_aspect: |
          uplift_cap_gallons is the minimum of three unrelated terms and each leg
          below is bound by a different one: leg FA100 by tank headroom
          (26500 - 15000 - 900 = 10600.00), leg FB200 by landing-weight headroom
          ((145000 - 128000) / 6.7 = 2537.31, a value no other term could produce),
          leg FC300 by the policy ceiling 12000.00. A single-term implementation
          gets at most one of the three right.
        test_recipe:
          setup:
            - "One ACTIVE HedgePolicy with max_tankering_uplift_gallons 12000."
            - "Two Stations and three FlightLegs with deliberately different tank and weight envelopes."
          setup_api_calls:
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-CORNER", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 5.00, max_single_counterparty_pct: 100.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY", "WIDEBODY", "REGIONAL"] }
              as: RiskPolicyAdmin
            - call: "POST /fuel/stations"
              payload: { iata_code: "DFW", name: "Dallas Fort Worth", into_plane_fee_usd_per_gal: 0.0450, avg_daily_liftings_gallons: 100000 }
              as: RiskPolicyAdmin
              captures: { st_dfw: $.data.id }
            - call: "POST /fuel/stations"
              payload: { iata_code: "ORD", name: "Chicago OHare", into_plane_fee_usd_per_gal: 0.0800, avg_daily_liftings_gallons: 80000 }
              as: RiskPolicyAdmin
              captures: { st_ord: $.data.id }
            - call: "POST /fuel/flight-legs"
              payload: { flight_number: "FA100", departure_date: "2027-02-10", origin_station_id: "${st_dfw}", destination_station_id: "${st_ord}", fleet_type: "NARROWBODY", planned_block_minutes: 210, planned_burn_gallons: 15000, tank_capacity_gallons: 26500, payload_lbs: 22000, max_takeoff_payload_lbs: 45000, landing_weight_lbs: 130000, max_landing_weight_lbs: 205000 }
              as: FuelOpsController
              captures: { leg_a: $.data.id }
            - call: "POST /fuel/flight-legs"
              payload: { flight_number: "FB200", departure_date: "2027-02-10", origin_station_id: "${st_dfw}", destination_station_id: "${st_ord}", fleet_type: "NARROWBODY", planned_block_minutes: 210, planned_burn_gallons: 15000, tank_capacity_gallons: 26500, payload_lbs: 22000, max_takeoff_payload_lbs: 45000, landing_weight_lbs: 128000, max_landing_weight_lbs: 145000 }
              as: FuelOpsController
              captures: { leg_b: $.data.id }
            - call: "POST /fuel/flight-legs"
              payload: { flight_number: "FC300", departure_date: "2027-02-10", origin_station_id: "${st_dfw}", destination_station_id: "${st_ord}", fleet_type: "WIDEBODY", planned_block_minutes: 400, planned_burn_gallons: 20000, tank_capacity_gallons: 40000, payload_lbs: 60000, max_takeoff_payload_lbs: 120000, landing_weight_lbs: 100000, max_landing_weight_lbs: 200000 }
              as: FuelOpsController
              captures: { leg_c: $.data.id }
          trigger:
            - call: "GET /fuel/flight-legs/${leg_a}"
              payload: {}
              as: FuelOpsController
            - call: "GET /fuel/flight-legs/${leg_b}"
              payload: {}
              as: FuelOpsController
            - call: "GET /fuel/flight-legs/${leg_c}"
              payload: {}
              as: FuelOpsController
          assert:
            - "Leg FA100: HTTP 200 and data.uplift_cap_gallons == 10600.00 (tank headroom binds; weight headroom is 11194.03 and the policy ceiling 12000)."
            - "Leg FB200: HTTP 200 and data.uplift_cap_gallons == 2537.31 (landing-weight headroom binds; tank headroom is 10600)."
            - "Leg FC300: HTTP 200 and data.uplift_cap_gallons == 12000.00 (policy ceiling binds; tank headroom is 19100 and weight headroom 14925.37)."
            - "All three legs report actual_block_minutes == null and actual_uplift_gallons == null."

      - name: get_hedge_program_unknown_id_returns_404
        claim_type: not_found
        grounds:
          - endpoints[GET /fuel/hedge-programs/{id}]
          - validations[priority=4]
          - errors[ERR_PROGRAM_NOT_FOUND]
        distinguishing_aspect: |
          A well-formed but unknown UUID on a path segment is the priority-4
          existence check, so the response is 404 ERR_PROGRAM_NOT_FOUND and not the
          403/400 of any lower-priority row and not an empty 200 envelope.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /fuel/hedge-programs/6f1a5c92-0b3d-4c77-9f21-8ad4e2b70c11"
              payload: {}
              as: FuelAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404."
            - "data.error_id == \"ERR_PROGRAM_NOT_FOUND\"."
            - "response_type == \"error\" and meta.api_request_id is present."

      - name: instrument_create_unknown_counterparty_id_returns_404
        claim_type: parent_relationships
        grounds:
          - endpoints[POST /fuel/hedge-programs/{id}/instruments]
          - entities.HedgeInstrument.fields.counterparty_id
          - validations[priority=5]
          - errors[ERR_COUNTERPARTY_NOT_FOUND]
        distinguishing_aspect: |
          The path HedgeProgram resolves, so the failure is the priority-5 body-FK
          check on counterparty_id, not the priority-4 path check. The rejection
          happens before any state or fiscal rule, so the program's version and
          open_instrument_count are untouched.
        test_recipe:
          setup:
            - "One SIZING HedgeProgram with consumption_basis_gallons 4400000 and no child instruments."
          setup_api_calls:
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-CORNER", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 5.00, max_single_counterparty_pct: 100.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY", "WIDEBODY", "REGIONAL"] }
              as: RiskPolicyAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "NARROWBODY", route_group: "DOMESTIC_SHORT", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 4000000 }
              as: FuelAnalyst
              captures: { f1: $.data.id }
            - call: "POST /fuel/consumption-forecasts/${f1}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/hedge-programs"
              payload: { policy_id: "${policy_id}", program_code: "HP-CORNER", period_start_month: "2027-01", period_end_month: "2027-03", route_groups: ["DOMESTIC_SHORT"], target_coverage_pct: 30.00 }
              as: FuelAnalyst
              captures: { prog_id: $.data.id }
            - call: "POST /fuel/hedge-programs/${prog_id}/size"
              payload: {}
              as: FuelAnalyst
              captures: { prog_v: $.data.version }
          trigger:
            - call: "POST /fuel/hedge-programs/${prog_id}/instruments"
              payload: { counterparty_id: "9c2b7d41-5e6f-4a08-b3c9-7d1e0f2a5b64", instrument_type: "SWAP", notional_gallons: 1000000, maturity_month: "2027-02", expected_hedge_program_version: "${prog_v}", strike_usd_per_gal: 2.5000 }
              as: FuelAnalyst
              captures: { err: $.data.error_id }
            - call: "GET /fuel/hedge-programs/${prog_id}"
              payload: {}
              as: FuelAnalyst
          assert:
            - "Trigger call 1: HTTP 404 and data.error_id == \"ERR_COUNTERPARTY_NOT_FOUND\"."
            - "Trigger call 2: data.version == 2 (unchanged by the rejected create) and data.open_instrument_count == 0."
            - "Trigger call 2: data.consumption_basis_gallons == 4400000 and data.planned_coverage_pct_delta == 0.00."

      - name: forecast_create_invalid_enum_season_returns_400
        claim_type: type_constraints
        grounds:
          - endpoints[POST /fuel/consumption-forecasts]
          - entities.ConsumptionForecast.fields.season
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          season is a closed four-member enum that keys SEASON_FACTOR, so a
          non-member string is rejected at priority 3 rather than defaulted to a
          1.00 factor at sizing time.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "NARROWBODY", route_group: "DOMESTIC_SHORT", season: "MONSOON", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 4000000 }
              as: FuelAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400."
            - "data.error_id == \"ERR_INVALID_REQUEST\"."

      - name: consumption_forecast_list_filters_then_paginates
        claim_type: listing
        grounds:
          - endpoints[GET /fuel/consumption-forecasts]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Five forecasts exist, two of them PUBLISHED. status=PUBLISHED with
          limit 1 and offset 1 must report total_count 2 (the filtered cardinality,
          not the table's 5) and has_more false, returning exactly the second
          PUBLISHED row in created_at ASC order.
        test_recipe:
          setup:
            - "Five ConsumptionForecast rows; f1 (NARROWBODY/DOMESTIC_SHORT/SUMMER) and f2 (WIDEBODY/TRANSATLANTIC/SUMMER) are PUBLISHED, f3-f5 remain DRAFT."
          setup_api_calls:
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "NARROWBODY", route_group: "DOMESTIC_SHORT", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 4000000 }
              as: FuelAnalyst
              captures: { f1: $.data.id }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "WIDEBODY", route_group: "TRANSATLANTIC", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 3000000 }
              as: FuelAnalyst
              captures: { f2: $.data.id }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "NARROWBODY", route_group: "DOMESTIC_SHORT", season: "WINTER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 1000000 }
              as: FuelAnalyst
              captures: { f3: $.data.id }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "REGIONAL", route_group: "DOMESTIC_LONG", season: "FALL", period_start_month: "2027-05", period_end_month: "2027-08", forecast_gallons: 500000 }
              as: FuelAnalyst
              captures: { f4: $.data.id }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "WIDEBODY", route_group: "TRANSPACIFIC", season: "SPRING", period_start_month: "2027-03", period_end_month: "2027-06", forecast_gallons: 2000000 }
              as: FuelAnalyst
              captures: { f5: $.data.id }
            - call: "POST /fuel/consumption-forecasts/${f1}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/consumption-forecasts/${f2}/publish"
              payload: {}
              as: FuelAnalyst
          trigger:
            - call: "GET /fuel/consumption-forecasts"
              payload: { status: "PUBLISHED", limit: 1, offset: 1 }
              as: TreasuryRiskManager
            - call: "GET /fuel/consumption-forecasts"
              payload: { fleet_type: "NARROWBODY" }
              as: TreasuryRiskManager
          assert:
            - "Trigger call 1: HTTP 200, response_type == \"array\", len(data) == 1, meta.total_count == 2, meta.limit == 1, meta.offset == 1, meta.has_more == false."
            - "Trigger call 1: data[0].fleet_type == \"WIDEBODY\" and data[0].route_group == \"TRANSATLANTIC\" and data[0].status == \"PUBLISHED\" (created_at ASC, offset 1 of 2)."
            - "Trigger call 2: len(data) == 2, meta.total_count == 2, meta.limit == 10, meta.offset == 0, meta.has_more == false; the two rows are f1 (PUBLISHED) and f3 (DRAFT)."

      - name: effectiveness_test_row_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.EffectivenessTest.common_fields
          - entities.EffectivenessTest.fields.tested_by_user_id
          - endpoints[POST /fuel/hedge-instruments/{id}/effectiveness-tests]
          - endpoints[GET /fuel/hedge-instruments/{id}/effectiveness-tests]
        distinguishing_aspect: |
          EffectivenessTest is the one entity declared common_fields false: the
          created row carries id and created_at but no updated_at and no version,
          and §1.5 exposes no update or delete verb for it, so a written test is
          append-only audit evidence. hedge_instrument_id and tested_by_user_id are
          taken from the path and the X-User-ID header, never from the body.
        test_recipe:
          setup:
            - "One ACTIVE HedgeProgram with an EXECUTED, DESIGNATED 1000000-gallon SWAP."
          setup_api_calls:
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-CORNER", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 5.00, max_single_counterparty_pct: 100.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY", "WIDEBODY", "REGIONAL"] }
              as: RiskPolicyAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /fuel/counterparties"
              payload: { counterparty_code: "DLRC", legal_name: "Dealer C Bank NA", credit_rating: "A", credit_limit_usd: 2000000.00 }
              as: RiskPolicyAdmin
              captures: { cp_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "NARROWBODY", route_group: "DOMESTIC_SHORT", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 4000000 }
              as: FuelAnalyst
              captures: { f1: $.data.id }
            - call: "POST /fuel/consumption-forecasts/${f1}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/hedge-programs"
              payload: { policy_id: "${policy_id}", program_code: "HP-CORNER", period_start_month: "2027-01", period_end_month: "2027-03", route_groups: ["DOMESTIC_SHORT"], target_coverage_pct: 30.00 }
              as: FuelAnalyst
              captures: { prog_id: $.data.id }
            - call: "POST /fuel/hedge-programs/${prog_id}/size"
              payload: {}
              as: FuelAnalyst
              captures: { prog_v: $.data.version }
            - call: "POST /fuel/hedge-programs/${prog_id}/instruments"
              payload: { counterparty_id: "${cp_id}", instrument_type: "SWAP", notional_gallons: 1000000, maturity_month: "2027-03", expected_hedge_program_version: "${prog_v}", strike_usd_per_gal: 2.5000 }
              as: FuelAnalyst
              captures: { inst_id: $.data.id }
            - call: "POST /fuel/hedge-programs/${prog_id}/submit"
              payload: {}
              as: FuelAnalyst
              as_user_id: u_analyst_1
            - call: "POST /fuel/hedge-programs/${prog_id}/activate"
              payload: {}
              as: TreasuryRiskManager
              as_user_id: u_trm_1
            - call: "POST /fuel/hedge-instruments/${inst_id}/execute"
              payload: {}
              as: TreasuryRiskManager
              as_user_id: u_trm_1
            - call: "POST /fuel/hedge-instruments/${inst_id}/designate"
              payload: {}
              as: HedgeAccountant
              as_user_id: u_acct_1
          trigger:
            - call: "POST /fuel/hedge-instruments/${inst_id}/effectiveness-tests"
              payload: { period_month: "2027-02", hedge_change_usd: -120000.00, hedged_item_change_usd: 100000.00 }
              as: HedgeAccountant
              as_user_id: u_acct_1
            - call: "GET /fuel/hedge-instruments/${inst_id}/effectiveness-tests"
              payload: { result: "PASS" }
              as: HedgeAccountant
          assert:
            - "Trigger call 1: HTTP 201, data.period_ratio == 1.2000, data.cumulative_ratio == 1.2000, data.result == \"PASS\"."
            - "Trigger call 1: data.hedge_instrument_id == ${inst_id} and data.tested_by_user_id == \"u_acct_1\"."
            - "Trigger call 1: data contains keys id and created_at but contains NO key updated_at and NO key version."
            - "Trigger call 2: len(data) == 1, meta.total_count == 1, and data[0].created_at equals the created_at of trigger call 1."
            - "§1.5 declares no PUT, PATCH or DELETE verb on /fuel/hedge-instruments/{id}/effectiveness-tests, so the row cannot be amended after the fact."

  # ===========================================================================
  - section: state_machines
    instances:

      - name: hedge_program_is_born_in_draft_with_zeroed_derived_fields
        claim_type: initial_state
        grounds:
          - state_machines.HedgeProgram.initial_state
          - entities.HedgeProgram.fields.status
          - entities.HedgeProgram.fields.consumption_basis_gallons
          - entities.HedgeProgram.fields.compliance_posture
        distinguishing_aspect: |
          A created HedgeProgram is DRAFT with every derived field at its zero value
          and compliance_posture COMPLIANT, even though a PUBLISHED forecast that
          would size it already exists: sizing happens only on the explicit
          DRAFT -> SIZING transition, never at creation.
        test_recipe:
          setup:
            - "One ACTIVE HedgePolicy and one PUBLISHED forecast that matches the program's route_groups."
          setup_api_calls:
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-CORNER", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 5.00, max_single_counterparty_pct: 100.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY", "WIDEBODY", "REGIONAL"] }
              as: RiskPolicyAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "NARROWBODY", route_group: "DOMESTIC_SHORT", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 4000000 }
              as: FuelAnalyst
              captures: { f1: $.data.id }
            - call: "POST /fuel/consumption-forecasts/${f1}/publish"
              payload: {}
              as: FuelAnalyst
          trigger:
            - call: "POST /fuel/hedge-programs"
              payload: { policy_id: "${policy_id}", program_code: "HP-CORNER", period_start_month: "2027-01", period_end_month: "2027-03", route_groups: ["DOMESTIC_SHORT"], target_coverage_pct: 30.00 }
              as: FuelAnalyst
              captures: { prog_id: $.data.id }
          assert:
            - "HTTP 201."
            - "data.status == \"DRAFT\" and data.version == 1."
            - "data.consumption_basis_gallons == 0 and data.hedged_gallons == 0 and data.delta_adjusted_gallons == 0."
            - "data.coverage_pct_notional == 0.00 and data.coverage_pct_delta == 0.00 and data.planned_coverage_pct_delta == 0.00."
            - "data.designated_mtm_usd == 0.00 and data.undesignated_mtm_usd == 0.00 and data.earnings_volatility_usd == 0.00."
            - "data.compliance_posture == \"COMPLIANT\", data.open_instrument_count == 0, data.return_count == 0, data.submitted_by_user_id == null."

      - name: activate_and_submit_from_draft_both_return_409
        claim_type: invalid_transitions
        grounds:
          - state_machines.HedgeProgram.transitions
          - errors[ERR_PROGRAM_INVALID_STATE]
          - validations[priority=7]
        distinguishing_aspect: |
          DRAFT has exactly one outgoing edge, /size. Both /submit (legal only from
          SIZING) and /activate (legal only from PENDING_APPROVAL) are rejected with
          409 ERR_PROGRAM_INVALID_STATE at priority 7 — before the segregation-of-duties
          and coverage-floor gates that guard /activate at priorities 18 and 19, so
          neither ERR_SEGREGATION_OF_DUTIES nor ERR_COVERAGE_FLOOR_NOT_MET may surface.
        test_recipe:
          setup:
            - "One DRAFT HedgeProgram, never sized."
          setup_api_calls:
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-CORNER", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 5.00, max_single_counterparty_pct: 100.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY", "WIDEBODY", "REGIONAL"] }
              as: RiskPolicyAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /fuel/hedge-programs"
              payload: { policy_id: "${policy_id}", program_code: "HP-CORNER", period_start_month: "2027-01", period_end_month: "2027-03", route_groups: ["DOMESTIC_SHORT"], target_coverage_pct: 30.00 }
              as: FuelAnalyst
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /fuel/hedge-programs/${prog_id}/activate"
              payload: {}
              as: TreasuryRiskManager
              as_user_id: u_trm_1
              captures: { err_a: $.data.error_id }
            - call: "POST /fuel/hedge-programs/${prog_id}/submit"
              payload: {}
              as: FuelAnalyst
              as_user_id: u_analyst_1
              captures: { err_b: $.data.error_id }
            - call: "GET /fuel/hedge-programs/${prog_id}"
              payload: {}
              as: FuelAnalyst
          assert:
            - "Trigger call 1: HTTP 409 and data.error_id == \"ERR_PROGRAM_INVALID_STATE\"."
            - "Trigger call 2: HTTP 409 and data.error_id == \"ERR_PROGRAM_INVALID_STATE\"."
            - "Trigger call 3: data.status == \"DRAFT\", data.version == 1, data.submitted_by_user_id == null, data.return_count == 0."

      - name: republishing_a_published_forecast_returns_409_and_keeps_published_at
        claim_type: idempotency
        grounds:
          - state_machines.ConsumptionForecast.transitions
          - entities.ConsumptionForecast.fields.published_at
          - errors[ERR_FORECAST_INVALID_STATE]
        distinguishing_aspect: |
          /publish is not idempotent-by-repetition: the second call is rejected 409
          rather than silently re-stamping published_at. The observable proof is that
          published_at and version are byte-identical to the first publication, so no
          side effect fired on the rejected call.
        test_recipe:
          setup:
            - "One PUBLISHED ConsumptionForecast."
          setup_api_calls:
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "NARROWBODY", route_group: "DOMESTIC_SHORT", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 4000000 }
              as: FuelAnalyst
              captures: { f1: $.data.id }
            - call: "POST /fuel/consumption-forecasts/${f1}/publish"
              payload: {}
              as: FuelAnalyst
              captures: { pub_at: $.data.published_at, f1_v: $.data.version }
          trigger:
            - call: "POST /fuel/consumption-forecasts/${f1}/publish"
              payload: {}
              as: FuelAnalyst
              captures: { err: $.data.error_id }
            - call: "GET /fuel/consumption-forecasts"
              payload: { status: "PUBLISHED" }
              as: FuelAnalyst
          assert:
            - "Trigger call 1: HTTP 409 and data.error_id == \"ERR_FORECAST_INVALID_STATE\"."
            - "Trigger call 2: len(data) == 1, data[0].published_at == ${pub_at}, data[0].version == ${f1_v}, data[0].status == \"PUBLISHED\"."

      - name: terminated_proposed_trade_rejects_execute_and_second_terminate
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.HedgeInstrument.terminal_states
