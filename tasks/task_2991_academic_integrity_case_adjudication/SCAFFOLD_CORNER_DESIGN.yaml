            - "the EVIDENCE appeal is FILED successfully (HTTP 201, Appeal.${appeal_evid_id}.status == SUBMITTED) - the gate is not on POST /integrity/appeals"
            - "screening it with ACCEPT_FOR_REVIEW returns HTTP 409 with data.error_id == ERR_INFORMAL_RESOLUTION_NOT_APPEALABLE"
            - "screening it with DENY_NO_GROUNDS returns HTTP 409 with the SAME data.error_id == ERR_INFORMAL_RESOLUTION_NOT_APPEALABLE - priority 30 is evaluated before the decision branch, so an EVIDENCE appeal on an accepted informal resolution can never leave SUBMITTED"
            - "the third filing returns HTTP 409 with data.error_id == ERR_APPEAL_ALREADY_FILED (both because ${appeal_evid_id} is still SUBMITTED and because APPEAL_MAX_PER_CASE is 2)"
            - "GET /integrity/cases/${case_id}/appeals returns total_count 2"

      - name: state_before_notice_period_priority_conflict_corner_stub
        claim_type: Priority Ordering
        grounds:
          - validations[priority=13]
          - validations[priority=38]
        distinguishing_aspect: |
          Scheduling a hearing for a case that is still INTAKE_REVIEW with a start_at only two days out
          violates BOTH priority 13 and priority 38, and the response must be ERR_CASE_STATE_INVALID.
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / state_check_priority_13_outranks_notice_period_priority_38_and_returns_case_state_invalid"
          rationale: |
            The §1.8 instance already builds the doubly-violating request and asserts that the response
            carries ERR_CASE_STATE_INVALID rather than ERR_NOTICE_PERIOD_TOO_SHORT, then repairs each
            violation in turn to show that both rules are live. Re-testing it here would be identical.

      - name: referential_before_effective_date_priority_conflict_corner_stub
        claim_type: Priority conflict
        grounds:
          - validations[priority=32]
          - validations[priority=44]
        distinguishing_aspect: |
          A sanction proposal that names an unknown grade component AND an effective_from before
          decided_at must return ERR_GRADE_COMPONENT_NOT_FOUND (404), not
          ERR_SANCTION_EFFECTIVE_BEFORE_DECISION (409).
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / referential_check_priority_32_outranks_effective_date_priority_44_on_sanction_create"
          rationale: |
            The §1.8 instance issues exactly that doubly-invalid proposal, pins the 404 body, and then
            fixes the component code alone to expose the 409 underneath. It also covers
            ERR_SANCTION_EFFECTIVE_BEFORE_DECISION, so both errors are already exercised.

      - name: reporter_training_currency_gate_corner_stub
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=24]
          - errors.ERR_REPORTER_TRAINING_LAPSED
        distinguishing_aspect: |
          Submitting a report requires the reporting faculty member's newest training completion to be
          within TRAINING_VALID_DAYS (730) of the clock, measured on the submit call rather than on
          report creation.
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / report_submit_depends_on_the_faculty_members_derived_training_status"
          rationale: |
            That instance drafts an identical report under a reporter whose newest completion is
            2024-07-31 (731 days before the 2026-08-01 clock), asserts ERR_REPORTER_TRAINING_LAPSED on
            submit, records a fresh completion and shows the same submit succeeding.

      - name: evidence_sufficiency_gate_on_triage_corner_stub
        claim_type: Aggregate validation
        grounds:
          - validations[priority=31]
          - errors.ERR_EVIDENCE_INCOMPLETE
        distinguishing_aspect: |
          A triage ACCEPT is refused with ERR_EVIDENCE_INCOMPLETE while the report's aggregate
          evidence_strength_score is below TRIAGE_ACCEPT_MIN_EVIDENCE_SCORE (20.0), even though every
          individual evidence item is valid.
        excluded_because:
          difficulty_instance: "combinatorial_formula / evidence_strength_score_seven_step_dependency_chain_mode_a"
          rationale: |
            That instance walks the score up from a single DOCUMENT item (5.00, below the floor, triage
            ACCEPT refused with ERR_EVIDENCE_INCOMPLETE) through the SEED-A configuration (60.00, triage
            ACCEPT succeeds), so the aggregate gate is asserted on both sides of the floor.

      - name: room_and_instructor_calendar_conflict_gates_corner_stub
        claim_type: Temporal validation
        grounds:
          - validations[priority=39]
          - validations[priority=40]
          - validations[priority=50]
          - errors.ERR_ROOM_BUFFER_CONFLICT
          - errors.ERR_INSTRUCTOR_CALENDAR_CONFLICT
          - errors.ERR_ROOM_DAILY_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Hearing rooms compare buffered closed intervals (so touching endpoints collide) and cap
          sessions per calendar day, while instructor meeting calendars compare unbuffered half-open
          intervals (so back-to-back meetings are legal).
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / hearing_room_closed_buffered_intervals_reject_touching_endpoints_and_enforce_the_daily_cap"
          rationale: |
            That instance and its sibling
            resource_temporal_overlap / instructor_calendar_half_open_intervals_allow_back_to_back_meetings
            together pin ERR_ROOM_BUFFER_CONFLICT on the exactly-touching buffered boundary,
            ERR_ROOM_DAILY_CAPACITY_EXCEEDED on the third session of one day, and
            ERR_INSTRUCTOR_CALENDAR_CONFLICT on a one-minute overlap while accepting the abutting pair.

      - name: pending_advisor_request_blocks_convene_corner_stub
        claim_type: Conditional validation
        grounds:
          - validations[priority=48]
          - errors.ERR_ADVISOR_REQUEST_PENDING
        distinguishing_aspect: |
          A hearing may not be convened while any AdvisorEngagement for the case is still REQUESTED,
          even though an engagement that has been DENIED does not block it.
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / convene_is_blocked_while_any_advisor_engagement_sits_in_requested"
          rationale: |
            That instance convenes against a REQUESTED engagement (ERR_ADVISOR_REQUEST_PENDING), denies
            it and convenes successfully, then shows a second REQUESTED engagement re-blocking the
            adjourned session's replacement.

      - name: remand_round_limit_corner_stub
        claim_type: Conditional validation
        grounds:
          - validations[priority=60]
          - errors.ERR_REMAND_LIMIT_REACHED
        distinguishing_aspect: |
          The first REMANDED outcome is permitted because case.hearing_round is 1; the second is refused
          with ERR_REMAND_LIMIT_REACHED (409) once the rehearing has pushed hearing_round to 2.
        excluded_because:
          difficulty_instance: "non_linear_state_machine / appeal_remand_reopens_the_hearing_loop_once_then_hits_the_round_limit"
          rationale: |
            That instance drives the full loop - decide, appeal, remand, rehear, decide, appeal again,
            remand again - and asserts the 409 body on the second remand plus hearing_round 1 then 2.

  - section: endpoints
    instances:
      - name: list_filters_are_conjunctive_and_pagination_bounds_are_enforced_at_their_edges
        claim_type: Standard CRUD
        grounds:
          - endpoints[GET /integrity/cases]
          - endpoints[GET /integrity/students]
          - validations[priority=7]
          - errors.ERR_INVALID_PAGINATION
          - errors.ERR_STUDENT_NOT_FOUND
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three separable claims about list endpoints. (a) Multiple filters combine with AND, so
          pathway=FORMAL AND adjudication_status=DISMISSED returns an EMPTY page with total_count 0 even
          though each filter alone matches one row. (b) A filter that names a foreign key which does not
          exist is a 404 (ERR_STUDENT_NOT_FOUND), not an empty page. (c) limit 1 and limit 100 are both
          accepted while limit 0, limit 101 and offset -1 are ERR_INVALID_PAGINATION - the bounds are
          inclusive at 1 and 100.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; ENGL, reporter Rita trained, students Sam and Lee, ENGL-201"
            - "Sam's case is FORMAL and open; Lee's case is DISMISSED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/departments"
              payload: { code: "ENGL", name: "English", enrolled_student_count: 2000, faculty_headcount: 5 }
              as: IntegrityOfficer
              captures: { dept_engl_id: $.data.id }
            - call: "POST /integrity/faculty-members"
              payload: { department_id: "${dept_engl_id}", full_name: "Rita Reporter", email: "rita@u.edu" }
              as: IntegrityOfficer
              captures: { reporter_id: $.data.id }
            - call: "POST /integrity/faculty-members/${reporter_id}/training-completions"
              payload: { module_code: "AI-101", completed_at: "2026-01-15T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/students"
              payload: { full_name: "Sam Student", email: "sam@u.edu", program_code: "BA-ENG", class_year: 3 }
              as: IntegrityOfficer
              captures: { student_a_id: $.data.id }
            - call: "POST /integrity/students"
              payload: { full_name: "Lee Learner", email: "lee@u.edu", program_code: "BA-HIS", class_year: 2 }
              as: IntegrityOfficer
              captures: { student_b_id: $.data.id }
            - call: "POST /integrity/course-offerings"
              payload: { department_id: "${dept_engl_id}", instructor_id: "${reporter_id}", course_code: "ENGL-201", term_code: "2026FA", grade_components: [{ code: "ESSAY", max_points: 200, weight_pct: 40 }, { code: "MIDTERM", max_points: 70, weight_pct: 30 }, { code: "PROJECT", max_points: 90, weight_pct: 20 }, { code: "FINAL", max_points: 180, weight_pct: 10 }] }
              as: IntegrityOfficer
              captures: { offering_id: $.data.id }
            - call: "POST /integrity/reports"
              payload: { offering_id: "${offering_id}", student_id: "${student_a_id}", alleged_violation_type: "PLAGIARISM", narrative: "Sam's essay reuses an uncited source.", incident_at: "2026-07-20T00:00:00Z", component_scores: [{ code: "ESSAY", earned_points: 156 }, { code: "MIDTERM", earned_points: 68 }, { code: "PROJECT", earned_points: 56 }, { code: "FINAL", earned_points: 113 }] }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { report_a_id: $.data.id }
            - call: "POST /integrity/evidence-items"
              payload: { report_id: "${report_a_id}", kind: "SIMILARITY_REPORT", sha256: "1111111111111111111111111111111111111111111111111111111111111111", page_count: 4, similarity_pct: 45.00 }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
            - call: "POST /integrity/reports/${report_a_id}/submit"
