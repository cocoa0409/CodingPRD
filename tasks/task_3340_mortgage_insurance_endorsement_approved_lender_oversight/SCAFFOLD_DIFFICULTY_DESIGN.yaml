          assert:
            - "captured ${e_defect_score} == 50 and captured ${e_defect_tier} == TIER_1 (40 * 1.25 default multiplier, boundary 50 >= 50)"
            - "captured ${e_review_status} == CLOSURE_PENDING (hop 1)"
            - "captured ${e_case_integrity} == IMPAIRED (hop 2)"
            - "captured ${e_escrow_status} == FROZEN with captured ${e_escrow_origin} == IMPAIRMENT (hop 3)"
            - "Defect.${e_defect_id}.status == CONFIRMED and confirmed_by_user_id == appr-beta"

      - name: lender_suspension_cascades_case_block_escrow_freeze
        grounds:
          - state_machines.Lender.APPROVED_to_SUSPENDED
          - state_machines.LoanCase.UNDERWRITE_SUBMITTED_to_BLOCKED
          - state_machines.RepairEscrow.OPEN_to_FROZEN
          - state_machines.Lender.SUSPENDED_to_APPROVED
        distinguishing_aspect: "Depth-2 chain from POST /mi/lenders/{id}/status-change action=SUSPEND: suspension mutates the in-flight case UNDERWRITE_SUBMITTED -> BLOCKED, and that case mutation freezes its OPEN escrow (freeze_origin=SUSPENSION); REINSTATE reverses both hops — a different trigger and propagation pattern than the defect-confirm cascade."
        test_recipe:
          setup:
            - "Lender APPROVED; case in UNDERWRITE_SUBMITTED (not yet endorsed)."
            - "OPEN escrow on the case? Escrow creation requires case ENDORSED — instead the escrow attaches after endorsement; here the case is pre-endorsement, so the escrow assertion uses a second case that IS endorsed with an OPEN escrow and a THIRD case in UNDERWRITE_SUBMITTED. SUSPEND blocks only the UNDERWRITE_SUBMITTED case; the endorsed case's escrow stays OPEN (cascade B hop 2 follows hop 1 and hop 1 never fires for ENDORSED cases)."
          setup_api_calls:
            - *d2_clock
            - *d1_lender
            - call: "POST /mi/lenders/${d1_lender_id}/financial-filings"
