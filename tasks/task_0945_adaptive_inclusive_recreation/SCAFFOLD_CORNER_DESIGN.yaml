  - section: endpoints
    instances:
      - name: logical_clock_defaults_to_2026_05_01_before_any_set_call
        claim_type: Conditional action
        grounds:
          - endpoints
          - validations[priority=29]
          - errors[ERR_ENROLLMENT_CUTOFF_PASSED]
        distinguishing_aspect: "Without any POST /recreation/_clock/set_current_utc the clock reads exactly 2026-05-01T00:00:00Z, so a session starting 2026-05-01T12:00Z is inside the 24-hour cutoff and one starting 2026-05-02T00:00Z is exactly on the boundary and accepted."
        test_recipe:
          setup:
            - "No clock call has been made at any point in this test."
            - "Two OPEN sessions: S_NEAR starting 2026-05-01T12:00Z and S_EDGE starting 2026-05-02T00:00Z."
            - "One ACTIVE INDEPENDENT participant."
          setup_api_calls:
            - call: "POST /recreation/fee-scale-bands"
              payload: { household_size_min: 1, household_size_max: 6, income_band: "BAND_C", per_session_cents: 4000, series_cents: 24000 }
