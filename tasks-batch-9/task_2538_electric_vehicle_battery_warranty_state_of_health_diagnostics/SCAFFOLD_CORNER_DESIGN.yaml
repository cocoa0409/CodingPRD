        distinguishing_aspect: |
          Actor identity is a THIRD, separate rung: the role is present and authorized, so neither
          401 nor 403 applies, yet the endpoint records an opaque identity and cannot proceed without
          it. It is a 400 ERR_ACTOR_REQUIRED, and it must fire before the priority-17 state check on
