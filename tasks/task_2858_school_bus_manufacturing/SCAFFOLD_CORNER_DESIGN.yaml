          assert:
            - "the D-NV agent's start fails 403 ERR_NOT_ASSIGNED_DEALER even though the task is OPEN and would be startable by its owner"
            - "PlantScheduler's start fails 403 ERR_ROLE_NOT_PERMITTED — the role gate (2) precedes the ownership gate (18)"
            - "the D-TX agent's start returns 200 with status IN_PROGRESS and no kit counter movement"
            - "the owner's second start fails 409 ERR_TASK_STATE_INVALID (start requires OPEN)"
            - "the stranger's second attempt still reports ERR_NOT_ASSIGNED_DEALER, not ERR_TASK_STATE_INVALID: ownership is checked before state, so a peer cannot infer the task's status from the error id"
            - "complete by the owner returns 200 COMPLETED, consumed_kits 1 / reserved_kits 0, the bus service_status RECALL_CLOSED and D-TX open_recall_unit_count back to 0 with standing GOOD"
            - "cancel by ComplianceOfficer on the COMPLETED task fails 409 ERR_TASK_STATE_INVALID and leaves consumed_kits at 1"

      - name: shared_read_operations_are_open_to_every_declared_role
        claim_type: shared_operations
        grounds:
          - roles
          - endpoints[GET /bus-models/{id}]
          - endpoints[GET /state-spec-profiles]
          - endpoints[GET /dealers]
          - response_envelope
        distinguishing_aspect: |
          Every GET in this API lists all six roles, including the entity-backed DealerAgent, and the read is
          role-blind: the same by-id body is returned to a QualityInspector and to a DealerAgent, with no
          field redaction and no ownership scoping on reads (ownership is enforced only on the DealerAgent's
          write verbs). Listing a DRAFT profile is likewise visible to everyone — publication status changes
          what may be cited, not who may look.
        test_recipe:
          setup:
            - "One BusModel, one DRAFT StateSpecProfile and one Dealer exist"
          setup_api_calls:
            - call: "POST /bus-models"
              payload: { model_code: "TYPE_C_CONV", body_class: "TYPE_C", base_seat_capacity: 71, base_emergency_exit_count: 5, base_price_cents: 12750000, body_joint_strength_kn: 58.0, max_battery_bays: 6, curb_weight_lb: 21500 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { model_c_id: $.data.id }
            - call: "POST /state-spec-profiles"
              payload: { state_code: "TX", school_year: "2026-2027", min_seat_capacity: 71, min_emergency_exit_count: 5, min_joint_strength_kn: 55.0, required_route_range_mi: 400.0, requires_eight_lamp_system: true, requires_crossing_arm: true, required_mirror_config: "CROSSVIEW", terrain_class: "FLAT" }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { tx_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-TX", dealer_name: "Lone Star Bus Sales", licensed_state_codes: ["TX"], training_capacity_per_month: 12 }
              as: ContractsAdmin
              as_user_id: "contracts-01"
              captures: { dealer_tx_id: $.data.id }
          trigger:
            - call: "GET /bus-models/${model_c_id}"
              payload: {}
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { read_sales: $.data.model_code, ver_sales: $.data.version }
            - call: "GET /bus-models/${model_c_id}"
              payload: {}
              as: QualityInspector
              as_user_id: "qc-01"
              captures: { read_qc: $.data.model_code, ver_qc: $.data.version }
            - call: "GET /bus-models/${model_c_id}"
              payload: {}
              as: DealerAgent
              as_user_id: "${dealer_tx_id}"
              captures: { read_dealer: $.data.model_code, joint_dealer: $.data.body_joint_strength_kn }
            - call: "GET /state-spec-profiles"
              payload: { status: "DRAFT" }
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { drafts_seen: $.data }
            - call: "GET /dealers"
              payload: { certification_standing: "GOOD" }
              as: DealerAgent
              as_user_id: "${dealer_tx_id}"
              captures: { dealers_seen: $.data }
          assert:
            - "all three by-id reads return 200 with identical bodies: model_code TYPE_C_CONV, body_joint_strength_kn 58.0 and version 1 — no role-based redaction"
            - "the DRAFT profile is listed for PlantScheduler with total_count 1: read access does not depend on publication status"
            - "GET /dealers filtered to GOOD returns the one dealer to a DealerAgent, including the dealer that is not itself if more existed — reads are not ownership-scoped"
            - "no read changes any version or updated_at"

  - section: cross_cutting_complexity_layers
    instances:

      - name: bid_revision_rejects_a_stale_expected_bid_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[bid-revision-stale-bid]
          - errors[ERR_STALE_BID_VERSION]
          - validations[priority=19]
          - endpoints[POST /bids/{id}/revisions]
        distinguishing_aspect: |
          Every write to a Bid bumps its version, so a client that read the bid once and then appends two
          revisions with the same expected_bid_version is refused on the second: the guard protects the
          offered_* configuration the revision would silently overwrite, not the row's existence. The refusal
          is 412 (not 409), leaves revision_round where it was, and the retry with the observed version 2
          succeeds and marks the earlier revision superseded.
        test_recipe:
          setup:
            - "TX fixture with SOL-TX-124; one DRAFT bid at version 1 offering the CROSSVIEW TX configuration"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ContractsAdmin
              as_user_id: "contracts-01"
            - call: "POST /bus-models"
              payload: { model_code: "TYPE_C_CONV", body_class: "TYPE_C", base_seat_capacity: 71, base_emergency_exit_count: 5, base_price_cents: 12750000, body_joint_strength_kn: 58.0, max_battery_bays: 6, curb_weight_lb: 21500 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { model_c_id: $.data.id }
            - call: "POST /propulsion-packages"
              payload: { package_code: "DSL-100", compatible_bus_model_id: "${model_c_id}", propulsion_type: "DIESEL", option_price_cents: 1250000, cold_weather_derate_pct: 0.03, reserve_floor_pct: 0.05, fuel_capacity_gal: 100.0, rated_mpg: 7.2 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { pkg_dsl_id: $.data.id }
            - call: "POST /state-spec-profiles"
              payload: { state_code: "TX", school_year: "2026-2027", min_seat_capacity: 71, min_emergency_exit_count: 5, min_joint_strength_kn: 55.0, required_route_range_mi: 400.0, requires_eight_lamp_system: true, requires_crossing_arm: true, required_mirror_config: "CROSSVIEW", terrain_class: "FLAT" }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { tx_id: $.data.id }
            - call: "POST /state-spec-profiles/${tx_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-01"
            - call: "POST /solicitations"
              payload: { solicitation_code: "SOL-TX-124", buyer_type: "DISTRICT", buyer_name: "Plano ISD", spec_profile_id: "${tx_id}", unit_count: 1, required_delivery_date: "2026-12-01", price_cap_cents_per_unit: 40000000 }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { sol_id: $.data.id }
            - call: "POST /bids"
              payload: { solicitation_id: "${sol_id}", bus_model_id: "${model_c_id}", propulsion_package_id: "${pkg_dsl_id}", unit_count: 1, offered_seat_capacity: 71, offered_emergency_exit_count: 5, offered_mirror_config: "CROSSVIEW", offered_lap_shoulder_belts: false, offered_eight_lamp_system: true, offered_crossing_arm: true, offered_rollover_reinforcement: false }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { bid_id: $.data.id, bid_v1: $.data.version, price_v1: $.data.provisional_unit_price_cents, round_v1: $.data.revision_round }
          trigger:
            - call: "POST /bids/${bid_id}/revisions"
              payload: { expected_bid_version: "${bid_v1}", offered_seat_capacity: 71, offered_emergency_exit_count: 5, offered_mirror_config: "STANDARD", offered_lap_shoulder_belts: false, offered_eight_lamp_system: true, offered_crossing_arm: true, offered_rollover_reinforcement: false, note: "value-engineered mirrors" }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { rev_1_id: $.data.id, rev_1_round: $.data.round_index, rev_1_price: $.data.unit_price_cents, rev_1_superseded: $.data.is_superseded }
            - call: "POST /bids/${bid_id}/revisions"
              payload: { expected_bid_version: "${bid_v1}", offered_seat_capacity: 71, offered_emergency_exit_count: 5, offered_mirror_config: "CROSSVIEW_HEATED", offered_lap_shoulder_belts: false, offered_eight_lamp_system: true, offered_crossing_arm: true, offered_rollover_reinforcement: false }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { err_stale: $.data.error_id }
            - call: "GET /bids/${bid_id}"
              payload: {}
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { bid_v2: $.data.version, price_after_rev1: $.data.provisional_unit_price_cents, mirror_after_rev1: $.data.offered_mirror_config, round_after_rev1: $.data.revision_round, compliance_after_rev1: $.data.spec_compliance_status, exceptions_after_rev1: $.data.exception_count }
            - call: "POST /bids/${bid_id}/revisions"
              payload: { expected_bid_version: "${bid_v2}", offered_seat_capacity: 71, offered_emergency_exit_count: 5, offered_mirror_config: "CROSSVIEW", offered_lap_shoulder_belts: false, offered_eight_lamp_system: true, offered_crossing_arm: true, offered_rollover_reinforcement: false }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { rev_2_id: $.data.id, rev_2_round: $.data.round_index, rev_2_price: $.data.unit_price_cents }
            - call: "GET /bids/${bid_id}/revisions"
              payload: { is_superseded: true }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { superseded_list: $.data }
            - call: "GET /bids/${bid_id}"
              payload: {}
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { bid_v3: $.data.version, price_final: $.data.provisional_unit_price_cents, compliance_final: $.data.spec_compliance_status }
          assert:
            - "the bid is created at version 1 with revision_round 0 and provisional_unit_price_cents 14641571"
            - "revision round 1 returns 201 with round_index 1, is_superseded false and unit_price_cents 14582808 (dropping the CROSSVIEW mirror removes 57400 of options and 1363 of dealer prep)"
            - "the bid now reports version 2, provisional_unit_price_cents 14582808, offered_mirror_config STANDARD, revision_round 1 and spec_compliance_status CONFORMING_WITH_EXCEPTIONS with exception_count 1 — the mirror mismatch is an exceptable item, not a mandatory one"
            - "the second revision replaying expected_bid_version 1 fails 412 ERR_STALE_BID_VERSION: no BidRevision is appended, revision_round stays 1 and the CROSSVIEW_HEATED configuration is not applied"
            - "the retry with expected_bid_version 2 returns 201 with round_index 2 and unit_price_cents 14641571, and the bid returns to version 3 / CONFORMING"
            - "GET /bids/${bid_id}/revisions?is_superseded=true returns exactly the round-1 revision"

      - name: slot_creation_rejects_a_stale_expected_production_line_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[slot-create-stale-line]
          - errors[ERR_STALE_LINE_VERSION]
          - validations[priority=20]
          - endpoints[POST /build-slots]
          - endpoints[POST /build-slots/{id}/commit]
        distinguishing_aspect: |
          The line's version is the occupancy picture, and BOTH slot creation and slot commit advance it —
          so the stale-version refusal fires for a client that merely created a slot a moment ago as well as
          for one whose picture was invalidated by someone else's commit, even though the requested window is
          still completely free. The refusal is checked before the window-overlap and capacity rules, so an
          unimpeachable window is still rejected while its author's view is out of date.
        test_recipe:
          setup:
            - "TX 2-unit order with two minted units; line L-A1 (capacity 30, changeover 3) at version 1"
            - "Clock at 2026-09-01T00:00:00Z; promised_delivery_date 2026-12-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ContractsAdmin
              as_user_id: "contracts-01"
            - call: "POST /bus-models"
              payload: { model_code: "TYPE_C_CONV", body_class: "TYPE_C", base_seat_capacity: 71, base_emergency_exit_count: 5, base_price_cents: 12750000, body_joint_strength_kn: 58.0, max_battery_bays: 6, curb_weight_lb: 21500 }
