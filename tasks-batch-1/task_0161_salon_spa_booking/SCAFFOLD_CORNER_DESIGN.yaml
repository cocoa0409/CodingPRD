scaffold_corner_design:
  # =========================================================================
  # Entities — creation, retrieval, listing, not-found, required fields,
  # defaults, computed/system fields, type constraints, uniqueness, FK.
  # =========================================================================
  - section: entities
    instances:
      - name: create_salon_returns_201_with_defaults_applied
        claim_type: Defaults
        grounds:
          - entities.Salon.fields.no_show_fee_pct
          - entities.Salon.fields.tip_split_policy
          - entities.Salon.fields.no_show_suspend_threshold
        distinguishing_aspect: "POST /salons with only name applies defaults no_show_fee_pct 0.50, tip_split_policy DIRECT, no_show_suspend_threshold 3, and current_utc == created_at."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /salons"
              payload: { name: "Defaults Salon" }
              as: SalonOwner
              captures: { sid: $.data.id }
          assert:
            - "response.status == 201"
            - "Salon.${sid}.no_show_fee_pct == 0.50"
            - "Salon.${sid}.tip_split_policy == DIRECT"
            - "Salon.${sid}.no_show_suspend_threshold == 3"
            - "Salon.${sid}.version == 1"

      - name: create_stylist_missing_compensation_model_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Stylist.fields.compensation_model
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /stylists without the required compensation_model field returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A salon exists."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "S" }
              as: SalonOwner
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "No Model" }
              as: SalonOwner
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_stylist_invalid_enum_compensation_model_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Stylist.fields.compensation_model
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "compensation_model not in {COMMISSION, BOOTH_RENT} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A salon exists."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "S" }
              as: SalonOwner
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "Bad Enum", compensation_model: "HOURLY" }
              as: SalonOwner
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: get_stylist_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
          - endpoints
        distinguishing_aspect: "GET /stylists/{random-uuid} for an id that does not exist returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "A salon exists; no stylist with the queried id."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "S" }
              as: SalonOwner
              captures: { sid: $.data.id }
          trigger:
            - call: "GET /stylists/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: cross_salon_stylist_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Stylist.fields.salon_id
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "Fetching a stylist of salon A under salon B's path returns ERR_NOT_FOUND (404) — salon scoping enforced."
        test_recipe:
          setup:
            - "Two salons A and B; a stylist created under A."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "A" }
              as: SalonOwner
              captures: { sidA: $.data.id }
            - call: "POST /salons"
              payload: { name: "B" }
              as: SalonOwner
              captures: { sidB: $.data.id }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "S", compensation_model: "COMMISSION" }
              as: SalonOwner
              captures: { st: $.data.id }
          trigger:
            - call: "GET /stylists/${st}"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: duplicate_client_email_per_salon_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Client.fields.email
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Registering a second non-archived client with an email already used (case-insensitive) in the same salon returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A salon with one client email dup@x.com."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "S" }
              as: SalonOwner
              captures: { sid: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "First", email: "dup@x.com" }
              as: FrontDesk
              captures: { cli1: $.data.id }
          trigger:
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "Second", email: "DUP@x.com" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: duplicate_sku_per_salon_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.ProductSku.fields.sku
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Creating a second ProductSku with a sku code already present in the salon returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A salon with SKU code SH-1 created."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "S" }
              as: SalonOwner
              captures: { sid: $.data.id }
            - call: "POST /product-skus"
              payload: { salon_id: "${sid}", sku: "SH-1", name: "Shampoo", unit_price_cents: 2000, qty_on_hand: 5 }
              as: SalonOwner
              captures: { sku1: $.data.id }
          trigger:
            - call: "POST /product-skus"
              payload: { salon_id: "${sid}", sku: "SH-1", name: "Other", unit_price_cents: 1000, qty_on_hand: 3 }
              as: SalonOwner
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: appointment_end_utc_computed_from_duration
        claim_type: Computed Fields
        grounds:
          - entities.Appointment.fields.end_utc
          - entities.Service.fields.duration_minutes
        distinguishing_aspect: "An appointment booked at 13:00 for a 45-minute service has end_utc == 2026-07-01T13:45:00Z; client-supplied end_utc (if any) is ignored."
        test_recipe:
          setup:
            - "Salon, stylist buffer 0, chair, 45-min service base 5000 deposit 0, client. Clock at 12:00."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "S" }
              as: SalonOwner
              captures: { sid: $.data.id, salon_v0: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "S1", compensation_model: "COMMISSION", buffer_minutes: 0 }
              as: SalonOwner
              captures: { st1: $.data.id, st1_v0: $.data.version }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair A", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { chA: $.data.id }
            - call: "POST /services"
              payload: { salon_id: "${sid}", name: "Cut", duration_minutes: 45, base_price_cents: 5000, deposit_pct: 0.0, requires_room: false }
              as: SalonOwner
              captures: { svc: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "C1", email: "end@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T12:00:00Z", expected_salon_version: "${salon_v0}" }
              as: SalonOwner
          trigger:
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T13:00:00Z", expected_stylist_version: "${st1_v0}" }
              as: FrontDesk
              captures: { appt: $.data.id }
          assert:
            - "Appointment.${appt}.end_utc == 2026-07-01T13:45:00Z"
            - "Appointment.${appt}.status == BOOKED"

      - name: list_stylists_paginated_envelope
        claim_type: Listing
        grounds:
          - endpoints
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /stylists?limit=1&offset=0 returns response_type array with total_count and has_more reflecting two stylists."
        test_recipe:
          setup:
            - "A salon with two stylists."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "S" }
              as: SalonOwner
              captures: { sid: $.data.id }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "A", compensation_model: "COMMISSION" }
              as: SalonOwner
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "B", compensation_model: "BOOTH_RENT" }
              as: SalonOwner
          trigger:
            - call: "GET /stylists?limit=1&offset=0"
              payload: {}
              as: FrontDesk
          assert:
            - "response.response_type == array"
            - "response.meta.total_count == 2"
            - "response.meta.has_more == true"

      - name: system_fields_ignored_on_create
        claim_type: System Fields
        grounds:
          - entities.Stylist.common_fields
        distinguishing_aspect: "Client-supplied id/version/created_at on POST are ignored: a created stylist gets a server-minted UUID id and version == 1 regardless of body."
        test_recipe:
          setup:
            - "A salon exists."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "S" }
              as: SalonOwner
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "Sys", compensation_model: "COMMISSION" }
              as: SalonOwner
              captures: { st: $.data.id, v: $.data.version }
          assert:
            - "Stylist.${st}.version == 1"
            - "response.status == 201"

  # =========================================================================
  # State Machines — invalid transitions, terminal lockdown, idempotency,
  # initial state, valid transitions not in §1.8.
  # =========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_appointment_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Appointment.BOOKED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling an already-CANCELLED appointment returns ERR_INVALID_STATE (409); no second deposit refund fires."
        test_recipe:
          setup:
            - "Salon, stylist buffer 0, chair, service base 4000 deposit 0.5, client, clock 12:00, appointment at 13:00 then cancelled."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "S" }
              as: SalonOwner
              captures: { sid: $.data.id, salon_v0: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "S1", compensation_model: "COMMISSION", buffer_minutes: 0 }
              as: SalonOwner
              captures: { st1: $.data.id, st1_v0: $.data.version }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair A", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { chA: $.data.id }
            - call: "POST /services"
              payload: { salon_id: "${sid}", name: "Cut", duration_minutes: 30, base_price_cents: 4000, deposit_pct: 0.5, requires_room: false }
              as: SalonOwner
              captures: { svc: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "C1", email: "cc2@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T12:00:00Z", expected_salon_version: "${salon_v0}" }
              as: SalonOwner
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T13:00:00Z", expected_stylist_version: "${st1_v0}" }
              as: FrontDesk
              captures: { appt: $.data.id }
            - call: "POST /appointments/${appt}/cancel"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /appointments/${appt}/cancel"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Client.${cli}.wallet_credit_cents == 2000"

      - name: no_show_before_start_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Appointment.BOOKED_to_NO_SHOW
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Marking a no-show while Salon.current_utc < start_utc violates the slot-has-begun precondition and returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "Salon, stylist buffer 0, chair, service base 5000 deposit 0, client, clock at 12:00, appointment at 13:00 (still future)."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "S" }
              as: SalonOwner
              captures: { sid: $.data.id, salon_v0: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "S1", compensation_model: "COMMISSION", buffer_minutes: 0 }
              as: SalonOwner
              captures: { st1: $.data.id, st1_v0: $.data.version }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair A", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { chA: $.data.id }
            - call: "POST /services"
              payload: { salon_id: "${sid}", name: "Cut", duration_minutes: 30, base_price_cents: 5000, deposit_pct: 0.0, requires_room: false }
              as: SalonOwner
              captures: { svc: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "C1", email: "ns@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T12:00:00Z", expected_salon_version: "${salon_v0}" }
              as: SalonOwner
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T13:00:00Z", expected_stylist_version: "${st1_v0}" }
              as: FrontDesk
              captures: { appt: $.data.id }
          trigger:
            - call: "POST /appointments/${appt}/no-show"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: void_already_voided_checkout_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Checkout.SETTLED_to_VOIDED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Voiding a checkout already in VOIDED (terminal) returns ERR_INVALID_STATE (409); inventory is not restored a second time."
        test_recipe:
          setup:
            - "Salon, stylist buffer 0, chair, service base 6000 deposit 0, client, SKU qty 10. Appointment at 13:00 completed with 2-unit line, clock 14:00, then checkout voided once (qty back to 10)."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "S", no_show_fee_pct: 0.0 }
              as: SalonOwner
              captures: { sid: $.data.id, salon_v0: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "S1", compensation_model: "COMMISSION", buffer_minutes: 0 }
              as: SalonOwner
              captures: { st1: $.data.id, st1_v0: $.data.version }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair A", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { chA: $.data.id }
            - call: "POST /services"
              payload: { salon_id: "${sid}", name: "Cut", duration_minutes: 30, base_price_cents: 6000, deposit_pct: 0.0, requires_room: false }
              as: SalonOwner
              captures: { svc: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "C1", email: "vv@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /product-skus"
              payload: { salon_id: "${sid}", sku: "SK-1", name: "P", unit_price_cents: 1000, qty_on_hand: 10 }
              as: SalonOwner
              captures: { sku1: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T12:00:00Z", expected_salon_version: "${salon_v0}" }
              as: SalonOwner
              captures: { salon_v1: $.data.version }
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T13:00:00Z", expected_stylist_version: "${st1_v0}" }
              as: FrontDesk
              captures: { appt: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T14:00:00Z", expected_salon_version: "${salon_v1}" }
              as: SalonOwner
            - call: "POST /checkouts"
              payload: { appointment_id: "${appt}", tip_cents: 0, retail_lines: [ { product_sku_id: "${sku1}", quantity: 2 } ] }
              as: FrontDesk
              captures: { co: $.data.id }
            - call: "POST /checkouts/${co}/void"
              payload: {}
              as: SalonOwner
          trigger:
            - call: "POST /checkouts/${co}/void"
              payload: {}
              as: SalonOwner
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "ProductSku.${sku1}.qty_on_hand == 10"

      - name: reinstate_active_membership_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Membership.PAST_DUE_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Reinstating a membership already ACTIVE (not PAST_DUE) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "Salon, plan, client, membership ACTIVE."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "S" }
              as: SalonOwner
              captures: { sid: $.data.id }
            - call: "POST /membership-plans"
              payload: { salon_id: "${sid}", name: "Gold", monthly_fee_cents: 5000, service_discount_pct: 0.2 }
              as: SalonOwner
              captures: { plan: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "C1", email: "re@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /memberships"
              payload: { client_id: "${cli}", plan_id: "${plan}" }
              as: FrontDesk
              captures: { mem: $.data.id }
          trigger:
            - call: "POST /memberships/${mem}/reinstate"
              payload: {}
              as: SalonOwner
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: lapse_cancelled_membership_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Membership.ACTIVE_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Lapsing a CANCELLED (terminal) membership returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "Salon, plan, client, membership cancelled."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "S" }
              as: SalonOwner
              captures: { sid: $.data.id }
            - call: "POST /membership-plans"
              payload: { salon_id: "${sid}", name: "Gold", monthly_fee_cents: 5000, service_discount_pct: 0.2 }
              as: SalonOwner
              captures: { plan: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "C1", email: "lc@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /memberships"
              payload: { client_id: "${cli}", plan_id: "${plan}" }
              as: FrontDesk
              captures: { mem: $.data.id }
            - call: "POST /memberships/${mem}/cancel"
              payload: {}
              as: SalonOwner
          trigger:
            - call: "POST /memberships/${mem}/lapse"
              payload: {}
              as: SalonOwner
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: checkout_completed_appointment_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Appointment.BOOKED_to_COMPLETED
          - errors[ERR_ALREADY_CHECKED_OUT]
        distinguishing_aspect: "A second POST /checkouts for an already-COMPLETED appointment returns ERR_ALREADY_CHECKED_OUT (409)."
        test_recipe:
          setup:
            - "Salon, stylist buffer 0, chair, service base 6000 deposit 0, client, clock 14:00, appointment at 13:00 already checked out."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "S", no_show_fee_pct: 0.0 }
              as: SalonOwner
              captures: { sid: $.data.id, salon_v0: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "S1", compensation_model: "COMMISSION", buffer_minutes: 0 }
              as: SalonOwner
              captures: { st1: $.data.id, st1_v0: $.data.version }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair A", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { chA: $.data.id }
            - call: "POST /services"
              payload: { salon_id: "${sid}", name: "Cut", duration_minutes: 30, base_price_cents: 6000, deposit_pct: 0.0, requires_room: false }
              as: SalonOwner
              captures: { svc: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "C1", email: "dc@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
