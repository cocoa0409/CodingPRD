      - name: committee_hearing_windows_are_half_open_but_a_thirty_minute_changeover_buffer_refuses_adjacency
        grounds:
          - calculations.committee_hearing_window_occupancy
          - validations.priority_160.ERR_COMMITTEE_HEARING_WINDOW_CONFLICT
          - entities.CommitteeReferral.fields.hearing_window_start_utc
          - entities.CommitteeReferral.fields.hearing_window_end_utc
          - endpoints.POST_bills_referrals
        distinguishing_aspect: |
          Resource entity: Committee. Interval semantics: HALF-OPEN [start, end) with
          a 30-minute CHANGEOVER_BUFFER_MINUTES added to the END of every EXISTING
          window, under SINGLE occupancy (any overlap after buffering refuses). Three
          probes pin all three edges: a window starting exactly at the existing end
          (16:00:00Z) is refused because it lands inside the buffer; a window starting
          exactly at the buffered end (16:30:00Z) is admitted because that boundary is
          exclusive; and a window ENDING exactly at the existing start (14:00:00Z) is
          admitted because no buffer is added to an existing window's front.
