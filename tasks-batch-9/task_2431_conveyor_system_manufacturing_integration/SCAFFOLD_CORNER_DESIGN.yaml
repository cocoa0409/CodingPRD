              as: DesignEngineer
          trigger:
            - call: "GET /projects/${proj_l4}"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-093"
              captures: { v1_l4: $.data.version, dv1_l4: $.data.design_version }
            - call: "POST /projects/${proj_l4}/simulations"
              payload: { method: "DEGRADED_AVAILABILITY" }
              as: DesignEngineer
              captures: { sim_l4: $.data.id }
            - call: "GET /projects/${proj_l4}"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-093"
              captures: { v2_l4: $.data.version }
            - call: "POST /projects/${proj_l4}/design-freeze"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-093"
              captures: { v3_l4: $.data.version }
            - call: "POST /spare-part-lines"
              payload: { project_id: "${proj_l4}", part_no: "BLT-1500-01", criticality: "CRITICAL", unit_cost_cents: 850000, min_stock_qty: 2, lead_time_days: 90 }
              as: ProjectDirector
