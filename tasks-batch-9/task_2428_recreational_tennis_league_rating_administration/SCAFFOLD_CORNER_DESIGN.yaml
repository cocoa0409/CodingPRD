      - name: dynamic_rating_over_two_lines_rounds_each_line_before_averaging
        claim_type: Precision
        grounds:
          - calculations.player_dynamic_rating
        distinguishing_aspect: "The rounding ORDER is the whole claim. Line 1 gives 3.5 + 0.5*(5/19) = 3.631578947..., line 2 gives 3.5 + 0.5*(6/18) = 3.666666667.... Rounding each line first yields (3.632 + 3.667) / 2 = 3.6495, which round_half_up takes to 3.650. Averaging the unrounded values yields 3.649122807..., which rounds to 3.649. Only the pinned order produces 3.650, so 3.649 is a hard fail rather than an acceptable variant."
