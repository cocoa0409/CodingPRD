  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies over DIFFERENT entity pairs
  #   instance 1 → RankList transition gated by ScoreCard states (2 hops away)
  #   instance 2 → Contract transition gated by CredentialItem states
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: rank_list_submit_gated_by_scorecard_states_two_entities_away
        grounds:
          - validations.priority_10.ERR_INSUFFICIENT_EVALUATIONS
          - state_machines.RankList.DRAFT_to_COMMITTEE_REVIEW
          - state_machines.ScoreCard.DRAFT_to_SUBMITTED
          - global_constants.MIN_SCORECARDS_PER_ENTRY
        dependency: |
          RankList.status may leave DRAFT only when, for EVERY RankListEntry on the list, the
          entry's Application carries at least MIN_SCORECARDS_PER_ENTRY (2) ScoreCard rows whose
          status is in {SUBMITTED, LOCKED}. The gating rows live two entities away
          (RankList -> RankListEntry -> Application -> ScoreCard) and a DRAFT card does not count,
          so the blocking condition is a STATE of the far entity, not its mere existence.
        distinguishing_aspect: |
          Both score cards exist as rows on the ranked application, so an implementation that counts
          ScoreCard rows rather than SUBMITTED/LOCKED ScoreCard rows lets the list through on the
          first attempt. Submitting the second card — which changes no row on RankList at all —
          is what unblocks the transition.
        test_recipe:
          setup:
            - "one Program in RANKING, app1 ADVANCED with interview COMPLETED"
            - "two ScoreCard rows exist for app1: sc1 SUBMITTED and sc2 still DRAFT"
            - "one DRAFT RankList holding app1 at rank_position 1"
