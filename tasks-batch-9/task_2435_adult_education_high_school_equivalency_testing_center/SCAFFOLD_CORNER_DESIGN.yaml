            - "the EMPLOYMENT_Q2 outcome with no credential reference returns 201 with data.status == 'RECORDED', data.weight == 1.25 and data.allocation_status == 'UNALLOCATED' - the evidence rule is conditional on measure_type"
            - "GET /outcome-records?funding_period_id=${fp}&limit=10&offset=0 returns total_count == 1 - the rejected outcome was not persisted"

