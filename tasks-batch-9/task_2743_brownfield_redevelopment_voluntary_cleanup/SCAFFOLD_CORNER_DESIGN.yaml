            - *c_p2fc
            - *c_p2sub
            - *c_p2app
            - *c_g1
            - *c_g2
            - *c_enr
            - *c_elig
            - *c_plan
            - *c_ctl
            - *c_plansub
            - *c_plantech
            - *c_planpcc
            - *c_planapp
            - *c_quote
          trigger:
            - &c_bind
              call: "POST /cost-cap-policies/${pol_id}/bind"
              payload: {}
              as: Insurer
              as_user_id: "${insurer_id}"
          assert:
            - "HTTP 200; CostCapPolicy.${pol_id}.status == 'BOUND' and bound_at == '2026-12-10T00:00:00Z'"
            - "RemedialActionPlan.${plan_id}.total_funding_need_cents == 118043177 == 115210677 + 2832500"
            - "RemedialActionPlan.${plan_id}.total_estimate_cents == 115210677 (still the DESIGN figure) and its version incremented by 1"
            - "the bind passed priority 50 because attachment_point_cents 153783790 >= round_half_up(115210677 * 1.05) == 120971211, and priority 51 because limit_cents 50000000 >= 25000000"
            - "no FundingAward exists on the site, so cascade L2 re-derives nothing"

      - name: cleanup_goal_attenuated_exactly_at_cumulative_cap_is_not_capped
        claim_type: constants_applied
        grounds:
          - calculations.risk_based_cleanup_goal.formula
          - calculations.risk_based_cleanup_goal.constants.CUMULATIVE_RISK_BUDGET_UGL
          - calculations.risk_based_cleanup_goal.constants.PRACTICAL_QUANT_FLOOR_UGL
          - calculations.risk_based_cleanup_goal.constants.MEDIA_ATTENUATION_DIVISOR
        distinguishing_aspect: "Three goals bracket the cumulative-cap threshold on the same site, where the distinct SOIL_VAPOR analyte count is 2 so cumulative_cap == 250.00: attenuated 250.0000 exactly (cumulative_cap_applied false, strict <), attenuated 250.3333 just above (goal clamped to 250.00 with cumulative_cap_applied true), and a GROUNDWATER goal whose attenuated 0.40 sits under the 0.50 practical quantitation floor (goal 0.50 with cumulative_cap_applied false, because the cap was never the binding constraint)."
        test_recipe:
          setup:
            - "Shared prefix through both APPROVED phases: SOIL_VAPOR findings TCE (exceedance 96.00 and 4.80) and PCE (1.90) give a distinct analyte count of 2, so cumulative_cap == 500.0 / 2 == 250.00; GROUNDWATER has only BENZENE (4.50), so its cap is 500.00."
          setup_api_calls:
            - *c_clock0
            - *c_redev
            - *c_consult
            - *c_lab
            - *c_site
            - *c_prot
            - *c_p1
            - *c_p1f
            - *c_p1sub
            - *c_p1app
            - *c_inq
            - *c_clock_acq
            - *c_acq
            - *c_clock_dec
            - *c_p2
            - *c_p2fa
            - *c_p2fb
            - *c_p2fc
            - *c_p2sub
            - *c_p2app
          trigger:
            - call: "POST /sites/${site_id}/cleanup-goals"
              payload: { contaminant_code: "VINYL_CHLORIDE", media: SOIL_VAPOR, screening_level_ugl: 7.5, basis: UNRESTRICTED }
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { g_at_id: $.data.id }
            - call: "POST /sites/${site_id}/cleanup-goals"
              payload: { contaminant_code: "NAPHTHALENE", media: SOIL_VAPOR, screening_level_ugl: 7.51, basis: UNRESTRICTED }
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { g_over_id: $.data.id }
            - call: "POST /sites/${site_id}/cleanup-goals"
              payload: { contaminant_code: "ARSENIC", media: GROUNDWATER, screening_level_ugl: 0.4, basis: UNRESTRICTED }
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { g_floor_id: $.data.id }
          assert:
            - "CleanupGoal.${g_at_id}.contaminant_count_in_media == 2, goal_ugl == 250.00 and cumulative_cap_applied == false (attenuated 7.5 / 0.03 == 250.0000 equals the cap, and the comparison is strict <)"
            - "CleanupGoal.${g_over_id}.goal_ugl == 250.00 and cumulative_cap_applied == true (attenuated 7.51 / 0.03 == 250.3333 exceeds the cap)"
            - "CleanupGoal.${g_floor_id}.contaminant_count_in_media == 1, goal_ugl == 0.50 and cumulative_cap_applied == false (attenuated 0.40 is raised by PRACTICAL_QUANT_FLOOR_UGL, not by the 500.00 cap)"
            - "all three goals report attainment_status == 'NOT_ATTAINED' and compliant_streak == 0"

      - name: funding_assembly_ignores_applied_and_denied_awards
        claim_type: input_set_filtering
        grounds:
          - calculations.funding_assembly_waterfall.input_set
