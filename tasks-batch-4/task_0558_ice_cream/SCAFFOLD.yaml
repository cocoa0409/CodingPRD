# =============================================================================
# PRD Benchmark Seed Tables — Ice Cream / Frozen Dessert Shop
# Difficulty band: Expert (§0.4)
# =============================================================================

scenario: |
  558. Ice Cream / Frozen Dessert Shop: flavor & batch/par inventory,
  scoop/size & topping modifier POS, cake/pre-order & custom, loyalty/punch &
  seasonal flavor, waste/melt & shrink, catering/event cart, allergen labeling,
  daily cash reconciliation.

domain_name: ice-cream-shop
api_prefix: "/"

# -----------------------------------------------------------------------------
# Complexity profile (§0.1–§0.3)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: "Quota / allocation"        # finite batch volume competed for by reservations, waste, catering
  secondary_archetype: "Ledger reconciliation"   # daily cash drawer + provisional-vs-final cost accounting
  complexity_layers:
    - cascading_side_effects        # pay/void/refund propagate batch -> flavor stock in a 3-hop chain
    - dual_variant_calculation      # standard vs actual COGS (Order); allowance vs measured shrink (Batch)
    - rate_threshold_triggers       # par-level reorder crossing; loyalty punch threshold with reset
    - optimistic_concurrency        # OCC on PreOrder.version for re-quote-with-supersede

  entity_topology: flat             # peer entities linked by FK; no deep nesting in URL paths
  state_machine_shape: branching    # Order fork (VOID vs REFUNDED); PreOrder cyclic revision loop
  relationship_patterns:
    - one_to_many                   # Flavor->Batch, Order->OrderLine, Batch->WasteEvent
    - cross_aggregate               # Order lines reserve across Batch aggregate; Order gated by CashDrawerSession
    - polymorphic                   # (informal) LoyaltyAccount referenced by Order only
  role_model: peer_roles            # Manager/ShiftLead/Scooper/Baker own different resource surfaces
  consistency_model: immediate      # all mutations + cascades atomic within one request

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---- Configuration / catalog ----
  - name: Flavor
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Flavor display name; unique among Flavors" }
      - { name: allergens, type: array, source: input, default: [], description: "Allergen tags present in the base, e.g. [MILK, EGG, NUTS, PEANUT, SOY, GLUTEN]" }
      - { name: is_seasonal, type: boolean, source: input, default: false, description: "Whether availability is gated by a season window" }
      - { name: seasonal_start_utc, type: datetime, source: input, default: null, description: "Inclusive season start (ISO8601 UTC); required when is_seasonal=true" }
      - { name: seasonal_end_utc, type: datetime, source: input, default: null, description: "Exclusive season end (ISO8601 UTC); required when is_seasonal=true" }
      - { name: is_premium, type: boolean, source: input, default: false, description: "Whether a per-scoop premium surcharge applies" }
      - { name: premium_surcharge_cents_per_scoop, type: integer, source: input, default: 0, description: "Per-scoop surcharge added when is_premium=true" }
      - { name: standard_cost_cents_per_ml, type: number, source: input, description: "Standard (book) cost per ml, used by standard COGS variant" }
      - { name: par_level_ml, type: integer, source: input, description: "Reorder threshold; stock_status derives from total_available_ml vs this" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Manager flag; inactive flavors cannot be sold or produced" }
      - { name: total_available_ml, type: integer, source: computed, description: "Sum of remaining_volume_ml over this flavor's AVAILABLE Batches (physical on-hand; open-ticket reservations do NOT reduce it — they only reduce per-batch reservation headroom)" }
      - { name: stock_status, type: enum, source: computed, description: "IN_STOCK | BELOW_PAR | OUT_OF_STOCK; derived from total_available_ml and par_level_ml", constraints: "IN_STOCK,BELOW_PAR,OUT_OF_STOCK" }

  - name: SizeOption
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: code, type: string, source: input, description: "Short code, e.g. SINGLE, DOUBLE, KIDS; unique among SizeOptions" }
      - { name: scoop_count, type: integer, source: input, description: "Number of scoops in this size (>=1)" }
      - { name: base_price_cents, type: integer, source: input, description: "Base price for this size before modifiers" }

  - name: Topping
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: name, type: string, source: input, description: "Topping display name; unique among Toppings" }
      - { name: price_cents, type: integer, source: input, description: "Flat add-on price per line" }
      - { name: allergens, type: array, source: input, default: [], description: "Allergen tags contributed by this topping" }

  - name: EventCart
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; a physical catering cart resource" }
      - { name: name, type: string, source: input, description: "Cart label" }
      - { name: capacity_ml, type: integer, source: input, description: "Max total requested volume a single booking may reserve on this cart" }

  - name: DecoratingStation
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; a cake decorating station resource" }
      - { name: name, type: string, source: input, description: "Station label" }

  - name: LoyaltyAccount
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: phone, type: string, source: input, description: "Member phone; unique among LoyaltyAccounts" }
      - { name: allergen_restrictions, type: array, source: input, default: [], description: "Allergens the member must not be served; enforced on orders that carry this account" }
      - { name: punches, type: integer, source: computed, description: "Current punch count in [0, PUNCH_THRESHOLD); increments by scoops on PAID orders, resets on reward grant" }
      - { name: free_scoop_credits, type: integer, source: computed, description: "Earned free-scoop reward credits; +1 each time punches crosses PUNCH_THRESHOLD" }
      - { name: lifetime_scoops, type: integer, source: computed, description: "Total scoops ever accrued (never decremented by reward reset; reduced only by void/refund reversal)" }

  - name: CashDrawerSession
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; the daily till session" }
      - { name: opening_float_cents, type: integer, source: input, description: "Cash placed in drawer at open" }
      - { name: expected_cash_cents, type: integer, source: computed, description: "opening_float_cents + sum(cash_collected_cents) - sum(cash_refunded_cents) over this drawer's Orders" }
      - { name: gross_sales_cents, type: integer, source: computed, description: "Sum of total_cents over this drawer's Orders in {PAID, REFUNDED}" }
      - { name: net_sales_cents, type: integer, source: computed, description: "Sum of total_cents over this drawer's Orders in {PAID} only" }
      - { name: counted_cash_cents, type: integer, source: input, default: null, description: "Physically counted cash reported at close" }
      - { name: variance_cents, type: integer, source: computed, description: "counted_cash_cents - expected_cash_cents; set at close" }
      - { name: reconciliation_status, type: enum, source: computed, description: "BALANCED | OVER | SHORT; set at close from variance_cents", constraints: "BALANCED,OVER,SHORT,PENDING" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED", constraints: "OPEN,CLOSED" }

  # ---- Inventory ----
  - name: Batch
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: flavor_id, type: string, source: input, description: "FK -> Flavor.id" }
      - { name: initial_volume_ml, type: integer, source: input, description: "Produced volume; conserved constant for the batch-volume invariant" }
      - { name: unit_cost_cents_per_ml, type: number, source: input, description: "Actual production cost per ml for this batch, used by actual COGS variant" }
      - { name: produced_at, type: datetime, source: input, description: "Production timestamp (ISO8601 UTC)" }
      - { name: expiry_at, type: datetime, source: input, description: "Expiry timestamp; primary FIFO allocation key (earliest first)" }
      - { name: remaining_volume_ml, type: integer, source: computed, description: "Physical on-hand = initial_volume_ml - committed_volume_ml - wasted_volume_ml" }
      - { name: reserved_volume_ml, type: integer, source: computed, description: "Soft hold by OPEN OrderLines and BOOKED CateringBookings; does not reduce remaining_volume_ml" }
      - { name: committed_volume_ml, type: integer, source: computed, description: "Consumed by PAID OrderLines and SETTLED CateringBookings" }
      - { name: wasted_volume_ml, type: integer, source: computed, description: "Sum of WasteEvent.volume_ml against this batch" }
      - { name: expected_shrink_ml, type: integer, source: computed, description: "Allowance shrink variant = round_half_up(initial_volume_ml * SHRINK_ALLOWANCE_PCT)" }
      - { name: actual_shrink_ml, type: integer, source: computed, description: "Measured shrink variant = sum of WasteEvent.volume_ml with waste_type in {MELT,SPILLAGE,TRIM_SHRINK}" }
      - { name: shrink_variance_ml, type: integer, source: computed, description: "actual_shrink_ml - expected_shrink_ml" }
      - { name: status, type: enum, source: system, description: "PREP | AVAILABLE | DEPLETED | DISCARDED", constraints: "PREP,AVAILABLE,DEPLETED,DISCARDED" }

  - name: WasteEvent
    parent: null
    common_fields: false   # append-only log: only id + created_at
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: batch_id, type: string, source: input, description: "FK -> Batch.id" }
      - { name: waste_type, type: enum, source: input, description: "MELT | SPILLAGE | TRIM_SHRINK | EXPIRED_DISCARD", constraints: "MELT,SPILLAGE,TRIM_SHRINK,EXPIRED_DISCARD" }
      - { name: volume_ml, type: integer, source: input, description: "Volume removed from the batch (>0)" }
      - { name: reason, type: string, source: input, default: "", description: "Free-text note" }

  # ---- POS ----
  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; the POS ticket" }
      - { name: drawer_id, type: string, source: input, description: "FK -> CashDrawerSession.id; the till this ticket rings into" }
      - { name: loyalty_account_id, type: string, source: input, default: null, description: "FK -> LoyaltyAccount.id; optional member attached to the ticket" }
      - { name: payment_method, type: enum, source: computed, description: "CASH | CARD; set at pay", constraints: "CASH,CARD" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line_price_cents over ACTIVE lines" }
      - { name: tax_cents, type: integer, source: computed, description: "Sum of per-line rounded line_tax_cents (per-line-round-then-sum)" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + tax_cents" }
      - { name: tendered_cash_cents, type: integer, source: computed, description: "Cash tendered at pay (CASH only)" }
      - { name: change_cents, type: integer, source: computed, description: "tendered_cash_cents - total_cents (CASH only)" }
      - { name: cash_collected_cents, type: integer, source: computed, description: "total_cents if paid CASH else 0; feeds drawer expected_cash" }
      - { name: cash_refunded_cents, type: integer, source: computed, description: "total_cents if refunded and payment_method=CASH else 0" }
      - { name: standard_cogs_cents, type: integer, source: computed, description: "Sum of line standard_cogs_cents; standard-cost COGS variant" }
      - { name: actual_cogs_cents, type: integer, source: computed, description: "Sum of line actual_cogs_cents; FIFO-batch actual COGS variant" }
      - { name: punches_earned, type: integer, source: computed, description: "Total scoops on the ticket; accrued to loyalty at pay" }
      - { name: status, type: enum, source: system, description: "OPEN | PAID | VOID | REFUNDED", constraints: "OPEN,PAID,VOID,REFUNDED" }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id" }
      - { name: size_option_id, type: string, source: input, description: "FK -> SizeOption.id" }
      - { name: flavor_id, type: string, source: input, description: "FK -> Flavor.id" }
      - { name: topping_ids, type: array, source: input, default: [], description: "Array of Topping ids applied to this line (each element identifies a Topping); not a single-value FK" }
      - { name: quantity, type: integer, source: input, default: 1, description: "Number of identical units on this line (>=1)" }
      - { name: scoops, type: integer, source: computed, description: "size_option.scoop_count * quantity" }
      - { name: line_price_cents, type: integer, source: computed, description: "See calc order_line_price" }
      - { name: line_tax_cents, type: integer, source: computed, description: "round_half_up(line_price_cents * TAX_RATE)" }
      - { name: allergen_label, type: array, source: computed, description: "Union of flavor.allergens and all topping.allergens" }
      - { name: allocations, type: array, source: computed, description: "FIFO batch draws: array of {batch_id, volume_ml, unit_cost_cents_per_ml}" }
      - { name: standard_cogs_cents, type: integer, source: computed, description: "round_half_up((scoops*SCOOP_VOLUME_ML) * flavor.standard_cost_cents_per_ml)" }
      - { name: actual_cogs_cents, type: integer, source: computed, description: "round_half_up(sum over allocations of volume_ml * unit_cost_cents_per_ml)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REMOVED | COMMITTED", constraints: "ACTIVE,REMOVED,COMMITTED" }

  # ---- Pre-order / cake ----
  - name: PreOrder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: flavor_id, type: string, source: input, description: "FK -> Flavor.id; the cake base flavor" }
      - { name: decorating_station_id, type: string, source: input, description: "FK -> DecoratingStation.id; station reserved for the decorating window" }
      - { name: customer_name, type: string, source: input, description: "Pickup name" }
      - { name: is_custom, type: boolean, source: input, default: false, description: "Whether this is a custom cake" }
      - { name: custom_notes, type: string, source: input, default: "", description: "Custom decoration instructions" }
      - { name: decorate_start_utc, type: datetime, source: input, description: "Inclusive decorating window start (ISO8601 UTC)" }
      - { name: decorate_end_utc, type: datetime, source: input, description: "Exclusive decorating window end; must be > decorate_start_utc" }
      - { name: pickup_utc, type: datetime, source: input, description: "Scheduled pickup time" }
      - { name: quoted_price_cents, type: integer, source: input, description: "Current quoted price; superseded by re-quote" }
      - { name: deposit_cents, type: integer, source: computed, description: "round_half_up(quoted_price_cents * DEPOSIT_PCT); set at confirm" }
      - { name: final_price_cents, type: integer, source: computed, description: "Equals quoted_price_cents at fulfill" }
      - { name: refunded_cents, type: integer, source: computed, description: "deposit_cents refunded when cancelled after confirm" }
      - { name: allergen_label, type: array, source: computed, description: "flavor.allergens (allergen labeling for the cake)" }
      - { name: status, type: enum, source: system, description: "QUOTED | CONFIRMED | IN_PRODUCTION | FULFILLED | CANCELLED", constraints: "QUOTED,CONFIRMED,IN_PRODUCTION,FULFILLED,CANCELLED" }

  # ---- Catering ----
  - name: CateringBooking
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: event_cart_id, type: string, source: input, description: "FK -> EventCart.id; the cart reserved for the event window" }
      - { name: event_start_utc, type: datetime, source: input, description: "Inclusive event window start (ISO8601 UTC)" }
      - { name: event_end_utc, type: datetime, source: input, description: "Exclusive event window end; must be > event_start_utc" }
      - { name: requested_items, type: array, source: input, description: "Array of {flavor_id, volume_ml}; volume reserved across FIFO batches at booking" }
      - { name: estimate_cents, type: integer, source: computed, description: "sum(volume_ml) * CATERING_RATE_CENTS_PER_ML over requested_items" }
      - { name: actual_items, type: array, source: computed, description: "Array of {flavor_id, volume_ml} actually consumed; set at close" }
      - { name: actual_cents, type: integer, source: computed, description: "sum(actual volume_ml) * CATERING_RATE_CENTS_PER_ML; set at close" }
      - { name: status, type: enum, source: system, description: "BOOKED | SETTLED | CANCELLED", constraints: "BOOKED,SETTLED,CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Batch
    field: status
    initial_state: PREP
    terminal_states: [DEPLETED, DISCARDED]
    transitions:
      - from: PREP
        to: AVAILABLE
        trigger: "POST /batches/{id}/release"
        actor: Baker
        preconditions:
          - "Batch is in PREP (else ERR_BATCH_NOT_PREP)"
        side_effects:
          - "Batch becomes eligible for FIFO reservation/allocation"
          - "Owning Flavor.total_available_ml and stock_status recomputed"
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system (remaining_volume_ml reaches 0 after a commit or waste)"
        actor: system
        preconditions:
          - "remaining_volume_ml == 0"
        side_effects:
          - "Batch excluded from future reservations"
          - "Owning Flavor.total_available_ml and stock_status recomputed (may drop to OUT_OF_STOCK)"
      - from: DEPLETED
        to: AVAILABLE
        trigger: "system (remaining_volume_ml restored above 0 by a refund uncommit)"
        actor: system
        preconditions:
          - "remaining_volume_ml > 0 after uncommit"
        side_effects:
          - "Owning Flavor.total_available_ml and stock_status recomputed (may rise to BELOW_PAR/IN_STOCK)"
      - from: [PREP, AVAILABLE]
        to: DISCARDED
        trigger: "POST /waste-events (waste_type=EXPIRED_DISCARD removing all remaining)"
        actor: Baker
        preconditions:
          - "Batch in PREP or AVAILABLE (else ERR_BATCH_NOT_AVAILABLE)"
          - "EXPIRED_DISCARD volume_ml equals remaining_volume_ml"
        side_effects:
          - "wasted_volume_ml += volume_ml, remaining_volume_ml -> 0"
          - "Owning Flavor.total_available_ml and stock_status recomputed"

  - entity: Order
    field: status
    initial_state: OPEN
    terminal_states: [VOID, REFUNDED]
    transitions:
      - from: OPEN
        to: PAID
        trigger: "POST /orders/{id}/pay"
        actor: Scooper
        preconditions:
          - "Order has >=1 ACTIVE line (else ERR_EMPTY_ORDER)"
          - "Owning CashDrawerSession.status == OPEN (else ERR_DRAWER_NOT_OPEN)"
          - "If payment_method=CASH: tendered_cash_cents >= total_cents (else ERR_INSUFFICIENT_CASH_TENDERED)"
        side_effects:
          - "Each ACTIVE line -> COMMITTED; for each: batch.reserved_volume_ml -= v, batch.committed_volume_ml += v, batch.remaining_volume_ml -= v (CASCADE link 1)"
          - "Any batch whose remaining_volume_ml hits 0 auto-transitions AVAILABLE->DEPLETED (CASCADE link 2)"
          - "Each affected Flavor.total_available_ml and stock_status recomputed (CASCADE link 3)"
          - "line.standard_cogs_cents and line.actual_cogs_cents frozen; Order.standard_cogs_cents/actual_cogs_cents set"
          - "cash_collected_cents = total_cents if CASH else 0; drawer.expected_cash_cents recomputed"
          - "If loyalty_account_id set: account accrues punches_earned scoops (may cross PUNCH_THRESHOLD, granting credits and resetting punches)"
      - from: OPEN
        to: VOID
        trigger: "POST /orders/{id}/void"
        actor: ShiftLead
        preconditions:
          - "Order.status == OPEN (else ERR_ORDER_NOT_OPEN)"
        side_effects:
          - "Each ACTIVE line -> REMOVED; batch.reserved_volume_ml -= v (release soft hold only; remaining_volume_ml unchanged)"
          - "No cash movement; no loyalty accrual"
      - from: PAID
        to: REFUNDED
        trigger: "POST /orders/{id}/refund"
        actor: ShiftLead
        preconditions:
          - "Order.status == PAID (else ERR_ORDER_NOT_OPEN)"
        side_effects:
          - "Each COMMITTED line uncommitted: batch.committed_volume_ml -= v, batch.remaining_volume_ml += v (CASCADE link 1)"
          - "Any DEPLETED batch whose remaining_volume_ml rises above 0 auto-transitions DEPLETED->AVAILABLE (CASCADE link 2)"
          - "Each affected Flavor.total_available_ml and stock_status recomputed (CASCADE link 3)"
          - "cash_refunded_cents = total_cents if payment_method=CASH else 0; drawer.expected_cash_cents recomputed"
          - "If loyalty_account_id set: reverse punches_earned scoops (undo any reward credit granted by this order); lifetime_scoops decremented"

  - entity: PreOrder
    field: status
    initial_state: QUOTED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /pre-orders/{id}/confirm"
        actor: Scooper
        preconditions:
          - "PreOrder.status == QUOTED (else ERR_PREORDER_INVALID_STATE)"
        side_effects:
          - "deposit_cents = round_half_up(quoted_price_cents * DEPOSIT_PCT)"
      - from: CONFIRMED
        to: IN_PRODUCTION
        trigger: "POST /pre-orders/{id}/start-production"
        actor: Baker
        preconditions:
          - "PreOrder.status == CONFIRMED (else ERR_PREORDER_INVALID_STATE)"
          - "Cross-entity: base Flavor.is_active == true AND (not seasonal OR clock within season) AND Flavor.stock_status != OUT_OF_STOCK (else ERR_FLAVOR_UNAVAILABLE)"
        side_effects: []
      - from: IN_PRODUCTION
        to: CONFIRMED
        trigger: "POST /pre-orders/{id}/request-revision"
        actor: Baker
        preconditions:
          - "PreOrder.status == IN_PRODUCTION (else ERR_PREORDER_INVALID_STATE)"
        side_effects:
          - "Revision loop: returns to CONFIRMED so production can restart after re-check"
        note: "Cyclic edge IN_PRODUCTION -> CONFIRMED enabling repeated revision rounds"
      - from: IN_PRODUCTION
        to: FULFILLED
        trigger: "POST /pre-orders/{id}/fulfill"
        actor: Scooper
        preconditions:
          - "PreOrder.status == IN_PRODUCTION (else ERR_PREORDER_INVALID_STATE)"
        side_effects:
          - "final_price_cents = quoted_price_cents"
      - from: [QUOTED, CONFIRMED, IN_PRODUCTION]
        to: CANCELLED
        trigger: "POST /pre-orders/{id}/cancel"
        actor: Manager
        preconditions:
          - "PreOrder.status in {QUOTED, CONFIRMED, IN_PRODUCTION} (else ERR_PREORDER_INVALID_STATE)"
        side_effects:
          - "If prior state in {CONFIRMED, IN_PRODUCTION}: refunded_cents = deposit_cents (deposit returned)"
          - "If prior state == QUOTED: refunded_cents = 0 (no deposit taken yet)"

  - entity: CateringBooking
    field: status
    initial_state: BOOKED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: BOOKED
        to: SETTLED
        trigger: "POST /catering-bookings/{id}/close"
        actor: Manager
        preconditions:
          - "CateringBooking.status == BOOKED (else ERR_CATERING_INVALID_STATE)"
          - "Each actual_items flavor was part of requested_items and actual volume_ml <= reserved volume for that flavor"
        side_effects:
          - "For each reserved batch: convert reservation to consumption -> batch.reserved_volume_ml -= reserved, batch.committed_volume_ml += actual, batch.remaining_volume_ml -= actual (CASCADE link 1)"
          - "Any batch whose remaining_volume_ml hits 0 auto-transitions AVAILABLE->DEPLETED (CASCADE link 2)"
          - "actual_cents computed"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /catering-bookings/{id}/cancel"
        actor: Manager
        preconditions:
          - "CateringBooking.status == BOOKED (else ERR_CATERING_INVALID_STATE)"
        side_effects:
          - "Release all reservations: for each reserved batch, batch.reserved_volume_ml -= reserved (remaining_volume_ml unchanged)"

  - entity: CashDrawerSession
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /cash-drawer-sessions/{id}/close"
        actor: ShiftLead
        preconditions:
          - "CashDrawerSession.status == OPEN (else ERR_DRAWER_ALREADY_CLOSED)"
        side_effects:
          - "variance_cents = counted_cash_cents - expected_cash_cents"
          - "reconciliation_status = BALANCED if variance==0, OVER if >0, SHORT if <0"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC only)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: preorder-requote-stale
    parent_entity: PreOrder
    write_endpoint: "POST /pre-orders/{id}/requote"
    occ_field: "expected_preorder_version"
    description: |
      Re-quoting a PreOrder writes a new quoted_price_cents that supersedes the
      prior quote. A re-quote carrying an expected_preorder_version older than
      the PreOrder's current version is rejected: the client's view is stale
      because another re-quote (which legitimately superseded the prior price)
      already advanced the version. Both re-quotes are independently valid from
      QUOTED, so this is a genuine supersede race resolved by a stale-version
      check, not a state precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_line_price
    trigger: "POST /orders/{id}/lines (line add); recomputed field on the line"
    algorithm: rate_based
    formula: |
      scoops = size_option.scoop_count * quantity
      base = size_option.base_price_cents * quantity
      topping_total = (sum of topping.price_cents for topping_ids) * quantity
      seasonal_surcharge = (SEASONAL_SURCHARGE_CENTS_PER_SCOOP * scoops) if flavor.is_seasonal else 0
      premium_surcharge  = (flavor.premium_surcharge_cents_per_scoop * scoops) if flavor.is_premium else 0
      line_price_cents = base + topping_total + seasonal_surcharge + premium_surcharge
    input_set: "Single OrderLine at add time; flavor + toppings + size resolved by id"
    constants:
      SEASONAL_SURCHARGE_CENTS_PER_SCOOP: 40
    precision: "integer cents; no rounding needed (all inputs integer)"
    note: "Combinatorial mode (a): >=3 inputs (size, toppings, flavor flags, quantity) with conditional branches on flavor.is_seasonal and flavor.is_premium"

  - name: order_totals
    trigger: "line add/remove; POST /orders/{id}/pay freezes"
    algorithm: aggregation
    formula: |
      For each ACTIVE line: line_tax_cents = round_half_up(line_price_cents * TAX_RATE)
      subtotal_cents = sum(line_price_cents over ACTIVE lines)
      tax_cents      = sum(line_tax_cents over ACTIVE lines)   # PINNED: round-per-line THEN sum
      total_cents    = subtotal_cents + tax_cents
    input_set: "All ACTIVE lines of the order"
    constants:
      TAX_RATE: 0.0875
    precision: "round_half_up to whole cents, applied per line before summation"
    note: "Combinatorial mode (b): nested rounding where order matters. Round-per-line-then-sum is PINNED; sum-then-round is explicitly NOT used and yields a different tax on many baskets."

  - name: order_cogs
    trigger: "POST /orders/{id}/pay (frozen at commit)"
    algorithm: dual_variant
    formula: |
      Per line, using its FIFO allocations:
        standard_cogs_cents = round_half_up((scoops * SCOOP_VOLUME_ML) * flavor.standard_cost_cents_per_ml)
        actual_cogs_cents   = round_half_up(sum over allocations of alloc.volume_ml * alloc.unit_cost_cents_per_ml)
      Order.standard_cogs_cents = sum of line standard_cogs_cents
      Order.actual_cogs_cents   = sum of line actual_cogs_cents
    input_set: "Committed lines of one order and the specific batches FIFO-consumed"
    constants:
      SCOOP_VOLUME_ML: 90
    precision: "round_half_up to whole cents per line"
    variants:
      - name: standard
        when: "Book/standard costing"
        difference: "Uses flavor.standard_cost_cents_per_ml uniformly on total volume"
      - name: actual
        when: "Actual costing from consumed batches"
        difference: "Sums each batch allocation at that batch's unit_cost_cents_per_ml; diverges from standard when batch costs differ from the flavor book rate"
    note: "Rule 1 dual-variant instance on the Order domain"

  - name: batch_shrink
    trigger: "GET /batches/{id} computed comparison; conceptually at reconciliation"
    algorithm: dual_variant
    formula: |
      expected_shrink_ml = round_half_up(initial_volume_ml * SHRINK_ALLOWANCE_PCT)
      actual_shrink_ml   = sum(WasteEvent.volume_ml for waste_type in {MELT, SPILLAGE, TRIM_SHRINK} on this batch)
      shrink_variance_ml = actual_shrink_ml - expected_shrink_ml
    input_set: "One batch and its non-EXPIRED_DISCARD waste events"
    constants:
      SHRINK_ALLOWANCE_PCT: 0.05
    precision: "round_half_up to whole ml on the allowance"
    variants:
      - name: allowance
        when: "Planned shrink budget"
        difference: "Flat percentage of initial volume"
      - name: measured
        when: "Observed shrink from melt/spillage/trim logs"
        difference: "Sums actual waste volume; diverges from the allowance whenever real loss != 5% of initial"
    note: "Rule 1 dual-variant instance on the Batch domain (distinct from order_cogs)"

  - name: flavor_stock_status
    trigger: "batch release, commit, uncommit, waste, discard"
    algorithm: threshold
    formula: |
      total_available_ml = sum(batch.remaining_volume_ml
                               for batches of this flavor with status == AVAILABLE)
      if total_available_ml == 0:            stock_status = OUT_OF_STOCK
      elif total_available_ml < par_level_ml: stock_status = BELOW_PAR
      else:                                   stock_status = IN_STOCK   # total_available_ml >= par_level_ml
    input_set: "AVAILABLE batches of one flavor"
    constants: {}
    precision: "integer ml"
    note: "Boundary at total_available_ml == par_level_ml is IN_STOCK (>=); par_level_ml - 1 is BELOW_PAR"

  - name: loyalty_punch_accrual
    trigger: "POST /orders/{id}/pay (when loyalty_account_id set)"
    algorithm: threshold
    formula: |
      earned = order.punches_earned            # total scoops on the ticket
      lifetime_scoops += earned
      running = punches + earned
      credits_gained = running // PUNCH_THRESHOLD
      free_scoop_credits += credits_gained
      punches = running % PUNCH_THRESHOLD       # reset remainder
    input_set: "One loyalty account at pay time"
    constants:
      PUNCH_THRESHOLD: 10
    precision: "integer counts"
    note: "Threshold with reset; boundary at running == PUNCH_THRESHOLD grants exactly one credit and resets punches to 0"

  - name: fifo_batch_allocation
    trigger: "line add reservation; catering booking reservation; pay/close commit"
    algorithm: waterfall_allocation
    formula: |
      need_ml = scoops * SCOOP_VOLUME_ML     (line)  OR requested volume_ml (catering)
      candidates = batches of the flavor with status == AVAILABLE and (remaining_volume_ml - reserved_volume_ml) > 0
      order candidates by expiry_at ASC, then created_at ASC   # deterministic; id never used
      draw need_ml across candidates in that order, each contributing up to its available headroom
      if total headroom < need_ml: reject with ERR_INSUFFICIENT_BATCH_VOLUME (allocate nothing)
    input_set: "AVAILABLE batches of one flavor with positive headroom"
    constants:
      SCOOP_VOLUME_ML: 90
    precision: "integer ml"
    note: "Allocation order is expiry_at ASC, created_at ASC tie-break; forbids id-based ordering"

  - name: drawer_reconciliation
    trigger: "order pay/refund (expected recompute); POST /cash-drawer-sessions/{id}/close (variance)"
    algorithm: aggregation
    formula: |
      expected_cash_cents = opening_float_cents
                            + sum(order.cash_collected_cents for this drawer's orders)
                            - sum(order.cash_refunded_cents for this drawer's orders)
      gross_sales_cents = sum(order.total_cents for orders in {PAID, REFUNDED})
      net_sales_cents   = sum(order.total_cents for orders in {PAID})
      at close: variance_cents = counted_cash_cents - expected_cash_cents
    input_set: "All orders belonging to the drawer"
    constants: {}
    precision: "integer cents"
    variants:
      - name: gross_sales
        when: "Includes refunded tickets"
        difference: "Counts PAID and REFUNDED totals"
      - name: net_sales
        when: "Excludes refunded tickets"
        difference: "Counts PAID only; diverges from gross once any ticket is refunded"

  - name: catering_pricing
    trigger: "booking create (estimate); close (actual)"
    algorithm: dual_variant
    formula: |
      estimate_cents = sum(item.volume_ml for item in requested_items) * CATERING_RATE_CENTS_PER_ML
      actual_cents   = sum(item.volume_ml for item in actual_items)    * CATERING_RATE_CENTS_PER_ML
    input_set: "One booking's requested vs actual item lists"
    constants:
      CATERING_RATE_CENTS_PER_ML: 2
    precision: "integer cents"
    variants:
      - name: estimate
        when: "At booking"
        difference: "Prices requested volumes"
      - name: actual
        when: "At close"
        difference: "Prices actually consumed volumes; diverges when actual != requested"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is one of Manager/ShiftLead/Scooper/Baker"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path/body id resolves (validated left-to-right in path, then body FKs)"
    error_id: "ERR_FLAVOR_NOT_FOUND / ERR_SIZE_OPTION_NOT_FOUND / ERR_TOPPING_NOT_FOUND / ERR_BATCH_NOT_FOUND / ERR_WASTE_EVENT_NOT_FOUND / ERR_LOYALTY_ACCOUNT_NOT_FOUND / ERR_DRAWER_NOT_FOUND / ERR_ORDER_NOT_FOUND / ERR_ORDER_LINE_NOT_FOUND / ERR_PREORDER_NOT_FOUND / ERR_EVENT_CART_NOT_FOUND / ERR_DECORATING_STATION_NOT_FOUND / ERR_CATERING_BOOKING_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path/body ids"

  - priority: 4
    category: business_constraint
    check: "Request schema valid: required fields present, types/enums correct, numeric > 0 where required; time windows have end > start"
    error_id: "ERR_VALIDATION / ERR_INVALID_TIME_WINDOW"
    http_status: 422
    applies_to: "all write endpoints"

  - priority: 5
    category: state
    check: "Target resource in a legal state for the operation (order OPEN/PAID; drawer OPEN; batch PREP/AVAILABLE; preorder/catering per state machine)"
    error_id: "ERR_ORDER_NOT_OPEN / ERR_DRAWER_NOT_OPEN / ERR_DRAWER_ALREADY_CLOSED / ERR_BATCH_NOT_PREP / ERR_BATCH_NOT_AVAILABLE / ERR_PREORDER_INVALID_STATE / ERR_CATERING_INVALID_STATE / ERR_EMPTY_ORDER"
    http_status: 409
    applies_to: "state-changing endpoints"

  - priority: 6
    category: business_safety
    check: "If order carries a LoyaltyAccount, the line's allergen_label must not intersect account.allergen_restrictions"
    error_id: ERR_ALLERGEN_RESTRICTION_CONFLICT
    http_status: 409
    applies_to: "POST /orders/{id}/lines"

  - priority: 7
    category: business_temporal
    check: "Seasonal flavor must be within [seasonal_start_utc, seasonal_end_utc) at the logical clock time when sold on a line"
    error_id: ERR_FLAVOR_OUT_OF_SEASON
    http_status: 409
    applies_to: "POST /orders/{id}/lines"

  - priority: 8
    category: business_temporal
    check: "Cross-entity: start-production requires base Flavor active, in-season, and not OUT_OF_STOCK"
    error_id: ERR_FLAVOR_UNAVAILABLE
    http_status: 409
    applies_to: "POST /pre-orders/{id}/start-production"

  - priority: 9
    category: business_constraint
    check: "Resource temporal overlap: EventCart window collision (half-open, touching allowed); DecoratingStation window collision within STATION_CLEAN_BUFFER_MIN buffer (touching NOT allowed)"
    error_id: "ERR_CART_OVERLAP / ERR_STATION_OVERLAP"
    http_status: 409
    applies_to: "POST /catering-bookings ; POST /pre-orders"

  - priority: 10
    category: business_constraint
    check: "Sufficient FIFO batch headroom for the requested volume across AVAILABLE batches of the flavor"
    error_id: ERR_INSUFFICIENT_BATCH_VOLUME
    http_status: 409
    applies_to: "POST /orders/{id}/lines ; POST /catering-bookings"

  - priority: 11
    category: business_fiscal
    check: "CASH payment must tender >= total_cents"
    error_id: ERR_INSUFFICIENT_CASH_TENDERED
    http_status: 402
    applies_to: "POST /orders/{id}/pay"

  - priority: 12
    category: business_constraint
    check: "OCC: expected_preorder_version must equal current PreOrder.version on re-quote"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /pre-orders/{id}/requote"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock (UTC). Startup default is 2026-05-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Manager, ShiftLead, Scooper, Baker]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Logical clock advanced/rewound to to_iso8601"]

  # ---- Flavor ----
  - method: POST
    path: "/flavors"
    description: "Create a flavor"
    roles: [Manager]
    code: 201
    input: [name, "allergens?", "is_seasonal?", "seasonal_start_utc?", "seasonal_end_utc?", "is_premium?", "premium_surcharge_cents_per_scoop?", standard_cost_cents_per_ml, par_level_ml, "is_active?"]
    output: Flavor
    side_effects: ["stock_status = OUT_OF_STOCK (no batches yet)"]
  - method: GET
    path: "/flavors"
    description: "List flavors"
    roles: [Manager, ShiftLead, Scooper, Baker]
    code: 200
    input: ["stock_status?", "is_seasonal?", "limit?", "offset?"]
    output: "Flavor[]"
    side_effects: []
  - method: GET
    path: "/flavors/{id}"
    description: "Get a flavor (with computed total_available_ml, stock_status)"
    roles: [Manager, ShiftLead, Scooper, Baker]
    code: 200
    input: []
    output: Flavor
    side_effects: []
  - method: PATCH
    path: "/flavors/{id}"
    description: "Update mutable flavor config (par level, season window, active flag, premium surcharge)"
    roles: [Manager]
    code: 200
    input: ["par_level_ml?", "is_active?", "is_seasonal?", "seasonal_start_utc?", "seasonal_end_utc?", "is_premium?", "premium_surcharge_cents_per_scoop?"]
    output: Flavor
    side_effects: ["stock_status recomputed against new par_level_ml"]

  # ---- SizeOption ----
  - method: POST
    path: "/size-options"
    description: "Create a size option"
    roles: [Manager]
    code: 201
    input: [code, scoop_count, base_price_cents]
    output: SizeOption
    side_effects: []
  - method: GET
    path: "/size-options"
    description: "List size options"
    roles: [Manager, ShiftLead, Scooper, Baker]
    code: 200
    input: ["limit?", "offset?"]
    output: "SizeOption[]"
    side_effects: []

  # ---- Topping ----
  - method: POST
    path: "/toppings"
    description: "Create a topping"
    roles: [Manager]
    code: 201
    input: [name, price_cents, "allergens?"]
    output: Topping
    side_effects: []
  - method: GET
    path: "/toppings"
    description: "List toppings"
    roles: [Manager, ShiftLead, Scooper, Baker]
    code: 200
    input: ["limit?", "offset?"]
    output: "Topping[]"
    side_effects: []

  # ---- EventCart / DecoratingStation ----
  - method: POST
    path: "/event-carts"
    description: "Create a catering event cart resource"
    roles: [Manager]
    code: 201
    input: [name, capacity_ml]
    output: EventCart
    side_effects: []
  - method: POST
    path: "/decorating-stations"
    description: "Create a cake decorating station resource"
    roles: [Manager]
    code: 201
    input: [name]
    output: DecoratingStation
    side_effects: []

  # ---- Batch ----
  - method: POST
    path: "/batches"
    description: "Produce a batch (starts PREP)"
    roles: [Baker]
    code: 201
    input: [flavor_id, initial_volume_ml, unit_cost_cents_per_ml, produced_at, expiry_at]
    output: Batch
    side_effects: ["status=PREP; remaining_volume_ml=initial_volume_ml; reserved=committed=wasted=0"]
  - method: POST
    path: "/batches/{id}/release"
    description: "Release a batch to AVAILABLE"
    roles: [Baker]
    code: 200
    input: []
    output: Batch
    side_effects: ["status PREP->AVAILABLE; owning Flavor stock recomputed"]
  - method: GET
    path: "/batches"
    description: "List/filter batches"
    roles: [Manager, ShiftLead, Scooper, Baker]
    code: 200
    input: ["flavor_id?", "status?", "limit?", "offset?"]
    output: "Batch[]"
    side_effects: []
  - method: GET
    path: "/batches/{id}"
    description: "Get a batch (with computed volumes and shrink fields)"
    roles: [Manager, ShiftLead, Scooper, Baker]
    code: 200
    input: []
    output: Batch
    side_effects: []

  # ---- WasteEvent ----
  - method: POST
    path: "/waste-events"
    description: "Log melt/spillage/trim/expired-discard against a batch"
    roles: [Baker]
    code: 201
    input: [batch_id, waste_type, volume_ml, "reason?"]
    output: WasteEvent
    side_effects: ["batch.wasted_volume_ml += volume_ml; batch.remaining_volume_ml -= volume_ml; may DEPLETE/DISCARD batch; owning Flavor stock recomputed"]
  - method: GET
    path: "/waste-events"
    description: "List waste events, filterable by batch"
    roles: [Manager, ShiftLead, Scooper, Baker]
    code: 200
    input: ["batch_id?", "limit?", "offset?"]
    output: "WasteEvent[]"
    side_effects: []
  - method: GET
    path: "/waste-events/{id}"
    description: "Get a waste event"
    roles: [Manager, ShiftLead, Scooper, Baker]
    code: 200
    input: []
    output: WasteEvent
    side_effects: []

  # ---- LoyaltyAccount ----
  - method: POST
    path: "/loyalty-accounts"
    description: "Create a loyalty punch-card account"
    roles: [Manager, Scooper]
    code: 201
    input: [phone, "allergen_restrictions?"]
    output: LoyaltyAccount
    side_effects: ["punches=0, free_scoop_credits=0, lifetime_scoops=0"]
  - method: GET
    path: "/loyalty-accounts/{id}"
    description: "Get a loyalty account"
    roles: [Manager, ShiftLead, Scooper, Baker]
    code: 200
    input: []
    output: LoyaltyAccount
    side_effects: []

  # ---- CashDrawerSession ----
  - method: POST
    path: "/cash-drawer-sessions"
    description: "Open a daily cash drawer"
    roles: [ShiftLead]
    code: 201
    input: [opening_float_cents]
    output: CashDrawerSession
    side_effects: ["status=OPEN; expected_cash_cents=opening_float_cents; reconciliation_status=PENDING"]
  - method: POST
    path: "/cash-drawer-sessions/{id}/close"
    description: "Reconcile and close the drawer"
    roles: [ShiftLead]
    code: 200
    input: [counted_cash_cents]
    output: CashDrawerSession
    side_effects: ["variance_cents = counted_cash_cents - expected_cash_cents; reconciliation_status set; status->CLOSED"]
  - method: GET
    path: "/cash-drawer-sessions/{id}"
    description: "Get a drawer session with computed ledger fields"
    roles: [Manager, ShiftLead, Scooper, Baker]
    code: 200
    input: []
    output: CashDrawerSession
    side_effects: []

  # ---- Order ----
  - method: POST
    path: "/orders"
    description: "Open a POS ticket against a drawer"
    roles: [Scooper, ShiftLead]
    code: 201
    input: [drawer_id, "loyalty_account_id?"]
    output: Order
    side_effects: ["status=OPEN; subtotal/tax/total=0"]
  - method: GET
    path: "/orders"
    description: "List/filter orders"
    roles: [Manager, ShiftLead, Scooper, Baker]
    code: 200
    input: ["drawer_id?", "loyalty_account_id?", "status?", "limit?", "offset?"]
    output: "Order[]"
    side_effects: []
  - method: GET
    path: "/orders/{id}"
    description: "Get an order with computed totals and COGS"
    roles: [Manager, ShiftLead, Scooper, Baker]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: POST
    path: "/orders/{id}/lines"
    description: "Add a line to an OPEN order; reserves FIFO batch volume"
    roles: [Scooper, ShiftLead]
    code: 201
    input: [size_option_id, flavor_id, "topping_ids?", "quantity?"]
    output: OrderLine
    side_effects: ["line ACTIVE; reserves scoops*SCOOP_VOLUME_ML across FIFO batches; batch.reserved += v; order totals recomputed"]
  - method: DELETE
    path: "/orders/{id}/lines/{lineId}"
    description: "Remove an ACTIVE line from an OPEN order; releases its reservation"
    roles: [Scooper, ShiftLead]
    code: 200
    input: []
    output: OrderLine
    side_effects: ["line ACTIVE->REMOVED; batch.reserved -= v; order totals recomputed"]
  - method: GET
    path: "/order-lines"
    description: "List order lines, filterable by order/size/flavor"
    roles: [Manager, ShiftLead, Scooper, Baker]
    code: 200
    input: ["order_id?", "size_option_id?", "flavor_id?", "limit?", "offset?"]
    output: "OrderLine[]"
    side_effects: []
  - method: GET
    path: "/order-lines/{id}"
    description: "Get an order line with computed price, allergen_label, allocations, COGS"
    roles: [Manager, ShiftLead, Scooper, Baker]
    code: 200
    input: []
    output: OrderLine
    side_effects: []
  - method: POST
    path: "/orders/{id}/pay"
    description: "Take payment, commit lines, accrue loyalty, update drawer"
    roles: [Scooper, ShiftLead]
    code: 200
    input: [payment_method, "tendered_cash_cents?"]
    output: Order
    side_effects: ["OPEN->PAID; commit cascade (batch remaining/committed -> possible DEPLETED -> flavor stock); COGS frozen; drawer expected_cash recomputed; loyalty accrual"]
  - method: POST
    path: "/orders/{id}/void"
    description: "Void an OPEN ticket; release reservations"
    roles: [ShiftLead]
    code: 200
    input: []
    output: Order
    side_effects: ["OPEN->VOID; all ACTIVE lines REMOVED; batch.reserved released; no cash/loyalty movement"]
  - method: POST
    path: "/orders/{id}/refund"
    description: "Refund a PAID ticket; uncommit lines and reverse cash/loyalty"
    roles: [ShiftLead, Manager]
    code: 200
    input: []
    output: Order
    side_effects: ["PAID->REFUNDED; uncommit cascade (batch remaining restored -> possible AVAILABLE -> flavor stock); drawer expected_cash recomputed; loyalty reversed"]

  # ---- PreOrder ----
  - method: POST
    path: "/pre-orders"
    description: "Create a cake pre-order (QUOTED); reserves a decorating-station window"
    roles: [Scooper, Manager]
    code: 201
    input: [flavor_id, decorating_station_id, customer_name, "is_custom?", "custom_notes?", decorate_start_utc, decorate_end_utc, pickup_utc, quoted_price_cents]
    output: PreOrder
    side_effects: ["status=QUOTED; station window overlap (with buffer) validated"]
  - method: GET
    path: "/pre-orders"
    description: "List/filter pre-orders"
    roles: [Manager, ShiftLead, Scooper, Baker]
    code: 200
    input: ["flavor_id?", "decorating_station_id?", "status?", "limit?", "offset?"]
    output: "PreOrder[]"
    side_effects: []
  - method: GET
    path: "/pre-orders/{id}"
    description: "Get a pre-order with computed deposit/allergen_label"
    roles: [Manager, ShiftLead, Scooper, Baker]
    code: 200
    input: []
    output: PreOrder
    side_effects: []
  - method: POST
    path: "/pre-orders/{id}/requote"
    description: "Re-quote price (supersede); OCC-guarded"
    roles: [Manager]
    code: 200
    input: [quoted_price_cents, expected_preorder_version]
    output: PreOrder
    side_effects: ["quoted_price_cents replaced; increments PreOrder.version by 1"]
  - method: POST
    path: "/pre-orders/{id}/confirm"
    description: "Confirm pre-order and take deposit"
    roles: [Scooper, Manager]
    code: 200
    input: []
    output: PreOrder
    side_effects: ["QUOTED->CONFIRMED; deposit_cents = round_half_up(quoted_price_cents*DEPOSIT_PCT)"]
  - method: POST
    path: "/pre-orders/{id}/start-production"
    description: "Start production (cross-entity flavor availability gate)"
    roles: [Baker]
    code: 200
    input: []
    output: PreOrder
    side_effects: ["CONFIRMED->IN_PRODUCTION"]
  - method: POST
    path: "/pre-orders/{id}/request-revision"
    description: "Send back to CONFIRMED for a revision round (cyclic)"
    roles: [Baker]
    code: 200
    input: []
    output: PreOrder
    side_effects: ["IN_PRODUCTION->CONFIRMED"]
  - method: POST
    path: "/pre-orders/{id}/fulfill"
    description: "Fulfill and take final payment"
    roles: [Scooper, Manager]
    code: 200
    input: []
    output: PreOrder
    side_effects: ["IN_PRODUCTION->FULFILLED; final_price_cents=quoted_price_cents"]
  - method: POST
    path: "/pre-orders/{id}/cancel"
    description: "Cancel a pre-order; refund deposit if already confirmed"
    roles: [Manager]
    code: 200
    input: []
    output: PreOrder
    side_effects: ["->CANCELLED; refunded_cents = deposit_cents if prior in {CONFIRMED,IN_PRODUCTION} else 0"]

  # ---- CateringBooking ----
  - method: POST
    path: "/catering-bookings"
    description: "Book a catering event on an event cart; reserves FIFO batch volume; validates cart-window overlap"
    roles: [Manager]
    code: 201
    input: [event_cart_id, event_start_utc, event_end_utc, requested_items]
    output: CateringBooking
    side_effects: ["status=BOOKED; batch.reserved += requested volume per flavor; estimate_cents computed"]
  - method: GET
    path: "/catering-bookings"
    description: "List/filter catering bookings"
    roles: [Manager, ShiftLead, Scooper, Baker]
    code: 200
    input: ["event_cart_id?", "status?", "limit?", "offset?"]
    output: "CateringBooking[]"
    side_effects: []
  - method: GET
    path: "/catering-bookings/{id}"
    description: "Get a catering booking"
    roles: [Manager, ShiftLead, Scooper, Baker]
    code: 200
    input: []
    output: CateringBooking
    side_effects: []
  - method: POST
    path: "/catering-bookings/{id}/close"
    description: "Close a booking with actual consumption"
    roles: [Manager]
    code: 200
    input: [actual_items]
    output: CateringBooking
    side_effects: ["BOOKED->SETTLED; commit cascade (batch reserved->committed, remaining -=; possible DEPLETED); actual_cents computed"]
  - method: POST
    path: "/catering-bookings/{id}/cancel"
    description: "Cancel a booking and release reservations"
    roles: [Manager]
    code: 200
    input: []
    output: CateringBooking
    side_effects: ["BOOKED->CANCELLED; batch.reserved released"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-ID or X-User-Role header, or role not one of the four" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Authenticated role not permitted for this operation" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body: missing required field, wrong type/enum, non-positive quantity/volume" }
  - { id: ERR_INVALID_TIME_WINDOW, http: 422, condition: "end <= start for a season/decorating/event window" }

  - { id: ERR_FLAVOR_NOT_FOUND, http: 404, condition: "Flavor id does not exist" }
  - { id: ERR_SIZE_OPTION_NOT_FOUND, http: 404, condition: "SizeOption id does not exist" }
  - { id: ERR_TOPPING_NOT_FOUND, http: 404, condition: "Topping id in topping_ids does not exist" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "Batch id does not exist" }
  - { id: ERR_WASTE_EVENT_NOT_FOUND, http: 404, condition: "WasteEvent id does not exist" }
  - { id: ERR_LOYALTY_ACCOUNT_NOT_FOUND, http: 404, condition: "LoyaltyAccount id does not exist" }
  - { id: ERR_DRAWER_NOT_FOUND, http: 404, condition: "CashDrawerSession id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "Order id does not exist" }
  - { id: ERR_ORDER_LINE_NOT_FOUND, http: 404, condition: "OrderLine id does not exist under the order" }
  - { id: ERR_PREORDER_NOT_FOUND, http: 404, condition: "PreOrder id does not exist" }
  - { id: ERR_EVENT_CART_NOT_FOUND, http: 404, condition: "EventCart id does not exist" }
  - { id: ERR_DECORATING_STATION_NOT_FOUND, http: 404, condition: "DecoratingStation id does not exist" }
  - { id: ERR_CATERING_BOOKING_NOT_FOUND, http: 404, condition: "CateringBooking id does not exist" }

  - { id: ERR_ORDER_NOT_OPEN, http: 409, condition: "Order not in required state (OPEN for line/pay/void; PAID for refund)" }
  - { id: ERR_EMPTY_ORDER, http: 409, condition: "Pay attempted on an order with zero ACTIVE lines" }
  - { id: ERR_DRAWER_NOT_OPEN, http: 409, condition: "Pay attempted while owning drawer is CLOSED" }
  - { id: ERR_DRAWER_ALREADY_CLOSED, http: 409, condition: "Close attempted on an already-CLOSED drawer" }
  - { id: ERR_BATCH_NOT_PREP, http: 409, condition: "Release attempted on a batch not in PREP" }
  - { id: ERR_BATCH_NOT_AVAILABLE, http: 409, condition: "Waste attempted on a batch not in PREP/AVAILABLE" }
  - { id: ERR_PREORDER_INVALID_STATE, http: 409, condition: "PreOrder transition attempted from an illegal state" }
  - { id: ERR_CATERING_INVALID_STATE, http: 409, condition: "CateringBooking transition attempted from an illegal state" }

  - { id: ERR_ALLERGEN_RESTRICTION_CONFLICT, http: 409, condition: "Line allergen_label intersects the order's LoyaltyAccount.allergen_restrictions" }
  - { id: ERR_FLAVOR_OUT_OF_SEASON, http: 409, condition: "Seasonal flavor sold on a line outside its season window at clock time" }
  - { id: ERR_FLAVOR_UNAVAILABLE, http: 409, condition: "start-production blocked: base flavor inactive, out of season, or OUT_OF_STOCK" }
  - { id: ERR_CART_OVERLAP, http: 409, condition: "EventCart already booked for an overlapping window (half-open; touching allowed)" }
  - { id: ERR_STATION_OVERLAP, http: 409, condition: "DecoratingStation window collides within STATION_CLEAN_BUFFER_MIN buffer of another pre-order" }
  - { id: ERR_INSUFFICIENT_BATCH_VOLUME, http: 409, condition: "Requested volume exceeds available FIFO headroom for the flavor" }

  - { id: ERR_INSUFFICIENT_CASH_TENDERED, http: 402, condition: "CASH tendered less than total_cents" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_preorder_version does not match current PreOrder.version on re-quote" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Manager
    description: "Owns catalog/config, catering, pre-order pricing/cancel, refunds"
    identity: opaque
    exclusive_operations:
      - "POST /flavors, PATCH /flavors/{id} — flavor config"
      - "POST /size-options, POST /toppings — menu config"
      - "POST /event-carts, POST /decorating-stations — resources"
      - "POST /pre-orders/{id}/requote — re-quote (OCC)"
      - "POST /pre-orders/{id}/cancel — cancel pre-order"
      - "POST /catering-bookings, POST /catering-bookings/{id}/close, POST /catering-bookings/{id}/cancel — catering lifecycle"
    shared_operations:
      - "POST /loyalty-accounts — with Scooper"
      - "POST /pre-orders, POST /pre-orders/{id}/confirm, POST /pre-orders/{id}/fulfill — with Scooper"
      - "POST /orders/{id}/refund — with ShiftLead"
      - "All GET endpoints"

  - name: ShiftLead
    description: "Owns the cash drawer, voids, and refunds"
    identity: opaque
    exclusive_operations:
      - "POST /cash-drawer-sessions, POST /cash-drawer-sessions/{id}/close — drawer lifecycle"
      - "POST /orders/{id}/void — void ticket"
    shared_operations:
      - "POST /orders, POST /orders/{id}/lines, DELETE /orders/{id}/lines/{lineId}, POST /orders/{id}/pay — with Scooper"
      - "POST /orders/{id}/refund — with Manager"
      - "All GET endpoints"

  - name: Scooper
    description: "Frontline POS: rings orders, lines, payments, loyalty"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /orders, POST /orders/{id}/lines, DELETE /orders/{id}/lines/{lineId}, POST /orders/{id}/pay — with ShiftLead"
      - "POST /loyalty-accounts — with Manager"
      - "POST /pre-orders, POST /pre-orders/{id}/confirm, POST /pre-orders/{id}/fulfill — with Manager"
      - "All GET endpoints"

  - name: Baker
    description: "Owns production: batches, releases, waste, pre-order production transitions"
    identity: opaque
    exclusive_operations:
      - "POST /batches, POST /batches/{id}/release — production"
      - "POST /waste-events — melt/shrink/waste log"
      - "POST /pre-orders/{id}/start-production, POST /pre-orders/{id}/request-revision — production transitions"
    shared_operations:
      - "All GET endpoints"
