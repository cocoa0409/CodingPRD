          assert:
            - "${event_a_state} == SCHEDULED"
            - "${locked_posture} == LOCKED"
            - "${exc_state} == ESCALATED"
            - "${event_b_state} == NOTIFIED"
            - "${event_b_baseline} == 1270.17"
            - "${state_error} == ERR_DR_EVENT_STATE_INVALID"
            - "${safety_error} == ERR_FOOD_SAFETY_HOLD"
            - "both triggers return HTTP 409"
            - "DemandResponseEvent.${event_a_id}.event_state == SCHEDULED"
            - "DemandResponseEvent.${event_b_id}.event_state == NOTIFIED"
            - "Store.${store_id}.energy_posture == LOCKED"

