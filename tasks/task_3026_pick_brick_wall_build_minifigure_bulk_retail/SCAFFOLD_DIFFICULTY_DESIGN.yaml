              as: StoreAssociate
          assert:
            - "the first draw leaves WallBin.${bin_l01}.fill_pct == 50.0 and status OPEN, read through GET /stores/wall-bins with store_id ${store12_id}"
            - "the one-gram draw leaves fill_pct == 49.9 and status LOW"
            - "the 350 g draw leaves fill_pct == 14.9 and status EMPTY"
            - "WallBin.${bin_l01}.bin_mass_grams == 149"

      - name: wave_reconcile_rounds_are_fenced_so_a_late_waitlist_join_is_admitted
        grounds:
          - calculations.last_call_promotion
          - state_machines.StoreEvent.OPEN_to_CLOSED
          - state_machines.MiniBuildReservation.WAITLISTED_to_NOT_ADMITTED
        distinguishing_aspect: "Round 2 is fenced before Round 3: the same wave that promotes a waitlisted member also marks an unconverted reservation NOT_ADMITTED, while a join recorded after the wave stays WAITING and is left untouched by the Round 3 purge."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0013 with wall_bin_capacity_grams 1000, one element, one bin holding 600 g, event on 2026-09-02 with capacity 1, one REGISTERED and one WAITLISTED reservation."
