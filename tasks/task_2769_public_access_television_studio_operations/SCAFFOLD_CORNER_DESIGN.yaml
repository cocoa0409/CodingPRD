      - name: corner_series_seniority_preempts_first_come_incumbent_by_timestamp
        claim_type: chronological
        grounds:
          - calculations.playback_conflict_resolution
          - validations[priority=27]
          - errors[ERR_SLOT_WINDOW_CONFLICT]
          - state_machines.PlaybackSlot.SCHEDULED_to_PREEMPTED
          - entities.PlaybackSlot.fields.booking_type
        distinguishing_aspect: "Priority is decided by strictly-earlier seniority against the incumbent's created_at, never by insertion order or id: a series whose seniority is 2026-09-01 cannot displace a first-come slot created 2026-08-06, while a series anchored at 2024-03-01 displaces the very same incumbent."
        test_recipe:
          setup:
            - "Producer P is ACTIVE and BASIC and owns two APPROVED, CLEARED programs PR1 and PR2 (runtime 1800, no crew roles)."
            - "Channel PATV1 has preemption_enabled at its default true and buffer 120."
            - "Slot F on PR1 is SCHEDULED at 2026-08-20T18:00:00Z as FIRST_COME, created at clock 2026-08-06T00:00:00Z."
