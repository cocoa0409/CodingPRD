  - section: cross_cutting_complexity_layers
    instances:
      - name: a_reconciliation_pinned_to_a_carrier_version_that_has_moved_is_refused
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[quota-reconciliation-supersede]
          - errors[ERR_STALE_CARRIER_VERSION]
          - validations[priority=7][error_id=ERR_STALE_CARRIER_VERSION]
          - endpoints[POST /plan/quota-reconciliations].input
          - entities.Carrier.fields.version
        distinguishing_aspect: |
          The supersede is lawful, so the only defence against filing a variance off stale volume is the
          version pin: an unrelated write to the carrier row - here a licensing amendment - invalidates
          a token the filer read moments earlier, and the 412 must arrive before any reconciliation row
          is created. Re-reading the row yields a token that works, and the successful filing itself
          bumps the version again, which is what makes a blind retry of the same token fail twice.
        test_recipe:
          setup:
            - "Clock at 2026-11-30. Period 2026-P3 (2026-09-01..2026-11-30) has been closed to RECONCILING with total_assignable_units 1."
            - "Atlas Mutual (6000 bps, licensed T02) holds quota_target_units 1 (exact share 0.6, floor 0, the single leftover unit on the larger remainder) and assigned_risk_count 1; Beacon Casualty (4000 bps) holds quota_target_units 0."
            - "Atlas services policy AR-100014 and its current version has been captured as ${c1_ver}. Neither carrier has filed a reconciliation."
          setup_api_calls:
            - call: "POST /plan/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
