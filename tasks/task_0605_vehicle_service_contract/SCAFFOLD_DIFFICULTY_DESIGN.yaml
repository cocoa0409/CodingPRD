          assert:
            - "ReinsurancePool.${pool_id}.paid_loss_cents == 0 after reverse (LOSS_PAID + LOSS_REVERSED == 0)"
            - "Claim.${claim_id}.payment_status == VOID"

      - name: reverse_authorization_contract_paid_claim_total_conserved
        grounds:
