            - "EngineeringEscalation.${esc}.status == MONITORING"
            - "EngineeringEscalation.${esc}.monitoring_until == '2026-10-30' (2026-08-01 + 90 days)"

      - name: repair_line_reverse_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RepairLine, "errors[ERR_INVALID_LINE_STATE]"]
        distinguishing_aspect: "A REVERSED repair line cannot be reversed again; and reversal is only possible while the RMA is in IN_REPAIR/AWAITING_PARTS."
        test_recipe:
          setup: ["IN_REPAIR RMA with one CONSUMED line, already reversed once"]
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/failure-codes", as: EngineeringLead, payload: { code: "F-PWR-01", description: "No power", severity: "HIGH" }, captures: { fc: $.data.id } }
            - { call: "POST /depot/parts", as: DepotManager, payload: { sku: "P1", name: "Power board", unit_cost_cents: 5000, initial_stock: 10 }, captures: { part: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead" }, captures: { rma: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma}/receive", as: IntakeAgent, payload: { serial_number: "SN-1" } }
            - { call: "POST /depot/rmas/${rma}/triage", as: IntakeAgent, payload: { primary_failure_code_id: "${fc}" } }
            - { call: "POST /depot/rmas/${rma}/diagnose", as: DepotTechnician, as_user_id: "tech-1", payload: { labor_minutes_est: 10, repairability: "REPAIRABLE", planned_parts: [ { part_id: "${part}", quantity: 1 } ] }, captures: { rma_v: $.data.version } }
            - { call: "POST /depot/rmas/${rma}/parts", as: DepotTechnician, as_user_id: "tech-1", payload: { part_id: "${part}", quantity: 1, failure_code_id: "${fc}", expected_rma_version: "${rma_v}" }, captures: { line: $.data.id } }
            - { call: "POST /depot/repair-lines/${line}/reverse", as: DepotTechnician, as_user_id: "tech-1", payload: {} }
          trigger:
            - { call: "POST /depot/repair-lines/${line}/reverse", as: DepotTechnician, as_user_id: "tech-1", payload: {} , captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_LINE_STATE (line already terminal REVERSED)"
            - "Part.${part}.stock_on_hand == 10 (no double restock)"
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: late_fee_zero_on_due_date
        claim_type: correct_result
        grounds: [calculations.loaner_late_fee, entities.LoanerReservation.fields.due_date]
        distinguishing_aspect: "Boundary: returning exactly on due_date yields late_fee_cents == 0 (as_of <= due_date); due_date == ship date + loaner_grace_days."
        test_recipe:
          setup:
            - "LOANER RMA fully repaired and shipped at 2026-08-01; grace 10 days -> due 2026-08-11"
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5, loaner_grace_days: 10 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com", credit_limit_cents: 100000 }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/failure-codes", as: EngineeringLead, payload: { code: "F-PWR-01", description: "No power", severity: "HIGH" }, captures: { fc: $.data.id } }
            - { call: "POST /depot/parts", as: DepotManager, payload: { sku: "P1", name: "Power board", unit_cost_cents: 5000, initial_stock: 10 }, captures: { part: $.data.id } }
            - { call: "POST /depot/loaner-units", as: DepotManager, payload: { asset_tag: "LU-1", model_id: "${mdl}", condition_grade: "A", deposit_value_cents: 40000 }, captures: { lu: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead", service_option: "LOANER" }, captures: { rma: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma}/loaner-reservations", as: IntakeAgent, payload: { loaner_unit_id: "${lu}", start_date: "2026-08-01", end_date: "2026-08-20" }, captures: { res: $.data.id } }
            - { call: "POST /depot/loaner-reservations/${res}/ship", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma}/receive", as: IntakeAgent, payload: { serial_number: "SN-1" } }
            - { call: "POST /depot/rmas/${rma}/triage", as: IntakeAgent, payload: { primary_failure_code_id: "${fc}" } }
            - { call: "POST /depot/rmas/${rma}/diagnose", as: DepotTechnician, as_user_id: "tech-1", payload: { labor_minutes_est: 10, repairability: "REPAIRABLE", planned_parts: [ { part_id: "${part}", quantity: 1 } ] }, captures: { rma_v: $.data.version } }
            - { call: "POST /depot/rmas/${rma}/parts", as: DepotTechnician, as_user_id: "tech-1", payload: { part_id: "${part}", quantity: 1, failure_code_id: "${fc}", expected_rma_version: "${rma_v}" } }
            - { call: "POST /depot/rmas/${rma}/repair-complete", as: DepotTechnician, as_user_id: "tech-1", payload: {} }
            - { call: "POST /depot/rmas/${rma}/qa-release", as: DepotTechnician, as_user_id: "tech-2", payload: { outcome: "PASS" } }
            - { call: "POST /depot/rmas/${rma}/ship", as: DepotTechnician, as_user_id: "tech-2", payload: { carrier: "UPS", tracking_number: "1Z" } }
            - { call: "POST /depot/_clock/set_current_utc", as: DepotManager, payload: { to_iso8601: "2026-08-11T00:00:00Z" } }
          trigger:
            - { call: "POST /depot/loaner-reservations/${res}/return", as: IntakeAgent, payload: { condition: "OK" }, captures: { fee: $.data.late_fee_cents, due: $.data.due_date } }
          assert:
            - "LoanerReservation.${res}.due_date == '2026-08-11'"
            - "LoanerReservation.${res}.late_fee_cents == 0 (return on due_date is not late)"
            - "LoanerReservation.${res}.status == CLOSED_RETURNED"

      - name: sla_breach_only_when_net_strictly_greater
        claim_type: correct_result
        grounds: [calculations.sla_turnaround, entities.ServiceRMA.fields.sla_breached]
        distinguishing_aspect: "Boundary: net business days == SLA target (5) does NOT breach; net 6 does, firing exactly one SLA_BREACH notification. Business-day counting skips the receive day and weekends."
        test_recipe:
          setup:
            - "Model sla_turnaround_business_days 5; RMA received Monday 2026-08-03 and left in RECEIVED"
          setup_api_calls:
            - { call: "POST /depot/_clock/set_current_utc", as: DepotManager, payload: { to_iso8601: "2026-08-03T00:00:00Z" } }
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead" }, captures: { rma: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma}/receive", as: IntakeAgent, payload: { serial_number: "SN-1" } }
          trigger:
            - { call: "POST /depot/_clock/set_current_utc", as: DepotManager, payload: { to_iso8601: "2026-08-10T00:00:00Z" } }
            - { call: "POST /depot/ops/run_daily_close", as: DepotManager, payload: {} , captures: { sweep1: $.data.sla_breached_rma_ids } }
            - { call: "GET /depot/rmas/${rma}", as: IntakeAgent, captures: { br1: $.data.sla_breached } }
            - { call: "POST /depot/_clock/set_current_utc", as: DepotManager, payload: { to_iso8601: "2026-08-11T00:00:00Z" } }
            - { call: "POST /depot/ops/run_daily_close", as: DepotManager, payload: {} , captures: { sweep2: $.data.sla_breached_rma_ids } }
            - { call: "GET /depot/rmas/${rma}/notifications", as: IntakeAgent, payload: {} }
          assert:
            - "At 2026-08-10: net business days == 5 (Aug 4,5,6,7,10) == target -> sla_breached == false and sweep1 does not contain ${rma}"
            - "At 2026-08-11: net 6 > 5 -> sla_breached == true and sweep2 contains ${rma}"
            - "Exactly one SLA_BREACH NotificationEvent exists for ${rma}"

      - name: quote_expiry_swept_by_daily_close
        claim_type: correct_result
        grounds: [calculations.quote_total, state_machines.Quote.SENT_to_EXPIRED]
        distinguishing_aspect: "A SENT quote whose expires_at (sent + quote_valid_days=14) is passed transitions to EXPIRED only via run_daily_close; the RMA stays AWAITING_QUOTE_APPROVAL and a QUOTE_EXPIRED notification fires."
        test_recipe:
          setup: ["OOW RMA with Q1 SENT at 2026-08-01 (expires 2026-08-15)"]
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5, quote_valid_days: 14 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2024-01-01", ship_date: "2024-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/failure-codes", as: EngineeringLead, payload: { code: "F-PWR-01", description: "No power", severity: "HIGH" }, captures: { fc: $.data.id } }
            - { call: "POST /depot/parts", as: DepotManager, payload: { sku: "P1", name: "Power board", unit_cost_cents: 5000, initial_stock: 10 }, captures: { part: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead" }, captures: { rma: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma}/receive", as: IntakeAgent, payload: { serial_number: "SN-1" } }
            - { call: "POST /depot/rmas/${rma}/triage", as: IntakeAgent, payload: { primary_failure_code_id: "${fc}" } }
            - { call: "POST /depot/rmas/${rma}/diagnose", as: DepotTechnician, as_user_id: "tech-1", payload: { labor_minutes_est: 20, repairability: "REPAIRABLE", planned_parts: [ { part_id: "${part}", quantity: 1 } ] } }
            - { call: "GET /depot/rmas/${rma}/quotes", as: DepotTechnician, captures: { q1: "$.data[0].id" } }
          trigger:
            - { call: "POST /depot/_clock/set_current_utc", as: DepotManager, payload: { to_iso8601: "2026-08-16T00:00:00Z" } }
            - { call: "POST /depot/ops/run_daily_close", as: DepotManager, payload: {} , captures: { expired: $.data.expired_quote_ids } }
            - { call: "GET /depot/quotes/${q1}", as: DepotTechnician, captures: { qst: $.data.status } }
          assert:
            - "run_daily_close expired_quote_ids contains ${q1}"
            - "Quote.${q1}.status == EXPIRED"
            - "ServiceRMA.${rma}.status == AWAITING_QUOTE_APPROVAL (unchanged; SLA still paused)"
            - "A QUOTE_EXPIRED NotificationEvent exists for ${rma}"

      - name: loaner_auto_select_ranking_and_grade_exclusion
        claim_type: correct_result
        grounds: [calculations.loaner_unit_selector]
        distinguishing_aspect: "Selector determinism: grade C unit created first is excluded from auto-select; among grade A/B units tied at completed_loan_cycles 0 the earliest created_at wins — never id ordering."
        test_recipe:
          setup:
            - "Pool: LU-C grade C (created first), LU-A grade A, LU-B grade B — all cycles 0"
            - "AUTHORIZED LOANER RMA"
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com", credit_limit_cents: 200000 }, captures: { cust: $.data.id } }
