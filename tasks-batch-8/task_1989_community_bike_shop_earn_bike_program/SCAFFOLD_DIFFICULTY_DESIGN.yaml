        distinguishing_aspect: "ToolMembership is cyclic (ACTIVE -> SUSPENDED -> ACTIVE repeatable) and the cycle gates ToolSession booking: a booking succeeds while ACTIVE, is rejected while SUSPENDED, and succeeds again after reinstate — loop shape on a different entity than DonatedBike/Volunteer."
