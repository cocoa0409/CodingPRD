          same organization_id collides (point-equality uniqueness) and is rejected ERR_DUPLICATE_SITE_URL.
        test_recipe:
          setup:
            - "Org with one Site at url https://dup.test."
          setup_api_calls:
            - call: "POST /compliance/organizations"
