      - name: authorization_fully_drawn_on_exact_draw
        claim_type: side_effect_execution
        grounds:
          - state_machines.Authorization.OBLIGATED_to_FULLY_DRAWN
        excluded_because:
          difficulty_instance: voucher_blocked_when_authorization_fully_drawn
          rationale: "The FULLY_DRAWN auto-transition on reimbursed == obligated is asserted as the setup consequence of the named §1.8 instance."

  # ===========================================================================
  - section: rbac
    instances:
      - name: state_dot_planner_cannot_decide_voucher_returns_forbidden
        claim_type: violation_to_error
        grounds:
          - roles.FHWAReviewer
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "Voucher review is exclusive to FHWAReviewer; the StateDOTPlanner who nominated the project cannot approve its billings (403), and the voucher remains UNDER_REVIEW."
        test_recipe:
          setup: ["UNDER_CONSTRUCTION project; one voucher UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/funding-programs"
              payload: { code: "NHPP", name: "NHPP", eligible_activity_codes: ["ROAD_RESURFACING"] }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /federal-aid/apportionments"
              payload: { funding_program_id: "${prog_id}", state_code: "AZ", federal_fiscal_year: 2027, apportioned_cents: 1000000 }
              as: FHWADivisionAdmin
            - call: "POST /federal-aid/stips"
              payload: { state_code: "AZ", state_federal_land_pct: 0.0, start_federal_fiscal_year: 2027, description: "AZ STIP" }
              as: StateDOTPlanner
              captures: { stip_id: $.data.id }
            - call: "POST /federal-aid/stips/${stip_id}/comments"
              payload: { author_name: "C", comment_text: "Ok." }
              as: StateDOTPlanner
            - call: "POST /federal-aid/projects"
              payload: { stip_id: "${stip_id}", funding_program_id: "${prog_id}", route_name: "R1", description: "P1", activity_code: "ROAD_RESURFACING", is_interstate_system: false, dbe_goal_pct: 0.10, total_estimated_cost_cents: 100000 }
              as: StateDOTPlanner
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/stips/${stip_id}/submit"
              payload: {}
              as: StateDOTPlanner
            - call: "POST /federal-aid/stips/${stip_id}/decide"
              payload: { decision: "APPROVE" }
              as: FHWADivisionAdmin
            - call: "POST /federal-aid/projects/${p_id}/determine-eligibility"
              payload: { determination: "ELIGIBLE" }
              as: FHWADivisionAdmin
            - call: "POST /federal-aid/clearances"
              payload: { project_id: "${p_id}", kind: "ENVIRONMENTAL", nepa_class: "CE" }
              as: StateDOTEngineer
              captures: { c_env: $.data.id }
            - call: "POST /federal-aid/clearances/${c_env}/decide"
              payload: { decision: "CLEARED" }
              as: FHWAReviewer
            - call: "POST /federal-aid/clearances"
              payload: { project_id: "${p_id}", kind: "RIGHT_OF_WAY" }
              as: StateDOTEngineer
              captures: { c_row: $.data.id }
            - call: "POST /federal-aid/clearances/${c_row}/decide"
              payload: { decision: "CLEARED", row_cert_level: "LEVEL_1_FULL" }
              as: FHWAReviewer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/authorizations"
              payload: { project_id: "${p_id}", agreement_number: "FA-RB", initial_obligated_cents: 80000 }
              as: FHWADivisionAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /federal-aid/projects/${p_id}/advertise"
              payload: {}
              as: StateDOTEngineer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/projects/${p_id}/open-bids"
              payload: { bids: [{ contractor_name: "Low", bid_amount_cents: 90000, is_responsive: true }] }
              as: StateDOTEngineer
            - call: "GET /federal-aid/projects/${p_id}/bids"
              payload: {}
              as: FHWAReviewer
              captures: { bid0: "$.data[0].id" }
            - call: "POST /federal-aid/projects/${p_id}/award"
              payload: { bid_id: "${bid0}", dbe_commitment_pct: 0.10 }
              as: FHWAReviewer
            - call: "POST /federal-aid/vouchers"
              payload: { authorization_id: "${auth_id}", period_start_date: "2027-01-01T00:00:00Z", period_end_date: "2027-02-01T00:00:00Z", line_items: [{ description: "w", eligible_amount_cents: 10000 }], documentation_complete: true, is_final: false }
              as: StateDOTEngineer
              captures: { v_id: $.data.id }
            - call: "POST /federal-aid/vouchers/${v_id}/submit"
              payload: {}
              as: StateDOTEngineer
          trigger:
            - call: "POST /federal-aid/vouchers/${v_id}/decide"
              payload: { decision: "APPROVE" }
              as: StateDOTPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response is 403 ERR_FORBIDDEN"
            - "Voucher.${v_id} remains UNDER_REVIEW"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: layer_dual_variant_calculation
        claim_type: variant_divergence
        grounds:
          - calculations.federal_share_determination
          - calculations.apportionment_availability
        excluded_because:
          difficulty_instance: provisional_vs_determined_federal_share_on_interstate_project
          rationale: "Both variant divergences asserted by §1.8 rule dual_variant_calc (both instances)."

      - name: layer_cascading_side_effects
        claim_type: side_effect_execution
        grounds:
          - state_machines.Audit.FINAL_to_CLOSED
          - state_machines.StateProgram.APPROVED_to_PUBLIC_INVOLVEMENT
        excluded_because:
          difficulty_instance: record_repayment_cascades_through_authorization_to_apportionment
          rationale: "Depth-3 and depth-2 chains asserted end-to-end by §1.8 rule transitive_cascade (both instances)."

      - name: layer_rate_threshold_triggers
        claim_type: violation_to_error
        grounds:
          - validations[priority=30]
          - validations[priority=14]
        excluded_because:
          difficulty_instance: authorize_exactly_available_succeeds_one_cent_more_fails
          rationale: "Threshold boundaries asserted by §1.8 rule boundary_precision_check (money and percentage instances)."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: read_after_create_reflects_immediately
        claim_type: retrieval
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Immediate consistency: a STIP readable by a separate GET in the same request stream returns every stored field exactly as created — no lag, no staleness window."
        test_recipe:
          setup: ["Clock set."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/stips"
              payload: { state_code: "NM", state_federal_land_pct: 0.33, start_federal_fiscal_year: 2027, description: "NM STIP" }
              as: StateDOTPlanner
              captures: { stip_id: $.data.id }
          trigger:
            - call: "GET /federal-aid/stips/${stip_id}"
              payload: {}
              as: FHWAReviewer
              captures: { st: $.data.status, fy: $.data.end_federal_fiscal_year }
          assert:
            - "GET returns 200 with state_code NM, state_federal_land_pct 0.33, start 2027, end 2030"
            - "status == PUBLIC_INVOLVEMENT, amendment_count == 0, version == 1, comment_period_opened_at == 2026-09-01T00:00:00Z"
