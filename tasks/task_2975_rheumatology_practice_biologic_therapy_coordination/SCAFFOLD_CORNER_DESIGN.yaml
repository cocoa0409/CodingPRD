      - name: screening_validity_window_is_inclusive_at_365_days_then_expires
        claim_type: precision
        grounds:
          - calculations.screening_status_derivation
          - entities.Patient.fields.tb_screen_status
        distinguishing_aspect: "A NEGATIVE TB_IGRA resulted 2027-07-21 minus 365 days is still CURRENT at exactly 365 days, so tb_screen_status reads CLEARED at 2027-07-21 and flips to EXPIRED — not MISSING — at 2027-07-22, because records exist but none is current."
        test_recipe:
          setup:
            - "One patient with a single NEGATIVE TB_IGRA record resulted 2026-07-21T00:00:00Z and no HBV records."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
