            - call: "POST /studio/pre-production-gates/${gate_id}/submit"
              payload: { package_url: "s3://ad01/script/v1.pdf" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/pre-production-gates/${gate_id}/review-decision"
              payload: { decision: "APPROVED" }
              as: Director
              as_user_id: "u-dir-01"
            - call: "POST /studio/shots"
              payload: { production_id: "${prod_id}", shot_code: "AD01_010_0010", sequence_code: "010", frame_count: 120, budget_cents: 1000000, planned_start_at: "2026-08-01T00:00:00Z", planned_finish_at: "2026-09-30T00:00:00Z" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { shot_id: "$.data.id" }
            - call: "GET /studio/stage-tasks?shot_id=${shot_id}&stage=LAYOUT"
              as: ProductionManager
              captures: { task_id: "$.data[0].id" }
            - call: "POST /studio/stage-tasks/${task_id}/assign"
              payload: { assigned_artist_user_id: "u-artist-01" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "GET /studio/render-pools/${pool_id}"
              as: ProductionManager
              captures: { pool_v1: "$.data.version" }
          trigger:
            - call: "POST /studio/render-jobs"
              payload: { render_pool_id: "${pool_id}", shot_stage_task_id: "${task_id}", priority: "NORMAL", requested_cores: 3, window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-02T06:00:00Z", frame_count: 120, seconds_per_frame: 50, expected_render_pool_version: "${pool_v1}" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { job_id: "$.data.id", est: "$.data.estimated_cost_cents", final_before: "$.data.final_cost_cents" }
            - call: "GET /studio/shots/${shot_id}"
              as: ProductionManager
              captures: { committed_before: "$.data.render_cost_committed_cents", actual_before: "$.data.render_cost_actual_cents" }
            - call: "GET /studio/shots/${shot_id}/earned-value"
              as: ProductionManager
              captures: { acwp_before: "$.data.acwp_cents" }
            - call: "POST /studio/render-jobs/${job_id}/complete"
              payload: { outcome: "COMPLETED", actual_seconds_per_frame: 50, frames_completed: 120 }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { job_status: "$.data.status", final_after: "$.data.final_cost_cents" }
            - call: "GET /studio/shots/${shot_id}"
              as: ProductionManager
              captures: { committed_after: "$.data.render_cost_committed_cents", actual_after: "$.data.render_cost_actual_cents" }
            - call: "GET /studio/shots/${shot_id}/earned-value"
              as: ProductionManager
              captures: { acwp_after: "$.data.acwp_cents" }
          assert:
            - "${est} == 840 and ${final_before} is null while the job is RESERVED"
            - "${committed_before} == 840, ${actual_before} == 0 and ${acwp_before} == 0"
            - "${job_status} == COMPLETED and ${final_after} == 840"
            - "${committed_after} == 0 and ${actual_after} == 840 — the money moves, it is not added twice"
            - "${acwp_after} == 840"
