  - section: validations
    instances:
      - name: malformed_body_beats_missing_client_at_priority_four
        claim_type: priority_conflict
        grounds:
          - validations[priority 4].ERR_INVALID_REQUEST
          - validations[priority 10].ERR_CLIENT_NOT_FOUND
          - endpoints[POST /care/time-entries]
        distinguishing_aspect: "A request that both names a non-existent client and carries end_at <= start_at returns the priority-4 ERR_INVALID_REQUEST (400), never the priority-10 ERR_CLIENT_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "One CareManager Dana; no client with id 00000000-0000-4000-8000-000000000000 exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500 }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
          trigger:
            - call: "POST /care/time-entries"
              payload: { client_id: "00000000-0000-4000-8000-000000000000", care_manager_id: "${cm_dana}", service_type: "CARE_COORDINATION", start_at: "2026-08-11T11:00:00Z", end_at: "2026-08-11T10:00:00Z", service_location_id: "OFFICE" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\" — priority 4 runs before every existence check"
            - "The response is NOT 404 / ERR_CLIENT_NOT_FOUND even though the client_id does not exist"
            - "No TimeEntry row is created: GET /care/time-entries?care_manager_id=${cm_dana} returns an empty data array"

      - name: client_not_found_outranks_care_manager_not_found
        claim_type: priority_conflict
        grounds:
          - validations[priority 10].ERR_CLIENT_NOT_FOUND
          - validations[priority 11].ERR_CARE_MANAGER_NOT_FOUND
        distinguishing_aspect: "With both client_id and care_manager_id absent from the store, the priority-10 client check wins and ERR_CLIENT_NOT_FOUND is returned rather than ERR_CARE_MANAGER_NOT_FOUND."
        test_recipe:
          setup:
            - "One CareManager Dana exists so the caller can authenticate; neither of the two UUIDs used in the payload exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500 }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
          trigger:
            - call: "POST /care/assessments"
              payload: { client_id: "00000000-0000-4000-8000-000000000001", care_manager_id: "00000000-0000-4000-8000-000000000002", domain_scores: { adl: 2, cognition: 2, medical_complexity: 2, social_support: 2, safety: 2, finances: 2 } }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with data.error_id == \"ERR_CLIENT_NOT_FOUND\""
            - "The response is NOT ERR_CARE_MANAGER_NOT_FOUND, although care_manager_id is equally unknown"
            - "The body is well formed, so ERR_INVALID_REQUEST does not pre-empt either existence check"

      - name: stale_client_version_beats_unaccepted_assessment_on_plan_creation
        claim_type: cascading_validation
        grounds:
          - validations[priority 35].ERR_STALE_CLIENT_VERSION
          - validations[priority 42].ERR_ASSESSMENT_NOT_ACCEPTED
          - concurrency_rules.care_plan_creation_on_client
        distinguishing_aspect: "Care-plan creation with a stale expected_client_version and a merely SUBMITTED source assessment returns the priority-35 ERR_STALE_CLIENT_VERSION (412); refreshing the version alone then exposes the priority-42 ERR_ASSESSMENT_NOT_ACCEPTED (409)."
        test_recipe:
          setup:
            - "CareManager Dana, supervisor Iris, Client Rhea."
            - "One assessment left in SUBMITTED (never accepted); Client.version bumped once by a capacity determination after the version was captured."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500 }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/care-managers"
              payload: { full_name: "Iris Vance", credential: "CCM", hourly_rate_cents: 30000, is_supervisor: true }
              as: PracticeAdmin
              captures: { cm_iris: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Rhea Vasquez", residence_setting: "PRIVATE_HOME" }
              as: PracticeAdmin
