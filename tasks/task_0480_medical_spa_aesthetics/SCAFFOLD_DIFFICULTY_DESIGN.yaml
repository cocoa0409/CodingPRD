              as_user_id: "${ci_inj}"
          assert:
            - "LoyaltyAccount.${ci_loy}.points_earned == 339"
            - "LoyaltyAccount.${ci_loy}.points_redeemed == 0"
            - "LoyaltyAccount.${ci_loy}.points_balance == 339"
            - "ComplicationCase.${ci_case}.refund_cents == 22461"
            - "TreatmentPlan.${ci_plan}.finalized_series_cost_cents == 33992"

      - name: lot_units_conserved_under_book_then_cancel
        grounds:
          - calculations.lot_fefo_allocation
          - state_machines.TreatmentSession.null_to_BOOKED
          - state_machines.TreatmentSession.BOOKED_to_CANCELLED
          - entities.InjectableLot.fields.remaining_units
        distinguishing_aspect: |
          A different conserved quantity = injectable units. Booking 20 units
          moves 20 from remaining to reserved (remaining 80, reserved 20,
          consumed 0); cancelling the session releases them back, restoring
          remaining=100, reserved=0, consumed=0 — total_units == remaining +
          reserved + consumed == 100 at every step.
        test_recipe:
          setup:
