            - call: "GET /rcm/denial-cases/${d1}/recovery-projection"
              payload: { variant: "net" }
              as: DenialsSpecialist
              captures: { net_cents: $.data.expected_recovery_cents }
          assert:
            - "default (no variant) == gross: expected_recovery_cents == 100000 and remaining_levels == 2"
            - "net variant: expected_recovery_cents == 90000 (100000 - 5000 * 2 remaining levels)"

      - name: response_due_date_uses_policy_window
        claim_type: correct_result
        grounds: [entities.Appeal.fields.response_due_date]
        distinguishing_aspect: "response_due_date is submission date + policy.response_window_days: a 21-day window at submit 2026-08-05 yields 2026-08-26."
        test_recipe:
          setup: ["payer A with level-1 policy (60d filing, response_window_days 21); code CO-16; denial CLM-2206 QUEUED; appeal LETTER_GENERATED with CLINICAL_NOTES; clock 2026-08-05"]
          setup_api_calls:
