  # ============================================================
  # Rule 4 — transitive cascade chains from different triggers
  # ============================================================
  - rule_id: transitive_cascade
    instances:

      - name: tc_clock_advance_drives_three_hop_chain
        grounds:
          - state_machines.AnnualReport.DRAFT_to_DELINQUENT
          - state_machines.BusinessEntity.ACTIVE_to_DELINQUENT
          - calculations.compliance_posture
        distinguishing_aspect: |
          Origin trigger: POST /_clock/set_current_utc past 2025-04-15T23:59:59Z.
          Hop 1: clock advance causes AnnualReport.status DRAFT -> DELINQUENT
          (caused by clock, not by direct user action on the report).
          Hop 2: that AnnualReport DELINQUENT directly causes BusinessEntity
          ACTIVE -> DELINQUENT (caused by hop 1, not by clock).
          Hop 3: that BusinessEntity transition recomputes
          compliance_posture -> RESTRICTED (caused by hop 2). Depth = 3.
        test_recipe:
          setup:
            - "DE LLC entity ACTIVE with one DRAFT AnnualReport for period_year=2024."
            - "Clock initially at 2024-12-01T00:00:00Z (before delinquency)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-12-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /business-entities"
              payload: { legal_name: "JULIET LLC", entity_type: "LLC", formation_state_code: "DE", revenue_band: "ZERO" }
              as: Anonymous
              captures: { be_id: $.data.id, be_v0: $.data.version }
            - call: "POST /business-entities/${be_id}/registered-agents"
              payload: { agent_name: "DE Agent", agent_type: "COMMERCIAL", agent_state_code: "DE", expected_business_entity_version: "${be_v0}" }
              as: Filer
              as_user_id: "${be_id}"
            - call: "POST /business-entities/${be_id}/operating-agreements"
              payload: { template_type: "MEMBER_MANAGED", members_json: { entries: [ { name: "M1", ownership_pct: 100 } ] } }
              as: Filer
              as_user_id: "${be_id}"
              captures: { oa_id: $.data.id }
            - call: "POST /operating-agreements/${oa_id}/execute"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
            - call: "POST /business-entities/${be_id}/ein-applications"
              payload: { responsible_party_name: "R", responsible_party_ssn_last4: "0050" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ein_id: $.data.id }
            - call: "POST /ein-applications/${ein_id}/issue"
              payload: {}
              as: StateAdmin
            - call: "POST /business-entities/${be_id}/annual-reports"
              payload: { period_year: 2024 }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ar_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-05-01T00:00:00Z" }
              as: StateAdmin
            - call: "GET /business-entities/${be_id}/annual-reports"
              payload: {}
              as: ComplianceOfficer
              captures: { ar_status: $.data.0.status }
            - call: "GET /business-entities/${be_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { be_status_after: $.data.status, posture_after: $.data.compliance_posture }
          assert:
            - "AnnualReport.${ar_id}.status == DELINQUENT  # hop 1 caused by clock"
            - "BusinessEntity.${be_id}.status == DELINQUENT  # hop 2 caused by hop 1"
            - "BusinessEntity.${be_id}.compliance_posture == RESTRICTED  # hop 3 caused by hop 2"

      - name: tc_registered_agent_resign_drives_two_hop_chain
        grounds:
          - state_machines.RegisteredAgent.ACTIVE_to_RESIGNED
          - calculations.compliance_posture
        distinguishing_aspect: |
          Different originating transition (POST /registered-agents/{id}/resign,
          not a clock advance). Hop 1: RegisteredAgent flips ACTIVE -> RESIGNED.
          Hop 2: BusinessEntity.compliance_posture is recomputed and flips
          GOOD_STANDING -> RESTRICTED because no ACTIVE agent remains.
          Depth = 2. The chain originates from a user-action transition,
          structurally distinct from the clock-driven cascade above.
        test_recipe:
          setup:
            - "DE LLC entity ACTIVE, compliance_posture=GOOD_STANDING, exactly one ACTIVE RegisteredAgent."
            - "Clock pinned at 2026-02-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /business-entities"
              payload: { legal_name: "KILO LLC", entity_type: "LLC", formation_state_code: "DE", revenue_band: "ZERO" }
              as: Anonymous
              captures: { be_id: $.data.id, be_v0: $.data.version }
            - call: "POST /business-entities/${be_id}/registered-agents"
              payload: { agent_name: "DE Agent", agent_type: "COMMERCIAL", agent_state_code: "DE", expected_business_entity_version: "${be_v0}" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /business-entities/${be_id}/operating-agreements"
              payload: { template_type: "MEMBER_MANAGED", members_json: { entries: [ { name: "M1", ownership_pct: 100 } ] } }
              as: Filer
              as_user_id: "${be_id}"
              captures: { oa_id: $.data.id }
            - call: "POST /operating-agreements/${oa_id}/execute"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
            - call: "POST /business-entities/${be_id}/ein-applications"
              payload: { responsible_party_name: "R", responsible_party_ssn_last4: "0060" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ein_id: $.data.id }
            - call: "POST /ein-applications/${ein_id}/issue"
              payload: {}
              as: StateAdmin
            - call: "GET /business-entities/${be_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { posture_pre: $.data.compliance_posture }
          trigger:
            - call: "POST /registered-agents/${ra_id}/resign"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
              captures: { ra_status: $.data.status }
            - call: "GET /business-entities/${be_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { posture_post: $.data.compliance_posture }
          assert:
            - "RegisteredAgent.${ra_id}.status == RESIGNED  # hop 1 from /resign"
            - "BusinessEntity.${be_id}.compliance_posture == RESTRICTED  # hop 2 from hop 1"

  # ============================================================
  # Rule 5 — validation priority conflicts across different error-category pairs
  # ============================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: ppvc_state_vs_referential_dissolved_with_bad_fk
        grounds:
          - validations[priority=45]
          - validations[priority=30]
        distinguishing_aspect: |
          Pair (state vs existence): a request to create a ForeignQualification
          on a DISSOLVED BusinessEntity that also references a non-existent
          foreign_registered_agent_id violates two rules:
          existence (priority 30, category=existence) AND parent-dissolved
          (priority 45, category=state). The higher-priority error
          (lower numeric priority) wins -> ERR_NOT_FOUND, not
          ERR_ENTITY_DISSOLVED.
        test_recipe:
          setup:
            - "DE LLC entity DISSOLVED."
            - "Clock pinned at 2026-03-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /business-entities"
              payload: { legal_name: "LIMA LLC", entity_type: "LLC", formation_state_code: "DE", revenue_band: "ZERO" }
              as: Anonymous
              captures: { be_id: $.data.id, be_v0: $.data.version }
            - call: "POST /business-entities/${be_id}/registered-agents"
              payload: { agent_name: "DE Agent", agent_type: "COMMERCIAL", agent_state_code: "DE", expected_business_entity_version: "${be_v0}" }
              as: Filer
              as_user_id: "${be_id}"
            - call: "POST /business-entities/${be_id}/operating-agreements"
              payload: { template_type: "MEMBER_MANAGED", members_json: { entries: [ { name: "M1", ownership_pct: 100 } ] } }
              as: Filer
              as_user_id: "${be_id}"
              captures: { oa_id: $.data.id }
            - call: "POST /operating-agreements/${oa_id}/execute"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
            - call: "POST /business-entities/${be_id}/ein-applications"
              payload: { responsible_party_name: "R", responsible_party_ssn_last4: "0070" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ein_id: $.data.id }
            - call: "POST /ein-applications/${ein_id}/issue"
              payload: {}
              as: StateAdmin
            - call: "PATCH /business-entities/${be_id}/dissolve"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
