          - errors[ERR_PRODUCTION_ASSET_NOT_FOUND]
        distinguishing_aspect: |
          production_asset_id is an FK carried in the request BODY, so it is resolved at priority
          60 (after schema validation at 50) and reports ERR_PRODUCTION_ASSET_NOT_FOUND, not the
          generic ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Empty database; the UUID 22222222-2222-4222-8222-222222222222 names no asset."
          setup_api_calls:
