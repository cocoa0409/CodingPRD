            - "${clm_v11_status} == \"ADJUDICATED_APPROVED\" and ${clm_v11_allowed} == 10000 — allowed_cents == billed_cents is legal"
            - "RiskPool.${pool_v11}.paid_claims_cents == 0 — approval alone moves no ledger"

      - name: four_uniqueness_scopes_each_rejected_with_their_own_error
        claim_type: violation_to_error
        grounds:
          - validations.priority_20_ERR_DUPLICATE_TAX_ID_NPI_MEMBER_ID_COVERAGE_MONTH
        distinguishing_aspect: |
          One rule, four differently scoped uniqueness clauses, four distinct
          error ids: payer_tax_id is global across agreements, npi and
          external_member_id are scoped WITHIN an agreement, and coverage_month is
          unique among the agreement's non-DISPUTED EnrollmentFile rows. The
          fixture proves the scoping by re-using the same npi and the same
          external_member_id successfully under a SECOND agreement — a global
          uniqueness implementation rejects those calls.
