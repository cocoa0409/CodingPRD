            - "deciding the APPROVED show again -> 409 ERR_SHOW_LICENSE_NOT_SUBMITTED"
            - "re-submitting the DENIED show -> 409 ERR_SHOW_LICENSE_NOT_DRAFT"
            - "deciding the DENIED show again -> 409 ERR_SHOW_LICENSE_NOT_SUBMITTED"
