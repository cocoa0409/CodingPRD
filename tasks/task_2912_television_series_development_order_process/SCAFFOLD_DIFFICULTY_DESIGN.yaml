              as: PlatformAdmin
              captures: { slate_id: $.data.id }
            - call: "POST /writers"
              payload: { full_name: "Ada Reyes", agency_id: "${ag_id}", guild_minimum_tier: "HIGH", quote_per_step_cents: 5000000 }
              as: AgencyRep
              as_user_id: "${ag_id}"
              captures: { wr_id: $.data.id }
            - call: "POST /pitches"
              payload: { agency_id: "${ag_id}", slate_id: "${slate_id}", title: "Fault Lines", logline: "A seismologist predicts the quake nobody wants to hear about.", packaging_elements: [], underlying_ip_key: "IP-FAULT-LINES" }
              as: AgencyRep
              as_user_id: "${ag_id}"
              captures: { pitch_id: $.data.id }
            - call: "POST /pitches/${pitch_id}/rights-checks"
              payload: { underlying_ip_key: "IP-FAULT-LINES", chain_of_title_status: "CLEAN", holdback_start_date: "2026-01-01", holdback_end_date: "2026-03-01" }
              as: BusinessAffairs
            - call: "POST /pitches/${pitch_id}/coverage"
              payload: { coverage_score: 82.5, recommendation: "ADVANCE" }
              as: DevelopmentExec
            - call: "POST /pitches/${pitch_id}/advance"
              payload: {}
              as: DevelopmentExec
              captures: { proj_id: $.data.id }
            - call: "POST /script-deals"
              payload: { project_id: "${proj_id}", writer_id: "${wr_id}", guaranteed_step_count: 1, option_period_days: 60, steps: [{ step_type: "STORY", fee_cents: 3000000 }] }
              as: BusinessAffairs
              captures: { deal_id: $.data.id }
            - call: "GET /script-deals/${deal_id}/steps"
              payload: {}
              as: BusinessAffairs
              captures: { step1_id: "$.data[0].id" }
            - call: "POST /script-deals/${deal_id}/steps/${step1_id}/exercise"
              payload: {}
              as: BusinessAffairs
            - call: "POST /script-deals/${deal_id}/steps/${step1_id}/deliver"
