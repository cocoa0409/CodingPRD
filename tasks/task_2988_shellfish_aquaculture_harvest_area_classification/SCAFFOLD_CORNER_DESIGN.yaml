      - name: rainfall_exactly_at_the_threshold_opens_a_ninety_six_hour_closure
        claim_type: constants_applied
        grounds:
          - state_machines[GrowingArea.harvest_status OPEN -> CLOSED_RAINFALL]
          - entities.GrowingArea.fields.closure_reopen_eligible_at
          - entities.RainfallEvent.fields.triggered_closure
          - calculations.area_reopen_eligibility
        distinguishing_aspect: |
          The threshold comparison is >= inclusive, so exactly 1.00 in against a 1.00 in threshold
          closes the area, and the reopen-eligible instant is computed from the event's observed_at
          plus the area's own rainfall_closure_hours (96 h) — not from the logical clock at which the
          event was reported — giving 2026-08-09T00:00:00Z from a 2026-08-05T00:00:00Z observation.
        test_recipe:
          setup:
            - "GrowingArea GA-114 with default configuration: rainfall_closure_threshold_in 1.00 and rainfall_closure_hours 96, harvest_status OPEN, classification APPROVED."
            - "Logical clock advanced to 2026-08-06T00:00:00Z so that a 2026-08-05 observation is in the past."
            - "No authorizations, lots or shipments exist, so the closure cascade has nothing to move."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-114", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: false }
              as: ShellfishControlAuthority
              captures: { area: $.data.id }
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: ShellfishControlAuthority
          trigger:
            - call: "POST /shellfish/growing-areas/${area}/rainfall-events"
              payload: { gauge_code: "RG-7", observed_at: "2026-08-05T00:00:00Z", inches_24h: 1.0 }
              as: ShellfishControlAuthority
          assert:
            - "HTTP 201 with data.triggered_closure == true and data.inches_24h == 1.00 and data.observed_at == 2026-08-05T00:00:00Z"
            - "data.voided_authorization_count == 0"
            - "GET /shellfish/growing-areas/${area} reports harvest_status == CLOSED_RAINFALL"
            - "GET /shellfish/growing-areas/${area} reports last_closure_started_at == 2026-08-05T00:00:00Z and closure_reopen_eligible_at == 2026-08-09T00:00:00Z (observed_at + 96 h, not clock + 96 h)"
            - "GET /shellfish/growing-areas/${area} reports classification == APPROVED (the rainfall dimension never touches the sanitary dimension) and consecutive_clean_samples == 0"

