              payload: { plan_type: "INITIAL" }
              as: TestCoordinator
              captures: { plan_id: "$.data.id" }
            - call: "POST /compliance/sampling-plans/${plan_id}/activate"
              payload: {}
              as: TestCoordinator
            - call: "POST /compliance/test-orders"
              payload:
                product_id: "${product_id}"
                sampling_plan_id: "${plan_id}"
                laboratory_id: "${lab_id}"
                rule_id: "${rule_lead_id}"
                sample_count: 1
                window_start: "2026-08-02T00:00:00Z"
                window_end: "2026-08-03T00:00:00Z"
              as: TestCoordinator
              captures: { order_id: "$.data.id" }
          trigger:
            - "Dimension 1 — parent enum: POST /compliance/laboratories/${lab_id}/operational-state with operational_state BARRED as ComplianceAdministrator, then POST /compliance/test-orders/${order_id}/start-testing as LaboratoryUser (user lab-user-meridian)."
            - "Restore: POST /compliance/laboratories/${lab_id}/operational-state with operational_state ACTIVE as ComplianceAdministrator, then retry start-testing."
            - "Dimension 2 — parent temporal state: POST /compliance/_clock/set_current_utc to 2026-09-02T00:00:00Z, then POST /compliance/test-orders/${order_id}/cancel as TestCoordinator, book a fresh order in the window 2026-09-03..2026-09-04, and call start-testing on it as LaboratoryUser (user lab-user-meridian)."
