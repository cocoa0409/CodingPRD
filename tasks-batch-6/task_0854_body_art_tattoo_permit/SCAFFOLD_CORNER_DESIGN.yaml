  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_establishment_version_rejects_second_renewal_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[renewal-create-supersede-stale-establishment]
          - errors[ERR_STALE_ESTABLISHMENT_VERSION]
          - endpoints["POST /body-art/renewal-applications"]
        distinguishing_aspect: "Creating the first RenewalApplication increments Establishment.version, so a strictly later create still carrying the previously observed version is rejected with ERR_STALE_ESTABLISHMENT_VERSION (412) and no second application row is written."
        test_recipe:
          setup:
            - "One ACTIVE Establishment whose version has been read once and then advanced by a successful renewal create."
          setup_api_calls:
            - call: "POST /body-art/establishments"
              payload: { name: "OCC Establishment Ink", street_address: "53 Fiftythird St", county_code: "ADA", establishment_type: "TATTOO" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { est_id: $.data.id }
            - call: "POST /body-art/plan-reviews"
              payload: { establishment_id: "${est_id}", floor_plan_reference: "FP-OC", sterilization_area_sqft: 60, procedure_station_count: 2, has_handwash_sink: true }
              as: EstablishmentOperator
              as_user_id: "${est_id}"
              captures: { pr_id: $.data.id }
            - call: "POST /body-art/plan-reviews/${pr_id}/decision"
              payload: { decision: "APPROVE", decision_notes: "Approved" }
              as: PlanReviewer
              as_user_id: "reviewer-1"
            - call: "POST /body-art/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "PREOPENING", scheduled_start_at: "2026-05-01T00:00:00Z", scheduled_end_at: "2026-05-01T02:00:00Z" }
              as: Inspector
              as_user_id: "officer-insp-1"
              captures: { ins_pre_id: $.data.id }
            - call: "POST /body-art/inspections/${ins_pre_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
            - call: "POST /body-art/inspections/${ins_pre_id}/finalize"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
            - call: "POST /body-art/establishments/${est_id}/activate"
              payload: {}
              as: HealthOfficer
              as_user_id: "officer-ho-1"
            - call: "GET /body-art/establishments/${est_id}"
              payload: {}
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { est_v: $.data.version }
            - call: "POST /body-art/renewal-applications"
              payload: { establishment_id: "${est_id}", requested_term_start_on: "2027-05-01T00:00:00Z", attested_bbp_current: true, attested_sterilization_logs_complete: true, expedite_requested: false, expected_establishment_version: "${est_v}" }
              as: EstablishmentOperator
              as_user_id: "${est_id}"
              captures: { ra_a_id: $.data.id }
          trigger:
            - call: "POST /body-art/renewal-applications"
              payload: { establishment_id: "${est_id}", requested_term_start_on: "2027-05-01T00:00:00Z", attested_bbp_current: true, attested_sterilization_logs_complete: true, expedite_requested: false, expected_establishment_version: "${est_v}" }
              as: EstablishmentOperator
              as_user_id: "${est_id}"
              captures: { err: $.data.error_id }
            - call: "GET /body-art/establishments/${est_id}"
              payload: {}
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { est_v2: $.data.version }
            - call: "POST /body-art/renewal-applications"
              payload: { establishment_id: "${est_id}", requested_term_start_on: "2027-05-01T00:00:00Z", attested_bbp_current: true, attested_sterilization_logs_complete: true, expedite_requested: false, expected_establishment_version: "${est_v2}" }
              as: EstablishmentOperator
              as_user_id: "${est_id}"
              captures: { ra_b_id: $.data.id }
          assert:
            - "${err} == ERR_STALE_ESTABLISHMENT_VERSION"
            - "the stale create returns HTTP 412"
            - "${est_v2} == ${est_v} + 1"
            - "the refreshed create returns HTTP 201"
            - "RenewalApplication.${ra_a_id}.status == SUPERSEDED"
            - "RenewalApplication.${ra_b_id}.status == DRAFT"
            - "GET /body-art/renewal-applications with establishment_id == ${est_id} returns total_count == 2"

      - name: occ_stale_artist_version_rejects_artist_enforcement
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[artist-enforcement-create-stale-artist]
          - errors[ERR_STALE_ARTIST_VERSION]
          - endpoints["POST /body-art/artists/{artist_id}/enforcement-actions"]
        distinguishing_aspect: "A bloodborne-pathogen training record filed between the officer's read and the write advances Artist.version, so the enforcement create carrying the pre-training version is rejected with ERR_STALE_ARTIST_VERSION (412) and the artist stays ACTIVE."
        test_recipe:
