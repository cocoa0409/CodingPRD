  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: order_accept_then_cancel_conserves_buying_power
        grounds:
          - state_machines.Order.DRAFT_to_ACCEPTED
          - state_machines.Order.ACCEPTED_to_CANCELLED
          - calculations.buying_power
        distinguishing_aspect: "Conserved quantity = Account.buying_power_cents: accept reserves notional (buying_power 1000000 -> 400000), cancel releases it (back to 1000000); accept paired with its compensating cancel leaves buying_power_cents unchanged at 1000000."
        test_recipe:
          setup:
            - "Account active, CASH, cash 1000000, buying_power 1000000."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_user_id: "h_a", legal_name: "A Holder", tax_id: "111-11-1111", date_of_birth: "1980-01-01", w9_certified: true, liquid_net_worth_cents: 30000000, annual_income_cents: 30000000, investment_experience: "GOOD", cash_balance_cents: 1000000 }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { acct_a: $.data.id }
            - call: "POST /accounts/${acct_a}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /orders"
              payload: { account_id: "${acct_a}", symbol: "ACME", instrument_type: "EQUITY", side: "BUY", order_type: "LIMIT", quantity: 6, limit_price_cents: 100000, trade_date: "2026-06-01" }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/accept"
              payload: {}
              as: AccountHolder
              as_user_id: "h_a"
          trigger:
            - call: "POST /orders/${ord}/cancel"
              payload: {}
              as: AccountHolder
              as_user_id: "h_a"
          assert:
            - "Order.${ord}.status == CANCELLED"
            - "Account.${acct_a}.buying_power_cents == 1000000"

      - name: acat_in_then_out_conserves_cash_balance
        grounds:
          - state_machines.AcatTransfer.VALIDATED_to_SETTLED
          - entities.Account.fields.cash_balance_cents
          - calculations.buying_power
        distinguishing_aspect: "Conserved quantity = Account.cash_balance_cents (a different conserved quantity than buying_power): a settled IN of 500000 then a settled OUT of 500000 leaves cash_balance_cents unchanged at its starting 0."
        test_recipe:
          setup:
            - "Account active, CASH, cash 0; a settled IN transfer of 500000 (cash now 500000)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_user_id: "h_a", legal_name: "A Holder", tax_id: "111-11-1111", date_of_birth: "1980-01-01", w9_certified: true, liquid_net_worth_cents: 30000000, annual_income_cents: 30000000, investment_experience: "GOOD" }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { acct_a: $.data.id }
            - call: "POST /accounts/${acct_a}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /acat-transfers"
              payload: { account_id: "${acct_a}", direction: "IN", counterparty_dtc: "0226", transfer_value_cents: 500000 }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { tin: $.data.id }
            - call: "POST /acat-transfers/${tin}/validate"
              payload: {}
              as: Custodian
              as_user_id: "cust_1"
            - call: "POST /acat-transfers/${tin}/settle"
              payload: {}
              as: Custodian
              as_user_id: "cust_1"
            - call: "POST /acat-transfers"
              payload: { account_id: "${acct_a}", direction: "OUT", counterparty_dtc: "0226", transfer_value_cents: 500000 }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { tout: $.data.id }
            - call: "POST /acat-transfers/${tout}/validate"
              payload: {}
              as: Custodian
              as_user_id: "cust_1"
          trigger:
            - call: "POST /acat-transfers/${tout}/settle"
              payload: {}
              as: Custodian
              as_user_id: "cust_1"
          assert:
            - "AcatTransfer.${tout}.status == SETTLED"
            - "Account.${acct_a}.cash_balance_cents == 0"
            - "Account.${acct_a}.buying_power_cents == 0"
