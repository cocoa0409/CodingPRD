          Fractional-cent tie-break inside a formula rather than an aggregate comparison: the monthly
          incentive lands on exactly 2171252.50 and the annual tier-2 slice on exactly 856878.75, so
          round_half_up must yield 2171253 and 856879; banker's rounding yields 2171252 and 856878
          and truncation yields 2171252 and 856878.
        test_recipe:
          setup:
            - "One ManagementAgreement ACTIVE with base_fee_pct 0.0325, incentive_fee_pct 0.10, incentive_tier2_pct 0.15, incentive_tier2_threshold_cents 5000000 and owner_priority_cents 12000000."
            - "APPROVED FY2026 OperatingBudget."
