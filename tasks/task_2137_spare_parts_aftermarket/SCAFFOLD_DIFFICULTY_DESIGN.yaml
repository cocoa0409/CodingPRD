  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: ltb_campaign_reject_revise_resubmit_cycle
        grounds:
          - state_machines.LastTimeBuyCampaign.SUBMITTED_to_REJECTED
          - state_machines.LastTimeBuyCampaign.REJECTED_to_DRAFT
          - state_machines.LastTimeBuyCampaign.DRAFT_to_SUBMITTED
          - entities.LastTimeBuyCampaign.fields.revision_index
        distinguishing_aspect: |
          Non-linearity on LastTimeBuyCampaign is a CYCLE: DRAFT -> SUBMITTED -> REJECTED ->
          DRAFT -> SUBMITTED, with revision_index advancing to 1 and proposed_qty recomputed
          from 37 to 26 when coverage_years drops from 5 to 3 on the revise hop.
        test_recipe:
          setup:
            - "part CYC-1 in PHASE_OUT with zero stock (on_hand_units 0, in_transit_units 0)"
            - "one ACTIVE installed unit and an ACTIVE applicability row with qty_per_unit 50, giving a CURRENT 12-month INSTALLED_BASE_RATE forecast of 10 units"
            - "a DRAFT LastTimeBuyCampaign created with method DEMAND_DECAY and coverage_years 5, so proposed_qty == 37"
          setup_api_calls:
            - call: "POST /aftermarket/dealers"
              payload: { dealer_code: "D-CYC", tier: "SILVER", region: "APAC", credit_limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
