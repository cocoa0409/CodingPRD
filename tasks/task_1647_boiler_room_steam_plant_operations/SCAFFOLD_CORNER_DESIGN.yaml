scaffold_corner_design:
  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_plant_with_all_required_fields_returns_201
        claim_type: creation
        grounds: [entities.Plant, "endpoints[POST /plants]"]
        distinguishing_aspect: "POST with name/state_code/header_pressure_psi returns 201 with all defaults applied."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /plants"
              payload: { name: "Corner Plant", state_code: "CA", header_pressure_psi: 120 }
              as: PlantManager
              captures: { p: $.data.id, posture: $.data.posture, fuel_inv: $.data.fuel_inventory_gal }
          assert:
            - "Response status 201"
            - "Plant.posture == 'NORMAL' (default applied)"
            - "Plant.fuel_inventory_gal == 0"
            - "Plant.total_fuel_received_gal == 0 AND total_fuel_consumed_gal == 0"
            - "Plant.lead_boiler_id is null"

      - name: create_plant_missing_required_field_returns_400
        claim_type: required_fields
        grounds: [entities.Plant.fields.state_code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required state_code → ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /plants"
              payload: { name: "Bad Plant", header_pressure_psi: 120 }
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_INVALID_REQUEST'"
            - "HTTP status == 400"

      - name: plant_state_code_invalid_enum_returns_400
        claim_type: type_constraints
        grounds: [entities.Plant.fields.state_code]
        distinguishing_aspect: "state_code outside {MA, NY, CA, TX} → ERR_INVALID_REQUEST."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /plants"
              payload: { name: "Bad State", state_code: "ZZ", header_pressure_psi: 120 }
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_INVALID_REQUEST'"

      - name: get_nonexistent_plant_returns_404
        claim_type: not_found
        grounds: ["endpoints[GET /plants/{plantId}]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with random UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "GET /plants/00000000-0000-0000-0000-000000000000"
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_NOT_FOUND'"
            - "HTTP status == 404"

      - name: list_boilers_pagination_defaults
        claim_type: listing
        grounds: ["endpoints[GET /plants/{plantId}/boilers]", response_envelope.pagination_defaults]
        distinguishing_aspect: "List endpoint with no pagination params applies default limit=10, offset=0."
        test_recipe:
          setup:
            - "Plant P with 3 boilers"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "Pag Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_pag: $.data.id }
            - call: "POST /plants/${p_pag}/boilers"
              payload: { tag: "B-1", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
            - call: "POST /plants/${p_pag}/boilers"
              payload: { tag: "B-2", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
            - call: "POST /plants/${p_pag}/boilers"
              payload: { tag: "B-3", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
          trigger:
            - call: "GET /plants/${p_pag}/boilers"
              as: PlantManager
              captures: { data: $.data }
          assert:
            - "Response contains meta + response_type='array' + data (list)"
            - "List length == 3"
            - "Pagination envelope fields limit/offset/total_count/has_more present"

      - name: boiler_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Boiler.fields.ops_status, entities.Boiler.fields.cert_status]
        distinguishing_aspect: "Client-provided ops_status='ONLINE' in POST /boilers is ignored; initial STANDBY retained."
        test_recipe:
          setup:
            - "Plant P"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "SysFld Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_sf: $.data.id }
          trigger:
            - call: "POST /plants/${p_sf}/boilers"
              payload: { tag: "B-SF", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_sf: $.data.id, ops: $.data.ops_status, cert: $.data.cert_status, water: $.data.water_status }
          assert:
            - "Boiler.ops_status == 'STANDBY' (system-set initial, regardless of any client hint)"
            - "Boiler.cert_status == 'VALID'"
            - "Boiler.water_status == 'IN_SPEC'"
            - "Boiler.version == 1"

      - name: boiler_duplicate_tag_within_plant_returns_409
        claim_type: type_constraints
        grounds: [entities.Boiler.fields.tag, "errors[ERR_DUPLICATE_TAG]"]
        distinguishing_aspect: "Second POST /boilers with same tag within same plant → ERR_DUPLICATE_TAG (409)."
        test_recipe:
          setup:
            - "Plant P with existing Boiler tagged 'B-DUP'"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "Dup Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_dup: $.data.id }
            - call: "POST /plants/${p_dup}/boilers"
              payload: { tag: "B-DUP", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
          trigger:
            - call: "POST /plants/${p_dup}/boilers"
              payload: { tag: "B-DUP", rated_capacity_lb_hr: 40000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_DUPLICATE_TAG'"
            - "HTTP status == 409"

      - name: boiler_log_entry_common_fields_false_immutable
        claim_type: immutability
        grounds: [entities.BoilerLogEntry]
        distinguishing_aspect: "BoilerLogEntry has common_fields: false; carries only id and created_at — no updated_at, no version."
        test_recipe:
          setup:
            - "Plant P, Boiler B, Operator O"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "Imm Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_imm: $.data.id }
            - call: "POST /plants/${p_imm}/boilers"
              payload: { tag: "B-IMM", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_imm: $.data.id }
            - call: "POST /plants/${p_imm}/operators"
              payload: { full_name: "Op Imm", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_imm: $.data.id }
          trigger:
            - call: "POST /plants/${p_imm}/boilers/${b_imm}/log-entries"
              payload: { recorded_by_operator_id: "${op_imm}", recorded_at: "2026-08-05T10:00:00Z", header_pressure_reading_psi: 150, steam_generated_lb: 1000, fuel_burned_gal: 8, feedwater_intake_gal: 130, blowdown_gal: 10 }
              as: Operator
              as_user_id: "${op_imm}"
              captures: { le_imm: $.data.id }
          assert:
            - "Response data has 'id' and 'created_at'"
            - "Response data does NOT have 'updated_at'"
            - "Response data does NOT have 'version'"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: boiler_warm_from_online_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Boiler.transitions.ONLINE]
        distinguishing_aspect: "Attempting POST /warm on an ONLINE boiler (not a listed from-state for warm) → ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Boiler B ONLINE"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "IT Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_it: $.data.id }
            - call: "POST /plants/${p_it}/boilers"
              payload: { tag: "B-IT", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_it: $.data.id }
            - call: "POST /plants/${p_it}/operators"
              payload: { full_name: "Op IT", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_it: $.data.id }
            - call: "POST /plants/${p_it}/boilers/${b_it}/chemistry-logs"
              payload: { recorded_by_operator_id: "${op_it}", recorded_at: "2026-08-05T08:00:00Z", conductivity_boiler_umho: 5000, conductivity_feedwater_umho: 1000, sulfite_residual_ppm: 30, phosphate_residual_ppm: 40 }
              as: Operator
              as_user_id: "${op_it}"
            - call: "POST /plants/${p_it}/boilers/${b_it}/warm"
              as: Operator
              as_user_id: "${op_it}"
            - call: "POST /plants/${p_it}/boilers/${b_it}/bring-online"
              as: Operator
              as_user_id: "${op_it}"
          trigger:
            - call: "POST /plants/${p_it}/boilers/${b_it}/warm"
              as: Operator
              as_user_id: "${op_it}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_INVALID_STATE'"
            - "Boiler.ops_status remains 'ONLINE'"

      - name: incident_terminal_state_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Incident]
        distinguishing_aspect: "From CLOSED, no further transitions are possible (attempted acknowledge → ERR_INVALID_STATE)."
        test_recipe:
          setup:
            - "Plant P, LOW severity Incident raised and closed directly from OPEN"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "Term Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_term: $.data.id }
            - call: "POST /plants/${p_term}/operators"
              payload: { full_name: "Op Term", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_term: $.data.id }
            - call: "POST /plants/${p_term}/incidents"
              payload: { raised_by_operator_id: "${op_term}", severity: "LOW", kind: "OTHER", raised_at: "2026-08-05T10:00:00Z" }
              as: Operator
              as_user_id: "${op_term}"
              captures: { inc_term: $.data.id }
            - call: "POST /plants/${p_term}/incidents/${inc_term}/close"
              payload: { resolution_notes: "trivial" }
              as: PlantManager
          trigger:
            - call: "POST /plants/${p_term}/incidents/${inc_term}/acknowledge"
              as: Operator
              as_user_id: "${op_term}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_INVALID_STATE'"
            - "Incident remains 'CLOSED'"

      - name: log_entry_double_verify_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.BoilerLogEntry.DRAFT_to_VERIFIED]
        distinguishing_aspect: "Verifying an already-VERIFIED entry → ERR_INVALID_STATE (second transition attempt rejected)."
        test_recipe:
          setup:
            - "Plant P, Boiler B, two operators; one entry verified"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "DV Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_dv: $.data.id }
            - call: "POST /plants/${p_dv}/boilers"
              payload: { tag: "B-DV", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_dv: $.data.id }
            - call: "POST /plants/${p_dv}/operators"
              payload: { full_name: "Op DV A", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_dva: $.data.id }
            - call: "POST /plants/${p_dv}/operators"
              payload: { full_name: "Op DV B", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_dvb: $.data.id }
            - call: "POST /plants/${p_dv}/fuel-deliveries"
              payload: { delivered_at: "2026-08-01T08:00:00Z", quantity_gal: 1000, supplier: "Acme" }
              as: PlantManager
            - call: "POST /plants/${p_dv}/boilers/${b_dv}/log-entries"
              payload: { recorded_by_operator_id: "${op_dva}", recorded_at: "2026-08-05T10:00:00Z", header_pressure_reading_psi: 150, steam_generated_lb: 1000, fuel_burned_gal: 8, feedwater_intake_gal: 130, blowdown_gal: 10 }
              as: Operator
              as_user_id: "${op_dva}"
              captures: { le_dv: $.data.id }
            - call: "GET /plants/${p_dv}/boilers/${b_dv}"
              as: PlantManager
              captures: { b_dv_v: $.data.version }
            - call: "POST /plants/${p_dv}/boilers/${b_dv}/log-entries/${le_dv}/verify"
              payload: { expected_boiler_version: "${b_dv_v}" }
              as: Operator
              as_user_id: "${op_dvb}"
          trigger:
            - call: "GET /plants/${p_dv}/boilers/${b_dv}"
              as: PlantManager
              captures: { b_dv_v2: $.data.version }
            - call: "POST /plants/${p_dv}/boilers/${b_dv}/log-entries/${le_dv}/verify"
              payload: { expected_boiler_version: "${b_dv_v2}" }
              as: Operator
              as_user_id: "${op_dvb}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_INVALID_STATE'"
            - "Log entry status remains 'VERIFIED' (not re-applied)"

      - name: operator_initial_state_is_active
        claim_type: initial_state
        grounds: [state_machines.Operator]
        distinguishing_aspect: "Newly created Operator has license_status == 'ACTIVE' (initial state)."
        test_recipe:
          setup:
            - "Plant P"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "Init Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_ini: $.data.id }
          trigger:
            - call: "POST /plants/${p_ini}/operators"
              payload: { full_name: "Op Ini", license_class: "CLASS_2", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_ini: $.data.id, lst: $.data.license_status }
          assert:
            - "Operator.license_status == 'ACTIVE'"

      - name: sod_verification_same_operator_rejected
        claim_type: precondition_enforcement
        grounds: ["validations[priority=10]", "errors[ERR_SOD_VERIFICATION]"]
        distinguishing_aspect: "Verifier equal to recorder → ERR_SOD_VERIFICATION."
        test_recipe:
          setup:
            - "Plant P, Boiler B, Operator O recorded a DRAFT log entry"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "SoD Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_sod: $.data.id }
            - call: "POST /plants/${p_sod}/boilers"
              payload: { tag: "B-SOD", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_sod: $.data.id }
            - call: "POST /plants/${p_sod}/operators"
              payload: { full_name: "Op SoD", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_sod: $.data.id }
            - call: "POST /plants/${p_sod}/boilers/${b_sod}/log-entries"
              payload: { recorded_by_operator_id: "${op_sod}", recorded_at: "2026-08-05T10:00:00Z", header_pressure_reading_psi: 150, steam_generated_lb: 1000, fuel_burned_gal: 8, feedwater_intake_gal: 130, blowdown_gal: 10 }
              as: Operator
              as_user_id: "${op_sod}"
              captures: { le_sod: $.data.id }
          trigger:
            - call: "GET /plants/${p_sod}/boilers/${b_sod}"
              as: PlantManager
              captures: { b_sod_v: $.data.version }
            - call: "POST /plants/${p_sod}/boilers/${b_sod}/log-entries/${le_sod}/verify"
              payload: { expected_boiler_version: "${b_sod_v}" }
              as: Operator
              as_user_id: "${op_sod}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_SOD_VERIFICATION'"

  # =========================================================================
  # Section: calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: combustion_efficiency_correct_result
        claim_type: correct_result
        grounds: [calculations.combustion_efficiency]
        distinguishing_aspect: "Known inputs produce expected efficiency_pct per input-output formula."
        test_recipe:
          setup:
            - "Plant P (TX), Boiler B, two operators, fuel delivered"
            - "Log: steam=10000 lb, fuel=80 gal, feedwater=1300, blowdown=100"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "Calc Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_cal: $.data.id }
            - call: "POST /plants/${p_cal}/boilers"
              payload: { tag: "B-CAL", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_cal: $.data.id }
            - call: "POST /plants/${p_cal}/operators"
              payload: { full_name: "Op CA", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_ca1: $.data.id }
            - call: "POST /plants/${p_cal}/operators"
              payload: { full_name: "Op CB", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_cb1: $.data.id }
            - call: "POST /plants/${p_cal}/fuel-deliveries"
              payload: { delivered_at: "2026-08-01T08:00:00Z", quantity_gal: 500, supplier: "A" }
              as: PlantManager
            - call: "POST /plants/${p_cal}/boilers/${b_cal}/log-entries"
              payload: { recorded_by_operator_id: "${op_ca1}", recorded_at: "2026-08-05T10:00:00Z", header_pressure_reading_psi: 150, steam_generated_lb: 10000, fuel_burned_gal: 80, feedwater_intake_gal: 1300, blowdown_gal: 100 }
              as: Operator
              as_user_id: "${op_ca1}"
              captures: { le_cal: $.data.id }
            - call: "GET /plants/${p_cal}/boilers/${b_cal}"
              as: PlantManager
              captures: { b_cal_v: $.data.version }
          trigger:
            - call: "POST /plants/${p_cal}/boilers/${b_cal}/log-entries/${le_cal}/verify"
              payload: { expected_boiler_version: "${b_cal_v}" }
              as: Operator
              as_user_id: "${op_cb1}"
            - call: "GET /plants/${p_cal}/boilers/${b_cal}"
              as: PlantManager
              captures: { eff: $.data.efficiency_pct }
          assert:
            # (10000 * (1190-180)) / (80*140000) * 100 = 10100000 / 11200000 * 100 = 90.178571... → 90.18
            - "Boiler.${b_cal}.efficiency_pct == 90.18"

      - name: combustion_efficiency_excludes_draft_entries
        claim_type: input_set_filtering
        grounds: [calculations.combustion_efficiency]
        distinguishing_aspect: "DRAFT (unverified) entries do NOT contribute to efficiency_pct or totals."
        test_recipe:
          setup:
            - "Plant P (TX), Boiler B, one DRAFT log entry (not yet verified)"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "Filt Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_filt: $.data.id }
            - call: "POST /plants/${p_filt}/boilers"
              payload: { tag: "B-FILT", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_filt: $.data.id }
            - call: "POST /plants/${p_filt}/operators"
              payload: { full_name: "Op Filt", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_filt: $.data.id }
            - call: "POST /plants/${p_filt}/boilers/${b_filt}/log-entries"
              payload: { recorded_by_operator_id: "${op_filt}", recorded_at: "2026-08-05T10:00:00Z", header_pressure_reading_psi: 150, steam_generated_lb: 10000, fuel_burned_gal: 80, feedwater_intake_gal: 1300, blowdown_gal: 100 }
              as: Operator
              as_user_id: "${op_filt}"
          trigger:
            - call: "GET /plants/${p_filt}/boilers/${b_filt}"
              as: PlantManager
              captures: { eff: $.data.efficiency_pct, st: $.data.total_steam_lb, fb: $.data.total_fuel_burned_gal }
            - call: "GET /plants/${p_filt}"
              as: PlantManager
              captures: { fc: $.data.total_fuel_consumed_gal }
          assert:
            - "Boiler.total_steam_lb == 0 (DRAFT not applied)"
            - "Boiler.total_fuel_burned_gal == 0"
            - "Plant.total_fuel_consumed_gal == 0"
            - "Boiler.efficiency_pct is null (no VERIFIED entries yet)"

      - name: certificate_expiry_boundary_at_exactly_now_is_valid
        claim_type: correct_result
        grounds: [calculations.certificate_expiry_check]
        distinguishing_aspect: "certificate_expires_on == plant_clock_now exactly → cert_status remains VALID (strict less-than for LAPSED)."
        test_recipe:
          setup:
            - "Plant P, Boiler B, PASSED inspection with certificate_expires_on == current clock"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /plants"
              payload: { name: "Eq Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_eq: $.data.id }
            - call: "POST /plants/${p_eq}/boilers"
              payload: { tag: "B-EQ", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_eq: $.data.id }
            - call: "POST /plants/${p_eq}/boilers/${b_eq}/inspections"
              payload: { inspection_kind: "ANNUAL_EXTERNAL", scheduled_on: "2026-08-01T08:00:00Z", inspector_name: "I", inspector_license_no: "L" }
              as: Inspector
              captures: { insp_eq: $.data.id, insp_eq_v: $.data.version }
            - call: "POST /plants/${p_eq}/boilers/${b_eq}/inspections/${insp_eq}/record-outcome"
              payload: { outcome: "PASSED", certificate_number: "C-EQ", certificate_expires_on: "2026-08-01T00:00:00Z", expected_inspection_version: "${insp_eq_v}" }
              as: Inspector
          trigger:
            - call: "POST /plants/${p_eq}/run-ops"
              as: PlantManager
            - call: "GET /plants/${p_eq}/boilers/${b_eq}"
              as: PlantManager
              captures: { cert: $.data.cert_status }
          assert:
            # Boundary: certificate_expires_on == now → NOT LAPSED (strict less-than); falls into EXPIRING window
            - "Boiler.${b_eq}.cert_status == 'EXPIRING'"

      - name: fuel_inventory_underflow_blocks_verify
        claim_type: correct_result
        grounds: [calculations.fuel_inventory_balance, "errors[ERR_FUEL_INVENTORY_UNDERFLOW]"]
        distinguishing_aspect: "fuel_inventory_gal >= 0 invariant enforced at verify time."
        excluded_because:
          difficulty_instance: fuel_inventory_zero_boundary
          rationale: "Covered by §1.8 boundary_precision_check instance."

  # =========================================================================
  # Section: validations
  # =========================================================================
  - section: validations
    instances:
      - name: missing_x_user_role_header_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Request without X-User-Role header → 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "GET /plants/00000000-0000-0000-0000-000000000000"
              as: Anonymous  # negative-test: no role header
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 401"
            - "error_id == 'ERR_UNAUTHENTICATED'"

      - name: operator_cannot_create_plant_returns_403
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_UNAUTHORIZED]", "roles[0].exclusive_operations"]
        distinguishing_aspect: "Operator role invoking POST /plants (PlantManager-exclusive) → 403."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /plants"
              payload: { name: "Forbidden", state_code: "TX", header_pressure_psi: 150 }
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403"
            - "error_id == 'ERR_UNAUTHORIZED'"

      - name: dispatch_window_end_not_after_start_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "window_end_at <= window_start_at → ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Plant P, Boiler B"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "Wnd Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_wnd: $.data.id }
            - call: "POST /plants/${p_wnd}/boilers"
              payload: { tag: "B-WND", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_wnd: $.data.id }
          trigger:
            - call: "POST /plants/${p_wnd}/load-dispatches"
              payload: { window_start_at: "2026-08-10T08:00:00Z", window_end_at: "2026-08-10T08:00:00Z", target_steam_lb_hr: 20000, assigned_boiler_ids: ["${b_wnd}"] }
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_INVALID_REQUEST'"
            - "HTTP 400"

      - name: relief_setpoint_exceeded_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_RELIEF_SETPOINT_EXCEEDED]"]
        distinguishing_aspect: "RELIEF_VALVE_POP with lift_pressure > setpoint*(1+tol) returns ERR_RELIEF_SETPOINT_EXCEEDED."
        excluded_because:
          difficulty_instance: boiler_parallel_dimensions_cert_vs_ops
          rationale: "Covered as the failure-path trigger in §1.8 non_linear_state_machine instance."

      - name: lead_cannot_bank_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_LEAD_CANNOT_BANK]"]
        distinguishing_aspect: "Lead boiler with another ONLINE boiler cannot bank."
        test_recipe:
          setup:
            - "Plant P, Boilers B1 (lead) and B2 both ONLINE"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "Lead Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_lead: $.data.id }
            - call: "POST /plants/${p_lead}/boilers"
              payload: { tag: "B-L1", rated_capacity_lb_hr: 60000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_l1: $.data.id }
            - call: "POST /plants/${p_lead}/boilers"
              payload: { tag: "B-L2", rated_capacity_lb_hr: 50000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_l2: $.data.id }
            - call: "POST /plants/${p_lead}/operators"
              payload: { full_name: "Op Lead", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_lead: $.data.id }
            - call: "POST /plants/${p_lead}/boilers/${b_l1}/chemistry-logs"
              payload: { recorded_by_operator_id: "${op_lead}", recorded_at: "2026-08-05T08:00:00Z", conductivity_boiler_umho: 5000, conductivity_feedwater_umho: 1000, sulfite_residual_ppm: 30, phosphate_residual_ppm: 40 }
              as: Operator
              as_user_id: "${op_lead}"
            - call: "POST /plants/${p_lead}/boilers/${b_l2}/chemistry-logs"
              payload: { recorded_by_operator_id: "${op_lead}", recorded_at: "2026-08-05T08:00:00Z", conductivity_boiler_umho: 5000, conductivity_feedwater_umho: 1000, sulfite_residual_ppm: 30, phosphate_residual_ppm: 40 }
              as: Operator
              as_user_id: "${op_lead}"
            - call: "POST /plants/${p_lead}/boilers/${b_l1}/warm"
              as: Operator
              as_user_id: "${op_lead}"
            - call: "POST /plants/${p_lead}/boilers/${b_l1}/bring-online"
              as: Operator
              as_user_id: "${op_lead}"
            - call: "POST /plants/${p_lead}/boilers/${b_l2}/warm"
              as: Operator
              as_user_id: "${op_lead}"
            - call: "POST /plants/${p_lead}/boilers/${b_l2}/bring-online"
              as: Operator
              as_user_id: "${op_lead}"
          trigger:
            - call: "POST /plants/${p_lead}/boilers/${b_l1}/bank"
              as: Operator
              as_user_id: "${op_lead}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_LEAD_CANNOT_BANK'"
            - "Boiler.${b_l1}.ops_status remains 'ONLINE'"

  # =========================================================================
  # Section: endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: run_ops_increments_ops_run_index
        claim_type: action_endpoint
        grounds: ["endpoints[POST /plants/{plantId}/run-ops]", entities.Plant.fields.ops_run_index]
        distinguishing_aspect: "Each POST /run-ops increments Plant.ops_run_index by exactly 1."
        test_recipe:
          setup:
            - "Plant P"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "Ops Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_ops: $.data.id }
          trigger:
            - call: "POST /plants/${p_ops}/run-ops"
              as: PlantManager
            - call: "POST /plants/${p_ops}/run-ops"
              as: PlantManager
            - call: "GET /plants/${p_ops}"
              as: PlantManager
              captures: { idx: $.data.ops_run_index }
          assert:
            - "Plant.ops_run_index == 2 (started at 0, incremented twice)"

      - name: get_loss_projection_computed_read
        claim_type: computed_read
        grounds: ["endpoints[GET /plants/{plantId}/steam-traps/{trapId}/loss-projection]"]
        distinguishing_aspect: "Loss-projection endpoint returns derived leak_rate_lb_hr, annual_steam_loss_lb, annual_cost_usd, and method name."
        test_recipe:
          setup:
            - "Plant P (TX), SteamTrap ST (LEAKING via survey)"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "CR Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_cr: $.data.id }
            - call: "POST /plants/${p_cr}/steam-traps"
              payload: { tag: "ST-CR", location: "HDR", orifice_diameter_in: 0.25, design_pressure_psi: 144 }
              as: PlantManager
              captures: { st_cr: $.data.id }
            - call: "POST /plants/${p_cr}/operators"
              payload: { full_name: "Op CR", license_class: "CLASS_2", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_cr: $.data.id }
            - call: "POST /plants/${p_cr}/steam-traps/${st_cr}/survey"
              payload: { condition: "LEAKING" }
              as: Operator
              as_user_id: "${op_cr}"
          trigger:
            - call: "GET /plants/${p_cr}/steam-traps/${st_cr}/loss-projection"
              as: PlantManager
              captures: { leak: $.data.leak_rate_lb_hr, cost: $.data.annual_cost_usd, m: $.data.method }
          assert:
            # Napier: 51.45 * 0.0625 * 144 = 463.05; annual = 463.05 * 8760 = 4,056,318 lb
            # cost = 4,056,318 * (3.50 / 140000) * 1010 = 4,056,318 * 0.000025 * 1010 ≈ 102,422.03 (rounded)
            - "loss-projection.leak_rate_lb_hr == 463.05"
            - "loss-projection.method == 'napier_theoretical'"
            - "loss-projection.annual_steam_loss_lb == 4056318.0"
            - "loss-projection.annual_cost_usd is a number with 2 decimals"

      - name: post_certificate_action
        claim_type: action_endpoint
        grounds: ["endpoints[POST /plants/{plantId}/boilers/{boilerId}/inspections/{inspectionId}/post]"]
        distinguishing_aspect: "Posting a PASSED inspection sets posted_at to current plant clock."
        test_recipe:
          setup:
            - "Plant P, Boiler B, PASSED inspection"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T12:00:00Z" }
              as: PlantManager
            - call: "POST /plants"
              payload: { name: "Post Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_post: $.data.id }
            - call: "POST /plants/${p_post}/boilers"
              payload: { tag: "B-POST", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_post: $.data.id }
            - call: "POST /plants/${p_post}/boilers/${b_post}/inspections"
              payload: { inspection_kind: "ANNUAL_EXTERNAL", scheduled_on: "2026-08-05T08:00:00Z", inspector_name: "I", inspector_license_no: "L" }
              as: Inspector
              captures: { insp_post: $.data.id, insp_post_v: $.data.version }
            - call: "POST /plants/${p_post}/boilers/${b_post}/inspections/${insp_post}/record-outcome"
              payload: { outcome: "PASSED", certificate_number: "C-P", certificate_expires_on: "2027-08-05T00:00:00Z", expected_inspection_version: "${insp_post_v}" }
              as: Inspector
          trigger:
            - call: "POST /plants/${p_post}/boilers/${b_post}/inspections/${insp_post}/post"
              as: PlantManager
              captures: { pa: $.data.posted_at }
          assert:
            - "Inspection.posted_at == '2026-08-05T12:00:00Z'"

  # =========================================================================
  # Section: errors
  # =========================================================================
  - section: errors
    instances:
      - name: err_plant_emergency_blocks_warm
        claim_type: violation_to_error
        grounds: ["errors[ERR_PLANT_EMERGENCY]"]
        distinguishing_aspect: "When Plant.posture == EMERGENCY, warm returns ERR_PLANT_EMERGENCY."
        test_recipe:
          setup:
            - "Plant P with single Boiler B1 TRIPPED (posture becomes EMERGENCY because no ONLINE boiler remains)"
            - "Boiler B2 exists in STANDBY (would-be warm target)"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "Em Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_em: $.data.id }
            - call: "POST /plants/${p_em}/boilers"
              payload: { tag: "B-E1", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_e1: $.data.id }
            - call: "POST /plants/${p_em}/boilers"
              payload: { tag: "B-E2", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_e2: $.data.id }
            - call: "POST /plants/${p_em}/operators"
              payload: { full_name: "Op Em", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_em: $.data.id }
            # Drive plant to EMERGENCY by tripping B1 (the only ONLINE-able one initially)
            - call: "POST /plants/${p_em}/boilers/${b_e1}/chemistry-logs"
              payload: { recorded_by_operator_id: "${op_em}", recorded_at: "2026-08-05T08:00:00Z", conductivity_boiler_umho: 5000, conductivity_feedwater_umho: 1000, sulfite_residual_ppm: 30, phosphate_residual_ppm: 40 }
              as: Operator
              as_user_id: "${op_em}"
            - call: "POST /plants/${p_em}/boilers/${b_e1}/warm"
              as: Operator
              as_user_id: "${op_em}"
            - call: "POST /plants/${p_em}/boilers/${b_e1}/bring-online"
              as: Operator
              as_user_id: "${op_em}"
            - call: "POST /plants/${p_em}/incidents"
              payload: { raised_by_operator_id: "${op_em}", severity: "HIGH", kind: "FLAME_FAILURE", triggered_boiler_id: "${b_e1}", raised_at: "2026-08-05T12:00:00Z" }
              as: Operator
              as_user_id: "${op_em}"
          trigger:
            # Plant should now be in EMERGENCY (B1 TRIPPED, no ONLINE remains)
            # B2 needs chemistry — but warm should fail before chemistry check anyway due to EMERGENCY
            - call: "POST /plants/${p_em}/boilers/${b_e2}/warm"
              as: Operator
              as_user_id: "${op_em}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_PLANT_EMERGENCY'"

      - name: err_relief_no_lift_when_pressure_below_setpoint
        claim_type: violation_to_error
        grounds: ["errors[ERR_RELIEF_NO_LIFT]"]
        distinguishing_aspect: "RELIEF_VALVE_POP outcome=PASSED with lift_pressure < setpoint → forced FAILED via ERR_RELIEF_NO_LIFT validation; outcome auto-flipped to FAILED."
        excluded_because:
          difficulty_instance: relief_failure_cert_suspension_depth2
          rationale: "Covered as the failure trigger of §1.8 transitive_cascade instance."

      - name: err_referenced_not_found_on_bad_operator_id
        claim_type: violation_to_error
        grounds: ["errors[ERR_REFERENCED_NOT_FOUND]"]
        distinguishing_aspect: "POST log-entries with recorded_by_operator_id pointing to non-existent UUID → ERR_REFERENCED_NOT_FOUND."
        test_recipe:
          setup:
            - "Plant P, Boiler B, Operator O (valid, used as the CALLING operator)"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "Ref Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_ref: $.data.id }
            - call: "POST /plants/${p_ref}/boilers"
              payload: { tag: "B-REF", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_ref: $.data.id }
            - call: "POST /plants/${p_ref}/operators"
              payload: { full_name: "Op Ref", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_ref: $.data.id }
          trigger:
            - call: "POST /plants/${p_ref}/boilers/${b_ref}/log-entries"
              payload: { recorded_by_operator_id: "11111111-1111-1111-1111-111111111111", recorded_at: "2026-08-05T10:00:00Z", header_pressure_reading_psi: 150, steam_generated_lb: 1000, fuel_burned_gal: 8, feedwater_intake_gal: 130, blowdown_gal: 10 }
              as: Operator
              as_user_id: "${op_ref}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_REFERENCED_NOT_FOUND'"
            - "HTTP 422"

      - name: err_resolution_notes_required_on_close
        claim_type: violation_to_error
        grounds: ["errors[ERR_RESOLUTION_NOTES_REQUIRED]"]
        distinguishing_aspect: "Closing an Incident without resolution_notes → ERR_RESOLUTION_NOTES_REQUIRED."
        test_recipe:
          setup:
            - "Plant P, LOW severity Incident in OPEN"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "RN Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_rn: $.data.id }
            - call: "POST /plants/${p_rn}/operators"
              payload: { full_name: "Op RN", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_rn: $.data.id }
            - call: "POST /plants/${p_rn}/incidents"
              payload: { raised_by_operator_id: "${op_rn}", severity: "LOW", kind: "OTHER", raised_at: "2026-08-05T10:00:00Z" }
              as: Operator
              as_user_id: "${op_rn}"
              captures: { inc_rn: $.data.id }
          trigger:
            - call: "POST /plants/${p_rn}/incidents/${inc_rn}/close"
              payload: { resolution_notes: "" }
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_RESOLUTION_NOTES_REQUIRED'"

      - name: err_incident_not_closable_high_severity_direct_close
        claim_type: violation_to_error
        grounds: ["errors[ERR_INCIDENT_NOT_CLOSABLE]"]
        distinguishing_aspect: "HIGH-severity Incident cannot CLOSE directly from OPEN."
        test_recipe:
          setup:
            - "Plant P, HIGH-severity Incident in OPEN"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "NC Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_nc: $.data.id }
            - call: "POST /plants/${p_nc}/boilers"
              payload: { tag: "B-NC", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_nc: $.data.id }
            - call: "POST /plants/${p_nc}/operators"
              payload: { full_name: "Op NC", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_nc: $.data.id }
            - call: "POST /plants/${p_nc}/incidents"
              payload: { raised_by_operator_id: "${op_nc}", severity: "HIGH", kind: "FLAME_FAILURE", triggered_boiler_id: "${b_nc}", raised_at: "2026-08-05T10:00:00Z" }
              as: Operator
              as_user_id: "${op_nc}"
              captures: { inc_nc: $.data.id }
          trigger:
            - call: "POST /plants/${p_nc}/incidents/${inc_nc}/close"
              payload: { resolution_notes: "skip" }
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_INCIDENT_NOT_CLOSABLE'"

      - name: err_boiler_in_dispatch_blocks_decommission
        claim_type: violation_to_error
        grounds: ["errors[ERR_BOILER_IN_DISPATCH]"]
        distinguishing_aspect: "Cannot decommission a boiler referenced by a SCHEDULED LoadDispatch."
        test_recipe:
          setup:
            - "Plant P, Boiler B, LoadDispatch SCHEDULED with assigned_boiler_ids=[B]"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "Dec Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_dec: $.data.id }
            - call: "POST /plants/${p_dec}/boilers"
              payload: { tag: "B-DEC", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_dec: $.data.id }
            - call: "POST /plants/${p_dec}/load-dispatches"
              payload: { window_start_at: "2026-08-10T00:00:00Z", window_end_at: "2026-08-10T08:00:00Z", target_steam_lb_hr: 20000, assigned_boiler_ids: ["${b_dec}"] }
              as: PlantManager
          trigger:
            - call: "POST /plants/${p_dec}/boilers/${b_dec}/decommission"
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_BOILER_IN_DISPATCH'"

      - name: err_water_out_of_spec_blocks_bring_online
        claim_type: violation_to_error
        grounds: ["errors[ERR_WATER_OUT_OF_SPEC]"]
        distinguishing_aspect: "Boiler with water_status == OUT_OF_SPEC cannot bring-online."
        test_recipe:
          setup:
            - "Plant P, Boiler B in WARMING"
            - "Chemistry reading with cycles=15 (> MAX_CYCLES=10) drives water_status to OUT_OF_SPEC"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "WOS Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_wos: $.data.id }
            - call: "POST /plants/${p_wos}/boilers"
              payload: { tag: "B-WOS", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_wos: $.data.id }
            - call: "POST /plants/${p_wos}/operators"
              payload: { full_name: "Op WOS", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_wos: $.data.id }
            # First in-spec chemistry so warm is allowed
            - call: "POST /plants/${p_wos}/boilers/${b_wos}/chemistry-logs"
              payload: { recorded_by_operator_id: "${op_wos}", recorded_at: "2026-08-05T08:00:00Z", conductivity_boiler_umho: 5000, conductivity_feedwater_umho: 1000, sulfite_residual_ppm: 30, phosphate_residual_ppm: 40 }
              as: Operator
              as_user_id: "${op_wos}"
            - call: "POST /plants/${p_wos}/boilers/${b_wos}/warm"
              as: Operator
              as_user_id: "${op_wos}"
            # Now an out-of-spec chemistry to drive water_status to OUT_OF_SPEC
            - call: "POST /plants/${p_wos}/boilers/${b_wos}/chemistry-logs"
              payload: { recorded_by_operator_id: "${op_wos}", recorded_at: "2026-08-05T09:00:00Z", conductivity_boiler_umho: 15000, conductivity_feedwater_umho: 1000, sulfite_residual_ppm: 30, phosphate_residual_ppm: 40 }
              as: Operator
              as_user_id: "${op_wos}"
          trigger:
            - call: "POST /plants/${p_wos}/boilers/${b_wos}/bring-online"
              as: Operator
              as_user_id: "${op_wos}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_WATER_OUT_OF_SPEC'"

  # =========================================================================
  # Section: rbac
  # =========================================================================
  - section: rbac
    instances:
      - name: inspector_cannot_warm_boiler
        claim_type: rbac_denial
        grounds: [roles, "endpoints[POST /plants/{plantId}/boilers/{boilerId}/warm]"]
        distinguishing_aspect: "Inspector role lacks permission for POST .../warm → 403."
        test_recipe:
          setup:
            - "Plant P, Boiler B STANDBY"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "RBAC Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_rbac: $.data.id }
            - call: "POST /plants/${p_rbac}/boilers"
              payload: { tag: "B-RB", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_rbac: $.data.id }
          trigger:
            - call: "POST /plants/${p_rbac}/boilers/${b_rbac}/warm"
              as: Inspector
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403"
            - "error_id == 'ERR_UNAUTHORIZED'"

      - name: operator_cannot_renew_own_license
        claim_type: rbac_denial
        grounds: [roles, "endpoints[POST /plants/{plantId}/operators/{operatorId}/renew-license]"]
        distinguishing_aspect: "renew-license is PlantManager-exclusive; Operator cannot invoke → 403."
        test_recipe:
          setup:
            - "Plant P, Operator O with license EXPIRED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /plants"
              payload: { name: "RBAC2 Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_rbac2: $.data.id }
            - call: "POST /plants/${p_rbac2}/operators"
              payload: { full_name: "Op Self", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2026-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_self: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:01Z" }
              as: PlantManager
            - call: "POST /plants/${p_rbac2}/run-ops"
              as: PlantManager
          trigger:
            - call: "POST /plants/${p_rbac2}/operators/${op_self}/renew-license"
              payload: { new_license_expires_on: "2027-08-01T00:00:00Z" }
              as: Operator
              as_user_id: "${op_self}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403"
            - "error_id == 'ERR_UNAUTHORIZED'"

      - name: plant_manager_cannot_verify_log_entry
        claim_type: rbac_denial
        grounds: [roles, "endpoints[POST /plants/{plantId}/boilers/{boilerId}/log-entries/{entryId}/verify]"]
        distinguishing_aspect: "verify is Operator-exclusive (with SoD); PlantManager invoking → 403."
        test_recipe:
          setup:
            - "Plant P, Boiler B, Operator O recorded DRAFT log entry"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "RBAC3 Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_rbac3: $.data.id }
            - call: "POST /plants/${p_rbac3}/boilers"
              payload: { tag: "B-RB3", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_rbac3: $.data.id }
            - call: "POST /plants/${p_rbac3}/operators"
              payload: { full_name: "Op RB3", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_rbac3: $.data.id }
            - call: "POST /plants/${p_rbac3}/boilers/${b_rbac3}/log-entries"
              payload: { recorded_by_operator_id: "${op_rbac3}", recorded_at: "2026-08-05T10:00:00Z", header_pressure_reading_psi: 150, steam_generated_lb: 1000, fuel_burned_gal: 8, feedwater_intake_gal: 130, blowdown_gal: 10 }
              as: Operator
              as_user_id: "${op_rbac3}"
              captures: { le_rbac3: $.data.id }
          trigger:
            - call: "GET /plants/${p_rbac3}/boilers/${b_rbac3}"
              as: PlantManager
              captures: { b_rbac3_v: $.data.version }
            - call: "POST /plants/${p_rbac3}/boilers/${b_rbac3}/log-entries/${le_rbac3}/verify"
              payload: { expected_boiler_version: "${b_rbac3_v}" }
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403"
            - "error_id == 'ERR_UNAUTHORIZED'"

      - name: segregation_of_duties_role_model
        claim_type: rbac_pattern_segregation
        grounds: [complexity_profile.role_model]
        distinguishing_aspect: "Same user cannot record AND verify the same BoilerLogEntry — SoD is enforced via ERR_SOD_VERIFICATION."
        excluded_because:
          difficulty_instance: sod_verification_same_operator_rejected
          rationale: "Covered by §1.9 state_machines.sod_verification_same_operator_rejected."

  # =========================================================================
  # Section: cross_cutting_layers
  # =========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_boiler_version_on_verify_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[log-verify-stale-boiler]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Verify with stale expected_boiler_version → 412 ERR_STALE_VERSION."
        test_recipe:
          setup:
            - "Plant P, Boiler B, two operators, two DRAFT log entries on B"
            - "Read B.version, then verify entry 1 (which advances version), then attempt to verify entry 2 with ORIGINAL version → stale"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "OCC Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_occ: $.data.id }
            - call: "POST /plants/${p_occ}/boilers"
              payload: { tag: "B-OCC", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_occ: $.data.id }
            - call: "POST /plants/${p_occ}/operators"
              payload: { full_name: "Op OCC A", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_occa: $.data.id }
            - call: "POST /plants/${p_occ}/operators"
              payload: { full_name: "Op OCC B", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_occb: $.data.id }
            - call: "POST /plants/${p_occ}/fuel-deliveries"
              payload: { delivered_at: "2026-08-01T08:00:00Z", quantity_gal: 1000, supplier: "A" }
              as: PlantManager
            - call: "POST /plants/${p_occ}/boilers/${b_occ}/log-entries"
              payload: { recorded_by_operator_id: "${op_occa}", recorded_at: "2026-08-05T10:00:00Z", header_pressure_reading_psi: 150, steam_generated_lb: 1000, fuel_burned_gal: 8, feedwater_intake_gal: 130, blowdown_gal: 10 }
              as: Operator
              as_user_id: "${op_occa}"
              captures: { le_occ1: $.data.id }
            - call: "POST /plants/${p_occ}/boilers/${b_occ}/log-entries"
              payload: { recorded_by_operator_id: "${op_occa}", recorded_at: "2026-08-05T11:00:00Z", header_pressure_reading_psi: 150, steam_generated_lb: 1100, fuel_burned_gal: 9, feedwater_intake_gal: 140, blowdown_gal: 11 }
              as: Operator
              as_user_id: "${op_occa}"
              captures: { le_occ2: $.data.id }
            # Read boiler version BEFORE any verification
            - call: "GET /plants/${p_occ}/boilers/${b_occ}"
              as: PlantManager
              captures: { b_occ_v_initial: $.data.version }
            # First verify — succeeds, advances boiler version
            - call: "POST /plants/${p_occ}/boilers/${b_occ}/log-entries/${le_occ1}/verify"
              payload: { expected_boiler_version: "${b_occ_v_initial}" }
              as: Operator
              as_user_id: "${op_occb}"
          trigger:
            # Second verify uses stale version (captured BEFORE first verify)
            - call: "POST /plants/${p_occ}/boilers/${b_occ}/log-entries/${le_occ2}/verify"
              payload: { expected_boiler_version: "${b_occ_v_initial}" }
              as: Operator
              as_user_id: "${op_occb}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412"
            - "error_id == 'ERR_STALE_VERSION'"
            - "Log entry ${le_occ2} status remains 'DRAFT' (rejected)"

      - name: occ_correct_version_on_verify_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[log-verify-stale-boiler]"]
        distinguishing_aspect: "Verify with current expected_boiler_version succeeds and bumps Boiler.version by 1."
        test_recipe:
          setup:
            - "Plant P, Boiler B (version=V), one DRAFT log entry"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "OCC2 Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_occ2: $.data.id }
            - call: "POST /plants/${p_occ2}/boilers"
              payload: { tag: "B-OCC2", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_occ2: $.data.id, v0: $.data.version }
            - call: "POST /plants/${p_occ2}/operators"
              payload: { full_name: "Op O2A", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_o2a: $.data.id }
            - call: "POST /plants/${p_occ2}/operators"
              payload: { full_name: "Op O2B", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_o2b: $.data.id }
            - call: "POST /plants/${p_occ2}/fuel-deliveries"
              payload: { delivered_at: "2026-08-01T08:00:00Z", quantity_gal: 1000, supplier: "A" }
              as: PlantManager
            - call: "POST /plants/${p_occ2}/boilers/${b_occ2}/log-entries"
              payload: { recorded_by_operator_id: "${op_o2a}", recorded_at: "2026-08-05T10:00:00Z", header_pressure_reading_psi: 150, steam_generated_lb: 1000, fuel_burned_gal: 8, feedwater_intake_gal: 130, blowdown_gal: 10 }
              as: Operator
              as_user_id: "${op_o2a}"
              captures: { le_o2: $.data.id }
            - call: "GET /plants/${p_occ2}/boilers/${b_occ2}"
              as: PlantManager
              captures: { b_occ2_v_pre: $.data.version }
          trigger:
            - call: "POST /plants/${p_occ2}/boilers/${b_occ2}/log-entries/${le_o2}/verify"
              payload: { expected_boiler_version: "${b_occ2_v_pre}" }
              as: Operator
              as_user_id: "${op_o2b}"
            - call: "GET /plants/${p_occ2}/boilers/${b_occ2}"
              as: PlantManager
              captures: { v_post: $.data.version }
          assert:
            - "Verify succeeded (no error)"
            - "Boiler.version incremented by 1 (cascade-free path)"

      - name: pagination_limit_offset_interaction
        claim_type: pagination_with_filtering
        grounds: [response_envelope.pagination_defaults, "endpoints[GET /plants/{plantId}/boilers]"]
        distinguishing_aspect: "List with explicit limit=2 returns first 2 and has_more=true; second page with offset=2 returns remainder."
        test_recipe:
          setup:
            - "Plant P with 3 boilers"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "Pag2 Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_pag2: $.data.id }
            - call: "POST /plants/${p_pag2}/boilers"
              payload: { tag: "B-P1", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
            - call: "POST /plants/${p_pag2}/boilers"
              payload: { tag: "B-P2", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
            - call: "POST /plants/${p_pag2}/boilers"
              payload: { tag: "B-P3", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
          trigger:
            - call: "GET /plants/${p_pag2}/boilers?limit=2&offset=0"
              as: PlantManager
            - call: "GET /plants/${p_pag2}/boilers?limit=2&offset=2"
              as: PlantManager
          assert:
            - "First call returns 2 items, has_more=true, total_count=3"
            - "Second call returns 1 item, has_more=false, total_count=3"

  # =========================================================================
  # Section: consistency_model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_verify_effects
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, state_machines.BoilerLogEntry.DRAFT_to_VERIFIED]
        distinguishing_aspect: "After a successful verify, subsequent GET immediately reflects updated totals (no async lag)."
        test_recipe:
          setup:
            - "Plant P, Boiler B, two operators; one DRAFT log entry"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "Imm2 Plant", state_code: "TX", header_pressure_psi: 150 }
              as: PlantManager
              captures: { p_imm2: $.data.id }
            - call: "POST /plants/${p_imm2}/boilers"
              payload: { tag: "B-I2", rated_capacity_lb_hr: 30000, relief_valve_setpoint_psi: 165, relief_valve_tolerance_pct: 3.0 }
              as: PlantManager
              captures: { b_imm2: $.data.id }
            - call: "POST /plants/${p_imm2}/operators"
              payload: { full_name: "Op I2A", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_i2a: $.data.id }
            - call: "POST /plants/${p_imm2}/operators"
              payload: { full_name: "Op I2B", license_class: "CLASS_1", license_state: "TX", license_expires_on: "2027-01-01T00:00:00Z" }
              as: PlantManager
              captures: { op_i2b: $.data.id }
            - call: "POST /plants/${p_imm2}/fuel-deliveries"
              payload: { delivered_at: "2026-08-01T08:00:00Z", quantity_gal: 1000, supplier: "A" }
              as: PlantManager
            - call: "POST /plants/${p_imm2}/boilers/${b_imm2}/log-entries"
              payload: { recorded_by_operator_id: "${op_i2a}", recorded_at: "2026-08-05T10:00:00Z", header_pressure_reading_psi: 150, steam_generated_lb: 5000, fuel_burned_gal: 40, feedwater_intake_gal: 650, blowdown_gal: 50 }
              as: Operator
              as_user_id: "${op_i2a}"
              captures: { le_i2: $.data.id }
            - call: "GET /plants/${p_imm2}/boilers/${b_imm2}"
              as: PlantManager
              captures: { b_imm2_v: $.data.version }
          trigger:
            - call: "POST /plants/${p_imm2}/boilers/${b_imm2}/log-entries/${le_i2}/verify"
              payload: { expected_boiler_version: "${b_imm2_v}" }
              as: Operator
              as_user_id: "${op_i2b}"
            - call: "GET /plants/${p_imm2}/boilers/${b_imm2}"
              as: PlantManager
              captures: { st: $.data.total_steam_lb, fb: $.data.total_fuel_burned_gal }
          assert:
            - "Boiler.total_steam_lb == 5000 (visible in immediate GET)"
            - "Boiler.total_fuel_burned_gal == 40"
