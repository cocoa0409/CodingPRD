scenario: |
  2345. Federal Environmental Review & Documentation (federal agency environmental review office): action
  classification across categorical exclusion, environmental assessment and environmental impact statement with
  extraordinary circumstances review, scoping with public and agency comment to identify issues and alternatives,
  purpose and need statement development constraining the alternatives range, resource analysis across biological,
  cultural, air, water and socioeconomic effects with cumulative impact assessment, cooperating and consulting
  agency coordination with concurrent consultation processes, draft document publication, comment period and
  response-to-comments preparation, decision documentation with mitigation commitments and monitoring,
  administrative objection or appeal and litigation record preparation

domain_name: "federal-environmental-review"
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: ReviewOffice
    parent: null
    common_fields: true
    fields:
      - name: office_code
        type: string
        source: input
        description: "Unique short code for the review office"
        constraints: "unique across ReviewOffice; 2-16 chars"
      - name: name
        type: string
        source: input
        description: "Human-readable office name"
      - name: ce_threshold_disturbance_hectares
        type: number
        source: input
        description: "Upper bound (exclusive) of ground disturbance eligible for CATEGORICAL_EXCLUSION"
        default: 5.0
        constraints: "> 0; < ea_threshold_disturbance_hectares"
      - name: ea_threshold_disturbance_hectares
        type: number
        source: input
        description: "Upper bound (exclusive) of ground disturbance eligible for ENVIRONMENTAL_ASSESSMENT"
        default: 100.0
        constraints: "> ce_threshold_disturbance_hectares"
      - name: min_scoping_days
        type: integer
        source: input
        description: "Minimum duration in whole days of a PUBLIC ScopingPeriod before it may be closed"
        default: 30
        constraints: ">= 1"
      - name: min_ea_comment_days
        type: integer
        source: input
        description: "Minimum comment-period length in whole days for an ENVIRONMENTAL_ASSESSMENT document"
        default: 30
        constraints: ">= 1"
      - name: min_eis_comment_days
        type: integer
        source: input
        description: "Minimum comment-period length in whole days for an ENVIRONMENTAL_IMPACT_STATEMENT document"
        default: 45
        constraints: ">= min_ea_comment_days"
      - name: objection_window_days
        type: integer
        source: input
        description: "Whole days after DecisionDocument signature during which Objection may be filed"
        default: 45
        constraints: ">= 1"
      - name: cumulative_radius_km
        type: number
        source: input
        description: "Inclusion radius in km for CumulativeAction entries in cumulative effect aggregation"
        default: 25.0
        constraints: "> 0"
      - name: significance_threshold
        type: number
        source: input
        description: "significance_score value at or above which a ResourceAnalysis is SIGNIFICANT (>= comparison)"
        default: 60.0
        constraints: "0 < value <= 100"
      - name: intensity_weight
        type: number
        source: input
        description: "Weight applied to intensity_score in the resource significance base term"
        default: 0.6
        constraints: "0 < value < 1; intensity_weight + context_weight == 1.0"
      - name: context_weight
        type: number
        source: input
        description: "Weight applied to context_sensitivity_score in the resource significance base term"
        default: 0.4
        constraints: "0 < value < 1; intensity_weight + context_weight == 1.0"
      - name: max_mitigated_reduction_points
        type: number
        source: input
        description: "Tier cap on total credit_points a DecisionDocument may claim from MitigationCommitment reductions"
        default: 18.0
        constraints: "> 0"
      - name: cost_per_reduction_point_cents
        type: integer
        source: input
        description: "Cents of base obligation charged per claimed credit point when computing contingency fee basis"
        default: 250000
        constraints: ">= 0"
      - name: monitoring_escalation_factor
        type: number
        source: input
        description: "Multiplier applied to each commitment's undiscounted monitoring stream before rounding"
        default: 1.035
        constraints: ">= 1.0"
      - name: max_binding_obligation_cents
        type: integer
        source: input
        description: "Office-wide ceiling on the sum of binding_obligation_cents across SIGNED DecisionDocument rows"
        default: 900000000
        constraints: ">= 0"
      - name: extraordinary_circumstance_codes
        type: array
        source: input
        description: "Ordered list of extraordinary-circumstance codes the office screens for"
        default: ["EC_HISTORIC", "EC_ENDANGERED_SPECIES", "EC_WETLAND"]
        constraints: "non-empty; each element one of EC_HISTORIC | EC_ENDANGERED_SPECIES | EC_WETLAND | EC_ENVIRONMENTAL_JUSTICE | EC_FLOODPLAIN"
      - name: ec_severity_trigger_threshold
        type: integer
        source: input
        description: "Finding severity at or above which a present extraordinary circumstance is treated as triggered"
        default: 3
        constraints: "1 <= value <= 5"
      - name: min_screened_in_alternatives_ea
        type: integer
        source: input
        description: "Minimum SCREENED_IN Alternative count required before an ENVIRONMENTAL_ASSESSMENT may be published"
        default: 1
        constraints: ">= 0"
      - name: min_screened_in_alternatives_eis
        type: integer
        source: input
        description: "Minimum SCREENED_IN Alternative count required before an ENVIRONMENTAL_IMPACT_STATEMENT may be published"
        default: 2
        constraints: ">= min_screened_in_alternatives_ea"
      - name: min_alternative_feasibility
        type: number
        source: input
        description: "feasibility_score at or above which a non-NO_ACTION Alternative may be SCREENED_IN (>= comparison)"
        default: 60.0
        constraints: "0 <= value <= 100"
      - name: binding_obligation_cents
        type: integer
        source: computed
        description: "Ledger: sum of binding_obligation_cents over this office's DecisionDocument rows with status SIGNED"
        default: 0

  - name: Agency
    parent: null
    common_fields: true
    fields:
      - name: agency_code
        type: string
        source: input
        description: "Unique short code for the cooperating/consulting agency"
        constraints: "unique across Agency; 2-16 chars"
      - name: name
        type: string
        source: input
        description: "Agency name"
      - name: agency_role
        type: enum
        source: input
        description: "Participation capacity of this agency in reviews"
        constraints: "COOPERATING | CONSULTING | BOTH"
      - name: max_concurrent_consultations
        type: integer
        source: input
        description: "Maximum number of ConsultationRequest rows with status IN {PENDING} whose occupied interval overlaps a candidate interval on this agency"
        default: 2
        constraints: ">= 1"
      - name: handoff_buffer_days
        type: integer
        source: input
        description: "Whole days of mandatory separation appended to each occupied consultation interval on this agency"
        default: 3
        constraints: ">= 0"
      - name: statutory_response_days
        type: integer
        source: input
        description: "Whole days from requested_start_at to statutory_due_at for consultations addressed to this agency"
        default: 135
        constraints: ">= 1"
      - name: status
        type: enum
        source: input
        description: "Whether the agency may receive new consultation requests"
        default: "ACTIVE"
        constraints: "ACTIVE | SUSPENDED"
      - name: active_consultation_count
        type: integer
        source: computed
        description: "Count of this agency's ConsultationRequest rows with status IN {PENDING}"
        default: 0

  - name: ProposedAction
    parent: null
    common_fields: true
    fields:
      - name: office_id
        type: string
        source: input
        description: "FK -> ReviewOffice.id; the office conducting this review"
      - name: title
        type: string
        source: input
        description: "Title of the proposed federal action"
      - name: disturbance_hectares
        type: number
        source: input
        description: "Estimated ground disturbance footprint in hectares"
        constraints: ">= 0"
      - name: reference_cost_cents
        type: integer
        source: input
        description: "Reference project cost in cents; denominator for Alternative cost_factor"
        constraints: "> 0"
      - name: in_critical_habitat
        type: boolean
        source: input
        description: "Whether the action area intersects designated critical habitat"
        default: false
      - name: affects_historic_property
        type: boolean
        source: input
        description: "Whether the action may affect a historic property"
        default: false
      - name: tribal_interest
        type: boolean
        source: input
        description: "Whether a federally recognized tribe has asserted an interest"
        default: false
      - name: floodplain_or_wetland
        type: boolean
        source: input
        description: "Whether the action area includes floodplain or wetland"
        default: false
      - name: classification
        type: enum
        source: computed
        description: "Review pathway assigned by POST /proposed-actions/{id}/classify"
        default: null
        constraints: "null | CATEGORICAL_EXCLUSION | ENVIRONMENTAL_ASSESSMENT | ENVIRONMENTAL_IMPACT_STATEMENT"
      - name: review_stage
        type: enum
        source: computed
        description: "Workflow stage of the review"
        default: "INTAKE"
        constraints: "INTAKE | SCREENED | CLASSIFIED | SCOPING | ANALYSIS | DRAFT_PUBLISHED | COMMENT_CLOSED | DECIDED | RECORD_CERTIFIED"
      - name: ec_screen_outcome
        type: enum
        source: computed
        description: "Outcome of the most recently adjudicated ExtraordinaryCircumstanceScreen for this action, by created_at ASC last"
        default: null
        constraints: "null | CLEARED | TRIGGERED"
      - name: extraordinary_circumstance_flag
        type: boolean
        source: computed
        description: "True when ec_screen_outcome == TRIGGERED"
        default: false
      - name: significant_issue_count
        type: integer
        source: computed
        description: "Count of this action's Issue rows with significance == SIGNIFICANT and status IN {OPEN, ANALYZED}"
        default: 0
      - name: unaddressed_issue_count
        type: integer
        source: computed
        description: "Count of this action's Issue rows with significance == SIGNIFICANT and status == OPEN that have no ResourceAnalysis row with status == FINAL on the same resource_area"
        default: 0
      - name: alternatives_screened_in_count
        type: integer
        source: computed
        description: "Count of this action's Alternative rows with screening_status == SCREENED_IN"
        default: 0
      - name: finalized_analysis_count
        type: integer
        source: computed
        description: "Count of this action's ResourceAnalysis rows with status == FINAL"
        default: 0
      - name: max_unmitigated_score
        type: number
        source: computed
        description: "Maximum unmitigated_score over this action's ResourceAnalysis rows with status == FINAL; 0.00 when the set is empty"
        default: 0.0
      - name: cumulative_intensity_index
        type: number
        source: computed
        description: "Mean of cumulative_effect_score over this action's ResourceAnalysis rows with status == FINAL, 2dp round_half_up; 0.00 when the set is empty"
        default: 0.0
      - name: record_entry_count
        type: integer
        source: computed
        description: "Count of this action's AdminRecordEntry rows; monotonically non-decreasing"
        default: 0
      - name: record_certified_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the administrative record was certified; null until certification"
        default: null

  - name: ExtraordinaryCircumstanceScreen
    parent: null
    common_fields: true
    fields:
      - name: action_id
        type: string
        source: input
        description: "FK -> ProposedAction.id; the action being screened"
      - name: screen_round
        type: integer
        source: computed
        description: "1 for the first screen on the action; each resubmission after RETURNED increments by 1"
        default: 1
      - name: findings
        type: array
        source: input
        description: "Array of objects { code, present, severity, narrative } — one per screened extraordinary circumstance"
        constraints: "non-empty; code must be a member of the action's office extraordinary_circumstance_codes; severity integer 0-5; narrative required when present == true"
      - name: triggered_codes
        type: array
        source: computed
        description: "Codes from findings where present == true and severity >= office.ec_severity_trigger_threshold, in office extraordinary_circumstance_codes order"
        default: []
      - name: max_severity
        type: integer
        source: computed
        description: "Maximum severity over findings where present == true; 0 when no finding is present"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Adjudication state of this screen"
        default: "SUBMITTED"
        constraints: "SUBMITTED | RETURNED | CLEARED | TRIGGERED"
      - name: adjudicator_note
        type: string
        source: computed
        description: "Note supplied by the ReviewingOfficial at adjudication; null while SUBMITTED"
        default: null

  - name: PurposeNeedStatement
    parent: null
    common_fields: true
    fields:
      - name: action_id
        type: string
        source: input
        description: "FK -> ProposedAction.id; the action this statement scopes"
      - name: version_no
        type: integer
        source: computed
        description: "1 for the first statement on the action; each subsequent statement increments by 1"
        default: 1
      - name: purpose_text
        type: string
        source: input
        description: "Narrative purpose statement"
      - name: need_text
        type: string
        source: input
        description: "Narrative need statement"
      - name: goal_codes
        type: array
        source: input
        description: "Ordered list of goal codes an Alternative must align with to remain feasible"
        constraints: "non-empty; each element 2-24 chars uppercase; no duplicates"
      - name: constraint_codes
        type: array
        source: input
        description: "Ordered list of constraint codes narrowing the alternatives range"
        default: []
        constraints: "each element 2-24 chars uppercase; no duplicates"
      - name: status
        type: enum
        source: computed
        description: "Adoption state of this statement"
        default: "DRAFT"
        constraints: "DRAFT | ADOPTED | SUPERSEDED"

  - name: Alternative
    parent: null
    common_fields: true
    fields:
      - name: action_id
        type: string
        source: input
        description: "FK -> ProposedAction.id; the action this alternative belongs to"
      - name: pinned_pn_statement_id
        type: string
        source: computed
        description: "FK -> PurposeNeedStatement.id; the ADOPTED statement in force when this alternative was created"
      - name: label
        type: string
        source: input
        description: "Short label for the alternative"
        constraints: "unique per action_id"
      - name: alternative_kind
        type: enum
        source: input
        description: "Category of the alternative"
        constraints: "NO_ACTION | PROPOSED_ACTION | REASONABLE_RANGE"
      - name: goal_alignment_codes
        type: array
        source: input
        description: "Goal codes this alternative claims to satisfy"
        default: []
        constraints: "each element must be a member of the pinned statement's goal_codes; no duplicates"
      - name: estimated_cost_cents
        type: integer
        source: input
        description: "Estimated implementation cost in cents"
        constraints: ">= 0"
      - name: feasibility_score
        type: number
        source: computed
        description: "Weighted alignment/cost score, 2dp round_half_up; see calculations.alternative_feasibility_score"
        default: 0.0
      - name: screening_status
        type: enum
        source: computed
        description: "Screening state of this alternative"
        default: "PROPOSED"
        constraints: "PROPOSED | SCREENED_IN | SCREENED_OUT | STALE"

  - name: ScopingPeriod
    parent: null
    common_fields: true
    fields:
      - name: action_id
        type: string
        source: input
        description: "FK -> ProposedAction.id; the action being scoped"
      - name: scoping_kind
        type: enum
        source: input
        description: "Audience of this scoping period"
        constraints: "PUBLIC | AGENCY"
      - name: start_at
        type: datetime
        source: input
        description: "Inclusive start of the scoping interval"
      - name: end_at
        type: datetime
        source: input
        description: "Exclusive end of the scoping interval; half-open [start_at, end_at)"
        constraints: "> start_at"
      - name: duration_days
        type: integer
        source: computed
        description: "Whole days from start_at to end_at, floor of the exact elapsed days"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Whether the scoping period still accepts Issue creation"
        default: "OPEN"
        constraints: "OPEN | CLOSED"

  - name: Issue
    parent: null
    common_fields: true
    fields:
      - name: action_id
        type: string
        source: input
        description: "FK -> ProposedAction.id; the action this issue was raised against"
      - name: scoping_period_id
        type: string
        source: input
        description: "FK -> ScopingPeriod.id; the scoping period during which the issue was identified"
      - name: resource_area
        type: enum
        source: input
        description: "Resource area the issue concerns"
        constraints: "BIOLOGICAL | CULTURAL | AIR | WATER | SOCIOECONOMIC"
      - name: origin
        type: enum
        source: input
        description: "Whether the issue came from public or agency scoping input"
        constraints: "PUBLIC | AGENCY"
      - name: significance
        type: enum
        source: input
        description: "Whether the issue must be carried into analysis"
        constraints: "SIGNIFICANT | NON_SIGNIFICANT"
      - name: summary
        type: string
        source: input
        description: "One-line issue statement"
      - name: status
        type: enum
        source: computed
        description: "Disposition of this issue"
        default: "OPEN"
        constraints: "OPEN | ANALYZED | WITHDRAWN"

  - name: ResourceAnalysis
    parent: null
    common_fields: true
    fields:
      - name: action_id
        type: string
        source: input
        description: "FK -> ProposedAction.id; the action analyzed"
      - name: resource_area
        type: enum
        source: input
        description: "Resource area analyzed; at most one non-superseded analysis per action per area"
        constraints: "BIOLOGICAL | CULTURAL | AIR | WATER | SOCIOECONOMIC; unique per (action_id, resource_area)"
      - name: intensity_score
        type: number
        source: input
        description: "Direct-effect intensity of the action on this resource area"
        constraints: "0 <= value <= 100"
      - name: context_sensitivity_score
        type: number
        source: input
        description: "Sensitivity of the affected setting for this resource area"
        constraints: "0 <= value <= 100"
      - name: affected_area_hectares
        type: number
        source: input
        description: "Hectares of the resource area directly affected; drives the area tier adder"
        constraints: ">= 0"
      - name: mitigation_reduction_points
        type: number
        source: input
        description: "Points subtracted from the direct term when the MITIGATED variant is applied"
        default: 0.0
        constraints: ">= 0; <= 40"
      - name: cumulative_effect_score
        type: number
        source: computed
        description: "Aggregated contribution of INCLUDED CumulativeAction rows in this resource area, 2dp round_half_up"
        default: 0.0
      - name: unmitigated_score
        type: number
        source: computed
        description: "significance score with the UNMITIGATED variant, 2dp round_half_up"
        default: 0.0
      - name: mitigated_score
        type: number
        source: computed
        description: "significance score with the MITIGATED variant, 2dp round_half_up"
        default: 0.0
      - name: significance_score
        type: number
        source: computed
        description: "The score of the variant recorded in variant_applied; null until the analysis is finalized"
        default: null
      - name: significance_determination
        type: enum
        source: computed
        description: "SIGNIFICANT when significance_score >= office.significance_threshold, else NOT_SIGNIFICANT; null until finalized"
        default: null
        constraints: "null | SIGNIFICANT | NOT_SIGNIFICANT"
      - name: variant_applied
        type: enum
        source: computed
        description: "Which significance variant was recorded at finalize; null while DRAFT"
        default: null
        constraints: "null | UNMITIGATED | MITIGATED"
      - name: status
        type: enum
        source: computed
        description: "Whether the analysis is still editable"
        default: "DRAFT"
        constraints: "DRAFT | FINAL"

  - name: CumulativeAction
    parent: null
    common_fields: true
    fields:
      - name: action_id
        type: string
        source: input
        description: "FK -> ProposedAction.id; the action whose cumulative baseline this entry belongs to"
      - name: resource_area
        type: enum
        source: input
        description: "Resource area this past/present/foreseeable action contributes to"
        constraints: "BIOLOGICAL | CULTURAL | AIR | WATER | SOCIOECONOMIC"
      - name: label
        type: string
        source: input
        description: "Short label for the contributing action"
        constraints: "unique per (action_id, resource_area)"
      - name: intensity_contribution
        type: number
        source: input
        description: "Raw intensity contribution of this entry before footprint weighting"
        constraints: "0 <= value <= 100"
      - name: footprint_hectares
        type: number
        source: input
        description: "Footprint in hectares; drives the footprint weight in the aggregation"
        constraints: ">= 0"
      - name: distance_km
        type: number
        source: input
        description: "Distance in km from the action area; entries beyond office.cumulative_radius_km are EXCLUDED"
        constraints: ">= 0"
      - name: temporal_scope
        type: enum
        source: input
        description: "Temporal category of the contributing action"
        constraints: "PAST | PRESENT | REASONABLY_FORESEEABLE"
      - name: inclusion_status
        type: enum
        source: computed
        description: "INCLUDED when distance_km <= office.cumulative_radius_km, else EXCLUDED"
        default: "INCLUDED"
        constraints: "INCLUDED | EXCLUDED"

  - name: ConsultationRequest
    parent: null
    common_fields: true
    fields:
      - name: action_id
        type: string
        source: input
        description: "FK -> ProposedAction.id; the action under consultation"
      - name: agency_id
        type: string
        source: input
        description: "FK -> Agency.id; the consulting or cooperating agency addressed"
      - name: consultation_type
        type: enum
        source: input
        description: "Statutory consultation track"
        constraints: "ESA_SECTION_7 | NHPA_SECTION_106 | CWA_SECTION_404 | COOPERATING_AGENCY"
      - name: requested_start_at
        type: datetime
        source: input
        description: "Inclusive start of the occupied consultation interval on the agency"
      - name: statutory_due_at
        type: datetime
        source: computed
        description: "requested_start_at plus agency.statutory_response_days whole days; inclusive end of the occupied interval"
      - name: is_required
        type: boolean
        source: computed
        description: "True when the action's flags make this consultation_type mandatory; see calculations.consultation_requirement_set"
        default: false
      - name: responded_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the agency response; null while PENDING"
        default: null
      - name: late
        type: boolean
        source: computed
        description: "True when responded_at > statutory_due_at; false while PENDING"
        default: false
      - name: conditions_text
        type: string
        source: computed
        description: "Conditions supplied with a CONDITIONAL_CONCURRENCE response; null otherwise"
        default: null
      - name: status
        type: enum
        source: computed
        description: "Consultation disposition"
        default: "PENDING"
        constraints: "PENDING | CONCURRED | CONDITIONAL_CONCURRENCE | NOT_CONCURRED | WITHDRAWN"

  - name: NepaDocument
    parent: null
    common_fields: true
    fields:
      - name: action_id
        type: string
        source: input
        description: "FK -> ProposedAction.id; the action this document covers"
      - name: document_type
        type: enum
        source: input
        description: "Document class; must match the action's classification"
        constraints: "CE_MEMORANDUM | ENVIRONMENTAL_ASSESSMENT | ENVIRONMENTAL_IMPACT_STATEMENT"
      - name: title
        type: string
        source: input
        description: "Document title"
      - name: publication_status
        type: enum
        source: computed
        description: "Publication dimension of this document's parallel state; evolves independently of comment_status"
        default: "DRAFT"
        constraints: "DRAFT | PUBLISHED | FINAL | SUPERSEDED"
      - name: comment_status
        type: enum
        source: computed
        description: "Comment-period dimension of this document's parallel state; evolves independently of publication_status"
        default: "NOT_OPEN"
        constraints: "NOT_OPEN | OPEN | CLOSED"
      - name: comment_period_start_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the comment period opened; null while NOT_OPEN"
        default: null
      - name: comment_period_end_at
        type: datetime
        source: input
        description: "Planned exclusive end of the comment period, supplied at publish"
        default: null
      - name: comment_period_days
        type: integer
        source: computed
        description: "Whole days from comment_period_start_at to comment_period_end_at, floor of the exact elapsed days"
        default: 0
      - name: substantive_comment_count
        type: integer
        source: computed
        description: "Count of this document's PublicComment rows with is_substantive == true and disposition IN {RECEIVED, RESPONDED}"
        default: 0
      - name: responded_substantive_count
        type: integer
        source: computed
        description: "Count of this document's PublicComment rows with is_substantive == true and disposition == RESPONDED"
        default: 0
      - name: unresolved_substantive_count
        type: integer
        source: computed
        description: "substantive_comment_count minus responded_substantive_count"
        default: 0
      - name: response_completeness_pct
        type: number
        source: computed
        description: "100.00 when substantive_comment_count == 0, else 100 * responded_substantive_count / substantive_comment_count, 2dp round_half_up"
        default: 100.0

  - name: PublicComment
    parent: null
    common_fields: true
    fields:
      - name: document_id
        type: string
        source: input
        description: "FK -> NepaDocument.id; the document commented on"
      - name: assigned_issue_id
        type: string
        source: input
        description: "FK -> Issue.id; the scoping issue this comment maps to; null when the comment raises no tracked issue"
        default: null
      - name: commenter_name
        type: string
        source: input
        description: "Name supplied by the commenter"
      - name: resource_area
        type: enum
        source: input
        description: "Resource area the comment concerns"
        constraints: "BIOLOGICAL | CULTURAL | AIR | WATER | SOCIOECONOMIC"
      - name: is_substantive
        type: boolean
        source: input
        description: "Whether the comment requires a written response"
        default: false
      - name: body
        type: string
        source: input
        description: "Comment text"
      - name: response_text
        type: string
        source: computed
        description: "Agency response text; null until responded"
        default: null
      - name: response_category
        type: enum
        source: computed
        description: "Category of the agency response; null until responded"
        default: null
        constraints: "null | FACTUAL_CORRECTION | ANALYSIS_REVISED | NO_CHANGE_NEEDED | OUT_OF_SCOPE"
      - name: disposition
        type: enum
        source: computed
        description: "Handling state of this comment"
        default: "RECEIVED"
        constraints: "RECEIVED | RESPONDED | DUPLICATE"

  - name: DecisionDocument
    parent: null
    common_fields: true
    fields:
      - name: action_id
        type: string
        source: input
        description: "FK -> ProposedAction.id; the action decided"
      - name: selected_alternative_id
        type: string
        source: input
        description: "FK -> Alternative.id; the alternative selected by the decision"
      - name: decision_type
        type: enum
        source: input
        description: "Decision instrument class"
        constraints: "CE_DETERMINATION | FONSI | MITIGATED_FONSI | RECORD_OF_DECISION"
      - name: prepared_by_user_id
        type: string
        source: system
        description: "X-User-ID of the NepaCoordinator who created this decision draft"
      - name: signed_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the DecidingOfficial who signed; null while DRAFT"
        default: null
      - name: signed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of signature; null while DRAFT"
        default: null
      - name: committed_obligation_cents
        type: integer
        source: computed
        description: "Sum of cost_estimate_cents over this decision's MitigationCommitment rows with status == BINDING"
        default: 0
      - name: base_obligation_cents
        type: integer
        source: computed
        description: "Sum of lifecycle_obligation_cents over this decision's BINDING MitigationCommitment rows (per-commitment rounding, then sum)"
        default: 0
      - name: credit_points
        type: number
        source: computed
        description: "Mitigation credit claimed at signature, 2dp round_half_up; pinned at signature and never recomputed from base_obligation_cents afterwards"
        default: 0.0
      - name: contingency_fee_cents
        type: integer
        source: computed
        description: "Monitoring contingency fee derived from base_obligation_cents and credit_points; see calculations.decision_binding_obligation_cents"
        default: 0
      - name: binding_obligation_cents
        type: integer
        source: computed
        description: "base_obligation_cents + contingency_fee_cents; the amount posted to the office ledger at signature"
        default: 0
      - name: mitigated_max_score
        type: number
        source: computed
        description: "max_unmitigated_score minus the claimed credit_points, floored at 0.00, 2dp round_half_up"
        default: 0.0
      - name: objection_window_opens_at
        type: datetime
        source: computed
        description: "Equal to signed_at; null while DRAFT"
        default: null
      - name: objection_window_closes_at
        type: datetime
        source: computed
        description: "signed_at plus office.objection_window_days whole days; null while DRAFT"
        default: null
      - name: objection_count
        type: integer
        source: computed
        description: "Count of this decision's Objection rows with status IN {FILED, REMANDED, DENIED}"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Decision lifecycle state"
        default: "DRAFT"
        constraints: "DRAFT | SIGNED | VACATED"

  - name: MitigationCommitment
    parent: null
    common_fields: true
    fields:
      - name: decision_id
        type: string
        source: input
        description: "FK -> DecisionDocument.id; the decision that carries this commitment"
      - name: source_analysis_id
        type: string
        source: input
        description: "FK -> ResourceAnalysis.id; the FINAL analysis whose effect this commitment mitigates"
      - name: measure_text
        type: string
        source: input
        description: "Description of the mitigation measure"
      - name: cost_estimate_cents
        type: integer
        source: input
        description: "One-time implementation cost of the measure in cents"
        constraints: ">= 0"
      - name: monitoring_years
        type: integer
        source: input
        description: "Number of whole years of post-decision monitoring"
        default: 0
        constraints: "0 <= value <= 20"
      - name: annual_monitoring_cost_cents
        type: integer
        source: input
        description: "Annual monitoring cost in cents"
        default: 0
        constraints: ">= 0"
      - name: reduction_points
        type: number
        source: input
        description: "Credit points this measure contributes toward the decision's mitigation credit"
        default: 0.0
        constraints: ">= 0; <= 20"
      - name: lifecycle_obligation_cents
        type: integer
        source: computed
        description: "cost_estimate_cents plus the escalated monitoring stream, rounded per commitment; see calculations.commitment_lifecycle_obligation_cents"
        default: 0
      - name: monitoring_status
        type: enum
        source: computed
        description: "Monitoring obligation state"
        default: "NOT_REQUIRED"
        constraints: "NOT_REQUIRED | SCHEDULED | RELEASED"
      - name: status
        type: enum
        source: computed
        description: "Commitment lifecycle state"
        default: "PROPOSED"
        constraints: "PROPOSED | BINDING | RELEASED"

  - name: Objection
    parent: null
    common_fields: true
    fields:
      - name: decision_id
        type: string
        source: input
        description: "FK -> DecisionDocument.id; the signed decision objected to"
      - name: objector_name
        type: string
        source: input
        description: "Name of the objecting party"
      - name: objector_type
        type: enum
        source: input
        description: "Category of the objecting party"
        constraints: "COMMENTER | AGENCY | TRIBE | OTHER"
      - name: basis_issue_area
        type: enum
        source: input
        description: "Resource area the objection is grounded in"
        constraints: "BIOLOGICAL | CULTURAL | AIR | WATER | SOCIOECONOMIC"
      - name: standing_basis
        type: enum
        source: input
        description: "How the objector participated during the comment period"
        constraints: "SUBSTANTIVE_COMMENT | AGENCY_CONSULTATION | NONE"
      - name: resolution_note
        type: string
        source: computed
        description: "Reviewing officer's resolution note; null while FILED"
        default: null
      - name: status
        type: enum
        source: computed
        description: "Objection disposition"
        default: "FILED"
        constraints: "FILED | DENIED | REMANDED"

  - name: AdminRecordEntry
    parent: null
    common_fields: false
    fields:
      - name: action_id
        type: string
        source: input
        description: "FK -> ProposedAction.id; the action whose administrative record this entry belongs to"
      - name: sequence_no
        type: integer
        source: computed
        description: "1-based position of this entry within the action's record, assigned in creation order"
      - name: entry_code
        type: enum
        source: computed
        description: "Machine code for the recorded event"
        constraints: "EC_SCREEN_ADJUDICATED | CLASSIFICATION_ASSIGNED | CLASSIFICATION_ESCALATED | PN_ADOPTED | SCOPING_CLOSED | ANALYSIS_FINALIZED | ANALYSIS_REOPENED | DOCUMENT_PUBLISHED | DOCUMENT_SUPERSEDED | COMMENT_PERIOD_CLOSED | DOCUMENT_FINALIZED | DECISION_SIGNED | DECISION_VACATED | OBJECTION_FILED | OBJECTION_RESOLVED | RECORD_CERTIFIED"
      - name: occurred_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the recorded event occurred"
      - name: actor_role
        type: enum
        source: computed
        description: "Role that performed the recorded action, or SYSTEM for cascade-generated entries"
        constraints: "PolicyAdmin | NepaCoordinator | ResourceSpecialist | ReviewingOfficial | AgencyLiaison | DecidingOfficial | ObjectionReviewingOfficer | PublicCommenter | SYSTEM"
      - name: actor_user_id
        type: string
        source: computed
        description: "X-User-ID of the acting principal; null for SYSTEM entries"
        default: null
      - name: summary
        type: string
        source: computed
        description: "Human-readable one-line description of the recorded event"
      - name: related_entity_type
        type: enum
        source: computed
        description: "Polymorphic discriminator naming which entity type the entry describes"
        constraints: "ExtraordinaryCircumstanceScreen | PurposeNeedStatement | ScopingPeriod | ResourceAnalysis | NepaDocument | DecisionDocument | Objection | ProposedAction"
      - name: related_entity_ref
        type: string
        source: computed
        description: "Identifier of the row named by related_entity_type; polymorphic, so no single-parent foreign key applies"

state_machines:
  - entity: ExtraordinaryCircumstanceScreen
    initial_state: SUBMITTED
    terminal_states: [CLEARED, TRIGGERED]
    transitions:
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /ec-screens/{id}/adjudicate with disposition=RETURNED"
        actor: ReviewingOfficial
        preconditions:
          - "screen.status == SUBMITTED"
          - "adjudicator_note is present and non-empty"
        side_effects:
          - "sets adjudicator_note"
          - "action.ec_screen_outcome and action.extraordinary_circumstance_flag are NOT changed (a RETURNED screen is not an adjudicated outcome)"
          - "action.review_stage unchanged"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /ec-screens/{id}/resubmit"
        actor: NepaCoordinator
        preconditions:
          - "screen.status == RETURNED"
          - "findings satisfy the ExtraordinaryCircumstanceScreen.findings constraints"
        side_effects:
          - "replaces findings with the resubmitted array"
          - "increments screen_round by 1"
          - "recomputes triggered_codes and max_severity"
          - "clears adjudicator_note to null"
        note: "Cycle: SUBMITTED -> RETURNED -> SUBMITTED, unbounded rounds; screen_round records the loop count."
      - from: SUBMITTED
        to: CLEARED
        trigger: "POST /ec-screens/{id}/adjudicate with disposition=CLEARED"
        actor: ReviewingOfficial
        preconditions:
          - "screen.status == SUBMITTED"
          - "triggered_codes is empty"
        side_effects:
          - "action.ec_screen_outcome := CLEARED; action.extraordinary_circumstance_flag := false"
          - "if action.review_stage == INTAKE then action.review_stage := SCREENED"
          - "appends AdminRecordEntry with entry_code EC_SCREEN_ADJUDICATED; increments action.record_entry_count"
      - from: SUBMITTED
        to: TRIGGERED
        trigger: "POST /ec-screens/{id}/adjudicate with disposition=TRIGGERED"
        actor: ReviewingOfficial
        preconditions:
          - "screen.status == SUBMITTED"
          - "triggered_codes is non-empty"
        side_effects:
          - "HOP 1: action.ec_screen_outcome := TRIGGERED and action.extraordinary_circumstance_flag := true"
          - "HOP 2 (caused by HOP 1): because extraordinary_circumstance_flag became true, if action.classification == CATEGORICAL_EXCLUSION then action.classification := ENVIRONMENTAL_ASSESSMENT and action.review_stage := CLASSIFIED, and an AdminRecordEntry with entry_code CLASSIFICATION_ESCALATED is appended"
          - "HOP 3 (caused by HOP 2): because the classification changed away from CATEGORICAL_EXCLUSION, every NepaDocument of this action with document_type == CE_MEMORANDUM and publication_status IN {DRAFT, PUBLISHED} moves publication_status := SUPERSEDED and comment_status := CLOSED, and an AdminRecordEntry with entry_code DOCUMENT_SUPERSEDED is appended per document"
          - "if action.review_stage == INTAKE then action.review_stage := SCREENED"
          - "appends AdminRecordEntry with entry_code EC_SCREEN_ADJUDICATED; increments action.record_entry_count for every entry appended above"

  - entity: ProposedAction
    initial_state: INTAKE
    terminal_states: [RECORD_CERTIFIED]
    transitions:
      - from: INTAKE
        to: SCREENED
        trigger: "system event: an ExtraordinaryCircumstanceScreen on this action reaches CLEARED or TRIGGERED"
        actor: system
        preconditions: ["action.review_stage == INTAKE"]
        side_effects: ["sets ec_screen_outcome and extraordinary_circumstance_flag from the adjudicated screen"]
      - from: SCREENED
        to: CLASSIFIED
        trigger: "POST /proposed-actions/{id}/classify"
        actor: NepaCoordinator
        preconditions:
          - "action.review_stage == SCREENED"
          - "action.ec_screen_outcome is not null"
        side_effects:
          - "sets classification per calculations.action_classification"
          - "appends AdminRecordEntry with entry_code CLASSIFICATION_ASSIGNED; increments record_entry_count"
      - from: CLASSIFIED
        to: CLASSIFIED
        trigger: "system event: extraordinary_circumstance_flag becomes true while classification == CATEGORICAL_EXCLUSION"
        actor: system
        preconditions: ["action.classification == CATEGORICAL_EXCLUSION"]
        side_effects:
          - "classification := ENVIRONMENTAL_ASSESSMENT"
          - "review_stage reverts to CLASSIFIED from SCOPING, ANALYSIS or DRAFT_PUBLISHED if it had advanced"
          - "appends AdminRecordEntry with entry_code CLASSIFICATION_ESCALATED"
      - from: CLASSIFIED
        to: SCOPING
        trigger: "POST /proposed-actions/{id}/scoping-periods"
        actor: NepaCoordinator
        preconditions:
          - "action.review_stage IN {CLASSIFIED, SCOPING}"
          - "action.classification is not null"
        side_effects: ["no record entry; stage advance only. An additional period opened while the stage is already SCOPING leaves review_stage unchanged"]
      - from: SCOPING
        to: ANALYSIS
        trigger: "POST /scoping-periods/{id}/close"
        actor: NepaCoordinator
        preconditions:
          - "action.review_stage == SCOPING"
          - "the action has an ADOPTED PurposeNeedStatement (otherwise the close itself is rejected with ERR_NO_ADOPTED_PURPOSE_NEED)"
        side_effects:
          - "the stage advances only once EVERY ScopingPeriod of the action has status == CLOSED; closing one of several still-open periods closes that period and leaves review_stage at SCOPING with no record entry"
          - "appends AdminRecordEntry with entry_code SCOPING_CLOSED; increments record_entry_count"
      - from: ANALYSIS
        to: DRAFT_PUBLISHED
        trigger: "POST /documents/{id}/publish"
        actor: NepaCoordinator
        preconditions: ["action.review_stage == ANALYSIS"]
        side_effects:
          - "appends AdminRecordEntry with entry_code DOCUMENT_PUBLISHED; increments record_entry_count"
      - from: DRAFT_PUBLISHED
        to: COMMENT_CLOSED
        trigger: "POST /documents/{id}/close-comment-period"
        actor: NepaCoordinator
        preconditions: ["action.review_stage == DRAFT_PUBLISHED"]
        side_effects:
          - "appends AdminRecordEntry with entry_code COMMENT_PERIOD_CLOSED; increments record_entry_count"
      - from: COMMENT_CLOSED
        to: DECIDED
        trigger: "POST /decisions/{id}/sign"
        actor: DecidingOfficial
        preconditions: ["action.review_stage == COMMENT_CLOSED"]
        side_effects:
          - "appends AdminRecordEntry with entry_code DECISION_SIGNED; increments record_entry_count"
      - from: DECIDED
        to: COMMENT_CLOSED
        trigger: "system event: the action's SIGNED DecisionDocument becomes VACATED through an Objection remand"
        actor: system
        preconditions: ["action.review_stage == DECIDED", "action.record_certified_at is null"]
        side_effects:
          - "appends AdminRecordEntry with entry_code DECISION_VACATED; increments record_entry_count"
      - from: DECIDED
        to: RECORD_CERTIFIED
        trigger: "POST /decisions/{id}/certify-record"
        actor: ReviewingOfficial
        preconditions:
          - "action.review_stage == DECIDED"
          - "the decision status == SIGNED"
          - "current logical time >= decision.objection_window_closes_at"
          - "no Objection on the decision has status == FILED"
        side_effects:
          - "sets record_certified_at := current logical time"
          - "appends AdminRecordEntry with entry_code RECORD_CERTIFIED; increments record_entry_count"

  - entity: PurposeNeedStatement
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ADOPTED
        trigger: "POST /purpose-need-statements/{id}/adopt"
        actor: ReviewingOfficial
        preconditions:
          - "statement.status == DRAFT"
          - "action.review_stage IN {CLASSIFIED, SCOPING, ANALYSIS}"
          - "expected_action_version matches action.version"
        side_effects:
          - "any other PurposeNeedStatement of the same action with status == ADOPTED moves to SUPERSEDED"
          - "every Alternative of the action whose pinned_pn_statement_id is the newly SUPERSEDED statement and whose screening_status IN {PROPOSED, SCREENED_IN} moves to STALE, decrementing action.alternatives_screened_in_count for each formerly SCREENED_IN row"
          - "increments action.version by 1"
          - "appends AdminRecordEntry with entry_code PN_ADOPTED; increments action.record_entry_count"
      - from: ADOPTED
        to: SUPERSEDED
        trigger: "system event: a newer PurposeNeedStatement on the same action is adopted"
        actor: system
        preconditions: ["statement.status == ADOPTED"]
        side_effects: ["cascades Alternative rows pinned to this statement to STALE"]

  - entity: Alternative
    initial_state: PROPOSED
    terminal_states: [SCREENED_OUT, STALE]
    transitions:
      - from: PROPOSED
        to: SCREENED_IN
        trigger: "POST /alternatives/{id}/screen with decision=SCREENED_IN"
        actor: ReviewingOfficial
        preconditions:
          - "alternative.screening_status == PROPOSED"
          - "alternative.pinned_pn_statement_id names a PurposeNeedStatement with status == ADOPTED"
          - "alternative.alternative_kind == NO_ACTION OR alternative.feasibility_score >= office.min_alternative_feasibility"
        side_effects: ["increments action.alternatives_screened_in_count by 1"]
      - from: PROPOSED
        to: SCREENED_OUT
        trigger: "POST /alternatives/{id}/screen with decision=SCREENED_OUT"
        actor: ReviewingOfficial
        preconditions: ["alternative.screening_status == PROPOSED"]
        side_effects: ["no counter change"]
      - from: SCREENED_IN
        to: STALE
        trigger: "system event: the pinned PurposeNeedStatement is SUPERSEDED"
        actor: system
        preconditions: ["alternative.screening_status == SCREENED_IN"]
        side_effects: ["decrements action.alternatives_screened_in_count by 1"]
      - from: PROPOSED
        to: STALE
        trigger: "system event: the pinned PurposeNeedStatement is SUPERSEDED"
        actor: system
        preconditions: ["alternative.screening_status == PROPOSED"]
        side_effects: ["no counter change"]

  - entity: ScopingPeriod
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /scoping-periods/{id}/close"
        actor: NepaCoordinator
        preconditions:
          - "period.status == OPEN"
          - "period.scoping_kind == AGENCY OR period.duration_days >= office.min_scoping_days"
          - "the action has a PurposeNeedStatement with status == ADOPTED"
        side_effects:
          - "if action.review_stage == SCOPING then action.review_stage := ANALYSIS"
          - "appends AdminRecordEntry with entry_code SCOPING_CLOSED"

  - entity: Issue
    initial_state: OPEN
    terminal_states: [WITHDRAWN]
    transitions:
      - from: OPEN
        to: ANALYZED
        trigger: "system event: a ResourceAnalysis on the same action and resource_area reaches FINAL"
        actor: system
        preconditions: ["issue.status == OPEN"]
        side_effects:
          - "recomputes action.unaddressed_issue_count"
      - from: ANALYZED
        to: OPEN
        trigger: "system event: the covering ResourceAnalysis on the same action and resource_area is reopened to DRAFT"
        actor: system
        preconditions: ["issue.status == ANALYZED"]
        side_effects:
          - "recomputes action.unaddressed_issue_count"

  - entity: ResourceAnalysis
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: FINAL
        trigger: "POST /resource-analyses/{id}/finalize"
        actor: ResourceSpecialist
        preconditions:
          - "analysis.status == DRAFT"
          - "action.review_stage == ANALYSIS"
          - "basis == UNMITIGATED OR analysis.mitigation_reduction_points > 0"
        side_effects:
          - "recomputes cumulative_effect_score, unmitigated_score and mitigated_score"
          - "sets variant_applied := basis, significance_score := the score of that variant, significance_determination"
          - "every Issue of the action with the same resource_area and status == OPEN moves to ANALYZED"
          - "recomputes action.finalized_analysis_count, action.max_unmitigated_score, action.cumulative_intensity_index, action.unaddressed_issue_count"
          - "appends AdminRecordEntry with entry_code ANALYSIS_FINALIZED; increments action.record_entry_count"
      - from: FINAL
        to: DRAFT
        trigger: "POST /resource-analyses/{id}/reopen"
        actor: ResourceSpecialist
        preconditions:
          - "analysis.status == FINAL"
          - "no NepaDocument of the action has publication_status IN {PUBLISHED, FINAL}"
          - "no DecisionDocument of the action has status == SIGNED"
        side_effects:
          - "clears significance_score, significance_determination and variant_applied to null"
          - "every Issue of the action with the same resource_area and status == ANALYZED moves back to OPEN"
          - "recomputes action.finalized_analysis_count, action.max_unmitigated_score, action.cumulative_intensity_index, action.unaddressed_issue_count"
          - "appends AdminRecordEntry with entry_code ANALYSIS_REOPENED; increments action.record_entry_count"
        note: "Compensating pair with finalize: action.unaddressed_issue_count returns to its pre-finalize value exactly."

  - entity: ConsultationRequest
    initial_state: PENDING
    terminal_states: [CONCURRED, CONDITIONAL_CONCURRENCE, NOT_CONCURRED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: CONCURRED
        trigger: "POST /consultations/{id}/respond with outcome=CONCURRED"
        actor: AgencyLiaison
        preconditions:
          - "consultation.status == PENDING"
          - "X-User-ID equals consultation.agency_id"
        side_effects:
          - "sets responded_at := current logical time and late := responded_at > statutory_due_at"
          - "decrements agency.active_consultation_count by 1"
      - from: PENDING
        to: CONDITIONAL_CONCURRENCE
        trigger: "POST /consultations/{id}/respond with outcome=CONDITIONAL_CONCURRENCE"
        actor: AgencyLiaison
        preconditions:
          - "consultation.status == PENDING"
          - "X-User-ID equals consultation.agency_id"
          - "conditions_text is present and non-empty"
        side_effects:
          - "sets conditions_text, responded_at, late"
          - "decrements agency.active_consultation_count by 1"
      - from: PENDING
        to: NOT_CONCURRED
        trigger: "POST /consultations/{id}/respond with outcome=NOT_CONCURRED"
        actor: AgencyLiaison
        preconditions:
          - "consultation.status == PENDING"
          - "X-User-ID equals consultation.agency_id"
        side_effects:
          - "sets responded_at, late"
          - "decrements agency.active_consultation_count by 1"
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /consultations/{id}/respond with outcome=WITHDRAWN"
        actor: NepaCoordinator
        preconditions: ["consultation.status == PENDING"]
        side_effects:
          - "sets responded_at, late := false"
          - "decrements agency.active_consultation_count by 1"
          - "frees the occupied interval on the agency for overlap purposes"

  - entity: NepaDocument
    initial_state: "DRAFT x NOT_OPEN"
    terminal_states: [SUPERSEDED]
    transitions:
      - from: "publication_status=DRAFT"
        to: "publication_status=PUBLISHED, comment_status=OPEN"
        trigger: "POST /documents/{id}/publish"
        actor: NepaCoordinator
        preconditions:
          - "document.publication_status == DRAFT"
          - "document.document_type matches action.classification"
          - "action.review_stage == ANALYSIS"
          - "action.unaddressed_issue_count == 0"
          - "every ConsultationRequest of the action with is_required == true has status IN {CONCURRED, CONDITIONAL_CONCURRENCE}"
          - "action.alternatives_screened_in_count >= the office minimum for this document_type"
          - "comment_period_end_at minus the current logical time is >= the office minimum comment days for this document_type"
        side_effects:
          - "sets comment_period_start_at := current logical time and recomputes comment_period_days"
          - "if action.review_stage == ANALYSIS then action.review_stage := DRAFT_PUBLISHED"
          - "appends AdminRecordEntry with entry_code DOCUMENT_PUBLISHED"
        note: "Parallel dimensions: publish is the only transition that advances both axes at once; the two axes move independently thereafter."
      - from: "comment_status=OPEN"
        to: "comment_status=CLOSED"
        trigger: "POST /documents/{id}/close-comment-period"
        actor: NepaCoordinator
        preconditions:
          - "document.comment_status == OPEN"
          - "current logical time >= document.comment_period_end_at"
        side_effects:
          - "publication_status is NOT changed by this transition (remains PUBLISHED)"
          - "if action.review_stage == DRAFT_PUBLISHED then action.review_stage := COMMENT_CLOSED"
          - "appends AdminRecordEntry with entry_code COMMENT_PERIOD_CLOSED"
      - from: "publication_status=PUBLISHED, comment_status=CLOSED"
        to: "publication_status=FINAL"
        trigger: "POST /documents/{id}/finalize"
        actor: NepaCoordinator
        preconditions:
          - "document.publication_status == PUBLISHED"
          - "document.comment_status == CLOSED"
          - "document.unresolved_substantive_count == 0"
        side_effects:
          - "appends AdminRecordEntry with entry_code DOCUMENT_FINALIZED"
      - from: "publication_status=FINAL"
        to: "publication_status=DRAFT, comment_status=CLOSED"
        trigger: "system event: the action's SIGNED DecisionDocument becomes VACATED through an Objection remand"
        actor: system
        preconditions: ["document.publication_status == FINAL"]
        side_effects:
          - "comment_status remains CLOSED; only the publication axis reverts"
      - from: "publication_status IN {DRAFT, PUBLISHED}"
        to: "publication_status=SUPERSEDED, comment_status=CLOSED"
        trigger: "system event: action.classification changes away from this document's document_type"
        actor: system
        preconditions: ["document.publication_status IN {DRAFT, PUBLISHED}"]
        side_effects:
          - "appends AdminRecordEntry with entry_code DOCUMENT_SUPERSEDED"

  - entity: PublicComment
    initial_state: RECEIVED
    terminal_states: [RESPONDED, DUPLICATE]
    transitions:
      - from: RECEIVED
        to: RESPONDED
        trigger: "POST /comments/{id}/respond with response_category != OUT_OF_SCOPE"
        actor: NepaCoordinator
        preconditions:
          - "comment.disposition == RECEIVED"
          - "document.comment_status == CLOSED"
        side_effects:
          - "sets response_text and response_category"
          - "recomputes document.responded_substantive_count, unresolved_substantive_count and response_completeness_pct"
      - from: RECEIVED
        to: DUPLICATE
        trigger: "POST /comments/{id}/respond with response_category=OUT_OF_SCOPE"
        actor: NepaCoordinator
        preconditions:
          - "comment.disposition == RECEIVED"
          - "document.comment_status == CLOSED"
        side_effects:
          - "sets response_text and response_category := OUT_OF_SCOPE"
          - "removes the comment from document.substantive_comment_count and recomputes response_completeness_pct"

  - entity: DecisionDocument
    initial_state: DRAFT
    terminal_states: [VACATED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /decisions/{id}/sign"
        actor: DecidingOfficial
        preconditions:
          - "decision.status == DRAFT"
          - "X-User-ID != decision.prepared_by_user_id"
          - "the action has a NepaDocument with publication_status == FINAL, except for CE_DETERMINATION decisions"
          - "action.review_stage == COMMENT_CLOSED"
          - "decision_type == MITIGATED_FONSI requires at least one MitigationCommitment with status == BINDING"
          - "office.binding_obligation_cents + this decision's binding_obligation_cents <= office.max_binding_obligation_cents"
        side_effects:
          - "sets signed_by_user_id, signed_at := current logical time"
          - "every MitigationCommitment of this decision with status == PROPOSED moves to BINDING; monitoring_status := SCHEDULED when monitoring_years > 0, else NOT_REQUIRED"
          - "recomputes committed_obligation_cents, base_obligation_cents, credit_points, contingency_fee_cents, binding_obligation_cents and mitigated_max_score, in that order"
          - "office.binding_obligation_cents := office.binding_obligation_cents + decision.binding_obligation_cents"
          - "sets objection_window_opens_at := signed_at and objection_window_closes_at := signed_at + office.objection_window_days days"
          - "action.review_stage := DECIDED"
          - "appends AdminRecordEntry with entry_code DECISION_SIGNED"
      - from: SIGNED
        to: VACATED
        trigger: "system event: an Objection on this decision is resolved with disposition=REMANDED"
        actor: system
        preconditions:
          - "decision.status == SIGNED"
          - "action.record_certified_at is null"
        side_effects:
          - "HOP 2a (caused by the remand): every MitigationCommitment of this decision with status == BINDING moves to RELEASED and monitoring_status := RELEASED"
          - "HOP 2b (caused by the remand): office.binding_obligation_cents := office.binding_obligation_cents - decision.binding_obligation_cents, restoring the ledger to its pre-signature value"
          - "HOP 3 (caused by the vacatur): every NepaDocument of the action with publication_status == FINAL reverts publication_status := DRAFT while comment_status stays CLOSED, and action.review_stage := COMMENT_CLOSED"
          - "committed_obligation_cents, base_obligation_cents, credit_points, contingency_fee_cents and binding_obligation_cents are retained on the VACATED decision as the historical record"
          - "appends AdminRecordEntry with entry_code DECISION_VACATED"
        note: "Compensating pair with sign: office.binding_obligation_cents returns to its pre-signature value exactly."

  - entity: MitigationCommitment
    initial_state: PROPOSED
    terminal_states: [RELEASED]
    transitions:
      - from: PROPOSED
        to: BINDING
        trigger: "system event: the parent DecisionDocument is signed"
        actor: system
        preconditions: ["commitment.status == PROPOSED"]
        side_effects:
          - "monitoring_status := SCHEDULED when monitoring_years > 0, else NOT_REQUIRED"
          - "lifecycle_obligation_cents is recomputed and enters decision.base_obligation_cents"
      - from: BINDING
        to: RELEASED
        trigger: "system event: the parent DecisionDocument is vacated"
        actor: system
        preconditions: ["commitment.status == BINDING"]
        side_effects: ["monitoring_status := RELEASED"]

  - entity: Objection
    initial_state: FILED
    terminal_states: [DENIED, REMANDED]
    transitions:
      - from: FILED
        to: DENIED
        trigger: "POST /objections/{id}/resolve with disposition=DENIED"
        actor: ObjectionReviewingOfficer
        preconditions:
          - "objection.status == FILED"
          - "X-User-ID != decision.signed_by_user_id"
          - "resolution_note is present and non-empty"
        side_effects:
          - "sets resolution_note; decision.status unchanged"
          - "appends AdminRecordEntry with entry_code OBJECTION_RESOLVED"
      - from: FILED
        to: REMANDED
        trigger: "POST /objections/{id}/resolve with disposition=REMANDED"
        actor: ObjectionReviewingOfficer
        preconditions:
          - "objection.status == FILED"
          - "X-User-ID != decision.signed_by_user_id"
          - "resolution_note is present and non-empty"
          - "decision.status == SIGNED"
          - "action.record_certified_at is null"
        side_effects:
          - "HOP 1: sets resolution_note and status := REMANDED"
          - "HOP 2 (caused by HOP 1): decision.status := VACATED, which itself releases the decision's BINDING commitments and debits office.binding_obligation_cents"
          - "HOP 3 (caused by HOP 2): the action's FINAL NepaDocument reverts to publication_status DRAFT and action.review_stage reverts DECIDED -> COMMENT_CLOSED"
          - "appends AdminRecordEntry with entry_code OBJECTION_RESOLVED"

concurrency_rules:
  - rule_id: pn-adopt-stale-action
    parent_entity: ProposedAction
    write_endpoint: "POST /purpose-need-statements/{id}/adopt"
    occ_field: "expected_action_version"
    description: |
      Adopting a PurposeNeedStatement against a ProposedAction whose version has advanced since the
      client last observed it is rejected with a stale-version error. Adoption legitimately supersedes
      whichever statement is currently ADOPTED and marks alternatives pinned to it STALE, so a writer
      holding an outdated view of the action would silently discard an adoption it never saw.
    error_id: ERR_STALE_ACTION_VERSION
    http_status: 412

  - rule_id: mitigation-add-stale-decision
    parent_entity: DecisionDocument
    write_endpoint: "POST /decisions/{id}/mitigations"
    occ_field: "expected_decision_version"
    description: |
      Adding a MitigationCommitment to a DecisionDocument whose version has advanced since the client
      last observed it is rejected with a stale-version error. Each commitment changes the credit and
      obligation basis the decision will pin at signature, so a writer working from an outdated view of
      the decision would compute its mitigation package against a superseded commitment set.
    error_id: ERR_STALE_DECISION_VERSION
    http_status: 412

calculations:
  - name: action_classification
    trigger: "POST /proposed-actions/{id}/classify; re-evaluated as a side effect when extraordinary_circumstance_flag becomes true"
    algorithm: threshold
    formula: |
      # Evaluated top-to-bottom; the FIRST matching branch wins.
      if action.disturbance_hectares >= office.ea_threshold_disturbance_hectares:
          classification = ENVIRONMENTAL_IMPACT_STATEMENT
      elif (action.disturbance_hectares >= office.ce_threshold_disturbance_hectares
            or action.extraordinary_circumstance_flag == true
            or action.in_critical_habitat == true):
          classification = ENVIRONMENTAL_ASSESSMENT
      else:
          classification = CATEGORICAL_EXCLUSION

      # Escalation-only re-evaluation (system event, never a downgrade):
      # when extraordinary_circumstance_flag flips false -> true and the current
      # classification is CATEGORICAL_EXCLUSION, classification becomes
      # ENVIRONMENTAL_ASSESSMENT. A flag flip never lowers an existing
      # ENVIRONMENTAL_ASSESSMENT or ENVIRONMENTAL_IMPACT_STATEMENT.
    input_set: "The single ProposedAction row and its ReviewOffice thresholds"
    constants:
      CE_THRESHOLD_SOURCE: "office.ce_threshold_disturbance_hectares"
      EA_THRESHOLD_SOURCE: "office.ea_threshold_disturbance_hectares"
    precision: "hectare comparisons use >= against the office thresholds; no rounding"

  - name: cumulative_effect_score
    trigger: "POST /resource-analyses/{id}/finalize (side effect: recomputes ResourceAnalysis.cumulative_effect_score)"
    algorithm: aggregation
    formula: |
      # Input set: CumulativeAction rows with action_id == analysis.action_id,
      # resource_area == analysis.resource_area, inclusion_status == INCLUDED.
      # Processing order: created_at ASC (order affects nothing, since every
      # per-entry value is rounded independently before summation).
      TEMPORAL_FACTOR = { PAST: 0.75, PRESENT: 1.00, REASONABLY_FORESEEABLE: 0.85 }

      # STEP 1 (per entry):
      footprint_weight[e] = 1.0 + min(0.5, e.footprint_hectares / 200.0)
      # STEP 2 (per entry) — ROUNDING ORDER IS PINNED HERE:
      contribution[e] = round_half_up(e.intensity_contribution * footprint_weight[e]
                                      * TEMPORAL_FACTOR[e.temporal_scope], 2)
      # STEP 3: sum the ALREADY-ROUNDED per-entry contributions.
      #   "round per entry, then sum" is the pinned order.
      #   "sum the raw products, then round once" is FORBIDDEN and yields a
      #   different cent value.
      subtotal = sum(contribution[e] for e in input_set)
      # STEP 4: crowding multiplier from the INCLUDED entry count only.
      n = count(input_set)
      crowding_multiplier = 1.0 + 0.05 * max(0, n - 3)
      # STEP 5:
      cumulative_effect_score = round_half_up(subtotal * crowding_multiplier, 2)
      # Empty input set -> subtotal 0, n = 0, crowding 1.0 -> score 0.00
    input_set: "CumulativeAction rows of the same action and resource_area with inclusion_status == INCLUDED; EXCLUDED rows contribute nothing and are not counted in n"
    constants:
      FOOTPRINT_DIVISOR: 200.0
      FOOTPRINT_WEIGHT_CAP: 0.5
      CROWDING_FREE_ENTRIES: 3
      CROWDING_STEP: 0.05
      TEMPORAL_FACTOR_PAST: 0.75
      TEMPORAL_FACTOR_PRESENT: 1.00
      TEMPORAL_FACTOR_FORESEEABLE: 0.85
    precision: "2 decimal places, round_half_up, applied per entry at STEP 2 and once more at STEP 5"

  - name: cumulative_action_inclusion
    trigger: "POST /proposed-actions/{id}/cumulative-actions (sets CumulativeAction.inclusion_status)"
    algorithm: threshold
    formula: |
      inclusion_status = INCLUDED if entry.distance_km <= office.cumulative_radius_km else EXCLUDED
    input_set: "The single CumulativeAction row and its action's ReviewOffice"
    constants:
      RADIUS_SOURCE: "office.cumulative_radius_km"
    precision: "km comparison uses <= (an entry exactly at the radius is INCLUDED); no rounding"

  - name: resource_significance_score
    trigger: "POST /resource-analyses/{id}/finalize (side effect: sets unmitigated_score, mitigated_score, significance_score, significance_determination, variant_applied)"
    algorithm: weighted_scoring
    formula: |
      base = office.intensity_weight * analysis.intensity_score
           + office.context_weight   * analysis.context_sensitivity_score

      # Area tier adder (tiered selection on affected_area_hectares):
      if analysis.affected_area_hectares == 0:        area_tier_adder = 0.0
      elif analysis.affected_area_hectares <= 5:      area_tier_adder = 2.0
      elif analysis.affected_area_hectares <= 25:     area_tier_adder = 4.0
      elif analysis.affected_area_hectares <= 100:    area_tier_adder = 7.0
      else:                                          area_tier_adder = 11.0

      cumulative_uplift = 0.15 * max(0.0, analysis.cumulative_effect_score - 40.0)

      direct_term = min(100.0, base + area_tier_adder + cumulative_uplift)

      unmitigated_score = round_half_up(direct_term, 2)
      mitigated_score   = round_half_up(max(0.0, direct_term - analysis.mitigation_reduction_points), 2)

      # variant selection: the `basis` field of the finalize request
      significance_score = unmitigated_score if basis == UNMITIGATED else mitigated_score
      variant_applied    = basis
      significance_determination =
          SIGNIFICANT if significance_score >= office.significance_threshold else NOT_SIGNIFICANT
    input_set: "The single ResourceAnalysis row (with cumulative_effect_score already recomputed in the same request) and its action's ReviewOffice weights and threshold"
    constants:
      CUMULATIVE_UPLIFT_RATE: 0.15
      CUMULATIVE_UPLIFT_FLOOR: 40.0
      SCORE_CEILING: 100.0
      AREA_TIER_BOUNDS: [0, 5, 25, 100]
      AREA_TIER_ADDERS: [0.0, 2.0, 4.0, 7.0, 11.0]
    precision: "2 decimal places, round_half_up; the SIGNIFICANT comparison is >= (a score exactly equal to office.significance_threshold is SIGNIFICANT)"
    variants:
      - name: UNMITIGATED
        when: "POST /resource-analyses/{id}/finalize is called with basis=UNMITIGATED"
        difference: "mitigation_reduction_points is ignored entirely; significance_score == round_half_up(direct_term, 2)"
      - name: MITIGATED
        when: "POST /resource-analyses/{id}/finalize is called with basis=MITIGATED (requires mitigation_reduction_points > 0)"
        difference: "significance_score == round_half_up(max(0.0, direct_term - mitigation_reduction_points), 2), which can flip significance_determination from SIGNIFICANT to NOT_SIGNIFICANT on identical stored inputs"

  - name: action_analysis_rollups
    trigger: "POST /resource-analyses/{id}/finalize and POST /resource-analyses/{id}/reopen (side effects on ProposedAction)"
    algorithm: aggregation
    formula: |
      FINALS = ResourceAnalysis rows with action_id == action.id and status == FINAL
      finalized_analysis_count  = count(FINALS)
      max_unmitigated_score     = max(a.unmitigated_score for a in FINALS) if FINALS else 0.00
      cumulative_intensity_index= round_half_up(sum(a.cumulative_effect_score for a in FINALS)
                                               / count(FINALS), 2) if FINALS else 0.00
    input_set: "ResourceAnalysis rows of the action with status == FINAL; DRAFT rows are excluded"
    constants:
      EMPTY_SET_VALUE: 0.00
    precision: "2 decimal places, round_half_up; empty FINAL set yields exactly 0.00 for both aggregates"

  - name: unaddressed_issue_count
    trigger: "POST /proposed-actions/{id}/issues, POST /resource-analyses/{id}/finalize, POST /resource-analyses/{id}/reopen"
    algorithm: aggregation
    formula: |
      unaddressed_issue_count = count(
        i for i in Issue
        if i.action_id == action.id
           and i.significance == SIGNIFICANT
           and i.status == OPEN
           and not exists(a in ResourceAnalysis where a.action_id == action.id
                                                  and a.resource_area == i.resource_area
                                                  and a.status == FINAL)
      )
      significant_issue_count = count(i for i in Issue
        if i.action_id == action.id and i.significance == SIGNIFICANT
           and i.status IN {OPEN, ANALYZED})
    input_set: "Issue rows of the action, filtered by significance == SIGNIFICANT; WITHDRAWN issues never count"
    constants: {}
    precision: "integer counts"

  - name: alternative_feasibility_score
    trigger: "POST /alternatives (sets Alternative.feasibility_score at creation)"
    algorithm: weighted_scoring
    formula: |
      pinned = the PurposeNeedStatement named by alternative.pinned_pn_statement_id
      alignment_ratio = count(c for c in alternative.goal_alignment_codes if c in pinned.goal_codes)
                        / count(pinned.goal_codes)
      cost_overrun_ratio = max(0.0, alternative.estimated_cost_cents - action.reference_cost_cents)
                           / action.reference_cost_cents
      cost_factor = max(0.0, 1.0 - cost_overrun_ratio)
      feasibility_score = round_half_up(100.0 * (0.65 * alignment_ratio + 0.35 * cost_factor), 2)
    input_set: "The single Alternative row, its pinned PurposeNeedStatement, and the action's reference_cost_cents"
    constants:
      ALIGNMENT_WEIGHT: 0.65
      COST_WEIGHT: 0.35
    precision: "2 decimal places, round_half_up; the SCREENED_IN gate compares feasibility_score >= office.min_alternative_feasibility, and NO_ACTION alternatives are exempt from that gate"

  - name: consultation_requirement_set
    trigger: "POST /consultations (sets ConsultationRequest.is_required and statutory_due_at)"
    algorithm: threshold
    formula: |
      required_types = set()
      if action.in_critical_habitat:                              required_types.add(ESA_SECTION_7)
      if action.affects_historic_property or action.tribal_interest: required_types.add(NHPA_SECTION_106)
      if action.floodplain_or_wetland:                            required_types.add(CWA_SECTION_404)
      # COOPERATING_AGENCY is never a required type.
      is_required = (request.consultation_type in required_types)

      statutory_due_at = request.requested_start_at + agency.statutory_response_days days
      # Occupied interval on the agency, used by the overlap rule:
      #   occupied = [requested_start_at, statutory_due_at + agency.handoff_buffer_days days]  (CLOSED on both ends)
      late = (responded_at > statutory_due_at) if responded_at is not null else false
    input_set: "The single ConsultationRequest, its ProposedAction flags, and its Agency schedule parameters"
    constants: {}
    precision: "whole-day datetime arithmetic; both interval ends are inclusive"

  - name: commitment_lifecycle_obligation_cents
    trigger: "POST /decisions/{id}/mitigations and POST /decisions/{id}/sign (sets MitigationCommitment.lifecycle_obligation_cents)"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER: round each commitment's monitoring stream to whole
      # cents FIRST, then sum across commitments.
      monitoring_raw = commitment.monitoring_years
                       * commitment.annual_monitoring_cost_cents
                       * office.monitoring_escalation_factor
      lifecycle_obligation_cents = commitment.cost_estimate_cents + round_half_up(monitoring_raw, 0)

      # Then, at the decision level:
      base_obligation_cents = sum(c.lifecycle_obligation_cents
                                  for c in commitments with status == BINDING)
      # FORBIDDEN alternative order: sum every monitoring_raw across commitments and
      # round the total once. It differs by whole cents whenever two or more streams
      # land on a half cent.
      committed_obligation_cents = sum(c.cost_estimate_cents
                                       for c in commitments with status == BINDING)
    input_set: "MitigationCommitment rows of the decision with status == BINDING; PROPOSED and RELEASED rows are excluded"
    constants:
      ESCALATION_SOURCE: "office.monitoring_escalation_factor"
    precision: "whole cents, round_half_up, applied ONCE PER COMMITMENT before summation"

  - name: decision_binding_obligation_cents
    trigger: "POST /decisions/{id}/sign (sets credit_points, contingency_fee_cents, binding_obligation_cents, mitigated_max_score)"
    algorithm: constraint_propagation
    formula: |
      # The four quantities look mutually dependent (the fee is keyed on a credit
      # tier, the credit is keyed on an obligation, the obligation includes the fee).
      # THE EVALUATION ORDER BELOW IS PINNED AND MUST NOT BE ITERATED TO A FIXED POINT.

      # STEP 1 — base (see calculations.commitment_lifecycle_obligation_cents)
      base_obligation_cents = sum of BINDING commitments' lifecycle_obligation_cents

      # STEP 2 — credit, computed from base_obligation_cents ONLY
      declared_points = sum(c.reduction_points for c in BINDING commitments)
      capacity_points = base_obligation_cents / office.cost_per_reduction_point_cents
      credit_points   = round_half_up(min(declared_points,
                                          capacity_points,
                                          office.max_mitigated_reduction_points), 2)

      # STEP 3 — fee rate tier, keyed on the STEP 2 credit_points
      if   credit_points >= 10.00: fee_rate = 0.05
      elif credit_points >=  5.00: fee_rate = 0.035
      else:                        fee_rate = 0.02

      # STEP 4 — fee, on the STEP 1 base (NOT on the binding total)
      contingency_fee_cents = round_half_up(base_obligation_cents * fee_rate, 0)

      # STEP 5 — binding total
      binding_obligation_cents = base_obligation_cents + contingency_fee_cents

      # STEP 6 — credit_points is NOW FROZEN. Recomputing capacity_points from
      # binding_obligation_cents (which is larger) would raise credit_points and is
      # explicitly FORBIDDEN. The value persisted on the decision is the STEP 2 value.
      mitigated_max_score = round_half_up(max(0.00, action.max_unmitigated_score - credit_points), 2)
    input_set: "MitigationCommitment rows of the decision with status == BINDING (evaluated after the sign transition has flipped PROPOSED -> BINDING), the ReviewOffice tier parameters, and action.max_unmitigated_score"
    constants:
      FEE_RATE_HIGH: 0.05
      FEE_RATE_MID: 0.035
      FEE_RATE_LOW: 0.02
      FEE_TIER_HIGH_POINTS: 10.00
      FEE_TIER_MID_POINTS: 5.00
    precision: "credit_points and mitigated_max_score: 2 decimal places, round_half_up; cent amounts: whole cents, round_half_up"
    variants:
      - name: COMMITMENT_ONLY
        when: "read as DecisionDocument.committed_obligation_cents"
        difference: "sums only cost_estimate_cents of BINDING commitments — no monitoring escalation and no contingency fee"
      - name: LIFECYCLE
        when: "read as DecisionDocument.binding_obligation_cents and posted to office.binding_obligation_cents"
        difference: "adds the per-commitment escalated monitoring stream and the credit-tiered contingency fee, so it exceeds COMMITMENT_ONLY on identical commitment rows"

  - name: objection_window
    trigger: "POST /decisions/{id}/sign (sets objection_window_opens_at, objection_window_closes_at)"
    algorithm: threshold
    formula: |
      objection_window_opens_at  = decision.signed_at
      objection_window_closes_at = decision.signed_at + office.objection_window_days days
      # Filing gate:  opens_at <= current_utc <  closes_at   (half-open)
      # Certification gate: current_utc >= closes_at
    input_set: "The single DecisionDocument and its action's ReviewOffice"
    constants:
      WINDOW_SOURCE: "office.objection_window_days"
    precision: "whole-day datetime arithmetic; the filing window is half-open [opens_at, closes_at)"

  - name: interval_duration_days
    trigger: "POST /proposed-actions/{id}/scoping-periods (ScopingPeriod.duration_days) and POST /documents/{id}/publish (NepaDocument.comment_period_days)"
    algorithm: interval_merge
    formula: |
      duration_days      = floor((end_at - start_at) / 1 day)                   # ScopingPeriod, half-open [start_at, end_at)
      comment_period_days= floor((comment_period_end_at - comment_period_start_at) / 1 day)

      # ScopingPeriod overlap rule (STRICT PAIRWISE, HALF-OPEN):
      #   two periods on the same action with the same scoping_kind collide when
      #   new.start_at < existing.end_at AND existing.start_at < new.end_at.
      #   Touching endpoints (new.start_at == existing.end_at) do NOT collide.
      #   Existing periods with status IN {OPEN, CLOSED} both participate.

      # ConsultationRequest overlap rule (CLOSED + BUFFER + AGGREGATE CAPACITY):
      #   occupied(r) = [r.requested_start_at, r.statutory_due_at + agency.handoff_buffer_days days]
      #   candidate collides with r when occupied(candidate) and occupied(r) share
      #   any instant, INCLUDING a shared endpoint.
      #   Only rows with status == PENDING on the same agency_id participate.
      #   Rejection occurs when count(colliding PENDING rows) >= agency.max_concurrent_consultations.
    input_set: "For scoping: ScopingPeriod rows of the same action with the same scoping_kind and status IN {OPEN, CLOSED}. For consultation: ConsultationRequest rows of the same agency with status == PENDING"
    constants:
      SCOPING_INTERVAL_SEMANTICS: "half-open [start, end), strict pairwise, adjacency allowed"
      CONSULTATION_INTERVAL_SEMANTICS: "closed [start, due + buffer], aggregate capacity, shared endpoint collides"
    precision: "whole days, floor; no partial-day credit"

  - name: admin_record_sequence
    trigger: "every transition whose side_effects append an AdminRecordEntry"
    algorithm: chronological
    formula: |
      sequence_no = (max sequence_no over existing AdminRecordEntry rows with the same
                     action_id, or 0) + 1
      # When a single request appends more than one entry, they are appended in the
      # side-effect order documented on that transition (HOP 1 before HOP 2 before
      # HOP 3), and sequence_no increases by 1 per entry in that order.
      # Ties in occurred_at are ordered by sequence_no ASC; entity id NEVER
      # participates in ordering.
      action.record_entry_count = count(AdminRecordEntry with this action_id)
      # record_entry_count is monotonically non-decreasing: no transition deletes
      # or renumbers entries, including compensating transitions.
    input_set: "AdminRecordEntry rows of the same action_id"
    constants: {}
    precision: "integer, 1-based, gap-free per action"

  - name: office_binding_obligation_ledger
    trigger: "POST /decisions/{id}/sign (credit) and the DecisionDocument SIGNED -> VACATED system transition (debit)"
    algorithm: aggregation
    formula: |
      # Maintained incrementally and always equal to this closed form:
      office.binding_obligation_cents == sum(d.binding_obligation_cents
                                             for d in DecisionDocument
                                             if d.action.office_id == office.id
                                                and d.status == SIGNED)
      # sign:   office.binding_obligation_cents += decision.binding_obligation_cents
      # vacate: office.binding_obligation_cents -= decision.binding_obligation_cents
      # CONSERVED QUANTITY: sign followed by vacatur of the same decision restores
      # office.binding_obligation_cents to its exact pre-signature value (zero drift),
      # even though the VACATED decision retains its historical cent fields.
    input_set: "DecisionDocument rows whose action belongs to this office, filtered to status == SIGNED; DRAFT and VACATED rows are excluded"
    constants:
      CAP_SOURCE: "office.max_binding_obligation_cents"
    precision: "whole cents; the sign-time cap check is office.binding_obligation_cents + decision.binding_obligation_cents <= office.max_binding_obligation_cents"

  - name: document_response_completeness
    trigger: "POST /comments and POST /comments/{id}/respond (recomputes the NepaDocument comment counters)"
    algorithm: aggregation
    formula: |
      substantive_comment_count   = count(c for c in PublicComment
                                          if c.document_id == doc.id and c.is_substantive
                                             and c.disposition IN {RECEIVED, RESPONDED})
      responded_substantive_count = count(c for c in PublicComment
                                          if c.document_id == doc.id and c.is_substantive
                                             and c.disposition == RESPONDED)
      unresolved_substantive_count= substantive_comment_count - responded_substantive_count
      response_completeness_pct   = 100.00 if substantive_comment_count == 0 else
                                    round_half_up(100.0 * responded_substantive_count
                                                  / substantive_comment_count, 2)
    input_set: "PublicComment rows of the document with is_substantive == true; DUPLICATE dispositions drop out of both counters"
    constants:
      EMPTY_SET_PCT: 100.00
    precision: "2 decimal places, round_half_up; an empty substantive set yields exactly 100.00"

  - name: agency_active_consultation_count
    trigger: "POST /consultations and POST /consultations/{id}/respond"
    algorithm: aggregation
    formula: |
      agency.active_consultation_count = count(r for r in ConsultationRequest
                                               if r.agency_id == agency.id
                                                  and r.status == PENDING)
    input_set: "ConsultationRequest rows of the agency with status == PENDING"
    constants: {}
    precision: "integer count"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The role in X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "Request body conforms to the endpoint's input schema: every required field present, no unknown fields, types correct, enum members valid, numeric ranges and array constraints in §1.1 satisfied"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 4
    category: existence
    check: "Every id in the request path resolves to an existing row, validated left to right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 5
    category: existence
    check: "Every foreign-key id in the request body resolves to an existing row (office_id, action_id, agency_id, document_id, decision_id, selected_alternative_id, source_analysis_id, scoping_period_id, assigned_issue_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /proposed-actions, POST /alternatives, POST /consultations, POST /comments, POST /decisions, POST /decisions/{id}/mitigations, POST /proposed-actions/{id}/issues"

  - priority: 6
    category: auth
    check: "When X-User-Role is AgencyLiaison, X-User-ID equals the agency_id of the ConsultationRequest being acted on"
    error_id: ERR_AGENCY_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /consultations/{id}/respond"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: the signing DecidingOfficial's X-User-ID differs from decision.prepared_by_user_id, and the resolving ObjectionReviewingOfficer's X-User-ID differs from decision.signed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /decisions/{id}/sign, POST /objections/{id}/resolve"

  - priority: 8
    category: state
    check: "The target row and every row named in the transition's preconditions are in a state that permits the requested transition (screen status, statement status, alternative screening_status, scoping status, analysis status, document publication_status and comment_status, decision status, objection status, action.review_stage, and — for reopen — the absence of PUBLISHED/FINAL documents and SIGNED decisions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 9
    category: state
    check: "OCC: expected_action_version equals ProposedAction.version on adopt; expected_decision_version equals DecisionDocument.version on mitigation creation"
    error_id: ERR_STALE_ACTION_VERSION
    http_status: 412
    applies_to: "POST /purpose-need-statements/{id}/adopt, POST /decisions/{id}/mitigations"

  - priority: 10
    category: business_safety
    check: "Publication completeness: for every consultation_type in the action's required set (calculations.consultation_requirement_set) there is a ConsultationRequest of that type with status IN {CONCURRED, CONDITIONAL_CONCURRENCE}, and action.unaddressed_issue_count == 0"
    error_id: ERR_REQUIRED_CONSULTATION_INCOMPLETE
    http_status: 409
    applies_to: "POST /documents/{id}/publish"

  - priority: 11
    category: business_referential
    check: "Referential coherence: document_type matches action.classification; decision_type matches action.classification (CE_DETERMINATION only for CATEGORICAL_EXCLUSION; FONSI/MITIGATED_FONSI only for ENVIRONMENTAL_ASSESSMENT; RECORD_OF_DECISION only for ENVIRONMENTAL_IMPACT_STATEMENT); selected_alternative_id belongs to the same action and has screening_status == SCREENED_IN; source_analysis_id belongs to the same action and has status == FINAL; assigned_issue_id belongs to the same action as the commented document; Issue.scoping_period_id belongs to the same action as Issue.action_id"
    error_id: ERR_REFERENCE_MISMATCH
    http_status: 409
    applies_to: "POST /proposed-actions/{id}/documents, POST /decisions, POST /decisions/{id}/mitigations, POST /comments, POST /proposed-actions/{id}/issues"

  - priority: 12
    category: business_constraint
    check: "Uniqueness and range constraints: office_code unique, agency_code unique, Alternative.label unique per action, CumulativeAction.label unique per (action, resource_area), at most one ResourceAnalysis per (action, resource_area); a non-NO_ACTION Alternative may only be SCREENED_IN when feasibility_score >= office.min_alternative_feasibility; the SCREENED_IN count must meet the office minimum for the document_type at publish; Objection.standing_basis must not be NONE"
    error_id: ERR_CONSTRAINT_VIOLATION
    http_status: 409
    applies_to: "POST /review-offices, POST /agencies, POST /alternatives, POST /alternatives/{id}/screen, POST /proposed-actions/{id}/cumulative-actions, POST /proposed-actions/{id}/resource-analyses, POST /documents/{id}/publish, POST /decisions/{id}/objections"

  - priority: 13
    category: business_temporal
    check: "Interval and deadline rules: a new ScopingPeriod must not overlap a same-kind period on the action (half-open, adjacency allowed); a PUBLIC ScopingPeriod must have duration_days >= office.min_scoping_days before it can be closed; a candidate ConsultationRequest must not collide with max_concurrent_consultations or more PENDING intervals on the agency (closed interval plus handoff buffer); comment_period_days at publish must be >= the office minimum for the document_type; the comment period may only be closed at or after comment_period_end_at; an Objection may only be filed inside [objection_window_opens_at, objection_window_closes_at); the record may only be certified at or after objection_window_closes_at"
    error_id: ERR_TEMPORAL_CONFLICT
    http_status: 409
    applies_to: "POST /proposed-actions/{id}/scoping-periods, POST /scoping-periods/{id}/close, POST /consultations, POST /documents/{id}/publish, POST /documents/{id}/close-comment-period, POST /decisions/{id}/objections, POST /decisions/{id}/certify-record"

  - priority: 14
    category: business_fiscal
    check: "office.binding_obligation_cents + decision.binding_obligation_cents must be <= office.max_binding_obligation_cents at signature"
    error_id: ERR_OBLIGATION_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /decisions/{id}/sign"

endpoints:
  # ---- ReviewOffice ----
  - method: POST
    path: "/review-offices"
    description: "Create a review office with its policy thresholds. Omitted policy fields take their §1.1 defaults."
    roles: [PolicyAdmin]
    code: 201
    input: [office_code, name, "ce_threshold_disturbance_hectares?", "ea_threshold_disturbance_hectares?", "min_scoping_days?", "min_ea_comment_days?", "min_eis_comment_days?", "objection_window_days?", "cumulative_radius_km?", "significance_threshold?", "intensity_weight?", "context_weight?", "max_mitigated_reduction_points?", "cost_per_reduction_point_cents?", "monitoring_escalation_factor?", "max_binding_obligation_cents?", "extraordinary_circumstance_codes?", "ec_severity_trigger_threshold?", "min_screened_in_alternatives_ea?", "min_screened_in_alternatives_eis?", "min_alternative_feasibility?"]
    output: ReviewOffice
    side_effects: ["initializes binding_obligation_cents to 0"]
  - method: GET
    path: "/review-offices/{id}"
    description: "Read a review office including its binding_obligation_cents ledger."
    roles: [PolicyAdmin, NepaCoordinator, ReviewingOfficial, DecidingOfficial, ObjectionReviewingOfficer, ResourceSpecialist]
    code: 200
    input: []
    output: ReviewOffice
    side_effects: []
  - method: GET
    path: "/review-offices"
    description: "List review offices, paginated."
    roles: [PolicyAdmin, NepaCoordinator, ReviewingOfficial]
    code: 200
    input: ["limit?", "offset?"]
    output: ReviewOffice[]
    side_effects: []

  # ---- Agency ----
  - method: POST
    path: "/agencies"
    description: "Register a cooperating or consulting agency with its scheduling parameters."
    roles: [PolicyAdmin]
    code: 201
    input: [agency_code, name, agency_role, "max_concurrent_consultations?", "handoff_buffer_days?", "statutory_response_days?", "status?"]
    output: Agency
    side_effects: ["initializes active_consultation_count to 0"]
  - method: GET
    path: "/agencies/{id}"
    description: "Read one agency."
    roles: [PolicyAdmin, NepaCoordinator, AgencyLiaison, ReviewingOfficial]
    code: 200
    input: []
    output: Agency
    side_effects: []
  - method: GET
    path: "/agencies"
    description: "List agencies, optionally filtered by status."
    roles: [PolicyAdmin, NepaCoordinator, AgencyLiaison, ReviewingOfficial]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Agency[]
    side_effects: []

  # ---- ProposedAction ----
  - method: POST
    path: "/proposed-actions"
    description: "Open a review on a proposed federal action. Starts at review_stage INTAKE with classification null."
    roles: [NepaCoordinator]
    code: 201
    input: [office_id, title, disturbance_hectares, reference_cost_cents, "in_critical_habitat?", "affects_historic_property?", "tribal_interest?", "floodplain_or_wetland?"]
    output: ProposedAction
    side_effects: ["sets review_stage := INTAKE; all computed rollups initialized to their §1.1 defaults"]
  - method: GET
    path: "/proposed-actions/{id}"
    description: "Read one proposed action including every derived rollup (counts, max_unmitigated_score, cumulative_intensity_index, record_entry_count)."
    roles: [PolicyAdmin, NepaCoordinator, ResourceSpecialist, ReviewingOfficial, DecidingOfficial, ObjectionReviewingOfficer]
    code: 200
    input: []
    output: ProposedAction
    side_effects: []
  - method: GET
    path: "/proposed-actions"
    description: "List proposed actions, optionally filtered by owning office, classification, or review stage."
    roles: [PolicyAdmin, NepaCoordinator, ResourceSpecialist, ReviewingOfficial, DecidingOfficial]
    code: 200
    input: ["office_id?", "classification?", "review_stage?", "limit?", "offset?"]
    output: ProposedAction[]
    side_effects: []
  - method: POST
    path: "/proposed-actions/{id}/classify"
    description: "Assign the review pathway from the office thresholds and the action's flags per calculations.action_classification."
    roles: [NepaCoordinator]
    code: 200
    input: []
    output: ProposedAction
    side_effects: ["sets classification", "review_stage SCREENED -> CLASSIFIED", "appends AdminRecordEntry CLASSIFICATION_ASSIGNED", "increments record_entry_count", "increments ProposedAction.version by 1"]

  # ---- ExtraordinaryCircumstanceScreen ----
  - method: POST
    path: "/proposed-actions/{id}/ec-screens"
    description: "Submit an extraordinary-circumstances screen for the action. Allowed while review_stage IN {INTAKE, SCREENED, CLASSIFIED, SCOPING, ANALYSIS, DRAFT_PUBLISHED}."
    roles: [NepaCoordinator]
    code: 201
    input: [findings]
    output: ExtraordinaryCircumstanceScreen
    side_effects: ["computes triggered_codes and max_severity", "sets screen_round := 1", "status := SUBMITTED"]
  - method: GET
    path: "/proposed-actions/{id}/ec-screens"
    description: "List the action's extraordinary-circumstances screens in created_at ASC order."
    roles: [NepaCoordinator, ReviewingOfficial, DecidingOfficial]
    code: 200
    input: ["limit?", "offset?"]
    output: ExtraordinaryCircumstanceScreen[]
    side_effects: []
  - method: GET
    path: "/ec-screens/{id}"
    description: "Read one extraordinary-circumstances screen."
    roles: [NepaCoordinator, ReviewingOfficial, DecidingOfficial]
    code: 200
    input: []
    output: ExtraordinaryCircumstanceScreen
    side_effects: []
  - method: POST
    path: "/ec-screens/{id}/adjudicate"
    description: "Adjudicate a SUBMITTED screen as RETURNED, CLEARED or TRIGGERED. TRIGGERED drives the classification-escalation cascade."
    roles: [ReviewingOfficial]
    code: 200
    input: [disposition, adjudicator_note]
    output: ExtraordinaryCircumstanceScreen
    side_effects: ["CLEARED/TRIGGERED set action.ec_screen_outcome and action.extraordinary_circumstance_flag", "review_stage INTAKE -> SCREENED", "TRIGGERED on a CATEGORICAL_EXCLUSION action escalates classification to ENVIRONMENTAL_ASSESSMENT, reverts review_stage to CLASSIFIED, and supersedes the action's DRAFT/PUBLISHED CE_MEMORANDUM documents", "appends AdminRecordEntry rows and increments record_entry_count", "increments ProposedAction.version by 1"]
  - method: POST
    path: "/ec-screens/{id}/resubmit"
    description: "Resubmit a RETURNED screen with revised findings; increments screen_round and returns the screen to SUBMITTED."
    roles: [NepaCoordinator]
    code: 200
    input: [findings]
    output: ExtraordinaryCircumstanceScreen
    side_effects: ["replaces findings", "increments screen_round", "recomputes triggered_codes and max_severity", "clears adjudicator_note"]

  # ---- PurposeNeedStatement ----
  - method: POST
    path: "/proposed-actions/{id}/purpose-need-statements"
    description: "Draft a purpose and need statement whose goal_codes constrain the alternatives range."
    roles: [NepaCoordinator]
    code: 201
    input: [purpose_text, need_text, goal_codes, "constraint_codes?"]
    output: PurposeNeedStatement
    side_effects: ["assigns version_no as one more than the action's highest existing statement version_no", "status := DRAFT"]
  - method: GET
    path: "/proposed-actions/{id}/purpose-need-statements"
    description: "List the action's purpose and need statements in created_at ASC order."
    roles: [NepaCoordinator, ReviewingOfficial, DecidingOfficial]
    code: 200
    input: ["limit?", "offset?"]
    output: PurposeNeedStatement[]
    side_effects: []
  - method: GET
    path: "/purpose-need-statements/{id}"
    description: "Read one purpose and need statement."
    roles: [NepaCoordinator, ReviewingOfficial, DecidingOfficial]
    code: 200
    input: []
    output: PurposeNeedStatement
    side_effects: []
  - method: POST
    path: "/purpose-need-statements/{id}/adopt"
    description: "Adopt a DRAFT statement under optimistic concurrency on the parent action's version."
    roles: [ReviewingOfficial]
    code: 200
    input: [expected_action_version]
    output: PurposeNeedStatement
    side_effects: ["supersedes the action's previously ADOPTED statement", "marks Alternative rows pinned to the superseded statement STALE and decrements action.alternatives_screened_in_count accordingly", "increments ProposedAction.version by 1", "appends AdminRecordEntry PN_ADOPTED", "increments record_entry_count"]

  # ---- ScopingPeriod ----
  - method: POST
    path: "/proposed-actions/{id}/scoping-periods"
    description: "Open a public or agency scoping period over the half-open interval [start_at, end_at). Several periods may be opened on one action; same-kind intervals must not overlap."
    roles: [NepaCoordinator]
    code: 201
    input: [scoping_kind, start_at, end_at]
    output: ScopingPeriod
    side_effects: ["computes duration_days", "status := OPEN", "review_stage CLASSIFIED -> SCOPING; unchanged when already SCOPING"]
  - method: GET
    path: "/proposed-actions/{id}/scoping-periods"
    description: "List the action's scoping periods in created_at ASC order."
    roles: [NepaCoordinator, ReviewingOfficial, ResourceSpecialist]
    code: 200
    input: ["scoping_kind?", "limit?", "offset?"]
    output: ScopingPeriod[]
    side_effects: []
  - method: GET
    path: "/scoping-periods/{id}"
    description: "Read one scoping period."
    roles: [NepaCoordinator, ReviewingOfficial, ResourceSpecialist]
    code: 200
    input: []
    output: ScopingPeriod
    side_effects: []
  - method: POST
    path: "/scoping-periods/{id}/close"
    description: "Close a scoping period. PUBLIC periods require duration_days >= office.min_scoping_days; the action must already have an ADOPTED purpose and need statement."
    roles: [NepaCoordinator]
    code: 200
    input: []
    output: ScopingPeriod
    side_effects: ["status := CLOSED", "review_stage SCOPING -> ANALYSIS", "appends AdminRecordEntry SCOPING_CLOSED", "increments record_entry_count"]

  # ---- Issue ----
  - method: POST
    path: "/proposed-actions/{id}/issues"
    description: "Record a scoping issue. Requires the named scoping period to belong to this action and to have status OPEN."
    roles: [NepaCoordinator]
    code: 201
    input: [scoping_period_id, resource_area, origin, significance, summary]
    output: Issue
    side_effects: ["status := OPEN", "recomputes action.significant_issue_count and action.unaddressed_issue_count"]
  - method: GET
    path: "/proposed-actions/{id}/issues"
    description: "List the action's issues in created_at ASC order."
    roles: [NepaCoordinator, ResourceSpecialist, ReviewingOfficial]
    code: 200
    input: ["resource_area?", "status?", "limit?", "offset?"]
    output: Issue[]
    side_effects: []
  - method: GET
    path: "/issues/{id}"
    description: "Read one issue."
    roles: [NepaCoordinator, ResourceSpecialist, ReviewingOfficial]
    code: 200
    input: []
    output: Issue
    side_effects: []
  - method: GET
    path: "/issues"
    description: "List issues, optionally filtered by action, originating scoping period, or status."
    roles: [NepaCoordinator, ResourceSpecialist, ReviewingOfficial]
    code: 200
    input: ["action_id?", "scoping_period_id?", "status?", "limit?", "offset?"]
    output: Issue[]
    side_effects: []

  # ---- Alternative ----
  - method: POST
    path: "/alternatives"
    description: "Create an alternative. It pins the action's currently ADOPTED purpose and need statement and scores feasibility against it."
    roles: [NepaCoordinator]
    code: 201
    input: [action_id, label, alternative_kind, "goal_alignment_codes?", estimated_cost_cents]
    output: Alternative
    side_effects: ["sets pinned_pn_statement_id to the action's ADOPTED statement", "computes feasibility_score", "screening_status := PROPOSED"]
  - method: GET
    path: "/alternatives/{id}"
    description: "Read one alternative."
    roles: [NepaCoordinator, ReviewingOfficial, DecidingOfficial]
    code: 200
    input: []
    output: Alternative
    side_effects: []
  - method: GET
    path: "/alternatives"
    description: "List alternatives, optionally filtered by action, pinned purpose and need statement, or screening status."
    roles: [NepaCoordinator, ReviewingOfficial, DecidingOfficial]
    code: 200
    input: ["action_id?", "pinned_pn_statement_id?", "screening_status?", "limit?", "offset?"]
    output: Alternative[]
    side_effects: []
  - method: POST
    path: "/alternatives/{id}/screen"
    description: "Screen a PROPOSED alternative in or out. SCREENED_IN requires feasibility_score >= office.min_alternative_feasibility unless alternative_kind == NO_ACTION."
    roles: [ReviewingOfficial]
    code: 200
    input: [decision]
    output: Alternative
    side_effects: ["screening_status := SCREENED_IN or SCREENED_OUT", "recomputes action.alternatives_screened_in_count"]

  # ---- ResourceAnalysis / CumulativeAction ----
  - method: POST
    path: "/proposed-actions/{id}/cumulative-actions"
    description: "Add a past, present or reasonably foreseeable action to the cumulative baseline for one resource area."
    roles: [ResourceSpecialist]
    code: 201
    input: [resource_area, label, intensity_contribution, footprint_hectares, distance_km, temporal_scope]
    output: CumulativeAction
    side_effects: ["sets inclusion_status per calculations.cumulative_action_inclusion"]
  - method: GET
    path: "/proposed-actions/{id}/cumulative-actions"
    description: "List the action's cumulative baseline entries in created_at ASC order."
    roles: [ResourceSpecialist, NepaCoordinator, ReviewingOfficial]
    code: 200
    input: ["resource_area?", "inclusion_status?", "limit?", "offset?"]
    output: CumulativeAction[]
    side_effects: []
  - method: POST
    path: "/proposed-actions/{id}/resource-analyses"
    description: "Open a DRAFT resource analysis for one resource area. At most one analysis per action per resource area."
    roles: [ResourceSpecialist]
    code: 201
    input: [resource_area, intensity_score, context_sensitivity_score, affected_area_hectares, "mitigation_reduction_points?"]
    output: ResourceAnalysis
    side_effects: ["status := DRAFT; scores remain null until finalize"]
  - method: GET
    path: "/proposed-actions/{id}/resource-analyses"
    description: "List the action's resource analyses in created_at ASC order."
    roles: [ResourceSpecialist, NepaCoordinator, ReviewingOfficial, DecidingOfficial]
    code: 200
    input: ["resource_area?", "status?", "limit?", "offset?"]
    output: ResourceAnalysis[]
    side_effects: []
  - method: GET
    path: "/resource-analyses/{id}"
    description: "Read one resource analysis including both score variants."
    roles: [ResourceSpecialist, NepaCoordinator, ReviewingOfficial, DecidingOfficial]
    code: 200
    input: []
    output: ResourceAnalysis
    side_effects: []
  - method: POST
    path: "/resource-analyses/{id}/finalize"
    description: "Finalize a DRAFT analysis on the UNMITIGATED or MITIGATED significance basis."
    roles: [ResourceSpecialist]
    code: 200
    input: [basis]
    output: ResourceAnalysis
    side_effects: ["recomputes cumulative_effect_score, unmitigated_score, mitigated_score", "sets variant_applied, significance_score, significance_determination", "status := FINAL", "moves matching OPEN Issue rows to ANALYZED", "recomputes action.finalized_analysis_count, max_unmitigated_score, cumulative_intensity_index, unaddressed_issue_count", "appends AdminRecordEntry ANALYSIS_FINALIZED", "increments record_entry_count"]
  - method: POST
    path: "/resource-analyses/{id}/reopen"
    description: "Return a FINAL analysis to DRAFT. Blocked once any document of the action is PUBLISHED or FINAL, or any decision is SIGNED."
    roles: [ResourceSpecialist]
    code: 200
    input: []
    output: ResourceAnalysis
    side_effects: ["clears significance_score, significance_determination, variant_applied", "status := DRAFT", "moves matching ANALYZED Issue rows back to OPEN", "recomputes the same four action rollups", "appends AdminRecordEntry ANALYSIS_REOPENED", "increments record_entry_count"]

  # ---- ConsultationRequest ----
  - method: POST
    path: "/consultations"
    description: "Open a consultation with a cooperating or consulting agency. Computes statutory_due_at and is_required, and enforces the agency's buffered interval capacity."
    roles: [NepaCoordinator]
    code: 201
    input: [action_id, agency_id, consultation_type, requested_start_at]
    output: ConsultationRequest
    side_effects: ["computes statutory_due_at and is_required", "status := PENDING", "increments agency.active_consultation_count"]
  - method: GET
    path: "/consultations/{id}"
    description: "Read one consultation request."
    roles: [NepaCoordinator, AgencyLiaison, ReviewingOfficial, DecidingOfficial]
    code: 200
    input: []
    output: ConsultationRequest
    side_effects: []
  - method: GET
    path: "/consultations"
    description: "List consultation requests, optionally filtered by action, agency, or status."
    roles: [NepaCoordinator, AgencyLiaison, ReviewingOfficial, DecidingOfficial]
    code: 200
    input: ["action_id?", "agency_id?", "status?", "limit?", "offset?"]
    output: ConsultationRequest[]
    side_effects: []
  - method: POST
    path: "/consultations/{id}/respond"
    description: "Record a consultation outcome. CONCURRED, CONDITIONAL_CONCURRENCE and NOT_CONCURRED are AgencyLiaison-only and require X-User-ID to equal the consultation's agency_id; WITHDRAWN is NepaCoordinator-only."
    roles: [AgencyLiaison, NepaCoordinator]
    code: 200
    input: [outcome, "conditions_text?"]
    output: ConsultationRequest
    side_effects: ["sets responded_at and late", "sets conditions_text for CONDITIONAL_CONCURRENCE", "decrements agency.active_consultation_count", "frees the agency interval for overlap purposes"]

  # ---- NepaDocument ----
  - method: POST
    path: "/proposed-actions/{id}/documents"
    description: "Create a DRAFT NEPA document whose document_type must match the action's classification."
    roles: [NepaCoordinator]
    code: 201
    input: [document_type, title]
    output: NepaDocument
    side_effects: ["publication_status := DRAFT and comment_status := NOT_OPEN"]
  - method: GET
    path: "/proposed-actions/{id}/documents"
    description: "List the action's NEPA documents in created_at ASC order."
    roles: [NepaCoordinator, ReviewingOfficial, DecidingOfficial, ResourceSpecialist]
    code: 200
    input: ["document_type?", "publication_status?", "limit?", "offset?"]
    output: NepaDocument[]
    side_effects: []
  - method: GET
    path: "/documents/{id}"
    description: "Read one NEPA document including both state dimensions and the comment counters."
    roles: [NepaCoordinator, ReviewingOfficial, DecidingOfficial, ResourceSpecialist, PublicCommenter]
    code: 200
    input: []
    output: NepaDocument
    side_effects: []
  - method: POST
    path: "/documents/{id}/publish"
    description: "Publish a DRAFT document and open its comment period until comment_period_end_at."
    roles: [NepaCoordinator]
    code: 200
    input: [comment_period_end_at]
    output: NepaDocument
    side_effects: ["publication_status := PUBLISHED and comment_status := OPEN", "sets comment_period_start_at and comment_period_days", "review_stage ANALYSIS -> DRAFT_PUBLISHED", "appends AdminRecordEntry DOCUMENT_PUBLISHED", "increments record_entry_count"]
  - method: POST
    path: "/documents/{id}/close-comment-period"
    description: "Close the comment period at or after comment_period_end_at. Only the comment dimension changes; publication_status stays PUBLISHED."
    roles: [NepaCoordinator]
    code: 200
    input: []
    output: NepaDocument
    side_effects: ["comment_status := CLOSED", "review_stage DRAFT_PUBLISHED -> COMMENT_CLOSED", "appends AdminRecordEntry COMMENT_PERIOD_CLOSED", "increments record_entry_count"]
  - method: POST
    path: "/documents/{id}/finalize"
    description: "Move a PUBLISHED document with a CLOSED comment period and zero unresolved substantive comments to publication_status FINAL."
    roles: [NepaCoordinator]
    code: 200
    input: []
    output: NepaDocument
    side_effects: ["publication_status := FINAL", "appends AdminRecordEntry DOCUMENT_FINALIZED", "increments record_entry_count"]

  # ---- PublicComment ----
  - method: POST
    path: "/comments"
    description: "Submit a public comment on a document whose comment_status is OPEN."
    roles: [PublicCommenter]
    code: 201
    input: [document_id, "assigned_issue_id?", commenter_name, resource_area, "is_substantive?", body]
    output: PublicComment
    side_effects: ["disposition := RECEIVED", "recomputes the document's substantive counters and response_completeness_pct"]
  - method: GET
    path: "/comments/{id}"
    description: "Read one public comment."
    roles: [NepaCoordinator, ReviewingOfficial, PublicCommenter]
    code: 200
    input: []
    output: PublicComment
    side_effects: []
  - method: GET
    path: "/comments"
    description: "List public comments, optionally filtered by document, assigned issue, or disposition."
    roles: [NepaCoordinator, ReviewingOfficial, PublicCommenter]
    code: 200
    input: ["document_id?", "assigned_issue_id?", "disposition?", "limit?", "offset?"]
    output: PublicComment[]
    side_effects: []
  - method: POST
    path: "/comments/{id}/respond"
    description: "Prepare the response-to-comments entry for a RECEIVED comment after the comment period has closed. response_category OUT_OF_SCOPE dispositions the comment as DUPLICATE and drops it from the substantive counters."
    roles: [NepaCoordinator]
    code: 200
    input: [response_text, response_category]
    output: PublicComment
    side_effects: ["sets response_text and response_category", "disposition := RESPONDED or DUPLICATE", "recomputes the document's substantive counters and response_completeness_pct"]

  # ---- DecisionDocument / MitigationCommitment ----
  - method: POST
    path: "/decisions"
    description: "Draft a decision document selecting a SCREENED_IN alternative. decision_type must match the action's classification."
    roles: [NepaCoordinator]
    code: 201
    input: [action_id, selected_alternative_id, decision_type]
    output: DecisionDocument
    side_effects: ["sets prepared_by_user_id from X-User-ID", "status := DRAFT"]
  - method: GET
    path: "/decisions/{id}"
    description: "Read one decision document including its obligation and credit fields and the objection window."
    roles: [NepaCoordinator, ReviewingOfficial, DecidingOfficial, ObjectionReviewingOfficer, PublicCommenter]
    code: 200
    input: []
    output: DecisionDocument
    side_effects: []
  - method: GET
    path: "/decisions"
    description: "List decision documents, optionally filtered by action, selected alternative, or status."
    roles: [NepaCoordinator, ReviewingOfficial, DecidingOfficial, ObjectionReviewingOfficer]
    code: 200
    input: ["action_id?", "selected_alternative_id?", "status?", "limit?", "offset?"]
    output: DecisionDocument[]
    side_effects: []
  - method: POST
    path: "/decisions/{id}/mitigations"
    description: "Attach a proposed mitigation commitment to a DRAFT decision under optimistic concurrency on the decision's version."
    roles: [NepaCoordinator]
    code: 201
    input: [source_analysis_id, measure_text, cost_estimate_cents, "monitoring_years?", "annual_monitoring_cost_cents?", "reduction_points?", expected_decision_version]
    output: MitigationCommitment
    side_effects: ["computes lifecycle_obligation_cents", "status := PROPOSED and monitoring_status := NOT_REQUIRED", "increments DecisionDocument.version by 1"]
  - method: GET
    path: "/mitigations/{id}"
    description: "Read one mitigation commitment."
    roles: [NepaCoordinator, ReviewingOfficial, DecidingOfficial]
    code: 200
    input: []
    output: MitigationCommitment
    side_effects: []
  - method: GET
    path: "/mitigations"
    description: "List mitigation commitments, optionally filtered by decision, source analysis, or monitoring status."
    roles: [NepaCoordinator, ReviewingOfficial, DecidingOfficial]
    code: 200
    input: ["decision_id?", "source_analysis_id?", "monitoring_status?", "limit?", "offset?"]
    output: MitigationCommitment[]
    side_effects: []
  - method: POST
    path: "/decisions/{id}/sign"
    description: "Sign a DRAFT decision. The signer's X-User-ID must differ from prepared_by_user_id."
    roles: [DecidingOfficial]
    code: 200
    input: []
    output: DecisionDocument
    side_effects: ["PROPOSED commitments become BINDING with monitoring_status SCHEDULED or NOT_REQUIRED", "computes committed_obligation_cents, base_obligation_cents, credit_points, contingency_fee_cents, binding_obligation_cents, mitigated_max_score in that pinned order", "credits office.binding_obligation_cents", "sets signed_by_user_id, signed_at, objection_window_opens_at, objection_window_closes_at", "status := SIGNED", "review_stage COMMENT_CLOSED -> DECIDED", "appends AdminRecordEntry DECISION_SIGNED", "increments record_entry_count"]
  - method: POST
    path: "/decisions/{id}/certify-record"
    description: "Certify the litigation record for a SIGNED decision once the objection window has closed and no objection remains FILED."
    roles: [ReviewingOfficial]
    code: 200
    input: []
    output: ProposedAction
    side_effects: ["sets action.record_certified_at", "review_stage DECIDED -> RECORD_CERTIFIED", "appends AdminRecordEntry RECORD_CERTIFIED", "increments record_entry_count"]

  # ---- Objection ----
  - method: POST
    path: "/decisions/{id}/objections"
    description: "File an administrative objection inside the decision's objection window. standing_basis NONE is rejected."
    roles: [PublicCommenter, AgencyLiaison]
    code: 201
    input: [objector_name, objector_type, basis_issue_area, standing_basis]
    output: Objection
    side_effects: ["status := FILED", "recomputes decision.objection_count", "appends AdminRecordEntry OBJECTION_FILED", "increments record_entry_count"]
  - method: GET
    path: "/decisions/{id}/objections"
    description: "List the decision's objections in created_at ASC order."
    roles: [NepaCoordinator, ReviewingOfficial, DecidingOfficial, ObjectionReviewingOfficer, PublicCommenter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Objection[]
    side_effects: []
  - method: GET
    path: "/objections/{id}"
    description: "Read one objection."
    roles: [NepaCoordinator, ReviewingOfficial, ObjectionReviewingOfficer, PublicCommenter]
    code: 200
    input: []
    output: Objection
    side_effects: []
  - method: POST
    path: "/objections/{id}/resolve"
    description: "Resolve a FILED objection as DENIED or REMANDED. The resolver's X-User-ID must differ from the decision's signed_by_user_id. REMANDED vacates the decision and triggers the release/ledger/document cascade."
    roles: [ObjectionReviewingOfficer]
    code: 200
    input: [disposition, resolution_note]
    output: Objection
    side_effects: ["status := DENIED or REMANDED", "REMANDED sets decision.status := VACATED, releases BINDING commitments, debits office.binding_obligation_cents, reverts the FINAL document to DRAFT and review_stage DECIDED -> COMMENT_CLOSED", "appends AdminRecordEntry rows OBJECTION_RESOLVED and, on remand, DECISION_VACATED", "increments record_entry_count"]

  # ---- Administrative record ----
  - method: GET
    path: "/proposed-actions/{id}/record-entries"
    description: "List the action's append-only administrative record entries in sequence_no ASC order."
    roles: [NepaCoordinator, ReviewingOfficial, DecidingOfficial, ObjectionReviewingOfficer, PublicCommenter]
    code: 200
    input: ["entry_code?", "limit?", "offset?"]
    output: AdminRecordEntry[]
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (the server startup default); it never falls back to real wall-clock time."
    roles: [PolicyAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["all subsequent deadline, window and duration evaluations use the new logical time"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not a declared role"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed in the target endpoint's roles"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown field, wrong type, invalid enum member, or an §1.1 range/array constraint violated"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path id does not resolve to an existing row"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "A foreign-key id in the request body does not resolve to an existing row"
  - id: ERR_AGENCY_SCOPE_VIOLATION
    http: 403
    condition: "An AgencyLiaison acts on a ConsultationRequest whose agency_id differs from the caller's X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The signer equals decision.prepared_by_user_id, or the objection resolver equals decision.signed_by_user_id"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target row, or a row named in the transition's preconditions, is not in a state that permits the requested transition"
  - id: ERR_STALE_ACTION_VERSION
    http: 412
    condition: "expected_action_version does not equal the ProposedAction's current version on adopt"
  - id: ERR_STALE_DECISION_VERSION
    http: 412
    condition: "expected_decision_version does not equal the DecisionDocument's current version on mitigation creation"
  - id: ERR_REQUIRED_CONSULTATION_INCOMPLETE
    http: 409
    condition: "At publish, a required consultation_type has no CONCURRED or CONDITIONAL_CONCURRENCE ConsultationRequest, or action.unaddressed_issue_count > 0"
  - id: ERR_REFERENCE_MISMATCH
    http: 409
    condition: "document_type or decision_type does not match the action's classification, or a referenced row belongs to a different action or is in a disallowed state"
  - id: ERR_CONSTRAINT_VIOLATION
    http: 409
    condition: "A uniqueness constraint is violated, or a non-NO_ACTION alternative below office.min_alternative_feasibility is screened in, or the SCREENED_IN count is below the office minimum for the document type, or standing_basis is NONE"
  - id: ERR_TEMPORAL_CONFLICT
    http: 409
    condition: "A scoping interval overlaps a same-kind period, a scoping period is too short, a comment period is shorter than the office minimum, a comment period is closed early, an objection is filed outside its window, or the record is certified before the window closes"
  - id: ERR_AGENCY_CAPACITY_EXCEEDED
    http: 409
    condition: "The candidate consultation's buffered interval collides with max_concurrent_consultations or more PENDING intervals on the same agency"
  - id: ERR_AGENCY_SUSPENDED
    http: 409
    condition: "A consultation is opened against an Agency whose status is SUSPENDED"
  - id: ERR_ALTERNATIVE_NOT_FEASIBLE
    http: 409
    condition: "A non-NO_ACTION alternative with feasibility_score below office.min_alternative_feasibility is screened in"
  - id: ERR_ALTERNATIVE_STALE
    http: 409
    condition: "An alternative whose pinned purpose and need statement has been superseded is screened or selected"
  - id: ERR_NO_ADOPTED_PURPOSE_NEED
    http: 409
    condition: "An alternative is created, or a scoping period closed, while the action has no ADOPTED PurposeNeedStatement"
  - id: ERR_SCOPING_PERIOD_TOO_SHORT
    http: 409
    condition: "A PUBLIC scoping period with duration_days below office.min_scoping_days is closed"
  - id: ERR_SCOPING_PERIOD_OVERLAP
    http: 409
    condition: "A new scoping period's half-open interval overlaps an existing same-kind period on the same action"
  - id: ERR_COMMENT_PERIOD_TOO_SHORT
    http: 409
    condition: "comment_period_days at publish is below the office minimum for the document_type"
  - id: ERR_COMMENT_PERIOD_NOT_OPEN
    http: 409
    condition: "A comment is submitted against a document whose comment_status is not OPEN"
  - id: ERR_COMMENT_PERIOD_NOT_ENDED
    http: 409
    condition: "close-comment-period is called before comment_period_end_at"
  - id: ERR_UNRESOLVED_COMMENTS
    http: 409
    condition: "finalize is called while document.unresolved_substantive_count > 0"
  - id: ERR_INSUFFICIENT_ALTERNATIVES
    http: 409
    condition: "At publish, action.alternatives_screened_in_count is below the office minimum for the document_type"
  - id: ERR_UNADDRESSED_ISSUES
    http: 409
    condition: "At publish, action.unaddressed_issue_count is greater than zero"
  - id: ERR_ANALYSIS_LOCKED
    http: 409
    condition: "reopen is called while a document of the action is PUBLISHED or FINAL, or a decision of the action is SIGNED"
  - id: ERR_MITIGATION_BASIS_REQUIRED
    http: 409
    condition: "finalize is called with basis MITIGATED while mitigation_reduction_points is 0"
  - id: ERR_MITIGATED_FONSI_WITHOUT_COMMITMENT
    http: 409
    condition: "A MITIGATED_FONSI decision is signed with no BINDING mitigation commitment"
  - id: ERR_FINAL_DOCUMENT_REQUIRED
    http: 409
    condition: "A non-CE_DETERMINATION decision is signed while the action has no FINAL NepaDocument"
  - id: ERR_OBLIGATION_CAP_EXCEEDED
    http: 409
    condition: "Signing would push office.binding_obligation_cents above office.max_binding_obligation_cents"
  - id: ERR_OBJECTION_WINDOW_CLOSED
    http: 409
    condition: "An objection is filed outside [objection_window_opens_at, objection_window_closes_at)"
  - id: ERR_OBJECTION_STANDING_MISSING
    http: 409
    condition: "An objection is filed with standing_basis NONE"
  - id: ERR_RECORD_ALREADY_CERTIFIED
    http: 409
    condition: "A decision is vacated, or the record re-certified, after action.record_certified_at is set"
  - id: ERR_OBJECTIONS_PENDING
    http: 409
    condition: "certify-record is called while an Objection on the decision still has status FILED"
  - id: ERR_EC_SCREEN_NOT_TRIGGERED
    http: 409
    condition: "adjudicate is called with disposition TRIGGERED while triggered_codes is empty, or with CLEARED while triggered_codes is non-empty"
  - id: ERR_DUPLICATE_RESOURCE_ANALYSIS
    http: 409
    condition: "A second ResourceAnalysis is created for the same action and resource_area"

roles:
  - name: PolicyAdmin
    description: "Configures review offices, agencies and the logical clock; performs no case work"
    identity: "opaque"
    exclusive_operations:
      - "POST /review-offices"
      - "POST /agencies"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /review-offices/{id}"
      - "GET /review-offices"
      - "GET /agencies/{id}"
      - "GET /agencies"
      - "GET /proposed-actions/{id}"
      - "GET /proposed-actions"

  - name: NepaCoordinator
    description: "Prepares the review: opens actions, screens, statements, scoping, alternatives, consultations, documents, responses and decision drafts. Cannot adjudicate screens, adopt statements, screen alternatives, sign decisions or resolve objections."
    identity: "opaque"
    exclusive_operations:
      - "POST /proposed-actions"
      - "POST /proposed-actions/{id}/ec-screens"
      - "POST /ec-screens/{id}/resubmit"
      - "POST /proposed-actions/{id}/classify"
      - "POST /proposed-actions/{id}/purpose-need-statements"
      - "POST /proposed-actions/{id}/scoping-periods"
      - "POST /scoping-periods/{id}/close"
      - "POST /proposed-actions/{id}/issues"
      - "POST /alternatives"
      - "POST /consultations"
      - "POST /proposed-actions/{id}/documents"
      - "POST /documents/{id}/publish"
      - "POST /documents/{id}/close-comment-period"
      - "POST /documents/{id}/finalize"
      - "POST /comments/{id}/respond"
      - "POST /decisions"
      - "POST /decisions/{id}/mitigations"
    shared_operations:
      - "POST /consultations/{id}/respond"
      - "GET /proposed-actions/{id}"
      - "GET /decisions/{id}"
      - "GET /proposed-actions/{id}/record-entries"

  - name: ResourceSpecialist
    description: "Builds the cumulative baseline and the resource-effects analyses; finalizes and reopens them. Owns no document, decision or objection operation."
    identity: "opaque"
    exclusive_operations:
      - "POST /proposed-actions/{id}/cumulative-actions"
      - "POST /proposed-actions/{id}/resource-analyses"
      - "POST /resource-analyses/{id}/finalize"
      - "POST /resource-analyses/{id}/reopen"
    shared_operations:
      - "GET /proposed-actions/{id}"
      - "GET /proposed-actions/{id}/resource-analyses"
      - "GET /proposed-actions/{id}/cumulative-actions"
      - "GET /proposed-actions/{id}/issues"

  - name: ReviewingOfficial
    description: "Independent reviewer: adjudicates extraordinary-circumstances screens, adopts purpose and need statements, screens alternatives, and certifies the litigation record. Cannot author the artifacts it reviews."
    identity: "opaque"
    exclusive_operations:
      - "POST /ec-screens/{id}/adjudicate"
      - "POST /purpose-need-statements/{id}/adopt"
      - "POST /alternatives/{id}/screen"
      - "POST /decisions/{id}/certify-record"
    shared_operations:
      - "GET /proposed-actions/{id}"
      - "GET /decisions/{id}"
      - "GET /proposed-actions/{id}/record-entries"

  - name: AgencyLiaison
    description: "Acts on behalf of one cooperating or consulting Agency; X-User-ID is that Agency's id. Responds to its own consultations and may object on behalf of the agency."
    identity: "entity_backed:Agency"
    exclusive_operations: []
    shared_operations:
      - "POST /consultations/{id}/respond"
      - "POST /decisions/{id}/objections"
      - "GET /consultations/{id}"
      - "GET /consultations"
      - "GET /agencies/{id}"

  - name: DecidingOfficial
    description: "Signs decision documents. Segregation of duties: cannot sign a decision it prepared (X-User-ID must differ from prepared_by_user_id)."
    identity: "opaque"
    exclusive_operations:
      - "POST /decisions/{id}/sign"
    shared_operations:
      - "GET /decisions/{id}"
      - "GET /decisions"
      - "GET /proposed-actions/{id}"
      - "GET /proposed-actions/{id}/record-entries"

  - name: ObjectionReviewingOfficer
    description: "Resolves administrative objections. Segregation of duties: cannot resolve an objection against a decision it signed (X-User-ID must differ from signed_by_user_id)."
    identity: "opaque"
    exclusive_operations:
      - "POST /objections/{id}/resolve"
    shared_operations:
      - "GET /objections/{id}"
      - "GET /decisions/{id}/objections"
      - "GET /decisions/{id}"
      - "GET /proposed-actions/{id}/record-entries"

  - name: PublicCommenter
    description: "Member of the public: submits comments during an OPEN comment period and may file objections when it commented substantively."
    identity: "opaque"
    exclusive_operations:
      - "POST /comments"
    shared_operations:
      - "POST /decisions/{id}/objections"
      - "GET /documents/{id}"
      - "GET /comments/{id}"
      - "GET /comments"
      - "GET /decisions/{id}"
      - "GET /proposed-actions/{id}/record-entries"

