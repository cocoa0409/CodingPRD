              payload: { full_name: "Sub V1", email: "v1@x.com", residence_address: "1 V St", phone: "562-1" }
              as: PlatformAdmin
              captures: { sub_v1: $.data.id }
            - call: "POST /pers/contracts"
              payload: { subscriber_id: "${sub_v1}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { ctr_v1: $.data.id }
            - call: "POST /pers/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pers/devices"
