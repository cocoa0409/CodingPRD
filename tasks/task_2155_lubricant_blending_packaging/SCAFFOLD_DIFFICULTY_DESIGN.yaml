  - rule_id: resource_temporal_overlap
    instances:

      - name: tank_half_open_adjacency_versus_changeover_buffer
        grounds:
          - calculations.tank_window_occupancy
          - errors[ERR_TANK_WINDOW_CONFLICT]
          - entities.BlendTank.fields.heel_additive_family
          - state_machines.BlendBatch.PLANNED_to_CHARGING
        distinguishing_aspect: |
          BlendTank uses HALF-OPEN, exclusive intervals widened on the left by a 120-minute
          changeover buffer only when the chemistry differs: the same [12:00, 16:00) window is
          accepted for a ZDDP_PCMO batch touching the previous [08:00, 12:00) occupancy and
          rejected for a LOW_SAPS batch, whose effective start is pulled back to 10:00.
