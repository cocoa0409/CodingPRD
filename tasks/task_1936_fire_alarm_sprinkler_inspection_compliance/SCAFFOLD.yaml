    input: [legal_name, state_license_no]
    output: Contractor
    side_effects: ["compliance_score = 1000; posture = GOOD_STANDING"]
  - method: GET
    path: "/fire-compliance/contractors/{id}"
    description: "Fetch one contractor"
    roles: [FireMarshal, ContractorAdmin, Technician]
    code: 200
    input: []
    output: Contractor
    side_effects: []
  - method: GET
    path: "/fire-compliance/contractors"
