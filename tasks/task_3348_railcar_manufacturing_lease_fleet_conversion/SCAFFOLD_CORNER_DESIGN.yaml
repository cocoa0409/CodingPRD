  - name: derived_component_reserved_qty_rederived_not_patched_by_receipt
    claim_type: derived_field_reconciliation
    grounds:
    - calculations.component_allocation
    - entities.Component.fields.reserved_qty
    - entities.Component.fields.on_hand_qty
    - POST /api/v1/component-receipts/{id}/receive
    distinguishing_aspect: 'Component.reserved_qty is re-derived from the released-order reservation term
      rather than incrementally patched: it reads 0 at creation, 6 once the 3-car order is released, and
      is still exactly 6 after a later receipt lifts on_hand_qty from 0 to 10 — the authoritative on-hand
      side moves while the reservation side does not.'
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - Car type CT-DF-1 (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family LINE-DF)
        carries one COATING bill-of-material row CO-DF-1 at qty_per_car 2; the coating class is exempt
        from the reserve-time on-hand test but must be covered by a confirmed purchase order at release.
      - A first purchase order of 6 units is confirmed, receipted and received, so on_hand_qty is 6 before
        the order is reserved; a second purchase order of 10 units stands CONFIRMED and unreceived.
      - The 3-car order reserves 2 * 3 == 6 coating units, draining on_hand_qty to 0, and is then released,
        which is what makes the reservation term visible.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/car-types
        payload:
          model_code: CT-DF-1
          car_class: BOXCAR
          build_hours: 1
          regulatory_life_years: 25
          line_count_family: LINE-DF
        as: ProductionPlanner
        captures:
          ct_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: CO-DF-1
          component_class: COATING
          unit_cost_cents: 1000
          lead_time_days: 5
        as: SupplyChainCoordinator
        captures:
          co_id: $.data.id
          oh_at_create: $.data.on_hand_qty
          res_at_create: $.data.reserved_qty
      - call: POST /api/v1/component-purchase-orders
        payload:
          component_id: ${co_id}
          qty_ordered: 6
          unit_cost_cents: 1000
          order_date: '2026-09-01'
          expected_receipt_date: '2026-09-06'
        as: SupplyChainCoordinator
        captures:
          po1_id: $.data.id
      - call: POST /api/v1/component-purchase-orders/${po1_id}/confirm
        payload: {}
        as: SupplyChainCoordinator
      - call: POST /api/v1/component-receipts
        payload:
          component_purchase_order_id: ${po1_id}
          component_id: ${co_id}
          qty_received: 6
          receipt_date: '2026-09-06'
        as: SupplyChainCoordinator
        captures:
          rc1_id: $.data.id
      - call: POST /api/v1/component-receipts/${rc1_id}/receive
        payload: {}
        as: SupplyChainCoordinator
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_id}
          component_id: ${co_id}
          qty_per_car: 2
        as: ProductionPlanner
      - call: POST /api/v1/component-purchase-orders
        payload:
          component_id: ${co_id}
          qty_ordered: 10
          unit_cost_cents: 1000
          order_date: '2026-09-01'
          expected_receipt_date: '2026-09-06'
        as: SupplyChainCoordinator
        captures:
          po2_id: $.data.id
      - call: POST /api/v1/component-purchase-orders/${po2_id}/confirm
        payload: {}
        as: SupplyChainCoordinator
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${ct_id}
          quantity: 3
          planned_shop_days: 3
          disposition: RETAINED
          priority_rank: 1
          order_date: '2026-09-01'
          required_delivery_date: '2026-10-01'
        as: ProductionPlanner
        captures:
          po_id: $.data.id
      - call: POST /api/v1/production-orders/${po_id}/reserve-components
        payload: {}
        as: ProductionPlanner
      - call: GET /api/v1/components/${co_id}
        payload: {}
        as: SupplyChainCoordinator
        captures:
          oh_after_reserve: $.data.on_hand_qty
          res_after_reserve: $.data.reserved_qty
      - call: POST /api/v1/production-orders/${po_id}/release
        payload: {}
        as: ProductionPlanner
      - call: GET /api/v1/components/${co_id}
        payload: {}
        as: SupplyChainCoordinator
        captures:
          res_after_release: $.data.reserved_qty
          oh_after_release: $.data.on_hand_qty
      trigger:
      - call: POST /api/v1/component-receipts
        payload:
          component_purchase_order_id: ${po2_id}
          component_id: ${co_id}
          qty_received: 10
          receipt_date: '2026-09-06'
        as: SupplyChainCoordinator
        captures:
          rc2_id: $.data.id
      - call: GET /api/v1/components/${co_id}
        payload: {}
        as: SupplyChainCoordinator
        captures:
          oh_after_booking2: $.data.on_hand_qty
          res_after_booking2: $.data.reserved_qty
      - call: POST /api/v1/component-receipts/${rc2_id}/receive
        payload: {}
        as: SupplyChainCoordinator
      - call: GET /api/v1/component-purchase-orders/${po2_id}
        payload: {}
        as: SupplyChainCoordinator
        captures:
          po2_status: $.data.status
      - call: GET /api/v1/components/${co_id}
        payload: {}
        as: SupplyChainCoordinator
        captures:
          oh_final: $.data.on_hand_qty
          res_final: $.data.reserved_qty
      assert:
      - 'At creation the derived pair is zeroed: data.on_hand_qty == ${oh_at_create} == 0 and data.reserved_qty
        == ${res_at_create} == 0'
      - 'Reservation drains the stock but has not yet earned a reservation term: data.on_hand_qty == ${oh_after_reserve}
        == 0 and data.reserved_qty == ${res_after_reserve} == 0, because the reservation term counts only
        RELEASED orders'
      - 'Release makes the term visible: data.reserved_qty == ${res_after_release} == 6 == 2 * 3 with
        data.on_hand_qty == ${oh_after_release} == 0'
      - 'Booking the second receipt moves nothing on either side: data.on_hand_qty == ${oh_after_booking2}
        == 0 and data.reserved_qty == ${res_after_booking2} == 6'
      - 'The receipt landing moves only the authoritative on-hand side: the parent purchase order reads
        data.status == ${po2_status} == "RECEIVED" and the component reads data.on_hand_qty == ${oh_final}
        == 10'
      - 'The reservation term is re-derived from the released-order set, not decremented by the receipt:
        data.reserved_qty == ${res_final} == 6, unchanged from ${res_after_release}'
  - name: derived_lease_fleet_car_retrofit_required_across_program_lifecycle
    claim_type: derived_field_reconciliation
    grounds:
    - entities.LeaseFleetCar.fields.retrofit_required
    - POST /api/v1/retrofit-programs/{id}/start
    - POST /api/v1/retrofit-programs/{id}/void
    - state_machines.RetrofitProgram.PLANNED_to_IN_PROGRESS
    distinguishing_aspect: LeaseFleetCar.retrofit_required is false on the freshly built car, flips true
      the moment the covering mandate starts, and flips back to false when the mandate is voided — the
      field tracks the program's live state rather than latching.
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - Car type CT-DF2-1 (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family LINE-DF2)
        carries one COATING bill-of-material row CO-DF2-1 at qty_per_car 1, covered by a CONFIRMED purchase
