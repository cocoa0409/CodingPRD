scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: quote_total_contract_vs_spot_diverges_on_same_lane
        grounds:
          - calculations.quote_total_at_request
          - entities.QuoteRequest.fields.rate_mode
          - entities.QuoteRequest.fields.quoted_total_cents
          - state_machines.ContractRate.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Two QuoteRequest rows on the same lane, same shipper, same distance,
          same equipment differ only in whether an ACTIVE ContractRate exists at
          quote-create time. CONTRACT variant uses contract rates (250 c/mi
          linehaul + 60 c/mi fuel × 400 mi = 124000 cents); SPOT variant after
          the contract is TERMINATED uses tier2 (235 c/mi) + fuel (65 c/mi) + 0%
          DRY_VAN uplift × 400 mi = 120000 cents. The same scenario inputs yield
          a 4000-cent delta — dual-variant on the QuoteRequest entity domain.
        test_recipe:
          setup:
            - "Clock pinned to 2026-06-01T00:00:00Z."
            - "Shipper s1 ACTIVE with credit_limit_cents=10000000."
            - "ContractRate cr1 ACTIVE for s1 on lane 10001->30303 with rate_per_mile_cents=250 and fuel_surcharge_per_mile_cents=60."
            - "Carrier c1 QUALIFIED with smartway_tier=NONE."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BrokerOps
            - call: "POST /freight/shippers"
              payload: { legal_name: "Acme Shippers Inc", billing_email: "ap@acme.test", credit_limit_cents: 10000000 }
              as: BrokerOps
              captures: { s1_id: $.data.id }
            - call: "POST /freight/contract-rates"
              payload:
                shipper_id: "${s1_id}"
                lane_origin: "10001"
                lane_destination: "30303"
                rate_per_mile_cents: 250
                fuel_surcharge_per_mile_cents: 60
                detention_free_minutes: 120
                detention_rate_per_hour_cents: 7500
                effective_from_utc: "2026-01-01T00:00:00Z"
                effective_until_utc: "2027-01-01T00:00:00Z"
              as: BrokerOps
              captures: { cr1_id: $.data.id, cr1_v: $.data.version }
            - call: "POST /freight/contract-rates/${cr1_id}/activate"
              payload: { expected_contract_rate_version: "${cr1_v}" }
              as: BrokerOps
              captures: { cr1_v_active: $.data.version }
            - call: "POST /freight/carriers"
              payload: { legal_name: "Big Rig LLC", mc_number: "1234567", usdot_number: "12345678", smartway_tier: "NONE", insurance_expiry_utc: "2027-01-01T00:00:00Z", safety_score: 30 }
              as: BrokerOps
              captures: { c1_id: $.data.id }
            - call: "POST /freight/carriers/${c1_id}/qualify"
              payload: {}
              as: BrokerOps
            - call: "POST /freight/quote-requests"
              payload: { shipper_id: "${s1_id}", lane_origin: "10001", lane_destination: "30303", distance_miles: 400, pickup_window_start_utc: "2026-06-10T08:00:00Z", pickup_window_end_utc: "2026-06-10T18:00:00Z", requested_equipment: "DRY_VAN" }
              as: BrokerOps
              captures: { q_contract_id: $.data.id, q_contract_total: $.data.quoted_total_cents, q_contract_mode: $.data.rate_mode }
            - call: "POST /freight/contract-rates/${cr1_id}/terminate"
              payload: {}
              as: BrokerOps
          trigger:
            - call: "POST /freight/quote-requests"
              payload: { shipper_id: "${s1_id}", lane_origin: "10001", lane_destination: "30303", distance_miles: 400, pickup_window_start_utc: "2026-06-12T08:00:00Z", pickup_window_end_utc: "2026-06-12T18:00:00Z", requested_equipment: "DRY_VAN" }
              as: BrokerOps
              captures: { q_spot_id: $.data.id, q_spot_total: $.data.quoted_total_cents, q_spot_mode: $.data.rate_mode }
          assert:
            - "QuoteRequest.${q_contract_id}.rate_mode == 'CONTRACT'"
            - "QuoteRequest.${q_contract_id}.quoted_total_cents == 124000"
            - "QuoteRequest.${q_spot_id}.rate_mode == 'SPOT'"
            - "QuoteRequest.${q_spot_id}.quoted_total_cents == 120000"
            - "QuoteRequest.${q_contract_id}.quoted_total_cents != QuoteRequest.${q_spot_id}.quoted_total_cents"

      - name: factoring_advance_diverges_with_carrier_safety_band
        grounds:
          - calculations.factoring_advance
          - entities.FactoringRequest.fields.advance_cents
          - entities.Carrier.fields.safety_score
        distinguishing_aspect: |
          Two FactoringRequest rows against the SAME-total Invoices but different
          QUALIFIED carriers diverge in advance_cents because the factoring fee
          schedule is keyed on Carrier.safety_score band. Carrier A (safety=20,
          band <25 -> applicable_fee_pct=2.0) -> advance = round(100000*0.98) =
          98000. Carrier B (safety=40, band 25-50 -> applicable_fee_pct=2.5)
          -> advance = round(100000*0.975) = 97500. The dual-variant lives on
          the FactoringRequest entity domain (different from instance 1's
          QuoteRequest domain).
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z."
            - "Shipper s1 ACTIVE; carrier_a (safety=20) and carrier_b (safety=40) both QUALIFIED."
            - "Two Load+Invoice pairs each with Invoice.total_cents=100000."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BrokerOps
            - call: "POST /freight/shippers"
              payload: { legal_name: "Bravo Shippers", billing_email: "ap@bravo.test", credit_limit_cents: 100000000 }
              as: BrokerOps
              captures: { s1_id: $.data.id }
            - call: "POST /freight/carriers"
              payload: { legal_name: "Carrier A", mc_number: "2200001", usdot_number: "22000001", smartway_tier: "NONE", insurance_expiry_utc: "2027-01-01T00:00:00Z", safety_score: 20 }
              as: BrokerOps
              captures: { ca_id: $.data.id }
            - call: "POST /freight/carriers/${ca_id}/qualify"
              payload: {}
              as: BrokerOps
            - call: "POST /freight/carriers"
              payload: { legal_name: "Carrier B", mc_number: "2200002", usdot_number: "22000002", smartway_tier: "NONE", insurance_expiry_utc: "2027-01-01T00:00:00Z", safety_score: 40 }
              as: BrokerOps
              captures: { cb_id: $.data.id }
            - call: "POST /freight/carriers/${cb_id}/qualify"
              payload: {}
              as: BrokerOps
            # Contract for predictable 100000-cent invoices: 200 cents/mi + 50 cents/mi fuel x 400 mi = 100000.
            - call: "POST /freight/contract-rates"
              payload: { shipper_id: "${s1_id}", lane_origin: "10001", lane_destination: "30303", rate_per_mile_cents: 200, fuel_surcharge_per_mile_cents: 50, detention_free_minutes: 120, detention_rate_per_hour_cents: 7500, effective_from_utc: "2026-01-01T00:00:00Z", effective_until_utc: "2027-01-01T00:00:00Z" }
              as: BrokerOps
              captures: { cr_id: $.data.id, cr_v: $.data.version }
            - call: "POST /freight/contract-rates/${cr_id}/activate"
              payload: { expected_contract_rate_version: "${cr_v}" }
              as: BrokerOps
            # Quote 1 -> award to ca -> pickup/deliver on time (no detention) -> invoice
            - call: "POST /freight/quote-requests"
              payload: { shipper_id: "${s1_id}", lane_origin: "10001", lane_destination: "30303", distance_miles: 400, pickup_window_start_utc: "2026-06-10T08:00:00Z", pickup_window_end_utc: "2026-06-10T18:00:00Z", requested_equipment: "DRY_VAN" }
              as: BrokerOps
              captures: { q1_id: $.data.id, q1_v: $.data.version }
            - call: "POST /freight/quote-requests/${q1_id}/award"
              payload: { carrier_id: "${ca_id}", expected_quote_request_version: "${q1_v}" }
              as: BrokerOps
              captures: { ld1_id: $.data.id }
            - call: "POST /freight/loads/${ld1_id}/pickup"
              payload: { actual_pickup_at_utc: "2026-06-10T09:00:00Z" }
              as: Carrier
              as_user_id: "${ca_id}"
            - call: "POST /freight/loads/${ld1_id}/deliver"
              payload: { actual_delivery_at_utc: "2026-06-11T09:00:00Z" }
              as: Carrier
              as_user_id: "${ca_id}"
            - call: "POST /freight/loads/${ld1_id}/invoice"
              payload: {}
              as: BrokerOps
              captures: { inv1_id: $.data.id, inv1_total: $.data.total_cents }
            # Quote 2 -> award to cb -> pickup/deliver on time -> invoice (must avoid quote-window overlap: use a non-overlapping window)
            - call: "POST /freight/quote-requests"
              payload: { shipper_id: "${s1_id}", lane_origin: "10001", lane_destination: "30303", distance_miles: 400, pickup_window_start_utc: "2026-06-20T08:00:00Z", pickup_window_end_utc: "2026-06-20T18:00:00Z", requested_equipment: "DRY_VAN" }
              as: BrokerOps
              captures: { q2_id: $.data.id, q2_v: $.data.version }
            - call: "POST /freight/quote-requests/${q2_id}/award"
              payload: { carrier_id: "${cb_id}", expected_quote_request_version: "${q2_v}" }
              as: BrokerOps
              captures: { ld2_id: $.data.id }
            - call: "POST /freight/loads/${ld2_id}/pickup"
              payload: { actual_pickup_at_utc: "2026-06-20T09:00:00Z" }
              as: Carrier
              as_user_id: "${cb_id}"
            - call: "POST /freight/loads/${ld2_id}/deliver"
              payload: { actual_delivery_at_utc: "2026-06-21T09:00:00Z" }
              as: Carrier
              as_user_id: "${cb_id}"
            - call: "POST /freight/loads/${ld2_id}/invoice"
              payload: {}
              as: BrokerOps
              captures: { inv2_id: $.data.id, inv2_total: $.data.total_cents }
          trigger:
            - call: "POST /freight/factoring-requests"
              payload: { invoice_id: "${inv1_id}", carrier_id: "${ca_id}", factoring_fee_pct: 2.0 }
              as: Carrier
              as_user_id: "${ca_id}"
              captures: { fr1_id: $.data.id, fr1_advance: $.data.advance_cents }
            - call: "POST /freight/factoring-requests"
              payload: { invoice_id: "${inv2_id}", carrier_id: "${cb_id}", factoring_fee_pct: 2.0 }
              as: Carrier
              as_user_id: "${cb_id}"
              captures: { fr2_id: $.data.id, fr2_advance: $.data.advance_cents }
          assert:
            - "Invoice.${inv1_id}.total_cents == 100000"
            - "Invoice.${inv2_id}.total_cents == 100000"
            - "FactoringRequest.${fr1_id}.advance_cents == 98000"
            - "FactoringRequest.${fr2_id}.advance_cents == 97500"
            - "FactoringRequest.${fr1_id}.advance_cents != FactoringRequest.${fr2_id}.advance_cents"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: quote_total_spot_combines_tier_fuel_uplift_mode_a
        grounds:
          - calculations.quote_total_at_request
          - entities.QuoteRequest.fields.quoted_total_cents
        distinguishing_aspect: |
          Mode (a) — formula with ≥3 inputs (distance_miles, requested_equipment,
          rate_mode==SPOT) and non-linear branches: tier selection branches on
          distance band, equipment_uplift_pct branches on requested_equipment,
          and the per-mile tier rate is multiplicatively combined with the
          equipment uplift after rounding-half-up of the uplift component. For
          distance=800 (tier3=195) + REEFER (uplift 18%): linehaul=195*800=
          156000, fuel=65*800=52000, uplift=round(156000*0.18)=28080, total=
          236080 cents — pinned literal.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; Shipper s1 ACTIVE; no covering ContractRate so rate_mode=SPOT."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BrokerOps
            - call: "POST /freight/shippers"
              payload: { legal_name: "Charlie Shippers", billing_email: "ap@charlie.test", credit_limit_cents: 500000000 }
              as: BrokerOps
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /freight/quote-requests"
              payload: { shipper_id: "${s1_id}", lane_origin: "94101", lane_destination: "10001", distance_miles: 800, pickup_window_start_utc: "2026-06-15T08:00:00Z", pickup_window_end_utc: "2026-06-15T18:00:00Z", requested_equipment: "REEFER" }
              as: BrokerOps
              captures: { q_id: $.data.id, q_total: $.data.quoted_total_cents, q_mode: $.data.rate_mode }
          assert:
            - "QuoteRequest.${q_id}.rate_mode == 'SPOT'"
            - "QuoteRequest.${q_id}.quoted_total_cents == 236080"

      - name: detention_subtract_then_ceil_order_matters_mode_b
        grounds:
          - calculations.detention_charge
          - entities.Load.fields.detention_charge_cents
          - state_machines.Load.IN_TRANSIT_to_DELIVERED
        distinguishing_aspect: |
          Mode (b) — nested rounding order matters. Detention is computed by
          subtracting free_min from minutes FIRST, then ceil(/60) to whole
          hours, then multiplying by rate. With detention_minutes=210,
          free_min=120: subtract-then-ceil yields ceil(90/60)=2 hours -> 15000
          cents. The opposite order ceil(210/60)=4, then subtract ceil(120/60)
          =2, then *rate would yield 2*7500=15000 — same on this point. With
          detention_minutes=180, free_min=120: subtract-then-ceil yields
          ceil(60/60)=1 hour -> 7500. Ceil-then-subtract would yield
          ceil(180/60)-ceil(120/60)=3-2=1 hour -> 7500. To pin the divergent
          point cleanly, use minutes=150, free=120: subtract-then-ceil ->
          ceil(30/60)=1 hour -> 7500 cents. Ceil-then-subtract: ceil(150/60)=3,
          ceil(120/60)=2, diff=1 -> 7500. Both agree here, but with
          detention_minutes=180 free_min=110: subtract-then-ceil ->
          ceil(70/60)=2 -> 15000. Ceil-then-subtract: ceil(180/60)=3,
          ceil(110/60)=2, diff=1 -> 7500. The scaffold pins subtract-then-ceil,
          producing 15000 cents.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z. Shipper s1 ACTIVE; carrier c1 QUALIFIED. ContractRate cr active with detention_free_minutes=110, detention_rate_per_hour_cents=7500. Load awarded; pickup window starts 2026-06-10T08:00:00Z; actual pickup 2026-06-10T11:00:00Z (detention_minutes=180)."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BrokerOps
            - call: "POST /freight/shippers"
              payload: { legal_name: "Delta Shippers", billing_email: "ap@delta.test", credit_limit_cents: 100000000 }
              as: BrokerOps
              captures: { s1_id: $.data.id }
            - call: "POST /freight/carriers"
              payload: { legal_name: "Delta Carrier", mc_number: "3333331", usdot_number: "33333331", smartway_tier: "NONE", insurance_expiry_utc: "2027-01-01T00:00:00Z", safety_score: 30 }
              as: BrokerOps
              captures: { c1_id: $.data.id }
            - call: "POST /freight/carriers/${c1_id}/qualify"
              payload: {}
              as: BrokerOps
            - call: "POST /freight/contract-rates"
              payload: { shipper_id: "${s1_id}", lane_origin: "10001", lane_destination: "30303", rate_per_mile_cents: 250, fuel_surcharge_per_mile_cents: 60, detention_free_minutes: 110, detention_rate_per_hour_cents: 7500, effective_from_utc: "2026-01-01T00:00:00Z", effective_until_utc: "2027-01-01T00:00:00Z" }
              as: BrokerOps
              captures: { cr_id: $.data.id, cr_v: $.data.version }
            - call: "POST /freight/contract-rates/${cr_id}/activate"
              payload: { expected_contract_rate_version: "${cr_v}" }
              as: BrokerOps
            - call: "POST /freight/quote-requests"
              payload: { shipper_id: "${s1_id}", lane_origin: "10001", lane_destination: "30303", distance_miles: 400, pickup_window_start_utc: "2026-06-10T08:00:00Z", pickup_window_end_utc: "2026-06-10T18:00:00Z", requested_equipment: "DRY_VAN" }
              as: BrokerOps
              captures: { q_id: $.data.id, q_v: $.data.version }
            - call: "POST /freight/quote-requests/${q_id}/award"
              payload: { carrier_id: "${c1_id}", expected_quote_request_version: "${q_v}" }
              as: BrokerOps
              captures: { ld_id: $.data.id }
            - call: "POST /freight/loads/${ld_id}/pickup"
              payload: { actual_pickup_at_utc: "2026-06-10T11:00:00Z" }
              as: Carrier
              as_user_id: "${c1_id}"
          trigger:
            - call: "POST /freight/loads/${ld_id}/deliver"
              payload: { actual_delivery_at_utc: "2026-06-11T11:00:00Z" }
              as: Carrier
              as_user_id: "${c1_id}"
              captures: { ld_det: $.data.detention_charge_cents }
          assert:
            - "Load.${ld_id}.detention_charge_cents == 15000"
            - "Load.${ld_id}.status == 'DELIVERED'"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: invoice_dispute_partial_revert_cycle
        grounds:
          - state_machines.Invoice.ISSUED_to_DISPUTED
          - state_machines.Invoice.DISPUTED_to_ISSUED
          - state_machines.DisputeClaim.OPEN_to_RESOLVED
        distinguishing_aspect: |
          Invoice state machine forms a cycle ISSUED -> DISPUTED -> ISSUED on
          PARTIAL resolution (the entity returns to the prior ISSUED state with
          a reduced total_cents — same enum, different field value). This is
          the non-linear cycle shape required by rule 3, and lives on the
          Invoice entity. Distinguishing aspect: the round-trip leaves
          Invoice.status back at ISSUED but Invoice.total_cents strictly
          smaller — observable from a single state field plus a reduced amount.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z. Shipper, carrier, contract active. One delivered+invoiced Load with Invoice total_cents=124000. Dispute opened with claimed=10000."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BrokerOps
            - call: "POST /freight/shippers"
              payload: { legal_name: "Echo Shippers", billing_email: "ap@echo.test", credit_limit_cents: 100000000 }
              as: BrokerOps
              captures: { s1_id: $.data.id }
            - call: "POST /freight/carriers"
              payload: { legal_name: "Echo Carrier", mc_number: "4444441", usdot_number: "44444441", smartway_tier: "NONE", insurance_expiry_utc: "2027-01-01T00:00:00Z", safety_score: 30 }
              as: BrokerOps
              captures: { c1_id: $.data.id }
            - call: "POST /freight/carriers/${c1_id}/qualify"
              payload: {}
              as: BrokerOps
            - call: "POST /freight/contract-rates"
              payload: { shipper_id: "${s1_id}", lane_origin: "10001", lane_destination: "30303", rate_per_mile_cents: 250, fuel_surcharge_per_mile_cents: 60, detention_free_minutes: 120, detention_rate_per_hour_cents: 7500, effective_from_utc: "2026-01-01T00:00:00Z", effective_until_utc: "2027-01-01T00:00:00Z" }
              as: BrokerOps
              captures: { cr_id: $.data.id, cr_v: $.data.version }
            - call: "POST /freight/contract-rates/${cr_id}/activate"
              payload: { expected_contract_rate_version: "${cr_v}" }
              as: BrokerOps
            - call: "POST /freight/quote-requests"
              payload: { shipper_id: "${s1_id}", lane_origin: "10001", lane_destination: "30303", distance_miles: 400, pickup_window_start_utc: "2026-06-10T08:00:00Z", pickup_window_end_utc: "2026-06-10T18:00:00Z", requested_equipment: "DRY_VAN" }
              as: BrokerOps
              captures: { q_id: $.data.id, q_v: $.data.version }
            - call: "POST /freight/quote-requests/${q_id}/award"
              payload: { carrier_id: "${c1_id}", expected_quote_request_version: "${q_v}" }
              as: BrokerOps
              captures: { ld_id: $.data.id }
            - call: "POST /freight/loads/${ld_id}/pickup"
              payload: { actual_pickup_at_utc: "2026-06-10T09:00:00Z" }
              as: Carrier
              as_user_id: "${c1_id}"
            - call: "POST /freight/loads/${ld_id}/deliver"
              payload: { actual_delivery_at_utc: "2026-06-11T09:00:00Z" }
              as: Carrier
              as_user_id: "${c1_id}"
            - call: "POST /freight/loads/${ld_id}/invoice"
              payload: {}
              as: BrokerOps
              captures: { inv_id: $.data.id, inv_total: $.data.total_cents }
            - call: "POST /freight/dispute-claims"
              payload: { invoice_id: "${inv_id}", claim_type: "OVERCHARGE", claimed_amount_cents: 10000 }
              as: Shipper
              as_user_id: "${s1_id}"
              captures: { dc_id: $.data.id }
          trigger:
            - call: "POST /freight/dispute-claims/${dc_id}/resolve"
              payload: { resolution_kind: "PARTIAL", resolution_amount_cents: 4000 }
              as: BrokerOps
              captures: { dc_status: $.data.status }
          assert:
            - "Invoice.${inv_id}.status == 'ISSUED'"
            - "Invoice.${inv_id}.total_cents == 120000"
            - "DisputeClaim.${dc_id}.status == 'RESOLVED'"
            - "DisputeClaim.${dc_id}.resolution_kind == 'PARTIAL'"

      - name: carrier_qualified_suspend_reinstate_cycle
        grounds:
          - state_machines.Carrier.QUALIFIED_to_SUSPENDED
          - state_machines.Carrier.SUSPENDED_to_QUALIFIED
        distinguishing_aspect: |
          Carrier state machine has cycle QUALIFIED -> SUSPENDED -> QUALIFIED.
          Different entity from instance 1 (Invoice), satisfying rule 3's
          "different entities" clause. Distinguishing aspect: same Carrier id
          observes qualification_status flipping back to QUALIFIED with version
          strictly greater than the original — round-trip is observable from a
          single field plus version progression.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z. Carrier c1 created and QUALIFIED (version >= 2)."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BrokerOps
            - call: "POST /freight/carriers"
              payload: { legal_name: "Foxtrot Carrier", mc_number: "5555551", usdot_number: "55555551", smartway_tier: "BRONZE", insurance_expiry_utc: "2027-01-01T00:00:00Z", safety_score: 30 }
              as: BrokerOps
              captures: { c1_id: $.data.id, c1_v0: $.data.version }
            - call: "POST /freight/carriers/${c1_id}/qualify"
              payload: {}
              as: BrokerOps
              captures: { c1_v1: $.data.version, c1_status_q: $.data.qualification_status }
            - call: "POST /freight/carriers/${c1_id}/suspend"
              payload: {}
              as: BrokerOps
              captures: { c1_v2: $.data.version, c1_status_s: $.data.qualification_status }
          trigger:
            - call: "POST /freight/carriers/${c1_id}/reinstate"
              payload: {}
              as: BrokerOps
              captures: { c1_v3: $.data.version, c1_status_r: $.data.qualification_status }
          assert:
            - "Carrier.${c1_id}.qualification_status == 'QUALIFIED'"
            - "Carrier.${c1_id}.version > 2"

  # =====================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:

      - name: dispute_upheld_cascade_to_factoring_recourse_depth3
        grounds:
          - state_machines.Invoice.DISPUTED_to_WRITTEN_OFF
          - state_machines.FactoringRequest.ADVANCED_to_RECOURSE
          - state_machines.Load.INVOICED_to_CLOSED
        distinguishing_aspect: |
          Triggering POST /dispute-claims/{id}/resolve with resolution_kind=UPHELD
          on a factored Invoice produces a transitive 3-hop cascade:
          (hop 1) Invoice.status flips to WRITTEN_OFF; (hop 2) BECAUSE Invoice
          went WRITTEN_OFF, Load.status flips to CLOSED; (hop 3) BECAUSE Invoice
          went WRITTEN_OFF AND Invoice.factored==true, FactoringRequest.status
          flips ADVANCED -> RECOURSE. Each link is caused by the prior link's
          state change, not by the original resolve call. Trigger is dispute
          UPHELD resolution.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z. Shipper, carrier QUALIFIED, contract active. Load delivered+invoiced (Invoice.total_cents=100000). FactoringRequest in ADVANCED status — Invoice.factored=true. DisputeClaim opened with claimed_amount_cents=100000."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BrokerOps
            - call: "POST /freight/shippers"
              payload: { legal_name: "Golf Shippers", billing_email: "ap@golf.test", credit_limit_cents: 100000000 }
              as: BrokerOps
              captures: { s1_id: $.data.id }
            - call: "POST /freight/carriers"
              payload: { legal_name: "Golf Carrier", mc_number: "6666661", usdot_number: "66666661", smartway_tier: "NONE", insurance_expiry_utc: "2027-01-01T00:00:00Z", safety_score: 20 }
              as: BrokerOps
              captures: { c1_id: $.data.id }
            - call: "POST /freight/carriers/${c1_id}/qualify"
              payload: {}
              as: BrokerOps
            - call: "POST /freight/contract-rates"
              payload: { shipper_id: "${s1_id}", lane_origin: "10001", lane_destination: "30303", rate_per_mile_cents: 200, fuel_surcharge_per_mile_cents: 50, detention_free_minutes: 120, detention_rate_per_hour_cents: 7500, effective_from_utc: "2026-01-01T00:00:00Z", effective_until_utc: "2027-01-01T00:00:00Z" }
              as: BrokerOps
              captures: { cr_id: $.data.id, cr_v: $.data.version }
            - call: "POST /freight/contract-rates/${cr_id}/activate"
              payload: { expected_contract_rate_version: "${cr_v}" }
              as: BrokerOps
            - call: "POST /freight/quote-requests"
              payload: { shipper_id: "${s1_id}", lane_origin: "10001", lane_destination: "30303", distance_miles: 400, pickup_window_start_utc: "2026-06-10T08:00:00Z", pickup_window_end_utc: "2026-06-10T18:00:00Z", requested_equipment: "DRY_VAN" }
              as: BrokerOps
              captures: { q_id: $.data.id, q_v: $.data.version }
            - call: "POST /freight/quote-requests/${q_id}/award"
              payload: { carrier_id: "${c1_id}", expected_quote_request_version: "${q_v}" }
              as: BrokerOps
              captures: { ld_id: $.data.id }
            - call: "POST /freight/loads/${ld_id}/pickup"
              payload: { actual_pickup_at_utc: "2026-06-10T09:00:00Z" }
              as: Carrier
              as_user_id: "${c1_id}"
            - call: "POST /freight/loads/${ld_id}/deliver"
              payload: { actual_delivery_at_utc: "2026-06-11T09:00:00Z" }
              as: Carrier
              as_user_id: "${c1_id}"
            - call: "POST /freight/loads/${ld_id}/invoice"
              payload: {}
              as: BrokerOps
              captures: { inv_id: $.data.id }
            - call: "POST /freight/factoring-requests"
              payload: { invoice_id: "${inv_id}", carrier_id: "${c1_id}", factoring_fee_pct: 2.0 }
              as: Carrier
              as_user_id: "${c1_id}"
              captures: { fr_id: $.data.id }
            - call: "POST /freight/factoring-requests/${fr_id}/approve"
              payload: {}
              as: BrokerOps
            - call: "POST /freight/factoring-requests/${fr_id}/advance"
              payload: {}
              as: BrokerOps
            - call: "POST /freight/dispute-claims"
              payload: { invoice_id: "${inv_id}", claim_type: "DAMAGED_GOODS", claimed_amount_cents: 100000 }
              as: Shipper
              as_user_id: "${s1_id}"
              captures: { dc_id: $.data.id }
          trigger:
            - call: "POST /freight/dispute-claims/${dc_id}/resolve"
              payload: { resolution_kind: "UPHELD", resolution_amount_cents: 100000 }
              as: BrokerOps
          assert:
            - "Invoice.${inv_id}.status == 'WRITTEN_OFF'"
            - "Load.${ld_id}.status == 'CLOSED'"
            - "FactoringRequest.${fr_id}.status == 'RECOURSE'"

      - name: load_cancel_cascade_to_quote_withdrawn_depth2
        grounds:
          - state_machines.Load.AWARDED_to_CANCELLED
          - state_machines.QuoteRequest.OPEN_to_WITHDRAWN
        distinguishing_aspect: |
          Triggering POST /loads/{id}/cancel produces a transitive 2-hop
          cascade: (hop 1) Load.status flips to CANCELLED; (hop 2) BECAUSE the
          load is now CANCELLED, the originating QuoteRequest is forced back
          to WITHDRAWN so the lane is freed for a fresh quote. The two
          cascades originate from different triggering transitions: instance 1
          fires from /dispute-claims/{id}/resolve (Invoice machine), this one
          fires from /loads/{id}/cancel (Load machine).
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z. Shipper, carrier QUALIFIED, no contract (SPOT). QuoteRequest awarded to that carrier (Load.status=AWARDED, QuoteRequest.status=AWARDED)."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BrokerOps
            - call: "POST /freight/shippers"
              payload: { legal_name: "Hotel Shippers", billing_email: "ap@hotel.test", credit_limit_cents: 100000000 }
              as: BrokerOps
              captures: { s1_id: $.data.id }
            - call: "POST /freight/carriers"
              payload: { legal_name: "Hotel Carrier", mc_number: "7777771", usdot_number: "77777771", smartway_tier: "NONE", insurance_expiry_utc: "2027-01-01T00:00:00Z", safety_score: 30 }
              as: BrokerOps
              captures: { c1_id: $.data.id }
            - call: "POST /freight/carriers/${c1_id}/qualify"
              payload: {}
              as: BrokerOps
            - call: "POST /freight/quote-requests"
              payload: { shipper_id: "${s1_id}", lane_origin: "10001", lane_destination: "30303", distance_miles: 400, pickup_window_start_utc: "2026-06-15T08:00:00Z", pickup_window_end_utc: "2026-06-15T18:00:00Z", requested_equipment: "DRY_VAN" }
              as: BrokerOps
              captures: { q_id: $.data.id, q_v: $.data.version }
            - call: "POST /freight/quote-requests/${q_id}/award"
              payload: { carrier_id: "${c1_id}", expected_quote_request_version: "${q_v}" }
              as: BrokerOps
              captures: { ld_id: $.data.id }
          trigger:
            - call: "POST /freight/loads/${ld_id}/cancel"
              payload: {}
              as: BrokerOps
          assert:
            - "Load.${ld_id}.status == 'CANCELLED'"
            - "QuoteRequest.${q_id}.status == 'WITHDRAWN'"

  # =====================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_beats_business_safety_on_award_expired_quote_and_smartway_violation
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SMARTWAY_INELIGIBLE]
        distinguishing_aspect: |
          A single POST /quote-requests/{id}/award call dual-violates: the
          QuoteRequest has aged past expires_at_utc (so it's now EXPIRED via
          /_clock/advance, violating priority 5 ERR_INVALID_STATE) AND
          requires_smartway=true with carrier.smartway_tier=NONE (would violate
          priority 9 ERR_SMARTWAY_INELIGIBLE). The state error MUST win because
          priority 5 < priority 9. Error-category pair: state vs
          business_safety.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z. QuoteRequest created with pickup_window_start=2026-06-05T08:00:00Z, requires_smartway=true. Carrier qualified with smartway_tier=NONE. Clock advanced to 2026-06-10T00:00:00Z and /_clock/advance fired so QuoteRequest is now EXPIRED."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BrokerOps
            - call: "POST /freight/shippers"
              payload: { legal_name: "India Shippers", billing_email: "ap@india.test", credit_limit_cents: 100000000 }
              as: BrokerOps
              captures: { s1_id: $.data.id }
            - call: "POST /freight/carriers"
              payload: { legal_name: "India Carrier", mc_number: "8888881", usdot_number: "88888881", smartway_tier: "NONE", insurance_expiry_utc: "2027-01-01T00:00:00Z", safety_score: 30 }
              as: BrokerOps
              captures: { c1_id: $.data.id }
            - call: "POST /freight/carriers/${c1_id}/qualify"
              payload: {}
              as: BrokerOps
            - call: "POST /freight/quote-requests"
              payload: { shipper_id: "${s1_id}", lane_origin: "10001", lane_destination: "30303", distance_miles: 400, pickup_window_start_utc: "2026-06-05T08:00:00Z", pickup_window_end_utc: "2026-06-05T18:00:00Z", requested_equipment: "DRY_VAN", requires_smartway: true }
              as: BrokerOps
              captures: { q_id: $.data.id, q_v: $.data.version }
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: BrokerOps
            - call: "POST /freight/_clock/advance"
              payload: {}
              as: BrokerOps
          trigger:
            - call: "POST /freight/quote-requests/${q_id}/award"
              payload: { carrier_id: "${c1_id}", expected_quote_request_version: "${q_v}" }
              as: BrokerOps
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == 'ERR_INVALID_STATE'"
            - "response.http_status == 409"
            - "QuoteRequest.${q_id}.status == 'EXPIRED'"

      - name: business_safety_beats_business_referential_on_award_insurance_and_contract_stale
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_INSURANCE_EXPIRED]
          - errors[ERR_CONTRACT_RATE_STALE]
        distinguishing_aspect: |
          A single POST /quote-requests/{id}/award call dual-violates: the
          awarded Carrier.insurance_expiry_utc has slipped past current_utc
          (priority 8 ERR_INSURANCE_EXPIRED) AND the QuoteRequest's pinned
          contract_rate_version is stale because the contract was amended
          (priority 10 ERR_CONTRACT_RATE_STALE). Priority 8 must win.
          Error-category pair: business_safety vs business_referential —
          different from instance 1's state vs business_safety pair.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z. ContractRate cr ACTIVE (v=2). Carrier qualified with insurance_expiry_utc=2026-06-30T00:00:00Z. CONTRACT quote created and pinned to cr.version=2. Contract then terminated and a new contract activated (so the pinned version is stale). Clock advanced to 2026-07-15T00:00:00Z (carrier insurance now expired)."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BrokerOps
            - call: "POST /freight/shippers"
              payload: { legal_name: "Juliet Shippers", billing_email: "ap@juliet.test", credit_limit_cents: 100000000 }
              as: BrokerOps
              captures: { s1_id: $.data.id }
            - call: "POST /freight/carriers"
              payload: { legal_name: "Juliet Carrier", mc_number: "9999991", usdot_number: "99999991", smartway_tier: "NONE", insurance_expiry_utc: "2026-06-30T00:00:00Z", safety_score: 30 }
              as: BrokerOps
              captures: { c1_id: $.data.id }
            - call: "POST /freight/carriers/${c1_id}/qualify"
              payload: {}
              as: BrokerOps
            - call: "POST /freight/contract-rates"
              payload: { shipper_id: "${s1_id}", lane_origin: "10001", lane_destination: "30303", rate_per_mile_cents: 250, fuel_surcharge_per_mile_cents: 60, detention_free_minutes: 120, detention_rate_per_hour_cents: 7500, effective_from_utc: "2026-01-01T00:00:00Z", effective_until_utc: "2027-01-01T00:00:00Z" }
              as: BrokerOps
              captures: { cr_id: $.data.id, cr_v: $.data.version }
            - call: "POST /freight/contract-rates/${cr_id}/activate"
              payload: { expected_contract_rate_version: "${cr_v}" }
              as: BrokerOps
            - call: "POST /freight/quote-requests"
              payload: { shipper_id: "${s1_id}", lane_origin: "10001", lane_destination: "30303", distance_miles: 400, pickup_window_start_utc: "2026-08-01T08:00:00Z", pickup_window_end_utc: "2026-08-01T18:00:00Z", requested_equipment: "DRY_VAN" }
              as: BrokerOps
              captures: { q_id: $.data.id, q_v: $.data.version }
            - call: "POST /freight/contract-rates/${cr_id}/terminate"
              payload: {}
              as: BrokerOps
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: BrokerOps
          trigger:
            - call: "POST /freight/quote-requests/${q_id}/award"
              payload: { carrier_id: "${c1_id}", expected_quote_request_version: "${q_v}" }
              as: BrokerOps
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == 'ERR_INSURANCE_EXPIRED'"
            - "response.http_status == 422"

  # =====================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: detention_zero_at_free_window_boundary
        grounds:
          - calculations.detention_charge
          - entities.Load.fields.detention_charge_cents
          - state_machines.Load.IN_TRANSIT_to_DELIVERED
        distinguishing_aspect: |
          At pickup exactly free_min minutes after pickup_window_start_utc
          (detention_minutes==120==SPOT_DETENTION_FREE_MINUTES), the formula
          subtract-then-ceil yields max(0, 120-120)=0 minutes -> 0 hours ->
          0 cents. Crossing by 1 minute (121-120=1 minute -> ceil(1/60)=1 hour
          -> 7500 cents) tests the boundary. Reachable through POST
          /loads/{id}/deliver. Numeric threshold edge.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z. Shipper, carrier QUALIFIED, NO contract (SPOT, free=120). Load awarded, pickup_window_start_utc=2026-06-10T08:00:00Z, actual pickup at exactly 10:00 (detention_minutes=120)."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BrokerOps
            - call: "POST /freight/shippers"
              payload: { legal_name: "Kilo Shippers", billing_email: "ap@kilo.test", credit_limit_cents: 100000000 }
              as: BrokerOps
              captures: { s1_id: $.data.id }
            - call: "POST /freight/carriers"
              payload: { legal_name: "Kilo Carrier", mc_number: "1111112", usdot_number: "11111121", smartway_tier: "NONE", insurance_expiry_utc: "2027-01-01T00:00:00Z", safety_score: 30 }
              as: BrokerOps
              captures: { c1_id: $.data.id }
            - call: "POST /freight/carriers/${c1_id}/qualify"
              payload: {}
              as: BrokerOps
            - call: "POST /freight/quote-requests"
              payload: { shipper_id: "${s1_id}", lane_origin: "10001", lane_destination: "30303", distance_miles: 400, pickup_window_start_utc: "2026-06-10T08:00:00Z", pickup_window_end_utc: "2026-06-10T18:00:00Z", requested_equipment: "DRY_VAN" }
              as: BrokerOps
              captures: { q_id: $.data.id, q_v: $.data.version }
            - call: "POST /freight/quote-requests/${q_id}/award"
              payload: { carrier_id: "${c1_id}", expected_quote_request_version: "${q_v}" }
              as: BrokerOps
              captures: { ld_id: $.data.id }
            - call: "POST /freight/loads/${ld_id}/pickup"
              payload: { actual_pickup_at_utc: "2026-06-10T10:00:00Z" }
              as: Carrier
              as_user_id: "${c1_id}"
          trigger:
            - call: "POST /freight/loads/${ld_id}/deliver"
              payload: { actual_delivery_at_utc: "2026-06-11T10:00:00Z" }
              as: Carrier
              as_user_id: "${c1_id}"
              captures: { det_cents: $.data.detention_charge_cents }
          assert:
            - "Load.${ld_id}.detention_charge_cents == 0"
            - "Load.${ld_id}.status == 'DELIVERED'"

      - name: smartway_audit_zero_load_quarter_is_failing
        grounds:
          - calculations.smartway_quarterly_audit
          - entities.SmartWayAudit.fields.compliance_status
          - entities.SmartWayAudit.fields.smartway_ratio
        distinguishing_aspect: |
          Empty-set / zero-count edge: a shipper with ZERO delivered loads in
          the named quarter triggers smartway_ratio=0.0 and compliance_status=
          FAILING per the explicit zero-load rule. This is a different metric
          (count-of-rows = 0) on a different endpoint (POST /smartway-audits)
          from instance 1's numeric threshold detention boundary.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z (so 2026Q2 is fully past). Shipper exists with NO loads in 2026Q2."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BrokerOps
            - call: "POST /freight/shippers"
              payload: { legal_name: "Lima Shippers", billing_email: "ap@lima.test", credit_limit_cents: 1000000 }
              as: BrokerOps
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /freight/smartway-audits"
              payload: { shipper_id: "${s1_id}", quarter_label: "2026Q2" }
              as: BrokerOps
              captures: { audit_total: $.data.total_loads, audit_ratio: $.data.smartway_ratio, audit_status: $.data.compliance_status }
          assert:
            - "SmartWayAudit.total_loads == 0"
            - "SmartWayAudit.smartway_ratio == 0.0"
            - "SmartWayAudit.compliance_status == 'FAILING'"

  # =====================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: award_requires_carrier_qualified_state
        grounds:
          - state_machines.QuoteRequest.OPEN_to_AWARDED
          - state_machines.Carrier.PENDING_to_QUALIFIED
        distinguishing_aspect: |
          QuoteRequest.OPEN -> AWARDED requires Carrier.qualification_status ==
          QUALIFIED. Entity pair: QuoteRequest -> Carrier. With a PENDING
          carrier the award is rejected; same data with the carrier flipped to
          QUALIFIED succeeds.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z. Shipper, OPEN quote on a lane. Carrier created PENDING (not yet qualified)."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BrokerOps
            - call: "POST /freight/shippers"
              payload: { legal_name: "Mike Shippers", billing_email: "ap@mike.test", credit_limit_cents: 100000000 }
              as: BrokerOps
              captures: { s1_id: $.data.id }
            - call: "POST /freight/carriers"
              payload: { legal_name: "Mike Carrier", mc_number: "1212121", usdot_number: "12121212", smartway_tier: "NONE", insurance_expiry_utc: "2027-01-01T00:00:00Z", safety_score: 30 }
              as: BrokerOps
              captures: { c1_id: $.data.id }
            - call: "POST /freight/quote-requests"
              payload: { shipper_id: "${s1_id}", lane_origin: "10001", lane_destination: "30303", distance_miles: 400, pickup_window_start_utc: "2026-06-15T08:00:00Z", pickup_window_end_utc: "2026-06-15T18:00:00Z", requested_equipment: "DRY_VAN" }
              as: BrokerOps
              captures: { q_id: $.data.id, q_v: $.data.version }
          trigger:
            - call: "POST /freight/quote-requests/${q_id}/award"
              payload: { carrier_id: "${c1_id}", expected_quote_request_version: "${q_v}" }
              as: BrokerOps
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == 'ERR_INVALID_STATE'"
            - "QuoteRequest.${q_id}.status == 'OPEN'"

      - name: factoring_approve_requires_invoice_open_and_not_factored
        grounds:
          - state_machines.FactoringRequest.REQUESTED_to_APPROVED
          - state_machines.Invoice.ISSUED_to_DISPUTED
        distinguishing_aspect: |
          FactoringRequest.REQUESTED -> APPROVED requires the parent Invoice to
          be in {ISSUED, PARTIALLY_PAID} AND Invoice.factored == false.
          Different entity pair (FactoringRequest -> Invoice) from instance 1
          (QuoteRequest -> Carrier). With the Invoice currently DISPUTED
          (because a DisputeClaim was opened first), the approve call is
          rejected.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z. Shipper, carrier QUALIFIED, contract active. Load delivered+invoiced. FactoringRequest in REQUESTED status. DisputeClaim opened against the same Invoice so Invoice.status=DISPUTED."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BrokerOps
            - call: "POST /freight/shippers"
              payload: { legal_name: "November Shippers", billing_email: "ap@november.test", credit_limit_cents: 100000000 }
              as: BrokerOps
              captures: { s1_id: $.data.id }
            - call: "POST /freight/carriers"
              payload: { legal_name: "November Carrier", mc_number: "1313131", usdot_number: "13131313", smartway_tier: "NONE", insurance_expiry_utc: "2027-01-01T00:00:00Z", safety_score: 30 }
              as: BrokerOps
              captures: { c1_id: $.data.id }
            - call: "POST /freight/carriers/${c1_id}/qualify"
              payload: {}
              as: BrokerOps
