            - "RedemptionSubmission.${sub}.status == PAID"
            - "SettlementRun.total_paid_cents == 195 and swept_submission_ids == [${sub}]"

  # ------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: issuance_gated_by_market_day_open
        grounds:
          - state_machines.Token.ISSUED_to_REDEEMED
          - validations[priority=14]
          - state_machines.MarketDay.SCHEDULED_to_OPEN
        distinguishing_aspect: |
          Entity pair Issuance x MarketDay: issuance on a SCHEDULED (never opened) day is rejected
          ERR_MARKET_DAY_NOT_OPEN even though shopper, batches and pool are all valid.
        test_recipe:
          setup:
            - "Base setup but day left SCHEDULED (open never called); shopper ACTIVE"
