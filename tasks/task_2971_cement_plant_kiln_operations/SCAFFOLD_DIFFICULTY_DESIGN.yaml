      - name: limestone_limit_priority_96_beats_insufficient_clinker_priority_103
        grounds: >
          §1.4 declares priority 96 limestone_within_cement_type_limit ->
          ERR_LIMESTONE_LIMIT_EXCEEDED and priority 103 clinker_availability_covers_draw ->
          ERR_INSUFFICIENT_CLINKER as a conflicting pair. A TYPE_I batch with 8.00% interground
          limestone (limit 5.00) drawing 700.00 t from a silo holding 583.78 t violates both.
        distinguishing_aspect: >
          An availability-first implementation returns ERR_INSUFFICIENT_CLINKER (409) and the
          operator never learns the recipe is illegal for TYPE_I. The correct answer is
          ERR_LIMESTONE_LIMIT_EXCEEDED (422) — note the status code also differs here, so an
          implementation that gets the ordering wrong returns the wrong HTTP status too.
        test_recipe:
          setup: >
            The same released 583.78 t of clinker in an OPEN SC1, so the silo-state rule at priority
            62 is satisfied and only 96 and 103 are in conflict.
