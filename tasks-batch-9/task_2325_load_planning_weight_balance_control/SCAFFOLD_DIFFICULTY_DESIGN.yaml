              as: LoadControlAdmin
              captures: { ac2: $.data.id }
            - call: "POST /compartments"
              payload: { aircraft_id: "${ac1}", code: "OA", kind: "CABIN_ZONE", arm_m: 12.500, max_weight_kg: 5000, running_load_limit_kg_per_m: 2000, length_m: 6.0, seat_capacity: 42 }
