  - section: endpoints
    instances:
      - name: owner_and_facility_crud_with_the_nested_listing_and_its_filters
        claim_type: Standard CRUD
        grounds: ["endpoints.POST_/uro/utility-owners", "endpoints.GET_/uro/utility-owners", "endpoints.GET_/uro/utility-owners/{id}", "endpoints.GET_/uro/utility-owners/{id}/facilities", "endpoints.GET_/uro/facilities/{id}"]
        distinguishing_aspect: "The owner and facility registers are the only pure CRUD surface in the domain and they have no update endpoint at all - release-hold is the sole mutation on an owner - so the claim is that create, read, filtered list and nested list all work while nothing resembling a generic PATCH exists. The nested listing must be scoped to its parent: owner A's two facilities appear and owner B's single facility never does, and limit/offset walk the two rows without repeating one."
        test_recipe:
          setup: ["Two owners, two facilities under owner A and one under owner B."]
          setup_api_calls:
            - { call: "POST /uro/utility-owners", payload: { legal_name: "Cascade Electric Cooperative", utility_type: "ELECTRIC", is_public_agency: false, indirect_cost_rate_pct: 12.5 }, as: ProgramAdmin, captures: { oa: "$.data.id" } }
            - { call: "POST /uro/utility-owners", payload: { legal_name: "Basin Water District", utility_type: "WATER", is_public_agency: true, indirect_cost_rate_pct: 8.0 }, as: ProgramAdmin, captures: { ob: "$.data.id" } }
            - { call: "POST /uro/facilities", payload: { owner_id: "${oa}", facility_type: "BURIED_ELECTRIC", station_begin: 100.0, station_end: 140.0, offset_ft: 12.5, depth_in: 48, material: "PVC duct bank", installed_year: 1968, occupancy_basis: "PRIVATE_EASEMENT", record_source: "AS_BUILT" }, as: UtilityCoordinator, captures: { fa1: "$.data.id" } }
            - { call: "POST /uro/facilities", payload: { owner_id: "${oa}", facility_type: "OVERHEAD_ELECTRIC", station_begin: 300.0, station_end: 360.0, offset_ft: 25.0, depth_in: 0, material: "wood pole line", installed_year: 1981, occupancy_basis: "FRANCHISE", record_source: "FIELD_SURVEY" }, as: UtilityCoordinator, captures: { fa2: "$.data.id" } }
            - { call: "POST /uro/facilities", payload: { owner_id: "${ob}", facility_type: "WATER_MAIN", station_begin: 200.0, station_end: 240.0, offset_ft: 9.0, depth_in: 60, material: "ductile iron", installed_year: 1959, occupancy_basis: "FEE_SIMPLE", record_source: "OWNER_ATLAS" }, as: UtilityCoordinator, captures: { fb1: "$.data.id" } }
          trigger:
            - { call: "GET /uro/utility-owners/${oa}/facilities", payload: { limit: 1, offset: 0 }, as: UtilityCoordinator, captures: { page1_head: "$.data[0].id" } }
            - { call: "GET /uro/utility-owners/${oa}/facilities", payload: { limit: 1, offset: 1 }, as: UtilityCoordinator, captures: { page2_head: "$.data[0].id" } }
            - { call: "GET /uro/utility-owners", payload: { utility_type: "WATER" }, as: ProgramAdmin, captures: { water_head: "$.data[0].id" } }
            - { call: "GET /uro/facilities/${fb1}", payload: {}, as: UtilityCoordinator, captures: { fb1_owner: "$.data.owner_id", fb1_basis: "$.data.occupancy_basis" } }
          assert:
            - "each nested page returns exactly 1 row with total_count 2 and has_more true then false"
            - "${page1_head} and ${page2_head} are the two ids ${fa1} and ${fa2} in some order and are never equal"
            - "${fb1} never appears in owner ${oa}'s nested listing"
            - "the WATER filter returns exactly 1 row and ${water_head} == ${ob}"
            - "${fb1_owner} == ${ob} and ${fb1_basis} == FEE_SIMPLE"
            - "no PATCH or DELETE route exists for /uro/utility-owners/{id} or /uro/facilities/{id}; the only owner mutation declared is POST /uro/utility-owners/{id}/release-hold"

