    side_effects: ["status=ACTIVE", "safety_posture=OPEN", "risk_score=0", "risk_tier=TIER_LOW", "standing_enforcement_count=0", "deactivation_count=0", "prior_reinstatement_count=0", "policy_generation_index stamped", "three_year_drift_last_run_index=policy_generation_index", "a CONTINUOUS_MONITOR BackgroundCheck with trigger_source=CONTINUOUS is synthesized with check_status=SCHEDULED and adjudication=PENDING for DRIVER accounts only"]

  - method: GET
