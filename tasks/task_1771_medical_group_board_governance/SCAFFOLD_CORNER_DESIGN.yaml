      - name: merger_evaluation_pipeline_and_decide_guards
        claim_type: valid_transition
        grounds: [state_machines.MergerProposal, "errors[ERR_MERGER_ALREADY_ACTIVE]", "errors[ERR_MERGER_NOT_APPROVED]"]
        distinguishing_aspect: "Full branching pipeline: PROPOSED -> DUE_DILIGENCE -> NEGOTIATION -> APPROVED only with an adopted MERGER motion; decide before NEGOTIATION -> ERR_INVALID_STATE; decide without adoption -> ERR_MERGER_NOT_APPROVED; a second concurrent proposal -> ERR_MERGER_ALREADY_ACTIVE."
        test_recipe:
          setup: ["Policy quorum 1; SHAREHOLDER A; merger proposal MP created; MERGER motion linked to MP proposed+open+adopted later"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /governance/merger-proposals", payload: { counterparty_name: "Regional Health", exchange_ratio_x1000: 1250, cash_consideration_cents: 900000000 }, as: BoardAdmin, captures: { mp_id: $.data.id } }
          trigger:
            - { call: "POST /governance/merger-proposals", payload: { counterparty_name: "Statewide Clinics", exchange_ratio_x1000: 900, cash_consideration_cents: 100000000 }, as: BoardAdmin, captures: { err_active: $.data.error_id } }
            - { call: "POST /governance/motions", payload: { motion_type: MERGER, sponsor_physician_id: "${a_id}", payload: { merger_proposal_id: "${mp_id}" } }, as: Physician, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /governance/merger-proposals/${mp_id}/decide", payload: { outcome: APPROVED, motion_id: "${m_id}" }, as: BoardAdmin, captures: { err_state: $.data.error_id } }
            - { call: "POST /governance/merger-proposals/${mp_id}/advance", payload: { diligence_note: "phase 1 clean" }, as: BoardAdmin }
            - { call: "POST /governance/merger-proposals/${mp_id}/advance", payload: {}, as: BoardAdmin }
            - { call: "POST /governance/merger-proposals/${mp_id}/decide", payload: { outcome: APPROVED, motion_id: "${m_id}" }, as: BoardAdmin, captures: { err_notadopted: $.data.error_id } }
            - { call: "POST /governance/motions/${m_id}/propose", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/open", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/close", payload: {}, as: BoardAdmin }
            - { call: "POST /governance/merger-proposals/${mp_id}/decide", payload: { outcome: APPROVED, motion_id: "${m_id}" }, as: BoardAdmin }
          assert:
            - "err_active == ERR_MERGER_ALREADY_ACTIVE (one non-terminal proposal at a time)"
            - "err_state == ERR_INVALID_STATE (decide APPROVED only from NEGOTIATION)"
            - "err_notadopted == ERR_MERGER_NOT_APPROVED (motion not yet ADOPTED)"
            - "After adoption: MergerProposal.${mp_id}.status == APPROVED with deciding_motion_id == ${m_id}"

      - name: coi_cleared_and_terminal_motion_flag_have_no_cascade
        claim_type: side_effect_execution
        grounds: [state_machines.COIDisclosure]
        distinguishing_aspect: "A CLEARED review changes nothing on the motion; FLAGGING a disclosure whose related motion is already terminal records the flag but fires no recusal cascade."
        test_recipe:
          setup: ["Policy quorum 1; SHAREHOLDERs A, B; CAPITAL_CALL motion OPEN; B has voted FOR; two disclosures by B on the motion: D1 under review now, D2 reviewed after the motion closes ADOPTED"]
