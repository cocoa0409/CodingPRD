      - name: pay_invoice_after_grace_returns_grace_expired
        claim_type: Violation → Error
        grounds: ["validations[priority=10]", "errors[ERR_GRACE_EXPIRED]", state_machines.Policy.premium_status]
        distinguishing_aspect: "Paying an OPEN invoice after the clock passes its grace_deadline -> ERR_GRACE_EXPIRED (409); the invoice is already DEFAULTED."
        test_recipe:
          setup: ["A policy with an OPEN invoice whose grace_deadline has passed (clock advanced beyond grace; premium_status LAPSED)."]
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { full_name: "Late Pay", state_code: "CA", date_of_birth: "1950-01-01" }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", product_mode: "REIMBURSEMENT", daily_benefit_max_cents: 20000, monthly_benefit_max_cents: 600000, initial_pool_cents: 10000000, inflation_rider: "NONE", elimination_period_days: 0 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/premium-invoices"
              payload: { period_index: 0, base_premium_cents: 12000, due_date: "2026-01-31", grace_deadline: "2026-03-01" }
              as: Underwriter
              captures: { inv0: $.data.id }
            - call: "POST /_clock/advance_to"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: Underwriter
          trigger:
            - call: "POST /premium-invoices/${inv0}/pay"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id IN {ERR_GRACE_EXPIRED, ERR_INVOICE_NOT_OPEN}"
            - "Note: after grace expiry the clock cascade set invoice.status=DEFAULTED, so the pay attempt fails the OPEN precondition (ERR_INVOICE_NOT_OPEN) or grace check (ERR_GRACE_EXPIRED) depending on order; both are 409 rejections of a post-grace payment."

