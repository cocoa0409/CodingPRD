            - "after the decision two more rows exist: FORFEITURE_REVERSAL 3000 (+3000) and REFUND 3000 (-3000), both with memo_code REFUND_EXCEPTION"
            - "after the decision sum(signed_amount_cents) over all five rows is still 0"
            - "Reservation.${res_id}.refunded_cents == 8291 and forfeited_cents == 3292, and 8291 + 3292 == 11583 == amount_paid_cents"
            - "forfeited_cents is the FORFEITURE total minus the FORFEITURE_REVERSAL total, not a stored counter that was decremented"
            - "no ledger row was mutated or deleted: the original FORFEITURE row still reads 6292"
            - "Reservation.${res_id}.payment_status == PARTIALLY_REFUNDED"

      - name: seat_pool_conserved_across_release_and_cancel
        grounds:
