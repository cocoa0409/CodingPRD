            - "MarkdownStage.${stg1}.closed_reason == ON_SCHEDULE and MarkdownStage.${stg2}.closed_reason == ON_SCHEDULE, both with escalation_applied_pct == 0.0000 and checkpoint_sell_through_pct == 0.0000"
            - "uncovered window: activating ${stg3} returns HTTP 409 with error_id == ERR_LICENSE_NOT_ACTIVE because period_end_date 2026-10-14 < window_end_date 2026-10-20 minus one day"
            - "MarkdownStage.${stg3}.stage_status == ARMED and activated_at == null after the refusal"
            - "GobLicense.${lic}.license_status == APPROVED and Store.${st}.store_status == SELLING both before and after the refusal, so the licence's own state is not what differs"
            - "Store.${st}.planned_avg_discount_pct == 0.6000 (only ${stg3} remains in the ARMED/ACTIVE set)"
            - "Store.${st}.projected_gross_recovery_cents == 3980000 and projected_recovery_ratio == 0.7960"

      - name: final_settlement_finalize_requires_every_lease_disposition_terminal
        grounds:
          - state_machines.Settlement.ACCEPTED_to_FINALIZED
          - validations[priority=76]
          - errors[ERR_LEASE_NOT_DISPOSED]
          - state_machines.LeaseDisposition.AGREED_to_SURRENDERED
          - calculations.lease_surrender_waterfall
          - state_machines.Engagement.WIND_DOWN_to_CLOSED
        distinguishing_aspect: |
          A different pair of entities and a different direction of dependency from the licence
          instance: an ACCEPTED FINAL settlement — correct basis, correct status, every store
          CLOSED — is still refused because a sibling entity two levels away (the store's
          LeaseDisposition) sits in AGREED rather than a terminal disposition. The identical
          finalize call succeeds once the lease is surrendered, and only then does the engagement
          reach CLOSED.
        test_recipe:
          setup:
            - "One FEE_BASED engagement (expense_responsibility LIQUIDATOR) with one NY store, 5,000,000 cents of ORIGINAL cost"
            - "One POSTED sales day of 4,200,000 cents on 800 ORIGINAL units, no expense items"
            - "LeaseDisposition negotiated to AGREED at 500,000 cents on 2026-09-15, surrender_deadline_date 2026-12-01, fixture reserve 900,000 cents"
            - "Clock advanced to 2026-10-16, store CLOSED, engagement in WIND_DOWN, one FINAL settlement PROPOSED then ACCEPTED"
