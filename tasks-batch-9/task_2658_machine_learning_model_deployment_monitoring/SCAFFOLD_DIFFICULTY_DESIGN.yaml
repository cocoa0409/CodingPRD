          Both rules are violated by the SAME request — the version is in DRAFT (no APPROVE
          transition is declared from there) and its dataset is REJECTED. The ladder must return
          ERR_INVALID_STATE. Repairing only the state (submit-for-review) and re-issuing the
          identical body then surfaces ERR_DATASET_NOT_APPROVED, proving the second violation was
          real and merely outranked.
        test_recipe:
