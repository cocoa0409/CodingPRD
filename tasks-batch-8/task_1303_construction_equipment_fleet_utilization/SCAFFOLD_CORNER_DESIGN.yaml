  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: unknown_role_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Priority-1 auth: X-User-Role naming an undeclared role ('Anonymous') -> 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /fleet/equipment"
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED, http 401"

      - name: service_due_blocks_assignment_create_with_idle_equipment
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_SERVICE_DUE]"]
        distinguishing_aspect: "The priority-9 maintenance gate fires in isolation: equipment IDLE (priority-8 passes) but SERVICE_DUE after threshold-crossing readings -> create rejected 409 ERR_SERVICE_DUE."
        test_recipe:
          setup: ["Class C401 service_interval_hours=50; Project P401 OPEN budget 100000000; Equipment E401 with 3x24000 milli readings -> SERVICE_DUE, availability IDLE (never assigned)"]
          setup_api_calls:
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-401", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 50, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
              captures: { c401_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-401", name: "P401", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p401_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-401", class_id: "${c401_id}", ownership: "OWNED", acquisition_cost_cents: 9000000, acquisition_date: "2026-02-01", useful_life_months: 48 }
              as: FleetAdmin
              captures: { e401_id: $.data.id }
            - call: "POST /fleet/equipment/${e401_id}/readings"
              payload: { recorded_date: "2026-08-03", engine_hours_delta_milli: 24000, fuel_used_milliliters: 12000 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e401_id}/readings"
              payload: { recorded_date: "2026-08-04", engine_hours_delta_milli: 24000, fuel_used_milliliters: 12000 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e401_id}/readings"
              payload: { recorded_date: "2026-08-05", engine_hours_delta_milli: 24000, fuel_used_milliliters: 12000 }
              as: FleetAdmin
            - call: "GET /fleet/equipment/${e401_id}"
              as: FleetAdmin
              captures: { e401_v: $.data.version, e401_maint: $.data.maintenance_status }
          trigger:
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e401_id}", project_id: "${p401_id}", start_date: "2026-08-06", end_date: "2026-08-10", expected_equipment_version: "${e401_v}" }
              as: FleetAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Precondition: maintenance_status == SERVICE_DUE with availability_status == IDLE"
            - "error_id == ERR_SERVICE_DUE, http 409 (priority 9 in isolation)"

      - name: damage_file_project_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_PROJECT_MISMATCH]"]
        distinguishing_aspect: "Filing against a project other than equipment.current_project_id -> 422 ERR_PROJECT_MISMATCH (cross-entity referential check at filing time)."
