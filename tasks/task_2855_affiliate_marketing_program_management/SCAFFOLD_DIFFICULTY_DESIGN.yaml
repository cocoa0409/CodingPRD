  - rule_id: boundary_precision_check
    instances:

      - name: cookie_window_half_open_millisecond_boundary_on_attribute
        grounds:
          - calculations.attribution_resolution
          - entities.TrackingLink.fields.cookie_window_days
          - entities.Conversion.fields.candidate_click_count
          - entities.AttributionDecision.fields.dedup_reason
        distinguishing_aspect: >-
          Three clicks separated by a single millisecond around the two ends of the
          30-day cookie window: the click exactly ON the inclusive lower bound
          attributes, the click one millisecond earlier does not, and the click
          exactly ON the strict upper bound (equal to placed_at) also does not — so
