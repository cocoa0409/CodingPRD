    side_effects: []

  - method: GET
    path: "/survey/dealers/{id}/flags"
    description: "List flags for a dealer"
    roles: [PlatformAdmin, ComplianceAuditor, RegionalManager, DealerPrincipal]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ManipulationFlag[]
    side_effects: []

  - method: POST
    path: "/survey/flags/{id}/resolve"
    description: "Resolve a flag (CONFIRMED or DISMISSED)"
    roles: [ComplianceAuditor]
    code: 200
    input: [outcome]
    output: ManipulationFlag
    side_effects: ["OPEN -> CONFIRMED or DISMISSED; on CONFIRMED: linked response EXCLUDED; dealer posture recompute; on SUSPENDED, dealer's DRAFT ActionPlans -> SUBMITTED"]

  # --- Incentive Statements ---
  - method: POST
    path: "/survey/statements"
    description: "Create a provisional incentive statement (OCC: expected_wave_version); supersedes any prior PROVISIONAL for the same (dealer_id, wave_id)"
    roles: [PlatformAdmin, RegionalManager]
    code: 201
    input: [dealer_id, wave_id, expected_wave_version]
    output: IncentiveStatement
    side_effects:
      - "Prior PROVISIONAL statement for the same (dealer_id, wave_id) transitions to SUPERSEDED; new statement's supersedes_id points to it"
      - "Computes tier, eligible_margin_cents, payout_cents per incentive_tiering"
      - "increments SurveyWave.version by 1"

  - method: GET
    path: "/survey/statements/{id}"
    description: "Get a statement"
    roles: [PlatformAdmin, RegionalManager, ComplianceAuditor, DealerPrincipal]
    code: 200
    input: []
    output: IncentiveStatement
    side_effects: []

  - method: GET
    path: "/survey/dealers/{id}/statements"
    description: "List statements for a dealer"
    roles: [PlatformAdmin, RegionalManager, ComplianceAuditor, DealerPrincipal]
    code: 200
    input: ["wave_id?", "limit?", "offset?"]
    output: IncentiveStatement[]
    side_effects: []

  - method: POST
    path: "/survey/statements/{id}/pay"
    description: "Mark a FINAL statement paid"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: IncentiveStatement
    side_effects: ["FINAL -> PAID"]

  # --- Action Plans ---
  - method: POST
    path: "/survey/action-plans"
    description: "Draft an action plan for an underperforming dealer"
    roles: [DealerPrincipal, FieldConsultant]
    code: 201
    input: [dealer_id, wave_id, title, items, due_date]
    output: ActionPlan
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/survey/action-plans/{id}"
    description: "Get an action plan (lazy OVERDUE re-evaluation)"
    roles: [PlatformAdmin, RegionalManager, FieldConsultant, DealerPrincipal]
    code: 200
    input: []
    output: ActionPlan
    side_effects: ["if status == IN_PROGRESS and logical clock >= due_date: status := OVERDUE"]

  - method: GET
    path: "/survey/dealers/{id}/action-plans"
    description: "List action plans for a dealer"
    roles: [PlatformAdmin, RegionalManager, FieldConsultant, DealerPrincipal]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ActionPlan[]
    side_effects: []

  - method: POST
    path: "/survey/action-plans/{id}/submit"
    description: "Submit plan for review"
    roles: [DealerPrincipal]
    code: 200
    input: []
    output: ActionPlan
    side_effects: ["DRAFT -> SUBMITTED"]

  - method: POST
    path: "/survey/action-plans/{id}/review"
    description: "Field consultant reviews a submitted plan"
    roles: [FieldConsultant]
    code: 200
    input: [outcome, review_note]
    output: ActionPlan
    side_effects: ["SUBMITTED -> APPROVED or REJECTED"]

  - method: POST
    path: "/survey/action-plans/{id}/revise"
    description: "Return a rejected plan to DRAFT for revision"
    roles: [DealerPrincipal]
    code: 200
    input: []
    output: ActionPlan
    side_effects: ["REJECTED -> DRAFT; review_note := null"]

  - method: POST
    path: "/survey/action-plans/{id}/start"
    description: "Begin execution of an approved plan"
    roles: [DealerPrincipal]
    code: 200
    input: []
    output: ActionPlan
    side_effects: ["APPROVED -> IN_PROGRESS"]

  - method: POST
    path: "/survey/action-plans/{id}/complete"
    description: "Mark an in-progress plan complete"
    roles: [FieldConsultant]
    code: 200
    input: []
    output: ActionPlan
    side_effects: ["IN_PROGRESS -> COMPLETED"]

  # --- Reverse-reachability GETs for remaining FKs (filtered-list form) ---
  - method: GET
    path: "/survey/transactions"
    description: "List transactions, filterable by parent ids"
    roles: [PlatformAdmin, ComplianceAuditor, RegionalManager]
    code: 200
    input: ["dealer_id?", "department_id?", "advisor_id?", "customer_id?", "kind?", "limit?", "offset?"]
    output: Transaction[]
    side_effects: []

  - method: GET
    path: "/survey/invitations"
    description: "List invitations, filterable by parent ids"
    roles: [PlatformAdmin, ComplianceAuditor, SurveyVendor, RegionalManager]
    code: 200
    input: ["transaction_id?", "customer_id?", "wave_id?", "question_set_id?", "status?", "limit?", "offset?"]
    output: SurveyInvitation[]
    side_effects: []

  - method: GET
    path: "/survey/responses"
    description: "List responses, filterable by invitation_id"
    roles: [PlatformAdmin, ComplianceAuditor, RegionalManager]
    code: 200
    input: ["invitation_id?", "status?", "limit?", "offset?"]
    output: SurveyResponse[]
    side_effects: []

  - method: GET
    path: "/survey/appeals"
    description: "List appeals, filterable by response_id or dealer_id"
    roles: [PlatformAdmin, ComplianceAuditor, RegionalManager]
    code: 200
    input: ["response_id?", "dealer_id?", "status?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []

  - method: GET
    path: "/survey/flags"
    description: "List manipulation flags, filterable by dealer_id or response_id"
    roles: [PlatformAdmin, ComplianceAuditor, RegionalManager]
    code: 200
    input: ["dealer_id?", "response_id?", "status?", "limit?", "offset?"]
    output: ManipulationFlag[]
    side_effects: []

  - method: GET
    path: "/survey/statements"
    description: "List incentive statements, filterable by dealer_id, wave_id, supersedes_id"
    roles: [PlatformAdmin, RegionalManager, ComplianceAuditor]
    code: 200
    input: ["dealer_id?", "wave_id?", "supersedes_id?", "status?", "limit?", "offset?"]
    output: IncentiveStatement[]
    side_effects: []

  - method: GET
    path: "/survey/action-plans"
    description: "List action plans, filterable by dealer_id or wave_id"
    roles: [PlatformAdmin, RegionalManager, FieldConsultant, ComplianceAuditor]
    code: 200
    input: ["dealer_id?", "wave_id?", "status?", "limit?", "offset?"]
    output: ActionPlan[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Entity-backed X-User-ID does not own the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, wrong type, or malformed value" }
  - { id: ERR_VALIDATION, http: 400, condition: "Structural constraint violated (uniqueness, schema of nested fields, weights positive, etc.)" }
  - { id: ERR_CROSS_REFERENCE_MISMATCH, http: 422, condition: "Department does not belong to dealer, advisor does not belong to department, or appeal dealer mismatch" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in valid from-state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version mismatch on OCC-guarded endpoint" }
  - { id: ERR_ACTIVE_QUESTION_SET_EXISTS, http: 409, condition: "Activating a question set while another is ACTIVE" }
  - { id: ERR_QUESTION_SET_NOT_ACTIVE, http: 409, condition: "Wave open attempted against a question set not in ACTIVE status" }
  - { id: ERR_WAVE_NOT_OPEN, http: 409, condition: "Send or sampling action attempted when wave is not OPEN" }
  - { id: ERR_WAVE_STILL_OPEN, http: 422, condition: "Close attempted before logical clock reached period_end" }
  - { id: ERR_RESPONSE_WINDOW_CLOSED, http: 422, condition: "Response submitted at or after window_closes_at (exclusive upper bound)" }
  - { id: ERR_CONTACT_RESTRICTED, http: 422, condition: "Customer.do_not_contact is true at send time" }
  - { id: ERR_APPEAL_ALREADY_OPEN, http: 409, condition: "Second appeal on a response that already has an open appeal" }
  - { id: ERR_APPEALS_PENDING, http: 409, condition: "Wave finalize blocked: open appeals on this wave's responses" }
  - { id: ERR_FLAGS_PENDING, http: 409, condition: "Wave finalize blocked: open manipulation flags on this wave's dealers" }
  - { id: ERR_DEALER_SUSPENDED, http: 422, condition: "SUSPENDED dealer attempted a self-serve plan submission" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Toyota corporate operations; configures regions, dealers, question sets, waves; finalizes and pays"
    identity: opaque
    exclusive_operations:
      - "POST /survey/_clock/set_current_utc"
      - "POST /survey/regions"
      - "POST /survey/dealers"
      - "POST /survey/departments"
      - "POST /survey/advisors"
      - "POST /survey/customers"
      - "POST /survey/question-sets and activate/retire"
      - "POST /survey/waves and open/close/finalize"
      - "POST /survey/transactions"
      - "POST /survey/statements/{id}/pay"
    shared_operations:
      - "GET reads across all resources"
      - "POST /survey/statements"

  - name: RegionalManager
    description: "Regional oversight; assigns appeals, reviews benchmarks, can create statements"
    identity: opaque
    exclusive_operations:
      - "POST /survey/appeals/{id}/assign"
    shared_operations:
      - "GET reads across waves, dealers, statements, benchmarks, flags"
      - "POST /survey/statements"

  - name: FieldConsultant
    description: "Factory field staff; reviews and approves action plans, marks them complete"
    identity: opaque
    exclusive_operations:
      - "POST /survey/action-plans/{id}/review"
      - "POST /survey/action-plans/{id}/complete"
    shared_operations:
      - "POST /survey/action-plans (drafting on dealer's behalf)"
      - "GET reads across dealers, plans, waves"

  - name: ComplianceAuditor
    description: "Independent compliance role; files/resolves manipulation flags, decides appeals, suppresses invitations. Segregated from PlatformAdmin (cannot open/close waves) and from FieldConsultant (cannot review plans)."
    identity: opaque
    exclusive_operations:
      - "POST /survey/flags"
      - "POST /survey/flags/{id}/resolve"
      - "POST /survey/appeals/{id}/decide"
      - "POST /survey/invitations/{id}/suppress"
    shared_operations:
      - "GET reads across all resources"

  - name: SurveyVendor
    description: "Third-party survey administrator; sends invitations"
    identity: opaque
    exclusive_operations:
      - "POST /survey/invitations/{id}/send"
    shared_operations:
      - "GET /survey/invitations/{id}"
      - "GET /survey/waves/{id}/invitations"

  - name: DealerPrincipal
    description: "Owner-principal of a dealer; files appeals, drafts/submits/revises/starts action plans"
    identity: entity_backed:Dealer
    exclusive_operations:
      - "POST /survey/appeals"
      - "POST /survey/action-plans/{id}/submit"
      - "POST /survey/action-plans/{id}/revise"
      - "POST /survey/action-plans/{id}/start"
    shared_operations:
      - "POST /survey/action-plans (drafting own)"
      - "GET reads scoped to own dealer"

  - name: Customer
    description: "Vehicle owner responding to a survey invitation"
    identity: entity_backed:Customer
    exclusive_operations:
      - "POST /survey/invitations/{id}/responses"
      - "POST /survey/invitations/{id}/opt-out"
    shared_operations:
      - "GET /survey/invitations/{id} (own)"

