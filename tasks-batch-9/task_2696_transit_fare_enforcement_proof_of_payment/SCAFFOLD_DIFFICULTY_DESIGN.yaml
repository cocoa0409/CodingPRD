      - name: signage_compliance_exactly_nine_tenths_permits_designation
        grounds:
          - calculations.zone_signage_compliance_pct
          - validations[priority=25]
          - state_machines.FareZone.PENDING_SIGNAGE_to_DESIGNATED
          - errors.ERR_SIGNAGE_BELOW_THRESHOLD
        distinguishing_aspect: |
          A third boundary on a third resource: the SIGNAGE_MIN_PCT gate on FareZone. 8 of 10 signs
          is 0.8000 and designation is refused with ERR_SIGNAGE_BELOW_THRESHOLD; a later audit of 9
          of 10 lands on exactly 0.9000 and designation succeeds. The latest-audit selection is part
          of the boundary — the deficient 8-sign audit is not averaged with the 9-sign audit, it is
          superseded by the later audited_at, so the stored compliance is 0.9000 and not 0.8500.
        test_recipe:
          setup:
            - "Zone Z1 exists with required_sign_count 10 and one ZoneLineAssignment, in designation_status PENDING_SIGNAGE."
            - "A single SignageAudit at 2026-08-01T01:00:00Z recorded 8 verified signs, so signage_compliance_pct == 0.8000."
            - "Logical clock at 2026-08-01T02:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones"
              payload: { zone_code: "Z1", name: "Downtown POP Zone", required_sign_count: 10, penalty_multiplier_bps: 12000, enforcement_policy: "CITATION_IMMEDIATE", max_concurrent_deployments: 2 }
              as: EnforcementPlanner
              captures: { z1: $.data.id }
            - call: "POST /transit-lines"
              payload: { line_code: "L1", mode: "LIGHT_RAIL", daily_boardings: 42000, baseline_evasion_rate_bps: 600 }
              as: EnforcementPlanner
              captures: { l1: $.data.id }
            - call: "POST /zone-line-assignments"
              payload: { zone_id: "${z1}", line_id: "${l1}", platform_segment_count: 4, effective_from: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones/${z1}/submit-for-signage"
              payload: {}
              as: EnforcementPlanner
            - call: "POST /signage-audits"
              payload: { zone_id: "${z1}", audited_at: "2026-08-01T01:00:00Z", signs_verified_count: 8, deficiency_note: "Two shelter signs still missing." }
              as: EnforcementPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T02:00:00Z" }
              as: EnforcementPlanner
          trigger:
            - call: "POST /fare-zones/${z1}/designate"
              payload: {}
              as: EnforcementPlanner
              captures: { err_signage: $.data.error_id }
            - call: "POST /signage-audits"
              payload: { zone_id: "${z1}", audited_at: "2026-08-01T03:00:00Z", signs_verified_count: 9, deficiency_note: "One shelter sign remains outstanding." }
              as: EnforcementPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T04:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones/${z1}/designate"
              payload: {}
              as: EnforcementPlanner
          assert:
            - "at 8 of 10: FareZone.${z1}.signage_compliance_pct == 0.8000 and the designate returns HTTP 409 with ${err_signage} == ERR_SIGNAGE_BELOW_THRESHOLD"
            - "at 8 of 10: FareZone.${z1}.designation_status == PENDING_SIGNAGE unchanged"
            - "after the 9-sign audit: FareZone.${z1}.verified_sign_count == 9 (latest audit wins, no averaging)"
            - "after the 9-sign audit: FareZone.${z1}.signage_compliance_pct == 0.9000 exactly, not 0.8500"
            - "the second designate returns HTTP 200 with FareZone.${z1}.designation_status == DESIGNATED"
            - "FareZone.${z1}.designated_at == 2026-08-01T04:00:00Z"
            - "GET /fare-zones/${z1}/signage-audits returns exactly 2 rows (the append-only trail keeps the 8-sign audit)"

  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: deployment_activation_depends_on_fare_zone_designation_state
        grounds:
          - validations[priority=24]
          - state_machines.InspectionDeployment.PLANNED_to_ACTIVE
          - state_machines.FareZone.PENDING_SIGNAGE_to_DESIGNATED
          - errors.ERR_ZONE_NOT_DESIGNATED
        distinguishing_aspect: |
          Entity pair FareZone -> InspectionDeployment. The deployment's own status is a perfectly
          valid PLANNED and its window has opened, so every field the request touches is in order;
          the activation still fails because a DIFFERENT entity, the zone, is only PENDING_SIGNAGE.
          Designating the zone changes nothing on the deployment row, yet the identical activation
          call now succeeds — the dependency is on the other entity's live state, not on any copied
          flag.
        test_recipe:
          setup:
            - "Zone Z1 has one ZoneLineAssignment for line L1 and a 10-of-10 signage audit, but is still PENDING_SIGNAGE."
            - "Deployment D1 on L1 in Z1 is PLANNED for 2026-08-05T06:00:00Z..14:00:00Z."
