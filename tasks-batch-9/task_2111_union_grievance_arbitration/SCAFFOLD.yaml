# =============================================================================
# SCAFFOLD — Union Grievance & Arbitration Tracking (labor relations office)
# Sections §1.0 – §1.7. Difficulty design (§1.8) and corner design (§1.9) live
# in SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: "desgin task harder than expert level.!!!!2111. Union Grievance & Arbitration Tracking (labor relations office): grievance intake & step timeline compliance, step meeting scheduling & response deadlines, settlement authority & precedent review, arbitration demand & arbitrator selection, case file preparation & witness coordination, award implementation & remedy calculation, grievance trend analysis by supervisor/clause, cost tracking per case"

domain_name: union-grievance-arbitration
api_prefix: /labor-relations

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: expert_plus
  notes: |
    Every contractual deadline is measured against a logical clock that starts at
    2026-08-01T00:00:00Z and only moves via POST /_clock/set_current_utc. Grievance
    procedural status is cyclic (ANSWERED -> APPEALED -> STEP_MEETING_SCHEDULED ->
    AWAITING_RESPONSE -> ANSWERED, up to step 3). ArbitrationDemand carries two
    independent state dimensions on one row (`status` and `prep_status`) that gate
    each other. Employee is self-referential through `supervisor_id`, and PanelStrike
    is the many-to-many junction between ArbitrationDemand and Arbitrator.

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  - name: BargainingUnit
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - name: name
        type: string
        source: input
        description: "Display name of the bargaining unit."
      - name: local_number
        type: string
        source: input
        description: "Union local identifier; globally unique across BargainingUnit."
        constraints: "unique; 1-32 chars"
      - name: contract_effective_date
        type: datetime
        source: input
        description: "First instant the collective agreement is in force (ISO 8601 UTC)."
      - name: contract_expiry_date
        type: datetime
        source: input
        description: "Instant the collective agreement expires; must be strictly after contract_effective_date."
      - name: step1_response_days
        type: integer
        source: input
        default: 10
        description: "Calendar days the employer has to answer a step-1 meeting."
        constraints: ">= 1"
      - name: step2_response_days
        type: integer
        source: input
        default: 15
        description: "Calendar days the employer has to answer a step-2 meeting."
        constraints: ">= 1"
      - name: step3_response_days
        type: integer
        source: input
        default: 20
        description: "Calendar days the employer has to answer a step-3 meeting."
        constraints: ">= 1"
      - name: appeal_window_days
        type: integer
        source: input
        default: 7
        description: "Calendar days the union has to appeal after a step is resolved."
        constraints: ">= 1"
      - name: filing_window_days
        type: integer
        source: input
        default: 30
        description: "Calendar days from discovery_date within which a grievance must be filed."
        constraints: ">= 1"
      - name: arbitration_demand_days
        type: integer
        source: input
        default: 21
        description: "Calendar days after step-3 resolution within which arbitration must be demanded."
        constraints: ">= 1"
      - name: tolling_enabled
        type: boolean
        source: input
        default: false
        description: "When false, any step scheduled with extension_days > 0 is rejected."
      - name: director_authority_cents
        type: integer
        source: input
        default: 250000
        description: "Highest settlement exposure a LaborRelationsDirector may authorize (inclusive)."
        constraints: ">= 0"
      - name: negotiator_authority_cents
        type: integer
        source: input
        default: 1500000
        description: "Highest settlement exposure a ChiefNegotiator may authorize (inclusive); must exceed director_authority_cents."
        constraints: "> director_authority_cents"
      - name: precedent_deviation_tolerance_bps
        type: integer
        source: input
        default: 2000
        description: "Basis points of deviation from a cited precedent tolerated before the authority tier escalates one level."
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "ACTIVE while logical-clock now < contract_expiry_date, otherwise EXPIRED. Evaluated at read time and at every write that names this unit."
        constraints: "ACTIVE | EXPIRED"
      - name: open_grievance_count
        type: integer
        source: computed
        description: "Count of Grievance rows for this unit whose status is not in {SETTLED, WITHDRAWN, CONSOLIDATED, CLOSED}. Evaluated at read time."

  - name: ContractClause
    parent: BargainingUnit
    common_fields: true
    kind: configuration
    fields:
      - name: bargaining_unit_id
        type: string
        source: input
        description: "FK -> BargainingUnit.id; the agreement this clause belongs to."
      - name: clause_number
        type: string
        source: input
        description: "Article/clause designator; unique within its bargaining_unit_id."
        constraints: "unique per bargaining_unit_id"
      - name: title
        type: string
        source: input
        description: "Human-readable clause title."
      - name: category
        type: enum
        source: input
        description: "Subject-matter classification used by trend analysis."
        constraints: "DISCIPLINE | PAY | SENIORITY | SAFETY | LEAVE | SUBCONTRACTING"
      - name: is_arbitrable
        type: boolean
        source: input
        default: true
        description: "When false, no ArbitrationDemand may be created for a grievance citing this clause."
      - name: monetary_cap_cents
        type: integer
        source: input
        default: null
        description: "Hard ceiling applied to settlement exposure for grievances citing this clause; null means uncapped."
        constraints: "null or >= 0"
      - name: expedited
        type: boolean
        source: input
        default: false
        description: "When true, the filing window and every step response window are halved with ceiling rounding."
      - name: filed_count
        type: integer
        source: computed
        description: "Count of Grievance rows citing this clause whose status is not CONSOLIDATED. Evaluated at read time."
      - name: sustained_count
        type: integer
        source: computed
        description: "Count of Grievance rows citing this clause (status != CONSOLIDATED) meeting the adverse_outcome predicate of calculations.supervisor_clause_trend_metrics. Evaluated at read time."
      - name: denied_count
        type: integer
        source: computed
        description: "Count of Grievance rows citing this clause with status in {SETTLED, WITHDRAWN, CLOSED} that do NOT meet the adverse_outcome predicate. Evaluated at read time."
      - name: sustain_rate_bps
        type: integer
        source: computed
        description: "round_half_up(sustained_count * 10000 / filed_count); exactly 0 when filed_count == 0. Evaluated at read time."

  - name: Employee
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: bargaining_unit_id
        type: string
        source: input
        description: "FK -> BargainingUnit.id; the unit this person belongs to."
      - name: supervisor_id
        type: string
        source: input
        default: null
        description: "FK -> Employee.id; self-referential reporting line, null at the top of the chain."
      - name: full_name
        type: string
        source: input
        description: "Person's display name."
      - name: employee_number
        type: string
        source: input
        description: "Payroll identifier; unique within its bargaining_unit_id."
        constraints: "unique per bargaining_unit_id"
      - name: hire_date
        type: datetime
        source: input
        description: "Date of hire (ISO 8601 UTC)."
      - name: seniority_date
        type: datetime
        source: input
        description: "Seniority anchor date; must be >= hire_date."
      - name: hourly_rate_cents
        type: integer
        source: input
        description: "Straight-time hourly rate in cents; drives back-pay, reinstatement loading and release-time cost."
        constraints: "> 0"
      - name: classification
        type: enum
        source: input
        description: "Job classification."
        constraints: "PRODUCTION | MAINTENANCE | CLERICAL | SUPERVISOR"
      - name: employment_status
        type: enum
        source: input
        default: ACTIVE
        description: "Current employment standing. Accepted as input at creation; thereafter only award implementation moves it to REINSTATED."
        constraints: "ACTIVE | SUSPENDED | TERMINATED | REINSTATED"
      - name: open_grievance_count
        type: integer
        source: computed
        description: "Count of Grievance rows whose respondent_supervisor_id is this employee and whose status is not in {SETTLED, WITHDRAWN, CONSOLIDATED, CLOSED}. Evaluated at read time."
      - name: closed_grievance_count
        type: integer
        source: computed
        description: "Count of Grievance rows whose respondent_supervisor_id is this employee and whose status is in {SETTLED, WITHDRAWN, CLOSED}. CONSOLIDATED rows are excluded from both numerator and denominator. Evaluated at read time."
      - name: sustained_against_count
        type: integer
        source: computed
        description: "Count of the closed_grievance_count set that also meets the adverse_outcome predicate of calculations.supervisor_clause_trend_metrics. Evaluated at read time."
      - name: adverse_rate_bps
        type: integer
        source: computed
        description: "round_half_up(sustained_against_count * 10000 / closed_grievance_count); exactly 0 when closed_grievance_count == 0. Evaluated at read time."
      - name: witness_release_hours_ytd
        type: number
        source: computed
        description: "Sum of WitnessAssignment.release_hours for this employee across all demands where the assignment status is in {CONFIRMED, TESTIFIED}. Evaluated at read time."

  - name: Grievance
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: bargaining_unit_id
        type: string
        source: input
        description: "FK -> BargainingUnit.id; the agreement under which the grievance is filed."
      - name: grievant_id
        type: string
        source: input
        description: "FK -> Employee.id; the aggrieved bargaining-unit member."
      - name: respondent_supervisor_id
        type: string
        source: input
        description: "FK -> Employee.id; the supervisor whose action is grieved; drives supervisor trend analysis."
      - name: clause_id
        type: string
        source: input
        description: "FK -> ContractClause.id; the contract clause alleged to have been violated."
      - name: consolidated_into_id
        type: string
        source: system
        default: null
        description: "FK -> Grievance.id; set when this grievance is folded into a surviving grievance."
      - name: case_number
        type: string
        source: system
        description: "GR-{bargaining_unit.local_number}-{seq} where seq is the 4-digit zero-padded ordinal of this grievance within its unit ordered by created_at ASC, starting at 0001."
      - name: statement
        type: string
        source: input
        description: "Narrative statement of the grievance."
      - name: incident_date
        type: datetime
        source: input
        description: "Instant the grieved act occurred."
      - name: discovery_date
        type: datetime
        source: input
        description: "Instant the union became aware of the act; must satisfy incident_date <= discovery_date <= logical-clock now."
      - name: filed_at
        type: datetime
        source: system
        description: "Logical-clock now at intake."
      - name: filed_by_steward_employee_id
        type: string
        source: system
        description: "X-User-ID of the UnionSteward who filed the grievance; the only steward permitted to take union-side actions on it."
      - name: current_step
        type: integer
        source: system
        default: 1
        description: "Grievance-procedure step currently in play."
        constraints: "1 | 2 | 3"
      - name: status
        type: enum
        source: system
        default: FILED
        description: "Procedural status; see state_machines[Grievance.status]."
        constraints: "FILED | STEP_MEETING_SCHEDULED | AWAITING_RESPONSE | ANSWERED | APPEALED | ARBITRATION_DEMANDED | AWARDED | SETTLED | WITHDRAWN | CONSOLIDATED | CLOSED"
      - name: timeliness_state
        type: enum
        source: computed
        default: TIMELY
        description: "Compliance posture derived by calculations.grievance_timeliness_posture; frozen at its last value once status becomes terminal."
        constraints: "TIMELY | TOLLED | EMPLOYER_DEFAULT | UNION_DEFAULT | BARRED"
      - name: remedy_requested_cents
        type: integer
        source: input
        default: 0
        description: "Monetary remedy demanded at intake."
        constraints: ">= 0"
      - name: back_pay_hours_claimed
        type: number
        source: input
        default: 0
        description: "Back-pay hours demanded at intake."
        constraints: ">= 0"
      - name: settled_amount_cents
        type: integer
        source: system
        default: 0
        description: "Money the employer has committed through a step grant or an accepted settlement offer; offsets award remedies."
      - name: appeal_deadline_at
        type: datetime
        source: computed
        description: "Resolution instant of the latest resolved GrievanceStep plus bargaining_unit.appeal_window_days; null when no step is resolved."
      - name: arbitration_deadline_at
        type: datetime
        source: computed
        description: "Resolution instant of the step-3 GrievanceStep plus bargaining_unit.arbitration_demand_days; null unless current_step == 3 and that step is resolved."
      - name: total_cost_cents
        type: integer
        source: computed
        description: "Output of calculations.case_cost_allocation; always equals union_cost_share_cents + employer_cost_share_cents."
      - name: union_cost_share_cents
        type: integer
        source: computed
        description: "Union portion produced by calculations.case_cost_allocation."
      - name: employer_cost_share_cents
        type: integer
        source: computed
        description: "Employer portion produced by calculations.case_cost_allocation, inclusive of the administrative fee."
      - name: cost_posture
        type: enum
        source: computed
        description: "COST_OK when total_cost_cents <= 1000000; COST_WATCH when <= 5000000; COST_BREACH above that."
        constraints: "COST_OK | COST_WATCH | COST_BREACH"

  - name: GrievanceStep
    parent: Grievance
    common_fields: true
    kind: resource
    fields:
      - name: grievance_id
        type: string
        source: input
        description: "FK -> Grievance.id; the grievance this step belongs to."
      - name: step_number
        type: integer
        source: system
        description: "Copied from Grievance.current_step at creation."
        constraints: "1 | 2 | 3"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "See state_machines[GrievanceStep.status]."
        constraints: "SCHEDULED | HELD | ANSWERED | DEEMED_DENIED | CANCELLED"
      - name: meeting_scheduled_at
        type: datetime
        source: input
        description: "Agreed meeting instant; must be strictly after logical-clock now at creation."
      - name: extension_days
        type: integer
        source: input
        default: 0
        description: "Mutually agreed extra calendar days added to the response deadline; requires bargaining_unit.tolling_enabled."
        constraints: ">= 0"
      - name: meeting_held_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock now when the meeting was recorded as held."
      - name: response_due_at
        type: datetime
        source: computed
        default: null
        description: "Output of calculations.step_response_deadline; null until the meeting is held."
      - name: responded_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock now when the employer answer was recorded."
      - name: disposition
        type: enum
        source: input
        default: null
        description: "Employer answer recorded at respond time."
        constraints: "GRANTED | PARTIAL | DENIED | null"
      - name: response_summary
        type: string
        source: input
        default: null
        description: "Narrative of the employer answer."
      - name: granted_amount_cents
        type: integer
        source: input
        default: 0
        description: "Money conceded at this step; permitted only when disposition is GRANTED or PARTIAL."
        constraints: ">= 0"
      - name: responded_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the operator who recorded the employer answer; consumed by the segregation-of-duties check on settlement authorization."
      - name: late_by_days
        type: integer
        source: computed
        default: 0
        description: "max(0, floor calendar days between response_due_at and responded_at); 0 while unanswered or answered on time."

  - name: SettlementOffer
    parent: Grievance
    common_fields: true
    kind: resource
    fields:
      - name: grievance_id
        type: string
        source: input
        description: "FK -> Grievance.id; the grievance being settled."
      - name: precedent_case_id
        type: string
        source: input
        default: null
        description: "FK -> PrecedentCase.id; the precedent relied upon during settlement authority review; null when none is cited."
      - name: offering_party
        type: enum
        source: input
        description: "Party putting the terms on the table; must match the acting role's party."
        constraints: "UNION | EMPLOYER"
      - name: monetary_cents
        type: integer
        source: input
        description: "Lump-sum money component of the offer."
        constraints: ">= 0"
      - name: back_pay_hours
        type: number
        source: input
        default: 0
        description: "Back-pay hours component, priced at the grievant's hourly_rate_cents."
        constraints: ">= 0"
      - name: remedy_terms
        type: enum
        source: input
        default: NONE
        description: "Non-monetary term bundle; each maps to a loading amount in calculations.settlement_exposure_authority_tier."
        constraints: "NONE | RECORD_EXPUNGEMENT | SENIORITY_RESTORATION | POLICY_CHANGE | REINSTATEMENT"
      - name: precedent_setting
        type: boolean
        source: input
        default: false
        description: "When true a 1.25 multiplier is applied to raw exposure before the clause cap."
      - name: round_number
        type: integer
        source: system
        default: 1
        description: "Negotiation round; a counter-offer is created at the responded offer's round_number + 1."
      - name: exposure_cents
        type: integer
        source: computed
        description: "Output of calculations.settlement_exposure_authority_tier; recomputed at creation and re-verified at authorization."
      - name: authority_tier
        type: enum
        source: computed
        description: "Authority level required to authorize this offer, after any precedent-deviation escalation."
        constraints: "ANALYST | DIRECTOR | NEGOTIATOR | BOARD"
      - name: precedent_deviation_bps
        type: integer
        source: computed
        default: null
        description: "Basis-point deviation of exposure_cents from the scope-adjusted cited precedent value; null when precedent_case_id is null."
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "See state_machines[SettlementOffer.status]."
        constraints: "DRAFT | AUTHORIZED | COUNTERED | ACCEPTED | REJECTED | LAPSED | VOIDED"
      - name: prepared_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who drafted the offer."
      - name: authorized_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the operator who authorized the offer."
      - name: authorized_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock now at authorization."
      - name: expires_at
        type: datetime
        source: computed
        default: null
        description: "authorized_at + OFFER_VALIDITY_DAYS (10); null while the offer is a DRAFT."

  - name: PrecedentCase
    parent: null
    common_fields: false
    kind: configuration
    fields:
      - name: clause_id
        type: string
        source: input
        description: "FK -> ContractClause.id; the clause the precedent construes."
      - name: citation
        type: string
        source: input
        description: "Reporter citation; globally unique across PrecedentCase."
        constraints: "unique"
      - name: decided_on
        type: datetime
        source: input
        description: "Date the precedent award issued."
      - name: outcome
        type: enum
        source: input
        description: "Disposition of the precedent case."
        constraints: "SUSTAINED | DENIED | SPLIT"
      - name: monetary_value_cents
        type: integer
        source: input
        description: "Money value recognised by the precedent award."
        constraints: ">= 0"
      - name: binding_scope
        type: enum
        source: input
        description: "Breadth of the precedent; maps to a scope factor of 1.00 / 0.75 / 0.50."
        constraints: "UNIT_WIDE | DEPARTMENT | INDIVIDUAL"
      - name: arbitrator_name
        type: string
        source: input
        description: "Name of the arbitrator who issued the precedent award."
      - name: cited_count
        type: integer
        source: computed
        description: "Count of SettlementOffer rows whose precedent_case_id is this row and whose status is not VOIDED. Evaluated at read time."

  - name: Arbitrator
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: full_name
        type: string
        source: input
        description: "Arbitrator's name."
      - name: panel_memberships
        type: array
        source: input
        description: "Panels this arbitrator sits on; a demand may only draw candidates whose memberships contain its panel_source."
        constraints: "non-empty array of AAA | FMCS | PERMANENT_UMPIRE"
      - name: per_diem_cents
        type: integer
        source: input
        description: "Daily fee in cents; also the ranking tie-breaker for panel selection."
        constraints: "> 0"
      - name: cancellation_fee_cents
        type: integer
        source: input
        description: "Fee charged when a scheduled hearing is abandoned."
        constraints: ">= 0"
      - name: travel_buffer_hours
        type: integer
        source: input
        default: 24
        description: "Hours of travel padding applied on BOTH sides of every scheduled hearing when testing calendar conflicts."
        constraints: ">= 0"
      - name: earliest_available_at
        type: datetime
        source: input
        description: "First instant the arbitrator will accept work; candidates must satisfy earliest_available_at <= demanded_at + 90 days."
      - name: max_concurrent_cases
        type: integer
        source: input
        default: 3
        description: "Engagement ceiling; when active_case_count reaches it the arbitrator's status becomes FULL."
        constraints: ">= 1"
      - name: is_active
        type: boolean
        source: input
        default: true
        description: "Roster flag; false removes the arbitrator from candidate pools and blocks hearing scheduling."
      - name: active_case_count
        type: integer
        source: system
        default: 0
        description: "Number of ArbitrationDemand rows currently engaging this arbitrator (status in {ARBITRATOR_SELECTED, HEARING_SCHEDULED, HEARD}); incremented on selection and decremented on award issuance, withdrawal or pre-hearing settlement."
      - name: status
        type: enum
        source: computed
        description: "INACTIVE when is_active is false; otherwise FULL when active_case_count >= max_concurrent_cases; otherwise AVAILABLE."
        constraints: "AVAILABLE | FULL | INACTIVE"

  - name: ArbitrationDemand
    parent: Grievance
    common_fields: true
    kind: resource
    fields:
      - name: grievance_id
        type: string
        source: input
        description: "FK -> Grievance.id; the grievance taken to arbitration."
      - name: selected_arbitrator_id
        type: string
        source: system
        default: null
        description: "FK -> Arbitrator.id; the single survivor of the alternate-strike process."
      - name: demanded_at
        type: datetime
        source: system
        description: "Logical-clock now when the demand was filed."
      - name: demand_deadline_at
        type: datetime
        source: computed
        description: "Copied from Grievance.arbitration_deadline_at at creation; the instant after which the demand would have been untimely."
      - name: panel_source
        type: enum
        source: input
        description: "Source of the arbitrator panel."
        constraints: "AAA | FMCS | PERMANENT_UMPIRE"
      - name: panel_size
        type: integer
        source: input
        description: "Number of candidates requested for the strike list."
        constraints: "3 | 5 | 7"
      - name: panel_arbitrator_ids
        type: array
        source: system
        default: []
        description: "Ordered candidate list produced by calculations.panel_candidate_selection; empty until the panel is requested."
      - name: strike_turn
        type: enum
        source: system
        default: null
        description: "Party entitled to take the next strike; UNION strikes first."
        constraints: "UNION | EMPLOYER | null"
      - name: strikes_taken
        type: integer
        source: system
        default: 0
        description: "Number of PanelStrike rows recorded against this demand."
      - name: status
        type: enum
        source: system
        default: DEMANDED
        description: "Procedural dimension; see state_machines[ArbitrationDemand.status]."
        constraints: "DEMANDED | PANEL_ISSUED | STRIKING | ARBITRATOR_SELECTED | HEARING_SCHEDULED | HEARD | AWARDED | WITHDRAWN | SETTLED_PRE_HEARING"
      - name: prep_status
        type: enum
        source: system
        default: PREP_NOT_STARTED
        description: "Case-file preparation dimension, independent of status; see state_machines[ArbitrationDemand.prep_status]."
        constraints: "PREP_NOT_STARTED | PREP_DEFICIENT | EXHIBITS_FILED | BRIEFS_FILED | PREP_READY"
      - name: exhibit_count
        type: integer
        source: input
        default: 0
        description: "Number of exhibits recorded by the most recent EXHIBIT_LIST filing."
      - name: hearing_start_at
        type: datetime
        source: input
        default: null
        description: "First instant of the scheduled hearing."
      - name: hearing_end_at
        type: datetime
        source: input
        default: null
        description: "Last instant of the scheduled hearing; must be strictly after hearing_start_at."
      - name: brief_due_at
        type: datetime
        source: computed
        default: null
        description: "hearing_end_at + BRIEF_DAYS_AFTER_HEARING (30); null until the hearing is scheduled."
      - name: readiness_score
        type: integer
        source: computed
        description: "40 when prep_status is in {EXHIBITS_FILED, BRIEFS_FILED, PREP_READY}, plus 30 when in {BRIEFS_FILED, PREP_READY}, plus 20 when at least one WitnessAssignment on this demand has status CONFIRMED, plus 10 when status is in {HEARING_SCHEDULED, HEARD, AWARDED}. Evaluated at read time."
      - name: estimated_cost_cents
        type: integer
        source: computed
        default: 0
        description: "Forward-looking variant of calculations.arbitration_case_cost; 0 until a hearing is scheduled."
      - name: actual_cost_cents
        type: integer
        source: computed
        description: "Chronological variant of calculations.arbitration_case_cost. Evaluated at read time."

  - name: PanelStrike
    parent: ArbitrationDemand
    common_fields: false
    kind: event
    fields:
      - name: arbitration_demand_id
        type: string
        source: input
        description: "FK -> ArbitrationDemand.id; the demand whose panel is being struck."
      - name: arbitrator_id
        type: string
        source: input
        description: "FK -> Arbitrator.id; the candidate removed from the panel."
      - name: struck_by
        type: enum
        source: system
        description: "Party that took the strike, derived from the acting role's party."
        constraints: "UNION | EMPLOYER"
      - name: strike_order
        type: integer
        source: system
        description: "1-based ordinal of this strike within its demand."
      - name: struck_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who took the strike."

  - name: WitnessAssignment
    parent: ArbitrationDemand
    common_fields: true
    kind: resource
    fields:
      - name: arbitration_demand_id
        type: string
        source: input
        description: "FK -> ArbitrationDemand.id; the case the witness is called in."
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; the bargaining-unit member called to testify."
      - name: witness_type
        type: enum
        source: input
        description: "Nature of the testimony."
        constraints: "FACT | EXPERT | CHARACTER"
      - name: called_by
        type: enum
        source: input
        description: "Party calling the witness."
        constraints: "UNION | EMPLOYER"
      - name: slot_start_at
        type: datetime
        source: input
        description: "First instant of the reserved testimony slot; slots are half-open [slot_start_at, slot_end_at)."
      - name: slot_end_at
        type: datetime
        source: input
        description: "Exclusive end of the reserved testimony slot; must be strictly after slot_start_at."
      - name: release_hours
        type: number
        source: computed
        description: "Output of calculations.witness_release_cost: raw slot hours plus PREP_ALLOWANCE_HOURS, rounded UP to the next 0.25."
      - name: release_cost_cents
        type: integer
        source: computed
        description: "round_half_up(release_hours * employee.hourly_rate_cents)."
      - name: status
        type: enum
        source: system
        default: INVITED
        description: "See state_machines[WitnessAssignment.status]."
        constraints: "INVITED | CONFIRMED | TESTIFIED | EXCUSED | NO_SHOW"
      - name: confirmed_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the operator who approved the release."
      - name: release_cost_entry_id
        type: string
        source: system
        default: null
        description: "Identifier of the RELEASE_TIME CostEntry created when the assignment was confirmed; that entry is voided when the assignment becomes NO_SHOW."

  - name: Award
    parent: ArbitrationDemand
    common_fields: true
    kind: resource
    fields:
      - name: arbitration_demand_id
        type: string
        source: input
        description: "FK -> ArbitrationDemand.id; the arbitrated case this award decides."
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock now when the award was recorded."
      - name: outcome
        type: enum
        source: input
        description: "Disposition of the arbitration."
        constraints: "SUSTAINED | DENIED | SPLIT"
      - name: sustained_fraction_bps
        type: integer
        source: input
        default: 10000
        description: "Fraction of the ordered back pay actually sustained, in basis points; must be 10000 for SUSTAINED, 0 for DENIED, and strictly between 0 and 10000 for SPLIT."
        constraints: "0 .. 10000"
      - name: back_pay_hours_ordered
        type: number
        source: input
        default: 0
        description: "Back-pay hours the award orders, priced at the grievant's hourly_rate_cents."
        constraints: ">= 0"
      - name: mitigation_offset_cents
        type: integer
        source: input
        default: 0
        description: "Interim earnings deducted from the gross remedy when computing the net remedy."
        constraints: ">= 0"
      - name: interest_rate_bps
        type: integer
        source: input
        default: 0
        description: "Simple annual interest rate in basis points applied to the sustained portion."
        constraints: ">= 0"
      - name: interest_accrual_start
        type: datetime
        source: input
        default: null
        description: "Instant from which interest accrues; required when interest_rate_bps > 0 and must be <= issued_at."
      - name: reinstatement_ordered
        type: boolean
        source: input
        default: false
        description: "When true the award is only fully implemented once the grievant's employment_status is REINSTATED."
      - name: remedy_deadline_days
        type: integer
        source: input
        default: 30
        description: "Calendar days the employer has to implement the remedy."
        constraints: ">= 1"
      - name: gross_remedy_cents
        type: integer
        source: computed
        description: "Gross variant of calculations.award_remedy: sustained back pay plus interest, before any offset."
      - name: net_remedy_cents
        type: integer
        source: computed
        description: "Net variant of calculations.award_remedy: gross less mitigation_offset_cents less Grievance.settled_amount_cents, floored at 0."
      - name: implemented_cents
        type: integer
        source: system
        default: 0
        description: "Cumulative money paid against net_remedy_cents."
      - name: implementation_deadline_at
        type: datetime
        source: computed
        description: "issued_at + remedy_deadline_days."
      - name: status
        type: enum
        source: system
        default: ISSUED
        description: "See state_machines[Award.status]."
        constraints: "ISSUED | IMPLEMENTATION_PENDING | PARTIALLY_IMPLEMENTED | IMPLEMENTED | COMPLIANCE_DISPUTED"

  - name: CostEntry
    parent: Grievance
    common_fields: true
    kind: resource
    fields:
      - name: grievance_id
        type: string
        source: input
        description: "FK -> Grievance.id; the case the cost is charged to."
      - name: category
        type: enum
        source: input
        description: "Cost bucket; only ARBITRATOR_FEE, TRANSCRIPT, RELEASE_TIME and TRAVEL feed the arbitration actual-cost variant."
        constraints: "ARBITRATOR_FEE | TRANSCRIPT | COUNSEL | RELEASE_TIME | TRAVEL | FILING"
      - name: amount_cents
        type: integer
        source: input
        description: "Amount charged, in cents."
        constraints: "> 0"
      - name: bearing_party
        type: enum
        source: input
        description: "Who bears the cost; SPLIT entries are divided by the cost-sharing schedule."
        constraints: "UNION | EMPLOYER | SPLIT"
      - name: incurred_at
        type: datetime
        source: system
        description: "Logical-clock now when the entry was posted."
      - name: origin
        type: enum
        source: system
        default: MANUAL
        description: "MANUAL for operator-posted entries, SYSTEM for entries created by a cascade."
        constraints: "MANUAL | SYSTEM"
      - name: status
        type: enum
        source: system
        default: POSTED
        description: "See state_machines[CostEntry.status]; only POSTED entries enter cost allocation."
        constraints: "POSTED | VOIDED"
      - name: void_reason
        type: string
        source: input
        default: null
        description: "Reason recorded when the entry is voided."
      - name: voided_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the operator who voided the entry, or null when the void was performed by a cascade."

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# Each machine names the entity field it governs via `state_field:`.
# ArbitrationDemand carries two machines over two independent fields on one row.
# -----------------------------------------------------------------------------
state_machines:

  - entity: Grievance
    state_field: status
    shape: cyclic
    initial_state: FILED
    terminal_states: [SETTLED, WITHDRAWN, CONSOLIDATED, CLOSED]
    transitions:
      - from: null
        to: FILED
        trigger: "POST /labor-relations/grievances"
        actor: UnionSteward
        preconditions:
          - "bargaining_unit.status == ACTIVE"
          - "grievant.bargaining_unit_id == body.bargaining_unit_id AND respondent_supervisor.bargaining_unit_id == body.bargaining_unit_id"
          - "clause.bargaining_unit_id == body.bargaining_unit_id"
          - "incident_date <= discovery_date <= logical-clock now"
          - "calculations.grievance_filing_timeliness accepts the elapsed days"
        side_effects:
          - "case_number minted as GR-{local_number}-{4-digit ordinal by created_at ASC within the unit}"
          - "filed_at := logical-clock now; filed_by_steward_employee_id := X-User-ID"
          - "current_step := 1; timeliness_state := TIMELY"
          - "ContractClause.filed_count and ContractClause.sustain_rate_bps observably change on next read"
          - "Employee(respondent_supervisor).open_grievance_count observably increases by 1 on next read"

      - from: FILED
        to: STEP_MEETING_SCHEDULED
        trigger: "POST /labor-relations/grievances/{id}/steps"
        actor: LaborRelationsAnalyst
        preconditions:
          - "grievance.status == FILED"
          - "bargaining_unit.status == ACTIVE"
          - "meeting_scheduled_at > logical-clock now"
          - "extension_days == 0 OR bargaining_unit.tolling_enabled == true"
        side_effects:
          - "a GrievanceStep is created in SCHEDULED with step_number := grievance.current_step"
          - "calculations.grievance_timeliness_posture re-evaluated (TOLLED when extension_days > 0)"

      - from: APPEALED
        to: STEP_MEETING_SCHEDULED
        trigger: "POST /labor-relations/grievances/{id}/steps"
        actor: LaborRelationsAnalyst
        preconditions:
          - "grievance.status == APPEALED"
          - "bargaining_unit.status == ACTIVE"
          - "meeting_scheduled_at > logical-clock now"
          - "extension_days == 0 OR bargaining_unit.tolling_enabled == true"
        side_effects:
          - "a GrievanceStep is created in SCHEDULED with step_number := grievance.current_step (2 or 3)"
          - "calculations.grievance_timeliness_posture re-evaluated"
        note: "This edge closes the grievance cycle ANSWERED -> APPEALED -> STEP_MEETING_SCHEDULED -> AWAITING_RESPONSE -> ANSWERED."

      - from: STEP_MEETING_SCHEDULED
        to: AWAITING_RESPONSE
        trigger: "POST /labor-relations/grievance-steps/{id}/hold"
        actor: LaborRelationsAnalyst
        preconditions:
          - "step.status == SCHEDULED"
          - "step.grievance.status == STEP_MEETING_SCHEDULED"
        side_effects:
          - "step.status := HELD; step.meeting_held_at := logical-clock now"
          - "step.response_due_at := calculations.step_response_deadline"
          - "calculations.grievance_timeliness_posture re-evaluated (a TOLLED grievance returns to TIMELY)"

      - from: AWAITING_RESPONSE
        to: ANSWERED
        trigger: "POST /labor-relations/grievance-steps/{id}/respond with disposition in {DENIED, PARTIAL}"
        actor: LaborRelationsAnalyst
        preconditions:
          - "step.status == HELD"
          - "granted_amount_cents is omitted or 0 when disposition == DENIED"
        side_effects:
          - "step.status := ANSWERED; step.responded_at := logical-clock now; step.responded_by_user_id := X-User-ID"
          - "step.late_by_days := max(0, floor calendar days between response_due_at and responded_at)"
          - "grievance.settled_amount_cents += granted_amount_cents when disposition == PARTIAL"
          - "grievance.appeal_deadline_at recomputed; timeliness posture re-evaluated (EMPLOYER_DEFAULT when late_by_days > 0)"

      - from: AWAITING_RESPONSE
        to: SETTLED
        trigger: "POST /labor-relations/grievance-steps/{id}/respond with disposition == GRANTED"
        actor: LaborRelationsAnalyst
        preconditions:
          - "step.status == HELD"
          - "granted_amount_cents is present"
        side_effects:
          - "step.status := ANSWERED; step.responded_at := logical-clock now; step.responded_by_user_id := X-User-ID"
          - "grievance.settled_amount_cents := granted_amount_cents"
          - "every SettlementOffer on this grievance in {DRAFT, AUTHORIZED} transitions to VOIDED"
          - "timeliness_state freezes at its value at this instant"

      - from: ANSWERED
        to: APPEALED
        trigger: "POST /labor-relations/grievances/{id}/appeal"
        actor: UnionSteward
        preconditions:
          - "X-User-ID == grievance.filed_by_steward_employee_id"
          - "grievance.current_step < 3"
          - "logical-clock now <= grievance.appeal_deadline_at"
          - "bargaining_unit.status == ACTIVE"
        side_effects:
          - "grievance.current_step += 1"
          - "timeliness posture re-evaluated"

      - from: AWAITING_RESPONSE
        to: APPEALED
        trigger: "POST /labor-relations/grievances/{id}/appeal after the employer response deadline has passed"
        actor: UnionSteward
        preconditions:
          - "X-User-ID == grievance.filed_by_steward_employee_id"
          - "latest GrievanceStep status == HELD AND logical-clock now > step.response_due_at"
          - "grievance.current_step < 3"
        side_effects:
          - "latest GrievanceStep transitions HELD -> DEEMED_DENIED"
          - "grievance.appeal_deadline_at recomputed from step.response_due_at"
          - "grievance.current_step += 1"
          - "timeliness_state := EMPLOYER_DEFAULT"

      - from: ANSWERED
        to: ARBITRATION_DEMANDED
        trigger: "POST /labor-relations/grievances/{id}/arbitration-demands"
        actor: UnionSteward
        preconditions:
          - "X-User-ID == grievance.filed_by_steward_employee_id"
          - "expected_grievance_version == grievance.version"
          - "grievance.current_step == 3"
          - "clause.is_arbitrable == true"
          - "logical-clock now <= grievance.arbitration_deadline_at"
        side_effects:
          - "an ArbitrationDemand is created in DEMANDED with prep_status PREP_NOT_STARTED"
          - "demand.demand_deadline_at := grievance.arbitration_deadline_at"
          - "grievance.version increments by 1"

      - from: AWAITING_RESPONSE
        to: ARBITRATION_DEMANDED
        trigger: "POST /labor-relations/grievances/{id}/arbitration-demands after a step-3 response deadline has passed"
        actor: UnionSteward
        preconditions:
          - "X-User-ID == grievance.filed_by_steward_employee_id"
          - "expected_grievance_version == grievance.version"
          - "grievance.current_step == 3 AND latest step status == HELD AND logical-clock now > step.response_due_at"
          - "clause.is_arbitrable == true"
        side_effects:
          - "latest GrievanceStep transitions HELD -> DEEMED_DENIED"
          - "an ArbitrationDemand is created in DEMANDED"
          - "timeliness_state := EMPLOYER_DEFAULT"
          - "grievance.version increments by 1"

      - from: ARBITRATION_DEMANDED
        to: AWARDED
        trigger: "POST /labor-relations/arbitration-demands/{id}/awards"
        actor: ArbitrationAdministrator
        preconditions:
          - "demand.status == HEARING_SCHEDULED AND logical-clock now >= demand.hearing_end_at"
          - "demand.prep_status in {BRIEFS_FILED, PREP_READY}"
        side_effects:
          - "demand.status := HEARD then := AWARDED"
          - "an Award is created (see state_machines[Award.status])"
          - "Arbitrator.active_case_count decrements by 1 and Arbitrator.status is re-derived"

      - from: AWARDED
        to: CLOSED
        trigger: "POST /labor-relations/awards/{id}/implement completing the remedy"
        actor: LaborRelationsAnalyst
        preconditions:
          - "award.implemented_cents + paid_cents >= award.net_remedy_cents"
          - "award.reinstatement_ordered == false OR grievant.employment_status == REINSTATED after this call"
        side_effects:
          - "award.status := IMPLEMENTED"
          - "ContractClause and Employee(respondent_supervisor) trend metrics observably change on next read"
          - "timeliness_state freezes at its value at this instant"

      - from: "FILED | STEP_MEETING_SCHEDULED | AWAITING_RESPONSE | ANSWERED | APPEALED | ARBITRATION_DEMANDED"
        to: SETTLED
        trigger: "POST /labor-relations/settlement-offers/{id}/respond with decision == ACCEPT"
        actor: "UnionSteward | LaborRelationsDirector"
        preconditions:
          - "offer.status == AUTHORIZED"
          - "logical-clock now <= offer.expires_at"
          - "acting role's party is the opposite of offer.offering_party"
        side_effects:
          - "offer.status := ACCEPTED; grievance.settled_amount_cents := offer.exposure_cents"
          - "every other SettlementOffer on this grievance in {DRAFT, AUTHORIZED} transitions to VOIDED"
          - "any ArbitrationDemand on this grievance in {DEMANDED, PANEL_ISSUED, STRIKING, ARBITRATOR_SELECTED, HEARING_SCHEDULED} transitions to SETTLED_PRE_HEARING"
          - "when that demand had a selected_arbitrator_id, Arbitrator.active_case_count decrements by 1 and Arbitrator.status is re-derived"
          - "every GrievanceStep on this grievance in {SCHEDULED, HELD} transitions to CANCELLED"

      - from: "FILED | STEP_MEETING_SCHEDULED | AWAITING_RESPONSE | ANSWERED | APPEALED | ARBITRATION_DEMANDED"
        to: WITHDRAWN
        trigger: "POST /labor-relations/grievances/{id}/withdraw without consolidated_into_grievance_id"
        actor: UnionSteward
        preconditions:
          - "X-User-ID == grievance.filed_by_steward_employee_id"
          - "grievance.status is not terminal"
        side_effects:
          - "every GrievanceStep in {SCHEDULED, HELD} transitions to CANCELLED"
          - "every SettlementOffer in {DRAFT, AUTHORIZED} transitions to VOIDED"
          - "any ArbitrationDemand in {DEMANDED, PANEL_ISSUED, STRIKING, ARBITRATOR_SELECTED, HEARING_SCHEDULED} transitions to WITHDRAWN"
          - "when that demand had a selected_arbitrator_id, Arbitrator.active_case_count decrements by 1 and Arbitrator.status is re-derived"

      - from: "FILED | STEP_MEETING_SCHEDULED | AWAITING_RESPONSE | ANSWERED | APPEALED | ARBITRATION_DEMANDED"
        to: CONSOLIDATED
        trigger: "POST /labor-relations/grievances/{id}/withdraw with consolidated_into_grievance_id"
        actor: UnionSteward
        preconditions:
          - "X-User-ID == grievance.filed_by_steward_employee_id"
          - "target grievance exists, is not terminal, and shares this grievance's bargaining_unit_id and clause_id"
          - "target grievance id != this grievance id"
        side_effects:
          - "consolidated_into_id := target.id"
          - "target.remedy_requested_cents += this.remedy_requested_cents; target.back_pay_hours_claimed += this.back_pay_hours_claimed; target.version increments by 1"
          - "every GrievanceStep in {SCHEDULED, HELD} transitions to CANCELLED"
          - "every SettlementOffer in {DRAFT, AUTHORIZED} transitions to VOIDED"
          - "ContractClause.filed_count observably drops by 1 on next read because CONSOLIDATED rows are excluded"

  - entity: GrievanceStep
    state_field: status
    shape: branching
    initial_state: SCHEDULED
    terminal_states: [ANSWERED, DEEMED_DENIED, CANCELLED]
    transitions:
      - from: null
        to: SCHEDULED
        trigger: "POST /labor-relations/grievances/{id}/steps"
        actor: LaborRelationsAnalyst
        preconditions:
          - "grievance.status in {FILED, APPEALED}"
          - "meeting_scheduled_at > logical-clock now"
        side_effects:
          - "grievance.status := STEP_MEETING_SCHEDULED"
      - from: SCHEDULED
        to: HELD
        trigger: "POST /labor-relations/grievance-steps/{id}/hold"
        actor: LaborRelationsAnalyst
        preconditions:
          - "step.status == SCHEDULED"
        side_effects:
          - "meeting_held_at := logical-clock now; response_due_at := calculations.step_response_deadline"
          - "grievance.status := AWAITING_RESPONSE"
      - from: HELD
        to: ANSWERED
        trigger: "POST /labor-relations/grievance-steps/{id}/respond"
        actor: LaborRelationsAnalyst
        preconditions:
          - "step.status == HELD"
        side_effects:
          - "responded_at, responded_by_user_id, disposition, response_summary, granted_amount_cents recorded"
          - "late_by_days computed; grievance.status := ANSWERED or SETTLED per disposition"
      - from: HELD
        to: DEEMED_DENIED
        trigger: "system, evaluated during POST /labor-relations/grievances/{id}/appeal or POST /labor-relations/grievances/{id}/arbitration-demands"
        actor: system
        preconditions:
          - "step.status == HELD AND logical-clock now > step.response_due_at"
        side_effects:
          - "grievance.timeliness_state := EMPLOYER_DEFAULT"
          - "grievance.appeal_deadline_at / arbitration_deadline_at anchor on response_due_at rather than responded_at"
      - from: "SCHEDULED | HELD"
        to: CANCELLED
        trigger: "system, cascaded from grievance withdrawal, consolidation or settlement"
        actor: system
        preconditions:
          - "grievance transitions to SETTLED, WITHDRAWN or CONSOLIDATED"
        side_effects:
          - "the step stops contributing to calculations.grievance_timeliness_posture"

  - entity: SettlementOffer
    state_field: status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED, COUNTERED, LAPSED, VOIDED]
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /labor-relations/grievances/{id}/settlement-offers"
        actor: "LaborRelationsAnalyst | UnionSteward"
        preconditions:
          - "grievance.status is not terminal"
          - "acting role's party == offering_party"
          - "precedent_case_id is null OR precedent.clause_id == grievance.clause_id"
        side_effects:
          - "exposure_cents, authority_tier and precedent_deviation_bps computed by calculations.settlement_exposure_authority_tier"
          - "prepared_by_user_id := X-User-ID; round_number := 1"
      - from: DRAFT
        to: AUTHORIZED
        trigger: "POST /labor-relations/settlement-offers/{id}/authorize"
        actor: "LaborRelationsDirector | ChiefNegotiator"
        preconditions:
          - "offer.status == DRAFT"
          - "expected_grievance_version == grievance.version"
          - "X-User-ID is not the responded_by_user_id of any GrievanceStep on this grievance"
          - "authority_tier is within the acting role's ceiling"
          - "authority_tier is ANALYST, or precedent_case_id is not null"
        side_effects:
          - "authorized_by_user_id := X-User-ID; authorized_at := logical-clock now; expires_at := authorized_at + 10 days"
          - "every OTHER SettlementOffer on this grievance in AUTHORIZED transitions to LAPSED"
          - "grievance.version increments by 1"
      - from: AUTHORIZED
        to: ACCEPTED
        trigger: "POST /labor-relations/settlement-offers/{id}/respond with decision == ACCEPT"
        actor: "UnionSteward | LaborRelationsDirector"
        preconditions:
          - "offer.status == AUTHORIZED AND logical-clock now <= offer.expires_at"
          - "acting role's party is the opposite of offering_party"
        side_effects:
          - "grievance.status := SETTLED with settled_amount_cents := exposure_cents (see Grievance machine for the full cascade)"
      - from: AUTHORIZED
        to: REJECTED
        trigger: "POST /labor-relations/settlement-offers/{id}/respond with decision == REJECT"
        actor: "UnionSteward | LaborRelationsDirector"
        preconditions:
          - "offer.status == AUTHORIZED AND logical-clock now <= offer.expires_at"
          - "acting role's party is the opposite of offering_party"
        side_effects:
          - "no change to the grievance; the negotiation may continue with a fresh DRAFT offer"
      - from: AUTHORIZED
        to: COUNTERED
        trigger: "POST /labor-relations/settlement-offers/{id}/respond with decision == COUNTER"
        actor: "UnionSteward | LaborRelationsDirector"
        preconditions:
          - "offer.status == AUTHORIZED AND logical-clock now <= offer.expires_at"
          - "acting role's party is the opposite of offering_party"
          - "counter_monetary_cents is present"
        side_effects:
          - "a NEW SettlementOffer row is created in DRAFT on the same grievance with offering_party flipped, round_number := this.round_number + 1, and prepared_by_user_id := X-User-ID"
          - "the new row is not returned by this endpoint; it is discoverable only through GET /labor-relations/settlement-offers?grievance_id="
        note: "This edge is what makes the machine cyclic: DRAFT -> AUTHORIZED -> COUNTERED spawns a fresh DRAFT that repeats the loop at a higher round_number."
      - from: AUTHORIZED
        to: LAPSED
        trigger: "system, cascaded when another offer on the same grievance is authorized"
        actor: system
        preconditions:
          - "a different SettlementOffer on the same grievance transitions DRAFT -> AUTHORIZED"
        side_effects:
          - "the superseded offer can no longer be responded to"
      - from: "DRAFT | AUTHORIZED"
        to: VOIDED
        trigger: "system, cascaded when the grievance reaches a terminal status"
        actor: system
        preconditions:
          - "grievance transitions to SETTLED, WITHDRAWN, CONSOLIDATED or CLOSED"
        side_effects:
          - "PrecedentCase.cited_count observably drops on next read for any precedent this offer cited"

  - entity: ArbitrationDemand
    state_field: status
    shape: branching
    initial_state: DEMANDED
    terminal_states: [AWARDED, WITHDRAWN, SETTLED_PRE_HEARING]
    transitions:
      - from: null
        to: DEMANDED
        trigger: "POST /labor-relations/grievances/{id}/arbitration-demands"
        actor: UnionSteward
        preconditions:
          - "grievance.current_step == 3 and its step-3 GrievanceStep is resolved or past its response deadline"
          - "clause.is_arbitrable == true"
          - "logical-clock now <= grievance.arbitration_deadline_at"
          - "panel_size in {3, 5, 7}"
        side_effects:
          - "grievance.status := ARBITRATION_DEMANDED; grievance.version increments by 1"
      - from: DEMANDED
        to: PANEL_ISSUED
        trigger: "POST /labor-relations/arbitration-demands/{id}/request-panel"
        actor: ArbitrationAdministrator
        preconditions:
          - "demand.status == DEMANDED"
          - "calculations.panel_candidate_selection yields at least panel_size candidates"
        side_effects:
          - "panel_arbitrator_ids := the ordered candidate list; strike_turn := UNION; strikes_taken := 0"
      - from: PANEL_ISSUED
        to: STRIKING
        trigger: "POST /labor-relations/arbitration-demands/{id}/strikes (first strike)"
        actor: "UnionSteward | LaborRelationsDirector"
        preconditions:
          - "acting role's party == demand.strike_turn"
          - "arbitrator_id is in panel_arbitrator_ids and has not already been struck"
          - "panel_size - strikes_taken - 1 > 1"
        side_effects:
          - "a PanelStrike is created; strikes_taken += 1; strike_turn flips"
      - from: STRIKING
        to: STRIKING
        trigger: "POST /labor-relations/arbitration-demands/{id}/strikes (intermediate strike, panel_size 5 or 7)"
        actor: "UnionSteward | LaborRelationsDirector"
        preconditions:
          - "acting role's party == demand.strike_turn"
          - "panel_size - strikes_taken - 1 > 1"
        side_effects:
          - "a PanelStrike is created; strikes_taken += 1; strike_turn flips"
      - from: "PANEL_ISSUED | STRIKING"
        to: ARBITRATOR_SELECTED
        trigger: "POST /labor-relations/arbitration-demands/{id}/strikes (the strike that leaves exactly one candidate)"
        actor: "UnionSteward | LaborRelationsDirector"
        preconditions:
          - "acting role's party == demand.strike_turn"
          - "panel_size - strikes_taken - 1 == 1"
        side_effects:
          - "selected_arbitrator_id := the one unstruck candidate; strike_turn := null"
          - "BECAUSE the demand entered ARBITRATOR_SELECTED: Arbitrator.active_case_count += 1 and Arbitrator.status is re-derived (AVAILABLE -> FULL when the ceiling is reached)"
          - "BECAUSE an arbitrator became engaged: a SYSTEM CostEntry is created on the grievance with category ARBITRATOR_FEE, bearing_party SPLIT, amount_cents := arbitrator.per_diem_cents * RETAINER_DAYS (2)"
          - "BECAUSE a CostEntry was posted: Grievance.total_cost_cents / union_cost_share_cents / employer_cost_share_cents are re-derived by calculations.case_cost_allocation and Grievance.cost_posture may step COST_OK -> COST_WATCH -> COST_BREACH"
      - from: ARBITRATOR_SELECTED
        to: HEARING_SCHEDULED
        trigger: "POST /labor-relations/arbitration-demands/{id}/schedule-hearing"
        actor: ArbitrationAdministrator
        preconditions:
          - "demand.status == ARBITRATOR_SELECTED"
          - "arbitrator.status != INACTIVE"
          - "hearing_end_at > hearing_start_at"
          - "no buffered calendar conflict per validations[priority=35]"
        side_effects:
          - "hearing_start_at / hearing_end_at stored; brief_due_at := hearing_end_at + 30 days"
          - "estimated_cost_cents := forward-looking variant of calculations.arbitration_case_cost"
          - "when prep_status == PREP_NOT_STARTED and hearing_start_at - now < PREP_RUNWAY_DAYS (21), prep_status := PREP_DEFICIENT"
      - from: HEARING_SCHEDULED
        to: HEARD
        trigger: "system, evaluated at the start of POST /labor-relations/arbitration-demands/{id}/awards"
        actor: system
        preconditions:
          - "logical-clock now >= demand.hearing_end_at"
        side_effects:
          - "the demand becomes eligible for award recording in the same request"
      - from: HEARD
        to: AWARDED
        trigger: "POST /labor-relations/arbitration-demands/{id}/awards"
        actor: ArbitrationAdministrator
        preconditions:
          - "demand.prep_status in {BRIEFS_FILED, PREP_READY}"
          - "no Award already exists for this demand"
        side_effects:
          - "an Award is created; grievance.status := AWARDED; grievance.version increments by 1"
          - "BECAUSE the demand left the engaged set: Arbitrator.active_case_count -= 1 and Arbitrator.status is re-derived (FULL -> AVAILABLE)"
          - "every WitnessAssignment on this demand with status CONFIRMED whose slot lies inside [hearing_start_at, hearing_end_at] transitions to TESTIFIED"
          - "every WitnessAssignment with status CONFIRMED whose slot lies outside that window transitions to NO_SHOW, and BECAUSE of that its RELEASE_TIME CostEntry transitions POSTED -> VOIDED, which re-derives Grievance cost allocation"
          - "every WitnessAssignment still in INVITED transitions to EXCUSED"
      - from: "DEMANDED | PANEL_ISSUED | STRIKING | ARBITRATOR_SELECTED | HEARING_SCHEDULED"
        to: SETTLED_PRE_HEARING
        trigger: "system, cascaded from settlement acceptance on the parent grievance"
        actor: system
        preconditions:
          - "the parent grievance transitions to SETTLED"
        side_effects:
          - "when selected_arbitrator_id is not null, Arbitrator.active_case_count -= 1 and Arbitrator.status is re-derived"
      - from: "DEMANDED | PANEL_ISSUED | STRIKING | ARBITRATOR_SELECTED | HEARING_SCHEDULED"
        to: WITHDRAWN
        trigger: "system, cascaded from grievance withdrawal or consolidation"
        actor: system
        preconditions:
          - "the parent grievance transitions to WITHDRAWN or CONSOLIDATED"
        side_effects:
          - "when selected_arbitrator_id is not null, Arbitrator.active_case_count -= 1 and Arbitrator.status is re-derived"

  - entity: ArbitrationDemand
    state_field: prep_status
    shape: branching
    initial_state: PREP_NOT_STARTED
    terminal_states: [PREP_READY]
    note: "Second, independent state dimension on the same ArbitrationDemand row. It advances on its own trigger set and gates award recording, while `status` advances on the procedural trigger set."
    transitions:
      - from: PREP_NOT_STARTED
        to: PREP_DEFICIENT
        trigger: "system, evaluated during POST /labor-relations/arbitration-demands/{id}/schedule-hearing"
        actor: system
        preconditions:
          - "prep_status == PREP_NOT_STARTED"
          - "hearing_start_at - logical-clock now < PREP_RUNWAY_DAYS (21 days)"
        side_effects:
          - "readiness_score stays at its pre-filing value; award recording remains blocked"
      - from: "PREP_NOT_STARTED | PREP_DEFICIENT"
        to: EXHIBITS_FILED
        trigger: "POST /labor-relations/arbitration-demands/{id}/prep-filings with filing_type == EXHIBIT_LIST"
        actor: LaborRelationsAnalyst
        preconditions:
          - "demand.status in {ARBITRATOR_SELECTED, HEARING_SCHEDULED, HEARD}"
          - "exhibit_count >= 1"
        side_effects:
          - "exhibit_count stored; readiness_score gains 40"
      - from: EXHIBITS_FILED
        to: BRIEFS_FILED
        trigger: "POST /labor-relations/arbitration-demands/{id}/prep-filings with filing_type == BRIEF"
        actor: LaborRelationsAnalyst
        preconditions:
          - "prep_status == EXHIBITS_FILED"
        side_effects:
          - "readiness_score gains 30; award recording becomes permitted"
      - from: BRIEFS_FILED
        to: PREP_READY
        trigger: "POST /labor-relations/arbitration-demands/{id}/prep-filings with filing_type == STIPULATION"
        actor: LaborRelationsAnalyst
        preconditions:
          - "prep_status == BRIEFS_FILED"
          - "at least one WitnessAssignment on this demand has status CONFIRMED"
        side_effects:
          - "readiness_score reaches its maximum for the demand's procedural status"

  - entity: WitnessAssignment
    state_field: status
    shape: branching
    initial_state: INVITED
    terminal_states: [TESTIFIED, EXCUSED, NO_SHOW]
    transitions:
      - from: null
        to: INVITED
        trigger: "POST /labor-relations/arbitration-demands/{id}/witness-assignments"
        actor: "UnionSteward | LaborRelationsAnalyst"
        preconditions:
          - "demand.status in {ARBITRATOR_SELECTED, HEARING_SCHEDULED}"
          - "employee.employment_status != TERMINATED"
          - "employee.id != grievance.filed_by_steward_employee_id"
          - "no half-open slot overlap and no daily release-cap breach for this employee"
        side_effects:
          - "release_hours and release_cost_cents computed by calculations.witness_release_cost"
      - from: INVITED
        to: CONFIRMED
        trigger: "POST /labor-relations/witness-assignments/{id}/confirm"
        actor: LaborRelationsDirector
        preconditions:
          - "assignment.status == INVITED"
          - "demand.status in {ARBITRATOR_SELECTED, HEARING_SCHEDULED}"
        side_effects:
          - "confirmed_by_user_id := X-User-ID"
          - "BECAUSE the release was approved: a SYSTEM CostEntry is created on the grievance with category RELEASE_TIME, bearing_party UNION, amount_cents := release_cost_cents, and its id is stored in release_cost_entry_id"
          - "BECAUSE a CostEntry was posted: Grievance cost allocation and cost_posture are re-derived"
          - "Employee.witness_release_hours_ytd observably increases by release_hours on next read"
      - from: CONFIRMED
        to: TESTIFIED
        trigger: "system, cascaded from award recording"
        actor: system
        preconditions:
          - "slot_start_at >= demand.hearing_start_at AND slot_end_at <= demand.hearing_end_at"
        side_effects:
          - "the RELEASE_TIME CostEntry stays POSTED"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system, cascaded from award recording"
        actor: system
        preconditions:
          - "the slot lies wholly or partly outside [demand.hearing_start_at, demand.hearing_end_at]"
        side_effects:
          - "the CostEntry identified by release_cost_entry_id transitions POSTED -> VOIDED with voided_by_user_id null"
          - "Grievance cost allocation and cost_posture are re-derived; Employee.witness_release_hours_ytd drops back"
      - from: INVITED
        to: EXCUSED
        trigger: "system, cascaded from award recording"
        actor: system
        preconditions:
          - "the assignment was never confirmed"
        side_effects:
          - "the assignment stops contributing to the forward-looking arbitration cost estimate"

  - entity: Award
    state_field: status
    shape: branching
    initial_state: ISSUED
    terminal_states: [IMPLEMENTED]
    transitions:
      - from: ISSUED
        to: IMPLEMENTATION_PENDING
        trigger: "system, evaluated inside POST /labor-relations/arbitration-demands/{id}/awards"
        actor: system
        preconditions:
          - "net_remedy_cents > 0 OR reinstatement_ordered == true"
        side_effects:
          - "implementation_deadline_at := issued_at + remedy_deadline_days"
      - from: ISSUED
        to: IMPLEMENTED
        trigger: "system, evaluated inside POST /labor-relations/arbitration-demands/{id}/awards"
        actor: system
        preconditions:
          - "net_remedy_cents == 0 AND reinstatement_ordered == false"
        side_effects:
          - "grievance.status := CLOSED in the same request"
      - from: "IMPLEMENTATION_PENDING | PARTIALLY_IMPLEMENTED | COMPLIANCE_DISPUTED"
        to: PARTIALLY_IMPLEMENTED
        trigger: "POST /labor-relations/awards/{id}/implement with a payment short of the balance"
        actor: LaborRelationsAnalyst
        preconditions:
          - "logical-clock now <= implementation_deadline_at"
          - "implemented_cents + paid_cents < net_remedy_cents OR (reinstatement_ordered AND grievant.employment_status != REINSTATED)"
        side_effects:
          - "implemented_cents += paid_cents"
          - "when reinstatement_effective_date is supplied, grievant.employment_status := REINSTATED"
      - from: "IMPLEMENTATION_PENDING | PARTIALLY_IMPLEMENTED"
        to: COMPLIANCE_DISPUTED
        trigger: "POST /labor-relations/awards/{id}/implement after the implementation deadline"
        actor: LaborRelationsAnalyst
        preconditions:
          - "logical-clock now > implementation_deadline_at"
          - "implemented_cents + paid_cents < net_remedy_cents"
        side_effects:
          - "implemented_cents += paid_cents"
          - "BECAUSE the award went past deadline unsatisfied: a SYSTEM CostEntry is created on the grievance with category COUNSEL, bearing_party EMPLOYER, amount_cents := ENFORCEMENT_COUNSEL_CENTS (150000)"
          - "BECAUSE a CostEntry was posted: Grievance cost allocation and cost_posture are re-derived"
      - from: "IMPLEMENTATION_PENDING | PARTIALLY_IMPLEMENTED | COMPLIANCE_DISPUTED"
        to: IMPLEMENTED
        trigger: "POST /labor-relations/awards/{id}/implement completing the remedy"
        actor: LaborRelationsAnalyst
        preconditions:
          - "implemented_cents + paid_cents == net_remedy_cents"
          - "reinstatement_ordered == false OR grievant.employment_status == REINSTATED after this call"
        side_effects:
          - "implemented_cents := net_remedy_cents"
          - "BECAUSE the award became IMPLEMENTED: grievance.status := CLOSED and grievance.version increments by 1"
          - "BECAUSE the grievance closed: ContractClause.sustained_count / sustain_rate_bps and Employee(respondent_supervisor).sustained_against_count / adverse_rate_bps observably change on next read"

  - entity: CostEntry
    state_field: status
    shape: linear
    initial_state: POSTED
    terminal_states: [VOIDED]
    transitions:
      - from: null
        to: POSTED
        trigger: "POST /labor-relations/grievances/{id}/cost-entries, or a SYSTEM cascade from arbitrator selection, witness confirmation or a missed implementation deadline"
        actor: "LaborRelationsAnalyst | system"
        preconditions:
          - "grievance.status is not terminal for operator-posted entries"
          - "amount_cents > 0"
        side_effects:
          - "Grievance total_cost_cents / union_cost_share_cents / employer_cost_share_cents / cost_posture are re-derived"
      - from: POSTED
        to: VOIDED
        trigger: "POST /labor-relations/cost-entries/{id}/void, or a SYSTEM cascade when a confirmed witness becomes NO_SHOW"
        actor: "LaborRelationsDirector | system"
        preconditions:
          - "entry.status == POSTED"
        side_effects:
          - "void_reason and voided_by_user_id recorded (voided_by_user_id is null for cascade voids)"
          - "the entry leaves the allocation input set, restoring Grievance.total_cost_cents to its exact pre-posting value"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — OCC on Grievance.version only
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: authorize-offer-stale-grievance
    parent_entity: Grievance
    write_endpoint: "POST /labor-relations/settlement-offers/{id}/authorize"
    occ_field: "expected_grievance_version"
    description: |
      Authorizing a settlement offer against a Grievance whose version has advanced
      since the client last observed it is rejected. Authorization legitimately
      supersedes any other AUTHORIZED offer on the same grievance (that offer
      transitions to LAPSED), so a writer holding a stale view of the grievance
      would silently retire an authorization it never saw. The stale-version check
      forces the writer to re-read the grievance before superseding.
    error_id: ERR_STALE_GRIEVANCE_VERSION
    http_status: 412

  - rule_id: demand-arbitration-stale-grievance
    parent_entity: Grievance
    write_endpoint: "POST /labor-relations/grievances/{id}/arbitration-demands"
    occ_field: "expected_grievance_version"
    description: |
      Filing an arbitration demand against a Grievance whose version has advanced
      since the client last observed it is rejected. A demand supersedes the
      grievance's step posture and freezes the settlement track, so a writer whose
      view predates an intervening authorization, step answer or appeal must
      re-read the grievance before committing the case to arbitration.
    error_id: ERR_STALE_GRIEVANCE_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# All money is integer cents. `round_half_up(x)` rounds a real to the nearest
# integer with .5 going away from zero. `floor_days(a, b)` is the number of whole
# 86400-second periods in (b - a). No calculation, selector, tie-break, ordering
# or allocation rule anywhere in this scaffold reads an `id` value.
# -----------------------------------------------------------------------------
calculations:

  - name: grievance_filing_timeliness
    trigger: "POST /labor-relations/grievances (intake), before the Grievance row is written"
    algorithm: threshold
    formula: |
      window_days = bargaining_unit.filing_window_days
      if clause.expedited == true:
          window_days = ceil(window_days / 2)          # 30 -> 15, 21 -> 11
      elapsed_days = floor_days(discovery_date, logical_clock_now)
      if elapsed_days > window_days:                    # STRICTLY greater
          reject with ERR_GRIEVANCE_UNTIMELY
      else:
          timeliness_state = TIMELY
    input_set: "Only the intake body plus the cited ContractClause.expedited flag and the BargainingUnit.filing_window_days in force at intake. The incident_date plays no part in the window; it is only range-checked against discovery_date."
    constants:
      EXPEDITED_DIVISOR: 2
    precision: "whole calendar days, floor; the comparison is strictly greater-than so elapsed_days == window_days is accepted"
    variants: []

  - name: step_response_deadline
    trigger: "POST /labor-relations/grievance-steps/{id}/hold — writes GrievanceStep.response_due_at"
    algorithm: threshold
    formula: |
      base_days = { 1: unit.step1_response_days,
                    2: unit.step2_response_days,
                    3: unit.step3_response_days }[step.step_number]
      if clause.expedited == true:
          base_days = ceil(base_days / 2)               # 10 -> 5, 15 -> 8, secondly note ceil(15/2) == 8
      response_due_at = step.meeting_held_at
                        + base_days days
                        + step.extension_days days
      # late_by_days, written when the answer is recorded:
      late_by_days = max(0, floor_days(response_due_at, step.responded_at))
    input_set: "The step's own step_number and extension_days, the unit's per-step window, and the cited clause's expedited flag. The scheduled meeting instant is irrelevant; only meeting_held_at anchors the deadline."
    constants:
      EXPEDITED_DIVISOR: 2
    precision: "whole calendar days; ceiling applied to the halved window BEFORE the extension is added, never after"
    variants: []

  - name: grievance_timeliness_posture
    trigger: "Re-evaluated at the end of every request that mutates a Grievance or one of its GrievanceStep rows, and on every read of the grievance"
    algorithm: constraint_propagation
    formula: |
      # latest_step := the GrievanceStep for this grievance with the greatest
      # step_number; when two share that step_number, the one with the greatest
      # created_at wins. CANCELLED steps are excluded from the candidate set.
      resolution_at(s) = s.responded_at        if s.status == ANSWERED
                       = s.response_due_at     if s.status == DEEMED_DENIED
                       = null                  otherwise

      if grievance.status in {SETTLED, WITHDRAWN, CONSOLIDATED, CLOSED}:
          keep timeliness_state unchanged (frozen at the value it held when the
          grievance became terminal)
      elif latest_step is null:
          TIMELY
      elif grievance.current_step == 3
           and resolution_at(latest_step) is not null
           and no ArbitrationDemand exists for this grievance
           and now > grievance.arbitration_deadline_at:
          BARRED
      elif resolution_at(latest_step) is not null
           and grievance.status == ANSWERED
           and now > grievance.appeal_deadline_at:
          UNION_DEFAULT
      elif latest_step.status == DEEMED_DENIED
           or (latest_step.status == ANSWERED and latest_step.late_by_days > 0):
          EMPLOYER_DEFAULT
      elif latest_step.status == SCHEDULED and latest_step.extension_days > 0:
          TOLLED
      else:
          TIMELY

      appeal_deadline_at      = resolution_at(latest_step) + unit.appeal_window_days      (null when unresolved)
      arbitration_deadline_at = resolution_at(step_3)      + unit.arbitration_demand_days (null unless current_step == 3 and step 3 is resolved)
    input_set: "The grievance's own status and current_step, its non-CANCELLED GrievanceStep rows, the existence of any ArbitrationDemand for the grievance, and the unit's appeal_window_days / arbitration_demand_days."
    constants: {}
    precision: "Branch order is normative: BARRED outranks UNION_DEFAULT, which outranks EMPLOYER_DEFAULT, which outranks TOLLED. At step 3 past both windows BOTH the BARRED and UNION_DEFAULT predicates hold and BARRED must win. All deadline comparisons are strictly greater-than, so an instant exactly equal to the deadline is still inside the window."
    variants: []

  - name: settlement_exposure_authority_tier
    trigger: "POST /labor-relations/grievances/{id}/settlement-offers (writes exposure_cents, authority_tier, precedent_deviation_bps) and re-verified inside POST /labor-relations/settlement-offers/{id}/authorize"
    algorithm: tiered_pricing
    formula: |
      # --- stage 1: raw exposure (>= 3 inputs, one non-linear branch) ---------
      back_pay_cents = round_half_up(offer.back_pay_hours * grievant.hourly_rate_cents)
      term_loading_cents = {
          NONE:                  0,
          RECORD_EXPUNGEMENT:    25000,
          SENIORITY_RESTORATION: 75000,
          POLICY_CHANGE:         150000,
          REINSTATEMENT:         max(REINSTATEMENT_FLOOR_CENTS,
                                     grievant.hourly_rate_cents * REINSTATEMENT_HOURS)
      }[offer.remedy_terms]
      raw_exposure = offer.monetary_cents + back_pay_cents + term_loading_cents

      # --- stage 2: precedent-setting multiplier, THEN the clause cap ---------
      multiplier = PRECEDENT_SETTING_MULTIPLIER if offer.precedent_setting else 1.00
      exposure_cents = round_half_up(raw_exposure * multiplier)
      if clause.monetary_cap_cents is not null:
          exposure_cents = min(exposure_cents, clause.monetary_cap_cents)

      # --- stage 3: base tier from the CAPPED exposure ------------------------
      if   exposure_cents <= ANALYST_AUTHORITY_CENTS:            base_tier = ANALYST
      elif exposure_cents <= unit.director_authority_cents:      base_tier = DIRECTOR
      elif exposure_cents <= unit.negotiator_authority_cents:    base_tier = NEGOTIATOR
      else:                                                      base_tier = BOARD

      # --- stage 4: precedent review, which can escalate exactly one level ----
      if offer.precedent_case_id is null:
          precedent_deviation_bps = null
          authority_tier = base_tier
      else:
          scope_factor = {UNIT_WIDE: 1.00, DEPARTMENT: 0.75, INDIVIDUAL: 0.50}[precedent.binding_scope]
          adjusted_precedent = round_half_up(precedent.monetary_value_cents * scope_factor)
          precedent_deviation_bps = round_half_up(
              abs(exposure_cents - adjusted_precedent) * 10000 / max(adjusted_precedent, 1))
          if precedent_deviation_bps > unit.precedent_deviation_tolerance_bps:
              authority_tier = next tier up the ladder
                               [ANALYST -> DIRECTOR -> NEGOTIATOR -> BOARD -> BOARD]
          else:
              authority_tier = base_tier
    input_set: "The offer body, the grievant's hourly_rate_cents, the cited clause's monetary_cap_cents, the unit's two authority ceilings and its precedent_deviation_tolerance_bps, and — only when precedent_case_id is present — the precedent's monetary_value_cents and binding_scope."
    constants:
      ANALYST_AUTHORITY_CENTS: 50000
      PRECEDENT_SETTING_MULTIPLIER: 1.25
      REINSTATEMENT_FLOOR_CENTS: 200000
      REINSTATEMENT_HOURS: 40
      TERM_LOADING_RECORD_EXPUNGEMENT_CENTS: 25000
      TERM_LOADING_SENIORITY_RESTORATION_CENTS: 75000
      TERM_LOADING_POLICY_CHANGE_CENTS: 150000
      OFFER_VALIDITY_DAYS: 10
    precision: "Stage order is normative: multiplier BEFORE cap, cap BEFORE tier selection, tier selection BEFORE precedent escalation. Every tier comparison is <= so an exposure exactly equal to a ceiling stays in the lower tier. round_half_up at each named step; no intermediate value is carried as a real past its own round_half_up."
    variants: []

  - name: case_cost_allocation
    trigger: "Re-derived whenever a CostEntry on the grievance is posted or voided, and on every read of the grievance"
    algorithm: waterfall_allocation
    formula: |
      # step 1 — order-independent sum over POSTED entries only
      base_total_cents = sum(e.amount_cents for e in CostEntry
                             where e.grievance_id == g.id and e.status == POSTED)

      # step 2 — the cost-sharing schedule is keyed on BASE TOTAL, never on the
      #          grand total produced in step 5
      if   base_total_cents <= SHARE_TIER_1_CENTS: union_split_bps = 5000
      elif base_total_cents <= SHARE_TIER_2_CENTS: union_split_bps = 6000
      else:                                        union_split_bps = 7000

      # step 3 — union side
      union_cost_share_cents = sum over the same POSTED set of
            e.amount_cents                                        if e.bearing_party == UNION
            round_half_up(e.amount_cents * union_split_bps/10000)  if e.bearing_party == SPLIT
            0                                                     if e.bearing_party == EMPLOYER

      # step 4 — employer base side
      employer_base_cents = base_total_cents - union_cost_share_cents

      # step 5 — the administrative fee is a function of the EMPLOYER side, and it
      #          is added to the employer side only; it never re-keys step 2
      admin_fee_cents = round_half_up(employer_base_cents * ADMIN_FEE_BPS / 10000)
      employer_cost_share_cents = employer_base_cents + admin_fee_cents
      total_cost_cents = union_cost_share_cents + employer_cost_share_cents

      # step 6 — posture
      cost_posture = COST_OK     if total_cost_cents <= COST_OK_CEILING_CENTS
                     COST_WATCH  if total_cost_cents <= COST_WATCH_CEILING_CENTS
                     COST_BREACH otherwise
    input_set: "Every CostEntry on the grievance whose status is POSTED, regardless of category or origin. VOIDED entries are excluded entirely — they contribute nothing to any of the four outputs."
    constants:
      SHARE_TIER_1_CENTS: 500000
      SHARE_TIER_2_CENTS: 2000000
      ADMIN_FEE_BPS: 800
      COST_OK_CEILING_CENTS: 1000000
      COST_WATCH_CEILING_CENTS: 5000000
    precision: "The tier in step 2 is selected from base_total_cents (step 1). Re-selecting the tier from total_cost_cents (step 5) after the administrative fee is added is the wrong reading and yields different shares. All tier comparisons are <=. The identity total_cost_cents == union_cost_share_cents + employer_cost_share_cents holds after every posting and every void."
    variants: []

  - name: witness_release_cost
    trigger: "POST /labor-relations/arbitration-demands/{id}/witness-assignments — writes release_hours and release_cost_cents on the new assignment"
    algorithm: aggregation
    formula: |
      # per assignment
      raw_hours      = (slot_end_at - slot_start_at) in exact hours
      billable_hours = raw_hours + PREP_ALLOWANCE_HOURS
      release_hours  = ceil(billable_hours / QUARTER_HOUR) * QUARTER_HOUR   # up to next 0.25
      release_cost_cents = round_half_up(release_hours * employee.hourly_rate_cents)

      # per employee, per UTC calendar date of slot_start_at, across ALL demands
      daily_release_hours(employee, date) =
          sum of release_hours over WitnessAssignment rows for that employee whose
          status is in {INVITED, CONFIRMED, TESTIFIED} and whose slot_start_at falls
          on that UTC date
      a new assignment is rejected when daily_release_hours after inclusion
      exceeds MAX_DAILY_RELEASE_HOURS (strictly greater)

      # per demand
      projected_release_cost_cents =
          sum over assignments of assignment.release_cost_cents
    input_set: "For the per-assignment figure: only the slot bounds and the called employee's hourly_rate_cents. For the daily cap and the per-demand projection: assignments whose status is in {INVITED, CONFIRMED, TESTIFIED}; EXCUSED and NO_SHOW rows are excluded."
    constants:
      PREP_ALLOWANCE_HOURS: 1.5
      QUARTER_HOUR: 0.25
      MAX_DAILY_RELEASE_HOURS: 10.0
    precision: "Rounding order is normative: the prep allowance is added per assignment, quarter-hour ceiling is applied per assignment, the money rounding is applied per assignment, and only then are assignments summed. Summing raw hours across assignments and rounding once at the end is the wrong reading and produces a smaller figure."
    variants: []

  - name: arbitration_case_cost
    trigger: "The forward-looking variant is written to ArbitrationDemand.estimated_cost_cents by POST /labor-relations/arbitration-demands/{id}/schedule-hearing; the chronological variant is derived into ArbitrationDemand.actual_cost_cents on every read of the demand"
    algorithm: forward_looking
    formula: |
      # --- forward-looking variant (estimated_cost_cents) ---------------------
      hearing_days = ceil((hearing_end_at - hearing_start_at) in hours / 24)
      arbitrator_fee_estimate = arbitrator.per_diem_cents * (hearing_days + STUDY_DAYS)
      release_estimate = sum of release_cost_cents over WitnessAssignment rows on
                         this demand whose status is in {INVITED, CONFIRMED}
      transcript_estimate = TRANSCRIPT_PER_DAY_CENTS * hearing_days
      estimated_cost_cents = arbitrator_fee_estimate + release_estimate + transcript_estimate

      # --- chronological variant (actual_cost_cents) --------------------------
      candidates = CostEntry rows on this demand's grievance where
                   status == POSTED
                   and category in {ARBITRATOR_FEE, TRANSCRIPT, RELEASE_TIME, TRAVEL}
                   and incurred_at <= logical_clock_now
      process candidates in incurred_at ASC, then created_at ASC, accumulating
      amount_cents into a running total
      actual_cost_cents = the running total after the last candidate
    input_set: "The estimate reads the scheduled hearing window, the selected arbitrator's per_diem_cents and every INVITED or CONFIRMED witness assignment — including witnesses who will never testify. The actual reads only POSTED CostEntry rows in the four arbitration categories, which excludes COUNSEL and FILING and excludes anything voided."
    constants:
      STUDY_DAYS: 1
      TRANSCRIPT_PER_DAY_CENTS: 120000
      RETAINER_DAYS: 2
    precision: "hearing_days uses a ceiling so any partial day counts as a whole day. The two variants read genuinely different input sets and are expected to disagree for the same case."
    variants:
      - name: estimated_forward_looking
        when: "Written once, at hearing scheduling, from projected engagement"
        difference: "Prices a study day and every merely-INVITED witness, and prices transcripts per scheduled hearing day irrespective of whether any transcript cost has been posted."
      - name: actual_chronological
        when: "Derived on every read of the demand from the posted cost ledger"
        difference: "Counts only money that has actually been posted and not voided, in incurred_at order, and ignores study days, unconfirmed witnesses and any not-yet-incurred transcript charge."

  - name: award_remedy
    trigger: "POST /labor-relations/arbitration-demands/{id}/awards — writes gross_remedy_cents and net_remedy_cents"
    algorithm: weighted_scoring
    formula: |
      base_back_pay_cents = round_half_up(award.back_pay_hours_ordered
                                          * grievant.hourly_rate_cents)
      sustained_portion_cents = round_half_up(base_back_pay_cents
                                              * award.sustained_fraction_bps / 10000)
      interest_days = floor_days(award.interest_accrual_start, award.issued_at)
                      (0 when interest_rate_bps == 0)
      interest_cents = round_half_up(sustained_portion_cents
                                     * award.interest_rate_bps
                                     * interest_days
                                     / (10000 * DAYS_PER_YEAR))

      gross_remedy_cents = sustained_portion_cents + interest_cents
      net_remedy_cents   = max(0, gross_remedy_cents
                                  - award.mitigation_offset_cents
                                  - grievance.settled_amount_cents)
    input_set: "The award body, the grievant's hourly_rate_cents, and Grievance.settled_amount_cents as it stands at the instant the award is recorded. Cost entries never enter the remedy."
    constants:
      DAYS_PER_YEAR: 365
      ENFORCEMENT_COUNSEL_CENTS: 150000
    precision: "Interest accrues on sustained_portion_cents — that is, AFTER the split fraction is applied and BEFORE any mitigation or settlement offset. Applying the sustained fraction after interest, or accruing interest on the net figure, are the two wrong readings. Each named step is rounded half-up before feeding the next. The net figure is floored at 0 and never goes negative."
    variants:
      - name: gross_make_whole
        when: "Reported as gross_remedy_cents and used for compliance reporting"
        difference: "Ignores mitigation earnings and anything the employer already conceded through a step grant or accepted settlement."
      - name: net_payable
        when: "Reported as net_remedy_cents and used as the implementation target"
        difference: "Subtracts mitigation_offset_cents and Grievance.settled_amount_cents and clamps at 0, so an award can be fully implemented with a zero payment."

  - name: panel_candidate_selection
    trigger: "POST /labor-relations/arbitration-demands/{id}/request-panel — writes ArbitrationDemand.panel_arbitrator_ids"
    algorithm: topological
    formula: |
      eligible = every Arbitrator a such that
          a.is_active == true
          and a.active_case_count < a.max_concurrent_cases
          and demand.panel_source in a.panel_memberships
          and a.earliest_available_at <= demand.demanded_at + PANEL_HORIZON_DAYS days
          and no PanelStrike exists that names a on ANY ArbitrationDemand belonging
              to the SAME grievance (exclusion carried across re-demands)

      rank eligible by, in order:
          1. active_case_count ASC
          2. per_diem_cents ASC
          3. created_at ASC
      panel_arbitrator_ids = the first demand.panel_size ranked candidates, in rank order

      if count(eligible) < demand.panel_size:
          reject with ERR_PANEL_POOL_INSUFFICIENT and write nothing
    input_set: "The whole Arbitrator table filtered by the four eligibility predicates above; arbitrators whose status derives to FULL or INACTIVE are never candidates."
    constants:
      PANEL_HORIZON_DAYS: 90
    precision: "The ranking expression is total: created_at ASC is the final tie-break and no `id` value participates at any level. The candidate list is stored in rank order and the alternate-strike process consumes it in that order."
    variants: []

  - name: supervisor_clause_trend_metrics
    trigger: "Derived on every read of an Employee (GET /labor-relations/employees/{id} and the employee list) and of a ContractClause (the clause list under its bargaining unit)"
    algorithm: aggregation
    formula: |
      adverse_outcome(g) = true when ANY of the following holds, counted once per grievance:
          (a) an Award exists on g's ArbitrationDemand with outcome in {SUSTAINED, SPLIT}
          (b) g.status in {SETTLED, CLOSED} and g.settled_amount_cents > 0
          (c) a GrievanceStep on g has disposition in {GRANTED, PARTIAL}

      # supervisor scorecard, over grievances whose respondent_supervisor_id == e.id
      open_grievance_count    = count(status not in {SETTLED, WITHDRAWN, CONSOLIDATED, CLOSED})
      closed_grievance_count  = count(status in {SETTLED, WITHDRAWN, CLOSED})
      sustained_against_count = count(status in {SETTLED, WITHDRAWN, CLOSED} and adverse_outcome)
      adverse_rate_bps        = 0 if closed_grievance_count == 0
                                else round_half_up(sustained_against_count * 10000
                                                   / closed_grievance_count)
      witness_release_hours_ytd = sum of WitnessAssignment.release_hours for this
                                  employee where status in {CONFIRMED, TESTIFIED}

      # clause scorecard, over grievances whose clause_id == c.id
      filed_count      = count(status != CONSOLIDATED)
      sustained_count  = count(status != CONSOLIDATED and adverse_outcome)
      denied_count     = count(status in {SETTLED, WITHDRAWN, CLOSED} and not adverse_outcome)
      sustain_rate_bps = 0 if filed_count == 0
                         else round_half_up(sustained_count * 10000 / filed_count)
    input_set: "CONSOLIDATED grievances are excluded from every clause counter and from both supervisor counters — a consolidated case is accounted for on the surviving grievance only. Grievances still in flight count only toward open_grievance_count and filed_count."
    constants: {}
    precision: "Both rate fields are exactly 0 — not null and not an error — when their denominator is 0. Rates are basis points rounded half-up."
    variants: []

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the first rule that fails is the one whose error_id is returned)
# -----------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    check: "Both X-User-Role and X-User-ID headers are present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's declared roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every resource named by a path parameter exists, validated left to right"
    error_id: "ERR_BARGAINING_UNIT_NOT_FOUND | ERR_GRIEVANCE_NOT_FOUND | ERR_STEP_NOT_FOUND | ERR_OFFER_NOT_FOUND | ERR_PRECEDENT_NOT_FOUND | ERR_DEMAND_NOT_FOUND | ERR_ARBITRATOR_NOT_FOUND | ERR_AWARD_NOT_FOUND | ERR_COST_ENTRY_NOT_FOUND | ERR_WITNESS_ASSIGNMENT_NOT_FOUND | ERR_EMPLOYEE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying a path parameter"

  - priority: 4
    category: auth
    check: "A Grievant may only read a Grievance whose grievant_id equals the caller's X-User-ID"
    error_id: ERR_NOT_CASE_PARTICIPANT
    http_status: 403
    applies_to: "GET /labor-relations/grievances/{id}, GET /labor-relations/grievances/{id}/steps"

  - priority: 5
    category: auth
    check: "A UnionSteward taking a union-side action on a grievance must be the steward who filed it (X-User-ID == Grievance.filed_by_steward_employee_id)"
    error_id: ERR_NOT_FILING_STEWARD
    http_status: 403
    applies_to: "POST /labor-relations/grievances/{id}/appeal, POST /labor-relations/grievances/{id}/withdraw, POST /labor-relations/grievances/{id}/arbitration-demands, POST /labor-relations/arbitration-demands/{id}/strikes (as UnionSteward), POST /labor-relations/settlement-offers/{id}/respond (as UnionSteward)"

  - priority: 6
    category: business_constraint
    check: "Request body conforms to the endpoint's input schema: required fields present, enum members valid, integers non-negative where constrained, datetimes ISO 8601, panel_memberships non-empty, sustained_fraction_bps consistent with outcome, interest_accrual_start present when interest_rate_bps > 0, counter_monetary_cents present when decision == COUNTER, granted_amount_cents only with disposition in {GRANTED, PARTIAL}, reinstatement_effective_date only when the award ordered reinstatement"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 7
    category: existence
    check: "Every resource named by a body field exists (bargaining_unit_id, grievant_id, respondent_supervisor_id, supervisor_id, clause_id, precedent_case_id, employee_id, arbitrator_id, consolidated_into_grievance_id)"
    error_id: "ERR_BARGAINING_UNIT_NOT_FOUND | ERR_EMPLOYEE_NOT_FOUND | ERR_CLAUSE_NOT_FOUND | ERR_PRECEDENT_NOT_FOUND | ERR_ARBITRATOR_NOT_FOUND | ERR_GRIEVANCE_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints carrying foreign keys in the body"

  - priority: 8
    category: state
    check: "expected_grievance_version equals the current Grievance.version"
    error_id: ERR_STALE_GRIEVANCE_VERSION
    http_status: 412
    applies_to: "POST /labor-relations/settlement-offers/{id}/authorize, POST /labor-relations/grievances/{id}/arbitration-demands"

  - priority: 9
    category: state
    check: "The target resource is in a state from which this transition is declared in §1.2"
    error_id: "ERR_INVALID_GRIEVANCE_STATE | ERR_INVALID_STEP_STATE | ERR_OFFER_NOT_DRAFT | ERR_OFFER_NOT_AUTHORIZED | ERR_DEMAND_STATE_INVALID | ERR_AWARD_STATE_INVALID | ERR_COST_ENTRY_ALREADY_VOIDED"
    http_status: 409
    applies_to: "all write endpoints that drive a state machine"

  - priority: 10
    category: state
    check: "The governing BargainingUnit derives to status ACTIVE (logical-clock now < contract_expiry_date)"
    error_id: ERR_AGREEMENT_EXPIRED
    http_status: 409
    applies_to: "POST /labor-relations/grievances, POST /labor-relations/grievances/{id}/steps, POST /labor-relations/grievances/{id}/appeal, POST /labor-relations/grievances/{id}/arbitration-demands"

  - priority: 11
    category: state
    check: "The demand's selected Arbitrator does not derive to status INACTIVE"
    error_id: ERR_ARBITRATOR_INACTIVE
    http_status: 409
    applies_to: "POST /labor-relations/arbitration-demands/{id}/schedule-hearing"

  - priority: 12
    category: state
    check: "The scheduled hearing has concluded (logical-clock now >= hearing_end_at) before an award may be recorded"
    error_id: ERR_HEARING_NOT_CONCLUDED
    http_status: 409
    applies_to: "POST /labor-relations/arbitration-demands/{id}/awards"

  - priority: 13
    category: business_safety
    check: "The X-User-ID authorizing a settlement offer is not the responded_by_user_id of any GrievanceStep on the same grievance"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /labor-relations/settlement-offers/{id}/authorize"

  - priority: 14
    category: business_safety
    check: "The employee called as a witness is not the steward who filed the grievance"
    error_id: ERR_ADVOCATE_WITNESS_CONFLICT
    http_status: 422
    applies_to: "POST /labor-relations/arbitration-demands/{id}/witness-assignments"

  - priority: 15
    category: business_safety
    check: "The employee called as a witness does not have employment_status TERMINATED"
    error_id: ERR_WITNESS_NOT_EMPLOYED
    http_status: 422
    applies_to: "POST /labor-relations/arbitration-demands/{id}/witness-assignments"

  - priority: 16
    category: business_referential
    check: "The grievance's cited ContractClause has is_arbitrable true"
    error_id: ERR_CLAUSE_NOT_ARBITRABLE
    http_status: 422
    applies_to: "POST /labor-relations/grievances/{id}/arbitration-demands"

  - priority: 17
    category: business_referential
    check: "The grievant and the respondent supervisor both belong to the bargaining unit named in the request"
    error_id: ERR_UNIT_MEMBERSHIP_MISMATCH
    http_status: 422
    applies_to: "POST /labor-relations/grievances"

  - priority: 18
    category: business_referential
    check: "The cited ContractClause belongs to the bargaining unit named in the request"
    error_id: ERR_CLAUSE_UNIT_MISMATCH
    http_status: 422
    applies_to: "POST /labor-relations/grievances"

  - priority: 19
    category: business_referential
    check: "A cited PrecedentCase construes the same ContractClause the grievance cites"
    error_id: ERR_PRECEDENT_CLAUSE_MISMATCH
    http_status: 422
    applies_to: "POST /labor-relations/grievances/{id}/settlement-offers"

  - priority: 20
    category: business_referential
    check: "Party alignment: on offer creation the acting role's party equals offering_party; on offer response the acting role's party is the opposite of offering_party. UnionSteward is the UNION party; LaborRelationsAnalyst, LaborRelationsDirector and ChiefNegotiator are the EMPLOYER party."
    error_id: ERR_PARTY_ROLE_MISMATCH
    http_status: 403
    applies_to: "POST /labor-relations/grievances/{id}/settlement-offers, POST /labor-relations/settlement-offers/{id}/respond"

  - priority: 21
    category: business_referential
    check: "The acting role's party equals ArbitrationDemand.strike_turn"
    error_id: ERR_NOT_STRIKE_TURN
    http_status: 409
    applies_to: "POST /labor-relations/arbitration-demands/{id}/strikes"

  - priority: 22
    category: business_referential
    check: "The struck arbitrator appears in panel_arbitrator_ids and has no PanelStrike on this demand yet"
    error_id: ERR_ARBITRATOR_NOT_ON_PANEL
    http_status: 422
    applies_to: "POST /labor-relations/arbitration-demands/{id}/strikes"

  - priority: 23
    category: business_constraint
    check: "Identifier uniqueness: BargainingUnit.local_number globally, ContractClause.clause_number within its unit, Employee.employee_number within its unit, PrecedentCase.citation globally"
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "POST /labor-relations/bargaining-units, POST /labor-relations/bargaining-units/{id}/contract-clauses, POST /labor-relations/employees, POST /labor-relations/precedent-cases"

  - priority: 24
    category: business_constraint
    check: "panel_size is one of 3, 5 or 7"
    error_id: ERR_INVALID_PANEL_SIZE
    http_status: 422
    applies_to: "POST /labor-relations/grievances/{id}/arbitration-demands"

  - priority: 25
    category: business_constraint
    check: "An appeal may not be taken when current_step is already 3"
    error_id: ERR_STEP_LADDER_EXHAUSTED
    http_status: 409
    applies_to: "POST /labor-relations/grievances/{id}/appeal"

  - priority: 26
    category: business_constraint
    check: "prep_status is BRIEFS_FILED or PREP_READY before an award may be recorded"
    error_id: ERR_PREP_INCOMPLETE
    http_status: 409
    applies_to: "POST /labor-relations/arbitration-demands/{id}/awards"

  - priority: 27
    category: business_constraint
    check: "extension_days greater than 0 requires bargaining_unit.tolling_enabled to be true"
    error_id: ERR_TOLLING_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /labor-relations/grievances/{id}/steps"

  - priority: 28
    category: business_constraint
    check: "The eligible candidate pool holds at least panel_size arbitrators"
    error_id: ERR_PANEL_POOL_INSUFFICIENT
    http_status: 409
    applies_to: "POST /labor-relations/arbitration-demands/{id}/request-panel"

  - priority: 29
    category: business_temporal
    check: "incident_date <= discovery_date <= logical-clock now"
    error_id: ERR_INVALID_DISCOVERY_DATE
    http_status: 422
    applies_to: "POST /labor-relations/grievances"

  - priority: 30
    category: business_temporal
    check: "floor calendar days from discovery_date to now does not exceed the (possibly halved) filing window"
    error_id: ERR_GRIEVANCE_UNTIMELY
    http_status: 422
    applies_to: "POST /labor-relations/grievances"

  - priority: 31
    category: business_temporal
    check: "meeting_scheduled_at is strictly after logical-clock now"
    error_id: ERR_MEETING_DATE_IN_PAST
    http_status: 422
    applies_to: "POST /labor-relations/grievances/{id}/steps"

  - priority: 32
    category: business_temporal
    check: "An appeal from ANSWERED is taken no later than Grievance.appeal_deadline_at"
    error_id: ERR_APPEAL_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /labor-relations/grievances/{id}/appeal"

  - priority: 33
    category: business_temporal
    check: "An arbitration demand is filed no later than Grievance.arbitration_deadline_at"
    error_id: ERR_ARBITRATION_DEMAND_UNTIMELY
    http_status: 409
    applies_to: "POST /labor-relations/grievances/{id}/arbitration-demands"

  - priority: 34
    category: business_temporal
    check: "hearing_end_at is strictly after hearing_start_at"
    error_id: ERR_INVALID_HEARING_WINDOW
    http_status: 422
    applies_to: "POST /labor-relations/arbitration-demands/{id}/schedule-hearing"

  - priority: 35
    category: business_temporal
    check: "Arbitrator calendar conflict, CLOSED intervals expanded by the arbitrator's travel_buffer_hours on BOTH sides of every already-scheduled hearing: the demand is rejected when [existing.hearing_start_at - buffer, existing.hearing_end_at + buffer] intersects [new.hearing_start_at, new.hearing_end_at] at any point, endpoints included. Existing hearings are those on other ArbitrationDemand rows with the same selected_arbitrator_id whose status is in {HEARING_SCHEDULED, HEARD, AWARDED}."
    error_id: ERR_ARBITRATOR_UNAVAILABLE
    http_status: 409
    applies_to: "POST /labor-relations/arbitration-demands/{id}/schedule-hearing"

  - priority: 36
    category: business_temporal
    check: "Witness slot conflict, HALF-OPEN intervals with no buffer: the assignment is rejected when [new.slot_start_at, new.slot_end_at) intersects [existing.slot_start_at, existing.slot_end_at) for the same employee_id on any demand where the existing assignment's status is in {INVITED, CONFIRMED, TESTIFIED}. Slots that merely touch (existing.slot_end_at == new.slot_start_at) do not conflict."
    error_id: ERR_WITNESS_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /labor-relations/arbitration-demands/{id}/witness-assignments"

  - priority: 37
    category: business_temporal
    check: "Aggregate daily release capacity: the employee's total release_hours for the UTC calendar date of slot_start_at, counting assignments in {INVITED, CONFIRMED, TESTIFIED} and including the new one, does not exceed MAX_DAILY_RELEASE_HOURS (10.0)"
    error_id: ERR_WITNESS_RELEASE_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /labor-relations/arbitration-demands/{id}/witness-assignments"

  - priority: 38
    category: business_temporal
    check: "logical-clock now is no later than SettlementOffer.expires_at"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /labor-relations/settlement-offers/{id}/respond"

  - priority: 39
    category: business_fiscal
    check: "The offer's authority_tier is within the acting role's ceiling: LaborRelationsDirector may authorize ANALYST and DIRECTOR, ChiefNegotiator may authorize ANALYST, DIRECTOR and NEGOTIATOR, and no role may authorize BOARD"
    error_id: ERR_AUTHORITY_EXCEEDED
    http_status: 403
    applies_to: "POST /labor-relations/settlement-offers/{id}/authorize"

  - priority: 40
    category: business_fiscal
    check: "An offer whose base tier is DIRECTOR or above must cite a PrecedentCase"
    error_id: ERR_PRECEDENT_REVIEW_REQUIRED
    http_status: 422
    applies_to: "POST /labor-relations/settlement-offers/{id}/authorize"

  - priority: 41
    category: business_fiscal
    check: "paid_cents does not exceed net_remedy_cents minus implemented_cents"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /labor-relations/awards/{id}/implement"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
# Every list endpoint returns the paginated envelope of §1.0 and states its
# normative ordering. No ordering anywhere uses `id`.
# -----------------------------------------------------------------------------
endpoints:

  # --- collective agreement configuration ------------------------------------
  - method: POST
    path: "/labor-relations/bargaining-units"
    description: "Register a collective agreement and the deadline / authority parameters that govern every grievance filed under it."
    roles: [LaborRelationsDirector]
    code: 201
    input: [name, local_number, contract_effective_date, contract_expiry_date, "step1_response_days?", "step2_response_days?", "step3_response_days?", "appeal_window_days?", "filing_window_days?", "arbitration_demand_days?", "tolling_enabled?", "director_authority_cents?", "negotiator_authority_cents?", "precedent_deviation_tolerance_bps?"]
    output: BargainingUnit
    side_effects: ["status derived from the logical clock", "open_grievance_count initialised to 0"]

  - method: GET
    path: "/labor-relations/bargaining-units/{id}"
    description: "Read one collective agreement, including its derived status and open grievance count."
    roles: [UnionSteward, LaborRelationsAnalyst, LaborRelationsDirector, ChiefNegotiator, ArbitrationAdministrator]
    code: 200
    input: []
    output: BargainingUnit
    side_effects: []

  - method: POST
    path: "/labor-relations/bargaining-units/{id}/contract-clauses"
    description: "Add a contract clause to an agreement."
    roles: [LaborRelationsDirector]
    code: 201
    input: [clause_number, title, category, "is_arbitrable?", "monetary_cap_cents?", "expedited?"]
    output: ContractClause
    side_effects: ["trend counters initialised to 0 and sustain_rate_bps to 0"]

  - method: GET
    path: "/labor-relations/bargaining-units/{id}/contract-clauses"
    description: "List the clauses of one agreement together with their trend counters. Ordered by clause_number ASC."
    roles: [UnionSteward, LaborRelationsAnalyst, LaborRelationsDirector, ChiefNegotiator, ArbitrationAdministrator]
    code: 200
    input: ["category?", "limit?", "offset?"]
    output: ContractClause[]
    side_effects: ["clause trend counters derived by calculations.supervisor_clause_trend_metrics"]

  # --- people ----------------------------------------------------------------
  - method: POST
    path: "/labor-relations/employees"
    description: "Register a bargaining-unit member, supervisor or steward. employment_status may be seeded so that reinstatement remedies are exercisable."
    roles: [LaborRelationsDirector]
    code: 201
    input: [bargaining_unit_id, full_name, employee_number, hire_date, seniority_date, hourly_rate_cents, classification, "supervisor_id?", "employment_status?"]
    output: Employee
    side_effects: ["scorecard counters derived to 0 and adverse_rate_bps to 0"]

  - method: GET
    path: "/labor-relations/employees/{id}"
    description: "Read one person, including the supervisor scorecard (open / closed / sustained counts, adverse_rate_bps) and year-to-date witness release hours."
    roles: [UnionSteward, LaborRelationsAnalyst, LaborRelationsDirector, ChiefNegotiator, ArbitrationAdministrator]
    code: 200
    input: []
    output: Employee
    side_effects: ["scorecard fields derived by calculations.supervisor_clause_trend_metrics"]

  - method: GET
    path: "/labor-relations/employees"
    description: "List people, optionally by unit, by reporting line (supervisor_id, the self-referential foreign key) or by classification. Ordered by employee_number ASC."
    roles: [UnionSteward, LaborRelationsAnalyst, LaborRelationsDirector, ChiefNegotiator, ArbitrationAdministrator]
    code: 200
    input: ["bargaining_unit_id?", "supervisor_id?", "classification?", "employment_status?", "limit?", "offset?"]
    output: Employee[]
    side_effects: []

  - method: GET
    path: "/labor-relations/employees/{id}/witness-assignments"
    description: "List every testimony slot reserved for this person across all arbitration cases. Ordered by slot_start_at ASC, then created_at ASC."
    roles: [UnionSteward, LaborRelationsAnalyst, LaborRelationsDirector, ChiefNegotiator, ArbitrationAdministrator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: WitnessAssignment[]
    side_effects: []

  # --- grievance intake and the step ladder ----------------------------------
  - method: POST
    path: "/labor-relations/grievances"
    description: "File a grievance. Mints the case number, runs the filing-window test and stamps the filing steward."
    roles: [UnionSteward]
    code: 201
    input: [bargaining_unit_id, grievant_id, respondent_supervisor_id, clause_id, statement, incident_date, discovery_date, "remedy_requested_cents?", "back_pay_hours_claimed?"]
    output: Grievance
    side_effects: ["case_number minted", "timeliness_state derived to TIMELY", "clause and supervisor trend counters observably change on next read"]

  - method: GET
    path: "/labor-relations/grievances/{id}"
    description: "Read one grievance with its derived timeliness posture, deadline instants and cost allocation."
    roles: [UnionSteward, LaborRelationsAnalyst, LaborRelationsDirector, ChiefNegotiator, ArbitrationAdministrator, Grievant]
    code: 200
    input: []
    output: Grievance
    side_effects: ["timeliness_state, appeal_deadline_at, arbitration_deadline_at and the four cost fields derived at read time"]

  - method: GET
    path: "/labor-relations/grievances"
    description: "List grievances with filters covering every foreign key on the entity, including the self-referential consolidated_into_id. Ordered by created_at ASC, then case_number ASC."
    roles: [UnionSteward, LaborRelationsAnalyst, LaborRelationsDirector, ChiefNegotiator, ArbitrationAdministrator]
    code: 200
    input: ["bargaining_unit_id?", "grievant_id?", "respondent_supervisor_id?", "clause_id?", "consolidated_into_id?", "status?", "timeliness_state?", "limit?", "offset?"]
    output: Grievance[]
    side_effects: []

  - method: POST
    path: "/labor-relations/grievances/{id}/steps"
    description: "Schedule the step meeting for the grievance's current step."
    roles: [LaborRelationsAnalyst]
    code: 201
    input: [meeting_scheduled_at, "extension_days?"]
    output: GrievanceStep
    side_effects: ["grievance.status := STEP_MEETING_SCHEDULED", "timeliness posture re-derived (TOLLED when extension_days > 0)"]

  - method: GET
    path: "/labor-relations/grievances/{id}/steps"
    description: "List the step records of one grievance. Ordered by step_number ASC, then created_at ASC."
    roles: [UnionSteward, LaborRelationsAnalyst, LaborRelationsDirector, ChiefNegotiator, ArbitrationAdministrator, Grievant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: GrievanceStep[]
    side_effects: []

  - method: POST
    path: "/labor-relations/grievance-steps/{id}/hold"
    description: "Record that the step meeting took place; this is the instant the employer response clock starts."
    roles: [LaborRelationsAnalyst]
    code: 200
    input: []
    output: GrievanceStep
    side_effects: ["meeting_held_at := logical-clock now", "response_due_at computed by calculations.step_response_deadline", "grievance.status := AWAITING_RESPONSE"]

  - method: POST
    path: "/labor-relations/grievance-steps/{id}/respond"
    description: "Record the employer's answer to a held step meeting. The acting X-User-ID is retained for the segregation-of-duties test at settlement authorization."
    roles: [LaborRelationsAnalyst]
    code: 200
    input: [disposition, response_summary, "granted_amount_cents?"]
    output: GrievanceStep
    side_effects: ["responded_at and responded_by_user_id stamped", "late_by_days computed", "grievance.status := ANSWERED or SETTLED", "timeliness posture re-derived"]

  - method: POST
    path: "/labor-relations/grievances/{id}/appeal"
    description: "Appeal the grievance to the next step. When the employer answer is overdue the held step is first deemed denied."
    roles: [UnionSteward]
    code: 200
    input: [appeal_statement]
    output: Grievance
    side_effects: ["current_step += 1", "an overdue HELD step transitions to DEEMED_DENIED", "timeliness posture re-derived"]

  - method: POST
    path: "/labor-relations/grievances/{id}/withdraw"
    description: "Withdraw the grievance, or fold it into a surviving grievance when consolidated_into_grievance_id is supplied."
    roles: [UnionSteward]
    code: 200
    input: [reason, "consolidated_into_grievance_id?"]
    output: Grievance
    side_effects: ["status := WITHDRAWN or CONSOLIDATED", "every GrievanceStep in {SCHEDULED, HELD} transitions to CANCELLED, every SettlementOffer in {DRAFT, AUTHORIZED} transitions to VOIDED, and any ArbitrationDemand in {DEMANDED, PANEL_ISSUED, STRIKING, ARBITRATOR_SELECTED, HEARING_SCHEDULED} transitions to WITHDRAWN with the selected arbitrator released", "on consolidation the surviving grievance absorbs the remedy figures and its version increments by 1"]

  # --- settlement authority and precedent review -----------------------------
  - method: POST
    path: "/labor-relations/precedent-cases"
    description: "Record a prior award that may be cited during settlement authority review."
    roles: [LaborRelationsDirector]
    code: 201
    input: [clause_id, citation, decided_on, outcome, monetary_value_cents, binding_scope, arbitrator_name]
    output: PrecedentCase
    side_effects: ["cited_count derived to 0"]

  - method: GET
    path: "/labor-relations/precedent-cases/{id}"
    description: "Read one precedent, including cited_count, the number of SettlementOffer rows whose status is not VOIDED that name it."
    roles: [UnionSteward, LaborRelationsAnalyst, LaborRelationsDirector, ChiefNegotiator, ArbitrationAdministrator]
    code: 200
    input: []
    output: PrecedentCase
    side_effects: ["cited_count derived at read time"]

  - method: GET
    path: "/labor-relations/precedent-cases"
    description: "List precedents, optionally narrowed to the clause they construe. Ordered by decided_on DESC, then citation ASC."
    roles: [UnionSteward, LaborRelationsAnalyst, LaborRelationsDirector, ChiefNegotiator, ArbitrationAdministrator]
    code: 200
    input: ["clause_id?", "binding_scope?", "outcome?", "limit?", "offset?"]
    output: PrecedentCase[]
    side_effects: []

  - method: POST
    path: "/labor-relations/grievances/{id}/settlement-offers"
    description: "Draft a settlement offer. Exposure, authority tier and precedent deviation are computed at draft time."
    roles: [LaborRelationsAnalyst, UnionSteward]
    code: 201
    input: [offering_party, monetary_cents, "back_pay_hours?", "remedy_terms?", "precedent_setting?", "precedent_case_id?"]
    output: SettlementOffer
    side_effects: ["exposure_cents, authority_tier and precedent_deviation_bps computed", "prepared_by_user_id stamped"]

  - method: GET
    path: "/labor-relations/settlement-offers/{id}"
    description: "Read one settlement offer with its computed exposure and authority tier."
    roles: [UnionSteward, LaborRelationsAnalyst, LaborRelationsDirector, ChiefNegotiator, ArbitrationAdministrator]
    code: 200
    input: []
    output: SettlementOffer
    side_effects: []

  - method: GET
    path: "/labor-relations/settlement-offers"
    description: "List settlement offers by grievance or by cited precedent. This is the only channel through which a counter-offer created by a COUNTER response can be discovered. Ordered by round_number ASC, then created_at ASC."
    roles: [UnionSteward, LaborRelationsAnalyst, LaborRelationsDirector, ChiefNegotiator, ArbitrationAdministrator]
    code: 200
    input: ["grievance_id?", "precedent_case_id?", "status?", "offering_party?", "limit?", "offset?"]
    output: SettlementOffer[]
    side_effects: []

  - method: POST
    path: "/labor-relations/settlement-offers/{id}/authorize"
    description: "Exercise settlement authority over a drafted offer. Enforces the authority ladder, the precedent-review requirement, the segregation-of-duties bar and optimistic concurrency on the grievance."
    roles: [LaborRelationsDirector, ChiefNegotiator]
    code: 200
    input: [expected_grievance_version, "authorization_note?"]
    output: SettlementOffer
    side_effects: ["status := AUTHORIZED with authorized_at and expires_at stamped", "any other AUTHORIZED offer on the grievance transitions to LAPSED", "increments Grievance.version by 1"]

  - method: POST
    path: "/labor-relations/settlement-offers/{id}/respond"
    description: "The receiving party accepts, rejects or counters an authorized offer. A COUNTER creates a fresh DRAFT offer on the same grievance which this response does not return."
    roles: [UnionSteward, LaborRelationsDirector]
    code: 200
    input: [decision, "counter_monetary_cents?", "counter_back_pay_hours?", "counter_remedy_terms?", "counter_precedent_setting?", "response_note?"]
    output: SettlementOffer
    side_effects: ["ACCEPT settles the grievance and cascades to its GrievanceStep rows in {SCHEDULED, HELD}, its other SettlementOffer rows in {DRAFT, AUTHORIZED} and any ArbitrationDemand in {DEMANDED, PANEL_ISSUED, STRIKING, ARBITRATOR_SELECTED, HEARING_SCHEDULED}", "COUNTER spawns a new DRAFT offer at round_number + 1 with the parties flipped"]

  # --- arbitration demand, panel and hearing ---------------------------------
  - method: POST
    path: "/labor-relations/arbitrators"
    description: "Add an arbitrator to the roster."
    roles: [ArbitrationAdministrator]
    code: 201
    input: [full_name, panel_memberships, per_diem_cents, cancellation_fee_cents, earliest_available_at, "travel_buffer_hours?", "max_concurrent_cases?", "is_active?"]
    output: Arbitrator
    side_effects: ["active_case_count initialised to 0 and status derived"]

  - method: GET
    path: "/labor-relations/arbitrators/{id}"
    description: "Read one arbitrator, including active_case_count (demands in {ARBITRATOR_SELECTED, HEARING_SCHEDULED, HEARD}) and the derived status."
    roles: [UnionSteward, LaborRelationsAnalyst, LaborRelationsDirector, ChiefNegotiator, ArbitrationAdministrator]
    code: 200
    input: []
    output: Arbitrator
    side_effects: []

  - method: PATCH
    path: "/labor-relations/arbitrators/{id}"
    description: "Maintain the arbitrator roster: take an arbitrator off the roster or put them back, move their availability date, adjust their engagement ceiling or their per-diem. Never touches an already-scheduled hearing."
    roles: [ArbitrationAdministrator]
    code: 200
    input: ["is_active?", "earliest_available_at?", "max_concurrent_cases?", "per_diem_cents?"]
    output: Arbitrator
    side_effects: ["status re-derived from is_active, active_case_count and max_concurrent_cases"]

  - method: GET
    path: "/labor-relations/arbitrators/{id}/strike-history"
    description: "List every strike taken against this arbitrator across all demands. Ordered by created_at ASC, then strike_order ASC."
    roles: [UnionSteward, LaborRelationsAnalyst, LaborRelationsDirector, ChiefNegotiator, ArbitrationAdministrator]
    code: 200
    input: ["struck_by?", "limit?", "offset?"]
    output: PanelStrike[]
    side_effects: []

  - method: POST
    path: "/labor-relations/grievances/{id}/arbitration-demands"
    description: "Demand arbitration on a grievance that has exhausted the step ladder. Guarded by optimistic concurrency on the grievance."
    roles: [UnionSteward]
    code: 201
    input: [panel_source, panel_size, expected_grievance_version]
    output: ArbitrationDemand
    side_effects: ["grievance.status := ARBITRATION_DEMANDED", "an overdue HELD step-3 record transitions to DEEMED_DENIED", "increments Grievance.version by 1"]

  - method: GET
    path: "/labor-relations/arbitration-demands/{id}"
    description: "Read one arbitration demand with both of its state dimensions, the readiness score and both cost variants."
    roles: [UnionSteward, LaborRelationsAnalyst, LaborRelationsDirector, ChiefNegotiator, ArbitrationAdministrator]
    code: 200
    input: []
    output: ArbitrationDemand
    side_effects: ["actual_cost_cents and readiness_score derived at read time"]

  - method: GET
    path: "/labor-relations/arbitration-demands"
    description: "List arbitration demands by grievance, by selected arbitrator or by either state dimension. Ordered by demanded_at ASC, then created_at ASC."
    roles: [UnionSteward, LaborRelationsAnalyst, LaborRelationsDirector, ChiefNegotiator, ArbitrationAdministrator]
    code: 200
    input: ["grievance_id?", "selected_arbitrator_id?", "status?", "prep_status?", "limit?", "offset?"]
    output: ArbitrationDemand[]
    side_effects: []

  - method: POST
    path: "/labor-relations/arbitration-demands/{id}/request-panel"
    description: "Ask the panel administrator for a strike list. The server picks the candidates itself using calculations.panel_candidate_selection."
    roles: [ArbitrationAdministrator]
    code: 200
    input: []
    output: ArbitrationDemand
    side_effects: ["panel_arbitrator_ids written in rank order", "status := PANEL_ISSUED and strike_turn := UNION"]

  - method: GET
    path: "/labor-relations/arbitration-demands/{id}/panel-strikes"
    description: "List the strikes taken on this demand. Ordered by strike_order ASC."
    roles: [UnionSteward, LaborRelationsAnalyst, LaborRelationsDirector, ChiefNegotiator, ArbitrationAdministrator]
    code: 200
    input: ["struck_by?", "limit?", "offset?"]
    output: PanelStrike[]
    side_effects: []

  - method: POST
    path: "/labor-relations/arbitration-demands/{id}/strikes"
    description: "Take one alternate strike against the panel. The strike that leaves a single candidate selects the arbitrator and starts the engagement cascade."
    roles: [UnionSteward, LaborRelationsDirector]
    code: 201
    input: [arbitrator_id]
    output: PanelStrike
    side_effects: ["strikes_taken += 1 and strike_turn flips", "the final strike sets selected_arbitrator_id, raises Arbitrator.active_case_count, posts a SYSTEM ARBITRATOR_FEE CostEntry and re-derives the grievance cost allocation and posture"]

  - method: POST
    path: "/labor-relations/arbitration-demands/{id}/schedule-hearing"
    description: "Book the hearing window with the selected arbitrator, subject to the buffered calendar-conflict test."
    roles: [ArbitrationAdministrator]
    code: 200
    input: [hearing_start_at, hearing_end_at]
    output: ArbitrationDemand
    side_effects: ["status := HEARING_SCHEDULED and brief_due_at computed", "estimated_cost_cents written from the forward-looking cost variant", "prep_status := PREP_DEFICIENT when preparation has not started and the runway is under 21 days"]

  - method: POST
    path: "/labor-relations/arbitration-demands/{id}/prep-filings"
    description: "File a case-file component. Advances the preparation dimension independently of the procedural dimension."
    roles: [LaborRelationsAnalyst]
    code: 200
    input: [filing_type, "exhibit_count?"]
    output: ArbitrationDemand
    side_effects: ["prep_status advances", "readiness_score re-derived"]

  - method: POST
    path: "/labor-relations/arbitration-demands/{id}/witness-assignments"
    description: "Reserve a testimony slot for a bargaining-unit member, subject to the half-open slot-conflict test and the aggregate daily release cap."
    roles: [UnionSteward, LaborRelationsAnalyst]
    code: 201
    input: [employee_id, witness_type, called_by, slot_start_at, slot_end_at]
    output: WitnessAssignment
    side_effects: ["release_hours and release_cost_cents computed by calculations.witness_release_cost"]

  - method: GET
    path: "/labor-relations/arbitration-demands/{id}/witness-assignments"
    description: "List the witnesses coordinated for this case. Ordered by slot_start_at ASC, then created_at ASC."
    roles: [UnionSteward, LaborRelationsAnalyst, LaborRelationsDirector, ChiefNegotiator, ArbitrationAdministrator]
    code: 200
    input: ["status?", "called_by?", "limit?", "offset?"]
    output: WitnessAssignment[]
    side_effects: []

  - method: POST
    path: "/labor-relations/witness-assignments/{id}/confirm"
    description: "Approve the witness's release from work. Posts the release-time cost against the case."
    roles: [LaborRelationsDirector]
    code: 200
    input: []
    output: WitnessAssignment
    side_effects: ["status := CONFIRMED and confirmed_by_user_id stamped", "a SYSTEM RELEASE_TIME CostEntry is posted and its id stored on release_cost_entry_id", "grievance cost allocation and posture re-derived"]

  # --- award and remedy implementation ---------------------------------------
  - method: POST
    path: "/labor-relations/arbitration-demands/{id}/awards"
    description: "Record the arbitrator's award. Computes both remedy variants and releases the arbitrator."
    roles: [ArbitrationAdministrator]
    code: 201
    input: [outcome, "sustained_fraction_bps?", "back_pay_hours_ordered?", "mitigation_offset_cents?", "interest_rate_bps?", "interest_accrual_start?", "reinstatement_ordered?", "remedy_deadline_days?"]
    output: Award
    side_effects: ["demand.status := HEARD then AWARDED and grievance.status := AWARDED", "gross_remedy_cents and net_remedy_cents computed", "Arbitrator.active_case_count decremented and status re-derived", "confirmed witnesses become TESTIFIED or NO_SHOW and invited witnesses become EXCUSED, with NO_SHOW voiding the release-time cost entry"]

  - method: GET
    path: "/labor-relations/arbitration-demands/{id}/awards"
    description: "List the award recorded on this demand; the array holds zero or one row. Ordered by created_at ASC."
    roles: [UnionSteward, LaborRelationsAnalyst, LaborRelationsDirector, ChiefNegotiator, ArbitrationAdministrator]
    code: 200
    input: ["limit?", "offset?"]
    output: Award[]
    side_effects: []

  - method: GET
    path: "/labor-relations/awards/{id}"
    description: "Read one award with both remedy variants and the implementation balance."
    roles: [UnionSteward, LaborRelationsAnalyst, LaborRelationsDirector, ChiefNegotiator, ArbitrationAdministrator]
    code: 200
    input: []
    output: Award
    side_effects: []

  - method: POST
    path: "/labor-relations/awards/{id}/implement"
    description: "Record a payment against the net remedy and, when ordered, the reinstatement. paid_cents may be 0 when the money is already settled and only the reinstatement is outstanding. Payments made after the implementation deadline drive the award into compliance dispute."
    roles: [LaborRelationsAnalyst]
    code: 200
    input: [paid_cents, "reinstatement_effective_date?"]
    output: Award
    side_effects: ["implemented_cents accumulates", "grievant.employment_status := REINSTATED when a reinstatement date is supplied", "full implementation closes the grievance and re-derives clause and supervisor trend metrics", "a late partial payment posts a SYSTEM COUNSEL CostEntry and drives status to COMPLIANCE_DISPUTED"]

  # --- cost tracking ---------------------------------------------------------
  - method: POST
    path: "/labor-relations/grievances/{id}/cost-entries"
    description: "Post a cost against the case."
    roles: [LaborRelationsAnalyst]
    code: 201
    input: [category, amount_cents, bearing_party]
    output: CostEntry
    side_effects: ["grievance total_cost_cents, union_cost_share_cents, employer_cost_share_cents and cost_posture re-derived"]

  - method: GET
    path: "/labor-relations/grievances/{id}/cost-entries"
    description: "List the cost ledger of one case, including system-generated and voided entries. Ordered by incurred_at ASC, then created_at ASC."
    roles: [UnionSteward, LaborRelationsAnalyst, LaborRelationsDirector, ChiefNegotiator, ArbitrationAdministrator]
    code: 200
    input: ["category?", "status?", "bearing_party?", "limit?", "offset?"]
    output: CostEntry[]
    side_effects: []

  - method: POST
    path: "/labor-relations/cost-entries/{id}/void"
    description: "Void a posted cost entry. The entry leaves the allocation input set and every cost figure on the grievance returns to its exact pre-posting value."
    roles: [LaborRelationsDirector]
    code: 200
    input: [void_reason]
    output: CostEntry
    side_effects: ["status := VOIDED with voided_by_user_id stamped", "grievance cost allocation and posture re-derived"]

  # --- test-driving surface --------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Move the server's logical clock, which every deadline, window, overlap and accrual rule in this scaffold reads. The clock starts at exactly 2026-08-01T00:00:00Z at server startup and never falls back to wall-clock time; before any call to this endpoint the clock reads that default."
    roles: [LaborRelationsDirector]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["every subsequent deadline, expiry, posture and accrual evaluation reads the new instant"]

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:
  # authentication / authorization
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role outside the six declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed on the endpoint"
  - id: ERR_NOT_CASE_PARTICIPANT
    http: 403
    condition: "A Grievant reads a grievance whose grievant_id is not the caller's X-User-ID"
  - id: ERR_NOT_FILING_STEWARD
    http: 403
    condition: "A UnionSteward takes a union-side action on a grievance filed by a different steward"

  # request shape
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, invalid enum member, negative or zero amount where positive is required, unparseable datetime, sustained_fraction_bps inconsistent with outcome, missing interest_accrual_start when interest is charged, missing counter_monetary_cents on a COUNTER, granted_amount_cents supplied with disposition DENIED, or reinstatement_effective_date supplied for an award that ordered no reinstatement"

  # existence
  - id: ERR_BARGAINING_UNIT_NOT_FOUND
    http: 404
    condition: "The bargaining unit named in the path or body does not exist"
  - id: ERR_CLAUSE_NOT_FOUND
    http: 404
    condition: "The contract clause named in the body does not exist"
  - id: ERR_EMPLOYEE_NOT_FOUND
    http: 404
    condition: "The employee named in the path or body does not exist"
  - id: ERR_GRIEVANCE_NOT_FOUND
    http: 404
    condition: "The grievance named in the path or body does not exist"
  - id: ERR_STEP_NOT_FOUND
    http: 404
    condition: "The grievance step named in the path does not exist"
  - id: ERR_OFFER_NOT_FOUND
    http: 404
    condition: "The settlement offer named in the path does not exist"
  - id: ERR_PRECEDENT_NOT_FOUND
    http: 404
    condition: "The precedent case named in the path or body does not exist"
  - id: ERR_DEMAND_NOT_FOUND
    http: 404
    condition: "The arbitration demand named in the path does not exist"
  - id: ERR_ARBITRATOR_NOT_FOUND
    http: 404
    condition: "The arbitrator named in the path or body does not exist"
  - id: ERR_AWARD_NOT_FOUND
    http: 404
    condition: "The award named in the path does not exist"
  - id: ERR_COST_ENTRY_NOT_FOUND
    http: 404
    condition: "The cost entry named in the path does not exist"
  - id: ERR_WITNESS_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "The witness assignment named in the path does not exist"

  # optimistic concurrency
  - id: ERR_STALE_GRIEVANCE_VERSION
    http: 412
    condition: "expected_grievance_version does not match the grievance's current version"

  # state preconditions
  - id: ERR_INVALID_GRIEVANCE_STATE
    http: 409
    condition: "The grievance is not in a status from which the requested transition is declared, including any attempt to act on a SETTLED, WITHDRAWN, CONSOLIDATED or CLOSED grievance"
  - id: ERR_INVALID_STEP_STATE
    http: 409
    condition: "The step is not SCHEDULED when held, or not HELD when answered, or is already terminal"
  - id: ERR_OFFER_NOT_DRAFT
    http: 409
    condition: "Authorization was attempted on an offer that is not in DRAFT"
  - id: ERR_OFFER_NOT_AUTHORIZED
    http: 409
    condition: "A response was attempted on an offer that is not in AUTHORIZED"
  - id: ERR_DEMAND_STATE_INVALID
    http: 409
    condition: "The arbitration demand is not in a status from which the requested transition is declared, including a second panel request or a strike after selection"
  - id: ERR_AWARD_STATE_INVALID
    http: 409
    condition: "Implementation was attempted on an award that is already IMPLEMENTED, or a second award was recorded on the same demand"
  - id: ERR_COST_ENTRY_ALREADY_VOIDED
    http: 409
    condition: "The cost entry is already VOIDED"

  # cross-entity state
  - id: ERR_AGREEMENT_EXPIRED
    http: 409
    condition: "The governing collective agreement derives to status EXPIRED at the logical-clock instant of the request"
  - id: ERR_ARBITRATOR_INACTIVE
    http: 409
    condition: "The demand's selected arbitrator derives to status INACTIVE"
  - id: ERR_HEARING_NOT_CONCLUDED
    http: 409
    condition: "An award was recorded before the scheduled hearing window closed"

  # compliance / safety
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The operator authorizing the settlement already recorded an employer step answer on the same grievance"
  - id: ERR_ADVOCATE_WITNESS_CONFLICT
    http: 422
    condition: "The employee called as a witness is the steward who filed the grievance"
  - id: ERR_WITNESS_NOT_EMPLOYED
    http: 422
    condition: "The employee called as a witness has employment_status TERMINATED"

  # referential integrity
  - id: ERR_CLAUSE_NOT_ARBITRABLE
    http: 422
    condition: "Arbitration was demanded on a grievance citing a clause whose is_arbitrable is false"
  - id: ERR_UNIT_MEMBERSHIP_MISMATCH
    http: 422
    condition: "The grievant or the respondent supervisor belongs to a different bargaining unit than the one named"
  - id: ERR_CLAUSE_UNIT_MISMATCH
    http: 422
    condition: "The cited clause belongs to a different bargaining unit than the one named"
  - id: ERR_PRECEDENT_CLAUSE_MISMATCH
    http: 422
    condition: "The cited precedent construes a different clause than the grievance cites"
  - id: ERR_PARTY_ROLE_MISMATCH
    http: 403
    condition: "The acting role's party does not match offering_party on offer creation, or is not its opposite on offer response"
  - id: ERR_NOT_STRIKE_TURN
    http: 409
    condition: "A strike was taken by the party that is not holding strike_turn"
  - id: ERR_ARBITRATOR_NOT_ON_PANEL
    http: 422
    condition: "The struck arbitrator is not in panel_arbitrator_ids, or has already been struck on this demand"

  # constraint satisfaction
  - id: ERR_DUPLICATE_IDENTIFIER
    http: 409
    condition: "local_number, citation, clause_number within a unit, or employee_number within a unit collides with an existing row"
  - id: ERR_INVALID_PANEL_SIZE
    http: 422
    condition: "panel_size is not 3, 5 or 7"
  - id: ERR_STEP_LADDER_EXHAUSTED
    http: 409
    condition: "An appeal was taken from step 3"
  - id: ERR_PREP_INCOMPLETE
    http: 409
    condition: "An award was recorded while prep_status is outside {BRIEFS_FILED, PREP_READY}"
  - id: ERR_TOLLING_NOT_PERMITTED
    http: 422
    condition: "extension_days greater than 0 while the agreement's tolling_enabled is false"
  - id: ERR_PANEL_POOL_INSUFFICIENT
    http: 409
    condition: "Fewer eligible arbitrators exist than the demand's panel_size"

  # temporal
  - id: ERR_INVALID_DISCOVERY_DATE
    http: 422
    condition: "discovery_date precedes incident_date or lies after the logical-clock instant of the request"
  - id: ERR_GRIEVANCE_UNTIMELY
    http: 422
    condition: "Whole calendar days from discovery_date to now strictly exceed the (possibly halved) filing window"
  - id: ERR_MEETING_DATE_IN_PAST
    http: 422
    condition: "meeting_scheduled_at is at or before the logical-clock instant of the request"
  - id: ERR_APPEAL_WINDOW_EXPIRED
    http: 409
    condition: "An appeal from ANSWERED was taken after the grievance's appeal_deadline_at"
  - id: ERR_ARBITRATION_DEMAND_UNTIMELY
    http: 409
    condition: "An arbitration demand was filed after the grievance's arbitration_deadline_at"
  - id: ERR_INVALID_HEARING_WINDOW
    http: 422
    condition: "hearing_end_at is at or before hearing_start_at"
  - id: ERR_ARBITRATOR_UNAVAILABLE
    http: 409
    condition: "The requested hearing window intersects another scheduled hearing of the same arbitrator once that hearing is expanded by the travel buffer on both sides, endpoints included"
  - id: ERR_WITNESS_SLOT_CONFLICT
    http: 409
    condition: "The requested half-open testimony slot intersects a slot of the same employee whose assignment status is in {INVITED, CONFIRMED, TESTIFIED}"
  - id: ERR_WITNESS_RELEASE_CAP_EXCEEDED
    http: 409
    condition: "The employee's release hours for the slot's UTC calendar date, counting assignments in {INVITED, CONFIRMED, TESTIFIED}, would strictly exceed 10.0"
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "A response was attempted after the offer's expires_at"

  # fiscal
  - id: ERR_AUTHORITY_EXCEEDED
    http: 403
    condition: "The offer's authority_tier is above the acting role's ceiling, including any offer that reaches the BOARD tier"
  - id: ERR_PRECEDENT_REVIEW_REQUIRED
    http: 422
    condition: "An offer whose base authority tier is DIRECTOR or above was authorized without citing a precedent"
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "paid_cents exceeds the award's remaining net remedy"

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix — segregation of duties
# Party alignment used by validations[priority=20] and [priority=21]:
#   UNION party    = {UnionSteward}
#   EMPLOYER party = {LaborRelationsAnalyst, LaborRelationsDirector, ChiefNegotiator}
#   ArbitrationAdministrator and Grievant belong to neither party.
# -----------------------------------------------------------------------------
roles:
  - name: UnionSteward
    description: "Union representative who files and prosecutes grievances. Only the steward who filed a grievance may take union-side action on it."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /labor-relations/grievances"
      - "POST /labor-relations/grievances/{id}/appeal"
      - "POST /labor-relations/grievances/{id}/withdraw"
      - "POST /labor-relations/grievances/{id}/arbitration-demands"
    shared_operations:
      - "POST /labor-relations/grievances/{id}/settlement-offers (UNION offers only; shared with LaborRelationsAnalyst who files EMPLOYER offers)"
      - "POST /labor-relations/settlement-offers/{id}/respond (to EMPLOYER offers only; shared with LaborRelationsDirector)"
      - "POST /labor-relations/arbitration-demands/{id}/strikes (UNION turns only; shared with LaborRelationsDirector)"
      - "POST /labor-relations/arbitration-demands/{id}/witness-assignments (shared with LaborRelationsAnalyst)"
      - "all GET endpoints except the Grievant-scoped reads"

  - name: Grievant
    description: "The aggrieved bargaining-unit member. Read-only, and only on their own case."
    identity: "entity_backed:Employee"
    exclusive_operations: []
    shared_operations:
      - "GET /labor-relations/grievances/{id} (own grievance only)"
      - "GET /labor-relations/grievances/{id}/steps (own grievance only)"

  - name: LaborRelationsAnalyst
    description: "Case handler in the labor relations office. Runs the step ladder, drafts employer settlement positions, prepares the case file, records payments and posts costs. Has no settlement authority."
    identity: opaque
    exclusive_operations:
      - "POST /labor-relations/grievances/{id}/steps"
      - "POST /labor-relations/grievance-steps/{id}/hold"
      - "POST /labor-relations/grievance-steps/{id}/respond"
      - "POST /labor-relations/arbitration-demands/{id}/prep-filings"
      - "POST /labor-relations/awards/{id}/implement"
      - "POST /labor-relations/grievances/{id}/cost-entries"
    shared_operations:
      - "POST /labor-relations/grievances/{id}/settlement-offers (EMPLOYER offers only)"
      - "POST /labor-relations/arbitration-demands/{id}/witness-assignments"
      - "all GET endpoints except the Grievant-scoped reads"

  - name: LaborRelationsDirector
    description: "Head of the labor relations office. Holds the first tier of settlement authority, maintains the reference data, approves witness releases, voids costs and drives the logical clock. May not authorize a settlement on a grievance where they personally recorded the employer's step answer."
    identity: opaque
    exclusive_operations:
      - "POST /labor-relations/bargaining-units"
      - "POST /labor-relations/bargaining-units/{id}/contract-clauses"
      - "POST /labor-relations/employees"
      - "POST /labor-relations/precedent-cases"
      - "POST /labor-relations/witness-assignments/{id}/confirm"
      - "POST /labor-relations/cost-entries/{id}/void"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /labor-relations/settlement-offers/{id}/authorize (ANALYST and DIRECTOR tiers only; shared with ChiefNegotiator)"
      - "POST /labor-relations/settlement-offers/{id}/respond (to UNION offers only; shared with UnionSteward)"
      - "POST /labor-relations/arbitration-demands/{id}/strikes (EMPLOYER turns only; shared with UnionSteward)"
      - "all GET endpoints except the Grievant-scoped reads"

  - name: ChiefNegotiator
    description: "Senior management negotiator holding the upper tier of settlement authority. Authorization is their only write power, which keeps approval strictly separated from case handling."
    identity: opaque
    exclusive_operations:
      - "POST /labor-relations/settlement-offers/{id}/authorize at the NEGOTIATOR tier"
    shared_operations:
      - "POST /labor-relations/settlement-offers/{id}/authorize (ANALYST and DIRECTOR tiers; shared with LaborRelationsDirector)"
      - "all GET endpoints except the Grievant-scoped reads"

  - name: ArbitrationAdministrator
    description: "Neutral case administrator for the arbitration track. Maintains the arbitrator roster, issues strike panels, books hearings and records awards. Takes no strikes and holds no settlement authority."
    identity: opaque
    exclusive_operations:
      - "POST /labor-relations/arbitrators"
      - "POST /labor-relations/arbitration-demands/{id}/request-panel"
      - "POST /labor-relations/arbitration-demands/{id}/schedule-hearing"
      - "POST /labor-relations/arbitration-demands/{id}/awards"
    shared_operations:
      - "all GET endpoints except the Grievant-scoped reads"
