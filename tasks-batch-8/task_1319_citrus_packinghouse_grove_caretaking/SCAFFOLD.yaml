    side_effects: ["Certificate ISSUED -> REVOKED; lot CERTIFIED -> INSPECTION_READY with phyto_certificate_id cleared; increments lot.version"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth / request ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing, or X-User-Role names an undeclared role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role is not in the endpoint's roles list" }
  - { id: ERR_GROWER_OWNERSHIP_MISMATCH, http: 403, condition: "Grower-role caller's X-User-ID does not match the owning grower of the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path-referenced resource does not exist (validated left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum member, or out-of-range scalar" }
  # --- state / OCC ---
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "The target resource's current state does not permit the requested transition (generic state gate; includes terminal-state lockdown)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version (OCC)" }
  # --- regulatory / safety ---
  - { id: ERR_GROVE_QUARANTINED, http: 422, condition: "The grove's quarantine_posture is QUARANTINED and the operation requires CLEAR" }
  - { id: ERR_GROVE_RETIRED, http: 409, condition: "The grove's lifecycle_status is RETIRED; no new harvest, delivery, or caretaking activity" }
  - { id: ERR_DELIVERY_REGULATORY_HOLD, http: 422, condition: "The delivery's regulatory_status is HELD or CONDEMNED; sorting operations blocked" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The actor's X-User-ID equals the officer/creator id of a prior step that must be performed by a different person" }
  - { id: ERR_FRUIT_FLY_PROTOCOL_BLOCK, http: 422, condition: "JAPAN-bound lot whose source grove (or its county) is under an ACTIVE FRUIT_FLY quarantine" }
  - { id: ERR_COLD_TREATMENT_INSUFFICIENT, http: 422, condition: "JAPAN-bound lot with cold_treatment_hours < 24" }
  - { id: ERR_QUARANTINE_RELEASE_REQUIREMENTS, http: 422, condition: "Quarantine release attempted with inspection_passed != true" }
  - { id: ERR_CERT_EXPIRED, http: 422, condition: "Ship attempted at or after the certificate's expires_at (strict now < expires_at required)" }
  # --- maturity ---
  - { id: ERR_MATURITY_TEST_REQUIRED, http: 422, condition: "No MaturityTest exists for the grove (or none in CURRENT status)" }
  - { id: ERR_MATURITY_NOT_PASSING, http: 422, condition: "The grove's CURRENT maturity test has result FAIL" }
  - { id: ERR_MATURITY_TEST_EXPIRED, http: 422, condition: "The grove's CURRENT passing maturity test has expires_at <= now" }
  - { id: ERR_ASSIGNMENT_WINDOW_NOT_OPEN, http: 422, condition: "Assignment start attempted outside [window_start, window_end): now < window_start or now >= window_end" }
  # --- capacity / constraint ---
  - { id: ERR_CREW_WINDOW_OVERLAP, http: 409, condition: "The crew already has a SCHEDULED or IN_PROGRESS assignment whose half-open window intersects the requested window" }
  - { id: ERR_CREW_CAPACITY_EXCEEDED, http: 422, condition: "planned_boxes exceeds daily_capacity_boxes * ceil(window hours / 24)" }
  - { id: ERR_CREW_NOT_ACTIVE, http: 409, condition: "The crew is INACTIVE" }
  - { id: ERR_ROOM_CAPACITY_EXCEEDED, http: 422, condition: "Aggregate overlapping boxes in the room would exceed capacity_boxes at some instant" }
  - { id: ERR_ROOM_NOT_AVAILABLE, http: 409, condition: "The room is in MAINTENANCE (or enter-maintenance attempted with CONDITIONING sessions)" }
  - { id: ERR_DEGREENING_DURATION_OUT_OF_BOUNDS, http: 422, condition: "Release duration outside [room.min_hours, room.max_hours] without a QualityInspector override" }
  - { id: ERR_DEGREENING_REQUIRED, http: 422, condition: "Delivery variety requires degreening but is still in RECEIVED processing status" }
  - { id: ERR_SORT_BOX_MISMATCH, http: 422, condition: "fancy+choice+standard+juice+cull does not equal delivery.net_boxes exactly" }
  - { id: ERR_SORT_RUN_ALREADY_ACTIVE, http: 409, condition: "A non-VOIDED SortRun already exists for the delivery" }
  - { id: ERR_DUPLICATE_ENTITY, http: 409, condition: "Uniqueness violated (grower_code, block_code per grower, crew_code, room_code, channel_code, certificate_number, pool variety+week)" }
  - { id: ERR_CHANNEL_CAPACITY_EXCEEDED, http: 422, condition: "Export lot boxes exceed the source channel's posted-allocation boxes not already reserved by other lots" }
  - { id: ERR_ACRES_EXCEED_GROVE, http: 422, condition: "acres_treated exceeds grove.acreage" }
  - { id: ERR_CHEMICAL_COST_NOT_ALLOWED, http: 422, condition: "chemical_cost_cents > 0 on a non-SPRAY service order" }
  # --- pool / fiscal ---
  - { id: ERR_POOL_NOT_ACCEPTING, http: 409, condition: "The pool is not in the state this operation requires (OPEN for intake/reversal/divert, or the operation's pinned pool state)" }
  - { id: ERR_POOL_HAS_OPEN_DELIVERIES, http: 409, condition: "close-intake attempted while pool deliveries remain in RECEIVED/IN_DEGREENING/READY_TO_SORT and not CONDEMNED" }
  - { id: ERR_ADVANCE_CAP_EXCEEDED, http: 422, condition: "grower.advance_outstanding_cents + amount_cents would exceed the advance cap" }
  - { id: ERR_GROWER_NOT_ACTIVE, http: 409, condition: "The grower is SUSPENDED or TERMINATED; value-extending operations blocked (also blocks terminate when balances remain)" }
  - { id: ERR_INVOICE_OVERPAYMENT, http: 422, condition: "Payment exceeds the invoice's remaining balance (total_cents - paid_cents)" }
  - { id: ERR_PAYMENT_AMOUNT_INVALID, http: 400, condition: "Payment amount_cents <= 0" }
  # --- referential ---
  - { id: ERR_CHANNEL_MISMATCH, http: 422, condition: "Channel variety/market/week does not match the referencing entity (export lot or sort allocation)" }
  - { id: ERR_ASSIGNMENT_NOT_ACTIVE, http: 409, condition: "Delivery references an assignment that is not IN_PROGRESS, or the assignment's grove does not match the delivery grove" }
  - { id: ERR_NO_JUICE_CHANNEL, http: 422, condition: "No JUICE AllocationChannel exists for the variety + week required by a sort post or a lot diversion" }
  - { id: ERR_CARETAKING_NOT_ENROLLED, http: 422, condition: "Caretaking order created for a grove with caretaking_enrolled == false" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PackinghouseAdmin
    description: "Packinghouse configuration authority: growers, groves, crews, degreening rooms, allocation channels, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /packinghouse/growers"
      - "POST /packinghouse/groves and /packinghouse/groves/{id}/retire"
      - "POST /packinghouse/crews and /packinghouse/crews/{id}/deactivate"
      - "POST /packinghouse/degreening-rooms and maintenance transitions"
      - "POST /packinghouse/allocation-channels"
      - "POST /packinghouse/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: FieldSupervisor
    description: "Field operations: harvest crew scheduling, harvest assignment lifecycle, fruit receiving, caretaking service scheduling/completion"
    identity: opaque
    exclusive_operations:
      - "POST /packinghouse/harvest-assignments and start/complete/cancel"
      - "POST /packinghouse/deliveries"
      - "POST /packinghouse/caretaking-orders/{id}/schedule and /complete"
    shared_operations:
      - "POST /packinghouse/caretaking-orders (with Grower)"
      - "POST /packinghouse/caretaking-orders/{id}/cancel (with Grower)"
      - "All GET endpoints"
  - name: QualityInspector
    description: "Independent quality authority: maturity testing and sort-run verification (must differ from the sort run's creator)"
    identity: opaque
    exclusive_operations:
      - "POST /packinghouse/groves/{id}/maturity-tests"
      - "POST /packinghouse/sort-runs/{id}/verify"
    shared_operations:
      - "POST /packinghouse/degreening-sessions/{id}/release (only with override_approved; shared with LineOperator)"
      - "All GET endpoints"
  - name: LineOperator
    description: "Packing line operations: degreening sessions, sort runs, delivery close"
    identity: opaque
    exclusive_operations:
      - "POST /packinghouse/degreening-sessions and /abort"
      - "POST /packinghouse/sort-runs, /post, /void"
      - "POST /packinghouse/deliveries/{id}/close"
    shared_operations:
      - "POST /packinghouse/degreening-sessions/{id}/release (without override)"
      - "All GET endpoints"
  - name: PoolAccountant
    description: "Grower accounting: pools, advances, settlement, caretaking invoicing, grower standing"
    identity: opaque
    exclusive_operations:
      - "POST /packinghouse/pools and close-intake/set-price/settle"
      - "POST /packinghouse/advances/{id}/approve, /deny, /write-off"
      - "POST /packinghouse/caretaking-invoices and issue/reissue/void"
      - "POST /packinghouse/sort-runs/{id}/reverse"
      - "POST /packinghouse/growers/{id}/suspend, /reinstate, /terminate"
    shared_operations:
      - "POST /packinghouse/advances (with Grower)"
      - "POST /packinghouse/caretaking-invoices/{id}/payments (with Grower)"
      - "All GET endpoints"
  - name: ComplianceOfficer
    description: "Regulatory compliance: quarantine orders, delivery holds, export lots, phytosanitary certificates; segregation-of-duties rules apply within this role"
    identity: opaque
    exclusive_operations:
      - "POST /packinghouse/quarantine-orders and /release"
      - "POST /packinghouse/deliveries/{id}/hold, /release, /condemn"
      - "POST /packinghouse/export-lots and request-inspection/rework/divert/ship"
      - "POST /packinghouse/export-lots/{id}/phytosanitary-certificates"
      - "POST /packinghouse/phytosanitary-certificates/{id}/revoke"
    shared_operations:
      - "All GET endpoints"
  - name: Grower
    description: "Entity-backed grower portal user: reads own resources, requests advances and caretaking services, pays and disputes invoices"
    identity: "entity_backed:Grower"
    exclusive_operations:
      - "POST /packinghouse/caretaking-invoices/{id}/dispute"
    shared_operations:
      - "POST /packinghouse/advances (own grower_id only)"
      - "POST /packinghouse/caretaking-orders and cancel (own groves only)"
      - "POST /packinghouse/caretaking-invoices/{id}/payments (own invoices)"
      - "GET own growers/groves/pools/advances/caretaking-orders/caretaking-invoices/settlement-statements"
