          assert:
            - "after the first REINVESTIGATE: DefectClaim.${claim_id}.status == INVESTIGATING and negotiation_round == 1"
            - "after the second REINVESTIGATE: DefectClaim.${claim_id}.negotiation_round == 2"
            - "after the third REINVESTIGATE: DefectClaim.${claim_id}.negotiation_round == 3"
            - "the fourth REINVESTIGATE (twelfth trigger call) returns 422 with error_id ERR_NEGOTIATION_ROUNDS_EXHAUSTED"
            - "DefectClaim.${claim_id}.status == REJECTED_BY_DEVELOPER after the refused call, unchanged"
            - "DefectClaim.${claim_id}.negotiation_round == 3 after the refused call, not 4"
            - "DefectClaim.${claim_id}.repose_deadline == 2030-09-20T00:00:00Z, identical before and after every cycle"

      - name: vendor_contract_consent_and_refusal_branches_have_disjoint_effects
        grounds:
          - state_machines.VendorContract.ASSIGNMENT_REQUESTED_to_CONSENTED
          - state_machines.VendorContract.ASSIGNMENT_REQUESTED_to_CONSENT_REFUSED
          - calculations.records_transfer_completeness
          - entities.VendorContract.fields.assignment_status
          - entities.VendorContract.fields.status
          - entities.Association.fields.budget_forecast_status
        distinguishing_aspect: |
          Branching shape with a real fork: from the single state ASSIGNMENT_REQUESTED, CONSENT keeps
          status ACTIVE and reaches into a DIFFERENT entity (accepting every DELIVERED VENDOR_CONTRACTS
          RecordsTransferItem, moving records_transfer_completeness_pct 0.00 -> 100.00) while
          REFUSE_CONSENT sets status TERMINATED_FOR_REFUSAL and stales the association's budget forecast
          without touching a single records item — the two branches' side-effect sets are disjoint, not
          two spellings of the same effect.
          test-visible: after REFUSE_CONSENT on contract B the completeness is still 0.00.
        test_recipe:
          setup:
            - "Association 'Gladstone Park' with a TurnoverCase (total_seats 5) still in DECLARANT_CONTROL / SUBSIDY_ACTIVE."
            - "Two CommonAreaComponents, so the two vendor contracts occupy different components and cannot collide on service windows."
            - "Two VendorContracts, both status ACTIVE / assignment_status ASSIGNMENT_REQUESTED: contract A on component 1, contract B on component 2."
            - "Two required RecordsTransferItems of category VENDOR_CONTRACTS, both DELIVERED, so records_transfer_completeness_pct is 0.00."
            - "Logical clock at its default 2026-08-01T00:00:00Z."
