    side_effects: ["status -> SCHEDULED", "scheduled_send_date := send_after", "increments ConversionProject.version by 1"]
  - method: POST
    path: "/api/v1/customer-comms/{cid}/send"
    description: "Send a scheduled comm once its scheduled_send_date is reached"
    roles: [CommunicationsOfficer]
    code: 200
    input: []
    output: CustomerComm
