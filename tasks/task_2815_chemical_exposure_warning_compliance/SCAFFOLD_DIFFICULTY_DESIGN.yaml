            - call: "POST /exposure-assessments/${asmt_final}/transitions"
              payload: { action: "FINALIZE" }
              as: ToxicologyReviewer
              as_user_id: "tox_1"
            - call: "POST /products/${prod_1}/exposure-assessments"
              payload: { chemical_id: "${chem_bpa}", method: "MODELED", route: "DERMAL", uses_per_day: 1.0 }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
              captures: { asmt_draft: $.data.id }
          trigger:
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "RECORD_RESPONSE", response_completeness: "COMPLETE" }
              as: ComplianceAnalyst
          assert:
            - "before the trigger: Material.${mat_1}.disclosure_status == INCOMPLETE, Product.${prod_1}.total_listed_chemical_load_ug == 62.5, compliance_posture == EXPOSURE_UNKNOWN"
            - "before the trigger: ExposureAssessment.${asmt_final}.daily_exposure_ug == 3.125 and ExposureAssessment.${asmt_draft}.daily_exposure_ug == 3.125"
            - "after the intermediate REQUEST: Material.${mat_1}.disclosure_status == REQUESTED and the gap is still open, so compliance_posture is still EXPOSURE_UNKNOWN"
            - "L1: Material.${mat_1}.disclosure_status == RECEIVED and data_received_at == 2026-08-01T00:00:00Z"
            - "L2: ExposureAssessment.${asmt_draft}.daily_exposure_ug == 0.5, margin_ratio == 1.0, result == AT_OR_ABOVE_SAFE_HARBOR, status == DRAFT"
            - "L2: Product.${prod_1}.total_listed_chemical_load_ug == 10.0"
            - "L3: Product.${prod_1}.compliance_posture == WARNING_REQUIRED"
            - "the FINAL row is NOT recomputed: ExposureAssessment.${asmt_final}.daily_exposure_ug == 3.125 and margin_ratio == 6.25 and status == FINAL"

  # ===========================================================================
  # RULE 5 - priority_pair_validation_conflict
