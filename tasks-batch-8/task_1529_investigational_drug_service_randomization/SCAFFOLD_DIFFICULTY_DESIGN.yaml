  - rule_id: boundary_precision_check
    instances:
      - name: temperature_reading_exactly_at_minimum_stays_in_range
        grounds:
          - calculations.excursion_severity_minutes
          - entities.Lot.fields.storage_temp_min_celsius
          - errors[ERR_KIT_QUARANTINED_EXCURSION]
        distinguishing_aspect: |
          Boundary on the TEMPERATURE metric via POST /api/temperature-logs: the
          storage range is INCLUSIVE — a reading of exactly 2.0 C (== min) creates
          no excursion and leaves the kit AVAILABLE, while 1.9 C (one tick below)
          opens an excursion and quarantines the kit.
        test_recipe:
          setup:
            - "Study ACTIVE; site ACTIVE; lot range [2,8]; kit K-T released AVAILABLE"
          setup_api_calls:
            - { call: "POST /api/studies", payload: { protocol_number: "P-BND-1", title: "Boundary Study", phase: "PHASE_II", blinding_model: "DOUBLE_BLIND", max_dose_per_visit_mg: 200, unblinding_suspension_threshold_pct: 10 }, as: SponsorAdmin, captures: { study: $.data.id, study_v1: $.data.version } }
            - { call: "POST /api/fee-schedules", payload: { study_id: "${study}", setup_fee_cents: 0, dispensing_fee_cents: 5000, dispensing_tier_threshold: 2, dispensing_tier_fee_cents: 3000, monitoring_fee_cents_per_hour: 10000, storage_fee_cents_per_kit_month: 100, unblinding_fee_cents: 25000, overhead_pct: 0 }, as: SponsorAdmin, captures: { fs: $.data.id } }
            - { call: "POST /api/fee-schedules/${fs}/approve", payload: { expected_study_version: "${study_v1}" }, as: SponsorAdmin }
            - { call: "POST /api/studies/${study}/transition", payload: { to: "ACTIVE" }, as: SponsorAdmin }
            - { call: "POST /api/sites", payload: { study_id: "${study}", site_number: "S1", name: "Site One", principal_investigator: "Dr A" }, as: SponsorAdmin, captures: { site: $.data.id } }
            - { call: "POST /api/sites/${site}/transition", payload: { to: "ACTIVE" }, as: SponsorAdmin }
            - { call: "POST /api/staff", payload: { site_id: "${site}", full_name: "Pharm One", license_number: "L-BND-1" }, as: SponsorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/lots", payload: { study_id: "${study}", lot_number: "LOT-BND-1", product_name: "DrugX", strength_mg: 50, dosage_form: "VIAL", expiry_date: "2027-06-01T00:00:00Z", storage_temp_min_celsius: 2, storage_temp_max_celsius: 8, stability_budget_minutes: 600 }, as: SponsorAdmin, captures: { lot: $.data.id } }
            - { call: "POST /api/shipments", payload: { lot_id: "${lot}", site_id: "${site}", kit_numbers: ["K-T"], units_per_kit: 10 }, as: SponsorAdmin, captures: { k1: "$.data[0].id" } }
            - { call: "POST /api/kits/${k1}/receive", payload: { storage_temp_celsius: 5 }, as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/kits/${k1}/release", as: Pharmacist, as_user_id: "${p1}" }
          trigger:
            - { call: "POST /api/temperature-logs", payload: { site_id: "${site}", celsius: 2.0, source: "DATALOGGER" }, as: Pharmacist, as_user_id: "${p1}", captures: { log_exc_20: $.data.excursion_id } }
            - { call: "POST /api/temperature-logs", payload: { site_id: "${site}", celsius: 1.9, source: "DATALOGGER" }, as: Pharmacist, as_user_id: "${p1}", captures: { log_exc_19: $.data.excursion_id } }
          assert:
            - "log_exc_20 == null — a reading exactly equal to storage_temp_min_celsius (2.0) is IN RANGE (inclusive bound); no excursion opened"
            - "Kit.${k1}.status == AVAILABLE after the 2.0 reading"
            - "log_exc_19 != null — 1.9 is below the inclusive minimum and opens an excursion"
            - "Kit.${k1}.status == QUARANTINED_EXCURSION after the 1.9 reading"
      - name: stability_budget_exactly_consumed_blocks_release
        grounds:
          - calculations.excursion_severity_minutes
          - entities.Lot.fields.stability_budget_minutes
          - errors[ERR_LOT_STABILITY_EXHAUSTED]
        distinguishing_aspect: |
          Boundary on a DIFFERENT metric (stability MINUTES) via a DIFFERENT
          endpoint (POST /api/kits/{id}/release): exhaustion uses >= — consumed
          exactly == budget (400 == 400) blocks release with
          ERR_LOT_STABILITY_EXHAUSTED, and the excursion-quarantined kit is NOT
          restored even by an ACCEPTABLE assessment.
        test_recipe:
          setup:
            - "Study ACTIVE; site ACTIVE; lot range [2,8] with stability_budget_minutes 400; kit K-S1 AVAILABLE"
            - "Excursion with two readings (9.5 at 00:00, 1.0 at 01:40 = 100 minutes, both sides, deviation 1.5) assessed ACCEPTABLE charges exactly 400 minutes == budget"
            - "Kit K-S2 then received (in-range receipt) into QUARANTINED_RECEIPT"
          setup_api_calls:
            - { call: "POST /api/studies", payload: { protocol_number: "P-BND-2", title: "Budget Study", phase: "PHASE_II", blinding_model: "DOUBLE_BLIND", max_dose_per_visit_mg: 200, unblinding_suspension_threshold_pct: 10 }, as: SponsorAdmin, captures: { study: $.data.id, study_v1: $.data.version } }
            - { call: "POST /api/fee-schedules", payload: { study_id: "${study}", setup_fee_cents: 0, dispensing_fee_cents: 5000, dispensing_tier_threshold: 2, dispensing_tier_fee_cents: 3000, monitoring_fee_cents_per_hour: 10000, storage_fee_cents_per_kit_month: 100, unblinding_fee_cents: 25000, overhead_pct: 0 }, as: SponsorAdmin, captures: { fs: $.data.id } }
            - { call: "POST /api/fee-schedules/${fs}/approve", payload: { expected_study_version: "${study_v1}" }, as: SponsorAdmin }
            - { call: "POST /api/studies/${study}/transition", payload: { to: "ACTIVE" }, as: SponsorAdmin }
            - { call: "POST /api/sites", payload: { study_id: "${study}", site_number: "S1", name: "Site One", principal_investigator: "Dr A" }, as: SponsorAdmin, captures: { site: $.data.id } }
            - { call: "POST /api/sites/${site}/transition", payload: { to: "ACTIVE" }, as: SponsorAdmin }
            - { call: "POST /api/staff", payload: { site_id: "${site}", full_name: "Pharm One", license_number: "L-BND-2" }, as: SponsorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/lots", payload: { study_id: "${study}", lot_number: "LOT-BND-2", product_name: "DrugX", strength_mg: 50, dosage_form: "VIAL", expiry_date: "2027-06-01T00:00:00Z", storage_temp_min_celsius: 2, storage_temp_max_celsius: 8, stability_budget_minutes: 400 }, as: SponsorAdmin, captures: { lot: $.data.id } }
            - { call: "POST /api/shipments", payload: { lot_id: "${lot}", site_id: "${site}", kit_numbers: ["K-S1", "K-S2"], units_per_kit: 10 }, as: SponsorAdmin, captures: { k1: "$.data[0].id", k2: "$.data[1].id" } }
            - { call: "POST /api/kits/${k1}/receive", payload: { storage_temp_celsius: 5 }, as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/kits/${k1}/release", as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/temperature-logs", payload: { site_id: "${site}", celsius: 9.5, source: "DATALOGGER" }, as: Pharmacist, as_user_id: "${p1}", captures: { exc: $.data.excursion_id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:40:00Z" }, as: SponsorAdmin }
            - { call: "POST /api/temperature-logs", payload: { site_id: "${site}", celsius: 1.0, source: "DATALOGGER" }, as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/temperature-excursions/${exc}/assess", payload: { outcome: "ACCEPTABLE", resolution_rationale: "QA" }, as: SponsorAdmin }
            - { call: "POST /api/kits/${k2}/receive", payload: { storage_temp_celsius: 5 }, as: Pharmacist, as_user_id: "${p1}" }
          trigger:
            - { call: "POST /api/kits/${k2}/release", as: Pharmacist, as_user_id: "${p1}", captures: { err: $.data.error_id } }
          assert:
            - "Lot.${lot}.stability_minutes_consumed == 400 == stability_budget_minutes (boundary hit exactly)"
            - "err == ERR_LOT_STABILITY_EXHAUSTED — consumed >= budget blocks the release of even a receipt-quarantined kit"
            - "Kit.${k1}.status == QUARANTINED_EXCURSION still (consumed == budget prevented the ACCEPTABLE restore)"
  - rule_id: cross_entity_state_dependency
    instances:
      - name: kit_release_blocked_when_study_suspended
        grounds:
          - state_machines.Kit.QUARANTINED_RECEIPT_to_AVAILABLE
          - state_machines.Study.ACTIVE_to_SUSPENDED
          - errors[ERR_STUDY_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair KIT x STUDY: the kit's QUARANTINED_RECEIPT -> AVAILABLE
          transition is gated on the parent study being ACTIVE; after a manual
          suspension the release is rejected with ERR_STUDY_NOT_ACTIVE and the
          ACTIVE site is observed in ON_HOLD (cascade).
        test_recipe:
          setup:
            - "Study ACTIVE; site ACTIVE; kit K-R in QUARANTINED_RECEIPT (received in-range, not yet released)"
          setup_api_calls:
            - { call: "POST /api/studies", payload: { protocol_number: "P-XEN-1", title: "Cross Study", phase: "PHASE_II", blinding_model: "DOUBLE_BLIND", max_dose_per_visit_mg: 200, unblinding_suspension_threshold_pct: 10 }, as: SponsorAdmin, captures: { study: $.data.id, study_v1: $.data.version } }
