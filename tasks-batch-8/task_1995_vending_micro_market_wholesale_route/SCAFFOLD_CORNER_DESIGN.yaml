          - "errors[ERR_OPERATOR_NOT_ACTIVE]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / submit_suspended_operator_beats_min_order
          rationale: "Asserted as the winning error of the state-vs-fiscal priority instance."
      - name: error_min_order_not_met_below_threshold
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_MIN_ORDER_NOT_MET]"
        excluded_because:
          difficulty_instance: boundary_precision_check / min_order_exact_boundary
          rationale: "The 1789-vs-1790 boundary instance asserts ERR_MIN_ORDER_NOT_MET."
      - name: error_route_capacity_exceeded_on_confirm
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_ROUTE_CAPACITY_EXCEEDED]"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / route_day_capacity_aggregate
          rationale: "The aggregate-capacity instance asserts ERR_ROUTE_CAPACITY_EXCEEDED on the third confirm."
      - name: error_promotion_window_overlap_on_create
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_PROMOTION_WINDOW_OVERLAP]"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / promotion_window_overlap_half_open
          rationale: "The half-open overlap instance asserts ERR_PROMOTION_WINDOW_OVERLAP."
      - name: error_claim_window_expired_on_create
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_CLAIM_WINDOW_EXPIRED]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / claim_window_expired_beats_qty_exceeded
          rationale: "The temporal-vs-referential priority instance asserts ERR_CLAIM_WINDOW_EXPIRED."
      - name: error_order_not_delivered_on_claim_create
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_ORDER_NOT_DELIVERED]"
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / claim_create_gated_by_order_delivered
          rationale: "The Claim->Order dependency instance asserts ERR_ORDER_NOT_DELIVERED before delivery and success after."

  # ============================================================ roles
  - section: roles
    instances:
      - name: rbac_exclusive_operation_denials
        claim_type: rbac_denial
        grounds:
          - "roles[WholesaleAdmin]"
          - "roles[OperatorManager]"
          - "roles[RoutePlanner]"
          - "roles[WarehouseOps]"
          - "roles[CreditAdjuster]"
          - "roles[TelemetryGateway]"
          - "validations[priority=3]"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "Peer-role model (no superuser inheritance): each role calling another role's exclusive endpoint gets ERR_FORBIDDEN — six denials, including WholesaleAdmin being denied telemetry ingestion (admin is NOT a superset here)."
        test_recipe:
          setup: ["empty DB (role check at priority 3 fires before existence, so bogus ids suffice)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /wholesale/products", payload: { sku: "RB-1", name: "Denied", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 100, cost_cents: 50, shelf_life_days: 30 }, as: OperatorManager, as_user_id: "11111111-1111-1111-1111-111111111111", captures: { e1: $.data.error_id } }
            - { call: "POST /wholesale/credit-claims", payload: { order_id: "22222222-2222-2222-2222-222222222222", lines: [] }, as: CreditAdjuster, captures: { e2: $.data.error_id } }
            - { call: "POST /wholesale/orders/33333333-3333-3333-3333-333333333333/mark-delivered", as: RoutePlanner, captures: { e3: $.data.error_id } }
            - { call: "POST /wholesale/orders/44444444-4444-4444-4444-444444444444/settle", payload: { tender_type: "CASH", telemetry_event_id: "55555555-5555-5555-5555-555555555555" }, as: WarehouseOps, captures: { e4: $.data.error_id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-RB", delivery_weekdays: ["MON"], daily_case_capacity: 10, min_order_cents: 0 }, as: TelemetryGateway, captures: { e5: $.data.error_id } }
            - { call: "POST /wholesale/telemetry-events", payload: { location_id: "66666666-6666-6666-6666-666666666666", recorded_at: "2026-08-01T00:00:00Z", cash_collected_cents: 0, cashless_sales_cents: 0, items: [] }, as: WholesaleAdmin, captures: { e6: $.data.error_id } }
          assert:
            - "OperatorManager creating products -> e1 == ERR_FORBIDDEN"
            - "CreditAdjuster filing claims -> e2 == ERR_FORBIDDEN"
            - "RoutePlanner marking delivered -> e3 == ERR_FORBIDDEN"
            - "WarehouseOps settling -> e4 == ERR_FORBIDDEN"
            - "TelemetryGateway creating routes -> e5 == ERR_FORBIDDEN"
            - "WholesaleAdmin ingesting telemetry -> e6 == ERR_FORBIDDEN   # peer_roles: no superset"

      - name: rbac_operator_manager_positive_own_resource
        claim_type: rbac_allowance
        grounds:
          - "roles[OperatorManager]"
          - "validations[priority=5]"
        distinguishing_aspect: "The same ownership rule that denies foreign resources permits them when X-User-ID equals the operator: an OperatorManager creates a location for its own operator_id and reads it back."
        test_recipe:
          setup: ["operator and route exist"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Allow" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-ALW", delivery_weekdays: ["WED"], daily_case_capacity: 50, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
          trigger:
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Allow", location_type: "HOSPITAL", route_id: "${rt}" }, as: OperatorManager, as_user_id: "${op}", captures: { loc: $.data.id } }
          assert:
            - "creation succeeds: Location.${loc}.operator_id == ${op}"
            - "Location.${loc}.on_hand_projection == []"

  # ============================================================ cross-cutting complexity layers
  - section: cross_cutting_layers
    instances:
      - name: planogram_activate_stale_location_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[planogram-activate-stale-location]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "OCC on Location.version: after PG1 activation bumps the location version, activating PG2 with the pre-activation version is rejected ERR_STALE_VERSION (412) — the supersede it based on is stale."
        test_recipe:
          setup: ["PG1 activated (location version advanced from v1); PG2 drafted; client still holds v1"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op OCC1" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-OCC1", delivery_weekdays: ["MON"], daily_case_capacity: 50, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "OCC-1", name: "Occ item", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Occ1", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-First", slots: [{ slot_code: "A1", product_id: "${pr}", par_level_units: 10, vend_price_cents: 150 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg1: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg1}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-Second", slots: [{ slot_code: "B1", product_id: "${pr}", par_level_units: 20, vend_price_cents: 160 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg2: $.data.id } }
          trigger:
            - { call: "POST /wholesale/planograms/${pg2}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALE_VERSION   # ${loc_v} is stale: PG1's activation already bumped Location.version"
            - "Planogram.${pg2}.status == DRAFT and Planogram.${pg1}.status == ACTIVE"

      - name: order_patch_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[order-patch-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "OCC on ReplenishmentOrder.version: after a first PATCH bumps the order version, a second PATCH replaying the original version is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["DRAFT order at version 1; first patch applied (version 2)"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op OCC2" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-OCC2", delivery_weekdays: ["MON"], daily_case_capacity: 50, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "OC2-1", name: "Occ2 item", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Occ2", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id } }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 1 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ord: $.data.id, ord_v: $.data.version } }
            - { call: "PATCH /wholesale/orders/${ord}", payload: { expected_order_version: "${ord_v}", lines: [{ product_id: "${pr}", quantity_cases: 2 }] }, as: OperatorManager, as_user_id: "${op}" }
          trigger:
            - { call: "PATCH /wholesale/orders/${ord}", payload: { expected_order_version: "${ord_v}", lines: [{ product_id: "${pr}", quantity_cases: 5 }] }, as: OperatorManager, as_user_id: "${op}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALE_VERSION   # first patch already advanced the version past ${ord_v}"
            - "ReplenishmentOrder.${ord}.total_cases == 2   # the stale patch did not apply"

      - name: layer_cascading_side_effects
        claim_type: cascading_side_effects
        grounds:
          - "complexity_profile.complexity_layers"
        excluded_because:
          difficulty_instance: transitive_cascade / claim_approve_credit_cascade_depth3
          rationale: "Depth-3 claim-approve cascade and depth-2 telemetry cascade are asserted end-to-end in §1.8."
      - name: layer_dual_variant_calculation
        claim_type: dual_variant_calculation
        grounds:
          - "complexity_profile.complexity_layers"
        excluded_because:
          difficulty_instance: dual_variant_calc / margin_per_vend_provisional_vs_realized
          rationale: "Both variant pairs (margin provisional/realized, capacity firm/optimistic) are asserted in §1.8."
      - name: layer_rate_threshold_triggers
        claim_type: rate_threshold_triggers
        grounds:
          - "complexity_profile.complexity_layers"
        excluded_because:
          difficulty_instance: boundary_precision_check / cull_velocity_exact_boundary
          rationale: "Cull threshold (strict < at exactly 2 units) and route capacity equality are asserted in §1.8."

  # ============================================================ consistency model
  - section: consistency_model
    instances:
      - name: submit_response_contains_computed_pricing
        claim_type: immediate_consistency
        grounds:
          - "complexity_profile.consistency_model"
          - "endpoints.POST /wholesale/orders/{orderId}/submit"
        distinguishing_aspect: "Immediate consistency: the submit RESPONSE body itself carries the freshly computed pricing (order_total_cents 900, promo_discount_cents 100 after a 10% promo on 1000) — no re-read needed to observe the mutation."
        test_recipe:
          setup: ["order 1 case base 1000; global EXCLUSIVE 10% promo covering 2026-08"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Cons" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-CONS", delivery_weekdays: ["MON"], daily_case_capacity: 50, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "CON-1", name: "Cons item", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/promotions", payload: { product_id: "${pr}", discount_type: "PERCENT_OFF", discount_value: 10, starts_at: "2026-07-01T00:00:00Z", ends_at: "2026-09-01T00:00:00Z", stacking_class: "EXCLUSIVE" }, as: WholesaleAdmin }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Cons", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-Cons", slots: [{ slot_code: "A1", product_id: "${pr}", par_level_units: 10, vend_price_cents: 150 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 1 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ord: $.data.id } }
          trigger:
            - { call: "POST /wholesale/orders/${ord}/submit", as: OperatorManager, as_user_id: "${op}", captures: { tot: $.data.order_total_cents, disc: $.data.promo_discount_cents, fst: $.data.fulfillment_status } }
          assert:
            - "submit response: order_total_cents == 900"
            - "submit response: promo_discount_cents == 100"
            - "submit response: fulfillment_status == SUBMITTED"
