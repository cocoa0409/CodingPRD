            - { call: "POST /press-qualifications", payload: { mold_id: "${mold_id}", press_id: "${p150_id}" }, as: ProcessEngineer, captures: { pq_id: $.data.id } }
            - { call: "POST /press-qualifications/${pq_id}/schedule-run-at-rate", payload: { scheduled_start: "2026-09-02T08:00:00Z", scheduled_end: "2026-09-02T12:00:00Z", target_parts_per_hour: 400 }, as: ProcessEngineer }
            - { call: "POST /press-qualifications/${pq_id}/record-run-at-rate", payload: { actual_parts_per_hour: 380 }, as: QualityEngineer }
            - { call: "POST /quotes", payload: { customer_id: "${cust_id}", mold_id: "${mold_id}", part_weight_grams: 32, cycle_time_sec: 38, cavitation: 4, resin_grade: "PP-H", resin_price_cents_per_kg: 210, annual_volume: 120000 }, as: SalesEngineer, captures: { quote_id: $.data.id } }
            - { call: "POST /quotes/${quote_id}/price", payload: { press_id: "${p150_id}" }, as: SalesEngineer }
            - { call: "POST /quotes/${quote_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "GET /molds/${mold_id}", payload: {}, as: SalesEngineer, captures: { mold_v1: $.data.version } }
            - { call: "POST /quotes/${quote_id}/customer-decision", payload: { decision: "ACCEPT", expected_mold_version: "${mold_v1}" }, as: CustomerRep, as_user_id: "${cust_id}" }
            - { call: "POST /ppap-submissions", payload: { mold_id: "${mold_id}", quote_id: "${quote_id}", level: 3, max_regrind_bp: 2000 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { ppap_id: $.data.id } }
            - { call: "POST /ppap-submissions/${ppap_id}/submit", payload: { fai_dimensional_pass: true, fai_sample_shots: 30 }, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /ppap-submissions/${ppap_id}/internal-review", payload: { decision: "ENDORSE" }, as: QualityEngineer, as_user_id: "qe-bob" }
            - { call: "GET /molds/${mold_id}", payload: {}, as: QualityEngineer, captures: { mold_v2: $.data.version } }
