      - name: reopen_on_an_open_finding_is_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines[entity=AuditFinding]
          - validations[priority=45]
          - errors.ERR_FINDING_STATE_INVALID
        distinguishing_aspect: "The only edge into OPEN from elsewhere is CLOSED -> OPEN, so reopening a finding that is still OPEN is refused at priority 45 and reopen_reason must NOT be written - a stored reason on an OPEN row would make the audit trail claim a reopen that never happened."
        test_recipe:
          setup:
            - "One brand owns style NL-4410; audit A1 is open on that brand with one OPEN finding of 100 units."
          setup_api_calls:
