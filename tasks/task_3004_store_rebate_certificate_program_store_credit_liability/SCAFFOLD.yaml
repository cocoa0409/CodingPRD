# =============================================================================
# §1.6 Error Code Catalog (26 errors)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint, or entity-backed role acting on another account's resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource does not exist or is mis-nested (wrong store / wrong parent)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed payload: missing required field, invalid enum, quantity or amount below 1, tender_splits not summing to line totals" }
  - { id: ERR_TENDER_SPLIT_MISMATCH, http: 422, condition: "A receipt line's tender_splits amounts do not sum exactly to quantity * unit_price_cents" }
  - { id: ERR_RECEIPT_IN_FUTURE, http: 422, condition: "Receipt purchase_at is after the logical clock" }
  - { id: ERR_DUPLICATE_RECEIPT_NUMBER, http: 409, condition: "receipt_number already exists at this store" }
  - { id: ERR_INVALID_JOB_PURCHASE, http: 422, condition: "job_purchase_id set on a non-CONTRACTOR account, job not owned by the account, or job not OPEN" }
  - { id: ERR_SUBMISSION_WINDOW_CLOSED, http: 422, condition: "Logical clock past purchase_date + submission_window_days (deadline itself still valid) on submit, approve, or resubmit" }
  - { id: ERR_DUPLICATE_RECEIPT_SUBMISSION, http: 409, condition: "A non-REVERSED submission already exists for this receipt; DUPLICATE_RECEIPT FraudFlag created" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state that permits the operation (e.g. adjudicate a SUBMITTED submission, redeem an EXPIRED certificate, add items to a non-DRAFT program)" }
  - { id: ERR_RESUBMIT_LIMIT_REACHED, http: 409, condition: "resubmit_count already at MAX_RESUBMITS (3)" }
  - { id: ERR_ACCOUNT_FROZEN, http: 409, condition: "Account FROZEN blocks submission creation, adjudication-approve, and redemption-related flows" }
  - { id: ERR_ACCOUNT_BALANCE_NONZERO, http: 409, condition: "Account close attempted with credit_balance_cents or pending_award_cents nonzero" }
  - { id: ERR_FRAUD_FLAG_OPEN, http: 409, condition: "Unfreeze attempted while a DUPLICATE_RECEIPT FraudFlag is OPEN on the account" }
  - { id: ERR_ACCOUNT_FRAUD_CONFIRMED, http: 409, condition: "Reissue attempted while a CONFIRMED FraudFlag exists on the account" }
  - { id: ERR_CERTIFICATE_HELD, http: 409, condition: "Certificate fraud_hold = HELD blocks redeem and reissue" }
  - { id: ERR_CERTIFICATE_EXPIRED, http: 422, condition: "Redeem attempted at logical clock >= expires_at" }
  - { id: ERR_CERTIFICATE_WRONG_STORE, http: 422, condition: "Certificate redeemed against a receipt of a different store, or owned by a different account than the receipt" }
  - { id: ERR_CERTIFICATE_REBATE_PURCHASE_BARRED, http: 422, condition: "Redeeming receipt contains a line matching a rebate-eligible ProgramItem for its purchase week — certificates may not pay for further rebate-eligible purchases" }
  - { id: ERR_REDEMPTION_EXCEEDS_BALANCE, http: 422, condition: "amount_cents > remaining_balance_cents" }
  - { id: ERR_REISSUE_WINDOW_CLOSED, http: 422, condition: "Reissue attempted at logical clock >= expires_at + 30 days" }
  - { id: ERR_RETURN_QUANTITY_EXCEEDS_SOLD, http: 422, condition: "Cumulative returned quantity on a line would exceed sold quantity" }
  - { id: ERR_PROGRAM_EMPTY, http: 409, condition: "Program activation with zero ProgramItems" }
  - { id: ERR_PROGRAM_WEEK_OVERLAP, http: 409, condition: "Another ACTIVE program at the same store has an overlapping (not merely adjacent) advertised week" }
  - { id: ERR_PROGRAM_WEEK_PAST, http: 409, condition: "Program activation when the advertised week has already fully passed" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_store_version does not match the store's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: StoreAdmin
    description: "Store operations administrator: owns store policy, rebate programs, account closure; reads everything"
    identity: opaque
    exclusive_operations:
      - "POST /stores; PATCH /stores/{id}"
      - "POST /stores/{id}/rebate-programs and .../items, .../activate, .../close"
      - "POST /stores/{id}/credit-accounts/{id}/close"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET endpoints across the store surface"
  - name: GuestService
    description: "Guest service desk: receipts, returns, adjudication, certificate issuance/redemption/reissue"
    identity: opaque
    exclusive_operations:
      - "POST /stores/{id}/receipts and .../returns"
      - "POST /stores/{id}/rebate-submissions/{id}/adjudicate and .../issue-certificate"
      - "POST /stores/{id}/certificates/{id}/redeem and .../reissue"
      - "POST /stores/{id}/credit-accounts"
    shared_operations:
      - "GET endpoints across the store surface"
  - name: FraudAnalyst
    description: "Fraud investigation: freeze/unfreeze accounts, hold/release certificates, resolve/reopen flags"
    identity: opaque
    exclusive_operations:
      - "POST /stores/{id}/credit-accounts/{id}/freeze and .../unfreeze"
      - "POST /stores/{id}/certificates/{id}/hold and .../release"
      - "POST /stores/{id}/fraud-flags/{id}/resolve and .../reopen"
    shared_operations:
      - "GET /stores/{id}/fraud-flags and other reads"
  - name: FinanceAdmin
    description: "Store finance: runs breakage sweeps, reads ledgers and contractor summaries"
    identity: opaque
    exclusive_operations:
      - "POST /stores/{id}/breakage-runs"
    shared_operations:
      - "GET ledger, breakage runs, contractor summary, store liability reads"
  - name: Customer
    description: "Retail credit-account holder; acts only on own account"
    identity: "entity_backed:CreditAccount"
    exclusive_operations: []
    shared_operations:
      - "POST /stores/{id}/rebate-submissions and .../resubmit (own account's receipts only)"
      - "GET own account, submissions, certificates"
  - name: Contractor
    description: "Contractor credit-account holder; additionally manages job purchases and reads the contractor summary"
    identity: "entity_backed:CreditAccount"
    exclusive_operations:
      - "POST /stores/{id}/credit-accounts/{id}/job-purchases (own account only)"
      - "GET /stores/{id}/credit-accounts/{id}/contractor-summary (own account only)"
    shared_operations:
      - "POST /stores/{id}/rebate-submissions and .../resubmit (own account's receipts only)"
      - "GET own account, submissions, certificates"
