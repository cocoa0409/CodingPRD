          trigger:
            - {call: "PATCH /partner-orgs/${partner_id}/status", as: ProgramManager, as_user_id: "pm-1", payload: {probation_reason: "Low satisfaction"}, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 422"
            - "data.error_id == \"ERR_VALIDATION\""
