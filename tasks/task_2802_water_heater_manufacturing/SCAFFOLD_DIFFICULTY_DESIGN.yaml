        grounds:
          - validations[priority 8].ERR_INVALID_UNIT_STATE
          - validations[priority 12].ERR_MODEL_NOT_CERTIFIED
          - state_machines.HeaterUnit.ASSEMBLED_to_LABELED
          - endpoints[POST /mfg/heater-units/{id}/label]
        distinguishing_aspect: >
          Category pair state (priority 8) vs business_safety (priority 12), both 409, so the codes cannot be
          told apart by HTTP status - only the error_id reveals the ordering. The unit is COMPONENTS_STAGED AND
          its model is UNCERTIFIED, so both rules are violated by one call and only ERR_INVALID_UNIT_STATE may
          surface. The second half of the recipe assembles the unit and repeats the call, proving the
          suppressed rule is genuinely live and that the first result was ordering, not a missing check.
