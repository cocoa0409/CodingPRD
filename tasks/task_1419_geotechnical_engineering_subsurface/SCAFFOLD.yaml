  - { method: GET, path: "/geo/lab-test-results/{id}", description: "Fetch a lab result", roles: [FirmAdmin, ProjectManager, LabManager, LabTechnician, SeniorEngineer], code: 200, input: [], output: LabTestResult, side_effects: [] }
  - { method: GET, path: "/geo/lab-test-results", description: "List lab results; filter lab_test_order_id", roles: [FirmAdmin, ProjectManager, LabManager, LabTechnician, SeniorEngineer], code: 200, input: ["lab_test_order_id?", "limit?", "offset?"], output: "LabTestResult[]", side_effects: [] }
  - { method: POST, path: "/geo/projects/{id}/foundation-analyses", description: "Create a foundation analysis; provisional bearing capacity computed at creation", roles: [SeniorEngineer], code: 201, input: [method, "fs_required?", footing_width_ft, applied_bearing_psf], output: FoundationAnalysis, side_effects: ["bearing_capacity_provisional_psf computed"] }
  - { method: GET, path: "/geo/foundation-analyses/{id}", description: "Fetch an analysis", roles: [FirmAdmin, ProjectManager, SeniorEngineer, PrincipalEngineer], code: 200, input: [], output: FoundationAnalysis, side_effects: [] }
