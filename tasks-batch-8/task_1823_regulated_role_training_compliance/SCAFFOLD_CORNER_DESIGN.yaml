            - { call: "POST /compliance/curricula/${cur1}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://rvb1-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur1}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur1_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-RVB2", title: "RVB Two", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur2: "$.data.id", cur2_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur2}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://rvb2-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur2}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur2_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-RVB1", name: "RVB One" }, as: ComplianceAdmin, captures: { r1: "$.data.id" } }
            - { call: "POST /compliance/roles/${r1}/requirements", payload: { curriculum_id: "${cur1}", recurrence: "INITIAL_ONLY", due_in_days: 30, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-RVB2", name: "RVB Two" }, as: ComplianceAdmin, captures: { r2: "$.data.id" } }
            - { call: "POST /compliance/roles/${r2}/requirements", payload: { curriculum_id: "${cur2}", recurrence: "INITIAL_ONLY", due_in_days: 30, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-RVB-1", full_name: "RVB Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${r1}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "POST /compliance/employees/${emp}/role-changes", payload: { to_role_id: "${r2}", effective_at: "2026-08-10T00:00:00Z" }, as: HRAdmin, captures: { rc1: "$.data.id" } }
          trigger:
            - { call: "POST /compliance/role-changes/${rc1}/reverse", payload: {}, as: HRAdmin, captures: { err1: "$.data.error_id" } }
            - { call: "POST /compliance/role-changes/${rc1}/cancel", payload: {}, as: HRAdmin }
            - { call: "POST /compliance/employees/${emp}/role-changes", payload: { to_role_id: "${r2}", effective_at: "2026-08-03T09:00:00Z" }, as: HRAdmin, captures: { rc2: "$.data.id", rc2_st: "$.data.status" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${emp}", curriculum_id: "${cur2}" }, as: ComplianceAdmin, captures: { anew: "$.data[0].id" } }
            - { call: "POST /compliance/assignments/${anew}/completions", payload: { score_pct: 90, evidence_type: "NONE" }, as: Employee, as_user_id: "${emp}", captures: { cnew: "$.data.id" } }
            - { call: "POST /compliance/completions/${cnew}/accept", payload: {}, as: ComplianceAdmin }
            - { call: "POST /compliance/role-changes/${rc2}/reverse", payload: {}, as: HRAdmin, captures: { err2: "$.data.error_id" } }
          assert:
            - "err1 == \"ERR_ROLE_CHANGE_NOT_REVERSIBLE\" (SCHEDULED is not APPLIED)"
            - "rc2_st == \"APPLIED\" (effective_at <= now applies synchronously)"
            - "err2 == \"ERR_ROLE_CHANGE_NOT_REVERSIBLE\" (ACCEPTED completion exists on the change-created assignment ${anew})"

      - name: role_change_reverse_after_14_days_returns_retroactive_error
        claim_type: temporal_validation
        grounds:
          - "errors[ERR_RETROACTIVE_LIMIT_EXCEEDED]"
          - "validations[priority=8]"
        distinguishing_aspect: "Reverse is only legal within 14 days of applied_at: at applied_at + 15 days the reversal window has closed."
        test_recipe:
          setup: ["Clock 2026-08-03T09:00:00Z; roles R-RW1, R-RW2 (no requirements); employee E-RW in R-RW1; RC applied synchronously at 2026-08-03T09:00:00Z (effective_at == clock)"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
