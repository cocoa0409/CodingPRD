  - rule_id: boundary_precision_check
    instances:
      - name: section_capacity_exact_fill_third_enrollment_returns_section_full
        grounds:
          - entities.Section.fields.enrolled_count
          - state_machines.Section.OPEN_to_FULL
          - errors[ERR_SECTION_FULL]
        distinguishing_aspect: |
          Metric: seat count, via POST /school/sections/{id}/enrollments. Boundary is
          inclusive: enrolling at enrolled_count == capacity-1 succeeds and flips the
          section to FULL; the next enrollment at enrolled_count == capacity is
          rejected — capacity-1 vs capacity is the exact knife edge.
