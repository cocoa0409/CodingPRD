            - call: "POST /land-bank/acquisition-packets/${pk1_id}/board-approval"
              payload: { resolution_no: "R-2026-051" }
              as: BoardClerk
              as_user_id: "clerk-1"
            - call: "POST /land-bank/acquisition-packets/${pk1_id}/close"
              payload: { deed_reference: "BK-4413-PG-01" }
