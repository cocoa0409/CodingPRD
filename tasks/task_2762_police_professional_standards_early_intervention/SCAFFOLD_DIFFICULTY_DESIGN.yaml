            - "Reinstatement.${r1_id}.gross_back_pay_cents == 840002"
            - "the two full 10-day periods contribute round_half_up(9100013*10/260) = 350001 each and the 4-day remainder contributes round_half_up(9100013*4/260) = 140000; summing the unrounded periods and rounding once would give 840001, which must not be the stored value"
