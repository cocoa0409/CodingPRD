            - { call: "POST /recycle-routes/route-stops/${s2}/sample-screenings", payload: { halogen_ppm: 10, water_pct: 1.0, ph_level: 7.0 }, as: LabTech }
          trigger:
            - { call: "POST /recycle-routes/route-stops/${s2}/pickup-tickets", payload: { client_request_id: "OV-2", metered_volume_gallons: 50 }, as: Driver, as_user_id: "${drv_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "Route.loaded_gallons == 80 after stop 1"
            - "Stop 2 pickup of 50 would push loaded to 130 > vehicle_capacity_gallons 120"
            - "error_id == ERR_ROUTE_CAPACITY_EXCEEDED (HTTP 422)"
            - "Aggregate-capacity interval semantics: cumulative occupation of the route's tanker capacity, not point-in-time adjacency"

      - name: facility_daily_capacity_window
        grounds:
          - calculations.facility_scheduled_gallons
          - entities.DisposalFacility.fields.scheduled_gallons_today
        distinguishing_aspect: |
          Interval semantics = calendar-day window (not aggregate over an
          arbitrary interval): all manifests for a given scheduled_date
          compete for that day's facility capacity; a new day resets the
          window. Resource = DisposalFacility (different entity than rule-8
          instance 1's Route).
        test_recipe:
          setup:
            - "DisposalFacility daily_capacity_gallons=100"
            - "Manifest M1 for 2026-08-05 submitted with 100 gal -> scheduled_gallons_today = 100"
            - "Manifest M2 for 2026-08-06 with 100 gal (different scheduled_date) -> should SUCCEED (different day window)"
          setup_api_calls:
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "OvFac", epa_generator_id: "EPAGEN000081", market_zone: "NORTH", credit_terms: "NET30" }, as: RoutePlanner, captures: { cust_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tank-sites", payload: { customer_id: "${cust_id}", site_address: "81 Ov Ln", density_zone: "URBAN", route_eligibility_override: true }, as: RoutePlanner, captures: { site_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks", payload: { tank_site_id: "${site_id}", tank_kind: "USED_OIL", capacity_gallons: 500, ownership: "CUSTOMER_OWNED" }, as: TankInstaller, captures: { tank_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks/${tank_id}/register-existing", payload: {}, as: TankInstaller }
            - { call: "POST /recycle-routes/tanks/${tank_id}/record-intake", payload: { gallons: 400 }, as: RoutePlanner }
            - { call: "POST /recycle-routes/customers/${cust_id}/activate", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/drivers", payload: { driver_name: "OvF", cdl_class: "B", hazmat_endorsement: true }, as: RoutePlanner, captures: { drv_id: "$.data.id" } }
            - { call: "POST /recycle-routes/market-prices", payload: { market_zone: "NORTH", tank_kind: "USED_OIL", effective_date: "2026-08-01", price_cents_per_gal: 10 }, as: Regulator }
            - { call: "POST /recycle-routes/disposal-facilities", payload: { facility_name: "Daily TSDF", epa_id: "EPAID020", accepted_streams: ["USED_OIL"], daily_capacity_gallons: 100 }, as: Regulator, captures: { fac_id: "$.data.id" } }
            # Manifest 1 for 2026-08-05 with 100 gal
            - { call: "POST /recycle-routes/routes", payload: { route_code: "OVF-1", scheduled_date: "2026-08-05", driver_id: "${drv_id}", vehicle_capacity_gallons: 500, density_zone: "URBAN" }, as: RoutePlanner, captures: { r1_id: "$.data.id", r1_v: "$.data.version" } }
            - { call: "POST /recycle-routes/routes/${r1_id}/route-stops", payload: { tank_site_id: "${site_id}", tank_id: "${tank_id}", scheduled_window_start: "08:00", scheduled_window_end: "09:00", sequence: 1, estimated_volume_gallons: 100, expected_route_version: "${r1_v}" }, as: RoutePlanner, captures: { s1: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${r1_id}/manifest", payload: { manifest_tracking_number: "OVF-M1", disposal_facility_id: "${fac_id}" }, as: RoutePlanner, captures: { man1: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${r1_id}/dispatch", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/route-stops/${s1}/arrive", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${s1}/begin-screening", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${s1}/sample-screenings", payload: { halogen_ppm: 10, water_pct: 1.0, ph_level: 7.0 }, as: LabTech }
            - { call: "POST /recycle-routes/route-stops/${s1}/pickup-tickets", payload: { client_request_id: "OVF-1", metered_volume_gallons: 100 }, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/manifests/${man1}/submit", payload: {}, as: RoutePlanner }
            # Manifest 2 for 2026-08-06 (next day) with 100 gal — different day window, should succeed
            - { call: "POST /recycle-routes/routes", payload: { route_code: "OVF-2", scheduled_date: "2026-08-06", driver_id: "${drv_id}", vehicle_capacity_gallons: 500, density_zone: "URBAN" }, as: RoutePlanner, captures: { r2_id: "$.data.id", r2_v: "$.data.version" } }
            - { call: "POST /recycle-routes/routes/${r2_id}/route-stops", payload: { tank_site_id: "${site_id}", tank_id: "${tank_id}", scheduled_window_start: "08:00", scheduled_window_end: "09:00", sequence: 1, estimated_volume_gallons: 100, expected_route_version: "${r2_v}" }, as: RoutePlanner, captures: { s2: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${r2_id}/manifest", payload: { manifest_tracking_number: "OVF-M2", disposal_facility_id: "${fac_id}" }, as: RoutePlanner, captures: { man2: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${r2_id}/dispatch", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/route-stops/${s2}/arrive", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${s2}/begin-screening", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${s2}/sample-screenings", payload: { halogen_ppm: 10, water_pct: 1.0, ph_level: 7.0 }, as: LabTech }
            - { call: "POST /recycle-routes/route-stops/${s2}/pickup-tickets", payload: { client_request_id: "OVF-2", metered_volume_gallons: 100 }, as: Driver, as_user_id: "${drv_id}" }
          trigger:
            - { call: "POST /recycle-routes/manifests/${man2}/submit", payload: {}, as: RoutePlanner, captures: { man2_status: "$.data.status" } }
          assert:
            - "Manifest.${man1} submitted with 100 gal on 2026-08-05 — consumes that day's capacity"
            - "Manifest.${man2} submitted with 100 gal on 2026-08-06 — succeeds because different calendar-day window"
            - "Manifest.${man2}.status == SUBMITTED"
            - "Calendar-day window semantics: capacity resets each day; different from route capacity aggregate semantics"

  # ==========================================================================
  # RULE 9 — compensating_invariant (different conserved quantities)
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: tank_volume_conservation_across_pickup
        grounds:
          - entities.Tank.fields.current_volume_gallons
          - entities.Route.fields.loaded_gallons
          - entities.Manifest.fields.total_gallons_manifested
        distinguishing_aspect: |
          Conserved quantity = total gallons. Forward action (pickup) moves
          gallons from Tank to Route; the compensating action (if any) must
          leave Tank.current_volume + Route.loaded_gallons + (manifest
          adjustments) unchanged. Invariant: tank.current_volume_gallons
          (post) + Route.loaded_gallons (post) == tank.current_volume_gallons
          (pre) + Route.loaded_gallons (pre). (Manifest mirrors Route side.)
        test_recipe:
          setup:
            - "Tank at 200 gal"
            - "Route at loaded=0, vehicle_capacity=500"
            - "Manifest exists for route (initially 0)"
          setup_api_calls:
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "Inv1", epa_generator_id: "EPAGEN000090", market_zone: "NORTH", credit_terms: "NET30" }, as: RoutePlanner, captures: { cust_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tank-sites", payload: { customer_id: "${cust_id}", site_address: "1 Inv Rd", density_zone: "URBAN", route_eligibility_override: true }, as: RoutePlanner, captures: { site_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks", payload: { tank_site_id: "${site_id}", tank_kind: "USED_OIL", capacity_gallons: 500, ownership: "CUSTOMER_OWNED" }, as: TankInstaller, captures: { tank_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks/${tank_id}/register-existing", payload: {}, as: TankInstaller }
            - { call: "POST /recycle-routes/tanks/${tank_id}/record-intake", payload: { gallons: 200 }, as: RoutePlanner, captures: { tank_v_pre: "$.data.current_volume_gallons" } }
            - { call: "POST /recycle-routes/customers/${cust_id}/activate", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/drivers", payload: { driver_name: "Inv", cdl_class: "A", hazmat_endorsement: true }, as: RoutePlanner, captures: { drv_id: "$.data.id" } }
            - { call: "POST /recycle-routes/market-prices", payload: { market_zone: "NORTH", tank_kind: "USED_OIL", effective_date: "2026-08-01", price_cents_per_gal: 50 }, as: Regulator }
            - { call: "POST /recycle-routes/disposal-facilities", payload: { facility_name: "Inv TSDF", epa_id: "EPAID030", accepted_streams: ["USED_OIL"], daily_capacity_gallons: 10000 }, as: Regulator, captures: { fac_id: "$.data.id" } }
            - { call: "POST /recycle-routes/routes", payload: { route_code: "INV", scheduled_date: "2026-08-05", driver_id: "${drv_id}", vehicle_capacity_gallons: 500, density_zone: "URBAN" }, as: RoutePlanner, captures: { r_id: "$.data.id", r_v: "$.data.version", route_loaded_pre: "$.data.loaded_gallons" } }
            - { call: "POST /recycle-routes/routes/${r_id}/route-stops", payload: { tank_site_id: "${site_id}", tank_id: "${tank_id}", scheduled_window_start: "08:00", scheduled_window_end: "09:00", sequence: 1, estimated_volume_gallons: 100, expected_route_version: "${r_v}" }, as: RoutePlanner, captures: { s_id: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${r_id}/manifest", payload: { manifest_tracking_number: "INV-M", disposal_facility_id: "${fac_id}" }, as: RoutePlanner, captures: { man_id: "$.data.id", man_total_pre: "$.data.total_gallons_manifested" } }
            - { call: "POST /recycle-routes/routes/${r_id}/dispatch", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/route-stops/${s_id}/arrive", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${s_id}/begin-screening", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${s_id}/sample-screenings", payload: { halogen_ppm: 10, water_pct: 1.0, ph_level: 7.0 }, as: LabTech }
          trigger:
            - { call: "POST /recycle-routes/route-stops/${s_id}/pickup-tickets", payload: { client_request_id: "INV-PT", metered_volume_gallons: 80 }, as: Driver, as_user_id: "${drv_id}" }
            - { call: "GET /recycle-routes/tanks/${tank_id}", payload: {}, as: EHSOfficer, captures: { tank_v_post: "$.data.current_volume_gallons" } }
            - { call: "GET /recycle-routes/routes/${r_id}", payload: {}, as: RoutePlanner, captures: { route_loaded_post: "$.data.loaded_gallons" } }
            - { call: "GET /recycle-routes/manifests/${man_id}", payload: {}, as: RoutePlanner, captures: { man_total_post: "$.data.total_gallons_manifested" } }
          assert:
            - "Pre: Tank.current_volume_gallons == 200, Route.loaded_gallons == 0, Manifest.total_gallons_manifested == 0; sum = 200"
            - "Post: Tank.current_volume_gallons == 120 (200 - 80)"
            - "Post: Route.loaded_gallons == 80 (0 + 80)"
            - "Post: Manifest.total_gallons_manifested == 80 (mirrors route side)"
            - "Invariant: Tank.current + Route.loaded == 200 (unchanged — 120 + 80 = 200)"
            - "Gallons are conserved; no drift"

      - name: customer_balance_conservation_across_adjust
        grounds:
          - calculations.settlement_amount
          - entities.Customer.fields.prepaid_balance_cents
        distinguishing_aspect: |
          Conserved quantity = customer cents. Forward action (settle) posts
          net_amount_cents to Customer.prepaid_balance_cents; the compensating
          action (dispute + adjust to corrected volume) must leave the sum of
          settled-and-adjusted amounts equal to the final net; no orphan
          cents. Different conserved quantity (cents, not gallons) than
          rule-9 instance 1.
        test_recipe:
          setup:
            - "Customer PREPAY with prepaid_balance_cents = 0"
            - "PickupTicket settled with metered=100, price=+50 → net +5000"
            - "Then disputed and adjusted to metered=80 → new net +4000"
          setup_api_calls:
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "Inv2", epa_generator_id: "EPAGEN000091", market_zone: "NORTH", credit_terms: "PREPAY" }, as: RoutePlanner, captures: { cust_id: "$.data.id", cust_v0: "$.data.version" } }
            - { call: "POST /recycle-routes/tank-sites", payload: { customer_id: "${cust_id}", site_address: "2 Inv Rd", density_zone: "URBAN", route_eligibility_override: true }, as: RoutePlanner, captures: { site_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks", payload: { tank_site_id: "${site_id}", tank_kind: "USED_OIL", capacity_gallons: 500, ownership: "CUSTOMER_OWNED" }, as: TankInstaller, captures: { tank_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks/${tank_id}/register-existing", payload: {}, as: TankInstaller }
            - { call: "POST /recycle-routes/tanks/${tank_id}/record-intake", payload: { gallons: 200 }, as: RoutePlanner }
            - { call: "POST /recycle-routes/customers/${cust_id}/activate", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/drivers", payload: { driver_name: "Inv2", cdl_class: "B", hazmat_endorsement: true }, as: RoutePlanner, captures: { drv_id: "$.data.id" } }
            - { call: "POST /recycle-routes/market-prices", payload: { market_zone: "NORTH", tank_kind: "USED_OIL", effective_date: "2026-08-01", price_cents_per_gal: 50 }, as: Regulator }
            - { call: "POST /recycle-routes/routes", payload: { route_code: "INV2", scheduled_date: "2026-08-05", driver_id: "${drv_id}", vehicle_capacity_gallons: 500, density_zone: "URBAN" }, as: RoutePlanner, captures: { r_id: "$.data.id", r_v: "$.data.version" } }
            - { call: "POST /recycle-routes/routes/${r_id}/route-stops", payload: { tank_site_id: "${site_id}", tank_id: "${tank_id}", scheduled_window_start: "08:00", scheduled_window_end: "09:00", sequence: 1, estimated_volume_gallons: 100, expected_route_version: "${r_v}" }, as: RoutePlanner, captures: { s_id: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${r_id}/dispatch", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/route-stops/${s_id}/arrive", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${s_id}/begin-screening", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${s_id}/sample-screenings", payload: { halogen_ppm: 10, water_pct: 1.0, ph_level: 7.0 }, as: LabTech }
            - { call: "POST /recycle-routes/route-stops/${s_id}/pickup-tickets", payload: { client_request_id: "INV2-PT", metered_volume_gallons: 100 }, as: Driver, as_user_id: "${drv_id}", captures: { pt_id: "$.data.id", pt_net_v1: "$.data.net_amount_cents" } }
            # Settle the provisional ticket — posts +5000 to prepaid
            - { call: "GET /recycle-routes/customers/${cust_id}", payload: {}, as: SettlementClerk, captures: { cust_v_pre_settle: "$.data.version" } }
            - { call: "POST /recycle-routes/pickup-tickets/${pt_id}/settle", payload: { expected_customer_version: "${cust_v_pre_settle}" }, as: SettlementClerk }
            - { call: "GET /recycle-routes/customers/${cust_id}", payload: {}, as: SettlementClerk, captures: { bal_after_settle: "$.data.prepaid_balance_cents" } }
          trigger:
            - { call: "POST /recycle-routes/pickup-tickets/${pt_id}/dispute", payload: {}, as: SettlementClerk }
            - { call: "POST /recycle-routes/pickup-tickets/${pt_id}/adjust", payload: { corrected_metered_volume_gallons: 80 }, as: SettlementClerk }
            - { call: "GET /recycle-routes/customers/${cust_id}", payload: {}, as: SettlementClerk, captures: { bal_after_adjust: "$.data.prepaid_balance_cents" } }
            - { call: "GET /recycle-routes/pickup-tickets/${pt_id}", payload: {}, as: SettlementClerk, captures: { pt_final_net: "$.data.net_amount_cents" } }
          assert:
            - "After settle: Customer.prepaid_balance_cents == 5000 (forward action posted)"
            - "After dispute+adjust (corrected to 80 gal): Customer.prepaid_balance_cents == 4000"
            - "PickupTicket.net_amount_cents == 4000 (final)"
            - "Invariant: Customer balance == PickupTicket.net_amount_cents (4000 == 4000); delta of -1000 was correctly posted as compensation, no cents orphaned"
