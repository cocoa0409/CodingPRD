scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: sla_credit_provisional_vs_final
        grounds:
          - calculations.sla_credit_amount
          - entities.OutageEvent.fields.estimated_credit_total_cents
          - entities.SlaCredit.fields.credit_cents
          - state_machines.OutageEvent.OPEN_to_RESOLVED
        distinguishing_aspect: "Provisional SLA credit uses downtime = clock_now - started_at (720 min -> 100c); final uses ended_at - started_at (360 min -> 50c) on the SlaCredit/Subscription billing domain."
        test_recipe:
          setup:
            - "Clock at 2026-06-01T12:00Z; SERVICEABLE area; STANDARD plan (monthly_price_cents=6000); one ACTIVE subscription; an OPEN outage started at 2026-06-01T00:00Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T12:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /grants", payload: { funding_source: "BEAD", program_name: "Metro BEAD", award_amount_cents: 100000000, match_required_pct: 25, take_rate_milestone_pct: 40 }, as: ProgramAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /service-areas", payload: { grant_id: "${g_id}", name: "Area 1", census_block_group: "010010001001", homes_passed: 100, fiber_ready: true }, as: ProgramAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-plans", payload: { tier: "STANDARD", name: "Standard 100", download_mbps: 100, upload_mbps: 20, monthly_price_cents: 6000, sla_uptime_pct: 99.5 }, as: ProgramAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /subscribers", payload: { service_area_id: "${a_id}", full_name: "Jane Doe", email: "jane@x.com", service_address: "1 Main St", household_size: 2 }, as: CustomerCare, captures: { s_id: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${s_id}", plan_id: "${p_id}", service_area_id: "${a_id}" }, as: CustomerCare, captures: { sub_id: "$.data.id" } }
            - { call: "POST /technicians", payload: { name: "Tec North", region: "North", job_duration_minutes: 120 }, as: ProgramAdmin, captures: { t_id: "$.data.id" } }
            - { call: "POST /install-orders", payload: { subscription_id: "${sub_id}", technician_id: "${t_id}", scheduled_start_at: "2026-06-01T09:00:00Z" }, as: Dispatcher, captures: { io_id: "$.data.id" } }
            - { call: "POST /install-orders/${io_id}/complete", payload: {}, as: FieldTech, as_user_id: "${t_id}" }
            - { call: "POST /subscriptions/${sub_id}/activate", payload: {}, as: CustomerCare }
            - { call: "POST /outages", payload: { service_area_id: "${a_id}", started_at: "2026-06-01T00:00:00Z", severity: "FULL" }, as: NocOperator, captures: { o_id: "$.data.id", est: "$.data.estimated_credit_total_cents" } }
          trigger:
            - { call: "POST /outages/${o_id}/resolve", payload: { ended_at: "2026-06-01T06:00:00Z" }, as: NocOperator, captures: { fin: "$.data.final_credit_total_cents" } }
          assert:
            - "OutageEvent.${o_id}.estimated_credit_total_cents == 100"
            - "OutageEvent.${o_id}.final_credit_total_cents == 50"
            - "The SlaCredit created for subscription ${sub_id} has credit_cents == 50 and status == APPLIED"
            - "provisional 100 != final 50"

      - name: take_rate_reported_vs_verified
        grounds:
          - calculations.service_area_take_rate
          - entities.ServiceArea.fields.reported_take_rate_pct
          - entities.ServiceArea.fields.verified_take_rate_pct
        distinguishing_aspect: "On the ServiceArea domain, reported take-rate counts {PENDING_INSTALL, ACTIVE} (2/4=50.0) while verified counts ACTIVE only (1/4=25.0)."
        test_recipe:
          setup:
            - "SERVICEABLE area with homes_passed=4; subscription A ACTIVE; subscription B still PENDING_INSTALL."
          setup_api_calls:
            - { call: "POST /grants", payload: { funding_source: "BEAD", program_name: "Metro BEAD", award_amount_cents: 100000000, match_required_pct: 25, take_rate_milestone_pct: 40 }, as: ProgramAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /service-areas", payload: { grant_id: "${g_id}", name: "Area 4", census_block_group: "010010001004", homes_passed: 4, fiber_ready: true }, as: ProgramAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-plans", payload: { tier: "STANDARD", name: "Standard 100", download_mbps: 100, upload_mbps: 20, monthly_price_cents: 6000, sla_uptime_pct: 99.5 }, as: ProgramAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /subscribers", payload: { service_area_id: "${a_id}", full_name: "Sub A", email: "a@x.com", service_address: "1 Main St", household_size: 2 }, as: CustomerCare, captures: { s1_id: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${s1_id}", plan_id: "${p_id}", service_area_id: "${a_id}" }, as: CustomerCare, captures: { sub1_id: "$.data.id" } }
            - { call: "POST /subscribers", payload: { service_area_id: "${a_id}", full_name: "Sub B", email: "b@x.com", service_address: "2 Main St", household_size: 3 }, as: CustomerCare, captures: { s2_id: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${s2_id}", plan_id: "${p_id}", service_area_id: "${a_id}" }, as: CustomerCare, captures: { sub2_id: "$.data.id" } }
            - { call: "POST /technicians", payload: { name: "Tec", region: "North" }, as: ProgramAdmin, captures: { t_id: "$.data.id" } }
            - { call: "POST /install-orders", payload: { subscription_id: "${sub1_id}", technician_id: "${t_id}", scheduled_start_at: "2026-06-01T09:00:00Z" }, as: Dispatcher, captures: { io_id: "$.data.id" } }
            - { call: "POST /install-orders/${io_id}/complete", payload: {}, as: FieldTech, as_user_id: "${t_id}" }
          trigger:
            - { call: "POST /subscriptions/${sub1_id}/activate", payload: {}, as: CustomerCare }
          assert:
            - "ServiceArea.${a_id}.reported_take_rate_pct == 50.0"
            - "ServiceArea.${a_id}.verified_take_rate_pct == 25.0"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: invoice_amount_nested_min_conditional_mode_a
        grounds:
          - calculations.invoice_amount
          - entities.Invoice.fields.total_due_cents
          - entities.Invoice.fields.subsidy_discount_cents
        distinguishing_aspect: "Mode (a): >=3 inputs with a conditional branch on ACTIVE-enrollment presence and nested min() for both subsidy and SLA-credit caps; base 6000 - min(3000,6000) - 0 = 3000."
        test_recipe:
          setup:
            - "ACTIVE subscription (plan 6000) whose subscriber has an ACTIVE enrollment on a subsidy with monthly_discount_cents=3000."
          setup_api_calls:
            - { call: "POST /grants", payload: { funding_source: "BEAD", program_name: "Metro BEAD", award_amount_cents: 100000000, match_required_pct: 25, take_rate_milestone_pct: 40 }, as: ProgramAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /service-areas", payload: { grant_id: "${g_id}", name: "Area 1", census_block_group: "010010001001", homes_passed: 100, fiber_ready: true }, as: ProgramAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-plans", payload: { tier: "STANDARD", name: "Standard 100", download_mbps: 100, upload_mbps: 20, monthly_price_cents: 6000, sla_uptime_pct: 99.5 }, as: ProgramAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /subsidy-programs", payload: { name: "Digital Equity Credit", monthly_discount_cents: 3000, device_benefit_cents: 12000, eligibility_fpl_pct: 200 }, as: ProgramAdmin, captures: { sp_id: "$.data.id" } }
            - { call: "POST /subscribers", payload: { service_area_id: "${a_id}", full_name: "Jane Doe", email: "jane@x.com", service_address: "1 Main St", household_size: 2 }, as: CustomerCare, captures: { s_id: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${s_id}", plan_id: "${p_id}", service_area_id: "${a_id}" }, as: CustomerCare, captures: { sub_id: "$.data.id" } }
            - { call: "POST /technicians", payload: { name: "Tec", region: "North" }, as: ProgramAdmin, captures: { t_id: "$.data.id" } }
            - { call: "POST /install-orders", payload: { subscription_id: "${sub_id}", technician_id: "${t_id}", scheduled_start_at: "2026-06-01T09:00:00Z" }, as: Dispatcher, captures: { io_id: "$.data.id" } }
            - { call: "POST /install-orders/${io_id}/complete", payload: {}, as: FieldTech, as_user_id: "${t_id}" }
            - { call: "POST /subscriptions/${sub_id}/activate", payload: {}, as: CustomerCare }
            - { call: "POST /enrollments", payload: { subscriber_id: "${s_id}", subsidy_program_id: "${sp_id}", household_size: 2, annual_income_cents: 3000000 }, as: EligibilityWorker, captures: { e_id: "$.data.id" } }
            - { call: "POST /enrollments/${e_id}/verify", payload: {}, as: EligibilityWorker }
          trigger:
            - { call: "POST /subscriptions/${sub_id}/invoices", payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: Billing, captures: { inv_id: "$.data.id" } }
          assert:
            - "Invoice.${inv_id}.base_amount_cents == 6000"
            - "Invoice.${inv_id}.subsidy_discount_cents == 3000"
            - "Invoice.${inv_id}.sla_credit_cents == 0"
            - "Invoice.${inv_id}.total_due_cents == 3000"

      - name: grant_claim_reimbursement_round_then_sum_mode_b
        grounds:
          - calculations.grant_claim_reimbursement
          - entities.GrantClaim.fields.amount_claimed_cents
          - entities.GrantClaim.fields.subsidized_subscriber_count
        distinguishing_aspect: "Mode (b): rounding order pinned round-each-then-sum; 3 subsidized subs at round(3000*0.3334)=1000 each -> 3000, whereas sum-then-round would give round(3000.6)=3001."
        test_recipe:
          setup:
            - "SERVICEABLE area; 3 ACTIVE subscriptions each with an ACTIVE enrollment on a subsidy with monthly_discount_cents=3000; grant with ample funds."
          setup_api_calls:
            - { call: "POST /grants", payload: { funding_source: "BEAD", program_name: "Metro BEAD", award_amount_cents: 100000000, match_required_pct: 25, take_rate_milestone_pct: 40 }, as: ProgramAdmin, captures: { g_id: "$.data.id", g_v: "$.data.version" } }
            - { call: "POST /service-areas", payload: { grant_id: "${g_id}", name: "Area 1", census_block_group: "010010001001", homes_passed: 100, fiber_ready: true }, as: ProgramAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-plans", payload: { tier: "STANDARD", name: "Standard 100", download_mbps: 100, upload_mbps: 20, monthly_price_cents: 6000, sla_uptime_pct: 99.5 }, as: ProgramAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /subsidy-programs", payload: { name: "Digital Equity Credit", monthly_discount_cents: 3000, device_benefit_cents: 12000, eligibility_fpl_pct: 200 }, as: ProgramAdmin, captures: { sp_id: "$.data.id" } }
            - { call: "POST /technicians", payload: { name: "Tec", region: "North" }, as: ProgramAdmin, captures: { t_id: "$.data.id" } }
            - { call: "POST /subscribers", payload: { service_area_id: "${a_id}", full_name: "S1", email: "s1@x.com", service_address: "1 A St", household_size: 2 }, as: CustomerCare, captures: { s1: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${s1}", plan_id: "${p_id}", service_area_id: "${a_id}" }, as: CustomerCare, captures: { sub1: "$.data.id" } }
            - { call: "POST /install-orders", payload: { subscription_id: "${sub1}", technician_id: "${t_id}", scheduled_start_at: "2026-06-01T09:00:00Z" }, as: Dispatcher, captures: { io1: "$.data.id" } }
            - { call: "POST /install-orders/${io1}/complete", payload: {}, as: FieldTech, as_user_id: "${t_id}" }
            - { call: "POST /subscriptions/${sub1}/activate", payload: {}, as: CustomerCare }
            - { call: "POST /enrollments", payload: { subscriber_id: "${s1}", subsidy_program_id: "${sp_id}", household_size: 2, annual_income_cents: 3000000 }, as: EligibilityWorker, captures: { e1: "$.data.id" } }
            - { call: "POST /enrollments/${e1}/verify", payload: {}, as: EligibilityWorker }
            - { call: "POST /subscribers", payload: { service_area_id: "${a_id}", full_name: "S2", email: "s2@x.com", service_address: "2 A St", household_size: 2 }, as: CustomerCare, captures: { s2: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${s2}", plan_id: "${p_id}", service_area_id: "${a_id}" }, as: CustomerCare, captures: { sub2: "$.data.id" } }
            - { call: "POST /install-orders", payload: { subscription_id: "${sub2}", technician_id: "${t_id}", scheduled_start_at: "2026-06-01T12:00:00Z" }, as: Dispatcher, captures: { io2: "$.data.id" } }
            - { call: "POST /install-orders/${io2}/complete", payload: {}, as: FieldTech, as_user_id: "${t_id}" }
            - { call: "POST /subscriptions/${sub2}/activate", payload: {}, as: CustomerCare }
            - { call: "POST /enrollments", payload: { subscriber_id: "${s2}", subsidy_program_id: "${sp_id}", household_size: 2, annual_income_cents: 3000000 }, as: EligibilityWorker, captures: { e2: "$.data.id" } }
            - { call: "POST /enrollments/${e2}/verify", payload: {}, as: EligibilityWorker }
            - { call: "POST /subscribers", payload: { service_area_id: "${a_id}", full_name: "S3", email: "s3@x.com", service_address: "3 A St", household_size: 2 }, as: CustomerCare, captures: { s3: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${s3}", plan_id: "${p_id}", service_area_id: "${a_id}" }, as: CustomerCare, captures: { sub3: "$.data.id" } }
            - { call: "POST /install-orders", payload: { subscription_id: "${sub3}", technician_id: "${t_id}", scheduled_start_at: "2026-06-01T15:00:00Z" }, as: Dispatcher, captures: { io3: "$.data.id" } }
            - { call: "POST /install-orders/${io3}/complete", payload: {}, as: FieldTech, as_user_id: "${t_id}" }
            - { call: "POST /subscriptions/${sub3}/activate", payload: {}, as: CustomerCare }
            - { call: "POST /enrollments", payload: { subscriber_id: "${s3}", subsidy_program_id: "${sp_id}", household_size: 2, annual_income_cents: 3000000 }, as: EligibilityWorker, captures: { e3: "$.data.id" } }
            - { call: "POST /enrollments/${e3}/verify", payload: {}, as: EligibilityWorker }
          trigger:
            - { call: "POST /grants/${g_id}/claims", payload: { claim_period_start: "2026-06-01T00:00:00Z", claim_period_end: "2026-07-01T00:00:00Z", service_area_ids: ["${a_id}"], expected_grant_version: "${g_v}" }, as: ComplianceAnalyst, captures: { c_id: "$.data.id" } }
          assert:
            - "GrantClaim.${c_id}.subsidized_subscriber_count == 3"
            - "GrantClaim.${c_id}.amount_claimed_cents == 3000"
            - "sum-then-round would yield 3001; the pinned round-then-sum yields 3000"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: enrollment_recertification_cycle
        grounds:
          - state_machines.Enrollment.ACTIVE_to_RECERT_DUE
          - state_machines.Enrollment.RECERT_DUE_to_ACTIVE
          - entities.Enrollment.fields.certification_expires_at
        distinguishing_aspect: "Cyclic machine on Enrollment: ACTIVE -> RECERT_DUE (clock past certification_expires_at) -> ACTIVE again via recertify, returning to a prior state."
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00Z; an ACTIVE enrollment (cert expires 2027-06-01Z); clock then advanced past expiry so it is RECERT_DUE."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /grants", payload: { funding_source: "BEAD", program_name: "Metro BEAD", award_amount_cents: 100000000, match_required_pct: 25, take_rate_milestone_pct: 40 }, as: ProgramAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /service-areas", payload: { grant_id: "${g_id}", name: "Area 1", census_block_group: "010010001001", homes_passed: 100 }, as: ProgramAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /subsidy-programs", payload: { name: "Digital Equity Credit", monthly_discount_cents: 3000, device_benefit_cents: 12000, eligibility_fpl_pct: 200 }, as: ProgramAdmin, captures: { sp_id: "$.data.id" } }
            - { call: "POST /subscribers", payload: { service_area_id: "${a_id}", full_name: "Jane Doe", email: "jane@x.com", service_address: "1 Main St", household_size: 2 }, as: CustomerCare, captures: { s_id: "$.data.id" } }
            - { call: "POST /enrollments", payload: { subscriber_id: "${s_id}", subsidy_program_id: "${sp_id}", household_size: 2, annual_income_cents: 3000000 }, as: EligibilityWorker, captures: { e_id: "$.data.id" } }
            - { call: "POST /enrollments/${e_id}/verify", payload: {}, as: EligibilityWorker }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-07-01T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /enrollments/${e_id}/recertify", payload: { annual_income_cents: 3000000 }, as: EligibilityWorker }
          assert:
            - "Enrollment.${e_id}.status == ACTIVE"
            - "Enrollment.${e_id}.fpl_pct == 147.49"
            - "certification_expires_at advanced to a new instant one CERT_PERIOD_DAYS after the recertify clock"

      - name: subscription_parallel_service_and_billing_axes
        grounds:
          - state_machines.Subscription.ACTIVE_to_SUSPENDED
          - entities.Subscription.fields.service_status
          - entities.Subscription.fields.billing_status
        distinguishing_aspect: "Parallel dimensions on Subscription: suspending moves service_status ACTIVE->SUSPENDED while billing_status remains CURRENT — the two axes evolve independently."
        test_recipe:
          setup:
            - "One ACTIVE subscription (service_status=ACTIVE, billing_status=CURRENT)."
          setup_api_calls:
            - { call: "POST /grants", payload: { funding_source: "BEAD", program_name: "Metro BEAD", award_amount_cents: 100000000, match_required_pct: 25, take_rate_milestone_pct: 40 }, as: ProgramAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /service-areas", payload: { grant_id: "${g_id}", name: "Area 1", census_block_group: "010010001001", homes_passed: 100, fiber_ready: true }, as: ProgramAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-plans", payload: { tier: "STANDARD", name: "Standard 100", download_mbps: 100, upload_mbps: 20, monthly_price_cents: 6000, sla_uptime_pct: 99.5 }, as: ProgramAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /subscribers", payload: { service_area_id: "${a_id}", full_name: "Jane Doe", email: "jane@x.com", service_address: "1 Main St", household_size: 2 }, as: CustomerCare, captures: { s_id: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${s_id}", plan_id: "${p_id}", service_area_id: "${a_id}" }, as: CustomerCare, captures: { sub_id: "$.data.id" } }
            - { call: "POST /technicians", payload: { name: "Tec", region: "North" }, as: ProgramAdmin, captures: { t_id: "$.data.id" } }
            - { call: "POST /install-orders", payload: { subscription_id: "${sub_id}", technician_id: "${t_id}", scheduled_start_at: "2026-06-01T09:00:00Z" }, as: Dispatcher, captures: { io_id: "$.data.id" } }
            - { call: "POST /install-orders/${io_id}/complete", payload: {}, as: FieldTech, as_user_id: "${t_id}" }
            - { call: "POST /subscriptions/${sub_id}/activate", payload: {}, as: CustomerCare }
          trigger:
            - { call: "POST /subscriptions/${sub_id}/suspend", payload: {}, as: CustomerCare }
          assert:
            - "Subscription.${sub_id}.service_status == SUSPENDED"
            - "Subscription.${sub_id}.billing_status == CURRENT"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: outage_resolve_credit_invoice_paid_depth3
        grounds:
          - state_machines.OutageEvent.OPEN_to_RESOLVED
          - state_machines.Invoice.ISSUED_to_PAID
          - entities.Invoice.fields.sla_credit_cents
          - entities.Subscription.fields.billing_status
        distinguishing_aspect: "Depth-3 cascade from outage resolve: OutageEvent -> new SlaCredit(6000c) -> Invoice.sla_credit_cents/total_due recompute to 0 -> Invoice PAID -> Subscription billing_status CURRENT."
        test_recipe:
          setup:
            - "Clock 2026-07-01T00:00Z; ACTIVE subscription (plan 6000) with one ISSUED unpaid invoice for 2026-06; an OPEN outage covering 2026-06-01..2026-07-01 (43200 downtime minutes)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /grants", payload: { funding_source: "BEAD", program_name: "Metro BEAD", award_amount_cents: 100000000, match_required_pct: 25, take_rate_milestone_pct: 40 }, as: ProgramAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /service-areas", payload: { grant_id: "${g_id}", name: "Area 1", census_block_group: "010010001001", homes_passed: 100, fiber_ready: true }, as: ProgramAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-areas/${a_id}/advance", payload: {}, as: ProgramAdmin }
            - { call: "POST /service-plans", payload: { tier: "STANDARD", name: "Standard 100", download_mbps: 100, upload_mbps: 20, monthly_price_cents: 6000, sla_uptime_pct: 99.5 }, as: ProgramAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /subscribers", payload: { service_area_id: "${a_id}", full_name: "Jane Doe", email: "jane@x.com", service_address: "1 Main St", household_size: 2 }, as: CustomerCare, captures: { s_id: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { subscriber_id: "${s_id}", plan_id: "${p_id}", service_area_id: "${a_id}" }, as: CustomerCare, captures: { sub_id: "$.data.id" } }
