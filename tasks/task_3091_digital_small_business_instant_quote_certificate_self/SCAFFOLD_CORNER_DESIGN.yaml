        grounds: [roles]
        distinguishing_aspect: "FinanceOfficer may pay but never triage: POST /ins/claims/{id}/triage with a FinanceOfficer role is denied ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["SUBMITTED claim exists."]
          setup_api_calls:
            - call: "POST /ins/class-codes"
              payload: { code: "CC_C", description: "Solo trades", eligible_lines: ["GL"], base_rates_cents: { GL: 10000 }, risk_factor: 0.5, appetite_active: true }
              as: PlatformAdmin
            - call: "POST /ins/appetite-rules"
