# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2453 — Summer Food Service Program Sponsorship & Meal Sites
#
# 9 rule_id blocks x 2 instances = 18 instances. Every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7 only; every numeric assert below was computed by
# executing the referenced §1.3 formula with its declared constants.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: claim_reimbursement_preliminary_versus_final_variants
        grounds:
          - calculations.claim_reimbursement
          - calculations.claim_meals_rate_value
          - entities.MealClaim.fields.preliminary_reimbursement_cents
          - entities.MealClaim.fields.final_reimbursement_cents
          - state_machines.MealClaim.DRAFT_to_SUBMITTED
          - state_machines.MealClaim.SUBMITTED_to_VALIDATED
        distinguishing_aspect: |
          This instance lives in the MealClaim (money/ledger) entity domain: for one identical claim
          (meals_rate_value_cents 22114, claimed_admin_cost_cents 20000) the PRELIMINARY variant
          returns 42114 because it applies no caps, while the FINAL variant returns 26536 because it
          floors the administrative reimbursement at 20% of the operating reimbursement — a 15578-cent
          divergence produced by the same inputs.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-06-01T00:00:00Z."
            - "Sponsor APPROVED, EXPERIENCED, with an APPROVED budget (approved operating 4500000, approved admin 700000)."
            - "One OPEN-type, rural, SELF_PREP site APPROVED and OPERATING from 2026-06-08."
            - "One MealServiceDay 2026-06-08 FINALIZED with 47 LUNCH first meals counted and 150 LUNCH meals produced."
            - "A FIRST_WEEK monitoring visit conducted 2026-06-10 (due 2026-06-12) and closed with no findings, so monitoring_satisfied() holds."
            - "A DRAFT June claim carrying exactly one line item for that site, meals_rate_value_cents 22114."
          setup_api_calls:
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/sponsors"
              payload: { legal_name: "Riverbend Community Alliance", sponsor_type: "NONPROFIT", experience_status: "EXPERIENCED", program_year: 2026, advance_eligible: true }
              as: StateAgencyReviewer
              captures: { sp_id: $.data.id }
            - call: "POST /sfsp/sponsors/${sp_id}/application-submit"
              payload: {}
              as: SponsorAdmin
              as_user_id: "${sp_id}"
            - call: "POST /sfsp/sponsors/${sp_id}/application-decision"
              payload: { decision: "APPROVED" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/sponsor-budgets"
              payload: { sponsor_id: "${sp_id}", program_year: 2026, operating_cost_budget_cents: 5000000, admin_cost_budget_cents: 800000, projected_total_meals: 20000 }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { bg_id: $.data.id }
            - call: "POST /sfsp/sponsor-budgets/${bg_id}/submit"
              payload: {}
              as: SponsorAdmin
              as_user_id: "${sp_id}"
            - call: "POST /sfsp/sponsor-budgets/${bg_id}/decision"
              payload: { decision: "APPROVED", approved_operating_cost_cents: 4500000, approved_admin_cost_cents: 700000 }
              as: StateAgencyReviewer
            - call: "POST /sfsp/area-eligibility-records"
              payload: { area_code: "CT-0031", data_source: "SCHOOL_DATA", free_reduced_pct: 62.50, determination_date: "2026-03-15", valid_through_date: "2031-06-30" }
              as: StateAgencyReviewer
              captures: { aer_id: $.data.id }
            - call: "POST /sfsp/sites"
              payload: { sponsor_id: "${sp_id}", name: "Riverbend Park", site_type: "OPEN", production_mode: "SELF_PREP", approved_meal_types: ["BREAKFAST", "LUNCH"], approved_max_attendance: 200, operating_start_date: "2026-06-08", operating_end_date: "2026-08-14", area_eligibility_record_id: "${aer_id}", is_open_air: true, is_rural: true }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { site_id: $.data.id }
            - call: "POST /sfsp/sites/${site_id}/eligibility-determination"
              payload: {}
              as: StateAgencyReviewer
            - call: "POST /sfsp/sites/${site_id}/approval-decision"
              payload: { decision: "APPROVED" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T08:00:00Z" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/sites/${site_id}/operating-status"
              payload: { to_status: "OPERATING" }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
            - call: "POST /sfsp/meal-service-days"
              payload: { site_id: "${site_id}", service_date: "2026-06-08", meal_services: [{ meal_type: "LUNCH", planned_meals: 150, service_start: "11:30", service_end: "12:30" }] }
              as: SiteSupervisor
              as_user_id: "${site_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /sfsp/meal-service-days/${d1_id}/open"
              payload: { production_counts: { LUNCH: 150 }, food_received_at: "2026-06-08T10:30:00Z" }
              as: SiteSupervisor
              as_user_id: "${site_id}"
            - call: "POST /sfsp/meal-service-days/${d1_id}/meal-counts"
              payload: { meal_type: "LUNCH", first_meals: 47, second_meals: 0, adult_meals: 0 }
              as: SiteSupervisor
              as_user_id: "${site_id}"
            - call: "POST /sfsp/meal-service-days/${d1_id}/close"
              payload: {}
              as: SiteSupervisor
              as_user_id: "${site_id}"
            - call: "POST /sfsp/meal-service-days/${d1_id}/finalize"
              payload: {}
              as: SponsorAdmin
              as_user_id: "${sp_id}"
            - call: "POST /sfsp/monitoring-visits"
              payload: { site_id: "${site_id}", monitor_user_id: "mon_1", visit_type: "FIRST_WEEK", scheduled_date: "2026-06-10", window_start: "09:00", window_end: "11:00" }
              as: FieldMonitor
              as_user_id: "mon_1"
              captures: { v1_id: $.data.id }
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:00:00Z" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/monitoring-visits/${v1_id}/conduct"
              payload: {}
              as: FieldMonitor
              as_user_id: "mon_1"
            - call: "POST /sfsp/monitoring-visits/${v1_id}/report"
              payload: { findings: [] }
              as: FieldMonitor
              as_user_id: "mon_1"
            - call: "GET /sfsp/sponsors/${sp_id}"
              payload: {}
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { sp_ver: $.data.version }
            - call: "POST /sfsp/meal-claims"
              payload: { sponsor_id: "${sp_id}", claim_month: "2026-06", expected_sponsor_version: "${sp_ver}" }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { cl_id: $.data.id }
            - call: "POST /sfsp/meal-claims/${cl_id}/line-items"
              payload: { site_id: "${site_id}" }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { li1_id: $.data.id }
          trigger:
            - call: "POST /sfsp/meal-claims/${cl_id}/submit"
              payload: { claimed_operating_cost_cents: 30000, claimed_admin_cost_cents: 20000 }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
            - call: "POST /sfsp/meal-claims/${cl_id}/edit-check"
              payload: {}
              as: StateAgencyReviewer
          assert:
            - "ClaimLineItem.${li1_id}.meals_rate_value_cents == 22114"
            - "MealClaim.${cl_id}.meals_rate_value_cents == 22114"
            - "MealClaim.${cl_id}.preliminary_reimbursement_cents == 42114"
            - "MealClaim.${cl_id}.status == VALIDATED"
            - "MealClaim.${cl_id}.final_reimbursement_cents == 26536"
            - "MealClaim.${cl_id}.final_reimbursement_cents != MealClaim.${cl_id}.preliminary_reimbursement_cents"
            - "GET /sfsp/meal-claims/${cl_id}/reimbursement-summary returns operating_reimbursement_cents == 22114, admin_cap_cents == 4422, admin_reimbursement_cents == 4422"
            - "MealClaim.${cl_id}.advance_offset_cents == 0 and MealClaim.${cl_id}.net_payable_cents == 26536"
            - "MealClaim.${cl_id}.disallowed_meal_count == 0"

