      - name: patch_order_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[order-patch-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on SearchOrder.version: after an accepted PATCH advances the version to 2, a second PATCH still carrying the originally observed version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Order created by agent_1 (version 1)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProviderAdmin }
            - call: "POST /search-orders"
              payload: { property_address: "1 AF St", parcel_number: "P-AF1", closing_date: "2026-08-20", order_class: "STANDARD" }
              as: TitleAgent
              as_user_id: "agent_1"
              captures: { o_id: "$.data.id", o_v: "$.data.version" }
          trigger:
            - call: "PATCH /search-orders/${o_id}"
              payload: { expected_search_order_version: "${o_v}", closing_date: "2026-08-25" }
              as: TitleAgent
              as_user_id: "agent_1"
              captures: { o_v2: "$.data.version" }
            - call: "PATCH /search-orders/${o_id}"
              payload: { expected_search_order_version: "${o_v}", closing_date: "2026-08-26" }
              as: TitleAgent
              as_user_id: "agent_1"
              captures: { err: $.data.error_id }
          assert:
            - "First PATCH succeeds and advances version to ${o_v} + 1 (2)"
            - "Second PATCH with the stale observed version: error_id == ERR_STALE_VERSION, http 412; closing_date remains \"2026-08-25\""

