            - { call: "POST /giving/estates", payload: { donor_id: "${d_id}", notified_on: "2026-08-07T00:00:00Z" }, as: EstateManager, as_user_id: "em-1", captures: { e_id: $.data.id } }
            - { call: "POST /giving/estates/${e_id}/transition", payload: { action: "OPEN_PROBATE" }, as: EstateManager, as_user_id: "em-1" }
            - { call: "POST /giving/estates/${e_id}/transition", payload: { action: "CONTEST" }, as: EstateManager, as_user_id: "em-1", captures: { st1: $.data.status } }
          trigger:
            - { call: "POST /giving/estates/${e_id}/transition", payload: { action: "BEGIN_DISTRIBUTION", administration_costs_cents: 0, specific_bequests_cents: 0 }, as: EstateManager, as_user_id: "em-2", captures: { err: $.data.error_id } }
            - { call: "POST /giving/estates/${e_id}/transition", payload: { action: "RESOLVE_CONTEST" }, as: EstateManager, as_user_id: "em-1", captures: { st2: $.data.status } }
            - { call: "POST /giving/estates/${e_id}/transition", payload: { action: "BEGIN_DISTRIBUTION", administration_costs_cents: 0, specific_bequests_cents: 0 }, as: EstateManager, as_user_id: "em-2", captures: { st3: $.data.status } }
          assert:
            - "Estate reached CONTESTED (${st1} == CONTESTED)"
            - "BEGIN_DISTRIBUTION under CONTESTED rejected: ${err} == ERR_INVALID_STATE"
            - "RESOLVE_CONTEST returns PROBATE_OPEN (${st2})"
            - "BEGIN_DISTRIBUTION after the loop succeeds: ${st3} == DISTRIBUTION_PENDING, residual_to_university_cents == 0"

  - rule_id: transitive_cascade
    instances:
      - name: donor_death_maturity_cascade
        grounds:
          - state_machines.Donor.LIVING_to_DECEASED
