          setup:
            - "One ComplianceProgram with Jurisdiction IL, a PUBLISHED policy, a PUBLISHED (IL, EMPLOYEE) notice and one ACTIVE in-house BiometricAsset; the clock reads 2026-09-01T00:00:00Z."
            - "One IncidentCase over that asset with exposed_subject_count 12 and translation_locale_count 0, already advanced to containment_status CONTAINED and notification_status NOTIFIED (notified_subject_count 12)."
