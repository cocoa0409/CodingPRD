  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any role, existence, or business check runs."
        test_recipe:
          setup: ["nothing (empty database)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /spice/suppliers", payload: { name: "No Auth Co", origin_country: "US" }, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_UNAUTHENTICATED (HTTP 401) — sent with neither X-User-Role nor X-User-ID"
            - "response_type == error with meta block still present"

      - name: lot_missing_required_spice_code_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required field spice_code yields ERR_INVALID_REQUEST 400 (shape), which precedes existence and state checks."
        test_recipe:
          setup: ["supplier S exists"]
          setup_api_calls:
            - { call: "POST /spice/suppliers", payload: { name: "Malabar Exports", origin_country: "IN" }, as: SupplyPlanner, captures: { sup: $.data.id } }
          trigger:
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", origin_region: "Malabar", crop_year: 2025, quantity_kg: 10, flavor_intensity_units: 50.0, moisture_pct: 8.0, cost_per_kg_cents: 100, allergen_profile: NONE }, as: SupplyPlanner, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST (HTTP 400) — missing required input spice_code"

      - name: unknown_references_return_not_found
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "An unknown path id (GET lot) and unknown body FK (formula_id on run create) both produce ERR_NOT_FOUND 404; existence precedes OCC and all business rules."
        test_recipe:
          setup: ["line LN exists (version captured)"]
          setup_api_calls:
            - { call: "POST /spice/lines", payload: { name: "Line-NF", capacity_kg_per_shift: 1000, supported_changeover_classes: [NONE, DRY_CLEAN, WET_WASH, FULL_SANITATION] }, as: PlatformAdmin, captures: { ln: $.data.id, ln_v: $.data.version } }
          trigger:
            - { call: "GET /spice/lots/11111111-2222-4333-8444-555555555555", payload: {}, as: SupplyPlanner, captures: { err1: $.data.error_id } }
            - { call: "POST /spice/production-runs", payload: { line_id: "${ln}", formula_id: "11111111-2222-4333-8444-555555555555", blend_run_id: "11111111-2222-4333-8444-555555555555", quantity_kg: 10, window_start: "2026-09-07T08:00:00Z", window_end: "2026-09-07T10:00:00Z", expected_line_version: "${ln_v}" }, as: ProductionScheduler, captures: { err2: $.data.error_id } }
          assert:
