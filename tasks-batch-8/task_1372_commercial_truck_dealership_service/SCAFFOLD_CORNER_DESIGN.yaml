      - name: wholesale_loss_and_payoff_on_aged_unit
        claim_type: correct_result
        grounds: [calculations.aging_and_curtailment, state_machines.Unit.READY_to_WHOLESALED, entities.Unit.fields.wholesale_loss_cents]
        distinguishing_aspect: "Wholesale an OVER_365-aged unit: payoff drains the accrued balance to 0 and wholesale_loss_cents == invoice - price when price < invoice."
        test_recipe:
          setup: ["NEW unit received 2026-08-15 (invoice 10085000), READY; clock advanced to 2027-09-01 (days 382 -> OVER_365, curtailment 100%) and swept (interest accrues)"]
          setup_api_calls:
