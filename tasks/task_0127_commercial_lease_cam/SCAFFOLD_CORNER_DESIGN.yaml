        claim_type: violation_to_error
        grounds: ["errors[ERR_VALIDATION]", "calculations.percentage_rent"]
        distinguishing_aspect: "Running percentage rent for a (lease, 2025) with NO matching SalesReport returns ERR_VALIDATION (422) — the empty-candidate fallback for the latest-report selector."
