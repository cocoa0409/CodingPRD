      - name: reusing_a_campaign_number_returns_duplicate_campaign_number
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DUPLICATE_CAMPAIGN_NUMBER
          - validations.priority_36
          - entities.RecallCampaign.fields.campaign_number
        distinguishing_aspect: |
          Uniqueness is on campaign_number alone, so a second campaign that differs in defect_type and
          description is still refused; the first campaign stays untouched in DRAFT.
        test_recipe:
          setup:
            - "One DRAFT campaign already exists with campaign_number 26V-332."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-332", defect_type: "SAFETY_DEFECT", defect_description: "Inflator may rupture" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-332", defect_type: "NONCOMPLIANCE", defect_description: "Label does not meet the standard" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "response.data.error_id == \"ERR_DUPLICATE_CAMPAIGN_NUMBER\""
            - "GET /recall-campaigns with campaign_status == \"DRAFT\" returns total_count == 1"

      - name: reusing_a_vin_returns_duplicate_vin
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DUPLICATE_VIN
          - validations.priority_36
          - entities.Vehicle.fields.vin
        distinguishing_aspect: |
          The build record is keyed by VIN across the whole fleet, not per campaign, so a second POST
          with the same VIN but a different plant, production date and part number is still a duplicate.
        test_recipe:
          setup:
            - "One Vehicle already exists with vin 1HGCM82633A004352."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
            - call: "POST /vehicles"
              payload: { vin: "1HGCM82633A004352", plant_code: "PLT1", model_code: "MDLA", model_year: 2024, production_date: "2024-03-15", suspect_part_number: 1500, region_code: "NE", sale_status: "SOLD" }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
              captures: { veh1_id: $.data.id }
          trigger:
            - call: "POST /vehicles"
              payload: { vin: "1HGCM82633A004352", plant_code: "PLT2", model_code: "MDLB", model_year: 2025, production_date: "2025-01-09", suspect_part_number: 2500, region_code: "WE", sale_status: "IN_DEALER_STOCK" }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "response.data.error_id == \"ERR_DUPLICATE_VIN\""
            - "GET /vehicles/${veh1_id} still shows plant_code == \"PLT1\", model_year == 2024 and region_code == \"NE\""

      - name: superseding_a_draft_campaign_returns_superseded_campaign_invalid
        claim_type: error_triggerable
        grounds:
          - errors.ERR_SUPERSEDED_CAMPAIGN_INVALID
          - validations.priority_12
          - state_machines.RecallCampaign.campaign_status.DEFECT_DETERMINED_to_SUPERSEDED
        distinguishing_aspect: |
          A campaign that has not yet reached a defect determination has nothing to supersede, so the
          predecessor pointer is refused with 422 at priority 12 -- the successor campaign is never
          created and the DRAFT predecessor keeps its status.
        test_recipe:
          setup:
            - "Campaign 26V-333 exists and is still in DRAFT (no defect determination)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-333", defect_type: "SAFETY_DEFECT", defect_description: "Inflator may rupture" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { old_camp_id: $.data.id }
          trigger:
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-334", defect_type: "SAFETY_DEFECT", defect_description: "Expanded inflator population", supersedes_campaign_id: "${old_camp_id}" }
