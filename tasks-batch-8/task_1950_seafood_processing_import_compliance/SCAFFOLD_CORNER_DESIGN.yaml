            - { call: "POST /seafood/product-labels", payload: { market_name: "Pacific Cod", scientific_name: "Gadus macrocephalus", species: "COD", production_method: "WILD", country_of_origin: "US", keep_frozen_statement: true }, as: ComplianceManager, captures: { lbl_id: "$.data.id" } }
