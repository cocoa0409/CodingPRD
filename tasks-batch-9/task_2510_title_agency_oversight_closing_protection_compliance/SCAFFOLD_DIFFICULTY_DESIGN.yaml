      - name: audit_clean_closure_requires_every_finding_cleared_rejected
        grounds:
          - validations.priority_80.ERR_UNREMEDIATED_FINDING_PRESENT
          - state_machines.EscrowAudit.UNDER_REVIEW_to_CLOSED_CLEAN
          - state_machines.AuditFinding.REMEDIATION_SUBMITTED_to_CLEARED
          - entities.AuditFinding.fields.status
        distinguishing_aspect: |
          A different entity pair, EscrowAudit -> AuditFinding, and a different
          dependency shape: the blocking condition is universal over the child
          set rather than existential over one sibling row. The audit is in
          UNDER_REVIEW and the actor differs from conducted_by_user_id, so only
          the child finding's REMEDIATION_SUBMITTED status blocks CLOSED_CLEAN;
          clearing that one child unblocks the same request.
