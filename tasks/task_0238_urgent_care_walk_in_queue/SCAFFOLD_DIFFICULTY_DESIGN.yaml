# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Urgent Care Walk-In Queue & Visit — EXPERT tier
# 9 rule_ids x >= 2 instances = 18 depth instances.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # ---- 1.1 charge_total: insured-eligible vs self-pay on a Visit ----------
      - name: charge_total_insured_vs_self_pay_diverges
        grounds:
          - calculations.charge_total
          - entities.Visit.fields.patient_responsibility_cents
          - entities.Coverage.fields.eligibility_status
        distinguishing_aspect: |
          Identical Charge rows (one 20000-cent VISIT charge) yield
          patient_responsibility_cents == 1500 (flat copay) under verified INSURANCE
          but == 14000 (subtotal * 0.70) under SELF_PAY — divergence on the Visit
          billing domain, a different entity domain from wait_estimate (QueueEntry).
        test_recipe:
          setup:
            - "Two independent clinics each with one roomed Visit holding a single 20000-cent VISIT charge."
            - "Clinic A patient has verified INSURANCE coverage (copay 1500); Clinic B patient is SELF_PAY; both clinics self_pay_discount_pct=0.30."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Clinic A", exam_room_capacity: 4, self_pay_discount_pct: 0.30 }
              as: Anonymous
              captures: { clinic_a: $.data.id }
            - call: "POST /clinics/${clinic_a}/exam-rooms"
              payload: { room_label: "A1" }
              as: ClinicManager
              captures: { room_a: $.data.id }
            - call: "POST /clinics/${clinic_a}/providers"
              payload: { full_name: "Dr A", credential: "MD" }
              as: ClinicManager
              captures: { prov_a: $.data.id }
            - call: "POST /clinics/${clinic_a}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "cough" }
              as: FrontDeskClerk
              captures: { qe_a: $.data.id }
            - call: "POST /clinics/${clinic_a}/queue-entries/${qe_a}/triage"
              payload: { esi_level: 3 }
              as: TriageNurse
            - call: "POST /patients"
              payload: { queue_entry_id: "${qe_a}", legal_name: "Pat A", date_of_birth: "1990-01-01", consent_signed: true }
              as: FrontDeskClerk
              captures: { pat_a: $.data.id }
            - call: "POST /coverages"
              payload: { patient_id: "${pat_a}", coverage_type: "INSURANCE", payer_name: "Aetna", member_id: "M1", copay_cents: 1500 }
              as: FrontDeskClerk
              captures: { cov_a: $.data.id }
            - call: "POST /coverages/${cov_a}/verify"
              payload: { outcome: "ELIGIBLE" }
              as: FrontDeskClerk
            - call: "POST /clinics/${clinic_a}/queue-entries/${qe_a}/mark-ready"
              payload: {}
              as: FrontDeskClerk
            - call: "GET /clinics/${clinic_a}"
              payload: {}
              as: Provider
              captures: { cv_a: $.data.version }
            - call: "POST /visits"
              payload: { queue_entry_id: "${qe_a}", provider_id: "${prov_a}", exam_room_id: "${room_a}", expected_clinic_version: "${cv_a}" }
              as: Provider
              captures: { visit_a: $.data.id }
            - call: "POST /visits/${visit_a}/charges"
              payload: { cpt_code: "99213", amount_cents: 20000 }
              as: Provider
            # ---- Clinic B (self-pay) ----
            - call: "POST /clinics"
              payload: { name: "Clinic B", exam_room_capacity: 4, self_pay_discount_pct: 0.30 }
              as: Anonymous
              captures: { clinic_b: $.data.id }
            - call: "POST /clinics/${clinic_b}/exam-rooms"
              payload: { room_label: "B1" }
              as: ClinicManager
              captures: { room_b: $.data.id }
            - call: "POST /clinics/${clinic_b}/providers"
              payload: { full_name: "Dr B", credential: "DO" }
              as: ClinicManager
              captures: { prov_b: $.data.id }
            - call: "POST /clinics/${clinic_b}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "rash" }
              as: FrontDeskClerk
              captures: { qe_b: $.data.id }
            - call: "POST /clinics/${clinic_b}/queue-entries/${qe_b}/triage"
              payload: { esi_level: 3 }
              as: TriageNurse
            - call: "POST /patients"
              payload: { queue_entry_id: "${qe_b}", legal_name: "Pat B", date_of_birth: "1985-05-05", consent_signed: true }
              as: FrontDeskClerk
              captures: { pat_b: $.data.id }
            - call: "POST /coverages"
              payload: { patient_id: "${pat_b}", coverage_type: "SELF_PAY" }
              as: FrontDeskClerk
              captures: { cov_b: $.data.id }
            - call: "POST /clinics/${clinic_b}/queue-entries/${qe_b}/mark-ready"
              payload: {}
              as: FrontDeskClerk
            - call: "GET /clinics/${clinic_b}"
              payload: {}
              as: Provider
              captures: { cv_b: $.data.version }
            - call: "POST /visits"
              payload: { queue_entry_id: "${qe_b}", provider_id: "${prov_b}", exam_room_id: "${room_b}", expected_clinic_version: "${cv_b}" }
              as: Provider
              captures: { visit_b: $.data.id }
            - call: "POST /visits/${visit_b}/charges"
              payload: { cpt_code: "99213", amount_cents: 20000 }
              as: Provider
          trigger:
            - call: "POST /visits/${visit_a}/post-charges"
              payload: {}
              as: Provider
              captures: { resp_a: $.data.patient_responsibility_cents }
            - call: "POST /visits/${visit_b}/post-charges"
              payload: {}
              as: Provider
              captures: { resp_b: $.data.patient_responsibility_cents }
          assert:
            - "Visit.${visit_a}.patient_responsibility_cents == 1500"
            - "Visit.${visit_b}.patient_responsibility_cents == 14000"
            - "Visit.${visit_a}.charges_subtotal_cents == 20000 AND Visit.${visit_b}.charges_subtotal_cents == 20000"

      # ---- 1.2 wait_estimate: optimistic vs conservative on a QueueEntry -------
      - name: wait_estimate_optimistic_vs_conservative_diverges
        grounds:
          - calculations.wait_estimate
          - entities.QueueEntry.fields.estimated_wait_minutes
          - state_machines.QueueEntry.WAITING_to_TRIAGED
        distinguishing_aspect: |
          With one on-shift provider and two TRIAGED entries ahead (ESI 3 -> 20min,
          ESI 4 -> 12min), the under-test TRIAGED entry's conservative estimate is
          ceil(32/1)=32, while an ONLINE RESERVED entry behind all three triaged
          entries (work ahead 20+12+8=40) reads the optimistic estimate ceil(40/2)=20
          — divergence on QueueEntry, a different entity domain than charge_total.
        test_recipe:
          setup:
            - "One clinic, one on-shift provider, default avg_provider_minutes_per_esi {1:40,2:30,3:20,4:12,5:8}."
            - "Two WALK_IN entries triaged ESI 3 and ESI 4 ahead; a third WALK_IN under test triaged ESI 5 sits behind them."
            - "A fourth ONLINE RESERVED save-my-spot entry (created last) reads the optimistic estimate."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "WaitClinic", exam_room_capacity: 4 }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /clinics/${c}/providers"
              payload: { full_name: "Solo", credential: "NP", on_shift: true }
              as: ClinicManager
              captures: { prov: $.data.id }
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "ahead-esi3" }
              as: FrontDeskClerk
              captures: { q3: $.data.id }
            - call: "POST /clinics/${c}/queue-entries/${q3}/triage"
              payload: { esi_level: 3 }
              as: TriageNurse
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "ahead-esi4" }
              as: FrontDeskClerk
              captures: { q4: $.data.id }
            - call: "POST /clinics/${c}/queue-entries/${q4}/triage"
              payload: { esi_level: 4 }
              as: TriageNurse
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "under-test-esi5" }
              as: FrontDeskClerk
              captures: { qt: $.data.id }
            - call: "POST /clinics/${c}/queue-entries/${qt}/triage"
              payload: { esi_level: 5 }
              as: TriageNurse
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "ONLINE", chief_complaint: "online-hold-esi5" }
              as: Patient
              captures: { qo: $.data.id }
          trigger:
            - call: "GET /queue-entries/${qt}"
              payload: {}
              as: Provider
              captures: { est_conservative: $.data.estimated_wait_minutes }
            - call: "GET /queue-entries/${qo}"
              payload: {}
              as: Patient
              captures: { est_optimistic: $.data.estimated_wait_minutes }
          assert:
            - "QueueEntry.${qt}.estimated_wait_minutes == 32"
            - "QueueEntry.${qo}.estimated_wait_minutes == 20"
            - "QueueEntry.${qt}.estimated_wait_minutes > QueueEntry.${qo}.estimated_wait_minutes"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # ---- 2.1 wait_estimate: mode (a) >=3 inputs, tiered-rate + nested ceil ---
      - name: wait_estimate_tiered_esi_nonlinear_division
        grounds:
          - calculations.wait_estimate
          - entities.Clinic.fields.avg_provider_minutes_per_esi
          - entities.Provider.fields.on_shift
        distinguishing_aspect: |
          MODE (a): three inputs interact non-linearly — per-ESI tiered minutes map
          selection, sum of the ahead-set, and integer ceil division by on-shift
          server count: ceil((30+20+12)/2)=31, not (15+10+6)=31-by-coincidence-avoided.
          Distinct mode from charge_total which is MODE (b) nested-rounding-order.
        test_recipe:
          setup:
            - "One clinic, TWO on-shift providers, default ESI minutes map."
            - "Ahead-set = three TRIAGED entries at ESI 2 (30), ESI 3 (20), ESI 4 (12); the entry under test sits behind all three at ESI 5."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "CombClinic", exam_room_capacity: 6 }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /clinics/${c}/providers"
              payload: { full_name: "P1", credential: "MD", on_shift: true }
              as: ClinicManager
            - call: "POST /clinics/${c}/providers"
              payload: { full_name: "P2", credential: "DO", on_shift: true }
              as: ClinicManager
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "esi2" }
              as: FrontDeskClerk
              captures: { q2: $.data.id }
            - call: "POST /clinics/${c}/queue-entries/${q2}/triage"
              payload: { esi_level: 2 }
              as: TriageNurse
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "esi3" }
              as: FrontDeskClerk
              captures: { q3: $.data.id }
            - call: "POST /clinics/${c}/queue-entries/${q3}/triage"
              payload: { esi_level: 3 }
              as: TriageNurse
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "esi4" }
              as: FrontDeskClerk
              captures: { q4: $.data.id }
            - call: "POST /clinics/${c}/queue-entries/${q4}/triage"
              payload: { esi_level: 4 }
              as: TriageNurse
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "under-test" }
              as: FrontDeskClerk
              captures: { qt: $.data.id }
            - call: "POST /clinics/${c}/queue-entries/${qt}/triage"
              payload: { esi_level: 5 }
              as: TriageNurse
          trigger:
            - call: "GET /queue-entries/${qt}"
              payload: {}
              as: Provider
              captures: { est: $.data.estimated_wait_minutes }
          assert:
            - "QueueEntry.${qt}.estimated_wait_minutes == 31"

      # ---- 2.2 charge_total: mode (b) pinned rounding order ---------------------
      - name: charge_total_sum_then_discount_then_round_order
        grounds:
          - calculations.charge_total
          - entities.Charge.fields.amount_cents
          - entities.Clinic.fields.self_pay_discount_pct
        distinguishing_aspect: |
          MODE (b): rounding order is pinned to sum-then-discount-then-round-once.
          Three charges (4001, 4001, 4001) self-pay at 0.30 -> round(12003*0.70)=
          round(8402.1)=8402, NOT per-line round(4001*0.70)*3 = 2801*3 = 8403.
          Distinct mode from wait_estimate MODE (a).
        test_recipe:
          setup:
            - "One SELF_PAY roomed visit (discount 0.30) with three 4001-cent VISIT charges."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "RoundClinic", exam_room_capacity: 2, self_pay_discount_pct: 0.30 }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /clinics/${c}/exam-rooms"
              payload: { room_label: "R1" }
              as: ClinicManager
              captures: { room: $.data.id }
            - call: "POST /clinics/${c}/providers"
              payload: { full_name: "Dr R", credential: "PA" }
              as: ClinicManager
              captures: { prov: $.data.id }
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "billing" }
              as: FrontDeskClerk
              captures: { qe: $.data.id }
            - call: "POST /clinics/${c}/queue-entries/${qe}/triage"
              payload: { esi_level: 4 }
              as: TriageNurse
            - call: "POST /patients"
              payload: { queue_entry_id: "${qe}", legal_name: "Round Pat", date_of_birth: "1979-03-03", consent_signed: true }
              as: FrontDeskClerk
              captures: { pat: $.data.id }
            - call: "POST /coverages"
              payload: { patient_id: "${pat}", coverage_type: "SELF_PAY" }
              as: FrontDeskClerk
            - call: "POST /clinics/${c}/queue-entries/${qe}/mark-ready"
              payload: {}
              as: FrontDeskClerk
            - call: "GET /clinics/${c}"
              payload: {}
              as: Provider
              captures: { cv: $.data.version }
            - call: "POST /visits"
              payload: { queue_entry_id: "${qe}", provider_id: "${prov}", exam_room_id: "${room}", expected_clinic_version: "${cv}" }
              as: Provider
              captures: { visit: $.data.id }
            - call: "POST /visits/${visit}/charges"
              payload: { cpt_code: "X1", amount_cents: 4001 }
              as: Provider
            - call: "POST /visits/${visit}/charges"
              payload: { cpt_code: "X2", amount_cents: 4001 }
              as: Provider
            - call: "POST /visits/${visit}/charges"
              payload: { cpt_code: "X3", amount_cents: 4001 }
              as: Provider
          trigger:
            - call: "POST /visits/${visit}/post-charges"
              payload: {}
              as: Provider
              captures: { resp: $.data.patient_responsibility_cents }
          assert:
            - "Visit.${visit}.charges_subtotal_cents == 12003"
            - "Visit.${visit}.patient_responsibility_cents == 8402"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # ---- 3.1 QueueEntry cyclic IN_REGISTRATION <-> TRIAGED -------------------
      - name: queue_entry_retriage_revision_cycle
        grounds:
          - state_machines.QueueEntry.IN_REGISTRATION_to_TRIAGED
          - state_machines.QueueEntry.TRIAGED_to_IN_REGISTRATION
          - entities.QueueEntry.fields.esi_level
        distinguishing_aspect: |
          QueueEntry loops IN_REGISTRATION -> TRIAGED (re-triage, esi_level 3->1)
          back into the registration flow — a true cycle on the QueueEntry entity,
          distinct from Visit's parallel-dimension non-linearity (3.2).
        test_recipe:
          setup:
            - "One clinic; a WALK_IN entry triaged ESI 3, then a patient registered (entry now IN_REGISTRATION)."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "CycleClinic", exam_room_capacity: 2 }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "cycle" }
              as: FrontDeskClerk
              captures: { qe: $.data.id }
            - call: "POST /clinics/${c}/queue-entries/${qe}/triage"
              payload: { esi_level: 3 }
              as: TriageNurse
            - call: "POST /patients"
              payload: { queue_entry_id: "${qe}", legal_name: "Cyc Pat", date_of_birth: "1995-07-07", consent_signed: true }
              as: FrontDeskClerk
          trigger:
            - call: "POST /clinics/${c}/queue-entries/${qe}/re-triage"
              payload: { esi_level: 1 }
              as: TriageNurse
              captures: { st_after_retriage: $.data.status, esi_after: $.data.esi_level }
          assert:
            - "QueueEntry.${qe}.status == TRIAGED"
            - "QueueEntry.${qe}.esi_level == 1"

      # ---- 3.2 Visit parallel dimensions clinical x billing --------------------
      - name: visit_parallel_clinical_and_billing_dimensions
        grounds:
          - state_machines.Visit.IN_EXAM_to_CHARTING
          - state_machines.Visit.OPEN_to_CHARGES_POSTED
          - entities.Visit.fields.billing_status
        distinguishing_aspect: |
          On one Visit, clinical_status advances IN_EXAM->CHARTING while
          billing_status independently advances OPEN->CHARGES_POSTED; the two axes
          evolve on the same row without interlock — parallel-dimension
          non-linearity on Visit, a different entity than the QueueEntry cycle.
        test_recipe:
          setup:
            - "One roomed Visit (clinical IN_EXAM, billing OPEN) with one 5000-cent charge and a SELF_PAY patient."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "ParClinic", exam_room_capacity: 2, self_pay_discount_pct: 0.30 }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /clinics/${c}/exam-rooms"
              payload: { room_label: "P1" }
              as: ClinicManager
              captures: { room: $.data.id }
            - call: "POST /clinics/${c}/providers"
              payload: { full_name: "Dr P", credential: "MD" }
              as: ClinicManager
              captures: { prov: $.data.id }
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "par" }
              as: FrontDeskClerk
              captures: { qe: $.data.id }
            - call: "POST /clinics/${c}/queue-entries/${qe}/triage"
              payload: { esi_level: 3 }
              as: TriageNurse
            - call: "POST /patients"
              payload: { queue_entry_id: "${qe}", legal_name: "Par Pat", date_of_birth: "1988-08-08", consent_signed: true }
              as: FrontDeskClerk
              captures: { pat: $.data.id }
            - call: "POST /coverages"
              payload: { patient_id: "${pat}", coverage_type: "SELF_PAY" }
              as: FrontDeskClerk
            - call: "POST /clinics/${c}/queue-entries/${qe}/mark-ready"
              payload: {}
              as: FrontDeskClerk
            - call: "GET /clinics/${c}"
              payload: {}
              as: Provider
              captures: { cv: $.data.version }
            - call: "POST /visits"
              payload: { queue_entry_id: "${qe}", provider_id: "${prov}", exam_room_id: "${room}", expected_clinic_version: "${cv}" }
              as: Provider
              captures: { visit: $.data.id }
            - call: "POST /visits/${visit}/charges"
              payload: { cpt_code: "Z1", amount_cents: 5000 }
              as: Provider
          trigger:
            - call: "POST /visits/${visit}/post-charges"
              payload: {}
              as: Provider
              captures: { billing_after: $.data.billing_status, clinical_after_post: $.data.clinical_status }
            - call: "POST /visits/${visit}/start-charting"
              payload: {}
              as: Provider
              captures: { clinical_after: $.data.clinical_status, billing_unchanged: $.data.billing_status }
          assert:
            - "after post-charges: Visit.${visit}.billing_status == CHARGES_POSTED AND Visit.${visit}.clinical_status == IN_EXAM"
            - "after start-charting: Visit.${visit}.clinical_status == CHARTING AND Visit.${visit}.billing_status == CHARGES_POSTED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # ---- 4.1 depth-3: rooming -> QueueEntry -> Clinic depth -> posture -------
      - name: rooming_cascade_depth_to_posture_demotion
        grounds:
          - state_machines.QueueEntry.READY_FOR_PROVIDER_to_ROOMED
          - calculations.clinic_posture
          - entities.Clinic.fields.posture
        distinguishing_aspect: |
          DEPTH >= 3 chain originating from POST /visits: rooming flips QueueEntry
          READY_FOR_PROVIDER->ROOMED (link 1) which decrements Clinic.active_queue_depth
          from 8 to 7 (link 2 caused by link 1) which recomputes Clinic.posture
          SURGE->OPEN (link 3 caused by link 2). Distinct trigger from the
          referral-cancel cascade (4.2).
        test_recipe:
          setup:
            - "Clinic surge_threshold=8, diversion_threshold=20; one front-of-line READY_FOR_PROVIDER entry plus 7 seeded WAITING entries -> depth 8, posture SURGE."
            - "One available room, one on-shift provider."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "SurgeClinic", exam_room_capacity: 10, surge_threshold: 8, diversion_threshold: 20 }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /clinics/${c}/exam-rooms"
              payload: { room_label: "S1" }
              as: ClinicManager
              captures: { room: $.data.id }
            - call: "POST /clinics/${c}/providers"
              payload: { full_name: "Dr S", credential: "MD" }
              as: ClinicManager
              captures: { prov: $.data.id }
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "front" }
              as: FrontDeskClerk
              captures: { qe: $.data.id }
            - call: "POST /clinics/${c}/queue-entries/${qe}/triage"
              payload: { esi_level: 1 }
              as: TriageNurse
            - call: "POST /patients"
              payload: { queue_entry_id: "${qe}", legal_name: "Front Pat", date_of_birth: "1970-01-01", consent_signed: true }
              as: FrontDeskClerk
              captures: { pat: $.data.id }
            - call: "POST /coverages"
              payload: { patient_id: "${pat}", coverage_type: "SELF_PAY" }
              as: FrontDeskClerk
            - call: "POST /clinics/${c}/queue-entries/${qe}/mark-ready"
              payload: {}
              as: FrontDeskClerk
            - call: "POST /_seed/queue-depth"
              payload: { clinic_id: "${c}", count: 7 }
              as: Anonymous
              captures: { depth_before: $.data.active_queue_depth, posture_before: $.data.posture }
            - call: "GET /clinics/${c}"
              payload: {}
              as: Provider
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /visits"
              payload: { queue_entry_id: "${qe}", provider_id: "${prov}", exam_room_id: "${room}", expected_clinic_version: "${cv}" }
              as: Provider
              captures: { visit: $.data.id }
            - call: "GET /clinics/${c}"
              payload: {}
              as: Provider
              captures: { depth_after: $.data.active_queue_depth, posture_after: $.data.posture }
          assert:
            - "before rooming: Clinic.${c}.active_queue_depth == 8 AND Clinic.${c}.posture == SURGE"
            - "after rooming: Clinic.${c}.active_queue_depth == 7 AND Clinic.${c}.posture == OPEN"
            - "QueueEntry.${qe}.status == ROOMED"

      # ---- 4.2 depth-2: complete-charting -> ExamRoom -> rooms_occupied --------
      - name: complete_charting_cascade_room_release_to_rooms_occupied
        grounds:
          - state_machines.Visit.CHARTING_to_PENDING_DISCHARGE
          - state_machines.ExamRoom.OCCUPIED_to_CLEANING
          - entities.Clinic.fields.rooms_occupied
        distinguishing_aspect: |
          DEPTH >= 2 chain originating from POST /visits/{id}/complete-charting:
          the transition flips ExamRoom OCCUPIED->CLEANING (link 1) whose status
          change recomputes Clinic.rooms_occupied from 1 to 0 (link 2 caused by
          link 1). Distinct trigger from the rooming->posture cascade (4.1).
        test_recipe:
          setup:
            - "One Visit roomed and in clinical CHARTING occupying the clinic's single room; rooms_occupied==1."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "ChartClinic", exam_room_capacity: 1, self_pay_discount_pct: 0.30 }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /clinics/${c}/exam-rooms"
              payload: { room_label: "C1" }
              as: ClinicManager
              captures: { room: $.data.id }
            - call: "POST /clinics/${c}/providers"
              payload: { full_name: "Dr C", credential: "DO" }
              as: ClinicManager
              captures: { prov: $.data.id }
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "chart" }
              as: FrontDeskClerk
              captures: { qe: $.data.id }
            - call: "POST /clinics/${c}/queue-entries/${qe}/triage"
              payload: { esi_level: 3 }
              as: TriageNurse
            - call: "POST /patients"
              payload: { queue_entry_id: "${qe}", legal_name: "Chart Pat", date_of_birth: "1991-09-09", consent_signed: true }
              as: FrontDeskClerk
              captures: { pat: $.data.id }
            - call: "POST /coverages"
              payload: { patient_id: "${pat}", coverage_type: "SELF_PAY" }
              as: FrontDeskClerk
            - call: "POST /clinics/${c}/queue-entries/${qe}/mark-ready"
              payload: {}
              as: FrontDeskClerk
            - call: "GET /clinics/${c}"
              payload: {}
              as: Provider
              captures: { cv: $.data.version }
            - call: "POST /visits"
              payload: { queue_entry_id: "${qe}", provider_id: "${prov}", exam_room_id: "${room}", expected_clinic_version: "${cv}" }
              as: Provider
              captures: { visit: $.data.id }
            - call: "POST /visits/${visit}/start-charting"
              payload: {}
              as: Provider
          trigger:
            - call: "POST /visits/${visit}/complete-charting"
              payload: { chart_note: "URI, supportive care" }
              as: Provider
            - call: "GET /exam-rooms/${room}"
              payload: {}
              as: Provider
              captures: { room_status: $.data.status }
            - call: "GET /clinics/${c}"
              payload: {}
              as: Provider
              captures: { occ_after: $.data.rooms_occupied }
          assert:
            - "ExamRoom.${room}.status == CLEANING"
            - "Clinic.${c}.rooms_occupied == 0"
            - "Visit.${visit}.clinical_status == PENDING_DISCHARGE"

