          - state_machines.Candidate.ELIGIBILITY_REVIEW_to_ELIGIBILITY_DENIED
          - state_machines.Candidate.ELIGIBILITY_DENIED_to_ELIGIBILITY_REVIEW
        distinguishing_aspect: "The Candidate machine's denial loop: REJECT sends ELIGIBILITY_REVIEW -> ELIGIBILITY_DENIED; the candidate resubmits evidence (ELIGIBILITY_DENIED -> ELIGIBILITY_REVIEW) and a later APPROVE reaches ELIGIBLE."
        test_recipe:
          setup: ["Clock 2027-01-10; candidate A REGISTERED with 5 years experience."]
          setup_api_calls:
            - *c_clk
            - call: "POST /candidates"
              payload: { full_name: "Candidate A", email: "a@x.com", license_number: "LIC-A", license_state: "NM", district_code: "D-100", years_experience: 5 }
              as: Anonymous
              captures: { cand_a: $.data.id }
          trigger:
            - *c_elig_submit
            - call: "POST /candidates/${cand_a}/verify-eligibility"
              payload: { decision: "REJECT", note: "license document illegible" }
              as: BoardAdministrator
              captures: { st1: $.data.status }
            - call: "POST /candidates/${cand_a}/submit-eligibility"
              payload: { license_document_ref: "lic-a2.pdf", employer_verification_ref: "emp-a2.pdf" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { st2: $.data.status }
            - call: "POST /candidates/${cand_a}/verify-eligibility"
              payload: { decision: "APPROVE" }
              as: BoardAdministrator
              captures: { st3: $.data.status }
          assert:
            - "REJECT: status == ELIGIBILITY_DENIED"
            - "resubmission from ELIGIBILITY_DENIED: status == ELIGIBILITY_REVIEW (loop edge)"
            - "second review APPROVE: status == ELIGIBLE"

  # ===========================================================================
  - section: calculations
    instances:
      - name: read_divergence_exactly_at_tolerance_averages
        claim_type: Correct Result
        grounds:
          - calculations.component_final_score
          - state_machines.ComponentSubmission.SCORING_to_SCORED
        distinguishing_aspect: "DIVERGENCE_TOLERANCE boundary: |3.00 - 3.50| == 0.50 is NOT greater than 0.50, so no adjudication — final_score is the round_half_up average 3.25 and both reads FINALIZE."
        test_recipe:
          setup: ["Clock 2027-01-10; cycle NB-2027 OPEN; candidate A ELIGIBLE; assessors R1/R2 ACTIVE; P1 submission SCORING."]
          setup_api_calls:
            - *c_clk
            - *c_cycle
            - *c_open
            - call: "POST /candidates"
              payload: { full_name: "Candidate A", email: "a@x.com", license_number: "LIC-A", license_state: "NM", district_code: "D-100", years_experience: 5 }
              as: Anonymous
              captures: { cand_a: $.data.id }
            - *c_elig_submit
            - *c_elig_verify
            - *c_bench
            - *c_r1_new
            - *c_r1_train
            - *c_r1_cal
            - *c_r1_a1
            - *c_r1_s1
            - *c_r1_a2
            - *c_r1_s2
            - *c_r1_active
            - *c_r2_new
            - *c_r2_train
            - *c_r2_cal
            - *c_r2_a1
            - *c_r2_s1
            - *c_r2_a2
            - *c_r2_s2
            - *c_r2_active
            - *c_p1_sub
            - *c_p1_art_wc
            - *c_p1_art_vid
            - *c_p1_submit
            - *c_p1_accept
          trigger:
            - *c_p1_asg1
            - call: "POST /assignments/${c_p1a1}/submit-score"
              payload: { score: 3.00 }
              as: Assessor
              as_user_id: "${as1}"
              captures: { a1_st: $.data.status }
            - *c_p1_asg2
            - call: "POST /assignments/${c_p1a2}/submit-score"
              payload: { score: 3.50 }
              as: Assessor
              as_user_id: "${as2}"
              captures: { a2_st: $.data.status }
            - call: "GET /submissions/${sub_p1}"
              payload: {}
              as: BoardAdministrator
              captures: { sub_st: $.data.status, sub_final: $.data.final_score }
          assert:
            - "ScoringAssignment.${c_p1a1}.status == FINALIZED and ScoringAssignment.${c_p1a2}.status == FINALIZED"
            - "ComponentSubmission.${sub_p1}.status == SCORED (no ADJUDICATION_REQUIRED at exactly 0.50)"
            - "ComponentSubmission.${sub_p1}.final_score == 3.25 (round_half_up((3.00 + 3.50) / 2, 2))"

      - name: read_divergence_beyond_tolerance_requires_adjudication
        claim_type: Correct Result
        grounds:
          - calculations.component_final_score
          - state_machines.ComponentSubmission.SCORING_to_ADJUDICATION_REQUIRED
          - state_machines.ComponentSubmission.ADJUDICATION_REQUIRED_to_SCORED
        distinguishing_aspect: "|3.00 - 3.75| == 0.75 > 0.50 sends the submission to ADJUDICATION_REQUIRED; the adjudication read (read_number 3, a third assessor) decides final_score 3.25 and finalizes all three reads."
        test_recipe:
          setup: ["Clock 2027-01-10; cycle NB-2027 OPEN; candidate A ELIGIBLE; assessors R1 (D-900), R2 (D-901), R3 (D-902) ACTIVE; P1 submission SCORING."]
          setup_api_calls:
            - *c_clk
            - *c_cycle
            - *c_open
            - call: "POST /candidates"
              payload: { full_name: "Candidate A", email: "a@x.com", license_number: "LIC-A", license_state: "NM", district_code: "D-100", years_experience: 5 }
              as: Anonymous
              captures: { cand_a: $.data.id }
            - *c_elig_submit
            - *c_elig_verify
            - *c_bench
            - *c_r1_new
            - *c_r1_train
            - *c_r1_cal
            - *c_r1_a1
            - *c_r1_s1
            - *c_r1_a2
            - *c_r1_s2
            - *c_r1_active
            - *c_r2_new
            - *c_r2_train
            - *c_r2_cal
            - *c_r2_a1
            - *c_r2_s1
            - *c_r2_a2
            - *c_r2_s2
            - *c_r2_active
            - call: "POST /assessors"
              payload: { full_name: "Reader Three", email: "r3@x.com", home_district_code: "D-902" }
              as: ScoringAdministrator
              captures: { as3: $.data.id }
            - call: "POST /assessors/${as3}/transition"
              payload: { to: "IN_TRAINING" }
              as: ScoringAdministrator
            - call: "POST /assessors/${as3}/transition"
              payload: { to: "CALIBRATING" }
              as: ScoringAdministrator
            - call: "POST /assignments"
              payload: { benchmark_id: "${bm_id}", assessor_id: "${as3}" }
              as: ScoringAdministrator
              captures: { c_r3a1: $.data.id }
            - call: "POST /assignments/${c_r3a1}/submit-score"
              payload: { score: 3.00 }
              as: Assessor
              as_user_id: "${as3}"
            - call: "POST /assignments"
              payload: { benchmark_id: "${bm_id}", assessor_id: "${as3}" }
              as: ScoringAdministrator
              captures: { c_r3a2: $.data.id }
            - call: "POST /assignments/${c_r3a2}/submit-score"
              payload: { score: 3.25 }
              as: Assessor
              as_user_id: "${as3}"
            - call: "POST /assessors/${as3}/transition"
              payload: { to: "ACTIVE" }
              as: ScoringAdministrator
            - *c_p1_sub
            - *c_p1_art_wc
            - *c_p1_art_vid
            - *c_p1_submit
            - *c_p1_accept
          trigger:
            - *c_p1_asg1
            - call: "POST /assignments/${c_p1a1}/submit-score"
              payload: { score: 3.00 }
              as: Assessor
              as_user_id: "${as1}"
            - *c_p1_asg2
            - call: "POST /assignments/${c_p1a2}/submit-score"
              payload: { score: 3.75 }
              as: Assessor
              as_user_id: "${as2}"
            - call: "GET /submissions/${sub_p1}"
              payload: {}
              as: BoardAdministrator
              captures: { adj_st: $.data.status }
            - call: "POST /assignments"
              payload: { submission_id: "${sub_p1}", assessor_id: "${as3}" }
              as: ScoringAdministrator
              captures: { asg_adj: $.data.id, adj_read: $.data.read_number }
            - call: "POST /assignments/${asg_adj}/submit-score"
              payload: { score: 3.25 }
              as: Assessor
              as_user_id: "${as3}"
            - call: "GET /submissions/${sub_p1}"
              payload: {}
              as: BoardAdministrator
              captures: { fin_st: $.data.status, fin_score: $.data.final_score }
          assert:
            - "after read 2: ComponentSubmission.${sub_p1}.status == ADJUDICATION_REQUIRED (0.75 > 0.50)"
            - "ScoringAssignment.${asg_adj}.read_number == 3 (adjudication read)"
            - "after adjudication: status == SCORED and final_score == 3.25 (adjudicator's score, no averaging)"
            - "all three assignments end FINALIZED"

      - name: calibration_tolerance_boundary_inclusive
        claim_type: Correct Result
        grounds:
          - calculations.calibration_outcome
          - entities.ScoringAssignment.fields.is_within_tolerance
        distinguishing_aspect: "Known score 3.00 with tolerance 0.25: a 3.25 read passes (|d| == 0.25 inclusive boundary) while a 3.50 read fails (0.50 > 0.25); the pass counter reaches CALIBRATED only after the second in-tolerance read."
        test_recipe:
          setup: ["Clock 2027-01-10; benchmark BM known_score 3.00 tolerance 0.25; assessor Z in CALIBRATING."]
          setup_api_calls:
            - *c_clk
            - *c_bench
            - call: "POST /assessors"
              payload: { full_name: "Reader Z", email: "rz@x.com", home_district_code: "D-900" }
              as: ScoringAdministrator
              captures: { asz: $.data.id }
            - call: "POST /assessors/${asz}/transition"
              payload: { to: "IN_TRAINING" }
              as: ScoringAdministrator
            - call: "POST /assessors/${asz}/transition"
              payload: { to: "CALIBRATING" }
              as: ScoringAdministrator
          trigger:
            - call: "POST /assignments"
              payload: { benchmark_id: "${bm_id}", assessor_id: "${asz}" }
              as: ScoringAdministrator
              captures: { z1: $.data.id }
            - call: "POST /assignments/${z1}/submit-score"
              payload: { score: 3.50 }
              as: Assessor
              as_user_id: "${asz}"
              captures: { z1_tol: $.data.is_within_tolerance, z1_st: $.data.status }
            - call: "POST /assignments"
              payload: { benchmark_id: "${bm_id}", assessor_id: "${asz}" }
              as: ScoringAdministrator
              captures: { z2: $.data.id }
            - call: "POST /assignments/${z2}/submit-score"
