scaffold_corner_design:

  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_account_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Account, endpoints]
        distinguishing_aspect: "POST /accounts with email+display_name -> 201, status=ACTIVE, balances=0, risk_score=0, risk_tier=LOW, version=1, default limits applied."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { email: "fresh@x.com", display_name: "Fresh" }
              as: PlatformAdmin
              captures: { acc_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Account.${acc_id}.status == ACTIVE"
            - "Account.${acc_id}.available_balance_cents == 0"
            - "Account.${acc_id}.risk_score == 0"
            - "Account.${acc_id}.risk_tier == LOW"
            - "Account.${acc_id}.daily_send_limit_cents == 250000"
            - "Account.${acc_id}.weekly_send_limit_cents == 1000000"
            - "Account.${acc_id}.version == 1"

      - name: create_account_missing_display_name_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Account.fields.display_name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Missing required display_name on POST /accounts -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { email: "noname@x.com" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: get_account_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Account, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /accounts/{random-uuid} -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: account_balance_computed_after_seed_credit
        claim_type: Computed Fields
        grounds: [entities.Account.fields.available_balance_cents, endpoints]
        distinguishing_aspect: "available_balance_cents is computed from ledger: after a 7500c seed credit it reads 7500, regardless of any client-supplied value."
        test_recipe:
          setup: ["One Account."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "bal@x.com", display_name: "Bal" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /_ledger/seed_credit"
              payload: { account_id: "${b_id}", amount_cents: 7500, memo: "seed" }
              as: PlatformAdmin
          trigger:
            - call: "GET /accounts/${b_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Account.${b_id}.available_balance_cents == 7500"

      - name: list_accounts_pagination_envelope
        claim_type: Listing
        grounds: [entities.Account, endpoints]
        distinguishing_aspect: "GET /accounts returns response_type=array with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Two accounts."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "l1@x.com", display_name: "L1" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "l2@x.com", display_name: "L2" }
              as: PlatformAdmin
          trigger:
            - call: "GET /accounts"
              payload: { limit: 1, offset: 0 }
              as: ComplianceOfficer
              as_user_id: "officer-c1"
          assert:
            - "response.response_type == array"
            - "response.data length == 1"
            - "response.meta/pagination total_count >= 2"
            - "response.meta/pagination has_more == true"

      - name: funding_source_create_mints_micro_deposit_code
        claim_type: System Fields
        grounds: [entities.FundingSource.fields.micro_deposit_code, entities.FundingSource.fields.status]
        distinguishing_aspect: "POST /funding-sources -> 201 status=PENDING and a server-minted micro_deposit_code present; is_default_payout=false."
        test_recipe:
          setup: ["One Account."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "fs@x.com", display_name: "FS" }
              as: PlatformAdmin
              captures: { fsa_id: $.data.id }
          trigger:
            - call: "POST /funding-sources"
              payload: { account_id: "${fsa_id}", kind: "DEBIT", last4: "9999" }
              as: AccountHolder
              as_user_id: "${fsa_id}"
              captures: { fs_id: $.data.id, fs_code: $.data.micro_deposit_code }
          assert:
            - "response.status == 201"
            - "FundingSource.${fs_id}.status == PENDING"
            - "FundingSource.${fs_id}.is_default_payout == false"
            - "FundingSource.${fs_id}.micro_deposit_code is non-empty"

      - name: funding_source_bad_enum_kind_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.FundingSource.fields.kind, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "kind not in {BANK,DEBIT} on POST /funding-sources -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One Account."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "fsbad@x.com", display_name: "FSBad" }
              as: PlatformAdmin
              captures: { fb_id: $.data.id }
          trigger:
            - call: "POST /funding-sources"
              payload: { account_id: "${fb_id}", kind: "CREDIT", last4: "1234" }
              as: AccountHolder
              as_user_id: "${fb_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: recipient_verification_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.RecipientVerification]
        distinguishing_aspect: "RecipientVerification has common_fields:false — its create response carries id+created_at but no version field (event-like record)."
        test_recipe:
          setup: ["One Account; clock fixed."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "rvimm@x.com", display_name: "RVImm" }
              as: PlatformAdmin
              captures: { rvi_acc: $.data.id }
          trigger:
            - call: "POST /recipient-verifications"
              payload: { account_id: "${rvi_acc}", channel: "SMS" }
              as: AccountHolder
              as_user_id: "${rvi_acc}"
              captures: { rvimm_id: $.data.id }
          assert:
            - "response.status == 201"
            - "RecipientVerification.${rvimm_id}.status == PENDING"
            - "response.data has no version field"

      - name: funding_source_wrong_parent_account_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.FundingSource.fields.account_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /funding-sources with account_id referencing a non-existent Account -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["No accounts."]
          setup_api_calls: []
          trigger:
            - call: "POST /funding-sources"
              payload: { account_id: "00000000-0000-4000-8000-0000000000aa", kind: "BANK", last4: "0000" }
              as: AccountHolder
              as_user_id: "00000000-0000-4000-8000-0000000000aa"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_declined_money_request_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.MoneyRequest.PENDING_to_DECLINED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A DECLINED (terminal) MoneyRequest cancelled again -> 409 ERR_INVALID_STATE; no state change."
        test_recipe:
          setup: ["A DECLINED MoneyRequest from requester REQ to payer PAY."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "req_st@x.com", display_name: "REQ" }
              as: PlatformAdmin
              captures: { req_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "pay_st@x.com", display_name: "PAY" }
              as: PlatformAdmin
              captures: { pay_id: $.data.id }
            - call: "POST /money-requests"
              payload: { requester_account_id: "${req_id}", payer_account_id: "${pay_id}", amount_cents: 3000 }
              as: AccountHolder
              as_user_id: "${req_id}"
              captures: { mr_id: $.data.id }
            - call: "POST /money-requests/${mr_id}/decline"
              payload: {}
              as: AccountHolder
              as_user_id: "${pay_id}"
          trigger:
            - call: "POST /money-requests/${mr_id}/cancel"
              payload: {}
              as: AccountHolder
              as_user_id: "${req_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: freeze_account_blocks_subsequent_send
        claim_type: guarded transitions
        grounds: [state_machines.Account, "validations[priority=7]", "errors[ERR_ACCOUNT_FROZEN]"]
        distinguishing_aspect: "After POST /accounts/{id}/freeze, a POST /transfers from that FROZEN sender -> 409 ERR_ACCOUNT_FROZEN."
        test_recipe:
          setup: ["Sender S (frozen) with balance; verified recipient R."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "sfz@x.com", display_name: "SFZ" }
              as: PlatformAdmin
              captures: { sfz_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "rfz@x.com", display_name: "RFZ" }
              as: PlatformAdmin
              captures: { rfz_id: $.data.id }
            - call: "POST /_ledger/seed_credit"
              payload: { account_id: "${sfz_id}", amount_cents: 100000, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /recipient-verifications"
              payload: { account_id: "${rfz_id}", channel: "EMAIL" }
              as: AccountHolder
              as_user_id: "${rfz_id}"
              captures: { rvfz_id: $.data.id, rvfz_tok: $.data.confirm_token }
            - call: "POST /recipient-verifications/${rvfz_id}/confirm"
              payload: { token: "${rvfz_tok}" }
              as: AccountHolder
              as_user_id: "${rfz_id}"
            - call: "POST /accounts/${sfz_id}/freeze"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-fz"
          trigger:
            - call: "POST /transfers"
              payload: { sender_account_id: "${sfz_id}", recipient_account_id: "${rfz_id}", amount_cents: 1000 }
              as: AccountHolder
              as_user_id: "${sfz_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ACCOUNT_FROZEN"

      - name: terminal_settled_transfer_cannot_cancel
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Transfer.SENT_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A SETTLED (terminal) Transfer cancelled -> 409 ERR_INVALID_STATE; cancel only valid from SENT non-flagged."
        test_recipe:
          setup: ["A SETTLED small transfer S->R (verified recipient)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "stl_s@x.com", display_name: "STL S" }
              as: PlatformAdmin
              captures: { stls_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "stl_r@x.com", display_name: "STL R" }
              as: PlatformAdmin
              captures: { stlr_id: $.data.id }
            - call: "POST /_ledger/seed_credit"
              payload: { account_id: "${stls_id}", amount_cents: 50000, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /recipient-verifications"
              payload: { account_id: "${stlr_id}", channel: "EMAIL" }
              as: AccountHolder
              as_user_id: "${stlr_id}"
              captures: { rvstl_id: $.data.id, rvstl_tok: $.data.confirm_token }
            - call: "POST /recipient-verifications/${rvstl_id}/confirm"
              payload: { token: "${rvstl_tok}" }
              as: AccountHolder
              as_user_id: "${stlr_id}"
            - call: "POST /transfers"
              payload: { sender_account_id: "${stls_id}", recipient_account_id: "${stlr_id}", amount_cents: 1000 }
              as: AccountHolder
              as_user_id: "${stls_id}"
              captures: { stlt_id: $.data.id }
          trigger:
            - call: "POST /transfers/${stlt_id}/cancel"
              payload: {}
              as: AccountHolder
              as_user_id: "${stls_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: funding_source_verify_wrong_code_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.FundingSource.PENDING_to_VERIFIED, "validations[priority=9]", "errors[ERR_VERIFICATION_TOKEN_INVALID]"]
        distinguishing_aspect: "POST /funding-sources/{id}/verify with a wrong code -> 422 ERR_VERIFICATION_TOKEN_INVALID; status stays PENDING."
        test_recipe:
          setup: ["A PENDING FundingSource on Account A."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "fvw@x.com", display_name: "FVW" }
              as: PlatformAdmin
              captures: { fvw_acc: $.data.id }
            - call: "POST /funding-sources"
              payload: { account_id: "${fvw_acc}", kind: "BANK", last4: "4444" }
              as: AccountHolder
              as_user_id: "${fvw_acc}"
              captures: { fvw_fs: $.data.id }
          trigger:
            - call: "POST /funding-sources/${fvw_fs}/verify"
              payload: { code: "0000" }
              as: AccountHolder
              as_user_id: "${fvw_acc}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_VERIFICATION_TOKEN_INVALID"

      - name: recipient_verification_confirm_after_expiry_goes_expired
        claim_type: Valid Transition
        grounds: [state_machines.RecipientVerification.PENDING_to_EXPIRED, entities.RecipientVerification.fields.expires_at]
        distinguishing_aspect: "Confirming a verification with the correct token but at/after expires_at transitions to EXPIRED (not CONFIRMED); Account.is_recipient_verified stays false."
        test_recipe:
          setup: ["PENDING verification created at 2026-06-01T00:00:00Z (expires 2026-06-02T00:00:00Z); clock advanced to expiry."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "rvexp@x.com", display_name: "RVExp" }
              as: PlatformAdmin
              captures: { rvexp_acc: $.data.id }
            - call: "POST /recipient-verifications"
              payload: { account_id: "${rvexp_acc}", channel: "EMAIL" }
              as: AccountHolder
              as_user_id: "${rvexp_acc}"
              captures: { rvexp_id: $.data.id, rvexp_tok: $.data.confirm_token }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /recipient-verifications/${rvexp_id}/confirm"
              payload: { token: "${rvexp_tok}" }
              as: AccountHolder
              as_user_id: "${rvexp_acc}"
          assert:
            - "RecipientVerification.${rvexp_id}.status == EXPIRED"
            - "Account.${rvexp_acc}.is_recipient_verified == false"

      - name: split_partially_settled_bubble_up
        claim_type: Bubble up
        grounds: [state_machines.SplitRequest.OPEN_to_PARTIALLY_SETTLED, state_machines.SplitParticipant.OWED_to_PAID, calculations.split_status_rollup]
        distinguishing_aspect: "When one of two participants pays, the SplitRequest auto-derives PARTIALLY_SETTLED and collected_amount_cents == that participant's share (500 of 1000 EVEN split)."
        test_recipe:
          setup: ["EVEN split total 1000 over P1,P2 (shares 500 each); P1 funded."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "org_ps@x.com", display_name: "ORG PS" }
              as: PlatformAdmin
              captures: { orgps_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "p1_ps@x.com", display_name: "P1 PS" }
              as: PlatformAdmin
              captures: { p1ps_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "p2_ps@x.com", display_name: "P2 PS" }
              as: PlatformAdmin
              captures: { p2ps_id: $.data.id }
            - call: "POST /_ledger/seed_credit"
              payload: { account_id: "${p1ps_id}", amount_cents: 50000, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /split-requests"
              payload: { organizer_account_id: "${orgps_id}", total_amount_cents: 1000, split_mode: "EVEN", participants: [ { participant_account_id: "${p1ps_id}" }, { participant_account_id: "${p2ps_id}" } ] }
              as: AccountHolder
              as_user_id: "${orgps_id}"
              captures: { srps_id: $.data.id }
            - call: "GET /split-requests/${srps_id}/participants"
              payload: {}
              as: AccountHolder
              as_user_id: "${orgps_id}"
              captures: { part1_id: "$.data[0].id" }
          trigger:
            - call: "POST /split-requests/${srps_id}/participants/${part1_id}/pay"
              payload: {}
              as: AccountHolder
              as_user_id: "${p1ps_id}"
          assert:
            - "SplitRequest.${srps_id}.status == PARTIALLY_SETTLED"
            - "SplitRequest.${srps_id}.collected_amount_cents == 500"

  # =========================================================================
  # Section: calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: withdrawal_instant_fee_cap_applied
        claim_type: Constants Applied
        grounds: [calculations.withdrawal_fee, entities.Withdrawal.fields.fee_cents]
        distinguishing_aspect: "INSTANT gross 200000c: 1.75% = 3500c exceeds INSTANT_FEE_CAP_CENTS=1500, so fee_cents=1500, net=198500 (cap path)."
        test_recipe:
          setup: ["Account with VERIFIED FS and balance 500000."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "cap@x.com", display_name: "Cap" }
              as: PlatformAdmin
              captures: { cap_id: $.data.id }
            - call: "POST /_ledger/seed_credit"
              payload: { account_id: "${cap_id}", amount_cents: 500000, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /funding-sources"
              payload: { account_id: "${cap_id}", kind: "BANK", last4: "5555" }
              as: AccountHolder
              as_user_id: "${cap_id}"
              captures: { cap_fs: $.data.id, cap_code: $.data.micro_deposit_code }
            - call: "POST /funding-sources/${cap_fs}/verify"
              payload: { code: "${cap_code}" }
              as: AccountHolder
              as_user_id: "${cap_id}"
            - call: "GET /accounts/${cap_id}"
              payload: {}
              as: AccountHolder
              as_user_id: "${cap_id}"
              captures: { cap_v: $.data.version }
          trigger:
            - call: "POST /withdrawals"
              payload: { account_id: "${cap_id}", funding_source_id: "${cap_fs}", gross_amount_cents: 200000, speed: "INSTANT", expected_account_version: "${cap_v}" }
              as: AccountHolder
              as_user_id: "${cap_id}"
              captures: { cap_w: $.data.id }
          assert:
            - "Withdrawal.${cap_w}.fee_cents == 1500"
            - "Withdrawal.${cap_w}.net_amount_cents == 198500"

      - name: withdrawal_instant_fee_floor_applied
        claim_type: Correct Result
        grounds: [calculations.withdrawal_fee, entities.Withdrawal.fields.fee_cents]
        distinguishing_aspect: "INSTANT gross 1000c: 1.75% = 17.5 -> ceil 18c, below INSTANT_FEE_FLOOR_CENTS=25, so fee_cents=25 (floor path), net=975."
        test_recipe:
          setup: ["Account with VERIFIED FS and balance 50000."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "flr@x.com", display_name: "Flr" }
              as: PlatformAdmin
              captures: { flr_id: $.data.id }
            - call: "POST /_ledger/seed_credit"
              payload: { account_id: "${flr_id}", amount_cents: 50000, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /funding-sources"
              payload: { account_id: "${flr_id}", kind: "DEBIT", last4: "6666" }
              as: AccountHolder
              as_user_id: "${flr_id}"
              captures: { flr_fs: $.data.id, flr_code: $.data.micro_deposit_code }
            - call: "POST /funding-sources/${flr_fs}/verify"
              payload: { code: "${flr_code}" }
              as: AccountHolder
              as_user_id: "${flr_id}"
            - call: "GET /accounts/${flr_id}"
              payload: {}
              as: AccountHolder
              as_user_id: "${flr_id}"
              captures: { flr_v: $.data.version }
          trigger:
            - call: "POST /withdrawals"
              payload: { account_id: "${flr_id}", funding_source_id: "${flr_fs}", gross_amount_cents: 1000, speed: "INSTANT", expected_account_version: "${flr_v}" }
              as: AccountHolder
              as_user_id: "${flr_id}"
              captures: { flr_w: $.data.id }
          assert:
            - "Withdrawal.${flr_w}.fee_cents == 25"
            - "Withdrawal.${flr_w}.net_amount_cents == 975"

      - name: split_even_remainder_to_earliest_participant
        claim_type: Correct Result
        grounds: [calculations.split_share_allocation, entities.SplitParticipant.fields.share_amount_cents]
        distinguishing_aspect: "EVEN split total 10000 over 3 participants -> [3334,3333,3333]; the 1c remainder goes to the earliest-created (created_at ASC) participant, sum == 10000."
        test_recipe:
          setup: ["Organizer + 3 participants created in order P1,P2,P3."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "org_ev@x.com", display_name: "ORG EV" }
              as: PlatformAdmin
              captures: { orgev_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "p1_ev@x.com", display_name: "P1 EV" }
              as: PlatformAdmin
              captures: { p1ev_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "p2_ev@x.com", display_name: "P2 EV" }
              as: PlatformAdmin
              captures: { p2ev_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "p3_ev@x.com", display_name: "P3 EV" }
              as: PlatformAdmin
              captures: { p3ev_id: $.data.id }
            - call: "POST /split-requests"
              payload: { organizer_account_id: "${orgev_id}", total_amount_cents: 10000, split_mode: "EVEN", participants: [ { participant_account_id: "${p1ev_id}" }, { participant_account_id: "${p2ev_id}" }, { participant_account_id: "${p3ev_id}" } ] }
              as: AccountHolder
              as_user_id: "${orgev_id}"
              captures: { srev_id: $.data.id }
          trigger:
            - call: "GET /split-requests/${srev_id}/participants"
              payload: {}
              as: AccountHolder
              as_user_id: "${orgev_id}"
          assert:
