            - call: "POST /franchise/settlements"
              payload: { store_id: "${stZ_id}", franchisee_id: "${frZ_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-08T00:00:00Z", trailing_avg_gross_profit_cents: 1000000, expected_store_version: "${stZ_v}" }
              as: FranchisorAdmin
              captures: { setZ_id: $.data.id, setZ_v1: $.data.version }
            - call: "POST /franchise/settlements/${setZ_id}/revenue-lines"
              payload: { category: "MERCHANDISE", gross_sales_cents: 2000000, cost_of_goods_cents: 1400000, expected_settlement_version: "${setZ_v1}" }
              as: FranchisorAdmin
              captures: { setZ_v2: $.data.version }
          trigger:
            - call: "POST /franchise/settlements/${setZ_id}/revenue-lines"
              payload: { category: "FUEL", gross_sales_cents: 1000000, cost_of_goods_cents: 900000, expected_settlement_version: "${setZ_v1}" }
