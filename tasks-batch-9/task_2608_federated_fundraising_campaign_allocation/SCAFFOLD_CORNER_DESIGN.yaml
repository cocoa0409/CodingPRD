          ERR_ROLE_NOT_PERMITTED (403) for AllocationsDirector and for UnitedFundAdmin - the two
          roles that own every other allocation operation - and accepted for the seated panelist.
          Priority 2 fires before any state or assignment rule, so the two denials are 403 and not
          the 422 an unseated panelist would get.
