              as: AuctionAdmin
              captures: { title_now: $.data.title_status }
          assert:
            - "Settlement.${settlement_id}.title_status == TITLE_RECEIVED"
            - "Settlement.${settlement_id}.payment_status == UNPAID"
            - "Settlement.${settlement_id}.status == OPEN"

      - name: consignment_if_pending_relist_cycle
        grounds:
          - state_machines.Consignment.IF_PENDING_to_RUN_LISTED
          - state_machines.RunListEntry.IF_PENDING_to_SCHEDULED
          - state_machines.RunListEntry.BIDDING_CLOSED_to_IF_PENDING
        distinguishing_aspect: |
          Consignment is a DIFFERENT entity than Settlement and carries a CYCLE: RUN_LISTED ->
          IF_PENDING -> RUN_LISTED via lot relist, returning to a re-runnable SCHEDULED lot.
        test_recipe:
          setup:
            - "Lot with reserve 900000, buyer high bid 800000 (< reserve) -> BIDDING_CLOSED then mark-if -> Consignment IF_PENDING"
          setup_api_calls:
            - call: "POST /auction/sales"
              payload: { sale_name: "S", sale_date: "2026-06-02T09:00:00Z" }
