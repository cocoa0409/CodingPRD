  instances:
  - name: reverse_fee_pool_floor_division_then_one_cent_cycle
    grounds:
    - calculations.return_recredit_allocation
    - calculations.return_recredit_allocation.variants.even_split_floor_cycle
    - calculations.return_recredit_allocation.variants.weighted_split_floor_cycle
    - calculations.reverse_rail_fee_transfer
    - calculations.rail_fee_schedule
    - state_machines.PaymentOrder.transitions.IN_FLIGHT_to_RETURNED
