            - { call: "POST /formulas", payload: { drug_catalog_item_id: "${drug}", name: "SuspI2", dosage_form: "SUSPENSION", strength_mg_per_ml: 50, beyond_use_days: 14, base_compounding_minutes: 60 }, as: Pharmacist, captures: { frm: $.data.id } }
            - { call: "POST /prescriptions", payload: { pet_id: "${pet}", owner_id: "${own}", veterinarian_id: "${vet}", formula_id: "${frm}", quantity: 30, days_supply: 10, refills_authorized: 0, directions: "BID", written_date: "2026-05-01" }, as: PharmacyTech, captures: { rx: $.data.id } }
            - { call: "POST /prescriptions/${rx}/submit-verification", payload: {}, as: PharmacyTech }
            - { call: "POST /prescriptions/${rx}/vet-confirm", payload: {}, as: Veterinarian, as_user_id: "${vet}", captures: { rxv: $.data.version } }
            - { call: "POST /lots", payload: { drug_catalog_item_id: "${drug}", lot_number: "L1-I2", received_qty: 20, unit_cost_cents: 110, expiration_date: "2027-01-01" }, as: PharmacyTech }
            - { call: "POST /lots", payload: { drug_catalog_item_id: "${drug}", lot_number: "L2-I2", received_qty: 200, unit_cost_cents: 130, expiration_date: "2027-06-01" }, as: PharmacyTech }
            - { call: "POST /compounding-benches", payload: { bench_code: "BN-I2", supports_controlled: true }, as: PharmacyAdmin, captures: { bench: $.data.id } }
            - { call: "POST /wellness-plans", payload: { name: "PlanI2", monthly_fee_cents: 3000, included_refill_credits: 5, credit_value_cents: 2000, discount_pct: 0, covers_controlled: true }, as: PharmacyAdmin, captures: { plan: $.data.id } }
            - { call: "POST /enrollments", payload: { pet_id: "${pet}", plan_id: "${plan}", expected_owner_version: "${ownv}" }, as: Owner, as_user_id: "${own}", captures: { enr: $.data.id } }
            - { call: "POST /prescriptions/${rx}/compound-orders", payload: { flavoring_id: "${flv}", is_refill: false, expected_prescription_version: "${rxv}" }, as: PharmacyTech, captures: { ord: $.data.id } }
            - { call: "POST /compound-orders/${ord}/allocate", payload: {}, as: PharmacyTech }
