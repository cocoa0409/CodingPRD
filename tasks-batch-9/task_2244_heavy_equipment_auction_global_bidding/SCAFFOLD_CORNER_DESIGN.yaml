      - name: low_value_flat_schedule_floors_the_premium_and_skips_the_online_surcharge
        claim_type: constants_applied
        grounds:
          - calculations.buyer_premium_computation
          - calculations.buyer_settlement_total
        distinguishing_aspect: >
          On a LOW_VALUE_FLAT TIMED_ONLINE sale of 100000 the premium returns
          early at FLAT_MIN_CENTS 50000 - the 1500 online surcharge is never
          added and the STANDARD floor of 25000 is never consulted - giving
          total_due 75313.
        test_recipe:
          setup:
            - one US yard, one 6000 kg light machine catalogued with reserve 100000
            - one TIMED_ONLINE auction on the LOW_VALUE_FLAT premium schedule
            - one US TIER_A bidder with a 100000 deposit hold and no credit line
