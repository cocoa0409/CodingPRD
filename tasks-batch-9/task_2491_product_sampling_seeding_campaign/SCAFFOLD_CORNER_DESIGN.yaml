      - name: screening_score_at_the_inclusive_flag_threshold_fails_the_screen
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.panelist_fraud_risk_score
          - calculations.eligibility_screening_decision
          - constants[FLAG_THRESHOLD_INCLUSIVE=55.0]
          - state_machines.Enrollment[PENDING_SCREEN -> SCREEN_FAILED]
        distinguishing_aspect: "The weighted threshold is probed from both sides with the same address cluster and the same flagged referrer, so only the account-age term differs: 18 (three collisions) + 22 (account younger than ACCOUNT_AGE_FLOOR_DAYS) + 15 (referrer FLAGGED) lands exactly on 55.0 and FAILS because the comparison is inclusive, while an older account scores 33.0 and passes. Neither outcome is an HTTP error — both screens answer 200 and differ only in screening_status."
