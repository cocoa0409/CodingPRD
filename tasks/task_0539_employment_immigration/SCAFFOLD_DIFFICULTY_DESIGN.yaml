  - rule_id: resource_temporal_overlap
    instances:
      - name: recruitment_step_closed_interval_adjacency_conflicts
        grounds:
          - validations[priority=11]
          - entities.RecruitmentStep.fields.start_date
          - entities.RecruitmentStep.fields.end_date
        distinguishing_aspect: |
          RecruitmentStep intervals are CLOSED [start,end]; a second JOB_ORDER starting
          exactly on the first's end_date (2026-05-31) touches it and is rejected with
          ERR_RECRUITMENT_STEP_OVERLAP. Resource = PermCase recruitment calendar.
        test_recipe:
          setup:
            - "A RECRUITING PermCase already has a JOB_ORDER step [2026-05-01, 2026-05-31]."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "151515151", legal_name: "Nu Co", employee_count: 14 }
              as: EmployerAgent
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /prevailing-wage-determinations"
              payload: { employer_id: "${emp_id}", soc_code: "15-1252", job_title: "SWE", area_code: "AREA_A", wage_level: "LEVEL_II", wage_source: "OES", oes_wage_cents: 10000000, validity_start: "2026-05-01T00:00:00Z", validity_end: "2027-05-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { pwd_id: $.data.id }
            - call: "POST /prevailing-wage-determinations/${pwd_id}/transitions"
              payload: { to_status: "ISSUED", expected_employer_version: "${emp_v}" }
              as: DOLAnalyst
            - call: "POST /perm-cases"
              payload: { employer_id: "${emp_id}", pwd_id: "${pwd_id}", job_title: "SWE", offered_wage_cents: 12000000 }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { pc_id: $.data.id }
            - call: "POST /perm-cases/${pc_id}/transitions"
              payload: { to_status: "RECRUITING" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
            - call: "POST /recruitment-steps"
              payload: { perm_case_id: "${pc_id}", step_type: "JOB_ORDER", start_date: "2026-05-01T00:00:00Z", end_date: "2026-05-31T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /recruitment-steps"
              payload: { perm_case_id: "${pc_id}", step_type: "JOB_ORDER", start_date: "2026-05-31T00:00:00Z", end_date: "2026-06-10T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_RECRUITMENT_STEP_OVERLAP (closed intervals: touching at 2026-05-31 conflicts)"

      - name: employment_half_open_adjacency_allowed
        grounds:
          - validations[priority=12]
          - state_machines.H1BPetition.SUBMITTED_to_APPROVED
          - entities.H1BPetition.fields.employment_start
        distinguishing_aspect: |
          Employment intervals are HALF-OPEN [start,end); a second APPROVED petition for the
          same beneficiary+worksite starting exactly at the first's employment_end
          (2027-10-01) is adjacent, not overlapping, so approval succeeds. Resource =
          Beneficiary employment timeline; different interval semantics than the closed
          recruitment interval.
        test_recipe:
          setup:
