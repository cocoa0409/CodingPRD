  - name: SafetyAuditRequest
    parent: CustomerAccount
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> CustomerAccount.id; customer requesting the audit"
      - name: audit_type
        type: enum
        source: input
        description: "Type of audit"
        constraints: "DOT_COMPLIANCE | SAFETY_RATING | INSURANCE_VERIFICATION | FULL_OPERATIONAL"
      - name: status
        type: enum
        source: system
        description: "Audit status"
        constraints: "REQUESTED | IN_REVIEW | APPROVED | REJECTED | COMPLETED"
        default: REQUESTED
      - name: requested_date
        type: datetime
        source: input
        description: "Date the audit was requested"
      - name: completed_date
        type: datetime
        source: system
        description: "Date audit was completed"
      - name: auditor_notes
        type: string
        source: system
        description: "Notes from the reviewing auditor"
      - name: findings
        type: array
        source: system
        description: "List of audit findings"
        default: []
      - name: overall_rating
        type: enum
        source: system
        description: "Overall audit rating"
        constraints: "SATISFACTORY | CONDITIONAL | UNSATISFACTORY"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CharterQuote
    initial_state: DRAFT
    terminal_states: [EXPIRED, CANCELLED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /api/v1/quotes/{id}/price"
        actor: QuoteAgent
        preconditions:
          - "quote.status == DRAFT"
          - "quote.estimated_miles > 0"
          - "quote.estimated_hours > 0"
          - "quote.passenger_count > 0"
          - "customer.credit_status != COLLECTIONS"
        side_effects:
          - "compute mileage_rate_cents, hourly_rate_cents per vehicle_class_requested pricing tier"
          - "compute requires_overnight from estimated_hours and trip_date/return_date"
          - "compute requires_relief_driver from estimated_hours vs HOS single-driver limit"
          - "compute overnight_fee_cents, relief_driver_fee_cents if applicable"
          - "run calc_quote_pricing to produce subtotal_cents, tax_cents, total_cents, deposit_cents"
          - "set quote_expiry = current_utc + 72 hours"
          - "increment CharterQuote.version"
        note: "Pricing variant selection: MILEAGE_PRIMARY if estimated_miles / estimated_hours >= 55 (highway average), else HOURLY_PRIMARY"

      - from: QUOTED
        to: ACCEPTED
        trigger: "POST /api/v1/quotes/{id}/accept"
        actor: Customer
        preconditions:
          - "quote.status == QUOTED"
          - "current_utc < quote.quote_expiry"
          - "customer.credit_status != COLLECTIONS"
          - "expected_quote_version matches current quote.version (OCC)"
        side_effects:
          - "create CharterOrder from quote data (status=PENDING_DEPOSIT, deposit_cents from quote)"
          - "compute deposit_cents based on lead-time tier between current_utc and trip_date"
          - "increment CharterQuote.version"

      - from: QUOTED
        to: EXPIRED
        trigger: "system: current_utc >= quote.quote_expiry and quote.status == QUOTED"
        actor: system
        preconditions:
          - "quote.status == QUOTED"
          - "current_utc >= quote.quote_expiry"
        side_effects:
          - "increment CharterQuote.version"
        note: "Automatic expiry check performed lazily on read or explicitly via POST /api/v1/quotes/{id}/check-expiry"

      - from: QUOTED
        to: CANCELLED
        trigger: "POST /api/v1/quotes/{id}/cancel"
        actor: Customer
        preconditions:
          - "quote.status == QUOTED"
        side_effects:
          - "increment CharterQuote.version"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/v1/quotes/{id}/cancel"
        actor: Customer
        preconditions:
          - "quote.status == DRAFT"
        side_effects:
          - "increment CharterQuote.version"

  - entity: CharterOrder
    initial_state: PENDING_DEPOSIT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PENDING_DEPOSIT
        to: CONFIRMED
        trigger: "POST /api/v1/orders/{id}/pay-deposit"
        actor: Customer
        preconditions:
          - "order.status == PENDING_DEPOSIT"
          - "payload.amount_cents >= order.deposit_cents"
        side_effects:
          - "set deposit_paid_cents = payload.amount_cents"
          - "set deposit_paid_at = current_utc"
          - "increment CharterOrder.version"
          - "recalculate CustomerAccount.lifetime_revenue_cents (add deposit_paid_cents)"

      - from: CONFIRMED
        to: ASSIGNED
        trigger: "POST /api/v1/orders/{id}/assign"
        actor: DispatchManager
        preconditions:
          - "order.status == CONFIRMED"
          - "payload.vehicle_id exists and vehicle.status == AVAILABLE"
          - "vehicle.dot_inspection_expiry > trip_date"
          - "vehicle.insurance_expiry > trip_date"
          - "vehicle.seating_capacity >= order quote passenger_count"
          - "vehicle.ada_accessible == true if quote.ada_required"
          - "vehicle.odometer_miles < vehicle.maintenance_due_miles"
          - "payload.driver_id exists and driver.status == AVAILABLE"
          - "driver.cdl_class in {CLASS_A, CLASS_B} for motorcoach operation"
          - "driver has P endorsement"
          - "driver.hos_cycle_type compatible with trip estimated duration (check via calc_hos_feasibility)"
          - "driver.safety_score >= 50.0"
          - "if quote.requires_relief_driver: payload.relief_driver_id exists and relief driver satisfies same driver checks"
        side_effects:
          - "set assigned_vehicle_id = payload.vehicle_id"
          - "set assigned_driver_id = payload.driver_id"
          - "set relief_driver_id = payload.relief_driver_id if provided"
          - "set vehicle.status = ASSIGNED"
          - "set driver.status = ON_DUTY_NOT_DRIVING"
          - "if relief_driver_id: set relief_driver.status = ON_DUTY_NOT_DRIVING"
          - "increment CharterOrder.version"

      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /api/v1/orders/{id}/start-trip"
        actor: DispatchManager
        preconditions:
          - "order.status == ASSIGNED"
          - "current_utc >= quote.trip_date - 1 hour"
        side_effects:
          - "set vehicle.status = IN_TRIP"
          - "set driver.status = ON_TRIP"
          - "if relief_driver_id: set relief_driver.status = ON_TRIP"
          - "increment CharterOrder.version"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/v1/orders/{id}/complete-trip"
        actor: DispatchManager
        preconditions:
          - "order.status == IN_PROGRESS"
          - "payload.actual_miles > 0"
          - "payload.actual_hours > 0"
        side_effects:
          - "set actual_miles = payload.actual_miles"
          - "set actual_hours = payload.actual_hours"
          - "compute extra_hours = max(0, actual_hours - quote.estimated_hours)"
          - "compute extra_hours_charge_cents = round(extra_hours * hourly_rate_cents * 1.5)"
          - "compute fuel_surcharge_cents via calc_fuel_surcharge"
          - "compute final_subtotal_cents = quote.subtotal_cents + extra_hours_charge_cents + fuel_surcharge_cents"
          - "compute final_tax_cents via calc_tax (0 if customer.tax_exempt)"
          - "compute final_invoice_cents = final_subtotal_cents + final_tax_cents"
          - "compute balance_due_cents = final_invoice_cents - deposit_paid_cents"
          - "set completed_at = current_utc"
          - "set vehicle.status = AVAILABLE"
          - "set vehicle.odometer_miles += actual_miles"
          - "if vehicle.odometer_miles >= vehicle.maintenance_due_miles: set vehicle.status = IN_MAINTENANCE (cascade)"
          - "set driver.status = OFF_DUTY"
          - "set driver.last_rest_start = current_utc"
          - "if relief_driver_id: set relief_driver.status = OFF_DUTY, relief_driver.last_rest_start = current_utc"
          - "update driver.current_driving_hours_today, current_on_duty_hours_today, current_cycle_hours from TripLog entries"
          - "recalculate CustomerAccount.total_completed_trips += 1"
          - "recalculate CustomerAccount.lifetime_revenue_cents += final_invoice_cents"
          - "recalculate CustomerAccount.safety_audit_score"
          - "recalculate driver.safety_score based on any IncidentReports for this order"
          - "increment CharterOrder.version"

      - from: PENDING_DEPOSIT
        to: CANCELLED
        trigger: "POST /api/v1/orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "order.status == PENDING_DEPOSIT"
        side_effects:
          - "set cancelled_by = CUSTOMER"
          - "set cancellation_fee_cents = 0 (no deposit paid)"
          - "set refund_cents = 0"
          - "increment CharterOrder.version"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/v1/orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "order.status == CONFIRMED"
        side_effects:
          - "set cancelled_by = CUSTOMER"
          - "compute cancellation_fee_cents via calc_cancellation_fee (tier based on lead time)"
          - "compute refund_cents = deposit_paid_cents - cancellation_fee_cents"
          - "increment CharterOrder.version"

      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /api/v1/orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "order.status == ASSIGNED"
        side_effects:
          - "set cancelled_by = CUSTOMER"
          - "compute cancellation_fee_cents via calc_cancellation_fee"
          - "compute refund_cents = deposit_paid_cents - cancellation_fee_cents"
          - "set vehicle.status = AVAILABLE"
          - "set driver.status = AVAILABLE"
          - "if relief_driver_id: set relief_driver.status = AVAILABLE"
          - "increment CharterOrder.version"

      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /api/v1/orders/{id}/cancel"
        actor: DispatchManager
        preconditions:
          - "order.status == ASSIGNED"
          - "payload.reason is non-empty"
        side_effects:
          - "set cancelled_by = OPERATOR"
          - "set cancellation_reason = payload.reason"
          - "set cancellation_fee_cents = 0 (operator-initiated)"
          - "set refund_cents = deposit_paid_cents (full refund)"
          - "set vehicle.status = AVAILABLE"
          - "set driver.status = AVAILABLE"
          - "if relief_driver_id: set relief_driver.status = AVAILABLE"
          - "increment CharterOrder.version"

      - from: IN_PROGRESS
        to: DISPUTED
        trigger: "POST /api/v1/orders/{id}/dispute"
        actor: Customer
        preconditions:
          - "order.status == IN_PROGRESS"
          - "payload.reason is non-empty"
        side_effects:
          - "set cancellation_reason = payload.reason"
          - "increment CharterOrder.version"

      - from: DISPUTED
        to: COMPLETED
        trigger: "POST /api/v1/orders/{id}/complete-trip"
        actor: DispatchManager
        preconditions:
          - "order.status == DISPUTED"
          - "payload.actual_miles > 0"
          - "payload.actual_hours > 0"
        side_effects:
          - "same side_effects as IN_PROGRESS → COMPLETED"

      - from: DISPUTED
        to: CANCELLED
        trigger: "POST /api/v1/orders/{id}/cancel"
        actor: DispatchManager
        preconditions:
          - "order.status == DISPUTED"
        side_effects:
          - "set cancelled_by = OPERATOR"
          - "compute cancellation_fee_cents = 0"
          - "compute refund_cents = deposit_paid_cents"
          - "set vehicle.status = AVAILABLE"
          - "set driver.status = AVAILABLE"
          - "if relief_driver_id: set relief_driver.status = AVAILABLE"
          - "increment CharterOrder.version"

  - entity: Vehicle
    initial_state: AVAILABLE
    terminal_states: [OUT_OF_SERVICE]
    transitions:
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "POST /api/v1/orders/{id}/assign (side effect)"
        actor: system
        preconditions:
          - "vehicle.status == AVAILABLE"
        side_effects:
          - "increment Vehicle.version"

      - from: ASSIGNED
        to: IN_TRIP
        trigger: "POST /api/v1/orders/{id}/start-trip (side effect)"
        actor: system
        preconditions:
          - "vehicle.status == ASSIGNED"
        side_effects:
          - "increment Vehicle.version"

      - from: IN_TRIP
        to: AVAILABLE
        trigger: "POST /api/v1/orders/{id}/complete-trip (side effect)"
        actor: system
        preconditions:
          - "vehicle.status == IN_TRIP"
          - "vehicle.odometer_miles + actual_miles < vehicle.maintenance_due_miles"
        side_effects:
          - "increment Vehicle.version"

      - from: IN_TRIP
        to: IN_MAINTENANCE
        trigger: "POST /api/v1/orders/{id}/complete-trip (side effect, when odometer crosses maintenance threshold)"
        actor: system
        preconditions:
          - "vehicle.status == IN_TRIP"
          - "vehicle.odometer_miles + actual_miles >= vehicle.maintenance_due_miles"
        side_effects:
          - "create MaintenanceRecord with type=PREVENTIVE, status=SCHEDULED"
          - "increment Vehicle.version"

      - from: AVAILABLE
        to: IN_MAINTENANCE
        trigger: "POST /api/v1/vehicles/{id}/send-to-maintenance"
        actor: FleetManager
        preconditions:
          - "vehicle.status == AVAILABLE"
        side_effects:
          - "increment Vehicle.version"

      - from: IN_MAINTENANCE
        to: AVAILABLE
        trigger: "POST /api/v1/maintenance-records/{id}/complete (when maintenance_record.status transitions to COMPLETED)"
        actor: system
        preconditions:
          - "vehicle.status == IN_MAINTENANCE"
          - "maintenance_record.vehicle_id == vehicle.id"
          - "maintenance_record.status == COMPLETED"
        side_effects:
          - "set vehicle.last_inspection_date = maintenance_record.completed_date (if type=DOT_INSPECTION)"
          - "set vehicle.maintenance_due_miles = maintenance_record.next_due_miles"
          - "increment Vehicle.version"

      - from: IN_MAINTENANCE
        to: OUT_OF_SERVICE
        trigger: "POST /api/v1/vehicles/{id}/decommission"
        actor: FleetManager
        preconditions:
          - "vehicle.status == IN_MAINTENANCE"
        side_effects:
          - "increment Vehicle.version"

      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "POST /api/v1/vehicles/{id}/decommission"
        actor: FleetManager
        preconditions:
          - "vehicle.status == AVAILABLE"
        side_effects:
          - "increment Vehicle.version"

  - entity: Driver
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ON_DUTY_NOT_DRIVING
        trigger: "POST /api/v1/orders/{id}/assign (side effect)"
        actor: system
        preconditions:
          - "driver.status == AVAILABLE"
        side_effects:
          - "increment Driver.version"

      - from: ON_DUTY_NOT_DRIVING
        to: ON_TRIP
        trigger: "POST /api/v1/orders/{id}/start-trip (side effect)"
        actor: system
        preconditions:
          - "driver.status == ON_DUTY_NOT_DRIVING"
        side_effects:
          - "increment Driver.version"

      - from: ON_TRIP
        to: OFF_DUTY
        trigger: "POST /api/v1/orders/{id}/complete-trip (side effect)"
        actor: system
        preconditions:
          - "driver.status == ON_TRIP"
        side_effects:
          - "set driver.last_rest_start = current_utc"
          - "increment Driver.version"

      - from: OFF_DUTY
        to: AVAILABLE
        trigger: "system: driver has been OFF_DUTY for >= 10 consecutive hours"
        actor: system
        preconditions:
          - "driver.status == OFF_DUTY"
          - "current_utc >= driver.last_rest_start + 10 hours"
        side_effects:
          - "reset driver.current_driving_hours_today = 0.0"
          - "reset driver.current_on_duty_hours_today = 0.0"
          - "reset driver.consecutive_driving_minutes = 0"
          - "increment Driver.version"
        note: "Checked lazily on driver read or via POST /api/v1/drivers/{id}/check-rest"

      - from: AVAILABLE
        to: SUSPENDED
        trigger: "POST /api/v1/drivers/{id}/suspend"
        actor: SafetyOfficer
        preconditions:
          - "driver.status == AVAILABLE"
          - "payload.reason is non-empty"
        side_effects:
          - "increment Driver.version"

      - from: ON_DUTY_NOT_DRIVING
        to: SUSPENDED
        trigger: "POST /api/v1/drivers/{id}/suspend"
        actor: SafetyOfficer
        preconditions:
          - "driver.status == ON_DUTY_NOT_DRIVING"
          - "no CharterOrder with assigned_driver_id == driver.id and status in {ASSIGNED, IN_PROGRESS}"
        side_effects:
          - "increment Driver.version"

      - from: SUSPENDED
        to: AVAILABLE
        trigger: "POST /api/v1/drivers/{id}/reinstate"
        actor: SafetyOfficer
        preconditions:
          - "driver.status == SUSPENDED"
          - "driver.safety_score >= 30.0"
        side_effects:
          - "increment Driver.version"

  - entity: BreakdownEvent
    initial_state: REPORTED
    terminal_states: [REPLACED, RESOLVED_IN_PLACE, CANCELLED]
    transitions:
      - from: REPORTED
        to: DISPATCHED
        trigger: "POST /api/v1/breakdowns/{id}/dispatch"
        actor: DispatchManager
        preconditions:
          - "breakdown.status == REPORTED"
          - "payload.replacement_vehicle_id exists and replacement_vehicle.status == AVAILABLE"
          - "replacement_vehicle.seating_capacity >= order quote passenger_count"
          - "replacement_vehicle.dot_inspection_expiry > current_utc"
          - "replacement_vehicle.insurance_expiry > current_utc"
          - "replacement_vehicle.ada_accessible == true if quote.ada_required"
        side_effects:
          - "set replacement_vehicle_id = payload.replacement_vehicle_id"
          - "set replacement_vehicle.status = ASSIGNED"
          - "if payload.replacement_driver_id: set replacement_driver_id = payload.replacement_driver_id, replacement_driver.status = ON_DUTY_NOT_DRIVING"
          - "set original vehicle.status = IN_MAINTENANCE"
          - "create MaintenanceRecord for original vehicle with type=REPAIR, status=SCHEDULED"
          - "increment BreakdownEvent.version"

      - from: DISPATCHED
        to: REPLACEMENT_EN_ROUTE
        trigger: "POST /api/v1/breakdowns/{id}/en-route"
        actor: DispatchManager
        preconditions:
          - "breakdown.status == DISPATCHED"
        side_effects:
          - "increment BreakdownEvent.version"

      - from: REPLACEMENT_EN_ROUTE
        to: REPLACED
        trigger: "POST /api/v1/breakdowns/{id}/complete-replacement"
        actor: DispatchManager
        preconditions:
          - "breakdown.status == REPLACEMENT_EN_ROUTE"
          - "payload.delay_minutes >= 0"
        side_effects:
          - "set delay_minutes = payload.delay_minutes"
          - "compute customer_compensation_cents via calc_breakdown_compensation"
          - "update CharterOrder: set assigned_vehicle_id = replacement_vehicle_id"
          - "if replacement_driver_id: update CharterOrder.assigned_driver_id = replacement_driver_id"
          - "set replacement_vehicle.status = IN_TRIP"
          - "if replacement_driver_id: set replacement_driver.status = ON_TRIP"
          - "apply customer_compensation_cents as credit to CharterOrder.final_subtotal_cents (reduce)"
          - "increment BreakdownEvent.version"
          - "increment CharterOrder.version"

      - from: REPORTED
        to: RESOLVED_IN_PLACE
        trigger: "POST /api/v1/breakdowns/{id}/resolve-in-place"
        actor: DispatchManager
        preconditions:
          - "breakdown.status == REPORTED"
          - "payload.delay_minutes >= 0"
        side_effects:
          - "set delay_minutes = payload.delay_minutes"
          - "compute customer_compensation_cents via calc_breakdown_compensation"
          - "apply customer_compensation_cents as credit to CharterOrder.final_subtotal_cents"
          - "increment BreakdownEvent.version"
          - "increment CharterOrder.version"

      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /api/v1/breakdowns/{id}/cancel-dispatch"
        actor: DispatchManager
        preconditions:
          - "breakdown.status == DISPATCHED"
        side_effects:
          - "set replacement_vehicle.status = AVAILABLE"
          - "if replacement_driver_id: set replacement_driver.status = AVAILABLE"
          - "set original vehicle.status = IN_TRIP (revert)"
          - "increment BreakdownEvent.version"

  - entity: MaintenanceRecord
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /api/v1/maintenance-records/{id}/start"
        actor: FleetManager
        preconditions:
          - "maintenance_record.status == SCHEDULED"
          - "vehicle.status == IN_MAINTENANCE"
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/v1/maintenance-records/{id}/complete"
        actor: FleetManager
        preconditions:
          - "maintenance_record.status == IN_PROGRESS"
          - "payload.odometer_at_service >= vehicle.odometer_miles"
          - "if type == DOT_INSPECTION: payload.dot_inspection_passed is required"
        side_effects:
          - "set completed_date = current_utc"
          - "set next_due_miles = odometer_at_service + MAINTENANCE_INTERVAL_MILES"
          - "if type == DOT_INSPECTION and dot_inspection_passed: set vehicle.last_inspection_date = current_utc"
          - "trigger vehicle state transition IN_MAINTENANCE → AVAILABLE"
          - "recalculate CustomerAccount.safety_audit_score for all customers with orders on this vehicle"

      - from: SCHEDULED
        to: OVERDUE
        trigger: "system: current_utc > scheduled_date and status == SCHEDULED"
        actor: system
        preconditions:
          - "maintenance_record.status == SCHEDULED"
          - "current_utc > maintenance_record.scheduled_date"
        side_effects: []
        note: "Checked lazily on maintenance record read"

  - entity: InsuranceCertificate
    initial_state: REQUESTED
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: REQUESTED
        to: ISSUED
        trigger: "POST /api/v1/insurance-certificates/{id}/issue"
        actor: ComplianceOfficer
        preconditions:
          - "certificate.status == REQUESTED"
          - "order.status in {CONFIRMED, ASSIGNED, IN_PROGRESS}"
          - "vehicle.insurance_expiry > order quote.trip_date"
        side_effects:
          - "set issued_at = current_utc"
          - "set certificate_number = auto-generated"
          - "set expires_at = min(vehicle.insurance_expiry, quote.return_date)"
          - "increment InsuranceCertificate.version"

      - from: ISSUED
        to: EXPIRED
        trigger: "system: current_utc > certificate.expires_at and status == ISSUED"
        actor: system
        preconditions:
          - "certificate.status == ISSUED"
          - "current_utc > certificate.expires_at"
        side_effects:
          - "increment InsuranceCertificate.version"

      - from: ISSUED
        to: REVOKED
        trigger: "POST /api/v1/insurance-certificates/{id}/revoke"
        actor: ComplianceOfficer
        preconditions:
          - "certificate.status == ISSUED"
          - "payload.reason is non-empty"
        side_effects:
          - "increment InsuranceCertificate.version"

  - entity: SafetyAuditRequest
    initial_state: REQUESTED
    terminal_states: [COMPLETED, REJECTED]
    transitions:
      - from: REQUESTED
        to: IN_REVIEW
        trigger: "POST /api/v1/safety-audits/{id}/begin-review"
        actor: SafetyOfficer
        preconditions:
          - "audit.status == REQUESTED"
        side_effects:
          - "increment SafetyAuditRequest.version"

      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /api/v1/safety-audits/{id}/approve"
        actor: SafetyOfficer
        preconditions:
          - "audit.status == IN_REVIEW"
          - "payload.overall_rating in {SATISFACTORY, CONDITIONAL}"
        side_effects:
          - "set overall_rating = payload.overall_rating"
          - "set auditor_notes = payload.notes"
          - "set findings = payload.findings"
          - "increment SafetyAuditRequest.version"

      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /api/v1/safety-audits/{id}/reject"
        actor: SafetyOfficer
        preconditions:
          - "audit.status == IN_REVIEW"
        side_effects:
          - "set overall_rating = UNSATISFACTORY"
          - "set auditor_notes = payload.notes"
          - "set findings = payload.findings"
          - "if overall_rating == UNSATISFACTORY: set customer.credit_status = SUSPENDED"
          - "increment SafetyAuditRequest.version"
          - "increment CustomerAccount.version"

      - from: APPROVED
        to: COMPLETED
        trigger: "POST /api/v1/safety-audits/{id}/finalize"
        actor: SafetyOfficer
        preconditions:
          - "audit.status == APPROVED"
        side_effects:
          - "set completed_date = current_utc"
          - "increment SafetyAuditRequest.version"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: quote-accept-stale-quote
    parent_entity: CharterQuote
    write_endpoint: "POST /api/v1/quotes/{id}/accept"
    occ_field: "expected_quote_version"
    description: |
      Accepting a CharterQuote whose version has advanced since the client
      last observed it is rejected. This captures the case where a pricing
      recalculation or another acceptance has already changed the quote's
      terms and the current client's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: order-assign-stale-order
    parent_entity: CharterOrder
    write_endpoint: "POST /api/v1/orders/{id}/assign"
    occ_field: "expected_order_version"
    description: |
      Assigning a vehicle/driver to a CharterOrder whose version has advanced
      since the dispatch manager last observed it is rejected. This captures
      the case where another dispatcher has just assigned or modified the
      order and the current writer's view of the order is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: calc_quote_pricing
    trigger: "when POST /api/v1/quotes/{id}/price is called"
    algorithm: tiered_pricing
    formula: |
      # Select pricing variant first
      if estimated_miles / estimated_hours >= 55.0:
        variant = MILEAGE_PRIMARY
      else:
        variant = HOURLY_PRIMARY

      # Rate lookup by vehicle_class
      rate_table = VEHICLE_CLASS_RATES[vehicle_class_requested]
      mileage_rate_cents = rate_table.mileage_rate
      hourly_rate_cents = rate_table.hourly_rate

      # Base charge computation — variant determines primary vs secondary
      if variant == MILEAGE_PRIMARY:
        base_cents = estimated_miles * mileage_rate_cents
        hours_credit_cents = 0
        if estimated_hours > rate_table.included_hours:
          extra_billable_hours = estimated_hours - rate_table.included_hours
          hours_credit_cents = round(extra_billable_hours * hourly_rate_cents * 0.5)
        subtotal_before_fees = base_cents + hours_credit_cents
      else:  # HOURLY_PRIMARY
        base_cents = round(estimated_hours * hourly_rate_cents)
        miles_credit_cents = 0
        if estimated_miles > rate_table.included_miles:
          extra_billable_miles = estimated_miles - rate_table.included_miles
          miles_credit_cents = round(extra_billable_miles * mileage_rate_cents * 0.5)
        subtotal_before_fees = base_cents + miles_credit_cents

      # Overnight fee
      overnight_fee_cents = 0
      if requires_overnight:
        num_nights = ceil(estimated_hours / 24.0)
        overnight_fee_cents = num_nights * OVERNIGHT_RATE_PER_NIGHT_CENTS

      # Relief driver fee
      relief_driver_fee_cents = 0
      if requires_relief_driver:
        relief_driver_fee_cents = RELIEF_DRIVER_FLAT_CENTS

      # ADA surcharge
      ada_surcharge_cents = 0
      if ada_required:
        ada_surcharge_cents = round(subtotal_before_fees * ADA_SURCHARGE_PCT)

      # Subtotal
      subtotal_cents = subtotal_before_fees + overnight_fee_cents + relief_driver_fee_cents + ada_surcharge_cents

      # Tax
      if customer.tax_exempt:
        tax_cents = 0
      else:
        tax_cents = round(subtotal_cents * TAX_RATE)

      total_cents = subtotal_cents + tax_cents
    input_set: "CharterQuote fields + CustomerAccount.tax_exempt"
    constants:
      OVERNIGHT_RATE_PER_NIGHT_CENTS: 25000
      RELIEF_DRIVER_FLAT_CENTS: 45000
      ADA_SURCHARGE_PCT: 0.05
      TAX_RATE: 0.0825
      VEHICLE_CLASS_RATES: |
        STANDARD: { mileage_rate_cents: 250, hourly_rate_cents: 15000, included_hours: 5, included_miles: 100 }
        PREMIUM:  { mileage_rate_cents: 350, hourly_rate_cents: 20000, included_hours: 5, included_miles: 100 }
        EXECUTIVE: { mileage_rate_cents: 500, hourly_rate_cents: 30000, included_hours: 5, included_miles: 100 }
      MAINTENANCE_INTERVAL_MILES: 10000
    precision: "all amounts in integer cents; round_half_up at each intermediate step"
    variants:
      - name: MILEAGE_PRIMARY
        when: "estimated_miles / estimated_hours >= 55.0 (highway-dominated trip)"
        difference: "Primary charge is mileage-based; hours above included_hours are billed at 50% of hourly rate"
      - name: HOURLY_PRIMARY
        when: "estimated_miles / estimated_hours < 55.0 (local/city trip)"
        difference: "Primary charge is hourly-based; miles above included_miles are billed at 50% of mileage rate"

  - name: calc_deposit_tier
    trigger: "when POST /api/v1/quotes/{id}/accept is called (to set order.deposit_cents)"
    algorithm: threshold
    formula: |
      lead_time_hours = (quote.trip_date - current_utc) in hours

      if lead_time_hours >= 720:   # 30 days
        deposit_pct = 0.10
      elif lead_time_hours >= 336: # 14 days
        deposit_pct = 0.25
      elif lead_time_hours >= 168: # 7 days
        deposit_pct = 0.50
      elif lead_time_hours >= 48:  # 2 days
        deposit_pct = 0.75
      else:                        # less than 48 hours
        deposit_pct = 1.00

      deposit_cents = round(quote.total_cents * deposit_pct)
    input_set: "CharterQuote.trip_date, current_utc, CharterQuote.total_cents"
    constants:
      TIER_1_HOURS: 720
      TIER_2_HOURS: 336
      TIER_3_HOURS: 168
      TIER_4_HOURS: 48
    precision: "integer cents, round_half_up"

  - name: calc_cancellation_fee
    trigger: "when POST /api/v1/orders/{id}/cancel is called by Customer"
    algorithm: threshold
    formula: |
      lead_time_hours = (quote.trip_date - current_utc) in hours

      if lead_time_hours >= 720:    # 30+ days
        fee_pct = 0.0
      elif lead_time_hours >= 336:  # 14-29 days
        fee_pct = 0.10
      elif lead_time_hours >= 168:  # 7-13 days
        fee_pct = 0.25
      elif lead_time_hours >= 72:   # 3-6 days
        fee_pct = 0.50
      elif lead_time_hours >= 24:   # 1-2 days
        fee_pct = 0.75
      else:                         # less than 24 hours
        fee_pct = 1.00

      cancellation_fee_cents = round(order.deposit_paid_cents * fee_pct)
      refund_cents = order.deposit_paid_cents - cancellation_fee_cents
    input_set: "CharterOrder.deposit_paid_cents, quote.trip_date, current_utc"
    constants:
      CANCEL_TIER_1_HOURS: 720
      CANCEL_TIER_2_HOURS: 336
      CANCEL_TIER_3_HOURS: 168
      CANCEL_TIER_4_HOURS: 72
      CANCEL_TIER_5_HOURS: 24
    precision: "integer cents, round_half_up"

  - name: calc_fuel_surcharge
    trigger: "when POST /api/v1/orders/{id}/complete-trip is called"
    algorithm: tiered_pricing
    formula: |
      # Fuel surcharge based on actual miles driven
      if actual_miles <= 100:
        fuel_surcharge_cents = 0
      elif actual_miles <= 300:
        fuel_surcharge_cents = round(quote.subtotal_cents * 0.03)
      elif actual_miles <= 600:
        fuel_surcharge_cents = round(quote.subtotal_cents * 0.05)
      else:
        fuel_surcharge_cents = round(quote.subtotal_cents * 0.08)
    input_set: "CharterOrder.actual_miles, CharterQuote.subtotal_cents"
    constants:
      FUEL_TIER_1_MILES: 100
      FUEL_TIER_2_MILES: 300
      FUEL_TIER_3_MILES: 600
    precision: "integer cents, round_half_up"

  - name: calc_hos_feasibility
    trigger: "when POST /api/v1/orders/{id}/assign is called (as precondition check)"
    algorithm: constraint_propagation
    formula: |
      # Check if the driver can legally complete the trip under HOS rules
      trip_hours = quote.estimated_hours
      driver = Driver(payload.driver_id)

      # Rule 1: Maximum 11 hours driving after 10 consecutive hours off duty
      max_driving_hours = 11.0 - driver.current_driving_hours_today
      if trip_hours > max_driving_hours and not quote.requires_relief_driver:
        return false, "ERR_HOS_DRIVING_LIMIT"

      # Rule 2: Maximum 14-hour on-duty window
      max_on_duty_window = 14.0 - driver.current_on_duty_hours_today
      if trip_hours > max_on_duty_window and not quote.requires_relief_driver:
        return false, "ERR_HOS_ON_DUTY_WINDOW"

      # Rule 3: Cycle limit (70hr/8day or 60hr/7day)
      cycle_limit = 70.0 if driver.hos_cycle_type == CYCLE_70_8 else 60.0
      remaining_cycle = cycle_limit - driver.current_cycle_hours
      if trip_hours > remaining_cycle and not quote.requires_relief_driver:
        return false, "ERR_HOS_CYCLE_LIMIT"

      # Rule 4: Mandatory 30-minute break after 8 hours of driving
      if trip_hours > 8.0 and not quote.requires_relief_driver:
        # Trip must include at least one 30-minute break — this is a warning, not a blocker
        pass

      return true
    input_set: "Driver HOS fields, CharterQuote.estimated_hours, CharterQuote.requires_relief_driver"
    constants:
      MAX_DRIVING_HOURS: 11.0
      MAX_ON_DUTY_WINDOW_HOURS: 14.0
      CYCLE_70_8_LIMIT: 70.0
      CYCLE_60_7_LIMIT: 60.0
      MANDATORY_BREAK_AFTER_HOURS: 8.0
      MANDATORY_BREAK_MINUTES: 30
    precision: "1 decimal place for hours"

  - name: calc_safety_score
    trigger: "when an IncidentReport is created or when CharterOrder transitions to COMPLETED"
    algorithm: weighted_scoring
    formula: |
      # Driver safety score recalculation
      base_score = 100.0
      incidents = IncidentReport where driver_id == driver.id and order.status == COMPLETED

      for each incident:
        if incident.severity == MINOR:
          deduction = 2.0
        elif incident.severity == MODERATE:
          deduction = 5.0
        elif incident.severity == MAJOR:
          deduction = 12.0
        elif incident.severity == CRITICAL:
          deduction = 25.0

        if incident.incident_type == ACCIDENT:
          deduction = deduction * 1.5
        elif incident.incident_type == HOS_VIOLATION:
          deduction = deduction * 1.2

        base_score -= deduction

      driver.safety_score = max(0.0, base_score)
    input_set: "IncidentReport records for driver on COMPLETED orders"
    constants:
      BASE_SCORE: 100.0
      MINOR_DEDUCTION: 2.0
      MODERATE_DEDUCTION: 5.0
      MAJOR_DEDUCTION: 12.0
      CRITICAL_DEDUCTION: 25.0
      ACCIDENT_MULTIPLIER: 1.5
      HOS_VIOLATION_MULTIPLIER: 1.2
    precision: "1 decimal place"

  - name: calc_breakdown_compensation
    trigger: "when BreakdownEvent transitions to REPLACED or RESOLVED_IN_PLACE"
    algorithm: threshold
    formula: |
      # Compensation based on delay duration
      if delay_minutes < 60:
        compensation_cents = 0
      elif delay_minutes < 120:
        compensation_cents = round(quote.subtotal_cents * 0.05)
      elif delay_minutes < 240:
        compensation_cents = round(quote.subtotal_cents * 0.10)
      elif delay_minutes < 480:
        compensation_cents = round(quote.subtotal_cents * 0.20)
      else:
        compensation_cents = round(quote.subtotal_cents * 0.35)

      # Cap at deposit paid
      compensation_cents = min(compensation_cents, order.deposit_paid_cents)
    input_set: "BreakdownEvent.delay_minutes, CharterQuote.subtotal_cents, CharterOrder.deposit_paid_cents"
    constants:
      COMP_TIER_1_MIN: 60
      COMP_TIER_2_MIN: 120
      COMP_TIER_3_MIN: 240
      COMP_TIER_4_MIN: 480
    precision: "integer cents, round_half_up"

  - name: calc_customer_safety_audit_score
    trigger: "when CharterOrder transitions to COMPLETED or when MaintenanceRecord transitions to COMPLETED"
    algorithm: weighted_scoring
    formula: |
      # Customer-facing safety audit score (composite of fleet and driver performance)
      # Only considers orders associated with this customer

      completed_orders = CharterOrder where customer_id == customer.id and status == COMPLETED
      if len(completed_orders) == 0:
        customer.safety_audit_score = 100.0
        return

      total_weight = 0.0
      weighted_sum = 0.0

      for order in completed_orders:
        order_score = 100.0

        # Deduct for incidents on this order
        incidents = IncidentReport where order_id == order.id
        for incident in incidents:
          if incident.severity == CRITICAL:
            order_score -= 30.0
          elif incident.severity == MAJOR:
            order_score -= 15.0
          elif incident.severity == MODERATE:
            order_score -= 7.0
          elif incident.severity == MINOR:
            order_score -= 3.0

        # Deduct for breakdowns on this order
        breakdowns = BreakdownEvent where order_id == order.id and status in {REPLACED, RESOLVED_IN_PLACE}
        for bd in breakdowns:
          if bd.delay_minutes >= 240:
            order_score -= 10.0
          elif bd.delay_minutes >= 60:
            order_score -= 5.0

        # Weight by recency: more recent orders count more
        days_ago = (current_utc - order.completed_at) in days
        weight = max(0.1, 1.0 - (days_ago / 365.0))

        weighted_sum += order_score * weight
        total_weight += weight

      if total_weight > 0:
        customer.safety_audit_score = round(weighted_sum / total_weight, 1)
      else:
        customer.safety_audit_score = 100.0
    input_set: "CharterOrder + IncidentReport + BreakdownEvent for this customer"
    constants:
      CRITICAL_DEDUCTION: 30.0
      MAJOR_DEDUCTION: 15.0
      MODERATE_DEDUCTION: 7.0
      MINOR_DEDUCTION: 3.0
      BREAKDOWN_LONG_DELAY_DEDUCTION: 10.0
      BREAKDOWN_SHORT_DELAY_DEDUCTION: 5.0
      RECENCY_DECAY_DAYS: 365.0
    precision: "1 decimal place"

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and contains a valid role name; X-User-ID header present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role from X-User-Role is authorized for this endpoint per §1.5 roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path-template resource IDs reference existing entities (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target entity is in the correct state for the requested transition per §1.2 state machine"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_safety
    check: "Driver HOS limits not exceeded: driving hours, on-duty window, cycle limit per calc_hos_feasibility"
    error_id: ERR_HOS_VIOLATION
    http_status: 422
    applies_to: "POST /api/v1/orders/{id}/assign"

  - priority: 6
    category: business_safety
    check: "Vehicle DOT inspection is current: dot_inspection_expiry > trip_date"
    error_id: ERR_INSPECTION_EXPIRED
    http_status: 422
    applies_to: "POST /api/v1/orders/{id}/assign"

  - priority: 7
    category: business_safety
    check: "Vehicle insurance is current: insurance_expiry > trip_date"
    error_id: ERR_INSURANCE_EXPIRED
    http_status: 422
    applies_to: "POST /api/v1/orders/{id}/assign"

  - priority: 8
    category: business_safety
    check: "Driver safety_score >= minimum threshold (50.0) for assignment"
    error_id: ERR_DRIVER_SAFETY_SCORE_LOW
    http_status: 422
    applies_to: "POST /api/v1/orders/{id}/assign"

  - priority: 9
    category: business_constraint
    check: "Vehicle seating_capacity >= passenger_count from quote"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /api/v1/orders/{id}/assign"

  - priority: 10
    category: business_constraint
    check: "Vehicle ada_accessible == true when quote.ada_required == true"
    error_id: ERR_ADA_REQUIRED
    http_status: 422
    applies_to: "POST /api/v1/orders/{id}/assign"

  - priority: 11
    category: business_constraint
    check: "Vehicle odometer_miles < maintenance_due_miles (not overdue for maintenance)"
    error_id: ERR_MAINTENANCE_DUE
    http_status: 422
    applies_to: "POST /api/v1/orders/{id}/assign"

  - priority: 12
    category: business_constraint
    check: "Driver has required CDL class and P endorsement for motorcoach operation"
    error_id: ERR_CDL_INSUFFICIENT
    http_status: 422
    applies_to: "POST /api/v1/orders/{id}/assign"

  - priority: 13
    category: business_temporal
    check: "Quote has not expired: current_utc < quote_expiry"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 422
    applies_to: "POST /api/v1/quotes/{id}/accept"

  - priority: 14
    category: business_temporal
    check: "Trip start is within allowed window: current_utc >= trip_date - 1 hour"
    error_id: ERR_TRIP_NOT_YET
    http_status: 422
    applies_to: "POST /api/v1/orders/{id}/start-trip"

  - priority: 15
    category: business_referential
    check: "Deposit amount meets required minimum: payload.amount_cents >= order.deposit_cents"
    error_id: ERR_INSUFFICIENT_DEPOSIT
    http_status: 422
    applies_to: "POST /api/v1/orders/{id}/pay-deposit"

  - priority: 16
    category: business_fiscal
    check: "Customer credit_status != COLLECTIONS for quote pricing and acceptance"
    error_id: ERR_CREDIT_SUSPENDED
    http_status: 422
    applies_to: "POST /api/v1/quotes/{id}/price, POST /api/v1/quotes/{id}/accept"

  - priority: 17
    category: business_constraint
    check: "Request body fields pass type/format validation (required fields present, enums valid, numeric ranges valid)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 18
    category: business_constraint
    check: "OCC: expected_<parent>_version matches current entity version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/v1/quotes/{id}/accept, POST /api/v1/orders/{id}/assign"

  - priority: 19
    category: business_constraint
    check: "BreakdownEvent replacement vehicle satisfies same vehicle eligibility checks as original assignment"
    error_id: ERR_REPLACEMENT_INELIGIBLE
    http_status: 422
    applies_to: "POST /api/v1/breakdowns/{id}/dispatch"

  - priority: 20
    category: business_safety
    check: "Driver reinstatement requires safety_score >= 30.0"
    error_id: ERR_REINSTATEMENT_DENIED
    http_status: 422
    applies_to: "POST /api/v1/drivers/{id}/reinstate"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Customer Account ---
  - method: POST
    path: "/api/v1/customers"
    description: "Register a new customer account"
    roles: [QuoteAgent, PlatformAdmin]
    code: 201
    input: [company_name, contact_email, contact_phone, billing_address, "tax_exempt?"]
    output: CustomerAccount
    side_effects: []

  - method: GET
    path: "/api/v1/customers"
    description: "List customer accounts"
    roles: [QuoteAgent, DispatchManager, PlatformAdmin, SafetyOfficer]
    code: 200
    input: ["limit?", "offset?", "credit_status?"]
    output: CustomerAccount[]
    side_effects: []

  - method: GET
    path: "/api/v1/customers/{id}"
    description: "Get customer account details"
    roles: [QuoteAgent, DispatchManager, PlatformAdmin, Customer]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: []

  - method: PATCH
    path: "/api/v1/customers/{id}"
    description: "Update customer account fields"
    roles: [QuoteAgent, PlatformAdmin]
    code: 200
    input: ["company_name?", "contact_email?", "contact_phone?", "billing_address?", "tax_exempt?"]
    output: CustomerAccount
    side_effects: ["increment CustomerAccount.version"]

  # --- Vehicle ---
  - method: POST
    path: "/api/v1/vehicles"
    description: "Register a new vehicle in the fleet"
    roles: [FleetManager, PlatformAdmin]
    code: 201
    input: [unit_number, make_model, year, seating_capacity, "ada_accessible?", "vehicle_class?", dot_inspection_expiry, maintenance_due_miles, insurance_policy_number, insurance_expiry]
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/api/v1/vehicles"
    description: "List vehicles"
    roles: [FleetManager, DispatchManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?", "vehicle_class?"]
    output: Vehicle[]
    side_effects: []

  - method: GET
    path: "/api/v1/vehicles/{id}"
    description: "Get vehicle details"
    roles: [FleetManager, DispatchManager, PlatformAdmin]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: POST
    path: "/api/v1/vehicles/{id}/send-to-maintenance"
    description: "Send vehicle to maintenance"
    roles: [FleetManager]
    code: 200
    input: []
    output: Vehicle
    side_effects: ["vehicle.status: AVAILABLE → IN_MAINTENANCE", "increment Vehicle.version"]

  - method: POST
    path: "/api/v1/vehicles/{id}/decommission"
    description: "Decommission a vehicle"
    roles: [FleetManager]
    code: 200
    input: [reason]
    output: Vehicle
    side_effects: ["vehicle.status → OUT_OF_SERVICE", "increment Vehicle.version"]

  # --- Driver ---
  - method: POST
    path: "/api/v1/drivers"
    description: "Register a new driver"
    roles: [FleetManager, PlatformAdmin]
    code: 201
    input: [full_name, cdl_number, cdl_class, endorsements, hire_date, "hos_cycle_type?"]
    output: Driver
    side_effects: []

  - method: GET
    path: "/api/v1/drivers"
    description: "List drivers"
    roles: [FleetManager, DispatchManager, SafetyOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Driver[]
    side_effects: []

  - method: GET
    path: "/api/v1/drivers/{id}"
    description: "Get driver details"
    roles: [FleetManager, DispatchManager, SafetyOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Driver
    side_effects: ["lazy check: if driver.status == OFF_DUTY and current_utc >= last_rest_start + 10h, transition to AVAILABLE"]

  - method: POST
    path: "/api/v1/drivers/{id}/suspend"
    description: "Suspend a driver"
    roles: [SafetyOfficer]
    code: 200
    input: [reason]
    output: Driver
    side_effects: ["driver.status → SUSPENDED", "increment Driver.version"]

  - method: POST
    path: "/api/v1/drivers/{id}/reinstate"
    description: "Reinstate a suspended driver"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: Driver
    side_effects: ["driver.status: SUSPENDED → AVAILABLE", "increment Driver.version"]

  - method: POST
    path: "/api/v1/drivers/{id}/check-rest"
    description: "Manually trigger rest check for a driver"
    roles: [FleetManager, DispatchManager]
    code: 200
    input: []
    output: Driver
    side_effects: ["if driver.status == OFF_DUTY and current_utc >= last_rest_start + 10h: transition to AVAILABLE, reset HOS counters"]

  # --- Charter Quote ---
  - method: POST
    path: "/api/v1/quotes"
    description: "Create a new charter quote"
    roles: [QuoteAgent]
    code: 201
    input: [customer_id, trip_date, return_date, origin, destination, passenger_count, estimated_miles, estimated_hours, "ada_required?", "vehicle_class_requested?", "special_requests?"]
    output: CharterQuote
    side_effects: []

  - method: GET
    path: "/api/v1/quotes"
    description: "List charter quotes"
    roles: [QuoteAgent, DispatchManager, PlatformAdmin, Customer]
    code: 200
    input: ["limit?", "offset?", "status?", "customer_id?"]
    output: CharterQuote[]
    side_effects: []

  - method: GET
    path: "/api/v1/quotes/{id}"
    description: "Get quote details"
    roles: [QuoteAgent, DispatchManager, Customer]
    code: 200
    input: []
    output: CharterQuote
    side_effects: ["lazy check: if quote.status == QUOTED and current_utc >= quote_expiry, transition to EXPIRED"]

  - method: POST
    path: "/api/v1/quotes/{id}/price"
    description: "Compute pricing for a draft quote"
    roles: [QuoteAgent]
    code: 200
    input: []
    output: CharterQuote
    side_effects: ["quote.status: DRAFT → QUOTED", "run calc_quote_pricing", "set quote_expiry", "increment CharterQuote.version"]

  - method: POST
    path: "/api/v1/quotes/{id}/accept"
    description: "Accept a quoted price and create an order"
    roles: [Customer]
    code: 201
    input: [expected_quote_version]
    output: CharterOrder
    side_effects: ["quote.status: QUOTED → ACCEPTED", "create CharterOrder", "run calc_deposit_tier", "increment CharterQuote.version"]

  - method: POST
    path: "/api/v1/quotes/{id}/cancel"
    description: "Cancel a draft or quoted quote"
    roles: [Customer, QuoteAgent]
    code: 200
    input: []
    output: CharterQuote
    side_effects: ["quote.status → CANCELLED", "increment CharterQuote.version"]

  - method: POST
    path: "/api/v1/quotes/{id}/check-expiry"
    description: "Manually trigger quote expiry check"
    roles: [QuoteAgent, DispatchManager]
    code: 200
    input: []
    output: CharterQuote
    side_effects: ["if quote.status == QUOTED and current_utc >= quote_expiry: transition to EXPIRED"]

  # --- Charter Order ---
  - method: GET
    path: "/api/v1/orders"
    description: "List charter orders"
    roles: [QuoteAgent, DispatchManager, PlatformAdmin, Customer]
    code: 200
    input: ["limit?", "offset?", "status?", "customer_id?", "quote_id?", "assigned_vehicle_id?", "assigned_driver_id?", "relief_driver_id?"]
    output: CharterOrder[]
    side_effects: []

  - method: GET
    path: "/api/v1/orders/{id}"
    description: "Get order details"
    roles: [QuoteAgent, DispatchManager, PlatformAdmin, Customer]
    code: 200
    input: []
    output: CharterOrder
    side_effects: []

  - method: POST
    path: "/api/v1/orders/{id}/pay-deposit"
    description: "Pay deposit for a pending order"
    roles: [Customer]
    code: 200
    input: [amount_cents]
    output: CharterOrder
    side_effects: ["order.status: PENDING_DEPOSIT → CONFIRMED", "set deposit_paid_cents", "set deposit_paid_at", "increment CharterOrder.version"]

  - method: POST
    path: "/api/v1/orders/{id}/assign"
    description: "Assign vehicle and driver to a confirmed order"
    roles: [DispatchManager]
    code: 200
    input: [vehicle_id, driver_id, "relief_driver_id?", expected_order_version]
    output: CharterOrder
    side_effects: ["order.status: CONFIRMED → ASSIGNED", "set assigned_vehicle_id, assigned_driver_id, relief_driver_id", "vehicle.status → ASSIGNED", "driver.status → ON_DUTY_NOT_DRIVING", "increment CharterOrder.version"]

  - method: POST
    path: "/api/v1/orders/{id}/start-trip"
    description: "Start the trip"
    roles: [DispatchManager]
    code: 200
    input: []
    output: CharterOrder
    side_effects: ["order.status: ASSIGNED → IN_PROGRESS", "vehicle.status → IN_TRIP", "driver.status → ON_TRIP", "increment CharterOrder.version"]

  - method: POST
    path: "/api/v1/orders/{id}/complete-trip"
    description: "Complete a trip with actual miles/hours"
    roles: [DispatchManager]
    code: 200
    input: [actual_miles, actual_hours]
    output: CharterOrder
    side_effects: ["order.status → COMPLETED", "compute extra_hours, extra_hours_charge_cents, fuel_surcharge_cents, final_subtotal_cents, final_tax_cents, final_invoice_cents, balance_due_cents", "vehicle.status → AVAILABLE or IN_MAINTENANCE", "driver.status → OFF_DUTY", "update CustomerAccount derived fields", "recalculate safety scores", "increment CharterOrder.version"]

  - method: POST
    path: "/api/v1/orders/{id}/cancel"
    description: "Cancel an order"
    roles: [Customer, DispatchManager]
    code: 200
    input: ["reason?"]
    output: CharterOrder
    side_effects: ["order.status → CANCELLED", "compute cancellation_fee_cents and refund_cents via calc_cancellation_fee", "release vehicle/driver if assigned", "increment CharterOrder.version"]

  - method: POST
    path: "/api/v1/orders/{id}/dispute"
    description: "Dispute an in-progress order"
    roles: [Customer]
    code: 200
    input: [reason]
    output: CharterOrder
    side_effects: ["order.status: IN_PROGRESS → DISPUTED", "increment CharterOrder.version"]

  - method: POST
    path: "/api/v1/orders/{id}/itinerary-change"
    description: "Record an itinerary change for an active order"
    roles: [Customer, DispatchManager]
    code: 200
    input: [description, "new_estimated_hours?", "new_estimated_miles?"]
    output: CharterOrder
    side_effects: ["append to order.itinerary_changes", "if new_estimated_hours or new_estimated_miles: update quote.estimated_hours/estimated_miles for extra-hours computation", "increment CharterOrder.version"]

  # --- Trip Log ---
  - method: POST
    path: "/api/v1/orders/{id}/trip-logs"
    description: "Add a trip log entry"
    roles: [DispatchManager, PlatformAdmin]
    code: 201
    input: [driver_id, log_type, start_time, end_time, start_location, end_location, "miles_driven?"]
    output: TripLog
    side_effects: ["compute hos_violation flag", "update driver HOS counters"]

  - method: GET
    path: "/api/v1/orders/{id}/trip-logs"
    description: "List trip log entries for an order"
    roles: [DispatchManager, SafetyOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "driver_id?", "log_type?"]
    output: TripLog[]
    side_effects: []

  # --- Incident Report ---
  - method: POST
    path: "/api/v1/orders/{id}/incidents"
    description: "File an incident report"
    roles: [DispatchManager, SafetyOfficer, PlatformAdmin]
    code: 201
    input: [driver_id, vehicle_id, incident_type, severity, description, occurred_at, reported_by]
    output: IncidentReport
    side_effects: ["compute dot_recordable", "compute safety_score_impact", "recalculate driver.safety_score"]

  - method: GET
    path: "/api/v1/orders/{id}/incidents"
    description: "List incident reports for an order"
    roles: [DispatchManager, SafetyOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "incident_type?", "severity?"]
    output: IncidentReport[]
    side_effects: []

  - method: PATCH
    path: "/api/v1/incidents/{id}"
    description: "Update incident report resolution"
    roles: [SafetyOfficer]
    code: 200
    input: ["resolution_status?", "resolution_notes?"]
    output: IncidentReport
    side_effects: []

  # --- Maintenance Record ---
  - method: POST
    path: "/api/v1/vehicles/{id}/maintenance-records"
    description: "Create a maintenance record"
    roles: [FleetManager]
    code: 201
    input: [maintenance_type, scheduled_date, description, technician, cost_cents, odometer_at_service, "dot_inspection_passed?", "defects_found?"]
    output: MaintenanceRecord
    side_effects: []

  - method: GET
    path: "/api/v1/vehicles/{id}/maintenance-records"
    description: "List maintenance records for a vehicle"
    roles: [FleetManager, DispatchManager, SafetyOfficer]
    code: 200
    input: ["limit?", "offset?", "maintenance_type?", "status?"]
    output: MaintenanceRecord[]
    side_effects: []

  - method: POST
    path: "/api/v1/maintenance-records/{id}/start"
    description: "Start a scheduled maintenance"
    roles: [FleetManager]
    code: 200
    input: []
    output: MaintenanceRecord
    side_effects: ["maintenance_record.status: SCHEDULED → IN_PROGRESS"]

  - method: POST
    path: "/api/v1/maintenance-records/{id}/complete"
    description: "Complete a maintenance record"
    roles: [FleetManager]
    code: 200
    input: [odometer_at_service, "dot_inspection_passed?"]
    output: MaintenanceRecord
    side_effects: ["maintenance_record.status → COMPLETED", "set completed_date, next_due_miles", "vehicle transition IN_MAINTENANCE → AVAILABLE", "update vehicle.last_inspection_date if DOT_INSPECTION", "update vehicle.maintenance_due_miles"]

  # --- Breakdown Event ---
  - method: POST
    path: "/api/v1/orders/{id}/breakdowns"
    description: "Report a breakdown"
    roles: [DispatchManager, PlatformAdmin]
    code: 201
    input: [vehicle_id, driver_id, location, description]
    output: BreakdownEvent
    side_effects: []

  - method: GET
    path: "/api/v1/orders/{id}/breakdowns"
    description: "List breakdown events for an order"
    roles: [DispatchManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: BreakdownEvent[]
    side_effects: []

  - method: GET
    path: "/api/v1/breakdowns/{id}"
    description: "Get breakdown event details"
    roles: [DispatchManager, PlatformAdmin]
    code: 200
    input: []
    output: BreakdownEvent
    side_effects: []

  - method: POST
    path: "/api/v1/breakdowns/{id}/dispatch"
    description: "Dispatch replacement vehicle for breakdown"
    roles: [DispatchManager]
    code: 200
    input: [replacement_vehicle_id, "replacement_driver_id?"]
    output: BreakdownEvent
    side_effects: ["breakdown.status → DISPATCHED", "set replacement fields", "replacement_vehicle.status → ASSIGNED", "original_vehicle.status → IN_MAINTENANCE", "create MaintenanceRecord for original vehicle"]

  - method: POST
    path: "/api/v1/breakdowns/{id}/en-route"
    description: "Mark replacement as en route"
    roles: [DispatchManager]
    code: 200
    input: []
    output: BreakdownEvent
    side_effects: ["breakdown.status → REPLACEMENT_EN_ROUTE"]

  - method: POST
    path: "/api/v1/breakdowns/{id}/complete-replacement"
    description: "Complete vehicle replacement"
    roles: [DispatchManager]
    code: 200
    input: [delay_minutes]
    output: BreakdownEvent
    side_effects: ["breakdown.status → REPLACED", "compute customer_compensation_cents", "update CharterOrder assigned_vehicle_id", "replacement_vehicle.status → IN_TRIP", "apply compensation credit"]

  - method: POST
    path: "/api/v1/breakdowns/{id}/resolve-in-place"
    description: "Resolve breakdown without replacement"
    roles: [DispatchManager]
    code: 200
    input: [delay_minutes]
    output: BreakdownEvent
    side_effects: ["breakdown.status → RESOLVED_IN_PLACE", "compute customer_compensation_cents", "apply compensation credit"]

  - method: POST
    path: "/api/v1/breakdowns/{id}/cancel-dispatch"
    description: "Cancel a dispatched replacement"
    roles: [DispatchManager]
    code: 200
    input: []
    output: BreakdownEvent
    side_effects: ["breakdown.status → CANCELLED", "release replacement vehicle/driver", "revert original vehicle to IN_TRIP"]

  # --- Insurance Certificate ---
  - method: POST
    path: "/api/v1/insurance-certificates"
    description: "Request an insurance certificate"
    roles: [Customer, ComplianceOfficer]
    code: 201
    input: [order_id, venue_name, venue_address, certificate_type, coverage_amount_cents]
    output: InsuranceCertificate
    side_effects: []

  - method: GET
    path: "/api/v1/insurance-certificates"
    description: "List insurance certificates"
    roles: [ComplianceOfficer, PlatformAdmin, Customer]
    code: 200
    input: ["limit?", "offset?", "status?", "order_id?"]
    output: InsuranceCertificate[]
    side_effects: []

  - method: GET
    path: "/api/v1/insurance-certificates/{id}"
    description: "Get insurance certificate details"
    roles: [ComplianceOfficer, PlatformAdmin, Customer]
    code: 200
    input: []
    output: InsuranceCertificate
    side_effects: ["lazy check: if status == ISSUED and current_utc > expires_at, transition to EXPIRED"]

  - method: POST
    path: "/api/v1/insurance-certificates/{id}/issue"
    description: "Issue an insurance certificate"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: InsuranceCertificate
    side_effects: ["certificate.status → ISSUED", "set issued_at, certificate_number, expires_at"]

  - method: POST
    path: "/api/v1/insurance-certificates/{id}/revoke"
    description: "Revoke an insurance certificate"
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: InsuranceCertificate
    side_effects: ["certificate.status → REVOKED"]

  # --- Safety Audit ---
  - method: POST
    path: "/api/v1/safety-audits"
    description: "Request a safety audit"
    roles: [Customer, SafetyOfficer]
    code: 201
    input: [customer_id, audit_type, requested_date]
    output: SafetyAuditRequest
    side_effects: []

  - method: GET
    path: "/api/v1/safety-audits"
    description: "List safety audit requests"
    roles: [SafetyOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?", "customer_id?"]
    output: SafetyAuditRequest[]
    side_effects: []

  - method: GET
    path: "/api/v1/safety-audits/{id}"
    description: "Get safety audit details"
    roles: [SafetyOfficer, PlatformAdmin]
    code: 200
    input: []
    output: SafetyAuditRequest
    side_effects: []

  - method: POST
    path: "/api/v1/safety-audits/{id}/begin-review"
    description: "Begin reviewing a safety audit"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: SafetyAuditRequest
    side_effects: ["audit.status → IN_REVIEW"]

  - method: POST
    path: "/api/v1/safety-audits/{id}/approve"
    description: "Approve a safety audit"
    roles: [SafetyOfficer]
    code: 200
    input: [overall_rating, notes, "findings?"]
    output: SafetyAuditRequest
    side_effects: ["audit.status → APPROVED", "set overall_rating, auditor_notes, findings"]

  - method: POST
    path: "/api/v1/safety-audits/{id}/reject"
    description: "Reject a safety audit"
    roles: [SafetyOfficer]
    code: 200
    input: [notes, "findings?"]
    output: SafetyAuditRequest
    side_effects: ["audit.status → REJECTED", "set overall_rating = UNSATISFACTORY", "set customer.credit_status = SUSPENDED"]

  - method: POST
    path: "/api/v1/safety-audits/{id}/finalize"
    description: "Finalize an approved safety audit"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: SafetyAuditRequest
    side_effects: ["audit.status → COMPLETED", "set completed_date"]

  # --- Customer reverse-reachability for FK ---
  - method: GET
    path: "/api/v1/customers/{id}/quotes"
    description: "List quotes for a specific customer"
    roles: [QuoteAgent, DispatchManager, Customer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: CharterQuote[]
    side_effects: []

  - method: GET
    path: "/api/v1/customers/{id}/orders"
    description: "List orders for a specific customer"
    roles: [QuoteAgent, DispatchManager, Customer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: CharterOrder[]
    side_effects: []

  - method: GET
    path: "/api/v1/customers/{id}/safety-audits"
    description: "List safety audit requests for a customer"
    roles: [SafetyOfficer, Customer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: SafetyAuditRequest[]
    side_effects: []

  # --- FK reverse-reachability endpoints ---
  - method: GET
    path: "/api/v1/quotes/{id}/orders"
    description: "List orders created from a specific quote"
    roles: [QuoteAgent, DispatchManager, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: CharterOrder[]
    side_effects: []

  - method: GET
    path: "/api/v1/vehicles/{id}/orders"
    description: "List orders assigned to a specific vehicle"
    roles: [FleetManager, DispatchManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: CharterOrder[]
    side_effects: []

  - method: GET
    path: "/api/v1/drivers/{id}/orders"
    description: "List orders assigned to a specific driver (as primary or relief)"
    roles: [FleetManager, DispatchManager, SafetyOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: CharterOrder[]
    side_effects: []

  - method: GET
    path: "/api/v1/drivers/{id}/trip-logs"
    description: "List trip log entries for a specific driver"
    roles: [FleetManager, DispatchManager, SafetyOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: TripLog[]
    side_effects: []

  - method: GET
    path: "/api/v1/drivers/{id}/incidents"
    description: "List incident reports involving a specific driver"
    roles: [FleetManager, DispatchManager, SafetyOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: IncidentReport[]
    side_effects: []

  - method: GET
    path: "/api/v1/vehicles/{id}/incidents"
    description: "List incident reports involving a specific vehicle"
    roles: [FleetManager, DispatchManager, SafetyOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: IncidentReport[]
    side_effects: []

  - method: GET
    path: "/api/v1/vehicles/{id}/breakdowns"
    description: "List breakdown events involving a specific vehicle"
    roles: [FleetManager, DispatchManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: BreakdownEvent[]
    side_effects: []

  - method: GET
    path: "/api/v1/drivers/{id}/breakdowns"
    description: "List breakdown events reported by a specific driver"
    roles: [FleetManager, DispatchManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: BreakdownEvent[]
    side_effects: []

  - method: GET
    path: "/api/v1/breakdowns"
    description: "List all breakdown events (filtered)"
    roles: [DispatchManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?", "order_id?", "vehicle_id?", "driver_id?", "replacement_vehicle_id?", "replacement_driver_id?"]
    output: BreakdownEvent[]
    side_effects: []

  # --- Utility / Clock ---
  - method: POST
    path: "/api/v1/_clock/set_current_utc"
    description: "Set the server's logical clock. Default startup time is 2026-08-01T00:00:00Z. Before any set_current_utc call, the logical clock reads exactly this default."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["set logical clock to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-Role or X-User-ID header"

  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role is not authorized for this endpoint"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Entity is not in the required state for this operation"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Request body fails type/format/required-field validation"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match current entity version (OCC conflict)"

  - id: ERR_HOS_VIOLATION
    http: 422
    condition: "Driver hours-of-service limits would be exceeded by this assignment"

  - id: ERR_HOS_DRIVING_LIMIT
    http: 422
    condition: "Trip exceeds driver's remaining driving hours (11-hour limit)"

  - id: ERR_HOS_ON_DUTY_WINDOW
    http: 422
    condition: "Trip exceeds driver's remaining on-duty window (14-hour limit)"

  - id: ERR_HOS_CYCLE_LIMIT
    http: 422
    condition: "Trip exceeds driver's remaining cycle hours (70/8 or 60/7 limit)"

  - id: ERR_INSPECTION_EXPIRED
    http: 422
    condition: "Vehicle DOT inspection has expired or expires before trip date"

  - id: ERR_INSURANCE_EXPIRED
    http: 422
    condition: "Vehicle insurance has expired or expires before trip date"

  - id: ERR_DRIVER_SAFETY_SCORE_LOW
    http: 422
    condition: "Driver safety score below minimum threshold (50.0) for assignment"

  - id: ERR_CAPACITY_EXCEEDED
    http: 422
    condition: "Vehicle seating capacity is less than quote passenger count"

  - id: ERR_ADA_REQUIRED
    http: 422
    condition: "Quote requires ADA-accessible vehicle but assigned vehicle is not ADA-equipped"

  - id: ERR_MAINTENANCE_DUE
    http: 422
    condition: "Vehicle is due or overdue for preventive maintenance"

  - id: ERR_CDL_INSUFFICIENT
    http: 422
    condition: "Driver CDL class or endorsements insufficient for motorcoach operation"

  - id: ERR_QUOTE_EXPIRED
    http: 422
    condition: "Quote has passed its 72-hour expiration"

  - id: ERR_TRIP_NOT_YET
    http: 422
    condition: "Trip cannot be started more than 1 hour before scheduled departure"

  - id: ERR_INSUFFICIENT_DEPOSIT
    http: 422
    condition: "Deposit amount is less than the required deposit"

  - id: ERR_CREDIT_SUSPENDED
    http: 422
    condition: "Customer credit status is COLLECTIONS; new quotes/acceptance blocked"

  - id: ERR_REPLACEMENT_INELIGIBLE
    http: 422
    condition: "Replacement vehicle does not meet eligibility requirements (capacity, inspection, insurance, ADA)"

  - id: ERR_REINSTATEMENT_DENIED
    http: 422
    condition: "Driver safety score too low for reinstatement (< 30.0)"

