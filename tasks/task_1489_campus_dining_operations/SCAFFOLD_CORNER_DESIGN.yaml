        grounds: ["errors[ERR_FORECAST_LOCKED_PERIOD]", state_machines.ProductionForecast.DRAFT_to_LOCKED]
        distinguishing_aspect: "Once the period is FORECAST_LOCKED, both forecast creation and forecast lock are rejected with the domain-specific ERR_FORECAST_LOCKED_PERIOD (OCC passes; the state gate fires)."
        test_recipe:
          setup: ["Period in FORECAST_LOCKED (one LOCKED forecast present); current period version observed via GET"]
          setup_api_calls:
            - { call: "POST /dining-halls", payload: { name: "Hall SM9", service_model: "BOARD", dining_capacity: 500, catering_kitchen_capacity: 200 }, as: DiningAdmin, captures: { h: $.data.id } }
