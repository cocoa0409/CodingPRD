            - "${linkB1_cfg} == ${cfgB1_id}"
            - "${cfgB2_status} == ACTIVE"
            - "${linkB2_score} == 0.9200"
            - "${linkB2_status} == PENDING_REVIEW"
            - "${linkB2_cfg} == ${cfgB2_id}"
            - "MatchThresholdConfig.${cfgB1_id}.status == RETIRED and MatchLink.${linkB1_cfg} is unchanged (already-scored links are never re-scored)"
            - "MatchThresholdConfig.${cfgB2_id}.scored_link_count == 1"
      - name: quality_sample_ending_exactly_at_window_start_is_excluded_leaving_scorecard_ungraded
        grounds:
          - calculations.participant_quality_score
          - calculations.participant_quality_score.constants.QUALITY_WINDOW_DAYS
          - endpoints.GET_hie_participants_id_scorecard
          - entities.Participant.fields.quality_grade
        distinguishing_aspect: |
          A different boundary metric on a different endpoint: the temporal lower edge of the 90-day
          quality window, read through GET /hie/participants/{id}/scorecard. With the logical clock at
          2026-08-01T00:00:00Z the window opens at 2026-05-03T00:00:00Z EXCLUSIVE, so a sample whose
          period_end is exactly 2026-05-03T00:00:00Z contributes nothing and the scorecard must report
          samples_counted 0 with quality_score null and grade UNGRADED even though the feed is MONITORED
          with sample_count 1. A sample ending exactly one second later, 2026-05-03T00:00:01Z, does
          qualify. This is an empty-collection edge, not a numeric-threshold edge.
        test_recipe:
          setup:
            - "One participant at CONFORMANCE_TESTING with a single ADT data feed."
            - "Sample S1 covers [2026-04-03T00:00:00Z, 2026-05-03T00:00:00Z): 5000 received, 100 rejected, 150 missing, 40 duplicates, p95 220 seconds. It is the first accepted sample, so the feed moves PROVISIONING -> MONITORED and sample_count becomes 1, but its period_end sits exactly on the exclusive window edge."
          setup_api_calls:
            - call: "POST /hie/participants"
              payload: { legal_name: "Windward Point Hospital", org_type: "HOSPITAL", declared_annual_patient_volume: 72000, primary_contact_email: "hie@windwardpoint.example" }
              as: HieAdmin
              captures: { pW_id: $.data.id, pW_v1: $.data.version }
