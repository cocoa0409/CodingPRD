  # ===================================================================================
  # From Table 2 (State Machines)
  # ===================================================================================
  - section: state_machines
    instances:

      - name: cycle_draft_to_open_requires_a_discipline_and_a_feasible_cohort
        claim_type: precondition_enforcement
        grounds: ["state_machines.Cycle[DRAFT -> OPEN]", "errors[ERR_COHORT_MINIMUMS_EXCEED_TARGET]", "endpoints[POST /cycles/{id}/stage]"]
        distinguishing_aspect: "The DRAFT -> OPEN edge carries TWO preconditions that P63 folds into one error: at least one Discipline must exist, and the disciplines' cohort_min_slots must sum to no more than cohort_target_size. Both are falsified on the same edge from the same DRAFT cycle, and the second is a SUM over children - a single discipline can be individually feasible while the set is not."
        test_recipe:
          setup: ["A DRAFT cycle with cohort_target_size 10 and no disciplines yet."]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
          trigger:
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "with zero disciplines the edge is refused: 409 ERR_COHORT_MINIMUMS_EXCEED_TARGET, and GET /cycles/${cyc} still shows status 'DRAFT' with version unchanged"
            - "adding SCULPT (cohort_min_slots 6, cohort_max_slots 6) then re-triggering the stage call succeeds: 200 with status 'OPEN', because 6 <= 10"
            - "the sum, not the individual value, is the constraint: on a fresh DRAFT cycle with the same target 10, two disciplines of cohort_min_slots 6 and 5 are each individually feasible but sum to 11, so the OPEN edge returns 409 ERR_COHORT_MINIMUMS_EXCEED_TARGET"
            - "the boundary is inclusive: cohort_min_slots 6 and 4 sum to exactly 10 and the cycle opens"
            - "the successful edge runs its declared side effect and nothing else: Cycle.version increments by exactly 1 and no ledger field moves (stipend_committed_cents stays 0)"
            - "the precondition is only checked on this edge: it is not re-evaluated on OPEN -> SCREENING, so a cycle that opened at the boundary still advances after PATCH is no longer permitted"

      - name: residency_starts_scheduled_and_training_pending_on_both_axes
        claim_type: initial_state
        grounds: ["state_machines.Residency.status.initial_state", "state_machines.Residency.compliance_status.initial_state", "endpoints[POST /residencies]"]
        distinguishing_aspect: "Residency carries TWO state fields, each with its own initial_state, and a freshly created residency must land on the pair (SCHEDULED, TRAINING_PENDING) simultaneously - plus stipend_basis PROVISIONAL and null session dates, because the schedule call has not run yet."
        test_recipe:
          setup: ["An OPEN cycle with one discipline (required_capability_tags ['WELDING']) and one domestic applicant."]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
