            - "unknown role ShelfStocker: HTTP 403 with data.error_id == 'ERR_UNAUTHORIZED'"
            - "clerk registering a store: HTTP 403 with data.error_id == 'ERR_UNAUTHORIZED'"
            - "clerk verifying shrink: HTTP 403 with data.error_id == 'ERR_UNAUTHORIZED' and ShrinkEvent.${shrink_id}.status still 'RECORDED'"
            - "manager opening an audit: HTTP 403 with data.error_id == 'ERR_UNAUTHORIZED'"
            - "auditor pricing the lot: HTTP 403 with data.error_id == 'ERR_UNAUTHORIZED' and DateCodeLot.${lot_id}.version still 1"
            - "admin confirming the pickup: HTTP 403 with data.error_id == 'ERR_UNAUTHORIZED' and DonationPickup.${pickup_id}.logistics_status still 'SCHEDULED'"
            - "partner creating a lot: HTTP 403 with data.error_id == 'ERR_UNAUTHORIZED'"
            - "GET /fresh/stores?limit=10&offset=0 returns total_count == 1 and GET /fresh/compliance-audits?department_id=${dept_id}&limit=10&offset=0 returns total_count == 0"
            - "GET /fresh/lots?item_id=${item_id}&limit=10&offset=0 returns total_count == 1 and DateCodeLot.${lot_id}.quantity_on_hand == 24"

      - name: shared_operations_accept_either_declared_role
        claim_type: exclusive_and_shared_operations_permitted
        grounds:
          - rbac[DepartmentManager.shared_operations]
          - rbac[FreshClerk.shared_operations]
