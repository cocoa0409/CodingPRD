              as: BrandManager
            - call: "POST /messaging/accounts/${acct}/consent_records"
              payload: { brand_id: "${brand}", phone_number: "+15550000042", evidence_url: "https://e/42", evidence_text: "pos", captured_at: "2026-09-01T00:00:00Z", consent_method: "POINT_OF_SALE" }
              as: BrandManager
            - call: "POST /messaging/accounts/${acct}/consent_records"
              payload: { brand_id: "${brand}", phone_number: "+15550000043", evidence_url: "https://e/43", evidence_text: "pos", captured_at: "2026-09-01T00:00:00Z", consent_method: "POINT_OF_SALE" }
              as: BrandManager
            - call: "POST /messaging/accounts/${acct}/consent_records"
              payload: { brand_id: "${brand}", phone_number: "+15550000044", evidence_url: "https://e/44", evidence_text: "pos", captured_at: "2026-09-01T00:00:00Z", consent_method: "POINT_OF_SALE" }
              as: BrandManager
