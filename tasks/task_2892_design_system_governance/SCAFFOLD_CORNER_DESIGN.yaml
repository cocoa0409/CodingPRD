            - "${e_critic_at_eng} == ERR_REVIEW_STAGE_MISMATCH with HTTP status 409"
            - "${e_eng_at_critique} == ERR_REVIEW_STAGE_MISMATCH with HTTP status 409"
            - "${state_after} == ENGINEERING_REVIEW"
            - "${first_stage} == DESIGN_CRITIQUE and ${first_verdict} == APPROVE and the list still holds exactly 1 row (total_count == 1)"

      - name: one_user_id_cannot_hold_both_review_gates_on_one_proposal
        claim_type: Segregation of duties
        grounds:
          - validations[priority=11]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - complexity_profile.role_model
          - entities.ContributionProposal.fields.design_critique_reviewer_user_id
        distinguishing_aspect: |
          The declared role model is segregation of duties on X-User-ID, not on role: user dual-1
          may legitimately wear the DesignCritiqueReviewer hat and then the EngineeringReviewer
          hat, and the stage matches the gate so priority 10 passes - yet the second review must
          be refused with ERR_SEGREGATION_OF_DUTIES at 403 purely because
          design_critique_reviewer_user_id already records dual-1. A different user id at the same
          gate must then succeed, proving the block is per-user and not per-proposal.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; TokenSet `core`; Component `badge`"
            - "an ENHANCEMENT proposal whose design critique was approved by user dual-1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
