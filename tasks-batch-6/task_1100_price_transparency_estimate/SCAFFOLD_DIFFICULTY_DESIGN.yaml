scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dv_estimate_vs_final_patient_responsibility
        grounds:
          - calculations.estimate_patient_responsibility
          - entities.Estimate.fields.responsibility_basis
          - state_machines.Estimate.ACCEPTED_to_SETTLED
        distinguishing_aspect: "On the Estimate domain: the ESTIMATE variant priced at issue with fresh accumulators (dm=0, om=0) yields patient_responsibility_cents=122500, while the FINAL variant at settlement with accumulators dm=100000/om=300000 yields 42500 for identical allowed_amount_cents=200000."
        test_recipe:
          setup:
            - "Benefit plan D=100000, OOP_MAX=500000, coinsurance 0.20, copay 2500."
            - "Patient fresh (dm=0, om=0); one ACTIVE FEE_SCHEDULE contract; procedure gross 300000 with a FLAT rate 200000."
            - "Estimate GFE_INSURED with one line issued at dm=0 (ESTIMATE=122500), then accepted; an accumulation-adjustment moves dm to 100000 and om to 300000; appointment scheduled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /benefit-plans"
              payload: { payer_name: "Acme Health", plan_year: 2026, individual_deductible_cents: 100000, individual_oop_max_cents: 500000, coinsurance_rate: 0.20, copay_cents: 2500, in_network: true }
              as: PayerAnalyst
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { name: "Pat A", member_id: "M-A", benefit_plan_id: "${plan_id}" }
              as: ProviderStaff
              captures: { pat_id: $.data.id, pat_v0: $.data.version }
            - call: "POST /payer-contracts"
              payload: { payer_name: "Acme Health", payer_type: "COMMERCIAL", methodology: "FEE_SCHEDULE", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: PayerAnalyst
              captures: { contract_id: $.data.id, con_v0: $.data.version }
            - call: "POST /payer-contracts/${contract_id}/activate"
              payload: {}
              as: PayerAnalyst
              captures: { con_v1: $.data.version }
            - call: "POST /procedures"
              payload: { code_system: "CPT", code: "70450", description: "CT Head w/o contrast", setting: "OUTPATIENT", is_shoppable: true, requires_prior_auth: false, gross_charge_cents: 300000 }
              as: ProviderStaff
              captures: { proc_id: $.data.id }
            - call: "POST /negotiated-rates"
              payload: { contract_id: "${contract_id}", procedure_id: "${proc_id}", rate_type: "FLAT", flat_amount_cents: 200000, expected_contract_version: "${con_v1}" }
              as: PayerAnalyst
              captures: { rate_id: $.data.id }
            - call: "POST /estimates"
              payload: { patient_id: "${pat_id}", estimate_type: "GFE_INSURED", contract_id: "${contract_id}", expected_patient_version: "${pat_v0}" }
              as: ProviderStaff
              captures: { est_id: $.data.id }
            - call: "POST /estimates/${est_id}/lines"
              payload: { procedure_id: "${proc_id}" }
              as: ProviderStaff
              captures: { line_id: $.data.id }
            - call: "POST /estimates/${est_id}/issue"
              payload: {}
              as: ProviderStaff
              captures: { issue_pr: $.data.patient_responsibility_cents }
            - call: "POST /estimates/${est_id}/accept"
              payload: {}
              as: PatientUser
              as_user_id: "${pat_id}"
            - call: "POST /patients/${pat_id}/accumulation-adjustments"
              payload: { deductible_delta_cents: 100000, oop_delta_cents: 300000, source: "EOB" }
              as: PayerAnalyst
            - call: "POST /providers"
              payload: { name: "Dr Ray", npi: "1000000001", specialty: "Radiology" }
              as: ProviderStaff
              captures: { prov_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "CT-1", room_type: "IMAGING" }
              as: ProviderStaff
              captures: { room_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", estimate_id: "${est_id}", provider_id: "${prov_id}", room_id: "${room_id}", scheduled_start: "2026-06-02T10:00:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: ProviderStaff
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /appointments/${appt_id}/complete"
              payload: {}
              as: ProviderStaff
          assert:
            - "issue_pr == 122500"
            - "Estimate.${est_id}.responsibility_basis == FINAL"
            - "Estimate.${est_id}.patient_responsibility_cents == 42500"
            - "Estimate.${est_id}.plan_paid_cents == 157500"
            - "Estimate.${est_id}.status == SETTLED"

      - name: dv_shoppable_median_vs_min
        grounds:
          - calculations.shoppable_comparison_price
          - endpoints["GET /procedures/{id}/comparison"]
        distinguishing_aspect: "On the Procedure domain: for the same three negotiated allowed amounts {100000,150000,250000} the MEDIAN variant returns median_allowed_cents=150000 while the MIN variant returns min_allowed_cents=100000 — two valid comparison prices, different results, on a different entity than dv_estimate_vs_final."
        test_recipe:
          setup:
            - "One procedure gross 300000; three ACTIVE contracts each with a FLAT rate for that procedure of 100000, 150000, 250000."
          setup_api_calls:
            - call: "POST /procedures"
              payload: { code_system: "CPT", code: "70450", description: "CT Head", setting: "OUTPATIENT", gross_charge_cents: 300000 }
              as: ProviderStaff
              captures: { proc_id: $.data.id }
            - call: "POST /payer-contracts"
              payload: { payer_name: "Payer1", payer_type: "COMMERCIAL", methodology: "FEE_SCHEDULE", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: PayerAnalyst
              captures: { c1: $.data.id }
            - call: "POST /payer-contracts/${c1}/activate"
              payload: {}
              as: PayerAnalyst
              captures: { c1v: $.data.version }
            - call: "POST /negotiated-rates"
              payload: { contract_id: "${c1}", procedure_id: "${proc_id}", rate_type: "FLAT", flat_amount_cents: 100000, expected_contract_version: "${c1v}" }
              as: PayerAnalyst
            - call: "POST /payer-contracts"
              payload: { payer_name: "Payer2", payer_type: "COMMERCIAL", methodology: "FEE_SCHEDULE", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: PayerAnalyst
              captures: { c2: $.data.id }
            - call: "POST /payer-contracts/${c2}/activate"
              payload: {}
              as: PayerAnalyst
              captures: { c2v: $.data.version }
            - call: "POST /negotiated-rates"
              payload: { contract_id: "${c2}", procedure_id: "${proc_id}", rate_type: "FLAT", flat_amount_cents: 150000, expected_contract_version: "${c2v}" }
              as: PayerAnalyst
            - call: "POST /payer-contracts"
              payload: { payer_name: "Payer3", payer_type: "COMMERCIAL", methodology: "FEE_SCHEDULE", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: PayerAnalyst
              captures: { c3: $.data.id }
            - call: "POST /payer-contracts/${c3}/activate"
              payload: {}
              as: PayerAnalyst
              captures: { c3v: $.data.version }
            - call: "POST /negotiated-rates"
              payload: { contract_id: "${c3}", procedure_id: "${proc_id}", rate_type: "FLAT", flat_amount_cents: 250000, expected_contract_version: "${c3v}" }
              as: PayerAnalyst
          trigger:
            - call: "GET /procedures/${proc_id}/comparison"
              payload: {}
              as: PatientUser
          assert:
            - "response.data.sample_count == 3"
            - "response.data.median_allowed_cents == 150000"
            - "response.data.min_allowed_cents == 100000"
            - "response.data.self_pay_price_cents == 195000"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cf_estimate_nonlinear_oop_cap
        grounds:
          - calculations.estimate_patient_responsibility
          - entities.BenefitPlan.fields.individual_oop_max_cents
          - entities.Patient.fields.oop_met_cents
        distinguishing_aspect: "Mode (a): the >=3-input nested-min/max formula binds on the outer min(pre_oop=42500, remaining_oop=20000) so patient_responsibility_cents=20000 (not 42500) — a non-linear interaction of allowed, deductible_met, oop_met, coinsurance_rate, copay."
        test_recipe:
          setup:
            - "Plan D=100000, OOP_MAX=500000, coins 0.20, copay 2500; patient dm=100000 (met), om=480000 (near cap)."
            - "One ACTIVE contract, procedure gross 300000, FLAT rate 200000; single-line GFE_INSURED estimate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /benefit-plans"
              payload: { payer_name: "Acme Health", plan_year: 2026, individual_deductible_cents: 100000, individual_oop_max_cents: 500000, coinsurance_rate: 0.20, copay_cents: 2500, in_network: true }
              as: PayerAnalyst
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { name: "Pat B", member_id: "M-B", benefit_plan_id: "${plan_id}" }
              as: ProviderStaff
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/accumulation-adjustments"
              payload: { deductible_delta_cents: 100000, oop_delta_cents: 480000, source: "EOB" }
              as: PayerAnalyst
              captures: { pat_v1: $.data.version }
            - call: "POST /payer-contracts"
              payload: { payer_name: "Acme Health", payer_type: "COMMERCIAL", methodology: "FEE_SCHEDULE", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: PayerAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /payer-contracts/${contract_id}/activate"
              payload: {}
              as: PayerAnalyst
              captures: { con_v1: $.data.version }
            - call: "POST /procedures"
              payload: { code_system: "CPT", code: "70450", description: "CT Head", setting: "OUTPATIENT", gross_charge_cents: 300000 }
              as: ProviderStaff
              captures: { proc_id: $.data.id }
            - call: "POST /negotiated-rates"
              payload: { contract_id: "${contract_id}", procedure_id: "${proc_id}", rate_type: "FLAT", flat_amount_cents: 200000, expected_contract_version: "${con_v1}" }
              as: PayerAnalyst
            - call: "POST /estimates"
              payload: { patient_id: "${pat_id}", estimate_type: "GFE_INSURED", contract_id: "${contract_id}", expected_patient_version: "${pat_v1}" }
              as: ProviderStaff
              captures: { est_id: $.data.id }
            - call: "POST /estimates/${est_id}/lines"
              payload: { procedure_id: "${proc_id}" }
              as: ProviderStaff
          trigger:
            - call: "POST /estimates/${est_id}/issue"
              payload: {}
              as: ProviderStaff
          assert:
            - "Estimate.${est_id}.deductible_applied_cents == 0"
            - "Estimate.${est_id}.coinsurance_cents == 40000"
            - "Estimate.${est_id}.patient_responsibility_cents == 20000"
            - "Estimate.${est_id}.plan_paid_cents == 180000"

      - name: cf_line_rounding_order
        grounds:
          - calculations.estimate_line_aggregation
          - entities.EstimateLine.fields.coinsurance_cents
          - entities.EstimateLine.fields.line_number
        distinguishing_aspect: "Mode (b): with two lines of allowed 100003 each and deductible already met, per-line rounding (round_half_up(100003*0.20)=20001 each) sums to coinsurance_cents=40002, whereas sum-then-round (round_half_up(200006*0.20)=40001) would give 40001 — the scaffold pins per-line rounding."
        test_recipe:
          setup:
            - "Plan D=100000, OOP_MAX=500000, coins 0.20, copay 2500; patient dm=100000 (met), om=0."
            - "One ACTIVE contract; two procedures each with a FLAT rate of 100003; a two-line GFE_INSURED estimate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /benefit-plans"
              payload: { payer_name: "Acme Health", plan_year: 2026, individual_deductible_cents: 100000, individual_oop_max_cents: 500000, coinsurance_rate: 0.20, copay_cents: 2500, in_network: true }
              as: PayerAnalyst
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { name: "Pat C", member_id: "M-C", benefit_plan_id: "${plan_id}" }
              as: ProviderStaff
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/accumulation-adjustments"
              payload: { deductible_delta_cents: 100000, oop_delta_cents: 0, source: "EOB" }
              as: PayerAnalyst
              captures: { pat_v1: $.data.version }
            - call: "POST /payer-contracts"
              payload: { payer_name: "Acme Health", payer_type: "COMMERCIAL", methodology: "FEE_SCHEDULE", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: PayerAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /payer-contracts/${contract_id}/activate"
              payload: {}
              as: PayerAnalyst
              captures: { con_v1: $.data.version }
            - call: "POST /procedures"
              payload: { code_system: "CPT", code: "70450", description: "CT Head", setting: "OUTPATIENT", gross_charge_cents: 300000 }
              as: ProviderStaff
              captures: { proc_a: $.data.id }
            - call: "POST /negotiated-rates"
              payload: { contract_id: "${contract_id}", procedure_id: "${proc_a}", rate_type: "FLAT", flat_amount_cents: 100003, expected_contract_version: "${con_v1}" }
              as: PayerAnalyst
              captures: { con_v2: $.data.version }
            - call: "POST /procedures"
              payload: { code_system: "CPT", code: "74177", description: "CT Abdomen", setting: "OUTPATIENT", gross_charge_cents: 300000 }
              as: ProviderStaff
              captures: { proc_b: $.data.id }
            - call: "POST /negotiated-rates"
              payload: { contract_id: "${contract_id}", procedure_id: "${proc_b}", rate_type: "FLAT", flat_amount_cents: 100003, expected_contract_version: "${con_v2}" }
              as: PayerAnalyst
            - call: "POST /estimates"
              payload: { patient_id: "${pat_id}", estimate_type: "GFE_INSURED", contract_id: "${contract_id}", expected_patient_version: "${pat_v1}" }
              as: ProviderStaff
              captures: { est_id: $.data.id }
            - call: "POST /estimates/${est_id}/lines"
              payload: { procedure_id: "${proc_a}" }
              as: ProviderStaff
            - call: "POST /estimates/${est_id}/lines"
              payload: { procedure_id: "${proc_b}" }
              as: ProviderStaff
          trigger:
            - call: "POST /estimates/${est_id}/issue"
              payload: {}
              as: ProviderStaff
          assert:
            - "Estimate.${est_id}.allowed_amount_cents == 200006"
            - "Estimate.${est_id}.coinsurance_cents == 40002"
            - "Estimate.${est_id}.patient_responsibility_cents == 42502"
            - "Estimate.${est_id}.plan_paid_cents == 157504"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nlsm_estimate_cyclic_dispute_loop
        grounds:
          - state_machines.Estimate.ISSUED_to_DISPUTED
          - state_machines.Estimate.DISPUTED_to_ISSUED
          - state_machines.Dispute.UNDER_REVIEW_to_RESOLVED_UPHELD
        distinguishing_aspect: "Cyclic shape on the Estimate entity: ISSUED -> DISPUTED -> ISSUED revisits the ISSUED state, so the estimate returns to status ISSUED after a dispute is resolved (not a linear pipeline)."
        test_recipe:
          setup:
            - "A GFE_INSURED estimate issued (ISSUED); patient files a dispute (estimate -> DISPUTED); provider assigns it (UNDER_REVIEW)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /benefit-plans"
              payload: { payer_name: "Acme Health", plan_year: 2026, individual_deductible_cents: 100000, individual_oop_max_cents: 500000, coinsurance_rate: 0.20, copay_cents: 2500, in_network: true }
              as: PayerAnalyst
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { name: "Pat D", member_id: "M-D", benefit_plan_id: "${plan_id}" }
              as: ProviderStaff
              captures: { pat_id: $.data.id, pat_v0: $.data.version }
            - call: "POST /payer-contracts"
              payload: { payer_name: "Acme Health", payer_type: "COMMERCIAL", methodology: "FEE_SCHEDULE", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: PayerAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /payer-contracts/${contract_id}/activate"
              payload: {}
              as: PayerAnalyst
              captures: { con_v1: $.data.version }
            - call: "POST /procedures"
              payload: { code_system: "CPT", code: "70450", description: "CT Head", setting: "OUTPATIENT", gross_charge_cents: 300000 }
              as: ProviderStaff
              captures: { proc_id: $.data.id }
            - call: "POST /negotiated-rates"
              payload: { contract_id: "${contract_id}", procedure_id: "${proc_id}", rate_type: "FLAT", flat_amount_cents: 200000, expected_contract_version: "${con_v1}" }
              as: PayerAnalyst
            - call: "POST /estimates"
              payload: { patient_id: "${pat_id}", estimate_type: "GFE_INSURED", contract_id: "${contract_id}", expected_patient_version: "${pat_v0}" }
              as: ProviderStaff
              captures: { est_id: $.data.id }
            - call: "POST /estimates/${est_id}/lines"
              payload: { procedure_id: "${proc_id}" }
              as: ProviderStaff
            - call: "POST /estimates/${est_id}/issue"
              payload: {}
              as: ProviderStaff
            - call: "POST /disputes"
              payload: { estimate_id: "${est_id}", reason: "Estimate too high", disputed_amount_cents: 5000 }
              as: PatientUser
              as_user_id: "${pat_id}"
              captures: { disp_id: $.data.id }
            - call: "POST /disputes/${disp_id}/assign"
              payload: {}
              as: ProviderStaff
          trigger:
            - call: "POST /disputes/${disp_id}/resolve"
              payload: { resolution: "UPHELD", resolution_note: "Estimate confirmed accurate" }
              as: ProviderStaff
          assert:
            - "Dispute.${disp_id}.status == RESOLVED_UPHELD"
            - "Estimate.${est_id}.status == ISSUED"
            - "Estimate.${est_id}.patient_responsibility_cents == 122500"

      - name: nlsm_prior_auth_branching
        grounds:
          - state_machines.PriorAuthorization.REQUESTED_to_APPROVED
          - state_machines.PriorAuthorization.REQUESTED_to_DENIED
        distinguishing_aspect: "Branching fork on the PriorAuthorization entity (different entity than Estimate): the single REQUESTED state forks to two divergent terminals, APPROVED (sets auth_number) and DENIED (sets denial_reason), with different side-effect fields per branch."
        test_recipe:
          setup:
            - "A GFE_SELFPAY estimate exists; two prior-authorization requests reference it (both REQUESTED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /benefit-plans"
              payload: { payer_name: "Acme Health", plan_year: 2026, individual_deductible_cents: 100000, individual_oop_max_cents: 500000, coinsurance_rate: 0.20, copay_cents: 2500, in_network: true }
              as: PayerAnalyst
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { name: "Pat E", member_id: "M-E", benefit_plan_id: "${plan_id}" }
              as: ProviderStaff
              captures: { pat_id: $.data.id, pat_v0: $.data.version }
            - call: "POST /estimates"
              payload: { patient_id: "${pat_id}", estimate_type: "GFE_SELFPAY", expected_patient_version: "${pat_v0}" }
              as: ProviderStaff
              captures: { est_id: $.data.id }
            - call: "POST /prior-authorizations"
              payload: { estimate_id: "${est_id}", procedure_code: "70450", requested_units: 1 }
              as: ProviderStaff
              captures: { pa1: $.data.id }
            - call: "POST /prior-authorizations"
              payload: { estimate_id: "${est_id}", procedure_code: "74177", requested_units: 1 }
              as: ProviderStaff
              captures: { pa2: $.data.id }
            - call: "POST /prior-authorizations/${pa1}/approve"
              payload: { auth_number: "AUTH-1", approved_units: 1, expiration_date: "2026-12-31T00:00:00Z" }
              as: PayerAnalyst
          trigger:
            - call: "POST /prior-authorizations/${pa2}/deny"
              payload: { denial_reason: "Not medically necessary" }
              as: PayerAnalyst
          assert:
            - "PriorAuthorization.${pa1}.status == APPROVED"
            - "PriorAuthorization.${pa1}.auth_number == AUTH-1"
            - "PriorAuthorization.${pa2}.status == DENIED"
            - "PriorAuthorization.${pa2}.denial_reason == Not medically necessary"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: tc_settlement_chain_depth3
        grounds:
          - state_machines.Appointment.SCHEDULED_to_COMPLETED
          - state_machines.Estimate.ACCEPTED_to_SETTLED
          - entities.Patient.fields.oop_met_cents
          - entities.Estimate.fields.recompute_required
        distinguishing_aspect: "Depth-3 chain from appointment completion: complete Appointment -> linked Estimate E1 SETTLED (link1) -> Patient accumulators bump oop_met_cents to 122500 (link2) -> every other non-terminal Estimate E2 of the patient sets recompute_required=true (link3); each link is caused by the previous, not by the trigger directly."
        test_recipe:
          setup:
            - "Patient with two GFE_INSURED estimates: E1 (accepted, appointment scheduled) and E2 (issued, non-terminal sibling)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /benefit-plans"
              payload: { payer_name: "Acme Health", plan_year: 2026, individual_deductible_cents: 100000, individual_oop_max_cents: 500000, coinsurance_rate: 0.20, copay_cents: 2500, in_network: true }
              as: PayerAnalyst
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { name: "Pat F", member_id: "M-F", benefit_plan_id: "${plan_id}" }
              as: ProviderStaff
              captures: { pat_id: $.data.id, pat_v0: $.data.version }
            - call: "POST /payer-contracts"
              payload: { payer_name: "Acme Health", payer_type: "COMMERCIAL", methodology: "FEE_SCHEDULE", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: PayerAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /payer-contracts/${contract_id}/activate"
              payload: {}
              as: PayerAnalyst
              captures: { con_v1: $.data.version }
            - call: "POST /procedures"
              payload: { code_system: "CPT", code: "70450", description: "CT Head", setting: "OUTPATIENT", gross_charge_cents: 300000 }
              as: ProviderStaff
              captures: { proc_id: $.data.id }
            - call: "POST /negotiated-rates"
