              as: StateAuthority
            - call: "POST /testing-centers/${c_wd}/authorization-decision"
              payload: { decision: "WITHDRAW" }
              as: StateAuthority
            - call: "POST /testing-centers/${c_prov}/rooms"
              payload: { room_code: "P1", seat_capacity: 6, turnaround_buffer_minutes: 45 }
              as: CenterAdministrator
              as_user_id: "${c_prov}"
              captures: { r_prov: $.data.id }
            - call: "POST /exam-sessions"
              payload: { testing_room_id: "${r_prov}", subtest: "SCIENCE", starts_at: "2026-08-20T09:00:00Z", ends_at: "2026-08-20T11:00:00Z", requested_seats: 4 }
              as: CenterAdministrator
              as_user_id: "${c_prov}"
            - call: "POST /testing-centers/${c_prov}/authorization-decision"
              payload: { decision: "GRANT_FULL" }
              as: StateAuthority
            - call: "POST /exam-sessions"
              payload: { testing_room_id: "${r_prov}", subtest: "SCIENCE", starts_at: "2026-08-20T09:00:00Z", ends_at: "2026-08-20T11:00:00Z", requested_seats: 4 }
              as: CenterAdministrator
              as_user_id: "${c_prov}"
            - call: "POST /testing-centers/${c_wd}/rooms"
              payload: { room_code: "W1", seat_capacity: 6 }
              as: CenterAdministrator
