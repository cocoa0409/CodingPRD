# =============================================================================
# SCAFFOLD — Compressed Natural Gas & Alternative-Fuel Station Operations
# =============================================================================

scenario: |
  Compressed Natural Gas & Alternative-Fuel Station Operations (Clean Energy Fuels station): station uptime monitoring & compressor maintenance, fleet card authorization & account fueling, gallon-equivalent conversion & dispenser calibration, fuel tax credit & incentive claim, public vs private access pricing, maintenance window & backup fueling arrangement, safety inspection & odorization check, throughput commitment & minimum-volume contract

domain_name: cng-station-ops
api_prefix: /cng

complexity_profile:
  primary_archetype: posture_driven_gating   # Station.uptime_posture (derived from Compressor + Dispenser state) gates all fueling
  secondary_archetype: temporal_windowing    # maintenance windows, pricing-policy windows, backup availability windows
  complexity_layers:
    - optimistic_concurrency                 # OCC on Station.version (policy create-with-supersede) and FleetAccount.version (authorize-with-hold)
    - cascading_side_effects                 # window start -> compressor -> posture -> session voids -> balance release
    - ops_run_checkpoint                     # POST /_clock/set_current_utc drives seven epoch sweeps
    - rate_threshold_triggers                # daily card GGE cap, calibration tolerance, shortfall tiers, credit limit
  entity_topology: flat                      # all collections rooted under /cng; FK references in bodies/filters
  state_machine_shape: cyclic                # Station ACTIVE<->SUSPENDED, FleetAccount ACTIVE<->SUSPENDED, FleetCard ACTIVE<->SUSPENDED, TaxCreditClaim REJECTED->DRAFT
  relationship_patterns:
    - one_to_many                            # Station -> equipment/windows/claims; FleetAccount -> cards/contracts
    - cross_aggregate                        # FuelingSession references Station+Dispenser+FleetCard+FleetAccount; SupplyContract bridges FleetAccount x Station
  role_model: segregation_of_duties          # inspection performer != approver; claim drafter != submitter != decider
  consistency_model: immediate               # every mutation visible in its own response

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Station
    parent: null
    common_fields: true
    fields:
      - { name: station_name, type: string, source: input, description: "Human-readable station name" }
      - { name: station_code, type: string, source: input, description: "Unique station code", constraints: "unique across all stations" }
      - { name: access_mode, type: enum, source: input, description: "PUBLIC | PRIVATE | DUAL — which session access types this station serves" }
      - { name: backup_capacity_gge, type: integer, source: input, description: "Maximum aggregate committed GGE across overlapping backup arrangements", constraints: "> 0" }
      - { name: uptime_posture, type: enum, source: computed, description: "OPERATIONAL | DEGRADED | OUTAGE — derived from compressor conditions and dispenser statuses (see uptime_posture_derivation); new station with no equipment starts OUTAGE" }
      - { name: status, type: enum, source: system, description: "SETUP | ACTIVE | SUSPENDED" }

  - name: Compressor
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; owning station" }
      - { name: compressor_code, type: string, source: input, description: "Unique-within-station compressor code" }
      - { name: capacity_scf_per_minute, type: integer, source: input, description: "Rated capacity", constraints: "> 0" }
      - { name: condition, type: enum, source: system, description: "ONLINE | DEGRADED | OFFLINE | UNDER_MAINTENANCE; initial ONLINE" }

  - name: Dispenser
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; owning station" }
      - { name: dispenser_code, type: string, source: input, description: "Unique-within-station dispenser code" }
      - { name: fuel_type, type: enum, source: input, description: "CNG | RNG — fuel sold by this dispenser" }
      - { name: status, type: enum, source: system, description: "IN_SERVICE | CALIBRATION_HOLD | OUT_OF_SERVICE; initial IN_SERVICE" }
      - { name: correction_factor, type: number, source: computed, default: 1.0, description: "Multiplier applied to metered mass for settled GGE; set to 1 - measured_error_pct/100 by latest PASS calibration" }
      - { name: last_calibration_at, type: datetime, source: system, description: "Logical-clock timestamp of creation or latest PASS calibration" }
      - { name: calibration_due_at, type: datetime, source: computed, description: "= last_calibration_at + 90 days; clock sweep moves IN_SERVICE dispensers past due to CALIBRATION_HOLD" }

  - name: CalibrationRecord
    parent: null
    common_fields: false
    fields:
      - { name: dispenser_id, type: string, source: input, description: "FK -> Dispenser.id; calibrated dispenser" }
      - { name: measured_error_pct, type: number, source: input, description: "Signed meter error percentage, 2 decimal places; positive = over-delivery" }
      - { name: result, type: enum, source: computed, description: "PASS if abs(measured_error_pct) <= 0.50 else FAIL" }
      - { name: applied_correction_factor, type: number, source: computed, description: "On PASS: 1 - measured_error_pct/100; null on FAIL" }
      - { name: performed_at, type: datetime, source: system, description: "Logical-clock timestamp of record creation" }

  - name: PricingPolicy
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; station this price applies to" }
      - { name: access_scope, type: enum, source: input, description: "PUBLIC | PRIVATE" }
      - { name: fuel_type, type: enum, source: input, description: "CNG | RNG" }
      - { name: price_per_gge_cents, type: integer, source: input, description: "Base unit price in cents per GGE", constraints: "> 0" }
      - { name: tier_threshold_gge, type: number, source: input, description: "Optional; PRIVATE scope only. Account station-MTD volume at/above which tier_price_cents applies", constraints: "null unless access_scope == PRIVATE; required together with tier_price_cents" }
      - { name: tier_price_cents, type: integer, source: input, description: "Optional; discounted unit price once tier_threshold_gge met", constraints: "null unless access_scope == PRIVATE; > 0 when present" }
      - { name: effective_from, type: datetime, source: input, description: "Window start (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Window end (exclusive); must be > effective_from" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED | EXPIRED; initial ACTIVE" }

  - name: FleetAccount
    parent: null
    common_fields: true
    fields:
      - { name: account_name, type: string, source: input, description: "Fleet account name" }
      - { name: billing_email, type: string, source: input, description: "Billing contact email" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum allowed outstanding balance", constraints: "> 0" }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "= sum(holds on AUTHORIZED sessions) + sum(total_amount_cents on COMPLETED/SETTLED non-voided sessions) + sum(settlement penalties)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED; initial ACTIVE" }

  - name: FleetCard
    parent: null
    common_fields: true
    fields:
      - { name: fleet_account_id, type: string, source: input, description: "FK -> FleetAccount.id; owning account" }
      - { name: card_number, type: string, source: input, description: "Unique card number", constraints: "unique across all cards" }
      - { name: vehicle_plate, type: string, source: input, description: "Vehicle plate bound to card" }
      - { name: daily_gge_limit, type: number, source: input, description: "Per-card daily GGE cap checked at authorize", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | REVOKED; initial ACTIVE" }
      - { name: current_day_gge, type: number, source: computed, default: 0, description: "Sum of settled_gge of today's non-voided COMPLETED/SETTLED sessions on this card" }
      - { name: current_day_date, type: string, source: system, description: "UTC date (YYYY-MM-DD) current_day_gge applies to; reset by clock sweep on day rollover" }

  - name: SupplyContract
    parent: null
    common_fields: true
    fields:
      - { name: fleet_account_id, type: string, source: input, description: "FK -> FleetAccount.id; contracted fleet" }
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; contracted station" }
      - { name: committed_monthly_gge, type: number, source: input, description: "Minimum monthly throughput commitment", constraints: "> 0" }
      - { name: contract_price_per_gge_cents, type: integer, source: input, description: "Contract unit price overriding policy price", constraints: "> 0" }
      - { name: shortfall_tier1_rate_cents, type: integer, source: input, description: "Penalty cents per shortfall GGE up to 10% of commitment", constraints: ">= 0" }
      - { name: shortfall_tier2_rate_cents, type: integer, source: input, description: "Penalty cents per shortfall GGE beyond 10% of commitment", constraints: ">= 0" }
      - { name: start_month, type: string, source: input, description: "First covered month, YYYY-MM" }
      - { name: end_month, type: string, source: input, description: "Last covered month, YYYY-MM; must be >= start_month" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | EXPIRED; initial DRAFT" }

  - name: MonthlySettlement
    parent: null
    common_fields: false
    fields:
      - { name: supply_contract_id, type: string, source: system, description: "FK -> SupplyContract.id; settled contract" }
      - { name: month, type: string, source: system, description: "Settled month YYYY-MM; unique per contract" }
      - { name: delivered_gge, type: number, source: computed, description: "Sum of settled_gge of non-voided COMPLETED/SETTLED private sessions for the contract account+station in month" }
      - { name: shortfall_gge, type: number, source: computed, description: "max(0, committed_monthly_gge - delivered_gge)" }
      - { name: penalty_cents, type: integer, source: computed, description: "Tiered penalty per minimum_volume_settlement; posted to account balance" }
      - { name: settled_at, type: datetime, source: system, description: "Logical-clock timestamp of settlement" }

  - name: FuelingSession
    parent: null
    common_fields: true
    fields:
      - { name: access_type, type: enum, source: system, description: "PUBLIC (authorize-public) | PRIVATE (authorize)" }
      - { name: station_id, type: string, source: system, description: "FK -> Station.id; denormalized from dispenser at authorize" }
      - { name: dispenser_id, type: string, source: input, description: "FK -> Dispenser.id; dispensing unit" }
      - { name: fleet_card_id, type: string, source: input, description: "FK -> FleetCard.id; PRIVATE only, null for PUBLIC" }
      - { name: fleet_account_id, type: string, source: system, description: "FK -> FleetAccount.id; denormalized from card at authorize, null for PUBLIC" }
      - { name: client_ref, type: string, source: input, description: "Client idempotency reference; unique per station among non-VOIDED sessions" }
      - { name: estimated_gge, type: number, source: input, description: "Estimated GGE for hold sizing", constraints: "> 0" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Unit price snapshot resolved once at authorize (contract override, else policy + MTD tier)" }
      - { name: hold_amount_cents, type: integer, source: computed, description: "PRIVATE: round_half_up(estimated_gge * unit_price_cents); PUBLIC: 0" }
      - { name: metered_mass_kg, type: number, source: input, description: "Mass dispensed, supplied at complete", constraints: "> 0" }
      - { name: correction_factor_applied, type: number, source: system, description: "Dispenser.correction_factor snapshot at complete" }
      - { name: provisional_gge, type: number, source: computed, description: "round_half_up(metered_mass_kg / 2.567, 3)" }
      - { name: settled_gge, type: number, source: computed, description: "round_half_up(metered_mass_kg * correction_factor_applied / 2.567, 3)" }
      - { name: total_amount_cents, type: integer, source: computed, description: "round_half_up(settled_gge * unit_price_cents) to integer cents" }
      - { name: status, type: enum, source: system, description: "AUTHORIZED | COMPLETED | SETTLED | VOIDED" }
      - { name: void_reason, type: enum, source: system, description: "CUSTOMER_REQUEST | MANAGER_VOID | TIMEOUT | STATION_OUTAGE | INSPECTION_FAIL; null until voided" }
      - { name: authorized_at, type: datetime, source: system, description: "Logical-clock timestamp of authorization" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp of completion; null until COMPLETED" }
      - { name: voided_at, type: datetime, source: system, description: "Logical-clock timestamp of void; null until VOIDED" }
      - { name: settled_at, type: datetime, source: system, description: "Logical-clock timestamp of month-close settlement sweep; null until SETTLED" }

  - name: MaintenanceWindow
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; station under maintenance" }
      - { name: compressor_id, type: string, source: input, description: "FK -> Compressor.id; null = whole-station window" }
      - { name: starts_at, type: datetime, source: input, description: "Window start (inclusive, half-open interval)" }
      - { name: ends_at, type: datetime, source: input, description: "Window end (exclusive); must be > starts_at" }
      - { name: window_type, type: enum, source: input, description: "PREVENTIVE | CORRECTIVE | EMERGENCY; EMERGENCY exempt from overdue-inspection gate and backup requirement" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED | LAPSED; initial SCHEDULED" }

  - name: BackupFuelingArrangement
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; station receiving backup coverage" }
      - { name: partner_station_code, type: string, source: input, description: "Code of partner station providing backup fueling" }
      - { name: available_from, type: datetime, source: input, description: "Availability start (inclusive)" }
      - { name: available_until, type: datetime, source: input, description: "Availability end (exclusive); must be > available_from" }
      - { name: committed_gge, type: integer, source: input, description: "Reserved backup volume", constraints: "> 0" }
      - { name: used_gge, type: number, source: computed, default: 0, description: "Accumulated partner draws via record-draw" }
      - { name: status, type: enum, source: system, description: "RESERVED | ACTIVATED | RELEASED | EXPIRED; initial RESERVED" }

  - name: SafetyInspection
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; inspected station" }
      - { name: inspection_type, type: enum, source: input, description: "ANNUAL_COMPREHENSIVE | ODORIZATION_CHECK | PRESSURE_VESSEL" }
      - { name: scheduled_for, type: datetime, source: input, description: "Planned inspection time; clock sweep marks SCHEDULED inspections OVERDUE once now > scheduled_for" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OVERDUE | COMPLETED | APPROVED; initial SCHEDULED" }
      - { name: result, type: enum, source: input, description: "PASS | PASS_WITH_DEFICIENCIES | FAIL; supplied at complete" }
      - { name: findings, type: string, source: input, description: "Optional findings text" }
      - { name: performed_by, type: string, source: system, description: "X-User-ID of the StationManager who completed the inspection" }
      - { name: approved_by, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who approved; must differ from performed_by" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp of completion; null until COMPLETED" }

  - name: TaxCreditClaim
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; station claiming the credit" }
      - { name: period_start, type: datetime, source: input, description: "Claim period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Claim period end (exclusive); must be > period_start" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | SUBMITTED | APPROVED | REJECTED; initial DRAFT" }
      - { name: eligible_gge_provisional, type: number, source: computed, description: "Provisional variant: sum of provisional_gge over COMPLETED+SETTLED non-voided sessions in period (computed at create and reopen)" }
      - { name: claim_amount_provisional_cents, type: integer, source: computed, description: "Provisional claim amount (fuel-type rates applied to per-session rounded GGE)" }
      - { name: eligible_gge_final, type: number, source: computed, description: "Final variant: sum of settled_gge over SETTLED sessions in period not captured by another FINALIZED/SUBMITTED/APPROVED claim; null until finalize" }
      - { name: claim_amount_final_cents, type: integer, source: computed, description: "Final claim amount; null until finalize" }
      - { name: decision_reason, type: string, source: input, description: "Optional reason recorded at decision" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Station
    initial_state: SETUP
    terminal_states: []
    transitions:
      - from: SETUP
        to: ACTIVE
        trigger: "POST /cng/stations/{stationId}/activate"
        actor: NetworkOperator
        preconditions:
          - "Station must be in SETUP (ERR_STATION_NOT_IN_SETUP)"
          - "Station must have >= 1 Compressor and >= 1 Dispenser (ERR_STATION_NOT_EQUIPPED)"
        side_effects:
          - "status -> ACTIVE; increments Station.version by 1"
          - "Recompute uptime_posture (typically OPERATIONAL with fresh ONLINE/IN_SERVICE equipment)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /cng/stations/{stationId}/suspend OR system cascade from SafetyInspection APPROVED with result FAIL"
        actor: NetworkOperator | system
        preconditions:
          - "Station must be in ACTIVE (ERR_STATION_NOT_ACTIVE)"
        side_effects:
          - "status -> SUSPENDED; increments Station.version by 1"
          - "Cascade: every AUTHORIZED FuelingSession with station_id == this station -> VOIDED with void_reason INSPECTION_FAIL (system cascade) or MANAGER_VOID (manual suspend); each void releases its hold: FleetAccount.outstanding_balance_cents -= hold_amount_cents and FleetAccount.version += 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /cng/stations/{stationId}/resume"
        actor: NetworkOperator
        preconditions:
          - "Station must be in SUSPENDED (ERR_STATION_NOT_SUSPENDED)"
          - "No SafetyInspection at this station in OVERDUE status (ERR_OVERDUE_INSPECTION)"
        side_effects:
          - "status -> ACTIVE; increments Station.version by 1"

  - entity: Compressor
    initial_state: ONLINE
    terminal_states: []
    transitions:
      - from: ONLINE
        to: DEGRADED
        trigger: "POST /cng/compressors/{compressorId}/report-condition"
        actor: StationManager
        preconditions:
          - "Compressor must not be UNDER_MAINTENANCE (ERR_COMPRESSOR_UNDER_MAINTENANCE)"
        side_effects:
          - "condition -> DEGRADED; increments Compressor.version by 1"
          - "Recompute Station.uptime_posture (DEGRADED compressor present -> at least DEGRADED)"
      - from: ONLINE
        to: OFFLINE
        trigger: "POST /cng/compressors/{compressorId}/report-condition"
        actor: StationManager
        preconditions:
          - "Compressor must not be UNDER_MAINTENANCE (ERR_COMPRESSOR_UNDER_MAINTENANCE)"
        side_effects:
          - "condition -> OFFLINE; increments Compressor.version by 1"
          - "Recompute Station.uptime_posture; if it becomes OUTAGE, void cascade fires (see uptime_posture_derivation)"
      - from: DEGRADED
        to: ONLINE
        trigger: "POST /cng/compressors/{compressorId}/report-condition"
        actor: StationManager
        preconditions:
          - "Compressor must not be UNDER_MAINTENANCE (ERR_COMPRESSOR_UNDER_MAINTENANCE)"
        side_effects:
          - "condition -> ONLINE; increments Compressor.version by 1; recompute Station.uptime_posture"
      - from: DEGRADED
        to: OFFLINE
        trigger: "POST /cng/compressors/{compressorId}/report-condition"
        actor: StationManager
        preconditions:
          - "Compressor must not be UNDER_MAINTENANCE (ERR_COMPRESSOR_UNDER_MAINTENANCE)"
        side_effects:
          - "condition -> OFFLINE; increments Compressor.version by 1; recompute Station.uptime_posture (possible OUTAGE void cascade)"
      - from: OFFLINE
        to: ONLINE
        trigger: "POST /cng/compressors/{compressorId}/report-condition"
        actor: StationManager
        preconditions:
          - "Compressor must not be UNDER_MAINTENANCE (ERR_COMPRESSOR_UNDER_MAINTENANCE)"
        side_effects:
          - "condition -> ONLINE; increments Compressor.version by 1; recompute Station.uptime_posture"
      - from: ONLINE
        to: UNDER_MAINTENANCE
        trigger: "system (MaintenanceWindow start referencing this compressor)"
        actor: system
        preconditions: []
        side_effects:
          - "condition -> UNDER_MAINTENANCE; increments Compressor.version by 1; recompute Station.uptime_posture (possible OUTAGE void cascade)"
      - from: DEGRADED
        to: UNDER_MAINTENANCE
        trigger: "system (MaintenanceWindow start referencing this compressor)"
        actor: system
        preconditions: []
        side_effects:
          - "condition -> UNDER_MAINTENANCE; increments Compressor.version by 1; recompute Station.uptime_posture (possible OUTAGE void cascade)"
      - from: UNDER_MAINTENANCE
        to: ONLINE
        trigger: "system (MaintenanceWindow complete referencing this compressor)"
        actor: system
        preconditions: []
        side_effects:
          - "condition -> ONLINE; increments Compressor.version by 1; recompute Station.uptime_posture"

  - entity: Dispenser
    initial_state: IN_SERVICE
    terminal_states: []
    transitions:
      - from: IN_SERVICE
        to: CALIBRATION_HOLD
        trigger: "system (clock sweep: now > calibration_due_at)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> CALIBRATION_HOLD; increments Dispenser.version by 1; recompute Station.uptime_posture"
      - from: CALIBRATION_HOLD
        to: IN_SERVICE
        trigger: "system (PASS CalibrationRecord created for this dispenser)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> IN_SERVICE; correction_factor = 1 - measured_error_pct/100; last_calibration_at = now; calibration_due_at = now + 90 days; increments Dispenser.version by 1; recompute Station.uptime_posture"
      - from: IN_SERVICE
        to: IN_SERVICE
        trigger: "system (PASS CalibrationRecord created for this dispenser)"
        actor: system
        preconditions: []
        side_effects:
          - "correction_factor, last_calibration_at, calibration_due_at refreshed; increments Dispenser.version by 1; recompute Station.uptime_posture"
        note: "Self-transition: recalibration while in service refreshes calibration fields"
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "system (FAIL CalibrationRecord created for this dispenser)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> OUT_OF_SERVICE; increments Dispenser.version by 1; recompute Station.uptime_posture (possible OUTAGE void cascade)"
      - from: CALIBRATION_HOLD
        to: OUT_OF_SERVICE
        trigger: "system (FAIL CalibrationRecord created for this dispenser)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> OUT_OF_SERVICE; increments Dispenser.version by 1; recompute Station.uptime_posture (possible OUTAGE void cascade)"
      - from: OUT_OF_SERVICE
        to: IN_SERVICE
        trigger: "system (PASS CalibrationRecord created for this dispenser)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> IN_SERVICE; correction_factor refreshed; calibration_due_at = now + 90 days; increments Dispenser.version by 1; recompute Station.uptime_posture"

  - entity: PricingPolicy
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (POST /cng/pricing-policies creates a new ACTIVE policy with the same (station_id, access_scope, fuel_type) key)"
        actor: system
        preconditions: []
        side_effects:
          - "Prior policy status -> SUPERSEDED; increments its version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock sweep: now > effective_to)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> EXPIRED; increments PricingPolicy.version by 1"

  - entity: FleetAccount
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /cng/fleet-accounts/{accountId}/suspend"
        actor: NetworkOperator
        preconditions:
          - "Account must be ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
        side_effects:
          - "status -> SUSPENDED; increments FleetAccount.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /cng/fleet-accounts/{accountId}/resume"
        actor: NetworkOperator
        preconditions:
          - "Account must be SUSPENDED (ERR_ACCOUNT_NOT_SUSPENDED)"
        side_effects:
          - "status -> ACTIVE; increments FleetAccount.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /cng/fleet-accounts/{accountId}/close"
        actor: NetworkOperator
        preconditions:
          - "Account must be ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
          - "outstanding_balance_cents == 0 (ERR_OUTSTANDING_BALANCE_NONZERO)"
        side_effects:
          - "status -> CLOSED; increments FleetAccount.version by 1"
          - "All non-REVOKED FleetCards of this account -> REVOKED; each increments version by 1"

  - entity: FleetCard
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /cng/fleet-cards/{cardId}/set-status"
        actor: FleetAccountManager | NetworkOperator
        preconditions:
          - "Card must not be REVOKED (ERR_CARD_ALREADY_REVOKED)"
        side_effects: ["status -> SUSPENDED; increments FleetCard.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /cng/fleet-cards/{cardId}/set-status"
        actor: FleetAccountManager | NetworkOperator
        preconditions:
          - "Card must not be REVOKED (ERR_CARD_ALREADY_REVOKED)"
          - "Owning FleetAccount must be ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
        side_effects: ["status -> ACTIVE; increments FleetCard.version by 1"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /cng/fleet-cards/{cardId}/set-status OR system cascade from account close"
        actor: FleetAccountManager | NetworkOperator | system
        preconditions:
          - "Card must not be REVOKED (ERR_CARD_ALREADY_REVOKED)"
        side_effects: ["status -> REVOKED; increments FleetCard.version by 1"]
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /cng/fleet-cards/{cardId}/set-status OR system cascade from account close"
        actor: FleetAccountManager | NetworkOperator | system
        preconditions:
          - "Card must not be REVOKED (ERR_CARD_ALREADY_REVOKED)"
        side_effects: ["status -> REVOKED; increments FleetCard.version by 1"]

  - entity: SupplyContract
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /cng/supply-contracts/{contractId}/activate"
        actor: NetworkOperator
        preconditions:
          - "Contract must be DRAFT (ERR_CONTRACT_NOT_DRAFT)"
          - "FleetAccount must be ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
          - "Station must be ACTIVE (ERR_STATION_NOT_ACTIVE)"
          - "No other ACTIVE contract exists for the same (fleet_account_id, station_id) (ERR_CONTRACT_ALREADY_ACTIVE)"
        side_effects: ["status -> ACTIVE; increments SupplyContract.version by 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock sweep: current month > end_month)"
        actor: system
        preconditions: []
        side_effects: ["status -> EXPIRED; increments SupplyContract.version by 1"]

  - entity: FuelingSession
    initial_state: AUTHORIZED
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: AUTHORIZED
        to: COMPLETED
        trigger: "POST /cng/fueling-sessions/{sessionId}/complete"
        actor: FleetDriver | Anonymous
        preconditions:
          - "Session must be AUTHORIZED (ERR_SESSION_NOT_COMPLETABLE)"
          - "PRIVATE: caller X-User-Role FleetDriver and X-User-ID == session.fleet_card_id (ERR_CARD_OWNERSHIP_MISMATCH); PUBLIC: caller X-User-Role Anonymous (ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "Compute provisional_gge and settled_gge (gge_equivalent_conversion) with dispenser correction_factor snapshot"
          - "total_amount_cents = round_half_up(settled_gge * unit_price_cents)"
          - "PRIVATE: FleetAccount.outstanding_balance_cents += (total_amount_cents - hold_amount_cents); FleetAccount.version += 1"
          - "PRIVATE: FleetCard.current_day_gge += settled_gge; increments FleetCard.version by 1"
          - "status -> COMPLETED; completed_at = now; increments FuelingSession.version by 1"
      - from: AUTHORIZED
        to: VOIDED
        trigger: "POST /cng/fueling-sessions/{sessionId}/void OR system cascade (station suspend / posture OUTAGE / 30-minute hold timeout sweep)"
        actor: FleetDriver | Anonymous | StationManager | system
        preconditions:
          - "Session must be AUTHORIZED or COMPLETED (ERR_SESSION_NOT_VOIDABLE)"
        side_effects:
          - "PRIVATE: release hold — FleetAccount.outstanding_balance_cents -= hold_amount_cents; FleetAccount.version += 1"
          - "status -> VOIDED; void_reason set (CUSTOMER_REQUEST driver/anon | MANAGER_VOID station manager | TIMEOUT | STATION_OUTAGE | INSPECTION_FAIL); voided_at = now; increments FuelingSession.version by 1"
      - from: COMPLETED
        to: VOIDED
        trigger: "POST /cng/fueling-sessions/{sessionId}/void"
        actor: FleetDriver | Anonymous | StationManager
        preconditions:
          - "Session must be AUTHORIZED or COMPLETED (ERR_SESSION_NOT_VOIDABLE)"
        side_effects:
          - "PRIVATE: refund — FleetAccount.outstanding_balance_cents -= total_amount_cents; FleetAccount.version += 1 (the hold was already netted at completion)"
          - "PRIVATE: FleetCard.current_day_gge -= settled_gge (floor 0); increments FleetCard.version by 1"
          - "status -> VOIDED; void_reason CUSTOMER_REQUEST | MANAGER_VOID; voided_at = now; increments FuelingSession.version by 1"
      - from: COMPLETED
        to: SETTLED
        trigger: "system (clock sweep crossing a month boundary: completed_at month < current month)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> SETTLED; settled_at = now; increments FuelingSession.version by 1"
          - "SETTLED sessions are immutable: not voidable, included in final tax-credit computation"

  - entity: MaintenanceWindow
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, LAPSED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /cng/maintenance-windows/{windowId}/start"
        actor: StationManager
        preconditions:
          - "Window must be SCHEDULED (ERR_WINDOW_NOT_STARTABLE)"
          - "starts_at <= now < ends_at (ERR_WINDOW_NOT_IN_TIME_RANGE)"
          - "If compressor_id set, compressor must not already be UNDER_MAINTENANCE (ERR_COMPRESSOR_UNDER_MAINTENANCE)"
          - "Non-EMERGENCY window whose compressor is the station's only compressor in {ONLINE, DEGRADED} (or whole-station window while any fueling capacity would be lost) requires an ACTIVATED BackupFuelingArrangement with available_from <= starts_at and available_until >= ends_at (ERR_BACKUP_REQUIRED)"
        side_effects:
          - "status -> IN_PROGRESS; increments MaintenanceWindow.version by 1"
          - "Linked compressor (if any) -> UNDER_MAINTENANCE"
          - "Recompute Station.uptime_posture; if it becomes OUTAGE: every AUTHORIZED FuelingSession at the station -> VOIDED (void_reason STATION_OUTAGE) with hold release (FleetAccount.outstanding_balance_cents -= hold_amount_cents, FleetAccount.version += 1 per session)"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /cng/maintenance-windows/{windowId}/complete"
        actor: StationManager
        preconditions:
          - "Window must be IN_PROGRESS (ERR_WINDOW_NOT_COMPLETABLE)"
        side_effects:
          - "status -> COMPLETED; increments MaintenanceWindow.version by 1"
          - "Linked compressor (if any) -> ONLINE; recompute Station.uptime_posture"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /cng/maintenance-windows/{windowId}/cancel"
        actor: StationManager
        preconditions:
          - "Window must be SCHEDULED (ERR_WINDOW_NOT_CANCELLABLE)"
        side_effects:
          - "status -> CANCELLED; increments MaintenanceWindow.version by 1"
      - from: SCHEDULED
        to: LAPSED
        trigger: "system (clock sweep: now > ends_at while still SCHEDULED)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> LAPSED; increments MaintenanceWindow.version by 1"

  - entity: BackupFuelingArrangement
    initial_state: RESERVED
    terminal_states: [RELEASED, EXPIRED]
    transitions:
      - from: RESERVED
        to: ACTIVATED
        trigger: "POST /cng/backup-arrangements/{arrangementId}/activate"
        actor: StationManager
        preconditions:
          - "Arrangement must be RESERVED (ERR_BACKUP_NOT_ACTIVATABLE)"
          - "available_from <= now <= available_until (ERR_BACKUP_NOT_IN_WINDOW)"
        side_effects: ["status -> ACTIVATED; increments BackupFuelingArrangement.version by 1"]
      - from: ACTIVATED
        to: RELEASED
        trigger: "POST /cng/backup-arrangements/{arrangementId}/release"
        actor: StationManager
        preconditions:
          - "Arrangement must be ACTIVATED (ERR_BACKUP_NOT_RELEASABLE)"
        side_effects: ["status -> RELEASED; used_gge frozen; increments BackupFuelingArrangement.version by 1"]
      - from: RESERVED
        to: EXPIRED
        trigger: "system (clock sweep: now > available_until)"
        actor: system
        preconditions: []
        side_effects: ["status -> EXPIRED; increments BackupFuelingArrangement.version by 1"]
      - from: ACTIVATED
        to: EXPIRED
        trigger: "system (clock sweep: now > available_until)"
        actor: system
        preconditions: []
        side_effects: ["status -> EXPIRED; used_gge frozen; increments BackupFuelingArrangement.version by 1"]

  - entity: SafetyInspection
    initial_state: SCHEDULED
    terminal_states: [APPROVED]
    transitions:
      - from: SCHEDULED
        to: OVERDUE
        trigger: "system (clock sweep: now > scheduled_for)"
        actor: system
        preconditions: []
        side_effects: ["status -> OVERDUE; increments SafetyInspection.version by 1"]
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /cng/safety-inspections/{inspectionId}/complete"
        actor: StationManager
        preconditions:
          - "Inspection must be SCHEDULED or OVERDUE (ERR_INSPECTION_NOT_COMPLETABLE)"
        side_effects:
          - "status -> COMPLETED; result, findings recorded; performed_by = X-User-ID; completed_at = now; increments SafetyInspection.version by 1"
      - from: OVERDUE
        to: COMPLETED
        trigger: "POST /cng/safety-inspections/{inspectionId}/complete"
        actor: StationManager
        preconditions:
          - "Inspection must be SCHEDULED or OVERDUE (ERR_INSPECTION_NOT_COMPLETABLE)"
        side_effects:
          - "status -> COMPLETED; performed_by = X-User-ID; completed_at = now; increments SafetyInspection.version by 1"
      - from: COMPLETED
        to: APPROVED
        trigger: "POST /cng/safety-inspections/{inspectionId}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "Inspection must be COMPLETED (ERR_INSPECTION_NOT_APPROVABLE)"
          - "Approver X-User-ID != performed_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "status -> APPROVED; approved_by = X-User-ID; increments SafetyInspection.version by 1"
          - "If result == FAIL: Station -> SUSPENDED and its AUTHORIZED FuelingSessions -> VOIDED (void_reason INSPECTION_FAIL) with hold release per session"
          - "If result in {PASS, PASS_WITH_DEFICIENCIES}: system auto-creates the next SafetyInspection of the same inspection_type at this station, SCHEDULED, scheduled_for = completed_at + interval (ANNUAL_COMPREHENSIVE 365d, ODORIZATION_CHECK 90d, PRESSURE_VESSEL 730d)"

  - entity: TaxCreditClaim
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /cng/tax-credit-claims/{claimId}/finalize"
        actor: StationManager
        preconditions:
          - "Claim must be DRAFT (ERR_CLAIM_NOT_FINALIZABLE)"
          - "Final eligible session set must be non-empty (ERR_NO_ELIGIBLE_VOLUME)"
        side_effects:
          - "Compute eligible_gge_final and claim_amount_final_cents (final variant: SETTLED sessions, settled_gge, excluding sessions captured by another FINALIZED/SUBMITTED/APPROVED claim at this station)"
          - "status -> FINALIZED; increments TaxCreditClaim.version by 1"
      - from: FINALIZED
        to: SUBMITTED
        trigger: "POST /cng/tax-credit-claims/{claimId}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "Claim must be FINALIZED (ERR_CLAIM_NOT_SUBMITTABLE)"
          - "Station must be ACTIVE (ERR_STATION_NOT_ACTIVE)"
          - "No OVERDUE SafetyInspection at the station (ERR_OVERDUE_INSPECTION)"
        side_effects: ["status -> SUBMITTED; increments TaxCreditClaim.version by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /cng/tax-credit-claims/{claimId}/decision"
        actor: NetworkOperator
        preconditions:
          - "Claim must be SUBMITTED (ERR_CLAIM_NOT_DECIDABLE)"
        side_effects: ["status -> APPROVED; decision_reason recorded; increments TaxCreditClaim.version by 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /cng/tax-credit-claims/{claimId}/decision"
        actor: NetworkOperator
        preconditions:
          - "Claim must be SUBMITTED (ERR_CLAIM_NOT_DECIDABLE)"
        side_effects: ["status -> REJECTED; decision_reason recorded; increments TaxCreditClaim.version by 1"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /cng/tax-credit-claims/{claimId}/reopen"
        actor: StationManager
        preconditions:
          - "Claim must be REJECTED (ERR_CLAIM_NOT_REOPENABLE)"
        side_effects:
          - "status -> DRAFT; increments TaxCreditClaim.version by 1"
          - "Recompute provisional fields from current session data; clear final fields to null"

# =============================================================================
# Section 1.2.1: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: pricing-policy-create-stale-station
    parent_entity: Station
    write_endpoint: "POST /cng/pricing-policies"
    occ_field: expected_station_version
    description: |
      Creating a PricingPolicy against a Station whose version has advanced
      since the client last observed it is rejected. Policy creation legitimately
      supersedes the prior ACTIVE policy with the same (station, scope, fuel)
      key, so a writer holding a stale station view must not supersede on the
      basis of outdated state.
    error_id: ERR_STALE_STATION_VERSION
    http_status: 412
  - rule_id: session-authorize-stale-account
    parent_entity: FleetAccount
    write_endpoint: "POST /cng/fueling-sessions/authorize"
    occ_field: expected_fleet_account_version
    description: |
      Authorizing a private FuelingSession against a FleetAccount whose version
      has advanced since the client last observed it is rejected. Multiple holds
      against one account are legitimate, so a writer holding a stale account
      view must not post a hold on the basis of an outdated balance.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: gge_equivalent_conversion
    trigger: "FuelingSession completion (AUTHORIZED -> COMPLETED)"
    algorithm: aggregation
    formula: |
      GGE_KG = 2.567 (kilograms per gasoline-gallon-equivalent for CNG)
      provisional_gge = round_half_up(metered_mass_kg / GGE_KG, 3 decimal places)
      settled_gge     = round_half_up(metered_mass_kg * correction_factor_applied / GGE_KG, 3 decimal places)
      correction_factor_applied = Dispenser.correction_factor snapshotted at completion time
      Both variants are computed and stored at completion; they diverge whenever
      the dispenser's latest PASS calibration had a non-zero measured_error_pct.
    input_set: "The completing FuelingSession's metered_mass_kg and its Dispenser's current correction_factor"
    constants:
      GGE_KG: 2.567
    precision: "3 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "Meter-as-read reporting; claim provisional variant; informational field"
        difference: "Ignores calibration correction (correction factor = 1.0 implicitly)"
      - name: settled
        when: "Billing total_amount_cents, daily card usage, contract delivered volume, final tax-credit claims"
        difference: "Applies dispenser correction_factor from latest PASS calibration"

  - name: fueling_unit_price_resolution
    trigger: "FuelingSession authorization (unit_price_cents snapshot taken once at authorize and reused at complete)"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is pinned (circular-looking dependency resolved by ordering):
      1. PRIVATE sessions: if an ACTIVE SupplyContract exists for
         (session.fleet_account_id, session.station_id) with start_month <= current month <= end_month,
         unit_price_cents = contract_price_per_gge_cents. STOP. (Contract overrides all policy pricing.)
      2. Otherwise select the PricingPolicy with status == ACTIVE matching
         (station_id, access_scope == session.access_type, fuel_type == dispenser.fuel_type)
         and effective_from <= now < effective_to. At most one such policy exists
         (same-key create supersedes). If none: reject with ERR_NO_ACTIVE_PRICE.
      3. PRIVATE only, and only when the selected policy has tier_threshold_gge set:
         compute mtd_gge = sum of settled_gge over the account's non-voided
         COMPLETED/SETTLED private sessions at this station with completed_at in the
         current calendar month (UTC) — EXCLUDING the session being authorized.
         If mtd_gge >= tier_threshold_gge: unit_price_cents = tier_price_cents.
         Otherwise unit_price_cents = price_per_gge_cents.
      4. PUBLIC sessions always use price_per_gge_cents (no tier, no contract).
    input_set: "Session's account/station/dispenser; ACTIVE SupplyContracts; ACTIVE PricingPolicies; account MTD session set"
    constants: {}
    precision: "integer cents; no rounding (price selection only)"

  - name: hold_amount_and_credit_check
    trigger: "FuelingSession authorization (PRIVATE), void, complete"
    algorithm: threshold
    formula: |
      hold_amount_cents = round_half_up(estimated_gge * unit_price_cents) to integer cents
      Credit check at authorize: outstanding_balance_cents + hold_amount_cents <= credit_limit_cents
      (equality is ALLOWED — the account may sit exactly at its limit), else ERR_CREDIT_LIMIT_EXCEEDED.
      Daily check at authorize: card.current_day_gge + estimated_gge <= card.daily_gge_limit
      (equality ALLOWED), else ERR_DAILY_LIMIT_EXCEEDED.
      On success: outstanding_balance_cents += hold_amount_cents (FleetAccount.version += 1).
      On void of AUTHORIZED: outstanding_balance_cents -= hold_amount_cents.
      On complete: outstanding_balance_cents += (total_amount_cents - hold_amount_cents).
      On void of COMPLETED: outstanding_balance_cents -= total_amount_cents.
    input_set: "Authorizing session, its FleetAccount balance/limit, its FleetCard daily usage/limit"
    constants: {}
    precision: "integer cents, round_half_up for the hold"

  - name: tax_credit_claim_computation
    trigger: "TaxCreditClaim create/reopen (provisional variant) and finalize (final variant)"
    algorithm: aggregation
    formula: |
      Rates: CNG_CREDIT_CENTS = 50 per GGE; RNG_CREDIT_CENTS = 100 per GGE.
      Rounding order is PINNED (nested-rounding discipline):
        (i) each session's GGE is already rounded to 3 decimal places at completion;
        (ii) sum the per-session rounded GGE values per fuel_type (no re-rounding of the sum);
        (iii) amount_cents = round_half_up(sum_cng * 50 + sum_rng * 100) to integer cents.
      The alternative order (sum metered mass across sessions, then convert once)
      is FORBIDDEN — per-session rounded GGE values are the only inputs.
      Provisional input set: station sessions with status in {COMPLETED, SETTLED},
        completed_at in [period_start, period_end), not VOIDED; uses provisional_gge.
      Final input set: station sessions with status == SETTLED, completed_at in
        [period_start, period_end); uses settled_gge; EXCLUDES any session whose
        completed_at falls inside the period of another TaxCreditClaim at the same
        station with status in {FINALIZED, SUBMITTED, APPROVED} (double-claim prevention).
      If the final input set is empty at finalize: ERR_NO_ELIGIBLE_VOLUME.
    input_set: "FuelingSessions at the claim's station, filtered by status and completed_at window per variant"
    constants:
      CNG_CREDIT_CENTS_PER_GGE: 50
      RNG_CREDIT_CENTS_PER_GGE: 100
    precision: "GGE sums at 3 decimal places (per-session values); amounts integer cents, round_half_up"
    variants:
      - name: provisional
        when: "Claim creation and reopen"
        difference: "Includes COMPLETED (not yet settled) sessions; uses provisional_gge (no calibration correction); no cross-claim exclusion"
      - name: final
        when: "Claim finalize"
        difference: "SETTLED sessions only; uses settled_gge (calibration-corrected); excludes sessions captured by other open claims"

  - name: minimum_volume_settlement
    trigger: "POST /cng/supply-contracts/{contractId}/settle-month"
    algorithm: tiered_pricing
    formula: |
      delivered_gge = sum of settled_gge over non-voided private FuelingSessions with
        fleet_account_id == contract.fleet_account_id AND station_id == contract.station_id
        AND status in {COMPLETED, SETTLED} AND completed_at in [month-01T00:00:00Z, next-month-01T00:00:00Z)
      shortfall_gge = max(0, committed_monthly_gge - delivered_gge)
      tier_cap_gge = committed_monthly_gge * 0.10
      penalty_cents = round_half_up(
          min(shortfall_gge, tier_cap_gge) * shortfall_tier1_rate_cents
        + max(0, shortfall_gge - tier_cap_gge) * shortfall_tier2_rate_cents ) to integer cents
      (non-linear: nested min/max across >= 3 inputs with tiered-rate selection)
      Side effects: creates an immutable MonthlySettlement; posts penalty_cents to
      FleetAccount.outstanding_balance_cents (FleetAccount.version += 1).
    input_set: "Contract; its account+station non-voided COMPLETED/SETTLED sessions in the settled month"
    constants:
      TIER1_CAP_PCT: 0.10
    precision: "GGE at 3 decimal places; penalty integer cents, round_half_up"

  - name: uptime_posture_derivation
    trigger: "Any Compressor condition change, any Dispenser status change, equipment creation, station activation"
    algorithm: constraint_propagation
    formula: |
      online_compressors = count(Compressor of station with condition in {ONLINE, DEGRADED})
      inservice_dispensers = count(Dispenser of station with status == IN_SERVICE)
      if online_compressors == 0 OR inservice_dispensers == 0: uptime_posture = OUTAGE
      elif any compressor has condition == DEGRADED OR any dispenser has status == CALIBRATION_HOLD:
        uptime_posture = DEGRADED
      else: uptime_posture = OPERATIONAL
      Transition side effect: whenever a recompute CHANGES the posture to OUTAGE,
      every AUTHORIZED FuelingSession at the station -> VOIDED (void_reason STATION_OUTAGE)
      with hold release (FleetAccount.outstanding_balance_cents -= hold_amount_cents,
      FleetAccount.version += 1 per affected session). Recompute is order-insensitive
      (pure aggregate); the void cascade processes sessions in created_at ASC order.
    input_set: "All Compressors and Dispensers of the station regardless of age"
    constants: {}
    precision: "n/a (enum derivation)"

  - name: calibration_outcome
    trigger: "POST /cng/calibration-records"
    algorithm: threshold
    formula: |
      PASS if abs(measured_error_pct) <= TOLERANCE_PCT else FAIL (equality PASSES:
      exactly 0.50 is compliant; 0.51 fails).
      On PASS: applied_correction_factor = 1 - measured_error_pct / 100;
        Dispenser.status -> IN_SERVICE (from any of IN_SERVICE/CALIBRATION_HOLD/OUT_OF_SERVICE);
        correction_factor, last_calibration_at = now, calibration_due_at = now + 90 days.
      On FAIL: applied_correction_factor = null; Dispenser.status -> OUT_OF_SERVICE.
      Both branches recompute Station.uptime_posture (FAIL may trigger the OUTAGE void cascade).
    input_set: "The new CalibrationRecord and its Dispenser"
    constants:
      TOLERANCE_PCT: 0.50
      CALIBRATION_INTERVAL_DAYS: 90
    precision: "measured_error_pct 2 decimal places; correction_factor 4 decimal places"

  - name: daily_card_usage_rollup
    trigger: "Session complete/void; clock sweep on day rollover"
    algorithm: aggregation
    formula: |
      current_day_gge = sum of settled_gge over the card's non-voided COMPLETED/SETTLED
      sessions with completed_at on current_day_date (UTC).
      Maintained incrementally: += settled_gge at complete; -= settled_gge at void of a
      COMPLETED session (floor 0). Clock sweep: if current_day_date < today, reset
      current_day_gge = 0 and current_day_date = today.
    input_set: "FleetCard's sessions for the current UTC day"
    constants: {}
    precision: "3 decimal places"

  - name: backup_capacity_check
    trigger: "POST /cng/backup-arrangements (create)"
    algorithm: interval_merge
    formula: |
      Aggregate-capacity overlap semantics (distinct from maintenance-window pairwise
      semantics): overlapping backup arrangements at the same station are ALLOWED, but
      for the new arrangement A, compute S = sum of committed_gge over existing
      arrangements at the station with status in {RESERVED, ACTIVATED} whose
      [available_from, available_until) half-open interval overlaps A's interval.
      Require S + A.committed_gge <= Station.backup_capacity_gge (equality ALLOWED),
      else ERR_BACKUP_CAPACITY_EXCEEDED.
      Overlap test for half-open intervals: a.from < b.until AND b.from < a.until.
    input_set: "Station's RESERVED/ACTIVATED BackupFuelingArrangements"
    constants: {}
    precision: "integer GGE"

  - name: window_overlap_check
    trigger: "POST /cng/maintenance-windows (create)"
    algorithm: interval_merge
    formula: |
      Pairwise half-open interval semantics WITH turnaround buffer (distinct from
      backup aggregate semantics). Resource key = compressor_id if set, else the
      station itself (compressor-linked windows and whole-station windows never
      conflict with each other). For existing windows W on the same resource with
      status in {SCHEDULED, IN_PROGRESS}:
        overlap: new.starts_at < W.ends_at AND W.starts_at < new.ends_at  -> reject
        adjacency buffer: if new.starts_at >= W.ends_at, require new.starts_at - W.ends_at >= TURNAROUND_HOURS;
                          if W.starts_at >= new.ends_at, require W.starts_at - new.ends_at >= TURNAROUND_HOURS;
                          a gap of exactly TURNAROUND_HOURS is ALLOWED.
      Violation -> ERR_WINDOW_OVERLAP. EMERGENCY windows skip the buffer but not the overlap test.
    input_set: "SCHEDULED/IN_PROGRESS MaintenanceWindows sharing the resource key"
    constants:
      TURNAROUND_HOURS: 2
    precision: "n/a (datetime comparison, UTC)"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and X-User-Role must name a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Caller role must be listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Request shape: required fields present, enum values valid, numeric constraints (> 0 etc.) honored, month strings well-formed YYYY-MM, tier fields only on PRIVATE policies (both-or-neither), fleet_card_id absent on authorize-public"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "Referenced resources exist: path ids left-to-right, then body FKs (dispenser_id, fleet_card_id, station_id, fleet_account_id, compressor_id)"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: all
  - priority: 5
    category: auth
    check: "Entity-backed ownership: FleetDriver X-User-ID must equal the referenced fleet_card_id (and session's card on complete/void); FleetAccountManager X-User-ID must equal the referenced fleet_account_id"
    error_id: "ERR_CARD_OWNERSHIP_MISMATCH | ERR_ACCOUNT_OWNERSHIP_MISMATCH"
    http_status: 403
    applies_to: "card/session/account-scoped endpoints"
  - priority: 6
    category: state
    check: "State preconditions: station ACTIVE where required; dispenser IN_SERVICE at authorize; card ACTIVE; account ACTIVE; session/window/backup/inspection/claim/contract in the transition's required from-state; OCC expected_<parent>_version must equal current parent version (412)"
    error_id: "ERR_STATION_NOT_ACTIVE | ERR_DISPENSER_NOT_IN_SERVICE | ERR_CARD_NOT_ACTIVE | ERR_ACCOUNT_NOT_ACTIVE | ERR_SESSION_NOT_COMPLETABLE | ERR_SESSION_NOT_VOIDABLE | ERR_WINDOW_* | ERR_BACKUP_NOT_* | ERR_INSPECTION_NOT_* | ERR_CLAIM_NOT_* | ERR_CONTRACT_NOT_DRAFT | ERR_CARD_ALREADY_REVOKED | ERR_STALE_STATION_VERSION (412) | ERR_STALE_ACCOUNT_VERSION (412)"
    http_status: 409
    applies_to: "state transition endpoints, authorize, policy create"
  - priority: 7
    category: business_safety
    check: "Safety gates: posture != OUTAGE at authorize (ERR_STATION_OUTAGE); no OVERDUE inspection at station for claim submit / station resume / non-EMERGENCY window create (ERR_OVERDUE_INSPECTION); inspection approver != performer (ERR_SEGREGATION_OF_DUTIES); last-online-compressor window start requires covering ACTIVATED backup (ERR_BACKUP_REQUIRED)"
    error_id: "ERR_STATION_OUTAGE | ERR_OVERDUE_INSPECTION | ERR_SEGREGATION_OF_DUTIES | ERR_BACKUP_REQUIRED"
    http_status: 409
    applies_to: "authorize, authorize-public, claim submit, station resume, window create/start, inspection approve"
  - priority: 8
    category: business_constraint
    check: "Uniqueness/overlap/idempotency: card_number unique (ERR_CARD_NUMBER_EXISTS); window overlap+buffer (ERR_WINDOW_OVERLAP); backup aggregate capacity (ERR_BACKUP_CAPACITY_EXCEEDED); client_ref conflict across different cards (ERR_DUPLICATE_CLIENT_REF); (contract,month) not already settled (ERR_MONTH_ALREADY_SETTLED); claim period must not overlap SUBMITTED/APPROVED claim at station (ERR_CLAIM_PERIOD_OVERLAP); one ACTIVE contract per account+station (ERR_CONTRACT_ALREADY_ACTIVE); station access_mode must include session access_type (ERR_ACCESS_MODE_MISMATCH)"
    error_id: "ERR_CARD_NUMBER_EXISTS | ERR_WINDOW_OVERLAP | ERR_BACKUP_CAPACITY_EXCEEDED | ERR_DUPLICATE_CLIENT_REF | ERR_MONTH_ALREADY_SETTLED | ERR_CLAIM_PERIOD_OVERLAP | ERR_CONTRACT_ALREADY_ACTIVE | ERR_ACCESS_MODE_MISMATCH"
    http_status: 409
    applies_to: "create endpoints, authorize, settle-month, contract activate"
  - priority: 9
    category: business_temporal
    check: "Temporal validity: starts_at < ends_at / effective_from < effective_to / available_from < available_until / period_start < period_end (ERR_INVALID_TIME_RANGE); window start within its time range (ERR_WINDOW_NOT_IN_TIME_RANGE); backup activation within availability (ERR_BACKUP_NOT_IN_WINDOW); settle-month only for months strictly before current month (ERR_MONTH_NOT_CLOSED) and within contract span (ERR_MONTH_OUT_OF_CONTRACT)"
    error_id: "ERR_INVALID_TIME_RANGE | ERR_WINDOW_NOT_IN_TIME_RANGE | ERR_BACKUP_NOT_IN_WINDOW | ERR_MONTH_NOT_CLOSED | ERR_MONTH_OUT_OF_CONTRACT"
    http_status: 422
    applies_to: "window create/start, policy create, backup create/activate, claim create, settle-month"
  - priority: 10
    category: business_fiscal
    check: "Fiscal gates last: credit limit (ERR_CREDIT_LIMIT_EXCEEDED 402); daily card GGE limit (ERR_DAILY_LIMIT_EXCEEDED 409); price resolvable (ERR_NO_ACTIVE_PRICE 422); account close requires zero balance (ERR_OUTSTANDING_BALANCE_NONZERO 409); finalize requires non-empty eligible set (ERR_NO_ELIGIBLE_VOLUME 422); backup draw within committed (ERR_BACKUP_DRAW_EXCEEDED 409)"
    error_id: "ERR_CREDIT_LIMIT_EXCEEDED | ERR_DAILY_LIMIT_EXCEEDED | ERR_NO_ACTIVE_PRICE | ERR_OUTSTANDING_BALANCE_NONZERO | ERR_NO_ELIGIBLE_VOLUME | ERR_BACKUP_DRAW_EXCEEDED"
    http_status: 402
    applies_to: "authorize, account close, claim finalize, backup record-draw"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z (never wall-clock). Setting the clock runs the epoch sweep: session 30-minute hold timeouts -> VOIDED(TIMEOUT); dispenser calibration due -> CALIBRATION_HOLD; policies past effective_to -> EXPIRED; SCHEDULED windows past ends_at -> LAPSED; RESERVED/ACTIVATED backups past available_until -> EXPIRED; SCHEDULED inspections past scheduled_for -> OVERDUE; contracts past end_month -> EXPIRED; card daily usage reset on day rollover; COMPLETED sessions from prior months -> SETTLED."
    roles: [NetworkOperator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, sweeps_applied: integer }
    side_effects: ["Runs all epoch sweeps listed in description; each affected entity increments version"]

  # --- Station ---
  - method: POST
    path: "/cng/stations"
    description: "Create a station (status SETUP, uptime_posture OUTAGE until equipped)"
    roles: [NetworkOperator]
    code: 201
    input: [station_name, station_code, access_mode, backup_capacity_gge]
    output: Station
    side_effects: ["status = SETUP", "uptime_posture = OUTAGE", "version = 1"]
  - method: GET
    path: "/cng/stations"
    description: "List stations"
    roles: [NetworkOperator, StationManager, ComplianceOfficer, FleetAccountManager, FleetDriver]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Station[]"
    side_effects: []
  - method: GET
    path: "/cng/stations/{stationId}"
    description: "Get a station"
    roles: [NetworkOperator, StationManager, ComplianceOfficer, FleetAccountManager, FleetDriver]
    code: 200
    input: []
    output: Station
    side_effects: []
  - method: POST
    path: "/cng/stations/{stationId}/activate"
    description: "Activate a SETUP station (requires >= 1 compressor and >= 1 dispenser)"
    roles: [NetworkOperator]
    code: 200
    input: []
    output: Station
    side_effects: ["status SETUP -> ACTIVE", "increments Station.version by 1", "recompute uptime_posture"]
  - method: POST
    path: "/cng/stations/{stationId}/suspend"
    description: "Suspend an ACTIVE station; voids its AUTHORIZED sessions (MANAGER_VOID) with hold release"
    roles: [NetworkOperator]
    code: 200
    input: []
    output: Station
    side_effects: ["status ACTIVE -> SUSPENDED", "increments Station.version by 1", "void cascade on AUTHORIZED sessions with hold release"]
  - method: POST
    path: "/cng/stations/{stationId}/resume"
    description: "Resume a SUSPENDED station (blocked while any inspection OVERDUE)"
    roles: [NetworkOperator]
    code: 200
    input: []
    output: Station
    side_effects: ["status SUSPENDED -> ACTIVE", "increments Station.version by 1"]

  # --- Compressor ---
  - method: POST
    path: "/cng/compressors"
    description: "Create a compressor (condition ONLINE)"
    roles: [StationManager]
    code: 201
    input: [station_id, compressor_code, capacity_scf_per_minute]
    output: Compressor
    side_effects: ["condition = ONLINE", "recompute Station.uptime_posture"]
  - method: GET
    path: "/cng/compressors"
    description: "List compressors"
    roles: [NetworkOperator, StationManager, ComplianceOfficer, FleetAccountManager, FleetDriver]
    code: 200
    input: ["station_id?", "condition?", "limit?", "offset?"]
    output: "Compressor[]"
    side_effects: []
  - method: GET
    path: "/cng/compressors/{compressorId}"
    description: "Get a compressor"
    roles: [NetworkOperator, StationManager, ComplianceOfficer, FleetAccountManager, FleetDriver]
    code: 200
    input: []
    output: Compressor
    side_effects: []
  - method: POST
    path: "/cng/compressors/{compressorId}/report-condition"
    description: "Report compressor condition (ONLINE | DEGRADED | OFFLINE); blocked while UNDER_MAINTENANCE"
    roles: [StationManager]
    code: 200
    input: [condition]
    output: Compressor
    side_effects: ["condition updated", "increments Compressor.version by 1", "recompute Station.uptime_posture with possible OUTAGE void cascade"]

  # --- Dispenser ---
  - method: POST
    path: "/cng/dispensers"
    description: "Create a dispenser (IN_SERVICE; calibration_due_at = now + 90 days)"
    roles: [StationManager]
    code: 201
    input: [station_id, dispenser_code, fuel_type]
    output: Dispenser
    side_effects: ["status = IN_SERVICE", "correction_factor = 1.0", "recompute Station.uptime_posture"]
  - method: GET
    path: "/cng/dispensers"
    description: "List dispensers"
    roles: [NetworkOperator, StationManager, ComplianceOfficer, FleetAccountManager, FleetDriver]
    code: 200
    input: ["station_id?", "status?", "fuel_type?", "limit?", "offset?"]
    output: "Dispenser[]"
    side_effects: []
  - method: GET
    path: "/cng/dispensers/{dispenserId}"
    description: "Get a dispenser"
    roles: [NetworkOperator, StationManager, ComplianceOfficer, FleetAccountManager, FleetDriver]
    code: 200
    input: []
    output: Dispenser
    side_effects: []

  # --- CalibrationRecord ---
  - method: POST
    path: "/cng/calibration-records"
    description: "Record a dispenser calibration; PASS refreshes correction factor and clears holds, FAIL sets OUT_OF_SERVICE"
    roles: [StationManager]
    code: 201
    input: [dispenser_id, measured_error_pct]
    output: CalibrationRecord
    side_effects: ["result computed (PASS iff abs(error) <= 0.50)", "PASS: dispenser -> IN_SERVICE with new correction_factor and due date", "FAIL: dispenser -> OUT_OF_SERVICE", "recompute Station.uptime_posture with possible OUTAGE void cascade"]
  - method: GET
    path: "/cng/calibration-records"
    description: "List calibration records"
    roles: [NetworkOperator, StationManager, ComplianceOfficer, FleetAccountManager, FleetDriver]
    code: 200
    input: ["dispenser_id?", "result?", "limit?", "offset?"]
    output: "CalibrationRecord[]"
    side_effects: []
  - method: GET
    path: "/cng/calibration-records/{recordId}"
    description: "Get a calibration record"
    roles: [NetworkOperator, StationManager, ComplianceOfficer, FleetAccountManager, FleetDriver]
    code: 200
    input: []
    output: CalibrationRecord
    side_effects: []

  # --- PricingPolicy ---
  - method: POST
    path: "/cng/pricing-policies"
    description: "Create an ACTIVE pricing policy; supersedes the existing ACTIVE policy with the same (station_id, access_scope, fuel_type); OCC on Station.version"
    roles: [NetworkOperator]
    code: 201
    input: [station_id, access_scope, fuel_type, price_per_gge_cents, effective_from, effective_to, "tier_threshold_gge?", "tier_price_cents?", expected_station_version]
    output: PricingPolicy
    side_effects: ["same-key ACTIVE policy -> SUPERSEDED (its version += 1)", "increments Station.version by 1"]
  - method: GET
    path: "/cng/pricing-policies"
    description: "List pricing policies"
    roles: [NetworkOperator, StationManager, ComplianceOfficer, FleetAccountManager, FleetDriver]
    code: 200
    input: ["station_id?", "access_scope?", "status?", "limit?", "offset?"]
    output: "PricingPolicy[]"
    side_effects: []
  - method: GET
    path: "/cng/pricing-policies/{policyId}"
    description: "Get a pricing policy"
    roles: [NetworkOperator, StationManager, ComplianceOfficer, FleetAccountManager, FleetDriver]
    code: 200
    input: []
    output: PricingPolicy
    side_effects: []

  # --- FleetAccount ---
  - method: POST
    path: "/cng/fleet-accounts"
    description: "Create a fleet account (ACTIVE, balance 0)"
    roles: [NetworkOperator]
    code: 201
    input: [account_name, billing_email, credit_limit_cents]
    output: FleetAccount
    side_effects: ["status = ACTIVE", "outstanding_balance_cents = 0"]
  - method: GET
    path: "/cng/fleet-accounts"
    description: "List fleet accounts; FleetAccountManager and FleetDriver are auto-scoped to accounts linked to their identity"
    roles: [NetworkOperator, StationManager, ComplianceOfficer, FleetAccountManager, FleetDriver]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "FleetAccount[]"
    side_effects: []
  - method: GET
    path: "/cng/fleet-accounts/{accountId}"
    description: "Get a fleet account; FleetAccountManager/FleetDriver restricted to their own account"
    roles: [NetworkOperator, StationManager, ComplianceOfficer, FleetAccountManager, FleetDriver]
    code: 200
    input: []
    output: FleetAccount
    side_effects: []
  - method: POST
    path: "/cng/fleet-accounts/{accountId}/suspend"
    description: "Suspend an ACTIVE account"
    roles: [NetworkOperator]
    code: 200
    input: []
    output: FleetAccount
    side_effects: ["status ACTIVE -> SUSPENDED", "increments FleetAccount.version by 1"]
  - method: POST
    path: "/cng/fleet-accounts/{accountId}/resume"
    description: "Resume a SUSPENDED account"
    roles: [NetworkOperator]
    code: 200
    input: []
    output: FleetAccount
    side_effects: ["status SUSPENDED -> ACTIVE", "increments FleetAccount.version by 1"]
  - method: POST
    path: "/cng/fleet-accounts/{accountId}/close"
    description: "Close an ACTIVE account with zero balance; revokes all its non-REVOKED cards"
    roles: [NetworkOperator]
    code: 200
    input: []
    output: FleetAccount
    side_effects: ["status ACTIVE -> CLOSED", "increments FleetAccount.version by 1", "cascade: non-REVOKED cards -> REVOKED"]

  # --- FleetCard ---
  - method: POST
    path: "/cng/fleet-cards"
    description: "Issue a fleet card (ACTIVE); FleetAccountManager may only create for own account"
    roles: [FleetAccountManager, NetworkOperator]
    code: 201
    input: [fleet_account_id, card_number, vehicle_plate, daily_gge_limit]
    output: FleetCard
    side_effects: ["status = ACTIVE", "current_day_gge = 0, current_day_date = today"]
  - method: GET
    path: "/cng/fleet-cards"
    description: "List fleet cards; FleetAccountManager scoped to own account, FleetDriver to own card"
    roles: [NetworkOperator, StationManager, FleetAccountManager, FleetDriver]
    code: 200
    input: ["fleet_account_id?", "status?", "limit?", "offset?"]
    output: "FleetCard[]"
    side_effects: []
  - method: GET
    path: "/cng/fleet-cards/{cardId}"
    description: "Get a fleet card; ownership-scoped for FleetAccountManager/FleetDriver"
    roles: [NetworkOperator, StationManager, FleetAccountManager, FleetDriver]
    code: 200
    input: []
    output: FleetCard
    side_effects: []
  - method: POST
    path: "/cng/fleet-cards/{cardId}/set-status"
    description: "Transition card status: ACTIVE <-> SUSPENDED, any non-REVOKED -> REVOKED"
    roles: [FleetAccountManager, NetworkOperator]
    code: 200
    input: [to_status]
    output: FleetCard
    side_effects: ["status transition per FleetCard state machine", "increments FleetCard.version by 1"]

  # --- SupplyContract / MonthlySettlement ---
  - method: POST
    path: "/cng/supply-contracts"
    description: "Create a supply contract (DRAFT)"
    roles: [NetworkOperator]
    code: 201
    input: [fleet_account_id, station_id, committed_monthly_gge, contract_price_per_gge_cents, shortfall_tier1_rate_cents, shortfall_tier2_rate_cents, start_month, end_month]
    output: SupplyContract
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/cng/supply-contracts"
    description: "List supply contracts; FleetAccountManager scoped to own account"
    roles: [NetworkOperator, StationManager, ComplianceOfficer, FleetAccountManager]
    code: 200
    input: ["fleet_account_id?", "station_id?", "status?", "limit?", "offset?"]
    output: "SupplyContract[]"
    side_effects: []
  - method: GET
    path: "/cng/supply-contracts/{contractId}"
    description: "Get a supply contract"
    roles: [NetworkOperator, StationManager, ComplianceOfficer, FleetAccountManager]
    code: 200
    input: []
    output: SupplyContract
    side_effects: []
  - method: POST
    path: "/cng/supply-contracts/{contractId}/activate"
    description: "Activate a DRAFT contract (requires ACTIVE account and station, no other ACTIVE contract for the pair)"
    roles: [NetworkOperator]
    code: 200
    input: []
    output: SupplyContract
    side_effects: ["status DRAFT -> ACTIVE", "increments SupplyContract.version by 1"]
  - method: POST
    path: "/cng/supply-contracts/{contractId}/settle-month"
    description: "Settle a past month: compute delivered/shortfall/tiered penalty, create MonthlySettlement, post penalty to account balance"
    roles: [NetworkOperator]
    code: 201
    input: [month]
    output: MonthlySettlement
    side_effects: ["creates MonthlySettlement", "FleetAccount.outstanding_balance_cents += penalty_cents", "increments FleetAccount.version by 1"]
  - method: GET
    path: "/cng/monthly-settlements"
    description: "List monthly settlements; FleetAccountManager scoped to own account"
    roles: [NetworkOperator, StationManager, ComplianceOfficer, FleetAccountManager]
    code: 200
    input: ["supply_contract_id?", "month?", "limit?", "offset?"]
    output: "MonthlySettlement[]"
    side_effects: []
  - method: GET
    path: "/cng/monthly-settlements/{settlementId}"
    description: "Get a monthly settlement"
    roles: [NetworkOperator, StationManager, ComplianceOfficer, FleetAccountManager]
    code: 200
    input: []
    output: MonthlySettlement
    side_effects: []

  # --- FuelingSession ---
  - method: POST
    path: "/cng/fueling-sessions/authorize"
    description: "Authorize a PRIVATE fleet-card fueling session; resolves and snapshots unit price, posts hold, OCC on FleetAccount.version. Idempotent on (station, client_ref) for the same card."
    roles: [FleetDriver]
    code: 201
    input: [fleet_card_id, dispenser_id, client_ref, estimated_gge, expected_fleet_account_version]
    output: FuelingSession
    side_effects: ["status = AUTHORIZED", "unit_price_cents snapshot per fueling_unit_price_resolution", "hold_amount_cents posted to FleetAccount.outstanding_balance_cents", "increments FleetAccount.version by 1"]
  - method: POST
    path: "/cng/fueling-sessions/authorize-public"
    description: "Authorize a PUBLIC (retail, cardless) fueling session; no hold, no account. Idempotent on (station, client_ref)."
    roles: [Anonymous]
    code: 201
    input: [dispenser_id, client_ref, estimated_gge]
    output: FuelingSession
    side_effects: ["status = AUTHORIZED", "unit_price_cents snapshot from PUBLIC policy", "hold_amount_cents = 0"]
  - method: POST
    path: "/cng/fueling-sessions/{sessionId}/complete"
    description: "Complete an AUTHORIZED session with the metered mass; computes GGE variants and total"
    roles: [FleetDriver, Anonymous]
    code: 200
    input: [metered_mass_kg]
    output: FuelingSession
    side_effects: ["provisional_gge and settled_gge computed", "total_amount_cents computed", "PRIVATE: balance += total - hold (FleetAccount.version += 1)", "PRIVATE: card current_day_gge += settled_gge", "status -> COMPLETED"]
  - method: POST
    path: "/cng/fueling-sessions/{sessionId}/void"
    description: "Void an AUTHORIZED (hold release) or COMPLETED (refund + usage reversal) session"
    roles: [FleetDriver, Anonymous, StationManager]
    code: 200
    input: ["reason?"]
    output: FuelingSession
    side_effects: ["AUTHORIZED: balance -= hold; COMPLETED: balance -= total and card current_day_gge -= settled_gge", "PRIVATE voids increment FleetAccount.version by 1", "status -> VOIDED"]
  - method: GET
    path: "/cng/fueling-sessions"
    description: "List fueling sessions with filters; FleetAccountManager scoped to own account, FleetDriver to own card"
    roles: [NetworkOperator, StationManager, ComplianceOfficer, FleetAccountManager, FleetDriver]
    code: 200
    input: ["station_id?", "fleet_account_id?", "fleet_card_id?", "dispenser_id?", "status?", "month?", "limit?", "offset?"]
    output: "FuelingSession[]"
    side_effects: []
  - method: GET
    path: "/cng/fueling-sessions/{sessionId}"
    description: "Get a fueling session; ownership-scoped for FleetAccountManager/FleetDriver"
    roles: [NetworkOperator, StationManager, ComplianceOfficer, FleetAccountManager, FleetDriver]
    code: 200
    input: []
    output: FuelingSession
    side_effects: []

  # --- MaintenanceWindow ---
  - method: POST
    path: "/cng/maintenance-windows"
    description: "Schedule a maintenance window; pairwise half-open overlap + 2h turnaround buffer on the same resource; non-EMERGENCY blocked by OVERDUE inspections"
    roles: [StationManager]
    code: 201
    input: [station_id, "compressor_id?", starts_at, ends_at, window_type]
    output: MaintenanceWindow
    side_effects: ["status = SCHEDULED"]
  - method: GET
    path: "/cng/maintenance-windows"
    description: "List maintenance windows"
    roles: [NetworkOperator, StationManager, ComplianceOfficer, FleetAccountManager, FleetDriver]
    code: 200
    input: ["station_id?", "compressor_id?", "status?", "limit?", "offset?"]
    output: "MaintenanceWindow[]"
    side_effects: []
  - method: GET
    path: "/cng/maintenance-windows/{windowId}"
    description: "Get a maintenance window"
    roles: [NetworkOperator, StationManager, ComplianceOfficer, FleetAccountManager, FleetDriver]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: []
  - method: POST
    path: "/cng/maintenance-windows/{windowId}/start"
    description: "Start a SCHEDULED window inside its time range; drives linked compressor UNDER_MAINTENANCE and possible OUTAGE void cascade; non-EMERGENCY on last online compressor requires covering ACTIVATED backup"
    roles: [StationManager]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: ["status -> IN_PROGRESS", "linked compressor -> UNDER_MAINTENANCE", "recompute posture; OUTAGE voids AUTHORIZED sessions with hold release"]
  - method: POST
    path: "/cng/maintenance-windows/{windowId}/complete"
    description: "Complete an IN_PROGRESS window; linked compressor returns ONLINE"
    roles: [StationManager]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: ["status -> COMPLETED", "linked compressor -> ONLINE", "recompute posture"]
  - method: POST
    path: "/cng/maintenance-windows/{windowId}/cancel"
    description: "Cancel a SCHEDULED window"
    roles: [StationManager]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: ["status -> CANCELLED"]

  # --- BackupFuelingArrangement ---
  - method: POST
    path: "/cng/backup-arrangements"
    description: "Reserve backup fueling capacity; aggregate committed_gge of overlapping RESERVED/ACTIVATED arrangements must fit station backup_capacity_gge"
    roles: [StationManager]
    code: 201
    input: [station_id, partner_station_code, available_from, available_until, committed_gge]
    output: BackupFuelingArrangement
    side_effects: ["status = RESERVED", "used_gge = 0"]
  - method: GET
    path: "/cng/backup-arrangements"
    description: "List backup fueling arrangements"
    roles: [NetworkOperator, StationManager, ComplianceOfficer, FleetAccountManager, FleetDriver]
    code: 200
    input: ["station_id?", "status?", "limit?", "offset?"]
    output: "BackupFuelingArrangement[]"
    side_effects: []
  - method: GET
    path: "/cng/backup-arrangements/{arrangementId}"
    description: "Get a backup fueling arrangement"
    roles: [NetworkOperator, StationManager, ComplianceOfficer, FleetAccountManager, FleetDriver]
    code: 200
    input: []
    output: BackupFuelingArrangement
    side_effects: []
  - method: POST
    path: "/cng/backup-arrangements/{arrangementId}/activate"
    description: "Activate a RESERVED arrangement within its availability window"
    roles: [StationManager]
    code: 200
    input: []
    output: BackupFuelingArrangement
    side_effects: ["status RESERVED -> ACTIVATED"]
  - method: POST
    path: "/cng/backup-arrangements/{arrangementId}/record-draw"
    description: "Record a partner-station backup draw; used_gge + gge_amount must not exceed committed_gge (equality allowed)"
    roles: [StationManager]
    code: 200
    input: [gge_amount]
    output: BackupFuelingArrangement
    side_effects: ["used_gge += gge_amount", "increments BackupFuelingArrangement.version by 1"]
  - method: POST
    path: "/cng/backup-arrangements/{arrangementId}/release"
    description: "Release an ACTIVATED arrangement; freezes used_gge"
    roles: [StationManager]
    code: 200
    input: []
    output: BackupFuelingArrangement
    side_effects: ["status ACTIVATED -> RELEASED"]

  # --- SafetyInspection ---
  - method: POST
    path: "/cng/safety-inspections"
    description: "Schedule a safety inspection (SCHEDULED)"
    roles: [StationManager]
    code: 201
    input: [station_id, inspection_type, scheduled_for]
    output: SafetyInspection
    side_effects: ["status = SCHEDULED"]
  - method: GET
    path: "/cng/safety-inspections"
    description: "List safety inspections"
    roles: [NetworkOperator, StationManager, ComplianceOfficer, FleetAccountManager, FleetDriver]
    code: 200
    input: ["station_id?", "status?", "inspection_type?", "limit?", "offset?"]
    output: "SafetyInspection[]"
    side_effects: []
  - method: GET
    path: "/cng/safety-inspections/{inspectionId}"
    description: "Get a safety inspection"
    roles: [NetworkOperator, StationManager, ComplianceOfficer, FleetAccountManager, FleetDriver]
    code: 200
    input: []
    output: SafetyInspection
    side_effects: []
  - method: POST
    path: "/cng/safety-inspections/{inspectionId}/complete"
    description: "Record inspection result from SCHEDULED or OVERDUE; stamps performed_by with caller X-User-ID"
    roles: [StationManager]
    code: 200
    input: [result, "findings?"]
    output: SafetyInspection
    side_effects: ["status -> COMPLETED", "performed_by = X-User-ID", "completed_at = now"]
  - method: POST
    path: "/cng/safety-inspections/{inspectionId}/approve"
    description: "Approve a COMPLETED inspection; approver must differ from performer; FAIL suspends the station and voids its AUTHORIZED sessions; PASS auto-schedules the next inspection of the same type"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: SafetyInspection
    side_effects: ["status -> APPROVED", "approved_by = X-User-ID", "FAIL: station SUSPENDED + AUTHORIZED sessions VOIDED (INSPECTION_FAIL) with hold release", "PASS/PASS_WITH_DEFICIENCIES: auto-create next inspection (+365d annual, +90d odorization, +730d pressure vessel)"]

  # --- TaxCreditClaim ---
  - method: POST
    path: "/cng/tax-credit-claims"
    description: "Create a DRAFT claim with provisional amounts; period must not overlap a SUBMITTED/APPROVED claim at the station"
    roles: [StationManager]
    code: 201
    input: [station_id, period_start, period_end]
    output: TaxCreditClaim
    side_effects: ["status = DRAFT", "provisional variant computed"]
  - method: GET
    path: "/cng/tax-credit-claims"
    description: "List tax credit claims"
    roles: [NetworkOperator, StationManager, ComplianceOfficer]
    code: 200
    input: ["station_id?", "status?", "limit?", "offset?"]
    output: "TaxCreditClaim[]"
    side_effects: []
  - method: GET
    path: "/cng/tax-credit-claims/{claimId}"
    description: "Get a tax credit claim"
    roles: [NetworkOperator, StationManager, ComplianceOfficer]
    code: 200
    input: []
    output: TaxCreditClaim
    side_effects: []
  - method: POST
    path: "/cng/tax-credit-claims/{claimId}/finalize"
    description: "Finalize a DRAFT claim: compute final variant from SETTLED sessions excluding sessions captured by other open claims"
    roles: [StationManager]
    code: 200
    input: []
    output: TaxCreditClaim
    side_effects: ["eligible_gge_final and claim_amount_final_cents computed", "status DRAFT -> FINALIZED"]
  - method: POST
    path: "/cng/tax-credit-claims/{claimId}/submit"
    description: "Submit a FINALIZED claim; requires station ACTIVE and no OVERDUE inspections"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: TaxCreditClaim
    side_effects: ["status FINALIZED -> SUBMITTED"]
  - method: POST
    path: "/cng/tax-credit-claims/{claimId}/decision"
    description: "Approve or reject a SUBMITTED claim"
    roles: [NetworkOperator]
    code: 200
    input: [outcome, "reason?"]
    output: TaxCreditClaim
    side_effects: ["status SUBMITTED -> APPROVED | REJECTED", "decision_reason recorded"]
  - method: POST
    path: "/cng/tax-credit-claims/{claimId}/reopen"
    description: "Reopen a REJECTED claim to DRAFT; recomputes provisional amounts, clears final fields"
    roles: [StationManager]
    code: 200
    input: []
    output: TaxCreditClaim
    side_effects: ["status REJECTED -> DRAFT", "provisional recomputed", "final fields nulled"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not a declared role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role not permitted for this endpoint (incl. PUBLIC session completed by non-Anonymous)" }
  - { id: ERR_ACCOUNT_OWNERSHIP_MISMATCH, http: 403, condition: "FleetAccountManager X-User-ID does not match the referenced fleet_account_id" }
  - { id: ERR_CARD_OWNERSHIP_MISMATCH, http: 403, condition: "FleetDriver X-User-ID does not match the referenced fleet_card_id (authorize) or the session's card (complete/void)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, non-positive numeric input, malformed YYYY-MM month, tier fields on PUBLIC policy, fleet_card_id sent to authorize-public" }
  - { id: ERR_STATION_NOT_FOUND, http: 404, condition: "Station id does not exist" }
  - { id: ERR_COMPRESSOR_NOT_FOUND, http: 404, condition: "Compressor id does not exist" }
  - { id: ERR_DISPENSER_NOT_FOUND, http: 404, condition: "Dispenser id does not exist" }
  - { id: ERR_CALIBRATION_RECORD_NOT_FOUND, http: 404, condition: "Calibration record id does not exist" }
  - { id: ERR_PRICING_POLICY_NOT_FOUND, http: 404, condition: "Pricing policy id does not exist" }
  - { id: ERR_FLEET_ACCOUNT_NOT_FOUND, http: 404, condition: "Fleet account id does not exist" }
  - { id: ERR_FLEET_CARD_NOT_FOUND, http: 404, condition: "Fleet card id does not exist" }
  - { id: ERR_SUPPLY_CONTRACT_NOT_FOUND, http: 404, condition: "Supply contract id does not exist" }
  - { id: ERR_MONTHLY_SETTLEMENT_NOT_FOUND, http: 404, condition: "Monthly settlement id does not exist" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "Fueling session id does not exist" }
  - { id: ERR_MAINTENANCE_WINDOW_NOT_FOUND, http: 404, condition: "Maintenance window id does not exist" }
  - { id: ERR_BACKUP_ARRANGEMENT_NOT_FOUND, http: 404, condition: "Backup arrangement id does not exist" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "Safety inspection id does not exist" }
  - { id: ERR_TAX_CLAIM_NOT_FOUND, http: 404, condition: "Tax credit claim id does not exist" }
  - { id: ERR_STATION_NOT_IN_SETUP, http: 409, condition: "Station activate requires SETUP status" }
  - { id: ERR_STATION_NOT_EQUIPPED, http: 409, condition: "Station activate requires at least one compressor and one dispenser" }
  - { id: ERR_STATION_NOT_ACTIVE, http: 409, condition: "Operation requires station status ACTIVE (covers authorize on SETUP/SUSPENDED station, contract activate, claim submit, policy create)" }
  - { id: ERR_STATION_NOT_SUSPENDED, http: 409, condition: "Station resume requires SUSPENDED status" }
  - { id: ERR_COMPRESSOR_UNDER_MAINTENANCE, http: 409, condition: "report-condition or window start on a compressor already UNDER_MAINTENANCE" }
  - { id: ERR_DISPENSER_NOT_IN_SERVICE, http: 409, condition: "Authorize requires dispenser status IN_SERVICE" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "Operation requires fleet account ACTIVE (authorize, card create, card resume, contract activate, account suspend/close from non-ACTIVE)" }
  - { id: ERR_ACCOUNT_NOT_SUSPENDED, http: 409, condition: "Account resume requires SUSPENDED status" }
  - { id: ERR_CARD_NOT_ACTIVE, http: 409, condition: "Authorize requires card status ACTIVE" }
  - { id: ERR_CARD_ALREADY_REVOKED, http: 409, condition: "Any set-status on a REVOKED card" }
  - { id: ERR_CONTRACT_NOT_DRAFT, http: 409, condition: "Contract activate requires DRAFT status" }
  - { id: ERR_CONTRACT_ALREADY_ACTIVE, http: 409, condition: "Another ACTIVE contract already covers this (fleet_account_id, station_id)" }
  - { id: ERR_SESSION_NOT_COMPLETABLE, http: 409, condition: "Complete requires session AUTHORIZED" }
  - { id: ERR_SESSION_NOT_VOIDABLE, http: 409, condition: "Void requires session AUTHORIZED or COMPLETED (SETTLED/VOIDED are terminal)" }
  - { id: ERR_WINDOW_NOT_STARTABLE, http: 409, condition: "Window start requires SCHEDULED" }
  - { id: ERR_WINDOW_NOT_IN_TIME_RANGE, http: 409, condition: "Window start requires starts_at <= now < ends_at" }
  - { id: ERR_WINDOW_NOT_COMPLETABLE, http: 409, condition: "Window complete requires IN_PROGRESS" }
  - { id: ERR_WINDOW_NOT_CANCELLABLE, http: 409, condition: "Window cancel requires SCHEDULED" }
  - { id: ERR_BACKUP_NOT_ACTIVATABLE, http: 409, condition: "Backup activate requires RESERVED" }
  - { id: ERR_BACKUP_NOT_IN_WINDOW, http: 409, condition: "Backup activate requires available_from <= now <= available_until" }
  - { id: ERR_BACKUP_NOT_ACTIVE, http: 409, condition: "record-draw requires ACTIVATED arrangement" }
  - { id: ERR_BACKUP_NOT_RELEASABLE, http: 409, condition: "Backup release requires ACTIVATED" }
  - { id: ERR_INSPECTION_NOT_COMPLETABLE, http: 409, condition: "Inspection complete requires SCHEDULED or OVERDUE" }
  - { id: ERR_INSPECTION_NOT_APPROVABLE, http: 409, condition: "Inspection approve requires COMPLETED" }
  - { id: ERR_CLAIM_NOT_FINALIZABLE, http: 409, condition: "Claim finalize requires DRAFT" }
  - { id: ERR_CLAIM_NOT_SUBMITTABLE, http: 409, condition: "Claim submit requires FINALIZED" }
  - { id: ERR_CLAIM_NOT_DECIDABLE, http: 409, condition: "Claim decision requires SUBMITTED" }
  - { id: ERR_CLAIM_NOT_REOPENABLE, http: 409, condition: "Claim reopen requires REJECTED" }
  - { id: ERR_STALE_STATION_VERSION, http: 412, condition: "expected_station_version does not match current Station.version (OCC)" }
  - { id: ERR_STALE_ACCOUNT_VERSION, http: 412, condition: "expected_fleet_account_version does not match current FleetAccount.version (OCC)" }
  - { id: ERR_STATION_OUTAGE, http: 409, condition: "Authorize rejected while station uptime_posture == OUTAGE" }
  - { id: ERR_OVERDUE_INSPECTION, http: 409, condition: "Station has an OVERDUE safety inspection (blocks claim submit, station resume, non-EMERGENCY window create)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Inspection approver X-User-ID equals performed_by" }
  - { id: ERR_BACKUP_REQUIRED, http: 409, condition: "Starting a non-EMERGENCY window on the station's last online compressor requires a covering ACTIVATED backup arrangement" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "Maintenance window overlaps or violates the 2-hour turnaround buffer against a SCHEDULED/IN_PROGRESS window on the same resource" }
  - { id: ERR_BACKUP_CAPACITY_EXCEEDED, http: 409, condition: "Aggregate committed_gge of overlapping arrangements would exceed station backup_capacity_gge" }
  - { id: ERR_DUPLICATE_CLIENT_REF, http: 409, condition: "client_ref already used at this station by a different card/access session" }
  - { id: ERR_CARD_NUMBER_EXISTS, http: 409, condition: "card_number already registered" }
  - { id: ERR_MONTH_ALREADY_SETTLED, http: 409, condition: "A MonthlySettlement already exists for this contract and month" }
  - { id: ERR_CLAIM_PERIOD_OVERLAP, http: 409, condition: "Claim period overlaps a SUBMITTED or APPROVED claim at the same station" }
  - { id: ERR_ACCESS_MODE_MISMATCH, http: 409, condition: "Station access_mode does not serve the requested session access type" }
  - { id: ERR_INVALID_TIME_RANGE, http: 422, condition: "start >= end on window/policy/backup/claim time ranges, or end_month < start_month" }
  - { id: ERR_MONTH_NOT_CLOSED, http: 409, condition: "settle-month only allowed for months strictly before the current logical month" }
  - { id: ERR_MONTH_OUT_OF_CONTRACT, http: 409, condition: "Settled month outside [start_month, end_month]" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "outstanding_balance_cents + hold_amount_cents > credit_limit_cents at authorize" }
  - { id: ERR_DAILY_LIMIT_EXCEEDED, http: 409, condition: "card current_day_gge + estimated_gge > daily_gge_limit at authorize" }
  - { id: ERR_NO_ACTIVE_PRICE, http: 422, condition: "No ACTIVE pricing policy (and no covering contract, for PRIVATE) resolves a unit price at authorize" }
  - { id: ERR_OUTSTANDING_BALANCE_NONZERO, http: 409, condition: "Account close requires outstanding_balance_cents == 0" }
  - { id: ERR_NO_ELIGIBLE_VOLUME, http: 422, condition: "Claim finalize found zero eligible SETTLED sessions" }
  - { id: ERR_BACKUP_DRAW_EXCEEDED, http: 409, condition: "used_gge + gge_amount would exceed committed_gge" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: NetworkOperator
    description: "Network-level operator (Clean Energy central ops): stations, pricing, accounts, contracts, claim decisions, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /cng/stations, /activate, /suspend, /resume"
      - "POST /cng/pricing-policies"
      - "POST /cng/fleet-accounts, /suspend, /resume, /close"
      - "POST /cng/supply-contracts, /activate, /settle-month"
      - "POST /cng/tax-credit-claims/{id}/decision"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET list/detail endpoints"
      - "POST /cng/fleet-cards and /set-status (shared with FleetAccountManager)"
  - name: StationManager
    description: "Station-level operator: equipment, calibrations, maintenance windows, backup arrangements, inspections (performer), claim drafting/finalization"
    identity: opaque
    exclusive_operations:
      - "POST /cng/compressors, /report-condition"
      - "POST /cng/dispensers, /cng/calibration-records"
      - "POST /cng/maintenance-windows, /start, /complete, /cancel"
      - "POST /cng/backup-arrangements, /activate, /record-draw, /release"
      - "POST /cng/safety-inspections, /complete"
      - "POST /cng/tax-credit-claims, /finalize, /reopen"
    shared_operations:
      - "All GET list/detail endpoints"
      - "POST /cng/fueling-sessions/{id}/void (shared with FleetDriver, Anonymous)"
  - name: ComplianceOfficer
    description: "Compliance reviewer: approves inspections (never own), submits finalized claims"
    identity: opaque
    exclusive_operations:
      - "POST /cng/safety-inspections/{id}/approve"
      - "POST /cng/tax-credit-claims/{id}/submit"
    shared_operations:
      - "All GET list/detail endpoints"
  - name: FleetAccountManager
    description: "Fleet-side account administrator; X-User-ID equals the FleetAccount.id they manage"
    identity: "entity_backed:FleetAccount"
    exclusive_operations: []
    shared_operations:
      - "POST /cng/fleet-cards and /set-status (own account only)"
      - "GET endpoints scoped to own account/cards/sessions/contracts/settlements"
  - name: FleetDriver
    description: "Card-carrying driver; X-User-ID equals the FleetCard.id they fuel with"
    identity: "entity_backed:FleetCard"
    exclusive_operations:
      - "POST /cng/fueling-sessions/authorize (own card only)"
    shared_operations:
      - "POST /cng/fueling-sessions/{id}/complete and /void (own card's sessions)"
      - "GET endpoints scoped to own card's sessions and own account"
  - name: Anonymous
    description: "Unauthenticated retail customer at a public dispenser; X-User-ID is an opaque pump-side identifier"
    identity: opaque
    exclusive_operations:
      - "POST /cng/fueling-sessions/authorize-public"
    shared_operations:
      - "POST /cng/fueling-sessions/{id}/complete and /void (PUBLIC sessions only)"
