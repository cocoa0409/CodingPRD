              payload: {}
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { err_1: $.data.error_id }
            - call: "GET /records-of-decision/11111111-0000-4000-8000-000000000002"
              payload: {}
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { err_2: $.data.error_id }
            - call: "GET /allocation-rounds/11111111-0000-4000-8000-000000000003"
