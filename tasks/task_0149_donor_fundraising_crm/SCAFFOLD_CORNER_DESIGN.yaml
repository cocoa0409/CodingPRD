              captures: { d1: $.data.id }
            - call: "POST /donors"
              payload: { full_name: "Pm2", email: "pm2@x.com" }
              as: GiftAdmin
              captures: { d2: $.data.id }
            - call: "POST /pledges"
              payload: { donor_id: "${d1}", campaign_id: "${camp}", total_amount_cents: 10000, installment_count: 2, frequency: "MONTHLY", schedule_basis: "FRONT_LOADED" }
              as: GiftAdmin
              captures: { pl: $.data.id }
