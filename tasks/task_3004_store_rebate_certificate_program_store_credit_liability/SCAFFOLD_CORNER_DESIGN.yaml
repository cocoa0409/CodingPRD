            - call: "POST /stores/${s}/rebate-programs"
              payload: { name: "W", week_start_date: "2026-09-07", week_end_date: "2026-09-14" }
              as: StoreAdmin
              captures: { p: $.data.id }
            - call: "POST /stores/${s}/rebate-programs/${p}/items"
              payload: { sku: "AAA", rebate_pct: 0.11 }
              as: StoreAdmin
            - call: "POST /stores/${s}/rebate-programs/${p}/activate"
              payload: {}
              as: StoreAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T12:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores/${s}/credit-accounts"
              payload: { owner_name: "Ann", account_type: "RETAIL" }
              as: GuestService
              captures: { ac: $.data.id }
            - call: "POST /stores/${s}/receipts"
              payload: { receipt_number: "R-ERR3-1", account_id: "${ac}", purchase_at: "2026-09-08T10:00:00Z", lines: [ { line_number: 1, sku: "AAA", category: "TOOLS", quantity: 1, unit_price_cents: 10000, tender_splits: [ { tender_type: "CASH", amount_cents: 10000 } ] } ] }
              as: GuestService
              captures: { r1: $.data.id }
            - call: "POST /stores/${s}/receipts"
              payload: { receipt_number: "R-ERR3-2", account_id: "${ac}", purchase_at: "2026-09-08T11:00:00Z", lines: [ { line_number: 1, sku: "AAA", category: "TOOLS", quantity: 1, unit_price_cents: 5000, tender_splits: [ { tender_type: "CASH", amount_cents: 5000 } ] } ] }
              as: GuestService
              captures: { r2: $.data.id }
            - call: "POST /stores/${s}/rebate-submissions"
              payload: { receipt_id: "${r1}" }
              as: Customer
              as_user_id: "${ac}"
              captures: { sub1: $.data.id }
            - call: "POST /stores/${s}/credit-accounts/${ac}/freeze"
              payload: {}
              as: FraudAnalyst
          trigger:
            - call: "POST /stores/${s}/rebate-submissions"
              payload: { receipt_id: "${r2}" }
              as: Customer
              as_user_id: "${ac}"
              captures: { err1: $.data.error_id }
            - call: "POST /stores/${s}/rebate-submissions/${sub1}/adjudicate"
              payload: { decision: "APPROVE" }
              as: GuestService
              captures: { err2: $.data.error_id }
            - call: "POST /stores/${s}/rebate-submissions/${sub1}/adjudicate"
              payload: { decision: "REJECT", rejection_reason: "under fraud review" }
              as: GuestService
          assert:
            - "new submission on the frozen account fails with error_id ERR_ACCOUNT_FROZEN (HTTP 409)"
            - "adjudicate-APPROVE on the frozen account's submission fails with error_id ERR_ACCOUNT_FROZEN (HTTP 409)"
            - "adjudicate-REJECT succeeds: RebateSubmission.${sub1}.status == REJECTED"

