  # ===========================================================================
  # Rule 9 - compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: invoice_money_conservation_through_dispute_cycle
        grounds:
          - calculations.invoice_audit_conservation
          - entities.Invoice.fields.submitted_total_cents
          - entities.Invoice.fields.approved_total_cents
          - entities.Invoice.fields.adjustment_total_cents
        distinguishing_aspect: |
          Conserved quantity: invoice money. For every audit action and
          resubmission, submitted_total_cents == approved_total_cents +
          adjustment_total_cents with zero drift; exercised through DISPUTE ->
          resubmit -> APPROVE -> PAID (forward and compensating steps).
        test_recipe:
          setup:
            - "CA regulation (tax 560 bp); policyholder + COMPREHENSIVE policy deductible 50000"
            - "STANDARD shop serving 900; AFTERMARKET windshield NAGS 100000 (agreement 95000)"
            - "claim completed; invoice created with one PART line billed 95000 -> submitted 95000 + tax 5320 = 100320"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /state-regulations"
              payload: { state_code: "CA", zero_deductible_windshield: false, glass_sales_tax_rate_bp: 560 }
              as: NetworkAdmin
            - call: "POST /policyholders"
              payload: { full_name: "Conserve", email: "cons@x.com", phone: "555-0901", state_code: "CA" }
              as: NetworkAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", policy_number: "PN-CON-1", state_code: "CA", coverage_type: "COMPREHENSIVE", deductible_cents: 50000, oem_endorsement: false, effective_start_date: "2026-01-01", effective_end_date: "2027-01-01" }
              as: NetworkAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /glass-shops"
              payload: { shop_name: "Cons Shop", state_code: "CA", service_zip_prefixes: ["900"], mobile_capable: false, adas_certified: false, oem_certified: false, agreement_tier: "STANDARD", bay_count: 1, mobile_unit_count: 0, operating_minutes_per_day: 480 }
              as: NetworkAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /part-catalog-entries"
              payload: { part_number: "AM-WS-1", part_description: "AM windshield", part_category: "WINDSHIELD", part_origin: "AFTERMARKET", nags_list_price_cents: 100000 }
              as: NetworkAdmin
              captures: { part_am_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", incident_state_code: "CA", service_zip_code: "90001", part_category: "WINDSHIELD", loss_date: "2026-04-15", description: "cons claim", requires_adas_calibration: false, estimated_repair_cost_cents: 110000 }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/choice-disclosures"
              payload: { disclosure_channel: "PHONE", shop_solicited: false, informed_of_network_options: true }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /claims/${claim_id}/verify-coverage"
              payload: {}
              as: ClaimAdjuster
              captures: { claim_v2: $.data.version }
            - call: "POST /claims/${claim_id}/routing-decisions"
              payload: { expected_claim_version: "${claim_v2}" }
              as: ClaimAdjuster
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/accept"
              payload: {}
              as: ShopOperator
              as_user_id: "${shop_id}"
              captures: { wo_v2: $.data.version }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { service_mode: "IN_SHOP", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T11:30:00Z", expected_work_order_version: "${wo_v2}" }
              as: ShopOperator
              as_user_id: "${shop_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T12:00:00Z" }
              as: NetworkAdmin
            - call: "POST /work-orders/${wo_id}/complete"
              payload: {}
              as: ShopOperator
              as_user_id: "${shop_id}"
            - call: "POST /work-orders/${wo_id}/invoices"
              payload: { line_items: [ { part_catalog_entry_id: "${part_am_id}", line_type: "PART", quantity: 1, origin_claimed: "AFTERMARKET", unit_price_cents: 95000 } ] }
              as: ShopOperator
              as_user_id: "${shop_id}"
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/submit"
              payload: {}
              as: ShopOperator
              as_user_id: "${shop_id}"
          trigger:
            - call: "POST /invoices/${inv_id}/audit-decisions"
              payload: { action: "DISPUTE", adjustment_lines: [ { line_index: 0, approved_amount_cents: 90000, approved_origin: "AFTERMARKET" } ] }
              as: NetworkAuditor
            - call: "GET /invoices/${inv_id}"
              as: NetworkAdmin
            - call: "POST /invoices/${inv_id}/submit"
              payload: { revised_line_items: [ { part_catalog_entry_id: "${part_am_id}", line_type: "PART", quantity: 1, origin_claimed: "AFTERMARKET", unit_price_cents: 92000 } ] }
              as: ShopOperator
              as_user_id: "${shop_id}"
            - call: "POST /invoices/${inv_id}/audit-decisions"
              payload: { action: "APPROVE", adjustment_lines: [ { line_index: 0, approved_amount_cents: 90000, approved_origin: "AFTERMARKET" } ] }
              as: NetworkAuditor
          assert:
            - "at DRAFT/SUBMITTED: submitted 100320, approved 0, adjustment 100320 (0 + 100320 == 100320)"
            - "after DISPUTE: submitted 100320, approved 0, adjustment 100320 (proposed amounts do not disturb invoice-level conservation)"
            - "after resubmit at 92000: submitted == 92000 + round_half_up(92000 x 560 / 10000) = 97152, approved 0, adjustment 97152"
            - "after APPROVE 90000: approved_total == 90000 + 5152 (tax on resubmitted parts 92000) = 95152; adjustment == 97152 - 95152 = 2000; 95152 + 2000 == 97152"

