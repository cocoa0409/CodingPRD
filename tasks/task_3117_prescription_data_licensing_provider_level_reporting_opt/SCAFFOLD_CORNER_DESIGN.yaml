# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — task_3117 (§1.9 Coverage Index)
# Breadth probe over §1.1–§1.7 claims not covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# Corners already exercised by a §1.8 instance appear as excluded_because stubs.
# Logical clock default is 2026-09-01T00:00:00Z unless a recipe sets it.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: client_create_returns_defaults_and_computed_balance
        claim_type: Creation
        grounds:
          - entities.ManufacturerClient
          - endpoints.POST_/clients
        distinguishing_aspect: "Creating a client with only name and entitlement_cells_total returns 201 with status ACTIVE, version 1, and entitlement_cells_balance already equal to entitlement_cells_total (computed field resolved at creation)."
        test_recipe:
          setup:
            - "Empty database; default clock 2026-09-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { name: "Client Zero", entitlement_cells_total: 42 }
              as: PlatformAdmin
              captures: { cl_id: $.data.id, st: $.data.status, ver: $.data.version, bal: $.data.entitlement_cells_balance }
          assert:
            - "response status 201, response_type object, meta.api_request_id present"
            - "ManufacturerClient.${cl_id}.status == ACTIVE and version == 1"
            - "entitlement_cells_balance == 42"
            - "id, created_at, updated_at are non-null system fields"

      - name: supplier_retrieval_round_trip
        claim_type: Retrieval
        grounds:
          - entities.DataSupplier
          - endpoints.GET_/suppliers/{id}
        distinguishing_aspect: "Every stored DataSupplier field round-trips through GET exactly as posted, including the CLAIM_PROCESSOR enum and WA state code; computed status stays ACTIVE."
        test_recipe:
          setup:
            - "One CLAIM_PROCESSOR supplier created."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { name: "Claims R Us", supplier_type: "CLAIM_PROCESSOR", state_code: "WA" }
              as: DataAcquisitionManager
              captures: { s_id: $.data.id }
          trigger:
            - call: "GET /suppliers/${s_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "response name == \"Claims R Us\", supplier_type == CLAIM_PROCESSOR, state_code == \"WA\""
            - "status == ACTIVE and version == 1"

      - name: batches_list_filter_and_pagination
        claim_type: Listing
        grounds:
          - endpoints.GET_/data-feed-batches
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three batches under one agreement and one under another, agreement_id filter + limit=2 returns 2 rows with total_count 3 and has_more true; offset=2 returns the remaining 1 row with has_more false — total_count spans the filtered set, not the page."
        test_recipe:
          setup:
            - "Two suppliers each with an ACTIVE agreement; three batches on agreement 1, one batch on agreement 2."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { name: "S1", supplier_type: "PHARMACY", state_code: "CA" }
              as: DataAcquisitionManager
              captures: { s1_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "S2", supplier_type: "PHARMACY", state_code: "NV" }
              as: DataAcquisitionManager
              captures: { s2_id: $.data.id }
            - call: "POST /suppliers/${s1_id}/agreements"
              payload: { data_domain: "RETAIL_SCRIPTS", exclusivity_start_date: "2026-01-01", exclusivity_end_date: "2027-01-01", royalty_budget_cents: 1000000 }
              as: DataAcquisitionManager
              captures: { ag1_id: $.data.id }
            - call: "POST /suppliers/${s2_id}/agreements"
              payload: { data_domain: "RETAIL_SCRIPTS", exclusivity_start_date: "2026-01-01", exclusivity_end_date: "2027-01-01", royalty_budget_cents: 1000000 }
              as: DataAcquisitionManager
              captures: { ag2_id: $.data.id }
            - call: "POST /data-acquisition-agreements/${ag1_id}/activate"
              payload: {}
              as: DataAcquisitionManager
            - call: "POST /data-acquisition-agreements/${ag2_id}/activate"
              payload: {}
              as: DataAcquisitionManager
            - call: "POST /data-feed-batches"
              payload: { agreement_id: "${ag1_id}", period_code: "2026-08", record_count: 10 }
              as: SupplierOperator
              as_user_id: "${s1_id}"
            - call: "POST /data-feed-batches"
              payload: { agreement_id: "${ag1_id}", period_code: "2026-08", record_count: 20 }
              as: SupplierOperator
              as_user_id: "${s1_id}"
            - call: "POST /data-feed-batches"
              payload: { agreement_id: "${ag1_id}", period_code: "2026-09", record_count: 30 }
              as: SupplierOperator
              as_user_id: "${s1_id}"
            - call: "POST /data-feed-batches"
              payload: { agreement_id: "${ag2_id}", period_code: "2026-08", record_count: 40 }
              as: SupplierOperator
              as_user_id: "${s2_id}"
          trigger:
            - call: "GET /data-feed-batches"
              payload: { agreement_id: "${ag1_id}", limit: 2, offset: 0 }
              as: PlatformAdmin
            - call: "GET /data-feed-batches"
              payload: { agreement_id: "${ag1_id}", limit: 2, offset: 2 }
              as: PlatformAdmin
          assert:
            - "page 1 returns 2 rows with total_count == 3 and has_more == true"
            - "page 2 returns 1 row with total_count == 3 and has_more == false"

      - name: prescriber_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/prescribers/{id}
          - errors[ERR_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "GET on a well-formed but non-existent prescriber UUID returns 404 with ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /prescribers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND with HTTP 404"

      - name: supplier_create_missing_required_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.DataSupplier.fields.supplier_type
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required supplier_type field on create returns 400 ERR_INVALID_REQUEST; no supplier row is persisted."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /suppliers"
              payload: { name: "NoType", state_code: "CA" }
              as: DataAcquisitionManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /suppliers afterwards returns total_count == 0"

      - name: deid_profile_defaults_applied
        claim_type: Defaults
        grounds:
          - entities.DeidentificationProfile.fields.k_anonymity_threshold
          - entities.DeidentificationProfile.fields.hash_algorithm
          - endpoints.POST_/deidentification-profiles
        distinguishing_aspect: "Omitting k_anonymity_threshold and hash_algorithm applies the declared defaults 5 and SHA256; explicit values override the defaults."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /deidentification-profiles"
              payload: { name: "DP-DEF", salt_version: "sv1" }
              as: PrivacyOfficer
              captures: { dp1_id: $.data.id, k1: $.data.k_anonymity_threshold, h1: $.data.hash_algorithm }
            - call: "POST /deidentification-profiles"
              payload: { name: "DP-EXP", salt_version: "sv2", k_anonymity_threshold: 11, hash_algorithm: "SHA512" }
              as: PrivacyOfficer
              captures: { dp2_id: $.data.id, k2: $.data.k_anonymity_threshold, h2: $.data.hash_algorithm }
          assert:
            - "first profile k_anonymity_threshold == 5 and hash_algorithm == SHA256"
            - "second profile k_anonymity_threshold == 11 and hash_algorithm == SHA512"

      - name: batch_create_royalty_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.DataFeedBatch.fields.royalty_cents
          - endpoints.POST_/data-feed-batches
        distinguishing_aspect: "royalty_cents is source: computed — a client-supplied value on create is ignored and the field stays null until acceptance computes it."
        test_recipe:
          setup:
            - "Supplier with ACTIVE agreement."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { name: "S9", supplier_type: "PHARMACY", state_code: "CA" }
              as: DataAcquisitionManager
              captures: { s_id: $.data.id }
            - call: "POST /suppliers/${s_id}/agreements"
              payload: { data_domain: "RETAIL_SCRIPTS", exclusivity_start_date: "2026-01-01", exclusivity_end_date: "2027-01-01", royalty_budget_cents: 1000000 }
              as: DataAcquisitionManager
              captures: { ag_id: $.data.id }
            - call: "POST /data-acquisition-agreements/${ag_id}/activate"
              payload: {}
              as: DataAcquisitionManager
          trigger:
            - call: "POST /data-feed-batches"
              payload: { agreement_id: "${ag_id}", period_code: "2026-08", record_count: 100, royalty_cents: 999999 }
              as: SupplierOperator
              as_user_id: "${s_id}"
              captures: { b_id: $.data.id, roy: $.data.royalty_cents }
          assert:
            - "creation succeeds (201) and response royalty_cents is null — the injected 999999 is ignored"

      - name: supplier_create_invalid_enum_type
        claim_type: Type Constraints
        grounds:
          - entities.DataSupplier.fields.supplier_type
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "supplier_type outside {PHARMACY, DISTRIBUTOR, CLAIM_PROCESSOR} is rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /suppliers"
              payload: { name: "BadType", supplier_type: "WHOLESALER", state_code: "CA" }
              as: DataAcquisitionManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with HTTP 400"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: terminated_agreement_lockdown_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.DataAcquisitionAgreement
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "TERMINATED is terminal: resume on a terminated agreement returns ERR_INVALID_STATE and leaves status TERMINATED."
        test_recipe:
          setup:
            - "Supplier with agreement DRAFT -> TERMINATED."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { name: "ST", supplier_type: "DISTRIBUTOR", state_code: "NV" }
              as: DataAcquisitionManager
              captures: { s_id: $.data.id }
            - call: "POST /suppliers/${s_id}/agreements"
              payload: { data_domain: "DISTRIBUTION_SHIPMENTS", exclusivity_start_date: "2026-01-01", exclusivity_end_date: "2027-01-01", royalty_budget_cents: 1000000 }
              as: DataAcquisitionManager
              captures: { ag_id: $.data.id }
            - call: "POST /data-acquisition-agreements/${ag_id}/terminate"
              payload: {}
              as: DataAcquisitionManager
          trigger:
            - call: "POST /data-acquisition-agreements/${ag_id}/resume"
              payload: {}
              as: DataAcquisitionManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409"
            - "GET /data-acquisition-agreements/${ag_id} still shows status TERMINATED"

      - name: batch_accept_from_received_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.DataFeedBatch
          - errors[ERR_BATCH_INVALID_STATE]
        distinguishing_aspect: "Skipping validate/deidentify and calling accept directly from RECEIVED returns ERR_BATCH_INVALID_STATE; no royalty is computed."
        test_recipe:
          setup:
            - "Supplier, ACTIVE agreement, batch in RECEIVED."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { name: "SB", supplier_type: "PHARMACY", state_code: "CA" }
              as: DataAcquisitionManager
              captures: { s_id: $.data.id }
            - call: "POST /suppliers/${s_id}/agreements"
              payload: { data_domain: "RETAIL_SCRIPTS", exclusivity_start_date: "2026-01-01", exclusivity_end_date: "2027-01-01", royalty_budget_cents: 1000000 }
              as: DataAcquisitionManager
              captures: { ag_id: $.data.id }
            - call: "POST /data-acquisition-agreements/${ag_id}/activate"
              payload: {}
              as: DataAcquisitionManager
            - call: "POST /data-feed-batches"
              payload: { agreement_id: "${ag_id}", period_code: "2026-08", record_count: 100 }
              as: SupplierOperator
              as_user_id: "${s_id}"
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /data-feed-batches/${b_id}/accept"
              payload: { deid_qa_score: 0.99 }
              as: PrivacyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BATCH_INVALID_STATE with HTTP 409"
            - "batch remains RECEIVED with royalty_cents null"

      - name: optout_created_initial_submitted
        claim_type: Initial State
        grounds:
          - state_machines.PrescriberOptOut
        distinguishing_aspect: "A newly created opt-out starts in SUBMITTED (never VERIFIED or ACTIVE) with version 1."
        test_recipe:
          setup:
            - "One ACTIVE prescriber."
          setup_api_calls:
            - call: "POST /prescribers"
              payload: { full_name: "Dr Init", npi: "NPI-900", state_code: "TX", specialty: "PRIMARY_CARE" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /prescribers/${p_id}/opt-outs"
              payload: {}
              as: PrivacyOfficer
              captures: { oo_id: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "opt-out status == SUBMITTED and version == 1"

      - name: audit_reidentification_outcome_suspends_client_and_products
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ClientAuditEvent.SCHEDULED_to_COMPLETED
          - state_machines.ManufacturerClient.ACTIVE_to_SUSPENDED
          - state_machines.ReportProduct.ACTIVE_to_SUSPENDED
        distinguishing_aspect: "Completing an audit with outcome REIDENTIFICATION_ATTEMPTED cascades: client -> SUSPENDED and every ACTIVE product of that client -> SUSPENDED; outcome CLEAN leaves both ACTIVE."
        test_recipe:
          setup:
            - "Two clients each with a product; each has one SCHEDULED audit."
          setup_api_calls:
            - call: "POST /projection-methodologies"
              payload: { name: "M-AUD", default_variant: "PROJECTION_WEIGHTED" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Client Bad", entitlement_cells_total: 100 }
              as: PlatformAdmin
              captures: { cl1_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Client Good", entitlement_cells_total: 100 }
              as: PlatformAdmin
              captures: { cl2_id: $.data.id }
            - call: "POST /report-products"
              payload: { client_id: "${cl1_id}", methodology_id: "${m_id}", name: "P-BAD", prescriber_ids: [], base_fee_cents: 10000, cell_fee_base_cents: 1000, cell_fee_multiplier: 1.0, volume_discount_pct: 0.0, monthly_license_fee_cents: 200000 }
              as: PlatformAdmin
              captures: { pr1_id: $.data.id }
            - call: "POST /report-products"
              payload: { client_id: "${cl2_id}", methodology_id: "${m_id}", name: "P-GOOD", prescriber_ids: [], base_fee_cents: 10000, cell_fee_base_cents: 1000, cell_fee_multiplier: 1.0, volume_discount_pct: 0.0, monthly_license_fee_cents: 200000 }
              as: PlatformAdmin
              captures: { pr2_id: $.data.id }
            - call: "POST /clients/${cl1_id}/audit-requests"
              payload: { window_start_date: "2026-03-01", window_end_date: "2026-03-15", purpose: "AUDIT_COMPLIANCE" }
              as: ManufacturerClient
              as_user_id: "${cl1_id}"
              captures: { au1_id: $.data.id }
            - call: "POST /clients/${cl2_id}/audit-requests"
              payload: { window_start_date: "2026-03-01", window_end_date: "2026-03-15", purpose: "AUDIT_COMPLIANCE" }
              as: ManufacturerClient
              as_user_id: "${cl2_id}"
              captures: { au2_id: $.data.id }
            - call: "POST /audit-events/${au1_id}/schedule"
              payload: {}
              as: PlatformAdmin
            - call: "POST /audit-events/${au2_id}/schedule"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /audit-events/${au1_id}/complete"
              payload: { outcome: "REIDENTIFICATION_ATTEMPTED" }
              as: PlatformAdmin
            - call: "POST /audit-events/${au2_id}/complete"
              payload: { outcome: "CLEAN" }
              as: PlatformAdmin
          assert:
            - "GET /clients/${cl1_id} shows status SUSPENDED"
            - "GET /report-products/${pr1_id} shows status SUSPENDED (cascade)"
            - "GET /clients/${cl2_id} shows status ACTIVE and GET /report-products/${pr2_id} shows status ACTIVE"
            - "both audit events end in COMPLETED with their recorded outcomes"

      - name: supplier_suspend_cascades_to_agreements
        claim_type: Cascade down
        grounds:
          - state_machines.DataSupplier.ACTIVE_to_SUSPENDED
          - state_machines.DataAcquisitionAgreement.ACTIVE_to_SUSPENDED
        distinguishing_aspect: "Suspending a supplier cascades to all its ACTIVE agreements (both become SUSPENDED); a DRAFT agreement of the same supplier is untouched."
        test_recipe:
          setup:
            - "Supplier with one ACTIVE agreement and one DRAFT agreement (different data_domain, non-overlapping windows irrelevant)."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { name: "SC", supplier_type: "PHARMACY", state_code: "CA" }
              as: DataAcquisitionManager
              captures: { s_id: $.data.id }
            - call: "POST /suppliers/${s_id}/agreements"
              payload: { data_domain: "RETAIL_SCRIPTS", exclusivity_start_date: "2026-01-01", exclusivity_end_date: "2027-01-01", royalty_budget_cents: 1000000 }
              as: DataAcquisitionManager
              captures: { ag1_id: $.data.id }
            - call: "POST /data-acquisition-agreements/${ag1_id}/activate"
              payload: {}
              as: DataAcquisitionManager
            - call: "POST /suppliers/${s_id}/agreements"
              payload: { data_domain: "CLAIMS_ADJUDICATION", exclusivity_start_date: "2026-01-01", exclusivity_end_date: "2027-01-01", royalty_budget_cents: 1000000 }
              as: DataAcquisitionManager
              captures: { ag2_id: $.data.id }
          trigger:
            - call: "POST /suppliers/${s_id}/suspend"
              payload: {}
              as: DataAcquisitionManager
          assert:
            - "GET /suppliers/${s_id} shows status SUSPENDED"
            - "GET /data-acquisition-agreements/${ag1_id} shows status SUSPENDED (cascade)"
            - "GET /data-acquisition-agreements/${ag2_id} still shows status DRAFT (non-ACTIVE agreements untouched)"

      - name: resume_returns_quarantined_batches_to_validated
        claim_type: Compensation
        grounds:
          - state_machines.DataAcquisitionAgreement.SUSPENDED_to_ACTIVE
          - state_machines.DataFeedBatch.QUARANTINED_to_VALIDATED
        distinguishing_aspect: "Resuming a suspended agreement returns its QUARANTINED batches to VALIDATED (de-identification must be redone: profile cleared), while the projection cell stays PENDING_RESTATEMENT until explicit recompute."
        test_recipe:
          setup:
            - "Supplier, ACTIVE agreement, batch VALIDATED, methodology cell for 2026-08 listing the supplier; agreement suspended (batch QUARANTINED, cell PENDING_RESTATEMENT)."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { name: "SR", supplier_type: "PHARMACY", state_code: "CA" }
              as: DataAcquisitionManager
              captures: { s_id: $.data.id }
            - call: "POST /suppliers/${s_id}/agreements"
              payload: { data_domain: "RETAIL_SCRIPTS", exclusivity_start_date: "2026-01-01", exclusivity_end_date: "2027-01-01", royalty_budget_cents: 1000000 }
              as: DataAcquisitionManager
              captures: { ag_id: $.data.id }
            - call: "POST /data-acquisition-agreements/${ag_id}/activate"
              payload: {}
              as: DataAcquisitionManager
            - call: "POST /data-feed-batches"
              payload: { agreement_id: "${ag_id}", period_code: "2026-08", record_count: 100 }
              as: SupplierOperator
              as_user_id: "${s_id}"
              captures: { b_id: $.data.id }
            - call: "POST /data-feed-batches/${b_id}/validate"
              payload: {}
              as: DataAcquisitionManager
            - call: "POST /projection-methodologies"
              payload: { name: "M-RES", default_variant: "PROJECTION_WEIGHTED" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /projection-cells"
              payload: { methodology_id: "${m_id}", geography_code: "CA-SOUTH", specialty: "CARDIOLOGY", period_code: "2026-08", sample_units: 10, market_outlets: 10, sampled_outlets: 10, market_population: 1000, sampled_population: 1000, specialty_uptake_index: 1.0, supplier_ids: ["${s_id}"] }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /data-acquisition-agreements/${ag_id}/suspend"
              payload: {}
              as: DataAcquisitionManager
          trigger:
            - call: "POST /data-acquisition-agreements/${ag_id}/resume"
              payload: {}
              as: DataAcquisitionManager
          assert:
            - "GET /data-acquisition-agreements/${ag_id} shows status ACTIVE"
            - "GET /data-feed-batches/${b_id} shows status VALIDATED with deidentification_profile_id null"
            - "GET /projection-cells/${c_id} still shows status PENDING_RESTATEMENT (resume does not auto-restate)"

      - name: delivery_recall_restores_entitlement_side_effect
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ReportDelivery.COMPILED_to_RECALLED
        excluded_because:
          difficulty_instance: compensating_invariant / recall_reissue_conserves_entitlement_balance
          rationale: "Entitlement credit on recall is asserted step-by-step in the named §1.8 invariant instance."

      - name: delivery_release_valid_transition
        claim_type: Valid Transition
        grounds:
          - state_machines.ReportDelivery.COMPILED_to_RELEASED
        excluded_because:
          difficulty_instance: non_linear_state_machine / delivery_release_recall_reissue_cycle
          rationale: "The COMPILED -> RELEASED transition is exercised twice inside the named §1.8 cycle instance."

  # ===========================================================================
  - section: calculations
    instances:

      - name: projection_round_half_up_precision
        claim_type: Precision
        grounds:
          - calculations.calc_market_projection
        distinguishing_aspect: "251 sample units with coverage factor 350/100 = 3.5 yields 878.5; round_half_up pins 879 (not 878 truncation, not 878 banker's)."
        test_recipe:
          setup:
            - "Methodology + cell sample_units 251, market_outlets 350, sampled_outlets 100."
          setup_api_calls:
            - call: "POST /projection-methodologies"
              payload: { name: "M-PRC", default_variant: "PROJECTION_WEIGHTED" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /projection-cells"
              payload: { methodology_id: "${m_id}", geography_code: "G-P", specialty: "CARDIOLOGY", period_code: "2026-08", sample_units: 251, market_outlets: 350, sampled_outlets: 100, market_population: 1000, sampled_population: 1000, specialty_uptake_index: 1.0, supplier_ids: [] }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /projection-cells/${c_id}/recompute"
              payload: { projection_variant: "PROJECTION_WEIGHTED" }
              as: PlatformAdmin
              captures: { est: $.data.estimate_units }
          assert:
            - "estimate_units == 879 (round_half_up of 878.5)"

      - name: restatement_delta_signed_after_coverage_loss
        claim_type: Correct Result
        grounds:
          - calculations.calc_market_projection
          - entities.ProjectionCell.fields.restatement_delta_units
        distinguishing_aspect: "After a coverage-loss restatement (sampled_outlets 100 -> 50 via override), WEIGHTED recompute yields 250*400/50 = 2000 and restatement_delta_units == +1000 signed against the previous 1000 estimate; first-ever recompute has delta null."
        test_recipe:
          setup:
            - "Supplier with ACTIVE agreement and VALIDATED batch for 2026-08; methodology; cell (WEIGHTED estimate 1000) whose supplier_ids contains the supplier; agreement suspended so the cell is PENDING_RESTATEMENT."
