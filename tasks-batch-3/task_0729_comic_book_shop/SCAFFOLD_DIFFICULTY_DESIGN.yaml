scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: consignment_provisional_vs_final_payout_diverge
        grounds:
          - calculations.consignment_payout
          - state_machines.Consignment.RECEIVED_to_LISTED
          - state_machines.Consignment.LISTED_to_SOLD
          - entities.Consignment.fields.provisional_payout_cents
          - entities.Consignment.fields.final_payout_cents
        distinguishing_aspect: "On the Consignment domain, provisional payout uses asking_price_cents (7000) while final payout uses sale_price_cents (14000); the two variants produce different numbers for the same consignment."
        test_recipe:
          setup:
            - "One Customer (consignor); one Consignment asking_price_cents=10000, commission_pct=0.30, LISTED then SOLD at sale_price_cents=20000."
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { email: "cons1@x.com", full_name: "Cons One" }
              as: Clerk
              captures: { cust1: $.data.id }
            - call: "POST /api/consignments"
              payload: { consignor_id: "${cust1}", description: "Vintage #1", asking_price_cents: 10000, commission_pct: 0.30 }
              as: Clerk
              captures: { cons1: $.data.id }
            - call: "POST /api/consignments/${cons1}/transition"
              payload: { to_status: "LISTED" }
              as: Clerk
              captures: { prov: $.data.provisional_payout_cents }
          trigger:
            - call: "POST /api/consignments/${cons1}/transition"
              payload: { to_status: "SOLD", sale_price_cents: 20000 }
              as: Clerk
              captures: { fin: $.data.final_payout_cents }
          assert:
            - "Consignment.${cons1}.provisional_payout_cents == 7000"
            - "Consignment.${cons1}.final_payout_cents == 14000"
            - "Consignment.${cons1}.provisional_payout_cents != Consignment.${cons1}.final_payout_cents"

      - name: loyalty_tier_forward_looking_vs_settled_only
        grounds:
          - calculations.loyalty_tier_assignment
          - state_machines.PreOrder.PENDING_to_CONFIRMED
          - entities.Customer.fields.loyalty_tier
          - entities.Customer.fields.lifetime_spend_cents
        distinguishing_aspect: "On the Customer domain, the persisted forward-looking tier counts a CONFIRMED pre-order (40000+20000=60000 -> SILVER) whereas the settled-only variant on lifetime_spend_cents alone (40000) yields BRONZE."
        test_recipe:
          setup:
            - "Customer with lifetime_spend_cents=40000 from one checkout; one issue cover_price_cents=20000; one PENDING pre-order qty=1 then CONFIRMED before cutoff."
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { email: "tier@x.com", full_name: "Tier Cust" }
              as: Clerk
              captures: { cust: $.data.id }
            - call: "POST /api/comic-series"
              payload: { title: "Alpha", publisher: "Acme" }
              as: Clerk
              captures: { series: $.data.id }
            - call: "POST /api/comic-issues"
              payload: { series_id: "${series}", issue_number: "1", cover_price_cents: 20000, on_sale_date: "2026-04-01T00:00:00Z", order_cutoff_date: "2026-03-15T00:00:00Z", copies_ordered: 5 }
              as: Clerk
              captures: { issue: $.data.id }
            - call: "POST /api/checkout"
              payload: { customer_id: "${cust}", line_items: [ { unit_price_cents: 40000, quantity: 1 } ] }
              as: Clerk
            - call: "POST /api/pre-orders"
              payload: { customer_id: "${cust}", issue_id: "${issue}", quantity: 1 }
              as: Clerk
              captures: { po: $.data.id }
          trigger:
            - call: "POST /api/pre-orders/${po}/transition"
              payload: { to_status: "CONFIRMED" }
              as: Clerk
          assert:
            - "Customer.${cust}.lifetime_spend_cents == 40000"
            - "PreOrder.${po}.estimated_total_cents == 20000"
            - "Customer.${cust}.loyalty_tier == SILVER"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: loyalty_points_floor_per_line_then_sum
        grounds:
          - calculations.loyalty_points_earned
          - entities.Customer.fields.loyalty_points_balance
        distinguishing_aspect: "Mode (b) nested rounding: flooring per line item (125+33=158) diverges from summing then flooring (floor(159.25)=159); the scaffold pins floor-per-line."
        test_recipe:
          setup:
            - "One BRONZE Customer (multiplier 1.0); checkout with two line items 12550 and 3375 cents."
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { email: "pts@x.com", full_name: "Pts Cust" }
              as: Clerk
              captures: { cust: $.data.id }
          trigger:
            - call: "POST /api/checkout"
              payload: { customer_id: "${cust}", line_items: [ { unit_price_cents: 12550, quantity: 1 }, { unit_price_cents: 3375, quantity: 1 } ] }
              as: Clerk
              captures: { pts: $.data.loyalty_points_earned }
          assert:
            - "checkout.loyalty_points_earned == 158"
            - "Customer.${cust}.loyalty_points_balance == 158"

      - name: allocation_grant_min_of_three_inputs_tier_cap_binds
        grounds:
          - calculations.new_comic_day_allocation
          - state_machines.Reservation.RESERVED_to_ALLOCATED
          - entities.Reservation.fields.allocated_qty
        distinguishing_aspect: "Mode (a) non-linear formula with 3 inputs: grant = min(requested_qty=5, remaining=5, TIER_MAX[GOLD]=3) = 3; the tier cap (a conditional branch on customer tier) is the binding term, distinct from the rounding mode of the other instance."
        test_recipe:
          setup:
            - "GOLD Customer (lifetime_spend_cents=150000); ON_SALE issue copies_ordered=5; one RESERVED reservation requested_qty=5."
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { email: "gold@x.com", full_name: "Gold Cust" }
              as: Clerk
              captures: { cust: $.data.id }
            - call: "POST /api/checkout"
              payload: { customer_id: "${cust}", line_items: [ { unit_price_cents: 150000, quantity: 1 } ] }
              as: Clerk
            - call: "POST /api/comic-series"
              payload: { title: "Beta", publisher: "Acme" }
              as: Clerk
              captures: { series: $.data.id }
            - call: "POST /api/comic-issues"
              payload: { series_id: "${series}", issue_number: "1", cover_price_cents: 400, on_sale_date: "2026-04-01T00:00:00Z", order_cutoff_date: "2026-03-15T00:00:00Z", copies_ordered: 5 }
              as: Clerk
              captures: { issue: $.data.id }
            - call: "POST /api/comic-issues/${issue}/transition"
              payload: { to_status: "ORDERED" }
              as: Clerk
            - call: "POST /api/comic-issues/${issue}/transition"
              payload: { to_status: "ON_SALE" }
              as: Clerk
              captures: { iss_v: $.data.version }
            - call: "POST /api/reservations"
              payload: { customer_id: "${cust}", issue_id: "${issue}", requested_qty: 5, expected_comic_issue_version: "${iss_v}" }
              as: Clerk
              captures: { res: $.data.id }
          trigger:
            - call: "POST /api/comic-issues/${issue}/run-allocation"
              payload: {}
              as: Clerk
          assert:
            - "Reservation.${res}.status == ALLOCATED"
            - "Reservation.${res}.allocated_qty == 3"
            - "ComicIssue.${issue}.copies_available == 2"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: grading_dispute_cycle_returned_to_at_grader
        grounds:
          - state_machines.GradingSubmission.RETURNED_to_AT_GRADER
          - state_machines.GradingSubmission.AT_GRADER_to_RETURNED
          - entities.GradingSubmission.fields.dispute_count
        distinguishing_aspect: "GradingSubmission carries a cycle RETURNED->AT_GRADER->RETURNED; the dispute increments dispute_count to 1 and returns the entity to AT_GRADER, which no linear pipeline permits."
        test_recipe:
          setup:
            - "ACTIVE Customer; GradingSubmission advanced INTAKE->SUBMITTED->AT_GRADER->RETURNED (grade_result 9.0)."
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { email: "grade@x.com", full_name: "Grade Cust" }
              as: Clerk
              captures: { cust: $.data.id }
            - call: "POST /api/grading-submissions"
              payload: { customer_id: "${cust}", description: "ASM 300", declared_value_cents: 50000 }
              as: Clerk
              captures: { gs: $.data.id }
            - call: "POST /api/grading-submissions/${gs}/transition"
              payload: { to_status: "SUBMITTED" }
              as: Clerk
            - call: "POST /api/grading-submissions/${gs}/transition"
              payload: { to_status: "AT_GRADER" }
              as: Clerk
            - call: "POST /api/grading-submissions/${gs}/transition"
              payload: { to_status: "RETURNED", grade_result: 9.0 }
              as: Clerk
          trigger:
            - call: "POST /api/grading-submissions/${gs}/transition"
              payload: { to_status: "AT_GRADER" }
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "GradingSubmission.${gs}.status == AT_GRADER"
            - "GradingSubmission.${gs}.dispute_count == 1"

      - name: consignment_listed_forks_to_returned_no_payout
        grounds:
          - state_machines.Consignment.LISTED_to_RETURNED_TO_CONSIGNOR
          - state_machines.Consignment.LISTED_to_SOLD
          - entities.Consignment.fields.final_payout_cents
        distinguishing_aspect: "Consignment fork at LISTED: the RETURNED_TO_CONSIGNOR branch fires no CreditTransaction and leaves final_payout_cents null and consignor store_credit_cents at 0, diverging from the SOLD branch's side-effect set on a different entity than the grading cycle."
        test_recipe:
          setup:
            - "One Customer (consignor); Consignment asking_price_cents=10000 LISTED."
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { email: "ret@x.com", full_name: "Ret Cust" }
              as: Clerk
              captures: { cust: $.data.id }
            - call: "POST /api/consignments"
              payload: { consignor_id: "${cust}", description: "Return me", asking_price_cents: 10000 }
              as: Clerk
              captures: { cons: $.data.id }
            - call: "POST /api/consignments/${cons}/transition"
              payload: { to_status: "LISTED" }
              as: Clerk
          trigger:
            - call: "POST /api/consignments/${cons}/transition"
              payload: { to_status: "RETURNED_TO_CONSIGNOR" }
              as: Clerk
          assert:
            - "Consignment.${cons}.status == RETURNED_TO_CONSIGNOR"
            - "Consignment.${cons}.final_payout_cents == null"
            - "Customer.${cust}.store_credit_cents == 0"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: subscription_cancel_releases_then_frees_then_promotes_depth3
        grounds:
          - state_machines.PullSubscription.ACTIVE_to_CANCELLED
          - state_machines.Reservation.ALLOCATED_to_RELEASED
          - state_machines.Reservation.WAITLISTED_to_ALLOCATED
          - entities.ComicIssue.fields.copies_available
        distinguishing_aspect: "Depth-3 chain from subscription cancel: HOP1 subscription-linked Reservation A ALLOCATED->RELEASED; HOP2 that release raises ComicIssue.copies_available; HOP3 the raised availability promotes the earliest WAITLISTED Reservation B to ALLOCATED — each hop caused by the previous."
        test_recipe:
          setup:
            - "ON_SALE issue copies_ordered=1; Customer A with ACTIVE subscription and an ALLOCATED subscription-linked reservation (qty1); Customer B with a WAITLISTED reservation (qty1)."
          setup_api_calls:
            - call: "POST /api/comic-series"
              payload: { title: "Gamma", publisher: "Acme" }
              as: Clerk
              captures: { series: $.data.id }
            - call: "POST /api/comic-issues"
              payload: { series_id: "${series}", issue_number: "1", cover_price_cents: 400, on_sale_date: "2026-04-01T00:00:00Z", order_cutoff_date: "2026-03-15T00:00:00Z", copies_ordered: 1 }
              as: Clerk
              captures: { issue: $.data.id }
            - call: "POST /api/comic-issues/${issue}/transition"
              payload: { to_status: "ORDERED" }
              as: Clerk
            - call: "POST /api/comic-issues/${issue}/transition"
              payload: { to_status: "ON_SALE" }
              as: Clerk
            - call: "POST /api/customers"
              payload: { email: "a@x.com", full_name: "Cust A" }
              as: Clerk
              captures: { custA: $.data.id }
            - call: "POST /api/customers"
              payload: { email: "b@x.com", full_name: "Cust B" }
              as: Clerk
              captures: { custB: $.data.id }
            - call: "POST /api/pull-subscriptions"
              payload: { customer_id: "${custA}", series_id: "${series}" }
              as: Clerk
              captures: { subA: $.data.id }
            - call: "GET /api/comic-issues/${issue}"
              payload: {}
              as: Clerk
              captures: { iss_v1: $.data.version }
            - call: "POST /api/reservations"
              payload: { customer_id: "${custA}", issue_id: "${issue}", subscription_id: "${subA}", requested_qty: 1, expected_comic_issue_version: "${iss_v1}" }
              as: Clerk
              captures: { resA: $.data.id }
            - call: "GET /api/comic-issues/${issue}"
              payload: {}
              as: Clerk
              captures: { iss_v2: $.data.version }
            - call: "POST /api/reservations"
              payload: { customer_id: "${custB}", issue_id: "${issue}", requested_qty: 1, expected_comic_issue_version: "${iss_v2}" }
              as: Clerk
              captures: { resB: $.data.id }
            - call: "POST /api/comic-issues/${issue}/run-allocation"
              payload: {}
              as: Clerk
          trigger:
            - call: "POST /api/pull-subscriptions/${subA}/transition"
              payload: { to_status: "CANCELLED" }
              as: Clerk
          assert:
            - "Reservation.${resA}.status == RELEASED"
            - "Reservation.${resB}.status == ALLOCATED"
            - "Reservation.${resB}.allocated_qty == 1"
            - "ComicIssue.${issue}.copies_available == 0"

      - name: reservation_release_frees_then_promotes_depth2
        grounds:
          - state_machines.Reservation.ALLOCATED_to_RELEASED
          - state_machines.Reservation.WAITLISTED_to_ALLOCATED
          - entities.ComicIssue.fields.copies_available
        distinguishing_aspect: "Depth-2 chain from a reservation release (different trigger than subscription cancel): HOP1 releasing ALLOCATED Reservation A raises ComicIssue.copies_available; HOP2 that raise promotes the earliest WAITLISTED Reservation B to ALLOCATED."
        test_recipe:
          setup:
            - "ON_SALE issue copies_ordered=1; Reservation A ALLOCATED (qty1); Reservation B WAITLISTED (qty1)."
          setup_api_calls:
            - call: "POST /api/comic-series"
              payload: { title: "Delta", publisher: "Acme" }
              as: Clerk
              captures: { series: $.data.id }
            - call: "POST /api/comic-issues"
              payload: { series_id: "${series}", issue_number: "1", cover_price_cents: 400, on_sale_date: "2026-04-01T00:00:00Z", order_cutoff_date: "2026-03-15T00:00:00Z", copies_ordered: 1 }
              as: Clerk
              captures: { issue: $.data.id }
            - call: "POST /api/comic-issues/${issue}/transition"
              payload: { to_status: "ORDERED" }
              as: Clerk
            - call: "POST /api/comic-issues/${issue}/transition"
              payload: { to_status: "ON_SALE" }
              as: Clerk
            - call: "POST /api/customers"
              payload: { email: "a2@x.com", full_name: "Cust A2" }
              as: Clerk
              captures: { custA: $.data.id }
            - call: "POST /api/customers"
              payload: { email: "b2@x.com", full_name: "Cust B2" }
              as: Clerk
              captures: { custB: $.data.id }
            - call: "GET /api/comic-issues/${issue}"
              payload: {}
              as: Clerk
              captures: { iss_v1: $.data.version }
            - call: "POST /api/reservations"
              payload: { customer_id: "${custA}", issue_id: "${issue}", requested_qty: 1, expected_comic_issue_version: "${iss_v1}" }
              as: Clerk
              captures: { resA: $.data.id }
            - call: "GET /api/comic-issues/${issue}"
              payload: {}
              as: Clerk
              captures: { iss_v2: $.data.version }
            - call: "POST /api/reservations"
              payload: { customer_id: "${custB}", issue_id: "${issue}", requested_qty: 1, expected_comic_issue_version: "${iss_v2}" }
              as: Clerk
              captures: { resB: $.data.id }
            - call: "POST /api/comic-issues/${issue}/run-allocation"
              payload: {}
              as: Clerk
          trigger:
            - call: "POST /api/reservations/${resA}/transition"
              payload: { to_status: "RELEASED" }
              as: Clerk
          assert:
            - "Reservation.${resA}.status == RELEASED"
            - "Reservation.${resB}.status == ALLOCATED"
            - "Reservation.${resB}.allocated_qty == 1"
            - "ComicIssue.${issue}.copies_available == 0"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: preorder_confirm_invalid_state_beats_past_cutoff
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_PAST_CUTOFF]
        distinguishing_aspect: "state (priority 5) vs business_temporal (priority 6): confirming an already-CONFIRMED pre-order after the cutoff returns ERR_INVALID_STATE, not ERR_PAST_CUTOFF."
        test_recipe:
          setup:
            - "Issue order_cutoff_date=2026-03-15; PENDING pre-order CONFIRMED while clock at default 2026-03-01; then clock advanced to 2026-03-20 (past cutoff)."
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { email: "p5@x.com", full_name: "P5" }
              as: Clerk
              captures: { cust: $.data.id }
            - call: "POST /api/comic-series"
              payload: { title: "Eps", publisher: "Acme" }
              as: Clerk
              captures: { series: $.data.id }
            - call: "POST /api/comic-issues"
              payload: { series_id: "${series}", issue_number: "1", cover_price_cents: 400, on_sale_date: "2026-04-01T00:00:00Z", order_cutoff_date: "2026-03-15T00:00:00Z", copies_ordered: 5 }
              as: Clerk
              captures: { issue: $.data.id }
            - call: "POST /api/pre-orders"
              payload: { customer_id: "${cust}", issue_id: "${issue}", quantity: 1 }
              as: Clerk
              captures: { po: $.data.id }
            - call: "POST /api/pre-orders/${po}/transition"
              payload: { to_status: "CONFIRMED" }
              as: Clerk
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-20T00:00:00Z" }
              as: Clerk
          trigger:
            - call: "POST /api/pre-orders/${po}/transition"
              payload: { to_status: "CONFIRMED" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: event_registration_closed_beats_full
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_EVENT_CLOSED]
          - errors[ERR_EVENT_FULL]
        distinguishing_aspect: "business_referential (priority 7) vs business_constraint (priority 8): registering on a CLOSED, capacity-full event returns ERR_EVENT_CLOSED, not ERR_EVENT_FULL."
        test_recipe:
          setup:
            - "Event capacity=1 opened and filled by one registration, then CLOSED; a second customer attempts to register (clock before starts_at)."
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { email: "e1@x.com", full_name: "E1" }
              as: Clerk
              captures: { c1: $.data.id }
            - call: "POST /api/customers"
              payload: { email: "e2@x.com", full_name: "E2" }
              as: Clerk
              captures: { c2: $.data.id }
            - call: "POST /api/events"
              payload: { name: "Signing", store_location: "LOC5B", starts_at: "2026-05-01T10:00:00Z", ends_at: "2026-05-01T12:00:00Z", capacity: 1 }
              as: Clerk
              captures: { ev: $.data.id }
            - call: "POST /api/events/${ev}/transition"
              payload: { to_status: "OPEN" }
              as: Clerk
            - call: "POST /api/event-registrations"
              payload: { customer_id: "${c1}", event_id: "${ev}" }
              as: Clerk
            - call: "POST /api/events/${ev}/transition"
              payload: { to_status: "CLOSED" }
              as: Clerk
          trigger:
            - call: "POST /api/event-registrations"
              payload: { customer_id: "${c2}", event_id: "${ev}" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_EVENT_CLOSED"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: checkout_store_credit_exactly_covers_charge_zero
        grounds:
          - calculations.checkout_settlement
          - entities.Customer.fields.store_credit_cents
        distinguishing_aspect: "Monetary boundary on POST /api/checkout: store_credit_cents (5000) exactly equals amount_due_cents (5000) so charge_cents == 0 (not negative, not positive) and the wallet lands at exactly 0."
        test_recipe:
          setup:
            - "Customer with store_credit_cents=5000 via a Manager credit-adjustment; checkout of exactly 5000 cents, pay_with_store_credit_only=true."
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { email: "b6a@x.com", full_name: "B6A" }
              as: Clerk
              captures: { cust: $.data.id }
            - call: "POST /api/customers/${cust}/credit-adjustments"
              payload: { amount_cents: 5000, reason: "ADJUSTMENT" }
              as: Manager
          trigger:
            - call: "POST /api/checkout"
              payload: { customer_id: "${cust}", line_items: [ { unit_price_cents: 5000, quantity: 1 } ], pay_with_store_credit_only: true }
              as: Clerk
              captures: { charge: $.data.charge_cents }
          assert:
            - "checkout.charge_cents == 0"
            - "checkout.store_credit_applied_cents == 5000"
            - "Customer.${cust}.store_credit_cents == 0"

      - name: event_registration_at_capacity_rejects
        grounds:
          - validations[priority=8]
          - errors[ERR_EVENT_FULL]
          - entities.Event.fields.registered_count
        distinguishing_aspect: "Count boundary on POST /api/event-registrations: with capacity=2 the 3rd registration is rejected because registered_count (2) >= capacity (2), a different metric and endpoint than the checkout monetary boundary."
        test_recipe:
          setup:
            - "OPEN event capacity=2 already filled by two REGISTERED customers; a third customer attempts to register."
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { email: "f1@x.com", full_name: "F1" }
              as: Clerk
              captures: { c1: $.data.id }
            - call: "POST /api/customers"
              payload: { email: "f2@x.com", full_name: "F2" }
              as: Clerk
              captures: { c2: $.data.id }
            - call: "POST /api/customers"
              payload: { email: "f3@x.com", full_name: "F3" }
              as: Clerk
              captures: { c3: $.data.id }
            - call: "POST /api/events"
              payload: { name: "Panel", store_location: "LOC6B", starts_at: "2026-05-02T10:00:00Z", ends_at: "2026-05-02T12:00:00Z", capacity: 2 }
              as: Clerk
              captures: { ev: $.data.id }
            - call: "POST /api/events/${ev}/transition"
              payload: { to_status: "OPEN" }
              as: Clerk
            - call: "POST /api/event-registrations"
              payload: { customer_id: "${c1}", event_id: "${ev}" }
              as: Clerk
            - call: "POST /api/event-registrations"
              payload: { customer_id: "${c2}", event_id: "${ev}" }
              as: Clerk
          trigger:
            - call: "POST /api/event-registrations"
              payload: { customer_id: "${c3}", event_id: "${ev}" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_EVENT_FULL"
            - "Event.${ev}.registered_count == 2"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: allocation_requires_issue_on_sale
        grounds:
          - state_machines.Reservation.RESERVED_to_ALLOCATED
          - validations[priority=7]
          - errors[ERR_ISSUE_NOT_ON_SALE]
        distinguishing_aspect: "Reservation->ComicIssue pair: run-allocation is rejected with ERR_ISSUE_NOT_ON_SALE when the parent ComicIssue is ORDERED rather than ON_SALE."
        test_recipe:
          setup:
            - "Issue in ORDERED (not ON_SALE); one RESERVED reservation on it."
          setup_api_calls:
            - call: "POST /api/comic-series"
              payload: { title: "Zeta", publisher: "Acme" }
              as: Clerk
              captures: { series: $.data.id }
            - call: "POST /api/comic-issues"
              payload: { series_id: "${series}", issue_number: "1", cover_price_cents: 400, on_sale_date: "2026-04-01T00:00:00Z", order_cutoff_date: "2026-03-15T00:00:00Z", copies_ordered: 3 }
              as: Clerk
              captures: { issue: $.data.id }
            - call: "POST /api/comic-issues/${issue}/transition"
              payload: { to_status: "ORDERED" }
              as: Clerk
              captures: { iss_v: $.data.version }
            - call: "POST /api/customers"
              payload: { email: "r7@x.com", full_name: "R7" }
              as: Clerk
              captures: { cust: $.data.id }
            - call: "POST /api/reservations"
              payload: { customer_id: "${cust}", issue_id: "${issue}", requested_qty: 1, expected_comic_issue_version: "${iss_v}" }
              as: Clerk
              captures: { res: $.data.id }
          trigger:
            - call: "POST /api/comic-issues/${issue}/run-allocation"
              payload: {}
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ISSUE_NOT_ON_SALE"

      - name: checkin_requires_event_open
        grounds:
          - state_machines.EventRegistration.REGISTERED_to_CHECKED_IN
          - validations[priority=7]
          - errors[ERR_EVENT_CLOSED]
        distinguishing_aspect: "EventRegistration->Event pair (different from Reservation->ComicIssue): checking in a REGISTERED registration is rejected with ERR_EVENT_CLOSED when the parent Event is CLOSED."
        test_recipe:
          setup:
            - "Event OPEN with one REGISTERED registration, then Event CLOSED."
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { email: "r7b@x.com", full_name: "R7B" }
              as: Clerk
              captures: { cust: $.data.id }
            - call: "POST /api/events"
              payload: { name: "Meet", store_location: "LOC7B", starts_at: "2026-05-03T10:00:00Z", ends_at: "2026-05-03T12:00:00Z", capacity: 5 }
              as: Clerk
              captures: { ev: $.data.id }
            - call: "POST /api/events/${ev}/transition"
              payload: { to_status: "OPEN" }
              as: Clerk
            - call: "POST /api/event-registrations"
              payload: { customer_id: "${cust}", event_id: "${ev}" }
              as: Clerk
              captures: { reg: $.data.id }
            - call: "POST /api/events/${ev}/transition"
              payload: { to_status: "CLOSED" }
              as: Clerk
          trigger:
            - call: "POST /api/event-registrations/${reg}/transition"
              payload: { to_status: "CHECKED_IN" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_EVENT_CLOSED"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: event_halfopen_overlap_same_store_location
        grounds:
          - errors[ERR_EVENT_TIME_CONFLICT]
          - entities.Event.fields.store_location
          - entities.Event.fields.starts_at
        distinguishing_aspect: "Store-location resource with half-open [starts_at, ends_at) semantics: an event [11:00,13:00) overlaps an existing [10:00,12:00) at the same store_location and is rejected (pure half-open interval arithmetic)."
        test_recipe:
          setup:
            - "One event at store_location OVL spanning 2026-05-01T10:00Z..12:00Z."
          setup_api_calls:
            - call: "POST /api/events"
              payload: { name: "E1", store_location: "OVL", starts_at: "2026-05-01T10:00:00Z", ends_at: "2026-05-01T12:00:00Z", capacity: 10 }
              as: Clerk
              captures: { ev1: $.data.id }
          trigger:
            - call: "POST /api/events"
              payload: { name: "E2", store_location: "OVL", starts_at: "2026-05-01T11:00:00Z", ends_at: "2026-05-01T13:00:00Z", capacity: 10 }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_EVENT_TIME_CONFLICT"

      - name: registration_buffered_overlap_same_customer
        grounds:
          - errors[ERR_REGISTRATION_TIME_CONFLICT]
          - entities.EventRegistration.fields.customer_id
        distinguishing_aspect: "Customer-schedule resource with a 30-minute buffer expansion: registering for a [12:15,13:00) event conflicts with a prior [10:00,12:00) registration because buffered windows [9:30,12:30) and [11:45,13:30) overlap even though the raw windows do not — distinct interval semantics from the store-location half-open rule."
        test_recipe:
          setup:
            - "Same customer REGISTERED for event A [10:00,12:00) at LOC_A (OPEN); event B [12:15,13:00) at LOC_B (OPEN) exists."
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { email: "r8@x.com", full_name: "R8" }
              as: Clerk
              captures: { cust: $.data.id }
            - call: "POST /api/events"
              payload: { name: "A", store_location: "LOC_A", starts_at: "2026-05-04T10:00:00Z", ends_at: "2026-05-04T12:00:00Z", capacity: 10 }
              as: Clerk
              captures: { evA: $.data.id }
            - call: "POST /api/events/${evA}/transition"
              payload: { to_status: "OPEN" }
              as: Clerk
            - call: "POST /api/events"
              payload: { name: "B", store_location: "LOC_B", starts_at: "2026-05-04T12:15:00Z", ends_at: "2026-05-04T13:00:00Z", capacity: 10 }
              as: Clerk
              captures: { evB: $.data.id }
            - call: "POST /api/events/${evB}/transition"
              payload: { to_status: "OPEN" }
              as: Clerk
            - call: "POST /api/event-registrations"
              payload: { customer_id: "${cust}", event_id: "${evA}" }
              as: Clerk
          trigger:
            - call: "POST /api/event-registrations"
              payload: { customer_id: "${cust}", event_id: "${evB}" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_REGISTRATION_TIME_CONFLICT"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: copies_conservation_across_allocate_release
        grounds:
          - calculations.issue_copies_available
          - state_machines.Reservation.RESERVED_to_ALLOCATED
          - state_machines.Reservation.ALLOCATED_to_RELEASED
          - entities.ComicIssue.fields.copies_available
          - entities.ComicIssue.fields.copies_allocated
        distinguishing_aspect: "Conserved quantity = total copies: copies_available + copies_allocated == copies_ordered (3) holds before and after an allocate-then-release compensation; after release copies_available returns to 3 and copies_allocated to 0 with zero drift."
        test_recipe:
          setup:
            - "ON_SALE issue copies_ordered=3; one reservation qty1 allocated via run-allocation (copies_available=2, copies_allocated=1)."
          setup_api_calls:
            - call: "POST /api/comic-series"
              payload: { title: "Eta", publisher: "Acme" }
              as: Clerk
              captures: { series: $.data.id }
            - call: "POST /api/comic-issues"
              payload: { series_id: "${series}", issue_number: "1", cover_price_cents: 400, on_sale_date: "2026-04-01T00:00:00Z", order_cutoff_date: "2026-03-15T00:00:00Z", copies_ordered: 3 }
              as: Clerk
              captures: { issue: $.data.id }
            - call: "POST /api/comic-issues/${issue}/transition"
              payload: { to_status: "ORDERED" }
              as: Clerk
            - call: "POST /api/comic-issues/${issue}/transition"
              payload: { to_status: "ON_SALE" }
              as: Clerk
              captures: { iss_v: $.data.version }
            - call: "POST /api/customers"
              payload: { email: "r9@x.com", full_name: "R9" }
              as: Clerk
              captures: { cust: $.data.id }
            - call: "POST /api/reservations"
              payload: { customer_id: "${cust}", issue_id: "${issue}", requested_qty: 1, expected_comic_issue_version: "${iss_v}" }
              as: Clerk
              captures: { res: $.data.id }
            - call: "POST /api/comic-issues/${issue}/run-allocation"
              payload: {}
              as: Clerk
          trigger:
            - call: "POST /api/reservations/${res}/transition"
              payload: { to_status: "RELEASED" }
              as: Clerk
          assert:
            - "ComicIssue.${issue}.copies_available == 3"
            - "ComicIssue.${issue}.copies_allocated == 0"

      - name: store_credit_conservation_across_adjust_and_reverse
        grounds:
          - state_machines.Consignment.SOLD_to_PAID_OUT
          - entities.Customer.fields.store_credit_cents
          - entities.CreditTransaction.fields.balance_after_cents
          - entities.CreditTransaction.fields.amount_cents
        distinguishing_aspect: "Conserved quantity = store-credit wallet (money, not copies): a +5000 adjustment paired with its compensating -5000 adjustment leaves store_credit_cents at exactly 0, and the second CreditTransaction's balance_after_cents is 0 with no drift."
        test_recipe:
          setup:
            - "Customer credited +5000 via a Manager credit-adjustment (store_credit_cents=5000)."
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { email: "r9b@x.com", full_name: "R9B" }
              as: Clerk
              captures: { cust: $.data.id }
            - call: "POST /api/customers/${cust}/credit-adjustments"
              payload: { amount_cents: 5000, reason: "ADJUSTMENT" }
              as: Manager
              captures: { txn1: $.data.id }
          trigger:
            - call: "POST /api/customers/${cust}/credit-adjustments"
              payload: { amount_cents: -5000, reason: "ADJUSTMENT" }
              as: Manager
              captures: { txn2: $.data.balance_after_cents }
          assert:
            - "Customer.${cust}.store_credit_cents == 0"
            - "CreditTransaction.${txn2}.balance_after_cents == 0"
