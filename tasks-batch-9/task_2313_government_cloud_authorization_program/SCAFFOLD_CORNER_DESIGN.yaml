- section: cross_cutting_complexity_layers
  instances:
  - name: both_declared_occ_rules_reject_a_stale_parent_version_and_accept_the_current_one
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[package-create-stale-offering]
    - concurrency_rules[reuse-grant-stale-authorization]
    - validations[priority=10]
    - errors[ERR_STALE_OFFERING_VERSION]
    - errors[ERR_STALE_AUTHORIZATION_VERSION]
    distinguishing_aspect: §1.2.1 declares exactly two OCC rules, on two different parents, with two different error ids and
      two different body fields — so a single shared 'stale version' code would fail. The offering version observed before
      submission is already three writes out of date once the authorization is issued, and the authorization version observed
      before the first grant is one write out of date after it, which makes both 412s reachable without any contrived setup.
    test_recipe:
      setup:
      - 'Full authorization prelude: the offering reached version 9 through create, category, confirm, determination, path
        selection, plan approval, package create, submit and decision.'
      - ${off_v} still holds the value 6 that was read before the package was created, and ${auth_v} holds the Authorization
        version 1 read immediately after the decision.
      - An EPA and an HHS agency exist, neither holding a grant.
