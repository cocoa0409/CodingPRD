              captures: { retire_blocked_err: $.data.error_id }
          assert:
            - "the retire is refused with error_id == ERR_ELEMENT_BIN_OCCUPIED"
            - "Element.${el5701}.status == ACTIVE and Element.${el5701}.sourcing_mode == CURRENT_PRODUCTION"

      - name: element_reissue_returns_an_archived_element_to_the_wall
        claim_type: Action endpoint
        grounds: ["state_machines.Element.CATALOG_to_ACTIVE", "endpoints.POST_/stores/elements/{id}/reissue"]
        distinguishing_aspect: "Reissue moves the element from CATALOG back to ACTIVE and rewrites its sourcing mode to CURRENT_PRODUCTION, so a previously surplus element becomes current-production again."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0221 with element 5801 loaded in no bin, retired into the archive."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "LEGO-0221", display_name: "Brick Yard Twenty One", wall_bin_capacity_grams: 1000, event_capacity_units: 40, checklist_required: true }
              as: PlatformAdmin
              captures: { st221: $.data.id }
            - call: "POST /stores/elements"
              payload: { element_code: "5801", element_name: "Wedge 4x2", theme: "Technic", unit_mass_grams: 1.1, cost_basis_cents: 4, make_ready_lead_days: 5 }
              as: PlatformAdmin
              captures: { el5801: $.data.id, el5801_v1: $.data.version }
            - call: "POST /stores/elements/{id}/retire"
              payload: { expected_element_version: "${el5801_v1}" }
              as: StoreAssociate
              captures: { el5801_retired: $.data.status, el5801_mode: $.data.sourcing_mode }
          trigger:
            - call: "POST /stores/elements/{id}/reissue"
              payload: {}
              as: StoreAssociate
              captures: { el5801_reissued: $.data.status, el5801_reissued_mode: $.data.sourcing_mode }
          assert:
            - "the retire returns status RETIRED_TO_ARCHIVE and sourcing_mode SURPLUS"
            - "the reissue returns status ACTIVE and sourcing_mode CURRENT_PRODUCTION"
            - "Element.${el5801}.version == 3"

      - name: the_member_sub_resource_read_finds_bins_by_store
        claim_type: Cross-reference link
        grounds: ["endpoints.GET_/stores/wall-bins", "entities.Member.fields.home_store_id"]
        distinguishing_aspect: "The filtered member list and the filtered bin list both resolve children from a parent id, so membership and wall contents are reachable from the store without a nested path."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0222 with element 5901, two members and one bin."]
          setup_api_calls:
