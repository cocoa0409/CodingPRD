  - section: calculations
    instances:
      - name: volume_discount_tier_boundaries_at_500_200_and_50_units
        claim_type: tiered_pricing
        grounds:
          - calculations.chain_configuration_unit_price_cents
          - calculations.chain_configuration_unit_price_cents.constants.VOLUME_TIER_500_PCT
          - calculations.chain_configuration_unit_price_cents.constants.VOLUME_TIER_200_PCT
          - calculations.chain_configuration_unit_price_cents.constants.VOLUME_TIER_50_PCT
        distinguishing_aspect: "The volume tier is a single flat percentage chosen by the account's contracted_unit_volume with inclusive lower bounds, not a marginal-rate schedule: on the same base of 1850020 cents with no options, STANDARD_DIAL controls and no branding, volumes 500 / 200 / 199 / 49 must yield indicative prices 1628018 / 1702018 / 1776019 / 1850020."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one ELECTRIC EquipmentModel with base_price_cents 1850020 supporting STANDARD_DIAL."
            - "Four ChainAccounts with contracted_unit_volume 500, 200, 199 and 49, each receiving one identical configuration."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /equipment-models"
              payload: { model_code: "FRY-900", name: "Fryer 900", category: "FRYER", energy_type: "ELECTRIC", base_price_cents: 1850020, supported_controls_packages: ["STANDARD_DIAL"], rated_throughput_units_per_hour: 120 }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { model_id: $.data.id }
            - call: "POST /chain-accounts"
              payload: { account_code: "CHN-500", name: "Volume Five Hundred", contracted_unit_volume: 500 }
              as: ChannelManager
              captures: { a500: $.data.id, v500: $.data.version }
            - call: "POST /chain-accounts"
              payload: { account_code: "CHN-200", name: "Volume Two Hundred", contracted_unit_volume: 200 }
              as: ChannelManager
              captures: { a200: $.data.id, v200: $.data.version }
            - call: "POST /chain-accounts"
              payload: { account_code: "CHN-199", name: "Volume One Ninety Nine", contracted_unit_volume: 199 }
              as: ChannelManager
              captures: { a199: $.data.id, v199: $.data.version }
            - call: "POST /chain-accounts"
              payload: { account_code: "CHN-049", name: "Volume Forty Nine", contracted_unit_volume: 49 }
              as: ChannelManager
              captures: { a49: $.data.id, v49: $.data.version }
          trigger:
            - call: "POST /chain-configurations"
              payload: { chain_account_id: "${a500}", equipment_model_id: "${model_id}", config_code: "CFG-500", option_codes: [], controls_package: "STANDARD_DIAL", branding_kit: "NONE", expected_chain_account_version: "${v500}" }
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { p500: $.data.indicative_unit_price_cents, f500: $.data.firm_unit_price_cents }
            - call: "POST /chain-configurations"
              payload: { chain_account_id: "${a200}", equipment_model_id: "${model_id}", config_code: "CFG-200", option_codes: [], controls_package: "STANDARD_DIAL", branding_kit: "NONE", expected_chain_account_version: "${v200}" }
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { p200: $.data.indicative_unit_price_cents }
            - call: "POST /chain-configurations"
              payload: { chain_account_id: "${a199}", equipment_model_id: "${model_id}", config_code: "CFG-199", option_codes: [], controls_package: "STANDARD_DIAL", branding_kit: "NONE", expected_chain_account_version: "${v199}" }
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { p199: $.data.indicative_unit_price_cents }
            - call: "POST /chain-configurations"
              payload: { chain_account_id: "${a49}", equipment_model_id: "${model_id}", config_code: "CFG-049", option_codes: [], controls_package: "STANDARD_DIAL", branding_kit: "NONE", expected_chain_account_version: "${v49}" }
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { p49: $.data.indicative_unit_price_cents }
          assert:
            - "${p500} == 1628018"
            - "${p200} == 1702018"
            - "${p199} == 1776019"
            - "${p49} == 1850020"
            - "${f500} is null"

      - name: controls_uplift_sits_inside_the_discountable_subtotal
        claim_type: Constants Applied
        grounds:
          - calculations.chain_configuration_unit_price_cents.constants.CONTROLS_UPLIFT_CENTS
          - calculations.chain_configuration_unit_price_cents.formula
        distinguishing_aspect: "The TOUCH_PRO controls uplift of 185000 cents is added BEFORE the volume discount, so at volume 250 on base 1850020 the indicative price is 1872218 -- not 1850020 discounted (1702018) plus an undiscounted 185000, which would give 1887018."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ELECTRIC model with base 1850020 supporting STANDARD_DIAL and TOUCH_PRO; ChainAccount CHN-1 at volume 250."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /equipment-models"
              payload: { model_code: "FRY-900", name: "Fryer 900", category: "FRYER", energy_type: "ELECTRIC", base_price_cents: 1850020, supported_controls_packages: ["STANDARD_DIAL", "TOUCH_PRO"], rated_throughput_units_per_hour: 120 }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { model_id: $.data.id }
            - call: "POST /chain-accounts"
              payload: { account_code: "CHN-1", name: "Skillet Chain", contracted_unit_volume: 250 }
              as: ChannelManager
              captures: { chain_id: $.data.id, chain_v: $.data.version }
          trigger:
            - call: "POST /chain-configurations"
              payload: { chain_account_id: "${chain_id}", equipment_model_id: "${model_id}", config_code: "CFG-1", option_codes: [], controls_package: "TOUCH_PRO", branding_kit: "NONE", expected_chain_account_version: "${chain_v}" }
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { cfg_id: $.data.id, price: $.data.indicative_unit_price_cents }
          assert:
            - "HTTP status == 201"
            - "${price} == 1872218"
            - "${price} != 1887018"
            - "ChainConfiguration.${cfg_id}.controls_package == TOUCH_PRO"

      - name: option_uplift_tie_rounds_half_up_and_not_to_even
        claim_type: Precision
        grounds:
          - calculations.chain_configuration_unit_price_cents.precision
          - calculations.chain_configuration_unit_price_cents.constants.OPTION_PCT
        distinguishing_aspect: "On base 2000060 the SPLIT_TANK uplift is exactly 150004.5 cents, a rounding tie whose integer part is even: ROUND_HALF_UP must give 150005 (indicative 1978060), whereas banker's rounding would give 150004 and an indicative of 1978061."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ELECTRIC model with base_price_cents 2000060 supporting STANDARD_DIAL; ChainAccount at volume 250."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /equipment-models"
              payload: { model_code: "OVN-500", name: "Combi Oven 500", category: "OVEN", energy_type: "ELECTRIC", base_price_cents: 2000060, supported_controls_packages: ["STANDARD_DIAL"], rated_throughput_units_per_hour: 80 }
