              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /circulators"
              payload: { full_name: "Dean Dyer", residency_state_code: "CA" }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { circ_s_id: $.data.id }
            - call: "POST /circulators/${circ_s_id}/training"
              payload: { training_course_code: "SOS-CIRC-101" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /circulators/${circ_s_id}/affidavit"
              payload: { sworn: true }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { circ_s_v: $.data.version }
            - call: "POST /circulation-assignments"
              payload: { petition_id: "${pet_s_id}", circulator_id: "${circ_s_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", assigned_county_codes: ["ALPHA", "BRAVO"], expected_circulator_version: "${circ_s_v}" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /signature-batches"
              payload: { petition_id: "${pet_p_id}", circulator_id: "${circ_p_id}", county_id: "${alpha_id}", affidavit_signed: true }
              as: Proponent
              as_user_id: "prop-1"
              captures: { bpa_id: $.data.id }
            - call: "POST /signature-batches/${bpa_id}/signatures"
              payload: { line_number: 1, signer_name: "Ada Adams", claimed_voter_id_number: "VA1", signed_on: "2026-08-05T00:00:00Z", signature_hash: "H-VA1" }
              as: Proponent
              as_user_id: "prop-1"
              captures: { pa1_id: $.data.id }
            - call: "POST /signature-batches/${bpa_id}/signatures"
              payload: { line_number: 2, signer_name: "Abe Archer", claimed_voter_id_number: "VA2", signed_on: "2026-08-05T00:00:00Z", signature_hash: "H-VA2" }
              as: Proponent
              as_user_id: "prop-1"
            - call: "POST /signature-batches/${bpa_id}/verify-affidavit"
              payload: { affidavit_notary_id: "NOT-1" }
              as: CountyClerk
              as_user_id: "${alpha_id}"
            - call: "POST /signature-batches"
              payload: { petition_id: "${pet_p_id}", circulator_id: "${circ_p_id}", county_id: "${bravo_id}", affidavit_signed: true }
              as: Proponent
              as_user_id: "prop-1"
              captures: { bpb_id: $.data.id }
            - call: "POST /signature-batches/${bpb_id}/signatures"
              payload: { line_number: 1, signer_name: "Bea Brooks", claimed_voter_id_number: "VB1", signed_on: "2026-08-05T00:00:00Z", signature_hash: "H-VB1" }
              as: Proponent
              as_user_id: "prop-1"
              captures: { pb1_id: $.data.id }
            - call: "POST /signature-batches/${bpb_id}/signatures"
              payload: { line_number: 2, signer_name: "Ben Bright", claimed_voter_id_number: "VB2", signed_on: "2026-08-05T00:00:00Z", signature_hash: "H-VB2" }
              as: Proponent
              as_user_id: "prop-1"
            - call: "POST /signature-batches/${bpb_id}/verify-affidavit"
              payload: { affidavit_notary_id: "NOT-2" }
              as: CountyClerk
              as_user_id: "${bravo_id}"
            - call: "POST /signature-batches"
              payload: { petition_id: "${pet_s_id}", circulator_id: "${circ_s_id}", county_id: "${alpha_id}", affidavit_signed: true }
              as: Proponent
              as_user_id: "prop-1"
              captures: { bsa_id: $.data.id }
            - call: "POST /signature-batches/${bsa_id}/signatures"
              payload: { line_number: 1, signer_name: "Ada Adams", claimed_voter_id_number: "VA1", signed_on: "2026-08-05T00:00:00Z", signature_hash: "H-VA1" }
              as: Proponent
              as_user_id: "prop-1"
              captures: { sa1_id: $.data.id }
            - call: "POST /signature-batches/${bsa_id}/signatures"
              payload: { line_number: 2, signer_name: "Abe Archer", claimed_voter_id_number: "VA2", signed_on: "2026-08-05T00:00:00Z", signature_hash: "H-VA2" }
              as: Proponent
              as_user_id: "prop-1"
              captures: { sa2_id: $.data.id }
            - call: "POST /signature-batches/${bsa_id}/verify-affidavit"
              payload: { affidavit_notary_id: "NOT-3" }
              as: CountyClerk
              as_user_id: "${alpha_id}"
            - call: "POST /signature-batches"
              payload: { petition_id: "${pet_s_id}", circulator_id: "${circ_s_id}", county_id: "${bravo_id}", affidavit_signed: true }
              as: Proponent
              as_user_id: "prop-1"
              captures: { bsb_id: $.data.id }
            - call: "POST /signature-batches/${bsb_id}/signatures"
              payload: { line_number: 1, signer_name: "Bea Brooks", claimed_voter_id_number: "VB1", signed_on: "2026-08-05T00:00:00Z", signature_hash: "H-VB1" }
              as: Proponent
              as_user_id: "prop-1"
              captures: { sb1_id: $.data.id }
            - call: "POST /signature-batches/${bsb_id}/signatures"
              payload: { line_number: 2, signer_name: "Ben Bright", claimed_voter_id_number: "VB2", signed_on: "2026-08-05T00:00:00Z", signature_hash: "H-VB2" }
              as: Proponent
              as_user_id: "prop-1"
              captures: { sb2_id: $.data.id }
            - call: "POST /signature-batches/${bsb_id}/verify-affidavit"
              payload: { affidavit_notary_id: "NOT-4" }
              as: CountyClerk
              as_user_id: "${bravo_id}"
            - call: "POST /petitions/${pet_p_id}/file-signatures"
              payload: {}
              as: Proponent
              as_user_id: "prop-1"
            - call: "POST /petitions/${pet_s_id}/file-signatures"
              payload: {}
              as: Proponent
              as_user_id: "prop-1"
            - call: "POST /petitions/${pet_p_id}/verification-rounds"
              payload: { round_type: "RANDOM_SAMPLE" }
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { rp_id: $.data.id, rp_pool: $.data.eligible_pool_size, rp_size: $.data.sample_size }
            - call: "POST /signature-records/${pa1_id}/validate"
              payload: {}
              as: CountyClerk
              as_user_id: "${alpha_id}"
            - call: "POST /signature-records/${pb1_id}/validate"
              payload: {}
              as: CountyClerk
              as_user_id: "${bravo_id}"
            - call: "POST /petitions/${pet_s_id}/verification-rounds"
              payload: { round_type: "RANDOM_SAMPLE" }
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { rs_id: $.data.id, rs_pool: $.data.eligible_pool_size, rs_size: $.data.sample_size }
            - call: "POST /signature-records/${sa1_id}/validate"
              payload: {}
              as: CountyClerk
              as_user_id: "${alpha_id}"
            - call: "POST /signature-records/${sa2_id}/validate"
              payload: {}
              as: CountyClerk
              as_user_id: "${alpha_id}"
            - call: "POST /signature-records/${sb1_id}/validate"
              payload: {}
              as: CountyClerk
              as_user_id: "${bravo_id}"
            - call: "POST /signature-records/${sb2_id}/validate"
              payload: {}
              as: CountyClerk
              as_user_id: "${bravo_id}"
          trigger:
            - call: "POST /verification-rounds/${rp_id}/tally"
              payload: {}
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { p_rate: $.data.validity_rate_bps, p_proj: $.data.projected_valid_count, p_sampled: $.data.sampled_valid_count }
            - call: "POST /verification-rounds/${rs_id}/tally"
              payload: {}
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { s_rate: $.data.validity_rate_bps, s_proj: $.data.projected_valid_count, s_sampled: $.data.sampled_valid_count }
          assert:
            - "${rp_pool} == 4 and ${rs_pool} == 4 — both petitions hold identical 4-line pools"
            - "${rp_size} == 2 — POOLED sizes the draw once: min(4, max(2, ceil(4*5000/10000))) == 2"
            - "${rs_size} == 4 — STRATIFIED applies sample_min_count 2 inside each of the two county strata"
            - "${p_sampled} == 2 and ${p_rate} == 10000"
            - "${s_sampled} == 3 and ${s_rate} == 7500"
            - "${p_proj} == 4 — floor(4 * 10000 / 10000)"
            - "${s_proj} == 3 — ALPHA floor(2 * 5000 / 10000) == 1 plus BRAVO floor(2 * 10000 / 10000) == 2"
            - "Petition.${pet_p_id}.projected_valid_count == 4"
            - "Petition.${pet_s_id}.projected_valid_count == 3"
            - "Petition.${pet_p_id}.accepted_raw_total == 4 and Petition.${pet_s_id}.accepted_raw_total == 4"
            - "VerificationRound.${rp_id}.determination == SUFFICIENT and VerificationRound.${rs_id}.determination == SUFFICIENT"
            - "SignatureRecord.${sa2_id}.validation_status == INVALID_NOT_REGISTERED"

      - name: provisional_vs_adjudicated_circulator_credibility
        grounds:
          - calculations.circulator_credibility_score
          - entities.Circulator.fields.credibility_score_bps
          - entities.Circulator.fields.misconduct_strike_count
          - state_machines.FraudReferral.REFERRED_TO_AG_to_SUBSTANTIATED
        distinguishing_aspect: |
          This instance's two variants live in the Circulator risk-scoring domain, a different entity
          domain from the petition projection: the SAME two examined lines (one VALID, one
          INVALID_NOT_REGISTERED, invalid_rate_bps 5000) score 7500 under the provisional variant,
          7000 once one referral is open, and 3000 under the adjudicated variant after that referral is
          substantiated, because the invalid rate switches from half weight to full weight and the flat
          open-referral penalty is replaced by a 2000 bps strike penalty.
        test_recipe:
          setup:
            - "Standard SOS-FULL, county ALPHA, voter roll VA1 ACTIVE and VA2 INACTIVE."
            - "Petition pet_c cleared 2026-08-01; circulator circ_c REGISTERED with an ACTIVE ALPHA assignment; one affidavit-verified batch with line 1 = VA1 and line 2 = VA2."
            - "An OPEN FULL_CHECK round has selected both lines and both have been validated, so line 1 is VALID and line 2 is INVALID_NOT_REGISTERED; circ_c has misconduct_strike_count 0 and no fraud referral."
