  - { method: GET, path: "/coop/load-management-devices", description: "List devices", roles: [FieldOpsCoordinator, MemberServicesRep], code: 200, input: ["service_location_id?", "status?", "limit?", "offset?"], output: "LoadManagementDevice[]", side_effects: [] }
