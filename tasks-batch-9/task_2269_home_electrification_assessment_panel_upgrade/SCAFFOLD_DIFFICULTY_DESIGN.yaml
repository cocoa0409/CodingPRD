            - call: "POST /assessments"
              payload: { household_id: "${hh_id}", contractor_id: "${ctr_id}", assessed_panel_amps: 200, expected_household_version: "${hh_v1}", measures: [ { measure_code: "HP-HVAC-01", proposed_quantity: 1, estimated_cost_cents: 1000000 }, { measure_code: "HP-DUCT-01", proposed_quantity: 1, estimated_cost_cents: 300000 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { asm_id: $.data.id }
            - call: "POST /assessments/${asm_id}/approve"
