  - section: validations
    instances:
      - name: corner_missing_auth_header_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_AUTH]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID is rejected 401 ERR_MISSING_AUTH before any other check (even on a well-formed payload)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "No Headers Inc", organization_type: "CORPORATION", contact_email: "x@x.example" }, as: SystemAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "The test harness strips both auth headers for this call; the response is 401 with err == ERR_MISSING_AUTH"

      - name: corner_unknown_role_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_AUTH]"]
        distinguishing_aspect: "An X-User-Role outside the six declared roles is an authentication failure (401 ERR_MISSING_AUTH), not a 403."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "No Headers Inc", organization_type: "CORPORATION", contact_email: "x@x.example" }, as: SystemAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "The harness sends X-User-Role: SuperUser for this call; the response is 401 with err == ERR_MISSING_AUTH"

      - name: corner_role_denied_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Applicant attempting a SystemAdmin-only operation (bank registration) is rejected 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["One registered applicant"]
          setup_api_calls:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Acme Dredging LLC", organization_type: "CORPORATION", contact_email: "permits@acme.example" }, as: SystemAdmin, captures: { ap_id: "$.data.id" } }
          trigger:
            - { call: "POST /wetland-permits/mitigation-banks", payload: { bank_name: "Rogue Bank", sponsor_name: "Nobody", state_code: "VA", service_area_watersheds: ["18020101"], credit_capacity: { FORESTED_WETLAND: 5 }, base_price_per_credit: { FORESTED_WETLAND: 30000 } }, as: Applicant, as_user_id: "${ap_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_FORBIDDEN_ROLE (403)"

      - name: corner_not_resource_owner_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "Applicant B submitting applicant A's application is rejected 403 ERR_NOT_RESOURCE_OWNER even though the application exists and is in DRAFT."
        test_recipe:
          setup: ["Two applicants; A's application in DRAFT"]
          setup_api_calls:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Acme Dredging LLC", organization_type: "CORPORATION", contact_email: "a@acme.example" }, as: SystemAdmin, captures: { ap_a: "$.data.id" } }
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Blue Ridge Builders", organization_type: "CORPORATION", contact_email: "b@brb.example" }, as: SystemAdmin, captures: { ap_b: "$.data.id" } }
            - { call: "POST /wetland-permits/sites", payload: { applicant_id: "${ap_a}", site_name: "Acme Tract", state_code: "VA", watershed_code: "18020101", total_acres: 40.0, resource_types_present: ["FORESTED_WETLAND"] }, as: SystemAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations", payload: { site_id: "${site_id}", jd_type: "APPROVED", determination: "JURISDICTIONAL", rationale: "Jurisdictional" }, as: Reviewer, as_user_id: "rev-1", captures: { jd_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations/${jd_id}/issue", payload: {}, as: DistrictEngineer, as_user_id: "de-1" }
            - { call: "POST /wetland-permits/applications", payload: { site_id: "${site_id}", jd_id: "${jd_id}", pathway: "INDIVIDUAL", impacts: [ { resource_type: "FORESTED_WETLAND", impact_acres: 2.0 } ], project_purpose: "Stormwater facility", estimated_cost_dollars: 750000 }, as: Applicant, as_user_id: "${ap_a}", captures: { app_id: "$.data.id" } }
          trigger:
            - { call: "POST /wetland-permits/applications/${app_id}/submit", payload: {}, as: Applicant, as_user_id: "${ap_b}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_NOT_RESOURCE_OWNER (403); the application stays DRAFT"

      - name: corner_gp_acreage_boundary
        claim_type: boundary_check
        grounds: ["validations[priority=15]", "errors[ERR_GENERAL_PERMIT_INELIGIBLE]"]
        distinguishing_aspect: "The 0.50-acre general-permit cap is inclusive: 0.50 submits cleanly; 0.51 is rejected with ERR_GENERAL_PERMIT_INELIGIBLE."
        test_recipe:
          setup: ["Site presenting EMERGENT_MARSH and STREAM; ISSUED JD; two GENERAL applications (0.50 and 0.51 acres)"]
          setup_api_calls:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Acme Dredging LLC", organization_type: "CORPORATION", contact_email: "permits@acme.example" }, as: SystemAdmin, captures: { ap_id: "$.data.id" } }
            - { call: "POST /wetland-permits/sites", payload: { applicant_id: "${ap_id}", site_name: "Piney Branch Tract", state_code: "VA", watershed_code: "18020101", total_acres: 40.0, resource_types_present: ["EMERGENT_MARSH", "STREAM"] }, as: SystemAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations", payload: { site_id: "${site_id}", jd_type: "APPROVED", determination: "JURISDICTIONAL", rationale: "Jurisdictional" }, as: Reviewer, as_user_id: "rev-1", captures: { jd_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations/${jd_id}/issue", payload: {}, as: DistrictEngineer, as_user_id: "de-1" }
            - { call: "POST /wetland-permits/applications", payload: { site_id: "${site_id}", jd_id: "${jd_id}", pathway: "GENERAL", general_permit_code: "NWP-29", impacts: [ { resource_type: "EMERGENT_MARSH", impact_acres: 0.50 } ], project_purpose: "Boat ramp", estimated_cost_dollars: 120000 }, as: Applicant, as_user_id: "${ap_id}", captures: { app_ok: "$.data.id" } }
            - { call: "POST /wetland-permits/applications", payload: { site_id: "${site_id}", jd_id: "${jd_id}", pathway: "GENERAL", general_permit_code: "NWP-29", impacts: [ { resource_type: "EMERGENT_MARSH", impact_acres: 0.51 } ], project_purpose: "Boat ramp expansion", estimated_cost_dollars: 130000 }, as: Applicant, as_user_id: "${ap_id}", captures: { app_over: "$.data.id" } }
          trigger:
