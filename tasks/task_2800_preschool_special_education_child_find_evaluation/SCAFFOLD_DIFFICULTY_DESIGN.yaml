            - "Provider.${slp_id}.travel_overhead_minutes == 30"
            - "Provider.${slp_id}.assigned_weekly_service_minutes == 320"
            - "Provider.${slp_id}.service_capacity_posture == \"NEAR_CAPACITY\""
            - "ServiceLine.${line2_id}.status == \"STAFFED\""
            - "ServiceLine.${line2_id}.delivery_site_id == \"${site2_id}\""

      - name: iep_seat_count_is_conserved_across_reservation_refusal_and_re_reservation
        grounds:
          - calculations.site_reserved_iep_seat_count
          - validations[priority=35]
          - errors.ERR_IEP_SEAT_CAPACITY_EXCEEDED
          - state_machines.ServicePlan.PENDING_PARENT_CONSENT_to_DECLINED
        distinguishing_aspect: |
          reserved_iep_seat_count is defined as a recount of the plans at the site
          whose status is PENDING_PARENT_CONSENT or ACTIVE, so it must move in
          both directions: the first consent submission takes the single seat at
          S1 and locks out the second child with ERR_IEP_SEAT_CAPACITY_EXCEEDED,
          the parent's REFUSED decision releases that seat back to 0 in the same
          request that discontinues the plan's lines and zeroes the provider, and
          the second child's previously refused submission then succeeds and
          brings the count back to exactly 1 - never to 2.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Site S1 has iep_seat_capacity 1 and supports 'en'."
            - "Child A (Ben Ortiz) and child B (Nia Vega), both born 2023-08-01, each carry a consent-granted, fully assessed evaluation case with a drafted report and an ELIGIBLE DRAFT plan placed at S1."
            - "Child A's plan carries one SLP DIRECT line of 150 weekly minutes STAFFED at S1, so the provider stands at 160 assigned minutes."
          setup_api_calls:
            - call: "POST /child-find/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
