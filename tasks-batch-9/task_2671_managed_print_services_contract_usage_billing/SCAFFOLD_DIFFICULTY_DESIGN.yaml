  - rule_id: compensating_invariant
    instances:
      - name: void_newest_read_restores_device_meter_watermarks_and_lifetime_counters
        grounds:
          - state_machines.MeterRead.ACCEPTED_to_VOID
          - entities.Device.fields.last_accepted_mono_meter
          - entities.Device.fields.lifetime_mono_pages
          - entities.Device.fields.pages_since_last_cartridge
          - entities.Device.fields.toner_level_pct
        distinguishing_aspect: |
          Conserved quantity: the Device's page/meter ledger (last_accepted_*_meter, lifetime_*_pages,
          pages_since_last_cartridge, last_read_at, toner_level_pct). Voiding the newest ACCEPTED read must
          rewind every one of those to the values implied by the REMAINING newest accepted read - not to
          zero, and not by naive subtraction of the voided read's raw meter value. The voided row itself
          must also be neutralised (mono_delta / color_delta zeroed) so the billing input set no longer
          sees it.
        test_recipe:
          setup:
            - "ACTIVE contract (MONO 1..null @9375, minimums 0), one ACTIVE mono device, OPEN BillingPeriod 2026-08-01 .. 2026-09-01"
            - "read R1 ACCEPTED: mono_meter 5000, toner 80, covering [2026-08-01, 2026-08-08)"
            - "read R2 ACCEPTED: mono_meter 9000, toner 70, covering [2026-08-08, 2026-08-15) - the newest accepted read"
            - "logical clock at 2026-08-20T00:00:00Z"
          setup_api_calls:
            - call: "POST /service-contracts"
              payload: { customer_name: "Larkin Mfg", term_months: 36, included_service_scope: "BASIC", minimum_mono_pages_per_period: 0, minimum_color_pages_per_period: 0, monthly_service_fee_cents: 48000, response_sla_hours_critical: 4, response_sla_hours_standard: 24, labor_rate_cents_per_hour: 9500, early_termination_fee_cents: 0 }
