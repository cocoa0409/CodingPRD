      - name: gpa_aggregation_counts_failed_rows_but_never_incomplete_rows
        claim_type: aggregation
        grounds:
          - calculations.transcript_gpa
          - calculations.transcript_gpa.input_set
          - entities.Student.fields.credits_earned_total
