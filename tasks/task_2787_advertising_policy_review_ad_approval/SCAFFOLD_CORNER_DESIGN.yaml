            - "The admin's submission on behalf of advertiser A returns HTTP 201 with Certification.${cert_admin}.status == ACTIVE and advertiser_id ${adv_a}"
            - "The reviewer's and the analyst's submissions return HTTP 403 with error_id ERR_FORBIDDEN_ROLE"
            - "Advertiser B's submission for advertiser A returns HTTP 403 with error_id ERR_ADVERTISER_SCOPE_VIOLATION — the shared write is still scoped for the Advertiser role"
            - "GET /ad-policy/certifications?advertiser_id=${adv_a} reports total_count == 2, ordered by valid_from ASC then created_at ASC, with issuing countries US then CA"

      - name: rbac_reads_are_shared_but_the_reviewer_roster_and_decision_log_are_closed_to_advertisers
