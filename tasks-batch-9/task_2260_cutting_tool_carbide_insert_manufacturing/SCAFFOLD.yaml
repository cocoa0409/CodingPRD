    output: ToolProduct
    side_effects: ["release_status=DEVELOPMENT", "supply_status=UNAVAILABLE", "pinned_grade_revision / pinned_geometry_revision / pinned_coating_revision captured", "engineering_lead_time_days and expedite_eligible computed", "tool_life_index=null", "qualified_workpiece_groups=[]", "open_order_units=0", "version=1"]

  - method: GET
    path: "/tooling/tool-products/{productId}"
