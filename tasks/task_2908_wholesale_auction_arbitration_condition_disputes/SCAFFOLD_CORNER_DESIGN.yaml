              as: AuctionAdmin
              as_user_id: "admin-01"
              captures: { seller_id: $.data.id }
            - call: "POST /arbitration/buyers"
              payload: { name: "Harbor Auto Group", dealer_license_no: "BL-2001" }
              as: AuctionAdmin
              as_user_id: "admin-01"
              captures: { buyer_id: $.data.id }
            - call: "POST /arbitration/policies"
              payload: { defect_class: "MECHANICAL", window_hours: 48, mileage_limit: 250, min_claim_amount_cents: 60000, requires_third_party_verification: false, max_allowance_bps: 2000, psi_extension_hours: 96, psi_clean_waives_rights: true }
