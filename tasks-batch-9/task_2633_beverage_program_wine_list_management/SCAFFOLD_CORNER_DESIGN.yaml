  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_claim_against_stale_offer_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[claim-create-stale-offer]
          - errors[ERR_STALE_VERSION]
          - validations[priority 23]
        distinguishing_aspect: >-
          The conflict is invisible to every state check: the offer is still OPEN, the deadline has not
          passed and unallocated bottles remain, so the second venue's claim WOULD succeed on its own —
          only the version token it based its request size on has moved, because the first venue's claim
          bumped the parent offer. Refusals must not bump the version.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Two venues HRB and GDN, one distributor, one allocated RED wine, one OPEN offer of 10 bottles (version captured before any claim)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/venues"
              payload: { name: "Harbor Room", venue_code: "HRB", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 }, priority_rank: 1 }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { v1_id: $.data.id }
            - call: "POST /beverage-program/venues"
              payload: { name: "Garden Table", venue_code: "GDN", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 }, priority_rank: 2 }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { v2_id: $.data.id }
            - call: "POST /beverage-program/distributors"
              payload: { name: "Coastal Selections", license_number: "LIC-0001", allocation_tier: "A" }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { d1_id: $.data.id }
            - call: "POST /beverage-program/wines"
              payload: { producer: "Ridge", cuvee: "Monte Bello", vintage_year: 2019, category: "RED", reference_cost_cents: 5000, bottle_size_ml: 750, case_pack: 6, is_allocated: true }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { w1_id: $.data.id }
            - call: "POST /beverage-program/allocation-offers"
              payload: { distributor_id: "${d1_id}", wine_id: "${w1_id}", offered_bottles: 10, unit_cost_cents: 5000, response_deadline: "2026-09-30T00:00:00Z" }
              as: DistributorRep
              as_user_id: "${d1_id}"
              captures: { off_id: $.data.id, off_v1: $.data.version }
          trigger:
            - call: "POST /beverage-program/allocation-offers/${off_id}/claims"
              payload: { venue_id: "${v1_id}", requested_bottles: 4, expected_offer_version: "${off_v1}" }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /beverage-program/allocation-offers/${off_id}/claims"
              payload: { venue_id: "${v2_id}", requested_bottles: 3, expected_offer_version: "${off_v1}" }
              as: VenueSommelier
              as_user_id: "${v2_id}"
              captures: { stale_err: $.data.error_id }
            - call: "GET /beverage-program/allocation-offers/${off_id}"
              payload: {}
              as: VenueSommelier
              as_user_id: "${v2_id}"
              captures: { off_v2: $.data.version }
            - call: "POST /beverage-program/allocation-offers/${off_id}/claims"
              payload: { venue_id: "${v2_id}", requested_bottles: 3, expected_offer_version: "${off_v2}" }
              as: VenueSommelier
              as_user_id: "${v2_id}"
              captures: { c2_id: $.data.id }
          assert:
            - "the first claim is created 201 and AllocationOffer.${off_id}.version advances from ${off_v1} to ${off_v1} + 1 — a claim is a write on its parent offer"
            - "the second venue's claim carrying the pre-claim token returns 412 with ${stale_err} == ERR_STALE_VERSION"
            - "the refused claim created no AllocationClaim row and did NOT bump the offer version: the re-read ${off_v2} equals ${off_v1} + 1"
            - "fulfillment_state is still OPEN, unallocated_bottles is still 10 and response_deadline has not passed, so no state precondition could have produced the 412"
            - "the retry with ${off_v2} returns 201 (claim ${c2_id}, state REQUESTED) and bumps the offer version to ${off_v2} + 1"
      - name: occ_entry_add_against_stale_list_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[entry-add-stale-list-version]
          - errors[ERR_STALE_VERSION]
          - validations[priority 23]
        distinguishing_aspect: >-
          Every child write bumps the parent ListVersion, so two clients building the same DRAFT list
          collide even though adding a second entry is perfectly legal; and because the duplicate-wine
          rule sits at priority 22, ahead of the stale-version rule at 23, a request that is both stale
          and duplicated must surface the duplicate error, never the 412.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z."
            - "Venue HRB with two RED wines A and B and one empty DRAFT ListVersion (version token captured)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/venues"
              payload: { name: "Harbor Room", venue_code: "HRB", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 } }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { v1_id: $.data.id }
            - call: "POST /beverage-program/wines"
              payload: { producer: "Ridge", cuvee: "Monte Bello", vintage_year: 2019, category: "RED", reference_cost_cents: 2400, bottle_size_ml: 750, case_pack: 6, is_allocated: false }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { w_a_id: $.data.id }
            - call: "POST /beverage-program/wines"
              payload: { producer: "Ridge", cuvee: "Geyserville", vintage_year: 2019, category: "RED", reference_cost_cents: 2400, bottle_size_ml: 750, case_pack: 6, is_allocated: false }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { w_b_id: $.data.id }
            - call: "POST /beverage-program/venues/${v1_id}/wine-lists"
              payload: { name: "Dinner List" }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { wl_id: $.data.id }
            - call: "POST /beverage-program/wine-lists/${wl_id}/versions"
              payload: {}
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { lv_id: $.data.id, lv_v1: $.data.version }
          trigger:
            - call: "POST /beverage-program/list-versions/${lv_id}/entries"
              payload: { wine_id: "${w_a_id}", sort_rank: 1, expected_list_version_version: "${lv_v1}", by_the_glass: false, par_bottles: 6 }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { e_a_id: $.data.id }
            - call: "POST /beverage-program/list-versions/${lv_id}/entries"
              payload: { wine_id: "${w_b_id}", sort_rank: 2, expected_list_version_version: "${lv_v1}", by_the_glass: false, par_bottles: 6 }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { stale_err: $.data.error_id }
            - call: "POST /beverage-program/list-versions/${lv_id}/entries"
              payload: { wine_id: "${w_a_id}", sort_rank: 3, expected_list_version_version: "${lv_v1}", by_the_glass: false, par_bottles: 6 }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { dup_err: $.data.error_id }
            - call: "GET /beverage-program/list-versions/${lv_id}"
              payload: {}
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { lv_v2: $.data.version }
            - call: "POST /beverage-program/list-versions/${lv_id}/entries"
              payload: { wine_id: "${w_b_id}", sort_rank: 2, expected_list_version_version: "${lv_v2}", by_the_glass: false, par_bottles: 6 }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { e_b_id: $.data.id }
          assert:
            - "the first entry is created 201 and ListVersion.${lv_id}.version advances to ${lv_v1} + 1 while entry_count becomes 1"
            - "the second add with the now-stale ${lv_v1} returns 412 with ${stale_err} == ERR_STALE_VERSION and entry_count stays 1"
            - "the third call, stale AND duplicating wine A, returns 409 with ${dup_err} == ERR_DUPLICATE_LIST_ENTRY_WINE — priority 22 is evaluated before the stale-version rule at 23"
            - "neither refusal bumped the version: the re-read ${lv_v2} equals ${lv_v1} + 1"
            - "the retry with ${lv_v2} returns 201 (entry ${e_b_id}), entry_count 2 and version ${lv_v2} + 1"
      - name: cascading_side_effects_chain_from_write_off_to_list_version
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        distinguishing_aspect: >-
          The four-level chain (write-off -> lot -> bin occupancy -> list entry availability -> list
          version counters) with its ordering sensitivity is already exercised end-to-end by the §1.8
          transitive-cascade instance, including the reversal that walks the same chain backwards.
        excluded_because:
          difficulty_instance: write_off_approval_cascades_lot_bin_entry_and_list_version
          rationale: >-
            That instance asserts every hop of the cascade in one run (lot bottles_on_hand and state, bin
            bottles_stored, the entry's availability_state, and ListVersion.out_of_stock_entry_count),
            and its companion compensating-invariant instance covers the partial-undo path. A separate
            §1.9 instance would duplicate the same assertions with no new distinguishing aspect.
      - name: dual_variant_calculation_fifo_versus_weighted_average
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        distinguishing_aspect: >-
          Both costing variants and the delta between them are already produced from one shared fixture
          by the §1.8 dual-variant instance, which is the only place the two venue costing_method values
          can be compared on identical lots.
        excluded_because:
          difficulty_instance: fifo_vs_weighted_average_event_settlement_cogs
          rationale: >-
            That instance settles the same event twice under FIFO (28000) and WEIGHTED_AVERAGE (32000)
            against identical lots and asserts the 4000-cent divergence plus the ledger delta on the
            variant switch, which is exactly the layer's required claim set.
  - section: consistency_model
    instances:
      - name: vintage_cascade_is_visible_in_the_same_response_and_immediate_reads
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model[immediate]
          - state_machines.ListVersion
          - constants_global.REPRINT_THRESHOLD_ENTRIES
        distinguishing_aspect: >-
          Nothing in this API is deferred: creating a successor vintage mutates entries on an already
          PUBLISHED version, and the derived counters plus the parent's state are already correct in the
          FIRST read after the response returns — there is no reconciliation job, and crossing the
          two-entry reprint threshold takes effect on the write that crosses it, not on the next read.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z."
            - "Venue HRB with a PUBLISHED ListVersion holding two entries: wine A (Monte Bello 2019) and wine B (Geyserville 2019)."
          setup_api_calls:
