            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${s_f1}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 200.0, min_maturation_months: 48 }
              as: WarehouseManager
              captures: { b_id: $.data.id, b_v: $.data.version }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2029-09-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /barrel-aging/barrels/${b_id}", as: WarehouseManager }
            - call: "POST /barrel-aging/barrels/${b_id}/rotations"
              payload: { to_slot_id: "${s_f2}", expected_barrel_version: "${b_v}" }
              as: WarehouseManager
            - { call: "GET /barrel-aging/barrels/${b_id}", as: WarehouseManager }
          assert:
            - "before rotation: current_volume_statutory_liters == 191.27 (heat 1.00 over 4 blocks)"
            - "after rotation to the floor-2 slot at the same clock: current_volume_statutory_liters == 190.84 (heat 1.05 applied to all 4 blocks)"
            - "current_volume_ledger_liters == 200.00 throughout (rotation records no volume event)"

