# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum, or non-positive numeric where > 0 required" }
  - { id: ERR_INVALID_PERIOD_FORMAT, http: 409, condition: "period is not YYYY-MM format" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in the required state for this transition" }
  - { id: ERR_SERVICE_LINE_NOT_ACTIVE, http: 409, condition: "Referenced service line is ARCHIVED" }
  - { id: ERR_MODEL_NOT_ACTIVE, http: 409, condition: "Referenced cost model is not ACTIVE" }
  - { id: ERR_OVERHEAD_CENTER_INVALID, http: 422, condition: "overhead_cost_center is not an ACTIVE center with cost_type=OVERHEAD" }
  - { id: ERR_ACTIVITY_CENTER_INVALID, http: 422, condition: "Activity line center is DIRECT, or archived, or capacity_measure mismatch with model basis" }
  - { id: ERR_SUPERSEDE_TARGET_INVALID, http: 422, condition: "supersedes_model_id missing-ACTIVE or different service_line_id" }
  - { id: ERR_PHYSICIAN_NOT_ACTIVE, http: 422, condition: "Case references an INACTIVE physician" }
  - { id: ERR_CASE_PERIOD_BEFORE_MODEL, http: 409, condition: "Case period < cost model effective_period" }
  - { id: ERR_CASE_NO_ACTIVITY, http: 409, condition: "Post attempted with zero activity lines" }
  - { id: ERR_CASE_STALE_MODEL, http: 409, condition: "Lock attempted when case.version_at_post != current CostModel.version" }
  - { id: ERR_PERIOD_HAS_STALE_CASES, http: 409, condition: "BudgetPeriod lock attempted while POSTED cases in the period are priced under a stale model version" }
  - { id: ERR_SERVICE_LINE_HAS_OPEN_CASES, http: 409, condition: "Archive blocked by DRAFT/POSTED cases on the line" }
  - { id: ERR_SERVICE_LINE_HAS_ACTIVE_MODEL, http: 409, condition: "Archive blocked by an ACTIVE model on the line" }
  - { id: ERR_MODEL_HAS_OPEN_CASES, http: 409, condition: "Model archive blocked by DRAFT/POSTED cases" }
  - { id: ERR_MODEL_HAS_OPEN_REFRESH, http: 409, condition: "Model archive blocked by PROPOSED/APPROVED refresh" }
  - { id: ERR_COST_CENTER_IN_USE, http: 409, condition: "Cost center archive blocked by referencing model or open-case activity lines" }
  - { id: ERR_PHYSICIAN_HAS_OPEN_CASES, http: 409, condition: "Physician deactivate blocked by DRAFT/POSTED cases" }
  - { id: ERR_REFRESH_VARIANCE_EXCEEDED, http: 422, condition: "Any variance_report delta_pct with abs > 3.00 at refresh approval" }
  - { id: ERR_DATA_QUALITY_TOO_LOW, http: 422, condition: "data_quality_score < 80.00 at refresh approval" }
  - { id: ERR_DUPLICATE_BUDGET_PERIOD, http: 409, condition: "BudgetPeriod already exists for (cost_center_id, period)" }
  - { id: ERR_STALE_MODEL_VERSION, http: 412, condition: "expected_model_version does not match current CostModel.version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CostAnalyst
    description: "Builds cost models, cases, activity lines, implants, supplies, and proposes refreshes; posts and voids cases"
    identity: opaque
    exclusive_operations:
      - "POST /cost-accounting/cost-models"
      - "POST /cost-accounting/cost-model-refreshes"
      - "POST /cost-accounting/cases"
      - "POST /cost-accounting/cases/{id}/activity-lines"
      - "POST /cost-accounting/cases/{id}/implants"
      - "POST /cost-accounting/cases/{id}/supply-lines"
      - "POST /cost-accounting/cases/{id}/post"
      - "POST /cost-accounting/cases/{id}/void"
    shared_operations:
      - "All GET endpoints"

  - name: FinanceController
    description: "Owns reference data (service lines, cost centers, physicians, DRGs, payer contracts, budget periods) and approves/archives models, refreshes, locks cases and periods"
    identity: opaque
    exclusive_operations:
      - "POST /cost-accounting/service-lines"
      - "POST /cost-accounting/service-lines/{id}/archive"
      - "POST /cost-accounting/cost-centers"
      - "POST /cost-accounting/cost-centers/{id}/archive"
      - "POST /cost-accounting/physicians"
      - "POST /cost-accounting/physicians/{id}/deactivate"
      - "POST /cost-accounting/physicians/{id}/reactivate"
      - "POST /cost-accounting/drgs"
      - "POST /cost-accounting/cost-models/{id}/approve"
      - "POST /cost-accounting/cost-models/{id}/archive"
      - "POST /cost-accounting/cost-model-refreshes/{id}/approve"
      - "POST /cost-accounting/cost-model-refreshes/{id}/reject"
      - "POST /cost-accounting/cost-model-refreshes/{id}/apply"
      - "POST /cost-accounting/payer-contracts"
      - "POST /cost-accounting/budget-periods"
      - "POST /cost-accounting/budget-periods/{id}/lock"
      - "POST /cost-accounting/cases/{id}/lock"
    shared_operations:
      - "All GET endpoints"

  - name: ServiceLineManager
    description: "Read-only consumer of reports and entity data for service-line decisions"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"
