            - { call: "POST /instructor-contracts", payload: { session_id: "${si}", instructor_id: "${i1}", revenue_share_bp: 5000, guarantee_min_cents: 0, cancellation_guarantee_cents: 0, settlement_basis: ENROLLMENT_BASIS }, as: ProgramCoordinator, captures: { ci: $.data.id } }
          trigger:
            - { call: "POST /instructor-contracts/${ci}/accept", payload: {}, as: Instructor, as_user_id: "${i2}", captures: { err: $.data.error_id } }
            - { call: "POST /instructor-contracts/${ci}/accept", payload: {}, as: Instructor, as_user_id: "${i1}", captures: { ci_st: $.data.status } }
          assert:
