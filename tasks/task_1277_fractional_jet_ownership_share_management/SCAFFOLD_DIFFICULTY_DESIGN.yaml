              payload: {}
              as: ProgramAdmin
              captures: { share_v: $.data.version }
            - call: "POST /invoices"
              payload: { owner_id: "${own_id}", billing_period: "2026-08" }
              as: FinanceOps
              captures: { inv_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: FinanceOps
            - call: "POST /bookings"
              payload: { share_id: "${share_id}", requested_class_id: "${cls_mid}", scheduled_departure_utc: "2026-11-15T15:00:00Z", estimated_block_hours: 1.00, expected_share_version: "${share_v}" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /invoices/${inv_id}"
              payload: {}
              as: FinanceOps
              captures: { inv_status: $.data.invoice_status }
            - call: "GET /owners/${own_id}"
