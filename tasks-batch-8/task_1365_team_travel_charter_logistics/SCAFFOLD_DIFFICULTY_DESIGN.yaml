              captures: { m1: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members"
              payload: { member_ref: "M02", party_role: "COACH", travel_class: "CHARTER_STANDARD", per_diem_tier: "TIER_B" }
              as: TravelManager
              captures: { m2: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/charter-contracts"
              payload: { vendor_code: "VX", base_price_cents: 8000000, fuel_surcharge_cap_cents: 800000, seat_capacity: 30, cargo_capacity_lb: 15000, penalty_bands: [{days_before: 30, penalty_pct: 10}] }
              as: TravelManager
