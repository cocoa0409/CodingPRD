        distinguishing_aspect: "The reviewer identity is compared against the stored submitted_by_user_id, which for an entity-backed SiteOperator is the landfill id itself — so the forbidden CQA user id is data, not a constant, and the check covers begin-review, return and approve alike."
        test_recipe:
          setup:
