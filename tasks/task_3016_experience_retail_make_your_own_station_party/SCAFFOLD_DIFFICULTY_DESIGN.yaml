  # ===========================================================================
  # Rule 2 — combinatorial_formula: two instances in DIFFERENT modes
  # ((b) nested rounding order vs (a) tiered/circular evaluation order).
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: party_final_per_line_rounding_before_summation
        grounds:
          - calculations.party_final_amount_due
          - state_machines.PartyReservation.CONFIRMED_to_COMPLETED
        distinguishing_aspect: |
          Mode (b) nested rounding: the service charge is rounded per guest line
          and THEN summed; summing first and rounding once is the rejected
          alternative. With 12 CELEBRATION guests at 4299 each: per-line
          round(4299*0.15)=645, subtotal = 12*(4299+645) = 59328, minus deposit
          10000 = 49328. Sum-then-round gives the same 59328 here, but with
          10 BASIC guests at 1899: per-line round(1899*0.15)=285 -> subtotal
          21840; sum-first would be round(18990*1.15)=round(21838.5)=21839 — the
          pinned order is what makes the result well-defined.
        test_recipe:
          setup:
            - "Store S3 (2 rooms); Customer C3; one PARTY_HOST at S3"
