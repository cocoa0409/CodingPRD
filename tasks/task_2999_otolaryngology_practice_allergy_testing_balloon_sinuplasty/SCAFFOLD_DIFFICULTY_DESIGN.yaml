  # ===========================================================================
  # RULE 3 — non_linear_state_machine
  # Instance 1 is a CYCLE on SinuplastyCase (AUTH_SUBMITTED -> INFO_REQUESTED ->
  # AUTH_SUBMITTED, bounded at revision_round 2). Instance 2 is PARALLEL STATE
  # DIMENSIONS on DeviceDispense (fit_status x billing_status). Different
  # entities and different non-linear shapes.
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: sinuplasty_case_revision_cycle
        grounds:
          - state_machines.SinuplastyCase.AUTH_SUBMITTED_to_INFO_REQUESTED
          - state_machines.SinuplastyCase.INFO_REQUESTED_to_AUTH_SUBMITTED
          - entities.SinuplastyCase.fields.revision_round
          - entities.SinuplastyCase.fields.submitted_by_user_id
          - errors[ERR_REVISION_LIMIT_REACHED]
          - segregation_of_duties[case_submitter_is_not_decider]
        distinguishing_aspect: |
          SinuplastyCase re-enters AUTH_SUBMITTED from INFO_REQUESTED three times, so the
          machine is a bounded cycle rather than a pipeline: revision_round climbs 0 -> 1 -> 2
          and the fourth submission is refused with ERR_REVISION_LIMIT_REACHED while the case
          stays in INFO_REQUESTED — the loop has a termination condition, not a terminal state.
        test_recipe:
          setup:
            - "PayerPolicy CYC-2999 with requires_prior_auth true, min_medical_management_days 28, min_documented_criteria 3, requires_ct_within_months 12."
            - "One adult Patient and one SinuplastyCase documented so that POLICY_STRICT yields ELIGIBLE: one INCS course 2026-06-01..2026-06-28 (28 contiguous days), criteria [CT_OPACIFICATION, SNOT22_GE_20, FAILED_INCS], ct_study_date 2026-07-15 (17 days old, inside the 360-day window)."
            - "Clock stays at its default 2026-08-01T00:00:00Z throughout."
            - "Submissions are made by user u_pl_1 and decisions by u_pl_2, satisfying segregation_of_duties.case_submitter_is_not_decider."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Cycle Mutual", plan_code: "CYC-2999", requires_prior_auth: true, min_medical_management_days: 28, min_documented_criteria: 3, requires_ct_within_months: 12, max_balloon_devices: 2, auth_validity_days: 90 }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10051", full_name: "Revision Patient", date_of_birth: "1988-06-20", epinephrine_on_file: true }
              as: PracticeAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /sinuplasty-cases"
              payload: { patient_id: "${pat_id}", laterality: "LEFT", sinuses: ["MAXILLARY"] }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { case_id: $.data.id }
            - call: "POST /sinuplasty-cases/${case_id}/documentation"
              payload: { ct_study_date: "2026-07-15", documented_therapies: [{ therapy_code: "INCS", start_date: "2026-06-01", end_date: "2026-06-28" }], documented_criteria_codes: ["CT_OPACIFICATION", "SNOT22_GE_20", "FAILED_INCS"] }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { cand: $.data.candidacy_status }
            - call: "POST /sinuplasty-cases/${case_id}/authorization-submissions"
              payload: {}
              as: PayerLiaison
              as_user_id: "u_pl_1"
            - call: "POST /sinuplasty-cases/${case_id}/payer-decisions"
              payload: { decision: "INFO_REQUESTED", payer_reference: "PA-2999-0001" }
              as: PayerLiaison
              as_user_id: "u_pl_2"
            - call: "POST /sinuplasty-cases/${case_id}/authorization-submissions"
              payload: {}
              as: PayerLiaison
              as_user_id: "u_pl_1"
              captures: { round_after_1: $.data.revision_round }
            - call: "POST /sinuplasty-cases/${case_id}/payer-decisions"
              payload: { decision: "INFO_REQUESTED", payer_reference: "PA-2999-0002" }
              as: PayerLiaison
              as_user_id: "u_pl_2"
            - call: "POST /sinuplasty-cases/${case_id}/authorization-submissions"
              payload: {}
              as: PayerLiaison
              as_user_id: "u_pl_1"
              captures: { round_after_2: $.data.revision_round }
            - call: "POST /sinuplasty-cases/${case_id}/payer-decisions"
              payload: { decision: "INFO_REQUESTED", payer_reference: "PA-2999-0003" }
              as: PayerLiaison
              as_user_id: "u_pl_2"
          trigger:
            - call: "POST /sinuplasty-cases/${case_id}/authorization-submissions"
              payload: {}
              as: PayerLiaison
              as_user_id: "u_pl_1"
              captures: { err: $.data.error_id }
          assert:
            - "SinuplastyCase.${case_id}.candidacy_status == \"ELIGIBLE\" after documentation (criteria_met_count 3, contiguous_management_days 28)"
            - "revision_round == 0 after the first submission, 1 after the second, 2 after the third"
            - "The case re-enters AUTH_SUBMITTED from INFO_REQUESTED on the second and third submissions — the same state is occupied three times"
            - "The trigger returns ERR_REVISION_LIMIT_REACHED with HTTP 409"
            - "SinuplastyCase.${case_id}.status == \"INFO_REQUESTED\" after the rejected submission (unchanged)"
            - "SinuplastyCase.${case_id}.revision_round == 2 after the rejected submission (not 3)"
            - "SinuplastyCase.${case_id}.submitted_by_user_id == \"u_pl_1\" and no decision was ever recorded by u_pl_1"

      - name: device_dispense_parallel_dimensions
        grounds:
          - state_machines.DeviceDispense.FITTED_to_ADJUSTED
          - state_machines.DeviceDispense.ADJUSTED_to_RETURNED
          - state_machines.DeviceDispense.RETURNED_to_RETURNED
          - entities.DeviceDispense.fields.fit_status
          - entities.DeviceDispense.fields.billing_status
          - entities.DeviceDispense.fields.adjustment_count
          - segregation_of_duties[dispenser_is_not_settler]
        distinguishing_aspect: |
          DeviceDispense carries two independent state dimensions on one row: two adjustments
          move fit_status FITTED -> ADJUSTED (adjustment_count 2) while billing_status stays
          INVOICED, and the refund settlement moves billing_status REFUND_PENDING -> REFUNDED
          while fit_status stays RETURNED — each transition advances exactly one axis, which
          is a different non-linear shape from the sibling instance's cycle and sits on a
          different entity (DeviceDispense, not SinuplastyCase).
        test_recipe:
          setup:
            - "PayerPolicy PAR-2999 with device_trial_days 30, restock_fee_bps 1500, restock_fee_floor_cents 12500."
            - "One adult Patient; a HEARING_AID SupplyLot with quantity_received 5."
            - "One AUDIOMETRY DiagnosticStudy with pta_db_hl 55.0 interpreted to recommendation HEARING_AID (performer u_aud_1, interpreter u_aud_2)."
            - "One DeviceDispense created at clock 2026-08-01T00:00:00Z with price_cents 150000 by u_aud_1, so trial_end_at is 2026-08-31T00:00:00Z."
            - "Two adjustments recorded on 2026-08-02 and 2026-08-03, both strictly before trial_end_at."
            - "Trial return on 2026-08-12T00:00:00Z, days_used 12, still inside the trial window."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Parallel Mutual", plan_code: "PAR-2999", requires_prior_auth: true, device_trial_days: 30, restock_fee_bps: 1500, restock_fee_floor_cents: 12500 }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10061", full_name: "Parallel Patient", date_of_birth: "1988-06-20", epinephrine_on_file: true }
              as: PracticeAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /supply-lots"
              payload: { item_type: "HEARING_AID", lot_number: "LOT-1003", quantity_received: 5, expires_at: "2027-06-30T00:00:00Z" }
              as: PracticeAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /diagnostic-studies"
              payload: { patient_id: "${pat_id}", study_type: "AUDIOMETRY" }
              as: Otolaryngologist
              captures: { study_id: $.data.id }
            - call: "POST /diagnostic-studies/${study_id}/results"
              payload: { pta_db_hl: 55.0, word_recognition_pct: 68.0 }
              as: Audiologist
              as_user_id: "u_aud_1"
            - call: "POST /diagnostic-studies/${study_id}/interpretation"
              payload: {}
              as: Audiologist
              as_user_id: "u_aud_2"
              captures: { study_v: $.data.version }
            - call: "POST /device-dispenses"
              payload: { diagnostic_study_id: "${study_id}", supply_lot_id: "${lot_id}", device_type: "HEARING_AID", device_serial: "HA200001", ear: "BOTH", price_cents: 150000, expected_study_version: "${study_v}" }
              as: Audiologist
              as_user_id: "u_aud_1"
              captures: { disp_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /device-dispenses/${disp_id}/adjustments"
              payload: { adjustment_note: "Vent bore opened" }
              as: Audiologist
              as_user_id: "u_aud_1"
              captures: { fit_after_1: $.data.fit_status, billing_after_1: $.data.billing_status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /device-dispenses/${disp_id}/adjustments"
              payload: { adjustment_note: "Gain trimmed 4 dB" }
              as: Audiologist
              as_user_id: "u_aud_1"
              captures: { adj_count: $.data.adjustment_count }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /device-dispenses/${disp_id}/trial-return"
              payload: { return_reason: "POOR_FIT" }
              as: Audiologist
              as_user_id: "u_aud_1"
              captures: { fit_after_return: $.data.fit_status, billing_after_return: $.data.billing_status }
          trigger:
            - call: "POST /device-dispenses/${disp_id}/refund-settlement"
              payload: {}
              as: PracticeAdmin
              as_user_id: "u_admin_2"
              captures: { fit_final: $.data.fit_status, billing_final: $.data.billing_status }
          assert:
            - "After the first adjustment: fit_status == \"ADJUSTED\" and billing_status == \"INVOICED\" (only the fitting axis moved)"
            - "After the second adjustment: adjustment_count == 2, fit_status still \"ADJUSTED\", billing_status still \"INVOICED\""
            - "After the trial return: fit_status == \"RETURNED\", billing_status == \"REFUND_PENDING\", refund_variant == \"IN_TRIAL\", days_used == 12"
            - "After the trial return: restock_fee_cents == 22500 and refund_cents == 123300"
            - "After the trigger: DeviceDispense.${disp_id}.billing_status == \"REFUNDED\" (only the billing axis moved)"
            - "After the trigger: DeviceDispense.${disp_id}.fit_status == \"RETURNED\" (unchanged by the settlement)"
            - "After the trigger: DeviceDispense.${disp_id}.adjustment_count == 2 (preserved in the refund record)"
            - "After the trigger: DeviceDispense.${disp_id}.settled_by_user_id == \"u_admin_2\" and dispensed_by_user_id == \"u_aud_1\""
            - "SupplyLot.${lot_id}: quantity_received == 5, quantity_on_hand == 4, quantity_consumed == 0, quantity_wasted == 1, available_quantity == 4"

  # ===========================================================================
  # RULE 4 — transitive_cascade
  # Instance 1 has depth 4 and originates from POST /reaction-events (the dose
  # ADMINISTERED -> REACTION_HELD transition). Instance 2 has depth 3 and
  # originates from a WRITE_OFF supply adjustment. Different triggers, and each
  # hop is caused by the previous hop rather than by the original request.
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: reaction_event_four_hop_cascade
        grounds:
          - state_machines.ImmunotherapyDose.ADMINISTERED_to_REACTION_HELD
          - calculations.patient_anaphylaxis_risk_score
          - calculations.observation_minutes_required
          - entities.Patient.fields.immunotherapy_escalation_step
          - entities.Patient.fields.risk_score_variant
          - entities.Patient.fields.supervision_tier
          - entities.AllergyTestOrder.fields.observation_required_minutes
          - entities.ImmunotherapyVial.fields.requires_supervised_administration
          - entities.ProcedureBooking.fields.requires_physician_presence
        distinguishing_aspect: |
          Depth 4 with strict causal chaining: hop 1 flips the dose to REACTION_HELD; hop 2
          fires because the dose row changed (escalation rollback 3 -> 1, status HELD,
          POST_REACTION rescore 20 -> 80); hop 3 fires because the hop-2 risk_score crossed
          SUPERVISION_TIER_THRESHOLD 60 (supervision_tier PHYSICIAN_PRESENT and the ORDERED
          order's observation window resized 40 -> 90); hop 4 fires because the hop-3
          supervision_tier changed (vial requires_supervised_administration and booking
          requires_physician_presence). The trigger is POST /reaction-events, distinct from
          the sibling instance's supply WRITE_OFF adjustment.
        test_recipe:
          setup:
            - "PayerPolicy REACT-2999 with observation_floor_minutes 20."
            - "One adult Patient (dob 1988-06-20) with prior_systemic_reaction_count 1 and epinephrine_on_file true, so the PROVISIONAL base risk_score is 20 and supervision_tier is STANDARD."
            - "An ALLERGEN_CONCENTRATE SupplyLot and a BLUE_1_100 vial with volume_ml_initial 5.00, label-verified by a second nurse."
            - "Two immunotherapy doses administered and cleared 30 minutes apart on 2026-08-01 (steps 1 and 2), leaving Patient.immunotherapy_escalation_step at 3."
            - "A third dose administered at 2026-08-01T10:00:00Z in status ADMINISTERED with escalation_step_at_dose 3."
            - "One AllergyTestOrder INTRADERMAL left in status ORDERED, carrying observation_required_minutes 40 at creation (base 40, risk 20 < 45, STANDARD tier, floor 20)."
            - "One EndoscopeAsset and one SCHEDULED DIAGNOSTIC_ENDOSCOPY ProcedureBooking for the same patient on 2026-08-05, created while supervision_tier is STANDARD so requires_physician_presence is false."
            - "Clock moved to 2026-08-01T10:10:00Z, so the reaction is recorded 0 days ago and DECAY_FACTOR_FRESH 1.00 applies."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Reaction Mutual", plan_code: "REACT-2999", requires_prior_auth: true, observation_floor_minutes: 20 }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10071", full_name: "Cascade Patient", date_of_birth: "1988-06-20", epinephrine_on_file: true, prior_systemic_reaction_count: 1 }
              as: PracticeAdmin
              captures: { pat_id: $.data.id, pat_v1: $.data.version }
            - call: "POST /supply-lots"
              payload: { item_type: "ALLERGEN_CONCENTRATE", lot_number: "LOT-1004", quantity_received: 20, expires_at: "2027-06-30T00:00:00Z" }
              as: PracticeAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /endoscopes"
              payload: { serial_number: "SC-0001", model: "ENF-V4 rhinolaryngoscope" }
              as: PracticeAdmin
              captures: { scope_id: $.data.id }
            - call: "POST /immunotherapy-vials"
              payload: { patient_id: "${pat_id}", supply_lot_id: "${lot_id}", dilution_code: "BLUE_1_100", label_text: "BLUE 1-100 MRN-10071", expires_at: "2027-06-30T00:00:00Z", volume_ml_initial: 5.00, expected_patient_version: "${pat_v1}" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { vial_id: $.data.id }
            - call: "POST /immunotherapy-vials/${vial_id}/label-verification"
              payload: { label_text_confirmation: "BLUE 1-100 MRN-10071" }
              as: AllergyNurse
              as_user_id: "u_nurse_2"
            - call: "POST /allergy-test-orders"
              payload: { patient_id: "${pat_id}", panel_code: "MOLD_12", method: "INTRADERMAL" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { order_id: $.data.id, obs_before: $.data.observation_required_minutes }
            - call: "POST /procedure-bookings"
              payload: { patient_id: "${pat_id}", procedure_type: "DIAGNOSTIC_ENDOSCOPY", venue: "IN_OFFICE_SUITE", start_at: "2026-08-05T09:00:00Z", end_at: "2026-08-05T10:00:00Z", physician_user_id: "u_ent_1", endoscope_asset_id: "${scope_id}" }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { booking_id: $.data.id, presence_before: $.data.requires_physician_presence }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /immunotherapy-doses"
              payload: { immunotherapy_vial_id: "${vial_id}" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { dose1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:30:00Z" }
              as: PracticeAdmin
            - call: "POST /immunotherapy-doses/${dose1_id}/clear-observation"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
            - call: "POST /immunotherapy-doses"
              payload: { immunotherapy_vial_id: "${vial_id}" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { dose2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:00:00Z" }
              as: PracticeAdmin
            - call: "POST /immunotherapy-doses/${dose2_id}/clear-observation"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
            - call: "POST /immunotherapy-doses"
              payload: { immunotherapy_vial_id: "${vial_id}" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { dose3_id: $.data.id, step_at_dose3: $.data.escalation_step_at_dose }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:10:00Z" }
              as: PracticeAdmin
          trigger:
            - call: "POST /reaction-events"
              payload: { immunotherapy_dose_id: "${dose3_id}", systemic_grade: 3, onset_minutes: 10, local_wheal_mm: 22.0, epinephrine_given: true }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { event_id: $.data.id }
          assert:
            - "hop 1 — ImmunotherapyDose.${dose3_id}.status == \"REACTION_HELD\" and reaction_grade == 3"
            - "hop 2 — Patient.${pat_id}.immunotherapy_escalation_step == 1 (max(1, 3 - 2))"
            - "hop 2 — Patient.${pat_id}.immunotherapy_status == \"HELD\""
            - "hop 2 — Patient.${pat_id}.risk_score_variant == \"POST_REACTION\""
            - "hop 2 — Patient.${pat_id}.risk_score == 80 (base 20 + round_half_up(20 * 3 * 1.00) = 20 + 60)"
            - "hop 3 — Patient.${pat_id}.supervision_tier == \"PHYSICIAN_PRESENT\" (80 >= SUPERVISION_TIER_THRESHOLD 60)"
            - "hop 3 — AllergyTestOrder.${order_id}.observation_required_minutes == 90, up from 40 at creation, while status stays \"ORDERED\""
            - "hop 4 — ImmunotherapyVial.${vial_id}.requires_supervised_administration == true"
            - "hop 4 — ProcedureBooking.${booking_id}.requires_physician_presence == true, up from false at creation, while status stays \"SCHEDULED\""
            - "ReactionEvent.${event_id}.occurred_at == \"2026-08-01T10:10:00Z\" and the row is append-only (no version field)"
            - "ImmunotherapyDose.${dose1_id}.status == \"CLEARED\" and ImmunotherapyDose.${dose2_id}.status == \"CLEARED\" — the cascade touches only the reacting dose"

      - name: supply_write_off_shortfall_cascade
        grounds:
          - state_machines.SupplyLot.ACTIVE_to_EXHAUSTED
          - calculations.supply_lot_availability
          - entities.SupplyLot.fields.quantity_wasted
          - entities.SupplyLot.fields.available_quantity
          - entities.ProcedureBooking.fields.supply_shortfall_flag
          - endpoints[POST /supply-lots/{lotId}/adjustments]
        distinguishing_aspect: |
          Depth 3 from a WRITE_OFF adjustment: hop 1 moves 3 units on_hand -> wasted; hop 2
          fires because hop 1 dropped available_quantity to 0 (lot ACTIVE -> EXHAUSTED); hop 3
          fires because of the hop-2 status change (the lot's SCHEDULED booking with
          planned_device_count > 0 gets supply_shortfall_flag := true). The originating
          transition is SupplyLot ACTIVE -> EXHAUSTED, different from the sibling instance's
          ImmunotherapyDose ADMINISTERED -> REACTION_HELD.
        test_recipe:
          setup:
            - "PayerPolicy SUP-2999; one Patient with date_of_birth 2020-01-01, so age_months is 79 at clock 2026-08-01T00:00:00Z and the IN_OFFICE_SUITE venue is allowed for tube surgery."
            - "One TYMPANOSTOMY_TUBE SupplyLot with quantity_received 4, so quantity_on_hand is 4, quantity_reserved 0, available_quantity 4, status ACTIVE."
            - "One SCHEDULED TYMPANOSTOMY_TUBES ProcedureBooking with planned_device_count 1, which reserves 1 unit and leaves available_quantity 3 and supply_shortfall_flag false."
            - "Clock stays at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Supply Mutual", plan_code: "SUP-2999", requires_prior_auth: true }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10081", full_name: "Tube Patient", date_of_birth: "2020-01-01" }
              as: PracticeAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /supply-lots"
              payload: { item_type: "TYMPANOSTOMY_TUBE", lot_number: "LOT-1005", quantity_received: 4, expires_at: "2027-06-30T00:00:00Z" }
              as: PracticeAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /procedure-bookings"
              payload: { patient_id: "${pat_id}", procedure_type: "TYMPANOSTOMY_TUBES", venue: "IN_OFFICE_SUITE", start_at: "2026-08-06T09:00:00Z", end_at: "2026-08-06T09:45:00Z", physician_user_id: "u_ent_1", supply_lot_id: "${lot_id}", planned_device_count: 1 }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { booking_id: $.data.id, flag_before: $.data.supply_shortfall_flag }
            - call: "GET /supply-lots/${lot_id}"
              payload: {}
              as: PracticeAdmin
              captures: { avail_before: $.data.available_quantity }
          trigger:
            - call: "POST /supply-lots/${lot_id}/adjustments"
              payload: { reason: "WRITE_OFF", quantity: 3 }
              as: PracticeAdmin
              captures: { lot_status: $.data.status, avail_after: $.data.available_quantity }
          assert:
            - "Before the trigger: SupplyLot.${lot_id}.available_quantity == 3, status == \"ACTIVE\", and ProcedureBooking.${booking_id}.supply_shortfall_flag == false"
            - "hop 1 — SupplyLot.${lot_id}.quantity_on_hand == 1 and quantity_wasted == 3"
            - "hop 2 — SupplyLot.${lot_id}.available_quantity == 0 (1 on hand minus 1 reserved) and status == \"EXHAUSTED\""
            - "hop 3 — ProcedureBooking.${booking_id}.supply_shortfall_flag == true while status stays \"SCHEDULED\""
            - "SupplyLot.${lot_id}.quantity_reserved == 1 and quantity_consumed == 0 (the write-off moved no reserved or consumed units)"
            - "Conserved identity holds: quantity_received 4 == quantity_on_hand 1 + quantity_consumed 0 + quantity_wasted 3"

  # ===========================================================================
  # RULE 5 — priority_pair_validation_conflict
  # Two conflicts on two different endpoints with two different category pairs:
  # (state, business_fiscal) on POST /procedure-bookings and
  # (business_safety, business_temporal) on the administer endpoint. Each
  # instance proves the losing rule is genuinely armed by curing only the
  # winning condition and re-issuing the identical request.
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: case_state_beats_supply_exhausted_on_booking_create
        grounds:
          - validation_priority_conflicts.state_beats_supply_on_booking_create
          - validations[priority 7].ERR_CASE_STATE_INVALID
          - validations[priority 14].ERR_SUPPLY_EXHAUSTED
          - endpoints[POST /procedure-bookings]
        distinguishing_aspect: |
          Category pair (state, business_fiscal), priorities 7 and 14, on POST
          /procedure-bookings. Both conditions are live in the same request: the referenced
          SinuplastyCase is DENIED and the referenced BALLOON_DEVICE lot has
          available_quantity 0. The lifecycle error must win. The control call proves the
          fiscal rule is armed by pointing an AUTHORIZED case at the very same exhausted lot,
          which then yields ERR_SUPPLY_EXHAUSTED. Distinct from the sibling instance's
          (business_safety, business_temporal) pair on the administer endpoint.
        test_recipe:
          setup:
            - "PayerPolicy CONF-2999 with requires_prior_auth true (POLICY_STRICT), min_medical_management_days 28, requires_ct_within_months 12, min_documented_criteria 3, max_balloon_devices 4, auth_validity_days 90."
            - "Two Patients on that plan; the clock stays at its default 2026-08-01T00:00:00Z."
            - "Case A for patient 1: laterality LEFT, sinuses [MAXILLARY], so planned_device_count 1. Documented with two adjacent INCS courses 2026-06-01..2026-06-14 and 2026-06-15..2026-06-28 (gap 0, so they merge to 28 contiguous days) and criteria [CT_OPACIFICATION, SNOT22_GE_20, FAILED_INCS] with ct_study_date 2026-07-01, giving criteria_met_count 3 and candidacy_status ELIGIBLE."
            - "Case A is then submitted by u_pl_1 and DENIED by u_pl_2, so its status is DENIED and authorized_device_count is 0."
            - "Case B for patient 2 carries identical documentation but is APPROVED, so its status is AUTHORIZED with authorized_device_count 1 and auth_expires_at 2026-10-30T00:00:00Z."
            - "One BALLOON_DEVICE SupplyLot with quantity_received 1, immediately written off in full, so quantity_on_hand 0, quantity_wasted 1, available_quantity 0 and status EXHAUSTED (EXHAUSTED is not QUARANTINED, so ERR_LOT_STATE_INVALID at priority 7 is not in play)."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Conflict Health", plan_code: "CONF-2999", requires_prior_auth: true, min_medical_management_days: 28, requires_ct_within_months: 12, min_documented_criteria: 3, max_balloon_devices: 4, auth_validity_days: 90 }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10091", full_name: "Denied Case Patient", date_of_birth: "1979-03-04" }
              as: PracticeAdmin
              captures: { pat_a: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10092", full_name: "Authorized Case Patient", date_of_birth: "1981-11-19" }
              as: PracticeAdmin
              captures: { pat_b: $.data.id }
            - call: "POST /supply-lots"
              payload: { item_type: "BALLOON_DEVICE", lot_number: "LOT-1006", quantity_received: 1, expires_at: "2027-06-30T00:00:00Z" }
              as: PracticeAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /supply-lots/${lot_id}/adjustments"
              payload: { reason: "WRITE_OFF", quantity: 1 }
              as: PracticeAdmin
              captures: { lot_status: $.data.status, lot_avail: $.data.available_quantity }
            - call: "POST /sinuplasty-cases"
              payload: { patient_id: "${pat_a}", laterality: "LEFT", sinuses: ["MAXILLARY"] }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { case_a: $.data.id }
            - call: "POST /sinuplasty-cases/${case_a}/documentation"
              payload:
                ct_study_date: "2026-07-01"
                documented_therapies:
                  - { therapy_code: "INCS", start_date: "2026-06-01", end_date: "2026-06-14" }
                  - { therapy_code: "INCS", start_date: "2026-06-15", end_date: "2026-06-28" }
                documented_criteria_codes: ["CT_OPACIFICATION", "SNOT22_GE_20", "FAILED_INCS"]
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { cand_a: $.data.candidacy_status, contig_a: $.data.contiguous_management_days }
            - call: "POST /sinuplasty-cases/${case_a}/authorization-submissions"
              payload: {}
              as: PayerLiaison
              as_user_id: "u_pl_1"
            - call: "POST /sinuplasty-cases/${case_a}/payer-decisions"
              payload: { decision: "DENIED", payer_reference: "PA-2999-DENY" }
              as: PayerLiaison
              as_user_id: "u_pl_2"
              captures: { status_a: $.data.status }
            - call: "POST /sinuplasty-cases"
              payload: { patient_id: "${pat_b}", laterality: "LEFT", sinuses: ["MAXILLARY"] }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { case_b: $.data.id }
            - call: "POST /sinuplasty-cases/${case_b}/documentation"
              payload:
                ct_study_date: "2026-07-01"
                documented_therapies:
                  - { therapy_code: "INCS", start_date: "2026-06-01", end_date: "2026-06-14" }
                  - { therapy_code: "INCS", start_date: "2026-06-15", end_date: "2026-06-28" }
                documented_criteria_codes: ["CT_OPACIFICATION", "SNOT22_GE_20", "FAILED_INCS"]
              as: Otolaryngologist
              as_user_id: "u_ent_1"
            - call: "POST /sinuplasty-cases/${case_b}/authorization-submissions"
              payload: {}
              as: PayerLiaison
              as_user_id: "u_pl_1"
            - call: "POST /sinuplasty-cases/${case_b}/payer-decisions"
              payload: { decision: "APPROVED", payer_reference: "PA-2999-APPR" }
              as: PayerLiaison
              as_user_id: "u_pl_2"
              captures: { status_b: $.data.status, auth_count_b: $.data.authorized_device_count }
          trigger:
            - call: "POST /procedure-bookings"
              payload: { patient_id: "${pat_a}", procedure_type: "BALLOON_SINUPLASTY", venue: "IN_OFFICE_SUITE", start_at: "2026-08-20T09:00:00Z", end_at: "2026-08-20T10:00:00Z", physician_user_id: "u_ent_1", sinuplasty_case_id: "${case_a}", supply_lot_id: "${lot_id}", planned_device_count: 1 }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
          assert:
            - "The trigger returns HTTP 409 with error.id == \"ERR_CASE_STATE_INVALID\" — the priority-7 lifecycle rule beats the priority-14 fiscal rule"
            - "error.id != \"ERR_SUPPLY_EXHAUSTED\" even though SupplyLot.${lot_id}.available_quantity == 0 at the moment of the call"
            - "No ProcedureBooking row was created: GET /procedure-bookings?patient_id=${pat_a} returns total_count 0"
            - "SupplyLot.${lot_id}.quantity_reserved == 0 — the rejected request reserved nothing"
            - "Control (losing rule is armed): the same POST /procedure-bookings body with patient_id ${pat_b} and sinuplasty_case_id ${case_b} (status AUTHORIZED, authorized_device_count 1) against the same ${lot_id} returns HTTP 409 with error.id == \"ERR_SUPPLY_EXHAUSTED\""
            - "SinuplastyCase.${case_b}.status is still \"AUTHORIZED\" after the control rejection — a rejected booking does not move the case to SCHEDULED"

      - name: epinephrine_safety_beats_washout_temporal_on_administer
        grounds:
          - validation_priority_conflicts.safety_beats_temporal_on_administer
          - validations[priority 10].ERR_EPINEPHRINE_NOT_ON_FILE
          - validations[priority 11].ERR_WASHOUT_NOT_COMPLETE
          - calculations.patient_anaphylaxis_risk_score
          - endpoints[POST /allergy-test-orders/{orderId}/administer]
        distinguishing_aspect: |
          Category pair (business_safety, business_temporal), priorities 10 and 11, on POST
          /allergy-test-orders/{orderId}/administer — a different pair and a different
          endpoint from the sibling instance. Both conditions hold on the first attempt:
          risk_score is exactly 45 with epinephrine_on_file false, and only 12 of the required
          72 washout hours have elapsed. Curing the safety condition with a PATCH also drops
          risk_score to 35, which proves the two rules are independent and lets the temporal
          rule surface on the identical retry.
        test_recipe:
          setup:
            - "PayerPolicy SAFE-2999 with observation_floor_minutes 20."
            - "One adult Patient with prior_systemic_reaction_count 2, epinephrine_on_file false and antihistamine_last_dose_at 2026-07-31T12:00:00Z, so at the default clock 2026-08-01T00:00:00Z the PROVISIONAL risk_score is 45 (5 + 15*2 + 0 sensitized + 0 pediatric + 10 no-epi) and only 12 washout hours have elapsed."
            - "One AllergyTestOrder MOLD_12 / SKIN_PRICK in status ORDERED, so the skin-method gate and the washout gate both apply."
            - "dermatographism is false at creation, so the priority-10 sibling ERR_DERMATOGRAPHISM_BLOCKS_SKIN_TEST is not in play."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Safety Mutual", plan_code: "SAFE-2999", requires_prior_auth: true, observation_floor_minutes: 20 }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10101", full_name: "Gate Patient", date_of_birth: "1976-02-09", epinephrine_on_file: false, prior_systemic_reaction_count: 2, antihistamine_last_dose_at: "2026-07-31T12:00:00Z" }
              as: PracticeAdmin
              captures: { pat_id: $.data.id, risk_before: $.data.risk_score }
            - call: "POST /allergy-test-orders"
              payload: { patient_id: "${pat_id}", panel_code: "MOLD_12", method: "SKIN_PRICK" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /allergy-test-orders/${order_id}/administer"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
          assert:
            - "Patient.${pat_id}.risk_score == 45 and risk_score_variant == \"PROVISIONAL\" before the trigger"
            - "The trigger returns HTTP 409 with error.id == \"ERR_EPINEPHRINE_NOT_ON_FILE\" — the priority-10 safety rule beats the priority-11 temporal rule"
            - "error.id != \"ERR_WASHOUT_NOT_COMPLETE\" even though only 12 of the required 72 hours have elapsed since 2026-07-31T12:00:00Z"
            - "AllergyTestOrder.${order_id}.status is still \"ORDERED\" and administered_at is still null"
            - "Control (losing rule is armed): PATCH /patients/${pat_id} with { epinephrine_on_file: true } as PracticeAdmin drops risk_score to 35, and the identical POST /allergy-test-orders/${order_id}/administer then returns HTTP 409 with error.id == \"ERR_WASHOUT_NOT_COMPLETE\""
            - "Both rules are curable in isolation: after the PATCH, moving the clock to 2026-08-03T13:00:00Z (73 hours after the antihistamine dose) makes the same administer call succeed with status \"ADMINISTERED\" and observation_required_minutes 30 (base 30, risk 35 < 45, policy floor 20)"

  # ===========================================================================
  # RULE 6 — boundary_precision_check
  # Instance 1 pins an integer-points threshold (risk_score >= 45) on the
  # administer endpoint. Instance 2 pins an instant-versus-instant shelf-life
  # boundary (168 hours, exclusive) on the booking-start endpoint. Different
  # metrics, different endpoints, and each pair of calls differs by exactly one
  # unit of the metric being probed.
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: risk_score_threshold_45_boundary_on_administer
        grounds:
          - calculations.patient_anaphylaxis_risk_score.constants.OBSERVATION_ESCALATION_THRESHOLD
          - calculations.observation_minutes_required
          - calculations.allergy_panel_billing
          - endpoints[POST /allergy-test-orders/{orderId}/administer]
        distinguishing_aspect: |
          Metric: risk_score in integer points, probed at exactly 45 and at 44 — one single
          point apart — where the comparison is >= and not >. The two scores are produced by
          real reading data (10 versus 9 positive antigens on a 12-antigen panel), not by
          direct field assignment, so the boundary is reached through the sensitization term
          of the weighted score. Observed on POST
          /allergy-test-orders/{orderId}/administer via observation_required_minutes 60
          versus 30. The sibling instance probes an instant-valued shelf-life boundary on a
          different endpoint.
        test_recipe:
          setup:
            - "PayerPolicy BND-2999 with observation_floor_minutes 20 and covered_pct_bps 8000, so the plan floor never dominates the 30/60-minute figures."
            - "Two adult Patients on that plan, each with prior_systemic_reaction_count 2 and epinephrine_on_file true and antihistamine_last_dose_at null, so each opens at risk_score 35 (5 + 15*2) with supervision_tier STANDARD and passes the safety and washout gates."
            - "Each patient has a first MOLD_12 / SKIN_PRICK order (antigen_count 12) administered at clock 2026-08-01T00:00:00Z with observation_required_minutes 30."
            - "Clock advanced to 2026-08-01T00:30:00Z so exactly 30 of the required 30 observation minutes have elapsed and readings are admissible."
            - "Readings recorded: 10 of 12 positive for the boundary patient and 9 of 12 for the control patient. Neither equals antigen_count, so no DERMATOGRAPHISM_DETECTED abort fires and both orders reach READ."
            - "Each patient then has a second MOLD_12 / SKIN_PRICK order in status ORDERED, created after the rescore."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Boundary Health", plan_code: "BND-2999", requires_prior_auth: true, observation_floor_minutes: 20, covered_pct_bps: 8000 }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10111", full_name: "Boundary Patient", date_of_birth: "1974-05-02", epinephrine_on_file: true, prior_systemic_reaction_count: 2 }
              as: PracticeAdmin
              captures: { pat_m: $.data.id, risk_m0: $.data.risk_score }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10112", full_name: "Control Patient", date_of_birth: "1975-09-17", epinephrine_on_file: true, prior_systemic_reaction_count: 2 }
              as: PracticeAdmin
              captures: { pat_c: $.data.id }
            - call: "POST /allergy-test-orders"
              payload: { patient_id: "${pat_m}", panel_code: "MOLD_12", method: "SKIN_PRICK" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { order_m1: $.data.id, obs_m1: $.data.observation_required_minutes }
            - call: "POST /allergy-test-orders"
              payload: { patient_id: "${pat_c}", panel_code: "MOLD_12", method: "SKIN_PRICK" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { order_c1: $.data.id }
            - call: "POST /allergy-test-orders/${order_m1}/administer"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
            - call: "POST /allergy-test-orders/${order_c1}/administer"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:30:00Z" }
              as: PracticeAdmin
            - call: "POST /allergy-test-orders/${order_m1}/readings"
              payload: { positive_antigen_count: 10, max_wheal_mm: 7.5 }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { charge_m: $.data.practice_charge_cents, patient_share_m: $.data.patient_responsibility_cents }
            - call: "POST /allergy-test-orders/${order_c1}/readings"
              payload: { positive_antigen_count: 9, max_wheal_mm: 6.5 }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
            - call: "GET /patients/${pat_m}"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { risk_m: $.data.risk_score, sens_m: $.data.sensitized_antigen_count }
            - call: "GET /patients/${pat_c}"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { risk_c: $.data.risk_score, sens_c: $.data.sensitized_antigen_count }
            - call: "POST /allergy-test-orders"
              payload: { patient_id: "${pat_m}", panel_code: "MOLD_12", method: "SKIN_PRICK" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { order_m2: $.data.id }
            - call: "POST /allergy-test-orders"
              payload: { patient_id: "${pat_c}", panel_code: "MOLD_12", method: "SKIN_PRICK" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { order_c2: $.data.id }
          trigger:
            - call: "POST /allergy-test-orders/${order_m2}/administer"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { obs_m2: $.data.observation_required_minutes }
            - call: "POST /allergy-test-orders/${order_c2}/administer"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { obs_c2: $.data.observation_required_minutes }
          assert:
            - "Patient.${pat_m}.sensitized_antigen_count == 10 and risk_score == 45 (5 + 15*2 + 10) — exactly at OBSERVATION_ESCALATION_THRESHOLD"
            - "Patient.${pat_c}.sensitized_antigen_count == 9 and risk_score == 44 — one point below the threshold"
            - "AT the boundary: AllergyTestOrder.${order_m2}.observation_required_minutes == 60 after administer (HIGH_RISK_MINUTES, because 45 >= 45)"
            - "ONE POINT BELOW: AllergyTestOrder.${order_c2}.observation_required_minutes == 30 after administer (the SKIN_PRICK base survives, because 44 < 45)"
            - "Neither patient's supervision_tier changed: both are still \"STANDARD\", because 45 < SUPERVISION_TIER_THRESHOLD 60 — the two thresholds are distinct"
            - "The policy floor never bound either result: max(60, 20) == 60 and max(30, 20) == 30"
            - "Billing precision on the boundary patient's first order: billed_units 12, practice_charge_cents 21300 (round_half_up(1775 * 1.0000) = 1775 per unit, then 1775 * 12) and patient_responsibility_cents 4260 (round_half_up(1775 * 0.2000) = 355 per unit, then 355 * 12)"
            - "Both first orders are in status \"READ\" and neither is \"ABORTED\" — 10 and 9 are both below antigen_count 12"

      - name: hld_shelf_life_boundary_exclusive_at_booking_start
        grounds:
          - calculations.scope_reprocessing_due.constants.HLD_SHELF_LIFE_HOURS
          - entities.EndoscopeAsset.fields.hld_expires_at
          - errors.ERR_HLD_EXPIRED
          - endpoints[POST /procedure-bookings/{bookingId}/start]
        distinguishing_aspect: |
          Metric: the logical clock against hld_expires_at, probed one minute below the
          boundary and at exactly the boundary instant, where the comparison is exclusive
          (clock == hld_expires_at is already expired). Two scopes with byte-identical
          reprocessing histories isolate the two probes, so the accepted start cannot move the
          rejected scope's shelf life. Observed on POST
          /procedure-bookings/{bookingId}/start — a different endpoint and a different metric
          from the sibling instance's integer-points threshold.
        test_recipe:
          setup:
            - "PayerPolicy HLD-2999 and two adult Patients, so no pediatric venue rule and no supervision flag interfere."
            - "Two EndoscopeAssets SC-0002 and SC-0003, each registered READY with last_reprocessed_at null and hld_expires_at null."
            - "At the default clock 2026-08-01T00:00:00Z each scope is run through one full cycle — a DIAGNOSTIC_ENDOSCOPY booking started and completed, then a reprocessing run opened and closed by the same tech with leak_test_passed true — so each ends READY with cycle_count 1, last_reprocessed_at 2026-08-01T00:00:00Z and hld_expires_at 2026-08-08T00:00:00Z (+168 hours). mec_test_due stays false because (1 + 1) mod 10 != 0."
            - "Two further SCHEDULED bookings, one per scope, so neither the inclusive interval rule nor the 45-minute turnaround buffer is engaged across them."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Shelf Life Mutual", plan_code: "HLD-2999", requires_prior_auth: true }
              as: PracticeAdmin
