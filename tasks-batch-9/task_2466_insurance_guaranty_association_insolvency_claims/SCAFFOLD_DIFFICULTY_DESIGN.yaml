            - call: "POST /claims/${clm_id}/vendor-assignments"
              payload: { vendor_type: "ADJUSTER", vendor_name: "Kestrel Claims Services", settlement_authority_cents: 2500000, hourly_rate_cents: 18000, engagement_start: "2026-08-01", engagement_end: "2026-08-31" }
              as: AssociationAdmin
              captures: { asg_1: $.data.id }
          trigger:
            - call: "POST /claims/${clm_id}/vendor-assignments"
              payload: { vendor_type: "DEFENSE_COUNSEL", vendor_name: "Halloran and Pike LLP", settlement_authority_cents: 0, hourly_rate_cents: 42000, engagement_start: "2026-08-01", engagement_end: "2026-08-31" }
              as: AssociationAdmin
              captures: { asg_def: $.data.id }
            - call: "POST /claims/${clm_id}/vendor-assignments"
              payload: { vendor_type: "ADJUSTER", vendor_name: "Bluewater Adjusting", settlement_authority_cents: 1500000, hourly_rate_cents: 16000, engagement_start: "2026-08-31", engagement_end: "2026-09-15" }
              as: AssociationAdmin
              captures: { err: $.data.error_id }
            - call: "POST /claims/${clm_id}/vendor-assignments"
              payload: { vendor_type: "ADJUSTER", vendor_name: "Bluewater Adjusting", settlement_authority_cents: 1500000, hourly_rate_cents: 16000, engagement_start: "2026-09-01", engagement_end: "2026-09-30" }
              as: AssociationAdmin
