          - validations[priority=54]
          - errors[ERR_BATCH_SLOT_CAPACITY_EXCEEDED]
          - entities.OfferWindow.fields.capacity_batch_slots
        distinguishing_aspect: |
          The occupied resource is the OfferWindow batch-slot axis and the interval
          semantics are BLOCK-QUANTISED WITH NO ADJACENCY MERGING: two 25-unit demands
          on different menu items each round up to their own 2 slots for a total of 4,
          whereas merging them as one adjacent 50-unit demand would need only 3. With
          capacity_batch_slots 3 the second 25-unit line is therefore rejected, while
          a 24-unit line on the same item fits exactly.
        test_recipe:
          setup:
            - "An ACTIVE baker with a PUBLISHED recipe and two LISTED STANDARD menu items, a cookie and a scone."
            - "An OPEN window with capacity_units 240, capacity_batch_slots 3, capacity_oven_hours 18.0; clock at 2026-05-04T09:00:00Z."
