# §1.9 Scaffold Corner Design — breadth coverage index for the
# utility-scale-solar-epc scaffold. Walks references/claim-extraction-guide.md
# section by section against SCAFFOLD.yaml §1.1–§1.7. Corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs citing the
# owning §1.8 instance by name.
#
# Clock convention: the logical clock defaults to 2026-08-01T00:00:00Z; any
# instance that depends on "now" sets it explicitly via POST /_clock/set_current_utc.

scaffold_corner_design:
  - section: entities
    instances:
      - name: project_creation_persists_every_declared_field_and_seeds_derived_state
        claim_type: creation
        grounds:
          - entities.Project
          - endpoints[POST /solar/projects]
          - response_envelope.success
        distinguishing_aspect: "A create with all eleven required inputs returns 201, echoes each input unchanged, and seeds every system/computed field at its declared default — milestone_state PRECONSTRUCTION, mc_readiness BLOCKED, tax_credit_status UNDETERMINED, version 1."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls: []
          trigger:
            - call: "POST /solar/projects"
              payload: { name: "Basin Mesa I", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id, ms: $.data.milestone_state, mcr: $.data.mc_readiness, tcs: $.data.tax_credit_status, ver: $.data.version, co: $.data.approved_change_order_cents, bt: $.data.blocks_total }
          assert:
            - "HTTP 201 and the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == \"object\""
            - "data echoes name == \"Basin Mesa I\", contract_value_cents == 10000000, retainage_pct == 0.05, ld_cap_pct == 0.05, guaranteed_capacity_kw_ac == 100 and guaranteed_performance_ratio == 0.69 exactly as submitted"
            - "${ms} == PRECONSTRUCTION, ${mcr} == BLOCKED, ${tcs} == UNDETERMINED"
            - "${co} == 0 and ${bt} == 0"
            - "${ver} == 1 and created_at == updated_at"

      - name: grading_area_retrieval_returns_the_stored_representation
        claim_type: retrieval
        grounds:
          - endpoints[GET /solar/grading-areas/{id}]
          - entities.GradingArea
        distinguishing_aspect: "GET by id returns the same field values the create returned, including the derived disturbed_acreage_current ledger and the permit_status default, so the read path is not a second, divergent projection."
        test_recipe:
          setup:
            - "One project with one grading area that has absorbed a single 10.00-acre CLEARING log"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Basin Mesa II", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/grading-areas"
              payload: { area_code: "A1", permit_number: "CGP-2026-118", disturbed_acreage_limit: 40.00, bmp_inspection_interval_days: 14, access_road_meters: 1200 }
              as: CivilSuperintendent
              captures: { ga: $.data.id }
            - call: "POST /solar/grading-areas/${ga}/earthwork-logs"
              payload: { activity_type: "CLEARING", work_start_at: "2026-08-01T12:00:00Z", work_end_at: "2026-08-01T20:00:00Z", acreage_disturbed_delta: 10.00 }
              as: CivilSuperintendent
          trigger:
            - call: "GET /solar/grading-areas/${ga}"
              payload: {}
              as: OwnerEngineer
              captures: { pid: $.data.project_id, code: $.data.area_code, cur: $.data.disturbed_acreage_current, lim: $.data.disturbed_acreage_limit, ps: $.data.permit_status, st: $.data.status, road: $.data.access_road_meters }
          assert:
            - "HTTP 200 with response_type == \"object\""
            - "${pid} == ${proj}, ${code} == \"A1\", ${lim} == 40.00 and ${road} == 1200"
            - "${cur} == 10.00 — the read reflects the earthwork ledger, not the create-time zero"
            - "${ps} == ACTIVE (declared default) and ${st} == CLEARED"
            - "bmp_last_inspected_at is non-null and rain_blackout_until is null"

      - name: block_listing_paginates_and_filters_by_mechanical_status
        claim_type: listing
        grounds:
          - endpoints[GET /solar/blocks]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "The collection read honors limit/offset with total_count and has_more reflecting the FILTERED population, not the whole table: three blocks exist, two match mechanical_status == PLANNED, and limit 1 over that filter reports total_count 2 with has_more true."
        test_recipe:
          setup:
            - "One project with an ACCEPTED grading area and three blocks; block B1 has its single pile driven and accepted (mechanical_status PILES_COMPLETE), B2 and B3 are untouched (PLANNED)"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Basin Mesa III", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/grading-areas"
              payload: { area_code: "A1", permit_number: "CGP-2026-118", disturbed_acreage_limit: 40.00, bmp_inspection_interval_days: 14 }
              as: CivilSuperintendent
              captures: { ga: $.data.id }
            - call: "POST /solar/grading-areas/${ga}/earthwork-logs"
              payload: { activity_type: "CLEARING", work_start_at: "2026-08-01T12:00:00Z", work_end_at: "2026-08-01T20:00:00Z", acreage_disturbed_delta: 10.00 }
              as: CivilSuperintendent
            - call: "POST /solar/grading-areas/${ga}/earthwork-logs"
              payload: { activity_type: "GRADING", work_start_at: "2026-08-02T12:00:00Z", work_end_at: "2026-08-02T20:00:00Z", acreage_disturbed_delta: 8.00 }
              as: CivilSuperintendent
            - call: "POST /solar/grading-areas/${ga}/acceptance"
              payload: { compaction_test_pct: 96.5, drainage_inspection_passed: true }
              as: OwnerEngineer
            - call: "POST /solar/projects/${proj}/blocks"
              payload: { grading_area_id: "${ga}", block_code: "B1", dc_capacity_kw: 130, planned_pile_count: 1, planned_string_count: 1 }
              as: EpcProjectManager
              captures: { b1: $.data.id }
            - call: "POST /solar/projects/${proj}/blocks"
              payload: { grading_area_id: "${ga}", block_code: "B2", dc_capacity_kw: 130, planned_pile_count: 1, planned_string_count: 1 }
              as: EpcProjectManager
              captures: { b2: $.data.id }
            - call: "POST /solar/projects/${proj}/blocks"
              payload: { grading_area_id: "${ga}", block_code: "B3", dc_capacity_kw: 130, planned_pile_count: 1, planned_string_count: 1 }
              as: EpcProjectManager
              captures: { b3: $.data.id }
            - call: "POST /solar/blocks/${b1}/piles"
              payload: { row_index: 1, position_index: 1, design_embedment_mm: 3000 }
              as: InstallationForeman
              captures: { p1: $.data.id }
            - call: "POST /solar/piles/${p1}/drive-results"
              payload: { actual_embedment_mm: 3000, plumb_deviation_mm: 5.0, blow_count: 42, refusal: false }
              as: InstallationForeman
          trigger:
            - call: "GET /solar/blocks"
              payload: { project_id: "${proj}", mechanical_status: "PLANNED", limit: 1, offset: 0 }
              as: EpcProjectManager
            - call: "GET /solar/blocks"
              payload: { project_id: "${proj}", mechanical_status: "PLANNED", limit: 1, offset: 1 }
              as: EpcProjectManager
            - call: "GET /solar/blocks"
              payload: { project_id: "${proj}" }
              as: EpcProjectManager
          assert:
            - "the first page returns response_type == \"array\" with exactly 1 item, total_count == 2, has_more == true, limit == 1, offset == 0"
            - "the second page returns exactly 1 item, total_count == 2 and has_more == false"
            - "the two filtered items are ${b2} and ${b3}; ${b1} is absent because its mechanical_status is PILES_COMPLETE"
            - "the unfiltered read returns 3 items with total_count == 3 and has_more == false under the default limit of 10"

      - name: commissioning_test_read_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /solar/commissioning-tests/{id}]
          - validations[priority=5]
          - errors[ERR_COMMISSIONING_TEST_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unknown UUID yields 404 ERR_COMMISSIONING_TEST_NOT_FOUND in the error envelope, not 200 with a null body and not 400."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /solar/commissioning-tests/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: CommissioningEngineer
              captures: { eid: $.data.error_id }
          assert:
            - "HTTP 404 with response_type == \"error\""
            - "${eid} == ERR_COMMISSIONING_TEST_NOT_FOUND"
            - "data.message is a non-empty string and data carries no entity fields"

      - name: delivery_create_missing_required_pallets_is_rejected
        claim_type: required_fields
        grounds:
          - endpoints[POST /solar/deliveries]
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "pallets has source input with no default, so omitting it is a 400 ERR_INVALID_REQUEST that fires ahead of the priority-7 OCC check and the priority-18 capacity check — no Delivery row and no YardZone version bump result."
        test_recipe:
          setup:
            - "One project with one yard zone of pallet_capacity 100"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Basin Mesa IV", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/yard-zones"
              payload: { zone_code: "Y1", pallet_capacity: 100 }
              as: ProcurementCoordinator
              captures: { yz: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /solar/deliveries"
              payload: { project_id: "${proj}", yard_zone_id: "${yz}", component_type: "MODULE", unit_qty: 600, planned_arrival_at: "2026-08-03T09:00:00Z", laydown_window_start: "2026-08-03T00:00:00Z", laydown_window_end: "2026-08-07T00:00:00Z", expected_yard_zone_version: "${v0}" }
              as: ProcurementCoordinator
              captures: { eid: $.data.error_id }
          assert:
            - "HTTP 400 and ${eid} == ERR_INVALID_REQUEST"
            - "GET /solar/deliveries with project_id == ${proj} returns total_count == 0"
            - "YardZone.${yz}.version == ${v0}, reserved_pallets == 0 and available_pallets == 100"

      - name: project_optional_labor_flags_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Project.fields.prevailing_wage_election
          - entities.Project.fields.apprenticeship_basis
          - entities.Project.fields.apprenticeship_min_pct
        distinguishing_aspect: "The three optional labor-compliance inputs are absent from the create payload, so the server must apply REMEDIABLE / PROJECT_AGGREGATE / 15.00 — and an explicit create proves the defaults are defaults, not hard-coded values."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /solar/projects"
              payload: { name: "Default Ridge", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { pw: $.data.prevailing_wage_election, ab: $.data.apprenticeship_basis, amp: $.data.apprenticeship_min_pct }
            - call: "POST /solar/projects"
              payload: { name: "Explicit Ridge", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69, prevailing_wage_election: "STRICT", apprenticeship_basis: "WEEKLY_WORST_CASE", apprenticeship_min_pct: 12.50 }
              as: EpcProjectManager
              captures: { pw2: $.data.prevailing_wage_election, ab2: $.data.apprenticeship_basis, amp2: $.data.apprenticeship_min_pct }
          assert:
            - "${pw} == REMEDIABLE, ${ab} == PROJECT_AGGREGATE and ${amp} == 15.00"
            - "${pw2} == STRICT, ${ab2} == WEEKLY_WORST_CASE and ${amp2} == 12.50"
            - "both creates return 201 with version == 1"

      - name: delivery_damage_ratio_is_computed_and_client_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Delivery.fields.damage_ratio
          - entities.Delivery.fields.accepted_unit_qty
          - state_machines.Delivery.RESERVED_to_ARRIVED
        distinguishing_aspect: "damage_ratio and accepted_unit_qty have source computed: submitting contradictory values for them alongside the receipt must not move them — the server recomputes 3/60 = 0.0500 and 60 - 3 = 57 regardless."
        test_recipe:
          setup:
            - "One RESERVED 60-pallet MODULE delivery of 60 units against a yard zone of capacity 100"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Computed Wash", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/yard-zones"
              payload: { zone_code: "Y1", pallet_capacity: 100 }
              as: ProcurementCoordinator
              captures: { yz: $.data.id, v0: $.data.version }
            - call: "POST /solar/deliveries"
              payload: { project_id: "${proj}", yard_zone_id: "${yz}", component_type: "MODULE", unit_qty: 60, pallets: 60, planned_arrival_at: "2026-08-03T09:00:00Z", laydown_window_start: "2026-08-03T00:00:00Z", laydown_window_end: "2026-08-07T00:00:00Z", expected_yard_zone_version: "${v0}" }
              as: ProcurementCoordinator
              captures: { dlv: $.data.id, dr0: $.data.damage_ratio }
          trigger:
            - call: "POST /solar/deliveries/${dlv}/receipt"
              payload: { received_unit_qty: 60, damaged_unit_qty: 3, damage_ratio: 0.9999, accepted_unit_qty: 60, status: "REJECTED" }
              as: ProcurementCoordinator
              captures: { dr: $.data.damage_ratio, acc: $.data.accepted_unit_qty, st: $.data.status }
          assert:
            - "${dr0} is null before the receipt"
            - "${dr} == 0.0500 (round_half_up(3 / 60, 4)), NOT the submitted 0.9999"
            - "${acc} == 57, NOT the submitted 60"
            - "${st} == ACCEPTED because 0.0500 <= MAX_DAMAGE_RATIO, NOT the submitted REJECTED"
            - "YardZone.${yz}.reserved_pallets == 60 — an ACCEPTED delivery keeps its pallets occupied"

      - name: yard_zone_system_fields_are_server_minted_and_client_input_ignored
        claim_type: system_fields
        grounds:
          - entities.YardZone
          - endpoints[POST /solar/projects/{project_id}/yard-zones]
        distinguishing_aspect: "id, created_at, updated_at and version are server-minted: a create that supplies all four plus the computed reserved_pallets/available_pallets must ignore every one of them, minting a prefix-free UUID and version 1."
        test_recipe:
          setup:
            - "One project"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "System Field Flat", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /solar/projects/${proj}/yard-zones"
              payload: { zone_code: "Y1", pallet_capacity: 100, id: "yz_00000000-0000-4000-8000-000000000001", version: 99, created_at: "2000-01-01T00:00:00.000Z", updated_at: "2000-01-01T00:00:00.000Z", reserved_pallets: 55, available_pallets: 45 }
              as: ProcurementCoordinator
              captures: { yz: $.data.id, v: $.data.version, res: $.data.reserved_pallets, avail: $.data.available_pallets }
          assert:
            - "${yz} != \"yz_00000000-0000-4000-8000-000000000001\" and carries no type prefix"
            - "${v} == 1, NOT the submitted 99"
            - "created_at reflects the current logical clock 2026-08-01T00:00:00.000Z, NOT the submitted 2000-01-01"
            - "${res} == 0 and ${avail} == 100 — the ledger is derived from the zone's deliveries, of which there are none"

      - name: punch_list_item_with_invalid_enum_severity_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.PunchListItem.fields.severity
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "severity is closed over CRITICAL | MAJOR | MINOR; a plausible out-of-set value (\"BLOCKER\") is a 400, and the counterpart create with CRITICAL proves the enum is enforced by set membership rather than by rejecting all values."
        test_recipe:
          setup:
            - "One project with no punch list items"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Enum Butte", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /solar/projects/${proj}/punch-list-items"
              payload: { title: "Combiner box label missing", category: "ELECTRICAL", severity: "BLOCKER", estimated_cost_cents: 20000 }
              as: OwnerEngineer
              captures: { eid: $.data.error_id }
            - call: "POST /solar/projects/${proj}/punch-list-items"
              payload: { title: "Combiner box label missing", category: "ELECTRICAL", severity: "CRITICAL", estimated_cost_cents: 20000 }
              as: OwnerEngineer
              captures: { pli: $.data.id, sev: $.data.severity, st: $.data.status }
          assert:
            - "the BLOCKER create returns 400 with ${eid} == ERR_INVALID_REQUEST"
            - "the CRITICAL create returns 201 with ${sev} == CRITICAL and ${st} == OPEN"
            - "Project.${proj}.open_punch_item_count == 1 and open_critical_punch_count == 1 — only the accepted item counts"

      - name: test_interval_is_immutable_and_exposes_no_version_field
        claim_type: immutability
        grounds:
          - entities.TestInterval
          - endpoints[POST /solar/commissioning-tests/{test_id}/intervals]
          - endpoints[GET /solar/commissioning-tests/{id}/intervals]
        distinguishing_aspect: "TestInterval is declared common_fields: false — it carries id and created_at only, has no update endpoint anywhere in §1.5, and re-sampling the same timestamp appends a second immutable row rather than replacing the first."
        test_recipe:
          setup:
            - "One project and one SCHEDULED AS_MEASURED CAPACITY test"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Immutable Draw", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id, pv: $.data.version }
            - call: "POST /solar/commissioning-tests"
              payload: { project_id: "${proj}", test_type: "CAPACITY", correction_variant: "AS_MEASURED", scheduled_at: "2026-08-10T02:30:00Z", expected_project_version: "${pv}" }
              as: CommissioningEngineer
              captures: { test: $.data.id }
          trigger:
            - call: "POST /solar/commissioning-tests/${test}/intervals"
              payload: { sampled_at: "2026-08-10T02:35:00Z", irradiance_w_m2: 800, measured_kw_ac: 76.00, ambient_c: 30, wind_m_s: 3.0 }
              as: CommissioningEngineer
              captures: { iv1: $.data.id }
            - call: "POST /solar/commissioning-tests/${test}/intervals"
              payload: { sampled_at: "2026-08-10T02:35:00Z", irradiance_w_m2: 800, measured_kw_ac: 99.00, ambient_c: 30, wind_m_s: 3.0 }
              as: CommissioningEngineer
              captures: { iv2: $.data.id }
            - call: "GET /solar/commissioning-tests/${test}/intervals"
              payload: {}
              as: CommissioningEngineer
          assert:
            - "each interval response exposes id, created_at, commissioning_test_id, sampled_at, irradiance_w_m2, measured_kw_ac, ambient_c, wind_m_s, is_valid and corrected_kw_ac — and NO version and NO updated_at"
            - "${iv2} != ${iv1}: the duplicate sampled_at appends rather than overwrites"
            - "the list returns 2 items with total_count == 2; the ${iv1} row still reads measured_kw_ac == 76.00"
            - "CommissioningTest.${test}.interval_count == 2 and status == IN_PROGRESS"
            - "§1.5 declares no PATCH, PUT or DELETE on any interval path"

      - name: block_referencing_a_grading_area_of_another_project_is_rejected
        claim_type: parent_relationships
        grounds:
          - validations[priority=6]
          - errors[ERR_CROSS_PROJECT_REFERENCE]
          - entities.Block.fields.grading_area_id
        distinguishing_aspect: "Block.grading_area_id must resolve inside the path project: an existing but foreign grading area is a 422 ERR_CROSS_PROJECT_REFERENCE (priority 6), distinct from the 404 ERR_GRADING_AREA_NOT_FOUND (priority 5) an unknown id would raise."
        test_recipe:
          setup:
            - "Two projects, each with its own grading area"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Host Project", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { p1: $.data.id }
            - call: "POST /solar/projects"
              payload: { name: "Foreign Project", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { p2: $.data.id }
