              payload: {}
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers"
              payload: { legal_name: "Kip Kaput", driver_type: "OWNER_OPERATOR", home_state: "OK", per_diem_elected: false }
              as: PayrollAdmin
              captures: { drv_k: $.data.id }
            - call: "POST /driver-pay/drivers/${drv_k}/assign-pay-package"
              payload: { pay_package_id: "${pkg_k}" }
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers/${drv_k}/status"
              payload: { new_status: "ACTIVE" }
              as: PayrollAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers/${drv_k}/status"
              payload: { new_status: "TERMINATED" }
              as: PayrollAdmin
            - call: "GET /driver-pay/drivers/${drv_k}"
              payload: {}
              as: PayrollAdmin
              captures: { drv_k_v: $.data.version }
          trigger:
            - call: "POST /driver-pay/drivers/${drv_k}/escrow/deductions"
              payload: { amount_cents: 5000, reason_code: "TRACTOR_LEASE", document_ref: "doc://lease-invoice-9", expected_driver_version: "${drv_k_v}" }
              as: PayrollAdmin
              captures: { err_k: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_DRIVER_NOT_ACTIVE"
            - "error_id != ERR_ESCROW_INSUFFICIENT_BALANCE and error_id != ERR_ESCROW_NOT_ACTIVE and error_id != ERR_STALE_DRIVER_VERSION"
            - "Driver.${drv_k}.escrow_balance_cents == 0 and Driver.${drv_k}.escrow_status == NOT_REQUIRED"
            - "no EscrowTransaction row exists with driver_id == ${drv_k}"
            - "Driver.${drv_k}.version is unchanged from ${drv_k_v}"

