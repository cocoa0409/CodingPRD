      - name: a_missing_or_undeclared_role_header_is_unauthenticated_before_the_role_gate
        claim_type: denied_operations
        grounds:
          - validations.priority_1_ERR_UNAUTHENTICATED
          - errors.ERR_UNAUTHENTICATED
          - response_envelope.error
        distinguishing_aspect: "Priority 1 outranks the role gate, so all three header defects collapse to the same ERR_UNAUTHENTICATED at 401: X-User-Role omitted, X-User-ID omitted, and X-User-Role carrying a plausible but undeclared value such as Registrar. In particular the undeclared role must not be reported as ERR_FORBIDDEN_ROLE - the server never gets far enough to compare it against the endpoint's role list - and the shared read surface is no exception."
        test_recipe:
          setup:
            - "Empty database; none of these requests reaches any lookup."
          setup_api_calls: []
          trigger:
            - call: "GET /appointments"
              payload: {}
              as: "(X-User-Role header omitted, X-User-ID present)"
              captures: { ua_norole: "$.data.error_id" }
            - call: "GET /appointments"
              payload: {}
              as: "PostdocAffairsOfficer (X-User-ID header omitted)"
