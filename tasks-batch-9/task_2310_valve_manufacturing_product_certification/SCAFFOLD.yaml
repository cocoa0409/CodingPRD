      - "REVOKE: status QUALIFIED -> REVOKED, Foundry.revoked_qualification_count += 1, Foundry.quality_index and status recomputed"
      - "REQUALIFY: status EXPIRED -> PENDING, requalification_count += 1, window replaced"
      - "version += 1"

  # --- HeatLot ---
  - method: POST
    path: "/valve-mfg/heat-lots"
    description: "Declare a received heat lot with its material test report data"
    roles: [SupplierRep, ProcurementSpecialist]
    code: 201
    input: [foundry_id, heat_number, material_grade, process, qty_received_kg, mtr_document_ref, carbon_equivalent_pct, impact_energy_j]
    output: HeatLot
    side_effects: ["status=RECEIVED, qty_committed_kg=0.000, qty_scrapped_kg=0.000, qty_available_kg=qty_received_kg, Foundry.total_lot_count += 1, Foundry.quality_index recomputed"]

  - method: GET
    path: "/valve-mfg/heat-lots"
    description: "List heat lots; a SupplierRep sees only lots of its own foundry"
    roles: [Any]
    code: 200
    input: ["foundry_id?", "status?", "material_grade?", "limit?", "offset?"]
    output: HeatLot[]
    side_effects: []

  - method: GET
    path: "/valve-mfg/heat-lots/{id}"
    description: "Get one heat lot with its live mass balance"
    roles: [Any]
    code: 200
    input: []
    output: HeatLot
    side_effects: []

  - method: POST
    path: "/valve-mfg/heat-lots/{id}/dispositions"
    description: "Lot disposition: VERIFY | RELEASE | QUARANTINE | REJECT"
    roles: [QualityManager]
    code: 200
    input: [action, "quarantine_reason?"]
    output: HeatLot
    side_effects:
      - "VERIFY: status RECEIVED -> VERIFIED after the MTR chemistry gate, verified_by_user_id=X-User-ID"
      - "RELEASE: status VERIFIED -> RELEASED, or QUARANTINED -> RELEASED restoring HOLD components to pre_hold_status and decrementing Foundry.rejected_lot_count"
      - "QUARANTINE: status -> QUARANTINED, Foundry.rejected_lot_count += 1, components -> HOLD, affected certified units -> DECERTIFIED, their orders -> HELD/reopened and issued doc packages -> VOIDED"
      - "REJECT: status -> REJECTED, HOLD components -> SCRAPPED, mass balance recomputed"
      - "version += 1"

  # --- Component ---
  - method: POST
    path: "/valve-mfg/components"
    description: "Draw a traceable component from a released heat lot"
    roles: [ProcurementSpecialist]
    code: 201
    input: [heat_lot_id, target_model_id, component_type, net_weight_kg]
    output: Component
    side_effects: ["status=CREATED, HeatLot.qty_committed_kg += net_weight_kg, HeatLot.qty_available_kg recomputed"]

  - method: GET
    path: "/valve-mfg/components"
    description: "List components"
    roles: [Any]
    code: 200
    input: ["heat_lot_id?", "target_model_id?", "status?", "component_type?", "limit?", "offset?"]
    output: Component[]
    side_effects: []

  - method: GET
    path: "/valve-mfg/components/{id}"
    description: "Get one component"
    roles: [Any]
    code: 200
    input: []
    output: Component
    side_effects: []

  - method: POST
    path: "/valve-mfg/components/{id}/dispositions"
    description: "Component disposition: ISSUE_TO_MACHINING | SCRAP | VOID"
    roles: [ProcurementSpecialist]
    code: 200
    input: [action]
    output: Component
    side_effects:
      - "ISSUE_TO_MACHINING: status CREATED -> ISSUED_TO_MACHINING"
      - "SCRAP: status -> SCRAPPED, lot mass moves from qty_committed_kg to qty_scrapped_kg (available unchanged)"
      - "VOID: status -> VOIDED, lot mass returns to qty_available_kg (compensating disposition)"
      - "version += 1"

  # --- ValveUnit ---
  - method: POST
    path: "/valve-mfg/valve-units"
    description: "Open a serialised valve unit against a model, a body component and a monogram license"
    roles: [ProductEngineer, TestTechnician]
    code: 201
    input: [model_id, body_component_id, monogram_license_id, serial_number, "special_services?", "engineered_order_id?"]
    output: ValveUnit
    side_effects: ["build_status=BLANK, cert_status=UNCERTIFIED, service_status=NONE, reserved_kit_qty=0, Component -> CONSUMED"]

  - method: GET
    path: "/valve-mfg/valve-units"
    description: "List valve units"
    roles: [Any]
    code: 200
    input: ["model_id?", "body_component_id?", "monogram_license_id?", "engineered_order_id?", "build_status?", "cert_status?", "service_status?", "limit?", "offset?"]
    output: ValveUnit[]
    side_effects: []

  - method: GET
    path: "/valve-mfg/valve-units/{id}"
    description: "Get one valve unit with all three state dimensions and both emission classes"
    roles: [Any]
    code: 200
    input: []
    output: ValveUnit
    side_effects: []

  - method: POST
    path: "/valve-mfg/valve-units/{id}/build-actions"
    description: "Build dimension action: ADVANCE (with to_build_status) | REWORK_COMPLETE"
    roles: [TestTechnician]
    code: 200
    input: [action, "to_build_status?"]
    output: ValveUnit
    side_effects: ["build_status advances one adjacent step, or REWORK -> ASSEMBLED", "version += 1"]

  - method: POST
    path: "/valve-mfg/valve-units/{id}/test-records"
    description: "Record a shell, seat, functional or special-service test on a bench"
    roles: [TestTechnician]
    code: 201
    input: [test_type, test_bench_code, started_at, ended_at, test_pressure_bar, hold_seconds, result, "leak_rate_ppm?", "leak_drops?", "standard_ref?"]
    output: TestRecord
    side_effects:
      - "performed_by_user_id=X-User-ID; required_pressure_bar and required_hold_seconds computed and stored"
      - "unit cert_status -> TESTS_IN_PROGRESS, then TESTS_PASSED or TESTS_FAILED per the deciding-record rule"
      - "on a FUGITIVE_EMISSION record: unit provisional_emission_leak_class recomputed from the PEAK_READING variant"
      - "unit version += 1"

  - method: GET
    path: "/valve-mfg/valve-units/{id}/test-records"
    description: "List the immutable test records of one unit"
    roles: [Any]
    code: 200
    input: ["test_type?", "result?", "limit?", "offset?"]
    output: TestRecord[]
    side_effects: []

  - method: POST
    path: "/valve-mfg/valve-units/{id}/cert-actions"
    description: "Certification dimension action: CERTIFY | DECERTIFY"
    roles: [QualityManager]
    code: 200
    input: [action, "decertification_reason?"]
    output: ValveUnit
    side_effects:
      - "CERTIFY: cert_status TESTS_PASSED -> CERTIFIED, certified_by_user_id and certified_at set, final_emission_leak_class frozen from the TIME_WEIGHTED variant, order certified_unit_count and documentation_completeness_pct recomputed"
      - "DECERTIFY: cert_status CERTIFIED -> DECERTIFIED, build PACKAGED -> REWORK, issued doc package -> VOIDED, order IN_PRODUCTION -> HELD or CLOSED -> IN_PRODUCTION"
      - "version += 1"

  - method: POST
    path: "/valve-mfg/valve-units/{id}/service-actions"
    description: "Field-service dimension action: OPEN | RESERVE_KIT | START | COMPLETE | ABORT"
    roles: [FieldServiceCoordinator]
    code: 200
    input: [action, "engineer_user_id?", "kit_qty?"]
    output: ValveUnit
    side_effects:
      - "OPEN: service_status -> OPEN, service_engineer_user_id set"
      - "RESERVE_KIT: service_status -> PARTS_RESERVED, ValveModel.repair_kit_stock_qty -= kit_qty, reserved_kit_qty = kit_qty"
      - "START: service_status -> IN_SERVICE, build -> REWORK, a CERTIFIED unit is DECERTIFIED with the full tail"
      - "COMPLETE: service_status -> SERVICED, reserved kit consumed (stock not returned)"
      - "ABORT: service_status -> NONE, ValveModel.repair_kit_stock_qty += reserved_kit_qty (stock restored)"
      - "version += 1"

  # --- ActuatorPackage ---
  - method: POST
    path: "/valve-mfg/actuator-packages"
    description: "Propose an actuator package for a unit; supersedes any earlier package for that unit"
    roles: [ProductEngineer]
    code: 201
    input: [valve_unit_id, actuator_type, output_torque_nm, sizing_basis, expected_valve_unit_version, "supply_pressure_bar?"]
    output: ActuatorPackage
    side_effects:
      - "required_torque_nm, safety_margin_pct and sized_torque_nm computed by the variant selected from sizing_basis"
      - "sizing_status=PROPOSED; any earlier package of the same unit -> SUPERSEDED"
      - "increments ValveUnit.version by 1"
      - "the unit's required_test_set may widen once a package is APPROVED"

  - method: GET
    path: "/valve-mfg/actuator-packages"
    description: "List actuator packages"
    roles: [Any]
    code: 200
    input: ["valve_unit_id?", "sizing_status?", "actuator_type?", "limit?", "offset?"]
    output: ActuatorPackage[]
    side_effects: []

  - method: GET
    path: "/valve-mfg/actuator-packages/{id}"
    description: "Get one actuator package with its computed torque envelope"
    roles: [Any]
    code: 200
    input: []
    output: ActuatorPackage
    side_effects: []

  - method: POST
    path: "/valve-mfg/actuator-packages/{id}/decision"
    description: "Sizing decision: APPROVE | REJECT"
    roles: [QualityManager]
    code: 200
    input: [decision]
    output: ActuatorPackage
    side_effects:
      - "APPROVE: sizing_status PROPOSED -> APPROVED, approved_by_user_id=X-User-ID, the unit's required_test_set gains FUNCTIONAL"
      - "REJECT: sizing_status PROPOSED -> REJECTED"
      - "version += 1"

  # --- MonogramLicense ---
  - method: POST
    path: "/valve-mfg/monogram-licenses"
    description: "Apply for a monogram program license and schedule its first quality-system audit"
    roles: [QualityManager]
    code: 201
    input: [license_code, facility_code, scope_valve_types, lead_auditor_user_id, audit_window_start, audit_window_end]
    output: MonogramLicense
    side_effects: ["license_status=APPLIED, audit_state=SCHEDULED, compliance_posture=COMPLIANT, all finding counters 0"]

  - method: GET
    path: "/valve-mfg/monogram-licenses"
    description: "List monogram licenses"
    roles: [Any]
    code: 200
    input: ["license_status?", "audit_state?", "compliance_posture?", "limit?", "offset?"]
    output: MonogramLicense[]
    side_effects: []

  - method: GET
    path: "/valve-mfg/monogram-licenses/{id}"
    description: "Get one license with recomputed open finding counts and compliance_posture"
    roles: [Any]
    code: 200
    input: []
    output: MonogramLicense
    side_effects: []

  - method: POST
    path: "/valve-mfg/monogram-licenses/{id}/actions"
    description: "License/audit action: SCHEDULE_AUDIT | START_AUDIT | CLOSE_AUDIT | GRANT | GRANT_CONDITIONAL | DENY | SUSPEND | REINSTATE"
    roles: [MonogramAuditor]
    code: 200
    input: [action, "audit_window_start?", "audit_window_end?"]
    output: MonogramLicense
    side_effects:
      - "SCHEDULE_AUDIT: audit_state CLOSED -> SCHEDULED after the cooling-off gate, window replaced"
      - "START_AUDIT / CLOSE_AUDIT: audit_state SCHEDULED -> IN_PROGRESS -> CLOSED, last_audit_closed_at set"
      - "GRANT: license_status -> GRANTED, granted_at set, posture COMPLIANT"
      - "GRANT_CONDITIONAL: license_status -> CONDITIONAL, conditional_expires_at = granted_at + 180 days, posture CONDITIONAL"
      - "DENY: license_status -> DENIED, posture FROZEN, every CERTIFIED unit of the license -> DECERTIFIED with the full tail"
      - "SUSPEND: license_status -> SUSPENDED, posture FROZEN, certified units -> DECERTIFIED, their orders -> HELD, issued doc packages -> VOIDED"
      - "REINSTATE: license_status SUSPENDED -> GRANTED, posture recomputed, orders held only for this cause resume"
      - "version += 1"

  - method: POST
    path: "/valve-mfg/monogram-licenses/{id}/finding-entries"
    description: "Quality-system audit finding entry: RAISE | CLOSE | WAIVE (with severity MAJOR | MINOR)"
    roles: [MonogramAuditor]
    code: 200
    input: [entry_action, severity]
    output: MonogramLicense
    side_effects:
      - "RAISE: total_major_raised or total_minor_raised += 1, open counts and compliance_posture recomputed; reaching 2 open majors freezes the posture, suspends the license and decertifies its certified units"
      - "CLOSE: closed_major_finding_count or the minor closed count += 1, posture recomputed"
      - "WAIVE: waived_major_finding_count += 1 (refused for the lead auditor), posture recomputed"
      - "version += 1"

  # --- EngineeredOrder ---
  - method: POST
    path: "/valve-mfg/engineered-orders"
    description: "Open an engineered-to-order enquiry with its customer datasheet"
    roles: [ProductEngineer]
    code: 201
    input: [order_code, model_id, ordered_qty, unit_price_cents, customer_credit_limit_cents, datasheet_break_torque_nm, datasheet_torque_source, "requested_special_services?", "expedite_requested?"]
    output: EngineeredOrder
    side_effects: ["status=DRAFT, doc_package_status=ASSEMBLING, datasheet_revision_no=1, clarification_round_count=0, documents=[], documentation_completeness_pct computed, all money fields 0"]

  - method: GET
    path: "/valve-mfg/engineered-orders"
    description: "List engineered orders"
    roles: [Any]
    code: 200
    input: ["status?", "model_id?", "pinned_model_id?", "doc_package_status?", "limit?", "offset?"]
    output: EngineeredOrder[]
    side_effects: []

  - method: GET
    path: "/valve-mfg/engineered-orders/{id}"
    description: "Get one order with recomputed spec_stale, documentation_completeness_pct and certified_unit_count"
    roles: [Any]
    code: 200
    input: []
    output: EngineeredOrder
    side_effects: []

  - method: POST
    path: "/valve-mfg/engineered-orders/{id}/datasheet-revisions"
    description: "Append a datasheet revision, answering a clarification request"
    roles: [ProductEngineer]
    code: 200
    input: [datasheet_break_torque_nm, datasheet_torque_source, expected_engineered_order_version]
    output: EngineeredOrder
    side_effects: ["datasheet_revision_no += 1", "status CLARIFICATION_REQUESTED -> UNDER_REVIEW", "increments EngineeredOrder.version by 1"]

  - method: POST
    path: "/valve-mfg/engineered-orders/{id}/review-actions"
    description: "Datasheet review action: SUBMIT_REVIEW | REQUEST_CLARIFICATION | APPROVE | REJECT"
    roles: [ProductEngineer, QualityManager]
    code: 200
    input: [action]
    output: EngineeredOrder
    side_effects:
      - "SUBMIT_REVIEW: status DRAFT -> UNDER_REVIEW"
      - "REQUEST_CLARIFICATION: status -> CLARIFICATION_REQUESTED, clarification_round_count += 1 (max 3)"
      - "APPROVE: status -> APPROVED, pinned_model_id and pinned_model_spec_revision written, gross_quoted_cents / net_billable_cents computed"
      - "REJECT: status -> REJECTED"
      - "version += 1"

  - method: POST
    path: "/valve-mfg/engineered-orders/{id}/lifecycle-actions"
    description: "Order lifecycle action: RELEASE_TO_PRODUCTION | RESUME | CLOSE | CANCEL | ISSUE_DOC_PACKAGE | VOID_DOC_PACKAGE"
    roles: [ProductEngineer, QualityManager]
    code: 200
    input: [action]
    output: EngineeredOrder
    side_effects:
      - "RELEASE_TO_PRODUCTION: status APPROVED -> IN_PRODUCTION after the stale-spec and credit-limit gates"
      - "RESUME: status HELD -> IN_PRODUCTION, held_reason cleared"
      - "CLOSE: status IN_PRODUCTION -> CLOSED"
      - "CANCEL: status -> CANCELLED, net_billable_cents = retention share of gross_quoted_cents, credit_issued_cents = the remainder, issued doc package -> VOIDED"
      - "ISSUE_DOC_PACKAGE: doc_package_status COMPLETE -> ISSUED"
      - "VOID_DOC_PACKAGE: doc_package_status ISSUED -> VOIDED"
      - "version += 1"

  - method: POST
    path: "/valve-mfg/engineered-orders/{id}/documents"
    description: "Append a document entry to the order's documentation package"
    roles: [QualityManager]
    code: 200
    input: [doc_type, doc_ref]
    output: EngineeredOrder
    side_effects:
      - "documents gains the entry; documentation_completeness_pct recomputed by the pinned two-stage rounding"
      - "doc_package_status ASSEMBLING -> COMPLETE at 100.00, or VOIDED -> ASSEMBLING when appended after a void"
      - "version += 1"

  # --- Logical clock ---
  - method: POST
    path: "/valve-mfg/_clock/set_current_utc"
    description: "Set the logical clock used by every date-dependent rule (qualification validity, type-test validity, conditional license expiry, audit cooling-off). The clock starts at 2026-08-01T00:00:00Z on a fresh system and only moves when this endpoint is called."
    roles: [Any]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["all date comparisons use the new value; no stored row is rewritten at call time (expiry is evaluated lazily on read or use)"]

# =============================================================================
# §1.6 Error Catalog — 50 codes, each triggerable by at least one §1.8/§1.9 instance
# =============================================================================
errors:
  - { error_id: ERR_UNAUTHENTICATED, http_status: 401, category: auth, when: "X-User-ID or X-User-Role header missing or empty" }
  - { error_id: ERR_ROLE_NOT_PERMITTED, http_status: 403, category: auth, when: "the caller's role is not permitted on the endpoint, or not permitted for the specific action value in the body" }
  - { error_id: ERR_FOUNDRY_SCOPE_VIOLATION, http_status: 403, category: auth, when: "a SupplierRep touches a HeatLot whose foundry_id is not its own X-User-ID" }
  - { error_id: ERR_INVALID_REQUEST, http_status: 400, category: request_shape, when: "missing required field, wrong type, unknown enum member, out-of-domain number, or an inverted interval" }
  - { error_id: ERR_INVALID_PAGINATION, http_status: 400, category: request_shape, when: "limit outside [1,100] or offset negative or non-integer" }
  - { error_id: ERR_MODEL_NOT_FOUND, http_status: 404, category: existence, when: "the ValveModel id in the path or body does not exist" }
  - { error_id: ERR_FOUNDRY_NOT_FOUND, http_status: 404, category: existence, when: "the Foundry id in the path or body does not exist" }
  - { error_id: ERR_QUALIFICATION_NOT_FOUND, http_status: 404, category: existence, when: "the FoundryQualification id in the path does not exist" }
  - { error_id: ERR_HEAT_LOT_NOT_FOUND, http_status: 404, category: existence, when: "the HeatLot id in the path or body does not exist" }
  - { error_id: ERR_COMPONENT_NOT_FOUND, http_status: 404, category: existence, when: "the Component id in the path or body does not exist" }
  - { error_id: ERR_UNIT_NOT_FOUND, http_status: 404, category: existence, when: "the ValveUnit id in the path or body does not exist" }
  - { error_id: ERR_ACTUATOR_NOT_FOUND, http_status: 404, category: existence, when: "the ActuatorPackage id in the path does not exist" }
  - { error_id: ERR_LICENSE_NOT_FOUND, http_status: 404, category: existence, when: "the MonogramLicense id in the path or body does not exist" }
  - { error_id: ERR_ORDER_NOT_FOUND, http_status: 404, category: existence, when: "the EngineeredOrder id in the path or body does not exist" }
  - { error_id: ERR_STATE_INVALID, http_status: 409, category: state, when: "the action is not a declared transition out of the current state, including terminal-state lockdown and dependent-state preconditions without a more specific code" }
  - { error_id: ERR_UNIT_ALREADY_CERTIFIED, http_status: 409, category: state, when: "CERTIFY on a unit whose cert_status is already CERTIFIED" }
  - { error_id: ERR_UNIT_NOT_TEST_PASSED, http_status: 409, category: state, when: "CERTIFY on a unit whose cert_status is not TESTS_PASSED" }
  - { error_id: ERR_UNIT_NOT_CERTIFIED, http_status: 409, category: state, when: "build_status advance to PACKAGED or SHIPPED while cert_status is not CERTIFIED" }
  - { error_id: ERR_STALE_VALVE_UNIT_VERSION, http_status: 412, category: concurrency, when: "expected_valve_unit_version does not match the unit's current version" }
  - { error_id: ERR_STALE_ORDER_VERSION, http_status: 412, category: concurrency, when: "expected_engineered_order_version does not match the order's current version" }
  - { error_id: ERR_HEAT_LOT_NOT_RELEASED, http_status: 409, category: business_referential, when: "a Component is drawn from a lot that is not RELEASED" }
  - { error_id: ERR_FOUNDRY_NOT_QUALIFIED, http_status: 409, category: business_referential, when: "no QUALIFIED, in-window FoundryQualification covers the lot's process, grade and the target model's pressure class" }
  - { error_id: ERR_COMPONENT_NOT_AVAILABLE, http_status: 409, category: business_referential, when: "the body component is consumed by another unit, on HOLD, of the wrong component_type, targeted at a different model, or still referenced when VOID is attempted" }
  - { error_id: ERR_MODEL_NOT_RELEASED, http_status: 409, category: business_referential, when: "a unit is opened against a model that is not IN_REVIEW or RELEASED, or CERTIFY / order APPROVE runs against a model that is not RELEASED" }
  - { error_id: ERR_LICENSE_POSTURE_BLOCKED, http_status: 409, category: business_referential, when: "the governing license posture is FROZEN, or it is CONDITIONAL and the unit carries a special service" }
  - { error_id: ERR_LICENSE_SCOPE_MISMATCH, http_status: 422, category: business_referential, when: "the model's valve_type is outside the license's scope_valve_types" }
  - { error_id: ERR_SPECIAL_SERVICE_NOT_QUALIFIED, http_status: 422, category: business_safety, when: "a claimed special service has no valid PASS type test on the model" }
  - { error_id: ERR_REQUIRED_TESTS_INCOMPLETE, http_status: 409, category: business_safety, when: "the unit's required test set is not fully covered by deciding PASS records" }
  - { error_id: ERR_SOD_TEST_WITNESS_CONFLICT, http_status: 403, category: business_safety, when: "the certifying user also performed one of the unit's tests" }
  - { error_id: ERR_SOD_AUDIT_WAIVER_CONFLICT, http_status: 403, category: business_safety, when: "the license's lead auditor attempts to WAIVE a finding" }
  - { error_id: ERR_MTR_CHEMISTRY_OUT_OF_SPEC, http_status: 422, category: business_safety, when: "carbon equivalent above, or impact energy below, the material grade limit at VERIFY" }
  - { error_id: ERR_TEST_PRESSURE_BELOW_STANDARD, http_status: 422, category: business_safety, when: "test_pressure_bar below the computed required_pressure_bar" }
  - { error_id: ERR_TEST_HOLD_TIME_SHORT, http_status: 422, category: business_safety, when: "hold_seconds below the bore-banded required_hold_seconds" }
  - { error_id: ERR_EMISSION_CLASS_FAIL, http_status: 422, category: business_safety, when: "the time-weighted fugitive emission class is C or FAIL at CERTIFY" }
  - { error_id: ERR_ACTUATOR_NOT_APPROVED, http_status: 409, category: business_safety, when: "PACKAGED is requested while the unit's actuator package is not APPROVED" }
  - { error_id: ERR_ACTUATOR_TORQUE_INSUFFICIENT, http_status: 422, category: business_safety, when: "output_torque_nm below sized_torque_nm at APPROVE" }
  - { error_id: ERR_TEST_BENCH_OCCUPIED, http_status: 409, category: business_temporal, when: "the bench's half-open [started_at, ended_at) interval overlaps an existing record on the same bench" }
  - { error_id: ERR_QUALIFICATION_WINDOW_OVERLAP, http_status: 409, category: business_temporal, when: "two qualifications for the same foundry, process and grade have intersecting closed [valid_from, valid_until] intervals" }
  - { error_id: ERR_AUDIT_COOLING_OFF_ACTIVE, http_status: 409, category: business_temporal, when: "the next audit window starts inside the 30-day cooling-off buffer after the previous closeout" }
  - { error_id: ERR_DUPLICATE_CODE, http_status: 409, category: business_constraint, when: "model_code, foundry_code, heat_number (per foundry), serial_number, order_code or license_code collides in its scope" }
  - { error_id: ERR_BUILD_SEQUENCE_INVALID, http_status: 422, category: business_constraint, when: "ADVANCE targets a non-adjacent or backward build state" }
  - { error_id: ERR_CLARIFICATION_ROUNDS_EXHAUSTED, http_status: 409, category: business_constraint, when: "a fourth clarification is requested on one order" }
  - { error_id: ERR_OPEN_MAJOR_FINDINGS, http_status: 409, category: business_constraint, when: "GRANT / GRANT_CONDITIONAL / REINSTATE with open majors, or DENY with none" }
  - { error_id: ERR_MINOR_FINDING_THRESHOLD, http_status: 409, category: business_constraint, when: "GRANT with 5 or more open minors, or GRANT_CONDITIONAL with 4 or fewer" }
  - { error_id: ERR_PINNED_SPEC_STALE, http_status: 409, category: business_constraint, when: "RELEASE_TO_PRODUCTION while the pinned model revision has moved on or the model is no longer RELEASED" }
  - { error_id: ERR_DOC_PACKAGE_INCOMPLETE, http_status: 409, category: business_constraint, when: "ISSUE_DOC_PACKAGE below 100.00 completeness, or CLOSE without an ISSUED package" }
  - { error_id: ERR_ORDER_UNITS_INCOMPLETE, http_status: 409, category: business_constraint, when: "certified_unit_count below ordered_qty at ISSUE_DOC_PACKAGE or CLOSE" }
  - { error_id: ERR_LOT_INSUFFICIENT_MASS, http_status: 422, category: business_fiscal, when: "net_weight_kg exceeds the lot's qty_available_kg" }
  - { error_id: ERR_REPAIR_KIT_OUT_OF_STOCK, http_status: 409, category: business_fiscal, when: "kit_qty exceeds the model's repair_kit_stock_qty" }
  - { error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 402, category: business_fiscal, when: "gross_quoted_cents exceeds customer_credit_limit_cents at RELEASE_TO_PRODUCTION" }

# =============================================================================
# §1.7 RBAC Matrix — 7 roles, segregation of duties
# =============================================================================
roles:
  - role: ProductEngineer
    identity: opaque
    description: "Owns product-line design, actuator sizing proposals and engineered-order authoring"
    exclusive_operations:
      - "POST /valve-mfg/valve-models"
      - "POST /valve-mfg/valve-models/{id}/actions with action = SUBMIT_REVIEW or WITHDRAW"
      - "POST /valve-mfg/actuator-packages"
      - "POST /valve-mfg/engineered-orders"
      - "POST /valve-mfg/engineered-orders/{id}/datasheet-revisions"
      - "POST /valve-mfg/engineered-orders/{id}/review-actions with action = SUBMIT_REVIEW"
      - "POST /valve-mfg/engineered-orders/{id}/lifecycle-actions with action = RELEASE_TO_PRODUCTION, RESUME or CANCEL"
    shared_operations: ["POST /valve-mfg/valve-units", "all GET endpoints", "POST /valve-mfg/_clock/set_current_utc"]
    forbidden: ["RELEASE or REJECT a model", "certify or decertify a unit", "approve an actuator package", "approve or reject an order", "any monogram license or finding action", "any heat lot or component disposition"]

  - role: ProcurementSpecialist
    identity: opaque
    description: "Runs foundry qualification, component draw-down and machining issue"
    exclusive_operations:
      - "POST /valve-mfg/foundries"
      - "POST /valve-mfg/foundry-qualifications"
      - "POST /valve-mfg/foundry-qualifications/{id}/actions with action = REQUALIFY"
      - "POST /valve-mfg/components"
      - "POST /valve-mfg/components/{id}/dispositions"
    shared_operations: ["POST /valve-mfg/heat-lots", "all GET endpoints", "POST /valve-mfg/_clock/set_current_utc"]
    forbidden: ["QUALIFY or REVOKE a qualification", "any heat lot disposition", "certify a unit", "any license action"]

  - role: SupplierRep
    identity: "entity_backed: Foundry — the caller's X-User-ID is the id of the Foundry it speaks for"
    description: "External foundry representative; declares its own heat lots and reads only its own"
    exclusive_operations: []
    shared_operations:
      - "POST /valve-mfg/heat-lots (only with foundry_id == X-User-ID)"
      - "GET /valve-mfg/heat-lots and GET /valve-mfg/heat-lots/{id} (only rows whose foundry_id == X-User-ID)"
      - "GET /valve-mfg/foundries/{id} (only its own row)"
    forbidden: ["reading or writing another foundry's heat lots (ERR_FOUNDRY_SCOPE_VIOLATION)", "every disposition, qualification, unit, test, license and order endpoint"]

  - role: TestTechnician
    identity: opaque
    description: "Machines, assembles and tests units; records shell, seat, functional and special-service tests"
    exclusive_operations:
      - "POST /valve-mfg/valve-units/{id}/build-actions"
      - "POST /valve-mfg/valve-units/{id}/test-records"
    shared_operations: ["POST /valve-mfg/valve-units", "all GET endpoints", "POST /valve-mfg/_clock/set_current_utc"]
    forbidden: ["certify or decertify a unit (segregation of duties)", "approve an actuator package", "any license, order or lot action"]

  - role: QualityManager
    identity: opaque
    description: "Owns release, lot dispositions, actuator approval, unit certification, order review and documentation packages"
    exclusive_operations:
      - "POST /valve-mfg/valve-models/{id}/actions with action = RELEASE or REJECT"
      - "POST /valve-mfg/foundry-qualifications/{id}/actions with action = QUALIFY or REVOKE"
      - "POST /valve-mfg/heat-lots/{id}/dispositions"
      - "POST /valve-mfg/valve-units/{id}/cert-actions"
      - "POST /valve-mfg/actuator-packages/{id}/decision"
      - "POST /valve-mfg/monogram-licenses"
      - "POST /valve-mfg/engineered-orders/{id}/review-actions with action = REQUEST_CLARIFICATION, APPROVE or REJECT"
      - "POST /valve-mfg/engineered-orders/{id}/lifecycle-actions with action = CLOSE, ISSUE_DOC_PACKAGE or VOID_DOC_PACKAGE"
      - "POST /valve-mfg/engineered-orders/{id}/documents"
    shared_operations: ["all GET endpoints", "POST /valve-mfg/_clock/set_current_utc"]
    forbidden: ["recording a test record (segregation of duties: a QualityManager who recorded a test cannot certify that unit)", "license audit and finding actions", "field service actions"]

  - role: MonogramAuditor
    identity: opaque
    description: "Conducts monogram program quality-system audits and decides the license"
    exclusive_operations:
      - "POST /valve-mfg/monogram-licenses/{id}/actions"
      - "POST /valve-mfg/monogram-licenses/{id}/finding-entries"
    shared_operations: ["all GET endpoints", "POST /valve-mfg/_clock/set_current_utc"]
    forbidden: ["creating a license application", "WAIVE a finding on a license whose lead_auditor_user_id is the caller (ERR_SOD_AUDIT_WAIVER_CONFLICT)", "certifying units", "any manufacturing endpoint"]

  - role: FieldServiceCoordinator
    identity: opaque
    description: "Runs aftermarket repair-kit reservation and field service jobs"
    exclusive_operations: ["POST /valve-mfg/valve-units/{id}/service-actions"]
    shared_operations: ["all GET endpoints", "POST /valve-mfg/_clock/set_current_utc"]
    forbidden: ["build actions", "test records", "certification actions", "any order, license, lot or component write"]

rbac_notes: |
  Two segregation-of-duties constraints are enforced on X-User-ID, not on the role alone:
    * the QualityManager calling CERTIFY must not appear as performed_by_user_id on any TestRecord of that unit
      (ERR_SOD_TEST_WITNESS_CONFLICT, 403) — the role check passes and the identity check still fails;
    * the MonogramAuditor calling WAIVE must not be the license's lead_auditor_user_id
      (ERR_SOD_AUDIT_WAIVER_CONFLICT, 403), while RAISE and CLOSE are open to the lead auditor.
  SupplierRep is the only entity_backed role: its X-User-ID is a Foundry id, which makes heat-lot reads and
  writes tenant-scoped and makes ERR_FOUNDRY_SCOPE_VIOLATION distinct from ERR_ROLE_NOT_PERMITTED.
