            - call: "POST /api/ops/run-daily-sweep"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/checkouts/${c2}/dispute"
              payload: { reason: "lost" }
              as: Member
              as_user_id: "${mp}"
            - call: "POST /api/checkouts/${c2}/resolve-dispute"
              payload: { outcome: "WRITE_OFF" }
              as: ProgramAdmin
            - call: "POST /api/checkouts/${c3}/dispute"
              payload: { reason: "lost" }
              as: Member
              as_user_id: "${mp}"
            - call: "POST /api/checkouts/${c3}/resolve-dispute"
