# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_2943 — Rental Car Fleet Planning & Remarketing
#
# Breadth walk of references/claim-extraction-guide.md against this scaffold's
# §1.1–§1.7. `section:` values are the guide's nine sections; `claim_type:`
# values are its per-section table rows. Corners already asserted by a §1.8
# instance carry an `excluded_because:` stub and no test_recipe.
#
# Fixture world is the same as §1.8's (ATL/DFW/ORD markets, MIDSIZE segment,
# MID-2026 policy, PGM/RSK programs, AUCTION/RETAIL_LOT channels,
# capitalized_cost_per_unit_cents 2800000, 16-character VINs).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: market_create_returns_201_with_active_status_and_zero_census
        claim_type: creation
        grounds:
          - entities.Market
          - endpoints[POST /fleet/markets]
        distinguishing_aspect: "A create echoes all eight input fields verbatim and mints the two non-input fields itself: status defaults to ACTIVE and the computed census starts at 0, not null."
        test_recipe:
          setup:
            - "Empty database; only the PlatformAdmin role may create a market."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "POST /fleet/markets"
              payload: { code: "ATL", name: "Atlanta", region: "EAST", transport_hub_distance_km: 23, transfer_cost_per_km_cents: 250, storage_cost_per_day_cents: 800, prep_capacity_per_day: 2, registration_lead_days: 3 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { mkt_atl: $.data.id }
          assert:
            - "HTTP 201 with response_type \"object\""
            - "data.code == \"ATL\", data.name == \"Atlanta\", data.region == \"EAST\", data.transport_hub_distance_km == 23, data.transfer_cost_per_km_cents == 250, data.storage_cost_per_day_cents == 800, data.prep_capacity_per_day == 2, data.registration_lead_days == 3"
            - "data.status == \"ACTIVE\" (system default) and data.in_service_unit_count == 0 (computed, not null)"
            - "data.version == 1 and data.id is a bare UUID with no type prefix"
            - "data.created_at and data.updated_at are ISO 8601 UTC with exactly three fractional digits and are equal on a fresh row"
            - "meta.api_request_id and meta.api_request_timestamp are present per §1.0's success envelope"

      - name: market_read_by_id_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /fleet/markets/{market_id}]
        distinguishing_aspect: "The single-resource GET is byte-identical to the create response, including the computed census, and is readable by all five roles rather than only PlatformAdmin."
        test_recipe:
          setup:
            - "One ATL market created by PlatformAdmin."
          setup_api_calls:
            - call: "POST /fleet/markets"
              payload: { code: "ATL", name: "Atlanta", region: "EAST", transport_hub_distance_km: 23, transfer_cost_per_km_cents: 250, storage_cost_per_day_cents: 800, prep_capacity_per_day: 2, registration_lead_days: 3 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { mkt_atl: $.data.id }
          trigger:
            - call: "GET /fleet/markets/${mkt_atl}"
              payload: {}
              as: FleetPlanner
              as_user_id: "u-plan-1"
          assert:
            - "HTTP 200 and data.id == \"${mkt_atl}\""
            - "every field returned matches the create response exactly, including status \"ACTIVE\", in_service_unit_count 0 and version 1"
            - "data.updated_at is unchanged by the read"

      - name: markets_list_reports_total_count_and_has_more_under_pagination
        claim_type: listing
        grounds:
          - endpoints[GET /fleet/markets]
          - response_envelope.pagination_fields
        distinguishing_aspect: "The list envelope carries the four pagination fields and total_count counts the whole filtered set (3), not the returned page (2); the region filter narrows total_count itself."
        test_recipe:
          setup:
            - "Three markets exist: ATL (EAST), DFW (CENTRAL) and ORD (CENTRAL)."
          setup_api_calls:
            - call: "POST /fleet/markets"
              payload: { code: "ATL", name: "Atlanta", region: "EAST", transport_hub_distance_km: 23, transfer_cost_per_km_cents: 250, storage_cost_per_day_cents: 800, prep_capacity_per_day: 2, registration_lead_days: 3 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { mkt_atl: $.data.id }
            - call: "POST /fleet/markets"
              payload: { code: "DFW", name: "Dallas", region: "CENTRAL", transport_hub_distance_km: 35, transfer_cost_per_km_cents: 300, storage_cost_per_day_cents: 700, prep_capacity_per_day: 4, registration_lead_days: 2 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { mkt_dfw: $.data.id }
            - call: "POST /fleet/markets"
              payload: { code: "ORD", name: "Chicago", region: "CENTRAL", transport_hub_distance_km: 40, transfer_cost_per_km_cents: 280, storage_cost_per_day_cents: 900, prep_capacity_per_day: 5, registration_lead_days: 4 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { mkt_ord: $.data.id }
          trigger:
            - call: "GET /fleet/markets"
              payload: { limit: 2, offset: 0 }
              as: FleetController
              as_user_id: "u-ctl-a"
            - call: "GET /fleet/markets"
              payload: { limit: 2, offset: 2 }
              as: FleetController
              as_user_id: "u-ctl-a"
            - call: "GET /fleet/markets"
              payload: { region: "CENTRAL" }
              as: FleetController
              as_user_id: "u-ctl-a"
          assert:
            - "the first page returns response_type \"array\" with 2 rows, total_count 3, limit 2, offset 0 and has_more true"
            - "the second page returns 1 row, total_count 3, offset 2 and has_more false"
            - "the region CENTRAL filter returns 2 rows with total_count 2 - total_count reflects the filter, not the table"
            - "the unfiltered default page size is 10 per §1.0's pagination_defaults"

      - name: market_get_with_unknown_uuid_returns_404_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_MARKET_NOT_FOUND]
          - validations[priority 5 ERR_MARKET_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unstored UUID is a 404 with the entity-specific code ERR_MARKET_NOT_FOUND, not a generic 404 and not a 422 - each of the thirteen entities has its own code."
        test_recipe:
          setup:
            - "Empty database; no Market row has been created."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "GET /fleet/markets/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { nf_error: $.data.error_id }
          assert:
            - "HTTP 404 with response_type \"error\" and data.error_id == \"ERR_MARKET_NOT_FOUND\""
            - "data.message is a non-empty string and no Market row is created as a side effect"
            - "GET /fleet/markets reports total_count 0"

      - name: market_create_missing_required_code_returns_422_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority 7 ERR_INVALID_REQUEST]
          - entities.Market.fields.code
        distinguishing_aspect: "code has source input with no default, so omitting it is a 422 ERR_INVALID_REQUEST at priority 7 - it is not silently defaulted and it is not a 409 duplicate check."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "POST /fleet/markets"
              payload: { name: "Atlanta", region: "EAST", transport_hub_distance_km: 23, transfer_cost_per_km_cents: 250, storage_cost_per_day_cents: 800, prep_capacity_per_day: 2, registration_lead_days: 3 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { missing_error: $.data.error_id }
          assert:
            - "HTTP 422 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /fleet/markets reports total_count 0 - the partial row is not persisted"

      - name: vehicle_create_defaults_odometer_zero_on_order_and_sound
        claim_type: defaults
        grounds:
          - entities.Vehicle.fields.fleet_status
          - entities.Vehicle.fields.condition_status
          - entities.Vehicle.fields.odometer_km
          - endpoints[POST /fleet/purchase-allocations/{allocation_id}/vehicles]
        distinguishing_aspect: "A minted vehicle takes only vin and current_market_id from the caller; the two independent state dimensions default to ON_ORDER and SOUND on the same row and every usage counter defaults to 0 rather than null."
        test_recipe:
          setup:
            - "One ATL market, one MIDSIZE segment, one PROGRAM manufacturer program."
            - "One LOCKED ATL PEAK 2026 plan with planned_unit_count 10 and one 4-unit allocation."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /fleet/markets"
              payload: { code: "ATL", name: "Atlanta", region: "EAST", transport_hub_distance_km: 23, transfer_cost_per_km_cents: 250, storage_cost_per_day_cents: 800, prep_capacity_per_day: 2, registration_lead_days: 3 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { mkt_atl: $.data.id }
            - call: "POST /fleet/vehicle-segments"
              payload: { code: "MIDSIZE", name: "Midsize sedan", baseline_daily_rate_cents: 5500, target_utilization_pct: 0.80, target_revenue_per_unit_month_cents: 132000, mileage_band_soft_limit_km: 40000, mileage_band_hard_limit_km: 60000, recondition_cap_cents: 90000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { seg_mid: $.data.id }
            - call: "POST /fleet/manufacturer-programs"
              payload: { manufacturer_name: "Northstar", program_year: 2026, program_type: "PROGRAM", repurchase_guarantee_pct: 0.82, min_holding_days: 180, max_holding_days: 365, max_eligible_mileage_km: 45000, excess_mileage_charge_cents_per_km: 30, damage_deduction_cap_cents: 150000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { prg_pgm: $.data.id }
            - call: "POST /fleet/fleet-plans"
              payload: { market_id: "${mkt_atl}", season: "PEAK", plan_year: 2026, planned_unit_count: 10, revenue_per_unit_target_cents: 132000, utilization_target_pct: 0.80 }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { plan_atl: $.data.id }
            - call: "POST /fleet/fleet-plans/${plan_atl}/lock"
              payload: {}
              as: FleetController
              as_user_id: "u-ctl-a"
              captures: { plan_v1: $.data.version }
            - call: "POST /fleet/fleet-plans/${plan_atl}/allocations"
              payload: { program_id: "${prg_pgm}", segment_id: "${seg_mid}", unit_count: 4, capitalized_cost_per_unit_cents: 2800000, expected_plan_version: "${plan_v1}" }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { alloc_pgm: $.data.id }
          trigger:
            - call: "POST /fleet/purchase-allocations/${alloc_pgm}/vehicles"
              payload: { vin: "NS26PGMATL000101", current_market_id: "${mkt_atl}" }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { veh_d: $.data.id }
          assert:
            - "HTTP 201 with data.fleet_status == \"ON_ORDER\" and data.condition_status == \"SOUND\""
            - "data.odometer_km == 0, data.rented_days_total == 0, data.available_days_total == 0, data.revenue_to_date_cents == 0, data.total_recondition_cents == 0"
            - "data.registered_at, licensed_at, prep_completed_at, first_rent_ready_at, in_service_at, held_for_sale_at and net_book_value_at_hold_cents are all null"
            - "data.version == 1 and PurchaseAllocation.${alloc_pgm}.created_vehicle_count is recomputed to 1 while its status stays ORDERED"

      - name: vehicle_capitalized_cost_and_segment_copied_from_allocation_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Vehicle.fields.capitalized_cost_cents
          - entities.Vehicle.fields.segment_id
          - entities.Vehicle.fields.program_id
        distinguishing_aspect: "capitalized_cost_cents, segment_id and program_id are source computed - they are copied from the parent allocation, so client-supplied values for them are ignored rather than honoured or rejected."
        test_recipe:
          setup:
            - "Same LOCKED ATL plan with one 4-unit allocation at capitalized_cost_per_unit_cents 2800000, plus a decoy SUV segment and a decoy RISK program that the payload will try to inject."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /fleet/markets"
              payload: { code: "ATL", name: "Atlanta", region: "EAST", transport_hub_distance_km: 23, transfer_cost_per_km_cents: 250, storage_cost_per_day_cents: 800, prep_capacity_per_day: 2, registration_lead_days: 3 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { mkt_atl: $.data.id }
            - call: "POST /fleet/vehicle-segments"
              payload: { code: "MIDSIZE", name: "Midsize sedan", baseline_daily_rate_cents: 5500, target_utilization_pct: 0.80, target_revenue_per_unit_month_cents: 132000, mileage_band_soft_limit_km: 40000, mileage_band_hard_limit_km: 60000, recondition_cap_cents: 90000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { seg_mid: $.data.id }
            - call: "POST /fleet/vehicle-segments"
              payload: { code: "SUV", name: "Sport utility", baseline_daily_rate_cents: 7500, target_utilization_pct: 0.75, target_revenue_per_unit_month_cents: 168000, mileage_band_soft_limit_km: 35000, mileage_band_hard_limit_km: 55000, recondition_cap_cents: 120000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { seg_suv: $.data.id }
            - call: "POST /fleet/manufacturer-programs"
              payload: { manufacturer_name: "Northstar", program_year: 2026, program_type: "PROGRAM", repurchase_guarantee_pct: 0.82, min_holding_days: 180, max_holding_days: 365, max_eligible_mileage_km: 45000, excess_mileage_charge_cents_per_km: 30, damage_deduction_cap_cents: 150000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { prg_pgm: $.data.id }
            - call: "POST /fleet/fleet-plans"
              payload: { market_id: "${mkt_atl}", season: "PEAK", plan_year: 2026, planned_unit_count: 10, revenue_per_unit_target_cents: 132000, utilization_target_pct: 0.80 }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { plan_atl: $.data.id }
            - call: "POST /fleet/fleet-plans/${plan_atl}/lock"
              payload: {}
              as: FleetController
              as_user_id: "u-ctl-a"
              captures: { plan_v1: $.data.version }
            - call: "POST /fleet/fleet-plans/${plan_atl}/allocations"
              payload: { program_id: "${prg_pgm}", segment_id: "${seg_mid}", unit_count: 4, capitalized_cost_per_unit_cents: 2800000, expected_plan_version: "${plan_v1}" }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { alloc_pgm: $.data.id }
          trigger:
            - call: "POST /fleet/purchase-allocations/${alloc_pgm}/vehicles"
              payload: { vin: "NS26PGMATL000102", current_market_id: "${mkt_atl}", capitalized_cost_cents: 1, segment_id: "${seg_suv}", odometer_km: 90000 }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { veh_e: $.data.id }
          assert:
            - "HTTP 201 with data.capitalized_cost_cents == 2800000, copied from the allocation - the injected 1 is ignored"
            - "data.segment_id == \"${seg_mid}\" from the allocation, not the injected SUV segment id"
            - "data.program_id == \"${prg_pgm}\" from the allocation"
            - "data.odometer_km == 0: odometer_km is not in this endpoint's declared input list, so the extra body field is ignored rather than rejected"
            - "the single CAPITALIZATION LedgerEntry for this vehicle has amount_cents +2800000, proving the ledger read the computed field and not the payload"

      - name: market_id_and_timestamps_are_server_minted_client_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Market.fields.status
          - complexity_profile
        distinguishing_aspect: "id, created_at, updated_at, version and status are all server-owned on Market; supplying them in the create body changes nothing, and the minted id is a bare UUID with no `mkt_` prefix."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "POST /fleet/markets"
              payload: { code: "ATL", name: "Atlanta", region: "EAST", transport_hub_distance_km: 23, transfer_cost_per_km_cents: 250, storage_cost_per_day_cents: 800, prep_capacity_per_day: 2, registration_lead_days: 3, id: "mkt_client_supplied", created_at: "1999-01-01T00:00:00Z", version: 99, status: "SUSPENDED", in_service_unit_count: 42 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { mkt_sys: $.data.id }
          assert:
            - "HTTP 201 and data.id != \"mkt_client_supplied\"; it is a server-minted bare UUID"
            - "data.created_at is the current logical clock 2026-01-01T00:00:00.000Z, not 1999-01-01"
            - "data.version == 1, not 99"
            - "data.status == \"ACTIVE\", not the injected SUSPENDED - only POST /fleet/markets/{market_id}/suspend can move it"
            - "data.in_service_unit_count == 0, not the injected 42"

      - name: market_create_with_out_of_range_region_enum_returns_422
        claim_type: type_constraints
        grounds:
          - entities.Market.fields.region
          - validations[priority 7 ERR_INVALID_REQUEST]
        distinguishing_aspect: "The enum closure check is part of priority 7's schema gate: a value outside {EAST, CENTRAL, WEST} is a 422 ERR_INVALID_REQUEST, the same code as a missing field, and a negative integer where the constraint says > 0 is rejected by the same rule."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "POST /fleet/markets"
              payload: { code: "ATL", name: "Atlanta", region: "NORTH", transport_hub_distance_km: 23, transfer_cost_per_km_cents: 250, storage_cost_per_day_cents: 800, prep_capacity_per_day: 2, registration_lead_days: 3 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { enum_error: $.data.error_id }
            - call: "POST /fleet/markets"
              payload: { code: "DFW", name: "Dallas", region: "CENTRAL", transport_hub_distance_km: 35, transfer_cost_per_km_cents: 0, storage_cost_per_day_cents: 700, prep_capacity_per_day: 4, registration_lead_days: 2 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { range_error: $.data.error_id }
          assert:
            - "the region NORTH call returns HTTP 422 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "the transfer_cost_per_km_cents 0 call also returns HTTP 422 ERR_INVALID_REQUEST because the field's constraint is strictly > 0"
            - "GET /fleet/markets reports total_count 0 after both refusals"

      - name: ledger_entry_is_immutable_with_no_version_and_no_write_endpoint
        claim_type: immutability
        grounds:
          - entities.LedgerEntry
          - endpoints[GET /fleet/ledger-entries/{ledger_entry_id}]
        distinguishing_aspect: "LedgerEntry is the scaffold's only common_fields false entity: it carries id and created_at but NO version and NO updated_at, and §1.5 declares no POST, PATCH or DELETE for it - rows appear only as side effects of other transitions."
        test_recipe:
          setup:
            - "A vehicle is minted under a LOCKED ATL plan, which posts exactly one CAPITALIZATION ledger row of +2800000."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /fleet/markets"
              payload: { code: "ATL", name: "Atlanta", region: "EAST", transport_hub_distance_km: 23, transfer_cost_per_km_cents: 250, storage_cost_per_day_cents: 800, prep_capacity_per_day: 2, registration_lead_days: 3 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { mkt_atl: $.data.id }
            - call: "POST /fleet/vehicle-segments"
              payload: { code: "MIDSIZE", name: "Midsize sedan", baseline_daily_rate_cents: 5500, target_utilization_pct: 0.80, target_revenue_per_unit_month_cents: 132000, mileage_band_soft_limit_km: 40000, mileage_band_hard_limit_km: 60000, recondition_cap_cents: 90000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { seg_mid: $.data.id }
            - call: "POST /fleet/manufacturer-programs"
              payload: { manufacturer_name: "Northstar", program_year: 2026, program_type: "PROGRAM", repurchase_guarantee_pct: 0.82, min_holding_days: 180, max_holding_days: 365, max_eligible_mileage_km: 45000, excess_mileage_charge_cents_per_km: 30, damage_deduction_cap_cents: 150000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { prg_pgm: $.data.id }
            - call: "POST /fleet/fleet-plans"
              payload: { market_id: "${mkt_atl}", season: "PEAK", plan_year: 2026, planned_unit_count: 10, revenue_per_unit_target_cents: 132000, utilization_target_pct: 0.80 }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { plan_atl: $.data.id }
            - call: "POST /fleet/fleet-plans/${plan_atl}/lock"
              payload: {}
              as: FleetController
              as_user_id: "u-ctl-a"
              captures: { plan_v1: $.data.version }
            - call: "POST /fleet/fleet-plans/${plan_atl}/allocations"
              payload: { program_id: "${prg_pgm}", segment_id: "${seg_mid}", unit_count: 4, capitalized_cost_per_unit_cents: 2800000, expected_plan_version: "${plan_v1}" }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { alloc_pgm: $.data.id }
            - call: "POST /fleet/purchase-allocations/${alloc_pgm}/vehicles"
              payload: { vin: "NS26PGMATL000103", current_market_id: "${mkt_atl}" }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { veh_f: $.data.id }
          trigger:
            - call: "GET /fleet/ledger-entries"
              payload: { vehicle_id: "${veh_f}" }
              as: FleetController
              as_user_id: "u-ctl-a"
              captures: { le_cap: "$.data[0].id" }
            - call: "GET /fleet/ledger-entries/${le_cap}"
              payload: {}
              as: FleetController
              as_user_id: "u-ctl-a"
          assert:
