  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: finalize_cascade_rating_campus_dashboard
        grounds:
          - state_machines.SelfStudyRating.SUBMITTED_to_FINALIZED
          - calculations.campus_composite_index
        distinguishing_aspect: |
          Depth-3 cascade from rating finalize: SelfStudyRating SUBMITTED->FINALIZED
          mutates Campus.composite_index_pct (link 1 -> 2); that mutation bumps
          Campus.version (link 2 -> 3 observable on campus read); dashboard
          projection changes as a downstream read consequence. Triggered by
          rating finalize.
        test_recipe:
          setup:
            - "SINGLE_SCHOOL system, one campus, standards L1(w100), term in SELF_STUDY"
            - "Rating created and submitted; campus version captured before finalize"
          setup_api_calls:
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
            - call: "POST /accreditation/standards"
              payload: { code: "L1", title: "Leadership 1", domain: "LEADERSHIP", weight_pct: 100, evidence_min_items: 0 }
              as: AccreditationOfficer
              captures: { std_l1: $.data.id }
            - call: "POST /accreditation/systems"
              payload: { name: "Cascade School", system_type: "SINGLE_SCHOOL" }
              as: AccreditationOfficer
              captures: { sys_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/campuses"
              payload: { name: "Main", enrollment: 300 }
              as: AccreditationOfficer
              captures: { campus_id: $.data.id, campus_v_pre: $.data.version }
            - call: "POST /accreditation/systems/${sys_id}/terms"
              payload: { term_start: "2026-09-01T00:00:00Z", term_length_years: 5 }
              as: AccreditationOfficer
              captures: { term_id: $.data.id, term_v: $.data.version }
            - call: "POST /accreditation/ratings"
              payload: { term_id: "${term_id}", campus_id: "${campus_id}", standard_id: "${std_l1}", rating: 3, expected_term_version: "${term_v}" }
              as: SchoolLeader
              captures: { r_1: $.data.id }
            - call: "POST /accreditation/terms/${term_id}/advance"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/ratings/${r_1}/submit"
              payload: {}
              as: SchoolLeader
          trigger:
            - call: "POST /accreditation/ratings/${r_1}/finalize"
              payload: {}
              as: AccreditationOfficer
            - call: "GET /accreditation/campuses/${campus_id}"
              payload: {}
              as: AccreditationOfficer
              captures: { campus_v_post: $.data.version }
            - call: "GET /accreditation/systems/${sys_id}/dashboard"
              payload: {}
              as: AccreditationOfficer
          assert:
            - "Rating.${r_1}.status == FINALIZED"
            - "Campus.composite_index_pct == 75.00 (rating 3, weight 100 -> 3*100/100*25)"
            - "Campus.version advanced from ${campus_v_pre} by exactly 1 (link 2 mutation)"
            - "dashboard.projected_index_pct == 75.00 (link 3 read consequence)"

      - name: late_report_accept_cascade_penalty_invoice
        grounds:
          - state_machines.InterimReport.LATE_to_ACCEPTED
          - calculations.late_report_penalty
          - calculations.annual_fee_invoice_amount
        distinguishing_aspect: |
          Depth-3 cascade from interim-report accept: LATE->ACCEPTED debits
          system.fee_credit_cents by 25000 (link 1 -> 2); negative credit feeds
          the next ANNUAL_FEE invoice amount computation (link 2 -> 3). Triggered
          by report accept, a different trigger from rating finalize.
        test_recipe:
          setup:
            - "System ACCREDITED, term TERM_ACTIVE, report_year 1 report past due"
            - "term_start 2026-09-01 -> report year 1 due = 2027-09-01 - 60 days = 2027-07-03"
            - "Clock at 2027-07-10 (past due); submit -> LATE; accept debits penalty"
            - "Then issue ANNUAL_FEE invoice: base 500000 + 1 small campus*120000 = 620000; credit -25000 -> amount = 645000"
          setup_api_calls:
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
            - call: "POST /accreditation/fee-schedules"
              payload: { effective_from: "2026-01-01T00:00:00Z", base_system_fee_cents: 500000, per_campus_fee_cents: 120000, large_campus_fee_cents: 200000, large_campus_threshold: 1000, visit_day_rate_cents: 75000 }
              as: AccreditationOfficer
            - call: "POST /accreditation/standards"
              payload: { code: "L1", title: "Leadership 1", domain: "LEADERSHIP", weight_pct: 100, evidence_min_items: 0 }
              as: AccreditationOfficer
              captures: { std_l1: $.data.id }
            - call: "POST /accreditation/systems"
              payload: { name: "Penalty County", system_type: "SINGLE_SCHOOL" }
              as: AccreditationOfficer
              captures: { sys_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/campuses"
              payload: { name: "Main", enrollment: 300 }
              as: AccreditationOfficer
              captures: { campus_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/terms"
              payload: { term_start: "2026-09-01T00:00:00Z", term_length_years: 5 }
              as: AccreditationOfficer
              captures: { term_id: $.data.id, term_v: $.data.version }
            - call: "POST /accreditation/ratings"
              payload: { term_id: "${term_id}", campus_id: "${campus_id}", standard_id: "${std_l1}", rating: 4, expected_term_version: "${term_v}" }
              as: SchoolLeader
              captures: { r_1: $.data.id }
            - call: "POST /accreditation/terms/${term_id}/advance"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/ratings/${r_1}/submit"
              payload: {}
              as: SchoolLeader
            - call: "POST /accreditation/ratings/${r_1}/finalize"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/terms/${term_id}/advance"
              payload: {}
              as: AccreditationOfficer
            # REVIEW: need visit + report issued
            - call: "POST /accreditation/reviewers"
              payload: { full_name: "Rita Reviewer", email: "rita@accreditor.org" }
              as: AccreditationOfficer
              captures: { rev_id: $.data.id }
            - call: "POST /accreditation/terms/${term_id}/visits"
              payload: { campus_id: "${campus_id}", lead_reviewer_id: "${rev_id}", starts_on: "2026-11-02T00:00:00Z", ends_on: "2026-11-04T00:00:00Z" }
              as: AccreditationOfficer
              captures: { visit_id: $.data.id }
            - call: "POST /accreditation/visits/${visit_id}/assignments"
              payload: { reviewer_id: "${rev_id}", role_on_team: "CHAIR" }
              as: AccreditationOfficer
            - call: "POST /accreditation/visits/${visit_id}/confirm"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-03T00:00:00Z" }
              as: AccreditationOfficer
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-05T00:00:00Z" }
              as: AccreditationOfficer
            - call: "POST /accreditation/visits/${visit_id}/findings"
              payload: { standard_id: "${std_l1}", severity: "COMMENDATION", narrative: "Strong governance." }
              as: Reviewer
              as_user_id: "${rev_id}"
              captures: { f_1: $.data.id }
            - call: "POST /accreditation/findings/${f_1}/issue"
              payload: {}
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "POST /accreditation/visits/${visit_id}/issue-report"
              payload: {}
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "POST /accreditation/terms/${term_id}/advance"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/terms/${term_id}/decide"
              payload: { outcome: "ACCREDITED" }
              as: AccreditationCommission
            # term TERM_ACTIVE; create interim report year 1
            - call: "POST /accreditation/terms/${term_id}/interim-reports"
              payload: { report_year: 1, narrative: "Year one progress." }
              as: SchoolLeader
              captures: { rep_id: $.data.id }
