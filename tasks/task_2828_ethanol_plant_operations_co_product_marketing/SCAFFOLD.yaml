# =============================================================================
# PRD-BENCH SCAFFOLD — Ethanol Plant Operations & Co-Product Marketing
# §1.0 Response Envelope · §1.1 Entities · §1.2 State Machines · §1.2.1
# Concurrency · §1.3 Calculations · §1.4 Validations · §1.5 Endpoints ·
# §1.6 Errors · §1.7 RBAC
# =============================================================================
scenario: |
  2828. Ethanol Plant Operations & Co-Product Marketing (corn ethanol production facility): corn procurement with basis contracting, quality specifications and inbound grading at the scale, milling, fermentation and distillation operations with yield per bushel and fermentation health monitoring, denaturant blending, product tank management and rail loading with unit train scheduling, co-product marketing across distillers grains and corn oil with pricing tied to feed and vegetable oil markets, credit generation and separation under the renewable fuel program with volume reporting, carbon intensity reduction projects with certification for low carbon fuel markets, crush margin management with hedging across corn, ethanol and natural gas, environmental permitting with air emissions and water discharge compliance

domain_name: ethanol-plant-operations
api_prefix: /ethanol-ops

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # graph: ProductTank is referenced by four different child entities in four
  # different roles (batch destination, blend neat source, blend denaturant
  # source, blend destination, shipment source); CornPurchaseContract and
  # CarbonProject are self-referential (contract rolls, stacked CI projects);
  # RinBatch bridges FermentationBatch and UnitTrainShipment across aggregate
  # boundaries. No single ownership tree exists.

  state_machine_shape: cyclic
  # FermentationBatch cycles FERMENTING -> HEALTH_WATCH -> FERMENTING via
  # operator intervention; CarbonProject cycles SUBMITTED ->
  # RETURNED_FOR_REVISION -> SUBMITTED; PermitCondition cycles COMPLIANT ->
  # EXCEEDANCE -> COMPLIANT; UnitTrainShipment additionally carries two
  # independent state dimensions (loading_status x billing_status);
  # ProductTank.hold forks on hold_reason with divergent side-effect sets.

  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The ScaleOperator user who grades a delivery may not be the user who
  # settles it (CornDelivery.graded_by_user_id vs the settle caller's
  # X-User-ID); the ComplianceOfficer who submits a CarbonProject may not
  # review it (review is PlantManager-only).

  consistency_model: immediate

  difficulty_level: expert_plus
  # 15 entities / 64 endpoints / 59 error codes / 13 state machines /
  # 18 calculations, two of them dual-variant.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 ENTITY-RELATIONSHIP TABLE
# =============================================================================
entities:

  # ---------------------------------------------------------------------------
  - name: Plant
    parent: null
    common_fields: true
    description: >
      The single corn ethanol production facility. Exactly one Plant row may
      exist (singleton); every operational entity belongs to it implicitly, so
      no operational entity carries a plant_id foreign key. Holds the market
      marks used by every mark-based calculation and the two derived postures
      that gate production and shipping.
    fields:
      - name: name
        type: string
        source: input
        description: Facility name.
        constraints: non-empty, max 120 chars
      - name: nameplate_capacity_gallons
        type: integer
        source: input
        description: Annual nameplate denatured-ethanol capacity.
        constraints: "> 0"
      - name: base_grind_cap_bushels
        type: integer
        source: input
        description: Unrestricted daily corn grind ceiling before posture multipliers.
        default: 120000
        constraints: "> 0"
      - name: coverage_floor_bushels
        type: integer
        source: input
        description: Minimum open contracted coverage below which procurement_posture becomes SHORT.
        default: 200000
        constraints: ">= 0"
      - name: baseline_ci_g_per_mj
        type: number
        source: input
        description: Pathway baseline carbon intensity in gCO2e/MJ before certified reductions.
        default: 60.0
        constraints: "> 0, 1 decimal"
      - name: rin_generation_enabled
        type: boolean
        source: input
        description: When false, batch completion creates no RinBatch.
        default: true
      - name: mark_corn_cents_per_bushel
        type: number
        source: system
        description: Latest posted corn futures mark, cents per bushel. Null until first market-marks post.
        default: null
      - name: mark_ethanol_cents_per_gallon
        type: number
        source: system
        description: Latest posted ethanol mark, cents per gallon.
        default: null
      - name: mark_natgas_cents_per_mmbtu
        type: number
        source: system
        description: Latest posted natural gas mark, cents per MMBtu.
        default: null
      - name: mark_soybean_meal_usd_per_ton
        type: number
        source: system
        description: Latest posted soybean meal mark, USD per short ton (DDGS index reference).
        default: null
      - name: mark_sbo_cents_per_lb
        type: number
        source: system
        description: Latest posted soybean oil mark, cents per pound (corn oil index reference).
        default: null
      - name: marks_effective_month
        type: string
        source: system
        description: Contract month the current marks apply to, format YYYY-MM.
        default: null
      - name: marks_updated_at
        type: datetime
        source: system
        description: Logical-clock instant of the latest market-marks post.
        default: null
      - name: corn_inventory_bushels
        type: number
        source: computed
        description: >
          Sum of CornDelivery.net_dry_bushels over deliveries with
          grading_status == SETTLED minus sum of
          FermentationBatch.corn_bushels_charged over batches with status IN
          {CHARGED, FERMENTING, HEALTH_WATCH, DISTILLING, COMPLETED, DUMPED}.
          Charged corn is never returned, including on DUMPED batches.
        default: 0
        constraints: 2 decimals, may not go negative (guarded by ERR_INSUFFICIENT_CORN_INVENTORY)
      - name: ddgs_inventory_tons
        type: number
        source: computed
        description: >
          Sum of FermentationBatch.ddgs_tons_produced over batches with status
          == COMPLETED minus sum of CoProductSale.quantity over sales with
          status == SHIPPED and product IN {DDGS_DRY, DDGS_WET}.
        default: 0
        constraints: 3 decimals
      - name: corn_oil_inventory_lbs
        type: number
        source: computed
        description: >
          Sum of FermentationBatch.corn_oil_lbs_produced over batches with
          status == COMPLETED minus sum of CoProductSale.quantity over sales
          with status == SHIPPED and product == CORN_OIL.
        default: 0
        constraints: 2 decimals
      - name: open_contract_coverage_bushels
        type: number
        source: computed
        description: >
          Sum of (bushels_contracted - bushels_delivered) over
          CornPurchaseContract rows with status IN {OPEN, PARTIALLY_FILLED}.
          Rows with status IN {FILLED, ROLLED} are excluded entirely.
        default: 0
        constraints: 2 decimals
      - name: procurement_posture
        type: enum
        source: computed
        description: >
          ADEQUATE when open_contract_coverage_bushels >= coverage_floor_bushels,
          else SHORT. A brand-new plant with an empty contract book therefore
          starts SHORT whenever coverage_floor_bushels is greater than 0.
        default: SHORT
        constraints: "ADEQUATE | SHORT"
      - name: compliance_posture
        type: enum
        source: computed
        description: >
          Worst-of aggregation per calculations.plant_compliance_posture over
          PermitCondition exceedances and OFF_SPEC tank holds.
        default: OPEN
        constraints: "OPEN | RESTRICTED | CURTAILED | SUSPENDED"
      - name: daily_grind_cap_bushels
        type: integer
        source: computed
        description: >
          Per calculations.daily_grind_cap — base cap scaled by both postures. At
          creation the default coverage floor leaves the plant SHORT, so the
          default base cap of 120000 derives 90000.
        default: 90000
      - name: rolling_yield_gal_per_bushel
        type: number
        source: computed
        description: >
          Sum of FermentationBatch.ethanol_gallons_produced divided by sum of
          corn_bushels_charged over batches with status == COMPLETED, rounded
          to 3 decimals; 2.850 when no COMPLETED batch exists.
        default: 2.850
      - name: ci_score_g_per_mj
        type: number
        source: computed
        description: Per calculations.plant_ci_score — baseline minus the capped certified-reduction waterfall.
        default: 60.0
        constraints: 3 decimals, floor 0.000
      - name: lcfs_credit_tonnes_per_million_gal
        type: number
        source: computed
        description: Per calculations.lcfs_credit_rate — LCFS credit tonnes per million denatured gallons.
        default: 0.0
        constraints: 3 decimals
      - name: rin_generated_count
        type: integer
        source: computed
        description: Sum of RinBatch.rin_count over rows with status IN {GENERATED, SEPARATED, RETIRED}.
        default: 0
      - name: rin_separated_count
        type: integer
        source: computed
        description: Sum of RinBatch.rin_count over rows with status IN {SEPARATED, RETIRED}.
        default: 0
      - name: rin_retired_count
        type: integer
        source: computed
        description: Sum of RinBatch.rin_count over rows with status == RETIRED.
        default: 0

  # ---------------------------------------------------------------------------
  - name: CornPurchaseContract
    parent: null
    common_fields: true
    description: >
      A basis contract for corn delivery in a named month. Basis is fixed at
      creation; the futures leg is priced later. Unfilled bushels can be
      rolled into a successor contract, which is what makes the entity
      self-referential.
    fields:
      - name: supplier_name
        type: string
        source: input
        description: Counterparty name.
        constraints: non-empty
      - name: delivery_month
        type: string
        source: input
        description: Delivery month, format YYYY-MM.
        constraints: "matches ^\\d{4}-(0[1-9]|1[0-2])$"
      - name: bushels_contracted
        type: number
        source: input
        description: Contracted bushels on a 15.0% moisture dry basis.
        constraints: "> 0, 2 decimals"
      - name: basis_cents_per_bushel
        type: number
        source: input
        description: Basis over/under futures, cents per bushel. May be negative.
        constraints: 2 decimals
      - name: futures_price_cents_per_bushel
        type: number
        source: system
        description: Futures leg, cents per bushel. Null while pricing_status == UNPRICED.
        default: null
      - name: pricing_status
        type: enum
        source: system
        description: UNPRICED until the price action fixes the futures leg.
        default: UNPRICED
        constraints: "UNPRICED | PRICED"
      - name: priced_at
        type: datetime
        source: system
        description: Logical-clock instant the futures leg was fixed.
        default: null
      - name: status
        type: enum
        source: system
        description: Fill lifecycle, advanced only by delivery settlement or by a roll.
        default: OPEN
        constraints: "OPEN | PARTIALLY_FILLED | FILLED | ROLLED"
      - name: bushels_delivered
        type: number
        source: computed
        description: >
          Sum of CornDelivery.net_dry_bushels over this contract's deliveries
          with grading_status == SETTLED. REJECTED and GRADED deliveries do not
          count.
        default: 0
        constraints: 2 decimals
      - name: rolled_from_contract_id
        type: string
        source: system
        description: "FK -> CornPurchaseContract.id; null unless this contract was created by a roll of the referenced predecessor."
        default: null
      - name: roll_basis_adjustment_cents
        type: number
        source: system
        description: Basis adjustment applied when this contract was created by a roll, cents per bushel.
        default: null

  # ---------------------------------------------------------------------------
  - name: CornDelivery
    parent: CornPurchaseContract
    common_fields: true
    description: >
      One inbound truck weighed across the scale against a contract. Quality
      specs are recorded at grading, which computes shrink and the four
      discount components; settlement converts the graded load into money and
      is the trigger of the deepest cascade in the scaffold.
    fields:
      - name: contract_id
        type: string
        source: system
        description: "FK -> CornPurchaseContract.id; taken from the creation path, never from the body."
      - name: ticket_number
        type: string
        source: input
        description: Scale ticket number.
        constraints: non-empty, globally unique
      - name: gross_weight_lbs
        type: integer
        source: input
        description: Loaded truck weight in pounds.
        constraints: "> 0"
      - name: tare_weight_lbs
        type: integer
        source: input
        description: Empty truck weight in pounds.
        constraints: ">= 0 and < gross_weight_lbs"
      - name: moisture_pct
        type: number
        source: input
        description: Moisture percentage recorded at grading. Null while PENDING_GRADE.
        default: null
        constraints: "0 <= v <= 40, 2 decimals"
      - name: test_weight_lb_per_bu
        type: number
        source: input
        description: Test weight in pounds per bushel recorded at grading.
        default: null
        constraints: "> 0, 1 decimal"
      - name: foreign_material_pct
        type: number
        source: input
        description: Foreign material percentage recorded at grading.
        default: null
        constraints: "0 <= v <= 20, 2 decimals"
      - name: damaged_kernels_pct
        type: number
        source: input
        description: Damaged kernel percentage recorded at grading.
        default: null
        constraints: "0 <= v <= 40, 2 decimals"
      - name: aflatoxin_ppb
        type: integer
        source: input
        description: Aflatoxin reading in parts per billion recorded at grading.
        default: null
        constraints: ">= 0"
      - name: grading_status
        type: enum
        source: system
        description: Delivery lifecycle.
        default: PENDING_GRADE
        constraints: "PENDING_GRADE | GRADED | REJECTED | SETTLED"
      - name: rejection_reason
        type: enum
        source: system
        description: Set only when grading auto-rejects the load.
        default: null
        constraints: "AFLATOXIN_OVER_LIMIT | MOISTURE_OVER_LIMIT | null"
      - name: gross_wet_bushels
        type: number
        source: computed
        description: Step 1 of calculations.corn_delivery_settlement.
        default: null
      - name: net_dry_bushels
        type: number
        source: computed
        description: Step 2 of calculations.corn_delivery_settlement (15.0% moisture basis).
        default: null
      - name: moisture_discount_cents
        type: number
        source: computed
        description: Moisture component of the discount schedule, cents per bushel.
        default: null
      - name: test_weight_discount_cents
        type: number
        source: computed
        description: Test-weight component of the discount schedule, cents per bushel.
        default: null
      - name: foreign_material_discount_cents
        type: number
        source: computed
        description: Foreign-material component of the discount schedule, cents per bushel.
        default: null
      - name: damage_discount_cents
        type: number
        source: computed
        description: Damaged-kernel component of the discount schedule, cents per bushel.
        default: null
      - name: discount_cents_per_bushel
        type: number
        source: computed
        description: Sum of the four independently rounded discount components.
        default: null
      - name: net_price_cents_per_bushel
        type: number
        source: computed
        description: Contract gross price minus discount_cents_per_bushel, floored at 0.00.
        default: null
      - name: settlement_amount_cents
        type: integer
        source: computed
        description: Money owed for this load, integer cents. Null until SETTLED.
        default: null
      - name: graded_by_user_id
        type: string
        source: system
        description: X-User-ID of the ScaleOperator who graded the load; drives the segregation-of-duties check at settlement.
        default: null
      - name: settled_by_user_id
        type: string
        source: system
        description: X-User-ID of the GrainAccountant who settled the load.
        default: null
      - name: settled_at
        type: datetime
        source: system
        description: Logical-clock instant of settlement.
        default: null

  # ---------------------------------------------------------------------------
  - name: FermentationBatch
    parent: null
    common_fields: true
    description: >
      One fermenter charge from mill through distillation. Yield per bushel is
      derived from corn quality, fermentation health and the number of
      interventions, so the batch is the junction between grain quality,
      process health and every downstream product volume.
    fields:
      - name: batch_code
        type: string
        source: input
        description: Operator-assigned batch code.
        constraints: non-empty, globally unique
      - name: corn_bushels_charged
        type: number
        source: input
        description: Dry-basis bushels ground into this batch.
        constraints: "> 0, 2 decimals"
      - name: charge_test_weight_lb_per_bu
        type: number
        source: input
        description: Weighted test weight of the corn charged; drives the starch bonus.
        constraints: "> 0, 1 decimal"
      - name: destination_tank_id
        type: string
        source: input
        description: "FK -> ProductTank.id; must be a tank with product_type == ETHANOL_200_PROOF that receives the distilled neat ethanol."
      - name: charged_at
        type: datetime
        source: system
        description: Logical-clock instant the fermenter was charged.
      - name: status
        type: enum
        source: system
        description: Process lifecycle; can cycle between FERMENTING and HEALTH_WATCH.
        default: CHARGED
        constraints: "CHARGED | FERMENTING | HEALTH_WATCH | DISTILLING | COMPLETED | DUMPED"
      - name: intervention_count
        type: integer
        source: computed
        description: Number of accepted intervene actions on this batch; each one costs yield.
        default: 0
        constraints: "0 <= v <= 2"
      - name: fermentation_health_index
        type: number
        source: computed
        description: >
          Per calculations.fermentation_health_index over the three most recent
          health readings. 100.00 while no reading exists.
        default: 100.00
        constraints: "0.00 <= v <= 100.00, 2 decimals"
      - name: starch_bonus_gal_per_bushel
        type: number
        source: computed
        description: Test-weight component of calculations.batch_yield.
        default: null
      - name: health_penalty_gal_per_bushel
        type: number
        source: computed
        description: Health-tier component of calculations.batch_yield.
        default: null
      - name: intervention_penalty_gal_per_bushel
        type: number
        source: computed
        description: Intervention component of calculations.batch_yield.
        default: null
      - name: effective_yield_gal_per_bushel
        type: number
        source: computed
        description: Clamped per-bushel yield; null until distillation starts.
        default: null
        constraints: 3 decimals
      - name: ethanol_gallons_produced
        type: number
        source: computed
        description: Neat 200-proof gallons produced; null until COMPLETED.
        default: null
        constraints: 2 decimals
      - name: ddgs_tons_produced
        type: number
        source: computed
        description: Distillers grains short tons produced; null until COMPLETED.
        default: null
        constraints: 3 decimals
      - name: corn_oil_lbs_produced
        type: number
        source: computed
        description: Corn oil pounds produced; null until COMPLETED.
        default: null
        constraints: 2 decimals
      - name: distillation_started_at
        type: datetime
        source: system
        description: Logical-clock instant distillation began.
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: Logical-clock instant the batch reached COMPLETED.
        default: null
      - name: dumped_at
        type: datetime
        source: system
        description: Logical-clock instant the batch was dumped.
        default: null
      - name: dump_reason
        type: string
        source: system
        description: Free-text reason recorded when the batch was dumped.
        default: null

  # ---------------------------------------------------------------------------
  - name: FermentationHealthReading
    parent: FermentationBatch
    common_fields: false
    description: >
      An immutable lab reading on a fermenting batch. Readings are append-only
      and are never updated or deleted, so the entity has no version field and
      no update endpoint; the batch's health index is recomputed from the three
      most recent readings on every append.
    fields:
      - name: id
        type: string
        source: system
        description: Server-assigned identifier.
      - name: created_at
        type: datetime
        source: system
        description: Logical-clock instant the reading was recorded; tie-break key for reading ordering.
      - name: batch_id
        type: string
        source: system
        description: "FK -> FermentationBatch.id; taken from the creation path, never from the body."
      - name: hours_elapsed
        type: number
        source: input
        description: Hours since the fermenter was charged. Readings are ordered by this value descending.
        constraints: ">= 0, 1 decimal"
      - name: lactic_acid_ppm
        type: integer
        source: input
        description: Lactic acid concentration, parts per million.
        constraints: ">= 0"
      - name: acetic_acid_ppm
        type: integer
        source: input
        description: Acetic acid concentration, parts per million.
        constraints: ">= 0"
      - name: temperature_c
        type: number
        source: input
        description: Fermenter temperature in degrees Celsius.
        constraints: "0 <= v <= 60, 1 decimal"
      - name: reading_score
        type: number
        source: computed
        description: >
          Per-reading score per calculations.fermentation_health_index step 1,
          rounded to 2 decimals before it is weighted.
        constraints: "0.00 <= v <= 100.00, 2 decimals"

  # ---------------------------------------------------------------------------
  - name: ProductTank
    parent: null
    common_fields: true
    description: >
      A storage tank for neat ethanol, denaturant or finished denatured E100.
      Tanks are the safety choke point: an off-spec or mechanical hold on a
      tank propagates to blends, batches and shipments.
    fields:
      - name: tank_code
        type: string
        source: input
        description: Tank identifier such as T-101.
        constraints: non-empty, globally unique
      - name: product_type
        type: enum
        source: input
        description: What the tank holds.
        constraints: "ETHANOL_200_PROOF | DENATURANT | DENATURED_E100"
      - name: capacity_gallons
        type: number
        source: input
        description: Working capacity in gallons.
        constraints: "> 0, 2 decimals"
      - name: opening_gallons
        type: number
        source: input
        description: Gallons in the tank at creation.
        default: 0
        constraints: ">= 0 and <= capacity_gallons, 2 decimals"
      - name: settling_buffer_minutes
        type: integer
        source: input
        description: >
          Minutes appended to the end of every blend window on this tank
          before the occupancy interval is compared with other reservations.
        default: 120
        constraints: ">= 0"
      - name: service_status
        type: enum
        source: system
        description: Availability lifecycle.
        default: IN_SERVICE
        constraints: "IN_SERVICE | ON_HOLD | OUT_OF_SERVICE"
      - name: hold_reason
        type: enum
        source: system
        description: Why the tank is held; forks the hold transition's side effects.
        default: null
        constraints: "OFF_SPEC | MECHANICAL | null"
      - name: held_at
        type: datetime
        source: system
        description: Logical-clock instant the hold was placed.
        default: null
      - name: current_gallons
        type: number
        source: computed
        description: >
          opening_gallons plus every credited receipt minus every credited
          withdrawal, per calculations.tank_balance.
        default: 0
        constraints: 2 decimals, may not go negative (guarded by ERR_INSUFFICIENT_TANK_VOLUME)
      - name: available_gallons
        type: number
        source: computed
        description: capacity_gallons minus current_gallons, floored at 0.00.
        default: null
        constraints: 2 decimals

  # ---------------------------------------------------------------------------
  - name: DenaturantBlend
    parent: null
    common_fields: true
    description: >
      A scheduled and then executed blend that draws neat ethanol and
      denaturant into a finished E100 tank. Scheduling reserves an occupancy
      window on the destination tank and is the endpoint carrying the tank
      optimistic-concurrency rule.
    fields:
      - name: blend_code
        type: string
        source: input
        description: Blend identifier.
        constraints: non-empty, globally unique
      - name: neat_source_tank_id
        type: string
        source: input
        description: "FK -> ProductTank.id; source of neat 200-proof ethanol, product_type must be ETHANOL_200_PROOF."
      - name: denaturant_source_tank_id
        type: string
        source: input
        description: "FK -> ProductTank.id; source of denaturant, product_type must be DENATURANT."
      - name: destination_tank_id
        type: string
        source: input
        description: "FK -> ProductTank.id; finished-product tank, product_type must be DENATURED_E100; owns the occupancy window and the optimistic-concurrency version."
      - name: expected_destination_tank_version
        type: integer
        source: input
        description: >
          Caller's last-read ProductTank.version for destination_tank_id; see
          §1.2.1 rule blend-schedule-stale-tank.
        constraints: ">= 1"
      - name: neat_gallons
        type: number
        source: input
        description: Neat ethanol gallons to draw.
        constraints: "> 0, 2 decimals"
      - name: denaturant_gallons
        type: number
        source: input
        description: Denaturant gallons to draw.
        constraints: "> 0, 2 decimals"
      - name: window_start
        type: datetime
        source: input
        description: Start of the destination tank occupancy window, inclusive.
      - name: window_end
        type: datetime
        source: input
        description: End of the blend itself, before the settling buffer is appended.
        constraints: "> window_start"
      - name: occupancy_end
        type: datetime
        source: computed
        description: window_end plus destination tank settling_buffer_minutes; the closed interval end used for conflict detection.
      - name: status
        type: enum
        source: system
        description: Blend lifecycle.
        default: SCHEDULED
        constraints: "SCHEDULED | EXECUTED | CANCELLED"
      - name: output_gallons
        type: number
        source: computed
        description: neat_gallons plus denaturant_gallons; null until EXECUTED.
        default: null
        constraints: 2 decimals
      - name: denaturant_pct
        type: number
        source: computed
        description: >
          denaturant_gallons divided by output_gallons per
          calculations.denaturant_specification, 6 decimals.
        default: null
      - name: executed_at
        type: datetime
        source: system
        description: Logical-clock instant the blend was executed.
        default: null
      - name: cancelled_at
        type: datetime
        source: system
        description: Logical-clock instant the blend was cancelled.
        default: null

  # ---------------------------------------------------------------------------
  - name: LoadingTrack
    parent: null
    common_fields: true
    description: >
      A rail loading track with a spot capacity in railcars. Unlike tanks,
      tracks are shared: several shipments may hold overlapping windows as long
      as the aggregate committed railcars fit the spot capacity.
    fields:
      - name: track_code
        type: string
        source: input
        description: Track identifier such as TRK-A.
        constraints: non-empty, globally unique
      - name: spot_capacity
        type: integer
        source: input
        description: Maximum railcars that may be committed to overlapping windows on this track.
        constraints: "> 0"
      - name: loading_rate_cars_per_hour
        type: number
        source: input
        description: Nominal loading rate; informational only.
        default: 4.0
        constraints: "> 0, 1 decimal"
      - name: is_active
        type: boolean
        source: input
        description: When false the track accepts no new shipments.
        default: true
      - name: committed_railcars
        type: integer
        source: computed
        description: >
          Sum of UnitTrainShipment.railcar_count over shipments on this track
          with loading_status IN {SCHEDULED, BLOCKED, LOADED}; CANCELLED
          shipments release their railcars.
        default: 0

  # ---------------------------------------------------------------------------
  - name: UnitTrainShipment
    parent: null
    common_fields: true
    description: >
      A unit train of denatured E100 railcars loaded from a finished-product
      tank on a loading track. Two independent state dimensions run in
      parallel: loading_status tracks the physical move, billing_status tracks
      the paperwork.
    fields:
      - name: shipment_code
        type: string
        source: input
        description: Shipment identifier.
        constraints: non-empty, globally unique
      - name: track_id
        type: string
        source: input
        description: "FK -> LoadingTrack.id; owns the aggregate railcar capacity and the optimistic-concurrency version."
      - name: expected_track_version
        type: integer
        source: input
        description: >
          Caller's last-read LoadingTrack.version for track_id; see §1.2.1 rule
          shipment-schedule-stale-track.
        constraints: ">= 1"
      - name: source_tank_id
        type: string
        source: input
        description: "FK -> ProductTank.id; finished-product tank the train draws from, product_type must be DENATURED_E100."
      - name: destination_terminal
        type: string
        source: input
        description: Receiving terminal name.
        constraints: non-empty
      - name: railcar_count
        type: integer
        source: input
        description: Railcars committed to this shipment.
        constraints: "> 0"
      - name: gallons_per_railcar
        type: number
        source: input
        description: Nominal loaded gallons per railcar.
        constraints: "> 0, 2 decimals"
      - name: window_start
        type: datetime
        source: input
        description: Start of the track window, inclusive.
      - name: window_end
        type: datetime
        source: input
        description: End of the track window, exclusive.
        constraints: "> window_start"
      - name: price_cents_per_gallon
        type: number
        source: input
        description: Sale price of the denatured ethanol, cents per gallon.
        constraints: "> 0, 2 decimals"
      - name: loading_status
        type: enum
        source: system
        description: Physical dimension of the shipment lifecycle.
        default: SCHEDULED
        constraints: "SCHEDULED | BLOCKED | LOADED | CANCELLED"
      - name: billing_status
        type: enum
        source: system
        description: Paperwork dimension of the shipment lifecycle, independent of loading_status.
        default: PENDING_BOL
        constraints: "PENDING_BOL | BOL_ISSUED | INVOICED | VOIDED"
      - name: planned_gallons
        type: number
        source: computed
        description: railcar_count multiplied by gallons_per_railcar.
        constraints: 2 decimals
      - name: loaded_gallons
        type: number
        source: computed
        description: Gallons actually drawn from the source tank at load time; null until LOADED.
        default: null
        constraints: 2 decimals
      - name: invoice_amount_cents
        type: integer
        source: computed
        description: loaded_gallons multiplied by price_cents_per_gallon, integer cents; null until INVOICED.
        default: null
      - name: bol_number
        type: string
        source: system
        description: Bill of lading number assigned when the BOL is issued.
        default: null
      - name: bol_issued_at
        type: datetime
        source: system
        description: Logical-clock instant the BOL was issued.
        default: null
      - name: invoiced_at
        type: datetime
        source: system
        description: Logical-clock instant the shipment was invoiced.
        default: null
      - name: loaded_at
        type: datetime
        source: system
        description: Logical-clock instant loading completed.
        default: null
      - name: cancelled_at
        type: datetime
        source: system
        description: Logical-clock instant the shipment was cancelled.
        default: null

  # ---------------------------------------------------------------------------
  - name: CoProductSale
    parent: null
    common_fields: true
    description: >
      A quote-then-accept sale of distillers grains or corn oil. Index-priced
      quotes are re-struck against the plant's market marks at acceptance and
      then collared against the quoted price, which is the source of the
      settlement-price variant divergence.
    fields:
      - name: sale_code
        type: string
        source: input
        description: Sale identifier.
        constraints: non-empty, globally unique
      - name: buyer_name
        type: string
        source: input
        description: Counterparty name.
        constraints: non-empty
      - name: product
        type: enum
        source: input
        description: Co-product sold.
        constraints: "DDGS_DRY | DDGS_WET | CORN_OIL"
      - name: pricing_basis
        type: enum
        source: input
        description: FLAT fixes the price at quote; INDEX re-strikes it at acceptance.
        constraints: "FLAT | INDEX"
      - name: quantity
        type: number
        source: input
        description: Short tons for DDGS products, pounds for CORN_OIL.
        constraints: "> 0, 3 decimals"
      - name: quoted_price
        type: number
        source: input
        description: >
          Quoted unit price: USD per short ton for DDGS products, cents per
          pound for CORN_OIL. Required for FLAT; for INDEX it is computed at
          quote time from the marks and any input value is ignored.
        default: null
        constraints: "> 0, 2 decimals"
      - name: index_pct
        type: number
        source: input
        description: >
          Percentage of the reference mark used for INDEX pricing, expressed as
          a decimal fraction such as 0.92. Required when pricing_basis ==
          INDEX, must be null when FLAT.
        default: null
        constraints: "0.10 <= v <= 2.00, 4 decimals"
      - name: freight_rate_per_unit
        type: number
        source: input
        description: Freight charge per unit in USD (per ton or per pound) before the freight cap.
        default: 0
        constraints: ">= 0, 4 decimals"
      - name: quote_expires_at
        type: datetime
        source: input
        description: Instant after which the quote may no longer be accepted or declined.
      - name: status
        type: enum
        source: system
        description: Sale lifecycle.
        default: QUOTED
        constraints: "QUOTED | ACCEPTED | DECLINED | SHIPPED"
      - name: quote_reference_mark
        type: number
        source: computed
        description: Reference mark captured at quote time; null for FLAT sales.
        default: null
      - name: settlement_price
        type: number
        source: computed
        description: >
          Collared unit price fixed at acceptance per
          calculations.co_product_settlement_price; null while QUOTED.
        default: null
        constraints: 2 decimals
      - name: collar_floor
        type: number
        source: computed
        description: Lower collar bound derived from quoted_price; null for FLAT sales.
        default: null
      - name: collar_ceiling
        type: number
        source: computed
        description: Upper collar bound derived from quoted_price; null for FLAT sales.
        default: null
      - name: subtotal_usd
        type: number
        source: computed
        description: quantity multiplied by settlement_price, in USD; null until ACCEPTED.
        default: null
        constraints: 2 decimals
      - name: volume_rebate_usd
        type: number
        source: computed
        description: Rebate keyed on subtotal_usd per calculations.co_product_invoice.
        default: null
        constraints: 2 decimals
      - name: freight_usd
        type: number
        source: computed
        description: Capped freight charge per calculations.co_product_invoice.
        default: null
        constraints: 2 decimals
      - name: invoice_amount_cents
        type: integer
        source: computed
        description: Net invoice in integer cents; null until ACCEPTED.
        default: null
      - name: responded_at
        type: datetime
        source: system
        description: Logical-clock instant the quote was accepted or declined.
        default: null
      - name: shipped_at
        type: datetime
        source: system
        description: Logical-clock instant the sale shipped and inventory was relieved.
        default: null

  # ---------------------------------------------------------------------------
  - name: RinBatch
    parent: null
    common_fields: true
    description: >
      Renewable identification numbers generated from a completed fermentation
      batch, separated when the bill of lading for the outbound shipment is issued,
      and retired against an obligation. Cancelling the separating shipment
      reverts the batch to GENERATED, which is the compensating path.
    fields:
      - name: fermentation_batch_id
        type: string
        source: system
        description: "FK -> FermentationBatch.id; the batch whose completion generated these RINs."
      - name: rin_year
        type: integer
        source: system
        description: Compliance year, taken from the UTC year of the generating batch's completed_at.
      - name: d_code
        type: integer
        source: system
        description: RIN category; always 6 for corn ethanol under this pathway.
        default: 6
      - name: rin_eligible_gallons
        type: number
        source: computed
        description: Equivalence-value-adjusted gallons per calculations.rin_generation.
        constraints: 2 decimals
      - name: rin_count
        type: integer
        source: computed
        description: Whole RINs generated, floor of rin_eligible_gallons.
      - name: status
        type: enum
        source: system
        description: RIN lifecycle.
        default: GENERATED
        constraints: "GENERATED | SEPARATED | RETIRED"
      - name: separated_shipment_id
        type: string
        source: system
        description: "FK -> UnitTrainShipment.id; the shipment whose bill of lading separated these RINs; null while GENERATED and cleared when a cancel of that shipment reverts the separation."
        default: null
      - name: separated_at
        type: datetime
        source: system
        description: Logical-clock instant of separation; cleared on reversion.
        default: null
      - name: retired_at
        type: datetime
        source: system
        description: Logical-clock instant of retirement.
        default: null
      - name: retirement_reference
        type: string
        source: system
        description: Obligation reference recorded at retirement.
        default: null

  # ---------------------------------------------------------------------------
  - name: CarbonProject
    parent: null
    common_fields: true
    description: >
      A carbon-intensity reduction project submitted for third-party
      verification. Certified projects feed the plant CI waterfall in
      certification order; a project may declare a predecessor whose measured
      reduction it stacks on, which halves its credited contribution.
    fields:
      - name: project_code
        type: string
        source: input
        description: Project identifier.
        constraints: non-empty, globally unique
      - name: project_name
        type: string
        source: input
        description: Human-readable project title.
        constraints: non-empty
      - name: project_type
        type: enum
        source: input
        description: Reduction technology.
        constraints: "CARBON_CAPTURE | COMBINED_HEAT_POWER | CORN_OIL_EXTRACTION | LOW_TILL_FEEDSTOCK | PROCESS_HEAT_ELECTRIFICATION"
      - name: claimed_reduction_g_per_mj
        type: number
        source: input
        description: Claimed carbon intensity reduction in gCO2e/MJ.
        constraints: "> 0, 1 decimal"
      - name: capital_cost_cents
        type: integer
        source: input
        description: Capital cost of the project in integer cents.
        constraints: ">= 0"
      - name: predecessor_project_id
        type: string
        source: input
        description: "FK -> CarbonProject.id; optional prior project this one stacks on; when set, this project's credited reduction is halved."
        default: null
      - name: verification_status
        type: enum
        source: system
        description: Certification lifecycle; may cycle through RETURNED_FOR_REVISION.
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | RETURNED_FOR_REVISION | CERTIFIED"
      - name: certification_tier
        type: enum
        source: input
        description: >
          Verification depth the project is enrolled for, declared at
          registration; FULL credits the whole measured reduction, PROVISIONAL
          credits 70 percent of it.
        constraints: "FULL | PROVISIONAL"
      - name: verification_body
        type: string
        source: system
        description: Third-party verifier recorded when the project is submitted.
        default: null
        constraints: non-empty when set
      - name: verified_reduction_g_per_mj
        type: number
        source: system
        description: Reduction measured by the verifier at certification; may differ from the claim.
        default: null
        constraints: "> 0, 1 decimal"
      - name: credited_reduction_g_per_mj
        type: number
        source: computed
        description: >
          This project's contribution to the plant CI waterfall after tier
          haircut, stacking factor and the remaining headroom under the cap;
          recomputed for every certified project whenever the set changes.
        default: null
        constraints: 3 decimals
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent submission.
        default: null
      - name: reviewed_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent review decision.
        default: null
      - name: certified_at
        type: datetime
        source: system
        description: Logical-clock instant of certification; primary ordering key of the CI waterfall.
        default: null
      - name: revision_count
        type: integer
        source: computed
        description: Number of times this project has been returned for revision.
        default: 0
        constraints: "0 <= v <= 2"
      - name: review_note
        type: string
        source: system
        description: Verifier note from the most recent review decision.
        default: null

  # ---------------------------------------------------------------------------
  - name: HedgePosition
    parent: null
    common_fields: true
    description: >
      A futures position in corn, ethanol or natural gas used to lock crush
      margin. Positions can be closed in slices, so realized and unrealized
      profit and loss coexist on the same row.
    fields:
      - name: position_code
        type: string
        source: input
        description: Position identifier.
        constraints: non-empty, globally unique
      - name: commodity
        type: enum
        source: input
        description: Underlying commodity; determines the contract unit size and the mark used.
        constraints: "CORN | ETHANOL | NATGAS"
      - name: direction
        type: enum
        source: input
        description: LONG profits when the mark rises; SHORT profits when it falls.
        constraints: "LONG | SHORT"
      - name: contract_month
        type: string
        source: input
        description: Contract month, format YYYY-MM.
        constraints: "matches ^\\d{4}-(0[1-9]|1[0-2])$"
      - name: contracts
        type: integer
        source: input
        description: Number of futures contracts opened.
        constraints: "> 0"
      - name: entry_price
        type: number
        source: input
        description: >
          Entry price in the commodity's quoting unit: cents per bushel for
          CORN, cents per gallon for ETHANOL, cents per MMBtu for NATGAS.
        constraints: "> 0, 2 decimals"
      - name: status
        type: enum
        source: system
        description: Position lifecycle.
        default: OPEN
        constraints: "OPEN | PARTIALLY_CLOSED | CLOSED"
      - name: contracts_closed
        type: integer
        source: computed
        description: Cumulative contracts closed across all close actions.
        default: 0
      - name: contracts_open
        type: integer
        source: computed
        description: contracts minus contracts_closed.
        default: null
      - name: unit_size
        type: integer
        source: computed
        description: Units per contract from calculations.hedge_pnl constants — 5000, 29000 or 10000.
        default: null
      - name: realized_pnl_cents
        type: integer
        source: computed
        description: Cumulative realized profit and loss from closed slices, integer cents.
        default: 0
      - name: unrealized_pnl_cents
        type: integer
        source: computed
        description: >
          Mark-to-market profit and loss on contracts_open against the plant's
          current mark for this commodity; 0 when contracts_open is 0 or the
          mark is null.
        default: 0
      - name: opened_at
        type: datetime
        source: system
        description: Logical-clock instant the position was opened.
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant the last slice was closed; null unless status == CLOSED.
        default: null

  # ---------------------------------------------------------------------------
  - name: PermitCondition
    parent: null
    common_fields: true
    description: >
      One numeric limit from an air or water permit, evaluated as a rolling
      average over a declared averaging period. An exceedance restricts or
      curtails the plant depending on the condition's severity.
    fields:
      - name: condition_code
        type: string
        source: input
        description: Permit condition identifier.
        constraints: non-empty, globally unique
      - name: permit_type
        type: enum
        source: input
        description: Which permit the condition belongs to.
        constraints: "AIR_EMISSIONS | WATER_DISCHARGE"
      - name: parameter_name
        type: string
        source: input
        description: Monitored parameter such as VOC or TSS.
        constraints: non-empty
      - name: limit_value
        type: number
        source: input
        description: Permitted ceiling for the rolling average, in the condition's unit.
        constraints: "> 0, 3 decimals"
      - name: unit
        type: string
        source: input
        description: Measurement unit such as lb/hr or mg/L.
        constraints: non-empty
      - name: averaging_period_hours
        type: integer
        source: input
        description: >
          Length of the rolling window in hours. The window is
          (now - averaging_period_hours, now]: the start instant is exclusive.
        constraints: "> 0"
      - name: severity
        type: enum
        source: input
        description: >
          MINOR exceedances make the plant RESTRICTED; MAJOR exceedances make
          it CURTAILED; CRITICAL exceedances SUSPEND it.
        constraints: "MINOR | MAJOR | CRITICAL"
      - name: status
        type: enum
        source: system
        description: Compliance state; toggles both ways as readings arrive and deviations are resolved.
        default: COMPLIANT
        constraints: "COMPLIANT | EXCEEDANCE"
      - name: rolling_average_value
        type: number
        source: computed
        description: >
          Mean of the readings inside the current window per
          calculations.permit_rolling_average; null when the window is empty.
        default: null
        constraints: 3 decimals
      - name: readings_in_window
        type: integer
        source: computed
        description: Count of readings inside the current window.
        default: 0
      - name: exceedance_count
        type: integer
        source: computed
        description: Number of times this condition has entered EXCEEDANCE.
        default: 0
      - name: last_exceedance_at
        type: datetime
        source: system
        description: Logical-clock instant the condition last entered EXCEEDANCE.
        default: null
      - name: resolution_note
        type: string
        source: system
        description: Note recorded by the most recent deviation resolution.
        default: null

  # ---------------------------------------------------------------------------
  - name: PermitReading
    parent: PermitCondition
    common_fields: false
    description: >
      An immutable monitoring reading against a permit condition. Readings are
      append-only, carry no version and have no update endpoint; each append
      recomputes the condition's rolling average over the current window.
    fields:
      - name: id
        type: string
        source: system
        description: Server-assigned identifier.
      - name: created_at
        type: datetime
        source: system
        description: Logical-clock instant the reading was recorded.
      - name: condition_id
        type: string
        source: system
        description: "FK -> PermitCondition.id; taken from the creation path, never from the body."
      - name: measured_at
        type: datetime
        source: input
        description: Instant the sample was taken; the value compared against the rolling window bounds.
      - name: value
        type: number
        source: input
        description: Measured value in the condition's unit.
        constraints: ">= 0, 3 decimals"
      - name: sample_reference
        type: string
        source: input
        description: Lab or analyzer reference for the sample.
        default: null

# =============================================================================
# §1.2 STATE MACHINE TABLE
# Thirteen machines over eleven entities. Two entities carry parallel state
# dimensions that evolve independently on the same row: CornPurchaseContract
# (status x pricing_status) and UnitTrainShipment (loading_status x
# billing_status). Two machines are cyclic: FermentationBatch
# (FERMENTING <-> HEALTH_WATCH) and CarbonProject (SUBMITTED <->
# RETURNED_FOR_REVISION). PermitCondition and RinBatch also revert.
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  - entity: CornPurchaseContract
    state_field: status
    initial_state: OPEN
    terminal_states: [FILLED, ROLLED]
    note: >
      Fill dimension. Advanced only as a side effect of delivery settlement, or
      terminated early by a roll. Runs independently of pricing_status: an
      UNPRICED contract can never be filled because settlement requires
      pricing, but a PRICED contract may sit at OPEN indefinitely.
    transitions:
      - from: OPEN
        to: PARTIALLY_FILLED
        trigger: "POST /ethanol-ops/corn-deliveries/{id}/settle"
        actor: system
        preconditions:
          - "the settled delivery's contract_id references this contract"
          - "after the settlement, 0 < bushels_delivered < bushels_contracted"
        side_effects:
          - "recomputes CornPurchaseContract.bushels_delivered from the contract's SETTLED deliveries"
          - "leaves Plant.open_contract_coverage_bushels including this contract's remaining bushels"
          - "increments CornPurchaseContract.version by 1"
      - from: OPEN
        to: FILLED
        trigger: "POST /ethanol-ops/corn-deliveries/{id}/settle"
        actor: system
        preconditions:
          - "the settled delivery's contract_id references this contract"
          - "after the settlement, bushels_delivered >= bushels_contracted"
        side_effects:
          - "recomputes CornPurchaseContract.bushels_delivered"
          - "drops this contract out of the Plant.open_contract_coverage_bushels input set entirely, which may lower coverage below Plant.coverage_floor_bushels and flip Plant.procurement_posture to SHORT, which in turn lowers Plant.daily_grind_cap_bushels — the depth-3 cascade of §1.8 transitive_cascade instance settle_delivery_fills_contract_shrinks_coverage_flips_procurement_posture_and_grind_cap"
          - "increments CornPurchaseContract.version by 1"
      - from: PARTIALLY_FILLED
        to: FILLED
        trigger: "POST /ethanol-ops/corn-deliveries/{id}/settle"
        actor: system
        preconditions:
          - "the settled delivery's contract_id references this contract"
          - "after the settlement, bushels_delivered >= bushels_contracted"
        side_effects:
          - "recomputes CornPurchaseContract.bushels_delivered"
          - "drops this contract out of Plant.open_contract_coverage_bushels, re-deriving Plant.procurement_posture and Plant.daily_grind_cap_bushels"
          - "increments CornPurchaseContract.version by 1"
      - from: OPEN
        to: ROLLED
        trigger: "POST /ethanol-ops/corn-contracts/{id}/roll"
        actor: GrainBuyer
        preconditions:
          - "status IN {OPEN, PARTIALLY_FILLED}"
          - "bushels_contracted - bushels_delivered > 0"
          - "no CornDelivery on this contract has grading_status == PENDING_GRADE or GRADED"
        side_effects:
          - "creates a successor CornPurchaseContract with rolled_from_contract_id set to this contract, bushels_contracted equal to the unfilled remainder, basis_cents_per_bushel equal to this contract's basis plus roll_basis_adjustment_cents, pricing_status UNPRICED and status OPEN"
          - "re-derives Plant.open_contract_coverage_bushels (this contract leaves the set, the successor joins it) and therefore Plant.procurement_posture and Plant.daily_grind_cap_bushels"
          - "increments CornPurchaseContract.version by 1"
      - from: PARTIALLY_FILLED
        to: ROLLED
        trigger: "POST /ethanol-ops/corn-contracts/{id}/roll"
        actor: GrainBuyer
        preconditions:
          - "bushels_contracted - bushels_delivered > 0"
          - "no CornDelivery on this contract has grading_status == PENDING_GRADE or GRADED"
        side_effects:
          - "creates a successor CornPurchaseContract carrying the unfilled remainder, as above"
          - "re-derives Plant.open_contract_coverage_bushels, Plant.procurement_posture and Plant.daily_grind_cap_bushels"
          - "increments CornPurchaseContract.version by 1"

  # ---------------------------------------------------------------------------
  - entity: CornPurchaseContract
    state_field: pricing_status
    initial_state: UNPRICED
    terminal_states: [PRICED]
    note: >
      Pricing dimension, parallel to the fill dimension on the same row. The
      futures leg can be fixed at any point while the contract is OPEN or
      PARTIALLY_FILLED, and it is required before any of the contract's
      deliveries may be settled — the cross-dimension guard tested by §1.8
      cross_entity_state_dependency instance settle_requires_contract_priced.
    transitions:
      - from: UNPRICED
        to: PRICED
        trigger: "POST /ethanol-ops/corn-contracts/{id}/price"
        actor: GrainBuyer
        preconditions:
          - "pricing_status == UNPRICED"
          - "status IN {OPEN, PARTIALLY_FILLED}"
          - "futures_price_cents_per_bushel in the request body is > 0"
        side_effects:
          - "sets futures_price_cents_per_bushel and priced_at to the current logical clock"
          - "makes the contract's gross price (futures + basis) available to calculations.corn_delivery_settlement"
          - "increments CornPurchaseContract.version by 1"

  # ---------------------------------------------------------------------------
  - entity: CornDelivery
    state_field: grading_status
    initial_state: PENDING_GRADE
    terminal_states: [REJECTED, SETTLED]
    note: >
      Grading forks: a load whose aflatoxin or moisture breaches the inbound
      safety limits is auto-rejected and never priced, while a passing load is
      graded and carries its four discount components into settlement.
    transitions:
      - from: PENDING_GRADE
        to: GRADED
        trigger: "POST /ethanol-ops/corn-deliveries/{id}/grade"
        actor: ScaleOperator
        preconditions:
          - "grading_status == PENDING_GRADE"
          - "aflatoxin_ppb <= 20"
          - "moisture_pct <= 20.00"
        side_effects:
          - "stores moisture_pct, test_weight_lb_per_bu, foreign_material_pct, damaged_kernels_pct and aflatoxin_ppb"
          - "computes gross_wet_bushels, net_dry_bushels, the four discount components, discount_cents_per_bushel and net_price_cents_per_bushel per calculations.corn_delivery_settlement"
          - "records graded_by_user_id from the X-User-ID header, which the settlement segregation-of-duties check later compares against"
          - "increments CornDelivery.version by 1"
      - from: PENDING_GRADE
        to: REJECTED
        trigger: "POST /ethanol-ops/corn-deliveries/{id}/grade"
        actor: ScaleOperator
        preconditions:
          - "grading_status == PENDING_GRADE"
          - "aflatoxin_ppb > 20 OR moisture_pct > 20.00"
        side_effects:
          - "sets rejection_reason to AFLATOXIN_OVER_LIMIT when aflatoxin_ppb > 20, otherwise MOISTURE_OVER_LIMIT; the aflatoxin test is evaluated first so a load breaching both reports AFLATOXIN_OVER_LIMIT"
          - "leaves net_price_cents_per_bushel and settlement_amount_cents null — a rejected load is never priced"
          - "contributes nothing to CornPurchaseContract.bushels_delivered"
          - "increments CornDelivery.version by 1"
        note: >
          Auto-rejection is a successful 200 response on the grade endpoint, not
          an error: the load was legitimately graded and the grade is a
          rejection.
      - from: GRADED
        to: SETTLED
        trigger: "POST /ethanol-ops/corn-deliveries/{id}/settle"
        actor: GrainAccountant
        preconditions:
          - "grading_status == GRADED"
          - "the parent CornPurchaseContract has pricing_status == PRICED"
          - "the X-User-ID header differs from graded_by_user_id"
        side_effects:
          - "computes settlement_amount_cents from net_dry_bushels and net_price_cents_per_bushel"
          - "records settled_by_user_id and settled_at"
          - "adds net_dry_bushels to CornPurchaseContract.bushels_delivered, which may advance the contract's fill dimension to PARTIALLY_FILLED or FILLED"
          - "adds net_dry_bushels to Plant.corn_inventory_bushels"
          - "re-derives Plant.open_contract_coverage_bushels, then Plant.procurement_posture, then Plant.daily_grind_cap_bushels"
          - "increments CornDelivery.version by 1 and CornPurchaseContract.version by 1"

  # ---------------------------------------------------------------------------
  - entity: FermentationBatch
    state_field: status
    initial_state: CHARGED
    terminal_states: [COMPLETED, DUMPED]
    note: >
      Cyclic machine. Every appended health reading re-derives
      fermentation_health_index; crossing below 70.00 drops the batch into
      HEALTH_WATCH, and only an explicit intervention returns it to FERMENTING.
      At most two interventions are permitted, so a batch that keeps degrading
      must eventually be dumped. A batch in HEALTH_WATCH may not be distilled.
    transitions:
      - from: CHARGED
        to: FERMENTING
        trigger: "POST /ethanol-ops/fermentation-batches/{id}/health-readings"
        actor: ProcessOperator
        preconditions:
          - "status == CHARGED"
          - "the recomputed fermentation_health_index is >= 70.00"
        side_effects:
          - "creates an immutable FermentationHealthReading with its own reading_score"
          - "recomputes FermentationBatch.fermentation_health_index over the three most recent readings per calculations.fermentation_health_index"
          - "increments FermentationBatch.version by 1"
      - from: CHARGED
        to: HEALTH_WATCH
        trigger: "POST /ethanol-ops/fermentation-batches/{id}/health-readings"
        actor: ProcessOperator
        preconditions:
          - "status == CHARGED"
          - "the recomputed fermentation_health_index is < 70.00"
        side_effects:
          - "creates the reading and recomputes fermentation_health_index as above"
          - "increments FermentationBatch.version by 1"
      - from: FERMENTING
        to: FERMENTING
        trigger: "POST /ethanol-ops/fermentation-batches/{id}/health-readings"
        actor: ProcessOperator
        preconditions:
          - "status == FERMENTING"
          - "the recomputed fermentation_health_index is >= 70.00"
        side_effects:
          - "creates the reading and recomputes fermentation_health_index; the batch stays FERMENTING"
          - "increments FermentationBatch.version by 1"
        note: >
          A self-transition, not a no-op: the appended reading changes the
          three-reading window and therefore the index, which changes the yield
          the batch will realise at distillation.
      - from: FERMENTING
        to: HEALTH_WATCH
        trigger: "POST /ethanol-ops/fermentation-batches/{id}/health-readings"
        actor: ProcessOperator
        preconditions:
          - "status == FERMENTING"
          - "the recomputed fermentation_health_index is < 70.00 (strictly below; exactly 70.00 stays FERMENTING)"
        side_effects:
          - "creates the reading and recomputes fermentation_health_index"
          - "increments FermentationBatch.version by 1"
      - from: HEALTH_WATCH
        to: HEALTH_WATCH
        trigger: "POST /ethanol-ops/fermentation-batches/{id}/health-readings"
        actor: ProcessOperator
        preconditions:
          - "status == HEALTH_WATCH"
        side_effects:
          - "creates the reading and recomputes fermentation_health_index; the batch stays HEALTH_WATCH regardless of the new index"
          - "increments FermentationBatch.version by 1"
        note: >
          Recovery is never automatic. A batch leaves HEALTH_WATCH only through
          an intervention, even if a later reading lifts the index back above
          70.00.
      - from: HEALTH_WATCH
        to: FERMENTING
        trigger: "POST /ethanol-ops/fermentation-batches/{id}/intervene"
        actor: ProcessOperator
        preconditions:
          - "status == HEALTH_WATCH"
          - "intervention_count < 2"
        side_effects:
          - "increments intervention_count by 1"
          - "recomputes intervention_penalty_gal_per_bushel, permanently lowering the yield this batch can realise"
          - "increments FermentationBatch.version by 1"
      - from: FERMENTING
        to: DISTILLING
        trigger: "POST /ethanol-ops/fermentation-batches/{id}/distill"
        actor: ProcessOperator
        preconditions:
          - "status == FERMENTING"
          - "the destination ProductTank has service_status == IN_SERVICE"
          - "Plant.compliance_posture != SUSPENDED"
        side_effects:
          - "fixes starch_bonus_gal_per_bushel, health_penalty_gal_per_bushel, intervention_penalty_gal_per_bushel and effective_yield_gal_per_bushel per calculations.batch_yield"
          - "sets distillation_started_at"
          - "increments FermentationBatch.version by 1"
      - from: DISTILLING
        to: COMPLETED
        trigger: "POST /ethanol-ops/fermentation-batches/{id}/complete"
        actor: ProcessOperator
        preconditions:
          - "status == DISTILLING"
          - "the destination ProductTank has service_status == IN_SERVICE"
          - "the destination ProductTank has available_gallons >= the ethanol gallons this batch will produce"
        side_effects:
          - "computes ethanol_gallons_produced, ddgs_tons_produced and corn_oil_lbs_produced"
          - "credits ethanol_gallons_produced to the destination ProductTank.current_gallons and increments that tank's version by 1"
          - "adds ddgs_tons_produced to Plant.ddgs_inventory_tons and corn_oil_lbs_produced to Plant.corn_oil_inventory_lbs"
          - "re-derives Plant.rolling_yield_gal_per_bushel over COMPLETED batches"
          - "when Plant.rin_generation_enabled is true, creates one RinBatch with status GENERATED per calculations.rin_generation, which raises Plant.rin_generated_count"
          - "increments FermentationBatch.version by 1"
      - from: CHARGED
        to: DUMPED
        trigger: "POST /ethanol-ops/fermentation-batches/{id}/dump"
        actor: ProcessOperator
        preconditions:
          - "status IN {CHARGED, FERMENTING, HEALTH_WATCH}"
        side_effects:
          - "records dumped_at and dump_reason"
          - "leaves the charged corn consumed — Plant.corn_inventory_bushels is NOT restored"
          - "produces no ethanol, no co-product and no RinBatch"
          - "increments FermentationBatch.version by 1"
      - from: FERMENTING
        to: DUMPED
        trigger: "POST /ethanol-ops/fermentation-batches/{id}/dump"
        actor: ProcessOperator
        preconditions:
          - "status IN {CHARGED, FERMENTING, HEALTH_WATCH}"
        side_effects:
          - "records dumped_at and dump_reason; charged corn is not restored; no products or RINs are created"
          - "increments FermentationBatch.version by 1"
      - from: HEALTH_WATCH
        to: DUMPED
        trigger: "POST /ethanol-ops/fermentation-batches/{id}/dump"
        actor: ProcessOperator
        preconditions:
          - "status IN {CHARGED, FERMENTING, HEALTH_WATCH}"
        side_effects:
          - "records dumped_at and dump_reason; charged corn is not restored; no products or RINs are created"
          - "increments FermentationBatch.version by 1"
        note: >
          The escape hatch once both interventions are spent: a batch stuck in
          HEALTH_WATCH with intervention_count == 2 can only be dumped.

  # ---------------------------------------------------------------------------
  - entity: ProductTank
    state_field: service_status
    initial_state: IN_SERVICE
    terminal_states: []
    note: >
      Branching machine with divergent side-effect sets. A single hold endpoint
      forks on hold_reason: an OFF_SPEC hold is a quality event that blocks
      outbound movement and degrades the plant compliance posture, while a
      MECHANICAL hold is an equipment event that destroys the tank's scheduled
      work. Releasing either hold never resurrects what a MECHANICAL hold
      cancelled.
    transitions:
      - from: IN_SERVICE
        to: ON_HOLD
        trigger: "POST /ethanol-ops/product-tanks/{id}/hold with hold_reason == OFF_SPEC"
        actor: ProcessOperator
        preconditions:
          - "service_status == IN_SERVICE"
        side_effects:
          - "sets hold_reason to OFF_SPEC and held_at to the current logical clock"
          - "every UnitTrainShipment whose source_tank_id is this tank and whose loading_status == SCHEDULED moves to BLOCKED; its railcar_count REMAINS inside LoadingTrack.committed_railcars because the window is still reserved"
          - "re-derives Plant.compliance_posture — an OFF_SPEC hold contributes RESTRICTED — which lowers Plant.daily_grind_cap_bushels"
          - "SCHEDULED DenaturantBlend rows referencing this tank are left untouched"
          - "increments ProductTank.version by 1"
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "POST /ethanol-ops/product-tanks/{id}/hold with hold_reason == MECHANICAL"
        actor: ProcessOperator
        preconditions:
          - "service_status == IN_SERVICE"
        side_effects:
          - "sets hold_reason to MECHANICAL and held_at to the current logical clock"
          - "every DenaturantBlend with status == SCHEDULED that references this tank as neat_source_tank_id, denaturant_source_tank_id or destination_tank_id moves to CANCELLED, freeing its occupancy window on its destination tank"
          - "every UnitTrainShipment whose source_tank_id is this tank and whose loading_status == SCHEDULED moves to CANCELLED with billing_status VOIDED; that cancellation drops railcar_count out of LoadingTrack.committed_railcars, which frees aggregate spot capacity for later shipments — the depth-3 cascade of §1.8 transitive_cascade instance mechanical_tank_hold_cancels_shipment_which_releases_track_railcars"
          - "does NOT change Plant.compliance_posture — a MECHANICAL hold is an equipment event, not a compliance event"
          - "increments ProductTank.version by 1"
      - from: ON_HOLD
        to: IN_SERVICE
        trigger: "POST /ethanol-ops/product-tanks/{id}/release"
        actor: ProcessOperator
        preconditions:
          - "service_status IN {ON_HOLD, OUT_OF_SERVICE}"
        side_effects:
          - "clears hold_reason and held_at"
          - "every UnitTrainShipment whose source_tank_id is this tank and whose loading_status == BLOCKED returns to SCHEDULED"
          - "re-derives Plant.compliance_posture and Plant.daily_grind_cap_bushels"
          - "increments ProductTank.version by 1"
      - from: OUT_OF_SERVICE
        to: IN_SERVICE
        trigger: "POST /ethanol-ops/product-tanks/{id}/release"
        actor: ProcessOperator
        preconditions:
          - "service_status IN {ON_HOLD, OUT_OF_SERVICE}"
        side_effects:
          - "clears hold_reason and held_at"
          - "DenaturantBlend rows and UnitTrainShipment rows that the MECHANICAL hold cancelled stay CANCELLED — release is not a compensating action and never re-reserves a freed window or railcar"
          - "increments ProductTank.version by 1"

  # ---------------------------------------------------------------------------
  - entity: DenaturantBlend
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [EXECUTED, CANCELLED]
    note: >
      Scheduling reserves a closed occupancy interval on the destination tank
      (window_start through occupancy_end, settling buffer included); execution
      moves the liquid. Cancellation exists only as the downstream effect of a
      MECHANICAL tank hold — there is no manual cancel endpoint.
    transitions:
      - from: SCHEDULED
        to: EXECUTED
        trigger: "POST /ethanol-ops/denaturant-blends/{id}/execute"
        actor: ProcessOperator
        preconditions:
          - "status == SCHEDULED"
          - "all three referenced ProductTank rows have service_status == IN_SERVICE"
          - "neat_source_tank.current_gallons >= neat_gallons"
          - "denaturant_source_tank.current_gallons >= denaturant_gallons"
          - "destination_tank.available_gallons >= neat_gallons + denaturant_gallons"
          - "the resulting denaturant_pct lies inside the E100 specification band per calculations.denaturant_specification"
        side_effects:
          - "computes output_gallons and denaturant_pct"
          - "debits neat_gallons from the neat source tank and denaturant_gallons from the denaturant source tank, and credits output_gallons to the destination tank"
          - "increments the version of all three ProductTank rows by 1"
          - "sets executed_at and increments DenaturantBlend.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /ethanol-ops/product-tanks/{id}/hold with hold_reason == MECHANICAL on any referenced tank"
        actor: system
        preconditions:
          - "status == SCHEDULED"
          - "the held tank is this blend's neat_source_tank_id, denaturant_source_tank_id or destination_tank_id"
        side_effects:
          - "sets cancelled_at and releases the occupancy interval on the destination tank, so a later blend may reserve the same window"
          - "moves no liquid and changes no tank balance"
          - "increments DenaturantBlend.version by 1"

  # ---------------------------------------------------------------------------
  - entity: UnitTrainShipment
    state_field: loading_status
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    note: >
      Physical dimension, parallel to and independent of billing_status. A
      shipment can be BLOCKED and unblocked any number of times while its
      billing dimension stays at PENDING_BOL, and it can be LOADED while still
      PENDING_BOL.
    transitions:
      - from: SCHEDULED
        to: BLOCKED
        trigger: "POST /ethanol-ops/product-tanks/{id}/hold with hold_reason == OFF_SPEC on the source tank"
        actor: system
        preconditions:
          - "loading_status == SCHEDULED"
          - "the held tank is this shipment's source_tank_id"
        side_effects:
          - "railcar_count stays inside LoadingTrack.committed_railcars"
          - "billing_status is untouched"
          - "increments UnitTrainShipment.version by 1"
      - from: BLOCKED
        to: SCHEDULED
        trigger: "POST /ethanol-ops/product-tanks/{id}/release on the source tank"
        actor: system
        preconditions:
          - "loading_status == BLOCKED"
          - "the released tank is this shipment's source_tank_id"
        side_effects:
          - "increments UnitTrainShipment.version by 1"
      - from: SCHEDULED
        to: LOADED
        trigger: "POST /ethanol-ops/unit-train-shipments/{id}/load"
        actor: LogisticsCoordinator
        preconditions:
          - "loading_status == SCHEDULED"
          - "Plant.compliance_posture != SUSPENDED"
          - "the source ProductTank has service_status == IN_SERVICE"
          - "the source ProductTank has current_gallons >= planned_gallons"
        side_effects:
          - "sets loaded_gallons to planned_gallons and loaded_at to the current logical clock"
          - "debits loaded_gallons from the source ProductTank.current_gallons and increments that tank's version by 1"
          - "increments UnitTrainShipment.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /ethanol-ops/unit-train-shipments/{id}/cancel"
        actor: LogisticsCoordinator
        preconditions:
          - "loading_status IN {SCHEDULED, BLOCKED, LOADED}"
          - "billing_status != INVOICED"
        side_effects:
          - "sets cancelled_at, and moves billing_status to VOIDED"
          - "drops railcar_count out of LoadingTrack.committed_railcars"
          - "increments UnitTrainShipment.version by 1 and LoadingTrack.version by 1"
      - from: BLOCKED
        to: CANCELLED
        trigger: "POST /ethanol-ops/unit-train-shipments/{id}/cancel"
        actor: LogisticsCoordinator
        preconditions:
          - "loading_status IN {SCHEDULED, BLOCKED, LOADED}"
          - "billing_status != INVOICED"
        side_effects:
          - "sets cancelled_at, moves billing_status to VOIDED and releases the committed railcars"
          - "increments UnitTrainShipment.version by 1 and LoadingTrack.version by 1"
      - from: LOADED
        to: CANCELLED
        trigger: "POST /ethanol-ops/unit-train-shipments/{id}/cancel"
        actor: LogisticsCoordinator
        preconditions:
          - "loading_status IN {SCHEDULED, BLOCKED, LOADED}"
          - "billing_status != INVOICED"
        side_effects:
          - "credits loaded_gallons back to the source ProductTank.current_gallons and increments that tank's version by 1, restoring the plant-wide denatured-gallons invariant of §1.8 compensating_invariant instance shipment_cancel_restores_total_denatured_gallons_invariant"
          - "sets loaded_gallons back to null and cancelled_at to the current logical clock"
          - "drops railcar_count out of LoadingTrack.committed_railcars and increments LoadingTrack.version by 1"
          - "moves billing_status to VOIDED, which reverts any RIN separation this shipment performed"
          - "increments UnitTrainShipment.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /ethanol-ops/product-tanks/{id}/hold with hold_reason == MECHANICAL on the source tank"
        actor: system
        preconditions:
          - "loading_status == SCHEDULED"
          - "the held tank is this shipment's source_tank_id"
        side_effects:
          - "sets cancelled_at, moves billing_status to VOIDED and releases the committed railcars on the LoadingTrack"
          - "increments UnitTrainShipment.version by 1 and LoadingTrack.version by 1"

  # ---------------------------------------------------------------------------
  - entity: UnitTrainShipment
    state_field: billing_status
    initial_state: PENDING_BOL
    terminal_states: [INVOICED, VOIDED]
    note: >
      Paperwork dimension. Issuing the bill of lading is the moment RINs
      separate from the fuel; invoicing is the point of no return, because a
      shipment whose billing dimension has reached INVOICED can no longer be
      cancelled even though its loading dimension is still LOADED.
    transitions:
      - from: PENDING_BOL
        to: BOL_ISSUED
        trigger: "POST /ethanol-ops/unit-train-shipments/{id}/bill-of-lading"
        actor: LogisticsCoordinator
        preconditions:
          - "billing_status == PENDING_BOL"
          - "loading_status == LOADED"
        side_effects:
          - "records bol_number from the request body and bol_issued_at"
          - "separates RinBatch rows per calculations.rin_separation: each selected row moves GENERATED -> SEPARATED, records separated_shipment_id and separated_at, and raises Plant.rin_separated_count"
          - "increments UnitTrainShipment.version by 1 and the version of every separated RinBatch by 1"
      - from: BOL_ISSUED
        to: INVOICED
        trigger: "POST /ethanol-ops/unit-train-shipments/{id}/invoice"
        actor: LogisticsCoordinator
        preconditions:
          - "billing_status == BOL_ISSUED"
        side_effects:
          - "computes invoice_amount_cents as loaded_gallons multiplied by price_cents_per_gallon, rounded half up to integer cents"
          - "sets invoiced_at and locks the shipment against cancellation"
          - "increments UnitTrainShipment.version by 1"
      - from: PENDING_BOL
        to: VOIDED
        trigger: "POST /ethanol-ops/unit-train-shipments/{id}/cancel"
        actor: LogisticsCoordinator
        preconditions:
          - "billing_status IN {PENDING_BOL, BOL_ISSUED}"
        side_effects:
          - "leaves bol_number null; no RIN separation existed to revert"
          - "increments UnitTrainShipment.version by 1"
      - from: BOL_ISSUED
        to: VOIDED
        trigger: "POST /ethanol-ops/unit-train-shipments/{id}/cancel"
        actor: LogisticsCoordinator
        preconditions:
          - "billing_status IN {PENDING_BOL, BOL_ISSUED}"
        side_effects:
          - "every RinBatch whose separated_shipment_id is this shipment and whose status == SEPARATED reverts to GENERATED with separated_shipment_id and separated_at cleared, lowering Plant.rin_separated_count back to its pre-separation value while Plant.rin_generated_count is unchanged — §1.8 compensating_invariant instance shipment_cancel_preserves_rin_generated_count_invariant"
          - "increments the version of every reverted RinBatch by 1 and UnitTrainShipment.version by 1"
        note: >
          RinBatch rows already RETIRED are not reverted; retirement is
          terminal, which is why retirement requires a shipment that has
          reached INVOICED and can therefore never be cancelled.

  # ---------------------------------------------------------------------------
  - entity: CoProductSale
    state_field: status
    initial_state: QUOTED
    terminal_states: [DECLINED, SHIPPED]
    note: >
      Branching machine. The respond endpoint forks on the buyer's decision;
      the ACCEPTED branch fixes the settlement price and the invoice, while the
      DECLINED branch fixes nothing. Only the ACCEPTED branch can go on to
      relieve inventory.
    transitions:
      - from: QUOTED
        to: ACCEPTED
        trigger: "POST /ethanol-ops/co-product-sales/{id}/respond with decision == ACCEPT"
        actor: GrainBuyer
        preconditions:
          - "status == QUOTED"
          - "the current logical clock is <= quote_expires_at"
          - "for pricing_basis == INDEX, the reference mark for this product is not null on the Plant"
        side_effects:
          - "fixes settlement_price per calculations.co_product_settlement_price — for FLAT the quoted price, for INDEX the re-struck index price clamped into the collar derived from quoted_price"
          - "computes subtotal_usd, volume_rebate_usd, freight_usd and invoice_amount_cents per calculations.co_product_invoice"
          - "sets responded_at and increments CoProductSale.version by 1"
      - from: QUOTED
        to: DECLINED
        trigger: "POST /ethanol-ops/co-product-sales/{id}/respond with decision == DECLINE"
        actor: GrainBuyer
        preconditions:
          - "status == QUOTED"
          - "the current logical clock is <= quote_expires_at"
        side_effects:
          - "leaves settlement_price, subtotal_usd, volume_rebate_usd, freight_usd and invoice_amount_cents null"
          - "sets responded_at and increments CoProductSale.version by 1"
      - from: ACCEPTED
        to: SHIPPED
        trigger: "POST /ethanol-ops/co-product-sales/{id}/ship"
        actor: LogisticsCoordinator
        preconditions:
          - "status == ACCEPTED"
          - "for product IN {DDGS_DRY, DDGS_WET}, Plant.ddgs_inventory_tons >= quantity"
          - "for product == CORN_OIL, Plant.corn_oil_inventory_lbs >= quantity"
        side_effects:
          - "relieves quantity from Plant.ddgs_inventory_tons or Plant.corn_oil_inventory_lbs according to product"
          - "sets shipped_at and increments CoProductSale.version by 1"

  # ---------------------------------------------------------------------------
  - entity: RinBatch
    state_field: status
    initial_state: GENERATED
    terminal_states: [RETIRED]
    note: >
      Machine with a revert. Separation is driven entirely by the shipment
      billing dimension, and it is undone when that shipment is cancelled.
      Retirement is only reachable once the separating shipment has been
      invoiced, which is exactly the point at which the shipment can no longer
      be cancelled — so no RETIRED row can ever be orphaned by a revert.
    transitions:
      - from: GENERATED
        to: SEPARATED
        trigger: "POST /ethanol-ops/unit-train-shipments/{id}/bill-of-lading"
        actor: system
        preconditions:
          - "status == GENERATED"
          - "this row is selected by calculations.rin_separation for the shipment being billed"
        side_effects:
          - "records separated_shipment_id and separated_at"
          - "raises Plant.rin_separated_count by rin_count while leaving Plant.rin_generated_count unchanged"
          - "increments RinBatch.version by 1"
      - from: SEPARATED
        to: GENERATED
        trigger: "POST /ethanol-ops/unit-train-shipments/{id}/cancel"
        actor: system
        preconditions:
          - "status == SEPARATED"
          - "separated_shipment_id is the shipment being cancelled"
        side_effects:
          - "clears separated_shipment_id and separated_at"
          - "lowers Plant.rin_separated_count by rin_count while Plant.rin_generated_count is unchanged"
          - "increments RinBatch.version by 1"
      - from: SEPARATED
        to: RETIRED
        trigger: "POST /ethanol-ops/rin-batches/{id}/retire"
        actor: ComplianceOfficer
        preconditions:
          - "status == SEPARATED"
          - "the referenced separating UnitTrainShipment has billing_status == INVOICED"
        side_effects:
          - "records retirement_reference and retired_at"
          - "raises Plant.rin_retired_count by rin_count"
          - "increments RinBatch.version by 1"

  # ---------------------------------------------------------------------------
  - entity: CarbonProject
    state_field: verification_status
    initial_state: DRAFT
    terminal_states: [CERTIFIED]
    note: >
      Cyclic machine. A submission can be returned for revision and
      resubmitted, at most twice; a third return is impossible because the
      second return already exhausts revision_count. Certification is the only
      transition that changes the plant's carbon intensity.
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /ethanol-ops/carbon-projects/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "verification_status IN {DRAFT, RETURNED_FOR_REVISION}"
          - "when predecessor_project_id is set, that project has verification_status == CERTIFIED"
        side_effects:
          - "sets submitted_at to the current logical clock"
          - "increments CarbonProject.version by 1"
      - from: RETURNED_FOR_REVISION
        to: SUBMITTED
        trigger: "POST /ethanol-ops/carbon-projects/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "verification_status IN {DRAFT, RETURNED_FOR_REVISION}"
          - "revision_count <= 2"
          - "when predecessor_project_id is set, that project has verification_status == CERTIFIED"
        side_effects:
          - "sets submitted_at to the current logical clock, overwriting the previous submission instant"
          - "increments CarbonProject.version by 1"
      - from: SUBMITTED
        to: RETURNED_FOR_REVISION
        trigger: "POST /ethanol-ops/carbon-projects/{id}/review with determination == RETURN"
        actor: PlantManager
        preconditions:
          - "verification_status == SUBMITTED"
          - "revision_count < 2"
        side_effects:
          - "increments revision_count by 1 and records review_note and reviewed_at"
          - "increments CarbonProject.version by 1"
        note: >
          Once revision_count reaches 2 the reviewer can no longer return the
          project; the only remaining review decision is CERTIFY.
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /ethanol-ops/carbon-projects/{id}/review with determination == CERTIFY"
        actor: PlantManager
        preconditions:
          - "verification_status == SUBMITTED"
          - "the effective verified reduction (verified_reduction_g_per_mj from the request body when present, otherwise the stored claimed_reduction_g_per_mj) is > 0"
          - "the project's stored certification_tier is FULL or PROVISIONAL"
        side_effects:
          - "records verified_reduction_g_per_mj, certification_tier, review_note, reviewed_at and certified_at"
          - "re-runs calculations.plant_ci_score over every CERTIFIED project in certified_at order, rewriting credited_reduction_g_per_mj on all of them, then re-derives Plant.ci_score_g_per_mj and Plant.lcfs_credit_tonnes_per_million_gal"
          - "increments CarbonProject.version by 1"

  # ---------------------------------------------------------------------------
  - entity: HedgePosition
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    note: >
      Positions close in slices. Each close realises profit and loss on the
      slice at the close price and shrinks the mark-to-market exposure of the
      remainder, so a partially closed position carries both a realized and an
      unrealized number at once.
    transitions:
      - from: OPEN
        to: PARTIALLY_CLOSED
        trigger: "POST /ethanol-ops/hedge-positions/{id}/close"
        actor: RiskManager
        preconditions:
          - "status IN {OPEN, PARTIALLY_CLOSED}"
          - "0 < contracts_to_close < contracts_open"
        side_effects:
          - "adds contracts_to_close to contracts_closed and recomputes contracts_open"
          - "adds the slice's realized profit and loss to realized_pnl_cents per calculations.hedge_pnl"
          - "recomputes unrealized_pnl_cents over the smaller remaining position"
          - "increments HedgePosition.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /ethanol-ops/hedge-positions/{id}/close"
        actor: RiskManager
        preconditions:
          - "status IN {OPEN, PARTIALLY_CLOSED}"
          - "contracts_to_close == contracts_open"
        side_effects:
          - "sets contracts_closed to contracts, contracts_open to 0 and closed_at to the current logical clock"
          - "adds the final slice's realized profit and loss to realized_pnl_cents and sets unrealized_pnl_cents to 0"
          - "increments HedgePosition.version by 1"
      - from: PARTIALLY_CLOSED
        to: PARTIALLY_CLOSED
        trigger: "POST /ethanol-ops/hedge-positions/{id}/close"
        actor: RiskManager
        preconditions:
          - "status == PARTIALLY_CLOSED"
          - "0 < contracts_to_close < contracts_open"
        side_effects:
          - "accumulates realized profit and loss across slices and recomputes unrealized_pnl_cents"
          - "increments HedgePosition.version by 1"
      - from: PARTIALLY_CLOSED
        to: CLOSED
        trigger: "POST /ethanol-ops/hedge-positions/{id}/close"
        actor: RiskManager
        preconditions:
          - "status == PARTIALLY_CLOSED"
          - "contracts_to_close == contracts_open"
        side_effects:
          - "sets contracts_open to 0, closed_at to the current logical clock and unrealized_pnl_cents to 0"
          - "increments HedgePosition.version by 1"

  # ---------------------------------------------------------------------------
  - entity: PermitCondition
    state_field: status
    initial_state: COMPLIANT
    terminal_states: []
    note: >
      Toggling machine driven by the rolling average. Appending a reading can
      push the condition into EXCEEDANCE, and appending later clean readings
      does NOT clear it: an exceedance is cleared only by an explicit
      resolution, and only once the rolling average has actually come back
      inside the limit.
    transitions:
      - from: COMPLIANT
        to: EXCEEDANCE
        trigger: "POST /ethanol-ops/permit-conditions/{id}/readings"
        actor: ComplianceOfficer
        preconditions:
          - "status == COMPLIANT"
          - "after the append, rolling_average_value > limit_value (strictly greater; exactly equal stays COMPLIANT)"
        side_effects:
          - "creates an immutable PermitReading"
          - "recomputes rolling_average_value and readings_in_window per calculations.permit_rolling_average"
          - "increments exceedance_count by 1 and records last_exceedance_at"
          - "re-derives Plant.compliance_posture from this condition's severity — MINOR gives RESTRICTED, MAJOR gives CURTAILED, CRITICAL gives SUSPENDED — and therefore re-derives Plant.daily_grind_cap_bushels"
          - "increments PermitCondition.version by 1"
      - from: COMPLIANT
        to: COMPLIANT
        trigger: "POST /ethanol-ops/permit-conditions/{id}/readings"
        actor: ComplianceOfficer
        preconditions:
          - "status == COMPLIANT"
          - "after the append, rolling_average_value <= limit_value"
        side_effects:
          - "creates the reading and recomputes rolling_average_value and readings_in_window"
          - "increments PermitCondition.version by 1"
      - from: EXCEEDANCE
        to: EXCEEDANCE
        trigger: "POST /ethanol-ops/permit-conditions/{id}/readings"
        actor: ComplianceOfficer
        preconditions:
          - "status == EXCEEDANCE"
        side_effects:
          - "creates the reading and recomputes rolling_average_value and readings_in_window; the status stays EXCEEDANCE and exceedance_count is NOT incremented again"
          - "increments PermitCondition.version by 1"
      - from: EXCEEDANCE
        to: COMPLIANT
        trigger: "POST /ethanol-ops/permit-conditions/{id}/resolve-deviation"
        actor: ComplianceOfficer
        preconditions:
          - "status == EXCEEDANCE"
          - "rolling_average_value is not null and <= limit_value"
        side_effects:
          - "records resolution_note"
          - "re-derives Plant.compliance_posture over the remaining EXCEEDANCE conditions and OFF_SPEC tank holds, and therefore Plant.daily_grind_cap_bushels"
          - "increments PermitCondition.version by 1"

# =============================================================================
# §1.2.1 CONCURRENCY RULES
# Both rules are CREATE-with-reservation races on a shared resource: the
# creating request reserves an interval or a slice of capacity on a parent
# whose version the caller must have observed. A second sequential create
# carrying the same stale version is rejected with 412 even though its own
# interval arithmetic would otherwise pass.
# =============================================================================
concurrency_rules:
  - rule_id: blend-schedule-stale-tank
    parent_entity: ProductTank
    write_endpoint: "POST /ethanol-ops/denaturant-blends"
    occ_field: "expected_destination_tank_version"
    description: |
      Scheduling a DenaturantBlend against a destination ProductTank whose
      version has advanced since the caller last read it is rejected. The
      caller's occupancy view is stale: the tank may have received another
      reservation, a balance movement or a service-status change that its
      snapshot does not include, and a blend legitimately reserves a closed
      window on that tank, so the create cannot be allowed to proceed on an
      outdated version.
    error_id: ERR_STALE_TANK_VERSION
    http_status: 412

  - rule_id: shipment-schedule-stale-track
    parent_entity: LoadingTrack
    write_endpoint: "POST /ethanol-ops/unit-train-shipments"
    occ_field: "expected_track_version"
    description: |
      Scheduling a UnitTrainShipment against a LoadingTrack whose version has
      advanced since the caller last read it is rejected. The caller's view of
      committed_railcars is stale, and because a shipment legitimately commits
      a slice of the track's aggregate spot capacity, the create must be
      re-evaluated against a fresh version of the track rather than accepted on
      the caller's outdated capacity picture.
    error_id: ERR_STALE_TRACK_VERSION
    http_status: 412

# =============================================================================
# §1.3 CALCULATION RULES TABLE
# Eighteen rules. Two are dual-variant on different entity domains
# (crush_margin on the Plant, co_product_settlement_price on a CoProductSale).
# All money is integer cents at the boundary; all intermediate rounding is
# round_half_up. No calculation, ordering, tie-break or selector anywhere in
# this scaffold reads a random identifier: ordering keys are domain fields with
# created_at as the only fallback.
# =============================================================================
calculations:

  # ---------------------------------------------------------------------------
  - name: corn_delivery_settlement
    trigger: >
      Grading computes the bushel figures, the four discount components and the
      net price; settlement converts them into money.
    algorithm: threshold
    formula: |
      # --- Step 1: gross wet bushels -------------------------------------
      net_wet_lbs        = gross_weight_lbs - tare_weight_lbs
      gross_wet_bushels  = round_half_up(net_wet_lbs / LBS_PER_BUSHEL, 2)

      # --- Step 2: shrink to the 15.0% moisture dry basis -----------------
      # At exactly BASIS_MOISTURE_PCT the factor is 1 and no shrink applies.
      shrink_factor      = (100 - moisture_pct) / (100 - BASIS_MOISTURE_PCT)
      net_dry_bushels    = round_half_up(gross_wet_bushels * shrink_factor, 2)

      # --- Step 3: contract gross price ----------------------------------
      gross_price_cents  = contract.futures_price_cents_per_bushel
                         + contract.basis_cents_per_bushel

      # --- Step 4: four discount components, each on integer step counts --
      # Step counts are taken over integer hundredths / tenths, NEVER over
      # floating-point division of the decimal readings.
      m_h   = round_half_up(moisture_pct * 100, 0)              # hundredths
      tw_t  = round_half_up(test_weight_lb_per_bu * 10, 0)      # tenths
      fm_h  = round_half_up(foreign_material_pct * 100, 0)      # hundredths
      dk_h  = round_half_up(damaged_kernels_pct * 100, 0)       # hundredths

      moisture_steps = ceil(max(0, m_h  - 1500) / 50)   # per 0.50% over 15.00%
      tw_steps       = max(0, 540 - tw_t)               # per 0.1 lb under 54.0
      fm_steps       = max(0, fm_h - 300)               # per 0.01% over 3.00%
      dk_steps       = max(0, dk_h - 500)               # per 0.01% over 5.00%

      moisture_discount_cents         = round_half_up(moisture_steps * MOISTURE_RATE_CENTS, 2)
      test_weight_discount_cents      = round_half_up(tw_steps       * TEST_WEIGHT_RATE_CENTS, 2)
      foreign_material_discount_cents = round_half_up(fm_steps       * FM_RATE_CENTS, 2)
      damage_discount_cents           = round_half_up(dk_steps       * DAMAGE_RATE_CENTS, 2)

      # --- Step 5: net price and money ------------------------------------
      discount_cents_per_bushel  = moisture_discount_cents
                                 + test_weight_discount_cents
                                 + foreign_material_discount_cents
                                 + damage_discount_cents
      net_price_cents_per_bushel = max(0.00, gross_price_cents - discount_cents_per_bushel)
      settlement_amount_cents    = round_half_up(net_dry_bushels * net_price_cents_per_bushel, 0)
    input_set: >
      One CornDelivery and its parent CornPurchaseContract. The contract MUST
      have pricing_status == PRICED before settlement, because
      futures_price_cents_per_bushel is null while UNPRICED.
    constants:
      LBS_PER_BUSHEL: 56.0
      BASIS_MOISTURE_PCT: 15.0
      MOISTURE_STEP_PCT: 0.50
      MOISTURE_RATE_CENTS: 4.0
      TEST_WEIGHT_BASIS_LB: 54.0
      TEST_WEIGHT_RATE_CENTS: 0.35
      FM_TOLERANCE_PCT: 3.00
      FM_RATE_CENTS: 0.15
      DAMAGE_TOLERANCE_PCT: 5.00
      DAMAGE_RATE_CENTS: 0.08
      AFLATOXIN_LIMIT_PPB: 20
      MOISTURE_REJECT_PCT: 20.00
    precision: >
      Bushels 2 decimals, discount components and prices 2 decimals,
      settlement_amount_cents integer cents; round_half_up throughout.
    worked_example: |
      gross 80000 lb, tare 26000 lb, moisture 16.50%, test weight 53.2 lb/bu,
      foreign material 3.40%, damage 6.00%, futures 458.0c, basis -18.0c:
        gross_wet_bushels 964.29, net_dry_bushels 947.27, gross price 440.00c,
        discounts 12.00 / 2.80 / 6.00 / 8.00 = 28.80c,
        net_price 411.20c, settlement_amount_cents 389517.
      Boundary load (gross 78000, tare 26000, moisture 15.00, tw 54.0,
      fm 3.00, damage 5.00): gross_wet_bushels == net_dry_bushels == 928.57,
      all four discounts 0.00, net_price 440.00c, settlement 408571.

  # ---------------------------------------------------------------------------
  - name: fermentation_health_index
    trigger: >
      Recomputed on every appended FermentationHealthReading; the resulting
      index decides whether the batch drops into HEALTH_WATCH and how much
      yield the batch will realise at distillation.
    algorithm: weighted_scoring
    formula: |
      # --- Step 1: per-reading score, ROUNDED TO 2 DECIMALS FIRST --------
      # Each of the three penalty components is rounded to 2 decimals, then
      # capped, then subtracted; the resulting reading_score is persisted on
      # the FermentationHealthReading row.
      lactic_pen = min(LACTIC_CAP,
                       round_half_up(max(0, lactic_acid_ppm - LACTIC_THRESHOLD_PPM)
                                     * LACTIC_RATE, 2))
      acetic_pen = min(ACETIC_CAP,
                       round_half_up(max(0, acetic_acid_ppm - ACETIC_THRESHOLD_PPM)
                                     * ACETIC_RATE, 2))
      temp_dev   = max(0, temperature_c - TEMP_BAND_HIGH_C,
                          TEMP_BAND_LOW_C - temperature_c)
      # Leaving the band at all costs a fixed step penalty, plus a per-degree
      # rate on the excursion. Exactly at either band edge the deviation is 0
      # and the penalty is 0 — no step is charged.
      temp_pen   = 0 if temp_dev == 0 else
                   min(TEMP_CAP, round_half_up(TEMP_OUT_OF_BAND_STEP
                                               + temp_dev * TEMP_RATE_PER_C, 2))
      reading_score = round_half_up(clamp(100 - lactic_pen - acetic_pen - temp_pen,
                                          0, 100), 2)

      # --- Step 2: pick the window ---------------------------------------
      # The three most recent readings on the batch, ordered by hours_elapsed
      # DESC; ties on hours_elapsed break on created_at DESC. Fewer than three
      # readings use only the weights actually consumed.
      window  = first 3 readings of order_by(readings, hours_elapsed DESC, created_at DESC)
      weights = WEIGHTS[0 : len(window)]

      # --- Step 3: normalise, then weight the ROUNDED scores -------------
      # PINNED ROUNDING ORDER: the per-reading scores are rounded to 2
      # decimals (step 1) BEFORE they are weighted. Weighting the unrounded
      # raw scores and rounding only the final mean is a DIFFERENT, WRONG
      # answer and can differ by 0.01.
      norm_w  = [round_half_up(w / sum(weights), 6) for w in weights]
      index   = round_half_up(sum(norm_w[i] * window[i].reading_score
                                  for i in range(len(window))), 2)

      # --- Step 4: health gate --------------------------------------------
      # Strictly below the threshold. Exactly 70.00 is healthy.
      health_watch = index < HEALTH_WATCH_THRESHOLD
    input_set: >
      The at-most-three most recent FermentationHealthReading rows of one
      FermentationBatch. Readings on other batches are never mixed in. A batch
      with zero readings has index DEFAULT_INDEX.
    constants:
      LACTIC_THRESHOLD_PPM: 800
      LACTIC_RATE: 0.047
      LACTIC_CAP: 40
      ACETIC_THRESHOLD_PPM: 300
      ACETIC_RATE: 0.081
      ACETIC_CAP: 30
      TEMP_BAND_LOW_C: 30.0
      TEMP_BAND_HIGH_C: 35.0
      TEMP_OUT_OF_BAND_STEP: 9.75
      TEMP_RATE_PER_C: 3.9
      TEMP_CAP: 20
      WEIGHTS: [0.5, 0.3, 0.2]
      DEFAULT_INDEX: 100.00
      HEALTH_WATCH_THRESHOLD: 70.00
    precision: >
      Penalty components 2 decimals, reading_score 2 decimals, normalised
      weights 6 decimals, index 2 decimals; round_half_up throughout.
    worked_example: |
      Readings appended oldest-first as (lactic_ppm, acetic_ppm, temperature_c):
        (1163, 344, 35.4) -> reading_score 68.07, index 68.07
        (820,  361, 31.8) -> reading_score 94.12, index 84.35
        (1237, 552, 36.9) -> reading_score 41.89, index 62.80  -> HEALTH_WATCH
      The same three readings weighted as UNROUNDED raw scores
      (68.065 / 94.119 / 41.889) give 62.79 — one cent-equivalent apart, which
      is why the rounding order above is pinned.
      Exactly-at-threshold chain: (1367, 322, 35.0) -> 71.57,
      (870, 443, 29.0) -> 71.51, (1262, 421, 33.0) -> exactly 70.00, so the
      batch stays FERMENTING.

  # ---------------------------------------------------------------------------
  - name: batch_yield
    trigger: >
      effective_yield_gal_per_bushel is fixed when the batch enters DISTILLING;
      the product volumes are computed when it reaches COMPLETED.
    algorithm: threshold
    formula: |
      tw_t          = round_half_up(charge_test_weight_lb_per_bu * 10, 0)
      starch_bonus  = min(STARCH_BONUS_CAP,
                          round_half_up(max(0, tw_t - 540) * STARCH_RATE_PER_TENTH, 3))

      # Descending tier ladder on the batch's health index at distillation.
      health_penalty = 0.000  if fermentation_health_index >= 90.00 else
                       0.050  if fermentation_health_index >= 75.00 else
                       0.150  if fermentation_health_index >= 60.00 else
                       0.300

      intervention_penalty = min(INTERVENTION_PENALTY_CAP,
                                 round_half_up(intervention_count
                                               * INTERVENTION_RATE, 3))

      effective_yield = clamp(round_half_up(BASE_YIELD + starch_bonus
                                            - health_penalty
                                            - intervention_penalty, 3),
                              MIN_YIELD, MAX_YIELD)

      ethanol_gallons_produced = round_half_up(corn_bushels_charged * effective_yield, 2)
      ddgs_tons_produced       = round_half_up(corn_bushels_charged * DDGS_LBS_PER_BUSHEL
                                               / LBS_PER_TON, 3)
      corn_oil_lbs_produced    = round_half_up(corn_bushels_charged
                                               * CORN_OIL_LBS_PER_BUSHEL, 2)
    input_set: >
      One FermentationBatch. Its fermentation_health_index is read at the
      instant of the distill call, so readings appended after distillation
      starts do not change the yield.
    constants:
      BASE_YIELD: 2.850
      MIN_YIELD: 2.550
      MAX_YIELD: 3.050
      STARCH_RATE_PER_TENTH: 0.0015
      STARCH_BONUS_CAP: 0.090
      STARCH_BASIS_LB: 54.0
      INTERVENTION_RATE: 0.040
      INTERVENTION_PENALTY_CAP: 0.100
      DDGS_LBS_PER_BUSHEL: 17.0
      CORN_OIL_LBS_PER_BUSHEL: 0.600
      LBS_PER_TON: 2000
    precision: >
      Yield components and effective_yield 3 decimals, ethanol gallons 2
      decimals, DDGS tons 3 decimals, corn oil pounds 2 decimals;
      round_half_up throughout.
    worked_example: |
      90000.00 bushels, charge test weight 56.5 lb/bu, health index 92.50, no
      interventions: starch_bonus 0.038, health_penalty 0.000,
      intervention_penalty 0.000, effective_yield 2.888,
      ethanol 259920.00 gal, DDGS 765.000 tons, corn oil 54000.00 lb.
      Same charge after two interventions with health index 71.40:
      health_penalty 0.150, intervention_penalty 0.080,
      effective_yield 2.658, ethanol 239220.00 gal.

  # ---------------------------------------------------------------------------
  - name: rin_generation
    trigger: >
      Runs once when a FermentationBatch reaches COMPLETED, provided
      Plant.rin_generation_enabled is true.
    algorithm: aggregation
    formula: |
      # RINs are generated on the denatured-equivalent volume, so the neat
      # gallons are grossed up by the nominal denaturant fraction before the
      # D6 equivalence value is applied.
      rin_eligible_gallons = round_half_up(batch.ethanol_gallons_produced
                                           * DENATURANT_GROSS_UP
                                           * D6_EQUIVALENCE_VALUE, 2)
      rin_count            = floor(rin_eligible_gallons)   # whole RINs only
      rin_year             = UTC year of batch.completed_at
    input_set: >
      The single COMPLETED FermentationBatch being finalised. DUMPED batches
      generate nothing.
    constants:
      DENATURANT_GROSS_UP: 1.02
      D6_EQUIVALENCE_VALUE: 1.0
      D_CODE: 6
    precision: >
      rin_eligible_gallons 2 decimals round_half_up; rin_count is the FLOOR of
      that value, never a rounding of it.
    worked_example: |
      259920.00 neat gallons -> rin_eligible_gallons 265118.40 ->
      rin_count 265118 (the 0.40 fractional RIN is dropped, not rounded up).

  # ---------------------------------------------------------------------------
  - name: rin_separation
    trigger: >
      Runs when a shipment's bill of lading is issued; selects which GENERATED
      RinBatch rows separate onto that shipment.
    algorithm: chronological
    formula: |
      allowance  = floor(shipment.loaded_gallons)
      candidates = order_by(RinBatch where status == GENERATED,
                            created_at ASC,
                            generating_batch.batch_code ASC)
      running    = 0
      selected   = []
      for c in candidates:
          if running + c.rin_count <= allowance:
              selected.append(c)
              running += c.rin_count
          else:
              break        # GREEDY WITH STOP: do not skip and keep scanning
    input_set: >
      Every RinBatch with status == GENERATED, plant-wide. SEPARATED and
      RETIRED rows are excluded. A RinBatch is never split across shipments:
      either the whole row separates or none of it does.
    constants:
      SPLIT_ALLOWED: false
    precision: >
      allowance is an integer count of gallons; the comparison is on whole
      RINs.
    note: >
      The stop-at-first-misfit rule is deliberate and observable: a large
      earlier row that does not fit blocks every later row, even a small one
      that would have fitted. Skipping the misfit and continuing the scan is a
      different, wrong answer.
    worked_example: |
      One GENERATED RinBatch of 265118 RINs and a shipment with
      loaded_gallons 265900.00: allowance 265900, the row fits, it separates.
      With loaded_gallons 200000.00 the allowance is 200000, the row does not
      fit, and no RIN separates at all.

  # ---------------------------------------------------------------------------
  - name: denaturant_specification
    trigger: >
      Evaluated when a DenaturantBlend is executed; a blend outside the band is
      rejected and no liquid moves.
    algorithm: threshold
    formula: |
      output_gallons = round_half_up(neat_gallons + denaturant_gallons, 2)
      denaturant_pct = round_half_up(denaturant_gallons / output_gallons, 6)
      # Inclusive on both bounds: exactly at either edge the blend is on spec.
      in_spec        = DENATURANT_MIN_PCT <= denaturant_pct <= DENATURANT_MAX_PCT
    input_set: >
      One DenaturantBlend's own neat_gallons and denaturant_gallons.
    constants:
      DENATURANT_MIN_PCT: 0.019800
      DENATURANT_MAX_PCT: 0.029800
    precision: "denaturant_pct 6 decimals, gallons 2 decimals, round_half_up."
    worked_example: |
      neat 259920.00 gal + denaturant 5990.00 gal -> output 265910.00 gal,
      denaturant_pct 0.022526 -> on spec.
      neat 259920.00 + denaturant 4000.00 -> 0.015156 -> below the band,
      rejected.

  # ---------------------------------------------------------------------------
  - name: tank_balance
    trigger: >
      Re-derived on every movement that touches a tank: batch completion, blend
      execution, shipment load and shipment cancel.
    algorithm: aggregation
    formula: |
      current_gallons = opening_gallons
        + sum(FermentationBatch.ethanol_gallons_produced
              where destination_tank_id == tank.id and status == COMPLETED)
        + sum(DenaturantBlend.output_gallons
              where destination_tank_id == tank.id and status == EXECUTED)
        - sum(DenaturantBlend.neat_gallons
              where neat_source_tank_id == tank.id and status == EXECUTED)
        - sum(DenaturantBlend.denaturant_gallons
              where denaturant_source_tank_id == tank.id and status == EXECUTED)
        - sum(UnitTrainShipment.loaded_gallons
              where source_tank_id == tank.id and loading_status == LOADED)

      available_gallons = max(0.00, capacity_gallons - current_gallons)
    input_set: >
      Only terminal, effective movements count: COMPLETED batches, EXECUTED
      blends and LOADED shipments. A CANCELLED shipment has loading_status
      CANCELLED and loaded_gallons null, so it drops out of the debit set
      entirely — which is exactly how the cancel compensation restores the
      plant-wide gallons invariant without a separate reversal record.
    constants:
      FLOOR_GALLONS: 0.00
    precision: "2 decimals, round_half_up; current_gallons may never be negative."
    worked_example: |
      T-301 opens at 0.00, receives a 265910.00 gal blend, then a shipment
      loads 265900.00 gal: current 10.00. Cancelling that LOADED shipment
      returns current to 265910.00 — identical to the pre-load value.

  # ---------------------------------------------------------------------------
  - name: plant_ci_score
    trigger: >
      Re-run over every CERTIFIED CarbonProject whenever any project is
      certified; rewrites credited_reduction_g_per_mj on all of them and then
      the Plant's CI score and LCFS credit rate.
    algorithm: waterfall_allocation
    formula: |
      # Buckets fill in certification order until the plant-wide reduction cap
      # is exhausted; the project that straddles the cap is truncated and every
      # later project is credited 0.000.
      ordered   = order_by(CarbonProject where verification_status == CERTIFIED,
                           certified_at ASC, created_at ASC)
      remaining = REDUCTION_CAP_G_PER_MJ
      for p in ordered:
          tier_factor  = 1.00 if p.certification_tier == FULL else PROVISIONAL_HAIRCUT
          stack_factor = STACKED_FACTOR if p.predecessor_project_id is not null else 1.00
          raw          = round_half_up(p.verified_reduction_g_per_mj
                                       * tier_factor * stack_factor, 3)
          p.credited_reduction_g_per_mj = min(raw, remaining)
          remaining = round_half_up(remaining - p.credited_reduction_g_per_mj, 3)

      total_reduction = round_half_up(sum(p.credited_reduction_g_per_mj
                                          for p in ordered), 3)
      ci_score_g_per_mj = max(0.000, round_half_up(plant.baseline_ci_g_per_mj
                                                   - total_reduction, 3))

      # LCFS credits per million denatured gallons, in metric tonnes.
      lcfs_credit_tonnes_per_million_gal =
          round_half_up(max(0, LCFS_BENCHMARK_G_PER_MJ - ci_score_g_per_mj)
                        * ENERGY_DENSITY_MJ_PER_GAL * 1000000 / 1000000, 3)
    input_set: >
      CERTIFIED CarbonProject rows only. DRAFT, SUBMITTED and
      RETURNED_FOR_REVISION projects contribute nothing, and a project's
      claimed_reduction_g_per_mj never enters the waterfall — only the
      verifier's verified_reduction_g_per_mj does.
    constants:
      REDUCTION_CAP_G_PER_MJ: 12.0
      PROVISIONAL_HAIRCUT: 0.70
      STACKED_FACTOR: 0.50
      LCFS_BENCHMARK_G_PER_MJ: 79.75
      ENERGY_DENSITY_MJ_PER_GAL: 81.51
    precision: >
      Credited reductions, total reduction, CI score and the LCFS credit rate
      all 3 decimals, round_half_up.
    worked_example: |
      Baseline 60.0. Three projects certified in this order:
        P1 verified 8.0, FULL, no predecessor      -> credited 8.000
        P2 verified 6.0, PROVISIONAL, predecessor P1 -> 6.0*0.70*0.50 = 2.100
        P3 verified 5.0, FULL, no predecessor      -> raw 5.000 but only
                                                      1.900 of headroom remains
                                                      -> credited 1.900
      total_reduction 12.000, ci_score 48.000,
      lcfs_credit_tonnes_per_million_gal 2587.943.
      A fourth certified project would be credited 0.000.

  # ---------------------------------------------------------------------------
  - name: crush_margin
    trigger: >
      Computed on demand by GET /ethanol-ops/plants/{id}/crush-margin, which
      returns both variants side by side.
    algorithm: forward_looking
    formula: |
      # ---- shared legs ---------------------------------------------------
      natgas_cost_cents_per_bu = round_half_up(plant.mark_natgas_cents_per_mmbtu
                                               * NATGAS_MMBTU_PER_BUSHEL, 2)
      conversion_cost_cents_per_bu = CONVERSION_COST_CENTS_PER_BUSHEL

      # ---- MARK_TO_MARKET legs ------------------------------------------
      mtm_ethanol   = round_half_up(plant.mark_ethanol_cents_per_gallon
                                    * plant.rolling_yield_gal_per_bushel, 2)
      mtm_ddgs      = round_half_up(plant.mark_soybean_meal_usd_per_ton
                                    * DDGS_INDEX_PCT
                                    * DDGS_LBS_PER_BUSHEL / LBS_PER_TON * 100, 2)
      mtm_corn_oil  = round_half_up(plant.mark_sbo_cents_per_lb
                                    * CORN_OIL_INDEX_PCT
                                    * CORN_OIL_LBS_PER_BUSHEL, 2)
      mtm_corn_cost = plant.mark_corn_cents_per_bushel
      mtm_gross     = round_half_up(mtm_ethanol + mtm_ddgs + mtm_corn_oil, 2)
      mtm_net       = round_half_up(mtm_gross - mtm_corn_cost
                                    - natgas_cost_cents_per_bu
                                    - conversion_cost_cents_per_bu, 2)

      # ---- REALIZED legs -------------------------------------------------
      bushels_completed = sum(FermentationBatch.corn_bushels_charged
                              where status == COMPLETED)
      real_ethanol = round_half_up(sum(UnitTrainShipment.invoice_amount_cents
                                       where billing_status == INVOICED)
                                   / bushels_completed, 2)
      real_coprod  = round_half_up(sum(CoProductSale.invoice_amount_cents
                                       where status == SHIPPED)
                                   / bushels_completed, 2)
      # Volume-weighted actual purchase price, NOT the futures mark.
      real_corn    = round_half_up(sum(CornDelivery.net_dry_bushels
                                       * CornDelivery.net_price_cents_per_bushel
                                       where grading_status == SETTLED)
                                   / sum(CornDelivery.net_dry_bushels
                                         where grading_status == SETTLED), 2)
      real_net     = round_half_up(real_ethanol + real_coprod - real_corn
                                   - natgas_cost_cents_per_bu
                                   - conversion_cost_cents_per_bu, 2)
    input_set: >
      MARK_TO_MARKET reads only the Plant's posted marks and
      rolling_yield_gal_per_bushel. REALIZED reads only settled and invoiced
      history: INVOICED shipments, SHIPPED co-product sales and SETTLED
      deliveries. A VOIDED shipment, a merely ACCEPTED sale and a GRADED
      delivery are all invisible to REALIZED. When bushels_completed is 0 or
      any required mark is null, every REALIZED leg is 0.00.
    constants:
      NATGAS_MMBTU_PER_BUSHEL: 0.0800
      CONVERSION_COST_CENTS_PER_BUSHEL: 32.50
      DDGS_INDEX_PCT: 0.92
      CORN_OIL_INDEX_PCT: 0.80
      DDGS_LBS_PER_BUSHEL: 17.0
      CORN_OIL_LBS_PER_BUSHEL: 0.600
      LBS_PER_TON: 2000
    precision: "All legs and both nets 2 decimals in cents per bushel, round_half_up."
    variants:
      - name: MARK_TO_MARKET
        when: >
          The forward view. Always returned, and the only view available before
          any batch has completed or any shipment has been invoiced.
        difference: >
          Values the ethanol at mark_ethanol_cents_per_gallon multiplied by the
          plant's rolling yield, the co-products at the index marks, and the
          corn at mark_corn_cents_per_bushel — the futures mark, ignoring what
          the plant actually paid.
      - name: REALIZED
        when: >
          The backward view over closed transactions, returned alongside
          MARK_TO_MARKET in the same response.
        difference: >
          Values the ethanol at the invoiced cents of INVOICED shipments and
          the co-products at the invoiced cents of SHIPPED sales, both divided
          by the bushels actually ground, and costs the corn at the
          volume-weighted net_price_cents_per_bushel of SETTLED deliveries —
          which includes the quality discounts the marks know nothing about.
          The two nets differ for identical data.
    worked_example: |
      Marks: corn 440.00 c/bu, ethanol 178.00 c/gal, natgas 265.75 c/MMBtu,
      soybean meal 330.00 USD/ton, SBO 46.80 c/lb; rolling yield 2.888.
      MARK_TO_MARKET: ethanol 514.06, DDGS 258.06, corn oil 22.46,
        gross 794.58; corn 440.00, natgas 21.26, conversion 32.50,
        net 300.82.
      REALIZED over 90000.00 bushels ground, one INVOICED shipment of
      48260850 cents, one SHIPPED sale of 23866834 cents and one SETTLED
      delivery at 411.20 c/bu: ethanol 536.23, co-product 265.19,
      corn 411.20, natgas 21.26, conversion 32.50, net 336.46.
      Same plant, same instant, 35.64 c/bu apart.

  # ---------------------------------------------------------------------------
  - name: co_product_settlement_price
    trigger: >
      Fixed at the moment a CoProductSale is accepted; never recomputed
      afterwards, even if the marks move again before shipment.
    algorithm: threshold
    formula: |
      reference_mark = plant.mark_soybean_meal_usd_per_ton
                       if product IN {DDGS_DRY, DDGS_WET}
                       else plant.mark_sbo_cents_per_lb

      # At quote creation, an INDEX sale derives and stores its own
      # quoted_price and quote_reference_mark from the marks then in force;
      # any quoted_price supplied in the body is ignored.
      # at quote time:  quoted_price = round_half_up(reference_mark * index_pct, 2)

      # At acceptance:
      if pricing_basis == FLAT:
          settlement_price = quoted_price          # collar bounds stay null
      else:
          restruck     = round_half_up(reference_mark * index_pct, 2)
          collar_floor = round_half_up(quoted_price * (1 - COLLAR_PCT), 2)
          collar_ceil  = round_half_up(quoted_price * (1 + COLLAR_PCT), 2)
          settlement_price = clamp(restruck, collar_floor, collar_ceil)
    input_set: >
      One CoProductSale plus the Plant marks in force at the instant of
      acceptance. The collar is always derived from quoted_price, never from
      the re-struck price.
    constants:
      COLLAR_PCT: 0.075
    precision: "Prices and collar bounds 2 decimals, round_half_up."
    variants:
      - name: FLAT_QUOTE
        when: "pricing_basis == FLAT."
        difference: >
          The quoted price is the settlement price. Marks are irrelevant, no
          collar is computed, and collar_floor and collar_ceiling stay null
          even if the reference mark has moved far since the quote.
      - name: INDEX_RESTRIKE
        when: "pricing_basis == INDEX."
        difference: >
          The price is re-struck against the mark in force at acceptance and
          then clamped into a plus-or-minus-COLLAR_PCT collar around the
          ORIGINAL quoted price, so a mark rally beyond the collar is truncated
          at the ceiling. Two sales with the same quantity and the same quoted
          price settle at different prices under the two variants.
    worked_example: |
      INDEX DDGS_DRY sale, 750.000 tons, index_pct 0.92, quoted while the
      soybean meal mark was 330.00 (quoted_price 303.60), accepted after the
      mark moved to 362.50: restruck 333.50, collar 280.83 to 326.37,
      settlement_price 326.37 — the rally is truncated by 7.13 USD/ton.
      A FLAT sale quoted at 303.60 settles at 303.60 regardless.

  # ---------------------------------------------------------------------------
  - name: co_product_invoice
    trigger: "Runs immediately after co_product_settlement_price at acceptance."
    algorithm: tiered_pricing
    formula: |
      # unit_divisor converts the price unit into USD:
      #   DDGS_DRY / DDGS_WET -> settlement_price is USD per short ton  -> 1
      #   CORN_OIL            -> settlement_price is cents per pound    -> 100
      unit_divisor = 1 if product IN {DDGS_DRY, DDGS_WET} else 100
      subtotal_usd = round_half_up(quantity * settlement_price / unit_divisor, 2)

      # PINNED EVALUATION ORDER. The rebate tier is selected on subtotal_usd —
      # BEFORE the rebate itself and BEFORE freight are deducted. Selecting the
      # tier on the freight-net amount is a DIFFERENT, WRONG answer, and the
      # apparent circularity (the net depends on the rebate, the rebate tier
      # looks like it could depend on the net) is resolved here and only here.
      rebate_rate = REBATE_RATE_HIGH if subtotal_usd >= REBATE_TIER_HIGH_USD
                    else REBATE_RATE_LOW if subtotal_usd >= REBATE_TIER_LOW_USD
                    else 0.0000
      volume_rebate_usd = round_half_up(subtotal_usd * rebate_rate, 2)

      freight_usd = min(FREIGHT_CAP_USD,
                        round_half_up(quantity * freight_rate_per_unit, 2))

      net_invoice_usd      = round_half_up(subtotal_usd - volume_rebate_usd
                                          - freight_usd, 2)
      invoice_amount_cents = round_half_up(net_invoice_usd * 100, 0)
    input_set: >
      One ACCEPTED CoProductSale and its already-fixed settlement_price. Both
      tier thresholds are inclusive lower bounds, and the freight cap is
      inclusive — freight of exactly FREIGHT_CAP_USD is charged in full.
    constants:
      REBATE_TIER_LOW_USD: 20000.00
      REBATE_RATE_LOW: 0.0075
      REBATE_TIER_HIGH_USD: 50000.00
      REBATE_RATE_HIGH: 0.0150
      FREIGHT_CAP_USD: 2500.00
    precision: >
      USD amounts 2 decimals round_half_up; invoice_amount_cents integer cents.
    worked_example: |
      750.000 tons at 326.37 USD/ton with freight 3.25/ton:
        subtotal 244777.50 -> tier HIGH -> rebate 3671.66,
        freight 2437.50 (under the cap), net 238668.34,
        invoice_amount_cents 23866834.
      Tier-boundary and freight-cap case: 200.000 tons at 251.00 with freight
      12.50/ton: subtotal exactly 50200.00 -> tier HIGH -> rebate 753.00,
      freight exactly 2500.00 (at the cap, charged in full),
      net 46947.00, invoice_amount_cents 4694700.
      Keying the tier on the freight-net 47700.00 instead would select the LOW
      tier and produce 47323.50 / 4732350 — the wrong answer this rule pins out.

  # ---------------------------------------------------------------------------
  - name: hedge_pnl
    trigger: >
      realized_pnl_cents accumulates on every close; unrealized_pnl_cents is
      re-derived on every close and on every market-marks post.
    algorithm: aggregation
    formula: |
      unit_size = UNIT_SIZES[commodity]
      sign      = +1 if direction == LONG else -1

      # per close slice:
      slice_realized_cents = round_half_up(sign * (exit_price - entry_price)
                                           * unit_size * contracts_to_close, 0)
      realized_pnl_cents  += slice_realized_cents

      # on the remaining open contracts, against the plant's current mark:
      current_mark = plant.mark_corn_cents_per_bushel     if commodity == CORN
                     else plant.mark_ethanol_cents_per_gallon if commodity == ETHANOL
                     else plant.mark_natgas_cents_per_mmbtu
      unrealized_pnl_cents = 0 if contracts_open == 0 or current_mark is null
                             else round_half_up(sign * (current_mark - entry_price)
                                                * unit_size * contracts_open, 0)
    input_set: >
      One HedgePosition. The mark is read from the Plant at evaluation time, so
      posting new marks re-prices every OPEN and PARTIALLY_CLOSED position and
      leaves CLOSED positions untouched.
    constants:
      UNIT_SIZES:
        CORN: 5000
        ETHANOL: 29000
        NATGAS: 10000
    precision: "Integer cents, round_half_up; both figures may be negative."
    worked_example: |
      CORN LONG, 20 contracts at 450.00 c/bu, mark 440.00:
        unrealized -1000000 cents, realized 0.
      ETHANOL SHORT, 10 contracts at 182.00 c/gal, mark 178.00:
        unrealized +1160000; closing all 10 at 176.50 realises
        +1595000 and sets unrealized to 0.

  # ---------------------------------------------------------------------------
  - name: permit_rolling_average
    trigger: >
      Recomputed on every appended PermitReading and read again when a
      deviation resolution is attempted.
    algorithm: interval_merge
    formula: |
      now          = current logical clock
      window_start = now - averaging_period_hours hours

      # HALF-OPEN, START-EXCLUSIVE window: (window_start, now].
      # A reading whose measured_at equals window_start is OUTSIDE the window;
      # a reading whose measured_at equals now is INSIDE it.
      in_window    = [r for r in readings
                      if r.measured_at > window_start and r.measured_at <= now]
      readings_in_window   = len(in_window)
      rolling_average_value = null if readings_in_window == 0
                              else round_half_up(sum(r.value for r in in_window)
                                                 / readings_in_window, 3)

      # STRICTLY greater. A rolling average exactly equal to the limit is
      # compliant.
      exceedance = rolling_average_value is not null
                   and rolling_average_value > limit_value
    input_set: >
      PermitReading rows of one PermitCondition whose measured_at falls inside
      the start-exclusive window. Readings are never deleted, so the same row
      can drift out of the window purely because the logical clock advanced.
    constants:
      WINDOW_START_INCLUSIVE: false
      WINDOW_END_INCLUSIVE: true
    precision: "rolling_average_value 3 decimals, round_half_up."
    worked_example: |
      limit_value 12.500, averaging_period_hours 24, clock at
      2026-09-05T00:00:00Z so the window is (2026-09-04T00:00:00Z,
      2026-09-05T00:00:00Z]. Readings 13.000 and 12.400 inside the window give
      12.700 > 12.500 -> EXCEEDANCE. A third reading of 2.000 measured exactly
      at 2026-09-04T00:00:00Z is excluded; wrongly including it would give
      9.133 and no exceedance at all.

  # ---------------------------------------------------------------------------
  - name: plant_compliance_posture
    trigger: >
      Re-derived whenever a PermitCondition enters or leaves EXCEEDANCE and
      whenever a ProductTank takes or releases an OFF_SPEC hold.
    algorithm: aggregation
    formula: |
      LEVELS = {OPEN: 0, RESTRICTED: 1, CURTAILED: 2, SUSPENDED: 3}
      level  = 0
      for c in PermitCondition where status == EXCEEDANCE:
          level = max(level, 1 if c.severity == MINOR
                             else 2 if c.severity == MAJOR
                             else 3)
      for t in ProductTank where service_status == ON_HOLD
                             and hold_reason == OFF_SPEC:
          level = max(level, 1)
      compliance_posture = inverse(LEVELS)[level]
    input_set: >
      Every PermitCondition currently in EXCEEDANCE plus every ProductTank
      currently ON_HOLD for OFF_SPEC. A tank held for MECHANICAL reasons
      contributes nothing, and neither does a resolved exceedance — the
      historical exceedance_count is irrelevant to the posture.
    constants:
      OFF_SPEC_HOLD_LEVEL: RESTRICTED
      MINOR_LEVEL: RESTRICTED
      MAJOR_LEVEL: CURTAILED
      CRITICAL_LEVEL: SUSPENDED
    precision: "Enumerated; strictly worst-of, never additive."
    worked_example: |
      One MINOR condition in EXCEEDANCE and one tank ON_HOLD for OFF_SPEC:
      posture RESTRICTED (not doubled up). Add a MAJOR exceedance: CURTAILED.
      Resolve the MAJOR one while the MINOR one stands: back to RESTRICTED.

  # ---------------------------------------------------------------------------
  - name: daily_grind_cap
    trigger: >
      Re-derived whenever compliance_posture or procurement_posture changes.
    algorithm: threshold
    formula: |
      compliance_multiplier  = 1.00 if compliance_posture == OPEN
                               else 0.90 if compliance_posture == RESTRICTED
                               else 0.60 if compliance_posture == CURTAILED
                               else 0.00
      procurement_multiplier = 1.00 if procurement_posture == ADEQUATE else 0.75
      daily_grind_cap_bushels = floor(base_grind_cap_bushels
                                      * compliance_multiplier
                                      * procurement_multiplier)
    input_set: "The Plant's own two derived postures and its base_grind_cap_bushels."
    constants:
      OPEN_MULTIPLIER: 1.00
      RESTRICTED_MULTIPLIER: 0.90
      CURTAILED_MULTIPLIER: 0.60
      SUSPENDED_MULTIPLIER: 0.00
      ADEQUATE_MULTIPLIER: 1.00
      SHORT_MULTIPLIER: 0.75
    precision: >
      The two multipliers are applied to the base in one expression and the
      product is FLOORED to whole bushels — never rounded, and never floored
      after each multiplier separately.
    worked_example: |
      base 120000: OPEN + ADEQUATE -> 120000; OPEN + SHORT -> 90000;
      RESTRICTED + ADEQUATE -> 108000; CURTAILED + ADEQUATE -> 72000;
      SUSPENDED + anything -> 0.

  # ---------------------------------------------------------------------------
  - name: plant_inventory_and_coverage
    trigger: >
      Re-derived after delivery settlement, batch charge, batch completion,
      co-product shipment, contract roll and any contract fill advance.
    algorithm: aggregation
    formula: |
      corn_inventory_bushels =
          sum(CornDelivery.net_dry_bushels where grading_status == SETTLED)
        - sum(FermentationBatch.corn_bushels_charged
              where status IN {CHARGED, FERMENTING, HEALTH_WATCH,
                               DISTILLING, COMPLETED, DUMPED})

      ddgs_inventory_tons =
          sum(FermentationBatch.ddgs_tons_produced where status == COMPLETED)
        - sum(CoProductSale.quantity where status == SHIPPED
              and product IN {DDGS_DRY, DDGS_WET})

      corn_oil_inventory_lbs =
          sum(FermentationBatch.corn_oil_lbs_produced where status == COMPLETED)
        - sum(CoProductSale.quantity where status == SHIPPED
              and product == CORN_OIL)

      open_contract_coverage_bushels =
          sum(round_half_up(c.bushels_contracted - c.bushels_delivered, 2)
              for c in CornPurchaseContract
              where c.status IN {OPEN, PARTIALLY_FILLED})

      # Inclusive: coverage exactly equal to the floor is still ADEQUATE.
      procurement_posture = ADEQUATE
          if open_contract_coverage_bushels >= coverage_floor_bushels
          else SHORT

      rolling_yield_gal_per_bushel =
          DEFAULT_ROLLING_YIELD if no COMPLETED batch exists
          else round_half_up(sum(ethanol_gallons_produced where status == COMPLETED)
                             / sum(corn_bushels_charged where status == COMPLETED), 3)
    input_set: >
      Charged corn leaves inventory permanently: a DUMPED batch never returns
      its bushels. A FILLED or ROLLED contract leaves the coverage set entirely
      even though its unfilled remainder may be non-zero at the moment of a
      roll, because the successor contract carries that remainder instead.
    constants:
      DEFAULT_ROLLING_YIELD: 2.850
    precision: >
      Bushels and pounds 2 decimals, tons 3 decimals, rolling yield 3 decimals;
      round_half_up.
    worked_example: |
      coverage_floor_bushels 200000. Contract C-BIG is OPEN with 199500.00
      unfilled and contract C-1 is OPEN with 940.00 unfilled: coverage
      200440.00 >= 200000 -> ADEQUATE -> grind cap 120000. Settling a 940.00
      bushel delivery fills C-1, which drops it out of the set: coverage
      199500.00 -> SHORT -> grind cap 90000.

  # ---------------------------------------------------------------------------
  - name: track_capacity_commitment
    trigger: >
      Evaluated when a UnitTrainShipment is scheduled, and re-derived whenever
      any shipment on the track is cancelled.
    algorithm: interval_merge
    formula: |
      # HALF-OPEN INTERVALS [window_start, window_end): two windows overlap iff
      #   a.window_start < b.window_end AND b.window_start < a.window_end
      # Adjacency does NOT overlap: a window starting exactly when another ends
      # is a separate spot.
      overlapping = [s for s in shipments on this track
                     if s.loading_status IN {SCHEDULED, BLOCKED, LOADED}
                     and s.window_start < candidate.window_end
                     and candidate.window_start < s.window_end]
      committed   = sum(s.railcar_count for s in overlapping)
      # AGGREGATE capacity, inclusive: exactly at spot_capacity is accepted.
      accepted    = committed + candidate.railcar_count <= track.spot_capacity
    input_set: >
      Shipments on the same LoadingTrack with loading_status IN {SCHEDULED,
      BLOCKED, LOADED}. CANCELLED shipments release their railcars entirely and
      are excluded, which is what lets a MECHANICAL tank hold free capacity for
      a later shipment.
    constants:
      INTERVAL_SEMANTICS: half_open_start_inclusive_end_exclusive
      CAPACITY_BOUND_INCLUSIVE: true
    precision: "Whole railcars; instants compared at second resolution in UTC."
    worked_example: |
      TRK-A has spot_capacity 110. A 60-railcar shipment over
      [2026-09-05T06:00:00Z, 2026-09-05T12:00:00Z) and a 50-railcar shipment
      over [2026-09-05T08:00:00Z, 2026-09-05T14:00:00Z) total exactly 110 and
      are both accepted; one more railcar in an overlapping window is rejected.
      A 110-railcar shipment starting exactly at 2026-09-05T14:00:00Z overlaps
      nothing and is accepted.

  # ---------------------------------------------------------------------------
  - name: tank_occupancy_conflict
    trigger: >
      Evaluated when a DenaturantBlend is scheduled against a destination tank.
    algorithm: interval_merge
    formula: |
      occupancy_end = candidate.window_end
                      + destination_tank.settling_buffer_minutes minutes

      # CLOSED INTERVALS [window_start, occupancy_end] and EXCLUSIVE occupancy:
      # one reservation per tank at a time, so two windows conflict iff
      #   a.window_start <= b.occupancy_end AND b.window_start <= a.occupancy_end
      # TOUCHING ENDPOINTS DO CONFLICT — the opposite of the track's half-open
      # arithmetic, and on a different resource entity.
      conflict = any(b for b in DenaturantBlend
                     where b.destination_tank_id == candidate.destination_tank_id
                     and b.status == SCHEDULED
                     and b.window_start <= candidate.occupancy_end
                     and candidate.window_start <= b.occupancy_end)
    input_set: >
      SCHEDULED blends on the same destination tank. EXECUTED and CANCELLED
      blends release their window, so a MECHANICAL hold that cancels a blend
      immediately frees the interval it was holding.
    constants:
      INTERVAL_SEMANTICS: closed_both_ends_exclusive_occupancy
      BUFFER_APPLIED_TO: window_end
    precision: "Instants compared at second resolution in UTC."
    worked_example: |
      Tank T-301 has settling_buffer_minutes 120. A blend over
      [2026-09-04T08:00:00Z, 2026-09-04T12:00:00Z] occupies the tank through
      2026-09-04T14:00:00Z. A second blend starting exactly at
      2026-09-04T14:00:00Z CONFLICTS (closed intervals touch); starting at
      2026-09-04T14:01:00Z it does not.

# =============================================================================
# §1.4 VALIDATION RULES TABLE (ORDERED BY PRIORITY)
# Every priority is unique, so for any request that violates several rules the
# winning error_id is fully determined. Tier layout:
#   1-3    authentication and authorization
#   4      request shape
#   5-17   existence, path parameters left-to-right, then body foreign keys
#   18     segregation of duties (needs the resource loaded, so it sits here)
#   19-20  uniqueness
#   21-22  optimistic-concurrency version checks
#   23-36  state preconditions
#   37-40  safety and compliance
#   41-46  referential coherence
#   47-49  temporal
#   50-55  constraint and capacity
#   56-59  fiscal / inventory (checked last)
# The two priority-conflict pairs §1.8 targets are (26 state, 38 safety) on
# distill and (37 safety, 56 fiscal) on load.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty."
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the eight roles declared in §1.7."
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "The role in X-User-Role is listed in the called endpoint's roles."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 4
    category: request_shape
    check: >
      Request body conforms to the endpoint's input contract: every required
      field present, types correct, enum members recognised, numeric ranges and
      decimal precision respected, YYYY-MM month strings and ISO-8601 UTC
      instants well formed, window_end strictly after window_start,
      quantity/gallons/contracts strictly positive, index_pct present exactly
      when pricing_basis == INDEX and absent when it is FLAT, and unknown
      fields rejected.
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

  - priority: 5
    category: existence
    check: "The plant id in the path exists."
    error_id: ERR_PLANT_NOT_FOUND
    http_status: 404
    applies_to: "GET /plants/{id}, GET /plants/{id}/crush-margin, POST /plants/{id}/market-marks"

  - priority: 6
    category: existence
    check: >
      Every referenced CornPurchaseContract exists — the path id first, then
      rolled_from_contract_id filters.
    error_id: ERR_CONTRACT_NOT_FOUND
    http_status: 404
    applies_to: "all /corn-contracts/{id} paths and GET /corn-contracts filtered by rolled_from_contract_id"

  - priority: 7
    category: existence
    check: "The delivery id in the path exists."
    error_id: ERR_DELIVERY_NOT_FOUND
    http_status: 404
    applies_to: "all /corn-deliveries/{id} paths"

  - priority: 8
    category: existence
    check: "The fermentation batch id in the path or filter exists."
    error_id: ERR_BATCH_NOT_FOUND
    http_status: 404
    applies_to: "all /fermentation-batches/{id} paths and GET /rin-batches filtered by fermentation_batch_id"

  - priority: 9
    category: existence
    check: >
      Every referenced ProductTank exists: the path id first, then body
      references in the order destination_tank_id, neat_source_tank_id,
      denaturant_source_tank_id, source_tank_id.
    error_id: ERR_TANK_NOT_FOUND
    http_status: 404
    applies_to: "all /product-tanks/{id} paths, POST /denaturant-blends, POST /fermentation-batches, POST /unit-train-shipments"

  - priority: 10
    category: existence
    check: "The denaturant blend id in the path exists."
    error_id: ERR_BLEND_NOT_FOUND
    http_status: 404
    applies_to: "all /denaturant-blends/{id} paths"

  - priority: 11
    category: existence
    check: "The loading track referenced by the path id or by track_id exists."
    error_id: ERR_TRACK_NOT_FOUND
    http_status: 404
    applies_to: "GET /loading-tracks/{id}, POST /unit-train-shipments, GET /unit-train-shipments filtered by track_id"

  - priority: 12
    category: existence
    check: "The unit train shipment referenced by the path id or by separated_shipment_id exists."
    error_id: ERR_SHIPMENT_NOT_FOUND
    http_status: 404
    applies_to: "all /unit-train-shipments/{id} paths and GET /rin-batches filtered by separated_shipment_id"

  - priority: 13
    category: existence
    check: "The co-product sale id in the path exists."
    error_id: ERR_SALE_NOT_FOUND
    http_status: 404
    applies_to: "all /co-product-sales/{id} paths"

  - priority: 14
    category: existence
    check: "The RIN batch id in the path exists."
    error_id: ERR_RIN_BATCH_NOT_FOUND
    http_status: 404
    applies_to: "all /rin-batches/{id} paths"

  - priority: 15
    category: existence
    check: >
      Every referenced CarbonProject exists — the path id first, then
      predecessor_project_id in the create body and in list filters.
    error_id: ERR_CARBON_PROJECT_NOT_FOUND
    http_status: 404
    applies_to: "all /carbon-projects paths"

  - priority: 16
    category: existence
    check: "The hedge position id in the path exists."
    error_id: ERR_HEDGE_POSITION_NOT_FOUND
    http_status: 404
    applies_to: "all /hedge-positions/{id} paths"

  - priority: 17
    category: existence
    check: "The permit condition id in the path exists."
    error_id: ERR_PERMIT_CONDITION_NOT_FOUND
    http_status: 404
    applies_to: "all /permit-conditions/{id} paths"

  - priority: 18
    category: auth
    check: >
      The X-User-ID settling a delivery differs from the delivery's
      graded_by_user_id. One operator may not both grade and settle the same
      load, even though GrainAccountant is authorised for the endpoint.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /corn-deliveries/{id}/settle"

  - priority: 19
    category: business_constraint
    check: "No Plant row exists yet — the facility is a singleton."
    error_id: ERR_PLANT_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /plants"

  - priority: 20
    category: business_constraint
    check: >
      The business code supplied on a create is globally unused for its entity
      type: CornDelivery.ticket_number, FermentationBatch.batch_code,
      ProductTank.tank_code, DenaturantBlend.blend_code,
      LoadingTrack.track_code, UnitTrainShipment.shipment_code,
      CoProductSale.sale_code, CarbonProject.project_code,
      HedgePosition.position_code, PermitCondition.condition_code.
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "every create endpoint that accepts a business code"

  - priority: 21
    category: state
    check: >
      expected_destination_tank_version equals the current version of the
      destination ProductTank (§1.2.1 rule blend-schedule-stale-tank).
    error_id: ERR_STALE_TANK_VERSION
    http_status: 412
    applies_to: "POST /denaturant-blends"

  - priority: 22
    category: state
    check: >
      expected_track_version equals the current version of the referenced
      LoadingTrack (§1.2.1 rule shipment-schedule-stale-track).
    error_id: ERR_STALE_TRACK_VERSION
    http_status: 412
    applies_to: "POST /unit-train-shipments"

  - priority: 23
    category: state
    check: >
      The contract's status admits the action: OPEN or PARTIALLY_FILLED to
      price or to roll, and anything other than ROLLED to book a delivery,
      because a rolled contract's remainder now lives on its successor. A
      FILLED contract also refuses a delivery, but at priority 55 with the
      more specific ERR_CONTRACT_FULLY_DELIVERED.
    error_id: ERR_INVALID_CONTRACT_STATE
    http_status: 409
    applies_to: "POST /corn-contracts/{id}/price, POST /corn-contracts/{id}/roll, POST /corn-contracts/{id}/deliveries"

  - priority: 24
    category: state
    check: "The contract's pricing_status is UNPRICED — the futures leg is fixed once."
    error_id: ERR_CONTRACT_ALREADY_PRICED
    http_status: 409
    applies_to: "POST /corn-contracts/{id}/price"

  - priority: 25
    category: state
    check: >
      grading_status is PENDING_GRADE for a grade call and GRADED for a settle
      call. A REJECTED or already SETTLED load accepts neither.
    error_id: ERR_INVALID_DELIVERY_STATE
    http_status: 409
    applies_to: "POST /corn-deliveries/{id}/grade, POST /corn-deliveries/{id}/settle"

  - priority: 26
    category: state
    check: >
      The batch is in the state the action requires: CHARGED, FERMENTING or
      HEALTH_WATCH to append a reading or to dump; HEALTH_WATCH to intervene;
      FERMENTING to distill; DISTILLING to complete. COMPLETED and DUMPED are
      terminal and accept nothing.
    error_id: ERR_INVALID_BATCH_STATE
    http_status: 409
    applies_to: "POST /fermentation-batches/{id}/health-readings, .../intervene, .../distill, .../complete, .../dump"

  - priority: 27
    category: state
    check: >
      service_status is IN_SERVICE for a hold call, and ON_HOLD or
      OUT_OF_SERVICE for a release call.
    error_id: ERR_INVALID_TANK_STATE
    http_status: 409
    applies_to: "POST /product-tanks/{id}/hold, POST /product-tanks/{id}/release"

  - priority: 28
    category: state
    check: "The blend's status is SCHEDULED; an EXECUTED or CANCELLED blend cannot be executed."
    error_id: ERR_INVALID_BLEND_STATE
    http_status: 409
    applies_to: "POST /denaturant-blends/{id}/execute"

  - priority: 29
    category: state
    check: >
      The loading dimension permits the action: SCHEDULED to load, LOADED to
      issue a bill of lading, and SCHEDULED, BLOCKED or LOADED to cancel. A
      BLOCKED shipment cannot be loaded and a CANCELLED one accepts nothing.
    error_id: ERR_INVALID_SHIPMENT_LOADING_STATE
    http_status: 409
    applies_to: "POST /unit-train-shipments/{id}/load, .../bill-of-lading, .../cancel"

  - priority: 30
    category: state
    check: >
      The billing dimension permits the action: PENDING_BOL to issue a bill of
      lading, BOL_ISSUED to invoice.
    error_id: ERR_INVALID_SHIPMENT_BILLING_STATE
    http_status: 409
    applies_to: "POST /unit-train-shipments/{id}/bill-of-lading, POST /unit-train-shipments/{id}/invoice"

  - priority: 31
    category: state
    check: >
      billing_status is not INVOICED. Invoicing is the point of no return: the
      shipment can no longer be cancelled even though its loading dimension is
      still LOADED and would otherwise allow it.
    error_id: ERR_SHIPMENT_ALREADY_INVOICED
    http_status: 409
    applies_to: "POST /unit-train-shipments/{id}/cancel"

  - priority: 32
    category: state
    check: "status is QUOTED to respond and ACCEPTED to ship."
    error_id: ERR_INVALID_SALE_STATE
    http_status: 409
    applies_to: "POST /co-product-sales/{id}/respond, POST /co-product-sales/{id}/ship"

  - priority: 33
    category: state
    check: "The RIN batch status is SEPARATED; GENERATED cannot be retired and RETIRED is terminal."
    error_id: ERR_INVALID_RIN_STATE
    http_status: 409
    applies_to: "POST /rin-batches/{id}/retire"

  - priority: 34
    category: state
    check: >
      verification_status is DRAFT or RETURNED_FOR_REVISION to submit, and
      SUBMITTED to review. CERTIFIED is terminal.
    error_id: ERR_INVALID_PROJECT_STATE
    http_status: 409
    applies_to: "POST /carbon-projects/{id}/submit, POST /carbon-projects/{id}/review"

  - priority: 35
    category: state
    check: "The position's status is OPEN or PARTIALLY_CLOSED; a CLOSED position accepts no further close."
    error_id: ERR_INVALID_POSITION_STATE
    http_status: 409
    applies_to: "POST /hedge-positions/{id}/close"

  - priority: 36
    category: state
    check: "The permit condition's status is EXCEEDANCE; a COMPLIANT condition has no deviation to resolve."
    error_id: ERR_CONDITION_NOT_IN_EXCEEDANCE
    http_status: 409
    applies_to: "POST /permit-conditions/{id}/resolve-deviation"

  - priority: 37
    category: business_safety
    check: >
      Plant.compliance_posture is not SUSPENDED. A suspended plant may neither
      charge a new fermenter, nor start distillation, nor load a train.
    error_id: ERR_PLANT_SUSPENDED
    http_status: 422
    applies_to: "POST /fermentation-batches, POST /fermentation-batches/{id}/distill, POST /unit-train-shipments/{id}/load"

  - priority: 38
    category: business_safety
    check: >
      Every ProductTank the action touches has service_status == IN_SERVICE:
      the destination tank when charging, distilling or completing a batch, all
      three tanks when executing a blend, and the source tank when loading a
      train.
    error_id: ERR_TANK_NOT_IN_SERVICE
    http_status: 422
    applies_to: "POST /fermentation-batches, .../distill, .../complete, POST /denaturant-blends/{id}/execute, POST /unit-train-shipments/{id}/load"

  - priority: 39
    category: business_safety
    check: >
      The blend's denaturant_pct falls inside the inclusive E100 band
      0.019800 to 0.029800 per calculations.denaturant_specification.
    error_id: ERR_DENATURANT_SPEC_VIOLATION
    http_status: 422
    applies_to: "POST /denaturant-blends/{id}/execute"

  - priority: 40
    category: business_safety
    check: >
      corn_bushels_charged does not exceed Plant.daily_grind_cap_bushels, the
      cap already scaled by both postures.
    error_id: ERR_GRIND_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /fermentation-batches"

  - priority: 41
    category: business_referential
    check: >
      Each referenced tank's product_type matches its role:
      ETHANOL_200_PROOF for a batch destination and for a blend's
      neat_source_tank_id, DENATURANT for a blend's denaturant_source_tank_id,
      DENATURED_E100 for a blend's destination_tank_id and for a shipment's
      source_tank_id.
    error_id: ERR_TANK_PRODUCT_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /fermentation-batches, POST /denaturant-blends, POST /unit-train-shipments"

  - priority: 42
    category: business_referential
    check: >
      The delivery's parent contract has pricing_status == PRICED, so
      futures_price_cents_per_bushel is available to the settlement formula.
    error_id: ERR_CONTRACT_NOT_PRICED
    http_status: 422
    applies_to: "POST /corn-deliveries/{id}/settle"

  - priority: 43
    category: business_referential
    check: >
      When predecessor_project_id is set, that project has
      verification_status == CERTIFIED — a reduction can only stack on a
      certified one.
    error_id: ERR_PREDECESSOR_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /carbon-projects/{id}/submit"

  - priority: 44
    category: business_referential
    check: >
      The RIN batch's separating UnitTrainShipment has billing_status ==
      INVOICED. RINs separated onto a shipment that has not been invoiced yet
      cannot be retired, because that shipment could still be cancelled.
    error_id: ERR_SHIPMENT_NOT_INVOICED
    http_status: 422
    applies_to: "POST /rin-batches/{id}/retire"

  - priority: 45
    category: business_referential
    check: >
      The Plant marks required by the operation are not null: the reference
      mark for the sale's product when accepting an INDEX quote, and all five
      marks when reading the crush margin.
    error_id: ERR_MARKS_NOT_POSTED
    http_status: 422
    applies_to: "POST /co-product-sales/{id}/respond, GET /plants/{id}/crush-margin"

  - priority: 46
    category: business_referential
    check: >
      No CornDelivery on the contract has grading_status PENDING_GRADE or
      GRADED. Loads that are still in flight must be graded and settled or
      rejected before the remainder can be rolled.
    error_id: ERR_CONTRACT_HAS_OPEN_DELIVERIES
    http_status: 422
    applies_to: "POST /corn-contracts/{id}/roll"

  - priority: 47
    category: business_temporal
    check: >
      The current logical clock is at or before quote_expires_at. The bound is
      inclusive: a response landing exactly at the expiry instant is accepted.
    error_id: ERR_QUOTE_EXPIRED
    http_status: 422
    applies_to: "POST /co-product-sales/{id}/respond"

  - priority: 48
    category: business_temporal
    check: >
      The candidate occupancy interval does not collide with any SCHEDULED
      blend on the same destination tank per
      calculations.tank_occupancy_conflict — closed intervals, settling buffer
      included, touching endpoints conflict.
    error_id: ERR_TANK_OCCUPANCY_CONFLICT
    http_status: 422
    applies_to: "POST /denaturant-blends"

  - priority: 49
    category: business_temporal
    check: "The requested clock instant is strictly later than the current logical clock — re-posting the instant already in force is itself a regression."
    error_id: ERR_CLOCK_REGRESSION
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

  - priority: 50
    category: business_constraint
    check: >
      Committed railcars over the overlapping half-open windows plus this
      shipment's railcar_count is at most the track's spot_capacity per
      calculations.track_capacity_commitment. Exactly at capacity is accepted.
    error_id: ERR_TRACK_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /unit-train-shipments"

  - priority: 51
    category: business_constraint
    check: "The referenced LoadingTrack has is_active == true."
    error_id: ERR_TRACK_INACTIVE
    http_status: 422
    applies_to: "POST /unit-train-shipments"

  - priority: 52
    category: business_constraint
    check: "intervention_count is below 2 — a batch gets at most two interventions."
    error_id: ERR_INTERVENTION_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /fermentation-batches/{id}/intervene"

  - priority: 53
    category: business_constraint
    check: >
      revision_count is below 2 when the review decision is RETURN. Once two
      returns have been spent the only remaining decision is CERTIFY.
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /carbon-projects/{id}/review"

  - priority: 54
    category: business_constraint
    check: "contracts_to_close is at most contracts_open."
    error_id: ERR_CLOSE_EXCEEDS_OPEN_CONTRACTS
    http_status: 422
    applies_to: "POST /hedge-positions/{id}/close"

  - priority: 55
    category: business_constraint
    check: "A load is booked only against a contract that still has an unfilled remainder: bushels_contracted - bushels_delivered is strictly greater than 0. A FILLED contract takes no further deliveries, and a roll needs a remainder to carry forward."
    error_id: ERR_CONTRACT_FULLY_DELIVERED
    http_status: 422
    applies_to: "POST /corn-contracts/{id}/deliveries, POST /corn-contracts/{id}/roll"

  - priority: 56
    category: business_fiscal
    check: >
      Each source tank holds enough liquid: current_gallons >= neat_gallons on
      the neat source and >= denaturant_gallons on the denaturant source when
      executing a blend, and >= planned_gallons on the source tank when loading
      a train.
    error_id: ERR_INSUFFICIENT_TANK_VOLUME
    http_status: 422
    applies_to: "POST /denaturant-blends/{id}/execute, POST /unit-train-shipments/{id}/load"

  - priority: 57
    category: business_fiscal
    check: >
      The receiving tank has available_gallons >= the volume about to land:
      the batch's ethanol_gallons_produced on completion, or the blend's
      output_gallons on execution.
    error_id: ERR_INSUFFICIENT_TANK_CAPACITY
    http_status: 422
    applies_to: "POST /fermentation-batches/{id}/complete, POST /denaturant-blends/{id}/execute"

  - priority: 58
    category: business_fiscal
    check: "Plant.corn_inventory_bushels >= corn_bushels_charged."
    error_id: ERR_INSUFFICIENT_CORN_INVENTORY
    http_status: 422
    applies_to: "POST /fermentation-batches"

  - priority: 59
    category: business_fiscal
    check: >
      Plant.ddgs_inventory_tons >= quantity for a DDGS_DRY or DDGS_WET sale,
      Plant.corn_oil_inventory_lbs >= quantity for a CORN_OIL sale.
    error_id: ERR_INSUFFICIENT_COPRODUCT_INVENTORY
    http_status: 422
    applies_to: "POST /co-product-sales/{id}/ship"

# =============================================================================
# §1.5 API ENDPOINT TABLE
# 64 endpoints, all under api_prefix /ethanol-ops. Every single-resource read
# is exactly /ethanol-ops/<collection>/{id}. Reverse reachability for the 13
# foreign keys of §1.1 is provided by five sub-resource lists
# (corn-contracts/{id}/deliveries, fermentation-batches/{id}/health-readings,
# product-tanks/{id}/batches, product-tanks/{id}/denaturant-blends,
# permit-conditions/{id}/readings) and four filtered lists (corn-contracts,
# unit-train-shipments, rin-batches, carbon-projects).
# All writes are POST; nothing is mutated in place by PUT/PATCH and nothing is
# deleted, so every state change is an explicit, auditable action — the shape a
# compliance/audit archetype demands.
# =============================================================================
endpoints:

  # ---- Plant ----------------------------------------------------------------
  - method: POST
    path: "/ethanol-ops/plants"
    description: >
      Creates the singleton plant. A second call is rejected with
      ERR_PLANT_ALREADY_EXISTS.
    roles: [PlantManager]
    code: 201
    input: [name, nameplate_capacity_gallons, "base_grind_cap_bushels?", "coverage_floor_bushels?", "baseline_ci_g_per_mj?", "rin_generation_enabled?"]
    output: Plant
    side_effects:
      - "initialises every computed aggregate to its zero value, compliance_posture OPEN, ci_score_g_per_mj equal to baseline_ci_g_per_mj, lcfs_credit_tonnes_per_million_gal 0.000 and rolling_yield_gal_per_bushel 2.850"
      - "derives procurement_posture from the empty contract book, so it is SHORT whenever coverage_floor_bushels is greater than 0, and derives daily_grind_cap_bushels from both postures per calculations.daily_grind_cap — floor(base_grind_cap_bushels * 0.75) under a non-zero coverage floor"

  - method: GET
    path: "/ethanol-ops/plants/{id}"
    description: "Reads the plant with all derived aggregates and postures."
    roles: [PlantManager, GrainBuyer, ScaleOperator, GrainAccountant, ProcessOperator, LogisticsCoordinator, ComplianceOfficer, RiskManager]
    code: 200
    input: []
    output: Plant
    side_effects: []

  - method: POST
    path: "/ethanol-ops/plants/{id}/market-marks"
    description: >
      Posts the five market marks for a contract month. Replaces the previous
      marks wholesale.
    roles: [PlantManager, RiskManager]
    code: 200
    input: [marks_effective_month, mark_corn_cents_per_bushel, mark_ethanol_cents_per_gallon, mark_natgas_cents_per_mmbtu, mark_soybean_meal_usd_per_ton, mark_sbo_cents_per_lb]
    output: Plant
    side_effects:
      - "sets all five marks, marks_effective_month and marks_updated_at"
      - "re-derives unrealized_pnl_cents on every HedgePosition with status IN {OPEN, PARTIALLY_CLOSED} per calculations.hedge_pnl and increments each of their versions by 1"
      - "increments Plant.version by 1"

  - method: GET
    path: "/ethanol-ops/plants/{id}/crush-margin"
    description: >
      Computed read returning both crush-margin variants side by side per
      calculations.crush_margin. The payload carries rolling_yield,
      the shared natgas and conversion legs, then a mark_to_market object
      (ethanol_cents_per_bushel, ddgs_cents_per_bushel,
      corn_oil_cents_per_bushel, corn_cost_cents_per_bushel,
      gross_cents_per_bushel, net_cents_per_bushel) and a realized object
      (ethanol_cents_per_bushel, coproduct_cents_per_bushel,
      corn_cost_cents_per_bushel, net_cents_per_bushel), plus
      variant_delta_cents_per_bushel.
    roles: [PlantManager, RiskManager, GrainBuyer]
    code: 200
    input: []
    output: CrushMarginView
    side_effects: []

  # ---- CornPurchaseContract -------------------------------------------------
  - method: POST
    path: "/ethanol-ops/corn-contracts"
    description: "Opens a basis contract for a delivery month."
    roles: [GrainBuyer]
    code: 201
    input: [supplier_name, delivery_month, bushels_contracted, basis_cents_per_bushel]
    output: CornPurchaseContract
    side_effects:
      - "status OPEN, pricing_status UNPRICED, bushels_delivered 0"
      - "re-derives Plant.open_contract_coverage_bushels, Plant.procurement_posture and Plant.daily_grind_cap_bushels"

  - method: GET
    path: "/ethanol-ops/corn-contracts/{id}"
    description: "Reads one contract."
    roles: [PlantManager, GrainBuyer, GrainAccountant, ScaleOperator, RiskManager]
    code: 200
    input: []
    output: CornPurchaseContract
    side_effects: []

  - method: GET
    path: "/ethanol-ops/corn-contracts"
    description: >
      Filtered list of contracts. rolled_from_contract_id gives the reverse
      reachability of the self-referential roll edge; results are ordered by
      created_at ASC.
    roles: [PlantManager, GrainBuyer, GrainAccountant, RiskManager]
    code: 200
    input: ["status?", "delivery_month?", "pricing_status?", "rolled_from_contract_id?", "limit?", "offset?"]
    output: CornPurchaseContract[]
    side_effects: []

  - method: POST
    path: "/ethanol-ops/corn-contracts/{id}/price"
    description: "Fixes the futures leg, moving pricing_status to PRICED."
    roles: [GrainBuyer]
    code: 200
    input: [futures_price_cents_per_bushel]
    output: CornPurchaseContract
    side_effects:
      - "sets futures_price_cents_per_bushel, pricing_status PRICED and priced_at"
      - "increments CornPurchaseContract.version by 1"

  - method: POST
    path: "/ethanol-ops/corn-contracts/{id}/roll"
    description: >
      Rolls the unfilled remainder into a successor contract and terminates
      this one at ROLLED. Returns the newly created successor.
    roles: [GrainBuyer]
    code: 201
    input: [delivery_month, roll_basis_adjustment_cents]
    output: CornPurchaseContract
    side_effects:
      - "moves the source contract to ROLLED"
      - "creates the successor with rolled_from_contract_id set to the source, bushels_contracted equal to the unfilled remainder, basis equal to the source basis plus roll_basis_adjustment_cents, pricing_status UNPRICED and status OPEN"
      - "re-derives Plant.open_contract_coverage_bushels, Plant.procurement_posture and Plant.daily_grind_cap_bushels"
      - "increments the source CornPurchaseContract.version by 1"

  - method: GET
    path: "/ethanol-ops/corn-contracts/{id}/deliveries"
    description: >
      Sub-resource list of every delivery on the contract, ordered by
      created_at ASC. Reverse reachability for CornDelivery.contract_id.
    roles: [PlantManager, GrainBuyer, ScaleOperator, GrainAccountant]
    code: 200
    input: ["grading_status?"]
    output: CornDelivery[]
    side_effects: []

  # ---- CornDelivery ---------------------------------------------------------
  - method: POST
    path: "/ethanol-ops/corn-contracts/{id}/deliveries"
    description: "Records an inbound truck against the contract at PENDING_GRADE."
    roles: [ScaleOperator]
    code: 201
    input: [ticket_number, gross_weight_lbs, tare_weight_lbs]
    output: CornDelivery
    side_effects:
      - "sets contract_id from the path and grading_status PENDING_GRADE"

  - method: GET
    path: "/ethanol-ops/corn-deliveries/{id}"
    description: "Reads one delivery with its grading and settlement figures."
    roles: [PlantManager, GrainBuyer, ScaleOperator, GrainAccountant]
    code: 200
    input: []
    output: CornDelivery
    side_effects: []

  - method: POST
    path: "/ethanol-ops/corn-deliveries/{id}/grade"
    description: >
      Records the quality readings and computes the bushel and discount
      figures. Auto-rejects the load when the aflatoxin or moisture safety
      limit is breached.
    roles: [ScaleOperator]
    code: 200
    input: [moisture_pct, test_weight_lb_per_bu, foreign_material_pct, damaged_kernels_pct, aflatoxin_ppb]
    output: CornDelivery
    side_effects:
      - "computes gross_wet_bushels, net_dry_bushels, the four discount components, discount_cents_per_bushel and net_price_cents_per_bushel per calculations.corn_delivery_settlement"
      - "moves grading_status to GRADED, or to REJECTED with rejection_reason when a safety limit is breached"
      - "records graded_by_user_id from X-User-ID"
      - "increments CornDelivery.version by 1"

  - method: POST
    path: "/ethanol-ops/corn-deliveries/{id}/settle"
    description: >
      Settles a graded load. Must be performed by a different operator than the
      one who graded it.
    roles: [GrainAccountant]
    code: 200
    input: []
    output: CornDelivery
    side_effects:
      - "computes settlement_amount_cents and records settled_by_user_id and settled_at"
      - "adds net_dry_bushels to CornPurchaseContract.bushels_delivered, possibly advancing the contract to PARTIALLY_FILLED or FILLED, and increments that contract's version by 1"
      - "adds net_dry_bushels to Plant.corn_inventory_bushels"
      - "re-derives Plant.open_contract_coverage_bushels, then Plant.procurement_posture, then Plant.daily_grind_cap_bushels"
      - "increments CornDelivery.version by 1"

  # ---- FermentationBatch ----------------------------------------------------
  - method: POST
    path: "/ethanol-ops/fermentation-batches"
    description: >
      Charges a fermenter. Consumes corn inventory immediately and is gated by
      the plant's daily grind cap.
    roles: [ProcessOperator]
    code: 201
    input: [batch_code, corn_bushels_charged, charge_test_weight_lb_per_bu, destination_tank_id]
    output: FermentationBatch
    side_effects:
      - "status CHARGED, charged_at set to the current logical clock, intervention_count 0, fermentation_health_index 100.00"
      - "subtracts corn_bushels_charged from Plant.corn_inventory_bushels"

  - method: GET
    path: "/ethanol-ops/fermentation-batches/{id}"
    description: "Reads one batch with its health index, yield components and product volumes."
    roles: [PlantManager, ProcessOperator, ComplianceOfficer, RiskManager]
    code: 200
    input: []
    output: FermentationBatch
    side_effects: []

  - method: POST
    path: "/ethanol-ops/fermentation-batches/{id}/health-readings"
    description: >
      Appends an immutable lab reading and re-derives the batch health index,
      which may drop the batch into HEALTH_WATCH.
    roles: [ProcessOperator]
    code: 201
    input: [hours_elapsed, lactic_acid_ppm, acetic_acid_ppm, temperature_c]
    output: FermentationHealthReading
    side_effects:
      - "computes and stores reading_score per calculations.fermentation_health_index step 1"
      - "recomputes FermentationBatch.fermentation_health_index over the three most recent readings"
      - "moves the batch from CHARGED to FERMENTING or HEALTH_WATCH, or from FERMENTING to HEALTH_WATCH, according to the recomputed index"
      - "increments FermentationBatch.version by 1"

  - method: GET
    path: "/ethanol-ops/fermentation-batches/{id}/health-readings"
    description: >
      Sub-resource list of the batch's readings ordered by hours_elapsed DESC
      then created_at DESC — the same order the index calculation uses. Reverse
      reachability for FermentationHealthReading.batch_id.
    roles: [PlantManager, ProcessOperator, ComplianceOfficer]
    code: 200
    input: ["limit?"]
    output: FermentationHealthReading[]
    side_effects: []

  - method: POST
    path: "/ethanol-ops/fermentation-batches/{id}/intervene"
    description: >
      Applies a process intervention, returning a HEALTH_WATCH batch to
      FERMENTING at a permanent yield cost. At most two per batch.
    roles: [ProcessOperator]
    code: 200
    input: [intervention_note]
    output: FermentationBatch
    side_effects:
      - "increments intervention_count and recomputes intervention_penalty_gal_per_bushel"
      - "moves status to FERMENTING"
      - "increments FermentationBatch.version by 1"

  - method: POST
    path: "/ethanol-ops/fermentation-batches/{id}/distill"
    description: "Starts distillation and freezes the batch's yield components."
    roles: [ProcessOperator]
    code: 200
    input: []
    output: FermentationBatch
    side_effects:
      - "fixes starch_bonus_gal_per_bushel, health_penalty_gal_per_bushel, intervention_penalty_gal_per_bushel and effective_yield_gal_per_bushel per calculations.batch_yield"
      - "sets distillation_started_at and status DISTILLING"
      - "increments FermentationBatch.version by 1"

  - method: POST
    path: "/ethanol-ops/fermentation-batches/{id}/complete"
    description: >
      Completes the batch: fills the destination tank, books the co-products
      and generates RINs.
    roles: [ProcessOperator]
    code: 200
    input: []
    output: FermentationBatch
    side_effects:
      - "computes ethanol_gallons_produced, ddgs_tons_produced and corn_oil_lbs_produced"
      - "credits ethanol_gallons_produced to the destination ProductTank.current_gallons and increments that tank's version by 1"
      - "adds the co-product volumes to Plant.ddgs_inventory_tons and Plant.corn_oil_inventory_lbs and re-derives Plant.rolling_yield_gal_per_bushel"
      - "creates one RinBatch at GENERATED per calculations.rin_generation when Plant.rin_generation_enabled is true, raising Plant.rin_generated_count"
      - "sets completed_at and status COMPLETED, and increments FermentationBatch.version by 1"

  - method: POST
    path: "/ethanol-ops/fermentation-batches/{id}/dump"
    description: >
      Dumps the fermenter. The charged corn is not returned to inventory and no
      product or RIN is created.
    roles: [ProcessOperator]
    code: 200
    input: [dump_reason]
    output: FermentationBatch
    side_effects:
      - "sets dumped_at, dump_reason and status DUMPED"
      - "leaves Plant.corn_inventory_bushels unchanged — the bushels stay consumed"
      - "increments FermentationBatch.version by 1"

  # ---- ProductTank ----------------------------------------------------------
  - method: POST
    path: "/ethanol-ops/product-tanks"
    description: "Creates a storage tank with its opening balance and settling buffer."
    roles: [ProcessOperator]
    code: 201
    input: [tank_code, product_type, capacity_gallons, "opening_gallons?", "settling_buffer_minutes?"]
    output: ProductTank
    side_effects:
      - "service_status IN_SERVICE, current_gallons equal to opening_gallons, available_gallons derived"

  - method: GET
    path: "/ethanol-ops/product-tanks/{id}"
    description: "Reads one tank with its balance and service state."
    roles: [PlantManager, ProcessOperator, LogisticsCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: ProductTank
    side_effects: []

  - method: GET
    path: "/ethanol-ops/product-tanks/{id}/batches"
    description: >
      Sub-resource list of the batches destined for this tank, ordered by
      created_at ASC. Reverse reachability for
      FermentationBatch.destination_tank_id.
    roles: [PlantManager, ProcessOperator]
    code: 200
    input: ["status?"]
    output: FermentationBatch[]
    side_effects: []

  - method: GET
    path: "/ethanol-ops/product-tanks/{id}/denaturant-blends"
    description: >
      Sub-resource list of every blend that references this tank in any of its
      three roles, ordered by window_start ASC then created_at ASC. Reverse
      reachability for DenaturantBlend.neat_source_tank_id,
      DenaturantBlend.denaturant_source_tank_id and
      DenaturantBlend.destination_tank_id.
    roles: [PlantManager, ProcessOperator]
    code: 200
    input: ["status?", "tank_role?"]
    output: DenaturantBlend[]
    side_effects: []

  - method: POST
    path: "/ethanol-ops/product-tanks/{id}/hold"
    description: >
      Places a hold. hold_reason OFF_SPEC moves the tank to ON_HOLD, blocks its
      scheduled shipments and degrades the plant posture; hold_reason
      MECHANICAL moves it to OUT_OF_SERVICE and destroys its scheduled work.
    roles: [ProcessOperator]
    code: 200
    input: [hold_reason]
    output: ProductTank
    side_effects:
      - "sets hold_reason and held_at, and service_status ON_HOLD for OFF_SPEC or OUT_OF_SERVICE for MECHANICAL"
      - "OFF_SPEC: moves every SCHEDULED UnitTrainShipment on this source tank to BLOCKED (railcars stay committed) and re-derives Plant.compliance_posture and Plant.daily_grind_cap_bushels"
      - "MECHANICAL: cancels every SCHEDULED DenaturantBlend referencing this tank in any role, and cancels every SCHEDULED UnitTrainShipment on this source tank with billing_status VOIDED, which lowers LoadingTrack.committed_railcars and increments that track's version by 1"
      - "increments ProductTank.version by 1 and the version of every cascaded blend and shipment by 1"

  - method: POST
    path: "/ethanol-ops/product-tanks/{id}/release"
    description: >
      Releases a hold. Blocked shipments return to SCHEDULED; anything a
      MECHANICAL hold cancelled stays cancelled.
    roles: [ProcessOperator]
    code: 200
    input: []
    output: ProductTank
    side_effects:
      - "clears hold_reason and held_at and sets service_status IN_SERVICE"
      - "moves every BLOCKED UnitTrainShipment on this source tank back to SCHEDULED and increments each of their versions by 1"
      - "re-derives Plant.compliance_posture and Plant.daily_grind_cap_bushels"
      - "increments ProductTank.version by 1"

  # ---- DenaturantBlend ------------------------------------------------------
  - method: POST
    path: "/ethanol-ops/denaturant-blends"
    description: >
      Schedules a blend and reserves a closed occupancy window on the
      destination tank. Carries the §1.2.1 optimistic-concurrency check on that
      tank's version.
    roles: [ProcessOperator]
    code: 201
    input: [blend_code, neat_source_tank_id, denaturant_source_tank_id, destination_tank_id, expected_destination_tank_version, neat_gallons, denaturant_gallons, window_start, window_end]
    output: DenaturantBlend
    side_effects:
      - "computes occupancy_end as window_end plus the destination tank's settling_buffer_minutes and reserves the closed interval per calculations.tank_occupancy_conflict"
      - "status SCHEDULED"
      - "increments ProductTank.version by 1 on the destination tank"

  - method: GET
    path: "/ethanol-ops/denaturant-blends/{id}"
    description: "Reads one blend with its occupancy window and spec figures."
    roles: [PlantManager, ProcessOperator, LogisticsCoordinator]
    code: 200
    input: []
    output: DenaturantBlend
    side_effects: []

  - method: POST
    path: "/ethanol-ops/denaturant-blends/{id}/execute"
    description: "Executes the blend, moving liquid between the three tanks."
    roles: [ProcessOperator]
    code: 200
    input: []
    output: DenaturantBlend
    side_effects:
      - "computes output_gallons and denaturant_pct per calculations.denaturant_specification"
      - "debits both source tanks, credits the destination tank, and increments the version of all three ProductTank rows by 1"
      - "sets executed_at and status EXECUTED, and increments DenaturantBlend.version by 1"

  # ---- LoadingTrack ---------------------------------------------------------
  - method: POST
    path: "/ethanol-ops/loading-tracks"
    description: "Creates a rail loading track with an aggregate spot capacity."
    roles: [LogisticsCoordinator]
    code: 201
    input: [track_code, spot_capacity, "loading_rate_cars_per_hour?", "is_active?"]
    output: LoadingTrack
    side_effects:
      - "committed_railcars 0"

  - method: GET
    path: "/ethanol-ops/loading-tracks/{id}"
    description: "Reads one track with its currently committed railcars."
    roles: [PlantManager, LogisticsCoordinator]
    code: 200
    input: []
    output: LoadingTrack
    side_effects: []

  # ---- UnitTrainShipment ----------------------------------------------------
  - method: POST
    path: "/ethanol-ops/unit-train-shipments"
    description: >
      Schedules a unit train, committing railcars against the track's aggregate
      spot capacity over a half-open window. Carries the §1.2.1
      optimistic-concurrency check on the track's version.
    roles: [LogisticsCoordinator]
    code: 201
    input: [shipment_code, track_id, expected_track_version, source_tank_id, destination_terminal, railcar_count, gallons_per_railcar, window_start, window_end, price_cents_per_gallon]
    output: UnitTrainShipment
    side_effects:
      - "computes planned_gallons as railcar_count multiplied by gallons_per_railcar"
      - "loading_status SCHEDULED, billing_status PENDING_BOL"
      - "adds railcar_count to LoadingTrack.committed_railcars and increments LoadingTrack.version by 1"

  - method: GET
    path: "/ethanol-ops/unit-train-shipments/{id}"
    description: "Reads one shipment with both state dimensions and its money figures."
    roles: [PlantManager, LogisticsCoordinator, ComplianceOfficer, RiskManager]
    code: 200
    input: []
    output: UnitTrainShipment
    side_effects: []

  - method: GET
    path: "/ethanol-ops/unit-train-shipments"
    description: >
      Filtered list of shipments ordered by window_start ASC then created_at
      ASC. Reverse reachability for UnitTrainShipment.track_id and
      UnitTrainShipment.source_tank_id.
    roles: [PlantManager, LogisticsCoordinator, ComplianceOfficer]
    code: 200
    input: ["track_id?", "source_tank_id?", "loading_status?", "billing_status?", "limit?", "offset?"]
    output: UnitTrainShipment[]
    side_effects: []

  - method: POST
    path: "/ethanol-ops/unit-train-shipments/{id}/load"
    description: "Loads the train, drawing the planned gallons from the source tank."
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: UnitTrainShipment
    side_effects:
      - "sets loaded_gallons to planned_gallons and loaded_at, and loading_status LOADED"
      - "debits loaded_gallons from the source ProductTank and increments that tank's version by 1"
      - "increments UnitTrainShipment.version by 1"

  - method: POST
    path: "/ethanol-ops/unit-train-shipments/{id}/bill-of-lading"
    description: >
      Issues the bill of lading, which is the moment RINs separate from the
      fuel per calculations.rin_separation.
    roles: [LogisticsCoordinator]
    code: 200
    input: [bol_number]
    output: UnitTrainShipment
    side_effects:
      - "records bol_number and bol_issued_at and sets billing_status BOL_ISSUED"
      - "moves the selected GENERATED RinBatch rows to SEPARATED with separated_shipment_id and separated_at set, raising Plant.rin_separated_count, and increments each of their versions by 1"
      - "increments UnitTrainShipment.version by 1"

  - method: POST
    path: "/ethanol-ops/unit-train-shipments/{id}/invoice"
    description: >
      Invoices the shipment. After this the shipment can no longer be
      cancelled, which is what makes RIN retirement safe.
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: UnitTrainShipment
    side_effects:
      - "computes invoice_amount_cents from loaded_gallons and price_cents_per_gallon, sets invoiced_at and billing_status INVOICED"
      - "brings the shipment into the REALIZED leg of calculations.crush_margin"
      - "increments UnitTrainShipment.version by 1"

  - method: POST
    path: "/ethanol-ops/unit-train-shipments/{id}/cancel"
    description: >
      Cancels the shipment on both dimensions, restoring gallons, railcars and
      any RIN separation it performed. Rejected once the shipment is INVOICED.
    roles: [LogisticsCoordinator]
    code: 200
    input: [cancellation_reason]
    output: UnitTrainShipment
    side_effects:
      - "sets loading_status CANCELLED, billing_status VOIDED and cancelled_at"
      - "when the shipment was LOADED, credits loaded_gallons back to the source ProductTank, clears loaded_gallons and increments that tank's version by 1"
      - "drops railcar_count out of LoadingTrack.committed_railcars and increments LoadingTrack.version by 1"
      - "reverts every SEPARATED RinBatch on this shipment to GENERATED, clearing separated_shipment_id and separated_at, lowering Plant.rin_separated_count and incrementing each RinBatch.version by 1"
      - "increments UnitTrainShipment.version by 1"

  # ---- CoProductSale --------------------------------------------------------
  - method: POST
    path: "/ethanol-ops/co-product-sales"
    description: >
      Quotes a co-product sale. For pricing_basis INDEX the server derives
      quoted_price and quote_reference_mark from the marks in force and ignores
      any quoted_price in the body; for FLAT quoted_price is required.
    roles: [GrainBuyer]
    code: 201
    input: [sale_code, buyer_name, product, pricing_basis, quantity, "quoted_price?", "index_pct?", "freight_rate_per_unit?", quote_expires_at]
    output: CoProductSale
    side_effects:
      - "status QUOTED; for INDEX sales computes quoted_price and stores quote_reference_mark"

  - method: GET
    path: "/ethanol-ops/co-product-sales/{id}"
    description: "Reads one sale with its collar bounds and invoice figures."
    roles: [PlantManager, GrainBuyer, LogisticsCoordinator, RiskManager]
    code: 200
    input: []
    output: CoProductSale
    side_effects: []

  - method: GET
    path: "/ethanol-ops/co-product-sales"
    description: "Filtered list of sales ordered by created_at ASC."
    roles: [PlantManager, GrainBuyer, LogisticsCoordinator, RiskManager]
    code: 200
    input: ["product?", "status?", "pricing_basis?", "limit?", "offset?"]
    output: CoProductSale[]
    side_effects: []

  - method: POST
    path: "/ethanol-ops/co-product-sales/{id}/respond"
    description: >
      Records the buyer's decision. ACCEPT fixes the settlement price and the
      invoice; DECLINE fixes nothing.
    roles: [GrainBuyer]
    code: 200
    input: [decision]
    output: CoProductSale
    side_effects:
      - "on ACCEPT: fixes settlement_price, collar_floor, collar_ceiling, subtotal_usd, volume_rebate_usd, freight_usd and invoice_amount_cents per calculations.co_product_settlement_price and calculations.co_product_invoice, and sets status ACCEPTED"
      - "on DECLINE: sets status DECLINED and leaves every money field null"
      - "sets responded_at and increments CoProductSale.version by 1"

  - method: POST
    path: "/ethanol-ops/co-product-sales/{id}/ship"
    description: "Ships an accepted sale and relieves the co-product inventory."
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: CoProductSale
    side_effects:
      - "relieves quantity from Plant.ddgs_inventory_tons or Plant.corn_oil_inventory_lbs according to product"
      - "brings the sale into the REALIZED leg of calculations.crush_margin"
      - "sets shipped_at and status SHIPPED, and increments CoProductSale.version by 1"

  # ---- RinBatch -------------------------------------------------------------
  - method: GET
    path: "/ethanol-ops/rin-batches/{id}"
    description: "Reads one RIN batch."
    roles: [PlantManager, ComplianceOfficer, RiskManager]
    code: 200
    input: []
    output: RinBatch
    side_effects: []

  - method: GET
    path: "/ethanol-ops/rin-batches"
    description: >
      Filtered list of RIN batches ordered by created_at ASC. Reverse
      reachability for RinBatch.fermentation_batch_id and
      RinBatch.separated_shipment_id — and the only discovery channel for a
      RinBatch, which is always created as a cascade of batch completion and
      therefore never appears in a creation response.
    roles: [PlantManager, ComplianceOfficer, RiskManager]
    code: 200
    input: ["fermentation_batch_id?", "separated_shipment_id?", "status?", "rin_year?", "limit?", "offset?"]
    output: RinBatch[]
    side_effects: []

  - method: POST
    path: "/ethanol-ops/rin-batches/{id}/retire"
    description: >
      Retires separated RINs against an obligation. Only permitted once the
      separating shipment has been invoiced.
    roles: [ComplianceOfficer]
    code: 200
    input: [retirement_reference]
    output: RinBatch
    side_effects:
      - "records retirement_reference and retired_at and sets status RETIRED"
      - "raises Plant.rin_retired_count by rin_count"
      - "increments RinBatch.version by 1"

  # ---- CarbonProject --------------------------------------------------------
  - method: POST
    path: "/ethanol-ops/carbon-projects"
    description: >
      Registers a carbon intensity reduction project. A project that declares a
      predecessor_project_id is a stacked project and its claimed reduction is
      halved once certified.
    roles: [ComplianceOfficer]
    code: 201
    input: [project_code, project_name, project_type, claimed_reduction_g_per_mj, certification_tier, "capital_cost_cents?", "predecessor_project_id?"]
    output: CarbonProject
    side_effects:
      - "verification_status DRAFT, revision_count 0, certified_at null"

  - method: GET
    path: "/ethanol-ops/carbon-projects/{id}"
    description: "Reads one carbon project with its verification state and revision count."
    roles: [PlantManager, ComplianceOfficer, RiskManager]
    code: 200
    input: []
    output: CarbonProject
    side_effects: []

  - method: GET
    path: "/ethanol-ops/carbon-projects"
    description: >
      Filtered list of carbon projects ordered by created_at ASC. Reverse
      reachability for CarbonProject.predecessor_project_id.
    roles: [PlantManager, ComplianceOfficer, RiskManager]
    code: 200
    input: ["predecessor_project_id?", "verification_status?", "certification_tier?", "limit?", "offset?"]
    output: CarbonProject[]
    side_effects: []

  - method: POST
    path: "/ethanol-ops/carbon-projects/{id}/submit"
    description: >
      Submits a draft or revised project for third-party verification.
      Exclusive to ComplianceOfficer, the counterpart of the PlantManager-only
      review, which is how segregation of duties is enforced on certification.
    roles: [ComplianceOfficer]
    code: 200
    input: [verification_body]
    output: CarbonProject
    side_effects:
      - "records verification_body and submitted_at and sets verification_status SUBMITTED"
      - "increments CarbonProject.version by 1"

  - method: POST
    path: "/ethanol-ops/carbon-projects/{id}/review"
    description: >
      Records the verifier's determination. CERTIFY admits the project into the
      carbon intensity waterfall; RETURN sends it back for revision and is
      permitted at most twice.
    roles: [PlantManager]
    code: 200
    input: [determination, "verified_reduction_g_per_mj?", "review_note?"]
    output: CarbonProject
    side_effects:
      - "on CERTIFY: records verified_reduction_g_per_mj, defaulting to claimed_reduction_g_per_mj when the body omits it, sets certified_at and verification_status CERTIFIED, and admits the project to calculations.plant_ci_score, which recomputes Plant.ci_score_g_per_mj and Plant.lcfs_credit_tonnes_per_million_gal"
      - "on RETURN: raises revision_count by 1 and sets verification_status RETURNED_FOR_REVISION"
      - "increments CarbonProject.version by 1"

  # ---- HedgePosition --------------------------------------------------------
  - method: POST
    path: "/ethanol-ops/hedge-positions"
    description: >
      Opens a futures position on corn, ethanol or natural gas. A short corn
      position may not exceed the plant's open physical corn commitments.
    roles: [RiskManager]
    code: 201
    input: [position_code, commodity, direction, contracts, entry_price, contract_month]
    output: HedgePosition
    side_effects:
      - "status OPEN, contracts_open equal to contracts, contracts_closed 0, realized_pnl_cents 0, and unit_size fixed from the commodity"

  - method: GET
    path: "/ethanol-ops/hedge-positions/{id}"
    description: "Reads one position with its realized and unrealized results."
    roles: [PlantManager, RiskManager]
    code: 200
    input: []
    output: HedgePosition
    side_effects: []

  - method: GET
    path: "/ethanol-ops/hedge-positions"
    description: "Filtered list of positions ordered by created_at ASC."
    roles: [PlantManager, RiskManager]
    code: 200
    input: ["commodity?", "direction?", "status?", "limit?", "offset?"]
    output: HedgePosition[]
    side_effects: []

  - method: POST
    path: "/ethanol-ops/hedge-positions/{id}/close"
    description: >
      Closes part or all of a position at an exit price, crystallising realized
      profit and loss per calculations.hedge_pnl.
    roles: [RiskManager]
    code: 200
    input: [contracts_to_close, exit_price]
    output: HedgePosition
    side_effects:
      - "raises contracts_closed, lowers contracts_open and adds the closed leg to realized_pnl_cents"
      - "sets status PARTIALLY_CLOSED while contracts_open remains above zero, or CLOSED and closed_at when contracts_open reaches zero"
      - "increments HedgePosition.version by 1"

  # ---- PermitCondition / PermitReading --------------------------------------
  - method: POST
    path: "/ethanol-ops/permit-conditions"
    description: >
      Registers an air or water permit condition with its limit and rolling
      averaging period.
    roles: [ComplianceOfficer]
    code: 201
    input: [condition_code, permit_type, parameter_name, limit_value, unit, averaging_period_hours, severity]
    output: PermitCondition
    side_effects:
      - "status COMPLIANT, rolling_average_value null, readings_in_window 0, exceedance_count 0"

  - method: GET
    path: "/ethanol-ops/permit-conditions/{id}"
    description: "Reads one permit condition with its current rolling average and status."
    roles: [PlantManager, ComplianceOfficer, ProcessOperator]
    code: 200
    input: []
    output: PermitCondition
    side_effects: []

  - method: GET
    path: "/ethanol-ops/permit-conditions"
    description: "Filtered list of permit conditions ordered by condition_code ASC."
    roles: [PlantManager, ComplianceOfficer, ProcessOperator]
    code: 200
    input: ["permit_type?", "status?", "severity?", "limit?", "offset?"]
    output: PermitCondition[]
    side_effects: []

  - method: POST
    path: "/ethanol-ops/permit-conditions/{id}/readings"
    description: >
      Records a monitoring reading and recomputes the rolling average over the
      condition's averaging window. A reading that pushes the average above the
      limit drives the condition into EXCEEDANCE; readings that bring it back
      under the limit never clear the condition on their own.
    roles: [ProcessOperator, ComplianceOfficer]
    code: 201
    input: [value, measured_at, "sample_reference?"]
    output: PermitReading
    side_effects:
      - "recomputes PermitCondition.rolling_average_value and PermitCondition.readings_in_window per calculations.permit_rolling_average"
      - "when the recomputed average exceeds limit_value and the condition is COMPLIANT, sets status EXCEEDANCE, raises exceedance_count by 1 and records last_exceedance_at"
      - "recomputes Plant.compliance_posture and Plant.daily_grind_cap_bushels"
      - "increments PermitCondition.version by 1"

  - method: GET
    path: "/ethanol-ops/permit-conditions/{id}/readings"
    description: >
      Lists the readings under one condition, ordered by measured_at ASC then
      created_at ASC. Reverse reachability for PermitReading.condition_id.
    roles: [PlantManager, ComplianceOfficer, ProcessOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: PermitReading[]
    side_effects: []

  - method: POST
    path: "/ethanol-ops/permit-conditions/{id}/resolve-deviation"
    description: >
      Closes out an exceedance with a corrective action narrative. This is the
      only way back to COMPLIANT — clean readings alone never clear it.
    roles: [ComplianceOfficer]
    code: 200
    input: [resolution_note]
    output: PermitCondition
    side_effects:
      - "records resolution_note and sets status COMPLIANT"
      - "recomputes Plant.compliance_posture and Plant.daily_grind_cap_bushels"
      - "increments PermitCondition.version by 1"

  # ---- Logical clock --------------------------------------------------------
  - method: POST
    path: "/ethanol-ops/_clock/set_current_utc"
    description: >
      Sets the server's logical current UTC instant, which every temporal
      calculation reads. Before any call to this endpoint the logical clock
      reads 2026-08-01T00:00:00Z. The clock may only move forward; an earlier
      instant is rejected.
    roles: [PlantManager, GrainBuyer, ScaleOperator, GrainAccountant, ProcessOperator, LogisticsCoordinator, ComplianceOfficer, RiskManager]
    code: 200
    input: [current_utc]
    output: ClockState
    side_effects:
      - "sets the logical current UTC instant used by every rolling window, quote expiry and timestamp default"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
# One entry per §1.4 validation, in the same priority order.
errors:
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID absent from the request."
  - id: ERR_INVALID_ROLE
    http: 401
    condition: "X-User-Role is not one of the eight roles declared in §1.7."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The caller's role is not listed on the endpoint being invoked."
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing required field, wrong type, unparseable decimal or timestamp, out-of-domain enum value, non-positive quantity, or window_end not strictly after window_start."
  - id: ERR_PLANT_NOT_FOUND
    http: 404
    condition: "An operation that reads or writes plant-level state is invoked before the singleton Plant exists."
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "contract_id or rolled_from_contract_id names no CornPurchaseContract."
  - id: ERR_DELIVERY_NOT_FOUND
    http: 404
    condition: "The path id names no CornDelivery."
  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: "The path id or fermentation_batch_id names no FermentationBatch."
  - id: ERR_TANK_NOT_FOUND
    http: 404
    condition: "The path id, destination_tank_id, source_tank_id, neat_tank_id or denaturant_tank_id names no ProductTank."
  - id: ERR_BLEND_NOT_FOUND
    http: 404
    condition: "The path id names no DenaturantBlend."
  - id: ERR_TRACK_NOT_FOUND
    http: 404
    condition: "The path id or track_id names no LoadingTrack."
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "The path id or separated_shipment_id names no UnitTrainShipment."
  - id: ERR_SALE_NOT_FOUND
    http: 404
    condition: "The path id names no CoProductSale."
  - id: ERR_RIN_BATCH_NOT_FOUND
    http: 404
    condition: "The path id names no RinBatch."
  - id: ERR_CARBON_PROJECT_NOT_FOUND
    http: 404
    condition: "The path id or predecessor_project_id names no CarbonProject."
  - id: ERR_HEDGE_POSITION_NOT_FOUND
    http: 404
    condition: "The path id names no HedgePosition."
  - id: ERR_PERMIT_CONDITION_NOT_FOUND
    http: 404
    condition: "The path id names no PermitCondition."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The X-User-ID settling a graded delivery equals CornDelivery.graded_by_user_id."
  - id: ERR_PLANT_ALREADY_EXISTS
    http: 409
    condition: "POST /ethanol-ops/plants is invoked when the singleton Plant already exists."
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "A natural key already in use is submitted again: contract_code, ticket_number, batch_code, tank_code, blend_code, track_code, shipment_code, sale_code, project_code, position_code or condition_code."
  - id: ERR_STALE_TANK_VERSION
    http: 412
    condition: "expected_destination_tank_version does not equal the current ProductTank.version when scheduling a denaturant blend."
  - id: ERR_STALE_TRACK_VERSION
    http: 412
    condition: "expected_track_version does not equal the current LoadingTrack.version when scheduling a unit train shipment."
  - id: ERR_INVALID_CONTRACT_STATE
    http: 409
    condition: "The CornPurchaseContract is not in a status that admits the requested transition — pricing, rolling or accepting a delivery against a ROLLED contract."
  - id: ERR_CONTRACT_ALREADY_PRICED
    http: 409
    condition: "A price is fixed on a contract whose pricing_status is already PRICED."
  - id: ERR_INVALID_DELIVERY_STATE
    http: 409
    condition: "The CornDelivery is not in a grading_status that admits the requested transition — grading a delivery that is not PENDING_GRADE, or settling one that is not GRADED."
  - id: ERR_INVALID_BATCH_STATE
    http: 409
    condition: "The FermentationBatch is not in a status that admits the requested transition — starting a batch that is not CHARGED, intervening on a batch that is not HEALTH_WATCH, distilling a batch that is not FERMENTING, or completing one that is not DISTILLING."
  - id: ERR_INVALID_TANK_STATE
    http: 409
    condition: "The ProductTank is not in a service_status that admits the requested transition — holding a tank that is not IN_SERVICE, or releasing one that is IN_SERVICE."
  - id: ERR_INVALID_BLEND_STATE
    http: 409
    condition: "The DenaturantBlend is not SCHEDULED when execution is requested."
  - id: ERR_INVALID_SHIPMENT_LOADING_STATE
    http: 409
    condition: "The UnitTrainShipment's loading_status does not admit the requested transition — loading a shipment that is not SCHEDULED, or issuing a bill of lading for one that is not LOADED."
  - id: ERR_INVALID_SHIPMENT_BILLING_STATE
    http: 409
    condition: "The UnitTrainShipment's billing_status does not admit the requested transition — invoicing a shipment that is not BOL_ISSUED, or re-issuing a bill of lading."
  - id: ERR_SHIPMENT_ALREADY_INVOICED
    http: 409
    condition: "Cancellation is requested for a shipment whose billing_status is INVOICED."
  - id: ERR_INVALID_SALE_STATE
    http: 409
    condition: "The CoProductSale is not in a status that admits the requested transition — responding to a sale that is not QUOTED, or shipping one that is not ACCEPTED."
  - id: ERR_INVALID_RIN_STATE
    http: 409
    condition: "Retirement is requested for a RinBatch whose status is not SEPARATED."
  - id: ERR_INVALID_PROJECT_STATE
    http: 409
    condition: "The CarbonProject is not in a verification_status that admits the requested transition — submitting a project that is neither DRAFT nor RETURNED_FOR_REVISION, or reviewing one that is not SUBMITTED."
  - id: ERR_INVALID_POSITION_STATE
    http: 409
    condition: "A close is requested against a HedgePosition whose status is already CLOSED."
  - id: ERR_CONDITION_NOT_IN_EXCEEDANCE
    http: 409
    condition: "A deviation resolution is requested for a PermitCondition whose status is COMPLIANT."
  - id: ERR_PLANT_SUSPENDED
    http: 422
    condition: "A production or shipping operation is attempted while Plant.compliance_posture is SUSPENDED."
  - id: ERR_TANK_NOT_IN_SERVICE
    http: 422
    condition: "A tank taking or giving product is not IN_SERVICE — the destination tank of a distillation or blend, or the source tank of a shipment."
  - id: ERR_DENATURANT_SPEC_VIOLATION
    http: 422
    condition: "The blend's denaturant volume percentage falls outside the inclusive band 0.019800 to 0.029800."
  - id: ERR_GRIND_CAP_EXCEEDED
    http: 422
    condition: "A fermentation charge would push the plant's grind for the current logical day above Plant.daily_grind_cap_bushels."
  - id: ERR_TANK_PRODUCT_TYPE_MISMATCH
    http: 422
    condition: "A tank's product_type does not admit the product being moved — distilling into a tank that is not ETHANOL_200_PROOF, drawing denaturant from a tank that is not DENATURANT, blending into a tank that is not DENATURED_E100, or shipping from a tank that is not DENATURED_E100."
  - id: ERR_CONTRACT_NOT_PRICED
    http: 422
    condition: "Settlement is requested against a contract whose pricing_status is still UNPRICED."
  - id: ERR_PREDECESSOR_NOT_CERTIFIED
    http: 422
    condition: "A carbon project is submitted while its predecessor_project_id names a project that is not CERTIFIED."
  - id: ERR_SHIPMENT_NOT_INVOICED
    http: 422
    condition: "RIN retirement is requested while the separating UnitTrainShipment's billing_status is not INVOICED."
  - id: ERR_MARKS_NOT_POSTED
    http: 422
    condition: "An operation that needs a market mark is attempted before that commodity's mark has been posted on the Plant — an INDEX co-product quote, a crush margin read, or a hedge position valuation."
  - id: ERR_CONTRACT_HAS_OPEN_DELIVERIES
    http: 422
    condition: "A contract roll is requested while at least one CornDelivery against it is PENDING_GRADE or GRADED."
  - id: ERR_QUOTE_EXPIRED
    http: 422
    condition: "A buyer response arrives at or after CoProductSale.quote_expires_at on the logical clock."
  - id: ERR_TANK_OCCUPANCY_CONFLICT
    http: 422
    condition: "A blend's closed occupancy interval, extended by the tank's settling_buffer_minutes, touches or overlaps an existing SCHEDULED or EXECUTED blend on the same destination tank."
  - id: ERR_CLOCK_REGRESSION
    http: 422
    condition: "POST /ethanol-ops/_clock/set_current_utc is given an instant at or before the current logical instant."
  - id: ERR_TRACK_CAPACITY_EXCEEDED
    http: 422
    condition: "The railcars already committed on the track over any instant of the requested half-open window, plus the requested railcar_count, exceed LoadingTrack.spot_capacity."
  - id: ERR_TRACK_INACTIVE
    http: 422
    condition: "A shipment is scheduled on a LoadingTrack whose is_active is false."
  - id: ERR_INTERVENTION_LIMIT_REACHED
    http: 422
    condition: "A third fermentation intervention is requested on a batch that has already recorded two."
  - id: ERR_REVISION_LIMIT_REACHED
    http: 422
    condition: "A third return for revision is requested on a carbon project that has already recorded two."
  - id: ERR_CLOSE_EXCEEDS_OPEN_CONTRACTS
    http: 422
    condition: "contracts_to_close exceeds HedgePosition.contracts_open."
  - id: ERR_CONTRACT_FULLY_DELIVERED
    http: 422
    condition: "A delivery is booked against, or a roll is requested for, a contract whose settled bushels already meet or exceed its bushels_contracted."
  - id: ERR_INSUFFICIENT_TANK_VOLUME
    http: 422
    condition: "The gallons a blend or a loading would draw exceed the source tank's current_gallons."
  - id: ERR_INSUFFICIENT_TANK_CAPACITY
    http: 422
    condition: "The gallons a distillation or a blend would deposit would carry the destination tank above its capacity_gallons."
  - id: ERR_INSUFFICIENT_CORN_INVENTORY
    http: 422
    condition: "A fermentation charge's bushels exceed Plant.corn_inventory_bushels."
  - id: ERR_INSUFFICIENT_COPRODUCT_INVENTORY
    http: 422
    condition: "A co-product shipment's quantity exceeds Plant.ddgs_inventory_tons or Plant.corn_oil_inventory_lbs for the sale's product."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
# role_model: segregation_of_duties. Every role is `opaque` — X-User-ID is an
# operator identifier and is never required to equal any entity's id. Two
# separations are enforced on top of the role split:
#   (a) the user who graded a CornDelivery may not settle it (§1.4 priority 18);
#   (b) ComplianceOfficer submits a CarbonProject for verification but only
#       PlantManager may certify or return it.
roles:
  - name: PlantManager
    description: "Plant general manager. Stands up the plant, posts the market marks used by every mark-to-market figure, and is the certifying authority on carbon projects. Reads everything; runs no production or logistics operation directly."
    identity: opaque
    exclusive_operations:
      - "POST /ethanol-ops/plants — create the singleton plant"
      - "POST /ethanol-ops/carbon-projects/{id}/review — certify or return a submitted carbon project"
    shared_operations:
      - "POST /ethanol-ops/plants/{id}/market-marks — post corn, ethanol, natural gas, soybean meal and soybean oil marks (with RiskManager)"
      - "GET /ethanol-ops/plants/{id}/crush-margin — read the mark-to-market and realized crush margin"
      - "Read access to every collection: plant, corn contracts and their deliveries, fermentation batches and health readings, product tanks, denaturant blends, loading tracks, unit train shipments, co-product sales, RIN batches, carbon projects, hedge positions, permit conditions and their readings"
      - "POST /ethanol-ops/_clock/set_current_utc — advance the logical clock"

  - name: GrainBuyer
    description: "Corn merchandiser and co-product marketer. Owns basis contracting on the buy side and quoting on the co-product sell side. Cannot grade, settle or ship."
    identity: opaque
    exclusive_operations:
      - "POST /ethanol-ops/corn-contracts — open a basis contract"
      - "POST /ethanol-ops/corn-contracts/{id}/price — fix the futures leg of an unpriced contract"
      - "POST /ethanol-ops/corn-contracts/{id}/roll — roll an unfilled contract into a successor"
      - "POST /ethanol-ops/co-product-sales — quote a distillers grains or corn oil sale"
      - "POST /ethanol-ops/co-product-sales/{id}/respond — record the buyer's accept or decline"
    shared_operations:
      - "GET /ethanol-ops/plants/{id} and GET /ethanol-ops/plants/{id}/crush-margin"
      - "Read access to corn contracts, their deliveries, individual deliveries and co-product sales"
      - "POST /ethanol-ops/_clock/set_current_utc"

  - name: ScaleOperator
    description: "Inbound scale house. Books trucks against contracts and records the grading factors that drive discounts. Deliberately cannot settle what it graded."
    identity: opaque
    exclusive_operations:
      - "POST /ethanol-ops/corn-contracts/{id}/deliveries — book an inbound truck against a contract"
      - "POST /ethanol-ops/corn-deliveries/{id}/grade — record moisture, test weight, foreign material, damage and aflatoxin"
    shared_operations:
      - "GET /ethanol-ops/plants/{id}"
      - "Read access to corn contracts, their deliveries and individual deliveries"
      - "POST /ethanol-ops/_clock/set_current_utc"

  - name: GrainAccountant
    description: "Grain accounting. Settles graded deliveries into money and inventory. May never settle a delivery it graded itself, which in practice means a GrainAccountant X-User-ID must differ from the grading X-User-ID."
    identity: opaque
    exclusive_operations:
      - "POST /ethanol-ops/corn-deliveries/{id}/settle — settle a graded delivery, advancing contract fill and corn inventory"
    shared_operations:
      - "GET /ethanol-ops/plants/{id}"
      - "Read access to corn contracts, their deliveries and individual deliveries"
      - "POST /ethanol-ops/_clock/set_current_utc"

  - name: ProcessOperator
    description: "Control room. Runs milling, fermentation, distillation, tank service and denaturant blending, and logs environmental monitoring readings."
    identity: opaque
    exclusive_operations:
      - "POST /ethanol-ops/fermentation-batches — charge a batch against the daily grind cap"
      - "POST /ethanol-ops/fermentation-batches/{id}/health-readings — log lactic, acetic and temperature"
      - "POST /ethanol-ops/fermentation-batches/{id}/intervene — dose a batch on health watch"
      - "POST /ethanol-ops/fermentation-batches/{id}/distill — send a batch to the still"
      - "POST /ethanol-ops/fermentation-batches/{id}/complete — book yield, co-products and RIN generation"
      - "POST /ethanol-ops/fermentation-batches/{id}/dump — dump a failed batch"
      - "POST /ethanol-ops/product-tanks — commission a tank"
      - "POST /ethanol-ops/product-tanks/{id}/hold — take a tank off spec or out of service"
      - "POST /ethanol-ops/product-tanks/{id}/release — return a held tank to service"
      - "POST /ethanol-ops/denaturant-blends — schedule a denaturant blend"
      - "POST /ethanol-ops/denaturant-blends/{id}/execute — execute a scheduled blend"
    shared_operations:
      - "POST /ethanol-ops/permit-conditions/{id}/readings — log a monitoring reading (with ComplianceOfficer)"
      - "GET /ethanol-ops/plants/{id}"
      - "Read access to fermentation batches and health readings, product tanks, tank batches, tank blends, individual blends, permit conditions and their readings"
      - "POST /ethanol-ops/_clock/set_current_utc"

  - name: LogisticsCoordinator
    description: "Rail and outbound logistics. Owns track capacity, unit train scheduling and loading, the bill of lading that separates RINs, invoicing, and co-product shipment."
    identity: opaque
    exclusive_operations:
      - "POST /ethanol-ops/loading-tracks — commission a loading track"
      - "POST /ethanol-ops/unit-train-shipments — schedule a unit train against track capacity"
      - "POST /ethanol-ops/unit-train-shipments/{id}/load — load the train from a product tank"
      - "POST /ethanol-ops/unit-train-shipments/{id}/bill-of-lading — issue the bill of lading and separate RINs"
      - "POST /ethanol-ops/unit-train-shipments/{id}/invoice — invoice a shipment"
      - "POST /ethanol-ops/unit-train-shipments/{id}/cancel — cancel a shipment and reverse its side effects"
      - "POST /ethanol-ops/co-product-sales/{id}/ship — ship an accepted co-product sale"
    shared_operations:
      - "GET /ethanol-ops/plants/{id}"
      - "Read access to product tanks, individual blends, loading tracks, unit train shipments and co-product sales"
      - "POST /ethanol-ops/_clock/set_current_utc"

  - name: ComplianceOfficer
    description: "Regulatory affairs. Owns renewable fuel credit retirement, carbon intensity project registration and submission, and environmental permit conditions. Cannot certify its own carbon projects."
    identity: opaque
    exclusive_operations:
      - "POST /ethanol-ops/rin-batches/{id}/retire — retire separated credits against an obligation"
      - "POST /ethanol-ops/carbon-projects — register a carbon intensity reduction project"
      - "POST /ethanol-ops/carbon-projects/{id}/submit — submit a project for third-party verification"
      - "POST /ethanol-ops/permit-conditions — register an air or water permit condition"
      - "POST /ethanol-ops/permit-conditions/{id}/resolve-deviation — close out an exceedance"
    shared_operations:
      - "POST /ethanol-ops/permit-conditions/{id}/readings — log a monitoring reading (with ProcessOperator)"
      - "GET /ethanol-ops/plants/{id}"
      - "Read access to fermentation batches and health readings, product tanks, unit train shipments, RIN batches, carbon projects, permit conditions and their readings"
      - "POST /ethanol-ops/_clock/set_current_utc"

  - name: RiskManager
    description: "Commodity risk desk. Posts marks alongside the plant manager and owns the futures book across corn, ethanol and natural gas. Reads the physical book but touches none of it."
    identity: opaque
    exclusive_operations:
      - "POST /ethanol-ops/hedge-positions — open a futures position"
      - "POST /ethanol-ops/hedge-positions/{id}/close — close all or part of a position"
    shared_operations:
      - "POST /ethanol-ops/plants/{id}/market-marks — post market marks (with PlantManager)"
      - "GET /ethanol-ops/plants/{id}/crush-margin — read the mark-to-market and realized crush margin"
      - "GET /ethanol-ops/plants/{id}"
      - "Read access to corn contracts, fermentation batches, unit train shipments, co-product sales, RIN batches, carbon projects and hedge positions"
      - "POST /ethanol-ops/_clock/set_current_utc"
