          - entities.DevelopmentApplication.fields.credit_applied_cents
        distinguishing_aspect: |
          The APPROVE_PARTIAL edge is the only decide branch that carries approved_cents,
          and the reassessment it triggers must consume the APPROVED amount rather than the
          claimed amount: 500000 of a 1000000 claim. The PARKS admin charge therefore moves
          to round_half_up((2541680 - 500000) * 0.03) == 61250 while ROADS stays 74901, so a
          system that credited the full claim, or that recomputed admin on the gross, lands
          on a different net.
        test_recipe:
          setup:
            - "Assessed BP-1001: gross 5038370 (PARKS 2541680 + ROADS 2496690), admin 151151, net 5189521."
            - "A PARKS DEVELOPER_IMPROVEMENT NOMINAL claim for 1000000 is SUBMITTED; the credit cap (50% of 5038370 == 2519185) does not bite."
            - "The application version captured right after assessment is still current."
