# ============================================================================
# §1.8 Scaffold Difficulty Design — task_2778 Youth Sports Accident Insurance Claims
#
# Nine §0.5 Difficulty Rules x 2 differentiated instances = 18 instances.
# Every money literal in every `assert:` line below was produced by executing the
# matching §1.3 `formula:` as Python against the pinned fixtures, not estimated.
# ============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: benefit_determination_excess_of_other_vs_full_excess
        grounds:
          - calculations.claim_benefit_determination
          - entities.Claim.fields.coordination_basis
          - entities.Claim.fields.deductible_applied_cents
          - entities.Claim.fields.benefit_payable_cents
          - state_machines.Claim.NOT_STARTED_to_NO_OTHER_COVERAGE_CONFIRMED
          - state_machines.Claim.EOB_REQUESTED_to_EOB_RECEIVED
        distinguishing_aspect: |
          Two claims carrying byte-identical provider billing (allowed_amount_total_cents == 730000 on both)
          diverge purely on coordination_basis: the EXCESS_OF_OTHER claim applies the face deductible of
          25000 and pays 705000, the FULL_EXCESS claim applies the doubled deductible of 50000 and pays
          680000, a delta of exactly 25000 cents; the variant is selected by the coordination axis, not by
          any billing input. This instance sits on the Claim entity and the waterfall_allocation algorithm.
        test_recipe:
          setup:
            - "One SANCTIONED league; one BASEBALL_U12 classification (deductible 25000, per-injury limit 2500000, cat attachment 2500000, aggregate 25000000)."
            - "One ACTIVE LeaguePolicy for term [2026-03-01, 2027-03-01) with enrolled_participant_count 404, cat_layer_elected true and coverage_basis_election FULL_EXCESS_PERMITTED."
            - "Participant P1 has one ACTIVE VERIFIED FamilyHealthPlan; participant P2 has no family health plan at all."
            - "Both participants are ENROLLED on the policy and both are injured on the same SANCTIONED GAME activity at severity SEVERE."
            - "Claim A (P1) is driven to coordination_status EOB_RECEIVED by an all-zero explanation of benefits; claim B (P2) is driven to NO_OTHER_COVERAGE_CONFIRMED."
            - "Each claim carries the same two repriced provider bills: an IN_NETWORK EMERGENCY_ROOM charge of 620000 against a fee schedule of 385000, and an OUT_OF_NETWORK DIAGNOSTIC_IMAGING charge of 480000 against a fee schedule of 260000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /leagues"
              payload: { name: "Riverside Youth Baseball", league_code: "RYB-001", state_code: "OH", governing_body_code: "USYSA", contact_email: "admin@ryb.example" }
              as: ProgramAdministrator
              captures: { league_id: "$.data.id" }
            - call: "POST /sport-classifications"
              payload: { sport_code: "BASEBALL_U12", sport_name: "Baseball U12", hazard_class: "CLASS_2_MODERATE", base_rate_per_participant_cents: 1850, deductible_cents: 25000, per_injury_limit_cents: 2500000, cat_attachment_point_cents: 2500000, aggregate_limit_cents: 25000000, cat_lifetime_max_cents: 100000000, minimum_participants: 25, travel_buffer_minutes: 60, service_category_caps: { EMERGENCY_ROOM: 500000, SURGERY: 3000000, DIAGNOSTIC_IMAGING: 300000, PHYSICAL_THERAPY: 20000, DENTAL: 350000, AMBULANCE: 200000, PHYSICIAN_OFFICE: 50000 } }
              as: ProgramAdministrator
              captures: { sport_id: "$.data.id" }
            - call: "POST /league-policies"
              payload: { league_id: "${league_id}", sport_classification_id: "${sport_id}", term_effective_date: "2026-03-01", term_expiration_date: "2027-03-01", enrolled_participant_count: 404, coverage_basis_election: "FULL_EXCESS_PERMITTED", cat_layer_elected: true }
              as: ProgramAdministrator
              captures: { pol_id: "$.data.id" }
            - call: "POST /league-policies/${pol_id}/bind"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /league-policies/${pol_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /participants"
              payload: { league_id: "${league_id}", first_name: "Ada", last_name: "Nowak", date_of_birth: "2014-04-02", guardian_email: "g1@ryb.example" }
              as: LeagueAdministrator
              as_user_id: "${league_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /participants"
              payload: { league_id: "${league_id}", first_name: "Ben", last_name: "Ortiz", date_of_birth: "2014-09-19", guardian_email: "g2@ryb.example" }
              as: LeagueAdministrator
              as_user_id: "${league_id}"
              captures: { p2_id: "$.data.id" }
            - call: "POST /enrollments"
              payload: { participant_id: "${p1_id}", league_policy_id: "${pol_id}", enrolled_on_date: "2026-03-05" }
              as: LeagueAdministrator
              as_user_id: "${league_id}"
              captures: { enr1_id: "$.data.id" }
            - call: "POST /enrollments"
              payload: { participant_id: "${p2_id}", league_policy_id: "${pol_id}", enrolled_on_date: "2026-03-05" }
              as: LeagueAdministrator
              as_user_id: "${league_id}"
              captures: { enr2_id: "$.data.id" }
            - call: "POST /family-health-plans"
