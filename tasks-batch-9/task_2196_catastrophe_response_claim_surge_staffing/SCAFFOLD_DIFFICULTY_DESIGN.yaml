            - "${status_mid} == EXHAUSTED"
            - "${d2_provisional} == 1920.00"
            - "Deployment.${d2}.status == CANCELLED"
            - "Deployment.${d2}.final_settled_cost == 0.00"
            - "Deployment.${d2}.provisional_cost == 1920.00   # retained for audit: the money ledger is NOT symmetric"
            - "Deployment.${d2}.surge_premium_tier == TIER_NONE"
            - "HousingBlock.${hb}.rooms_total == 4"
            - "HousingBlock.${hb}.rooms_occupied == 3   # EXACTLY the pre-confirm value for D2"
            - "HousingBlock.${hb}.rooms_available == 1   # EXACTLY the pre-confirm value for D2"
            - "HousingBlock.${hb}.rooms_occupied + HousingBlock.${hb}.rooms_available == 4 at every checkpoint above"
            - "HousingBlock.${hb}.status == ACTIVE   # EXHAUSTED -> ACTIVE, link 3 of cancel_deployment_chain"
            - "Deployment.${d1}.status == CONFIRMED   # untouched"
            - "Adjuster.${adj_b}.deployment_status == RESTING"
            - "Adjuster.${adj_b}.last_demobilized_at_utc == 2026-08-01T00:00:00.000Z"
            - "Adjuster.${adj_a}.deployment_status == DEPLOYED"
            - "CatastropheEvent.${ev}.surge_adjuster_count == 1"
            - "CatastropheEvent.${ev}.posture == OPEN"

      - name: vendor_concurrency_slots_conserved_across_accept_then_complete
        grounds:
          - entities.VendorFirm.open_job_count
          - validations[priority=33]
          - state_machines.VendorFirm.ACTIVATED_to_CAPACITY_HOLD
          - state_machines.VendorFirm.CAPACITY_HOLD_to_ACTIVATED
          - state_machines.VendorAssignment.ACCEPTED_to_COMPLETED
        distinguishing_aspect: |
          Conserved quantity #3: vendor CONCURRENCY SLOTS on a third entity (VendorFirm). The identity
          open_job_count + free_slots == max_concurrent_jobs == 2 holds at every checkpoint, and the
          compensating pair is accept-then-complete rather than issue-then-void or confirm-then-cancel. The
          slot is proven genuinely returned, not merely decremented, by successfully dispatching a THIRD job
          after the completion — a call that validations priority 33 would have rejected one step earlier.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z startup default."
            - "One CatastropheEvent 'CAT-2026-903' in DECLARED: WILDFIRE, CA, expected_severity_index 0.1000, posture OPEN."
            - "One VendorFirm ACTIVATED onto that event: vendor_type TARP, service_states [CA], max_concurrent_jobs 2, performance_score 91.00."
            - "Three identical Claims triaged to severity_score 4.25 / FAST_TRACK: base = 100.0*min(1.0, 9000/500000) = 1.80; raw = 1.80*1.25 + 0.0 + 0.0 + 20.0*0.1000 = 2.25 + 2.00 = 4.25; case_reserve = round(max(9000, 10000-1000)*0.25, 2) = round(9000.00*0.25,2) = 2250.00 each."
            - "VA1 dispatched then ACCEPTED: open_job_count 1, which is NOT equal to max_concurrent_jobs, so the firm stays ACTIVATED."
            - "VA2 dispatched (priority 33 passes: open_job_count 1 < 2) then ACCEPTED: open_job_count reaches exactly 2, so the firm flips ACTIVATED -> CAPACITY_HOLD."
          setup_api_calls:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-903", peril_type: "WILDFIRE", jurisdiction_state: "CA", event_start_utc: "2026-07-30T00:00:00.000Z", exposure_count: 450, avg_insured_value: 420000, expected_severity_index: 0.1000 }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev: $.data.id }
            - call: "POST /catastrophe-events/${ev}/declare"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /vendor-firms"
              payload: { firm_name: "Sierra Tarp Co", vendor_type: "TARP", service_states: ["CA"], max_concurrent_jobs: 2, performance_score: 91.00 }
              as: VendorCoordinator
              as_user_id: "vc_seed"
              captures: { vf: $.data.id }
            - call: "POST /vendor-firms/${vf}/activate"
              payload: { event_id: "${ev}" }
              as: VendorCoordinator
              as_user_id: "${vf}"
            - call: "POST /claims"
              payload: { policy_number: "POL-9301", loss_state: "CA", loss_date_utc: "2026-07-30T00:00:00.000Z", reported_loss_amount: 9000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 500000, deductible_amount: 1000, estimated_damage_amount: 10000 }], event_id: "${ev}", access_status: "ACCESSIBLE" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { c1: $.data.id }
            - call: "POST /claims/${c1}/triage"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce_1"
            - call: "POST /claims"
              payload: { policy_number: "POL-9302", loss_state: "CA", loss_date_utc: "2026-07-30T00:00:00.000Z", reported_loss_amount: 9000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 500000, deductible_amount: 1000, estimated_damage_amount: 10000 }], event_id: "${ev}", access_status: "ACCESSIBLE" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { c2: $.data.id }
            - call: "POST /claims/${c2}/triage"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce_1"
            - call: "POST /claims"
              payload: { policy_number: "POL-9303", loss_state: "CA", loss_date_utc: "2026-07-30T00:00:00.000Z", reported_loss_amount: 9000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 500000, deductible_amount: 1000, estimated_damage_amount: 10000 }], event_id: "${ev}", access_status: "ACCESSIBLE" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { c3: $.data.id }
            - call: "POST /claims/${c3}/triage"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce_1"
            - call: "POST /vendor-assignments"
              payload: { claim_id: "${c1}", scope_amount: 6000, required_vendor_type: "TARP", vendor_firm_id: "${vf}" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { va1: $.data.id }
            - call: "POST /vendor-assignments/${va1}/accept"
              payload: {}
              as: VendorCoordinator
              as_user_id: "${vf}"
              captures: { open_after_accept1: $.data.status }
            - call: "POST /vendor-assignments"
              payload: { claim_id: "${c2}", scope_amount: 6000, required_vendor_type: "TARP", vendor_firm_id: "${vf}" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { va2: $.data.id }
            - call: "POST /vendor-assignments/${va2}/accept"
              payload: {}
              as: VendorCoordinator
              as_user_id: "${vf}"
            - call: "GET /vendor-firms"
              payload: { activated_for_event_id: "${ev}" }
              as: VendorCoordinator
              as_user_id: "${vf}"
              captures: { open_mid: "$.data[0].open_job_count", status_mid: "$.data[0].status" }
          trigger:
            - call: "POST /vendor-assignments/${va1}/complete"
              payload: {}
              as: VendorCoordinator
              as_user_id: "${vf}"
            - call: "POST /vendor-assignments"
              payload: { claim_id: "${c3}", scope_amount: 6000, required_vendor_type: "TARP", vendor_firm_id: "${vf}" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
          assert:
            - "${open_after_accept1} == ACCEPTED"
            - "${open_mid} == 2   # both jobs open, slots exhausted"
            - "${status_mid} == CAPACITY_HOLD   # ACTIVATED -> CAPACITY_HOLD fired at exactly max_concurrent_jobs"
            - "trigger call 1 response HTTP status == 200"
            - "VendorAssignment.${va1}.status == COMPLETED"
            - "VendorAssignment.${va2}.status == ACCEPTED"
            - "after trigger call 1: VendorFirm.${vf}.open_job_count == 1   # COMPLETED rows hold no slot"
            - "after trigger call 1: VendorFirm.${vf}.status == ACTIVATED   # CAPACITY_HOLD -> ACTIVATED, the compensating flip"
            - "trigger call 2 response HTTP status == 201   # priority 33 would have rejected this one step earlier"
            - "VendorFirm.${vf}.open_job_count == 2 after trigger call 2"
            - "VendorFirm.${vf}.max_concurrent_jobs == 2, and open_job_count + free_slots == 2 at every checkpoint (1+1, 2+0, 1+1, 2+0)"
            - "VendorFirm.${vf}.status == ACTIVATED after trigger call 2   # dispatch alone never drives the CAPACITY_HOLD edge, only accept does"
            - "VendorFirm.${vf}.activated_for_event_id == ${ev}"
            - "GET /vendor-assignments?vendor_firm_id=${vf} returns exactly 3 rows"
            - "CatastropheEvent.${ev}.case_reserve_total == 6750.00   # 3 x 2250.00, untouched by vendor slot movement"
