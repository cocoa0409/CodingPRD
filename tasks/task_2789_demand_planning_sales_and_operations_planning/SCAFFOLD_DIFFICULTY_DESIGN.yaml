  - rule_id: cross_entity_state_dependency
    instances:
      - name: supply_plan_create_requires_all_forecasts_consensus_locked
        grounds:
          - validations[priority=130]
          - errors.ERR_FORECAST_NOT_LOCKED
          - state_machines.DemandForecast.UNDER_CONSENSUS_to_CONSENSUS_LOCKED
          - calculations.calc_constrained_supply
        distinguishing_aspect: |
          Entity pair SupplyPlan -> DemandForecast: the guard reads the state of a SIBLING
          collection, and it is universally quantified — one single line still in UNDER_CONSENSUS
          among otherwise locked lines blocks plan creation, so the check cannot be satisfied by
          sampling. The positive half of the pairing is exercised by
          supply_constraint_net_inventory_first_vs_gross_capacity_first, whose identical call
          succeeds once every line is locked.
        test_recipe:
          setup:
            - "One ProductFamily with a 9-hour CapacityBlock in the 2026-09 window; one MATURE Item; two Customers."
            - "One PlanningCycle over 2026-09..2026-09 with two forecast lines for the same item: customer A's line CONSENSUS_LOCKED, customer B's line left in UNDER_CONSENSUS."
            - "The cycle advanced to SUPPLY_REVIEW."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-PAPER", name: "Paper Goods", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
