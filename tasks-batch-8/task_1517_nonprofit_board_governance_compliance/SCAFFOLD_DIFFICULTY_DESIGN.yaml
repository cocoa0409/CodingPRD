scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: quorum_seated_vs_authorized_basis
    grounds:
    - calculations.quorum_attainment
    - entities.Bylaws.fields.quorum_basis
    - state_machines.Meeting.SCHEDULED_to_IN_SESSION
    distinguishing_aspect: 'Meeting-domain quorum: with one vacancy (4 ACTIVE of board_size 5, quorum_pct 50), the SEATED

      variant (base 4 -> required 2) lets 2 attendees call to order, while the AUTHORIZED variant

      (base 5 -> required 3) rejects the identical roster — same attendance, different outcome,

      selected by Bylaws.quorum_basis.

      '
    test_recipe:
      setup:
      - Org A (SEATED) and Org B (AUTHORIZED), each board_size 5, quorum_pct 50, each with 4 ACTIVE members (chair + 3 directors) serving terms starting 2026-01-01
      - One board meeting per org scheduled 2026-08-01T00:00:00Z with notice_waived
      setup_api_calls:
      - call: POST /boardgov/nonprofits
        payload:
          name: Org A
          ein: EIN-SEATED-1
          state_of_incorporation: CA
          fiscal_year_end_month: 12
          annual_gross_receipts_cents: 4000000000
        as: GovernanceAdmin
        captures:
          npa: $.data.id
      - call: POST /boardgov/bylaws
        payload:
          nonprofit_id: ${npa}
          quorum_pct: 50
          quorum_basis: SEATED
          amendment_threshold_pct: 67
          term_length_years: 2
          max_consecutive_terms: 3
          term_cooloff_years: 1
          board_size: 5
        as: GovernanceAdmin
        captures:
          bya: $.data.id
      - call: POST /boardgov/bylaws/${bya}/adopt
        payload: {}
        as: GovernanceAdmin
      - call: POST /boardgov/board-members
        payload:
          nonprofit_id: ${npa}
          full_name: Chair A
          email: chair.a@x.org
          skill_tags:
          - GOVERNANCE
          officer_role: CHAIR
        as: GovernanceAdmin
        captures:
          ca: $.data.id
      - call: POST /boardgov/board-members
        payload:
          nonprofit_id: ${npa}
          full_name: Dir A1
          email: d1.a@x.org
          skill_tags:
          - FINANCE
        as: GovernanceAdmin
        captures:
          da1: $.data.id
      - call: POST /boardgov/board-members
        payload:
          nonprofit_id: ${npa}
          full_name: Dir A2
          email: d2.a@x.org
          skill_tags:
          - LEGAL
        as: GovernanceAdmin
        captures:
          da2: $.data.id
      - call: POST /boardgov/board-members
        payload:
          nonprofit_id: ${npa}
          full_name: Dir A3
          email: d3.a@x.org
          skill_tags:
          - PROGRAM
        as: GovernanceAdmin
        captures:
          da3: $.data.id
      - call: POST /boardgov/board-terms
        payload:
          nonprofit_id: ${npa}
          board_member_id: ${ca}
          start_date: '2026-01-01T00:00:00Z'
        as: GovernanceAdmin
      - call: POST /boardgov/board-terms
        payload:
          nonprofit_id: ${npa}
          board_member_id: ${da1}
          start_date: '2026-01-01T00:00:00Z'
        as: GovernanceAdmin
      - call: POST /boardgov/board-terms
        payload:
          nonprofit_id: ${npa}
          board_member_id: ${da2}
          start_date: '2026-01-01T00:00:00Z'
        as: GovernanceAdmin
      - call: POST /boardgov/board-terms
        payload:
          nonprofit_id: ${npa}
          board_member_id: ${da3}
          start_date: '2026-01-01T00:00:00Z'
        as: GovernanceAdmin
      - call: POST /boardgov/meetings
        payload:
          nonprofit_id: ${npa}
          scheduled_start: '2026-08-01T00:00:00Z'
          duration_minutes: 60
          notice_waived: true
        as: GovernanceAdmin
        captures:
          mta: $.data.id
      - call: POST /boardgov/nonprofits
        payload:
          name: Org B
          ein: EIN-AUTH-1
          state_of_incorporation: CA
          fiscal_year_end_month: 12
          annual_gross_receipts_cents: 4000000000
        as: GovernanceAdmin
        captures:
          npb: $.data.id
      - call: POST /boardgov/bylaws
        payload:
          nonprofit_id: ${npb}
          quorum_pct: 50
          quorum_basis: AUTHORIZED
          amendment_threshold_pct: 67
          term_length_years: 2
          max_consecutive_terms: 3
          term_cooloff_years: 1
          board_size: 5
        as: GovernanceAdmin
        captures:
          byb: $.data.id
      - call: POST /boardgov/bylaws/${byb}/adopt
        payload: {}
        as: GovernanceAdmin
      - call: POST /boardgov/board-members
        payload:
          nonprofit_id: ${npb}
          full_name: Chair B
          email: chair.b@x.org
          skill_tags:
          - GOVERNANCE
          officer_role: CHAIR
        as: GovernanceAdmin
        captures:
          cb: $.data.id
      - call: POST /boardgov/board-members
        payload:
          nonprofit_id: ${npb}
          full_name: Dir B1
          email: d1.b@x.org
          skill_tags:
          - FINANCE
        as: GovernanceAdmin
        captures:
          db1: $.data.id
      - call: POST /boardgov/board-members
        payload:
          nonprofit_id: ${npb}
          full_name: Dir B2
          email: d2.b@x.org
          skill_tags:
          - LEGAL
        as: GovernanceAdmin
        captures:
          db2: $.data.id
      - call: POST /boardgov/board-members
        payload:
          nonprofit_id: ${npb}
          full_name: Dir B3
          email: d3.b@x.org
          skill_tags:
          - PROGRAM
        as: GovernanceAdmin
        captures:
          db3: $.data.id
      - call: POST /boardgov/board-terms
        payload:
          nonprofit_id: ${npb}
          board_member_id: ${cb}
          start_date: '2026-01-01T00:00:00Z'
        as: GovernanceAdmin
      - call: POST /boardgov/board-terms
        payload:
          nonprofit_id: ${npb}
          board_member_id: ${db1}
          start_date: '2026-01-01T00:00:00Z'
        as: GovernanceAdmin
      - call: POST /boardgov/board-terms
        payload:
          nonprofit_id: ${npb}
          board_member_id: ${db2}
          start_date: '2026-01-01T00:00:00Z'
        as: GovernanceAdmin
      - call: POST /boardgov/board-terms
        payload:
          nonprofit_id: ${npb}
          board_member_id: ${db3}
          start_date: '2026-01-01T00:00:00Z'
        as: GovernanceAdmin
      - call: POST /boardgov/meetings
        payload:
          nonprofit_id: ${npb}
          scheduled_start: '2026-08-01T00:00:00Z'
          duration_minutes: 60
          notice_waived: true
        as: GovernanceAdmin
        captures:
          mtb: $.data.id
      trigger:
      - call: POST /boardgov/meetings/${mta}/call_to_order
        payload:
          attendance:
          - ${ca}
          - ${da1}
        as: BoardChair
        as_user_id: ${ca}
        captures:
          qa_base: $.data.quorum_base
          qa_req: $.data.quorum_required
          qa_met: $.data.quorum_met
          qa_status: $.data.status
      - call: POST /boardgov/meetings/${mtb}/call_to_order
        payload:
          attendance:
          - ${cb}
          - ${db1}
        as: BoardChair
        as_user_id: ${cb}
        captures:
          qb_err: $.data.error_id
      assert:
      - 'Meeting.${mta}.status == IN_SESSION (SEATED: base 4, required 2, 2 present -> quorum met)'
      - captured qa_base == 4 and qa_req == 2 and qa_met == true
      - 'Meeting.${mtb} call fails with ERR_QUORUM_NOT_MET (AUTHORIZED: base 5, required 3, same 2 attendees)'
      - Meeting.${mtb}.status == SCHEDULED (unchanged after the rejection)
  - name: registration_fee_actual_vs_estimated_variant
    grounds:
    - calculations.registration_renewal_fee
    - entities.StateRegistration.fields.contributions_in_state_cents
    - entities.StateRegistration.fields.renewal_fee_cents
    distinguishing_aspect: 'StateRegistration-domain fee: with annual_gross_receipts_cents 3,000,000,000 the ESTIMATED variant

      (10% share -> E = 300,000,000) lands in tier 4 and yields 2,550,000, while the ACTUAL variant with

      contributions 20,000,000 lands in tier 3 and yields 30,000 — same org, same endpoint, different

      variant selected purely by whether contributions_in_state_cents is supplied.

      '
    test_recipe:
      setup:
      - One nonprofit with annual_gross_receipts_cents = 3,000,000,000
      - Two REGISTERED registrations (CA, NY), each current_period_end 2026-10-01T00:00:00Z (61 days after the default clock — inside the 90-day renewal window, still
        REGISTERED because the 60-day RENEWAL_DUE mark at 2026-08-02 is not yet reached)
      setup_api_calls:
      - call: POST /boardgov/nonprofits
        payload:
          name: Fee Org
          ein: EIN-FEE-1
          state_of_incorporation: CA
          fiscal_year_end_month: 12
          annual_gross_receipts_cents: 3000000000
        as: GovernanceAdmin
        captures:
          np: $.data.id
      - call: POST /boardgov/state-registrations
        payload:
          nonprofit_id: ${np}
          state_code: CA
          current_period_end: '2026-10-01T00:00:00Z'
        as: ComplianceOfficer
        captures:
          reg_ca: $.data.id
      - call: POST /boardgov/state-registrations
        payload:
          nonprofit_id: ${np}
          state_code: NY
          current_period_end: '2026-10-01T00:00:00Z'
        as: ComplianceOfficer
        captures:
          reg_ny: $.data.id
      trigger:
      - call: POST /boardgov/state-registrations/${reg_ca}/submit_renewal
        payload:
          paid_fee_cents: 2550000
        as: ComplianceOfficer
        captures:
          fee_ca: $.data.renewal_fee_cents
          st_ca: $.data.status
      - call: POST /boardgov/state-registrations/${reg_ny}/submit_renewal
        payload:
          contributions_in_state_cents: 20000000
          paid_fee_cents: 30000
        as: ComplianceOfficer
        captures:
          fee_ny: $.data.renewal_fee_cents
          st_ny: $.data.status
      assert:
      - 'CA (ESTIMATED): E = round_half_up(3,000,000,000 * 0.10) = 300,000,000 -> tier 4 -> 50,000 + ceil(250,000,000/100,000)*1,000 = 50,000 + 2,500,000 = 2,550,000;
        captured fee_ca == 2550000'
      - 'NY (ACTUAL): E = 20,000,000 -> tier 3 -> 30,000; captured fee_ny == 30000'
      - Both registrations reach RENEWAL_SUBMITTED; fee_ca != fee_ny (variant divergence on the same org)
  - name: evaluation_composite_unweighted_vs_weighted
    grounds:
    - calculations.evaluation_composite
    - entities.ExecutiveEvaluation.fields.provisional_composite
    - entities.ExecutiveEvaluation.fields.final_composite
    - state_machines.ExecutiveEvaluation.COMMITTEE_REVIEW_to_RATIFIED
    distinguishing_aspect: 'ExecutiveEvaluation-domain composite: identical scores [5,5,5,1,1] produce provisional 3.40

      (unweighted mean, working number while DRAFT/COMMITTEE_REVIEW) and final 3.80 (dimension-weighted,

      computed at ratify) — two valid algorithms over the same inputs giving different published numbers,

      with rating MEETS driven by the weighted variant only.

      '
    test_recipe:
      setup:
      - Org with adopted bylaws; chair C and treasurer T ACTIVE (terms from 2026-01-01)
      - ExecutiveEvaluation for FY2026 in DRAFT
      setup_api_calls:
      - call: POST /boardgov/nonprofits
        payload:
          name: Eval Org
          ein: EIN-EVAL-1
          state_of_incorporation: CA
          fiscal_year_end_month: 12
          annual_gross_receipts_cents: 4000000000
        as: GovernanceAdmin
        captures:
          np: $.data.id
      - call: POST /boardgov/bylaws
        payload:
          nonprofit_id: ${np}
          quorum_pct: 50
          quorum_basis: SEATED
          amendment_threshold_pct: 67
          term_length_years: 2
          max_consecutive_terms: 3
          term_cooloff_years: 1
          board_size: 5
        as: GovernanceAdmin
        captures:
          by: $.data.id
      - call: POST /boardgov/bylaws/${by}/adopt
        payload: {}
        as: GovernanceAdmin
      - call: POST /boardgov/board-members
        payload:
          nonprofit_id: ${np}
          full_name: Chair
          email: chair@x.org
          skill_tags:
          - GOVERNANCE
          officer_role: CHAIR
        as: GovernanceAdmin
        captures:
          c: $.data.id
      - call: POST /boardgov/board-members
        payload:
          nonprofit_id: ${np}
          full_name: Treas
          email: treas@x.org
          skill_tags:
          - FINANCE
          officer_role: TREASURER
        as: GovernanceAdmin
        captures:
          t: $.data.id
      - call: POST /boardgov/board-terms
        payload:
          nonprofit_id: ${np}
          board_member_id: ${c}
          start_date: '2026-01-01T00:00:00Z'
        as: GovernanceAdmin
      - call: POST /boardgov/board-terms
        payload:
          nonprofit_id: ${np}
          board_member_id: ${t}
          start_date: '2026-01-01T00:00:00Z'
        as: GovernanceAdmin
      - call: POST /boardgov/executive-evaluations
        payload:
          nonprofit_id: ${np}
          fiscal_year: 2026
          executive_name: ED Smith
        as: BoardChair
        as_user_id: ${c}
        captures:
          ev: $.data.id
          ev_v: $.data.version
      trigger:
      - call: PATCH /boardgov/executive-evaluations/${ev}/scores
        payload:
          expected_evaluation_version: ${ev_v}
          scores:
          - dimension: LEADERSHIP
            score: 5
          - dimension: FUNDRAISING
            score: 5
          - dimension: FINANCIAL
            score: 5
          - dimension: PROGRAM
            score: 1
          - dimension: GOVERNANCE
            score: 1
        as: BoardChair
        as_user_id: ${c}
        captures:
          prov: $.data.provisional_composite
      - call: POST /boardgov/executive-evaluations/${ev}/submit_review
        payload: {}
        as: BoardChair
        as_user_id: ${c}
      - call: POST /boardgov/executive-evaluations/${ev}/ratify
        payload: {}
        as: Treasurer
        as_user_id: ${t}
        captures:
          fin: $.data.final_composite
          rating: $.data.rating
          st: $.data.status
      assert:
      - captured prov == 3.40 (unweighted mean 17/5, round_half_up 2dp)
      - captured fin == 3.80 (5*0.30 + 5*0.20 + 5*0.20 + 1*0.20 + 1*0.10)
      - captured rating == MEETS (3.80 in [3.00, 4.25)) and st == RATIFIED
      - 'ratified_by_user_id == ${t} (SoD: ratifier is the treasurer, not the chair who recorded)'
- rule_id: combinatorial_formula
  instances:
  - name: amendment_threshold_nested_branch_max_ceil
    grounds:
    - calculations.amendment_adoption_threshold
    - calculations.motion_outcome
    - state_machines.BylawsAmendment.PROPOSED_to_ADOPTED
    distinguishing_aspect: 'Mode (a) — >=3 inputs with non-linear interaction and a conditional branch on entity state:

      board_size 8, amendment_threshold_pct 67, active_count 6 -> active_count >= ceil(0.75*8)=6 so

      basis = 6 and required = max(2, ceil(0.67*6)) = 5; the SAME vote tally against a basis of 8

      (had active_count been 5) would have required 6. Asserts the vacancy branch and nested max/ceil.

      '
    test_recipe:
      setup:
      - Org with board_size 8, amendment_threshold_pct 67, quorum_pct 50 SEATED; 6 ACTIVE members (chair + 5 directors), terms from 2026-01-01
      - Amendment PROPOSED changing quorum_pct to 60; board meeting 2026-08-01T00:00:00Z in session with all 6 present; BYLAWS motion linked to the amendment
      setup_api_calls:
      - call: POST /boardgov/nonprofits
        payload:
          name: Amend Org
          ein: EIN-AMEND-1
          state_of_incorporation: CA
          fiscal_year_end_month: 12
          annual_gross_receipts_cents: 4000000000
        as: GovernanceAdmin
        captures:
          np: $.data.id
      - call: POST /boardgov/bylaws
        payload:
          nonprofit_id: ${np}
          quorum_pct: 50
          quorum_basis: SEATED
          amendment_threshold_pct: 67
          term_length_years: 2
          max_consecutive_terms: 3
          term_cooloff_years: 1
          board_size: 8
        as: GovernanceAdmin
        captures:
          by: $.data.id
      - call: POST /boardgov/bylaws/${by}/adopt
        payload: {}
        as: GovernanceAdmin
      - call: POST /boardgov/board-members
        payload:
          nonprofit_id: ${np}
          full_name: Chair
          email: c@x.org
          skill_tags:
          - GOVERNANCE
          officer_role: CHAIR
        as: GovernanceAdmin
        captures:
