            - call: "POST /quotes/${quote_id}/line-items"
              payload: { surface_type: "SIDING", service_type: "HOUSE_WASH", measured_sqft: 100000 }
              as: Dispatcher
          trigger:
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Dispatcher
              captures: { sub: $.data.subtotal_cents, travel: $.data.travel_surcharge_cents, total: $.data.total_cents }
          assert:
            - "ServiceQuote.${quote_id}.subtotal_cents == 1500000"
            - "ServiceQuote.${quote_id}.travel_surcharge_cents == 3750"
            - "ServiceQuote.${quote_id}.total_cents == 1503750"

      - name: send_empty_quote_zero_line_items_rejected
        grounds:
          - validations[priority=7]
          - state_machines.ServiceQuote.DRAFT_to_SENT
          - errors[ERR_QUOTE_EMPTY]
