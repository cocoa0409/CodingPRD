              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pickup-slots"
              payload: { store_id: "${s_id}", window_start: "2026-06-02T00:00:00Z", window_end: "2026-06-02T02:00:00Z", capacity: 5, cutoff_offset_minutes: 0 }
              as: PlatformAdmin
              captures: { slot_id: $.data.id, sv0: $.data.version }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "C1", phone: "1" }
              as: Anonymous
              captures: { c1_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c2@x.com", full_name: "C2", phone: "2" }
              as: Anonymous
              captures: { c2_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c1_id}", store_id: "${s_id}" }
              as: Customer
              as_user_id: "${c1_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /orders/${o1_id}/lines"
              payload: { product_id: "${p_id}", qty_ordered: 1 }
              as: Customer
              as_user_id: "${c1_id}"
            - call: "POST /orders/${o1_id}/submit"
              payload: { slot_id: "${slot_id}", expected_slot_version: "${sv0}" }
              as: Customer
              as_user_id: "${c1_id}"
            - call: "POST /orders"
              payload: { customer_id: "${c2_id}", store_id: "${s_id}" }
              as: Customer
              as_user_id: "${c2_id}"
              captures: { o2_id: $.data.id }
            - call: "POST /orders/${o2_id}/lines"
              payload: { product_id: "${p_id}", qty_ordered: 1 }
              as: Customer
              as_user_id: "${c2_id}"
            - call: "POST /curbside-checkins"
              payload: { order_id: "${o1_id}", store_id: "${s_id}", vehicle_description: "car1" }
              as: Customer
              as_user_id: "${c1_id}"
              captures: { ci1_id: $.data.id }
          trigger:
            - call: "POST /curbside-checkins"
              payload: { order_id: "${o2_id}", store_id: "${s_id}", vehicle_description: "car2" }
              as: Customer
              as_user_id: "${c2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "second check-in returns 409 with error_id == ERR_CURBSIDE_FULL (active_curbside_count 1 == curbside_spaces 1, open-ended occupation)"
            - "Store.${s_id}.active_curbside_count == 1 (only the first occupation is open)"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: inventory_units_conserved_on_submit_then_cancel
        grounds:
          - state_machines.Order.DRAFT_to_SUBMITTED
          - state_machines.Order.SUBMITTED_to_CANCELLED
          - entities.StoreInventory.fields.on_hand
          - entities.StoreInventory.fields.reserved
          - calculations.inventory_availability
        distinguishing_aspect: |
          Conserved quantity = inventory units. Forward action (submit reserves 2:
          reserved 0→2, on_hand untouched) paired with compensating action (cancel a
          SUBMITTED order releases: reserved 2→0) leaves on_hand and reserved exactly at
          pre-submit values — invariant: StoreInventory.on_hand == on_hand_before AND
          StoreInventory.reserved == reserved_before AND available == available_before.
        test_recipe:
          setup:
            - "StoreInventory on_hand 5 reserved 0 available 5; order with line P x2 in DRAFT"
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA", curbside_spaces: 2, hold_window_minutes: 60 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P", name: "Prod P", unit_price_cents: 1000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${s_id}", product_id: "${p_id}", on_hand: 5 }
              as: PlatformAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pickup-slots"
              payload: { store_id: "${s_id}", window_start: "2026-06-02T00:00:00Z", window_end: "2026-06-02T02:00:00Z", capacity: 5, cutoff_offset_minutes: 0 }
              as: PlatformAdmin
              captures: { slot_id: $.data.id, sv0: $.data.version }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "Cust", phone: "111" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${s_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${p_id}", qty_ordered: 2 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${o_id}/submit"
              payload: { slot_id: "${slot_id}", expected_slot_version: "${sv0}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /store-inventory/${inv_id}"
              payload: {}
              as: StoreManager
              captures: { res_mid: $.data.reserved, avail_mid: $.data.available, oh_mid: $.data.on_hand }
            - call: "POST /orders/${o_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /store-inventory/${inv_id}"
              payload: {}
              as: StoreManager
              captures: { res_after: $.data.reserved, avail_after: $.data.available, oh_after: $.data.on_hand }
          assert:
            - "mid-state (after submit): reserved == 2, on_hand == 5, available == 3"
            - "after cancel: StoreInventory.${inv_id}.reserved == 0 == pre-submit value"
            - "after cancel: StoreInventory.${inv_id}.on_hand == 5 == pre-submit value"
            - "after cancel: StoreInventory.${inv_id}.available == 5 == pre-submit value (units conserved, no drift)"

      - name: money_conserved_captured_plus_refunded_equals_authorized
        grounds:
          - state_machines.Order.AWAITING_PICKUP_to_PARTIALLY_PICKED_UP
          - state_machines.Order.PARTIALLY_PICKED_UP_to_COMPLETED
          - calculations.order_captured_total
          - calculations.order_refunded_total
          - entities.Order.fields.authorized_total_cents
        distinguishing_aspect: |
          Conserved quantity = money cents (DIFFERENT from inventory units above). Forward
          action (partial pickup captures the handed-over units) paired with compensating
          action (close refunds the not-handed-over remainder) leaves the named global
          quantity intact: captured_total_cents + refunded_total_cents ==
          authorized_total_cents, with no drift.
        test_recipe:
          setup:
            - "Order lines A x2 (1500) and C x3 (1000), authorized 6000, all picked, AWAITING_PICKUP, verified"
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA", curbside_spaces: 2, hold_window_minutes: 60 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "A", name: "Prod A", unit_price_cents: 1500 }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "C", name: "Prod C", unit_price_cents: 1000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${s_id}", product_id: "${a_id}", on_hand: 5 }
              as: PlatformAdmin
            - call: "POST /store-inventory"
              payload: { store_id: "${s_id}", product_id: "${c_id}", on_hand: 5 }
              as: PlatformAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pickup-slots"
              payload: { store_id: "${s_id}", window_start: "2026-06-02T00:00:00Z", window_end: "2026-06-02T02:00:00Z", capacity: 5, cutoff_offset_minutes: 0 }
              as: PlatformAdmin
              captures: { slot_id: $.data.id, sv0: $.data.version }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "Cust", phone: "111" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${s_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${a_id}", qty_ordered: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { la_id: $.data.id }
            - call: "POST /orders/${o_id}/lines"
              payload: { product_id: "${c_id}", qty_ordered: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { lc_id: $.data.id }
            - call: "POST /orders/${o_id}/submit"
              payload: { slot_id: "${slot_id}", expected_slot_version: "${sv0}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${o_id}/start-picking"
              payload: {}
              as: StorePicker
            - call: "POST /order-lines/${la_id}/pick"
              payload: { qty_picked: 2 }
              as: StorePicker
            - call: "POST /order-lines/${lc_id}/pick"
              payload: { qty_picked: 3 }
              as: StorePicker
            - call: "POST /orders/${o_id}/stage"
              payload: {}
              as: StorePicker
            - call: "POST /orders/${o_id}/ready"
              payload: {}
              as: StorePicker
            - call: "POST /orders/${o_id}/verify"
              payload: { presented_name: "Cust", presented_phone: "111" }
              as: StoreAssociate
          trigger:
            - call: "POST /orders/${o_id}/pickup"
              payload: { handovers: [ { order_line_id: "${la_id}", qty_handed_over: 2 } ] }
              as: StoreAssociate
              captures: { cap_mid: $.data.captured_total_cents, fs_mid: $.data.fulfillment_status }
            - call: "POST /orders/${o_id}/close"
              payload: {}
              as: StoreAssociate
              captures: { cap: $.data.captured_total_cents, ref: $.data.refunded_total_cents, auth: $.data.authorized_total_cents, fs: $.data.fulfillment_status }
          assert:
            - "after partial pickup: captured_total_cents == 3000, fulfillment_status == PARTIALLY_PICKED_UP"
            - "after close: Order.${o_id}.refunded_total_cents == 3000 (the not-handed-over remainder)"
            - "after close: captured_total_cents 3000 + refunded_total_cents 3000 == authorized_total_cents 6000 (money conserved, no drift)"
            - "after close: Order.${o_id}.fulfillment_status == COMPLETED"
