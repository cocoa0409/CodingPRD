# =============================================================================
# §1.9 Scaffold Corner Design — Best Execution & Trade Surveillance
# Breadth coverage of §1.1–§1.7 claims not already probed by §1.8.
# Every instance is a standalone test from empty-DB; logical clock default
# 2026-08-01T00:00:00Z. All `$.data[...]` capture values are quoted.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_employee_applies_system_defaults
        claim_type: creation
        grounds: ["entities.Employee", "endpoints[\"POST /surveillance/employees\"]"]
        distinguishing_aspect: "201 creation stamps employment_status=ACTIVE, attestation_status computed CURRENT when due_at is >30d out, version=1, and id is a server-minted UUID."
        test_recipe:
          setup: ["empty DB, default clock 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /surveillance/employees", payload: { full_name: "Ada New", employee_ref: "EMP-001", department: "TRADING", attestation_due_at: "2027-01-01T00:00:00Z" }, as: ComplianceAdmin, captures: { e_id: "$.data.id", e_emp: "$.data.employment_status", e_att: "$.data.attestation_status", e_ver: "$.data.version", e_cases: "$.data.open_case_count" } }
          assert:
            - "${e_emp} == ACTIVE and ${e_att} == CURRENT (due 2027-01-01 is > 30 days from default clock)"
            - "${e_ver} == 1 and ${e_cases} == 0 and training_overdue_count == 0"
            - "last_attested_at is null; id is present and server-minted"
      - name: employee_initial_attestation_lapsed_from_clock
        claim_type: computed_fields
        grounds: ["entities.Employee.fields.attestation_status"]
        distinguishing_aspect: "Initial attestation_status is computed against the logical clock at creation: a past attestation_due_at yields LAPSED before any ops run."
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / state_beats_safety_on_denied_trade_decide"
          rationale: "That instance asserts $.data.attestation_status == LAPSED at creation (capture e_att) as its setup sanity check."
      - name: create_limit_order_without_price_returns_422
        claim_type: required_fields
        grounds: ["entities.Order.fields.limit_price_cents", "errors[ERR_LIMIT_PRICE_REQUIRED]"]
        distinguishing_aspect: "LIMIT order without limit_price_cents is rejected; MARKET order carrying limit_price_cents is equally rejected (conditional field, both directions)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /surveillance/orders", payload: { client_ref: "L1", symbol: "ACME", side: "BUY", quantity: 10, order_type: "LIMIT", arrival_nbbo_bid_cents: 9990, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { err1: "$.data.error_id" } }
            - { call: "POST /surveillance/orders", payload: { client_ref: "L2", symbol: "ACME", side: "BUY", quantity: 10, order_type: "MARKET", limit_price_cents: 10000, arrival_nbbo_bid_cents: 9990, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { err2: "$.data.error_id" } }
          assert:
            - "${err1} == ERR_LIMIT_PRICE_REQUIRED and ${err2} == ERR_LIMIT_PRICE_REQUIRED"
      - name: create_order_with_invalid_enum_returns_400
        claim_type: type_constraints
        grounds: ["entities.Order.fields.order_type", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "order_type outside {MARKET, LIMIT, MARKET_ON_CLOSE} is a shape violation."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /surveillance/orders", payload: { client_ref: "E1", symbol: "ACME", side: "BUY", quantity: 10, order_type: "ICEBERG", arrival_nbbo_bid_cents: 9990, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
      - name: create_order_nonpositive_quantity_returns_400
        claim_type: type_constraints
        grounds: ["entities.Order.fields.quantity", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "quantity must be > 0; zero is rejected."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /surveillance/orders", payload: { client_ref: "Z1", symbol: "ACME", side: "BUY", quantity: 0, order_type: "MARKET", arrival_nbbo_bid_cents: 9990, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
      - name: create_order_ask_not_above_bid_returns_400
        claim_type: type_constraints
        grounds: ["entities.Order.fields.arrival_nbbo_ask_cents", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Locked market input (ask == bid) violates ask > bid."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /surveillance/orders", payload: { client_ref: "NB1", symbol: "ACME", side: "BUY", quantity: 10, order_type: "MARKET", arrival_nbbo_bid_cents: 10000, arrival_nbbo_ask_cents: 10000 }, as: OpsAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
      - name: duplicate_venue_code_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_DUPLICATE_VENUE_CODE]"]
        distinguishing_aspect: "venue_code uniqueness is enforced at create."
        test_recipe:
          setup: ["Venue NYSE exists"]
          setup_api_calls:
            - { call: "POST /surveillance/venues", payload: { venue_code: "NYSE", name: "New York Stock Exchange", venue_type: "EXCHANGE" }, as: ComplianceAdmin }
          trigger:
            - { call: "POST /surveillance/venues", payload: { venue_code: "NYSE", name: "Duplicate", venue_type: "ATS" }, as: ComplianceAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_DUPLICATE_VENUE_CODE"
      - name: duplicate_employee_ref_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_DUPLICATE_EMPLOYEE_REF]"]
        distinguishing_aspect: "employee_ref uniqueness is enforced at create."
        test_recipe:
          setup: ["Employee EMP-900 exists"]
          setup_api_calls:
            - { call: "POST /surveillance/employees", payload: { full_name: "First One", employee_ref: "EMP-900", department: "TRADING", attestation_due_at: "2027-01-01T00:00:00Z" }, as: ComplianceAdmin }
          trigger:
            - { call: "POST /surveillance/employees", payload: { full_name: "Second One", employee_ref: "EMP-900", department: "COMPLIANCE", attestation_due_at: "2027-01-01T00:00:00Z" }, as: ComplianceAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_DUPLICATE_EMPLOYEE_REF"
      - name: duplicate_snapshot_key_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_DUPLICATE_SNAPSHOT]"]
        distinguishing_aspect: "Snapshot key (venue_id, order_type, period_month, variant) is unique; the same key with the SAME variant collides."
        test_recipe:
          setup: ["Venue NYSE; snapshot (NYSE, MARKET, 2026-08, FAR_TOUCH) exists"]
          setup_api_calls:
            - { call: "POST /surveillance/venues", payload: { venue_code: "NYSE", name: "New York Stock Exchange", venue_type: "EXCHANGE" }, as: ComplianceAdmin, captures: { v_id: "$.data.id" } }
            - { call: "POST /surveillance/execution-quality-snapshots", payload: { venue_id: "${v_id}", order_type: "MARKET", period_month: "2026-08", variant: "FAR_TOUCH" }, as: ComplianceAdmin }
          trigger:
            - { call: "POST /surveillance/execution-quality-snapshots", payload: { venue_id: "${v_id}", order_type: "MARKET", period_month: "2026-08", variant: "FAR_TOUCH" }, as: ComplianceAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_DUPLICATE_SNAPSHOT"
      - name: snapshot_variant_is_part_of_uniqueness_key
        claim_type: satisfaction_pass
        grounds: ["validations[priority=6]", "entities.ExecutionQualitySnapshot.fields.variant"]
        distinguishing_aspect: "Same (venue, type, month) with a DIFFERENT variant is a distinct key and must succeed."
        excluded_because:
          difficulty_instance: "dual_variant_calc / quality_benchmark_variants_diverge"
          rationale: "That instance creates FAR_TOUCH and MIDPOINT snapshots over the same bucket; both creations succeed."
      - name: duplicate_disclosure_quarter_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_DUPLICATE_DISCLOSURE]"]
        distinguishing_aspect: "At most one non-SUPERSEDED disclosure per quarter; a second create must revise instead."
        test_recipe:
          setup: ["DRAFT disclosure for 2026-Q3 exists"]
          setup_api_calls:
            - { call: "POST /surveillance/pfof-disclosures", payload: { quarter: "2026-Q3", pricing_variant: "MARGINAL" }, as: FilingOfficer }
          trigger:
            - { call: "POST /surveillance/pfof-disclosures", payload: { quarter: "2026-Q3", pricing_variant: "RETROACTIVE" }, as: FilingOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_DUPLICATE_DISCLOSURE"
      - name: get_missing_venue_returns_404
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Reading a random UUID yields the error envelope with ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /surveillance/venues/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: ComplianceAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_NOT_FOUND and response_type == error"
      - name: restricted_entry_inverted_window_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", "errors[ERR_INVALID_WINDOW]"]
        distinguishing_aspect: "effective_to <= effective_from is malformed."
        test_recipe:
          setup: ["default clock"]
          setup_api_calls: []
          trigger:
            - { call: "POST /surveillance/restricted-list-entries", payload: { symbol: "ACME", restriction_kind: "ALL", effective_from: "2026-09-20T00:00:00Z", effective_to: "2026-09-10T00:00:00Z" }, as: ComplianceAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_INVALID_WINDOW"
      - name: restricted_entry_backdated_window_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", "errors[ERR_INVALID_WINDOW]"]
        distinguishing_aspect: "effective_from must be strictly in the future at creation (default clock 2026-08-01; 2026-07-01 is past)."
        test_recipe:
          setup: ["default clock"]
          setup_api_calls: []
          trigger:
            - { call: "POST /surveillance/restricted-list-entries", payload: { symbol: "ACME", restriction_kind: "ALL", effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-10T00:00:00Z" }, as: ComplianceAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_INVALID_WINDOW"
      - name: personal_trade_employee_id_taken_from_identity
        claim_type: system_fields
        grounds: ["entities.PersonalTrade.fields.employee_id", "endpoints[\"POST /surveillance/personal-trades\"]"]
        distinguishing_aspect: "The create payload has no employee_id; the server stamps it from X-User-ID (entity_backed role identity)."
        test_recipe:
          setup: ["Employee EMP-100 ACTIVE/CURRENT"]
          setup_api_calls:
            - { call: "POST /surveillance/employees", payload: { full_name: "Ida Self", employee_ref: "EMP-100", department: "TRADING", attestation_due_at: "2027-01-01T00:00:00Z" }, as: ComplianceAdmin, captures: { e_id: "$.data.id" } }
          trigger:
            - { call: "POST /surveillance/personal-trades", payload: { symbol: "ACME", side: "BUY", quantity: 25 }, as: CoveredEmployee, as_user_id: "${e_id}", captures: { t_emp: "$.data.employee_id", t_status: "$.data.status" } }
          assert:
            - "${t_emp} == ${e_id} (server-stamped, never from body) and ${t_status} == PRECLEARANCE_REQUESTED"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: order_execute_from_received_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Order", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "EXECUTED requires ROUTED first; skipping the routing hop is a state violation."
        test_recipe:
          setup: ["Order RECEIVED"]
          setup_api_calls:
            - { call: "POST /surveillance/orders", payload: { client_ref: "S1", symbol: "ACME", side: "BUY", quantity: 10, order_type: "MARKET", arrival_nbbo_bid_cents: 9990, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { o_id: "$.data.id" } }
          trigger:
            - { call: "POST /surveillance/orders/${o_id}/transition", payload: { to_status: "EXECUTED", executed_price_cents: 10000, executed_at: "2026-08-01T00:00:00Z" }, as: OpsAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_INVALID_STATE"
      - name: executed_order_is_terminal
        claim_type: terminal_lockdown
        grounds: ["state_machines.Order"]
        distinguishing_aspect: "EXECUTED is terminal; a subsequent cancel attempt is rejected."
        test_recipe:
          setup: ["Venue + ACTIVE arrangement + EXECUTED order"]
          setup_api_calls:
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T14:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/venues", payload: { venue_code: "NYSE", name: "New York Stock Exchange", venue_type: "EXCHANGE" }, as: ComplianceAdmin, captures: { v_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements", payload: { venue_id: "${v_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", pfof_tiers: [ { min_monthly_shares: 0, rate_cents_per_share: 0.10 } ], routing_fee_bps: 2 }, as: ComplianceAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements/${a_id}/transition", payload: { to_status: "ACTIVE" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/orders", payload: { client_ref: "T1", symbol: "ACME", side: "BUY", quantity: 10, order_type: "MARKET", arrival_nbbo_bid_cents: 9990, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { o_id: "$.data.id" } }
            - { call: "POST /surveillance/orders/${o_id}/transition", payload: { to_status: "ROUTED", arrangement_id: "${a_id}" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders/${o_id}/transition", payload: { to_status: "EXECUTED", executed_price_cents: 10000, executed_at: "2026-08-10T14:00:00Z" }, as: OpsAdmin }
          trigger:
            - { call: "POST /surveillance/orders/${o_id}/transition", payload: { to_status: "CANCELLED" }, as: OpsAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_INVALID_STATE"
      - name: terminated_arrangement_admits_no_transition
        claim_type: terminal_lockdown
        grounds: ["state_machines.RoutingArrangement"]
        distinguishing_aspect: "TERMINATED is terminal for arrangements; reinstatement attempts fail."
        test_recipe:
          setup: ["Venue NYSE; arrangement TERMINATED from NEGOTIATION"]
          setup_api_calls:
            - { call: "POST /surveillance/venues", payload: { venue_code: "NYSE", name: "New York Stock Exchange", venue_type: "EXCHANGE" }, as: ComplianceAdmin, captures: { v_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements", payload: { venue_id: "${v_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", pfof_tiers: [ { min_monthly_shares: 0, rate_cents_per_share: 0.10 } ], routing_fee_bps: 2 }, as: ComplianceAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements/${a_id}/transition", payload: { to_status: "TERMINATED" }, as: ComplianceAdmin }
          trigger:
            - { call: "POST /surveillance/routing-arrangements/${a_id}/transition", payload: { to_status: "ACTIVE" }, as: ComplianceAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_INVALID_STATE"
      - name: snapshot_locked_is_terminal
        claim_type: terminal_lockdown
        grounds: ["state_machines.ExecutionQualitySnapshot"]
        distinguishing_aspect: "A LOCKED snapshot cannot be locked again (no LOCKED->LOCKED self loop)."
        test_recipe:
          setup: ["Venue NYSE; snapshot (MARKET, 2026-08) LOCKED with empty scope"]
          setup_api_calls:
            - { call: "POST /surveillance/venues", payload: { venue_code: "NYSE", name: "New York Stock Exchange", venue_type: "EXCHANGE" }, as: ComplianceAdmin, captures: { v_id: "$.data.id" } }
            - { call: "POST /surveillance/execution-quality-snapshots", payload: { venue_id: "${v_id}", order_type: "MARKET", period_month: "2026-08", variant: "FAR_TOUCH" }, as: ComplianceAdmin, captures: { snap: "$.data.id" } }
            - { call: "POST /surveillance/execution-quality-snapshots/${snap}/lock", payload: {}, as: ComplianceAdmin, captures: { s1: "$.data.status", s1_cnt: "$.data.order_count" } }
          trigger:
            - { call: "POST /surveillance/execution-quality-snapshots/${snap}/lock", payload: {}, as: ComplianceAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "First lock succeeds with empty scope: ${s1} == LOCKED, ${s1_cnt} == 0, avg_improvement_cents_per_share == 0 (zero-quantity guard)"
            - "Second lock: ${err} == ERR_INVALID_STATE"
      - name: disclosure_publish_from_draft_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.PfofDisclosure", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "PUBLISHED requires PENDING_APPROVAL; skipping the submit hop is rejected."
        test_recipe:
          setup: ["DRAFT disclosure for 2026-Q3"]
          setup_api_calls:
            - { call: "POST /surveillance/pfof-disclosures", payload: { quarter: "2026-Q3", pricing_variant: "MARGINAL" }, as: FilingOfficer, captures: { d_id: "$.data.id" } }
          trigger:
            - { call: "POST /surveillance/pfof-disclosures/${d_id}/transition", payload: { to_status: "PUBLISHED" }, as: FilingOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_INVALID_STATE"
      - name: disclosure_stale_then_withdraw_recovers_publish
        claim_type: side_effect_execution
        grounds: ["state_machines.PfofDisclosure", "validations[priority=25]", "concurrency_rules[arrangement-amend-stale-version]"]
        distinguishing_aspect: "Version-pinning on approval: submit pins arrangement_version 2; an amend bumps the arrangement to 3; publish fails ERR_DISCLOSURE_STALE; withdraw to DRAFT unfreezes lines; resubmit repins v3 and publish succeeds."
        test_recipe:
          setup: ["Venue + ACTIVE arrangement (version 2 after activation) + one EXECUTED order + disclosure PENDING_APPROVAL with lines pinning arrangement v2"]
          setup_api_calls:
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T14:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/venues", payload: { venue_code: "NYSE", name: "New York Stock Exchange", venue_type: "EXCHANGE" }, as: ComplianceAdmin, captures: { v_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements", payload: { venue_id: "${v_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", pfof_tiers: [ { min_monthly_shares: 0, rate_cents_per_share: 0.10 } ], routing_fee_bps: 2 }, as: ComplianceAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements/${a_id}/transition", payload: { to_status: "ACTIVE" }, as: ComplianceAdmin, captures: { a_v2: "$.data.version" } }
            - { call: "POST /surveillance/orders", payload: { client_ref: "ST1", symbol: "ACME", side: "BUY", quantity: 1000, order_type: "MARKET", arrival_nbbo_bid_cents: 9990, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { o_id: "$.data.id" } }
            - { call: "POST /surveillance/orders/${o_id}/transition", payload: { to_status: "ROUTED", arrangement_id: "${a_id}" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders/${o_id}/transition", payload: { to_status: "EXECUTED", executed_price_cents: 10000, executed_at: "2026-08-10T14:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/pfof-disclosures", payload: { quarter: "2026-Q3", pricing_variant: "MARGINAL" }, as: FilingOfficer, captures: { d_id: "$.data.id" } }
            - { call: "POST /surveillance/pfof-disclosures/${d_id}/transition", payload: { to_status: "PENDING_APPROVAL" }, as: FilingOfficer }
          trigger:
            - { call: "POST /surveillance/routing-arrangements/${a_id}/amend", payload: { expected_arrangement_version: "${a_v2}", routing_fee_bps: 3 }, as: ComplianceAdmin, captures: { a_v3: "$.data.version" } }
            - { call: "POST /surveillance/pfof-disclosures/${d_id}/transition", payload: { to_status: "PUBLISHED" }, as: FilingOfficer, captures: { err_stale: "$.data.error_id" } }
            - { call: "POST /surveillance/pfof-disclosures/${d_id}/transition", payload: { to_status: "DRAFT" }, as: FilingOfficer }
            - { call: "POST /surveillance/pfof-disclosures/${d_id}/transition", payload: { to_status: "PENDING_APPROVAL" }, as: FilingOfficer }
            - { call: "POST /surveillance/pfof-disclosures/${d_id}/transition", payload: { to_status: "PUBLISHED" }, as: FilingOfficer, captures: { d_status: "$.data.status", d_line_ver: "$.data.venue_lines" } }
          assert:
            - "Amend bumps arrangement to v3: ${a_v3} == 3 (from pinned v2)"
            - "Publish against stale pin: ${err_stale} == ERR_DISCLOSURE_STALE"
            - "Withdraw (PENDING_APPROVAL->DRAFT) unfreezes lines; resubmit repins v3; publish succeeds: ${d_status} == PUBLISHED and the venue line's arrangement_version == 3"
      - name: review_return_to_draft_clears_votes
        claim_type: side_effect_execution
        grounds: ["state_machines.BestExReview"]
        distinguishing_aspect: "The rework cycle IN_COMMITTEE->DRAFT wipes voter_user_ids; after resubmission the same members may vote again without ERR_DUPLICATE_VOTE."
        test_recipe:
          setup: ["Venue NYSE ACTIVE; LOCKED snapshot (empty scope OK); review IN_COMMITTEE with 2 votes recorded"]
          setup_api_calls:
            - { call: "POST /surveillance/venues", payload: { venue_code: "NYSE", name: "New York Stock Exchange", venue_type: "EXCHANGE" }, as: ComplianceAdmin, captures: { v_id: "$.data.id" } }
            - { call: "POST /surveillance/execution-quality-snapshots", payload: { venue_id: "${v_id}", order_type: "MARKET", period_month: "2026-08", variant: "FAR_TOUCH" }, as: ComplianceAdmin, captures: { snap: "$.data.id" } }
            - { call: "POST /surveillance/execution-quality-snapshots/${snap}/lock", payload: {}, as: ComplianceAdmin }
            - { call: "POST /surveillance/best-ex-reviews", payload: { quarter: "2026-Q3", snapshot_ids: [ "${snap}" ], venue_decisions: [ { venue_id: "${v_id}", determination: "CONTINUE" } ] }, as: BestExAnalyst, as_user_id: "ba-1", captures: { r_id: "$.data.id" } }
            - { call: "POST /surveillance/best-ex-reviews/${r_id}/transition", payload: { to_status: "IN_COMMITTEE" }, as: BestExAnalyst, as_user_id: "ba-1" }
