            - "Subscriber.${sub1_id}.status == DUPLICATE_HOLD immediately after the verifier MATCH"
            - "the first trigger returns HTTP 409 and ${err_check} == ERR_ELIGIBILITY_CHECK_NOT_CONFIRMED"
            - "EligibilityCheck.${chk2_id}.status == PENDING_VERIFIER"
            - "the second trigger returns HTTP 409 and ${err_sub} == ERR_SUBSCRIBER_NOT_ELIGIBLE"
            - "${addr1_status_after} == RESOLVED_MULTI_HOUSEHOLD"
            - "Subscriber.${sub1_id}.status == VERIFIED_ELIGIBLE after the resolution"
            - "the last trigger returns HTTP 201 and ${enr_status} == ACTIVE"
            - "Enrollment.${enr_id}.eligibility_check_id == ${chk1_id}"
            - "HouseholdAddress.${addr1_id}.max_permitted_benefit_slots == 2"
            - "HouseholdAddress.${addr1_id}.occupied_benefit_slots == 1"

      - name: recert_response_accepted_at_the_deadline_instant_and_closed_one_ms_later
        claim_type: temporal_validation
        grounds:
          - validations[priority=84]
          - calculations.recertification_window
          - errors[ERR_RECERT_WINDOW_CLOSED]
        distinguishing_aspect: |
          The response window is proved CLOSED at its upper end at millisecond resolution by
          two enrollments noticed by the SAME sweep: E1 recertifies at exactly
          2027-08-01T23:59:59.999Z and is accepted (and re-anchors its cycle on the RESPONSE
          date, giving 2028-07-31 in a leap year), while E2 recertifies one millisecond later
          and is refused with ERR_RECERT_WINDOW_CLOSED while still sitting in NOTICED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one ACTIVE carrier licensed in TX with cap 50 and two VOICE enrollments E1 then E2 at two dwellings, both starting 2026-08-01, so both have recert_due_date 2027-08-01."
            - "At 2027-06-01T00:00:00Z both enrollments post a usage event, so the sweep cannot flag them for non-usage (idle_days is 1)."
            - "The sweep runs at 2027-06-02T00:00:00Z, exactly recert_due_date minus 60 days, and notices both in benefit_start_date then created_at order, writing recert_response_deadline_at 2027-08-01T23:59:59.999Z."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
