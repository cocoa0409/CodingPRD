  - rule_id: compensating_invariant
    instances:
      - name: grant_awarded_equals_remaining_plus_allocated_across_reversal
        grounds:
          - conservation_invariants.grant_balance_partition
          - state_machines.FundingAllocation.ALLOCATED_to_RELEASED
          - entities.Grant.fields.remaining_amount_cents
          - calculations.funding_waterfall_allocation
        distinguishing_aspect: |
          The conserved quantity is RESTRICTED GRANT MONEY: awarded_amount_cents must equal
          remaining_amount_cents + the sum of that grant's ALLOCATED lines at all three
          observable instants (before the charge, after the charge, after the reversal),
          with zero drift.
