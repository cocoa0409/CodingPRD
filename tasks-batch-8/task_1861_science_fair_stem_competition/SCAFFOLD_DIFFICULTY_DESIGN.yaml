              payload: {}
              as: FairDirector
            - call: "GET /science-fair/mentors/${men}"
              payload: {}
              as: FairDirector
              captures: { pts_strict: $.data.recognition_points, pts_incl: $.data.leaderboard_points, tier: $.data.recognition_tier }
          assert:
            - "Project.${p1}.advancement_result == ADVANCED and Project.${p2}.advancement_result == WAITLISTED"
            - "Mentor.${men}.recognition_points == 9 (STRICT: 5 ADVANCED + 4 CATEGORY_FIRST; WAITLISTED contributes 0)"
            - "Mentor.${men}.leaderboard_points == 13 (INCLUSIVE: 9 + 4 for the waitlisted P2)"
            - "Mentor.${men}.recognition_tier == NONE (STRICT 9 < 10 — tier is driven by STRICT only, even though leaderboard shows 13)"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: advancement_allocation_tiered_waterfall_with_tiebreak
        grounds:
          - calculations.advancement_allocation
        distinguishing_aspect: |
          Mode (a): a formula with >=3 inputs and non-linear interaction — per-category
          slot caps, floor(slots/2) waitlist depth, cross-category at-large fallback for
          unused slots, and a 4-key ranking expression (final_aggregate DESC, median raw
          DESC, sheet-count DESC, created_at ASC) whose branches depend on entity state.
        test_recipe:
          setup:
            - "Edition (Z_SCORE, max_judges=2, quorum=50) with categories C1 (slots=1) and C2 (slots=2)"
            - "C1: P1 (raw 95/97 -> agg 1.53), P2 (raw 60/62 -> agg -1.29). C2: P3 (raw 80/82 -> agg 0.32), P4 (raw 80/82 -> agg 0.32, ties P3 on median 81 and sheet count 2, loses rank 1 on created_at ASC), P5 (raw 65/67 -> agg -0.89)"
            - "All projects CONFIRMED, JUDGED, PASSED inspection"
          setup_api_calls:
            - call: "POST /science-fair/fair-editions"
              payload: { name: "Adv Edition", normalization_algorithm: "Z_SCORE", max_judges_per_project: 2, min_quorum_ratio_pct: 50 }
              as: FairDirector
              captures: { ed: $.data.id }
            - call: "POST /science-fair/categories"
              payload: { fair_edition_id: "${ed}", code: "C1", name: "Cat1", grade_band: "SENIOR", advancement_slots: 1 }
              as: FairDirector
              captures: { c1: $.data.id }
            - call: "POST /science-fair/categories"
              payload: { fair_edition_id: "${ed}", code: "C2", name: "Cat2", grade_band: "SENIOR", advancement_slots: 2 }
              as: FairDirector
              captures: { c2: $.data.id }
            - call: "POST /science-fair/mentors"
              payload: { full_name: "Mentor A", email: "ma@x.com" }
              as: FairDirector
              captures: { men: $.data.id }
            - call: "POST /science-fair/fair-editions/${ed}/open-registration"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${ed}", category_id: "${c1}", title: "P1", team_size: 1, involves_human_subjects: false, involves_animal_subjects: false }
              as: Mentor
              as_user_id: "${men}"
              captures: { p1: $.data.id }
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${ed}", category_id: "${c1}", title: "P2", team_size: 1, involves_human_subjects: false, involves_animal_subjects: false }
              as: Mentor
              as_user_id: "${men}"
              captures: { p2: $.data.id }
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${ed}", category_id: "${c2}", title: "P3", team_size: 1, involves_human_subjects: false, involves_animal_subjects: false }
              as: Mentor
              as_user_id: "${men}"
              captures: { p3: $.data.id }
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${ed}", category_id: "${c2}", title: "P4", team_size: 1, involves_human_subjects: false, involves_animal_subjects: false }
              as: Mentor
              as_user_id: "${men}"
              captures: { p4: $.data.id }
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${ed}", category_id: "${c2}", title: "P5", team_size: 1, involves_human_subjects: false, involves_animal_subjects: false }
              as: Mentor
