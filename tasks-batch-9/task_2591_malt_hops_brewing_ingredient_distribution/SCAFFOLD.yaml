  - method: GET
    path: "/order-lines"
    description: "List order lines filtered by order, contract, malt lot, propagation job, hop variety, item type or status. The only discovery channel for lines trimmed or quarantined by a cascade."
    roles: [Brewer, AllocationManager, CreditManager, WarehouseOperator, PlatformAdmin]
    code: 200
    input: ["sales_order_id?", "hop_contract_id?", "malt_lot_id?", "yeast_propagation_job_id?", "hop_variety_id?", "item_type?", "allocation_source?", "status?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []

  # ---- ColdStorageZone / ColdChainShipment --------------------------------
  - method: POST
    path: "/cold-storage-zones"
    description: "Commission a temperature-controlled zone with its setpoint, tolerance and pallet capacity. zone_code is unique."
    roles: [WarehouseOperator, PlatformAdmin]
    code: 201
    input: [zone_code, temp_setpoint_c, capacity_pallets, "tolerance_c?"]
    output: ColdStorageZone
    side_effects:
      - "sets occupied_pallets 0"

  - method: GET
    path: "/cold-storage-zones/{id}"
    description: "Fetch a cold storage zone with the pallet occupancy in force at the current logical clock."
    roles: [Brewer, AllocationManager, CreditManager, WarehouseOperator, PlatformAdmin]
    code: 200
    input: []
    output: ColdStorageZone
    side_effects:
      - "runs calculations.zone_occupancy_projection to report occupied_pallets as of the current logical clock"

  - method: POST
    path: "/cold-chain-shipments"
    description: "Stage a reefer load for a cold-chain order in a zone over a half-open staging window, subject to the zone's aggregate pallet capacity. Guarded by optimistic concurrency on the order's version; a new load supersedes the order's prior staged load."
    roles: [WarehouseOperator]
    code: 201
    input: [sales_order_id, cold_storage_zone_id, expected_sales_order_version, pallet_count, stage_from, stage_until, reefer_setpoint_c, "reefer_tolerance_c?"]
    output: ColdChainShipment
    side_effects:
      - "sets status STAGED, excursion_minutes 0, reading_count 0 and last_reading_at null"
      - "runs calculations.zone_occupancy_projection as an admission test over the merged staging intervals and then to update ColdStorageZone.occupied_pallets"
      - "moves any prior STAGED or HELD shipment on this order to SUPERSEDED, releasing its pallets"
      - "increments SalesOrder.version by 1"

  - method: GET
    path: "/cold-chain-shipments/{id}"
    description: "Fetch a reefer load with its accumulated excursion minutes and reading count."
    roles: [Brewer, AllocationManager, CreditManager, WarehouseOperator, PlatformAdmin]
    code: 200
    input: []
    output: ColdChainShipment
    side_effects: []

  - method: GET
    path: "/cold-chain-shipments"
    description: "List reefer loads filtered by order, zone or status. The only discovery channel for a load superseded or held by a cascade."
    roles: [Brewer, AllocationManager, CreditManager, WarehouseOperator, PlatformAdmin]
    code: 200
    input: ["sales_order_id?", "cold_storage_zone_id?", "status?", "limit?", "offset?"]
    output: ColdChainShipment[]
    side_effects: []

  - method: POST
    path: "/cold-chain-shipments/{id}/depart"
    description: "Release the load from the zone onto the road. Requires a picked order with an approved credit decision."
    roles: [WarehouseOperator]
    code: 200
    input: []
    output: ColdChainShipment
    side_effects:
      - "transitions STAGED -> IN_TRANSIT and releases pallet_count from ColdStorageZone.occupied_pallets"
      - "increments ColdChainShipment.version by 1"

  - method: POST
    path: "/cold-chain-shipments/{id}/readings"
    description: "Append a reefer temperature reading. Accumulates out-of-tolerance minutes and, past the excursion ceiling, flags the load, fails its yeast and quarantines its cold-chain hops."
    roles: [WarehouseOperator]
    code: 201
    input: [temp_c, recorded_at]
    output: TemperatureReading
    side_effects:
      - "runs calculations.cold_chain_excursion_assessment, writing the reading's interval_minutes, in_violation and cumulative_excursion_minutes and the shipment's excursion_minutes, reading_count and last_reading_at"
      - "CASCADE C LINK 1: when excursion_minutes exceeds MAX_EXCURSION_MINUTES the shipment transitions IN_TRANSIT -> EXCURSION_FLAGGED"
      - "CASCADE C LINK 2: READY YeastPropagationJobs on the order's YEAST lines transition to FAILED with failure_reason COLD_CHAIN_EXCURSION, and cold-chain HOP lines transition OPEN -> QUARANTINED"
      - "CASCADE C LINK 3: a replacement YeastPropagationJob is created in REQUESTED with replaces_job_id set and pitch_date pushed out by the strain's propagation_lead_time_days"
      - "increments ColdChainShipment.version by 1"

  - method: GET
    path: "/cold-chain-shipments/{id}/readings"
    description: "List the reefer temperature series for a load in recorded_at ASC order with its per-reading violation flags and running excursion total."
    roles: [Brewer, AllocationManager, CreditManager, WarehouseOperator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: TemperatureReading[]
    side_effects: []

  - method: POST
    path: "/cold-chain-shipments/{id}/release-hold"
    description: "Return a credit-held load to staged status once the order's credit decision is approved again, re-testing the zone's aggregate capacity over the original window."
    roles: [CreditManager]
    code: 200
    input: []
    output: ColdChainShipment
    side_effects:
      - "transitions HELD -> STAGED"
      - "re-runs calculations.zone_occupancy_projection as an admission test and then to update ColdStorageZone.occupied_pallets"
      - "increments ColdChainShipment.version by 1"

  # ---- Logical clock ------------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every window, lead-time, decay and trailing-volume rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it MUST NOT fall back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output:
      current_utc: string
    side_effects:
      - "changes the instant that calculations.freight_program_tier, calculations.yeast_pitch_advisory, calculations.zone_occupancy_projection and every temporal validation evaluate against"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:

  # ---- authentication and authorization -----------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header is absent or empty"
  - id: ERR_INVALID_ROLE
    http: 403
    condition: "X-User-Role is not one of the five declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the supplied role is not in the target endpoint's roles list"
  - id: ERR_BREWER_SCOPE_VIOLATION
    http: 403
    condition: "an actor holding the Brewer role addresses a contract, order, recipe, propagation job, offer or payment belonging to a brewer other than X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "a MaltLot release is attempted by its analyzed_by_user_id, or a defaulted HopContract resale is attempted by its defaulted_by_user_id"

  # ---- request shape ------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required body field is missing, a field has the wrong type, an enum field carries an undeclared member, a quantity or money amount is negative, or a decimal exceeds its declared scale"

  # ---- not found ----------------------------------------------------------
  - id: ERR_BREWER_NOT_FOUND
    http: 404
    condition: "a brewer_id or buyer_brewer_id in the path, body or query does not resolve"
  - id: ERR_CROP_YEAR_PROGRAM_NOT_FOUND
    http: 404
    condition: "a crop_year_program_id or carry_forward_target_program_id does not resolve"
  - id: ERR_HOP_VARIETY_NOT_FOUND
    http: 404
    condition: "a variety_id, hop_variety_id or substitute_variety_id does not resolve"
  - id: ERR_HOP_CONTRACT_NOT_FOUND
    http: 404
    condition: "a hop contract path id, hop_contract_id, carried_forward_from_contract_id or created_contract_id does not resolve"
  - id: ERR_SUBSTITUTION_OFFER_NOT_FOUND
    http: 404
    condition: "a substitution offer path id does not resolve"
  - id: ERR_MALT_PRODUCT_NOT_FOUND
    http: 404
    condition: "a malt_product_id does not resolve"
  - id: ERR_MALT_LOT_NOT_FOUND
    http: 404
    condition: "a malt lot path id or malt_lot_id does not resolve"
  - id: ERR_BREWER_RECIPE_NOT_FOUND
    http: 404
    condition: "a recipe path id or recipe_id does not resolve"
  - id: ERR_YEAST_STRAIN_NOT_FOUND
    http: 404
    condition: "a yeast_strain_id does not resolve"
  - id: ERR_YEAST_JOB_NOT_FOUND
    http: 404
    condition: "a propagation job path id, yeast_propagation_job_id or replaces_job_id does not resolve"
  - id: ERR_SALES_ORDER_NOT_FOUND
    http: 404
    condition: "a sales order path id or sales_order_id does not resolve"
  - id: ERR_ORDER_LINE_NOT_FOUND
    http: 404
    condition: "a line_id path segment does not resolve, or resolves to a line on a different order"
  - id: ERR_COLD_STORAGE_ZONE_NOT_FOUND
    http: 404
    condition: "a zone path id or cold_storage_zone_id does not resolve"
  - id: ERR_COLD_CHAIN_SHIPMENT_NOT_FOUND
    http: 404
    condition: "a shipment path id does not resolve"

  # ---- referential coherence ---------------------------------------------
  - id: ERR_CONTRACT_BREWER_MISMATCH
    http: 422
    condition: "an OrderLine's HopContract belongs to a brewer other than the owning SalesOrder's brewer"
  - id: ERR_ITEM_REFERENCE_MISMATCH
    http: 422
    condition: "the populated item foreign key or the uom does not match the line's item_type"
  - id: ERR_STRAIN_RECIPE_MISMATCH
    http: 422
    condition: "a propagation job's yeast_strain_id differs from its recipe's yeast_strain_id, or the recipe's brewer differs from the job's brewer"
  - id: ERR_PROGRAM_NOT_OPEN
    http: 409
    condition: "a HopContract is created against a CropYearProgram whose status is not OPEN"

  # ---- state preconditions ------------------------------------------------
  - id: ERR_INVALID_CONTRACT_STATE
    http: 409
    condition: "the requested HopContract transition is not declared from the contract's current status"
  - id: ERR_INVALID_PROGRAM_STATE
    http: 409
    condition: "the requested CropYearProgram transition is not declared from the program's current status, including settling a program that still has a CARRY_FORWARD_PENDING contract"
  - id: ERR_INVALID_LOT_STATE
    http: 409
    condition: "the requested MaltLot transition is not declared from the lot's current status"
  - id: ERR_INVALID_JOB_STATE
    http: 409
    condition: "the requested YeastPropagationJob transition is not declared from the job's current status"
  - id: ERR_INVALID_ORDER_STATE
    http: 409
    condition: "the requested SalesOrder fulfillment transition is not declared from the order's current fulfillment_status"
  - id: ERR_INVALID_SHIPMENT_STATE
    http: 409
    condition: "the requested ColdChainShipment transition is not declared from the shipment's current status, including appending a reading to a load that is not IN_TRANSIT"
  - id: ERR_INVALID_OFFER_STATE
    http: 409
    condition: "a SubstitutionOffer response is attempted on an offer that is not OPEN"

  # ---- optimistic concurrency --------------------------------------------
  - id: ERR_STALE_HOP_CONTRACT_VERSION
    http: 412
    condition: "expected_hop_contract_version does not equal the HopContract's current version on POST /hop-contracts/{id}/substitution-offers"
  - id: ERR_STALE_SALES_ORDER_VERSION
    http: 412
    condition: "expected_sales_order_version does not equal the SalesOrder's current version on POST /cold-chain-shipments"
  - id: ERR_STALE_BREWER_VERSION
    http: 412
    condition: "expected_brewer_version does not equal the Brewer's current version on PUT /brewers/{id}/credit-profile"

  # ---- safety and cold chain ---------------------------------------------
  - id: ERR_COLD_CHAIN_NOT_CERTIFIED
    http: 422
    condition: "a cold-chain order is confirmed for a brewer whose cold_chain_certified is false, or a reefer load is staged for an order whose requires_cold_chain is false"
  - id: ERR_MALT_LOT_NOT_RELEASED
    http: 409
    condition: "an order is picked while one of its MALT lines references a lot that is not RELEASED"
  - id: ERR_YEAST_NOT_READY
    http: 409
    condition: "an order is picked while one of its YEAST lines references a propagation job that is not READY"
  - id: ERR_COLD_CHAIN_EXCURSION
    http: 409
    condition: "an order is shipped or delivered while its reefer load is EXCURSION_FLAGGED"

  # ---- temporal -----------------------------------------------------------
  - id: ERR_READING_OUT_OF_ORDER
    http: 422
    condition: "a reading's recorded_at is strictly earlier than the shipment's last_reading_at"
  - id: ERR_INVALID_STAGING_WINDOW
    http: 422
    condition: "stage_until is not strictly after stage_from"
  - id: ERR_SHIP_DATE_OUTSIDE_DELIVERY_WINDOW
    http: 422
    condition: "the order's requested_ship_date falls outside a CONTRACT-sourced line's closed inclusive contract delivery window"
  - id: ERR_INSUFFICIENT_PROPAGATION_LEAD_TIME
    http: 422
    condition: "pitch_date is fewer than propagation_lead_time_days whole days after the current logical clock"
  - id: ERR_PROPAGATION_SLOT_CONFLICT
    http: 409
    condition: "another live job on the same strain sits strictly closer than propagation_lead_time_days whole days to the requested pitch_date"
  - id: ERR_CONTRACT_WINDOW_OVERLAP
    http: 409
    condition: "a new contract's closed inclusive delivery window intersects a live contract's window for the same brewer and variety, sharing an endpoint date included"

  # ---- capacity, uniqueness and volume -----------------------------------
  - id: ERR_ZONE_CAPACITY_EXCEEDED
    http: 409
    condition: "merging the candidate staging interval into the zone's STAGED set pushes some swept sub-interval strictly above capacity_pallets"
  - id: ERR_DUPLICATE_CROP_YEAR
    http: 409
    condition: "a CropYearProgram already exists for the supplied crop_year"
  - id: ERR_DUPLICATE_LOT_CODE
    http: 409
    condition: "a MaltLot already exists with the supplied lot_code"
  - id: ERR_DUPLICATE_BREWERY_LICENSE
    http: 409
    condition: "a Brewer already exists with the supplied brewery_license_no"
  - id: ERR_DUPLICATE_RESOURCE_CODE
    http: 409
    condition: "a ColdStorageZone.zone_code, HopVariety.variety_code, MaltProduct.sku or YeastStrain.strain_code collides with an existing row"
  - id: ERR_ORDER_HAS_NO_LINES
    http: 422
    condition: "an order is confirmed with no line in status OPEN or TRIMMED"
  - id: ERR_BELOW_MINIMUM_ORDER_QUANTITY
    http: 422
    condition: "a line's quantity is below the item's minimum order quantity"
  - id: ERR_INVALID_CARRY_FORWARD_TARGET
    http: 422
    condition: "the carry-forward target program is not the immediately following crop year, is not OPEN, or is the source program itself"
  - id: ERR_CARRY_FORWARD_EXCEEDS_CAP
    http: 422
    condition: "requested_lbs exceeds min(floor(contracted_lbs * CARRY_FORWARD_CAP_PCT / 100), remaining_lbs)"
  - id: ERR_NO_UNCOMMITTED_VOLUME
    http: 422
    condition: "a carry-forward or default is attempted on a contract whose remaining_lbs is 0"
  - id: ERR_NO_SUBSTITUTE_AVAILABLE
    http: 422
    condition: "no variety in the shorted variety's substitution group has enough spot inventory, or an EXPLICIT substitute names a variety outside that candidate set"
  - id: ERR_RESALE_EXCEEDS_DEFAULTED_VOLUME
    http: 422
    condition: "resale_lbs exceeds the contract's current defaulted_lbs"
  - id: ERR_RESALE_BUYER_INVALID
    http: 422
    condition: "buyer_brewer_id equals the defaulting contract's brewer_id"
  - id: ERR_CONTRACT_VOLUME_EXHAUSTED
    http: 422
    condition: "the order's aggregate draw on a contract exceeds that contract's remaining_lbs"
  - id: ERR_MALT_LOT_INSUFFICIENT_QUANTITY
    http: 422
    condition: "the order's aggregate draw on a malt lot exceeds that lot's available_lbs"
  - id: ERR_SPOT_INVENTORY_INSUFFICIENT
    http: 422
    condition: "the order's aggregate spot draw on a variety, or an accepted substitution offer, exceeds that variety's available_spot_lbs"

  # ---- credit and money ---------------------------------------------------
  - id: ERR_BREWER_CREDIT_HOLD
    http: 402
    condition: "the owning brewer's credit_status is HOLD when confirming an order, approving an order's credit, or requesting a propagation"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 402
    condition: "credit_exposure_cents plus this order's total_cents would exceed credit_limit_cents"
  - id: ERR_ORDER_CREDIT_NOT_APPROVED
    http: 402
    condition: "an order is picked, or its reefer load departs, while the order's own credit_status is not APPROVED"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "a payment's amount_cents exceeds the brewer's current ar_balance_cents"

# =============================================================================
# 1.7 RBAC Matrix   (role_model: segregation_of_duties)
# =============================================================================
roles:

  - name: Brewer
    description: "A brewery customer. Draws on its own crop-year contracts, builds and confirms its own orders, responds to substitution offers, requests carry-forward, and requests yeast propagation. Sees only its own resources."
    identity: "entity_backed:Brewer"
    exclusive_operations:
      - "POST /hop-contracts/{id}/carry-forward-requests"
      - "POST /substitution-offers/{id}/respond"
      - "POST /sales-orders/{id}/confirm"
    shared_operations:
      - "POST /brewer-recipes"
      - "POST /yeast-propagation-jobs"
      - "POST /sales-orders"
      - "POST /sales-orders/{id}/lines"
      - "DELETE /sales-orders/{id}/lines/{line_id}"
      - "POST /sales-orders/{id}/cancel"
      - "every GET endpoint except GET /malt-lots/{id}/spec-match, which excludes CreditManager"

  - name: AllocationManager
    description: "The hop desk. Opens crop-year programs, writes contracts, reports harvest, prices spot, runs shortfall substitution, and handles carry-forward decisions, defaults and resales. Cannot approve credit and cannot pick or ship."
    identity: "opaque"
    exclusive_operations:
      - "POST /crop-year-programs"
      - "POST /crop-year-programs/{id}/report-harvest"
      - "POST /crop-year-programs/{id}/settle"
      - "POST /hop-contracts"
      - "PUT /hop-varieties/{id}/spot-price"
      - "POST /hop-contracts/{id}/carry-forward-decision"
      - "POST /hop-contracts/{id}/declare-default"
      - "POST /hop-contracts/{id}/resale"
      - "POST /hop-contracts/{id}/substitution-offers"
    shared_operations:
      - "POST /hop-varieties"
      - "POST /brewers/{id}/volume-adjustments"
      - "POST /brewer-recipes"
      - "POST /sales-orders"
      - "POST /sales-orders/{id}/lines"
      - "DELETE /sales-orders/{id}/lines/{line_id}"
      - "POST /sales-orders/{id}/cancel"
      - "every GET endpoint"

  - name: CreditManager
    description: "The credit desk. Onboards brewers, sets limits and terms, posts cash receipts, decides each order's credit status and releases credit-held reefer loads. Cannot write contracts, declare defaults, or move fulfillment."
    identity: "opaque"
    exclusive_operations:
      - "POST /brewers/{id}/payments"
      - "PUT /brewers/{id}/credit-profile"
      - "POST /sales-orders/{id}/credit-decision"
      - "POST /cold-chain-shipments/{id}/release-hold"
    shared_operations:
      - "POST /brewers"
      - "every GET endpoint except GET /malt-lots/{id}/spec-match"

  - name: WarehouseOperator
    description: "The warehouse and cold-chain floor. Receives and analyses malt lots, releases them under segregation of duties, propagates yeast, picks, ships and delivers orders, stages reefer loads and logs temperature readings. Cannot approve credit and cannot write contracts."
    identity: "opaque"
    exclusive_operations:
      - "POST /malt-lots"
      - "POST /malt-lots/{id}/analysis"
      - "POST /malt-lots/{id}/release"
      - "POST /malt-lots/{id}/retest"
      - "POST /malt-lots/{id}/reject"
      - "POST /yeast-propagation-jobs/{id}/start"
      - "POST /yeast-propagation-jobs/{id}/complete"
      - "POST /yeast-propagation-jobs/{id}/requeue"
      - "POST /sales-orders/{id}/pick"
      - "POST /sales-orders/{id}/ship"
      - "POST /sales-orders/{id}/deliver"
      - "POST /cold-chain-shipments"
      - "POST /cold-chain-shipments/{id}/depart"
      - "POST /cold-chain-shipments/{id}/readings"
    shared_operations:
      - "POST /malt-products"
      - "POST /yeast-strains"
      - "POST /cold-storage-zones"
      - "POST /yeast-propagation-jobs"
      - "every GET endpoint"

  - name: PlatformAdmin
    description: "Platform operations. Seeds reference data and drives the logical clock. Deliberately holds NO business decision rights: cannot confirm, approve credit, report harvest, declare default, analyse or release a lot, or move fulfillment."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /brewers"
      - "POST /crop-year-programs"
      - "POST /hop-varieties"
      - "POST /malt-products"
      - "POST /yeast-strains"
      - "POST /cold-storage-zones"
      - "POST /brewers/{id}/volume-adjustments"
      - "every GET endpoint"
