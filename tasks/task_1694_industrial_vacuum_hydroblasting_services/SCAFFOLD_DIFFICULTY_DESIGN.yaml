  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: equipment_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=19]
          - errors[ERR_RESOURCE_SCHEDULE_CONFLICT]
          - entities.Assignment.fields.window_start
        distinguishing_aspect: |
          Interval semantics on resource EquipmentUnit: half-open [start, end) —
          a new assignment whose start equals an existing assignment's end
          (back-to-back) is legal, while a 1-minute overlap is rejected with
          ERR_RESOURCE_SCHEDULE_CONFLICT.
        test_recipe:
          setup: ["QUOTED job; unit VAC-01 with existing SCHEDULED assignment 06:00-10:00"]
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S-A", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { sched_id: $.data.id } }
            - { call: "POST /v1/rate-schedules/${sched_id}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/equipment-units", payload: { unit_code: "VAC-01", unit_type: "VAC_TRUCK", max_pressure_psi: 3000, tank_capacity_gal: 5000 }, as: PlatformAdmin, captures: { unit_id: $.data.id } }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "VACUUM", pricing_mode: "UNIT_RATE", description: "Overlap job" }, as: ProjectManager, captures: { job_id: $.data.id } }
            - { call: "POST /v1/assignments", payload: { job_id: "${job_id}", resource_kind: "EQUIPMENT", equipment_unit_id: "${unit_id}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T10:00:00Z" }, as: ProjectManager, captures: { asg_a: $.data.id } }
          trigger:
            - { call: "POST /v1/assignments", payload: { job_id: "${job_id}", resource_kind: "EQUIPMENT", equipment_unit_id: "${unit_id}", window_start: "2026-08-01T10:00:00Z", window_end: "2026-08-01T14:00:00Z" }, as: ProjectManager, captures: { asg_b: $.data.id } }
            - { call: "POST /v1/assignments", payload: { job_id: "${job_id}", resource_kind: "EQUIPMENT", equipment_unit_id: "${unit_id}", window_start: "2026-08-01T09:59:00Z", window_end: "2026-08-01T11:00:00Z" }, as: ProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "Back-to-back 10:00-14:00 succeeds (half-open adjacency): Assignment.${asg_b} created with status SCHEDULED"
            - "09:59-11:00 rejected: err == ERR_RESOURCE_SCHEDULE_CONFLICT"

      - name: operator_rest_buffer_blocks_adjacent_shifts
        grounds:
          - validations[priority=20]
          - errors[ERR_OPERATOR_REST_PERIOD]
          - entities.Assignment.fields.resource_kind
        distinguishing_aspect: |
          Different interval semantics on a different resource entity (Operator):
          assignments carry a 10-hour rest buffer — a second shift starting
          exactly 10h after the previous end is legal, but 4h after end is
          rejected with ERR_OPERATOR_REST_PERIOD even though the bare intervals
          do not overlap.
        test_recipe:
          setup: ["QUOTED job; operator with existing SCHEDULED assignment 2026-08-01 06:00-16:00"]
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S-A", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { sched_id: $.data.id } }
            - { call: "POST /v1/rate-schedules/${sched_id}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/operators", payload: { full_name: "Ann A", employee_ref: "E-201", hazwoper_expires_on: "2027-01-01", hydroblast_certified: false }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "VACUUM", pricing_mode: "UNIT_RATE", description: "Rest buffer job" }, as: ProjectManager, captures: { job_id: $.data.id } }
            - { call: "POST /v1/assignments", payload: { job_id: "${job_id}", resource_kind: "OPERATOR", operator_id: "${op_id}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T16:00:00Z" }, as: ProjectManager, captures: { asg_a: $.data.id } }
          trigger:
            - { call: "POST /v1/assignments", payload: { job_id: "${job_id}", resource_kind: "OPERATOR", operator_id: "${op_id}", window_start: "2026-08-02T02:00:00Z", window_end: "2026-08-02T06:00:00Z" }, as: ProjectManager, captures: { asg_b: $.data.id } }
            - { call: "POST /v1/assignments", payload: { job_id: "${job_id}", resource_kind: "OPERATOR", operator_id: "${op_id}", window_start: "2026-08-01T20:00:00Z", window_end: "2026-08-01T23:00:00Z" }, as: ProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "Gap of exactly 10h (16:00 -> 02:00 next day) is legal: Assignment.${asg_b} created"
            - "Gap of 4h (16:00 -> 20:00 same day) rejected: err == ERR_OPERATOR_REST_PERIOD despite zero interval overlap"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: facility_reserved_tons_invariant_under_issue_then_void
        grounds:
          - calculations.facility_reservation_sync
          - state_machines.DisposalManifest.ISSUED_to_VOIDED
          - entities.DisposalFacility.fields.reserved_tons
        distinguishing_aspect: |
          Conserved quantity = facility reserved tonnage (capacity units): the
          forward action (manifest issue, +10.00t) paired with its compensating
          action (manifest void of the ISSUED manifest, -10.00t) leaves
          DisposalFacility.reserved_tons exactly at its pre-action value 0.0 and
          posture AVAILABLE.
        test_recipe:
          setup: ["Facility cap 10.00t reserved 0; profile APPROVED (WEIGHT, density 8.0); job IN_PROGRESS with manifest est 2500 gal DRAFT"]
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Bayport Terminal" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S-A", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { sched_id: $.data.id } }
            - { call: "POST /v1/rate-schedules/${sched_id}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/disposal-facilities", payload: { name: "Gulf Coast TSDF", epa_id: "TXD0001", total_capacity_tons: 10.0 }, as: PlatformAdmin, captures: { fac_id: $.data.id, fac_reserved_0: $.data.reserved_tons } }
            - { call: "POST /v1/waste-profiles", payload: { site_id: "${site_id}", facility_id: "${fac_id}", waste_code: "D008", hazard_class: "HAZ", density_lbs_per_gal: 8.0, disposal_rate_per_ton_cents: 35000, variance_basis: "WEIGHT" }, as: ComplianceOfficer, captures: { prof_id: $.data.id } }
            - { call: "POST /v1/waste-profiles/${prof_id}/submit", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /v1/waste-profiles/${prof_id}/approve", payload: {}, as: EnvironmentalApprover, as_user_id: "ea_1" }
            - { call: "POST /v1/equipment-units", payload: { unit_code: "VAC-01", unit_type: "VAC_TRUCK", max_pressure_psi: 3000, tank_capacity_gal: 5000 }, as: PlatformAdmin, captures: { unit_id: $.data.id } }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "VACUUM", pricing_mode: "UNIT_RATE", description: "Invariant job" }, as: ProjectManager, captures: { job_id: $.data.id } }
            - { call: "POST /v1/assignments", payload: { job_id: "${job_id}", resource_kind: "EQUIPMENT", equipment_unit_id: "${unit_id}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T14:00:00Z" }, as: ProjectManager, captures: { asg_id: $.data.id } }
            - { call: "POST /v1/assignments/${asg_id}/confirm", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/schedule", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/mobilize", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jhas", payload: { job_id: "${job_id}", confined_space: false, hazards: ["CHEMICAL_EXPOSURE"] }, as: FieldSupervisor, as_user_id: "fs_1", captures: { jha_id: $.data.id } }
            - { call: "POST /v1/jhas/${jha_id}/submit", payload: {}, as: FieldSupervisor, as_user_id: "fs_1" }
            - { call: "GET /v1/jobs/${job_id}", payload: {}, as: ProjectManager, captures: { job_v: $.data.version } }
            - { call: "POST /v1/jhas/${jha_id}/approve", payload: { expected_job_version: "${job_v}" }, as: SafetyManager, as_user_id: "sm_1" }
            - { call: "POST /v1/jobs/${job_id}/start-work", payload: {}, as: ProjectManager }
            - { call: "POST /v1/manifests", payload: { job_id: "${job_id}", waste_profile_id: "${prof_id}", estimated_gallons: 2500 }, as: ProjectManager, captures: { man_id: $.data.id } }
          trigger:
            - { call: "POST /v1/manifests/${man_id}/issue", payload: {}, as: ProjectManager }
            - { call: "GET /v1/disposal-facilities/${fac_id}", payload: {}, as: ProjectManager, captures: { reserved_mid: $.data.reserved_tons, posture_mid: $.data.posture } }
            - { call: "POST /v1/manifests/${man_id}/void", payload: {}, as: ComplianceOfficer }
            - { call: "GET /v1/disposal-facilities/${fac_id}", payload: {}, as: ProjectManager, captures: { reserved_post: $.data.reserved_tons, posture_post: $.data.posture } }
          assert:
            - "reserved_mid == 10.0 and posture_mid == FULL after issue (reserved == capacity boundary allowed)"
            - "reserved_post == fac_reserved_0 == 0.0 and posture_post == AVAILABLE after the compensating void — no drift in reserved tonnage"

      - name: invoice_total_invariant_under_line_add_then_void
        grounds:
          - calculations.invoice_volume_discount
          - entities.Invoice.fields.total_cents
          - state_machines.Invoice
        distinguishing_aspect: |
          Conserved quantity = invoice money total (cents, a different quantity
          type than tonnage): adding a corrective ADJUSTMENT line (+40000) to a
          DRAFT invoice and then voiding that line leaves total_cents exactly at
          the generated value 255000 (discount base unchanged because ADJUSTMENT
          lines are non-discountable; env fee returns to 5000).
        test_recipe:
          setup: ["VACUUM UNIT_RATE job FIELD_COMPLETE (1000 gal, 0 ft) -> invoice generated DRAFT: VACUUM line 250000, subtotal 250000, discount 0, env 5000, total 255000"]
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S-A", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { sched_id: $.data.id } }
            - { call: "POST /v1/rate-schedules/${sched_id}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/equipment-units", payload: { unit_code: "VAC-01", unit_type: "VAC_TRUCK", max_pressure_psi: 3000, tank_capacity_gal: 5000 }, as: PlatformAdmin, captures: { unit_id: $.data.id } }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "VACUUM", pricing_mode: "UNIT_RATE", description: "Invoice invariant job" }, as: ProjectManager, captures: { job_id: $.data.id } }
            - { call: "POST /v1/assignments", payload: { job_id: "${job_id}", resource_kind: "EQUIPMENT", equipment_unit_id: "${unit_id}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T14:00:00Z" }, as: ProjectManager, captures: { asg_id: $.data.id } }
            - { call: "POST /v1/assignments/${asg_id}/confirm", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/schedule", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/mobilize", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jhas", payload: { job_id: "${job_id}", confined_space: false, hazards: ["SLIP_TRIP"] }, as: FieldSupervisor, as_user_id: "fs_1", captures: { jha_id: $.data.id } }
            - { call: "POST /v1/jhas/${jha_id}/submit", payload: {}, as: FieldSupervisor, as_user_id: "fs_1" }
            - { call: "GET /v1/jobs/${job_id}", payload: {}, as: ProjectManager, captures: { job_v: $.data.version } }
            - { call: "POST /v1/jhas/${jha_id}/approve", payload: { expected_job_version: "${job_v}" }, as: SafetyManager, as_user_id: "sm_1" }
            - { call: "POST /v1/jobs/${job_id}/start-work", payload: {}, as: ProjectManager }
            - { call: "POST /v1/containment-records", payload: { job_id: "${job_id}", water_used_gallons: 500, water_captured_gallons: 500 }, as: FieldSupervisor, as_user_id: "fs_1", captures: { cr_id: $.data.id } }
            - { call: "POST /v1/containment-records/${cr_id}/verify", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/complete-field-work", payload: { gallons_removed: 1000, feet_cleaned: 0 }, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/generate-invoice", payload: {}, as: ProjectManager, captures: { inv_id: $.data.id, total_0: $.data.total_cents } }
          trigger:
            - { call: "POST /v1/invoices/${inv_id}/lines", payload: { description: "Disposal underestimate correction", amount_cents: 40000 }, as: AccountManager, captures: { total_1: $.data.total_cents } }
            - { call: "POST /v1/invoices/${inv_id}/lines/L2/void", payload: {}, as: AccountManager, captures: { total_2: $.data.total_cents } }
          assert:
            - "total_0 == 255000 (subtotal 250000 + env 5000; discount 0 below tier)"
            - "total_1 == 295800 after adding the 40000 line (subtotal 290000; env recomputed to 5800; discount still 0)"
            - "total_2 == 255000 == total_0 after voiding line L2 — add-then-void leaves the invoice total unchanged"
