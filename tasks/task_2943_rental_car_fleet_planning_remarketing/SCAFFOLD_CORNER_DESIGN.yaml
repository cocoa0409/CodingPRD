        claim_type: error_triggerable
        grounds:
          - validations[priority 18 ERR_CHANNEL_NOT_ELIGIBLE]
          - validations[priority 20 ERR_MILEAGE_BAND_EXCLUDES_CHANNEL]
          - validations[priority 23 ERR_RECONDITION_CAP_EXCEEDED]
          - validations[priority 23 ERR_RECONDITION_OVERRUN]
          - validations[priority 27 ERR_PROCEEDS_BELOW_FLOOR]
        distinguishing_aspect: "Every one of the five gates is probed at limit+1 AND at the limit itself, so each pair pins the comparison as inclusive-at-the-limit: 90000 authorises, 90001 does not; 1362000 sells, 1361999 does not; and the RETAIL_LOT refusal at 61000 km is reported by priority 20 rather than being swallowed by priority 18's general eligibility filter."
        test_recipe:
          setup:
            - "One ATL market; MIDSIZE segment (hard mileage band 60000 km, recondition cap 90000 cents) with an ACTIVE MID-2026 policy; RISK program; AUCTION, RETAIL_LOT and PROGRAM_REPURCHASE channels."
            - "One vehicle IN_SERVICE in ATL as of 2026-01-15T00:00:00Z with odometer driven to 61000 km, one kilometre past the hard band."
            - "The clock is then 2026-07-15T00:00:00Z: holding_days is 181, which clears the RISK program's 90-day minimum, and elapsed_months is floor(181/30) = 6."
            - "net_book_value_cents = 2800000 - round_half_up(2800000*0.0150*6) - 61000*12 = 2800000 - 252000 - 732000 = 1816000, above the 980000 floor, so floor_price_cents = round_half_up(1816000*0.75) = 1362000."
