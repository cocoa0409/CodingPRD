      - name: system_fields_are_minted_by_the_server
        claim_type: system_fields
        grounds:
          - entities.Property
          - entities.DrawRequest.fields.sequence_number
          - entities.DrawRequest.fields.status
        distinguishing_aspect: "id, created_at, updated_at and version are server-minted and never accepted from the caller: two properties created back to back get distinct bare UUIDs, both at version 1, and a draw request's sequence_number is assigned from the per-loan creation ordinal (1 then 2) rather than from anything in the body."
        test_recipe:
          setup:
            - "logical clock 2026-08-10T09:00:00Z; the property POST body carries no id, version or status field (they are not in the endpoint's input list)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /lending/properties"
              payload: { address_line: "18 Larkspur Ct", county_code: "MARICOPA", purchase_price_cents: 20000000, as_is_value_cents: 21000000, arv_cents: 32000000, appraisal_date: "2026-07-20" }
              as: LoanOfficer
              captures: { p1: $.data.id, p1_created: $.data.created_at, p1_ver: $.data.version }
            - call: "POST /lending/properties"
              payload: { address_line: "22 Larkspur Ct", county_code: "MARICOPA", purchase_price_cents: 20000000, as_is_value_cents: 21000000, arv_cents: 32000000, appraisal_date: "2026-07-20" }
              as: LoanOfficer
