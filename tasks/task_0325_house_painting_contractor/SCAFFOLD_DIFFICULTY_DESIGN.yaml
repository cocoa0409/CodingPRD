          ESTIMATED (not WALKTHROUGH_PENDING) AND with a wrong amount must return the state error
          ERR_PROJECT_NOT_IN_WALKTHROUGH (409), not the fiscal ERR_FINAL_AMOUNT_MISMATCH (402).
