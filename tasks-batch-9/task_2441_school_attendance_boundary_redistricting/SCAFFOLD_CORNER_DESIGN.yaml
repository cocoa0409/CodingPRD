  - name: cascading_side_effects_chain_verified_end_to_end
    claim_type: cascading_side_effects
    grounds:
    - complexity_profile.complexity_layers.cascading_side_effects
    - state_machines.HousingDevelopment
    - state_machines.BoundaryStudy
    excluded_because:
      difficulty_instance: transitive_cascade / entitlement_advance_cascades_four_links_to_study_phase
      rationale: The four-link chain from an entitlement advance through the pipeline recount, the stale projection run, the scenario push to REVISION and the study phase regression is already covered end to end, including ordering, by the transitive_cascade difficulty instance.
  - name: dual_variant_calculation_both_variants_and_delta
    claim_type: dual_variant_calculation
    grounds:
    - complexity_profile.complexity_layers.dual_variant_calculation
    - calculations.area_enrollment_projection
    excluded_because:
      difficulty_instance: dual_variant_calc / projection_variant_divergence_cohort_survival_vs_development_weighted
      rationale: Running both projection variants over one pipeline and pinning the per-area and total delta is the whole content of the dual_variant_calc difficulty instance, which asserts 638 against 646 on identical data.
  - name: rate_threshold_trigger_at_the_absorption_boundary
    claim_type: rate_threshold_triggers
    grounds:
    - complexity_profile.complexity_layers.rate_threshold_triggers
    - calculations.area_rolling_absorption
    excluded_because:
      difficulty_instance: resource_temporal_overlap / area_rolling_absorption_peak_exceeds_annual_cap
      rationale: The rolling twelve-month absorption cap is exercised at its boundary - a touching window contributing exactly zero, then a peak crossing the cap - by the resource_temporal_overlap difficulty instance.
