      - name: lot_occupancy_turnover_buffer_boundary
        grounds:
          - validations[priority=14]
          - entities.ManufacturedUnit.fields.placement_start_date
          - entities.ManufacturedUnit.fields.placement_end_date
          - entities.Community.fields.lot_count
          - endpoints[POST /chattel/units]
        distinguishing_aspect: "The contended resource is a PHYSICAL LOT identified by (community_id, lot_number), and its interval semantics are asymmetric: the incumbent occupancy is extended by LOT_TURNOVER_BUFFER_DAYS (7) past placement_end_date, so the blocked window is [2026-08-01, 2027-01-07) and only the new placement_start_date is tested against it. 2027-01-06 collides; 2027-01-07 is the first admissible move-in date."
