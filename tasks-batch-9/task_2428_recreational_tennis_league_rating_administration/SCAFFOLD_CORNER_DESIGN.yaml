      - name: captain_removal_of_a_pending_spot_returns_204_and_the_spot_leaves_every_list
        claim_type: Standard CRUD
        grounds:
          - endpoints.DELETE /tennis/roster-spots/{id}
        distinguishing_aspect: "The only 204 in the surface: the body must be empty (not an envelope with data: null), the row must survive as status REMOVED rather than vanish, and the parent Team.version must still be bumped by the removal. An implementation that returns 200 with an envelope, hard-deletes the row, or skips the version bump each fail a different clause."
        test_recipe:
          setup:
