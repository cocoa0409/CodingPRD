      - name: brix_dead_band_and_sub_step_exact_boundaries
        endpoint: "POST /grower-relations/weigh-tags/{tagId}/grades"
        metric: "quality adjustment in percentage points, from Brix / TA / rot / MOG readings on integer tenths"
        grounds:
          - calculations.quality_adjustment_pct
          - entities.QualitySpec.fields.brix_bonus_start
          - entities.QualitySpec.fields.brix_penalty_start
          - entities.QualityGrade.fields.brix_component_pct
          - entities.QualityGrade.fields.rot_component_pct
        distinguishing_aspect: |
          A third metric (PERCENTAGE POINTS of price adjustment) on a third endpoint (grading).
          Three loads probe every closed-interval edge of the four gated components at once:
          Brix exactly at brix_bonus_start 24.0 and exactly at brix_penalty_start 22.0 both give
