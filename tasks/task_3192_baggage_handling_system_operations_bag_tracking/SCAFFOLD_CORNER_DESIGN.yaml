  # ===========================================================================
  - section: calculations
    instances:

      - name: station_posture_suspends_at_capacity_and_guards_an_empty_makeup_set
        claim_type: Constants Applied
        grounds:
          - calculations.station_posture
          - entities.Station.fields.sorter_capacity_bags
          - entities.Station.fields.posture
        distinguishing_aspect: "Two stations prove both ends of the threshold ladder: a capacity-2 station with no make-up areas stays OPEN by the empty-set guard, then flips to SUSPENDED the instant its second bag lands, because the SUSPENDED test is >= capacity and the CONGESTED test cannot fire with zero slots."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; station HUB with sorter_capacity_bags 2 and NO make-up areas; airline DL"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/stations"
              payload: { code: "HUB", name: "Hub Station", sorter_capacity_bags: 2 }
              as: PlatformAdmin
              captures: { st: $.data.id }
            - call: "POST /baggage/airlines"
              payload: { code: "DL", name: "Delta Air Lines", interline_agreement_active: true, max_excess_weight_lb: 50, excess_weight_fee_cents: 7500, compensation_cap_cents: 300000 }
              as: PlatformAdmin
              captures: { al: $.data.id }
            - call: "POST /baggage/bags"
              payload: { station_id: "${st}", passenger_name: "Reyes, Ana", passenger_ref: "PNR7X2Q", itinerary_type: "DOMESTIC", weight_lb: 48, length_in: 20, width_in: 14, height_in: 16 }
              as: AcceptanceAgent
          trigger:
            - call: "GET /baggage/stations/${st}"
              payload: {}
              as: PlatformAdmin
            - call: "POST /baggage/bags"
              payload: { station_id: "${st}", passenger_name: "Okafor, Ben", passenger_ref: "PNR4M1T", itinerary_type: "DOMESTIC", weight_lb: 48, length_in: 20, width_in: 14, height_in: 16 }
              as: AcceptanceAgent
            - call: "GET /baggage/stations/${st}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "with one bag on a 2-capacity station the posture is OPEN, because the station has zero active make-up slots and the empty-set guard short-circuits the CONGESTED test"
            - "Station.${st}.active_bag_count == 1 at that point"
            - "after the second acceptance active_bag_count == 2 and posture == SUSPENDED, since 2 >= sorter_capacity_bags 2"
            - "Station.${st}.posture is SUSPENDED rather than CONGESTED even though free_makeup_slots is 0 and total_makeup_slots is 0"
            - "clearing the station by cancelling the bags' context does not lower active_bag_count below 2 until both bags reach a non-counted custody state"
            - "a station of capacity 60 with the same two bags stays OPEN, because 2 is below ceil(0.15 * total_makeup_slots)"

      - name: connection_slack_minutes_truncates_the_departure_difference
        claim_type: Correct Result
        grounds:
          - calculations.connection_slack_minutes
          - entities.Connection.fields.connect_slack_minutes
          - entities.Connection.fields.required_mct_minutes
        distinguishing_aspect: "The departure difference is truncated toward zero BEFORE the required MCT is subtracted, so a 152.5-minute gap with a 75-minute requirement yields 77 rather than the 78 a rounding implementation would give."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; station SEA; airline DL; flight DL1423 departs 2026-09-01T15:00:00Z and flight DL1788 departs 2026-09-01T17:32:30Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/stations"
              payload: { code: "SEA", name: "Seattle-Tacoma", sorter_capacity_bags: 60 }
              as: PlatformAdmin
              captures: { st: $.data.id }
            - call: "POST /baggage/airlines"
              payload: { code: "DL", name: "Delta Air Lines", interline_agreement_active: true, max_excess_weight_lb: 50, excess_weight_fee_cents: 7500, compensation_cap_cents: 300000 }
              as: PlatformAdmin
              captures: { al: $.data.id }
            - call: "POST /baggage/flights"
              payload: { station_id: "${st}", airline_id: "${al}", flight_number: "DL1423", bank_code: "B1", scheduled_departure_utc: "2026-09-01T15:00:00Z" }
              as: PlatformAdmin
              captures: { f1: $.data.id }
            - call: "POST /baggage/flights"
              payload: { station_id: "${st}", airline_id: "${al}", flight_number: "DL1788", bank_code: "B2", scheduled_departure_utc: "2026-09-01T17:32:30Z" }
              as: PlatformAdmin
              captures: { f2: $.data.id }
            - call: "POST /baggage/bags"
              payload: { station_id: "${st}", passenger_name: "Nakamura, Yui", passenger_ref: "PNR2W8H", itinerary_type: "DOMESTIC", weight_lb: 48, length_in: 20, width_in: 14, height_in: 16 }
              as: AcceptanceAgent
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /baggage/connections"
              payload: { bag_id: "${t1}", inbound_flight_id: "${f1}", onward_flight_id: "${f2}", required_mct_minutes: 75 }
              as: TransferAgent
              captures: { cn: $.data.id }
          assert:
            - "Connection.${cn}.connect_slack_minutes == 77 (152 truncated minutes minus the required 75)"
            - "the value is 77 and NOT 78, which is what rounding 152.5 up before subtracting would give"
            - "Connection.${cn}.required_mct_minutes == 75 and status == PENDING"
            - "Flight.${f2}.sortation_open_utc == 2026-09-01T15:32:30Z and sortation_close_utc == 2026-09-01T16:47:30Z"
            - "a second connection on the same pair with required_mct_minutes 167 has connect_slack_minutes == -15"
            - "connecting the same bag to the same onward flight twice is rejected with 409 ERR_DUPLICATE_CONNECTION"

      - name: outage_manual_sortation_delay_caps_the_dwell_and_stacks_manual_scans
        claim_type: Boundary
        grounds:
          - calculations.outage_manual_sortation_delay
          - entities.Bag.fields.manual_sortation_delay_minutes
          - endpoints.POST_/baggage/bags/{id}/scans
        distinguishing_aspect: "The dwell term is clamped at 45 minutes while the manual-scan term is uncapped, so a 120-minute outage with one manual capture reads 60 rather than 135."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; station SEA; airline DL; bag B1 48 lb accepted; outage declared at clock 07:00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/stations"
              payload: { code: "SEA", name: "Seattle-Tacoma", sorter_capacity_bags: 60 }
              as: PlatformAdmin
              captures: { st: $.data.id }
            - call: "POST /baggage/airlines"
              payload: { code: "DL", name: "Delta Air Lines", interline_agreement_active: true, max_excess_weight_lb: 50, excess_weight_fee_cents: 7500, compensation_cap_cents: 300000 }
              as: PlatformAdmin
              captures: { al: $.data.id }
            - call: "POST /baggage/bags"
              payload: { station_id: "${st}", passenger_name: "Reyes, Ana", passenger_ref: "PNR7X2Q", itinerary_type: "DOMESTIC", weight_lb: 48, length_in: 20, width_in: 14, height_in: 16 }
              as: AcceptanceAgent
              captures: { bag: $.data.id }
            - call: "POST /baggage/stations/${st}/outage"
              payload: {}
              as: PlatformAdmin
            - call: "GET /baggage/bags/${bag}"
              payload: {}
              as: AcceptanceAgent
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "GET /baggage/bags/${bag}"
              payload: {}
              as: AcceptanceAgent
            - call: "POST /baggage/bags/${bag}/scans"
              payload: { scan_point: "SORTATION" }
              as: SortationAgent
            - call: "GET /baggage/bags/${bag}"
              payload: {}
              as: AcceptanceAgent
          assert:
            - "with the outage just declared the dwell is 0 minutes, so manual_sortation_delay_minutes == 0"
            - "after two hours of outage the dwell is 120 minutes but the cap clamps it to 45, so manual_sortation_delay_minutes == 45"
            - "after one manual scan capture the value rises to 60 (45 + 15 * 1), so the manual term is added on top of the capped dwell"
            - "a second manual capture would raise it to 75 and the manual term is never clamped"
            - "Station.${st}.outage_active == true and posture == SUSPENDED throughout"
            - "clearing the outage returns manual_sortation_delay_minutes to 0 on the next read"

      - name: interline_routing_class_manual_when_over_the_weight_threshold
        claim_type: Input Set Filtering
        grounds:
          - calculations.interline_routing_class
          - calculations.excess_weight_fee
          - entities.Bag.fields.routing_class
        distinguishing_aspect: "The routing determination reads the SAME pound-rounded weight the fee uses, so a 50.6 lb interline bag rounds to 51 and is routed MANUAL while a 50.4 lb interline bag rounds to 50 and stays STANDARD."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; station SEA; airline DL with interline_agreement_active true and max_excess_weight_lb 50"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/stations"
              payload: { code: "SEA", name: "Seattle-Tacoma", sorter_capacity_bags: 60 }
              as: PlatformAdmin
              captures: { st: $.data.id }
            - call: "POST /baggage/airlines"
              payload: { code: "DL", name: "Delta Air Lines", interline_agreement_active: true, max_excess_weight_lb: 50, excess_weight_fee_cents: 7500, compensation_cap_cents: 300000 }
              as: PlatformAdmin
              captures: { al: $.data.id }
            - call: "POST /baggage/flights"
              payload: { station_id: "${st}", airline_id: "${al}", flight_number: "DL1423", bank_code: "B1", scheduled_departure_utc: "2026-09-01T15:00:00Z" }
              as: PlatformAdmin
              captures: { f1: $.data.id }
            - call: "POST /baggage/bags"
              payload: { station_id: "${st}", flight_id: "${f1}", passenger_name: "Adeyemi, Tunde", passenger_ref: "PNR9K3L", itinerary_type: "INTERLINE", weight_lb: 50, length_in: 20, width_in: 14, height_in: 16 }
              as: AcceptanceAgent
              captures: { b_over: $.data.id }
            - call: "POST /baggage/bags"
              payload: { station_id: "${st}", flight_id: "${f1}", passenger_name: "Reyes, Ana", passenger_ref: "PNR7X2Q", itinerary_type: "INTERLINE", weight_lb: 50, length_in: 20, width_in: 14, height_in: 16 }
              as: AcceptanceAgent
              captures: { b_under: $.data.id }
          trigger:
            - call: "POST /baggage/bags/${b_over}/weigh"
              payload: { scale_weight_lb: 50.6 }
              as: AcceptanceAgent
            - call: "POST /baggage/bags/${b_under}/weigh"
              payload: { scale_weight_lb: 50.4 }
              as: AcceptanceAgent
          assert:
            - "Bag.${b_over}.routing_class == MANUAL, because the pound-rounded 50.6 becomes 51 which is > 50"
            - "Bag.${b_under}.routing_class == STANDARD, because the pound-rounded 50.4 becomes 50 which is not > 50"
            - "Bag.${b_over}.excess_weight_fee_cents == 7500 while Bag.${b_under}.excess_weight_fee_cents == 0 — the two readings share one rounding"
            - "the two bags differ by exactly one pound of rounding and one group of fee"
            - "a DOMESTIC bag weighed at 50.6 is routed STANDARD, not MANUAL, so the interline guard is what selects MANUAL"
            - "an INTERNATIONAL bag on the same flight is routed BULK_HOLD"

