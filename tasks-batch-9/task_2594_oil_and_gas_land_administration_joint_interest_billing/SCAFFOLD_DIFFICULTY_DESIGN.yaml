      - name: statement_issuance_depends_on_the_wells_pooling_status
        dependent_entity: JibStatement
        depended_on_entity: Well
        grounds:
          - validations[priority=55, error_id=ERR_WELL_NOT_POOLED]
          - state_machines.JibStatement.DRAFT_to_ISSUED
          - state_machines.Well.POOLED_EFFECTIVE_to_POOLED_TERMINATED
          - endpoints.POST_/land-admin/jib-statements/{statement_id}/issuance
        dependency: |
          A JibStatement may only be issued while the Well it belongs to has
          pooling_status == POOLED_EFFECTIVE. The statement's own state is untouched by the
          dependency: the same DRAFT is issuable at one moment and refused at the next, purely
          because a lease under the unit expired and the system cascade terminated the pooling.
