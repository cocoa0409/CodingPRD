            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P1", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 5000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P2", partner_type: US_ENTITY, partner_class: LIMITED, residency_state: "DE", ownership_pct_bps: 5000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p2: "$.data.id" }
            - call: "POST /funds/tax-years"
              payload: { fund_id: "${f}", year: 2025, gross_ordinary_income_cents: 1000000, capital_gain_cents: 0, interest_income_cents: 0 }
              as: FundTaxAdmin
              captures: { ty: "$.data.id" }
            - call: "POST /funds/tax-years/${ty}/close-books"
              payload: {}
              as: FundTaxAdmin
              captures: { ty_v: "$.data.version" }
            - call: "POST /funds/allocation-runs"
              payload: { tax_year_id: "${ty}", run_kind: FINAL, expected_tax_year_version: "${ty_v}" }
              as: TaxPreparer
              captures: { run: "$.data.id" }
            - call: "POST /funds/allocation-runs/${run}/lock"
              payload: {}
              as: TaxReviewer
            - call: "POST /funds/tax-years/${ty}/submit-review"
              payload: {}
              as: TaxPreparer
            - call: "POST /funds/tax-years/${ty}/approve"
              payload: {}
              as: TaxReviewer
            - call: "POST /funds/k1-generation"
              payload: { tax_year_id: "${ty}" }
              as: TaxPreparer
              captures: { k1_1: "$.data[0].id", k1_2: "$.data[1].id" }
            - call: "POST /funds/k1-packages/${k1_1}/submit-review"
              payload: {}
              as: TaxPreparer
              as_user_id: prep_1
            - call: "POST /funds/k1-packages/${k1_1}/approve"
              payload: {}
              as: TaxReviewer
              as_user_id: rev_1
            - call: "POST /funds/k1-packages/${k1_1}/deliver"
              payload: { delivery_method: PORTAL }
              as: InvestorServicesRep
            - call: "POST /funds/k1-packages/${k1_2}/submit-review"
              payload: {}
              as: TaxPreparer
              as_user_id: prep_1
            - call: "POST /funds/k1-packages/${k1_2}/approve"
              payload: {}
              as: TaxReviewer
              as_user_id: rev_1
            - call: "POST /funds/k1-packages/${k1_2}/deliver"
              payload: { delivery_method: PORTAL }
              as: InvestorServicesRep
          trigger:
            - call: "POST /funds/k1-packages/${k1_2}/acknowledge"
              payload: {}
              as: Investor
              as_user_id: "${p1}"
              captures: { e: "$.data.error_id" }
            - call: "POST /funds/k1-packages/${k1_2}/acknowledge"
              payload: {}
              as: Investor
              as_user_id: "${p2}"
          assert:
            - "Investor ${p1} acknowledging ${p2}'s K1 fails: error_id == ERR_FORBIDDEN_FOR_ROLE (403)"
            - "Investor ${p2} acknowledging own K1 succeeds: K1Package.${k1_2}.delivery_status == ACKNOWLEDGED while prep_status stays DELIVERED"

      - name: investor_cannot_list_partners_but_can_read_self
        claim_type: role_denial
        grounds: ["roles[Investor]", "endpoints[GET /funds/partners]", "endpoints[GET /funds/partners/{partnerId}]"]
        distinguishing_aspect: "The collection list is operator-only (403 for Investor), while the single GET with X-User-ID == partner id succeeds (entity-backed self-read)."
        test_recipe:
          setup: ["fund with one partner P1"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund RB4", ein: "22-7000004", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P1", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 10000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p1: "$.data.id" }
          trigger:
            - call: "GET /funds/partners?fund_id=${f}"
              payload: {}
              as: Investor
              as_user_id: "${p1}"
              captures: { e: "$.data.error_id" }
            - call: "GET /funds/partners/${p1}"
              payload: {}
              as: Investor
              as_user_id: "${p1}"
          assert:
            - "list attempt: error_id == ERR_FORBIDDEN_FOR_ROLE (403)"
            - "self read: 200, Partner.${p1}.legal_name == 'P1'"

      - name: investor_ticket_self_service
        claim_type: role_denial
        grounds: ["roles[Investor]", "endpoints[POST /funds/tickets]"]
        distinguishing_aspect: "An Investor may open a ticket with partner_id == X-User-ID (201) but not with another partner's id (403)."
        test_recipe:
          setup: ["fund with partners P1 and P2"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund RB5", ein: "22-7000005", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P1", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 5000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P2", partner_type: US_ENTITY, partner_class: LIMITED, residency_state: "DE", ownership_pct_bps: 5000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p2: "$.data.id" }
          trigger:
            - call: "POST /funds/tickets"
              payload: { partner_id: "${p2}", category: DELIVERY_ISSUE, subject: "not mine" }
              as: Investor
              as_user_id: "${p1}"
              captures: { e: "$.data.error_id" }
            - call: "POST /funds/tickets"
              payload: { partner_id: "${p1}", category: DELIVERY_ISSUE, subject: "where is my K1" }
              as: Investor
              as_user_id: "${p1}"
              captures: { tk: "$.data.id" }
          assert:
            - "cross-partner create: error_id == ERR_FORBIDDEN_FOR_ROLE (403)"
            - "self create: 201, InvestorTicket.${tk}.status == OPEN, due_at == created_at + 72h (DELIVERY_ISSUE SLA)"

  # ===========================================================================
  # Section: cross-cutting complexity layers
  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: occ_stale_expected_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[allocation-run-create-stale-tax-year]"]
        distinguishing_aspect: "OCC on TaxYear.version: after close-books advances the version to 2, a run create carrying the stale expectation (v-1) fails with 412 ERR_STALE_TAX_YEAR_VERSION, while the same call carrying the observed current version succeeds — two strictly sequential requests, deterministic."
        test_recipe:
          setup: ["fund with partner; TaxYear 2025 BOOKS_CLOSED (version 2 after close-books)"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund X1", ein: "22-8000001", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 10000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
            - call: "POST /funds/tax-years"
              payload: { fund_id: "${f}", year: 2025, gross_ordinary_income_cents: 1000000, capital_gain_cents: 0, interest_income_cents: 0 }
              as: FundTaxAdmin
              captures: { ty: "$.data.id", ty_v0: "$.data.version" }
            - call: "POST /funds/tax-years/${ty}/close-books"
              payload: {}
              as: FundTaxAdmin
              captures: { ty_v1: "$.data.version" }
          trigger:
            - call: "POST /funds/allocation-runs"
              payload: { tax_year_id: "${ty}", run_kind: FINAL, expected_tax_year_version: "${ty_v1} - 1" }
              as: TaxPreparer
              captures: { e: "$.data.error_id" }
            - call: "POST /funds/allocation-runs"
              payload: { tax_year_id: "${ty}", run_kind: FINAL, expected_tax_year_version: "${ty_v1}" }
              as: TaxPreparer
              captures: { run: "$.data.id" }
          assert:
            - "stale call: error_id == ERR_STALE_TAX_YEAR_VERSION, http 412"
            - "current-version call succeeds: AllocationRun.${run}.status == COMPUTED and TaxYear.${ty}.version advanced to ${ty_v1} + 1"

      - name: ticket_escalation_derives_from_clock
        claim_type: derived_field_reconciliation
        grounds: [entities.InvestorTicket.fields.is_escalated, entities.InvestorTicket.fields.due_at, "endpoints[POST /_clock/set_current_utc]"]
        distinguishing_aspect: "Clock-derived computed field: an unanswered ALLOCATION_QUESTION ticket (72h SLA) created at the default clock 2026-08-01T00:00:00Z reads is_escalated false, and true after the clock advances to 2026-08-05 (past due_at)."
        test_recipe:
          setup: ["fund with partner; ticket created at the default logical clock"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund X2", ein: "22-8000002", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 10000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p: "$.data.id" }
            - call: "POST /funds/tickets"
              payload: { partner_id: "${p}", category: ALLOCATION_QUESTION, subject: "explain my allocation" }
              as: InvestorServicesRep
              captures: { tk: "$.data.id" }
            - call: "GET /funds/tickets/${tk}"
              payload: {}
              as: InvestorServicesRep
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: FundTaxAdmin
            - call: "GET /funds/tickets/${tk}"
              payload: {}
              as: InvestorServicesRep
          assert:
            - "before clock move: InvestorTicket.${tk}.is_escalated == false and due_at == 2026-08-04T00:00:00Z (created 2026-08-01 + 72h)"
            - "after clock move: InvestorTicket.${tk}.is_escalated == true (now > due_at, status OPEN)"

      - name: cascading_side_effects_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: transfer_settle_four_hop_cascade
          rationale: "N-level chain verification (depth 4 and depth 3) lives in the two Rule-4 instances."
      - name: dual_variant_layer_covered_by_difficulty
        claim_type: dual_variant_calculation
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: book_capital_vs_tax_basis_divergence
          rationale: "Both-variant execution plus delta is asserted by the two Rule-1 instances and the PROVISIONAL corner provisional_run_annualizes_and_ignores_specials."

  # ===========================================================================
  # Section: consistency model
  # ===========================================================================
  - section: consistency
    instances:
      - name: immediate_consistency_on_create
        claim_type: immediate
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: management_fee_evaluation_order_boundary
          rationale: "Computed fields (management_fee_cents, net_ordinary_income_cents) are asserted directly on the TaxYear create responses there — visibility within the same request is the consistency check."
