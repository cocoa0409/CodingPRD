  # =====================================================================
  - section: state_machines
    instances:
      - name: protection_filing_draft_to_filed_lifts_posture_to_pending
        claim_type: valid_transition
        grounds:
          - state_machines[ProtectionFiling.status].transitions[DRAFT->FILED]
          - calculations.variety_protection_posture
          - endpoints[POST /protection-filings/{filing_id}/file]
        distinguishing_aspect: "The declared happy-path transition: status DRAFT -> FILED, filed_on stamped from the logical clock, and the owning Variety's protection_posture recomputed UNPROTECTED -> PENDING with protected_jurisdictions still empty because nothing is GRANTED yet."
        test_recipe:
          setup:
            - "One Variety and one DRAFT ProtectionFiling in jurisdiction US. Logical clock advanced to 2026-08-12T00:00:00Z."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Quarry Bramble", species: "Rubus idaeus", breeder_code: "QB", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
            - call: "POST /protection-filings"
              payload: { variety_id: "${v_id}", instrument_type: "PLANT_PATENT", jurisdiction_code: "US", term_years: 20, annuity_base_cents: 200000 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { f_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: BreederAdmin
              as_user_id: "breeder-1"
          trigger:
            - call: "POST /protection-filings/${f_id}/file"
              payload: {}
              as: BreederAdmin
              as_user_id: "breeder-1"
          assert:
            - "HTTP status is 200 and ProtectionFiling.${f_id}.status == FILED"
            - "ProtectionFiling.${f_id}.filed_on == 2026-08-12T00:00:00Z and granted_on is null"
            - "ProtectionFiling.${f_id}.version == 2"
            - "Variety.${v_id}.protection_posture == PENDING and protected_jurisdictions == []"
            - "Variety.${v_id}.version == 2 (the cross-entity recompute bumps it)"

      - name: variety_trial_plant_before_the_plant_date_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines[VarietyTrial.status].transitions[PLANNED->PLANTED].preconditions
          - validations[priority=31]
          - errors.ERR_TRIAL_DATE_NOT_REACHED
        distinguishing_aspect: "The PLANNED -> PLANTED precondition 'now >= plant_date' is enforced: at clock 2026-08-04 a trial with plant_date 2026-08-05 is refused with ERR_TRIAL_DATE_NOT_REACHED, and no cross-entity side effect fires - the Variety stays CANDIDATE and the site's occupied_plot_count stays 0."
        test_recipe:
          setup:
            - "One Variety, one TrialSite with plot_capacity 60, one PLANNED VarietyTrial with plant_date 2026-08-05T00:00:00Z. Logical clock at 2026-08-04T00:00:00Z."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Rowan Bramble", species: "Rubus idaeus", breeder_code: "RB", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
            - call: "POST /trial-sites"
              payload: { site_name: "Rowan Station", region_code: "PNW", plot_capacity: 60 }
              as: TrialCoordinator
              as_user_id: "coord-1"
              captures: { s_id: $.data.id }
            - call: "POST /variety-trials"
              payload: { variety_id: "${v_id}", trial_site_id: "${s_id}", plot_count: 10, plant_date: "2026-08-05T00:00:00Z", harvest_date: "2026-09-20T00:00:00Z" }
              as: TrialCoordinator
