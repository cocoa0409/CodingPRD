              as: FleetEngineer
              payload: { plant_id: "${plant_id}", application_name: "High Voltage Reach Trucks", forklift_class: CLASS_II, forklift_count: 4, shift_energy_kwh_per_shift: 8.00, shifts_per_day: 1, ambient_temp_c: 25.0, required_voltage_v: 48.0, compartment_max_kg: 1000.0, charge_window_hours: 9.00, chemistry_preference: ANY }
              captures: { err_no_design: "$.data.error_id" }
            - call: POST /fleet-sizing-requests
              as: FleetEngineer
              payload: { plant_id: "${plant_id}", application_name: "Tight Window Pickers", forklift_class: CLASS_II, forklift_count: 4, shift_energy_kwh_per_shift: 8.00, shifts_per_day: 1, ambient_temp_c: 25.0, required_voltage_v: 24.0, compartment_max_kg: 1000.0, charge_window_hours: 7.00, chemistry_preference: ANY }
              captures: { err_no_charger: "$.data.error_id" }
            - call: POST /fleet-sizing-requests
              as: FleetEngineer
              payload: { plant_id: "${plant_id}", application_name: "Lithium Only Pickers", forklift_class: CLASS_II, forklift_count: 4, shift_energy_kwh_per_shift: 8.00, shifts_per_day: 1, ambient_temp_c: 25.0, required_voltage_v: 24.0, compartment_max_kg: 1000.0, charge_window_hours: 9.00, chemistry_preference: LITHIUM_LFP }
              captures: { err_pref: "$.data.error_id" }
            - call: GET /fleet-sizing-requests
              as: FleetEngineer
              payload: { plant_id: "${plant_id}" }
          assert:
            - "The 48.0 V request answers 422 with error_id \"ERR_NO_ELIGIBLE_CELL_DESIGN\" - the only design's pack voltage is 12 * 2.00 == 24.0."
            - "The 7.00 h window answers 422 with error_id \"ERR_NO_CHARGER_MATCH\" - the pool is non-empty but the best charge time is 7.13 h, which exceeds the window; the 0.13 h margin is what separates this from the matched case."
            - "The LITHIUM_LFP preference answers 422 with error_id \"ERR_NO_ELIGIBLE_CELL_DESIGN\", NOT ERR_NO_CHARGER_MATCH - the preference filter empties the design pool before chargers are considered."
            - "GET /fleet-sizing-requests answers total_count == 0 - a failed selector persists nothing, so a retry after cataloguing a bigger charger is a clean create."

