          1_500_000 the 300_000 remainder is below min_prorated_award_cents
          500_000, so rank 2 is refused with ERR_DISCIPLINE_ALLOCATION_EXHAUSTED
          rather than prorated to 300_000. Re-approving rank 1 reports
          ERR_SLOT_STATE_INVALID, proving the action is not idempotent.
