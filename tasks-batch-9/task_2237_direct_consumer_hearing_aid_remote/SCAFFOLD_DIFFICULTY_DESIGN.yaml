          - "Clock moved to 2026-08-07T00:00:00Z; the return authorization is issued under OCC, picked up, received and inspected RESELLABLE, leaving the settlement pre-computed but unapplied."
        setup_api_calls:
          - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin, as_user_id: "admin_1" }
