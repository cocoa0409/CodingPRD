          trigger:
            - { call: "PATCH /bulk-liquid/dedicated-trailer-agreements/${agr}", payload: { committed_loads_per_month: 6, expected_agreement_version: "${agr_v}" }, as: FleetAdmin, captures: { v2: $.data.version } }
            - { call: "PATCH /bulk-liquid/dedicated-trailer-agreements/${agr}", payload: { committed_loads_per_month: 7, expected_agreement_version: "${agr_v}" }, as: FleetAdmin, captures: { err: $.data.error_id } }
          assert:
            - "first PATCH -> 200, committed_loads_per_month == 6, version advanced"
