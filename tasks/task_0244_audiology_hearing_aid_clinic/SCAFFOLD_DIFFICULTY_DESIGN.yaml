              as: Audiologist
              captures: { eval_id: $.data.id }
            - call: "POST /clinic/evaluations/${eval_id}/finalize"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", device_model_id: "${model_id}", ear_count: 1 }
              as: Audiologist
              captures: { order_id: $.data.id }
            - call: "POST /clinic/orders/${order_id}/start-trial"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/_clock/set"
              payload: { to_iso8601: "2026-03-31T00:00:00Z" }
              as: ClinicAdmin
          trigger:
            - call: "POST /clinic/orders/${order_id}/purchase"
              payload: {}
              as: BillingClerk
              captures: { st: $.data.status }
          assert:
            - "FittingOrder.${order_id}.status == PURCHASED"
            - "FittingOrder.${order_id}.patient_due_cents == 300000"

      - name: supply_cycle_due_at_lower_bound_ship_before_due_rejected
        grounds:
          - entities.SupplyCycle.fields.due_at
          - validations[priority=14]
          - state_machines.SupplyCycle.SCHEDULED_to_SHIPPED
        distinguishing_aspect: |
          SupplyCycle occupies a lower-bounded interval on the subscription cadence resource: shipping is
          allowed only when clock now >= due_at. Different interval semantics (inclusive LOWER bound on a
          recurring cadence resource) than the order's inclusive upper deadline. Ship one second before
          due_at is rejected.
        test_recipe:
          setup:
            - "Clock 2026-03-01. PURCHASED order, ACTIVE subscription cadence=30, cycle 1 due 2026-03-31T00:00:00Z."
            - "Clock left at 2026-03-30T23:59:59Z (just before due_at)."
          setup_api_calls:
            - call: "POST /clinic/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
