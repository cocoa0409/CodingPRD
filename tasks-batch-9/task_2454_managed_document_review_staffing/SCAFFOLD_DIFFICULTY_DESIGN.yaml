        distinguishing_aspect: "The SAME calendar adjacency yields the OPPOSITE verdict on a different resource: agreement coverage is CLOSED on both ends, so a new interval starting exactly at 2026-10-31T00:00:00Z collides with the EXECUTED [2026-08-01, 2026-10-31] agreement, while starting one day later is admitted."
