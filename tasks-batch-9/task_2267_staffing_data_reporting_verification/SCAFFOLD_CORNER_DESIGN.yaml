            - "the AUDIT_ADJUSTED read returns total_direct_care_hours == 0.00 and total_nurse_hprd == 0.0000, confirming the two variants disagree on this data"
            - "the accept stores audit_support_score == 50.00, from 100 * (0.50 * 0.0000 + 0.30 * 1.0000 + 0.20 * 1.0000), and auto-opens one DiscrepancyCase with trigger_reason AUDIT_SCORE_BELOW_FLOOR because 50.00 is below 70.00"
