  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (2 instances, different pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_on_protocol_submit
        grounds:
          - validations[priority=6]
          - validations[priority=23]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_GRANT_EXHAUSTED]
        distinguishing_aspect: |
          state (priority 6, ERR_INVALID_STATE) vs business_fiscal (priority 23, ERR_GRANT_EXHAUSTED): submitting a
          protocol that is not in DRAFT AND whose grant is exhausted returns
          ERR_INVALID_STATE (409), not ERR_GRANT_EXHAUSTED — the state check
          outranks the fiscal check.
        test_recipe:
          setup:
            - "Protocol submitted when its grant was solvent (now in DMR_REVIEW — state violation for re-submit)"
            - "The grant has since been drained to budget_remaining_cents == 0 by a posted billing run (fiscal violation)"
          setup_api_calls:
            - call: "POST /iacuc/investigators"
              payload: { full_name: "Dr. Prio", email: "prio@uni.edu", department: "Bio" }
              as: IacucAdministrator
              captures: { inv_id: $.data.id }
            - call: "POST /iacuc/grants"
              payload: { grant_number: "R01-700", investigator_id: "${inv_id}", budget_total_cents: 2625, expires_on: "2027-01-01T00:00:00Z" }
              as: IacucAdministrator
              captures: { grant_id: $.data.id }
            - call: "POST /iacuc/protocols"
              payload: { investigator_id: "${inv_id}", grant_id: "${grant_id}", title: "Prio study", species: "MOUSE", max_animals_justified: 5, pain_category: "C", review_path: "DMR" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { proto_id: $.data.id }
            - call: "POST /iacuc/protocols/${proto_id}/submit"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /iacuc/protocols/${proto_id}/review-decisions"
              payload:
                decisions:
                  - reviewer_kind: "DESIGNATED_MEMBER"
                    decision: "APPROVE"
              as: IacucAdministrator
            - call: "POST /iacuc/cages"
              payload: { cage_barcode: "PRIO-1", room_code: "VIV-100", species: "MOUSE", cage_kind: "STANDARD", capacity_adults: 5, protocol_id: "${proto_id}" }
              as: FacilityManager
              captures: { cage_id: $.data.id }
            - call: "POST /iacuc/animals"
              payload: { animal_tag: "PRIO-M1", cage_id: "${cage_id}", protocol_id: "${proto_id}", species: "MOUSE", date_of_birth: "2026-05-01T00:00:00Z", sex: "M" }
              as: AnimalCareStaff
            - call: "POST /iacuc/census-records"
              payload: { cage_id: "${cage_id}", census_date: "2026-08-01T00:00:00Z", physical_count: 1 }
              as: AnimalCareStaff
            - call: "POST /iacuc/billing-runs"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-22T00:00:00Z" }
              as: BillingCoordinator
              captures: { run_id: $.data.id }
            - call: "POST /iacuc/billing-runs/${run_id}/compute-provisional"
              payload: {}
              as: BillingCoordinator
              captures: { run_v: $.data.version }
            - call: "POST /iacuc/billing-runs/${run_id}/finalize"
              payload: { expected_billing_run_version: "${run_v}" }
              as: BillingCoordinator
              captures: { run_v2: $.data.version }
            - call: "POST /iacuc/billing-runs/${run_id}/post"
              payload: {}
              as: BillingCoordinator
          trigger:
            - call: "POST /iacuc/protocols/${proto_id}/submit"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Re-submit returns ERR_INVALID_STATE (409), not ERR_GRANT_EXHAUSTED (402) — state (6) outranks fiscal (23)"
            - "Grant.budget_remaining_cents == 0 after posting 2625 (the fiscal violation is real)"
            - "Protocol.status unchanged (still APPROVED)"


      - name: business_safety_vs_business_constraint_on_animal_add
        grounds:
          - validations[priority=11]
          - validations[priority=13]
          - errors[ERR_PROTOCOL_NOT_APPROVED]
          - errors[ERR_CAGE_MISMATCH]
        distinguishing_aspect: |
          business_safety (priority 11, protocol approval) vs business_constraint
          (priority 13, cage species/protocol match): adding an animal whose
          species mismatches the cage AND whose protocol is still DRAFT returns
          ERR_PROTOCOL_NOT_APPROVED (409), not ERR_CAGE_MISMATCH — safety gates
          precede referential-consistency constraints, a different category pair
          than state-vs-fiscal.
        test_recipe:
          setup:
            - "Protocol in DRAFT (never submitted)"
            - "Cage species RAT but animal species MOUSE (mismatch)"
          setup_api_calls:
            - call: "POST /iacuc/investigators"
              payload: { full_name: "Dr. Mismatch", email: "mm@uni.edu", department: "Bio" }
