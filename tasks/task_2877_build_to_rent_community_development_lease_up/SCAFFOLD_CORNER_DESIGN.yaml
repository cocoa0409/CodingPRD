          - entities.Community.fields.released_unit_count
        distinguishing_aspect: |
          One release call carries a list, so the endpoint must apply the whole batch and recompute the
          parent counters exactly once — three homes released together give released_unit_count 3, not 1
          and not 3 separate lifecycle flips. A second call on the same phase is a SECTIONS_RELEASED
          self-loop that adds to the counters without re-firing the CONSTRUCTION -> LEASE_UP promotion.
