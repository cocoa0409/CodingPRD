            - "The second call returns 409 ERR_TAX_CERTIFICATION_REQUIRED"
            - "The installment list shows total_count == 0 after both refusals and the award is still \"OFFERED\""
            - "The third call returns 200 with status \"ACCEPTED\", accept_agreement_version \"FELLOWSHIP-AGREEMENT-2027.1\", undisbursed_gross_cents == 1500000 and final_report_due_at \"2028-02-29T00:00:00.000Z\""

      - name: submit_with_every_gate_satisfied_stamps_the_full_snapshot
        claim_type: satisfaction_pass
        grounds:
          - state_machines.Application[DRAFT->SUBMITTED]
          - endpoints[POST /grants/applications/{application_id}/submit]
        distinguishing_aspect: |
          With the window open, the artist in good standing, two allowed samples
          on file and no prior award, the submit returns 200 and stamps all five
          derived snapshot fields at once: sealed_alias LIT-2027-0001,
          submitted_at, applicant_legal_name, applicant_region and
          residency_months_at_deadline 45, with blackout_gap_years null. An
          implementation that stamps the alias lazily or leaves the region null
          fails even though no validation was violated.
        test_recipe:
          setup:
            - "CornerMain cycle OPEN at 2026-09-01 with a complete two-sample DRAFT application"
          setup_api_calls:
