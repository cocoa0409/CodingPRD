scenario: |
  Generate task harder than expert level!

  2690. Host Travel Agency & Independent Advisor Commissions (host travel agency): advisor onboarding
  with agreement terms, errors-and-omissions coverage and supplier accreditation numbers, booking
  submission and tracking across supplier direct, consortium and internal booking tools, commission
  split tiers by production level with monthly settlement and chargeback for cancellations, supplier
  commission tracking with aging, claims for unpaid commissions and reconciliation, consortium
  membership benefits, preferred supplier programs and marketing fund access, advisor training,
  certification and compliance with seller-of-travel registration by state, client trust account
  handling where required and payment processing rules, advisor departure with client ownership and
  booking transition

domain_name: host-travel-agency-advisor-commissions
api_prefix: /host-agency

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by explicit foreign keys. Only two nested URL segments exist
  # (advisor-scoped creation of agreements/credentials, client-scoped trust ledger) and
  # they exist for ownership clarity, not because the model is a tree: bookings,
  # statements, claims, suppliers and settlement runs are all top-level collections that
  # reference each other by FK. Advisor.transition_advisor_id is self-referential.

  state_machine_shape: parallel
  # Booking carries two independent state axes on one row — booking_status
  # (SUBMITTED/CONFIRMED/TRAVELED/CANCELLED) and commission_status
  # (PENDING/EXPECTED/RECEIVED/CLAIMED/WRITTEN_OFF/CHARGED_BACK) — which advance on
  # separate triggers. Advisor (ACTIVE <-> SUSPENDED) and CommissionClaim
  # (SUBMITTED -> DENIED -> SUBMITTED) are cyclic; SettlementRun is compound
  # (CLOSED is derived from all child AdvisorStatement rows reaching PAID).

  relationship_patterns:
    - one_to_many
    - many_to_many          # Advisor x Supplier via ComplianceCredential(SUPPLIER_ACCREDITATION)
    - self_referential      # Advisor.transition_advisor_id -> Advisor.id
    - polymorphic           # ComplianceCredential.credential_type selects which optional columns bind
    - cross_aggregate       # Booking -> AdvisorAgreement (pinned terms), Booking -> AdvisorStatement

  role_model: segregation_of_duties
  # ComplianceOfficer verifies credentials; HostOperations activates advisors; HostController
  # settles. Within HostController, the X-User-ID that calculated a SettlementRun may not be
  # the X-User-ID that posts it.

  consistency_model: immediate

difficulty_level: expert_plus
# 12 entities / 47 endpoints / 52 error codes / 29 ordered validations /
# 11 calculations (3 carrying explicit variants) / 8 state machines across 8 state fields
# (2 cyclic, Booking carries 2 independent dimensions, SettlementRun is compound) /
# 2 OCC rules / 2 cascade chains of depth 4.
# Density target: every money field is reachable by at least two different paths whose
# results legitimately diverge, and the scaffold pins which one wins.

entities:
  - name: Advisor
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Advisor's legal name as it appears on the independent-contractor agreement.
        constraints: non-empty, max 200 chars
      - name: email
        type: string
        source: input
        description: Login/contact email for the advisor.
        constraints: unique across all Advisor rows regardless of status (including DEPARTED)
      - name: seller_of_travel_state
        type: string
        source: input
        description: Two-letter USPS code of the state whose seller-of-travel regime governs this advisor.
        constraints: exactly 2 uppercase letters
      - name: consortium_id
        type: string
        source: input
        description: "FK -> Consortium.id; nullable — null means the advisor is not a consortium member."
        default: null
      - name: status
        type: enum
        source: system
        description: Advisor lifecycle state.
        default: DRAFT
        constraints: status IN {DRAFT, ACTIVE, SUSPENDED, DEPARTING, DEPARTED}
      - name: trust_account_required
        type: boolean
        source: computed
        description: True when seller_of_travel_state IN TRUST_STATES (see calculations.trust_requirement_derivation).
      - name: production_ytd_provisional_cents
        type: integer
        source: computed
        description: Provisional variant of calculations.advisor_production_ytd.
        default: 0
      - name: production_ytd_final_cents
        type: integer
        source: computed
        description: Final variant of calculations.advisor_production_ytd.
        default: 0
      - name: split_tier_provisional
        type: integer
        source: computed
        description: tier_level from calculations.split_tier_selection on the PROVISIONAL basis.
        default: 1
      - name: split_tier_final
        type: integer
        source: computed
        description: tier_level from calculations.split_tier_selection on the FINAL basis; the settlement engine uses this one.
        default: 1
      - name: eo_coverage_verified_cents
        type: integer
        source: computed
        description: Max coverage_amount_cents across this advisor's ComplianceCredential rows with credential_type == EO_POLICY AND status == VERIFIED; 0 when that set is empty.
        default: 0
      - name: lifetime_settled_share_cents
        type: integer
        source: computed
        description: Running total of advisor_share_cents across this advisor's AdvisorStatement rows with status IN {POSTED, PAID}.
        default: 0
      - name: lifetime_chargeback_cents
        type: integer
        source: computed
        description: Running total of chargeback_cents across this advisor's AdvisorStatement rows with status IN {POSTED, PAID}.
        default: 0
      - name: carryforward_chargeback_cents
        type: integer
        source: computed
        description: Chargeback amount that a posted statement could not absorb because net_payout_cents floored at 0; carried into the next run.
        default: 0
      - name: activated_by_user_id
        type: string
        source: system
        description: X-User-ID of the HostOperations operator that called activate; null until activation.
        default: null
      - name: departure_effective_date
        type: datetime
        source: system
        description: Date (ISO 8601 UTC) recorded when departure was initiated; null until then.
        default: null
      - name: transition_advisor_id
        type: string
        source: system
        description: "FK -> Advisor.id; nullable — the receiving advisor recorded at departure initiation, used by the departure cascade."
        default: null

  - name: AdvisorAgreement
    parent: null
    common_fields: true
    fields:
      - name: advisor_id
        type: string
        source: input
        description: FK -> Advisor.id
      - name: split_schedule_id
        type: string
        source: input
        description: FK -> SplitSchedule.id
      - name: effective_date
        type: datetime
        source: input
        description: ISO 8601 UTC instant from which these terms govern newly submitted bookings.
      - name: signed_at
        type: datetime
        source: system
        description: Server-stamped instant (logical clock) at which the agreement row was created.
      - name: post_departure_advisor_pct
        type: number
        source: input
        description: Advisor share applied to bookings transitioned away from this advisor after DEPARTED.
        constraints: 0 <= post_departure_advisor_pct <= 1
      - name: status
        type: enum
        source: system
        description: Agreement lifecycle state.
        default: ACTIVE
        constraints: status IN {ACTIVE, SUPERSEDED, TERMINATED}

  - name: SplitSchedule
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Human label for this commission-split schedule.
      - name: tiers
        type: array
        source: input
        description: "Production tiers: array of objects {tier_level: integer, min_production_cents: integer, advisor_pct: number}."
        constraints: >-
          length >= 1; tier_level values are 1..N contiguous; exactly one entry has
          min_production_cents == 0; min_production_cents strictly increasing with tier_level;
          0 < advisor_pct <= 1
      - name: platform_fee_tiers
        type: array
        source: input
        description: "Host platform-fee tiers: array of objects {min_share_cents: integer, fee_pct: number}."
        constraints: >-
          length >= 1; exactly one entry has min_share_cents == 0; min_share_cents strictly
          increasing; 0 <= fee_pct < 1
      - name: chargeback_retention_pct
        type: number
        source: input
        description: Fraction of a settled advisor share the advisor keeps when a cancellation is SUPPLIER_INITIATED.
        default: 0.10
        constraints: 0 <= chargeback_retention_pct < 1

  - name: ComplianceCredential
    parent: null
    common_fields: true
    fields:
      - name: advisor_id
        type: string
        source: input
        description: FK -> Advisor.id
      - name: credential_type
        type: enum
        source: input
        description: Which compliance artifact this row represents; selects which optional columns are required.
        constraints: credential_type IN {SELLER_OF_TRAVEL, EO_POLICY, TRAINING_CERT, SUPPLIER_ACCREDITATION}
      - name: jurisdiction_state_code
        type: string
        source: input
        description: Two-letter USPS code the registration covers; required when credential_type == SELLER_OF_TRAVEL, must be null otherwise.
        default: null
      - name: supplier_id
        type: string
        source: input
        description: "FK -> Supplier.id; nullable — required when credential_type == SUPPLIER_ACCREDITATION, must be null otherwise."
        default: null
      - name: credential_number
        type: string
        source: input
        description: Registration / policy / accreditation number as issued (e.g. CA ST-12345678, IATA/ARC number).
        constraints: non-empty
      - name: coverage_amount_cents
        type: integer
        source: input
        description: Errors-and-omissions per-occurrence limit in cents; required when credential_type == EO_POLICY, must be null otherwise.
        default: null
      - name: effective_on
        type: datetime
        source: input
        description: ISO 8601 UTC instant from which the credential is in force (inclusive).
      - name: expires_on
        type: datetime
        source: input
        description: ISO 8601 UTC instant at which the credential lapses (exclusive upper bound of coverage).
        constraints: expires_on > effective_on
      - name: status
        type: enum
        source: system
        description: Credential review/validity state.
        default: PENDING_REVIEW
        constraints: status IN {PENDING_REVIEW, VERIFIED, REJECTED, EXPIRED, REVOKED}
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer that verified this credential; null until VERIFIED.
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: Logical-clock instant of verification; null until VERIFIED.
        default: null

  - name: Consortium
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Consortium trade name.
      - name: membership_fee_cents
        type: integer
        source: input
        description: Annual membership fee charged to member advisors.
        constraints: ">= 0"
      - name: marketing_fund_accrual_pct
        type: number
        source: input
        description: Fraction of a statement's post-platform-fee share diverted into the consortium marketing fund.
        constraints: 0 <= marketing_fund_accrual_pct < 1
      - name: consortium_channel_bonus_pct
        type: number
        source: input
        description: Additive commission-rate bonus applied when a booking's channel == CONSORTIUM and the supplier belongs to this same consortium.
        constraints: 0 <= consortium_channel_bonus_pct < 1
      - name: marketing_fund_balance_cents
        type: integer
        source: computed
        description: Running total of marketing_fund_cents across AdvisorStatement rows with status IN {POSTED, PAID} whose advisor's consortium_id == this Consortium.id.
        default: 0

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Supplier trade name.
      - name: accreditation_scheme
        type: enum
        source: input
        description: Which accreditation number the supplier requires an advisor to hold.
        constraints: accreditation_scheme IN {IATA, CLIA, ARC, TIDS}
      - name: consortium_id
        type: string
        source: input
        description: "FK -> Consortium.id; nullable — null means the supplier is not on any consortium's preferred program."
        default: null
      - name: program_status
        type: enum
        source: input
        description: Preferred-supplier program standing; PROBATION is only reachable via the chargeback cascade.
        default: STANDARD
        constraints: program_status IN {STANDARD, PREFERRED, PROBATION}
      - name: base_commission_pct
        type: number
        source: input
        description: Default commission rate paid by this supplier.
        constraints: 0 < base_commission_pct < 1
      - name: preferred_override_commission_pct
        type: number
        source: input
        description: Commission rate paid when the supplier is PREFERRED and the booking advisor shares the supplier's consortium.
        constraints: 0 < preferred_override_commission_pct < 1
      - name: rate_ceiling_pct
        type: number
        source: input
        description: Hard ceiling on the effective rate after channel bonuses are added.
        constraints: 0 < rate_ceiling_pct <= 1
      - name: max_commission_per_booking_cents
        type: integer
        source: input
        description: Absolute per-booking cap on expected commission in cents.
        constraints: "> 0"
      - name: remit_terms_days
        type: integer
        source: input
        description: Days after travel_end_date at which commission becomes due from this supplier.
        constraints: ">= 0"
      - name: probation_chargeback_threshold
        type: integer
        source: input
        description: chargeback_count value at or above which program_status is forced to PROBATION.
        default: 2
        constraints: ">= 1"
      - name: chargeback_count
        type: integer
        source: computed
        description: Count of this supplier's Booking rows with commission_status == CHARGED_BACK.
        default: 0
      - name: aging_0_30_cents
        type: integer
        source: computed
        description: Bucket 0 of calculations.supplier_commission_aging (age_days 0..30 inclusive).
        default: 0
      - name: aging_31_60_cents
        type: integer
        source: computed
        description: Bucket 1 of calculations.supplier_commission_aging (age_days 31..60 inclusive).
        default: 0
      - name: aging_61_90_cents
        type: integer
        source: computed
        description: Bucket 2 of calculations.supplier_commission_aging (age_days 61..90 inclusive).
        default: 0
      - name: aging_over_90_cents
        type: integer
        source: computed
        description: Bucket 3 of calculations.supplier_commission_aging (age_days >= 91).
        default: 0
      - name: total_outstanding_cents
        type: integer
        source: computed
        description: Sum of the four aging buckets.
        default: 0

  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: owner_advisor_id
        type: string
        source: input
        description: FK -> Advisor.id
      - name: full_name
        type: string
        source: input
        description: Travelling client's name.
      - name: home_state_code
        type: string
        source: input
        description: Two-letter USPS code of the client's residence state.
        constraints: exactly 2 uppercase letters
      - name: ownership_mode
        type: enum
        source: input
        description: Who owns the client relationship under the agreement; drives the departure cascade.
        default: HOST_OWNED
        constraints: ownership_mode IN {ADVISOR_OWNED, HOST_OWNED}
      - name: portability_status
        type: enum
        source: system
        description: RELEASED once an ADVISOR_OWNED client has been released by the departure cascade.
        default: RETAINED
        constraints: portability_status IN {RETAINED, RELEASED}
      - name: trust_balance_cents
        type: integer
        source: computed
        description: Sum of signed_amount_cents over this client's TrustLedgerEntry rows (calculations.client_trust_balance).
        default: 0
      - name: max_concurrent_trips
        type: integer
        source: input
        description: Aggregate capacity used by the travel-window overlap rule; how many non-cancelled bookings may cover the same instant.
        default: 1
        constraints: ">= 1"

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - name: advisor_id
        type: string
        source: input
        description: FK -> Advisor.id
      - name: supplier_id
        type: string
        source: input
        description: FK -> Supplier.id
      - name: client_id
        type: string
        source: input
        description: FK -> Client.id
      - name: agreement_id
        type: string
        source: system
        description: "FK -> AdvisorAgreement.id; pinned at submission to the advisor's status == ACTIVE agreement, so later agreements do not restate this booking's terms."
      - name: statement_id
        type: string
        source: system
        description: "FK -> AdvisorStatement.id; nullable — set when a settlement run's calculate step claims this booking."
        default: null
      - name: channel
        type: enum
        source: input
        description: Which booking tool the reservation was placed through.
        constraints: channel IN {SUPPLIER_DIRECT, CONSORTIUM, INTERNAL_TOOL}
      - name: payment_method
        type: enum
        source: input
        description: How the client's money is handled.
        constraints: payment_method IN {CLIENT_TRUST, MERCHANT_DIRECT, HOST_MERCHANT}
      - name: gross_sale_cents
        type: integer
        source: input
        description: Total sale value in cents.
        constraints: "> 0"
      - name: non_commissionable_cents
        type: integer
        source: input
        description: Portion of gross_sale_cents that earns no commission (taxes, port fees).
        default: 0
        constraints: 0 <= non_commissionable_cents <= gross_sale_cents
      - name: deposit_amount_cents
        type: integer
        source: input
        description: Client money that must be on hand before the booking may be confirmed.
        constraints: 0 <= deposit_amount_cents <= gross_sale_cents
      - name: travel_start_date
        type: datetime
        source: input
        description: ISO 8601 UTC instant the travel window opens (inclusive).
      - name: travel_end_date
        type: datetime
        source: input
        description: ISO 8601 UTC instant the travel window closes (exclusive).
        constraints: travel_end_date > travel_start_date
      - name: booking_status
        type: enum
        source: system
        description: Fulfilment axis of the parallel state machine.
        default: SUBMITTED
        constraints: booking_status IN {SUBMITTED, CONFIRMED, TRAVELED, CANCELLED}
      - name: commission_status
        type: enum
        source: system
        description: Money axis of the parallel state machine; advances independently of booking_status.
        default: PENDING
        constraints: commission_status IN {PENDING, EXPECTED, RECEIVED, CLAIMED, WRITTEN_OFF, CHARGED_BACK}
      - name: commissionable_base_cents
        type: integer
        source: computed
        description: gross_sale_cents - non_commissionable_cents.
        default: 0
      - name: applied_commission_rate
        type: number
        source: computed
        description: effective_rate chosen by calculations.booking_expected_commission, recomputed whenever the supplier's program_status changes while commission_status == PENDING.
        default: 0
      - name: expected_commission_cents
        type: integer
        source: computed
        description: Output of calculations.booking_expected_commission.
        default: 0
      - name: received_commission_cents
        type: integer
        source: computed
        description: Amount actually remitted by the supplier against this booking.
        default: 0
      - name: shortfall_cents
        type: integer
        source: computed
        description: max(0, expected_commission_cents - received_commission_cents) once a receipt has been recorded; 0 before that.
        default: 0
      - name: commission_received_on
        type: datetime
        source: system
        description: ISO 8601 UTC instant the supplier remittance was recorded; null until then. Drives settlement-run inclusion.
        default: null
      - name: settled_share_cents
        type: integer
        source: computed
        description: Per-booking advisor share written by calculations.statement_advisor_share_rollup; the chargeback calculation reverses exactly this number.
        default: 0
      - name: settled_tier_level
        type: integer
        source: system
        description: tier_level that was in force when this booking was settled; null until settled.
        default: null
      - name: chargeback_amount_cents
        type: integer
        source: computed
        description: Output of calculations.cancellation_chargeback; 0 unless commission_status == CHARGED_BACK.
        default: 0
      - name: chargeback_recognized_at
        type: datetime
        source: system
        description: Logical-clock instant at which a settlement run's calculate step folded this booking's chargeback_amount_cents into an AdvisorStatement; null means the chargeback is still unrecognized and will be picked up by the next run. Guarantees a chargeback is counted exactly once.
        default: null
      - name: cancellation_reason
        type: enum
        source: input
        description: Why the booking was cancelled; selects the chargeback variant. Null until cancelled.
        default: null
        constraints: cancellation_reason IN {CLIENT_INITIATED, ADVISOR_ERROR, SUPPLIER_INITIATED}

  - name: TrustLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: client_id
        type: string
        source: input
        description: FK -> Client.id
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; nullable — null for unallocated deposits."
        default: null
      - name: direction
        type: enum
        source: input
        description: Cash direction of this immutable ledger line.
        constraints: direction IN {DEPOSIT, DISBURSEMENT, REFUND}
      - name: amount_cents
        type: integer
        source: input
        description: Unsigned magnitude of the movement.
        constraints: "> 0"
      - name: signed_amount_cents
        type: integer
        source: computed
        description: "+amount_cents when direction == DEPOSIT, -amount_cents when direction IN {DISBURSEMENT, REFUND}."
      - name: balance_after_cents
        type: integer
        source: computed
        description: Client.trust_balance_cents immediately after this entry was appended.
      - name: memo
        type: string
        source: input
        description: Free-text audit memo.
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the caller that appended the entry.

  - name: CommissionClaim
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: FK -> Booking.id
      - name: advisor_id
        type: string
        source: system
        description: "FK -> Advisor.id; copied from the booking at claim creation."
      - name: claimed_amount_cents
        type: integer
        source: input
        description: Unpaid commission the advisor is claiming from the supplier.
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: Claim lifecycle state; DENIED -> SUBMITTED is the resubmission cycle.
        default: SUBMITTED
        constraints: status IN {SUBMITTED, DENIED, RESOLVED_PAID, RESOLVED_WRITTEN_OFF}
      - name: round_count
        type: integer
        source: system
        description: Number of times the claim has entered SUBMITTED; starts at 1, incremented by each resubmission.
        default: 1
      - name: denial_reason
        type: string
        source: system
        description: Supplier's most recent denial text; null while SUBMITTED for the first time.
        default: null
      - name: aging_days
        type: integer
        source: computed
        description: Whole UTC days from created_at to the logical clock (calculations.claim_aging_escalation).
        default: 0
      - name: escalation_level
        type: enum
        source: computed
        description: Threshold band derived from aging_days.
        default: NORMAL
        constraints: escalation_level IN {NORMAL, ESCALATED, CRITICAL}
      - name: resolved_amount_cents
        type: integer
        source: computed
        description: Amount actually recovered at resolution; equals the recorded receipt for RESOLVED_PAID, 0 for RESOLVED_WRITTEN_OFF.
        default: 0

  - name: SettlementRun
    parent: null
    common_fields: true
    fields:
      - name: period_month
        type: string
        source: input
        description: Settlement period in YYYY-MM form; the run covers [YYYY-MM-01T00:00:00Z, first instant of the next month).
        constraints: matches ^\d{4}-(0[1-9]|1[0-2])$ and is unique across SettlementRun rows
      - name: status
        type: enum
        source: system
        description: Run lifecycle; CLOSED is derived from child statements, never requested directly.
        default: OPEN
        constraints: status IN {OPEN, CALCULATED, POSTED, CLOSED}
      - name: calculated_by_user_id
        type: string
        source: system
        description: X-User-ID that ran calculate; null until then.
        default: null
      - name: posted_by_user_id
        type: string
        source: system
        description: X-User-ID that posted the run; must differ from calculated_by_user_id.
        default: null
      - name: statement_count
        type: integer
        source: computed
        description: Count of AdvisorStatement rows whose settlement_run_id == this run.
        default: 0
      - name: gross_commission_cents
        type: integer
        source: computed
        description: Sum of gross_commission_cents over this run's statements.
        default: 0
      - name: advisor_share_total_cents
        type: integer
        source: computed
        description: Sum of advisor_share_cents over this run's statements.
        default: 0
      - name: chargeback_total_cents
        type: integer
        source: computed
        description: Sum of chargeback_cents over this run's statements.
        default: 0
      - name: platform_fee_total_cents
        type: integer
        source: computed
        description: Sum of platform_fee_cents over this run's statements.
        default: 0
      - name: marketing_fund_total_cents
        type: integer
        source: computed
        description: Sum of marketing_fund_cents over this run's statements.
        default: 0
      - name: net_payout_total_cents
        type: integer
        source: computed
        description: Sum of net_payout_cents over this run's statements.
        default: 0

  - name: AdvisorStatement
    parent: null
    common_fields: true
    fields:
      - name: settlement_run_id
        type: string
        source: system
        description: FK -> SettlementRun.id
      - name: advisor_id
        type: string
        source: system
        description: FK -> Advisor.id
      - name: tier_level_applied
        type: integer
        source: computed
        description: Advisor.split_tier_final as observed at calculate time.
      - name: advisor_pct_applied
        type: number
        source: computed
        description: advisor_pct of the applied tier from the agreement's SplitSchedule.
      - name: booking_count
        type: integer
        source: computed
        description: Count of Booking rows claimed by this statement (statement_id == this id).
        default: 0
      - name: gross_commission_cents
        type: integer
        source: computed
        description: Sum of received_commission_cents over the claimed bookings.
        default: 0
      - name: advisor_share_cents
        type: integer
        source: computed
        description: Output of calculations.statement_advisor_share_rollup (round-then-sum).
        default: 0
      - name: chargeback_cents
        type: integer
        source: computed
        description: Sum of chargeback_amount_cents over bookings charged back in this period plus Advisor.carryforward_chargeback_cents at calculate time.
        default: 0
      - name: platform_fee_cents
        type: integer
        source: computed
        description: Output of calculations.host_platform_fee step 3.
        default: 0
      - name: marketing_fund_cents
        type: integer
        source: computed
        description: Output of calculations.host_platform_fee step 4; 0 when the advisor has no consortium_id.
        default: 0
      - name: net_payout_cents
        type: integer
        source: computed
        description: Output of calculations.host_platform_fee step 5, floored at 0.
        default: 0
      - name: carryforward_applied_cents
        type: integer
        source: computed
        description: Portion of chargeback_cents that could not be absorbed and was written back to Advisor.carryforward_chargeback_cents.
        default: 0
      - name: status
        type: enum
        source: system
        description: Statement lifecycle state.
        default: DRAFT
        constraints: status IN {DRAFT, POSTED, PAID}
      - name: paid_at
        type: datetime
        source: system
        description: Logical-clock instant the payout was recorded; null until PAID.
        default: null

state_machines:
  - entity: Advisor
    state_field: status
    initial_state: DRAFT
    terminal_states: [DEPARTED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /host-agency/advisors/{advisor_id}/activate"
        actor: HostOperations
        preconditions:
          - "advisor.status == DRAFT"
          - "exactly one AdvisorAgreement exists with advisor_id == advisor.id AND status == ACTIVE"
          - "a ComplianceCredential exists with advisor_id == advisor.id AND credential_type == SELLER_OF_TRAVEL AND status == VERIFIED AND jurisdiction_state_code == advisor.seller_of_travel_state AND effective_on <= clock_now < expires_on"
          - "a ComplianceCredential exists with advisor_id == advisor.id AND credential_type == EO_POLICY AND status == VERIFIED AND effective_on <= clock_now < expires_on AND coverage_amount_cents >= MIN_EO_COVERAGE_CENTS (100000000)"
          - "a ComplianceCredential exists with advisor_id == advisor.id AND credential_type == TRAINING_CERT AND status == VERIFIED AND effective_on <= clock_now < expires_on"
        side_effects:
          - "advisor.status = ACTIVE"
          - "advisor.activated_by_user_id = X-User-ID of the caller"
          - "recompute advisor.trust_account_required per calculations.trust_requirement_derivation"
          - "recompute advisor.eo_coverage_verified_cents as max(coverage_amount_cents) over VERIFIED EO_POLICY credentials"
          - "increments Advisor.version by 1"
        note: "Onboarding gate: agreement terms + seller-of-travel registration + E&O coverage + training certification must all be in force at the logical clock."

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /host-agency/advisors/{advisor_id}/suspend"
        actor: ComplianceOfficer
        preconditions:
          - "advisor.status == ACTIVE"
        side_effects:
          - "advisor.status = SUSPENDED"
          - "increments Advisor.version by 1"
          - "no Booking row is mutated; existing bookings keep their booking_status and commission_status (suspension only blocks new submissions via validations[priority=40])"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: a ComplianceCredential with credential_type == SELLER_OF_TRAVEL is moved to REVOKED by POST /host-agency/compliance-credentials/{credential_id}/decision"
        actor: system
        preconditions:
          - "the revoked credential's advisor_id points at an Advisor with status == ACTIVE"
          - "after the revocation, no other ComplianceCredential of that advisor satisfies credential_type == SELLER_OF_TRAVEL AND status == VERIFIED AND jurisdiction_state_code == advisor.seller_of_travel_state AND effective_on <= clock_now < expires_on"
        side_effects:
          - "advisor.status = SUSPENDED"
          - "increments Advisor.version by 1"
        note: "Cross-entity guard: losing the last in-force seller-of-travel registration auto-suspends the advisor."

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /host-agency/advisors/{advisor_id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "advisor.status == SUSPENDED"
          - "a ComplianceCredential exists with advisor_id == advisor.id AND credential_type == SELLER_OF_TRAVEL AND status == VERIFIED AND jurisdiction_state_code == advisor.seller_of_travel_state AND effective_on <= clock_now < expires_on"
          - "a ComplianceCredential exists with advisor_id == advisor.id AND credential_type == EO_POLICY AND status == VERIFIED AND effective_on <= clock_now < expires_on AND coverage_amount_cents >= MIN_EO_COVERAGE_CENTS"
        side_effects:
          - "advisor.status = ACTIVE"
          - "recompute advisor.eo_coverage_verified_cents"
          - "increments Advisor.version by 1"
        note: "ACTIVE <-> SUSPENDED is the Advisor cycle; reinstatement re-checks compliance at the current clock rather than trusting the state it had when suspended."

      - from: ACTIVE
        to: DEPARTING
        trigger: "POST /host-agency/advisors/{advisor_id}/departure"
        actor: Advisor | HostOperations
        preconditions:
          - "advisor.status IN {ACTIVE, SUSPENDED}"
          - "the request's transition_advisor_id resolves to an Advisor with status == ACTIVE and id != advisor.id"
        side_effects:
          - "advisor.status = DEPARTING"
          - "advisor.departure_effective_date = request effective_date"
          - "advisor.transition_advisor_id = request transition_advisor_id"
          - "increments Advisor.version by 1"

      - from: SUSPENDED
        to: DEPARTING
        trigger: "POST /host-agency/advisors/{advisor_id}/departure"
        actor: Advisor | HostOperations
        preconditions:
          - "advisor.status IN {ACTIVE, SUSPENDED}"
          - "the request's transition_advisor_id resolves to an Advisor with status == ACTIVE and id != advisor.id"
        side_effects:
          - "advisor.status = DEPARTING"
          - "advisor.departure_effective_date = request effective_date"
          - "advisor.transition_advisor_id = request transition_advisor_id"
          - "increments Advisor.version by 1"

      - from: DEPARTING
        to: DEPARTED
        trigger: "POST /host-agency/advisors/{advisor_id}/departure/finalize"
        actor: ComplianceOfficer
        preconditions:
          - "advisor.status == DEPARTING"
          - "no CommissionClaim exists with advisor_id == advisor.id AND status IN {SUBMITTED, DENIED}"
          - "every Client with owner_advisor_id == advisor.id has trust_balance_cents == 0"
          - "the Advisor referenced by advisor.transition_advisor_id still has status == ACTIVE"
          - "the Advisor referenced by advisor.transition_advisor_id has exactly one AdvisorAgreement with status == ACTIVE"
        side_effects:
          - "CASCADE-B LINK 1: advisor.status = DEPARTED; every AdvisorAgreement with advisor_id == advisor.id AND status == ACTIVE moves to TERMINATED"
          - "CASCADE-B LINK 2 (caused by LINK 1, not by the request): because the departing advisor now has no ACTIVE agreement, each Client with owner_advisor_id == advisor.id is re-homed — Clients with ownership_mode == HOST_OWNED get owner_advisor_id = advisor.transition_advisor_id (portability_status stays RETAINED); Clients with ownership_mode == ADVISOR_OWNED keep owner_advisor_id and get portability_status = RELEASED. Client.version increments by 1 on every row touched."
          - "CASCADE-B LINK 3 (caused by LINK 2, not by the request): for each Client whose owner_advisor_id actually changed in LINK 2, every Booking with client_id == that Client AND booking_status IN {SUBMITTED, CONFIRMED} gets advisor_id = advisor.transition_advisor_id and agreement_id = the transition advisor's status == ACTIVE agreement id; for those whose commission_status == PENDING, applied_commission_rate and expected_commission_cents are recomputed under the transition advisor's consortium context per calculations.booking_expected_commission. Booking.version increments by 1 on every row touched."
          - "CASCADE-B LINK 4 (caused by LINK 3, not by the request): because bookings changed hands, production_ytd_provisional_cents and split_tier_provisional are recomputed for BOTH the departing advisor and the transition advisor per calculations.advisor_production_ytd (PROVISIONAL) and calculations.split_tier_selection; Advisor.version increments by 1 on the transition advisor row."
          - "Bookings of the departing advisor that are already booking_status IN {TRAVELED, CANCELLED} are NOT transitioned; they stay on the departed advisor and settle at the TERMINATED agreement's post_departure_advisor_pct per calculations.statement_advisor_share_rollup."
          - "increments Advisor.version by 1 on the departing advisor row (in addition to LINK 4's increment on the transition advisor)"

  - entity: Booking
    state_field: booking_status
    initial_state: SUBMITTED
    terminal_states: [TRAVELED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /host-agency/bookings/{booking_id}/confirm"
        actor: SupplierPortal
        preconditions:
          - "booking.booking_status == SUBMITTED"
          - "the acting SupplierPortal X-User-ID equals booking.supplier_id"
          - "the Advisor referenced by booking.advisor_id has status IN {ACTIVE, SUSPENDED, DEPARTING}"
          - "if booking.payment_method == CLIENT_TRUST then Client.trust_balance_cents >= booking.deposit_amount_cents"
        side_effects:
          - "booking.booking_status = CONFIRMED"
          - "commission_status axis advances PENDING -> EXPECTED when expected_commission_cents > 0, or PENDING -> WRITTEN_OFF when expected_commission_cents == 0 (see the commission_status machine)"
          - "if booking.payment_method == CLIENT_TRUST: a TrustLedgerEntry with direction == DISBURSEMENT, amount_cents == booking.deposit_amount_cents, booking_id == booking.id is appended and Client.trust_balance_cents is recomputed per calculations.client_trust_balance; Client.version increments by 1"
          - "recompute Supplier aging buckets per calculations.supplier_commission_aging"
          - "increments Booking.version by 1"

      - from: CONFIRMED
        to: TRAVELED
        trigger: "POST /host-agency/bookings/{booking_id}/traveled"
        actor: HostOperations
        preconditions:
          - "booking.booking_status == CONFIRMED"
          - "clock_now >= booking.travel_end_date"
        side_effects:
          - "booking.booking_status = TRAVELED"
          - "recompute Supplier aging buckets per calculations.supplier_commission_aging (the booking becomes eligible for the aging cohort once travel_end_date + remit_terms_days <= clock date)"
          - "increments Booking.version by 1"

      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /host-agency/bookings/{booking_id}/cancel"
        actor: Advisor | HostOperations
        preconditions:
          - "booking.booking_status IN {SUBMITTED, CONFIRMED}"
          - "the acting Advisor X-User-ID equals booking.advisor_id when the caller's role is Advisor"
        side_effects:
          - "booking.booking_status = CANCELLED; booking.cancellation_reason = request cancellation_reason"
          - "commission_status axis: EXPECTED -> WRITTEN_OFF, or RECEIVED -> CHARGED_BACK (see the commission_status machine); PENDING stays PENDING"
          - "increments Booking.version by 1"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /host-agency/bookings/{booking_id}/cancel"
        actor: Advisor | HostOperations
        preconditions:
          - "booking.booking_status IN {SUBMITTED, CONFIRMED}"
          - "the acting Advisor X-User-ID equals booking.advisor_id when the caller's role is Advisor"
        side_effects:
          - "booking.booking_status = CANCELLED; booking.cancellation_reason = request cancellation_reason"
          - "if booking.payment_method == CLIENT_TRUST AND a TrustLedgerEntry with direction == DISBURSEMENT AND booking_id == booking.id exists: a compensating TrustLedgerEntry with direction == REFUND is NOT auto-appended — the refund is an explicit HostController action, and validations[priority=95] blocks finalizing the advisor's departure while any Client still holds a non-zero trust_balance_cents"
          - "commission_status axis: EXPECTED -> WRITTEN_OFF, or RECEIVED -> CHARGED_BACK (see the commission_status machine)"
          - "increments Booking.version by 1"

  - entity: Booking
    state_field: commission_status
    initial_state: PENDING
    terminal_states: [WRITTEN_OFF, CHARGED_BACK]
    transitions:
      - from: PENDING
        to: EXPECTED
        trigger: "system event: booking_status SUBMITTED -> CONFIRMED"
        actor: system
        preconditions:
          - "booking.expected_commission_cents > 0"
        side_effects:
          - "booking.commission_status = EXPECTED"
          - "recompute the advisor's production_ytd_provisional_cents and split_tier_provisional"

      - from: PENDING
        to: WRITTEN_OFF
        trigger: "system event: booking_status SUBMITTED -> CONFIRMED with a zero commissionable base"
        actor: system
        preconditions:
          - "booking.expected_commission_cents == 0"
        side_effects:
          - "booking.commission_status = WRITTEN_OFF"
          - "no Supplier aging cohort membership is created for this booking (its outstanding amount is 0)"
        note: "Zero-commission boundary: a booking whose non_commissionable_cents equals gross_sale_cents skips the receivable lifecycle entirely."

      - from: EXPECTED
        to: RECEIVED
        trigger: "POST /host-agency/bookings/{booking_id}/commission-receipt"
        actor: SupplierPortal
        preconditions:
          - "booking.commission_status == EXPECTED"
          - "booking.booking_status IN {CONFIRMED, TRAVELED}"
          - "the acting SupplierPortal X-User-ID equals booking.supplier_id"
          - "request amount_cents <= booking.expected_commission_cents"
        side_effects:
          - "booking.received_commission_cents = request amount_cents; booking.commission_received_on = request received_on; booking.shortfall_cents = expected_commission_cents - received_commission_cents"
          - "booking.commission_status = RECEIVED"
          - "recompute Supplier aging buckets and total_outstanding_cents per calculations.supplier_commission_aging"
          - "recompute the advisor's production_ytd_final_cents and split_tier_final per calculations.advisor_production_ytd (FINAL) — the FINAL basis admits booking_status IN {CONFIRMED, TRAVELED} with commission_status == RECEIVED, so suppliers that remit on deposit move the FINAL basis before travel while the PROVISIONAL basis was already counting the booking at its expected amount"
          - "increments Booking.version by 1"

      - from: EXPECTED
        to: CLAIMED
        trigger: "POST /host-agency/bookings/{booking_id}/commission-claims"
        actor: Advisor
        preconditions:
          - "booking.commission_status == EXPECTED"
          - "booking.booking_status == TRAVELED"
          - "clock date >= booking.travel_end_date + Supplier.remit_terms_days"
          - "request claimed_amount_cents == booking.expected_commission_cents - booking.received_commission_cents"
        side_effects:
          - "a CommissionClaim row is created with status = SUBMITTED, round_count = 1, advisor_id = booking.advisor_id"
          - "booking.commission_status = CLAIMED"
          - "increments Booking.version by 1"

      - from: RECEIVED
        to: CLAIMED
        trigger: "POST /host-agency/bookings/{booking_id}/commission-claims"
        actor: Advisor
        preconditions:
          - "booking.commission_status == RECEIVED"
          - "booking.shortfall_cents > 0"
          - "booking.statement_id == null"
          - "request claimed_amount_cents == booking.shortfall_cents"
        side_effects:
          - "a CommissionClaim row is created with status = SUBMITTED, round_count = 1, advisor_id = booking.advisor_id"
          - "booking.commission_status = CLAIMED"
          - "recompute the advisor's production_ytd_final_cents (a CLAIMED booking leaves the FINAL basis) and split_tier_final"
          - "increments Booking.version by 1"
        note: "Short-pay path: a supplier that remits less than expected leaves a shortfall the advisor may claim, and the booking leaves the settlement-eligible set until the claim resolves."

      - from: CLAIMED
        to: RECEIVED
        trigger: "POST /host-agency/commission-claims/{claim_id}/resolve with resolution == PAID"
        actor: HostOperations
        preconditions:
          - "booking.commission_status == CLAIMED"
          - "claim.status IN {SUBMITTED, DENIED}"
        side_effects:
          - "booking.received_commission_cents += claim.resolved_amount_cents; booking.shortfall_cents = expected_commission_cents - received_commission_cents"
          - "booking.commission_status = RECEIVED; booking.commission_received_on = clock_now"
          - "recompute Supplier aging buckets; recompute the advisor's production_ytd_final_cents and split_tier_final"
          - "increments Booking.version by 1"

      - from: CLAIMED
        to: WRITTEN_OFF
        trigger: "POST /host-agency/commission-claims/{claim_id}/resolve with resolution == WRITTEN_OFF"
        actor: HostOperations
        preconditions:
          - "booking.commission_status == CLAIMED"
          - "claim.status IN {SUBMITTED, DENIED}"
        side_effects:
          - "booking.commission_status = WRITTEN_OFF; booking.shortfall_cents is left at its current value as the audit record of the loss"
          - "recompute Supplier aging buckets and total_outstanding_cents (the booking leaves the cohort)"
          - "recompute the advisor's production_ytd_final_cents and split_tier_final"
          - "increments Booking.version by 1"

      - from: EXPECTED
        to: WRITTEN_OFF
        trigger: "system event: booking_status -> CANCELLED while commission_status == EXPECTED"
        actor: system
        preconditions:
          - "booking.commission_status == EXPECTED"
        side_effects:
          - "booking.commission_status = WRITTEN_OFF"
          - "recompute Supplier aging buckets and total_outstanding_cents"
          - "recompute the advisor's production_ytd_provisional_cents and split_tier_provisional"

      - from: RECEIVED
        to: CHARGED_BACK
        trigger: "system event: booking_status -> CANCELLED while commission_status == RECEIVED"
        actor: system
        preconditions:
          - "booking.commission_status == RECEIVED"
        side_effects:
          - "CASCADE-A LINK 1: booking.commission_status = CHARGED_BACK; booking.chargeback_amount_cents = output of calculations.cancellation_chargeback (variant selected by booking.cancellation_reason)"
          - "CASCADE-A LINK 2 (caused by LINK 1, not by the cancel request): the supplier's chargeback_count is recomputed as the count of its CHARGED_BACK bookings, and when chargeback_count >= Supplier.probation_chargeback_threshold the supplier's program_status moves PREFERRED -> PROBATION; Supplier.version increments by 1"
          - "CASCADE-A LINK 3 (caused by LINK 2's program_status change, not by LINK 1): every Booking of that supplier with commission_status == PENDING has applied_commission_rate and expected_commission_cents recomputed per calculations.booking_expected_commission — a PROBATION supplier no longer grants preferred_override_commission_pct, so those bookings drop to base_commission_pct; Booking.version increments by 1 on each row touched"
          - "CASCADE-A LINK 4 (caused by LINK 3's expected_commission_cents rewrite, not by LINK 2): every Advisor owning a booking repriced in LINK 3 has production_ytd_provisional_cents recomputed and split_tier_provisional re-derived per calculations.split_tier_selection; Advisor.version increments by 1 on each row touched"
          - "if booking.statement_id != null: the chargeback is NOT retro-applied to the posted statement; it is accrued into the advisor's next statement per calculations.host_platform_fee step 5 and validations[priority=90]"
          - "recompute Supplier aging buckets and total_outstanding_cents"

  - entity: CommissionClaim
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [RESOLVED_PAID, RESOLVED_WRITTEN_OFF]
    transitions:
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /host-agency/commission-claims/{claim_id}/deny"
        actor: SupplierPortal
        preconditions:
          - "claim.status == SUBMITTED"
          - "the acting SupplierPortal X-User-ID equals the supplier_id of the Booking referenced by claim.booking_id"
        side_effects:
          - "claim.status = DENIED; claim.denial_reason = request denial_reason"
          - "recompute claim.aging_days and claim.escalation_level per calculations.claim_aging_escalation"
          - "increments CommissionClaim.version by 1"

      - from: DENIED
        to: SUBMITTED
        trigger: "POST /host-agency/commission-claims/{claim_id}/resubmit"
        actor: Advisor
        preconditions:
          - "claim.status == DENIED"
          - "claim.round_count < MAX_CLAIM_ROUNDS (3)"
          - "the acting Advisor X-User-ID equals claim.advisor_id"
        side_effects:
          - "claim.status = SUBMITTED; claim.round_count += 1"
          - "recompute claim.aging_days and claim.escalation_level"
          - "increments CommissionClaim.version by 1"
        note: "SUBMITTED -> DENIED -> SUBMITTED is the claim negotiation cycle; the round cap terminates it."

      - from: SUBMITTED
        to: RESOLVED_PAID
        trigger: "POST /host-agency/commission-claims/{claim_id}/resolve with resolution == PAID"
        actor: HostOperations
        preconditions:
          - "claim.status IN {SUBMITTED, DENIED}"
          - "request recovered_amount_cents > 0 AND request recovered_amount_cents <= claim.claimed_amount_cents"
        side_effects:
          - "claim.status = RESOLVED_PAID; claim.resolved_amount_cents = request recovered_amount_cents"
          - "the referenced Booking's commission_status moves CLAIMED -> RECEIVED (see the Booking commission_status machine)"
          - "increments CommissionClaim.version by 1"

      - from: SUBMITTED
        to: RESOLVED_WRITTEN_OFF
        trigger: "POST /host-agency/commission-claims/{claim_id}/resolve with resolution == WRITTEN_OFF"
        actor: HostOperations
        preconditions:
          - "claim.status IN {SUBMITTED, DENIED}"
          - "request recovered_amount_cents is absent or 0"
        side_effects:
          - "claim.status = RESOLVED_WRITTEN_OFF; claim.resolved_amount_cents = 0"
          - "the referenced Booking's commission_status moves CLAIMED -> WRITTEN_OFF"
          - "increments CommissionClaim.version by 1"

      - from: DENIED
        to: RESOLVED_WRITTEN_OFF
        trigger: "POST /host-agency/commission-claims/{claim_id}/resolve with resolution == WRITTEN_OFF"
        actor: HostOperations
        preconditions:
          - "claim.status IN {SUBMITTED, DENIED}"
          - "request recovered_amount_cents is absent or 0"
        side_effects:
          - "claim.status = RESOLVED_WRITTEN_OFF; claim.resolved_amount_cents = 0"
          - "the referenced Booking's commission_status moves CLAIMED -> WRITTEN_OFF"
          - "increments CommissionClaim.version by 1"

      - from: DENIED
        to: RESOLVED_PAID
        trigger: "POST /host-agency/commission-claims/{claim_id}/resolve with resolution == PAID"
        actor: HostOperations
        preconditions:
          - "claim.status IN {SUBMITTED, DENIED}"
          - "request recovered_amount_cents > 0 AND request recovered_amount_cents <= claim.claimed_amount_cents"
        side_effects:
          - "claim.status = RESOLVED_PAID; claim.resolved_amount_cents = request recovered_amount_cents"
          - "the referenced Booking's commission_status moves CLAIMED -> RECEIVED"
          - "increments CommissionClaim.version by 1"

  - entity: ComplianceCredential
    state_field: status
    initial_state: PENDING_REVIEW
    terminal_states: [REJECTED, REVOKED, EXPIRED]
    transitions:
      - from: PENDING_REVIEW
        to: VERIFIED
        trigger: "POST /host-agency/compliance-credentials/{credential_id}/decision with decision == VERIFY"
        actor: ComplianceOfficer
        preconditions:
          - "credential.status == PENDING_REVIEW"
          - "clock_now < credential.expires_on"
        side_effects:
          - "credential.status = VERIFIED; credential.verified_by_user_id = X-User-ID; credential.verified_at = clock_now"
          - "if credential_type == EO_POLICY: recompute Advisor.eo_coverage_verified_cents"
          - "increments ComplianceCredential.version by 1"

      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /host-agency/compliance-credentials/{credential_id}/decision with decision == REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "credential.status == PENDING_REVIEW"
        side_effects:
          - "credential.status = REJECTED"
          - "increments ComplianceCredential.version by 1"

      - from: VERIFIED
        to: REVOKED
        trigger: "POST /host-agency/compliance-credentials/{credential_id}/decision with decision == REVOKE"
        actor: ComplianceOfficer
        preconditions:
          - "credential.status == VERIFIED"
        side_effects:
          - "credential.status = REVOKED"
          - "if credential_type == EO_POLICY: recompute Advisor.eo_coverage_verified_cents"
          - "if credential_type == SELLER_OF_TRAVEL and the owning Advisor is left with no in-force VERIFIED SELLER_OF_TRAVEL credential for its seller_of_travel_state: the Advisor transitions ACTIVE -> SUSPENDED (see the Advisor machine)"
          - "increments ComplianceCredential.version by 1"

      - from: VERIFIED
        to: EXPIRED
        trigger: "system event: the logical clock is advanced past expires_on by POST /host-agency/_clock/set_current_utc"
        actor: system
        preconditions:
          - "credential.status == VERIFIED"
          - "clock_now >= credential.expires_on"
        side_effects:
          - "credential.status = EXPIRED"
          - "if credential_type == EO_POLICY: recompute Advisor.eo_coverage_verified_cents"
          - "increments ComplianceCredential.version by 1"
        note: "Expiry is evaluated for every ComplianceCredential row on each clock advance, so an unset clock (default 2026-08-01T00:00:00Z) never expires anything spuriously."

  - entity: AdvisorAgreement
    state_field: status
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event: POST /host-agency/advisors/{advisor_id}/agreements creates a newer agreement for the same advisor"
        actor: system
        preconditions:
          - "the prior agreement's status == ACTIVE"
          - "the new agreement's effective_date >= the prior agreement's effective_date"
        side_effects:
          - "prior agreement.status = SUPERSEDED"
          - "Booking rows already pinned to the prior agreement keep agreement_id unchanged — terms are version-pinned at submission"
          - "increments AdvisorAgreement.version by 1 on the superseded row"

      - from: ACTIVE
        to: TERMINATED
        trigger: "system event: the owning Advisor transitions DEPARTING -> DEPARTED"
        actor: system
        preconditions:
          - "agreement.status == ACTIVE"
          - "the owning Advisor's status is moving to DEPARTED"
        side_effects:
          - "agreement.status = TERMINATED"
          - "increments AdvisorAgreement.version by 1"

  - entity: SettlementRun
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CALCULATED
        trigger: "POST /host-agency/settlement-runs/{run_id}/calculate"
        actor: HostController
        preconditions:
          - "run.status == OPEN"
          - "no other SettlementRun with the same period_month has status IN {CALCULATED, POSTED, CLOSED}"
        side_effects:
          - "run.calculated_by_user_id = X-User-ID; run.status = CALCULATED"
          - "one AdvisorStatement (status DRAFT) is created for each Advisor that has at least one booking in the run's inclusion set OR a non-zero carryforward_chargeback_cents; advisors with neither are skipped, so an empty period yields statement_count == 0"
          - "each claimed Booking gets statement_id = the new statement id, settled_share_cents = its per-booking share from calculations.statement_advisor_share_rollup, and settled_tier_level = the statement's tier_level_applied; Booking.version increments by 1 on each row touched"
          - "statement money fields are written per calculations.statement_advisor_share_rollup and calculations.host_platform_fee"
          - "run aggregate fields (statement_count, gross_commission_cents, advisor_share_total_cents, chargeback_total_cents, platform_fee_total_cents, marketing_fund_total_cents, net_payout_total_cents) are recomputed as sums over the run's statements"
          - "increments SettlementRun.version by 1"

      - from: CALCULATED
        to: POSTED
        trigger: "POST /host-agency/settlement-runs/{run_id}/post"
        actor: HostController
        preconditions:
          - "run.status == CALCULATED"
          - "the acting X-User-ID != run.calculated_by_user_id (segregation of duties)"
        side_effects:
          - "run.posted_by_user_id = X-User-ID; run.status = POSTED"
          - "every AdvisorStatement with settlement_run_id == run.id and status == DRAFT moves to POSTED"
          - "caused by each statement reaching POSTED: the owning Advisor's lifetime_settled_share_cents and lifetime_chargeback_cents are recomputed, and carryforward_chargeback_cents is set to that statement's carryforward_applied_cents; Advisor.version increments by 1"
          - "caused by each statement reaching POSTED: if the owning Advisor has consortium_id != null, that Consortium's marketing_fund_balance_cents is recomputed; Consortium.version increments by 1"
          - "if run.statement_count == 0 the run immediately auto-transitions POSTED -> CLOSED in the same request (empty-period boundary)"
          - "increments SettlementRun.version by 1"

      - from: POSTED
        to: CLOSED
        trigger: "system event: the last AdvisorStatement of the run reaches PAID (or the run posted with statement_count == 0)"
        actor: system
        preconditions:
          - "run.status == POSTED"
          - "every AdvisorStatement with settlement_run_id == run.id has status == PAID, or statement_count == 0"
        side_effects:
          - "run.status = CLOSED"
          - "increments SettlementRun.version by 1"
        note: "Compound/bubble-up: the run's terminal state is derived from its children, never requested directly."

  - entity: AdvisorStatement
    state_field: status
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "system event: the parent SettlementRun transitions CALCULATED -> POSTED"
        actor: system
        preconditions:
          - "statement.status == DRAFT"
          - "the parent SettlementRun is moving to POSTED"
        side_effects:
          - "statement.status = POSTED"
          - "the owning Advisor's lifetime_settled_share_cents, lifetime_chargeback_cents and carryforward_chargeback_cents are updated"
          - "increments AdvisorStatement.version by 1"

      - from: POSTED
        to: PAID
        trigger: "POST /host-agency/advisor-statements/{statement_id}/pay"
        actor: HostController
        preconditions:
          - "statement.status == POSTED"
          - "the parent SettlementRun's status == POSTED"
          - "the owning Advisor's status != DRAFT"
        side_effects:
          - "statement.status = PAID; statement.paid_at = clock_now"
          - "bubble-up: if every sibling AdvisorStatement of the parent run is now PAID, the run transitions POSTED -> CLOSED"
          - "increments AdvisorStatement.version by 1"

concurrency_rules:
  - rule_id: agreement-create-stale-advisor
    parent_entity: Advisor
    write_endpoint: "POST /host-agency/advisors/{advisor_id}/agreements"
    occ_field: "expected_advisor_version"
    description: |
      Creating an AdvisorAgreement against an Advisor whose version has advanced since the
      client last observed it is rejected with a stale-version error. A new agreement
      legitimately supersedes the advisor's prior ACTIVE agreement (see the AdvisorAgreement
      ACTIVE -> SUPERSEDED transition), so a second create against an unchanged advisor would
      itself succeed under the product semantics; the OCC check is what makes the caller
      re-read the advisor before replacing terms it may no longer be looking at.
    error_id: ERR_ADVISOR_VERSION_STALE
    http_status: 412

  - rule_id: trust-entry-create-stale-client
    parent_entity: Client
    write_endpoint: "POST /host-agency/clients/{client_id}/trust-ledger-entries"
    occ_field: "expected_client_version"
    description: |
      Appending a TrustLedgerEntry against a Client whose version has advanced since the
      caller last read it is rejected with a stale-version error. Trust ledger lines are
      additive and a second append against an unchanged client would legitimately succeed
      (the balance rule only rejects a draw-down that would go negative), so this is not a
      state precondition in disguise — the OCC check is what stops an operator from
      disbursing against a balance snapshot that another ledger line has already moved.
    error_id: ERR_CLIENT_VERSION_STALE
    http_status: 412

calculations:
  - name: trust_requirement_derivation
    trigger: "On Advisor create, on Advisor DRAFT -> ACTIVE, and whenever seller_of_travel_state is supplied"
    algorithm: threshold
    formula: |
      Advisor.trust_account_required = (Advisor.seller_of_travel_state IN TRUST_STATES)
    input_set: "The single Advisor row being written; no cross-entity data."
    constants:
      TRUST_STATES: ["CA", "FL", "HI", "IA", "WA"]
    precision: "boolean, no rounding"

  - name: booking_expected_commission
    trigger: >-
      On POST /host-agency/bookings (submission); recomputed by CASCADE-A LINK 3 when the
      supplier's program_status changes while commission_status == PENDING; recomputed by
      CASCADE-B LINK 3 when a PENDING booking changes advisor_id.
    algorithm: rate_selection
    formula: |
      # STEP 1 — commissionable base
      commissionable_base_cents = gross_sale_cents - non_commissionable_cents

      # STEP 2 — base rate (branch on supplier program standing AND consortium co-membership)
      if Supplier.program_status == "PREFERRED"
         AND Supplier.consortium_id IS NOT NULL
         AND Supplier.consortium_id == Advisor.consortium_id:
          base_rate = Supplier.preferred_override_commission_pct
      else:
          base_rate = Supplier.base_commission_pct
      # PROBATION and STANDARD both fall to base_commission_pct.

      # STEP 3 — channel bonus (branch on booking channel)
      if Booking.channel == "CONSORTIUM"
         AND Advisor.consortium_id IS NOT NULL
         AND Advisor.consortium_id == Supplier.consortium_id:
          channel_bonus = Consortium(Advisor.consortium_id).consortium_channel_bonus_pct
      elif Booking.channel == "INTERNAL_TOOL":
          channel_bonus = INTERNAL_TOOL_BONUS_PCT
      else:                                   # SUPPLIER_DIRECT, or CONSORTIUM without co-membership
          channel_bonus = 0.0

      # STEP 4 — ceiling then per-booking cap (nested min, order pinned: ceiling BEFORE cap)
      effective_rate = min(base_rate + channel_bonus, Supplier.rate_ceiling_pct)
      raw_cents      = commissionable_base_cents * effective_rate
      expected_commission_cents = min(round_half_up(raw_cents),
                                      Supplier.max_commission_per_booking_cents)

      Booking.applied_commission_rate     = effective_rate
      Booking.commissionable_base_cents   = commissionable_base_cents
    input_set: >-
      Exactly one Booking row plus the Supplier it references, the Advisor it references, and
      (only when the Advisor's consortium_id is non-null) that Consortium row. No other
      bookings participate.
    constants:
      INTERNAL_TOOL_BONUS_PCT: 0.005
    precision: "round_half_up to whole cents at STEP 4; effective_rate itself is never rounded"
    variants:
      - name: preferred_consortium_rate
        when: "Supplier.program_status == PREFERRED and Supplier.consortium_id == Advisor.consortium_id"
        difference: "Uses preferred_override_commission_pct instead of base_commission_pct, so the same gross_sale_cents yields a strictly larger expected_commission_cents."
      - name: base_rate_fallback
        when: "Supplier.program_status IN {STANDARD, PROBATION}, or the advisor is not a co-member of the supplier's consortium"
        difference: "Uses base_commission_pct and loses the CONSORTIUM channel bonus when co-membership fails, so the identical booking body prices lower."

  - name: advisor_production_ytd
    trigger: >-
      Recomputed on every Booking commission_status transition, on every Booking
      expected_commission_cents / received_commission_cents rewrite, and by CASCADE-A LINK 4
      and CASCADE-B LINK 4.
    algorithm: aggregation
    formula: |
      year_start = first instant of the calendar year of clock_now, UTC   # inclusive
      year_end   = first instant of the next calendar year, UTC          # exclusive

      # --- PROVISIONAL variant (writes Advisor.production_ytd_provisional_cents) ---
      provisional_set = Booking rows where
            advisor_id == A.id
        AND booking_status  IN {SUBMITTED, CONFIRMED, TRAVELED}
        AND commission_status NOT IN {CHARGED_BACK, WRITTEN_OFF}
        AND year_start <= travel_start_date < year_end
      production_ytd_provisional_cents =
            sum(b.expected_commission_cents for b in provisional_set, iterated by b.created_at ASC)

      # --- FINAL variant (writes Advisor.production_ytd_final_cents) ---
      final_set = Booking rows where
            advisor_id == A.id
        AND booking_status  IN {CONFIRMED, TRAVELED}
        AND commission_status == "RECEIVED"
        AND year_start <= commission_received_on < year_end
      production_ytd_final_cents =
            sum(b.received_commission_cents for b in final_set, iterated by b.created_at ASC)
    input_set: >-
      The two sets above are disjoint in neither membership nor amount source: PROVISIONAL
      counts SUBMITTED and CLAIMED work at its EXPECTED amount keyed on travel_start_date,
      FINAL counts only RECEIVED money keyed on commission_received_on. A booking that is
      SUBMITTED, or CLAIMED after a short pay, is in PROVISIONAL and absent from FINAL; a
      booking whose supplier remitted less than expected contributes a smaller number to
      FINAL than to PROVISIONAL.
    constants: {}
    precision: "integer cents; both sums accumulate integers, so no rounding occurs"
    variants:
      - name: PROVISIONAL
        when: "Read from Advisor.production_ytd_provisional_cents; surfaced to advisors as their pipeline production"
        difference: "Includes not-yet-paid work at expected_commission_cents, keyed on travel_start_date."
      - name: FINAL
        when: "Read from Advisor.production_ytd_final_cents; the ONLY basis the settlement engine may use"
        difference: "Includes only received money at received_commission_cents, keyed on commission_received_on. For identical booking data the two variants return different integers whenever any booking is unpaid, short-paid, or has a travel_start_date in a different calendar year from its commission_received_on."

  - name: split_tier_selection
    trigger: "Whenever advisor_production_ytd runs (either variant), and at settlement-run calculate time"
    algorithm: tiered_pricing
    formula: |
      schedule = SplitSchedule referenced by the advisor's status == ACTIVE AdvisorAgreement
                 (at settlement time: the SplitSchedule referenced by each Booking's pinned
                  agreement_id — see statement_advisor_share_rollup)
      candidates = [t for t in schedule.tiers if basis_production_cents >= t.min_production_cents]
      # boundary is INCLUSIVE: basis exactly equal to min_production_cents selects that tier
      if candidates is empty:
          raise ERR_SPLIT_TIER_UNRESOLVED
      selected = the candidate with the greatest min_production_cents
                 (schedule.tiers has strictly increasing min_production_cents, so this is unique)
      tier_level  = selected.tier_level
      advisor_pct = selected.advisor_pct
    input_set: >-
      basis_production_cents is Advisor.production_ytd_provisional_cents for the PROVISIONAL
      variant and Advisor.production_ytd_final_cents for the FINAL variant. No other rows.
    constants: {}
    precision: "advisor_pct is used verbatim as declared in the schedule; no rounding here"
    variants:
      - name: PROVISIONAL
        when: "Writes Advisor.split_tier_provisional"
        difference: "Keyed on the PROVISIONAL production basis, so it can sit one or more tiers above the settlement tier."
      - name: FINAL
        when: "Writes Advisor.split_tier_final and is the tier the settlement engine applies"
        difference: "Keyed on the FINAL production basis; identical booking data yields a lower or equal tier_level than PROVISIONAL."

  - name: statement_advisor_share_rollup
    trigger: "POST /host-agency/settlement-runs/{run_id}/calculate (state_machines.SettlementRun.OPEN_to_CALCULATED)"
    algorithm: aggregation
    formula: |
      period_start = <period_month>-01T00:00:00Z                 # inclusive
      period_end   = first instant of the following month, UTC    # exclusive

      inclusion_set(A) = Booking rows where
            advisor_id == A.id
        AND booking_status IN {CONFIRMED, TRAVELED}
        AND commission_status == "RECEIVED"
        AND statement_id IS NULL
        AND period_start <= commission_received_on < period_end
      ordered by created_at ASC   # deterministic iteration order; created_at is unique per row

      chargeback_set(A) = Booking rows where
            advisor_id == A.id
        AND commission_status == "CHARGED_BACK"
        AND chargeback_recognized_at IS NULL
      ordered by created_at ASC

      # per-booking advisor percentage
      for b in inclusion_set(A):
          agreement = AdvisorAgreement(b.agreement_id)
          if Advisor(b.advisor_id).status == "DEPARTED":
              pct_b = agreement.post_departure_advisor_pct
          else:
              pct_b = advisor_pct of split_tier_selection(FINAL) resolved against
                      SplitSchedule(agreement.split_schedule_id)
          # ROUNDING ORDER IS PINNED: round EACH booking to whole cents, THEN sum.
          b.settled_share_cents = round_half_up(b.received_commission_cents * pct_b)
          b.settled_tier_level  = tier_level of that same resolution (null when the
                                  post-departure percentage was used)

      advisor_share_cents   = sum(b.settled_share_cents for b in inclusion_set(A))
      gross_commission_cents = sum(b.received_commission_cents for b in inclusion_set(A))
      booking_count          = count(inclusion_set(A))

      # FORBIDDEN alternative, stated so the divergence is unambiguous:
      #   advisor_share_cents != round_half_up(gross_commission_cents * pct)
      # Sum-then-round yields a different integer whenever two or more bookings each round up
      # from a half cent, e.g. two bookings of 100_015 cents at 0.70:
      #   round-then-sum  = 70_011 + 70_011 = 140_022     <-- THIS SCAFFOLD
      #   sum-then-round  = round(200_030 * 0.70) = 140_021

      chargeback_cents = sum(b.chargeback_amount_cents for b in chargeback_set(A))
                         + Advisor(A).carryforward_chargeback_cents
      # every b in chargeback_set(A) gets chargeback_recognized_at = clock_now, so no
      # chargeback is ever counted by two runs.

      statement.tier_level_applied  = Advisor(A).split_tier_final
      statement.advisor_pct_applied = advisor_pct of split_tier_selection(FINAL) for A
    input_set: >-
      Per advisor A: the inclusion_set above (explicit status filter, half-open
      [period_start, period_end) window on commission_received_on, statement_id IS NULL so a
      booking can never be settled twice) plus the chargeback_set above. Advisors with an
      empty inclusion_set, an empty chargeback_set and carryforward_chargeback_cents == 0 get
      no statement at all. Statements are created ordered by Advisor.created_at ASC, then by
      Advisor.email ASC.
    constants: {}
    precision: "round_half_up to whole cents PER BOOKING, then integer summation; never round the sum"

  - name: host_platform_fee
    trigger: "POST /host-agency/settlement-runs/{run_id}/calculate, immediately after statement_advisor_share_rollup writes advisor_share_cents"
    algorithm: waterfall_allocation
    formula: |
      # This looks circular: net_payout depends on platform_fee, and a naive reading keys the
      # fee tier on the payout. The evaluation order below is PINNED and mandatory.

      # STEP 1
      gross_share = statement.advisor_share_cents           # from statement_advisor_share_rollup

      # STEP 2 — fee tier is keyed on gross_share (PRE-FEE), never on net_payout_cents.
      schedule = SplitSchedule referenced by the advisor's status IN {ACTIVE, TERMINATED}
                 AdvisorAgreement with the greatest effective_date; ties broken by
                 created_at ASC
      fee_candidates = [t for t in schedule.platform_fee_tiers
                        if gross_share >= t.min_share_cents]      # inclusive boundary
      fee_tier = the fee_candidate with the greatest min_share_cents
                 (exactly one entry has min_share_cents == 0, so fee_candidates is non-empty)

      # STEP 3
      platform_fee_cents = round_half_up(gross_share * fee_tier.fee_pct)

      # STEP 4 — marketing fund is keyed on the POST-FEE base, not on gross_share.
      if Advisor(A).consortium_id IS NULL:
          marketing_fund_cents = 0
      else:
          marketing_base       = gross_share - platform_fee_cents
          marketing_fund_cents = round_half_up(
              marketing_base * Consortium(Advisor(A).consortium_id).marketing_fund_accrual_pct)

      # STEP 5
      raw_net = gross_share - platform_fee_cents - marketing_fund_cents
                            - statement.chargeback_cents
      if raw_net >= 0:
          net_payout_cents           = raw_net
          carryforward_applied_cents = 0
      else:
          net_payout_cents           = 0
          carryforward_applied_cents = -raw_net      # the unabsorbed chargeback remainder

      # Worked example proving the order matters:
      #   gross_share = 1_020_000, platform_fee_tiers = [{0, 0.05}, {1_000_000, 0.03}],
      #   marketing_fund_accrual_pct = 0.02, chargeback_cents = 0
      #   PINNED order  : tier keyed on 1_020_000 -> 0.03 -> fee 30_600
      #                   marketing = round(989_400 * 0.02) = 19_788
      #                   net = 1_020_000 - 30_600 - 19_788 = 969_612
      #   WRONG (net-keyed): net 969_612 < 1_000_000 -> tier 0.05 -> fee 51_000 -> different
    input_set: >-
      One AdvisorStatement row, its advisor's SplitSchedule (via the agreement described in
      STEP 2) and, only when consortium_id is non-null, that Consortium row.
    constants: {}
    precision: "round_half_up to whole cents at STEP 3 and STEP 4 independently; STEP 5 is pure integer arithmetic"

  - name: cancellation_chargeback
    trigger: "state_machines.Booking.RECEIVED_to_CHARGED_BACK (system event fired by POST /host-agency/bookings/{booking_id}/cancel)"
    algorithm: threshold
    formula: |
      schedule = SplitSchedule referenced by AdvisorAgreement(Booking.agreement_id)
      if Booking.cancellation_reason IN {"CLIENT_INITIATED", "ADVISOR_ERROR"}:
          # GROSS_REVERSAL
          chargeback_amount_cents = Booking.settled_share_cents
      else:                                     # SUPPLIER_INITIATED
          # NET_OF_RETENTION
          chargeback_amount_cents = round_half_up(
              Booking.settled_share_cents * (1 - schedule.chargeback_retention_pct))
      # A booking that was never settled has settled_share_cents == 0, so both variants
      # return 0 and the invariant advisor_recognized_share_cents is untouched.
    input_set: >-
      Exactly one Booking row (its settled_share_cents, written by
      statement_advisor_share_rollup) plus the SplitSchedule reached through its pinned
      agreement_id. The advisor's current tier is deliberately NOT consulted — the reversal
      reverses the cents that were actually paid, not the cents today's tier would produce.
    constants: {}
    precision: "round_half_up to whole cents in the NET_OF_RETENTION branch; GROSS_REVERSAL is an exact copy"
    variants:
      - name: GROSS_REVERSAL
        when: "cancellation_reason IN {CLIENT_INITIATED, ADVISOR_ERROR}"
        difference: "Claws back 100% of settled_share_cents. For settled_share_cents == 112000 and chargeback_retention_pct == 0.10 this returns 112000."
      - name: NET_OF_RETENTION
        when: "cancellation_reason == SUPPLIER_INITIATED"
        difference: "Leaves chargeback_retention_pct of the settled share with the advisor. For the identical booking (settled_share_cents == 112000, chargeback_retention_pct == 0.10) this returns 100800 — a 11200-cent divergence on the same row."

  - name: supplier_commission_aging
    trigger: >-
      Recomputed on Booking booking_status and commission_status transitions, on
      commission-receipt recording, and on every POST /host-agency/_clock/set_current_utc.
    algorithm: interval_merge
    formula: |
      as_of_date = date part (UTC) of clock_now

      cohort(S) = Booking rows where
            supplier_id == S.id
        AND booking_status IN {CONFIRMED, TRAVELED}
        AND commission_status IN {EXPECTED, CLAIMED}
        AND due_date(b) <= as_of_date
      where due_date(b) = date_part_utc(b.travel_end_date) + S.remit_terms_days days

      for b in cohort(S), iterated by b.created_at ASC:
          age_days  = whole UTC days from due_date(b) to as_of_date        # 0 on the due date
          amount_b  = b.expected_commission_cents - b.received_commission_cents
          if   0  <= age_days <= 30: aging_0_30_cents   += amount_b
          elif 31 <= age_days <= 60: aging_31_60_cents  += amount_b
          elif 61 <= age_days <= 90: aging_61_90_cents  += amount_b
          else:                      aging_over_90_cents += amount_b       # age_days >= 91

      total_outstanding_cents = aging_0_30_cents + aging_31_60_cents
                              + aging_61_90_cents + aging_over_90_cents
      # Empty cohort -> all four buckets and the total are 0, never null.
    input_set: >-
      One Supplier plus its cohort as filtered above. Bookings whose commission_status is
      PENDING (never confirmed-priced), RECEIVED (fully collected), WRITTEN_OFF or
      CHARGED_BACK are excluded, as are bookings whose due_date has not yet arrived.
    constants:
      BUCKET_0_UPPER_DAYS: 30
      BUCKET_1_UPPER_DAYS: 60
      BUCKET_2_UPPER_DAYS: 90
    precision: "integer cents; bucket edges are inclusive on both ends (age_days == 30 lands in aging_0_30_cents, age_days == 31 lands in aging_31_60_cents)"

  - name: client_trust_balance
    trigger: "POST /host-agency/clients/{client_id}/trust-ledger-entries, and the auto-DISBURSEMENT fired by booking confirm when payment_method == CLIENT_TRUST"
    algorithm: chronological
    formula: |
      signed_amount_cents(e) = +e.amount_cents if e.direction == "DEPOSIT"
                               else -e.amount_cents          # DISBURSEMENT, REFUND

      entries = TrustLedgerEntry rows where client_id == C.id, iterated by created_at ASC
      running = 0
      for e in entries:
          running += signed_amount_cents(e)
          e.balance_after_cents = running        # written when the entry is appended
      Client.trust_balance_cents = running

      # CONSERVED QUANTITY — client_trust_cash_cents
      client_trust_cash_cents(C) = sum(e.direction == "DEPOSIT"      -> +e.amount_cents)
                                 + sum(e.direction == "DISBURSEMENT" -> -e.amount_cents)
                                 + sum(e.direction == "REFUND"       -> -e.amount_cents)
      INVARIANT: client_trust_cash_cents(C) == Client.trust_balance_cents at all times, and
      Client.trust_balance_cents >= 0 at all times. Any append that would drive running
      negative is rejected with ERR_TRUST_FUNDS_INSUFFICIENT and appends nothing.
    input_set: "Every TrustLedgerEntry row of the client, in created_at ASC order; the ledger is append-only so no entry is ever mutated or removed."
    constants: {}
    precision: "integer cents; no rounding"

  - name: claim_aging_escalation
    trigger: "On CommissionClaim create, on every claim transition, and on every POST /host-agency/_clock/set_current_utc"
    algorithm: threshold
    formula: |
      aging_days = floor((clock_now - claim.created_at) / 1 day)          # whole UTC days
      if   aging_days < CLAIM_ESCALATION_DAYS: escalation_level = "NORMAL"
      elif aging_days < CLAIM_CRITICAL_DAYS:   escalation_level = "ESCALATED"
      else:                                    escalation_level = "CRITICAL"
    input_set: "One CommissionClaim row and the logical clock; unaffected by round_count."
    constants:
      CLAIM_ESCALATION_DAYS: 60
      CLAIM_CRITICAL_DAYS: 120
    precision: "aging_days is a floored integer count of whole days; boundaries are aging_days == 59 -> NORMAL, == 60 -> ESCALATED, == 119 -> ESCALATED, == 120 -> CRITICAL"

  - name: advisor_recognized_share_invariant
    trigger: "Evaluated after every AdvisorStatement DRAFT -> POSTED transition and after every Booking RECEIVED -> CHARGED_BACK transition"
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY — advisor_recognized_share_cents
      advisor_recognized_share_cents(A) =
            Advisor(A).lifetime_settled_share_cents
          - Advisor(A).lifetime_chargeback_cents

      INVARIANT: advisor_recognized_share_cents(A) ==
            sum(s.advisor_share_cents - s.chargeback_cents
                for s in AdvisorStatement where advisor_id == A.id
                                            AND status IN {POSTED, PAID})

      # The forward action (settlement post) credits advisor_share_cents; the compensating
      # action (RECEIVED -> CHARGED_BACK followed by the next run's calculate, which folds
      # chargeback_set into chargeback_cents) debits exactly the same cents that were paid,
      # because cancellation_chargeback reverses Booking.settled_share_cents rather than
      # recomputing from today's tier. When the debit exceeds the period's share the
      # remainder lands in carryforward_applied_cents and is recognized by the following run,
      # so the identity above never drifts, only defers.
      Advisor.lifetime_settled_share_cents =
            sum(s.advisor_share_cents for s in POSTED-or-PAID statements of A)
      Advisor.lifetime_chargeback_cents =
            sum(s.chargeback_cents   for s in POSTED-or-PAID statements of A)
    input_set: "All AdvisorStatement rows of the advisor with status IN {POSTED, PAID}, iterated by created_at ASC; DRAFT statements are excluded."
    constants: {}
    precision: "integer cents; no rounding"

validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the five roles declared in the RBAC matrix"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "The acting role appears in the target endpoint's roles list in the API endpoint table"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 25
    category: business_constraint
    check: "Request body is a JSON object, every required input field for the endpoint is present, every field parses to its declared type, every enum value is a declared member, and no unknown field is present (unknown fields are rejected, not ignored)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all endpoints with a request body

  - priority: 30
    category: existence
    check: "Every resource referenced by the path exists, validated left-to-right; then every FK supplied in the body exists, validated in the field order declared in the endpoint's input list"
    error_id: "ERR_ADVISOR_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_CREDENTIAL_NOT_FOUND | ERR_SUPPLIER_NOT_FOUND | ERR_CONSORTIUM_NOT_FOUND | ERR_SPLIT_SCHEDULE_NOT_FOUND | ERR_CLIENT_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_SETTLEMENT_RUN_NOT_FOUND | ERR_STATEMENT_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 32
    category: auth
    check: >-
      For entity_backed roles, the acting X-User-ID owns the resource: role Advisor may only
      act on an Advisor row whose id == X-User-ID, on a Client whose owner_advisor_id ==
      X-User-ID, on a Booking whose advisor_id == X-User-ID, and on a CommissionClaim whose
      advisor_id == X-User-ID; role SupplierPortal may only act on a Booking whose supplier_id
      == X-User-ID and on a CommissionClaim whose booking's supplier_id == X-User-ID.
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "POST /advisors/{id}/departure, POST /clients, POST /clients/{id}/trust-ledger-entries, POST /bookings, POST /bookings/{id}/confirm, POST /bookings/{id}/cancel, POST /bookings/{id}/commission-receipt, POST /bookings/{id}/commission-claims, POST /commission-claims/{id}/deny, POST /commission-claims/{id}/resubmit"

  - priority: 35
    category: state
    check: "expected_advisor_version equals Advisor.version (concurrency_rules[agreement-create-stale-advisor]); expected_client_version equals Client.version (concurrency_rules[trust-entry-create-stale-client])"
    error_id: "ERR_ADVISOR_VERSION_STALE | ERR_CLIENT_VERSION_STALE"
    http_status: 412
    applies_to: "POST /advisors/{id}/agreements, POST /clients/{id}/trust-ledger-entries"

  - priority: 38
    category: state
    check: >-
      On POST /advisor-statements/{id}/pay the statement's parent SettlementRun has
      status == POSTED. This outranks the generic state check at priority 40 so that a
      statement whose run has not been posted reports the run problem rather than the
      statement's own DRAFT status.
    error_id: ERR_RUN_NOT_POSTED
    http_status: 409
    applies_to: "POST /advisor-statements/{id}/pay"

  - priority: 40
    category: state
    check: >-
      The target resource is in a state from which the requested transition is declared in the
      state machine table. Includes: Advisor.status must be ACTIVE for booking submission and
      client creation; Booking.booking_status / Booking.commission_status must match the
      transition's from-state; CommissionClaim.status; SettlementRun.status;
      ComplianceCredential.status; AdvisorStatement.status.
    error_id: "ERR_ADVISOR_NOT_ACTIVE | ERR_INVALID_ADVISOR_STATE | ERR_INVALID_BOOKING_STATE | ERR_INVALID_COMMISSION_STATE | ERR_INVALID_CLAIM_STATE | ERR_INVALID_RUN_STATE | ERR_INVALID_CREDENTIAL_STATE | ERR_INVALID_STATEMENT_STATE"
    http_status: 409
    applies_to: "all state-transition endpoints, POST /bookings, POST /clients"

  - priority: 45
    category: state
    check: "On POST /settlement-runs/{id}/post the acting X-User-ID differs from SettlementRun.calculated_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /settlement-runs/{id}/post"

  - priority: 50
    category: business_safety
    check: >-
      The booking's advisor has a ComplianceCredential with credential_type ==
      SELLER_OF_TRAVEL, status == VERIFIED, jurisdiction_state_code ==
      Advisor.seller_of_travel_state and effective_on <= clock_now < expires_on. Also enforced
      as a precondition of advisor activation and reinstatement.
    error_id: ERR_SELLER_OF_TRAVEL_INVALID
    http_status: 422
    applies_to: "POST /bookings, POST /advisors/{id}/activate, POST /advisors/{id}/reinstate"

  - priority: 52
    category: business_safety
    check: "The advisor has a ComplianceCredential with credential_type == EO_POLICY, status == VERIFIED, effective_on <= clock_now < expires_on and coverage_amount_cents >= MIN_EO_COVERAGE_CENTS (100000000)"
    error_id: ERR_EO_COVERAGE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /advisors/{id}/activate, POST /advisors/{id}/reinstate, POST /bookings"

  - priority: 54
    category: business_safety
    check: "The advisor has a ComplianceCredential with credential_type == TRAINING_CERT, status == VERIFIED and effective_on <= clock_now < expires_on"
    error_id: ERR_TRAINING_CERT_MISSING
    http_status: 422
    applies_to: "POST /advisors/{id}/activate"

  - priority: 56
    category: business_safety
    check: >-
      Payment-processing rule keyed on Advisor.trust_account_required: when true, the booking's
      payment_method MUST be CLIENT_TRUST; when false, payment_method MUST be one of
      {MERCHANT_DIRECT, HOST_MERCHANT}.
    error_id: "ERR_TRUST_ACCOUNT_REQUIRED | ERR_TRUST_ACCOUNT_NOT_PERMITTED"
    http_status: 422
    applies_to: "POST /bookings"

  - priority: 60
    category: business_referential
    check: >-
      Polymorphic credential coherence: credential_type == SELLER_OF_TRAVEL requires
      jurisdiction_state_code non-null with supplier_id and coverage_amount_cents null;
      credential_type == EO_POLICY requires coverage_amount_cents non-null with
      jurisdiction_state_code and supplier_id null; credential_type == SUPPLIER_ACCREDITATION
      requires supplier_id non-null with jurisdiction_state_code and coverage_amount_cents
      null; credential_type == TRAINING_CERT requires all three null.
    error_id: ERR_CREDENTIAL_FIELDS_INCOHERENT
    http_status: 422
    applies_to: "POST /advisors/{id}/credentials"

  - priority: 62
    category: business_referential
    check: >-
      The booking's advisor holds a ComplianceCredential with credential_type ==
      SUPPLIER_ACCREDITATION, supplier_id == the booking's supplier_id, status == VERIFIED and
      effective_on <= clock_now < expires_on.
    error_id: ERR_SUPPLIER_ACCREDITATION_MISSING
    http_status: 422
    applies_to: "POST /bookings"

  - priority: 64
    category: business_constraint
    check: >-
      Uniqueness: Advisor.email is unique across all Advisor rows; SettlementRun.period_month
      is unique across all SettlementRun rows; the transition_advisor_id supplied at departure
      differs from the departing advisor's own id.
    error_id: "ERR_ADVISOR_EMAIL_DUPLICATE | ERR_SETTLEMENT_PERIOD_DUPLICATE | ERR_TRANSITION_ADVISOR_INVALID"
    http_status: 409
    applies_to: "POST /advisors, POST /settlement-runs, POST /advisors/{id}/departure"

  - priority: 65
    category: business_temporal
    check: >-
      Credential coverage overlap, CLOSED-interval semantics with adjacency treated as a
      collision: for the same (advisor_id, credential_type, coverage key) where coverage key is
      jurisdiction_state_code for SELLER_OF_TRAVEL, supplier_id for SUPPLIER_ACCREDITATION and
      the constant NULL for EO_POLICY and TRAINING_CERT, no existing ComplianceCredential with
      status IN {PENDING_REVIEW, VERIFIED} may satisfy
      new.effective_on <= existing.expires_on AND existing.effective_on <= new.expires_on.
      Touching endpoints collide: new.effective_on == existing.expires_on IS a conflict,
      because a registration period must be handed over strictly, with no shared instant.
    error_id: ERR_CREDENTIAL_COVERAGE_OVERLAP
    http_status: 409
    applies_to: "POST /advisors/{id}/credentials"

  - priority: 66
    category: business_temporal
    check: >-
      Travel-window overlap on the Client resource, HALF-OPEN interval semantics with
      adjacency permitted and an aggregate capacity: let occupants be the Booking rows with
      client_id == the request's client_id AND booking_status IN {SUBMITTED, CONFIRMED,
      TRAVELED} whose window satisfies
      existing.travel_start_date < new.travel_end_date AND new.travel_start_date < existing.travel_end_date.
      Reject when count(occupants) + 1 > Client.max_concurrent_trips. Adjacency does NOT
      collide: existing.travel_end_date == new.travel_start_date leaves the intervals disjoint.
    error_id: ERR_TRAVEL_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /bookings"

  - priority: 68
    category: business_temporal
    check: "travel_end_date > travel_start_date on bookings; expires_on > effective_on on credentials; received_on is not before the booking's created_at"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /bookings, POST /advisors/{id}/credentials, POST /bookings/{id}/commission-receipt"

  - priority: 70
    category: business_constraint
    check: "CommissionClaim.round_count < MAX_CLAIM_ROUNDS (3) before a resubmission is accepted"
    error_id: ERR_CLAIM_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /commission-claims/{id}/resubmit"

  - priority: 72
    category: business_constraint
    check: >-
      claimed_amount_cents equals the booking's outstanding commission: from commission_status
      == EXPECTED it must equal expected_commission_cents - received_commission_cents; from
      commission_status == RECEIVED it must equal shortfall_cents (which must be > 0). A
      booking whose statement_id is non-null may not be claimed.
    error_id: ERR_CLAIM_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /bookings/{id}/commission-claims"

  - priority: 74
    category: business_constraint
    check: "On claim resolution, resolution == PAID requires 0 < recovered_amount_cents <= claimed_amount_cents; resolution == WRITTEN_OFF requires recovered_amount_cents absent or 0"
    error_id: ERR_CLAIM_RESOLUTION_INVALID
    http_status: 422
    applies_to: "POST /commission-claims/{id}/resolve"

  - priority: 75
    category: business_constraint
    check: "The recorded commission receipt amount_cents does not exceed the booking's expected_commission_cents"
    error_id: ERR_RECEIPT_EXCEEDS_EXPECTED
    http_status: 422
    applies_to: "POST /bookings/{id}/commission-receipt"

  - priority: 78
    category: business_constraint
    check: "Role Advisor may only append TrustLedgerEntry rows with direction == DEPOSIT; DISBURSEMENT and REFUND lines are reserved for HostController"
    error_id: ERR_TRUST_DIRECTION_FORBIDDEN
    http_status: 403
    applies_to: "POST /clients/{id}/trust-ledger-entries"

  - priority: 80
    category: business_fiscal
    check: "A TrustLedgerEntry with direction IN {DISBURSEMENT, REFUND} may not drive Client.trust_balance_cents below 0 (calculations.client_trust_balance)"
    error_id: ERR_TRUST_FUNDS_INSUFFICIENT
    http_status: 402
    applies_to: "POST /clients/{id}/trust-ledger-entries"

  - priority: 82
    category: business_fiscal
    check: "When the booking's payment_method == CLIENT_TRUST, the client's trust_balance_cents at confirm time is >= the booking's deposit_amount_cents"
    error_id: ERR_TRUST_DEPOSIT_SHORTFALL
    http_status: 402
    applies_to: "POST /bookings/{id}/confirm"

  - priority: 90
    category: business_fiscal
    check: "calculations.split_tier_selection resolves a tier for the basis production amount; an empty candidate set (no tier with min_production_cents <= basis) is a configuration error"
    error_id: ERR_SPLIT_TIER_UNRESOLVED
    http_status: 422
    applies_to: "POST /settlement-runs/{id}/calculate, POST /bookings"

  - priority: 92
    category: business_fiscal
    check: >-
      A SettlementRun with statement_count == 0 may still be posted: emptiness is not a
      posting error. Payment eligibility is split across two rules — the parent run's
      status == POSTED is checked at priority 38 (ERR_RUN_NOT_POSTED) and the statement's own
      status == POSTED at priority 40 (ERR_INVALID_STATEMENT_STATE).
    error_id: ERR_INVALID_STATEMENT_STATE
    http_status: 409
    applies_to: "POST /advisor-statements/{id}/pay"

  - priority: 95
    category: business_constraint
    check: >-
      Departure finalization is blocked while the departing advisor has any CommissionClaim
      with status IN {SUBMITTED, DENIED}, or any owned Client with trust_balance_cents != 0, or
      the recorded transition_advisor_id no longer resolves to an Advisor with status == ACTIVE
      holding exactly one ACTIVE agreement.
    error_id: ERR_DEPARTURE_BLOCKED
    http_status: 409
    applies_to: "POST /advisors/{id}/departure/finalize"

  - priority: 96
    category: business_referential
    check: "The logical clock may only move forward or stay equal; a to_iso8601 earlier than the current logical clock is rejected"
    error_id: ERR_CLOCK_REWIND_FORBIDDEN
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

endpoints:
  # ---------------------------------------------------------------- clock ----
  - method: POST
    path: /host-agency/_clock/set_current_utc
    description: >-
      Sets the server's logical clock. The logical clock defaults to
      2026-08-01T00:00:00Z when the process starts and no client has ever set it; every
      date/time comparison in this specification (credential in-force windows,
      TRAVELED eligibility, commission aging, claim aging) reads this clock and never the
      host wall clock. Advancing the clock is what materialises time-driven state:
      VERIFIED credentials whose expires_on <= the new clock become EXPIRED, and open
      CommissionClaim rows have aging_days and escalation_level recomputed.
    input: [to_iso8601]
    output: "{ current_utc: datetime, expired_credential_count: integer, refreshed_claim_count: integer }"
    roles: [HostOperations, HostController, ComplianceOfficer]
    side_effects:
      - "every ComplianceCredential with status == VERIFIED and expires_on <= new clock transitions to EXPIRED (state_machines[ComplianceCredential.status])"
      - "every CommissionClaim with status IN {SUBMITTED, DENIED} has aging_days and escalation_level recomputed (calculations.claim_aging_escalation)"
      - "no Advisor, Booking, Supplier or SettlementRun aggregate is recomputed by this endpoint; those follow their own triggers"

  # ------------------------------------------------------------ reference ----
  - method: POST
    path: /host-agency/split-schedules
    description: >-
      Registers a commission split schedule: the production tier ladder used by
      calculations.split_tier_selection, the host platform-fee ladder used by
      calculations.host_platform_fee, and the chargeback retention percentage used by
      the NET_OF_RETENTION variant of calculations.cancellation_chargeback.
    input: [name, tiers, platform_fee_tiers, "chargeback_retention_pct?"]
    output: SplitSchedule
    roles: [HostOperations]
    side_effects:
      - "tiers is stored sorted by min_production_cents ASC; platform_fee_tiers is stored sorted by min_share_cents ASC"
      - "chargeback_retention_pct defaults to 0.10 when omitted"

  - method: POST
    path: /host-agency/consortiums
    description: >-
      Registers a consortium: the membership fee, the marketing-fund accrual percentage
      applied to each posted statement, and the channel bonus that member advisors earn on
      CONSORTIUM-channel bookings.
    input: [name, membership_fee_cents, marketing_fund_accrual_pct, consortium_channel_bonus_pct]
    output: Consortium
    roles: [HostOperations]
    side_effects:
      - "marketing_fund_balance_cents initialises to 0"

  - method: POST
    path: /host-agency/suppliers
    description: >-
      Registers a travel supplier with its accreditation scheme, preferred-program status,
      commission rate card (base rate, preferred override, rate ceiling, per-booking cap),
      remittance terms and the chargeback count that demotes it to PROBATION.
    input: [name, accreditation_scheme, base_commission_pct, preferred_override_commission_pct, rate_ceiling_pct, max_commission_per_booking_cents, remit_terms_days, "consortium_id?", "program_status?", "probation_chargeback_threshold?"]
    output: Supplier
    roles: [HostOperations]
    side_effects:
      - "program_status defaults to STANDARD; probation_chargeback_threshold defaults to 2"
      - "chargeback_count and all four aging buckets and total_outstanding_cents initialise to 0"

  - method: GET
    path: /host-agency/suppliers/{id}
    description: "Returns one supplier including its live aging buckets and total_outstanding_cents (calculations.supplier_commission_aging), recomputed against the logical clock at read time."
    input: []
    output: Supplier
    roles: [HostOperations, HostController, ComplianceOfficer, Advisor, SupplierPortal]
    side_effects: []

  - method: GET
    path: /host-agency/suppliers
    description: "Lists suppliers, filterable by consortium membership and preferred-program status. FK reverse lookup for Consortium -> Supplier."
    input: ["consortium_id?", "program_status?", "accreditation_scheme?", "limit?", "offset?"]
    output: Supplier[]
    roles: [HostOperations, HostController, ComplianceOfficer, Advisor, SupplierPortal]
    side_effects: []

  # -------------------------------------------------------------- advisor ----
  - method: POST
    path: /host-agency/advisors
    description: >-
      Onboards an independent advisor in DRAFT. The advisor's seller-of-travel home state
      determines whether client trust handling is mandatory
      (calculations.trust_requirement_derivation).
    input: [legal_name, email, seller_of_travel_state, "consortium_id?"]
    output: Advisor
    roles: [HostOperations]
    side_effects:
      - "status initialises to DRAFT"
      - "trust_account_required is computed from seller_of_travel_state and TRUST_STATES; any client-supplied value is ignored"
      - "all production, tier, share and chargeback accumulators initialise to 0 / null"

  - method: GET
    path: /host-agency/advisors/{id}
    description: "Returns one advisor including provisional and final production, provisional and final split tier, lifetime settled share, lifetime chargebacks and carryforward balance."
    input: []
    output: Advisor
    roles: [HostOperations, HostController, ComplianceOfficer, Advisor, SupplierPortal]
    side_effects: []

  - method: GET
    path: /host-agency/advisors
    description: >-
      Lists advisors. consortium_id is the FK reverse lookup for Consortium -> Advisor;
      transition_advisor_id is the FK reverse lookup for the self-referential
      Advisor.transition_advisor_id (which advisors have named this advisor as their
      book-of-business successor).
    input: ["consortium_id?", "transition_advisor_id?", "status?", "seller_of_travel_state?", "limit?", "offset?"]
    output: Advisor[]
    roles: [HostOperations, HostController, ComplianceOfficer]
    side_effects: []

  - method: POST
    path: /host-agency/advisors/{id}/agreements
    description: >-
      Signs a new advisor agreement, superseding the advisor's current ACTIVE agreement.
      Guarded by optimistic concurrency on the parent advisor
      (concurrency_rules[agreement-create-stale-advisor]): the caller must echo the advisor
      version it read, so that two independently prepared agreements cannot both supersede
      the same baseline.
    input: [split_schedule_id, effective_date, post_departure_advisor_pct, expected_advisor_version]
    output: AdvisorAgreement
    roles: [HostOperations]
    side_effects:
      - "the advisor's existing ACTIVE agreement, if any, transitions to SUPERSEDED (state_machines[AdvisorAgreement.status])"
      - "the new agreement is created with status ACTIVE and signed_at = the logical clock"
      - "Advisor.version increments by exactly 1"
      - "already-submitted bookings keep their pinned agreement_id and are NOT repriced"

  - method: GET
    path: /host-agency/advisor-agreements/{id}
    description: "Returns one advisor agreement."
    input: []
    output: AdvisorAgreement
    roles: [HostOperations, HostController, ComplianceOfficer, Advisor]
    side_effects: []

  - method: GET
    path: /host-agency/advisor-agreements
    description: "Lists advisor agreements. FK reverse lookup for Advisor -> AdvisorAgreement and for SplitSchedule -> AdvisorAgreement."
    input: ["advisor_id?", "split_schedule_id?", "status?", "limit?", "offset?"]
    output: AdvisorAgreement[]
    roles: [HostOperations, HostController, ComplianceOfficer, Advisor]
    side_effects: []

  - method: POST
    path: /host-agency/advisors/{id}/credentials
    description: >-
      Files a compliance credential against the advisor. The credential_type selects which
      optional columns are required and which must be null
      (validations[priority=60]); coverage periods for the same advisor, type and coverage key
      may not overlap under closed-interval semantics (validations[priority=65]).
    input: [credential_type, credential_number, effective_on, expires_on, "jurisdiction_state_code?", "supplier_id?", "coverage_amount_cents?"]
    output: ComplianceCredential
    roles: [HostOperations, Advisor]
    side_effects:
      - "status initialises to PENDING_REVIEW; verified_by_user_id and verified_at stay null"
      - "no advisor field changes; a PENDING_REVIEW credential never satisfies an activation precondition"

  - method: GET
    path: /host-agency/compliance-credentials/{id}
    description: "Returns one compliance credential."
    input: []
    output: ComplianceCredential
    roles: [HostOperations, HostController, ComplianceOfficer, Advisor]
    side_effects: []

  - method: GET
    path: /host-agency/compliance-credentials
    description: "Lists compliance credentials. FK reverse lookup for Advisor -> ComplianceCredential and for Supplier -> ComplianceCredential (which advisors are accredited to sell a given supplier)."
    input: ["advisor_id?", "supplier_id?", "credential_type?", "status?", "limit?", "offset?"]
    output: ComplianceCredential[]
    roles: [HostOperations, HostController, ComplianceOfficer, Advisor]
    side_effects: []

  - method: POST
    path: /host-agency/compliance-credentials/{id}/decision
    description: >-
      Records the compliance officer's decision on a credential. decision == VERIFY moves
      PENDING_REVIEW to VERIFIED; decision == REJECT moves PENDING_REVIEW to REJECTED;
      decision == REVOKE moves VERIFIED to REVOKED and, when the revoked row was the
      advisor's last in-force SELLER_OF_TRAVEL registration for their home state, forces the
      advisor from ACTIVE to SUSPENDED.
    input: [decision, "note?"]
    output: ComplianceCredential
    roles: [ComplianceOfficer]
    side_effects:
      - "on VERIFY: verified_by_user_id = acting X-User-ID and verified_at = the logical clock"
      - "on VERIFY of an EO_POLICY row: Advisor.eo_coverage_verified_cents is set to the maximum coverage_amount_cents across the advisor's in-force VERIFIED EO_POLICY rows"
      - "on REVOKE of the last in-force VERIFIED SELLER_OF_TRAVEL row matching Advisor.seller_of_travel_state while the advisor is ACTIVE: Advisor.status becomes SUSPENDED (cross-entity state dependency)"
      - "on REVOKE: already-submitted bookings are NOT retro-invalidated; only new submissions are blocked by validations[priority=50]"

  - method: POST
    path: /host-agency/advisors/{id}/activate
    description: >-
      Activates a DRAFT advisor. Requires exactly one ACTIVE agreement plus in-force VERIFIED
      SELLER_OF_TRAVEL, EO_POLICY (coverage >= MIN_EO_COVERAGE_CENTS) and TRAINING_CERT
      credentials.
    input: []
    output: Advisor
    roles: [HostOperations]
    side_effects:
      - "status becomes ACTIVE and activated_by_user_id = acting X-User-ID"
      - "split_tier_provisional and split_tier_final are seeded from the ACTIVE agreement's schedule at production 0 (calculations.split_tier_selection)"

  - method: POST
    path: /host-agency/advisors/{id}/suspend
    description: "Suspends an ACTIVE advisor on compliance grounds. Suspension blocks new bookings and new clients but leaves existing bookings and statements untouched."
    input: [reason]
    output: Advisor
    roles: [ComplianceOfficer]
    side_effects:
      - "status becomes SUSPENDED"
      - "no Booking, Client, CommissionClaim or AdvisorStatement row is modified"

  - method: POST
    path: /host-agency/advisors/{id}/reinstate
    description: "Returns a SUSPENDED advisor to ACTIVE after re-checking the seller-of-travel and E&O preconditions against the current logical clock."
    input: []
    output: Advisor
    roles: [ComplianceOfficer]
    side_effects:
      - "status becomes ACTIVE"
      - "split_tier_provisional is recomputed from production_ytd_provisional_cents (calculations.split_tier_selection)"

  - method: POST
    path: /host-agency/advisors/{id}/departure
    description: >-
      Declares the advisor's departure and names the successor advisor who will inherit the
      host-owned book of business. This only arms the departure; nothing is re-homed until
      finalization.
    input: [effective_date, transition_advisor_id]
    output: Advisor
    roles: [Advisor, HostOperations]
    side_effects:
      - "status becomes DEPARTING; departure_effective_date and transition_advisor_id are recorded"
      - "no Client, Booking or AdvisorAgreement row is modified yet"

  - method: POST
    path: /host-agency/advisors/{id}/departure/finalize
    description: >-
      Finalizes a DEPARTING advisor and runs CASCADE-B: agreements terminate, clients are
      re-homed or released, in-flight bookings transfer to the successor and are repriced,
      and both advisors' provisional production and tiers are recomputed.
    input: []
    output: Advisor
    roles: [ComplianceOfficer]
    side_effects:
      - "LEVEL 1: status becomes DEPARTED; every ACTIVE AdvisorAgreement of this advisor becomes TERMINATED"
      - "LEVEL 2 (caused by level 1): every Client with owner_advisor_id == this advisor and ownership_mode == HOST_OWNED has owner_advisor_id reassigned to transition_advisor_id; every ADVISOR_OWNED client has portability_status set to RELEASED and keeps its owner"
      - "LEVEL 3 (caused by level 2): every Booking of a re-homed client with booking_status IN {SUBMITTED, CONFIRMED} has advisor_id set to the successor and agreement_id repinned to the successor's ACTIVE agreement; those still in commission_status PENDING are repriced under calculations.booking_expected_commission using the successor's consortium membership"
      - "LEVEL 4 (caused by level 3): production_ytd_provisional_cents and split_tier_provisional are recomputed for both the departing and the successor advisor"
      - "bookings already TRAVELED or CANCELLED keep advisor_id and settle at the terminated agreement's post_departure_advisor_pct"

  # --------------------------------------------------------------- client ----
  - method: POST
    path: /host-agency/clients
    description: >-
      Registers a travel client owned by an ACTIVE advisor. ownership_mode decides who keeps
      the client when the advisor departs; max_concurrent_trips is the aggregate capacity used
      by the travel-window overlap rule (validations[priority=66]).
    input: [owner_advisor_id, full_name, home_state_code, "ownership_mode?", "max_concurrent_trips?"]
    output: Client
    roles: [Advisor, HostOperations]
    side_effects:
      - "ownership_mode defaults to ADVISOR_OWNED; max_concurrent_trips defaults to 1"
      - "portability_status initialises to RETAINED and trust_balance_cents to 0"

  - method: GET
    path: /host-agency/clients/{id}
    description: "Returns one client including trust_balance_cents derived from its trust ledger (calculations.client_trust_balance)."
    input: []
    output: Client
    roles: [HostOperations, HostController, ComplianceOfficer, Advisor]
    side_effects: []

  - method: GET
    path: /host-agency/clients
    description: "Lists clients. FK reverse lookup for Advisor -> Client via owner_advisor_id."
    input: ["owner_advisor_id?", "ownership_mode?", "portability_status?", "limit?", "offset?"]
    output: Client[]
    roles: [HostOperations, HostController, ComplianceOfficer, Advisor]
    side_effects: []

  - method: POST
    path: /host-agency/clients/{id}/trust-ledger-entries
    description: >-
      Appends an immutable line to the client's trust ledger. Guarded by optimistic
      concurrency on the parent client (concurrency_rules[trust-entry-create-stale-client]):
      the caller must echo the client version it read, so that a disbursement prepared against
      one balance cannot be appended after that balance has already moved. Role Advisor may
      only append DEPOSIT lines (validations[priority=78]).
    input: [direction, amount_cents, memo, "booking_id?", expected_client_version]
    output: TrustLedgerEntry
    roles: [Advisor, HostController]
    side_effects:
      - "signed_amount_cents is +amount_cents for DEPOSIT and -amount_cents for DISBURSEMENT and REFUND"
      - "balance_after_cents is the running balance after this line (calculations.client_trust_balance)"
      - "Client.trust_balance_cents is updated to balance_after_cents"
      - "Client.version increments by exactly 1"
      - "the row is immutable: no update or delete endpoint exists and the entity carries no version field"

  - method: GET
    path: /host-agency/clients/{id}/trust-ledger-entries
    description: "Returns the client's trust ledger in created_at ASC order. FK reverse lookup for Client -> TrustLedgerEntry."
    input: ["limit?", "offset?"]
    output: TrustLedgerEntry[]
    roles: [HostOperations, HostController, ComplianceOfficer, Advisor]
    side_effects: []

  - method: GET
    path: /host-agency/bookings/{id}/trust-ledger-entries
    description: "Returns the trust ledger lines attributed to one booking in created_at ASC order. FK reverse lookup for Booking -> TrustLedgerEntry."
    input: ["limit?", "offset?"]
    output: TrustLedgerEntry[]
    roles: [HostOperations, HostController, ComplianceOfficer, Advisor]
    side_effects: []

  # -------------------------------------------------------------- booking ----
  - method: POST
    path: /host-agency/bookings
    description: >-
      Submits a booking through one of the three channels. Submission pins the advisor's
      current ACTIVE agreement onto the booking, prices the expected commission
      (calculations.booking_expected_commission) and refreshes the advisor's provisional
      production and tier.
    input: [advisor_id, supplier_id, client_id, channel, payment_method, gross_sale_cents, deposit_amount_cents, travel_start_date, travel_end_date, "non_commissionable_cents?"]
    output: Booking
    roles: [Advisor]
    side_effects:
      - "agreement_id is pinned to the advisor's ACTIVE agreement at submission time and never re-pinned except by CASCADE-B level 3"
      - "commissionable_base_cents, applied_commission_rate and expected_commission_cents are computed (calculations.booking_expected_commission); client-supplied values are ignored"
      - "booking_status initialises to SUBMITTED and commission_status to PENDING"
      - "non_commissionable_cents defaults to 0; received_commission_cents, shortfall_cents, settled_share_cents and chargeback_amount_cents initialise to 0"
      - "Advisor.production_ytd_provisional_cents and Advisor.split_tier_provisional are recomputed (calculations.advisor_production_ytd PROVISIONAL variant)"

  - method: GET
    path: /host-agency/bookings/{id}
    description: "Returns one booking including its pinned agreement, computed commission fields, settlement fields and chargeback fields."
    input: []
    output: Booking
    roles: [HostOperations, HostController, ComplianceOfficer, Advisor, SupplierPortal]
    side_effects: []

  - method: GET
    path: /host-agency/bookings
    description: >-
      Lists bookings. FK reverse lookups for Advisor -> Booking, Supplier -> Booking,
      Client -> Booking, AdvisorAgreement -> Booking and AdvisorStatement -> Booking.
    input: ["advisor_id?", "supplier_id?", "client_id?", "agreement_id?", "statement_id?", "booking_status?", "commission_status?", "limit?", "offset?"]
    output: Booking[]
    roles: [HostOperations, HostController, ComplianceOfficer, Advisor, SupplierPortal]
    side_effects: []

  - method: POST
    path: /host-agency/bookings/{id}/confirm
    description: >-
      The supplier confirms the booking. When payment_method == CLIENT_TRUST the deposit is
      swept out of the client's trust account as an automatic DISBURSEMENT line, which is why
      the trust balance must already cover it (validations[priority=82]).
    input: []
    output: Booking
    roles: [SupplierPortal]
    side_effects:
      - "booking_status becomes CONFIRMED"
      - "commission_status becomes EXPECTED when expected_commission_cents > 0, and WRITTEN_OFF when expected_commission_cents == 0"
      - "when payment_method == CLIENT_TRUST: a TrustLedgerEntry with direction DISBURSEMENT, amount_cents = deposit_amount_cents, booking_id = this booking and recorded_by_user_id = the acting supplier is appended, and Client.trust_balance_cents and Client.version are updated"
      - "no advisor production field changes: confirmation does not move a booking between the PROVISIONAL and FINAL production bases"

  - method: POST
    path: /host-agency/bookings/{id}/traveled
    description: "Marks a CONFIRMED booking as travelled once the logical clock has reached travel_end_date."
    input: []
    output: Booking
    roles: [HostOperations]
    side_effects:
      - "booking_status becomes TRAVELED, a terminal state"
      - "commission_status is untouched: whether the supplier has remitted is an independent dimension"

  - method: POST
    path: /host-agency/bookings/{id}/cancel
    description: >-
      Cancels a SUBMITTED or CONFIRMED booking. When the supplier has already remitted
      (commission_status == RECEIVED) this runs CASCADE-A: the commission is charged back, the
      supplier's chargeback count may demote it to PROBATION, every still-pending booking of
      that supplier is repriced, and the affected advisors' provisional production and tiers
      are recomputed.
    input: [cancellation_reason]
    output: Booking
    roles: [Advisor, HostOperations]
    side_effects:
      - "booking_status becomes CANCELLED, a terminal state"
      - "from commission_status EXPECTED: commission_status becomes WRITTEN_OFF and expected_commission_cents is left as the historical estimate"
      - "LEVEL 1 from commission_status RECEIVED: commission_status becomes CHARGED_BACK, chargeback_amount_cents is computed (calculations.cancellation_chargeback) and chargeback_recognized_at is left null for the next settlement run to pick up"
      - "LEVEL 2 (caused by level 1): Supplier.chargeback_count is recomputed; a PREFERRED supplier reaching probation_chargeback_threshold becomes PROBATION"
      - "LEVEL 3 (caused by level 2's program_status change): every Booking of that supplier still in commission_status PENDING is repriced at the base rate ladder (calculations.booking_expected_commission)"
      - "LEVEL 4 (caused by level 3): every advisor owning a repriced booking has production_ytd_provisional_cents and split_tier_provisional recomputed"
      - "when payment_method == CLIENT_TRUST no trust line is written by cancellation; refunds are recorded explicitly by HostController"

  - method: POST
    path: /host-agency/bookings/{id}/commission-receipt
    description: >-
      The supplier records the commission it actually remitted. A full remittance closes the
      booking's receivable; a short remittance leaves a shortfall that the advisor may claim.
    input: [amount_cents, received_on]
    output: Booking
    roles: [SupplierPortal]
    side_effects:
      - "received_commission_cents is set to amount_cents, commission_received_on to received_on and shortfall_cents to expected_commission_cents - amount_cents"
      - "commission_status becomes RECEIVED"
      - "the supplier's aging buckets and total_outstanding_cents are recomputed (calculations.supplier_commission_aging)"
      - "no advisor share is recognised here: recognition happens only when a settlement run posts"

  # ---------------------------------------------------------------- claim ----
  - method: POST
    path: /host-agency/bookings/{id}/commission-claims
    description: >-
      The advisor files a claim for an unpaid or short-paid commission. The claimed amount must
      equal the booking's outstanding receivable exactly (validations[priority=72]).
    input: [claimed_amount_cents]
    output: CommissionClaim
    roles: [Advisor]
    side_effects:
      - "booking commission_status becomes CLAIMED (from EXPECTED or from RECEIVED)"
      - "status initialises to SUBMITTED, round_count to 1, escalation_level to NORMAL and aging_days to 0"
      - "advisor_id is copied from the booking; a client-supplied advisor_id is not accepted"

  - method: GET
    path: /host-agency/commission-claims/{id}
    description: "Returns one commission claim including its aging and escalation level as of the logical clock."
    input: []
    output: CommissionClaim
    roles: [HostOperations, HostController, ComplianceOfficer, Advisor, SupplierPortal]
    side_effects: []

  - method: GET
    path: /host-agency/commission-claims
    description: "Lists commission claims. FK reverse lookups for Booking -> CommissionClaim and Advisor -> CommissionClaim."
    input: ["booking_id?", "advisor_id?", "status?", "escalation_level?", "limit?", "offset?"]
    output: CommissionClaim[]
    roles: [HostOperations, HostController, ComplianceOfficer, Advisor, SupplierPortal]
    side_effects: []

  - method: POST
    path: /host-agency/commission-claims/{id}/deny
    description: "The supplier denies a submitted claim, returning it to the advisor for one more round."
    input: [denial_reason]
    output: CommissionClaim
    roles: [SupplierPortal]
    side_effects:
      - "status becomes DENIED and denial_reason is recorded"
      - "the booking's commission_status stays CLAIMED"

  - method: POST
    path: /host-agency/commission-claims/{id}/resubmit
    description: "The advisor resubmits a denied claim. Allowed only while round_count < MAX_CLAIM_ROUNDS (3)."
    input: ["note?"]
    output: CommissionClaim
    roles: [Advisor]
    side_effects:
      - "status returns to SUBMITTED, round_count increments by 1 and denial_reason is cleared"
      - "aging_days is not reset: aging measures elapsed time since the booking's due date, not since the last round"

  - method: POST
    path: /host-agency/commission-claims/{id}/resolve
    description: >-
      Host operations closes the claim. resolution == PAID records the recovered amount and
      returns the booking to RECEIVED; resolution == WRITTEN_OFF abandons the receivable and
      moves the booking to WRITTEN_OFF.
    input: [resolution, "recovered_amount_cents?"]
    output: CommissionClaim
    roles: [HostOperations]
    side_effects:
      - "on PAID: status becomes RESOLVED_PAID, resolved_amount_cents = recovered_amount_cents, the booking's received_commission_cents increases by that amount, shortfall_cents is recomputed and commission_status becomes RECEIVED"
      - "on WRITTEN_OFF: status becomes RESOLVED_WRITTEN_OFF, resolved_amount_cents = 0 and the booking's commission_status becomes WRITTEN_OFF, a terminal state"
      - "the supplier's aging buckets and total_outstanding_cents are recomputed"

  # ----------------------------------------------------------- settlement ----
  - method: POST
    path: /host-agency/settlement-runs
    description: "Opens the monthly settlement run for a period. One run per period_month (validations[priority=64])."
    input: [period_month]
    output: SettlementRun
    roles: [HostOperations]
    side_effects:
      - "status initialises to OPEN and every monetary total and statement_count to 0"

  - method: GET
    path: /host-agency/settlement-runs/{id}
    description: "Returns one settlement run with its roll-up totals."
    input: []
    output: SettlementRun
    roles: [HostOperations, HostController, ComplianceOfficer, Advisor]
    side_effects: []

  - method: POST
    path: /host-agency/settlement-runs/{id}/calculate
    description: >-
      Computes the run: selects each advisor's settleable bookings and unrecognised
      chargebacks, resolves the FINAL production tier, rolls up the advisor share with
      per-booking rounding, then applies the platform fee and marketing-fund accrual in the
      pinned order (calculations.statement_advisor_share_rollup, calculations.host_platform_fee).
    input: []
    output: SettlementRun
    roles: [HostController]
    side_effects:
      - "one DRAFT AdvisorStatement is created per advisor with a non-empty settlement set; advisors with nothing to settle get no statement"
      - "each contributing Booking has statement_id set and settled_share_cents plus settled_tier_level stamped"
      - "each contributing chargeback Booking has chargeback_recognized_at stamped with the logical clock so no later run double-counts it"
      - "Advisor.production_ytd_final_cents and Advisor.split_tier_final are recomputed (calculations.advisor_production_ytd FINAL variant)"
      - "status becomes CALCULATED and calculated_by_user_id = acting X-User-ID"
      - "run totals are the sums of the statements; statement_count is the number created"

  - method: POST
    path: /host-agency/settlement-runs/{id}/post
    description: >-
      Posts a calculated run. Segregation of duties applies: the poster must not be the user
      who calculated it (validations[priority=45]). Posting is the moment advisor share and
      chargebacks are recognised against lifetime accumulators.
    input: []
    output: SettlementRun
    roles: [HostController]
    side_effects:
      - "every DRAFT AdvisorStatement of the run becomes POSTED"
      - "Advisor.lifetime_settled_share_cents increases by the statement's advisor_share_cents and Advisor.lifetime_chargeback_cents by its chargeback_cents"
      - "Advisor.carryforward_chargeback_cents is REPLACED by the statement's carryforward_applied_cents, not incremented, so an unabsorbed chargeback is carried exactly once"
      - "Consortium.marketing_fund_balance_cents increases by each statement's marketing_fund_cents for member advisors"
      - "status becomes POSTED, or CLOSED immediately when statement_count == 0"
      - "posted_by_user_id = acting X-User-ID"

  - method: GET
    path: /host-agency/advisor-statements/{id}
    description: "Returns one advisor statement with its tier, share, chargeback, fee, marketing-fund and net payout figures."
    input: []
    output: AdvisorStatement
    roles: [HostOperations, HostController, ComplianceOfficer, Advisor]
    side_effects: []

  - method: GET
    path: /host-agency/advisor-statements
    description: "Lists advisor statements. FK reverse lookups for SettlementRun -> AdvisorStatement and Advisor -> AdvisorStatement."
    input: ["settlement_run_id?", "advisor_id?", "status?", "limit?", "offset?"]
    output: AdvisorStatement[]
    roles: [HostOperations, HostController, ComplianceOfficer, Advisor]
    side_effects: []

  - method: POST
    path: /host-agency/advisor-statements/{id}/pay
    description: "Records payment of a posted statement. When the last POSTED statement of a run is paid the run bubbles up to CLOSED."
    input: [payment_reference]
    output: AdvisorStatement
    roles: [HostController]
    side_effects:
      - "status becomes PAID and paid_at = the logical clock"
      - "when every AdvisorStatement of the parent run has status PAID, the run transitions POSTED -> CLOSED (compound state derivation)"

errors:
  # ---- auth -----------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of HostOperations, HostController, ComplianceOfficer, Advisor, SupplierPortal"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the target endpoint's roles (e.g. Advisor calling POST /settlement-runs/{id}/calculate)"
  - id: ERR_OWNERSHIP_VIOLATION
    http: 403
    condition: "An entity_backed role acts on a resource it does not own: Advisor on another advisor's client, booking or claim; SupplierPortal on a booking of a different supplier"
  - id: ERR_TRUST_DIRECTION_FORBIDDEN
    http: 403
    condition: "Role Advisor appends a TrustLedgerEntry with direction DISBURSEMENT or REFUND; only HostController may move money out of a client trust account"

  # ---- request shape --------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Request body is not a JSON object, a required input field is missing, a field fails to parse to its declared type, an enum value is not a declared member, or an unknown field is supplied"

  # ---- not found ------------------------------------------------------------
  - id: ERR_ADVISOR_NOT_FOUND
    http: 404
    condition: "The advisor id in the path or in advisor_id / owner_advisor_id / transition_advisor_id does not resolve"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "The advisor-agreement id in the path does not resolve"
  - id: ERR_SPLIT_SCHEDULE_NOT_FOUND
    http: 404
    condition: "split_schedule_id supplied when signing an agreement does not resolve"
  - id: ERR_CREDENTIAL_NOT_FOUND
    http: 404
    condition: "The compliance-credential id in the path does not resolve"
  - id: ERR_CONSORTIUM_NOT_FOUND
    http: 404
    condition: "consortium_id supplied when onboarding an advisor or registering a supplier does not resolve"
  - id: ERR_SUPPLIER_NOT_FOUND
    http: 404
    condition: "The supplier id in the path, or supplier_id supplied on a booking or a SUPPLIER_ACCREDITATION credential, does not resolve"
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "The client id in the path, or client_id supplied on a booking, does not resolve"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "The booking id in the path, or booking_id supplied on a trust ledger entry, does not resolve"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "The commission-claim id in the path does not resolve"
  - id: ERR_SETTLEMENT_RUN_NOT_FOUND
    http: 404
    condition: "The settlement-run id in the path does not resolve"
  - id: ERR_STATEMENT_NOT_FOUND
    http: 404
    condition: "The advisor-statement id in the path does not resolve"

  # ---- optimistic concurrency ----------------------------------------------
  - id: ERR_ADVISOR_VERSION_STALE
    http: 412
    condition: "expected_advisor_version on POST /advisors/{id}/agreements does not equal the advisor's current version (concurrency_rules[agreement-create-stale-advisor])"
  - id: ERR_CLIENT_VERSION_STALE
    http: 412
    condition: "expected_client_version on POST /clients/{id}/trust-ledger-entries does not equal the client's current version (concurrency_rules[trust-entry-create-stale-client])"

  # ---- state ----------------------------------------------------------------
  - id: ERR_ADVISOR_NOT_ACTIVE
    http: 409
    condition: "A booking submission or client registration names an advisor whose status is not ACTIVE (DRAFT, SUSPENDED, DEPARTING or DEPARTED)"
  - id: ERR_INVALID_ADVISOR_STATE
    http: 409
    condition: "An advisor lifecycle trigger is applied from a state that does not declare it: activate on a non-DRAFT advisor, reinstate on a non-SUSPENDED advisor, suspend on a non-ACTIVE advisor, departure on a DRAFT or DEPARTED advisor, finalize on a non-DEPARTING advisor"
  - id: ERR_INVALID_CREDENTIAL_STATE
    http: 409
    condition: "A credential decision is applied from a state that does not declare it: VERIFY or REJECT on a row that is not PENDING_REVIEW, REVOKE on a row that is not VERIFIED"
  - id: ERR_INVALID_BOOKING_STATE
    http: 409
    condition: "A booking trigger is applied from a booking_status that does not declare it: confirm on a non-SUBMITTED booking, traveled on a non-CONFIRMED booking, cancel on a TRAVELED or CANCELLED booking"
  - id: ERR_TRAVELED_TOO_EARLY
    http: 409
    condition: "POST /bookings/{id}/traveled while the logical clock is still before the booking's travel_end_date (precondition of Booking.booking_status CONFIRMED -> TRAVELED)"
  - id: ERR_INVALID_COMMISSION_STATE
    http: 409
    condition: "A commission trigger is applied from a commission_status that does not declare it: recording a receipt on a booking that is PENDING, WRITTEN_OFF or CHARGED_BACK; filing a claim on a booking that is PENDING, CLAIMED, WRITTEN_OFF or CHARGED_BACK"
  - id: ERR_INVALID_CLAIM_STATE
    http: 409
    condition: "A claim trigger is applied from a status that does not declare it: deny on a DENIED or resolved claim, resubmit on a SUBMITTED or resolved claim, resolve on an already resolved claim"
  - id: ERR_INVALID_RUN_STATE
    http: 409
    condition: "A settlement-run trigger is applied from a status that does not declare it: calculate on a run that is not OPEN, post on a run that is not CALCULATED"
  - id: ERR_INVALID_STATEMENT_STATE
    http: 409
    condition: "pay is applied to an AdvisorStatement that is already PAID, or to a DRAFT statement whose parent SettlementRun is nonetheless POSTED (validations[priority=40])"
  - id: ERR_RUN_NOT_POSTED
    http: 409
    condition: "pay is applied to a statement whose parent SettlementRun has not reached POSTED; outranks ERR_INVALID_STATEMENT_STATE (validations[priority=38])"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The X-User-ID posting a settlement run equals the run's calculated_by_user_id"
  - id: ERR_ACTIVE_AGREEMENT_MISSING
    http: 422
    condition: "Advisor activation or reinstatement is attempted while the advisor does not have exactly one AdvisorAgreement in status ACTIVE"

  # ---- compliance -----------------------------------------------------------
  - id: ERR_SELLER_OF_TRAVEL_INVALID
    http: 422
    condition: "The advisor has no ComplianceCredential with credential_type SELLER_OF_TRAVEL, status VERIFIED, jurisdiction_state_code equal to Advisor.seller_of_travel_state and effective_on <= clock < expires_on"
  - id: ERR_EO_COVERAGE_INSUFFICIENT
    http: 422
    condition: "The advisor has no in-force VERIFIED EO_POLICY credential, or its coverage_amount_cents is below MIN_EO_COVERAGE_CENTS (100000000)"
  - id: ERR_TRAINING_CERT_MISSING
    http: 422
    condition: "Advisor activation is attempted without an in-force VERIFIED TRAINING_CERT credential"
  - id: ERR_SUPPLIER_ACCREDITATION_MISSING
    http: 422
    condition: "Booking submission where the advisor holds no in-force VERIFIED SUPPLIER_ACCREDITATION credential for the booking's supplier"
  - id: ERR_CREDENTIAL_FIELDS_INCOHERENT
    http: 422
    condition: "The optional credential columns do not match the credential_type's required shape (validations[priority=60]) — e.g. an EO_POLICY row carrying jurisdiction_state_code, or a SELLER_OF_TRAVEL row with no jurisdiction_state_code"
  - id: ERR_CREDENTIAL_COVERAGE_OVERLAP
    http: 409
    condition: "A new credential's closed coverage interval touches or overlaps an existing PENDING_REVIEW or VERIFIED interval for the same advisor, credential_type and coverage key (validations[priority=65])"

  # ---- payment processing / trust ------------------------------------------
  - id: ERR_TRUST_ACCOUNT_REQUIRED
    http: 422
    condition: "An advisor whose trust_account_required is true submits a booking with payment_method MERCHANT_DIRECT or HOST_MERCHANT"
  - id: ERR_TRUST_ACCOUNT_NOT_PERMITTED
    http: 422
    condition: "An advisor whose trust_account_required is false submits a booking with payment_method CLIENT_TRUST"
  - id: ERR_TRUST_FUNDS_INSUFFICIENT
    http: 402
    condition: "A DISBURSEMENT or REFUND trust line would drive Client.trust_balance_cents below 0"
  - id: ERR_TRUST_DEPOSIT_SHORTFALL
    http: 402
    condition: "Confirming a CLIENT_TRUST booking whose deposit_amount_cents exceeds the client's current trust_balance_cents"

  # ---- business constraints -------------------------------------------------
  - id: ERR_ADVISOR_EMAIL_DUPLICATE
    http: 409
    condition: "Advisor onboarding with an email already held by another advisor"
  - id: ERR_SETTLEMENT_PERIOD_DUPLICATE
    http: 409
    condition: "Opening a settlement run for a period_month that already has a run"
  - id: ERR_TRANSITION_ADVISOR_INVALID
    http: 409
    condition: "The transition_advisor_id supplied at departure equals the departing advisor's own id, or at finalize time no longer resolves to an ACTIVE advisor holding exactly one ACTIVE agreement"
  - id: ERR_TRAVEL_WINDOW_CONFLICT
    http: 409
    condition: "The new booking's half-open travel window overlaps enough live bookings of the same client to exceed Client.max_concurrent_trips (validations[priority=66])"
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "travel_end_date is not strictly after travel_start_date, expires_on is not strictly after effective_on, or a commission receipt's received_on precedes the booking's creation"
  - id: ERR_CLAIM_AMOUNT_MISMATCH
    http: 422
    condition: "claimed_amount_cents does not equal the booking's outstanding commission, the booking has no shortfall to claim, or the booking has already been swept into a statement"
  - id: ERR_CLAIM_ROUND_LIMIT
    http: 409
    condition: "Resubmitting a claim whose round_count has already reached MAX_CLAIM_ROUNDS (3)"
  - id: ERR_CLAIM_RESOLUTION_INVALID
    http: 422
    condition: "resolution PAID with recovered_amount_cents absent, zero, or greater than claimed_amount_cents; or resolution WRITTEN_OFF with a non-zero recovered_amount_cents"
  - id: ERR_RECEIPT_EXCEEDS_EXPECTED
    http: 422
    condition: "A commission receipt amount_cents exceeds the booking's expected_commission_cents"
  - id: ERR_SPLIT_TIER_UNRESOLVED
    http: 422
    condition: "calculations.split_tier_selection finds no tier whose min_production_cents <= the basis production amount (a schedule with no zero-floor tier)"
  - id: ERR_DEPARTURE_BLOCKED
    http: 409
    condition: "Departure finalization while the advisor still has a SUBMITTED or DENIED commission claim, or an owned client with a non-zero trust balance"
  - id: ERR_CLOCK_REWIND_FORBIDDEN
    http: 422
    condition: "POST /_clock/set_current_utc with a to_iso8601 earlier than the current logical clock"

roles:
  - name: HostOperations
    description: >-
      The host agency's operations desk. Owns reference data (split schedules, consortiums,
      suppliers), advisor onboarding and agreement signing, advisor activation, travel
      completion and claim resolution, and opens each monthly settlement run. Deliberately
      cannot calculate or post a run — the money math belongs to HostController — which is what
      makes the segregation-of-duties control meaningful.
    identity: opaque
    exclusive_operations:
      - "POST /host-agency/split-schedules"
      - "POST /host-agency/consortiums"
      - "POST /host-agency/suppliers"
      - "POST /host-agency/advisors"
      - "POST /host-agency/advisors/{id}/agreements"
      - "POST /host-agency/advisors/{id}/activate"
      - "POST /host-agency/bookings/{id}/traveled"
      - "POST /host-agency/commission-claims/{id}/resolve"
      - "POST /host-agency/settlement-runs"
    shared_operations:
      - "POST /host-agency/_clock/set_current_utc (with HostController and ComplianceOfficer)"
      - "POST /host-agency/advisors/{id}/credentials (with Advisor)"
      - "POST /host-agency/clients (with Advisor)"
      - "POST /host-agency/advisors/{id}/departure (with Advisor)"
      - "POST /host-agency/bookings/{id}/cancel (with Advisor)"
      - "all GET endpoints except GET /host-agency/advisors listing filters are unrestricted reads"

  - name: HostController
    description: >-
      The host agency's controller. Runs the monthly settlement (calculate then post), pays
      posted statements, and is the only role allowed to move money out of a client trust
      account. The same X-User-ID may not both calculate and post one run.
    identity: opaque
    exclusive_operations:
      - "POST /host-agency/settlement-runs/{id}/calculate"
      - "POST /host-agency/settlement-runs/{id}/post"
      - "POST /host-agency/advisor-statements/{id}/pay"
      - "POST /host-agency/clients/{id}/trust-ledger-entries with direction DISBURSEMENT or REFUND"
    shared_operations:
      - "POST /host-agency/_clock/set_current_utc (with HostOperations and ComplianceOfficer)"
      - "POST /host-agency/clients/{id}/trust-ledger-entries with direction DEPOSIT (with Advisor)"
      - "read access to suppliers, advisors, agreements, credentials, clients, trust ledgers, bookings, claims, runs and statements"

  - name: ComplianceOfficer
    description: >-
      The host agency's compliance function. Decides every credential (verify, reject, revoke),
      suspends and reinstates advisors, and is the only role that may finalize a departure and
      thereby re-home a book of business. Cannot onboard advisors, sign agreements or touch
      money.
    identity: opaque
    exclusive_operations:
      - "POST /host-agency/compliance-credentials/{id}/decision"
      - "POST /host-agency/advisors/{id}/suspend"
      - "POST /host-agency/advisors/{id}/reinstate"
      - "POST /host-agency/advisors/{id}/departure/finalize"
    shared_operations:
      - "POST /host-agency/_clock/set_current_utc (with HostOperations and HostController)"
      - "read access to suppliers, advisors, agreements, credentials, clients, trust ledgers, bookings, claims, runs and statements"

  - name: Advisor
    description: >-
      An independent travel advisor. X-User-ID is the Advisor row's id. May file own
      credentials, register and manage own clients, take client deposits, submit and cancel own
      bookings, file and resubmit commission claims, and declare own departure. Every write is
      ownership-scoped (validations[priority=32]).
    identity: "entity_backed:Advisor"
    exclusive_operations:
      - "POST /host-agency/bookings"
      - "POST /host-agency/bookings/{id}/commission-claims"
      - "POST /host-agency/commission-claims/{id}/resubmit"
      - "POST /host-agency/clients/{id}/trust-ledger-entries with direction DEPOSIT"
    shared_operations:
      - "POST /host-agency/advisors/{id}/credentials (with HostOperations)"
      - "POST /host-agency/clients (with HostOperations)"
      - "POST /host-agency/advisors/{id}/departure (with HostOperations)"
      - "POST /host-agency/bookings/{id}/cancel (with HostOperations)"
      - "read access to advisors, agreements, credentials, clients, trust ledgers, bookings, claims, runs and statements"

  - name: SupplierPortal
    description: >-
      A travel supplier acting through the host agency's supplier portal. X-User-ID is the
      Supplier row's id. Confirms bookings, records what commission it actually remitted, and
      denies commission claims it disputes. Cannot cancel a booking, resolve a claim, or see
      settlement statements.
    identity: "entity_backed:Supplier"
    exclusive_operations:
      - "POST /host-agency/bookings/{id}/confirm"
      - "POST /host-agency/bookings/{id}/commission-receipt"
      - "POST /host-agency/commission-claims/{id}/deny"
    shared_operations:
      - "read access to suppliers, advisors, bookings and commission claims"
