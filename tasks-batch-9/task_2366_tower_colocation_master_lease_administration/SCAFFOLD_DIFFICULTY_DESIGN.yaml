              captures: { gl1_id: $.data.id }
            - call: "POST /tower-colo/tenants"
              payload: { legal_name: "Kilo Wireless", carrier_code: "KKK" }
              as: PortfolioAdmin
              captures: { tk_id: $.data.id }
