# =============================================================================
# PRD Benchmark Seed Tables — task_1593 Air Cargo Handling & ULD Management
# =============================================================================

scenario: |
  Air Cargo Handling & ULD Management (air cargo handler): booking acceptance & capacity allocation by flight, build-up plan & ULD assignment, dangerous-goods acceptance check & documentation, ULD tracking, demurrage & repair charges, temperature/special-cargo handling & monitoring, customs hold & release coordination, offload/prioritization on weight restriction, damage/loss claim

domain_name: air-cargo-uld-management
api_prefix: /cargo

complexity_profile:
  primary_archetype: quota_allocation        # per-flight weight/volume/ULD-position pools reserved, committed, released
  secondary_archetype: compliance_audit      # dangerous-goods acceptance with segregation of duties, customs hold/release gating
  complexity_layers:
    - optimistic_concurrency                 # OCC on Flight.version (plan create) and BuildUpPlan.version (assign)
    - cascading_side_effects                 # weight-restriction offload chain; departure dispatch chain
    - dual_variant_calculation               # demurrage provisional-vs-final; claim liability-vs-declared-value
    - selector_policy                        # offload candidate ranking under weight restriction
  entity_topology: flat                      # peer resources linked by foreign keys, no nested creation paths
  state_machine_shape: cyclic                # Booking offload-rebook loop; ULD service-damage-repair loops
  relationship_patterns:
    - one_to_many                            # Flight -> Booking/BuildUpPlan; Booking -> DGDeclaration/TemperatureLog/CustomsHold/Claim
    - cross_aggregate                        # BuildUpPlan links Flight x ULD; ULDCharge links ULD; Claim links Booking
  role_model: segregation_of_duties          # DG acceptance checker must differ from booking creator
  consistency_model: immediate               # all mutations atomic within the request

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Flight
    parent: null
    common_fields: true
    fields:
      - { name: flight_number, type: string, source: input, description: "Carrier flight designator, unique per Flight row" }
      - { name: origin, type: string, source: input, description: "Origin IATA airport code" }
      - { name: destination, type: string, source: input, description: "Destination IATA airport code" }
      - { name: scheduled_departure, type: datetime, source: input, description: "Scheduled departure instant (ISO8601 UTC)" }
      - { name: scheduled_arrival, type: datetime, source: input, description: "Scheduled arrival instant; basis of provisional demurrage" }
      - { name: max_payload_kg, type: number, source: input, description: "Maximum cargo payload the flight may carry (kg)" }
      - { name: max_volume_m3, type: number, source: input, description: "Maximum cargo volume the flight may carry (m3)" }
      - { name: uld_position_count, type: integer, source: input, description: "Number of ULD positions available on the flight" }
      - { name: dg_certified, type: boolean, source: input, description: "Whether the flight may carry dangerous goods" }
      - { name: allocated_weight_kg, type: number, source: computed, default: 0, description: "Sum of gross_weight_kg over bookings on this flight with status in {ACCEPTED, BUILT_UP}" }
      - { name: allocated_volume_m3, type: number, source: computed, default: 0, description: "Sum of volume_m3 over bookings on this flight with status in {ACCEPTED, BUILT_UP}" }
      - { name: reserved_positions, type: integer, source: computed, default: 0, description: "Count of BuildUpPlans on this flight with status in {DRAFT, SEALED}" }
      - { name: weight_restriction_kg, type: number, source: system, default: null, description: "Active restricted payload imposed via weight-restriction; null when none" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> OPEN_FOR_BOOKING -> CLOSED -> DEPARTED" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: flight_id, type: string, source: input, description: "FK -> Flight.id; flight the booking is allocated to" }
      - { name: shipper_ref, type: string, source: input, description: "Shipper / house-awb reference" }
      - { name: commodity_code, type: string, source: input, description: "Commodity code (GEN, PER, AVI, ...)" }
      - { name: pieces, type: integer, source: input, description: "Number of pieces; must be >= 1" }
      - { name: gross_weight_kg, type: number, source: input, description: "Actual gross weight (kg); must be > 0" }
      - { name: volume_m3, type: number, source: input, description: "Gross volume (m3); must be > 0" }
      - { name: chargeable_weight_kg, type: number, source: computed, description: "max(gross_weight_kg, volume_m3 * 167.0), rounded to 2dp half-up; immutable after creation" }
      - { name: is_dangerous_goods, type: boolean, source: input, default: false, description: "Whether the shipment contains dangerous goods" }
      - { name: temp_min_c, type: number, source: input, default: null, description: "Minimum permitted temperature (C) for temperature-controlled cargo; null = not temperature-controlled" }
      - { name: temp_max_c, type: number, source: input, default: null, description: "Maximum permitted temperature (C); both or neither of temp_min_c/temp_max_c must be set, and temp_min_c <= temp_max_c" }
      - { name: declared_value, type: number, source: input, default: null, description: "Shipper-declared value for carriage; null = no declared value (liability basis applies to claims)" }
      - { name: temp_excursion_count, type: integer, source: computed, default: 0, description: "Count of TemperatureLog rows with in_range == false" }
      - { name: temp_status, type: enum, source: computed, description: "NOT_MONITORED (no temp range) | IN_RANGE | EXCURSION (sticky once any excursion)" }
      - { name: build_up_plan_id, type: string, source: system, default: null, description: "FK -> BuildUpPlan.id; plan the booking is currently built into; null unless status == BUILT_UP" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the ForwarderAgent who created the booking; ownership + segregation-of-duties anchor" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> ACCEPTED -> BUILT_UP -> LOADED; offload loop via OFFLOADED; REJECTED / CANCELLED" }

  - name: ULDType
    parent: null
    common_fields: false
    fields:
      - { name: type_code, type: string, source: input, description: "IATA ULD type code (AKE, PMC, ...); unique" }
      - { name: tare_weight_kg, type: number, source: input, description: "Empty weight of the ULD (kg)" }
      - { name: max_gross_weight_kg, type: number, source: input, description: "Maximum gross weight (tare + contents) the ULD may hold (kg)" }
      - { name: internal_volume_m3, type: number, source: input, description: "Usable internal volume (m3)" }

  - name: ULD
    parent: null
    common_fields: true
    fields:
      - { name: uld_code, type: string, source: input, description: "ULD serial (e.g. AKE12345CA); unique across all ULDs" }
      - { name: uld_type_id, type: string, source: input, description: "FK -> ULDType.id; type of this unit" }
      - { name: status, type: enum, source: system, description: "SERVICEABLE -> ASSIGNED -> DISPATCHED -> RETURNED -> SERVICEABLE; damage loop via DAMAGE_REPORTED" }
      - { name: dispatched_at, type: datetime, source: system, default: null, description: "Logical-clock instant when the ULD departed (ASSIGNED -> DISPATCHED)" }
      - { name: returned_at, type: datetime, source: system, default: null, description: "Logical-clock instant when the ULD was returned (DISPATCHED -> RETURNED)" }

  - name: BuildUpPlan
    parent: null
    common_fields: true
    fields:
      - { name: flight_id, type: string, source: input, description: "FK -> Flight.id; flight this build-up plan loads onto" }
      - { name: uld_id, type: string, source: input, description: "FK -> ULD.id; unit being built" }
      - { name: build_start, type: datetime, source: input, description: "Planned build window start (ISO8601 UTC)" }
      - { name: build_end, type: datetime, source: input, description: "Planned build window end; must be > build_start" }
      - { name: total_weight_kg, type: number, source: computed, default: 0, description: "Sum of gross_weight_kg of bookings currently BUILT_UP on this plan" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SEALED -> DEPARTED; CANCELLED from DRAFT/SEALED" }

  - name: DGDeclaration
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; booking this declaration documents" }
      - { name: un_number, type: string, source: input, description: "UN number of the dangerous goods (e.g. UN1263)" }
      - { name: dg_class, type: string, source: input, description: "IATA hazard class label (e.g. '3', '6.1')" }
      - { name: packing_group, type: enum, source: input, description: "I | II | III" }
      - { name: declaration_doc_ref, type: string, source: input, description: "Shipper's Declaration for Dangerous Goods document reference" }
      - { name: checked_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the DGInspector who accepted/rejected; must differ from booking.created_by_user_id" }
      - { name: rejection_reason, type: string, source: system, default: null, description: "Reason recorded at rejection" }
      - { name: status, type: enum, source: system, description: "PENDING_CHECK -> ACCEPTED | REJECTED" }

  - name: TemperatureLog
    parent: null
    common_fields: false
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; booking being monitored" }
      - { name: recorded_at, type: datetime, source: input, description: "Instant the reading was taken (ISO8601 UTC)" }
      - { name: temperature_c, type: number, source: input, description: "Recorded temperature (C)" }
      - { name: in_range, type: boolean, source: computed, description: "true iff booking.temp_min_c <= temperature_c <= booking.temp_max_c (bounds inclusive)" }

  - name: CustomsHold
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; booking placed under customs hold" }
      - { name: reason_code, type: string, source: input, description: "Hold reason code (e.g. DOC_CHECK, INSPECTION)" }
      - { name: placed_at, type: datetime, source: system, description: "Logical-clock instant the hold was placed" }
      - { name: released_at, type: datetime, source: system, default: null, description: "Logical-clock instant the hold was released" }
      - { name: release_note, type: string, source: system, default: null, description: "Note recorded at release" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> RELEASED" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; booking being claimed against (must be LOADED)" }
      - { name: claim_type, type: enum, source: input, description: "DAMAGE | LOSS" }
      - { name: claimed_amount, type: number, source: input, description: "Amount claimed by the forwarder; must be > 0" }
      - { name: items, type: array, source: input, description: "Non-empty list of affected pieces, each { weight_kg: number > 0 }" }
      - { name: description, type: string, source: input, default: null, description: "Free-text claim description" }
      - { name: item_total, type: number, source: computed, default: null, description: "Sum over items of round_half_up(item.weight_kg * 19.00, 2) — per-item rounding THEN sum (pinned order); computed at approval" }
      - { name: basis, type: enum, source: computed, default: null, description: "LIABILITY (no declared_value) | DECLARED_VALUE; computed at approval" }
      - { name: approved_amount, type: number, source: computed, default: null, description: "min(claimed_amount, item_total, basis cap); computed at approval" }
      - { name: settlement_ref, type: string, source: system, default: null, description: "Payment reference recorded at settlement" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> APPROVED -> SETTLED; SUBMITTED -> REJECTED" }

  - name: ULDCharge
    parent: null
    common_fields: true
    fields:
      - { name: uld_id, type: string, source: system, description: "FK -> ULD.id; unit the charge applies to" }
      - { name: charge_type, type: enum, source: system, description: "DEMURRAGE | REPAIR" }
      - { name: amount, type: number, source: computed, description: "Charge amount; provisional estimate while PROVISIONAL, final value when FINALIZED" }
      - { name: tier1_days, type: integer, source: computed, default: null, description: "DEMURRAGE only: chargeable days billed at TIER1_RATE" }
      - { name: tier2_days, type: integer, source: computed, default: null, description: "DEMURRAGE only: chargeable days billed at TIER2_RATE" }
      - { name: description, type: string, source: system, default: null, description: "REPAIR only: damage description from report-damage" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL -> FINALIZED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Flight
    initial_state: SCHEDULED
    terminal_states: [DEPARTED]
    transitions:
      - from: SCHEDULED
        to: OPEN_FOR_BOOKING
        trigger: POST /cargo/flights/{id}/open
        actor: CapacityController
        preconditions:
          - "Flight must be SCHEDULED (else ERR_FLIGHT_NOT_OPEN)"
        side_effects: []

      - from: OPEN_FOR_BOOKING
        to: CLOSED
        trigger: POST /cargo/flights/{id}/close
        actor: CapacityController
        preconditions:
          - "Flight must be OPEN_FOR_BOOKING (else ERR_FLIGHT_NOT_OPEN)"
          - "No BuildUpPlan on this flight in DRAFT (else ERR_DRAFT_PLANS_EXIST)"
        side_effects: []

      - from: CLOSED
        to: DEPARTED
        trigger: POST /cargo/flights/{id}/depart
        actor: CapacityController
        preconditions:
          - "Flight must be CLOSED (else ERR_FLIGHT_NOT_CLOSED)"
        side_effects:
          - "CASCADE link 1: every SEALED BuildUpPlan on this flight -> DEPARTED"
          - "CASCADE link 2 (caused by link 1): each departed plan's ULD ASSIGNED -> DISPATCHED, ULD.dispatched_at = current logical clock"
          - "CASCADE link 3 (caused by link 2): for each newly DISPATCHED ULD, create a DEMURRAGE ULDCharge in PROVISIONAL status via demurrage_calculation provisional variant (end = flight.scheduled_arrival)"
          - "Every booking BUILT_UP on a departed plan -> LOADED"
          - "Every ACCEPTED booking on this flight that was never built -> OFFLOADED, allocated_weight_kg/allocated_volume_m3 decremented (missed departure)"

  - entity: Booking
    initial_state: REQUESTED
    terminal_states: [LOADED, REJECTED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: ACCEPTED
        trigger: POST /cargo/bookings/{id}/accept
        actor: CapacityController
        preconditions:
          - "Booking must be REQUESTED (else ERR_BOOKING_INVALID_STATE)"
          - "Flight must be OPEN_FOR_BOOKING (else ERR_FLIGHT_NOT_OPEN)"
          - "If booking.is_dangerous_goods then flight.dg_certified must be true (else ERR_FLIGHT_NOT_DG_CERTIFIED)"
          - "flight_capacity_check: allocated + candidate within max_payload_kg and max_volume_m3 (else ERR_FLIGHT_PAYLOAD_EXCEEDED / ERR_FLIGHT_VOLUME_EXCEEDED)"
        side_effects:
          - "flight.allocated_weight_kg += gross_weight_kg; flight.allocated_volume_m3 += volume_m3 (increments Flight.version)"

      - from: REQUESTED
        to: REJECTED
        trigger: POST /cargo/bookings/{id}/reject
        actor: CapacityController
        preconditions:
          - "Booking must be REQUESTED (else ERR_BOOKING_INVALID_STATE)"
        side_effects: []

      - from: REQUESTED
        to: CANCELLED
        trigger: POST /cargo/bookings/{id}/cancel
        actor: ForwarderAgent
        preconditions:
          - "Booking must be REQUESTED or ACCEPTED (else ERR_BOOKING_INVALID_STATE)"
          - "Acting ForwarderAgent must own the booking: X-User-ID == booking.created_by_user_id (else ERR_BOOKING_NOT_OWNED)"
        side_effects: []

      - from: ACCEPTED
        to: CANCELLED
        trigger: POST /cargo/bookings/{id}/cancel
        actor: ForwarderAgent
        preconditions:
          - "Booking must be REQUESTED or ACCEPTED (else ERR_BOOKING_INVALID_STATE)"
          - "Acting ForwarderAgent must own the booking (else ERR_BOOKING_NOT_OWNED)"
        side_effects:
          - "flight.allocated_weight_kg -= gross_weight_kg; flight.allocated_volume_m3 -= volume_m3 (compensates the accept debit)"

      - from: ACCEPTED
        to: BUILT_UP
        trigger: POST /cargo/build-up-plans/{id}/assign
        actor: RampOperator
        preconditions:
          - "Plan must be DRAFT (else ERR_PLAN_NOT_DRAFT)"
          - "Booking must be ACCEPTED (else ERR_BOOKING_NOT_ACCEPTED)"
          - "No CustomsHold on the booking with status ACTIVE (else ERR_CUSTOMS_HOLD_ACTIVE)"
          - "If booking.is_dangerous_goods, a DGDeclaration with status ACCEPTED must exist for the booking (else ERR_DG_NOT_ACCEPTED)"
          - "booking.flight_id == plan.flight_id (else ERR_BOOKING_FLIGHT_MISMATCH)"
          - "uld_payload_check: tare + plan.total_weight_kg + gross <= uld_type.max_gross_weight_kg (else ERR_ULD_PAYLOAD_EXCEEDED)"
        side_effects:
          - "booking.build_up_plan_id = plan.id"
          - "plan.total_weight_kg += gross_weight_kg; increments BuildUpPlan.version"

      - from: BUILT_UP
        to: ACCEPTED
        trigger: POST /cargo/build-up-plans/{id}/cancel
        actor: RampOperator
        preconditions:
          - "Plan must be DRAFT or SEALED (else ERR_PLAN_NOT_CANCELLABLE)"
        side_effects:
          - "booking.build_up_plan_id = null; plan.total_weight_kg -= gross_weight_kg"

      - from: ACCEPTED
        to: OFFLOADED
        trigger: "POST /cargo/flights/{id}/weight-restriction (offload_selection) or POST /cargo/flights/{id}/depart (missed departure)"
        actor: system
        preconditions: []
        side_effects:
          - "flight.allocated_weight_kg -= gross_weight_kg; flight.allocated_volume_m3 -= volume_m3"

      - from: BUILT_UP
        to: OFFLOADED
        trigger: POST /cargo/flights/{id}/weight-restriction (offload_selection)
        actor: system
        preconditions: []
        side_effects:
          - "flight.allocated_weight_kg -= gross_weight_kg; flight.allocated_volume_m3 -= volume_m3"
          - "CASCADE next link: booking removed from its BuildUpPlan (build_up_plan_id = null); plan.total_weight_kg -= gross_weight_kg"
          - "CASCADE next link (caused by the removal): if the plan then has zero BUILT_UP bookings, the plan auto-transitions DRAFT -> CANCELLED"
          - "CASCADE final link (caused by the auto-cancel): the plan's ULD ASSIGNED -> SERVICEABLE"

      - from: BUILT_UP
        to: LOADED
        trigger: POST /cargo/flights/{id}/depart
        actor: system
        preconditions: []
        side_effects: []

      - from: OFFLOADED
        to: ACCEPTED
        trigger: POST /cargo/bookings/{id}/rebook
        actor: CapacityController
        preconditions:
          - "Booking must be OFFLOADED (else ERR_BOOKING_INVALID_STATE)"
          - "Target flight must be OPEN_FOR_BOOKING (else ERR_FLIGHT_NOT_OPEN)"
          - "If booking.is_dangerous_goods then target flight.dg_certified must be true (else ERR_FLIGHT_NOT_DG_CERTIFIED)"
          - "flight_capacity_check against the target flight (else ERR_FLIGHT_PAYLOAD_EXCEEDED / ERR_FLIGHT_VOLUME_EXCEEDED)"
        side_effects:
          - "booking.flight_id = target flight; target flight.allocated_weight_kg += gross_weight_kg; allocated_volume_m3 += volume_m3"

  - entity: ULD
    initial_state: SERVICEABLE
    terminal_states: []
    transitions:
      - from: SERVICEABLE
        to: ASSIGNED
        trigger: POST /cargo/build-up-plans
        actor: system
        preconditions:
          - "ULD must be SERVICEABLE (else ERR_ULD_NOT_SERVICEABLE)"
        side_effects: []

      - from: ASSIGNED
        to: SERVICEABLE
        trigger: "POST /cargo/build-up-plans/{id}/cancel, or offload auto-cancel cascade"
        actor: system
        preconditions: []
        side_effects: []

      - from: ASSIGNED
        to: DISPATCHED
        trigger: POST /cargo/flights/{id}/depart
        actor: system
        preconditions: []
        side_effects:
          - "dispatched_at = current logical clock"
          - "Create PROVISIONAL DEMURRAGE ULDCharge via demurrage_calculation provisional variant"

      - from: DISPATCHED
        to: RETURNED
        trigger: POST /cargo/ulds/{id}/return
        actor: RampOperator
        preconditions:
          - "ULD must be DISPATCHED (else ERR_ULD_INVALID_STATE)"
        side_effects:
          - "returned_at = current logical clock"
          - "Finalize the PROVISIONAL DEMURRAGE ULDCharge via demurrage_calculation final variant (end = returned_at); status -> FINALIZED, amount/tier1_days/tier2_days recomputed"

      - from: RETURNED
        to: SERVICEABLE
        trigger: POST /cargo/ulds/{id}/release
        actor: RampOperator
        preconditions:
          - "ULD must be RETURNED (else ERR_ULD_INVALID_STATE)"
        side_effects: []

      - from: RETURNED
        to: DAMAGE_REPORTED
        trigger: POST /cargo/ulds/{id}/report-damage
        actor: RampOperator
        preconditions:
          - "ULD must be RETURNED (else ERR_ULD_INVALID_STATE)"
        side_effects:
          - "Create PROVISIONAL REPAIR ULDCharge via repair_charge_calculation provisional variant (amount = repair_cost_estimate)"

      - from: DAMAGE_REPORTED
        to: SERVICEABLE
        trigger: POST /cargo/ulds/{id}/complete-repair
        actor: RampOperator
        preconditions:
          - "ULD must be DAMAGE_REPORTED (else ERR_ULD_INVALID_STATE)"
        side_effects:
          - "Finalize the PROVISIONAL REPAIR ULDCharge: amount = final_repair_cost, status -> FINALIZED"

  - entity: BuildUpPlan
    initial_state: DRAFT
    terminal_states: [DEPARTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SEALED
        trigger: POST /cargo/build-up-plans/{id}/seal
        actor: RampOperator
        preconditions:
          - "Plan must be DRAFT (else ERR_PLAN_NOT_DRAFT)"
          - "Plan must contain at least one BUILT_UP booking (else ERR_PLAN_EMPTY)"
        side_effects: []

      - from: DRAFT
        to: CANCELLED
        trigger: POST /cargo/build-up-plans/{id}/cancel
        actor: RampOperator
        preconditions:
          - "Plan must be DRAFT or SEALED (else ERR_PLAN_NOT_CANCELLABLE)"
        side_effects:
          - "All BUILT_UP bookings on the plan -> ACCEPTED (build_up_plan_id = null; total_weight_kg recomputed)"
          - "ULD ASSIGNED -> SERVICEABLE"

      - from: SEALED
        to: CANCELLED
        trigger: POST /cargo/build-up-plans/{id}/cancel
        actor: RampOperator
        preconditions:
          - "Plan must be DRAFT or SEALED (else ERR_PLAN_NOT_CANCELLABLE)"
        side_effects:
          - "All BUILT_UP bookings on the plan -> ACCEPTED"
          - "ULD ASSIGNED -> SERVICEABLE"

      - from: DRAFT
        to: CANCELLED
        trigger: "system (automatic when weight-restriction offload removes the plan's last BUILT_UP booking)"
        actor: system
        preconditions: []
        side_effects:
          - "ULD ASSIGNED -> SERVICEABLE"
          - "flight.reserved_positions -= 1 (same compensation as the endpoint-driven cancel)"

      - from: SEALED
        to: DEPARTED
        trigger: POST /cargo/flights/{id}/depart
        actor: system
        preconditions: []
        side_effects:
          - "ULD ASSIGNED -> DISPATCHED (dispatched_at = logical clock)"
          - "PROVISIONAL DEMURRAGE ULDCharge created for the ULD"
          - "All BUILT_UP bookings on the plan -> LOADED"

  - entity: DGDeclaration
    initial_state: PENDING_CHECK
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: PENDING_CHECK
        to: ACCEPTED
        trigger: POST /cargo/dg-declarations/{id}/accept
        actor: DGInspector
        preconditions:
          - "Declaration must be PENDING_CHECK (else ERR_DG_NOT_PENDING)"
          - "Segregation of duties: X-User-ID != booking.created_by_user_id (else ERR_SOD_VIOLATION)"
        side_effects:
          - "checked_by_user_id = acting X-User-ID"

      - from: PENDING_CHECK
        to: REJECTED
        trigger: POST /cargo/dg-declarations/{id}/reject
        actor: DGInspector
        preconditions:
          - "Declaration must be PENDING_CHECK (else ERR_DG_NOT_PENDING)"
          - "Segregation of duties: X-User-ID != booking.created_by_user_id (else ERR_SOD_VIOLATION)"
        side_effects:
          - "checked_by_user_id = acting X-User-ID; rejection_reason recorded"
        note: "A rejected declaration is terminal; the forwarder resubmits by POSTing a new DGDeclaration (aggregate-level resubmission loop)."

  - entity: CustomsHold
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: POST /cargo/customs-holds/{id}/release
        actor: CustomsOfficer
        preconditions:
          - "Hold must be ACTIVE (else ERR_HOLD_NOT_ACTIVE)"
        side_effects:
          - "released_at = current logical clock; release_note recorded"

  - entity: Claim
    initial_state: SUBMITTED
    terminal_states: [SETTLED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: POST /cargo/claims/{id}/approve
        actor: ClaimsAdjuster
        preconditions:
          - "Claim must be SUBMITTED (else ERR_CLAIM_NOT_SUBMITTED)"
        side_effects:
          - "claim_settlement_calculation runs: item_total, basis, approved_amount computed"

      - from: SUBMITTED
        to: REJECTED
        trigger: POST /cargo/claims/{id}/reject
        actor: ClaimsAdjuster
        preconditions:
          - "Claim must be SUBMITTED (else ERR_CLAIM_NOT_SUBMITTED)"
        side_effects: []

      - from: APPROVED
        to: SETTLED
        trigger: POST /cargo/claims/{id}/settle
        actor: ClaimsAdjuster
        preconditions:
          - "Claim must be APPROVED (else ERR_CLAIM_NOT_APPROVED)"
        side_effects:
          - "settlement_ref recorded"

  - entity: ULDCharge
    initial_state: PROVISIONAL
    terminal_states: [FINALIZED]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /cargo/ulds/{id}/return (DEMURRAGE) or POST /cargo/ulds/{id}/complete-repair (REPAIR)"
        actor: system
        preconditions: []
        side_effects:
          - "amount recomputed per demurrage_calculation final variant / repair_charge_calculation final variant"

# =============================================================================
# Concurrency Rules (OCC on parent version — §1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: build-plan-create-stale-flight
    parent_entity: Flight
    write_endpoint: "POST /cargo/build-up-plans"
    occ_field: expected_flight_version
    description: |
      Creating a BuildUpPlan against a Flight whose version has advanced since
      the client last observed it is rejected. This captures the case where the
      flight's capacity posture (allocations, restrictions) has moved on and the
      client's view of the flight is therefore stale.
    error_id: ERR_STALE_FLIGHT_VERSION
    http_status: 412

  - rule_id: assignment-create-stale-plan
    parent_entity: BuildUpPlan
    write_endpoint: "POST /cargo/build-up-plans/{id}/assign"
    occ_field: expected_build_up_plan_version
    description: |
      Assigning a booking to a BuildUpPlan whose version has advanced since the
      client last observed it is rejected. This captures the case where the
      plan's composition (and thus total_weight_kg) has changed and the client's
      weight calculation is therefore stale.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: chargeable_weight
    trigger: "booking creation (computed once, immutable thereafter)"
    algorithm: aggregation
    formula: |
      volumetric_weight_kg = volume_m3 * VOLUMETRIC_FACTOR
      chargeable_weight_kg = round_half_up(max(gross_weight_kg, volumetric_weight_kg), 2)
    input_set: "the booking being created"
    constants:
      VOLUMETRIC_FACTOR: 167.0   # kg per m3 (IATA 1:6000)
    precision: "2 decimal places, round_half_up"

  - name: flight_capacity_check
    trigger: "POST /cargo/bookings/{id}/accept and POST /cargo/bookings/{id}/rebook"
    algorithm: threshold
    formula: |
      allocated_weight = sum(gross_weight_kg of bookings on the flight with status IN {ACCEPTED, BUILT_UP})
      allocated_volume = sum(volume_m3       of bookings on the flight with status IN {ACCEPTED, BUILT_UP})
      accept iff allocated_weight + candidate.gross_weight_kg <= flight.max_payload_kg
             AND allocated_volume + candidate.volume_m3      <= flight.max_volume_m3
      Boundary: equality is ACCEPTED; only a strictly-greater result is rejected.
      REQUESTED / OFFLOADED / REJECTED / CANCELLED / LOADED bookings are excluded from the sums.
    input_set: "bookings on the target flight with status in {ACCEPTED, BUILT_UP}, plus the candidate"
    constants: {}
    precision: "comparison on raw 2dp inputs; no rounding"

  - name: demurrage_calculation
    trigger: "flight departure (provisional, at ULD DISPATCHED) and ULD return (final, at DISPATCHED -> RETURNED)"
    algorithm: tiered_pricing
    formula: |
      days_in_use    = floor((end_ts - uld.dispatched_at) / 86400)   # whole 24h periods
      chargeable_days = max(0, days_in_use - FREE_DAYS)
      tier1_days = min(chargeable_days, TIER1_DAYS)
      tier2_days = chargeable_days - tier1_days
      amount = round_half_up(tier1_days * TIER1_RATE + tier2_days * TIER2_RATE, 2)
    input_set: "the ULD being dispatched/returned and its flight's scheduled_arrival (provisional) or returned_at (final)"
    constants:
      FREE_DAYS: 3
      TIER1_DAYS: 4
      TIER1_RATE: 50.00   # per ULD per day
      TIER2_RATE: 120.00  # per ULD per day
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "ULD ASSIGNED -> DISPATCHED (flight departure)"
        difference: "end_ts = flight.scheduled_arrival; charge created with status PROVISIONAL"
      - name: final
        when: "ULD DISPATCHED -> RETURNED"
        difference: "end_ts = uld.returned_at (actual return); the same charge row is recomputed and set FINALIZED"

  - name: repair_charge_calculation
    trigger: "report-damage (provisional) and complete-repair (final)"
    algorithm: aggregation
    formula: |
      provisional: amount = repair_cost_estimate (as supplied at report-damage)
      final:       amount = final_repair_cost    (as supplied at complete-repair)
    input_set: "the ULD under damage report / repair"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "ULD RETURNED -> DAMAGE_REPORTED"
        difference: "amount = repair_cost_estimate, status PROVISIONAL"
      - name: final
        when: "ULD DAMAGE_REPORTED -> SERVICEABLE"
        difference: "amount = final_repair_cost, status FINALIZED"

  - name: claim_settlement_calculation
    trigger: "POST /cargo/claims/{id}/approve"
    algorithm: weighted_scoring
    formula: |
      # PINNED ROUNDING ORDER: round each per-item term FIRST, then sum.
      item_total = sum over claim.items of round_half_up(item.weight_kg * LIABILITY_RATE_PER_KG, 2)
      if booking.declared_value is null:
        basis = LIABILITY
        cap   = round_half_up(booking.chargeable_weight_kg * LIABILITY_RATE_PER_KG, 2)
      else:
        basis = DECLARED_VALUE
        cap   = booking.declared_value
      approved_amount = round_half_up(min(claim.claimed_amount, item_total, cap), 2)
    input_set: "the claim, its items, and the claimed-against booking (chargeable_weight_kg, declared_value)"
    constants:
      LIABILITY_RATE_PER_KG: 19.00
    precision: "2 decimal places, round_half_up; per-item rounding precedes summation"
    variants:
      - name: liability_basis
        when: "booking.declared_value is null"
        difference: "cap = chargeable_weight_kg * 19.00"
      - name: declared_value_basis
        when: "booking.declared_value is not null"
        difference: "cap = declared_value (weight plays no role in the cap)"

  - name: offload_selection
    trigger: "POST /cargo/flights/{id}/weight-restriction"
    algorithm: chronological
    formula: |
      required_reduction = flight.allocated_weight_kg - restricted_payload_kg
      if required_reduction <= 0: no booking is offloaded; only weight_restriction_kg is recorded.
      candidates = bookings on this flight with status IN {ACCEPTED, BUILT_UP}
      sort order: created_at DESC, tie-break gross_weight_kg DESC, then volume_m3 DESC
      iterate candidates in that order, offloading each (with its cascade) and
      recomputing allocated_weight_kg, until allocated_weight_kg <= restricted_payload_kg.
      Whole bookings only — never partial.
      Empty-pool fallback: offloading every candidate leaves allocated_weight_kg == 0,
      which satisfies any positive restricted_payload_kg, so the selection never dead-ends.
    input_set: "bookings on the flight with status in {ACCEPTED, BUILT_UP}"
    constants: {}
    precision: "integer/2dp comparisons; no rounding"

  - name: temperature_excursion_check
    trigger: "POST /cargo/bookings/{id}/temperature-logs"
    algorithm: threshold
    formula: |
      in_range = (booking.temp_min_c <= temperature_c <= booking.temp_max_c)   # bounds INCLUSIVE
      if not in_range:
        booking.temp_excursion_count += 1
        booking.temp_status = EXCURSION      # sticky: never returns to IN_RANGE
      else if booking.temp_status == NOT_MONITORED:
        booking.temp_status = IN_RANGE
    input_set: "the new TemperatureLog row and its booking's temp range"
    constants: {}
    precision: "comparison on raw inputs; no rounding"

  - name: uld_payload_check
    trigger: "POST /cargo/build-up-plans/{id}/assign"
    algorithm: threshold
    formula: |
      projected_gross = uld_type.tare_weight_kg + plan.total_weight_kg + candidate.gross_weight_kg
      assign allowed iff projected_gross <= uld_type.max_gross_weight_kg
      Boundary: equality is allowed; only strictly-greater is rejected.
    input_set: "the plan's ULD type, bookings currently BUILT_UP on the plan, and the candidate booking"
    constants: {}
    precision: "comparison on raw 2dp inputs; no rounding"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role must be one of the endpoint's declared roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Resource ids in the path must exist, validated left-to-right; ids referenced in the body (flight_id, uld_type_id, uld_id, booking_id) must exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path or body resource references"

  - priority: 4
    category: existence
    check: "Request shape: required fields present; types valid; enum fields within declared values; pieces >= 1; gross_weight_kg > 0; volume_m3 > 0; claimed_amount > 0; items non-empty with weight_kg > 0; temp range both-or-neither with temp_min_c <= temp_max_c; build_end > build_start; 0 < restricted_payload_kg <= max_payload_kg"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 5
    category: auth
    check: "Attribute authorization: ForwarderAgent may cancel / declare DG / claim only on bookings whose created_by_user_id == X-User-ID (ERR_BOOKING_NOT_OWNED); DG accept/reject requires X-User-ID != booking.created_by_user_id (ERR_SOD_VIOLATION)"
    error_id: "ERR_BOOKING_NOT_OWNED | ERR_SOD_VIOLATION"
    http_status: 403
    applies_to: "POST /cargo/bookings/{id}/cancel, POST /cargo/bookings/{id}/dg-declarations, POST /cargo/claims, POST /cargo/dg-declarations/{id}/accept, POST /cargo/dg-declarations/{id}/reject"

  - priority: 6
    category: state
    check: "Target resource(s) in the required state for the operation, including OCC expected_*_version matches the parent's current version (ERR_STALE_FLIGHT_VERSION / ERR_STALE_PLAN_VERSION); at most one ACTIVE CustomsHold per booking (ERR_HOLD_ALREADY_ACTIVE); at most one PENDING_CHECK DGDeclaration per booking (ERR_DG_CHECK_ALREADY_PENDING)"
    error_id: "ERR_FLIGHT_NOT_OPEN | ERR_FLIGHT_NOT_CLOSED | ERR_DRAFT_PLANS_EXIST | ERR_BOOKING_NOT_ACCEPTED | ERR_BOOKING_INVALID_STATE | ERR_PLAN_NOT_DRAFT | ERR_PLAN_NOT_CANCELLABLE | ERR_PLAN_EMPTY | ERR_ULD_NOT_SERVICEABLE | ERR_ULD_INVALID_STATE | ERR_DG_NOT_PENDING | ERR_DG_CHECK_ALREADY_PENDING | ERR_HOLD_NOT_ACTIVE | ERR_HOLD_ALREADY_ACTIVE | ERR_CLAIM_NOT_SUBMITTED | ERR_CLAIM_NOT_APPROVED | ERR_STALE_FLIGHT_VERSION | ERR_STALE_PLAN_VERSION"
    http_status: "409 (412 for the two OCC errors)"
    applies_to: "all state-transition and mutating endpoints"

  - priority: 7
    category: business_safety
    check: "Dangerous-goods embargo: an is_dangerous_goods booking may be accepted/rebooked only onto a dg_certified flight"
    error_id: ERR_FLIGHT_NOT_DG_CERTIFIED
    http_status: 409
    applies_to: "POST /cargo/bookings/{id}/accept, POST /cargo/bookings/{id}/rebook"

  - priority: 8
    category: business_safety
    check: "Customs gate: no CustomsHold with status ACTIVE may exist on the booking when it is built into a plan"
    error_id: ERR_CUSTOMS_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /cargo/build-up-plans/{id}/assign"

  - priority: 9
    category: business_safety
    check: "Dangerous-goods documentation gate: an is_dangerous_goods booking requires an ACCEPTED DGDeclaration before build-up"
    error_id: ERR_DG_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /cargo/build-up-plans/{id}/assign"

  - priority: 10
    category: business_referential
    check: "Cross-references must be coherent: booking.flight_id == plan.flight_id on assign (ERR_BOOKING_FLIGHT_MISMATCH); DGDeclaration only on is_dangerous_goods bookings (ERR_DG_NOT_APPLICABLE); temperature logs only on bookings with a temp range (ERR_TEMP_RANGE_NOT_DEFINED)"
    error_id: "ERR_BOOKING_FLIGHT_MISMATCH | ERR_DG_NOT_APPLICABLE | ERR_TEMP_RANGE_NOT_DEFINED"
    http_status: 422
    applies_to: "POST /cargo/build-up-plans/{id}/assign, POST /cargo/bookings/{id}/dg-declarations, POST /cargo/bookings/{id}/temperature-logs"

  - priority: 11
    category: business_constraint
    check: "Build-window buffer: on the same flight, non-terminal BuildUpPlan windows must be separated by >= 30 minutes in either direction (gap == 30 allowed); uld_code and type_code uniqueness (ERR_DUPLICATE_ULD_CODE)"
    error_id: "ERR_BUILD_WINDOW_CONFLICT | ERR_DUPLICATE_ULD_CODE"
    http_status: 409
    applies_to: "POST /cargo/build-up-plans, POST /cargo/ulds, POST /cargo/uld-types"

  - priority: 12
    category: business_constraint
    check: "ULD payload: tare + plan total + candidate gross <= uld_type.max_gross_weight_kg (equality allowed); ULD positions: reserved_positions < flight.uld_position_count at plan creation"
    error_id: "ERR_ULD_PAYLOAD_EXCEEDED | ERR_ULD_POSITION_UNAVAILABLE"
    http_status: 422
    applies_to: "POST /cargo/build-up-plans/{id}/assign, POST /cargo/build-up-plans"

  - priority: 13
    category: business_fiscal
    check: "Flight payload capacity: allocated_weight + candidate gross <= max_payload_kg (equality allowed)"
    error_id: ERR_FLIGHT_PAYLOAD_EXCEEDED
    http_status: 422
    applies_to: "POST /cargo/bookings/{id}/accept, POST /cargo/bookings/{id}/rebook"

  - priority: 14
    category: business_fiscal
    check: "Flight volume capacity: allocated_volume + candidate volume <= max_volume_m3 (equality allowed)"
    error_id: ERR_FLIGHT_VOLUME_EXCEEDED
    http_status: 422
    applies_to: "POST /cargo/bookings/{id}/accept, POST /cargo/bookings/{id}/rebook"

# =============================================================================
# Table 1.0 Response Envelope (FIXED) + Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Flight ---
  - method: POST
    path: "/cargo/flights"
    description: "Create a flight with its cargo capacity pools"
    roles: [CapacityController]
    code: 201
    input: [flight_number, origin, destination, scheduled_departure, scheduled_arrival, max_payload_kg, max_volume_m3, uld_position_count, dg_certified]
    output: Flight
    side_effects: ["status = SCHEDULED; allocated_* = 0; reserved_positions = 0"]

  - method: GET
    path: "/cargo/flights"
    description: "List flights, optionally filtered by status"
    roles: [CapacityController, ForwarderAgent, RampOperator, DGInspector, CustomsOfficer, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Flight[]"
    side_effects: []

  - method: GET
    path: "/cargo/flights/{id}"
    description: "Get one flight"
    roles: [CapacityController, ForwarderAgent, RampOperator, DGInspector, CustomsOfficer, ClaimsAdjuster]
    code: 200
    input: []
    output: Flight
    side_effects: []

  - method: POST
    path: "/cargo/flights/{id}/open"
    description: "Open a SCHEDULED flight for booking"
    roles: [CapacityController]
    code: 200
    input: []
    output: Flight
    side_effects: ["status -> OPEN_FOR_BOOKING"]

  - method: POST
    path: "/cargo/flights/{id}/close"
    description: "Close an OPEN_FOR_BOOKING flight; requires no DRAFT build-up plans"
    roles: [CapacityController]
    code: 200
    input: []
    output: Flight
    side_effects: ["status -> CLOSED"]

  - method: POST
    path: "/cargo/flights/{id}/depart"
    description: "Depart a CLOSED flight; fires the dispatch cascade (plans -> DEPARTED, ULDs -> DISPATCHED, provisional demurrage charges, bookings -> LOADED, unbuilt ACCEPTED bookings -> OFFLOADED)"
    roles: [CapacityController]
    code: 200
    input: []
    output: Flight
    side_effects: ["status -> DEPARTED; dispatch cascade per Flight state machine"]

  - method: POST
    path: "/cargo/flights/{id}/weight-restriction"
    description: "Impose a restricted payload on an OPEN_FOR_BOOKING or CLOSED flight; runs offload_selection"
    roles: [CapacityController]
    code: 200
    input: [restricted_payload_kg]
    output: Flight
    side_effects: ["weight_restriction_kg recorded; bookings offloaded per offload_selection with the BUILT_UP cascade (plan recompute, empty-plan auto-cancel, ULD release)"]

  - method: GET
    path: "/cargo/flights/{id}/bookings"
    description: "List bookings allocated to a flight"
    roles: [CapacityController, ForwarderAgent, RampOperator, DGInspector, CustomsOfficer, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Booking[]"
    side_effects: []

  - method: GET
    path: "/cargo/flights/{id}/build-up-plans"
    description: "List build-up plans for a flight"
    roles: [CapacityController, ForwarderAgent, RampOperator, DGInspector, CustomsOfficer, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "BuildUpPlan[]"
    side_effects: []

  # --- Booking ---
  - method: POST
    path: "/cargo/bookings"
    description: "Create a booking on a flight (status REQUESTED)"
    roles: [ForwarderAgent]
    code: 201
    input: [flight_id, shipper_ref, commodity_code, pieces, gross_weight_kg, volume_m3, "is_dangerous_goods?", "temp_min_c?", "temp_max_c?", "declared_value?"]
    output: Booking
    side_effects: ["chargeable_weight_kg computed; created_by_user_id = X-User-ID; status = REQUESTED; temp_status = NOT_MONITORED or IN_RANGE-pending (NOT_MONITORED when no range)"]

  - method: GET
    path: "/cargo/bookings/{id}"
    description: "Get one booking"
    roles: [CapacityController, ForwarderAgent, RampOperator, DGInspector, CustomsOfficer, ClaimsAdjuster]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: POST
    path: "/cargo/bookings/{id}/accept"
    description: "Accept a REQUESTED booking, debiting flight capacity"
    roles: [CapacityController]
    code: 200
    input: []
    output: Booking
    side_effects: ["status -> ACCEPTED; flight allocation debited (Flight.version increments)"]

  - method: POST
    path: "/cargo/bookings/{id}/reject"
    description: "Reject a REQUESTED booking"
    roles: [CapacityController]
    code: 200
    input: ["reason?"]
    output: Booking
    side_effects: ["status -> REJECTED"]

  - method: POST
    path: "/cargo/bookings/{id}/cancel"
    description: "Cancel a REQUESTED or ACCEPTED booking (owner only); releases allocation when ACCEPTED"
    roles: [ForwarderAgent]
    code: 200
    input: []
    output: Booking
    side_effects: ["status -> CANCELLED; allocation released when cancelling from ACCEPTED"]

  - method: POST
    path: "/cargo/bookings/{id}/rebook"
    description: "Rebook an OFFLOADED booking onto another OPEN_FOR_BOOKING flight"
    roles: [CapacityController]
    code: 200
    input: [flight_id]
    output: Booking
    side_effects: ["status -> ACCEPTED; flight_id updated; target flight allocation debited"]

  - method: GET
    path: "/cargo/bookings/{id}/dg-declarations"
    description: "List DG declarations for a booking"
    roles: [CapacityController, ForwarderAgent, RampOperator, DGInspector, CustomsOfficer, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: "DGDeclaration[]"
    side_effects: []

  - method: POST
    path: "/cargo/bookings/{id}/dg-declarations"
    description: "File a dangerous-goods declaration for an is_dangerous_goods booking (PENDING_CHECK)"
    roles: [ForwarderAgent]
    code: 201
    input: [un_number, dg_class, packing_group, declaration_doc_ref]
    output: DGDeclaration
    side_effects: ["status = PENDING_CHECK"]

  - method: GET
    path: "/cargo/bookings/{id}/temperature-logs"
    description: "List temperature logs for a booking"
    roles: [CapacityController, ForwarderAgent, RampOperator, DGInspector, CustomsOfficer, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: "TemperatureLog[]"
    side_effects: []

  - method: POST
    path: "/cargo/bookings/{id}/temperature-logs"
    description: "Record a temperature reading; runs temperature_excursion_check"
    roles: [RampOperator]
    code: 201
    input: [recorded_at, temperature_c]
    output: TemperatureLog
    side_effects: ["in_range computed; temp_excursion_count / temp_status updated on excursion"]

  - method: GET
    path: "/cargo/bookings/{id}/customs-holds"
    description: "List customs holds for a booking"
    roles: [CapacityController, ForwarderAgent, RampOperator, DGInspector, CustomsOfficer, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: "CustomsHold[]"
    side_effects: []

  - method: POST
    path: "/cargo/bookings/{id}/customs-holds"
    description: "Place a customs hold on a booking (ACTIVE); at most one ACTIVE hold per booking"
    roles: [CustomsOfficer]
    code: 201
    input: [reason_code]
    output: CustomsHold
    side_effects: ["status = ACTIVE; placed_at = current logical clock"]

  - method: GET
    path: "/cargo/bookings/{id}/claims"
    description: "List claims filed against a booking"
    roles: [CapacityController, ForwarderAgent, RampOperator, DGInspector, CustomsOfficer, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: "Claim[]"
    side_effects: []

  # --- ULDType ---
  - method: POST
    path: "/cargo/uld-types"
    description: "Register a ULD type (configuration)"
    roles: [RampOperator]
    code: 201
    input: [type_code, tare_weight_kg, max_gross_weight_kg, internal_volume_m3]
    output: ULDType
    side_effects: []

  # --- ULD ---
  - method: POST
    path: "/cargo/ulds"
    description: "Register a ULD unit (status SERVICEABLE)"
    roles: [RampOperator]
    code: 201
    input: [uld_code, uld_type_id]
    output: ULD
    side_effects: ["status = SERVICEABLE"]

  - method: GET
    path: "/cargo/ulds"
    description: "List ULDs, optionally filtered by status and/or uld_type_id"
    roles: [CapacityController, ForwarderAgent, RampOperator, DGInspector, CustomsOfficer, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?", "status?", "uld_type_id?"]
    output: "ULD[]"
    side_effects: []

  - method: GET
    path: "/cargo/ulds/{id}"
    description: "Get one ULD"
    roles: [CapacityController, ForwarderAgent, RampOperator, DGInspector, CustomsOfficer, ClaimsAdjuster]
    code: 200
    input: []
    output: ULD
    side_effects: []

  - method: POST
    path: "/cargo/ulds/{id}/return"
    description: "Return a DISPATCHED ULD; finalizes demurrage at the current logical clock"
    roles: [RampOperator]
    code: 200
    input: []
    output: ULD
    side_effects: ["status -> RETURNED; returned_at = clock; PROVISIONAL DEMURRAGE charge finalized"]

  - method: POST
    path: "/cargo/ulds/{id}/report-damage"
    description: "Report damage on a RETURNED ULD; creates a PROVISIONAL REPAIR charge"
    roles: [RampOperator]
    code: 200
    input: [damage_description, repair_cost_estimate]
    output: ULD
    side_effects: ["status -> DAMAGE_REPORTED; REPAIR charge created PROVISIONAL with amount = repair_cost_estimate"]

  - method: POST
    path: "/cargo/ulds/{id}/complete-repair"
    description: "Complete repair on a DAMAGE_REPORTED ULD; finalizes the REPAIR charge"
    roles: [RampOperator]
    code: 200
    input: [final_repair_cost]
    output: ULD
    side_effects: ["status -> SERVICEABLE; REPAIR charge FINALIZED with amount = final_repair_cost"]

  - method: POST
    path: "/cargo/ulds/{id}/release"
    description: "Release an undamaged RETURNED ULD back to SERVICEABLE"
    roles: [RampOperator]
    code: 200
    input: []
    output: ULD
    side_effects: ["status -> SERVICEABLE"]

  - method: GET
    path: "/cargo/ulds/{id}/build-up-plans"
    description: "List build-up plans that used a ULD"
    roles: [CapacityController, ForwarderAgent, RampOperator, DGInspector, CustomsOfficer, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: "BuildUpPlan[]"
    side_effects: []

  - method: GET
    path: "/cargo/ulds/{id}/charges"
    description: "List charges for a ULD, optionally filtered by charge_type/status"
    roles: [CapacityController, ForwarderAgent, RampOperator, DGInspector, CustomsOfficer, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?", "charge_type?", "status?"]
    output: "ULDCharge[]"
    side_effects: []

  # --- BuildUpPlan ---
  - method: POST
    path: "/cargo/build-up-plans"
    description: "Create a build-up plan (flight x ULD with a build window); OCC-guarded on Flight.version"
    roles: [RampOperator]
    code: 201
    input: [flight_id, uld_id, build_start, build_end, expected_flight_version]
    output: BuildUpPlan
    side_effects: ["status = DRAFT; ULD SERVICEABLE -> ASSIGNED; flight.reserved_positions += 1; increments Flight.version by 1"]

  - method: GET
    path: "/cargo/build-up-plans/{id}"
    description: "Get one build-up plan"
    roles: [CapacityController, ForwarderAgent, RampOperator, DGInspector, CustomsOfficer, ClaimsAdjuster]
    code: 200
    input: []
    output: BuildUpPlan
    side_effects: []

  - method: GET
    path: "/cargo/build-up-plans/{id}/bookings"
    description: "List bookings currently built into a plan"
    roles: [CapacityController, ForwarderAgent, RampOperator, DGInspector, CustomsOfficer, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: "Booking[]"
    side_effects: []

  - method: POST
    path: "/cargo/build-up-plans/{id}/assign"
    description: "Assign an ACCEPTED booking to a DRAFT plan; OCC-guarded on BuildUpPlan.version"
    roles: [RampOperator]
    code: 200
    input: [booking_id, expected_build_up_plan_version]
    output: BuildUpPlan
    side_effects: ["booking ACCEPTED -> BUILT_UP (build_up_plan_id set); plan.total_weight_kg recomputed; increments BuildUpPlan.version by 1"]

  - method: POST
    path: "/cargo/build-up-plans/{id}/seal"
    description: "Seal a DRAFT plan that contains at least one booking"
    roles: [RampOperator]
    code: 200
    input: []
    output: BuildUpPlan
    side_effects: ["status -> SEALED"]

  - method: POST
    path: "/cargo/build-up-plans/{id}/cancel"
    description: "Cancel a DRAFT or SEALED plan; built bookings return to ACCEPTED and the ULD is released"
    roles: [RampOperator]
    code: 200
    input: []
    output: BuildUpPlan
    side_effects: ["status -> CANCELLED; bookings BUILT_UP -> ACCEPTED; ULD ASSIGNED -> SERVICEABLE; flight.reserved_positions -= 1"]

  # --- DGDeclaration ---
  - method: POST
    path: "/cargo/dg-declarations/{id}/accept"
    description: "Accept a PENDING_CHECK DG declaration (checker must differ from booking creator)"
    roles: [DGInspector]
    code: 200
    input: []
    output: DGDeclaration
    side_effects: ["status -> ACCEPTED; checked_by_user_id recorded"]

  - method: POST
    path: "/cargo/dg-declarations/{id}/reject"
    description: "Reject a PENDING_CHECK DG declaration (checker must differ from booking creator)"
    roles: [DGInspector]
    code: 200
    input: [rejection_reason]
    output: DGDeclaration
    side_effects: ["status -> REJECTED; checked_by_user_id + rejection_reason recorded"]

  # --- CustomsHold ---
  - method: POST
    path: "/cargo/customs-holds/{id}/release"
    description: "Release an ACTIVE customs hold"
    roles: [CustomsOfficer]
    code: 200
    input: ["release_note?"]
    output: CustomsHold
    side_effects: ["status -> RELEASED; released_at = current logical clock"]

  # --- Claim ---
  - method: POST
    path: "/cargo/claims"
    description: "File a damage/loss claim against a LOADED booking (owner only)"
    roles: [ForwarderAgent]
    code: 201
    input: [booking_id, claim_type, claimed_amount, items, "description?"]
    output: Claim
    side_effects: ["status = SUBMITTED"]

  - method: GET
    path: "/cargo/claims/{id}"
    description: "Get one claim"
    roles: [CapacityController, ForwarderAgent, RampOperator, DGInspector, CustomsOfficer, ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/cargo/claims/{id}/approve"
    description: "Approve a SUBMITTED claim; runs claim_settlement_calculation"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["status -> APPROVED; item_total, basis, approved_amount computed"]

  - method: POST
    path: "/cargo/claims/{id}/reject"
    description: "Reject a SUBMITTED claim"
    roles: [ClaimsAdjuster]
    code: 200
    input: [reason]
    output: Claim
    side_effects: ["status -> REJECTED"]

  - method: POST
    path: "/cargo/claims/{id}/settle"
    description: "Settle an APPROVED claim with a payment reference"
    roles: [ClaimsAdjuster]
    code: 200
    input: [settlement_ref]
    output: Claim
    side_effects: ["status -> SETTLED; settlement_ref recorded"]

  # --- ULDCharge ---
  - method: GET
    path: "/cargo/uld-charges/{id}"
    description: "Get one ULD charge"
    roles: [CapacityController, ForwarderAgent, RampOperator, DGInspector, CustomsOfficer, ClaimsAdjuster]
    code: 200
    input: []
    output: ULDCharge
    side_effects: []

  # --- Logical clock (test-driving endpoint) ---
  - method: POST
    path: "/cargo/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any set call the clock reads exactly 2026-08-01T00:00:00Z (server startup default; it never falls back to wall-clock time)."
    roles: [CapacityController, ForwarderAgent, RampOperator, DGInspector, CustomsOfficer, ClaimsAdjuster]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced; all subsequent system timestamps use it"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not in the endpoint's declared roles" }
  - { id: ERR_BOOKING_NOT_OWNED, http: 403, condition: "ForwarderAgent acts on a booking whose created_by_user_id != X-User-ID" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "DG accept/reject attempted by the same X-User-ID that created the booking" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body resource reference does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid field, bad enum, non-positive quantity, inverted range/window, empty items" }
  - { id: ERR_FLIGHT_NOT_OPEN, http: 409, condition: "Operation requires flight OPEN_FOR_BOOKING (open/close/accept/rebook/plan-create) or OPEN_FOR_BOOKING|CLOSED (weight-restriction)" }
  - { id: ERR_FLIGHT_NOT_CLOSED, http: 409, condition: "Depart requires flight CLOSED" }
  - { id: ERR_DRAFT_PLANS_EXIST, http: 409, condition: "Close attempted while a BuildUpPlan on the flight is DRAFT" }
  - { id: ERR_BOOKING_NOT_ACCEPTED, http: 409, condition: "Assign requires the booking to be ACCEPTED" }
  - { id: ERR_BOOKING_INVALID_STATE, http: 409, condition: "Booking not in the state required by the operation (accept/reject need REQUESTED; cancel needs REQUESTED|ACCEPTED; rebook needs OFFLOADED; claim needs LOADED; DG-declare/hold need REQUESTED|ACCEPTED|BUILT_UP; temp-log needs ACCEPTED|BUILT_UP|LOADED)" }
  - { id: ERR_PLAN_NOT_DRAFT, http: 409, condition: "Assign/seal requires plan DRAFT" }
  - { id: ERR_PLAN_NOT_CANCELLABLE, http: 409, condition: "Cancel requires plan DRAFT or SEALED" }
  - { id: ERR_PLAN_EMPTY, http: 409, condition: "Seal requires at least one BUILT_UP booking on the plan" }
  - { id: ERR_ULD_NOT_SERVICEABLE, http: 409, condition: "Plan creation requires ULD SERVICEABLE" }
  - { id: ERR_ULD_INVALID_STATE, http: 409, condition: "Return requires DISPATCHED; report-damage/release require RETURNED; complete-repair requires DAMAGE_REPORTED" }
  - { id: ERR_DG_NOT_PENDING, http: 409, condition: "DG accept/reject requires declaration PENDING_CHECK" }
  - { id: ERR_DG_CHECK_ALREADY_PENDING, http: 409, condition: "A PENDING_CHECK declaration already exists for the booking" }
  - { id: ERR_HOLD_NOT_ACTIVE, http: 409, condition: "Release requires hold ACTIVE" }
  - { id: ERR_HOLD_ALREADY_ACTIVE, http: 409, condition: "An ACTIVE customs hold already exists for the booking" }
  - { id: ERR_CLAIM_NOT_SUBMITTED, http: 409, condition: "Approve/reject requires claim SUBMITTED" }
  - { id: ERR_CLAIM_NOT_APPROVED, http: 409, condition: "Settle requires claim APPROVED" }
  - { id: ERR_FLIGHT_NOT_DG_CERTIFIED, http: 409, condition: "Dangerous-goods booking accepted/rebooked onto a non-dg_certified flight" }
  - { id: ERR_CUSTOMS_HOLD_ACTIVE, http: 409, condition: "Assign blocked by an ACTIVE customs hold on the booking" }
  - { id: ERR_DG_NOT_ACCEPTED, http: 409, condition: "Assign of a dangerous-goods booking without an ACCEPTED DGDeclaration" }
  - { id: ERR_DG_NOT_APPLICABLE, http: 422, condition: "DG declaration filed on a booking with is_dangerous_goods == false" }
  - { id: ERR_BUILD_WINDOW_CONFLICT, http: 409, condition: "Build window on the same flight violates the 30-minute separation buffer with another DRAFT/SEALED plan" }
  - { id: ERR_DUPLICATE_ULD_CODE, http: 409, condition: "uld_code (or type_code) already exists" }
  - { id: ERR_ULD_PAYLOAD_EXCEEDED, http: 422, condition: "tare + plan total + candidate gross would exceed uld_type.max_gross_weight_kg (strictly greater)" }
  - { id: ERR_ULD_POSITION_UNAVAILABLE, http: 422, condition: "Flight has no free ULD position (reserved_positions == uld_position_count)" }
  - { id: ERR_FLIGHT_PAYLOAD_EXCEEDED, http: 422, condition: "Accept/rebook would push allocated_weight_kg strictly above max_payload_kg" }
  - { id: ERR_FLIGHT_VOLUME_EXCEEDED, http: 422, condition: "Accept/rebook would push allocated_volume_m3 strictly above max_volume_m3" }
  - { id: ERR_BOOKING_FLIGHT_MISMATCH, http: 422, condition: "Assign: booking.flight_id != plan.flight_id" }
  - { id: ERR_TEMP_RANGE_NOT_DEFINED, http: 422, condition: "Temperature log on a booking without temp_min_c/temp_max_c" }
  - { id: ERR_STALE_FLIGHT_VERSION, http: 412, condition: "expected_flight_version does not match the flight's current version (OCC)" }
  - { id: ERR_STALE_PLAN_VERSION, http: 412, condition: "expected_build_up_plan_version does not match the plan's current version (OCC)" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: CapacityController
    description: "Airline capacity/revenue controller: manages flights, accepts/rejects/rebooks bookings, imposes weight restrictions"
    identity: opaque
    exclusive_operations: ["flight create/open/close/depart/weight-restriction", "booking accept/reject/rebook"]
    shared_operations: ["all GET list/detail endpoints", "POST /cargo/_clock/set_current_utc"]

  - name: ForwarderAgent
    description: "Freight forwarder: creates and cancels own bookings, files DG declarations and claims for own bookings"
    identity: opaque
    exclusive_operations: ["booking create/cancel", "DG declaration create", "claim create"]
    shared_operations: ["all GET list/detail endpoints", "POST /cargo/_clock/set_current_utc"]

  - name: RampOperator
    description: "Ramp/warehouse operator: manages ULD types and units, build-up plans and assignment, temperature logging, ULD return/damage/repair"
    identity: opaque
    exclusive_operations: ["ULD type + unit management", "build-up plan create/assign/seal/cancel", "temperature log create", "ULD return/report-damage/complete-repair/release"]
    shared_operations: ["all GET list/detail endpoints", "POST /cargo/_clock/set_current_utc"]

  - name: DGInspector
    description: "Dangerous-goods acceptance inspector: accepts or rejects DG declarations; may never check a booking they themselves created"
    identity: opaque
    exclusive_operations: ["DG declaration accept/reject"]
    shared_operations: ["all GET list/detail endpoints", "POST /cargo/_clock/set_current_utc"]

  - name: CustomsOfficer
    description: "Customs liaison: places and releases customs holds on bookings"
    identity: opaque
    exclusive_operations: ["customs hold create/release"]
    shared_operations: ["all GET list/detail endpoints", "POST /cargo/_clock/set_current_utc"]

  - name: ClaimsAdjuster
    description: "Claims adjudicator: approves/rejects/settles damage and loss claims"
    identity: opaque
    exclusive_operations: ["claim approve/reject/settle"]
    shared_operations: ["all GET list/detail endpoints", "POST /cargo/_clock/set_current_utc"]
