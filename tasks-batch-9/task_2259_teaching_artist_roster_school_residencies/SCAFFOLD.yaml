    code: 201
    input: [name, district_name, grade_span, concurrent_session_capacity, total_enrollment, frl_pct, ell_pct, iep_pct]
    output: SchoolPartner
    side_effects: ["partnership_health := HEALTHY", "open_residency_count := 0"]

  - method: GET
    path: "/school-partners/{id}"
    description: "Read a school partner including its computed partnership_health"
    roles: [ProgramDirector, RosterCoordinator, CurriculumSpecialist, TeachingArtist, SchoolLiaison, FiscalOfficer]
    code: 200
    input: []
    output: SchoolPartner
    side_effects: []

  # --- CalendarBlackout --------------------------------------------------
  - method: POST
    path: "/school-partners/{id}/calendar-blackouts"
    description: "Add a closed-interval blackout window to a school calendar"
    roles: [RosterCoordinator, SchoolLiaison]
    code: 201
    input: [blackout_type, start_date, "end_date", "note?"]
    output: CalendarBlackout
    side_effects: ["Existing sessions are NOT retroactively cancelled; the blackout is enforced on POST /sessions and POST /sessions/{id}/confirm"]

  - method: GET
    path: "/school-partners/{id}/calendar-blackouts"
    description: "List the blackout windows of a school (reverse-reachability for CalendarBlackout.school_partner_id)"
    roles: [ProgramDirector, RosterCoordinator, CurriculumSpecialist, TeachingArtist, SchoolLiaison, FiscalOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: CalendarBlackout[]
    side_effects: []

  # --- TeachingArtist ----------------------------------------------------
  - method: POST
    path: "/teaching-artists"
    description: "Intake a teaching artist applicant with discipline, grade-band and language capability tags"
    roles: [RosterCoordinator]
    code: 201
    input: [full_name, email, primary_discipline, "secondary_disciplines?", grade_bands, languages, "roster_tier_assigned?"]
    output: TeachingArtist
    side_effects: ["vetting_status := APPLIED", "roster_status := NOT_LISTED", "roster_tier_effective := roster_tier_assigned", "reliability_bps_rolling := 10000, reliability_bps_program_year := 10000"]

  - method: GET
    path: "/teaching-artists/{id}"
    description: "Read a teaching artist including both state axes and all computed roster metrics"
    roles: [ProgramDirector, RosterCoordinator, CurriculumSpecialist, TeachingArtist, SchoolLiaison, FiscalOfficer]
    code: 200
    input: []
    output: TeachingArtist
    side_effects: []

  - method: GET
    path: "/teaching-artists"
