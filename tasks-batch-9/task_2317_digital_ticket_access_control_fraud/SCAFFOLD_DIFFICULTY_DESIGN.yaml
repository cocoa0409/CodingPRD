              captures: { ada_credit: $.data.remediation_credit_cents, ada_strikes: $.data.strike_count, ada_score: $.data.fraud_risk_score, ada_basis: $.data.fraud_risk_basis }
          assert:
            - "${err_mismatch} == ERR_DEVICE_MISMATCH and ${inc_status_review} == UNDER_REVIEW"
            - "${pool_before} == 26000 (14000 + 12000 of paid face value)"
            - "${credit} == 15600 and ${inc_status_final} == REMEDIATED"
            - "${pool_after} == 10400 and ${ada_credit} == 15600"
            - "INVARIANT: ${pool_after} + ${ada_credit} == 26000 == ${pool_before} — remediation moved money, it did not mint any"
            - "Patron.${p_ben_id}.remediation_credit_cents == 0 — no other patron ledger moved"
            - "${ada_strikes} == 1 — the strike is deliberately NOT compensated away by the payout"
            - "${ada_score} == 23 and ${ada_basis} == ADJUDICATED — REMEDIATED weight 50 percent of DEVICE_MISMATCH 45, rounded half up"
            - "Ticket.${t_a_id}.admission_status is still DENIED_FLAGGED and admitted_scan_count == 0 — the credit does not admit anyone"

      - name: voiding_a_credential_ticket_restores_counts_but_not_the_forgone_ledger
        grounds:
          - state_machines.CredentialRequest.SUBMITTED_to_APPROVED
          - state_machines.Ticket.ISSUED_to_VOIDED
          - calculations.credential_forgone_revenue
          - entities.AccessZone.fields.issued_entitlement_count
          - entities.AccessZone.fields.comp_forgone_cents
          - entities.Event.fields.entitlements_outstanding
        distinguishing_aspect: |
          Two derived quantities behave in opposite ways under the same void.
          AccessZone.issued_entitlement_count and Event.entitlements_outstanding are live
          counts and must both fall from 2 to 1, while AccessZone.comp_forgone_cents is a
          one-way ledger of revenue already given away and must stay at 2626. And because
          refund_to_holder is false and a credential ticket has face_value_cents 0, no cash
          moves at all: the pool stays 0 and the holder's credit stays 0.
        test_recipe:
          setup:
            - "Event ON_SALE; AccessZone CREW with required_entitlement_level BACK_OF_HOUSE, fire_code_capacity 100, credential_capacity 8, face_value_reference_cents 8750, comp_discount_pct 0.85."
            - "Ada verified, the credential recipient."
            - "One SUBMITTED CredentialRequest of distribution_type CREDENTIAL, quantity 2, window 2026-09-12T18:00:00Z to 2026-09-12T23:00:00Z, drafted by boa-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
                price_cap_regime: "VENUE_POLICY"
                transfer_limit_per_ticket: 2
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/access-zones"
              payload:
                zone_code: "CREW"
                required_entitlement_level: "BACK_OF_HOUSE"
                fire_code_capacity: 100
                face_value_reference_cents: 8750
                credential_capacity: 8
                comp_discount_pct: 0.85
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { z_crew_id: $.data.id }
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "ON_SALE" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /patrons"
              payload: { email: "ada@example.com", display_name: "Ada Lovelace" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { p_ada_id: $.data.id }
            - call: "POST /patrons/${p_ada_id}/verify-identity"
              payload: { document_reference: "DL-ADA-1" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
            - call: "POST /credential-requests"
              payload:
                event_id: "${ev_id}"
                access_zone_id: "${z_crew_id}"
                recipient_patron_id: "${p_ada_id}"
                distribution_type: "CREDENTIAL"
                quantity: 2
                valid_from: "2026-09-12T18:00:00Z"
                valid_until: "2026-09-12T23:00:00Z"
                justification: "Two audio techs"
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { cr_id: $.data.id }
            - call: "POST /credential-requests/${cr_id}/submit"
              as: BoxOfficeAgent
              as_user_id: "boa-1"
            - call: "POST /credential-requests/${cr_id}/approve"
              payload: { note: "Audio crew approved" }
              as: TicketingApprover
              as_user_id: "appr-1"
              captures: { cr_issued: $.data.issued_ticket_count, cr_forgone: $.data.forgone_revenue_cents }
            - call: "GET /tickets?credential_request_id=${cr_id}"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ct1_id: "$.data[0].id", ct_total: $.meta.total_count }
            - call: "GET /access-zones/${z_crew_id}"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { z_issued_before: $.data.issued_entitlement_count, z_forgone_before: $.data.comp_forgone_cents }
            - call: "GET /events/${ev_id}"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { outstanding_before: $.data.entitlements_outstanding, pool_before: $.data.settlement_pool_cents }
          trigger:
            - call: "POST /tickets/${ct1_id}/void"
              payload: { reason: "Tech left the tour; credential surrendered", refund_to_holder: false }
              as: SecurityInvestigator
              as_user_id: "sec-1"
              captures: { void_life: $.data.lifecycle_status, void_face: $.data.face_value_cents }
            - call: "GET /access-zones/${z_crew_id}"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { z_issued_after: $.data.issued_entitlement_count, z_forgone_after: $.data.comp_forgone_cents, z_posture_after: $.data.posture }
            - call: "GET /events/${ev_id}"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { outstanding_after: $.data.entitlements_outstanding, pool_after: $.data.settlement_pool_cents }
          assert:
            - "${cr_issued} == 2, ${cr_forgone} == 2626 (1313 per ticket, times 2), ${ct_total} == 2"
            - "${z_issued_before} == 2, ${z_forgone_before} == 2626, ${outstanding_before} == 2, ${pool_before} == 0"
            - "${void_life} == VOIDED and ${void_face} == 0"
            - "${z_issued_after} == 1 and ${outstanding_after} == 1 — both live counts are compensated"
            - "${z_forgone_after} == 2626 — the forgone-revenue ledger is one-way and is NOT compensated"
            - "CredentialRequest.${cr_id}.issued_ticket_count is still 2 and forgone_revenue_cents is still 2626 — the request records what it granted, not what survives"
            - "${pool_after} == 0 and Patron.${p_ada_id}.remediation_credit_cents == 0 — refund_to_holder false on a zero-face ticket moves nothing"
            - "${z_posture_after} == OPEN and GET /tickets?credential_request_id=${cr_id}&lifecycle_status=ISSUED has total_count == 1"
            - "GET /events/${ev_id}/audit-log-entries?subject_type=Ticket has total_count == 1 with action == TICKET_VOIDED"
