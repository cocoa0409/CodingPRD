        grounds:
          - "errors[ERR_ZONE_AUDIT_HOLD]"
          - "validations[priority=6]"
          - "state_machines.Zone.NORMAL_to_AUDIT_HOLD"
        distinguishing_aspect: "Once the reconciliation breach puts the zone in AUDIT_HOLD, a subsequent admission submit fails with ERR_ZONE_AUDIT_HOLD (409) — the posture gates child operations."
        test_recipe:
          setup: ["Zone; admission A1 (qty 5, unit 1000, HTS 0401.10, NPF) ADMITTED; reconciliation 2026 (beginning 0, physical 1000: book 5000, discrepancy -4000 -> 80.0 pct) SUBMITTED -> zone in AUDIT_HOLD; admission A2 created"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Hold Zone", zone_code: "Z-HLD", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Dairy", hts_code: "0401.10", quantity: 5, unit_value_cents: 1000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a1: "$.data.id" }
            - call: "POST /zones/admissions/${a1}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a1}/admit"
              as: CustomsOfficer
            - call: "GET /zones/${z}"
              as: ZoneOperator
              captures: { zv: "$.data.version" }
            - call: "POST /zones/annual-reconciliations"
              payload: { zone_id: "${z}", zone_year: 2026, beginning_value_cents: 0, physical_ending_value_cents: 1000, expected_zone_version: "${zv}" }
              as: ZoneOperator
              captures: { r: "$.data.id" }
            - call: "POST /zones/annual-reconciliations/${r}/submit"
              as: ZoneOperator
              captures: { fl: "$.data.audit_flagged" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "More dairy", hts_code: "0401.10", quantity: 2, unit_value_cents: 1000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a2: "$.data.id" }
          trigger:
            - call: "POST /zones/admissions/${a2}/submit"
              as: Importer
              as_user_id: "imp-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "setup sanity: AnnualReconciliation.${r}.audit_flagged == true"
            - "error_id == ERR_ZONE_AUDIT_HOLD (http 409) — posture gates the submit"
            - "Admission.${a2}.status remains DRAFT"

      - name: c_zone_not_found_returns_404
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_ZONE_NOT_FOUND]"
          - "validations[priority=3]"
        distinguishing_aspect: "A body FK to a nonexistent zone fails priority-3 existence with ERR_ZONE_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /zones/admissions"
              payload: { zone_id: "00000000-0000-4000-8000-0000000000ff", description: "Nowhere", hts_code: "0401.10", quantity: 1, unit_value_cents: 100, zone_status: "DOMESTIC" }
              as: Importer
              as_user_id: "imp-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_ZONE_NOT_FOUND (http 404)"

      - name: c_withdrawal_on_depleted_lot_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_LOT_NOT_IN_ZONE]"
          - "state_machines.Withdrawal.DRAFT_to_FILED"
        distinguishing_aspect: "Filing a withdrawal whose lot has since become DEPLETED fails with ERR_LOT_NOT_IN_ZONE (409)."
        test_recipe:
          setup: ["Zone; lot (qty 5, unit 1000, HTS 0401.10, NPF); W1 (qty 5) created; W2 (qty 1) created while the lot is still IN_ZONE; W1 then FILED, depleting the lot"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Depleted Zone", zone_code: "Z-DPL", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Dairy", hts_code: "0401.10", quantity: 5, unit_value_cents: 1000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a: "$.data.id" }
            - call: "POST /zones/admissions/${a}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a}/admit"
              as: CustomsOfficer
            - call: "GET /zones/lots?admission_id=${a}"
              as: ZoneOperator
              captures: { lot: "$.data[0].id" }
            - call: "POST /zones/withdrawals"
              payload: { zone_id: "${z}", lot_id: "${lot}", withdrawal_type: "EXPORT", quantity: 5 }
              as: Importer
              as_user_id: "imp-1"
              captures: { w1: "$.data.id" }
            - call: "POST /zones/withdrawals"
              payload: { zone_id: "${z}", lot_id: "${lot}", withdrawal_type: "EXPORT", quantity: 1 }
              as: Importer
              as_user_id: "imp-1"
              captures: { w2: "$.data.id" }
            - call: "POST /zones/withdrawals/${w1}/file"
              as: Importer
              as_user_id: "imp-1"
          trigger:
            - call: "POST /zones/withdrawals/${w2}/file"
              as: Importer
              as_user_id: "imp-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_LOT_NOT_IN_ZONE (http 409) — the lot went DEPLETED when W1 filed"
            - "Withdrawal.${w2}.status remains DRAFT"

      - name: c_complete_unapproved_order_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_ORDER_INVALID_TRANSITION]"
          - "state_machines.ManipulationOrder.APPROVED_to_COMPLETED"
        distinguishing_aspect: "Completing a REQUESTED (never approved) manipulation order fails with ERR_ORDER_INVALID_TRANSITION (409); the lot is untouched."
        test_recipe:
          setup: ["Zone; lot (qty 100, unit 10000, HTS 8542.31, NPF); manipulation order created, left REQUESTED"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Order Zone", zone_code: "Z-ORD", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Processors", hts_code: "8542.31", quantity: 100, unit_value_cents: 10000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a: "$.data.id" }
            - call: "POST /zones/admissions/${a}/submit"
              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions/${a}/admit"
              as: CustomsOfficer
            - call: "GET /zones/lots?admission_id=${a}"
              as: ZoneOperator
              captures: { lot: "$.data[0].id" }
            - call: "POST /zones/manipulation-orders"
              payload: { zone_id: "${z}", source_lot_id: "${lot}", input_quantity: 10, output_hts_code: "9503.00", output_quantity: 5, value_added_cents: 10000, output_description: "Kitting" }
              as: Importer
              as_user_id: "imp-1"
              captures: { m: "$.data.id" }
          trigger:
            - call: "POST /zones/manipulation-orders/${m}/complete"
              as: Importer
              as_user_id: "imp-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_ORDER_INVALID_TRANSITION (http 409); InventoryLot.${lot}.quantity_on_hand remains 100"

      - name: c_accept_draft_recon_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_RECONCILIATION_INVALID_TRANSITION]"
          - "state_machines.AnnualReconciliation.SUBMITTED_to_ACCEPTED"
        distinguishing_aspect: "Accepting a DRAFT (never submitted) reconciliation fails with ERR_RECONCILIATION_INVALID_TRANSITION (409)."
        test_recipe:
          setup: ["Zone; reconciliation created (DRAFT)"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Draft Recon Zone", zone_code: "Z-DR", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: $.data.id, zv: "$.data.version" }
            - call: "POST /zones/annual-reconciliations"
              payload: { zone_id: "${z}", zone_year: 2026, beginning_value_cents: 0, physical_ending_value_cents: 0, expected_zone_version: "${zv}" }
              as: ZoneOperator
              captures: { r: "$.data.id" }
          trigger:
            - call: "POST /zones/annual-reconciliations/${r}/accept"
              as: CustomsOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_RECONCILIATION_INVALID_TRANSITION (http 409); AnnualReconciliation.${r}.status remains DRAFT"

  # =================================================================
  - section: rbac
    instances:
      - name: c_importer_cannot_admit
        claim_type: rbac_denial
        grounds:
          - "roles[1]"
          - "validations[priority=2]"
          - "errors[ERR_INSUFFICIENT_PERMISSIONS]"
        distinguishing_aspect: "admit is CustomsOfficer-exclusive: an Importer (even the resource owner) gets ERR_INSUFFICIENT_PERMISSIONS (403)."
        test_recipe:
          setup: ["Zone; admission SUBMITTED by imp-1"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "RBAC Zone 1", zone_code: "Z-R1", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Dairy", hts_code: "0401.10", quantity: 5, unit_value_cents: 1000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a: "$.data.id" }
            - call: "POST /zones/admissions/${a}/submit"
              as: Importer
              as_user_id: "imp-1"
          trigger:
            - call: "POST /zones/admissions/${a}/admit"
              as: Importer
              as_user_id: "imp-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS (http 403); Admission.${a}.status remains SUBMITTED"

      - name: c_officer_cannot_create_zone
        claim_type: rbac_denial
        grounds:
          - "roles[2]"
          - "validations[priority=2]"
        distinguishing_aspect: "POST /zones is ZoneOperator-exclusive: CustomsOfficer gets ERR_INSUFFICIENT_PERMISSIONS (403)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /zones"
              payload: { name: "Officer Zone", zone_code: "Z-OFF", bond_coverage_cents: 1000 }
              as: CustomsOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS (http 403)"

      - name: c_gate_officer_cannot_issue_badge
        claim_type: rbac_denial
        grounds:
          - "roles[3]"
          - "validations[priority=2]"
        distinguishing_aspect: "Badge issuance is ZoneOperator-exclusive: GateOfficer gets ERR_INSUFFICIENT_PERMISSIONS (403) even with a valid zone."
        test_recipe:
          setup: ["Zone"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "RBAC Badge Zone", zone_code: "Z-RB", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
          trigger:
            - call: "POST /zones/access-badges"
              payload: { zone_id: "${z}", holder_name: "Gate Keeper", valid_from: "2026-08-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: GateOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS (http 403)"

      - name: c_officer_cannot_file_weekly_entry
        claim_type: rbac_denial
        grounds:
          - "roles[1]"
          - "roles[2]"
          - "validations[priority=2]"
        distinguishing_aspect: "Entry filing is Importer-exclusive: CustomsOfficer gets ERR_INSUFFICIENT_PERMISSIONS (403)."
        test_recipe:
          setup: ["Zone; OPEN weekly entry created by imp-1"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "RBAC Entry Zone", zone_code: "Z-RE", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/weekly-entries"
              payload: { zone_id: "${z}", week_start_date: "2026-07-27T00:00:00Z" }
              as: Importer
              as_user_id: "imp-1"
              captures: { e: "$.data.id" }
          trigger:
            - call: "POST /zones/weekly-entries/${e}/file"
              as: CustomsOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS (http 403)"

      - name: c_gate_officer_shared_reads
        claim_type: rbac_shared_allowed
        grounds:
          - "roles[3]"
        distinguishing_aspect: "All GET endpoints are shared: GateOfficer can list zones and read a zone (200) despite having no other write surface than access events."
        test_recipe:
          setup: ["Zone"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Shared Zone", zone_code: "Z-SHR", bond_coverage_cents: 1000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
          trigger:
            - call: "GET /zones"
              as: GateOfficer
            - call: "GET /zones/${z}"
              as: GateOfficer
              captures: { zname: "$.data.name" }
          assert:
            - "GET /zones as GateOfficer -> 200 with total_count == 1"
            - "GET /zones/${z} as GateOfficer -> 200, name == \"Shared Zone\""

  # =================================================================
  - section: cross_cutting_layers
    instances:
      - name: c_occ_stale_zone_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[reconciliation-create-stale-zone]"
          - "errors[ERR_STALE_ZONE_VERSION]"
        distinguishing_aspect: "OCC on Zone.version: a reconciliation create carrying the pre-supersede version is rejected 412 ERR_STALE_ZONE_VERSION; the same create with the current version succeeds and supersedes the prior DRAFT."
        test_recipe:
          setup: ["Zone (version 1 after create); reconciliation R1 created with expected_zone_version 1 (zone advances to version 2; R1 DRAFT)"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "OCC Zone", zone_code: "Z-OCC", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: $.data.id, zv1: "$.data.version" }
            - call: "POST /zones/annual-reconciliations"
              payload: { zone_id: "${z}", zone_year: 2026, beginning_value_cents: 0, physical_ending_value_cents: 0, expected_zone_version: "${zv1}" }
              as: ZoneOperator
              captures: { r1: "$.data.id" }
            - call: "GET /zones/${z}"
              as: ZoneOperator
              captures: { zv2: "$.data.version" }
          trigger:
            - call: "POST /zones/annual-reconciliations"
              payload: { zone_id: "${z}", zone_year: 2026, beginning_value_cents: 10, physical_ending_value_cents: 10, expected_zone_version: "${zv1}" }
              as: ZoneOperator
              captures: { err: "$.data.error_id" }
            - call: "POST /zones/annual-reconciliations"
              payload: { zone_id: "${z}", zone_year: 2026, beginning_value_cents: 10, physical_ending_value_cents: 10, expected_zone_version: "${zv2}" }
              as: ZoneOperator
              captures: { r2: "$.data.id" }
            - call: "GET /zones/annual-reconciliations/${r1}"
              as: ZoneOperator
              captures: { r1s: "$.data.status" }
          assert:
            - "stale create (expected_zone_version == the pre-R1 version) -> ERR_STALE_ZONE_VERSION (http 412)"
            - "fresh create succeeds (201): AnnualReconciliation.${r2}.status == DRAFT"
            - "AnnualReconciliation.${r1}.status == SUPERSEDED (create-with-supersede semantics)"

      - name: c_audit_threshold_exact_half_pct
        claim_type: rate_threshold_trigger
        grounds:
          - "calculations.reconciliation_variance"
          - "entities.AnnualReconciliation.fields.audit_flagged"
        distinguishing_aspect: "The audit flag is strictly-greater: discrepancy_pct exactly 0.5 does NOT flag (zone stays NORMAL) while 0.505 flags (zone enters AUDIT_HOLD)."
        test_recipe:
          setup: ["Zone A with no activity: reconciliation beginning 200000, physical 201000 (discrepancy 1000 -> exactly 0.5 pct); Zone B identical but physical 201010 (discrepancy 1010 -> 0.505 pct)"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Half Pct A", zone_code: "Z-HPA", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { za: $.data.id, zva: "$.data.version" }
            - call: "POST /zones/annual-reconciliations"
              payload: { zone_id: "${za}", zone_year: 2026, beginning_value_cents: 200000, physical_ending_value_cents: 201000, expected_zone_version: "${zva}" }
              as: ZoneOperator
              captures: { ra: "$.data.id" }
            - call: "POST /zones"
              payload: { name: "Half Pct B", zone_code: "Z-HPB", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { zb: $.data.id, zvb: "$.data.version" }
            - call: "POST /zones/annual-reconciliations"
              payload: { zone_id: "${zb}", zone_year: 2026, beginning_value_cents: 200000, physical_ending_value_cents: 201010, expected_zone_version: "${zvb}" }
              as: ZoneOperator
              captures: { rb: "$.data.id" }
          trigger:
            - call: "POST /zones/annual-reconciliations/${ra}/submit"
              as: ZoneOperator
              captures: { fla: $.data.audit_flagged, pcta: "$.data.discrepancy_pct" }
            - call: "POST /zones/annual-reconciliations/${rb}/submit"
              as: ZoneOperator
              captures: { flb: $.data.audit_flagged, pctb: "$.data.discrepancy_pct" }
            - call: "GET /zones/${za}"
              as: ZoneOperator
              captures: { posta: "$.data.compliance_posture" }
            - call: "GET /zones/${zb}"
              as: ZoneOperator
              captures: { postb: "$.data.compliance_posture" }
          assert:
            - "Zone A: discrepancy_pct == 0.5 and audit_flagged == false (exactly at threshold does NOT flag); posture remains NORMAL"
            - "Zone B: discrepancy_pct == 0.505 and audit_flagged == true; posture becomes AUDIT_HOLD"

      - name: c_derived_entry_totals_excluded
        claim_type: derived_field_reconciliation
        grounds:
          - "calculations.weekly_entry_settlement"
        excluded_because:
          difficulty_instance: entry_dollar_totals_conservation_on_cancel
          rationale: "Live recompute of entry totals on membership change is asserted by the named §1.8 invariant instance."

      - name: c_dual_variant_layer_excluded
        claim_type: dual_variant_calculation
        grounds:
          - "calculations.duty_assessment"
        excluded_because:
          difficulty_instance: manipulated_duty_pf_vs_npf_variant
          rationale: "Both duty variants and their divergence are asserted by the named §1.8 instance."

  # =================================================================
  - section: consistency_model
    instances:
      - name: c_immediate_visibility_after_admit
        claim_type: immediate_consistency
        grounds:
          - "state_machines.Admission.SUBMITTED_to_ADMITTED"
          - "calculations.deferred_duty_exposure"
        distinguishing_aspect: "Immediate consistency: the very next reads after admit observe the created lot and the updated zone aggregates (exposure 500, count 1) with no lag."
        test_recipe:
          setup: ["Zone; admission (qty 4, unit 2500, HTS 0401.10 rate 0.05, NPF) SUBMITTED"]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Immediate Zone", zone_code: "Z-IMM", bond_coverage_cents: 10000000000 }
              as: ZoneOperator
              captures: { z: "$.data.id" }
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Dairy", hts_code: "0401.10", quantity: 4, unit_value_cents: 2500, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a: "$.data.id" }
            - call: "POST /zones/admissions/${a}/submit"
              as: Importer
              as_user_id: "imp-1"
          trigger:
            - call: "POST /zones/admissions/${a}/admit"
              as: CustomsOfficer
              captures: { ast: "$.data.status" }
            - call: "GET /zones/${z}"
              as: ZoneOperator
              captures: { zexp: $.data.deferred_duty_exposure_cents, zcnt: "$.data.active_lot_count" }
            - call: "GET /zones/lots?admission_id=${a}"
              as: ZoneOperator
              captures: { lst: "$.data[0].status", loh: "$.data[0].quantity_on_hand" }
          assert:
            - "admit response: status == ADMITTED"
            - "immediately after: Zone.deferred_duty_exposure_cents == 500 (round(4 x 2500 x 0.05)) and active_lot_count == 1"
            - "GET /zones/lots?admission_id=${a} returns one lot, status IN_ZONE, quantity_on_hand == 4"
