      - name: clock_set_default_and_override
        claim_type: standard_crud
        grounds:
          - endpoints
          - "/appellate/_clock/set_current_utc"
        distinguishing_aspect: "Server boots with logical clock at 2026-05-01T00:00:00Z; after set_current_utc to 2026-08-15, GET reads back the new value."
        test_recipe:
          setup: ["empty DB; logical clock at default 2026-05-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "GET /appellate/_clock/current_utc"
              payload: {}
              as: CourtAdmin
              captures: { initial_utc: "$.data.current_utc" }
            - call: "POST /appellate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T10:30:00Z" }
              as: CourtAdmin
            - call: "GET /appellate/_clock/current_utc"
              payload: {}
              as: CourtAdmin
              captures: { new_utc: "$.data.current_utc" }
          assert:
            - "initial_utc == '2026-05-01T00:00:00Z' (default)"
            - "new_utc == '2026-08-15T10:30:00Z' (after override)"

