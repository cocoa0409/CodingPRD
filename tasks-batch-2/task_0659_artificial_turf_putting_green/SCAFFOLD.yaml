      - { name: finance_status, type: enum, source: system, description: "Ledger dimension (independent of workflow_status): UNBILLED | DEPOSIT_DUE | DEPOSIT_SETTLED | BALANCE_DUE | PAID_IN_FULL | REFUNDED", default: "UNBILLED" }
