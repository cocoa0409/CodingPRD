  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: stale_plan_version_outranks_frozen_posture_on_allocation_create
        grounds:
          - validations[priority 8 ERR_STALE_PLAN_VERSION]
          - validations[priority 26 ERR_PLAN_POSTURE_FROZEN]
          - concurrency_rules[allocation-create-stale-plan]
          - endpoints[POST /fleet/fleet-plans/{plan_id}/allocations]
        distinguishing_aspect: |
          The conflicting pair here is CONCURRENCY (priority 8, HTTP 412) against
          BUSINESS FISCAL (priority 26, HTTP 422) on the same write. A single request
          carries a plan version captured before the first allocation AND asks for units
          the frozen plan can no longer accept; only the 412 may be returned, and the
          422 must appear once the version is refreshed. An implementation that runs its
          posture gate before its version gate returns the wrong code and status.
        test_recipe:
          setup:
            - "Plan ATL PEAK 2026 with planned_unit_count 10 is LOCKED; its version at lock time is captured as plan_v1."
            - "A first allocation of 10 units consumes plan_v1 and drives allocated_unit_count to 10, so fill_ratio_bp is exactly 10000 and posture becomes FROZEN."
            - "That write also bumped FleetPlan.version, so plan_v1 is now stale."
            - "The offending call reuses plan_v1 and asks for 1 more unit, violating both the OCC rule and the FROZEN posture rule at once."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /fleet/markets"
              payload: { code: "ATL", name: "Atlanta", region: "EAST", transport_hub_distance_km: 23, transfer_cost_per_km_cents: 250, storage_cost_per_day_cents: 800, prep_capacity_per_day: 2, registration_lead_days: 3 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { mkt_atl: $.data.id }
            - call: "POST /fleet/vehicle-segments"
              payload: { code: "MIDSIZE", name: "Midsize sedan", baseline_daily_rate_cents: 5500, target_utilization_pct: 0.80, target_revenue_per_unit_month_cents: 132000, mileage_band_soft_limit_km: 40000, mileage_band_hard_limit_km: 60000, recondition_cap_cents: 90000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { seg_mid: $.data.id }
            - call: "POST /fleet/manufacturer-programs"
              payload: { manufacturer_name: "Northstar", program_year: 2026, program_type: "PROGRAM", repurchase_guarantee_pct: 0.82, min_holding_days: 180, max_holding_days: 365, max_eligible_mileage_km: 45000, excess_mileage_charge_cents_per_km: 30, damage_deduction_cap_cents: 150000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { prg_pgm: $.data.id }
            - call: "POST /fleet/fleet-plans"
              payload: { market_id: "${mkt_atl}", season: "PEAK", plan_year: 2026, planned_unit_count: 10, revenue_per_unit_target_cents: 132000, utilization_target_pct: 0.80 }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { plan_atl: $.data.id }
            - call: "POST /fleet/fleet-plans/${plan_atl}/lock"
              payload: {}
              as: FleetController
              as_user_id: "u-ctl-a"
              captures: { plan_v1: $.data.version }
            - call: "POST /fleet/fleet-plans/${plan_atl}/allocations"
              payload: { program_id: "${prg_pgm}", segment_id: "${seg_mid}", unit_count: 10, capitalized_cost_per_unit_cents: 2800000, expected_plan_version: "${plan_v1}" }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { alloc_full: $.data.id }
            - call: "GET /fleet/fleet-plans/${plan_atl}"
              payload: {}
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { plan_v2: $.data.version }
          trigger:
            - call: "POST /fleet/fleet-plans/${plan_atl}/allocations"
              payload: { program_id: "${prg_pgm}", segment_id: "${seg_mid}", unit_count: 1, capitalized_cost_per_unit_cents: 2800000, expected_plan_version: "${plan_v1}" }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { conflict_error: $.data.error_id }
            - call: "POST /fleet/fleet-plans/${plan_atl}/allocations"
              payload: { program_id: "${prg_pgm}", segment_id: "${seg_mid}", unit_count: 1, capitalized_cost_per_unit_cents: 2800000, expected_plan_version: "${plan_v2}" }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { posture_error: $.data.error_id }
          assert:
            - "FleetPlan.${plan_atl}.allocated_unit_count == 10, fill_ratio_bp == 10000 and posture == \"FROZEN\" after the setup allocation"
            - "${plan_v2} == ${plan_v1} + 1, so the version carried by the first trigger call really is stale"
            - "the first trigger call returns HTTP 412 with error_id ERR_STALE_PLAN_VERSION, NOT 422 ERR_PLAN_POSTURE_FROZEN, because priority 8 outranks priority 26"
            - "the second trigger call, carrying the fresh ${plan_v2}, returns HTTP 422 with error_id ERR_PLAN_POSTURE_FROZEN, proving the second violation was really present all along"
            - "FleetPlan.${plan_atl}.allocated_unit_count is still 10 and FleetPlan.${plan_atl}.version is still ${plan_v2} after both refusals"
            - "no PurchaseAllocation row was created by either refused call"

