            - call: "POST /offerings"
              payload: { name: "Larkspur Growth REIT", minimum_offering_amount_cents: 30000000, maximum_offering_amount_cents: 50000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000 }
