# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2246_snap_retailer_authorization_redemption_compliance
#
# 25 instances across the nine §0.5 rule_ids. Long setup chains are written once
# as YAML anchors (&a_owner, &a_store, ...) and reused by alias, so every
# instance still carries a complete, executable empty-DB -> precondition chain.
#
# Shared fixture geometry (used by every chain that aliases &a_store):
#   Owner "Rio Retail LLC"; Store "Rio Convenience" — CONVENIENCE, TX, 2 lanes,
#   30 staple shelf feet (CONVENIENCE floor is 24), annual gross 36,000,000c,
#   annual staple 20,000,000c (5555 bps, so criterion_b_pass is true),
#   max_terminal_slots 2, tax_rate_bps 825, hardship_designated true.
#   Redemption size expectation = min(2*400000 + 30*15000, 36000000/12)
#                              = min(1,250,000, 3,000,000) = 1,250,000 cents.
#   The logical clock starts at its mandatory default 2026-08-01T00:00:00Z, so
#   chains that need no time travel set no clock at all.
# =============================================================================

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: staple_criterion_a_desk_variety_first_vs_onsite_depth_first_divergence
        grounds:
          - calculations.staple_criterion_a_qualification
          - entities.Application.fields.desk_qualifying_categories
          - entities.Application.fields.desk_criterion_pass
          - entities.StoreVisit.fields.verified_qualifying_categories
          - entities.StoreVisit.fields.verified_criterion_a_pass
          - state_machines.Application.PENDING_VISIT_to_PENDING_DOCUMENTS
          - entities.Application.fields.hold_reason_code
        distinguishing_aspect: |
          This instance exercises the dual variant on the STAPLE-STOCK entity domain
          (Application desk figures vs StoreVisit on-site figures): one identical
          14-line inventory yields desk_qualifying_categories == 4 under
          DESK_VARIETY_FIRST (three varieties plus nine aggregate units per category)
          and verified_qualifying_categories == 3 under ONSITE_DEPTH_FIRST (only
          varieties stocked three-deep count), so the same data passes at the desk and
          fails at the store.
        test_recipe:
          setup:
            - "One owner and one CONVENIENCE store in TX with 30 staple shelf feet."
            - "A CRITERION_A initial application whose reported inventory has five two-deep FRUIT_VEG varieties: broad enough for the desk variant, too shallow for the on-site variant."
            - "One ACTIVE inspector with a 480-minute daily ceiling and a PRE_AUTHORIZATION visit for that application, started at the default clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - &a_owner
              call: "POST /owners"
              payload: { legal_name: "Rio Retail LLC", ownership_type: "LLC", tax_id_last4: "4417" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - &a_store
              call: "POST /stores"
              payload: { owner_id: "${owner_id}", store_name: "Rio Convenience", state_code: "TX", store_type: "CONVENIENCE", checkout_lane_count: 2, staple_shelf_linear_feet: 30, annual_gross_sales_cents: 36000000, annual_staple_sales_cents: 20000000, max_terminal_slots: 2, tax_rate_bps: 825, hardship_designated: true }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { store_id: $.data.id, store_v: $.data.version }
            - &a_app_div
              call: "POST /applications"
              payload:
                store_id: "${store_id}"
                expected_store_version: "${store_v}"
                application_type: "INITIAL"
                claimed_criterion: "CRITERION_A"
                reported_inventory_lines: &inv_div
                  - { category: "BREAD_CEREAL", variety_key: "RICE", unit_count: 3, is_perishable: false }
                  - { category: "BREAD_CEREAL", variety_key: "OATS", unit_count: 3, is_perishable: false }
                  - { category: "BREAD_CEREAL", variety_key: "TORTILLA", unit_count: 3, is_perishable: false }
                  - { category: "DAIRY", variety_key: "MILK", unit_count: 3, is_perishable: true }
                  - { category: "DAIRY", variety_key: "CHEESE", unit_count: 3, is_perishable: true }
                  - { category: "DAIRY", variety_key: "YOGURT", unit_count: 3, is_perishable: true }
                  - { category: "FRUIT_VEG", variety_key: "APPLE", unit_count: 2, is_perishable: true }
                  - { category: "FRUIT_VEG", variety_key: "ONION", unit_count: 2, is_perishable: true }
                  - { category: "FRUIT_VEG", variety_key: "CANNED_CORN", unit_count: 2, is_perishable: false }
                  - { category: "FRUIT_VEG", variety_key: "POTATO", unit_count: 2, is_perishable: true }
                  - { category: "FRUIT_VEG", variety_key: "CARROT", unit_count: 2, is_perishable: true }
                  - { category: "MEAT_POULTRY_FISH", variety_key: "CHICKEN", unit_count: 3, is_perishable: true }
                  - { category: "MEAT_POULTRY_FISH", variety_key: "TUNA_CAN", unit_count: 3, is_perishable: false }
                  - { category: "MEAT_POULTRY_FISH", variety_key: "GROUND_BEEF", unit_count: 3, is_perishable: true }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { app_id: $.data.id }
            - &a_submit
              call: "POST /applications/${app_id}/submit"
              payload: {}
              as: RetailerOwner
              as_user_id: "${owner_id}"
            - &a_insp
              call: "POST /inspectors"
              payload: { full_name: "Dana Ruiz", state_code: "TX", max_daily_minutes: 480 }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { insp_id: $.data.id }
            - &a_visit
              call: "POST /store-visits"
              payload: { application_id: "${app_id}", inspector_id: "${insp_id}", visit_type: "PRE_AUTHORIZATION", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T02:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { visit_id: $.data.id }
            - &a_start
              call: "POST /store-visits/${visit_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
          trigger:
            - &a_findings_div
              call: "POST /store-visits/${visit_id}/findings"
              payload: { observed_inventory_lines: *inv_div, observed_staple_shelf_linear_feet: 30 }
              as: Inspector
              as_user_id: "${insp_id}"
          assert:
            - "Application.${app_id}.desk_qualifying_categories == 4"
            - "Application.${app_id}.desk_perishable_categories == 3"
            - "Application.${app_id}.desk_criterion_pass == true"
            - "StoreVisit.${visit_id}.verified_qualifying_categories == 3"
            - "StoreVisit.${visit_id}.verified_perishable_categories == 2"
            - "StoreVisit.${visit_id}.verified_criterion_a_pass == false"
            - "StoreVisit.${visit_id}.depth_of_stock_pass == true"
            - "StoreVisit.${visit_id}.shelf_discrepancy_bps == 0"
            - "StoreVisit.${visit_id}.status == FINDINGS_SUBMITTED"
            - "Application.${app_id}.status == PENDING_DOCUMENTS"
            - "Application.${app_id}.hold_reason_code == STAPLE_STOCK_INSUFFICIENT"
            - "Application.${app_id}.deficiency_cycle_count == 1"
            - "Application.${app_id}.verified_criterion_pass == false"
            - "Inspector.${insp_id}.committed_minutes == 0"

      - name: cmp_basis_trailing_twelve_period_variant_selected_after_full_year
        grounds:
          - calculations.civil_money_penalty_amount
          - calculations.disqualification_period_months
          - calculations.penalty_ledger_balance
          - entities.SanctionCase.fields.cmp_basis_variant
          - entities.SanctionCase.fields.avg_monthly_redemption_cents
          - entities.SanctionCase.fields.cmp_amount_cents
          - state_machines.SanctionCase.REPLY_RECEIVED_to_DETERMINED
        distinguishing_aspect: |
          This instance exercises the dual variant on the MONEY-PENALTY entity domain
          (SanctionCase CMP basis, a different entity domain from instance 1's staple
          stock): with the charge letter issued 396 days after authorization the
          TRAILING_12_PERIOD_AVERAGE variant averages all four closed periods to
          1,283,642c and assesses 385,092c, where the PEAK_3_PERIOD_AVERAGE variant on
          the very same four periods would have averaged 1,411,522c and assessed
          423,456c.
        test_recipe:
          setup:
            - "The shared owner/store fixture, authorized on 2026-08-01T00:00:00Z with hardship designation."
            - "Four CLOSED monitoring periods with imported settlement totals 1,234,567c (idx 1), 1,000,000c (idx 2), 900,000c (idx 3) and 2,000,000c (idx 4), none of which scores above FLAG_L1."
            - "A SUBSTANTIATED INELIGIBLE_ITEM_SALES investigation and an INELIGIBLE_ITEMS_HARDSHIP sanction case whose charge letter issues at 2027-09-01T00:00:00Z — 396 days after authorization."
            - "A timely CMP election on file and a retailer reply received, so the case sits in REPLY_RECEIVED."
          setup_api_calls:
            - *a_owner
            - *a_store
            - &a_app_pass
              call: "POST /applications"
              payload:
                store_id: "${store_id}"
                expected_store_version: "${store_v}"
                application_type: "INITIAL"
                claimed_criterion: "CRITERION_A"
                reported_inventory_lines: &inv_pass
                  - { category: "BREAD_CEREAL", variety_key: "RICE", unit_count: 4, is_perishable: false }
                  - { category: "BREAD_CEREAL", variety_key: "OATS", unit_count: 3, is_perishable: false }
                  - { category: "BREAD_CEREAL", variety_key: "TORTILLA", unit_count: 5, is_perishable: false }
                  - { category: "DAIRY", variety_key: "MILK", unit_count: 6, is_perishable: true }
                  - { category: "DAIRY", variety_key: "CHEESE", unit_count: 4, is_perishable: true }
                  - { category: "DAIRY", variety_key: "YOGURT", unit_count: 3, is_perishable: true }
                  - { category: "FRUIT_VEG", variety_key: "APPLE", unit_count: 5, is_perishable: true }
                  - { category: "FRUIT_VEG", variety_key: "ONION", unit_count: 4, is_perishable: true }
                  - { category: "FRUIT_VEG", variety_key: "CANNED_CORN", unit_count: 3, is_perishable: false }
                  - { category: "MEAT_POULTRY_FISH", variety_key: "CHICKEN", unit_count: 3, is_perishable: true }
                  - { category: "MEAT_POULTRY_FISH", variety_key: "TUNA_CAN", unit_count: 4, is_perishable: false }
                  - { category: "MEAT_POULTRY_FISH", variety_key: "GROUND_BEEF", unit_count: 3, is_perishable: true }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { app_id: $.data.id }
            - *a_submit
            - *a_insp
            - *a_visit
            - *a_start
            - &a_findings_pass
              call: "POST /store-visits/${visit_id}/findings"
              payload: { observed_inventory_lines: *inv_pass, observed_staple_shelf_linear_feet: 30 }
              as: Inspector
              as_user_id: "${insp_id}"
            - &a_decision
              call: "POST /applications/${app_id}/decision"
              payload: { outcome: "APPROVED" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
            - &p1_create
              call: "POST /redemption-periods"
              payload: { store_id: "${store_id}", period_index: 1, period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { p1_id: $.data.id }
            - &p1_import
              call: "POST /redemption-periods/${p1_id}/settlement-import"
              payload: { imported_total_cents: 1234567, imported_transaction_count: 40, imported_large_transaction_cents: 0, imported_even_dollar_transaction_count: 0 }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
            - &p1_close
              call: "POST /redemption-periods/${p1_id}/close"
              payload: {}
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
            - &p2_create
              call: "POST /redemption-periods"
              payload: { store_id: "${store_id}", period_index: 2, period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { p2_id: $.data.id }
            - &p2_import
              call: "POST /redemption-periods/${p2_id}/settlement-import"
              payload: { imported_total_cents: 1000000, imported_transaction_count: 30, imported_large_transaction_cents: 0, imported_even_dollar_transaction_count: 0 }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
            - &p2_close
              call: "POST /redemption-periods/${p2_id}/close"
              payload: {}
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
            - &p3_create
              call: "POST /redemption-periods"
              payload: { store_id: "${store_id}", period_index: 3, period_start: "2026-04-01T00:00:00Z", period_end: "2026-05-01T00:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { p3_id: $.data.id }
            - &p3_import
              call: "POST /redemption-periods/${p3_id}/settlement-import"
              payload: { imported_total_cents: 900000, imported_transaction_count: 28, imported_large_transaction_cents: 0, imported_even_dollar_transaction_count: 0 }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
            - &p3_close
              call: "POST /redemption-periods/${p3_id}/close"
              payload: {}
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
            - &p4_create
              call: "POST /redemption-periods"
              payload: { store_id: "${store_id}", period_index: 4, period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { p4_id: $.data.id }
            - &p4_import
              call: "POST /redemption-periods/${p4_id}/settlement-import"
              payload: { imported_total_cents: 2000000, imported_transaction_count: 50, imported_large_transaction_cents: 0, imported_even_dollar_transaction_count: 0 }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
            - &p4_close
              call: "POST /redemption-periods/${p4_id}/close"
              payload: {}
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
            - &inv_open_tip
              call: "POST /investigations"
              payload: { store_id: "${store_id}", opened_reason: "TIP" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { inv_id: $.data.id }
            - &ev_household
              call: "POST /investigations/${inv_id}/evidence"
              payload: { evidence_type: "HOUSEHOLD_INTERVIEW", observed_at: "2026-07-15T00:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
            - &conclude_ineligible
              call: "POST /investigations/${inv_id}/conclude"
              payload: { substantiated_violation: "INELIGIBLE_ITEM_SALES" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-2"
            - &case_hardship
              call: "POST /sanction-cases"
              payload: { investigation_id: "${inv_id}", violation_type: "INELIGIBLE_ITEMS_HARDSHIP" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { case_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-09-01T00:00:00Z" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
            - &charge_letter
              call: "POST /sanction-cases/${case_id}/charge-letter"
              payload: { charge_summary: "Repeated sales of ineligible items observed during household interviews." }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { case_v: $.data.version }
            - &cmp_election
              call: "POST /sanction-cases/${case_id}/cmp-elections"
              payload: { expected_sanction_case_version: "${case_v}" }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { election_id: $.data.id }
            - &case_reply
              call: "POST /sanction-cases/${case_id}/reply"
              payload: { reply_text: "The store is the only staple-food retailer within 12 miles and requests a penalty in lieu of disqualification." }
              as: RetailerOwner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /sanction-cases/${case_id}/determination"
              payload: { sanction_type: "CMP_IN_LIEU" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
          assert:
            - "SanctionCase.${case_id}.cmp_basis_variant == TRAILING_12_PERIOD_AVERAGE"
            - "SanctionCase.${case_id}.cmp_basis_period_ids == [${p4_id}, ${p3_id}, ${p2_id}, ${p1_id}]"
            - "SanctionCase.${case_id}.avg_monthly_redemption_cents == 1283642"
            - "SanctionCase.${case_id}.monthly_penalty_cents == 128364"
            - "SanctionCase.${case_id}.disqualification_months == 3"
            - "SanctionCase.${case_id}.cmp_amount_cents == 385092"
            - "SanctionCase.${case_id}.cmp_capped == false"
            - "SanctionCase.${case_id}.cmp_outstanding_cents == 385092"
            - "SanctionCase.${case_id}.status == DETERMINED"
            - "SanctionCase.${case_id}.admin_review_due_at == 2027-09-11T00:00:00Z"
            - "Owner.${owner_id}.cmp_outstanding_cents == 385092"
            - "Owner.${owner_id}.sanction_flag == HAS_ACTIVE_CMP_DEBT"
            - "CmpElection.${election_id}.status == APPROVED"
            - "GET /sanction-cases/${case_id}/penalty-ledger returns exactly 1 entry with entry_type == CMP_ASSESSED, amount_cents == 385092 and balance_after_cents == 385092"

      - name: cmp_basis_peak_three_period_variant_selected_before_full_year
        grounds:
          - calculations.civil_money_penalty_amount
          - entities.SanctionCase.fields.cmp_basis_variant
          - entities.SanctionCase.fields.cmp_basis_period_ids
          - entities.SanctionCase.fields.monthly_penalty_cents
          - entities.Store.fields.authorized_at
        distinguishing_aspect: |
          Same four closed periods and the same hardship case as the trailing instance,
          but the charge letter issues 92 days after authorization, so the
          PEAK_3_PERIOD_AVERAGE variant is selected instead: the basis is the three
          largest periods (2,000,000c, 1,234,567c, 1,000,000c) in that tie-broken order,
          producing avg 1,411,522c, monthly 141,152c and cmp_amount_cents 423,456c —
          38,364c more than the trailing variant on identical data.
        test_recipe:
          setup:
            - "Identical to the trailing-variant instance up to the sanction case, including the same four CLOSED periods."
            - "The only difference: the charge letter issues at 2026-11-01T00:00:00Z, 92 days after the 2026-08-01 authorization, so the store has less than a year of seasoned history."
          setup_api_calls:
            - *a_owner
            - *a_store
            - *a_app_pass
            - *a_submit
            - *a_insp
            - *a_visit
            - *a_start
            - *a_findings_pass
            - *a_decision
            - *p1_create
            - *p1_import
            - *p1_close
            - *p2_create
            - *p2_import
            - *p2_close
            - *p3_create
            - *p3_import
            - *p3_close
            - *p4_create
            - *p4_import
            - *p4_close
            - *inv_open_tip
            - *ev_household
            - *conclude_ineligible
            - *case_hardship
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
            - *charge_letter
            - *cmp_election
            - *case_reply
          trigger:
            - call: "POST /sanction-cases/${case_id}/determination"
              payload: { sanction_type: "CMP_IN_LIEU" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
          assert:
            - "SanctionCase.${case_id}.cmp_basis_variant == PEAK_3_PERIOD_AVERAGE"
            - "SanctionCase.${case_id}.cmp_basis_period_ids == [${p4_id}, ${p1_id}, ${p2_id}]"
            - "SanctionCase.${case_id}.avg_monthly_redemption_cents == 1411522"
            - "SanctionCase.${case_id}.monthly_penalty_cents == 141152"
            - "SanctionCase.${case_id}.disqualification_months == 3"
            - "SanctionCase.${case_id}.cmp_amount_cents == 423456"
            - "SanctionCase.${case_id}.cmp_capped == false"
            - "SanctionCase.${case_id}.cmp_outstanding_cents == 423456"
            - "Owner.${owner_id}.cmp_outstanding_cents == 423456"
            - "CmpElection.${election_id}.quoted_basis_variant == PEAK_3_PERIOD_AVERAGE"

  - rule_id: combinatorial_formula
    instances:

      - name: cmp_rounding_order_monthly_penalty_rounded_before_month_multiplier
        grounds:
          - calculations.civil_money_penalty_amount
          - calculations.disqualification_period_months
          - entities.SanctionCase.fields.monthly_penalty_cents
          - entities.SanctionCase.fields.cmp_amount_cents
          - entities.SanctionCase.fields.cmp_capped
        distinguishing_aspect: |
          Multi-step money pipeline whose PINNED ORDER is the whole point: average
          (round_half_up) -> 10% rate (round_half_up) -> multiply by the 10-month
          trafficking multiplier -> cap. The average 1,283,642c rounds the monthly
          penalty to 128,364c, so the CMP is 1,283,640c; deferring the rounding to the
          end (1,283,642 * 0.10 * 10) yields 1,283,642c. The 2c gap only appears because
          the multiplier is 10, and it is invisible in any single-month calculation.
        test_recipe:
          setup:
            - "The shared authorized store with the same four CLOSED periods (1,234,567c / 1,000,000c / 900,000c / 2,000,000c)."
            - "A TIP investigation carrying a fresh UNDERCOVER_BUY and a fresh EBT_ONLY_TRANSACTION_PATTERN item, concluded SUBSTANTIATED for TRAFFICKING at score 60 by a second analyst."
            - "A TRAFFICKING sanction case charged at 2027-09-01T00:00:00Z (396 days after authorization, so the trailing variant applies) with a timely CMP election and a reply on file."
          setup_api_calls:
            - *a_owner
            - *a_store
            - *a_app_pass
            - *a_submit
            - *a_insp
            - *a_visit
            - *a_start
            - *a_findings_pass
            - *a_decision
            - *p1_create
            - *p1_import
            - *p1_close
            - *p2_create
            - *p2_import
            - *p2_close
            - *p3_create
            - *p3_import
            - *p3_close
            - *p4_create
            - *p4_import
            - *p4_close
            - *inv_open_tip
            - &ev_undercover
              call: "POST /investigations/${inv_id}/evidence"
              payload: { evidence_type: "UNDERCOVER_BUY", observed_at: "2026-07-15T00:00:00Z", note: "Clerk exchanged $200 of benefits for $100 cash." }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
            - &ev_ebt_only
              call: "POST /investigations/${inv_id}/evidence"
              payload: { evidence_type: "EBT_ONLY_TRANSACTION_PATTERN", observed_at: "2026-07-20T00:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
            - &conclude_trafficking
              call: "POST /investigations/${inv_id}/conclude"
              payload: { substantiated_violation: "TRAFFICKING" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-2"
            - &case_trafficking
              call: "POST /sanction-cases"
              payload: { investigation_id: "${inv_id}", violation_type: "TRAFFICKING" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { case_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-09-01T00:00:00Z" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
            - *charge_letter
            - *cmp_election
            - *case_reply
          trigger:
            - call: "POST /sanction-cases/${case_id}/determination"
              payload: { sanction_type: "CMP_IN_LIEU" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
          assert:
            - "Investigation.${inv_id}.trafficking_confidence_score == 60"
            - "SanctionCase.${case_id}.cmp_basis_variant == TRAILING_12_PERIOD_AVERAGE"
            - "SanctionCase.${case_id}.avg_monthly_redemption_cents == 1283642"
            - "SanctionCase.${case_id}.monthly_penalty_cents == 128364"
            - "SanctionCase.${case_id}.cmp_amount_cents == 1283640  (128364 * the 10-month TRAFFICKING_CMP_MONTHS multiplier)"
            - "SanctionCase.${case_id}.cmp_capped == false"
            - "SanctionCase.${case_id}.cmp_amount_cents != 1283642  (the round-once-at-the-end order is wrong)"
            - "Owner.${owner_id}.cmp_outstanding_cents == 1283640"
            - "GET /sanction-cases/${case_id}/penalty-ledger returns 1 entry with amount_cents == 1283640 and balance_after_cents == 1283640"

      - name: equipment_handling_fee_threshold_read_off_net_not_total
        grounds:
          - calculations.equipment_order_totals
          - entities.EquipmentOrder.fields.subtotal_cents
          - entities.EquipmentOrder.fields.subsidy_cents
          - entities.EquipmentOrder.fields.net_equipment_cents
          - entities.EquipmentOrder.fields.handling_fee_cents
          - entities.EquipmentOrder.fields.total_due_cents
        distinguishing_aspect: |
          Self-referential-looking fee: the free-handling threshold (25,000c) must be
          read off net_equipment_cents (post-subsidy, pre-fee), not off total_due_cents.
          A 6-case paper + signage order nets exactly 24,000c, pays the 1,500c fee and
          totals 25,500c; the naive reading would waive the fee and settle at 24,000c
          even though the total then sits above the threshold. The 7-case order nets
          28,000c and pays nothing, so the two orders bracket the same constant from
          both sides while the subsidy shifts which side each lands on.
        test_recipe:
          setup:
            - "The shared authorized store (annual gross 36,000,000c, comfortably under the 500,000,000c subsidy ceiling)."
          setup_api_calls:
            - *a_owner
            - *a_store
            - *a_app_pass
            - *a_submit
            - *a_insp
            - *a_visit
            - *a_start
            - *a_findings_pass
            - *a_decision
          trigger:
            - call: "POST /equipment-orders"
              payload: { store_id: "${store_id}", lines: [ { item_code: "RECEIPT_PAPER_CASE", qty: 6 }, { item_code: "SIGNAGE_PACK", qty: 1 } ] }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { order_fee_id: $.data.id }
            - call: "POST /equipment-orders"
              payload: { store_id: "${store_id}", lines: [ { item_code: "RECEIPT_PAPER_CASE", qty: 7 } ] }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { order_free_id: $.data.id }
            - call: "POST /equipment-orders"
              payload: { store_id: "${store_id}", lines: [ { item_code: "EBT_ONLY_WIRELESS_TERMINAL", qty: 1 } ] }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { order_zero_id: $.data.id }
          assert:
            - "EquipmentOrder.${order_fee_id}.subtotal_cents == 26200"
            - "EquipmentOrder.${order_fee_id}.subsidy_cents == 2200"
            - "EquipmentOrder.${order_fee_id}.net_equipment_cents == 24000"
            - "EquipmentOrder.${order_fee_id}.handling_fee_cents == 1500"
            - "EquipmentOrder.${order_fee_id}.total_due_cents == 25500"
            - "EquipmentOrder.${order_free_id}.subtotal_cents == 28000"
            - "EquipmentOrder.${order_free_id}.subsidy_cents == 0"
            - "EquipmentOrder.${order_free_id}.net_equipment_cents == 28000"
            - "EquipmentOrder.${order_free_id}.handling_fee_cents == 0"
            - "EquipmentOrder.${order_free_id}.total_due_cents == 28000"
            - "EquipmentOrder.${order_zero_id}.subtotal_cents == 42500"
            - "EquipmentOrder.${order_zero_id}.subsidy_cents == 42500"
            - "EquipmentOrder.${order_zero_id}.net_equipment_cents == 0"
            - "EquipmentOrder.${order_zero_id}.handling_fee_cents == 0"
            - "EquipmentOrder.${order_zero_id}.total_due_cents == 0"
            - "EquipmentOrder.${order_fee_id}.status == DRAFT"

      - name: redemption_anomaly_weighted_three_component_score_with_small_format_weights
        grounds:
          - calculations.redemption_anomaly_score
          - calculations.redemption_period_metrics
          - calculations.store_redemption_flag_level
          - entities.RedemptionPeriod.fields.size_expectation_cents
          - entities.RedemptionPeriod.fields.anomaly_score
          - state_machines.RedemptionPeriod.OPEN_to_CLOSED
        distinguishing_aspect: |
          Four constants and three separately-capped components collapse into one score:
          size expectation = max(100000, min(2*400000 + 30*15000, 36000000/12)) selects
          the FOOTPRINT branch at 1,250,000c; the excess and large-share components both
          clamp at 1 while the even-dollar component lands at 0.6, and the CONVENIENCE
          store type swaps in the SMALL_FORMAT weights 45/35/20 so the single
          round_half_up of 45 + 35 + 12 gives exactly 92.
        test_recipe:
          setup:
            - "The shared authorized CONVENIENCE store (2 lanes, 30 shelf feet, 36,000,000c annual gross)."
            - "One OPEN period for 2026-06 whose settlement import supplies 4,375,000c over 25 transactions, of which 2,625,000c is in large transactions and 6 are even-dollar."
          setup_api_calls:
            - *a_owner
            - *a_store
            - *a_app_pass
            - *a_submit
            - *a_insp
            - *a_visit
            - *a_start
            - *a_findings_pass
            - *a_decision
            - &pj_create
              call: "POST /redemption-periods"
