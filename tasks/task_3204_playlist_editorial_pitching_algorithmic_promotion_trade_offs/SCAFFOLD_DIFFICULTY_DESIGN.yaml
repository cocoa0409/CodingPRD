              payload: { track_id: "${trk_wn}", discount_factor: 0.5, starts_on: "2026-09-10T00:00:00Z", ends_on: "2026-09-20T00:00:00Z" }
              as: RightsHolder
              as_user_id: "${art_wn}"
              captures: { enr_a: $.data.id }
          trigger:
            - call: "POST /catalog/promotions"
              payload: { track_id: "${trk_wn}", discount_factor: 0.5, starts_on: "2026-09-19T23:59:59Z", ends_on: "2026-09-25T00:00:00Z" }
              as: RightsHolder
              as_user_id: "${art_wn}"
              captures: { err_ov: $.data.error_id }
            - call: "POST /catalog/promotions"
              payload: { track_id: "${trk_wn}", discount_factor: 0.5, starts_on: "2026-09-20T00:00:00Z", ends_on: "2026-09-25T00:00:00Z" }
              as: RightsHolder
              as_user_id: "${art_wn}"
              captures: { enr_b: $.data.id }
          assert:
            - "the one-second-overlap enrollment is rejected 409 err_ov == ERR_ENROLLMENT_WINDOW_OVERLAP"
            - "the adjacent enrollment (starts_on exactly equal to A's ends_on) is created ENROLLED — half-open semantics make the boundary point belong to B only"
            - "PromotionEnrollment.${enr_a}.status == ENROLLED and PromotionEnrollment.${enr_b}.status == ENROLLED coexist"

      - name: placement_slot_reoccupancy_with_rotated_out_grace
        grounds:
          - validations[priority=12]
          - state_machines.PlaylistPlacement.REINSTATED_to_ROTATED_OUT
          - errors.ERR_SLOT_OCCUPIED
