            - { call: "POST /consignors", payload: { sale_event_id: "${ev_id}", full_name: "Bob", email: "bob@x.com" }, as: Anonymous, captures: { cb: $.data.id } }
            - { call: "POST /drop-off-slots", payload: { sale_event_id: "${ev_id}", start_time: "2026-06-02T10:00:00Z", end_time: "2026-06-02T12:00:00Z", capacity: 5 }, as: EventOrganizer, captures: { slot_id: $.data.id } }
            - { call: "POST /drop-off-bookings", payload: { slot_id: "${slot_id}", consignor_id: "${ca}" }, as: Consignor, as_user_id: "${ca}", captures: { bk: $.data.id } }
          trigger:
