            - call: "POST /udrp/appointments/${apt_b_id}/conflict-screening"
              payload: { disclosed_prior_representation: true, disclosed_same_firm: true, disclosed_financial_interest: false, prior_appointments_with_complainant: 0, months_since_last_contact: 36 }
              as: Panelist
