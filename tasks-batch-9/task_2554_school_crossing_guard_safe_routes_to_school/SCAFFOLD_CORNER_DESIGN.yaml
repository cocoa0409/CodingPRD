      - name: corner_duty_status_cycle_rejects_repeated_action
        claim_type: cyclic
        grounds:
          - state_machines.Guard.duty_status
          - errors.ERR_INVALID_DUTY_ACTION
          - endpoints.POST_/srts/guards/{id}/duty-status
        distinguishing_aspect: |
          The duty_status dimension is a true cycle: UNASSIGNED -> ON_LEAVE -> UNASSIGNED
          round-trips cleanly for an unassigned guard, but each edge is guarded by the
          current state. ON_LEAVE on a guard already ON_LEAVE and RETURN on a guard who is
          not ON_LEAVE both return ERR_INVALID_DUTY_ACTION (422), so the cycle cannot be
          driven past its own edges.
        test_recipe:
          setup:
            - "One certified, fully equipped guard holding no assignments, so duty_status is UNASSIGNED."
          setup_api_calls:
            - call: "POST /srts/guards"
              payload: { full_name: "Rita Alvarez", home_zone_code: "Z-NORTH", hire_date: "2026-08-03", substitute_pool_optin: true }
              as: CrossingSupervisor
              as_user_id: "sup-1"
              captures: { g1_id: $.data.id }
            - call: "POST /srts/guards/${g1_id}/training"
              payload: { training_date: "2026-08-05", hours: 12, curriculum_code: "SRTS-BASIC" }
              as: CrossingSupervisor
              as_user_id: "sup-1"
            - call: "POST /srts/guards/${g1_id}/equipment"
              payload: { item_type: "HIGH_VIS_VEST", issued_on: "2026-08-06" }
              as: CrossingSupervisor
              as_user_id: "sup-1"
            - call: "POST /srts/guards/${g1_id}/equipment"
              payload: { item_type: "STOP_PADDLE", issued_on: "2026-08-06" }
              as: CrossingSupervisor
              as_user_id: "sup-1"
            - call: "POST /srts/guards/${g1_id}/equipment"
              payload: { item_type: "WHISTLE", issued_on: "2026-08-06" }
              as: CrossingSupervisor
              as_user_id: "sup-1"
            - call: "POST /srts/guards/${g1_id}/certify"
              payload: { certified_on: "2026-08-07", certification_expires_on: "2027-06-30" }
              as: CrossingSupervisor
              as_user_id: "sup-1"
            - call: "POST /srts/guards/${g1_id}/duty-status"
              payload: { duty_action: "ON_LEAVE" }
              as: CrossingSupervisor
              as_user_id: "sup-1"
          trigger:
            - call: "POST /srts/guards/${g1_id}/duty-status"
              payload: { duty_action: "ON_LEAVE" }
              as: CrossingSupervisor
              as_user_id: "sup-1"
            - call: "POST /srts/guards/${g1_id}/duty-status"
              payload: { duty_action: "RETURN" }
              as: CrossingSupervisor
              as_user_id: "sup-1"
            - call: "POST /srts/guards/${g1_id}/duty-status"
              payload: { duty_action: "RETURN" }
              as: CrossingSupervisor
              as_user_id: "sup-1"
          assert:
            - "first trigger call returns error id ERR_INVALID_DUTY_ACTION with HTTP status 422 and Guard.${g1_id}.duty_status stays ON_LEAVE"
            - "second trigger call returns HTTP 200 with Guard.${g1_id}.duty_status == UNASSIGNED (the no-assignment fork of RETURN, not ASSIGNED)"
            - "third trigger call returns error id ERR_INVALID_DUTY_ACTION with HTTP status 422 and duty_status stays UNASSIGNED"
            - "Guard.${g1_id}.certification_status == CERTIFIED throughout — the two dimensions are independent"

      - name: corner_not_warranted_finalize_suspends_post_and_vacates_assignment
        claim_type: cascade_down
        grounds:
          - endpoints.POST_/srts/warrant-studies/{id}/finalize
          - state_machines.GuardPost.ACTIVE_to_SUSPENDED
          - state_machines.PostAssignment.SCHEDULED_to_VACATED
          - state_machines.School.coverage_posture
        distinguishing_aspect: |
          Adopting a NOT_WARRANTED determination cascades DOWN two levels — the ACTIVE
          post is SUSPENDED and its SCHEDULED assignment is VACATED, releasing the guard
          to UNASSIGNED — and then the school recomputation shows the counter-intuitive
          resting point: with the only post no longer ACTIVE, active_post_count is 0,
          coverage_rate_pct is 100.00 and coverage_posture stays OPEN, so the PUBLISHED
          route is NOT placed on ADVISORY_HOLD. Suspending a post removes it from the
          coverage partition rather than counting it as uncovered.
          Second study window: 2026-11-02 -> 2026-11-20, chosen past the 30-day cool-off
          on the first window (which ends 2026-09-30) so it is accepted. Its crash
