      - name: corner_hull_premium_correct_for_known_inputs
        claim_type: correct_result
        grounds:
          - calculations.hull_rate_ppm
          - calculations.annual_hull_premium
        excluded_because:
          difficulty_instance: four_factor_rate_chain_with_fleet_size_credit_branch
          rationale: "That §1.8 instance walks the full four-factor chain on known inputs and asserts every intermediate ppm plus the final premium against hand-computed literals, and it does so for both the credited and uncredited branch. A separate correct-result corner would assert a strict subset of those same literals."
      - name: corner_fleet_credit_threshold_boundary
        claim_type: threshold
        grounds:
          - calculations.annual_hull_premium.constants.FLEET_CREDIT_MIN_SCHEDULES
          - calculations.constructive_total_loss_ratio.constants.CTL_THRESHOLD_PPM
        excluded_because:
          difficulty_instance: ctl_ratio_inclusive_threshold_at_exactly_750000_ppm
          rationale: "The threshold-at / threshold-1 / threshold+1 corner is exactly that §1.8 instance, which pins the inclusive CTL boundary at 749999, 750000 and above with the loss_type promotion side effect; the fleet-credit boundary is separately covered by the rate_threshold_triggers instance in cross_cutting_complexity_layers."
      - name: corner_declaration_running_total_and_zero_case
        claim_type: aggregation
        grounds:
          - calculations.fleet_declaration_premium
          - calculations.policy_written_premium
        excluded_because:
          difficulty_instance: fleet_declaration_round_per_line_then_sum
          rationale: "That §1.8 instance asserts each per-line ceil, the pinned round-per-line-then-sum order against the forbidden round-once alternative, and the late-loading addition; the empty-input aggregate is covered by the second boundary_precision_check instance."
      - name: corner_settlement_includes_pending_salvage_and_assessments
        claim_type: forward_looking
        grounds:
          - calculations.hull_settlement_amount
          - calculations.hull_settlement_amount.constants.MIN_DEDUCTIBLE_CENTS
        excluded_because:
          difficulty_instance: hull_settlement_agreed_value_vs_depreciated_value_basis
          rationale: "That §1.8 instance settles the same loss on both total-loss bases, pins the deductible on the GROSS value before the salvage credit (41325000 rather than the forbidden 41370000) and asserts the SETTLEMENT_RETURN row — the forward-looking behaviour is fully exercised there."
      - name: corner_rerate_processes_schedules_in_creation_order
        claim_type: chronological
        grounds:
          - calculations.rerate_adjustment_delta
          - endpoints[POST /aviation/pilots/{id}/hours-verifications]
        excluded_because:
          difficulty_instance: pilot_qualification_logged_hours_vs_verified_hours
          rationale: "That §1.8 instance drives one hours-verification across multiple live schedules naming the pilot and asserts the RERATE_ADJUSTMENT rows in the pinned created_at ASC order with their individual deltas, which is the whole chronological claim."
      - name: corner_market_line_intervals_merged_for_peak_exposure
        claim_type: interval_merge
        grounds:
          - calculations.market_line_occupancy
          - errors[ERR_MARKET_LINE_EXCEEDED]
        excluded_because:
          difficulty_instance: war_market_closed_interval_touching_endpoints_overlap
          rationale: "That §1.8 instance tests the closed-interval overlap rule at touching endpoints, the peak-exposure admission test and the aggregate refusal; the contrasting half-open aircraft rule is tested by aircraft_coverage_half_open_adjacency_allowed."
      - name: corner_settlement_bases_diverge_on_identical_data
        claim_type: variant_divergence
        grounds:
          - calculations.hull_settlement_amount.variants
        excluded_because:
          difficulty_instance: hull_settlement_agreed_value_vs_depreciated_value_basis
          rationale: "That §1.8 instance IS the divergence test: the same schedule and the same loss settle for 44325000 on the agreed-value basis and 39006000 on the depreciated basis, with both deductibles asserted."
      - name: corner_warranty_basis_selects_the_scoring_variant
        claim_type: variant_selection
        grounds:
          - calculations.pilot_qualification_score.variants
          - entities.AircraftSchedule.fields.warranty_basis
        excluded_because:
          difficulty_instance: pilot_qualification_logged_hours_vs_verified_hours
          rationale: "That §1.8 instance asserts warranty_basis flipping from LOGGED_HOURS to VERIFIED_HOURS at the hours-verification, the band it selects on each side, and the re-rate delta the switch reconciles into the ledger — selection and reconciliation in one chain."
