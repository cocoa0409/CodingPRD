  # =====================================================================
  # Rule 8 — resource/temporal overlap with two DIFFERENT interval semantics
  #          on two DIFFERENT resource entities
  #   8a: resource TechnicalCommittee — HALF-OPEN [opens_at, closes_at), adjacency legal,
  #       AGGREGATE capacity of max_concurrent_ballots
  #   8b: resource WorkItem — CLOSED INCLUSIVE [start_date, end_date], adjacency illegal,
  #       SYMMETRIC 15-day buffer, capacity of exactly one
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: committee_ballot_slots_allow_adjacent_windows_but_cap_overlapping_ones
        grounds:
          - calculations.ballot_window_capacity_check
          - validations[priority=106]
          - errors[ERR_BALLOT_CAPACITY_EXCEEDED]
          - entities.TechnicalCommittee.max_concurrent_ballots
          - entities.TechnicalCommittee.open_ballot_count
        distinguishing_aspect: |
          Resource: the TechnicalCommittee's balloting capacity. Interval semantics: HALF-OPEN, so a
          window that starts at the exact instant another ends does NOT contend and is admitted even
          though both slots are already full; and the constraint is AGGREGATE rather than exclusive,
          so one overlapping ballot is fine and the second is what tips the committee over
          max_concurrent_ballots = 2. Contrast the other instance in this rule, where the interval is
          closed-inclusive, adjacency is forbidden and the capacity is one.
        test_recipe:
          setup:
            - "Balanced ACTIVE committee TC-14 with 3 voting seats in 3 interest categories, chaired by the PRODUCER, and max_concurrent_ballots deliberately set to 2."
            - "Four separate work items STD-1400 .. STD-1403 all sponsored by TC-14, each with a revision-1 draft in DRAFTING, so ballot capacity is the ONLY thing that can be contended — no draft is asked to hold two ballots."
            - "Two ballots already OPEN over the identical half-open window 2026-08-01T00:00:00Z .. 2026-08-15T00:00:00Z, filling both slots."
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
