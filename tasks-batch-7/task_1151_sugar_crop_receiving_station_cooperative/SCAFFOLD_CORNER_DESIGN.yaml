  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: member_cannot_create_station
        claim_type: rbac_denial
        grounds: [roles.COOP_ADMIN, endpoints.POST_/api/stations, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Station creation is exclusive to COOP_ADMIN; MEMBER gets 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["member exists"]
          setup_api_calls:
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m1_id: $.data.id } }
          trigger:
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 100 }, as: MEMBER, as_user_id: "${m1_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN"

      - name: scheduler_cannot_record_sample
        claim_type: rbac_denial
        grounds: [roles.QUALITY_TECH, "endpoints.POST_/api/samples/{sample_id}/record-result", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Sample result recording is exclusive to QUALITY_TECH; SCHEDULER gets ERR_FORBIDDEN even with a valid payload."
