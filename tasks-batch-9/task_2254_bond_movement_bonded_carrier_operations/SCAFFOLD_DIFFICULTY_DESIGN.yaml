  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: obligation_exactly_equal_to_available_saturates_the_bond
        grounds:
          - validations[priority=14].ERR_BOND_INSUFFICIENT
          - state_machines.CustomsBond.ACTIVE_to_SATURATED
          - calculations.bond_obligation_ledger_balance
          - calculations.movement_bond_obligation
        distinguishing_aspect: |
          Money-equality boundary on POST /in-bond/movements: available_amount
          41.75 == obligation_amount 41.75 must be ACCEPTED (the check is <=, not
          <), leaving available_amount exactly 0.00 and the bond SATURATED; the
          very next identical filing then fails with ERR_BOND_NOT_ACTIVE rather
          than ERR_BOND_INSUFFICIENT.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; ports 4601 (NE) and 3901 (MW); carrier ACTIVE."
            - "Bond b3 = CONTINUOUS limit_amount 41.75, 2026-07-01 .. 2027-06-30, so available_amount is exactly the obligation the filing computes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/ports"
              payload: { port_code: "4601", name: "Port of New York", region_code: "NE", exam_capacity_slots: 1, go_warehouse_available: true }
