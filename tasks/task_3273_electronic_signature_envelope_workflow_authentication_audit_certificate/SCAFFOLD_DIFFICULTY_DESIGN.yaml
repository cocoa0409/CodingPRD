          A single send request violates the state rule (priority 11, category state) and the
          legal-hold rule (priority 12, category business_safety) at once; because the state rule
          outranks the safety rule the response must carry ERR_ENVELOPE_TERMINAL and never
          ERR_LEGAL_HOLD_FROZEN.
