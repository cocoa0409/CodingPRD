scenario: "2377. Semiconductor Fabrication & Yield Management (semiconductor fabrication facility): process flow definition across hundreds of steps with recipe management and change control, wafer start planning by product with cycle time targets and priority lot handling, equipment availability, preventive maintenance and chamber qualification affecting capacity, in-line metrology and defect inspection with statistical process control and excursion response, yield analysis with wafer maps, failure signature classification and root cause investigation, engineering split lots and process experiments alongside production, cleanroom contamination control with particle monitoring and gowning protocols, test, binning and die sorting with speed grade allocation to product families"
domain_name: "semiconductor-fab-yield"
api_prefix: "/fab"

complexity_profile:
  primary_archetype: "Workflow orchestration"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - version_pinning_on_approval
    - selector_policy
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - polymorphic
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  list_success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601",
                "limit": 10, "offset": 0, "total_count": 42, "has_more": true },
      "response_type": "array", "data": [] }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  # ---------------------------------------------------------------- §1.1
  # common_fields: true  => id (uuid), created_at, updated_at, version (OCC counter, starts at 1)
  # common_fields: false => id (uuid), created_at only; the row is immutable, so it carries no
  #                         updated_at, no version, and §1.5 exposes no PATCH for it.
  - name: ProcessFlow
    parent: null
    common_fields: true
    fields:
      - name: flow_code
        type: string
        source: input
        description: "Human-readable flow identifier; unique across all ProcessFlow rows."
        constraints: "1-32 chars; uniqueness enforced by ERR_DUPLICATE_CODE"
      - name: product_family
        type: enum
        source: input
        description: "Product family this flow manufactures."
        constraints: "one of {LOGIC_N5, LOGIC_N7, MEMORY_D1}"
      - name: revision
        type: integer
        source: computed
        description: "Flow revision; starts at 1 and increments by 1 each time a step is added after a prior release attempt is rejected. Distinct from `version` (the OCC counter)."
        default: 1
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state; see state_machines.ProcessFlow."
        default: DRAFT
        constraints: "one of {DRAFT, RELEASED, OBSOLETE}"
      - name: step_count
        type: integer
        source: computed
        description: "Count of ProcessStep rows with flow_id == this ProcessFlow.id; recomputed on every step insertion."
        default: 0
      - name: total_standard_hours
        type: number
        source: computed
        description: "sum(ProcessStep.standard_hours) over all ProcessStep rows with flow_id == this ProcessFlow.id; recomputed on every step insertion and pinned at release. 2 decimal places."
        default: 0.0
      - name: released_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the DRAFT -> RELEASED transition; null while DRAFT."
      - name: superseded_by_flow_id
        type: string
        source: computed
        description: "FK -> ProcessFlow.id; self-referential; set on the RELEASED -> OBSOLETE transition to the flow whose release superseded this one; null otherwise."

  - name: ProcessStep
    parent: ProcessFlow
    common_fields: true
    fields:
      - name: flow_id
        type: string
        source: input
        description: "FK -> ProcessFlow.id; the flow this step belongs to."
      - name: recipe_id
        type: string
        source: input
        description: "FK -> Recipe.id; the recipe executed at this step."
      - name: step_seq
        type: integer
        source: input
        description: "Ordering key within the flow; steps execute in ascending step_seq. Unique within a flow_id."
        constraints: ">= 1; unique per flow_id (ERR_DUPLICATE_CODE)"
      - name: step_name
        type: string
        source: input
        description: "Operator-facing step label."
      - name: standard_hours
        type: number
        source: input
        description: "Standard processing hours charged against equipment capacity when a StepRun on this step is opened. 2 decimal places."
        constraints: "> 0"
      - name: metrology_required
        type: boolean
        source: input
        description: "When true, a StepRun on this step cannot be tracked out until at least one MetrologyMeasurement exists for it."
        default: false
      - name: rework_target_step_id
        type: string
        source: input
        description: "FK -> ProcessStep.id; self-referential; the step a lot is rewound to when reworked from this step. Null means rework is not available at this step."

  - name: Recipe
    parent: null
    common_fields: true
    fields:
      - name: recipe_code
        type: string
        source: input
        description: "Unique recipe identifier."
        constraints: "1-32 chars; uniqueness enforced by ERR_DUPLICATE_CODE"
      - name: tool_type
        type: enum
        source: input
        description: "Equipment class this recipe runs on."
        constraints: "one of {LITHO, ETCH, DEPOSITION, IMPLANT, CMP}"
      - name: target_value
        type: number
        source: input
        description: "Current nominal process target (e.g., etch depth in nm). Replaced by RecipeChangeRequest.proposed_target on the change request's implement transition. 2 decimal places."
        constraints: "> 0"
      - name: qual_expiry_days
        type: integer
        source: input
        description: "Number of days a chamber qualification against this recipe remains valid."
        default: 90
        constraints: ">= 1"
      - name: revision
        type: integer
        source: computed
        description: "Process revision; starts at 1, increments by 1 on each change request implement. Pinned by RecipeChangeRequest.pinned_recipe_revision at approval."
        default: 1
      - name: status
        type: enum
        source: computed
        description: "QUALIFIED means the recipe may be run in production; RESTRICTED means an approved change is pending implementation. See state_machines.Recipe."
        default: QUALIFIED
        constraints: "one of {QUALIFIED, RESTRICTED}"
      - name: restricted_reason
        type: enum
        source: computed
        description: "Why the recipe is RESTRICTED."
        default: NONE
        constraints: "one of {NONE, ECN_PENDING_IMPLEMENTATION}"

  - name: RecipeChangeRequest
    parent: Recipe
    common_fields: true
    fields:
      - name: recipe_id
        type: string
        source: input
        description: "FK -> Recipe.id; the recipe this engineering change notice modifies."
      - name: change_class
        type: enum
        source: input
        description: "Declared blast radius of the change; drives CLASS_WEIGHT in calculations.recipe_change_risk_score."
        constraints: "one of {MINOR, MAJOR, CRITICAL}"
      - name: proposed_target
        type: number
        source: input
        description: "Requested replacement for Recipe.target_value. 2 decimal places."
        constraints: "> 0"
      - name: justification
        type: string
        source: input
        description: "Free-text engineering rationale recorded for audit."
      - name: author_user_id
        type: string
        source: system
        description: "X-User-ID of the ProcessEngineer who created the request; compared against approver_user_id for segregation of duties."
      - name: approver_user_id
        type: string
        source: computed
        description: "X-User-ID of the QualityManager who approved the request; null until APPROVED."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state; see state_machines.RecipeChangeRequest."
        default: SUBMITTED
        constraints: "one of {SUBMITTED, REVISION_REQUESTED, APPROVED, IMPLEMENTED, REJECTED}"
      - name: revision_round
        type: integer
        source: computed
        description: "Count of completed revision loops (SUBMITTED -> REVISION_REQUESTED -> SUBMITTED). Incremented on each resubmit."
        default: 0
      - name: risk_score
        type: number
        source: computed
        description: "Output of calculations.recipe_change_risk_score; recomputed on create and on each resubmit. 2 decimal places."
      - name: impact_lot_count
        type: integer
        source: computed
        description: "Input to the risk score: count of Lot rows still due to execute a step using this recipe at scoring time."
      - name: requires_full_requal
        type: boolean
        source: computed
        description: "True when risk_score >= REQUAL_THRESHOLD; drives the chamber-requalification cascade on implement."
      - name: pinned_recipe_revision
        type: integer
        source: computed
        description: "Recipe.revision observed at the moment of approval; implement is rejected when Recipe.revision no longer equals it. Null until APPROVED."

  - name: Equipment
    parent: null
    common_fields: true
    fields:
      - name: equipment_code
        type: string
        source: input
        description: "Unique tool identifier."
        constraints: "1-32 chars; uniqueness enforced by ERR_DUPLICATE_CODE"
      - name: tool_type
        type: enum
        source: input
        description: "Equipment class; must match the recipe's tool_type for a step to run on it and must appear in the operator's certified_tool_types."
        constraints: "one of {LITHO, ETCH, DEPOSITION, IMPLANT, CMP}"
      - name: pm_interval_hours
        type: number
        source: input
        description: "Productive hours between preventive maintenance events; denominator of the PM-proximity penalty in calculations.chamber_dispatch_score."
        default: 168.0
        constraints: "> 0"
      - name: purge_buffer_hours
        type: number
        source: input
        description: "Hours after PM completion during which the tool must idle for chamber purge; no StepRun may open on its chambers until the purge interval has elapsed."
        default: 2.0
        constraints: ">= 0"
      - name: hours_since_pm
        type: number
        source: input
        description: "Productive hours accrued since the last PM completion. Seeded at commissioning, incremented by StepRun.actual_hours on every track-out, reset to 0 on pm-complete. 2 decimal places."
        default: 0.0
        constraints: ">= 0"
      - name: state
        type: enum
        source: computed
        description: "Availability state; see state_machines.Equipment."
        default: IDLE
        constraints: "one of {IDLE, PRODUCTIVE, PM, DOWN}"
      - name: available_capacity_hours
        type: number
        source: computed
        description: "Remaining capacity in the current PM cycle. Debited by ProcessStep.standard_hours when a StepRun opens, credited back in full on abort, and rebalanced to StepRun.actual_hours on track-out. Reset to INITIAL_CAPACITY_HOURS on pm-complete. 2 decimal places."
        default: 720.0
      - name: pm_started_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the last IDLE|PRODUCTIVE -> PM transition; null if never maintained."
      - name: purge_until
        type: datetime
        source: computed
        description: "pm_completed instant + purge_buffer_hours. A StepRun on this tool's chambers is rejected while clock_now <= purge_until (closed interval). Null if never maintained."

  - name: Chamber
    parent: Equipment
    common_fields: true
    fields:
      - name: equipment_id
        type: string
        source: input
        description: "FK -> Equipment.id; the tool this chamber belongs to."
      - name: qualified_recipe_id
        type: string
        source: input
        description: "FK -> Recipe.id; the single recipe this chamber is set up to run."
      - name: chamber_code
        type: string
        source: input
        description: "Chamber label; unique within an equipment_id. Ascending chamber_code is the tie-break for calculations.chamber_dispatch_score."
        constraints: "1-16 chars; unique per equipment_id (ERR_DUPLICATE_CODE)"
      - name: particle_limit
        type: number
        source: input
        description: "Maximum admissible particle count; also the denominator of the contamination penalty in the dispatch score."
        default: 50.0
        constraints: "> 0"
      - name: particle_count
        type: number
        source: computed
        description: "Most recent particle reading recorded against this chamber. 2 decimal places."
        default: 0.0
      - name: qual_state
        type: enum
        source: computed
        description: "Qualification state; see state_machines.Chamber."
        default: UNQUALIFIED
        constraints: "one of {UNQUALIFIED, QUALIFIED, QUAL_EXPIRED, DISQUALIFIED}"
      - name: occupancy_state
        type: enum
        source: computed
        description: "FREE when no StepRun with status OPEN references this chamber; OCCUPIED while one does."
        default: FREE
        constraints: "one of {FREE, OCCUPIED}"
      - name: qualified_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the last successful qualification run; null while UNQUALIFIED."
      - name: qual_expires_at
        type: datetime
        source: computed
        description: "qualified_at + Recipe.qual_expiry_days days, evaluated against the recipe named by qualified_recipe_id. Null while UNQUALIFIED."

  - name: Operator
    parent: null
    common_fields: true
    fields:
      - name: badge_id
        type: string
        source: input
        description: "Unique cleanroom badge number."
        constraints: "1-16 chars; uniqueness enforced by ERR_DUPLICATE_CODE"
      - name: full_name
        type: string
        source: input
        description: "Operator display name."
      - name: certified_tool_types
        type: array
        source: input
        description: "Tool classes this operator may track lots into; each element one of {LITHO, ETCH, DEPOSITION, IMPLANT, CMP}."
        constraints: "non-empty array of tool_type enum members"
      - name: gown_state
        type: enum
        source: computed
        description: "Cleanroom gowning posture. STREET operators cannot open StepRuns."
        default: STREET
        constraints: "one of {STREET, GOWNED}"
      - name: gowned_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the last STREET -> GOWNED transition; null while STREET."
      - name: cert_status
        type: enum
        source: computed
        description: "Certification standing; see state_machines.Operator."
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, REVOKED}"

  - name: WaferStartPlan
    parent: null
    common_fields: true
    fields:
      - name: flow_id
        type: string
        source: input
        description: "FK -> ProcessFlow.id; the RELEASED flow whose total_standard_hours prices this plan."
      - name: product_family
        type: enum
        source: input
        description: "Product family being planned; must equal the flow's product_family."
        constraints: "one of {LOGIC_N5, LOGIC_N7, MEMORY_D1}"
      - name: week_start_date
        type: datetime
        source: input
        description: "First instant of the planning week (ISO 8601 UTC)."
      - name: planned_wafer_starts
        type: integer
        source: input
        description: "Wafers this plan authorises to be released into the fab during the week."
        constraints: ">= 1"
      - name: capacity_budget_hours
        type: number
        source: input
        description: "Hours of fab capacity allocated to this plan; denominator of the commitment utilisation ratio and hard ceiling on committed_hours."
        constraints: "> 0"
      - name: cycle_time_target_days
        type: number
        source: input
        description: "Target days from lot release to sort; compared against the projected cycle time to set cycle_time_status. 3 decimal places."
        constraints: "> 0"
      - name: released_wafer_starts
        type: integer
        source: computed
        description: "Running sum of Lot.wafer_count over Lot rows with plan_id == this plan that have completed the PLANNED -> RELEASED transition. Engineering split lots do not contribute."
        default: 0
      - name: committed_hours
        type: number
        source: computed
        description: "Output of calculations.wafer_start_capacity_commitment; 0.0 while DRAFT. 2 decimal places."
        default: 0.0
      - name: surcharge_hours
        type: number
        source: computed
        description: "Tier surcharge component of committed_hours. 2 decimal places."
        default: 0.0
      - name: commitment_tier
        type: enum
        source: computed
        description: "Utilisation tier selected from the pre-surcharge utilisation ratio."
        default: TIER_0
        constraints: "one of {TIER_0, TIER_1, TIER_2, TIER_3}"
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state; see state_machines.WaferStartPlan."
        default: DRAFT
        constraints: "one of {DRAFT, COMMITTED, CLOSED}"

  - name: Lot
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> WaferStartPlan.id; the plan whose wafer starts this lot consumes."
      - name: flow_id
        type: string
        source: input
        description: "FK -> ProcessFlow.id; the process flow this lot runs; must equal the plan's flow_id."
      - name: parent_lot_id
        type: string
        source: computed
        description: "FK -> Lot.id; self-referential; set on engineering split lots to the lot they were split from. Null for production lots."
      - name: hold_excursion_id
        type: string
        source: computed
        description: "FK -> Excursion.id; the excursion whose containment placed this lot on hold. Null when hold_state is NONE or the hold did not originate from an excursion."
      - name: lot_number
        type: string
        source: input
        description: "Unique lot identifier."
        constraints: "1-32 chars; uniqueness enforced by ERR_DUPLICATE_CODE"
      - name: wafer_count
        type: integer
        source: input
        description: "Current wafers physically in the lot. Decremented on split, restored on rejoin."
        constraints: ">= 1"
      - name: origin_wafer_count
        type: integer
        source: computed
        description: "wafer_count as supplied at creation; never mutated. Anchors calculations.wafer_inventory_conservation."
      - name: priority_class
        type: enum
        source: input
        description: "Dispatch priority; selects QUEUE_FACTOR in the cycle-time projection and waives the PM-proximity penalty in the dispatch score when SUPER_HOT."
        default: STANDARD
        constraints: "one of {STANDARD, HOT, SUPER_HOT}"
      - name: lot_type
        type: enum
        source: computed
        description: "PRODUCTION for lots created through POST /fab/lots; ENGINEERING_SPLIT for lots created through a split."
        default: PRODUCTION
        constraints: "one of {PRODUCTION, ENGINEERING_SPLIT}"
      - name: flow_state
        type: enum
        source: computed
        description: "Progress dimension of the lot's parallel state machine; see state_machines.Lot (flow_state dimension)."
        default: PLANNED
        constraints: "one of {PLANNED, RELEASED, IN_PROCESS, AT_SORT, COMPLETED, SCRAPPED}"
      - name: hold_state
        type: enum
        source: computed
        description: "Hold dimension of the lot's parallel state machine, independent of flow_state; see state_machines.Lot (hold_state dimension). Cascades may only raise the hold per HOLD_PRECEDENCE, never lower it."
        default: NONE
        constraints: "one of {NONE, SPC_HOLD, QUAL_HOLD, ENGINEERING_HOLD}"
      - name: current_step_seq
        type: integer
        source: computed
        description: "step_seq of the most recently tracked-out ProcessStep; 0 before the first step completes. The next admissible step is the lowest step_seq in the flow greater than this value."
        default: 0
      - name: rework_count
        type: integer
        source: computed
        description: "Number of completed rework rewinds; capped by MAX_REWORK_COUNT."
        default: 0
      - name: released_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the PLANNED -> RELEASED transition; null while PLANNED."
      - name: completed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the AT_SORT -> COMPLETED transition; null before."
      - name: actual_cycle_time_days
        type: number
        source: computed
        description: "Chronological variant of calculations.lot_cycle_time_days, pinned at the AT_SORT -> COMPLETED transition. 3 decimal places. Null before."

  - name: StepRun
    parent: Lot
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: "FK -> Lot.id; the lot being processed."
      - name: step_id
        type: string
        source: input
        description: "FK -> ProcessStep.id; the flow step being executed."
      - name: operator_id
        type: string
        source: input
        description: "FK -> Operator.id; the operator tracking the lot in; must equal X-User-ID when the caller's role is Operator."
      - name: chamber_id
        type: string
        source: computed
        description: "FK -> Chamber.id; chamber selected by calculations.chamber_dispatch_score at track-in. Never supplied by the client."
      - name: dispatch_score
        type: number
        source: computed
        description: "Winning score from calculations.chamber_dispatch_score, retained for audit. 2 decimal places."
      - name: reserved_hours
        type: number
        source: computed
        description: "ProcessStep.standard_hours captured at track-in; the exact amount debited from and credited back to Equipment.available_capacity_hours. 2 decimal places."
      - name: actual_hours
        type: number
        source: computed
        description: "(tracked_out_at - tracked_in_at) in hours, 2 decimal places. Null until track-out; never set on abort."
      - name: status
        type: enum
        source: computed
        description: "Run state; see state_machines.StepRun."
        default: OPEN
        constraints: "one of {OPEN, COMPLETED, ABORTED}"
      - name: tracked_in_at
        type: datetime
        source: computed
        description: "Logical-clock instant the run opened."
      - name: tracked_out_at
        type: datetime
        source: computed
        description: "Logical-clock instant the run closed (track-out or abort); null while OPEN."

  - name: SpcChart
    parent: ProcessStep
    common_fields: true
    fields:
      - name: step_id
        type: string
        source: input
        description: "FK -> ProcessStep.id; the step whose metrology this chart monitors."
      - name: param_name
        type: string
        source: input
        description: "Monitored parameter label."
      - name: target
        type: number
        source: input
        description: "Chart centre line. 2 decimal places."
      - name: sigma
        type: number
        source: input
        description: "Process standard deviation used by the WARN band and the Western Electric run rule. 2 decimal places."
        constraints: "> 0"
      - name: usl
        type: number
        source: input
        description: "Upper specification limit; a value strictly above usl is OUT_OF_SPEC."
      - name: lsl
        type: number
        source: input
        description: "Lower specification limit; a value strictly below lsl is OUT_OF_SPEC."
      - name: ucl
        type: number
        source: input
        description: "Upper control limit; a value at or above ucl is OUT_OF_CONTROL."
        constraints: "lsl < lcl < target < ucl < usl"
      - name: lcl
        type: number
        source: input
        description: "Lower control limit; a value at or below lcl is OUT_OF_CONTROL."
      - name: status
        type: enum
        source: computed
        description: "MONITORING charts classify incoming measurements; SUSPENDED charts are frozen by excursion containment. See state_machines.SpcChart."
        default: MONITORING
        constraints: "one of {MONITORING, SUSPENDED}"
      - name: consecutive_same_side_count
        type: integer
        source: computed
        description: "Length of the current run of measurements at least RUN_SIGMA_MULT sigma from target on the same side of it; reset to 0 by any measurement inside the 1-sigma band."
        default: 0
      - name: last_side
        type: enum
        source: computed
        description: "Side of the centre line of the most recent measurement."
        default: NONE
        constraints: "one of {ABOVE, BELOW, NONE}"
      - name: violation_count
        type: integer
        source: computed
        description: "Cumulative count of measurements on this chart classified OUT_OF_CONTROL or OUT_OF_SPEC, or that triggered the run rule."
        default: 0

  - name: MetrologyMeasurement
    parent: StepRun
    common_fields: false
    fields:
      - name: step_run_id
        type: string
        source: input
        description: "FK -> StepRun.id; the OPEN run this measurement was taken on."
      - name: spc_chart_id
        type: string
        source: input
        description: "FK -> SpcChart.id; the chart classifying this measurement; its step_id must equal the run's step_id."
      - name: excursion_id
        type: string
        source: computed
        description: "FK -> Excursion.id; the excursion this measurement opened; null when the measurement did not open one."
      - name: measured_value
        type: number
        source: input
        description: "Metrology reading. 2 decimal places."
      - name: classification
        type: enum
        source: computed
        description: "Output of calculations.spc_violation_classification."
        constraints: "one of {IN_CONTROL, WARN, OUT_OF_CONTROL, OUT_OF_SPEC}"
      - name: run_rule_triggered
        type: boolean
        source: computed
        description: "True when this measurement completed a Western Electric run of WE_RUN_LENGTH same-side points beyond RUN_SIGMA_MULT sigma."
      - name: deviation_sigma
        type: number
        source: computed
        description: "abs(measured_value - chart.target) / chart.sigma. 4 decimal places."

  - name: Excursion
    parent: null
    common_fields: true
    fields:
      - name: spc_chart_id
        type: string
        source: computed
        description: "FK -> SpcChart.id; polymorphic source pointer, non-null only when source_type is SPC."
      - name: die_sort_run_id
        type: string
        source: computed
        description: "FK -> DieSortRun.id; polymorphic source pointer, non-null only when source_type is DIE_SORT."
      - name: chamber_id
        type: string
        source: computed
        description: "FK -> Chamber.id; polymorphic source pointer, non-null only when source_type is PARTICLE."
      - name: lot_id
        type: string
        source: computed
        description: "FK -> Lot.id; the lot whose processing surfaced the excursion; null for PARTICLE excursions raised on an idle chamber."
      - name: source_type
        type: enum
        source: computed
        description: "Which polymorphic source pointer is populated."
        constraints: "one of {SPC, DIE_SORT, PARTICLE}"
      - name: trigger_value
        type: number
        source: computed
        description: "The reading that opened the excursion: measured_value for SPC, yield_loss_ratio for DIE_SORT, particle reading for PARTICLE. 4 decimal places."
      - name: severity_variant
        type: enum
        source: computed
        description: "Which variant of calculations.excursion_severity_score produced the current severity_score."
        default: PROVISIONAL
        constraints: "one of {PROVISIONAL, FINAL}"
      - name: severity_score
        type: number
        source: computed
        description: "Output of calculations.excursion_severity_score under the current severity_variant. 2 decimal places."
      - name: severity_band
        type: enum
        source: computed
        description: "Band derived from severity_score against MEDIUM_BAND and HIGH_BAND."
        constraints: "one of {LOW, MEDIUM, HIGH}"
      - name: affected_lot_count
        type: integer
        source: computed
        description: "Lot-spread input to the severity score under the current variant."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state; see state_machines.Excursion."
        default: OPEN
        constraints: "one of {OPEN, CONTAINED, DISPOSITIONED}"
      - name: containment_scope
        type: enum
        source: computed
        description: "Blast radius applied at containment; determines which cascade fires."
        default: NONE
        constraints: "one of {NONE, SPC_CHART, CHAMBER, EQUIPMENT}"
      - name: contained_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the QualityManager who contained the excursion; null when containment was automatic (PARTICLE source)."
      - name: dispositioned_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the engineer who dispositioned the excursion; must differ from contained_by_user_id."
      - name: disposition
        type: enum
        source: computed
        description: "Root-cause outcome applied to the affected lots."
        default: NONE
        constraints: "one of {NONE, CONTINUE, REWORK, SCRAP}"
      - name: failure_signature
        type: enum
        source: computed
        description: "Wafer-map failure signature copied from DieSortRun.dominant_signature for DIE_SORT excursions; NONE for other sources."
        default: NONE
        constraints: "one of {NONE, EDGE_RING, CENTER_CLUSTER, SCRATCH_LINE, PARAMETRIC_SHIFT}"

  - name: DieSortRun
    parent: Lot
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: "FK -> Lot.id; the lot being sorted; must be AT_SORT."
      - name: gross_die_per_wafer
        type: integer
        source: input
        description: "Reticle-derived gross die count per wafer, recorded for audit."
        constraints: ">= 1"
      - name: baseline_yield
        type: number
        source: input
        description: "Product-family baseline sort yield used as the denominator of yield_loss_ratio. 4 decimal places."
        constraints: "> 0 and <= 1"
      - name: premium_target_die
        type: integer
        source: computed
        description: "Premium speed-grade allocation target captured at bin time; 0 before binning."
        default: 0
      - name: standard_target_die
        type: integer
        source: computed
        description: "Standard speed-grade allocation target captured at bin time; 0 before binning."
        default: 0
      - name: wafer_results
        type: array
        source: input
        description: "Per-wafer sort results. Each element is an object with keys wafer_slot (integer >= 1), tested_die (integer >= 1), good_die (integer >= 0), edge_ring_fails, center_cluster_fails, scratch_line_fails, parametric_shift_fails (integers >= 0). Per element, good_die <= tested_die and the four fail counts must sum to tested_die - good_die."
        constraints: "non-empty; per-element consistency enforced by ERR_WAFER_RESULT_INCONSISTENT"
      - name: sort_yield
        type: number
        source: computed
        description: "Output of calculations.die_yield_and_speed_grade_allocation under the pinned round-per-wafer-then-average order. 4 decimal places."
      - name: yield_loss_ratio
        type: number
        source: computed
        description: "max(0, (baseline_yield - sort_yield) / baseline_yield). 4 decimal places. Crossing SORT_EXCURSION_THRESHOLD opens a DIE_SORT excursion."
      - name: dominant_signature
        type: enum
        source: computed
        description: "Failure signature whose share of total fails reaches DOMINANCE_THRESHOLD; NONE when no signature does or when there are no fails at all."
        default: NONE
        constraints: "one of {NONE, EDGE_RING, CENTER_CLUSTER, SCRATCH_LINE, PARAMETRIC_SHIFT}"
      - name: good_die_total
        type: integer
        source: computed
        description: "sum(good_die) across wafer_results; the pool distributed by the speed-grade waterfall."
      - name: premium_die
        type: integer
        source: computed
        description: "First waterfall bucket. 0 before binning."
        default: 0
      - name: standard_die
        type: integer
        source: computed
        description: "Second waterfall bucket. 0 before binning."
        default: 0
      - name: value_die
        type: integer
        source: computed
        description: "Remainder bucket; absorbs everything the first two buckets do not take. 0 before binning."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state; see state_machines.DieSortRun."
        default: SORTED
        constraints: "one of {SORTED, BINNED}"

state_machines:
  # ---------------------------------------------------------------- §1.2
  - entity: ProcessFlow
    initial_state: DRAFT
    terminal_states: [OBSOLETE]
    transitions:
      - from: DRAFT
        to: RELEASED
        trigger: "POST /fab/process-flows/{id}/release"
        actor: ProcessEngineer
        preconditions:
          - "status == DRAFT"
          - "count(ProcessStep where flow_id == this.id) >= 1"
          - "every ProcessStep of this flow resolves a Recipe with status == QUALIFIED"
          - "when supersedes_flow_id is supplied: that ProcessFlow.status == RELEASED and its product_family == this.product_family"
        side_effects:
          - "step_count = count(ProcessStep where flow_id == this.id)"
          - "total_standard_hours = round(sum(ProcessStep.standard_hours where flow_id == this.id), 2)"
          - "released_at = clock_now"
          - "status = RELEASED"
          - "increments ProcessFlow.version by 1"
          - "when supersedes_flow_id is supplied: drives that ProcessFlow through RELEASED -> OBSOLETE"
      - from: RELEASED
        to: OBSOLETE
        trigger: "system event: another ProcessFlow is released naming this flow in supersedes_flow_id"
        actor: system
        preconditions:
          - "status == RELEASED"
        side_effects:
          - "status = OBSOLETE"
          - "superseded_by_flow_id = the releasing ProcessFlow.id"
          - "increments ProcessFlow.version by 1"
        note: "Obsolete flows keep their existing Lots running; only new WaferStartPlan creation is blocked."

  - entity: Recipe
    initial_state: QUALIFIED
    terminal_states: []
    transitions:
      - from: QUALIFIED
        to: RESTRICTED
        trigger: "POST /fab/change-requests/{id}/approve"
        actor: QualityManager
        preconditions:
          - "status == QUALIFIED"
        side_effects:
          - "status = RESTRICTED"
          - "restricted_reason = ECN_PENDING_IMPLEMENTATION"
          - "increments Recipe.version by 1"
        note: "Cycle leg 1 of 2 — the Recipe returns to QUALIFIED on implement, making this machine cyclic. Several change requests may be approved against one Recipe: the first approval performs this transition, and every later approval while the Recipe is already RESTRICTED is a no-op on status and restricted_reason that still increments Recipe.version. Approve therefore never fails on Recipe.status."
      - from: RESTRICTED
        to: QUALIFIED
        trigger: "POST /fab/change-requests/{id}/implement"
        actor: ProcessEngineer
        preconditions:
          - "status == RESTRICTED"
          - "revision == the request's pinned_recipe_revision"
        side_effects:
          - "target_value = RecipeChangeRequest.proposed_target"
          - "revision = revision + 1"
          - "status = QUALIFIED"
          - "restricted_reason = NONE"
          - "increments Recipe.version by 1"
          - "when the request's requires_full_requal == true: every Chamber with qualified_recipe_id == this Recipe.id and qual_state == QUALIFIED is driven through QUALIFIED -> UNQUALIFIED (cascade hop 2)"

  - entity: RecipeChangeRequest
    initial_state: SUBMITTED
    terminal_states: [IMPLEMENTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /fab/change-requests/{id}/request-revision"
        actor: QualityManager
        preconditions:
          - "status == SUBMITTED"
          - "revision_round < MAX_REVISION_ROUNDS"
        side_effects:
          - "status = REVISION_REQUESTED"
          - "increments RecipeChangeRequest.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /fab/change-requests/{id}/request-revision when revision_round >= MAX_REVISION_ROUNDS"
        actor: QualityManager
        preconditions:
          - "status == SUBMITTED"
          - "revision_round >= MAX_REVISION_ROUNDS"
        side_effects:
          - "status = REJECTED"
          - "increments RecipeChangeRequest.version by 1"
        note: "The revision loop is bounded: the third request-revision terminates the change notice instead of looping again."
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /fab/change-requests/{id}/resubmit"
        actor: ProcessEngineer
        preconditions:
          - "status == REVISION_REQUESTED"
          - "X-User-ID == author_user_id"
        side_effects:
          - "change_class = the resubmitted change_class"
          - "proposed_target = the resubmitted proposed_target"
          - "revision_round = revision_round + 1"
          - "recomputes impact_lot_count, risk_score and requires_full_requal via calculations.recipe_change_risk_score"
          - "status = SUBMITTED"
          - "increments RecipeChangeRequest.version by 1"
        note: "Cycle closure — SUBMITTED -> REVISION_REQUESTED -> SUBMITTED makes this machine cyclic."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /fab/change-requests/{id}/approve"
        actor: QualityManager
        preconditions:
          - "status == SUBMITTED"
          - "expected_recipe_version == Recipe.version"
          - "X-User-ID != author_user_id"
        side_effects:
          - "approver_user_id = X-User-ID"
          - "pinned_recipe_revision = Recipe.revision"
          - "status = APPROVED"
          - "increments RecipeChangeRequest.version by 1"
          - "drives Recipe through QUALIFIED -> RESTRICTED when the Recipe is still QUALIFIED; a Recipe already RESTRICTED by an earlier approval stays RESTRICTED and only its version increments"
      - from: APPROVED
        to: IMPLEMENTED
        trigger: "POST /fab/change-requests/{id}/implement"
        actor: ProcessEngineer
        preconditions:
          - "status == APPROVED"
          - "Recipe.revision == pinned_recipe_revision (in reachable states this is equivalent to Recipe.status == RESTRICTED: the revision only moves when some sibling request is implemented, which also returns the Recipe to QUALIFIED)"
        side_effects:
          - "status = IMPLEMENTED"
          - "increments RecipeChangeRequest.version by 1"
          - "drives Recipe through RESTRICTED -> QUALIFIED (cascade hop 1)"

  - entity: Equipment
    initial_state: IDLE
    terminal_states: []
    transitions:
      - from: IDLE
        to: PRODUCTIVE
        trigger: "POST /fab/step-runs selects a Chamber of this Equipment"
        actor: Operator
        preconditions:
          - "state == IDLE"
        side_effects:
          - "state = PRODUCTIVE"
          - "available_capacity_hours = round(available_capacity_hours - ProcessStep.standard_hours, 2)"
          - "increments Equipment.version by 1"
      - from: PRODUCTIVE
        to: IDLE
        trigger: "system event: the last StepRun with status OPEN on this Equipment's chambers leaves OPEN (track-out or abort)"
        actor: system
        preconditions:
          - "state == PRODUCTIVE"
          - "count(StepRun with status OPEN whose chamber_id belongs to this Equipment) == 0 after the transition"
        side_effects:
          - "state = IDLE"
          - "increments Equipment.version by 1"
      - from: IDLE
        to: PM
        trigger: "POST /fab/equipment/{id}/pm-start"
        actor: EquipmentEngineer
        preconditions:
          - "state == IDLE"
        side_effects:
          - "state = PM"
          - "pm_started_at = clock_now"
          - "increments Equipment.version by 1"
      - from: DOWN
        to: PM
        trigger: "POST /fab/equipment/{id}/pm-start"
        actor: EquipmentEngineer
        preconditions:
          - "state == DOWN"
        side_effects:
          - "state = PM"
          - "pm_started_at = clock_now"
          - "increments Equipment.version by 1"
        note: "Recovery path out of DOWN — DOWN is not terminal."
      - from: PM
        to: IDLE
        trigger: "POST /fab/equipment/{id}/pm-complete"
        actor: EquipmentEngineer
        preconditions:
          - "state == PM"
        side_effects:
          - "state = IDLE"
          - "hours_since_pm = 0.0"
          - "available_capacity_hours = INITIAL_CAPACITY_HOURS"
          - "purge_until = clock_now + purge_buffer_hours"
          - "every Chamber of this Equipment with qual_state == DISQUALIFIED is driven through DISQUALIFIED -> UNQUALIFIED"
          - "every Lot with hold_state == QUAL_HOLD whose hold_excursion_id names an Excursion with chamber_id belonging to this Equipment is driven through QUAL_HOLD -> NONE"
          - "increments Equipment.version by 1"
      - from: IDLE
        to: DOWN
        trigger: "system event: Excursion containment with containment_scope == EQUIPMENT on a Chamber of this Equipment"
        actor: system
        preconditions:
          - "state == IDLE"
        side_effects:
          - "state = DOWN"
          - "increments Equipment.version by 1"
      - from: PRODUCTIVE
        to: DOWN
        trigger: "system event: Excursion containment with containment_scope == EQUIPMENT on a Chamber of this Equipment"
        actor: system
        preconditions:
          - "state == PRODUCTIVE"
        side_effects:
          - "state = DOWN"
          - "every StepRun with status OPEN whose chamber_id belongs to this Equipment is driven through OPEN -> ABORTED (cascade hop 4)"
          - "increments Equipment.version by 1"

  - entity: Chamber
    initial_state: UNQUALIFIED
    terminal_states: []
    transitions:
      - from: UNQUALIFIED
        to: QUALIFIED
        trigger: "POST /fab/chambers/{id}/qualification-runs"
        actor: EquipmentEngineer
        preconditions:
          - "qual_state IN {UNQUALIFIED, QUAL_EXPIRED}"
          - "qual_result == PASS"
          - "Equipment.state IN {IDLE, PRODUCTIVE}"
          - "the Recipe named by qualified_recipe_id has status == QUALIFIED"
          - "particle_count <= particle_limit"
        side_effects:
          - "qual_state = QUALIFIED"
          - "qualified_at = clock_now"
          - "qual_expires_at = clock_now + Recipe.qual_expiry_days days"
          - "increments Chamber.version by 1"
      - from: QUAL_EXPIRED
        to: QUALIFIED
        trigger: "POST /fab/chambers/{id}/qualification-runs"
        actor: EquipmentEngineer
        preconditions:
          - "qual_state == QUAL_EXPIRED"
          - "qual_result == PASS"
          - "Equipment.state IN {IDLE, PRODUCTIVE}"
          - "the Recipe named by qualified_recipe_id has status == QUALIFIED"
          - "particle_count <= particle_limit"
        side_effects:
          - "qual_state = QUALIFIED"
          - "qualified_at = clock_now"
          - "qual_expires_at = clock_now + Recipe.qual_expiry_days days"
          - "increments Chamber.version by 1"
      - from: QUALIFIED
        to: QUAL_EXPIRED
        trigger: "system event: chamber eligibility evaluation during POST /fab/step-runs observes clock_now >= qual_expires_at"
        actor: system
        preconditions:
          - "qual_state == QUALIFIED"
          - "clock_now >= qual_expires_at"
        side_effects:
          - "qual_state = QUAL_EXPIRED"
          - "increments Chamber.version by 1"
        note: "Evaluated for every candidate chamber before ranking, so the expiry is observable even when the dispatch itself fails."
      - from: QUALIFIED
        to: UNQUALIFIED
        trigger: "system event: RecipeChangeRequest implement with requires_full_requal == true on the Recipe named by qualified_recipe_id"
        actor: system
        preconditions:
          - "qual_state == QUALIFIED"
        side_effects:
          - "qual_state = UNQUALIFIED"
          - "qualified_at = null"
          - "qual_expires_at = null"
          - "every Lot with flow_state IN {RELEASED, IN_PROCESS} that has a StepRun with status OPEN on this Chamber is driven through its hold_state transition to QUAL_HOLD (cascade hop 3)"
          - "increments Chamber.version by 1"
      - from: QUALIFIED
        to: DISQUALIFIED
        trigger: "system event: Excursion containment with containment_scope IN {CHAMBER, EQUIPMENT} implicating this Chamber"
        actor: system
        preconditions:
          - "qual_state == QUALIFIED"
        side_effects:
          - "qual_state = DISQUALIFIED"
          - "qualified_at = null"
          - "qual_expires_at = null"
          - "increments Chamber.version by 1"
      - from: DISQUALIFIED
        to: UNQUALIFIED
        trigger: "POST /fab/equipment/{id}/pm-complete on the parent Equipment"
        actor: EquipmentEngineer
        preconditions:
          - "qual_state == DISQUALIFIED"
          - "Equipment.state == PM"
        side_effects:
          - "qual_state = UNQUALIFIED"
          - "increments Chamber.version by 1"
        note: "Closes the Chamber cycle QUALIFIED -> DISQUALIFIED -> UNQUALIFIED -> QUALIFIED."

  - entity: Operator
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /fab/operators/{id} with cert_status = SUSPENDED"
        actor: QualityManager
        preconditions:
          - "cert_status == ACTIVE"
        side_effects:
          - "cert_status = SUSPENDED"
          - "increments Operator.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /fab/operators/{id} with cert_status = ACTIVE"
        actor: QualityManager
        preconditions:
          - "cert_status == SUSPENDED"
        side_effects:
          - "cert_status = ACTIVE"
          - "increments Operator.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "PATCH /fab/operators/{id} with cert_status = REVOKED"
        actor: QualityManager
        preconditions:
          - "cert_status == ACTIVE"
        side_effects:
          - "cert_status = REVOKED"
          - "gown_state = STREET"
          - "increments Operator.version by 1"
      - from: SUSPENDED
        to: REVOKED
        trigger: "PATCH /fab/operators/{id} with cert_status = REVOKED"
        actor: QualityManager
        preconditions:
          - "cert_status == SUSPENDED"
        side_effects:
          - "cert_status = REVOKED"
          - "gown_state = STREET"
          - "increments Operator.version by 1"
    note: "cert_status dimension of Operator; evolves independently of the gown_state dimension below."

  - entity: Operator
    initial_state: STREET
    terminal_states: []
    transitions:
      - from: STREET
        to: GOWNED
        trigger: "PATCH /fab/operators/{id} with gown_state = GOWNED"
        actor: Operator
        preconditions:
          - "gown_state == STREET"
          - "cert_status == ACTIVE"
        side_effects:
          - "gown_state = GOWNED"
          - "gowned_at = clock_now"
          - "increments Operator.version by 1"
      - from: GOWNED
        to: STREET
        trigger: "PATCH /fab/operators/{id} with gown_state = STREET"
        actor: Operator
        preconditions:
          - "gown_state == GOWNED"
        side_effects:
          - "gown_state = STREET"
          - "gowned_at = null"
          - "increments Operator.version by 1"
    note: "gown_state dimension of Operator; a REVOKED certification forces this dimension back to STREET, but gowning changes never alter cert_status."

  - entity: WaferStartPlan
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: COMMITTED
        trigger: "POST /fab/wafer-start-plans/{id}/commit"
        actor: FabPlanner
        preconditions:
          - "status == DRAFT"
          - "the ProcessFlow named by flow_id has status == RELEASED"
          - "product_family == ProcessFlow.product_family"
          - "committed_hours computed by calculations.wafer_start_capacity_commitment <= capacity_budget_hours"
        side_effects:
          - "commitment_tier, surcharge_hours and committed_hours set from calculations.wafer_start_capacity_commitment"
          - "status = COMMITTED"
          - "increments WaferStartPlan.version by 1"
      - from: COMMITTED
        to: CLOSED
        trigger: "system event: a Lot release brings released_wafer_starts to exactly planned_wafer_starts"
        actor: system
        preconditions:
          - "status == COMMITTED"
          - "released_wafer_starts == planned_wafer_starts after the release side effect"
        side_effects:
          - "status = CLOSED"
          - "increments WaferStartPlan.version by 1"

  - entity: Lot
    initial_state: PLANNED
    terminal_states: [COMPLETED, SCRAPPED]
    transitions:
      - from: PLANNED
        to: RELEASED
        trigger: "POST /fab/lots/{id}/release"
        actor: FabPlanner
        preconditions:
          - "flow_state == PLANNED"
          - "the WaferStartPlan named by plan_id has status == COMMITTED"
          - "expected_plan_version == WaferStartPlan.version"
          - "WaferStartPlan.released_wafer_starts + wafer_count <= WaferStartPlan.planned_wafer_starts"
        side_effects:
          - "flow_state = RELEASED"
          - "released_at = clock_now"
          - "WaferStartPlan.released_wafer_starts = released_wafer_starts + wafer_count"
          - "increments WaferStartPlan.version by 1"
          - "when released_wafer_starts == planned_wafer_starts: drives WaferStartPlan through COMMITTED -> CLOSED"
          - "increments Lot.version by 1"
      - from: RELEASED
        to: IN_PROCESS
        trigger: "POST /fab/step-runs"
        actor: Operator
        preconditions:
          - "flow_state == RELEASED"
          - "hold_state == NONE"
        side_effects:
          - "flow_state = IN_PROCESS"
          - "increments Lot.version by 1"
      - from: IN_PROCESS
        to: AT_SORT
        trigger: "POST /fab/step-runs/{id}/track-out on the run whose step has the highest step_seq in the flow"
        actor: Operator
        preconditions:
          - "flow_state == IN_PROCESS"
          - "the tracked-out ProcessStep.step_seq == max(ProcessStep.step_seq where flow_id == this.flow_id)"
        side_effects:
          - "flow_state = AT_SORT"
          - "current_step_seq = the tracked-out ProcessStep.step_seq"
          - "increments Lot.version by 1"
      - from: AT_SORT
        to: COMPLETED
        trigger: "POST /fab/die-sort-runs/{id}/bin"
        actor: YieldEngineer
        preconditions:
          - "flow_state == AT_SORT"
          - "the DieSortRun has status == SORTED"
        side_effects:
          - "flow_state = COMPLETED"
          - "completed_at = clock_now"
          - "actual_cycle_time_days set from the chronological variant of calculations.lot_cycle_time_days"
          - "increments Lot.version by 1"
      - from: RELEASED
        to: SCRAPPED
        trigger: "POST /fab/excursions/{id}/disposition with disposition = SCRAP"
        actor: QualityManager
        preconditions:
          - "flow_state == RELEASED"
          - "this Lot is in the excursion's affected set under the FINAL variant"
        side_effects:
          - "flow_state = SCRAPPED"
          - "hold_state = NONE"
          - "increments Lot.version by 1"
      - from: IN_PROCESS
        to: SCRAPPED
        trigger: "POST /fab/excursions/{id}/disposition with disposition = SCRAP"
        actor: QualityManager
        preconditions:
          - "flow_state == IN_PROCESS"
          - "this Lot is in the excursion's affected set under the FINAL variant"
        side_effects:
          - "flow_state = SCRAPPED"
          - "hold_state = NONE"
          - "every StepRun of this Lot with status OPEN is driven through OPEN -> ABORTED"
          - "increments Lot.version by 1"
      - from: AT_SORT
        to: SCRAPPED
        trigger: "POST /fab/excursions/{id}/disposition with disposition = SCRAP"
        actor: YieldEngineer
        preconditions:
          - "flow_state == AT_SORT"
          - "this Lot is in the excursion's affected set under the FINAL variant"
        side_effects:
          - "flow_state = SCRAPPED"
          - "hold_state = NONE"
          - "increments Lot.version by 1"
    note: "flow_state dimension of Lot's parallel state machine; evolves independently of the hold_state dimension below (a Lot can be IN_PROCESS + SPC_HOLD, or RELEASED + ENGINEERING_HOLD)."

  - entity: Lot
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: SPC_HOLD
        trigger: "system event: Excursion containment with containment_scope == SPC_CHART"
        actor: system
        preconditions:
          - "hold_state == NONE"
          - "flow_state IN {RELEASED, IN_PROCESS}"
          - "this Lot has a StepRun with status OPEN whose step_id == SpcChart.step_id"
        side_effects:
          - "hold_state = SPC_HOLD"
          - "hold_excursion_id = the containing Excursion.id"
          - "increments Lot.version by 1"
      - from: NONE
        to: QUAL_HOLD
        trigger: "system event: Chamber leaves QUALIFIED (containment scope CHAMBER or EQUIPMENT, or requalification cascade) while this Lot has an OPEN or just-ABORTED StepRun on it"
        actor: system
        preconditions:
          - "hold_state == NONE"
          - "flow_state IN {RELEASED, IN_PROCESS}"
        side_effects:
          - "hold_state = QUAL_HOLD"
          - "hold_excursion_id = the containing Excursion.id, or null when the cause was a requalification cascade"
          - "increments Lot.version by 1"
      - from: SPC_HOLD
        to: QUAL_HOLD
        trigger: "system event: Chamber leaves QUALIFIED while this Lot is already on SPC_HOLD"
        actor: system
        preconditions:
          - "hold_state == SPC_HOLD"
        side_effects:
          - "hold_state = QUAL_HOLD"
          - "hold_excursion_id = the containing Excursion.id, or null when the cause was a requalification cascade"
          - "increments Lot.version by 1"
        note: "HOLD_PRECEDENCE ENGINEERING_HOLD > QUAL_HOLD > SPC_HOLD > NONE — a cascade may only raise the hold. The symmetric QUAL_HOLD -> SPC_HOLD transition does not exist."
      - from: NONE
        to: ENGINEERING_HOLD
        trigger: "POST /fab/lots/{id}/splits (applies to the newly created child Lot)"
        actor: ProcessEngineer
        preconditions:
          - "the child Lot is created with lot_type == ENGINEERING_SPLIT"
        side_effects:
          - "child Lot hold_state = ENGINEERING_HOLD"
      - from: SPC_HOLD
        to: NONE
        trigger: "POST /fab/excursions/{id}/disposition with disposition = CONTINUE"
        actor: QualityManager
        preconditions:
          - "hold_state == SPC_HOLD"
          - "hold_excursion_id == the dispositioned Excursion.id"
        side_effects:
          - "hold_state = NONE"
          - "hold_excursion_id = null"
          - "increments Lot.version by 1"
      - from: QUAL_HOLD
        to: NONE
        trigger: "POST /fab/excursions/{id}/disposition with disposition = CONTINUE, or POST /fab/equipment/{id}/pm-complete on the implicated Equipment"
        actor: QualityManager
        preconditions:
          - "hold_state == QUAL_HOLD"
          - "hold_excursion_id == the dispositioned Excursion.id, or the pm-completed Equipment owns the Chamber named by hold_excursion_id's Excursion"
        side_effects:
          - "hold_state = NONE"
          - "hold_excursion_id = null"
          - "increments Lot.version by 1"
      - from: SPC_HOLD
        to: NONE
        trigger: "POST /fab/lots/{id}/rework"
        actor: ProcessEngineer
        preconditions:
          - "hold_state == SPC_HOLD"
          - "the Excursion named by hold_excursion_id has disposition == REWORK"
          - "rework_count < MAX_REWORK_COUNT"
          - "the ProcessStep at current_step_seq has a non-null rework_target_step_id"
        side_effects:
          - "current_step_seq = (the step_seq of the ProcessStep named by the current step's rework_target_step_id) - 1, so that the rework target step itself becomes the next admissible step"
          - "rework_count = rework_count + 1"
          - "hold_state = NONE"
          - "hold_excursion_id = null"
          - "increments Lot.version by 1"
      - from: ENGINEERING_HOLD
        to: NONE
        trigger: "POST /fab/lots/{id}/rejoin"
        actor: ProcessEngineer
        preconditions:
          - "hold_state == ENGINEERING_HOLD"
          - "lot_type == ENGINEERING_SPLIT"
          - "parent_lot_id is not null"
        side_effects:
          - "hold_state = NONE"
          - "flow_state = COMPLETED"
          - "parent Lot.wafer_count = parent.wafer_count + this.wafer_count"
          - "this.wafer_count = 0"
          - "increments Lot.version by 1 on both this Lot and the parent Lot"
    note: "hold_state dimension of Lot's parallel state machine."

  - entity: StepRun
    initial_state: OPEN
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /fab/step-runs/{id}/track-out"
        actor: Operator
        preconditions:
          - "status == OPEN"
          - "X-User-ID == operator_id"
          - "when ProcessStep.metrology_required == true: at least one MetrologyMeasurement exists with step_run_id == this.id"
        side_effects:
          - "status = COMPLETED"
          - "tracked_out_at = clock_now"
          - "actual_hours = round((tracked_out_at - tracked_in_at) in hours, 2)"
          - "Chamber.occupancy_state = FREE"
          - "Equipment.available_capacity_hours = round(available_capacity_hours + reserved_hours - actual_hours, 2)"
          - "Equipment.hours_since_pm = round(hours_since_pm + actual_hours, 2)"
          - "Lot.current_step_seq = ProcessStep.step_seq"
          - "when this was the highest step_seq in the flow: drives Lot through IN_PROCESS -> AT_SORT"
          - "when no OPEN StepRun remains on the Equipment: drives Equipment through PRODUCTIVE -> IDLE"
          - "increments StepRun.version by 1"
      - from: OPEN
        to: ABORTED
        trigger: "POST /fab/step-runs/{id}/abort, or system event: the run's Chamber leaves QUALIFIED via containment, or the run's Lot is SCRAPPED"
        actor: Operator
        preconditions:
          - "status == OPEN"
          - "for the operator-driven form: X-User-ID == operator_id"
        side_effects:
          - "status = ABORTED"
          - "tracked_out_at = clock_now"
          - "actual_hours stays null"
          - "Chamber.occupancy_state = FREE"
          - "Equipment.available_capacity_hours = round(available_capacity_hours + reserved_hours, 2) — the full reservation is credited back, leaving no drift (cascade hop 5)"
          - "Equipment.hours_since_pm unchanged"
          - "Lot.current_step_seq unchanged"
          - "when no OPEN StepRun remains on the Equipment and Equipment.state == PRODUCTIVE: drives Equipment through PRODUCTIVE -> IDLE"
          - "increments StepRun.version by 1"

  - entity: SpcChart
    initial_state: MONITORING
    terminal_states: []
    transitions:
      - from: MONITORING
        to: SUSPENDED
        trigger: "system event: Excursion containment with containment_scope == SPC_CHART on this chart"
        actor: system
        preconditions:
          - "status == MONITORING"
        side_effects:
          - "status = SUSPENDED"
          - "increments SpcChart.version by 1"
      - from: SUSPENDED
        to: MONITORING
        trigger: "POST /fab/excursions/{id}/disposition on the Excursion whose containment suspended this chart"
        actor: QualityManager
        preconditions:
          - "status == SUSPENDED"
        side_effects:
          - "status = MONITORING"
          - "consecutive_same_side_count = 0"
          - "last_side = NONE"
          - "increments SpcChart.version by 1"
        note: "Closes the chart cycle MONITORING -> SUSPENDED -> MONITORING."

  - entity: Excursion
    initial_state: OPEN
    terminal_states: [DISPOSITIONED]
    transitions:
      - from: OPEN
        to: CONTAINED
        trigger: "POST /fab/excursions/{id}/contain"
        actor: QualityManager
        preconditions:
          - "status == OPEN"
          - "source_type IN {SPC, DIE_SORT}"
        side_effects:
          - "severity_variant = FINAL"
          - "affected_lot_count and severity_score recomputed under the FINAL variant of calculations.excursion_severity_score"
          - "severity_band recomputed"
          - "containment_scope = the requested scope"
          - "contained_by_user_id = X-User-ID"
          - "status = CONTAINED"
          - "when containment_scope == SPC_CHART: drives SpcChart through MONITORING -> SUSPENDED and every Lot with an OPEN StepRun on SpcChart.step_id through NONE -> SPC_HOLD"
          - "when containment_scope == CHAMBER: drives that Chamber through QUALIFIED -> DISQUALIFIED, its OPEN StepRun through OPEN -> ABORTED, and that run's Lot to QUAL_HOLD"
          - "when containment_scope == EQUIPMENT: drives the Equipment through IDLE|PRODUCTIVE -> DOWN"
          - "increments Excursion.version by 1"
      - from: OPEN
        to: CONTAINED
        trigger: "system event: an Excursion with source_type == PARTICLE is created (contamination protocol contains immediately)"
        actor: system
        preconditions:
          - "status == OPEN"
          - "source_type == PARTICLE"
        side_effects:
          - "severity_variant = FINAL"
          - "affected_lot_count and severity_score computed under the FINAL variant"
          - "containment_scope = EQUIPMENT when trigger_value >= PARTICLE_TOOL_DOWN_MULT * Chamber.particle_limit, otherwise CHAMBER (cascade hop 2)"
          - "contained_by_user_id stays null"
          - "status = CONTAINED"
          - "when containment_scope == EQUIPMENT: drives the Equipment through IDLE|PRODUCTIVE -> DOWN (cascade hop 3)"
          - "when containment_scope == CHAMBER: drives the Chamber through QUALIFIED -> DISQUALIFIED"
          - "increments Excursion.version by 1"
      - from: CONTAINED
        to: DISPOSITIONED
        trigger: "POST /fab/excursions/{id}/disposition"
        actor: QualityManager
        preconditions:
          - "status == CONTAINED"
          - "X-User-ID != contained_by_user_id"
        side_effects:
          - "disposition = the requested disposition"
          - "dispositioned_by_user_id = X-User-ID"
          - "status = DISPOSITIONED"
          - "when disposition == CONTINUE: every Lot whose hold_excursion_id == this.id is driven back to hold_state NONE, and any SpcChart suspended by this excursion returns to MONITORING"
          - "when disposition == REWORK: affected Lots keep hold_state SPC_HOLD until POST /fab/lots/{id}/rework runs"
          - "when disposition == SCRAP: every affected Lot with flow_state IN {RELEASED, IN_PROCESS, AT_SORT} is driven to SCRAPPED"
          - "increments Excursion.version by 1"

  - entity: DieSortRun
    initial_state: SORTED
    terminal_states: [BINNED]
    transitions:
      - from: SORTED
        to: BINNED
        trigger: "POST /fab/die-sort-runs/{id}/bin"
        actor: YieldEngineer
        preconditions:
          - "status == SORTED"
          - "the Lot named by lot_id has flow_state == AT_SORT"
          - "premium_target_die + standard_target_die >= 0"
        side_effects:
          - "premium_target_die and standard_target_die recorded"
          - "premium_die, standard_die and value_die set from the waterfall stage of calculations.die_yield_and_speed_grade_allocation"
          - "status = BINNED"
          - "drives Lot through AT_SORT -> COMPLETED"
          - "increments DieSortRun.version by 1"

concurrency_rules:
  # ---------------------------------------------------------------- §1.2.1
  - rule_id: lot-release-stale-plan
    parent_entity: WaferStartPlan
    write_endpoint: "POST /fab/lots/{id}/release"
    occ_field: "expected_plan_version"
    description: |
      Releasing a Lot against a WaferStartPlan whose version has advanced since
      the client last observed it is rejected. A release legitimately debits the
      plan's remaining wafer starts, so a second release carrying a stale
      expected_plan_version would otherwise consume authorisation the client
      never saw allocated.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

  - rule_id: ecn-approve-stale-recipe
    parent_entity: Recipe
    write_endpoint: "POST /fab/change-requests/{id}/approve"
    occ_field: "expected_recipe_version"
    description: |
      Approving a RecipeChangeRequest against a Recipe whose version has advanced
      since the approver last read it is rejected. Approval pins
      pinned_recipe_revision from the Recipe as it stands, so an approval based on
      a stale read would pin a revision the approver never reviewed.
    error_id: ERR_STALE_RECIPE_VERSION
    http_status: 412

  - rule_id: lot-split-stale-lot
    parent_entity: Lot
    write_endpoint: "POST /fab/lots/{id}/splits"
    occ_field: "expected_lot_version"
    description: |
      Creating an engineering split against a parent Lot whose version has
      advanced since the engineer last observed it is rejected. Each split
      legitimately reduces the parent's wafer_count, so a split carved from a
      stale view of the parent would over-commit wafers that a prior split
      already removed.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

calculations:
  # ---------------------------------------------------------------- §1.3
  - name: spc_violation_classification
    trigger: "POST /fab/measurements — runs synchronously before the MetrologyMeasurement row is persisted"
    algorithm: threshold
    formula: |
      chart  = SpcChart named by spc_chart_id
      v      = measured_value
      delta  = v - chart.target
      deviation_sigma = round(abs(delta) / chart.sigma, 4)

      # boundary semantics are asymmetric on purpose:
      #   spec limits are STRICT   (v > usl  / v < lsl)
      #   control limits are INCLUSIVE (v >= ucl / v <= lcl)
      if   v > chart.usl or v < chart.lsl: classification = OUT_OF_SPEC
      elif v >= chart.ucl or v <= chart.lcl: classification = OUT_OF_CONTROL
      elif abs(delta) >= WARN_SIGMA_MULT * chart.sigma: classification = WARN
      else: classification = IN_CONTROL

      side = ABOVE if delta > 0 else (BELOW if delta < 0 else NONE)

      # Western Electric run rule: WE_RUN_LENGTH consecutive points on the same
      # side of the centre line and at least RUN_SIGMA_MULT sigma away from it.
      if abs(delta) >= RUN_SIGMA_MULT * chart.sigma and side == chart.last_side:
          chart.consecutive_same_side_count = chart.consecutive_same_side_count + 1
      elif abs(delta) >= RUN_SIGMA_MULT * chart.sigma:
          chart.consecutive_same_side_count = 1
      else:
          chart.consecutive_same_side_count = 0
      chart.last_side = side
      run_rule_triggered = chart.consecutive_same_side_count >= WE_RUN_LENGTH

      if classification IN {OUT_OF_CONTROL, OUT_OF_SPEC} or run_rule_triggered:
          chart.violation_count = chart.violation_count + 1
          open an Excursion with source_type = SPC, spc_chart_id = chart.id,
          lot_id = StepRun.lot_id, trigger_value = round(v, 4)
    input_set: "The single MetrologyMeasurement being created, plus the SpcChart's own consecutive_same_side_count and last_side as carried forward from the chart's prior measurements. Charts with status == SUSPENDED reject the measurement outright (ERR_SPC_CHART_SUSPENDED) and therefore contribute no state."
    constants:
      WARN_SIGMA_MULT: 2.0
      RUN_SIGMA_MULT: 1.0
      WE_RUN_LENGTH: 4
    precision: "measured_value and target 2 decimal places; deviation_sigma 4 decimal places, round_half_up; all limit comparisons exact on the stored 2-decimal values"

  - name: excursion_severity_score
    trigger: "Excursion creation (PROVISIONAL variant) and the OPEN -> CONTAINED transition (FINAL variant)"
    algorithm: weighted_scoring
    formula: |
      if source_type == SPC:
          chart = SpcChart named by spc_chart_id
          deviation_ratio = abs(trigger_value - chart.target) / (chart.usl - chart.target)
      elif source_type == DIE_SORT:
          deviation_ratio = trigger_value / MAX_YIELD_LOSS        # trigger_value is yield_loss_ratio
      else:  # PARTICLE
          deviation_ratio = trigger_value / Chamber.particle_limit

      base    = DEVIATION_WEIGHT * min(1.0, deviation_ratio)
      spread  = LOT_WEIGHT * min(LOT_CAP, affected_lot_count)
      spec    = OOS_PENALTY if the opening measurement's classification == OUT_OF_SPEC else 0.0
      severity_score = round(base + spread + spec, 2)

      severity_band = HIGH   if severity_score >= HIGH_BAND
                      MEDIUM if severity_score >= MEDIUM_BAND
                      LOW    otherwise
    input_set: |
      affected_lot_count is the only input that differs between the two variants; every
      other term is identical. Both variants count DISTINCT StepRun.lot_id values.
        SPC / PROVISIONAL:  StepRun.step_id == SpcChart.step_id
                            AND StepRun.status == OPEN
                            AND Lot.flow_state IN {RELEASED, IN_PROCESS}
        SPC / FINAL:        StepRun.step_id == SpcChart.step_id
                            AND StepRun.status IN {OPEN, COMPLETED}
                            AND Lot.flow_state IN {RELEASED, IN_PROCESS, AT_SORT, COMPLETED}
        PARTICLE / PROVISIONAL: StepRun.chamber_id == Excursion.chamber_id
                            AND StepRun.status == OPEN
                            AND Lot.flow_state IN {RELEASED, IN_PROCESS}
        PARTICLE / FINAL:   StepRun.chamber_id == Excursion.chamber_id
                            AND StepRun.status IN {OPEN, COMPLETED, ABORTED}
                            AND Lot.flow_state IN {RELEASED, IN_PROCESS, AT_SORT, COMPLETED}
        DIE_SORT / PROVISIONAL: exactly 1 (the DieSortRun's own Lot)
        DIE_SORT / FINAL:   count of DISTINCT Lot.id where Lot.flow_id == the sort lot's flow_id
                            AND Lot.flow_state IN {RELEASED, IN_PROCESS, AT_SORT, COMPLETED}
      No ordering is involved, so no tie-break is required.
    constants:
      DEVIATION_WEIGHT: 60.0
      LOT_WEIGHT: 3.0
      LOT_CAP: 10
      OOS_PENALTY: 10.0
      MAX_YIELD_LOSS: 0.25
      MEDIUM_BAND: 40.0
      HIGH_BAND: 70.0
      PARTICLE_TOOL_DOWN_MULT: 2.0
    precision: "2 decimal places, round_half_up; deviation_ratio evaluated at full float precision and only the final score is rounded"
    variants:
      - name: PROVISIONAL
        when: "At Excursion creation, before any human has looked at it. Set on every SPC- and DIE_SORT-sourced excursion."
        difference: "affected_lot_count counts only lots whose StepRun on the implicated step is still OPEN (for DIE_SORT: exactly the sort run's own lot) — the narrow 'what is in the tool right now' set."
      - name: FINAL
        when: "At the OPEN -> CONTAINED transition (explicit for SPC/DIE_SORT, automatic for PARTICLE)."
        difference: "affected_lot_count widens to include lots whose StepRun on the implicated step has already COMPLETED (and, for PARTICLE, ABORTED), and admits AT_SORT and COMPLETED lots — the retrospective 'what material was exposed' set. Identical data therefore yields a strictly larger affected_lot_count and can push severity_band up a band."

  - name: chamber_dispatch_score
    trigger: "POST /fab/step-runs — selects the chamber the run is opened on"
    algorithm: weighted_scoring
    formula: |
      # (a) eligibility filter — the candidate set, as an explicit predicate
      candidates = every Chamber c such that
            Equipment(c.equipment_id).tool_type == Recipe(ProcessStep.recipe_id).tool_type
        AND c.qualified_recipe_id == ProcessStep.recipe_id
        AND c.qual_state == QUALIFIED
        AND c.occupancy_state == FREE
        AND c.particle_count <= c.particle_limit
        AND Equipment(c.equipment_id).state IN {IDLE, PRODUCTIVE}
        AND clock_now < c.qual_expires_at
        AND (Equipment(c.equipment_id).purge_until IS NULL OR clock_now > Equipment(c.equipment_id).purge_until)

      # (b) ranking expression
      qual_remaining_ratio = max(0.0, (c.qual_expires_at - clock_now) / (c.qual_expires_at - c.qualified_at))
      pm_term = 0.0 if Lot.priority_class == SUPER_HOT
                else PM_WEIGHT * min(1.0, Equipment.hours_since_pm / Equipment.pm_interval_hours)
      score(c) = round(100.0
                       - QUAL_DECAY_WEIGHT * (1.0 - qual_remaining_ratio)
                       - PARTICLE_WEIGHT   * min(1.0, c.particle_count / c.particle_limit)
                       - pm_term, 2)
      order by score(c) DESC

      # (c) tie-break: ascending chamber_code (a business key, never `id`)
      # (d) empty candidate set -> ERR_NO_QUALIFIED_CHAMBER (409); no run is created
      winner = first row of: candidates sorted by (score DESC, chamber_code ASC)
      StepRun.chamber_id = winner.id
      StepRun.dispatch_score = score(winner)
    input_set: "All Chamber rows passing the eligibility filter above. Chambers on Equipment in state PM or DOWN are excluded by the filter, as are chambers whose qualification has lapsed and chambers already OCCUPIED by an OPEN StepRun."
    constants:
      QUAL_DECAY_WEIGHT: 40.0
      PARTICLE_WEIGHT: 25.0
      PM_WEIGHT: 20.0
    precision: "2 decimal places, round_half_up; intermediate ratios at full float precision, only score(c) rounded before comparison"
    variants:
      - name: STANDARD_QUEUE
        when: "Lot.priority_class IN {STANDARD, HOT}"
        difference: "pm_term is the full PM-proximity penalty, so a tool approaching its PM interval loses up to 20 points."
      - name: SUPER_HOT_WAIVER
        when: "Lot.priority_class == SUPER_HOT"
        difference: "pm_term is forced to 0.0 — a super-hot lot ignores PM proximity entirely, which can change which chamber wins for exactly the same chamber population."

  - name: die_yield_and_speed_grade_allocation
    trigger: "POST /fab/die-sort-runs (yield and signature stages) and POST /fab/die-sort-runs/{id}/bin (waterfall stage)"
    algorithm: waterfall_allocation
    formula: |
      # ---- stage 1: yield. ROUNDING ORDER IS PINNED: round per wafer FIRST,
      #      then average, then round the average. (Pooling good/tested across
      #      wafers and rounding once gives a DIFFERENT number; that order is
      #      explicitly NOT used.)
      for each element w of wafer_results (ascending w.wafer_slot):
          wafer_yield(w) = round(w.good_die / w.tested_die, 4)
      sort_yield = round(sum(wafer_yield(w) for w in wafer_results) / count(wafer_results), 4)
      good_die_total = sum(w.good_die for w in wafer_results)
      yield_loss_ratio = round(max(0.0, (baseline_yield - sort_yield) / baseline_yield), 4)

      # ---- stage 2: failure signature classification (wafer map)
      total_EDGE_RING       = sum(w.edge_ring_fails)
      total_CENTER_CLUSTER  = sum(w.center_cluster_fails)
      total_SCRATCH_LINE    = sum(w.scratch_line_fails)
      total_PARAMETRIC_SHIFT= sum(w.parametric_shift_fails)
      total_fails = total_EDGE_RING + total_CENTER_CLUSTER + total_SCRATCH_LINE + total_PARAMETRIC_SHIFT
      if total_fails == 0:
          dominant_signature = NONE                      # zero-fail edge: no division
      else:
          share(m) = round(total_m / total_fails, 4) for each of the four modes
          top = max(share(m))
          if top < DOMINANCE_THRESHOLD: dominant_signature = NONE
          else: dominant_signature = the first mode in SIGNATURE_PRECEDENCE order
                                     whose share(m) == top
      if yield_loss_ratio >= SORT_EXCURSION_THRESHOLD:
          open an Excursion with source_type = DIE_SORT, die_sort_run_id = this.id,
          lot_id = this.lot_id, trigger_value = yield_loss_ratio,
          failure_signature = dominant_signature

      # ---- stage 3: speed-grade waterfall (runs only at bin time)
      premium_die  = min(premium_target_die, good_die_total)
      standard_die = min(standard_target_die, good_die_total - premium_die)
      value_die    = good_die_total - premium_die - standard_die
      # invariant: premium_die + standard_die + value_die == good_die_total
    input_set: "Every element of the DieSortRun's own wafer_results array, processed in ascending wafer_slot order (ordering is immaterial to the sum but pinned for reproducibility). No other DieSortRun contributes."
    constants:
      DOMINANCE_THRESHOLD: 0.45
      SIGNATURE_PRECEDENCE: [SCRATCH_LINE, EDGE_RING, CENTER_CLUSTER, PARAMETRIC_SHIFT]
      SORT_EXCURSION_THRESHOLD: 0.10
    precision: "wafer_yield, sort_yield, yield_loss_ratio and share(m) all 4 decimal places, round_half_up; die counts are integers with no rounding"

  - name: lot_cycle_time_days
    trigger: "GET /fab/lots/{id}/cycle-time-projection (projection variant) and the Lot AT_SORT -> COMPLETED transition (chronological variant)"
    algorithm: forward_looking
    formula: |
      # ---- projection variant (forward-looking)
      remaining_standard_hours = round(sum(ProcessStep.standard_hours
                                           where ProcessStep.flow_id == Lot.flow_id
                                             AND ProcessStep.step_seq > Lot.current_step_seq), 2)
      queue_factor = QUEUE_FACTOR[Lot.priority_class]
      projected_remaining_days = round(remaining_standard_hours * queue_factor / 24.0, 3)
      elapsed_days = round((clock_now - Lot.released_at) in seconds / 86400.0, 3)
      projected_cycle_time_days = round(elapsed_days + projected_remaining_days, 3)
      cycle_time_status = AT_RISK if projected_cycle_time_days > WaferStartPlan.cycle_time_target_days
                          else ON_TARGET

      # ---- chronological variant (actual)
      actual_cycle_time_days = round((Lot.completed_at - Lot.released_at) in seconds / 86400.0, 3)
    input_set: "Projection: every ProcessStep of the lot's flow with step_seq strictly greater than Lot.current_step_seq — i.e. the not-yet-completed remainder, inflated by the priority-class queue factor rather than by observed queueing. Chronological: only the lot's own released_at and completed_at stamps; no step data at all."
    constants:
      QUEUE_FACTOR: { STANDARD: 1.60, HOT: 1.25, SUPER_HOT: 1.05 }
    precision: "3 decimal places, round_half_up"
    variants:
      - name: projection
        when: "Any time before the lot reaches COMPLETED, via GET /fab/lots/{id}/cycle-time-projection."
        difference: "Adds a modelled remainder (remaining standard hours x queue factor) on top of observed elapsed time, so it is strictly greater than elapsed time whenever any step remains."
      - name: chronological
        when: "Pinned once, at the AT_SORT -> COMPLETED transition, into Lot.actual_cycle_time_days."
        difference: "Pure wall-to-wall logical-clock difference with no queue factor and no step data. For the same lot at the same clock instant it disagrees with the projection by exactly projected_remaining_days."

  - name: wafer_start_capacity_commitment
    trigger: "POST /fab/wafer-start-plans/{id}/commit"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED. The tier looks circular (the surcharge inflates
      # the hours, and the hours pick the tier) — it is resolved by selecting the
      # tier from the PRE-SURCHARGE utilisation only. The surcharge never re-tiers.
      1. base_hours       = round(planned_wafer_starts * ProcessFlow.total_standard_hours, 2)
      2. pre_utilization   = round(base_hours / capacity_budget_hours, 4)
      3. commitment_tier   = TIER_3 if pre_utilization >= TIER_3_MIN
                             TIER_2 if pre_utilization >= TIER_2_MIN
                             TIER_1 if pre_utilization >= TIER_1_MIN
                             TIER_0 otherwise
      4. surcharge_rate    = SURCHARGE_RATE[commitment_tier]
      5. surcharge_hours   = round(base_hours * surcharge_rate, 2)
      6. committed_hours   = round(base_hours + surcharge_hours, 2)
      7. if committed_hours > capacity_budget_hours: reject with ERR_CAPACITY_BUDGET_EXCEEDED
         and persist nothing (the plan stays DRAFT with committed_hours 0.0)
    input_set: "The plan's own planned_wafer_starts and capacity_budget_hours, plus ProcessFlow.total_standard_hours as pinned at the flow's release. Steps added to the flow after release cannot change it because the flow is no longer DRAFT."
    constants:
      TIER_1_MIN: 0.50
      TIER_2_MIN: 0.70
      TIER_3_MIN: 0.90
      SURCHARGE_RATE: { TIER_0: 0.00, TIER_1: 0.05, TIER_2: 0.12, TIER_3: 0.25 }
    precision: "hours 2 decimal places, pre_utilization 4 decimal places, round_half_up; tier thresholds are inclusive lower bounds (>=)"

  - name: recipe_change_risk_score
    trigger: "POST /fab/recipes/{id}/change-requests and POST /fab/change-requests/{id}/resubmit"
    algorithm: weighted_scoring
    formula: |
      # three inputs interacting non-linearly: a discrete class weight, a
      # normalised-and-clamped relative delta, and a normalised-and-clamped
      # blast-radius count. Both continuous terms saturate.
      class_weight     = CLASS_WEIGHT[change_class]
      relative_delta   = abs(proposed_target - Recipe.target_value) / Recipe.target_value
      impact_lot_count = count of DISTINCT Lot.id where
                              Lot.flow_state IN {RELEASED, IN_PROCESS}
                          AND exists ProcessStep s with s.flow_id == Lot.flow_id
                                 AND s.recipe_id == Recipe.id
                                 AND s.step_seq > Lot.current_step_seq
      risk_score = round(class_weight
                         + DELTA_WEIGHT  * min(1.0, relative_delta / DELTA_NORM)
                         + IMPACT_WEIGHT * min(1.0, impact_lot_count / IMPACT_NORM), 2)
      requires_full_requal = risk_score >= REQUAL_THRESHOLD
    input_set: "Lots that have been released but not yet passed the affected step (flow_state RELEASED or IN_PROCESS, and at least one remaining step on this recipe). PLANNED, AT_SORT, COMPLETED and SCRAPPED lots are excluded — they can no longer be harmed by the change."
    constants:
      CLASS_WEIGHT: { MINOR: 10.0, MAJOR: 35.0, CRITICAL: 60.0 }
      DELTA_WEIGHT: 25.0
      DELTA_NORM: 0.10
      IMPACT_WEIGHT: 15.0
      IMPACT_NORM: 20.0
      REQUAL_THRESHOLD: 70.0
      MAX_REVISION_ROUNDS: 2
    precision: "2 decimal places, round_half_up; REQUAL_THRESHOLD is an inclusive lower bound (>=)"

  - name: equipment_capacity_hours_ledger
    trigger: "POST /fab/step-runs, POST /fab/step-runs/{id}/track-out, POST /fab/step-runs/{id}/abort, POST /fab/equipment/{id}/pm-complete"
    algorithm: aggregation
    formula: |
      track-in : available_capacity_hours -= ProcessStep.standard_hours   (recorded as StepRun.reserved_hours)
      track-out: available_capacity_hours += StepRun.reserved_hours
                 available_capacity_hours -= StepRun.actual_hours
                 hours_since_pm           += StepRun.actual_hours
      abort    : available_capacity_hours += StepRun.reserved_hours       (full credit, hours_since_pm untouched)
      pm-complete: available_capacity_hours = INITIAL_CAPACITY_HOURS; hours_since_pm = 0.0

      # CONSERVED QUANTITY (checked after every mutation):
      available_capacity_hours
        == INITIAL_CAPACITY_HOURS
           - sum(StepRun.actual_hours where status == COMPLETED and chamber_id belongs to this Equipment
                 and tracked_in_at > Equipment.pm_started_at or Equipment.pm_started_at IS NULL)
           - sum(StepRun.reserved_hours where status == OPEN and chamber_id belongs to this Equipment)
      # A track-in followed by an abort therefore returns available_capacity_hours
      # to exactly its pre-track-in value, with zero drift.
    input_set: "StepRun rows whose chamber_id belongs to this Equipment, restricted to those opened after the most recent pm-complete (all of them when the tool has never been maintained). ABORTED runs contribute 0 to both sums."
    constants:
      INITIAL_CAPACITY_HOURS: 720.0
    precision: "2 decimal places, round_half_up, applied after every individual ledger mutation"

  - name: wafer_inventory_conservation
    trigger: "POST /fab/lots/{id}/splits and POST /fab/lots/{id}/rejoin"
    algorithm: aggregation
    formula: |
      split : parent.wafer_count -= split_wafer_count
              child = new Lot(parent_lot_id = parent.id, lot_type = ENGINEERING_SPLIT,
                              wafer_count = split_wafer_count,
                              origin_wafer_count = split_wafer_count,
                              plan_id = parent.plan_id, flow_id = parent.flow_id,
                              flow_state = RELEASED, hold_state = ENGINEERING_HOLD,
                              current_step_seq = parent.current_step_seq)
      rejoin: parent.wafer_count += child.wafer_count
              child.wafer_count = 0
              child.flow_state = COMPLETED

      # CONSERVED QUANTITY (checked after every split and every rejoin):
      parent.wafer_count
        + sum(c.wafer_count for c in Lot where c.parent_lot_id == parent.id
              and c.flow_state != SCRAPPED)
        == parent.origin_wafer_count
      # Splits never touch WaferStartPlan.released_wafer_starts: the wafers were
      # already counted against the plan when the parent was released.
    input_set: "The parent Lot and every child Lot with parent_lot_id == parent.id and flow_state != SCRAPPED. SCRAPPED children leave the conserved pool permanently, which is why the invariant excludes them."
    constants:
      MAX_REWORK_COUNT: 2
    precision: "integer wafer counts; no rounding"

  - name: plan_start_ledger
    trigger: "POST /fab/lots/{id}/release"
    algorithm: threshold
    formula: |
      candidate = WaferStartPlan.released_wafer_starts + Lot.wafer_count
      if candidate > WaferStartPlan.planned_wafer_starts: reject with ERR_PLAN_STARTS_EXCEEDED
      WaferStartPlan.released_wafer_starts = candidate
      if candidate == WaferStartPlan.planned_wafer_starts:
          drive WaferStartPlan through COMMITTED -> CLOSED
    input_set: "Lot rows with plan_id == this plan that have completed the PLANNED -> RELEASED transition. Lots with lot_type == ENGINEERING_SPLIT never enter this ledger."
    constants: {}
    precision: "integer wafer counts; the ceiling comparison is strict (>) and the close comparison is exact equality (==)"

validations:
  # ---------------------------------------------------------------- §1.4
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "Every required field in the endpoint's input is present; every value satisfies its declared type, enum membership and numeric range (including per-element shape of wafer_results and certified_tool_types); pagination limit is within 1..100 and offset >= 0"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Every {id} segment in the path resolves to an existing row, validated left to right"
    error_id: "ERR_PROCESS_FLOW_NOT_FOUND | ERR_PROCESS_STEP_NOT_FOUND | ERR_RECIPE_NOT_FOUND | ERR_CHANGE_REQUEST_NOT_FOUND | ERR_EQUIPMENT_NOT_FOUND | ERR_CHAMBER_NOT_FOUND | ERR_OPERATOR_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_STEP_RUN_NOT_FOUND | ERR_SPC_CHART_NOT_FOUND | ERR_EXCURSION_NOT_FOUND | ERR_SORT_RUN_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row (flow_id, recipe_id, rework_target_step_id, equipment_id, qualified_recipe_id, step_id, lot_id, operator_id, spc_chart_id, step_run_id, supersedes_flow_id)"
    error_id: "ERR_PROCESS_FLOW_NOT_FOUND | ERR_PROCESS_STEP_NOT_FOUND | ERR_RECIPE_NOT_FOUND | ERR_EQUIPMENT_NOT_FOUND | ERR_CHAMBER_NOT_FOUND | ERR_OPERATOR_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_STEP_RUN_NOT_FOUND | ERR_SPC_CHART_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints carrying foreign keys in the body"
  - priority: 6
    category: auth
    check: "When X-User-Role == Operator, X-User-ID equals the operator_id of the StepRun being acted on (or the operator_id in the body for a track-in), and equals the {id} of the Operator being patched"
    error_id: ERR_OPERATOR_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "POST /fab/step-runs, POST /fab/step-runs/{id}/track-out, POST /fab/step-runs/{id}/abort, POST /fab/measurements, PATCH /fab/operators/{id}"
  - priority: 7
    category: auth
    check: "X-User-ID differs from RecipeChangeRequest.author_user_id (segregation of duties: an engineer may not approve their own change notice)"
    error_id: ERR_SOD_SELF_APPROVAL
    http_status: 409
    applies_to: "POST /fab/change-requests/{id}/approve"
  - priority: 8
    category: auth
    check: "X-User-ID differs from Excursion.contained_by_user_id (segregation of duties: the containing engineer may not disposition their own containment)"
    error_id: ERR_SOD_SELF_DISPOSITION
    http_status: 409
    applies_to: "POST /fab/excursions/{id}/disposition"
  - priority: 9
    category: state
    check: "expected_plan_version equals WaferStartPlan.version"
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412
    applies_to: "POST /fab/lots/{id}/release"
  - priority: 10
    category: state
    check: "expected_recipe_version equals Recipe.version"
    error_id: ERR_STALE_RECIPE_VERSION
    http_status: 412
    applies_to: "POST /fab/change-requests/{id}/approve"
  - priority: 11
    category: state
    check: "expected_lot_version equals the parent Lot.version"
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412
    applies_to: "POST /fab/lots/{id}/splits"
  - priority: 12
    category: state
    check: "ProcessFlow.status == DRAFT"
    error_id: ERR_FLOW_NOT_DRAFT
    http_status: 409
    applies_to: "POST /fab/process-flows/{id}/steps, POST /fab/process-flows/{id}/release"
  - priority: 13
    category: state
    check: "ProcessFlow.status == RELEASED for the flow a plan is being written against, and for the flow named by supersedes_flow_id"
    error_id: ERR_FLOW_NOT_RELEASED
    http_status: 409
    applies_to: "POST /fab/wafer-start-plans, POST /fab/process-flows/{id}/release"
  - priority: 14
    category: state
    check: "WaferStartPlan.status == DRAFT"
    error_id: ERR_PLAN_ALREADY_COMMITTED
    http_status: 409
    applies_to: "POST /fab/wafer-start-plans/{id}/commit"
  - priority: 15
    category: state
    check: "WaferStartPlan.status == COMMITTED"
    error_id: ERR_PLAN_NOT_COMMITTED
    http_status: 409
    applies_to: "POST /fab/lots/{id}/release"
  - priority: 16
    category: state
    check: "Lot.flow_state is admissible for the operation: PLANNED for release; RELEASED or IN_PROCESS for step-runs, splits and rework; AT_SORT for die-sort-runs"
    error_id: ERR_LOT_INVALID_STATE
    http_status: 409
    applies_to: "POST /fab/lots/{id}/release, POST /fab/lots/{id}/splits, POST /fab/lots/{id}/rework, POST /fab/step-runs, POST /fab/die-sort-runs"
  - priority: 17
    category: state
    check: "Lot.hold_state == NONE"
    error_id: ERR_LOT_ON_HOLD
    http_status: 409
    applies_to: "POST /fab/step-runs, POST /fab/die-sort-runs"
  - priority: 18
    category: state
    check: "RecipeChangeRequest.status is admissible: SUBMITTED for request-revision and approve; REVISION_REQUESTED for resubmit; APPROVED for implement"
    error_id: ERR_CHANGE_REQUEST_INVALID_STATE
    http_status: 409
    applies_to: "POST /fab/change-requests/{id}/request-revision, POST /fab/change-requests/{id}/resubmit, POST /fab/change-requests/{id}/approve, POST /fab/change-requests/{id}/implement"
  - priority: 19
    category: state
    check: "Excursion.status == OPEN for contain and CONTAINED for disposition; contain additionally requires source_type IN {SPC, DIE_SORT} because PARTICLE excursions are contained automatically at creation"
    error_id: ERR_EXCURSION_INVALID_STATE
    http_status: 409
    applies_to: "POST /fab/excursions/{id}/contain, POST /fab/excursions/{id}/disposition"
  - priority: 20
    category: state
    check: "StepRun.status == OPEN"
    error_id: ERR_STEP_RUN_NOT_OPEN
    http_status: 409
    applies_to: "POST /fab/step-runs/{id}/track-out, POST /fab/step-runs/{id}/abort, POST /fab/measurements"
  - priority: 21
    category: state
    check: "DieSortRun.status == SORTED"
    error_id: ERR_SORT_RUN_ALREADY_BINNED
    http_status: 409
    applies_to: "POST /fab/die-sort-runs/{id}/bin"
  - priority: 22
    category: state
    check: "Equipment.state == PM for pm-complete"
    error_id: ERR_EQUIPMENT_NOT_IN_PM
    http_status: 409
    applies_to: "POST /fab/equipment/{id}/pm-complete"
  - priority: 23
    category: state
    check: "Equipment.state is not DOWN and not PM for the tool whose chamber a qualification run targets"
    error_id: ERR_EQUIPMENT_DOWN
    http_status: 409
    applies_to: "POST /fab/chambers/{id}/qualification-runs"
  - priority: 24
    category: state
    check: "SpcChart.status == MONITORING"
    error_id: ERR_SPC_CHART_SUSPENDED
    http_status: 409
    applies_to: "POST /fab/measurements"
  - priority: 25
    category: state
    check: "Recipe.status == QUALIFIED (cross-entity: an approved-but-unimplemented change notice blocks chamber qualification and any production run of the recipe; a second notice on the same recipe may still be approved, and each approval pins its own Recipe.revision, which priority 26 reconciles at implement time)"
    error_id: ERR_RECIPE_RESTRICTED
    http_status: 409
    applies_to: "POST /fab/chambers/{id}/qualification-runs, POST /fab/step-runs"
  - priority: 26
    category: state
    check: "Recipe.revision equals RecipeChangeRequest.pinned_recipe_revision (version pinning: the recipe must not have moved since approval)"
    error_id: ERR_PINNED_REVISION_STALE
    http_status: 409
    applies_to: "POST /fab/change-requests/{id}/implement"
  - priority: 27
    category: business_safety
    check: "Operator.cert_status == ACTIVE"
    error_id: ERR_OPERATOR_CERT_INACTIVE
    http_status: 403
    applies_to: "POST /fab/step-runs, POST /fab/step-runs/{id}/track-out, POST /fab/measurements, PATCH /fab/operators/{id} when gown_state is supplied"
  - priority: 28
    category: business_safety
    check: "Operator.gown_state == GOWNED (cleanroom gowning protocol)"
    error_id: ERR_OPERATOR_NOT_GOWNED
    http_status: 403
    applies_to: "POST /fab/step-runs, POST /fab/step-runs/{id}/track-out, POST /fab/measurements"
  - priority: 29
    category: business_safety
    check: "Recipe.tool_type of the requested step appears in Operator.certified_tool_types"
    error_id: ERR_OPERATOR_NOT_CERTIFIED
    http_status: 403
    applies_to: "POST /fab/step-runs"
  - priority: 30
    category: business_referential
    check: "ProcessStep.flow_id equals Lot.flow_id"
    error_id: ERR_STEP_FLOW_MISMATCH
    http_status: 422
    applies_to: "POST /fab/step-runs"
  - priority: 31
    category: business_referential
    check: "ProcessStep.step_seq is the lowest step_seq in the lot's flow strictly greater than Lot.current_step_seq"
    error_id: ERR_STEP_SEQUENCE_VIOLATION
    http_status: 422
    applies_to: "POST /fab/step-runs"
  - priority: 32
    category: business_referential
    check: "SpcChart.step_id equals the StepRun's step_id"
    error_id: ERR_CHART_STEP_MISMATCH
    http_status: 422
    applies_to: "POST /fab/measurements"
  - priority: 33
    category: business_referential
    check: "ProcessStep.metrology_required == true for the step the measurement is being recorded against"
    error_id: ERR_METROLOGY_NOT_REQUIRED
    http_status: 422
    applies_to: "POST /fab/measurements"
  - priority: 34
    category: business_referential
    check: "WaferStartPlan.product_family equals ProcessFlow.product_family, and Lot.flow_id equals WaferStartPlan.flow_id"
    error_id: ERR_PRODUCT_FAMILY_MISMATCH
    http_status: 422
    applies_to: "POST /fab/wafer-start-plans, POST /fab/lots"
  - priority: 35
    category: business_referential
    check: "The ProcessStep at the lot's current_step_seq declares a non-null rework_target_step_id"
    error_id: ERR_REWORK_TARGET_NOT_SET
    http_status: 422
    applies_to: "POST /fab/lots/{id}/rework"
  - priority: 36
    category: business_referential
    check: "Lot.lot_type == ENGINEERING_SPLIT and Lot.parent_lot_id is not null"
    error_id: ERR_NOT_A_SPLIT_LOT
    http_status: 422
    applies_to: "POST /fab/lots/{id}/rejoin"
  - priority: 37
    category: business_temporal
    check: "The chamber's Equipment is outside its post-PM purge interval: purge_until IS NULL or clock_now > purge_until (closed interval — a track-in at exactly purge_until is still rejected)"
    error_id: ERR_PM_PURGE_ACTIVE
    http_status: 409
    applies_to: "POST /fab/step-runs"
  - priority: 38
    category: business_temporal
    check: "At least one candidate chamber has clock_now < qual_expires_at; candidates whose qualification has lapsed are first driven QUALIFIED -> QUAL_EXPIRED and then excluded"
    error_id: ERR_CHAMBER_QUAL_EXPIRED
    http_status: 409
    applies_to: "POST /fab/step-runs"
  - priority: 39
    category: business_constraint
    check: "The chamber eligibility filter of calculations.chamber_dispatch_score yields a non-empty candidate set"
    error_id: ERR_NO_QUALIFIED_CHAMBER
    http_status: 409
    applies_to: "POST /fab/step-runs"
  - priority: 40
    category: business_constraint
    check: "flow_code, recipe_code, lot_number, equipment_code and badge_id are globally unique; ProcessStep.step_seq is unique per flow_id; Chamber.chamber_code is unique per equipment_id"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /fab/process-flows, POST /fab/process-flows/{id}/steps, POST /fab/recipes, POST /fab/equipment, POST /fab/chambers, POST /fab/operators, POST /fab/lots"
  - priority: 41
    category: business_constraint
    check: "1 <= split_wafer_count < parent Lot.wafer_count"
    error_id: ERR_INVALID_SPLIT_QUANTITY
    http_status: 422
    applies_to: "POST /fab/lots/{id}/splits"
  - priority: 42
    category: business_constraint
    check: "Lot.rework_count < MAX_REWORK_COUNT"
    error_id: ERR_REWORK_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /fab/lots/{id}/rework"
  - priority: 43
    category: business_constraint
    check: "wafer_results is non-empty and, per element, good_die <= tested_die and edge_ring_fails + center_cluster_fails + scratch_line_fails + parametric_shift_fails == tested_die - good_die"
    error_id: ERR_WAFER_RESULT_INCONSISTENT
    http_status: 422
    applies_to: "POST /fab/die-sort-runs"
  - priority: 44
    category: business_constraint
    check: "At least one MetrologyMeasurement exists for the run when its ProcessStep.metrology_required == true"
    error_id: ERR_METROLOGY_MISSING
    http_status: 409
    applies_to: "POST /fab/step-runs/{id}/track-out"
  - priority: 45
    category: business_constraint
    check: "ProcessFlow has at least one ProcessStep and every one of them resolves a Recipe with status == QUALIFIED"
    error_id: ERR_FLOW_HAS_NO_STEPS
    http_status: 422
    applies_to: "POST /fab/process-flows/{id}/release"
  - priority: 46
    category: business_fiscal
    check: "WaferStartPlan.released_wafer_starts + Lot.wafer_count <= WaferStartPlan.planned_wafer_starts"
    error_id: ERR_PLAN_STARTS_EXCEEDED
    http_status: 409
    applies_to: "POST /fab/lots/{id}/release"
  - priority: 47
    category: business_fiscal
    check: "committed_hours computed by calculations.wafer_start_capacity_commitment <= capacity_budget_hours"
    error_id: ERR_CAPACITY_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /fab/wafer-start-plans/{id}/commit"
  - priority: 48
    category: business_fiscal
    check: "The winning chamber's Equipment.available_capacity_hours >= ProcessStep.standard_hours"
    error_id: ERR_EQUIPMENT_CAPACITY_EXHAUSTED
    http_status: 409
    applies_to: "POST /fab/step-runs"
  - priority: 49
    category: state
    check: "Chamber.qual_state IN {UNQUALIFIED, QUAL_EXPIRED} for a qualification run; an already QUALIFIED chamber must lapse or be disqualified first, and a DISQUALIFIED chamber must be cleared through pm-complete"
    error_id: ERR_CHAMBER_INVALID_QUAL_STATE
    http_status: 409
    applies_to: "POST /fab/chambers/{id}/qualification-runs"
  - priority: 50
    category: state
    check: "Equipment.state IN {IDLE, DOWN} for a PM start; a PRODUCTIVE tool must track out or abort its OPEN step runs first, and a tool already in PM cannot restart PM"
    error_id: ERR_EQUIPMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /fab/equipment/{id}/pm-start"

endpoints:
  # ---------------------------------------------------------------- §1.5
  # --- process flow definition & change control
  - method: POST
    path: "/fab/process-flows"
    description: "Create a DRAFT process flow for a product family."
    roles: [ProcessEngineer]
    code: 201
    input: [flow_code, product_family]
    output: ProcessFlow
    side_effects: ["status = DRAFT", "step_count = 0", "total_standard_hours = 0.0", "revision = 1"]
  - method: POST
    path: "/fab/process-flows/{id}/steps"
    description: "Append a step to a DRAFT flow."
    roles: [ProcessEngineer]
    code: 201
    input: [recipe_id, step_seq, step_name, standard_hours, "metrology_required?", "rework_target_step_id?"]
    output: ProcessStep
    side_effects: ["recomputes ProcessFlow.step_count and ProcessFlow.total_standard_hours", "increments ProcessFlow.version by 1"]
  - method: POST
    path: "/fab/process-flows/{id}/release"
    description: "Release a DRAFT flow for production, optionally superseding a currently RELEASED flow of the same product family."
    roles: [ProcessEngineer]
    code: 200
    input: ["supersedes_flow_id?"]
    output: ProcessFlow
    side_effects: ["drives ProcessFlow DRAFT -> RELEASED", "pins total_standard_hours and step_count", "when supersedes_flow_id supplied: drives that flow RELEASED -> OBSOLETE and sets its superseded_by_flow_id"]
  - method: GET
    path: "/fab/process-flows/{id}"
    description: "Read one process flow."
    roles: [ProcessEngineer, FabPlanner, QualityManager, EquipmentEngineer, YieldEngineer, Operator]
    code: 200
    input: []
    output: ProcessFlow
    side_effects: []
  - method: GET
    path: "/fab/process-flows"
    description: "List process flows, filterable by product family, status and superseding flow."
    roles: [ProcessEngineer, FabPlanner, QualityManager, EquipmentEngineer, YieldEngineer, Operator]
    code: 200
    input: ["product_family?", "status?", "superseded_by_flow_id?", "limit?", "offset?"]
    output: ProcessFlow[]
    side_effects: []
  - method: GET
    path: "/fab/process-steps/{id}"
    description: "Read one process step."
    roles: [ProcessEngineer, FabPlanner, QualityManager, EquipmentEngineer, YieldEngineer, Operator]
    code: 200
    input: []
    output: ProcessStep
    side_effects: []
  - method: GET
    path: "/fab/process-steps"
    description: "List process steps, filterable by flow, recipe and rework target."
    roles: [ProcessEngineer, FabPlanner, QualityManager, EquipmentEngineer, YieldEngineer, Operator]
    code: 200
    input: ["flow_id?", "recipe_id?", "rework_target_step_id?", "limit?", "offset?"]
    output: ProcessStep[]
    side_effects: []

  - method: POST
    path: "/fab/recipes"
    description: "Create a QUALIFIED recipe."
    roles: [ProcessEngineer]
    code: 201
    input: [recipe_code, tool_type, target_value, "qual_expiry_days?"]
    output: Recipe
    side_effects: ["status = QUALIFIED", "revision = 1", "restricted_reason = NONE"]
  - method: GET
    path: "/fab/recipes/{id}"
    description: "Read one recipe."
    roles: [ProcessEngineer, FabPlanner, QualityManager, EquipmentEngineer, YieldEngineer, Operator]
    code: 200
    input: []
    output: Recipe
    side_effects: []
  - method: GET
    path: "/fab/recipes"
    description: "List recipes, filterable by tool type and status; ordered by created_at ASC."
    roles: [ProcessEngineer, FabPlanner, QualityManager, EquipmentEngineer, YieldEngineer, Operator]
    code: 200
    input: ["tool_type?", "status?", "limit?", "offset?"]
    output: Recipe[]
    side_effects: []
  - method: POST
    path: "/fab/recipes/{id}/change-requests"
    description: "Author an engineering change notice against a recipe; scores it immediately."
    roles: [ProcessEngineer]
    code: 201
    input: [change_class, proposed_target, justification]
    output: RecipeChangeRequest
    side_effects: ["author_user_id = X-User-ID", "status = SUBMITTED", "revision_round = 0", "computes impact_lot_count, risk_score and requires_full_requal via calculations.recipe_change_risk_score"]
  - method: GET
    path: "/fab/change-requests/{id}"
    description: "Read one engineering change notice."
    roles: [ProcessEngineer, QualityManager, YieldEngineer]
    code: 200
    input: []
    output: RecipeChangeRequest
    side_effects: []
  - method: GET
    path: "/fab/change-requests"
    description: "List engineering change notices, filterable by recipe and status."
    roles: [ProcessEngineer, QualityManager, YieldEngineer]
    code: 200
    input: ["recipe_id?", "status?", "limit?", "offset?"]
    output: RecipeChangeRequest[]
    side_effects: []
  - method: POST
    path: "/fab/change-requests/{id}/request-revision"
    description: "Send a submitted change notice back for revision; the third such request rejects it outright."
    roles: [QualityManager]
    code: 200
    input: [reviewer_comment]
    output: RecipeChangeRequest
    side_effects: ["drives SUBMITTED -> REVISION_REQUESTED, or SUBMITTED -> REJECTED when revision_round >= MAX_REVISION_ROUNDS"]
  - method: POST
    path: "/fab/change-requests/{id}/resubmit"
    description: "Re-author a change notice after a revision request; rescores it."
    roles: [ProcessEngineer]
    code: 200
    input: [change_class, proposed_target, justification]
    output: RecipeChangeRequest
    side_effects: ["drives REVISION_REQUESTED -> SUBMITTED", "revision_round += 1", "recomputes impact_lot_count, risk_score and requires_full_requal"]
  - method: POST
    path: "/fab/change-requests/{id}/approve"
    description: "Approve a submitted change notice; pins the recipe revision and restricts the recipe until implementation."
    roles: [QualityManager]
    code: 200
    input: [expected_recipe_version]
    output: RecipeChangeRequest
    side_effects: ["drives SUBMITTED -> APPROVED", "pinned_recipe_revision = Recipe.revision", "approver_user_id = X-User-ID", "drives Recipe QUALIFIED -> RESTRICTED when the Recipe is still QUALIFIED; a Recipe already RESTRICTED by a sibling approval stays RESTRICTED", "increments Recipe.version by 1"]
  - method: POST
    path: "/fab/change-requests/{id}/implement"
    description: "Implement an approved change notice, advancing the recipe revision and cascading requalification when required."
    roles: [ProcessEngineer]
    code: 200
    input: []
    output: RecipeChangeRequest
    side_effects: ["drives APPROVED -> IMPLEMENTED", "drives Recipe RESTRICTED -> QUALIFIED with target_value = proposed_target and revision += 1", "when requires_full_requal: cascades QUALIFIED -> UNQUALIFIED on every Chamber qualified on this recipe and QUAL_HOLD on their in-process lots"]

  # --- SPC charts
  - method: POST
    path: "/fab/spc-charts"
    description: "Attach an SPC chart to a metrology-bearing process step."
    roles: [ProcessEngineer, QualityManager]
    code: 201
    input: [step_id, param_name, target, sigma, usl, lsl, ucl, lcl]
    output: SpcChart
    side_effects: ["status = MONITORING", "consecutive_same_side_count = 0", "last_side = NONE", "violation_count = 0"]
  - method: GET
    path: "/fab/spc-charts/{id}"
    description: "Read one SPC chart."
    roles: [ProcessEngineer, QualityManager, YieldEngineer, Operator]
    code: 200
    input: []
    output: SpcChart
    side_effects: []
  - method: GET
    path: "/fab/spc-charts"
    description: "List SPC charts, filterable by step."
    roles: [ProcessEngineer, QualityManager, YieldEngineer, Operator]
    code: 200
    input: ["step_id?", "status?", "limit?", "offset?"]
    output: SpcChart[]
    side_effects: []

  # --- equipment, chambers, PM, contamination
  - method: POST
    path: "/fab/equipment"
    description: "Commission a tool. hours_since_pm may be seeded to reflect productive time accrued before commissioning into this system."
    roles: [EquipmentEngineer]
    code: 201
    input: [equipment_code, tool_type, "pm_interval_hours?", "purge_buffer_hours?", "hours_since_pm?"]
    output: Equipment
    side_effects: ["state = IDLE", "available_capacity_hours = INITIAL_CAPACITY_HOURS"]
  - method: GET
    path: "/fab/equipment/{id}"
    description: "Read one tool."
    roles: [EquipmentEngineer, ProcessEngineer, FabPlanner, QualityManager, YieldEngineer, Operator]
    code: 200
    input: []
    output: Equipment
    side_effects: []
  - method: GET
    path: "/fab/equipment"
    description: "List tools, filterable by tool type and state."
    roles: [EquipmentEngineer, ProcessEngineer, FabPlanner, QualityManager, YieldEngineer, Operator]
    code: 200
    input: ["tool_type?", "state?", "limit?", "offset?"]
    output: Equipment[]
    side_effects: []
  - method: POST
    path: "/fab/equipment/{id}/pm-start"
    description: "Take a tool down for preventive maintenance."
    roles: [EquipmentEngineer]
    code: 200
    input: [pm_reason]
    output: Equipment
    side_effects: ["drives Equipment IDLE|DOWN -> PM", "pm_started_at = clock_now"]
  - method: POST
    path: "/fab/equipment/{id}/pm-complete"
    description: "Finish preventive maintenance, reset the capacity ledger and open the purge window."
    roles: [EquipmentEngineer]
    code: 200
    input: []
    output: Equipment
    side_effects: ["drives Equipment PM -> IDLE", "hours_since_pm = 0.0", "available_capacity_hours = INITIAL_CAPACITY_HOURS", "purge_until = clock_now + purge_buffer_hours", "drives DISQUALIFIED chambers of this tool to UNQUALIFIED", "releases QUAL_HOLD lots held by excursions on this tool's chambers"]
  - method: POST
    path: "/fab/chambers"
    description: "Add a chamber to a tool, set up for exactly one recipe."
    roles: [EquipmentEngineer]
    code: 201
    input: [equipment_id, chamber_code, qualified_recipe_id, "particle_limit?"]
    output: Chamber
    side_effects: ["qual_state = UNQUALIFIED", "occupancy_state = FREE", "particle_count = 0.0"]
  - method: GET
    path: "/fab/chambers/{id}"
    description: "Read one chamber."
    roles: [EquipmentEngineer, ProcessEngineer, FabPlanner, QualityManager, YieldEngineer, Operator]
    code: 200
    input: []
    output: Chamber
    side_effects: []
  - method: GET
    path: "/fab/chambers"
    description: "List chambers, filterable by tool, set-up recipe and qualification state."
    roles: [EquipmentEngineer, ProcessEngineer, FabPlanner, QualityManager, YieldEngineer, Operator]
    code: 200
    input: ["equipment_id?", "qualified_recipe_id?", "qual_state?", "limit?", "offset?"]
    output: Chamber[]
    side_effects: []
  - method: POST
    path: "/fab/chambers/{id}/qualification-runs"
    description: "Record a chamber qualification run against its set-up recipe. qual_result is one of {PASS, FAIL}; a FAIL run is recorded but drives no transition, so the chamber keeps its current qual_state, qualified_at and qual_expires_at and its version still increments. Runs are only accepted while qual_state is UNQUALIFIED or QUAL_EXPIRED (priority 49)."
    roles: [EquipmentEngineer]
    code: 200
    input: [qual_result]
    output: Chamber
    side_effects: ["with qual_result == PASS: drives Chamber UNQUALIFIED|QUAL_EXPIRED -> QUALIFIED", "with qual_result == PASS: qualified_at = clock_now", "with qual_result == PASS: qual_expires_at = clock_now + Recipe.qual_expiry_days days", "with qual_result == FAIL: no state change; qual_state, qualified_at and qual_expires_at are left untouched", "increments Chamber.version by 1"]
  - method: POST
    path: "/fab/chambers/{id}/particle-readings"
    description: "Record a cleanroom particle reading on a chamber. A reading above the chamber limit opens a PARTICLE excursion that contains itself immediately."
    roles: [EquipmentEngineer, QualityManager]
    code: 200
    input: [particle_reading]
    output: Chamber
    side_effects: ["particle_count = particle_reading", "when particle_reading > particle_limit: opens a PARTICLE Excursion with trigger_value = particle_reading and drives it OPEN -> CONTAINED automatically, cascading CHAMBER or EQUIPMENT containment"]

  # --- operators & gowning
  - method: POST
    path: "/fab/operators"
    description: "Register a cleanroom operator."
    roles: [QualityManager]
    code: 201
    input: [badge_id, full_name, certified_tool_types]
    output: Operator
    side_effects: ["gown_state = STREET", "cert_status = ACTIVE"]
  - method: GET
    path: "/fab/operators/{id}"
    description: "Read one operator."
    roles: [QualityManager, EquipmentEngineer, ProcessEngineer, FabPlanner, YieldEngineer, Operator]
    code: 200
    input: []
    output: Operator
    side_effects: []
  - method: GET
    path: "/fab/operators"
    description: "List operators, filterable by certification standing and gowning posture."
    roles: [QualityManager, EquipmentEngineer, ProcessEngineer, FabPlanner, YieldEngineer, Operator]
    code: 200
    input: ["cert_status?", "gown_state?", "limit?", "offset?"]
    output: Operator[]
    side_effects: []
  - method: PATCH
    path: "/fab/operators/{id}"
    description: "Update an operator's gowning posture (Operator, self only) or certification standing (QualityManager)."
    roles: [Operator, QualityManager]
    code: 200
    input: ["gown_state?", "cert_status?"]
    output: Operator
    side_effects: ["drives the gown_state dimension STREET <-> GOWNED", "drives the cert_status dimension ACTIVE <-> SUSPENDED -> REVOKED", "a REVOKED certification forces gown_state to STREET"]

  # --- wafer start planning
  - method: POST
    path: "/fab/wafer-start-plans"
    description: "Draft a weekly wafer start plan against a released flow."
    roles: [FabPlanner]
    code: 201
    input: [flow_id, product_family, week_start_date, planned_wafer_starts, capacity_budget_hours, cycle_time_target_days]
    output: WaferStartPlan
    side_effects: ["status = DRAFT", "released_wafer_starts = 0", "committed_hours = 0.0", "commitment_tier = TIER_0"]
  - method: GET
    path: "/fab/wafer-start-plans/{id}"
    description: "Read one wafer start plan."
    roles: [FabPlanner, ProcessEngineer, QualityManager, YieldEngineer, EquipmentEngineer]
    code: 200
    input: []
    output: WaferStartPlan
    side_effects: []
  - method: GET
    path: "/fab/wafer-start-plans"
    description: "List wafer start plans, filterable by flow and status."
    roles: [FabPlanner, ProcessEngineer, QualityManager, YieldEngineer, EquipmentEngineer]
    code: 200
    input: ["flow_id?", "status?", "limit?", "offset?"]
    output: WaferStartPlan[]
    side_effects: []
  - method: POST
    path: "/fab/wafer-start-plans/{id}/commit"
    description: "Commit a draft plan; prices its capacity commitment through the utilisation tier ladder."
    roles: [FabPlanner]
    code: 200
    input: []
    output: WaferStartPlan
    side_effects: ["drives WaferStartPlan DRAFT -> COMMITTED", "sets commitment_tier, surcharge_hours and committed_hours via calculations.wafer_start_capacity_commitment"]

  # --- lots
  - method: POST
    path: "/fab/lots"
    description: "Create a PLANNED production lot against a committed-or-draft plan."
    roles: [FabPlanner]
    code: 201
    input: [plan_id, flow_id, lot_number, wafer_count, "priority_class?"]
    output: Lot
    side_effects: ["flow_state = PLANNED", "hold_state = NONE", "lot_type = PRODUCTION", "origin_wafer_count = wafer_count", "current_step_seq = 0"]
  - method: GET
    path: "/fab/lots/{id}"
    description: "Read one lot."
    roles: [FabPlanner, ProcessEngineer, QualityManager, YieldEngineer, EquipmentEngineer, Operator]
    code: 200
    input: []
    output: Lot
    side_effects: []
  - method: GET
    path: "/fab/lots"
    description: "List lots, filterable by plan, flow, parent lot, holding excursion, hold state and priority."
    roles: [FabPlanner, ProcessEngineer, QualityManager, YieldEngineer, EquipmentEngineer, Operator]
    code: 200
    input: ["plan_id?", "flow_id?", "parent_lot_id?", "hold_excursion_id?", "hold_state?", "flow_state?", "priority_class?", "limit?", "offset?"]
    output: Lot[]
    side_effects: []
  - method: POST
    path: "/fab/lots/{id}/release"
    description: "Release a planned lot into the fab, debiting the plan's authorised wafer starts under optimistic concurrency on the plan."
    roles: [FabPlanner]
    code: 200
    input: [expected_plan_version]
    output: Lot
    side_effects: ["drives Lot PLANNED -> RELEASED", "released_at = clock_now", "WaferStartPlan.released_wafer_starts += wafer_count", "increments WaferStartPlan.version by 1", "closes the plan when released_wafer_starts == planned_wafer_starts"]
  - method: POST
    path: "/fab/lots/{id}/splits"
    description: "Carve an engineering split lot out of an in-fab lot for a process experiment, under optimistic concurrency on the parent lot."
    roles: [ProcessEngineer]
    code: 201
    input: [split_wafer_count, lot_number, expected_lot_version, "priority_class?"]
    output: Lot
    side_effects: ["parent Lot.wafer_count -= split_wafer_count", "increments parent Lot.version by 1", "child Lot created with lot_type = ENGINEERING_SPLIT, flow_state = RELEASED, hold_state = ENGINEERING_HOLD, parent_lot_id = parent id, current_step_seq = parent.current_step_seq", "WaferStartPlan.released_wafer_starts unchanged"]
  - method: POST
    path: "/fab/lots/{id}/rejoin"
    description: "Fold an engineering split lot back into its parent, restoring the wafer inventory."
    roles: [ProcessEngineer]
    code: 200
    input: []
    output: Lot
    side_effects: ["parent Lot.wafer_count += this Lot.wafer_count", "this Lot.wafer_count = 0", "drives this Lot hold_state ENGINEERING_HOLD -> NONE and flow_state -> COMPLETED", "increments both Lot.version values by 1"]
  - method: POST
    path: "/fab/lots/{id}/rework"
    description: "Rewind a lot held for rework back to its step's rework target."
    roles: [ProcessEngineer]
    code: 200
    input: []
    output: Lot
    side_effects: ["current_step_seq = rework target step_seq - 1", "rework_count += 1", "drives Lot hold_state SPC_HOLD -> NONE"]
  - method: GET
    path: "/fab/lots/{id}/cycle-time-projection"
    description: "Forward-looking cycle time projection for a released lot, using the priority-class queue factor over the remaining standard hours."
    roles: [FabPlanner, ProcessEngineer, QualityManager, YieldEngineer]
    code: 200
    input: []
    output: { remaining_standard_hours: number, queue_factor: number, projected_remaining_days: number, elapsed_days: number, projected_cycle_time_days: number, cycle_time_status: string }
    side_effects: []

  # --- step runs, dispatch, metrology
  - method: POST
    path: "/fab/step-runs"
    description: "Track a lot into its next step. The server selects the chamber by dispatch score; the client never names one."
    roles: [Operator]
    code: 201
    input: [lot_id, step_id, operator_id]
    output: StepRun
    side_effects: ["selects chamber_id and dispatch_score via calculations.chamber_dispatch_score", "reserved_hours = ProcessStep.standard_hours", "Chamber.occupancy_state = OCCUPIED", "Equipment.available_capacity_hours -= reserved_hours", "drives Equipment IDLE -> PRODUCTIVE", "drives Lot RELEASED -> IN_PROCESS", "drives lapsed candidate chambers QUALIFIED -> QUAL_EXPIRED"]
  - method: GET
    path: "/fab/step-runs/{id}"
    description: "Read one step run."
    roles: [Operator, ProcessEngineer, QualityManager, YieldEngineer, EquipmentEngineer, FabPlanner]
    code: 200
    input: []
    output: StepRun
    side_effects: []
  - method: GET
    path: "/fab/step-runs"
    description: "List step runs, filterable by lot, step, chamber, operator and status."
    roles: [Operator, ProcessEngineer, QualityManager, YieldEngineer, EquipmentEngineer, FabPlanner]
    code: 200
    input: ["lot_id?", "step_id?", "chamber_id?", "operator_id?", "status?", "limit?", "offset?"]
    output: StepRun[]
    side_effects: []
  - method: POST
    path: "/fab/step-runs/{id}/track-out"
    description: "Complete an open step run, charging actual hours to the tool ledger."
    roles: [Operator]
    code: 200
    input: []
    output: StepRun
    side_effects: ["drives StepRun OPEN -> COMPLETED", "actual_hours computed", "Equipment.available_capacity_hours += reserved_hours - actual_hours", "Equipment.hours_since_pm += actual_hours", "Chamber.occupancy_state = FREE", "Lot.current_step_seq = ProcessStep.step_seq", "drives Lot IN_PROCESS -> AT_SORT on the final step", "drives Equipment PRODUCTIVE -> IDLE when no OPEN run remains"]
  - method: POST
    path: "/fab/step-runs/{id}/abort"
    description: "Abort an open step run, crediting the full reservation back to the tool ledger."
    roles: [Operator]
    code: 200
    input: [abort_reason]
    output: StepRun
    side_effects: ["drives StepRun OPEN -> ABORTED", "actual_hours stays null", "Equipment.available_capacity_hours += reserved_hours", "Equipment.hours_since_pm unchanged", "Chamber.occupancy_state = FREE", "Lot.current_step_seq unchanged", "drives Equipment PRODUCTIVE -> IDLE when no OPEN run remains"]
  - method: POST
    path: "/fab/measurements"
    description: "Record an in-line metrology reading against an SPC chart on an open run; classifies it and may open an excursion."
    roles: [Operator]
    code: 201
    input: [step_run_id, spc_chart_id, measured_value]
    output: MetrologyMeasurement
    side_effects: ["classification, deviation_sigma and run_rule_triggered set via calculations.spc_violation_classification", "updates SpcChart.consecutive_same_side_count, last_side and violation_count", "opens a PROVISIONAL SPC Excursion and sets excursion_id when the reading is OUT_OF_CONTROL, OUT_OF_SPEC or completes a run rule"]
  - method: GET
    path: "/fab/measurements/{id}"
    description: "Read one metrology measurement."
    roles: [Operator, ProcessEngineer, QualityManager, YieldEngineer]
    code: 200
    input: []
    output: MetrologyMeasurement
    side_effects: []
  - method: GET
    path: "/fab/measurements"
    description: "List metrology measurements, filterable by run, chart and excursion."
    roles: [Operator, ProcessEngineer, QualityManager, YieldEngineer]
    code: 200
    input: ["step_run_id?", "spc_chart_id?", "excursion_id?", "classification?", "limit?", "offset?"]
    output: MetrologyMeasurement[]
    side_effects: []

  # --- excursion response
  - method: GET
    path: "/fab/excursions/{id}"
    description: "Read one excursion."
    roles: [QualityManager, YieldEngineer, ProcessEngineer, EquipmentEngineer, FabPlanner]
    code: 200
    input: []
    output: Excursion
    side_effects: []
  - method: GET
    path: "/fab/excursions"
    description: "List excursions, filterable by each polymorphic source pointer, lot, source type and status."
    roles: [QualityManager, YieldEngineer, ProcessEngineer, EquipmentEngineer, FabPlanner]
    code: 200
    input: ["spc_chart_id?", "die_sort_run_id?", "chamber_id?", "lot_id?", "source_type?", "status?", "limit?", "offset?"]
    output: Excursion[]
    side_effects: []
  - method: POST
    path: "/fab/excursions/{id}/contain"
    description: "Contain an SPC- or die-sort-sourced excursion at a chosen blast radius; finalises the severity score."
    roles: [QualityManager]
    code: 200
    input: [containment_scope, "chamber_id?"]
    output: Excursion
    side_effects: ["drives Excursion OPEN -> CONTAINED", "severity_variant = FINAL with affected_lot_count and severity_score recomputed", "contained_by_user_id = X-User-ID", "fires the SPC_CHART, CHAMBER or EQUIPMENT containment cascade"]
  - method: POST
    path: "/fab/excursions/{id}/disposition"
    description: "Disposition a contained excursion. The dispositioning engineer must differ from the containing engineer."
    roles: [QualityManager, YieldEngineer]
    code: 200
    input: [disposition, root_cause_note]
    output: Excursion
    side_effects: ["drives Excursion CONTAINED -> DISPOSITIONED", "dispositioned_by_user_id = X-User-ID", "every disposition value returns the chart suspended by this excursion's containment through SUSPENDED -> MONITORING (see state_machines.SpcChart)", "CONTINUE additionally releases the holds this excursion placed (SPC_HOLD or QUAL_HOLD -> NONE)", "REWORK leaves lots on SPC_HOLD awaiting rework", "SCRAP drives affected lots to SCRAPPED and aborts their open runs"]

  # --- test, sort and binning
  - method: POST
    path: "/fab/die-sort-runs"
    description: "Record wafer-map sort results for a lot at sort; computes yield and the dominant failure signature."
    roles: [YieldEngineer]
    code: 201
    input: [lot_id, gross_die_per_wafer, baseline_yield, wafer_results]
    output: DieSortRun
    side_effects: ["sort_yield, yield_loss_ratio, good_die_total and dominant_signature set via calculations.die_yield_and_speed_grade_allocation", "status = SORTED", "opens a PROVISIONAL DIE_SORT Excursion when yield_loss_ratio >= SORT_EXCURSION_THRESHOLD"]
  - method: GET
    path: "/fab/die-sort-runs/{id}"
    description: "Read one die sort run."
    roles: [YieldEngineer, ProcessEngineer, QualityManager, FabPlanner]
    code: 200
    input: []
    output: DieSortRun
    side_effects: []
  - method: GET
    path: "/fab/die-sort-runs"
    description: "List die sort runs, filterable by lot and status."
    roles: [YieldEngineer, ProcessEngineer, QualityManager, FabPlanner]
    code: 200
    input: ["lot_id?", "status?", "dominant_signature?", "limit?", "offset?"]
    output: DieSortRun[]
    side_effects: []
  - method: POST
    path: "/fab/die-sort-runs/{id}/bin"
    description: "Allocate the good die pool to speed grades through the premium/standard/value waterfall and complete the lot."
    roles: [YieldEngineer]
    code: 200
    input: [premium_target_die, standard_target_die]
    output: DieSortRun
    side_effects: ["premium_die, standard_die and value_die set by the waterfall stage", "drives DieSortRun SORTED -> BINNED", "drives Lot AT_SORT -> COMPLETED with actual_cycle_time_days pinned"]

  # --- test-driving surface
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [FabPlanner, ProcessEngineer, EquipmentEngineer, QualityManager, YieldEngineer, Operator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["all subsequent clock_now reads return to_iso8601"]

errors:
  # ---------------------------------------------------------------- §1.6
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role not a declared role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The caller's role is not listed on the target endpoint"
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing required field, wrong type, enum member outside its constraint set, out-of-range number, malformed wafer_results element, or pagination limit outside 1..100"
  - id: ERR_PROCESS_FLOW_NOT_FOUND
    http: 404
    condition: "No ProcessFlow with the given id (path or supersedes_flow_id / flow_id in body)"
  - id: ERR_PROCESS_STEP_NOT_FOUND
    http: 404
    condition: "No ProcessStep with the given id (path, step_id or rework_target_step_id)"
  - id: ERR_RECIPE_NOT_FOUND
    http: 404
    condition: "No Recipe with the given id (path, recipe_id or qualified_recipe_id)"
  - id: ERR_CHANGE_REQUEST_NOT_FOUND
    http: 404
    condition: "No RecipeChangeRequest with the given id"
  - id: ERR_EQUIPMENT_NOT_FOUND
    http: 404
    condition: "No Equipment with the given id (path or equipment_id)"
  - id: ERR_CHAMBER_NOT_FOUND
    http: 404
    condition: "No Chamber with the given id (path or chamber_id)"
  - id: ERR_OPERATOR_NOT_FOUND
    http: 404
    condition: "No Operator with the given id (path or operator_id)"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "No WaferStartPlan with the given id (path or plan_id)"
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "No Lot with the given id (path or lot_id)"
  - id: ERR_STEP_RUN_NOT_FOUND
    http: 404
    condition: "No StepRun with the given id (path or step_run_id)"
  - id: ERR_SPC_CHART_NOT_FOUND
    http: 404
    condition: "No SpcChart with the given id (path or spc_chart_id)"
  - id: ERR_EXCURSION_NOT_FOUND
    http: 404
    condition: "No Excursion with the given id"
  - id: ERR_SORT_RUN_NOT_FOUND
    http: 404
    condition: "No DieSortRun with the given id"
  - id: ERR_OPERATOR_IDENTITY_MISMATCH
    http: 403
    condition: "Role Operator acting with an X-User-ID that is not the operator_id of the run (or the patched operator's id)"
  - id: ERR_SOD_SELF_APPROVAL
    http: 409
    condition: "Approver X-User-ID equals RecipeChangeRequest.author_user_id"
  - id: ERR_SOD_SELF_DISPOSITION
    http: 409
    condition: "Dispositioning X-User-ID equals Excursion.contained_by_user_id"
  - id: ERR_STALE_PLAN_VERSION
    http: 412
    condition: "expected_plan_version does not equal WaferStartPlan.version at lot release"
  - id: ERR_STALE_RECIPE_VERSION
    http: 412
    condition: "expected_recipe_version does not equal Recipe.version at change-notice approval"
  - id: ERR_STALE_LOT_VERSION
    http: 412
    condition: "expected_lot_version does not equal the parent Lot.version at split creation"
  - id: ERR_FLOW_NOT_DRAFT
    http: 409
    condition: "Step insertion or release attempted on a ProcessFlow whose status is not DRAFT"
  - id: ERR_FLOW_NOT_RELEASED
    http: 409
    condition: "Plan creation against a flow that is not RELEASED, or supersedes_flow_id naming a flow that is not RELEASED"
  - id: ERR_FLOW_HAS_NO_STEPS
    http: 422
    condition: "Release attempted on a flow with zero steps, or with a step whose recipe is RESTRICTED"
  - id: ERR_PLAN_ALREADY_COMMITTED
    http: 409
    condition: "Commit attempted on a WaferStartPlan whose status is not DRAFT"
  - id: ERR_PLAN_NOT_COMMITTED
    http: 409
    condition: "Lot release attempted while the WaferStartPlan status is DRAFT or CLOSED"
  - id: ERR_LOT_INVALID_STATE
    http: 409
    condition: "Lot.flow_state is not admissible for the requested operation"
  - id: ERR_LOT_ON_HOLD
    http: 409
    condition: "Step run or die sort attempted while Lot.hold_state is not NONE"
  - id: ERR_CHANGE_REQUEST_INVALID_STATE
    http: 409
    condition: "RecipeChangeRequest.status is not admissible for the requested transition"
  - id: ERR_EXCURSION_INVALID_STATE
    http: 409
    condition: "Contain attempted on an excursion that is not OPEN or whose source_type is PARTICLE, or disposition attempted on an excursion that is not CONTAINED"
  - id: ERR_STEP_RUN_NOT_OPEN
    http: 409
    condition: "Track-out, abort or measurement attempted on a StepRun whose status is not OPEN"
  - id: ERR_SORT_RUN_ALREADY_BINNED
    http: 409
    condition: "Bin attempted on a DieSortRun whose status is already BINNED"
  - id: ERR_EQUIPMENT_NOT_IN_PM
    http: 409
    condition: "pm-complete attempted on Equipment whose state is not PM"
  - id: ERR_EQUIPMENT_INVALID_STATE
    http: 409
    condition: "PM start attempted on a tool whose state is PRODUCTIVE or already PM"
  - id: ERR_EQUIPMENT_DOWN
    http: 409
    condition: "Qualification run attempted on a chamber whose parent Equipment.state is DOWN or PM"
  - id: ERR_SPC_CHART_SUSPENDED
    http: 409
    condition: "Measurement recorded against an SpcChart whose status is SUSPENDED"
  - id: ERR_RECIPE_RESTRICTED
    http: 409
    condition: "Chamber qualification or production run attempted while Recipe.status is RESTRICTED"
  - id: ERR_PINNED_REVISION_STALE
    http: 409
    condition: "Implement attempted when Recipe.revision no longer equals RecipeChangeRequest.pinned_recipe_revision"
  - id: ERR_OPERATOR_CERT_INACTIVE
    http: 403
    condition: "Acting Operator.cert_status is SUSPENDED or REVOKED"
  - id: ERR_OPERATOR_NOT_GOWNED
    http: 403
    condition: "Acting Operator.gown_state is STREET"
  - id: ERR_OPERATOR_NOT_CERTIFIED
    http: 403
    condition: "The step's recipe tool_type is absent from Operator.certified_tool_types"
  - id: ERR_STEP_FLOW_MISMATCH
    http: 422
    condition: "The requested ProcessStep belongs to a different ProcessFlow than the Lot"
  - id: ERR_STEP_SEQUENCE_VIOLATION
    http: 422
    condition: "The requested step is not the lot's next admissible step by step_seq"
  - id: ERR_CHART_STEP_MISMATCH
    http: 422
    condition: "SpcChart.step_id does not equal the StepRun's step_id"
  - id: ERR_METROLOGY_NOT_REQUIRED
    http: 422
    condition: "Measurement recorded on a step whose metrology_required is false"
  - id: ERR_METROLOGY_MISSING
    http: 409
    condition: "Track-out attempted on a metrology-required step with no measurement recorded"
  - id: ERR_PRODUCT_FAMILY_MISMATCH
    http: 422
    condition: "Plan product_family differs from the flow's, or Lot.flow_id differs from the plan's flow_id"
  - id: ERR_REWORK_TARGET_NOT_SET
    http: 422
    condition: "Rework attempted at a step whose rework_target_step_id is null"
  - id: ERR_NOT_A_SPLIT_LOT
    http: 422
    condition: "Rejoin attempted on a lot that is not an ENGINEERING_SPLIT with a parent"
  - id: ERR_PM_PURGE_ACTIVE
    http: 409
    condition: "Track-in attempted while clock_now <= Equipment.purge_until"
  - id: ERR_CHAMBER_QUAL_EXPIRED
    http: 409
    condition: "Every candidate chamber for the step has clock_now >= qual_expires_at"
  - id: ERR_NO_QUALIFIED_CHAMBER
    http: 409
    condition: "The chamber eligibility filter yields an empty candidate set for reasons other than a uniform qualification lapse"
  - id: ERR_CHAMBER_INVALID_QUAL_STATE
    http: 409
    condition: "Qualification run attempted on a Chamber whose qual_state is already QUALIFIED or is DISQUALIFIED"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "flow_code, recipe_code, equipment_code, badge_id or lot_number already used; or step_seq duplicated within a flow; or chamber_code duplicated within a tool"
  - id: ERR_INVALID_SPLIT_QUANTITY
    http: 422
    condition: "split_wafer_count is below 1 or is not strictly less than the parent lot's wafer_count"
  - id: ERR_REWORK_LIMIT_EXCEEDED
    http: 409
    condition: "Rework attempted when Lot.rework_count already equals MAX_REWORK_COUNT"
  - id: ERR_WAFER_RESULT_INCONSISTENT
    http: 422
    condition: "wafer_results empty, good_die above tested_die, or the four fail counts not summing to tested_die - good_die"
  - id: ERR_PLAN_STARTS_EXCEEDED
    http: 409
    condition: "Releasing the lot would push released_wafer_starts above planned_wafer_starts"
  - id: ERR_CAPACITY_BUDGET_EXCEEDED
    http: 409
    condition: "committed_hours after the tier surcharge exceeds capacity_budget_hours"
  - id: ERR_EQUIPMENT_CAPACITY_EXHAUSTED
    http: 409
    condition: "The winning chamber's tool has less available_capacity_hours than the step's standard_hours"

roles:
  # ---------------------------------------------------------------- §1.7
  - name: ProcessEngineer
    description: "Owns process flow definition, recipes, engineering change notices, engineering split lots and rework."
    identity: "opaque"
    exclusive_operations:
      - "POST /fab/process-flows"
      - "POST /fab/process-flows/{id}/steps"
      - "POST /fab/process-flows/{id}/release"
      - "POST /fab/recipes"
      - "POST /fab/recipes/{id}/change-requests"
      - "POST /fab/change-requests/{id}/resubmit"
      - "POST /fab/change-requests/{id}/implement"
      - "POST /fab/lots/{id}/splits"
      - "POST /fab/lots/{id}/rejoin"
      - "POST /fab/lots/{id}/rework"
    shared_operations:
      - "POST /fab/spc-charts (with QualityManager)"
      - "POST /_clock/set_current_utc (with all roles)"
      - "all GET endpoints"
  - name: QualityManager
    description: "Owns change-notice review and approval, excursion containment, operator certification and cleanroom protocol enforcement. May never approve a change notice they authored, nor disposition an excursion they contained."
    identity: "opaque"
    exclusive_operations:
      - "POST /fab/change-requests/{id}/request-revision"
      - "POST /fab/change-requests/{id}/approve"
      - "POST /fab/excursions/{id}/contain"
      - "POST /fab/operators"
    shared_operations:
      - "POST /fab/excursions/{id}/disposition (with YieldEngineer)"
      - "PATCH /fab/operators/{id} (cert_status only; gown_state is the Operator's own)"
      - "POST /fab/chambers/{id}/particle-readings (with EquipmentEngineer)"
      - "POST /fab/spc-charts (with ProcessEngineer)"
      - "POST /_clock/set_current_utc (with all roles)"
      - "all GET endpoints"
  - name: EquipmentEngineer
    description: "Owns tools, chambers, preventive maintenance and chamber qualification."
    identity: "opaque"
    exclusive_operations:
      - "POST /fab/equipment"
      - "POST /fab/equipment/{id}/pm-start"
      - "POST /fab/equipment/{id}/pm-complete"
      - "POST /fab/chambers"
      - "POST /fab/chambers/{id}/qualification-runs"
    shared_operations:
      - "POST /fab/chambers/{id}/particle-readings (with QualityManager)"
      - "POST /_clock/set_current_utc (with all roles)"
      - "all GET endpoints"
  - name: FabPlanner
    description: "Owns wafer start planning, capacity commitment and lot release."
    identity: "opaque"
    exclusive_operations:
      - "POST /fab/wafer-start-plans"
      - "POST /fab/wafer-start-plans/{id}/commit"
      - "POST /fab/lots"
      - "POST /fab/lots/{id}/release"
    shared_operations:
      - "POST /_clock/set_current_utc (with all roles)"
      - "all GET endpoints"
  - name: YieldEngineer
    description: "Owns test, die sort, wafer-map yield analysis and speed-grade binning; may disposition excursions contained by someone else."
    identity: "opaque"
    exclusive_operations:
      - "POST /fab/die-sort-runs"
      - "POST /fab/die-sort-runs/{id}/bin"
    shared_operations:
      - "POST /fab/excursions/{id}/disposition (with QualityManager)"
      - "POST /_clock/set_current_utc (with all roles)"
      - "all GET endpoints"
  - name: Operator
    description: "Cleanroom operator who tracks lots in and out and records metrology. X-User-ID is the id of the Operator row acting."
    identity: "entity_backed:Operator"
    exclusive_operations:
      - "POST /fab/step-runs"
      - "POST /fab/step-runs/{id}/track-out"
      - "POST /fab/step-runs/{id}/abort"
      - "POST /fab/measurements"
    shared_operations:
      - "PATCH /fab/operators/{id} (gown_state on own row only; with QualityManager for cert_status)"
      - "POST /_clock/set_current_utc (with all roles)"
      - "all GET endpoints except change-notice reads"
