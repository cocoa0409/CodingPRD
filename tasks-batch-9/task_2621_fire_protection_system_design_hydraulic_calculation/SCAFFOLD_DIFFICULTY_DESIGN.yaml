  # =====================================================================
  # RULE 3 - non_linear_state_machine
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: calculation_pressure_deficient_restart_loop_reconverges_on_new_chain
        grounds:
          - state_machines.HydraulicCalculation.ITERATING_to_PRESSURE_DEFICIENT
          - state_machines.HydraulicCalculation.PRESSURE_DEFICIENT_to_ITERATING
          - state_machines.HydraulicCalculation.ITERATING_to_CONVERGED
          - calculations.pipe_sizing_chain
          - entities.HydraulicCalculation.fields.chain_start_index
          - entities.PipeSizingIteration.fields.in_active_chain
          - validations[priority=34]
        distinguishing_aspect: |
          The calculation leaves ITERATING for PRESSURE_DEFICIENT and comes back to ITERATING on the
          same entity, and the second pass is NOT a replay: chain_start_index moves to 4, iterations 1
          to 3 keep their rows with in_active_chain false, end_head_psi is re-derived from the new
          first active iteration (26.61 instead of 19.05) and iteration_count falls from 3 to 2 while
          three rows remain persisted.
        test_recipe:
          setup:
            - "Project FP-2601 with underground_lead_in_loss_psi 5.0; hazard area HA-1 -> EXTRA_1, density 0.320, design area 2500 sqft, hose 500.0 gpm"
            - "STANDPIPE_CLASS_I with 2 risers -> Project.auxiliary_demand_gpm == 750.0"
            - "Calculation HC-1 AREA_DENSITY k 25.2 -> design_flow 880.0, hazard_total_demand 1380.0; iterations 1 and 2 appended, required_psi_at_base_of_riser 45.28, state ITERATING"
            - "Flow test H-14 80.0 / 64.0 / 2250.0 evaluated on the SEASONAL_ADJUSTED basis -> 70.0 / 54.0 / 2025.0, available_psi_at_demand 52.43, required 50.28, margin 2.15, verdict MARGINAL"
            - "Logical clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
