            - "Booking B returns error_id == ERR_BUDGET_EXCEEDED (5000000 + 1 > 5000000)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: event_confirm_requires_contract_countersigned
        grounds:
          - state_machines.EventProject.DRAFT_to_BOOKING
          - state_machines.Contract.SIGNED_to_COUNTERSIGNED
          - entities.Contract.fields.status
        distinguishing_aspect: "EventProject.DRAFT->BOOKING depends on Contract.status == COUNTERSIGNED (pair EventProject<->Contract): confirm on a merely SIGNED contract fails; after countersign it succeeds."
        test_recipe:
          setup:
            - "Event DRAFT; its contract created, SENT, and SIGNED (not yet countersigned)."
          setup_api_calls:
            - call: "POST /planning/events"
              payload: { couple_names: "Y & Z", event_date: "2026-09-15T00:00:00Z", venue_name: "Court", package_type: "FULL", total_budget_cents: 8000000, guest_count_estimate: 90 }
              as: Planner
              captures: { ev_id: $.data.id, ev_v: $.data.version }
            - call: "POST /planning/contracts"
              payload: { event_id: "${ev_id}", expected_event_version: "${ev_v}" }
              as: Planner
              captures: { ct_id: $.data.id }
            - call: "POST /planning/contracts/${ct_id}/send"
              payload: {}
              as: Planner
            - call: "POST /planning/contracts/${ct_id}/sign"
              payload: {}
              as: Client
              as_user_id: "${ev_id}"
          trigger:
            - call: "POST /planning/events/${ev_id}/confirm"
              payload: {}
              as: Planner
              captures: { err: $.data.error_id }
            - call: "POST /planning/contracts/${ct_id}/countersign"
              payload: {}
              as: Planner
            - call: "POST /planning/events/${ev_id}/confirm"
