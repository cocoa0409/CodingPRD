      - name: unattached_performer_at_12_outranks_future_dated_completed_at_at_14_1_on_checklist_complete
        grounds:
          - validations[priority 12]
          - validations[priority 14.1]
          - errors[ERR_PERFORMER_NOT_ON_CASE]
          - errors[ERR_CHECKLIST_TIMESTAMP_OUT_OF_RANGE]
          - endpoints[POST /bundle-activations/{activationId}/checklist-items/{itemId}/complete]
          - state_machines.BundleChecklistItem.PENDING_to_COMPLETED
        distinguishing_aspect: |
          The two violations in this single /complete call sit on OPPOSITE sides of
          the usual instinct about ordering, and they even return different HTTP
          classes, so the wrong answer is unmistakable: the named performer holds
          neither an ACTIVE CareAssignment on the encounter nor an ACTIVE
          CHARGE/OR_STANDBY shift on the unit (priority 12,
          422 ERR_PERFORMER_NOT_ON_CASE) while completed_at is 35 minutes in the
          FUTURE relative to the logical clock (priority 14.1,
          400 ERR_CHECKLIST_TIMESTAMP_OUT_OF_RANGE). The ladder demands the 422.
          Almost every implementation gets this backwards, because a
          future-dated timestamp looks like cheap syntactic input validation and
          gets folded in beside the range checks of priority 5, whereas
          "is this clinician on the case" requires two extra lookups and drifts
          to the end of the handler. This scaffold pins the opposite order: the
          shape and enum-range of completed_at IS a priority-5 concern, but its
          relation to activated_at and clock_now is explicitly priority 14.1,
          BELOW the actor-attachment rule at 12. The performer here is a real,
          employed, in-credential StaffMember of the correct unit — so priorities
          4, 5, 7 and 11.1 all pass and cannot mask the pair — and the item is a
          stage_gate == 1 row on an ACTIVATED activation, which §1.2 explicitly
          permits, so 8.05 cannot fire either.
        test_recipe:
          setup: |
            A unit with one charge nurse who IS on case (ACTIVE CHARGE shift) and a
            second nurse, Ottoline Farraday, who holds NO ShiftAssignment at all
            and no CareAssignment — she is the deliberately unattached performer.
            One encounter carries an OBSTETRIC_HEMORRHAGE activation triggered at
            QBL 1400 (over the 1000 activation threshold, under the 1500 stage-2
            threshold, so the bundle stays ACTIVATED), activated at
            2026-08-14T09:00:00Z. The clock is then advanced only to 09:05, while
            the trigger claims the QBL_MEASURE step was performed at 09:40 —
            35 minutes after "now".
          setup_api_calls:
            - call: POST /_clock/set_current_utc
