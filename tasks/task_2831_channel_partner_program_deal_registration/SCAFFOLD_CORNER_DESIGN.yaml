            - call: "POST /partners"
              payload: { company_name: "Aster Systems", partner_type: "RESELLER" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_sc_a_id: $.data.id }
            - call: "POST /partners/${p_sc_a_id}/certifications"
              payload: { engineer_name: "Iva Sorel", track: "TECH_ASSOCIATE", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /partners"
              payload: { company_name: "Borealis Resale", partner_type: "RESELLER" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_sc_b_id: $.data.id }
            - call: "POST /partners/${p_sc_b_id}/certifications"
              payload: { engineer_name: "Jae Kim", track: "TECH_ASSOCIATE", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /accounts"
              payload: { account_name: "Granite Health", region_code: "NA" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { acc_sc_id: $.data.id }
            - call: "POST /deal-registrations"
              payload: { partner_id: "${p_sc_a_id}", account_id: "${acc_sc_id}", product_line: "ANALYTICS_ADDON", expected_amount_cents: 400000, expected_close_date: "2026-08-31T00:00:00.000Z" }
              as: Partner
              as_user_id: "${p_sc_a_id}"
              captures: { r_sc_id: $.data.id }
          trigger:
            - call: "POST /deal-registrations/${r_sc_id}/submit"
