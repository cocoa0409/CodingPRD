              as: ProgramOperator
              captures: { prog_id: $.data.id }
            - call: "POST /dr/programs/${prog_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /dr/devices"
              payload: { customer_id: "${cust_id}", device_type: "BATTERY", nameplate_kw: 10, capacity_kwh: 20 }
              as: Aggregator
              as_user_id: "${agg_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /dr/devices/${dev_id}/meter-readings"
              payload: { interval_start: "2026-05-20T14:00:00Z", interval_end: "2026-05-20T15:00:00Z", kw_load: 10, reading_type: "BASELINE_WINDOW" }
              as: Aggregator
              as_user_id: "${agg_id}"
            - call: "POST /dr/devices/${dev_id}/meter-readings"
              payload: { interval_start: "2026-05-21T14:00:00Z", interval_end: "2026-05-21T15:00:00Z", kw_load: 9, reading_type: "BASELINE_WINDOW" }
              as: Aggregator
              as_user_id: "${agg_id}"
            - call: "POST /dr/devices/${dev_id}/meter-readings"
              payload: { interval_start: "2026-05-22T14:00:00Z", interval_end: "2026-05-22T15:00:00Z", kw_load: 8, reading_type: "BASELINE_WINDOW" }
              as: Aggregator
              as_user_id: "${agg_id}"
            - call: "POST /dr/enrollments"
              payload: { device_id: "${dev_id}", program_id: "${prog_id}", committed_kw: 5 }
              as: Aggregator
              as_user_id: "${agg_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /dr/enrollments/${enr_id}/activate"
              payload: {}
              as: Aggregator
              as_user_id: "${agg_id}"
            - call: "POST /dr/dispatch-events"
              payload: { program_id: "${prog_id}", window_start: "2026-06-01T14:00:00Z", window_end: "2026-06-01T16:00:00Z", target_reduction_kw: 5 }
              as: ProgramOperator
              captures: { evt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
