  # ------------------------------------------------------------- validations
  - section: validations
    instances:
      - name: list_catalog_missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID headers is rejected with ERR_UNAUTHENTICATED (401) before any role check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /catalog-items", payload: {}, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED (headers absent; Anonymous marker means 'send no role headers' here)"

      - name: amend_nonexistent_reservation_returns_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=5]", "errors[ERR_RESERVATION_NOT_FOUND]"]
        distinguishing_aspect: "Existence (P3) beats request-shape (P5): amending a non-existent reservation with an invalid date range returns ERR_RESERVATION_NOT_FOUND, not ERR_INVALID_DATE_RANGE."
        test_recipe:
          setup: ["a real reservation exists only to source a well-formed version value; the target id does not exist"]
          setup_api_calls:
