              as: ExportComplianceOfficer
              as_user_id: "eco-001"
            - call: "POST /optics/documentation-packages"
              payload: { assembly_id: "00000000-0000-0000-0000-000000000000" }
              as: QualityManager
              as_user_id: "qm-001"
            - call: "GET /optics/process-runs"
              payload: { limit: 10, offset: 0 }
              as: ProcessTechnician
          assert:
            - "the run with the broken work_order_id returns HTTP 404 ERR_WORK_ORDER_NOT_FOUND"
            - "the run with the broken metrology_instrument_id returns HTTP 404 ERR_INSTRUMENT_NOT_FOUND"
            - "the report with the broken process_run_id returns HTTP 404 ERR_PROCESS_RUN_NOT_FOUND"
            - "the coating run with the broken work_order_id returns ERR_WORK_ORDER_NOT_FOUND and the one with the broken coating_chamber_id returns ERR_CHAMBER_NOT_FOUND"
            - "the assembly with the broken design_id returns ERR_DESIGN_NOT_FOUND"
            - "the component with the broken assembly_id returns ERR_ASSEMBLY_NOT_FOUND and the one with the broken work_order_id returns ERR_WORK_ORDER_NOT_FOUND"
            - "the inspection record and the documentation package with a broken assembly_id both return ERR_ASSEMBLY_NOT_FOUND"
            - "the classification with the broken design_id returns ERR_DESIGN_NOT_FOUND"
            - "the closing list of process runs returns 0 rows, so not one of the refused creates persisted anything"
            - "MetrologyInstrument.${i1}.booked_minutes_total == 0 and Assembly.${a1}.version is unchanged"

      - name: each_uniqueness_rule_has_its_own_conflict_code
        claim_type: error_triggerable
        grounds:
          - validations.priority_22
          - errors.ERR_DUPLICATE_DESIGN_CODE
          - errors.ERR_DUPLICATE_LOT_CODE
          - errors.ERR_EXPORT_CLASSIFICATION_EXISTS
          - errors.ERR_DOCUMENTATION_PACKAGE_EXISTS
          - errors.ERR_DUPLICATE_DOCUMENT_TYPE
        distinguishing_aspect: |
          Priority 22 bundles five different uniqueness scopes and each one must answer with its own code:
          a global design_code, a global lot_code, one non-denied classification per design, one package
          per assembly and one occurrence of a document_type per package. Every duplicate is attempted
          twice over — once with the colliding value and once with a fresh one — so the rule is shown to
          be about the value, not about the endpoint.
        test_recipe:
          setup:
            - "A RELEASED design OD-2540-A (aperture 120.0 mm, RMS 0.0400, tolerance budget 0.0800, transmitted-wavefront budget 0.1050, one ACTIVE 0.0375-wave allocation, verdict PASS) and a RELEASED lot GL-2540-1 with total_blank_count 20 certified H3/B."
            - "One KITTED assembly AS-2540-1 on that design, and one DocumentationPackage p1 for it holding a CERTIFICATE_OF_CONFORMANCE document."
            - "One ExportClassification for the design with destination DE, classification_status LICENSE_REQUIRED (controlled, licence not exempt), so it is the governing row."
            - "The logical clock stays at its start value 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-1", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g1: $.data.id }
            - call: "POST /optics/glass-lots/${g1}/certification"
              payload: { measured_index_homogeneity_grade: "H3", measured_striae_grade: "B", certificate_reference: "CERT-2540-1" }
              as: ProcurementOfficer
              captures: { g1v: $.data.version }
            - call: "POST /optics/assemblies"
              payload: { design_id: "${d1}", assembly_code: "AS-2540-1" }
              as: ProcessTechnician
              captures: { a1: $.data.id, a1v: $.data.version }
            - call: "POST /optics/export-classifications"
              payload: { design_id: "${d1}", destination_country: "DE" }
              as: ExportComplianceOfficer
              as_user_id: "eco-001"
              captures: { x1: $.data.id }
            - call: "POST /optics/documentation-packages"
              payload: { assembly_id: "${a1}" }
              as: QualityManager
              as_user_id: "qm-001"
              captures: { p1: $.data.id }
            - call: "POST /optics/documentation-packages/${p1}/documents"
              payload: { document_type: "CERTIFICATE_OF_CONFORMANCE", document_reference: "COC-2540-1" }
              as: QualityManager
              as_user_id: "qm-001"
          trigger:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-Z", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-1", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-Z", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
            - call: "POST /optics/export-classifications"
              payload: { design_id: "${d1}", destination_country: "FR" }
              as: ExportComplianceOfficer
              as_user_id: "eco-001"
            - call: "POST /optics/documentation-packages"
              payload: { assembly_id: "${a1}" }
              as: QualityManager
              as_user_id: "qm-001"
            - call: "POST /optics/documentation-packages/${p1}/documents"
              payload: { document_type: "CERTIFICATE_OF_CONFORMANCE", document_reference: "COC-2540-2" }
              as: QualityManager
              as_user_id: "qm-001"
            - call: "POST /optics/documentation-packages/${p1}/documents"
              payload: { document_type: "MELT_CERTIFICATE", document_reference: "MELT-2540-1" }
              as: QualityManager
              as_user_id: "qm-001"
            - call: "GET /optics/optical-designs"
              payload: { limit: 10, offset: 0 }
              as: OpticsEngineer
            - call: "GET /optics/assemblies/${a1}/documentation-packages"
              payload: { limit: 10, offset: 0 }
              as: QualityManager
              as_user_id: "qm-001"
          assert:
            - "the design create reusing OD-2540-A returns HTTP 409 ERR_DUPLICATE_DESIGN_CODE"
            - "the design create with OD-2540-Z returns HTTP 201, so only the code collided"
            - "the lot create reusing GL-2540-1 returns HTTP 409 ERR_DUPLICATE_LOT_CODE and GL-2540-Z returns HTTP 201"
            - "the second classification on the same design returns HTTP 409 ERR_EXPORT_CLASSIFICATION_EXISTS even though its destination_country differs"
            - "the second package for the same assembly returns HTTP 409 ERR_DOCUMENTATION_PACKAGE_EXISTS"
            - "re-attaching CERTIFICATE_OF_CONFORMANCE returns HTTP 409 ERR_DUPLICATE_DOCUMENT_TYPE while MELT_CERTIFICATE attaches with HTTP 200"
            - "the design list holds exactly 2 rows (OD-2540-A and OD-2540-Z) and the assembly's package list holds exactly 1"
            - "DocumentationPackage.${p1}.present_document_types == [CERTIFICATE_OF_CONFORMANCE, MELT_CERTIFICATE] in attachment order, with no duplicate entry"

      - name: slot_occupancy_is_reported_before_element_allocation_exhaustion
        claim_type: error_triggerable
        grounds:
          - validations.priority_22
          - validations.priority_23
          - errors.ERR_SLOT_ALREADY_OCCUPIED
          - errors.ERR_ELEMENT_ALLOCATION_EXCEEDED
        distinguishing_aspect: |
          Two adjacent referential rules guard the same endpoint and a request can break both: with the
          element_count of WO-2540-1 already consumed by two components, re-using slot_index 2 must return
          the priority-22 ERR_SLOT_ALREADY_OCCUPIED, while asking for the free slot_index 3 returns the
          priority-23 ERR_ELEMENT_ALLOCATION_EXCEEDED — so a wrong slot is reported before an exhausted
          allocation.
        test_recipe:
          setup:
            - "A RELEASED design OD-2540-A (aperture 120.0 mm, RMS 0.0400, tolerance budget 0.0800, transmitted-wavefront budget 0.1050, one ACTIVE 0.0375-wave allocation, verdict PASS) and a RELEASED lot GL-2540-1 with total_blank_count 20 certified H3/B."
            - "Interferometer IF-2540-1 calibrated at the clock's start value with base_uncertainty_waves 0.0010, so capability_ratio_at_scheduling is 0.0500."
            - "WO-2540-1 (element_count 2) reached RELEASED_TO_ASSEMBLY, so its elements may be kitted."
            - "Assembly AS-2540-1 already holds two ACTIVE components from that order in slot_index 1 and 2, which is exactly its element_count."
            - "The assembly version is re-read before every attempt so no refusal can be blamed on the OCC guard."
            - "The logical clock stays at its start value 2026-08-01T00:00:00Z."
