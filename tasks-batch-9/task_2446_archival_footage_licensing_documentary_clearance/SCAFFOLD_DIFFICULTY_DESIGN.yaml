            - "License.${lic_id}.status == EXPIRED"
            - "hop 2: Asset.${asset_id}.licensing_status == LAPSED, rights_basis == UNDETERMINED, lapse_count == 1, and ${asset_id} appears in lapsed_asset_ids"
            - "hop 3: Production.${prod_id}.posture == BLOCKED, cleared_asset_count == 0, open_asset_count == 1, asset_count == 1"
            - "hop 4: DeliveryPackage.${pkg_id}.status == SUSPENDED with a non-null suspension_reason, and ${pkg_id} appears in suspended_delivery_package_ids"
            - "hop 5: EOApplication.${eo_id}.status == REMEDIATION_REQUIRED with policy_number still EO-2026-77, and ${eo_id} appears in remediated_eo_application_ids"
            - "Production.${prod_id}.status == CLEARANCE (reverted from LOCKED by step 4e)"
            - "ClearanceChart.${chart_id}.status == STALE"
            - "Production.${prod_id}.committed_fee_cents == 0 — the ledger was debited by exactly the expired executed_fee_cents 258750"
            - "Production.${prod_id}.sweep_epoch == 1"

      - name: opinion_letter_withdrawal_cascades_five_hops_from_legal_opinion
        grounds:
          - state_machines.OpinionLetter.ISSUED_to_WITHDRAWN
          - state_machines.FairUseAnalysis.ACCEPTED_to_REJECTED
          - state_machines.Asset.CLEARED_to_LAPSED
          - state_machines.DeliveryPackage.DELIVERED_to_SUSPENDED
          - state_machines.EOApplication.BOUND_to_REMEDIATION_REQUIRED
          - calculations.asset_clearance_rollup
          - calculations.production_asset_count_ledger
        distinguishing_aspect: |
          Same five-hop depth but a DIFFERENT ROOT TRIGGER and a different first hop: no clock and
          no licence are involved at all — a legal document (OpinionLetter) is withdrawn, which
          first invalidates the FairUseAnalysis that rested on it and only then reaches the asset.
          The chain therefore crosses the fair-use branch of the rights_basis precedence rather
          than the licence branch, proving the cascade is not hard-wired to licence expiry.
        test_recipe:
          setup:
            - "A production in status CLEARANCE with exactly one 20-second CRITICAL_COMMENTARY asset and NO licences anywhere."
            - "That asset is CLEARED via rights_basis FAIR_USE: one ACCEPTED FairUseAnalysis (strength_score 0.6750) backed by exactly one ISSUED OpinionLetter issued by X-User-ID counsel-alpha."
            - "A PINNED ClearanceChart whose single row is FAIR_USE and whose pinned_opinion_letter_ids contains that letter; a BOUND EOApplication against it (legal review recorded by the DIFFERENT counsel-beta, per the segregation rule); a DELIVERED DeliveryPackage against it."
