      - name: cascading_validation_grant_state_is_checked_before_the_stale_version
        claim_type: Cascading validation
        grounds:
          - validations.priority_41
          - validations.priority_46
          - concurrency_rules.renewal-create-stale-grant
        distinguishing_aspect: "The renewal request is doubly faulty - the predecessor is still PENDING_REGISTRY and the client echoes the Product's version (advanced to 2 by the assessment write) instead of the grant's version 1 - and the state check at priority 41 must run first, so the answer is 409 ERR_INVALID_GRANT_STATE and never 412 ERR_STALE_GRANT_VERSION."
