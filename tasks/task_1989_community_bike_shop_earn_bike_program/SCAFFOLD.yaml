# =============================================================================
# PRD Benchmark Seed Tables — task_1989 Community Bike Shop & Earn-a-Bike Program
# =============================================================================

scenario: |
  1989. Community Bike Shop & Earn-a-Bike Program (nonprofit community bike shop): donated bike intake & condition triage, refurbishment workflow & parts inventory from donor bikes, volunteer mechanic training & shift scheduling, earn-a-bike hour tracking & graduation, low-cost sales vs program giveaways, safety inspection & helmet distribution, shop tool access membership, scrap/recycling of unusable frames

domain_name: community-bike-shop
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration      # refurb pipeline with branch + rework cycle
  secondary_archetype: quota_allocation          # giveaway monthly quota, parts stock, training capacity
  complexity_layers: [optimistic_concurrency, cascading_side_effects, dual_variant_calculation, derived_field_reconciliation]
  entity_topology: flat                          # peer collections with FK references; no nested ownership tree
  state_machine_shape: branching                 # fork on triage, rework cycle, independent dimensions on Volunteer
  relationship_patterns: [one_to_many, many_to_many, cross_aggregate, polymorphic]
  role_model: segregation_of_duties              # hour logger vs approver; refurb lead vs safety inspector; giveaway approver vs fulfiller
  consistency_model: immediate

# =============================================================================
# Response Envelope (FIXED — verbatim per §1.0)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Donor
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Donor display name" }
      - { name: donor_type, type: enum, source: input, description: "INDIVIDUAL | ORGANIZATION", constraints: "enum: INDIVIDUAL, ORGANIZATION" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: receipt_method, type: enum, source: input, description: "Receipt valuation variant selector", default: FLAT_SCHEDULE, constraints: "enum: FLAT_SCHEDULE, FMV_COMPARABLE" }
      - { name: donated_bike_count, type: integer, source: computed, description: "Count of DonatedBike rows with donor_id == this donor" }
      - { name: lifetime_receipt_value_cents, type: integer, source: computed, description: "Receipt value over all triaged donated bikes using donor.receipt_method variant (see donation_receipt_value)" }

  - name: DonatedBike
    parent: null
    common_fields: true
    fields:
      - { name: donor_id, type: string, source: input, description: "FK -> Donor.id; donating party" }
      - { name: serial_number, type: string, source: input, description: "Frame serial; unique across all bikes", constraints: "unique globally -> ERR_SERIAL_NUMBER_CONFLICT" }
      - { name: bike_type, type: enum, source: input, description: "Frame style tier for pricing", constraints: "enum: ROAD, MTB, HYBRID, KIDS, BMX, CARGO" }
      - { name: wheel_size_inches, type: number, source: input, description: "Wheel diameter" }
      - { name: condition_grade, type: enum, source: input, description: "Triage grade; null until TRIAGED; set only via triage endpoint", constraints: "enum: A, B, C, D; null allowed pre-triage" }
      - { name: frame_damage, type: boolean, source: input, description: "Structural frame damage flag; null until triage" }
      - { name: status, type: enum, source: system, description: "RECEIVED | TRIAGED | IN_REFURBISHMENT | SAFETY_REVIEW | READY_FOR_DISPOSITION | RESERVED_FOR_GRADUATE | SOLD | GIFTED | HARVEST_QUEUE | HARVESTED | SCRAP_PENDING | SCRAPPED" }
      - { name: refurb_lead_volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; accountable refurb mechanic; null until routed to REFURBISH; retained for audit after leaving IN_REFURBISHMENT" }
      - { name: parts_cost_cents, type: integer, source: computed, description: "Sum over COMMITTED PartUsage of quantity * unit_cost_cents snapshot (see parts_cost_rollup)", default: 0 }
      - { name: rework_count, type: integer, source: system, description: "Number of failed safety inspections (SAFETY_REVIEW -> IN_REFURBISHMENT loops)", default: 0 }
      - { name: latest_inspection_result, type: enum, source: computed, description: "PASS | FAIL | null; result of most recent SafetyInspection by created_at", constraints: "enum: PASS, FAIL; null until first inspection" }

  - name: Part
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "SKU display name; unique", constraints: "unique globally -> ERR_PART_NAME_CONFLICT" }
      - { name: category, type: enum, source: input, description: "Part category", constraints: "enum: DRIVETRAIN, BRAKES, WHEELS, FRAME, COCKPIT, SADDLE, TIRES, HELMET, MISC" }
      - { name: helmet_size, type: enum, source: input, description: "Required iff category == HELMET; otherwise must be null", constraints: "enum: XS, S, M, L, XL; null unless HELMET -> ERR_HELMET_SIZE_REQUIRED" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Latest purchase unit cost; replaced by restock when provided; snapshotted onto PartUsage at log time", default: 0 }
      - { name: quantity_on_hand, type: integer, source: computed, description: "restocked_total + harvested_total - used_total(COMMITTED) - helmets_distributed; never negative", default: 0 }
      - { name: reorder_threshold, type: integer, source: input, description: "Low-stock breakpoint", default: 0 }
      - { name: low_stock, type: boolean, source: computed, description: "quantity_on_hand <= reorder_threshold (equality is low)" }

  - name: PartHarvest
    parent: null
    common_fields: false
    fields:
      - { name: bike_id, type: string, source: input, description: "FK -> DonatedBike.id; donor bike stripped for parts (path-scoped)" }
      - { name: part_id, type: string, source: input, description: "FK -> Part.id; SKU credited" }
      - { name: quantity, type: integer, source: input, description: "Units harvested; > 0", constraints: ">= 1 -> ERR_QUANTITY_INVALID" }
      - { name: harvested_by_user_id, type: string, source: system, description: "X-User-ID of logging user (opaque audit id, not an FK)" }
      - { name: note, type: string, source: input, description: "Optional note" }

  - name: PartUsage
    parent: null
    common_fields: false
    fields:
      - { name: bike_id, type: string, source: input, description: "FK -> DonatedBike.id; bike under refurbishment consuming the part (path-scoped)" }
      - { name: part_id, type: string, source: input, description: "FK -> Part.id; SKU consumed" }
      - { name: quantity, type: integer, source: input, description: "Units consumed; > 0", constraints: ">= 1 -> ERR_QUANTITY_INVALID; <= Part.quantity_on_hand -> ERR_INSUFFICIENT_STOCK" }
      - { name: unit_cost_cents, type: integer, source: system, description: "Snapshot of Part.unit_cost_cents at creation; immutable even after later restocks" }
      - { name: logged_by_user_id, type: string, source: system, description: "X-User-ID of logging volunteer (opaque audit id, not an FK)" }
      - { name: status, type: enum, source: system, description: "COMMITTED | VOIDED", constraints: "enum: COMMITTED, VOIDED" }
      - { name: void_reason, type: string, source: input, description: "Optional reason recorded on void" }

  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Volunteer name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: skill_level, type: enum, source: system, description: "TRAINEE | APPRENTICE | JOURNEYMAN | LEAD_MECHANIC; advances one level per promote", constraints: "enum: TRAINEE, APPRENTICE, JOURNEYMAN, LEAD_MECHANIC" }
      - { name: engagement_status, type: enum, source: system, description: "ACTIVE | SUSPENDED; independent of skill_level", constraints: "enum: ACTIVE, SUSPENDED" }
      - { name: training_hours, type: integer, source: computed, description: "Sum of credit_hours over TrainingAttendance rows with status ATTENDED (see promotion_eligibility)" }
      - { name: sessions_attended, type: integer, source: computed, description: "Count of TrainingAttendance rows with status ATTENDED" }
      - { name: inspections_conducted, type: integer, source: computed, description: "Count of SafetyInspection rows with inspector_volunteer_id == this volunteer" }
      - { name: no_show_count, type: integer, source: system, description: "Shift no-show strikes; at >= 3 engagement_status auto -> SUSPENDED; reset to 0 on reinstate", default: 0 }
      - { name: shift_minutes, type: integer, source: computed, description: "Sum of credited_minutes over COMPLETED shifts" }

  - name: TrainingSession
    parent: null
    common_fields: true
    fields:
      - { name: topic, type: string, source: input, description: "Class topic" }
      - { name: level, type: enum, source: input, description: "Class level", constraints: "enum: BASIC, ADVANCED, LEAD_CERT" }
      - { name: scheduled_start, type: datetime, source: input, description: "Start ISO8601 UTC" }
      - { name: scheduled_end, type: datetime, source: input, description: "End ISO8601 UTC; must be after start -> ERR_VALIDATION" }
      - { name: credit_hours, type: integer, source: input, description: "Hours credited to each ATTENDED volunteer", constraints: ">= 1" }
      - { name: capacity, type: integer, source: input, description: "Max ENROLLED attendances", constraints: ">= 1 -> ERR_TRAINING_FULL when exceeded" }
      - { name: enrolled_count, type: integer, source: computed, description: "Count of attendances with status ENROLLED" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED", constraints: "enum: SCHEDULED, COMPLETED, CANCELLED" }

  - name: TrainingAttendance
    parent: null
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> TrainingSession.id (path-scoped)" }
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; enrolled volunteer" }
      - { name: status, type: enum, source: system, description: "ENROLLED | ATTENDED | NO_SHOW | DROPPED", constraints: "enum: ENROLLED, ATTENDED, NO_SHOW, DROPPED; unique (session_id, volunteer_id) -> ERR_ALREADY_ENROLLED" }

  - name: VolunteerShift
    parent: null
    common_fields: true
    fields:
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; scheduled volunteer" }
      - { name: shift_role, type: enum, source: input, description: "Duty on shift", constraints: "enum: MECHANIC, INTAKE, FLOOR" }
      - { name: scheduled_start, type: datetime, source: input, description: "Start ISO8601 UTC" }
      - { name: scheduled_end, type: datetime, source: input, description: "End ISO8601 UTC; duration 30..480 minutes -> ERR_SHIFT_DURATION_INVALID" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CHECKED_IN | COMPLETED | CANCELLED | NO_SHOW", constraints: "enum: SCHEDULED, CHECKED_IN, COMPLETED, CANCELLED, NO_SHOW" }
      - { name: checked_in_at, type: datetime, source: system, description: "Actual check-in instant; null until CHECKED_IN" }
      - { name: credited_minutes, type: integer, source: computed, description: "min(480, scheduled duration minutes); set on COMPLETED; null before" }

  - name: EarnABikeParticipant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Participant name" }
      - { name: contact_email, type: string, source: input, description: "Contact email" }
      - { name: age_group, type: enum, source: input, description: "YOUTH | ADULT; drives required_hours", constraints: "enum: YOUTH, ADULT" }
      - { name: enrolled_at, type: datetime, source: system, description: "Logical clock at enrollment" }
      - { name: enrollment_deadline, type: datetime, source: system, description: "enrolled_at + 90 days; sweep expires when clock > deadline" }
      - { name: required_hours, type: integer, source: computed, description: "YOUTH -> 8, ADULT -> 12" }
      - { name: hours_earned, type: integer, source: computed, description: "Sum of hours over HourLog rows with status APPROVED (see hours_accrual)" }
      - { name: safety_quiz_passed, type: boolean, source: input, description: "Set via record-quiz; required for graduation", default: false }
      - { name: reserved_bike_id, type: string, source: system, description: "FK -> DonatedBike.id; bike reserved for graduation; null when none" }
      - { name: status, type: enum, source: system, description: "ENROLLED | HOURS_MET | GRADUATED | WITHDRAWN | EXPIRED", constraints: "enum: ENROLLED, HOURS_MET, GRADUATED, WITHDRAWN, EXPIRED" }
      - { name: graduated_at, type: datetime, source: system, description: "Logical clock at graduation; null until GRADUATED" }

  - name: HourLog
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> EarnABikeParticipant.id (path-scoped)" }
      - { name: shift_id, type: string, source: input, description: "FK -> VolunteerShift.id; optional linked shop shift; when present must be COMPLETED -> ERR_SHIFT_NOT_CREDITABLE" }
      - { name: work_date, type: string, source: input, description: "Calendar date worked YYYY-MM-DD; within [enrollment date, min(today, deadline)] -> ERR_WORK_DATE_OUT_OF_WINDOW" }
      - { name: hours, type: integer, source: input, description: "Hours claimed 1..6", constraints: "1..6 -> ERR_VALIDATION; daily aggregate cap -> ERR_DAILY_HOURS_EXCEEDED" }
      - { name: activity_type, type: enum, source: input, description: "Work category", constraints: "enum: REFURB_WORK, SHOP_HELP, OUTREACH, TRAINING_ASSIST" }
      - { name: description, type: string, source: input, description: "Optional free text" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED | VOIDED", constraints: "enum: PENDING, APPROVED, REJECTED, VOIDED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator; approver must differ -> ERR_REVIEWER_IS_LOGGER" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of approver/rejecter/voider; null until reviewed" }

  - name: Sale
    parent: null
    common_fields: true
    fields:
      - { name: bike_id, type: string, source: input, description: "FK -> DonatedBike.id; must be READY_FOR_DISPOSITION -> ERR_BIKE_NOT_AVAILABLE" }
      - { name: buyer_name, type: string, source: input, description: "Buyer name" }
      - { name: buyer_email, type: string, source: input, description: "Buyer email" }
      - { name: buyer_membership_id, type: string, source: input, description: "FK -> ToolMembership.id; optional; when present must be ACTIVE -> ERR_MEMBERSHIP_NOT_ACTIVE; grants 10% discount" }
      - { name: quoted_price_cents, type: integer, source: computed, description: "sale_price variant QUOTED evaluated at creation against current bike data" }
      - { name: final_price_cents, type: integer, source: computed, description: "sale_price variant FINAL re-evaluated at completion against current bike data and membership status; null until COMPLETED" }
      - { name: round_up, type: boolean, source: input, description: "Buyer opts into round-up donation at completion", default: false }
      - { name: grand_total_cents, type: integer, source: computed, description: "sale_settlement_roundup: smallest multiple of 500 >= final_price_cents when round_up else final_price_cents; null until COMPLETED" }
      - { name: donation_cents, type: integer, source: computed, description: "grand_total_cents - final_price_cents; null until COMPLETED" }
      - { name: payment_method, type: enum, source: input, description: "Set at completion", constraints: "enum: CASH, CARD, VOUCHER" }
      - { name: status, type: enum, source: system, description: "PENDING | COMPLETED | VOIDED", constraints: "enum: PENDING, COMPLETED, VOIDED" }
      - { name: completed_at, type: datetime, source: system, description: "Logical clock at completion; null until COMPLETED" }

  - name: GiveawayAward
    parent: null
    common_fields: true
    fields:
      - { name: bike_id, type: string, source: input, description: "FK -> DonatedBike.id; must be READY_FOR_DISPOSITION at create, approve, and fulfill" }
      - { name: partner_org, type: string, source: input, description: "Referring partner organization" }
      - { name: referral_code, type: string, source: input, description: "Partner referral code" }
      - { name: recipient_age_group, type: enum, source: input, description: "YOUTH recipients require helmet before fulfillment", constraints: "enum: YOUTH, ADULT" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED | FULFILLED | CANCELLED", constraints: "enum: REQUESTED, APPROVED, DENIED, FULFILLED, CANCELLED" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of approver/denier; fulfiller must differ -> ERR_FULFILLER_IS_APPROVER" }
      - { name: decided_at, type: datetime, source: system, description: "Logical clock at approve/deny; quota month derives from decided_at" }
      - { name: fulfilled_by_user_id, type: string, source: system, description: "X-User-ID of fulfiller" }

  - name: SafetyInspection
    parent: null
    common_fields: false
    fields:
      - { name: bike_id, type: string, source: input, description: "FK -> DonatedBike.id (path-scoped); bike must be SAFETY_REVIEW" }
      - { name: inspector_volunteer_id, type: string, source: system, description: "FK -> Volunteer.id; taken from X-User-ID of the Volunteer-role caller; must differ from bike.refurb_lead_volunteer_id -> ERR_INSPECTOR_IS_REFURB_LEAD" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL", constraints: "enum: PASS, FAIL; PASS requires all checklist items true -> ERR_CHECKLIST_INCONSISTENT" }
      - { name: checklist, type: object, source: input, description: "{brakes, steering, tires, drivetrain, reflectors} booleans" }
      - { name: note, type: string, source: input, description: "Optional note" }

  - name: ToolMembership
    parent: null
    common_fields: true
    fields:
      - { name: member_name, type: string, source: input, description: "Member name" }
      - { name: member_email, type: string, source: input, description: "Member email" }
      - { name: tier, type: enum, source: input, description: "BASIC -> PER_SESSION billing; PRO -> FLAT_MONTHLY billing (see membership_billing)", constraints: "enum: BASIC, PRO" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | EXPIRED", constraints: "enum: ACTIVE, SUSPENDED, EXPIRED" }
      - { name: start_date, type: string, source: system, description: "Logical clock date at creation" }
      - { name: end_date, type: string, source: input, description: "Membership end date YYYY-MM-DD inclusive; sweep expires when clock date > end_date" }
      - { name: suspended_reason, type: string, source: input, description: "Optional reason recorded on suspend" }

  - name: ToolSession
    parent: null
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: input, description: "FK -> ToolMembership.id (path-scoped); must be ACTIVE -> ERR_MEMBERSHIP_NOT_ACTIVE" }
      - { name: stand_number, type: integer, source: input, description: "Work stand 1..4", constraints: "1..4 -> ERR_STAND_NUMBER_INVALID" }
      - { name: start_time, type: datetime, source: input, description: "Start ISO8601 UTC; duration 30..180 min -> ERR_SESSION_DURATION_INVALID" }
      - { name: end_time, type: datetime, source: input, description: "End ISO8601 UTC" }
      - { name: status, type: enum, source: system, description: "BOOKED | IN_USE | CLOSED | CANCELLED | NO_SHOW", constraints: "enum: BOOKED, IN_USE, CLOSED, CANCELLED, NO_SHOW" }
      - { name: started_at, type: datetime, source: system, description: "Actual start instant; null until IN_USE" }
      - { name: closed_at, type: datetime, source: system, description: "Actual close instant; null until CLOSED" }

  - name: ScrapTicket
    parent: null
    common_fields: true
    fields:
      - { name: bike_id, type: string, source: input, description: "FK -> DonatedBike.id (path-scoped); bike HARVESTED or SCRAP_PENDING; at most one OPEN ticket per bike -> ERR_SCRAP_TICKET_OPEN" }
      - { name: material, type: enum, source: input, description: "Frame material for payout rate", constraints: "enum: STEEL, ALUMINUM, MIXED" }
      - { name: weight_kg, type: number, source: input, description: "Frame weight; 0 < w <= 100", constraints: "0 < w <= 100 -> ERR_WEIGHT_INVALID" }
      - { name: recycler_name, type: string, source: input, description: "Recycling vendor" }
      - { name: payout_cents, type: integer, source: computed, description: "round_half_up(weight_kg * RATE[material]) per ticket (see scrap_payout)" }
      - { name: status, type: enum, source: system, description: "OPEN | PICKED_UP", constraints: "enum: OPEN, PICKED_UP" }
      - { name: picked_up_at, type: datetime, source: system, description: "Logical clock at pickup; null until PICKED_UP" }

  - name: HelmetDistribution
    parent: null
    common_fields: false
    fields:
      - { name: helmet_part_id, type: string, source: input, description: "FK -> Part.id; Part.category must be HELMET -> ERR_NOT_A_HELMET_SKU" }
      - { name: recipient_kind, type: enum, source: input, description: "EARN_A_BIKE_GRADUATE | SALE_BUYER | GIVEAWAY_RECIPIENT | COMMUNITY", constraints: "exactly the matching FK must be present: participant_id for EARN_A_BIKE_GRADUATE, sale_id for SALE_BUYER, giveaway_id for GIVEAWAY_RECIPIENT, recipient_name (and no FK) for COMMUNITY -> ERR_RECIPIENT_REFERENCE_MISMATCH" }
      - { name: participant_id, type: string, source: input, description: "FK -> EarnABikeParticipant.id; required iff recipient_kind == EARN_A_BIKE_GRADUATE; participant must be HOURS_MET -> ERR_INVALID_STATE" }
      - { name: sale_id, type: string, source: input, description: "FK -> Sale.id; required iff recipient_kind == SALE_BUYER; sale must be PENDING -> ERR_INVALID_STATE" }
      - { name: giveaway_id, type: string, source: input, description: "FK -> GiveawayAward.id; required iff recipient_kind == GIVEAWAY_RECIPIENT; award must be APPROVED -> ERR_AWARD_NOT_APPROVED" }
      - { name: recipient_name, type: string, source: input, description: "Required iff recipient_kind == COMMUNITY" }
      - { name: distributed_by_user_id, type: string, source: system, description: "X-User-ID of distributor (opaque audit id, not an FK)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: DonatedBike
    field: status
    initial_state: RECEIVED
    terminal_states: [SOLD, GIFTED, SCRAPPED]
    transitions:
      - { from: RECEIVED, to: TRIAGED, trigger: "POST /bikes/{id}/triage", actor: ShopCoordinator, preconditions: ["status == RECEIVED"], side_effects: ["sets condition_grade, frame_damage", "bumps DonatedBike.version", "recomputes donor lifetime receipt fields (bike now graded)"] }
      - { from: TRIAGED, to: IN_REFURBISHMENT, trigger: "POST /bikes/{id}/route {destination: REFURBISH}", actor: ShopCoordinator, preconditions: ["condition_grade in {A, B, C} else ERR_GRADE_NOT_REFURBISHABLE", "refurb_lead_volunteer_id present; volunteer skill_level in {APPRENTICE, JOURNEYMAN, LEAD_MECHANIC} and engagement_status == ACTIVE else ERR_LEAD_INELIGIBLE"], side_effects: ["sets refurb_lead_volunteer_id", "bumps version"] }
      - { from: TRIAGED, to: HARVEST_QUEUE, trigger: "POST /bikes/{id}/route {destination: HARVEST}", actor: ShopCoordinator, preconditions: ["condition_grade in {C, D} else ERR_GRADE_NOT_HARVESTABLE"], side_effects: ["bumps version"] }
      - { from: TRIAGED, to: SCRAP_PENDING, trigger: "POST /bikes/{id}/route {destination: SCRAP}", actor: ShopCoordinator, preconditions: ["condition_grade == D and frame_damage == true else ERR_SCRAP_CRITERIA_NOT_MET"], side_effects: ["bumps version"] }
      - { from: IN_REFURBISHMENT, to: HARVEST_QUEUE, trigger: "POST /bikes/{id}/route {destination: HARVEST}", actor: ShopCoordinator, preconditions: ["no SafetyInspection with result PASS exists for this bike else ERR_INVALID_STATE"], side_effects: ["clears refurb_lead_volunteer_id to null", "COMMITTED PartUsage rows remain (consumed parts are not returned)", "bumps version"], note: "mid-refurb redirect when repair proves uneconomical" }
      - { from: IN_REFURBISHMENT, to: SAFETY_REVIEW, trigger: "POST /bikes/{id}/submit-safety", actor: Volunteer, preconditions: ["at least one PartUsage with status COMMITTED exists for this bike else ERR_NO_WORK_RECORDED", "caller volunteer engagement_status == ACTIVE else ERR_VOLUNTEER_SUSPENDED"], side_effects: ["bumps version"] }
      - { from: SAFETY_REVIEW, to: READY_FOR_DISPOSITION, trigger: "POST /bikes/{id}/safety-inspections with result PASS", actor: Volunteer, preconditions: ["inspector volunteer skill_level in {JOURNEYMAN, LEAD_MECHANIC} else ERR_INSPECTOR_SKILL_INSUFFICIENT", "inspector engagement_status == ACTIVE else ERR_VOLUNTEER_SUSPENDED", "inspector_volunteer_id != refurb_lead_volunteer_id else ERR_INSPECTOR_IS_REFURB_LEAD", "result == PASS requires every checklist item true else ERR_CHECKLIST_INCONSISTENT"], side_effects: ["creates SafetyInspection", "sets latest_inspection_result = PASS", "bumps version"] }
      - { from: SAFETY_REVIEW, to: IN_REFURBISHMENT, trigger: "POST /bikes/{id}/safety-inspections with result FAIL", actor: Volunteer, preconditions: ["same inspector gates as PASS path"], side_effects: ["creates SafetyInspection", "sets latest_inspection_result = FAIL", "rework_count += 1", "bumps version"], note: "rework cycle: bike returns to refurb and may be resubmitted" }
      - { from: READY_FOR_DISPOSITION, to: RESERVED_FOR_GRADUATE, trigger: "POST /participants/{pid}/reserve-bike {bike_id}", actor: "ShopCoordinator | Participant", preconditions: ["participant.status == HOURS_MET else ERR_HOURS_NOT_MET", "participant.reserved_bike_id is null else ERR_RESERVATION_EXISTS", "bike.status == READY_FOR_DISPOSITION else ERR_BIKE_NOT_AVAILABLE"], side_effects: ["sets participant.reserved_bike_id", "bumps bike.version and participant.version"] }
      - { from: RESERVED_FOR_GRADUATE, to: READY_FOR_DISPOSITION, trigger: "POST /participants/{pid}/release-bike, or cascade from participant WITHDRAWN/EXPIRED, or cascade from hour void demotion", actor: "ShopCoordinator | Participant | system", preconditions: ["participant.reserved_bike_id == this bike"], side_effects: ["clears participant.reserved_bike_id to null", "bumps bike.version and participant.version"] }
      - { from: READY_FOR_DISPOSITION, to: SOLD, trigger: "POST /sales/{id}/complete", actor: ShopCoordinator, preconditions: ["sale.status == PENDING else ERR_SALE_NOT_PENDING", "sale.bike_id == this bike", "a HelmetDistribution with recipient_kind SALE_BUYER and sale_id == sale.id exists else ERR_HELMET_REQUIRED"], side_effects: ["sets sale.final_price_cents/grand_total_cents/donation_cents/completed_at", "bumps bike.version"] }
      - { from: RESERVED_FOR_GRADUATE, to: GIFTED, trigger: "POST /participants/{pid}/graduate", actor: ProgramDirector, preconditions: ["participant.status == HOURS_MET else ERR_INVALID_STATE", "participant.reserved_bike_id == this bike else ERR_NO_BIKE_RESERVED", "safety_quiz_passed == true else ERR_QUIZ_NOT_PASSED", "a HelmetDistribution with recipient_kind EARN_A_BIKE_GRADUATE and participant_id exists else ERR_HELMET_REQUIRED"], side_effects: ["participant -> GRADUATED with graduated_at", "bumps bike.version and participant.version"], note: "the bike is PASS-certified by construction: RESERVED_FOR_GRADUATE is only reachable from READY_FOR_DISPOSITION, which requires latest_inspection_result == PASS, and no inspection can run while reserved" }
      - { from: READY_FOR_DISPOSITION, to: GIFTED, trigger: "POST /giveaways/{id}/fulfill", actor: ShopCoordinator, preconditions: ["award.status == APPROVED else ERR_AWARD_NOT_APPROVED", "X-User-ID != award.decided_by_user_id else ERR_FULFILLER_IS_APPROVER", "no PENDING Sale references this bike else ERR_SALE_PENDING_CONFLICT", "recipient_age_group == YOUTH requires a HelmetDistribution with giveaway_id else ERR_HELMET_REQUIRED"], side_effects: ["award -> FULFILLED with fulfilled_by_user_id", "bumps bike.version"] }
      - { from: HARVEST_QUEUE, to: HARVESTED, trigger: "POST /bikes/{id}/harvest-complete", actor: ShopCoordinator, preconditions: ["at least one PartHarvest exists for this bike else ERR_NO_HARVEST_RECORDED"], side_effects: ["bumps version"] }
      - { from: HARVESTED, to: SCRAP_PENDING, trigger: "POST /bikes/{id}/scrap-tickets", actor: ShopCoordinator, preconditions: ["no OPEN ScrapTicket for this bike else ERR_SCRAP_TICKET_OPEN"], side_effects: ["creates ScrapTicket with computed payout_cents", "bumps version"] }
      - { from: SCRAP_PENDING, to: SCRAPPED, trigger: "POST /scrap-tickets/{id}/pick-up", actor: ProgramDirector, preconditions: ["ticket.status == OPEN else ERR_TICKET_NOT_OPEN"], side_effects: ["ticket -> PICKED_UP with picked_up_at", "bumps bike.version and ticket.version"] }

  - entity: EarnABikeParticipant
    field: status
    initial_state: ENROLLED
    terminal_states: [GRADUATED, WITHDRAWN, EXPIRED]
    transitions:
      - { from: ENROLLED, to: HOURS_MET, trigger: "system on POST /hour-logs/{id}/approve", actor: system, preconditions: ["recomputed hours_earned >= required_hours (>= : equality triggers)"], side_effects: ["status -> HOURS_MET", "bumps version"], note: "auto-transition, part of hours_accrual" }
      - { from: HOURS_MET, to: ENROLLED, trigger: "system on POST /hour-logs/{id}/void", actor: system, preconditions: ["recomputed hours_earned < required_hours"], side_effects: ["if reserved_bike_id set: reserved bike -> READY_FOR_DISPOSITION and reserved_bike_id cleared (cascade link 3)", "bumps version"], note: "demotion unwind; part of hour-void cascade" }
      - { from: HOURS_MET, to: GRADUATED, trigger: "POST /participants/{id}/graduate", actor: ProgramDirector, preconditions: ["reserved_bike_id present else ERR_NO_BIKE_RESERVED", "safety_quiz_passed == true else ERR_QUIZ_NOT_PASSED", "EARN_A_BIKE_GRADUATE HelmetDistribution exists else ERR_HELMET_REQUIRED"], side_effects: ["bike -> GIFTED", "sets graduated_at", "bumps version"], note: "reserved bike is PASS-certified by construction (see DonatedBike RESERVED_FOR_GRADUATE -> GIFTED)" }
      - { from: ENROLLED, to: WITHDRAWN, trigger: "POST /participants/{id}/withdraw", actor: "ShopCoordinator | Participant", preconditions: ["status in {ENROLLED, HOURS_MET} else ERR_INVALID_STATE"], side_effects: ["if reserved_bike_id set: bike -> READY_FOR_DISPOSITION, reserved_bike_id cleared", "bumps version"] }
      - { from: HOURS_MET, to: WITHDRAWN, trigger: "POST /participants/{id}/withdraw", actor: "ShopCoordinator | Participant", preconditions: [], side_effects: ["if reserved_bike_id set: bike -> READY_FOR_DISPOSITION, reserved_bike_id cleared", "bumps version"] }
      - { from: ENROLLED, to: EXPIRED, trigger: "POST /ops/run-sweep", actor: system, preconditions: ["logical clock > enrollment_deadline"], side_effects: ["if reserved_bike_id set: bike -> READY_FOR_DISPOSITION, reserved_bike_id cleared", "bumps version"] }
      - { from: HOURS_MET, to: EXPIRED, trigger: "POST /ops/run-sweep", actor: system, preconditions: ["logical clock > enrollment_deadline"], side_effects: ["if reserved_bike_id set: bike -> READY_FOR_DISPOSITION, reserved_bike_id cleared", "bumps version"] }

  - entity: HourLog
    field: status
    initial_state: PENDING
    terminal_states: [REJECTED, VOIDED]
    transitions:
      - { from: PENDING, to: APPROVED, trigger: "POST /hour-logs/{id}/approve", actor: ShopCoordinator, preconditions: ["expected_participant_version == participant.version else ERR_STALE_VERSION", "participant.status in {ENROLLED, HOURS_MET} else ERR_PARTICIPANT_NOT_ACTIVE", "X-User-ID != created_by_user_id else ERR_REVIEWER_IS_LOGGER"], side_effects: ["sets reviewed_by_user_id", "participant.hours_earned recomputed (hours_accrual)", "participant.version += 1", "if hours_earned >= required_hours: participant -> HOURS_MET (cascade link 2)"] }
      - { from: PENDING, to: REJECTED, trigger: "POST /hour-logs/{id}/reject", actor: ShopCoordinator, preconditions: ["X-User-ID != created_by_user_id else ERR_REVIEWER_IS_LOGGER"], side_effects: ["sets reviewed_by_user_id"] }
      - { from: APPROVED, to: VOIDED, trigger: "POST /hour-logs/{id}/void", actor: ProgramDirector, preconditions: ["participant.status not in {GRADUATED} else ERR_INVALID_STATE (graduated ledgers are sealed)"], side_effects: ["sets reviewed_by_user_id + void_reason", "participant.hours_earned recomputed (decrements)", "participant.version += 1", "if participant was HOURS_MET and hours_earned < required_hours: participant -> ENROLLED (cascade link 2) which force-releases reserved bike (cascade link 3)"] }

  - entity: Volunteer
    field: skill_level
    initial_state: TRAINEE
    terminal_states: []
    note: "skill_level and engagement_status are independent state dimensions on one entity; both gate operations"
    transitions:
      - { from: TRAINEE, to: APPRENTICE, trigger: "POST /volunteers/{id}/promote", actor: ProgramDirector, preconditions: ["training_hours >= 8 and sessions_attended >= 2 else ERR_PROMOTION_CRITERIA_NOT_MET", "engagement_status == ACTIVE else ERR_VOLUNTEER_SUSPENDED"], side_effects: ["bumps version"] }
      - { from: APPRENTICE, to: JOURNEYMAN, trigger: "POST /volunteers/{id}/promote", actor: ProgramDirector, preconditions: ["training_hours >= 24 and sessions_attended >= 5 else ERR_PROMOTION_CRITERIA_NOT_MET", "engagement_status == ACTIVE else ERR_VOLUNTEER_SUSPENDED"], side_effects: ["bumps version"] }
      - { from: JOURNEYMAN, to: LEAD_MECHANIC, trigger: "POST /volunteers/{id}/promote", actor: ProgramDirector, preconditions: ["training_hours >= 60 and sessions_attended >= 12 and inspections_conducted >= 10 else ERR_PROMOTION_CRITERIA_NOT_MET", "engagement_status == ACTIVE else ERR_VOLUNTEER_SUSPENDED"], side_effects: ["bumps version"] }

  - entity: Volunteer
    field: engagement_status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - { from: ACTIVE, to: SUSPENDED, trigger: "system via no-show strike (noshow_strike) or POST /volunteers/{id}/suspend", actor: "system | ProgramDirector", preconditions: ["auto: no_show_count reaches >= 3 after a shift NO_SHOW; manual: none"], side_effects: ["all VolunteerShift rows of this volunteer in SCHEDULED -> CANCELLED (cascade link 3)", "bumps version"] }
      - { from: SUSPENDED, to: ACTIVE, trigger: "POST /volunteers/{id}/reinstate", actor: ProgramDirector, preconditions: [], side_effects: ["no_show_count reset to 0", "skill_level unchanged", "bumps version"] }

  - entity: TrainingSession
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - { from: SCHEDULED, to: COMPLETED, trigger: "POST /training-sessions/{id}/complete", actor: ShopCoordinator, preconditions: ["logical clock >= scheduled_end else ERR_SESSION_NOT_ENDED", "marks cover every ENROLLED attendance exactly once with outcome in {ATTENDED, NO_SHOW} else ERR_ATTENDANCE_MARKS_INCOMPLETE"], side_effects: ["each marked attendance -> ATTENDED or NO_SHOW", "per ATTENDED attendance: volunteer.training_hours += credit_hours, volunteer.sessions_attended += 1, volunteer.version += 1 (promotion_eligibility inputs)", "bumps version"] }
      - { from: SCHEDULED, to: CANCELLED, trigger: "POST /training-sessions/{id}/cancel", actor: ShopCoordinator, preconditions: [], side_effects: ["all ENROLLED attendances -> DROPPED", "bumps version"] }

  - entity: TrainingAttendance
    field: status
    initial_state: ENROLLED
    terminal_states: [ATTENDED, NO_SHOW, DROPPED]
    transitions:
      - { from: ENROLLED, to: ATTENDED, trigger: "POST /training-sessions/{id}/complete (marked ATTENDED)", actor: ShopCoordinator, preconditions: ["session completes"], side_effects: ["volunteer.training_hours += session.credit_hours", "volunteer.sessions_attended += 1"] }
      - { from: ENROLLED, to: NO_SHOW, trigger: "POST /training-sessions/{id}/complete (marked NO_SHOW)", actor: ShopCoordinator, preconditions: ["session completes"], side_effects: [] }
      - { from: ENROLLED, to: DROPPED, trigger: "POST /training-sessions/{id}/cancel", actor: ShopCoordinator, preconditions: ["session cancelled"], side_effects: [] }

  - entity: VolunteerShift
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - { from: SCHEDULED, to: CHECKED_IN, trigger: "POST /shifts/{id}/check-in", actor: Volunteer, preconditions: ["X-User-ID == shift.volunteer_id else ERR_NOT_YOUR_SHIFT", "volunteer.engagement_status == ACTIVE else ERR_VOLUNTEER_SUSPENDED", "logical clock within [scheduled_start - 15m, scheduled_end] else ERR_CHECKIN_WINDOW_CLOSED"], side_effects: ["sets checked_in_at", "bumps version"] }
      - { from: CHECKED_IN, to: COMPLETED, trigger: "POST /shifts/{id}/complete", actor: ShopCoordinator, preconditions: [], side_effects: ["credited_minutes = min(480, scheduled duration)", "volunteer.shift_minutes += credited_minutes", "bumps version"] }
      - { from: SCHEDULED, to: CANCELLED, trigger: "POST /shifts/{id}/cancel, or cascade from volunteer SUSPENDED", actor: "ShopCoordinator | Volunteer | system", preconditions: ["manual: caller is ShopCoordinator or owning volunteer (else ERR_NOT_YOUR_SHIFT)"], side_effects: ["bumps version"] }
      - { from: SCHEDULED, to: NO_SHOW, trigger: "POST /ops/run-sweep", actor: system, preconditions: ["logical clock >= scheduled_end + 30 minutes"], side_effects: ["volunteer.no_show_count += 1 (noshow_strike)", "if no_show_count >= 3: volunteer -> SUSPENDED (cascade link 2) which cancels this volunteer's remaining SCHEDULED shifts (cascade link 3)", "bumps version"] }

  - entity: ToolMembership
    field: status
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - { from: ACTIVE, to: SUSPENDED, trigger: "POST /memberships/{id}/suspend", actor: ShopCoordinator, preconditions: [], side_effects: ["records suspended_reason", "bumps version"] }
      - { from: SUSPENDED, to: ACTIVE, trigger: "POST /memberships/{id}/reinstate", actor: ShopCoordinator, preconditions: [], side_effects: ["bumps version"], note: "cycle ACTIVE -> SUSPENDED -> ACTIVE permitted repeatedly" }
      - { from: ACTIVE, to: EXPIRED, trigger: "POST /ops/run-sweep", actor: system, preconditions: ["logical clock date > end_date"], side_effects: ["bumps version"] }
      - { from: SUSPENDED, to: EXPIRED, trigger: "POST /ops/run-sweep", actor: system, preconditions: ["logical clock date > end_date"], side_effects: ["bumps version"] }

  - entity: ToolSession
    field: status
    initial_state: BOOKED
    terminal_states: [CLOSED, CANCELLED, NO_SHOW]
    transitions:
      - { from: BOOKED, to: IN_USE, trigger: "POST /sessions/{id}/start", actor: Member, preconditions: ["X-User-ID == session.membership_id else ERR_MEMBER_NOT_OWNER", "membership.status == ACTIVE else ERR_MEMBERSHIP_NOT_ACTIVE", "logical clock >= start_time - 10 minutes else ERR_START_TOO_EARLY"], side_effects: ["sets started_at", "bumps version"] }
      - { from: IN_USE, to: CLOSED, trigger: "POST /sessions/{id}/close", actor: "Member | ShopCoordinator", preconditions: ["Member caller: X-User-ID == session.membership_id else ERR_MEMBER_NOT_OWNER"], side_effects: ["sets closed_at", "session becomes billable (membership_billing input set)", "bumps version"] }
      - { from: BOOKED, to: CANCELLED, trigger: "POST /sessions/{id}/cancel", actor: "Member | ShopCoordinator", preconditions: ["Member caller: X-User-ID == session.membership_id else ERR_MEMBER_NOT_OWNER"], side_effects: ["bumps version"] }
      - { from: BOOKED, to: NO_SHOW, trigger: "POST /ops/run-sweep", actor: system, preconditions: ["logical clock >= start_time + 30 minutes"], side_effects: ["bumps version"], note: "NO_SHOW sessions are never billable" }

  - entity: Sale
    field: status
    initial_state: PENDING
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - { from: PENDING, to: COMPLETED, trigger: "POST /sales/{id}/complete", actor: ShopCoordinator, preconditions: ["bike.status == READY_FOR_DISPOSITION else ERR_BIKE_NOT_AVAILABLE", "SALE_BUYER HelmetDistribution for this sale exists else ERR_HELMET_REQUIRED"], side_effects: ["recomputes FINAL price variant from current bike.parts_cost_cents and current membership status", "sets final_price_cents, grand_total_cents, donation_cents, payment_method, completed_at", "bike -> SOLD", "bumps sale.version and bike.version"] }
      - { from: PENDING, to: VOIDED, trigger: "POST /sales/{id}/void", actor: ProgramDirector, preconditions: [], side_effects: ["bike stays READY_FOR_DISPOSITION (bike was never transitioned)", "HelmetDistribution rows referencing this sale remain recorded (events immutable)", "bumps version"] }

  - entity: GiveawayAward
    field: status
    initial_state: REQUESTED
    terminal_states: [DENIED, FULFILLED, CANCELLED]
    transitions:
      - { from: REQUESTED, to: APPROVED, trigger: "POST /giveaways/{id}/approve", actor: ProgramDirector, preconditions: ["bike.status == READY_FOR_DISPOSITION else ERR_BIKE_NOT_AVAILABLE", "giveaway_quota: count of awards APPROVED or FULFILLED with decided_at in current calendar month < 4 else ERR_GIVEAWAY_QUOTA_EXCEEDED"], side_effects: ["sets decided_by_user_id, decided_at", "bumps version"] }
      - { from: REQUESTED, to: DENIED, trigger: "POST /giveaways/{id}/deny", actor: ProgramDirector, preconditions: [], side_effects: ["sets decided_by_user_id, decided_at", "bumps version"] }
      - { from: APPROVED, to: FULFILLED, trigger: "POST /giveaways/{id}/fulfill", actor: ShopCoordinator, preconditions: ["X-User-ID != decided_by_user_id else ERR_FULFILLER_IS_APPROVER", "bike.status == READY_FOR_DISPOSITION else ERR_BIKE_NOT_AVAILABLE", "no PENDING Sale for this bike else ERR_SALE_PENDING_CONFLICT", "recipient_age_group == YOUTH requires GIVEAWAY_RECIPIENT HelmetDistribution else ERR_HELMET_REQUIRED"], side_effects: ["sets fulfilled_by_user_id", "bike -> GIFTED", "bumps award.version and bike.version"] }
      - { from: APPROVED, to: CANCELLED, trigger: "POST /giveaways/{id}/cancel", actor: ProgramDirector, preconditions: [], side_effects: ["frees monthly quota slot (CANCELLED excluded from giveaway_quota count)", "bumps version"] }

  - entity: ScrapTicket
    field: status
    initial_state: OPEN
    terminal_states: [PICKED_UP]
    transitions:
      - { from: OPEN, to: PICKED_UP, trigger: "POST /scrap-tickets/{id}/pick-up", actor: ProgramDirector, preconditions: [], side_effects: ["sets picked_up_at", "bike SCRAP_PENDING -> SCRAPPED", "ticket enters scrap statement for month of picked_up_at", "bumps version"] }

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; all other conflicts are state preconditions)
# =============================================================================
concurrency_rules:
  - rule_id: part-usage-stale-stock
    parent_entity: Part
    write_endpoint: "POST /bikes/{id}/usage-logs"
    occ_field: expected_part_version
    description: |
      Logging a PartUsage against a Part whose version has advanced since the
      caller last read it is rejected. The caller's stock view is stale: an
      earlier usage, restock, harvest, helmet distribution, or usage void has
      already moved quantity_on_hand. The caller must re-read the Part and
      resubmit with the fresh version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: hour-approval-stale-participant
    parent_entity: EarnABikeParticipant
    write_endpoint: "POST /hour-logs/{id}/approve"
    occ_field: expected_participant_version
    description: |
      Approving an HourLog while carrying an EarnABikeParticipant version the
      server has already advanced is rejected. A prior approval, void, quiz
      update, reservation, or cascaded demotion has changed the participant
      since the caller observed it, so the caller's hours_earned basis is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: sale_price
    trigger: "Sale creation (variant QUOTED -> quoted_price_cents) and Sale completion (variant FINAL -> final_price_cents)"
    algorithm: tiered_pricing
    formula: |
      BASE = {KIDS: 4000, BMX: 6000, HYBRID: 9000, ROAD: 12000, MTB: 12000, CARGO: 18000}
      GRADE_MULT = {A: 1.00, B: 0.80, C: 0.40}      # grade D bikes never reach sale
      step1 = round_half_up(BASE[bike.bike_type] * GRADE_MULT[bike.condition_grade])
      surcharge = min(round_half_up(bike.parts_cost_cents * 0.5), SURCHARGE_CAP)   # SURCHARGE_CAP = 3000
      step2 = step1 + surcharge
      discount = round_half_up(step2 * 0.10) if buyer_membership references an ACTIVE ToolMembership else 0
      step3 = step2 - discount
      price = max(step3, PRICE_FLOOR)                 # PRICE_FLOOR = 2000
      Evaluation order is pinned exactly as written: grade tier -> surcharge cap ->
      member discount -> floor. Membership status is read at evaluation time.
    input_set: "the Sale's bike (bike_type, condition_grade, current parts_cost_cents) and the Sale's buyer_membership_id (membership must be ACTIVE to discount)"
    constants: { SURCHARGE_CAP: 3000, PRICE_FLOOR: 2000, MEMBER_DISCOUNT_PCT: 0.10 }
    precision: "integer cents; round_half_up at each step marked"
    variants:
      - { name: QUOTED, when: "at Sale creation", difference: "evaluated against bike/membership state at creation; stored in quoted_price_cents and never rewritten" }
      - { name: FINAL, when: "at Sale completion", difference: "re-evaluated against current parts_cost_cents and current membership status; if the membership was suspended after creation the discount disappears and FINAL > QUOTED" }

  - name: sale_settlement_roundup
    trigger: "Sale completion, after final_price_cents is computed"
    algorithm: threshold
    formula: |
      if sale.round_up == false: grand_total_cents = final_price_cents; donation_cents = 0
      else:
        grand_total_cents = ceil(final_price_cents / 500) * 500    # smallest multiple of 500 >= final (>= : an exact multiple yields zero donation)
        donation_cents = grand_total_cents - final_price_cents
      Order is pinned: final_price_cents MUST be fully evaluated (including floor)
      before the round-up tier is selected; the donation derives from the rounded
      grand total, never the reverse.
    input_set: "the completing Sale"
    constants: { ROUNDUP_STEP: 500 }
    precision: "integer cents"

  - name: donation_receipt_value
    trigger: "GET /donors/{id}/receipt and recompute of donor.lifetime_receipt_value_cents"
    algorithm: aggregation
    formula: |
      Input set S = donor's DonatedBike rows whose created_at falls in the requested
      calendar year AND condition_grade is not null (ungraded RECEIVED bikes excluded).
      FLAT_SCHEDULE per-bike value: {A: 15000, B: 9000, C: 4000, D: 1000}
      FMV_COMPARABLE per-bike value:
        grade in {A, B, C}: round_half_up(BASE[bike_type] * GRADE_MULT[grade] * 0.60)   # BASE/GRADE_MULT from sale_price
        grade D:            round_half_up(BASE[bike_type] * 0.10)
      Rounding order is pinned: each per-bike value is rounded to whole cents FIRST,
      then the rounded values are summed. (Summing raw values then rounding once is
      the rejected alternative and can differ by cents.)
      flat_total_cents = sum of FLAT per-bike values over S
      fmv_total_cents  = sum of FMV per-bike values over S
      effective_total_cents = flat_total_cents if donor.receipt_method == FLAT_SCHEDULE else fmv_total_cents
      lifetime_receipt_value_cents = effective variant evaluated over all years
    input_set: "DonatedBike rows of the donor filtered by created_at year and graded (condition_grade not null)"
    constants: { FMV_FACTOR: 0.60, GRADE_D_FACTOR: 0.10 }
    precision: "integer cents; per-bike round_half_up before summation"
    variants:
      - { name: FLAT_SCHEDULE, when: "donor.receipt_method == FLAT_SCHEDULE", difference: "flat per-grade schedule; ignores bike_type" }
      - { name: FMV_COMPARABLE, when: "donor.receipt_method == FMV_COMPARABLE", difference: "60% of comparable sale base (10% for grade D); sensitive to bike_type; both totals are returned side by side and diverge for the same bike set" }

  - name: parts_cost_rollup
    trigger: "PartUsage creation and void for a bike"
    algorithm: aggregation
    formula: |
      bike.parts_cost_cents = sum over the bike's PartUsage rows with status COMMITTED
      of (quantity * unit_cost_cents), where unit_cost_cents is the snapshot frozen on
      the PartUsage row at creation. Later restocks that change Part.unit_cost_cents do
      NOT rewrite existing snapshots. Voiding restores: bike.parts_cost_cents decreases
      by quantity * unit_cost_cents of the voided row.
    input_set: "PartUsage rows of the bike with status COMMITTED"
    constants: {}
    precision: "integer cents"

  - name: scrap_payout
    trigger: "ScrapTicket creation (per-ticket payout) and GET /scrap-tickets/statement (monthly total)"
    algorithm: aggregation
    formula: |
      RATE = {STEEL: 15, ALUMINUM: 85, MIXED: 10}     # cents per kg
      ticket.payout_cents = round_half_up(ticket.weight_kg * RATE[ticket.material])
      statement(month) = sum of payout_cents over ScrapTicket rows with
        status == PICKED_UP and picked_up_at within that calendar month.
      Rounding order is pinned: each ticket is rounded to whole cents at creation and
      the statement sums the ALREADY-ROUNDED per-ticket values. (Multiplying total
      weight by the rate then rounding once is the rejected alternative; e.g. three
      2.5kg ALUMINUM tickets pay 3 * 213 = 639, not round(637.5) = 638.)
    input_set: "per-ticket: the created ticket; statement: PICKED_UP tickets with picked_up_at in the requested month"
    constants: { RATE_STEEL: 15, RATE_ALUMINUM: 85, RATE_MIXED: 10 }
    precision: "integer cents; per-ticket round_half_up before summation"

  - name: hours_accrual
    trigger: "HourLog approve (increments) and void (decrements)"
    algorithm: threshold
    formula: |
      participant.hours_earned = sum of hours over the participant's HourLog rows
      with status == APPROVED (PENDING, REJECTED, VOIDED excluded).
      required_hours = 8 if age_group == YOUTH else 12.
      Auto-transition: after any recompute, if participant.status == ENROLLED and
      hours_earned >= required_hours then status -> HOURS_MET (>= : equality triggers);
      if participant.status == HOURS_MET and hours_earned < required_hours then
      status -> ENROLLED and any reserved bike is force-released.
      Daily logging cap (separate from accrual): for any calendar work_date, the sum
      of hours over the participant's HourLog rows in {PENDING, APPROVED} on that date
      must be <= 6 at creation time else ERR_DAILY_HOURS_EXCEEDED (REJECTED and VOIDED
      rows free their hours).
    input_set: "HourLog rows of the participant, filtered by status as stated"
    constants: { YOUTH_REQUIRED_HOURS: 8, ADULT_REQUIRED_HOURS: 12, DAILY_CAP_HOURS: 6 }
    precision: "whole hours (integer)"

  - name: membership_billing
    trigger: "GET /memberships/{id}/billing?month=YYYY-MM"
    algorithm: tiered_pricing
    formula: |
      Billable sessions = the membership's ToolSession rows with status in
      {IN_USE, CLOSED} and start_time within [month-01 00:00Z, next-month-01 00:00Z).
      BOOKED, CANCELLED and NO_SHOW sessions are excluded.
      PER_SESSION variant (tier BASIC): amount_cents = min(session_count * 400, 3000)
      FLAT_MONTHLY variant (tier PRO):  amount_cents = 2500 regardless of session_count
      The two variants diverge for identical session data: e.g. 8 billable sessions
      bill 3000 under PER_SESSION (cap binds at 3200 > 3000) but 2500 under FLAT_MONTHLY;
      6 sessions bill 2400 vs 2500 (PER_SESSION cheaper below the crossover).
    input_set: "ToolSession rows of the membership filtered by status and start_time month"
    constants: { PER_SESSION_CENTS: 400, PER_SESSION_MONTHLY_CAP: 3000, FLAT_MONTHLY_CENTS: 2500 }
    precision: "integer cents"
    variants:
      - { name: PER_SESSION, when: "membership.tier == BASIC", difference: "400 per billable session, capped at 3000 per month" }
      - { name: FLAT_MONTHLY, when: "membership.tier == PRO", difference: "flat 2500 per month regardless of usage" }

  - name: giveaway_quota
    trigger: "POST /giveaways/{id}/approve"
    algorithm: threshold
    formula: |
      month_count = count of GiveawayAward rows with status in {APPROVED, FULFILLED}
      and decided_at within the calendar month of the current logical clock.
      REQUESTED, DENIED and CANCELLED rows are excluded (a cancel frees the slot).
      Approve is allowed iff month_count < 4 at the moment of approval
      (< 4 : approving the 4th award of the month succeeds; the 5th is rejected).
    input_set: "GiveawayAward rows filtered by status and decided_at month"
    constants: { MONTHLY_GIVEAWAY_CAP: 4 }
    precision: "integer count"

  - name: promotion_eligibility
    trigger: "POST /volunteers/{id}/promote (gate) and recompute of volunteer training_hours/sessions_attended on attendance ATTENDED"
    algorithm: threshold
    formula: |
      volunteer.training_hours = sum of credit_hours over ATTENDED attendances
      volunteer.sessions_attended = count of ATTENDED attendances
      volunteer.inspections_conducted = count of SafetyInspection rows with inspector_volunteer_id == volunteer.id
      APPRENTICE     requires training_hours >= 8  AND sessions_attended >= 2
      JOURNEYMAN     requires training_hours >= 24 AND sessions_attended >= 5
      LEAD_MECHANIC  requires training_hours >= 60 AND sessions_attended >= 12 AND inspections_conducted >= 10
      All thresholds are >= : meeting the exact threshold is eligible.
    input_set: "TrainingAttendance rows with status ATTENDED; SafetyInspection rows by inspector"
    constants: { APPRENTICE_HOURS: 8, APPRENTICE_SESSIONS: 2, JOURNEYMAN_HOURS: 24, JOURNEYMAN_SESSIONS: 5, LEAD_HOURS: 60, LEAD_SESSIONS: 12, LEAD_INSPECTIONS: 10 }
    precision: "integer counts"

  - name: noshow_strike
    trigger: "VolunteerShift -> NO_SHOW via ops sweep"
    algorithm: threshold
    formula: |
      volunteer.no_show_count += 1 per shift marked NO_SHOW.
      When no_show_count >= 3 (>= : the third strike suspends), the volunteer's
      engagement_status -> SUSPENDED and every remaining SCHEDULED shift of that
      volunteer -> CANCELLED. Reinstatement resets no_show_count to 0.
    input_set: "VolunteerShift rows transitioning to NO_SHOW in this sweep, processed in scheduled_start ASC order; ties by created_at ASC"
    constants: { NO_SHOW_LIMIT: 3 }
    precision: "integer count"

  - name: shift_credit
    trigger: "VolunteerShift -> COMPLETED"
    algorithm: aggregation
    formula: |
      credited_minutes = min(480, scheduled_end - scheduled_start in whole minutes)
      volunteer.shift_minutes = sum of credited_minutes over COMPLETED shifts
    input_set: "the completing shift"
    constants: { MAX_SHIFT_MINUTES: 480 }
    precision: "whole minutes"

  - name: low_stock_flag
    trigger: "Part quantity_on_hand changes (restock, harvest, usage create/void, helmet distribution)"
    algorithm: threshold
    formula: "part.low_stock = (quantity_on_hand <= reorder_threshold); equality counts as low"
    input_set: "the mutated Part"
    constants: {}
    precision: "boolean"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first match wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is a known role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "caller role is in the endpoint's roles list; entity-backed ownership: Participant may only touch own participant record/hour-logs, Volunteer may only check in/cancel own shifts, Member may only act on own membership/sessions", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "request well-formedness (schema gate runs with the envelope/auth checks, before any resource lookup): required fields present, JSON types valid, enum members valid, fixed numeric ranges (hours 1..6)", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "path ids exist left-to-right, then body FK ids (donor_id, part_id, bike_id, volunteer_id, buyer_membership_id, helmet_part_id, recipient FKs, shift_id)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: state, check: "OCC: expected_part_version == Part.version on usage create; expected_participant_version == EarnABikeParticipant.version on hour approve", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /bikes/{id}/usage-logs, POST /hour-logs/{id}/approve" }
  - { priority: 6, category: state, check: "state-machine from-state holds for the targeted entity (bike triage/route/submit/inspect/harvest/scrap preconditions; sale PENDING; award REQUESTED/APPROVED; ticket OPEN; session/membership/participant/hourlog states)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: state, check: "bike referenced by sale/giveaway create, giveaway approve/fulfill, sale complete, reserve-bike is in the required disposition state", error_id: ERR_BIKE_NOT_AVAILABLE, http_status: 409, applies_to: "POST /sales, POST /giveaways, POST /giveaways/{id}/approve, POST /giveaways/{id}/fulfill, POST /sales/{id}/complete, POST /participants/{id}/reserve-bike" }
  - { priority: 6, category: state, check: "award is APPROVED where required (fulfill; GIVEAWAY_RECIPIENT helmet distribution)", error_id: ERR_AWARD_NOT_APPROVED, http_status: 409, applies_to: "POST /giveaways/{id}/fulfill, POST /helmet-distributions" }
  - { priority: 6, category: state, check: "sale is PENDING where required (complete; void; SALE_BUYER helmet distribution)", error_id: ERR_SALE_NOT_PENDING, http_status: 409, applies_to: "POST /sales/{id}/complete, POST /sales/{id}/void, POST /helmet-distributions" }
  - { priority: 6, category: state, check: "scrap ticket OPEN at pickup", error_id: ERR_TICKET_NOT_OPEN, http_status: 409, applies_to: "POST /scrap-tickets/{id}/pick-up" }
  - { priority: 6, category: state, check: "membership ACTIVE where required (session create/start; sale discount reference)", error_id: ERR_MEMBERSHIP_NOT_ACTIVE, http_status: 409, applies_to: "POST /memberships/{id}/sessions, POST /sessions/{id}/start, POST /sales" }
  - { priority: 6, category: state, check: "participant ENROLLED or HOURS_MET where required (hour-log create; approve)", error_id: ERR_PARTICIPANT_NOT_ACTIVE, http_status: 409, applies_to: "POST /participants/{id}/hour-logs, POST /hour-logs/{id}/approve" }
  - { priority: 6, category: state, check: "usage row COMMITTED at void", error_id: ERR_USAGE_NOT_COMMITTED, http_status: 409, applies_to: "POST /usage-logs/{id}/void" }
  - { priority: 7, category: business_safety, check: "safety inspector is not the bike's refurb lead (segregation of duties)", error_id: ERR_INSPECTOR_IS_REFURB_LEAD, http_status: 422, applies_to: "POST /bikes/{id}/safety-inspections" }
  - { priority: 7, category: business_safety, check: "result PASS requires every checklist item true", error_id: ERR_CHECKLIST_INCONSISTENT, http_status: 422, applies_to: "POST /bikes/{id}/safety-inspections" }
  - { priority: 7, category: business_safety, check: "helmet compliance: graduation requires EARN_A_BIKE_GRADUATE distribution; YOUTH giveaway fulfillment requires GIVEAWAY_RECIPIENT distribution; sale completion requires SALE_BUYER distribution", error_id: ERR_HELMET_REQUIRED, http_status: 422, applies_to: "POST /participants/{id}/graduate, POST /giveaways/{id}/fulfill, POST /sales/{id}/complete" }
  - { priority: 7, category: business_safety, check: "hour-log reviewer differs from creator (segregation of duties)", error_id: ERR_REVIEWER_IS_LOGGER, http_status: 403, applies_to: "POST /hour-logs/{id}/approve, POST /hour-logs/{id}/reject, POST /hour-logs/{id}/void" }
  - { priority: 7, category: business_safety, check: "giveaway fulfiller differs from approver (segregation of duties)", error_id: ERR_FULFILLER_IS_APPROVER, http_status: 403, applies_to: "POST /giveaways/{id}/fulfill" }
  - { priority: 8, category: business_constraint, check: "serial_number unique across all bikes", error_id: ERR_SERIAL_NUMBER_CONFLICT, http_status: 409, applies_to: "POST /bikes" }
  - { priority: 8, category: business_constraint, check: "part name unique", error_id: ERR_PART_NAME_CONFLICT, http_status: 409, applies_to: "POST /parts" }
  - { priority: 8, category: business_constraint, check: "category HELMET requires helmet_size; non-HELMET must not set helmet_size", error_id: ERR_HELMET_SIZE_REQUIRED, http_status: 422, applies_to: "POST /parts" }
  - { priority: 8, category: business_constraint, check: "grade routing: REFURBISH requires grade in {A,B,C}; HARVEST requires grade in {C,D}", error_id: ERR_GRADE_NOT_REFURBISHABLE, http_status: 422, applies_to: "POST /bikes/{id}/route" }
  - { priority: 8, category: business_constraint, check: "HARVEST destination on grade {A,B}", error_id: ERR_GRADE_NOT_HARVESTABLE, http_status: 422, applies_to: "POST /bikes/{id}/route" }
  - { priority: 8, category: business_constraint, check: "SCRAP destination requires grade D with frame_damage", error_id: ERR_SCRAP_CRITERIA_NOT_MET, http_status: 422, applies_to: "POST /bikes/{id}/route" }
  - { priority: 8, category: business_constraint, check: "refurb lead volunteer exists, skill >= APPRENTICE, engagement ACTIVE", error_id: ERR_LEAD_INELIGIBLE, http_status: 422, applies_to: "POST /bikes/{id}/route" }
  - { priority: 8, category: business_constraint, check: "acting volunteer engagement ACTIVE (usage, harvest, submit-safety, inspection, shift create, check-in, enroll)", error_id: ERR_VOLUNTEER_SUSPENDED, http_status: 422, applies_to: "POST /bikes/{id}/usage-logs, POST /bikes/{id}/harvest-logs, POST /bikes/{id}/submit-safety, POST /bikes/{id}/safety-inspections, POST /shifts, POST /shifts/{id}/check-in, POST /training-sessions/{id}/enroll" }
  - { priority: 8, category: business_constraint, check: "usage logger skill >= APPRENTICE", error_id: ERR_USAGE_SKILL_INSUFFICIENT, http_status: 422, applies_to: "POST /bikes/{id}/usage-logs" }
  - { priority: 8, category: business_constraint, check: "safety inspector skill >= JOURNEYMAN", error_id: ERR_INSPECTOR_SKILL_INSUFFICIENT, http_status: 422, applies_to: "POST /bikes/{id}/safety-inspections" }
  - { priority: 8, category: business_constraint, check: "submit-safety requires at least one COMMITTED PartUsage", error_id: ERR_NO_WORK_RECORDED, http_status: 422, applies_to: "POST /bikes/{id}/submit-safety" }
  - { priority: 8, category: business_constraint, check: "harvest-complete requires at least one PartHarvest", error_id: ERR_NO_HARVEST_RECORDED, http_status: 422, applies_to: "POST /bikes/{id}/harvest-complete" }
  - { priority: 8, category: business_constraint, check: "at most one OPEN scrap ticket per bike", error_id: ERR_SCRAP_TICKET_OPEN, http_status: 409, applies_to: "POST /bikes/{id}/scrap-tickets" }
  - { priority: 8, category: business_constraint, check: "at most one PENDING sale per bike", error_id: ERR_SALE_ALREADY_PENDING, http_status: 409, applies_to: "POST /sales" }
  - { priority: 8, category: business_constraint, check: "giveaway fulfill blocked while a PENDING sale references the bike", error_id: ERR_SALE_PENDING_CONFLICT, http_status: 409, applies_to: "POST /giveaways/{id}/fulfill" }
  - { priority: 8, category: business_constraint, check: "no second attendance row for the same (session, volunteer)", error_id: ERR_ALREADY_ENROLLED, http_status: 409, applies_to: "POST /training-sessions/{id}/enroll" }
  - { priority: 8, category: business_constraint, check: "enrolled_count < session.capacity", error_id: ERR_TRAINING_FULL, http_status: 422, applies_to: "POST /training-sessions/{id}/enroll" }
  - { priority: 8, category: business_constraint, check: "promotion thresholds per promotion_eligibility (>= exact boundary eligible)", error_id: ERR_PROMOTION_CRITERIA_NOT_MET, http_status: 422, applies_to: "POST /volunteers/{id}/promote" }
  - { priority: 8, category: business_constraint, check: "participant holds no reservation before reserve-bike", error_id: ERR_RESERVATION_EXISTS, http_status: 409, applies_to: "POST /participants/{id}/reserve-bike" }
  - { priority: 8, category: business_constraint, check: "graduation requires a reserved bike", error_id: ERR_NO_BIKE_RESERVED, http_status: 422, applies_to: "POST /participants/{id}/graduate" }
  - { priority: 8, category: business_constraint, check: "graduation requires safety_quiz_passed", error_id: ERR_QUIZ_NOT_PASSED, http_status: 422, applies_to: "POST /participants/{id}/graduate" }
  - { priority: 8, category: business_constraint, check: "reserve-bike requires participant HOURS_MET", error_id: ERR_HOURS_NOT_MET, http_status: 422, applies_to: "POST /participants/{id}/reserve-bike" }
  - { priority: 8, category: business_constraint, check: "harvested part category must not be HELMET (helmets are purchased stock)", error_id: ERR_NOT_HARVESTABLE_CATEGORY, http_status: 422, applies_to: "POST /bikes/{id}/harvest-logs" }
  - { priority: 8, category: business_constraint, check: "session completion marks every ENROLLED attendance exactly once", error_id: ERR_ATTENDANCE_MARKS_INCOMPLETE, http_status: 422, applies_to: "POST /training-sessions/{id}/complete" }
  - { priority: 8, category: business_constraint, check: "quantity >= 1 on usage/harvest/restock payloads", error_id: ERR_QUANTITY_INVALID, http_status: 422, applies_to: "POST /bikes/{id}/usage-logs, POST /bikes/{id}/harvest-logs, POST /parts/{id}/restock" }
  - { priority: 9, category: business_temporal, check: "volunteer shift overlap: new [start, end) must not intersect any existing SCHEDULED/CHECKED_IN shift of the same volunteer; touching endpoints (end == start) are allowed (half-open)", error_id: ERR_SHIFT_OVERLAP, http_status: 409, applies_to: "POST /shifts" }
  - { priority: 9, category: business_temporal, check: "shift duration within 30..480 minutes", error_id: ERR_SHIFT_DURATION_INVALID, http_status: 422, applies_to: "POST /shifts" }
  - { priority: 9, category: business_temporal, check: "check-in clock within [scheduled_start - 15m, scheduled_end]", error_id: ERR_CHECKIN_WINDOW_CLOSED, http_status: 422, applies_to: "POST /shifts/{id}/check-in" }
  - { priority: 9, category: business_temporal, check: "stand buffer: on the same stand_number, new session must satisfy new.start >= existing.end + 15m OR new.end + 15m <= existing.start against every BOOKED/IN_USE session; mere adjacency (gap < 15m) is rejected", error_id: ERR_STAND_BUFFER_CONFLICT, http_status: 409, applies_to: "POST /memberships/{id}/sessions" }
  - { priority: 9, category: business_temporal, check: "session duration within 30..180 minutes", error_id: ERR_SESSION_DURATION_INVALID, http_status: 422, applies_to: "POST /memberships/{id}/sessions" }
  - { priority: 9, category: business_temporal, check: "stand_number within 1..4", error_id: ERR_STAND_NUMBER_INVALID, http_status: 422, applies_to: "POST /memberships/{id}/sessions" }
  - { priority: 9, category: business_temporal, check: "session start allowed from start_time - 10m onward", error_id: ERR_START_TOO_EARLY, http_status: 422, applies_to: "POST /sessions/{id}/start" }
  - { priority: 9, category: business_temporal, check: "hour-log work_date within [enrollment date, min(current clock date, enrollment_deadline date)]", error_id: ERR_WORK_DATE_OUT_OF_WINDOW, http_status: 422, applies_to: "POST /participants/{id}/hour-logs" }
  - { priority: 9, category: business_temporal, check: "daily cap: PENDING+APPROVED hours on the same work_date <= 6 including the new log", error_id: ERR_DAILY_HOURS_EXCEEDED, http_status: 422, applies_to: "POST /participants/{id}/hour-logs" }
  - { priority: 9, category: business_temporal, check: "training session completable only when clock >= scheduled_end", error_id: ERR_SESSION_NOT_ENDED, http_status: 422, applies_to: "POST /training-sessions/{id}/complete" }
  - { priority: 10, category: business_fiscal, check: "usage quantity <= Part.quantity_on_hand", error_id: ERR_INSUFFICIENT_STOCK, http_status: 422, applies_to: "POST /bikes/{id}/usage-logs" }
  - { priority: 10, category: business_fiscal, check: "helmet Part quantity_on_hand >= 1", error_id: ERR_HELMET_OUT_OF_STOCK, http_status: 422, applies_to: "POST /helmet-distributions" }
  - { priority: 10, category: business_fiscal, check: "monthly giveaway quota month_count < 4", error_id: ERR_GIVEAWAY_QUOTA_EXCEEDED, http_status: 422, applies_to: "POST /giveaways/{id}/approve" }
  - { priority: 10, category: business_fiscal, check: "scrap weight 0 < w <= 100 kg", error_id: ERR_WEIGHT_INVALID, http_status: 422, applies_to: "POST /bikes/{id}/scrap-tickets" }
  - { priority: 11, category: business_referential, check: "helmet recipient: exactly the FK matching recipient_kind is present and the others null; COMMUNITY requires recipient_name", error_id: ERR_RECIPIENT_REFERENCE_MISMATCH, http_status: 422, applies_to: "POST /helmet-distributions" }
  - { priority: 11, category: business_referential, check: "helmet_part_id references a Part with category HELMET", error_id: ERR_NOT_A_HELMET_SKU, http_status: 422, applies_to: "POST /helmet-distributions" }
  - { priority: 11, category: business_referential, check: "hour-log shift_id, when present, references a COMPLETED shift", error_id: ERR_SHIFT_NOT_CREDITABLE, http_status: 422, applies_to: "POST /participants/{id}/hour-logs" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock / ops ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Advance the logical clock (test-driving). Startup default is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall time.", roles: [ShopCoordinator], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["sets logical clock used by sweeps, windows, deadlines, quota months"] }
  - { method: POST, path: "/ops/run-sweep", description: "Ops-run checkpoint: expire participants past deadline (releasing reserved bikes), mark past-due SCHEDULED shifts NO_SHOW (strike cascade), mark past-due BOOKED sessions NO_SHOW, expire memberships past end_date", roles: [ShopCoordinator], code: 200, input: [], output: { participants_expired: integer, shifts_marked_no_show: integer, sessions_marked_no_show: integer, memberships_expired: integer }, side_effects: ["participant EXPIRED cascade releases reserved bike", "shift NO_SHOW strike may SUSPEND volunteer and cancel their remaining SCHEDULED shifts"] }

  # --- donors ---
  - { method: POST, path: "/donors", description: "Register a donor", roles: [ShopCoordinator], code: 201, input: [display_name, donor_type, email, "receipt_method?"], output: Donor, side_effects: [] }
  - { method: GET, path: "/donors/{id}", description: "Fetch donor", roles: [ShopCoordinator, ProgramDirector], code: 200, input: [], output: Donor, side_effects: [] }
  - { method: GET, path: "/donors", description: "List donors", roles: [ShopCoordinator, ProgramDirector], code: 200, input: ["donor_type?", "limit?", "offset?"], output: "Donor[]", side_effects: [] }
  - { method: GET, path: "/donors/{id}/receipt", description: "Computed read: annual donation receipt under BOTH valuation variants plus the effective variant; year defaults to the clock's current year", roles: [ShopCoordinator, ProgramDirector], code: 200, input: ["year?"], output: { donor_id: string, year: integer, bike_count: integer, flat_total_cents: integer, fmv_total_cents: integer, receipt_method: string, effective_total_cents: integer }, side_effects: ["runs donation_receipt_value"] }

  # --- bikes ---
  - { method: POST, path: "/bikes", description: "Donated bike intake (status RECEIVED)", roles: [ShopCoordinator], code: 201, input: [donor_id, serial_number, bike_type, wheel_size_inches], output: DonatedBike, side_effects: ["donor.donated_bike_count += 1"] }
  - { method: GET, path: "/bikes/{id}", description: "Fetch bike", roles: [ShopCoordinator, ProgramDirector, Volunteer, Participant, Member], code: 200, input: [], output: DonatedBike, side_effects: [] }
  - { method: GET, path: "/bikes", description: "List/filter bikes", roles: [ShopCoordinator, ProgramDirector, Volunteer, Participant, Member], code: 200, input: ["status?", "condition_grade?", "bike_type?", "donor_id?", "refurb_lead_volunteer_id?", "limit?", "offset?"], output: "DonatedBike[]", side_effects: [] }
  - { method: POST, path: "/bikes/{id}/triage", description: "Grade the bike: RECEIVED -> TRIAGED", roles: [ShopCoordinator], code: 200, input: [condition_grade, frame_damage], output: DonatedBike, side_effects: ["sets condition_grade/frame_damage", "recomputes donor receipt fields", "increments DonatedBike.version by 1"] }
  - { method: POST, path: "/bikes/{id}/route", description: "Route triaged/refurb bike: destination REFURBISH | HARVEST | SCRAP", roles: [ShopCoordinator], code: 200, input: [destination, "refurb_lead_volunteer_id?"], output: DonatedBike, side_effects: ["REFURBISH sets refurb_lead_volunteer_id", "HARVEST from IN_REFURBISHMENT clears refurb lead, keeps consumed parts", "increments DonatedBike.version by 1"] }
  - { method: POST, path: "/bikes/{id}/submit-safety", description: "Refurb complete: IN_REFURBISHMENT -> SAFETY_REVIEW", roles: [Volunteer], code: 200, input: [], output: DonatedBike, side_effects: ["increments DonatedBike.version by 1"] }
  - { method: POST, path: "/bikes/{id}/safety-inspections", description: "Record inspection; PASS -> READY_FOR_DISPOSITION, FAIL -> IN_REFURBISHMENT (rework_count += 1). Inspector = caller volunteer id.", roles: [Volunteer], code: 201, input: [result, checklist, "note?"], output: SafetyInspection, side_effects: ["bike transition per result", "bike.latest_inspection_result updated", "inspector.inspections_conducted += 1", "increments DonatedBike.version by 1"] }
  - { method: GET, path: "/safety-inspections/{id}", description: "Fetch inspection", roles: [ShopCoordinator, ProgramDirector, Volunteer], code: 200, input: [], output: SafetyInspection, side_effects: [] }
  - { method: GET, path: "/safety-inspections", description: "List/filter inspections", roles: [ShopCoordinator, ProgramDirector, Volunteer], code: 200, input: ["bike_id?", "inspector_volunteer_id?", "result?", "limit?", "offset?"], output: "SafetyInspection[]", side_effects: [] }
