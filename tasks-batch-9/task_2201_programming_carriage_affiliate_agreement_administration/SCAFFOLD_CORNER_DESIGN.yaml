            - call: "POST /carriage/audit-engagements/${eng_id}/lifecycle"
              payload:
                action: "ISSUE_FINDINGS"
              as: AuditManager
              as_user_id: "u-audit-1"
            - call: "GET /carriage/distributors/${dc_id}"
              as: RevenueAccountant
