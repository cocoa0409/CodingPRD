            - "Household.${hh_id}.extension_months_used == 0 after the first trigger call"
            - "the second trigger call returns HTTP 422 with data.error_id == ERR_EXTENSION_LIMIT_EXCEEDED"
            - "TimeLimitExtension.${ext_second_id}.status == REQUESTED"
            - "TimeLimitExtension.${ext_second_id}.months_granted == 0"

      - name: overpayment_covering_a_month_that_was_never_issued_is_refused
