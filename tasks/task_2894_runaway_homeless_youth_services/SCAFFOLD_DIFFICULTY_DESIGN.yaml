      - name: reunification_approval_waives_notification_then_schedules_discharge
        grounds:
          - state_machines.ReunificationCase.HOME_ASSESSMENT_to_APPROVED
          - state_machines.Youth
          - state_machines.Admission
          - state_machines.GuardianNotification
          - entities.ReunificationCase.fields.aftercare_plan_due_at
          - entities.GuardianNotification.fields.waiver_reason
          - validations[priority=24]
        distinguishing_aspect: |
          Depth-4 chain fired by a different transition on a different entity - the reunification
          APPROVE decision, not a discharge - and it cascades ACROSS aggregate roots rather than down
          a parent-child tree: (1) the case becomes APPROVED and stamps aftercare_plan_due_at =
          decision instant + 72h, which (2) moves Youth.status to REUNIFIED_PENDING, which (3) is
          what pushes the youth's ACTIVE admission to DISCHARGE_SCHEDULED while deliberately keeping
          the bed counted, which (4) auto-resolves the still-ATTEMPTED GuardianNotification as WAIVED
          with waiver_reason COURT_ORDER and thereby drops the youth's risk_posture from RESTRICTED
          to OPEN. Hop 3 is the hop that is easy to get wrong: occupied_beds must NOT decrement.
        test_recipe:
          setup:
            - "one EMERGENCY_SHELTER program with licensed_bed_capacity 2, band 12..17, so a single occupant leaves posture OPEN at 5000 bp utilization"
            - "youth Lena Ortiz (dob 2010-03-15, age 16) with a CLEARED SafetyScreening and an ACTIVE Admission admitted at 2026-08-01T00:00:00Z, planned_discharge_at 2026-08-15T00:00:00Z, admitted by cm-1"
            - "that admission's GuardianNotification has had one PHONE attempt, so it sits in ATTEMPTED with attempt_count 1 and validations priority 23 is satisfied while the obligation is still formally open"
            - "one ReunificationCase opened by rs-1, with one MediationSession scheduled 2026-08-03T14:00:00Z..15:00:00Z whose outcome AGREEMENT is recorded by rs-2 at the logical clock 2026-08-03T15:00:00Z, followed by a SAFE home assessment"
            - "the decision is issued by rs-1, who is not the session's recorded_by_user_id, so validations priority 24 passes"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Lakeview Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { reun_program_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Lena", legal_last_name: "Ortiz", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { lena_id: $.data.id }
            - call: "POST /ryhs/youths/${lena_id}/safety-screenings"
              payload: { indicator_codes: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { lena_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${lena_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${lena_id}", program_id: "${reun_program_id}", planned_discharge_at: "2026-08-15T00:00:00Z" }
