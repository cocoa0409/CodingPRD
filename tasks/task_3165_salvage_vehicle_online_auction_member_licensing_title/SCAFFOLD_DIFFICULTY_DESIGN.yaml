# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3165_salvage_vehicle_online_auction_member_licensing_title
#
# Depth probe. Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and is
# transcribed verbatim into tests. All payloads replay against empty-DB plus
# the declared logical-clock default 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: storage_fee_winner_window_vs_seller_window
        grounds:
          - calculations.storage_fee
          - calculations.seller_settlement
          - entities.GatePass.fields.storage_fee_cents
          - entities.Settlement.fields.storage_recovery_cents
        distinguishing_aspect: |
          Same Yard.daily_storage_rate_cents (1000), but the SELLER window
          [received_at 2026-09-01, sale day 2026-09-10] minus SELLER_FREE_STORAGE_DAYS 7
          yields 2 chargeable days (2000 cents on the Settlement), while the
          WINNER window [sale day 2026-09-10, check-in 2026-09-13] minus
          yard free_storage_days 1 yields 2 chargeable days on the GatePass
          from a different window anchor and different free allowance —
          same rate, two windows, two free-period constants, two fields.
        test_recipe:
          setup:
            - "Yard CA: daily_storage_rate_cents 1000, free_storage_days 1."
            - "Seller (STANDARD) assigns VIN 1HGCM82633A004352 lot STANDARD, reserve 0, sale_type PURE to the yard on 2026-09-01."
            - "Title received 2026-09-01; condition + 5 images; mark-ready (received_at 2026-09-01)."
            - "Auction scheduled_start 2026-09-05; item listed; clock to 2026-09-10; start; open-lot."
            - "Buyer (BASIC, US) live bid 1000000."
          setup_api_calls:
            - call: "POST /salvage-auction/yards"
              payload: { name: "CA Yard", state_code: "CA", daily_storage_rate_cents: 1000, free_storage_days: 1 }
              as: PlatformAdmin
              captures: { yard_id: $.data.id }
            - call: "POST /salvage-auction/sellers"
              payload: { name: "Insurer A", seller_type: "INSURER", fee_schedule: "STANDARD" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /salvage-auction/members"
              payload: { email: "b1@x.com", full_name: "Buyer One", home_state: "CA", tier: "BASIC" }
              as: PlatformAdmin
              captures: { member_id: $.data.id }
            - call: "POST /salvage-auction/vehicles"
              payload: { seller_id: "${seller_id}", yard_id: "${yard_id}", vin: "1HGCM82633A004352", year: 2019, make: "Honda", model: "Accord", lot_type: "STANDARD", reserve_price_cents: 0, sale_type: "PURE", odometer_reading: 50000, damage_codes: ["FRONT"] }
              as: SellerAgent
              as_user_id: "${seller_id}"
              captures: { vehicle_id: $.data.id, vehicle_v: $.data.version }
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/title"
              payload: { title_type: "SALVAGE" }
              as: TitleClerk
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/condition"
              payload: { primary_damage: "FRONT", run_and_drive_status: "RUN_AND_DRIVE" }
              as: YardOperator
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/images"
              payload: { image_url: "https://img/1" }
              as: YardOperator
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/images"
              payload: { image_url: "https://img/2" }
              as: YardOperator
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/images"
              payload: { image_url: "https://img/3" }
              as: YardOperator
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/images"
              payload: { image_url: "https://img/4" }
              as: YardOperator
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/images"
              payload: { image_url: "https://img/5" }
              as: YardOperator
            - call: "GET /salvage-auction/vehicles/${vehicle_id}"
              payload: {}
              as: YardOperator
              captures: { vehicle_v2: $.data.version }
            - call: "POST /salvage-auction/vehicles/${vehicle_id}/mark-ready"
              payload: { expected_vehicle_version: "${vehicle_v2}" }
              as: YardOperator
            - call: "POST /salvage-auction/auctions"
              payload: { name: "A1", scheduled_start: "2026-09-05T00:00:00Z" }
              as: Auctioneer
              captures: { auction_id: $.data.id }
            - call: "POST /salvage-auction/auctions/${auction_id}/items"
              payload: { vehicle_id: "${vehicle_id}" }
              as: Auctioneer
              captures: { item_id: $.data.id }
            - call: "POST /salvage-auction/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /salvage-auction/auctions/${auction_id}/start"
              payload: {}
              as: Auctioneer
            - call: "POST /salvage-auction/auctions/${auction_id}/items/${item_id}/open-lot"
              payload: {}
              as: Auctioneer
            - call: "POST /salvage-auction/bids"
              payload: { auction_item_id: "${item_id}", amount_cents: 1000000 }
              as: Buyer
              as_user_id: "${member_id}"
          trigger:
            - call: "POST /salvage-auction/auctions/${auction_id}/items/${item_id}/close-lot"
              payload: {}
              as: Auctioneer
              captures: { sale_id: $.data.id }
            - call: "POST /salvage-auction/sales/${sale_id}/payments"
              payload: { amount_cents: 1120000 }
              as: Buyer
              as_user_id: "${member_id}"
            - call: "POST /salvage-auction/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-13T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /salvage-auction/sales/${sale_id}/gate-passes"
              payload: { slot_start: "2026-09-13T14:00:00Z", slot_end: "2026-09-13T18:00:00Z" }
              as: Buyer
              as_user_id: "${member_id}"
              captures: { gate_pass_id: $.data.id }
            - call: "POST /salvage-auction/gate-passes/${gate_pass_id}/check-in"
              payload: {}
              as: YardOperator
          assert:
            - "Settlement for Sale.${sale_id} has storage_recovery_cents == 2000 (seller window 9 days - 7 free = 2 days x 1000)"
            - "Settlement for Sale.${sale_id} has seller_fee_cents == 105000 and title_late_penalty_cents == 0 and net_proceeds_cents == 893000"
            - "GatePass.${gate_pass_id}.storage_fee_cents == 2000 (winner window 3 days - 1 free = 2 days x 1000)"
            - "Sale.${sale_id}.buyer_fee_cents == 120000 (12% of 1000000, tier 1 only)"

      - name: seller_settlement_standard_vs_volume_fee_schedule
