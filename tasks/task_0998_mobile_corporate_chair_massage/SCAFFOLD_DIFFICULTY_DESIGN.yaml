            - "WellnessProgram.${p1_id}.next_occurrence_date == null"
            - "WellnessProgram.${p2_id}.status == PAUSED"
            - "WellnessProgram.${p2_id}.next_occurrence_date == null"

  # ==================================================================
  # Rule 5: priority_pair_validation_conflict — different error-category pairs
  # ==================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: invalid_state_vs_stale_version_on_confirm
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_STALE_BOOKING_VERSION]
        distinguishing_aspect: |
          Pair = (state, state/OCC-version). A Booking that is already
          CONFIRMED (so the SCHEDULING->CONFIRMED transition precondition
          fails) AND whose expected_booking_version is stale must surface
          ERR_INVALID_STATE (priority 4) before ERR_STALE_BOOKING_VERSION
          (priority 5). Distinct pair from license-vs-double-booked.
        test_recipe:
          setup:
            - "Region R0, ACME, T1 licensed"
            - "Booking B driven all the way to CONFIRMED (B.version = 4 at that point)"
            - "Client holds stale expected_booking_version = 2"
          setup_api_calls:
            - { call: "POST /chair-massage/regions", payload: { code: "R0", name: "R0", base_mileage_rate_cents: 120, travel_included_miles: 20, setup_buffer_minutes: 30, teardown_buffer_minutes: 30 }, as: PlatformAdmin, captures: { region_id: "$.data.id" } }
            - { call: "POST /chair-massage/corporate-accounts", payload: { company_name: "ACME", billing_email: "a@x", region_id: "${region_id}", credit_limit_cents: 100000000 }, as: PlatformAdmin, captures: { acct_id: "$.data.id" } }
            - { call: "POST /chair-massage/therapists", payload: { full_name: "T", email: "t@x", home_region_id: "${region_id}", per_hour_rate_cents: 6000, max_minutes_per_day: 480 }, as: PlatformAdmin, captures: { t1_id: "$.data.id" } }
            - { call: "POST /chair-massage/therapist-licenses", payload: { therapist_id: "${t1_id}", region_id: "${region_id}", license_number: "L1", issued_on: "2025-01-01", expires_on: "2027-12-31" }, as: PlatformAdmin }
            - { call: "POST /chair-massage/bookings", payload: { corporate_account_id: "${acct_id}", region_id: "${region_id}", site_address: "1 Main", event_date: "2026-06-10", window_start_minutes: 600, window_duration_minutes: 60, chair_count: 1, slot_minutes: 15, per_minute_rate_cents: 200 }, as: Organizer, as_user_id: "${acct_id}", captures: { bk_id: "$.data.id", bk_v0: "$.data.version" } }
            - { call: "POST /chair-massage/bookings/${bk_id}/open-scheduling", payload: {}, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "GET /chair-massage/bookings/${bk_id}/chair-slots", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { cs0: "$.data[0].id" } }
            - { call: "POST /chair-massage/chair-slots/${cs0}/assign", payload: { therapist_id: "${t1_id}" }, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "GET /chair-massage/bookings/${bk_id}", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { bk_v_pre: "$.data.version" } }
            - { call: "POST /chair-massage/bookings/${bk_id}/confirm", payload: { expected_booking_version: "${bk_v_pre}" }, as: Organizer, as_user_id: "${acct_id}" }
          trigger:
            - call: "POST /chair-massage/bookings/${bk_id}/confirm"
              payload: { expected_booking_version: "${bk_v0}" }
              as: Organizer
              as_user_id: "${acct_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE (state priority 4 beats OCC priority 5)"
            - "HTTP status == 409"
            - "Booking.${bk_id}.status unchanged (CONFIRMED)"

      - name: license_invalid_vs_double_booked_on_assign
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_LICENSE_INVALID]
          - errors[ERR_THERAPIST_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Pair = (business_safety, business_temporal). Candidate therapist
          has NO valid license in the booking region AND would double-book
          against an existing ChairSlot. Priority 7 (license) must surface
          before priority 8 (double-booking). Distinct pair from
          state-vs-OCC.
        test_recipe:
          setup:
            - "Region R0 (setup=30, teardown=30)"
            - "Therapist T1 ACTIVE with NO license in R0"
            - "Therapist T2 ACTIVE with valid license in R0"
            - "Booking B1 EVENT on 2026-06-10 window 600..720 in SCHEDULING; chair csA assigned to T2"
            - "Booking B2 EVENT on 2026-06-10 window 700..820 in SCHEDULING (overlaps B1 when 30-min buffers included); chair csB UNASSIGNED"
          setup_api_calls:
            - { call: "POST /chair-massage/regions", payload: { code: "R0", name: "R0", base_mileage_rate_cents: 120, travel_included_miles: 20, setup_buffer_minutes: 30, teardown_buffer_minutes: 30 }, as: PlatformAdmin, captures: { region_id: "$.data.id" } }
            - { call: "POST /chair-massage/corporate-accounts", payload: { company_name: "ACME", billing_email: "a@x", region_id: "${region_id}", credit_limit_cents: 100000000 }, as: PlatformAdmin, captures: { acct_id: "$.data.id" } }
            - { call: "POST /chair-massage/therapists", payload: { full_name: "T1", email: "t1@x", home_region_id: "${region_id}", per_hour_rate_cents: 6000, max_minutes_per_day: 2000 }, as: PlatformAdmin, captures: { t1_id: "$.data.id" } }
            - { call: "POST /chair-massage/therapists", payload: { full_name: "T2", email: "t2@x", home_region_id: "${region_id}", per_hour_rate_cents: 6000, max_minutes_per_day: 2000 }, as: PlatformAdmin, captures: { t2_id: "$.data.id" } }
            - { call: "POST /chair-massage/therapist-licenses", payload: { therapist_id: "${t2_id}", region_id: "${region_id}", license_number: "L2", issued_on: "2025-01-01", expires_on: "2027-12-31" }, as: PlatformAdmin }
            - { call: "POST /chair-massage/bookings", payload: { corporate_account_id: "${acct_id}", region_id: "${region_id}", site_address: "B1", event_date: "2026-06-10", window_start_minutes: 600, window_duration_minutes: 120, chair_count: 1, slot_minutes: 15, per_minute_rate_cents: 200 }, as: Organizer, as_user_id: "${acct_id}", captures: { bk1_id: "$.data.id" } }
            - { call: "POST /chair-massage/bookings/${bk1_id}/open-scheduling", payload: {}, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "GET /chair-massage/bookings/${bk1_id}/chair-slots", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { cs_a: "$.data[0].id" } }
            - { call: "POST /chair-massage/chair-slots/${cs_a}/assign", payload: { therapist_id: "${t2_id}" }, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "POST /chair-massage/bookings", payload: { corporate_account_id: "${acct_id}", region_id: "${region_id}", site_address: "B2", event_date: "2026-06-10", window_start_minutes: 700, window_duration_minutes: 120, chair_count: 1, slot_minutes: 15, per_minute_rate_cents: 200 }, as: Organizer, as_user_id: "${acct_id}", captures: { bk2_id: "$.data.id" } }
            - { call: "POST /chair-massage/bookings/${bk2_id}/open-scheduling", payload: {}, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "GET /chair-massage/bookings/${bk2_id}/chair-slots", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { cs_b: "$.data[0].id" } }
          trigger:
            - call: "POST /chair-massage/chair-slots/${cs_b}/assign"
              payload: { therapist_id: "${t1_id}" }
              as: Organizer
              as_user_id: "${acct_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_LICENSE_INVALID (priority 7 business_safety beats priority 8 business_temporal)"
            - "HTTP status == 422"
            - "ChairSlot.${cs_b}.status unchanged (UNASSIGNED)"

  # ==================================================================
  # Rule 6: boundary_precision_check — different metrics / endpoints
  # ==================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: cancellation_fee_threshold_24h_inclusive
        grounds:
          - calculations.cancellation_fee
          - endpoints."POST /chair-massage/bookings/{id}/cancel"
        distinguishing_aspect: |
          Metric = hours-until-event (H). At exactly H = 24 the fee must be
          floor(B * 0.25) — the boundary is `H < 24` for the 50% tier, so
          H == 24 falls through to the 25% tier. Endpoint = cancel. Distinct
          metric and endpoint from the signup-sheet boundary.
        test_recipe:
          setup:
            - "Region R0; ACME; Therapist T1 licensed"
            - "Booking EVENT 2026-06-10 window_start=600 (10:00), window_duration=120, chair_count=1, slot_minutes=15, per_minute_rate_cents=200"
            - "8 claims -> booked_chair_minutes = 120 -> B = 24000"
            - "Booking CONFIRMED"
            - "Logical clock = 2026-06-09T10:00:00Z — exactly 24h before event start"
          setup_api_calls:
            - { call: "POST /chair-massage/regions", payload: { code: "R0", name: "R0", base_mileage_rate_cents: 120, travel_included_miles: 20, setup_buffer_minutes: 30, teardown_buffer_minutes: 30 }, as: PlatformAdmin, captures: { region_id: "$.data.id" } }
            - { call: "POST /chair-massage/corporate-accounts", payload: { company_name: "ACME", billing_email: "a@x", region_id: "${region_id}", credit_limit_cents: 100000000 }, as: PlatformAdmin, captures: { acct_id: "$.data.id" } }
