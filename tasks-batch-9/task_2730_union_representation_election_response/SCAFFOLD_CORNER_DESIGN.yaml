          The only PATCH in the API must round-trip through all four verbs and re-run both derived layers on
          the child AND the parent: filling in the two missing statutory fields moves
          missing_field_count 2 -> 0 and lifts VoterList.complete_entry_count 2 -> 3, while a later PATCH of
          on_leave_type to PERMANENT_LAYOFF flips eligibility_status to INELIGIBLE and drops
          eligible_voter_count 3 -> 2 without touching completeness at all.
