# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2129_short_sale_negotiation
#
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7. Deleting this file leaves
# the scaffold's declared behaviour identical; it only makes coverage harder to
# audit. 21 instances across the nine §0.5 rules.
#
# Fixture actors (X-User-ID values used throughout):
#   Negotiator        neg-001
#   ListingAgent      la-200
#   ServicerAnalyst   sa-100 (orders valuations, issues letters)
#                     sa-101 (adjudicates disputes, decides extensions)
#   JuniorLienHolder  jlh-700
#   MiUnderwriter     miu-800
#   PlatformAdmin     adm-900
#   BpoVendor         the BpoVendor row's own id
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: net_sheet_preliminary_vs_final_diverge_on_same_offer
        grounds:
          - calculations.net_proceeds_to_first_lien
          - entities.NetSheet.fields.net_proceeds_cents
          - entities.NetSheet.fields.commission_pct_applied
          - entities.NetSheet.fields.mi_contribution_credit_cents
          - entities.JuniorLien.fields.demand_cents
          - entities.JuniorLien.fields.approved_contribution_cents
          - entities.MiClaim.fields.required_contribution_cents
        distinguishing_aspect: |
          This dual-variant pair lives in the transaction-accounting domain
          (NetSheet over an Offer): from byte-identical Offer, JuniorLien and
          MiClaim rows the PRELIMINARY algorithm yields net_proceeds_cents
          20950039 and the FINAL algorithm yields 22122539, a divergence of
          exactly 1172500 cents driven by the commission clamp, the junior-lien
          inclusion set, and the MI credit.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-24T00:00:00Z."
            - "One GSE ShortSaleCase with unpaid_principal_balance_cents 26800000."
            - "Its HardshipPackage is ACCEPTED with all four required documents VERIFIED."
            - "One ACTIVE Listing on the case with commission_pct 0.06, listed_at 2026-08-05T00:00:00Z."
            - "One JuniorLien at position 2, balance 3500000, demand_cents 900000, status APPROVED with approved_contribution_cents 600000."
            - "One MiClaim APPROVED with required_contribution_cents 750000 and contribution_form CASH."
            - "One Offer at offer_price_cents 24500041, status SUBMITTED. No NetSheet exists yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-900"
            - call: "POST /short-sale/cases"
              payload: { property_address: "118 Larkspur Ln, Reno NV", investor_type: "GSE", unpaid_principal_balance_cents: 26800000, servicer_name: "Cascade Servicing" }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { case_id: $.data.id }
            - call: "POST /short-sale/cases/${case_id}/hardship-packages"
              payload: { hardship_reason: "JOB_LOSS", monthly_income_cents: 380000, monthly_expenses_cents: 512000, liquid_assets_cents: 640000 }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { pkg_id: $.data.id }
            - call: "POST /short-sale/hardship-packages/${pkg_id}/documents"
              payload: { doc_type: "HARDSHIP_LETTER", issued_on: "2026-07-20T00:00:00Z", reference_label: "HL-1" }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { doc_hl: $.data.id }
            - call: "POST /short-sale/hardship-packages/${pkg_id}/documents"
              payload: { doc_type: "FINANCIAL_WORKSHEET", issued_on: "2026-07-20T00:00:00Z", reference_label: "FW-1" }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { doc_fw: $.data.id }
            - call: "POST /short-sale/hardship-packages/${pkg_id}/documents"
              payload: { doc_type: "BANK_STATEMENT", issued_on: "2026-07-20T00:00:00Z", reference_label: "BS-1" }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { doc_bs: $.data.id }
            - call: "POST /short-sale/hardship-packages/${pkg_id}/documents"
              payload: { doc_type: "AUTHORIZATION_FORM", issued_on: "2026-07-20T00:00:00Z", reference_label: "AF-1" }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { doc_af: $.data.id }
            - call: "POST /short-sale/documents/${doc_hl}/review"
              payload: { outcome: "VERIFY" }
              as: ServicerAnalyst
              as_user_id: "sa-100"
            - call: "POST /short-sale/documents/${doc_fw}/review"
              payload: { outcome: "VERIFY" }
              as: ServicerAnalyst
              as_user_id: "sa-100"
            - call: "POST /short-sale/documents/${doc_bs}/review"
              payload: { outcome: "VERIFY" }
              as: ServicerAnalyst
              as_user_id: "sa-100"
            - call: "POST /short-sale/documents/${doc_af}/review"
              payload: { outcome: "VERIFY" }
              as: ServicerAnalyst
              as_user_id: "sa-100"
            - call: "POST /short-sale/hardship-packages/${pkg_id}/submit"
              payload: {}
              as: Negotiator
              as_user_id: "neg-001"
            - call: "POST /short-sale/hardship-packages/${pkg_id}/decision"
              payload: { outcome: "ACCEPT" }
              as: ServicerAnalyst
              as_user_id: "sa-100"
            - call: "POST /short-sale/cases/${case_id}/listings"
              payload: { list_price_cents: 25900000, commission_pct: 0.06, listed_at: "2026-08-05T00:00:00Z" }
              as: ListingAgent
              as_user_id: "la-200"
              captures: { listing_id: $.data.id }
            - call: "POST /short-sale/cases/${case_id}/junior-liens"
              payload: { lien_position: 2, holder_name: "Truckee Credit Union", holder_user_id: "jlh-700", balance_cents: 3500000 }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { lien_id: $.data.id }
            - call: "POST /short-sale/junior-liens/${lien_id}/demand"
              payload: { demand_cents: 900000 }
              as: Negotiator
              as_user_id: "neg-001"
            - call: "POST /short-sale/junior-liens/${lien_id}/response"
              payload: { outcome: "APPROVE", contribution_cents: 600000 }
              as: JuniorLienHolder
              as_user_id: "jlh-700"
            - call: "POST /short-sale/cases/${case_id}/mi-claims"
              payload: { mi_provider: "Summit MI", coverage_pct: 0.25, claim_reference: "MI-4471" }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { mi_id: $.data.id }
            - call: "POST /short-sale/mi-claims/${mi_id}/decision"
              payload: { outcome: "APPROVE", required_contribution_cents: 750000, contribution_form: "CASH" }
              as: MiUnderwriter
              as_user_id: "miu-800"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-24T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-900"
            - call: "POST /short-sale/cases/${case_id}/offers"
              payload: { buyer_name: "R. Alvarez", buyer_financing: "CASH", offer_price_cents: 24500041, earnest_money_cents: 500000, requested_closing_days: 45 }
              as: ListingAgent
              as_user_id: "la-200"
              captures: { offer_id: $.data.id }
            - call: "POST /short-sale/offers/${offer_id}/submit"
              payload: {}
              as: Negotiator
              as_user_id: "neg-001"
          trigger:
            - call: "GET /short-sale/offers/${offer_id}"
              payload: {}
              as: Negotiator
              as_user_id: "neg-001"
              captures: { offer_v1: $.data.version }
            - call: "POST /short-sale/offers/${offer_id}/net-sheets"
              payload: { variant: "PRELIMINARY", title_escrow_cents: 187500, property_tax_arrears_cents: 412300, hoa_arrears_cents: 96450, expected_offer_version: "${offer_v1}" }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { ns_prelim_id: $.data.id, prelim_net: $.data.net_proceeds_cents }
            - call: "GET /short-sale/offers/${offer_id}"
              payload: {}
              as: Negotiator
              as_user_id: "neg-001"
              captures: { offer_v2: $.data.version }
            - call: "POST /short-sale/offers/${offer_id}/net-sheets"
              payload: { variant: "FINAL", title_escrow_cents: 187500, property_tax_arrears_cents: 412300, hoa_arrears_cents: 96450, expected_offer_version: "${offer_v2}" }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { ns_final_id: $.data.id, final_net: $.data.net_proceeds_cents }
          assert:
            - "NetSheet.${ns_prelim_id}.commission_pct_applied == 0.06"
            - "NetSheet.${ns_prelim_id}.gross_deductions_cents == 3250002"
            - "NetSheet.${ns_prelim_id}.mi_contribution_credit_cents == 0"
            - "NetSheet.${ns_prelim_id}.base_net_cents == 21250039"
            - "NetSheet.${ns_prelim_id}.relocation_incentive_cents == 300000"
            - "NetSheet.${ns_prelim_id}.net_proceeds_cents == 20950039"
            - "NetSheet.${ns_final_id}.commission_pct_applied == 0.055"
            - "NetSheet.${ns_final_id}.gross_deductions_cents == 2827502"
            - "NetSheet.${ns_final_id}.mi_contribution_credit_cents == 750000"
            - "NetSheet.${ns_final_id}.base_net_cents == 22422539"
            - "NetSheet.${ns_final_id}.net_proceeds_cents == 22122539"
            - "NetSheet.${ns_final_id}.net_proceeds_cents - NetSheet.${ns_prelim_id}.net_proceeds_cents == 1172500"
            - "Offer.${offer_id}.offer_price_cents == 24500041 (unchanged by either sheet)"

      - name: hardship_score_intake_vs_audit_diverge_on_same_package
        grounds:
          - calculations.hardship_severity_score
          - entities.HardshipPackage.fields.hardship_score_intake
          - entities.HardshipPackage.fields.hardship_score_audit
          - entities.SellerDocument.fields.issued_on
          - state_machines.HardshipPackage.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          This dual-variant pair lives in a different entity domain from the net
          sheet - seller-risk scoring on a HardshipPackage, not transaction
          accounting on an Offer. From the same four SellerDocument rows the
          INTAKE variant scores 76.25 (all four doc_types qualify) while the
          SERVICER_AUDIT variant scores 73.75, because BANK_STATEMENT is
          91 days past its issued_on at decision time and drops out of
          doc_support.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T00:00:00Z at decision time, 2026-08-05T00:00:00Z at submission time."
            - "One GSE ShortSaleCase."
            - "One HardshipPackage with hardship_reason JOB_LOSS, monthly_income_cents 380000, monthly_expenses_cents 512000, liquid_assets_cents 640000."
            - "Four SellerDocuments, all VERIFIED: HARDSHIP_LETTER, FINANCIAL_WORKSHEET and AUTHORIZATION_FORM issued 2026-07-20, BANK_STATEMENT issued 2026-05-10 (87 days old when verified, 92 days old when audited)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-900"
            - call: "POST /short-sale/cases"
              payload: { property_address: "44 Kestrel Ct, Sparks NV", investor_type: "GSE", unpaid_principal_balance_cents: 26800000, servicer_name: "Cascade Servicing" }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { case_id: $.data.id }
            - call: "POST /short-sale/cases/${case_id}/hardship-packages"
              payload: { hardship_reason: "JOB_LOSS", monthly_income_cents: 380000, monthly_expenses_cents: 512000, liquid_assets_cents: 640000 }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { pkg_id: $.data.id }
            - call: "POST /short-sale/hardship-packages/${pkg_id}/documents"
              payload: { doc_type: "HARDSHIP_LETTER", issued_on: "2026-07-20T00:00:00Z", reference_label: "HL-1" }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { doc_hl: $.data.id }
            - call: "POST /short-sale/hardship-packages/${pkg_id}/documents"
              payload: { doc_type: "FINANCIAL_WORKSHEET", issued_on: "2026-07-20T00:00:00Z", reference_label: "FW-1" }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { doc_fw: $.data.id }
            - call: "POST /short-sale/hardship-packages/${pkg_id}/documents"
              payload: { doc_type: "AUTHORIZATION_FORM", issued_on: "2026-07-20T00:00:00Z", reference_label: "AF-1" }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { doc_af: $.data.id }
            - call: "POST /short-sale/hardship-packages/${pkg_id}/documents"
              payload: { doc_type: "BANK_STATEMENT", issued_on: "2026-05-10T00:00:00Z", reference_label: "BS-1" }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { doc_bs: $.data.id }
            - call: "POST /short-sale/documents/${doc_hl}/review"
              payload: { outcome: "VERIFY" }
              as: ServicerAnalyst
              as_user_id: "sa-100"
            - call: "POST /short-sale/documents/${doc_fw}/review"
              payload: { outcome: "VERIFY" }
              as: ServicerAnalyst
              as_user_id: "sa-100"
            - call: "POST /short-sale/documents/${doc_af}/review"
              payload: { outcome: "VERIFY" }
              as: ServicerAnalyst
              as_user_id: "sa-100"
            - call: "POST /short-sale/documents/${doc_bs}/review"
              payload: { outcome: "VERIFY" }
              as: ServicerAnalyst
              as_user_id: "sa-100"
          trigger:
            - call: "POST /short-sale/hardship-packages/${pkg_id}/submit"
              payload: {}
              as: Negotiator
              as_user_id: "neg-001"
              captures: { intake_score: $.data.hardship_score_intake }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-900"
            - call: "POST /short-sale/hardship-packages/${pkg_id}/decision"
              payload: { outcome: "ACCEPT" }
              as: ServicerAnalyst
              as_user_id: "sa-100"
              captures: { audit_score: $.data.hardship_score_audit }
          assert:
            - "HardshipPackage.${pkg_id}.hardship_score_intake == 76.25"
            - "HardshipPackage.${pkg_id}.hardship_score_audit == 73.75"
            - "HardshipPackage.${pkg_id}.status == ACCEPTED"
            - "HardshipPackage.${pkg_id}.verified_document_count == 4"
            - "SellerDocument.${doc_bs}.status == VERIFIED (the audit excludes it on age, not on status)"
            - "ShortSaleCase.${case_id}.negotiation_status == MARKETED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: net_sheet_per_line_rounding_order_pinned
        grounds:
          - calculations.net_proceeds_to_first_lien
          - entities.NetSheet.fields.line_items
          - entities.NetSheet.fields.gross_deductions_cents
        distinguishing_aspect: |
          Mode (b) - nested rounding where the order changes the cents. At
          offer_price_cents 24500041 the commission line rounds 1470002.46 down
          to 1470002 and the transfer-tax line rounds 183750.3075 down to
          183750, so the pinned per-line order gives gross_deductions_cents
          2350002 while the forbidden sum-then-round order gives 2350003.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "One GSE ShortSaleCase with no JuniorLien and no MiClaim."
            - "One ACTIVE Listing with commission_pct 0.06."
            - "One DRAFT Offer at offer_price_cents 24500041."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-900"
            - call: "POST /short-sale/cases"
              payload: { property_address: "7 Vireo Way, Reno NV", investor_type: "GSE", unpaid_principal_balance_cents: 26800000, servicer_name: "Cascade Servicing" }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { case_id: $.data.id }
            - call: "POST /short-sale/cases/${case_id}/listings"
              payload: { list_price_cents: 25900000, commission_pct: 0.06, listed_at: "2026-08-05T00:00:00Z" }
              as: ListingAgent
              as_user_id: "la-200"
              captures: { listing_id: $.data.id }
            - call: "POST /short-sale/cases/${case_id}/offers"
              payload: { buyer_name: "P. Nakamura", buyer_financing: "CASH", offer_price_cents: 24500041, earnest_money_cents: 500000, requested_closing_days: 45 }
              as: ListingAgent
              as_user_id: "la-200"
              captures: { offer_id: $.data.id }
            - call: "GET /short-sale/offers/${offer_id}"
              payload: {}
              as: Negotiator
              as_user_id: "neg-001"
              captures: { offer_v: $.data.version }
          trigger:
            - call: "POST /short-sale/offers/${offer_id}/net-sheets"
              payload: { variant: "PRELIMINARY", title_escrow_cents: 187500, property_tax_arrears_cents: 412300, hoa_arrears_cents: 96450, expected_offer_version: "${offer_v}" }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { ns_id: $.data.id }
          assert:
            - "NetSheet.${ns_id}.line_items[0].line_type == COMMISSION and line_items[0].amount_cents == 1470002"
            - "NetSheet.${ns_id}.line_items[2].line_type == TRANSFER_TAX and line_items[2].amount_cents == 183750"
            - "NetSheet.${ns_id}.line_items[5].line_type == JUNIOR_LIEN_PAYOFF and line_items[5].amount_cents == 0"
            - "NetSheet.${ns_id}.gross_deductions_cents == 2350002"
            - "NetSheet.${ns_id}.gross_deductions_cents != 2350003 (the sum-then-round order is rejected)"
            - "NetSheet.${ns_id}.base_net_cents == 22150039"
            - "NetSheet.${ns_id}.net_proceeds_cents == 21850039"

      - name: relocation_incentive_tier_keyed_on_pre_incentive_base_net
        grounds:
          - calculations.net_proceeds_to_first_lien
          - entities.NetSheet.fields.base_net_cents
          - entities.NetSheet.fields.relocation_incentive_cents
          - entities.NetSheet.fields.net_proceeds_cents
        distinguishing_aspect: |
          Mode (c) - a circular-looking dependency whose evaluation order the
          scaffold pins. base_net_cents lands on exactly 20100000, one tier step
          above RELOCATION_TIER_HIGH_MIN_CENTS, so the tier is
          RELOCATION_HIGH_CENTS 300000 and net_proceeds_cents is 19800000;
          keying the tier on the post-deduction figure instead would select
          RELOCATION_MID_CENTS 200000 and produce 19900000.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "One GSE ShortSaleCase with no JuniorLien and no MiClaim."
            - "One ACTIVE Listing with commission_pct 0.06."
            - "One DRAFT Offer at offer_price_cents 24500041."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-900"
            - call: "POST /short-sale/cases"
              payload: { property_address: "9 Ptarmigan Dr, Reno NV", investor_type: "GSE", unpaid_principal_balance_cents: 26800000, servicer_name: "Cascade Servicing" }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { case_id: $.data.id }
            - call: "POST /short-sale/cases/${case_id}/listings"
              payload: { list_price_cents: 25900000, commission_pct: 0.06, listed_at: "2026-08-05T00:00:00Z" }
              as: ListingAgent
              as_user_id: "la-200"
              captures: { listing_id: $.data.id }
            - call: "POST /short-sale/cases/${case_id}/offers"
              payload: { buyer_name: "D. Okoro", buyer_financing: "CASH", offer_price_cents: 24500041, earnest_money_cents: 500000, requested_closing_days: 45 }
              as: ListingAgent
              as_user_id: "la-200"
              captures: { offer_id: $.data.id }
            - call: "GET /short-sale/offers/${offer_id}"
              payload: {}
              as: Negotiator
              as_user_id: "neg-001"
              captures: { offer_v: $.data.version }
          trigger:
            - call: "POST /short-sale/offers/${offer_id}/net-sheets"
              payload: { variant: "PRELIMINARY", title_escrow_cents: 187500, property_tax_arrears_cents: 1558789, hoa_arrears_cents: 1000000, expected_offer_version: "${offer_v}" }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { ns_id: $.data.id }
          assert:
            - "NetSheet.${ns_id}.gross_deductions_cents == 4400041"
            - "NetSheet.${ns_id}.base_net_cents == 20100000"
            - "NetSheet.${ns_id}.relocation_incentive_cents == 300000"
            - "NetSheet.${ns_id}.net_proceeds_cents == 19800000"
            - "NetSheet.${ns_id}.net_proceeds_cents != 19900000 (post-deduction tier selection is rejected)"

      - name: minimum_acceptable_net_max_of_two_floors_with_investor_branch
        grounds:
          - calculations.minimum_acceptable_net
          - entities.ShortSaleCase.fields.minimum_acceptable_net_cents
          - entities.ShortSaleCase.fields.investor_type
          - state_machines.Valuation.ORDERED_to_RECEIVED
        distinguishing_aspect: |
          Mode (a) - a four-input non-linear formula: a conditional branch on
          investor_type selects the ratio, two independently rounded floors are
          combined with max(), and the MI credit is subtracted afterwards. On
          the GSE case the value floor wins (22176000); on the PORTFOLIO case
          the UPB floor wins (25200000) from the same 25200000 opinion of value.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "One BpoVendor with daily_inspection_capacity 2."
            - "Case A: investor_type GSE, unpaid_principal_balance_cents 26800000, no MiClaim."
            - "Case B: investor_type PORTFOLIO, unpaid_principal_balance_cents 42000000, no MiClaim."
            - "One ORDERED Valuation on each case, both from the same vendor on 2026-08-06 with non-conflicting slots 09:00-10:00 and 11:00-12:00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-900"
            - call: "POST /short-sale/bpo-vendors"
              payload: { vendor_name: "Sierra Valuation Partners", license_state: "NV", daily_inspection_capacity: 2 }
              as: PlatformAdmin
              as_user_id: "adm-900"
              captures: { vendor_id: $.data.id }
            - call: "POST /short-sale/cases"
              payload: { property_address: "118 Larkspur Ln, Reno NV", investor_type: "GSE", unpaid_principal_balance_cents: 26800000, servicer_name: "Cascade Servicing" }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { case_gse: $.data.id }
            - call: "POST /short-sale/cases"
              payload: { property_address: "300 Coyote Rdg, Reno NV", investor_type: "PORTFOLIO", unpaid_principal_balance_cents: 42000000, servicer_name: "Cascade Servicing" }
              as: Negotiator
