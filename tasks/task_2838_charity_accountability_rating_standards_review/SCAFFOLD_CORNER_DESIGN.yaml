      - name: filing_record_validate_twice_returns_filing_state_invalid
        claim_type: Idempotency
        grounds:
          - state_machines.FilingRecord.RECEIVED_to_VALIDATED
          - endpoints.POST_/filing-records/{filing_record_id}/validate
          - errors.ERR_FILING_STATE_INVALID
          - validations[priority=8]
        distinguishing_aspect: |
          A second ACCEPT on an already VALIDATED filing is not a harmless
          no-op: the accept path runs the supersede sweep over every VALIDATED
          filing sharing the (organization, fiscal_year, source_kind) triple, so
          replaying it against itself could send the row VALIDATED ->
          SUPERSEDED and leave the fiscal year with no winning filing at all.
          The transition must be refused outright.
