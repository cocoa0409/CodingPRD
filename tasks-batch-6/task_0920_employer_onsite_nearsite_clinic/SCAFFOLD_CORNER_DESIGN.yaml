# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_0920_employer_onsite_nearsite_clinic
# Breadth probe over §1.1-§1.7. Sections and claim_types come from
# references/claim-extraction-guide.md. Instances already covered in depth by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: employer_creation_returns_all_fields_with_zeroed_budget_counters
        claim_type: Creation
        grounds:
          - entities.Employer.fields.wellness_budget_committed_cents
          - entities.Employer.fields.wellness_budget_remaining_cents
          - entities.Employer.fields.program_cost_to_date_cents
          - endpoints[POST /employers]
        distinguishing_aspect: "A freshly created Employer returns 201 with wellness_budget_committed_cents 0, wellness_budget_remaining_cents equal to wellness_budget_cents, program_cost_to_date_cents 0, status ACTIVE and version 1."
        test_recipe:
          setup: ["Empty database with the clock left at its 2026-05-01T00:00:00Z default."]
          setup_api_calls: []
          trigger:
            - call: "POST /employers"
              payload: { legal_name: "Fresh Co", employer_code: "FRS", annual_total_cost_of_coverage_cents: 1200000, wellness_budget_cents: 250000 }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Employer.${emp_id}.status == ACTIVE"
            - "Employer.${emp_id}.tobacco_program_enabled == false because the field defaults to false when omitted"
            - "Employer.${emp_id}.wellness_budget_committed_cents == 0"
            - "Employer.${emp_id}.wellness_budget_remaining_cents == 250000"
            - "Employer.${emp_id}.program_cost_to_date_cents == 0"
            - "Employer.${emp_id}.version == 1"

      - name: site_defaults_closure_dates_to_empty_array_and_zeroes_slot_counters
        claim_type: Defaults
        grounds:
          - entities.Site.fields.closure_dates
          - entities.Site.fields.slots_requested_total
          - endpoints[POST /sites]
        distinguishing_aspect: "Omitting closure_dates yields an empty array rather than null, and all five slot counters start at 0."
        test_recipe:
          setup: ["One employer exists."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Default Co", employer_code: "DEF", annual_total_cost_of_coverage_cents: 1200000, wellness_budget_cents: 250000 }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /sites"
              payload: { site_name: "DEF Clinic", site_type: "NEAR_SITE", open_time_utc: "08:00", close_time_utc: "17:00", operating_weekdays: [1, 2, 3, 4, 5], daily_slot_capacity: 4 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
          assert:
            - "Site.${site_id}.closure_dates == []"
            - "Site.${site_id}.host_employer_id == null"
            - "Site.${site_id}.slots_held_count == 0 and slots_consumed_count == 0 and slots_no_show_count == 0 and slots_released_count == 0 and slots_requested_total == 0"

      - name: site_listing_paginates_and_filters_by_host_employer
        claim_type: Listing
        grounds:
          - endpoints[GET /sites]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /sites with limit 1 and offset 1 returns exactly one Site, total_count 3 and has_more false, and filtering by host_employer_id narrows the list to the two hosted sites."
        test_recipe:
          setup: ["One employer hosting two ON_SITE clinics plus one unhosted NEAR_SITE clinic."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "List Co", employer_code: "LST", annual_total_cost_of_coverage_cents: 1200000, wellness_budget_cents: 250000 }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /sites"
              payload: { site_name: "LST Site A", site_type: "ON_SITE", open_time_utc: "08:00", close_time_utc: "17:00", operating_weekdays: [1, 2, 3, 4, 5], daily_slot_capacity: 4, host_employer_id: "${emp_id}" }
              as: ProgramAdmin
            - call: "POST /sites"
              payload: { site_name: "LST Site B", site_type: "ON_SITE", open_time_utc: "08:00", close_time_utc: "17:00", operating_weekdays: [1, 2, 3, 4, 5], daily_slot_capacity: 4, host_employer_id: "${emp_id}" }
              as: ProgramAdmin
            - call: "POST /sites"
              payload: { site_name: "Shared Near-Site", site_type: "NEAR_SITE", open_time_utc: "08:00", close_time_utc: "17:00", operating_weekdays: [1, 2, 3, 4, 5], daily_slot_capacity: 4 }
              as: ProgramAdmin
          trigger:
            - call: "GET /sites"
              payload: { limit: 1, offset: 1 }
              as: ProgramAdmin
            - call: "GET /sites"
              payload: { host_employer_id: "${emp_id}" }
              as: ProgramAdmin
          assert:
            - "The paginated response has response_type array, data of length 1, total_count 3, has_more false"
            - "The filtered response has total_count 2 and every element has host_employer_id == ${emp_id}"
            - "Both responses carry meta.api_request_id and meta.api_request_timestamp"

      - name: participant_get_with_unknown_id_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_PARTICIPANT_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "A clinic-side role reading a participant id that does not exist gets 404 ERR_PARTICIPANT_NOT_FOUND, since the confidentiality wall does not cover the participant roster."
        test_recipe:
          setup: ["Empty database apart from the default clock."]
          setup_api_calls: []
          trigger:
            - call: "GET /participants/6b1d6f60-1a3e-4c6a-9b64-0f2ab5c7d901"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id ERR_PARTICIPANT_NOT_FOUND"

      - name: employer_site_and_provider_ids_not_found_sweep
        claim_type: Not Found
        grounds:
          - errors[ERR_EMPLOYER_NOT_FOUND]
          - errors[ERR_SITE_NOT_FOUND]
          - errors[ERR_PROVIDER_NOT_FOUND]
        distinguishing_aspect: "Each of the three top-level configuration entities raises its own dedicated 404 code rather than a shared generic one, resolved left to right from the path and then from the body."
        test_recipe:
          setup: ["Empty database apart from the default clock."]
          setup_api_calls: []
          trigger:
            - call: "POST /reporting-periods"
              payload: { employer_id: "11111111-1111-4111-8111-111111111111", period_start: "2026-06-01", period_end: "2026-06-30" }
              as: ProgramAdmin
              captures: { err_emp: $.data.error_id }
            - call: "POST /providers"
              payload: { site_id: "22222222-2222-4222-8222-222222222222", full_name: "Ghost", provider_function: "CLINICIAN", license_expiry_date: "2027-12-31" }
              as: ClinicManager
              captures: { err_site: $.data.error_id }
            - call: "GET /providers/33333333-3333-4333-8333-333333333333"
              payload: {}
              as: ClinicManager
              captures: { err_prov: $.data.error_id }
          assert:
            - "The reporting-period create returns HTTP 404 with error_id ERR_EMPLOYER_NOT_FOUND"
            - "The provider create returns HTTP 404 with error_id ERR_SITE_NOT_FOUND"
            - "The provider read returns HTTP 404 with error_id ERR_PROVIDER_NOT_FOUND"

      - name: appointment_award_and_period_ids_not_found_sweep
        claim_type: Not Found
        grounds:
          - errors[ERR_APPOINTMENT_NOT_FOUND]
          - errors[ERR_AWARD_NOT_FOUND]
          - errors[ERR_PERIOD_NOT_FOUND]
        distinguishing_aspect: "The three transactional entities each raise their own 404 code from a path id that resolves to nothing."
        test_recipe:
          setup: ["One employer exists so the acting EmployerBenefitsAdmin has a valid identity."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "NF Co", employer_code: "NFC", annual_total_cost_of_coverage_cents: 1200000, wellness_budget_cents: 250000 }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
          trigger:
            - call: "GET /appointments/44444444-4444-4444-8444-444444444444"
              payload: {}
              as: ProgramAdmin
              captures: { err_apt: $.data.error_id }
            - call: "GET /incentive-awards/55555555-5555-4555-8555-555555555555"
              payload: {}
              as: EmployerBenefitsAdmin
              as_user_id: "${emp_id}"
              captures: { err_award: $.data.error_id }
            - call: "GET /reporting-periods/66666666-6666-4666-8666-666666666666"
              payload: {}
              as: ProgramAdmin
              captures: { err_period: $.data.error_id }
          assert:
            - "HTTP 404 with error_id ERR_APPOINTMENT_NOT_FOUND for the appointment read"
            - "HTTP 404 with error_id ERR_AWARD_NOT_FOUND for the award read"
            - "HTTP 404 with error_id ERR_PERIOD_NOT_FOUND for the period read"

      - name: clinical_ids_not_found_for_clinic_side_roles
        claim_type: Not Found
        grounds:
          - errors[ERR_ASSESSMENT_NOT_FOUND]
          - errors[ERR_REFERRAL_NOT_FOUND]
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "Clinic-side roles pass the wall at rung 3 and therefore reach rung 4, so unknown assessment, referral and alternative-standard ids surface their real 404 codes - the mirror image of the employer-side wall behaviour."
        test_recipe:
          setup: ["One site with one clinician and one navigator so both clinic-side identities exist."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Clinic NF Co", employer_code: "CNF", annual_total_cost_of_coverage_cents: 1200000, wellness_budget_cents: 250000 }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /sites"
              payload: { site_name: "CNF Clinic", site_type: "ON_SITE", open_time_utc: "08:00", close_time_utc: "17:00", operating_weekdays: [1, 2, 3, 4, 5], daily_slot_capacity: 4, host_employer_id: "${emp_id}" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /providers"
              payload: { site_id: "${site_id}", full_name: "Dr Rivera", provider_function: "CLINICIAN", license_expiry_date: "2027-12-31" }
              as: ClinicManager
              captures: { clin_id: $.data.id }
            - call: "POST /providers"
              payload: { site_id: "${site_id}", full_name: "N Okafor", provider_function: "NAVIGATOR", license_expiry_date: "2027-12-31" }
              as: ClinicManager
              captures: { nav_id: $.data.id }
          trigger:
            - call: "GET /health-assessments/77777777-7777-4777-8777-777777777777"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { err_hra: $.data.error_id }
            - call: "GET /referrals/88888888-8888-4888-8888-888888888888"
              payload: {}
              as: CareNavigator
              as_user_id: "${nav_id}"
              captures: { err_ref: $.data.error_id }
            - call: "GET /alternative-standards/99999999-9999-4999-8999-999999999999"
              payload: {}
              as: CareNavigator
              as_user_id: "${nav_id}"
              captures: { err_ras: $.data.error_id }
          assert:
            - "HTTP 404 with error_id ERR_ASSESSMENT_NOT_FOUND"
            - "HTTP 404 with error_id ERR_REFERRAL_NOT_FOUND"
            - "HTTP 404 with error_id ERR_RESOURCE_NOT_FOUND for the alternative standard"

      - name: eligibility_record_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds:
          - errors[ERR_VALIDATION]
          - validations[priority=7]
          - endpoints[POST /eligibility-records]
        distinguishing_aspect: "Omitting the required effective_date on an eligibility row returns 400 ERR_VALIDATION and creates nothing."
        test_recipe:
          setup: ["One employer exists."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Required Co", employer_code: "REQ", annual_total_cost_of_coverage_cents: 1200000, wellness_budget_cents: 250000 }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /eligibility-records"
              payload: { employer_id: "${emp_id}", subscriber_external_id: "S-X", member_external_id: "M-X", tier: "EMPLOYEE" }
              as: EmployerBenefitsAdmin
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id ERR_VALIDATION"
            - "GET /eligibility-records?employer_id=${emp_id} returns total_count 0"

      - name: vendor_contract_invalid_enum_fee_model_rejected
        claim_type: Type Constraints
        grounds:
          - errors[ERR_INVALID_ENUM]
          - validations[priority=8]
          - entities.VendorContract.fields.fee_model
        distinguishing_aspect: "A fee_model outside {PER_VISIT, FTE_HOUR} returns 400 ERR_INVALID_ENUM, distinct from the missing-field ERR_VALIDATION at the rung above it."
        test_recipe:
          setup: ["One employer and one site exist."]
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Enum Co", employer_code: "ENM", annual_total_cost_of_coverage_cents: 1200000, wellness_budget_cents: 250000 }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /sites"
              payload: { site_name: "ENM Clinic", site_type: "ON_SITE", open_time_utc: "08:00", close_time_utc: "17:00", operating_weekdays: [1, 2, 3, 4, 5], daily_slot_capacity: 4, host_employer_id: "${emp_id}" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /vendor-contracts"
              payload: { site_id: "${site_id}", employer_id: "${emp_id}", vendor_name: "Bad Model LLC", fee_model: "PER_HEADCOUNT", per_visit_fee_cents: 9500, fte_hourly_rate_cents: 14000, minimum_guarantee_cents: 100000, quota_visits_total: 10 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id ERR_INVALID_ENUM"
            - "GET /vendor-contracts?site_id=${site_id} returns total_count 0"

      - name: appointment_system_and_computed_fields_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Appointment.fields.scheduled_end
          - entities.Appointment.fields.service_date
          - entities.Appointment.fields.quota_contract_id
          - entities.Appointment.fields.status
        distinguishing_aspect: "scheduled_end, service_date, status, reschedule_count and quota_contract_id are server-derived: values supplied for them in the request body are ignored and the server writes scheduled_start plus 30 minutes, the UTC date, BOOKED, 0 and the selected contract."
        test_recipe:
          setup: ["Employer, on-site clinic, contract with quota 10, credentialed clinician with an 08:00-17:00 shift on 2026-06-08, and one ACTIVE participant."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employers"
              payload: { legal_name: "Ignore Co", employer_code: "IGN", annual_total_cost_of_coverage_cents: 1200000, wellness_budget_cents: 250000 }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /sites"
              payload: { site_name: "IGN Clinic", site_type: "ON_SITE", open_time_utc: "08:00", close_time_utc: "17:00", operating_weekdays: [1, 2, 3, 4, 5], daily_slot_capacity: 4, host_employer_id: "${emp_id}" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { site_id: "${site_id}", employer_id: "${emp_id}", vendor_name: "CareOnSite LLC", fee_model: "PER_VISIT", per_visit_fee_cents: 9500, fte_hourly_rate_cents: 14000, minimum_guarantee_cents: 100000, quota_visits_total: 10 }
              as: ProgramAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /providers"
              payload: { site_id: "${site_id}", full_name: "Dr Rivera", provider_function: "CLINICIAN", license_expiry_date: "2027-12-31" }
              as: ClinicManager
              captures: { clin_id: $.data.id }
            - call: "POST /staffing-shifts"
              payload: { site_id: "${site_id}", provider_id: "${clin_id}", shift_start: "2026-06-08T08:00:00Z", shift_end: "2026-06-08T17:00:00Z", coverage_role: "PRIMARY_CARE" }
              as: ClinicManager
            - call: "POST /eligibility-records"
              payload: { employer_id: "${emp_id}", subscriber_external_id: "S-3101", member_external_id: "M-3101", tier: "SPOUSE", effective_date: "2026-01-01" }
              as: EmployerBenefitsAdmin
              as_user_id: "${emp_id}"
              captures: { elig_id: $.data.id }
            - call: "POST /participants"
              payload: { employer_id: "${emp_id}", eligibility_record_id: "${elig_id}", display_name: "Ign Tester" }
              as: EmployerBenefitsAdmin
              as_user_id: "${emp_id}"
              captures: { p_id: $.data.id }
            - call: "GET /sites/${site_id}"
              payload: {}
              as: Participant
              as_user_id: "${p_id}"
              captures: { sv1: $.data.version }
          trigger:
            - call: "POST /appointments"
              payload: { participant_id: "${p_id}", site_id: "${site_id}", provider_id: "${clin_id}", visit_type: "PRIMARY_CARE", scheduled_start: "2026-06-08T09:00:00Z", expected_site_version: "${sv1}", status: "CONSUMED", scheduled_end: "2026-06-08T23:00:00Z", reschedule_count: 7 }
              as: Participant
              as_user_id: "${p_id}"
              captures: { apt_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Appointment.${apt_id}.status == BOOKED, not CONSUMED"
            - "Appointment.${apt_id}.scheduled_end == 2026-06-08T09:30:00.000Z"
            - "Appointment.${apt_id}.service_date == 2026-06-08"
            - "Appointment.${apt_id}.reschedule_count == 0"
            - "Appointment.${apt_id}.quota_contract_id == ${contract_id}"
            - "Participant.${p_id}.tier == SPOUSE, copied from the eligibility row"

      - name: visit_computed_chargeable_party_forks_on_visit_type
        claim_type: Computed Fields
        grounds:
          - entities.Visit.fields.chargeable_party
          - entities.Visit.fields.consumes_benefit_entitlement
          - state_machines.Visit.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: "Completing a PRIMARY_CARE visit writes chargeable_party HEALTH_PLAN with consumes_benefit_entitlement true, while an OCC_HEALTH visit writes EMPLOYER_DIRECT with false - the payer fork is derived, never supplied."
        test_recipe:
          setup: ["Employer, on-site clinic, contract, clinician with an 08:00-17:00 shift on 2026-06-08 and one ACTIVE participant with two booked appointments of different types."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employers"
              payload: { legal_name: "Payer Co", employer_code: "PAY", annual_total_cost_of_coverage_cents: 1200000, wellness_budget_cents: 250000 }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /sites"
              payload: { site_name: "PAY Clinic", site_type: "ON_SITE", open_time_utc: "08:00", close_time_utc: "17:00", operating_weekdays: [1, 2, 3, 4, 5], daily_slot_capacity: 4, host_employer_id: "${emp_id}" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { site_id: "${site_id}", employer_id: "${emp_id}", vendor_name: "CareOnSite LLC", fee_model: "PER_VISIT", per_visit_fee_cents: 9500, fte_hourly_rate_cents: 14000, minimum_guarantee_cents: 100000, quota_visits_total: 10 }
              as: ProgramAdmin
            - call: "POST /providers"
              payload: { site_id: "${site_id}", full_name: "Dr Rivera", provider_function: "CLINICIAN", license_expiry_date: "2027-12-31" }
              as: ClinicManager
              captures: { clin_id: $.data.id }
            - call: "POST /staffing-shifts"
              payload: { site_id: "${site_id}", provider_id: "${clin_id}", shift_start: "2026-06-08T08:00:00Z", shift_end: "2026-06-08T17:00:00Z", coverage_role: "PRIMARY_CARE" }
              as: ClinicManager
            - call: "POST /eligibility-records"
              payload: { employer_id: "${emp_id}", subscriber_external_id: "S-3201", member_external_id: "M-3201", tier: "EMPLOYEE", effective_date: "2026-01-01" }
              as: EmployerBenefitsAdmin
              as_user_id: "${emp_id}"
              captures: { elig_id: $.data.id }
            - call: "POST /participants"
              payload: { employer_id: "${emp_id}", eligibility_record_id: "${elig_id}", display_name: "Pay Tester" }
              as: EmployerBenefitsAdmin
              as_user_id: "${emp_id}"
              captures: { p_id: $.data.id }
            - call: "GET /sites/${site_id}"
              payload: {}
              as: Participant
              as_user_id: "${p_id}"
              captures: { sv1: $.data.version }
            - call: "POST /appointments"
              payload: { participant_id: "${p_id}", site_id: "${site_id}", provider_id: "${clin_id}", visit_type: "PRIMARY_CARE", scheduled_start: "2026-06-08T09:00:00Z", expected_site_version: "${sv1}" }
              as: Participant
              as_user_id: "${p_id}"
              captures: { a1: $.data.id }
            - call: "GET /sites/${site_id}"
              payload: {}
              as: Participant
              as_user_id: "${p_id}"
              captures: { sv2: $.data.version }
            - call: "POST /appointments"
              payload: { participant_id: "${p_id}", site_id: "${site_id}", provider_id: "${clin_id}", visit_type: "OCC_HEALTH", scheduled_start: "2026-06-08T09:30:00Z", expected_site_version: "${sv2}" }
              as: Participant
              as_user_id: "${p_id}"
              captures: { a2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T11:00:00Z" }
              as: ProgramAdmin
            - call: "POST /appointments/${a1}/check-in"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { v1: $.data.id }
            - call: "POST /visits/${v1}/start"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /appointments/${a2}/check-in"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { v2: $.data.id }
            - call: "POST /visits/${v2}/start"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
          trigger:
            - call: "POST /visits/${v1}/complete"
              payload: { clinical_note: "Routine primary care" }
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /visits/${v2}/complete"
              payload: { fitness_conclusion: "FIT_FOR_DUTY" }
              as: Clinician
              as_user_id: "${clin_id}"
          assert:
            - "Visit.${v1}.chargeable_party == HEALTH_PLAN and consumes_benefit_entitlement == true"
            - "Visit.${v2}.chargeable_party == EMPLOYER_DIRECT and consumes_benefit_entitlement == false"
            - "Visit.${v1}.disclosure_status == NOT_DISCLOSABLE because PRIMARY_CARE is never disclosable"
            - "Participant.${p_id}.authorization_status == NOT_REQUESTED, the initial value of the authorization axis"
            - "Visit.${v2}.disclosure_status == SUPPRESSED because the participant never granted authorization"
            - "Participant.${p_id}.completed_visit_count == 2"

      - name: eligibility_coverage_status_future_blocks_enrollment
        claim_type: Computed Fields
        grounds:
          - calculations.eligibility_coverage
