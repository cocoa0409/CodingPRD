      - name: projected_and_as_run_variance_variants_diverge_on_the_same_rows
        claim_type: Variant Divergence
        grounds: "§1.3 playlist_timing_variance variants PROJECTED (scheduled_duration_seconds for every non-dropped item) and AS_RUN (measured_duration_seconds for PLAYED and TRUNCATED items, 0 for SKIPPED and PREEMPTED); input_set 'neither variant consults AsRunEntry rows'"
        distinguishing_aspect: "Identical stored rows yield 0 and -60 at the same instant, and after the close they yield -300 and -360, because PROJECTED drops SKIPPED items from its sum entirely while AS_RUN adds 0 for them and uses measured lengths elsewhere. Only the PROJECTED value gates arming; only the AS_RUN value is the closing figure."
        test_recipe:
          setup: "A two-item playlist on ch2 (window 600): item 1 PROGRAM 300 s at 14:00:00Z, item 2 PROGRAM 300 s at 14:05:00Z. ch2 is taken to air and item 1 plays short (240 s)."
          setup_api_calls:
            - *clk_t0
            - *op_eng
            - *op_mco
            - *op_qc
            - *tx1
            - *mux1
            - *ch1
            - *mux1_read_v2
            - *ch2
            - *as_prog
            - *dl_prog
            - *qc_prog
            - call: "POST /playlists"
              payload:
                channel_id: "${ch2_id}"
                broadcast_day: "2026-08-01"
                schedule_start_utc: "2026-08-01T14:00:00Z"
                window_duration_seconds: 600
                items:
                  - { sequence_number: 1, element_kind: PROGRAM, asset_id: "${aprog_id}", scheduled_start_utc: "2026-08-01T14:00:00Z", scheduled_duration_seconds: 300 }
                  - { sequence_number: 2, element_kind: PROGRAM, asset_id: "${aprog_id}", scheduled_start_utc: "2026-08-01T14:05:00Z", scheduled_duration_seconds: 300 }
              as: TrafficCoordinator
              captures: { pl_var_id: "$.data.id" }
            - call: "POST /playlists/${pl_var_id}/state"
              payload: { target_status: VALIDATED }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
            - call: "POST /channels/${ch2_id}/air-state"
              payload: { target_air_status: ON_AIR }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
            - call: "POST /playlists/${pl_var_id}/state"
              payload: { target_status: ARMED }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T13:55:00Z" }
              as: StationAdmin
            - call: "POST /playlists/${pl_var_id}/state"
              payload: { target_status: ON_AIR }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
            - call: "GET /playlists/${pl_var_id}/items"
              as: TrafficCoordinator
              captures: { itv1_id: "$.data[0].id", itv2_id: "$.data[1].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T14:00:00Z" }
              as: StationAdmin
            - call: "POST /playlist-items/${itv1_id}/playout-events"
              payload: { event_kind: CUE, event_utc: "2026-08-01T14:00:00Z", source: AUTOMATION }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
            - call: "POST /playlist-items/${itv1_id}/playout-events"
              payload: { event_kind: START, event_utc: "2026-08-01T14:00:00Z", source: AUTOMATION }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T14:04:00Z" }
              as: StationAdmin
            - call: "POST /playlist-items/${itv1_id}/playout-events"
              payload: { event_kind: END, event_utc: "2026-08-01T14:04:00Z", measured_duration_seconds: 240, source: AUTOMATION }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
            - call: "GET /playlists/${pl_var_id}"
              as: TrafficCoordinator
            - call: "POST /playlists/${pl_var_id}/state"
              payload: { target_status: CLOSED }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
          assert:
            - "at ingest both variants agree: projected_end_variance_seconds == 0 and asrun_end_variance_seconds == 0 (300 + 300 - 600)"
            - "after item 1 ends 60 s short: projected_end_variance_seconds is STILL 0 (PROJECTED uses scheduled 300 even for a PLAYED item) while asrun_end_variance_seconds == -60 (240 + 300 - 600)"
            - "after CLOSED sweeps item 2 to SKIPPED: projected_end_variance_seconds == -300 (item 2 is dropped from the PROJECTED sum entirely) and asrun_end_variance_seconds == -360 (240 + 0 - 600)"
            - "the two fields are never equal after the short play — an implementation writing one value to both fields fails at the first assert"
            - "the ARM precondition consulted only the PROJECTED value, which is why the playlist armed at variance 0"
            - "neither figure is derived from AsRunEntry rows: the 3 as-run entries for item 1 (CUE, START, END) do not enter either sum"

