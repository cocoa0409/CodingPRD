  # ===========================================================================
  - section: state_machines
    instances:

      - name: every_state_field_starts_in_its_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.WaterSystem.inventory_status.initial_state
          - state_machines.ServiceLine.inventory_state.initial_state
          - state_machines.ServiceLine.replacement_state.initial_state
          - state_machines.VerificationAppointment.state.initial_state
          - state_machines.SamplingBatch.state.initial_state
          - entities.VerificationCrew.fields.status
        distinguishing_aspect: "One creation call per state-bearing entity: WaterSystem DRAFT, ServiceLine UNCLASSIFIED + NOT_REQUIRED, VerificationCrew ACTIVE, VerificationAppointment SCHEDULED with attempt_count 1, SamplingBatch OPEN with reopen_count 0."
        test_recipe:
          setup:
            - "Empty database; the clock holds its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /lsl/water-systems"
              payload: { pwsid: "IL2101001", system_name: "Initial Water", compliance_deadline_date: "2027-10-16" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { ws: $.data.id }
            - call: "POST /lsl/service-lines"
              payload: { water_system_id: "${ws}", address_label: "101 Elm St", census_tract_code: "17031-9900" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { l1: $.data.id }
            - call: "POST /lsl/verification-crews"
              payload: { water_system_id: "${ws}", crew_name: "Crew A", shift_start_utc_time: "08:00", shift_end_utc_time: "18:00", daily_appointment_capacity: 2, certified_methods: ["VISUAL_INSPECTION", "POTHOLE"] }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { crew: $.data.id }
            - call: "POST /lsl/verification-appointments"
              payload: { service_line_id: "${l1}", crew_id: "${crew}", method: "POTHOLE", window_start_utc: "2026-08-05T09:00:00Z", window_end_utc: "2026-08-05T10:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { a1: $.data.id }
            - call: "POST /lsl/sampling-batches"
              payload: { water_system_id: "${ws}", stratum_code: "STR-A", stratum_line_count: 20 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { batch: $.data.id }
          assert:
            - "WaterSystem.${ws}.inventory_status == DRAFT"
            - "ServiceLine.${l1}.inventory_state == UNCLASSIFIED and ServiceLine.${l1}.replacement_state == NOT_REQUIRED"
            - "VerificationCrew.${crew}.status == ACTIVE and VerificationCrew.${crew}.scheduled_appointment_count == 1"
            - "VerificationAppointment.${a1}.state == SCHEDULED and VerificationAppointment.${a1}.attempt_count == 1 and VerificationAppointment.${a1}.emitted_evidence_item_id == null"
            - "SamplingBatch.${batch}.state == OPEN and SamplingBatch.${batch}.reopen_count == 0 and SamplingBatch.${batch}.required_sample_count == 5 and SamplingBatch.${batch}.valid_sample_count == 0"

      - name: arriving_twice_on_the_same_appointment_is_rejected
        claim_type: idempotency
        grounds:
          - state_machines.VerificationAppointment.SCHEDULED_to_ON_SITE
          - validations.priority_55_ERR_APPOINTMENT_STATE_INVALID
          - errors.ERR_APPOINTMENT_STATE_INVALID
        distinguishing_aspect: "The second arrive on an ON_SITE appointment returns ERR_APPOINTMENT_STATE_INVALID 409 and leaves state ON_SITE with attempt_count still 1 — arrive is not idempotent-silent."
        test_recipe:
          setup:
            - "One water system, one service line, one ACTIVE crew certified for POTHOLE, one appointment already moved to ON_SITE."
          setup_api_calls:
            - call: "POST /lsl/water-systems"
              payload: { pwsid: "IL2101002", system_name: "Arrive Water", compliance_deadline_date: "2027-10-16" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { ws: $.data.id }
            - call: "POST /lsl/service-lines"
              payload: { water_system_id: "${ws}", address_label: "101 Elm St", census_tract_code: "17031-9900" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { l1: $.data.id }
            - call: "POST /lsl/verification-crews"
              payload: { water_system_id: "${ws}", crew_name: "Crew A", shift_start_utc_time: "08:00", shift_end_utc_time: "18:00", daily_appointment_capacity: 1, certified_methods: ["VISUAL_INSPECTION", "POTHOLE"] }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { crew: $.data.id }
            - call: "POST /lsl/verification-appointments"
              payload: { service_line_id: "${l1}", crew_id: "${crew}", method: "POTHOLE", window_start_utc: "2026-08-05T09:00:00Z", window_end_utc: "2026-08-05T10:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { a1: $.data.id }
            - call: "POST /lsl/verification-appointments/${a1}/arrive"
              payload: {}
              as: FieldTechnician
              as_user_id: "${crew}"
          trigger:
            - call: "POST /lsl/verification-appointments/${a1}/arrive"
              payload: {}
              as: FieldTechnician
              as_user_id: "${crew}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "${err} == ERR_APPOINTMENT_STATE_INVALID"
            - "VerificationAppointment.${a1}.state == ON_SITE and VerificationAppointment.${a1}.attempt_count == 1"

      - name: completing_a_scheduled_appointment_before_arrival_is_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.VerificationAppointment.ON_SITE_to_COMPLETED
          - validations.priority_55_ERR_APPOINTMENT_STATE_INVALID
        distinguishing_aspect: "complete is declared only from ON_SITE, so firing it from SCHEDULED returns ERR_APPOINTMENT_STATE_INVALID 409, synthesizes no EvidenceItem and leaves emitted_evidence_item_id null."
        test_recipe:
          setup:
            - "One appointment in SCHEDULED (never arrived) against a service line with no evidence."
          setup_api_calls:
            - call: "POST /lsl/water-systems"
              payload: { pwsid: "IL2101003", system_name: "Skip Water", compliance_deadline_date: "2027-10-16" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { ws: $.data.id }
            - call: "POST /lsl/service-lines"
              payload: { water_system_id: "${ws}", address_label: "101 Elm St", census_tract_code: "17031-9900" }
