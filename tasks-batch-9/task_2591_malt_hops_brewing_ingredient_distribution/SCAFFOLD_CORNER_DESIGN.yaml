            - "before any confirm: ${av_committed_before} == 0 and ${av_available_before} == 5000 — the 1000 lb DRAFT line is excluded from the input set"
            - "after confirming order C: ${av_committed_after} == 1500 and ${av_available_after} == 3500 — only the confirmed line counts"
            - "after cancelling order C: MaltLot.${av_lot_id}.committed_lbs == 0 and available_lbs == 5000; the REMOVED line leaves the input set"
            - "the DRAFT order D is still DRAFT with its line in status OPEN throughout, and MaltLot.${av_lot_id}.quantity_lbs == 5000 never changes"
