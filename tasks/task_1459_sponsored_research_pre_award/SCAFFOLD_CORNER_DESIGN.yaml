        test_recipe:
          setup:
            - "Opportunity (no cost-share), eligible PI, PROVISIONAL 54% rate; org; proposal X with one SUBAWARD line 2500000; proposal Y with one SUBAWARD line 2500001 (each with its own commitment)"
