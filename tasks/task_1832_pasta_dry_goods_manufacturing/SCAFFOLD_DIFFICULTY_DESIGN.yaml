              payload: { lab_protein_pct: 13.8, lab_moisture_pct: 13.0, lab_gluten_index: 88, lab_falling_number_s: 340 }
              as: QATechnician
              as_user_id: "tech-1"
            - call: "POST /semolina-lots/${lot_id}/accept"
              payload: {}
              as: QAManager
              as_user_id: "qa-mgr-1"
            - call: "POST /recipes"
              payload: { recipe_name: "Penne INV", brand_type: "BRANDED", shape_family: "LONG_CUT", gluten_free: false, target_moisture_pct: 12.5, drying_curve: "STANDARD", shelf_life_days: 365, unit_weight_g: 500, units_per_case: 30, case_weight_limit_kg: 12.0, cases_per_pallet: 40, ingredients: [ { ingredient_type: "SEMOLINA", percentage: 100.0, min_protein_pct: 12.0 } ] }
              as: PlantManager
              as_user_id: "pm-1"
              captures: { r_id: $.data.id }
            - call: "POST /recipes/${r_id}/approve"
              payload: {}
              as: QAManager
              as_user_id: "qa-mgr-1"
            - call: "POST /production-lines"
              payload: { line_name: "L-INV" }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "GET /production-lines/${line_id}"
              as: ProductionOperator
              captures: { lv1: $.data.version }
            - call: "POST /production-runs"
              payload: { recipe_id: "${r_id}", line_id: "${line_id}", semolina_lot_id: "${lot_id}", planned_input_kg: 200.0, scheduled_start: "2026-08-10T00:00:00Z", scheduled_end: "2026-08-11T00:00:00Z", expected_line_version: "${lv1}" }
              as: ProductionOperator
              captures: { run1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlantManager
          trigger:
            - call: "POST /production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionOperator
            - call: "GET /semolina-lots/${lot_id}"
              as: ProductionOperator
              captures: { rem_mid: $.data.remaining_weight_kg, con_mid: $.data.consumed_kg }
            - call: "POST /production-runs/${run1_id}/abort"
              payload: {}
              as: ProductionOperator
            - call: "GET /semolina-lots/${lot_id}"
              as: ProductionOperator
              captures: { rem_post: $.data.remaining_weight_kg, con_post: $.data.consumed_kg, lot_status_post: $.data.status }
            - call: "GET /production-lines/${line_id}"
              as: ProductionOperator
              captures: { lv2: $.data.version }
            - call: "POST /production-runs"
              payload: { recipe_id: "${r_id}", line_id: "${line_id}", semolina_lot_id: "${lot_id}", planned_input_kg: 500.0, scheduled_start: "2026-08-12T00:00:00Z", scheduled_end: "2026-08-13T00:00:00Z", expected_line_version: "${lv2}" }
              as: ProductionOperator
