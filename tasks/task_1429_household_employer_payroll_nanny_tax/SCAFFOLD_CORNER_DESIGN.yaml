      - name: get_employers_filtered_list_is_array
        claim_type: listing
        grounds: ["endpoints.GET_/household-payroll/employers/{id}/registrations"]
        distinguishing_aspect: "Sub-resource list returns an array envelope even when empty: an employer with no registrations gets data == [], total_count == 0."
