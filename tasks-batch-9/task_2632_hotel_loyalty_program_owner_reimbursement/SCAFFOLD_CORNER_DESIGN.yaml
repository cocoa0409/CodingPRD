            - "Logical clock at its 2026-08-01T00:00:00Z default."
            - "One ACTIVE soft-market property (occupancy 0.60, ADR 4000) with an award pricing row, and one member who funds 40000 points, books a 2-night June award and completes the stay so 6000 cents is ACCRUED."
