  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_offer_counter_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[offer-counter-stale-listing]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Countering an Offer with a stale expected_offer_version (the value observed before the counterparty's own counter advanced the version) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Seller S publishes BUY_NOW 50000 accepts_offers; Buyer B offers 10000 (offer version observed as v1); seller counters 40000 (version advances)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c33s@x.com", display_name: "C33S", roles: ["SELLER"] }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "c33b@x.com", display_name: "C33B", roles: ["BUYER"] }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { seller_account_id: "${s_id}", title: "T33", format: "BUY_NOW", buy_now_price_cents: 50000, accepts_offers: true }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /listings/${lst_id}/offers"
              payload: { buyer_account_id: "${b_id}", amount_cents: 10000 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { off_id: $.data.id, v1: $.data.version }
            - call: "POST /offers/${off_id}/counter"
              payload: { amount_cents: 40000, expected_offer_version: "${v1}" }
              as: Seller
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /offers/${off_id}/counter"
              payload: { amount_cents: 20000, expected_offer_version: "${v1}" }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "HTTP status == 412"

      - name: occ_order_pay_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-pay-stale-order]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Paying an Order with a stale expected_order_version (the version observed before a seller cancellation advanced it) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Seller S publishes BUY_NOW 20000; Buyer B buys (order version observed as v_pre); seller cancels the unpaid order (Order.version advances; order CANCELLED)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c34s@x.com", display_name: "C34S", roles: ["SELLER"] }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "c34b@x.com", display_name: "C34B", roles: ["BUYER"] }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { seller_account_id: "${s_id}", title: "T34", format: "BUY_NOW", buy_now_price_cents: 20000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /listings/${lst_id}/buy-now"
              payload: { buyer_account_id: "${b_id}", shipping_cents: 0 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { ord_id: $.data.id, v_pre: $.data.version }
            - call: "POST /orders/${ord_id}/cancel"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /orders/${ord_id}/pay"
              payload: { expected_order_version: "${v_pre}" }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "HTTP status == 412"

      - name: cascade_full_refund_credits_invoice
        claim_type: cascading_side_effects
        grounds: [state_machines.Order.DELIVERED_to_RETURNED, entities.SellerFeeInvoice.fields.settlement_status]
        excluded_because:
          difficulty_instance: compensating_invariant / full_refund_conserves_paid_amount_to_zero
          rationale: "The complete-return refund cascade (and invoice credit) is asserted in that §1.8 invariant instance."

      - name: dual_variant_partial_refund_recompute
        claim_type: dual_variant_calculation
        grounds: [calculations.seller_fee, state_machines.Order.PAID_to_PARTIALLY_REFUNDED]
        excluded_because:
          difficulty_instance: dual_variant_calc / seller_fee_full_credit_vs_partial_recompute_on_order
          rationale: "Full-credit vs partial-recompute fee divergence asserted in that §1.8 instance."

  # =====================================================================
  # Consistency Model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: buy_now_response_reflects_order_immediately
        claim_type: immediate
        grounds: [endpoints, entities.Order, consistency_model]
        distinguishing_aspect: "POST /listings/{id}/buy-now returns the created Order with total_cents already computed (item 20000 + shipping 500 = 20500) in the same response — immediate consistency."
        test_recipe:
          setup: ["Seller S publishes BUY_NOW 20000; Buyer B buys with shipping 500."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c35s@x.com", display_name: "C35S", roles: ["SELLER"] }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "c35b@x.com", display_name: "C35B", roles: ["BUYER"] }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { seller_account_id: "${s_id}", title: "T35", format: "BUY_NOW", buy_now_price_cents: 20000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /listings/${lst_id}/buy-now"
              payload: { buyer_account_id: "${b_id}", shipping_cents: 500 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { ord_id: $.data.id, tot: $.data.total_cents }
          assert:
            - "Order.${ord_id}.total_cents == 20500"
            - "Order.${ord_id}.item_price_cents == 20000"
            - "Order.${ord_id}.source == BUY_NOW"
