scaffold_corner_design:
- section: entities
  instances:
  - name: organization_create_returns_201_and_defaults
    claim_type: creation
    grounds:
    - entities.Organization
    distinguishing_aspect: POST /licensing/organizations with all required fields returns 201 with status ACTIVE, compliance_posture COMPLIANT, storage_pool_gb 0.
    test_recipe:
      setup:
      - Bootstrap B0/BA0 exist
      setup_api_calls:
      - call: POST /licensing/organizations
        payload:
          name: B0
          org_type: INDIVIDUAL
          primary_admin_id: 00000000-0000-0000-0000-000000000000
        as: SystemAdmin
        captures:
          b0: $.data.id
      - call: POST /licensing/admins
        payload:
          email: ba0@b0.com
          full_name: Boot
          admin_kind: SYSTEM_ADMIN
          org_id: ${b0}
        as: SystemAdmin
        captures:
          ba0: $.data.id
      trigger:
      - call: POST /licensing/organizations
        payload:
          name: OC1
          org_type: ENTERPRISE
          primary_admin_id: ${ba0}
        as: SystemAdmin
        captures:
          o: $.data.id
      assert:
      - response status 201
      - Organization.${o}.status == ACTIVE
      - Organization.${o}.compliance_posture == COMPLIANT
  - name: organization_get_not_found_returns_404
    claim_type: not_found
    grounds:
    - entities.Organization
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: GET /licensing/organizations/{random-uuid} returns ERR_NOT_FOUND 404.
    test_recipe:
      setup:
      - Bootstrap B0/BA0 exist
      setup_api_calls:
      - call: POST /licensing/organizations
        payload:
          name: B0
          org_type: INDIVIDUAL
          primary_admin_id: 00000000-0000-0000-0000-000000000000
        as: SystemAdmin
        captures:
          b0: $.data.id
      - call: POST /licensing/admins
        payload:
          email: ba0@b0.com
          full_name: Boot
          admin_kind: SYSTEM_ADMIN
          org_id: ${b0}
        as: SystemAdmin
        captures:
          ba0: $.data.id
      trigger:
      - call: GET /licensing/organizations/11111111-2222-3333-4444-555555555555
        payload: {}
        as: SystemAdmin
        captures:
          e: $.data.error_id
      assert:
      - response error_id == ERR_NOT_FOUND
      - http status == 404
  - name: plan_create_missing_required_field_returns_400
    claim_type: required_fields
    grounds:
    - entities.Plan
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: POST /licensing/plans omitting etf_rate_pct returns ERR_INVALID_REQUEST 400.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /licensing/plans
        payload:
          code: PX
          segment: TEAM
          billing_model: MONTHLY
          monthly_price_cents: 3000
          annual_monthly_price_cents: 3000
          storage_gb_per_seat: 20
          seat_limit: -1
          deployment_modes:
          - NAMED_USER
          allows_offline_activation: false
          max_devices_per_seat: 2
          cancellation_window_days: 14
        as: SystemAdmin
        captures:
          e: $.data.error_id
      assert:
      - response error_id == ERR_INVALID_REQUEST
  - name: plan_defaults_max_devices_applied
    claim_type: defaults
    grounds:
    - entities.Plan.fields.max_devices_per_seat
    distinguishing_aspect: "Plan.max_devices_per_seat has default 2 \u2014 wait, field is input without default in entity table? It has default: 2. Omitting max_devices_per_seat yields 2. Verified via a\
      \ plan create that omits it."
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /licensing/plans
        payload:
          code: PD
          segment: TEAM
          billing_model: MONTHLY
          monthly_price_cents: 3000
          annual_monthly_price_cents: 3000
          storage_gb_per_seat: 20
          seat_limit: -1
          deployment_modes:
          - NAMED_USER
          allows_offline_activation: false
          cancellation_window_days: 14
          etf_rate_pct: 0
        as: SystemAdmin
        captures:
          pl: $.data.id
      assert:
      - Plan.${pl}.max_devices_per_seat == 2
  - name: computed_fields_input_ignored
    claim_type: computed_fields
    grounds:
    - entities.Organization.fields.storage_pool_gb
    - entities.Subscription.fields.seats_assigned
    distinguishing_aspect: Client-supplied storage_pool_gb on org create is ignored; server computes it (0 at creation).
    test_recipe:
      setup:
      - Bootstrap B0/BA0 exist
      setup_api_calls:
      - call: POST /licensing/organizations
        payload:
          name: B0
          org_type: INDIVIDUAL
          primary_admin_id: 00000000-0000-0000-0000-000000000000
        as: SystemAdmin
        captures:
          b0: $.data.id
      - call: POST /licensing/admins
        payload:
          email: ba0@b0.com
          full_name: Boot
          admin_kind: SYSTEM_ADMIN
          org_id: ${b0}
        as: SystemAdmin
        captures:
          ba0: $.data.id
      trigger:
      - call: POST /licensing/organizations
        payload:
          name: OC2
          org_type: TEAM
          primary_admin_id: ${ba0}
          storage_pool_gb: 9999
        as: SystemAdmin
        captures:
          o: $.data.id
      assert:
      - Organization.${o}.storage_pool_gb == 0 (input ignored)
  - name: admin_list_pagination_envelope
    claim_type: listing
    grounds:
    - entities.Admin
    - response_envelope
    distinguishing_aspect: GET /licensing/admins returns data array with pagination meta (limit/offset/total_count/has_more).
    test_recipe:
      setup:
      - Bootstrap B0/BA0 exist (>=1 admin)
      setup_api_calls:
      - call: POST /licensing/organizations
        payload:
          name: B0
          org_type: INDIVIDUAL
          primary_admin_id: 00000000-0000-0000-0000-000000000000
        as: SystemAdmin
        captures:
          b0: $.data.id
      - call: POST /licensing/admins
        payload:
          email: ba0@b0.com
          full_name: Boot
          admin_kind: SYSTEM_ADMIN
          org_id: ${b0}
        as: SystemAdmin
        captures:
          ba0: $.data.id
      trigger:
      - call: GET /licensing/admins
        payload:
          limit: 1
          offset: 0
        as: SystemAdmin
      assert:
      - response_type == array
      - 'pagination fields present: total_count >= 1, has_more is boolean'
  - name: subscription_fk_reverse_reachable_via_filtered_list
    claim_type: parent_relationships
    grounds:
    - entities.Subscription.fields.org_id
    distinguishing_aspect: GET /licensing/subscriptions?org_id=X returns exactly the subscriptions of org X.
    test_recipe:
      setup:
      - Org with one subscription ACTIVE
      setup_api_calls:
      - call: POST /licensing/organizations
        payload:
          name: B0
          org_type: INDIVIDUAL
          primary_admin_id: 00000000-0000-0000-0000-000000000000
        as: SystemAdmin
        captures:
          b0: $.data.id
      - call: POST /licensing/admins
        payload:
          email: ba0@b0.com
          full_name: Boot
          admin_kind: SYSTEM_ADMIN
          org_id: ${b0}
        as: SystemAdmin
        captures:
          ba0: $.data.id
      - call: POST /licensing/organizations
        payload:
          name: OC4
          org_type: TEAM
          primary_admin_id: ${ba0}
        as: SystemAdmin
        captures:
          o: $.data.id
      - call: POST /licensing/admins
        payload:
          email: oa@o.com
          full_name: Org Admin
          admin_kind: SYSTEM_ADMIN
          org_id: ${o}
        as: SystemAdmin
        captures:
          oa: $.data.id
      - call: POST /licensing/plans
        payload:
          code: PX
          segment: TEAM
          billing_model: MONTHLY
          monthly_price_cents: 3000
          annual_monthly_price_cents: 3000
          storage_gb_per_seat: 20
          seat_limit: -1
          deployment_modes:
          - NAMED_USER
          allows_offline_activation: false
          max_devices_per_seat: 2
          cancellation_window_days: 14
          etf_rate_pct: 0
        as: SystemAdmin
        captures:
          pl: $.data.id
      - call: POST /licensing/product-versions
        payload:
          plan_id: ${pl}
          version_label: '2026.1'
          release_date: '2026-01-15T00:00:00Z'
        as: SystemAdmin
      - call: POST /licensing/subscriptions
        payload:
          org_id: ${o}
          plan_id: ${pl}
          seats_purchased: 1
        as: SystemAdmin
        captures:
          s: $.data.id
      - call: POST /licensing/subscriptions/${s}/activate
        payload: {}
        as: SystemAdmin
        captures:
          sv: $.data.version
      trigger:
      - call: GET /licensing/subscriptions
        payload:
          org_id: ${o}
        as: SystemAdmin
      assert:
      - response array length == 1
      - every item org_id == ${o}
- section: state_machines
