              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/candidates"
              payload: { full_name: "Cand V", email: "cand.v@x.com" }
              as: Recruiter
              as_user_id: rec-1
              captures: { cand_id: $.data.id }
            - call: "POST /api/offers"
              payload: { requisition_id: "${req_id}", candidate_id: "${cand_id}", base_cents: 20000000, bonus_target_pct: 0, equity_shares: 0, equity_fmv_cents: 0 }
              as: Recruiter
              as_user_id: rec-1
              captures: { offer_id: $.data.id }
            - call: "POST /api/offers/${offer_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: rec-1
            - call: "GET /api/offers/${offer_id}/approval-steps"
              as: Recruiter
              as_user_id: rec-1
              captures: { step0: "$.data[0].id" }
            - call: "POST /api/approval-steps/${step0}/decide"
              payload: { decision: APPROVED }
              as: HiringManager
              as_user_id: hm-1
            - call: "POST /api/offers/${offer_id}/letters"
              payload: {}
              as: Recruiter
              as_user_id: rec-1
            - call: "POST /api/offers/${offer_id}/extend"
              payload: {}
              as: Recruiter
              as_user_id: rec-1
