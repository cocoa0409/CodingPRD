      - name: calc_variant_selection_provisional_program_at_creation_final_program_at_finalize
        claim_type: variant_selection
        grounds:
          - calculations.qualification_evaluation
          - entities.TransactionRecord.fields.provisional_rate_program_id
          - entities.TransactionRecord.fields.qualified_rate_program_id
        excluded_because:
          difficulty_instance: dual_variant_qualification_provisional_auth_based_vs_final_clearing_based
          rationale: "The §1.8 instance already drives both variants over the same stored row and asserts that the provisional selection made at record creation differs from the final selection made at batch finalize, which is exactly the variant-selection claim."

      - name: calc_variant_divergence_trailing_and_projected_bases_diverge_on_identical_rows
        claim_type: variant_divergence
        grounds:
          - calculations.incentive_performance_score
          - entities.IncentiveEnrollment.fields.achieved_volume_cents
        excluded_because:
          difficulty_instance: dual_variant_performance_score_trailing_vs_projected_on_incentive_enrollment
          rationale: "The §1.8 instance evaluates the same enrollment under both bases and asserts two different achieved_volume_cents and performance_score_pct values plus divergent status routing, subsuming the divergence claim."

      - name: calc_reconciliation_provisional_to_final_delta_is_posted_only_at_finalize
        claim_type: reconciliation
        grounds:
          - calculations.qualification_evaluation
          - calculations.batch_assessment_total
        excluded_because:
          difficulty_instance: dual_variant_qualification_provisional_auth_based_vs_final_clearing_based
          rationale: "The §1.8 instance asserts that provisional_assessed_cents is never posted to any ledger and that only the final variant's value lands in total_assessed_cents and lifetime_net_assessed_cents, which is the reconciliation claim."

      - name: calc_aggregation_batch_total_rounds_per_record_before_summing
        claim_type: aggregation
        grounds:
          - calculations.interchange_assessment
          - entities.SettlementBatch.fields.total_assessed_cents
        excluded_because:
          difficulty_instance: combinatorial_mode_b_round_per_record_then_sum_batch_total
          rationale: "The §1.8 instance pins round-per-record-then-sum against sum-then-round with literals chosen so the two orders disagree, which fully covers the aggregation claim for the batch total."

      - name: calc_constants_applied_fx_markup_component_on_currency_conversion
        claim_type: constants_applied
        grounds:
          - calculations.interchange_assessment
          - entities.TransactionRecord.fields.fx_markup_cents
          - entities.FxRate.fields.markup_bps
        excluded_because:
          difficulty_instance: combinatorial_mode_a_nested_cap_then_floor_clamp_with_cross_border_and_fx
          rationale: "The §1.8 instance builds a record whose transaction_currency differs from the batch currency and asserts the exact fx_markup_cents produced by the FxRate markup_bps inside the clamp, covering this constant."

      - name: calc_threshold_downgrade_counter_crossing_the_audit_trigger_boundary
        claim_type: threshold
        grounds:
          - calculations.merchant_downgrade_counter
          - entities.Merchant.fields.downgrade_count_current_quarter
        excluded_because:
          difficulty_instance: cascade_batch_finalize_to_downgrade_counter_to_auto_audit_to_reclassification_suspension
          rationale: "The §1.8 cascade instance finalizes a batch that walks downgrade_count_current_quarter across the trigger boundary and asserts the auto-opened DOWNGRADE_THRESHOLD audit, covering the threshold claim."

      - name: calc_interval_merge_rate_version_effective_ranges_are_half_open
        claim_type: interval_merge
        grounds:
          - calculations.rate_version_window_overlap_check
        excluded_because:
          difficulty_instance: temporal_overlap_rate_version_half_open_adjacency_legal_intrusion_rejected
          rationale: "The §1.8 instance publishes exactly adjacent half-open ranges successfully and then rejects a genuinely intruding range, which is the adjacent-plus-overlapping pair this claim asks for."

      - name: calc_forward_looking_projected_basis_reevaluated_after_new_volume_lands
        claim_type: forward_looking
        grounds:
          - calculations.incentive_performance_score
        excluded_because:
          difficulty_instance: dual_variant_performance_score_trailing_vs_projected_on_incentive_enrollment
          rationale: "The §1.8 instance re-evaluates the same enrollment after additional finalized volume enters the measurement window and asserts the recomputed projection, covering the forward-looking claim."

  - section: validations
    instances:
      - name: validation_p1_request_without_the_role_header_returns_401_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - response_envelope.error
        distinguishing_aspect: "P1 is the outermost rule: a request that omits X-User-Role is rejected with ERR_UNAUTHENTICATED 401 even though the body is perfectly well formed, so no 400 and no 403 may surface first. The `as:` value on the trigger call names the endpoint's normal caller only; the test itself sends the request with the X-User-Role header removed."
        test_recipe:
          setup:
            - "Clock at 2026-09-03T00:00:00Z. No other state is required."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /processing-platforms"
              payload: { name: "PLAT-NA-1", region_code: "NA", max_concurrent_windows: 1, blackout_buffer_days: 3 }
              as: NetworkAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 401"
            - "${err} == ERR_UNAUTHENTICATED"
            - "response.response_type == error"
            - "response.meta.api_request_id is a non-empty string"
            - "no ProcessingPlatform row was created"

      - name: validation_p2_category_approver_calling_a_network_admin_endpoint_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
          - endpoints[POST /rate-programs]
        distinguishing_aspect: "P2 fires on role membership alone and outranks every body-shape and existence check, so a CategoryApprover posting a syntactically valid rate program gets 403 ERR_UNAUTHORIZED rather than 400 or 201."
        test_recipe:
          setup:
            - "Clock at 2026-09-03T00:00:00Z. No other state is required."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /rate-programs"
              payload: { program_code: "STANDARD_FALLBACK", name: "Standard", category: "STANDARD", eligible_mcc_codes: ["5411"], base_rate_bps: 254, per_item_fee_cents: 10, requires_data_elements: [], max_clearing_delay_hours: 720 }
              as: CategoryApprover
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 403"
            - "${err} == ERR_UNAUTHORIZED"
            - "GET /rate-programs as NetworkAdmin returns total_count 0"

      - name: validation_p4_body_id_naming_an_unknown_platform_returns_404_not_found
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - errors[ERR_PLATFORM_NOT_FOUND]
          - endpoints[POST /acquirers]
        distinguishing_aspect: "P4 resolves ids supplied in the request BODY, not just in the path, so an otherwise valid acquirer whose platform_id names no stored row is rejected 404 ERR_PLATFORM_NOT_FOUND rather than being created with a dangling reference."
        test_recipe:
          setup:
