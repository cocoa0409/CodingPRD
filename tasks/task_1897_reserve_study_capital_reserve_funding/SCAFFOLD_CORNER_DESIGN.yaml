        claim_type: correct_result
        grounds: [calculations.annual_update_rolldown, "errors[ERR_ANNUAL_UPDATE_ALREADY_RUN]"]
        distinguishing_aspect: "Ops-run checkpoint: one call rolls C1 RUL 2->1 and C2 RUL 1->0 (floor at 0), recomputes FFB to 130000 and percent to 384.62, creates the ANNUAL_STATEMENT disclosure due 2027-02-04, stamps FY2027, and a second call in the same fiscal year is rejected."
        test_recipe:
          setup:
            - "RULE_CA; association cash 500000; F1 study ADOPTED (C1 UL 5 RUL 2 100000; C2 UL 4 RUL 1 50000; FFB 97500)"
            - "logical clock advanced to 2027-01-05 (FY2027)"
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
