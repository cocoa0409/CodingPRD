      - name: role_gate_outranks_the_unknown_penalty_id_and_returns_unauthorized
        claim_type: priority_ordering
        grounds:
          - validations.v_role_permitted
          - validations.v_path_target_exists
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_PENALTY_NOT_FOUND
        distinguishing_aspect: "Priority 2 outranks priority 3, so a Participant probing a non-existent penalty id gets ERR_UNAUTHORIZED (403) rather than ERR_PENALTY_NOT_FOUND (404) — the endpoint must not confirm or deny the existence of enforcement records to a caller who has no business reading them. A ComplianceOfficer making the identical call DOES get the 404, which proves the ordering rather than a blanket 403."
        test_recipe:
