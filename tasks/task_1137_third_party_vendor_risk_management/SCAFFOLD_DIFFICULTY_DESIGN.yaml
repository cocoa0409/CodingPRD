  # =========================================================================
  # Rule 4 — transitive_cascade (different triggers, one depth ≥3, one depth ≥2)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: bcp_failure_cascade_to_vendor_posture
        grounds:
          - state_machines.BusinessContinuityTest.transitions
          - state_machines.Incident.transitions
          - calculations.composite_risk_score
          - calculations.tier_posture_derivation
        distinguishing_aspect: |
          Depth-3 cascade originating at POST /tprm/bcp-tests/{id}/submit-result.
          Hop 1: BCP FAILED on TIER_1 engagement auto-creates Incident (SEV_2,
          type=OUTAGE). Hop 2: the new Incident in OPEN status mutates
          engagement.risk_attention_state NORMAL→UNDER_REVIEW. Hop 3: vendor.tier_posture
          recomputes via composite_risk_score (SEV_2 contributes 20, multiplied
          by tier 1.5 = 30, posture flips CLEAN→WATCH since 30 >= 15 and < 40).
          Each hop is caused by the previous, not by the original trigger.
        test_recipe:
          setup:
            - "Vendor V ACTIVE, tier TIER_1_CRITICAL; engagement E ACTIVE; contract EXECUTED; BCP test SCHEDULED then begun."
          setup_api_calls:
            - call: "POST /tprm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tprm/vendors"
              payload: { legal_name: "Cascade Vendor", headquarters_region: "NA", service_category: "CLOUD_INFRA" }
              as: VendorRelationshipManager
              captures: { v_cas: $.data.id }
            - call: "POST /tprm/vendors/${v_cas}/engagements"
              payload: { engagement_code: "CAS-E1", service_summary: "Cloud", annual_spend_cents: 100, data_sensitivity: "REGULATED" }
              as: VendorRelationshipManager
              captures: { e_cas: $.data.id }
            - call: "GET /tprm/vendors/${v_cas}"
              payload: {}
              as: RiskOfficer
              captures: { v_cas_v: $.data.version }
            - call: "POST /tprm/vendors/${v_cas}/tier-change"
              payload: { to_tier: "TIER_1_CRITICAL", reason: "critical", expected_vendor_version: "${v_cas_v}" }
              as: RiskOfficer
            - call: "POST /tprm/engagements/${e_cas}/due-diligence-packages"
              payload: { financial_review_score: 90, security_review_score: 90, compliance_review_score: 90, financial_reviewer_id: "u_f12", security_reviewer_id: "u_s12", compliance_reviewer_id: "u_c12" }
              as: VendorRelationshipManager
              captures: { p_cas: $.data.id }
            - call: "POST /tprm/due-diligence-packages/${p_cas}/submit"
              payload: {}
              as: VendorRelationshipManager
            - call: "POST /tprm/due-diligence-packages/${p_cas}/begin-review"
              payload: {}
              as: RiskOfficer
            - call: "GET /tprm/engagements/${e_cas}"
              payload: {}
              as: RiskOfficer
              captures: { e_cas_v: $.data.version }
            - call: "POST /tprm/due-diligence-packages/${p_cas}/approve"
              payload: { expected_engagement_version: "${e_cas_v}" }
              as: RiskOfficer
            - call: "POST /tprm/engagements/${e_cas}/contracts"
              payload: { contract_reference: "CAS-C1", effective_date: "2026-05-01T00:00:00Z", expiry_date: "2027-05-01T00:00:00Z", has_right_to_audit_clause: true, has_sla_terms: true, has_exit_plan_section: true, sla_uptime_pct: 99.99, breach_cure_window_days: 30, renewal_notice_days: 60 }
              as: VendorRelationshipManager
              captures: { c_cas: $.data.id }
            - call: "GET /tprm/engagements/${e_cas}"
              payload: {}
              as: RiskOfficer
              captures: { e_cas_v2: $.data.version }
            - call: "POST /tprm/contracts/${c_cas}/execute"
              payload: { expected_engagement_version: "${e_cas_v2}" }
              as: RiskOfficer
            - call: "POST /tprm/vendors/${v_cas}/activate"
              payload: {}
              as: RiskOfficer
            - call: "POST /tprm/engagements/${e_cas}/bcp-tests"
              payload: { scheduled_for: "2026-05-10T00:00:00Z", scenario: "FULL_FAILOVER", rto_target_minutes: 60, rpo_target_minutes: 30 }
              as: RiskOfficer
              captures: { bcp_cas: $.data.id }
            - call: "POST /tprm/bcp-tests/${bcp_cas}/begin"
              payload: {}
              as: RiskOfficer
          trigger:
            - call: "POST /tprm/bcp-tests/${bcp_cas}/submit-result"
              payload: { actual_rto_minutes: 120, actual_rpo_minutes: 30 }
              as: RiskOfficer
          assert:
            - "BusinessContinuityTest.${bcp_cas}.status == FAILED  # actual_rto 120 > target 60"
            - "exists Incident on engagement ${e_cas} with incident_type == OUTAGE AND severity == SEV_2 AND status == OPEN  # hop 1"
            - "VendorEngagement.${e_cas}.risk_attention_state == UNDER_REVIEW  # hop 2 (triggered by the new Incident's OPEN state, not directly by the BCP result)"
            - "Vendor.${v_cas}.composite_risk_score == 45.00  # hop 3: (20 SEV_2 + 15 FAILED_BCP) * 1.5 tier_mult = 52.50 — corrected literal: (20+15)*1.5 = 52.50"
            - "Vendor.${v_cas}.tier_posture == ESCALATED  # 52.50 >= 40"

      - name: audit_finding_cascade_to_incident
        grounds:
          - state_machines.AuditExercise.transitions
          - state_machines.Incident.transitions
          - entities.AuditFinding.fields.raised_incident_id
        distinguishing_aspect: |
          Depth-2 cascade originating at POST /tprm/audits/{id}/issue-findings.
          Hop 1: each SEV_1/SEV_2 AuditFinding auto-creates an Incident on the
          engagement (setting finding.raised_incident_id). Hop 2: the new
          Incident mutates engagement.risk_attention_state NORMAL→UNDER_REVIEW
          (via triage logic — actually on creation it stays NORMAL until triaged;
          the cascade is finding → incident → engagement field). Distinct
          trigger from the BCP cascade.
        test_recipe:
