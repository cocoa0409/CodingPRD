        distinguishing_aspect: |
          The fiscal gates around a penalty, in the one configuration where the
          amount is fully determined by constants: the firm's registration is only
          DETERMINED, so it is not a governing registration and the volume factor
          and suspension surcharge are both neutral — NON_REGISTRATION assesses
          exactly BASE_CENTS 1000000. That outstanding balance blocks activation,
          a 999999-cent payment is refused as a partial payment, exact payment
          settles the row, a second payment hits the settled-terminal guard, and
          activation then succeeds.
        test_recipe:
          setup:
