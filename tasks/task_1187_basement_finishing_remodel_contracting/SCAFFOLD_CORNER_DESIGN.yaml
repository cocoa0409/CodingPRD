        claim_type: correct_result
        grounds: [calculations.moisture_risk_score]
        excluded_because:
          difficulty_instance: moisture_screening_vs_verification_divergence
          rationale: "Exact score literals (0 and 40) asserted there for both variants."

      - name: change_order_markup_exactness
        claim_type: constants_applied
        grounds: [calculations.change_order_pricing]
        excluded_because:
          difficulty_instance: change_order_per_item_markup_rounding
          rationale: "MARKUP_PCT 0.15 and per-line rounding asserted there with literal 234."

