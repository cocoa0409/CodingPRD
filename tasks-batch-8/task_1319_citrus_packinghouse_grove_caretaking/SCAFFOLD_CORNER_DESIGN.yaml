  - section: calculations
    instances:
      - name: maturity_variety_specific_minimums
        claim_type: constants_applied
        grounds: [calculations.maturity_evaluation]
        distinguishing_aspect: "Minimums are per-variety: RED_GRAPEFRUIT passes at ratio exactly 7.0 (its inclusive threshold) while the same numbers would fail HAMLIN; TANGERINE fails at 9.4 but passes at 9.5."
        test_recipe:
          setup: ["Grower with a RED_GRAPEFRUIT grove and a TANGERINE grove"]
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-CA1", display_name: "Variety Minima Groves" }, as: PackinghouseAdmin, captures: { ca1_g: "$.data.id" } }
