  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: transfer_initiate_requires_good_standing
        grounds: ["validations[priority=6]", entities.Member.fields.good_standing, "errors[ERR_NOT_GOOD_STANDING]"]
        distinguishing_aspect: |
          Pair = Member -> MemberTransfer: a DELINQUENT member's transfer initiation is
          rejected on the Member's state even though the request carries a fresh OCC
          version (passing priority 5) — the rejection comes from the cross-entity
          good_standing precondition, not from the transfer's own state.
        test_recipe:
          setup:
            - "FLAT local L1 (flat 5000, threshold 10000, grace 2); target local L2; self-pay member M"
            - "Runs 2026-05 + 2026-06 -> arrears 10000; sweep at 2026-08-01 -> M DELINQUENT"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 200", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 10, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals"
              payload: { name: "Local 400", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 1000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 10, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc2: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 0 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", full_name: "Gated Gail", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { mem: "$.data.id" }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-05" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-06" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/system/sweeps/delinquency", payload: { local_id: "${loc}" }, as: LocalAdmin }
            - call: "GET /api/members/${mem}"
              as: SecretaryTreasurer
              captures: { m_v: "$.data.version", m_gs: "$.data.good_standing" }
          trigger:
            - call: "POST /api/members/${mem}/transfers"
              payload: { to_local_id: "${loc2}", effective_period: "2026-09", expected_member_version: "${m_v}" }
              as: Member
              as_user_id: "${mem}"
              captures: { err: "$.data.error_id" }
          assert:
            - "precondition source: ${m_gs} == false (DELINQUENT member cannot be in good standing)"
            - "${err} == ERR_NOT_GOOD_STANDING (409) — the fresh OCC version passed priority 5; the Member-state guard rejected it"

      - name: void_blocked_by_submitted_percapita
        grounds: [state_machines.CheckoffRemittance.POSTED_to_VOID, state_machines.PerCapitaReport.APPROVED_to_SUBMITTED, "errors[ERR_PERIOD_LOCKED]"]
        distinguishing_aspect: |
          Pair = PerCapitaReport -> CheckoffRemittance (different pair from the
          sibling's Member -> MemberTransfer): voiding a POSTED remittance is gated on
          a DIFFERENT entity's state — the period's per-capita report being SUBMITTED
          locks the remittance.
        test_recipe:
          setup:
            - "PCT local; JOURNEYMAN (min 3000, max 20000); member M on employer E; 2026-08 run (PROVISIONAL 3000)"
            - "Remittance 2026-08 remitted 3000 with line (M, 3000, gross 100000); reconcile -> RECONCILED (variance 0); post -> POSTED"
            - "Per-capita report for 2026-08 created, approved, submitted"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 100", dues_method: "PERCENTAGE_OF_GROSS", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 30, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id", loc_v: "$.data.version" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 3000, max_monthly_dues_cents: 20000 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/employers"
              payload: { name: "Acme Widgets" }
              as: OfficeClerk
              captures: { emp: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", employer_id: "${emp}", full_name: "Lock Larry", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { mem: "$.data.id" }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-08" }, as: SecretaryTreasurer }
            - call: "POST /api/remittances"
              payload: { employer_id: "${emp}", local_id: "${loc}", period: "2026-08", remitted_cents: 3000 }
              as: OfficeClerk
              as_user_id: clerk_1
              captures: { rem: "$.data.id" }
            - call: "POST /api/remittances/${rem}/lines"
              payload: { member_id: "${mem}", deducted_cents: 3000, gross_wages_cents: 100000 }
              as: OfficeClerk
            - { call: "POST /api/remittances/${rem}/reconcile", payload: {}, as: SecretaryTreasurer, as_user_id: st_1 }
            - { call: "POST /api/remittances/${rem}/post", payload: {}, as: SecretaryTreasurer, as_user_id: st_1 }
            - call: "POST /api/locals/${loc}/per-capita-reports"
              payload: { period: "2026-08", expected_local_version: "${loc_v}" }
              as: SecretaryTreasurer
              as_user_id: st_1
              captures: { rep: "$.data.id" }
            - { call: "POST /api/per-capita-reports/${rep}/approve", payload: {}, as: LocalAdmin, as_user_id: admin_1 }
            - { call: "POST /api/per-capita-reports/${rep}/submit", payload: {}, as: SecretaryTreasurer, as_user_id: st_1 }
          trigger:
            - call: "POST /api/remittances/${rem}/void"
              payload: {}
              as: LocalAdmin
              as_user_id: admin_1
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_PERIOD_LOCKED (409): the SUBMITTED PerCapitaReport for the same local+period gates the remittance void"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: notice_halfopen_window_boundary
        grounds: ["validations[priority=8]", "errors[ERR_NOTICE_WINDOW_OPEN]", entities.DelinquencyNotice.fields.cure_deadline, state_machines.DelinquencyNotice.DRAFT_to_SENT]
        distinguishing_aspect: |
          Resource = a member's notice timeline; semantics = HALF-OPEN [sent_at,
          cure_deadline). A second send inside the window (2026-08-06) is rejected;
          a send at exactly the first window's cure_deadline (2026-08-11T00:00:00Z)
          is ACCEPTED because the endpoint is exclusive. Sibling uses closed-interval
          semantics on a different resource (the local's election calendar).
        test_recipe:
          setup:
            - "FLAT local (flat 5000, threshold 10000, grace 2, cure 10); self-pay member M"
            - "Runs 2026-05 + 2026-06 -> arrears 10000; sweep at 2026-08-01 -> DELINQUENT; DRAFT notice N1 created by the sweep"
            - "N1 sent at 2026-08-01T00:00:00Z (window [08-01, 08-11)); manual DRAFT N2 created 2026-08-02 (a SENT notice does not block drafting)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 200", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 10, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 0 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", full_name: "Nina Notice", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { mem: "$.data.id" }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-05" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-06" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/system/sweeps/delinquency", payload: { local_id: "${loc}" }, as: LocalAdmin }
            - call: "GET /api/members/${mem}/notices"
              as: OfficeClerk
              captures: { n1: "$.data[0].id" }
            - { call: "POST /api/members/${mem}/notices/${n1}/send", payload: {}, as: OfficeClerk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/members/${mem}/notices"
              payload: {}
              as: OfficeClerk
              captures: { n2: "$.data.id" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: ParentBodyAdmin }
          trigger:
            - call: "POST /api/members/${mem}/notices/${n2}/send"
              payload: {}
              as: OfficeClerk
              captures: { err: "$.data.error_id" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/members/${mem}/notices/${n2}/send"
              payload: {}
              as: OfficeClerk
              captures: { n2_status: "$.data.status", n2_deadline: "$.data.cure_deadline" }
          assert:
            - "inside N1's window (2026-08-06): ${err} == ERR_NOTICE_WINDOW_OPEN (409)"
            - "at exactly N1's cure_deadline (2026-08-11T00:00:00Z, exclusive endpoint): send succeeds — ${n2_status} == SENT"
            - "${n2_deadline} == 2026-08-21T00:00:00Z (sent_at + 10 days)"

      - name: election_closed_interval_touch_overlap
        grounds: ["validations[priority=8]", "errors[ERR_ELECTION_WINDOW_OVERLAP]", entities.Election.fields.nomination_open_at]
        distinguishing_aspect: |
          Resource = the local's election calendar; semantics = CLOSED intervals where
          touching endpoints count as overlap. A second election opening exactly at the
          first's close (2026-09-15T00:00:00Z) is rejected; opening one second later is
          accepted. Different interval semantics (closed/touching-rejected vs the
          sibling's half-open/adjacent-allowed) and different resource entity.
        test_recipe:
          setup:
            - "PCT local; election E1 scheduled with nomination window [2026-09-01T00:00:00Z, 2026-09-15T00:00:00Z], cutoff 2026-09-20T00:00:00Z"
          setup_api_calls:
            - call: "POST /api/locals"
              payload: { name: "Local 100", dues_method: "PERCENTAGE_OF_GROSS", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 30, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/elections"
              payload: { title: "Officers 2026", nomination_open_at: "2026-09-01T00:00:00Z", nomination_close_at: "2026-09-15T00:00:00Z", eligibility_cutoff_at: "2026-09-20T00:00:00Z" }
              as: LocalAdmin
              captures: { e1: "$.data.id" }
          trigger:
            - call: "POST /api/locals/${loc}/elections"
              payload: { title: "Delegates 2026", nomination_open_at: "2026-09-15T00:00:00Z", nomination_close_at: "2026-09-30T00:00:00Z", eligibility_cutoff_at: "2026-10-05T00:00:00Z" }
              as: LocalAdmin
              captures: { err: "$.data.error_id" }
            - call: "POST /api/locals/${loc}/elections"
              payload: { title: "Delegates 2026", nomination_open_at: "2026-09-15T00:00:01Z", nomination_close_at: "2026-09-30T00:00:00Z", eligibility_cutoff_at: "2026-10-05T00:00:00Z" }
              as: LocalAdmin
              captures: { e2: "$.data.id", e2_status: "$.data.status" }
          assert:
            - "touching windows (open == prior close): ${err} == ERR_ELECTION_WINDOW_OVERLAP (409)"
            - "one-second gap: election created — ${e2} is a UUID and ${e2_status} == SCHEDULED"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: post_then_void_restores_ledger_balance
        grounds: [state_machines.CheckoffRemittance.POSTED_to_VOID, calculations.payment_waterfall, entities.Member.fields.arrears_cents, entities.LedgerEntry.fields.amount_cents]
        distinguishing_aspect: |
          Conserved quantity = MONEY: the member's signed ledger balance
          (sum of LedgerEntry.amount_cents). Forward action post (credit 15000,
          auto-cure) paired with its compensation void (VOID_REVERSAL +15000,
          cure reverted) restores arrears 20000, credit 0 and status DELINQUENT
          exactly. Sibling conserves HEADCOUNT, a different quantity type.
        test_recipe:
          setup:
            - "FLAT local (flat 5000, threshold 10000, grace 2, cure 10); member M on employer E"
            - "Runs 2026-05..08 -> charges 20000 (4 x 5000); sweep at 2026-08-01 -> M DELINQUENT"
            - "Remittance 2026-08 remitted 15000, line (M, 15000, gross 0); reconcile finalizes 2026-08 at 5000 (delta 0, no adjustment entries), variance +10000 -> DISPUTED; resolve -> RECONCILED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 200", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 10, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 0 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/employers"
              payload: { name: "Acme Widgets" }
              as: OfficeClerk
              captures: { emp: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", employer_id: "${emp}", full_name: "Comp Carla", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { mem: "$.data.id" }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-05" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-06" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-07" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-08" }, as: SecretaryTreasurer }
            - { call: "POST /api/system/sweeps/delinquency", payload: { local_id: "${loc}" }, as: LocalAdmin }
            - call: "POST /api/remittances"
              payload: { employer_id: "${emp}", local_id: "${loc}", period: "2026-08", remitted_cents: 15000 }
              as: OfficeClerk
              as_user_id: clerk_1
              captures: { rem: "$.data.id" }
            - call: "POST /api/remittances/${rem}/lines"
              payload: { member_id: "${mem}", deducted_cents: 15000, gross_wages_cents: 0 }
              as: OfficeClerk
            - { call: "POST /api/remittances/${rem}/reconcile", payload: {}, as: SecretaryTreasurer, as_user_id: st_1 }
            - { call: "POST /api/remittances/${rem}/resolve-dispute", payload: { resolution_note: "accept over-deduction" }, as: SecretaryTreasurer }
            - call: "GET /api/members/${mem}"
              as: SecretaryTreasurer
              captures: { pre_arrears: "$.data.arrears_cents", pre_status: "$.data.status", pre_credit: "$.data.credit_balance_cents" }
          trigger:
            - { call: "POST /api/remittances/${rem}/post", payload: {}, as: SecretaryTreasurer, as_user_id: st_1 }
            - call: "GET /api/members/${mem}"
              as: SecretaryTreasurer
              captures: { mid_arrears: "$.data.arrears_cents", mid_status: "$.data.status" }
            - call: "GET /api/members/${mem}/ledger"
              as: SecretaryTreasurer
              captures: { post_entry_type: "$.data[4].entry_type", post_entry_amt: "$.data[4].amount_cents" }
            - { call: "POST /api/remittances/${rem}/void", payload: {}, as: LocalAdmin, as_user_id: admin_1 }
            - call: "GET /api/members/${mem}"
              as: SecretaryTreasurer
              captures: { post_arrears: "$.data.arrears_cents", post_status: "$.data.status", post_credit: "$.data.credit_balance_cents" }
            - call: "GET /api/members/${mem}/ledger"
              as: SecretaryTreasurer
              captures: { void_entry_type: "$.data[5].entry_type", void_entry_amt: "$.data[5].amount_cents" }
          assert:
            - "pre-post baseline: ${pre_arrears} == 20000, ${pre_credit} == 0, ${pre_status} == DELINQUENT"
            - "forward action: ${mid_arrears} == 5000 and ${mid_status} == ACTIVE (auto-cured); ledger[4] is ${post_entry_type} == CHECKOFF_CREDIT of ${post_entry_amt} == -15000"
            - "compensating action restores the conserved money quantity: ${post_arrears} == 20000 == ${pre_arrears}, ${post_credit} == 0, ${post_status} == DELINQUENT (cure reverted via auto_cured_member_ids)"
            - "ledger[5] is ${void_entry_type} == VOID_REVERSAL of ${void_entry_amt} == 15000; signed ledger sum is 20000 both before the post and after the void"

      - name: transfer_roundtrip_conserves_percapita_headcount
        grounds: [calculations.per_capita_tax, state_machines.MemberTransfer.ACCEPTED_BY_TARGET_to_COMPLETED, entities.PerCapitaReport.fields.member_count]
        distinguishing_aspect: |
          Conserved quantity = HEADCOUNT (not money): the sum of the two locals'
          per-capita member_count for period 2026-08. A completed transfer moves one
          member (effective_period == report period counts at the TARGET), and the
          reverse completed transfer restores each local's original count; the
