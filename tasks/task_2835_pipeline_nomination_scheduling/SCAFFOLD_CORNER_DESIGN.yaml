      - name: maintenance_complete_returns_segment_to_operational
        claim_type: Side Effect Execution
        grounds:
          - state_machines.MaintenanceEvent.PLANNED_to_NOTIFIED
          - state_machines.MaintenanceEvent.NOTIFIED_to_ACTIVE
          - state_machines.MaintenanceEvent.ACTIVE_to_COMPLETED
          - entities.PipelineSegment.fields.operational_status
          - calculations.shipper_notification_scope
        distinguishing_aspect: |
          The full maintenance lifecycle drives the segment's derived pair: notify sets derate_pct
          to 0.30 and operational_status to DERATED with notified_at stamped from the logical clock,
          start keeps them (0.30 is not 1, so never SHUT), and complete returns derate_pct to 0 and
          operational_status to OPERATIONAL because no NOTIFIED or ACTIVE event remains. With no
          cycle in a notifiable status, notified_shipper_count is 0.
        test_recipe:
          setup:
            - "Segment HOU-NAS exists with no nomination cycle at all; the logical clock reads 2026-08-01T00:00:00Z and a PLANNED pigging event covers 2026-09-10 to 2026-09-12 at a 0.30 derate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PipelineScheduler
            - call: "POST /pipeline/terminals"
              payload: { terminal_code: "HOU", name: "Houston Origin", role_kind: "ORIGIN", shell_capacity_bbl: 500000, min_operating_inventory_bbl: 10000, injection_bays: 2 }
              as: TariffAdministrator
              captures: { org_id: "$.data.id" }
            - call: "POST /pipeline/terminals"
              payload: { terminal_code: "NAS", name: "Nashville Delivery", role_kind: "DESTINATION", shell_capacity_bbl: 400000, min_operating_inventory_bbl: 5000 }
              as: TariffAdministrator
              captures: { dst_id: "$.data.id" }
            - call: "POST /pipeline/product-grades"
              payload: { grade_code: "ULSD", name: "Ultra Low Sulfur Diesel", sequence_rank: 3, max_sulfur_ppm: 15, max_rvp_psi: 12 }
              as: TariffAdministrator
              captures: { ulsd_id: "$.data.id" }
            - call: "POST /pipeline/segments"
              payload: { segment_code: "HOU-NAS", origin_terminal_id: "${org_id}", destination_terminal_id: "${dst_id}", linefill_grade_id: "${ulsd_id}", capacity_bbl_per_cycle: 101000, transmix_reserve_bbl: 1000, transmix_cut_bbl: 250, min_tender_bbl: 6000, linefill_requirement_bbl: 20000, proration_policy: "HISTORY_WEIGHTED" }
              as: TariffAdministrator
              captures: { seg_id: "$.data.id" }
            - call: "POST /pipeline/maintenance-events"
              payload: { segment_id: "${seg_id}", kind: "PIGGING", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-12T00:00:00Z", capacity_derate_pct: 0.30, notes: "scheduled cleaning pig run" }
              as: PipelineScheduler
              captures: { evt_id: "$.data.id" }
          trigger:
            - call: "POST /pipeline/maintenance-events/${evt_id}/notify"
              payload: {}
              as: PipelineScheduler
            - call: "POST /pipeline/maintenance-events/${evt_id}/start"
              payload: {}
              as: PipelineScheduler
            - call: "POST /pipeline/maintenance-events/${evt_id}/complete"
              payload: {}
              as: PipelineScheduler
          assert:
            - "HTTP 200 on all three transitions"
            - "after notify: MaintenanceEvent.${evt_id}.status == NOTIFIED, notified_at == 2026-08-01T00:00:00.000Z, notified_shipper_count == 0"
            - "after notify: PipelineSegment.${seg_id}.derate_pct == 0.30 and PipelineSegment.${seg_id}.operational_status == DERATED"
            - "after start: MaintenanceEvent.${evt_id}.status == ACTIVE and PipelineSegment.${seg_id}.operational_status == DERATED"
            - "after complete: MaintenanceEvent.${evt_id}.status == COMPLETED"
            - "after complete: PipelineSegment.${seg_id}.derate_pct == 0 and PipelineSegment.${seg_id}.operational_status == OPERATIONAL"

