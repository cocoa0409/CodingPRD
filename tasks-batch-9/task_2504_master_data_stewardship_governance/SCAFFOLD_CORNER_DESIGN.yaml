            - "${dom_v2} == 2 - the assignment write advanced the anchor the client was holding"
            - "third trigger -> HTTP 201 with ${reg_role} == AUTHORITATIVE and ${reg_status} == ACTIVE"
            - "${dom_v3} == 3 - the accepted registration incremented the version again, so a replay of the same body would now be stale in its turn"
