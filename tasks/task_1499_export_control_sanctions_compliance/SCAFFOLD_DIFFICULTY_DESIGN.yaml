        distinguishing_aspect: |
          Category pair (state, business_safety): a PLANNED shipment (state violation) whose
          party is BLOCKED (safety violation) fails with ERR_INVALID_STATE because priority 6
          precedes priority 7 — the safety error must NOT leak first.
