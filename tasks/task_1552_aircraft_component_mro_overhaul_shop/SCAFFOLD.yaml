  - { method: POST, path: "/mro/warranty-claims/{claimId}/review", description: "Accept (spawns rework cascade) or deny", roles: [ShopManager], code: 200, input: [decision, "denial_reason?"], output: WarrantyClaim, side_effects: ["ACCEPT: credit computed; rework WO created (REPAIR_IN_PROGRESS); unit IN_SHOP/UNSERVICEABLE; trace WARRANTY_INDUCT | DENY: -> DENIED"] }

