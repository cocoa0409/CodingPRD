              as: TechnicalServiceEngineer
              captures: { sys_id: "$.data.id" }
            - call: "POST /coating/coating-systems"
              payload: { system_code: "CMP-ALT-300", manufacturer_name: "Competitor Coatings", is_competitor_system: true, surface_prep_standard: SSPC_SP10_NEAR_WHITE, min_surface_profile_mils: 2.0, max_surface_profile_mils: 4.0, coat_count: 1, total_dft_min_mils: 8.0, total_dft_max_mils: 16.0, base_voc_gpl: 320, thinner_voc_gpl: 250, adhesion_min_psi: 500, max_thinner_pct: 0.10 }
              as: TechnicalServiceEngineer
              captures: { comp_id: "$.data.id" }
            - call: "POST /coating/projects"
              payload: { project_name: "Depot Roof", owner_name: "City Works", jurisdiction_code: "US-FED", asset_type: STRUCTURAL_STEEL, warranty_budget_cents: 1000000 }
              as: ProjectEngineer
              captures: { proj_id: "$.data.id", proj_v: "$.data.version" }
            - call: "POST /coating/projects/${proj_id}/specifications"
              payload: { coating_system_id: "${sys_id}", application_method: SPRAY_AIRLESS }
              as: ProjectEngineer
              captures: { spec_id: "$.data.id" }
            - call: "POST /coating/projects/${proj_id}/specifications/${spec_id}/issue"
              payload: { expected_project_version: "${proj_v}" }
              as: ProjectEngineer
            - call: "POST /coating/specifications/${spec_id}/substitution-requests"
              payload: { proposed_coating_system_id: "${comp_id}", rationale: "lead-time advantage", max_review_rounds: 3 }
              as: OwnerRepresentative
              captures: { sr_id: "$.data.id" }
          trigger:
            - call: "POST /coating/specifications/${spec_id}/substitution-requests/${sr_id}/start-review"
              as: TechnicalServiceEngineer
            - call: "GET /coating/substitution-requests/${sr_id}"
              as: PlatformAdmin
            - call: "POST /coating/specifications/${spec_id}/substitution-requests/${sr_id}/request-info"
              as: TechnicalServiceEngineer
            - call: "GET /coating/substitution-requests/${sr_id}"
              as: PlatformAdmin
            - call: "POST /coating/specifications/${spec_id}/substitution-requests/${sr_id}/resubmit"
              payload: { rationale: "added freight quote" }
              as: OwnerRepresentative
            - call: "GET /coating/substitution-requests/${sr_id}"
              as: PlatformAdmin
            - call: "POST /coating/specifications/${spec_id}/substitution-requests/${sr_id}/start-review"
              as: TechnicalServiceEngineer
            - call: "POST /coating/specifications/${spec_id}/substitution-requests/${sr_id}/decide"
              payload: { decision: "REJECT", decision_reason: "house system retained" }
              as: TechnicalServiceEngineer
            - call: "GET /coating/substitution-requests/${sr_id}"
              as: PlatformAdmin
          assert:
            - "SubstitutionRequest.${sr_id}.status == UNDER_REVIEW with review_round == 1 after the first start-review"
            - "SubstitutionRequest.${sr_id}.status == MORE_INFO_REQUESTED with review_round == 1 after request-info (the round is not consumed until resubmit)"
            - "SubstitutionRequest.${sr_id}.status == SUBMITTED with review_round == 2 after resubmit (cycle re-entry with increment)"
            - "SubstitutionRequest.${sr_id}.status == REJECTED with review_round == 2 after the second UNDER_REVIEW lap is decided REJECT"

