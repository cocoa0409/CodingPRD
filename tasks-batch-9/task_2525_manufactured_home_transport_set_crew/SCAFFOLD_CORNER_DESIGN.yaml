      # NOTE (role_model: segregation_of_duties): the X-User-ID-level SoD rule
      # (Site.last_inspector_user_id may not sign the final inspection) is proved by
      # the errors-section instance final_inspection_gate_ladder_sod_anchor_scope_then_crossover,
      # which peels ERR_SEGREGATION_OF_DUTIES off the same call before the anchoring,
      # scope-split and crossover gates.
      - name: auth_ladder_401_then_403_then_400_then_404_then_body_fk
        claim_type: role_permission_matrix
        grounds:
          - validations[priority 1]
          - validations[priority 2]
          - validations[priority 3]
          - validations[priority 4]
          - validations[priority 5]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          One request is made progressively less broken to walk the whole §1.4
          preamble ladder in order: missing headers -> 401, wrong role -> 403,
          malformed body -> 400, unresolvable path id -> 404, unresolvable body FK ->
          404 of the REFERENCED entity, then success. The two sharp inversions are
          that schema (priority 3) outranks path existence (priority 4) - a malformed
          body on a non-existent id returns ERR_INVALID_REQUEST, not NOT_FOUND - and
          that body FKs resolve left-to-right, so a route leg naming both a
          non-existent permit and a non-existent hauler returns ERR_PERMIT_NOT_FOUND.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one AZ plant and a one-section AZ order whose floor is measured and released"
            - "no hauler, permit or leg exists yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /installations/plants"
              payload: { name: "Champion Chandler", state_code: "AZ", hud_plant_code: "AZ-019" }
              as: NetworkAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Valley Homes", home_model: "Titan 1668", section_count: 1, destination_state: "AZ", wind_zone: "I" }
              as: NetworkAdmin
              captures: { order_id: $.data.id }
            - call: "POST /installations/sections"
              payload: { order_id: "${order_id}", section_index: 1, declared_width_in: 168, declared_height_in: 150, declared_length_in: 744, declared_weight_lb: 23000 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { sec_id: $.data.id }
            - call: "POST /installations/sections/${sec_id}/measure"
              payload: { measured_width_in: 168, measured_height_in: 150 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
            - call: "POST /installations/sections/${sec_id}/release"
              payload: {}
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { sec_v: $.data.version }
          trigger:
            - call: "POST /installations/sections/00000000-0000-0000-0000-000000000000/measure"
              payload: { measured_width_in: 168, measured_height_in: 150 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
            - call: "POST /installations/permits"
              payload: { section_id: "00000000-0000-0000-0000-000000000000", state_code: "AZ", planned_leg_count: 1, expected_section_version: "${sec_v}", night_move: false }
              as: PermitDesk
            - call: "POST /installations/permits"
              payload: { section_id: "${sec_id}", state_code: "AZ", planned_leg_count: 1, expected_section_version: "${sec_v}", night_move: false }
              as: PermitDesk
              captures: { permit_id: $.data.id }
            - call: "POST /installations/route-legs"
              payload: { permit_id: "00000000-0000-0000-0000-000000000000", hauler_id: "00000000-0000-0000-0000-000000000001", sequence_no: 1, corridor_id: "AZ-I10", state_code: "AZ", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T12:00:00Z" }
              as: PermitDesk
            - call: "POST /installations/route-legs"
              payload: { permit_id: "${permit_id}", hauler_id: "00000000-0000-0000-0000-000000000001", sequence_no: 1, corridor_id: "AZ-I10", state_code: "AZ", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T12:00:00Z" }
              as: PermitDesk
          assert:
            - "probe (priority 1): the trigger step 1 request sent with NO X-User-ID and NO X-User-Role returns HTTP 401 ERR_UNAUTHENTICATED, before any body parsing or path lookup"
            - "probe (priority 1): the same request with X-User-Role present but X-User-ID empty also returns HTTP 401 ERR_UNAUTHENTICATED"
            - "probe (priority 2): the trigger step 1 request sent with X-User-Role TransportManager returns HTTP 403 ERR_UNAUTHORIZED, even though the path id does not exist"
            - "probe (priority 3): the trigger step 1 request with measured_height_in omitted from the body returns HTTP 400 ERR_INVALID_REQUEST - schema at priority 3 outranks the non-existent path id at priority 4, so the 404 is never reached"
            - "trigger step 1 returns HTTP 404 with error_id ERR_SECTION_NOT_FOUND (well-formed body, unresolvable path id)"
            - "trigger step 2 returns HTTP 404 with error_id ERR_SECTION_NOT_FOUND (body FK, priority 5)"
            - "trigger step 3 returns HTTP 201 with data.status == REQUESTED"
            - "trigger step 4 returns HTTP 404 with error_id ERR_PERMIT_NOT_FOUND, not ERR_HAULER_NOT_FOUND - body FKs resolve left-to-right in request_body order and permit_id is declared first"
            - "trigger step 5 returns HTTP 404 with error_id ERR_HAULER_NOT_FOUND once the permit id is valid"
            - "no RouteLeg row was created by any of the failing steps"

      - name: claims_triangle_role_asymmetry_adjuster_cannot_dispute
        claim_type: peer_role_isolation
        grounds:
          - roles[ClaimsAdjuster]
          - roles[PlantDispatcher]
          - roles[TransportManager]
          - roles[SetCrewLead]
          - endpoints[POST /installations/damage-claims/{id}/dispute]
          - endpoints[POST /installations/damage-claims/{id}/adjudicate]
          - calculations.damage_claim_allocation
          - calculations.party_chargeback_ledger
        distinguishing_aspect: |
          The claim workflow splits the four claim roles in two directions at once:
          the three named parties may open and dispute a claim but may never
          review/adjudicate/reverse it, while ClaimsAdjuster may do all three of
          those and is the single role barred from dispute. The dispute also
          re-scores evidence points, so the SAME claim adjudicated on the EVIDENCE
          basis after the dispute splits 1/3/0 into PLANT 22500 / HAULER 67500 /
          INSTALLER 0 out of an approved 90000 - proving the disputing party's own
          re-score feeds the allocation that charges it.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one AZ plant, one ACTIVE AZ hauler, one licensed SetCrew, a one-section AZ order and its declared floor"
            - "a non-blocking claim of 100000 cents opened by the plant with points 1/1/0 and taken UNDER_REVIEW by the adjuster"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /installations/plants"
              payload: { name: "Champion Chandler", state_code: "AZ", hud_plant_code: "AZ-020" }
              as: NetworkAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /installations/haulers"
              payload: { name: "Desert Toter", dot_number: "DOT-771009", insurance_expiry_date: "2027-01-31", endorsed_states: ["AZ"] }
              as: NetworkAdmin
              captures: { hauler_id: $.data.id }
            - call: "POST /installations/set-crews"
              payload: { company_name: "Sonoran Set", hud_installer_license_no: "AZ-INST-93", license_state: "AZ", license_expiry_date: "2027-06-30", daily_capacity: 1 }
              as: NetworkAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Valley Homes", home_model: "Titan 1668", section_count: 1, destination_state: "AZ", wind_zone: "I" }
              as: NetworkAdmin
              captures: { order_id: $.data.id }
            - call: "POST /installations/sections"
              payload: { order_id: "${order_id}", section_index: 1, declared_width_in: 168, declared_height_in: 150, declared_length_in: 744, declared_weight_lb: 23000 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { sec_id: $.data.id }
            - call: "POST /installations/damage-claims"
              payload: { order_id: "${order_id}", section_id: "${sec_id}", hauler_id: "${hauler_id}", set_crew_id: "${crew_id}", discovered_stage: "PLANT_QC", claimed_amount_cents: 100000, blocks_set: false, plant_evidence_points: 1, hauler_evidence_points: 1, installer_evidence_points: 0 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
