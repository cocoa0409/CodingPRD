            - "the incumbent AccountMapping.${map_inc_id} is untouched: mapping_status == PROPOSED, effective_until == 2026-05-31T23:59:59.999Z, counter_round == 0"
            - "the second trigger call succeeds with AccountMapping.${map_ok_id}.mapping_status == PROPOSED and effective_from == 2026-06-15T00:00:00.000Z"
