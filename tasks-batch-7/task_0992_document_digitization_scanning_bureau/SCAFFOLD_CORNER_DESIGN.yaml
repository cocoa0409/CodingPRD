      - name: list_batches_pagination_defaults_and_envelope
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "Omitting pagination params applies limit=10/offset=0; the array response carries total_count and has_more inside the fixed envelope with meta.api_request_id present."
        test_recipe:
          setup: ["client + agreement + 2 batches"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Page Co", hipaa_covered: false }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /clients/${cid}/service-agreements", payload: { price_tier: "STANDARD", rush_multiplier: 1.75, storage_free_days: 10, storage_daily_rate_cents: 55, retention_days: 30, max_boxes_per_batch: 5 }, as: PlatformAdmin }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1" }
            - { call: "POST /batches", payload: { client_id: "${cid}", priority: "STANDARD" }, as: IntakeClerk, as_user_id: "clerk-1" }
          trigger:
            - { call: "GET /clients/${cid}/batches", payload: {}, as: IntakeClerk, as_user_id: "clerk-1" }
          assert:
            - "response_type == array; data length == 2; total_count == 2; has_more == false; limit == 10; offset == 0"
            - "meta.api_request_id is present and non-empty"

