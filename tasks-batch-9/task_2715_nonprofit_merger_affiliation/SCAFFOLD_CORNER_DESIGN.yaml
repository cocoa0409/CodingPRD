      - name: the_logical_clock_refuses_to_move_backwards
        claim_type: temporal_validation
        grounds:
          - validations.priority_51_ERR_CLOCK_NOT_MONOTONIC
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: |
          The clock is monotonic with an INCLUSIVE re-set: advancing to 2026-09-01 then
          asking for 2026-08-15 is refused, while asking for 2026-09-01 again is
          accepted and simply reports the same value as previous_utc. The first response
          also proves the mandated startup default - previous_utc must read exactly
          2026-08-01T00:00:00.000Z rather than a wall-clock instant - and every timestamp
          comes back with exactly three fractional digits.
        test_recipe:
          setup:
            - "A freshly started server whose logical clock is at its default 2026-08-01T00:00:00Z"
          setup_api_calls: []
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { e_clock: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "the first call returns HTTP status 200 with current_utc 2026-09-01T00:00:00.000Z and previous_utc 2026-08-01T00:00:00.000Z"
            - "the second call returns HTTP status 422 with error ERR_CLOCK_NOT_MONOTONIC"
            - "the third call returns HTTP status 200 with current_utc 2026-09-01T00:00:00.000Z and previous_utc 2026-09-01T00:00:00.000Z, because the comparison is >= and not >"

