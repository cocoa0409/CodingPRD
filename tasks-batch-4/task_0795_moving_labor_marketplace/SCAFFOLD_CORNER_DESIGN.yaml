# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of §1.1–§1.7 claims not in §1.8)
# Empty-DB start every instance; clocks default to 2026-03-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  - section: endpoints
    instances:
      - name: job_create_returns_201_with_fields
        claim_type: creation
        grounds: [endpoints, entities.Job.fields.status]
        distinguishing_aspect: "POST /jobs with all required fields returns 201 and a Job in DRAFT with a server-minted id and version 1."
        test_recipe:
          setup: ["A RateCard (MOVE), an InsurancePolicy, and a Customer exist."]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { name: "RC-MOVE", job_type: "MOVE", base_hourly_rate_cents: 6000, min_billable_hours: 2.0, crew_surcharge_pct: 0.10, peak_surge_multiplier: 1.25, truck_fee_cents: 8000 }, as: Admin, captures: { rc: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { name: "IP-BASIC", tier: "BASIC", coverage_cap_cents: 200000, deductible_cents: 10000, coverage_pct: 1.0 }, as: Admin, captures: { pol: "$.data.id" } }
            - { call: "POST /customers", payload: { display_name: "Cust", email: "c@x.com" }, as: Admin, captures: { cust: "$.data.id" } }
          trigger:
            - { call: "POST /jobs", payload: { rate_card_id: "${rc}", insurance_policy_id: "${pol}", job_type: "MOVE", crew_size: 2, estimated_hours: 3.0, window_start: "2026-03-11T09:00:00Z", window_end: "2026-03-11T12:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { job: "$.data.id" } }
          assert:
            - "http_status == 201"
            - "Job.${job}.status == DRAFT"
            - "Job.${job}.version == 1"
            - "Job.${job}.customer_id == ${cust}"

      - name: assign_truck_sets_truck_id
        claim_type: side_effect
        grounds: [endpoints, entities.Job.fields.truck_id]
        distinguishing_aspect: "POST /jobs/{id}/assign-truck on a BOOKED truck-required job sets Job.truck_id to the assigned truck."
        test_recipe:
          setup: ["A truck-required Job is BOOKED, and a Truck exists (no colliding bookings)."]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { name: "RC-MOVE", job_type: "MOVE", base_hourly_rate_cents: 6000, min_billable_hours: 2.0, crew_surcharge_pct: 0.10, peak_surge_multiplier: 1.25, truck_fee_cents: 8000 }, as: Admin, captures: { rc: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { name: "IP-BASIC", tier: "BASIC", coverage_cap_cents: 200000, deductible_cents: 10000, coverage_pct: 1.0 }, as: Admin, captures: { pol: "$.data.id" } }
            - { call: "POST /customers", payload: { display_name: "Cust", email: "c@x.com" }, as: Admin, captures: { cust: "$.data.id" } }
            - { call: "POST /trucks", payload: { name: "TK", capacity_cuft: 800, daily_rate_cents: 20000 }, as: Admin, captures: { tk: "$.data.id" } }
            - { call: "POST /jobs", payload: { rate_card_id: "${rc}", insurance_policy_id: "${pol}", job_type: "MOVE", crew_size: 1, estimated_hours: 2.0, window_start: "2026-03-12T09:00:00Z", window_end: "2026-03-12T11:00:00Z", truck_required: true }, as: Customer, as_user_id: "${cust}", captures: { job: "$.data.id" } }
            - { call: "POST /jobs/${job}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { q: "$.data.id" } }
            - { call: "GET /jobs/${job}", payload: {}, as: Customer, as_user_id: "${cust}", captures: { jv: "$.data.version" } }
            - { call: "POST /jobs/${job}/book", payload: { quote_id: "${q}", expected_job_version: "${jv}" }, as: Customer, as_user_id: "${cust}" }
          trigger:
            - { call: "POST /jobs/${job}/assign-truck", payload: { truck_id: "${tk}" }, as: Dispatcher }
          assert:
            - "Job.${job}.truck_id == ${tk}"

      - name: list_jobs_pagination_envelope
        claim_type: listing
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /jobs?customer_id filtered with limit 1 over 2 jobs returns a 1-item array plus total_count 2 and has_more true."
        test_recipe:
          setup: ["A Customer with two DRAFT jobs."]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { name: "RC-MOVE", job_type: "MOVE", base_hourly_rate_cents: 6000, min_billable_hours: 2.0, crew_surcharge_pct: 0.10, peak_surge_multiplier: 1.25, truck_fee_cents: 8000 }, as: Admin, captures: { rc: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { name: "IP-BASIC", tier: "BASIC", coverage_cap_cents: 200000, deductible_cents: 10000, coverage_pct: 1.0 }, as: Admin, captures: { pol: "$.data.id" } }
            - { call: "POST /customers", payload: { display_name: "Cust", email: "c@x.com" }, as: Admin, captures: { cust: "$.data.id" } }
            - { call: "POST /jobs", payload: { rate_card_id: "${rc}", insurance_policy_id: "${pol}", job_type: "MOVE", crew_size: 1, estimated_hours: 2.0, window_start: "2026-03-11T09:00:00Z", window_end: "2026-03-11T11:00:00Z" }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /jobs", payload: { rate_card_id: "${rc}", insurance_policy_id: "${pol}", job_type: "MOVE", crew_size: 1, estimated_hours: 2.0, window_start: "2026-03-12T09:00:00Z", window_end: "2026-03-12T11:00:00Z" }, as: Customer, as_user_id: "${cust}" }
          trigger:
            - { call: "GET /jobs", payload: { customer_id: "${cust}", limit: 1 }, as: Customer, as_user_id: "${cust}" }
          assert:
            - "response.meta has api_request_id and api_request_timestamp"
            - "response.response_type == array"
            - "len(response.data) == 1"
            - "response.total_count == 2"
            - "response.has_more == true"

  - section: entities
    instances:
      - name: get_nonexistent_job_returns_not_found
        claim_type: not_found
        grounds: [entities.Job, 'errors[ERR_NOT_FOUND]']
        distinguishing_aspect: "GET /jobs/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /jobs/00000000-0000-4000-8000-000000000000", payload: {}, as: Admin, captures: { err: "$.data.error_id" } }
          assert:
            - "http_status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: job_create_missing_required_returns_invalid_request
        claim_type: required_field
        grounds: [entities.Job.fields.rate_card_id, 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "POST /jobs omitting rate_card_id returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["An InsurancePolicy and a Customer exist (rate card intentionally omitted from the body)."]
          setup_api_calls:
            - { call: "POST /insurance-policies", payload: { name: "IP-BASIC", tier: "BASIC", coverage_cap_cents: 200000, deductible_cents: 10000, coverage_pct: 1.0 }, as: Admin, captures: { pol: "$.data.id" } }
            - { call: "POST /customers", payload: { display_name: "Cust", email: "c@x.com" }, as: Admin, captures: { cust: "$.data.id" } }
          trigger:
            - { call: "POST /jobs", payload: { insurance_policy_id: "${pol}", job_type: "MOVE", crew_size: 1, estimated_hours: 2.0, window_start: "2026-03-11T09:00:00Z", window_end: "2026-03-11T11:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { err: "$.data.error_id" } }
          assert:
            - "http_status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: job_create_type_mismatch_rejected
        claim_type: type_constraint
        grounds: ['validations[priority=5]', 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "POST /jobs with job_type LOAD but a MOVE rate card violates job_type == rate_card.job_type and returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A MOVE RateCard, an InsurancePolicy, and a Customer exist."]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { name: "RC-MOVE", job_type: "MOVE", base_hourly_rate_cents: 6000, min_billable_hours: 2.0, crew_surcharge_pct: 0.10, peak_surge_multiplier: 1.25, truck_fee_cents: 8000 }, as: Admin, captures: { rc: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { name: "IP-BASIC", tier: "BASIC", coverage_cap_cents: 200000, deductible_cents: 10000, coverage_pct: 1.0 }, as: Admin, captures: { pol: "$.data.id" } }
            - { call: "POST /customers", payload: { display_name: "Cust", email: "c@x.com" }, as: Admin, captures: { cust: "$.data.id" } }
          trigger:
            - { call: "POST /jobs", payload: { rate_card_id: "${rc}", insurance_policy_id: "${pol}", job_type: "LOAD", crew_size: 1, estimated_hours: 2.0, window_start: "2026-03-11T09:00:00Z", window_end: "2026-03-11T11:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"

  - section: state_machines
    instances:
      - name: book_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Job.QUOTED_to_BOOKED, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "POST /jobs/{id}/book on a DRAFT (never quoted) job returns ERR_INVALID_STATE; booking is only valid from QUOTED."
        test_recipe:
          setup: ["A DRAFT Job that has never been quoted."]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { name: "RC-MOVE", job_type: "MOVE", base_hourly_rate_cents: 6000, min_billable_hours: 2.0, crew_surcharge_pct: 0.10, peak_surge_multiplier: 1.25, truck_fee_cents: 8000 }, as: Admin, captures: { rc: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { name: "IP-BASIC", tier: "BASIC", coverage_cap_cents: 200000, deductible_cents: 10000, coverage_pct: 1.0 }, as: Admin, captures: { pol: "$.data.id" } }
            - { call: "POST /customers", payload: { display_name: "Cust", email: "c@x.com" }, as: Admin, captures: { cust: "$.data.id" } }
            - { call: "POST /jobs", payload: { rate_card_id: "${rc}", insurance_policy_id: "${pol}", job_type: "MOVE", crew_size: 1, estimated_hours: 2.0, window_start: "2026-03-11T09:00:00Z", window_end: "2026-03-11T11:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { job: "$.data.id" } }
            - { call: "GET /jobs/${job}", payload: {}, as: Customer, as_user_id: "${cust}", captures: { jv: "$.data.version" } }
          trigger:
            - { call: "POST /jobs/${job}/book", payload: { quote_id: "00000000-0000-4000-8000-000000000001", expected_job_version: "${jv}" }, as: Customer, as_user_id: "${cust}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Job.${job}.status == DRAFT"

      - name: cancel_a_cancelled_job_returns_invalid_state
        claim_type: terminal_state
        grounds: [state_machines.Job.BOOKED_to_CANCELLED, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "A second POST /jobs/{id}/cancel on an already CANCELLED (terminal) job returns ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["A QUOTED Job that has been cancelled (status CANCELLED)."]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { name: "RC-MOVE", job_type: "MOVE", base_hourly_rate_cents: 6000, min_billable_hours: 2.0, crew_surcharge_pct: 0.10, peak_surge_multiplier: 1.25, truck_fee_cents: 8000 }, as: Admin, captures: { rc: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { name: "IP-BASIC", tier: "BASIC", coverage_cap_cents: 200000, deductible_cents: 10000, coverage_pct: 1.0 }, as: Admin, captures: { pol: "$.data.id" } }
            - { call: "POST /customers", payload: { display_name: "Cust", email: "c@x.com" }, as: Admin, captures: { cust: "$.data.id" } }
            - { call: "POST /jobs", payload: { rate_card_id: "${rc}", insurance_policy_id: "${pol}", job_type: "MOVE", crew_size: 1, estimated_hours: 2.0, window_start: "2026-03-11T09:00:00Z", window_end: "2026-03-11T11:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { job: "$.data.id" } }
            - { call: "POST /jobs/${job}/quote", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /jobs/${job}/cancel", payload: {}, as: Customer, as_user_id: "${cust}" }
          trigger:
            - { call: "POST /jobs/${job}/cancel", payload: {}, as: Customer, as_user_id: "${cust}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Job.${job}.status == CANCELLED"

      - name: complete_without_start_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Job.IN_PROGRESS_to_COMPLETED, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "POST /jobs/{id}/complete on a BOOKED (not IN_PROGRESS) job returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A BOOKED Job that has not been started."]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { name: "RC-MOVE", job_type: "MOVE", base_hourly_rate_cents: 6000, min_billable_hours: 2.0, crew_surcharge_pct: 0.10, peak_surge_multiplier: 1.25, truck_fee_cents: 8000 }, as: Admin, captures: { rc: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { name: "IP-BASIC", tier: "BASIC", coverage_cap_cents: 200000, deductible_cents: 10000, coverage_pct: 1.0 }, as: Admin, captures: { pol: "$.data.id" } }
            - { call: "POST /customers", payload: { display_name: "Cust", email: "c@x.com" }, as: Admin, captures: { cust: "$.data.id" } }
            - { call: "POST /jobs", payload: { rate_card_id: "${rc}", insurance_policy_id: "${pol}", job_type: "MOVE", crew_size: 1, estimated_hours: 2.0, window_start: "2026-03-11T09:00:00Z", window_end: "2026-03-11T11:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { job: "$.data.id" } }
            - { call: "POST /jobs/${job}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { q: "$.data.id" } }
            - { call: "GET /jobs/${job}", payload: {}, as: Customer, as_user_id: "${cust}", captures: { jv: "$.data.version" } }
            - { call: "POST /jobs/${job}/book", payload: { quote_id: "${q}", expected_job_version: "${jv}" }, as: Customer, as_user_id: "${cust}" }
          trigger:
            - { call: "POST /jobs/${job}/complete", payload: { actual_hours: 2.0 }, as: Dispatcher, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: claim_deny_path
        claim_type: valid_transition
        grounds: [state_machines.Claim.UNDER_REVIEW_to_DENIED, entities.Claim.fields.status]
        distinguishing_aspect: "POST /claims/{id}/deny on an UNDER_REVIEW claim moves it to DENIED with no wallet credit."
        test_recipe:
          setup: ["A Claim filed on a BOOKED job and moved to UNDER_REVIEW."]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { name: "RC-MOVE", job_type: "MOVE", base_hourly_rate_cents: 6000, min_billable_hours: 2.0, crew_surcharge_pct: 0.10, peak_surge_multiplier: 1.25, truck_fee_cents: 8000 }, as: Admin, captures: { rc: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { name: "IP-BASIC", tier: "BASIC", coverage_cap_cents: 200000, deductible_cents: 10000, coverage_pct: 1.0 }, as: Admin, captures: { pol: "$.data.id" } }
            - { call: "POST /customers", payload: { display_name: "Cust", email: "c@x.com" }, as: Admin, captures: { cust: "$.data.id" } }
            - { call: "POST /jobs", payload: { rate_card_id: "${rc}", insurance_policy_id: "${pol}", job_type: "MOVE", crew_size: 1, estimated_hours: 3.0, window_start: "2026-03-11T09:00:00Z", window_end: "2026-03-11T12:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { job: "$.data.id" } }
            - { call: "POST /jobs/${job}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { q: "$.data.id" } }
            - { call: "GET /jobs/${job}", payload: {}, as: Customer, as_user_id: "${cust}", captures: { jv: "$.data.version" } }
            - { call: "POST /jobs/${job}/book", payload: { quote_id: "${q}", expected_job_version: "${jv}" }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /claims", payload: { job_id: "${job}", damage_description: "minor", claimed_amount_cents: 50000 }, as: Customer, as_user_id: "${cust}", captures: { cl: "$.data.id" } }
            - { call: "POST /claims/${cl}/review", payload: {}, as: Admin }
          trigger:
            - { call: "POST /claims/${cl}/deny", payload: {}, as: Admin }
          assert:
            - "Claim.${cl}.status == DENIED"
            - "Customer.${cust}.wallet_credit_cents == 0"

      - name: reschedule_updates_window
        claim_type: valid_transition
        grounds: [state_machines.Job.BOOKED_to_BOOKED, entities.Job.fields.window_start]
        distinguishing_aspect: "POST /jobs/{id}/reschedule on a BOOKED job updates window_start/window_end, keeps status BOOKED, and bumps version."
        test_recipe:
          setup: ["A BOOKED Job (window 2026-03-11T09:00-12:00, version 3 after quote+book)."]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { name: "RC-MOVE", job_type: "MOVE", base_hourly_rate_cents: 6000, min_billable_hours: 2.0, crew_surcharge_pct: 0.10, peak_surge_multiplier: 1.25, truck_fee_cents: 8000 }, as: Admin, captures: { rc: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { name: "IP-BASIC", tier: "BASIC", coverage_cap_cents: 200000, deductible_cents: 10000, coverage_pct: 1.0 }, as: Admin, captures: { pol: "$.data.id" } }
            - { call: "POST /customers", payload: { display_name: "Cust", email: "c@x.com" }, as: Admin, captures: { cust: "$.data.id" } }
            - { call: "POST /jobs", payload: { rate_card_id: "${rc}", insurance_policy_id: "${pol}", job_type: "MOVE", crew_size: 1, estimated_hours: 3.0, window_start: "2026-03-11T09:00:00Z", window_end: "2026-03-11T12:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { job: "$.data.id" } }
            - { call: "POST /jobs/${job}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { q: "$.data.id" } }
            - { call: "GET /jobs/${job}", payload: {}, as: Customer, as_user_id: "${cust}", captures: { jv: "$.data.version" } }
            - { call: "POST /jobs/${job}/book", payload: { quote_id: "${q}", expected_job_version: "${jv}" }, as: Customer, as_user_id: "${cust}" }
          trigger:
            - { call: "POST /jobs/${job}/reschedule", payload: { window_start: "2026-03-15T09:00:00Z", window_end: "2026-03-15T12:00:00Z" }, as: Customer, as_user_id: "${cust}" }
          assert:
            - "Job.${job}.status == BOOKED"
            - "Job.${job}.window_start == 2026-03-15T09:00:00Z"
            - "Job.${job}.version == 4"

      - name: no_show_marks_helper
        claim_type: side_effect
        grounds: [state_machines.Assignment.ASSIGNED_to_NO_SHOW, entities.Helper.fields.no_show_count]
        distinguishing_aspect: "POST /assignments/{id}/no-show moves the assignment to NO_SHOW, increments Helper.no_show_count to 1, and drops active_assignment_count to 0."
        test_recipe:
          setup: ["A BOOKED Job with an APPROVED helper ASSIGNED but not checked in."]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { name: "RC-MOVE", job_type: "MOVE", base_hourly_rate_cents: 6000, min_billable_hours: 2.0, crew_surcharge_pct: 0.10, peak_surge_multiplier: 1.25, truck_fee_cents: 8000 }, as: Admin, captures: { rc: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { name: "IP-BASIC", tier: "BASIC", coverage_cap_cents: 200000, deductible_cents: 10000, coverage_pct: 1.0 }, as: Admin, captures: { pol: "$.data.id" } }
            - { call: "POST /customers", payload: { display_name: "Cust", email: "c@x.com" }, as: Admin, captures: { cust: "$.data.id" } }
            - { call: "POST /helpers", payload: { display_name: "HN", email: "hn@x.com", base_hourly_rate_cents: 4000 }, as: Admin, captures: { hn: "$.data.id" } }
            - { call: "POST /helpers/${hn}/vet", payload: { decision: "APPROVE" }, as: Admin }
            - { call: "POST /jobs", payload: { rate_card_id: "${rc}", insurance_policy_id: "${pol}", job_type: "MOVE", crew_size: 1, estimated_hours: 3.0, window_start: "2026-03-11T09:00:00Z", window_end: "2026-03-11T12:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { job: "$.data.id" } }
            - { call: "POST /jobs/${job}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { q: "$.data.id" } }
            - { call: "GET /jobs/${job}", payload: {}, as: Customer, as_user_id: "${cust}", captures: { jv: "$.data.version" } }
            - { call: "POST /jobs/${job}/book", payload: { quote_id: "${q}", expected_job_version: "${jv}" }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /assignments", payload: { job_id: "${job}", helper_id: "${hn}" }, as: Dispatcher, captures: { asg: "$.data.id" } }
          trigger:
            - { call: "POST /assignments/${asg}/no-show", payload: {}, as: Dispatcher }
          assert:
            - "Assignment.${asg}.status == NO_SHOW"
            - "Helper.${hn}.no_show_count == 1"
            - "Helper.${hn}.active_assignment_count == 0"

  - section: cross_cutting
    instances:
      - name: book_stale_job_version_conflict
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[book-stale-job]', 'errors[ERR_STALE_VERSION]', entities.Job.fields.version]
        distinguishing_aspect: "After re-quoting bumps Job.version from 2 to 3, a POST /jobs/{id}/book carrying the pre-requote expected_job_version (captured as 2) and the new ACTIVE quote is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A Job quoted once (version 2), its version captured, then re-quoted (version 3, new ACTIVE quote)."]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { name: "RC-MOVE", job_type: "MOVE", base_hourly_rate_cents: 6000, min_billable_hours: 2.0, crew_surcharge_pct: 0.10, peak_surge_multiplier: 1.25, truck_fee_cents: 8000 }, as: Admin, captures: { rc: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { name: "IP-BASIC", tier: "BASIC", coverage_cap_cents: 200000, deductible_cents: 10000, coverage_pct: 1.0 }, as: Admin, captures: { pol: "$.data.id" } }
