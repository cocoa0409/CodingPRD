            - { call: "POST /repair-orders/${ro_id}/milestones", payload: { milestone_type: "DELAY_REPORTED", new_estimated_completion_date: "2026-08-18" }, as: RepairShop, as_user_id: "${shop_id}", captures: { ms_id: $.data.id } }
            - { call: "GET /rental-reservations/${res_id}", payload: {}, as: RentalDeskAgent, captures: { res_v: $.data.version } }
            - { call: "POST /extension-requests", payload: { reservation_id: "${res_id}", milestone_id: "${ms_id}", requested_additional_days: 3, expected_reservation_version: "${res_v}" }, as: RentalDeskAgent, captures: { er1: $.data.id } }
          trigger:
            - { call: "POST /extension-requests", payload: { reservation_id: "${res_id}", milestone_id: "${ms_id}", requested_additional_days: 5, expected_reservation_version: "${res_v}" }, as: RentalDeskAgent, captures: { err: $.data.error_id } }
            - { call: "GET /rental-reservations/${res_id}", payload: {}, as: RentalDeskAgent, captures: { res_v2: $.data.version } }
            - { call: "POST /extension-requests", payload: { reservation_id: "${res_id}", milestone_id: "${ms_id}", requested_additional_days: 5, expected_reservation_version: "${res_v2}" }, as: RentalDeskAgent, captures: { er2: $.data.id } }
            - { call: "GET /rental-reservations/${res_id}/extension-requests", payload: {}, as: RentalDeskAgent }
          assert:
            - "Stale arm: error_id == ERR_STALE_VERSION and http status == 412"
            - "Fresh arm: create succeeds 201"
            - "GET /rental-reservations/${res_id}/extension-requests returns total_count == 2: ER1 SUPERSEDED, ER2 SUBMITTED"

      - name: invoice_settle_reconciles_reserve
        claim_type: derived_field_reconciliation
        grounds: [calculations.rental_reserve_reconciliation, state_machines.Invoice.AUTO_APPROVED_to_SETTLED]
        distinguishing_aspect: "Derived-field reconciliation across the estimate-to-actual handoff: return releases the 60000 provisional estimate, and settling the 66800 audited invoice leaves reserve == 53200 and audited_charge_cents == 66800 on the reservation."
