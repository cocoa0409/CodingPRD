  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: burn_ratio_exactly_at_at_risk_threshold_flips_posture
        grounds:
          - calculations.budget_posture
          - entities.Engagement.fields.burn_ratio
          - entities.Sprint.fields.spend_frozen
          - endpoints.POST /time-entries/{id}/review
        distinguishing_aspect: |
          Metric = Engagement.burn_ratio crossing AT_RISK_THRESHOLD (0.90) via POST
          /time-entries/{id}/review. At 8.95h the ratio is 0.895 and posture stays HEALTHY; the
          extra 0.05h lands the ratio on EXACTLY 0.9000 and the inclusive `>=` comparison flips the
          posture to AT_RISK and freezes the sprint. 0.8999 must not trigger; 0.9000 must.
        test_recipe:
          setup:
            - "T&M Engagement ACTIVE, contract_value 2000.00, budget_hours_cap 10, rate 200.00."
            - "One ACTIVE sprint, ticket t1 IN_PROGRESS (assignee eng-001)."
            - "8.95 APPROVED billable hours -> burned_cost 1790.00, burn_ratio 0.895, budget_posture HEALTHY, sprint NOT frozen."
            - "A second SUBMITTED billable entry of 0.05h on a different work_date."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Aperture", billing_email: "ap@aperture.test", country_code: "US" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Aperture Test Chamber", source_channel: "REFERRAL" }
