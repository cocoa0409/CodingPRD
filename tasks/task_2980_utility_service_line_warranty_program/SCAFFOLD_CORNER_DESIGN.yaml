              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /operations/nightly-run"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
            - call: "POST /enrollments/${enrollment_one}/billing-events"
              payload: { event_type: "PREMIUM_PAYMENT", effective_date: "2026-09-10", amount_cents: 2499 }
              as: BillingOps
              as_user_id: "bill-001"
              captures: { collected_one_payment: $.data.premium_collected_cents, billing_one_payment: $.data.billing_status }
            - call: "POST /enrollments/${enrollment_one}/billing-events"
              payload: { event_type: "PREMIUM_PAYMENT", effective_date: "2026-09-10", amount_cents: 2499 }
              as: BillingOps
              as_user_id: "bill-001"
              captures: { collected_two_payments: $.data.premium_collected_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T00:00:00.000Z" }
