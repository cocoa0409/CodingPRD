scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:

      - name: corner_agency_creation_stamps_quota_and_standing_defaults
        claim_type: Creation
        grounds: ["entities.PartnerAgency.fields.quota_used", "entities.PartnerAgency.fields.quota_epoch", "entities.PartnerAgency.fields.standing"]
        distinguishing_aspect: "POST /agencies returns 201 with quota_used 0, quota_epoch 1, standing GOOD, no_show_credits_owed_cents 0 and version 1, none of which the caller may supply."
        test_recipe:
          setup: ["Empty database; the logical clock is pinned to the startup default 2026-08-01T00:00:00Z by an explicit set so the test is independent of wall-clock time."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /agencies"
              payload: { name: "Anchor Street Collective", county: "NORTH", quarterly_voucher_quota: 4 }
              as: PlatformAdmin
              captures: { ag_id: "$.data.id", ver: "$.data.version" }
          assert:
            - "HTTP status of the trigger is 201"
            - "PartnerAgency.${ag_id}.quota_used == 0"
            - "PartnerAgency.${ag_id}.quota_epoch == 1"
            - "PartnerAgency.${ag_id}.standing == GOOD"
            - "PartnerAgency.${ag_id}.no_show_credits_owed_cents == 0"
            - "${ver} == 1"

      - name: corner_client_has_infant_defaults_to_false_when_omitted
        claim_type: Defaults
        grounds: ["entities.Client.fields.has_infant", "entities.Client.fields.status", "entities.Client.fields.no_show_strikes"]
        distinguishing_aspect: "Omitting has_infant yields false, and the computed household fields start at status ACTIVE, bed_bug_status CLEAR, no_show_strikes 0, delivery_ban_until null."
        test_recipe:
          setup: ["One PartnerAgency exists in county CENTRAL."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Brookfield Helpline", county: "CENTRAL", quarterly_voucher_quota: 4 }
              as: PlatformAdmin
              captures: { ag_id: "$.data.id" }
          trigger:
            - call: "POST /clients"
              payload: { agency_id: "${ag_id}", household_size: 3, county: "CENTRAL" }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { cl_id: "$.data.id" }
          assert:
            - "Client.${cl_id}.has_infant == false"
            - "Client.${cl_id}.status == ACTIVE"
            - "Client.${cl_id}.bed_bug_status == CLEAR"
            - "Client.${cl_id}.no_show_strikes == 0"
            - "Client.${cl_id}.delivery_ban_until == null"
            - "Client.${cl_id}.lifetime_vouchers_delivered == 0"

      - name: corner_client_missing_required_household_size_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Client.fields.household_size", "validations[priority=3]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "household_size has source input and no default, so omitting it must return ERR_VALIDATION with HTTP 400 and create nothing."
        test_recipe:
          setup: ["One PartnerAgency exists in county CENTRAL."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Cranfield Neighbors", county: "CENTRAL", quarterly_voucher_quota: 4 }
              as: PlatformAdmin
              captures: { ag_id: "$.data.id" }
          trigger:
            - call: "POST /clients"
              payload: { agency_id: "${ag_id}", county: "CENTRAL" }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_VALIDATION"
            - "HTTP status of the trigger is 400"
            - "GET /clients with agency_id=${ag_id} returns exactly 0 items"

      - name: corner_referral_invalid_urgency_enum_rejected
        claim_type: Type Constraints
        grounds: ["entities.Referral.fields.urgency", "validations[priority=3]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "urgency accepts only ROUTINE, PRIORITY or EMERGENCY; the value URGENT must be refused with ERR_VALIDATION 400."
        test_recipe:
          setup: ["One PartnerAgency and one Client exist under it."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Delmar Community Hub", county: "CENTRAL", quarterly_voucher_quota: 4 }
              as: PlatformAdmin
              captures: { ag_id: "$.data.id" }
            - call: "POST /clients"
              payload: { agency_id: "${ag_id}", household_size: 3, county: "CENTRAL", has_infant: false }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { cl_id: "$.data.id" }
          trigger:
            - call: "POST /referrals"
              payload: { client_id: "${cl_id}", agency_id: "${ag_id}", requested_categories: ["BED"], urgency: "URGENT", home_visit_completed: true, bed_bug_attestation: true }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_VALIDATION"
            - "HTTP status of the trigger is 400"
            - "GET /referrals with client_id=${cl_id} returns exactly 0 items"

      - name: corner_voucher_rejects_unknown_money_field_in_request_body
        claim_type: System Fields
        grounds: ["entities.Voucher.fields.gross_fee_cents", "entities.Voucher.fields.fee_basis", "validations[priority=3]"]
        distinguishing_aspect: "gross_fee_cents is source computed and is not part of POST /vouchers input, so supplying it is an unknown-field violation answered with ERR_VALIDATION 400."
        test_recipe:
          setup: ["A PartnerAgency, a Client and an APPROVED Referral exist."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Everglade Support Circle", county: "CENTRAL", quarterly_voucher_quota: 4 }
              as: PlatformAdmin
              captures: { ag_id: "$.data.id" }
            - call: "POST /clients"
              payload: { agency_id: "${ag_id}", household_size: 3, county: "CENTRAL", has_infant: false }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { cl_id: "$.data.id" }
            - call: "POST /referrals"
              payload: { client_id: "${cl_id}", agency_id: "${ag_id}", requested_categories: ["BED"], urgency: "ROUTINE", home_visit_completed: true, bed_bug_attestation: true }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { ref_id: "$.data.id" }
            - call: "POST /referrals/${ref_id}/submit"
              payload: {}
              as: CaseManager
              as_user_id: "${ag_id}"
            - call: "POST /referrals/${ref_id}/review"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
          trigger:
            - call: "POST /vouchers"
              payload: { referral_id: "${ref_id}", lines: [ { category: "BED", quantity_requested: 1, min_condition: "B" } ], gross_fee_cents: 1 }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_VALIDATION"
            - "HTTP status of the trigger is 400"
            - "GET /vouchers with referral_id=${ref_id} returns exactly 0 items"

      - name: corner_referral_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds: ["endpoints.GET./referrals", "response_envelope.pagination_fields"]
        distinguishing_aspect: "With three referrals stored, GET /referrals?limit=2&offset=0 returns exactly 2 rows with total_count 3 and has_more true; offset 2 returns 1 row with has_more false."
        test_recipe:
          setup: ["One PartnerAgency with three Clients, each carrying one DRAFT Referral."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Fairmount Family Bridge", county: "CENTRAL", quarterly_voucher_quota: 5 }
              as: PlatformAdmin
              captures: { ag_id: "$.data.id" }
            - call: "POST /clients"
              payload: { agency_id: "${ag_id}", household_size: 2, county: "CENTRAL", has_infant: false }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { c1: "$.data.id" }
            - call: "POST /clients"
              payload: { agency_id: "${ag_id}", household_size: 3, county: "CENTRAL", has_infant: false }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { c2: "$.data.id" }
            - call: "POST /clients"
              payload: { agency_id: "${ag_id}", household_size: 4, county: "CENTRAL", has_infant: false }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { c3: "$.data.id" }
            - call: "POST /referrals"
              payload: { client_id: "${c1}", agency_id: "${ag_id}", requested_categories: ["BED"], urgency: "ROUTINE", home_visit_completed: true, bed_bug_attestation: true }
              as: CaseManager
              as_user_id: "${ag_id}"
            - call: "POST /referrals"
              payload: { client_id: "${c2}", agency_id: "${ag_id}", requested_categories: ["SOFA"], urgency: "ROUTINE", home_visit_completed: true, bed_bug_attestation: true }
              as: CaseManager
              as_user_id: "${ag_id}"
            - call: "POST /referrals"
              payload: { client_id: "${c3}", agency_id: "${ag_id}", requested_categories: ["CRIB"], urgency: "ROUTINE", home_visit_completed: true, bed_bug_attestation: true }
              as: CaseManager
              as_user_id: "${ag_id}"
          trigger:
            - call: "GET /referrals"
              payload: { agency_id: "${ag_id}", limit: 2, offset: 0 }
              as: PlatformAdmin
            - call: "GET /referrals"
              payload: { agency_id: "${ag_id}", limit: 2, offset: 2 }
              as: PlatformAdmin
          assert:
            - "First trigger returns response_type array with exactly 2 elements, meta pagination total_count == 3 and has_more == true"
            - "Second trigger returns exactly 1 element, total_count == 3 and has_more == false"
            - "Every returned row has agency_id == ${ag_id}"

      - name: corner_pagination_limit_above_max_returns_pagination_invalid
        claim_type: Listing
        grounds: ["validations[priority=4]", "errors[ERR_PAGINATION_INVALID]", "response_envelope.pagination_defaults"]
        distinguishing_aspect: "limit 101 is outside the declared [1,100] range and must return ERR_PAGINATION_INVALID with HTTP 400 rather than clamping silently."
        test_recipe:
          setup: ["One PartnerAgency exists so the list endpoint has a valid filter target."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Gravenhurst Aid Post", county: "NORTH", quarterly_voucher_quota: 4 }
              as: PlatformAdmin
              captures: { ag_id: "$.data.id" }
          trigger:
            - call: "GET /clients"
              payload: { agency_id: "${ag_id}", limit: 101, offset: 0 }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_PAGINATION_INVALID"
            - "HTTP status of the trigger is 400"

      - name: corner_inventory_item_copies_category_condition_and_volume_from_donation_item
        claim_type: Computed Fields
        grounds: ["entities.InventoryItem.fields.category", "entities.InventoryItem.fields.condition", "entities.InventoryItem.fields.cubic_feet", "entities.InventoryItem.fields.available_since"]
        distinguishing_aspect: "The minted stock unit copies category and cubic_feet from its DonationItem and takes its condition from the inspection's graded_condition (C, not the donor's declared B), with available_since stamped at the intake instant."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-04T09:00:00Z."
            - "A truck and one clean single-item donation offer (DRESSER, donor-declared condition B, non-soft, 18.0 cubic feet) scheduled for pickup."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /trucks"
              payload: { label: "BOX-20", capacity_cubic_feet: 600, home_county: "CENTRAL", crew_minimum: 1 }
              as: PlatformAdmin
              captures: { tr_id: "$.data.id" }
            - call: "POST /donation-offers"
              payload: { donor_name: "Hana Ito", donor_phone: "555-0401", pickup_county: "CENTRAL", pickup_window_start: "2026-08-04T10:00:00Z", pickup_window_end: "2026-08-04T12:00:00Z", items: [ { category: "DRESSER", declared_condition: "B", soft_surface: false, cubic_feet: 18.0 } ] }
              as: IntakeCoordinator
              captures: { off_id: "$.data.id" }
            - call: "POST /donation-offers/${off_id}/triage"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /donation-offers/${off_id}/schedule-pickup"
              payload: { truck_id: "${tr_id}" }
              as: IntakeCoordinator
            - call: "GET /donation-offers/${off_id}/items"
              payload: {}
              as: WarehouseLead
              captures: { i1: "$.data[0].id" }
          trigger:
            - call: "POST /donation-offers/${off_id}/intake"
              payload: { inspections: [ { item_id: "${i1}", graded_condition: "C", live_pest_observed: false } ] }
              as: WarehouseLead
              as_user_id: "wl-inspector-1"
          assert:
            - "DonationOffer.${off_id}.status == INSPECTED"
            - "DonationOffer.${off_id}.inspector_user_id == wl-inspector-1"
            - "GET /inventory-items with donation_item_id=${i1} returns exactly 1 item"
            - "That InventoryItem has category == DRESSER, condition == C, cubic_feet == 18.0"
            - "That InventoryItem has status == AVAILABLE and available_since == 2026-08-04T09:00:00.000Z"
            - "DonationItem.${i1}.graded_condition == C"

      - name: corner_not_found_across_path_resources
        claim_type: Not Found
        grounds: ["validations[priority=5]", "errors[ERR_CLIENT_NOT_FOUND]", "errors[ERR_REFERRAL_NOT_FOUND]", "errors[ERR_VOUCHER_NOT_FOUND]", "errors[ERR_DONATION_OFFER_NOT_FOUND]", "errors[ERR_INVENTORY_ITEM_NOT_FOUND]", "errors[ERR_TRUCK_NOT_FOUND]"]
        distinguishing_aspect: "Each path-parameter resource answers with its own domain-specific 404 code rather than a generic one, so six unknown UUIDs produce six distinct error_ids."
        test_recipe:
          setup: ["Empty database; no fixtures required because every id below is deliberately unknown."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /clients/00000000-0000-4000-8000-00000000000a"
              payload: {}
              as: PlatformAdmin
              captures: { e_client: "$.data.error_id" }
            - call: "GET /referrals/00000000-0000-4000-8000-00000000000b"
              payload: {}
              as: PlatformAdmin
              captures: { e_referral: "$.data.error_id" }
            - call: "GET /vouchers/00000000-0000-4000-8000-00000000000c"
              payload: {}
              as: PlatformAdmin
              captures: { e_voucher: "$.data.error_id" }
            - call: "GET /donation-offers/00000000-0000-4000-8000-00000000000d"
              payload: {}
              as: PlatformAdmin
              captures: { e_offer: "$.data.error_id" }
            - call: "GET /inventory-items/00000000-0000-4000-8000-00000000000e"
              payload: {}
              as: PlatformAdmin
              captures: { e_item: "$.data.error_id" }
            - call: "GET /trucks/00000000-0000-4000-8000-00000000000f"
              payload: {}
              as: PlatformAdmin
              captures: { e_truck: "$.data.error_id" }
          assert:
            - "${e_client} == ERR_CLIENT_NOT_FOUND"
            - "${e_referral} == ERR_REFERRAL_NOT_FOUND"
            - "${e_voucher} == ERR_VOUCHER_NOT_FOUND"
            - "${e_offer} == ERR_DONATION_OFFER_NOT_FOUND"
            - "${e_item} == ERR_INVENTORY_ITEM_NOT_FOUND"
            - "${e_truck} == ERR_TRUCK_NOT_FOUND"
            - "Every response uses response_type error and carries a non-empty data.message"
            - "Every response HTTP status is 404"

      - name: corner_not_found_across_delivery_and_waitlist_resources
        claim_type: Not Found
        grounds: ["validations[priority=5]", "errors[ERR_RUN_NOT_FOUND]", "errors[ERR_STOP_NOT_FOUND]", "errors[ERR_VOLUNTEER_NOT_FOUND]", "errors[ERR_CREW_ASSIGNMENT_NOT_FOUND]", "errors[ERR_WAITLIST_ENTRY_NOT_FOUND]", "errors[ERR_AGENCY_NOT_FOUND]"]
        distinguishing_aspect: "The delivery and waitlist halves of the surface also carry their own 404 codes, including on action endpoints whose path id does not resolve."
        test_recipe:
          setup: ["Empty database; every id below is deliberately unknown."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /delivery-runs/00000000-0000-4000-8000-000000000010"
              payload: {}
              as: DispatchPlanner
              captures: { e_run: "$.data.error_id" }
            - call: "POST /delivery-stops/00000000-0000-4000-8000-000000000011/outcome"
              payload: { outcome: "DELIVERED" }
              as: DispatchPlanner
              captures: { e_stop: "$.data.error_id" }
            - call: "GET /volunteers/00000000-0000-4000-8000-000000000012"
              payload: {}
              as: PlatformAdmin
              captures: { e_vol: "$.data.error_id" }
            - call: "POST /crew-assignments/00000000-0000-4000-8000-000000000013/respond"
              payload: { response: "CONFIRM" }
              as: Volunteer
              as_user_id: "00000000-0000-4000-8000-000000000012"
              captures: { e_crew: "$.data.error_id" }
            - call: "GET /waitlist-entries/00000000-0000-4000-8000-000000000014"
              payload: {}
              as: PlatformAdmin
              captures: { e_wait: "$.data.error_id" }
            - call: "GET /agencies/00000000-0000-4000-8000-000000000015"
              payload: {}
              as: PlatformAdmin
              captures: { e_agency: "$.data.error_id" }
          assert:
            - "${e_run} == ERR_RUN_NOT_FOUND"
            - "${e_stop} == ERR_STOP_NOT_FOUND"
            - "${e_vol} == ERR_VOLUNTEER_NOT_FOUND"
            - "${e_crew} == ERR_CREW_ASSIGNMENT_NOT_FOUND"
            - "${e_wait} == ERR_WAITLIST_ENTRY_NOT_FOUND"
            - "${e_agency} == ERR_AGENCY_NOT_FOUND"
            - "Every response HTTP status is 404"

      - name: corner_body_foreign_key_truck_not_found_on_run_create
        claim_type: Parent Relationships
        grounds: ["validations[priority=6]", "entities.DeliveryRun.fields.truck_id", "errors[ERR_TRUCK_NOT_FOUND]"]
        distinguishing_aspect: "A foreign key supplied in the request body is validated exactly like a path id: an unknown truck_id on POST /delivery-runs returns ERR_TRUCK_NOT_FOUND 404 and creates no run."
        test_recipe:
          setup: ["Logical clock at 2026-08-04T09:00:00Z; one real truck exists so the collection is non-empty."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /trucks"
              payload: { label: "BOX-21", capacity_cubic_feet: 600, home_county: "CENTRAL", crew_minimum: 1 }
              as: PlatformAdmin
              captures: { tr_id: "$.data.id" }
          trigger:
            - call: "POST /delivery-runs"
              payload: { truck_id: "00000000-0000-4000-8000-000000000020", service_date: "2026-08-05", window_start: "2026-08-05T09:00:00Z", window_end: "2026-08-05T17:00:00Z", county: "CENTRAL" }
              as: DispatchPlanner
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_TRUCK_NOT_FOUND"
            - "HTTP status of the trigger is 404"
            - "GET /delivery-runs with truck_id=${tr_id} returns exactly 0 items"

  # =========================================================================
  - section: state_machines
    instances:

      - name: corner_referral_starts_in_draft_with_zero_score
        claim_type: Initial State
        grounds: ["state_machines.Referral.initial_state", "entities.Referral.fields.status", "entities.Referral.fields.revision_count"]
        distinguishing_aspect: "A freshly created Referral is DRAFT with revision_count 0, priority_score 0.0, approved_at null, expires_at null and approved_epoch null - the score is only computed at submit."
        test_recipe:
          setup: ["One PartnerAgency with one Client."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Ironwood Family Center", county: "CENTRAL", quarterly_voucher_quota: 4 }
              as: PlatformAdmin
              captures: { ag_id: "$.data.id" }
            - call: "POST /clients"
              payload: { agency_id: "${ag_id}", household_size: 5, county: "CENTRAL", has_infant: true }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { cl_id: "$.data.id" }
          trigger:
            - call: "POST /referrals"
              payload: { client_id: "${cl_id}", agency_id: "${ag_id}", requested_categories: ["BED", "CRIB"], urgency: "EMERGENCY", home_visit_completed: true, bed_bug_attestation: true }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { ref_id: "$.data.id" }
          assert:
            - "Referral.${ref_id}.status == DRAFT"
            - "Referral.${ref_id}.revision_count == 0"
            - "Referral.${ref_id}.priority_score == 0.0"
            - "Referral.${ref_id}.approved_at == null"
            - "Referral.${ref_id}.expires_at == null"
            - "Referral.${ref_id}.approved_epoch == null"

      - name: corner_review_of_draft_referral_rejected
        claim_type: Invalid Transitions
        grounds: ["state_machines.Referral.SUBMITTED_to_APPROVED", "validations[priority=11]", "errors[ERR_REFERRAL_NOT_SUBMITTED]"]
        distinguishing_aspect: "DRAFT has no outgoing review edge, so POST /referrals/{id}/review with APPROVE returns ERR_REFERRAL_NOT_SUBMITTED 409 and leaves agency.quota_used at 0."
        test_recipe:
          setup: ["One PartnerAgency, one Client and one Referral still in DRAFT."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Juniper Way Services", county: "CENTRAL", quarterly_voucher_quota: 4 }
              as: PlatformAdmin
              captures: { ag_id: "$.data.id" }
            - call: "POST /clients"
              payload: { agency_id: "${ag_id}", household_size: 3, county: "CENTRAL", has_infant: false }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { cl_id: "$.data.id" }
            - call: "POST /referrals"
              payload: { client_id: "${cl_id}", agency_id: "${ag_id}", requested_categories: ["BED"], urgency: "ROUTINE", home_visit_completed: true, bed_bug_attestation: true }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { ref_id: "$.data.id" }
          trigger:
            - call: "POST /referrals/${ref_id}/review"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_REFERRAL_NOT_SUBMITTED"
            - "HTTP status of the trigger is 409"
            - "Referral.${ref_id}.status == DRAFT"
            - "PartnerAgency.${ag_id}.quota_used == 0"

      - name: corner_denied_referral_is_terminal_and_cannot_be_resubmitted
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Referral.terminal_states", "state_machines.Referral.SUBMITTED_to_DENIED", "errors[ERR_REFERRAL_NOT_SUBMITTED]"]
        distinguishing_aspect: "DENIED is terminal: a resubmit attempt returns ERR_REFERRAL_NOT_SUBMITTED 409 and revision_count stays 0."
        test_recipe:
          setup: ["One PartnerAgency, one Client and one Referral that was SUBMITTED and then DENIED."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Kestrel Outreach", county: "CENTRAL", quarterly_voucher_quota: 4 }
              as: PlatformAdmin
              captures: { ag_id: "$.data.id" }
            - call: "POST /clients"
              payload: { agency_id: "${ag_id}", household_size: 3, county: "CENTRAL", has_infant: false }
