# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# 9 rules x >=2 instances = 19 instances. All literals pre-computed.
# Logical clock default: 2026-08-01T00:00:00Z (never falls back to wall clock).
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: eligibility_strict_vs_holistic_zero_gate
        grounds:
          - calculations.eligibility_match_score
          - entities.ScholarshipProgram.fields.match_policy
          - entities.Application.fields.provisional_match_score
        distinguishing_aspect: |
          Same student data scored by two programs differing only in match_policy:
          STRICT zero-gates on the GPA miss (0.00) while HOLISTIC grants partial
          credit (90.00) — dual variants on the Application/eligibility domain.
          Verified by code: NEED weights gpa .20 income .50 residency .10 tags .20;
          gpa 280 vs min 300 -> gap 20 <= 20 -> component 50; income 2000000 <=
          10000000 -> 100; residency CA==CA -> 100; tags 1/1 -> 100;
          .20*50 + .50*100 + .10*100 + .20*100 = 90.00; STRICT hard-miss -> 0.00.
        test_recipe:
          setup:
            - "Student gpa 280 (min 300 -> 20-hundredths gap), income 2000000, residency CA, major STEM, tags [FIRST_GEN]"
            - "Two NEED programs identical except match_policy STRICT vs HOLISTIC; min_gpa 300, max_income 10000000, residency CA, required_tags [FIRST_GEN], eligible_majors [STEM]"
            - "Both programs OPEN (published at default clock 2026-08-01 == application_open_at, inclusive gate)"
          setup_api_calls:
            - call: "POST /api/students"
              payload: { full_name: "Ana Ruiz", email: "ana@x.com", grade_level: 12, gpa_hundredths: 280, residency_state: "CA", intended_major: "STEM", household_income_cents: 2000000, efc_cents: 1000000, cost_of_attendance_cents: 3000000, institution_name: "State U", tags: ["FIRST_GEN"] }
              as: ScholarshipCoordinator
              captures: { s_id: $.data.id }
            - call: "POST /api/donors"
              payload: { name: "Ruiz Foundation", contact_email: "d@x.com" }
              as: ScholarshipCoordinator
              captures: { d_id: $.data.id }
            - call: "POST /api/award-funds"
              payload: { name: "General Fund", committed_cents: 10000000 }
              as: ScholarshipCoordinator
              captures: { f_id: $.data.id }
            - call: "POST /api/scholarship-programs"
              payload: { name: "Strict STEM Award", donor_id: "${d_id}", fund_id: "${f_id}", program_type: "NEED", match_policy: "STRICT", stacking_scope: "ANNUAL", award_amount_cents: 1000000, max_recipients: 2, min_gpa_hundredths: 300, required_residency_state: "CA", max_household_income_cents: 10000000, application_open_at: "2026-08-01T00:00:00Z", application_close_at: "2026-09-15T00:00:00Z", eligible_majors: ["STEM"], required_tags: ["FIRST_GEN"] }
              as: ScholarshipCoordinator
              captures: { p_strict: $.data.id }
            - call: "POST /api/scholarship-programs"
              payload: { name: "Holistic STEM Award", donor_id: "${d_id}", fund_id: "${f_id}", program_type: "NEED", match_policy: "HOLISTIC", stacking_scope: "ANNUAL", award_amount_cents: 1000000, max_recipients: 2, min_gpa_hundredths: 300, required_residency_state: "CA", max_household_income_cents: 10000000, application_open_at: "2026-08-01T00:00:00Z", application_close_at: "2026-09-15T00:00:00Z", eligible_majors: ["STEM"], required_tags: ["FIRST_GEN"] }
              as: ScholarshipCoordinator
              captures: { p_holistic: $.data.id }
            - call: "POST /api/scholarship-programs/${p_strict}/publish"
              as: ScholarshipCoordinator
            - call: "POST /api/scholarship-programs/${p_holistic}/publish"
              as: ScholarshipCoordinator
            - call: "POST /api/applications"
              payload: { student_id: "${s_id}", program_id: "${p_strict}" }
              as: ScholarshipCoordinator
              captures: { app_strict: $.data.id }
            - call: "POST /api/applications"
              payload: { student_id: "${s_id}", program_id: "${p_holistic}" }
              as: ScholarshipCoordinator
              captures: { app_holistic: $.data.id }
          trigger:
            - call: "GET /api/applications/${app_strict}"
              as: ScholarshipCoordinator
            - call: "GET /api/applications/${app_holistic}"
              as: ScholarshipCoordinator
          assert:
            - "Application.${app_strict}.provisional_match_score == 0.00"
            - "Application.${app_holistic}.provisional_match_score == 90.00"
            - "Same student, same criterion values: the STRICT variant zero-gates, the HOLISTIC variant pays partial GPA credit — delta is exactly 90.00"

      - name: stacking_scope_annual_vs_per_term_caps
        grounds:
          - calculations.stacking_cap
          - entities.ScholarshipProgram.fields.stacking_scope
          - entities.Student.fields.excess_cents
          - entities.AwardAdjustment.fields.auto_generated
        distinguishing_aspect: |
          Identical student finances (COA 3000000, EFC 1000000) accepting identical
          1500000-cent awards: ANNUAL scope admits the award cleanly (cap 2000000,
          no adjustment) while PER_TERM scope caps at floor(2000000/2)=1000000 and
          cascades a -500000 auto-adjustment — dual variants on the Award/fiscal
          domain (distinct from the Application/eligibility domain of the sibling
          instance).
        test_recipe:
          setup:
            - "Two students A and B with identical finances: COA 3000000, EFC 1000000, gpa 350, income 2000000, CA, STEM, no tags"
            - "Two HOLISTIC NEED programs identical except stacking_scope ANNUAL (P_A) vs PER_TERM (P_B); award_amount 1500000; fund 10000000"
            - "Each student holds a SELECTED application (full committee flow) and an OFFERED award of 1500000"
          setup_api_calls:
            - call: "POST /api/students"
              payload: { full_name: "Sam A", email: "sa@x.com", grade_level: 12, gpa_hundredths: 350, residency_state: "CA", intended_major: "STEM", household_income_cents: 2000000, efc_cents: 1000000, cost_of_attendance_cents: 3000000, institution_name: "State U" }
              as: ScholarshipCoordinator
              captures: { s_a: $.data.id }
            - call: "POST /api/students"
              payload: { full_name: "Sam B", email: "sb@x.com", grade_level: 12, gpa_hundredths: 350, residency_state: "CA", intended_major: "STEM", household_income_cents: 2000000, efc_cents: 1000000, cost_of_attendance_cents: 3000000, institution_name: "State U" }
              as: ScholarshipCoordinator
              captures: { s_b: $.data.id }
            - call: "POST /api/donors"
              payload: { name: "Cap Donor", contact_email: "cap@x.com" }
              as: ScholarshipCoordinator
              captures: { d_id: $.data.id }
            - call: "POST /api/award-funds"
              payload: { name: "Cap Fund", committed_cents: 10000000 }
              as: ScholarshipCoordinator
              captures: { f_id: $.data.id }
            - call: "POST /api/scholarship-programs"
              payload: { name: "Annual Award", donor_id: "${d_id}", fund_id: "${f_id}", program_type: "NEED", match_policy: "HOLISTIC", stacking_scope: "ANNUAL", award_amount_cents: 1500000, max_recipients: 2, min_gpa_hundredths: 300, required_residency_state: "CA", max_household_income_cents: 10000000, application_open_at: "2026-08-01T00:00:00Z", application_close_at: "2026-09-15T00:00:00Z" }
              as: ScholarshipCoordinator
              captures: { p_a: $.data.id }
            - call: "POST /api/scholarship-programs"
              payload: { name: "Per-Term Award", donor_id: "${d_id}", fund_id: "${f_id}", program_type: "NEED", match_policy: "HOLISTIC", stacking_scope: "PER_TERM", award_amount_cents: 1500000, max_recipients: 2, min_gpa_hundredths: 300, required_residency_state: "CA", max_household_income_cents: 10000000, application_open_at: "2026-08-01T00:00:00Z", application_close_at: "2026-09-15T00:00:00Z" }
              as: ScholarshipCoordinator
              captures: { p_b: $.data.id }
            - call: "POST /api/scholarship-programs/${p_a}/publish"
              as: ScholarshipCoordinator
            - call: "POST /api/scholarship-programs/${p_b}/publish"
              as: ScholarshipCoordinator
            - call: "POST /api/applications"
              payload: { student_id: "${s_a}", program_id: "${p_a}" }
              as: ScholarshipCoordinator
              captures: { app_a: $.data.id }
            - call: "POST /api/applications"
              payload: { student_id: "${s_b}", program_id: "${p_b}" }
              as: ScholarshipCoordinator
              captures: { app_b: $.data.id }
            - call: "POST /api/applications/${app_a}/submit"
              as: ScholarshipCoordinator
            - call: "POST /api/applications/${app_b}/submit"
              as: ScholarshipCoordinator
            - call: "POST /api/review-cycles"
              payload: { program_id: "${p_a}", label: "A-2026", starts_on: "2026-09-16", ends_on: "2026-10-15", quorum_count: 1, selection_quota: 1, waitlist_quota: 0 }
              as: ScholarshipCoordinator
              captures: { c_a: $.data.id }
            - call: "POST /api/review-cycles"
              payload: { program_id: "${p_b}", label: "B-2026", starts_on: "2026-09-16", ends_on: "2026-10-15", quorum_count: 1, selection_quota: 1, waitlist_quota: 0 }
              as: ScholarshipCoordinator
              captures: { c_b: $.data.id }
            - call: "POST /api/review-cycles/${c_a}/open-scoring"
              as: ScholarshipCoordinator
            - call: "POST /api/review-cycles/${c_b}/open-scoring"
              as: ScholarshipCoordinator
            - call: "POST /api/review-scores"
              payload: { cycle_id: "${c_a}", application_id: "${app_a}", academic_score: 90, essay_score: 90, need_score: 90 }
              as: CommitteeReviewer
              as_user_id: "rev_1"
              captures: { sc_a: $.data.id }
            - call: "POST /api/review-scores"
              payload: { cycle_id: "${c_b}", application_id: "${app_b}", academic_score: 90, essay_score: 90, need_score: 90 }
              as: CommitteeReviewer
              as_user_id: "rev_1"
              captures: { sc_b: $.data.id }
            - call: "POST /api/review-scores/${sc_a}/submit"
              as: CommitteeReviewer
              as_user_id: "rev_1"
            - call: "POST /api/review-scores/${sc_b}/submit"
              as: CommitteeReviewer
              as_user_id: "rev_1"
            - call: "POST /api/review-cycles/${c_a}/open-deliberation"
              as: ScholarshipCoordinator
            - call: "POST /api/review-cycles/${c_b}/open-deliberation"
              as: ScholarshipCoordinator
            - call: "POST /api/review-cycles/${c_a}/finalize"
              as: ScholarshipCoordinator
            - call: "POST /api/review-cycles/${c_b}/finalize"
              as: ScholarshipCoordinator
            - call: "POST /api/awards"
              payload: { application_id: "${app_a}", student_id: "${s_a}", amount_cents: 1500000 }
              as: ScholarshipCoordinator
              captures: { aw_a: $.data.id }
            - call: "POST /api/awards"
              payload: { application_id: "${app_b}", student_id: "${s_b}", amount_cents: 1500000 }
              as: ScholarshipCoordinator
              captures: { aw_b: $.data.id }
          trigger:
            - call: "POST /api/awards/${aw_a}/accept"
              as: Student
              as_user_id: "${s_a}"
            - call: "POST /api/awards/${aw_b}/accept"
              as: Student
              as_user_id: "${s_b}"
            - call: "GET /api/award-adjustments?award_id=${aw_b}"
              as: ScholarshipCoordinator
              captures: { adj_b_delta: "$.data[0].delta_cents", adj_b_auto: "$.data[0].auto_generated", adj_b_status: "$.data[0].status" }
            - call: "GET /api/students/${s_b}"
              as: ScholarshipCoordinator
              captures: { s_b_excess: $.data.excess_cents }
          assert:
            - "Award.${aw_a}.offer_status == ACCEPTED and GET /api/award-adjustments?award_id=${aw_a} returns total_count == 0 (ANNUAL cap 2000000 >= 1500000)"
            - "Award.${aw_b}.offer_status == ACCEPTED and exactly one auto adjustment exists: delta_cents == -500000, auto_generated == true, reason == OVER_AWARD, status == PENDING_APPROVAL (PER_TERM cap 1000000; excess 1500000-1000000 == 500000)"
            - "Student.${s_b}.excess_cents == 500000 and Student.${s_b}.total_accepted_cents == 1500000"

  - rule_id: combinatorial_formula
    instances:
      - name: committee_ranking_weighted_with_need_bonus
        grounds:
          - calculations.committee_ranking_score
          - entities.ReviewScore.fields.weighted_total
          - entities.Application.fields.cycle_score
          - entities.Application.fields.decision_rank
        distinguishing_aspect: |
          Mode (a) combinatorial: 4 inputs (academic, essay, need, household income)
          with tiered weight selection keyed on program_type plus a conditional
          deep-need branch. NEED weights (.25/.25/.50): X(80,60,90) deep-need ->
          20+15+45+5 = 85.00; Y(88,92,60) non-deep-need -> 22+23+30+0 = 75.00.
          Rank order flips on the conditional +5 bonus: without it X would tie
          Y's raw-weight profile differently; here X outranks Y 85.00 > 75.00.
        test_recipe:
          setup:
            - "NEED HOLISTIC program, max_household_income 10000000; student X income 2000000 (deep-need: 2*2000000 < 10000000), student Y income 8000000 (not deep-need)"
            - "Both applications SUBMITTED and UNDER_REVIEW; cycle quorum 1, selection_quota 1, waitlist_quota 1"
          setup_api_calls:
            - call: "POST /api/students"
              payload: { full_name: "X Deep", email: "x@x.com", grade_level: 12, gpa_hundredths: 350, residency_state: "CA", intended_major: "STEM", household_income_cents: 2000000, efc_cents: 1000000, cost_of_attendance_cents: 3000000, institution_name: "State U" }
              as: ScholarshipCoordinator
              captures: { s_x: $.data.id }
            - call: "POST /api/students"
              payload: { full_name: "Y Rich", email: "y@x.com", grade_level: 12, gpa_hundredths: 350, residency_state: "CA", intended_major: "STEM", household_income_cents: 8000000, efc_cents: 1000000, cost_of_attendance_cents: 3000000, institution_name: "State U" }
              as: ScholarshipCoordinator
              captures: { s_y: $.data.id }
            - call: "POST /api/donors"
              payload: { name: "Rank Donor", contact_email: "r@x.com" }
              as: ScholarshipCoordinator
              captures: { d_id: $.data.id }
            - call: "POST /api/award-funds"
              payload: { name: "Rank Fund", committed_cents: 10000000 }
              as: ScholarshipCoordinator
              captures: { f_id: $.data.id }
            - call: "POST /api/scholarship-programs"
              payload: { name: "Rank Award", donor_id: "${d_id}", fund_id: "${f_id}", program_type: "NEED", match_policy: "HOLISTIC", stacking_scope: "ANNUAL", award_amount_cents: 1000000, max_recipients: 2, min_gpa_hundredths: 300, required_residency_state: "CA", max_household_income_cents: 10000000, application_open_at: "2026-08-01T00:00:00Z", application_close_at: "2026-09-15T00:00:00Z" }
              as: ScholarshipCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /api/scholarship-programs/${p_id}/publish"
              as: ScholarshipCoordinator
            - call: "POST /api/applications"
              payload: { student_id: "${s_x}", program_id: "${p_id}" }
              as: ScholarshipCoordinator
              captures: { app_x: $.data.id }
            - call: "POST /api/applications"
              payload: { student_id: "${s_y}", program_id: "${p_id}" }
              as: ScholarshipCoordinator
              captures: { app_y: $.data.id }
            - call: "POST /api/applications/${app_x}/submit"
              as: ScholarshipCoordinator
            - call: "POST /api/applications/${app_y}/submit"
              as: ScholarshipCoordinator
            - call: "POST /api/review-cycles"
              payload: { program_id: "${p_id}", label: "R-2026", starts_on: "2026-09-16", ends_on: "2026-10-15", quorum_count: 1, selection_quota: 1, waitlist_quota: 1 }
              as: ScholarshipCoordinator
              captures: { c_id: $.data.id }
            - call: "POST /api/review-cycles/${c_id}/open-scoring"
              as: ScholarshipCoordinator
            - call: "POST /api/review-scores"
              payload: { cycle_id: "${c_id}", application_id: "${app_x}", academic_score: 80, essay_score: 60, need_score: 90 }
              as: CommitteeReviewer
              as_user_id: "rev_1"
              captures: { sc_x: $.data.id }
            - call: "POST /api/review-scores"
              payload: { cycle_id: "${c_id}", application_id: "${app_y}", academic_score: 88, essay_score: 92, need_score: 60 }
              as: CommitteeReviewer
              as_user_id: "rev_2"
              captures: { sc_y: $.data.id }
            - call: "POST /api/review-scores/${sc_x}/submit"
              as: CommitteeReviewer
              as_user_id: "rev_1"
            - call: "POST /api/review-scores/${sc_y}/submit"
              as: CommitteeReviewer
              as_user_id: "rev_2"
            - call: "POST /api/review-cycles/${c_id}/open-deliberation"
              as: ScholarshipCoordinator
          trigger:
            - call: "POST /api/review-cycles/${c_id}/finalize"
              as: ScholarshipCoordinator
            - call: "GET /api/applications/${app_x}"
              as: ScholarshipCoordinator
            - call: "GET /api/applications/${app_y}"
              as: ScholarshipCoordinator
          assert:
            - "ReviewScore.${sc_x}.weighted_total == 85.00 (20+15+45 plus deep-need bonus 5, cap 100 not binding)"
            - "ReviewScore.${sc_y}.weighted_total == 75.00 (22+23+30, no bonus: 2*8000000 !< 10000000)"
            - "Application.${app_x}.cycle_score == 85.00 and Application.${app_x}.decision_rank == 1 and status == SELECTED"
            - "Application.${app_y}.cycle_score == 75.00 and Application.${app_y}.decision_rank == 2 and status == WAITLISTED"

      - name: disbursement_split_remainder_to_earliest_terms
        grounds:
          - calculations.disbursement_split
          - entities.Disbursement.fields.amount_cents
          - entities.Disbursement.fields.term_seq
        distinguishing_aspect: |
          Mode (b) nested rounding with pinned order: 1000000 cents over 3 terms uses
          floor-then-remainder-to-EARLIEST -> [333334, 333333, 333333]; the
          residual-to-last convention would yield [333333, 333333, 333334]. The
          pinned order is observable in term_seq 1 carrying the extra cent.
          (Distinct mode from the sibling's mode-(a) tiered weight selection.)
        test_recipe:
          setup:
            - "ACCEPTED award of 1000000 cents (amount == program award_amount; fund 5000000); student with cap ample (COA 3000000, EFC 0 -> cap 3000000)"
          setup_api_calls:
            - call: "POST /api/students"
              payload: { full_name: "Split Sam", email: "split@x.com", grade_level: 12, gpa_hundredths: 350, residency_state: "CA", intended_major: "STEM", household_income_cents: 2000000, efc_cents: 0, cost_of_attendance_cents: 3000000, institution_name: "State U" }
              as: ScholarshipCoordinator
              captures: { s_id: $.data.id }
            - call: "POST /api/donors"
              payload: { name: "Split Donor", contact_email: "s@x.com" }
              as: ScholarshipCoordinator
              captures: { d_id: $.data.id }
            - call: "POST /api/award-funds"
              payload: { name: "Split Fund", committed_cents: 5000000 }
              as: ScholarshipCoordinator
              captures: { f_id: $.data.id }
            - call: "POST /api/scholarship-programs"
              payload: { name: "Split Award", donor_id: "${d_id}", fund_id: "${f_id}", program_type: "NEED", match_policy: "HOLISTIC", stacking_scope: "ANNUAL", award_amount_cents: 1000000, max_recipients: 1, min_gpa_hundredths: 300, required_residency_state: "CA", max_household_income_cents: 10000000, application_open_at: "2026-08-01T00:00:00Z", application_close_at: "2026-09-15T00:00:00Z" }
              as: ScholarshipCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /api/scholarship-programs/${p_id}/publish"
              as: ScholarshipCoordinator
            - call: "POST /api/applications"
              payload: { student_id: "${s_id}", program_id: "${p_id}" }
              as: ScholarshipCoordinator
              captures: { app_id: $.data.id }
            - call: "POST /api/applications/${app_id}/submit"
              as: ScholarshipCoordinator
            - call: "POST /api/review-cycles"
              payload: { program_id: "${p_id}", label: "S-2026", starts_on: "2026-09-16", ends_on: "2026-10-15", quorum_count: 1, selection_quota: 1 }
              as: ScholarshipCoordinator
              captures: { c_id: $.data.id }
            - call: "POST /api/review-cycles/${c_id}/open-scoring"
              as: ScholarshipCoordinator
            - call: "POST /api/review-scores"
              payload: { cycle_id: "${c_id}", application_id: "${app_id}", academic_score: 90, essay_score: 90, need_score: 90 }
              as: CommitteeReviewer
              as_user_id: "rev_1"
              captures: { sc_id: $.data.id }
            - call: "POST /api/review-scores/${sc_id}/submit"
              as: CommitteeReviewer
              as_user_id: "rev_1"
            - call: "POST /api/review-cycles/${c_id}/open-deliberation"
              as: ScholarshipCoordinator
            - call: "POST /api/review-cycles/${c_id}/finalize"
              as: ScholarshipCoordinator
            - call: "POST /api/awards"
              payload: { application_id: "${app_id}", student_id: "${s_id}", amount_cents: 1000000 }
              as: ScholarshipCoordinator
              captures: { aw_id: $.data.id }
            - call: "POST /api/awards/${aw_id}/accept"
              as: Student
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /api/awards/${aw_id}/schedule-split"
              payload: { term_count: 3 }
              as: ScholarshipCoordinator
          trigger_note: "response is Disbursement[] ordered by term_seq ASC"
          assert:
            - "Exactly 3 SCHEDULED Disbursements created for Award.${aw_id}"
            - "term_seq 1 amount_cents == 333334 (floor(1000000/3)=333333, remainder 1 -> earliest term +1)"
            - "term_seq 2 amount_cents == 333333 and term_seq 3 amount_cents == 333333"
            - "sum(amount_cents) == 1000000 exactly (no cent created or destroyed)"

  - rule_id: non_linear_state_machine
    instances:
      - name: application_return_resubmission_cycle
        grounds:
          - state_machines.Application.SUBMITTED_to_DRAFT
          - state_machines.Application.DRAFT_to_SUBMITTED
          - entities.Application.fields.returned_count
        distinguishing_aspect: |
          Cyclic A->B->A on the Application entity: SUBMITTED -> DRAFT (return)
          -> SUBMITTED (resubmit), with returned_count advancing to 1 and the
          reminder cadence re-armed on re-entry to DRAFT.
        test_recipe:
          setup:
            - "HOLISTIC program with no required components, close 2026-09-15T00:00:00Z; one DRAFT application at default clock 2026-08-01"
          setup_api_calls:
            - call: "POST /api/students"
              payload: { full_name: "Cy Ann", email: "cy@x.com", grade_level: 11, gpa_hundredths: 320, residency_state: "CA", intended_major: "ARTS", household_income_cents: 5000000, efc_cents: 500000, cost_of_attendance_cents: 3000000, institution_name: "State U" }
              as: ScholarshipCoordinator
              captures: { s_id: $.data.id }
            - call: "POST /api/donors"
              payload: { name: "Cy Donor", contact_email: "cy@x.com" }
              as: ScholarshipCoordinator
              captures: { d_id: $.data.id }
            - call: "POST /api/award-funds"
              payload: { name: "Cy Fund", committed_cents: 1000000 }
              as: ScholarshipCoordinator
              captures: { f_id: $.data.id }
            - call: "POST /api/scholarship-programs"
              payload: { name: "Cy Award", donor_id: "${d_id}", fund_id: "${f_id}", program_type: "MERIT", match_policy: "HOLISTIC", stacking_scope: "ANNUAL", award_amount_cents: 500000, max_recipients: 1, min_gpa_hundredths: 300, required_residency_state: "CA", max_household_income_cents: 10000000, application_open_at: "2026-08-01T00:00:00Z", application_close_at: "2026-09-15T00:00:00Z" }
              as: ScholarshipCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /api/scholarship-programs/${p_id}/publish"
              as: ScholarshipCoordinator
