        excluded_because:
          difficulty_instance: "non_linear_state_machine / densitometer_qc_hold_release_requires_two_passes_not_one"
          rationale: "The §1.8 instance already exercises the QC_HOLD -> ACTIVE precondition end to end: one passing DAILY_QC run leaves the device in QC_HOLD and only the second consecutive PASS releases it, with the appointment cancellations from the hold left untouched. Restating the precondition here would duplicate that chain."
      - name: acquisition_and_review_dimensions_change_independently
        claim_type: parallel_shape_independent_dimensions
        excluded_because:
          difficulty_instance: "non_linear_state_machine / session_repeat_cycle_reverts_acquisition_while_order_stays_terminal"
          rationale: "That instance is the parallel-dimension claim: acquisition_status reverts SUBMITTED -> IN_PROGRESS and review_status reverts REPEAT_REQUIRED -> NOT_REVIEWED while the ScanOrder stays in its terminal COMPLETED and the appointment stays COMPLETED, so the combined state is verified there."
      - name: finalize_cascade_denies_a_future_order_and_cancels_its_slot
        claim_type: cross_entity_side_effect
        excluded_because:
          difficulty_instance: "transitive_cascade / report_finalize_cascades_four_levels_to_cancel_a_future_appointment"
          rationale: "The four-level finalize cascade (report -> patient counters -> order DENIED with INTERVAL_REVISED_BY_REPORT -> appointment CANCELLED with ORDER_DENIED and the open-order counter released) is fully asserted in that §1.8 instance."

  - section: calculations
    instances:
      - name: t_and_z_scores_round_to_one_decimal_before_every_downstream_read
        claim_type: precision
        grounds:
          - calculations.site_scores.rounding
          - calculations.lowest_t_score_selection
          - calculations.interval_and_action_determination.STEP_1
        distinguishing_aspect: "A TOTAL_HIP raw t of (0.7000 - 0.9420) / 0.1200 = -2.01666... must be stored as -2.0 and the diagnosis must read that 1-decimal value, giving OSTEOPENIA; an implementation that classifies from the unrounded quotient would call it OSTEOPOROSIS. The lumbar raw -1.66666... likewise stores -1.7 and its raw z -0.41666... stores -0.4, and the session's lowest pair is drawn from the rounded values (-2.0 from TOTAL_HIP, -0.8 from TOTAL_HIP)."
        test_recipe:
          setup:
            - "A session on a certified device for a postmenopausal patient with a LUMBAR_SPINE and a TOTAL_HIP measurement whose raw scores sit just past the .05 rounding line."
          setup_api_calls:
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bone-density/payer-policies"
              payload: { payer_code: "PAY-STD", name: "Standard Bone Health", baseline_screening_min_interval_months: 24, high_risk_min_interval_months: 12, treatment_monitoring_min_interval_months: 12, vfa_covered: true, vfa_requires_height_loss_cm: 4.0, repeat_scan_grace_days: 30, max_lifetime_screening_scans: 6, appeal_allowed: false }
              as: ProgramAdmin
