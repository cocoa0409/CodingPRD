            - "Conservation after period 1: Authorization.${auth} has 400 == distributed 340 + void 40 + pending 20, authorization_state AUTHORIZED (1052 < 1500), periods_reported == 1"
            - "After period 2: void_store_count == 5, pending_store_count == 0, void_rate_bps == 125 (floor(5*10000/400)), conservation 400 == 395 + 5 + 0, periods_reported == 2"
            - "After reversing period 2: a REVERSAL entry ${rev_entry} is appended with reverses_snapshot_id == ${snap2}, DistributionSnapshot.${snap2}.is_reversed == true, and its own stored counters are unchanged"
            - "Counters revert exactly to the period-1 values recomputed from the new latest live POSTING: distributed 340, void 40, pending 20, void_rate_bps 1052, periods_reported 1 — and conservation 400 == 340 + 40 + 20 still holds"
            - "Under STORE_COUNT_BASIS the same period-1 data would give void 60 (400 - 340) and 1500 bps, tripping AT_RISK — the retailer's pinned basis is what keeps this authorization AUTHORIZED, and the reversal must restore the basis-consistent numbers, not the raw deltas"
            - "Reversing an already-reversed entry returns 409 ERR_SNAPSHOT_ALREADY_REVERSED, so the compensation cannot be double-applied"
