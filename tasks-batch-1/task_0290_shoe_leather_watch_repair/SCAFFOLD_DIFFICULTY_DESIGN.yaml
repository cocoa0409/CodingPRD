          - entities.RepairTicket.fields.amount_paid_cents
          - entities.Payment.fields.state
        distinguishing_aspect: |
          Conserved quantity = RepairTicket.amount_paid_cents (sum of CAPTURED payments).
          Capturing a 1500-cent payment then refunding it returns amount_paid_cents to its
          pre-capture value 0: amount_paid_cents == SUM(Payment.amount_cents WHERE state==CAPTURED).
          Different conserved quantity (cash paid) than instance 2's estimate parts subtotal.
