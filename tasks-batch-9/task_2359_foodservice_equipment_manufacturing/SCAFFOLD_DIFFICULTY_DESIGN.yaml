scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: config_pricing_indicative_versus_firm_diverge_by_undiscounted_branding
        grounds:
          - calculations.chain_configuration_unit_price_cents
          - entities.ChainConfiguration.fields.indicative_unit_price_cents
          - entities.ChainConfiguration.fields.firm_unit_price_cents
          - state_machines.ChainConfiguration.ENG_APPROVED_to_RELEASED
        distinguishing_aspect: |
          This dual-variant instance operates on the ChainConfiguration commercial domain (cost
          accounting on a quote), and the two variants diverge on the SAME row: quote_indicative
          omits BRANDING_KIT_CENTS entirely while release_firm adds it after the volume discount,
          so firm_unit_price_cents - indicative_unit_price_cents == 156000 exactly for a FULL_WRAP
          configuration.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "EquipmentModel FRY-900, ELECTRIC, base_price_cents 1850020, supports STANDARD_DIAL/TOUCH_PRO/CONNECT_PLUS, rated 120 units/hour, certification_posture LISTED via one AGENCY_GAMMA listing covering [SANITATION, ELECTRICAL]."
            - "ChainAccount CHN-1 with contracted_unit_volume 250 (the 0.08 volume tier)."
            - "ChainConfiguration CFG-1 with option_codes [SPLIT_TANK, HIGH_ALT], controls_package TOUCH_PRO, branding_kit FULL_WRAP, one PASSED PerformanceValidation, ENG_APPROVED with branding signed off."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /equipment-models"
              payload: { model_code: "FRY-900", name: "Fryer 900", category: "FRYER", energy_type: "ELECTRIC", base_price_cents: 1850020, supported_controls_packages: ["STANDARD_DIAL", "TOUCH_PRO", "CONNECT_PLUS"], rated_throughput_units_per_hour: 120 }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { model_id: $.data.id }
            - call: "POST /certification-listings"
              payload: { equipment_model_id: "${model_id}", agency_code: "AGENCY_GAMMA", scopes: ["SANITATION", "ELECTRICAL"] }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { listing_id: $.data.id }
            - call: "POST /certification-listings/${listing_id}/submissions"
              payload: {}
              as: ComplianceEngineer
              as_user_id: "ce-1"
            - call: "POST /certification-listings/${listing_id}/agency-decisions"
              payload: { decision: "ACKNOWLEDGE_REVIEW" }
              as: ListingReviewer
              as_user_id: "lr-1"
            - call: "POST /certification-listings/${listing_id}/agency-decisions"
              payload: { decision: "GRANT" }
              as: ListingReviewer
              as_user_id: "lr-1"
            - call: "POST /chain-accounts"
              payload: { account_code: "CHN-1", name: "Skillet Chain", contracted_unit_volume: 250 }
              as: ChannelManager
              captures: { chain_id: $.data.id, chain_v: $.data.version }
            - call: "POST /chain-configurations"
              payload: { chain_account_id: "${chain_id}", equipment_model_id: "${model_id}", config_code: "CFG-1", option_codes: ["SPLIT_TANK", "HIGH_ALT"], controls_package: "TOUCH_PRO", branding_kit: "FULL_WRAP", expected_chain_account_version: "${chain_v}" }
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { cfg_id: $.data.id, cfg_v: $.data.version, indicative_at_create: $.data.indicative_unit_price_cents }
            - call: "POST /performance-validations"
              payload: { chain_configuration_id: "${cfg_id}", menu_item_code: "FRIES", target_throughput_units_per_hour: 65.0, hold_temp_target_c: 175.0, expected_chain_configuration_version: "${cfg_v}" }
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { pv_id: $.data.id }
            - call: "POST /performance-validations/${pv_id}/test-runs"
              payload: { units_produced: 95, minutes: 90, hold_temp_c: 175.0 }
              as: ApplicationEngineer
              as_user_id: "eng-1"
            - call: "POST /performance-validations/${pv_id}/test-runs"
              payload: { units_produced: 108, minutes: 95, hold_temp_c: 174.0 }
              as: ApplicationEngineer
              as_user_id: "eng-1"
            - call: "POST /performance-validations/${pv_id}/test-runs"
              payload: { units_produced: 102, minutes: 92, hold_temp_c: 176.0 }
              as: ApplicationEngineer
              as_user_id: "eng-1"
            - call: "POST /performance-validations/${pv_id}/test-runs"
              payload: { units_produced: 88, minutes: 96, hold_temp_c: 175.5 }
              as: ApplicationEngineer
              as_user_id: "eng-1"
            - call: "POST /performance-validations/${pv_id}/conclusion"
              payload: {}
              as: ApplicationEngineer
              as_user_id: "eng-1"
            - call: "POST /chain-configurations/${cfg_id}/submissions"
              payload: {}
              as: ApplicationEngineer
              as_user_id: "eng-1"
            - call: "POST /chain-configurations/${cfg_id}/engineering-decisions"
              payload: { decision: "APPROVE" }
              as: EngineeringApprover
              as_user_id: "appr-1"
            - call: "POST /chain-configurations/${cfg_id}/branding-signoff"
              payload: { approved_artwork_ref: "ART-1" }
              as: ChainAdmin
              as_user_id: "${chain_id}"
          trigger:
            - call: "POST /chain-configurations/${cfg_id}/release"
              payload: {}
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { firm_price: $.data.firm_unit_price_cents, indicative_after_release: $.data.indicative_unit_price_cents }
          assert:
            - "ChainConfiguration.${cfg_id}.indicative_unit_price_cents == 2055186"
            - "ChainConfiguration.${cfg_id}.firm_unit_price_cents == 2211186"
            - "${firm_price} - ${indicative_after_release} == 156000"
            - "ChainConfiguration.${cfg_id}.status == RELEASED"

      - name: throughput_certified_best_window_versus_as_tested_full_series
        grounds:
          - calculations.measured_throughput_units_per_hour
          - entities.PerformanceValidation.fields.certified_throughput_units_per_hour
          - entities.PerformanceValidation.fields.as_tested_throughput_units_per_hour
          - state_machines.PerformanceValidation.IN_PROGRESS_to_PASSED
        distinguishing_aspect: |
          This dual-variant instance operates on a completely different entity domain from the
          pricing instance -- engineering throughput measurement on PerformanceValidation, not cost
          accounting on ChainConfiguration -- and the divergence is structural rather than
          additive: best_window takes the maximum over consecutive 3-run windows (66.06) while
          full_series pools all four runs (63.22), and only best_window feeds the PASS gate, so the
          validation PASSES against a 65.0 target that the full-series figure would have failed.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "EquipmentModel FRY-900 (ELECTRIC, rated 120 units/hour) with certification_posture LISTED."
            - "ChainAccount CHN-1 and DRAFT ChainConfiguration CFG-1."
            - "PerformanceValidation for menu_item_code FRIES with target 65.0 units/hour and hold_temp_target_c 175.0, carrying exactly four appended runs: (95 units, 90 min, 175.0C), (108, 95, 174.0), (102, 92, 176.0), (88, 96, 175.5)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /equipment-models"
              payload: { model_code: "FRY-900", name: "Fryer 900", category: "FRYER", energy_type: "ELECTRIC", base_price_cents: 1850020, supported_controls_packages: ["STANDARD_DIAL", "TOUCH_PRO", "CONNECT_PLUS"], rated_throughput_units_per_hour: 120 }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { model_id: $.data.id }
            - call: "POST /certification-listings"
              payload: { equipment_model_id: "${model_id}", agency_code: "AGENCY_GAMMA", scopes: ["SANITATION", "ELECTRICAL"] }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { listing_id: $.data.id }
            - call: "POST /certification-listings/${listing_id}/submissions"
              payload: {}
              as: ComplianceEngineer
              as_user_id: "ce-1"
            - call: "POST /certification-listings/${listing_id}/agency-decisions"
              payload: { decision: "ACKNOWLEDGE_REVIEW" }
              as: ListingReviewer
              as_user_id: "lr-1"
            - call: "POST /certification-listings/${listing_id}/agency-decisions"
              payload: { decision: "GRANT" }
              as: ListingReviewer
              as_user_id: "lr-1"
            - call: "POST /chain-accounts"
              payload: { account_code: "CHN-1", name: "Skillet Chain", contracted_unit_volume: 250 }
              as: ChannelManager
              captures: { chain_id: $.data.id, chain_v: $.data.version }
            - call: "POST /chain-configurations"
              payload: { chain_account_id: "${chain_id}", equipment_model_id: "${model_id}", config_code: "CFG-1", option_codes: ["SPLIT_TANK", "HIGH_ALT"], controls_package: "TOUCH_PRO", branding_kit: "FULL_WRAP", expected_chain_account_version: "${chain_v}" }
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { cfg_id: $.data.id, cfg_v: $.data.version }
            - call: "POST /performance-validations"
              payload: { chain_configuration_id: "${cfg_id}", menu_item_code: "FRIES", target_throughput_units_per_hour: 65.0, hold_temp_target_c: 175.0, expected_chain_configuration_version: "${cfg_v}" }
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { pv_id: $.data.id }
            - call: "POST /performance-validations/${pv_id}/test-runs"
              payload: { units_produced: 95, minutes: 90, hold_temp_c: 175.0 }
              as: ApplicationEngineer
              as_user_id: "eng-1"
            - call: "POST /performance-validations/${pv_id}/test-runs"
              payload: { units_produced: 108, minutes: 95, hold_temp_c: 174.0 }
              as: ApplicationEngineer
              as_user_id: "eng-1"
            - call: "POST /performance-validations/${pv_id}/test-runs"
              payload: { units_produced: 102, minutes: 92, hold_temp_c: 176.0 }
              as: ApplicationEngineer
              as_user_id: "eng-1"
            - call: "POST /performance-validations/${pv_id}/test-runs"
              payload: { units_produced: 88, minutes: 96, hold_temp_c: 175.5 }
              as: ApplicationEngineer
              as_user_id: "eng-1"
          trigger:
            - call: "POST /performance-validations/${pv_id}/conclusion"
              payload: {}
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { certified: $.data.certified_throughput_units_per_hour, as_tested: $.data.as_tested_throughput_units_per_hour }
          assert:
            - "PerformanceValidation.${pv_id}.certified_throughput_units_per_hour == 66.06"
            - "PerformanceValidation.${pv_id}.as_tested_throughput_units_per_hour == 63.22"
            - "PerformanceValidation.${pv_id}.status == PASSED"
            - "PerformanceValidation.${pv_id}.attempt_count == 1"
            - "PerformanceValidation.${pv_id}.failure_reason is null"

  - rule_id: combinatorial_formula
    instances:
      - name: option_uplift_rounded_per_option_then_summed_not_summed_then_rounded
        grounds:
          - calculations.chain_configuration_unit_price_cents
          - entities.ChainConfiguration.fields.option_codes
          - entities.ChainConfiguration.fields.indicative_unit_price_cents
          - endpoints["GET /chain-configurations/{id}/price-quote"]
        distinguishing_aspect: |
          §0.5 Rule 2 mode (b): the scaffold pins "round each option uplift to whole cents
          independently in the order [SPLIT_TANK, HIGH_ALT, LEFT_HINGE, ENERGY_SAVER], then sum".
          With base_price_cents 1850020 the two orders differ by exactly one cent -- per-option
          rounding yields option_amount_cents 198878 and indicative_unit_price_cents 2055186, while
          summing the percentages first (0.1075) yields 198877 and 2055185.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "EquipmentModel FRY-900 with base_price_cents 1850020 (chosen so 0.075 and 0.0325 of the base both land on a fractional cent that rounds up)."
            - "ChainAccount CHN-1 with contracted_unit_volume 250 (0.08 tier)."
            - "ChainConfiguration CFG-1 with option_codes [SPLIT_TANK, HIGH_ALT], controls_package TOUCH_PRO, branding_kit FULL_WRAP, still DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /equipment-models"
              payload: { model_code: "FRY-900", name: "Fryer 900", category: "FRYER", energy_type: "ELECTRIC", base_price_cents: 1850020, supported_controls_packages: ["STANDARD_DIAL", "TOUCH_PRO", "CONNECT_PLUS"], rated_throughput_units_per_hour: 120 }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { model_id: $.data.id }
            - call: "POST /chain-accounts"
              payload: { account_code: "CHN-1", name: "Skillet Chain", contracted_unit_volume: 250 }
              as: ChannelManager
              captures: { chain_id: $.data.id, chain_v: $.data.version }
            - call: "POST /chain-configurations"
              payload: { chain_account_id: "${chain_id}", equipment_model_id: "${model_id}", config_code: "CFG-1", option_codes: ["SPLIT_TANK", "HIGH_ALT"], controls_package: "TOUCH_PRO", branding_kit: "FULL_WRAP", expected_chain_account_version: "${chain_v}" }
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { cfg_id: $.data.id }
          trigger:
            - call: "GET /chain-configurations/${cfg_id}/price-quote"
              payload: {}
              as: ChannelManager
              captures: { quoted: $.data.indicative_unit_price_cents }
          assert:
            - "ChainConfiguration.${cfg_id}.indicative_unit_price_cents == 2055186"
            - "${quoted} == 2055186"
            - "${quoted} != 2055185"
            - "ChainConfiguration.${cfg_id}.firm_unit_price_cents is null"

      - name: warranty_coinsurance_band_read_from_pre_claim_utilization_only
        grounds:
          - calculations.warranty_claim_adjudicated_amount_cents
          - entities.WarrantyClaim.fields.coinsurance_pct
          - entities.ConnectedUnit.fields.claims_paid_cents
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          §0.5 Rule 2 mode (c) -- a circular-looking dependency with a pinned evaluation order, a
          different mode from the mode (b) rounding-order instance. The coinsurance band is keyed
          on reserve utilization, which this very claim's payout mutates; the scaffold pins step 1
          to the PRE-claim ledger, so the second claim is adjudicated at the 0.10 band for 60300
          cents. Evaluating utilization after applying the claim's own gross would put it in the
          0.25 band and pay 50250.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "EquipmentModel FRY-900 with certification_posture LISTED."
            - "ConnectedUnit SN-1 on that model, service_tier BASE, coverage ACTIVE with reserve_initial_cents 250000."
            - "ServicePartner SP-1, parts_stocking_level FULL, AUTHORIZED, with two PASSED technician certifications on FRY-900."
            - "A first WarrantyClaim CLM-1 already APPROVED for 150000 cents, leaving reserve_balance_cents 100000 and claims_paid_cents 150000, i.e. utilization exactly 0.60."
            - "A second WarrantyClaim CLM-2 SUBMITTED with parts_cost_cents 40000 and labor_hours 3.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /equipment-models"
              payload: { model_code: "FRY-900", name: "Fryer 900", category: "FRYER", energy_type: "ELECTRIC", base_price_cents: 1850020, supported_controls_packages: ["STANDARD_DIAL", "TOUCH_PRO"], rated_throughput_units_per_hour: 120 }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { model_id: $.data.id }
            - call: "POST /certification-listings"
              payload: { equipment_model_id: "${model_id}", agency_code: "AGENCY_GAMMA", scopes: ["SANITATION", "ELECTRICAL"] }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { listing_id: $.data.id }
            - call: "POST /certification-listings/${listing_id}/submissions"
              payload: {}
              as: ComplianceEngineer
              as_user_id: "ce-1"
            - call: "POST /certification-listings/${listing_id}/agency-decisions"
              payload: { decision: "ACKNOWLEDGE_REVIEW" }
              as: ListingReviewer
              as_user_id: "lr-1"
            - call: "POST /certification-listings/${listing_id}/agency-decisions"
              payload: { decision: "GRANT" }
              as: ListingReviewer
              as_user_id: "lr-1"
            - call: "POST /connected-units"
              payload: { equipment_model_id: "${model_id}", serial_number: "SN-1", service_tier: "BASE" }
              as: ConnectedOpsEngineer
              captures: { unit_id: $.data.id }
            - call: "POST /connected-units/${unit_id}/coverage-actions"
              payload: { action: "ACTIVATE" }
              as: WarrantyAdjudicator
            - call: "POST /service-partners"
              payload: { partner_code: "SP-1", name: "Metro Service", region_code: "NE", parts_stocking_level: "FULL" }
              as: ChannelManager
              captures: { sp_id: $.data.id }
            - call: "POST /technician-certifications"
              payload: { service_partner_id: "${sp_id}", equipment_model_id: "${model_id}", technician_code: "T1", training_hours: 40 }
              as: ServicePartnerUser
              as_user_id: "${sp_id}"
              captures: { tc1_id: $.data.id }
            - call: "POST /technician-certifications/${tc1_id}/grade"
              payload: { exam_score: 88 }
              as: ChannelManager
            - call: "POST /technician-certifications"
              payload: { service_partner_id: "${sp_id}", equipment_model_id: "${model_id}", technician_code: "T2", training_hours: 36 }
              as: ServicePartnerUser
              as_user_id: "${sp_id}"
              captures: { tc2_id: $.data.id }
            - call: "POST /technician-certifications/${tc2_id}/grade"
              payload: { exam_score: 91 }
              as: ChannelManager
            - call: "POST /service-partners/${sp_id}/authorization"
              payload: { action: "PROVISION" }
              as: ChannelManager
            - call: "POST /service-partners/${sp_id}/authorization"
              payload: { action: "AUTHORIZE" }
              as: ChannelManager
            - call: "POST /warranty-claims"
              payload: { connected_unit_id: "${unit_id}", service_partner_id: "${sp_id}", technician_certification_id: "${tc1_id}", claim_code: "CLM-1", parts_cost_cents: 123000, labor_hours: 3.0 }
              as: ServicePartnerUser
              as_user_id: "${sp_id}"
              captures: { claim1_id: $.data.id }
            - call: "POST /warranty-claims/${claim1_id}/adjudication"
              payload: { decision: "APPROVE" }
              as: WarrantyAdjudicator
            - call: "POST /warranty-claims"
              payload: { connected_unit_id: "${unit_id}", service_partner_id: "${sp_id}", technician_certification_id: "${tc1_id}", claim_code: "CLM-2", parts_cost_cents: 40000, labor_hours: 3.0 }
              as: ServicePartnerUser
              as_user_id: "${sp_id}"
              captures: { claim2_id: $.data.id }
          trigger:
            - call: "POST /warranty-claims/${claim2_id}/adjudication"
              payload: { decision: "APPROVE" }
              as: WarrantyAdjudicator
              captures: { adj2: $.data.adjudicated_amount_cents, coins2: $.data.coinsurance_pct }
          assert:
            - "WarrantyClaim.${claim1_id}.coinsurance_pct == 0.0"
            - "WarrantyClaim.${claim1_id}.adjudicated_amount_cents == 150000"
            - "WarrantyClaim.${claim2_id}.coinsurance_pct == 0.1"
            - "WarrantyClaim.${claim2_id}.adjudicated_amount_cents == 60300"
            - "${adj2} != 50250"
            - "ConnectedUnit.${unit_id}.reserve_balance_cents == 39700"
            - "ConnectedUnit.${unit_id}.claims_paid_cents == 210300"

  - rule_id: non_linear_state_machine
    instances:
      - name: listing_conditions_revision_loop_reenters_submitted_and_caps_at_three
        grounds:
          - state_machines.CertificationListing.CONDITIONS_REQUESTED_to_SUBMITTED
          - state_machines.CertificationListing.UNDER_REVIEW_to_CONDITIONS_REQUESTED
          - entities.CertificationListing.fields.revision
          - validations[priority=40]
        distinguishing_aspect: |
          Non-linear shape = CYCLE on CertificationListing: SUBMITTED -> UNDER_REVIEW ->
          CONDITIONS_REQUESTED -> SUBMITTED revisits SUBMITTED, incrementing revision each lap, and
          the loop terminates at MAX_LISTING_REVISIONS == 3 with ERR_LISTING_REVISION_LIMIT rather
          than looping forever.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "EquipmentModel FRY-900 (ELECTRIC) with one AGENCY_GAMMA CertificationListing that has already completed three CONDITIONS_REQUESTED -> SUBMITTED laps, so status is CONDITIONS_REQUESTED with revision 3."
