          - state_machines.SiteBooking.RELEASED_via_agreement
        distinguishing_aspect: "Cancelling a SIGNED agreement is a three-target cross-entity cascade AND a deliberate asymmetry: occupied_bed_nights goes to 0 and billable_cents goes to 0 even though billable_bed_nights keeps the minimum-bed figure (100 beds x 26 nights = 2600), so the Season housing cost drops to 0 while the bed-night ledger still shows the contracted minimum."
