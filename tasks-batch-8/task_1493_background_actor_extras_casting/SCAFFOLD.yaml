# =============================================================================
# SCAFFOLD — Background Actor & Extras Casting (Central Casting style agency)
# §1.0–§1.7 seed tables. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Background Actor & Extras Casting (Central Casting style agency): casting call &
  wardrobe/look requirements, day-player booking & voucher issuance, union vs nonunion
  ratio compliance, call time, holding area & wrap-out tracking, overtime/meal penalty
  calculation, bumps (wardrobe/props/special ability) & pay adjustments, payroll company
  submission, no-show replacement pipeline

domain_name: background-extras-casting
api_prefix: /central-casting

complexity_profile:
  primary_archetype: quota_allocation        # union/nonunion slot pool competed, reserved, released
  secondary_archetype: compliance_audit      # union ratio enforcement, SoD, tamper-evident vouchers
  complexity_layers:
    - optimistic_concurrency                 # OCC on PayrollBatch.version and Voucher.version
    - dual_variant_calculation               # voucher estimate-vs-final; union projected-vs-actual
    - cascading_side_effects                 # no-show -> slots -> ratio; dispute -> batch -> production
    - selector_policy                        # standby pool eligibility/rank/tie-break/exclusion
  entity_topology: flat                      # peer entities, FK references, filtered-list GETs
  state_machine_shape: cyclic                # Voucher revision loop; ReplacementCase negotiation rounds
  relationship_patterns: [one_to_many, self_referential, cross_aggregate]
  role_model: segregation_of_duties          # bump requester != approver; batch submitter != acknowledger
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (13 entities, flat topology)
# =============================================================================
entities:
  - name: Production
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Production title" }
      - { name: studio_code, type: string, source: input, description: "Studio / signatory code" }
      - { name: payroll_company_name, type: string, source: input, description: "External payroll company receiving batches" }
      - { name: status, type: enum, source: system, description: "SETUP | ACTIVE | WRAPPED" }
      - { name: compliance_index, type: integer, source: computed, default: 100, description: "Starts 100; -15 per casting call wrapped NONCOMPLIANT; floor 0; gates publish (>= 30)" }
      - { name: payroll_exposure_cents, type: integer, source: computed, default: 0, description: "Sum of gross_total_cents over all PayrollBatch rows of this production; recomputed on every batch total change" }

  - name: BackgroundActor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name for payroll" }
      - { name: union_status, type: enum, source: input, description: "SAG_AFTRA | NONUNION" }
      - { name: special_abilities, type: array, source: input, default: [], description: "Free-form ability tags (e.g., horseback, ballroom)" }
      - { name: sizes, type: object, source: input, default: null, description: "Optional wardrobe sizes object" }
      - { name: status, type: enum, source: system, description: "REGISTERED | ELIGIBLE | SUSPENDED" }
      - { name: no_show_count, type: integer, source: computed, default: 0, description: "Lifetime no-shows; +1 per mark-no-show; reset to 0 on reinstate" }
      - { name: reliability_score, type: integer, source: computed, default: 100, description: "max(0, 100 - 20*no_show_count); standby ranking key" }

  - name: CastingCall
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id" }
      - { name: shoot_date, type: string, source: input, description: "ISO date YYYY-MM-DD of the shoot day" }
      - { name: general_call_time, type: datetime, source: input, description: "Default call time for bookings" }
      - { name: scheduled_duration_minutes, type: integer, source: input, description: "Planned workday length; drives expected_wrap_time and voucher estimate" }
      - { name: location, type: string, source: input, description: "Shoot location" }
      - { name: union_slots, type: integer, source: input, description: "Planned union headcount (>= 0)" }
      - { name: nonunion_slots, type: integer, source: input, description: "Planned nonunion headcount (>= 0)" }
      - { name: union_rate_cents, type: integer, source: input, description: "Daily base rate for SAG_AFTRA bookings" }
      - { name: nonunion_rate_cents, type: integer, source: input, description: "Daily base rate for NONUNION bookings" }
      - { name: wardrobe_notes, type: string, source: input, default: null, description: "Free-form wardrobe/look notes" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | LOCKED | SHOOTING | WRAPPED | CANCELLED" }
      - { name: approved_waiver_reduction, type: integer, source: computed, default: 0, description: "union_slot_reduction of the APPROVED RatioWaiver (0 if none); only one waiver may be APPROVED per call" }
      - { name: required_union_slots, type: integer, source: computed, description: "union_slots - approved_waiver_reduction" }
      - { name: slots_available, type: integer, source: computed, description: "union_slots + nonunion_slots - count(bookings in OFFERED, CONFIRMED, CHECKED_IN, WRAPPED)" }
      - { name: union_bookings_active, type: integer, source: computed, description: "Count of active bookings (OFFERED, CONFIRMED, CHECKED_IN, WRAPPED) with slot_type UNION" }
      - { name: nonunion_bookings_active, type: integer, source: computed, description: "Count of active bookings with slot_type NONUNION" }
      - { name: projected_union_count, type: integer, source: computed, description: "Union bookings in OFFERED | CONFIRMED | CHECKED_IN | WRAPPED (projection inclusion set)" }
      - { name: projected_compliant, type: boolean, source: computed, description: "projected_union_count >= required_union_slots; evaluated and stored at lock" }
      - { name: actual_union_checkins, type: integer, source: computed, description: "Union bookings in CHECKED_IN | WRAPPED (actual inclusion set); frozen at wrap" }
      - { name: actual_compliant, type: boolean, source: computed, default: null, description: "actual_union_checkins >= required_union_slots; computed at wrap, null before" }

  - name: LookRequirement
    parent: null
    common_fields: false
    fields:
      - { name: casting_call_id, type: string, source: input, description: "FK -> CastingCall.id" }
      - { name: category, type: enum, source: input, description: "WARDROBE_OWN | FORMAL_WEAR | PERIOD_COSTUME | HAIR_MAKEUP | PROPS_OWN | SPECIAL_ABILITY" }
      - { name: description, type: string, source: input, description: "e.g., '1920s tuxedo, actor-provided'" }
      - { name: bump_amount_cents, type: integer, source: input, description: "Suggested bump for satisfying this requirement (> 0)" }
      - { name: mandatory, type: boolean, source: input, default: false, description: "Whether the look item is mandatory for the call" }

  - name: HoldingArea
    parent: null
    common_fields: true
    fields:
      - { name: casting_call_id, type: string, source: input, description: "FK -> CastingCall.id" }
      - { name: name, type: string, source: input, description: "Area name (e.g., 'Basecamp A')" }
      - { name: capacity, type: integer, source: input, description: "Max simultaneous occupants (> 0)" }
      - { name: current_occupancy, type: integer, source: computed, default: 0, description: "Count of bookings in CHECKED_IN assigned to this area (WRAPPED releases)" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: casting_call_id, type: string, source: input, description: "FK -> CastingCall.id" }
      - { name: actor_id, type: string, source: input, description: "FK -> BackgroundActor.id" }
      - { name: replacement_case_id, type: string, source: system, default: null, description: "FK -> ReplacementCase.id; set when created by offer-next" }
      - { name: replaces_booking_id, type: string, source: system, default: null, description: "FK -> Booking.id; the vacated booking this one replaces (self-referential)" }
      - { name: is_replacement, type: boolean, source: system, default: false, description: "True iff created via replacement offer-next" }
      - { name: slot_type, type: enum, source: system, description: "UNION | NONUNION; snapshot of actor union_status at creation" }
      - { name: daily_rate_cents, type: integer, source: computed, description: "Snapshot at creation: union_rate_cents if actor SAG_AFTRA else nonunion_rate_cents" }
      - { name: call_time, type: datetime, source: input, default: null, description: "Per-booking override; defaults to CastingCall.general_call_time" }
      - { name: expected_wrap_time, type: datetime, source: computed, description: "call_time + scheduled_duration_minutes" }
      - { name: offer_expires_at, type: datetime, source: computed, description: "Normal bookings: call_time; replacement bookings: owning case deadline_at" }
      - { name: holding_area_id, type: string, source: input, default: null, description: "FK -> HoldingArea.id; assignable at check-in" }
      - { name: status, type: enum, source: system, description: "OFFERED | CONFIRMED | CHECKED_IN | WRAPPED | DECLINED | EXPIRED | CANCELLED | NO_SHOW" }

  - name: TimeEvent
    parent: null
    common_fields: false
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id" }
      - { name: event_type, type: enum, source: input, description: "CHECK_IN | MEAL_OUT | MEAL_IN | WRAP_OUT" }
      - { name: occurred_at, type: datetime, source: input, description: "When the event happened (logical past or present)" }
      - { name: corrects_event_id, type: string, source: input, default: null, description: "FK -> TimeEvent.id; marks this event as a correction superseding the referenced event" }
      - { name: recorded_by, type: string, source: system, description: "X-User-ID of the recording associate" }

  - name: Voucher
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; 1:1, created automatically at check-in" }
      - { name: payroll_batch_id, type: string, source: system, default: null, description: "FK -> PayrollBatch.id; set when added to a batch, cleared on remove/reject/dispute" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | DISPUTED | SUBMITTED | REJECTED | PAID" }
      - { name: check_in_at, type: datetime, source: computed, default: null, description: "Effective CHECK_IN from event replay" }
      - { name: wrap_out_at, type: datetime, source: computed, default: null, description: "Effective WRAP_OUT from event replay" }
      - { name: gross_elapsed_minutes, type: integer, source: computed, description: "wrap_out_at - check_in_at in minutes" }
      - { name: net_work_minutes, type: integer, source: computed, description: "gross_elapsed - sum of timely meal durations" }
      - { name: ot_tier1_minutes, type: integer, source: computed, description: "Minutes paid at 1.5x" }
      - { name: ot_tier2_minutes, type: integer, source: computed, description: "Minutes paid at 2.0x" }
      - { name: meal_penalty_count, type: integer, source: computed, description: "Late/missing meal violations, capped at 3" }
      - { name: base_wages_cents, type: integer, source: computed, description: "Rounded component: regular minutes at hourly rate" }
      - { name: ot_wages_cents, type: integer, source: computed, description: "Rounded components: tier1 + tier2 overtime wages" }
      - { name: meal_penalty_cents, type: integer, source: computed, description: "Per-violation rounded penalty times count" }
      - { name: bumps_total_cents, type: integer, source: computed, description: "Sum of APPROVED BumpAdjustment.amount_cents for this voucher" }
      - { name: gross_total_cents, type: integer, source: computed, description: "base + ot + meal_penalty + bumps (per-component rounding, then sum)" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID that issued" }
      - { name: adjusted_by_user_id, type: string, source: system, default: null, description: "X-User-ID of last adjust" }
      - { name: issued_at, type: datetime, source: system, default: null, description: "Logical timestamp of issue/re-issue" }

  - name: BumpAdjustment
    parent: null
    common_fields: true
    fields:
      - { name: voucher_id, type: string, source: input, description: "FK -> Voucher.id" }
      - { name: category, type: enum, source: input, description: "WARDROBE_OWN | FORMAL_WEAR | PERIOD_COSTUME | HAIR_MAKEUP | PROPS_OWN | SPECIAL_ABILITY" }
      - { name: amount_cents, type: integer, source: input, description: "Claimed bump amount (> 0)" }
      - { name: justification, type: string, source: input, default: null, description: "Free-form justification" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of creating associate (SoD anchor)" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of approving/rejecting director" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED" }

  - name: PayrollBatch
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id" }
      - { name: period_label, type: string, source: input, description: "Payroll period label, e.g. '2026-W33'" }
      - { name: status, type: enum, source: system, description: "OPEN | SUBMITTED | PARTIALLY_REJECTED | ACKNOWLEDGED" }
      - { name: gross_total_cents, type: integer, source: computed, default: 0, description: "Sum of gross_total_cents of vouchers currently in this batch" }
      - { name: voucher_count, type: integer, source: computed, default: 0, description: "Count of vouchers currently in this batch" }
      - { name: submitted_by_user_id, type: string, source: system, default: null, description: "X-User-ID that submitted (SoD anchor)" }
      - { name: acknowledged_by_user_id, type: string, source: system, default: null, description: "X-User-ID that recorded the payroll company response" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical timestamp of last submit" }

  - name: ReplacementCase
    parent: null
    common_fields: true
    fields:
      - { name: casting_call_id, type: string, source: system, description: "FK -> CastingCall.id" }
      - { name: original_booking_id, type: string, source: system, description: "FK -> Booking.id that no-showed / was cancelled on shoot day" }
      - { name: required_slot_type, type: enum, source: system, description: "UNION | NONUNION; copied from the vacated booking's slot_type" }
      - { name: reason, type: enum, source: system, description: "NO_SHOW | CANCELLATION" }
      - { name: deadline_at, type: datetime, source: computed, description: "original booking call_time + 120 minutes" }
      - { name: excluded_actor_ids, type: array, source: system, default: [], description: "Actors who declined or let an offer expire for this case; excluded from future selection" }
      - { name: offered_booking_id, type: string, source: system, default: null, description: "Currently outstanding replacement Booking id (CANDIDATE_OFFERED)" }
      - { name: offered_actor_id, type: string, source: system, default: null, description: "Actor of the outstanding offer" }
      - { name: attempts_count, type: integer, source: system, default: 0, description: "Offers made so far" }
      - { name: status, type: enum, source: system, description: "OPEN | CANDIDATE_OFFERED | FILLED | EXPIRED" }

  - name: StandbyEntry
    parent: null
    common_fields: true
    fields:
      - { name: casting_call_id, type: string, source: input, description: "FK -> CastingCall.id" }
      - { name: actor_id, type: string, source: input, description: "FK -> BackgroundActor.id" }
      - { name: slot_type, type: enum, source: system, description: "UNION | NONUNION; snapshot of actor union_status" }
      - { name: status, type: enum, source: system, description: "ACTIVE | WITHDRAWN | PROMOTED | EXPIRED" }

  - name: RatioWaiver
    parent: null
    common_fields: true
    fields:
      - { name: casting_call_id, type: string, source: input, description: "FK -> CastingCall.id" }
      - { name: union_slot_reduction, type: integer, source: input, description: "Requested reduction of required union slots (>= 0)" }
      - { name: justification, type: string, source: input, description: "Reason for the waiver request" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of requesting CastingDirector" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of deciding UnionRepresentative" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED | REVOKED" }

# =============================================================================
# §1.2 State Machine Table (10 machines)
# =============================================================================
state_machines:
  - entity: Production
    initial_state: SETUP
    terminal_states: [WRAPPED]
    transitions:
      - from: SETUP
        to: ACTIVE
        trigger: "POST /central-casting/productions/{id}/activate"
        actor: AgencyAdmin
        preconditions: ["Production in SETUP (else ERR_PRODUCTION_NOT_ACTIVE)"]
        side_effects: ["status ACTIVE; version incremented"]
      - from: ACTIVE
        to: WRAPPED
        trigger: "POST /central-casting/productions/{id}/wrap"
        actor: CastingDirector
        preconditions:
          - "Production ACTIVE (else ERR_PRODUCTION_NOT_ACTIVE)"
          - "Every CastingCall of this production in WRAPPED or CANCELLED (else ERR_PRODUCTION_NOT_WRAPPABLE)"
        side_effects:
          - "status WRAPPED; version incremented"
          - "All remaining ACTIVE StandbyEntry rows of its calls -> EXPIRED"

  - entity: BackgroundActor
    initial_state: REGISTERED
    terminal_states: []
    transitions:
      - from: REGISTERED
        to: ELIGIBLE
        trigger: "POST /central-casting/actors/{id}/verify"
        actor: AgencyAdmin
        preconditions: ["Actor REGISTERED (else ERR_ACTOR_NOT_ELIGIBLE)"]
        side_effects: ["version incremented"]
      - from: ELIGIBLE
        to: SUSPENDED
        trigger: "POST /central-casting/actors/{id}/suspend"
        actor: AgencyAdmin
        preconditions: ["Actor ELIGIBLE (else ERR_ACTOR_NOT_ELIGIBLE)"]
        side_effects:
          - "All of this actor's bookings in OFFERED -> EXPIRED (slots released to their calls)"
          - "All of this actor's bookings in CONFIRMED -> CANCELLED (slots released)"
          - "All of this actor's ACTIVE StandbyEntry rows -> WITHDRAWN"
          - "version incremented"
      - from: ELIGIBLE
        to: SUSPENDED
        trigger: "system (automatic when no_show_count reaches 3 via mark-no-show)"
        actor: system
        preconditions: ["no_show_count after increment == 3"]
        side_effects: ["Same cascades as manual suspend"]
        note: "Third link of the no-show cascade; auto-suspension"
      - from: SUSPENDED
        to: ELIGIBLE
        trigger: "POST /central-casting/actors/{id}/reinstate"
        actor: AgencyAdmin
        preconditions: ["Actor SUSPENDED (else ERR_ACTOR_NOT_ELIGIBLE)"]
        side_effects: ["no_show_count reset to 0", "reliability_score recomputed to 100", "version incremented"]

  - entity: CastingCall
    initial_state: DRAFT
    terminal_states: [WRAPPED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /central-casting/casting-calls/{id}/publish"
        actor: CastingDirector
        preconditions:
          - "Call DRAFT (else ERR_CALL_INVALID_STATE)"
          - "Production ACTIVE (else ERR_PRODUCTION_NOT_ACTIVE)"
          - "Production.compliance_index >= 30 (else ERR_COMPLIANCE_INDEX_TOO_LOW)"
          - "union_slots + nonunion_slots > 0 (else ERR_VALIDATION)"
        side_effects: ["version incremented"]
      - from: PUBLISHED
        to: LOCKED
        trigger: "POST /central-casting/casting-calls/{id}/lock"
        actor: CastingDirector
        preconditions:
          - "Call PUBLISHED (else ERR_CALL_INVALID_STATE)"
          - "projected_union_count >= required_union_slots (else ERR_UNION_RATIO_SHORTFALL)"
        side_effects:
          - "projected_compliant computed and stored (true on success)"
          - "version incremented"
      - from: LOCKED
        to: SHOOTING
        trigger: "POST /central-casting/casting-calls/{id}/start-shooting"
        actor: CastingAssociate
        preconditions:
          - "Call LOCKED (else ERR_CALL_INVALID_STATE)"
          - "Logical clock date == shoot_date (else ERR_SHOOT_DATE_MISMATCH)"
        side_effects: ["version incremented"]
      - from: SHOOTING
        to: WRAPPED
        trigger: "POST /central-casting/casting-calls/{id}/wrap"
        actor: CastingAssociate
        preconditions:
          - "Call SHOOTING (else ERR_CALL_INVALID_STATE)"
          - "All bookings terminal (WRAPPED | DECLINED | EXPIRED | CANCELLED | NO_SHOW) (else ERR_CALL_INVALID_STATE)"
          - "All ReplacementCases of this call in FILLED or EXPIRED (else ERR_CALL_INVALID_STATE)"
        side_effects:
          - "actual_union_checkins frozen = count(union bookings in CHECKED_IN|WRAPPED at wrap; bookings still CHECKED_IN are included, but wrap precondition forces them WRAPPED first)"
          - "actual_compliant = (actual_union_checkins >= required_union_slots)"
          - "If actual_compliant false: Production.compliance_index -= 15 (floor 0), Production.version incremented"
          - "Remaining ACTIVE StandbyEntry rows -> EXPIRED"
          - "version incremented"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /central-casting/casting-calls/{id}/cancel"
        actor: CastingDirector
        preconditions: ["Call in DRAFT | PUBLISHED | LOCKED (else ERR_CALL_INVALID_STATE)"]
        side_effects:
          - "All bookings in OFFERED | CONFIRMED -> CANCELLED; slots_available released for each"
          - "All ACTIVE StandbyEntry rows -> EXPIRED"
          - "All REQUESTED RatioWaiver rows -> REVOKED"
          - "version incremented"
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /central-casting/casting-calls/{id}/cancel"
        actor: CastingDirector
        preconditions: ["Same as DRAFT -> CANCELLED"]
        side_effects: ["Same cascade as DRAFT -> CANCELLED"]
      - from: LOCKED
        to: CANCELLED
        trigger: "POST /central-casting/casting-calls/{id}/cancel"
        actor: CastingDirector
        preconditions: ["Same as DRAFT -> CANCELLED"]
        side_effects: ["Same cascade as DRAFT -> CANCELLED"]

  - entity: Booking
    initial_state: OFFERED
    terminal_states: [WRAPPED, DECLINED, EXPIRED, CANCELLED, NO_SHOW]
    transitions:
      - from: OFFERED
        to: CONFIRMED
        trigger: "POST /central-casting/bookings/{id}/accept"
        actor: BackgroundActor
        preconditions:
          - "Caller owns booking (booking.actor_id == X-User-ID, else ERR_FORBIDDEN_OWNERSHIP)"
          - "Booking OFFERED (else ERR_BOOKING_INVALID_STATE)"
          - "Acceptance window: (is_replacement == false AND CastingCall.status == PUBLISHED) OR (is_replacement == true AND CastingCall.status == SHOOTING) (else ERR_CALL_NOT_ACCEPTING)"
        side_effects:
          - "If is_replacement: owning ReplacementCase -> FILLED; the actor's StandbyEntry for this call -> PROMOTED"
          - "version incremented"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /central-casting/bookings/{id}/decline"
        actor: BackgroundActor
        preconditions:
          - "Caller owns booking (else ERR_FORBIDDEN_OWNERSHIP)"
          - "Booking OFFERED (else ERR_BOOKING_INVALID_STATE)"
        side_effects:
          - "CastingCall.slots_available += 1; union/nonunion active counts recomputed; call version incremented"
          - "If is_replacement: owning ReplacementCase -> OPEN; actor appended to case.excluded_actor_ids; case.offered_booking_id/offered_actor_id cleared"
          - "version incremented"
      - from: OFFERED
        to: EXPIRED
        trigger: "system (POST /_clock/set_current_utc advancing logical clock past offer_expires_at)"
        actor: system
        preconditions: ["Logical clock > offer_expires_at"]
        side_effects:
          - "CastingCall.slots_available += 1; call version incremented"
          - "If is_replacement: owning ReplacementCase -> OPEN if clock <= case.deadline_at else EXPIRED; actor appended to excluded_actor_ids; offered fields cleared"
          - "version incremented"
      - from: OFFERED
        to: CANCELLED
        trigger: "POST /central-casting/bookings/{id}/cancel"
        actor: CastingAssociate
        preconditions: ["Booking OFFERED or CONFIRMED (else ERR_BOOKING_INVALID_STATE)"]
        side_effects:
          - "CastingCall.slots_available += 1; call version incremented"
          - "If is_replacement: owning ReplacementCase -> OPEN (if still CANDIDATE_OFFERED), actor excluded"
          - "version incremented"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /central-casting/bookings/{id}/cancel"
        actor: CastingAssociate
        preconditions: ["Booking OFFERED or CONFIRMED (else ERR_BOOKING_INVALID_STATE)"]
        side_effects:
          - "CastingCall.slots_available += 1; call version incremented"
          - "If CastingCall.status == SHOOTING: auto-create ReplacementCase (reason CANCELLATION, required_slot_type = this booking's slot_type)"
          - "version incremented"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /central-casting/bookings/{id}/check-in"
        actor: CastingAssociate
        preconditions:
          - "Booking CONFIRMED (else ERR_BOOKING_INVALID_STATE)"
          - "Actor ELIGIBLE (else ERR_ACTOR_NOT_ELIGIBLE)"
          - "CastingCall SHOOTING (else ERR_CALL_INVALID_STATE)"
          - "If holding_area_id supplied: area belongs to this call and current_occupancy < capacity (else ERR_HOLDING_AREA_FULL)"
        side_effects:
          - "TimeEvent CHECK_IN appended at logical clock"
          - "Voucher auto-created in DRAFT for this booking (1:1)"
          - "If holding_area_id: area.current_occupancy += 1; area version incremented"
          - "version incremented"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /central-casting/bookings/{id}/mark-no-show"
        actor: CastingAssociate
        preconditions:
          - "Booking CONFIRMED (else ERR_BOOKING_INVALID_STATE)"
          - "CastingCall SHOOTING (else ERR_CALL_INVALID_STATE)"
          - "Logical clock >= booking.call_time + 60 minutes (else ERR_NO_SHOW_TOO_EARLY)"
        side_effects:
          - "Cascade hop 1 -> CastingCall: slots_available += 1; projected/actual union counts recomputed; call version incremented"
          - "Cascade hop 1 -> ReplacementCase: auto-created OPEN (reason NO_SHOW, required_slot_type = vacated slot_type, deadline_at = call_time + 120m)"
          - "Cascade hop 1 -> BackgroundActor: no_show_count += 1; reliability_score recomputed; actor version incremented"
          - "Cascade hop 2 (from Actor increment): if no_show_count == 3, actor auto-transitions ELIGIBLE -> SUSPENDED with full suspension cascade"
          - "version incremented"
      - from: CHECKED_IN
        to: WRAPPED
        trigger: "POST /central-casting/bookings/{id}/wrap-out"
        actor: CastingAssociate
        preconditions:
          - "Booking CHECKED_IN (else ERR_BOOKING_INVALID_STATE)"
          - "CastingCall SHOOTING (else ERR_CALL_INVALID_STATE)"
        side_effects:
          - "TimeEvent WRAP_OUT appended at logical clock"
          - "If holding_area_id set: area.current_occupancy -= 1; area version incremented"
          - "version incremented"

  - entity: Voucher
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /central-casting/vouchers/{id}/issue"
        actor: CastingAssociate
        preconditions:
          - "Voucher DRAFT (else ERR_VOUCHER_INVALID_STATE)"
          - "Booking WRAPPED (else ERR_BOOKING_NOT_WRAPPED)"
        side_effects:
          - "voucher_gross_final calculated from TimeEvent replay + APPROVED bumps; all computed fields stored"
          - "issued_by_user_id, issued_at set; version incremented"
      - from: ISSUED
        to: ISSUED
        trigger: "POST /central-casting/vouchers/{id}/adjust"
        actor: CastingAssociate
        preconditions:
          - "Voucher in ISSUED | DISPUTED | REJECTED (else ERR_VOUCHER_INVALID_STATE)"
          - "expected_voucher_version == voucher.version (else ERR_STALE_VOUCHER_VERSION)"
        side_effects:
          - "voucher_gross_final recomputed over current effective events + current APPROVED bumps"
          - "adjusted_by_user_id set; version incremented by 1"
        note: "Self-loop refresh; OCC-guarded"
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /central-casting/vouchers/{id}/adjust"
        actor: CastingAssociate
        preconditions: ["Same as ISSUED -> ISSUED adjust"]
        side_effects: ["Same as ISSUED -> ISSUED adjust"]
      - from: REJECTED
        to: ISSUED
        trigger: "POST /central-casting/vouchers/{id}/adjust"
        actor: CastingAssociate
        preconditions: ["Same as ISSUED -> ISSUED adjust"]
        side_effects: ["Same as ISSUED -> ISSUED adjust"]
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /central-casting/vouchers/{id}/dispute"
        actor: BackgroundActor
        preconditions:
          - "Caller owns the underlying booking (else ERR_FORBIDDEN_OWNERSHIP)"
          - "Voucher ISSUED (else ERR_VOUCHER_INVALID_STATE)"
        side_effects:
          - "Cascade hop 1 -> PayrollBatch: if payroll_batch_id set and batch OPEN, voucher removed from batch; batch.gross_total_cents and voucher_count recomputed; batch version incremented; payroll_batch_id cleared"
          - "Cascade hop 2 -> Production: payroll_exposure_cents recomputed from all batches; production version incremented"
          - "version incremented"
      - from: ISSUED
        to: SUBMITTED
        trigger: "system (POST /central-casting/payroll-batches/{id}/submit on its batch)"
        actor: system
        preconditions: ["Voucher is a member of the batch being submitted"]
        side_effects: ["version incremented"]
      - from: SUBMITTED
        to: PAID
        trigger: "system (batch acknowledge with outcome ACCEPTED, voucher not in rejected_voucher_ids)"
        actor: system
        preconditions: []
        side_effects: ["version incremented"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "system (batch acknowledge with voucher listed in rejected_voucher_ids)"
        actor: system
        preconditions: []
        side_effects:
          - "Voucher removed from batch; payroll_batch_id cleared; batch gross_total_cents/voucher_count recomputed; batch version incremented"
          - "Production.payroll_exposure_cents recomputed; production version incremented"
          - "version incremented"

  - entity: BumpAdjustment
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /central-casting/bump-adjustments/{id}/approve"
        actor: CastingDirector
        preconditions:
          - "Bump PENDING (else ERR_BUMP_INVALID_STATE)"
          - "decided_by (X-User-ID) != requested_by_user_id (else ERR_SOD_SELF_APPROVAL)"
          - "Voucher in DRAFT | ISSUED | DISPUTED | REJECTED (else ERR_BUMP_VOUCHER_LOCKED)"
        side_effects:
          - "If voucher ISSUED: voucher bumps_total_cents and gross_total_cents recomputed; voucher version incremented"
          - "If voucher in an OPEN batch: batch.gross_total_cents recomputed; batch version incremented; Production.payroll_exposure_cents recomputed"
          - "version incremented"
      - from: PENDING
        to: REJECTED
        trigger: "POST /central-casting/bump-adjustments/{id}/reject"
        actor: CastingDirector
        preconditions:
          - "Bump PENDING (else ERR_BUMP_INVALID_STATE)"
          - "decided_by != requested_by_user_id (else ERR_SOD_SELF_APPROVAL)"
        side_effects: ["version incremented"]

  - entity: PayrollBatch
    initial_state: OPEN
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /central-casting/payroll-batches/{id}/submit"
        actor: PayrollCoordinator
        preconditions:
          - "Batch OPEN or PARTIALLY_REJECTED (else ERR_BATCH_INVALID_STATE)"
          - "Production in ACTIVE | WRAPPED (else ERR_PRODUCTION_NOT_ACTIVE)"
          - "voucher_count >= 1 (else ERR_BATCH_EMPTY)"
          - "All member vouchers ISSUED (invariant maintained by add-item/dispute removal)"
        side_effects:
          - "All member vouchers ISSUED -> SUBMITTED; each voucher version incremented"
          - "submitted_by_user_id, submitted_at set; version incremented"
      - from: PARTIALLY_REJECTED
        to: SUBMITTED
        trigger: "POST /central-casting/payroll-batches/{id}/submit"
        actor: PayrollCoordinator
        preconditions: ["Same as OPEN -> SUBMITTED"]
        side_effects: ["Same as OPEN -> SUBMITTED"]
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /central-casting/payroll-batches/{id}/acknowledge (outcome ACCEPTED, empty rejected_voucher_ids)"
        actor: PayrollCoordinator
        preconditions:
          - "Batch SUBMITTED (else ERR_BATCH_INVALID_STATE)"
          - "acknowledger X-User-ID != submitted_by_user_id (else ERR_SOD_SELF_ACKNOWLEDGE)"
        side_effects:
          - "All member vouchers SUBMITTED -> PAID; each voucher version incremented"
          - "acknowledged_by_user_id set; version incremented"
      - from: SUBMITTED
        to: PARTIALLY_REJECTED
        trigger: "POST /central-casting/payroll-batches/{id}/acknowledge (outcome REJECTED with non-empty rejected_voucher_ids)"
        actor: PayrollCoordinator
        preconditions:
          - "Batch SUBMITTED (else ERR_BATCH_INVALID_STATE)"
          - "acknowledger != submitted_by_user_id (else ERR_SOD_SELF_ACKNOWLEDGE)"
          - "Every id in rejected_voucher_ids is a SUBMITTED member voucher (else ERR_VOUCHER_NOT_SUBMITTABLE)"
        side_effects:
          - "Listed vouchers SUBMITTED -> REJECTED, removed from batch, payroll_batch_id cleared"
          - "gross_total_cents and voucher_count recomputed; Production.payroll_exposure_cents recomputed"
          - "acknowledged_by_user_id set; version incremented"
      - from: PARTIALLY_REJECTED
        to: OPEN
        trigger: "system (POST /central-casting/payroll-batches/{id}/items adding a voucher while batch PARTIALLY_REJECTED)"
        actor: system
        preconditions: []
        side_effects: ["Batch returns to OPEN for editing; version incremented"]
        note: "Resubmission cycle: PARTIALLY_REJECTED -> OPEN (on add) -> SUBMITTED"

  - entity: ReplacementCase
    initial_state: OPEN
    terminal_states: [FILLED, EXPIRED]
    transitions:
      - from: OPEN
        to: CANDIDATE_OFFERED
        trigger: "POST /central-casting/replacement-cases/{id}/offer-next (standby pool non-empty)"
        actor: CastingAssociate
        preconditions:
          - "Case OPEN (else ERR_CASE_INVALID_STATE)"
          - "CastingCall SHOOTING (else ERR_CALL_INVALID_STATE)"
          - "Eligible standby pool non-empty (else case auto-EXPIRED, no error)"
        side_effects:
          - "Replacement Booking created OFFERED (is_replacement true, call_time = original booking's call_time, slot consumed: slots_available -= 1, replaces_booking_id = original_booking_id, offer_expires_at = deadline_at)"
          - "offered_booking_id/offered_actor_id set; attempts_count += 1"
          - "CastingCall version incremented"
          - "version incremented"
      - from: OPEN
        to: EXPIRED
        trigger: "POST /central-casting/replacement-cases/{id}/offer-next (pool empty) OR POST .../expire OR system clock sweep past deadline_at"
        actor: CastingAssociate | system
        preconditions: ["Case OPEN (manual expire/offer-next) or clock > deadline_at (sweep)"]
        side_effects: ["version incremented"]
      - from: CANDIDATE_OFFERED
        to: OPEN
        trigger: "system (replacement Booking declined or expired)"
        actor: system
        preconditions: []
        side_effects:
          - "Declining/expiring actor appended to excluded_actor_ids; offered fields cleared"
          - "version incremented"
        note: "Negotiation-round cycle: OPEN -> CANDIDATE_OFFERED -> OPEN"
      - from: CANDIDATE_OFFERED
        to: FILLED
        trigger: "system (replacement Booking accepted -> CONFIRMED)"
        actor: system
        preconditions: []
        side_effects:
          - "StandbyEntry of promoted actor -> PROMOTED"
          - "version incremented"
      - from: CANDIDATE_OFFERED
        to: EXPIRED
        trigger: "system (clock sweep past deadline_at while offer outstanding)"
        actor: system
        preconditions: ["Logical clock > deadline_at"]
        side_effects:
          - "Outstanding offer Booking -> EXPIRED (slot released)"
          - "version incremented"

  - entity: StandbyEntry
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN, PROMOTED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /central-casting/standby-entries/{id}/withdraw"
        actor: BackgroundActor | CastingAssociate
        preconditions:
          - "If caller is BackgroundActor: entry.actor_id == X-User-ID (else ERR_FORBIDDEN_OWNERSHIP)"
          - "Entry ACTIVE (else ERR_VALIDATION state: ERR_BOOKING_INVALID_STATE not applicable; use ERR_CASE_INVALID_STATE analogue ERR_STANDBY_NOT_ACTIVE)"
        side_effects: ["version incremented"]
      - from: ACTIVE
        to: PROMOTED
        trigger: "system (standby actor's replacement booking CONFIRMED)"
        actor: system
        preconditions: []
        side_effects: ["version incremented"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (owning CastingCall WRAPPED or CANCELLED)"
        actor: system
        preconditions: []
        side_effects: ["version incremented"]

  - entity: RatioWaiver
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED, REVOKED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /central-casting/ratio-waivers/{id}/approve"
        actor: UnionRepresentative
        preconditions:
          - "Waiver REQUESTED (else ERR_WAIVER_INVALID_STATE)"
          - "CastingCall in DRAFT | PUBLISHED (else ERR_CALL_INVALID_STATE)"
          - "No other APPROVED waiver exists for this call (else ERR_VALIDATION)"
        side_effects:
          - "CastingCall.approved_waiver_reduction = union_slot_reduction; required_union_slots recomputed; call version incremented"
          - "version incremented"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /central-casting/ratio-waivers/{id}/deny"
        actor: UnionRepresentative
        preconditions: ["Waiver REQUESTED (else ERR_WAIVER_INVALID_STATE)"]
        side_effects: ["version incremented"]
      - from: REQUESTED
        to: REVOKED
        trigger: "system (owning CastingCall cancelled)"
        actor: system
        preconditions: []
        side_effects: ["version incremented"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version; true races only)
# =============================================================================
concurrency_rules:
  - rule_id: batch-item-add-stale-batch
    parent_entity: PayrollBatch
    write_endpoint: "POST /central-casting/payroll-batches/{id}/items"
    occ_field: expected_batch_version
    description: |
      Adding a voucher to a PayrollBatch whose version has advanced since the
      client last observed it is rejected with ERR_STALE_BATCH_VERSION. Adding a
      second, different voucher to the same batch is legitimate product behavior,
      so a stale expected_batch_version (the client's view predates the first
      add) is the only divergence signal; the request is rejected as stale.
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412
  - rule_id: voucher-adjust-stale-voucher
    parent_entity: Voucher
    write_endpoint: "POST /central-casting/vouchers/{id}/adjust"
    occ_field: expected_voucher_version
    description: |
      Adjusting (recomputing and re-issuing) a Voucher whose version has advanced
      since the client last observed it is rejected with ERR_STALE_VOUCHER_VERSION.
      Re-adjustment from ISSUED is legitimate (new time-event corrections or bump
      approvals arrive), so a stale expected_voucher_version is the only signal
      that the client based its adjustment on a superseded computation.
    error_id: ERR_STALE_VOUCHER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: booking_rate_snapshot
    trigger: "Booking creation (POST /bookings and replacement offer-next)"
    algorithm: aggregation
    formula: |
      daily_rate_cents = (actor.union_status == SAG_AFTRA) ? casting_call.union_rate_cents
                                                           : casting_call.nonunion_rate_cents
      slot_type        = (actor.union_status == SAG_AFTRA) ? UNION : NONUNION
      Snapshotted at creation; later rate or union_status edits do NOT retro-change bookings.
    input_set: "The actor and casting call referenced by the new booking"
    precision: "integer cents"

  - name: event_timeline_replay
    trigger: "voucher_gross_final and voucher_gross_estimate recompute"
    algorithm: chronological
    formula: |
      1. Effective event set: take all TimeEvents of the booking; an event E is EXCLUDED if
         another event E2 exists with E2.corrects_event_id == E.id (E2 supersedes E).
         A correction event is itself effective unless later corrected (chain substitution).
      2. Order effective events by occurred_at ASC, tie-break created_at ASC.
      3. Derive: check_in_at = occurred_at of first effective CHECK_IN;
         wrap_out_at = occurred_at of last effective WRAP_OUT;
         meals = consecutive (MEAL_OUT -> next MEAL_IN) pairs in the ordered stream.
      Sequence validation (else ERR_TIME_EVENT_INVALID at event-create time):
        exactly one effective CHECK_IN; at most one effective WRAP_OUT and it must follow
        CHECK_IN; MEAL_IN requires a preceding unmatched MEAL_OUT; no event before CHECK_IN.
    input_set: "All TimeEvent rows with booking_id = booking, regardless of created order"
    precision: "minute granularity"

  - name: net_work_minutes
    trigger: "voucher_gross_final recompute"
    algorithm: chronological
    formula: |
      PINNED EVALUATION ORDER (breaks the apparent meal-timeliness <-> deduction loop):
      (1) gross_elapsed_minutes = wrap_out_at - check_in_at (minutes).
      (2) Meal timeliness is judged on GROSS ELAPSED time, never on net:
          first meal timely  iff (meal_out_1 - check_in_at) <= MEAL_WINDOW_MINUTES;
          meal k (k>1) timely iff (meal_out_k - meal_in_{k-1}) <= MEAL_WINDOW_MINUTES.
      (3) meal_penalty_count = (# of out-of-window meals)
                               + (1 if gross_elapsed_minutes > MEAL_WINDOW_MINUTES AND zero meals)
          capped at MEAL_PENALTY_CAP.
      (4) net_work_minutes = gross_elapsed_minutes
                             - sum(duration of TIMELY meals only)
          Penalty (non-timely) meals are paid time and are NOT deducted.
    input_set: "Effective event timeline of the booking"
    constants:
      MEAL_WINDOW_MINUTES: 360
      MEAL_PENALTY_CAP: 3
    precision: "integer minutes; boundary: exactly 360 elapsed minutes is TIMELY (<=)"

  - name: voucher_gross_final
    trigger: "POST /vouchers/{id}/issue and POST /vouchers/{id}/adjust"
    algorithm: tiered_pricing
    formula: |
      hourly = booking.daily_rate_cents / 8          # fractional cents allowed mid-formula
      n = net_work_minutes
      UNION actor:   reg = min(n, 480); ot1 = min(max(n-480, 0), 120); ot2 = max(n-600, 0)
      NONUNION actor: reg = min(n, 480); ot1 = min(max(n-480, 0), 240); ot2 = max(n-720, 0)
      PINNED ROUNDING ORDER (round-per-component THEN sum; NOT sum-then-round):
        base_wages_cents   = round_half_up_to_cents(reg / 60 * hourly)
        ot_wages_cents     = round_half_up_to_cents(ot1 / 60 * hourly * 1.5)
                           + round_half_up_to_cents(ot2 / 60 * hourly * 2.0)
        meal_penalty_cents = round_half_up_to_cents(0.5 * hourly) * meal_penalty_count
        bumps_total_cents  = sum(amount_cents of APPROVED BumpAdjustments of this voucher)
        gross_total_cents  = base_wages_cents + ot_wages_cents + meal_penalty_cents + bumps_total_cents
      Voucher also stores net_work_minutes, ot_tier1_minutes (=ot1), ot_tier2_minutes (=ot2).
    input_set: "Booking (WRAPPED) + its effective TimeEvents + APPROVED BumpAdjustments only"
    constants:
      REGULAR_MINUTES: 480
      UNION_OT1_CAP_MINUTES: 120
      UNION_OT2_FLOOR_MINUTES: 600
      NONUNION_OT1_CAP_MINUTES: 240
      NONUNION_OT2_FLOOR_MINUTES: 720
      OT1_MULTIPLIER: 1.5
      OT2_MULTIPLIER: 2.0
      HOURS_PER_DAY_RATE: 8
    precision: "integer cents; round_half_up per component, then sum"
    variants:
      - name: voucher_gross_estimate
        when: "GET /vouchers/{id}/estimate (any pre-PAID state)"
        difference: "Forward-looking: uses scheduled wrap (call_time + scheduled_duration_minutes) instead of actual events, assumes exactly one timely 30-minute meal (zero penalties), and includes PENDING as well as APPROVED bumps."

  - name: voucher_gross_estimate
    trigger: "GET /central-casting/vouchers/{id}/estimate"
    algorithm: forward_looking
    formula: |
      scheduled_net = scheduled_duration_minutes - ASSUMED_MEAL_MINUTES   (floor 0)
      Run the voucher_gross_final tier formula with n = scheduled_net,
      meal_penalty_count = 0, bumps = sum(amount_cents of PENDING and APPROVED bumps).
      Same rounding order as final (per-component, then sum).
    input_set: "Voucher's booking call_time + CastingCall.scheduled_duration_minutes + PENDING|APPROVED bumps"
    constants:
      ASSUMED_MEAL_MINUTES: 30
    precision: "integer cents; round_half_up per component, then sum"
    variants:
      - name: voucher_gross_final
        when: "At issue/adjust time"
        difference: "Chronological replay of actual effective TimeEvents; APPROVED bumps only; real meal penalties."

  - name: union_ratio_projected
    trigger: "CastingCall lock (projected_compliant is evaluated AT LOCK and frozen as a snapshot; projected_union_count recomputes live on every booking mutation)"
    algorithm: threshold
    formula: |
      required_union_slots = union_slots - approved_waiver_reduction
      projected_union_count = count(bookings with status IN {OFFERED, CONFIRMED, CHECKED_IN, WRAPPED}
                                    and slot_type == UNION)   # live field
      projected_compliant = (projected_union_count >= required_union_slots)
      Frozen snapshot semantics: projected_compliant stores the lock-time verdict and does
      NOT change on later booking mutations; actual_compliant is computed at wrap from the
      narrower actual inclusion set.
      Lock is rejected with ERR_UNION_RATIO_SHORTFALL when projected_compliant is false.
    input_set: "Non-terminal bookings of the call (OFFERED, CONFIRMED, CHECKED_IN, WRAPPED)"
    precision: "integer counts; boundary: exactly required_union_slots passes (>=)"
    variants:
      - name: union_ratio_actual
        when: "CastingCall wrap"
        difference: "Actual inclusion set is narrower: bookings in {CHECKED_IN, WRAPPED} only. A no-show after lock leaves projected_compliant true but actual_compliant false."

  - name: union_ratio_actual
    trigger: "POST /casting-calls/{id}/wrap"
    algorithm: threshold
    formula: |
      actual_union_checkins = count(bookings with status IN {CHECKED_IN, WRAPPED}
                                    and slot_type == UNION)   # frozen at wrap
      actual_compliant = (actual_union_checkins >= required_union_slots)
      If false: Production.compliance_index = max(0, compliance_index - 15).
    input_set: "Bookings of the call in CHECKED_IN | WRAPPED at wrap time"
    precision: "integer counts; boundary: exactly required_union_slots passes (>=)"

  - name: slot_accounting
    trigger: "Booking create / accept-independent lifecycle: decline, cancel, expire, no-show (release); offer-next (consume)"
    algorithm: aggregation
    formula: |
      INVARIANT (compensating-action pair create<->release):
        union_slots + nonunion_slots == slots_available
          + count(bookings in {OFFERED, CONFIRMED, CHECKED_IN, WRAPPED})
      Create/offer-next: slots_available -= 1.
      decline / cancel / expire / mark-no-show: slots_available += 1.
      Recompute after each mutation; the invariant must hold after every request.
    input_set: "All bookings of the call"
    precision: "integer"

  - name: union_slot_eligibility
    trigger: "Booking creation"
    algorithm: constraint_propagation
    formula: |
      total_consumed = union_bookings_active + nonunion_bookings_active
      UNION actor:     allowed iff total_consumed < union_slots + nonunion_slots
                       (union actors may spill into nonunion slots; else ERR_NO_SLOT_AVAILABLE)
      NONUNION actor:  allowed iff nonunion_bookings_active < nonunion_slots + approved_waiver_reduction
                       AND total_consumed < union_slots + nonunion_slots
                       (else ERR_NO_NONUNION_SLOT)
    input_set: "Active bookings (OFFERED, CONFIRMED, CHECKED_IN, WRAPPED) of the call"
    precision: "integer counts"

  - name: reliability_score
    trigger: "mark-no-show (+1 no_show_count) and reinstate (reset)"
    algorithm: aggregation
    formula: |
      reliability_score = max(0, 100 - 20 * no_show_count)
      Auto-suspension threshold: when no_show_count reaches NO_SHOW_SUSPEND_THRESHOLD,
      actor transitions ELIGIBLE -> SUSPENDED (with booking/standby cascades).
    input_set: "The actor's lifetime no_show_count"
    constants:
      NO_SHOW_PENALTY: 20
      NO_SHOW_SUSPEND_THRESHOLD: 3
    precision: "integer; boundary: reaching exactly 3 suspends"

  - name: standby_selection
    trigger: "POST /replacement-cases/{id}/offer-next"
    algorithm: weighted_scoring
    formula: |
      Eligibility filter (ALL must hold):
        - StandbyEntry of this CastingCall with status == ACTIVE
        - entry.slot_type == case.required_slot_type
        - actor.status == ELIGIBLE
        - actor.id NOT IN case.excluded_actor_ids
        - actor has no booking in {OFFERED, CONFIRMED, CHECKED_IN} for this call
      Ranking: actor.reliability_score DESC; tie-break: StandbyEntry.created_at ASC (never id).
      Fallback: empty candidate set -> case transitions OPEN -> EXPIRED, HTTP 200, no booking created.
      Exclusion semantics on retry: declined/expired candidates are appended to
      excluded_actor_ids and never re-offered for this case.
    input_set: "StandbyEntry rows of the call"
    precision: "deterministic total order"

  - name: payroll_batch_gross
    trigger: "add-item, remove-item, voucher dispute auto-removal, batch acknowledge with rejections, bump approval touching a batched voucher"
    algorithm: aggregation
    formula: |
      INVARIANT: gross_total_cents == sum(gross_total_cents of vouchers with
                 payroll_batch_id == batch.id)   after every mutation.
      voucher_count == count of those vouchers.
      Production.payroll_exposure_cents == sum(gross_total_cents over ALL batches
                 of the production); recomputed whenever any batch total changes.
    input_set: "Vouchers currently referencing the batch"
    precision: "integer cents"

  - name: compliance_index
    trigger: "CastingCall wrap with actual_compliant == false"
    algorithm: threshold
    formula: |
      On each call wrap: if actual_compliant == false: compliance_index = max(0, compliance_index - 15)
      Gating: POST /casting-calls/{id}/publish requires production.compliance_index >= 30
              (else ERR_COMPLIANCE_INDEX_TOO_LOW). Boundary: exactly 30 passes (>=).
    input_set: "The wrapping call's actual_compliant flag"
    constants:
      NONCOMPLIANT_WRAP_PENALTY: 15
      PUBLISH_GATE_MINIMUM: 30
    precision: "integer; floor 0"

  - name: holding_capacity_check
    trigger: "POST /bookings/{id}/check-in with holding_area_id"
    algorithm: threshold
    formula: |
      current_occupancy = count(bookings with holding_area_id == area.id and status == CHECKED_IN)
      Check-in allowed iff current_occupancy < capacity
      (i.e., occupancy AFTER this check-in <= capacity; boundary: occupancy == capacity rejects).
      wrap-out decrements current_occupancy; both mutations bump area.version.
    input_set: "CHECKED_IN bookings assigned to the area"
    precision: "integer count; strict < before increment"

  - name: turnaround_conflict_check
    trigger: "Booking creation (normal and replacement)"
    algorithm: interval_merge
    formula: |
      For the actor's other bookings B in {OFFERED, CONFIRMED, CHECKED_IN}
      (any casting call; WRAPPED uses voucher.wrap_out_at when present, else B.expected_wrap_time):
        window(B) = [B.call_time, B.expected_wrap_time)   # half-open
        conflict iff NOT( new.call_time >= B.expected_wrap_time + TURNAROUND_MINUTES
                       OR B.call_time >= new.expected_wrap_time + TURNAROUND_MINUTES )
      i.e. intervals must be separated by a >= TURNAROUND_MINUTES rest buffer in either
      direction; overlap OR insufficient buffer => ERR_TURNAROUND_VIOLATION.
      Boundary: gap exactly == TURNAROUND_MINUTES is ALLOWED (>=).
    input_set: "Actor's bookings in OFFERED | CONFIRMED | CHECKED_IN | WRAPPED across all calls"
    constants:
      TURNAROUND_MINUTES: 600
    precision: "integer minutes; half-open intervals with mandatory gap"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present; role must be a declared role name", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role appears in the endpoint's roles list", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Entity-backed ownership: BackgroundActor caller may only act on own booking/voucher/standby entry (X-User-ID == actor_id)", error_id: ERR_FORBIDDEN_OWNERSHIP, http_status: 403, applies_to: "booking accept/decline, voucher dispute, standby withdraw" }
  - { priority: 4, category: auth, check: "Segregation of duties: bump approver X-User-ID != requested_by_user_id; batch acknowledger X-User-ID != submitted_by_user_id", error_id: "ERR_SOD_SELF_APPROVAL | ERR_SOD_SELF_ACKNOWLEDGE", http_status: 403, applies_to: "bump approve/reject, batch acknowledge" }
  - { priority: 5, category: existence, check: "Path ids exist, validated left-to-right; FK body references exist", error_id: "ERR_PRODUCTION_NOT_FOUND | ERR_ACTOR_NOT_FOUND | ERR_CASTING_CALL_NOT_FOUND | ERR_LOOK_REQUIREMENT_NOT_FOUND | ERR_HOLDING_AREA_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_TIME_EVENT_NOT_FOUND | ERR_VOUCHER_NOT_FOUND | ERR_BUMP_ADJUSTMENT_NOT_FOUND | ERR_PAYROLL_BATCH_NOT_FOUND | ERR_REPLACEMENT_CASE_NOT_FOUND | ERR_STANDBY_ENTRY_NOT_FOUND | ERR_RATIO_WAIVER_NOT_FOUND", http_status: 404, applies_to: "all endpoints with path/body ids" }
  - { priority: 6, category: business_constraint, check: "Body schema: required fields present; enum members valid; integer ranges (slots >= 0, rates > 0, capacity > 0, amount_cents > 0, scheduled_duration_minutes > 0, union_slot_reduction >= 0)", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all write endpoints" }
  - { priority: 7, category: state, check: "Production gate: planning-phase mutations (call create/publish/look-req create/holding-area create/standby create/booking create) require Production ACTIVE; production wrap requires ACTIVE; voucher/batch mutations require ACTIVE or WRAPPED", error_id: "ERR_PRODUCTION_NOT_ACTIVE | ERR_PRODUCTION_NOT_WRAPPABLE", http_status: 409, applies_to: "child-resource mutations" }
  - { priority: 8, category: state, check: "Entity transition preconditions per §1.2, plus create-time state gates: booking create requires call PUBLISHED; standby create requires call PUBLISHED|LOCKED; look-requirement create requires call DRAFT; holding-area create requires call PUBLISHED|LOCKED; waiver create requires call DRAFT|PUBLISHED; time-event create requires booking CHECKED_IN|WRAPPED; bump create requires voucher DRAFT|ISSUED|DISPUTED|REJECTED", error_id: "ERR_CALL_INVALID_STATE | ERR_CALL_NOT_ACCEPTING | ERR_BOOKING_INVALID_STATE | ERR_BOOKING_NOT_WRAPPED | ERR_VOUCHER_INVALID_STATE | ERR_BUMP_INVALID_STATE | ERR_BUMP_VOUCHER_LOCKED | ERR_BATCH_INVALID_STATE | ERR_CASE_INVALID_STATE | ERR_WAIVER_INVALID_STATE | ERR_STANDBY_NOT_ACTIVE", http_status: 409, applies_to: "all action and child-create endpoints" }
  - { priority: 9, category: state, check: "OCC: expected_batch_version == batch.version (add-item); expected_voucher_version == voucher.version (adjust)", error_id: "ERR_STALE_BATCH_VERSION | ERR_STALE_VOUCHER_VERSION", http_status: 412, applies_to: "POST /payroll-batches/{id}/items, POST /vouchers/{id}/adjust" }
  - { priority: 10, category: business_safety, check: "Actor ELIGIBLE (not REGISTERED, not SUSPENDED)", error_id: ERR_ACTOR_NOT_ELIGIBLE, http_status: 409, applies_to: "booking create, standby create, booking check-in" }
  - { priority: 11, category: business_safety, check: "Production.compliance_index >= 30", error_id: ERR_COMPLIANCE_INDEX_TOO_LOW, http_status: 409, applies_to: "casting-call publish" }
  - { priority: 12, category: business_temporal, check: "Logical clock date == shoot_date", error_id: ERR_SHOOT_DATE_MISMATCH, http_status: 409, applies_to: "casting-call start-shooting" }
  - { priority: 13, category: business_temporal, check: "Logical clock >= booking.call_time + 60 minutes", error_id: ERR_NO_SHOW_TOO_EARLY, http_status: 409, applies_to: "booking mark-no-show" }
  - { priority: 14, category: business_temporal, check: "Turnaround: >= 600 min rest vs all other OFFERED|CONFIRMED|CHECKED_IN|WRAPPED bookings of the actor (half-open windows, either direction)", error_id: ERR_TURNAROUND_VIOLATION, http_status: 409, applies_to: "booking create" }
  - { priority: 15, category: business_constraint, check: "No other active booking (OFFERED|CONFIRMED|CHECKED_IN) of same actor on same call; standby create: no duplicate ACTIVE entry of same actor on same call", error_id: ERR_DUPLICATE_BOOKING, http_status: 409, applies_to: "booking create, standby create" }
  - { priority: 16, category: business_constraint, check: "Slot availability per union_slot_eligibility (union spillover allowed; nonunion capped at nonunion_slots + approved_waiver_reduction)", error_id: "ERR_NO_SLOT_AVAILABLE | ERR_NO_NONUNION_SLOT", http_status: 409, applies_to: "booking create" }
  - { priority: 17, category: business_constraint, check: "projected_union_count >= required_union_slots at lock", error_id: ERR_UNION_RATIO_SHORTFALL, http_status: 422, applies_to: "casting-call lock" }
  - { priority: 18, category: business_referential, check: "union_slot_reduction <= casting_call.union_slots", error_id: ERR_WAIVER_REDUCTION_INVALID, http_status: 422, applies_to: "ratio-waiver create" }
  - { priority: 19, category: business_constraint, check: "Holding area capacity: current_occupancy < capacity at check-in", error_id: ERR_HOLDING_AREA_FULL, http_status: 409, applies_to: "booking check-in" }
  - { priority: 20, category: business_constraint, check: "Time-event sequencing: no event before CHECK_IN; MEAL_IN requires unmatched prior MEAL_OUT; WRAP_OUT only via wrap-out endpoint (manual WRAP_OUT rejected); corrects_event_id must reference an uncorrected event of same booking", error_id: ERR_TIME_EVENT_INVALID, http_status: 409, applies_to: "time-event create" }
  - { priority: 21, category: business_referential, check: "Batch item consistency: voucher ISSUED, payroll_batch_id null, voucher's production == batch production; acknowledge rejected ids are SUBMITTED members", error_id: ERR_VOUCHER_NOT_SUBMITTABLE, http_status: 409, applies_to: "batch add-item, batch acknowledge" }
  - { priority: 22, category: business_fiscal, check: "Batch submit requires voucher_count >= 1", error_id: ERR_BATCH_EMPTY, http_status: 422, applies_to: "batch submit" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Production ---
  - { method: POST, path: "/central-casting/productions", description: "Create production", roles: [AgencyAdmin], code: 201, input: [title, studio_code, payroll_company_name], output: Production, side_effects: ["status SETUP; compliance_index 100; payroll_exposure_cents 0"] }
  - { method: GET, path: "/central-casting/productions", description: "List productions", roles: &ALL_ROLES [AgencyAdmin, CastingDirector, CastingAssociate, BackgroundActor, PayrollCoordinator, UnionRepresentative], code: 200, input: ["limit?", "offset?"], output: "Production[]", side_effects: [] }
  - { method: GET, path: "/central-casting/productions/{id}", description: "Get production", roles: *ALL_ROLES, code: 200, input: [], output: Production, side_effects: [] }
  - { method: POST, path: "/central-casting/productions/{id}/activate", description: "SETUP -> ACTIVE", roles: [AgencyAdmin], code: 200, input: [], output: Production, side_effects: ["status ACTIVE; version +1"] }
  - { method: POST, path: "/central-casting/productions/{id}/wrap", description: "ACTIVE -> WRAPPED; requires all calls WRAPPED|CANCELLED; expires remaining standby entries", roles: [CastingDirector], code: 200, input: [], output: Production, side_effects: ["status WRAPPED; standby cascade; version +1"] }

  # --- BackgroundActor ---
  - { method: POST, path: "/central-casting/actors", description: "Register background actor", roles: [AgencyAdmin], code: 201, input: [legal_name, union_status, "special_abilities?", "sizes?"], output: BackgroundActor, side_effects: ["status REGISTERED; no_show_count 0; reliability_score 100"] }
  - { method: GET, path: "/central-casting/actors", description: "List actors", roles: *ALL_ROLES, code: 200, input: ["limit?", "offset?", "union_status?", "status?"], output: "BackgroundActor[]", side_effects: [] }
  - { method: GET, path: "/central-casting/actors/{id}", description: "Get actor", roles: *ALL_ROLES, code: 200, input: [], output: BackgroundActor, side_effects: [] }
  - { method: POST, path: "/central-casting/actors/{id}/verify", description: "REGISTERED -> ELIGIBLE (I-9/paperwork verified)", roles: [AgencyAdmin], code: 200, input: [], output: BackgroundActor, side_effects: ["status ELIGIBLE; version +1"] }
  - { method: POST, path: "/central-casting/actors/{id}/suspend", description: "ELIGIBLE -> SUSPENDED; cancels offered/confirmed bookings, withdraws standby entries", roles: [AgencyAdmin], code: 200, input: [], output: BackgroundActor, side_effects: ["booking/standby cascade; version +1"] }
  - { method: POST, path: "/central-casting/actors/{id}/reinstate", description: "SUSPENDED -> ELIGIBLE; resets no_show_count to 0 and reliability_score to 100", roles: [AgencyAdmin], code: 200, input: [], output: BackgroundActor, side_effects: ["counters reset; version +1"] }

  # --- CastingCall ---
  - { method: POST, path: "/central-casting/casting-calls", description: "Create casting call (DRAFT)", roles: [CastingDirector], code: 201, input: [production_id, shoot_date, general_call_time, scheduled_duration_minutes, location, union_slots, nonunion_slots, union_rate_cents, nonunion_rate_cents, "wardrobe_notes?"], output: CastingCall, side_effects: ["computed slot/ratio fields initialized; slots_available = union_slots + nonunion_slots"] }
  - { method: GET, path: "/central-casting/casting-calls", description: "List casting calls", roles: *ALL_ROLES, code: 200, input: ["limit?", "offset?", "production_id?", "status?", "shoot_date?"], output: "CastingCall[]", side_effects: [] }
  - { method: GET, path: "/central-casting/casting-calls/{id}", description: "Get casting call", roles: *ALL_ROLES, code: 200, input: [], output: CastingCall, side_effects: [] }
  - { method: POST, path: "/central-casting/casting-calls/{id}/publish", description: "DRAFT -> PUBLISHED; gates on production ACTIVE and compliance_index >= 30", roles: [CastingDirector], code: 200, input: [], output: CastingCall, side_effects: ["version +1"] }
  - { method: POST, path: "/central-casting/casting-calls/{id}/lock", description: "PUBLISHED -> LOCKED; enforces projected union ratio", roles: [CastingDirector], code: 200, input: [], output: CastingCall, side_effects: ["projected_compliant stored; version +1"] }
  - { method: POST, path: "/central-casting/casting-calls/{id}/start-shooting", description: "LOCKED -> SHOOTING; logical clock date must equal shoot_date", roles: [CastingAssociate], code: 200, input: [], output: CastingCall, side_effects: ["version +1"] }
  - { method: POST, path: "/central-casting/casting-calls/{id}/wrap", description: "SHOOTING -> WRAPPED; freezes actual ratio; compliance_index penalty if shortfall", roles: [CastingAssociate], code: 200, input: [], output: CastingCall, side_effects: ["actual_compliant computed; production compliance_index -= 15 if noncompliant; standby EXPIRED cascade; version +1"] }
  - { method: POST, path: "/central-casting/casting-calls/{id}/cancel", description: "DRAFT|PUBLISHED|LOCKED -> CANCELLED; cancels active bookings, releases slots, revokes waivers", roles: [CastingDirector], code: 200, input: ["reason?"], output: CastingCall, side_effects: ["booking/standby/waiver cascades; version +1"] }

  # --- LookRequirement (immutable, common_fields false) ---
  - { method: POST, path: "/central-casting/look-requirements", description: "Add wardrobe/look requirement to a call (call must be DRAFT)", roles: [CastingDirector], code: 201, input: [casting_call_id, category, description, bump_amount_cents, "mandatory?"], output: LookRequirement, side_effects: [] }
  - { method: GET, path: "/central-casting/look-requirements", description: "List look requirements", roles: *ALL_ROLES, code: 200, input: ["limit?", "offset?", "casting_call_id?", "category?"], output: "LookRequirement[]", side_effects: [] }
  - { method: GET, path: "/central-casting/look-requirements/{id}", description: "Get look requirement", roles: *ALL_ROLES, code: 200, input: [], output: LookRequirement, side_effects: [] }

  # --- HoldingArea ---
  - { method: POST, path: "/central-casting/holding-areas", description: "Create holding area for a call (call PUBLISHED or LOCKED)", roles: [CastingAssociate], code: 201, input: [casting_call_id, name, capacity], output: HoldingArea, side_effects: ["current_occupancy 0"] }
  - { method: GET, path: "/central-casting/holding-areas", description: "List holding areas", roles: *ALL_ROLES, code: 200, input: ["limit?", "offset?", "casting_call_id?"], output: "HoldingArea[]", side_effects: [] }
  - { method: GET, path: "/central-casting/holding-areas/{id}", description: "Get holding area", roles: *ALL_ROLES, code: 200, input: [], output: HoldingArea, side_effects: [] }

  # --- Booking ---
  - { method: POST, path: "/central-casting/bookings", description: "Create day-player booking (OFFERED); consumes a slot; full validation chain (eligibility, duplicate, turnaround, slots)", roles: [CastingAssociate], code: 201, input: [casting_call_id, actor_id, "call_time?"], output: Booking, side_effects: ["slot consumed (slots_available -1); rate/slot_type snapshot; expected_wrap_time and offer_expires_at computed; call version +1"] }
  - { method: GET, path: "/central-casting/bookings", description: "List bookings", roles: *ALL_ROLES, code: 200, input: ["limit?", "offset?", "casting_call_id?", "actor_id?", "replacement_case_id?", "replaces_booking_id?", "holding_area_id?", "status?"], output: "Booking[]", side_effects: [] }
  - { method: GET, path: "/central-casting/bookings/{id}", description: "Get booking", roles: *ALL_ROLES, code: 200, input: [], output: Booking, side_effects: [] }
  - { method: POST, path: "/central-casting/bookings/{id}/accept", description: "OFFERED -> CONFIRMED (owner actor); replacement accepts fill the case", roles: [BackgroundActor], code: 200, input: [], output: Booking, side_effects: ["replacement case FILLED + standby PROMOTED when is_replacement; version +1"] }
  - { method: POST, path: "/central-casting/bookings/{id}/decline", description: "OFFERED -> DECLINED (owner actor); releases slot; replacement declines reopen case with exclusion", roles: [BackgroundActor], code: 200, input: [], output: Booking, side_effects: ["slot released; case -> OPEN + exclusion when is_replacement; version +1"] }
  - { method: POST, path: "/central-casting/bookings/{id}/cancel", description: "OFFERED|CONFIRMED -> CANCELLED (associate); releases slot; shoot-day cancel opens ReplacementCase", roles: [CastingAssociate], code: 200, input: ["reason?"], output: Booking, side_effects: ["slot released; ReplacementCase auto-created when call SHOOTING; version +1"] }
  - { method: POST, path: "/central-casting/bookings/{id}/check-in", description: "CONFIRMED -> CHECKED_IN; appends CHECK_IN TimeEvent; optional holding area assignment with capacity check", roles: [CastingAssociate], code: 200, input: ["holding_area_id?"], output: Booking, side_effects: ["CHECK_IN event; area occupancy +1 when assigned; version +1"] }
  - { method: POST, path: "/central-casting/bookings/{id}/mark-no-show", description: "CONFIRMED -> NO_SHOW after grace; releases slot, opens ReplacementCase, actor strike + auto-suspend cascade", roles: [CastingAssociate], code: 200, input: [], output: Booking, side_effects: ["slot released; ReplacementCase created; actor no_show_count +1 / reliability recompute / possible suspension; version +1"] }
  - { method: POST, path: "/central-casting/bookings/{id}/wrap-out", description: "CHECKED_IN -> WRAPPED; appends WRAP_OUT; auto-creates DRAFT Voucher; releases holding occupancy", roles: [CastingAssociate], code: 200, input: [], output: Booking, side_effects: ["WRAP_OUT event; Voucher DRAFT created; area occupancy -1; version +1"] }

