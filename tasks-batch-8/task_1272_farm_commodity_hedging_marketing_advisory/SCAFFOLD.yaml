  - { method: POST, path: "/advisory/hedge-recommendations/{recommendationId}/execute", description: "Open the brokerage position for an ACCEPTED recommendation", roles: [CommodityAdvisor], code: 200, input: [], output: BrokeragePosition, side_effects: ["BrokeragePosition minted OPEN at latest SETTLEMENT price", "LONG_PUT premium debited from margin cash", "margin aggregates recomputed", "originating target -> FILLED", "plan hedged_bushels recomputed"] }

  # --- BrokeragePosition ---
  - { method: GET, path: "/advisory/brokerage-positions/{positionId}", description: "Read one position", roles: [CommodityAdvisor, Grower], code: 200, input: [], output: BrokeragePosition, side_effects: [] }
  - { method: GET, path: "/advisory/brokerage-positions", description: "List positions", roles: [CommodityAdvisor, Grower], code: 200, input: ["operation_id?", "margin_account_id?", "recommendation_id?", "status?", "limit?", "offset?"], output: "BrokeragePosition[]", side_effects: [] }
  - { method: POST, path: "/advisory/brokerage-positions/{positionId}/offset", description: "Close an OPEN position at the latest SETTLEMENT price", roles: [CommodityAdvisor], code: 200, input: [], output: BrokeragePosition, side_effects: ["realized_pnl applied to cash_balance", "margin call status re-evaluated", "plan hedged_bushels recomputed"] }

