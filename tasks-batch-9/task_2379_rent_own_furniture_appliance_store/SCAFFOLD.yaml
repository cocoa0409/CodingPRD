  # --------------------------------------------------------- renewal payments
  - method: POST
    path: /agreements/{id}/renewal-payments
    roles: [PlatformAdmin, StoreManager, SalesAssociate, CollectionsAgent]
    input:
      amount_cents: integer
      payment_method: enum
      apply_customer_credit?: boolean
    output: RenewalPayment
    side_effects:
      - "runs calculations.renewal_payment_allocation and stores the five allocation buckets, partial_credit_before_cents (the agreement's carried partial credit as it stood before the waterfall ran), periods_advanced, days_late and cured_delinquency on the payment row with status = POSTED and posted_at = the logical clock"
      - "advances Agreement.periods_paid and current_period_due_at by periods_advanced whole periods and updates rent_applied_cents, partial_credit_cents, late_fee_paid_cents, late_fee_balance_cents, reinstatement_fee_paid_cents, reinstatement_fee_balance_cents and paid_pct"
      - "runs calculations.loyalty_points_accrual and writes one LoyaltyLedgerEntry (entry_type = PAYMENT_ACCRUAL), then recomputes Customer.loyalty_points_balance, loyalty_points_lifetime and loyalty_tier"
      - "when the payment clears the whole reinstatement obligation of an OPEN window, marks that window USED and runs the five-step cure cascade documented on Agreement.payment_status"
      - "when periods_paid reaches renewal_count and no fee balance remains, closes the agreement: payment_status -> CLOSED, possession_status -> OWNED, unit -> SOLD, and any unapplied remainder moves to Customer.credit_balance_cents"
      - "increments Agreement.version by 1"
    notes: "A payment may only be posted once the unit is in the customer's hands (possession_status DELIVERED or SERVICE_SWAP_PENDING), because cycle_anchor_at is stamped at delivery. payment_method is CASH | CARD | ACH | MONEY_ORDER. apply_customer_credit defaults to false; when true, Customer.credit_balance_cents is drawn on before the tendered amount and recorded in allocation_customer_credit_cents."

  - method: GET
    path: /agreements/{id}/renewal-payments
    roles: [PlatformAdmin, ComplianceOfficer, StoreManager, SalesAssociate, CollectionsAgent, Customer]
    input:
      status?: enum
      limit?: integer
      offset?: integer
    output: RenewalPayment[]
    side_effects: []
    notes: "Reverse-reachability for RenewalPayment.agreement_id. Ordered by posted_at ASC, then created_at ASC."

  - method: POST
    path: /renewal-payments/{id}/reverse
    roles: [PlatformAdmin, StoreManager]
    input:
      reason: enum
    output: RenewalPayment
    side_effects:
      - "sets status = REVERSED, reversed_at = the logical clock and reversal_reason = reason"
      - "subtracts allocation_late_fee_cents, allocation_reinstatement_fee_cents and allocation_rent_cents from the agreement's paid counters (restoring late_fee_balance_cents and reinstatement_fee_balance_cents), rolls periods_paid and current_period_due_at back by periods_advanced periods and recomputes paid_pct"
      - "restores Agreement.partial_credit_cents to RenewalPayment.partial_credit_before_cents — NOT partial_credit_cents minus allocation_partial_credit_cents, because bucket 3 consumed the carried credit; and when allocation_customer_credit_cents > 0, subtracts it from Customer.credit_balance_cents and from Agreement.customer_credit_contributed_cents"
      - "when the reversal drives the agreement back into DELINQUENT, increments Customer.lifetime_delinquency_count again — the counter records every CURRENT -> DELINQUENT transition ever made, and is never decremented"
      - "writes a compensating LoyaltyLedgerEntry (entry_type = PAYMENT_REVERSAL) with delta_points equal to the negation of the payment's loyalty_points_awarded, so loyalty_points_balance falls but loyalty_points_lifetime does not"
      - "when the reversed payment had cured_delinquency == true, restores payment_status to DELINQUENT and re-opens the ReinstatementWindow it consumed (USED -> OPEN) if the logical clock is still at or before its expires_at, otherwise marks that window EXPIRED and drives payment_status to DEFAULTED"
      - "increments Agreement.version by 1"
    notes: "reason is CHARGEBACK | NSF | POSTING_ERROR. Only a POSTED payment may be reversed and only the most recent POSTED payment on the agreement (older ones return ERR_PAYMENT_NOT_REVERSIBLE)."

  - method: GET
    path: /agreements/{id}/reinstatement-windows
    roles: [PlatformAdmin, ComplianceOfficer, StoreManager, SalesAssociate, CollectionsAgent, Customer]
    input:
      status?: enum
      limit?: integer
      offset?: integer
    output: ReinstatementWindow[]
    side_effects: []
    notes: "Reverse-reachability for ReinstatementWindow.agreement_id. Ordered by opened_at ASC, then created_at ASC."

  # ---------------------------------------------------------- delivery orders
  - method: POST
    path: /agreements/{id}/delivery-orders
    roles: [PlatformAdmin, StoreManager]
    input:
      crew_id: string
      service_type: enum
      window_start_at: datetime
      window_end_at: datetime
      expected_agreement_version: integer
    output: DeliveryOrder
    side_effects:
      - "first supersedes the agreement's own prior order in status SCHEDULED or FAILED_ATTEMPT (-> SUPERSEDED), releasing that crew window before the new window is checked, so at most one non-terminal DeliveryOrder ever exists per agreement"
      - "creates the order with status = SCHEDULED, attempt_count = 0, setup_completed = false"
      - "increments Agreement.version by 1"
    notes: "OCC guard: expected_agreement_version must equal Agreement.version or the write is rejected with ERR_STALE_AGREEMENT_VERSION (412). service_type is DELIVERY_ONLY | DELIVERY_SETUP."

  - method: GET
    path: /delivery-orders/{id}
