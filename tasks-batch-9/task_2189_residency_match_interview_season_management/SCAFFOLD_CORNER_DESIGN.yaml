      - name: application_screening_and_interview_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.Application
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: application_parallel_screening_and_interview_dimensions
          rationale: >
            The two-dimension corner - screening_status and interview_status moving independently, and the
            combined pair being read back correctly - is the whole subject of the §1.8 instance, which walks
            the application to (ADVANCED, SCHEDULED) and asserts both axes plus the invariant that a
            screening move never rewrites the interview axis. A §1.9 instance would restate it.

      - name: rank_list_returned_by_the_committee_can_be_revised_and_resubmitted
        claim_type: branching
        grounds:
          - state_machines.RankList
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: rank_list_committee_fork_with_returned_revision_cycle
          rationale: >
            The COMMITTEE_REVIEW fork (APPROVED vs RETURNED), the RETURNED -> DRAFT revise leg, and the
            review_round increment that invalidates the previous round's ballots are covered end to end by
            the §1.8 instance.

      - name: rescheduling_an_accepted_invitation_frees_the_booked_seat
        claim_type: compensation
        grounds:
          - state_machines.InterviewInvitation.ACCEPTED->ISSUED
          - state_machines.InterviewSlot.BOOKED->OPEN
        excluded_because:
          difficulty_instance: booked_seat_total_conserved_across_accept_and_reschedule
          rationale: >
            The reschedule compensation - booked_count decremented, slot returned from BOOKED to OPEN,
            interview_status reverted from SCHEDULED to INVITED, expires_at recomputed - is asserted hop by
            hop in the §1.8 conservation instance.


  # ===========================================================================
  # Calculations - Table 3 rows against the 10 rules of §1.3. Six of the ten
  # rules have their boundary corner owned by a §1.8 instance and are stubbed;
  # the four kept here are the corners §1.8 does not reach: the match-day
  # ordering walk, the conditional credential packet, the compliance scan's
  # two-branch outcome, and the empty-waitlist arm of the promotion selector.
  # ===========================================================================
  - section: calculations
    instances:
      - name: match_day_fills_the_quota_in_rank_order_and_leaves_the_ineligible_entry_unmatched
        claim_type: correct_result
        grounds:
          - calculations.match_day_assignment
          - state_machines.MatchResult
          - entities.Program.matched_count
          - entities.Program.unfilled_positions
        distinguishing_aspect: >
          Match day walks the entries in rank_position ASC and tests eligibility per entry - screening
          ADVANCED and interview COMPLETED. Rank 2's applicant withdrew after the list was drafted, so it
          is skipped even though the quota of 2 still has a free position: the outcome is UNMATCHED with
          matched_rank_position null, matched_count 1, unfilled_positions 1. A run that filled positions
          purely by walking down the list until the quota ran out would have matched it.
        test_recipe:
          setup:
            - "a CERTIFIED two-entry rank list under a quota of 2 whose rank-2 applicant has withdrawn"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
            - call: "POST /programs"
