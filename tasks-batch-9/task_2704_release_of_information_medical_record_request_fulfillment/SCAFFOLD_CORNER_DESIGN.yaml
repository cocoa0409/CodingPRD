      - name: redaction_page_count_above_segment_page_count_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_39
          - errors.ERR_REDACTION_PAGE_COUNT_INVALID
        distinguishing_aspect: >
          The bound is redacted_page_count <= page_count, tested at page_count + 1
          (422) and then at page_count exactly (accepted), which is the case the rule
          explicitly calls out: a fully-redacted segment is legal and leaves the
          request with 0 billable pages while page_count_total still reads 40.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; CA fee rule; facility with the default sensitive category list."
            - "Patient; ATTORNEY requester; authorization whose sensitive_categories_authorized includes BEHAVIORAL_HEALTH."
            - "One THIRD_PARTY request accepted, one 40-page EHR_CURRENT/BEHAVIORAL_HEALTH segment retrieved and segregated, reviewed INCLUDE with redaction_required true, so the request is in REDACTION and the segment's redaction_status is OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roi/state-fee-rules"
              payload: { state_code: "CA", base_retrieval_fee_cents: 1500, tier1_page_limit: 25, tier1_per_page_millicents: 27500, tier2_per_page_millicents: 12500, patient_access_per_page_millicents: 10000, certification_fee_cents: 1000, media_fee_cents: 500, postage_per_delivery_cents: 850, electronic_delivery_total_cap_cents: 6500, total_fee_cap_cents: 12000, patient_access_deadline_days: 15, third_party_deadline_days: 30, extension_days: 15, penalty_per_day_cents: 2500, penalty_cap_cents: 25000, fee_forfeiture_on_late: true }
              as: PlatformAdmin
              captures: { rule_ca: $.data.id }
            - call: "POST /roi/facilities"
              payload: { name: "Bay Regional Health", state_fee_rule_id: "${rule_ca}" }
