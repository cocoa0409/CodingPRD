              as: LmsAdmin
              captures: { post2: $.data.continuity_posture }
            - call: "GET /course-shells/${shell_id}"
              payload: {}
              as: LmsAdmin
              captures: { cap_continuity: $.data.effective_seat_cap }
            - call: "POST /enrollments"
