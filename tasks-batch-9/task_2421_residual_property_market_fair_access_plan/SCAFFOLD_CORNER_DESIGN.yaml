          - errors.ERR_NO_ASSESSABLE_MEMBERS
          - validations[priority=45]
          - validations[priority=46]
        distinguishing_aspect: "Settlement is exact-amount only, and eligibility is basis-specific: paying 29999999 against a net_due_cents of 30000000 returns ERR_PAYMENT_AMOUNT_MISMATCH (422) with the allocation still PENDING, while a PREMIUM_VOLUME event over the same three ACTIVE members — whose written_premium_share_pct are all 0.00 — returns ERR_NO_ASSESSABLE_MEMBERS (422) even though the MARKET_SHARE event over the identical member set allocated successfully."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; three ACTIVE member insurers with market_share_pct 30.00 / 30.00 / 40.00 and written_premium_share_pct 0.00 for all three; one HURRICANE zone."
            - "A MARKET_SHARE assessment event with trigger_loss_cents 200000000 and reserve_balance_cents_at_trigger 100000000 (assessable 100000000), allocated (30000000 / 30000000 / 40000000) and INVOICED."
          setup_api_calls:
            - call: "POST /fair-plan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier One", naic_code: "10001", market_share_pct: 30.00, written_premium_share_pct: 0.00 }
