  - rule_id: combinatorial_formula
    instances:
      - name: invoice_total_rounds_each_line_before_summation_mode_b
        grounds:
          - calculations.retailer_invoice_total
          - calculations.retailer_discount_tier
          - entities.RetailerOrder.fields.merchandise_net_cents
          - entities.RetailerOrder.fields.handling_fee_cents
