            - { call: "POST /feedback-panel/instruments/${instr_id}/submit-review", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/translations", payload: { instrument_id: "${instr_id}", locale: "en", translator_ref: "tr-1" }, as: SurveyDesigner, captures: { tr_en: $.data.id } }
            - { call: "POST /feedback-panel/translations/${tr_en}/certify", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/approve", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/lock", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/survey-waves", payload: { wave_code: "W1", instrument_id: "${instr_id}", opens_at: "2026-08-02T00:00:00Z", closes_at: "2026-08-31T00:00:00Z", min_response_rate: 0.5, incentive_pool_total_cents: 100000, base_incentive_cents: 1000 }, as: PanelManager, captures: { wave_id: $.data.id } }
            - { call: "POST /feedback-panel/survey-waves/${wave_id}/arm", payload: {}, as: PanelManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PanelManager }
            - { call: "POST /feedback-panel/survey-waves/${wave_id}/open-fielding", payload: {}, as: PanelManager }
            - { call: "POST /feedback-panel/invitations", payload: { wave_id: "${wave_id}", panelist_id: "${p1_id}" }, as: PanelManager }
            - { call: "POST /feedback-panel/invitations", payload: { wave_id: "${wave_id}", panelist_id: "${p2_id}" }, as: PanelManager }
            - { call: "POST /feedback-panel/invitations", payload: { wave_id: "${wave_id}", panelist_id: "${p3_id}" }, as: PanelManager }
          trigger:
            - { call: "POST /feedback-panel/invitations", payload: { wave_id: "${wave_id}", panelist_id: "${p4_id}" }, as: PanelManager, captures: { err_cap: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: PanelManager }
            - { call: "POST /feedback-panel/invitations", payload: { wave_id: "${wave_id}", panelist_id: "${p4_id}" }, as: PanelManager, captures: { err_cap_boundary: $.data.error_id } }
