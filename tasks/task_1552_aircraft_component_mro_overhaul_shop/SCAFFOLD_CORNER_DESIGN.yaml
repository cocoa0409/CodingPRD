            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-C1", ownership: "CUSTOMER", owner_customer_id: "${c_id}", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 7000, cycles_since_overhaul: 900, manufactured_at: "2012-05-01" }, as: CustomerServiceRep, captures: { u_core: $.data.id } }
            - { call: "POST /mro/exchange-agreements", payload: { customer_id: "${c_id}", part_id: "${p_id}" }, as: CustomerServiceRep, captures: { ex: $.data.id } }
          trigger:
            - { call: "POST /mro/exchange-agreements/${ex}/core-return", payload: { core_unit_id: "${u_core}", core_teardown_estimate_cents: 100000 }, as: Technician, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_EXCHANGE_INVALID_STATE' with HTTP 409"

  # =========================================================================
  # Section: rbac
  # =========================================================================
  - section: rbac
    instances:
      - name: technician_cannot_create_customer
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Role exclusivity: POST /mro/customers is ShopManager-only; a Technician is denied 403 ERR_FORBIDDEN_ROLE before any payload validation."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: Technician, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_FORBIDDEN_ROLE' with HTTP 403"
      - name: inspector_cannot_create_work_order
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "POST /mro/work-orders is CustomerServiceRep-only; an Inspector is denied 403 — inspection staff cannot intake their own work."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /mro/work-orders", payload: { customer_id: "00000000-0000-4000-8000-000000000000", unit_id: "00000000-0000-4000-8000-000000000000", work_scope: "OVERHAUL" }, as: Inspector, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_FORBIDDEN_ROLE' with HTTP 403 (role check at priority 2 precedes existence at priority 3)"
      - name: customer_cannot_review_claim
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Warranty review is ShopManager-only; a Customer (even the claimant) is denied 403 — segregation between claimant and adjudicator."
        test_recipe:
          setup: ["empty DB (role check fires before existence, so the random claim id is fine)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /mro/warranty-claims/00000000-0000-4000-8000-000000000000/review", payload: { decision: "ACCEPT" }, as: Customer, as_user_id: "00000000-0000-4000-8000-000000000000", captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_FORBIDDEN_ROLE' with HTTP 403"

  # =========================================================================
  # Section: consistency
  # =========================================================================
  - section: consistency
    instances:
      - name: immediate_consistency_release_response
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, state_machines.WorkOrder.TEST_PASSED_to_RELEASED]
        distinguishing_aspect: "Immediate consistency: the release RESPONSE itself carries the mutated state (status RELEASED, inspector_user_id set, released_at == current clock) and a subsequent GET returns identical values — no read lag."
        test_recipe:
          setup: ["work order TEST_PASSED at clock 2026-08-02T02:00:00Z"]
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
            - { call: "POST /mro/part-catalog", payload: { part_number: "PN-32-ACT", ata_chapter: "32", is_rotable: true, cmm_reference: "CMM-32-11-01", replacement_value_cents: 10000000, warranty_cycle_limit: 500, warranty_month_limit: 24, flat_overhaul_price_cents: 2000000 }, as: ShopManager, captures: { p_id: $.data.id } }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-U1", ownership: "CUSTOMER", owner_customer_id: "${c_id}", condition_status: "UNSERVICEABLE", custody_status: "OFF_SITE", total_cycles: 4800, cycles_since_overhaul: 300, manufactured_at: "2015-06-01" }, as: CustomerServiceRep, captures: { u1: $.data.id } }
            - { call: "POST /mro/work-orders", payload: { customer_id: "${c_id}", unit_id: "${u1}", work_scope: "OVERHAUL" }, as: CustomerServiceRep, captures: { wo: $.data.id } }
            - { call: "POST /mro/work-orders/${wo}/teardown-complete", payload: {}, as: Technician }
            - { call: "POST /mro/work-orders/${wo}/quote", payload: { labor_estimate_cents: 2000000, parts_estimate_cents: 1000000, scrap_option_ack: false }, as: CustomerServiceRep, captures: { v_q: $.data.version } }
            - { call: "POST /mro/work-orders/${wo}/quote-approval", payload: { expected_work_order_version: "${v_q}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /mro/work-orders/${wo}/complete-repair", payload: {}, as: Technician, as_user_id: "tech-1" }
            - { call: "POST /mro/test-cells", payload: { name: "CELL-A", supported_ata_chapters: ["32"], hourly_rate_cents: 100000 }, as: ShopManager, captures: { cell_id: $.data.id } }
            - { call: "POST /mro/test-cells/${cell_id}/bookings", payload: { work_order_id: "${wo}", start_time: "2026-08-02T01:00:00Z", end_time: "2026-08-02T05:00:00Z" }, as: CustomerServiceRep }
            - { call: "POST /mro/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T02:00:00Z" }, as: ShopManager }
            - { call: "POST /mro/work-orders/${wo}/test-results", payload: { result: "PASS", atp_reference: "ATP-1" }, as: Inspector, as_user_id: "insp-9" }
          trigger:
            - { call: "POST /mro/work-orders/${wo}/release", payload: {}, as: Inspector, as_user_id: "insp-9", captures: { st: $.data.status, insp: $.data.inspector_user_id, rel: $.data.released_at } }
            - { call: "GET /mro/work-orders/${wo}", payload: {}, as: ShopManager, captures: { st2: $.data.status, rel2: $.data.released_at } }
          assert:
            - "st == 'RELEASED' and insp == 'insp-9' and rel == '2026-08-02T02:00:00Z' in the mutation response itself"
            - "st2 == st and rel2 == rel on the follow-up read (immediate consistency, no reconciliation lag)"
