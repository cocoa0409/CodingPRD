      - name: cross_entity_state_error_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_CROSS_ENTITY_STATE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / appoint_requires_petition_granted
          rationale: "ERR_CROSS_ENTITY_STATE is asserted as the failure path of the named §1.8 cross-entity instance."

      - name: insufficient_marshaled_funds_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSUFFICIENT_MARSHALED_FUNDS]", state_machines.Distribution.APPROVED_to_PAID]
        distinguishing_aspect: "Paying an APPROVED distribution of 400000 when marshaled_cash is only 300000 (drained by a prior payment) returns ERR_INSUFFICIENT_MARSHALED_FUNDS (409)."
        test_recipe:
          setup: ["A DISTRIBUTING estate, marshaled_cash reduced to 300000 by a prior paid distribution, with a second APPROVED distribution of 400000 to the beneficiary."]
          setup_api_calls:
            - call: "POST /estates"
              payload: { decedent_name: "IF", date_of_death: "2026-04-01T00:00:00Z", county_code: "LA", estate_type: "INTESTATE", gross_estate_value_cents: 6000000 }
              as: Clerk
              captures: { est_id: $.data.id }
            - call: "POST /petitions"
              payload: { estate_id: "${est_id}", petitioner_name: "P", will_lodged: false, nominated_representative_name: "R" }
              as: Clerk
              captures: { pet_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v0: $.data.version }
            - call: "POST /petitions/${pet_id}/grant"
              payload: { expected_estate_version: "${v0}" }
              as: ProbateJudge
            - call: "POST /representatives"
              payload: { estate_id: "${est_id}", petition_id: "${pet_id}", full_name: "R", representative_user_id: "pr-user-1" }
              as: Clerk
              captures: { rep_id: $.data.id }
            - call: "POST /bonds"
              payload: { estate_id: "${est_id}", representative_id: "${rep_id}", surety_name: "S", penal_amount_cents: 3250000 }
              as: Clerk
              captures: { bond_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v1: $.data.version }
            - call: "POST /bonds/${bond_id}/approve"
              payload: { expected_estate_version: "${v1}" }
              as: ProbateJudge
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v2: $.data.version }
            - call: "POST /representatives/${rep_id}/appoint"
              payload: { expected_estate_version: "${v2}" }
              as: ProbateJudge
              as_user_id: "judge-1"
            - call: "POST /beneficiaries"
              payload: { estate_id: "${est_id}", full_name: "Heir", relationship: "CHILD", share_bps: 10000 }
              as: Clerk
              captures: { ben_id: $.data.id }
            - call: "POST /assets"
              payload: { estate_id: "${est_id}", description: "Cash", asset_class: "CASH", declared_value_cents: 700000 }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
              captures: { asset_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v3: $.data.version }
            - call: "POST /assets/${asset_id}/appraise"
              payload: { appraised_value_cents: 700000, expected_estate_version: "${v3}" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
            - call: "POST /accountings"
              payload: { estate_id: "${est_id}", report_type: "INVENTORY" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
              captures: { acct_inv_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v4: $.data.version }
            - call: "POST /accountings/${acct_inv_id}/file"
              payload: { expected_estate_version: "${v4}" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v5: $.data.version }
            - call: "POST /accountings/${acct_inv_id}/approve"
              payload: { expected_estate_version: "${v5}" }
              as: ProbateJudge
            - call: "POST /accountings"
              payload: { estate_id: "${est_id}", report_type: "INTERIM" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
              captures: { acct_int_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v6: $.data.version }
            - call: "POST /accountings/${acct_int_id}/file"
              payload: { expected_estate_version: "${v6}" }
              as: PersonalRepresentative
              as_user_id: "pr-user-1"
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v7: $.data.version }
            - call: "POST /accountings/${acct_int_id}/approve"
              payload: { expected_estate_version: "${v7}" }
              as: ProbateJudge
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v8: $.data.version }
            - call: "POST /assets/${asset_id}/marshal"
              payload: { expected_estate_version: "${v8}" }
