              as_user_id: "${ca_v1}"
            - call: "GET /roofing/contractor-accounts/${ca_v1}"
              payload: {}
              as: CreditAnalyst
              captures: { ca_v1_v2: $.data.version }
          trigger:
            - call: "POST /roofing/orders/${ord_v1}/confirm"
              payload: { expected_contractor_account_version: "${ca_v1_v2}" }
              as: Contractor
              as_user_id: "${ca_v1}"
              captures: { err_v1: $.data.error_id }
          assert:
            - "Second confirm rejected with ERR_ORDER_NOT_QUOTED (state priority 4 beats fiscal priority 11)"

      - name: claim_credit_sod_vs_bad_state_sod_wins
        grounds:
          - validations[priority=5]
          - validations[priority=4]
