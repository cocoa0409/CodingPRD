            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP", "NWS"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
            - call: "POST /eas-devices"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", model_code: "DASDEC-3", device_role: "DECODER", firmware_version: "5.2.1" }
              captures: { dev1: "$.data.id" }
            - call: "POST /eas-devices/${dev1}/readiness-check"
              as: StationEngineer
              as_user_id: eng-1
              payload: { self_test_passed: true, firmware_current: true }
            - call: "GET /stations/${station_id}"
              as: StationEngineer
              as_user_id: eng-1
              captures: { sv1: "$.data.version" }
            - call: "POST /monitoring-assignments"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", device_id: "${dev1}", source_type: "PEP", source_call_sign: "WXPEP", expected_station_version: "${sv1}" }
              captures: { ma1: "$.data.id" }
            - call: "GET /stations/${station_id}"
              as: StationEngineer
              as_user_id: eng-1
              captures: { sv2: "$.data.version" }
            - call: "POST /monitoring-assignments"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", device_id: "${dev1}", source_type: "NWS", source_call_sign: "WXNWS", expected_station_version: "${sv2}" }
              captures: { ma2: "$.data.id" }
            - call: "POST /test-events"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { station_id: "${station_id}", test_type: "WEEKLY", window_start_at: "2026-08-12T00:00:00Z", window_end_at: "2026-08-12T01:00:00Z" }
              captures: { te1: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-12T00:30:00Z" }
            - call: "POST /test-events/${te1}/evaluate-readiness"
              as: StationEngineer
              as_user_id: eng-1
              payload: {}
          trigger:
            - call: "POST /equipment-outages"
              as: StationEngineer
              as_user_id: eng-1
              payload: { device_id: "${dev1}", detected_at: "2026-08-12T00:30:00Z", failure_summary: "decoder power supply failed mid-window" }
              captures: { outage_id: "$.data.id" }
            - call: "GET /test-events/${te1}"
              as: ComplianceAdmin
              as_user_id: adm-1
            - call: "POST /equipment-outages/${outage_id}/start-repair"
              as: StationEngineer
              as_user_id: eng-1
              payload: {}
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-12T00:40:00Z" }
            - call: "POST /equipment-outages/${outage_id}/restore"
              as: StationEngineer
              as_user_id: eng-1
              payload: {}
            - call: "POST /equipment-outages/${outage_id}/close"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /monitoring-assignments/${ma1}/record-receipt"
              as: StationEngineer
              as_user_id: eng-1
              payload: {}
            - call: "POST /monitoring-assignments/${ma2}/record-receipt"
              as: StationEngineer
              as_user_id: eng-1
              payload: {}
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-12T00:50:00Z" }
            - call: "POST /test-events/${te1}/evaluate-readiness"
              as: StationEngineer
              as_user_id: eng-1
              payload: {}
          assert:
            - "after setup: te1.status == READY with readiness_score == 80.00 (inclusive boundary) and readiness_evaluated_at == 2026-08-12T00:30:00Z"
            - "POST /equipment-outages drives hop 1-4 in one request: dev1 -> FAILED, ma1 and ma2 -> SUSPENDED, accessible_source_count 2 -> 0, compliance_score 100.00 -> 50.00 (missing_source_count 2 x 25.00), compliance_posture COMPLIANT -> SUSPENDED_FILINGS"
            - "hop 4 fired because the posture transitioned INTO SUSPENDED_FILINGS: the intervening GET /test-events/${te1} shows status == READINESS_PENDING and readiness_score == null"
            - "restore writes continuous_downtime_hours == 0.17 (600 s / 3600) and obligation_downtime_hours == 0.00 (the 00:30-00:40 outage lies entirely outside [08:00Z, 20:00Z)), so both breach flags are false"
            - "close -> outage status CLOSED, dev1 back to READY, ma1 and ma2 SUSPENDED -> SILENT; the recompute now scores 100.00 - 50.00 (still 0 ACTIVE required sources) - 20.00 (2 SILENT) = 30.00, still SUSPENDED_FILINGS"
            - "record-receipt on ma1 -> ACTIVE: score 100.00 - 25.00 - 10.00 = 65.00 (still SUSPENDED_FILINGS); record-receipt on ma2 -> ACTIVE: score 100.00, posture COMPLIANT, silent_assignment_count 0"
            - "the final evaluate-readiness re-enters READY: readiness_score == 80.00 again (1/1 ready devices, 2/2 coverage, 0 recent alerts) and readiness_evaluated_at == 2026-08-12T00:50:00Z"
            - "te1 therefore visited READY -> READINESS_PENDING -> READY, and neither posture recovery step (close, record-receipt) touched the TestEvent — only evaluate-readiness did"

  # ===========================================================================
  # RULE 4 — transitive_cascade
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: outage_create_cascades_four_levels_device_assignments_station_test_event
        grounds:
          - "§1.0 complexity_profile.complexity_layers includes cascading_side_effects"
          - "§1.5 POST /equipment-outages side effects 'hop 1: EASDevice -> FAILED', 'hop 2: that device's ACTIVE/SILENT MonitoringAssignments -> SUSPENDED', 'hop 3: Station.accessible_source_count + station_compliance_score + compliance_posture', 'hop 4: the station's READY TestEvents revert to READINESS_PENDING with readiness_score cleared'"
          - "§1.2 state_machines.EASDevice {REGISTERED, READY} -> FAILED, MonitoringAssignment {ACTIVE, SILENT} -> SUSPENDED, Station posture -> SUSPENDED_FILINGS hop 4"
          - "§1.3 calculations.station_compliance_score (MISSING_SOURCE_DEDUCTION 25.00, WATCH_MIN_SCORE 75.00)"
        distinguishing_aspect: "One POST /equipment-outages must produce four distinct entity-level effects in a single request AND in this order — hop 3's score can only reach 50.00 if hop 2 has already suspended both assignments, and hop 4 can only fire because hop 3's posture landed on SUSPENDED_FILINGS; a two-hop implementation leaves the station at 100.00/COMPLIANT and the test event at READY/80.00."
        test_recipe:
          setup:
            - "Plan KS 2026-R1 requiring PEP and NWS, activated; station KWEA; a single device dev1 readiness-checked to READY carries BOTH required assignments (ma1/PEP/WXPEP, ma2/NWS/WXNWS)."
            - "A second device dev2 is left in REGISTERED with no assignment, to prove hop 2 only touches assignments on the FAILED device."
            - "TestEvent te1 WEEKLY [2026-08-12T00:00:00Z, 2026-08-12T01:00:00Z) is evaluated at 2026-08-12T00:30:00Z. With dev1 READY and dev2 REGISTERED the readiness score is 40 * 1/2 + 40 * 2/2 + 0 = 60.00 -> READINESS_PENDING, so dev2 is first decommissioned and the event re-evaluated to 80.00 -> READY (DECOMMISSIONED devices leave the readiness denominator)."
          setup_api_calls:
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP", "NWS"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
            - call: "POST /eas-devices"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", model_code: "DASDEC-3", device_role: "DECODER", firmware_version: "5.2.1" }
              captures: { dev1: "$.data.id" }
            - call: "POST /eas-devices/${dev1}/readiness-check"
              as: StationEngineer
              as_user_id: eng-1
              payload: { self_test_passed: true, firmware_current: true }
            - call: "POST /eas-devices"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", model_code: "DASDEC-3", device_role: "MONITOR", firmware_version: "5.2.0" }
              captures: { dev2: "$.data.id" }
            - call: "GET /stations/${station_id}"
              as: StationEngineer
              as_user_id: eng-1
              captures: { sv1: "$.data.version" }
            - call: "POST /monitoring-assignments"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", device_id: "${dev1}", source_type: "PEP", source_call_sign: "WXPEP", expected_station_version: "${sv1}" }
              captures: { ma1: "$.data.id" }
            - call: "GET /stations/${station_id}"
              as: StationEngineer
              as_user_id: eng-1
              captures: { sv2: "$.data.version" }
            - call: "POST /monitoring-assignments"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", device_id: "${dev1}", source_type: "NWS", source_call_sign: "WXNWS", expected_station_version: "${sv2}" }
              captures: { ma2: "$.data.id" }
            - call: "POST /test-events"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { station_id: "${station_id}", test_type: "WEEKLY", window_start_at: "2026-08-12T00:00:00Z", window_end_at: "2026-08-12T01:00:00Z" }
              captures: { te1: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-12T00:30:00Z" }
            - call: "POST /test-events/${te1}/evaluate-readiness"
              as: StationEngineer
              as_user_id: eng-1
              payload: {}
            - call: "POST /eas-devices/${dev2}/decommission"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /test-events/${te1}/evaluate-readiness"
              as: StationEngineer
              as_user_id: eng-1
              payload: {}
          trigger:
            - call: "POST /equipment-outages"
              as: StationEngineer
              as_user_id: eng-1
              payload: { device_id: "${dev1}", detected_at: "2026-08-12T00:30:00Z", failure_summary: "decoder chassis dead" }
              captures: { outage_id: "$.data.id" }
            - call: "GET /eas-devices/${dev1}"
              as: ComplianceAdmin
              as_user_id: adm-1
            - call: "GET /monitoring-assignments/${ma1}"
              as: ComplianceAdmin
              as_user_id: adm-1
            - call: "GET /monitoring-assignments/${ma2}"
              as: ComplianceAdmin
              as_user_id: adm-1
            - call: "GET /stations/${station_id}/compliance-summary"
              as: ComplianceAdmin
              as_user_id: adm-1
            - call: "GET /test-events/${te1}"
              as: ComplianceAdmin
              as_user_id: adm-1
          assert:
            - "pre-trigger: first evaluate-readiness scored 60.00 -> READINESS_PENDING; after dev2's decommission the re-evaluation scored 80.00 -> READY"
            - "the outage create returns 201 with status == OPEN and notified_at == 2026-08-12T00:30:00Z, and both downtime figures still null"
            - "hop 1: GET /eas-devices/${dev1} -> status == FAILED"
            - "hop 2: ma1 and ma2 both -> status == SUSPENDED (they were ACTIVE); their counts_toward_required_sources is false"
            - "hop 3: compliance-summary reports accessible_source_count == 0, missing_source_count == 2, compliance_score == 50.00 == 100.00 - 2 * 25.00, compliance_posture == SUSPENDED_FILINGS, outage_breach_count == 0 (no downtime figures yet)"
            - "hop 4: te1.status == READINESS_PENDING with readiness_score == null, reverted purely by the posture transition into SUSPENDED_FILINGS"
            - "ordering sensitivity: had hop 3 run before hop 2 the score would read 100.00 and hop 4 would never fire; had hop 4 read the score instead of the posture band it would have fired at WATCH too"
            - "hop 2 is scoped to the failed device only — dev2 stays DECOMMISSIONED and no assignment exists on it to suspend"

      - name: plan_supersede_cascades_three_levels_and_reverts_only_non_terminal_inspections
        grounds:
          - "§1.2 state_machines.StatePlan ACTIVE -> SUPERSEDED: hop 1 supersede, hop 2 Station.plan_revalidation_required = true + recompute, hop 3 InspectionRequest RESPONDED -> RESPONSE_DRAFTED clearing completeness_score and responded_at while retaining provided_document_kinds"
          - "§1.5 POST /state-plans/{id}/activate side effect 'PLAN-SUPERSEDE CASCADE hop 1 -> hop 2 -> hop 3'"
          - "§1.3 calculations.station_compliance_score d3 = REVALIDATION_DEDUCTION 15.00, WATCH_MIN_SCORE 75.00"
          - "§1.3 calculations.inspection_completeness_score (100.00 on-time full match, INSPECTION_SATISFIED_MIN 100.00)"
        distinguishing_aspect: "Activating the successor plan reaches an entity two FKs away: StatePlan -> Station -> InspectionRequest, and the third hop is conditional — the RESPONDED request is rewound to RESPONSE_DRAFTED with completeness_score and responded_at nulled but provided_document_kinds preserved, while the CLOSED_SATISFIED request at the same station is left completely untouched."
        test_recipe:
          setup:
            - "Plan p1 (KS, 2026-R1, requires PEP) activated; station KWEA under p1 with dev1 READY and one ACTIVE PEP assignment -> compliance_score 100.00, COMPLIANT, plan_revalidation_required false."
            - "Inspection ir1 opened at the default clock 2026-08-01T00:00:00Z for STATION_LOG + TEST_LOGS, drafted with both kinds, submitted on time -> completeness_score 100.00, status RESPONDED."
            - "Inspection ir2 opened for PLAN_COPY, drafted, submitted (100.00) and CLOSED_SATISFIED, i.e. parked in a terminal state."
            - "Successor plan p2 (KS, 2026-R2) created as DRAFT for the SAME state_code."
          setup_api_calls:
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { p1: "$.data.id" }
            - call: "POST /state-plans/${p1}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${p1}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
            - call: "POST /eas-devices"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", model_code: "DASDEC-3", device_role: "DECODER", firmware_version: "5.2.1" }
              captures: { dev1: "$.data.id" }
            - call: "POST /eas-devices/${dev1}/readiness-check"
              as: StationEngineer
              as_user_id: eng-1
              payload: { self_test_passed: true, firmware_current: true }
            - call: "GET /stations/${station_id}"
              as: StationEngineer
              as_user_id: eng-1
              captures: { sv1: "$.data.version" }
            - call: "POST /monitoring-assignments"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", device_id: "${dev1}", source_type: "PEP", source_call_sign: "WXPEP", expected_station_version: "${sv1}" }
              captures: { ma1: "$.data.id" }
            - call: "POST /inspection-requests"
              as: FieldInspector
              as_user_id: insp-1
              payload: { station_id: "${station_id}", requested_document_kinds: ["STATION_LOG", "TEST_LOGS"] }
              captures: { ir1: "$.data.id" }
            - call: "POST /inspection-requests/${ir1}/draft-response"
              as: StationEngineer
              as_user_id: eng-1
              payload: { provided_document_kinds: ["STATION_LOG", "TEST_LOGS"] }
            - call: "POST /inspection-requests/${ir1}/submit-response"
              as: CertifyingOfficer
              as_user_id: cert-1
              payload: {}
            - call: "POST /inspection-requests"
              as: FieldInspector
              as_user_id: insp-1
              payload: { station_id: "${station_id}", requested_document_kinds: ["PLAN_COPY"] }
              captures: { ir2: "$.data.id" }
            - call: "POST /inspection-requests/${ir2}/draft-response"
              as: StationEngineer
              as_user_id: eng-1
              payload: { provided_document_kinds: ["PLAN_COPY"] }
            - call: "POST /inspection-requests/${ir2}/submit-response"
              as: CertifyingOfficer
              as_user_id: cert-1
              payload: {}
            - call: "POST /inspection-requests/${ir2}/close"
              as: FieldInspector
              as_user_id: insp-1
              payload: {}
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R2", required_source_types: ["PEP", "NWS"], mandatory_relay_event_codes: ["EAN"] }
              captures: { p2: "$.data.id" }
          trigger:
            - call: "POST /state-plans/${p2}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "GET /state-plans/${p1}"
              as: ComplianceAdmin
              as_user_id: adm-1
            - call: "GET /stations/${station_id}/compliance-summary"
              as: ComplianceAdmin
              as_user_id: adm-1
            - call: "GET /inspection-requests/${ir1}"
              as: FieldInspector
              as_user_id: insp-1
            - call: "GET /inspection-requests/${ir2}"
              as: FieldInspector
              as_user_id: insp-1
          assert:
            - "p2 -> status == ACTIVE with activated_at == 2026-08-01T00:00:00Z and required_source_count == 2"
            - "hop 1: GET /state-plans/${p1} -> status == SUPERSEDED with superseded_at == 2026-08-01T00:00:00Z"
            - "hop 2: compliance-summary reports plan_revalidation_required == true, compliance_score == 85.00 == 100.00 - REVALIDATION_DEDUCTION 15.00, compliance_posture == WATCH (85.00 >= 75.00, < 90.00)"
            - "hop 2 ordering: the flag must be set BEFORE the recompute, otherwise d3 is 0 and the score stays 100.00/COMPLIANT"
            - "hop 2 scoping: the station still points at p1, so required_source_count for its score is p1's 1 (not p2's 2) and missing_source_count == 0"
            - "hop 3: ir1 -> status == RESPONSE_DRAFTED, completeness_score == null, responded_at == null, while provided_document_kinds is still ['STATION_LOG', 'TEST_LOGS'] and requested_at / response_due_at (2026-08-01T00:00:00Z / 2026-08-08T00:00:00Z) are unchanged"
            - "hop 3 is conditional: ir2 is untouched — status still CLOSED_SATISFIED with completeness_score 100.00 and a non-null responded_at"
            - "depth is three FK levels from the trigger entity (StatePlan -> Station -> InspectionRequest) inside one request"

  # ===========================================================================
  # RULE 5 — priority_pair_validation_conflict
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: occ_priority_6_beats_test_not_logged_priority_7
        grounds:
          - "§1.4 priority 6 (412 concurrency errors) vs priority 7 (409 state errors)"
          - "§1.2.1 concurrency_rules.filing-create-stale-test-event -> ERR_STALE_TEST_EVENT_VERSION (412)"
          - "§1.6 ERR_TEST_NOT_LOGGED (409): 'POST /filing-records targets a test event whose status is not LOGGED or FILED'"
          - "§1.2 state_machines.TestEvent SCHEDULED -> READINESS_PENDING, whose precondition is 'status IN {SCHEDULED, READINESS_PENDING}', so a still-failing re-run is a legal self transition that overwrites readiness_score"
          - "§1.3 calculations.test_event_readiness_score (ready_device_ratio 1/2 -> 60.00 < READINESS_PASS_MIN 80.00)"
        distinguishing_aspect: "A single POST /filing-records violates priority 6, 7 and 9 at once (stale version, status READINESS_PENDING, and no RECEIPT coverage); the response must be exactly ERR_STALE_TEST_EVENT_VERSION with 412, and re-issuing the identical body with a FRESH version then surfaces ERR_TEST_NOT_LOGGED with 409 — proving the 412 came first rather than being an artifact of the state check."
        test_recipe:
          setup:
            - "Plan KS 2026-R1 requiring PEP, activated; station KWEA; dev1 readiness-checked to READY; one ACTIVE PEP assignment; a second device dev2 left in REGISTERED so the readiness denominator is 2."
            - "TestEvent te1 WEEKLY [2026-08-12T00:00:00Z, 2026-08-12T01:00:00Z); clock 2026-08-12T00:30:00Z; evaluate-readiness scores 40 * 1/2 + 40 * 1/1 + 0 = 60.00 -> READINESS_PENDING. Its version is captured HERE as ${te_v_stale}."
            - "evaluate-readiness is re-run and still scores 60.00, taking the READINESS_PENDING self transition; that write advances TestEvent.version, so ${te_v_stale} is now stale."
            - "No log entry is ever appended, so status stays READINESS_PENDING and the receipt-coverage rule at priority 9 is violated too."
          setup_api_calls:
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
            - call: "POST /eas-devices"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", model_code: "DASDEC-3", device_role: "DECODER", firmware_version: "5.2.1" }
              captures: { dev1: "$.data.id" }
            - call: "POST /eas-devices/${dev1}/readiness-check"
              as: StationEngineer
              as_user_id: eng-1
              payload: { self_test_passed: true, firmware_current: true }
            - call: "POST /eas-devices"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", model_code: "DASDEC-3", device_role: "MONITOR", firmware_version: "5.2.0" }
              captures: { dev2: "$.data.id" }
            - call: "GET /stations/${station_id}"
              as: StationEngineer
              as_user_id: eng-1
              captures: { sv1: "$.data.version" }
            - call: "POST /monitoring-assignments"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", device_id: "${dev1}", source_type: "PEP", source_call_sign: "WXPEP", expected_station_version: "${sv1}" }
              captures: { ma1: "$.data.id" }
            - call: "POST /test-events"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { station_id: "${station_id}", test_type: "WEEKLY", window_start_at: "2026-08-12T00:00:00Z", window_end_at: "2026-08-12T01:00:00Z" }
              captures: { te1: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-12T00:30:00Z" }
            - call: "POST /test-events/${te1}/evaluate-readiness"
              as: StationEngineer
              as_user_id: eng-1
              payload: {}
              captures: { te_v_stale: "$.data.version" }
            - call: "POST /test-events/${te1}/evaluate-readiness"
              as: StationEngineer
              as_user_id: eng-1
              payload: {}
              captures: { te_v_fresh: "$.data.version" }
          trigger:
            - call: "POST /filing-records"
              as: CertifyingOfficer
              as_user_id: cert-1
              payload: { test_event_id: "${te1}", expected_test_event_version: "${te_v_stale}", attestation_note: "filed from a stale view of the test event" }
              captures: { err_412: "$.data.error_id" }
            - call: "POST /filing-records"
              as: CertifyingOfficer
              as_user_id: cert-1
              payload: { test_event_id: "${te1}", expected_test_event_version: "${te_v_fresh}", attestation_note: "same body, current version" }
              captures: { err_409: "$.data.error_id" }
          assert:
            - "both evaluations scored readiness_score == 60.00 == round(40 * 1/2 + 40 * 1/1 + 20 * 0, 2) -> status READINESS_PENDING both times"
            - "${te_v_fresh} == ${te_v_stale} + 1 — the READINESS_PENDING self transition is a write and bumps TestEvent.version"
            - "first call: ${err_412} == 'ERR_STALE_TEST_EVENT_VERSION' with HTTP 412 (priority 6 wins)"
            - "the response is NOT ERR_TEST_NOT_LOGGED (priority 7) and NOT ERR_RECEIPT_COVERAGE_INCOMPLETE (priority 9), even though both conditions hold"
            - "second call, identical except for the current version: ${err_409} == 'ERR_TEST_NOT_LOGGED' with HTTP 409 — status READINESS_PENDING is not in {LOGGED, FILED}"
            - "no FilingRecord row was created by either call and te1.status is still READINESS_PENDING with readiness_score 60.00"

      - name: receipt_coverage_priority_9_beats_segregation_of_duties_priority_11
        grounds:
          - "§1.4 priority 9 (ERR_RECEIPT_COVERAGE_INCOMPLETE, 422) vs priority 11 (ERR_SEGREGATION_OF_DUTIES, 422)"
          - "§1.6 ERR_RECEIPT_COVERAGE_INCOMPLETE: 'some source_type in the plan's required_source_types has no RECEIPT log line for the test event'"
          - "§1.6 ERR_SEGREGATION_OF_DUTIES: 'the acting X-User-ID equals logged_by_user_id on any TestLogEntry of that test event'"
          - "§1.1 Station.certification_officer_user_id 'may also appear in engineer_user_ids, which is what makes ERR_SEGREGATION_OF_DUTIES reachable'"
          - "§1.1 TestLogEntry.logged_by_user_id (source: system, from X-User-ID)"
        distinguishing_aspect: "Both 422s are live on the same request because the dual-role user dual-1 appended every log line and one required source type has no RECEIPT; the answer must be ERR_RECEIPT_COVERAGE_INCOMPLETE, and the sibling test event whose coverage IS complete — same station, same dual-role filer — then returns ERR_SEGREGATION_OF_DUTIES, so the two 422s are ordered rather than interchangeable."
        test_recipe:
          setup:
            - "Plan KS 2026-R1 requiring PEP AND NWS, activated. Station KDUO is created with engineer_user_ids ['dual-1'] and certification_officer_user_id 'dual-1', i.e. one human holding both duties."
