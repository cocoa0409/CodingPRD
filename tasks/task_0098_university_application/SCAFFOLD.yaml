scenario: |
  University Application Platform (Common App Style): Applicant profiles, multi-school joint
  applications, essay customization, recommendation letter workflows, Early Decision/Regular
  Decision/Rolling Admission, financial aid (FAFSA/CSS Profile), waitlists, Yield management.

domain_name: university-application-platform
api_prefix: /applications

# -----------------------------------------------------------------------------
# Complexity Profile (§0)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - ops_run_checkpoint
    - selector_policy

  entity_topology: graph
  # Application is the hub; Applicant, University, Program, Essay, Recommendation, FinancialAid,
  # and WaitlistEntry all link via foreign keys. Applicant↔University is many-to-many through
  # Application; recommenders sit outside the applicant tree.

  state_machine_shape: cyclic
  # Application supports DRAFT↔SUBMITTED revision withdraws; Recommendation supports
  # REQUESTED→DECLINED→REQUESTED reassignment loops; WaitlistEntry has ACTIVE→OFFERED→ACTIVE
  # reverts on offer expiry.

  relationship_patterns:
    - one_to_many        # Applicant -> Applications
    - many_to_many       # Applicant <-> Program via Application
    - cross_aggregate    # Application references FinancialAidPackage, WaitlistEntry, Essays

  role_model: peer_roles
  # Applicant, Recommender, AdmissionsOfficer, FinancialAidOfficer, PlatformAdmin each own
  # distinct resource types and operations.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:
  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Applicant legal name.
        constraints: "1..200 chars"
      - name: email
        type: string
        source: input
        description: Contact email; unique across Applicant.
        constraints: "RFC5322; unique"
      - name: date_of_birth
        type: string
        source: input
        description: ISO date YYYY-MM-DD; must be at least 14 years before now.
      - name: high_school_gpa
        type: number
        source: input
        description: Self-reported GPA on a 4.00 scale, two decimals.
        constraints: "0.00 <= gpa <= 4.00"
      - name: household_income_cents
        type: integer
        source: input
        description: Annual household income reported on profile (cents, USD).
        constraints: ">= 0"
      - name: fafsa_efc_cents
        type: integer
        source: input
        description: Expected Family Contribution from FAFSA (cents). Optional until financial aid requested.
        default: null
      - name: css_profile_efc_cents
        type: integer
        source: input
        description: Expected Family Contribution from CSS Profile (cents). Optional; private colleges typically require it.
        default: null
      - name: ed_commitment_application_id
        type: string
        source: computed
        description: |
          ID of the single Application currently bound under Early Decision. Set when an ED
          Application transitions DRAFT->SUBMITTED. Cleared only when that Application is
          REJECTED or WITHDRAWN. Enforces the one-ED-binding invariant.
        default: null

  - name: University
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: University display name; unique.
      - name: yield_target_count
        type: integer
        source: input
        description: |
          Total enrolled-class size the admissions office targets across all programs after
          yield management. Used to size the waitlist offer batch each sweep.
        constraints: ">= 1"
      - name: regular_decision_deadline
        type: string
        source: input
        description: ISO datetime — last moment RD Applications may be SUBMITTED.
      - name: early_decision_deadline
        type: string
        source: input
        description: ISO datetime — last moment ED Applications may be SUBMITTED.
      - name: rolling_admission_enabled
        type: boolean
        source: input
        description: If true, the university accepts ROLLING applications year-round (no submit deadline).
        default: false
      - name: enrolled_count
        type: integer
        source: computed
        description: |
          Running count of Applications currently in ENROLLED state at this university. Updated
          on every Application transition into or out of ENROLLED (cascade) and on each
          YieldSweep run.
        default: 0

  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: university_id
        type: string
        source: input
        description: Owning University id.
      - name: name
        type: string
        source: input
        description: Program/major name; unique within university.
      - name: capacity
        type: integer
        source: input
        description: Maximum number of Applications that may sit in ADMITTED or ENROLLED state simultaneously.
        constraints: ">= 1"
      - name: admitted_count
        type: integer
        source: computed
        description: |
          Sum of Applications currently in ADMITTED or ENROLLED state for this Program. Maintained
          incrementally on every Application state transition.
        default: 0

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: FK to Applicant.
      - name: program_id
        type: string
        source: input
        description: FK to Program.
      - name: round
        type: enum
        source: input
        description: Admission round.
        constraints: "one of: EARLY_DECISION, REGULAR_DECISION, ROLLING"
      - name: status
        type: enum
        source: computed
        description: Application lifecycle state (see §1.2).
        constraints: "one of: DRAFT, SUBMITTED, UNDER_REVIEW, ADMITTED, REJECTED, WAITLISTED, ENROLLED, WITHDRAWN"
        default: DRAFT
      - name: essay_id
        type: string
        source: computed
        description: FK to the EssaySubmission currently attached. Null until an essay is attached in DRAFT.
        default: null
      - name: required_recommendation_count
        type: integer
        source: input
        description: Number of completed recommendation letters required before submission.
        constraints: "2 or 3"
        default: 2
      - name: submitted_at
        type: datetime
        source: computed
        description: Set on DRAFT->SUBMITTED.
        default: null
      - name: admission_decision_at
        type: datetime
        source: computed
        description: Set on UNDER_REVIEW->{ADMITTED,REJECTED,WAITLISTED}.
        default: null
      - name: enrollment_deadline
        type: datetime
        source: computed
        description: |
          For ADMITTED RD/ROLLING Applications: admission_decision_at + 30 days. For ED:
          admission_decision_at + 14 days. Used to auto-revoke admissions that don't enroll.
        default: null

  - name: EssaySubmission
    parent: Application
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: input
        description: FK to Application; the essay belongs to exactly one application.
      - name: prompt_code
        type: string
        source: input
        description: Identifier for the university-specific essay prompt the essay answers.
      - name: body
        type: string
        source: input
        description: Essay text.
        constraints: "min 250 chars; max 6500 chars"
      - name: word_count
        type: integer
        source: computed
        description: Auto-computed word count of body (whitespace tokenization).
      - name: customization_score
        type: number
        source: computed
        description: |
          Heuristic 0.00..1.00 indicating how customized the essay is for the target university.
          See calculations.essay_customization_score.

  - name: RecommendationRequest
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK to Application.
      - name: recommender_email
        type: string
        source: input
        description: Email of the recommender; one recommender per request.
      - name: status
        type: enum
        source: computed
        description: Recommendation workflow state (see §1.2).
        constraints: "one of: REQUESTED, ACCEPTED, SUBMITTED, DECLINED, EXPIRED"
        default: REQUESTED
      - name: invitation_expires_at
        type: datetime
        source: computed
        description: Set to created_at + 21 days; if no action by then, auto-EXPIRED.
      - name: letter_body
        type: string
        source: input
        description: Submitted letter content; required only when transitioning ACCEPTED->SUBMITTED.
        default: null
      - name: letter_word_count
        type: integer
        source: computed
        description: Computed on submission.
        default: null

  - name: FinancialAidPackage
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK to Application; at most one package per Application.
      - name: aid_method
        type: enum
        source: input
        description: Methodology used to compute the package.
        constraints: "one of: FEDERAL_METHODOLOGY, INSTITUTIONAL_METHODOLOGY"
      - name: status
        type: enum
        source: computed
        description: Aid package state (see §1.2).
        constraints: "one of: REQUESTED, OFFERED, ACCEPTED, DECLINED, REVOKED"
        default: REQUESTED
      - name: cost_of_attendance_cents
        type: integer
        source: input
        description: Sticker price for the program in cents.
        constraints: ">= 0"
      - name: grant_cents
        type: integer
        source: computed
        description: Need-based grant computed by aid_method (see calculations).
        default: 0
      - name: loan_cents
        type: integer
        source: computed
        description: Subsidized loan offered.
        default: 0
      - name: work_study_cents
        type: integer
        source: computed
        description: Work-study award.
        default: 0
      - name: total_award_cents
        type: integer
        source: computed
        description: grant + loan + work_study.
        default: 0

  - name: WaitlistEntry
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK to the Application that produced this waitlist entry (status was WAITLISTED).
      - name: program_id
        type: string
        source: input
        description: FK to Program (denormalized for selector queries).
      - name: status
        type: enum
        source: computed
        description: Waitlist entry state (see §1.2).
        constraints: "one of: ACTIVE, OFFERED, ACCEPTED, EXPIRED, RELEASED"
        default: ACTIVE
      - name: rank_score
        type: number
        source: computed
        description: |
          Composite score 0.00..100.00 used to order ACTIVE entries during YieldSweep promotion.
          See calculations.waitlist_rank_score.
      - name: offered_at
        type: datetime
        source: computed
        description: Set on ACTIVE->OFFERED by a YieldSweep.
        default: null
      - name: offer_expires_at
        type: datetime
        source: computed
        description: offered_at + 7 days; if not accepted by then, auto-EXPIRED and entry reverts to ACTIVE for next sweep.
        default: null

  - name: YieldSweep
    parent: University
    common_fields: false
    fields:
      - name: university_id
        type: string
        source: input
        description: University the sweep ran against.
      - name: epoch
        type: integer
        source: computed
        description: Monotonically increasing sweep counter per university; first run = 1.
      - name: enrolled_count_at_start
        type: integer
        source: system
        description: Snapshot of University.enrolled_count at sweep start.
      - name: offers_extended
        type: integer
        source: computed
        description: Number of WaitlistEntries transitioned ACTIVE->OFFERED in this sweep.
      - name: ran_at
        type: datetime
        source: system
        description: When the sweep executed (server clock).

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:

  # ---- Application (cyclic: DRAFT <-> SUBMITTED via withdraw; revision loop) ----
  - entity: Application
    initial_state: DRAFT
    terminal_states: [REJECTED, WITHDRAWN, ENROLLED]
    transitions:

      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "Application.essay_id is not null and the linked EssaySubmission.customization_score >= 0.30"
          - "Count of RecommendationRequest where application_id=this and status=SUBMITTED equals Application.required_recommendation_count"
          - "If round=EARLY_DECISION: Applicant.ed_commitment_application_id is null OR equals this.id"
          - "If round=EARLY_DECISION: now() <= University.early_decision_deadline"
          - "If round=REGULAR_DECISION: now() <= University.regular_decision_deadline"
          - "If round=ROLLING: University.rolling_admission_enabled is true"
        side_effects:
          - "Set submitted_at = now()"
          - "If round=EARLY_DECISION: set Applicant.ed_commitment_application_id = this.id (binds applicant)"

      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /applications/{id}/withdraw-submission"
        actor: Applicant
        preconditions:
          - "Application is not yet UNDER_REVIEW (no AdmissionsOfficer has begun review)"
          - "If round=EARLY_DECISION: now() <= University.early_decision_deadline"
        side_effects:
          - "Clear submitted_at"
          - "If round=EARLY_DECISION: clear Applicant.ed_commitment_application_id"
        note: "Revision loop — applicant pulls back to DRAFT to edit essays/recommendations."

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /applications/{id}/begin-review"
        actor: AdmissionsOfficer
        preconditions:
          - "AdmissionsOfficer.university_id == Program.university_id"
        side_effects: []

      - from: UNDER_REVIEW
        to: ADMITTED
        trigger: "POST /applications/{id}/decide with decision=ADMIT"
        actor: AdmissionsOfficer
        preconditions:
          - "Program.admitted_count + 1 <= Program.capacity"
        side_effects:
          - "Set admission_decision_at = now()"
          - "Set enrollment_deadline = admission_decision_at + (14 days if round=EARLY_DECISION else 30 days)"
          - "Increment Program.admitted_count by 1"
          - "If round=EARLY_DECISION: cascade — every other Application of this Applicant in status DRAFT or SUBMITTED transitions to WITHDRAWN; for each such Application's ED commitment, clear Applicant.ed_commitment_application_id only when this Application moves to ENROLLED (not here)"

      - from: UNDER_REVIEW
        to: WAITLISTED
        trigger: "POST /applications/{id}/decide with decision=WAITLIST"
        actor: AdmissionsOfficer
        preconditions: []
        side_effects:
          - "Set admission_decision_at = now()"
          - "Create WaitlistEntry{application_id=this.id, program_id=this.program_id, status=ACTIVE}; compute rank_score via calculations.waitlist_rank_score"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /applications/{id}/decide with decision=REJECT"
        actor: AdmissionsOfficer
        preconditions: []
        side_effects:
          - "Set admission_decision_at = now()"
          - "If round=EARLY_DECISION and Applicant.ed_commitment_application_id == this.id: clear Applicant.ed_commitment_application_id (releases applicant to apply RD elsewhere)"
          - "If a FinancialAidPackage exists for this Application: transition that package OFFERED->REVOKED or REQUESTED->REVOKED (cascade hop 2)"

      - from: ADMITTED
        to: ENROLLED
        trigger: "POST /applications/{id}/enroll"
        actor: Applicant
        preconditions:
          - "now() <= Application.enrollment_deadline"
          - "If a FinancialAidPackage exists for this Application: its status == ACCEPTED OR DECLINED (applicant must have responded)"
          - "Applicant has no other Application in ENROLLED state"
        side_effects:
          - "Increment University.enrolled_count by 1"
          - "Cascade: every other Application of this Applicant in {DRAFT, SUBMITTED, UNDER_REVIEW, ADMITTED, WAITLISTED} transitions to WITHDRAWN"
          - "Cascade (hop 2): each WaitlistEntry tied to those withdrawn Applications transitions to RELEASED"
          - "Cascade (hop 3): each FinancialAidPackage tied to those withdrawn Applications transitions to REVOKED"

      - from: ADMITTED
        to: WITHDRAWN
        trigger: "system: YieldSweep auto-revoke when now() > enrollment_deadline"
        actor: system
        preconditions:
          - "now() > Application.enrollment_deadline"
        side_effects:
          - "Decrement Program.admitted_count by 1"
          - "If FinancialAidPackage exists: cascade to REVOKED"

      - from: WAITLISTED
        to: ADMITTED
        trigger: "system: YieldSweep promotes a WaitlistEntry from OFFERED to ACCEPTED triggers its Application's WAITLISTED->ADMITTED"
        actor: system
        preconditions:
          - "Linked WaitlistEntry.status == ACCEPTED"
        side_effects:
          - "Set admission_decision_at = now()"
          - "Set enrollment_deadline = now() + 30 days"
          - "Increment Program.admitted_count by 1"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant
        preconditions: []
        side_effects:
          - "If round=EARLY_DECISION and Applicant.ed_commitment_application_id == this.id: clear Applicant.ed_commitment_application_id"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant
        preconditions: []
        side_effects:
          - "If round=EARLY_DECISION and Applicant.ed_commitment_application_id == this.id: clear Applicant.ed_commitment_application_id"

  # ---- RecommendationRequest (branching with revert + expiry) ----
  - entity: RecommendationRequest
    initial_state: REQUESTED
    terminal_states: [SUBMITTED, EXPIRED]
    transitions:

      - from: REQUESTED
        to: ACCEPTED
        trigger: "POST /recommendations/{id}/accept"
        actor: Recommender
        preconditions:
          - "now() <= invitation_expires_at"
          - "linked Application.status in {DRAFT, SUBMITTED}"
        side_effects: []

      - from: REQUESTED
        to: DECLINED
        trigger: "POST /recommendations/{id}/decline"
        actor: Recommender
        preconditions: []
        side_effects: []

      - from: DECLINED
        to: REQUESTED
        trigger: "POST /recommendations/{id}/reassign with recommender_email"
        actor: Applicant
        preconditions:
          - "linked Application.status == DRAFT"
        side_effects:
          - "Set invitation_expires_at = now() + 21 days"
          - "Set recommender_email = new value"
        note: "Cyclic loop — applicant can swap recommenders until a successful submission is achieved."

      - from: ACCEPTED
        to: SUBMITTED
        trigger: "POST /recommendations/{id}/submit-letter"
        actor: Recommender
        preconditions:
          - "letter_body provided"
          - "linked Application.status in {DRAFT, SUBMITTED, UNDER_REVIEW}"
        side_effects:
          - "Set letter_word_count = wordcount(letter_body)"
          - "If letter_word_count < 200: the letter is recorded but the requirement is NOT yet met — Application.submit precondition will continue to fail until a re-submitted letter meets the threshold; see ERR_WEAK_LETTER on resubmit"

      - from: REQUESTED
        to: EXPIRED
        trigger: "system: now() > invitation_expires_at"
        actor: system
        preconditions:
          - "now() > invitation_expires_at"
        side_effects: []

      - from: ACCEPTED
        to: EXPIRED
        trigger: "system: now() > invitation_expires_at"
        actor: system
        preconditions:
          - "now() > invitation_expires_at"
        side_effects: []

  # ---- FinancialAidPackage ----
  - entity: FinancialAidPackage
    initial_state: REQUESTED
    terminal_states: [ACCEPTED, DECLINED, REVOKED]
    transitions:

      - from: REQUESTED
        to: OFFERED
        trigger: "POST /financial-aid/{id}/issue-offer"
        actor: FinancialAidOfficer
        preconditions:
          - "linked Application.status == ADMITTED"
          - "If aid_method=INSTITUTIONAL_METHODOLOGY: Applicant.css_profile_efc_cents is not null"
          - "If aid_method=FEDERAL_METHODOLOGY: Applicant.fafsa_efc_cents is not null"
        side_effects:
          - "Recompute grant_cents, loan_cents, work_study_cents, total_award_cents via calculations.financial_aid_award"

      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /financial-aid/{id}/accept"
        actor: Applicant
        preconditions:
          - "linked Application.status == ADMITTED"
          - "now() <= linked Application.enrollment_deadline"
        side_effects: []

      - from: OFFERED
        to: DECLINED
        trigger: "POST /financial-aid/{id}/decline"
        actor: Applicant
        preconditions: []
        side_effects: []

      - from: REQUESTED
        to: REVOKED
        trigger: "system: cascade from Application REJECTED or WITHDRAWN"
        actor: system
        preconditions:
          - "linked Application.status in {REJECTED, WITHDRAWN}"
        side_effects: []

      - from: OFFERED
        to: REVOKED
        trigger: "system: cascade from Application REJECTED, WITHDRAWN, or auto-revoke"
        actor: system
        preconditions:
          - "linked Application.status in {REJECTED, WITHDRAWN}"
        side_effects: []

  # ---- WaitlistEntry (cyclic: ACTIVE -> OFFERED -> ACTIVE on offer expiry) ----
  - entity: WaitlistEntry
    initial_state: ACTIVE
    terminal_states: [ACCEPTED, RELEASED]
    transitions:

      - from: ACTIVE
        to: OFFERED
        trigger: "system: YieldSweep selects this entry for promotion"
        actor: system
        preconditions:
          - "Program.admitted_count < Program.capacity"
          - "this entry has the highest rank_score among ACTIVE entries for the same Program (tie-break: oldest WaitlistEntry.created_at, then lexicographic id)"
        side_effects:
          - "Set offered_at = now(), offer_expires_at = now() + 7 days"

      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /waitlist/{id}/accept-offer"
        actor: Applicant
        preconditions:
          - "now() <= offer_expires_at"
          - "linked Application.status == WAITLISTED"
        side_effects:
          - "Cascade: linked Application transitions WAITLISTED->ADMITTED (hop 2)"
          - "If Applicant has any other Application in ADMITTED state: that Application's enrollment_deadline is preserved (no auto-effects here; deferred to Application.enroll cascade)"

      - from: OFFERED
        to: ACTIVE
        trigger: "system: now() > offer_expires_at and no acceptance"
        actor: system
        preconditions:
          - "now() > offer_expires_at"
        side_effects:
          - "Clear offered_at, offer_expires_at"
          - "Recompute rank_score (will rejoin candidate pool next sweep)"

      - from: ACTIVE
        to: RELEASED
        trigger: "system: cascade — linked Application transitions to WITHDRAWN or REJECTED"
        actor: system
        preconditions:
          - "linked Application.status in {WITHDRAWN, REJECTED}"
        side_effects: []

      - from: OFFERED
        to: RELEASED
        trigger: "system: cascade — linked Application transitions to WITHDRAWN or REJECTED"
        actor: system
        preconditions:
          - "linked Application.status in {WITHDRAWN, REJECTED}"
        side_effects: []

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:

  - scenario: "Applicant submits two Early Decision applications simultaneously"
    guarantee: "At most one ED Application binds the Applicant; the second submit is rejected."
    error_id: ERR_ED_ALREADY_BOUND
    http_status: 409
    serialization: "First-writer-wins on Applicant.ed_commitment_application_id (set under row lock)."

  - scenario: "Two AdmissionsOfficers decide on the same Application simultaneously (ADMIT and REJECT race)"
    guarantee: "Exactly one decision wins; the loser sees the row already in ADMITTED/REJECTED state."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Application.status."

  - scenario: "Two Applicants race to accept the last WaitlistEntry offer when Program has exactly 1 remaining seat"
    guarantee: "Exactly one acceptance succeeds; the second is rejected because Program capacity is exhausted."
    error_id: ERR_PROGRAM_AT_CAPACITY
    http_status: 409
    serialization: "Atomic compare-and-increment on Program.admitted_count vs Program.capacity."

  - scenario: "Applicant accepts and declines a FinancialAidPackage simultaneously"
    guarantee: "Exactly one terminal-status transition is recorded; the other sees an invalid transition."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on FinancialAidPackage.status."

  - scenario: "YieldSweep runs concurrently with manual Application.enroll calls"
    guarantee: "University.enrolled_count remains exactly the count of Applications in ENROLLED state; no double-count from interleaving."
    error_id: ERR_SWEEP_IN_PROGRESS
    http_status: 409
    serialization: "YieldSweep takes an advisory University-scoped lock; enroll calls during sweep are rejected."

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# -----------------------------------------------------------------------------
calculations:

  # ---- Dual-variant calculation #1: financial aid (FAFSA vs CSS) ----
  - name: financial_aid_award
    trigger: "FinancialAidPackage transitions REQUESTED->OFFERED (POST /financial-aid/{id}/issue-offer)"
    algorithm: tiered_pricing
    formula: |
      # Need = max(0, cost_of_attendance_cents - efc_cents)
      #
      # Federal Methodology (FAFSA):
      #   efc = Applicant.fafsa_efc_cents
      #   need = max(0, COA - efc)
      #   loan = min(need, FEDERAL_LOAN_CAP_CENTS)          # 5,500,00 cents = $5,500
      #   work_study = min(max(0, need - loan), FEDERAL_WS_CAP_CENTS)   # 2,500,00 cents = $2,500
      #   grant = max(0, need - loan - work_study)
      #
      # Institutional Methodology (CSS Profile):
      #   efc = Applicant.css_profile_efc_cents
      #   need = max(0, COA - efc)
      #   grant_pct = INSTITUTIONAL_GRANT_PCT  # 0.70 of need
      #   grant = round_half_up(need * grant_pct, cents)
      #   loan = min(need - grant, INSTITUTIONAL_LOAN_CAP_CENTS)        # 3,500,00 cents = $3,500
      #   work_study = max(0, need - grant - loan)
      #
      # total_award_cents = grant_cents + loan_cents + work_study_cents
    input_set: |
      Single FinancialAidPackage row + its linked Applicant fields + Application.program.
      The two methodologies (Federal vs Institutional) consume different EFC fields and
      apply different waterfall priority — same applicant + same COA produce different
      total_award_cents.
    constants:
      FEDERAL_LOAN_CAP_CENTS: 550000
      FEDERAL_WS_CAP_CENTS: 250000
      INSTITUTIONAL_GRANT_PCT: 0.70
      INSTITUTIONAL_LOAN_CAP_CENTS: 350000
    precision: "Integer cents; multiplication rounds half-up to the cent at each named step."
    variants:
      - name: federal_methodology
        when: "aid_method == FEDERAL_METHODOLOGY"
        difference: "Loan-first waterfall using FAFSA EFC; loans capped at $5,500, work-study at $2,500, grant absorbs remainder."
      - name: institutional_methodology
        when: "aid_method == INSTITUTIONAL_METHODOLOGY"
        difference: "Grant-first using CSS EFC at 70% of need, then loans capped at $3,500, work-study absorbs remainder."

  # ---- Dual-variant calculation #2: essay customization score ----
  - name: essay_customization_score
    trigger: "EssaySubmission create or update (POST /applications/{id}/essays, PATCH /essays/{id})"
    algorithm: weighted_scoring
    formula: |
      # Inputs: essay.body, target_university.name, target_program.name, essay.prompt_code
      #
      # token_count = whitespace_split(body) length
      # mentions_uni = count of case-insensitive whole-word matches of target_university.name in body
      # mentions_prog = count of case-insensitive whole-word matches of target_program.name in body
      # prompt_match = 1.0 if prompt_code starts with target_university.id-prefix code else 0.0
      #
      # Provisional (DRAFT essay):
      #   length_factor = min(1.0, token_count / 500.0)
      #   raw_score = 0.40 * length_factor
      #              + 0.20 * min(1.0, mentions_uni / 2.0)
      #              + 0.20 * min(1.0, mentions_prog / 2.0)
      #              + 0.20 * prompt_match
      #   customization_score = round_half_up(raw_score, 2 decimals)
      #
      # Final (essay attached to a SUBMITTED Application):
      #   Same formula but length_factor saturates at token_count / 650.0 (stricter)
      #   AND prompt_match contributes 0.30 weight (others rebalance proportionally:
      #   length 0.35, uni 0.175, prog 0.175, prompt 0.30).
      #   customization_score = round_half_up(raw_score, 2 decimals)
    input_set: |
      Single EssaySubmission row + its Application.program.university and prompt_code.
      Excludes essays attached to Applications in {WITHDRAWN, REJECTED}.
    constants:
      DRAFT_PROMPT_WEIGHT: 0.20
      DRAFT_LENGTH_DIVISOR: 500.0
      FINAL_PROMPT_WEIGHT: 0.30
      FINAL_LENGTH_DIVISOR: 650.0
      MIN_SUBMIT_SCORE: 0.30
    precision: "2 decimal places, round_half_up."
    variants:
      - name: provisional_draft_score
        when: "linked Application.status == DRAFT"
        difference: "Length-dominated weighting (40%), softer prompt match (20%)."
      - name: final_submitted_score
        when: "linked Application.status in {SUBMITTED, UNDER_REVIEW, ADMITTED, WAITLISTED}"
        difference: "Prompt-match-dominated weighting (30%) plus stricter length saturation (650 tokens vs 500); same essay text yields a lower or different score after submission."

  # ---- Combinatorial formula mode (b): nested rounding order ----
  - name: waitlist_rank_score
    trigger: "WaitlistEntry create (cascade from Application.WAITLISTED) and on YieldSweep run"
    algorithm: weighted_scoring
    formula: |
      # Inputs: linked Application.applicant.high_school_gpa,
      #         linked EssaySubmission.customization_score,
      #         days_on_waitlist = floor((now - WaitlistEntry.created_at) / 1 day),
      #         demonstrated_interest = count of distinct Application records by this Applicant
      #                                 to programs of THIS University currently in
      #                                 {SUBMITTED, UNDER_REVIEW, ADMITTED, WAITLISTED, ENROLLED}
      #
      # PINNED ROUND ORDER (per-component-then-sum):
      #   gpa_component = round_half_up( (gpa / 4.00) * 40.00, 2 )      # 0..40.00
      #   essay_component = round_half_up( customization_score * 30.00, 2 )  # 0..30.00
      #   tenure_component = round_half_up( min(days_on_waitlist, 30) * 0.50, 2 )  # 0..15.00
      #   interest_component = round_half_up( min(demonstrated_interest, 3) * 5.00, 2 )  # 0..15.00
      #   rank_score = round_half_up(gpa_component + essay_component + tenure_component + interest_component, 2)
      #
      # The "round each component, then sum, then round once more" order is PINNED.
      # Computing as a single expression "round_half_up(gpa/4*40 + cs*30 + ..., 2)" would
      # produce different cents at edge inputs — this is explicitly the wrong order.
    input_set: |
      Single WaitlistEntry row + its Application + Applicant + EssaySubmission.
      demonstrated_interest aggregates only over the SAME university's programs and
      excludes Applications in {DRAFT, REJECTED, WITHDRAWN}.
    constants:
      GPA_WEIGHT: 40.00
      ESSAY_WEIGHT: 30.00
      TENURE_DAY_VALUE: 0.50
      TENURE_DAY_CAP: 30
      INTEREST_PER_PROGRAM: 5.00
      INTEREST_PROGRAM_CAP: 3
    precision: "2 decimal places; round_half_up applied per-component then once on the sum."

  # ---- Combinatorial formula mode (a): non-linear yield-management batch sizing ----
  - name: yield_offer_batch_size
    trigger: "POST /universities/{id}/yield-sweep run"
    algorithm: threshold
    formula: |
      # Goal: size the batch of WaitlistEntry promotions for this sweep.
      # Inputs (>=3, non-linear interaction):
      #   target = University.yield_target_count
      #   enrolled = University.enrolled_count               (current)
      #   admitted_open = sum over Programs at this University of max(0, Program.capacity - Program.admitted_count)
      #   melt_rate = MELT_RATE_CONSTANT  (= 0.15 — expected fraction of ADMITTED who will not enroll)
      #
      # gap = max(0, target - enrolled)
      # expected_melt = round_half_up(admitted_open * melt_rate, 0)   # rounded to whole offers
      # raw_batch = max(0, gap - expected_melt)
      # capacity_cap = admitted_open                          # cannot offer more than open admit slots
      # batch_size = min(raw_batch, capacity_cap, MAX_BATCH_PER_SWEEP)
      #
      # Then sort all ACTIVE WaitlistEntries across all Programs of this University by
      # rank_score DESC, tie-break (oldest created_at, then lexicographic id), and offer
      # exactly the first batch_size entries that fit per-Program remaining capacity:
      #   for entry in sorted_entries:
      #     if Program(entry).admitted_count < Program(entry).capacity:
      #       promote entry; Program.admitted_count += 1   # provisional reservation
      # The provisional Program.admitted_count increment is reverted if offer expires.
    input_set: |
      All Programs at the University; all ACTIVE WaitlistEntries linked to those Programs.
      Excludes RELEASED, EXPIRED, ACCEPTED entries.
    constants:
      MELT_RATE_CONSTANT: 0.15
      MAX_BATCH_PER_SWEEP: 50
    precision: "Integer offers; expected_melt rounded half-up to nearest whole; rank_score retains its own precision."

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# -----------------------------------------------------------------------------
validations:

  # --- Authentication / Authorization ---
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the declared roles"
    error_id: ERR_AUTH_INVALID_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "Role is permitted to invoke this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  # --- Existence (left-to-right path resolution) ---
  - priority: 10
    category: existence
    check: "Applicant referenced in path or body exists"
    error_id: ERR_APPLICANT_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 11
    category: existence
    check: "University referenced in path or body exists"
    error_id: ERR_UNIVERSITY_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 12
    category: existence
    check: "Program referenced in path or body exists"
    error_id: ERR_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 13
    category: existence
    check: "Application referenced exists"
    error_id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 14
    category: existence
    check: "RecommendationRequest / EssaySubmission / FinancialAidPackage / WaitlistEntry referenced exists"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all

  # --- Body shape / input validation ---
  - priority: 20
    category: business_constraint
    check: "Required fields present and types valid per §1.1"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

  - priority: 21
    category: business_constraint
    check: "Applicant.high_school_gpa in [0.00, 4.00], household_income_cents >= 0"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "POST/PATCH /applicants"

  - priority: 22
    category: business_constraint
    check: "EssaySubmission.body length in [250, 6500] characters"
    error_id: ERR_ESSAY_LENGTH
    http_status: 422
    applies_to: "POST /applications/{id}/essays, PATCH /essays/{id}"

  - priority: 23
    category: business_constraint
    check: "Application.round is one of {EARLY_DECISION, REGULAR_DECISION, ROLLING}; required_recommendation_count in {2, 3}"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "POST /applications"

  # --- State preconditions ---
  - priority: 30
    category: state
    check: "Target entity is in a valid state for this transition (see §1.2 transition.from)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 31
    category: state
    check: "OCC: request-provided version equals entity.version when version is supplied"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH and mutation endpoints accepting version"

  # --- Business: SAFETY / fairness — checked BEFORE referential/capacity ---
  - priority: 40
    category: business_safety
    check: "Submitting an EARLY_DECISION Application — Applicant has no other ED commitment (Applicant.ed_commitment_application_id is null or this id)"
    error_id: ERR_ED_ALREADY_BOUND
    http_status: 409
    applies_to: "POST /applications/{id}/submit"

  - priority: 41
    category: business_safety
    check: "Submitting an EARLY_DECISION Application — now() <= University.early_decision_deadline (ED window open)"
    error_id: ERR_ED_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /applications/{id}/submit"

  - priority: 42
    category: business_safety
    check: "AdmissionsOfficer.university_id == Program.university_id (officer scoped to their school)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "POST /applications/{id}/begin-review, /decide"

  # --- Business: REFERENTIAL (cross-entity links and counts) ---
  - priority: 50
    category: business_referential
    check: "Application.essay_id resolves to an EssaySubmission whose customization_score >= 0.30"
    error_id: ERR_ESSAY_NOT_CUSTOMIZED
    http_status: 422
    applies_to: "POST /applications/{id}/submit"

  - priority: 51
    category: business_referential
    check: "Application has exactly Application.required_recommendation_count RecommendationRequests in SUBMITTED status"
    error_id: ERR_INSUFFICIENT_RECOMMENDATIONS
    http_status: 422
    applies_to: "POST /applications/{id}/submit"

  - priority: 52
    category: business_referential
    check: "Each submitted recommendation letter has letter_word_count >= 200 (weak letters do not count toward the requirement)"
    error_id: ERR_WEAK_LETTER
    http_status: 422
    applies_to: "POST /recommendations/{id}/submit-letter (rejected at submit), and indirectly POST /applications/{id}/submit"

  - priority: 53
    category: business_referential
    check: "FinancialAidPackage issuance — Applicant has the EFC field required by aid_method (fafsa_efc_cents for FEDERAL; css_profile_efc_cents for INSTITUTIONAL)"
    error_id: ERR_MISSING_EFC
    http_status: 422
    applies_to: "POST /financial-aid/{id}/issue-offer"

  # --- Business: CAPACITY / FISCAL (last) ---
  - priority: 60
    category: business_fiscal
    check: "Admitting an Application — Program.admitted_count + 1 <= Program.capacity"
    error_id: ERR_PROGRAM_AT_CAPACITY
    http_status: 409
    applies_to: "POST /applications/{id}/decide with decision=ADMIT, POST /waitlist/{id}/accept-offer"

  - priority: 61
    category: business_fiscal
    check: "Enrolling — now() <= Application.enrollment_deadline (strictly: now() <= deadline; > triggers ERR_ENROLLMENT_DEADLINE_PASSED, == is still accepted)"
    error_id: ERR_ENROLLMENT_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /applications/{id}/enroll"

  - priority: 62
    category: business_temporal
    check: "Accepting a WaitlistEntry offer — now() <= WaitlistEntry.offer_expires_at"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /waitlist/{id}/accept-offer"

  - priority: 63
    category: business_temporal
    check: "Submitting an Application — round-dependent deadline not yet passed (REGULAR_DECISION: now() <= University.regular_decision_deadline; ROLLING: University.rolling_admission_enabled == true)"
    error_id: ERR_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /applications/{id}/submit"

  - priority: 64
    category: business_fiscal
    check: "Applicant has no other Application in ENROLLED state when calling enroll"
    error_id: ERR_ALREADY_ENROLLED_ELSEWHERE
    http_status: 409
    applies_to: "POST /applications/{id}/enroll"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
# -----------------------------------------------------------------------------
endpoints:

  # --- Applicants ---
  - method: POST
    path: /applicants
    description: Create an applicant profile.
    roles: [Applicant, PlatformAdmin]
    code: 201
    input: ["full_name", "email", "date_of_birth", "high_school_gpa", "household_income_cents", "fafsa_efc_cents?", "css_profile_efc_cents?"]
    output: Applicant

  - method: GET
    path: /applicants/{id}
    description: Read applicant profile.
    roles: [Applicant, AdmissionsOfficer, FinancialAidOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Applicant

  - method: PATCH
    path: /applicants/{id}
    description: Update applicant fields (gpa, income, EFCs).
    roles: [Applicant, PlatformAdmin]
    code: 200
    input: ["high_school_gpa?", "household_income_cents?", "fafsa_efc_cents?", "css_profile_efc_cents?", "version?"]
    output: Applicant

  # --- Universities ---
  - method: POST
    path: /universities
    description: Register a university.
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "yield_target_count", "regular_decision_deadline", "early_decision_deadline", "rolling_admission_enabled?"]
    output: University

  - method: GET
    path: /universities/{id}
    description: Read university record.
    roles: [Applicant, AdmissionsOfficer, FinancialAidOfficer, PlatformAdmin]
    code: 200
    input: []
    output: University

  - method: POST
    path: /universities/{id}/programs
    description: Add a program under the university.
    roles: [AdmissionsOfficer, PlatformAdmin]
    code: 201
    input: [name, capacity]
    output: Program

  - method: GET
    path: /programs/{id}
    description: Read program record.
    roles: [Applicant, AdmissionsOfficer, FinancialAidOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Program

  # --- Applications ---
  - method: POST
    path: /applications
    description: Start a new application (status=DRAFT).
    roles: [Applicant]
    code: 201
    input: ["applicant_id", "program_id", "round", "required_recommendation_count?"]
    output: Application

  - method: GET
    path: /applications/{id}
    description: Read application detail.
    roles: [Applicant, AdmissionsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Application

  - method: GET
    path: /applications
    description: List applications with filters.
    roles: [Applicant, AdmissionsOfficer, PlatformAdmin]
    code: 200
    input: ["applicant_id?", "program_id?", "status?", "round?", "limit?", "offset?"]
    output: Application[]

  - method: POST
    path: /applications/{id}/submit
    description: Transition DRAFT->SUBMITTED.
    roles: [Applicant]
    code: 200
    input: ["version?"]
    output: Application
    side_effects: ["set submitted_at, bind ED commitment if applicable"]

  - method: POST
    path: /applications/{id}/withdraw-submission
    description: Transition SUBMITTED->DRAFT (revision loop).
    roles: [Applicant]
    code: 200
    input: ["version?"]
    output: Application

  - method: POST
    path: /applications/{id}/withdraw
    description: Transition DRAFT or SUBMITTED -> WITHDRAWN; cascades to children.
    roles: [Applicant]
    code: 200
    input: ["version?"]
    output: Application

  - method: POST
    path: /applications/{id}/begin-review
    description: Transition SUBMITTED->UNDER_REVIEW.
    roles: [AdmissionsOfficer]
    code: 200
    input: []
    output: Application

  - method: POST
    path: /applications/{id}/decide
    description: Transition UNDER_REVIEW->{ADMITTED,REJECTED,WAITLISTED}; cascades on ED ADMIT.
    roles: [AdmissionsOfficer]
    code: 200
    input: [decision]
    output: Application
    side_effects: ["set admission_decision_at, enrollment_deadline, create WaitlistEntry on WAITLIST, ED ADMIT cascades to withdraw applicant's other apps"]

  - method: POST
    path: /applications/{id}/enroll
    description: Transition ADMITTED->ENROLLED; cascades to withdraw siblings, release waitlists, revoke aid.
    roles: [Applicant]
    code: 200
    input: ["version?"]
    output: Application

  # --- Essays ---
  - method: POST
    path: /applications/{id}/essays
    description: Attach an essay to an Application (creates EssaySubmission and sets Application.essay_id).
    roles: [Applicant]
    code: 201
    input: [prompt_code, body]
    output: EssaySubmission

  - method: PATCH
    path: /essays/{id}
    description: Edit essay body or prompt_code; only while linked Application is DRAFT.
    roles: [Applicant]
    code: 200
    input: ["body?", "prompt_code?", "version?"]
    output: EssaySubmission

  - method: GET
    path: /essays/{id}
    description: Read essay.
    roles: [Applicant, AdmissionsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: EssaySubmission

  # --- Recommendations ---
  - method: POST
    path: /applications/{id}/recommendations
    description: Create a RecommendationRequest under an Application.
    roles: [Applicant]
    code: 201
    input: [recommender_email]
    output: RecommendationRequest

  - method: GET
    path: /recommendations/{id}
    description: Read a recommendation request.
    roles: [Applicant, Recommender, AdmissionsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: RecommendationRequest

  - method: POST
    path: /recommendations/{id}/accept
    description: Recommender accepts invitation (REQUESTED->ACCEPTED).
    roles: [Recommender]
    code: 200
    input: []
    output: RecommendationRequest

  - method: POST
    path: /recommendations/{id}/decline
    description: Recommender declines (REQUESTED->DECLINED).
    roles: [Recommender]
    code: 200
    input: []
    output: RecommendationRequest

  - method: POST
    path: /recommendations/{id}/reassign
    description: Applicant re-requests a different recommender after decline (DECLINED->REQUESTED).
    roles: [Applicant]
    code: 200
    input: [recommender_email]
    output: RecommendationRequest

  - method: POST
    path: /recommendations/{id}/submit-letter
    description: Recommender submits letter (ACCEPTED->SUBMITTED).
    roles: [Recommender]
    code: 200
    input: [letter_body]
    output: RecommendationRequest

  # --- Financial Aid ---
  - method: POST
    path: /applications/{id}/financial-aid
    description: Request a financial aid package (creates FinancialAidPackage in REQUESTED).
    roles: [Applicant]
    code: 201
    input: [aid_method, cost_of_attendance_cents]
    output: FinancialAidPackage

  - method: GET
    path: /financial-aid/{id}
    description: Read aid package.
    roles: [Applicant, FinancialAidOfficer, PlatformAdmin]
    code: 200
    input: []
    output: FinancialAidPackage

  - method: POST
    path: /financial-aid/{id}/issue-offer
    description: FinancialAidOfficer computes and issues the offer (REQUESTED->OFFERED).
    roles: [FinancialAidOfficer]
    code: 200
    input: []
    output: FinancialAidPackage
    side_effects: ["recompute grant/loan/work_study/total_award via financial_aid_award"]

  - method: POST
    path: /financial-aid/{id}/accept
    description: Applicant accepts offer (OFFERED->ACCEPTED).
    roles: [Applicant]
    code: 200
    input: ["version?"]
    output: FinancialAidPackage

  - method: POST
    path: /financial-aid/{id}/decline
    description: Applicant declines offer (OFFERED->DECLINED).
    roles: [Applicant]
    code: 200
    input: ["version?"]
    output: FinancialAidPackage

  # --- Waitlist ---
  - method: GET
    path: /waitlist/{id}
    description: Read a waitlist entry.
    roles: [Applicant, AdmissionsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: WaitlistEntry

  - method: POST
    path: /waitlist/{id}/accept-offer
    description: Applicant accepts a waitlist offer (OFFERED->ACCEPTED); cascades Application WAITLISTED->ADMITTED.
    roles: [Applicant]
    code: 200
    input: ["version?"]
    output: WaitlistEntry

  # --- Yield management ---
  - method: POST
    path: /universities/{id}/yield-sweep
    description: |
      Run a yield sweep on this university. Computes batch size via yield_offer_batch_size,
      promotes ACTIVE WaitlistEntries to OFFERED in rank order, auto-expires past-due offers,
      auto-revokes ADMITTED applications past enrollment_deadline. Returns the YieldSweep record.
    roles: [AdmissionsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: YieldSweep
    side_effects: ["WaitlistEntry ACTIVE->OFFERED batch; OFFERED->ACTIVE on expiry; ADMITTED->WITHDRAWN on past deadline; refresh University.enrolled_count"]

  - method: GET
    path: /universities/{id}/yield-sweeps
    description: List YieldSweep history for this university.
    roles: [AdmissionsOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: YieldSweep[]

  # --- Test-driving (clock control) ---
  - method: POST
    path: /_clock/advance
    description: Advance the server clock by the given duration. Required to test time-gated transitions (deadlines, offer expiry, recommendation expiry).
    roles: [PlatformAdmin]
    code: 200
    input: [seconds]
    output: null

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:

  # auth
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "Required auth headers (X-User-Role, X-User-ID) missing or empty."
  - id: ERR_AUTH_INVALID_ROLE
    http: 403
    condition: "X-User-Role is not one of the declared roles."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Authenticated role is not permitted to invoke this endpoint or operate on this resource."

  # not-found
  - id: ERR_APPLICANT_NOT_FOUND
    http: 404
    condition: "Referenced Applicant id does not exist."
  - id: ERR_UNIVERSITY_NOT_FOUND
    http: 404
    condition: "Referenced University id does not exist."
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "Referenced Program id does not exist."
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "Referenced Application id does not exist."
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Referenced Recommendation/Essay/FinancialAid/WaitlistEntry id does not exist."

  # input
  - id: ERR_VALIDATION
    http: 400
    condition: "Request body fails type / shape / range validation."
  - id: ERR_ESSAY_LENGTH
    http: 422
    condition: "EssaySubmission.body length outside [250, 6500] characters."

  # state / concurrency
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Entity is not in a state where this operation is valid."
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Provided version does not match the entity's current version (OCC)."
  - id: ERR_SWEEP_IN_PROGRESS
    http: 409
    condition: "A YieldSweep is holding the university-scoped lock; mutating operation rejected until it completes."

  # business: ED / submission gates
  - id: ERR_ED_ALREADY_BOUND
    http: 409
    condition: "Applicant already has an active Early Decision commitment on a different Application."
  - id: ERR_ED_DEADLINE_PASSED
    http: 409
    condition: "Early Decision submission window has closed for this university."
  - id: ERR_DEADLINE_PASSED
    http: 409
    condition: "Regular Decision deadline passed, or rolling admission not enabled for this university."
  - id: ERR_ESSAY_NOT_CUSTOMIZED
    http: 422
    condition: "Application essay customization_score below 0.30 — essay not specific enough."
  - id: ERR_INSUFFICIENT_RECOMMENDATIONS
    http: 422
    condition: "Application has fewer SUBMITTED recommendation letters than required_recommendation_count."
  - id: ERR_WEAK_LETTER
    http: 422
    condition: "RecommendationRequest letter has fewer than 200 words; will not count toward the requirement."
  - id: ERR_MISSING_EFC
    http: 422
    condition: "Required EFC field (fafsa_efc_cents for FEDERAL, css_profile_efc_cents for INSTITUTIONAL) is null on the Applicant."

  # business: capacity / enrollment
  - id: ERR_PROGRAM_AT_CAPACITY
    http: 409
    condition: "Admitting this Application would exceed Program.capacity."
  - id: ERR_ENROLLMENT_DEADLINE_PASSED
    http: 409
    condition: "Application.enrollment_deadline has passed; cannot enroll."
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "WaitlistEntry.offer_expires_at has passed; offer no longer valid."
  - id: ERR_ALREADY_ENROLLED_ELSEWHERE
    http: 409
    condition: "Applicant already has another Application in ENROLLED state."

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix
# -----------------------------------------------------------------------------
roles:

  - name: Applicant
    description: A prospective student submitting applications, essays, and recommendations on their own behalf.
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /applicants (self-onboarding)"
      - "POST /applications, /applications/{id}/submit, /withdraw, /withdraw-submission, /enroll"
      - "POST /applications/{id}/essays, PATCH /essays/{id}"
      - "POST /applications/{id}/recommendations, /recommendations/{id}/reassign"
      - "POST /applications/{id}/financial-aid, /financial-aid/{id}/accept, /financial-aid/{id}/decline"
      - "POST /waitlist/{id}/accept-offer"
    shared_operations:
      - "GET on own Applicant, Application, Essay, Recommendation, FinancialAid, WaitlistEntry records"

  - name: Recommender
    description: A teacher/advisor invited by an Applicant to submit a recommendation letter.
    identity: "opaque"
    exclusive_operations:
      - "POST /recommendations/{id}/accept, /decline, /submit-letter"
    shared_operations:
      - "GET /recommendations/{id} (only those addressed to the calling X-User-ID's email)"

  - name: AdmissionsOfficer
    description: A university staff member who reviews applications and renders admission decisions.
    identity: "opaque"
    exclusive_operations:
      - "POST /universities/{id}/programs"
      - "POST /applications/{id}/begin-review, /decide"
      - "POST /universities/{id}/yield-sweep"
    shared_operations:
      - "GET on Application, Essay, Recommendation, WaitlistEntry, YieldSweep records of this officer's university"
    # Note: officer's university scope is asserted via Application.program.university_id checks
    # at the validation layer (priority 42), not by entity identity.

  - name: FinancialAidOfficer
    description: A university staff member who computes and issues financial aid packages.
    identity: "opaque"
    exclusive_operations:
      - "POST /financial-aid/{id}/issue-offer"
    shared_operations:
      - "GET on FinancialAidPackage, Applicant records for applications at this officer's university"

  - name: PlatformAdmin
    description: System operator with full read access and clock/lifecycle controls.
    identity: "opaque"
    exclusive_operations:
      - "POST /universities (register a university)"
      - "POST /_clock/advance"
    shared_operations:
      - "All GET endpoints"
      - "POST /universities/{id}/yield-sweep (also available to AdmissionsOfficer)"
