            - call: "POST /school/attendance"
              payload: { enrollment_id: "${enr_id}", instructor_id: "${ins_id}", session_date_iso: "2026-05-01T00:00:00Z", scheduled_hours: 405, hours: 405 }
              as: Instructor
              as_user_id: "${ins_id}"
              captures: { att_id: $.data.id }
            - call: "POST /school/attendance/${att_id}/approve"
              payload: {}
              as: Instructor
              as_user_id: "${ins_id}"
            - call: "POST /school/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FinancialAidOfficer
            - call: "POST /school/disbursements"
              payload: { enrollment_id: "${enr_id}", payment_period: 1, period_hours: 400, period_weeks: 4, gross_amount_cents: 600000, origination_fee_cents: 0 }
              as: FinancialAidOfficer
              captures: { dis_id: $.data.id }
            - call: "GET /school/enrollments/${enr_id}"
              payload: {}
              as: FinancialAidOfficer
              captures: { enr_v: $.data.version }
            - call: "POST /school/disbursements/${dis_id}/post"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: FinancialAidOfficer
            - call: "POST /school/withdrawals"
              payload: { enrollment_id: "${enr_id}", withdrawal_type: "OFFICIAL", last_date_of_attendance_iso: "2026-05-01T00:00:00Z" }
              as: FinancialAidOfficer
              captures: { wd_id: $.data.id }
            - call: "GET /school/enrollments/${enr_id}"
              payload: {}
              as: FinancialAidOfficer
              captures: { enr_v2: $.data.version }
          trigger:
            - call: "POST /school/withdrawals/${wd_id}/finalize"
              payload: { expected_enrollment_version: "${enr_v2}" }
              as: FinancialAidOfficer
              captures: { wst: $.data.status }
          assert:
            - "Withdrawal.${wd_id}.status == FINALIZED"
            - "Enrollment.${enr_id}.status == WITHDRAWN"
            - "Disbursement.${dis_id}.status == RETURNED"
            - "Enrollment.${enr_id}.ledger_balance_cents == 1400000"

      - name: clinic_signoff_depth2_station_release
        grounds:
          - state_machines.ClinicTicket.OPEN_to_SIGNED_OFF
          - entities.Enrollment.fields.actual_hours
          - entities.Station.fields.status
        distinguishing_aspect: "Depth-2 chain from a different trigger: signing off a ClinicTicket -> credits clinic_hours into Enrollment.actual_hours -> the same sign-off releases the occupied Station OCCUPIED->AVAILABLE; the station release is caused by the ticket transition, not the original POST."
        test_recipe:
          setup:
            - "Enrollment past clinic phase (actual_hours 320 >= 300); a HAIR station made OCCUPIED by opening a clinic ticket; clock 2026-06-01."
          setup_api_calls:
            - call: "POST /school/programs"
              payload: { name: "Cosmetology 1500", total_clock_hours: 1500, tuition_cents: 1200000, kit_fee_cents: 150000, lab_fee_cents: 50000, clinic_phase_start_hour: 300 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /school/students"
              payload: { full_name: "Hal Hue", email: "hal@x.com", ssn_last4: "8888" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /school/instructors"
              payload: { full_name: "Ivy Teach", license_number: "INS-7", license_expires_on: "2027-01-01T00:00:00Z", active: true }
              as: Registrar
              captures: { ins_id: $.data.id }
            - call: "POST /school/stations"
              payload: { label: "Styling-7", station_type: "HAIR" }
              as: Registrar
