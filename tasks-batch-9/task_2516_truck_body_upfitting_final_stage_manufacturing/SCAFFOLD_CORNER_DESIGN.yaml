            - "WeightCertification.${wc_d}.rear_axle_load_lb == 4591 (2680 + 1911)"
            - "WeightCertification.${wc_d}.gvw_lb == 9600 (4820 + 2680 + 2100, independent of the mount position)"
            - "WeightCertification.${wc_d}.payload_capacity_lb == 9900 — the GVWR bucket (19500 - 9600) is the minimum; the rear bucket yields 10876 and the front bucket 28442"
            - "WeightCertification.${wc_d}.included_component_count == 1 (the body only)"
            - "WeightCertification.${wc_d}.basis == \"AS_DESIGNED\" and status == \"DRAFT\" and created_by_user_id == \"eng-1\""

      - name: pto_waterfall_grants_the_first_duty_priority_before_the_second
        claim_type: waterfall_allocation
        grounds:
          - calculations.pto_flow_waterfall
          - endpoints.POST_/upfit/upfit-orders/{upfit_order_id}/allocate-chassis
          - entities.EquipmentInstallation.fields.allocated_flow_gpm
        distinguishing_aspect: |
          The 18 gpm pool cannot serve 8 + 12 gpm, and the split must be 8 / 10, never 6 / 12 or
          9 / 9: the duty_priority 1 crane fills completely before the hoist sees a drop, and the
          hoist keeps the partial 10 gpm remainder rather than being zeroed. Both rows are planned
          before any unit is bound (pool 0, both DEFICIT), so the allocate call is what re-runs the
          waterfall — the insert-time capacity gate is deferred exactly as §1.4 priority 73 says.
        test_recipe:
          setup:
            - "A CUSTOMER_SPECIFIC service order with CRANE-6000 (8 gpm, duty_priority 1) and DUMP-HOIST-10T (12 gpm, duty_priority 2) both PLANNED while order.chassis_id is null."
            - "An inspected F550-DRW-84CA unit (18 gpm FULL PTO) is standing by."
