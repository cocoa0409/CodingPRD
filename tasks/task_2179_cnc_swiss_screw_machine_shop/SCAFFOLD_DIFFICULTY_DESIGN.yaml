scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: quote_price_standard_vs_historical_cycle_basis
    grounds:
    - calculations.quote_pricing
    - calculations.observed_cycle_time
    - entities.Part.fields.observed_avg_cycle_time_sec
    - entities.Quote.fields.quoted_unit_price_cents
    - state_machines.Quote.PRICED_to_PRICED
    distinguishing_aspect: |
      On the COST entity domain (Quote/Part), pricing the identical Quote row on costing_basis STANDARD_CYCLE yields quoted_unit_price_cents 289 while HISTORICAL_CYCLE yields 305, because the historical basis substitutes Part.observed_avg_cycle_time_sec 46.5 for Part.cycle_time_sec 42.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z.
      - Part P-4471 exists with cycle_time_sec 42 and observed_avg_cycle_time_sec 46.5, produced by exactly one ACCEPTED WorkOrder that reported qty_good 200 in actual_run_seconds 9300.
      - A second DRAFT Quote for the same part exists with lot_qty 2000 and requested_lights_out_hours 12.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ShopPlanner
        as_user_id: planner-1
      - call: POST /swiss-shop/operators
        payload:
          name: Rey Molina
          badge_code: BM-01
          certifications:
          - SWISS_SETUP
          - LIGHTS_OUT
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          op_mach: $.data.id
      - call: POST /swiss-shop/operators
        payload:
          name: Ida Chen
          badge_code: BI-01
          certifications:
          - CMM
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          op_insp: $.data.id
      - call: POST /swiss-shop/machines
        payload:
          asset_tag: SW-01
          max_bar_diameter_mm: 20.0
          lights_out_certified: true
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          mach: $.data.id
      - call: POST /swiss-shop/parts
        payload:
          part_number: P-4471
          alloy_code: 303SS
          bar_diameter_mm: 12.7
          cut_off_length_mm: 26.5
          cycle_time_sec: 42
          setup_hours: 3.5
          material_cost_cents_per_meter: 1850
          finished_mass_g: 18.3
          lights_out_eligible: true
          secondary_required: true
          secondary_minutes_per_piece: 0.4
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          part: $.data.id
      - call: POST /swiss-shop/gauges
        payload:
          gauge_code: MIC-207
          gauge_type: MICROMETER
          calibrated_at: '2026-08-15T00:00:00Z'
          calibration_due_at: '2027-02-15T00:00:00Z'
          grr_pct: 6.2
        as: QualityManager
        as_user_id: qm-1
        captures:
          gauge: $.data.id
      - call: POST /swiss-shop/characteristics
        payload:
          part_id: ${part}
          char_code: OD-A
          nominal: 6.35
          usl: 6.375
          lsl: 6.325
          sample_freq_pieces: 200
          required_gauge_type: MICROMETER
          cpk_min: 1.385
          subgroup_size: 5
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          charac: $.data.id
      - call: POST /swiss-shop/bar-stock-lots
        payload:
          heat_number: H-88231
          alloy_code: 303SS
          bar_diameter_mm: 12.7
          bar_length_mm: 3600
          bars_received: 20
          mass_kg_per_meter: 0.995
          feeder_slots: 1
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          lot: $.data.id
      - call: POST /swiss-shop/bar-stock-lots/${lot}/certify
        payload:
          certificate_number: CERT-1
        as: QualityManager
        as_user_id: qm-1
      - call: POST /swiss-shop/quotes
        payload:
          part_id: ${part}
          customer_code: ACME
          lot_qty: 200
          requested_lights_out_hours: 0
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          q1: $.data.id
      - call: POST /swiss-shop/quotes/${q1}/price
        payload:
          costing_basis: STANDARD_CYCLE
        as: ShopPlanner
        as_user_id: planner-1
      - call: POST /swiss-shop/quotes/${q1}/accept
        payload:
          customer_po_number: ACME-9911
          total_committed_qty: 200
          expires_on: '2027-06-30T00:00:00Z'
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          po: $.data.id
      - call: GET /swiss-shop/blanket-pos/${po}
        payload: {}
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          po_v: $.data.version
      - call: POST /swiss-shop/kanban-releases
        payload:
          blanket_po_id: ${po}
          qty: 200
          due_at: '2026-09-10T00:00:00Z'
          expected_blanket_po_version: ${po_v}
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          rel: $.data.id
      - call: GET /swiss-shop/machines/${mach}
        payload: {}
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          mach_v: $.data.version
      - call: POST /swiss-shop/work-orders
        payload:
          release_id: ${rel}
          machine_id: ${mach}
          bar_lot_id: ${lot}
          qty_ordered: 200
          scheduled_start_at: '2026-09-02T06:00:00Z'
          scheduled_end_at: '2026-09-02T14:00:00Z'
          expected_machine_version: ${mach_v}
          lights_out_hours: 4
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          wo: $.data.id
      - call: POST /swiss-shop/work-orders/${wo}/start
        payload: {}
        as: Machinist
        as_user_id: ${op_mach}
      - call: POST /swiss-shop/spc-samples
        payload:
          work_order_id: ${wo}
          characteristic_id: ${charac}
          gauge_id: ${gauge}
          piece_index: 200
          measurements:
          - 6.343
          - 6.35
          - 6.35
          - 6.35
          - 6.357
        as: Inspector
        as_user_id: ${op_insp}
      - call: POST /swiss-shop/work-orders/${wo}/complete-machining
        payload:
          qty_good: 200
          qty_scrap: 0
          actual_run_seconds: 9300
        as: Machinist
        as_user_id: ${op_mach}
      - call: POST /swiss-shop/work-orders/${wo}/disposition
        payload:
          decision: ACCEPT
          note: first article ok
        as: QualityManager
        as_user_id: qm-1
      - call: POST /swiss-shop/quotes
        payload:
          part_id: ${part}
          customer_code: ACME
          lot_qty: 2000
          requested_lights_out_hours: 12
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          q2: $.data.id
      trigger:
      - call: POST /swiss-shop/quotes/${q2}/price
        payload:
          costing_basis: STANDARD_CYCLE
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          std_unit: $.data.quoted_unit_price_cents
          std_lot: $.data.quoted_lot_cost_cents
      - call: POST /swiss-shop/quotes/${q2}/price
        payload:
          costing_basis: HISTORICAL_CYCLE
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          hist_unit: $.data.quoted_unit_price_cents
          hist_lot: $.data.quoted_lot_cost_cents
          hist_cyc: $.data.cycle_time_used_sec
      assert:
      - Part.${part}.observed_avg_cycle_time_sec == 46.5
      - Part.${part}.observed_accepted_qty == 200
      - ${std_unit} == 289
      - ${std_lot} == 451242
      - ${hist_unit} == 305
      - ${hist_lot} == 475467
      - ${hist_cyc} == 46.5
      - ${hist_unit} != ${std_unit}
      - Quote.${q2}.costing_basis == HISTORICAL_CYCLE
      - Quote.${q2}.status == PRICED
  - name: capability_cpk_short_term_vs_ppk_long_term
