    grounds: entities.Placement (actual_first_year_compensation_cents, fee_cents, fee_variant, fee_percent_bps,
      guarantee_window_days, snapshot_fee_schedule_id); calculations.placement_fee_computation variant
      PROVISIONAL
    distinguishing_aspect: actual_first_year_compensation_cents is the sum of the four supplied components
      (10000000) while fee_cents is priced from the requisition aggregate at 2000 bps, and the band snapshot
      is copied from the requisition rather than re-resolved.
    test_recipe:
