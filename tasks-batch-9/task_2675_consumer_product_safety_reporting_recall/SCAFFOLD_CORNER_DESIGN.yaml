              as: ComplianceOfficer
              captures: { report_due: $.data.report_due_at }
            - call: "POST /product-safety/section-reports"
              payload: { reportability_evaluation_id: "${ev_id}", corrective_action_type: "REPAIR", corrective_action_summary: "Free in-home thermostat replacement." }
              as: ComplianceOfficer
              captures: { sr_id: $.data.id }
