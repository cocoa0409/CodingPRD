  # ================================================================= RBAC
  - section: rbac
    instances:
      - name: content_producer_cannot_activate_production
        claim_type: role_denial
        grounds: ["roles[ProductionDirector]", "roles[ContentProducer]"]
        distinguishing_aspect: "POST /productions/{id}/activate as ContentProducer returns ERR_FORBIDDEN (403); ProductionDirector succeeds."
        test_recipe:
          setup: ["Production P in DRAFT."]
          setup_api_calls:
            - call: "POST /venue/productions"
              payload: { title: "RB", production_type: "ORIGINAL", base_price_cents: 5000, is_haptic_capable: false }
              as: ProductionDirector
              captures: { rb_p: $.data.id }
          trigger:
            - call: "POST /venue/productions/${rb_p}/activate"
              payload: {}
              as: ContentProducer
              captures: { err_id: $.data.error_id }
            - call: "POST /venue/productions/${rb_p}/activate"
              payload: {}
              as: ProductionDirector
              captures: { rb_status: $.data.status }
          assert:
            - "ContentProducer activate returns ERR_FORBIDDEN"
            - "ProductionDirector activate succeeds; Production.${rb_p}.status == ACTIVE"

      - name: guest_cannot_schedule_maintenance
        claim_type: role_denial
        grounds: ["roles[VenueOpsEngineer]", "roles[Guest]"]
        distinguishing_aspect: "POST /venue-systems/{id}/maintenance-windows as Guest returns ERR_FORBIDDEN."
        test_recipe:
          setup: ["VenueSystem V exists."]
          setup_api_calls:
            - call: "POST /venue-systems"
              payload: { name: "HAP-1", kind: "HAPTIC" }
              as: VenueOpsEngineer
              captures: { gv_id: $.data.id }
          trigger:
            - call: "POST /venue/maintenance-windows"
              payload: { venue_system_id: "${gv_id}", start_time: "2026-09-05T01:00:00Z", end_time: "2026-09-05T02:00:00Z", buffer_minutes: 15 }
              as: Guest
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN"

  # ================================================================= Cross-cutting layers
  - section: cross_cutting_layers
    instances:
      - name: campaign_activate_occ_stale_sponsor_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[campaign-activate-stale-sponsor]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Campaign activation with expected_sponsor_version one behind the sponsor's current version returns ERR_STALE_VERSION 412; matching version activates."
        test_recipe:
          setup: ["Sponsor S (version V observed); Campaign C in flight."]
          setup_api_calls:
            - call: "POST /venue/sponsors"
              payload: { name: "OCC", brand_tier: "STANDARD" }
              as: SponsorshipManager
              captures: { oc_sp: $.data.id, oc_v0: $.data.version }
            - call: "POST /venue/campaigns"
              payload: { sponsor_id: "${oc_sp}", start_time: "2026-08-31T00:00:00Z", end_time: "2026-09-30T00:00:00Z", exterior_slots: 1, spot_seconds: 30, contracted_impressions: 5000 }
              as: SponsorshipManager
              captures: { oc_c: $.data.id }
          trigger:
            - call: "POST /venue/campaigns/${oc_c}/activate"
              payload: { expected_sponsor_version: "${oc_v0} - 1" }
              as: SponsorshipManager
              captures: { err_id: $.data.error_id }
            - call: "POST /venue/campaigns/${oc_c}/activate"
              payload: { expected_sponsor_version: "${oc_v0}" }
              as: SponsorshipManager
              captures: { oc_status: $.data.status }
          assert:
            - "Stale-version activate returns ERR_STALE_VERSION"
            - "Matching-version activate succeeds; Campaign.${oc_c}.status == ACTIVE"

      - name: version_increments_on_mutation
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[show-confirm-stale-production]"]
        distinguishing_aspect: "Every mutation bumps Production.version by exactly 1: create (1) -> activate (2) -> deactivate (3)."
        test_recipe:
          setup: ["Production P created (version 1)."]
          setup_api_calls:
            - call: "POST /venue/productions"
              payload: { title: "VV", production_type: "ORIGINAL", base_price_cents: 5000, is_haptic_capable: false }
              as: ProductionDirector
              captures: { vv_id: $.data.id, vv_v1: $.data.version }
          trigger:
            - call: "POST /venue/productions/${vv_id}/activate"
              payload: {}
              as: ProductionDirector
              captures: { vv_v2: $.data.version }
            - call: "POST /venue/productions/${vv_id}/deactivate"
              payload: {}
              as: ProductionDirector
              captures: { vv_v3: $.data.version }
          assert:
            - "Production.${vv_id}.version after create == 1"
            - "Production.${vv_id}.version after activate == 2"
            - "Production.${vv_id}.version after deactivate == 3"
