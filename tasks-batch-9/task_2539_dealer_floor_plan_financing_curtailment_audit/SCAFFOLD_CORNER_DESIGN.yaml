              as_user_id: "u-co-1"
              captures: { c12_status: "$.data.status", c12_reason: "$.data.reason_code" }
          assert:
            - "HTTP status is 200, ${c12_status} == \"REJECTED\" and ${c12_reason} == \"TITLE_DEFECT\""
            - "InventoryUnit.${c12_u}.funding_status == \"REGISTERED\" and advance_amount_cents == 0"
            - "CreditLine.${c12_cl}.outstanding_principal_cents == 0, floored_unit_count == 0 and available_credit_cents == 500000000"
            - "FundingAdvance.${c12_a}.funded_at == null and funded_by_user_id == null"

      - name: audit_start_before_the_window_opens_returns_window_not_open
        claim_type: precondition_enforcement
        grounds:
          - state_machines.FloorPlanAudit.SCHEDULED_to_IN_PROGRESS
          - validations[priority=65]
          - errors.ERR_AUDIT_WINDOW_NOT_OPEN
        distinguishing_aspect: "An ANNOUNCED audit scheduled for 2026-08-15..2026-08-20 cannot be started while the clock reads 2026-08-01: the window precondition fires with 409 ERR_AUDIT_WINDOW_NOT_OPEN, the audit stays SCHEDULED and the dealer's audit_in_progress flag stays false."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "ACTIVE Dealer with an ACTIVE CreditLine and one ANNOUNCED FloorPlanAudit for 2026-08-15 .. 2026-08-20 (satisfies the 7-day notice)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "u-sys-1"
            - call: "POST /floorplan/dealers"
              payload: { legal_name: "Corner Window Motors LLC", franchise_type: "FRANCHISE_NEW_CAR", state_code: "MI" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c13_d: "$.data.id" }
            - call: "POST /floorplan/credit-lines"
              payload: { dealer_id: "${c13_d}", credit_limit_cents: 500000000, advance_rate_bps_new: 10000, advance_rate_bps_used: 9000, advance_rate_bps_demonstrator: 8500, max_unit_advance_cents_new: 20000000, max_unit_advance_cents_used: 10000000, max_unit_advance_cents_demonstrator: 10000000, class_sublimit_cents_used: 100000000, class_sublimit_cents_demonstrator: 50000000, curtailment_grace_days: 5 }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c13_cl: "$.data.id" }
            - call: "POST /floorplan/credit-lines/${c13_cl}/activate"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/audits"
              payload: { dealer_id: "${c13_d}", audit_type: "ANNOUNCED", window_start_date: "2026-08-15", window_end_date: "2026-08-20" }
              as: AuditManager
              as_user_id: "u-am-1"
              captures: { c13_au: "$.data.id", c13_au_status: "$.data.status" }
          trigger:
            - call: "POST /floorplan/audits/${c13_au}/start"
              payload: {}
              as: FieldAuditor
              as_user_id: "u-fa-1"
              captures: { c13_err: "$.data.error_id" }
          assert:
            - "${c13_au_status} == \"SCHEDULED\" at creation"
            - "HTTP status is 409 and ${c13_err} == \"ERR_AUDIT_WINDOW_NOT_OPEN\""
            - "FloorPlanAudit.${c13_au}.status is still SCHEDULED, started_at == null and version is still 1"
            - "Dealer.${c13_d}.audit_in_progress == false"
            - "after POST /_clock/set_current_utc to 2026-08-15T00:00:00Z the same start call returns 200 with status IN_PROGRESS"

      - name: audit_reconcile_side_effect_set_is_applied_in_full
        claim_type: side_effect_execution
        excluded_because:
          difficulty_instance: curtailment_run_cascades_four_hops_from_obligation_to_next_audit_due_at
          rationale: "Side-effect execution for the heaviest transition in the scaffold is already asserted field by field across four entities by that difficulty instance, including the counters, the risk re-run and the recomputed next_audit_due_at; a breadth-level repeat would assert a strict subset."

      - name: reconcile_on_a_scheduled_audit_returns_audit_not_in_progress
        claim_type: invalid_transitions
        grounds:
          - state_machines.FloorPlanAudit
          - validations[priority=64]
          - errors.ERR_AUDIT_NOT_IN_PROGRESS
        distinguishing_aspect: "reconcile is not a legal trigger from SCHEDULED, so an audit that was never started returns 409 ERR_AUDIT_NOT_IN_PROGRESS rather than reconciling zero observations."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "ACTIVE Dealer with an ACTIVE CreditLine and one UNANNOUNCED FloorPlanAudit for 2026-08-01 .. 2026-08-03 that is still SCHEDULED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "u-sys-1"
            - call: "POST /floorplan/dealers"
              payload: { legal_name: "Corner Invalid Transition Motors LLC", franchise_type: "FRANCHISE_NEW_CAR", state_code: "OH" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c14_d: "$.data.id" }
            - call: "POST /floorplan/credit-lines"
              payload: { dealer_id: "${c14_d}", credit_limit_cents: 500000000, advance_rate_bps_new: 10000, advance_rate_bps_used: 9000, advance_rate_bps_demonstrator: 8500, max_unit_advance_cents_new: 20000000, max_unit_advance_cents_used: 10000000, max_unit_advance_cents_demonstrator: 10000000, class_sublimit_cents_used: 100000000, class_sublimit_cents_demonstrator: 50000000, curtailment_grace_days: 5 }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c14_cl: "$.data.id" }
            - call: "POST /floorplan/credit-lines/${c14_cl}/activate"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/audits"
              payload: { dealer_id: "${c14_d}", audit_type: "UNANNOUNCED", window_start_date: "2026-08-01", window_end_date: "2026-08-03" }
              as: AuditManager
              as_user_id: "u-am-1"
              captures: { c14_au: "$.data.id" }
          trigger:
            - call: "POST /floorplan/audits/${c14_au}/reconcile"
              payload: { notes: "premature sign-off attempt" }
              as: AuditManager
              as_user_id: "u-am-1"
              captures: { c14_err: "$.data.error_id" }
          assert:
            - "HTTP status is 409 and ${c14_err} == \"ERR_AUDIT_NOT_IN_PROGRESS\""
            - "FloorPlanAudit.${c14_au}.status is still SCHEDULED with reconciled_at == null and reconciled_by_user_id == null"
            - "the same 409 is returned for POST /floorplan/audits/${c14_au}/abort, which is also illegal from SCHEDULED"
            - "no OutOfTrustIncident row exists: GET /floorplan/out-of-trust-incidents?audit_id=${c14_au} returns total_count 0"

