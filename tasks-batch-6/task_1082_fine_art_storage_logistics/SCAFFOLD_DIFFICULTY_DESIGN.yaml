# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: storage_fee_provisional_vs_final
        grounds:
          - calculations.storage_fee
          - entities.StoragePlacement.fields.provisional_fee_cents
          - entities.StoragePlacement.fields.final_fee_cents
          - state_machines.StoragePlacement.ACTIVE_to_RELEASED
        distinguishing_aspect: |
          Same placement, two variants on the StoragePlacement/billing domain: the provisional
          fee projects forward to scheduled_end_at (10 days -> 7500) while the final fee counts
          chronological days to released_at (5 days -> 3750); the two diverge.
        test_recipe:
          setup:
            - "clock at 2026-05-01T00:00:00Z; AMBIENT vault (500 cents/day), MEDIUM artwork (x1.5)"
            - "placement start 2026-05-01, scheduled_end 2026-05-11; released early at 2026-05-06"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Registrar
            - call: "POST /clients"
              payload: { name: "Meridian Collection", client_type: "INSTITUTION", billing_email: "ap@meridian.example" }
              as: Registrar
              captures: { client_id: $.data.id }
            - call: "POST /vaults"
              payload: { name: "Vault A", climate_class: "AMBIENT", capacity_slots: 5 }
              as: Registrar
              captures: { vault_id: $.data.id }
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "Study in Blue", artist: "R. Vance", size_class: "MEDIUM", fragility_class: "MEDIUM", climate_class: "AMBIENT" }
              as: Registrar
              captures: { art_id: $.data.id }
            - call: "POST /storage-placements"
              payload: { artwork_id: "${art_id}", vault_id: "${vault_id}", start_at: "2026-05-01T00:00:00Z", scheduled_end_at: "2026-05-11T00:00:00Z" }
              as: Registrar
              captures: { placement_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-06T00:00:00Z" }
              as: Registrar
            - call: "POST /storage-placements/${placement_id}/state"
              payload: { to_status: "RELEASED" }
              as: Registrar
          assert:
            - "StoragePlacement.${placement_id}.provisional_fee_cents == 7500"
            - "StoragePlacement.${placement_id}.final_fee_cents == 3750"
            - "StoragePlacement.${placement_id}.status == RELEASED"

      - name: appraisal_fair_market_vs_replacement
        grounds:
          - calculations.appraisal_value
          - entities.Appraisal.fields.appraised_value_cents
          - entities.Appraisal.fields.method
        distinguishing_aspect: |
          Same comparable base (1,000,000), two variants on the Appraisal/valuation domain:
          FAIR_MARKET yields 1,000,000 while REPLACEMENT yields round(1,000,000*1.25)+50,000 =
          1,300,000 — a different entity domain than the storage-billing dual variant.
        test_recipe:
          setup:
            - "one client owning two artworks A1 and A2"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Halcyon Trust", client_type: "INSTITUTION", billing_email: "ap@halcyon.example" }
              as: Registrar
              captures: { client_id: $.data.id }
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "Dawn", artist: "L. Okafor", size_class: "SMALL", fragility_class: "LOW", climate_class: "COOL" }
              as: Registrar
              captures: { a1_id: $.data.id, a1_v: $.data.version }
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "Dusk", artist: "L. Okafor", size_class: "SMALL", fragility_class: "LOW", climate_class: "COOL" }
              as: Registrar
              captures: { a2_id: $.data.id, a2_v: $.data.version }
            - call: "POST /appraisals"
              payload: { artwork_id: "${a1_id}", method: "FAIR_MARKET", comparable_base_cents: 1000000, appraiser_name: "M. Reyes", expected_artwork_version: "${a1_v}" }
              as: Registrar
              captures: { appr1_id: $.data.id }
          trigger:
            - call: "POST /appraisals"
              payload: { artwork_id: "${a2_id}", method: "REPLACEMENT", comparable_base_cents: 1000000, replacement_multiplier: 1.25, restoration_reserve_cents: 50000, appraiser_name: "M. Reyes", expected_artwork_version: "${a2_v}" }
              as: Registrar
              captures: { appr2_id: $.data.id }
          assert:
            - "Appraisal.${appr1_id}.appraised_value_cents == 1000000"
            - "Appraisal.${appr2_id}.appraised_value_cents == 1300000"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: insurance_premium_tiered_nonlinear
        grounds:
          - calculations.insurance_premium
          - entities.InsurancePolicy.fields.premium_cents
          - entities.Artwork.fields.fragility_class
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — tiered rate selection by
          insured_value band (150 bps), times coverage_mult (ALL_RISK=2.0), times fragility_mult
          (MEDIUM=1.25), times duration factor (365/365), floored at MIN_PREMIUM_CENTS; a single
          pinned evaluation order yields 48,750.
        test_recipe:
          setup:
            - "client; MEDIUM-fragility artwork; ALL_RISK policy, insured 1,300,000, 365-day term"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Aperture Gallery", client_type: "DEALER", billing_email: "ap@aperture.example" }
              as: Registrar
              captures: { client_id: $.data.id }
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "Cobalt Field", artist: "N. Adeyemi", size_class: "LARGE", fragility_class: "MEDIUM", climate_class: "AMBIENT" }
              as: Registrar
              captures: { art_id: $.data.id, art_v: $.data.version }
          trigger:
            - call: "POST /policies"
              payload: { artwork_id: "${art_id}", coverage_type: "ALL_RISK", insured_value_cents: 1300000, effective_start: "2026-05-01T00:00:00Z", effective_end: "2027-05-01T00:00:00Z", expected_artwork_version: "${art_v}" }
              as: Registrar
              captures: { policy_id: $.data.id }
          assert:
            - "InsurancePolicy.${policy_id}.premium_cents == 48750"

      - name: invoice_tax_rounding_order
        grounds:
          - calculations.invoice_total
          - entities.Invoice.fields.subtotal_cents
          - entities.Invoice.fields.tax_cents
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order — tax is computed once on the summed subtotal
          (round(10508*0.0875)=919), NOT per line item (657+263=920). The scaffold pins
          sum-then-tax, a different combinatorial axis than the tiered premium formula.
        test_recipe:
          setup:
            - "client with a DRAFT invoice built from two manual lines 7505 and 3003"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Northwind Foundation", client_type: "INSTITUTION", billing_email: "ap@northwind.example" }
              as: Registrar
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /invoices"
              payload: { client_id: "${client_id}", billing_period_start: "2026-05-01T00:00:00Z", billing_period_end: "2026-05-31T00:00:00Z", manual_line_items: [ { description: "Storage", amount_cents: 7505 }, { description: "Handling", amount_cents: 3003 } ] }
              as: BillingAdmin
              captures: { invoice_id: $.data.id }
          assert:
            - "Invoice.${invoice_id}.subtotal_cents == 10508"
            - "Invoice.${invoice_id}.tax_cents == 919"
            - "Invoice.${invoice_id}.total_cents == 11427"

  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: loan_revision_cycle
        grounds:
          - state_machines.LoanAgreement.SUBMITTED_to_DRAFT
          - state_machines.LoanAgreement.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Cyclic shape on LoanAgreement: SUBMITTED -> DRAFT (revise) -> SUBMITTED is legal;
          a linear pipeline would forbid the backward SUBMITTED->DRAFT edge.
        test_recipe:
          setup:
            - "client, artwork, and a DRAFT loan"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Ravel Estate", client_type: "INDIVIDUAL", billing_email: "ap@ravel.example" }
              as: Registrar
              captures: { client_id: $.data.id }
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "Nocturne", artist: "P. Sol", size_class: "SMALL", fragility_class: "LOW", climate_class: "AMBIENT" }
              as: Registrar
              captures: { art_id: $.data.id }
            - call: "POST /loans"
              payload: { artwork_id: "${art_id}", client_id: "${client_id}", borrower_name: "City Museum", exhibition_name: "Night Works", loan_start: "2026-06-01T00:00:00Z", loan_end: "2026-07-01T00:00:00Z", is_international: false, required_value_cents: 1000000 }
              as: Registrar
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: Registrar
              as_user_id: "reg-1"
            - call: "POST /loans/${loan_id}/state"
              payload: { to_status: "DRAFT" }
              as: Registrar
              as_user_id: "reg-1"
          trigger:
            - call: "POST /loans/${loan_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: Registrar
              as_user_id: "reg-1"
          assert:
            - "LoanAgreement.${loan_id}.status == SUBMITTED"

      - name: artwork_parallel_custody_condition
        grounds:
          - state_machines.Artwork.SOUND_to_MINOR_DAMAGE
          - entities.Artwork.fields.custody_status
          - entities.Artwork.fields.condition_status
          - state_machines.StoragePlacement.ACTIVE_to_RELEASED
        distinguishing_aspect: |
          Parallel dimensions on one Artwork row: filing a grade-C damage report moves
          condition_status SOUND->MINOR_DAMAGE while custody_status stays IN_STORAGE — the two
          axes evolve independently (different entity than the cyclic loan machine).
        test_recipe:
          setup:
            - "artwork placed ACTIVE in a vault (custody IN_STORAGE, condition SOUND)"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Solene Holdings", client_type: "INSTITUTION", billing_email: "ap@solene.example" }
              as: Registrar
              captures: { client_id: $.data.id }
            - call: "POST /vaults"
              payload: { name: "Vault B", climate_class: "AMBIENT", capacity_slots: 5 }
              as: Registrar
              captures: { vault_id: $.data.id }
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "Meridian", artist: "K. Bright", size_class: "MEDIUM", fragility_class: "MEDIUM", climate_class: "AMBIENT" }
              as: Registrar
              captures: { art_id: $.data.id }
            - call: "POST /storage-placements"
              payload: { artwork_id: "${art_id}", vault_id: "${vault_id}", start_at: "2026-05-01T00:00:00Z", scheduled_end_at: "2026-06-01T00:00:00Z" }
              as: Registrar
              captures: { placement_id: $.data.id }
          trigger:
            - call: "POST /condition-reports"
              payload: { artwork_id: "${art_id}", report_type: "PERIODIC", condition_grade: "C", damage_noted: true, notes: "surface scuff, lower left" }
              as: Registrar
              captures: { cr_id: $.data.id }
          assert:
            - "Artwork.${art_id}.condition_status == MINOR_DAMAGE"
            - "Artwork.${art_id}.custody_status == IN_STORAGE"

  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: loan_return_cascade_depth3
        grounds:
          - state_machines.LoanAgreement.ACTIVE_to_RETURNED
          - state_machines.Artwork.ON_LOAN_to_IN_STORAGE
          - state_machines.StoragePlacement.SUSPENDED_to_ACTIVE
          - calculations.vault_occupancy
          - state_machines.Carnet.ACTIVATED_to_DISCHARGED
        distinguishing_aspect: |
          Depth-3 chain from LoanAgreement RETURN: Loan->Artwork (ON_LOAN->IN_STORAGE) ->
          StoragePlacement (SUSPENDED->ACTIVE) -> Vault.occupied_slots (0->1); each hop caused
          by the previous, plus the loan's Carnet is discharged.
        test_recipe:
          setup:
            - "international loan taken all the way to ACTIVE: artwork ON_LOAN, its placement SUSPENDED, vault.occupied_slots 0, carnet ACTIVATED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Registrar
            - call: "POST /clients"
              payload: { name: "Verano Collection", client_type: "INSTITUTION", billing_email: "ap@verano.example" }
              as: Registrar
              captures: { client_id: $.data.id }
            - call: "POST /vaults"
              payload: { name: "Vault C", climate_class: "AMBIENT", capacity_slots: 2 }
              as: Registrar
              captures: { vault_id: $.data.id }
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "Sirocco", artist: "D. Marchetti", size_class: "MEDIUM", fragility_class: "MEDIUM", climate_class: "AMBIENT" }
              as: Registrar
              captures: { art_id: $.data.id, art_v1: $.data.version }
            - call: "POST /appraisals"
              payload: { artwork_id: "${art_id}", method: "FAIR_MARKET", comparable_base_cents: 1000000, appraiser_name: "T. Cole", expected_artwork_version: "${art_v1}" }
              as: Registrar
              captures: { appr_id: $.data.id }
            - call: "GET /artworks/${art_id}"
              payload: {}
              as: Registrar
              captures: { art_v2: $.data.version }
            - call: "POST /policies"
              payload: { artwork_id: "${art_id}", coverage_type: "ALL_RISK", insured_value_cents: 1000000, effective_start: "2026-05-01T00:00:00Z", effective_end: "2027-05-01T00:00:00Z", expected_artwork_version: "${art_v2}" }
              as: Registrar
              captures: { policy_id: $.data.id }
            - call: "POST /storage-placements"
              payload: { artwork_id: "${art_id}", vault_id: "${vault_id}", start_at: "2026-05-01T00:00:00Z", scheduled_end_at: "2026-06-01T00:00:00Z" }
              as: Registrar
              captures: { placement_id: $.data.id }
            - call: "POST /loans"
              payload: { artwork_id: "${art_id}", client_id: "${client_id}", borrower_name: "Biennale FR", exhibition_name: "Winds", loan_start: "2026-05-10T00:00:00Z", loan_end: "2026-06-10T00:00:00Z", is_international: true, required_value_cents: 1000000 }
              as: Registrar
              captures: { loan_id: $.data.id }
            - call: "POST /carnets"
              payload: { loan_id: "${loan_id}", carnet_number: "ATA-0001", countries: ["US", "FR"], validity_start: "2026-05-01T00:00:00Z", validity_end: "2026-12-01T00:00:00Z" }
              as: Coordinator
              captures: { carnet_id: $.data.id }
            - call: "POST /loans/${loan_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: Registrar
              as_user_id: "reg-1"
            - call: "POST /loans/${loan_id}/state"
              payload: { to_status: "APPROVED" }
              as: Approver
              as_user_id: "app-1"
            - call: "POST /loans/${loan_id}/state"
              payload: { to_status: "ACTIVE" }
              as: Coordinator
              as_user_id: "coord-1"
          trigger:
            - call: "POST /loans/${loan_id}/state"
              payload: { to_status: "RETURNED" }
              as: Coordinator
              as_user_id: "coord-1"
          assert:
            - "LoanAgreement.${loan_id}.status == RETURNED"
            - "Artwork.${art_id}.custody_status == IN_STORAGE"
            - "StoragePlacement.${placement_id}.status == ACTIVE"
            - "Vault.${vault_id}.occupied_slots == 1"
            - "Carnet.${carnet_id}.status == DISCHARGED"

      - name: condition_damage_cascade_depth3
        grounds:
          - state_machines.Artwork.SOUND_to_MAJOR_DAMAGE
          - state_machines.LoanAgreement.SUBMITTED_to_APPROVED
          - state_machines.Carnet.ISSUED_to_DISCHARGED
          - entities.ConditionReport.fields.condition_grade
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (ConditionReport creation): ConditionReport(F)
          -> Artwork (SOUND->MAJOR_DAMAGE) -> LoanAgreement (APPROVED->CANCELLED) -> Carnet
          (ISSUED->DISCHARGED); distinct origin from the loan-return cascade.
        test_recipe:
          setup:
            - "international loan at APPROVED with an ISSUED carnet; artwork SOUND and IN_STORAGE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Registrar
            - call: "POST /clients"
              payload: { name: "Isolde Arts", client_type: "INSTITUTION", billing_email: "ap@isolde.example" }
              as: Registrar
              captures: { client_id: $.data.id }
            - call: "POST /vaults"
              payload: { name: "Vault D", climate_class: "AMBIENT", capacity_slots: 2 }
              as: Registrar
              captures: { vault_id: $.data.id }
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "Tramontane", artist: "F. Rae", size_class: "MEDIUM", fragility_class: "MEDIUM", climate_class: "AMBIENT" }
              as: Registrar
              captures: { art_id: $.data.id, art_v1: $.data.version }
            - call: "POST /appraisals"
              payload: { artwork_id: "${art_id}", method: "FAIR_MARKET", comparable_base_cents: 1000000, appraiser_name: "T. Cole", expected_artwork_version: "${art_v1}" }
              as: Registrar
              captures: { appr_id: $.data.id }
            - call: "GET /artworks/${art_id}"
              payload: {}
              as: Registrar
              captures: { art_v2: $.data.version }
            - call: "POST /policies"
              payload: { artwork_id: "${art_id}", coverage_type: "ALL_RISK", insured_value_cents: 1000000, effective_start: "2026-05-01T00:00:00Z", effective_end: "2027-05-01T00:00:00Z", expected_artwork_version: "${art_v2}" }
              as: Registrar
              captures: { policy_id: $.data.id }
            - call: "POST /storage-placements"
              payload: { artwork_id: "${art_id}", vault_id: "${vault_id}", start_at: "2026-05-01T00:00:00Z", scheduled_end_at: "2026-06-01T00:00:00Z" }
              as: Registrar
              captures: { placement_id: $.data.id }
            - call: "POST /loans"
              payload: { artwork_id: "${art_id}", client_id: "${client_id}", borrower_name: "Biennale FR", exhibition_name: "Winds", loan_start: "2026-05-10T00:00:00Z", loan_end: "2026-06-10T00:00:00Z", is_international: true, required_value_cents: 1000000 }
              as: Registrar
              captures: { loan_id: $.data.id }
            - call: "POST /carnets"
              payload: { loan_id: "${loan_id}", carnet_number: "ATA-0002", countries: ["US", "FR"], validity_start: "2026-05-01T00:00:00Z", validity_end: "2026-12-01T00:00:00Z" }
              as: Coordinator
              captures: { carnet_id: $.data.id }
            - call: "POST /loans/${loan_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: Registrar
              as_user_id: "reg-1"
            - call: "POST /loans/${loan_id}/state"
              payload: { to_status: "APPROVED" }
              as: Approver
              as_user_id: "app-1"
          trigger:
            - call: "POST /condition-reports"
              payload: { artwork_id: "${art_id}", report_type: "POST_TRANSIT", condition_grade: "F", damage_noted: true, notes: "structural crack after handling" }
              as: Registrar
              captures: { cr_id: $.data.id }
          assert:
            - "Artwork.${art_id}.condition_status == MAJOR_DAMAGE"
            - "LoanAgreement.${loan_id}.status == CANCELLED"
            - "Carnet.${carnet_id}.status == DISCHARGED"

  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: loan_approve_referential_beats_fiscal
        grounds:
          - validations[priority=11]
          - validations[priority=21]
          - state_machines.LoanAgreement.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Dual failure at loan APPROVE: business_referential (ERR_ARTWORK_NOT_AVAILABLE, artwork
          IN_INTAKE) at priority 11 outranks business_fiscal (ERR_INSUFFICIENT_COVERAGE, insured
          500,000 < required 1,000,000) at priority 21; the referential error is returned.
        test_recipe:
          setup:
            - "artwork never placed (custody IN_INTAKE); ACTIVE policy insured 500,000; loan required 1,000,000; loan SUBMITTED"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Calder House", client_type: "DEALER", billing_email: "ap@calder.example" }
              as: Registrar
              captures: { client_id: $.data.id }
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "Mobile No. 4", artist: "A. Calder", size_class: "LARGE", fragility_class: "HIGH", climate_class: "AMBIENT" }
              as: Registrar
              captures: { art_id: $.data.id, art_v1: $.data.version }
            - call: "POST /appraisals"
              payload: { artwork_id: "${art_id}", method: "FAIR_MARKET", comparable_base_cents: 500000, appraiser_name: "T. Cole", expected_artwork_version: "${art_v1}" }
              as: Registrar
              captures: { appr_id: $.data.id }
            - call: "GET /artworks/${art_id}"
              payload: {}
              as: Registrar
              captures: { art_v2: $.data.version }
            - call: "POST /policies"
              payload: { artwork_id: "${art_id}", coverage_type: "STORAGE_ONLY", insured_value_cents: 500000, effective_start: "2026-05-01T00:00:00Z", effective_end: "2027-05-01T00:00:00Z", expected_artwork_version: "${art_v2}" }
              as: Registrar
              captures: { policy_id: $.data.id }
            - call: "POST /loans"
              payload: { artwork_id: "${art_id}", client_id: "${client_id}", borrower_name: "City Museum", exhibition_name: "Kinetics", loan_start: "2026-06-01T00:00:00Z", loan_end: "2026-07-01T00:00:00Z", is_international: false, required_value_cents: 1000000 }
              as: Registrar
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: Registrar
              as_user_id: "reg-1"
          trigger:
            - call: "POST /loans/${loan_id}/state"
              payload: { to_status: "APPROVED" }
              as: Approver
              as_user_id: "app-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ARTWORK_NOT_AVAILABLE"
            - "response.http_status == 409"

      - name: viewing_confirm_safety_beats_temporal
        grounds:
          - validations[priority=10]
          - validations[priority=18]
          - state_machines.ViewingBooking.REQUESTED_to_CONFIRMED
        distinguishing_aspect: |
          Dual failure at viewing CONFIRM: business_safety (ERR_ARTWORK_CONDITION_UNSAFE, artwork
          MAJOR_DAMAGE) at priority 10 outranks business_temporal (ERR_ROOM_UNAVAILABLE, overlap
          with a CONFIRMED booking) at priority 18 — a different category pair than the loan case.
        test_recipe:
          setup:
            - "room OPERATIONAL; A1 SOUND booked+CONFIRMED 14:00-15:00; A2 driven to MAJOR_DAMAGE; A2 booking REQUESTED 14:30-15:30 (overlaps A1)"
