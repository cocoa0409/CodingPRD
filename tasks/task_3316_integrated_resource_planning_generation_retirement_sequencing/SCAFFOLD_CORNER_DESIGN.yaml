              payload: { portfolio_name: "PF-RB4" }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/open-comment"
              payload: {}
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/comments"
              payload: { commenter_name: "Pub", commenter_email: "pub@example.org", body: "A comment." }
              as: PublicCommenter
              captures: { com_id: $.data.id }
          trigger:
            - call: "POST /plans/${plan_id}/comments/${com_id}/acknowledge"
              payload: {}
              as: PublicCommenter
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN (403); comment remains RECEIVED"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: approval_of_same_cycle_supersedes_prior_plan
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ResourcePlan.APPROVED_to_SUPERSEDED
          - complexity_profile.complexity_layers
        distinguishing_aspect: "Statutory cycle uniqueness: approving plan B (cycle_year 2026) auto-supersedes the already-APPROVED plan A of the same cycle_year (version bump, status SUPERSEDED); a cycle_year-2027 approval leaves A untouched."
        test_recipe:
          setup: ["Clock 2026-08-01. Plan A (cycle 2026) APPROVED; plan B (cycle 2026) UNDER_REVIEW with reliability met; plan C (cycle 2027) UNDER_REVIEW with reliability met. All three built with the same minimal recipe."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
