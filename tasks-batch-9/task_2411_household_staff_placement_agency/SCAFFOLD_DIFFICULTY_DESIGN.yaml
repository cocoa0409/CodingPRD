      - GET /role-requisitions/${req_id} after the trigger reads status == SOURCING with active_trial_count == 0
      - both the candidate and the requisition have a strictly higher version than ${cand_v_before} and ${req_v_before}
        - the compensation is a forward write, not a rollback
      - the cancelled trial still counts toward CANDIDATE_WEEKLY_TRIAL_CAP only if its status were in {SCHEDULED,
        IN_PROGRESS, PASSED, FAILED}; because it is CANCELLED a fresh booking in the same ISO week is accepted
