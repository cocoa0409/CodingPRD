            - "overlapping window [2026-09-14, 2026-09-20) rejected: error_id == ERR_UNIT_RESERVED_CONFLICT"
            - "EquipmentUnit.${unit_id}.status remains RESERVED"

      - name: technician_buffered_overlap
        grounds:
          - validations[priority=6]
          - errors[ERR_TECHNICIAN_SCHEDULE_CONFLICT]
          - entities.ServiceVisit.fields.assigned_technician_id
