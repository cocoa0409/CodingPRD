            - "Faculty COMPLIANT, contract ACTIVE gross 9,000,000 on a 3.0-hour section"
            - "P1 [2026-08-24, 2026-09-20] CLOSED (ACCRUAL 2290909 posted); P2 [2026-09-21, 2026-10-18] OPEN"
