# =============================================================================
# §1.9 Scaffold Corner Design — Food Manager Certification & Exam Proctoring
# =============================================================================
# Breadth probe. Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md; no categories are invented here.
#
# Shared baseline referenced by most recipes (created explicitly in each chain):
#   Jurisdiction TX-TRAVIS   accepted_accreditation_bodies ["ANAB_CFP"],
#                            accepted_languages ["EN","ES"],
#                            accepts_remote_proctoring true,
#                            requires_local_registration true,
#                            posting_deadline_days 30, recert_cycle_months 60,
#                            exam_fee_surcharge_pct 0.045
#   ExamForm FM-EN-01        EN / ANAB_CFP / 80 scored / 10 pretest /
#                            cut 70 / base_minutes 120 / translated_extra 30
#   Pricing literals         EXAM_ONLY base 3600: q1 3762, q2 7524, q3 11286,
#                            q4 15048;  COURSE_PLUS_EXAM base 8900: q1 9301
#   Logical clock            defaults to 2026-08-01T00:00:00Z; every sitting is
#                            booked for 2026-09-10 so the 1440-minute lead time
#                            holds at creation time.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: jurisdiction_creation_returns_declared_config_in_object_envelope
        claim_type: creation
        grounds:
          - endpoints[POST /jurisdictions]
          - entities.Jurisdiction
          - response_envelope.success
        distinguishing_aspect: |
          Every §1.1 input field supplied explicitly comes back on the 201 body unchanged, wrapped in
          the declared success envelope (meta.api_request_id, response_type "object", data). This is the
          positive control for the whole Jurisdiction surface: nothing is silently coerced, and the four
          common fields are added on top of the ten declared inputs.
        test_recipe:
          setup:
            - "Empty database; logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /jurisdictions"
              payload: { name: "Travis County Health TX", jurisdiction_code: "TX-TRAVIS", accepted_accreditation_bodies: ["ANAB_CFP"], accepted_languages: ["EN", "ES"], accepts_remote_proctoring: true, min_passing_score_override: null, requires_local_registration: true, posting_deadline_days: 30, recert_cycle_months: 60, exam_fee_surcharge_pct: 0.045 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id, jur_version: $.data.version }
          assert:
            - "HTTP 201 with response_type == \"object\" and meta.api_request_id present"
            - "data.jurisdiction_code == \"TX-TRAVIS\", data.accepted_accreditation_bodies == [\"ANAB_CFP\"], data.accepted_languages == [\"EN\", \"ES\"]"
            - "data.posting_deadline_days == 30, data.recert_cycle_months == 60, data.exam_fee_surcharge_pct == 0.045, data.min_passing_score_override == null"
            - "data.id is a bare UUID with no type prefix, data.version == 1, and created_at == updated_at"
      - name: get_training_provider_returns_stored_ledger_triple
        claim_type: retrieval
        grounds:
          - endpoints[GET /training-providers/{id}]
          - entities.TrainingProvider
          - calculations.provider_ledger_balance
        distinguishing_aspect: |
          A read-back after two ledger postings returns the stored values rather than recomputing from
          the request: lifetime_credited_cents 500000, lifetime_charged_cents 3762 and the derived
          credit_balance_cents 496238 are all visible on GET, and the read does not bump version.
        test_recipe:
          setup:
            - "Jurisdiction TX-TRAVIS, one provider credited 500000, one EN form, and one 1-unit EXAM_ONLY batch (3762) already purchased."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Travis County Health TX", jurisdiction_code: "TX-TRAVIS", accepted_accreditation_bodies: ["ANAB_CFP"], accepted_languages: ["EN", "ES"], exam_fee_surcharge_pct: 0.045 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /training-providers"
              payload: { legal_name: "Lone Star Food Safety", jurisdiction_id: "${jur_id}", contact_email: "ops@lonestar.test" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /training-providers/${prov_id}/credit-adjustments"
              payload: { amount_cents: 500000, memo: "prepay-2026" }
              as: PlatformAdmin
            - call: "POST /exam-forms"
              payload: { form_code: "FM-EN-01", version_label: "2026.1", language: "EN", accreditation_body: "ANAB_CFP", scored_item_count: 80, national_cut_score: 70, base_minutes: 120, pretest_item_count: 10, translated_extra_minutes: 30 }
              as: PlatformAdmin
              captures: { form_id: $.data.id }
            - call: "POST /access-code-batches"
              payload: { training_provider_id: "${prov_id}", exam_form_id: "${form_id}", line_items: [{ bundle_type: "EXAM_ONLY", quantity: 1 }], expires_at: "2027-06-30T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { batch_id: $.data.id }
          trigger:
            - call: "GET /training-providers/${prov_id}"
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { bal: $.data.credit_balance_cents, credited: $.data.lifetime_credited_cents, charged: $.data.lifetime_charged_cents, v: $.data.version }
          assert:
            - "HTTP 200 with data.lifetime_credited_cents == 500000, data.lifetime_charged_cents == 3762, data.credit_balance_cents == 496238"
            - "data.legal_name == \"Lone Star Food Safety\" and data.jurisdiction_id == ${jur_id}"
            - "the GET does not mutate: a second identical GET returns the same version value"
      - name: list_candidates_pagination_reports_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /candidates]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three candidates exist; limit 2 / offset 0 returns two rows with total_count 3 and
          has_more true, while limit 2 / offset 2 returns the remaining one row with has_more false.
          total_count reports the filtered population, not the page size, and the array envelope is
          response_type "array".
        test_recipe:
          setup:
            - "Jurisdiction TX-TRAVIS, one provider, three candidates enrolled under it."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Travis County Health TX", jurisdiction_code: "TX-TRAVIS", accepted_accreditation_bodies: ["ANAB_CFP"], accepted_languages: ["EN", "ES"] }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /training-providers"
              payload: { legal_name: "Lone Star Food Safety", jurisdiction_id: "${jur_id}", contact_email: "ops@lonestar.test" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /candidates"
              payload: { full_name: "Ana Ruiz", email: "ana@x.test", preferred_language: "EN", training_provider_id: "${prov_id}", jurisdiction_id: "${jur_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cand_a: $.data.id }
            - call: "POST /candidates"
              payload: { full_name: "Beto Salas", email: "beto@x.test", preferred_language: "EN", training_provider_id: "${prov_id}", jurisdiction_id: "${jur_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cand_b: $.data.id }
            - call: "POST /candidates"
              payload: { full_name: "Cira Moya", email: "cira@x.test", preferred_language: "ES", training_provider_id: "${prov_id}", jurisdiction_id: "${jur_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cand_c: $.data.id }
          trigger:
            - call: "GET /candidates?training_provider_id=${prov_id}&limit=2&offset=0"
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { first_row_id: "$.data[0].id" }
            - call: "GET /candidates?training_provider_id=${prov_id}&limit=2&offset=2"
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { third_row_id: "$.data[0].id" }
          assert:
            - "first page: HTTP 200, response_type == \"array\", len(data) == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second page: len(data) == 1, total_count == 3, has_more == false, offset == 2"
            - "the two pages are disjoint and together cover all three candidate ids exactly once"
      - name: get_exam_session_with_unknown_id_returns_exam_session_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /exam-sessions/{id}]
          - errors.ERR_EXAM_SESSION_NOT_FOUND
          - validations[priority=6]
        distinguishing_aspect: |
          A well-formed UUID that no ExamSession row carries produces the entity-specific 404
          ERR_EXAM_SESSION_NOT_FOUND, not a generic ERR_INVALID_REQUEST — path ids are resolved after
          the request body is parsed and before any business rule runs.
        test_recipe:
          setup:
            - "Empty database (no ExamSession has ever been created)."
          setup_api_calls: []
          trigger:
            - call: "GET /exam-sessions/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_EXAM_SESSION_NOT_FOUND and a non-empty message"
            - "response_type == \"error\" and data carries only error_id and message"
      - name: create_candidate_with_missing_required_field_is_rejected
        claim_type: required_fields
        grounds:
          - endpoints[POST /candidates]
          - errors.ERR_INVALID_REQUEST
          - validations[priority=4]
        distinguishing_aspect: |
          preferred_language is `source: input` with no default, so omitting it is a request error and
          not a silent fallback to the jurisdiction's first accepted language. The rejection happens
          before FK resolution — the (also present) valid provider id is irrelevant, and no Candidate row
          is created.
        test_recipe:
          setup:
            - "Jurisdiction TX-TRAVIS and one provider exist."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Travis County Health TX", jurisdiction_code: "TX-TRAVIS", accepted_accreditation_bodies: ["ANAB_CFP"], accepted_languages: ["EN", "ES"] }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /training-providers"
              payload: { legal_name: "Lone Star Food Safety", jurisdiction_id: "${jur_id}", contact_email: "ops@lonestar.test" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
          trigger:
            - call: "POST /candidates"
              payload: { full_name: "Ana Ruiz", email: "ana@x.test", training_provider_id: "${prov_id}", jurisdiction_id: "${jur_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id == ERR_INVALID_REQUEST"
            - "GET /candidates?training_provider_id=${prov_id} returns total_count 0 — nothing was persisted"
      - name: jurisdiction_optional_config_defaults_applied_when_omitted
        claim_type: defaults
        grounds:
          - entities.Jurisdiction.fields.accepts_remote_proctoring
          - entities.Jurisdiction.fields.posting_deadline_days
          - entities.Jurisdiction.fields.recert_cycle_months
          - entities.Jurisdiction.fields.exam_fee_surcharge_pct
        distinguishing_aspect: |
          Only the four mandatory fields are supplied. The response must show the §1.1 declared defaults
          — accepts_remote_proctoring true, requires_local_registration true, posting_deadline_days 30,
          recert_cycle_months 60, exam_fee_surcharge_pct 0.0, min_passing_score_override null — and the
          0.0 surcharge must then make a 1-unit EXAM_ONLY batch cost exactly the 3600-cent base with no
          rounding artefact.
        test_recipe:
          setup:
            - "Empty database; the batch purchase in the trigger proves the defaulted 0.0 surcharge is really in effect."
          setup_api_calls: []
          trigger:
            - call: "POST /jurisdictions"
              payload: { name: "Bare County Health", jurisdiction_code: "BARE-01", accepted_accreditation_bodies: ["ANAB_CFP"], accepted_languages: ["EN"] }
              as: PlatformAdmin
              captures: { jur_id: $.data.id, remote_default: $.data.accepts_remote_proctoring, pct_default: $.data.exam_fee_surcharge_pct }
            - call: "POST /training-providers"
              payload: { legal_name: "Bare Provider", jurisdiction_id: "${jur_id}", contact_email: "ops@bare.test" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /training-providers/${prov_id}/credit-adjustments"
              payload: { amount_cents: 10000, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /exam-forms"
              payload: { form_code: "FM-EN-01", version_label: "2026.1", language: "EN", accreditation_body: "ANAB_CFP", scored_item_count: 80, national_cut_score: 70, base_minutes: 120 }
              as: PlatformAdmin
              captures: { form_id: $.data.id }
            - call: "POST /access-code-batches"
              payload: { training_provider_id: "${prov_id}", exam_form_id: "${form_id}", line_items: [{ bundle_type: "EXAM_ONLY", quantity: 1 }], expires_at: "2027-06-30T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { batch_total: $.data.total_price_cents }
          assert:
            - "Jurisdiction: accepts_remote_proctoring == true, requires_local_registration == true, posting_deadline_days == 30, recert_cycle_months == 60, exam_fee_surcharge_pct == 0.0, min_passing_score_override == null"
            - "ExamForm defaults: pretest_item_count == 0, translated_extra_minutes == 0, status == ACTIVE"
            - "the defaulted 0.0 surcharge is load-bearing: AccessCodeBatch.total_price_cents == 3600 (not 3762) and credit_balance_cents == 6400"
      - name: batch_counters_and_price_are_computed_not_supplied
        claim_type: computed_fields
        grounds:
          - entities.AccessCodeBatch.fields.quantity_purchased
          - entities.AccessCodeBatch.fields.total_price_cents
          - entities.AccessCodeBatch.fields.available_count
          - calculations.batch_purchase_price
        distinguishing_aspect: |
          The request supplies only line_items and expires_at; quantity_purchased 3, total_price_cents
          11286 (10800 subtotal + 486 surcharge), available_count 3 and the three zero counters are all
          derived server-side, and the three void_* fields stay null until a void actually happens.
        test_recipe:
          setup:
            - "Jurisdiction TX-TRAVIS (surcharge 0.045), provider credited 500000, EN form."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Travis County Health TX", jurisdiction_code: "TX-TRAVIS", accepted_accreditation_bodies: ["ANAB_CFP"], accepted_languages: ["EN", "ES"], exam_fee_surcharge_pct: 0.045 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /training-providers"
              payload: { legal_name: "Lone Star Food Safety", jurisdiction_id: "${jur_id}", contact_email: "ops@lonestar.test" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /training-providers/${prov_id}/credit-adjustments"
              payload: { amount_cents: 500000, memo: "prepay-2026" }
              as: PlatformAdmin
            - call: "POST /exam-forms"
              payload: { form_code: "FM-EN-01", version_label: "2026.1", language: "EN", accreditation_body: "ANAB_CFP", scored_item_count: 80, national_cut_score: 70, base_minutes: 120, pretest_item_count: 10, translated_extra_minutes: 30 }
              as: PlatformAdmin
              captures: { form_id: $.data.id }
          trigger:
            - call: "POST /access-code-batches"
              payload: { training_provider_id: "${prov_id}", exam_form_id: "${form_id}", line_items: [{ bundle_type: "EXAM_ONLY", quantity: 3 }], expires_at: "2027-06-30T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { batch_id: $.data.id, qty: $.data.quantity_purchased, total: $.data.total_price_cents, avail: $.data.available_count }
          assert:
            - "HTTP 201 with quantity_purchased == 3 and total_price_cents == 11286 (round_half_up(3600*3*1.00) = 10800 plus round_half_up(10800*0.045) = 486)"
            - "available_count == 3, assigned_count == 0, consumed_count == 0, voided_count == 0, status == ACTIVE"
            - "void_gross_credit_cents, void_restock_fee_cents and void_net_credit_cents are all null before any void"
            - "the ledger moved by exactly the computed total: TrainingProvider.${prov_id}.credit_balance_cents == 488714"
            - "GET /access-codes?batch_id=${batch_id} returns total_count 3 child codes, every one with status AVAILABLE and candidate_id null"
      - name: proctor_identity_status_and_timestamps_are_system_minted
        claim_type: system_fields
        grounds:
          - entities.Proctor.fields.registration_status
          - entities.Proctor.fields.suspended_reason
          - entities.AccessCode.fields.code
          - state_machines.Proctor.initial_state
        distinguishing_aspect: |
          POST /proctors cannot open a proctor in REGISTERED: registration_status is `source: system` and
          starts at PENDING with suspended_reason null and every computed counter at its zero value. The
          same holds for AccessCode.code, which is server-minted and unique — the assignment request has
          no field through which a code string could be supplied.
        test_recipe:
          setup:
            - "Jurisdiction TX-TRAVIS, provider credited 500000, EN form, one candidate, and a 2-unit EXAM_ONLY batch (7524)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Travis County Health TX", jurisdiction_code: "TX-TRAVIS", accepted_accreditation_bodies: ["ANAB_CFP"], accepted_languages: ["EN", "ES"], exam_fee_surcharge_pct: 0.045 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /training-providers"
              payload: { legal_name: "Lone Star Food Safety", jurisdiction_id: "${jur_id}", contact_email: "ops@lonestar.test" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /training-providers/${prov_id}/credit-adjustments"
              payload: { amount_cents: 500000, memo: "prepay-2026" }
              as: PlatformAdmin
            - call: "POST /exam-forms"
              payload: { form_code: "FM-EN-01", version_label: "2026.1", language: "EN", accreditation_body: "ANAB_CFP", scored_item_count: 80, national_cut_score: 70, base_minutes: 120, pretest_item_count: 10, translated_extra_minutes: 30 }
              as: PlatformAdmin
              captures: { form_id: $.data.id }
            - call: "POST /candidates"
              payload: { full_name: "Ana Ruiz", email: "ana@x.test", preferred_language: "EN", training_provider_id: "${prov_id}", jurisdiction_id: "${jur_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cand_id: $.data.id }
            - call: "POST /access-code-batches"
              payload: { training_provider_id: "${prov_id}", exam_form_id: "${form_id}", line_items: [{ bundle_type: "EXAM_ONLY", quantity: 2 }], expires_at: "2027-06-30T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { batch_id: $.data.id, bv1: $.data.version }
          trigger:
            - call: "POST /proctors"
              payload: { full_name: "Ivan Cole", email: "ivan@x.test", training_provider_id: "${prov_id}", roles_held: ["PROCTOR"], languages_certified: ["EN"], remote_certified: false }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { proc_id: $.data.id, reg: $.data.registration_status, risk: $.data.risk_score }
            - call: "POST /access-code-batches/${batch_id}/assignments"
              payload: { candidate_id: "${cand_id}", bundle_type: "EXAM_ONLY", expected_batch_version: "${bv1}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { code_id: $.data.id, code_str: $.data.code, assigned_at: $.data.assigned_at }
          assert:
            - "the new Proctor has registration_status == PENDING, suspended_reason == null, proctored_session_count == 0, substantiated_incident_weight_total == 0, risk_score == 0.0, risk_variant_applied == ROLLING_WINDOW, reserved_minutes == 0"
            - "id is a bare UUID with no prefix, version == 1, created_at == updated_at"
            - "the AccessCode carries a server-minted non-empty code string that is unique across AccessCode, bundle_type == EXAM_ONLY copied from the batch line, and assigned_at == \"2026-08-01T00:00:00Z\" (the logical clock, not a client value)"
            - "AccessCode.status == ASSIGNED and AccessCode.assignment_release_count == 0"
      - name: out_of_range_numbers_and_unknown_enum_values_are_rejected
        claim_type: type_constraints
        grounds:
          - entities.AccommodationRequest.fields.requested_multiplier
          - entities.ExamForm.fields.scored_item_count
          - entities.Jurisdiction.fields.accepted_languages
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Three separate §1.1 constraint families are probed with one setup: a numeric range
          (requested_multiplier 2.5 outside 1.0..2.0), a second numeric range (scored_item_count 5 below
          the 10..200 floor) and an enum membership (language "FR" is not in {EN, ES, ZH, VI}). All three
          are ERR_INVALID_REQUEST — type constraints are request-level, never business errors — and none
          of the three persists a row.
        test_recipe:
          setup:
            - "Jurisdiction TX-TRAVIS, one provider, one candidate."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Travis County Health TX", jurisdiction_code: "TX-TRAVIS", accepted_accreditation_bodies: ["ANAB_CFP"], accepted_languages: ["EN", "ES"] }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /training-providers"
              payload: { legal_name: "Lone Star Food Safety", jurisdiction_id: "${jur_id}", contact_email: "ops@lonestar.test" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /candidates"
              payload: { full_name: "Ana Ruiz", email: "ana@x.test", preferred_language: "EN", training_provider_id: "${prov_id}", jurisdiction_id: "${jur_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cand_id: $.data.id }
          trigger:
            - call: "POST /accommodation-requests"
              payload: { candidate_id: "${cand_id}", accommodation_type: "EXTRA_TIME", requested_multiplier: 2.5, documentation_ref: "DOC-1" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { err_mult: $.data.error_id }
            - call: "POST /exam-forms"
              payload: { form_code: "FM-TINY", version_label: "2026.1", language: "EN", accreditation_body: "ANAB_CFP", scored_item_count: 5, national_cut_score: 70, base_minutes: 120 }
              as: PlatformAdmin
              captures: { err_items: $.data.error_id }
            - call: "POST /exam-forms"
              payload: { form_code: "FM-FR-01", version_label: "2026.1", language: "FR", accreditation_body: "ANAB_CFP", scored_item_count: 80, national_cut_score: 70, base_minutes: 120 }
              as: PlatformAdmin
              captures: { err_lang: $.data.error_id }
          assert:
            - "requested_multiplier 2.5 → HTTP 422 error_id == ERR_INVALID_REQUEST (allowed range 1.0..2.0)"
            - "scored_item_count 5 → HTTP 422 error_id == ERR_INVALID_REQUEST (allowed range 10..200)"
            - "language \"FR\" → HTTP 422 error_id == ERR_INVALID_REQUEST (enum is {EN, ES, ZH, VI})"
            - "GET /accommodation-requests?candidate_id=${cand_id} returns total_count 0 and GET /exam-forms returns total_count 0"
      - name: candidate_body_foreign_keys_are_validated_left_to_right_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=7]
          - errors.ERR_TRAINING_PROVIDER_NOT_FOUND
          - errors.ERR_JURISDICTION_NOT_FOUND
          - endpoints[POST /candidates]
        distinguishing_aspect: |
          §1.4 priority 7 pins body-FK resolution to the order the fields appear in the endpoint's
          `input:` list, so a request in which BOTH training_provider_id and jurisdiction_id are unknown
          must return ERR_TRAINING_PROVIDER_NOT_FOUND (the earlier field), never the jurisdiction error;
          swapping only the second id to a valid one still returns the provider error. An implementation
          that resolves FKs in an arbitrary order fails this even though both errors "exist".
        test_recipe:
          setup:
            - "Jurisdiction TX-TRAVIS exists so the second call can present exactly one unknown FK."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Travis County Health TX", jurisdiction_code: "TX-TRAVIS", accepted_accreditation_bodies: ["ANAB_CFP"], accepted_languages: ["EN", "ES"] }
              as: PlatformAdmin
