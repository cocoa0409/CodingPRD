        distinguishing_aspect: "The Seller role is entity-backed, so authorisation is a per-row ownership test rather than a role test: the SAME withdraw request with X-Role: Seller succeeds for the owning seller and is 403 for a second, equally valid ACTIVE seller -- and the 403 outranks the fact that the listing is perfectly withdrawable."
