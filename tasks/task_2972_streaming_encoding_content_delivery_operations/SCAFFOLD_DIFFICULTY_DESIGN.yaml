      - name: ladder_lock_supersede_chain
        grounds:
          - state_machines.EncodingLadder.VALIDATED_to_LOCKED
          - state_machines.EncodingLadder.LOCKED_to_SUPERSEDED
          - state_machines.DrmPackage.PACKAGED_to_STALE
          - state_machines.Title.packaging_state.PACKAGED_to_STALE
          - state_machines.Title.availability_state.PUBLISHED_to_TAKEN_DOWN
          - state_machines.AvailabilityWindow.ACTIVE_to_CLOSED
        distinguishing_aspect: |
          One lock call propagates through five entities in a fixed causal order — new ladder LOCKED,
          old ladder SUPERSEDED, its DrmPackage STALE, Title.packaging_state STALE, Title
          availability_state TAKEN_DOWN with reason PACKAGING_STALE and the ACTIVE window CLOSED — and
          each hop is caused by the previous hop, not by the request. The sibling cascade instance is
          headed by a metric ingest and is one hop shorter over a disjoint entity set.
