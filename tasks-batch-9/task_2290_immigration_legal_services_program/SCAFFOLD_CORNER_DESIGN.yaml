              as: ProgramDirector
            - call: "POST /accreditations"
              payload: { representative_id: "${omar_id}", recognition_id: "${rec_id}", accreditation_type: "PARTIAL", requested_forums: ["ASYLUM_OFFICE"] }
              as: ProgramDirector
            - call: "GET /case-matters/${matter_id}"
