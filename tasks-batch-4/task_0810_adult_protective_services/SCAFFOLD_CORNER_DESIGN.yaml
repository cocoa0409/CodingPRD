scaffold_corner_design:
  - section: entities
    instances:
      - name: report_creation_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Report, endpoints]
        distinguishing_aspect: "POST /reports with all required fields returns 201 and echoes client_id, priority, status RECEIVED plus system id/created_at/version."
        test_recipe:
          setup: ["One Client exists."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ann Poe", date_of_birth: "1948-01-01", address: "1 Way" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
          trigger:
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "MANDATORY", allegation_types: ["NEGLECT"], priority: "ROUTINE", narrative: "n" }
              as: IntakeWorker
              captures: { rep: "$.data.id" }
          assert:
            - "the response is 201"
            - "Report.${rep}.status == RECEIVED"
            - "Report.${rep}.client_id == ${cli}"
            - "Report.${rep}.version == 1"

      - name: report_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Report, "errors[ERR_REPORT_NOT_FOUND]"]
        distinguishing_aspect: "GET /reports/{id} with an unknown UUID returns ERR_REPORT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /reports/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: IntakeWorker
              captures: { err: "$.data.error_id" }
          assert:
            - "the response is 404 with data.error_id == 'ERR_REPORT_NOT_FOUND'"

      - name: report_missing_required_narrative_returns_validation
        claim_type: Required Fields
        grounds: [entities.Report, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting the required narrative field on POST /reports returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["One Client exists."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Bea Rho", date_of_birth: "1948-01-01", address: "2 Way" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
          trigger:
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "MANDATORY", allegation_types: ["NEGLECT"], priority: "ROUTINE" }
              as: IntakeWorker
              captures: { err: "$.data.error_id" }
          assert:
            - "the response is 400 with data.error_id == 'ERR_VALIDATION'"

      - name: account_available_balance_computed_on_create
        claim_type: Computed Fields
        grounds: [entities.FinancialAccount.fields.available_balance_cents]
        distinguishing_aspect: "POST /accounts sets available_balance_cents = total_balance_cents and status ACTIVE; frozen_amount_cents 0."
        test_recipe:
          setup: ["One Client exists."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Cal Sey", date_of_birth: "1948-01-01", address: "3 Way" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
          trigger:
            - call: "POST /accounts"
              payload: { client_id: "${cli}", institution_name: "Bank", total_balance_cents: 750000 }
              as: IntakeWorker
              captures: { acc: "$.data.id" }
          assert:
            - "FinancialAccount.${acc}.available_balance_cents == 750000"
            - "FinancialAccount.${acc}.frozen_amount_cents == 0"
            - "FinancialAccount.${acc}.status == ACTIVE"

      - name: reports_list_paginated_envelope
        claim_type: Listing
        grounds: [entities.Report, endpoints]
        distinguishing_aspect: "GET /reports?limit=1 returns a Report[] with pagination fields total_count and has_more in meta."
        test_recipe:
          setup: ["One client with two reports."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Dan Tuo", date_of_birth: "1948-01-01", address: "4 Way" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "MANDATORY", allegation_types: ["NEGLECT"], priority: "ROUTINE", narrative: "a" }
              as: IntakeWorker
              captures: { r1: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "VOLUNTARY", allegation_types: ["SELF_NEGLECT"], priority: "ROUTINE", narrative: "b" }
              as: IntakeWorker
              captures: { r2: "$.data.id" }
          trigger:
            - call: "GET /reports?client_id=${cli}&limit=1&offset=0"
              payload: {}
              as: Supervisor
          assert:
            - "the response total_count == 2 and has_more == true and the data array length == 1"

      - name: invalid_enum_priority_returns_422
        claim_type: Type Constraints
        grounds: [entities.Report.fields.priority, "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "A non-member priority value on POST /reports returns ERR_INVALID_ENUM (422)."
        test_recipe:
          setup: ["One Client exists."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Eve Uhl", date_of_birth: "1948-01-01", address: "5 Way" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
          trigger:
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "MANDATORY", allegation_types: ["NEGLECT"], priority: "URGENT", narrative: "n" }
              as: IntakeWorker
              captures: { err: "$.data.error_id" }
          assert:
            - "the response is 422 with data.error_id == 'ERR_INVALID_ENUM'"

  - section: state_machines
    instances:
      - name: screen_already_screened_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Report.RECEIVED_to_SCREENED_OUT, "errors[ERR_REPORT_INVALID_STATE]"]
        distinguishing_aspect: "Screening a report already in SCREENED_OUT returns ERR_REPORT_INVALID_STATE (409); no second case is created."
        test_recipe:
          setup: ["A report screened OUT."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Fay Wex", date_of_birth: "1948-01-01", address: "6 Way" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "ANONYMOUS", allegation_types: ["SELF_NEGLECT"], priority: "ROUTINE", narrative: "x" }
              as: IntakeWorker
              captures: { rep: "$.data.id" }
            - call: "POST /reports/${rep}/screen"
              payload: { decision: "SCREEN_OUT", screen_out_reason: "no jurisdiction" }
              as: Supervisor
          trigger:
            - call: "POST /reports/${rep}/screen"
              payload: { decision: "SCREEN_IN" }
              as: Supervisor
              captures: { err: "$.data.error_id" }
          assert:
            - "the response is 409 with data.error_id == 'ERR_REPORT_INVALID_STATE'"

      - name: dispose_from_in_progress_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Investigation.FINDINGS_SUBMITTED_to_DISPOSED, "errors[ERR_INVESTIGATION_INVALID_STATE]"]
        distinguishing_aspect: "Disposing an investigation still IN_PROGRESS (findings not submitted) returns ERR_INVESTIGATION_INVALID_STATE (409)."
        test_recipe:
          setup: ["Investigation IN_PROGRESS on a screened-in case."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Gus Yeo", date_of_birth: "1948-01-01", address: "7 Way" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "MANDATORY", allegation_types: ["NEGLECT"], priority: "PRIORITY", narrative: "y" }
              as: IntakeWorker
              captures: { rep: "$.data.id" }
            - call: "POST /reports/${rep}/screen"
              payload: { decision: "SCREEN_IN" }
              as: Supervisor
              captures: { cas: "$.data.case_id" }
            - call: "POST /investigations"
              payload: { case_id: "${cas}" }
              as: Caseworker
              captures: { inv: "$.data.id" }
          trigger:
            - call: "POST /investigations/${inv}/dispose"
              payload: { disposition: "SUBSTANTIATED" }
              as: Supervisor
              captures: { err: "$.data.error_id" }
          assert:
            - "the response is 409 with data.error_id == 'ERR_INVESTIGATION_INVALID_STATE'"

      - name: submit_findings_without_comprehensive_assessment_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Investigation.IN_PROGRESS_to_FINDINGS_SUBMITTED, "errors[ERR_COMPREHENSIVE_ASSESSMENT_REQUIRED]"]
        distinguishing_aspect: "submit-findings before any COMPREHENSIVE risk assessment exists returns ERR_COMPREHENSIVE_ASSESSMENT_REQUIRED (409)."
        test_recipe:
          setup: ["Investigation IN_PROGRESS whose client has no comprehensive risk score."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Hal Zin", date_of_birth: "1948-01-01", address: "8 Way" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "MANDATORY", allegation_types: ["NEGLECT"], priority: "PRIORITY", narrative: "z" }
              as: IntakeWorker
              captures: { rep: "$.data.id" }
            - call: "POST /reports/${rep}/screen"
              payload: { decision: "SCREEN_IN" }
              as: Supervisor
              captures: { cas: "$.data.case_id" }
            - call: "POST /investigations"
              payload: { case_id: "${cas}" }
              as: Caseworker
              captures: { inv: "$.data.id" }
          trigger:
            - call: "POST /investigations/${inv}/submit-findings"
              payload: { finding_summary: "premature" }
              as: Caseworker
              captures: { err: "$.data.error_id" }
          assert:
            - "the response is 409 with data.error_id == 'ERR_COMPREHENSIVE_ASSESSMENT_REQUIRED'"

      - name: lift_non_active_freeze_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.FinancialFreeze.ACTIVE_to_LIFTED, "errors[ERR_FREEZE_INVALID_STATE]"]
        distinguishing_aspect: "Lifting a freeze already LIFTED returns ERR_FREEZE_INVALID_STATE (409)."
        test_recipe:
          setup: ["A freeze that has been lifted once."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /clients"
              payload: { full_name: "Ida Ono", date_of_birth: "1948-01-01", address: "9 Way" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
            - call: "POST /accounts"
              payload: { client_id: "${cli}", institution_name: "B", total_balance_cents: 300000 }
              as: IntakeWorker
              captures: { acc: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "MANDATORY", allegation_types: ["FINANCIAL_EXPLOITATION"], priority: "PRIORITY", narrative: "f" }
              as: IntakeWorker
              captures: { rep: "$.data.id" }
            - call: "POST /reports/${rep}/screen"
              payload: { decision: "SCREEN_IN" }
              as: Supervisor
              captures: { cas: "$.data.case_id" }
            - call: "POST /investigations"
              payload: { case_id: "${cas}" }
              as: Caseworker
              captures: { inv: "$.data.id" }
            - call: "POST /freezes"
              payload: { case_id: "${cas}", account_id: "${acc}", flagged_amount_cents: 100000, freeze_start: "2026-06-01T00:00:00Z", freeze_end: "2026-06-30T00:00:00Z" }
              as: Caseworker
              captures: { fz: "$.data.id" }
            - call: "POST /freezes/${fz}/lift"
              payload: {}
              as: Supervisor
          trigger:
            - call: "POST /freezes/${fz}/lift"
              payload: {}
              as: Supervisor
              captures: { err: "$.data.error_id" }
          assert:
            - "the response is 409 with data.error_id == 'ERR_FREEZE_INVALID_STATE'"

      - name: placement_review_expires_past_72h_releases_bed
        claim_type: Side Effect Execution
        grounds: [state_machines.EmergencyPlacement.ACTIVE_to_EXPIRED, entities.EmergencyPlacement.fields.expires_at, entities.Facility.fields.available_beds]
        distinguishing_aspect: "A non-court-authorized placement reviewed at exactly start_at+72h (>= expires_at, inclusive) transitions ACTIVE -> EXPIRED and releases the bed."
        test_recipe:
          setup: ["1-bed facility with an ACTIVE non-court-authorized placement started 2026-06-01T00:00:00Z (expires_at 2026-06-04T00:00:00Z); clock advanced to 2026-06-04T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /facilities"
              payload: { name: "TmpBed", total_beds: 1 }
              as: Admin
              captures: { fac: "$.data.id" }
            - call: "POST /clients"
              payload: { full_name: "Jo Pax", date_of_birth: "1948-01-01", address: "10 Way" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "MANDATORY", allegation_types: ["PHYSICAL_ABUSE"], priority: "EMERGENCY", narrative: "p" }
              as: IntakeWorker
              captures: { rep: "$.data.id" }
            - call: "POST /reports/${rep}/screen"
              payload: { decision: "SCREEN_IN" }
              as: Supervisor
              captures: { cas: "$.data.case_id" }
            - call: "POST /clients/${cli}/capacity-determination"
              payload: { determination: "IMPAIRED" }
              as: Caseworker
            - call: "POST /placements"
              payload: { case_id: "${cas}", facility_id: "${fac}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-20T00:00:00Z", court_authorized: false }
              as: Caseworker
              captures: { plc: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T00:00:00Z" }
              as: Admin
          trigger:
            - call: "POST /placements/${plc}/review"
              payload: {}
              as: Supervisor
          assert:
            - "EmergencyPlacement.${plc}.status == EXPIRED"
            - "Facility.${fac}.available_beds == 1"

  - section: calculations
    instances:
      - name: response_deadline_emergency_24h
        claim_type: Constants Applied
        grounds: [calculations.response_deadline, entities.Report.fields.response_due_at]
        distinguishing_aspect: "An EMERGENCY report created at clock 2026-06-01T00:00:00Z gets response_due_at 2026-06-02T00:00:00Z (created_at + 24h)."
        test_recipe:
          setup: ["Clock at 2026-06-01T00:00:00Z; one Client."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /clients"
              payload: { full_name: "Kim Rou", date_of_birth: "1948-01-01", address: "11 Way" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
          trigger:
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "MANDATORY", allegation_types: ["PHYSICAL_ABUSE"], priority: "EMERGENCY", narrative: "urgent" }
              as: IntakeWorker
              captures: { rep: "$.data.id", due: "$.data.response_due_at" }
          assert:
            - "Report.${rep}.response_due_at == '2026-06-02T00:00:00.000Z'"

      - name: risk_score_formula_correctness
        claim_type: Correct Result
        grounds: [calculations.risk_score]
        excluded_because:
          difficulty_instance: risk_score_nonlinear_cap_and_tier
          rationale: "Risk-score formula correctness (weights, caps, tier) is asserted with literal values by the named §1.8 instance."

      - name: fund_recovery_distribution_correctness
        claim_type: Correct Result
        grounds: [calculations.fund_recovery_distribution]
        excluded_because:
          difficulty_instance: fund_recovery_rounding_order_remainder
          rationale: "Per-account rounding, remainder allocation and created_at tie-break are asserted with literal values by the named §1.8 instance."

  - section: validations
    instances:
      - name: auth_missing_headers_returns_unauthenticated
        claim_type: Violation to Error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers returns ERR_UNAUTHENTICATED (401) before any business logic."
        test_recipe:
          setup: ["Empty DB; request sent with no auth headers."]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { full_name: "No Auth", date_of_birth: "1948-01-01", address: "12 Way" }
              as: IntakeWorker
              captures: { err: "$.data.error_id" }
          assert:
            - "when the X-User-Role and X-User-ID headers are omitted the response is 401 with data.error_id == 'ERR_UNAUTHENTICATED'"

      - name: unauthorized_intakeworker_cannot_screen_returns_403
        claim_type: Violation to Error
        grounds: ["validations[priority=2]", roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "IntakeWorker calling POST /reports/{id}/screen (Supervisor-only) returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A RECEIVED report."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Lou Kim", date_of_birth: "1948-01-01", address: "13 Way" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "MANDATORY", allegation_types: ["NEGLECT"], priority: "ROUTINE", narrative: "n" }
              as: IntakeWorker
              captures: { rep: "$.data.id" }
          trigger:
            - call: "POST /reports/${rep}/screen"
              payload: { decision: "SCREEN_IN" }
              as: IntakeWorker
              captures: { err: "$.data.error_id" }
          assert:
            - "the response is 403 with data.error_id == 'ERR_UNAUTHORIZED'"

      - name: placement_invalid_date_range_returns_422
        claim_type: Violation to Error
        grounds: ["validations[priority=6]", "errors[ERR_INVALID_DATE_RANGE]"]
        distinguishing_aspect: "POST /placements with end_at <= start_at returns ERR_INVALID_DATE_RANGE (422)."
        test_recipe:
          setup: ["Eligible screened-in client and a facility."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /facilities"
              payload: { name: "F", total_beds: 2 }
              as: Admin
              captures: { fac: "$.data.id" }
            - call: "POST /clients"
              payload: { full_name: "Mae Lox", date_of_birth: "1948-01-01", address: "14 Way" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "MANDATORY", allegation_types: ["PHYSICAL_ABUSE"], priority: "EMERGENCY", narrative: "p" }
              as: IntakeWorker
              captures: { rep: "$.data.id" }
            - call: "POST /reports/${rep}/screen"
              payload: { decision: "SCREEN_IN" }
              as: Supervisor
              captures: { cas: "$.data.case_id" }
            - call: "POST /clients/${cli}/capacity-determination"
              payload: { determination: "IMPAIRED" }
              as: Caseworker
          trigger:
            - call: "POST /placements"
              payload: { case_id: "${cas}", facility_id: "${fac}", start_at: "2026-06-05T00:00:00Z", end_at: "2026-06-05T00:00:00Z", court_authorized: true }
              as: Caseworker
              captures: { err: "$.data.error_id" }
          assert:
            - "the response is 422 with data.error_id == 'ERR_INVALID_DATE_RANGE'"

      - name: account_already_frozen_returns_409
        claim_type: Violation to Error
        grounds: ["validations[priority=13]", "errors[ERR_ACCOUNT_ALREADY_FROZEN]"]
        distinguishing_aspect: "A second freeze on an account already FROZEN returns ERR_ACCOUNT_ALREADY_FROZEN (409)."
        test_recipe:
          setup: ["Case UNDER_INVESTIGATION (financial) with one ACTIVE freeze on the account."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /clients"
              payload: { full_name: "Ned Qi", date_of_birth: "1948-01-01", address: "15 Way" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
            - call: "POST /accounts"
              payload: { client_id: "${cli}", institution_name: "B", total_balance_cents: 500000 }
              as: IntakeWorker
              captures: { acc: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "MANDATORY", allegation_types: ["FINANCIAL_EXPLOITATION"], priority: "PRIORITY", narrative: "f" }
              as: IntakeWorker
              captures: { rep: "$.data.id" }
            - call: "POST /reports/${rep}/screen"
              payload: { decision: "SCREEN_IN" }
              as: Supervisor
              captures: { cas: "$.data.case_id" }
            - call: "POST /investigations"
              payload: { case_id: "${cas}" }
              as: Caseworker
              captures: { inv: "$.data.id" }
            - call: "POST /freezes"
              payload: { case_id: "${cas}", account_id: "${acc}", flagged_amount_cents: 100000, freeze_start: "2026-06-01T00:00:00Z", freeze_end: "2026-06-10T00:00:00Z" }
              as: Caseworker
              captures: { fz1: "$.data.id" }
          trigger:
            - call: "POST /freezes"
              payload: { case_id: "${cas}", account_id: "${acc}", flagged_amount_cents: 50000, freeze_start: "2026-06-02T00:00:00Z", freeze_end: "2026-06-11T00:00:00Z" }
              as: Caseworker
              captures: { err: "$.data.error_id" }
          assert:
            - "the response is 409 with data.error_id == 'ERR_ACCOUNT_ALREADY_FROZEN'"

      - name: refer_guardianship_capacity_not_impaired_returns_422
        claim_type: Cross-entity validation
        grounds: ["validations[priority=11]", "errors[ERR_CAPACITY_NOT_IMPAIRED]"]
        distinguishing_aspect: "refer-guardianship on a case whose client capacity_status is UNKNOWN returns ERR_CAPACITY_NOT_IMPAIRED (422)."
        test_recipe:
          setup: ["Screened-in case whose client capacity is still UNKNOWN."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ora Vim", date_of_birth: "1948-01-01", address: "16 Way" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "MANDATORY", allegation_types: ["NEGLECT"], priority: "PRIORITY", narrative: "n" }
              as: IntakeWorker
              captures: { rep: "$.data.id" }
            - call: "POST /reports/${rep}/screen"
              payload: { decision: "SCREEN_IN" }
              as: Supervisor
              captures: { cas: "$.data.case_id" }
          trigger:
            - call: "POST /cases/${cas}/refer-guardianship"
              payload: {}
              as: Caseworker
              captures: { err: "$.data.error_id" }
          assert:
            - "the response is 422 with data.error_id == 'ERR_CAPACITY_NOT_IMPAIRED'"

  - section: endpoints
    instances:
      - name: cross_report_sets_agency
        claim_type: Action endpoint
        grounds: [endpoints, entities.Case.fields.cross_report_agency]
        distinguishing_aspect: "POST /cases/{id}/cross-report records recipient_agency and cross_reported_at on the case."
        test_recipe:
          setup: ["A screened-in case."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /clients"
              payload: { full_name: "Pia Wen", date_of_birth: "1948-01-01", address: "17 Way" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "MANDATORY", allegation_types: ["FINANCIAL_EXPLOITATION"], priority: "PRIORITY", narrative: "f" }
              as: IntakeWorker
              captures: { rep: "$.data.id" }
            - call: "POST /reports/${rep}/screen"
              payload: { decision: "SCREEN_IN" }
              as: Supervisor
              captures: { cas: "$.data.case_id" }
          trigger:
            - call: "POST /cases/${cas}/cross-report"
              payload: { recipient_agency: "COUNTY_SHERIFF" }
              as: Supervisor
          assert:
            - "Case.${cas}.cross_report_agency == 'COUNTY_SHERIFF'"
            - "Case.${cas}.cross_reported_at == '2026-06-01T00:00:00.000Z'"

      - name: service_plan_activates_client
        claim_type: Action endpoint
        grounds: [endpoints, state_machines.Client.SERVICES_PENDING_to_SERVICES_ACTIVE, entities.Case.fields.service_plan_status]
        distinguishing_aspect: "POST /cases/{id}/service-plan on a READY_FOR_CLOSURE case sets service_plan_status ACTIVE and transitions the client SERVICES_PENDING -> SERVICES_ACTIVE."
        test_recipe:
          setup: ["Case READY_FOR_CLOSURE (investigation disposed); client SERVICES_PENDING."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ray Xu", date_of_birth: "1948-01-01", address: "18 Way" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "MANDATORY", allegation_types: ["NEGLECT"], priority: "PRIORITY", narrative: "n" }
              as: IntakeWorker
              captures: { rep: "$.data.id" }
            - call: "POST /reports/${rep}/screen"
              payload: { decision: "SCREEN_IN" }
              as: Supervisor
              captures: { cas: "$.data.case_id" }
            - call: "POST /investigations"
              payload: { case_id: "${cas}" }
              as: Caseworker
              captures: { inv: "$.data.id" }
            - call: "GET /clients/${cli}"
              payload: {}
              as: Caseworker
              captures: { vN: "$.data.version" }
            - call: "POST /clients/${cli}/risk-assessments"
              payload: { assessment_type: "COMPREHENSIVE", isolation_level: 1, cognitive_impairment_level: 1, financial_vulnerability_level: 1, caregiver_dependency_level: 1, prior_report_count: 0, expected_client_version: "${vN}" }
              as: Caseworker
            - call: "POST /investigations/${inv}/submit-findings"
              payload: { finding_summary: "ok" }
              as: Caseworker
            - call: "POST /investigations/${inv}/dispose"
              payload: { disposition: "UNSUBSTANTIATED" }
              as: Supervisor
          trigger:
            - call: "POST /cases/${cas}/service-plan"
              payload: { benefit_programs: ["SNAP", "MEDICAID"] }
              as: Caseworker
          assert:
            - "Case.${cas}.service_plan_status == ACTIVE"
            - "Client.${cli}.status == SERVICES_ACTIVE"

      - name: investigations_filtered_by_case_id
        claim_type: Computed read
        grounds: [entities.Investigation.fields.case_id, endpoints]
        distinguishing_aspect: "GET /investigations?case_id=X returns the Investigation[] for that case (FK reverse-reachability)."
        test_recipe:
          setup: ["One case with one investigation."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Sam Yo", date_of_birth: "1948-01-01", address: "19 Way" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "MANDATORY", allegation_types: ["NEGLECT"], priority: "PRIORITY", narrative: "n" }
              as: IntakeWorker
              captures: { rep: "$.data.id" }
            - call: "POST /reports/${rep}/screen"
              payload: { decision: "SCREEN_IN" }
              as: Supervisor
              captures: { cas: "$.data.case_id" }
            - call: "POST /investigations"
              payload: { case_id: "${cas}" }
              as: Caseworker
              captures: { inv: "$.data.id" }
          trigger:
            - call: "GET /investigations?case_id=${cas}"
              payload: {}
              as: Caseworker
          assert:
            - "the data array contains exactly one investigation whose id == ${inv} and case_id == ${cas}"

  - section: errors
    instances:
      - name: occ_stale_client_version_rejected
        claim_type: Violation to Error
        grounds: ["concurrency_rules[risk-assessment-supersede-stale-client]", "validations[priority=8]", "errors[ERR_STALE_CLIENT_VERSION]"]
        distinguishing_aspect: "A risk-assessment carrying expected_client_version equal to a stale (pre-mutation) version — after capacity-determination has bumped Client.version — is rejected with ERR_STALE_CLIENT_VERSION (412)."
        test_recipe:
          setup: ["Client created (version 1) then capacity-determined IMPAIRED (version now 2)."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Uma Zed", date_of_birth: "1948-01-01", address: "20 Way" }
              as: IntakeWorker
              captures: { cli: "$.data.id", v1: "$.data.version" }
            - call: "POST /clients/${cli}/capacity-determination"
              payload: { determination: "IMPAIRED" }
              as: Caseworker
          trigger:
            - call: "POST /clients/${cli}/risk-assessments"
              payload: { assessment_type: "COMPREHENSIVE", isolation_level: 2, cognitive_impairment_level: 2, financial_vulnerability_level: 1, caregiver_dependency_level: 0, prior_report_count: 0, expected_client_version: "${v1}" }
              as: Caseworker
              captures: { err: "$.data.error_id" }
          assert:
            - "the response is 412 with data.error_id == 'ERR_STALE_CLIENT_VERSION'"

      - name: recover_funds_no_active_freeze_returns_409
        claim_type: Violation to Error
        grounds: ["validations[priority=16]", "errors[ERR_NO_ACTIVE_FREEZE]"]
        distinguishing_aspect: "recover-funds on a case with no ACTIVE freeze returns ERR_NO_ACTIVE_FREEZE (409)."
        test_recipe:
          setup: ["A screened-in case UNDER_INVESTIGATION with no freezes."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Vic Ann", date_of_birth: "1948-01-01", address: "21 Way" }
              as: IntakeWorker
              captures: { cli: "$.data.id" }
            - call: "POST /reports"
              payload: { client_id: "${cli}", reporter_type: "MANDATORY", allegation_types: ["FINANCIAL_EXPLOITATION"], priority: "PRIORITY", narrative: "f" }
              as: IntakeWorker
              captures: { rep: "$.data.id" }
            - call: "POST /reports/${rep}/screen"
              payload: { decision: "SCREEN_IN" }
              as: Supervisor
              captures: { cas: "$.data.case_id" }
            - call: "POST /investigations"
              payload: { case_id: "${cas}" }
              as: Caseworker
              captures: { inv: "$.data.id" }
          trigger:
            - call: "POST /cases/${cas}/recover-funds"
              payload: { recovered_amount_cents: 100000 }
              as: Supervisor
              captures: { err: "$.data.error_id" }
          assert:
            - "the response is 409 with data.error_id == 'ERR_NO_ACTIVE_FREEZE'"

  - section: rbac
    instances:
      - name: caseworker_cannot_lift_freeze_returns_403
        claim_type: Violation to Error
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Caseworker calling POST /freezes/{id}/lift (Supervisor-exclusive) returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A case UNDER_INVESTIGATION (financial) with one ACTIVE freeze."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
