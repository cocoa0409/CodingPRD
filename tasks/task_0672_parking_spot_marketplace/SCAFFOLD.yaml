scenario: |
  Parking-Spot Marketplace & Monthly Rental (SpotHero/Neighbor style): host space listing
  & availability, hourly/daily/monthly booking, dynamic event pricing, access (gate/QR) &
  validation, host payout & fee, overstay/violation, refund/cancellation, reservation transfer.

domain_name: parking-spot-marketplace
api_prefix: ""

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - scheduled_deferred_actions
    - optimistic_concurrency

  entity_topology: flat
  # Spot, Booking, Driver, Host, PricingEvent, AccessPass, PayoutLedgerEntry,
  # ViolationRecord, TransferOffer are peer entities linked by foreign keys; no
  # nested-ownership URL chains. Bookings reference a Spot and a Driver by id.

  state_machine_shape: parallel
  # Booking carries two independent dimensions: occupancy_status (RESERVED ->
  # CHECKED_IN -> CHECKED_OUT, with overstay branch) and settlement_status
  # (UNSETTLED -> SETTLED / REFUNDED), which evolve on different triggers.
  # Spot listing is cyclic (LISTED <-> UNLISTED). TransferOffer is branching.

  relationship_patterns:
    - one_to_many        # Host 1->* Spot; Spot 1->* Booking; Driver 1->* Booking; Booking 1->* TransferOffer
    - cross_aggregate    # Booking references Driver AND Spot across aggregates; ViolationRecord references Booking AND Driver

  role_model: peer_roles
  # Host owns Spots & receives payouts; Driver books & checks in; PlatformAdmin
  # operates pricing events, payout sweeps, violation review; Anonymous registers.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Host
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: Host login identifier; unique across Hosts.
        constraints: unique, non-empty
      - name: display_name
        type: string
        source: input
        description: Public host name shown on listings.
      - name: payout_account_ref
        type: string
        source: input
        description: Opaque bank/payout reference token.
      - name: platform_fee_bps
        type: integer
        source: input
        description: Platform commission in basis points applied to this host's gross earnings.
        default: 1500
        constraints: 0..5000 (0% .. 50%)
      - name: lifetime_payout_cents
        type: integer
        source: computed
        description: >-
          Sum of amount_cents over all PayoutLedgerEntry rows for this host whose
          entry_type IN {EARNING, REVERSAL} (REVERSAL rows are negative). Conserved
          ledger total; recomputed on every ledger mutation.
        default: 0

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: Driver login identifier; unique across Drivers.
        constraints: unique, non-empty
      - name: display_name
        type: string
        source: input
        description: Public driver name.
      - name: wallet_balance_cents
        type: integer
        source: computed
        description: >-
          Driver prepaid wallet balance in cents. Debited at booking confirmation,
          credited on WALLET refunds, debited on overstay penalty capture. Never negative.
        default: 0
      - name: violation_points
        type: integer
        source: computed
        description: >-
          Confirmed violation points. Increments only when a ViolationRecord transitions
          to CONFIRMED (see §1.3 confirmed_violation_points). Drives standing tier.
        default: 0
      - name: provisional_violation_points
        type: integer
        source: computed
        description: >-
          Provisional violation points including OPEN (unreviewed) ViolationRecords.
          Diverges from violation_points until each record is reviewed (dual-variant, §1.3).
        default: 0
      - name: standing_tier
        type: enum
        source: computed
        description: >-
          GOOD / WATCH / SUSPENDED derived from confirmed violation_points thresholds (§1.3).
        constraints: GOOD | WATCH | SUSPENDED
        default: GOOD

  - name: Spot
    parent: null
    common_fields: true
    fields:
      - name: host_id
        type: string
        source: input
        description: FK -> Host.id; the owning host. Immutable after creation.
      - name: title
        type: string
        source: input
        description: Listing title.
      - name: zone_code
        type: string
        source: input
        description: Geographic zone code used to match PricingEvents (e.g. "DT-01").
      - name: base_hourly_cents
        type: integer
        source: input
        description: Base price per hour in cents.
        constraints: ">= 100"
      - name: base_daily_cents
        type: integer
        source: input
        description: Base price per 24h day in cents (used for DAILY bookings).
        constraints: ">= 500"
      - name: monthly_flat_cents
        type: integer
        source: input
        description: Flat price for a MONTHLY (30-day) booking in cents.
        constraints: ">= 5000"
      - name: availability_start
        type: datetime
        source: input
        description: Inclusive start of the spot's bookable window (ISO 8601 UTC).
      - name: availability_end
        type: datetime
        source: input
        description: Exclusive end of the spot's bookable window (ISO 8601 UTC).
      - name: overstay_grace_minutes
        type: integer
        source: input
        description: Minutes after booking end_at before overstay penalty accrues.
        default: 15
        constraints: 0..120
      - name: listing_status
        type: enum
        source: system
        description: LISTED / UNLISTED. New spots start LISTED.
        constraints: LISTED | UNLISTED
        default: LISTED

  - name: PricingEvent
    parent: null
    common_fields: true
    fields:
      - name: zone_code
        type: string
        source: input
        description: Zone the surge applies to; matched against Spot.zone_code.
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the surge window (ISO 8601 UTC).
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end of the surge window (ISO 8601 UTC).
      - name: surge_multiplier_bps
        type: integer
        source: input
        description: Surge factor in basis points (10000 = 1.0x, 25000 = 2.5x).
        constraints: 10000..50000
      - name: status
        type: enum
        source: system
        description: ACTIVE / CANCELLED. New events start ACTIVE; only ACTIVE events affect pricing.
        constraints: ACTIVE | CANCELLED
        default: ACTIVE

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - name: spot_id
        type: string
        source: input
        description: FK -> Spot.id; the reserved spot.
      - name: driver_id
        type: string
        source: input
        description: FK -> Driver.id; the current holder of the reservation.
      - name: rate_kind
        type: enum
        source: input
        description: HOURLY / DAILY / MONTHLY; selects the base rate and duration unit.
        constraints: HOURLY | DAILY | MONTHLY
      - name: start_at
        type: datetime
        source: input
        description: Inclusive reservation start (ISO 8601 UTC).
      - name: end_at
        type: datetime
        source: input
        description: Exclusive reservation end (ISO 8601 UTC).
      - name: quoted_amount_cents
        type: integer
        source: computed
        description: >-
          Provisional price computed at creation from the booking window (§1.3
          booking_quote_amount). Frozen at creation; never recomputed.
      - name: final_amount_cents
        type: integer
        source: computed
        description: >-
          Final price computed at checkout from actual occupancy incl. overstay (§1.3
          final_settlement_amount). Null until CHECKED_OUT.
      - name: occupancy_status
        type: enum
        source: system
        description: >-
          RESERVED / CHECKED_IN / CHECKED_OUT / CANCELLED / NO_SHOW. Independent of
          settlement_status (parallel dimension).
        constraints: RESERVED | CHECKED_IN | CHECKED_OUT | CANCELLED | NO_SHOW
        default: RESERVED
      - name: settlement_status
        type: enum
        source: system
        description: >-
          UNSETTLED / SETTLED / REFUNDED. Independent of occupancy_status (parallel dimension).
        constraints: UNSETTLED | SETTLED | REFUNDED
        default: UNSETTLED
      - name: actual_checkin_at
        type: datetime
        source: system
        description: Server clock at check-in; null until checked in.
      - name: actual_checkout_at
        type: datetime
        source: system
        description: Server clock at check-out; null until checked out.
      - name: transfer_count
        type: integer
        source: computed
        description: >-
          Number of times this reservation's holder has been reassigned via an accepted
          TransferOffer. Incremented on each transfer accept; starts at 0.
        default: 0

  - name: AccessPass
    parent: null
    common_fields: false
    fields:
      - name: booking_id
        type: string
        source: system
        description: FK -> Booking.id; the booking this pass grants access to.
      - name: qr_token
        type: string
        source: system
        description: Opaque single-spot QR token minted at check-in.
      - name: gate_opens_remaining
        type: integer
        source: system
        description: >-
          Remaining gate-open redemptions for this pass. Initialized to 2 at check-in;
          decremented per gate open; pass invalid at 0.
        default: 2

  - name: ViolationRecord
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: FK -> Booking.id; the booking the violation is logged against.
      - name: driver_id
        type: string
        source: system
        description: FK -> Driver.id; copied from the booking's driver at logging time.
      - name: violation_kind
        type: enum
        source: input
        description: OVERSTAY / UNAUTHORIZED_GATE / NO_SHOW; selects base point weight.
        constraints: OVERSTAY | UNAUTHORIZED_GATE | NO_SHOW
      - name: base_points
        type: integer
        source: input
        description: Points proposed by the reporter before review.
        constraints: 1..10
      - name: status
        type: enum
        source: system
        description: OPEN / CONFIRMED / DISMISSED. New records start OPEN.
        constraints: OPEN | CONFIRMED | DISMISSED
        default: OPEN
      - name: assessed_points
        type: integer
        source: computed
        description: >-
          Final points after review (§1.3 confirmed_violation_points). Null while OPEN.

  - name: PayoutLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: host_id
        type: string
        source: system
        description: FK -> Host.id; the host this entry credits or reverses.
      - name: booking_id
        type: string
        source: system
        description: FK -> Booking.id; the originating booking.
      - name: entry_type
        type: enum
        source: system
        description: EARNING (positive) / REVERSAL (negative). Determines sign of amount_cents.
        constraints: EARNING | REVERSAL
      - name: amount_cents
        type: integer
        source: computed
        description: >-
          Signed cents posted to the host ledger (§1.3 host_payout_amount). EARNING is
          positive; REVERSAL is negative.

  - name: TransferOffer
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: FK -> Booking.id; the reservation being offered for transfer.
      - name: from_driver_id
        type: string
        source: system
        description: FK -> Driver.id; the offering (current) holder, copied from the booking.
      - name: to_driver_id
        type: string
        source: input
        description: FK -> Driver.id; the invited recipient driver.
      - name: status
        type: enum
        source: system
        description: PENDING / ACCEPTED / DECLINED / WITHDRAWN. New offers start PENDING.
        constraints: PENDING | ACCEPTED | DECLINED | WITHDRAWN
        default: PENDING

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Spot
    initial_state: LISTED
    terminal_states: []
    transitions:
      - from: LISTED
        to: UNLISTED
        trigger: "POST /spots/{id}/unlist"
        actor: Host
        preconditions:
          - "acting Host owns the Spot (Spot.host_id == X-User-ID)"
          - "no Booking on this Spot has occupancy_status IN {RESERVED, CHECKED_IN}"
        side_effects:
          - "Spot.listing_status = UNLISTED"
          - "increments Spot.version by 1"
        note: Cyclic with relist; an unlisted spot rejects new bookings (§1.4 P40).
      - from: UNLISTED
        to: LISTED
        trigger: "POST /spots/{id}/relist"
        actor: Host
        preconditions:
          - "acting Host owns the Spot (Spot.host_id == X-User-ID)"
        side_effects:
          - "Spot.listing_status = LISTED"
          - "increments Spot.version by 1"

  - entity: PricingEvent
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /pricing-events/{id}/cancel"
        actor: PlatformAdmin
        preconditions:
          - "PricingEvent.status == ACTIVE"
        side_effects:
          - "PricingEvent.status = CANCELLED"
          - "increments PricingEvent.version by 1"
        note: >-
          Cancelling does NOT retroactively re-quote existing bookings; quoted_amount_cents
          is frozen at booking creation. Only future quotes stop seeing this surge.

  - entity: Booking
    initial_state: RESERVED
    terminal_states: [CHECKED_OUT, CANCELLED, NO_SHOW]
    transitions:
      - from: RESERVED
        to: CHECKED_IN
        trigger: "POST /bookings/{id}/check-in"
        actor: Driver
        preconditions:
          - "acting Driver holds the booking (Booking.driver_id == X-User-ID)"
          - "Booking.occupancy_status == RESERVED"
          - "Booking.settlement_status == SETTLED (payment captured at confirmation)"
          - "logical clock >= Booking.start_at"
          - "logical clock < Booking.end_at + Spot.overstay_grace_minutes (cannot check in once window+grace already elapsed)"
        side_effects:
          - "Booking.occupancy_status = CHECKED_IN"
          - "Booking.actual_checkin_at = logical clock"
          - "mints an AccessPass with gate_opens_remaining = 2"
          - "increments Booking.version by 1"
      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /bookings/{id}/check-out"
        actor: Driver
        preconditions:
          - "acting Driver holds the booking (Booking.driver_id == X-User-ID)"
          - "Booking.occupancy_status == CHECKED_IN"
        side_effects:
          - "Booking.actual_checkout_at = logical clock"
          - "computes Booking.final_amount_cents via §1.3 final_settlement_amount"
          - "if final_amount_cents > quoted_amount_cents: debit Driver.wallet_balance_cents by the delta (overstay top-up), floored at 0 (wallet never goes negative; any shortfall is recorded as owed but does not block checkout)"
          - "CASCADE (depth 3): when actual_checkout_at > Booking.end_at + grace, the check-out auto-logs a ViolationRecord(violation_kind=OVERSTAY, status=OPEN, base_points=1, driver_id copied from booking) -> that record creation recomputes Driver.provisional_violation_points via §1.3 (provisional adds OVERSTAY weight 1 * base_points 1 = 1) -> standing_tier itself is unaffected (only CONFIRMED points move the tier)"
          - "Booking.occupancy_status = CHECKED_OUT"
          - "posts a PayoutLedgerEntry(EARNING) for the host via §1.3 host_payout_amount -> Host.lifetime_payout_cents recomputed"
          - "invalidates the AccessPass (gate_opens_remaining = 0)"
          - "increments Booking.version by 1"
        note: Parallel dimension — settlement_status stays SETTLED; only occupancy advances.
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: Driver
        preconditions:
          - "acting Driver holds the booking (Booking.driver_id == X-User-ID)"
          - "Booking.occupancy_status == RESERVED"
        side_effects:
          - "Booking.occupancy_status = CANCELLED"
          - "computes refund via §1.3 refund_amount and credits Driver.wallet_balance_cents"
          - "Booking.settlement_status = REFUNDED"
          - "CASCADE (depth 2): cancelling a RESERVED booking that has a PENDING TransferOffer auto-withdraws that offer (TransferOffer.status = WITHDRAWN) -> the withdrawal makes the offer terminal so no later accept/decline is possible on it"
          - "increments Booking.version by 1"
        note: >-
          Refund tier depends on how far ahead of start_at the cancel lands (§1.3). A RESERVED
          booking has no posted host EARNING yet, so no host ledger reversal occurs here.
      - from: RESERVED
        to: NO_SHOW
        trigger: "POST /_clock/set_current_utc (system sweep) or POST /bookings/{id}/mark-no-show"
        actor: system
        preconditions:
          - "Booking.occupancy_status == RESERVED"
          - "logical clock >= Booking.end_at + Spot.overstay_grace_minutes"
        side_effects:
          - "Booking.occupancy_status = NO_SHOW"
          - "Booking.settlement_status = SETTLED (no refund for a no-show)"
          - "posts a PayoutLedgerEntry(EARNING) for the host on the quoted amount via §1.3 host_payout_amount -> Host.lifetime_payout_cents recomputed"
          - "CASCADE (depth 2): mark-no-show auto-logs a ViolationRecord(violation_kind=NO_SHOW, status=OPEN, base_points=3, driver_id copied from booking) -> that record creation recomputes Driver.provisional_violation_points via §1.3 (provisional adds NO_SHOW weight 3 * base_points 3 = 9)"
          - "increments Booking.version by 1"

  - entity: ViolationRecord
    initial_state: OPEN
    terminal_states: [CONFIRMED, DISMISSED]
    transitions:
      - from: OPEN
        to: CONFIRMED
        trigger: "POST /violations/{id}/confirm"
        actor: PlatformAdmin
        preconditions:
          - "ViolationRecord.status == OPEN"
        side_effects:
          - "ViolationRecord.status = CONFIRMED"
          - "ViolationRecord.assessed_points computed via §1.3 confirmed_violation_points"
          - "CASCADE (depth 3): confirm mutates Driver.violation_points (+= assessed_points) -> that point change recomputes Driver.standing_tier via §1.3 driver_standing_tier -> when the new tier == SUSPENDED, every Booking on that Driver with occupancy_status == RESERVED is auto-cancelled (occupancy_status = CANCELLED, settlement_status = REFUNDED) -> each such auto-cancel credits the §1.3 refund_amount to that Driver's wallet_balance_cents. (RESERVED bookings carry no host EARNING yet, so no REVERSAL is posted on this path.)"
          - "Driver.provisional_violation_points re-derived (OPEN-set shrinks)"
          - "increments ViolationRecord.version by 1"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /violations/{id}/dismiss"
        actor: PlatformAdmin
        preconditions:
          - "ViolationRecord.status == OPEN"
        side_effects:
          - "ViolationRecord.status = DISMISSED"
          - "ViolationRecord.assessed_points = 0"
          - "Driver.provisional_violation_points re-derived (this OPEN record drops out); Driver.violation_points unchanged"
          - "increments ViolationRecord.version by 1"

  - entity: TransferOffer
    initial_state: PENDING
    terminal_states: [ACCEPTED, DECLINED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /transfer-offers/{id}/accept"
        actor: Driver
        preconditions:
          - "acting Driver is the recipient (TransferOffer.to_driver_id == X-User-ID)"
          - "TransferOffer.status == PENDING"
          - "the underlying Booking.occupancy_status == RESERVED"
          - "the underlying Booking has no overlapping conflict for to_driver_id is not required, but the recipient's standing_tier != SUSPENDED"
          - "logical clock < Booking.start_at (transfer only before the window opens)"
        side_effects:
          - "TransferOffer.status = ACCEPTED"
          - "the underlying Booking.driver_id = to_driver_id (reservation reassigned); Booking.transfer_count += 1"
          - "CASCADE (compensation): the recipient to_driver must be able to pay the booking's quoted_amount_cents — if to_driver wallet < quoted_amount_cents the accept is rejected BEFORE any mutation (ERR_INSUFFICIENT_WALLET). Otherwise debit to_driver.wallet_balance_cents by quoted_amount_cents (recipient assumes the reservation at the original frozen quote), then credit from_driver.wallet_balance_cents the FULL quoted_amount_cents (original holder made whole). The platform escrow held for this booking stays exactly quoted_amount_cents."
          - "increments TransferOffer.version by 1; increments Booking.version by 1"
        note: >-
          Conserved-quantity invariant #1 (driver escrow) — escrow held for this booking equals
          Booking.quoted_amount_cents both before and after the swap: from_driver refunded the full
          Q, to_driver charged Q. Net change to (sum of the two drivers' wallet_balance_cents) over
          the accept is exactly zero; the booking's quoted_amount_cents is the conserved escrow. The
          tiered §1.3 refund_amount is NOT used here (transfer is full-make-whole, not a cancel).
      - from: PENDING
        to: DECLINED
        trigger: "POST /transfer-offers/{id}/decline"
        actor: Driver
        preconditions:
          - "acting Driver is the recipient (TransferOffer.to_driver_id == X-User-ID)"
          - "TransferOffer.status == PENDING"
        side_effects:
          - "TransferOffer.status = DECLINED"
          - "increments TransferOffer.version by 1"
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /transfer-offers/{id}/withdraw"
        actor: Driver
        preconditions:
          - "acting Driver is the offeror (TransferOffer.from_driver_id == X-User-ID)"
          - "TransferOffer.status == PENDING"
        side_effects:
          - "TransferOffer.status = WITHDRAWN"
          - "increments TransferOffer.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: booking-create-stale-spot
    parent_entity: Spot
    write_endpoint: "POST /bookings"
    occ_field: "expected_spot_version"
    description: |
      Creating a Booking against a Spot whose version has advanced since the client
      last observed it is rejected with a stale-version error. A prior accepted
      booking on the same spot increments Spot.version (the spot's availability
      footprint changed); a client holding the pre-booking version is working from
      a stale view of which windows remain free and must re-read before booking.
    error_id: ERR_STALE_SPOT_VERSION
    http_status: 412

  - rule_id: transfer-create-stale-booking
    parent_entity: Booking
    write_endpoint: "POST /transfer-offers"
    occ_field: "expected_booking_version"
    description: |
      Creating a TransferOffer against a Booking whose version has advanced since the
      client last observed it is rejected with a stale-version error. A prior offer
      creation (or any booking mutation such as a check-in) bumps Booking.version; an
      offeror holding the stale version may be offering a reservation that has already
      checked in or been offered, and must re-read before offering.
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: booking_quote_amount
    trigger: "POST /bookings (booking creation) — frozen into Booking.quoted_amount_cents"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial mode (a): >=3 inputs with non-linear interaction
      # (rate_kind branch, surge multiplier, weekend uplift, min/max floor).
      duration_seconds = end_at - start_at        # end_at exclusive
      if rate_kind == HOURLY:
          units   = ceil(duration_seconds / 3600)         # round UP to whole hours
          base    = units * spot.base_hourly_cents
      elif rate_kind == DAILY:
          units   = ceil(duration_seconds / 86400)        # round UP to whole 24h days
          base    = units * spot.base_daily_cents
      elif rate_kind == MONTHLY:
          # MONTHLY is a flat 30-day block; window MUST equal exactly 30 days (§1.4).
          base    = spot.monthly_flat_cents               # units fixed at 1
      # surge: pick the single ACTIVE PricingEvent for spot.zone_code whose
      # [window_start, window_end) CONTAINS start_at; if several match, choose the
      # one with the highest surge_multiplier_bps, tie-break earliest created_at.
      surge_bps = matched_event.surge_multiplier_bps if matched_event else 10000
      # weekend uplift applies when start_at falls on Sat/Sun (UTC), HOURLY/DAILY only.
      weekend_bps = 11000 if (rate_kind != MONTHLY and start_at.weekday in {SAT,SUN}) else 10000
      raw = base * surge_bps / 10000 * weekend_bps / 10000
      # floor: never below the spot's base_hourly_cents (a 0-duration edge cannot occur
      # because §1.4 requires end_at > start_at).
      quoted = max(round_half_up(raw), spot.base_hourly_cents)
    input_set: "Single Booking at creation; matched ACTIVE PricingEvent in same zone."
    constants:
      SECONDS_PER_HOUR: 3600
      SECONDS_PER_DAY: 86400
      NEUTRAL_BPS: 10000
      WEEKEND_BPS: 11000
    precision: "Compute in cents; round_half_up to whole cents at the single 'raw' step (multiply-then-round, NOT round-then-multiply)."
    variants:
      - name: provisional_quote
        when: "At booking creation"
        difference: "Uses the requested [start_at, end_at) window; frozen, never recomputed."

  - name: final_settlement_amount
    trigger: "POST /bookings/{id}/check-out — written to Booking.final_amount_cents"
    algorithm: threshold
    formula: |
      # Dual-variant partner of booking_quote_amount on the SAME Booking domain, but
      # final uses ACTUAL occupancy and adds an overstay charge (different inputs).
      billable_end = max(actual_checkout_at, end_at)   # never bill less than reserved
      # base portion: re-price the reserved window at the SAME quoted amount (frozen).
      base_portion = quoted_amount_cents
      overstay_seconds = max(0, actual_checkout_at - (end_at + grace_minutes*60))
      if overstay_seconds <= 0:
          overstay_charge = 0
      else:
          overstay_hours = ceil(overstay_seconds / 3600)
          # overstay billed at 1.5x the spot base hourly, NOT at the surged rate.
          overstay_charge = round_half_up(overstay_hours * spot.base_hourly_cents * OVERSTAY_RATE_BPS / 10000)
      final = base_portion + overstay_charge
    input_set: "Single Booking at checkout; actual_checkout_at vs end_at + grace."
    constants:
      OVERSTAY_RATE_BPS: 15000   # 1.5x base hourly
      SECONDS_PER_HOUR: 3600
    precision: "round_half_up to whole cents on the overstay_charge term only, then add the integer base_portion."
    variants:
      - name: final_settlement
        when: "At checkout"
        difference: >-
          Recomputed from actual_checkout_at incl. overstay; diverges from quoted_amount_cents
          whenever checkout exceeds end_at + grace. Same Booking, different inputs/result.

  - name: host_payout_amount
    trigger: "Booking -> CHECKED_OUT, -> NO_SHOW (EARNING); POST /bookings/{id}/reverse-payout (REVERSAL)"
    algorithm: aggregation
    formula: |
      # Combinatorial mode (b): nested rounding where ORDER matters. The platform fee
      # is computed PER booking and rounded, THEN summed into the host ledger — NOT by
      # summing gross first and rounding the aggregate fee. The scaffold PINS per-line
      # rounding.
      gross_cents = (final_amount_cents if booking.occupancy_status == CHECKED_OUT
                     else quoted_amount_cents)         # NO_SHOW bills the quote
      fee_cents   = round_half_up(gross_cents * host.platform_fee_bps / 10000)   # ROUND HERE, per booking
      net_earning = gross_cents - fee_cents
      # EARNING entry amount_cents = +net_earning; REVERSAL entry = -net_earning of the
      # original EARNING for the same booking (exact negation, no re-derivation).
      ledger_amount = net_earning            # EARNING
                   # = -(original EARNING.amount_cents) for REVERSAL
      # Host.lifetime_payout_cents = sum(amount_cents) over EARNING + REVERSAL rows.
    input_set: "One booking's gross; host.platform_fee_bps; prior EARNING for REVERSAL."
    constants:
      BPS_DENOM: 10000
    precision: "round_half_up the per-booking fee_cents, THEN subtract from integer gross. Per-line rounding is pinned; do NOT sum-then-round."
    variants:
      - name: earning
        when: "Checkout or no-show finalizes the booking"
        difference: "Posts +net_earning to the host ledger."
      - name: reversal
        when: "POST /bookings/{id}/reverse-payout on a finalized booking with a posted EARNING"
        difference: "Posts the exact negation of the original EARNING; Host.lifetime_payout_cents nets back to its pre-EARNING value."

  - name: confirmed_violation_points
    trigger: "POST /violations/{id}/confirm — written to ViolationRecord.assessed_points and added to Driver.violation_points"
    algorithm: weighted_scoring
    formula: |
      # Dual-variant partner is provisional vs confirmed scoring, but this calc lives on
      # the DRIVER domain (distinct from the Booking-domain dual variant above).
      KIND_WEIGHT = { OVERSTAY: 1, UNAUTHORIZED_GATE: 2, NO_SHOW: 3 }
      # repeat-offender escalation: count of the driver's ALREADY-CONFIRMED records
      # (status == CONFIRMED) BEFORE this one, by created_at ASC ordering.
      prior_confirmed = count(ViolationRecord where driver_id == this.driver_id
                              and status == CONFIRMED and created_at < this.created_at)
      escalation_bps = 10000 + min(prior_confirmed, 3) * 2500   # +25% per prior, cap +75%
      assessed = round_half_up(base_points * KIND_WEIGHT[violation_kind] * escalation_bps / 10000)
    input_set: "This ViolationRecord; driver's prior CONFIRMED records by created_at ASC."
    constants:
      ESCALATION_STEP_BPS: 2500
      ESCALATION_CAP_STEPS: 3
      NEUTRAL_BPS: 10000
    precision: "round_half_up to whole points."
    variants:
      - name: provisional_points
        when: "While the record is OPEN (Driver.provisional_violation_points)"
        difference: >-
          Provisional uses base_points * KIND_WEIGHT with escalation_bps fixed at 10000
          (no escalation, since confirmation order is unknown until review). Confirmed
          applies the escalation factor. Same driver, different result -> dual variant.

  - name: refund_amount
    trigger: "POST /bookings/{id}/cancel; transfer accept (refund to from_driver); suspension auto-cancel"
    algorithm: waterfall_allocation
    formula: |
      # Tiered refund of the FROZEN quoted_amount_cents by lead time before start_at.
      lead_seconds = start_at - logical_clock_at_cancel
      if   lead_seconds >= 7*86400:  refund_bps = 10000   # >=7 days: full
      elif lead_seconds >= 1*86400:  refund_bps = 7500    # >=1 day & <7d: 75%
      elif lead_seconds >= 0:        refund_bps = 5000    # before start, <1 day: 50%
      else:                          refund_bps = 0       # at/after start_at: no refund
      refund = round_half_up(quoted_amount_cents * refund_bps / 10000)
    input_set: "One Booking's quoted_amount_cents; lead time = start_at - clock."
    constants:
      FULL_BPS: 10000
      EARLY_BPS: 7500
      LATE_BPS: 5000
      SEVEN_DAYS_S: 604800
      ONE_DAY_S: 86400
    precision: "round_half_up to whole cents."
    variants:
      - name: standard_refund
        when: "Driver-initiated cancel or suspension auto-cancel"
        difference: "Lead time measured at the cancel instant."

  - name: driver_standing_tier
    trigger: "Recomputed whenever Driver.violation_points changes (violation confirm cascade)"
    algorithm: threshold
    formula: |
      # Boundary-precision thresholds on CONFIRMED points.
      if   violation_points >= 10: tier = SUSPENDED
      elif violation_points >= 5:  tier = WATCH       # 5 inclusive -> WATCH; 4 -> GOOD
      else:                        tier = GOOD
    input_set: "Driver.violation_points (confirmed only)."
    constants:
      WATCH_THRESHOLD: 5
      SUSPENDED_THRESHOLD: 10
    precision: "integer comparison; >= boundaries."
    variants:
      - name: confirmed_tier
        when: "On confirm cascade"
        difference: "Uses confirmed violation_points only (provisional points never move the tier)."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /hosts, POST /drivers, POST /_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist (Spot, Booking, Driver, Host, PricingEvent, ViolationRecord, TransferOffer), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all id-bearing endpoints"

  - priority: 4
    category: auth
    check: "Acting entity_backed user owns/holds the resource (Host owns Spot; Driver holds Booking; recipient/offeror on TransferOffer)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Spot mutations, Booking driver actions, TransferOffer accept/decline/withdraw"

  - priority: 10
    category: state
    check: "Target resource is in a valid state for the requested transition (occupancy_status / settlement_status / listing_status / offer status / violation status)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 11
    category: state
    check: "OCC: expected_spot_version / expected_booking_version matches the parent's current version"
    error_id: ERR_STALE_SPOT_VERSION
    http_status: 412
    applies_to: "POST /bookings (spot), POST /transfer-offers (booking), POST /bookings/{id}/reverse-payout (booking)"

  - priority: 12
    category: state
    check: >-
      reverse-payout requires the booking to have a posted PayoutLedgerEntry(EARNING) and no
      prior REVERSAL for it; otherwise rejected (occupancy_status must be CHECKED_OUT or NO_SHOW
      and exactly one EARNING with no matching REVERSAL exists)
    error_id: ERR_NO_REVERSIBLE_PAYOUT
    http_status: 409
    applies_to: "POST /bookings/{id}/reverse-payout"

  - priority: 20
    category: business_temporal
    check: "Booking window valid: end_at > start_at; window inside [Spot.availability_start, Spot.availability_end); MONTHLY window exactly 30 days"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /bookings"

  - priority: 21
    category: business_temporal
    check: "Check-in clock within [start_at, end_at + grace); check-in before start_at or after window+grace rejected"
    error_id: ERR_CHECKIN_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /bookings/{id}/check-in"

  - priority: 30
    category: business_constraint
    check: >-
      No occupancy overlap: requested [start_at, end_at) must not intersect any existing
      Booking on the same Spot whose occupancy_status IN {RESERVED, CHECKED_IN, CHECKED_OUT}.
      Adjacent bookings touching at a boundary (prev.end_at == new.start_at) are ALLOWED
      (half-open intervals).
    error_id: ERR_SPOT_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /bookings"

  - priority: 31
    category: business_constraint
    check: >-
      No PricingEvent within a zone may sit closer than a mandatory EVENT_BUFFER of 3600
      seconds (1 hour) to another ACTIVE event in the same zone_code. Distinct interval
      semantics from the spot rule: events are treated as CLOSED-with-buffer — a new event is
      rejected unless there is a >= 3600s gap on BOTH sides from every ACTIVE event in the zone,
      so touching/adjacent windows (gap < 3600s, including exactly-touching) are REJECTED. Formally
      reject when new.window_start < (other.window_end + 3600) AND (new.window_end + 3600) > other.window_start.
    error_id: ERR_EVENT_ZONE_CONFLICT
    http_status: 409
    applies_to: "POST /pricing-events"

  - priority: 32
    category: business_constraint
    check: "Gate open requires a valid AccessPass with gate_opens_remaining > 0 and matching booking; otherwise rejected"
    error_id: ERR_GATE_PASS_INVALID
    http_status: 409
    applies_to: "POST /access-passes/redeem"

  - priority: 40
    category: business_constraint
    check: "Spot.listing_status == LISTED required to create a Booking on it"
    error_id: ERR_SPOT_UNLISTED
    http_status: 409
    applies_to: "POST /bookings"

  - priority: 41
    category: business_constraint
    check: "Driver.standing_tier != SUSPENDED to create a Booking or accept a transfer (a suspended driver has no RESERVED bookings left to check into, since suspension auto-cancels them)"
    error_id: ERR_DRIVER_SUSPENDED
    http_status: 409
    applies_to: "POST /bookings, POST /transfer-offers/{id}/accept"

  - priority: 42
    category: business_constraint
    check: "Transfer recipient must differ from current holder; cannot transfer to self"
    error_id: ERR_TRANSFER_TO_SELF
    http_status: 422
    applies_to: "POST /transfer-offers"

  - priority: 50
    category: business_fiscal
    check: "Driver wallet_balance_cents >= amount to be debited (booking confirmation charge, transfer recipient charge)"
    error_id: ERR_INSUFFICIENT_WALLET
    http_status: 402
    applies_to: "POST /bookings, POST /transfer-offers/{id}/accept"

  - priority: 60
    category: business_constraint
    check: "Required body fields present and well-typed; enums in allowed set; integer/bps ranges respected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PATCH with a body"

  - priority: 61
    category: business_constraint
    check: "Pagination limit within [1,100] and offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Hosts ----
  - method: POST
    path: "/hosts"
    description: Register a host.
    roles: [Anonymous]
    code: 201
    input: [email, display_name, payout_account_ref, "platform_fee_bps?"]
    output: Host
    side_effects: ["creates Host with lifetime_payout_cents=0"]

  - method: GET
    path: "/hosts/{id}"
    description: Fetch a host.
    roles: [Host, PlatformAdmin]
    code: 200
    input: []
    output: Host

  - method: GET
    path: "/hosts/{id}/ledger"
    description: List a host's PayoutLedgerEntry rows (reverse-reachability for PayoutLedgerEntry.host_id).
    roles: [Host, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: PayoutLedgerEntry[]

  # ---- Drivers ----
  - method: POST
    path: "/drivers"
    description: Register a driver.
    roles: [Anonymous]
    code: 201
    input: [email, display_name]
    output: Driver
    side_effects: ["creates Driver with wallet_balance_cents=0, GOOD standing"]

  - method: GET
    path: "/drivers/{id}"
    description: Fetch a driver (incl. wallet, violation points, standing).
    roles: [Driver, PlatformAdmin]
    code: 200
    input: []
    output: Driver

  - method: POST
    path: "/drivers/{id}/wallet/topup"
    description: Credit a driver's wallet (business funding endpoint; used to fund bookings).
    roles: [Driver, PlatformAdmin]
    code: 200
    input: [amount_cents]
    output: Driver
    side_effects: ["increments Driver.wallet_balance_cents by amount_cents"]

  # ---- Spots ----
  - method: POST
    path: "/spots"
    description: Create (list) a parking spot.
    roles: [Host]
    code: 201
    input: [host_id, title, zone_code, base_hourly_cents, base_daily_cents, monthly_flat_cents, availability_start, availability_end, "overstay_grace_minutes?"]
    output: Spot
    side_effects: ["creates Spot LISTED"]

  - method: GET
    path: "/spots/{id}"
    description: Fetch a spot.
    roles: [Host, Driver, PlatformAdmin]
    code: 200
    input: []
    output: Spot

  - method: GET
    path: "/spots"
    description: List spots; filter by host_id and/or zone_code.
    roles: [Host, Driver, PlatformAdmin]
    code: 200
    input: ["host_id?", "zone_code?", "limit?", "offset?"]
    output: Spot[]

  - method: GET
    path: "/spots/{id}/bookings"
    description: List bookings on a spot (reverse-reachability for Booking.spot_id).
    roles: [Host, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Booking[]

  - method: POST
    path: "/spots/{id}/unlist"
    description: Unlist a spot (no active bookings allowed).
    roles: [Host]
    code: 200
    input: []
    output: Spot
    side_effects: ["Spot.listing_status=UNLISTED", "increments Spot.version by 1"]

  - method: POST
    path: "/spots/{id}/relist"
    description: Relist an unlisted spot.
    roles: [Host]
    code: 200
    input: []
    output: Spot
    side_effects: ["Spot.listing_status=LISTED", "increments Spot.version by 1"]

  # ---- Pricing Events ----
  - method: POST
    path: "/pricing-events"
    description: Create a surge pricing event for a zone/window.
    roles: [PlatformAdmin]
    code: 201
    input: [zone_code, window_start, window_end, surge_multiplier_bps]
    output: PricingEvent
    side_effects: ["creates ACTIVE PricingEvent"]

  - method: GET
    path: "/pricing-events/{id}"
    description: Fetch a pricing event.
    roles: [PlatformAdmin, Host, Driver]
    code: 200
    input: []
    output: PricingEvent

  - method: GET
    path: "/pricing-events"
    description: List pricing events; filter by zone_code.
    roles: [PlatformAdmin, Host, Driver]
    code: 200
    input: ["zone_code?", "limit?", "offset?"]
    output: PricingEvent[]

  - method: POST
    path: "/pricing-events/{id}/cancel"
    description: Cancel a pricing event (does not re-quote existing bookings).
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PricingEvent
    side_effects: ["PricingEvent.status=CANCELLED", "increments PricingEvent.version by 1"]

  # ---- Bookings ----
  - method: POST
    path: "/bookings"
    description: Create a booking on a spot; computes quoted_amount_cents and charges the driver wallet.
    roles: [Driver]
    code: 201
    input: [spot_id, driver_id, rate_kind, start_at, end_at, expected_spot_version]
    output: Booking
    side_effects:
      - "computes Booking.quoted_amount_cents via §1.3 booking_quote_amount"
      - "debits Driver.wallet_balance_cents by quoted_amount_cents"
      - "Booking.settlement_status=SETTLED on successful charge"
      - "increments Spot.version by 1"

  - method: GET
    path: "/bookings/{id}"
    description: Fetch a booking.
    roles: [Driver, Host, PlatformAdmin]
    code: 200
    input: []
    output: Booking

  - method: GET
    path: "/bookings"
    description: List bookings; filter by driver_id and/or spot_id.
    roles: [Driver, Host, PlatformAdmin]
    code: 200
    input: ["driver_id?", "spot_id?", "limit?", "offset?"]
    output: Booking[]

  - method: GET
    path: "/bookings/{id}/transfer-offers"
    description: List transfer offers on a booking (reverse-reachability for TransferOffer.booking_id).
    roles: [Driver, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: TransferOffer[]

  - method: GET
    path: "/bookings/{id}/violations"
    description: List violation records on a booking (reverse-reachability for ViolationRecord.booking_id).
    roles: [Driver, Host, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ViolationRecord[]

  - method: GET
    path: "/bookings/{id}/access-pass"
    description: Fetch the access pass for a booking (reverse-reachability for AccessPass.booking_id; array of 0-1).
    roles: [Driver, PlatformAdmin]
    code: 200
    input: []
    output: AccessPass[]

  - method: GET
    path: "/bookings/{id}/ledger-entries"
    description: List PayoutLedgerEntry rows for a booking (reverse-reachability for PayoutLedgerEntry.booking_id).
    roles: [Host, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: PayoutLedgerEntry[]

  - method: POST
    path: "/bookings/{id}/check-in"
    description: Driver checks in; mints an access pass.
    roles: [Driver]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "Booking.occupancy_status=CHECKED_IN"
      - "Booking.actual_checkin_at set"
      - "mints AccessPass gate_opens_remaining=2"
      - "increments Booking.version by 1"

  - method: POST
    path: "/bookings/{id}/check-out"
    description: Driver checks out; finalizes settlement, posts host payout, handles overstay.
    roles: [Driver]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "Booking.actual_checkout_at set; final_amount_cents via §1.3 final_settlement_amount"
      - "overstay top-up debits Driver.wallet; auto-logs OVERSTAY ViolationRecord on overstay"
      - "posts PayoutLedgerEntry(EARNING); Host.lifetime_payout_cents recomputed"
      - "AccessPass invalidated"
      - "increments Booking.version by 1"

  - method: POST
    path: "/bookings/{id}/cancel"
    description: Driver cancels a reserved booking; refunds per tier; reverses any payout.
    roles: [Driver]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "Booking.occupancy_status=CANCELLED; settlement_status=REFUNDED"
      - "refund via §1.3 refund_amount credited to wallet"
      - "REVERSAL ledger entry if EARNING existed; withdraws PENDING TransferOffer"
      - "increments Booking.version by 1"

  - method: POST
    path: "/bookings/{id}/mark-no-show"
    description: PlatformAdmin marks an un-checked-in expired booking as no-show.
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "Booking.occupancy_status=NO_SHOW; settlement_status=SETTLED"
      - "posts PayoutLedgerEntry(EARNING) on quoted amount; auto-logs NO_SHOW ViolationRecord"
      - "increments Booking.version by 1"

  - method: POST
    path: "/bookings/{id}/reverse-payout"
    description: >-
      Admin dispute-resolution: reverse a previously-posted host EARNING for a finalized
      booking (CHECKED_OUT or NO_SHOW). Posts a REVERSAL ledger entry that is the exact
      negation of the booking's EARNING, restoring Host.lifetime_payout_cents to its pre-EARNING value.
    roles: [PlatformAdmin]
    code: 200
    input: [expected_booking_version]
    output: PayoutLedgerEntry
    side_effects:
      - "posts PayoutLedgerEntry(REVERSAL, amount_cents = -(original EARNING.amount_cents)) for the host"
      - "Host.lifetime_payout_cents recomputed (nets to its value before this booking's EARNING)"
      - "increments Booking.version by 1"

  # ---- Access Passes ----
  - method: POST
    path: "/access-passes/redeem"
    description: Open the gate by redeeming a QR token; decrements remaining opens.
    roles: [Driver]
    code: 200
    input: [qr_token]
    output: AccessPass
    side_effects: ["decrements AccessPass.gate_opens_remaining by 1 (rejected at 0)"]

  # ---- Transfer Offers ----
  - method: POST
    path: "/transfer-offers"
    description: Offer a reserved booking to another driver.
    roles: [Driver]
    code: 201
    input: [booking_id, to_driver_id, expected_booking_version]
    output: TransferOffer
    side_effects: ["creates PENDING TransferOffer", "increments Booking.version by 1"]

  - method: GET
    path: "/transfer-offers/{id}"
    description: Fetch a transfer offer.
    roles: [Driver, PlatformAdmin]
    code: 200
    input: []
    output: TransferOffer

  - method: GET
    path: "/transfer-offers"
    description: List transfer offers; filter by to_driver_id or from_driver_id.
    roles: [Driver, PlatformAdmin]
    code: 200
    input: ["to_driver_id?", "from_driver_id?", "booking_id?", "limit?", "offset?"]
    output: TransferOffer[]

  - method: POST
    path: "/transfer-offers/{id}/accept"
    description: Recipient accepts; reassigns the booking and settles wallets.
    roles: [Driver]
    code: 200
    input: []
    output: TransferOffer
    side_effects:
      - "TransferOffer.status=ACCEPTED; Booking.driver_id=to_driver_id"
      - "refund from_driver, charge to_driver per §1.3; rejects on insufficient wallet"
      - "increments TransferOffer.version by 1"

  - method: POST
    path: "/transfer-offers/{id}/decline"
    description: Recipient declines a pending offer.
    roles: [Driver]
    code: 200
    input: []
    output: TransferOffer
    side_effects: ["TransferOffer.status=DECLINED", "increments TransferOffer.version by 1"]

  - method: POST
    path: "/transfer-offers/{id}/withdraw"
    description: Offeror withdraws a pending offer.
    roles: [Driver]
    code: 200
    input: []
    output: TransferOffer
    side_effects: ["TransferOffer.status=WITHDRAWN", "increments TransferOffer.version by 1"]

  # ---- Violations ----
  - method: POST
    path: "/violations"
    description: Log a violation record against a booking (host or admin reports).
    roles: [Host, PlatformAdmin]
    code: 201
    input: [booking_id, violation_kind, base_points]
    output: ViolationRecord
    side_effects:
      - "creates OPEN ViolationRecord; driver_id copied from booking"
      - "Driver.provisional_violation_points re-derived"

  - method: GET
    path: "/violations/{id}"
    description: Fetch a violation record.
    roles: [Host, Driver, PlatformAdmin]
    code: 200
    input: []
    output: ViolationRecord

  - method: GET
    path: "/violations"
    description: List violation records; filter by driver_id.
    roles: [Host, Driver, PlatformAdmin]
    code: 200
    input: ["driver_id?", "booking_id?", "status?", "limit?", "offset?"]
    output: ViolationRecord[]

  - method: GET
    path: "/drivers/{id}/violations"
    description: List violation records for a driver (reverse-reachability for ViolationRecord.driver_id).
    roles: [Driver, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ViolationRecord[]

  - method: POST
    path: "/violations/{id}/confirm"
    description: Admin confirms a violation; assesses points; cascades to standing/suspension.
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ViolationRecord
    side_effects:
      - "ViolationRecord.status=CONFIRMED; assessed_points via §1.3"
      - "Driver.violation_points += assessed_points; standing recomputed; suspension cascade auto-cancels RESERVED bookings"
      - "increments ViolationRecord.version by 1"

  - method: POST
    path: "/violations/{id}/dismiss"
    description: Admin dismisses a violation; no confirmed points.
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ViolationRecord
    side_effects:
      - "ViolationRecord.status=DISMISSED; assessed_points=0; provisional points re-derived"
      - "increments ViolationRecord.version by 1"

  # ---- Test-driving / clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: >-
      Set the server logical clock to an ISO 8601 UTC instant. Startup default is
      2026-04-01T00:00:00Z; before any set, the clock reads exactly this default and
      never falls back to wall-clock. Used to drive time-gated transitions deterministically.
    roles: [PlatformAdmin, Anonymous]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["advances logical clock; may make RESERVED bookings eligible for no-show"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID on a protected endpoint."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for this operation."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Acting entity_backed user is not the owner/holder of the target resource."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource not in a valid state for the requested transition."
  - id: ERR_STALE_SPOT_VERSION
    http: 412
    condition: "expected_spot_version does not match Spot.version (OCC)."
  - id: ERR_STALE_BOOKING_VERSION
    http: 412
    condition: "expected_booking_version does not match Booking.version (OCC)."
  - id: ERR_NO_REVERSIBLE_PAYOUT
    http: 409
    condition: "reverse-payout on a booking with no posted EARNING, or whose EARNING was already reversed."
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "Booking window invalid: end_at<=start_at, outside spot availability, or MONTHLY != 30 days."
  - id: ERR_CHECKIN_WINDOW_CLOSED
    http: 409
    condition: "Check-in attempted before start_at or after end_at+grace."
  - id: ERR_SPOT_TIME_CONFLICT
    http: 409
    condition: "Requested booking window overlaps an existing RESERVED/CHECKED_IN/CHECKED_OUT booking on the spot."
  - id: ERR_EVENT_ZONE_CONFLICT
    http: 409
    condition: "New pricing event window overlaps an ACTIVE event in the same zone."
  - id: ERR_GATE_PASS_INVALID
    http: 409
    condition: "Gate redemption with no valid pass or gate_opens_remaining == 0."
  - id: ERR_SPOT_UNLISTED
    http: 409
    condition: "Booking attempted on an UNLISTED spot."
  - id: ERR_DRIVER_SUSPENDED
    http: 409
    condition: "Suspended driver attempted to book, check in, or accept a transfer."
  - id: ERR_TRANSFER_TO_SELF
    http: 422
    condition: "Transfer recipient equals the current holder."
  - id: ERR_INSUFFICIENT_WALLET
    http: 402
    condition: "Driver wallet balance below the amount to be debited."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing/invalid body field, bad enum, or out-of-range integer/bps."
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1,100] or offset < 0."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: Unauthenticated caller; may register and set the test clock.
    identity: opaque
    exclusive_operations:
      - "POST /hosts"
      - "POST /drivers"
    shared_operations:
      - "POST /_clock/set_current_utc"

  - name: Host
    description: Owns spots, lists/unlists them, reports violations, receives payouts.
    identity: "entity_backed:Host"
    exclusive_operations:
      - "POST /spots"
      - "POST /spots/{id}/unlist"
      - "POST /spots/{id}/relist"
      - "GET /hosts/{id}/ledger"
      - "GET /spots/{id}/bookings"
    shared_operations:
      - "GET /spots, GET /spots/{id}"
      - "POST /violations (with PlatformAdmin)"
      - "GET /bookings, GET /bookings/{id}"
      - "GET /pricing-events, GET /pricing-events/{id}"

  - name: Driver
    description: Books spots, funds wallet, checks in/out, redeems gate, transfers reservations.
    identity: "entity_backed:Driver"
    exclusive_operations:
      - "POST /bookings"
      - "POST /bookings/{id}/check-in"
      - "POST /bookings/{id}/check-out"
      - "POST /bookings/{id}/cancel"
      - "POST /access-passes/redeem"
      - "POST /transfer-offers"
      - "POST /transfer-offers/{id}/accept"
      - "POST /transfer-offers/{id}/decline"
      - "POST /transfer-offers/{id}/withdraw"
      - "POST /drivers/{id}/wallet/topup (with PlatformAdmin)"
    shared_operations:
      - "GET /spots, GET /spots/{id}"
      - "GET /bookings, GET /bookings/{id}"
      - "GET /drivers/{id}"

  - name: PlatformAdmin
    description: Operates pricing events, no-show marking, violation review, payout sweeps.
    identity: opaque
    exclusive_operations:
      - "POST /pricing-events"
      - "POST /pricing-events/{id}/cancel"
      - "POST /bookings/{id}/mark-no-show"
      - "POST /bookings/{id}/reverse-payout"
      - "POST /violations/{id}/confirm"
      - "POST /violations/{id}/dismiss"
    shared_operations:
      - "POST /violations (with Host)"
      - "POST /drivers/{id}/wallet/topup (with Driver)"
      - "GET endpoints across resources"
