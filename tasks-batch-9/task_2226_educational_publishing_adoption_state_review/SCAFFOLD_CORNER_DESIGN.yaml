      - name: filing_gate_stack_peels_off_topic_then_focus_coverage
        claim_type: error_triggerable
        grounds:
          - errors[ERR_STANDARD_NOT_IN_FRAMEWORK]
          - errors[ERR_REQUIRED_TOPIC_MISSING]
          - errors[ERR_FOCUS_STANDARD_UNCOVERED]
          - validations[priority=34]
          - validations[priority=38]
          - validations[priority=52]
        distinguishing_aspect: |
          Citing an unknown code returns ERR_STANDARD_NOT_IN_FRAMEWORK (422); the missing required
          topic then outranks the uncovered focus standard, so filing returns
          ERR_REQUIRED_TOPIC_MISSING first and only after an APPLIED ADD_REQUIRED_TOPIC edit does
          filing surface ERR_FOCUS_STANDARD_UNCOVERED for the MENTION-only focus citation.
        test_recipe:
          setup:
            - "State GA is OPEN_TERRITORY, requires topic FINANCIAL_LITERACY and has focus standard GA.SS.9.1 at weight 3"
            - "Title GA-SS-9 is ACTIVE with content_tags [PRIMARY_SOURCES] only, so the required topic is absent"
            - "The cycle is OPEN at clock 2026-09-15 and the DRAFT submission cites GA.SS.9.1 at MENTION depth only"
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "GA", adoption_model: "OPEN_TERRITORY", sampling_copies_required: 0, min_verified_coverage_pct: 20.00, required_topics: ["FINANCIAL_LITERACY"] }
