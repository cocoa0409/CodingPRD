      - name: guest_verification_lazy_expiry_and_reverify
        claim_type: conditional_validation
        grounds:
          - "validations[priority=7]"
          - state_machines.Guest.ELIGIBLE_to_EXPIRED
          - state_machines.Guest.EXPIRED_to_ELIGIBLE
          - "errors[ERR_GUEST_INELIGIBLE]"
        distinguishing_aspect: "Eligibility is enforced lazily: an expired-verification guest is flipped to EXPIRED by the failed check-in itself, then reverify restores ELIGIBLE and the same check-in succeeds."
        test_recipe:
          setup: ["Center with ACTIVE agreement (posture RESTRICTED — check-ins allowed); guest verification_expires_on 2026-08-15 (already past)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
              payload: { name: "Lamed Center", airport_code: "PSC", occupancy_cap: 10, required_daily_confirmed_assignments: 1 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /centers/${c_id}/site-agreements"
              payload: { facility_space_sqft: 300, utilities_included: true, access_terms: "badge", security_level: 1, start_date: "2026-09-01", end_date: "2027-08-31" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /site-agreements/${a_id}/activate"
              payload: { expected_center_version: "${c_v}" }
              as: PlatformAdmin
            - call: "POST /guests"
              payload: { full_name: "G Lapsed", category: "VETERAN", verification_expires_on: "2026-08-15" }
              as: Anonymous
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /centers/${c_id}/check-ins"
              payload: { guest_id: "${g_id}" }
              as: CenterManager
              captures: { err: $.data.error_id }
            - call: "GET /guests/${g_id}"
              as: CenterManager
              captures: { g_status: $.data.eligibility_status }
            - call: "POST /guests/${g_id}/reverify"
              payload: { verification_expires_on: "2027-06-01" }
              as: CenterManager
              captures: { g_status2: $.data.eligibility_status }
            - call: "POST /centers/${c_id}/check-ins"
              payload: { guest_id: "${g_id}" }
              as: CenterManager
              captures: { ci_id: $.data.id }
          assert:
            - "first check-in rejected ERR_GUEST_INELIGIBLE (verification 2026-08-15 < 2026-09-01)"
            - "Guest.eligibility_status lazily flipped to EXPIRED by that rejection"
            - "reverify restores ELIGIBLE; retry check-in succeeds (VisitCheckIn.${ci_id} created)"
      - name: renew_rejected_outside_window
        claim_type: violation_to_error
        grounds:
          - state_machines.SiteAgreement.RENEWAL_DUE_to_ACTIVE
          - "errors[ERR_RENEWAL_WINDOW_NOT_OPEN]"
        distinguishing_aspect: "Renew from ACTIVE (renewal window not entered) is rejected even with a valid later end date."
        test_recipe:
          setup: ["Center; agreement ACTIVE with end_date 2027-08-31 (far outside the 60-day renewal window)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
              payload: { name: "Mem Center", airport_code: "MSY", occupancy_cap: 10, required_daily_confirmed_assignments: 1 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
