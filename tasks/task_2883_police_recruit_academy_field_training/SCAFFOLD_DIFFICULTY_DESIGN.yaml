      - name: abort_remedial_rotation_restores_active_trainee_count_and_probation_schedule
        grounds:
          - state_machines[FieldTrainingRotation].transitions[REMEDIAL -> ABORTED]
          - state_machines[Recruit.probation_status].transitions[EXTENSION_REQUIRED -> ACTIVE]
          - entities.Instructor.fields.active_trainee_count
          - entities.ObservationReport.fields.voided
          - calculations.probation_schedule
          - calculations.field_training_competency_score
          - validations[priority 82 category business_fiscal ERR_MILESTONE_NOT_REACHED]
        distinguishing_aspect: |
          Aborting the remedial rotation must unwind THREE independent derived quantities to their
          exact pre-cascade values, each by a different mechanism: the FTO's conserved
          active_trainee_count decrements back to 0; every ObservationReport of the rotation is
          voided, which drops dor_count to 0 and returns competency_score and rolling_mean_score to
          null (they are not merely frozen); and because no REMEDIAL rotation of the trainee remains,
          probation_status returns EXTENSION_REQUIRED -> ACTIVE, whose re-derivation of
          probation_schedule drops the aborted rotation out of the STEP 2 eligible set so the
          milestone score, extension days and scheduled end all snap back to the values the earlier
          COMPLETED rotation produced. The milestone DATE never moved throughout, and the restored
          schedule still gates a premature PASS decision. Reversing only the counter, or leaving the
          60-day extension in place, breaks the invariant.
