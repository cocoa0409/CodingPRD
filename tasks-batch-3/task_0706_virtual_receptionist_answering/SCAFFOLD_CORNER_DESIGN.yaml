          trigger:
            - call: "POST /va/calls/${call_id}/abandon"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == \"ERR_INVALID_STATE\""

      # ---- compound/posture re-derive: reschedule_limit not crossable from terminal
      - name: reschedule_after_three_loops_hits_limit
        claim_type: cyclic
        grounds:
          - state_machines.Appointment.status.CONFIRMED_to_RESCHEDULE_REQUESTED
          - validations[priority=13]
          - errors[ERR_RESCHEDULE_LIMIT]
          - entities.Appointment.fields.reschedule_count
        distinguishing_aspect: "Cyclic loop termination: after reschedule_count reaches 3, a fourth reschedule -> ERR_RESCHEDULE_LIMIT (409); the cycle is bounded."
        test_recipe:
          setup:
            - "Account; OPEN slot capacity 1, buffer 0; one CONFIRMED appointment, rescheduled+reconfirmed three times so reschedule_count == 3."
          setup_api_calls:
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /va/service-plans"
              payload: { name: "Prl", billing_model: "PER_CALL", base_fee_cents: 0, overage_rate_cents: 50, overage_tier2_rate_cents: 50, hard_cap_overage_cents: 100000, included_calls: 100, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "Loop", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /va/calendar-slots"
              payload: { account_id: "${acct_id}", window_start: "2026-03-02T08:00:00Z", window_end: "2026-03-02T20:00:00Z", buffer_minutes: 0, capacity: 1 }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /va/appointments"
              payload: { account_id: "${acct_id}", slot_id: "${slot_id}", start_at: "2026-03-02T10:00:00Z", end_at: "2026-03-02T10:30:00Z", expected_slot_version: "${slot_v}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /va/appointments/${appt_id}/confirm"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /va/appointments/${appt_id}/reschedule"
              payload: { start_at: "2026-03-02T11:00:00Z", end_at: "2026-03-02T11:30:00Z" }
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /va/appointments/${appt_id}/confirm"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /va/appointments/${appt_id}/reschedule"
              payload: { start_at: "2026-03-02T12:00:00Z", end_at: "2026-03-02T12:30:00Z" }
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /va/appointments/${appt_id}/confirm"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /va/appointments/${appt_id}/reschedule"
              payload: { start_at: "2026-03-02T13:00:00Z", end_at: "2026-03-02T13:30:00Z" }
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /va/appointments/${appt_id}/confirm"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /va/appointments/${appt_id}/reschedule"
              payload: { start_at: "2026-03-02T14:00:00Z", end_at: "2026-03-02T14:30:00Z" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Appointment.${appt_id}.reschedule_count == 3 before the fourth reschedule"
            - "response status == 409"
            - "error_id == \"ERR_RESCHEDULE_LIMIT\""

      # ---- BillingPeriod close + finalize opens next period (linear close-out)
      - name: period_finalize_opens_next_period
        claim_type: Side Effect Execution
        grounds:
          - state_machines.BillingPeriod.status.PENDING_CLOSE_to_CLOSED
          - entities.BillingPeriod.fields.period_index
          - entities.ClientAccount.fields.current_period_id
        distinguishing_aspect: "PENDING_CLOSE -> CLOSED finalize creates a fresh OPEN period (period_index+1) and repoints ClientAccount.current_period_id to it."
        test_recipe:
          setup:
            - "Account on a plan with no usage; its OPEN period (index 0) closed to PENDING_CLOSE (no disputes)."
          setup_api_calls:
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /va/service-plans"
              payload: { name: "Pfin", billing_model: "PER_CALL", base_fee_cents: 0, overage_rate_cents: 50, overage_tier2_rate_cents: 50, hard_cap_overage_cents: 100000, included_calls: 100, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "Fin", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, period_id: $.data.current_period_id }
            - call: "GET /va/billing-periods/${period_id}"
              payload: {}
              as: PlatformAdmin
              captures: { period_v: $.data.version }
            - call: "POST /va/billing-periods/${period_id}/close"
              payload: { expected_period_version: "${period_v}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /va/billing-periods/${period_id}/finalize"
              payload: {}
              as: PlatformAdmin
              captures: { final_status: $.data.status }
            - call: "GET /va/accounts/${acct_id}"
              payload: {}
              as: PlatformAdmin
              captures: { new_period_id: $.data.current_period_id }
          assert:
            - "BillingPeriod.${period_id}.status == \"CLOSED\" after finalize"
            - "ClientAccount.${acct_id}.current_period_id != \"${period_id}\" (repointed to a new period)"
            - "the new BillingPeriod (current_period_id) has period_index == 1 and status == \"OPEN\""

      # ---- guarded: go-online requires an ACTIVE availability window
      - name: go_online_without_window_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Receptionist.status.OFFLINE_to_AVAILABLE
          - errors[ERR_NO_AVAILABILITY_WINDOW]
        distinguishing_aspect: "A receptionist with no ACTIVE AvailabilityWindow calling go-online -> ERR_NO_AVAILABILITY_WINDOW (409); stays OFFLINE."
        test_recipe:
          setup:
            - "One receptionist, OFFLINE, with zero availability windows."
          setup_api_calls:
