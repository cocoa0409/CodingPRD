# =============================================================================
# 1.9 Scaffold Corner Design (breadth coverage of testable claims not in §1.8)
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: customer_create_returns_all_fields
        claim_type: Creation
        grounds: [entities.Customer.fields.club_tier, endpoints]
        distinguishing_aspect: "POST /dsp/customers with all inputs returns 201 with name/email/state_code/club_tier/age_verified and system id/created_at."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /dsp/customers", payload: { name: "Ada Buyer", email: "ada@x.com", state_code: "CA", club_tier: "GOLD", age_verified: true }, as: SalesManager, captures: { cid: $.data.id } }
          assert:
            - "response code 201; Customer.${cid}.club_tier == GOLD; Customer.${cid}.age_verified == true; Customer.${cid}.id is a server-minted UUID"

      - name: barrel_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Barrel, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /dsp/barrels/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /dsp/barrels/00000000-0000-4000-8000-000000000000", payload: {}, as: ProductionManager, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_NOT_FOUND; HTTP 404"]

      - name: distillery_create_missing_state_code_returns_validation
        claim_type: Required Fields
        grounds: [entities.Distillery.fields.state_code, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /dsp/distilleries omitting the required state_code returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /dsp/distilleries", payload: { name: "Bench DSP", dsp_permit_number: "DSP-X" }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_VALIDATION; HTTP 422"]

      - name: customer_create_invalid_enum_club_tier_rejected
        claim_type: Type Constraints
        grounds: [entities.Customer.fields.club_tier, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /dsp/customers with club_tier not in {NONE,SILVER,GOLD,RESERVE} returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /dsp/customers", payload: { name: "Ada", email: "ada2@x.com", state_code: "CA", club_tier: "PLATINUM" }, as: SalesManager, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_VALIDATION; HTTP 422"]

      - name: customer_club_tier_defaults_none
        claim_type: Defaults
        grounds: [entities.Customer.fields.club_tier, entities.Customer.fields.age_verified]
        distinguishing_aspect: "Omitting club_tier and age_verified applies defaults NONE and false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /dsp/customers", payload: { name: "Bo", email: "bo@x.com", state_code: "NY" }, as: TastingRoomStaff, captures: { cid: $.data.id } }
          assert: ["Customer.${cid}.club_tier == NONE", "Customer.${cid}.age_verified == false"]

      - name: barrel_angel_share_computed_after_6_months
        claim_type: Computed Fields
        grounds: [calculations.angel_share_loss, entities.Barrel.fields.angel_share_pg, entities.Barrel.fields.current_proof_gallons]
        distinguishing_aspect: "A barrel filled to 100.0 pg on 2026-05-01, read at 2026-11-01 (6 months), shows angel_share_pg 2.5 and current_proof_gallons 97.5."
        test_recipe:
          setup: ["GAUGED 100.0-pg run; one barrel filled to 100.0 at the default clock; clock advanced 6 months."]
          setup_api_calls:
            - { call: "POST /dsp/distilleries", payload: { name: "Bench DSP", dsp_permit_number: "DSP-CB-1", state_code: "CA" }, as: ComplianceOfficer, captures: { dist_id: $.data.id } }
            - { call: "POST /dsp/mash-batches", payload: { distillery_id: "${dist_id}", grain_bill: "corn", volume_gallons: 200 }, as: ProductionManager, captures: { mb: $.data.id } }
            - { call: "POST /dsp/distillation-runs", payload: { distillery_id: "${dist_id}", mash_batch_id: "${mb}", spirit_type: "WHISKEY", gauge_method: "VOLUME", collected_wine_gallons: 100, collected_proof: 100 }, as: ProductionManager, captures: { run: $.data.id } }
            - { call: "POST /dsp/distillation-runs/${run}/gauge", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/barrels", payload: { distillation_run_id: "${run}", char_level: "CHAR_2", rickhouse_position: "B-3", fill_proof_gallons: 100 }, as: ProductionManager, captures: { barrel: $.data.id } }
            - { call: "POST /dsp/_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: ProductionManager }
          trigger:
            - { call: "GET /dsp/barrels/${barrel}", payload: {}, as: ProductionManager, captures: { asp: $.data.angel_share_pg, cur: $.data.current_proof_gallons } }
          assert: ["Barrel.${barrel}.angel_share_pg == 2.5", "Barrel.${barrel}.current_proof_gallons == 97.5"]

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: gauge_twice_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.DistillationRun.DISTILLING_to_GAUGED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Gauging an already-GAUGED run returns ERR_INVALID_STATE (409); no ledger change."
        test_recipe:
          setup: ["A GAUGED run."]
          setup_api_calls:
            - { call: "POST /dsp/distilleries", payload: { name: "Bench DSP", dsp_permit_number: "DSP-CB-2", state_code: "CA" }, as: ComplianceOfficer, captures: { dist_id: $.data.id } }
            - { call: "POST /dsp/mash-batches", payload: { distillery_id: "${dist_id}", grain_bill: "corn", volume_gallons: 200 }, as: ProductionManager, captures: { mb: $.data.id } }
            - { call: "POST /dsp/distillation-runs", payload: { distillery_id: "${dist_id}", mash_batch_id: "${mb}", spirit_type: "WHISKEY", gauge_method: "VOLUME", collected_wine_gallons: 20, collected_proof: 100 }, as: ProductionManager, captures: { run: $.data.id } }
            - { call: "POST /dsp/distillation-runs/${run}/gauge", payload: {}, as: ProductionManager }
          trigger:
            - { call: "POST /dsp/distillation-runs/${run}/gauge", payload: {}, as: ProductionManager, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_STATE; HTTP 409"]

      - name: label_decide_before_submit_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.LabelApplication.SUBMITTED_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Deciding a DRAFT label (never submitted) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DRAFT label application."]
          setup_api_calls:
            - { call: "POST /dsp/distilleries", payload: { name: "Bench DSP", dsp_permit_number: "DSP-CB-3", state_code: "CA" }, as: ComplianceOfficer, captures: { dist_id: $.data.id } }
            - { call: "POST /dsp/label-applications", payload: { distillery_id: "${dist_id}", brand_name: "Old Bench", spirit_type: "WHISKEY", label_proof: 100, net_contents_ml: 750 }, as: ComplianceOfficer, captures: { label: $.data.id } }
          trigger:
            - { call: "POST /dsp/label-applications/${label}/decide", payload: { outcome: "APPROVE" }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_STATE; HTTP 409"]

      - name: sales_order_ship_before_pay_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.SalesOrder."fulfillment=ALLOCATED_to_fulfillment=SHIPPED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Shipping a PENDING (never ALLOCATED) order returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A COMPLETED 5-case run; a PENDING THREE_TIER order for 1 case."]
          setup_api_calls:
            - { call: "POST /dsp/distilleries", payload: { name: "Bench DSP", dsp_permit_number: "DSP-CB-4", state_code: "CA" }, as: ComplianceOfficer, captures: { dist_id: $.data.id } }
            - { call: "POST /dsp/mash-batches", payload: { distillery_id: "${dist_id}", grain_bill: "corn", volume_gallons: 200 }, as: ProductionManager, captures: { mb: $.data.id } }
            - { call: "POST /dsp/distillation-runs", payload: { distillery_id: "${dist_id}", mash_batch_id: "${mb}", spirit_type: "WHISKEY", gauge_method: "VOLUME", collected_wine_gallons: 20, collected_proof: 100 }, as: ProductionManager, captures: { run: $.data.id } }
            - { call: "POST /dsp/distillation-runs/${run}/gauge", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/barrels", payload: { distillation_run_id: "${run}", char_level: "CHAR_3", rickhouse_position: "A-1", fill_proof_gallons: 10 }, as: ProductionManager, captures: { barrel: $.data.id } }
            - { call: "POST /dsp/label-applications", payload: { distillery_id: "${dist_id}", brand_name: "Old Bench", spirit_type: "WHISKEY", label_proof: 100, net_contents_ml: 750 }, as: ComplianceOfficer, captures: { label: $.data.id } }
            - { call: "POST /dsp/label-applications/${label}/submit", payload: {}, as: ComplianceOfficer }
            - { call: "POST /dsp/label-applications/${label}/decide", payload: { outcome: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /dsp/bottling-runs", payload: { barrel_id: "${barrel}", label_application_id: "${label}", line_id: "LINE_A", scheduled_start: "2026-05-02T08:00:00Z", scheduled_end: "2026-05-02T12:00:00Z", bottle_size_ml: 750, bottles_per_case: 6, planned_cases: 5 }, as: ProductionManager, captures: { br: $.data.id } }
            - { call: "POST /dsp/bottling-runs/${br}/start", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/bottling-runs/${br}/complete", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/customers", payload: { name: "Ada", email: "ada4@x.com", state_code: "CA", age_verified: true }, as: SalesManager, captures: { cust: $.data.id } }
            - { call: "POST /dsp/sales-orders", payload: { customer_id: "${cust}", bottling_run_id: "${br}", channel: "THREE_TIER", cases: 1, unit_price_cents: 5000 }, as: SalesManager, captures: { order: $.data.id } }
          trigger:
            - { call: "POST /dsp/sales-orders/${order}/ship", payload: {}, as: SalesManager, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_STATE; HTTP 409"]

      - name: barrel_dump_twice_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Barrel.AGING_to_DESTROYED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Dumping an already-DESTROYED barrel returns ERR_INVALID_STATE (409); DESTROYED is terminal."
        test_recipe:
          setup: ["A DESTROYED barrel."]
          setup_api_calls:
            - { call: "POST /dsp/distilleries", payload: { name: "Bench DSP", dsp_permit_number: "DSP-CB-5", state_code: "CA" }, as: ComplianceOfficer, captures: { dist_id: $.data.id } }
            - { call: "POST /dsp/mash-batches", payload: { distillery_id: "${dist_id}", grain_bill: "corn", volume_gallons: 200 }, as: ProductionManager, captures: { mb: $.data.id } }
            - { call: "POST /dsp/distillation-runs", payload: { distillery_id: "${dist_id}", mash_batch_id: "${mb}", spirit_type: "WHISKEY", gauge_method: "VOLUME", collected_wine_gallons: 20, collected_proof: 100 }, as: ProductionManager, captures: { run: $.data.id } }
            - { call: "POST /dsp/distillation-runs/${run}/gauge", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/barrels", payload: { distillation_run_id: "${run}", char_level: "CHAR_3", rickhouse_position: "A-1", fill_proof_gallons: 10 }, as: ProductionManager, captures: { barrel: $.data.id } }
            - { call: "POST /dsp/barrels/${barrel}/dump", payload: {}, as: ProductionManager }
          trigger:
            - { call: "POST /dsp/barrels/${barrel}/dump", payload: {}, as: ProductionManager, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_STATE; HTTP 409"]

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: order_pricing_cocktail_surcharge_applied
        claim_type: Correct Result
        grounds: [calculations.order_pricing, entities.SalesOrder.fields.total_cents]
        distinguishing_aspect: "unit_price_cents 5000 x 4 cases = 20000 subtotal; includes_cocktail adds 1200 -> total_cents 21200."
        test_recipe:
          setup: ["A COMPLETED 10-case run and an age-verified customer."]
          setup_api_calls:
            - { call: "POST /dsp/distilleries", payload: { name: "Bench DSP", dsp_permit_number: "DSP-CB-6", state_code: "CA" }, as: ComplianceOfficer, captures: { dist_id: $.data.id } }
            - { call: "POST /dsp/mash-batches", payload: { distillery_id: "${dist_id}", grain_bill: "corn", volume_gallons: 200 }, as: ProductionManager, captures: { mb: $.data.id } }
            - { call: "POST /dsp/distillation-runs", payload: { distillery_id: "${dist_id}", mash_batch_id: "${mb}", spirit_type: "WHISKEY", gauge_method: "VOLUME", collected_wine_gallons: 20, collected_proof: 100 }, as: ProductionManager, captures: { run: $.data.id } }
            - { call: "POST /dsp/distillation-runs/${run}/gauge", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/barrels", payload: { distillation_run_id: "${run}", char_level: "CHAR_3", rickhouse_position: "A-1", fill_proof_gallons: 15 }, as: ProductionManager, captures: { barrel: $.data.id } }
            - { call: "POST /dsp/label-applications", payload: { distillery_id: "${dist_id}", brand_name: "Old Bench", spirit_type: "WHISKEY", label_proof: 100, net_contents_ml: 750 }, as: ComplianceOfficer, captures: { label: $.data.id } }
            - { call: "POST /dsp/label-applications/${label}/submit", payload: {}, as: ComplianceOfficer }
            - { call: "POST /dsp/label-applications/${label}/decide", payload: { outcome: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /dsp/bottling-runs", payload: { barrel_id: "${barrel}", label_application_id: "${label}", line_id: "LINE_A", scheduled_start: "2026-05-02T08:00:00Z", scheduled_end: "2026-05-02T12:00:00Z", bottle_size_ml: 750, bottles_per_case: 6, planned_cases: 10 }, as: ProductionManager, captures: { br: $.data.id } }
            - { call: "POST /dsp/bottling-runs/${br}/start", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/bottling-runs/${br}/complete", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/customers", payload: { name: "Ada", email: "ada6@x.com", state_code: "CA", age_verified: true }, as: TastingRoomStaff, captures: { cust: $.data.id } }
          trigger:
            - { call: "POST /dsp/sales-orders", payload: { customer_id: "${cust}", bottling_run_id: "${br}", channel: "TASTING_ROOM", cases: 4, unit_price_cents: 5000, includes_cocktail: true }, as: TastingRoomStaff, captures: { order: $.data.id, tot: $.data.total_cents } }
          assert: ["SalesOrder.${order}.subtotal_cents == 20000", "SalesOrder.${order}.total_cents == 21200"]

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: pay_without_age_verification_returns_forbidden
        claim_type: Violation to Error
        grounds: ["validations[priority=10]", "errors[ERR_AGE_NOT_VERIFIED]"]
        distinguishing_aspect: "Paying with a customer whose age_verified is false returns ERR_AGE_NOT_VERIFIED (403)."
        test_recipe:
          setup: ["A COMPLETED 5-case run; a NOT-age-verified customer; a PENDING order for 1 case."]
          setup_api_calls:
            - { call: "POST /dsp/distilleries", payload: { name: "Bench DSP", dsp_permit_number: "DSP-CB-7", state_code: "CA" }, as: ComplianceOfficer, captures: { dist_id: $.data.id } }
            - { call: "POST /dsp/mash-batches", payload: { distillery_id: "${dist_id}", grain_bill: "corn", volume_gallons: 200 }, as: ProductionManager, captures: { mb: $.data.id } }
            - { call: "POST /dsp/distillation-runs", payload: { distillery_id: "${dist_id}", mash_batch_id: "${mb}", spirit_type: "WHISKEY", gauge_method: "VOLUME", collected_wine_gallons: 20, collected_proof: 100 }, as: ProductionManager, captures: { run: $.data.id } }
            - { call: "POST /dsp/distillation-runs/${run}/gauge", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/barrels", payload: { distillation_run_id: "${run}", char_level: "CHAR_3", rickhouse_position: "A-1", fill_proof_gallons: 10 }, as: ProductionManager, captures: { barrel: $.data.id } }
            - { call: "POST /dsp/label-applications", payload: { distillery_id: "${dist_id}", brand_name: "Old Bench", spirit_type: "WHISKEY", label_proof: 100, net_contents_ml: 750 }, as: ComplianceOfficer, captures: { label: $.data.id } }
            - { call: "POST /dsp/label-applications/${label}/submit", payload: {}, as: ComplianceOfficer }
            - { call: "POST /dsp/label-applications/${label}/decide", payload: { outcome: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /dsp/bottling-runs", payload: { barrel_id: "${barrel}", label_application_id: "${label}", line_id: "LINE_A", scheduled_start: "2026-05-02T08:00:00Z", scheduled_end: "2026-05-02T12:00:00Z", bottle_size_ml: 750, bottles_per_case: 6, planned_cases: 5 }, as: ProductionManager, captures: { br: $.data.id } }
            - { call: "POST /dsp/bottling-runs/${br}/start", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/bottling-runs/${br}/complete", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/customers", payload: { name: "Minor Mo", email: "mo@x.com", state_code: "CA" }, as: SalesManager, captures: { cust: $.data.id } }
            - { call: "POST /dsp/sales-orders", payload: { customer_id: "${cust}", bottling_run_id: "${br}", channel: "THREE_TIER", cases: 1, unit_price_cents: 5000 }, as: SalesManager, captures: { order: $.data.id } }
          trigger:
            - { call: "POST /dsp/sales-orders/${order}/pay", payload: {}, as: SalesManager, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_AGE_NOT_VERIFIED; HTTP 403"]

      - name: club_order_without_release_returns_ineligible
        claim_type: Conditional validation
        grounds: ["validations[priority=11]", "errors[ERR_CLUB_NOT_ELIGIBLE]", entities.Distillery.fields.club_release_active]
        distinguishing_aspect: "Paying a CLUB order while club_release_active is false returns ERR_CLUB_NOT_ELIGIBLE (409), even for a GOLD, age-verified customer."
        test_recipe:
          setup: ["A COMPLETED 5-case run; club release NOT open; GOLD age-verified customer; PENDING CLUB order for 1 case."]
          setup_api_calls:
            - { call: "POST /dsp/distilleries", payload: { name: "Bench DSP", dsp_permit_number: "DSP-CB-8", state_code: "CA" }, as: ComplianceOfficer, captures: { dist_id: $.data.id } }
            - { call: "POST /dsp/mash-batches", payload: { distillery_id: "${dist_id}", grain_bill: "corn", volume_gallons: 200 }, as: ProductionManager, captures: { mb: $.data.id } }
            - { call: "POST /dsp/distillation-runs", payload: { distillery_id: "${dist_id}", mash_batch_id: "${mb}", spirit_type: "WHISKEY", gauge_method: "VOLUME", collected_wine_gallons: 20, collected_proof: 100 }, as: ProductionManager, captures: { run: $.data.id } }
            - { call: "POST /dsp/distillation-runs/${run}/gauge", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/barrels", payload: { distillation_run_id: "${run}", char_level: "CHAR_3", rickhouse_position: "A-1", fill_proof_gallons: 10 }, as: ProductionManager, captures: { barrel: $.data.id } }
            - { call: "POST /dsp/label-applications", payload: { distillery_id: "${dist_id}", brand_name: "Old Bench", spirit_type: "WHISKEY", label_proof: 100, net_contents_ml: 750 }, as: ComplianceOfficer, captures: { label: $.data.id } }
            - { call: "POST /dsp/label-applications/${label}/submit", payload: {}, as: ComplianceOfficer }
            - { call: "POST /dsp/label-applications/${label}/decide", payload: { outcome: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /dsp/bottling-runs", payload: { barrel_id: "${barrel}", label_application_id: "${label}", line_id: "LINE_A", scheduled_start: "2026-05-02T08:00:00Z", scheduled_end: "2026-05-02T12:00:00Z", bottle_size_ml: 750, bottles_per_case: 6, planned_cases: 5 }, as: ProductionManager, captures: { br: $.data.id } }
            - { call: "POST /dsp/bottling-runs/${br}/start", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/bottling-runs/${br}/complete", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/customers", payload: { name: "Club Cara", email: "cara@x.com", state_code: "CA", club_tier: "GOLD", age_verified: true }, as: SalesManager, captures: { cust: $.data.id } }
            - { call: "POST /dsp/sales-orders", payload: { customer_id: "${cust}", bottling_run_id: "${br}", channel: "CLUB", cases: 1, unit_price_cents: 5000 }, as: SalesManager, captures: { order: $.data.id } }
          trigger:
            - { call: "POST /dsp/sales-orders/${order}/pay", payload: {}, as: SalesManager, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_CLUB_NOT_ELIGIBLE; HTTP 409"]

      - name: pay_exceeds_inventory_returns_insufficient
        claim_type: Aggregate validation
        grounds: ["validations[priority=15]", "errors[ERR_INSUFFICIENT_INVENTORY]", entities.BottlingRun.fields.cases_available]
        distinguishing_aspect: "Paying an order whose cases (10) exceed the run's cases_available (5) returns ERR_INSUFFICIENT_INVENTORY (409)."
        test_recipe:
          setup: ["A COMPLETED 5-case run; age-verified customer; a PENDING order for 10 cases."]
          setup_api_calls:
            - { call: "POST /dsp/distilleries", payload: { name: "Bench DSP", dsp_permit_number: "DSP-CB-9", state_code: "CA" }, as: ComplianceOfficer, captures: { dist_id: $.data.id } }
            - { call: "POST /dsp/mash-batches", payload: { distillery_id: "${dist_id}", grain_bill: "corn", volume_gallons: 200 }, as: ProductionManager, captures: { mb: $.data.id } }
            - { call: "POST /dsp/distillation-runs", payload: { distillery_id: "${dist_id}", mash_batch_id: "${mb}", spirit_type: "WHISKEY", gauge_method: "VOLUME", collected_wine_gallons: 20, collected_proof: 100 }, as: ProductionManager, captures: { run: $.data.id } }
            - { call: "POST /dsp/distillation-runs/${run}/gauge", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/barrels", payload: { distillation_run_id: "${run}", char_level: "CHAR_3", rickhouse_position: "A-1", fill_proof_gallons: 10 }, as: ProductionManager, captures: { barrel: $.data.id } }
            - { call: "POST /dsp/label-applications", payload: { distillery_id: "${dist_id}", brand_name: "Old Bench", spirit_type: "WHISKEY", label_proof: 100, net_contents_ml: 750 }, as: ComplianceOfficer, captures: { label: $.data.id } }
            - { call: "POST /dsp/label-applications/${label}/submit", payload: {}, as: ComplianceOfficer }
            - { call: "POST /dsp/label-applications/${label}/decide", payload: { outcome: "APPROVE" }, as: ComplianceOfficer }
            - { call: "POST /dsp/bottling-runs", payload: { barrel_id: "${barrel}", label_application_id: "${label}", line_id: "LINE_A", scheduled_start: "2026-05-02T08:00:00Z", scheduled_end: "2026-05-02T12:00:00Z", bottle_size_ml: 750, bottles_per_case: 6, planned_cases: 5 }, as: ProductionManager, captures: { br: $.data.id } }
