  - section: errors
    instances:
      - name: error_envelope_shape_on_404
        claim_type: Violation → Error
        grounds:
          - response_envelope.error
          - errors.ERR_REPORT_NOT_FOUND
        distinguishing_aspect: "Every error body shares the fixed envelope: response_type \"error\", data.error_id, data.message, and the meta block — demonstrated on a donor-report 404."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /veteran-services/donor-reports/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: OutcomeAnalyst
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 404 and err == ERR_REPORT_NOT_FOUND"
            - "response_type == \"error\" and data carries both error_id and a non-empty message"
            - "meta.api_request_id and meta.api_request_timestamp are present on the error response"

      - name: donor_report_empty_cohort_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=14]
          - errors.ERR_EMPTY_COHORT
          - calculations.program_effect_reporting
        distinguishing_aspect: "A well-formed report request over a period with zero COMPLETED enrollments fails 422 ERR_EMPTY_COHORT rather than emitting a zero-filled report."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /veteran-services/donor-reports"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", methodology: "ITT" }
              as: OutcomeAnalyst
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 422 and err == ERR_EMPTY_COHORT"
            - "GET /veteran-services/donor-reports/... nothing was persisted (no report id was issued)"

      - name: report_track_weights_must_sum_to_one
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - entities.DonorReport.fields.track_weights
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Custom track weights summing to 0.9 are malformed input (400), caught at request-shape priority before any cohort math."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /veteran-services/donor-reports"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", methodology: "ITT", track_weights: { MENTAL_HEALTH: 0.5, CAREER: 0.4 } }
              as: OutcomeAnalyst
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 400 and err == ERR_INVALID_REQUEST"
            - "err != ERR_EMPTY_COHORT (request shape is checked before the cohort aggregate)"

  - section: rbac
    instances:
      - name: program_member_cannot_create_program_track
        claim_type: RBAC denial
        grounds:
          - roles.ProgramMember
          - endpoints.POST_/veteran-services/program-tracks
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "ProgramMember is absent from the endpoint's role list: an entity-backed member identity is rejected 403 ERR_FORBIDDEN_ROLE even for a well-formed body."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. One member exists."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/members"
              payload: { full_name: "Role Vet", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { m_id: "$.data.id" }
          trigger:
            - call: "POST /veteran-services/program-tracks"
              payload: { track_code: "CAREER", name: "Nope Track", capacity: 5 }
              as: ProgramMember
              as_user_id: "${m_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 403 and err == ERR_FORBIDDEN_ROLE"
            - "GET /veteran-services/program-tracks returns 0 rows"

      - name: program_member_reading_other_member_forbidden
        claim_type: RBAC denial
        grounds:
          - roles.ProgramMember
          - validations[priority=5]
          - errors.ERR_RESOURCE_NOT_OWNED
        distinguishing_aspect: "ProgramMember passes the role check on GET /members/{id} but the ownership check pins X-User-ID == the path member: reading another member's record is 403 ERR_RESOURCE_NOT_OWNED, while reading one's own succeeds."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Members m1 and m2 exist."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/members"
              payload: { full_name: "Self One", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { m1: "$.data.id" }
            - call: "POST /veteran-services/members"
              payload: { full_name: "Other Two", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "NAVY" }
              as: IntakeCoordinator
              captures: { m2: "$.data.id" }
          trigger:
            - call: "GET /veteran-services/members/${m2}"
              payload: {}
              as: ProgramMember
              as_user_id: "${m1}"
              captures: { err: "$.data.error_id" }
            - call: "GET /veteran-services/members/${m1}"
              payload: {}
              as: ProgramMember
              as_user_id: "${m1}"
              captures: { ok_name: "$.data.full_name" }
          assert:
            - "err == ERR_RESOURCE_NOT_OWNED with status 403 (not 404 — the resource exists)"
            - "ok_name == \"Self One\" (self-read succeeds with 200)"

      - name: clinical_partner_cannot_discharge_other_sites_referral
        claim_type: RBAC denial
        grounds:
          - roles.ClinicalPartner
          - validations[priority=5]
          - errors.ERR_RESOURCE_NOT_OWNED
        distinguishing_aspect: "ClinicalPartner identity is the PartnerSite id: discharging a referral matched to a different site is 403 ERR_RESOURCE_NOT_OWNED, and the referral stays IN_TREATMENT."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Site S1 (SE, PTSD, capacity 4) hosts an IN_TREATMENT referral; site S2 (NW, PTSD) also exists."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/partner-sites"
              payload: { name: "Home IOP", region: "SE", specialties: ["PTSD"], capacity: 4 }
              as: PlatformAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /veteran-services/partner-sites"
              payload: { name: "Far IOP", region: "NW", specialties: ["PTSD"], capacity: 4 }
              as: PlatformAdmin
              captures: { s2: "$.data.id" }
            - call: "POST /veteran-services/program-tracks"
              payload: { track_code: "MENTAL_HEALTH", name: "Mental Health Track", capacity: 10 }
              as: PlatformAdmin
              captures: { trk: "$.data.id" }
            - call: "POST /veteran-services/members"
              payload: { full_name: "Owned Vet", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { m_id: "$.data.id", m_v: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${m_id}", expected_member_version: "${m_v}" }
              as: IntakeCoordinator
              captures: { case_id: "$.data.id" }
            - call: "POST /veteran-services/eligibility-cases/${case_id}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "SERVICE_CONNECTED" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/enrollments"
              payload: { member_id: "${m_id}", program_track_id: "${trk}" }
              as: IntakeCoordinator
              captures: { e_id: "$.data.id" }
            - call: "POST /veteran-services/enrollments/${e_id}/assessments"
              payload: { psych_score: 10, phys_score: 10, voc_score: 10, soc_score: 10 }
              as: IntakeCoordinator
            - call: "GET /veteran-services/members/${m_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { m_v2: "$.data.version" }
            - call: "POST /veteran-services/referrals"
              payload: { member_id: "${m_id}", region: "SE", required_specialty: "PTSD", treatment_start: "2026-10-01T00:00:00Z", treatment_end: "2026-11-01T00:00:00Z", expected_member_version: "${m_v2}" }
              as: IntakeCoordinator
              captures: { ref: "$.data.id", ref_site: "$.data.partner_site_id" }
            - call: "POST /veteran-services/referrals/${ref}/transition"
              payload: { action: "ADMIT" }
              as: ClinicalPartner
              as_user_id: "${s1}"
          trigger:
            - call: "POST /veteran-services/referrals/${ref}/transition"
              payload: { action: "DISCHARGE" }
              as: ClinicalPartner
              as_user_id: "${s2}"
              captures: { err: "$.data.error_id" }
          assert:
            - "ref_site == ${s1} (the SE referral matched the SE site)"
            - "err == ERR_RESOURCE_NOT_OWNED with status 403"
            - "GET /veteran-services/referrals/${ref} still shows status IN_TREATMENT"

      - name: appeal_decide_by_same_officer_rejected
        claim_type: RBAC denial
        grounds:
          - validations[priority=8]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - roles.BenefitsOfficer
        distinguishing_aspect: "Segregation of duties inside one role: the officer who issued the standing decision cannot decide the appeal (403 ERR_SEGREGATION_OF_DUTIES); a different officer can, and an UPHELD outcome leaves the rating untouched."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. VERIFIED veteran; claim decided GRANTED at rating 40 by officer-a (final 77388); appeal OPEN."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/members"
              payload: { full_name: "Segregation Vet", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { m_id: "$.data.id", m_v: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${m_id}", expected_member_version: "${m_v}" }
              as: IntakeCoordinator
              captures: { case_id: "$.data.id" }
            - call: "POST /veteran-services/eligibility-cases/${case_id}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "SERVICE_CONNECTED" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/claims"
              payload: { member_id: "${m_id}", claim_type: "DISABILITY_COMPENSATION", claimed_rating_pct: 40, dependent_count: 0 }
              as: AccreditedRepresentative
              captures: { claim_id: "$.data.id" }
            - call: "POST /veteran-services/claims/${claim_id}/decide"
              payload: { outcome: "GRANTED", decided_rating_pct: 40 }
              as: BenefitsOfficer
              as_user_id: "officer-a"
            - call: "POST /veteran-services/appeals"
              payload: { claim_id: "${claim_id}", grounds: "rating too low" }
              as: AccreditedRepresentative
              captures: { ap: "$.data.id" }
          trigger:
            - call: "POST /veteran-services/appeals/${ap}/decide"
              payload: { outcome: "UPHELD" }
              as: BenefitsOfficer
              as_user_id: "officer-a"
              captures: { err: "$.data.error_id" }
            - call: "POST /veteran-services/appeals/${ap}/decide"
              payload: { outcome: "UPHELD" }
              as: BenefitsOfficer
              as_user_id: "officer-b"
              captures: { ap_status: "$.data.status" }
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES with status 403 — officer-a decided the claim"
            - "the rejected attempt left Appeal.${ap} OPEN"
            - "officer-b's retry succeeds: ap_status == DECIDED"
            - "GET /veteran-services/claims/${claim_id} shows status DECIDED, decided_rating_pct == 40, final_monthly_cents == 77388 (unchanged by UPHELD)"

      - name: unknown_role_header_returns_unauthenticated
        claim_type: RBAC denial
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "An X-User-Role value that names no declared role is an authentication failure (401 ERR_UNAUTHENTICATED), not a 403 — role existence is checked before role authorization."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /veteran-services/program-tracks"
              payload: { track_code: "CAREER", name: "Ghost Track", capacity: 5 }
              as: SuperUser
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 401 and err == ERR_UNAUTHENTICATED"

  - section: cross_cutting_layers
    instances:
      - name: occ_eligibility_case_stale_member_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[eligibility-case-supersede-stale-member]
          - errors.ERR_STALE_VERSION
          - state_machines.EligibilityCase.UNDER_REVIEW_to_SUPERSEDED
        distinguishing_aspect: "Two strictly sequential case creations: the second (fresh version) legitimately supersedes the first; a third carrying the now-stale version is rejected 412 ERR_STALE_VERSION — the supersede path is legal, the stale view is not."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. One member at version 1."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/members"
              payload: { full_name: "Occ Vet", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { m_id: "$.data.id", m_v: "$.data.version" }
          trigger:
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${m_id}", expected_member_version: "${m_v}" }
              as: IntakeCoordinator
              captures: { c1: "$.data.id" }
            - call: "GET /veteran-services/members/${m_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { m_v2: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${m_id}", expected_member_version: "${m_v2}" }
              as: IntakeCoordinator
              captures: { c2: "$.data.id" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${m_id}", expected_member_version: "${m_v2}" }
              as: IntakeCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "the first create returns 201 (member version was 1)"
            - "the second create returns 201 and EligibilityCase.${c1} is now SUPERSEDED (legal supersede with the fresh version 2)"
            - "err == ERR_STALE_VERSION with status 412 on the third create (version 2 was consumed)"
            - "GET /veteran-services/members/${m_id} shows version == 3"
            - "GET /veteran-services/members/${m_id}/eligibility-cases returns exactly 2 rows (SUPERSEDED c1 and UNDER_REVIEW c2)"

      - name: occ_referral_stale_member_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[referral-create-stale-member]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "A referral create carrying the member's pre-verification version is rejected 412 even though every business precondition (verified, INTENSIVE tier, no overlap) would otherwise pass — OCC at priority 6 fires before them."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. VERIFIED veteran with an INTENSIVE MENTAL_HEALTH enrollment; member version has advanced well past the creation version."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/program-tracks"
              payload: { track_code: "MENTAL_HEALTH", name: "Mental Health Track", capacity: 10 }
              as: PlatformAdmin
              captures: { trk: "$.data.id" }
            - call: "POST /veteran-services/members"
              payload: { full_name: "Stale Vet", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { m_id: "$.data.id", m_v_stale: "$.data.version" }
            - call: "POST /veteran-services/eligibility-cases"
              payload: { member_id: "${m_id}", expected_member_version: "${m_v_stale}" }
              as: IntakeCoordinator
              captures: { case_id: "$.data.id" }
            - call: "POST /veteran-services/eligibility-cases/${case_id}/transition"
              payload: { target_status: "VERIFIED", verified_service_era: "POST_911", verified_injury_connection: "SERVICE_CONNECTED" }
              as: IntakeCoordinator
            - call: "POST /veteran-services/enrollments"
              payload: { member_id: "${m_id}", program_track_id: "${trk}" }
              as: IntakeCoordinator
              captures: { e_id: "$.data.id" }
            - call: "POST /veteran-services/enrollments/${e_id}/assessments"
              payload: { psych_score: 10, phys_score: 10, voc_score: 10, soc_score: 10 }
              as: IntakeCoordinator
            - call: "GET /veteran-services/members/${m_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { m_v_fresh: "$.data.version" }
            - call: "POST /veteran-services/referrals"
              payload: { member_id: "${m_id}", region: "SE", required_specialty: "PTSD", treatment_start: "2026-10-01T00:00:00Z", treatment_end: "2026-11-10T00:00:00Z", expected_member_version: "${m_v_fresh}" }
              as: IntakeCoordinator
              captures: { ref1: "$.data.id" }
          trigger:
            - call: "POST /veteran-services/referrals"
              payload: { member_id: "${m_id}", region: "SE", required_specialty: "PTSD", treatment_start: "2026-11-18T00:00:00Z", treatment_end: "2026-12-01T00:00:00Z", expected_member_version: "${m_v_stale}" }
              as: IntakeCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_STALE_VERSION with status 412"
            - "GET /veteran-services/referrals?member_id=${m_id} returns exactly 1 row (the stale write did not supersede ref1)"
            - "Referral.${ref1}.status is still PENDING_MATCH"

      - name: reassessment_replaces_tier_in_place
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.acuity_scoring
          - entities.Enrollment.fields.intensity_tier
          - state_machines.Enrollment.INTAKE_to_ACTIVE
        distinguishing_aspect: "A second assessment on an ACTIVE enrollment recomputes the derived tier in place (ENHANCED 61 -> INTENSIVE 100) WITHOUT a state change; the enrollment stays ACTIVE and its version increments once per reassessment."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. VERIFIED veteran; enrollment ACTIVE at tier ENHANCED after a first assessment (9,3,5,6 -> 61)."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/program-tracks"
              payload: { track_code: "MENTAL_HEALTH", name: "Mental Health Track", capacity: 10 }
              as: PlatformAdmin
