            - "the fifth trigger call returns 200 and ManureStorage.${st_id}.current_volume_gallons == 100000.00 with days_of_storage_available == 474"
      - name: storage_intake_syncs_volume_capacity_and_days_of_storage
        claim_type: ledger_sync
        grounds:
          - endpoints.POST /cafo/manure-storages/{id}/intake
          - calculations.storage_capacity_and_freeboard
          - calculations.storage_days_of_capacity
          - entities.ManureStorage.fields.days_of_storage_available
        distinguishing_aspect: |
          Two successive intakes must keep three derived fields in lockstep — current volume,
          available capacity and days_of_storage_available (377 then 323) — while the
          DESIGN_BASIS aggregate Operation.design_storage_days stays pinned at 485 because it
          ignores contents entirely.
        test_recipe:
          setup:
            - "One Willow Creek Dairy operation with one empty EARTHEN_LAGOON of operating capacity 4488300.00"
            - "Logical clock at 2026-08-01T00:00:00Z, so the seasonal factor is 1.0"
