            - "boundary semantics differ by edge: the dispute window is inclusive at its open edge, the lockout is closed and releases exactly at its far edge"

      - name: held_release_routing_falls_outside_a_closed_period
        grounds:
          - calculations.adjusted_net_balance
          - calculations.royalty_share_split
          - validations[priority=11]
        distinguishing_aspect: "The payout period is a half-open routed-set window: a routing dated exactly 2026-10-01T00:00:00Z belongs to the NEXT period, so the period [2026-09-01, 2026-10-01) computes an adjusted net of 0 and the release is rejected on the threshold — a window-edge geometric rule distinct from the dispute-window edge."
        test_recipe:
          setup:
            - "Logical clock 2026-10-01T00:00:00Z. Channel US approved, one AD routing of 10000 created at exactly 2026-10-01T00:00:00Z, and a payout batch assembled over the half-open period [2026-09-01, 2026-10-01)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
