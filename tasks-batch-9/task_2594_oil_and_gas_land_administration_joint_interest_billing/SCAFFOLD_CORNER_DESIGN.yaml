      - name: setting_the_clock_backwards_is_rejected
        claim_type: triggerability
        grounds:
          - "validations[priority=60, error_id=ERR_CLOCK_MOVED_BACKWARD]"
          - errors.ERR_CLOCK_MOVED_BACKWARD
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: |
          The logical clock is monotonic: re-setting it to 2026-07-09 after it reached 2026-07-10
          returns ERR_CLOCK_MOVED_BACKWARD (422) and leaves the clock at 2026-07-10, while setting it
          to the same value it already holds is accepted.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-09T00:00:00Z" }
              as: LandAdministrator
          assert:
            - "HTTP 422 with error_id ERR_CLOCK_MOVED_BACKWARD"
            - "a following POST /_clock/set_current_utc with 2026-07-10T00:00:00Z succeeds, proving the clock never moved"
            - "a following POST /_clock/set_current_utc with 2026-07-11T00:00:00Z succeeds"

