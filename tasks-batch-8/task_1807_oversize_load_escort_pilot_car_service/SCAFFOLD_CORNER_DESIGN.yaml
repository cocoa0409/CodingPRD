# =============================================================================
# §1.9: Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1807: Oversize Load Escort & Pilot Car Service
# Breadth enumeration of every §1.1–§1.7 testable claim not already covered
# by §1.8. Sections follow the claim-extraction-guide taxonomy.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: carrier_creation_defaults
        claim_type: creation
        grounds: [entities.Carrier]
        distinguishing_aspect: "A created Carrier starts with computed fields at their initial values and common fields populated."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Defaults Co", credit_limit_cents: 500000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
          trigger:
            - { call: "GET /carriers/${carrier_id}", payload: {}, as: Dispatcher }
          assert:
            - "Carrier.${carrier_id}.ytd_billed_cents == 0 and credit_available_cents == 500000 (== credit_limit_cents)"
            - "version == 1; id is a server-minted UUID; created_at == updated_at with three fractional digits"

      - name: escort_creation_defaults
        claim_type: defaults
        grounds: [entities.Escort]
        distinguishing_aspect: "Omitted optional equipment fields take their defaults; computed reliability and count initialize."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /escorts", payload: { operator_name: "Plain Rider", certified_state_codes: ["TX", "OK"] }, as: Dispatcher, captures: { esc_id: $.data.id } }
          trigger:
            - { call: "GET /escorts", payload: {}, as: Dispatcher }
          assert:
            - "Escort.${esc_id}: has_height_pole == false, height_pole_max_inches == 0 (defaults applied)"
            - "reliability_score == 100, escort_status == ACTIVE, active_assignment_count == 0, version == 1"

      - name: job_creation_creates_legs
        claim_type: creation
        grounds: [entities.Job, entities.RouteLeg]
        distinguishing_aspect: "Job creation materializes one PENDING RouteLeg per legs[] element, returned in sequence_index order."
        test_recipe:
          setup: ["Carrier exists"]
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Two Leg Co", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "Two-state run", width_inches: 170, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T15:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 }, { state_code: "OK", sequence_index: 1, distance_miles: 100, planned_entry_at: "2026-08-10T13:30:00Z", planned_exit_at: "2026-08-10T15:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_id: $.data.id } }
          trigger:
            - { call: "GET /jobs/${job_id}/legs", payload: {}, as: Dispatcher }
          assert:
            - "Job.${job_id}.job_status == DRAFT and version == 1 (initial state)"
            - "GET legs returns 2 rows ordered by sequence_index ASC: data[0].state_code == TX, data[1].state_code == OK, both leg_status == PENDING"
            - "Both legs carry requirement defaults: required_front_escorts == 0, clearance_verdict == UNKNOWN, police_confirmed == false"

      - name: computed_and_system_fields_input_ignored
        claim_type: computed_fields
        grounds: [entities.Carrier.fields.ytd_billed_cents, entities.Carrier.fields.credit_available_cents]
        distinguishing_aspect: "Client-supplied computed/system fields in a create body are ignored, never honored."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /carriers", payload: { carrier_name: "Sneaky Co", credit_limit_cents: 500000, ytd_billed_cents: 999, credit_available_cents: 1, version: 42 }, as: Dispatcher, captures: { carrier_id: $.data.id, err: $.data.error_id } }
          assert:
            - "201 created; Carrier.${carrier_id}.ytd_billed_cents == 0 (input 999 ignored), credit_available_cents == 500000 (input 1 ignored), version == 1 (input 42 ignored)"

      - name: obstruction_rows_append_only
        claim_type: immutability
        grounds: [entities.Obstruction, state_machines.RouteSurvey.REQUESTED_to_SUBMITTED]
        distinguishing_aspect: "Obstructions are created only via survey submit, are returned verbatim, and have no update or delete endpoint (common_fields: false — no version/updated_at semantics)."
        test_recipe:
          setup:
            - "Booked TX job width 170 / height 170 (survey required); survey REQUESTED"
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Obstruction Co", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "Tall tank", width_inches: 170, height_inches: 170, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_id: $.data.id } }
            - { call: "GET /jobs/${job_id}/legs", payload: {}, as: Dispatcher, captures: { leg_id: "$.data[0].id" } }
            - { call: "POST /jobs/${job_id}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
            - { call: "POST /legs/${leg_id}/route-surveys", payload: {}, as: RouteSurveyor, captures: { survey_id: $.data.id } }
          trigger:
            - { call: "POST /route-surveys/${survey_id}/submit", payload: { surveyed_min_clearance_inches: 175, obstructions: [ { milepost: 12.5, obstruction_type: "BRIDGE", measured_clearance_inches: 175, disposition: "REQUIRES_REROUTE" }, { milepost: 20.0, obstruction_type: "WIRE", measured_clearance_inches: 190, disposition: "PASSABLE_WITH_POLE" } ] }, as: RouteSurveyor }
            - { call: "GET /route-surveys/${survey_id}/obstructions", payload: {}, as: Dispatcher }
          assert:
            - "GET obstructions returns 2 rows in created_at ASC order: [0] milepost 12.5 / BRIDGE / 175 / REQUIRES_REROUTE; [1] milepost 20.0 / WIRE / 190 / PASSABLE_WITH_POLE"
            - "RouteSurvey.${survey_id}.survey_status == SUBMITTED and surveyed_min_clearance_inches == 175"
            - "RouteLeg.${leg_id}.survey_min_clearance_inches == 175 (provisional) while clearance_verdict remains UNKNOWN until accept"

      - name: invalid_enum_value_rejected
        claim_type: type_constraints
        grounds: [entities.EscortAssignment.fields.position, "errors[ERR_INVALID_ENUM_VALUE]"]
        distinguishing_aspect: "An out-of-membership enum value is rejected at request-shape priority before any state or business check."
        test_recipe:
          setup: ["Booked TX job with a DETERMINED leg"]
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Enum Co", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "Enum job", width_inches: 170, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_id: $.data.id } }
            - { call: "GET /jobs/${job_id}/legs", payload: {}, as: Dispatcher, captures: { leg_id: "$.data[0].id" } }
            - { call: "POST /jobs/${job_id}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
          trigger:
            - { call: "POST /legs/${leg_id}/assignments", payload: { position: "MIDDLE" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "http 400 with data.error_id == ERR_INVALID_ENUM_VALUE (or ERR_INVALID_REQUEST per the shared priority-3 row); no assignment created (GET /legs/${leg_id}/assignments is empty)"

      - name: window_and_dimension_range_rejected
        claim_type: type_constraints
        grounds: [entities.Job.fields.window_end_at, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Range validation: window_end_at <= window_start_at and non-positive dimensions are 400s at creation."
        test_recipe:
          setup: ["Carrier exists"]
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Range Co", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
          trigger:
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "Bad window", width_inches: 170, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T13:00:00Z", window_end_at: "2026-08-10T09:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { err: $.data.error_id } }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "Zero width", width_inches: 0, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { err2: $.data.error_id } }
          assert:
            - "Both calls return http 400 ERR_INVALID_REQUEST; no jobs persisted (GET /jobs?carrier_id=${carrier_id} is empty)"

      - name: unsupported_state_code_rejected
        claim_type: type_constraints
        grounds: [entities.Job.fields.legs, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A leg state_code outside the supported {TX, OK, KS, LA} table has no STATE_RULES entry and is rejected at creation."
        test_recipe:
          setup: ["Carrier exists"]
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "California Here", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
          trigger:
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "CA run", width_inches: 170, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "CA", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { err: $.data.error_id } }
          assert:
            - "http 400 ERR_INVALID_REQUEST; no job or legs persisted"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: quote_when_quoted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Job.DRAFT_to_QUOTED, "errors[ERR_JOB_INVALID_STATE]"]
        distinguishing_aspect: "quote is valid only from DRAFT; repeating it on a QUOTED job is an invalid-from rejection with no side effects (quote not regenerated)."
        test_recipe:
          setup: ["Carrier; DRAFT TX job (width 170 / height 150)"]
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Repeat Quote Co", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "Q", width_inches: 170, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_id: $.data.id } }
            - { call: "POST /jobs/${job_id}/quote", payload: {}, as: Dispatcher, captures: { job_v: $.data.version } }
          trigger:
            - { call: "POST /jobs/${job_id}/quote", payload: {}, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "http 409 ERR_JOB_INVALID_STATE; Job.${job_id}.job_status still QUOTED and version still ${job_v} (no mutation on the rejected call)"

      - name: depart_requires_scheduled
        claim_type: invalid_transition
        grounds: [state_machines.Job.SCHEDULED_to_EN_ROUTE, "errors[ERR_JOB_INVALID_STATE]"]
        distinguishing_aspect: "depart from CLEARED (permits in place but never scheduled) is rejected."
        test_recipe:
          setup: ["Zero-position TX job (width 150 / height 150) booked and CLEARED via issued permit"]
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Early Depart Co", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "D", width_inches: 150, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_id: $.data.id } }
            - { call: "GET /jobs/${job_id}/legs", payload: {}, as: Dispatcher, captures: { leg_id: "$.data[0].id" } }
            - { call: "POST /jobs/${job_id}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
            - { call: "POST /legs/${leg_id}/permits", payload: { permit_number: "TX-P-20", valid_from: "2026-08-09T00:00:00Z", valid_until: "2026-08-12T00:00:00Z" }, as: Dispatcher, captures: { permit_id: $.data.id } }
            - { call: "POST /permits/${permit_id}/issue", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /jobs/${job_id}/depart", payload: {}, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "http 409 ERR_JOB_INVALID_STATE; job remains CLEARED"

      - name: deliver_requires_en_route
        claim_type: invalid_transition
        grounds: [state_machines.Job.EN_ROUTE_to_DELIVERED, "errors[ERR_JOB_INVALID_STATE]"]
        distinguishing_aspect: "deliver is rejected from both SCHEDULED (never departed) and ON_HOLD (paused) — only EN_ROUTE is a valid from-state."
        test_recipe:
          setup: ["One-position TX job fully scheduled (width 170 / height 150, REAR accepted)"]
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Deliver Co", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /escorts", payload: { operator_name: "Rider D", certified_state_codes: ["TX"] }, as: Dispatcher, captures: { esc_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "D", width_inches: 170, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_id: $.data.id } }
            - { call: "GET /jobs/${job_id}/legs", payload: {}, as: Dispatcher, captures: { leg_id: "$.data[0].id" } }
            - { call: "POST /jobs/${job_id}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
            - { call: "POST /legs/${leg_id}/permits", payload: { permit_number: "TX-P-21", valid_from: "2026-08-09T00:00:00Z", valid_until: "2026-08-12T00:00:00Z" }, as: Dispatcher, captures: { permit_id: $.data.id } }
            - { call: "POST /permits/${permit_id}/issue", payload: {}, as: Dispatcher }
            - { call: "POST /legs/${leg_id}/assignments", payload: { position: "REAR", escort_id: "${esc_id}" }, as: Dispatcher, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: EscortOperator, as_user_id: "${esc_id}" }
            - { call: "POST /jobs/${job_id}/schedule", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /jobs/${job_id}/deliver", payload: {}, as: Dispatcher, captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/depart", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/hold", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/deliver", payload: {}, as: Dispatcher, captures: { err2: $.data.error_id } }
          assert:
            - "From SCHEDULED: http 409 ERR_JOB_INVALID_STATE"
            - "From ON_HOLD: http 409 ERR_JOB_INVALID_STATE (err2 == ERR_JOB_INVALID_STATE); job remains ON_HOLD"

      - name: resume_requires_on_hold
        claim_type: invalid_transition
        grounds: [state_machines.Job.ON_HOLD_to_EN_ROUTE, "errors[ERR_JOB_INVALID_STATE]"]
        distinguishing_aspect: "resume from EN_ROUTE (never held) is rejected — the cycle must be entered via hold."
        test_recipe:
          setup: ["EN_ROUTE one-position TX job"]
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Resume Co", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /escorts", payload: { operator_name: "Rider R", certified_state_codes: ["TX"] }, as: Dispatcher, captures: { esc_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "R", width_inches: 170, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_id: $.data.id } }
            - { call: "GET /jobs/${job_id}/legs", payload: {}, as: Dispatcher, captures: { leg_id: "$.data[0].id" } }
            - { call: "POST /jobs/${job_id}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
            - { call: "POST /legs/${leg_id}/permits", payload: { permit_number: "TX-P-22", valid_from: "2026-08-09T00:00:00Z", valid_until: "2026-08-12T00:00:00Z" }, as: Dispatcher, captures: { permit_id: $.data.id } }
            - { call: "POST /permits/${permit_id}/issue", payload: {}, as: Dispatcher }
            - { call: "POST /legs/${leg_id}/assignments", payload: { position: "REAR", escort_id: "${esc_id}" }, as: Dispatcher, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: EscortOperator, as_user_id: "${esc_id}" }
            - { call: "POST /jobs/${job_id}/schedule", payload: {}, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/depart", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /jobs/${job_id}/resume", payload: {}, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "http 409 ERR_JOB_INVALID_STATE; job remains EN_ROUTE"

      - name: cancel_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Job, "errors[ERR_JOB_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED and DELIVERED are locked against cancel: re-cancel is a no-op rejection; a delivered job can never be cancelled."
        test_recipe:
          setup: ["Job X cancelled from QUOTED; Job Y fully delivered (width 170 / height 150, REAR escort, 4h floor run)"]
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Lockdown Co", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /escorts", payload: { operator_name: "Rider L", certified_state_codes: ["TX"] }, as: Dispatcher, captures: { esc_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
