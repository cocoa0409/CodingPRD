# =============================================================================
# PRD Benchmark Scaffold — task_3213
# Live Event Touring, Talent Agreements & Event Windowing
# =============================================================================

scenario: |
  Live Event Touring, Talent Agreements & Event Windowing (WWE): performer
  contracts specifying appearance obligations, likeness rights and independent
  contractor status, touring schedule construction across arenas with television
  broadcast dates anchoring the calendar, storyline continuity across weekly
  programming and premium events with talent availability and injury handling,
  premium live event distribution across streaming partners with territory
  rights and windowing, merchandise operations at venues with per-performer
  royalty accounting, talent wellness, medical clearance and
  return-to-performance protocols, developmental roster assignment and call-up
  decisions, international tour logistics and visa processing

domain_name: live-event-touring
api_prefix: /touring

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Talent
    parent: null
    common_fields: true
    fields:
      - { name: ring_name, type: string, source: input, description: "Performer's ring name" }
      - { name: legal_name, type: string, source: input, description: "Performer's legal name" }
      - { name: contractor_status, type: enum, source: input, description: "Independent contractor declaration; constraints: INDEPENDENT_CONTRACTOR only — no other value accepted" }
      - { name: roster_tier, type: enum, source: system, description: "DEVELOPMENTAL | MAIN_ROSTER; initialized DEVELOPMENTAL, changed only by call-up action" }
      - { name: availability_status, type: enum, source: system, description: "ACTIVE | INJURED | SUSPENDED; cleared/medical transitions" }
      - { name: wellness_score, type: number, source: computed, description: "Cumulative wellness score per calc wellness_score_accrual; 0.00–100.00" }
      - name: booking_mode
        type: enum
        source: computed
        description: "BOOKABLE | LIMITED | UNBOOKABLE; derived from availability_status, wellness_score and active MedicalCase state per calc booking_mode_derivation"
      - { name: likeness_granted, type: boolean, source: system, description: "True iff the Talent has a TalentAgreement in ACTIVE state with likeness_rights_granted=true" }

  - name: TalentAgreement
    parent: null
    common_fields: true
    fields:
      - { name: talent_id, type: string, source: input, description: "FK -> Talent.id" }
      - { name: start_date, type: string, source: input, description: "Inclusive effective date YYYY-MM-DD" }
      - { name: end_date, type: string, source: input, description: "Exclusive end date YYYY-MM-DD; must be > start_date" }
      - { name: downside_guarantee_cents, type: integer, source: input, description: "Annual downside guarantee; >= 0" }
      - { name: royalty_rate_bp, type: integer, source: input, description: "Per-talent merchandise royalty rate in basis points; 0..5000" }
      - { name: likeness_rights_granted, type: boolean, source: input, description: "Whether the promoter may sell merchandise bearing this talent's likeness" }
      - { name: min_appearances_per_quarter, type: integer, source: input, description: "Appearance obligation floor per calendar quarter; >= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | EXPIRED | TERMINATED" }

  - name: Arena
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Arena name" }
      - { name: city, type: string, source: input, description: "Host city" }
      - { name: country_code, type: string, source: input, description: "ISO 3166-1 alpha-2 country of the arena" }
      - { name: capacity, type: integer, source: input, description: "Seating capacity; > 0" }
      - { name: merch_booths, type: integer, source: input, description: "Merchandise booth count; >= 0" }
      - { name: timezone, type: string, source: input, description: "IANA timezone of the arena" }

  - name: BroadcastAnchor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Broadcast program name" }
      - { name: weekly_day_of_week, type: integer, source: input, description: "1=Monday .. 7=Sunday; anchor broadcasts every week on this day" }
      - { name: territory_code, type: string, source: input, description: "Territory the weekly broadcast airs in" }
      - { name: must_have_event_each_week, type: boolean, source: input, description: "If true, exactly one TELEVISION Event must be scheduled in every ISO week on the anchor's day" }

  - name: Event
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Event name" }
      - { name: event_type, type: enum, source: input, description: "TELEVISION | PREMIUM | HOUSE_SHOW" }
      - { name: arena_id, type: string, source: input, description: "FK -> Arena.id" }
      - { name: anchor_id, type: string, source: input, description: "FK -> BroadcastAnchor.id; required iff event_type=TELEVISION" }
      - { name: event_date, type: string, source: input, description: "Calendar date YYYY-MM-DD (arena-local)" }
      - { name: start_time, type: string, source: input, description: "Local start time HH:MM (24h)" }
      - { name: end_time, type: string, source: input, description: "Local end time HH:MM; must be later than start_time same day" }
      - { name: tour_country_code, type: string, source: input, description: "Country the event tours in; drives international/visa logic" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | LOCKED | COMPLETED | CANCELLED" }
      - { name: roster_min_main, type: integer, source: input, description: "Minimum MAIN_ROSTER bookings required to lock; >= 0" }
      - { name: roster_min_total, type: integer, source: input, description: "Minimum total bookings required to lock; >= roster_min_main" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: talent_id, type: string, source: input, description: "FK -> Talent.id" }
      - { name: storyline_id, type: string, source: input, description: "FK -> Storyline.id; optional at API level (nullable) — tags the booking as advancing a storyline; nullable" }
      - { name: segment_label, type: string, source: input, description: "Segment the talent is booked into (e.g. MATCH_1, PROMO_2)" }
      - { name: status, type: enum, source: system, description: "BOOKED | SCRATCHED | FULFILLED | NO_SHOW; BOOKED -> SCRATCHED | FULFILLED; FULFILLED -> NO_SHOW (same-day correction); SCRATCHED and NO_SHOW are terminal" }

  - name: Storyline
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Storyline title" }
      - { name: status, type: enum, source: system, description: "PLANNED | ACTIVE | SHELVED | CONCLUDED" }
      - { name: gap_count, type: integer, source: system, description: "Count of completed Chapter gaps (see Chapter); 3rd gap shelves the storyline" }

  - name: Chapter
    parent: null
    common_fields: true
    fields:
      - { name: storyline_id, type: string, source: input, description: "FK -> Storyline.id" }
      - { name: event_id, type: string, source: input, description: "FK -> Event.id the chapter is planned for" }
      - { name: chapter_index, type: integer, source: computed, description: "1-based index within the storyline ordered by Event.event_date ASC (tie-break: Event.created_at ASC)" }
      - { name: status, type: enum, source: system, description: "PLANNED | COMPLETED | MISSED" }

  - name: StreamingPartner
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Partner name" }
      - { name: partner_code, type: string, source: input, description: "Short partner code" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED (no transitions out of SUSPENDED in v1)" }

  - name: TerritoryRight
    parent: null
    common_fields: true
    fields:
      - { name: partner_id, type: string, source: input, description: "FK -> StreamingPartner.id" }
      - { name: territory_code, type: string, source: input, description: "Territory code granted; unique per partner per half-open window" }
      - { name: window_start_date, type: string, source: input, description: "Inclusive start YYYY-MM-DD" }
      - { name: window_end_date, type: string, source: input, description: "Exclusive end YYYY-MM-DD; must be > window_start_date" }
      - { name: exclusive, type: boolean, source: input, description: "If true, no other ACTIVE partner may hold an overlapping right on the same territory" }

  - name: DistributionWindow
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; event must be PREMIUM" }
      - { name: partner_id, type: string, source: input, description: "FK -> StreamingPartner.id" }
      - { name: territory_code, type: string, source: input, description: "Territory this window serves; must be covered by an ACTIVE partner TerritoryRight" }
      - { name: window_type, type: enum, source: input, description: "LIVE | REPLAY" }
      - { name: opens_at, type: datetime, source: input, description: "Inclusive UTC open instant" }
      - { name: closes_at, type: datetime, source: input, description: "Exclusive UTC close instant; must be > opens_at" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | PUBLISHED | REVOKED" }

  - name: MerchSale
    parent: null
    common_fields: false
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: talent_id, type: string, source: input, description: "FK -> Talent.id whose likeness the item bears" }
      - { name: quantity, type: integer, source: input, description: "Units sold; > 0" }
      - { name: unit_price_cents, type: integer, source: input, description: "Unit price in cents; >= 0" }
      - { name: sold_at, type: datetime, source: input, description: "UTC instant of sale" }
      - { name: royalty_cents, type: integer, source: computed, description: "Per-line royalty; round(quantity * unit_price_cents * rate_bp / 10000) at the applicable tier" }

  - name: RoyaltyStatement
    parent: null
    common_fields: true
    fields:
      - { name: talent_id, type: string, source: input, description: "FK -> Talent.id" }
      - { name: period_start_date, type: string, source: input, description: "Inclusive YYYY-MM-DD" }
      - { name: period_end_date, type: string, source: input, description: "Exclusive YYYY-MM-DD" }
      - { name: basis_mode, type: enum, source: input, description: "PROVISIONAL | FINAL; selects the royalty variant" }
      - { name: status, type: enum, source: system, description: "OPEN | FINALIZED" }
      - { name: event_id, type: string, source: system, description: "FK -> Event.id; nullable denormalized pointer to the merch event context of the statement (null when the statement spans multiple events)" }
      - { name: total_sales_cents, type: integer, source: computed, description: "Sum over included MerchSale lines of quantity*unit_price_cents" }
      - { name: total_royalty_cents, type: integer, source: computed, description: "Per-line rounded royalty sum under the basis_mode variant" }

  - name: MedicalCase
    parent: null
    common_fields: true
    fields:
      - { name: talent_id, type: string, source: input, description: "FK -> Talent.id" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR" }
      - { name: evaluation_ids, type: array, source: computed, description: "Ids of MedicalEvaluation records attached to this case" }
      - { name: clearance_id, type: string, source: computed, description: "Id of the MedicalClearance that cleared the case; null until cleared" }
      - { name: status, type: enum, source: system, description: "OPEN | CLEARED" }

  - name: MedicalEvaluation
    parent: null
    common_fields: true
    fields:
      - { name: medical_case_id, type: string, source: input, description: "FK -> MedicalCase.id" }
      - { name: evaluator_id, type: string, source: input, description: "X-User-ID of the Medic performing the evaluation" }
      - { name: findings, type: string, source: input, description: "Clinical findings narrative" }
      - { name: recommends_clearance, type: boolean, source: input, description: "Evaluator's clearance recommendation" }

  - name: MedicalClearance
    parent: null
    common_fields: true
    fields:
      - { name: medical_case_id, type: string, source: input, description: "FK -> MedicalCase.id" }
      - { name: cleared_by, type: string, source: input, description: "X-User-ID of the Medic issuing clearance; MUST differ from every evaluator on the case (segregation of duties)" }
      - { name: cleared_at, type: datetime, source: system, description: "Logical clock instant at issuance" }

  - name: VisaCase
    parent: null
    common_fields: true
    fields:
      - { name: talent_id, type: string, source: input, description: "FK -> Talent.id" }
      - { name: country_code, type: string, source: input, description: "Destination country for the visa" }
      - { name: required_by_date, type: string, source: input, description: "Latest acceptable grant date YYYY-MM-DD" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | GRANTED | DENIED" }

  - name: CallUpDecision
    parent: null
    common_fields: true
    fields:
      - { name: talent_id, type: string, source: input, description: "FK -> Talent.id" }
      - { name: readiness_score, type: integer, source: computed, description: "Per calc callup_readiness_score at decision time" }
      - { name: decision, type: enum, source: input, description: "PROMOTE | DEFER" }
      - { name: decided_by, type: string, source: input, description: "X-User-ID of the deciding TalentRelations user" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TalentAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /touring/agreements/{id}/activate"
        actor: ContractAdmin
        preconditions:
          - "agreement.status == DRAFT"
          - "no other TalentAgreement for the same talent_id is ACTIVE or overlaps [start_date, end_date) while DRAFT"
          - "end_date > start_date"
        side_effects:
          - "increments TalentAgreement.version by 1"
          - "Talent.likeness_granted recomputed (true iff an ACTIVE agreement with likeness_rights_granted=true exists); bumps Talent.version when changed"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /touring/_clock/set_current_utc advances logical clock to agreement.end_date or later"
        actor: system
        preconditions:
          - "agreement.status == ACTIVE"
          - "logical clock date >= agreement.end_date"
        side_effects:
          - "Talent.likeness_granted recomputed; bumps Talent.version when changed"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /touring/agreements/{id}/terminate"
        actor: ContractAdmin
        preconditions:
          - "agreement.status == ACTIVE"
        side_effects:
          - "Talent.likeness_granted recomputed; bumps Talent.version when changed"
          - "Booking cascade (hop 1): every Booking with talent_id == agreement.talent_id and status == BOOKED on Events with status == SCHEDULED and event_date on/after the logical clock date flips BOOKED -> SCRATCHED"
          - "Storyline cascade (hop 2): for every Storyline in ACTIVE state, if the hop-1 scratches leave the storyline with zero BOOKED bookings whose Booking.storyline_id == storyline.id, that storyline flips ACTIVE -> CONCLUDED"

  - entity: Event
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: LOCKED
        trigger: "POST /touring/events/{id}/lock"
        actor: TourPlanner
        preconditions:
          - "event.status == SCHEDULED"
          - "count of Booking with event_id == event.id and status == BOOKED >= event.roster_min_total"
          - "count of those BOOKED bookings whose talent.roster_tier == MAIN_ROSTER >= event.roster_min_main"
        side_effects:
          - "increments Event.version by 1"
      - from: LOCKED
        to: COMPLETED
        trigger: "POST /touring/events/{id}/complete"
        actor: TourPlanner
        preconditions:
          - "event.status == LOCKED"
        side_effects:
          - "Booking sweep: every Booking still BOOKED flips BOOKED -> FULFILLED and adds +3.00 wellness to that talent via wellness_score_accrual (hop 1)"
          - "Chapter sweep (hop 2): every Chapter with event_id == event.id and status == PLANNED flips PLANNED -> COMPLETED, resetting that storyline's gap_count to 0"
          - "Merch freeze: subsequent POST /touring/merch-sales for this event are rejected"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /touring/events/{id}/cancel"
        actor: TourPlanner
        preconditions:
          - "event.status == SCHEDULED"
        side_effects:
          - "every Booking with status == BOOKED flips BOOKED -> SCRATCHED"
          - "Chapter sweep: every Chapter with event_id == event.id and status == PLANNED flips PLANNED -> MISSED, and each owning Storyline.gap_count += 1; any Storyline reaching gap_count == 3 flips ACTIVE -> SHELVED (calc storyline_gap_rule)"
          - "DistributionWindow sweep: every PROVISIONAL or PUBLISHED window on this event flips to REVOKED"

  - entity: Booking
    initial_state: BOOKED
    terminal_states: [SCRATCHED, FULFILLED, NO_SHOW]
    transitions:
      - from: BOOKED
        to: SCRATCHED
        trigger: "POST /touring/bookings/{id}/scratch"
        actor: TourPlanner
        preconditions:
          - "booking.status == BOOKED"
          - "owning Event.status == SCHEDULED"
        side_effects:
          - "Storyline gap check: if the scratch leaves the booking's storyline (Booking.storyline_id, when set) with zero BOOKED bookings on the chapter event, calc storyline_gap_rule is re-evaluated"
      - from: FULFILLED
        to: NO_SHOW
        trigger: "POST /touring/events/{event_id}/bookings/{id}/no-show"
        actor: TourPlanner
        preconditions:
          - "booking.status == FULFILLED"
          - "owning Event.status == COMPLETED"
          - "logical clock date == owning Event.event_date (same-day correction only)"
        side_effects:
          - "reverses the +3.00 FULFILLED wellness credit, then applies the -8.00 NO_SHOW penalty (net -11.00 vs fulfilled state) via wellness_score_accrual with floor 0.00; booking_mode re-derived"
      - from: BOOKED
        to: FULFILLED
        trigger: "system: cascade of POST /touring/events/{id}/complete"
        actor: system
        preconditions:
          - "booking.status == BOOKED"
        side_effects:
          - "Talent wellness_score += 3.00 via wellness_score_accrual (ceiling 100.00); booking_mode re-derived"

  - entity: Storyline
    initial_state: PLANNED
    terminal_states: [SHELVED, CONCLUDED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /touring/storylines/{id}/activate"
        actor: StorylineEditor
        preconditions:
          - "storyline.status == PLANNED"
          - "storyline has >= 1 Chapter with status == PLANNED"
        side_effects: []
      - from: ACTIVE
        to: SHELVED
        trigger: "system: gap_count reaches 3 (calc storyline_gap_rule)"
        actor: system
        preconditions:
          - "storyline.status == ACTIVE"
          - "storyline.gap_count == 3"
        side_effects:
          - "all remaining PLANNED chapters flip PLANNED -> MISSED without further gap_count increments"
      - from: ACTIVE
        to: CONCLUDED
        trigger: "POST /touring/storylines/{id}/conclude, or system cascade when a terminating agreement scratches the storyline's last BOOKED booking"
        actor: StorylineEditor
        preconditions:
          - "storyline.status == ACTIVE"
          - "manual conclude: every Chapter of this storyline is in a terminal state (COMPLETED or MISSED)"
          - "system cascade conclude: zero BOOKED bookings remain with Booking.storyline_id == storyline.id"
        side_effects: []
      - from: SHELVED
        to: ACTIVE
        trigger: "POST /touring/storylines/{id}/revive"
        actor: StorylineEditor
        preconditions:
          - "storyline.status == SHELVED"
        side_effects:
          - "storyline.gap_count reset to 0"

  - entity: MedicalCase
    initial_state: OPEN
    terminal_states: [CLEARED]
    transitions:
      - from: OPEN
        to: CLEARED
        trigger: "POST /touring/medical-cases/{id}/clearances"
        actor: Medic
        preconditions:
          - "case.status == OPEN"
          - "case has >= 2 MedicalEvaluation records with recommends_clearance == true"
          - "cleared_by (requesting Medic X-User-ID) is not equal to any evaluator_id on the case (segregation of duties)"
        side_effects:
          - "Talent.availability_status flips INJURED -> ACTIVE; booking_mode re-derived; Talent.version bumped"
          - "case.clearance_id set to the new MedicalClearance.id"
    note: "On MedicalCase creation (POST /touring/medical-cases), Talent.availability_status flips ACTIVE -> INJURED as a creation side effect, and every Booking of this talent on SCHEDULED events with event_date within INJURY_SCRATCH_HORIZON_DAYS of the logical clock flips BOOKED -> SCRATCHED (hop 1); each scratch re-evaluates storyline gaps (hop 2)."

  - entity: VisaCase
    initial_state: DRAFT
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /touring/visa-cases/{id}/submit"
        actor: LogisticsCoordinator
        preconditions:
          - "case.status == DRAFT"
          - "required_by_date is strictly after the logical clock date"
        side_effects: []
      - from: SUBMITTED
        to: GRANTED
        trigger: "POST /touring/visa-cases/{id}/grant"
        actor: LogisticsCoordinator
        preconditions:
          - "case.status == SUBMITTED"
          - "logical clock date <= case.required_by_date (grant after the deadline is rejected with ERR_VISA_WINDOW_PASSED)"
        side_effects: []
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /touring/visa-cases/{id}/deny"
        actor: LogisticsCoordinator
        preconditions:
          - "case.status == SUBMITTED"
        side_effects:
          - "Booking cascade (hop 1): every BOOKED booking of this talent on SCHEDULED events whose tour_country_code == case.country_code and event_date <= case.required_by_date flips BOOKED -> SCRATCHED"
          - "Storyline gap cascade (hop 2): each scratch re-evaluates calc storyline_gap_rule"

  - entity: Chapter
    initial_state: PLANNED
    terminal_states: [COMPLETED, MISSED]
    transitions:
      - from: PLANNED
        to: COMPLETED
        trigger: "system: cascade of POST /touring/events/{id}/complete on the chapter's event"
        actor: system
        preconditions:
          - "chapter.status == PLANNED"
          - "owning Event transitioned LOCKED -> COMPLETED"
        side_effects:
          - "owning Storyline.gap_count reset to 0"
      - from: PLANNED
        to: MISSED
        trigger: "system: cascade of owning Event cancellation, or storyline shelving sweep"
        actor: system
        preconditions:
          - "chapter.status == PLANNED"
        side_effects:
          - "owning Storyline.gap_count += 1 (unless the miss came from the shelving sweep itself, which does not increment)"

  - entity: RoyaltyStatement
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /touring/royalty-statements/{id}/finalize"
        actor: ContractAdmin
        preconditions:
          - "statement.status == OPEN"
          - "statement.basis_mode == FINAL"
        side_effects:
          - "totals frozen; statement becomes read-only"

  - entity: DistributionWindow
    initial_state: PROVISIONAL
    terminal_states: [REVOKED]
    transitions:
      - from: PROVISIONAL
        to: PUBLISHED
        trigger: "POST /touring/distribution-windows/{id}/publish"
        actor: DistributionManager
        preconditions:
          - "window.status == PROVISIONAL"
          - "owning Event.status in {SCHEDULED, LOCKED}"
          - "windowing rules in calc distribution_windowing satisfied at publish time"
        side_effects: []
      - from: PUBLISHED
        to: REVOKED
        trigger: "POST /touring/distribution-windows/{id}/revoke"
        actor: DistributionManager
        preconditions:
          - "window.status == PUBLISHED"
        side_effects: []
      - from: PROVISIONAL
        to: REVOKED
        trigger: "system: cascade of owning Event cancellation, or POST /touring/distribution-windows/{id}/revoke"
        actor: system
        preconditions:
          - "window.status == PROVISIONAL"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: agreement-activate-stale-agreement
    parent_entity: TalentAgreement
    write_endpoint: "POST /touring/agreements/{id}/activate"
    occ_field: "expected_agreement_version"
    description: |
      Activating a TalentAgreement whose version has advanced since the client
      last observed it is rejected with a stale-version error. Another writer
      may have edited the window or royalty terms; the client must re-read.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: event-lock-stale-event
    parent_entity: Event
    write_endpoint: "POST /touring/events/{id}/lock"
    occ_field: "expected_event_version"
    description: |
      Locking an Event whose version has advanced since the client last
      observed it is rejected with a stale-version error; roster minimums or
      event timing may have changed under the client's feet.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: royalty_line_split
    trigger: "on MerchSale creation and on RoyaltyStatement recompute"
    algorithm: tiered_pricing
    formula: |
      # Per-line rounding, THEN sum (pinned order — do not sum-then-round).
      # Tier selection uses the event-day GROSS for the talent, not the line.
      day_gross_cents = sum(quantity * unit_price_cents) over the talent's
                        MerchSale lines on the same event and same sold_at date
      if day_gross_cents > TIER2_GROSS_CENTS:      rate_bp = agreement.royalty_rate_bp + TIER2_BONUS_BP
      elif day_gross_cents >= TIER1_GROSS_CENTS:   rate_bp = agreement.royalty_rate_bp
      else:                                        rate_bp = agreement.royalty_rate_bp - TIER0_DISCOUNT_BP
      royalty_cents(line) = round_half_up(line.quantity * line.unit_price_cents * rate_bp / 10000)
      statement.total_royalty_cents = sum of royalty_cents over included lines
    input_set: "MerchSale lines for the talent whose sold_at date falls in [period_start_date, period_end_date); variant filter below"
    constants:
      TIER1_GROSS_CENTS: 100000
      TIER2_GROSS_CENTS: 250000
      TIER2_BONUS_BP: 200
      TIER0_DISCOUNT_BP: 100
    precision: "integer cents; round_half_up per line before summing"
    variants:
      - name: provisional
        when: "RoyaltyStatement.basis_mode == PROVISIONAL"
        difference: "includes only MerchSale lines on Events with status == LOCKED or COMPLETED at recompute time"
      - name: final
        when: "RoyaltyStatement.basis_mode == FINAL"
        difference: "includes only MerchSale lines on Events with status == COMPLETED at finalize time"

  - name: booking_mode_derivation
    trigger: "on any change to Talent.availability_status, Talent.wellness_score, or a MedicalCase open/clear"
    algorithm: threshold
    formula: |
      if talent.availability_status == SUSPENDED:                    booking_mode = UNBOOKABLE
      elif talent.availability_status == INJURED:                    booking_mode = UNBOOKABLE
      elif any MedicalCase for the talent has status == OPEN:        booking_mode = UNBOOKABLE
      elif talent.wellness_score >= WELLNESS_BOOKABLE_MIN:           booking_mode = BOOKABLE
      elif talent.wellness_score >= WELLNESS_LIMITED_MIN:            booking_mode = LIMITED
      else:                                                          booking_mode = UNBOOKABLE
      # Boundaries are inclusive: score == 70.00 is BOOKABLE; 69.99 is LIMITED.
      # LIMITED talent may be booked only on HOUSE_SHOW events.
    input_set: "single Talent row + its MedicalCase rows with status == OPEN"
    constants:
      WELLNESS_BOOKABLE_MIN: 70.0
      WELLNESS_LIMITED_MIN: 40.0
    precision: "2 decimal places, round_half_up"

  - name: wellness_score_accrual
    trigger: "on Booking FULFILLED (+3.00), Booking NO_SHOW (-8.00), weekly decay at ops epoch"
    algorithm: decay_function
    formula: |
      wellness_score = clamp(wellness_score + delta, 0.0, 100.0)
      delta: FULFILLED = +3.00; NO_SHOW = -8.00; weekly decay = -1.00 applied
      each time the logical clock crosses a Monday 00:00Z boundary while the
      talent holds roster_tier == MAIN_ROSTER (decay is skipped for DEVELOPMENTAL).
    input_set: "single Talent"
    constants:
      FULFILLED_DELTA: 3.0
      NOSHOW_DELTA: -8.0
      WEEKLY_DECAY: 1.0
    precision: "2 decimal places, round_half_up"

  - name: appearance_obligation_shortfall
    trigger: "on demand via GET /touring/talents/{id}/appearance-compliance"
    algorithm: forward_looking
    formula: |
      # Quarter Q is the calendar quarter containing the logical clock date.
      # Forward-looking: counts FULFILLED bookings in elapsed part of Q AND
      # BOOKED bookings on SCHEDULED/LOCKED events in the remainder of Q.
      committed = count(Booking with status == FULFILLED for talent, event_date in Q)
      projected = count(Booking with status == BOOKED on Events with status in {SCHEDULED, LOCKED}
                        and event_date in remainder of Q after the logical clock date)
      shortfall = max(0, agreement.min_appearances_per_quarter - committed - projected)
      # Evaluation order is pinned (circular-looking dependency): first resolve
      # the set of the talent's bookings whose event dates fall inside Q; then
      # select the agreement ACTIVE on the LAST day of Q (not the first); then
      # compute counts against that agreement's floor. A quarter boundary where
      # agreements switch therefore uses the successor agreement's floor.
    input_set: "Booking rows for the talent + TalentAgreement ACTIVE on the last day of quarter Q"
    constants: {}
    precision: "integer count"

  - name: storyline_gap_rule
    trigger: "on Chapter PLANNED -> MISSED and on Event completion sweep"
    algorithm: aggregation
    formula: |
      # Consecutive-gap semantics: completing a chapter resets gap_count to 0;
      # each missed PLANNED chapter (event cancelled, or chapter event completes
      # with the chapter's talents all scratched) increments gap_count by 1.
      # At gap_count == 3 the owning Storyline flips ACTIVE -> SHELVED.
      # Chapter ordering for "consecutive" uses chapter_index (Event.event_date
      # ASC, tie-break Event.created_at ASC).
    input_set: "Chapters of one Storyline, ordered by chapter_index ASC"
    constants:
      GAP_SHELF_THRESHOLD: 3
    precision: "integer count"

  - name: distribution_windowing
    trigger: "on DistributionWindow creation and publish"
    algorithm: interval_merge
    formula: |
      # Half-open intervals [opens_at, closes_at): touching windows (a.closes_at
      # == b.opens_at) do NOT conflict.
      # LIVE windows: opens_at >= event start instant (UTC) - LIVE_PREOPEN_MINUTES
      # REPLAY windows: opens_at >= event end instant (UTC) + REPLAY_DELAY_HOURS
      # Same-partner windows on the same territory for the same event must not
      # overlap under half-open semantics; different partners never share an
      # event+territory pair (territory exclusivity is enforced upstream by
      # TerritoryRight overlap rules on exclusive rights).
    input_set: "DistributionWindow rows for the same event_id"
    constants:
      LIVE_PREOPEN_MINUTES: 30
      REPLAY_DELAY_HOURS: 24
    precision: "UTC instants, second precision"

  - name: territory_right_overlap
    trigger: "on TerritoryRight creation"
    algorithm: interval_merge
    formula: |
      # Half-open [window_start_date, window_end_date): adjacent rights
      # (a.window_end_date == b.window_start_date) are legal.
      # An exclusive right conflicts with ANY other right for the same
      # territory_code whose window intersects it.
      # Two non-exclusive rights for the same territory and partner may not
      # overlap (self-overlap ban); non-exclusive rights across different
      # partners may overlap freely.
    input_set: "TerritoryRight rows sharing the territory_code"
    constants: {}
    precision: "date granularity, half-open"

  - name: callup_readiness_score
    trigger: "on POST /touring/talents/{id}/call-up"
    algorithm: weighted_scoring
    formula: |
      # Computed over the trailing TRAILING_DAYS days relative to the logical clock.
      fulfilled = count(Booking FULFILLED on HOUSE_SHOW events in window)
      no_shows  = count(Booking NO_SHOW in window)
      score = clamp(fulfilled * W_FULFILLED - no_shows * W_NOSHOW + round_half_up(wellness_score * W_WELLNESS), 0, 100)
      # PROMOTE requires score >= PROMOTE_THRESHOLD AND zero OPEN MedicalCases.
      # Tie in ordering of multiple same-day decisions is broken by
      # Talent.created_at ASC — never by id.
    input_set: "Bookings of the talent in trailing window + current wellness_score"
    constants:
      TRAILING_DAYS: 90
      W_FULFILLED: 4
      W_NOSHOW: 10
      W_WELLNESS: 0.5
      PROMOTE_THRESHOLD: 60
    precision: "integer score; round_half_up on the wellness term"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and well-formed", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "role is permitted to invoke the endpoint per §1.7", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "every id in the path resolves to an existing resource (left-to-right)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: existence, check: "every FK id in the request body resolves to an existing resource", error_id: ERR_REFERENCE_NOT_FOUND, http_status: 404, applies_to: "endpoints with body FKs" }
  - { priority: 5, category: state, check: "target resource is in a state that permits the requested transition; RoyaltyStatement recompute requires status == OPEN", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints including POST /touring/royalty-statements/{id}/recompute" }
  - { priority: 6, category: state, check: "Event must be SCHEDULED for booking creation and scratch", error_id: ERR_EVENT_NOT_MUTABLE, http_status: 409, applies_to: ["POST /touring/bookings", "POST /touring/bookings/{id}/scratch"] }
  - { priority: 7, category: business_safety, check: "medical clearance: >= 2 recommending evaluations from DISTINCT evaluator_ids and cleared_by differs from every evaluator (segregation of duties)", error_id: ERR_CLEARANCE_PROTOCOL_VIOLATION, http_status: 422, applies_to: ["POST /touring/medical-cases/{id}/clearances"] }
  - { priority: 8, category: business_safety, check: "booking requires Talent.booking_mode == BOOKABLE, or LIMITED for HOUSE_SHOW events only; UNBOOKABLE always rejected", error_id: ERR_TALENT_UNBOOKABLE, http_status: 422, applies_to: ["POST /touring/bookings"] }
  - { priority: 9, category: business_safety, check: "booking on an event with tour_country_code != 'US' requires a GRANTED VisaCase for that talent with country_code == event.tour_country_code and required_by_date >= event_date", error_id: ERR_VISA_REQUIRED, http_status: 422, applies_to: ["POST /touring/bookings"] }
  - { priority: 10, category: business_constraint, check: "TalentAgreement windows for one talent must not overlap under half-open [start_date, end_date)", error_id: ERR_AGREEMENT_OVERLAP, http_status: 422, applies_to: ["POST /touring/agreements", "POST /touring/agreements/{id}/activate"] }
  - { priority: 11, category: business_temporal, check: "Event arena double-booking: an arena hosts at most one Event per calendar date (whole-day granularity, not hour-overlap)", error_id: ERR_ARENA_DATE_CONFLICT, http_status: 422, applies_to: ["POST /touring/events"] }
  - { priority: 12, category: business_temporal, check: "Talent booking double-booking: same talent may not be BOOKED on two SCHEDULED/LOCKED events on the same date whose [start_time, end_time) intervals overlap", error_id: ERR_TALENT_DOUBLE_BOOKED, http_status: 422, applies_to: ["POST /touring/bookings"] }
  - { priority: 13, category: business_temporal, check: "TELEVISION event must reference an anchor and land on that anchor's weekly_day_of_week", error_id: ERR_ANCHOR_DATE_MISMATCH, http_status: 422, applies_to: ["POST /touring/events"] }
  - { priority: 14, category: business_temporal, check: "TerritoryRight exclusivity/overlap rules per calc territory_right_overlap", error_id: ERR_TERRITORY_RIGHT_CONFLICT, http_status: 422, applies_to: ["POST /touring/territory-rights"] }
  - { priority: 15, category: business_temporal, check: "DistributionWindow timing (LIVE pre-open, REPLAY delay, half-open non-overlap per partner+territory) per calc distribution_windowing; publish re-checks timing/overlap but does not re-check territory licensing (licensing is pinned at creation)", error_id: ERR_WINDOW_OVERLAP, http_status: 422, applies_to: ["POST /touring/distribution-windows", "POST /touring/distribution-windows/{id}/publish"] }
  - { priority: 16, category: business_referential, check: "DistributionWindow.territory_code must be covered by a TerritoryRight of the SAME partner whose window spans the DistributionWindow dates and whose StreamingPartner.status == ACTIVE", error_id: ERR_TERRITORY_NOT_LICENSED, http_status: 422, applies_to: ["POST /touring/distribution-windows"] }
  - { priority: 17, category: business_referential, check: "MerchSale rejected unless the talent has likeness_granted == true and an ACTIVE agreement", error_id: ERR_LIKENESS_NOT_GRANTED, http_status: 422, applies_to: ["POST /touring/merch-sales"] }
  - { priority: 18, category: business_constraint, check: "DistributionWindow target event must have event_type == PREMIUM", error_id: ERR_EVENT_NOT_PREMIUM, http_status: 422, applies_to: ["POST /touring/distribution-windows"] }
  - { priority: 19, category: business_constraint, check: "Event lock roster minimums (roster_min_main, roster_min_total)", error_id: ERR_ROSTER_MINIMUM_UNMET, http_status: 422, applies_to: ["POST /touring/events/{id}/lock"] }
  - { priority: 20, category: business_constraint, check: "call-up PROMOTE requires readiness_score >= 60 and no OPEN MedicalCase", error_id: ERR_READINESS_THRESHOLD_UNMET, http_status: 422, applies_to: ["POST /touring/talents/{id}/call-up"] }
  - { priority: 21, category: business_temporal, check: "visa submit/grant attempted after required_by_date", error_id: ERR_VISA_WINDOW_PASSED, http_status: 422, applies_to: ["POST /touring/visa-cases/{id}/submit", "POST /touring/visa-cases/{id}/grant"] }
  - { priority: 21, category: business_constraint, check: "finalize requires basis_mode == FINAL", error_id: ERR_STATEMENT_NOT_FINALIZABLE, http_status: 422, applies_to: ["POST /touring/royalty-statements/{id}/finalize"] }
  - { priority: 22, category: business_temporal, check: "merch sale rejected when the owning event is COMPLETED or CANCELLED", error_id: ERR_MERCH_WINDOW_CLOSED, http_status: 422, applies_to: ["POST /touring/merch-sales"] }
  - { priority: 23, category: business_fiscal, check: "royalty arithmetic uses integer cents; tiered rate selection per calc royalty_line_split; non-positive quantities rejected", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: ["POST /touring/merch-sales"] }
  - { priority: 24, category: business_constraint, check: "required input fields present, enums valid, dates well-formed (end > start)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- system / test-driving ----
  - method: POST
    path: "/touring/_clock/set_current_utc"
    description: "Advance the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time. Triggers weekly wellness decay and agreement expiry sweeps."
    roles: [ContractAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["wellness weekly decay sweep", "TalentAgreement ACTIVE->EXPIRED sweep"]

  # ---- talents ----
  - method: POST
    path: "/touring/talents"
    description: "Register a performer (independent contractor, developmental tier)"
    roles: [TalentRelations]
    code: 201
    input: [ring_name, legal_name, contractor_status]
    output: Talent
    side_effects: ["booking_mode initialized UNBOOKABLE until first wellness activity raises score"]
  - method: GET
    path: "/touring/talents"
    description: "List talents with optional filters"
    roles: [TalentRelations, TourPlanner, StorylineEditor, MerchOps, Medic, ContractAdmin, LogisticsCoordinator, DistributionManager]
    code: 200
    input: ["roster_tier?", "availability_status?", "booking_mode?", "limit?", "offset?"]
    output: Talent[]
    side_effects: []
  - method: GET
    path: "/touring/talents/{id}"
    description: "Fetch one talent"
    roles: [TalentRelations, TourPlanner, StorylineEditor, MerchOps, Medic, ContractAdmin, LogisticsCoordinator, DistributionManager]
    code: 200
    input: []
    output: Talent
    side_effects: []
  - method: POST
    path: "/touring/talents/{id}/suspend"
    description: "Suspend a talent (wellness/disciplinary)"
    roles: [TalentRelations]
    code: 200
    input: [reason]
    output: Talent
    side_effects: ["availability_status -> SUSPENDED", "booking_mode re-derived"]
  - method: POST
    path: "/touring/talents/{id}/reinstate"
    description: "Lift a suspension"
    roles: [TalentRelations]
    code: 200
    input: []
    output: Talent
    side_effects: ["availability_status SUSPENDED -> ACTIVE (or INJURED if a MedicalCase is OPEN)", "booking_mode re-derived"]
  - method: POST
    path: "/touring/talents/{id}/call-up"
    description: "Developmental -> main roster call-up decision"
    roles: [TalentRelations]
    code: 201
    input: [decision]
    output: CallUpDecision
    side_effects: ["computes callup_readiness_score", "on PROMOTE: roster_tier -> MAIN_ROSTER"]
  - method: GET
    path: "/touring/talents/{id}/call-up-decisions"
    description: "List call-up decisions for a talent"
    roles: [TalentRelations]
    code: 200
    input: []
    output: CallUpDecision[]
    side_effects: []
  - method: GET
    path: "/touring/talents/{id}/appearance-compliance"
    description: "Appearance obligation shortfall per calc appearance_obligation_shortfall for the current quarter"
    roles: [TalentRelations, ContractAdmin]
    code: 200
    input: []
    output: { quarter: string, committed: integer, projected: integer, shortfall: integer }
    side_effects: []
  - method: GET
    path: "/touring/talents/{id}/medical-cases"
    description: "Reverse lookup of medical cases for a talent"
    roles: [Medic, TalentRelations]
    code: 200
    input: []
    output: MedicalCase[]
    side_effects: []
  - method: GET
    path: "/touring/talents/{id}/visa-cases"
    description: "Reverse lookup of visa cases for a talent"
    roles: [LogisticsCoordinator, TalentRelations]
    code: 200
    input: []
    output: VisaCase[]
    side_effects: []
  - method: GET
    path: "/touring/talents/{id}/agreements"
    description: "Reverse lookup of agreements for a talent"
    roles: [ContractAdmin, TalentRelations]
    code: 200
    input: []
    output: TalentAgreement[]
    side_effects: []

  # ---- agreements ----
  - method: POST
    path: "/touring/agreements"
    description: "Draft a talent agreement"
    roles: [ContractAdmin]
    code: 201
    input: [talent_id, start_date, end_date, downside_guarantee_cents, royalty_rate_bp, likeness_rights_granted, min_appearances_per_quarter]
    output: TalentAgreement
    side_effects: []
  - method: GET
    path: "/touring/agreements"
    description: "List agreements (filtered-list reverse lookup by talent)"
    roles: [ContractAdmin, TalentRelations]
    code: 200
    input: ["talent_id?", "status?", "limit?", "offset?"]
    output: TalentAgreement[]
    side_effects: []
  - method: GET
    path: "/touring/agreements/{id}"
    description: "Fetch one agreement"
    roles: [ContractAdmin, TalentRelations]
    code: 200
    input: []
    output: TalentAgreement
    side_effects: []
  - method: PATCH
    path: "/touring/agreements/{id}"
    description: "Edit DRAFT agreement terms"
    roles: [ContractAdmin]
    code: 200
    input: ["start_date?", "end_date?", "downside_guarantee_cents?", "royalty_rate_bp?", "likeness_rights_granted?", "min_appearances_per_quarter?"]
    output: TalentAgreement
    side_effects: ["increments TalentAgreement.version by 1"]
  - method: POST
    path: "/touring/agreements/{id}/activate"
    description: "Activate a DRAFT agreement (OCC-guarded)"
    roles: [ContractAdmin]
    code: 200
    input: [expected_agreement_version]
    output: TalentAgreement
    side_effects: ["DRAFT -> ACTIVE", "increments TalentAgreement.version by 1", "Talent.likeness_granted recompute"]
  - method: POST
    path: "/touring/agreements/{id}/terminate"
    description: "Terminate an ACTIVE agreement"
    roles: [ContractAdmin]
    code: 200
    input: []
    output: TalentAgreement
    side_effects: ["ACTIVE -> TERMINATED", "booking scratch cascade", "storyline conclude cascade"]

  # ---- arenas / anchors ----
  - method: POST
    path: "/touring/arenas"
    description: "Register an arena"
    roles: [TourPlanner]
    code: 201
    input: [name, city, country_code, capacity, merch_booths, timezone]
    output: Arena
    side_effects: []
  - method: GET
    path: "/touring/arenas/{id}"
    description: "Fetch one arena"
    roles: [TourPlanner, LogisticsCoordinator, MerchOps]
    code: 200
    input: []
    output: Arena
    side_effects: []
  - method: POST
    path: "/touring/broadcast-anchors"
    description: "Register a weekly television broadcast anchor"
    roles: [TourPlanner]
    code: 201
    input: [name, weekly_day_of_week, territory_code, must_have_event_each_week]
    output: BroadcastAnchor
    side_effects: []
  - method: GET
    path: "/touring/broadcast-anchors/{id}"
    description: "Fetch one anchor"
    roles: [TourPlanner]
    code: 200
    input: []
    output: BroadcastAnchor
    side_effects: []

  # ---- events ----
  - method: POST
    path: "/touring/events"
    description: "Schedule an event (TELEVISION requires anchor and anchor-day match)"
    roles: [TourPlanner]
    code: 201
    input: [name, event_type, arena_id, "anchor_id?", event_date, start_time, end_time, tour_country_code, roster_min_main, roster_min_total]
    output: Event
    side_effects: []
  - method: GET
    path: "/touring/events"
    description: "List events with optional filters"
    roles: [TourPlanner, StorylineEditor, MerchOps, DistributionManager, LogisticsCoordinator, TalentRelations]
    code: 200
    input: ["status?", "event_type?", "arena_id?", "anchor_id?", "limit?", "offset?"]
    output: Event[]
    side_effects: []
  - method: GET
    path: "/touring/events/{id}"
    description: "Fetch one event"
    roles: [TourPlanner, StorylineEditor, MerchOps, DistributionManager, LogisticsCoordinator, TalentRelations]
    code: 200
    input: []
    output: Event
    side_effects: []
  - method: POST
    path: "/touring/events/{id}/lock"
    description: "Lock an event after roster minimums are met (OCC-guarded)"
    roles: [TourPlanner]
    code: 200
    input: [expected_event_version]
    output: Event
    side_effects: ["SCHEDULED -> LOCKED", "increments Event.version by 1"]
  - method: POST
    path: "/touring/events/{id}/complete"
    description: "Complete a locked event; fulfills bookings, advances chapters, freezes merch"
    roles: [TourPlanner]
    code: 200
    input: []
    output: Event
    side_effects: ["LOCKED -> COMPLETED", "booking fulfill sweep", "chapter complete sweep", "wellness accrual"]
  - method: POST
    path: "/touring/events/{id}/cancel"
    description: "Cancel a scheduled event; scratches bookings, gaps storylines, revokes windows"
    roles: [TourPlanner]
    code: 200
    input: []
    output: Event
    side_effects: ["SCHEDULED -> CANCELLED", "booking scratch sweep", "chapter miss sweep with gap_count increments", "distribution window revoke sweep"]

  # ---- bookings ----
  - method: POST
    path: "/touring/bookings"
    description: "Book a talent onto an event segment"
    roles: [TourPlanner]
    code: 201
    input: [event_id, talent_id, "storyline_id?", segment_label]
    output: Booking
    side_effects: ["storyline gap re-evaluation"]
  - method: GET
    path: "/touring/bookings"
    description: "List bookings with optional filters (multi-FK reverse lookup)"
    roles: [TourPlanner, TalentRelations, StorylineEditor, MerchOps]
    code: 200
    input: ["event_id?", "talent_id?", "storyline_id?", "status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []
  - method: GET
    path: "/touring/bookings/{id}"
    description: "Fetch one booking"
    roles: [TourPlanner, TalentRelations, StorylineEditor, MerchOps]
    code: 200
    input: []
    output: Booking
    side_effects: []
  - method: POST
    path: "/touring/bookings/{id}/scratch"
    description: "Scratch a booking from a still-scheduled event"
    roles: [TourPlanner]
    code: 200
    input: []
    output: Booking
    side_effects: ["BOOKED -> SCRATCHED", "storyline gap re-evaluation"]
  - method: POST
    path: "/touring/events/{event_id}/bookings/{id}/no-show"
    description: "Same-day correction: flip a FULFILLED booking to NO_SHOW on a COMPLETED event"
    roles: [TourPlanner]
    code: 200
    input: []
    output: Booking
    side_effects: ["FULFILLED -> NO_SHOW", "wellness net -11.00 vs fulfilled state (reverse +3.00, apply -8.00, floor 0.00)"]

  # ---- storylines / chapters ----
  - method: POST
    path: "/touring/storylines"
    description: "Create a storyline"
    roles: [StorylineEditor]
    code: 201
    input: [title]
    output: Storyline
    side_effects: []
  - method: GET
    path: "/touring/storylines/{id}"
    description: "Fetch one storyline"
    roles: [StorylineEditor, TourPlanner]
    code: 200
    input: []
    output: Storyline
    side_effects: []
  - method: GET
    path: "/touring/storylines/{id}/chapters"
    description: "Reverse lookup of chapters for a storyline"
    roles: [StorylineEditor, TourPlanner]
    code: 200
    input: []
    output: Chapter[]
    side_effects: []
  - method: POST
    path: "/touring/storylines/{id}/activate"
    description: "Activate a planned storyline"
    roles: [StorylineEditor]
    code: 200
    input: []
    output: Storyline
    side_effects: ["PLANNED -> ACTIVE"]
  - method: POST
    path: "/touring/storylines/{id}/conclude"
    description: "Conclude an active storyline whose chapters are all terminal"
    roles: [StorylineEditor]
    code: 200
    input: []
    output: Storyline
    side_effects: ["ACTIVE -> CONCLUDED"]
  - method: POST
    path: "/touring/storylines/{id}/revive"
    description: "Revive a shelved storyline, resetting gap_count"
    roles: [StorylineEditor]
    code: 200
    input: []
    output: Storyline
    side_effects: ["SHELVED -> ACTIVE", "gap_count reset to 0"]
  - method: POST
    path: "/touring/chapters"
    description: "Plan a chapter of a storyline for an event"
    roles: [StorylineEditor]
    code: 201
    input: [storyline_id, event_id]
    output: Chapter
    side_effects: ["chapter_index computed"]
  - method: GET
    path: "/touring/chapters"
    description: "List chapters with optional filters"
    roles: [StorylineEditor, TourPlanner]
    code: 200
    input: ["storyline_id?", "event_id?", "status?", "limit?", "offset?"]
    output: Chapter[]
    side_effects: []
  - method: GET
    path: "/touring/events/{id}/chapters"
    description: "Reverse lookup of chapters for an event"
    roles: [StorylineEditor, TourPlanner]
    code: 200
    input: []
    output: Chapter[]
    side_effects: []

  # ---- distribution ----
  - method: POST
    path: "/touring/streaming-partners"
    description: "Register a streaming partner"
    roles: [DistributionManager]
    code: 201
    input: [name, partner_code]
    output: StreamingPartner
    side_effects: []
  - method: GET
    path: "/touring/streaming-partners"
    description: "List streaming partners"
    roles: [DistributionManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: StreamingPartner[]
    side_effects: []
  - method: GET
    path: "/touring/streaming-partners/{id}"
    description: "Fetch one partner"
    roles: [DistributionManager]
    code: 200
    input: []
    output: StreamingPartner
    side_effects: []
  - method: POST
    path: "/touring/territory-rights"
    description: "Grant a territory right window to a partner"
    roles: [DistributionManager]
    code: 201
    input: [partner_id, territory_code, window_start_date, window_end_date, exclusive]
    output: TerritoryRight
    side_effects: []
  - method: GET
    path: "/touring/territory-rights"
    description: "List territory rights (reverse lookup by partner)"
    roles: [DistributionManager]
    code: 200
    input: ["partner_id?", "territory_code?", "limit?", "offset?"]
    output: TerritoryRight[]
    side_effects: []
  - method: GET
    path: "/touring/territory-rights/{id}"
    description: "Fetch one territory right"
    roles: [DistributionManager]
    code: 200
    input: []
    output: TerritoryRight
    side_effects: []
  - method: POST
    path: "/touring/distribution-windows"
    description: "Open a distribution window for a PREMIUM event in a licensed territory"
    roles: [DistributionManager]
    code: 201
    input: [event_id, partner_id, territory_code, window_type, opens_at, closes_at]
    output: DistributionWindow
    side_effects: []
  - method: GET
    path: "/touring/distribution-windows"
    description: "List windows (reverse lookup by event/partner)"
    roles: [DistributionManager]
    code: 200
    input: ["event_id?", "partner_id?", "status?", "limit?", "offset?"]
    output: DistributionWindow[]
    side_effects: []
  - method: GET
    path: "/touring/distribution-windows/{id}"
    description: "Fetch one window"
    roles: [DistributionManager]
    code: 200
    input: []
    output: DistributionWindow
    side_effects: []
  - method: POST
    path: "/touring/distribution-windows/{id}/publish"
    description: "Publish a provisional window"
    roles: [DistributionManager]
    code: 200
    input: []
    output: DistributionWindow
    side_effects: ["PROVISIONAL -> PUBLISHED"]
  - method: POST
    path: "/touring/distribution-windows/{id}/revoke"
    description: "Revoke a window"
    roles: [DistributionManager]
    code: 200
    input: []
    output: DistributionWindow
    side_effects: ["PROVISIONAL|PUBLISHED -> REVOKED"]

  # ---- merch / royalties ----
  - method: POST
    path: "/touring/merch-sales"
    description: "Record a venue merchandise sale line (immutable)"
    roles: [MerchOps]
    code: 201
    input: [event_id, talent_id, quantity, unit_price_cents, sold_at]
    output: MerchSale
    side_effects: ["royalty_cents computed per calc royalty_line_split"]
  - method: GET
    path: "/touring/merch-sales/{id}"
    description: "Fetch one merch sale line"
    roles: [MerchOps, ContractAdmin]
    code: 200
    input: []
    output: MerchSale
    side_effects: []
  - method: GET
    path: "/touring/merch-sales"
    description: "List merch sale lines (reverse lookup by event/talent)"
    roles: [MerchOps, ContractAdmin]
    code: 200
    input: ["event_id?", "talent_id?", "limit?", "offset?"]
    output: MerchSale[]
    side_effects: []
  - method: GET
    path: "/touring/events/{id}/merch-sales"
    description: "Reverse lookup of merch sales for an event"
    roles: [MerchOps, ContractAdmin]
    code: 200
    input: []
    output: MerchSale[]
    side_effects: []
  - method: POST
    path: "/touring/royalty-statements"
    description: "Open a royalty statement for a talent and period"
    roles: [ContractAdmin]
    code: 201
    input: [talent_id, period_start_date, period_end_date, basis_mode]
    output: RoyaltyStatement
    side_effects: ["initial recompute per calc royalty_line_split"]
  - method: GET
    path: "/touring/royalty-statements/{id}"
    description: "Fetch one statement"
    roles: [ContractAdmin]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: []
  - method: GET
    path: "/touring/royalty-statements"
    description: "List statements (reverse lookup by talent)"
    roles: [ContractAdmin]
    code: 200
    input: ["talent_id?", "event_id?", "status?", "limit?", "offset?"]
    output: RoyaltyStatement[]
    side_effects: []
  - method: POST
    path: "/touring/royalty-statements/{id}/recompute"
    description: "Recompute an OPEN statement's totals"
    roles: [ContractAdmin]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: ["recompute per calc royalty_line_split under basis_mode variant"]
  - method: POST
    path: "/touring/royalty-statements/{id}/finalize"
    description: "Finalize a FINAL-basis statement"
    roles: [ContractAdmin]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: ["OPEN -> FINALIZED", "statement frozen"]

  # ---- medical ----
  - method: POST
    path: "/touring/medical-cases"
    description: "Open a medical case; talent becomes INJURED and near-term bookings scratch"
    roles: [Medic]
    code: 201
    input: [talent_id, severity]
    output: MedicalCase
    side_effects: ["Talent ACTIVE -> INJURED", "near-term booking scratch cascade (INJURY_SCRATCH_HORIZON_DAYS = 30)", "storyline gap re-evaluation"]
  - method: GET
    path: "/touring/medical-cases/{id}"
    description: "Fetch one medical case"
    roles: [Medic]
    code: 200
    input: []
    output: MedicalCase
    side_effects: []
  - method: GET
    path: "/touring/medical-cases/{id}/evaluations"
    description: "Reverse lookup of evaluations for a case"
    roles: [Medic]
    code: 200
    input: []
    output: MedicalEvaluation[]
    side_effects: []
  - method: POST
    path: "/touring/medical-cases/{id}/evaluations"
    description: "Add a medical evaluation to an open case"
    roles: [Medic]
    code: 201
    input: [evaluator_id, findings, recommends_clearance]
    output: MedicalEvaluation
    side_effects: []
  - method: POST
    path: "/touring/medical-cases/{id}/clearances"
    description: "Issue clearance; requires 2 recommending evaluations and a different clearing medic"
    roles: [Medic]
    code: 201
    input: [cleared_by]
    output: MedicalClearance
    side_effects: ["MedicalCase OPEN -> CLEARED", "Talent INJURED -> ACTIVE", "booking_mode re-derived"]
  - method: GET
    path: "/touring/medical-cases/{id}/clearances"
    description: "Reverse lookup of clearances for a case (0 or 1)"
    roles: [Medic]
    code: 200
    input: []
    output: MedicalClearance[]
    side_effects: []

  # ---- visas ----
  - method: POST
    path: "/touring/visa-cases"
    description: "Open a visa case for international tour logistics"
    roles: [LogisticsCoordinator]
    code: 201
    input: [talent_id, country_code, required_by_date]
    output: VisaCase
    side_effects: []
  - method: GET
    path: "/touring/visa-cases/{id}"
    description: "Fetch one visa case"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: VisaCase
    side_effects: []
  - method: POST
    path: "/touring/visa-cases/{id}/submit"
    description: "Submit the visa application"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: VisaCase
    side_effects: ["DRAFT -> SUBMITTED"]
  - method: POST
    path: "/touring/visa-cases/{id}/grant"
    description: "Record visa grant"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: VisaCase
    side_effects: ["SUBMITTED -> GRANTED"]
  - method: POST
    path: "/touring/visa-cases/{id}/deny"
    description: "Record visa denial; scratches affected bookings"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: VisaCase
    side_effects: ["SUBMITTED -> DENIED", "booking scratch cascade", "storyline gap re-evaluation"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint, or entity_backed ownership check fails" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not resolve to an existing resource" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "Body FK id does not resolve to an existing resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, malformed date, end <= start, or non-positive quantity" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not permitted from the resource's current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the parent's current version" }
  - { id: ERR_EVENT_NOT_MUTABLE, http: 409, condition: "Event not in a state permitting booking/scratch, or statement not OPEN for recompute" }
  - { id: ERR_AGREEMENT_OVERLAP, http: 422, condition: "TalentAgreement half-open window overlaps another non-terminal agreement for the same talent" }
  - { id: ERR_ARENA_DATE_CONFLICT, http: 422, condition: "Arena already hosts an event on the same calendar date" }
  - { id: ERR_TALENT_DOUBLE_BOOKED, http: 422, condition: "Talent already BOOKED on an overlapping [start_time,end_time) event the same date" }
  - { id: ERR_ANCHOR_DATE_MISMATCH, http: 422, condition: "TELEVISION event date does not fall on the anchor's weekly_day_of_week (or anchor missing)" }
  - { id: ERR_TERRITORY_RIGHT_CONFLICT, http: 422, condition: "TerritoryRight overlaps an exclusive right, or same-partner same-territory overlap" }
  - { id: ERR_WINDOW_OVERLAP, http: 422, condition: "DistributionWindow violates LIVE/REPLAY timing or half-open overlap rules" }
  - { id: ERR_TERRITORY_NOT_LICENSED, http: 422, condition: "No ACTIVE partner TerritoryRight covers the window's territory and dates" }
  - { id: ERR_EVENT_NOT_PREMIUM, http: 422, condition: "DistributionWindow target event is not event_type == PREMIUM" }
  - { id: ERR_LIKENESS_NOT_GRANTED, http: 422, condition: "Talent lacks an ACTIVE agreement with likeness_rights_granted == true" }
  - { id: ERR_TALENT_UNBOOKABLE, http: 422, condition: "Talent.booking_mode UNBOOKABLE, or LIMITED on a non-HOUSE_SHOW event" }
  - { id: ERR_VISA_REQUIRED, http: 422, condition: "International event booking lacks a GRANTED visa covering the event date" }
  - { id: ERR_CLEARANCE_PROTOCOL_VIOLATION, http: 422, condition: "Fewer than 2 recommending evaluations, or clearing medic evaluated the case" }
  - { id: ERR_ROSTER_MINIMUM_UNMET, http: 422, condition: "Event lock blocked: BOOKED counts below roster_min_main or roster_min_total" }
  - { id: ERR_READINESS_THRESHOLD_UNMET, http: 422, condition: "Call-up PROMOTE with readiness_score < 60 or an OPEN medical case" }
  - { id: ERR_VISA_WINDOW_PASSED, http: 422, condition: "Visa submit/grant attempted after required_by_date" }
  - { id: ERR_MERCH_WINDOW_CLOSED, http: 422, condition: "Merch sale recorded against a COMPLETED or CANCELLED event" }
  - { id: ERR_STATEMENT_NOT_FINALIZABLE, http: 422, condition: "Finalize attempted on a PROVISIONAL-basis statement" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ContractAdmin
    description: "Owns talent agreements and royalty statements; operates the logical clock for sweeps"
    identity: "opaque"
    exclusive_operations:
      - "POST /touring/agreements"
      - "PATCH /touring/agreements/{id}"
      - "POST /touring/agreements/{id}/activate"
      - "POST /touring/agreements/{id}/terminate"
      - "POST /touring/royalty-statements"
      - "POST /touring/royalty-statements/{id}/recompute"
      - "POST /touring/royalty-statements/{id}/finalize"
      - "POST /touring/_clock/set_current_utc"
    shared_operations:
      - "GET /touring/agreements (shared with TalentRelations)"
      - "GET reads of talents, statements, merch-sales"
  - name: TourPlanner
    description: "Builds the touring calendar: arenas, anchors, events, bookings"
    identity: "opaque"
    exclusive_operations:
      - "POST /touring/arenas"
      - "POST /touring/broadcast-anchors"
      - "POST /touring/events"
      - "POST /touring/events/{id}/lock"
      - "POST /touring/events/{id}/complete"
      - "POST /touring/events/{id}/cancel"
      - "POST /touring/bookings"
      - "POST /touring/bookings/{id}/scratch"
      - "POST /touring/events/{event_id}/bookings/{id}/no-show"
    shared_operations:
      - "GET reads of talents, events, bookings, chapters"
  - name: TalentRelations
    description: "Manages talent roster, suspensions, call-ups"
    identity: "opaque"
    exclusive_operations:
      - "POST /touring/talents"
      - "POST /touring/talents/{id}/suspend"
      - "POST /touring/talents/{id}/reinstate"
      - "POST /touring/talents/{id}/call-up"
    shared_operations:
      - "GET reads of talents, events, bookings"
  - name: StorylineEditor
    description: "Owns storylines and chapters"
    identity: "opaque"
    exclusive_operations:
      - "POST /touring/storylines"
      - "POST /touring/storylines/{id}/activate"
      - "POST /touring/storylines/{id}/conclude"
      - "POST /touring/storylines/{id}/revive"
      - "POST /touring/chapters"
    shared_operations:
      - "GET reads of storylines, chapters, events, bookings"
  - name: DistributionManager
    description: "Owns streaming partners, territory rights, distribution windows"
    identity: "opaque"
    exclusive_operations:
      - "POST /touring/streaming-partners"
      - "POST /touring/territory-rights"
      - "POST /touring/distribution-windows"
      - "POST /touring/distribution-windows/{id}/publish"
      - "POST /touring/distribution-windows/{id}/revoke"
    shared_operations:
      - "GET reads of partners, rights, windows, events"
  - name: MerchOps
    description: "Records venue merchandise sales"
    identity: "opaque"
    exclusive_operations:
      - "POST /touring/merch-sales"
    shared_operations:
      - "GET reads of merch-sales, events, talents"
  - name: Medic
    description: "Medical staff; X-User-ID identifies the individual medic for segregation-of-duties checks on evaluations vs clearances"
    identity: "opaque"
    exclusive_operations:
      - "POST /touring/medical-cases"
      - "POST /touring/medical-cases/{id}/evaluations"
      - "POST /touring/medical-cases/{id}/clearances"
    shared_operations:
      - "GET reads of medical cases, evaluations, clearances, talents"
  - name: LogisticsCoordinator
    description: "International tour logistics and visa processing"
    identity: "opaque"
    exclusive_operations:
      - "POST /touring/visa-cases"
      - "POST /touring/visa-cases/{id}/submit"
      - "POST /touring/visa-cases/{id}/grant"
      - "POST /touring/visa-cases/{id}/deny"
    shared_operations:
      - "GET reads of visa cases, events, arenas, talents"
