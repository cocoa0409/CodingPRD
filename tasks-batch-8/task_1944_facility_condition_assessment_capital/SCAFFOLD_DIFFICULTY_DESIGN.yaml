              as: Consultant
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_CODE_SEVERITY_TOO_LOW (business_safety priority 8 precedes business_temporal priority 9)"
            - "no Deficiency row is created"

  - rule_id: boundary_precision_check
    instances:
      - name: fci_watch_threshold_exact_inclusion
        grounds:
          - calculations.plan_refresh_health
          - calculations.facility_condition_index
        distinguishing_aspect: |
          Numeric threshold boundary: facility_condition_index exactly 0.0500 must enter the WATCH
          band because the comparison is >= (not >) — a metric-precision boundary on the refresh-health
          computed read endpoint.
        test_recipe:
          setup:
            - "Facility F with one ACTIVE system replacement_cost_cents 1000000000 (CRV)"
            - "One OPEN deficiency cost_estimate_cents 50000000 -> FCI exactly 0.0500"
            - "Facility assessment_epoch 0, system last_assessed_epoch 0 -> no stale systems"
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "Lambda SpA", contact_email: "l@lambda.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
