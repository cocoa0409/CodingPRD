  - section: errors
    instances:
      - name: error_card_frozen
        claim_type: violation_to_error
        grounds: ["errors[ERR_CARD_FROZEN]"]
        excluded_because:
          difficulty_instance: frozen_card_state_beats_insufficient_funds
          rationale: "Asserted as the winning error of the state-vs-fiscal priority conflict."
      - name: error_insufficient_funds
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSUFFICIENT_FUNDS]"]
        excluded_because:
          difficulty_instance: purchase_at_exact_balance_boundary
          rationale: "Asserted as the losing-then-fired boundary error of the exact-balance instance."
      - name: error_fraud_hold
        claim_type: violation_to_error
        grounds: ["errors[ERR_FRAUD_HOLD]"]
        excluded_because:
          difficulty_instance: fraud_hold_beats_plan_change_window
          rationale: "Asserted as the winning error of the safety-vs-temporal priority conflict."
      - name: error_plan_change_window_closed
        claim_type: violation_to_error
        grounds: ["errors[ERR_PLAN_CHANGE_WINDOW_CLOSED]"]
        excluded_because:
          difficulty_instance: plan_change_deadline_boundary_second_precision
          rationale: "Fired one second past the add-drop deadline in the boundary instance."
      - name: error_term_not_open
        claim_type: violation_to_error
        grounds: ["errors[ERR_TERM_NOT_OPEN]"]
        excluded_because:
          difficulty_instance: enrollment_requires_term_open_or_scheduled
          rationale: "Fired when enrolling into a CLOSED term."
      - name: error_grant_overlap
        claim_type: violation_to_error
        grounds: ["errors[ERR_GRANT_OVERLAP]"]
        excluded_because:
          difficulty_instance: grant_half_open_overlap_adjacency
          rationale: "Fired by the intersecting grant in the half-open overlap instance."
      - name: error_settlement_period_overlap
        claim_type: violation_to_error
        grounds: ["errors[ERR_SETTLEMENT_PERIOD_OVERLAP]"]
        excluded_because:
          difficulty_instance: settlement_closed_closed_touch_overlap
          rationale: "Fired by the day-sharing period in the closed-closed overlap instance."
      - name: error_active_card_exists
        claim_type: violation_to_error
        grounds: ["errors[ERR_ACTIVE_CARD_EXISTS]"]
        excluded_because:
          difficulty_instance: replacement_single_active_card_conservation
          rationale: "Fired by the direct second issuance inside the card-count invariant instance."
      - name: error_card_not_active
        claim_type: violation_to_error
        grounds: ["errors[ERR_CARD_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: grant_reinstate_requires_card_active
          rationale: "Fired by grant reinstatement against a LOST_FROZEN card; also covered by card_expires_on_first_use_past_expiry in this file."

