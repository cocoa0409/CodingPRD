# =============================================================================
# PRD Benchmark Seed Tables — Motor Club Membership Tiers, Reciprocity &
# Service Limits (AAA-style federation)
# =============================================================================

scenario: |
  Motor Club Membership Tiers, Reciprocity & Service Limits (AAA): membership tiers
  determining tow mileage, service call counts and lockout benefits with household
  member coverage, club federation structure where a member of one regional club
  receives service nationwide with inter-club billing, service call dispatch to
  contracted and owned providers with arrival time targets, benefit limit
  enforcement including annual call caps and mileage overage billing, membership
  upgrade at time of service with waiting periods to prevent adverse selection,
  ancillary services including travel agency, insurance agency and identity
  protection sold to members, battery and mobile service programs with parts
  inventory on trucks, membership renewal and lapse reinstatement rules.

domain_name: motor-club-reciprocity
api_prefix: /motor-club

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - selector_policy
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED — do not modify)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Club
    parent: null
    common_fields: true
    fields:
      - { name: club_code, type: string, source: input, description: "Unique federation club code, e.g. NCA", constraints: "unique across Club" }
      - { name: name, type: string, source: input, description: "Regional club display name" }
      - { name: territory_state_codes, type: array, source: input, description: "Array of 2-letter state codes this club's territory covers; every dispatch location resolves to exactly one servicing club via these lists" }
      - { name: default_arrival_target_minutes, type: integer, source: input, description: "Arrival-time target applied to dispatches serviced by this club unless a stricter contract overrides", constraints: ">= 1" }
      - { name: billing_policy, type: enum, source: input, description: "SCHEDULE | ACTUAL; selects the interclub_line_amount variant this club bills when servicing foreign members", default: "SCHEDULE" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; SUSPENDED clubs cannot own new memberships nor service dispatches" }

  - name: MembershipTier
    parent: null
    common_fields: true
    fields:
      - { name: code, type: enum, source: input, description: "CLASSIC | PLUS | PREMIER", constraints: "unique across MembershipTier" }
      - { name: annual_dues_cents, type: integer, source: input, description: "Primary-member annual dues in cents", constraints: ">= 0" }
      - { name: included_tow_miles, type: integer, source: input, description: "Per-call tow miles covered before overage billing", constraints: ">= 0" }
      - { name: annual_call_cap, type: integer, source: input, description: "Maximum benefit-eligible service calls per member per membership term (rolling 365-day term, not calendar)", constraints: ">= 1" }
      - { name: lockout_benefit_cents, type: integer, source: input, description: "Reimbursement ceiling for LOCKOUT service type in cents", constraints: ">= 0" }
      - { name: battery_service_included, type: boolean, source: input, description: "Whether BATTERY service calls consume no per-call battery surcharge" }
      - { name: household_member_price_cents, type: integer, source: input, description: "Annual dues per household member in cents", constraints: ">= 0" }
      - { name: overage_rate_cents_per_mile, type: integer, source: input, description: "Per-mile rate for tow miles beyond included_tow_miles", constraints: ">= 0" }
      - { name: upgrade_waiting_days, type: integer, source: input, description: "Days an upgrade to this tier must wait before new-tier benefits apply to PRE-EXISTING service needs (anti-adverse-selection)", constraints: ">= 0" }
      - { name: rank, type: integer, source: input, description: "Tier ordering for upgrade/downgrade: CLASSIC=1, PLUS=2, PREMIER=3; higher rank is an upgrade", constraints: "unique across MembershipTier" }

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - { name: home_club_id, type: string, source: input, description: "FK -> Club.id; owning club for billing and renewal" }
      - { name: primary_member_name, type: string, source: input, description: "Full legal name of the primary member" }
      - { name: primary_member_email, type: string, source: input, description: "Contact email", constraints: "unique across Membership" }
      - { name: tier_code, type: enum, source: system, description: "Current tier code: CLASSIC | PLUS | PREMIER; set from tier input at creation and mutated by upgrade/downgrade actions" }
      - { name: status, type: enum, source: system, description: "ACTIVE | GRACE | LAPSED | REINSTATED | CANCELLED" }
      - { name: enrolled_at, type: datetime, source: system, description: "Server-stamped enrollment timestamp (logical clock)" }
      - { name: term_start_date, type: datetime, source: system, description: "Start of the current rolling 365-day benefit term" }
      - { name: term_end_date, type: datetime, source: system, description: "End (exclusive) of the current term; term_end_date = term_start_date + 365 days" }
      - { name: lapse_at, type: datetime, source: system, description: "Timestamp membership entered LAPSED; null when never lapsed; nulled again on reinstatement", default: null }
      - { name: reinstatement_count, type: integer, source: system, description: "Number of successful reinstatements", default: 0 }
      - { name: calls_used_current_term, type: integer, source: system, description: "Count of service calls completed as benefit-eligible in the current term, across primary + household members", default: 0 }
      - { name: account_credit_cents, type: integer, source: system, description: "Member credit balance in cents (negative = amount owed to club)", default: 0 }
      - { name: tier_upgrade_effective_at, type: datetime, source: system, description: "Timestamp the most recent upgrade's benefits became effective for pre-existing needs (= upgraded_at + upgrade_waiting_days of new tier); null when no upgrade ever made", default: null }
      - { name: version, type: integer, source: system, description: "OCC guard; increments on every membership mutation" }

  - name: HouseholdMember
    parent: null
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; household account this member rides on" }
      - { name: full_name, type: string, source: input, description: "Household member name" }
      - { name: relationship, type: enum, source: input, description: "SPOUSE | CHILD | PARENT | OTHER" }
      - { name: is_primary, type: boolean, source: input, description: "True marks the household row that represents the primary member (so the primary can request service); at most one per membership", default: false }
      - { name: date_of_birth, type: datetime, source: input, description: "ISO date; used to enforce CHILD age bound" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REMOVED" }

  - name: MembershipEvent
    parent: null
    common_fields: false
    fields:
      - { name: membership_id, type: string, source: system, description: "FK -> Membership.id; subject membership" }
      - { name: event_type, type: enum, source: system, description: "ENROLLMENT | UPGRADE | DOWNGRADE | RENEWAL | LAPSE | REINSTATEMENT | CANCELLATION | WAITING_PERIOD_SATISFIED" }
      - { name: from_tier, type: string, source: system, description: "Tier before the event; null for ENROLLMENT", default: null }
      - { name: to_tier, type: string, source: system, description: "Tier after the event; null when not tier-changing", default: null }
      - { name: effective_at, type: datetime, source: system, description: "Logical-clock timestamp when the event took effect" }
      - { name: note, type: string, source: system, description: "Free-text audit note", default: "" }

  - name: ServiceProvider
    parent: null
    common_fields: true
    fields:
      - { name: servicing_club_id, type: string, source: input, description: "FK -> Club.id; club that contracts/owns this provider" }
      - { name: name, type: string, source: input, description: "Provider display name" }
      - { name: provider_kind, type: enum, source: input, description: "OWNED | CONTRACTED; OWNED fleets belong to the club, CONTRACTED are third-party" }
      - { name: capabilities, type: array, source: input, description: "Array of service types the provider can perform: TOW | BATTERY | LOCKOUT | TIRE | FUEL | WINCH" }
      - { name: home_base_state_code, type: string, source: input, description: "2-letter state code of the provider's base; eligibility requires this code ∈ servicing club's territory list" }
      - { name: sla_multiplier, type: number, source: input, description: "Provider-specific SLA stretch factor; effective arrival target = club default x sla_multiplier, rounded half-up to whole minutes", constraints: ">= 0.5 and <= 3.0" }
      - { name: shift_start_minute, type: integer, source: input, description: "Minute-of-day (0-1439) the provider's daily availability window opens", constraints: "0..1439" }
      - { name: shift_end_minute, type: integer, source: input, description: "Minute-of-day (0-1439) the provider's daily availability window closes; equal to shift_start_minute means 24x7", constraints: "0..1439" }
      - { name: max_concurrent_dispatches, type: integer, source: input, description: "Aggregate capacity: maximum non-terminal dispatches the provider may hold at once", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: TruckPartStock
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> ServiceProvider.id; truck fleet carrying this part stock" }
      - { name: part_sku, type: string, source: input, description: "Part identifier, e.g. BAT-G24", constraints: "unique per provider_id (composite uniqueness)" }
      - { name: part_kind, type: enum, source: input, description: "BATTERY | TIRE | FUEL_CAN | LOCKSMITH_KIT" }
      - { name: quantity_on_hand, type: integer, source: system, description: "Current truck stock; decremented only by confirmed part sales on completed dispatches", default: 0 }
      - { name: reorder_level, type: integer, source: input, description: "Restock trigger level for reporting", default: 0 }

  - name: ServiceCall
    parent: null
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; the membership (home club) whose benefits apply" }
      - { name: requesting_member_id, type: string, source: input, description: "FK -> HouseholdMember.id; the covered person requesting service — the primary member is represented by a HouseholdMember row with is_primary = true; must be ACTIVE and belong to membership_id" }
      - { name: service_type, type: enum, source: input, description: "TOW | BATTERY | LOCKOUT | TIRE | FUEL | WINCH" }
      - { name: breakdown_location_state, type: string, source: input, description: "2-letter state code where the vehicle is disabled; determines the SERVICING club by territory lookup" }
      - { name: servicing_club_id, type: string, source: system, description: "FK -> Club.id; resolved at creation from breakdown_location_state via territory lists" }
      - { name: is_pre_existing_need, type: boolean, source: system, description: "Computed at creation: true when the membership has a pending upgrade waiting period (now < tier_upgrade_effective_at); a pre-existing need is served at the PRE-UPGRADE tier's benefits" }
      - { name: benefit_tier_code, type: enum, source: system, description: "Tier actually applied to this call: current tier, or the pre-upgrade tier when is_pre_existing_need is true" }
      - { name: requested_tow_miles, type: integer, source: input, description: "Requested tow distance in whole miles; required for TOW, ignored otherwise", default: 0 }
      - { name: benefit_eligible, type: boolean, source: system, description: "False when the term call cap is already exhausted at creation; the call may still be dispatched as member-pay" }
      - { name: status, type: enum, source: system, description: "REQUESTED | DISPATCHED | EN_ROUTE | ON_SCENE | COMPLETED | CANCELLED | EXPIRED" }
      - { name: cancel_reason, type: enum, source: system, description: "NONE | MEMBER_REQUEST | NO_PROVIDER | DUPLICATE; set on CANCELLED", default: "NONE" }
      - { name: version, type: integer, source: system, description: "OCC guard for dispatch supersession" }

  - name: Dispatch
    parent: null
    common_fields: true
    fields:
      - { name: service_call_id, type: string, source: input, description: "FK -> ServiceCall.id; exactly one non-terminal dispatch per call" }
      - { name: provider_id, type: string, source: system, description: "FK -> ServiceProvider.id; server-selected provider (see dispatch_provider_selection calculation)" }
      - { name: sequence_number, type: integer, source: system, description: "1-based dispatch attempt number for the call; increments on each redispatch after failure/cancel" }
      - { name: assigned_at, type: datetime, source: system, description: "Logical-clock timestamp of assignment" }
      - { name: promised_arrive_by, type: datetime, source: system, description: "assigned_at + effective arrival target minutes (club default x provider sla_multiplier, round half-up)" }
      - { name: arrived_at, type: datetime, source: system, description: "Set on ARRIVED transition", default: null }
      - { name: completed_at, type: datetime, source: system, description: "Set on COMPLETED transition", default: null }
      - { name: sla_met, type: boolean, source: system, description: "Computed at ARRIVED: arrived_at <= promised_arrive_by", default: null }
      - { name: dispatched_tow_miles, type: integer, source: system, description: "Tow miles committed at dispatch (copied from the call's requested_tow_miles for TOW)", default: 0 }
      - { name: provisional_mileage_charge_cents, type: integer, source: system, description: "Forward-looking overage estimate at assignment per mileage_overage provisional variant (requested miles basis); preview only, never posted", default: 0 }
      - { name: actual_tow_miles, type: integer, source: input, description: "Final tow miles recorded at completion; required input on the complete action for TOW dispatches", default: 0 }
      - { name: parts_used, type: array, source: input, description: "Array of {part_sku, quantity} consumed on completion (battery/mobile service programs)", default: [] }
      - { name: parts_charge_cents, type: integer, source: system, description: "Sum over parts_used of per-part price from the parts price book (completion_member_charge constants), computed at completion", default: 0 }
      - { name: mileage_charge_cents, type: integer, source: system, description: "Tow overage charge computed at completion (0 when benefit covers all miles or non-TOW)", default: 0 }
      - { name: total_member_charge_cents, type: integer, source: system, description: "parts_charge_cents + mileage_charge_cents when benefit_eligible; full price-book charge when member-pay", default: 0 }
      - { name: status, type: enum, source: system, description: "ASSIGNED | ACCEPTED | EN_ROUTE | ARRIVED | COMPLETED | FAILED | CANCELLED" }
      - { name: failure_reason, type: enum, source: system, description: "NONE | PROVIDER_DECLINED | NO_PARTS | MEMBER_NO_SHOW; set on FAILED", default: "NONE" }

  - name: SettlementPeriod
    parent: null
    common_fields: true
    fields:
      - { name: servicing_club_id, type: string, source: input, description: "FK -> Club.id; the club that performed service and is owed reimbursement" }
      - { name: period_start_date, type: datetime, source: input, description: "Inclusive start of the settlement window (ISO date at 00:00:00Z)" }
      - { name: period_end_date, type: datetime, source: input, description: "Exclusive end of the settlement window" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | ASSESSED" }
      - { name: closed_by, type: string, source: system, description: "X-User-ID of the SettlementClerk who closed the period; recorded at close for segregation-of-duties enforcement at assess", default: "" }
      - { name: total_foreign_call_count, type: integer, source: system, description: "Count of included foreign calls at CLOSE", default: 0 }
      - { name: total_gross_cents, type: integer, source: system, description: "Sum of included gross_amount_cents at CLOSE", default: 0 }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock close timestamp", default: null }

  - name: SettlementLine
    parent: null
    common_fields: true
    fields:
      - { name: settlement_period_id, type: string, source: system, description: "FK -> SettlementPeriod.id; set when swept into a period close; null while unswept", default: null }
      - { name: service_call_id, type: string, source: system, description: "FK -> ServiceCall.id; the foreign call this line reimburses" }
      - { name: home_club_id, type: string, source: system, description: "FK -> Club.id; debtor club (member's home club)" }
      - { name: servicing_club_id, type: string, source: system, description: "FK -> Club.id; creditor club (must equal the period's servicing club on sweep)" }
      - { name: gross_amount_cents, type: integer, source: system, description: "Amount billed to the home club for this call (schedule-based or actual — see interclub_line_amount)" }
      - { name: excluded, type: boolean, source: system, description: "True when the call was cancelled/expired before completion or was member-pay; excluded lines are never swept", default: false }
      - { name: exclusion_reason, type: string, source: system, description: "Why excluded (e.g. CALL_NOT_COMPLETED, MEMBER_PAY)", default: "" }
      - { name: assessed_fee_cents, type: integer, source: system, description: "Federation assessment on this line at period ASSESS", default: 0 }
      - { name: assessed_net_cents, type: integer, source: system, description: "gross_amount_cents - assessed_fee_cents at period ASSESS", default: 0 }
      - { name: status, type: enum, source: system, description: "PENDING | SWEPT | ASSESSED | REVERSED" }

  - name: AncillaryProduct
    parent: null
    common_fields: true
    fields:
      - { name: product_type, type: enum, source: input, description: "TRAVEL_AGENCY | INSURANCE_AGENCY | IDENTITY_PROTECTION" }
      - { name: name, type: string, source: input, description: "Product display name", constraints: "unique per product_type" }
      - { name: price_cents, type: integer, source: input, description: "Annual price in cents", constraints: ">= 0" }
      - { name: min_tier_code, type: enum, source: input, description: "Minimum membership tier rank required to purchase: CLASSIC | PLUS | PREMIER" }
      - { name: commission_bps, type: integer, source: input, description: "Agent commission in basis points of price_cents", constraints: "0..5000" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED" }

  - name: AncillarySale
    parent: null
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; purchasing membership (must be ACTIVE or REINSTATED)" }
      - { name: product_id, type: string, source: input, description: "FK -> AncillaryProduct.id; product purchased (must be ACTIVE)" }
      - { name: sold_by_agent_id, type: string, source: input, description: "X-User-ID of the selling Agent (audit; opaque)" }
      - { name: price_cents, type: integer, source: system, description: "Price snapshot from product at sale time" }
      - { name: commission_cents, type: integer, source: system, description: "round_half_up(price_cents x commission_bps / 10000)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REFUNDED" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Membership
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: GRACE
        trigger: "POST /motor-club/_clock/set_current_utc advancing the logical clock to > term_end_date while renewal is unpaid (system sweep on clock set)"
        actor: system
        preconditions:
          - "logical now > Membership.term_end_date"
        side_effects:
          - "append MembershipEvent LAPSE with note GRACE_ENTERED (30-day grace opens)"
      - from: GRACE
        to: ACTIVE
        trigger: "POST /motor-club/memberships/{membershipId}/renew"
        actor: MemberServicesRep
        preconditions:
          - "logical now <= lapse_at-equivalent grace deadline: term_end_date + 30 days"
        side_effects:
          - "term_start_date = old term_end_date; term_end_date = term_start_date + 365 days"
          - "calls_used_current_term resets to 0"
          - "append MembershipEvent RENEWAL"
      - from: GRACE
        to: LAPSED
        trigger: "POST /motor-club/_clock/set_current_utc advancing the logical clock to > term_end_date + 30 days (system sweep on clock set)"
        actor: system
        preconditions:
          - "logical now > term_end_date + 30 days"
        side_effects:
          - "lapse_at = logical now"
          - "append MembershipEvent LAPSE with note LAPSED"
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /motor-club/memberships/{membershipId}/lapse (administrative lapse for non-payment without grace)"
        actor: MemberServicesRep
        preconditions:
          - "membership has no non-terminal ServiceCall (REQUESTED|DISPATCHED|EN_ROUTE|ON_SCENE) — else ERR_OPEN_SERVICE_CALLS"
        side_effects:
          - "lapse_at = logical now"
          - "append MembershipEvent LAPSE with note ADMIN_LAPSE"
      - from: LAPSED
        to: REINSTATED
        trigger: "POST /motor-club/memberships/{membershipId}/reinstate"
        actor: MemberServicesRep
        preconditions:
          - "logical now <= lapse_at + 90 days — else ERR_REINSTATEMENT_WINDOW_EXPIRED"
          - "payment of full new-term dues captured (dues_paid: true in request)"
        side_effects:
          - "term_start_date = logical now; term_end_date = term_start_date + 365 days"
          - "calls_used_current_term resets to 0"
          - "reinstatement_count += 1; lapse_at = null"
          - "append MembershipEvent REINSTATEMENT"
      - from: REINSTATED
        to: ACTIVE
        trigger: "POST /motor-club/memberships/{membershipId}/renew"
        actor: MemberServicesRep
        preconditions:
          - "logical now > term_end_date is NOT required for REINSTATED renewal; renewing early is allowed but the new term still starts at the old term_end_date"
        side_effects:
          - "term_start_date = old term_end_date; term_end_date = term_start_date + 365 days"
          - "calls_used_current_term resets to 0"
          - "status becomes ACTIVE"
          - "append MembershipEvent RENEWAL"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /motor-club/memberships/{membershipId}/cancel"
        actor: MemberServicesRep
        preconditions:
          - "no non-terminal ServiceCall (REQUESTED|DISPATCHED|EN_ROUTE|ON_SCENE) — else ERR_OPEN_SERVICE_CALLS"
        side_effects:
          - "all ACTIVE HouseholdMember rows -> REMOVED"
          - "all ACTIVE AncillarySale rows for the membership -> REFUNDED with commission reversal (see ancillary_refund calculation)"
          - "append MembershipEvent CANCELLATION"
      - from: GRACE
        to: CANCELLED
        trigger: "POST /motor-club/memberships/{membershipId}/cancel"
        actor: MemberServicesRep
        preconditions:
          - "no non-terminal ServiceCall — else ERR_OPEN_SERVICE_CALLS"
        side_effects:
          - "same cascade as ACTIVE->CANCELLED"
      - from: REINSTATED
        to: CANCELLED
        trigger: "POST /motor-club/memberships/{membershipId}/cancel"
        actor: MemberServicesRep
        preconditions:
          - "no non-terminal ServiceCall — else ERR_OPEN_SERVICE_CALLS"
        side_effects:
          - "same cascade as ACTIVE->CANCELLED"

  - entity: ServiceCall
    field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: DISPATCHED
        trigger: "POST /motor-club/service-calls/{callId}/dispatch"
        actor: Dispatcher
        preconditions:
          - "membership status IN {ACTIVE, REINSTATED, GRACE} — LAPSED/CANCELLED memberships get ERR_MEMBERSHIP_NOT_SERVICEABLE (GRACE calls are always member-pay: benefit_eligible forced false)"
          - "requesting HouseholdMember is ACTIVE and belongs to the call's membership — else ERR_MEMBER_NOT_COVERED"
          - "benefit_tier_code already resolved at creation (waiting-period rule)"
          - "expected_service_call_version matches current version (OCC)"
        side_effects:
          - "server runs dispatch_provider_selection; empty candidate pool -> no Dispatch created and call transitions REQUESTED->CANCELLED with cancel_reason NO_PROVIDER (compensation: benefit eligibility not consumed)"
          - "creates Dispatch(sequence_number = 1 + count of prior dispatches for this call, status ASSIGNED)"
          - "promised_arrive_by set per effective_arrival_target calculation"
          - "provisional_mileage_charge_cents set per mileage_overage provisional variant (preview only, not posted)"
          - "increments ServiceCall.version by 1"
      - from: DISPATCHED
        to: EN_ROUTE
        trigger: "POST /motor-club/dispatches/{dispatchId}/accept (provider accepted and rolling)"
        actor: ProviderOps
        preconditions:
          - "dispatch status = ASSIGNED or ACCEPTED"
        side_effects:
          - "dispatch status -> EN_ROUTE"
      - from: EN_ROUTE
        to: ON_SCENE
        trigger: "POST /motor-club/dispatches/{dispatchId}/arrive"
        actor: ProviderOps
        preconditions:
          - "dispatch status = EN_ROUTE"
        side_effects:
          - "dispatch status -> ARRIVED; arrived_at = logical now"
          - "sla_met = (arrived_at <= promised_arrive_by)"
      - from: ON_SCENE
        to: COMPLETED
        trigger: "POST /motor-club/dispatches/{dispatchId}/complete"
        actor: ProviderOps
        preconditions:
          - "dispatch status = ARRIVED"
          - "every part_sku in parts_used exists in the provider's TruckPartStock with quantity_on_hand >= requested quantity — else ERR_INSUFFICIENT_TRUCK_STOCK (dispatch stays ARRIVED; provider must retry with corrected parts or fail the dispatch)"
          - "for TOW calls actual_tow_miles >= 1 — else ERR_INVALID_REQUEST"
        side_effects:
          - "dispatch status -> COMPLETED; completed_at = logical now"
          - "decrement TruckPartStock.quantity_on_hand per parts_used (skip silently when parts_used empty)"
          - "run mileage_overage (final variant) and completion_member_charge calculations; set mileage_charge_cents, parts_charge_cents, total_member_charge_cents"
          - "when benefit_eligible: membership.calls_used_current_term += 1 (cap consumption happens at COMPLETION, not dispatch)"
          - "member charge posted to Membership.account_credit_cents (debit: balance decreases by total_member_charge_cents)"
          - "cross-club: when membership.home_club_id != call.servicing_club_id AND benefit_eligible, create SettlementLine(status PENDING, gross per interclub_line_amount); when member-pay (not benefit_eligible) create SettlementLine with excluded=true, exclusion_reason MEMBER_PAY"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /motor-club/service-calls/{callId}/cancel"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "cancel_reason = MEMBER_REQUEST unless server-driven NO_PROVIDER"
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /motor-club/service-calls/{callId}/cancel"
        actor: Dispatcher
        preconditions:
          - "the call's non-terminal dispatch is in ASSIGNED or ACCEPTED (once EN_ROUTE the member owes a service attempt; cancel is rejected ERR_DISPATCH_BEYOND_CANCEL)"
        side_effects:
          - "linked dispatch -> CANCELLED (frees provider capacity)"
          - "cancel_reason = MEMBER_REQUEST"
      - from: DISPATCHED
        to: REQUESTED
        trigger: "POST /motor-club/dispatches/{dispatchId}/fail then POST /motor-club/service-calls/{callId}/dispatch (dispatch failure loops the call back for redispatch; cyclic)"
        actor: ProviderOps
        preconditions:
          - "failed dispatch's failure_reason recorded"
        side_effects:
          - "call returns to REQUESTED; next dispatch gets sequence_number + 1 and re-runs provider selection with the failed provider excluded from THIS retry's candidate pool"
      - from: REQUESTED
        to: EXPIRED
        trigger: "POST /motor-club/_clock/set_current_utc advancing the logical clock to > created_at + 24 hours while still REQUESTED (system sweep on clock set)"
        actor: system
        preconditions:
          - "logical now > ServiceCall.created_at + 24 hours"
        side_effects:
          - "no benefit consumed; no settlement line created"

  - entity: Dispatch
    field: status
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, FAILED, CANCELLED]
    transitions:
      - from: ASSIGNED
        to: ACCEPTED
        trigger: "POST /motor-club/dispatches/{dispatchId}/accept"
        actor: ProviderOps
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: EN_ROUTE
        trigger: "POST /motor-club/dispatches/{dispatchId}/accept with en_route: true (provider rolling)"
        actor: ProviderOps
        preconditions: []
        side_effects: []
      - from: EN_ROUTE
        to: ARRIVED
        trigger: "POST /motor-club/dispatches/{dispatchId}/arrive"
        actor: ProviderOps
        preconditions: []
        side_effects:
          - "arrived_at = logical now; sla_met computed"
      - from: ARRIVED
        to: COMPLETED
        trigger: "POST /motor-club/dispatches/{dispatchId}/complete"
        actor: ProviderOps
        preconditions:
          - "TruckPartStock sufficiency for parts_used (ERR_INSUFFICIENT_TRUCK_STOCK)"
        side_effects:
          - "see ServiceCall ON_SCENE->COMPLETED (the completing transition mutates both entities atomically)"
      - from: ASSIGNED
        to: FAILED
        trigger: "POST /motor-club/dispatches/{dispatchId}/fail"
        actor: ProviderOps
        preconditions: []
        side_effects:
          - "parent ServiceCall DISPATCHED->REQUESTED (redispatch loop); provider excluded from the immediate retry's candidate pool"
      - from: ACCEPTED
        to: FAILED
        trigger: "POST /motor-club/dispatches/{dispatchId}/fail"
        actor: ProviderOps
        preconditions: []
        side_effects:
          - "same as ASSIGNED->FAILED"
      - from: EN_ROUTE
        to: FAILED
        trigger: "POST /motor-club/dispatches/{dispatchId}/fail"
        actor: ProviderOps
        preconditions: []
        side_effects:
          - "same as ASSIGNED->FAILED"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "parent ServiceCall cancel (cascade)"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "frees one slot of provider concurrency capacity"
      - from: ACCEPTED
        to: CANCELLED
        trigger: "parent ServiceCall cancel (cascade)"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "frees one slot of provider concurrency capacity"

  - entity: SettlementPeriod
    field: status
    initial_state: OPEN
    terminal_states: [ASSESSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /motor-club/settlement-periods/{periodId}/close"
        actor: SettlementClerk
        preconditions:
          - "logical now >= period_end_date — closing before window end is ERR_PERIOD_NOT_CLOSABLE"
        side_effects:
          - "sweep: every SettlementLine with servicing_club_id = period.servicing_club_id AND excluded = false AND status = PENDING AND its ServiceCall completed_at within [period_start_date, period_end_date) -> SWEPT and settlement_period_id set"
          - "total_foreign_call_count / total_gross_cents computed over swept lines"
          - "closed_at = logical now"
      - from: CLOSED
        to: ASSESSED
        trigger: "POST /motor-club/settlement-periods/{periodId}/assess"
        actor: FederationFinance
        preconditions:
          - "period status = CLOSED"
          - "segregation of duties: the assessing FederationFinance user's X-User-ID must differ from the closing clerk's recorded closer id — else ERR_SOD_CONFLICT"
        side_effects:
          - "per swept line: assessed_fee_cents = round_half_up(gross_amount_cents x 0.045); assessed_net_cents = gross - fee; line status -> ASSESSED"
          - "closed_by recorded at close is compared against the assessor's X-User-ID for SoD"
      - from: OPEN
        to: OPEN
        trigger: "n/a (no self-transition; listed to pin that OPEN periods reject assess with ERR_INVALID_STATE)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SettlementLine
    field: status
    initial_state: PENDING
    terminal_states: [ASSESSED, REVERSED]
    transitions:
      - from: PENDING
        to: SWEPT
        trigger: "SettlementPeriod close sweep (cascade)"
        actor: system
        preconditions:
          - "line excluded = false AND call completed_at inside the period window"
        side_effects: []
      - from: SWEPT
        to: ASSESSED
        trigger: "SettlementPeriod assess (cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "assessed_fee_cents / assessed_net_cents set"
      - from: PENDING
        to: REVERSED
        trigger: "POST /motor-club/settlement-lines/{lineId}/reverse (home club disputes the line before it is swept)"
        actor: FederationFinance
        preconditions:
          - "line status = PENDING — a SWEPT or ASSESSED line cannot be reversed (ERR_LINE_ALREADY_SWEPT)"
        side_effects:
          - "line permanently excluded from all future sweeps"

  - entity: AncillarySale
    field: status
    initial_state: ACTIVE
    terminal_states: [REFUNDED]
    transitions:
      - from: ACTIVE
        to: REFUNDED
        trigger: "POST /motor-club/ancillary-sales/{saleId}/refund"
        actor: Agent
        preconditions:
          - "logical now <= sale.created_at + 30 days — else ERR_REFUND_WINDOW_EXPIRED"
          - "the refunding Agent's X-User-ID must equal the sale's sold_by_agent_id OR the caller is MemberServicesRep — an Agent cannot refund another Agent's sale (ERR_SOD_CONFLICT)"
        side_effects:
          - "commission_cents reversal posted to agent ledger (reporting)"
          - "membership.account_credit_cents increases by price_cents (refund credit)"

  - entity: HouseholdMember
    field: status
    initial_state: ACTIVE
    terminal_states: [REMOVED]
    transitions:
      - from: ACTIVE
        to: REMOVED
        trigger: "DELETE /motor-club/household-members/{memberId} or parent Membership cancel cascade"
        actor: MemberServicesRep
        preconditions:
          - "household member has no non-terminal ServiceCall as requesting member — else ERR_OPEN_SERVICE_CALLS"
        side_effects:
          - "membership.account_credit_cents prorated credit per household_proration calculation when removal happens mid-term"

  - entity: ServiceProvider
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PUT /motor-club/providers/{providerId} with status SUSPENDED"
        actor: ClubAdmin
        preconditions:
          - "provider has no non-terminal dispatch — else ERR_PROVIDER_BUSY"
        side_effects:
          - "provider excluded from all future dispatch candidate pools"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PUT /motor-club/providers/{providerId} with status ACTIVE"
        actor: ClubAdmin
        preconditions:
          - "provider's servicing club is ACTIVE — else ERR_CLUB_SUSPENDED"
        side_effects: []

# =============================================================================
# 1.2.1: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: membership-upgrade-stale-version
    parent_entity: Membership
    write_endpoint: "POST /motor-club/memberships/{membershipId}/upgrade"
    occ_field: expected_membership_version
    description: |
      Upgrading a Membership whose version has advanced since the client last
      observed it is rejected. Captures the case where another writer changed
      tier-affecting state (a prior upgrade, renewal, or tier mutation) so the
      current writer's proration and waiting-period basis is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: service-call-dispatch-stale-version
    parent_entity: ServiceCall
    write_endpoint: "POST /motor-club/service-calls/{callId}/dispatch"
    occ_field: expected_service_call_version
    description: |
      Dispatching a ServiceCall whose version has advanced since the client last
      observed it is rejected. Captures the case where a prior dispatch attempt
      or benefit-affecting mutation already consumed the call's dispatchable
      state, making the current writer's view stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: membership-downgrade-stale-version
    parent_entity: Membership
    write_endpoint: "POST /motor-club/memberships/{membershipId}/downgrade"
    occ_field: expected_membership_version
    description: |
      Downgrading a Membership whose version has advanced since the client last
      observed it is rejected, because the proration credit basis (term dates and
      tier) may have shifted under the writer.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: mileage_overage
    description: "Tow overage charge for a completed TOW dispatch; dual-variant (forward-looking estimate at dispatch vs chronological actual at completion)"
    trigger: "Dispatch ASSIGNED (provisional variant) and Dispatch ARRIVED->COMPLETED (final variant)"
    algorithm: threshold
    formula: |
      Constants: courtesy bonus B = 3 miles (all tiers).
      tier = ServiceCall.benefit_tier_code -> MembershipTier row.
      included = tier.included_tow_miles.
      rate = tier.overage_rate_cents_per_mile.
      effective_miles = max(0, miles - B)          # courtesy bonus subtracted first
      overage_miles = max(0, effective_miles - included)
      charge_cents = overage_miles * rate
      # member-pay calls (benefit_eligible = false) instead charge the FULL
      # effective_miles * rate with no included-mile deduction.
    input_set: "The completing dispatch's miles; the benefit tier resolved at call creation (NOT the membership's current tier — tier pinned at creation)"
    constants:
      COURTESY_BONUS_MILES: 3
    precision: "integer cents; no rounding needed (all factors integers)"
    variants:
      - name: provisional_estimate
        when: "at dispatch assignment (ASSIGNED)"
        difference: "uses ServiceCall.requested_tow_miles as `miles`; result stored for the dispatch preview response only, never posted to account_credit_cents"
      - name: final_actual
        when: "at completion (ARRIVED->COMPLETED)"
        difference: "uses Dispatch.actual_tow_miles as `miles`; result posted to account_credit_cents and used for SettlementLine gross on the ACTUAL basis when servicing club policy is ACTUAL (see interclub_line_amount)"

  - name: dispatch_provider_selection
    description: "Selector policy choosing exactly one provider for a dispatch attempt"
    trigger: "ServiceCall REQUESTED->DISPATCHED (including redispatch after failure)"
    algorithm: constraint_propagation
    formula: |
      Candidate pool = ServiceProvider rows where ALL of:
        (a) status = ACTIVE
        (b) servicing_club_id = ServiceCall.servicing_club_id
        (c) ServiceCall.service_type IN provider.capabilities
        (d) provider.home_base_state_code IN servicing club.territory_state_codes
        (e) open_window: minute-of-day(logical now) within [shift_start_minute, shift_end_minute)
            — half-open interval; when shift_start_minute == shift_end_minute the provider is 24x7 (always eligible)
        (f) current non-terminal dispatch count (status IN {ASSIGNED, ACCEPTED, EN_ROUTE, ARRIVED}) < max_concurrent_dispatches
        (g) retry exclusion: on a redispatch immediately following a FAILED dispatch, the failed provider_id is excluded for THIS attempt only
      Ranking: (1) provider_kind OWNED before CONTRACTED; (2) smaller current non-terminal dispatch count first; (3) earlier created_at first. id NEVER participates.
      Fallback: empty pool -> ServiceCall auto-cancels with cancel_reason NO_PROVIDER (no Dispatch row created).
    input_set: "All ServiceProvider rows for the servicing club"
    constants: {}
    precision: "n/a (selection, not arithmetic)"

  - name: effective_arrival_target
    description: "Promised arrival window for an assigned dispatch"
    trigger: "Dispatch creation"
    algorithm: threshold
    formula: |
      target_minutes = round_half_up(servicing_club.default_arrival_target_minutes * provider.sla_multiplier)
      promised_arrive_by = assigned_at + target_minutes minutes
      sla_met (at ARRIVED) = arrived_at <= promised_arrive_by   # exact-boundary inclusive
    input_set: "Servicing club default + selected provider multiplier"
    constants: {}
    precision: "whole minutes, round_half_up"

  - name: interclub_line_amount
    description: "Gross reimbursement amount the home club owes the servicing club for a foreign benefit-eligible call; dual-variant by servicing-club policy"
    trigger: "Dispatch completion creating a SettlementLine"
    algorithm: tiered_pricing
    formula: |
      SCHEDULE variant (default): gross = tier_flat_schedule[benefit_tier_code][service_type]
        CLASSIC: {TOW: 8900, BATTERY: 6200, LOCKOUT: 5500, TIRE: 4800, FUEL: 4100, WINCH: 12400}
        PLUS:    {TOW: 12900, BATTERY: 6800, LOCKOUT: 5500, TIRE: 4800, FUEL: 4100, WINCH: 13900}
        PREMIER: {TOW: 21500, BATTERY: 7400, LOCKOUT: 5500, TIRE: 4800, FUEL: 4100, WINCH: 16800}
      ACTUAL variant (servicing club billing_policy = ACTUAL): gross = provider cost basis =
        5500 (hook fee) + actual effective tow miles x 240 + parts_charge_cents
        where actual effective tow miles = max(0, actual_tow_miles - 3) for TOW, 0 otherwise.
      The variant is selected by the SERVICING club's billing_policy field (default SCHEDULE).
    input_set: "Completed foreign benefit-eligible calls only (member-pay and cancelled/expired calls produce excluded lines)"
    constants:
      HOOK_FEE_CENTS: 5500
      PER_MILE_CENTS: 240
    precision: "integer cents"
    variants:
      - name: schedule_basis
        when: "servicing club uses the federation flat schedule"
        difference: "amount independent of actual miles/parts — identical call data bills differently than ACTUAL basis"
      - name: actual_basis
        when: "servicing club bills actual provider cost"
        difference: "amount varies with actual_tow_miles and parts; diverges from schedule on identical call data"

  - name: settlement_sweep
    description: "Aggregation of foreign-call lines into a settlement period at CLOSE; evaluation order pinned"
    trigger: "SettlementPeriod OPEN->CLOSED"
    algorithm: aggregation
    formula: |
      included_lines = SettlementLine where
        servicing_club_id = period.servicing_club_id
        AND excluded = false
        AND status = PENDING
        AND ServiceCall.completed_at IN [period.period_start_date, period.period_end_date)   # half-open
      Order of evaluation (pinned):
        1. filter by servicing_club_id; 2. filter excluded=false; 3. filter status=PENDING;
        4. filter window half-open on completed_at; 5. sort by completed_at ASC, tie-break ServiceCall.created_at ASC;
        6. assign to period in that order; 7. total_gross_cents = sum(gross_amount_cents);
        8. total_foreign_call_count = count.
    input_set: "PENDING, non-excluded SettlementLines for the servicing club whose calls completed inside the half-open window"
    constants: {}
    precision: "integer cents"

  - name: settlement_assessment
    description: "Federation assessment at ASSESS; nested rounding order pinned (per-line round, then sum)"
    trigger: "SettlementPeriod CLOSED->ASSESSED"
    algorithm: aggregation
    formula: |
      For each SWEPT line (in sweep order):
        fee_cents = round_half_up(gross_amount_cents * 0.045)    # round PER LINE first
        net_cents = gross_amount_cents - fee_cents
      period_totals: total_fee = sum(fee_cents); total_net = sum(net_cents)
      # Pinning: round per line THEN sum. Summing first then rounding is forbidden.
    input_set: "SWEPT lines of the period"
    constants:
      FEDERATION_ASSESSMENT_RATE: 0.045
    precision: "integer cents, round_half_up per line before summation"

  - name: tier_change_proration
    description: "Prorated charge (upgrade) or credit (downgrade) for mid-term tier change; circular-looking dependency pinned by evaluation order"
    trigger: "POST /memberships/{id}/upgrade or /downgrade"
    algorithm: chronological
    formula: |
      elapsed_days = floor((logical now - term_start_date) / 86400)
      remaining_days = 365 - elapsed_days
      # Evaluation order pinned to break the circularity "charge depends on new tier,
      # credit depends on remaining days, remaining days depend on term which the
      # change might reset": the tier change NEVER resets term dates.
      prorated_new = round_half_up(new_tier.annual_dues_cents * remaining_days / 365)
      prorated_old = round_half_up(old_tier.annual_dues_cents * remaining_days / 365)
      upgrade:   charge_cents = prorated_new - prorated_old   (>= 0 by rank ordering; posted as debit to account_credit_cents)
      downgrade: credit_cents = prorated_old - prorated_new   (posted as credit)
      # each factor rounded individually BEFORE subtraction (pinned order)
    input_set: "Current term dates, old/new tier dues"
    constants:
      TERM_DAYS: 365
    precision: "integer cents; round_half_up each prorated factor before the subtraction"

  - name: benefit_cap_check
    description: "Decides benefit_eligible at call creation; threshold boundary pinned"
    trigger: "ServiceCall creation"
    algorithm: threshold
    formula: |
      cap = MembershipTier[membership.tier_code at creation].annual_call_cap
      # boundary: call is benefit-eligible when calls_used_current_term < cap.
      # The cap-th call (calls_used == cap - 1) is still eligible; the (cap+1)-th is not.
      # GRACE memberships: benefit_eligible forced false regardless of count.
      # Household members share the SAME counter (household-level cap).
      benefit_eligible = (membership.status != GRACE) AND (calls_used_current_term < cap)
      # pre-existing need rule interacts: when is_pre_existing_need, the cap and
      # tow miles used are the PRE-UPGRADE tier's, not the new tier's.
    input_set: "Membership counter + tier cap at creation time"
    constants: {}
    precision: "integer comparison, strict <"

  - name: household_proration
    description: "Credit when a household member is removed mid-term"
    trigger: "HouseholdMember ACTIVE->REMOVED"
    algorithm: chronological
    formula: |
      remaining_days = 365 - floor((logical now - membership.term_start_date) / 86400)
      credit_cents = round_half_up(tier.household_member_price_cents * remaining_days / 365)
      posted to membership.account_credit_cents (credit)
    input_set: "Removing member's membership tier and term dates"
    constants:
      TERM_DAYS: 365
    precision: "integer cents, round_half_up"

  - name: ancillary_commission
    description: "Agent commission on an ancillary sale"
    trigger: "AncillarySale creation"
    algorithm: weighted_scoring
    formula: |
      commission_cents = round_half_up(price_cents * commission_bps / 10000)
    input_set: "Sold product's price and commission_bps snapshot"
    constants: {}
    precision: "integer cents, round_half_up"

  - name: ancillary_refund
    description: "Refund credit on ancillary cancellation; compensating invariant anchor"
    trigger: "AncillarySale ACTIVE->REFUNDED"
    algorithm: chronological
    formula: |
      refund_cents = price_cents (full within the 30-day window; window is inclusive at exactly 30 days)
      membership.account_credit_cents += refund_cents
      # compensating invariant: sale then refund leaves account_credit_cents unchanged
      # and membership.version returns to its pre-sale value + 2 (one bump per event).
    input_set: "The refunded sale"
    constants:
      REFUND_WINDOW_DAYS: 30
    precision: "integer cents"

  - name: completion_member_charge
    description: "Total member-facing charge at dispatch completion (benefit vs member-pay paths)"
    trigger: "Dispatch ARRIVED->COMPLETED"
    algorithm: aggregation
    formula: |
      parts_charge_cents = sum over parts_used of PARTS_PRICE_BOOK_CENTS[part_sku] * quantity
        PARTS_PRICE_BOOK_CENTS: BAT-G24: 14500, BAT-G35: 16900, TIRE-SPO: 9900, FUEL-CAN: 1200, LOCK-KIT: 0
      mileage = mileage_overage final variant result for TOW; 0 otherwise
      when benefit_eligible:  total_member_charge_cents = mileage + parts_charge_cents
        # LOCKOUT special case: member pays max(0, locksmith invoice - tier.lockout_benefit_cents);
        # in this scaffold locksmith invoice is modeled as 0 when no LOCK-KIT part is used, so
        # the benefit path charge is parts_charge_cents only.
      when NOT benefit_eligible (member-pay, incl. all GRACE calls):
        total_member_charge_cents = full price-book: mileage_member_pay + parts_charge_cents
        where mileage_member_pay = effective_miles * rate (no included-mile deduction)
      posted as a debit (account_credit_cents decreases by total_member_charge_cents)
    input_set: "Completing dispatch + its call's benefit_tier_code and benefit_eligible flag"
    constants:
      PARTS_PRICE_BOOK_CENTS: { BAT-G24: 14500, BAT-G35: 16900, TIRE-SPO: 9900, FUEL-CAN: 1200, LOCK-KIT: 0 }
    precision: "integer cents"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for this endpoint per RBAC matrix", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path identifiers resolve to existing entities, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: business_constraint, check: "Request payload well-formed: required fields present, enum members valid, numeric ranges respected (sla_multiplier 0.5..3.0, minutes 0..1439, miles >= 0, dues >= 0)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 5, category: business_referential, check: "FK targets exist and are referentially consistent: household member belongs to the membership, provider's servicing club owns the provider, product id exists", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "endpoints accepting FK fields" }
  - { priority: 6, category: state, check: "Target resource in a state that permits the operation (state-machine precondition set): dispatch only from REQUESTED, complete only from ARRIVED, close only from OPEN, assess only from CLOSED, reinstate only from LAPSED, renew only from GRACE or REINSTATED", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: business_safety, check: "Anti-adverse-selection: a membership inside an upgrade waiting period receives PRE-UPGRADE tier benefits on new service calls (is_pre_existing_need computed true); attempted direct manipulation of benefit_tier_code is rejected", error_id: ERR_WAITING_PERIOD_ACTIVE, http_status: 422, applies_to: ["POST /motor-club/service-calls"] }
  - { priority: 8, category: business_safety, check: "Segregation of duties: assessor X-User-ID differs from the period's closer; an Agent refunds only their own sales", error_id: ERR_SOD_CONFLICT, http_status: 422, applies_to: ["POST /motor-club/settlement-periods/{periodId}/assess", "POST /motor-club/ancillary-sales/{saleId}/refund"] }
  - { priority: 9, category: business_referential, check: "Membership is serviceable for new calls: status IN {ACTIVE, REINSTATED, GRACE}; LAPSED/CANCELLED rejected", error_id: ERR_MEMBERSHIP_NOT_SERVICEABLE, http_status: 422, applies_to: ["POST /motor-club/service-calls"] }
  - { priority: 10, category: business_referential, check: "Requesting household member is ACTIVE and belongs to the membership", error_id: ERR_MEMBER_NOT_COVERED, http_status: 422, applies_to: ["POST /motor-club/service-calls"] }
  - { priority: 11, category: business_temporal, check: "Territory resolution: breakdown_location_state must fall in exactly one ACTIVE club's territory list", error_id: ERR_TERRITORY_NOT_FOUND, http_status: 422, applies_to: ["POST /motor-club/service-calls"] }
  - { priority: 12, category: business_temporal, check: "Reinstatement window: logical now <= lapse_at + 90 days", error_id: ERR_REINSTATEMENT_WINDOW_EXPIRED, http_status: 422, applies_to: ["POST /motor-club/memberships/{membershipId}/reinstate"] }
  - { priority: 13, category: business_temporal, check: "Ancillary refund window: logical now <= sale.created_at + 30 days (inclusive)", error_id: ERR_REFUND_WINDOW_EXPIRED, http_status: 422, applies_to: ["POST /motor-club/ancillary-sales/{saleId}/refund"] }
  - { priority: 14, category: business_temporal, check: "Settlement period closable: logical now >= period_end_date", error_id: ERR_PERIOD_NOT_CLOSABLE, http_status: 422, applies_to: ["POST /motor-club/settlement-periods/{periodId}/close"] }
  - { priority: 15, category: business_constraint, check: "No non-terminal service calls block destructive membership actions (cancel, administrative lapse, household removal)", error_id: ERR_OPEN_SERVICE_CALLS, http_status: 422, applies_to: ["POST /motor-club/memberships/{membershipId}/cancel", "POST /motor-club/memberships/{membershipId}/lapse", "DELETE /motor-club/household-members/{memberId}"] }
  - { priority: 16, category: business_constraint, check: "Dispatch cancel boundary: call cancel from DISPATCHED requires linked dispatch status IN {ASSIGNED, ACCEPTED}", error_id: ERR_DISPATCH_BEYOND_CANCEL, http_status: 422, applies_to: ["POST /motor-club/service-calls/{callId}/cancel"] }
  - { priority: 17, category: business_constraint, check: "Tier move validity: target tier exists, differs from current, rank direction matches endpoint (upgrade requires higher rank; downgrade lower); immediate re-upgrade within the same term after a downgrade is allowed but re-applies the waiting period", error_id: ERR_TIER_MOVE_INVALID, http_status: 422, applies_to: ["POST /motor-club/memberships/{membershipId}/upgrade", "POST /motor-club/memberships/{membershipId}/downgrade"] }
  - { priority: 18, category: business_constraint, check: "Household capacity: max 4 ACTIVE household members per membership; CHILD relationship requires age < 21 at add time", error_id: ERR_HOUSEHOLD_LIMIT, http_status: 422, applies_to: ["POST /motor-club/memberships/{membershipId}/household-members"] }
  - { priority: 19, category: business_fiscal, check: "Truck stock sufficiency for parts_used at completion", error_id: ERR_INSUFFICIENT_TRUCK_STOCK, http_status: 422, applies_to: ["POST /motor-club/dispatches/{dispatchId}/complete"] }
  - { priority: 20, category: business_fiscal, check: "Ancillary purchase gating: membership status IN {ACTIVE, REINSTATED}; membership tier rank >= product.min_tier_code rank; product ACTIVE", error_id: ERR_PRODUCT_TIER_GATE, http_status: 422, applies_to: ["POST /motor-club/ancillary-sales"] }
  - { priority: 21, category: business_referential, check: "Settlement line reversal only from PENDING", error_id: ERR_LINE_ALREADY_SWEPT, http_status: 422, applies_to: ["POST /motor-club/settlement-lines/{lineId}/reverse"] }
  - { priority: 22, category: state, check: "OCC expected version matches current version on guarded writes", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /motor-club/memberships/{membershipId}/upgrade", "POST /motor-club/memberships/{membershipId}/downgrade", "POST /motor-club/service-calls/{callId}/dispatch"] }

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving, mandatory default) ---
  - method: POST
    path: "/motor-club/_clock/set_current_utc"
    description: "Sets the logical clock. Startup default is exactly 2026-09-01T00:00:00Z; before any call the clock reads this default and never falls back to wall-clock. Advancing the clock fires system sweeps: membership grace/lapse transitions and 24h REQUESTED-call expiry."
    roles: [ClubAdmin, MemberServicesRep]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["system sweep: Membership ACTIVE->GRACE, GRACE->LAPSED per clock rules", "system sweep: stale REQUESTED ServiceCall -> EXPIRED"]

  # --- clubs ---
  - method: POST
    path: "/motor-club/clubs"
    description: "Create a federation club"
    roles: [ClubAdmin]
    code: 201
    input: [club_code, name, territory_state_codes, default_arrival_target_minutes, "billing_policy?"]
    output: Club
    side_effects: []
  - method: GET
    path: "/motor-club/clubs"
    description: "List clubs"
    roles: [ClubAdmin, Dispatcher, MemberServicesRep, SettlementClerk, FederationFinance]
    code: 200
    input: ["limit?", "offset?"]
    output: Club[]
    side_effects: []
  - method: GET
    path: "/motor-club/clubs/{clubId}"
    description: "Get one club"
    roles: [ClubAdmin, Dispatcher, MemberServicesRep, SettlementClerk, FederationFinance]
    code: 200
    input: []
    output: Club
    side_effects: []
  - method: PUT
    path: "/motor-club/clubs/{clubId}"
    description: "Update club (including status SUSPENDED/ACTIVE)"
    roles: [ClubAdmin]
    code: 200
    input: ["name?", "territory_state_codes?", "default_arrival_target_minutes?", "billing_policy?", "status?"]
    output: Club
    side_effects: ["SUSPENDED club: providers of the club become ineligible; new memberships with this home club rejected"]

  # --- tiers ---
  - method: POST
    path: "/motor-club/tiers"
    description: "Create a membership tier"
    roles: [ClubAdmin]
    code: 201
    input: [code, annual_dues_cents, included_tow_miles, annual_call_cap, lockout_benefit_cents, battery_service_included, household_member_price_cents, overage_rate_cents_per_mile, upgrade_waiting_days, rank]
    output: MembershipTier
    side_effects: []
  - method: GET
    path: "/motor-club/tiers"
    description: "List tiers"
    roles: [ClubAdmin, MemberServicesRep, Dispatcher, Agent]
    code: 200
    input: ["limit?", "offset?"]
    output: MembershipTier[]
    side_effects: []
  - method: GET
    path: "/motor-club/tiers/{tierId}"
    description: "Get one tier"
    roles: [ClubAdmin, MemberServicesRep, Dispatcher, Agent]
    code: 200
    input: []
    output: MembershipTier
    side_effects: []
  - method: PUT
    path: "/motor-club/tiers/{tierId}"
    description: "Update tier economics (dues, caps, mileage, waiting days). Changes apply prospectively; benefit_tier_code pinned on existing calls is unaffected."
    roles: [ClubAdmin]
    code: 200
    input: ["annual_dues_cents?", "included_tow_miles?", "annual_call_cap?", "lockout_benefit_cents?", "battery_service_included?", "household_member_price_cents?", "overage_rate_cents_per_mile?", "upgrade_waiting_days?", "rank?"]
    output: MembershipTier
    side_effects: []

  # --- memberships ---
  - method: POST
    path: "/motor-club/memberships"
    description: "Enroll a primary member (status ACTIVE, term starts at logical now)"
    roles: [MemberServicesRep]
    code: 201
    input: [home_club_id, primary_member_name, primary_member_email, tier_code]
    output: Membership
    side_effects: ["append MembershipEvent ENROLLMENT", "home club must be ACTIVE (ERR_CLUB_SUSPENDED)"]
  - method: GET
    path: "/motor-club/memberships"
    description: "List memberships (filterable)"
    roles: [MemberServicesRep, Dispatcher, SettlementClerk, FederationFinance]
    code: 200
    input: ["status?", "home_club_id?", "limit?", "offset?"]
    output: Membership[]
    side_effects: []
  - method: GET
    path: "/motor-club/memberships/{membershipId}"
    description: "Get one membership"
    roles: [MemberServicesRep, Dispatcher, SettlementClerk, FederationFinance]
    code: 200
    input: []
    output: Membership
    side_effects: []
  - method: POST
    path: "/motor-club/memberships/{membershipId}/upgrade"
    description: "Upgrade tier mid-term; prorated charge; waiting period starts for pre-existing needs"
    roles: [MemberServicesRep]
    code: 200
    input: [target_tier_code, expected_membership_version]
    output: Membership
    side_effects: ["tier_change_proration debit", "tier_upgrade_effective_at = now + new tier.upgrade_waiting_days days", "append MembershipEvent UPGRADE", "increments Membership.version by 1"]
  - method: POST
    path: "/motor-club/memberships/{membershipId}/downgrade"
    description: "Downgrade tier mid-term; prorated credit; waiting period does NOT apply downward but a later re-upgrade restarts it"
    roles: [MemberServicesRep]
    code: 200
    input: [target_tier_code, expected_membership_version]
    output: Membership
    side_effects: ["tier_change_proration credit", "append MembershipEvent DOWNGRADE", "increments Membership.version by 1"]
  - method: POST
    path: "/motor-club/memberships/{membershipId}/renew"
    description: "Renew from GRACE (or REINSTATED); rolls term forward and resets call counter"
    roles: [MemberServicesRep]
    code: 200
    input: []
    output: Membership
    side_effects: ["term roll", "calls_used_current_term = 0", "append MembershipEvent RENEWAL", "increments Membership.version by 1"]
  - method: POST
    path: "/motor-club/memberships/{membershipId}/lapse"
    description: "Administrative lapse (non-payment)"
    roles: [MemberServicesRep]
    code: 200
    input: []
    output: Membership
    side_effects: ["lapse_at = now", "append MembershipEvent LAPSE", "increments Membership.version by 1"]
  - method: POST
    path: "/motor-club/memberships/{membershipId}/reinstate"
    description: "Reinstate a LAPSED membership within 90 days with full dues paid"
    roles: [MemberServicesRep]
    code: 200
    input: [dues_paid]
    output: Membership
    side_effects: ["new term from now", "calls_used_current_term = 0", "reinstatement_count += 1", "append MembershipEvent REINSTATEMENT", "increments Membership.version by 1"]
  - method: POST
    path: "/motor-club/memberships/{membershipId}/cancel"
    description: "Cancel membership; cascades to household members and ancillary sales"
    roles: [MemberServicesRep]
    code: 200
    input: []
    output: Membership
    side_effects: ["HouseholdMember ACTIVE->REMOVED cascade", "AncillarySale ACTIVE->REFUNDED cascade", "append MembershipEvent CANCELLATION", "increments Membership.version by 1"]
  - method: GET
    path: "/motor-club/memberships/{id}/membershipEvents"
    description: "Membership audit events (reverse-reachability for MembershipEvent)"
    roles: [MemberServicesRep, FederationFinance]
    code: 200
    input: ["limit?", "offset?"]
    output: MembershipEvent[]
    side_effects: []
  - method: GET
    path: "/motor-club/memberships/{id}/householdMembers"
    description: "Household members of a membership (reverse-reachability)"
    roles: [MemberServicesRep, Dispatcher]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: HouseholdMember[]
    side_effects: []
  - method: GET
    path: "/motor-club/memberships/{membershipId}/service-calls"
    description: "Service calls of a membership (reverse-reachability)"
    roles: [MemberServicesRep, Dispatcher, SettlementClerk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ServiceCall[]
    side_effects: []
  - method: GET
    path: "/motor-club/memberships/{membershipId}/ancillary-sales"
    description: "Ancillary sales of a membership (reverse-reachability)"
    roles: [MemberServicesRep, Agent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AncillarySale[]
    side_effects: []
  - method: GET
    path: "/motor-club/membership-events"
    description: "List membership audit events (filtered list form of MembershipEvent reverse-reachability)"
    roles: [MemberServicesRep, FederationFinance]
    code: 200
    input: ["membership_id?", "event_type?", "limit?", "offset?"]
    output: MembershipEvent[]
    side_effects: []
  - method: GET
    path: "/motor-club/truck-part-stock"
    description: "List truck part stock lines (filtered list form of TruckPartStock reverse-reachability)"
    roles: [ClubAdmin, ProviderOps]
    code: 200
    input: ["provider_id?", "part_kind?", "limit?", "offset?"]
    output: TruckPartStock[]
    side_effects: []
  - method: GET
    path: "/motor-club/dispatches"
    description: "List dispatches (filtered list form of Dispatch reverse-reachability)"
    roles: [Dispatcher, ProviderOps, SettlementClerk]
    code: 200
    input: ["service_call_id?", "provider_id?", "status?", "limit?", "offset?"]
    output: Dispatch[]
    side_effects: []
  - method: GET
    path: "/motor-club/ancillary-sales"
    description: "List ancillary sales (filtered list form of AncillarySale reverse-reachability)"
    roles: [Agent, MemberServicesRep]
    code: 200
    input: ["membership_id?", "product_id?", "status?", "limit?", "offset?"]
    output: AncillarySale[]
    side_effects: []

  # --- household members ---
  - method: POST
    path: "/motor-club/memberships/{membershipId}/household-members"
    description: "Add a household member (max 4 ACTIVE; CHILD age < 21). The primary member herself is added as a row with is_primary: true so she can request service."
    roles: [MemberServicesRep]
    code: 201
    input: [full_name, relationship, date_of_birth, "is_primary?"]
    output: HouseholdMember
    side_effects: ["membership.account_credit_cents debited by household_member_price_cents (full-year charge at add); waived when is_primary is true (primary member's dues already cover them)"]
  - method: GET
    path: "/motor-club/household-members/{memberId}"
    description: "Get one household member"
    roles: [MemberServicesRep, Dispatcher]
    code: 200
    input: []
    output: HouseholdMember
    side_effects: []
  - method: PUT
    path: "/motor-club/household-members/{memberId}"
    description: "Update household member profile fields (full_name, relationship, date_of_birth)"
    roles: [MemberServicesRep]
    code: 200
    input: ["full_name?", "relationship?", "date_of_birth?"]
    output: HouseholdMember
    side_effects: []
  - method: DELETE
    path: "/motor-club/household-members/{memberId}"
    description: "Remove a household member mid-term (prorated credit)"
    roles: [MemberServicesRep]
    code: 200
    input: []
    output: HouseholdMember
    side_effects: ["household_proration credit posted"]

  # --- providers ---
  - method: POST
    path: "/motor-club/providers"
    description: "Register a service provider under a servicing club"
    roles: [ClubAdmin]
    code: 201
    input: [servicing_club_id, name, provider_kind, capabilities, home_base_state_code, sla_multiplier, shift_start_minute, shift_end_minute, max_concurrent_dispatches]
    output: ServiceProvider
    side_effects: []
  - method: GET
    path: "/motor-club/providers"
    description: "List providers (filterable)"
    roles: [ClubAdmin, Dispatcher, ProviderOps]
    code: 200
    input: ["servicing_club_id?", "status?", "limit?", "offset?"]
    output: ServiceProvider[]
    side_effects: []
  - method: GET
    path: "/motor-club/providers/{providerId}"
    description: "Get one provider"
    roles: [ClubAdmin, Dispatcher, ProviderOps]
    code: 200
    input: []
    output: ServiceProvider
    side_effects: []
  - method: PUT
    path: "/motor-club/providers/{providerId}"
    description: "Update provider config or status (SUSPENDED/ACTIVE)"
    roles: [ClubAdmin]
    code: 200
    input: ["name?", "capabilities?", "sla_multiplier?", "shift_start_minute?", "shift_end_minute?", "max_concurrent_dispatches?", "status?"]
    output: ServiceProvider
    side_effects: ["status transition validations per state machine"]
  - method: GET
    path: "/motor-club/providers/{id}/truckPartStocks"
    description: "Truck part stock of a provider (reverse-reachability)"
    roles: [ClubAdmin, ProviderOps]
    code: 200
    input: ["limit?", "offset?"]
    output: TruckPartStock[]
    side_effects: []
  - method: POST
    path: "/motor-club/providers/{providerId}/part-stock"
    description: "Create or restock a truck part line (quantity_on_hand set/restocked)"
    roles: [ClubAdmin, ProviderOps]
    code: 201
    input: [part_sku, part_kind, quantity_on_hand, "reorder_level?"]
    output: TruckPartStock
    side_effects: []
  - method: POST
    path: "/motor-club/part-stock/{stockId}/restock"
    description: "Add quantity to an existing truck stock line"
    roles: [ClubAdmin, ProviderOps]
    code: 200
    input: [add_quantity]
    output: TruckPartStock
    side_effects: ["quantity_on_hand += add_quantity"]

  # --- service calls & dispatch ---
  - method: POST
    path: "/motor-club/service-calls"
    description: "Open a service call; resolves servicing club by territory, computes is_pre_existing_need, benefit_tier_code, benefit_eligible"
    roles: [Dispatcher, MemberServicesRep]
    code: 201
    input: [membership_id, requesting_member_id, service_type, breakdown_location_state, "requested_tow_miles?"]
    output: ServiceCall
    side_effects: ["benefit_cap_check", "territory resolution"]
  - method: GET
    path: "/motor-club/service-calls"
    description: "List service calls (filterable)"
    roles: [Dispatcher, MemberServicesRep, SettlementClerk, ProviderOps]
    code: 200
    input: ["membership_id?", "requesting_member_id?", "servicing_club_id?", "status?", "limit?", "offset?"]
    output: ServiceCall[]
    side_effects: []
  - method: GET
    path: "/motor-club/service-calls/{callId}"
    description: "Get one service call"
    roles: [Dispatcher, MemberServicesRep, SettlementClerk, ProviderOps]
    code: 200
    input: []
    output: ServiceCall
    side_effects: []
  - method: POST
    path: "/motor-club/service-calls/{callId}/dispatch"
    description: "Dispatch the call: runs provider selection; empty pool auto-cancels with NO_PROVIDER"
    roles: [Dispatcher]
    code: 200
    input: [expected_service_call_version]
    output: Dispatch
    side_effects: ["dispatch_provider_selection", "Dispatch created ASSIGNED with promised_arrive_by", "increments ServiceCall.version by 1"]
  - method: POST
    path: "/motor-club/service-calls/{callId}/cancel"
    description: "Cancel the call (member request); from DISPATCHED only while linked dispatch is ASSIGNED/ACCEPTED"
    roles: [Dispatcher, MemberServicesRep]
    code: 200
    input: []
    output: ServiceCall
    side_effects: ["linked dispatch -> CANCELLED when applicable"]
  - method: GET
    path: "/motor-club/service-calls/{callId}/dispatches"
    description: "Dispatches of a call (reverse-reachability)"
    roles: [Dispatcher, ProviderOps, SettlementClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: Dispatch[]
    side_effects: []

  # --- dispatches ---
  - method: GET
    path: "/motor-club/dispatches/{dispatchId}"
    description: "Get one dispatch"
    roles: [Dispatcher, ProviderOps, SettlementClerk]
    code: 200
    input: []
    output: Dispatch
    side_effects: []
  - method: POST
    path: "/motor-club/dispatches/{dispatchId}/accept"
    description: "Provider accepts (ASSIGNED->ACCEPTED) or marks rolling (ACCEPTED->EN_ROUTE with en_route: true)"
    roles: [ProviderOps]
    code: 200
    input: ["en_route?"]
    output: Dispatch
    side_effects: []
  - method: POST
    path: "/motor-club/dispatches/{dispatchId}/arrive"
    description: "Provider arrives on scene; sla_met computed"
    roles: [ProviderOps]
    code: 200
    input: []
    output: Dispatch
    side_effects: ["arrived_at = now", "sla_met computed"]
  - method: POST
    path: "/motor-club/dispatches/{dispatchId}/complete"
    description: "Complete the dispatch with actual miles and parts used; runs overage/parts/settlement side effects"
    roles: [ProviderOps]
    code: 200
    input: ["actual_tow_miles?", "parts_used?"]
    output: Dispatch
    side_effects: ["mileage_overage final variant", "parts charge", "truck stock decrement", "cap consumption", "member charge posted", "SettlementLine created for foreign benefit-eligible calls"]
  - method: POST
    path: "/motor-club/dispatches/{dispatchId}/fail"
    description: "Fail the dispatch; parent call loops back to REQUESTED for redispatch"
    roles: [ProviderOps]
    code: 200
    input: [failure_reason]
    output: Dispatch
    side_effects: ["parent ServiceCall DISPATCHED->REQUESTED", "failed provider excluded from immediate retry pool"]

  # --- settlement ---
  - method: POST
    path: "/motor-club/settlement-periods"
    description: "Open a settlement period for a servicing club"
    roles: [SettlementClerk]
    code: 201
    input: [servicing_club_id, period_start_date, period_end_date]
    output: SettlementPeriod
    side_effects: []
  - method: GET
    path: "/motor-club/settlement-periods"
    description: "List settlement periods"
    roles: [SettlementClerk, FederationFinance]
    code: 200
    input: ["servicing_club_id?", "status?", "limit?", "offset?"]
    output: SettlementPeriod[]
    side_effects: []
  - method: GET
    path: "/motor-club/settlement-periods/{periodId}"
    description: "Get one settlement period"
    roles: [SettlementClerk, FederationFinance]
    code: 200
    input: []
    output: SettlementPeriod
    side_effects: []
  - method: POST
    path: "/motor-club/settlement-periods/{periodId}/close"
    description: "Close the period; sweeps eligible PENDING lines"
    roles: [SettlementClerk]
    code: 200
    input: []
    output: SettlementPeriod
    side_effects: ["settlement_sweep", "closer id recorded for SoD"]
  - method: POST
    path: "/motor-club/settlement-periods/{periodId}/assess"
    description: "Assess federation fee on swept lines (SoD: assessor != closer)"
    roles: [FederationFinance]
    code: 200
    input: []
    output: SettlementPeriod
    side_effects: ["settlement_assessment", "swept lines -> ASSESSED"]
  - method: GET
    path: "/motor-club/settlement-periods/{id}/settlementLines"
    description: "Settlement lines swept into a period (reverse-reachability)"
    roles: [SettlementClerk, FederationFinance]
    code: 200
    input: ["limit?", "offset?"]
    output: SettlementLine[]
    side_effects: []
  - method: GET
    path: "/motor-club/settlement-lines"
    description: "List settlement lines (filtered by home/servicing club or status)"
    roles: [SettlementClerk, FederationFinance]
    code: 200
    input: ["home_club_id?", "servicing_club_id?", "settlement_period_id?", "service_call_id?", "status?", "limit?", "offset?"]
    output: SettlementLine[]
    side_effects: []
  - method: GET
    path: "/motor-club/settlement-lines/{lineId}"
    description: "Get one settlement line"
    roles: [SettlementClerk, FederationFinance]
    code: 200
    input: []
    output: SettlementLine
    side_effects: []
  - method: POST
    path: "/motor-club/settlement-lines/{lineId}/reverse"
    description: "Reverse a PENDING line (home-club dispute) before it is swept"
    roles: [FederationFinance]
    code: 200
    input: []
    output: SettlementLine
    side_effects: ["line excluded from all future sweeps"]

  # --- ancillary ---
  - method: POST
    path: "/motor-club/ancillary-products"
    description: "Create an ancillary product"
    roles: [ClubAdmin]
    code: 201
    input: [product_type, name, price_cents, min_tier_code, commission_bps]
    output: AncillaryProduct
    side_effects: []
  - method: GET
    path: "/motor-club/ancillary-products"
    description: "List ancillary products"
    roles: [ClubAdmin, Agent, MemberServicesRep]
    code: 200
    input: ["product_type?", "status?", "limit?", "offset?"]
    output: AncillaryProduct[]
    side_effects: []
  - method: GET
    path: "/motor-club/ancillary-products/{productId}"
    description: "Get one ancillary product"
    roles: [ClubAdmin, Agent, MemberServicesRep]
    code: 200
    input: []
    output: AncillaryProduct
    side_effects: []
  - method: PUT
    path: "/motor-club/ancillary-products/{productId}"
    description: "Update product (including status RETIRED); existing sales keep their price snapshot"
    roles: [ClubAdmin]
    code: 200
    input: ["name?", "price_cents?", "min_tier_code?", "commission_bps?", "status?"]
    output: AncillaryProduct
    side_effects: []
  - method: POST
    path: "/motor-club/ancillary-sales"
    description: "Sell an ancillary product to a membership"
    roles: [Agent]
    code: 201
    input: [membership_id, product_id]
    output: AncillarySale
    side_effects: ["ancillary_commission", "membership.account_credit_cents debited by price_cents", "increments Membership.version by 1"]
  - method: GET
    path: "/motor-club/ancillary-sales/{saleId}"
    description: "Get one ancillary sale"
    roles: [Agent, MemberServicesRep]
    code: 200
    input: []
    output: AncillarySale
    side_effects: []
  - method: POST
    path: "/motor-club/ancillary-sales/{saleId}/refund"
    description: "Refund a sale within 30 days; selling agent or MemberServicesRep only"
    roles: [Agent, MemberServicesRep]
    code: 200
    input: []
    output: AncillarySale
    side_effects: ["ancillary_refund", "increments Membership.version by 1"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or FK-referenced entity does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed payload: missing required field, invalid enum, out-of-range numeric" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "State-machine precondition violated (wrong from-state, terminal lockdown)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match current version" }
  - { id: ERR_WAITING_PERIOD_ACTIVE, http: 422, condition: "Request attempts to apply post-upgrade tier benefits to a pre-existing need during the waiting period" }
  - { id: ERR_SOD_CONFLICT, http: 422, condition: "Segregation-of-duties violation: assessor equals closer, or agent refunds another agent's sale" }
  - { id: ERR_MEMBERSHIP_NOT_SERVICEABLE, http: 422, condition: "New service call on LAPSED or CANCELLED membership" }
  - { id: ERR_MEMBER_NOT_COVERED, http: 422, condition: "Requesting member not an ACTIVE household member of the membership" }
  - { id: ERR_TERRITORY_NOT_FOUND, http: 422, condition: "breakdown_location_state maps to no ACTIVE club territory (or to a SUSPENDED club)" }
  - { id: ERR_REINSTATEMENT_WINDOW_EXPIRED, http: 422, condition: "Reinstatement attempted more than 90 days after lapse_at" }
  - { id: ERR_REFUND_WINDOW_EXPIRED, http: 422, condition: "Ancillary refund attempted more than 30 days after sale" }
  - { id: ERR_PERIOD_NOT_CLOSABLE, http: 422, condition: "Settlement period close attempted before period_end_date" }
  - { id: ERR_OPEN_SERVICE_CALLS, http: 422, condition: "Membership cancel/lapse or household removal blocked by non-terminal service calls" }
  - { id: ERR_DISPATCH_BEYOND_CANCEL, http: 422, condition: "Call cancel attempted while linked dispatch is EN_ROUTE or ARRIVED" }
  - { id: ERR_TIER_MOVE_INVALID, http: 422, condition: "Upgrade/downgrade target invalid: same tier, wrong rank direction, or unknown tier" }
  - { id: ERR_HOUSEHOLD_LIMIT, http: 422, condition: "Household exceeds 4 ACTIVE members or CHILD age bound violated" }
  - { id: ERR_INSUFFICIENT_TRUCK_STOCK, http: 422, condition: "parts_used exceeds provider's TruckPartStock quantity_on_hand" }
  - { id: ERR_PRODUCT_TIER_GATE, http: 422, condition: "Ancillary purchase blocked: membership tier below product minimum, product RETIRED, or membership not in ACTIVE/REINSTATED" }
  - { id: ERR_LINE_ALREADY_SWEPT, http: 422, condition: "Reversal attempted on a SWEPT or ASSESSED settlement line" }
  - { id: ERR_CLUB_SUSPENDED, http: 422, condition: "Operation requires an ACTIVE club (new membership home club, provider reactivation)" }
  - { id: ERR_PROVIDER_BUSY, http: 422, condition: "Provider suspension attempted while non-terminal dispatches exist" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: ClubAdmin
    description: "Federation/club configuration operator: clubs, tiers, providers, products, clock"
    identity: opaque
    exclusive_operations: ["POST /motor-club/clubs", "PUT /motor-club/clubs/{clubId}", "POST /motor-club/tiers", "POST /motor-club/providers", "PUT /motor-club/providers/{providerId}", "POST /motor-club/ancillary-products"]
    shared_operations: ["POST /motor-club/_clock/set_current_utc", "POST /motor-club/providers/{providerId}/part-stock", "POST /motor-club/part-stock/{stockId}/restock", "GET endpoints"]
  - name: MemberServicesRep
    description: "Membership lifecycle operator: enroll, upgrade/downgrade, renew, lapse, reinstate, cancel, household management"
    identity: opaque
    exclusive_operations: ["POST /motor-club/memberships", "POST /motor-club/memberships/{membershipId}/upgrade", "POST /motor-club/memberships/{membershipId}/downgrade", "POST /motor-club/memberships/{membershipId}/renew", "POST /motor-club/memberships/{membershipId}/lapse", "POST /motor-club/memberships/{membershipId}/reinstate", "POST /motor-club/memberships/{membershipId}/cancel", "POST /motor-club/memberships/{membershipId}/household-members", "DELETE /motor-club/household-members/{memberId}"]
    shared_operations: ["POST /motor-club/_clock/set_current_utc", "POST /motor-club/service-calls", "POST /motor-club/service-calls/{callId}/cancel", "POST /motor-club/ancillary-sales/{saleId}/refund", "GET endpoints"]
  - name: Dispatcher
    description: "Service-call intake and dispatch operator"
    identity: opaque
    exclusive_operations: ["POST /motor-club/service-calls/{callId}/dispatch"]
    shared_operations: ["POST /motor-club/service-calls", "POST /motor-club/service-calls/{callId}/cancel", "GET endpoints"]
  - name: ProviderOps
    description: "Provider-side operator driving a dispatch through accept/arrive/complete/fail"
    identity: opaque
    exclusive_operations: ["POST /motor-club/dispatches/{dispatchId}/accept", "POST /motor-club/dispatches/{dispatchId}/arrive", "POST /motor-club/dispatches/{dispatchId}/complete", "POST /motor-club/dispatches/{dispatchId}/fail"]
    shared_operations: ["POST /motor-club/providers/{providerId}/part-stock", "POST /motor-club/part-stock/{stockId}/restock", "GET endpoints"]
  - name: SettlementClerk
    description: "Inter-club settlement period operator (open, close). May NOT assess a period they closed (SoD with FederationFinance)."
    identity: opaque
    exclusive_operations: ["POST /motor-club/settlement-periods", "POST /motor-club/settlement-periods/{periodId}/close"]
    shared_operations: ["GET endpoints"]
  - name: FederationFinance
    description: "Federation finance operator: assesses closed periods, reverses pending lines. SoD: cannot assess a period when their X-User-ID equals the closer's."
    identity: opaque
    exclusive_operations: ["POST /motor-club/settlement-periods/{periodId}/assess", "POST /motor-club/settlement-lines/{lineId}/reverse"]
    shared_operations: ["GET endpoints"]
  - name: Agent
    description: "Ancillary-services sales agent (travel, insurance, identity protection)"
    identity: opaque
    exclusive_operations: ["POST /motor-club/ancillary-sales"]
    shared_operations: ["POST /motor-club/ancillary-sales/{saleId}/refund", "GET endpoints"]
