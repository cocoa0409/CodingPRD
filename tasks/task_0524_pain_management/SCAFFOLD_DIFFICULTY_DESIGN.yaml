              payload: { name: "Suite-A" }
              as: ClinicAdmin
              captures: { suite_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Pat Eighteen", referral_source: "Dr Ref" }
              as: IntakeCoordinator
              captures: { patient_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans"
              payload: { modality: "INJECTION" }
              as: Prescriber
              as_user_id: "${prescriber_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans/${plan_id}/approve"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans/${plan_id}/route"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/schedule-intake"
              payload: { intake_utc: "2026-05-01T00:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/complete-intake"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/prior-authorizations"
              payload: { target_kind: "PROCEDURE", payer: "Aetna", authorized_units: 1 }
              as: PriorAuthClerk
              captures: { pa_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/prior-authorizations/${pa_id}/decide"
              payload: { decision: "APPROVED" }
              as: PriorAuthClerk
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/procedures"
              payload: { treatment_plan_id: "${plan_id}", suite_id: "${suite_id}", prior_auth_id: "${pa_id}", start_utc: "2026-06-10T10:00:00Z", duration_minutes: 30 }
              as: IntakeCoordinator
              captures: { proc_id: $.data.id }
            - call: "GET /clinics/${clinic_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { cv1: $.data.version }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/procedures/${proc_id}/schedule"
              payload: { expected_clinic_version: "${cv1}" }
              as: IntakeCoordinator
          trigger:
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/procedures/${proc_id}/cancel"
              payload: {}
              as: IntakeCoordinator
              captures: { st: $.data.status }
          assert:
            - "Procedure.${proc_id}.status == CANCELLED"
            - "FluoroscopySuite.${suite_id}.booked_minutes == 0"
