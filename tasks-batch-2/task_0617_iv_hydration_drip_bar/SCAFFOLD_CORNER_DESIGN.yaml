# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Corner / Breadth Coverage Index
# IV Hydration & Vitamin Drip Bar — Expert tier
# Walks references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1–§1.7.
# Every active instance carries a structured, §1.5-reachable test_recipe;
# corners already covered by §1.8 are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_menu_item_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.InfusionMenuItem, endpoints]
        distinguishing_aspect: "POST /menu-items with all required fields returns 201 and echoes name/tier/base_price_cents plus system id/created_at/version=1."
        test_recipe:
          setup: ["Empty DB; clock at default 2026-01-01."]
          setup_api_calls: []
          trigger:
            - call: "POST /menu-items"
              payload: { name: "Myers", tier: "MYERS", base_price_cents: 17500 }
              as: ClinicAdmin
              captures: { id: $.data.id, v: $.data.version }
          assert:
            - "http_status == 201"
            - "InfusionMenuItem.${id}.tier == MYERS"
            - "InfusionMenuItem.${id}.base_price_cents == 17500"
            - "InfusionMenuItem.${id}.version == 1"

      - name: menu_item_defaults_applied_when_omitted
        claim_type: Defaults
        grounds:
          - entities.InfusionMenuItem.fields.requires_standing_order
          - entities.InfusionMenuItem.fields.g6pd_sensitive
          - entities.InfusionMenuItem.fields.active
        distinguishing_aspect: "Omitting requires_standing_order/g6pd_sensitive/active applies defaults true/false/true respectively."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /menu-items"
              payload: { name: "NAD", tier: "NAD", base_price_cents: 65000 }
              as: ClinicAdmin
              captures: { id: $.data.id }
          assert:
            - "InfusionMenuItem.${id}.requires_standing_order == true"
            - "InfusionMenuItem.${id}.g6pd_sensitive == false"
            - "InfusionMenuItem.${id}.active == true"

      - name: membership_remaining_credits_initialized_from_total
        claim_type: Computed Fields
        grounds:
          - entities.Membership.fields.drip_credits_remaining
          - entities.Membership.fields.addon_credits_remaining
        distinguishing_aspect: "On create, drip_credits_remaining and addon_credits_remaining equal their *_total inputs; status defaults ACTIVE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /memberships"
              payload: { tier: "GOLD", covered_drip_tier: "MYERS", drip_credits_total: 4, addon_credits_total: 6 }
              as: ClinicAdmin
              captures: { id: $.data.id }
          assert:
            - "Membership.${id}.drip_credits_remaining == 4"
            - "Membership.${id}.addon_credits_remaining == 6"
            - "Membership.${id}.status == ACTIVE"

      - name: patient_open_adverse_event_count_defaults_zero
        claim_type: Computed Fields
        grounds: [entities.Patient.fields.open_adverse_event_count]
        distinguishing_aspect: "A freshly created patient has open_adverse_event_count == 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Pat", date_of_birth: "1990-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { id: $.data.id }
          assert:
            - "Patient.${id}.open_adverse_event_count == 0"

      - name: system_fields_generated_on_create
        claim_type: System Fields
        grounds: [entities.Lounge]
        distinguishing_aspect: "id/created_at/updated_at/version are server-minted; client-supplied id/version are ignored (not accepted as input fields)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /lounges"
              payload: { name: "L1", bay_count: 3 }
              as: ClinicAdmin
              captures: { id: $.data.id, v: $.data.version }
          assert:
            - "Lounge.${id}.version == 1"
            - "Lounge.${id}.id is a UUID without a type prefix"

      - name: missing_required_field_rejected
        claim_type: Required Fields
        grounds: [entities.InfusionMenuItem.fields.base_price_cents]
        distinguishing_aspect: "POST /menu-items without base_price_cents returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /menu-items"
              payload: { name: "Myers", tier: "MYERS" }
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "http_status == 422"

      - name: invalid_enum_value_rejected
        claim_type: Type Constraints
        grounds: [entities.InfusionMenuItem.fields.tier]
        distinguishing_aspect: "tier='SUPER' (not in MYERS/NAD/IMMUNITY) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /menu-items"
              payload: { name: "X", tier: "SUPER", base_price_cents: 100 }
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "http_status == 422"

      - name: appointment_lounge_id_required_for_lounge
        claim_type: Type Constraints
        grounds:
          - entities.Appointment.fields.lounge_id
          - entities.Appointment.fields.location_type
        distinguishing_aspect: "location_type=LOUNGE with lounge_id omitted returns ERR_INVALID_REQUEST (422) (lounge_id required iff LOUNGE)."
        test_recipe:
          setup: ["MYERS drip and a patient exist."]
          setup_api_calls:
            - call: "POST /menu-items"
              payload: { name: "Myers", tier: "MYERS", base_price_cents: 17500, requires_standing_order: false }
              as: ClinicAdmin
              captures: { myers_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat", date_of_birth: "1990-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", menu_item_id: "${myers_id}", location_type: "LOUNGE", start_at: "2026-06-23T09:00:00Z" }
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "http_status == 422"

      - name: get_menu_item_not_found
        claim_type: Not Found
        grounds: [entities.InfusionMenuItem, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /menu-items/{random-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /menu-items/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "http_status == 404"

      - name: appointment_fk_patient_not_found
        claim_type: Parent Relationships
        grounds: [entities.Appointment.fields.patient_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Creating an appointment with a non-existent patient_id returns ERR_NOT_FOUND (404) (FK existence)."
        test_recipe:
          setup: ["MYERS drip and a lounge exist."]
          setup_api_calls:
            - call: "POST /menu-items"
              payload: { name: "Myers", tier: "MYERS", base_price_cents: 17500, requires_standing_order: false }
              as: ClinicAdmin
              captures: { myers_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "L1", bay_count: 2 }
              as: ClinicAdmin
              captures: { lounge_id: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { patient_id: "00000000-0000-4000-8000-000000000000", menu_item_id: "${myers_id}", location_type: "LOUNGE", lounge_id: "${lounge_id}", start_at: "2026-06-23T09:00:00Z" }
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "http_status == 404"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: complete_from_scheduled_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Appointment.IN_PROGRESS_to_COMPLETED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Completing a SCHEDULED (not IN_PROGRESS) appointment returns ERR_INVALID_STATE (409); no supply consumed."
        test_recipe:
          setup: ["MYERS LOUNGE appointment CLEARED+consented and SCHEDULED; nurse exists but never started."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-22T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /menu-items"
              payload: { name: "Myers", tier: "MYERS", base_price_cents: 17500, requires_standing_order: false }
              as: ClinicAdmin
              captures: { myers_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "L1", bay_count: 2 }
              as: ClinicAdmin
              captures: { lounge_id: $.data.id }
            - call: "POST /supply-lots"
              payload: { item_kind: "DRIP_BASE", tier_or_code: "MYERS", lot_number: "MY-1", units_total: 3, expires_at: "2026-12-31T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /nurses"
              payload: { full_name: "Nurse A", license_number: "RN-A" }
              as: ClinicAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat", date_of_birth: "1990-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", menu_item_id: "${myers_id}", location_type: "LOUNGE", lounge_id: "${lounge_id}", start_at: "2026-06-23T09:00:00Z" }
              as: ClinicAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /appointments/${ap_id}/intake"
              payload: { author_user_id: "intake-1" }
              as: IntakeNurse
              as_user_id: "intake-1"
            - call: "POST /consents"
              payload: { appointment_id: "${ap_id}", signed_by_patient: true, witness_user_id: "wit-1" }
              as: ClinicAdmin
            - call: "GET /appointments/${ap_id}"
              payload: {}
              as: ClinicAdmin
              captures: { ap_v: $.data.version }
            - call: "POST /appointments/${ap_id}/schedule"
              payload: { expected_appointment_version: "${ap_v}" }
              as: ClinicAdmin
            - call: "POST /appointments/${ap_id}/dispatch"
              payload: { nurse_id: "${nurse_id}" }
              as: ClinicAdmin
          trigger:
            - call: "POST /appointments/${ap_id}/complete"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: cancel_completed_appointment_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Appointment.SCREEN_PENDING_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling a COMPLETED (terminal) appointment returns ERR_INVALID_STATE (409); supply stays consumed."
        test_recipe:
          setup: ["MYERS LOUNGE appointment driven to COMPLETED by nurse-A."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-22T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /menu-items"
              payload: { name: "Myers", tier: "MYERS", base_price_cents: 17500, requires_standing_order: false }
              as: ClinicAdmin
              captures: { myers_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "L1", bay_count: 2 }
              as: ClinicAdmin
              captures: { lounge_id: $.data.id }
            - call: "POST /supply-lots"
              payload: { item_kind: "DRIP_BASE", tier_or_code: "MYERS", lot_number: "MY-1", units_total: 3, expires_at: "2026-12-31T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /nurses"
              payload: { full_name: "Nurse A", license_number: "RN-A" }
              as: ClinicAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat", date_of_birth: "1990-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", menu_item_id: "${myers_id}", location_type: "LOUNGE", lounge_id: "${lounge_id}", start_at: "2026-06-23T09:00:00Z" }
              as: ClinicAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /appointments/${ap_id}/intake"
              payload: { author_user_id: "intake-1" }
              as: IntakeNurse
              as_user_id: "intake-1"
            - call: "POST /consents"
              payload: { appointment_id: "${ap_id}", signed_by_patient: true, witness_user_id: "wit-1" }
              as: ClinicAdmin
            - call: "GET /appointments/${ap_id}"
              payload: {}
              as: ClinicAdmin
              captures: { ap_v: $.data.version }
            - call: "POST /appointments/${ap_id}/schedule"
              payload: { expected_appointment_version: "${ap_v}" }
              as: ClinicAdmin
            - call: "POST /appointments/${ap_id}/dispatch"
              payload: { nurse_id: "${nurse_id}" }
              as: ClinicAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-23T09:05:00Z" }
              as: ClinicAdmin
            - call: "POST /appointments/${ap_id}/start"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
            - call: "POST /appointments/${ap_id}/complete"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
          trigger:
            - call: "POST /appointments/${ap_id}/cancel"
              payload: {}
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: activate_already_active_standing_order_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.StandingOrder.DRAFT_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Activating an ACTIVE standing order a second time returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Clock 2026-06-22; a NAD standing order activated once by md-1."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-22T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /standing-orders"
              payload: { medical_director_user_id: "md-1", covered_tier: "NAD", effective_from: "2026-06-01T00:00:00Z", expires_at: "2026-12-31T00:00:00Z" }
              as: MedicalDirector
              as_user_id: "md-1"
              captures: { so_id: $.data.id }
            - call: "POST /standing-orders/${so_id}/activate"
              payload: {}
              as: MedicalDirector
              as_user_id: "md-1"
          trigger:
            - call: "POST /standing-orders/${so_id}/activate"
              payload: {}
              as: MedicalDirector
              as_user_id: "md-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: md_decline_moves_to_declined
        claim_type: Valid Transition
        grounds:
          - state_machines.Appointment.REQUIRES_MD_REVIEW_to_DECLINED
          - entities.Appointment.fields.status
        distinguishing_aspect: "md-decline on a REQUIRES_MD_REVIEW appointment moves it to DECLINED (terminal), no supply reserved."
        test_recipe:
          setup: ["Clock 2026-06-22; MYERS LOUNGE; patient DOB 1950 + pregnancy => score 50 => REQUIRES_MD_REVIEW after intake+schedule; consent present; md-2 declines."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-22T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /menu-items"
              payload: { name: "Myers", tier: "MYERS", base_price_cents: 17500, requires_standing_order: false }
              as: ClinicAdmin
              captures: { myers_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "L1", bay_count: 2 }
              as: ClinicAdmin
              captures: { lounge_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Old Pat", date_of_birth: "1950-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", menu_item_id: "${myers_id}", location_type: "LOUNGE", lounge_id: "${lounge_id}", start_at: "2026-06-23T09:00:00Z" }
              as: ClinicAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /appointments/${ap_id}/intake"
              payload: { author_user_id: "intake-1", pregnancy: true }
              as: IntakeNurse
              as_user_id: "intake-1"
            - call: "POST /consents"
              payload: { appointment_id: "${ap_id}", signed_by_patient: true, witness_user_id: "wit-1" }
              as: ClinicAdmin
            - call: "GET /appointments/${ap_id}"
              payload: {}
              as: ClinicAdmin
              captures: { ap_v: $.data.version }
            - call: "POST /appointments/${ap_id}/schedule"
              payload: { expected_appointment_version: "${ap_v}" }
              as: ClinicAdmin
          trigger:
            - call: "POST /appointments/${ap_id}/md-decline"
              payload: {}
              as: MedicalDirector
              as_user_id: "md-2"
              captures: { st: $.data.status }
          assert:
            - "Appointment.${ap_id}.status == DECLINED"

      - name: schedule_appointment_fork_to_review_excluded
        claim_type: Valid Transition
        grounds: [state_machines.Appointment.SCREEN_PENDING_to_REQUIRES_MD_REVIEW]
        excluded_because:
          difficulty_instance: nl_appointment_fork_review_then_approve
          rationale: "The SCREEN_PENDING->REQUIRES_MD_REVIEW->SCHEDULED fork is exercised end-to-end by that §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: fefo_picks_earliest_expiry_lot
        claim_type: Correct Result
        grounds:
          - calculations.lot_selection_fefo
          - entities.SupplyLot.fields.expires_at
        distinguishing_aspect: "Given two AVAILABLE MYERS lots (expiry 2026-08-01 vs 2026-12-31), scheduling reserves from the EARLIER-expiry lot (FEFO); the later lot stays at units_reserved 0."
        test_recipe:
          setup: ["Clock 2026-06-22; MYERS LOUNGE; two MYERS lots, earlier expiry first; appointment CLEARED+consented."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-22T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /menu-items"
              payload: { name: "Myers", tier: "MYERS", base_price_cents: 17500, requires_standing_order: false }
              as: ClinicAdmin
              captures: { myers_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "L1", bay_count: 2 }
              as: ClinicAdmin
              captures: { lounge_id: $.data.id }
            - call: "POST /supply-lots"
              payload: { item_kind: "DRIP_BASE", tier_or_code: "MYERS", lot_number: "EARLY", units_total: 5, expires_at: "2026-08-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { early_lot: $.data.id }
            - call: "POST /supply-lots"
              payload: { item_kind: "DRIP_BASE", tier_or_code: "MYERS", lot_number: "LATE", units_total: 5, expires_at: "2026-12-31T00:00:00Z" }
              as: ClinicAdmin
              captures: { late_lot: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat", date_of_birth: "1990-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", menu_item_id: "${myers_id}", location_type: "LOUNGE", lounge_id: "${lounge_id}", start_at: "2026-06-23T09:00:00Z" }
              as: ClinicAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /appointments/${ap_id}/intake"
              payload: { author_user_id: "intake-1" }
              as: IntakeNurse
              as_user_id: "intake-1"
            - call: "POST /consents"
              payload: { appointment_id: "${ap_id}", signed_by_patient: true, witness_user_id: "wit-1" }
              as: ClinicAdmin
            - call: "GET /appointments/${ap_id}"
              payload: {}
              as: ClinicAdmin
              captures: { ap_v: $.data.version }
          trigger:
            - call: "POST /appointments/${ap_id}/schedule"
              payload: { expected_appointment_version: "${ap_v}" }
              as: ClinicAdmin
          assert:
            - "SupplyLot.${early_lot}.units_reserved == 1"
            - "SupplyLot.${late_lot}.units_reserved == 0"

      - name: gold_discount_single_line_correct
        claim_type: Constants Applied
        grounds:
          - calculations.visit_charge_waterfall.constants
          - entities.Appointment.fields.amount_charged_cents
        distinguishing_aspect: "GOLD (15%) on a single MYERS drip (no add-ons, LOUNGE, no credits) yields amount_charged_cents = round_half_up(17500*0.85) = 14875."
        test_recipe:
          setup: ["Clock 2026-06-22; MYERS LOUNGE; GOLD membership covered_drip_tier=NAD (so drip NOT credit-covered) with 0 credits; supply present."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-22T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /menu-items"
              payload: { name: "Myers", tier: "MYERS", base_price_cents: 17500, requires_standing_order: false }
              as: ClinicAdmin
              captures: { myers_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "L1", bay_count: 2 }
              as: ClinicAdmin
              captures: { lounge_id: $.data.id }
            - call: "POST /supply-lots"
              payload: { item_kind: "DRIP_BASE", tier_or_code: "MYERS", lot_number: "MY-1", units_total: 5, expires_at: "2026-12-31T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /memberships"
              payload: { tier: "GOLD", covered_drip_tier: "NAD", drip_credits_total: 0, addon_credits_total: 0 }
              as: ClinicAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat", date_of_birth: "1990-01-01T00:00:00Z", membership_id: "${mem_id}" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", menu_item_id: "${myers_id}", location_type: "LOUNGE", lounge_id: "${lounge_id}", start_at: "2026-06-23T09:00:00Z", membership_id: "${mem_id}" }
              as: ClinicAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /appointments/${ap_id}/intake"
              payload: { author_user_id: "intake-1" }
