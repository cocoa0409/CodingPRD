          assert:
            - "the block create returns HTTP 201 with total_capacity 4, max_concurrent_reservations 2, minted_count 0, available_count 0, version 1"
            - "GET /voip/number-blocks/${blk_id} returns npa_nxx '415618', minted_count 1, available_count 1, reserved_count 0, assigned_count 0, parked_count 0"
            - "the filtered block list returns total_count 1, has_more false and the same id"
            - "the phone-number list returns total_count 1 with e164 '+14156183401' and status AVAILABLE"

      - name: rejecting_a_dispatchable_location_suspends_the_device_and_blocks_the_account
