            - { call: "POST /locker/animals/${an1}/slaughter", payload: {}, as: PlantOperator }
          trigger:
            - { call: "POST /locker/animals/${an1}/start-fabrication", payload: {}, as: PlantOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (state priority 4 beats business_referential priority 8)"
            - "Animal remains SLAUGHTERED"

      - name: booking_lead_time_beats_outstanding_balance
        grounds:
