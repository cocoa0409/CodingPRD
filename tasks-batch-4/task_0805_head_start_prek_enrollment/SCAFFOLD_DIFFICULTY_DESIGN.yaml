              payload: { enrollment_id: "${enr1}", attendance_date: "2026-03-11", status: "PRESENT", instructional_day: true }
              as: FamilyServicesWorker
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr1}", attendance_date: "2026-03-12", status: "PRESENT", instructional_day: true }
              as: FamilyServicesWorker
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr1}", attendance_date: "2026-03-13", status: "ABSENT_UNEXCUSED", instructional_day: true }
              as: FamilyServicesWorker
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr2}", attendance_date: "2026-03-02", status: "PRESENT", instructional_day: true }
              as: FamilyServicesWorker
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr2}", attendance_date: "2026-03-03", status: "PRESENT", instructional_day: true }
              as: FamilyServicesWorker
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr2}", attendance_date: "2026-03-04", status: "PRESENT", instructional_day: true }
