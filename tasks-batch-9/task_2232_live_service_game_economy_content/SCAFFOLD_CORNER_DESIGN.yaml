          The PROJECTED variant re-reads the scheduled pipeline on every call: while Episode 2 is
          still SCHEDULED for a future date its 600 XP counts as pending (eligible_scheduled_xp
          600), and once that episode is released and its XP is actually earned the pending term
          drops to 0 while the realized term rises, so PROJECTED holds at 3333 for a completely
          different reason.
