      - name: county_escrow_occupancy_conservation_across_refund
        grounds:
          - calculations.county_quota_position
          - entities.County.fields.escrow_committed_count
          - entities.County.fields.quota_licenses_counted
          - state_machines.License.IN_ESCROW_to_ACTIVE
          - endpoints[POST /purchase-agreements/{agreement_id}/escrow-settlement]
        distinguishing_aspect: |
          Conserved quantity = an INTEGER occupancy count, not money: County.escrow_committed_count goes
          0 -> 1 at execution and returns to exactly 0 after the REFUND compensation, while
          quota_licenses_counted stays 1 the whole time because the licence never leaves the county's quota.
        test_recipe:
          setup:
            - "County SON with quota_licenses_total 100 holding exactly one licence, so quota_licenses_counted is 1 and escrow_committed_count is 0."
            - "That licence is listed, sold at 18500010 with 2405001 cents deposited, and the agreement is EXECUTED so the licence is IN_ESCROW."
            - "The application is posted at 2026-08-10T00:00:00Z and DENIED at 2026-09-10T00:00:00Z by a second analyst."
          setup_api_calls:
            - call: "POST /counties"
              payload: { county_code: "SON", name: "Sonoma", state_code: "CA", quota_licenses_total: 100, protest_window_days: 15 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /seller-profiles"
              payload: { legal_name: "Vine Holdings LLC", contact_email: "seller@example.com", tax_clearance_status: "CLEARED" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /buyer-profiles"
              payload: { legal_name: "Coast Hospitality LLC", entity_type: "LLC", residency_state: "CA", citizenship_verified: true }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /brokerages"
              payload: { firm_name: "Bay Brokers", state_broker_license_no: "BRK-0001", commission_rate_bps: 575 }
              as: PlatformAdmin
              captures: { brk_id: $.data.id }
            - call: "POST /licenses"
              payload: { county_id: "${c_id}", owner_seller_id: "${s_id}", license_number: "OCC-1", license_class: "CLASS_47_ONSALE_GENERAL", annual_gross_receipts_cents: 120000000, last_active_date: "2026-07-01" }
              as: PlatformAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /premises"
              payload: { buyer_id: "${b_id}", county_id: "${c_id}", address_line: "6 Vine St", zoning_code: "C1", distance_to_nearest_school_feet: 900, distance_to_nearest_church_feet: 900 }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { prem_id: $.data.id }
            - call: "POST /premises/${prem_id}/zoning-verification"
              payload: { conditional_use_permit_status: "GRANTED" }
              as: RegulatorAnalyst
              as_user_id: "analyst-1"
            - call: "POST /premises/${prem_id}/landlord-consent"
              payload: { landlord_consent_status: "GRANTED", consent_document_ref: "doc/consent-6" }
              as: Broker
              as_user_id: "${brk_id}"
            - call: "POST /buyer-profiles/${b_id}/qualification-review"
              payload: { review_mode: "FINAL_REVIEW", premises_id: "${prem_id}" }
              as: RegulatorAnalyst
              as_user_id: "analyst-1"
            - call: "POST /listings"
              payload: { license_id: "${lic_id}", brokerage_id: "${brk_id}", ask_price_cents: 18500000 }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: Broker
              as_user_id: "${brk_id}"
              captures: { lst_v1: $.data.version }
            - call: "POST /purchase-agreements"
              payload: { listing_id: "${lst_id}", buyer_id: "${b_id}", premises_id: "${prem_id}", purchase_price_cents: 18500010, deposit_pct_bps: 1000, closing_window_start: "2026-09-01T00:00:00Z", expected_listing_version: "${lst_v1}" }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { agr_id: $.data.id }
            - call: "POST /dual-agency-disclosures"
              payload: { agreement_id: "${agr_id}", represents_seller: true, represents_buyer: false }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { dis_id: $.data.id }
            - call: "POST /dual-agency-disclosures/${dis_id}/acknowledge"
              payload: { party: "SELLER" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /purchase-agreements/${agr_id}/escrow-deposit"
              payload: { amount_cents: 2405001 }
              as: EscrowOfficer
            - call: "GET /counties/${c_id}"
              payload: {}
              as: PlatformAdmin
              captures: { cnt_before: $.data.escrow_committed_count }
            - call: "POST /purchase-agreements/${agr_id}/execute"
              payload: {}
              as: Broker
              as_user_id: "${brk_id}"
            - call: "POST /transfer-applications"
              payload: { agreement_id: "${agr_id}", fee_paid_cents: 173250 }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { app_id: $.data.id }
            - call: "POST /transfer-applications/${app_id}/accept-review"
              payload: {}
              as: RegulatorAnalyst
              as_user_id: "analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /transfer-applications/${app_id}/post-notice"
              payload: {}
              as: RegulatorAnalyst
              as_user_id: "analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /transfer-applications/${app_id}/decision"
              payload: { decision: "DENIED", decision_note: "public welfare" }
              as: RegulatorAnalyst
              as_user_id: "analyst-2"
          trigger:
            - call: "GET /counties/${c_id}"
              payload: {}
              as: PlatformAdmin
              captures: { cnt_in_escrow: $.data.escrow_committed_count }
            - call: "POST /purchase-agreements/${agr_id}/escrow-settlement"
              payload: { disposition: "REFUND", memo: "transfer denied - return deposit" }
              as: EscrowOfficer
            - call: "GET /counties/${c_id}"
              payload: {}
              as: PlatformAdmin
              captures: { cnt_after: $.data.escrow_committed_count }
          assert:
            - "${cnt_before} == 0 (funding escrow alone commits no licence)"
            - "${cnt_in_escrow} == 1 after execution moved the licence to IN_ESCROW"
            - "${cnt_after} == 0 - the REFUND compensation restores the occupancy count exactly, with no drift"
            - "County.${c_id}.quota_licenses_counted == 1 at all three observations and quota_available == 99 throughout"
            - "License.${lic_id}.status == ACTIVE and transferred_to_buyer_id is null after the refund"
            - "Listing.${lst_id}.status == ACTIVE and PurchaseAgreement.${agr_id}.agreement_status == TERMINATED"
            - "DualAgencyDisclosure.${dis_id}.status == VOID"
            - "PurchaseAgreement.${agr_id}.escrow_balance_cents == 0 with a single -2405001 REFUND_BUYER ledger row"
