        grounds:
          - errors[ERR_PARTICIPATION_WINDOW_OVERLAP]
          - entities.NetworkParticipation.fields.effective_from
          - entities.NetworkParticipation.fields.effective_to
        distinguishing_aspect: |
          Interval semantics: INCLUSIVE whole-date ranges with no buffer — a new
          window sharing the boundary date 2026-06-30 collides, while starting the
          next day 2026-07-01 is allowed. Distinct resource (NetworkParticipation
          per specialist+plan) and distinct geometry from
          appointment_overlap_buffer_semantics' half-open datetimes + buffer.
