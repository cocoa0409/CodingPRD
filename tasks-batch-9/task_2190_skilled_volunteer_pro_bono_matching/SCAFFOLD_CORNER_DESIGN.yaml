            - "data.error_id == \"ERR_ROLE_NOT_PERMITTED\""
            - "GET /volunteers/${vol_id}/skill-profiles as ProgramManager returns HTTP 200 with total_count == 0"
      - name: rbac_program_manager_cannot_publish_availability_window
