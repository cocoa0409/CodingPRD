            - call: "POST /meat-ops/retail-items/${ri1_id}/price-proposals"
              payload: { primal_purchase_id: "${p1_id}" }
              as: PricingAnalyst
              as_user_id: "analyst-01"
            - call: "POST /meat-ops/pre-orders"
              payload: { department_id: "${dept_id}", retail_item_id: "${ri1_id}", customer_name: "R. Ruiz", customer_phone: "555-0100", requested_weight_lb: 5.0, pickup_window_start_at: "2026-08-05T14:00:00Z", pickup_window_end_at: "2026-08-05T15:00:00Z" }
              as: ServiceClerk
