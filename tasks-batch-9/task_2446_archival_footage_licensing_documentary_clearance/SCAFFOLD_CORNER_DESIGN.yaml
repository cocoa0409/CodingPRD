              payload: { production_id: "${prod_id}", asset_id: "${asset_id}", archive_id: "${label_id}", rights_leg: "MASTER", media: "BROADCAST", territory: "DOMESTIC", window_class: "ALL_MEDIA_WINDOW", term_months: 12, term_start_date: "2026-08-15", term_end_date: "2027-08-15" }
              as: ClearanceSupervisor
              captures: { lic_m: $.data.id, lic_m_v: $.data.version }
            - call: "POST /licenses/${lic_m}/negotiation-rounds"
              payload: { party: "LICENSOR", proposed_fee_cents: 28750, expected_license_version: "${lic_m_v}" }
              as: RightsHolderRep
              as_user_id: "${label_id}"
            - call: "POST /licenses/${lic_m}/state"
              payload: { to_status: "EXECUTED" }
              as: ClearanceSupervisor
            - call: "POST /licenses"
              payload: { production_id: "${prod_id}", asset_id: "${asset_id}", archive_id: "${pub_id}", rights_leg: "PUBLISHING", media: "BROADCAST", territory: "DOMESTIC", window_class: "ALL_MEDIA_WINDOW", term_months: 12, term_start_date: "2026-08-15", term_end_date: "2027-08-15" }
              as: ClearanceSupervisor
              captures: { lic_p: $.data.id, lic_p_v: $.data.version }
            - call: "POST /licenses/${lic_p}/negotiation-rounds"
              payload: { party: "LICENSOR", proposed_fee_cents: 28750, expected_license_version: "${lic_p_v}" }
              as: RightsHolderRep
              as_user_id: "${pub_id}"
            - call: "POST /licenses/${lic_p}/state"
              payload: { to_status: "EXECUTED" }
              as: ClearanceSupervisor
          assert:
            - "after the MASTER licence is created (DRAFT): Asset.${asset_id}.licensing_status == IN_NEGOTIATION, rights_basis == UNDETERMINED"
            - "after the MASTER licence is EXECUTED: licensing_status == PARTIALLY_CLEARED, rights_basis still UNDETERMINED, and Production.${prod_id}.posture == BLOCKED (1 of 1 asset open)"
            - "after the PUBLISHING licence is created (DRAFT) the status stays PARTIALLY_CLEARED — a DRAFT leg never enters covered_legs"
            - "after the PUBLISHING licence is EXECUTED: licensing_status == CLEARED, rights_basis == LICENSED, posture == OPEN"
            - "License.${lic_m}.rate_card_fee_cents == 28750 and License.${lic_p}.rate_card_fee_cents == 28750, and Production.${prod_id}.committed_fee_cents == 57500"
            - "neither licence set mfn_topup_cents (both are 0) because mfn_requested defaulted to false"

