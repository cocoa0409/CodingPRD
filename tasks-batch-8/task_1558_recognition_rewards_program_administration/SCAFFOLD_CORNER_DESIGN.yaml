      - name: missing_user_headers_unauthenticated
        claim_type: rbac_denial
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers is rejected ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any role or resource check."
