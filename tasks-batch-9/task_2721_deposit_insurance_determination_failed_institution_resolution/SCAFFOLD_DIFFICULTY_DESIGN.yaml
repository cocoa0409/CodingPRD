              as: ClaimsAgent
              captures: { hana_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${inst8_id}", primary_depositor_id: "${hana_id}", account_number: "H-0001", ownership_category: "SINGLE", balance_cents: 20000000, accrued_interest_cents: 0, opened_at: "2024-03-01T00:00:00Z" }
              as: ClaimsAgent
              captures: { h1_id: $.data.id }
            - call: "POST /institutions/${inst8_id}/readiness-submissions"
              payload: { file_format: "FDIC_STANDARD_V2", record_count: 200, malformed_record_count: 4, reported_deposit_total_cents: 20000000 }
              as: ClosingManager
              captures: { sub8_id: $.data.id }
            - call: "POST /readiness-submissions/${sub8_id}/standardize"
              payload: {}
              as: ClosingManager
            - call: "POST /institutions/${inst8_id}/close"
              payload: {}
              as: ClosingManager
            - call: "GET /depositor-records/${hana_id}"
              as: ClaimsAgent
              captures: { hana_v: $.data.version }
            - call: "POST /insurance-determinations"
              payload: { depositor_record_id: "${hana_id}", expected_depositor_record_version: "${hana_v}" }
              as: ClaimsAgent
              captures: { hana_det_id: $.data.id }
            - call: "POST /insurance-determinations/${hana_det_id}/prepare"
              payload: { method_variant: "AGGREGATE_BY_CATEGORY" }
              as: ClaimsAgent
              as_user_id: "dual-actor-77"
          trigger:
            - call: "POST /insurance-determinations/${hana_det_id}/certify"
              payload: {}
              as: ClaimsCertifier
              as_user_id: "dual-actor-77"
              captures: { conflict_error_id: "$.data.error_id", conflict_message: "$.data.message" }
            - call: "POST /insurance-determinations/${hana_det_id}/submit-review"
              payload: {}
              as: ClaimsAgent
              as_user_id: "dual-actor-77"
            - call: "POST /insurance-determinations/${hana_det_id}/certify"
              payload: {}
              as: ClaimsCertifier
              as_user_id: "dual-actor-77"
              captures: { sod_error_id: "$.data.error_id" }
          assert:
            - "trigger[0] returns HTTP 409 with data.error_id == 'ERR_DETERMINATION_NOT_UNDER_REVIEW' (priority 45, category state)"
            - "trigger[0] does NOT return 'ERR_SEGREGATION_OF_DUTIES_VIOLATION' and does NOT return HTTP 403 — the business_constraint at priority 60 is shadowed"
            - "trigger[0] leaves InsuranceDetermination.${hana_det_id}.status == PREPARED and version unchanged (no partial write)"
            - "trigger[1] response data.status == UNDER_REVIEW — the state gate is now satisfied"
            - "trigger[2] returns HTTP 403 with data.error_id == 'ERR_SEGREGATION_OF_DUTIES_VIOLATION' (priority 60 is genuinely enforced; trigger[0] was an ordering result, not a missing rule)"
            - "trigger[2] leaves InsuranceDetermination.${hana_det_id}.status == UNDER_REVIEW, certified_by_user_id == null, and no ReceivershipCertificate exists for ${hana_id}"

