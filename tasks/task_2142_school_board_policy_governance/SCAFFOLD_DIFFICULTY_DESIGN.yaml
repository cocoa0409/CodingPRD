              as: PolicyAnalyst
              captures: { pv1: $.data.id }
            - call: "POST /governance/policy-versions/${pv1}/withdraw"
              payload: { withdrawn_reason: "Superseded by counsel guidance before first reading." }
              as: PolicyAnalyst
              captures: { pv1_status: $.data.status }
            - call: "POST /governance/meetings"
              payload: { title: "September Regular Meeting", scope: "FULL_BOARD", meeting_type: "REGULAR", scheduled_start_utc: "2026-09-10T18:00:00Z" }
              as: BoardClerk
              captures: { m: $.data.id }
            - call: "POST /governance/meetings/${m}/notice"
              payload: {}
              as: BoardClerk
              captures: { m_v_locked: $.data.version, m_locked_at: $.data.agenda_locked_at }
          trigger:
            - call: "POST /governance/agenda-items"
              payload: { meeting_id: "${m}", item_type: "POLICY_FIRST_READING", title: "First reading of a withdrawn draft", expected_meeting_version: "${m_v_locked}", policy_version_id: "${pv1}" }
              as: BoardClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response data.error_id == ERR_AGENDA_LOCKED"
            - "response data.error_id != ERR_POLICY_VERSION_NOT_ELIGIBLE"
            - "PolicyVersion.${pv1}.status == WITHDRAWN"
            - "Meeting.${m}.agenda_locked_at == 2026-08-01T00:00:00Z"
            - "GET /governance/agenda-items?meeting_id=${m} returns total_count == 0"

      - name: waiver_overlap_temporal_beats_duration_cap_constraint
        grounds:
          - validations[priority=59]
          - validations[priority=66]
          - errors[ERR_WAIVER_WINDOW_OVERLAP]
          - errors[ERR_WAIVER_DURATION_EXCEEDS_CAP]
          - calculations.waiver_grant_window
        distinguishing_aspect: |
          One request violates a `business_temporal` rule at priority 59 (its half-open window
          overlaps a live waiver for the same policy and school) and a `business_constraint` rule at
          priority 66 (243 requested days exceeds the 90-day cap that REQUIRED_BY_LAW policies
          carry). The response must be ERR_WAIVER_WINDOW_OVERLAP with HTTP 409, never
          ERR_WAIVER_DURATION_EXCEEDS_CAP. Category pair: business_temporal versus
          business_constraint -- a third distinct pair.
        test_recipe:
          setup:
            - "Committee C1 exists as the reviewing committee (no seats are needed to file a request)."
            - "Policy BP-4119 is REQUIRED_BY_LAW, so its waiver cap is 90 days."
            - "Waiver W1 for HS-01 covering 2026-10-01 to 2026-11-01 (31 days) is SUBMITTED and therefore live."
          setup_api_calls:
            - call: "POST /governance/committees"
              payload: { name: "Policy Committee", charter_type: "POLICY", seat_capacity: 3, quorum_size: 2 }
              as: BoardClerk
              captures: { c1: $.data.id }
            - call: "POST /governance/policies"
              payload: { code: "BP-4119", title: "Employee Conflict of Interest", category: "PERSONNEL", legal_requirement_level: "REQUIRED_BY_LAW", manual_section: "4000.19" }
              as: PolicyAnalyst
              captures: { pol: $.data.id }
            - call: "POST /governance/waiver-requests"
              payload: { policy_id: "${pol}", reviewing_committee_id: "${c1}", requesting_school_code: "HS-01", justification: "Pilot period one", requested_start_date: "2026-10-01T00:00:00Z", requested_end_date: "2026-11-01T00:00:00Z" }
              as: SchoolPrincipal
              captures: { w1: $.data.id, w1_cap: $.data.max_allowed_days }
          trigger:
            - call: "POST /governance/waiver-requests"
              payload: { policy_id: "${pol}", reviewing_committee_id: "${c1}", requesting_school_code: "HS-01", justification: "Extended pilot that both overlaps and overruns", requested_start_date: "2026-10-15T00:00:00Z", requested_end_date: "2027-06-15T00:00:00Z" }
              as: SchoolPrincipal
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_WAIVER_WINDOW_OVERLAP"
            - "response data.error_id != ERR_WAIVER_DURATION_EXCEEDS_CAP"
            - "WaiverRequest.${w1}.max_allowed_days == 90"
            - "WaiverRequest.${w1}.status == SUBMITTED"
            - "GET /governance/waiver-requests?policy_id=${pol} returns total_count == 1"

  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: notice_lead_time_at_exactly_seventy_two_hours_is_accepted
        grounds:
          - validations[priority=50]
          - errors[ERR_NOTICE_PERIOD_TOO_SHORT]
          - state_machines.Meeting.DRAFT_to_NOTICED
          - entities.Meeting.fields.notice_posted_at
        distinguishing_aspect: |
          The metric is elapsed hours between the logical clock and scheduled_start_utc, checked on
          the notice endpoint. At exactly 72:00:00 the notice is ACCEPTED because the rule is
          inclusive (>=), so a REGULAR meeting starting 2026-08-04T00:00:00Z can be noticed while
          the clock reads exactly the 2026-08-01T00:00:00Z server default. One second later it
          would fail.
        test_recipe:
          setup:
            - "The logical clock is untouched and therefore reads exactly the server default 2026-08-01T00:00:00Z."
            - "Meeting M is REGULAR (72-hour notice requirement), FULL_BOARD, scheduled for 2026-08-04T00:00:00Z, still DRAFT."
          setup_api_calls:
            - call: "POST /governance/meetings"
              payload: { title: "Boundary Notice Meeting", scope: "FULL_BOARD", meeting_type: "REGULAR", scheduled_start_utc: "2026-08-04T00:00:00Z" }
              as: BoardClerk
              captures: { m: $.data.id, m_status: $.data.status }
          trigger:
            - call: "POST /governance/meetings/${m}/notice"
              payload: {}
              as: BoardClerk
              captures: { m_noticed_at: $.data.notice_posted_at }
          assert:
            - "HTTP status == 200"
            - "Meeting.${m}.status == NOTICED"
            - "Meeting.${m}.notice_posted_at == 2026-08-01T00:00:00Z"
            - "Meeting.${m}.agenda_locked_at == 2026-08-01T00:00:00Z"

      - name: equal_split_override_at_exactly_four_speaker_cards
        grounds:
          - calculations.public_comment_minute_allocation
          - entities.Meeting.fields.public_comment_allocation_variant
          - entities.PublicComment.fields.allotted_minutes
          - state_machines.Meeting.NOTICED_to_OPEN
        distinguishing_aspect: |
          A different metric on a different endpoint from the notice boundary: collection
          cardinality, checked on the open endpoint. EQUAL_SPLIT_THRESHOLD is 4 and the test is
          inclusive (>=), so a meeting whose rule is FIRST_COME_CAPPED still flips to EQUAL_SPLIT at
          exactly four cards -- every speaker gets floor(30/4) capped at 3 minutes instead of the
          single minute each asked for, leaving 18 minutes unspent.
        test_recipe:
          setup:
            - "Three SEATED trustees; bm1 holds office PRESIDENT."
            - "Policy BP-5030 with one DRAFT version."
            - "Meeting M: REGULAR (30-minute public-comment budget), FULL_BOARD, starts 2026-09-10T18:00:00Z, public_comment_rule left at the FIRST_COME_CAPPED default."
            - "One POLICY_FIRST_READING item carrying exactly four distinct speaker cards, each asking for 1 minute."
            - "The meeting is NOTICED and the clock has been moved to 2026-09-10T18:00:00Z."
