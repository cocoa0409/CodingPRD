              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000, federal_withholding_cents: 900000 }
              as: Preparer
              as_user_id: "${tp_id}"
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Preparer
              as_user_id: "${tp_id}"
              captures: { v_c: $.data.version }
          trigger:
            - call: "POST /tax-returns/${ret_id}/efile"
              payload: { signature_pin: "12345", expected_return_version: "${v_c}" }
              as: Preparer
              as_user_id: "${tp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN_ROLE"
            - "HTTP status == 403"

      - name: irsgateway_cannot_compute_forbidden_role
        claim_type: rbac_denial
        grounds: ["roles", "validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "IrsGateway (gateway role) attempting POST /tax-returns/{id}/compute is denied with ERR_FORBIDDEN_ROLE (403); the gateway may only acknowledge submissions."
        test_recipe:
          setup: ["Taxpayer + DRAFT TaxReturn with one W-2."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "rb2@x.com", full_name: "RB2", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE" }
