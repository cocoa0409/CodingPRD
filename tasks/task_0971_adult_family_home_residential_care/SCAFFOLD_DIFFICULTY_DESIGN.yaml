        grounds:
          - state_machines.Home.LICENSED_to_CLOSED
          - state_machines.Bed.HELD_to_OUT_OF_SERVICE
          - state_machines.Admission.PENDING_to_REJECTED
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST /homes/{id}/close: Home LICENSED->CLOSED mutates the
          HELD Bed to OUT_OF_SERVICE, and that bed mutation itself forces the linked PENDING
          Admission to REJECTED — the second link is caused by the bed change, not directly by
          the close call (the admission's bed-release compensation is suppressed).
        test_recipe:
          setup:
            - "Licensed home (capacity 4), census 0, one bed HELD by a PENDING admission for an APPLICANT resident, one SCHEDULED shift exists is not required (none scheduled)"
          setup_api_calls:
