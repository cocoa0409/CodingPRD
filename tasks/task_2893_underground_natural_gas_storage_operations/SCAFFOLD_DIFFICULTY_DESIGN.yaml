            - "GasMovementTicket.${t1}.volume_discount_usd == 0.00"
            - "GasMovementTicket.${t1}.fuel_charge_usd == 3808.80"
            - "GasMovementTicket.${t1}.total_charge_usd == 7948.80"
            - "GasMovementTicket.${t1}.total_charge_usd != 7866.00   # discount tier keyed on commodity + fuel"
            - "GasMovementTicket.${t1}.status == CONFIRMED"
            - "StorageField.${f1}.working_gas_inventory_dth == 3092000.000"
            - "StorageField.${f1}.retained_fuel_pool_dth == 1104.000"
            - "StorageContract.${c1}.inventory_balance_dth == 90896.000"
            - "StorageContract.${c1}.imbalance_dth == 2000.000"
            - "the DAILY_IMBALANCE ImbalanceLedgerEntry on ${c1} for gas_day 2026-08-02 has volume_dth == 2000.000 and amount_usd == 0.00"

      - name: compressor_fuel_burn_composes_derate_band_and_mode_multiplier
        grounds:
          - calculations.compressor_fuel_burn
          - entities.CompressorRun.fields.fuel_consumed_dth
          - entities.CompressorRun.fields.utilization_band
          - entities.CompressorUnit.fields.derate_factor
        distinguishing_aspect: |
          Fuel for one run chains four factors that must all be applied in the declared order: the unit's
          0.10 derate turns 5000 allocated horsepower into 4500 effective, the utilization ratio
          4500/6000 = 0.750000 selects the MID band rate 0.0092, the 8-hour window scales it, and the
          mode multiplier closes it out — 331.20 Dth for INJECTION versus 281.52 Dth for the identical
          WITHDRAWAL run on the same unit. Dropping the derate (5000 hp) would give 368.00, dropping the
          mode multiplier would make the withdrawal run equal the injection run, and both runs also have
          to land the field's fuel_gas_used_dth on 612.72 Dth.
        test_recipe:
          setup:
            - "Field F_STD with one well so the field posture is OPEN (POST /compressor-runs is gated on posture != FROZEN)."
            - "One compressor unit rated 6000 hp with derate_factor 0.10."
            - "Two adjacent SCHEDULED runs on that unit, each 8 hours and each allocating 5000 hp, so the windows never overlap: 2026-08-05T00:00Z-08:00Z INJECTION and 2026-08-05T08:00Z-16:00Z WITHDRAWAL."
            - "The clock is moved to 2026-08-05T16:00:00Z so both windows have elapsed."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Aurora Dome", field_code: "F-AUR", total_capacity_dth: 10000000, cushion_gas_dth: 2000000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 3000000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 400000 }, { inventory_pct: 25, withdrawal_dth_per_day: 150000, injection_dth_per_day: 350000 }, { inventory_pct: 50, withdrawal_dth_per_day: 300000, injection_dth_per_day: 250000 }, { inventory_pct: 75, withdrawal_dth_per_day: 450000, injection_dth_per_day: 150000 }, { inventory_pct: 100, withdrawal_dth_per_day: 600000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "AUR-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /compressor-units"
              payload: { storage_field_id: "${f1}", unit_code: "CU-01", rated_horsepower: 6000, derate_factor: 0.10 }
              as: FieldOperator
              captures: { u1: $.data.id }
            - call: "POST /compressor-runs"
              payload: { compressor_unit_id: "${u1}", window_start_at: "2026-08-05T00:00:00Z", window_end_at: "2026-08-05T08:00:00Z", allocated_horsepower: 5000, mode: "INJECTION" }
              as: FieldOperator
              captures: { r1: $.data.id }
            - call: "POST /compressor-runs"
              payload: { compressor_unit_id: "${u1}", window_start_at: "2026-08-05T08:00:00Z", window_end_at: "2026-08-05T16:00:00Z", allocated_horsepower: 5000, mode: "WITHDRAWAL" }
              as: FieldOperator
              captures: { r2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T16:00:00Z" }
              as: FieldOperator
          trigger:
            - call: "POST /compressor-runs/${r1}/complete"
              payload: {}
              as: FieldOperator
            - call: "POST /compressor-runs/${r2}/complete"
              payload: {}
              as: FieldOperator
          assert:
            - "CompressorRun.${r1}.duration_hours == 8.0000 and CompressorRun.${r2}.duration_hours == 8.0000"
            - "CompressorRun.${r1}.effective_horsepower == 4500.00 and CompressorRun.${r2}.effective_horsepower == 4500.00"
            - "CompressorRun.${r1}.utilization_ratio == 0.750000 and CompressorRun.${r1}.utilization_band == MID"
            - "CompressorRun.${r1}.fuel_consumed_dth == 331.20"
            - "CompressorRun.${r2}.utilization_band == MID and CompressorRun.${r2}.fuel_consumed_dth == 281.52"
            - "CompressorRun.${r1}.fuel_consumed_dth != 368.00   # derate omitted"
            - "CompressorRun.${r2}.fuel_consumed_dth != 331.20   # mode multiplier omitted"
            - "CompressorRun.${r1}.status == COMPLETED and CompressorRun.${r2}.status == COMPLETED"
            - "CompressorUnit.${u1}.lifetime_fuel_dth == 612.72"
            - "CompressorUnit.${u1}.scheduled_run_count == 0 and CompressorUnit.${u1}.status == AVAILABLE"
            - "StorageField.${f1}.fuel_gas_used_dth == 612.72 and StorageField.${f1}.working_gas_inventory_dth == 2999387.280"

  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nomination_curtailed_resubmit_cycle_bounded_by_revision_rounds
        grounds:
          - state_machines.Nomination.transitions.SUBMITTED_to_CURTAILED
          - state_machines.Nomination.transitions.CURTAILED_to_SUBMITTED
          - entities.Nomination.fields.revision_round
          - errors.ERR_NOMINATION_REVISION_LIMIT
        distinguishing_aspect: |
          The nomination walks SUBMITTED -> CURTAILED -> SUBMITTED -> CURTAILED -> SUBMITTED -> CURTAILED,
          re-entering SUBMITTED twice through a back edge, and the fourth entry is refused: revision_round
          reaches MAX_REVISION_ROUNDS = 2 and the third re-submission returns ERR_NOMINATION_REVISION_LIMIT
          while the nomination stays CURTAILED rather than becoming terminal. Each back edge must also
          unwind the contract's scheduled_injection_dth from 90000 to 0 before the next confirm recomputes
          it, so an implementation that only increments never converges on 90000 at the end.
        test_recipe:
          setup:
            - "Field F_STD with a single well rated 300000 Dth/day, so max_injection_rate_dth_per_day is 300000 and the interruptible share is floor(300000 x 30%) = 90000."
            - "One INTERRUPTIBLE contract with a 120000 Dth daily injection right, ACTIVE."
            - "A DRAFT nomination of 100000 Dth INJECTION for gas day 2026-08-20 (cutoff 2026-08-19T13:00Z, clock still 2026-08-01T00:00Z)."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Aurora Dome", field_code: "F-AUR", total_capacity_dth: 10000000, cushion_gas_dth: 2000000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 3000000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 400000 }, { inventory_pct: 25, withdrawal_dth_per_day: 150000, injection_dth_per_day: 350000 }, { inventory_pct: 50, withdrawal_dth_per_day: 300000, injection_dth_per_day: 250000 }, { inventory_pct: 75, withdrawal_dth_per_day: 450000, injection_dth_per_day: 150000 }, { inventory_pct: 100, withdrawal_dth_per_day: 600000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "AUR-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 300000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /shippers"
              payload: { legal_name: "Northline Gas Marketing", duns_number: "123456789", penalty_threshold_usd: 500000.00 }
              as: SchedulingCoordinator
              captures: { s1: $.data.id }
            - call: "POST /storage-contracts"
              payload: { shipper_id: "${s1}", storage_field_id: "${f1}", contract_code: "CT-INTR", service_class: "INTERRUPTIBLE", max_storage_quantity_dth: 1000000, max_daily_injection_dth: 120000, max_daily_withdrawal_dth: 120000, term_start_date: "2026-08-01", term_end_date: "2026-12-31", commodity_rate_usd_per_dth: 0.0450, index_price_usd_per_dth: 3.4500, cash_out_method: "MONTHLY_AGGREGATE" }
              as: SchedulingCoordinator
              captures: { c1: $.data.id }
            - call: "POST /storage-contracts/${c1}/activate"
              payload: {}
              as: SchedulingCoordinator
              captures: { c1_v1: $.data.version }
            - call: "POST /nominations"
              payload: { contract_id: "${c1}", gas_day: "2026-08-20", direction: "INJECTION", nominated_volume_dth: 100000, expected_contract_version: "${c1_v1}" }
              as: Shipper
              as_user_id: "${s1}"
              captures: { n1: $.data.id }
          trigger:
            - call: "POST /nominations/${n1}/submit"
              payload: {}
              as: Shipper
              as_user_id: "${s1}"
            - call: "POST /nominations/${n1}/confirm"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /nominations/${n1}/submit"
              payload: {}
              as: Shipper
              as_user_id: "${s1}"
            - call: "POST /nominations/${n1}/confirm"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /nominations/${n1}/submit"
              payload: {}
              as: Shipper
              as_user_id: "${s1}"
            - call: "POST /nominations/${n1}/confirm"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /nominations/${n1}/submit"
              payload: {}
              as: Shipper
              as_user_id: "${s1}"
              captures: { e1: $.data.error_id }
          assert:
            - "after the first confirm: Nomination.${n1}.status == CURTAILED, confirmed_volume_dth == 90000, curtailed_volume_dth == 10000, revision_round == 0"
            - "after the second submit: Nomination.${n1}.status == SUBMITTED, revision_round == 1, confirmed_volume_dth == 0, curtailed_volume_dth == 0 and StorageContract.${c1}.scheduled_injection_dth == 0"
            - "after the third confirm: Nomination.${n1}.revision_round == 2 and status == CURTAILED"
            - "${e1} == ERR_NOMINATION_REVISION_LIMIT with HTTP 422"
            - "Nomination.${n1}.status is still CURTAILED after the refused submit and revision_round is still 2"
            - "StorageContract.${c1}.scheduled_injection_dth == 90000"
            - "the contract holds exactly 3 CURTAILMENT_CREDIT ImbalanceLedgerEntries, each with volume_dth == -10000.000 and amount_usd == 0.00"

      - name: regulatory_report_rejected_resubmission_loop_then_terminal_lockdown
        grounds:
          - state_machines.RegulatoryReport.transitions.SUBMITTED_to_REJECTED
          - state_machines.RegulatoryReport.transitions.REJECTED_to_SUBMITTED
          - segregation_of_duties_rules
          - errors.ERR_INVALID_REPORT_STATE
        distinguishing_aspect: |
          The report re-enters SUBMITTED from REJECTED — a back edge that must re-run the segregation-of-duties
          check and the variance gate rather than trusting the earlier submission — and the loop is closed by
          ACCEPTED, which is terminal: a fourth submit against the ACCEPTED report returns
          ERR_INVALID_REPORT_STATE instead of looping again. The rejection in between also has to unlock the
          covered gas days and the acceptance has to re-lock them, so the state field alone is not enough.
        test_recipe:
          setup:
            - "Field F_STD with one well; book working gas 3,000,000 Dth."
            - "An INVENTORY_VERIFICATION report for 2026-08-01..2026-08-31 measured at exactly 3,000,000 Dth, prepared by compliance user 'officer-prep' so variance_pct is 0.0000 and the variance gate never interferes."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Aurora Dome", field_code: "F-AUR", total_capacity_dth: 10000000, cushion_gas_dth: 2000000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 3000000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 400000 }, { inventory_pct: 25, withdrawal_dth_per_day: 150000, injection_dth_per_day: 350000 }, { inventory_pct: 50, withdrawal_dth_per_day: 300000, injection_dth_per_day: 250000 }, { inventory_pct: 75, withdrawal_dth_per_day: 450000, injection_dth_per_day: 150000 }, { inventory_pct: 100, withdrawal_dth_per_day: 600000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "AUR-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /regulatory-reports"
              payload: { storage_field_id: "${f1}", report_type: "INVENTORY_VERIFICATION", period_start_date: "2026-08-01", period_end_date: "2026-08-31", measured_inventory_dth: 3000000.000 }
              as: ComplianceOfficer
              as_user_id: "officer-prep"
              captures: { rr: $.data.id }
          trigger:
            - call: "POST /regulatory-reports/${rr}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-review"
            - call: "POST /regulatory-reports/${rr}/record-agency-response"
              payload: { agency_outcome: "REJECTED", agency_response_note: "Measurement basis needs restating." }
              as: ComplianceOfficer
              as_user_id: "officer-review"
            - call: "POST /regulatory-reports/${rr}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-review"
            - call: "POST /regulatory-reports/${rr}/record-agency-response"
              payload: { agency_outcome: "ACCEPTED" }
              as: ComplianceOfficer
              as_user_id: "officer-review"
            - call: "POST /regulatory-reports/${rr}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-review"
              captures: { e1: $.data.error_id }
          assert:
            - "RegulatoryReport.${rr}.book_inventory_dth == 3000000.000, variance_dth == 0.000, variance_pct == 0.0000, open_finding_count == 0"
            - "after the first submit: status == SUBMITTED and submitted_by_user_id == officer-review"
            - "after the REJECTED response: status == REJECTED and agency_response_note is stored"
            - "after the second submit: status == SUBMITTED again (the back edge fired)"
            - "after the ACCEPTED response: status == ACCEPTED and agency_outcome == ACCEPTED"
            - "${e1} == ERR_INVALID_REPORT_STATE with HTTP 409"
            - "RegulatoryReport.${rr}.status is still ACCEPTED after the refused submit"
            - "RegulatoryReport.${rr}.prepared_by_user_id == officer-prep"

  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: mit_failure_cascades_through_well_remediation_posture_to_interruptible_curtailment
        grounds:
          - state_machines.MechanicalIntegrityTest.transitions.SCHEDULED_to_FAILED
          - state_machines.Well.transitions.MIT_CURRENT_to_MIT_FAILED
          - calculations.field_posture_derivation
          - curtailment_sweep.phase_A
        distinguishing_aspect: |
          A single record-result FAIL propagates four levels: MIT -> FAILED, Well -> MIT_FAILED and SHUT_IN
          with shut_in_reason MIT_FAILURE, a RemediationProgram is born OPEN, the field loses a well so
          wells_in_service_count drops 3 -> 2 and max_injection falls 300000 -> 180000 while the posture
          becomes RESTRICTED, and only then does the RESTRICTED-form phase A sweep reach across to a
          different shipper-facing entity and curtail the INTERRUPTIBLE nomination for gas day 2026-08-20
          to zero with a -60000.000 CURTAILMENT_CREDIT, leaving the FIRM nomination on the same gas day
          untouched at 90000. An implementation that stops at level 3 (posture) leaves the interruptible
          nomination CONFIRMED; one that sweeps FIRM as well destroys the 90000.
        test_recipe:
          setup:
            - "Field F_STD with three wells rated 120000 + 120000 + 60000 = 300000 Dth/day, so max_injection_rate_dth_per_day is 300000 (curve 300000 at 37.50%) and max_withdrawal_rate_dth_per_day is 225000."
            - "One FIRM contract CF and one INTERRUPTIBLE contract CI for the same shipper, both ACTIVE, penalty threshold 500000.00 so no credit gate fires."
            - "For gas day 2026-08-20: CF holds a CONFIRMED nomination of 90000 Dth INJECTION and CI a CONFIRMED nomination of 60000 Dth INJECTION (interruptible share ceiling floor(300000 x 30%) = 90000, so 60000 confirms in full). Neither has a ticket."
