  # ==========================================================================
  # Section: validations
  # ==========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds:
          - 'validations[priority=1", errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]]'
        distinguishing_aspect: "Requests without X-User-ID/X-User-Role are rejected 400 before any role or existence check."
        test_recipe:
          setup: ["one customer exists"]
          setup_api_calls:
            - { call: "POST /margin/customers", payload: { legal_name: "Auth Test", email: "auth@example.com" }, as: MarginAnalyst, captures: { c_id: $.data.id } }
          trigger:
            - { call: "GET /margin/customers/${c_id}", payload: {}, as: "", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER and http == 400"

      - name: role_denied_customer_cannot_waive_call
        claim_type: violation_to_error
        grounds:
          - 'validations[priority=2", errors[ERR_INSUFFICIENT_PERMISSIONS], roles]'
        distinguishing_aspect: "Customer calling the MarginSupervisor-exclusive waive endpoint gets ERR_INSUFFICIENT_PERMISSIONS 403."
        test_recipe:
          setup: ["any account with an OPEN call would be ideal; permission check precedes existence/state so a random id suffices"]
          setup_api_calls:
            - { call: "POST /margin/customers", payload: { legal_name: "Role Test", email: "role@example.com" }, as: MarginAnalyst, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /margin/margin-calls/00000000-0000-0000-0000-000000000000/waive", payload: {}, as: Customer, as_user_id: "${c_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS and http == 403  # role check outranks existence"

      - name: ownership_mismatch_on_foreign_account_order
        claim_type: violation_to_error
        grounds:
          - 'validations[priority=4", errors[ERR_ACCOUNT_OWNERSHIP_MISMATCH]]'
        distinguishing_aspect: "Customer B placing an order on Customer A's account gets ERR_ACCOUNT_OWNERSHIP_MISMATCH 403 even though the account exists."
        test_recipe:
          setup: ["customer A with approved account; customer B with approved account; ABC marked"]
          setup_api_calls:
            - { call: "POST /margin/customers", payload: { legal_name: "Own Er", email: "owner@example.com" }, as: MarginAnalyst, captures: { c_a: $.data.id } }
            - { call: "POST /margin/customers", payload: { legal_name: "Intr Uder", email: "intruder@example.com" }, as: MarginAnalyst, captures: { c_b: $.data.id } }
            - { call: "POST /margin/security-profiles", payload: { symbol: "ABC", marginable: true, house_maint_long_bps: 3000, house_maint_short_bps: 3500, liquidity_tier: 1, concentration_threshold_bps: 6000 }, as: MarginSupervisor, captures: { sec_abc: $.data.id } }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "REALTIME", price_cents: 10000 }, as: MarketDataOps }
