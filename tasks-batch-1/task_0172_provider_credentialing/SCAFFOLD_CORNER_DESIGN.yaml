        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Isolated segregation-of-duties failure: the initiating specialist (spec-1) votes using a SAME-ORG reviewer (so no referential error masks it) -> ERR_SEGREGATION_OF_DUTIES (403)."
        test_recipe:
          setup: ["File UNDER_REVIEW in org-1; a same-org reviewer registered under user_id 'spec-1' (the provider's initiated_by_user_id). Vote cast by spec-1."]
          setup_api_calls:
            - call: "POST /credentialing-orgs"
              payload: { name: "CVO" }
              as: SystemAdmin
              captures: { org_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { org_id: "${org_id}", npi: "1234567890", full_name: "Dr A", specialty: "IM", caqh_id: "CAQH-A" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { p_id: $.data.id }
            - call: "POST /providers/${p_id}/credential-items"
              payload: { item_type: "STATE_LICENSE", identifier: "LIC-1", issued_date: "2025-01-01T00:00:00.000Z", expiration_date: "2030-01-01T00:00:00.000Z" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { ci_id: $.data.id }
            - call: "POST /providers/${p_id}/submit-application"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /providers/${p_id}/begin-verification"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /credential-items/${ci_id}/verification-requests"
              payload: { method: "PRIMARY_SOURCE", source_reference: "https://lic.example/1" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { vr_id: $.data.id }
            - call: "POST /verification-requests/${vr_id}/complete"
              payload: { outcome: "PASS" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /providers/${p_id}/finalize-verification"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
            - call: "POST /peer-reviewers"
              payload: { org_id: "${org_id}", user_id: "spec-1", full_name: "Conflicted reviewer" }
              as: SystemAdmin
              captures: { rv_conf: $.data.id }
            - call: "POST /providers/${p_id}/credentialing-files"
              payload: {}
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { file_id: $.data.id }
            - call: "POST /credentialing-files/${file_id}/open-review"
              payload: {}
              as: MedicalDirector
              as_user_id: "md-1"
          trigger:
            - call: "POST /credentialing-files/${file_id}/cast-vote"
              payload: { reviewer_id: "${rv_conf}", ballot: "YES" }
              as: CredentialingSpecialist
              as_user_id: "spec-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == 'ERR_SEGREGATION_OF_DUTIES'"
