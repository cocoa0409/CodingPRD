      - name: void_liquidation_preserves_reserve_initial_identity
        grounds:
          - state_machines.PhysicalRun.LIQUIDATED_to_HELD
          - state_machines.PhysicalRun.SHIPPED_to_RECONCILED
          - entities.PhysicalRun.fields.reserve_initial_cents
          - entities.PhysicalRun.fields.reserve_held_cents
          - entities.PhysicalRun.fields.reserve_liquidated_cents
          - endpoints[POST /physical-runs/{id}/void-liquidation]
        distinguishing_aspect: |
          Conserved quantity = the RESERVE identity reserve_initial_cents == reserve_held_cents +
          reserve_liquidated_cents (a different quantity from the advance identity), and the compensation
          also has to walk the second dimension back: void-liquidation must return the fulfilment axis
          from RECONCILED to SHIPPED, not merely reset the money.
        test_recipe:
          setup:
