              as: ElectionCommissioner
              as_user_id: "commissioner-1"
              captures: { o_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Ava Stone", student_number: "S-2001", class_year: "SENIOR", gpa: 3.50, credits_completed: 95 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { s_a_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Ben Lu", student_number: "S-2002", class_year: "JUNIOR", gpa: 3.20, credits_completed: 70 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { s_b_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Dara Idris", student_number: "S-2003", class_year: "JUNIOR", gpa: 3.00, credits_completed: 66 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { s_d_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Voter One", student_number: "S-2101", class_year: "FRESHMAN", gpa: 3.00, credits_completed: 12 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { v1_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Voter Two", student_number: "S-2102", class_year: "FRESHMAN", gpa: 3.00, credits_completed: 12 }
