  - rule_id: combinatorial_formula
    instances:
      - name: quota_provisioning_three_factor_nested_clamp
        grounds:
          - calculations.quota_provisioning
          - entities.QuotaAssignment.fields.sustained_rpm
          - entities.QuotaAssignment.fields.burst_rpm
          - entities.QuotaAssignment.fields.monthly_call_allowance
          - entities.ApiProduct.fields.available_sustained_rpm
          - endpoints.POST /quota-assignments
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear formula — tier base 3000 x TRUST_MULTIPLIER 0.75 x
          scope_factor max(0.60, 1 - 0.05*1 - 0.10*1) = 0.85 floors to 1912, is then clamped by the
          product pool to 1500, and burst is derived from the CLAMPED value (1500 + ceil(1500*2.0)
          = 4500), while the allowance is a separate three-way min that lands on the pool limit
          8000000 rather than the request 20000000 or the tier cap 10000000.
        test_recipe:
          setup:
            - "ApiProduct P4 is FINANCIAL with sustained_rpm_pool 1500 and monthly_call_pool 8000000, catalogue holds one PERSONAL and one FINANCIAL scope"
            - "Developer D4 has acknowledged docs version 2 and terms version 1 but holds no certification, so its onboarding_snapshot trust_score is 56 (TRUST_MULTIPLIER 0.75)"
            - "D4's application for PARTNER with both sensitive scopes and 20000000 monthly calls is APPROVED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /api-products"
              payload: { name: "Ledger API", data_sensitivity: "FINANCIAL", scope_catalog: [{ scope: "profile.read", sensitivity: "PERSONAL" }, { scope: "ledger.read", sensitivity: "FINANCIAL" }], sample_app_slugs: ["ledger-quickstart"], sustained_rpm_pool: 1500, monthly_call_pool: 8000000, required_tos_version: 1 }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { p4_id: $.data.id }
            - call: "POST /api-products/${p4_id}/versions"
              payload: { semver: "2.0.0", breaking_change: false }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { v4_id: $.data.id }
            - call: "POST /api-versions/${v4_id}/promote"
              payload: {}
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /developers"
              payload: { org_name: "Halberd Fintech", contact_email: "dev4@halberd.example", region_code: "US" }
              as: DevRelManager
              as_user_id: "drm-1"
              captures: { d4_id: $.data.id }
            - call: "POST /developers/${d4_id}/onboarding-acknowledgement"
              payload: { docs_version: 2, tos_version: 1 }
              as: Developer
              as_user_id: "${d4_id}"
              captures: { d4_trust: $.data.trust_score }
            - call: "POST /access-applications"
              payload: { developer_id: "${d4_id}", target_api_version_id: "${v4_id}", requested_tier: "PARTNER", requested_scopes: ["profile.read", "ledger.read"], requested_monthly_calls: 20000000, justification_text: "We operate a regulated settlement reconciliation product and require partner-tier sustained throughput for nightly batch windows across twelve markets, with burst headroom for month-end close." }
              as: Developer
              as_user_id: "${d4_id}"
              captures: { app4_id: $.data.id }
            - call: "POST /access-applications/${app4_id}/submit"
              payload: {}
              as: Developer
              as_user_id: "${d4_id}"
            - call: "POST /access-applications/${app4_id}/claim-review"
              payload: {}
              as: DevRelManager
              as_user_id: "drm-1"
            - call: "POST /access-applications/${app4_id}/decide"
              payload: { decision: "APPROVE", approved_tier: "PARTNER", granted_scopes: ["profile.read", "ledger.read"] }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "GET /api-products/${p4_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { p4_ver: $.data.version }
          trigger:
            - call: "POST /quota-assignments"
              payload: { access_application_id: "${app4_id}", expected_api_product_version: "${p4_ver}" }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { qa4_id: $.data.id }
          assert:
            - "Developer.${d4_id}.trust_score == 56"
            - "QuotaAssignment.${qa4_id}.trust_multiplier_applied == 0.75"
            - "QuotaAssignment.${qa4_id}.sustained_rpm == 1500"
            - "QuotaAssignment.${qa4_id}.burst_rpm == 4500"
            - "QuotaAssignment.${qa4_id}.burst_credit_balance == 45000"
            - "QuotaAssignment.${qa4_id}.monthly_call_allowance == 8000000"
            - "QuotaAssignment.${qa4_id}.entitlement_state == PROVISIONED"
            - "ApiProduct.${p4_id}.allocated_sustained_rpm == 1500"
            - "ApiProduct.${p4_id}.available_sustained_rpm == 0"
            - "ApiProduct.${p4_id}.allocated_monthly_calls == 8000000"
            - "ApiProduct.${p4_id}.available_monthly_calls == 0"

