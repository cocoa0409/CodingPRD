# ============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
#   Task 2613 - Oral & Maxillofacial Surgery Practice & Anesthesia Permitting
#   Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only; nothing new is
#   declared here. Every numeric literal in `assert:` was computed by executing
#   the referenced §1.3 formula against the pinned fixtures.
#   Logical clock default before any /_clock call: 2026-08-01T00:00:00Z.
# ============================================================================
scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: risk_score_provisional_versus_final_on_evaluation
        grounds:
          - calculations.pre_anesthesia_risk_score
          - entities.PreAnesthesiaEvaluation.fields.provisional_risk_score
          - entities.PreAnesthesiaEvaluation.fields.final_risk_score
          - entities.PreAnesthesiaEvaluation.fields.risk_band
          - state_machines.PreAnesthesiaEvaluation.SIGNED_to_VERIFIED
        distinguishing_aspect: |
          The dual variant lives on the clinical-risk domain (PreAnesthesiaEvaluation of a patient),
          and the divergence is created by penalties added AFTER the level multiplier: identical
          recorded inputs yield provisional_risk_score 11.5 (band LOW) at signature and
          final_risk_score 26.5 (band ELEVATED) at day-of verification, a two-band jump produced
          purely by the variant switch.
        test_recipe:
          setup:
            - "logical clock at 2026-09-11T10:00:00Z"
            - "one practice with two recovery bays; a surgeon, an evaluating coordinator and a separate verifying coordinator"
            - "patient born 1980-03-15 (age_years 46), weight 80 kg, intake asa_class 2 / airway_class 2"
            - "one LOCAL_ONLY THIRD_MOLAR case planned 2026-09-14T13:00:00Z -> 14:00:00Z (no permit is needed at LOCAL_ONLY)"
            - "a signed evaluation recording asa_class_recorded 2, airway_class_recorded 2, comorbidity_count 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Northside OMS", state_code: "OH", recovery_bay_count: 2, turnover_buffer_minutes: 15, consignment_credit_limit_cents: 500000 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON", acls_expires_on: "2027-06-30T00:00:00Z" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Nia Author", role_type: "ANESTHESIA_MONITOR", monitoring_certified: true, acls_expires_on: "2027-06-30T00:00:00Z" }
              as: PracticeAdministrator
              captures: { author_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Val Verifier", role_type: "ANESTHESIA_MONITOR", monitoring_certified: true, acls_expires_on: "2027-06-30T00:00:00Z" }
              as: PracticeAdministrator
              captures: { verif_id: $.data.id }
            - call: "POST /patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Molar", date_of_birth: "1980-03-15T00:00:00Z", asa_class: 2, airway_class: 2, weight_kg: 80, medical_plan_active: false, dental_plan_active: true, dental_annual_remaining_cents: 150000 }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_id}", primary_surgeon_id: "${surg_id}", monitor_staff_id: "${author_id}", planned_anesthesia_level: "LOCAL_ONLY", procedure_category: "THIRD_MOLAR", planned_start: "2026-09-14T13:00:00Z", planned_end: "2026-09-14T14:00:00Z", total_charge_cents: 111110 }
              as: SchedulingCoordinator
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /surgical-cases/${case_id}/pre-anesthesia-evaluations"
              payload: { evaluator_staff_id: "${author_id}", asa_class_recorded: 2, airway_class_recorded: 2, comorbidity_count: 1, expected_case_version: "${case_v}" }
              as: AnesthesiaCoordinator
              as_user_id: "${author_id}"
              captures: { eval_id: $.data.id }
            - call: "POST /pre-anesthesia-evaluations/${eval_id}/sign"
              payload: {}
              as: AnesthesiaCoordinator
              as_user_id: "${author_id}"
          trigger:
            - call: "POST /pre-anesthesia-evaluations/${eval_id}/day-of-verification"
              payload: { intent: "CLEAR", fasting_solids_last_at: "2026-09-14T07:00:00Z", fasting_clears_last_at: "2026-09-14T11:00:00Z", escort_confirmed: false }
              as: AnesthesiaCoordinator
              as_user_id: "${verif_id}"
          assert:
            - "PreAnesthesiaEvaluation.${eval_id}.provisional_risk_score == 11.5"
            - "PreAnesthesiaEvaluation.${eval_id}.final_risk_score == 26.5"
            - "PreAnesthesiaEvaluation.${eval_id}.risk_band == ELEVATED"
            - "PreAnesthesiaEvaluation.${eval_id}.npo_solids_minutes == 360"
            - "PreAnesthesiaEvaluation.${eval_id}.npo_clears_minutes == 120"
            - "PreAnesthesiaEvaluation.${eval_id}.status == VERIFIED"
            - "SurgicalCase.${case_id}.clearance_status == CLEARED"
            - "PreAnesthesiaEvaluation.${eval_id}.final_risk_score - PreAnesthesiaEvaluation.${eval_id}.provisional_risk_score == 15.0 (the fasting penalty is never scaled by the 0.5 LOCAL_ONLY multiplier)"

      - name: benefit_medical_first_versus_dental_first_waterfall
        grounds:
          - calculations.benefit_route
          - calculations.benefit_allocation
          - entities.BenefitDetermination.fields.medical_allowed_cents
          - entities.BenefitDetermination.fields.dental_allowed_cents
          - entities.BenefitDetermination.fields.patient_responsibility_cents
          - entities.SurgicalCase.fields.procedure_category
        distinguishing_aspect: |
          The second dual variant sits on a different entity domain - money allocation on
          BenefitDetermination, not risk on an evaluation - and the variant is selected by the
          case's procedure_category: with byte-identical service_lines and an identical 20000-cent
          dental annual remainder, the PATHOLOGY case (medical-first) yields
          88888/11112/11110 while the THIRD_MOLAR case (dental-first) yields 72888/20000/18222.
        test_recipe:
          setup:
            - "logical clock at 2026-09-11T10:00:00Z"
            - "one practice, one surgeon, one evaluating coordinator, one verifying coordinator"
            - "two patients, each with medical_plan_active true, dental_plan_active true and dental_annual_remaining_cents 20000 (route SPLIT for both)"
            - "case A is PATHOLOGY (MEDICAL_PRIMARY_CATEGORIES -> primary_payer MEDICAL); case B is THIRD_MOLAR (-> primary_payer DENTAL)"
            - "both cases are LOCAL_ONLY with total_charge_cents 111110 and each has a VERIFIED evaluation so its determination may be submitted"
            - "both determinations carry the same two service lines in the same order: 12345 then 98765"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Northside OMS", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON", acls_expires_on: "2027-06-30T00:00:00Z" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Nia Author", role_type: "ANESTHESIA_MONITOR", monitoring_certified: true }
              as: PracticeAdministrator
              captures: { author_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Val Verifier", role_type: "ANESTHESIA_MONITOR", monitoring_certified: true }
              as: PracticeAdministrator
              captures: { verif_id: $.data.id }
            - call: "POST /patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Path", date_of_birth: "1980-03-15T00:00:00Z", asa_class: 2, airway_class: 2, weight_kg: 80, medical_plan_active: true, dental_plan_active: true, dental_annual_remaining_cents: 20000 }
              as: SchedulingCoordinator
              captures: { pat_a: $.data.id }
            - call: "POST /patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Molar", date_of_birth: "1980-03-15T00:00:00Z", asa_class: 2, airway_class: 2, weight_kg: 80, medical_plan_active: true, dental_plan_active: true, dental_annual_remaining_cents: 20000 }
              as: SchedulingCoordinator
              captures: { pat_b: $.data.id }
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_a}", primary_surgeon_id: "${surg_id}", monitor_staff_id: "${author_id}", planned_anesthesia_level: "LOCAL_ONLY", procedure_category: "PATHOLOGY", planned_start: "2026-09-14T13:00:00Z", planned_end: "2026-09-14T14:00:00Z", total_charge_cents: 111110 }
              as: SchedulingCoordinator
              captures: { case_a: $.data.id, case_a_v: $.data.version }
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_b}", primary_surgeon_id: "${surg_id}", monitor_staff_id: "${author_id}", planned_anesthesia_level: "LOCAL_ONLY", procedure_category: "THIRD_MOLAR", planned_start: "2026-09-15T13:00:00Z", planned_end: "2026-09-15T14:00:00Z", total_charge_cents: 111110 }
              as: SchedulingCoordinator
              captures: { case_b: $.data.id, case_b_v: $.data.version }
            - call: "POST /surgical-cases/${case_a}/pre-anesthesia-evaluations"
              payload: { evaluator_staff_id: "${author_id}", asa_class_recorded: 2, airway_class_recorded: 2, comorbidity_count: 0, expected_case_version: "${case_a_v}" }
              as: AnesthesiaCoordinator
              as_user_id: "${author_id}"
              captures: { eval_a: $.data.id }
            - call: "POST /pre-anesthesia-evaluations/${eval_a}/sign"
              payload: {}
              as: AnesthesiaCoordinator
              as_user_id: "${author_id}"
            - call: "POST /pre-anesthesia-evaluations/${eval_a}/day-of-verification"
              payload: { intent: "CLEAR", fasting_solids_last_at: "2026-09-14T05:00:00Z", fasting_clears_last_at: "2026-09-14T11:00:00Z", escort_confirmed: true, escort_name: "Ada Escort" }
              as: AnesthesiaCoordinator
              as_user_id: "${verif_id}"
            - call: "POST /surgical-cases/${case_b}/pre-anesthesia-evaluations"
              payload: { evaluator_staff_id: "${author_id}", asa_class_recorded: 2, airway_class_recorded: 2, comorbidity_count: 0, expected_case_version: "${case_b_v}" }
              as: AnesthesiaCoordinator
              as_user_id: "${author_id}"
              captures: { eval_b: $.data.id }
            - call: "POST /pre-anesthesia-evaluations/${eval_b}/sign"
              payload: {}
              as: AnesthesiaCoordinator
              as_user_id: "${author_id}"
            - call: "POST /pre-anesthesia-evaluations/${eval_b}/day-of-verification"
              payload: { intent: "CLEAR", fasting_solids_last_at: "2026-09-15T05:00:00Z", fasting_clears_last_at: "2026-09-15T11:00:00Z", escort_confirmed: true, escort_name: "Ada Escort" }
              as: AnesthesiaCoordinator
              as_user_id: "${verif_id}"
            - call: "POST /benefit-determinations"
              payload: { case_id: "${case_a}", service_lines: [{ code: "D7240", charge_cents: 12345, benefit_class: "DENTAL" }, { code: "21031", charge_cents: 98765, benefit_class: "MEDICAL" }] }
              as: BenefitsSpecialist
              captures: { det_a: $.data.id }
            - call: "POST /benefit-determinations"
              payload: { case_id: "${case_b}", service_lines: [{ code: "D7240", charge_cents: 12345, benefit_class: "DENTAL" }, { code: "21031", charge_cents: 98765, benefit_class: "MEDICAL" }] }
              as: BenefitsSpecialist
              captures: { det_b: $.data.id }
          trigger:
            - call: "POST /benefit-determinations/${det_a}/submit"
              payload: {}
              as: BenefitsSpecialist
            - call: "POST /benefit-determinations/${det_b}/submit"
              payload: {}
              as: BenefitsSpecialist
          assert:
            - "BenefitDetermination.${det_a}.route == SPLIT"
            - "BenefitDetermination.${det_a}.primary_payer == MEDICAL"
            - "BenefitDetermination.${det_a}.medical_allowed_cents == 88888"
            - "BenefitDetermination.${det_a}.dental_allowed_cents == 11112"
            - "BenefitDetermination.${det_a}.patient_responsibility_cents == 11110"
            - "BenefitDetermination.${det_b}.route == SPLIT"
            - "BenefitDetermination.${det_b}.primary_payer == DENTAL"
            - "BenefitDetermination.${det_b}.medical_allowed_cents == 72888"
            - "BenefitDetermination.${det_b}.dental_allowed_cents == 20000"
            - "BenefitDetermination.${det_b}.patient_responsibility_cents == 18222"
            - "BenefitDetermination.${det_a}.dental_annual_remaining_snapshot_cents == 20000 and BenefitDetermination.${det_b}.dental_annual_remaining_snapshot_cents == 20000"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: risk_factor_block_nested_cap_and_multiplier
        grounds:
          - calculations.pre_anesthesia_risk_score
          - entities.PreAnesthesiaEvaluation.fields.comorbidity_count
          - entities.PreAnesthesiaEvaluation.fields.airway_class_recorded
          - entities.Patient.fields.weight_kg
          - state_machines.PreAnesthesiaEvaluation.DRAFT_to_SIGNED
        distinguishing_aspect: |
          Mode (a): five inputs interact non-linearly in one formula - min(12, 3*comorbidity_count),
          max(0, airway_class_recorded - 2), a three-way age branch, a weight step at 120 kg, and a
          per-level multiplier applied to their sum. With asa 3 / airway 4 / age 72 / comorbidity 6 /
          130 kg at MODERATE_SEDATION the score is exactly 69.0; dropping only the comorbidity cap
          would give 75.0, so the cap is observable in isolation.
        test_recipe:
          setup:
            - "logical clock at 2026-09-11T10:00:00Z"
            - "one practice, one surgeon, one evaluating coordinator"
            - "patient born 1954-05-20 (age_years 72), weight 130 kg"
            - "one MODERATE_SEDATION ORTHOGNATHIC case, still DRAFT (no block, no permit required to score an evaluation)"
            - "evaluation records asa_class_recorded 3, airway_class_recorded 4, comorbidity_count 6"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Northside OMS", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON", acls_expires_on: "2027-06-30T00:00:00Z" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Nia Author", role_type: "ANESTHESIA_MONITOR", monitoring_certified: true }
              as: PracticeAdministrator
              captures: { author_id: $.data.id }
            - call: "POST /patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Complex", date_of_birth: "1954-05-20T00:00:00Z", asa_class: 3, airway_class: 4, weight_kg: 130, medical_plan_active: true, dental_plan_active: false }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_id}", primary_surgeon_id: "${surg_id}", monitor_staff_id: "${author_id}", planned_anesthesia_level: "MODERATE_SEDATION", procedure_category: "ORTHOGNATHIC", planned_start: "2026-09-14T13:00:00Z", planned_end: "2026-09-14T15:00:00Z", total_charge_cents: 400000 }
              as: SchedulingCoordinator
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /surgical-cases/${case_id}/pre-anesthesia-evaluations"
              payload: { evaluator_staff_id: "${author_id}", asa_class_recorded: 3, airway_class_recorded: 4, comorbidity_count: 6, expected_case_version: "${case_v}" }
              as: AnesthesiaCoordinator
              as_user_id: "${author_id}"
              captures: { eval_id: $.data.id }
          trigger:
            - call: "POST /pre-anesthesia-evaluations/${eval_id}/sign"
              payload: {}
              as: AnesthesiaCoordinator
              as_user_id: "${author_id}"
          assert:
            - "PreAnesthesiaEvaluation.${eval_id}.provisional_risk_score == 69.0"
            - "PreAnesthesiaEvaluation.${eval_id}.provisional_risk_score != 75.0 (the comorbidity contribution is capped at 12, not 18)"
            - "PreAnesthesiaEvaluation.${eval_id}.risk_band == PROHIBITIVE"
            - "PreAnesthesiaEvaluation.${eval_id}.status == SIGNED"
            - "SurgicalCase.${case_id}.clearance_status == EVALUATED"

      - name: benefit_round_per_line_then_sum
        grounds:
          - calculations.benefit_allocation
          - entities.BenefitDetermination.fields.service_lines
          - entities.BenefitDetermination.fields.dental_allowed_cents
          - state_machines.BenefitDetermination.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (b): nested rounding whose order is observable. Medical takes 80% of each gross line
          (9876 and 79012), dental then takes 50% of each residual and is rounded PER LINE
          (1235 + 9877 = 11112); rounding the summed residual 22222 once would give 11111, so the
          pinned order changes the answer by exactly one cent.
        test_recipe:
          setup:
            - "logical clock at 2026-09-11T10:00:00Z"
            - "one practice, one surgeon, one evaluating coordinator, one verifying coordinator"
            - "patient with both plans active and dental_annual_remaining_cents 150000 (the annual maximum never binds here)"
            - "one LOCAL_ONLY PATHOLOGY case (primary_payer MEDICAL) with total_charge_cents 111110 and a VERIFIED evaluation"
            - "determination service_lines are exactly [12345, 98765] in that order"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Northside OMS", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON", acls_expires_on: "2027-06-30T00:00:00Z" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Nia Author", role_type: "ANESTHESIA_MONITOR", monitoring_certified: true }
              as: PracticeAdministrator
              captures: { author_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Val Verifier", role_type: "ANESTHESIA_MONITOR", monitoring_certified: true }
              as: PracticeAdministrator
              captures: { verif_id: $.data.id }
            - call: "POST /patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Path", date_of_birth: "1980-03-15T00:00:00Z", asa_class: 2, airway_class: 2, weight_kg: 80, medical_plan_active: true, dental_plan_active: true, dental_annual_remaining_cents: 150000 }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_id}", primary_surgeon_id: "${surg_id}", monitor_staff_id: "${author_id}", planned_anesthesia_level: "LOCAL_ONLY", procedure_category: "PATHOLOGY", planned_start: "2026-09-14T13:00:00Z", planned_end: "2026-09-14T14:00:00Z", total_charge_cents: 111110 }
              as: SchedulingCoordinator
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /surgical-cases/${case_id}/pre-anesthesia-evaluations"
              payload: { evaluator_staff_id: "${author_id}", asa_class_recorded: 2, airway_class_recorded: 2, comorbidity_count: 0, expected_case_version: "${case_v}" }
              as: AnesthesiaCoordinator
              as_user_id: "${author_id}"
              captures: { eval_id: $.data.id }
            - call: "POST /pre-anesthesia-evaluations/${eval_id}/sign"
              payload: {}
              as: AnesthesiaCoordinator
              as_user_id: "${author_id}"
            - call: "POST /pre-anesthesia-evaluations/${eval_id}/day-of-verification"
              payload: { intent: "CLEAR", fasting_solids_last_at: "2026-09-14T05:00:00Z", fasting_clears_last_at: "2026-09-14T11:00:00Z", escort_confirmed: true, escort_name: "Ada Escort" }
              as: AnesthesiaCoordinator
              as_user_id: "${verif_id}"
            - call: "POST /benefit-determinations"
              payload: { case_id: "${case_id}", service_lines: [{ code: "D7240", charge_cents: 12345, benefit_class: "DENTAL" }, { code: "21031", charge_cents: 98765, benefit_class: "MEDICAL" }] }
              as: BenefitsSpecialist
              captures: { det_id: $.data.id }
          trigger:
            - call: "POST /benefit-determinations/${det_id}/submit"
              payload: {}
              as: BenefitsSpecialist
          assert:
            - "BenefitDetermination.${det_id}.medical_allowed_cents == 88888"
            - "BenefitDetermination.${det_id}.dental_allowed_cents == 11112"
            - "BenefitDetermination.${det_id}.dental_allowed_cents != 11111 (sum-then-round is the wrong order)"
            - "BenefitDetermination.${det_id}.patient_responsibility_cents == 11110"
            - "BenefitDetermination.${det_id}.status == SUBMITTED"
            - "BenefitDetermination.${det_id}.submission_count == 1"

      - name: consignment_tier_keyed_on_subtotal_not_liability
        grounds:
          - calculations.consignment_liability
          - entities.ImplantReservation.fields.line_subtotal_cents
          - entities.ImplantReservation.fields.restocking_fee_cents
          - entities.ImplantReservation.fields.consignment_credit_cents
          - entities.Practice.fields.consignment_committed_cents
          - state_machines.ImplantReservation.HELD_to_RELEASED
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency pinned by evaluation order - the restocking tier
          is selected from line_subtotal_cents (60000 -> 10%, fee 6000), never from the liability
          that the consignment credit produces (48000, which would select the 15% tier and a fee of
          7200). The scaffold fixes the order subtotal -> tier -> fee -> credit -> liability.
        test_recipe:
          setup:
            - "logical clock at 2026-09-11T10:00:00Z"
            - "one practice with consignment_credit_limit_cents 500000"
            - "one consignment implant lot: unit_cost_cents 30000, quantity_on_hand 5, expiry 2027-06-30"
            - "one DRAFT LOCAL_ONLY IMPLANT case planned 2026-09-14T13:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Northside OMS", state_code: "OH", recovery_bay_count: 2, consignment_credit_limit_cents: 500000 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON", acls_expires_on: "2027-06-30T00:00:00Z" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
            - call: "POST /patients"
