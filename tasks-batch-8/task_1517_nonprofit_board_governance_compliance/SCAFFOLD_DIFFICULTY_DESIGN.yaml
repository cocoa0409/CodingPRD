      - call: POST /boardgov/board-members
        payload:
          nonprofit_id: ${np}
          full_name: D3
          email: d3@x.org
          skill_tags:
          - PROGRAM
        as: GovernanceAdmin
        captures:
          d3: $.data.id
      - call: POST /boardgov/board-members
        payload:
          nonprofit_id: ${np}
          full_name: D4
          email: d4@x.org
          skill_tags:
          - FUNDRAISING
        as: GovernanceAdmin
        captures:
          d4: $.data.id
      - call: POST /boardgov/board-members
        payload:
          nonprofit_id: ${np}
          full_name: D5
          email: d5@x.org
          skill_tags:
          - HR
        as: GovernanceAdmin
        captures:
          d5: $.data.id
      - call: POST /boardgov/board-terms
        payload:
          nonprofit_id: ${np}
          board_member_id: ${c}
          start_date: '2026-01-01T00:00:00Z'
        as: GovernanceAdmin
      - call: POST /boardgov/board-terms
        payload:
          nonprofit_id: ${np}
          board_member_id: ${d1}
          start_date: '2026-01-01T00:00:00Z'
        as: GovernanceAdmin
      - call: POST /boardgov/board-terms
        payload:
          nonprofit_id: ${np}
          board_member_id: ${d2}
          start_date: '2026-01-01T00:00:00Z'
        as: GovernanceAdmin
      - call: POST /boardgov/board-terms
        payload:
          nonprofit_id: ${np}
          board_member_id: ${d3}
          start_date: '2026-01-01T00:00:00Z'
        as: GovernanceAdmin
      - call: POST /boardgov/board-terms
        payload:
          nonprofit_id: ${np}
          board_member_id: ${d4}
          start_date: '2026-01-01T00:00:00Z'
        as: GovernanceAdmin
      - call: POST /boardgov/board-terms
        payload:
          nonprofit_id: ${np}
          board_member_id: ${d5}
