  - rule_id: priority_pair_validation_conflict
    instances:
      - name: slot_cancel_state_gate_masks_the_slot_has_sales_ceiling
        grounds:
          - validations[priority 70].ERR_SLOT_INVALID_STATE
          - validations[priority 130].ERR_SLOT_HAS_SALES
          - endpoints[POST /timed-entry-slots/{slotId}/status-decisions]
        distinguishing_aspect: |
          Error-category pair state (P70) versus business_safety (P130). One request violates both
          rules at once: the slot is SUSPENDED (CANCEL is declared only from DRAFT or OPEN) and it is
          also carrying a 4-seat hold. P70 wins, so the response is ERR_SLOT_INVALID_STATE and the
          sales ceiling is never reached. Removing only the state violation (RESUME back to OPEN)
          exposes the masked P130 ERR_SLOT_HAS_SALES on the very same request body, and removing the
          hold as well finally lets the cancel through — which proves the masked rule was violated all
          along rather than being vacuously true.
        test_recipe:
          setup:
            - "One PLANNED NYC run with one themed room (cap 40 / dwell 15, effective_capacity 120)."
            - "One RELEASED 40-seat slot for 2026-09-05T14:00:00Z holding one PENDING SINGLE order of party_size 4 (held_capacity 4, available_capacity 36)."
            - "The slot is then administratively SUSPENDED so that both the state gate and the sales ceiling are violated by the same cancel request."
