              captures: { e1: "$.data.exposure_open_hours" }
            - call: "POST /modular/modules/${m2}/execute-set"
              payload: { set_note: "admitted at exactly the limit" }
              as: SiteSuperintendent
              as_user_id: "${proj}"
              captures: { s2: "$.data.site_status" }
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T16:01:00Z" }
              as: ProgramAdmin
            - call: "POST /modular/modules/${m3}/execute-set"
              payload: { set_note: "blocked by the open module" }
