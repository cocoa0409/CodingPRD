scaffold_corner_design:

  # ============================================================
  # §1.9 — From Table 1 (Entities)
  # ============================================================
  - section: entities
    instances:
      - name: market_creation_returns_201_with_defaults
        claim_type: creation
        grounds: ["entities.Market"]
        distinguishing_aspect: "POST /markets with all required fields returns 201 and applies system defaults (posture=SETUP, run_ops_index=0, jury_quorum default 3)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MarketOperator
          trigger:
            - call: "POST /markets"
              payload: { name: "CornerM", season_code: "C-1", opens_at: "2026-12-01T00:00:00Z", closes_at: "2026-12-31T23:59:59Z", application_opens_at: "2026-09-01T00:00:00Z", application_closes_at: "2026-11-01T00:00:00Z", category_caps: {FOOD_BEVERAGE: 5, CRAFT: 5, APPAREL: 5, HOME_GOODS: 5, EXPERIENCE: 5}, chalet_count: 1, standard_booth_count: 5 }
              as: MarketOperator
              captures: { cm_id: $.data.id }
          assert:
            - "Market.${cm_id}.posture == SETUP"
            - "Market.${cm_id}.run_ops_index == 0"
            - "Market.${cm_id}.jury_quorum == 3"
            - "Market.${cm_id}.total_accepted_vendors == 0"

      - name: market_get_returns_404_for_nonexistent
        claim_type: not_found
        grounds: ["entities.Market"]
        distinguishing_aspect: "GET /markets/{id} with random UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MarketOperator
          trigger:
            - call: "GET /markets/00000000-0000-0000-0000-000000000000"
              as: MarketOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "http_status == 404"

      - name: market_list_pagination_fields
        claim_type: listing
        grounds: ["entities.Market", "response_envelope"]
        distinguishing_aspect: "GET /markets returns paginated list with total_count, has_more, limit, offset."
        test_recipe:
          setup: ["Two markets exist"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MarketOperator
            - call: "POST /markets"
              payload: { name: "L1", season_code: "L-1", opens_at: "2026-12-01T00:00:00Z", closes_at: "2026-12-31T23:59:59Z", application_opens_at: "2026-09-01T00:00:00Z", application_closes_at: "2026-11-01T00:00:00Z", category_caps: {FOOD_BEVERAGE: 5, CRAFT: 5, APPAREL: 5, HOME_GOODS: 5, EXPERIENCE: 5}, chalet_count: 1, standard_booth_count: 5 }
              as: MarketOperator
            - call: "POST /markets"
              payload: { name: "L2", season_code: "L-2", opens_at: "2026-12-01T00:00:00Z", closes_at: "2026-12-31T23:59:59Z", application_opens_at: "2026-09-01T00:00:00Z", application_closes_at: "2026-11-01T00:00:00Z", category_caps: {FOOD_BEVERAGE: 5, CRAFT: 5, APPAREL: 5, HOME_GOODS: 5, EXPERIENCE: 5}, chalet_count: 1, standard_booth_count: 5 }
              as: MarketOperator
          trigger:
            - call: "GET /markets?limit=1&offset=0"
              as: MarketOperator
          assert:
            - "response.data is array of length 1"
            - "response.meta.total_count == 2"
            - "response.meta.has_more == true"

      - name: vendor_required_field_missing_returns_400
        claim_type: required_fields
        grounds: ["entities.Vendor"]
        distinguishing_aspect: "POST /vendors missing contact_email returns 400."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MarketOperator
          trigger:
            - call: "POST /vendors"
              payload: { legal_name: "NoEmail", category: "CRAFT" }
              as: MarketOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BAD_REQUEST or ERR_INVALID_REQUEST"

      - name: vendor_enum_invalid_category_returns_400
        claim_type: type_constraints
        grounds: ["entities.Vendor.fields.category"]
        distinguishing_aspect: "POST /vendors with category=INVALID returns 400."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MarketOperator
          trigger:
            - call: "POST /vendors"
              payload: { legal_name: "BadCat", contact_email: "bad@x.com", category: "INVALID" }
              as: MarketOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BAD_REQUEST or ERR_INVALID_ENUM"

      - name: application_computed_jury_average_ignored_on_input
        claim_type: computed_fields
        grounds: ["entities.VendorApplication.fields.jury_average"]
        distinguishing_aspect: "Client-supplied jury_average in POST body is ignored; computed field remains null until scores exist."
        test_recipe:
          setup: ["Market SETUP, vendor exists"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: MarketOperator
            - call: "POST /markets"
              payload: { name: "CM", season_code: "CM-1", opens_at: "2026-12-01T00:00:00Z", closes_at: "2026-12-31T23:59:59Z", application_opens_at: "2026-09-01T00:00:00Z", application_closes_at: "2026-11-01T00:00:00Z", category_caps: {FOOD_BEVERAGE: 5, CRAFT: 5, APPAREL: 5, HOME_GOODS: 5, EXPERIENCE: 5}, chalet_count: 1, standard_booth_count: 5 }
              as: MarketOperator
              captures: { cm_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "CV", contact_email: "cv@x.com", category: "CRAFT" }
              as: MarketOperator
              captures: { cv_id: $.data.id }
          trigger:
            - call: "POST /markets/${cm_id}/applications"
              payload: { vendor_id: "${cv_id}", requested_booth_type: "STANDARD", jury_average: 99 }
              as: VendorRole
              as_user_id: "${cv_id}"
              captures: { ca_id: $.data.id }
          assert:
            - "VendorApplication.${ca_id}.jury_average == null"
            - "VendorApplication.${ca_id}.status == DRAFT"

      - name: booth_system_fields_id_created_at_ignored
        claim_type: system_fields
        grounds: ["entities.Booth"]
        distinguishing_aspect: "Client-supplied id, created_at, updated_at in POST body are ignored."
        test_recipe:
          setup: ["Market SETUP"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: MarketOperator
            - call: "POST /markets"
              payload: { name: "SM", season_code: "SM-1", opens_at: "2026-12-01T00:00:00Z", closes_at: "2026-12-31T23:59:59Z", application_opens_at: "2026-08-01T00:00:00Z", application_closes_at: "2026-11-01T00:00:00Z", category_caps: {FOOD_BEVERAGE: 5, CRAFT: 5, APPAREL: 5, HOME_GOODS: 5, EXPERIENCE: 5}, chalet_count: 1, standard_booth_count: 5 }
              as: MarketOperator
              captures: { sm_id: $.data.id }
          trigger:
            - call: "POST /markets/${sm_id}/booths"
              payload: { booth_code: "SYS-1", booth_type: "STANDARD", zone: "NORTH", square_feet: 80, id: "11111111-1111-1111-1111-111111111111", created_at: "2000-01-01T00:00:00Z" }
              as: MarketOperator
              captures: { sb_id: $.data.id }
          assert:
            - "Booth.${sb_id}.id != '11111111-1111-1111-1111-111111111111'"
            - "Booth.${sb_id}.created_at != '2000-01-01T00:00:00Z'"

  # ============================================================
  # §1.9 — From Table 2 (State Machines)
  # ============================================================
  - section: state_machines
    instances:
      - name: application_invalid_transition_draft_to_accepted
        claim_type: invalid_transition
        grounds: ["state_machines.VendorApplication"]
        distinguishing_aspect: "POST decide on DRAFT application returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Market SETUP, DRAFT application"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: MarketOperator
            - call: "POST /markets"
              payload: { name: "SM2", season_code: "SM2-1", opens_at: "2026-12-01T00:00:00Z", closes_at: "2026-12-31T23:59:59Z", application_opens_at: "2026-09-01T00:00:00Z", application_closes_at: "2026-11-01T00:00:00Z", category_caps: {FOOD_BEVERAGE: 5, CRAFT: 5, APPAREL: 5, HOME_GOODS: 5, EXPERIENCE: 5}, chalet_count: 1, standard_booth_count: 5 }
              as: MarketOperator
              captures: { sm2_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "SV2", contact_email: "sv2@x.com", category: "CRAFT" }
              as: MarketOperator
              captures: { sv2_id: $.data.id }
            - call: "POST /markets/${sm2_id}/applications"
              payload: { vendor_id: "${sv2_id}", requested_booth_type: "STANDARD" }
              as: VendorRole
              as_user_id: "${sv2_id}"
              captures: { sa2_id: $.data.id }
            - call: "GET /markets/${sm2_id}/applications/${sa2_id}"
              as: JuryChair
              captures: { sa2_ver: $.data.version }
          trigger:
            - call: "POST /markets/${sm2_id}/applications/${sa2_id}/decide"
              payload: { decision: "ACCEPTED", expected_application_version: "${sa2_ver}" }
              as: JuryChair
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: assignment_terminal_lockdown_released
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.BoothAssignment"]
        distinguishing_aspect: "From RELEASED, no transitions are possible; POST activate returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Market OPEN, ACTIVE BoothAssignment, then released"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: MarketOperator
            - call: "POST /markets"
              payload: { name: "SM3", season_code: "SM3-1", opens_at: "2026-12-01T00:00:00Z", closes_at: "2026-12-31T23:59:59Z", application_opens_at: "2026-08-01T00:00:00Z", application_closes_at: "2026-11-01T00:00:00Z", category_caps: {FOOD_BEVERAGE: 5, CRAFT: 5, APPAREL: 5, HOME_GOODS: 5, EXPERIENCE: 5}, chalet_count: 1, standard_booth_count: 5 }
              as: MarketOperator
              captures: { sm3_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "SV3", contact_email: "sv3@x.com", category: "CRAFT" }
              as: MarketOperator
              captures: { sv3_id: $.data.id }
            - call: "POST /markets/${sm3_id}/booths"
              payload: { booth_code: "ST-3", booth_type: "STANDARD", zone: "NORTH", square_feet: 80 }
              as: MarketOperator
              captures: { sb3_id: $.data.id }
            - call: "POST /markets/${sm3_id}/applications"
              payload: { vendor_id: "${sv3_id}", requested_booth_type: "STANDARD" }
              as: VendorRole
              as_user_id: "${sv3_id}"
              captures: { sa3_id: $.data.id }
            - call: "POST /markets/${sm3_id}/applications/${sa3_id}/submit"
              payload: {}
              as: VendorRole
              as_user_id: "${sv3_id}"
            - call: "POST /markets/${sm3_id}/applications/${sa3_id}/score"
              payload: { score_0_100: 80 }
              as: JuryMember
            - call: "POST /markets/${sm3_id}/applications/${sa3_id}/score"
              payload: { score_0_100: 80 }
              as: JuryMember
            - call: "POST /markets/${sm3_id}/applications/${sa3_id}/score"
              payload: { score_0_100: 80 }
              as: JuryMember
            - call: "GET /markets/${sm3_id}/applications/${sa3_id}"
              as: JuryChair
              captures: { sa3_ver: $.data.version }
            - call: "POST /markets/${sm3_id}/applications/${sa3_id}/decide"
              payload: { decision: "ACCEPTED", expected_application_version: "${sa3_ver}" }
              as: JuryChair
            - call: "POST /markets/${sm3_id}/assignments"
              payload: { booth_id: "${sb3_id}", application_id: "${sa3_id}" }
              as: MarketOperator
              captures: { sasg3_id: $.data.id }
            - call: "POST /markets/${sm3_id}/assignments/${sasg3_id}/activate"
              payload: {}
              as: MarketOperator
            - call: "POST /markets/${sm3_id}/assignments/${sasg3_id}/release"
              payload: {}
              as: MarketOperator
          trigger:
            - call: "POST /markets/${sm3_id}/assignments/${sasg3_id}/activate"
              payload: {}
              as: MarketOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: market_initial_state_setup
        claim_type: initial_state
        grounds: ["state_machines.Market"]
        distinguishing_aspect: "Newly created Market starts in SETUP posture."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MarketOperator
          trigger:
            - call: "POST /markets"
              payload: { name: "SM4", season_code: "SM4-1", opens_at: "2026-12-01T00:00:00Z", closes_at: "2026-12-31T23:59:59Z", application_opens_at: "2026-09-01T00:00:00Z", application_closes_at: "2026-11-01T00:00:00Z", category_caps: {FOOD_BEVERAGE: 5, CRAFT: 5, APPAREL: 5, HOME_GOODS: 5, EXPERIENCE: 5}, chalet_count: 1, standard_booth_count: 5 }
              as: MarketOperator
              captures: { sm4_id: $.data.id }
          assert:
            - "Market.${sm4_id}.posture == SETUP"

      - name: market_cancel_cascade_down
        claim_type: cascade_down
        grounds: ["state_machines.Market.SETUP_to_CANCELLED"]
        distinguishing_aspect: "Market cancel cascades to all VendorApplications and BoothAssignments."
        test_recipe:
          setup: ["Market SETUP with one SUBMITTED application and one PENDING_PAYMENT assignment"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: MarketOperator
            - call: "POST /markets"
              payload: { name: "SM5", season_code: "SM5-1", opens_at: "2026-12-01T00:00:00Z", closes_at: "2026-12-31T23:59:59Z", application_opens_at: "2026-09-01T00:00:00Z", application_closes_at: "2026-11-01T00:00:00Z", category_caps: {FOOD_BEVERAGE: 5, CRAFT: 5, APPAREL: 5, HOME_GOODS: 5, EXPERIENCE: 5}, chalet_count: 1, standard_booth_count: 5 }
              as: MarketOperator
              captures: { sm5_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "SV5", contact_email: "sv5@x.com", category: "CRAFT" }
              as: MarketOperator
              captures: { sv5_id: $.data.id }
            - call: "POST /markets/${sm5_id}/applications"
              payload: { vendor_id: "${sv5_id}", requested_booth_type: "STANDARD" }
              as: VendorRole
              as_user_id: "${sv5_id}"
              captures: { sa5_id: $.data.id }
            - call: "POST /markets/${sm5_id}/applications/${sa5_id}/submit"
              payload: {}
              as: VendorRole
              as_user_id: "${sv5_id}"
            - call: "POST /markets/${sm5_id}/booths"
              payload: { booth_code: "ST-5", booth_type: "STANDARD", zone: "NORTH", square_feet: 80 }
              as: MarketOperator
              captures: { sb5_id: $.data.id }
            - call: "POST /markets/${sm5_id}/assignments"
              payload: { booth_id: "${sb5_id}", application_id: "${sa5_id}" }
              as: MarketOperator
          trigger:
            - call: "POST /markets/${sm5_id}/cancel"
              payload: {}
              as: MarketOperator
          assert:
            - "Market.${sm5_id}.posture == CANCELLED"
            - "VendorApplication.${sa5_id}.status == WITHDRAWN"

      - name: load_slot_check_in_bubble_up
        claim_type: bubble_up
        grounds: ["state_machines.LoadSlot.RESERVED_to_CHECKED_IN"]
        distinguishing_aspect: "LoadSlot check-in does not bubble to parent Market (no aggregate state change). Assert Market.posture unchanged."
        test_recipe:
          setup: ["Market OPEN, ACTIVE assignment, RESERVED LoadSlot within window"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: MarketOperator
            - call: "POST /markets"
              payload: { name: "SM6", season_code: "SM6-1", opens_at: "2026-12-01T00:00:00Z", closes_at: "2026-12-31T23:59:59Z", application_opens_at: "2026-08-01T00:00:00Z", application_closes_at: "2026-11-01T00:00:00Z", category_caps: {FOOD_BEVERAGE: 5, CRAFT: 5, APPAREL: 5, HOME_GOODS: 5, EXPERIENCE: 5}, chalet_count: 1, standard_booth_count: 5 }
              as: MarketOperator
              captures: { sm6_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "SV6", contact_email: "sv6@x.com", category: "CRAFT" }
              as: MarketOperator
              captures: { sv6_id: $.data.id }
            - call: "POST /markets/${sm6_id}/booths"
              payload: { booth_code: "ST-6", booth_type: "STANDARD", zone: "NORTH", square_feet: 80 }
              as: MarketOperator
              captures: { sb6_id: $.data.id }
            - call: "POST /markets/${sm6_id}/applications"
              payload: { vendor_id: "${sv6_id}", requested_booth_type: "STANDARD" }
              as: VendorRole
              as_user_id: "${sv6_id}"
              captures: { sa6_id: $.data.id }
            - call: "POST /markets/${sm6_id}/applications/${sa6_id}/submit"
              payload: {}
              as: VendorRole
              as_user_id: "${sv6_id}"
            - call: "POST /markets/${sm6_id}/applications/${sa6_id}/score"
              payload: { score_0_100: 80 }
              as: JuryMember
            - call: "POST /markets/${sm6_id}/applications/${sa6_id}/score"
              payload: { score_0_100: 80 }
              as: JuryMember
            - call: "POST /markets/${sm6_id}/applications/${sa6_id}/score"
              payload: { score_0_100: 80 }
              as: JuryMember
            - call: "GET /markets/${sm6_id}/applications/${sa6_id}"
              as: JuryChair
              captures: { sa6_ver: $.data.version }
            - call: "POST /markets/${sm6_id}/applications/${sa6_id}/decide"
              payload: { decision: "ACCEPTED", expected_application_version: "${sa6_ver}" }
              as: JuryChair
            - call: "POST /markets/${sm6_id}/assignments"
              payload: { booth_id: "${sb6_id}", application_id: "${sa6_id}" }
              as: MarketOperator
              captures: { sasg6_id: $.data.id }
            - call: "POST /markets/${sm6_id}/assignments/${sasg6_id}/activate"
              payload: {}
              as: MarketOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-05T00:00:00Z" }
              as: MarketOperator
            - call: "GET /markets/${sm6_id}"
              as: MarketOperator
              captures: { sm6_ver: $.data.version }
            - call: "POST /markets/${sm6_id}/open_market"
              payload: { expected_market_version: "${sm6_ver}" }
              as: MarketOperator
            - call: "POST /markets/${sm6_id}/load_slots"
              payload: { assignment_id: "${sasg6_id}", direction: "LOAD_IN", starts_at: "2026-12-05T08:00:00Z", ends_at: "2026-12-05T12:00:00Z" }
              as: MarketOperator
              captures: { sls6_id: $.data.id }
          trigger:
            - call: "POST /markets/${sm6_id}/load_slots/${sls6_id}/check_in"
              payload: {}
              as: VendorRole
              as_user_id: "${sv6_id}"
          assert:
            - "LoadSlot.${sls6_id}.status == CHECKED_IN"
            - "Market.${sm6_id}.posture == OPEN (unchanged)"

  # ============================================================
  # §1.9 — From Table 3 (Calculations)
  # ============================================================
  - section: calculations
    instances:
      - name: pos_fee_threshold_boundary_250_bps
        claim_type: threshold_boundary
        grounds: ["calculations.pos_fee"]
        distinguishing_aspect: "POS fee at exactly 250 bps on 10000 cents = 250; on 9999 cents = 249 (floor). Boundary precision: fee changes at exact cent thresholds."
        test_recipe:
          setup: ["Market OPEN, shared_pos_fee_bps=250, ACTIVE PosDevice, ACTIVE assignment"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: MarketOperator
            - call: "POST /markets"
              payload: { name: "CM3", season_code: "CM3-1", opens_at: "2026-12-01T00:00:00Z", closes_at: "2026-12-31T23:59:59Z", application_opens_at: "2026-08-01T00:00:00Z", application_closes_at: "2026-11-01T00:00:00Z", category_caps: {FOOD_BEVERAGE: 5, CRAFT: 5, APPAREL: 5, HOME_GOODS: 5, EXPERIENCE: 5}, chalet_count: 1, standard_booth_count: 5, shared_pos_enabled: true, shared_pos_fee_bps: 250 }
              as: MarketOperator
              captures: { cm3_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "CV3", contact_email: "cv3@x.com", category: "CRAFT" }
              as: MarketOperator
              captures: { cv3_id: $.data.id }
            - call: "POST /markets/${cm3_id}/booths"
              payload: { booth_code: "CH-3", booth_type: "CHALET", zone: "NORTH", square_feet: 100, has_power: true }
              as: MarketOperator
              captures: { cb3_id: $.data.id }
            - call: "POST /markets/${cm3_id}/applications"
              payload: { vendor_id: "${cv3_id}", requested_booth_type: "CHALET", requested_pos: true }
              as: VendorRole
              as_user_id: "${cv3_id}"
              captures: { ca3_id: $.data.id }
            - call: "POST /markets/${cm3_id}/applications/${ca3_id}/submit"
              payload: {}
              as: VendorRole
              as_user_id: "${cv3_id}"
            - call: "POST /markets/${cm3_id}/applications/${ca3_id}/score"
              payload: { score_0_100: 80 }
              as: JuryMember
            - call: "POST /markets/${cm3_id}/applications/${ca3_id}/score"
