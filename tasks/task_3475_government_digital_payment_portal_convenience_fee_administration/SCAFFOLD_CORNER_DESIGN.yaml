              captures: { e_ref: $.data.error_id }
            - call: "POST /portal/chargebacks/00000000-0000-4000-8000-0000000000a6/contest"
              payload: { evidence_note: "ghost" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { e_cb: $.data.error_id }
            - call: "POST /portal/reconciliation-exceptions/00000000-0000-4000-8000-0000000000a7/resolve"
              payload: { resolution_note: "ghost" }
              as: PlatformAdmin
              captures: { e_exc: $.data.error_id }
            - call: "GET /portal/payers/00000000-0000-4000-8000-0000000000a8"
              payload: {}
              as: PlatformAdmin
              captures: { e_payer: $.data.error_id }
          assert:
            - "all eight responses are 404 with error_id in {ERR_SERVICE_NOT_FOUND, ERR_BATCH_NOT_FOUND, ERR_ACCOUNT_NOT_FOUND, ERR_AUTHORIZATION_NOT_FOUND, ERR_REFUND_NOT_FOUND, ERR_CHARGEBACK_NOT_FOUND, ERR_EXCEPTION_NOT_FOUND, ERR_PAYER_NOT_FOUND} respectively"
            - "each name is resource-specific: e_svc == ERR_SERVICE_NOT_FOUND, e_batch == ERR_BATCH_NOT_FOUND, e_acct == ERR_ACCOUNT_NOT_FOUND, e_authz == ERR_AUTHORIZATION_NOT_FOUND, e_ref == ERR_REFUND_NOT_FOUND, e_cb == ERR_CHARGEBACK_NOT_FOUND, e_exc == ERR_EXCEPTION_NOT_FOUND, e_payer == ERR_PAYER_NOT_FOUND"

      - name: err_evidence_deadline_passed_on_contest
        claim_type: violation_to_error
        grounds:
          - errors.ERR_EVIDENCE_DEADLINE_PASSED
          - entities.ChargebackCase.fields.evidence_due_at
          - validations[priority=9]
        distinguishing_aspect: "Contest is accepted while clock <= evidence_due_at and rejected strictly after: case A contested at exactly the deadline succeeds, case B contested one second past it fails 409 ERR_EVIDENCE_DEADLINE_PASSED."
        test_recipe:
          setup:
            - "CF agency base chain; TWO captured CARD transactions, each with an OPENED chargeback opened at 2026-09-10 (evidence_due_at 2026-09-20T00:00:00Z)."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_account
            - *c_verify
            - *c_attest
            - *c_agency_on
            - *c_service
            - *c_authz
            - *c_authz_ok
            - *c_service_on
            - *c_payer
            - *c_card
            - *c_clk10
            - *c_quote100k
            - *c_txn
            - *c_capture
            - *c_chargeback
            - call: "POST /portal/fee-quotes"
              payload: { service_id: "${svc_id}", amount_cents: 20000, method: "CARD" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { quote_b: $.data.id }
            - call: "POST /portal/payment-transactions"
              payload: { quote_id: "${quote_b}", instrument_id: "${inst_card}" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { txn_b: $.data.id }
            - call: "POST /portal/payment-transactions/${txn_b}/capture"
              payload: {}
              as: AgencyAdmin
              as_user_id: "aa-lead"
            - call: "POST /portal/chargebacks"
              payload: { transaction_id: "${txn_b}", reason_code: "DUPLICATE" }
              as: PlatformAdmin
              captures: { case_b: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /portal/chargebacks/${case_id}/contest"
              payload: { evidence_note: "at the deadline exactly" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T00:00:01Z" }
              as: PlatformAdmin
            - call: "POST /portal/chargebacks/${case_b}/contest"
              payload: { evidence_note: "one second late" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { err_id: $.data.error_id }
          assert:
            - "case A contested at exactly evidence_due_at succeeds: status CONTESTED (boundary is inclusive)"
            - "case B one second later returns 409 and err_id == ERR_EVIDENCE_DEADLINE_PASSED; ChargebackCase.${case_b}.status stays OPENED"

      - name: err_representment_window_closed
        claim_type: violation_to_error
        grounds:
          - errors.ERR_REPRESENTMENT_WINDOW_CLOSED
          - state_machines.PaymentTransaction.RETURNED_to_RE_PRESENTED
          - validations[priority=9]
        distinguishing_aspect: "Re-presentment must come within 30 days of returned_at: at clock 2026-10-16 (31 days after the 2026-09-15 return) the attempt fails 409 ERR_REPRESENTMENT_WINDOW_CLOSED even though representment_count is still 0."
        test_recipe:
          setup:
