  # ===========================================================================
  # RULE 9 — compensating_invariant
  # Two DIFFERENT conserved quantities:
  #   the fund ledger identity (balance == opening + sum of signed amounts)
  #   the certified RECURRING revenue base (invariant under one-time churn)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: fund_ledger_identity_conserved_across_withdrawal_and_reversal
        grounds:
          - entities.ReserveFund.fields.balance_cents
          - entities.ReserveTransaction.fields.reverses_transaction_id
          - endpoints[POST /reserve-transactions/{id}/reverse]
          - validations[priority 58 ERR_REVERSAL_WOULD_OVERDRAW]
          - calculations.reserve_adequacy
        distinguishing_aspect: |
          The conserved quantity is the ledger identity balance_cents == opening_balance_cents + SUM
          of signed_amount_cents: reversing the 10000000 withdrawal appends a compensating +10000000
          row rather than deleting anything, so the ledger grows to 3 rows while the balance returns
          to exactly 71958137, fy_withdrawn_cents falls back to 0 and cooling_off_until returns to
          null — every derived figure lands on its pre-withdrawal value with no drift.
        test_recipe:
          setup:
            - "CERTIFIED FY2027 cycle; one fund, opening 50000000, balance 71958137 after the certification deposit, cooling_off_days 30."
            - "One SHORTFALL_TRIGGER request for 10000000, APPROVED and then EXECUTED at 2026-08-01T00:00:00Z, leaving balance 61958137, fy_withdrawn_cents 10000000, coverage_ratio_bps 7798 and cooling_off_until 2026-08-31T00:00:00Z."
            - "Two ledger rows exist: +21958137 (CERTIFICATION_DEPOSIT) and -10000000 (WITHDRAWAL)."
          setup_api_calls:
            - call: "POST /revenue-sources"
              payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }
              as: ForecastDirector
              as_user_id: "dir-1"
              captures: { src_pit: $.data.id }
            - call: "POST /revenue-sources"
              payload: { name: "Capital Gains Tax", tax_type: "CAPITAL_GAINS", base_year_receipts_cents: 312345600, elasticity_employment_bps: 0, elasticity_wage_income_bps: 2075, elasticity_retail_bps: 0, elasticity_asset_bps: 8940, volatility_class: "HIGH" }
              as: ForecastDirector
              as_user_id: "dir-1"
              captures: { src_cgt: $.data.id }
            - call: "POST /revenue-sources/${src_pit}/policy-adjustments"
              payload: { statute_code: "HB-2027-014", policy_category: "RATE_CHANGE", adjustment_kind: "DECREASE", annualized_amount_cents: 50000000, effective_start_date: "2026-10-01", effective_end_date: "2027-07-01", phase_in_type: "PRORATED", first_effective_fiscal_year: 2027 }
              as: ForecastDirector
              as_user_id: "dir-1"
            - call: "POST /revenue-sources/${src_cgt}/policy-adjustments"
