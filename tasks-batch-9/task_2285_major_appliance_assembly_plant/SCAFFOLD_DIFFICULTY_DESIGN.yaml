          assert:
            - "Before the withdrawal the charges are observable: Part.${p_door_id}.field_failure_count == 1 with cohort_failure_rate_per_1000 == 1000.00, Supplier.${sup1_id}.quality_penalty_count == 1 and on_time_score == 90.00 with status APPROVED"
