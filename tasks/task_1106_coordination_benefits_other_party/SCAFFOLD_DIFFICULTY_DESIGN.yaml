              as: ClaimsExaminer
              captures: { clid: $.data.id }
            - call: "POST /cob/claims/${clid}/lines"
              payload: { line_number: 1, procedure_code: "X", billed_cents: 50000, allowed_cents: 40000, primary_paid_cents: 25000 }
              as: ClaimsExaminer
            - call: "POST /cob/claims/${clid}/adjudicate"
              payload: {}
              as: ClaimsExaminer
          trigger:
