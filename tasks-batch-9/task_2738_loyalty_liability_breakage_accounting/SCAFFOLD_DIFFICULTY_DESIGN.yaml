            - "PRE-TRIGGER: AccountingPeriod.${per1_id}.reopen_count == 0 - approving E2 did not force a reopen, because per1 was already HARD_CLOSED rather than SOFT_CLOSED"
            - "SOFT-CLOSE: AccountingPeriod.${per2_id}.opening_liability_cents == 2120 (August's closing balance carried forward)"
            - "SOFT-CLOSE: issuance_deferred_cents == 0, redemption_recognized_cents == 0, remeasurement_delta_cents == 0, expiry_released_cents == 0 - September had no activity of its own"
            - "SOFT-CLOSE: pre_catchup_liability_cents == 2120, outstanding_gross_ssp_cents == 2719, required_liability_cents == 1974 (round_half_up(2719 * 7261 / 10000)), catch_up_adjustment_cents == -146, closing_liability_cents == 1974, breakage_recognized_cents == +146, approved_estimate_rate_bp == 7261"
            - "SOFT-CLOSE: LoyaltyProgram.${prog_id}.recognized_breakage_ytd_cents == -42, i.e. August's -188 plus September's +146 - a NEGATIVE catch-up produces POSITIVE breakage recognition"
