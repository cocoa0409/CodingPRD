            - "RefrigerantSystem.${sys1_id}.current_charge_lbs == 80.0 and leak_rate_pct == 0.0"
            - "GET /service-records?system_id=${sys1_id} returns total_count 0"

      - name: cylinder_from_another_store_cannot_feed_this_systems_record
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=23]
          - errors[ERR_CROSS_STORE_RESOURCE]
        distinguishing_aspect: "The offending cylinder holds exactly the right chemistry and has ample contents, so only its store_id is wrong: the record is 422 ERR_CROSS_STORE_RESOURCE and never ERR_REFRIGERANT_TYPE_MISMATCH, proving the check is on ownership rather than compatibility."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, two stores A and B, R-404A. SYS1 belongs to store A with EQ1 also at store A; CYL_B (same R-404A, 40.0 lbs) is stationed at store B."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
