            - "after wind 30: Ride.daily_status == WEATHER_HOLD (>= limit triggers) and Ride.license_status == LICENSED (independent dimension untouched)"
            - "after wind 27 + resume: Ride.daily_status == OPEN"
            - "after wind 45: OperatingDay.posture == WEATHER_HOLD and Ride.daily_status == WEATHER_HOLD"
            - "resume-day while latest wind is 45 -> err_day == ERR_WIND_ABOVE_LIMIT (45 > 39); resume-day after a 39 observation succeeds (39 <= 39, inclusive boundary)"
            - "after resume-day: OperatingDay.posture == OPEN but Ride.daily_status == WEATHER_HOLD (rides do not auto-resume)"
            - "after wind 20 + ride resume: Ride.daily_status == OPEN"

