            - "${fab_first_delivered} == 2026-08-21T00:00:00Z and ${fab_first_days} == 20"
            - "${fab_projected} == 60 (100 - LATE_DAY_PENALTY_POINTS 4 x 10 late days) and ${fab_final_mid} == null"
            - "${sup_score_mid} == 100 and ${sup_count_mid} == 0 -- a READY_FOR_FITTING order is outside the rollup input set"
            - "${fab_status_3} == ACCEPTED and ${fab_accepted_at} == 2026-08-21T00:00:00Z"
            - "${fab_elapsed} == 20 and ${fab_rounds} == 0 and ${fab_final} == 60 (no adjustment penalty was charged)"
            - "${sup_score_final} == 60 and ${sup_count_final} == 1"

