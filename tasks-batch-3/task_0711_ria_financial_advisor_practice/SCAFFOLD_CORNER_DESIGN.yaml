  # ---------------------------------------------------------------------------
  - section: cross_cutting
    instances:
      - name: occ_stale_household_version_on_fee_run_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[fee-run-create-stale-household]", "errors[ERR_STALE_HOUSEHOLD_VERSION]", entities.Household.fields.version]
        distinguishing_aspect: |
          Two strictly sequential fee-run creates on the same household: the first succeeds and bumps
          Household.version; the second, still carrying the originally observed version (expressed as the
          captured ${hh_v0}), is rejected 412 ERR_STALE_HOUSEHOLD_VERSION.
        test_recipe:
          setup: ["A household at version v0 (captured at create); one fee-run already created bumping version to v0+1."]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { name: "Std", tiers: [ {upper_bound_cents: null, annual_rate_bps: 100} ], minimum_annual_fee_cents: 0 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /households"
              payload: { name: "HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}", billing_method: "ARREARS" }
              as: Advisor
              captures: { hh_id: $.data.id, hh_v0: $.data.version }
            - call: "POST /fee-runs"
              payload: { household_id: "${hh_id}", period_start: "2026-01-01", period_end: "2026-03-31", expected_household_version: "${hh_v0}" }
              as: BillingAdmin
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /fee-runs"
              payload: { household_id: "${hh_id}", period_start: "2026-04-01", period_end: "2026-06-30", expected_household_version: "${hh_v0}" }
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412 and data.error_id == ERR_STALE_HOUSEHOLD_VERSION (second create carries the now-stale ${hh_v0})"

      - name: occ_correct_version_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[fee-run-create-stale-household]", entities.Household.fields.version]
        distinguishing_aspect: "Creating a fee run with the current expected_household_version succeeds (201) and Household.version increments by exactly 1."
        test_recipe:
          setup: ["A fresh household at its create-time version."]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { name: "Std", tiers: [ {upper_bound_cents: null, annual_rate_bps: 100} ], minimum_annual_fee_cents: 0 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /households"
              payload: { name: "HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}", billing_method: "ARREARS" }
              as: Advisor
              captures: { hh_id: $.data.id, hh_v0: $.data.version }
          trigger:
            - call: "POST /fee-runs"
              payload: { household_id: "${hh_id}", period_start: "2026-01-01", period_end: "2026-03-31", expected_household_version: "${hh_v0}" }
              as: BillingAdmin
              captures: { run_id: $.data.id }
            - call: "GET /households/${hh_id}"
              payload: {}
              as: BillingAdmin
              captures: { v_after: $.data.version }
          assert:
            - "HTTP 201 fee-run created; Household.${hh_id}.version == ${hh_v0} + 1 after the create"

      - name: derived_field_reconciliation_aum_on_valuation
        claim_type: derived_field_reconciliation
        grounds: [entities.Household.fields.billable_aum_cents, calculations.householding_breakpoint_tier, entities.Account.fields.market_value_cents]
        distinguishing_aspect: "Re-valuing an ACTIVE billable account from 100,000,000c to 250,000,000c re-derives Household.billable_aum_cents to 250,000,000c on the next household read."
        test_recipe:
          setup: ["A household with one ACTIVE billable account valued 100,000,000c."]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { name: "Std", tiers: [ {upper_bound_cents: null, annual_rate_bps: 100} ], minimum_annual_fee_cents: 0 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /households"
              payload: { name: "HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}" }
              as: Advisor
              captures: { hh_id: $.data.id }
            - call: "POST /clients"
              payload: { household_id: "${hh_id}", full_name: "C", date_of_birth: "1980-01-01", risk_capacity_score: 60, risk_tolerance_score: 60 }
              as: Advisor
