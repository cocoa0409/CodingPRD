            - "call 4: ${e_wrong_role} == 'ERR_UNAUTHORIZED' (403), NOT ERR_SEGREGATION_OF_DUTIES - priority 2 outranks priority 15, and SponsorshipManager may record a sale but never issue a receipt"
            - "GET /outing-ops/receipts?outing_id=${o_id} returns total_count == 2 with receipt_number values 1 and 2, and GET /outing-ops/fundraising-items/${i2_id} is still 'PAID' - the two refusals wrote nothing"

  - section: cross_cutting_complexity_layers
    instances:
      - name: a_superseding_tee_assignment_must_prove_it_saw_the_pairing_it_replaces
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.tee-assignment-supersede-stale-team
          - errors.ERR_STALE_TEAM_VERSION
          - validations[priority=11]
        distinguishing_aspect: "Team.version is the only guard on a repeatable write: a stale expected_team_version is refused with 412 and leaves the pairing untouched, the same version cannot be spent twice, an accepted write bumps version by exactly 1 while a refused one bumps nothing, and the version check fires ahead of the tee-sheet occupancy check on a request that violates both."
        test_recipe:
          setup:
            - "An OPEN outing whose contract carries tee_interval_minutes 10, with two CONFIRMED single-player registrations each backing a one-player team."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TournamentDirector
            - call: "POST /outing-ops/outings"
              payload: { name: "Team OCC Open", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 4, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { o_id: $.data.id }
            - call: "POST /outing-ops/contracts"
              payload: { outing_id: "${o_id}", course_name: "Cedar Ridge GC", rate_per_player_cents: 9500, guaranteed_player_count: 0, tee_interval_minutes: 10, cart_allowance_count: 40 }
              as: CourseOperations
              captures: { c_id: $.data.id }
            - call: "POST /outing-ops/contracts/${c_id}/lifecycle"
              payload: { action: "SIGN" }
              as: CourseOperations
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "SOLO", kind: "INDIVIDUAL", price_cents: 30000, player_slots: 1, gsv_cents: 0, inventory_cap: 10 }
              as: TournamentDirector
              captures: { t_id: $.data.id }
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "OPEN_REGISTRATION" }
              as: TournamentDirector
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${t_id}", buyer_name: "OCC Buyer One", player_count: 1 }
              as: TournamentDirector
              captures: { r1_id: $.data.id }
            - call: "POST /outing-ops/registrations/${r1_id}/payment"
              payload: { amount_cents: 30000 }
              as: CharityTreasurer
            - call: "POST /outing-ops/players"
              payload: { registration_id: "${r1_id}", full_name: "OCC Golfer One", handicap_index: 10.0 }
              as: TournamentDirector
              captures: { p1_id: $.data.id }
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${t_id}", buyer_name: "OCC Buyer Two", player_count: 1 }
              as: TournamentDirector
              captures: { r2_id: $.data.id }
            - call: "POST /outing-ops/registrations/${r2_id}/payment"
              payload: { amount_cents: 30000 }
              as: CharityTreasurer
            - call: "POST /outing-ops/players"
              payload: { registration_id: "${r2_id}", full_name: "OCC Golfer Two", handicap_index: 12.0 }
              as: TournamentDirector
              captures: { p2_id: $.data.id }
            - call: "POST /outing-ops/teams"
              payload: { outing_id: "${o_id}", team_name: "OCC Team One", player_ids: ["${p1_id}"] }
              as: TournamentDirector
              captures: { t1_id: $.data.id, t1_v0: $.data.version }
            - call: "POST /outing-ops/teams"
              payload: { outing_id: "${o_id}", team_name: "OCC Team Two", player_ids: ["${p2_id}"] }
              as: TournamentDirector
              captures: { t2_id: $.data.id, t2_v0: $.data.version }
          trigger:
            - call: "POST /outing-ops/teams/${t1_id}/tee-assignment"
              payload: { expected_team_version: "${t1_v0}", wave: "A", starting_hole: 1, tee_time: "2026-09-19T12:00:00Z", cart_number: 1 }
              as: TournamentDirector
              captures: { t1_v1: $.data.version, t1_end1: $.data.slot_occupancy_end }
            - call: "POST /outing-ops/teams/${t1_id}/tee-assignment"
              payload: { expected_team_version: "${t1_v0}", wave: "A", starting_hole: 10, tee_time: "2026-09-19T12:30:00Z", cart_number: 1 }
              as: TournamentDirector
              captures: { e_stale1: $.data.error_id }
            - call: "POST /outing-ops/teams/${t1_id}/tee-assignment"
              payload: { expected_team_version: "${t1_v1}", wave: "A", starting_hole: 10, tee_time: "2026-09-19T12:30:00Z", cart_number: 1 }
              as: CourseOperations
              captures: { t1_v2: $.data.version, t1_start2: $.data.slot_occupancy_start, t1_end2: $.data.slot_occupancy_end, t1_count: $.data.tee_assignment_count }
            - call: "POST /outing-ops/teams/${t1_id}/tee-assignment"
              payload: { expected_team_version: "${t1_v1}", wave: "A", starting_hole: 15, tee_time: "2026-09-19T13:00:00Z", cart_number: 1 }
              as: TournamentDirector
              captures: { e_stale2: $.data.error_id }
            - call: "POST /outing-ops/teams/${t2_id}/tee-assignment"
              payload: { expected_team_version: "${t2_v0}", wave: "A", starting_hole: 10, tee_time: "2026-09-19T12:40:00Z", cart_number: 2 }
              as: CourseOperations
              captures: { t2_v1: $.data.version, t2_start: $.data.slot_occupancy_start }
            - call: "POST /outing-ops/teams/${t1_id}/tee-assignment"
              payload: { expected_team_version: "${t1_v1}", wave: "A", starting_hole: 10, tee_time: "2026-09-19T12:40:00Z", cart_number: 1 }
              as: TournamentDirector
              captures: { e_stale_and_conflict: $.data.error_id }
          assert:
            - "call 1 is HTTP 200 with ${t1_v1} == ${t1_v0} + 1 and ${t1_end1} == '2026-09-19T12:10:00Z' - the slot is tee_time plus tee_interval_minutes 10"
            - "call 2 is HTTP 412 with ${e_stale1} == 'ERR_STALE_TEAM_VERSION': GET /outing-ops/teams/${t1_id} still reads starting_hole == 1, tee_time == '2026-09-19T12:00:00Z', tee_assignment_count == 1 and version == ${t1_v1} - a refused write bumps nothing"
            - "call 3 is HTTP 200: ${t1_v2} == ${t1_v1} + 1, ${t1_start2} == '2026-09-19T12:30:00Z', ${t1_end2} == '2026-09-19T12:40:00Z' and ${t1_count} == 2 - superseding a pairing is a legitimate repeatable write, which is exactly why a state precondition cannot guard it"
            - "call 4 replays the already-spent ${t1_v1}: HTTP 412 with ${e_stale2} == 'ERR_STALE_TEAM_VERSION' - a version may be spent once and only once"
            - "call 5 is HTTP 200 with ${t2_v1} == ${t2_v0} + 1 and ${t2_start} == '2026-09-19T12:40:00Z' - team two tees off on hole 10 exactly when team one's half-open interval ends, so no occupancy conflict arises and the 412s above cannot be blamed on the tee sheet"
            - "call 6 is both stale AND a genuine hole-10 overlap with team two: ${e_stale_and_conflict} == 'ERR_STALE_TEAM_VERSION' (412), NOT ERR_TEE_SLOT_CONFLICT - priority 11 is evaluated before priority 21"
            - "GET /outing-ops/teams/${t1_id} finally reads version == ${t1_v2}, starting_hole == 10, cart_number == 1 and tee_assignment_count == 2; GET /outing-ops/teams/${t2_id} reads version == ${t2_v1} and starting_hole == 10"

      - name: a_repeatable_tier_amendment_is_guarded_only_by_the_registration_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.amend-tier-supersede-stale-registration
          - errors.ERR_STALE_REGISTRATION_VERSION
          - validations[priority=11]
        distinguishing_aspect: "AMENDED -> AMENDED is a legal self-loop, so nothing but Registration.version distinguishes a client working from the tier it just read from one working from a superseded tier and price delta - and the version check fires before the fiscal check, so a stale request carrying the wrong money still reports 412."
        test_recipe:
          setup:
            - "An OPEN outing carrying three tiers - SOLO 30000/1 slot, TEAM4 120000/4 slots, DELUXE 150000/4 slots - and one registration that has paid the SOLO price."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TournamentDirector
            - call: "POST /outing-ops/outings"
              payload: { name: "Amend OCC Open", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 4, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { o_id: $.data.id }
            - call: "POST /outing-ops/contracts"
              payload: { outing_id: "${o_id}", course_name: "Cedar Ridge GC", rate_per_player_cents: 9500, guaranteed_player_count: 0, fnb_minimum_cents: 0 }
              as: CourseOperations
              captures: { c_id: $.data.id }
            - call: "POST /outing-ops/contracts/${c_id}/lifecycle"
              payload: { action: "SIGN" }
              as: CourseOperations
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "SOLO", kind: "INDIVIDUAL", price_cents: 30000, player_slots: 1, gsv_cents: 0, inventory_cap: 10 }
              as: TournamentDirector
              captures: { t_solo: $.data.id }
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "TEAM4", kind: "TEAM", price_cents: 120000, player_slots: 4, gsv_cents: 0, inventory_cap: 4 }
              as: TournamentDirector
              captures: { t_team: $.data.id }
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "DELUXE", kind: "TEAM", price_cents: 150000, player_slots: 4, gsv_cents: 0, inventory_cap: 4 }
              as: TournamentDirector
              captures: { t_deluxe: $.data.id }
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "OPEN_REGISTRATION" }
              as: TournamentDirector
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${t_solo}", buyer_name: "Amend Buyer", player_count: 1 }
              as: TournamentDirector
              captures: { r_id: $.data.id, r_v0: $.data.version }
            - call: "POST /outing-ops/registrations/${r_id}/payment"
              payload: { amount_cents: 30000 }
              as: CharityTreasurer
              captures: { r_v1: $.data.version }
          trigger:
            - call: "POST /outing-ops/registrations/${r_id}/amend-tier"
              payload: { package_tier_id: "${t_team}", expected_registration_version: "${r_v0}", amount_cents: 90000, player_count: 4 }
              as: TournamentDirector
              captures: { e_stale1: $.data.error_id }
            - call: "POST /outing-ops/registrations/${r_id}/amend-tier"
              payload: { package_tier_id: "${t_team}", expected_registration_version: "${r_v1}", amount_cents: 90000, player_count: 4 }
              as: TournamentDirector
              captures: { r_v2: $.data.version, amt2: $.data.amount_paid_cents, ac2: $.data.amendment_count }
            - call: "POST /outing-ops/registrations/${r_id}/amend-tier"
              payload: { package_tier_id: "${t_deluxe}", expected_registration_version: "${r_v1}", amount_cents: 30000, player_count: 4 }
              as: SponsorshipManager
              captures: { e_stale2: $.data.error_id }
            - call: "POST /outing-ops/registrations/${r_id}/amend-tier"
              payload: { package_tier_id: "${t_deluxe}", expected_registration_version: "${r_v1}", amount_cents: 1, player_count: 4 }
              as: TournamentDirector
              captures: { e_stale_and_money: $.data.error_id }
            - call: "POST /outing-ops/registrations/${r_id}/amend-tier"
              payload: { package_tier_id: "${t_deluxe}", expected_registration_version: "${r_v2}", amount_cents: 30000, player_count: 4 }
              as: SponsorshipManager
              captures: { r_v3: $.data.version, amt3: $.data.amount_paid_cents, ac3: $.data.amendment_count, st3: $.data.status }
          assert:
            - "call 1 uses the version read at creation, which the payment already superseded: HTTP 412 with ${e_stale1} == 'ERR_STALE_REGISTRATION_VERSION', and GET /outing-ops/registrations/${r_id} still reads status == 'CONFIRMED', package_tier_id == ${t_solo}, amount_paid_cents == 30000, amendment_count == 0 and version == ${r_v1}"
            - "call 2 is HTTP 200: status == 'AMENDED', ${amt2} == 120000 (30000 plus the signed delta 90000), ${ac2} == 1 and ${r_v2} == ${r_v1} + 1"
            - "call 3 replays the spent ${r_v1}: HTTP 412 with ${e_stale2} == 'ERR_STALE_REGISTRATION_VERSION' - the second amendment is legitimate in itself, so only the version can refuse it"
            - "call 4 is stale AND carries a delta of 1 instead of the correct 30000: ${e_stale_and_money} == 'ERR_STALE_REGISTRATION_VERSION' (412), NOT ERR_PAYMENT_AMOUNT_MISMATCH - priority 11 is evaluated before priority 35"
            - "call 5 is HTTP 200 with ${st3} == 'AMENDED' (the legal self-loop), ${amt3} == 150000, ${ac3} == 2 and ${r_v3} == ${r_v2} + 1"
            - "GET /outing-ops/package-tiers?outing_id=${o_id} reads sold_count 0 for SOLO, 0 for TEAM4 and 1 for DELUXE, and GET /outing-ops/outings/${o_id} reads confirmed_player_slots == 4 - the two rejected amendments left every counter alone"

      - name: the_insurance_threshold_binds_only_at_or_above_five_hundred_thousand_and_only_for_hole_in_one
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.constants.INSURANCE_REQUIRED_THRESHOLD_CENTS
          - entities.Contest.requires_insurance
          - validations[priority=13]
          - errors.ERR_INSURANCE_NOT_BOUND
        distinguishing_aspect: "The instantaneous threshold is tested at 499999 and at exactly 500000 on the SAME contest type, and once more at 900000 on a different type: the flag is true only when both conditions hold, so a huge closest-to-pin prize opens with no policy while a hole-in-one one cent over the line cannot open until a policy is bound - and the premium lands on the outing's cost side in the same request."
        test_recipe:
          setup:
            - "An OPEN outing with a SIGNED contract and one tier, ready to stage contests on holes 3, 4 and 5."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TournamentDirector
            - call: "POST /outing-ops/outings"
              payload: { name: "Insurance Threshold Open", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 4, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { o_id: $.data.id }
            - call: "POST /outing-ops/contracts"
              payload: { outing_id: "${o_id}", course_name: "Cedar Ridge GC", rate_per_player_cents: 9500, guaranteed_player_count: 0, fnb_minimum_cents: 0 }
              as: CourseOperations
              captures: { c_id: $.data.id }
            - call: "POST /outing-ops/contracts/${c_id}/lifecycle"
              payload: { action: "SIGN" }
              as: CourseOperations
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "SOLO", kind: "INDIVIDUAL", price_cents: 30000, player_slots: 1, gsv_cents: 0, inventory_cap: 10 }
              as: TournamentDirector
              captures: { t_id: $.data.id }
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "OPEN_REGISTRATION" }
              as: TournamentDirector
          trigger:
            - call: "POST /outing-ops/contests"
              payload: { outing_id: "${o_id}", contest_type: "HOLE_IN_ONE", hole_number: 3, prize_value_cents: 499999, yardage: 165 }
              as: TournamentDirector
              captures: { k1_id: $.data.id, k1_req: $.data.requires_insurance }
            - call: "POST /outing-ops/contests/${k1_id}/status"
              payload: { action: "OPEN" }
              as: TournamentDirector
              captures: { k1_status: $.data.status }
            - call: "POST /outing-ops/contests"
              payload: { outing_id: "${o_id}", contest_type: "HOLE_IN_ONE", hole_number: 4, prize_value_cents: 500000, yardage: 170 }
              as: TournamentDirector
              captures: { k2_id: $.data.id, k2_req: $.data.requires_insurance, k2_ins: $.data.insurance_status }
            - call: "POST /outing-ops/contests/${k2_id}/status"
              payload: { action: "OPEN" }
              as: TournamentDirector
              captures: { e_unbound: $.data.error_id }
            - call: "POST /outing-ops/contests/${k2_id}/insurance"
              payload: { insurance_carrier: "Fairway Mutual", insurance_premium_cents: 40000, insurance_coverage_cap_cents: 1000000, insurance_min_yardage: 165, insurance_required_witness_count: 2 }
              as: SponsorshipManager
              captures: { k2_ins2: $.data.insurance_status, k2_status_after_bind: $.data.status }
            - call: "POST /outing-ops/contests/${k2_id}/status"
              payload: { action: "OPEN" }
              as: TournamentDirector
              captures: { k2_status: $.data.status }
            - call: "POST /outing-ops/contests"
              payload: { outing_id: "${o_id}", contest_type: "CLOSEST_TO_PIN", hole_number: 5, prize_value_cents: 900000, yardage: 150 }
              as: TournamentDirector
              captures: { k3_id: $.data.id, k3_req: $.data.requires_insurance }
            - call: "POST /outing-ops/contests/${k3_id}/status"
              payload: { action: "OPEN" }
              as: TournamentDirector
              captures: { k3_status: $.data.status }
          assert:
            - "${k1_req} == false at threshold-minus-one (499999) and ${k1_status} == 'OPEN' - one cent below the line no policy is demanded"
            - "${k2_req} == true at exactly the threshold (500000) with ${k2_ins} == 'NONE' - the comparison is 'at or above', not 'strictly above'"
            - "${e_unbound} == 'ERR_INSURANCE_NOT_BOUND' with HTTP 409, and GET /outing-ops/contests/${k2_id} still reads status == 'PLANNED'"
            - "${k2_ins2} == 'BOUND' while ${k2_status_after_bind} == 'PLANNED' - binding a policy moves the insurance dimension only and leaves the lifecycle dimension where it was"
            - "GET /outing-ops/outings/${o_id} reads insurance_cost_cents == 40000 immediately after the bind"
            - "${k2_status} == 'OPEN' - with the policy bound the identical OPEN request now succeeds, so the 409 came from the threshold rule and nothing else"
            - "${k3_req} == false and ${k3_status} == 'OPEN' even though 900000 is far above the threshold - the flag needs contest_type == 'HOLE_IN_ONE' as well, and GET /outing-ops/outings/${o_id} still reads insurance_cost_cents == 40000"

      - name: layer_cascading_side_effects_on_registration_cancellation
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - state_machines.Registration.transitions.CONFIRMED_to_CANCELLED
        excluded_because:
          difficulty_instance: registration_cancel_cascades_allocation_asset_outing_inventory_and_waitlist
          rationale: "That §1.8 instance walks the nine-step cancel cascade end to end - allocation release, asset counters, outing reserved slots, tier sold_count, confirmed_player_slots, waitlist promotion, automatic reversal receipt and the finance rollup - and asserts each hop's literal values in order."

      - name: layer_cascading_side_effects_on_contract_amendment
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - state_machines.CourseContract.transitions.SIGNED_to_AMENDED
        excluded_because:
          difficulty_instance: contract_amendment_cascades_player_handicap_team_handicap_net_score
          rationale: "That §1.8 instance drives the four-hop rating cascade - contract ratings, every Player.course_handicap, the Team playing handicap and the net score - and asserts the ordering sensitivity of the chain."

      - name: layer_dual_variant_net_proceeds
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.net_proceeds_rollup.variants
        excluded_because:
          difficulty_instance: net_proceeds_provisional_vs_final
          rationale: "That §1.8 instance runs identical data through the PROVISIONAL and FINAL variants and asserts both results plus the delta produced by the switch."

      - name: layer_dual_variant_team_playing_handicap
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.team_playing_handicap.variants
        excluded_because:
          difficulty_instance: team_playing_handicap_provisional_vs_locked
          rationale: "That §1.8 instance asserts the PROVISIONAL and LOCKED variants of the same foursome and the reconciliation applied when LOCK_FIELD switches the variant."

      - name: layer_rate_threshold_on_the_administrative_fee_tiers
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers.rate_threshold_triggers
          - calculations.net_proceeds_rollup.constants
        excluded_because:
          difficulty_instance: admin_fee_tier_boundary_at_exactly_two_million_before_fee
          rationale: "That §1.8 instance pins the cumulative tier boundary at exactly 2000000 before-fee proceeds and asserts the selected percentage on both sides of the line."

      - name: layer_rate_threshold_on_the_token_benefit_ceiling
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers.rate_threshold_triggers
          - calculations.charitable_deductible.constants
        excluded_because:
          difficulty_instance: token_benefit_gsv_exactly_on_the_ceiling_is_disregarded
          rationale: "That §1.8 instance sits the goods-and-services value exactly on the token-benefit ceiling and asserts the disregard applies at the boundary and stops one cent past it."

  - section: consistency_model
    instances:
      - name: every_derived_figure_is_already_current_in_the_next_read_after_the_write
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.net_proceeds_rollup
        distinguishing_aspect: "The declared model is immediate, so no read in this recipe is preceded by a settling step: the write's own response already carries the new status, and the very next read of the parent outing already carries every figure recomputed from it - twice over, from two unrelated revenue channels, with the second read proving the rollup was re-derived rather than incremented once and cached."
        test_recipe:
          setup:
            - "An OPEN outing whose contract bills 9500 per player with no guarantee and no food and beverage minimum, holding one TEAM4 tier priced 120000 for 4 slots."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TournamentDirector
            - call: "POST /outing-ops/outings"
              payload: { name: "Immediate Rollup Open", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 4, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { o_id: $.data.id }
            - call: "POST /outing-ops/contracts"
              payload: { outing_id: "${o_id}", course_name: "Cedar Ridge GC", rate_per_player_cents: 9500, guaranteed_player_count: 0, fnb_minimum_cents: 0 }
              as: CourseOperations
              captures: { c_id: $.data.id }
            - call: "POST /outing-ops/contracts/${c_id}/lifecycle"
              payload: { action: "SIGN" }
              as: CourseOperations
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "TEAM4", kind: "TEAM", price_cents: 120000, player_slots: 4, gsv_cents: 0, inventory_cap: 4 }
              as: TournamentDirector
              captures: { t_id: $.data.id }
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "OPEN_REGISTRATION" }
              as: TournamentDirector
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${t_id}", buyer_name: "Immediate Buyer", player_count: 4 }
              as: TournamentDirector
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /outing-ops/registrations/${r_id}/payment"
              payload: { amount_cents: 120000 }
              as: CharityTreasurer
              captures: { pay_status: $.data.status, pay_amount: $.data.amount_paid_cents, pay_at: $.data.confirmed_at }
            - call: "GET /outing-ops/outings/${o_id}"
              as: CharityTreasurer
              captures: { slots1: $.data.confirmed_player_slots, gross1: $.data.gross_revenue_cents, charge1: $.data.course_charge_cents, fee1: $.data.admin_fee_cents, net1: $.data.net_proceeds_cents }
            - call: "GET /outing-ops/outings/${o_id}/proceeds-report"
              as: Beneficiary
              captures: { rep_gross1: $.data.gross_revenue_cents, rep_net1: $.data.net_proceeds_cents }
            - call: "POST /outing-ops/fundraising-items"
              payload: { outing_id: "${o_id}", item_type: "DONATION", description: "Matching gift pledge", fmv_cents: 0, ask_cents: 50000 }
              as: CharityTreasurer
              captures: { i_id: $.data.id }
            - call: "POST /outing-ops/fundraising-items/${i_id}/sale"
              payload: { buyer_registration_id: "${r_id}", bid_cents: 50000 }
              as: CharityTreasurer
            - call: "POST /outing-ops/fundraising-items/${i_id}/payment"
              payload: { amount_cents: 50000 }
              as: CharityTreasurer
              captures: { item_status: $.data.status }
            - call: "GET /outing-ops/outings/${o_id}"
              as: CharityTreasurer
              captures: { gross2: $.data.gross_revenue_cents, charge2: $.data.course_charge_cents, fee2: $.data.admin_fee_cents, net2: $.data.net_proceeds_cents }
          assert:
            - "the payment response itself already carries ${pay_status} == 'CONFIRMED', ${pay_amount} == 120000 and ${pay_at} == '2026-08-01T00:00:00Z' - the confirmation is not deferred to a later read"
            - "the immediately following outing read carries ${slots1} == 4, ${gross1} == 120000, ${charge1} == 38000 (4 billable players * 9500, the guarantee being 0), ${fee1} == 6000 (round_half_up(0.05 * 120000), the 5 percent band applying because before-fee proceeds 82000 are under 2000000) and ${net1} == 76000"
            - "GET /outing-ops/package-tiers/${t_id} reads sold_count == 1 in that same first read wave - the tier counter needed no settling step either"
            - "${rep_gross1} == 120000 and ${rep_net1} == 76000 - the beneficiary's report agrees with the outing row to the cent on the first read, so nothing lags behind"
            - "${item_status} == 'PAID' in the payment response itself"
            - "the second outing read carries ${gross2} == 170000, ${charge2} == 38000 (unchanged - a donation adds no golfers), ${fee2} == 8500 (round_half_up(0.05 * 170000)) and ${net2} == 123500 (170000 - 38000 - 8500)"
            - "${net2} - ${net1} == 47500, which is 50000 of new revenue less the 2500 of extra administrative fee - the rollup was re-derived from the whole input set rather than incremented by the raw 50000"
