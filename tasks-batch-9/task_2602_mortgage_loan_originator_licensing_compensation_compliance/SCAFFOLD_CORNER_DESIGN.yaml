      - name: advertisement_withdraw_allowed_from_submitted_but_not_from_draft
        claim_type: conditional_action
        grounds:
          - endpoints[POST /advertisements/{id}/withdraw]
          - state_machines.Advertisement.PUBLISHED_to_WITHDRAWN
          - validations[priority=11]
        distinguishing_aspect: |
          Compliance withdrawal is conditional on status IN {SUBMITTED, APPROVED, PUBLISHED}:
          from DRAFT it returns 409 ERR_INVALID_STATE_TRANSITION, from SUBMITTED it succeeds
          without any review having happened (reviewed_by_user_id stays null), and a repeat
          withdrawal on the now-terminal row returns 409 ERR_ALREADY_TERMINAL.
        test_recipe:
          setup:
            - "Originator 2200001 with two WEB advertisements: ad D left in DRAFT, ad S
               submitted (status SUBMITTED, never reviewed)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
