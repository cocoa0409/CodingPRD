scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: service_change_quote_vs_final_after_rate_notice
        grounds:
          - calculations.calc_service_change_quote
          - calculations.calc_monthly_invoice
          - state_machines.RateAdjustmentNotice.SCHEDULED_to_APPLIED
          - state_machines.ServiceChangeRequest.APPROVED_to_APPLIED
        distinguishing_aspect: |
          Same line, same requested change: the quote variant (computed at request
          creation on the pre-notice base 400000) yields 550000 while the final
          variant (computed at apply on the post-notice base 420000) yields 577500 —
          two valid evaluation moments of one formula on the ServiceChange domain.
        test_recipe:
          setup:
            - "Clock 2026-09-01; customer CU1; contract start 2026-09-01, 24mo; one line CY_4 4x/wk @ 400000; contract ACTIVE (version 2 after line add + activate: create=1, line add=2, activate=3)"
            - "Rate notice +5% effective 2026-09-10; applied by clock advance -> line rate 420000"
            - "Service change requested (4x -> 5x upgrade) effective 2026-09-05, quoting on base 400000 -> quoted_new_rate_cents = round_half_up(400000/4*5*1.10) = 550000"
            - "Approved before notice applies; applied after notice applies -> final = round(420000/4*5*1.10) = 577500"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/customers"
              payload: { legal_name: "Acme Manufacturing", billing_email: "ap@acme.example" }
              as: PlatformAdmin
              captures: { cu1: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_id: "${cu1}", start_date: "2026-09-01T00:00:00Z", term_months: 24 }
              as: OpsManager
              captures: { ct1: $.data.id }
            - call: "POST /api/contracts/${ct1}/service-lines"
              payload: { container_size: CY_4, frequency_per_week: 4, base_rate_cents: 400000 }
              as: OpsManager
              captures: { sl1: $.data.id }
            - call: "POST /api/contracts/${ct1}/activate"
              payload: {}
              as: OpsManager
            - call: "POST /api/service-change-requests"
              payload: { service_line_id: "${sl1}", new_container_size: CY_4, new_frequency_per_week: 5, effective_date: "2026-09-05T00:00:00Z" }
              as: Customer
              as_user_id: "${cu1}"
              captures: { sc1: $.data.id }
            - call: "POST /api/service-changes/${sc1}/approve"
              payload: {}
              as: OpsManager
            - call: "POST /api/rate-notices"
              payload: { contract_id: "${ct1}", reason: CPI, pct_increase: 0.05, effective_date: "2026-09-10T00:00:00Z" }
              as: OpsManager
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/contracts/${ct1}"
              payload: {}
              as: OpsManager
              captures: { ct1_v: $.data.version }
          trigger:
            - call: "POST /api/service-changes/${sc1}/apply"
              payload: { expected_contract_version: "${ct1_v}" }
              as: OpsManager
          assert:
            - "ServiceChangeRequest.${sc1}.quoted_new_rate_cents == 550000"
            - "ServiceChangeRequest.${sc1}.final_applied_rate_cents == 577500"
            - "ContractServiceLine.${sl1}.base_rate_cents == 577500"
      - name: ld_amount_timely_vs_untimely_same_contract
        grounds:
          - calculations.calc_ld_amount
          - state_machines.Contract.ACTIVE_to_TERMINATED
          - state_machines.Contract.ACTIVE_to_TERMINATION_PENDING
        distinguishing_aspect: |
          Identical contract (end 2027-09-01, notice 60d, base 300000): a request with
          requested_end_date 2027-07-03 (timely) yields ld_total_cents 0 and straight
          TERMINATED, while requested_end_date 2027-07-04 (untimely) yields
          months_remaining 2 and ld_total_cents 300000 — same formula, two valid
          date interpretations with a $3000 delta on the Cancellation domain.
        test_recipe:
          setup:
            - "Clock 2026-09-01; two customers, each with an identical ACTIVE contract: start 2026-09-01, 24mo (end 2027-09-01), notice 60d, one line @ 300000"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/customers"
              payload: { legal_name: "Timely Corp", billing_email: "t@x.example" }
              as: PlatformAdmin
              captures: { cuA: $.data.id }
            - call: "POST /api/customers"
              payload: { legal_name: "Untimely Corp", billing_email: "u@x.example" }
              as: PlatformAdmin
              captures: { cuB: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_id: "${cuA}", start_date: "2026-09-01T00:00:00Z", term_months: 24, cancellation_notice_days: 60 }
              as: OpsManager
              captures: { ctA: $.data.id }
            - call: "POST /api/contracts/${ctA}/service-lines"
              payload: { container_size: CY_4, frequency_per_week: 4, base_rate_cents: 300000 }
              as: OpsManager
            - call: "POST /api/contracts/${ctA}/activate"
              payload: {}
              as: OpsManager
            - call: "POST /api/contracts"
              payload: { customer_id: "${cuB}", start_date: "2026-09-01T00:00:00Z", term_months: 24, cancellation_notice_days: 60 }
              as: OpsManager
              captures: { ctB: $.data.id }
            - call: "POST /api/contracts/${ctB}/service-lines"
              payload: { container_size: CY_4, frequency_per_week: 4, base_rate_cents: 300000 }
              as: OpsManager
            - call: "POST /api/contracts/${ctB}/activate"
              payload: {}
              as: OpsManager
            - call: "POST /api/cancellation-requests"
              payload: { contract_id: "${ctA}", requested_end_date: "2027-07-03T00:00:00Z" }
              as: Customer
              as_user_id: "${cuA}"
              captures: { cxA: $.data.id }
            - call: "POST /api/cancellation-requests"
              payload: { contract_id: "${ctB}", requested_end_date: "2027-07-04T00:00:00Z" }
              as: Customer
              as_user_id: "${cuB}"
              captures: { cxB: $.data.id }
          trigger:
            - call: "POST /api/cancellation-requests/${cxA}/approve"
              payload: {}
              as: OpsManager
            - call: "POST /api/cancellation-requests/${cxB}/approve"
              payload: {}
              as: OpsManager
          assert:
            - "CancellationRequest.${cxA}.timely == true and ld_total_cents == 0"
            - "Contract.${ctA}.status == TERMINATED"
            - "Customer.${cuA}.credit_balance_cents == 0"
            - "CancellationRequest.${cxB}.timely == false and months_remaining == 2 and ld_total_cents == 300000"
            - "Contract.${ctB}.status == TERMINATION_PENDING"
            - "Customer.${cuB}.credit_balance_cents == -300000"
  - rule_id: combinatorial_formula
    instances:
      - name: monthly_invoice_per_component_rounding_then_sum
        grounds:
          - calculations.calc_monthly_invoice
        distinguishing_aspect: |
          Mode (b) nested rounding: base 33333 with FIXED fuel 0.13, env 0.07, admin
          0.05 rounds each component (4333.29->4333, 2333.31->2333, 1666.65->1667)
          before summing to 41666; summing unrounded values then rounding would give
          41667 — the per-component-then-sum order is pinned.
        test_recipe:
          setup:
            - "Clock 2026-09-01; FIXED surcharge config (fuel 0.13, env 0.07, admin 0.05) effective 2026-09-01; ACTIVE contract with one line @ 33333; no events, no credits"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/surcharge-configs"
              payload: { fuel_mode: FIXED, fuel_fixed_pct: 0.13, environmental_pct: 0.07, admin_pct: 0.05, contamination_fee_cents: 15000, overweight_fee_cents: 20000, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/customers"
              payload: { legal_name: "Round Test Co", billing_email: "r@x.example" }
              as: PlatformAdmin
              captures: { cu1: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_id: "${cu1}", start_date: "2026-09-01T00:00:00Z", term_months: 12 }
              as: OpsManager
              captures: { ct1: $.data.id }
            - call: "POST /api/contracts/${ct1}/service-lines"
              payload: { container_size: CY_2, frequency_per_week: 2, base_rate_cents: 33333 }
              as: OpsManager
            - call: "POST /api/contracts/${ct1}/activate"
              payload: {}
              as: OpsManager
          trigger:
            - call: "GET /api/contracts/${ct1}/monthly-invoice"
              payload: {}
              as: OpsManager
              captures: { inv_base: $.data.base_cents, inv_fuel: $.data.fuel_cents, inv_env: $.data.env_cents, inv_admin: $.data.admin_cents, inv_total: $.data.total_cents }
          assert:
            - "invoice.base_cents == 33333"
            - "invoice.fuel_cents == 4333 and invoice.env_cents == 2333 and invoice.admin_cents == 1667"
            - "invoice.fees_cents == 0 and invoice.credits_cents == 0"
            - "invoice.total_cents == 41666 (not 41667)"
      - name: rofr_match_proportional_allocation_with_remainder
        grounds:
          - calculations.calc_rofr_match
          - state_machines.CompetingOffer.SUBMITTED_to_MATCHED
          - concurrency_rules[offer-match-stale-contract]
        distinguishing_aspect: |
          Mode (a) non-linear allocation: matched rate 85001 = 85501-500 allocated
          proportionally over three lines (50000/30000/10000 of total 90000) gives
          47223+28334+9445 = 85002, one cent over; the pinned waterfall order
          (rate DESC, created_at ASC) and remainder rule make the largest line
          absorb the -1 remainder -> 47222, and the new contract total is exactly
          85001 (not the naive rounded sum 85002).
        test_recipe:
          setup:
            - "Clock 2026-09-01; ACTIVE contract (rofr_enabled, window 15d) with lines L1 50000, L2 30000, L3 10000 (total 90000); competing offer 85501 submitted"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/customers"
              payload: { legal_name: "Match Co", billing_email: "m@x.example" }
              as: PlatformAdmin
              captures: { cu1: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_id: "${cu1}", start_date: "2026-09-01T00:00:00Z", term_months: 12, rofr_enabled: true, rofr_window_days: 15 }
              as: OpsManager
              captures: { ct1: $.data.id }
            - call: "POST /api/contracts/${ct1}/service-lines"
              payload: { container_size: CY_8, frequency_per_week: 5, base_rate_cents: 50000 }
              as: OpsManager
              captures: { sl1: $.data.id }
            - call: "POST /api/contracts/${ct1}/service-lines"
              payload: { container_size: CY_6, frequency_per_week: 3, base_rate_cents: 30000 }
              as: OpsManager
              captures: { sl2: $.data.id }
            - call: "POST /api/contracts/${ct1}/service-lines"
              payload: { container_size: CY_2, frequency_per_week: 1, base_rate_cents: 10000 }
              as: OpsManager
              captures: { sl3: $.data.id }
            - call: "POST /api/contracts/${ct1}/activate"
              payload: {}
              as: OpsManager
            - call: "POST /api/competing-offers"
              payload: { contract_id: "${ct1}", competitor_monthly_cents: 85501, evidence_doc_url: "https://docs.example/offer.pdf" }
              as: Customer
              as_user_id: "${cu1}"
              captures: { of1: $.data.id }
            - call: "GET /api/contracts/${ct1}"
              payload: {}
              as: OpsManager
              captures: { ct1_v: $.data.version }
          trigger:
            - call: "POST /api/competing-offers/${of1}/match"
              payload: { expected_contract_version: "${ct1_v}" }
              as: OpsManager
          assert:
            - "CompetingOffer.${of1}.status == MATCHED"
            - "ContractServiceLine.${sl1}.base_rate_cents == 47222"
            - "ContractServiceLine.${sl2}.base_rate_cents == 28334"
            - "ContractServiceLine.${sl3}.base_rate_cents == 9445"
            - "Contract.${ct1}.base_monthly_total_cents == 85001"
  - rule_id: non_linear_state_machine
    instances:
      - name: pickup_dispute_redispute_cycle
        grounds:
          - state_machines.PickupEvent.NONE_to_DISPUTED
          - state_machines.PickupEvent.DISPUTED_to_RESOLVED_UPHELD
          - state_machines.PickupEvent.RESOLVED_UPHELD_to_DISPUTED
        distinguishing_aspect: |
          PickupEvent machine is cyclic (NONE->DISPUTED->RESOLVED_UPHELD->DISPUTED
          once, appeal_count cap 1); a second re-dispute after the second uphold is
          rejected — cycle with a bounded loop count on the pickup domain.
        test_recipe:
          setup:
            - "Clock 2026-09-01; FIXED config effective 2026-09-01 (contamination fee 15000); ACTIVE contract with line; one CONTAMINATED pickup on 2026-09-02 with photo"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/surcharge-configs"
              payload: { fuel_mode: FIXED, fuel_fixed_pct: 0.10, environmental_pct: 0.10, admin_pct: 0.05, contamination_fee_cents: 15000, overweight_fee_cents: 20000, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/customers"
              payload: { legal_name: "Cycle Co", billing_email: "c@x.example" }
              as: PlatformAdmin
              captures: { cu1: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_id: "${cu1}", start_date: "2026-09-01T00:00:00Z", term_months: 12 }
              as: OpsManager
              captures: { ct1: $.data.id }
            - call: "POST /api/contracts/${ct1}/service-lines"
              payload: { container_size: CY_4, frequency_per_week: 3, base_rate_cents: 200000 }
              as: OpsManager
              captures: { sl1: $.data.id }
            - call: "POST /api/contracts/${ct1}/activate"
              payload: {}
              as: OpsManager
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/pickup-events"
              payload: { service_line_id: "${sl1}", occurred_date: "2026-09-02", outcome: CONTAMINATED, photo_evidence_url: "https://img.example/p1.jpg" }
              as: HaulerAgent
              captures: { ev1: $.data.id }
          trigger:
            - call: "POST /api/pickup-events/${ev1}/dispute"
              payload: {}
              as: Customer
              as_user_id: "${cu1}"
            - call: "POST /api/pickup-events/${ev1}/resolve-dispute"
              payload: { resolution: UPHELD }
              as: OpsManager
            - call: "POST /api/pickup-events/${ev1}/dispute"
              payload: {}
              as: Customer
              as_user_id: "${cu1}"
            - call: "POST /api/pickup-events/${ev1}/resolve-dispute"
              payload: { resolution: UPHELD }
              as: OpsManager
            - call: "POST /api/pickup-events/${ev1}/dispute"
              payload: {}
              as: Customer
              as_user_id: "${cu1}"
              captures: { err1: $.data.error_id }
          assert:
            - "after trigger steps 1-4: PickupEvent.${ev1}.dispute_status == RESOLVED_UPHELD and appeal_count == 1"
            - "final dispute rejected with ERR_INVALID_STATE (appeal_count cap reached)"
            - "PickupEvent.${ev1}.contamination_fee_cents == 15000 (unchanged throughout the cycle)"
      - name: rolloff_cancellation_return_to_reservable_cycle
        grounds:
          - state_machines.RolloffOrder.RESERVED_to_DELIVERED
          - state_machines.RolloffOrder.RESERVED_to_CANCELLED
          - state_machines.Contract.TERMINATED_to_ACTIVE
        distinguishing_aspect: |
          Contract machine contains a cycle TERMINATED->ACTIVE (reinstate when now <
          end_date), distinct entity from PickupEvent: a timely-cancelled contract can
          be brought back to ACTIVE, and the reinstatement precondition depends on the
          logical clock relative to end_date.
        test_recipe:
          setup:
            - "Clock 2026-09-01; ACTIVE contract start 2026-09-01, 12mo (end 2027-09-01), notice 60d, one line @ 200000; timely cancellation (requested_end 2026-11-01 <= end-60d) approved -> contract TERMINATED with ld 0"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/customers"
              payload: { legal_name: "Reinstate Co", billing_email: "ri@x.example" }
              as: PlatformAdmin
              captures: { cu1: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_id: "${cu1}", start_date: "2026-09-01T00:00:00Z", term_months: 12, cancellation_notice_days: 60 }
              as: OpsManager
              captures: { ct1: $.data.id }
            - call: "POST /api/contracts/${ct1}/service-lines"
              payload: { container_size: CY_4, frequency_per_week: 2, base_rate_cents: 200000 }
              as: OpsManager
            - call: "POST /api/contracts/${ct1}/activate"
              payload: {}
              as: OpsManager
            - call: "POST /api/cancellation-requests"
              payload: { contract_id: "${ct1}", requested_end_date: "2026-11-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cu1}"
              captures: { cx1: $.data.id }
            - call: "POST /api/cancellation-requests/${cx1}/approve"
              payload: {}
              as: OpsManager
          trigger:
            - call: "POST /api/contracts/${ct1}/reinstate"
              payload: {}
              as: OpsManager
          assert:
            - "Contract.${ct1}.status transitioned TERMINATED -> ACTIVE (cycle closed)"
            - "Contract.${ct1}.end_date unchanged at 2027-09-01T00:00:00Z"
            - "CancellationRequest.${cx1}.ld_total_cents == 0 and Customer.${cu1}.credit_balance_cents == 0"
  - rule_id: transitive_cascade
    instances:
      - name: cancellation_approval_four_hop_cascade
        grounds:
          - state_machines.Contract.ACTIVE_to_TERMINATION_PENDING
          - state_machines.RateAdjustmentNotice.SCHEDULED_to_CANCELLED
          - state_machines.ServiceChangeRequest.APPROVED_to_CANCELLED
          - state_machines.CompetingOffer.SUBMITTED_to_VOID
          - calculations.calc_customer_credit_balance
        distinguishing_aspect: |
          Depth-4 cascade: approving an untimely cancellation mutates the Contract,
          whose transition cancels a SCHEDULED RateAdjustmentNotice AND an APPROVED
          ServiceChangeRequest AND voids a SUBMITTED CompetingOffer, while the LD
          assessment mutates Customer.credit_balance_cents — one approval, four
          entity types changed, each hop caused by the previous transition.
        test_recipe:
          setup:
            - "Clock 2026-09-01; ACTIVE contract (rofr_enabled, 24mo, notice 60d) with one line @ 300000; a SCHEDULED rate notice (effective 2026-09-20); an APPROVED service change; a SUBMITTED competing offer; untimely cancellation filed (requested_end 2027-07-04)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/customers"
              payload: { legal_name: "Cascade Co", billing_email: "cs@x.example" }
              as: PlatformAdmin
              captures: { cu1: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_id: "${cu1}", start_date: "2026-09-01T00:00:00Z", term_months: 24, cancellation_notice_days: 60, rofr_enabled: true }
              as: OpsManager
              captures: { ct1: $.data.id }
            - call: "POST /api/contracts/${ct1}/service-lines"
              payload: { container_size: CY_6, frequency_per_week: 3, base_rate_cents: 300000 }
              as: OpsManager
              captures: { sl1: $.data.id }
            - call: "POST /api/contracts/${ct1}/activate"
              payload: {}
              as: OpsManager
            - call: "POST /api/rate-notices"
              payload: { contract_id: "${ct1}", reason: CPI, pct_increase: 0.04, effective_date: "2026-09-20T00:00:00Z" }
              as: OpsManager
              captures: { rn1: $.data.id }
            - call: "POST /api/service-change-requests"
              payload: { service_line_id: "${sl1}", new_container_size: CY_6, new_frequency_per_week: 4, effective_date: "2026-09-10T00:00:00Z" }
              as: Customer
              as_user_id: "${cu1}"
              captures: { sc1: $.data.id }
            - call: "POST /api/service-changes/${sc1}/approve"
              payload: {}
              as: OpsManager
            - call: "POST /api/competing-offers"
              payload: { contract_id: "${ct1}", competitor_monthly_cents: 280000, evidence_doc_url: "https://docs.example/o.pdf" }
              as: Customer
              as_user_id: "${cu1}"
              captures: { of1: $.data.id }
            - call: "POST /api/cancellation-requests"
              payload: { contract_id: "${ct1}", requested_end_date: "2027-07-04T00:00:00Z" }
              as: Customer
              as_user_id: "${cu1}"
              captures: { cx1: $.data.id }
          trigger:
            - call: "POST /api/cancellation-requests/${cx1}/approve"
              payload: {}
              as: OpsManager
          assert:
            - "Contract.${ct1}.status == TERMINATION_PENDING"
            - "RateAdjustmentNotice.${rn1}.status == CANCELLED"
            - "ServiceChangeRequest.${sc1}.status == CANCELLED"
            - "CompetingOffer.${of1}.status == VOID"
            - "CancellationRequest.${cx1}.ld_total_cents == 300000 (months_remaining 2 x 300000 x 0.5)"
            - "Customer.${cu1}.credit_balance_cents == -300000"
      - name: dispute_credited_cancels_credit_recomputes_balance
        grounds:
          - state_machines.PickupEvent.DISPUTED_to_RESOLVED_CREDITED
          - calculations.calc_customer_credit_balance
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger: resolve-dispute(CREDITED) on the
          PickupEvent flips the linked ServiceCredit ACTIVE->CANCELLED, and that
          credit cancellation recomputes Customer.credit_balance_cents downward by
          exactly credit_cents (30000) — event -> credit -> customer chain.
        test_recipe:
          setup:
            - "Clock 2026-09-01; FIXED config (admin_pct 0.05) effective 2026-09-01; ACTIVE contract, line @ 600000; MISSED pickup 2026-09-02; service credit filed 2026-09-03 (credit 30000 = floor(600000*0.05)); an unrelated OVERWEIGHT event 2026-09-02 with photo sits undisputed; customer balance stands at +30000 before the dispute"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/surcharge-configs"
              payload: { fuel_mode: FIXED, fuel_fixed_pct: 0.10, environmental_pct: 0.10, admin_pct: 0.05, contamination_fee_cents: 15000, overweight_fee_cents: 20000, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/customers"
              payload: { legal_name: "Credit Co", billing_email: "cr@x.example" }
              as: PlatformAdmin
              captures: { cu1: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_id: "${cu1}", start_date: "2026-09-01T00:00:00Z", term_months: 12 }
              as: OpsManager
              captures: { ct1: $.data.id }
