              payload: { client_id: "${c_id}", order_reference: "ORD-CC5", customer_reference: "CUST-CC5", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 1, reason_code: "DEFECTIVE" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_line_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/issue"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /receipts"
              payload: { rma_id: "${rma_id}", tracking_reference: "TRK-CC5", gross_weight_grams: 1400 }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { rcpt_id: $.data.id }
            - call: "POST /receipts/${rcpt_id}/lines"
              payload: { rma_line_id: "${rma_line_id}", quantity: 1, reason_code: "DEFECTIVE" }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { rl_id: $.data.id }
            - call: "POST /return-lines/${rl_id}/grade"
              payload: { condition_grade: "C" }
              as: GradingInspector
              as_user_id: "u_grader"
              captures: { rl_ver: $.data.version }
            - call: "POST /disposition-orders"
              payload: { return_line_id: "${rl_id}", expected_return_line_version: "${rl_ver}", channel_id: "${ch_id}", disposition: "LIQUIDATE", channel_window_start_at: "2026-08-03T08:00:00Z", channel_window_end_at: "2026-08-03T12:00:00Z" }
              as: DispositionSupervisor
              as_user_id: "u_super"
              captures: { do_id: $.data.id }
            - call: "POST /disposition-orders/${do_id}/approve"
              payload: {}
              as: DispositionSupervisor
              as_user_id: "u_super"
          trigger:
            - call: "POST /disposition-orders/${do_id}/execute"
              payload: {}
              as: DispositionSupervisor
              as_user_id: "u_super2"
              captures: { do_status: $.data.status, executed_by: $.data.executed_by_user_id, executed_at: $.data.executed_at }
          assert:
            - "The execute response itself already carries do_status == EXECUTED, executed_by == u_super2 and executed_at == 2026-08-01T00:00:00Z — the logical clock value, so the write is stamped, not queued"
            - "The immediately following GET /return-lines/${rl_id} shows disposition_state == DISPOSITIONED, financial_state == RELEASE_PENDING and recovery_value_cents == 5904, with no intermediate PENDING_DISPOSITION reading ever observable"
            - "The immediately following GET /return-authorizations/${rma_id} shows status == CLOSED, because the RMA's only line is dispositioned — cascade link 5 needs no sweep or second call"
            - "The immediately following GET /shrink-ledger-entries?client_id=${c_id} returns total_count == 1 with amount_cents == 5461, and GET /clients/${c_id} shows units_dispositioned == 1, units_reserved_for_disposition == 0, units_in_process == 0 and settlement_balance_cents == 5461"
