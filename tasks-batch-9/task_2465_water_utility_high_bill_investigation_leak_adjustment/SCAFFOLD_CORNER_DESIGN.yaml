            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-06-30", read_type: "ACTUAL", reading_value: 141000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-07-31", read_type: "ACTUAL", reading_value: 181204 }
              as: MeterTechnician
          trigger:
            - call: "POST /bills"
