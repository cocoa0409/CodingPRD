      - name: lock_scope_requires_at_least_one_scope_area
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Examination
          - validations[priority 30 ERR_INVALID_REQUEST]
          - endpoints[POST /market-conduct/examinations/{id}/lock-scope]
        distinguishing_aspect: |
          The SCOPING -> DATA_CALL guard is a cardinality guard, not a state guard: locking an
          examination whose scope_area_count is 0 fails 422 ERR_INVALID_REQUEST (not a 409), the
          examination stays in SCOPING with scope_locked false, and the very same call succeeds once one
          area exists.
