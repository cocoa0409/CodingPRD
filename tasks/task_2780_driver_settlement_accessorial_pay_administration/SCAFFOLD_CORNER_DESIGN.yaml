          rationale: "That instance already walks the two buckets in order under a binding cap and asserts the per-advance take, the leftover outstanding and the pinned provisional-net evaluation order."
      - name: retro_correction_projects_the_recomputed_pay_as_a_signed_delta
        claim_type: projection
