# §1.9 Scaffold Corner Design (breadth probe).
# Taxonomy is taken verbatim from references/claim-extraction-guide.md: the nine section names are
# the `section:` values and the per-section table rows are the `claim_type:` values. Nothing here
# adds behaviour to SCAFFOLD.yaml — deleting this file leaves the declared contract identical.
# The logical clock starts at the mandated server default 2026-08-01T00:00:00Z; any chain that needs
# another instant calls POST /_clock/set_current_utc explicitly.
# Every numeric assertion was produced by executing the relevant §1.3 formula with its constants.
scaffold_corner_design:
  - section: entities
    instances:
      - name: reporting_cycle_creation_returns_the_full_computed_and_system_field_set
        claim_type: creation
        grounds:
          - entities.ReportingCycle
          - entities.ReportingCycle.fields.statutory_deadline_utc
          - entities.ReportingCycle.fields.internal_target_utc
          - entities.ReportingCycle.fields.min_slack_days_calendar
          - entities.ReportingCycle.fields.min_slack_days_business
          - entities.ReportingCycle.fields.total_assigned_scope_weight
          - entities.ReportingCycle.fields.certification_coverage_pct
          - entities.ReportingCycle.fields.open_material_event_count
          - entities.ReportingCycle.fields.unresolved_deficiency_weight
          - calculations.statutory_deadline_resolution
          - endpoints["POST /disclosure/reporting-cycles"]
        distinguishing_aspect: |
          A single POST with all required inputs returns 201 and every declared field already
          populated: the two computed instants (2026-08-10T17:30:00Z / 2026-08-05T17:30:00Z), both
          slack fields at the empty-set sentinel 9999, the three aggregates at 0.00 / 0.00 / 0,
          open_material_event_count 0, status PLANNING, restatement_stage NONE and version 1. No
          second read is required to observe them.
        test_recipe:
          setup:
            - "One ADOPTED charter (min_quorum_count 1, required_functions [FINANCE]) with a single ACTIVE voting FINANCE member."
            - "No ReportingCycle exists yet; the logical clock sits at the server default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Q2 Disclosure Committee Charter", version_label: "2026.1", min_quorum_count: 1, required_functions: ["FINANCE"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${fin_id}"
          trigger:
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { cycle_id: $.data.id, cycle_v: $.data.version }
          assert:
            - "HTTP 201 and response_type == \"object\""
            - "ReportingCycle.${cycle_id}.fiscal_period_label == \"FY2026-Q2\""
            - "ReportingCycle.${cycle_id}.form_type == FORM_10Q"
            - "ReportingCycle.${cycle_id}.filer_status == LARGE_ACCELERATED"
            - "ReportingCycle.${cycle_id}.charter_id == \"${charter_id}\""
            - "ReportingCycle.${cycle_id}.statutory_deadline_utc == \"2026-08-10T17:30:00Z\""
            - "ReportingCycle.${cycle_id}.internal_target_utc == \"2026-08-05T17:30:00Z\""
            - "ReportingCycle.${cycle_id}.status == PLANNING"
            - "ReportingCycle.${cycle_id}.restatement_stage == NONE"
            - "ReportingCycle.${cycle_id}.min_slack_days_calendar == 9999"
            - "ReportingCycle.${cycle_id}.min_slack_days_business == 9999"
            - "ReportingCycle.${cycle_id}.total_assigned_scope_weight == 0.00"
            - "ReportingCycle.${cycle_id}.certification_coverage_pct == 0.00"
            - "ReportingCycle.${cycle_id}.open_material_event_count == 0"
            - "ReportingCycle.${cycle_id}.unresolved_deficiency_weight == 0.00"
            - "ReportingCycle.${cycle_id}.version == 1"

      - name: charter_retrieval_returns_stored_input_plus_recomputed_membership_rollups
        claim_type: retrieval
        grounds:
          - entities.DisclosureCommitteeCharter.fields.active_voting_member_count
          - entities.DisclosureCommitteeCharter.fields.covered_functions
          - entities.DisclosureCommitteeCharter.fields.adopted_at_utc
          - endpoints["GET /disclosure/charters/{id}"]
          - state_machines.DisclosureCommitteeCharter.DRAFT_to_ADOPTED
        distinguishing_aspect: |
          GET /disclosure/charters/{id} returns the stored row: name, version_label, min_quorum_count
          and required_functions exactly as supplied, plus the two computed rollups derived from the
          three seats (active_voting_member_count == 2 because the OPERATIONS seat is non-voting, and
          covered_functions == [FINANCE, LEGAL, OPERATIONS] sorted ascending) and adopted_at_utc
          stamped from the logical clock at ADOPT.
        test_recipe:
          setup:
            - "One charter with min_quorum_count 2 and required_functions [FINANCE, LEGAL]."
            - "Three members: a voting FINANCE seat, a voting LEGAL seat and a NON-voting OPERATIONS seat."
            - "The charter has been ADOPTED at the default clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Q2 Disclosure Committee Charter", version_label: "2026.1", min_quorum_count: 2, required_functions: ["FINANCE", "LEGAL"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Owen Legal", function: "LEGAL", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { legal_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Pia Ops", function: "OPERATIONS", is_officer: false, voting: false }
              as: ComplianceAdmin
              captures: { ops_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
          trigger:
            - call: "GET /disclosure/charters/${charter_id}"
              payload: {}
              as: ComplianceAdmin
          assert:
            - "HTTP 200 and response_type == \"object\""
            - "DisclosureCommitteeCharter.${charter_id}.name == \"Q2 Disclosure Committee Charter\""
            - "DisclosureCommitteeCharter.${charter_id}.version_label == \"2026.1\""
            - "DisclosureCommitteeCharter.${charter_id}.min_quorum_count == 2"
            - "DisclosureCommitteeCharter.${charter_id}.required_functions == [\"FINANCE\", \"LEGAL\"]"
            - "DisclosureCommitteeCharter.${charter_id}.status == ADOPTED"
            - "DisclosureCommitteeCharter.${charter_id}.adopted_at_utc == \"2026-08-01T00:00:00Z\""
            - "DisclosureCommitteeCharter.${charter_id}.active_voting_member_count == 2"
            - "DisclosureCommitteeCharter.${charter_id}.covered_functions == [\"FINANCE\", \"LEGAL\", \"OPERATIONS\"]"
            - "DisclosureCommitteeCharter.${charter_id}.superseded_by_charter_id == null"

      - name: committee_member_listing_paginates_and_filters_by_charter_id
        claim_type: listing
        grounds:
          - endpoints["GET /disclosure/committee-members"]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - entities.CommitteeMember.fields.charter_id
        distinguishing_aspect: |
          With three seats on charter A and one on charter B, GET /disclosure/committee-members with
          charter_id == A, limit 2, offset 0 returns exactly 2 rows with total_count 3 and
          has_more true; the same filter at offset 2 returns exactly 1 row with has_more false. The
          charter B seat never appears under either page, so the filter and the window compose.
        test_recipe:
          setup:
            - "Charter A carries three ACTIVE members (FINANCE, LEGAL, OPERATIONS); charter B carries one ACTIVE FINANCE member."
            - "Neither charter needs to be ADOPTED — member creation is not gated on charter status."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Charter A", version_label: "A-1", min_quorum_count: 1, required_functions: ["FINANCE"] }
              as: ComplianceAdmin
              captures: { charter_a_id: $.data.id }
            - call: "POST /disclosure/charters"
              payload: { name: "Charter B", version_label: "B-1", min_quorum_count: 1, required_functions: ["FINANCE"] }
              as: ComplianceAdmin
              captures: { charter_b_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_a_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { a_fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_a_id}/members"
              payload: { full_name: "Owen Legal", function: "LEGAL", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { a_legal_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_a_id}/members"
              payload: { full_name: "Pia Ops", function: "OPERATIONS", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { a_ops_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_b_id}/members"
              payload: { full_name: "Quin Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { b_fin_id: $.data.id }
          trigger:
            - call: "GET /disclosure/committee-members"
              payload: { charter_id: "${charter_a_id}", limit: 2, offset: 0 }
              as: ComplianceAdmin
            - call: "GET /disclosure/committee-members"
              payload: { charter_id: "${charter_a_id}", limit: 2, offset: 2 }
              as: ComplianceAdmin
          assert:
            - "HTTP 200 and response_type == \"array\" on both calls"
            - "first call returns exactly 2 CommitteeMember rows, limit == 2, offset == 0, total_count == 3, has_more == true"
            - "second call returns exactly 1 CommitteeMember row, limit == 2, offset == 2, total_count == 3, has_more == false"
            - "CommitteeMember.${b_fin_id} appears in neither page"
            - "every returned row has charter_id == \"${charter_a_id}\""

      - name: path_ids_that_match_no_row_return_the_entity_specific_not_found_code
        claim_type: not_found
        grounds:
          - validations[priority=6]
          - errors[ERR_CHARTER_NOT_FOUND]
          - errors[ERR_MEMBER_NOT_FOUND]
          - errors[ERR_CYCLE_NOT_FOUND]
          - errors[ERR_SUBCERT_NOT_FOUND]
          - errors[ERR_DOCUMENT_NOT_FOUND]
          - errors[ERR_FILING_NOT_FOUND]
          - endpoints["GET /disclosure/charters/{id}"]
          - endpoints["GET /disclosure/committee-members/{id}"]
          - endpoints["GET /disclosure/reporting-cycles/{id}"]
          - endpoints["GET /disclosure/sub-certifications/{id}"]
          - endpoints["GET /disclosure/documents/{id}"]
          - endpoints["GET /disclosure/filings/{id}"]
        distinguishing_aspect: |
          Six reads against a syntactically valid but unknown UUID each return 404 with the
          *_NOT_FOUND code of the entity that owns the path segment, not a single generic code:
          ERR_CHARTER_NOT_FOUND, ERR_MEMBER_NOT_FOUND, ERR_CYCLE_NOT_FOUND, ERR_SUBCERT_NOT_FOUND,
          ERR_DOCUMENT_NOT_FOUND and ERR_FILING_NOT_FOUND respectively.
        test_recipe:
          setup:
            - "Empty database — no charter, member, cycle, sub-certification, document or filing exists."
          setup_api_calls:
            - call: "GET /disclosure/charters"
              payload: { limit: 1, offset: 0 }
              as: ComplianceAdmin
          trigger:
            - call: "GET /disclosure/charters/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ComplianceAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /disclosure/committee-members/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: ComplianceAdmin
              captures: { e2: $.data.error_id }
            - call: "GET /disclosure/reporting-cycles/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: ComplianceAdmin
              captures: { e3: $.data.error_id }
            - call: "GET /disclosure/sub-certifications/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: ComplianceAdmin
              captures: { e4: $.data.error_id }
            - call: "GET /disclosure/documents/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: ComplianceAdmin
              captures: { e5: $.data.error_id }
            - call: "GET /disclosure/filings/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: ComplianceAdmin
              captures: { e6: $.data.error_id }
          assert:
            - "the setup list read returns HTTP 200 with 0 rows and total_count == 0"
            - "${e1} == ERR_CHARTER_NOT_FOUND with HTTP 404"
            - "${e2} == ERR_MEMBER_NOT_FOUND with HTTP 404"
            - "${e3} == ERR_CYCLE_NOT_FOUND with HTTP 404"
            - "${e4} == ERR_SUBCERT_NOT_FOUND with HTTP 404"
            - "${e5} == ERR_DOCUMENT_NOT_FOUND with HTTP 404"
            - "${e6} == ERR_FILING_NOT_FOUND with HTTP 404"
            - "every error body carries response_type == \"error\" and a non-empty data.message"

      - name: cycle_create_missing_required_form_type_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=8]
          - errors[ERR_INVALID_REQUEST]
          - endpoints["POST /disclosure/reporting-cycles"]
          - entities.ReportingCycle.fields.form_type
          - entities.ReportingCycle.fields.materiality_base_amount
        distinguishing_aspect: |
          Each input field declared without a default is individually mandatory: dropping form_type
          from an otherwise complete cycle payload returns ERR_INVALID_REQUEST (422) and persists
          nothing, and the same payload with materiality_base_amount at 0 is rejected by the same code
          because the field's declared constraint is `> 0`. A subsequent list read still shows zero
          cycles.
        test_recipe:
          setup:
            - "One ADOPTED charter (min_quorum_count 1, required_functions [FINANCE]) with a single ACTIVE voting FINANCE member."
            - "No ReportingCycle exists."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Q2 Disclosure Committee Charter", version_label: "2026.1", min_quorum_count: 1, required_functions: ["FINANCE"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${fin_id}"
          trigger:
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { err_missing: $.data.error_id }
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 0, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { err_zero_base: $.data.error_id }
            - call: "GET /disclosure/reporting-cycles"
              payload: { charter_id: "${charter_id}", limit: 10, offset: 0 }
              as: ComplianceAdmin
          assert:
            - "${err_missing} == ERR_INVALID_REQUEST with HTTP 422"
            - "${err_zero_base} == ERR_INVALID_REQUEST with HTTP 422"
            - "the closing list read returns 0 ReportingCycle rows and total_count == 0"
            - "DisclosureCommitteeCharter.${charter_id}.version is unchanged by both rejected calls"

      - name: omitted_optional_inputs_fall_back_to_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.CommitteeMember.fields.is_officer
          - entities.CommitteeMember.fields.voting
          - entities.ReportingCycle.fields.internal_buffer_days
          - entities.SubCertificationRequest.fields.exception_severity
          - entities.SubCertificationRequest.fields.exception_note
          - entities.SubCertificationRequest.fields.submitted_utc
          - calculations.statutory_deadline_resolution
          - calculations.subcert_scope_weight
        distinguishing_aspect: |
          Four defaults are observable in one chain: the seat created without is_officer / voting reads
          is_officer false and voting true (and is therefore accepted as the acting chair for ADOPT);
          the cycle created without internal_buffer_days uses 5, so internal_target_utc lands on
          2026-08-05T17:30:00Z; and the freshly assigned sub-certification reads exception_severity
          NONE, exception_note null and submitted_utc null with scope_weight 30.00.
        test_recipe:
          setup:
            - "A charter whose single member row is created with only full_name and function supplied."
            - "A CLOSE milestone [2026-08-01T00:00:00Z, 2026-08-03T00:00:00Z) exists, so OPEN_CLOSE is admissible; the cycle created without internal_buffer_days is then driven to CLOSE_OPEN so sub-certifications may be assigned."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Q2 Disclosure Committee Charter", version_label: "2026.1", min_quorum_count: 1, required_functions: ["FINANCE"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE" }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}" }
              as: ComplianceAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "CLOSE", planned_start_utc: "2026-08-01T00:00:00Z", planned_end_utc: "2026-08-03T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { close_ms_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "OPEN_CLOSE" }
              as: Controller
              as_user_id: "${fin_id}"
          trigger:
            - call: "POST /disclosure/sub-certifications"
              payload: { cycle_id: "${cycle_id}", member_id: "${fin_id}", scope_area: "REVENUE", due_utc: "2026-08-04T17:00:00Z" }
              as: DisclosureCommitteeChair
              as_user_id: "${fin_id}"
              captures: { sc_id: $.data.id }
          assert:
            - "CommitteeMember.${fin_id}.is_officer == false"
            - "CommitteeMember.${fin_id}.voting == true"
            - "CommitteeMember.${fin_id}.status == ACTIVE"
            - "ReportingCycle.${cycle_id}.internal_buffer_days == 5"
            - "ReportingCycle.${cycle_id}.internal_target_utc == \"2026-08-05T17:30:00Z\""
            - "SubCertificationRequest.${sc_id}.status == PENDING"
            - "SubCertificationRequest.${sc_id}.exception_severity == NONE"
            - "SubCertificationRequest.${sc_id}.exception_note == null"
            - "SubCertificationRequest.${sc_id}.submitted_utc == null"
            - "SubCertificationRequest.${sc_id}.scope_weight == 30.00"
            - "SubCertificationRequest.${sc_id}.prep_window_start_utc == \"2026-08-01T17:00:00Z\""

      - name: document_gate_fields_are_computed_at_create_and_client_values_are_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.DraftDocument.fields.tie_out_status
          - entities.DraftDocument.fields.tie_out_total_variance_bp
          - entities.DraftDocument.fields.tie_out_tier_multiplier
          - entities.DraftDocument.fields.measure_gate_status
          - entities.DraftDocument.fields.qa_gate_status
          - entities.DraftDocument.fields.revision_round
          - calculations.tie_out_variance_and_tolerance_escalation
          - calculations.measure_gate_evaluation
          - endpoints["POST /disclosure/documents"]
        distinguishing_aspect: |
          The five derived document fields are written by the server, never accepted from the request:
          a create carrying tie_out_status "PASSED", measure_gate_status "CLEARED",
          tie_out_total_variance_bp 0 and qa_gate_status "CLEARED" still lands the row at
          tie_out_status NOT_STARTED, measure_gate_status NO_MEASURES, tie_out_total_variance_bp 0
          with tie_out_tier_multiplier 1.00 and qa_gate_status CLEARED-by-emptiness, and adding one
          exact-match tie-out item then moves tie_out_status to PASSED on its own.
        test_recipe:
          setup:
            - "An ADOPTED charter with one ACTIVE voting FINANCE member, a CLOSE milestone [2026-08-01T00:00:00Z, 2026-08-03T00:00:00Z) and a cycle in CLOSE_OPEN."
            - "No document exists yet on the cycle."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Q2 Disclosure Committee Charter", version_label: "2026.1", min_quorum_count: 1, required_functions: ["FINANCE"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "CLOSE", planned_start_utc: "2026-08-01T00:00:00Z", planned_end_utc: "2026-08-03T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { close_ms_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "OPEN_CLOSE" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "GET /disclosure/reporting-cycles/${cycle_id}"
              payload: {}
              as: Controller
              as_user_id: "${fin_id}"
              captures: { cycle_v: $.data.version }
          trigger:
            - call: "POST /disclosure/documents"
              payload: { cycle_id: "${cycle_id}", doc_type: "PERIODIC_FILING", title: "Form 10-Q FY2026-Q2", author_member_id: "${fin_id}", safe_harbor_present: false, expected_cycle_version: "${cycle_v}", tie_out_status: "PASSED", tie_out_total_variance_bp: 0, measure_gate_status: "CLEARED", qa_gate_status: "CLEARED" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { doc_id: $.data.id, doc_v: $.data.version }
            - call: "POST /disclosure/documents/${doc_id}/tie-out-items"
              payload: { line_label: "Total revenue", reported_value: 4120000, source_record_value: 4120000, tolerance_bp: 25, preparer_member_id: "${fin_id}", expected_document_version: "${doc_v}" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { to_id: $.data.id }
          assert:
            - "immediately after the create, DraftDocument.${doc_id}.tie_out_status == NOT_STARTED"
            - "immediately after the create, DraftDocument.${doc_id}.measure_gate_status == NO_MEASURES"
            - "immediately after the create, DraftDocument.${doc_id}.qa_gate_status == CLEARED"
            - "immediately after the create, DraftDocument.${doc_id}.tie_out_total_variance_bp == 0 and tie_out_tier_multiplier == 1.00"
            - "immediately after the create, DraftDocument.${doc_id}.status == DRAFT and revision_round == 0 and change_note == null"
            - "after the tie-out create, TieOutItem.${to_id}.raw_variance_bp == 0, effective_tolerance_bp == 25 and status == MATCHED"
            - "after the tie-out create, DraftDocument.${doc_id}.tie_out_status == PASSED and tie_out_total_variance_bp == 0"
            - "after the tie-out create, DraftDocument.${doc_id}.measure_gate_status is still NO_MEASURES"

      - name: server_minted_identity_and_status_fields_are_input_ignored_on_create
        claim_type: system_fields
        grounds:
          - entities.DisclosureCommitteeCharter.fields.status
          - entities.DisclosureCommitteeCharter.fields.adopted_at_utc
          - entities.DisclosureCommitteeCharter.fields.superseded_by_charter_id
          - entities.CommitteeMember.fields.status
          - endpoints["POST /disclosure/charters"]
          - endpoints["POST /disclosure/charters/{id}/members"]
        distinguishing_aspect: |
          A charter create carrying id, version, created_at, status "ADOPTED" and adopted_at_utc still
          returns a server-minted id different from the supplied one, version 1, status DRAFT and
          adopted_at_utc null; a member create carrying status "RECUSED" still lands ACTIVE. The
          system-sourced fields are therefore write-protected on the create path.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "GET /disclosure/charters"
              payload: { limit: 10, offset: 0 }
              as: ComplianceAdmin
          trigger:
            - call: "POST /disclosure/charters"
              payload: { name: "Q2 Disclosure Committee Charter", version_label: "2026.1", min_quorum_count: 1, required_functions: ["FINANCE"], id: "11111111-1111-4111-8111-111111111111", version: 9, created_at: "2020-01-01T00:00:00Z", status: "ADOPTED", adopted_at_utc: "2020-01-01T00:00:00Z" }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id, charter_v: $.data.version }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true, status: "RECUSED" }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
          assert:
            - "DisclosureCommitteeCharter.${charter_id}.id != \"11111111-1111-4111-8111-111111111111\""
            - "${charter_v} == 1"
            - "DisclosureCommitteeCharter.${charter_id}.status == DRAFT"
            - "DisclosureCommitteeCharter.${charter_id}.adopted_at_utc == null"
            - "DisclosureCommitteeCharter.${charter_id}.superseded_by_charter_id == null"
            - "DisclosureCommitteeCharter.${charter_id}.created_at != \"2020-01-01T00:00:00Z\""
            - "DisclosureCommitteeCharter.${charter_id}.active_voting_member_count == 1 after the member create"
            - "CommitteeMember.${fin_id}.status == ACTIVE"
            - "CommitteeMember.${fin_id}.version == 1"

      - name: out_of_domain_enums_and_out_of_range_numerics_are_rejected_on_create
        claim_type: type_constraints
        grounds:
          - validations[priority=8]
          - validations[priority=39]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_MILESTONE_PAST_DEADLINE]
          - entities.DisclosureCommitteeCharter.fields.min_quorum_count
          - entities.DisclosureCommitteeCharter.fields.required_functions
          - entities.ReportingCycle.fields.form_type
          - entities.Milestone.fields.planned_end_utc
          - calculations.milestone_window_conflict
        distinguishing_aspect: |
          Four range/domain violations produce two different codes: min_quorum_count 13 (declared
          `>= 1 and <= 12`), a required_functions member outside {FINANCE, LEGAL, OPERATIONS,
          INVESTOR_RELATIONS} and form_type "FORM_20F" all return ERR_INVALID_REQUEST (422), while a
          milestone whose planned_start_utc is not strictly before planned_end_utc returns the
          domain-specific ERR_MILESTONE_PAST_DEADLINE (422) from milestone_window_conflict RULE C,
          not the generic parse error.
        test_recipe:
          setup:
            - "One ADOPTED charter (min_quorum_count 1, required_functions [FINANCE]) with a single ACTIVE voting FINANCE member."
            - "One ReportingCycle still in PLANNING with statutory_deadline_utc 2026-08-10T17:30:00Z and no milestone."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Q2 Disclosure Committee Charter", version_label: "2026.1", min_quorum_count: 1, required_functions: ["FINANCE"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { cycle_id: $.data.id }
          trigger:
            - call: "POST /disclosure/charters"
              payload: { name: "Oversized quorum", version_label: "2026.2", min_quorum_count: 13, required_functions: ["FINANCE"] }
              as: ComplianceAdmin
              captures: { err_quorum_range: $.data.error_id }
            - call: "POST /disclosure/charters"
              payload: { name: "Unknown function", version_label: "2026.3", min_quorum_count: 1, required_functions: ["MARKETING"] }
              as: ComplianceAdmin
              captures: { err_function_enum: $.data.error_id }
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q3", form_type: "FORM_20F", period_end_date: "2026-09-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { err_form_enum: $.data.error_id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "CLOSE", planned_start_utc: "2026-08-03T00:00:00Z", planned_end_utc: "2026-08-03T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { err_window: $.data.error_id }
          assert:
            - "${err_quorum_range} == ERR_INVALID_REQUEST with HTTP 422"
            - "${err_function_enum} == ERR_INVALID_REQUEST with HTTP 422"
            - "${err_form_enum} == ERR_INVALID_REQUEST with HTTP 422"
            - "${err_window} == ERR_MILESTONE_PAST_DEADLINE with HTTP 422"
            - "GET /disclosure/reporting-cycles/${cycle_id}/milestones returns 0 rows and total_count == 0"
            - "ReportingCycle.${cycle_id}.min_slack_days_calendar == 9999 and min_slack_days_business == 9999"

      - name: body_foreign_keys_must_exist_and_belong_to_the_cycles_own_charter_or_are_rejected
        claim_type: parent_relationships
        grounds:
          - validations[priority=7]
          - validations[priority=16]
          - errors[ERR_CYCLE_NOT_FOUND]
          - errors[ERR_MEMBER_NOT_FOUND]
          - errors[ERR_MEMBER_CHARTER_MISMATCH]
          - entities.SubCertificationRequest.fields.cycle_id
          - entities.SubCertificationRequest.fields.member_id
          - endpoints["POST /disclosure/sub-certifications"]
        distinguishing_aspect: |
          The two body foreign keys on a sub-certification assignment are resolved in the order §1.5
          declares them: an unknown cycle_id returns ERR_CYCLE_NOT_FOUND even when member_id is also
          unknown, an unknown member_id under a valid cycle_id returns ERR_MEMBER_NOT_FOUND, and a
          member that exists but sits on a DIFFERENT charter than the cycle returns the 409
          ERR_MEMBER_CHARTER_MISMATCH rather than a 404 — existence and ownership are separate checks.
        test_recipe:
          setup:
            - "Charter A is ADOPTED with one ACTIVE voting FINANCE member; its cycle is in CLOSE_OPEN with a CLOSE milestone."
            - "Charter B (never adopted) carries one ACTIVE FINANCE member who is a stranger to charter A's cycle."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Charter A", version_label: "A-1", min_quorum_count: 1, required_functions: ["FINANCE"] }
              as: ComplianceAdmin
              captures: { charter_a_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_a_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_a_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/charters"
              payload: { name: "Charter B", version_label: "B-1", min_quorum_count: 1, required_functions: ["FINANCE"] }
              as: ComplianceAdmin
              captures: { charter_b_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_b_id}/members"
              payload: { full_name: "Quin Stranger", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { stranger_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_a_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "CLOSE", planned_start_utc: "2026-08-01T00:00:00Z", planned_end_utc: "2026-08-03T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { close_ms_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "OPEN_CLOSE" }
              as: Controller
              as_user_id: "${fin_id}"
          trigger:
            - call: "POST /disclosure/sub-certifications"
              payload: { cycle_id: "00000000-0000-4000-8000-0000000000aa", member_id: "00000000-0000-4000-8000-0000000000bb", scope_area: "REVENUE", due_utc: "2026-08-04T17:00:00Z" }
              as: DisclosureCommitteeChair
              as_user_id: "${fin_id}"
              captures: { err_cycle: $.data.error_id }
            - call: "POST /disclosure/sub-certifications"
              payload: { cycle_id: "${cycle_id}", member_id: "00000000-0000-4000-8000-0000000000bb", scope_area: "REVENUE", due_utc: "2026-08-04T17:00:00Z" }
              as: DisclosureCommitteeChair
              as_user_id: "${fin_id}"
              captures: { err_member: $.data.error_id }
            - call: "POST /disclosure/sub-certifications"
              payload: { cycle_id: "${cycle_id}", member_id: "${stranger_id}", scope_area: "REVENUE", due_utc: "2026-08-04T17:00:00Z" }
              as: DisclosureCommitteeChair
              as_user_id: "${fin_id}"
              captures: { err_mismatch: $.data.error_id }
          assert:
            - "${err_cycle} == ERR_CYCLE_NOT_FOUND with HTTP 404"
            - "${err_member} == ERR_MEMBER_NOT_FOUND with HTTP 404"
            - "${err_mismatch} == ERR_MEMBER_CHARTER_MISMATCH with HTTP 409"
            - "GET /disclosure/sub-certifications with cycle_id == ${cycle_id} returns 0 rows and total_count == 0"
            - "ReportingCycle.${cycle_id}.total_assigned_scope_weight == 0.00 and certification_coverage_pct == 0.00"

      - name: charter_self_succession_and_unadopted_successor_are_rejected_before_the_graph_edge_links
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - entities.DisclosureCommitteeCharter.fields.superseded_by_charter_id
          - state_machines.DisclosureCommitteeCharter.ADOPTED_to_SUPERSEDED
          - validations[priority=35]
          - errors[ERR_SUCCESSOR_CHARTER_INVALID]
          - endpoints["GET /disclosure/charters"]
        distinguishing_aspect: |
          The self-referential charter edge is the scaffold's graph topology in miniature and it refuses
          to close a one-node loop: SUPERSEDE naming the charter itself returns
          ERR_SUCCESSOR_CHARTER_INVALID (409), so does SUPERSEDE naming a still-DRAFT charter, and only
          a distinct ADOPTED successor writes superseded_by_charter_id — after which
          GET /disclosure/charters filtered by superseded_by_charter_id finds the predecessor from the
          successor's id, which is the reverse direction of the same edge.
        test_recipe:
          setup:
            - "Charter A and charter B are both ADOPTED, each with one ACTIVE voting FINANCE member and min_quorum_count 1."
            - "Charter C exists in DRAFT with no members."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Charter A", version_label: "A-1", min_quorum_count: 1, required_functions: ["FINANCE"] }
              as: ComplianceAdmin
              captures: { charter_a_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_a_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { a_fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_a_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${a_fin_id}"
            - call: "POST /disclosure/charters"
              payload: { name: "Charter B", version_label: "B-1", min_quorum_count: 1, required_functions: ["FINANCE"] }
              as: ComplianceAdmin
              captures: { charter_b_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_b_id}/members"
              payload: { full_name: "Owen Successor", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { b_fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_b_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${b_fin_id}"
            - call: "POST /disclosure/charters"
              payload: { name: "Charter C", version_label: "C-1", min_quorum_count: 1, required_functions: ["FINANCE"] }
              as: ComplianceAdmin
              captures: { charter_c_id: $.data.id }
          trigger:
            - call: "POST /disclosure/charters/${charter_a_id}/transitions"
              payload: { action: "SUPERSEDE", successor_charter_id: "${charter_a_id}" }
              as: DisclosureCommitteeChair
              as_user_id: "${a_fin_id}"
              captures: { err_self: $.data.error_id }
            - call: "POST /disclosure/charters/${charter_a_id}/transitions"
              payload: { action: "SUPERSEDE", successor_charter_id: "${charter_c_id}" }
              as: DisclosureCommitteeChair
              as_user_id: "${a_fin_id}"
              captures: { err_draft_successor: $.data.error_id }
            - call: "POST /disclosure/charters/${charter_a_id}/transitions"
              payload: { action: "SUPERSEDE", successor_charter_id: "${charter_b_id}" }
              as: DisclosureCommitteeChair
              as_user_id: "${a_fin_id}"
            - call: "GET /disclosure/charters"
              payload: { superseded_by_charter_id: "${charter_b_id}", limit: 10, offset: 0 }
              as: ComplianceAdmin
          assert:
            - "${err_self} == ERR_SUCCESSOR_CHARTER_INVALID with HTTP 409"
            - "${err_draft_successor} == ERR_SUCCESSOR_CHARTER_INVALID with HTTP 409"
            - "after the third trigger call DisclosureCommitteeCharter.${charter_a_id}.status == SUPERSEDED"
            - "DisclosureCommitteeCharter.${charter_a_id}.superseded_by_charter_id == \"${charter_b_id}\""
            - "DisclosureCommitteeCharter.${charter_b_id}.status == ADOPTED and superseded_by_charter_id == null"
            - "the closing list read returns exactly 1 row whose id == \"${charter_a_id}\" and total_count == 1"

  # `immutability` is skipped for this section: every §1.1 entity declares common_fields: true, so no
  # row lacks a version field or an update path.
  - section: state_machines
    instances:
      - name: freshly_created_rows_land_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.DisclosureCommitteeCharter.initial_state
          - state_machines.CommitteeMember.initial_state
          - state_machines.ReportingCycle.initial_state
          - state_machines.Milestone.initial_state
          - state_machines.OfficerCertification.initial_state
          - state_machines.MaterialEvent.initial_state
          - entities.ReportingCycle.fields.restatement_stage
          - entities.MaterialEvent.fields.severity_score
          - calculations.material_event_severity_and_deadline
        distinguishing_aspect: |
          Six machines are observed at birth in one chain: a new charter is DRAFT, a new seat ACTIVE, a
          new cycle is (status PLANNING, restatement_stage NONE) on both axes at once, a new milestone
          PLANNED with actual_start_utc and actual_end_utc null, a new officer certification BLOCKED
          (never ELIGIBLE, even though the cycle carries no open event yet) and a new material event
          UNASSESSED with severity_score 2.00 already computed but current_report_deadline_utc still
          null.
        test_recipe:
          setup:
            - "One ADOPTED charter (min_quorum_count 1, required_functions [FINANCE]) with an ACTIVE voting FINANCE member and an ACTIVE officer member."
            - "One ReportingCycle in PLANNING with materiality_base_amount 10000000."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Q2 Disclosure Committee Charter", version_label: "2026.1", min_quorum_count: 1, required_functions: ["FINANCE"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Rhea Chief", function: "FINANCE", is_officer: true, voting: true }
              as: ComplianceAdmin
              captures: { ceo_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { cycle_id: $.data.id }
          trigger:
            - call: "POST /disclosure/charters"
              payload: { name: "Charter Z", version_label: "Z-1", min_quorum_count: 1, required_functions: ["LEGAL"] }
              as: ComplianceAdmin
              captures: { charter_z_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_z_id}/members"
              payload: { full_name: "Zara Legal", function: "LEGAL", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { z_legal_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "CLOSE", planned_start_utc: "2026-08-01T00:00:00Z", planned_end_utc: "2026-08-03T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { close_ms_id: $.data.id }
            - call: "POST /disclosure/officer-certifications"
              payload: { cycle_id: "${cycle_id}", officer_member_id: "${ceo_id}", cert_type: "CEO_302" }
              as: ComplianceAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/material-events"
              payload: { category: "IMPAIRMENT", occurred_utc: "2026-07-20T10:00:00Z", discovered_utc: "2026-07-22T10:00:00Z", magnitude_amount: 200000, description: "Goodwill impairment indicator identified in the retail segment." }
              as: LegalCounsel
              as_user_id: "${fin_id}"
              captures: { event_id: $.data.id }
          assert:
            - "DisclosureCommitteeCharter.${charter_z_id}.status == DRAFT"
            - "CommitteeMember.${z_legal_id}.status == ACTIVE"
            - "ReportingCycle.${cycle_id}.status == PLANNING and ReportingCycle.${cycle_id}.restatement_stage == NONE"
            - "Milestone.${close_ms_id}.status == PLANNED"
            - "Milestone.${close_ms_id}.actual_start_utc == null and Milestone.${close_ms_id}.actual_end_utc == null"
            - "OfficerCertification.${cert_id}.status == BLOCKED"
            - "OfficerCertification.${cert_id}.signed_utc == null and OfficerCertification.${cert_id}.coverage_pct_at_signing == null"
            - "MaterialEvent.${event_id}.assessment_status == UNASSESSED"
            - "MaterialEvent.${event_id}.severity_score == 2.00"
            - "MaterialEvent.${event_id}.current_report_deadline_utc == null and MaterialEvent.${event_id}.linked_document_id == null"
            - "ReportingCycle.${cycle_id}.open_material_event_count == 1"

      - name: milestone_start_then_complete_stamps_both_clock_instants_and_drops_out_of_the_slack_set
        claim_type: valid_transition
        grounds:
          - state_machines.Milestone.PLANNED_to_IN_PROGRESS
          - state_machines.Milestone.IN_PROGRESS_to_COMPLETE
          - entities.Milestone.fields.actual_start_utc
          - entities.Milestone.fields.actual_end_utc
          - calculations.cycle_milestone_slack
          - endpoints["POST /disclosure/milestones/{id}/transitions"]
          - endpoints["POST /_clock/set_current_utc"]
        distinguishing_aspect: |
          The two declared triggers move the row forward and stamp the logical clock they were issued
          at: START at 2026-08-02T09:00:00Z writes actual_start_utc 2026-08-02T09:00:00Z and leaves
          actual_end_utc null, COMPLETE at 2026-08-02T15:30:00Z writes actual_end_utc
          2026-08-02T15:30:00Z, and the COMPLETE also removes the row from the slack input set so the
          cycle aggregate jumps from (7, 5) to the empty-set sentinel (9999, 9999) while the row keeps
          its own frozen slack_calendar_days 7 / slack_business_days 5.
        test_recipe:
          setup:
            - "An ADOPTED charter with one ACTIVE voting FINANCE member."
            - "A cycle in CLOSE_OPEN whose only milestone is CLOSE [2026-08-01T00:00:00Z, 2026-08-03T00:00:00Z) against statutory_deadline_utc 2026-08-10T17:30:00Z."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Q2 Disclosure Committee Charter", version_label: "2026.1", min_quorum_count: 1, required_functions: ["FINANCE"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/reporting-cycles"
