  # -------------------------------------------------------------------
  # Guide section 8 - Cross-cutting complexity layers
  # -------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: the_consultation_version_is_per_row_monotonic_and_never_bumped_by_a_refusal
        claim_type: optimistic_concurrency
        grounds:
          - complexity_layers.optimistic_concurrency
          - validations.priority_11_ERR_STALE_CONSULTATION_VERSION
          - entities.Consultation.fields.version
        distinguishing_aspect: "The OCC contract has three parts that are easy to get individually right and jointly wrong: the guard rejects a stale value, a REJECTED request must not itself bump the version (otherwise a client can never recover), and the counter is scoped to one row - work on C1 must leave C2's version alone. All three are checked from captured version values rather than from literals."
