  # ---------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: wear_index_exactly_80_recommends_full_rebuild
        grounds:
          - calculations.recommended_path
          - calculations.wear_index
        distinguishing_aspect: |
          Metric = unitless wear index on POST /api/machines/{id}/assessments:
          measurements 16/8/12 land wear_index on exactly 80.00 and the
          >= threshold maps to FULL_REBUILD, while 15/8/12 gives 77.50 ->
          MECHANICAL_REBUILD; the boundary is inclusive.
        test_recipe:
          setup:
            - "Two registered machines awaiting assessment"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-113", machine_type: "LATHE", year_of_manufacture: 2018, control_generation: "LEGACY", spindle_hours: 40000 }, as: PlatformAdmin, captures: { m1: $.data.id, m1_v: $.data.version } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-114", machine_type: "MILL", year_of_manufacture: 2018, control_generation: "LEGACY", spindle_hours: 40000 }, as: PlatformAdmin, captures: { m2: $.data.id, m2_v: $.data.version } }
          trigger:
            - { call: "POST /api/machines/${m1}/assessments", payload: { positioning_deviation_microns: 16, spindle_runout_microns: 8, backlash_microns: 12, scope_notes: "boundary", expected_machine_version: "${m1_v}" }, as: Assessor, as_user_id: "assessor-1", captures: { a1: $.data.id, a1_wear: $.data.wear_index, a1_path: $.data.recommended_path } }
            - { call: "POST /api/machines/${m2}/assessments", payload: { positioning_deviation_microns: 15, spindle_runout_microns: 8, backlash_microns: 12, scope_notes: "just below", expected_machine_version: "${m2_v}" }, as: Assessor, as_user_id: "assessor-1", captures: { a2: $.data.id, a2_wear: $.data.wear_index, a2_path: $.data.recommended_path } }
          assert:
            - "assessment ${a1}: wear_index == 80.0 exactly (0.5*0.8 + 0.3*0.8 + 0.2*0.8 = 0.8), recommended_path == FULL_REBUILD (>= 80.00 boundary inclusive)"
            - "assessment ${a2}: wear_index == 77.5, recommended_path == MECHANICAL_REBUILD (below the boundary)"

      - name: warranty_drift_exactly_15_rejected
        grounds:
          - calculations.warranty_drift_evaluation
          - entities.WarrantyClaim.fields.drift_microns
        distinguishing_aspect: |
          Metric = accuracy drift in microns on POST
          /api/projects/{id}/warranty-claims (a different metric and endpoint
          from wear_index_exactly_80_recommends_full_rebuild): drift of exactly
          15.0 microns is within tolerance (strict > rule) and rejected with
          ERR_DRIFT_WITHIN_TOLERANCE, while 15.1 microns is admissible.
        test_recipe:
          setup:
            - "MECHANICAL_REBUILD project delivered into WARRANTY_ACTIVE with accepted_positioning_microns == 8.0; clock 2026-06-01 (well inside warranty)"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-115", machine_type: "LATHE", year_of_manufacture: 2018, control_generation: "LEGACY", spindle_hours: 40000 }, as: PlatformAdmin, captures: { m: $.data.id, m_v: $.data.version } }
            - { call: "POST /api/machines/${m}/assessments", payload: { positioning_deviation_microns: 10, spindle_runout_microns: 8, backlash_microns: 6, scope_notes: "s", expected_machine_version: "${m_v}" }, as: Assessor, as_user_id: "assessor-1", captures: { asmt: $.data.id } }
            - { call: "POST /api/assessments/${asmt}/submit", payload: {}, as: Assessor, as_user_id: "assessor-1" }
