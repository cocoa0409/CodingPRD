  - rule_id: resource_temporal_overlap
    instances:
      - name: mentor_meeting_buffer_conflict
        grounds:
          - validations[priority=10]
          - errors[ERR_MENTOR_SCHEDULE_CONFLICT]
          - entities.CohortMeeting
        distinguishing_aspect: |
          Interval semantics = buffered half-open datetimes on the Mentor
          calendar resource: a new meeting conflicts iff new.starts_at <
          existing.ends_at + 15 minutes AND existing.starts_at < new.ends_at +
          15 minutes, so a meeting starting 10 minutes after another ends
          conflicts, while one starting exactly 15 minutes after is legal
          (adjacency itself is not enough — the buffer is). Sibling rule
          (internship_inclusive_boundary_overlap) uses inclusive closed dates on
          the Scholar calendar resource — different semantics AND different
          resource entity.
        test_recipe:
          setup:
            - "Cohort MATRICULATED (three accepts, zero training completions, matriculate withdrew all three scholars — meeting gate only reads cohort.status); mentor ${men} is the cohort's mentor"
          setup_api_calls:
            - { call: "POST /api/city-programs", payload: { code: "ATL", name: "Atlanta", admissions_cycle: "2027", nomination_window_opens_at: "2026-09-01T00:00:00Z", nomination_window_closes_at: "2026-11-30T23:59:59Z" }, as: ProgramAdmin, captures: { cp: $.data.id } }
