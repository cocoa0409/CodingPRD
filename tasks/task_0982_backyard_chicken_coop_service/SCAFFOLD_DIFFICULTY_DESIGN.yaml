  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: wallet_credit_issue_void_roundtrip
        grounds:
          - calculations.wallet_credit_ledger
          - calculations.invoice_total_composition
          - state_machines.Invoice.DRAFT_to_ISSUED
          - state_machines.Invoice.ISSUED_to_VOID
        distinguishing_aspect: |
          Conserved quantity = HouseholdAccount.wallet_credit_cents: issue
          debits min(wallet, total) = 1081 (5000 -> 3919) and the compensating
          void refunds exactly credit_applied_cents (3919 -> 5000); the round
          trip leaves the wallet unchanged and releases the swept order.
        test_recipe:
          setup:
            - "URBAN household; order 3 x 333 cents PLACED at default clock (total 999)"
            - "Invoice [2026-05-01, 2026-06-01) generated: subtotal 999, tax 82, total 1081 (DRAFT)"
            - "Wallet credited +5000 via wallet-adjustments (balance 5000)"
          setup_api_calls:
            - call: "POST /coopcare/households"
              payload: { name: "H Wallet", email: "hwallet@x.com", address: "16 Hen Ln", zone_code: "URBAN" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id }
            - call: "POST /coopcare/products"
              payload: { sku: "FEED-A", name: "Layer Feed", category: "FEED", unit_price_cents: 333 }
              as: PlatformAdmin
            - call: "POST /coopcare/supply-orders"
              payload: { household_id: "${hh_id}" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { order_id: $.data.id }
            - call: "POST /coopcare/supply-orders/${order_id}/lines"
              payload: { product_sku: "FEED-A", quantity: 1 }
              as: Customer
              as_user_id: "${hh_id}"
            - call: "POST /coopcare/supply-orders/${order_id}/lines"
              payload: { product_sku: "FEED-A", quantity: 1 }
              as: Customer
              as_user_id: "${hh_id}"
            - call: "POST /coopcare/supply-orders/${order_id}/lines"
              payload: { product_sku: "FEED-A", quantity: 1 }
              as: Customer
              as_user_id: "${hh_id}"
            - call: "POST /coopcare/supply-orders/${order_id}/place"
              as: Customer
              as_user_id: "${hh_id}"
            - call: "POST /coopcare/invoices"
              payload: { household_id: "${hh_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /coopcare/households/${hh_id}/wallet-adjustments"
              payload: { amount_cents: 5000, reason: "goodwill" }
              as: BillingAdmin
          trigger:
            - call: "POST /coopcare/invoices/${inv_id}/issue"
              as: BillingAdmin
              captures: { cred: $.data.credit_applied_cents, due: $.data.amount_due_cents }
            - call: "GET /coopcare/households/${hh_id}"
              as: BillingAdmin
              captures: { wallet_mid: $.data.wallet_credit_cents }
            - call: "POST /coopcare/invoices/${inv_id}/void"
              as: BillingAdmin
              captures: { cred_after: $.data.credit_applied_cents }
            - call: "GET /coopcare/households/${hh_id}"
              as: BillingAdmin
              captures: { wallet_end: $.data.wallet_credit_cents }
            - call: "GET /coopcare/supply-orders/${order_id}"
              as: BillingAdmin
              captures: { billed: $.data.billed_invoice_id }
          assert:
            - "Invoice.${inv_id}.credit_applied_cents == 1081 after issue (min(5000, 1081))"
            - "Invoice.${inv_id}.amount_due_cents == 0 after issue"
            - "HouseholdAccount.${hh_id}.wallet_credit_cents == 3919 after issue (5000 - 1081)"
            - "HouseholdAccount.${hh_id}.wallet_credit_cents == 5000 after void (exact compensation; conserved quantity restored)"
            - "Invoice.${inv_id}.credit_applied_cents == 0 after void and status == VOID"
            - "SupplyOrder.${order_id}.billed_invoice_id == null after void (source released for re-billing)"

      - name: route_committed_stops_assign_cancel_roundtrip
        grounds:
          - entities.SittingRoute.fields.committed_stops
          - state_machines.SittingEngagement.CONFIRMED_to_CANCELLED
          - state_machines.RouteStop.PENDING_to_REMOVED
          - calculations.route_assignment_selector
        distinguishing_aspect: |
          Conserved quantity = SittingRoute.committed_stops (a capacity counter,
          different from wallet cents): a second household's engagement adds a
          stop (1 -> 2) and its cancellation removes exactly that stop (2 -> 1),
          returning the route to its pre-engagement count WITHOUT triggering the
          zero-count auto-demotion.
        test_recipe:
          setup:
            - "Two URBAN households H1 and H2, each with an INSTALLED grade-B coop"
            - "PUBLISHED URBAN route on 2026-08-01 (tech-9, max_stops 4)"
            - "H1 engagement 2026-08-01 -> 2026-08-02 (window 08:00) CONFIRMED: route committed_stops == 1"
            - "H2 engagement 2026-08-01 -> 2026-08-02 (window 10:00, buffer-safe) QUOTED"
          setup_api_calls:
