            - { call: "POST /damage-recovery/locate-responses", payload: { locate_ticket_id: "${tckO}", locator_id: "${loc1}", response_code: "MARKED", marks_completed_at: "2026-05-02T07:00:00Z" }, as: Locator, as_user_id: "${loc1}" }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "32 Rho St", facility_type: "GAS", severity: "MINOR", occurred_at: "2026-05-03T10:00:00Z" }, as: IntakeCoordinator, captures: { caseO: $.data.id } }
          trigger:
            - { call: "POST /damage-recovery/damage-cases/${caseO}/link-ticket", payload: { locate_ticket_id: "${tckO}" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
