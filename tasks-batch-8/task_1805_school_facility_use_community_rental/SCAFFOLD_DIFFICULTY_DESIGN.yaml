  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_approve
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_INSURANCE_INSUFFICIENT]
        distinguishing_aspect: |
          Category pair (state vs business_safety): approve on a request that is BOTH
          wrong-state (SUBMITTED, never reviewed) AND safety-violating (sole insurance
          certificate REVOKED after submit) must surface ERR_INVALID_STATE_TRANSITION
          (409, priority 4) — state beats safety.
        test_recipe:
          setup:
            - "Site RHS STANDARD GYM; NONPROFIT renter; cert VALID at submit, then REVOKED by FacilitiesDirector"
            - "Request headcount 200 SUBMITTED (never begin_review)"
          setup_api_calls:
            - call: "POST /district/sites"
              payload: { site_code: "RHS", display_name: "Riverview High", rental_timezone: "America/Los_Angeles" }
              as: DistrictAdmin
              captures: { site_id: $.data.id }
            - call: "POST /district/sites/${site_id}/facilities"
              payload: { facility_code: "GYM", facility_tier: "STANDARD", capacity: 300, setup_buffer_minutes: 30, teardown_buffer_minutes: 30, requires_custodian: true }
              as: DistrictAdmin
