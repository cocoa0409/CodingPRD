  - rule_id: transitive_cascade
    instances:
      - name: critical_audit_cascade_releases_allocations
        grounds:
          - state_machines.RetailAccount.ACTIVE_to_SERVICE_SUSPENDED
          - state_machines.Wholesaler.APPOINTED_to_SUSPENDED
          - endpoints.POST_/draft-audits
        distinguishing_aspect: "Depth-3 cascade triggered by draft-audit creation: CRITICAL_FAIL audit mutates the RetailAccount (link 1), the account's suspension mutates Wholesaler.suspended_account_count and at 3 suspends the Wholesaler (link 2), and the wholesaler suspension releases its PENDING allocation assignments (link 3) — each link is caused by the previous link's mutation."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z."
            - "Territory awarded to GOLD wholesaler WX with brand_scope [BUD-LTD]; three accounts AX1/AX2/AX3 served by WX."
            - "Allocation event BUD-LTD total 300 (cap floor(0.40*300)=120): WX requests 200 and locks; waterfall assigns WX exactly 120 (phase-1 guarantee 100 + capacity 20), unassigned_remainder 180, pending_qty 120."
          setup_api_calls:
            - call: "POST /territories"
              payload: { name: "Cascade Territory", state_code: "TX" }
              as: BrewerAdmin
              captures: { txc_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "Cascade Distributing", home_state: "TX", license_number: "TX-W-5001", tier: "GOLD", financial_capacity_score: 85, warehouse_capacity_score: 85, market_coverage_score: 85 }
              as: BrewerAdmin
              captures: { wx_id: $.data.id }
