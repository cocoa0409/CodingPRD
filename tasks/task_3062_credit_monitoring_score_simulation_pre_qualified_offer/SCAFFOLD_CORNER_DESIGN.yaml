          - state_machines.Consumer.initial_state
        distinguishing_aspect: "A newly enrolled consumer starts ACTIVE, and the first snapshot arrives at snapshot_ordinal 1 already ACTIVE rather than sitting in the requested sub-state."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /credit/consumers"
