              captures: { p1_v_adv: $.data.version }
            - call: "POST /signal-ops/timing-plans"
              payload: { project_id: "${p1_id}", intersection_id: "${i1_id}", tod_period: "AM_PEAK", tod_start_min: 360, tod_end_min: 540, cycle_length_sec: 90, coordination_ref: "MASTER", expected_project_version: "${p1_v_adv}" }
              as: TimingEngineer
