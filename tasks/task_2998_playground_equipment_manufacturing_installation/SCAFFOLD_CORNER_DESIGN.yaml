            - call: "POST /playground/pledges/${pledge_id}/collect"
              payload: {}
              as: ClientRepresentative
              as_user_id: "client-1"
              captures: { pledge_status: $.data.status }
            - call: "POST /playground/orders"
              payload: { quote_id: "${q_id}" }
              as: DesignConsultant
              as_user_id: "consultant-9"
              captures: { order_id: $.data.id, order_prod_status: $.data.production_status }
            - call: "POST /playground/installation-jobs"
              payload: { order_id: "${order_id}", installer_id: "${inst_a_id}", scheduled_start_date: "2026-08-06", scheduled_end_date: "2026-08-08", crew_size: 4 }
              as: DesignConsultant
              as_user_id: "consultant-9"
              captures: { job_id: $.data.id, booked_days: $.data.booked_crew_days }
            # --- probe 3 (priority 12): installer B, correct role, someone else's job, and the clock is
            #     still before scheduled_start_date so the ownership check must outrank priority 71
            - call: "POST /playground/installation-jobs/${job_id}/start"
              payload: {}
              as: InstallerOperator
              as_user_id: "${inst_b_id}"
              captures: { err_not_owner: $.data.error_id }
            - call: "POST /playground/_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T08:00:00Z" }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
            # --- probe 4: same role, the owning installer id -> succeeds
            - call: "POST /playground/installation-jobs/${job_id}/start"
              payload: {}
              as: InstallerOperator
              as_user_id: "${inst_a_id}"
              captures: { job_status_started: $.data.status }
            - call: "POST /playground/installation-jobs/${job_id}/complete"
              payload: {}
              as: InstallerOperator
              as_user_id: "${inst_a_id}"
              captures: { job_status_completed: $.data.status }
            - call: "POST /playground/installation-jobs/${job_id}/inspections"
              payload: { kind: "INSTALL_INSPECTION", result: "PASS", deficiency_count: 0, fall_height_measured_cm: 0, surfacing_depth_measured_cm: 30 }
              as: SafetyAuditor
              as_user_id: "auditor-1"
              captures: { insp1_seq: $.data.sequence_number, insp1_by: $.data.performed_by_user_id }
            # --- probe 5 (priority 15): the same auditor that filed the install inspection tries the audit
            - call: "POST /playground/installation-jobs/${job_id}/inspections"
              payload: { kind: "POST_INSTALL_AUDIT", result: "PASS", deficiency_count: 0, fall_height_measured_cm: 0, surfacing_depth_measured_cm: 30 }
              as: SafetyAuditor
              as_user_id: "auditor-1"
              captures: { err_sod_audit: $.data.error_id }
            # --- probe 6: same role, an independent auditor id -> succeeds
            - call: "POST /playground/installation-jobs/${job_id}/inspections"
              payload: { kind: "POST_INSTALL_AUDIT", result: "PASS", deficiency_count: 0, fall_height_measured_cm: 0, surfacing_depth_measured_cm: 30 }
              as: SafetyAuditor
              as_user_id: "auditor-2"
              captures: { insp2_seq: $.data.sequence_number, insp2_by: $.data.performed_by_user_id }
            - call: "GET /playground/installation-jobs/${job_id}/inspections"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { insp_count: $.meta.total_count }
          assert:
            - "setup: ${approval_pct} == 60.0 (15 yes of 25 votes) and ${design_status_after_review} == DESIGN_APPROVED, and ${consultant_of_record} == 'consultant-9'"
            - "probe 1: HTTP 403 with ${err_sod_certify} == ERR_SEGREGATION_OF_DUTIES; DesignProject.${p_id}.design_status is still DESIGN_APPROVED, compliance_status is still NOT_ASSESSED and version is unchanged"
            - "probe 2: HTTP 200 with ${certified_status} == CERTIFIED and ${compliance_after_certify} == COMPLIANT - the only difference from probe 1 is X-User-ID"
            - "the FIRM quote prices the single VALIDATED placement at the default colour: subtotal_cents == 32250 (10750 * 3, no colour uplift), freight_cents == 51750 (48000 + 1250 * 3), discount_cents == 0 (32250 < DISCOUNT_TIER_1_MIN_CENTS 2000000), so ${q_total} == 84000 and priced_unit_count == 3"
            - "${q_status} == ACCEPTED and ${pledge_status} == COLLECTED; DesignProject.${p_id}.funds_collected_cents == 84000, exactly equal to the quote total, so the priority-82 funding check passes with no surplus"
            - "the collect recomputes the allocation waterfall: alloc_permit_freight_cents == 51750, alloc_surfacing_cents == 6450 (round_half_up(32250 * 0.2)), alloc_structure_cents == 25800 (32250 - 6450), alloc_contingency_cents == 0"
            - "${order_prod_status} == CREATED, DesignProject.${p_id}.design_status == ORDERED and PlayArea.${a_id}.status == LOCKED"
            - "${booked_days} == 12 (crew_size 4 * 3 inclusive days 2026-08-06..2026-08-08) and CertifiedInstaller.${inst_a_id}.committed_crew_days == 12 while CertifiedInstaller.${inst_b_id}.committed_crew_days is still 0"
            - "probe 3: HTTP 403 with ${err_not_owner} == ERR_NOT_JOB_OWNER, NOT 409 ERR_JOB_NOT_YET_STARTABLE - the clock is 2026-08-01 and the job starts 2026-08-06, so the priority-12 ownership check demonstrably ran before the priority-71 temporal check; InstallationJob.${job_id}.status is still SCHEDULED and its version unchanged"
            - "probe 4: HTTP 200 with ${job_status_started} == IN_PROGRESS, then ${job_status_completed} == INSPECTION_PENDING"
            - "the INSTALL_INSPECTION PASS returns HTTP 201 with ${insp1_seq} == 1 and ${insp1_by} == 'auditor-1'; InstallationJob.${job_id}.status == AUDIT_PENDING, install_inspector_user_id == 'auditor-1', DesignProject.${p_id}.design_status == INSTALLED and installed_on == '2026-08-06' (the logical clock date)"
            - "probe 5: HTTP 403 with ${err_sod_audit} == ERR_SEGREGATION_OF_DUTIES; InstallationJob.${job_id}.status is still AUDIT_PENDING and NO InstallationInspection row was written (InstallationInspection is common_fields false and immutable, so the refused call must leave the sequence untouched)"
            - "probe 6: HTTP 201 with ${insp2_seq} == 2 (previous max + 1, proving probe 5 consumed no sequence number) and ${insp2_by} == 'auditor-2'; InstallationJob.${job_id}.status == AUDIT_PASSED, DesignProject.${p_id}.design_status == AUDITED and compliance_status == COMPLIANT"
            - "${insp_count} == 2 - exactly the two accepted inspections"

  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: quote_create_occ_rejects_a_project_version_observed_before_the_vote_batch
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers.optimistic_concurrency
          - concurrency_rules.quote-create-stale-project
          - endpoints[POST /playground/quotes]
          - validations[priority=30]
          - errors.ERR_STALE_PROJECT_VERSION
          - state_machines.DesignProject.RENDERED_to_COMMUNITY_REVIEW
        distinguishing_aspect: >-
          The stale version is not a hand-written number: it is READ from the project before a community
          vote batch is posted, and the vote batch bumps DesignProject.version as a declared side effect.
          Replaying the quote create with that observed-then-invalidated version must fail 412
          ERR_STALE_PROJECT_VERSION and write nothing, while the identical body carrying the re-read
          version succeeds. An implementation that accepts any expected_project_version, or that compares
          it against the rendering or the quote instead of the project, passes the second call but also
          the first.
        test_recipe:
          setup:
            - "Clock 2026-08-01T09:00:00Z. Standard ASTM_F1487/2024 ACTIVE with requires_accessible_route false. One certified PRESCHOOL_2_5 POST model at 10750 cents. One project (accessible_route_required false, budget 500000) in RENDERED with one PRESCHOOL_2_5 area at depth 30 and one VALIDATED placement of quantity 3. No quote exists yet."
          setup_api_calls:
            - call: "POST /playground/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
            - call: "POST /playground/standards"
              payload: { code: "ASTM_F1487", edition_year: 2024, effective_from: "2024-01-01", min_use_zone_clearance_cm: 183, max_fall_height_cm_toddler: 122, max_fall_height_cm_preschool: 152, max_fall_height_cm_school_age: 244, requires_accessible_route: false }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { std_id: $.data.id }
            - call: "POST /playground/standards/${std_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /playground/component-models"
              payload: { sku: "POST-STD-120", category: "POST", age_group: "PRESCHOOL_2_5", deck_height_cm: 0, use_zone_footprint_cm: 60, color_options: ["FOREST_GREEN", "CRIMSON"], unit_price_cents: 10750, hardware_bag_count: 4, warranty_years: 10, parts_support_until_year: 2040, accessible_transfer_ready: false, supersedes_model_id: null }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
              captures: { m_post_id: $.data.id }
            - call: "POST /playground/component-models/${m_post_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /playground/projects"
              payload: { client_name: "Concurrency Green Park", site_length_cm: 3000, site_width_cm: 2000, site_soil_type: "SANDY_LOAM", budget_cents: 500000, fundraising_deadline: "2026-12-31", required_age_groups: ["PRESCHOOL_2_5"], accessible_route_required: false }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { p_id: $.data.id }
            - call: "POST /playground/projects/${p_id}/start-consultation"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
            - call: "POST /playground/projects/${p_id}/play-areas"
              payload: { age_group: "PRESCHOOL_2_5", axis_origin_cm: 0, axis_length_cm: 1200, surfacing_material: "ENGINEERED_WOOD_FIBER", surfacing_depth_cm: 30 }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { a_id: $.data.id }
            - call: "POST /playground/play-areas/${a_id}/placements"
              payload: { component_model_id: "${m_post_id}", color_choice: "FOREST_GREEN", x_start_cm: 200, quantity: 3 }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { pl_id: $.data.id }
            - call: "POST /playground/placements/${pl_id}/validate"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
            - call: "POST /playground/projects/${p_id}/renderings"
              payload: { pinned_standard_id: "${std_id}" }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { r_id: $.data.id }
          trigger:
            # --- read the project version the writer will hold on to
            - call: "GET /playground/projects/${p_id}"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { proj_ver_stale: $.data.version, status_before_votes: $.data.design_status }
            # --- a concurrent writer posts a vote batch, which bumps DesignProject.version
            - call: "POST /playground/renderings/${r_id}/community-votes"
              payload: { yes_votes: 15, no_votes: 10 }
              as: ClientRepresentative
              as_user_id: "client-1"
              captures: { approval_pct: $.data.community_approval_pct }
            # --- the held version is now stale
            - call: "POST /playground/quotes"
              payload: { project_id: "${p_id}", rendering_id: "${r_id}", variant: "FIRM", valid_until: "2026-12-31", expected_project_version: "${proj_ver_stale}" }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { err_stale: $.data.error_id }
            - call: "GET /playground/quotes?project_id=${p_id}"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { quote_count_after_412: $.meta.total_count }
            # --- re-read and retry the identical body with the fresh version
            - call: "GET /playground/projects/${p_id}"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { proj_ver_fresh: $.data.version }
            - call: "POST /playground/quotes"
              payload: { project_id: "${p_id}", rendering_id: "${r_id}", variant: "FIRM", valid_until: "2026-12-31", expected_project_version: "${proj_ver_fresh}" }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { q_id: $.data.id, q_total: $.data.total_cents }
            - call: "GET /playground/projects/${p_id}"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { proj_ver_after_quote: $.data.version }
          assert:
            - "${status_before_votes} == RENDERED and ${approval_pct} == 60.0 (15 of 25 votes)"
            - "the vote batch bumped the project: ${proj_ver_fresh} == ${proj_ver_stale} + 1 (on a fresh database ${proj_ver_stale} == 3 - version 1 at create, 2 after start-consultation, 3 after the rendering; area and placement writes bump PlayArea, not DesignProject - and ${proj_ver_fresh} == 4; the +1 relation is the normative part)"
            - "the stale quote create returns HTTP 412 with ${err_stale} == ERR_STALE_PROJECT_VERSION per concurrency_rules.quote-create-stale-project"
            - "${quote_count_after_412} == 0: the rejected create wrote no Quote row, and DesignProject.${p_id}.version is still ${proj_ver_fresh} (the failed write did not bump it either)"
            - "the retry with the fresh version returns HTTP 201: ${q_total} == 84000 (subtotal 32250 = 10750 * 3 at the default colour, freight 51750 = 48000 + 1250 * 3, discount 0)"
            - "the successful quote create bumps the project again: ${proj_ver_after_quote} == ${proj_ver_fresh} + 1 (POST /playground/quotes declares 'increments DesignProject.version by 1'), so re-sending the same body a third time would itself now be stale"
            - "Quote.${q_id}.version == 1 and status == ISSUED"

      - name: job_reschedule_occ_rejects_an_installer_version_observed_before_a_second_booking
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers.optimistic_concurrency
          - concurrency_rules.job-reschedule-stale-installer
          - endpoints[POST /playground/installation-jobs/{id}/reschedule]
          - validations[priority=30]
          - validations[priority=64]
          - errors.ERR_STALE_INSTALLER_VERSION
          - calculations.installer_committed_crew_days
        distinguishing_aspect: >-
          The second concurrency_rules entry guards a DIFFERENT parent (CertifiedInstaller, not the job
          being written) and a different occ_field. The installer version is read while it holds one
          booking, then a second booking for the same installer bumps it; the reschedule carrying the
          observed version must fail 412 ERR_STALE_INSTALLER_VERSION and leave the original window
          intact, and the retry with the re-read version must both move the window and re-derive
          committed_crew_days. An implementation that validates expected_installer_version against the
          JOB's version passes only by accident when the two counters happen to agree - here they do not
          (the job has been written once, the installer twice).
        test_recipe:
