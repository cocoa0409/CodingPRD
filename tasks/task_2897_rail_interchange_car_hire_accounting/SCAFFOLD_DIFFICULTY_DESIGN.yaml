  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: reclaim_movement_not_closed_at_12_masks_window_outside_movement_at_33
        grounds:
          - validations.priority_12_ERR_MOVEMENT_NOT_CLOSED
          - validations.priority_33_ERR_RECLAIM_WINDOW_OUTSIDE_MOVEMENT
          - validations.priority_26_ERR_RECLAIM_EVIDENCE_MISSING
          - validations.priority_41_ERR_RECLAIM_WINDOW_TOO_SHORT
          - endpoints.POST_car-hire_reclaim-claims
        distinguishing_aspect: |
          One byte-identical payload violates BOTH priority 12 (the parent movement is
          still OPEN) and priority 33 (the 24-hour window lies wholly before start_at).
          The response must be 409 ERR_MOVEMENT_NOT_CLOSED, never 422
          ERR_RECLAIM_WINDOW_OUTSIDE_MOVEMENT, and never the priority-26 evidence error
          (bad_order_from IS set, so rule 26 is satisfied even though the claimed window
          sits outside the bad-order stamp) or the priority-41 duration error (the window
          is exactly MIN_RECLAIM_HOURS). Closing the segment removes only the priority-12
          violation, and the SAME payload then returns 422
