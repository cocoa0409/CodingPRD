          setup:
            - "Logical clock at 2026-08-05T00:00:00Z; customer Full Trailer Bakery ACTIVE, credit_limit_cents 5000000, min_drop_cents 25000."
            - "Flour SKU FLR-HRW-50 (GLUTEN, list 42, index NONE) with lot LOT-FLR-9001 of 50000 lb in OPEN GLUTEN zone."
            - "One BAGGED order with a single 20000 lb flour line, submitted (subtotal 814800, fuel 20370, rebate 8148, total 827022) and allocated."
            - "Route R-FULL-01 for 2026-09-15 with vehicle_capacity_lb 20000 and service_buffer_minutes 30, carrying that one order on window 08:00-10:00."
