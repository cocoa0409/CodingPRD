              captures: { p_total1: $.data.total_payment_cents, p_count1: $.data.final_determination_count, p_adm1: $.data.total_admissions }
            - call: "GET /ltch/stays"
              payload: { clinical_status: "DISCHARGED" }
              as: ComplianceOfficer
              captures: { list_id: "$.data[0].id", list_pay: "$.data[0].payment_review_status" }
          assert:
            - "a_covered == 0 and a_pay == PENDING at admission - nothing is pre-computed"
            - "The discharge response body alone already carries the whole cascade result: w_status == DISCHARGED, w_covered == 14, w_thr == 25, w_sso == true, w_pct == 25.20, w_pay == PRICED and w_disch == 2026-08-15T00:00:00Z - no follow-up read is needed to see them"
            - "The immediately following read agrees field for field: r_status == w_status, r_covered == w_covered, r_thr == w_thr, r_sso == w_sso, r_pct == w_pct and r_pay == w_pay"
            - "det560_status == DRAFT with det560_total == 1512000 and det560_priced_by == SYSTEM - the child row created inside the discharge request is already listed on the next call, with no settle delay"
            - "rev560_status == OPEN, rev560_score == 67 and rev560_band == MODERATE - level 3 of the cascade is visible too, and because the band is not HIGH no query was auto-issued (GET /ltch/documentation-queries?stay_id=${stay560_id} returns an empty list with total_count 0)"
            - "rev560_status2 == CLEARED in the resolve response itself"
            - "fin_status == FINAL and fin_total == 1512000 in the finalize response body"
            - "p_total0 == 0 and p_count0 == 0 at creation; p_total1 == 1512000 and p_count1 == 1 on the read that immediately follows the finalize - the ledger is never observed lagging behind a FINAL determination"
            - "p_adm1 == 1 - the admit-time counter increment was likewise immediate"
            - "list_id == ${stay560_id} and list_pay == FINALIZED - the collection index reflects both writes with no reindex delay"
            - "Repeating any of the reads returns byte-identical payloads; no assertion in this recipe requires a sleep, retry or polling loop, and no response carries a pending, queued or eventual marker"
