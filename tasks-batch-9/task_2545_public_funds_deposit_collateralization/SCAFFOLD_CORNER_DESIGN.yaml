            - "SECOND CURE: Depository.${dep_id}.open_margin_call_count == 0 and collateral_posture == 'COMPLIANT' (consecutive_deficiency_runs is still 1, below FROZEN_TRIGGER_RUNS 3, so the posture is allowed to recover without a new run)"
            - "SECOND CURE: DepositAccount.${acct_id}.assigned_collateral_value_cents == 78750000, coverage_ratio_bps == 10000, collateral_status == 'SECURED'; PublicUnit.${unit_id}.exposure_status == 'NORMAL'"
            - "Depository.${dep_id}.risk_score_bps and risk_grade are UNCHANGED by the cures (D / 4250) — the grade is written only by an MTM run, never by a cure"

      - name: forward_looking_runoff_projection_variants
        claim_type: forward_looking
