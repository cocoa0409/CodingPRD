            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/families"
              payload: { display_name: "Im", email: "im@x.com", num_children: 2, required_tier: "BASIC", wallet_balance_cents: 100000 }
              as: PlatformAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /marketplace/caregivers"
              payload: { full_name: "Dot", email: "dot@x.com", hourly_rate_floor_cents: 1500 }
              as: PlatformAdmin
              captures: { cg_id: $.data.id }
            - call: "POST /marketplace/caregivers/${cg_id}/availability"
              payload: { availability_status: "AVAILABLE" }
              as: Caregiver
              as_user_id: "${cg_id}"
            - call: "POST /marketplace/background-checks"
              payload: { caregiver_id: "${cg_id}", requested_tier: "BASIC" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /marketplace/background-checks/${bc_id}/start"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/background-checks/${bc_id}/adjudicate"
              payload: { decision: "CLEAR" }
              as: PlatformAdmin
            - call: "POST /marketplace/job-postings"
              payload: { family_id: "${fam_id}", title: "Imp", care_type: "ONE_TIME", family_pay_rate_cents: 2000, required_tier: "BASIC" }
              as: Family
              as_user_id: "${fam_id}"
              captures: { jp_id: $.data.id }
            - call: "POST /marketplace/bookings"
              payload: { family_id: "${fam_id}", caregiver_id: "${cg_id}", job_posting_id: "${jp_id}", agreed_rate_cents: 2000, scheduled_start: "2026-03-26T08:00:00Z", scheduled_end: "2026-03-26T14:00:00Z", recurrence_count: 1 }
              as: Family
              as_user_id: "${fam_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /marketplace/bookings/${bk_id}/confirm"
              payload: {}
              as: Caregiver
              as_user_id: "${cg_id}"
          trigger:
            - call: "GET /marketplace/families/${fam_id}"
              payload: {}
              as: Family
              as_user_id: "${fam_id}"
          assert:
            - "Family.${fam_id}.escrow_reserved_cents == 13200"
            - "Family.${fam_id}.escrow_available_cents == 86800"

