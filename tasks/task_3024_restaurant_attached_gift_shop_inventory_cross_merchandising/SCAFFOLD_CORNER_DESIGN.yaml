            - *c_loc
            - *c_item_a
            - *c_day_open
            - call: "POST /retail-ops/receipts"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", receipt_number: "R-1042-0051", lines: [{ item_id: "${item_a_id}", quantity: 1, unit_price_cents: 6400, discount_pct: 0.0, line_kind: "RETAIL" }], restaurant_share_cents: 0, restaurant_share_basis: "CHECK_TOTAL", payment_method: "CARD" }
              as: RetailLead
            - call: "POST /retail-ops/receipts"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", receipt_number: "R-1042-0052", lines: [{ item_id: "${item_a_id}", quantity: 1, unit_price_cents: 6400, discount_pct: 0.0, line_kind: "RETAIL" }], restaurant_share_cents: 0, restaurant_share_basis: "CHECK_TOTAL", payment_method: "CARD" }
              as: RetailLead
            - call: "POST /retail-ops/receipts"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", receipt_number: "R-1042-0053", lines: [{ item_id: "${item_a_id}", quantity: 1, unit_price_cents: 6400, discount_pct: 0.0, line_kind: "RETAIL" }], restaurant_share_cents: 0, restaurant_share_basis: "CHECK_TOTAL", payment_method: "CARD" }
              as: RetailLead
          trigger:
            - call: "POST /retail-ops/store-days/${day_id}/guest-counts"
              payload: { expected_store_day_version: "${day_v}", restaurant_guest_count: 90, restaurant_sales_cents: 900000, waiting_area_shopper_count: 30, waiting_area_converted_count: 15 }
              as: BoutiqueManager
              captures: { idx_at_three: $.data.waiting_area_conversion_index_bps, txns: $.data.retail_transaction_count }
          assert:
            - "StoreDay.${day_id}.retail_transaction_count == 3 at the time of the reading"
            - "the raw rate is round_half_up(15 * 10000 / (30 + 1)) == 4839"
            - "the decay is min(3 * 0.10, 0.50) == 0.30, so the decayed rate is round_half_up(4839 * 0.70) == 3387"
            - "StoreDay.${day_id}.waiting_area_conversion_index_bps == 2032 — the tip share is 0 because no check is tip-eligible yet, so the weighted sum is round_half_up((6000*3387 + 4000*0) / 10000)"
            - "at five recorded transactions the decay hits its 0.50 cap, giving round_half_up(4839*0.50) == 2420 and an index of 1452, so a sixth transaction would not move it further"

      - name: tip_eligibility_rounds_shift_length_up_before_comparing
