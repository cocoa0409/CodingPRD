            - call: "POST /boost-campaigns"
              payload: { client_id: "${cid}", content_item_id: "${ci}", requested_budget_cents: 150000, daily_cap_cents: 75000, duration_days: 2 }
              as: FinanceController
              captures: { bc: $.data.id }
            - call: "GET /clients/${cid}"
              payload: {}
              as: FinanceController
              captures: { cver: $.data.version }
          trigger:
            - call: "POST /boost-campaigns/${bc}/reserve"
              payload: { expected_client_version: "${cver}" }
              as: FinanceController
              captures: { st: $.data.status, reserved: $.data.reserved_budget_cents }
          assert:
            - "reserve response data.status == RESERVED"
            - "reserve response data.reserved_budget_cents == 150000"
