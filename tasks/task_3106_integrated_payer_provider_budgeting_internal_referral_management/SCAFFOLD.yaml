    side_effects: []

  - method: GET
    path: "/network-services/{id}"
    description: "Get one NetworkService"
    roles: [PlatformAdmin, RegionalFinanceOfficer, AccessScheduler, UtilizationReviewer, QualityReviewBoard, BudgetAppropriationsCommittee, CareTeamMember, Provider]
    code: 200
    input: []
    output: NetworkService
    side_effects: []

  - method: GET
    path: "/outside-service-claims/{id}"
    description: "Get one OutsideServiceClaim"
    roles: [PlatformAdmin, RegionalFinanceOfficer, UtilizationReviewer, BudgetAppropriationsCommittee]
    code: 200
    input: []
    output: OutsideServiceClaim
    side_effects: []

  - method: GET
    path: "/capacity-plans/{id}"
    description: "Get one CapacityPlan"
    roles: [PlatformAdmin, RegionalFinanceOfficer, AccessScheduler, BudgetAppropriationsCommittee]
    code: 200
    input: []
    output: CapacityPlan
    side_effects: []

  - method: GET
    path: "/member-transfers/{id}"
    description: "Get one MemberTransfer"
    roles: [PlatformAdmin, RegionalFinanceOfficer, BudgetAppropriationsCommittee]
    code: 200
    input: []
    output: MemberTransfer
    side_effects: []

  - method: GET
    path: "/quality-metrics/{id}"
    description: "Get one QualityMetric"
    roles: [PlatformAdmin, RegionalFinanceOfficer, QualityReviewBoard, BudgetAppropriationsCommittee]
    code: 200
    input: []
    output: QualityMetric
    side_effects: []

  - method: GET
    path: "/referential-integrations/{id}"
