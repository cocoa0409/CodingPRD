      - name: host_assignment_must_stay_inside_one_event_and_one_build_window
        claim_type: cross_entity_validation
        grounds: >-
          validations[priority=60] ("the HospitalityBuild referenced by
          hospitality_build_id belongs to the same Event as the Booking
          referenced by booking_id, and the OnSiteHost's shift lies inside that
          build's service window") -> ERR_ASSIGNMENT_SCOPE_MISMATCH 422 on
          POST /host-assignments.
        distinguishing_aspect: >-
          One rule carries two independent joins, so it is probed twice against
          the same fixture: a build that is APPROVED and perfectly valid in
          itself but hangs off a DIFFERENT event, and then a shift that runs one
          minute past the correct build's service window. The cross-event build is
          deliberately APPROVED so that priority 47 cannot answer first and mask
          the scope check.
