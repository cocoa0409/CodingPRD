            - "SigningCredential.${lcert_id}.key_custody == LOCAL_KEYCHAIN"

      - name: activate_a_profile_whose_linked_cert_was_revoked_returns_linked_cert_not_active
        claim_type: guarded transitions
        grounds:
          - state_machines.SigningCredential.transitions.PENDING_ACTIVATION_to_ACTIVE
          - errors.ERR_LINKED_CERT_NOT_ACTIVE
        distinguishing_aspect: "The profile's own interval and custody are fine; it is refused 409 ERR_LINKED_CERT_NOT_ACTIVE purely because the cross-entity guard on linked_cert_id resolves to a REVOKED credential."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Northwind account with a PENDING_ACTIVATION PROVISIONING_PROFILE linked to a DISTRIBUTION_CERT that has been manually REVOKED."
          setup_api_calls:
            - *c_clock
            - *c_acct
            - *c_cert
            - *c_acct_reread
            - *c_cert_act
            - *c_prof
            - &c_cert_revoke
              call: "POST /signing-credentials/${cert_id}/revoke"
              payload: {}
              as: PublisherAdmin
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /signing-credentials/${prof_id}/activate"
              payload: {}
              as: PublisherAdmin
              as_user_id: "${acct_id}"
          assert:
            - "the response status is 409 and error.error_id == ERR_LINKED_CERT_NOT_ACTIVE"
            - "SigningCredential.${prof_id}.status == PENDING_ACTIVATION"
            - "SigningCredential.${cert_id}.status == REVOKED"
            - "SigningCredential.${cert_id}.revocation_reason == MANUAL"
      - name: activating_a_second_distribution_cert_supersedes_the_first_one
        claim_type: Side Effect Execution
        grounds:
          - state_machines.SigningCredential.transitions.PENDING_ACTIVATION_to_ACTIVE.side_effects
          - state_machines.SigningCredential.states.REVOKED
          - entities.SigningCredential.fields.revocation_reason
        distinguishing_aspect: "Activating a second IOS DISTRIBUTION_CERT on the same account demotes the incumbent to REVOKED with revocation_reason SUPERSEDED, and the demotion is scoped to the matching (account, credential_type, platform) triple so the IOS PROVISIONING_PROFILE keeps its ACTIVE status."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Northwind account with an ACTIVE IOS DISTRIBUTION_CERT, an ACTIVE IOS PROVISIONING_PROFILE linked to it, and a second PENDING_ACTIVATION IOS DISTRIBUTION_CERT whose interval covers the clock."
          setup_api_calls:
            - *c_clock
            - *c_acct
            - *c_cert
            - *c_acct_reread
            - *c_cert_act
            - &c_cert_b
              call: "POST /signing-credentials"
              payload: { expected_publisher_account_version: "${acct_v2}", publisher_account_id: "${acct_id}", credential_type: "DISTRIBUTION_CERT", platform: "IOS", key_custody: "HSM", not_before: "2026-07-15T00:00:00Z", not_after: "2027-07-15T00:00:00Z", entitlements: ["IN_APP_PURCHASE"] }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
              captures: { cert_b_id: $.data.id }
          trigger:
            - call: "POST /signing-credentials/${cert_b_id}/activate"
              payload: {}
              as: PublisherAdmin
              as_user_id: "${acct_id}"
          assert:
            - "the response status is 200 and data.status == ACTIVE"
