# =============================================================================
# PRD Benchmark Scaffold — task_2502_premium_sports_hospitality_packages
# §1.0 Response Envelope · §1.1 Entities · §1.2 State Machines
# §1.2.1 Concurrency Rules · §1.3 Calculations · §1.4 Validations
# §1.5 Endpoints · §1.6 Errors · §1.7 RBAC
#
# Difficulty target: ABOVE Expert (§0.4) — 12 entities, 52 endpoints,
# 48 error codes, 48 validation rows, 10 calculations (2 dual-variant),
# 10 state machines (2 non-linear on different entities), 3 OCC rules.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2502. Premium Sports Hospitality Packages (sports hospitality provider): rights acquisition from teams and events for tickets, hospitality space and access experiences with guaranteed minimums, package construction across tickets, hotel, transportation and exclusive experiences with pricing tiers, inventory allocation between individual sales, corporate clients and travel partners, event logistics including venue hospitality build-out, catering and staffing, payment schedules, cancellation policy and event postponement handling with rebooking, ticket allocation timing from the rights holder with fulfillment risk management, client servicing with itineraries, credentials and on-site hosts, margin analysis by event with unsold inventory exposure

domain_name: premium-sports-hospitality-packages

# Flat topology (§0.3): every entity is a peer collection at the API root and
# every relationship is expressed with an explicit foreign key in the request
# body, never by nesting in the URL path. There is therefore no single
# top-level resource path to hoist into api_prefix.
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - ops_run_checkpoint

  entity_topology: flat
  state_machine_shape: parallel

  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate

  role_model: segregation_of_duties
  consistency_model: immediate

  notes: |
    The core challenge is a finite pool of rights-holder inventory that is
    promised (RightsDeal.contracted_units), released in tranches on the rights
    holder's own timetable (ReleaseTranche), waterfall-allocated across three
    sales channels (AllocationBlock), and then committed by client Bookings.
    Every hop can under-deliver, and each under-delivery must propagate
    transitively back through the chain without leaking units or cents.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------------------
  - name: Event
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Public name of the sporting fixture."
      - name: sport
        type: enum
        source: input
        description: "Sport discipline of the fixture."
        constraints: "one of {FOOTBALL, BASKETBALL, MOTORSPORT, TENNIS, RUGBY}"
      - name: venue_name
        type: string
        source: input
        description: "Venue hosting the fixture."
      - name: hospitality_zone_codes
        type: array
        source: input
        description: "Zone codes inside the venue that may host a hospitality build-out; each element is a string."
        constraints: "non-empty array of unique strings"
      - name: event_date
        type: datetime
        source: input
        description: "Current scheduled kick-off instant (ISO 8601 UTC, three fractional digits)."
      - name: original_event_date
        type: datetime
        source: system
        description: "Kick-off instant as first scheduled; stamped on the first postponement and never overwritten afterwards."
        default: null
      - name: status
        type: enum
        source: system
        description: "Event lifecycle state."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, POSTPONED, RESCHEDULED, CANCELLED, COMPLETED}"
      - name: rebook_deadline_at
        type: datetime
        source: system
        description: "Last instant at which a REBOOK_PENDING Booking on this Event may be rebooked; set on postponement to postponed_at + REBOOK_WINDOW_DAYS."
        default: null
      - name: postponement_count
        type: integer
        source: system
        description: "Number of times this Event has entered POSTPONED."
        default: 0
      - name: fulfillment_risk_score
        type: integer
        source: computed
        description: "0-100 score from calculations.event_fulfillment_risk_score, recomputed on every inventory, booking or event-status mutation touching this Event."
        default: 0
      - name: risk_posture
        type: enum
        source: computed
        description: "Threshold band over fulfillment_risk_score: CRITICAL when score >= 70, ELEVATED when score >= 40, otherwise NORMAL."
        default: NORMAL
        constraints: "one of {NORMAL, ELEVATED, CRITICAL}"

  # ---------------------------------------------------------------------------
  - name: RightsDeal
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the fixture whose inventory this deal acquires."
      - name: rights_holder_name
        type: string
        source: input
        description: "Team, promoter or federation selling the rights."
      - name: inventory_type
        type: enum
        source: input
        description: "Category of inventory acquired under this deal."
        constraints: "one of {TICKET, HOSPITALITY_SPACE, ACCESS_EXPERIENCE}"
      - name: contracted_units
        type: integer
        source: input
        description: "Units the rights holder has contracted to deliver."
        constraints: ">= 1"
      - name: guaranteed_minimum_units
        type: integer
        source: input
        description: "Units the provider must pay for whether or not they are released or sold."
        constraints: ">= 0 and <= contracted_units"
      - name: unit_cost_cents
        type: integer
        source: input
        description: "Acquisition cost per released unit, in cents."
        constraints: ">= 1"
      - name: deal_status
        type: enum
        source: system
        description: "Deal lifecycle state."
        default: DRAFT
        constraints: "one of {DRAFT, COMMITTED, PARTIALLY_RELEASED, FULLY_RELEASED, SHORTFALL_DECLARED, SETTLED, TERMINATED}"
      - name: released_units
        type: integer
        source: computed
        description: "Sum of ReleaseTranche.confirmed_units over tranches of this deal whose tranche_state IN {CONFIRMED, SHORT_CONFIRMED}."
        default: 0
      - name: shortfall_units
        type: integer
        source: computed
        description: "max(0, guaranteed_minimum_units - released_units)."
        default: 0
      - name: unallocated_units
        type: integer
        source: computed
        description: "released_units minus the sum of AllocationBlock.allocated_units over this deal's blocks whose block_state IN {OPEN, EXHAUSTED}, minus the sum of AllocationBlock.allocated_units frozen on RECALLED blocks at recall time."
        default: 0
      - name: minimum_liability_cents
        type: integer
        source: computed
        description: "Cost owed to the rights holder per calculations.rights_deal_minimum_liability."
        default: 0
      - name: committed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the RightsManager who moved the deal DRAFT -> COMMITTED."
        default: null
      - name: settled_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the deal reached SETTLED."
        default: null

  # ---------------------------------------------------------------------------
  - name: ReleaseTranche
    parent: null
    common_fields: true
    fields:
      - name: rights_deal_id
        type: string
        source: input
        description: "FK -> RightsDeal.id; the deal this promised release belongs to."
      - name: promised_units
        type: integer
        source: input
        description: "Units the rights holder promised to release in this tranche."
        constraints: ">= 1"
      - name: promised_release_at
        type: datetime
        source: input
        description: "Instant by which the rights holder promised to confirm this tranche; a PENDING tranche past this instant lapses on the next operations daily run."
      - name: tranche_state
        type: enum
        source: system
        description: "Tranche lifecycle state."
        default: PENDING
        constraints: "one of {PENDING, CONFIRMED, SHORT_CONFIRMED, LAPSED}"
      - name: confirmed_units
        type: integer
        source: system
        description: "Units actually released; equals promised_units for CONFIRMED, is strictly between 0 and promised_units for SHORT_CONFIRMED, and is 0 for PENDING and LAPSED."
        default: 0
      - name: confirmed_at
        type: datetime
        source: system
        description: "Logical-clock instant of confirmation."
        default: null
      - name: lapsed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the operations daily run lapsed this tranche."
        default: null

  # ---------------------------------------------------------------------------
  - name: AllocationBlock
    parent: null
    common_fields: true
    fields:
      - name: rights_deal_id
        type: string
        source: input
        description: "FK -> RightsDeal.id; the deal whose released units this block draws from."
      - name: channel
        type: enum
        source: input
        description: "Sales channel this block reserves inventory for."
        constraints: "one of {INDIVIDUAL, CORPORATE, TRAVEL_PARTNER}"
      - name: target_units
        type: integer
        source: input
        description: "Units this channel wants; the waterfall never allocates more than this."
        constraints: ">= 1"
      - name: priority_rank
        type: integer
        source: input
        description: "Waterfall fill order; 1 fills first, larger numbers fill later."
        constraints: ">= 1"
      - name: allocated_units
        type: integer
        source: computed
        description: "Units the waterfall has assigned to this block; never exceeds target_units."
        default: 0
      - name: committed_units
        type: integer
        source: computed
        description: "Sum over Bookings whose allocation_block_id is this block and whose fulfillment_status IN {ALLOCATED, CREDENTIALED, DELIVERED} of (Booking.units * PackageProduct.tickets_per_package)."
        default: 0
      - name: released_back_units
        type: integer
        source: computed
        description: "Cumulative units returned to this block by Booking cancellation, revert or rebook since creation."
        default: 0
      - name: block_state
        type: enum
        source: system
        description: "OPEN while allocated_units < target_units, EXHAUSTED once allocated_units == target_units, RECALLED once the rights manager pulls the block."
        default: OPEN
        constraints: "one of {OPEN, EXHAUSTED, RECALLED}"
      - name: recalled_at
        type: datetime
        source: system
        description: "Logical-clock instant of recall."
        default: null

  # ---------------------------------------------------------------------------
  - name: PackageProduct
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the fixture this package is built around."
      - name: name
        type: string
        source: input
        description: "Commercial name of the package."
      - name: tier
        type: enum
        source: input
        description: "Pricing tier; selects TIER_MULTIPLIER in calculations.package_list_pricing."
        constraints: "one of {BRONZE, SILVER, GOLD, PLATINUM}"
      - name: tickets_per_package
        type: integer
        source: input
        description: "Rights-holder ticket units consumed by one unit of this package."
        constraints: ">= 1"
      - name: hotel_nights
        type: integer
        source: input
        description: "Hotel nights included per package unit."
        default: 0
      - name: transport_included
        type: boolean
        source: input
        description: "Whether ground transportation is bundled."
        default: false
      - name: min_margin_pct
        type: number
        source: input
        description: "Floor on margin_pct that must hold at publish time, as a fraction with four decimal places."
        default: 0.25
      - name: package_status
        type: enum
        source: system
        description: "Package lifecycle state."
        default: DRAFT
        constraints: "one of {DRAFT, PRICED, PUBLISHED, CLOSED}"
      - name: base_cost_cents
        type: integer
        source: computed
        description: "Sum of PackageComponent.line_cost_cents over this package's components."
        default: 0
      - name: component_price_subtotal_cents
        type: integer
        source: computed
        description: "Sum of PackageComponent.line_price_cents over this package's components, each line already rounded (round-per-line-then-sum is pinned)."
        default: 0
      - name: list_price_cents
        type: integer
        source: computed
        description: "Published price of one package unit per calculations.package_list_pricing."
        default: 0
      - name: margin_pct
        type: number
        source: computed
        description: "(list_price_cents - base_cost_cents) / list_price_cents, rounded half-up to four decimal places; 0 while list_price_cents is 0."
        default: 0
      - name: priced_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator whose price call produced the current list_price_cents."
        default: null
      - name: priced_at
        type: datetime
        source: system
        description: "Logical-clock instant of the latest pricing."
        default: null
      - name: published_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CommercialDirector who published the package."
        default: null
      - name: published_at
        type: datetime
        source: system
        description: "Logical-clock instant of publication."
        default: null

  # ---------------------------------------------------------------------------
  - name: PackageComponent
    parent: null
    common_fields: true
    fields:
      - name: package_product_id
        type: string
        source: input
        description: "FK -> PackageProduct.id; the package this line item belongs to."
      - name: component_type
        type: enum
        source: input
        description: "Kind of deliverable this line supplies."
        constraints: "one of {TICKET, HOTEL, TRANSPORT, EXPERIENCE, CATERING}"
      - name: descriptor
        type: string
        source: input
        description: "Human-readable description of the line item."
      - name: quantity
        type: integer
        source: input
        description: "Units of this component per package unit."
        constraints: ">= 1"
      - name: unit_cost_cents
        type: integer
        source: input
        description: "Cost of one unit of this component, in cents."
        constraints: ">= 0"
      - name: markup_pct
        type: number
        source: input
        description: "Markup applied to this line, as a fraction with four decimal places."
        constraints: ">= 0 and <= 5"
      - name: sequence_no
        type: integer
        source: input
        description: "Line ordinal inside the package; unique per package_product_id and pins the rounding order of calculations.package_component_line_pricing."
        constraints: ">= 1, unique within package_product_id"
      - name: line_cost_cents
        type: integer
        source: computed
        description: "unit_cost_cents * quantity."
        default: 0
      - name: line_price_cents
        type: integer
        source: computed
        description: "round_half_up(line_cost_cents * (1 + markup_pct)) — rounded at the line, before any summation."
        default: 0

  # ---------------------------------------------------------------------------
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Client legal or personal name."
      - name: client_type
        type: enum
        source: input
        description: "Commercial category of the buyer."
        constraints: "one of {INDIVIDUAL, CORPORATE, TRAVEL_PARTNER}"
      - name: credit_limit_cents
        type: integer
        source: input
        description: "Maximum outstanding exposure the provider will carry for this client, in cents."
        default: 0
      - name: client_status
        type: enum
        source: system
        description: "Credit standing; moved by the operations daily run from overdue-installment counts."
        default: ACTIVE
        constraints: "one of {ACTIVE, ON_HOLD, BLOCKED}"
      - name: outstanding_cents
        type: integer
        source: computed
        description: "Unpaid exposure per calculations.client_credit_exposure."
        default: 0
      - name: overdue_installment_count
        type: integer
        source: computed
        description: "Count of PaymentInstallment rows with installment_state == OVERDUE across all of this client's Bookings."
        default: 0

  # ---------------------------------------------------------------------------
  - name: Booking
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the buyer."
      - name: package_product_id
        type: string
        source: input
        description: "FK -> PackageProduct.id; the package purchased."
      - name: allocation_block_id
        type: string
        source: system
        description: "FK -> AllocationBlock.id; set when the booking is allocated and cleared to null on revert, rebook or cancellation."
        default: null
      - name: channel
        type: enum
        source: input
        description: "Sales channel of this booking; must equal the channel of the AllocationBlock it is later allocated against."
        constraints: "one of {INDIVIDUAL, CORPORATE, TRAVEL_PARTNER}"
      - name: units
        type: integer
        source: input
        description: "Number of package units purchased."
        constraints: ">= 1"
      - name: risk_override_ack
        type: boolean
        source: input
        description: "Explicit acknowledgement required when the Event's risk_posture is CRITICAL."
        default: false
      - name: gross_price_cents
        type: integer
        source: computed
        description: "PackageProduct.list_price_cents * units."
        default: 0
      - name: volume_discount_pct
        type: number
        source: computed
        description: "Volume tier selected from units alone per calculations.booking_net_price step 2."
        default: 0
      - name: discounted_subtotal_cents
        type: integer
        source: computed
        description: "gross_price_cents minus the rounded volume discount."
        default: 0
      - name: partner_commission_cents
        type: integer
        source: computed
        description: "Channel commission, keyed on discounted_subtotal_cents."
        default: 0
      - name: guarantee_surcharge_cents
        type: integer
        source: computed
        description: "Fulfillment-guarantee surcharge, keyed on discounted_subtotal_cents (never on net_price_cents)."
        default: 0
      - name: net_price_cents
        type: integer
        source: computed
        description: "discounted_subtotal_cents - partner_commission_cents + guarantee_surcharge_cents."
        default: 0
      - name: paid_cents
        type: integer
        source: computed
        description: "Sum of PaymentInstallment.paid_amount_cents over this booking's installments, less refund_cents."
        default: 0
      - name: cancellation_fee_cents
        type: integer
        source: computed
        description: "Fee retained on cancellation per calculations.booking_cancellation_settlement."
        default: 0
      - name: refund_cents
        type: integer
        source: computed
        description: "max(0, pre-cancellation paid_cents - cancellation_fee_cents)."
        default: 0
      - name: balance_due_cents
        type: integer
        source: computed
        description: "max(0, cancellation_fee_cents - pre-cancellation paid_cents)."
        default: 0
      - name: settlement_variant
        type: enum
        source: system
        description: "Which calculations.booking_cancellation_settlement variant produced cancellation_fee_cents."
        default: null
        constraints: "null until cancellation, then one of {TIER_SCHEDULE, COST_RECOVERY}"
      - name: payment_status
        type: enum
        source: system
        description: "Money dimension of the booking's parallel state machine."
        default: UNPAID
        constraints: "one of {UNPAID, DEPOSIT_PAID, PAID_IN_FULL, REFUNDED, SETTLEMENT_DUE, SETTLED}"
      - name: fulfillment_status
        type: enum
        source: system
        description: "Delivery dimension of the booking's parallel state machine."
        default: RESERVED
        constraints: "one of {RESERVED, ALLOCATED, CREDENTIALED, DELIVERED, REBOOK_PENDING, CANCELLED}"
      - name: credentials_issued_count
        type: integer
        source: system
        description: "Number of credentials minted for this booking; equals units * (tickets_per_package + 1) after issuance."
        default: 0
      - name: credential_serial_prefix
        type: string
        source: system
        description: "Serial prefix stamped on this booking's credentials at issuance."
        default: null
      - name: itinerary
        type: object
        source: computed
        description: "Servicing itinerary derived at issuance with pinned keys {event_name, event_date, venue_name, hotel_nights, transport_included, credential_count, host_names}; host_names lists OnSiteHost.full_name over this booking's HostAssignments with assignment_state == ASSIGNED, ordered by HostAssignment.created_at ASC."
        default: null
      - name: rebook_count
        type: integer
        source: system
        description: "Number of times this booking has been rebooked onto a different package."
        default: 0

  # ---------------------------------------------------------------------------
  - name: PaymentInstallment
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: system
        description: "FK -> Booking.id; the booking whose schedule this installment belongs to. Installments are only ever created as a side effect of booking creation, rebooking or cancellation settlement."
      - name: sequence_no
        type: integer
        source: system
        description: "1-based ordinal inside the booking's schedule; unique per booking_id."
      - name: amount_cents
        type: integer
        source: system
        description: "Amount due for this installment, in cents."
      - name: due_at
        type: datetime
        source: system
        description: "Instant this installment falls due."
      - name: installment_kind
        type: enum
        source: system
        description: "SCHEDULE for the purchase schedule, SETTLEMENT for the single installment raised when a cancellation leaves a balance due."
        default: SCHEDULE
        constraints: "one of {SCHEDULE, SETTLEMENT}"
      - name: installment_state
        type: enum
        source: system
        description: "Installment lifecycle state."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, PAID, OVERDUE, VOIDED}"
      - name: paid_amount_cents
        type: integer
        source: system
        description: "Cents actually received against this installment."
        default: 0
      - name: paid_at
        type: datetime
        source: system
        description: "Logical-clock instant of payment."
        default: null
      - name: days_overdue
        type: integer
        source: computed
        description: "floor((logical_now - due_at) / 86400) when installment_state == OVERDUE, otherwise 0."
        default: 0

  # ---------------------------------------------------------------------------
  - name: HospitalityBuild
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the fixture this build-out serves."
      - name: zone_code
        type: string
        source: input
        description: "Venue zone occupied; must be a member of Event.hospitality_zone_codes."
      - name: service_window_start
        type: datetime
        source: input
        description: "First instant the zone is occupied by this build (inclusive)."
      - name: service_window_end
        type: datetime
        source: input
        description: "Last instant the zone is occupied by this build (inclusive); must be strictly after service_window_start."
      - name: space_units
        type: integer
        source: input
        description: "Hospitality-space units drawn for this build."
        constraints: ">= 1"
      - name: catering_covers
        type: integer
        source: input
        description: "Number of catering covers ordered."
        constraints: ">= 0"
      - name: staff_count
        type: integer
        source: input
        description: "Number of catering and hosting staff rostered."
        constraints: ">= 0"
      - name: build_cost_cents
        type: integer
        source: input
        description: "Build-out cost in cents."
        constraints: ">= 0"
      - name: catering_cost_cents
        type: integer
        source: input
        description: "Catering cost in cents."
        constraints: ">= 0"
      - name: staffing_cost_cents
        type: integer
        source: input
        description: "Staffing cost in cents."
        constraints: ">= 0"
      - name: build_state
        type: enum
        source: system
        description: "Build lifecycle state."
        default: PLANNED
        constraints: "one of {PLANNED, APPROVED, READY, CLOSED, CANCELLED}"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FinanceController who approved the build cost."
        default: null
      - name: total_cost_cents
        type: integer
        source: computed
        description: "build_cost_cents + catering_cost_cents + staffing_cost_cents."
        default: 0

  # ---------------------------------------------------------------------------
  - name: OnSiteHost
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Host's name as printed on the client itinerary."
      - name: languages
        type: array
        source: input
        description: "Language codes the host services clients in; each element is a string."
      - name: max_concurrent_bookings
        type: integer
        source: input
        description: "Aggregate capacity: how many ASSIGNED HostAssignments may overlap on this host at any single instant."
        default: 1
        constraints: ">= 1"
      - name: active_assignment_count
        type: integer
        source: computed
        description: "Count of this host's HostAssignments with assignment_state == ASSIGNED."
        default: 0

  # ---------------------------------------------------------------------------
  - name: HostAssignment
    parent: null
    common_fields: true
    fields:
      - name: on_site_host_id
        type: string
        source: input
        description: "FK -> OnSiteHost.id; the host rostered."
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the client booking being hosted."
      - name: hospitality_build_id
        type: string
        source: input
        description: "FK -> HospitalityBuild.id; the build-out the host works inside."
      - name: shift_start
        type: datetime
        source: input
        description: "Shift start (inclusive)."
      - name: shift_end
        type: datetime
        source: input
        description: "Shift end (exclusive); must be strictly after shift_start."
      - name: assignment_state
        type: enum
        source: system
        description: "Assignment lifecycle state."
        default: ASSIGNED
        constraints: "one of {ASSIGNED, RELEASED, VOIDED}"
      - name: released_at
        type: datetime
        source: system
        description: "Logical-clock instant the assignment was released or voided."
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # Event — branching + cyclic (SCHEDULED -> POSTPONED -> RESCHEDULED -> POSTPONED)
  - entity: Event
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: SCHEDULED
        to: POSTPONED
        trigger: "POST /events/{id}/postpone"
        actor: RightsManager
        preconditions:
          - "Event.status == SCHEDULED"
          - "when new_event_date is non-null it is strictly after the logical clock"
        side_effects:
          - "original_event_date = event_date when original_event_date is null (never overwritten afterwards); event_date = new_event_date when new_event_date is non-null, otherwise unchanged"
          - "postponement_count += 1; status = POSTPONED; rebook_deadline_at = logical_now + REBOOK_WINDOW_DAYS (= 21) days"
          - "CASCADE hop 2 — because Event.status became POSTPONED: every Booking whose package_product_id belongs to a PackageProduct of this Event and whose fulfillment_status IN {RESERVED, ALLOCATED, CREDENTIALED} moves to REBOOK_PENDING, processed in Booking.created_at ASC order"
          - "CASCADE hop 2b — for each Booking that was ALLOCATED or CREDENTIALED before hop 2: its AllocationBlock.committed_units -= units * PackageProduct.tickets_per_package, that block's released_back_units += the same amount, and Booking.allocation_block_id is set to null. block_state is NOT touched — it tracks allocation against target, not sales."
          - "CASCADE hop 3 — because each Booking entered REBOOK_PENDING: every PaymentInstallment of that booking with installment_state IN {SCHEDULED, OVERDUE} has due_at rewritten to Event.rebook_deadline_at and installment_state set to SCHEDULED"
          - "CASCADE hop 3b — because each Booking left CREDENTIALED: every HostAssignment of that booking with assignment_state == ASSIGNED moves to VOIDED with released_at = logical_now"
          - "CASCADE hop 4 — because those HostAssignments left ASSIGNED: each affected OnSiteHost.active_assignment_count is recomputed"
          - "CASCADE hop 4b — because those PaymentInstallments changed state and due date: each affected Client.outstanding_cents and Client.overdue_installment_count are recomputed"
          - "recompute calculations.event_fulfillment_risk_score and risk_posture for this Event"
        note: "Depth-4 transitive cascade; each hop is caused by the previous hop, not by the postpone call."
      - from: POSTPONED
        to: RESCHEDULED
        trigger: "POST /events/{id}/postpone"
        actor: RightsManager
        preconditions:
          - "Event.status == POSTPONED"
          - "new_event_date is non-null and strictly after the logical clock"
        side_effects:
          - "event_date = new_event_date; status = RESCHEDULED; rebook_deadline_at unchanged"
          - "REBOOK_PENDING Bookings are left in REBOOK_PENDING — the replacement date does not rebook them"
          - "recompute event_fulfillment_risk_score and risk_posture (the POSTPONED status weight drops out)"
        note: "Divergent branch on the same trigger: from SCHEDULED the call freezes bookings, from POSTPONED it only re-dates the fixture."
      - from: RESCHEDULED
        to: POSTPONED
        trigger: "POST /events/{id}/postpone"
        actor: RightsManager
        preconditions:
          - "Event.status == RESCHEDULED"
        side_effects:
          - "postponement_count += 1; status = POSTPONED; rebook_deadline_at = logical_now + REBOOK_WINDOW_DAYS (= 21) days; event_date = new_event_date when non-null"
          - "the same hop-2..hop-4 cascade as SCHEDULED -> POSTPONED runs again over Bookings still in {RESERVED, ALLOCATED, CREDENTIALED}"
          - "recompute event_fulfillment_risk_score and risk_posture"
        note: "Cycle edge — the replacement date itself collapses."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: RightsManager
        preconditions:
          - "Event.status IN {SCHEDULED, POSTPONED, RESCHEDULED}"
        side_effects:
          - "status = CANCELLED"
          - "every RightsDeal of this Event with deal_status NOT IN {SETTLED, TERMINATED} moves to TERMINATED; because a deal terminated, its PENDING ReleaseTranches move to LAPSED with lapsed_at = logical_now and its AllocationBlocks with block_state IN {OPEN, EXHAUSTED} move to RECALLED with recalled_at = logical_now"
          - "every PackageProduct of this Event with package_status != CLOSED moves to CLOSED"
          - "every Booking of this Event with fulfillment_status NOT IN {CANCELLED, DELIVERED} moves to CANCELLED with settlement_variant = TIER_SCHEDULE, cancellation_fee_cents = 0, refund_cents = paid_cents, balance_due_cents = 0, payment_status = REFUNDED, allocation_block_id = null (provider-caused cancellation waives the fee entirely)"
          - "because those Bookings were cancelled, every PaymentInstallment of theirs with installment_state IN {SCHEDULED, OVERDUE} moves to VOIDED, and because those installments were voided each affected Client.outstanding_cents and overdue_installment_count are recomputed"
          - "every HospitalityBuild of this Event with build_state IN {PLANNED, APPROVED} moves to CANCELLED and every one with build_state == READY moves to CLOSED; because those builds left the active set, HostAssignments of this Event's Bookings with assignment_state == ASSIGNED move to VOIDED and each affected OnSiteHost.active_assignment_count is recomputed"
          - "recompute event_fulfillment_risk_score and risk_posture"
      - from: POSTPONED
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: RightsManager
        preconditions:
          - "Event.status IN {SCHEDULED, POSTPONED, RESCHEDULED}"
        side_effects:
          - "identical to the SCHEDULED -> CANCELLED side-effect set"
      - from: RESCHEDULED
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: RightsManager
        preconditions:
          - "Event.status IN {SCHEDULED, POSTPONED, RESCHEDULED}"
        side_effects:
          - "identical to the SCHEDULED -> CANCELLED side-effect set"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /events/{id}/complete"
        actor: RightsManager
        preconditions:
          - "Event.status IN {SCHEDULED, RESCHEDULED}"
          - "Event.event_date <= logical clock"
          - "no Booking of this Event has fulfillment_status IN {RESERVED, REBOOK_PENDING}"
        side_effects:
          - "status = COMPLETED"
          - "every Booking of this Event with fulfillment_status IN {ALLOCATED, CREDENTIALED} moves to DELIVERED"
          - "every PackageProduct of this Event with package_status != CLOSED moves to CLOSED"
          - "every HospitalityBuild with build_state == READY moves to CLOSED; every one with build_state IN {PLANNED, APPROVED} moves to CANCELLED"
          - "every HostAssignment of this Event's Bookings with assignment_state == ASSIGNED moves to RELEASED with released_at = logical_now; each affected OnSiteHost.active_assignment_count is recomputed"
          - "GET /events/{id}/margin-report now defaults to the FINAL variant of calculations.event_margin_report"
      - from: RESCHEDULED
        to: COMPLETED
        trigger: "POST /events/{id}/complete"
        actor: RightsManager
        preconditions:
          - "Event.status IN {SCHEDULED, RESCHEDULED}"
          - "Event.event_date <= logical clock"
          - "no Booking of this Event has fulfillment_status IN {RESERVED, REBOOK_PENDING}"
        side_effects:
          - "identical to the SCHEDULED -> COMPLETED side-effect set"

  # ---------------------------------------------------------------------------
  # RightsDeal — cyclic (SHORTFALL_DECLARED re-opens when a fresh tranche is promised)
  - entity: RightsDeal
    initial_state: DRAFT
    terminal_states: [SETTLED, TERMINATED]
    transitions:
      - from: DRAFT
        to: COMMITTED
        trigger: "POST /rights-deals/{id}/commit"
        actor: RightsManager
        preconditions:
          - "RightsDeal.deal_status == DRAFT"
          - "Event.status IN {SCHEDULED, POSTPONED, RESCHEDULED}"
        side_effects:
          - "committed_by_user_id = X-User-ID"
          - "recompute minimum_liability_cents per calculations.rights_deal_minimum_liability"
          - "recompute Event.fulfillment_risk_score and Event.risk_posture"
      - from: SHORTFALL_DECLARED
        to: COMMITTED
        trigger: "POST /release-tranches (a fresh tranche is promised on a shortfall deal)"
        actor: RightsManager
        preconditions:
          - "RightsDeal.deal_status == SHORTFALL_DECLARED"
          - "released_units == 0"
          - "released_units + sum of promised_units over PENDING tranches (including the new one) >= guaranteed_minimum_units"
        side_effects:
          - "deal_status = COMMITTED; shortfall_units and minimum_liability_cents recomputed by calculations.rights_deal_minimum_liability (shortfall_units stays at max(0, guaranteed_minimum_units - released_units): only actual confirmed releases reduce it, so re-entering COMMITTED does NOT zero it)"
          - "recompute minimum_liability_cents; recompute Event.fulfillment_risk_score and risk_posture"
        note: "Cycle edge — a late promise re-opens a deal that had already declared shortfall."
      - from: SHORTFALL_DECLARED
        to: PARTIALLY_RELEASED
        trigger: "POST /release-tranches (a fresh tranche is promised on a shortfall deal)"
        actor: RightsManager
        preconditions:
          - "RightsDeal.deal_status == SHORTFALL_DECLARED"
          - "released_units > 0"
          - "released_units + sum of promised_units over PENDING tranches (including the new one) >= guaranteed_minimum_units"
        side_effects:
          - "deal_status = PARTIALLY_RELEASED"
          - "recompute minimum_liability_cents; recompute Event.fulfillment_risk_score and risk_posture"
        note: "Second cycle edge into the same state the deal already passed through."
      - from: COMMITTED
        to: PARTIALLY_RELEASED
        trigger: "POST /release-tranches/{id}/confirm"
        actor: RightsManager
        preconditions:
          - "the confirming tranche belongs to this deal"
          - "after the confirm, 0 < released_units < contracted_units and released_units + PENDING promised_units >= guaranteed_minimum_units"
        side_effects:
          - "released_units, shortfall_units, unallocated_units and minimum_liability_cents recomputed"
          - "calculations.channel_allocation_waterfall distributes the confirmed units across this deal's AllocationBlocks"
          - "recompute Event.fulfillment_risk_score and risk_posture"
      - from: PARTIALLY_RELEASED
        to: PARTIALLY_RELEASED
        trigger: "POST /release-tranches/{id}/confirm"
        actor: RightsManager
        preconditions:
          - "after the confirm, 0 < released_units < contracted_units and released_units + PENDING promised_units >= guaranteed_minimum_units"
        side_effects:
          - "identical to COMMITTED -> PARTIALLY_RELEASED"
        note: "Self-loop on every additional tranche confirmation."
      - from: PARTIALLY_RELEASED
        to: FULLY_RELEASED
        trigger: "POST /release-tranches/{id}/confirm"
        actor: RightsManager
        preconditions:
          - "after the confirm, released_units >= contracted_units"
        side_effects:
          - "deal_status = FULLY_RELEASED; shortfall_units = 0; minimum_liability_cents recomputed"
          - "calculations.channel_allocation_waterfall distributes the confirmed units"
          - "recompute Event.fulfillment_risk_score and risk_posture"
      - from: COMMITTED
        to: FULLY_RELEASED
        trigger: "POST /release-tranches/{id}/confirm"
        actor: RightsManager
        preconditions:
          - "after the confirm, released_units >= contracted_units"
        side_effects:
          - "identical to PARTIALLY_RELEASED -> FULLY_RELEASED"
      - from: COMMITTED
        to: SHORTFALL_DECLARED
        trigger: "POST /release-tranches/{id}/confirm or POST /operations/daily-run (tranche lapse)"
        actor: system
        preconditions:
          - "after the tranche reaches a terminal state, released_units + sum of promised_units over remaining PENDING tranches < guaranteed_minimum_units"
        side_effects:
          - "deal_status = SHORTFALL_DECLARED; shortfall_units = guaranteed_minimum_units - released_units; minimum_liability_cents recomputed"
          - "recompute Event.fulfillment_risk_score and risk_posture"
      - from: PARTIALLY_RELEASED
        to: SHORTFALL_DECLARED
        trigger: "POST /release-tranches/{id}/confirm or POST /operations/daily-run (tranche lapse)"
        actor: system
        preconditions:
          - "after the tranche reaches a terminal state, released_units + sum of promised_units over remaining PENDING tranches < guaranteed_minimum_units"
        side_effects:
          - "CASCADE hop 2 — because the tranche reached a terminal state without covering the guarantee: deal_status = SHORTFALL_DECLARED and shortfall_units = guaranteed_minimum_units - released_units"
          - "CASCADE hop 3 — because shortfall_units became non-zero: minimum_liability_cents is recomputed by calculations.rights_deal_minimum_liability, so the provider now owes released_units * unit_cost_cents PLUS shortfall_units * round_half_up(unit_cost_cents * 0.60) for units it will never receive"
          - "CASCADE hop 4 — because the deal's released_units and minimum_liability_cents changed: calculations.event_fulfillment_risk_score re-runs for the parent Event and Event.risk_posture is re-banded, which is what later gates POST /bookings through validations[priority=52]"
          - "calculations.channel_allocation_waterfall also re-runs over this deal's OPEN blocks to distribute whatever WAS released; it never reduces an existing allocation, because released_units only ever grows"
      - from: PARTIALLY_RELEASED
        to: SETTLED
        trigger: "POST /rights-deals/{id}/settle"
        actor: FinanceController
        preconditions:
          - "RightsDeal.deal_status IN {PARTIALLY_RELEASED, FULLY_RELEASED, SHORTFALL_DECLARED}"
          - "Event.status IN {COMPLETED, CANCELLED}"
          - "this deal has no ReleaseTranche with tranche_state == PENDING"
        side_effects:
          - "deal_status = SETTLED; settled_at = logical_now; minimum_liability_cents frozen at its recomputed value"
          - "every AllocationBlock of this deal with block_state IN {OPEN, EXHAUSTED} moves to RECALLED with recalled_at = logical_now"
          - "recompute Event.fulfillment_risk_score and risk_posture"
      - from: FULLY_RELEASED
        to: SETTLED
        trigger: "POST /rights-deals/{id}/settle"
        actor: FinanceController
        preconditions:
          - "identical to PARTIALLY_RELEASED -> SETTLED"
        side_effects:
          - "identical to PARTIALLY_RELEASED -> SETTLED"
      - from: SHORTFALL_DECLARED
        to: SETTLED
        trigger: "POST /rights-deals/{id}/settle"
        actor: FinanceController
        preconditions:
          - "identical to PARTIALLY_RELEASED -> SETTLED"
        side_effects:
          - "identical to PARTIALLY_RELEASED -> SETTLED"
      - from: COMMITTED
        to: TERMINATED
        trigger: "POST /events/{id}/cancel"
        actor: system
        preconditions:
          - "RightsDeal.deal_status NOT IN {SETTLED, TERMINATED}"
        side_effects:
          - "deal_status = TERMINATED; PENDING tranches move to LAPSED; OPEN/EXHAUSTED blocks move to RECALLED"

  # ---------------------------------------------------------------------------
  # ReleaseTranche — branching with divergent side-effect sets per branch
  - entity: ReleaseTranche
    initial_state: PENDING
    terminal_states: [CONFIRMED, SHORT_CONFIRMED, LAPSED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /release-tranches/{id}/confirm"
        actor: RightsManager
        preconditions:
          - "ReleaseTranche.tranche_state == PENDING"
          - "RightsDeal.deal_status IN {COMMITTED, PARTIALLY_RELEASED, SHORTFALL_DECLARED}"
          - "expected_rights_deal_version equals the parent RightsDeal.version"
          - "confirmed_units == promised_units"
        side_effects:
          - "tranche_state = CONFIRMED; confirmed_units set; confirmed_at = logical_now"
          - "RightsDeal.version += 1 and its released_units / shortfall_units / unallocated_units / minimum_liability_cents / deal_status recomputed"
          - "calculations.channel_allocation_waterfall runs over this deal's OPEN AllocationBlocks"
          - "Event.fulfillment_risk_score and risk_posture recomputed"
      - from: PENDING
        to: SHORT_CONFIRMED
        trigger: "POST /release-tranches/{id}/confirm"
        actor: RightsManager
        preconditions:
          - "ReleaseTranche.tranche_state == PENDING"
          - "RightsDeal.deal_status IN {COMMITTED, PARTIALLY_RELEASED, SHORTFALL_DECLARED}"
          - "expected_rights_deal_version equals the parent RightsDeal.version"
          - "1 <= confirmed_units < promised_units"
        side_effects:
          - "tranche_state = SHORT_CONFIRMED; confirmed_units set; confirmed_at = logical_now"
          - "the CONFIRMED side-effect set runs, and additionally the shortfall branch of the deal status function may move the deal to SHORTFALL_DECLARED, which cascades into the waterfall reduction and booking revert chain"
        note: "Divergent branch: the short branch can reduce already-allocated units, the full branch never can."
      - from: PENDING
        to: LAPSED
        trigger: "POST /operations/daily-run"
        actor: system
        preconditions:
          - "ReleaseTranche.tranche_state == PENDING"
          - "ReleaseTranche.promised_release_at < logical clock"
          - "RightsDeal.deal_status NOT IN {SETTLED, TERMINATED}"
        side_effects:
          - "tranche_state = LAPSED; lapsed_at = logical_now; confirmed_units stays 0"
          - "the parent RightsDeal.version += 1 and its deal_status is recomputed by the deal status function (which may move it to SHORTFALL_DECLARED)"
          - "Event.fulfillment_risk_score and risk_posture recomputed"

  # ---------------------------------------------------------------------------
  # AllocationBlock — cyclic (EXHAUSTED returns to OPEN when units come back)
  - entity: AllocationBlock
    initial_state: OPEN
    terminal_states: [RECALLED]
    transitions:
      - from: OPEN
        to: EXHAUSTED
        trigger: "calculations.channel_allocation_waterfall during POST /release-tranches/{id}/confirm or POST /allocation-blocks"
        actor: system
        preconditions:
          - "allocated_units reaches target_units"
        side_effects:
          - "block_state = EXHAUSTED; RightsDeal.unallocated_units recomputed"
      - from: EXHAUSTED
        to: OPEN
        trigger: "calculations.channel_allocation_waterfall reduction during POST /allocation-blocks"
        actor: system
        preconditions:
          - "a newly created AllocationBlock on the same deal carries a smaller priority_rank than this block, so the waterfall's distribution pass reaches this block with less than target_units remaining and allocated_units falls below target_units"
        side_effects:
          - "block_state = OPEN; allocated_units reduced; RightsDeal.unallocated_units recomputed"
          - "when allocated_units drops below committed_units the revert pass of the waterfall runs (see calculations.channel_allocation_waterfall), which is the only way an ALLOCATED Booking returns to RESERVED"
        note: "Cycle edge — the block gives units back to a higher-priority channel. Selling a booking never flips block_state; only allocation does."
      - from: OPEN
        to: RECALLED
        trigger: "POST /allocation-blocks/{id}/recall, POST /rights-deals/{id}/settle or POST /events/{id}/cancel"
        actor: RightsManager
        preconditions:
          - "AllocationBlock.block_state IN {OPEN, EXHAUSTED}"
          - "committed_units == 0 when the trigger is POST /allocation-blocks/{id}/recall"
        side_effects:
          - "block_state = RECALLED; recalled_at = logical_now; allocated_units frozen at its current value"
          - "RightsDeal.unallocated_units recomputed and RightsDeal.version += 1"
          - "Event.fulfillment_risk_score and risk_posture recomputed"
      - from: EXHAUSTED
        to: RECALLED
        trigger: "POST /allocation-blocks/{id}/recall, POST /rights-deals/{id}/settle or POST /events/{id}/cancel"
        actor: RightsManager
        preconditions:
          - "identical to OPEN -> RECALLED"
        side_effects:
          - "identical to OPEN -> RECALLED"

  # ---------------------------------------------------------------------------
  # PackageProduct — self-loop on re-pricing invalidates the publish approval
  - entity: PackageProduct
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PRICED
        trigger: "POST /package-products/{id}/price"
        actor: CommercialManager
        preconditions:
          - "PackageProduct.package_status IN {DRAFT, PRICED}"
          - "this package has at least one PackageComponent"
        side_effects:
          - "calculations.package_component_line_pricing recomputes every component's line_cost_cents and line_price_cents in sequence_no ASC order"
          - "calculations.package_list_pricing writes base_cost_cents, component_price_subtotal_cents, list_price_cents and margin_pct"
          - "package_status = PRICED; priced_by_user_id = X-User-ID; priced_at = logical_now; published_by_user_id = null; published_at = null"
      - from: PRICED
        to: PRICED
        trigger: "POST /package-products/{id}/price"
        actor: CommercialManager
        preconditions:
          - "PackageProduct.package_status IN {DRAFT, PRICED}"
          - "this package has at least one PackageComponent"
        side_effects:
          - "identical to DRAFT -> PRICED; the previous published_by_user_id is cleared so an already-reviewed price cannot be published without a fresh approval"
        note: "Self-loop; also bumps version, which is what the publish OCC check observes."
      - from: PRICED
        to: PUBLISHED
        trigger: "POST /package-products/{id}/publish"
        actor: CommercialDirector
        preconditions:
          - "PackageProduct.package_status == PRICED"
          - "expected_package_product_version equals PackageProduct.version"
          - "X-User-ID != PackageProduct.priced_by_user_id"
          - "PackageProduct.margin_pct >= PackageProduct.min_margin_pct"
          - "the package's Event has at least one RightsDeal with inventory_type == TICKET and deal_status IN {COMMITTED, PARTIALLY_RELEASED, FULLY_RELEASED}"
        side_effects:
          - "package_status = PUBLISHED; published_by_user_id = X-User-ID; published_at = logical_now; version += 1"
      - from: PUBLISHED
        to: CLOSED
        trigger: "POST /events/{id}/complete or POST /events/{id}/cancel"
        actor: system
        preconditions:
          - "PackageProduct.package_status != CLOSED"
        side_effects:
          - "package_status = CLOSED"
      - from: PRICED
        to: CLOSED
        trigger: "POST /events/{id}/complete or POST /events/{id}/cancel"
        actor: system
        preconditions:
          - "PackageProduct.package_status != CLOSED"
        side_effects:
          - "package_status = CLOSED"
      - from: DRAFT
        to: CLOSED
        trigger: "POST /events/{id}/complete or POST /events/{id}/cancel"
        actor: system
        preconditions:
          - "PackageProduct.package_status != CLOSED"
        side_effects:
          - "package_status = CLOSED"

  # ---------------------------------------------------------------------------
  # Booking — PARALLEL state dimensions: fulfillment_status x payment_status,
  # each evolving independently on the same row, plus a REBOOK_PENDING cycle.
  - entity: Booking
    initial_state: "RESERVED (fulfillment_status) x UNPAID (payment_status)"
    terminal_states: [CANCELLED, DELIVERED]
    transitions:
      - from: RESERVED
        to: ALLOCATED
        trigger: "POST /bookings/{id}/allocate"
        actor: ClientServiceAgent
        preconditions:
          - "Booking.fulfillment_status == RESERVED"
          - "AllocationBlock.block_state IN {OPEN, EXHAUSTED} and AllocationBlock.channel == Booking.channel"
          - "expected_allocation_block_version equals AllocationBlock.version"
          - "the block's RightsDeal.deal_status IN {PARTIALLY_RELEASED, FULLY_RELEASED}"
          - "AllocationBlock.allocated_units - AllocationBlock.committed_units >= Booking.units * PackageProduct.tickets_per_package"
        side_effects:
          - "fulfillment_status = ALLOCATED; allocation_block_id set"
          - "AllocationBlock.committed_units += units * tickets_per_package; AllocationBlock.version += 1"
          - "Event.fulfillment_risk_score and risk_posture recomputed"
        note: "fulfillment dimension only — payment_status is untouched."
      - from: ALLOCATED
        to: RESERVED
        trigger: "calculations.channel_allocation_waterfall reduction during POST /allocation-blocks (a new higher-priority channel block preempts this block's units)"
        actor: system
        preconditions:
          - "the booking's AllocationBlock.allocated_units < AllocationBlock.committed_units after the waterfall's distribution pass re-ran"
          - "the booking is among the over-committed set, ordered Booking.created_at DESC"
        side_effects:
          - "fulfillment_status = RESERVED; allocation_block_id = null"
          - "AllocationBlock.committed_units -= units * tickets_per_package; released_back_units += the same amount"
      - from: ALLOCATED
        to: CREDENTIALED
        trigger: "POST /bookings/{id}/issue-credentials"
        actor: ClientServiceAgent
        preconditions:
          - "Booking.fulfillment_status NOT IN {CANCELLED, DELIVERED, REBOOK_PENDING, CREDENTIALED}"
          - "the Event has a HospitalityBuild with build_state == READY"
          - "Booking.allocation_block_id is non-null"
        side_effects:
          - "fulfillment_status = CREDENTIALED; credentials_issued_count = units * (tickets_per_package + 1); credential_serial_prefix stamped"
          - "Booking.itinerary computed with its pinned keys"
      - from: CREDENTIALED
        to: DELIVERED
        trigger: "POST /events/{id}/complete"
        actor: system
        preconditions:
          - "Event.status IN {SCHEDULED, RESCHEDULED} and event_date <= logical clock"
        side_effects:
          - "fulfillment_status = DELIVERED; the booking's revenue enters the FINAL margin variant"
      - from: ALLOCATED
        to: DELIVERED
        trigger: "POST /events/{id}/complete"
        actor: system
        preconditions:
          - "identical to CREDENTIALED -> DELIVERED"
        side_effects:
          - "fulfillment_status = DELIVERED"
      - from: RESERVED
        to: REBOOK_PENDING
        trigger: "POST /events/{id}/postpone"
        actor: system
        preconditions:
          - "Booking.fulfillment_status IN {RESERVED, ALLOCATED, CREDENTIALED}"
        side_effects:
          - "fulfillment_status = REBOOK_PENDING; see the Event postpone cascade for hops 2b, 3, 3b, 4"
      - from: ALLOCATED
        to: REBOOK_PENDING
        trigger: "POST /events/{id}/postpone"
        actor: system
        preconditions:
          - "Booking.fulfillment_status IN {RESERVED, ALLOCATED, CREDENTIALED}"
        side_effects:
          - "fulfillment_status = REBOOK_PENDING; allocation_block_id = null; the block's committed_units and released_back_units adjust"
      - from: CREDENTIALED
        to: REBOOK_PENDING
        trigger: "POST /events/{id}/postpone"
        actor: system
        preconditions:
          - "Booking.fulfillment_status IN {RESERVED, ALLOCATED, CREDENTIALED}"
        side_effects:
          - "fulfillment_status = REBOOK_PENDING; allocation_block_id = null; credentials_issued_count reset to 0; ASSIGNED HostAssignments move to VOIDED"
      - from: REBOOK_PENDING
        to: RESERVED
        trigger: "POST /bookings/{id}/rebook"
        actor: ClientServiceAgent
        preconditions:
          - "Booking.fulfillment_status == REBOOK_PENDING"
          - "logical clock <= Event.rebook_deadline_at"
          - "the target PackageProduct has package_status == PUBLISHED and belongs to an Event whose status IN {SCHEDULED, POSTPONED, RESCHEDULED}"
        side_effects:
          - "package_product_id = target package; rebook_count += 1; fulfillment_status = RESERVED"
          - "calculations.booking_net_price re-runs against the target package and net_price_cents / gross_price_cents / volume_discount_pct / discounted_subtotal_cents / partner_commission_cents / guarantee_surcharge_cents are rewritten"
          - "every PaymentInstallment of this booking with installment_state IN {SCHEDULED, OVERDUE} moves to VOIDED and calculations.payment_schedule_generation issues a fresh SCHEDULE, whose first installment amount is reduced by paid_cents (floored at 0) so the schedule total plus paid_cents equals the new net_price_cents"
          - "Client.outstanding_cents and overdue_installment_count recomputed; Event.fulfillment_risk_score recomputed for both the old and the new Event"
        note: "Cycle edge back into RESERVED."
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: ClientServiceAgent
        preconditions:
          - "Booking.fulfillment_status NOT IN {CANCELLED, DELIVERED}"
          - "when the actor is ClientPortalUser, X-User-ID == Booking.client_id"
        side_effects:
          - "calculations.booking_cancellation_settlement selects the variant from Event.status and writes settlement_variant, cancellation_fee_cents, refund_cents and balance_due_cents"
          - "fulfillment_status = CANCELLED; allocation_block_id = null"
          - "payment_status = REFUNDED when balance_due_cents == 0, otherwise SETTLEMENT_DUE"
          - "every PaymentInstallment with installment_state IN {SCHEDULED, OVERDUE} moves to VOIDED; when balance_due_cents > 0 one SETTLEMENT installment is created for balance_due_cents due at logical_now + SETTLEMENT_DUE_DAYS days"
          - "paid_cents -= refund_cents"
          - "Client.outstanding_cents and overdue_installment_count recomputed; Event.fulfillment_risk_score and risk_posture recomputed"
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: ClientServiceAgent
        preconditions:
          - "identical to RESERVED -> CANCELLED"
        side_effects:
          - "the RESERVED -> CANCELLED side-effect set, plus: AllocationBlock.committed_units -= units * tickets_per_package and released_back_units += the same amount (block_state unchanged — see the §1.3 conventions)"
      - from: CREDENTIALED
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: ClientServiceAgent
        preconditions:
          - "identical to RESERVED -> CANCELLED"
        side_effects:
          - "the ALLOCATED -> CANCELLED side-effect set, plus: credentials_issued_count reset to 0 and every HostAssignment of this booking with assignment_state == ASSIGNED moves to VOIDED, after which each affected OnSiteHost.active_assignment_count is recomputed"
      - from: REBOOK_PENDING
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: ClientServiceAgent
        preconditions:
          - "identical to RESERVED -> CANCELLED"
        side_effects:
          - "identical to RESERVED -> CANCELLED"
      - from: UNPAID
        to: DEPOSIT_PAID
        trigger: "POST /payment-installments/{id}/pay"
        actor: FinanceController
        preconditions:
          - "the installment belongs to this booking, installment_kind == SCHEDULE, and after payment at least one SCHEDULE installment remains in {SCHEDULED, OVERDUE}"
        side_effects:
          - "payment_status = DEPOSIT_PAID; paid_cents recomputed; Client.outstanding_cents recomputed"
        note: "payment dimension only — fulfillment_status is untouched."
      - from: DEPOSIT_PAID
        to: PAID_IN_FULL
        trigger: "POST /payment-installments/{id}/pay"
        actor: FinanceController
        preconditions:
          - "after payment no SCHEDULE installment of this booking remains in {SCHEDULED, OVERDUE}"
        side_effects:
          - "payment_status = PAID_IN_FULL; paid_cents recomputed; Client.outstanding_cents recomputed"
      - from: UNPAID
        to: PAID_IN_FULL
        trigger: "POST /payment-installments/{id}/pay"
        actor: FinanceController
        preconditions:
          - "after payment no SCHEDULE installment of this booking remains in {SCHEDULED, OVERDUE} (single-installment schedule)"
        side_effects:
          - "payment_status = PAID_IN_FULL; paid_cents recomputed; Client.outstanding_cents recomputed"
      - from: SETTLEMENT_DUE
        to: SETTLED
        trigger: "POST /payment-installments/{id}/pay"
        actor: FinanceController
        preconditions:
          - "the paid installment has installment_kind == SETTLEMENT"
        side_effects:
          - "payment_status = SETTLED; balance_due_cents = 0; Client.outstanding_cents recomputed"

  # ---------------------------------------------------------------------------
  - entity: PaymentInstallment
    initial_state: SCHEDULED
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: SCHEDULED
        to: PAID
        trigger: "POST /payment-installments/{id}/pay"
        actor: FinanceController
        preconditions:
          - "PaymentInstallment.installment_state IN {SCHEDULED, OVERDUE}"
          - "amount_cents_paid == PaymentInstallment.amount_cents"
          - "the parent Booking.fulfillment_status != CANCELLED or the installment_kind == SETTLEMENT"
        side_effects:
          - "installment_state = PAID; paid_amount_cents = amount_cents; paid_at = logical_now; days_overdue = 0"
          - "the parent Booking's payment_status advances on its payment dimension; Booking.paid_cents recomputed"
          - "Client.outstanding_cents and overdue_installment_count recomputed"
      - from: OVERDUE
        to: PAID
        trigger: "POST /payment-installments/{id}/pay"
        actor: FinanceController
        preconditions:
          - "identical to SCHEDULED -> PAID"
        side_effects:
          - "identical to SCHEDULED -> PAID"
      - from: SCHEDULED
        to: OVERDUE
        trigger: "POST /operations/daily-run"
        actor: system
        preconditions:
          - "PaymentInstallment.installment_state == SCHEDULED"
          - "PaymentInstallment.due_at < logical clock"
        side_effects:
          - "installment_state = OVERDUE; days_overdue recomputed"
          - "because the installment went overdue, the owning Client.overdue_installment_count is recomputed and the Client credit-standing machine re-evaluates client_status"
      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /bookings/{id}/cancel, POST /bookings/{id}/rebook or POST /events/{id}/cancel"
        actor: system
        preconditions:
          - "PaymentInstallment.installment_state IN {SCHEDULED, OVERDUE}"
        side_effects:
          - "installment_state = VOIDED; days_overdue = 0; Client.outstanding_cents and overdue_installment_count recomputed"
      - from: OVERDUE
        to: VOIDED
        trigger: "POST /bookings/{id}/cancel, POST /bookings/{id}/rebook or POST /events/{id}/cancel"
        actor: system
        preconditions:
          - "identical to SCHEDULED -> VOIDED"
        side_effects:
          - "identical to SCHEDULED -> VOIDED"

  # ---------------------------------------------------------------------------
  - entity: Client
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: ON_HOLD
        trigger: "POST /operations/daily-run"
        actor: system
        preconditions:
          - "1 <= overdue_installment_count <= 2 after the run's OVERDUE sweep"
        side_effects:
          - "client_status = ON_HOLD"
      - from: ON_HOLD
        to: BLOCKED
        trigger: "POST /operations/daily-run"
        actor: system
        preconditions:
          - "overdue_installment_count >= 3 after the run's OVERDUE sweep"
        side_effects:
          - "client_status = BLOCKED"
      - from: ACTIVE
        to: BLOCKED
        trigger: "POST /operations/daily-run"
        actor: system
        preconditions:
          - "overdue_installment_count >= 3 after the run's OVERDUE sweep"
        side_effects:
          - "client_status = BLOCKED"
      - from: ON_HOLD
        to: ACTIVE
        trigger: "POST /operations/daily-run"
        actor: system
        preconditions:
          - "overdue_installment_count == 0 after the run's OVERDUE sweep"
        side_effects:
          - "client_status = ACTIVE"
      - from: BLOCKED
        to: ON_HOLD
        trigger: "POST /operations/daily-run"
        actor: system
        preconditions:
          - "1 <= overdue_installment_count <= 2 after the run's OVERDUE sweep"
        side_effects:
          - "client_status = ON_HOLD"
      - from: BLOCKED
        to: ACTIVE
        trigger: "POST /operations/daily-run"
        actor: system
        preconditions:
          - "overdue_installment_count == 0 after the run's OVERDUE sweep"
        side_effects:
          - "client_status = ACTIVE"

  # ---------------------------------------------------------------------------
  - entity: HospitalityBuild
    initial_state: PLANNED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNED
        to: APPROVED
        trigger: "POST /hospitality-builds/{id}/approve"
        actor: FinanceController
        preconditions:
          - "HospitalityBuild.build_state == PLANNED"
          - "Event.status IN {SCHEDULED, POSTPONED, RESCHEDULED}"
        side_effects:
          - "build_state = APPROVED; approved_by_user_id = X-User-ID"
          - "the build's total_cost_cents enters calculations.event_margin_report's cost base"
      - from: APPROVED
        to: READY
        trigger: "POST /hospitality-builds/{id}/ready"
        actor: OperationsManager
        preconditions:
          - "HospitalityBuild.build_state == APPROVED"
          - "staff_count >= 1 and catering_covers >= 1"
        side_effects:
          - "build_state = READY; credential issuance for this Event's Bookings becomes possible"
      - from: READY
        to: CLOSED
        trigger: "POST /events/{id}/complete or POST /events/{id}/cancel"
        actor: system
        preconditions:
          - "HospitalityBuild.build_state == READY"
        side_effects:
          - "build_state = CLOSED"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /events/{id}/complete or POST /events/{id}/cancel"
        actor: system
        preconditions:
          - "HospitalityBuild.build_state IN {PLANNED, APPROVED}"
        side_effects:
          - "build_state = CANCELLED"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /events/{id}/complete or POST /events/{id}/cancel"
        actor: system
        preconditions:
          - "HospitalityBuild.build_state IN {PLANNED, APPROVED}"
        side_effects:
          - "build_state = CANCELLED"

  # ---------------------------------------------------------------------------
  - entity: HostAssignment
    initial_state: ASSIGNED
    terminal_states: [RELEASED, VOIDED]
    transitions:
      - from: ASSIGNED
        to: RELEASED
        trigger: "POST /host-assignments/{id}/release or POST /events/{id}/complete"
        actor: OperationsManager
        preconditions:
          - "HostAssignment.assignment_state == ASSIGNED"
        side_effects:
          - "assignment_state = RELEASED; released_at = logical_now"
          - "OnSiteHost.active_assignment_count recomputed; the booking's itinerary host_names list recomputed"
      - from: ASSIGNED
        to: VOIDED
        trigger: "POST /bookings/{id}/cancel, POST /events/{id}/postpone or POST /events/{id}/cancel"
        actor: system
        preconditions:
          - "HostAssignment.assignment_state == ASSIGNED"
          - "the parent Booking left fulfillment_status CREDENTIALED"
        side_effects:
          - "assignment_state = VOIDED; released_at = logical_now"
          - "OnSiteHost.active_assignment_count recomputed"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent entity's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: allocate-against-stale-block
    parent_entity: AllocationBlock
    write_endpoint: "POST /bookings/{id}/allocate"
    occ_field: "expected_allocation_block_version"
    description: |
      Allocating a Booking against an AllocationBlock whose version has advanced
      since the client last read it is rejected. Two different Bookings may each
      legitimately claim free units on the same block, so the losing writer's
      request is not excluded by any state precondition — only the stale version
      distinguishes it.
    error_id: ERR_STALE_BLOCK_VERSION
    http_status: 412

  - rule_id: confirm-tranche-against-stale-deal
    parent_entity: RightsDeal
    write_endpoint: "POST /release-tranches/{id}/confirm"
    occ_field: "expected_rights_deal_version"
    description: |
      Confirming a ReleaseTranche while carrying a RightsDeal version that the
      deal has already moved past is rejected. A deal legitimately accepts
      several tranche confirmations, and each confirmation re-runs the channel
      waterfall, so a writer holding an out-of-date view of released_units would
      otherwise allocate against inventory arithmetic that no longer holds.
    error_id: ERR_STALE_DEAL_VERSION
    http_status: 412

  - rule_id: publish-stale-package-price
    parent_entity: PackageProduct
    write_endpoint: "POST /package-products/{id}/publish"
    occ_field: "expected_package_product_version"
    description: |
      Publishing a PackageProduct while carrying a version older than the
      package's current one is rejected. Re-pricing is a legitimate repeat
      operation that rewrites list_price_cents and margin_pct, so the director
      must publish exactly the version whose margin was reviewed.
    error_id: ERR_STALE_PACKAGE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
#
# Global conventions:
#   - round_half_up(x) rounds a cent-valued real to the nearest integer cent,
#     ties away from zero. All money is integer cents; no float money is stored.
#   - round_half_up_4(x) rounds a fraction to four decimal places, ties away
#     from zero. Used only for margin_pct and volume_discount_pct.
#   - `logical_now` is the logical clock (POST /_clock/set_current_utc), whose
#     server startup default is 2026-08-01T00:00:00Z.
#   - days_between(a, b) = floor((b - a) / 86400 seconds), computed on exact
#     instants, never on calendar dates.
#   - No ordering, selection or tie-break anywhere below uses `id`. Where a
#     precise fallback is needed the key is `created_at`.
#   - REBOOK_WINDOW_DAYS = 21. Event.rebook_deadline_at is always
#     logical_now + 21 days at the moment the fixture enters POSTPONED.
#   - AllocationBlock.block_state is a pure function of allocation, not of
#     sales: EXHAUSTED means allocated_units == target_units, OPEN means
#     allocated_units < target_units. Committing or releasing a Booking moves
#     committed_units and released_back_units but NEVER block_state; only the
#     waterfall (or a recall) can change it.
# =============================================================================
calculations:

  # ---------------------------------------------------------------------------
  - name: package_component_line_pricing
    trigger: "POST /package-products/{id}/price — runs over every PackageComponent of the package before any summation"
    algorithm: tiered_pricing
    formula: |
      # Components are processed in sequence_no ASC order. sequence_no is unique
      # per package_product_id, so the order is total and no tie-break is needed.
      for component in components ordered by sequence_no ASC:
          line_cost_cents  = component.unit_cost_cents * component.quantity
          line_price_cents = round_half_up(line_cost_cents * (1 + component.markup_pct))

      # ROUNDING ORDER IS PINNED: round at each line FIRST, then sum.
      # "sum the unrounded line prices then round once" is explicitly NOT the
      # rule and produces a different cent total.
      base_cost_cents                = sum(line_cost_cents  over all components)
      component_price_subtotal_cents = sum(line_price_cents over all components)
    input_set: "Every PackageComponent whose package_product_id is this package. Components are never soft-deleted, so there is no status filter; a package with zero components cannot be priced (ERR_PACKAGE_HAS_NO_COMPONENTS)."
    constants: {}
    precision: "line_price_cents: integer cents, round_half_up per line, applied before summation"
    variants: []

  # ---------------------------------------------------------------------------
  - name: package_list_pricing
    trigger: "POST /package-products/{id}/price — immediately after package_component_line_pricing"
    algorithm: tiered_pricing
    formula: |
      tier_multiplier = TIER_MULTIPLIER[package.tier]
      list_price_cents = round_half_up(component_price_subtotal_cents * tier_multiplier)
      if list_price_cents == 0:
          margin_pct = 0
      else:
          margin_pct = round_half_up_4(
              (list_price_cents - base_cost_cents) / list_price_cents)
    input_set: "The package's own base_cost_cents and component_price_subtotal_cents as written by package_component_line_pricing in the same request."
    constants:
      TIER_MULTIPLIER: { BRONZE: 1.00, SILVER: 1.10, GOLD: 1.25, PLATINUM: 1.45 }
    precision: "list_price_cents: integer cents, round_half_up. margin_pct: fraction, round_half_up to 4 decimal places."
    variants: []

  # ---------------------------------------------------------------------------
  - name: booking_net_price
    trigger: "POST /bookings and POST /bookings/{id}/rebook"
    algorithm: constraint_propagation
    formula: |
      # ---- EVALUATION ORDER IS PINNED. The prose reading "the commission and
      # ---- the guarantee surcharge are percentages of the net booking value"
      # ---- is circular, because net_price_cents is defined from both of them.
      # ---- The order below resolves it: every percentage is keyed on
      # ---- discounted_subtotal_cents (step 3), never on net_price_cents.
      # step 1
      gross_price_cents = package.list_price_cents * booking.units

      # step 2 — the volume tier is keyed on `units`, NOT on any money amount
      if   booking.units >= 20: volume_discount_pct = 0.1200
      elif booking.units >= 10: volume_discount_pct = 0.0800
      elif booking.units >=  5: volume_discount_pct = 0.0400
      else:                     volume_discount_pct = 0.0000

      # step 3
      volume_discount_cents     = round_half_up(gross_price_cents * volume_discount_pct)
      discounted_subtotal_cents = gross_price_cents - volume_discount_cents

      # step 4 — commission keyed on step 3's value
      commission_pct          = CHANNEL_COMMISSION_PCT[booking.channel]
      partner_commission_cents = round_half_up(discounted_subtotal_cents * commission_pct)

      # step 5 — surcharge tier ALSO keyed on step 3's value (inverse tier:
      #          larger bookings carry a smaller guarantee load per cent)
      deal_exposure = any RightsDeal of the package's Event with
                      inventory_type == TICKET and
                      deal_status IN {COMMITTED, PARTIALLY_RELEASED, SHORTFALL_DECLARED}
                      and released_units < contracted_units
      if not deal_exposure:
          guarantee_surcharge_cents = 0
      else:
          if   discounted_subtotal_cents >= 5000000: surcharge_pct = 0.0200
          elif discounted_subtotal_cents >= 1000000: surcharge_pct = 0.0350
          else:                                      surcharge_pct = 0.0500
          guarantee_surcharge_cents = round_half_up(discounted_subtotal_cents * surcharge_pct)

      # step 6
      net_price_cents = discounted_subtotal_cents
                      - partner_commission_cents
                      + guarantee_surcharge_cents
    input_set: "The booking's own units and channel, the target PackageProduct.list_price_cents, and the ticket RightsDeals of that package's Event filtered to deal_status IN {COMMITTED, PARTIALLY_RELEASED, SHORTFALL_DECLARED} with released_units < contracted_units."
    constants:
      CHANNEL_COMMISSION_PCT: { INDIVIDUAL: 0.0000, CORPORATE: 0.0300, TRAVEL_PARTNER: 0.1000 }
      VOLUME_TIER_UNITS: [5, 10, 20]
      SURCHARGE_TIER_CENTS: [1000000, 5000000]
    precision: "each intermediate cents value: integer, round_half_up at the step where it is created; no re-rounding of an already-rounded value"
    variants: []

  # ---------------------------------------------------------------------------
  - name: rights_deal_minimum_liability
    trigger: "POST /rights-deals/{id}/commit, POST /release-tranches, POST /release-tranches/{id}/confirm, POST /operations/daily-run (tranche lapse), POST /rights-deals/{id}/settle"
    algorithm: threshold
    formula: |
      released_units = sum(tranche.confirmed_units
                           for tranche in deal's tranches
                           where tranche.tranche_state IN {CONFIRMED, SHORT_CONFIRMED})

      # BOUNDARY: `>=`, not `>`. released_units exactly equal to
      # guaranteed_minimum_units leaves shortfall_units at 0.
      if released_units >= deal.guaranteed_minimum_units:
          shortfall_units = 0
      else:
          shortfall_units = deal.guaranteed_minimum_units - released_units

      shortfall_unit_cost_cents = round_half_up(
          deal.unit_cost_cents * SHORTFALL_LIABILITY_PCT)

      minimum_liability_cents = released_units * deal.unit_cost_cents
                              + shortfall_units * shortfall_unit_cost_cents

      # deal status function, re-run after every tranche state change:
      pending_units = sum(t.promised_units for t in deal's tranches
                          where t.tranche_state == PENDING)
      if   released_units >= deal.contracted_units:                        -> FULLY_RELEASED
      elif released_units + pending_units < deal.guaranteed_minimum_units:  -> SHORTFALL_DECLARED
      elif released_units > 0:                                             -> PARTIALLY_RELEASED
      else:                                                                -> COMMITTED
    input_set: "ReleaseTranches of this deal only, partitioned by tranche_state: {CONFIRMED, SHORT_CONFIRMED} feed released_units, {PENDING} feeds pending_units, {LAPSED} feeds neither."
    constants:
      SHORTFALL_LIABILITY_PCT: 0.60
    precision: "shortfall_unit_cost_cents rounded half-up once, then multiplied by shortfall_units (round-then-multiply, NOT multiply-then-round)"
    variants: []

  # ---------------------------------------------------------------------------
  - name: channel_allocation_waterfall
    trigger: "POST /allocation-blocks (the ONLY reducing case — a new block with a smaller priority_rank preempts an existing lower-priority block), POST /release-tranches/{id}/confirm (both the CONFIRMED and the SHORT_CONFIRMED branch), POST /operations/daily-run tranche lapse, and POST /allocation-blocks/{id}/recall"
    algorithm: waterfall_allocation
    formula: |
      # ---- distribution pass ----
      # candidate set: AllocationBlocks of this rights_deal_id with
      #                block_state IN {OPEN, EXHAUSTED}
      # order:         priority_rank ASC, tie-break created_at ASC
      # (RECALLED blocks are excluded and keep their frozen allocated_units.)
      distributable = deal.released_units
                    - sum(block.allocated_units for RECALLED blocks of this deal)
      remaining = distributable
      for block in candidates ordered by (priority_rank ASC, created_at ASC):
          give = min(block.target_units, remaining)
          block.allocated_units = give
          block.block_state = EXHAUSTED if give == block.target_units else OPEN
          remaining -= give
      deal.unallocated_units = remaining     # empty-candidate fallback: all of
                                             # `distributable` stays here, no error

      # ---- revert pass (only where the distribution pass reduced a block) ----
      # `released_units` never decreases, so a confirm, a lapse or a recall can
      # only ever raise a block's allocated_units. The one input that lowers it
      # is a NEW AllocationBlock whose priority_rank sorts ahead of an existing
      # block: it takes units the incumbent already held, and if the incumbent
      # had already sold them the revert pass below unwinds those sales.
      for block in candidates ordered by (priority_rank ASC, created_at ASC):
          over = block.committed_units - block.allocated_units
          if over <= 0: continue
          for booking in bookings of this block
                         where fulfillment_status == ALLOCATED
                         ordered by created_at DESC:
              if over <= 0: break
              consumed = booking.units * booking.package.tickets_per_package
              booking.fulfillment_status = RESERVED
              booking.allocation_block_id = null
              block.committed_units    -= consumed
              block.released_back_units += consumed
              over -= consumed
          # block_state depends on allocation only, never on committed_units:
          block.block_state = OPEN if block.allocated_units < block.target_units else EXHAUSTED
    input_set: "AllocationBlocks of the deal with block_state IN {OPEN, EXHAUSTED} (eligibility filter); ranking expression priority_rank ASC; tie-break created_at ASC; fallback when the candidate set is empty: the whole distributable amount is recorded in RightsDeal.unallocated_units and no error is raised. Bookings entering the revert pass are filtered to fulfillment_status == ALLOCATED and ordered created_at DESC (last committed reverts first); CREDENTIALED and DELIVERED bookings are never reverted."
    constants: {}
    precision: "integer units throughout; no rounding"
    variants: []

  # ---------------------------------------------------------------------------
  - name: event_fulfillment_risk_score
    trigger: "every mutation that touches an Event, its RightsDeals, its ReleaseTranches, its AllocationBlocks or its Bookings — specifically POST /rights-deals/{id}/commit, POST /release-tranches, POST /release-tranches/{id}/confirm, POST /allocation-blocks/{id}/recall, POST /rights-deals/{id}/settle, POST /bookings, POST /bookings/{id}/allocate, POST /bookings/{id}/cancel, POST /bookings/{id}/rebook, POST /events/{id}/postpone, POST /events/{id}/cancel, POST /events/{id}/complete, POST /operations/daily-run"
    algorithm: weighted_scoring
    formula: |
      # four independent inputs, nested min/max and conditional branches
      promised_units = sum(d.contracted_units for d in event's RightsDeals
                           where d.deal_status NOT IN {TERMINATED})
      released_units = sum(d.released_units    for d in event's RightsDeals
                           where d.deal_status NOT IN {TERMINATED})
      lapsed_units   = sum(t.promised_units    for t in tranches of those deals
                           where t.tranche_state == LAPSED)
      committed_units = sum(b.units * b.package.tickets_per_package
                            for b in event's Bookings
                            where b.fulfillment_status IN
                                  {RESERVED, ALLOCATED, CREDENTIALED, REBOOK_PENDING})
      days_to_event = days_between(logical_now, event.event_date)

      gap_component   = 40 * min(1, max(0, committed_units - released_units)
                                      / max(1, committed_units))
      lapse_component = 30 * min(1, lapsed_units / max(1, promised_units))
      if   days_to_event <= 14: horizon_component = 20
      elif days_to_event <= 30: horizon_component = 10
      else:                     horizon_component = 0
      status_component = 10 if event.status == POSTPONED else 0

      fulfillment_risk_score = min(100, round_half_up(
          gap_component + lapse_component + horizon_component + status_component))

      # threshold band (BOUNDARY: `>=`)
      if   fulfillment_risk_score >= 70: risk_posture = CRITICAL
      elif fulfillment_risk_score >= 40: risk_posture = ELEVATED
      else:                              risk_posture = NORMAL
    input_set: "RightsDeals of the Event excluding deal_status == TERMINATED; ReleaseTranches of those deals filtered to tranche_state == LAPSED for lapsed_units; Bookings of the Event filtered to fulfillment_status IN {RESERVED, ALLOCATED, CREDENTIALED, REBOOK_PENDING} (CANCELLED and DELIVERED bookings never contribute)."
    constants:
      GAP_WEIGHT: 40
      LAPSE_WEIGHT: 30
      HORIZON_WEIGHT: 20
      POSTPONED_WEIGHT: 10
      HORIZON_NEAR_DAYS: 14
      HORIZON_MID_DAYS: 30
      CRITICAL_THRESHOLD: 70
      ELEVATED_THRESHOLD: 40
    precision: "integer score 0-100, round_half_up on the weighted sum, then clamped by min(100, ...)"
    variants: []

  # ---------------------------------------------------------------------------
  - name: event_margin_report
    trigger: "GET /events/{id}/margin-report"
    algorithm: aggregation
    formula: |
      rights_cost_cents = sum(d.minimum_liability_cents for d in event's RightsDeals
                              where d.deal_status NOT IN {TERMINATED})
      build_cost_cents  = sum(b.total_cost_cents for b in event's HospitalityBuilds
                              where b.build_state IN {APPROVED, READY, CLOSED})
      cost_cents        = rights_cost_cents + build_cost_cents

      # per-deal unsold exposure, in RightsDeal.created_at ASC order
      exposure_at_full_cost_cents = 0
      unsold_units = 0
      for d in event's RightsDeals where d.deal_status NOT IN {TERMINATED}
              ordered by created_at ASC:
          deal_committed = sum(block.committed_units
                               for block in d's AllocationBlocks
                               where block.block_state IN {OPEN, EXHAUSTED, RECALLED})
          d_unsold = max(0, d.released_units - deal_committed)
          unsold_units += d_unsold
          exposure_at_full_cost_cents += d_unsold * d.unit_cost_cents

      # ---- variant-specific revenue and exposure (see `variants` below) ----
      revenue_cents            = <variant>
      unsold_exposure_cents    = <variant>
      margin_cents             = revenue_cents - cost_cents
      net_margin_cents         = margin_cents - unsold_exposure_cents
      if revenue_cents == 0:
          margin_pct = 0
      else:
          margin_pct = round_half_up_4(net_margin_cents / revenue_cents)
    input_set: "RightsDeals of the Event excluding TERMINATED; HospitalityBuilds filtered to build_state IN {APPROVED, READY, CLOSED} (PLANNED and CANCELLED builds never enter the cost base); AllocationBlocks of those deals including RECALLED ones (their frozen committed_units still count as sold); Bookings of the Event filtered per variant."
    constants:
      SALVAGE_RECOVERY_PCT: 0.35
    precision: "all money integer cents; margin_pct rounded half-up to 4 decimal places"
    variants:
      - name: PROVISIONAL
        when: "the default variant while Event.status IN {SCHEDULED, POSTPONED, RESCHEDULED}; also returned on demand for a COMPLETED or CANCELLED event via ?variant=PROVISIONAL"
        difference: |
          revenue_cents = sum(b.net_price_cents for b in event's Bookings
                              where b.fulfillment_status IN
                              {RESERVED, ALLOCATED, CREDENTIALED, DELIVERED, REBOOK_PENDING})
          unsold_exposure_cents = exposure_at_full_cost_cents
          # forward-looking: every live booking is assumed to convert, and every
          # unsold released unit is carried at 100% of its acquisition cost.
      - name: FINAL
        when: "the default variant once Event.status IN {COMPLETED, CANCELLED}; also returned on demand for a live event via ?variant=FINAL"
        difference: |
          revenue_cents = sum(b.net_price_cents for b in event's Bookings
                              where b.fulfillment_status == DELIVERED)
                        + sum(b.cancellation_fee_cents for b in event's Bookings
                              where b.fulfillment_status == CANCELLED)
          unsold_exposure_cents = round_half_up(
              exposure_at_full_cost_cents * (1 - SALVAGE_RECOVERY_PCT))
          # realised: only delivered revenue plus retained cancellation fees
          # count, and unsold units are written down by the salvage recovery.

  # ---------------------------------------------------------------------------
  - name: booking_cancellation_settlement
    trigger: "POST /bookings/{id}/cancel"
    algorithm: forward_looking
    formula: |
      days_to_event  = days_between(logical_now, event.event_date)
      pre_paid_cents = booking.paid_cents            # value BEFORE this call

      cancellation_fee_cents = <variant>
      refund_cents      = max(0, pre_paid_cents - cancellation_fee_cents)
      balance_due_cents = max(0, cancellation_fee_cents - pre_paid_cents)
      # conserved quantity, always true after this call:
      #   cancellation_fee_cents == pre_paid_cents - refund_cents + balance_due_cents
    input_set: "The booking's own net_price_cents, units and paid_cents as of the moment before the cancel call; its PackageProduct.base_cost_cents and tickets_per_package; the RightsDeal reached through Booking.allocation_block_id -> AllocationBlock.rights_deal_id (null when the booking was never allocated); and Event.status, which selects the variant."
    constants:
      TIER_SCHEDULE_PCT: { D90: 0.10, D60: 0.25, D30: 0.50, D7: 0.80, LATE: 1.00 }
      NON_TICKET_IRRECOVERABLE_PCT: 0.20
      SETTLEMENT_DUE_DAYS: 7
    precision: "integer cents; each variant rounds half-up exactly once, at the step marked below"
    variants:
      - name: TIER_SCHEDULE
        when: "Event.status IN {SCHEDULED, RESCHEDULED, COMPLETED} at the moment of cancellation"
        difference: |
          # BOUNDARY: every comparison is `>=`
          if   days_to_event >= 90: fee_pct = 0.10
          elif days_to_event >= 60: fee_pct = 0.25
          elif days_to_event >= 30: fee_pct = 0.50
          elif days_to_event >=  7: fee_pct = 0.80
          else:                     fee_pct = 1.00
          cancellation_fee_cents = round_half_up(booking.net_price_cents * fee_pct)
      - name: COST_RECOVERY
        when: "Event.status == POSTPONED at the moment of cancellation — the client walks away instead of rebooking, so the schedule is replaced by what the provider cannot recover"
        difference: |
          if booking.allocation_block_id is null:
              ticket_cost_cents = 0
          else:
              deal = AllocationBlock[booking.allocation_block_id].rights_deal
              ticket_cost_cents = booking.units
                                * booking.package.tickets_per_package
                                * deal.unit_cost_cents
          non_ticket_cost_cents = round_half_up(
              booking.package.base_cost_cents * booking.units
              * NON_TICKET_IRRECOVERABLE_PCT)
          cancellation_fee_cents = min(booking.net_price_cents,
                                       ticket_cost_cents + non_ticket_cost_cents)
          # Identical booking data yields a different fee from TIER_SCHEDULE
          # because the fee is driven by committed acquisition cost, not by how
          # far away the fixture is.

  # ---------------------------------------------------------------------------
  - name: payment_schedule_generation
    trigger: "POST /bookings (fresh schedule) and POST /bookings/{id}/rebook (replacement schedule)"
    algorithm: waterfall_allocation
    formula: |
      net           = booking.net_price_cents
      already_paid  = booking.paid_cents            # 0 on POST /bookings
      payable       = max(0, net - already_paid)
      days_to_event = days_between(logical_now, event.event_date)

      # BOUNDARY: `>=` — exactly 30 days out still gets the three-part schedule.
      if days_to_event >= SCHEDULE_MIN_DAYS:
          a1 = round_half_up(payable * DEPOSIT_PCT)
          a2 = round_half_up(payable * SECOND_PCT)
          a3 = payable - a1 - a2          # remainder cents land on the LAST line
          d1 = logical_now + IMMEDIATE_DAYS days
          d2 = max(event.event_date - 90 days, d1)
          d3 = max(event.event_date - 30 days, d2)
          installments = [(1, a1, d1), (2, a2, d2), (3, a3, d3)]
      else:
          installments = [(1, payable, logical_now + IMMEDIATE_DAYS days)]

      # Lines with amount_cents == 0 are still created, so sequence numbers are
      # stable and the conservation identity below holds unconditionally:
      #   sum(amount_cents over SCHEDULE installments in {SCHEDULED, OVERDUE, PAID})
      #     + already_paid == booking.net_price_cents
    input_set: "The booking's own net_price_cents and paid_cents, and its Event.event_date. On rebook, the superseded schedule's SCHEDULED and OVERDUE lines are VOIDED first and therefore leave the identity above; PAID lines stay PAID and are represented by already_paid."
    constants:
      DEPOSIT_PCT: 0.30
      SECOND_PCT: 0.40
      SCHEDULE_MIN_DAYS: 30
      IMMEDIATE_DAYS: 3
    precision: "a1 and a2 rounded half-up; a3 is a pure subtraction so the three lines sum exactly to `payable` with zero drift"
    variants: []

  # ---------------------------------------------------------------------------
  - name: client_credit_exposure
    trigger: "POST /bookings, POST /bookings/{id}/cancel, POST /bookings/{id}/rebook, POST /payment-installments/{id}/pay, POST /events/{id}/postpone, POST /events/{id}/cancel, POST /operations/daily-run"
    algorithm: aggregation
    formula: |
      live = [b for b in client's Bookings
              where b.fulfillment_status IN
                    {RESERVED, ALLOCATED, CREDENTIALED, DELIVERED, REBOOK_PENDING}]
      outstanding_cents = sum(max(0, b.net_price_cents - b.paid_cents) for b in live)
                        + sum(b.balance_due_cents for b in client's Bookings
                              where b.fulfillment_status == CANCELLED
                                and b.payment_status == SETTLEMENT_DUE)

      overdue_installment_count = count(i for i in installments of client's Bookings
                                        where i.installment_state == OVERDUE)

      # credit gate on POST /bookings — BOUNDARY: strict `>`
      # a new booking is rejected only when the projected exposure EXCEEDS the
      # limit; landing exactly on the limit is allowed.
      projected = outstanding_cents + new_booking.net_price_cents
      reject when projected > client.credit_limit_cents
    input_set: "All Bookings whose client_id is this Client, partitioned by fulfillment_status as shown; CANCELLED bookings contribute only through balance_due_cents and only while payment_status == SETTLEMENT_DUE. All PaymentInstallments of those bookings, filtered to installment_state == OVERDUE, feed overdue_installment_count."
    constants: {}
    precision: "integer cents; no rounding"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending `priority` order;
# the FIRST failing row determines the response)
# =============================================================================
validations:

  # ---- 1-9 authentication / authorization -----------------------------------
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the role in X-User-Role appears in the called endpoint's §1.5 roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "when X-User-Role == ClientPortalUser, X-User-ID equals an existing Client.id and equals the client_id of every Booking, PaymentInstallment or Client resource touched by the request"
    error_id: ERR_CLIENT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "GET /clients/{id}, GET /bookings/{id}, GET /payment-installments/{id}, POST /payment-installments/{id}/pay, POST /bookings/{id}/cancel"

  - priority: 4
    category: business_constraint
    check: "request body parses, every required field for the endpoint is present, every value matches its declared type, every enum value is a declared member, every integer constraint (>= bounds, uniqueness of sequence_no, service_window_end > service_window_start, shift_end > shift_start, non-empty hospitality_zone_codes) holds, and pagination limit is within 1..100"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  # ---- 10-21 existence (path ids validated left to right, then body FKs) ----
  - priority: 10
    category: existence
    check: "the Event referenced by the path id or by event_id exists"
    error_id: ERR_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying an event id in the path or an event_id in the body"

  - priority: 11
    category: existence
    check: "the RightsDeal referenced by the path id or by rights_deal_id exists"
    error_id: ERR_RIGHTS_DEAL_NOT_FOUND
    http_status: 404
    applies_to: "POST /rights-deals/{id}/commit, POST /rights-deals/{id}/settle, GET /rights-deals/{id}, POST /release-tranches, POST /allocation-blocks"

  - priority: 12
    category: existence
    check: "the ReleaseTranche referenced by the path id exists"
    error_id: ERR_TRANCHE_NOT_FOUND
    http_status: 404
    applies_to: "GET /release-tranches/{id}, POST /release-tranches/{id}/confirm"

  - priority: 13
    category: existence
    check: "the AllocationBlock referenced by the path id or by allocation_block_id exists"
    error_id: ERR_BLOCK_NOT_FOUND
    http_status: 404
    applies_to: "GET /allocation-blocks/{id}, POST /allocation-blocks/{id}/recall, POST /bookings/{id}/allocate"

  - priority: 14
    category: existence
    check: "the PackageProduct referenced by the path id, by package_product_id or by target_package_product_id exists"
    error_id: ERR_PACKAGE_NOT_FOUND
    http_status: 404
    applies_to: "GET /package-products/{id}, POST /package-products/{id}/price, POST /package-products/{id}/publish, POST /package-components, POST /bookings, POST /bookings/{id}/rebook"

  - priority: 15
    category: existence
    check: "the PackageComponent referenced by the path id exists"
    error_id: ERR_COMPONENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /package-components/{id}"

  - priority: 16
    category: existence
    check: "the Client referenced by the path id or by client_id exists"
    error_id: ERR_CLIENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /clients/{id}, POST /bookings"

  - priority: 17
    category: existence
    check: "the Booking referenced by the path id or by booking_id exists"
    error_id: ERR_BOOKING_NOT_FOUND
    http_status: 404
    applies_to: "GET /bookings/{id}, POST /bookings/{id}/allocate, POST /bookings/{id}/issue-credentials, POST /bookings/{id}/cancel, POST /bookings/{id}/rebook, POST /host-assignments"

  - priority: 18
    category: existence
    check: "the PaymentInstallment referenced by the path id exists"
    error_id: ERR_INSTALLMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /payment-installments/{id}, POST /payment-installments/{id}/pay"

  - priority: 19
    category: existence
    check: "the HospitalityBuild referenced by the path id or by hospitality_build_id exists"
    error_id: ERR_BUILD_NOT_FOUND
    http_status: 404
    applies_to: "GET /hospitality-builds/{id}, POST /hospitality-builds/{id}/approve, POST /hospitality-builds/{id}/ready, POST /host-assignments"

  - priority: 20
    category: existence
    check: "the OnSiteHost referenced by the path id or by on_site_host_id exists"
    error_id: ERR_HOST_NOT_FOUND
    http_status: 404
    applies_to: "GET /on-site-hosts/{id}, POST /host-assignments"

  - priority: 21
    category: existence
    check: "the HostAssignment referenced by the path id exists"
    error_id: ERR_ASSIGNMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /host-assignments/{id}, POST /host-assignments/{id}/release"

  # ---- 30-32 optimistic concurrency ----------------------------------------
  - priority: 30
    category: state
    check: "expected_allocation_block_version equals AllocationBlock.version"
    error_id: ERR_STALE_BLOCK_VERSION
    http_status: 412
    applies_to: "POST /bookings/{id}/allocate"

  - priority: 31
    category: state
    check: "expected_rights_deal_version equals the parent RightsDeal.version"
    error_id: ERR_STALE_DEAL_VERSION
    http_status: 412
    applies_to: "POST /release-tranches/{id}/confirm"

  - priority: 32
    category: state
    check: "expected_package_product_version equals PackageProduct.version"
    error_id: ERR_STALE_PACKAGE_VERSION
    http_status: 412
    applies_to: "POST /package-products/{id}/publish"

  # ---- 40-46 state preconditions ------------------------------------------
  - priority: 40
    category: state
    check: "the Event is in a status the operation permits — postpone requires status IN {SCHEDULED, POSTPONED, RESCHEDULED} (and a non-null new_event_date when status == POSTPONED); cancel requires status IN {SCHEDULED, POSTPONED, RESCHEDULED}; complete requires status IN {SCHEDULED, RESCHEDULED} and event_date <= logical clock; creating a RightsDeal, PackageProduct or HospitalityBuild and committing a deal require status IN {SCHEDULED, POSTPONED, RESCHEDULED}"
    error_id: ERR_INVALID_EVENT_STATE
    http_status: 409
    applies_to: "POST /events/{id}/postpone, POST /events/{id}/cancel, POST /events/{id}/complete, POST /rights-deals, POST /rights-deals/{id}/commit, POST /package-products, POST /hospitality-builds, POST /hospitality-builds/{id}/approve"

  - priority: 41
    category: state
    check: "the RightsDeal is in a status the operation permits — commit requires DRAFT; creating a ReleaseTranche or an AllocationBlock requires deal_status IN {COMMITTED, PARTIALLY_RELEASED, SHORTFALL_DECLARED}; settle requires deal_status IN {PARTIALLY_RELEASED, FULLY_RELEASED, SHORTFALL_DECLARED} with no PENDING tranche remaining and Event.status IN {COMPLETED, CANCELLED}"
    error_id: ERR_INVALID_DEAL_STATE
    http_status: 409
    applies_to: "POST /rights-deals/{id}/commit, POST /rights-deals/{id}/settle, POST /release-tranches, POST /allocation-blocks"

  - priority: 42
    category: state
    check: "the ReleaseTranche has tranche_state == PENDING"
    error_id: ERR_TRANCHE_NOT_PENDING
    http_status: 409
    applies_to: "POST /release-tranches/{id}/confirm"

  - priority: 43
    category: state
    check: "the AllocationBlock has block_state IN {OPEN, EXHAUSTED}; recall additionally requires committed_units == 0"
    error_id: ERR_BLOCK_NOT_OPEN
    http_status: 409
    applies_to: "POST /allocation-blocks/{id}/recall, POST /bookings/{id}/allocate"

  - priority: 44
    category: state
    check: "the PackageProduct is in a status the operation permits — adding a component or pricing requires package_status IN {DRAFT, PRICED}; publish requires PRICED; being booked or being a rebook target requires PUBLISHED"
    error_id: ERR_INVALID_PACKAGE_STATE
    http_status: 409
    applies_to: "POST /package-components, POST /package-products/{id}/price, POST /package-products/{id}/publish, POST /bookings, POST /bookings/{id}/rebook"

  - priority: 45
    category: state
    check: "the Booking dimension the operation drives is in a permitted state — allocate requires fulfillment_status == RESERVED; issue-credentials requires fulfillment_status NOT IN {CANCELLED, DELIVERED, REBOOK_PENDING, CREDENTIALED}; cancel requires fulfillment_status NOT IN {CANCELLED, DELIVERED}; rebook requires fulfillment_status == REBOOK_PENDING; creating a HostAssignment requires fulfillment_status IN {ALLOCATED, CREDENTIALED}"
    error_id: ERR_INVALID_BOOKING_STATE
    http_status: 409
    applies_to: "POST /bookings/{id}/allocate, POST /bookings/{id}/issue-credentials, POST /bookings/{id}/cancel, POST /bookings/{id}/rebook, POST /host-assignments"

  - priority: 46
    category: state
    check: "the PaymentInstallment has installment_state IN {SCHEDULED, OVERDUE}, and when installment_kind == SCHEDULE its parent Booking.fulfillment_status != CANCELLED"
    error_id: ERR_INSTALLMENT_NOT_PAYABLE
    http_status: 409
    applies_to: "POST /payment-installments/{id}/pay"

  - priority: 47
    category: state
    check: "the HospitalityBuild has build_state == PLANNED for approve, build_state == APPROVED for ready, and build_state IN {APPROVED, READY} when a HostAssignment is created against it (a PLANNED build has no confirmed hospitality footprint to staff, and a CLOSED or CANCELLED build can no longer be staffed)"
    error_id: ERR_INVALID_BUILD_STATE
    http_status: 409
    applies_to: "POST /hospitality-builds/{id}/approve, POST /hospitality-builds/{id}/ready, POST /host-assignments"

  - priority: 48
    category: state
    check: "the HostAssignment has assignment_state == ASSIGNED"
    error_id: ERR_INVALID_ASSIGNMENT_STATE
    http_status: 409
    applies_to: "POST /host-assignments/{id}/release"

  # ---- 50-52 business_safety ----------------------------------------------
  - priority: 50
    category: business_safety
    check: "the Booking's Event has at least one HospitalityBuild with build_state == READY — clients are never credentialed into a venue whose hospitality space has not been signed off"
    error_id: ERR_BUILD_NOT_READY
    http_status: 422
    applies_to: "POST /bookings/{id}/issue-credentials"

  - priority: 51
    category: business_safety
    check: "X-User-ID differs from PackageProduct.priced_by_user_id — the operator who set the price may never be the operator who publishes it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /package-products/{id}/publish"

  - priority: 52
    category: business_safety
    check: "when the Event's risk_posture == CRITICAL the request carries risk_override_ack == true"
    error_id: ERR_EVENT_RISK_CRITICAL
    http_status: 422
    applies_to: "POST /bookings"

  # ---- 55-56 business_temporal --------------------------------------------
  - priority: 55
    category: business_temporal
    check: |
      No other HospitalityBuild on the same event_id and the same zone_code with
      build_state IN {PLANNED, APPROVED, READY} occupies an overlapping window.
      INTERVAL SEMANTICS: windows are CLOSED on both ends and each existing
      window is inflated by BUILD_BUFFER_MINUTES = 90 on BOTH sides for teardown
      and re-dress. The new build conflicts when
        new.service_window_start <= other.service_window_end   + 90 minutes
        AND new.service_window_end   >= other.service_window_start - 90 minutes
      Touching endpoints therefore conflict, and a 90-minute gap conflicts while
      a 91-minute gap does not.
    error_id: ERR_BUILD_ZONE_CONFLICT
    http_status: 409
    applies_to: "POST /hospitality-builds"

  - priority: 56
    category: business_temporal
    check: "the logical clock is at or before Event.rebook_deadline_at (inclusive)"
    error_id: ERR_REBOOK_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /bookings/{id}/rebook"

  # ---- 58-59 business_referential ----------------------------------------
  - priority: 58
    category: business_referential
    check: "Booking.allocation_block_id is non-null — credentials can only be minted against inventory that has actually been allocated to this booking"
    error_id: ERR_BOOKING_NOT_ALLOCATED
    http_status: 422
    applies_to: "POST /bookings/{id}/issue-credentials"

  - priority: 59
    category: business_referential
    check: "the PackageProduct has at least one PackageComponent"
    error_id: ERR_PACKAGE_HAS_NO_COMPONENTS
    http_status: 422
    applies_to: "POST /package-products/{id}/price"

  - priority: 60
    category: business_referential
    check: "the HospitalityBuild referenced by hospitality_build_id belongs to the same Event as the Booking referenced by booking_id, and the OnSiteHost's shift lies inside that build's service window"
    error_id: ERR_ASSIGNMENT_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST /host-assignments"

  - priority: 61
    category: business_referential
    check: "zone_code is a member of Event.hospitality_zone_codes"
    error_id: ERR_ZONE_NOT_AT_VENUE
    http_status: 422
    applies_to: "POST /hospitality-builds"

  # ---- 65-71 business_constraint -----------------------------------------
  - priority: 65
    category: business_constraint
    check: "guaranteed_minimum_units <= contracted_units"
    error_id: ERR_MINIMUM_EXCEEDS_CONTRACT
    http_status: 422
    applies_to: "POST /rights-deals"

  - priority: 66
    category: business_constraint
    check: "no other AllocationBlock on the same rights_deal_id has the same channel with block_state IN {OPEN, EXHAUSTED}"
    error_id: ERR_DUPLICATE_CHANNEL_BLOCK
    http_status: 409
    applies_to: "POST /allocation-blocks"

  - priority: 67
    category: business_constraint
    check: "sum of promised_units over this deal's tranches with tranche_state IN {PENDING, CONFIRMED, SHORT_CONFIRMED} plus the new promised_units is <= RightsDeal.contracted_units"
    error_id: ERR_TRANCHE_EXCEEDS_CONTRACT
    http_status: 422
    applies_to: "POST /release-tranches"

  - priority: 68
    category: business_constraint
    check: "confirmed_units is between 1 and ReleaseTranche.promised_units inclusive"
    error_id: ERR_CONFIRMED_UNITS_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /release-tranches/{id}/confirm"

  - priority: 69
    category: business_constraint
    check: |
      Adding this assignment must not push the host over capacity.
      INTERVAL SEMANTICS: shifts are HALF-OPEN [shift_start, shift_end), so a
      shift ending exactly when another starts does NOT overlap, and there is no
      buffer. The rule is an AGGREGATE capacity test, not a pairwise one: for
      every instant t covered by the new shift, the number of the host's
      HostAssignments with assignment_state == ASSIGNED whose half-open shift
      contains t, plus one for the new shift, must be
      <= OnSiteHost.max_concurrent_bookings.
    error_id: ERR_HOST_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /host-assignments"

  - priority: 70
    category: business_constraint
    check: "amount_cents_paid equals PaymentInstallment.amount_cents exactly — partial and over payments are rejected"
    error_id: ERR_INSTALLMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /payment-installments/{id}/pay"

  - priority: 71
    category: business_constraint
    check: "PackageProduct.margin_pct >= PackageProduct.min_margin_pct"
    error_id: ERR_MARGIN_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /package-products/{id}/publish"

  - priority: 72
    category: business_constraint
    check: "the Booking's channel equals the AllocationBlock's channel, and the block's RightsDeal.deal_status IN {PARTIALLY_RELEASED, FULLY_RELEASED}"
    error_id: ERR_CHANNEL_OR_DEAL_MISMATCH
    http_status: 422
    applies_to: "POST /bookings/{id}/allocate"

  # ---- 80-82 business_fiscal (money last) --------------------------------
  - priority: 80
    category: business_fiscal
    check: "Client.client_status == ACTIVE"
    error_id: ERR_CLIENT_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /bookings"

  - priority: 81
    category: business_fiscal
    check: "AllocationBlock.allocated_units - AllocationBlock.committed_units >= Booking.units * PackageProduct.tickets_per_package"
    error_id: ERR_ALLOCATION_UNITS_UNAVAILABLE
    http_status: 422
    applies_to: "POST /bookings/{id}/allocate"

  - priority: 82
    category: business_fiscal
    check: "Client.outstanding_cents + the new Booking.net_price_cents <= Client.credit_limit_cents (strictly exceeding the limit is rejected; landing exactly on it passes)"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /bookings"

# =============================================================================
# §1.5 API Endpoint Table
#
# Flat topology: every collection sits at the API root and every relationship
# travels in the request body as an explicit foreign key. Every FK declared in
# §1.1 is reverse-reachable through the matching filtered-list GET.
# All list endpoints accept `limit?` and `offset?` and answer with the §1.0
# pagination fields.
# =============================================================================
endpoints:

  # ---- logical clock and operations sweep ----------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint (§1.5 ladder rung 3): moves the server's logical clock to an arbitrary instant. The clock's startup default is 2026-08-01T00:00:00Z; before any call to this endpoint every rule that reads `logical_now` sees exactly that default and never the real wall clock."
    roles: [OperationsManager]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["sets the logical clock; recomputes nothing on its own"]

  - method: POST
    path: "/operations/daily-run"
    description: "Operations console daily rollover: lapses PENDING ReleaseTranches whose promised_release_at has passed, marks SCHEDULED PaymentInstallments past due_at as OVERDUE, re-evaluates every Client's credit standing, and re-runs the deal status function, the channel waterfall and the event risk score for everything it touched."
    roles: [OperationsManager]
    code: 200
    input: []
    output: "{ run_at: string, lapsed_tranche_count: integer, overdue_installment_count: integer, shortfall_deal_count: integer, client_status_change_count: integer }"
    side_effects:
      - "ReleaseTranche PENDING -> LAPSED for every tranche whose promised_release_at < logical clock, processed in promised_release_at ASC then created_at ASC order"
      - "increments RightsDeal.version by 1 for every deal whose tranche lapsed and re-runs calculations.rights_deal_minimum_liability and the deal status function"
      - "PaymentInstallment SCHEDULED -> OVERDUE for every installment whose due_at < logical clock; recomputes days_overdue"
      - "recomputes calculations.client_credit_exposure for every affected Client and moves client_status per the Client credit-standing machine"
      - "recomputes calculations.event_fulfillment_risk_score and risk_posture for every affected Event"

  # ---- Event ---------------------------------------------------------------
  - method: POST
    path: "/events"
    description: "Register a sporting fixture the provider intends to sell hospitality around."
    roles: [RightsManager]
    code: 201
    input: [name, sport, venue_name, hospitality_zone_codes, event_date]
    output: Event
    side_effects: ["status = SCHEDULED; fulfillment_risk_score = 0; risk_posture = NORMAL"]

  - method: GET
    path: "/events/{id}"
    description: "Read one fixture including its derived fulfillment risk."
    roles: [RightsManager, CommercialManager, CommercialDirector, ClientServiceAgent, OperationsManager, FinanceController, ClientPortalUser]
    code: 200
    input: []
    output: Event
    side_effects: []

  - method: POST
    path: "/events/{id}/postpone"
    description: "Postpone the fixture, or confirm a replacement date for an already-postponed fixture. From SCHEDULED or RESCHEDULED the call freezes every live Booking into REBOOK_PENDING and opens the rebooking window; from POSTPONED with a new_event_date it only re-dates the fixture."
    roles: [RightsManager]
    code: 200
    input: ["new_event_date?"]
    output: Event
    side_effects:
      - "see state_machines.Event SCHEDULED_to_POSTPONED for the depth-4 cascade (bookings -> installments and host assignments -> host counters and client exposure)"
      - "sets rebook_deadline_at, increments postponement_count, recomputes fulfillment_risk_score and risk_posture"

  - method: POST
    path: "/events/{id}/cancel"
    description: "Cancel the fixture. Terminates every rights deal, closes every package, cancels every live booking with a waived fee and a full refund, voids their installments, and stands down the hospitality builds and hosts."
    roles: [RightsManager]
    code: 200
    input: []
    output: Event
    side_effects: ["see state_machines.Event SCHEDULED_to_CANCELLED"]

  - method: POST
    path: "/events/{id}/complete"
    description: "Mark a played fixture complete. Requires the logical clock at or after event_date and no Booking still RESERVED or REBOOK_PENDING."
    roles: [RightsManager]
    code: 200
    input: []
    output: Event
    side_effects: ["see state_machines.Event SCHEDULED_to_COMPLETED; GET /events/{id}/margin-report now defaults to FINAL"]

  - method: GET
    path: "/events/{id}/margin-report"
    description: "Computed read: margin by event with unsold inventory exposure. `variant` defaults to PROVISIONAL while the event is live and to FINAL once it is COMPLETED or CANCELLED, and may be overridden to obtain the other variant for the same data."
    roles: [FinanceController, CommercialDirector]
    code: 200
    input: ["variant?"]
    output: "{ variant: string, revenue_cents: integer, rights_cost_cents: integer, build_cost_cents: integer, cost_cents: integer, unsold_units: integer, unsold_exposure_cents: integer, margin_cents: integer, net_margin_cents: integer, margin_pct: number }"
    side_effects: []

  # ---- RightsDeal ---------------------------------------------------------
  - method: POST
    path: "/rights-deals"
    description: "Acquire inventory rights from a team, promoter or federation, with a guaranteed minimum the provider pays for regardless of release or sale."
    roles: [RightsManager]
    code: 201
    input: [event_id, rights_holder_name, inventory_type, contracted_units, guaranteed_minimum_units, unit_cost_cents]
    output: RightsDeal
    side_effects: ["deal_status = DRAFT; released_units = 0; minimum_liability_cents = 0"]

  - method: GET
    path: "/rights-deals/{id}"
    description: "Read one rights deal including released_units, shortfall_units and minimum_liability_cents."
    roles: [RightsManager, CommercialManager, CommercialDirector, FinanceController]
    code: 200
    input: []
    output: RightsDeal
    side_effects: []

  - method: GET
    path: "/rights-deals"
    description: "List rights deals; reverse-reachability channel for RightsDeal.event_id."
    roles: [RightsManager, CommercialManager, CommercialDirector, FinanceController]
    code: 200
    input: ["event_id?", "deal_status?", "inventory_type?", "limit?", "offset?"]
    output: RightsDeal[]
    side_effects: []

  - method: POST
    path: "/rights-deals/{id}/commit"
    description: "Commit the deal, taking on the guaranteed-minimum liability."
    roles: [RightsManager]
    code: 200
    input: []
    output: RightsDeal
    side_effects:
      - "deal_status = COMMITTED; committed_by_user_id = X-User-ID"
      - "recomputes minimum_liability_cents and the Event's fulfillment_risk_score and risk_posture"

  - method: POST
    path: "/rights-deals/{id}/settle"
    description: "Settle the deal against the rights holder once the fixture has played or been cancelled and no tranche is still pending."
    roles: [FinanceController]
    code: 200
    input: []
    output: RightsDeal
    side_effects:
      - "deal_status = SETTLED; settled_at stamped; minimum_liability_cents frozen"
      - "every OPEN or EXHAUSTED AllocationBlock of the deal moves to RECALLED"
      - "recomputes the Event's fulfillment_risk_score and risk_posture"

  # ---- ReleaseTranche ----------------------------------------------------
  - method: POST
    path: "/release-tranches"
    description: "Record a release the rights holder has promised, with the instant by which it must be confirmed. Promising a fresh tranche on a SHORTFALL_DECLARED deal re-opens that deal."
    roles: [RightsManager]
    code: 201
    input: [rights_deal_id, promised_units, promised_release_at]
    output: ReleaseTranche
    side_effects:
      - "tranche_state = PENDING; confirmed_units = 0"
      - "re-runs the deal status function, which may move the deal SHORTFALL_DECLARED -> COMMITTED or SHORTFALL_DECLARED -> PARTIALLY_RELEASED"
      - "recomputes minimum_liability_cents and the Event's fulfillment_risk_score and risk_posture"

  - method: GET
    path: "/release-tranches/{id}"
    description: "Read one promised release."
    roles: [RightsManager, CommercialManager, ClientServiceAgent, FinanceController]
    code: 200
    input: []
    output: ReleaseTranche
    side_effects: []

  - method: GET
    path: "/release-tranches"
    description: "List promised releases; reverse-reachability channel for ReleaseTranche.rights_deal_id."
    roles: [RightsManager, CommercialManager, ClientServiceAgent, FinanceController]
    code: 200
    input: ["rights_deal_id?", "tranche_state?", "limit?", "offset?"]
    output: ReleaseTranche[]
    side_effects: []

  - method: POST
    path: "/release-tranches/{id}/confirm"
    description: "Confirm how many units the rights holder actually released. Confirming fewer than promised short-confirms the tranche and can push the deal into shortfall, shrink the channel allocation and revert already-allocated bookings."
    roles: [RightsManager]
    code: 200
    input: [confirmed_units, expected_rights_deal_version]
    output: ReleaseTranche
    side_effects:
      - "tranche_state = CONFIRMED when confirmed_units == promised_units, SHORT_CONFIRMED when 1 <= confirmed_units < promised_units; confirmed_at stamped"
      - "increments RightsDeal.version by 1"
      - "recomputes RightsDeal.released_units, shortfall_units, unallocated_units, minimum_liability_cents and deal_status"
      - "runs calculations.channel_allocation_waterfall, which distributes the newly released units across this deal's blocks in priority_rank ASC order and may flip a block OPEN -> EXHAUSTED; it never reduces an existing allocation"
      - "recomputes the Event's fulfillment_risk_score and risk_posture"

  # ---- AllocationBlock ---------------------------------------------------
  - method: POST
    path: "/allocation-blocks"
    description: "Reserve a share of a deal's inventory for one sales channel, with the waterfall priority that decides who is filled first when releases fall short."
    roles: [CommercialManager]
    code: 201
    input: [rights_deal_id, channel, target_units, priority_rank]
    output: AllocationBlock
    side_effects:
      - "block_state = OPEN; allocated_units = 0; committed_units = 0"
      - "runs calculations.channel_allocation_waterfall over the whole deal so already-released units flow into the new block in priority_rank ASC order"
      - "a block whose priority_rank sorts ahead of an existing block therefore REDUCES that incumbent's allocated_units, returning it to OPEN; when the reduction drops the incumbent's allocated_units below its committed_units the waterfall's revert pass moves its most recently created ALLOCATED Bookings back to RESERVED with allocation_block_id = null"
      - "recomputes RightsDeal.unallocated_units and the Event's fulfillment_risk_score and risk_posture"

  - method: GET
    path: "/allocation-blocks/{id}"
    description: "Read one channel allocation block including allocated, committed and released-back units."
    roles: [RightsManager, CommercialManager, ClientServiceAgent]
    code: 200
    input: []
    output: AllocationBlock
    side_effects: []

  - method: GET
    path: "/allocation-blocks"
    description: "List channel allocation blocks; reverse-reachability channel for AllocationBlock.rights_deal_id."
    roles: [RightsManager, CommercialManager, ClientServiceAgent]
    code: 200
    input: ["rights_deal_id?", "channel?", "block_state?", "limit?", "offset?"]
    output: AllocationBlock[]
    side_effects: []

  - method: POST
    path: "/allocation-blocks/{id}/recall"
    description: "Pull a channel's allocation back to the rights holder. Only possible while nothing is committed against it."
    roles: [RightsManager]
    code: 200
    input: []
    output: AllocationBlock
    side_effects:
      - "block_state = RECALLED; recalled_at stamped; allocated_units frozen"
      - "increments RightsDeal.version by 1 and recomputes unallocated_units"
      - "re-runs calculations.channel_allocation_waterfall over the remaining OPEN blocks"
      - "recomputes the Event's fulfillment_risk_score and risk_posture"

  # ---- PackageProduct ----------------------------------------------------
  - method: POST
    path: "/package-products"
    description: "Create a hospitality package skeleton for a fixture at one pricing tier."
    roles: [CommercialManager, CommercialDirector]
    code: 201
    input: ["event_id", "name", "tier", "tickets_per_package", "hotel_nights?", "transport_included?", "min_margin_pct?"]
    output: PackageProduct
    side_effects: ["package_status = DRAFT; all price fields 0"]

  - method: GET
    path: "/package-products/{id}"
    description: "Read one package including its computed cost, list price and margin."
    roles: [CommercialManager, CommercialDirector, ClientServiceAgent, FinanceController, ClientPortalUser]
    code: 200
    input: []
    output: PackageProduct
    side_effects: []

  - method: GET
    path: "/package-products"
    description: "List packages; reverse-reachability channel for PackageProduct.event_id."
    roles: [CommercialManager, CommercialDirector, ClientServiceAgent, FinanceController, ClientPortalUser]
    code: 200
    input: ["event_id?", "package_status?", "tier?", "limit?", "offset?"]
    output: PackageProduct[]
    side_effects: []

  - method: POST
    path: "/package-products/{id}/price"
    description: "Price the package: rounds every component line, sums the rounded lines, applies the tier multiplier and derives the margin. Re-pricing an already PRICED package clears the previous publish approval."
    roles: [CommercialManager, CommercialDirector]
    code: 200
    input: []
    output: PackageProduct
    side_effects:
      - "runs calculations.package_component_line_pricing then calculations.package_list_pricing"
      - "package_status = PRICED; priced_by_user_id = X-User-ID; priced_at stamped; published_by_user_id and published_at cleared"
      - "increments PackageProduct.version by 1"

  - method: POST
    path: "/package-products/{id}/publish"
    description: "Publish the reviewed price so the package can be sold. Requires the exact version whose margin was reviewed, a different operator from the one who priced it, a margin at or above the floor, and a committed ticket rights deal on the fixture."
    roles: [CommercialDirector]
    code: 200
    input: [expected_package_product_version]
    output: PackageProduct
    side_effects:
      - "package_status = PUBLISHED; published_by_user_id = X-User-ID; published_at stamped"
      - "increments PackageProduct.version by 1"

  # ---- PackageComponent --------------------------------------------------
  - method: POST
    path: "/package-components"
    description: "Add a ticket, hotel, transport, experience or catering line to a package. sequence_no pins the line's place in the rounding order."
    roles: [CommercialManager]
    code: 201
    input: [package_product_id, component_type, descriptor, quantity, unit_cost_cents, markup_pct, sequence_no]
    output: PackageComponent
    side_effects: ["line_cost_cents and line_price_cents computed immediately; the parent package's price fields are NOT refreshed until POST /package-products/{id}/price runs"]

  - method: GET
    path: "/package-components/{id}"
    description: "Read one package line item."
    roles: [CommercialManager, CommercialDirector, ClientServiceAgent]
    code: 200
    input: []
    output: PackageComponent
    side_effects: []

  - method: GET
    path: "/package-components"
    description: "List package line items; reverse-reachability channel for PackageComponent.package_product_id."
    roles: [CommercialManager, CommercialDirector, ClientServiceAgent]
    code: 200
    input: ["package_product_id?", "component_type?", "limit?", "offset?"]
    output: PackageComponent[]
    side_effects: []

  # ---- Client -------------------------------------------------------------
  - method: POST
    path: "/clients"
    description: "Register an individual buyer, a corporate client or a travel partner with its credit limit."
    roles: [ClientServiceAgent]
    code: 201
    input: ["name", "client_type", "credit_limit_cents?"]
    output: Client
    side_effects: ["client_status = ACTIVE; outstanding_cents = 0; overdue_installment_count = 0"]

  - method: GET
    path: "/clients/{id}"
    description: "Read one client including credit exposure. A ClientPortalUser may only read itself."
    roles: [ClientServiceAgent, FinanceController, ClientPortalUser]
    code: 200
    input: []
    output: Client
    side_effects: []

  # ---- Booking ------------------------------------------------------------
  - method: POST
    path: "/bookings"
    description: "Sell package units to a client. Prices the booking through the pinned evaluation order, generates the payment schedule, and refuses to add exposure beyond the client's credit limit."
    roles: [ClientServiceAgent]
    code: 201
    input: ["client_id", "package_product_id", "channel", "units", "risk_override_ack?"]
    output: Booking
    side_effects:
      - "fulfillment_status = RESERVED; payment_status = UNPAID"
      - "runs calculations.booking_net_price then calculations.payment_schedule_generation, which creates the PaymentInstallment rows (discoverable only through GET /payment-installments?booking_id=...)"
      - "recomputes calculations.client_credit_exposure for the Client and calculations.event_fulfillment_risk_score for the Event"

  - method: GET
    path: "/bookings/{id}"
    description: "Read one booking including both state dimensions, the price breakdown and the servicing itinerary."
    roles: [ClientServiceAgent, FinanceController, ClientPortalUser]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: GET
    path: "/bookings"
    description: "List bookings; reverse-reachability channel for Booking.client_id, Booking.package_product_id and Booking.allocation_block_id."
    roles: [ClientServiceAgent, FinanceController]
    code: 200
    input: ["client_id?", "package_product_id?", "allocation_block_id?", "fulfillment_status?", "payment_status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: POST
    path: "/bookings/{id}/allocate"
    description: "Commit released inventory from a channel block to this booking. Carries the block version the agent last observed."
    roles: [ClientServiceAgent]
    code: 200
    input: [allocation_block_id, expected_allocation_block_version]
    output: Booking
    side_effects:
      - "fulfillment_status = ALLOCATED; allocation_block_id set"
      - "AllocationBlock.committed_units increases by units * tickets_per_package and increments AllocationBlock.version by 1"
      - "recomputes the Event's fulfillment_risk_score and risk_posture"

  - method: POST
    path: "/bookings/{id}/issue-credentials"
    description: "Mint match and hospitality credentials and freeze the client itinerary. Requires a READY hospitality build on the fixture and inventory already allocated to this booking."
    roles: [ClientServiceAgent]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "fulfillment_status = CREDENTIALED; credentials_issued_count = units * (tickets_per_package + 1); credential_serial_prefix stamped; itinerary computed"

  - method: POST
    path: "/bookings/{id}/cancel"
    description: "Cancel the booking. The settlement variant is selected from the fixture's status: the days-to-event schedule for a live or played fixture, irrecoverable committed cost for a postponed one."
    roles: [ClientServiceAgent, ClientPortalUser]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "runs calculations.booking_cancellation_settlement; writes settlement_variant, cancellation_fee_cents, refund_cents, balance_due_cents"
      - "fulfillment_status = CANCELLED; allocation_block_id cleared; payment_status = REFUNDED or SETTLEMENT_DUE"
      - "voids the remaining installments and, when a balance is due, creates one SETTLEMENT installment"
      - "returns committed units to the AllocationBlock, voids ASSIGNED HostAssignments, recomputes host counters, client exposure and event risk"

  - method: POST
    path: "/bookings/{id}/rebook"
    description: "Move a frozen booking onto a published package after a postponement, re-price it and re-issue its payment schedule. Only inside the rebooking window."
    roles: [ClientServiceAgent]
    code: 200
    input: [target_package_product_id]
    output: Booking
    side_effects:
      - "package_product_id replaced; rebook_count += 1; fulfillment_status = RESERVED"
      - "re-runs calculations.booking_net_price and calculations.payment_schedule_generation after voiding the superseded SCHEDULED and OVERDUE installments"
      - "recomputes client exposure and the fulfillment risk of both the old and the new Event"

  # ---- PaymentInstallment ------------------------------------------------
  - method: GET
    path: "/payment-installments/{id}"
    description: "Read one installment of a payment schedule."
    roles: [FinanceController, ClientServiceAgent, ClientPortalUser]
    code: 200
    input: []
    output: PaymentInstallment
    side_effects: []

  - method: GET
    path: "/payment-installments"
    description: "List installments; the only discovery channel for cascade-created schedules and the reverse-reachability channel for PaymentInstallment.booking_id."
    roles: [FinanceController, ClientServiceAgent, ClientPortalUser]
    code: 200
    input: ["booking_id?", "installment_state?", "installment_kind?", "limit?", "offset?"]
    output: PaymentInstallment[]
    side_effects: []

  - method: POST
    path: "/payment-installments/{id}/pay"
    description: "Settle one installment in full. Partial and over payments are rejected."
    roles: [FinanceController, ClientPortalUser]
    code: 200
    input: [amount_cents_paid]
    output: PaymentInstallment
    side_effects:
      - "installment_state = PAID; paid_amount_cents and paid_at stamped"
      - "advances the parent Booking's payment dimension and recomputes Booking.paid_cents"
      - "recomputes calculations.client_credit_exposure for the Client"

  # ---- HospitalityBuild ---------------------------------------------------
  - method: POST
    path: "/hospitality-builds"
    description: "Plan a venue hospitality build-out with its catering and staffing, occupying one venue zone for a service window. Windows are closed intervals inflated by a 90-minute teardown buffer when tested for conflicts."
    roles: [OperationsManager]
    code: 201
    input: [event_id, zone_code, service_window_start, service_window_end, space_units, catering_covers, staff_count, build_cost_cents, catering_cost_cents, staffing_cost_cents]
    output: HospitalityBuild
    side_effects: ["build_state = PLANNED; total_cost_cents computed; the build does not yet enter the margin cost base"]

  - method: GET
    path: "/hospitality-builds/{id}"
    description: "Read one hospitality build-out."
    roles: [OperationsManager, FinanceController, ClientServiceAgent]
    code: 200
    input: []
    output: HospitalityBuild
    side_effects: []

  - method: GET
    path: "/hospitality-builds"
    description: "List hospitality build-outs; reverse-reachability channel for HospitalityBuild.event_id."
    roles: [OperationsManager, FinanceController, ClientServiceAgent]
    code: 200
    input: ["event_id?", "build_state?", "zone_code?", "limit?", "offset?"]
    output: HospitalityBuild[]
    side_effects: []

  - method: POST
    path: "/hospitality-builds/{id}/approve"
    description: "Finance sign-off on the build, catering and staffing cost. Approval is what pulls the cost into the event margin."
    roles: [FinanceController]
    code: 200
    input: []
    output: HospitalityBuild
    side_effects: ["build_state = APPROVED; approved_by_user_id = X-User-ID; total_cost_cents enters calculations.event_margin_report's cost base"]

  - method: POST
    path: "/hospitality-builds/{id}/ready"
    description: "Declare the build-out dressed, catered and staffed. A READY build on the fixture is the safety gate for credential issuance."
    roles: [OperationsManager]
    code: 200
    input: []
    output: HospitalityBuild
    side_effects: ["build_state = READY"]

  # ---- OnSiteHost --------------------------------------------------------
  - method: POST
    path: "/on-site-hosts"
    description: "Register an on-site host with the number of client bookings it can cover at any single instant."
    roles: [OperationsManager]
    code: 201
    input: ["full_name", "languages", "max_concurrent_bookings?"]
    output: OnSiteHost
    side_effects: ["active_assignment_count = 0"]

  - method: GET
    path: "/on-site-hosts/{id}"
    description: "Read one host including its live assignment count."
    roles: [OperationsManager, ClientServiceAgent]
    code: 200
    input: []
    output: OnSiteHost
    side_effects: []

  # ---- HostAssignment ----------------------------------------------------
  - method: POST
    path: "/host-assignments"
    description: "Roster a host onto a client booking for a half-open shift inside a build's service window. Shifts are aggregate-capacity tested against the host's max_concurrent_bookings; adjacency is allowed."
    roles: [ClientServiceAgent, OperationsManager]
    code: 201
    input: [on_site_host_id, booking_id, hospitality_build_id, shift_start, shift_end]
    output: HostAssignment
    side_effects: ["assignment_state = ASSIGNED; OnSiteHost.active_assignment_count recomputed; the booking's itinerary host_names list recomputed"]

  - method: GET
    path: "/host-assignments/{id}"
    description: "Read one host assignment."
    roles: [OperationsManager, ClientServiceAgent]
    code: 200
    input: []
    output: HostAssignment
    side_effects: []

  - method: GET
    path: "/host-assignments"
    description: "List host assignments; reverse-reachability channel for HostAssignment.on_site_host_id, HostAssignment.booking_id and HostAssignment.hospitality_build_id."
    roles: [OperationsManager, ClientServiceAgent]
    code: 200
    input: ["on_site_host_id?", "booking_id?", "hospitality_build_id?", "assignment_state?", "limit?", "offset?"]
    output: HostAssignment[]
    side_effects: []

  - method: POST
    path: "/host-assignments/{id}/release"
    description: "Release a host from an assignment, freeing capacity for the same shift window."
    roles: [OperationsManager, ClientServiceAgent]
    code: 200
    input: []
    output: HostAssignment
    side_effects: ["assignment_state = RELEASED; released_at stamped; OnSiteHost.active_assignment_count recomputed; the booking's itinerary host_names list recomputed"]

# =============================================================================
# §1.6 Error Code Catalog
#
# 48 codes. Every code is triggerable from at least one §1.5 endpoint and every
# code corresponds to exactly one §1.4 validation priority, so the ladder and
# the catalog cannot drift apart.
# =============================================================================
errors:

  # ---- auth ----------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role is missing, or X-User-Role is not one of the seven declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_CLIENT_SCOPE_VIOLATION
    http: 403
    condition: "a ClientPortalUser reads or acts on a Client, Booking or PaymentInstallment that does not belong to it"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, wrong type, undeclared enum member, non-positive units/quantity, service_window_end <= service_window_start, shift_end <= shift_start, empty hospitality_zone_codes, or pagination limit outside 1..100"

  # ---- existence -----------------------------------------------------------
  - id: ERR_EVENT_NOT_FOUND
    http: 404
    condition: "no Event matches the path id or the body event_id"
  - id: ERR_RIGHTS_DEAL_NOT_FOUND
    http: 404
    condition: "no RightsDeal matches the path id or the body rights_deal_id"
  - id: ERR_TRANCHE_NOT_FOUND
    http: 404
    condition: "no ReleaseTranche matches the path id"
  - id: ERR_BLOCK_NOT_FOUND
    http: 404
    condition: "no AllocationBlock matches the path id or the body allocation_block_id"
  - id: ERR_PACKAGE_NOT_FOUND
    http: 404
    condition: "no PackageProduct matches the path id, the body package_product_id, or the body target_package_product_id"
  - id: ERR_COMPONENT_NOT_FOUND
    http: 404
    condition: "no PackageComponent matches the path id"
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "no Client matches the path id or the body client_id"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "no Booking matches the path id or the body booking_id"
  - id: ERR_INSTALLMENT_NOT_FOUND
    http: 404
    condition: "no PaymentInstallment matches the path id"
  - id: ERR_BUILD_NOT_FOUND
    http: 404
    condition: "no HospitalityBuild matches the path id or the body hospitality_build_id"
  - id: ERR_HOST_NOT_FOUND
    http: 404
    condition: "no OnSiteHost matches the path id or the body on_site_host_id"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "no HostAssignment matches the path id"

  # ---- optimistic concurrency ---------------------------------------------
  - id: ERR_STALE_BLOCK_VERSION
    http: 412
    condition: "expected_allocation_block_version does not equal the AllocationBlock's current version on POST /bookings/{id}/allocate"
  - id: ERR_STALE_DEAL_VERSION
    http: 412
    condition: "expected_rights_deal_version does not equal the parent RightsDeal's current version on POST /release-tranches/{id}/confirm"
  - id: ERR_STALE_PACKAGE_VERSION
    http: 412
    condition: "expected_package_product_version does not equal the PackageProduct's current version on POST /package-products/{id}/publish — typically because a re-price bumped it and cleared the approval"

  # ---- state preconditions ------------------------------------------------
  - id: ERR_INVALID_EVENT_STATE
    http: 409
    condition: "the Event's status does not permit the operation — e.g. postponing a CANCELLED or COMPLETED fixture, postponing an already POSTPONED fixture without a new_event_date, completing a fixture whose event_date is still in the future, or creating a rights deal, package or build on a CANCELLED fixture"
  - id: ERR_INVALID_DEAL_STATE
    http: 409
    condition: "the RightsDeal's deal_status does not permit the operation — committing a non-DRAFT deal, adding a tranche or block to a DRAFT/SETTLED/TERMINATED/FULLY_RELEASED deal, or settling a deal that still has a PENDING tranche or whose Event has not finished"
  - id: ERR_TRANCHE_NOT_PENDING
    http: 409
    condition: "confirming a ReleaseTranche that is already CONFIRMED, SHORT_CONFIRMED or LAPSED"
  - id: ERR_BLOCK_NOT_OPEN
    http: 409
    condition: "allocating from a RECALLED block, or recalling a block that is RECALLED or still has committed_units > 0"
  - id: ERR_INVALID_PACKAGE_STATE
    http: 409
    condition: "adding a component to or pricing a PUBLISHED/CLOSED package, publishing a package that is not PRICED, or booking / rebooking onto a package that is not PUBLISHED"
  - id: ERR_INVALID_BOOKING_STATE
    http: 409
    condition: "the Booking's fulfillment dimension forbids the operation — allocating a booking that is not RESERVED, credentialing a CANCELLED/DELIVERED/REBOOK_PENDING/CREDENTIALED booking, cancelling an already CANCELLED or DELIVERED booking, rebooking a booking that is not REBOOK_PENDING, or rostering a host onto a booking that is not yet ALLOCATED"
  - id: ERR_INSTALLMENT_NOT_PAYABLE
    http: 409
    condition: "paying a PaymentInstallment that is already PAID or has been VOIDED, or paying a SCHEDULE installment whose Booking has been cancelled"
  - id: ERR_INVALID_BUILD_STATE
    http: 409
    condition: "approving a HospitalityBuild that is not PLANNED, declaring ready a build that is not APPROVED, or creating a HostAssignment against a build whose build_state is not APPROVED or READY"
  - id: ERR_INVALID_ASSIGNMENT_STATE
    http: 409
    condition: "releasing a HostAssignment that is already RELEASED or VOIDED"

  # ---- business_safety -----------------------------------------------------
  - id: ERR_BUILD_NOT_READY
    http: 422
    condition: "issuing credentials while the fixture has no HospitalityBuild in build_state READY"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the X-User-ID publishing a package equals the package's priced_by_user_id"
  - id: ERR_EVENT_RISK_CRITICAL
    http: 422
    condition: "booking against a fixture whose risk_posture is CRITICAL without risk_override_ack == true"

  # ---- business_temporal ---------------------------------------------------
  - id: ERR_BUILD_ZONE_CONFLICT
    http: 409
    condition: "a live HospitalityBuild already occupies the same venue zone on the same fixture within the closed service window inflated by the 90-minute buffer on both sides"
  - id: ERR_REBOOK_WINDOW_CLOSED
    http: 422
    condition: "rebooking after the logical clock has passed Event.rebook_deadline_at"

  # ---- business_referential ------------------------------------------------
  - id: ERR_BOOKING_NOT_ALLOCATED
    http: 422
    condition: "issuing credentials for a Booking whose allocation_block_id is still null"
  - id: ERR_PACKAGE_HAS_NO_COMPONENTS
    http: 422
    condition: "pricing a PackageProduct that has zero PackageComponents — the empty-collection edge of the line-pricing calculation"
  - id: ERR_ASSIGNMENT_SCOPE_MISMATCH
    http: 422
    condition: "the hospitality_build_id belongs to a different Event than the booking_id, or the shift falls outside that build's service window"
  - id: ERR_ZONE_NOT_AT_VENUE
    http: 422
    condition: "zone_code is not a member of the Event's hospitality_zone_codes"

  # ---- business_constraint -------------------------------------------------
  - id: ERR_MINIMUM_EXCEEDS_CONTRACT
    http: 422
    condition: "guaranteed_minimum_units exceeds contracted_units on rights-deal creation"
  - id: ERR_DUPLICATE_CHANNEL_BLOCK
    http: 409
    condition: "a live AllocationBlock for the same channel already exists on the deal"
  - id: ERR_TRANCHE_EXCEEDS_CONTRACT
    http: 422
    condition: "the deal's live promised_units plus the new promised_units exceeds contracted_units"
  - id: ERR_CONFIRMED_UNITS_OUT_OF_RANGE
    http: 422
    condition: "confirmed_units is below 1 or above the tranche's promised_units"
  - id: ERR_HOST_CAPACITY_EXCEEDED
    http: 409
    condition: "the new half-open shift would push the host's concurrently-covered bookings above max_concurrent_bookings at some instant"
  - id: ERR_INSTALLMENT_AMOUNT_MISMATCH
    http: 422
    condition: "amount_cents_paid differs from the installment's amount_cents — the boundary form of ERR_INVALID_REQUEST for money, distinguishing a well-formed but wrong payment from a malformed one"
  - id: ERR_MARGIN_BELOW_FLOOR
    http: 422
    condition: "the package's computed margin_pct is below its min_margin_pct at publish time"
  - id: ERR_CHANNEL_OR_DEAL_MISMATCH
    http: 422
    condition: "the booking's channel differs from the block's channel, or the block's deal has not released any inventory yet"

  # ---- business_fiscal -----------------------------------------------------
  - id: ERR_CLIENT_NOT_ACTIVE
    http: 422
    condition: "booking for a Client whose client_status is ON_HOLD or BLOCKED"
  - id: ERR_ALLOCATION_UNITS_UNAVAILABLE
    http: 422
    condition: "the block's free units (allocated_units - committed_units) are fewer than the booking needs — the 'would exceed' counterpart of ERR_BLOCK_NOT_OPEN"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 402
    condition: "the client's outstanding exposure plus the new booking's net price strictly exceeds credit_limit_cents; landing exactly on the limit is allowed"

# =============================================================================
# §1.7 RBAC Matrix — role_model: segregation_of_duties
#
# Rights acquisition, commercial pricing, price approval, client servicing,
# venue operations and money movement are six separate hands. The compliance
# spine is the pricing pair: the operator who prices a package can never be the
# operator who publishes it (ERR_SEGREGATION_OF_DUTIES), and publishing is the
# exclusive right of CommercialDirector while pricing is shared.
# =============================================================================
roles:

  - name: RightsManager
    description: "Acquires inventory rights from teams, promoters and federations; owns fixture lifecycle, deal commitment, promised releases and their confirmation, and inventory recall."
    identity: opaque
    exclusive_operations:
      - "POST /events"
      - "POST /events/{id}/postpone"
      - "POST /events/{id}/cancel"
      - "POST /events/{id}/complete"
      - "POST /rights-deals"
      - "POST /rights-deals/{id}/commit"
      - "POST /release-tranches"
      - "POST /release-tranches/{id}/confirm"
      - "POST /allocation-blocks/{id}/recall"
    shared_operations:
      - "GET /events/{id}"
      - "GET /rights-deals/{id}, GET /rights-deals"
      - "GET /release-tranches/{id}, GET /release-tranches"
      - "GET /allocation-blocks/{id}, GET /allocation-blocks"

  - name: CommercialManager
    description: "Builds the sellable product: channel allocation blocks with their waterfall priority, package skeletons and their component lines, and the pricing pass. May never approve its own price."
    identity: opaque
    exclusive_operations:
      - "POST /allocation-blocks"
      - "POST /package-components"
    shared_operations:
      - "POST /package-products"
      - "POST /package-products/{id}/price"
      - "GET /events/{id}"
      - "GET /rights-deals/{id}, GET /rights-deals"
      - "GET /release-tranches/{id}, GET /release-tranches"
      - "GET /allocation-blocks/{id}, GET /allocation-blocks"
      - "GET /package-products/{id}, GET /package-products"
      - "GET /package-components/{id}, GET /package-components"

  - name: CommercialDirector
    description: "Approves the reviewed margin and releases the package for sale. Publishing is exclusive to this role and additionally blocked when the acting user is the one who priced the package."
    identity: opaque
    exclusive_operations:
      - "POST /package-products/{id}/publish"
    shared_operations:
      - "POST /package-products"
      - "POST /package-products/{id}/price"
      - "GET /events/{id}"
      - "GET /events/{id}/margin-report"
      - "GET /rights-deals/{id}, GET /rights-deals"
      - "GET /package-products/{id}, GET /package-products"
      - "GET /package-components/{id}, GET /package-components"

  - name: ClientServiceAgent
    description: "Sells and services: registers clients, takes bookings, commits allocation to them, mints credentials and itineraries, rebooks after a postponement, and rosters on-site hosts."
    identity: opaque
    exclusive_operations:
      - "POST /clients"
      - "POST /bookings"
      - "POST /bookings/{id}/allocate"
      - "POST /bookings/{id}/issue-credentials"
      - "POST /bookings/{id}/rebook"
    shared_operations:
      - "POST /bookings/{id}/cancel"
      - "POST /host-assignments"
      - "POST /host-assignments/{id}/release"
      - "GET /events/{id}"
      - "GET /release-tranches/{id}, GET /release-tranches"
      - "GET /allocation-blocks/{id}, GET /allocation-blocks"
      - "GET /package-products/{id}, GET /package-products"
      - "GET /package-components/{id}, GET /package-components"
      - "GET /clients/{id}"
      - "GET /bookings/{id}, GET /bookings"
      - "GET /payment-installments/{id}, GET /payment-installments"
      - "GET /hospitality-builds/{id}, GET /hospitality-builds"
      - "GET /on-site-hosts/{id}"
      - "GET /host-assignments/{id}, GET /host-assignments"

  - name: OperationsManager
    description: "Runs the venue and the clock: plans hospitality build-outs, declares them dressed and staffed, registers hosts, and drives the daily rollover sweep."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /operations/daily-run"
      - "POST /hospitality-builds"
      - "POST /hospitality-builds/{id}/ready"
      - "POST /on-site-hosts"
    shared_operations:
      - "POST /host-assignments"
      - "POST /host-assignments/{id}/release"
      - "GET /events/{id}"
      - "GET /hospitality-builds/{id}, GET /hospitality-builds"
      - "GET /on-site-hosts/{id}"
      - "GET /host-assignments/{id}, GET /host-assignments"

  - name: FinanceController
    description: "Controls money and cost recognition: approves build/catering/staffing spend, settles rights deals against the holder, records installment payments, and reads the event margin."
    identity: opaque
    exclusive_operations:
      - "POST /rights-deals/{id}/settle"
      - "POST /hospitality-builds/{id}/approve"
    shared_operations:
      - "POST /payment-installments/{id}/pay"
      - "GET /events/{id}"
      - "GET /events/{id}/margin-report"
      - "GET /rights-deals/{id}, GET /rights-deals"
      - "GET /release-tranches/{id}, GET /release-tranches"
      - "GET /package-products/{id}, GET /package-products"
      - "GET /clients/{id}"
      - "GET /bookings/{id}, GET /bookings"
      - "GET /payment-installments/{id}, GET /payment-installments"
      - "GET /hospitality-builds/{id}, GET /hospitality-builds"

  - name: ClientPortalUser
    description: "The buying client acting for itself through the self-service portal: reads its own record, bookings, packages and schedule, pays its own installments and cancels its own booking. X-User-ID is the Client's id, so every touched Booking or PaymentInstallment must trace back to it or the request is scope-rejected."
    identity: "entity_backed:Client"
    exclusive_operations: []
    shared_operations:
      - "POST /payment-installments/{id}/pay"
      - "POST /bookings/{id}/cancel"
      - "GET /events/{id}"
      - "GET /clients/{id}"
      - "GET /bookings/{id}"
      - "GET /package-products/{id}, GET /package-products"
      - "GET /payment-installments/{id}, GET /payment-installments"

