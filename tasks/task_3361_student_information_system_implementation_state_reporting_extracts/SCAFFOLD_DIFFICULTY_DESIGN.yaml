  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: section_commit_requires_open_school_year
        grounds:
          - state_machines.Section.DRAFT_to_COMMITTED
          - errors.ERR_YEAR_NOT_OPEN
        distinguishing_aspect: "Entity pair Section -> SchoolYear: a fully specified section in a PLANNING year cannot commit until the sibling SchoolYear aggregate transitions to OPEN."
        test_recipe:
          setup:
            - "Clock default. TX district LIVE; year in PLANNING (never opened); course created; section created DRAFT with teacher_ref set."
          setup_api_calls:
            - *c_clock
            - *c_d1
            - *c_d1_act
            - *c_sp1
            - *c_sp1_pub
            - *c_y1
            - *c_course1
            - *c_sec_a2
          trigger:
            - call: "POST /sis/sections/${sec1}/commit"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response status 409 with error_id == ERR_YEAR_NOT_OPEN"
            - "Section.${sec1}.status remains DRAFT"
            - "after POST /sis/school-years/${y1}/open succeeds, a retried commit transitions the section to COMMITTED"

      - name: extract_create_requires_published_spec
        grounds:
          - state_machines.StateCollectionSpec
          - errors.ERR_SPEC_NOT_PUBLISHED
        distinguishing_aspect: "Entity pair ReportingExtract -> StateCollectionSpec (different pair than Section -> SchoolYear): extract creation is gated on the referenced spec being PUBLISHED, so a DRAFT spec blocks the extract even though the year is correctly CLOSED_FOR_REPORTING."
        test_recipe:
          setup:
            - "Clock default. TX district LIVE; TX spec left in DRAFT (never published); year OPEN with one full-year enrollment, then CLOSED_FOR_REPORTING."
          setup_api_calls:
            - *c_clock
            - *c_d1
            - *c_d1_act
            - *c_sp1
            - *c_y1
            - *c_y1_open
            - *c_st1
            - *c_en1
            - *c_y1_close
          trigger:
            - call: "POST /sis/reporting-extracts"
              payload: { school_year_id: "${y1}", collection_spec_id: "${sp1}", expected_school_year_version: "${y1_v}" }
              as: StateReporter
              captures: { err: $.data.error_id }
          assert:
            - "response status 409 with error_id == ERR_SPEC_NOT_PUBLISHED"
            - "GET /sis/reporting-extracts?school_year_id=${y1} returns total_count == 0"
            - "after POST /sis/collection-specs/${sp1}/publish, the same create with a fresh expected_school_year_version succeeds"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: school_year_half_open_adjacency_allowed
        grounds:
          - entities.SchoolYear.fields.start_date
          - errors.ERR_YEAR_WINDOW_OVERLAP
        distinguishing_aspect: "Interval semantics: HALF-OPEN [start, end) windows on the District resource — a year starting exactly when the previous one ends (end == start) is legal adjacency, while a one-day-earlier start is a genuine overlap."
        test_recipe:
          setup:
            - "Clock default. TX district LIVE. Year A [2026-08-01, 2027-06-01) already exists."
          setup_api_calls:
            - *c_clock
            - *c_d1
            - *c_d1_act
            - *c_y1
          trigger:
            - call: "POST /sis/school-years"
              payload: { district_id: "${d1}", label: "2027-2028", start_date: "2027-06-01T00:00:00Z", end_date: "2028-06-01T00:00:00Z", instructional_days: 180, count_date: "2027-10-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { y_adj: $.data.id }
            - call: "POST /sis/school-years"
              payload: { district_id: "${d1}", label: "2027-2028-early", start_date: "2027-05-31T00:00:00Z", end_date: "2028-05-31T00:00:00Z", instructional_days: 180, count_date: "2027-10-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the adjacent year (start == A.end) is created 201 with id ${y_adj}"
            - "the year starting 2027-05-31 (one day before A.end) is rejected 409 with error_id == ERR_YEAR_WINDOW_OVERLAP"
            - "GET /sis/school-years?district_id=${d1} returns total_count == 2"

      - name: section_room_buffer_rejects_exact_adjacency
        grounds:
          - state_machines.Section.DRAFT_to_COMMITTED
          - errors.ERR_SECTION_TIME_OVERLAP
        distinguishing_aspect: "Different interval semantics on a different resource: sections sharing a room (or teacher) within a school year require a 10-minute buffer, so exact adjacency (new.start == existing.end) is REJECTED — the opposite treatment of the school-year rule — while a start exactly 10 minutes after is accepted."
        test_recipe:
          setup:
            - "Clock default. TX district LIVE; year OPEN; course ALG1; committed section SEC-A in room R1 teacher T1 occupying [480, 540)."
          setup_api_calls:
            - *c_clock
            - *c_d1
            - *c_d1_act
            - *c_sp1
            - *c_sp1_pub
            - *c_y1
            - *c_y1_open
            - *c_course1
            - *c_sec_a2
            - call: "POST /sis/sections/${sec1}/commit"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /sis/sections"
              payload: { course_id: "${co1}", school_year_id: "${y1}", teacher_ref: "T2", term_label: "SEM_1", room: "R1", period_start_min: 540, period_end_min: 600, capacity: 30 }
              as: Registrar
              captures: { sec_adj: $.data.id }
            - call: "POST /sis/sections/${sec_adj}/commit"
              payload: {}
              as: Registrar
              captures: { err_adj: $.data.error_id }
            - call: "POST /sis/sections"
              payload: { course_id: "${co1}", school_year_id: "${y1}", teacher_ref: "T3", term_label: "SEM_1", room: "R1", period_start_min: 550, period_end_min: 610, capacity: 30 }
              as: Registrar
              captures: { sec_ok: $.data.id }
            - call: "POST /sis/sections/${sec_ok}/commit"
              payload: {}
              as: Registrar
              captures: { ok_status: $.data.status }
          assert:
            - "adjacent section [540,600) in the same room commits to ERR_SECTION_TIME_OVERLAP (409) because the 0-minute gap < 10-minute buffer"
            - "Section.${sec_adj}.status remains DRAFT"
            - "section [550,610) with a gap of exactly 10 minutes commits successfully (${ok_status} == COMMITTED)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: roster_add_drop_conserves_seat_count
        grounds:
          - calculations.roster_seat_tracking
          - endpoints.POST_/sis/sections/{id}/roster-adds
          - endpoints.POST_/sis/sections/{id}/roster-drops
        distinguishing_aspect: "Conserved quantity: section roster occupancy. An add paired with its compensating drop returns roster_count to its exact pre-add value and frees the seat for a different enrollment."
        test_recipe:
          setup:
            - "Clock default. TX district LIVE; year OPEN; capacity-1 section SEC-A; students/enrollments en1 and en2 ACTIVE."
          setup_api_calls:
            - *c_clock
            - *c_d1
            - *c_d1_act
            - *c_sp1
            - *c_sp1_pub
            - *c_y1
            - *c_y1_open
            - *c_course1
            - &c_sec_a1
              call: "POST /sis/sections"
              payload: { course_id: "${co1}", school_year_id: "${y1}", teacher_ref: "T1", term_label: "SEM_1", room: "R1", period_start_min: 480, period_end_min: 540, capacity: 1 }
              as: Registrar
              captures: { sec1: $.data.id }
            - *c_st1
            - *c_en1
            - call: "POST /sis/students"
              payload: { district_id: "${d1}", student_number: "S002", first_name: "Bo", last_name: "Reyes", birth_date: "2013-09-09T00:00:00Z", entry_grade_level: "KG" }
              as: Registrar
              captures: { st2: $.data.id }
            - call: "POST /sis/enrollments"
              payload: { student_id: "${st2}", school_year_id: "${y1}", grade_level: "KG", entry_date: "2026-08-01T00:00:00Z" }
              as: Registrar
              captures: { en2: $.data.id }
            - call: "POST /sis/sections/${sec1}/roster-adds"
              payload: { enrollment_id: "${en1}" }
              as: Registrar
          trigger:
            - call: "POST /sis/sections/${sec1}/roster-drops"
              payload: { enrollment_id: "${en1}" }
              as: Registrar
              captures: { rc_after_drop: $.data.roster_count }
            - call: "POST /sis/sections/${sec1}/roster-adds"
              payload: { enrollment_id: "${en2}" }
              as: Registrar
              captures: { rc_after_readd: $.data.roster_count }
          assert:
            - "${rc_after_drop} == 0 — the add/drop pair left roster_count unchanged from its pre-add value"
            - "the freed seat accepts a different enrollment: ${rc_after_readd} == 1"
            - "GET /sis/sections/${sec1}/roster returns exactly [${en2}]"

      - name: rollover_execute_compensate_conserves_active_enrollments
        grounds:
          - calculations.rollover_conservation
          - state_machines.RolloverRun.COMMITTED_to_COMPENSATED
        distinguishing_aspect: "Conserved quantity (different from seat occupancy): the count of ACTIVE enrollments per school year and each student's status — execute followed by compensate restores both exactly."
        test_recipe:
          setup:
            - "Clock default. TX district LIVE; source year Y1 CLOSED_FOR_REPORTING with two ACTIVE enrollments (grade 12 stg, grade 09 st1); target year Y2 OPEN; rollover run created."
          setup_api_calls:
            - *c_clock
            - *c_d1
            - *c_d1_act
            - *c_sp1
            - *c_sp1_pub
            - *c_y1
            - *c_y1_open
            - *c_st1
            - *c_en1
            - *c_st_grad
            - call: "POST /sis/enrollments"
              payload: { student_id: "${stg}", school_year_id: "${y1}", grade_level: "12", entry_date: "2026-08-01T00:00:00Z" }
              as: Registrar
              captures: { eng: $.data.id }
            - *c_y2
            - *c_y2_open
            - *c_y1_close
            - call: "POST /sis/rollover-runs"
              payload: { district_id: "${d1}", source_school_year_id: "${y1}", target_school_year_id: "${y2}", expected_district_version: "${d1_v}" }
              as: DistrictAdmin
              captures: { rr1: $.data.id }
          trigger:
            - call: "POST /sis/rollover-runs/${rr1}/execute"
              payload: {}
              as: DistrictAdmin
              captures: { ex_promoted: $.data.promoted_count, ex_graduated: $.data.graduated_count }
            - call: "POST /sis/rollover-runs/${rr1}/compensate"
              payload: {}
              as: DistrictAdmin
          assert:
            - "after execute: promoted_count == 1 and graduated_count == 1; GET /sis/enrollments?school_year_id=${y1}&lifecycle=ACTIVE -> total_count 0; ?school_year_id=${y2}&lifecycle=ACTIVE -> total_count 1"
            - "after compensate: RolloverRun.${rr1}.status == COMPENSATED and counters reset to 0"
            - "after compensate: GET /sis/enrollments?school_year_id=${y1}&lifecycle=ACTIVE returns total_count == 2 (the conserved quantity is restored)"
            - "after compensate: GET /sis/enrollments?school_year_id=${y2}&lifecycle=ACTIVE returns total_count == 0 (created promotions deleted)"
            - "after compensate: Student.${stg}.status == ENROLLED and SchoolYear.${y1}.status == CLOSED_FOR_REPORTING"
