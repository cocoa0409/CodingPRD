              as: ElectionAdministrator
              as_user_id: "admin-1"
              captures: { e3: "$.data.id" }
            - call: "POST /electors"
              payload: { full_name: "Elector Four", bloc_id: "${bloc_id}", credential_expires_on: "2027-12-31T00:00:00Z", is_screening_member: false }
              as: ElectionAdministrator
              as_user_id: "admin-1"
              captures: { e4: "$.data.id" }
            - call: "POST /electors"
              payload: { full_name: "Elector Five", bloc_id: "${bloc_id}", credential_expires_on: "2027-12-31T00:00:00Z", is_screening_member: false }
              as: ElectionAdministrator
              as_user_id: "admin-1"
              captures: { e5: "$.data.id" }
            - call: "POST /electors/${e1}/credential"
              payload: {}
              as: ElectionAdministrator
              as_user_id: "admin-1"
            - call: "POST /electors/${e2}/credential"
