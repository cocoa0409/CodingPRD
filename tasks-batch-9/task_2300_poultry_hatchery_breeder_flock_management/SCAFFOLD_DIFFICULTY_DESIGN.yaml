# =============================================================================
# §1.8 Scaffold Difficulty Design — Poultry Hatchery & Breeder Flock Management
# Nine Difficulty Rules, every rule_id carrying >= 2 differentiated instances.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: chick_quality_provisional_vs_final_diverge
        grounds:
          - calculations.chick_quality_score
          - entities.ChickBatch.fields.quality_score_provisional
          - entities.ChickBatch.fields.quality_score_final
          - state_machines.HatcherLoad.HATCHING_to_WINDOW_PULLED
          - state_machines.ChickBatch.VACCINATED_to_BOXED
        distinguishing_aspect: |
          Both variants of chick_quality_score run on the same ChickBatch and the same inherited
          degree-hours, but PROVISIONAL (frozen at pull) forces cull_penalty and flag_penalty to
          0.00 while FINAL (computed at boxing) charges the resolved cull rate, so the two stored
          scores differ by exactly 1.32 on this fixture.
        test_recipe:
          setup:
            - "Logical clock starts at the fixed default 2026-08-01T00:00:00Z, then is driven forward explicitly."
            - "Program P1 (ROSS_308, stimulation_week 21), flock F1 (hatch_date 2026-01-05, hen_count 9000) cleared and IN_LAY."
            - "One graded and stored egg lot with settable_count 10000 drawn whole into setter load S1 in setter unit U1 under profile PR1 (transfer 456 h, total 504 h, stage 1 target 37.8 C)."
            - "S1 started at 2026-08-01T18:00:00Z, so weighted_age_days is 2.5000, storage_delay_hours is 0, planned_pull_at is 2026-08-22T18:00:00Z and the window is 2026-08-22T12:00:00Z .. 2026-08-23T00:00:00Z."
            - "Eight probe readings on 2026-08-02 accumulate deviation_degree_hours 4.200 and leave environment_status DEVIATION_RESOLVED."
            - "S1 candled at fertile_count 9600, transferred into hatcher unit U2, pulled inside the window at 2026-08-22T18:00:00Z with hatched_count 9400."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /flock-programs", payload: {code: "P1", breed: "ROSS_308", stimulation_week: 21, lighting_steps: [{age_weeks: 21, photoperiod_hours: 12.0}, {age_weeks: 24, photoperiod_hours: 14.0}, {age_weeks: 30, photoperiod_hours: 16.0}], feed_steps: [{age_weeks: 21, feed_grams_per_hen_day: 150.0}, {age_weeks: 26, feed_grams_per_hen_day: 168.0}]}, as: HatcheryManager, captures: {p1: "$.data.id"}}
            - {call: "POST /breeder-flocks", payload: {code: "F1", program_id: "${p1}", breed: "ROSS_308", house_code: "H1", hatch_date: "2026-01-05T00:00:00Z", placed_at: "2026-05-01T00:00:00Z", hen_count: 9000}, as: FlockManager, captures: {f1: "$.data.id"}}
            - {call: "POST /lab-tests", payload: {subject_type: "BREEDER_FLOCK", subject_id: "${f1}", test_code: "SALMONELLA_PULLORUM", collected_at: "2026-07-20T00:00:00Z"}, as: Veterinarian, captures: {t1: "$.data.id"}}
            - {call: "POST /lab-tests/${t1}/release", payload: {result: "NEGATIVE"}, as: Veterinarian}
            - {call: "POST /breeder-flocks/${f1}/start-lay", payload: {}, as: FlockManager}
            - {call: "POST /egg-lots", payload: {flock_id: "${f1}", collected_at: "2026-07-30T00:00:00Z", collected_count: 10500}, as: FlockManager, captures: {la: "$.data.id"}}
            - {call: "POST /egg-lots/${la}/grade", payload: {grade_a_count: 10000, cracked_count: 300, dirty_count: 150, small_count: 50}, as: FlockManager}
            - {call: "POST /egg-lots/${la}/store", payload: {storage_temp_c: 15.0}, as: IncubationOperator, captures: {lav: "$.data.version"}}
            - {call: "POST /incubation-units", payload: {code: "U1", unit_type: "SETTER", capacity_eggs: 20000}, as: HatcheryManager, captures: {u1: "$.data.id"}}
            - {call: "POST /incubation-units/${u1}/sanitize", payload: {}, as: IncubationOperator}
            - {call: "POST /incubation-profiles", payload: {code: "PR1", breed: "ROSS_308", transfer_hours: 456, total_hours: 504, stages: [{from_hour: 0, to_hour: 240, temp_c: 37.8, humidity_pct: 55.0}, {from_hour: 240, to_hour: 456, temp_c: 37.5, humidity_pct: 52.0}, {from_hour: 456, to_hour: 504, temp_c: 36.9, humidity_pct: 65.0}]}, as: HatcheryManager, captures: {pr1: "$.data.id"}}
            - {call: "POST /setter-loads", payload: {unit_id: "${u1}", profile_id: "${pr1}", planned_set_at: "2026-08-01T18:00:00Z"}, as: IncubationOperator, captures: {s1: "$.data.id"}}
            - {call: "POST /setter-loads/${s1}/items", payload: {egg_lot_id: "${la}", eggs_taken: 10000, expected_egg_lot_version: "${lav}"}, as: IncubationOperator}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T18:00:00Z"}, as: HatcheryManager}
            - {call: "POST /setter-loads/${s1}/start", payload: {}, as: IncubationOperator}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-02T16:00:00Z"}, as: HatcheryManager}
            - {call: "POST /setter-loads/${s1}/environment-readings", payload: {recorded_at: "2026-08-02T00:00:00Z", temp_c: 37.8, humidity_pct: 55.0}, as: IncubationOperator}
            - {call: "POST /setter-loads/${s1}/environment-readings", payload: {recorded_at: "2026-08-02T02:00:00Z", temp_c: 38.9, humidity_pct: 55.0}, as: IncubationOperator}
            - {call: "POST /setter-loads/${s1}/environment-readings", payload: {recorded_at: "2026-08-02T05:00:00Z", temp_c: 37.9, humidity_pct: 55.0}, as: IncubationOperator}
            - {call: "POST /setter-loads/${s1}/environment-readings", payload: {recorded_at: "2026-08-02T06:00:00Z", temp_c: 37.8, humidity_pct: 55.0}, as: IncubationOperator}
            - {call: "POST /setter-loads/${s1}/environment-readings", payload: {recorded_at: "2026-08-02T08:00:00Z", temp_c: 37.75, humidity_pct: 55.0}, as: IncubationOperator}
            - {call: "POST /setter-loads/${s1}/environment-readings", payload: {recorded_at: "2026-08-02T10:00:00Z", temp_c: 39.0, humidity_pct: 55.0}, as: IncubationOperator}
            - {call: "POST /setter-loads/${s1}/environment-readings", payload: {recorded_at: "2026-08-02T12:00:00Z", temp_c: 37.8, humidity_pct: 55.0}, as: IncubationOperator}
            - {call: "POST /setter-loads/${s1}/environment-readings", payload: {recorded_at: "2026-08-02T15:00:00Z", temp_c: 37.8, humidity_pct: 55.0}, as: IncubationOperator}
            - {call: "POST /setter-loads/${s1}/candle", payload: {fertile_count: 9600}, as: IncubationOperator}
            - {call: "POST /incubation-units", payload: {code: "U2", unit_type: "HATCHER", capacity_eggs: 20000}, as: HatcheryManager, captures: {u2: "$.data.id"}}
            - {call: "POST /incubation-units/${u2}/sanitize", payload: {}, as: IncubationOperator}
            - {call: "POST /setter-loads/${s1}/transfer", payload: {hatcher_unit_id: "${u2}"}, as: IncubationOperator, captures: {h1: "$.data.id"}}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-22T18:00:00Z"}, as: HatcheryManager}
            - {call: "POST /hatcher-loads/${h1}/pull", payload: {hatched_count: 9400}, as: ChickProcessor, captures: {cb1: "$.data.id", prov: "$.data.quality_score_provisional"}}
            - {call: "POST /chick-batches/${cb1}/sex", payload: {male_count: 4600, female_count: 4700, unsexed_count: 0, sexing_cull_count: 100}, as: ChickProcessor}
            - {call: "POST /chick-batches/${cb1}/vaccinate", payload: {vaccine_code: "MAREKS_HVT"}, as: ChickProcessor}
          trigger:
            - {call: "POST /chick-batches/${cb1}/box", payload: {}, as: ChickProcessor, as_user_id: "u_proc_1", captures: {fin: "$.data.quality_score_final"}}
          assert:
            - "HatcherLoad.${h1}.inherited_degree_hours == 4.200"
            - "HatcherLoad.${h1}.pull_class == WINDOW and HatcherLoad.${h1}.pull_offset_hours == 0.00 and HatcherLoad.${h1}.quality_flag == NONE"
            - "ChickBatch.${cb1}.quality_score_provisional == 87.40"
            - "ChickBatch.${cb1}.quality_score_final == 86.08"
            - "ChickBatch.${cb1}.quality_score_provisional - ChickBatch.${cb1}.quality_score_final == 1.32"
            - "ChickBatch.${cb1}.cull_count == 138 and ChickBatch.${cb1}.saleable_count == 9262"
            - "ChickBatch.${cb1}.quality_score_provisional is unchanged by the box call (still 87.40)"

      - name: flock_hatchability_set_vs_fertile_basis
        grounds:
          - calculations.flock_hatchability_rolling
          - entities.BreederFlock.fields.hatchability_rolling_pct
          - entities.BreederFlock.fields.hatchability_fertile_pct
          - entities.SetterLoad.fields.fertile_count
          - state_machines.ChickBatch.VACCINATED_to_BOXED
        distinguishing_aspect: |
          The two variants live on the BreederFlock entity (not ChickBatch) and differ only in the
          denominator: SET_BASIS divides by total_eggs_set 10000 giving 92.62 while FERTILE_BASIS
          divides by fertile_count 9600 giving 96.48, and only the SET_BASIS value is compared
          against HATCHABILITY_THRESHOLD_PCT.
        test_recipe:
          setup:
            - "Same program, flock, lot, setter unit and profile fixture as chick_quality_provisional_vs_final_diverge, with no environment readings so deviation_degree_hours stays 0."
            - "Setter load S1 holds one lot of 10000 settable eggs, candled at fertile_count 9600, transferred and pulled inside the window with hatched_count 9400."
            - "Sexing removes 100 culls, vaccination adds 38 more, leaving saleable_count 9262."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /flock-programs", payload: {code: "P1", breed: "ROSS_308", stimulation_week: 21, lighting_steps: [{age_weeks: 21, photoperiod_hours: 12.0}, {age_weeks: 24, photoperiod_hours: 14.0}, {age_weeks: 30, photoperiod_hours: 16.0}], feed_steps: [{age_weeks: 21, feed_grams_per_hen_day: 150.0}, {age_weeks: 26, feed_grams_per_hen_day: 168.0}]}, as: HatcheryManager, captures: {p1: "$.data.id"}}
            - {call: "POST /breeder-flocks", payload: {code: "F1", program_id: "${p1}", breed: "ROSS_308", house_code: "H1", hatch_date: "2026-01-05T00:00:00Z", placed_at: "2026-05-01T00:00:00Z", hen_count: 9000}, as: FlockManager, captures: {f1: "$.data.id"}}
            - {call: "POST /lab-tests", payload: {subject_type: "BREEDER_FLOCK", subject_id: "${f1}", test_code: "SALMONELLA_PULLORUM", collected_at: "2026-07-20T00:00:00Z"}, as: Veterinarian, captures: {t1: "$.data.id"}}
            - {call: "POST /lab-tests/${t1}/release", payload: {result: "NEGATIVE"}, as: Veterinarian}
            - {call: "POST /breeder-flocks/${f1}/start-lay", payload: {}, as: FlockManager}
            - {call: "POST /egg-lots", payload: {flock_id: "${f1}", collected_at: "2026-07-30T00:00:00Z", collected_count: 10500}, as: FlockManager, captures: {la: "$.data.id"}}
            - {call: "POST /egg-lots/${la}/grade", payload: {grade_a_count: 10000, cracked_count: 300, dirty_count: 150, small_count: 50}, as: FlockManager}
            - {call: "POST /egg-lots/${la}/store", payload: {storage_temp_c: 15.0}, as: IncubationOperator, captures: {lav: "$.data.version"}}
            - {call: "POST /incubation-units", payload: {code: "U1", unit_type: "SETTER", capacity_eggs: 20000}, as: HatcheryManager, captures: {u1: "$.data.id"}}
            - {call: "POST /incubation-units/${u1}/sanitize", payload: {}, as: IncubationOperator}
            - {call: "POST /incubation-profiles", payload: {code: "PR1", breed: "ROSS_308", transfer_hours: 456, total_hours: 504, stages: [{from_hour: 0, to_hour: 240, temp_c: 37.8, humidity_pct: 55.0}, {from_hour: 240, to_hour: 456, temp_c: 37.5, humidity_pct: 52.0}, {from_hour: 456, to_hour: 504, temp_c: 36.9, humidity_pct: 65.0}]}, as: HatcheryManager, captures: {pr1: "$.data.id"}}
            - {call: "POST /setter-loads", payload: {unit_id: "${u1}", profile_id: "${pr1}", planned_set_at: "2026-08-01T18:00:00Z"}, as: IncubationOperator, captures: {s1: "$.data.id"}}
            - {call: "POST /setter-loads/${s1}/items", payload: {egg_lot_id: "${la}", eggs_taken: 10000, expected_egg_lot_version: "${lav}"}, as: IncubationOperator}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T18:00:00Z"}, as: HatcheryManager}
            - {call: "POST /setter-loads/${s1}/start", payload: {}, as: IncubationOperator}
            - {call: "POST /setter-loads/${s1}/candle", payload: {fertile_count: 9600}, as: IncubationOperator}
            - {call: "POST /incubation-units", payload: {code: "U2", unit_type: "HATCHER", capacity_eggs: 20000}, as: HatcheryManager, captures: {u2: "$.data.id"}}
            - {call: "POST /incubation-units/${u2}/sanitize", payload: {}, as: IncubationOperator}
            - {call: "POST /setter-loads/${s1}/transfer", payload: {hatcher_unit_id: "${u2}"}, as: IncubationOperator, captures: {h1: "$.data.id"}}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-22T18:00:00Z"}, as: HatcheryManager}
            - {call: "POST /hatcher-loads/${h1}/pull", payload: {hatched_count: 9400}, as: ChickProcessor, captures: {cb1: "$.data.id"}}
            - {call: "POST /chick-batches/${cb1}/sex", payload: {male_count: 4600, female_count: 4700, unsexed_count: 0, sexing_cull_count: 100}, as: ChickProcessor}
            - {call: "POST /chick-batches/${cb1}/vaccinate", payload: {vaccine_code: "MAREKS_HVT"}, as: ChickProcessor}
          trigger:
            - {call: "POST /chick-batches/${cb1}/box", payload: {}, as: ChickProcessor, as_user_id: "u_proc_1"}
            - {call: "GET /breeder-flocks/${f1}", payload: {}, as: FlockManager, captures: {set_basis: "$.data.hatchability_rolling_pct", fert_basis: "$.data.hatchability_fertile_pct"}}
          assert:
            - "SetterLoad.${s1}.total_eggs_set == 10000 and SetterLoad.${s1}.fertile_count == 9600 and SetterLoad.${s1}.fertility_pct == 96.00"
            - "BreederFlock.${f1}.hatchability_rolling_pct == 92.62"
            - "BreederFlock.${f1}.hatchability_fertile_pct == 96.48"
            - "BreederFlock.${f1}.hatchability_fertile_pct > BreederFlock.${f1}.hatchability_rolling_pct"
            - "BreederFlock.${f1}.corrective_action_count == 0 because the SET_BASIS value 92.62 is not below 82.0"
            - "GET /corrective-actions with flock_id ${f1} returns total_count 0"

  - rule_id: combinatorial_formula
    instances:
      - name: flock_forecast_five_factor_product
        grounds:
          - calculations.flock_settable_forecast
          - entities.BreederFlock.fields.settable_forecast
          - entities.BreederFlock.fields.lighting_factor
          - entities.BreederFlock.fields.nutrition_factor
          - entities.FlockProgram.fields.lighting_steps
        distinguishing_aspect: |
          Mode (a) multi-variable product: settable_forecast is hen_count multiplied by five
          independently sourced factors (age tier, lighting step, feed step, SETTABLE_RATIO,
          derate), and moving the clock from 2026-08-01 to 2026-08-22 changes the age tier and the
          lighting step simultaneously, taking the value from 5754 to 5587.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z, program P1 with lighting steps 21->12.0, 24->14.0, 30->16.0 and feed steps 21->150.0, 26->168.0."
            - "Flock F1 hatch_date 2026-01-05 so age_weeks is 29 on 2026-08-01 and 32 on 2026-08-22; hen_count 9000; no corrective action so the derate is 1.0."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: HatcheryManager}
            - {call: "POST /flock-programs", payload: {code: "P1", breed: "ROSS_308", stimulation_week: 21, lighting_steps: [{age_weeks: 21, photoperiod_hours: 12.0}, {age_weeks: 24, photoperiod_hours: 14.0}, {age_weeks: 30, photoperiod_hours: 16.0}], feed_steps: [{age_weeks: 21, feed_grams_per_hen_day: 150.0}, {age_weeks: 26, feed_grams_per_hen_day: 168.0}]}, as: HatcheryManager, captures: {p1: "$.data.id"}}
            - {call: "POST /breeder-flocks", payload: {code: "F1", program_id: "${p1}", breed: "ROSS_308", house_code: "H1", hatch_date: "2026-01-05T00:00:00Z", placed_at: "2026-05-01T00:00:00Z", hen_count: 9000}, as: FlockManager, captures: {f1: "$.data.id"}}
            - {call: "POST /lab-tests", payload: {subject_type: "BREEDER_FLOCK", subject_id: "${f1}", test_code: "SALMONELLA_PULLORUM", collected_at: "2026-07-20T00:00:00Z"}, as: Veterinarian, captures: {t1: "$.data.id"}}
            - {call: "POST /lab-tests/${t1}/release", payload: {result: "NEGATIVE"}, as: Veterinarian}
          trigger:
            - {call: "POST /breeder-flocks/${f1}/start-lay", payload: {}, as: FlockManager, captures: {fc29: "$.data.settable_forecast"}}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-22T00:00:00Z"}, as: HatcheryManager}
            - {call: "POST /breeder-flocks/${f1}/recompute-forecast", payload: {}, as: FlockManager, captures: {fc32: "$.data.settable_forecast"}}
          assert:
            - "At 2026-08-01: BreederFlock.${f1}.age_weeks == 29, photoperiod_hours == 14.0, feed_grams_per_hen_day == 168.0"
            - "At 2026-08-01: BreederFlock.${f1}.production_rate_pct == 82.0, lighting_factor == 0.7900, nutrition_factor == 1.0500"
            - "At 2026-08-01: BreederFlock.${f1}.settable_forecast == 5754"
            - "At 2026-08-22: BreederFlock.${f1}.age_weeks == 32, photoperiod_hours == 16.0, production_rate_pct == 74.0, lighting_factor == 0.8500"
            - "At 2026-08-22: BreederFlock.${f1}.settable_forecast == 5587"
            - "Changing only the age tier (82.0 -> 74.0) while lighting_factor also moves (0.7900 -> 0.8500) proves both factors are applied, since an age-only change would give 5193 and a lighting-only change would give 6191"

      - name: setter_storage_delay_sum_then_ceil
        grounds:
          - calculations.incubation_pull_window
          - entities.SetterLoad.fields.weighted_age_days
          - entities.SetterLoad.fields.storage_delay_hours
          - entities.SetterLoadItem.fields.effective_age_days_at_set
          - state_machines.SetterLoad.PLANNED_to_INCUBATING
        distinguishing_aspect: |
          Mode (b) pinned rounding order: the egg-count weighted mean of two lots aged 4.50 and 5.50
          days is 4.9000, so a single ceil after the FREE_STORAGE_DAYS subtraction yields
          storage_delay_hours 2, whereas ceiling each lot's own delay first and then weighting
          yields 3 and shifts planned_pull_at by a full hour.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z."
            - "Lot L1 collected 2026-07-28T00:00:00Z (effective_age_days 4.50 when stored at 15.0 C) with settable_count 6200; lot L2 collected 2026-07-27T00:00:00Z (5.50) with settable_count 4200."
            - "Setter load S1 draws 6000 eggs from L1 and 4000 from L2, then starts at 2026-08-01T18:00:00Z under profile PR1 (transfer 456 h, total 504 h)."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /flock-programs", payload: {code: "P1", breed: "ROSS_308", stimulation_week: 21, lighting_steps: [{age_weeks: 21, photoperiod_hours: 12.0}, {age_weeks: 24, photoperiod_hours: 14.0}, {age_weeks: 30, photoperiod_hours: 16.0}], feed_steps: [{age_weeks: 21, feed_grams_per_hen_day: 150.0}, {age_weeks: 26, feed_grams_per_hen_day: 168.0}]}, as: HatcheryManager, captures: {p1: "$.data.id"}}
            - {call: "POST /breeder-flocks", payload: {code: "F1", program_id: "${p1}", breed: "ROSS_308", house_code: "H1", hatch_date: "2026-01-05T00:00:00Z", placed_at: "2026-05-01T00:00:00Z", hen_count: 9000}, as: FlockManager, captures: {f1: "$.data.id"}}
            - {call: "POST /lab-tests", payload: {subject_type: "BREEDER_FLOCK", subject_id: "${f1}", test_code: "SALMONELLA_PULLORUM", collected_at: "2026-07-20T00:00:00Z"}, as: Veterinarian, captures: {t1: "$.data.id"}}
            - {call: "POST /lab-tests/${t1}/release", payload: {result: "NEGATIVE"}, as: Veterinarian}
            - {call: "POST /breeder-flocks/${f1}/start-lay", payload: {}, as: FlockManager}
            - {call: "POST /egg-lots", payload: {flock_id: "${f1}", collected_at: "2026-07-28T00:00:00Z", collected_count: 6500}, as: FlockManager, captures: {l1: "$.data.id"}}
            - {call: "POST /egg-lots/${l1}/grade", payload: {grade_a_count: 6200, cracked_count: 150, dirty_count: 100, small_count: 50}, as: FlockManager}
            - {call: "POST /egg-lots/${l1}/store", payload: {storage_temp_c: 15.0}, as: IncubationOperator, captures: {l1v: "$.data.version"}}
            - {call: "POST /egg-lots", payload: {flock_id: "${f1}", collected_at: "2026-07-27T00:00:00Z", collected_count: 4400}, as: FlockManager, captures: {l2: "$.data.id"}}
            - {call: "POST /egg-lots/${l2}/grade", payload: {grade_a_count: 4200, cracked_count: 100, dirty_count: 60, small_count: 40}, as: FlockManager}
            - {call: "POST /egg-lots/${l2}/store", payload: {storage_temp_c: 15.0}, as: IncubationOperator, captures: {l2v: "$.data.version"}}
            - {call: "POST /incubation-units", payload: {code: "U1", unit_type: "SETTER", capacity_eggs: 20000}, as: HatcheryManager, captures: {u1: "$.data.id"}}
            - {call: "POST /incubation-units/${u1}/sanitize", payload: {}, as: IncubationOperator}
            - {call: "POST /incubation-profiles", payload: {code: "PR1", breed: "ROSS_308", transfer_hours: 456, total_hours: 504, stages: [{from_hour: 0, to_hour: 240, temp_c: 37.8, humidity_pct: 55.0}, {from_hour: 240, to_hour: 456, temp_c: 37.5, humidity_pct: 52.0}, {from_hour: 456, to_hour: 504, temp_c: 36.9, humidity_pct: 65.0}]}, as: HatcheryManager, captures: {pr1: "$.data.id"}}
            - {call: "POST /setter-loads", payload: {unit_id: "${u1}", profile_id: "${pr1}", planned_set_at: "2026-08-01T18:00:00Z"}, as: IncubationOperator, captures: {s1: "$.data.id"}}
