              as: ContractOfficer
              captures: { c_id: $.data.id }
            - call: "POST /contracts/${c_id}/submit-review"
              as: ContractOfficer
            - call: "POST /contracts/${c_id}/approve-review"
              as: ContractOfficer
            - call: "POST /contracts/${c_id}/execute"
              as: ProcurementDirector
              captures: { c_v: $.data.version }
            - call: "POST /pcards"
              payload: { department_id: "${d_id}", cardholder_name: "Pax", single_txn_limit_cents: 100000, monthly_limit_cents: 500000, allowed_mccs: [] }
              as: ProcurementAdmin
              captures: { pc_id: $.data.id, pc_v: $.data.version }
          trigger:
            - call: "POST /contracts/${c_id}/amend"
              payload: { expected_contract_version: "${c_v}", effective_start: "2026-01-01T00:00:00Z", effective_end: "2028-06-01T00:00:00Z" }
              as: ContractOfficer
              captures: { amend_id: $.data.id }
            - call: "POST /contracts/${c_id}/amend"
              payload: { expected_contract_version: "${c_v}", effective_start: "2026-01-01T00:00:00Z", effective_end: "2029-01-01T00:00:00Z" }
              as: ContractOfficer
              captures: { err1: $.data.error_id }
            - call: "PATCH /pcards/${pc_id}/limits"
              payload: { expected_pcard_version: "${pc_v}", single_txn_limit_cents: 150000 }
